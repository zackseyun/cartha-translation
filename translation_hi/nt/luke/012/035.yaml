lexical_decisions:
- source_word: Ἔστωσαν
  choice: रहें
  rationale: वर्तमानकालिक तृतीय-पुरुष आज्ञार्थक भाव को स्वाभाविक हिन्दी में निरंतर तत्पर अवस्था बनाए रखने के आग्रह के रूप में व्यक्त करता है।
- source_word: ὑμῶν
  choice: तुम्हारी / तुम्हारे
  rationale: यूनानी संबंधकारक सर्वनाम दोनों समन्वित संज्ञा-पदों के साथ अधिकार-सूचक है; हिन्दी में लिंग-वचन के अनुसार रूप बदला गया है।
- source_word: ὀσφύες
  choice: कमरें
  rationale: यह कमर अथवा कटि-प्रदेश को दर्शाता है। बहुवचन मूल पाठ के सामूहिक संबोधन और ठोस शारीरिक बिंब को बनाए रखता है।
- source_word: περιεζωσμέναι
  choice: कसी
  rationale: पूर्ण निष्क्रिय कृदंत उस अवस्था को व्यक्त करता है जिसमें लंबे वस्त्र कमर पर बांधकर सुरक्षित कर लिए गए हों। ‘कसी’ ठोस बिंब रखता है और हिन्दी में स्वाभाविक है।
- source_word: λύχνοι
  choice: दीपक
  rationale: यह अमूर्त प्रकाश नहीं, जलने वाले तेल के दीपक को सूचित करता है।
- source_word: καιόμενοι
  choice: जलते
  rationale: वर्तमान कृदंत निरंतर जलती हुई अवस्था दर्शाता है; ‘जलते रहें’ उसकी कालगत निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: तत्परता का सांस्कृतिक रूपक
  choice: मुख्य पाठ में ‘कमरें कसी रहें’ का ठोस बिंब बनाए रखना
  alternative: काम के लिए तैयार रहो / अपने वस्त्र काम के लिए तैयार रखो
  rationale: मूल पाठ लंबे वस्त्रों को कमर पर कसकर तत्पर होने का सांस्कृतिक बिंब देता है। उसे सीधे सामान्यीकृत करने के बजाय मुख्य पाठ में रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कमरें कसी रहें’ मूल रूपक को सुरक्षित रखता है; ‘कटियां बंधी रहें’ अधिक पुरातन और ‘तैयार रहो’ अधिक व्याख्यात्मक होता।
