  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ कि वह उसे अपनी सारी संपत्ति का अधिकारी नियुक्त करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀληθῶς
  choice: सच
  rationale: यह क्रियाविशेषण कथन की सत्यता और गंभीरता पर बल देता है। ‘सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक होते हुए उसका बल बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यह सीधे संबोधन का प्रचलित सूत्र है। ‘तुमसे’ बहुवचन श्रोताओं को संबोधित करता है और हिन्दी में स्वाभाविक है।
- source_word: ὅτι
  choice: कि
  rationale: यह कही गई बात की विषय-वस्तु का परिचय देता है।
- source_word: ἐπὶ
  choice: पर
  rationale: दत्तिव के साथ यहाँ यह अधिकार अथवा देखरेख का भाव व्यक्त करता है; ‘पर नियुक्त करेगा’ हिन्दी में किसी को अधिकार सौंपने का स्पष्ट और संक्षिप्त ढंग है।
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: अपनी सारी संपत्ति
  rationale: यह पदबंध उस सबको सूचित करता है जो स्वामी का है। ‘सारी संपत्ति’ व्यापक, सहज और प्रसंगानुकूल है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: καταστήσει
  choice: नियुक्त करेगा
  rationale: इस प्रसंग में भविष्यत्कालीन क्रिया किसी को अधिकार और उत्तरदायित्व के पद पर ठहराने का अर्थ देती है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह निकटवर्ती दृष्टांत के पुरुष सेवक अथवा भंडारी की ओर संकेत करने वाला पुल्लिंग एकवचन कर्म है; हिन्दी का ‘उसे’ प्रसंग में वही संदर्भ बनाए रखता है।
theological_decisions:
- issue: दृष्टांत में पुरुष एकवचन पात्र का संदर्भ
  choice: ‘वह’ और ‘उसे’ बनाए रखना
  alternative: लिंग-निरपेक्ष रूप, जैसे ‘उस व्यक्ति को’
  rationale: यूनानी पाठ पुरुष एकवचन रूपों से दृष्टांत के पुरुष पात्र और उसके स्वामी को संदर्भित करता है। हिन्दी सर्वनाम अपने रूप में लिंग नहीं दिखाते, फिर भी एकवचन व्यक्तिगत संदर्भ को ज्यों का त्यों रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सच कहता हूँ’ यीशु के गंभीर कथन-सूत्र का स्वाभाविक हिन्दी रूप है; ‘नियुक्त करेगा’ सौंपे गए अधिकार को स्पष्ट करता है।
