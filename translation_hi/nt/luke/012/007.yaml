source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: hi
  text: बल्कि तुम्हारे सिर के सारे बाल भी गिने हुए हैं। मत डरो; तुम बहुत-सी गौरैयों से अधिक मूल्यवान हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: परन्तु ... भी
  rationale: ἀλλά पिछले विचार से विरोध-संबंध जोड़ता है और καί आश्वासन को बल देता है; हिन्दी में विभाजित संरचना स्वाभाविक है।
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: तुम्हारे सिर के सारे बाल
  rationale: मूल के ठोस बिंब और πᾶσαι की समग्रता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἠρίθμηνται
  choice: गिने हुए हैं
  rationale: पूर्ण निष्क्रिय रूप किसी पूरी की गई गिनती के वर्तमान परिणाम को व्यक्त करता है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: μὴ φοβεῖσθε
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का सीधा, बहुवचन और स्वाभाविक हिन्दी रूप।
- source_word: πολλῶν στρουθίων
  choice: बहुत-सी गौरैयों
  rationale: तत्कालीन संदर्भ में στρουθίον गौरैया को सूचित करता है; वही पक्षी-संबंधी निरंतरता रखी गई है।
- source_word: διαφέρετε
  choice: अधिक मूल्यवान हो
  rationale: इस संदर्भ में क्रिया तुलनात्मक महत्त्व या मूल्य व्यक्त करती है, केवल भिन्नता नहीं।
theological_decisions:
- issue: मनुष्यों और गौरैयों के तुलनात्मक मूल्य का कथन
  choice: तुम बहुत-सी गौरैयों से अधिक मूल्यवान हो
  alternative: तुम बहुत-सी गौरैयों से बढ़कर हो
  rationale: यह पाठ के कम से अधिक की ओर दिए गए आश्वासन को स्पष्ट करता है, पर उससे आगे कोई व्यापक दार्शनिक या सांप्रदायिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। आश्वासन का संबंध स्पष्ट करने के लिए μὴ φοβεῖσθε से पहले ‘इसलिए’ लगाया गया है, जो संदर्भगत निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
