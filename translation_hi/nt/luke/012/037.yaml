source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: hi
  text: धन्य हैं वे दास[a], जिन्हें स्वामी[b], जब वह आएगा, जागते हुए पाएगा। मैं तुमसे सच कहता हूँ, वह सेवा के लिए अपनी कमर कसेगा[c], उन्हें भोजन के लिए बैठाएगा[d], और उनके पास आकर उनकी सेवा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ के लिए यूनानी शब्द अधीन और बंधी हुई घरेलू स्थिति का बोध कराता है; इसका अनुवाद ‘सेवक’ या ‘गुलाम’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द κύριος का अनुवाद ‘प्रभु’ भी हो सकता है। यहाँ घराने के दृष्टान्त में ‘स्वामी’ तत्काल अर्थ है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘अपनी कमर कसेगा’—अर्थात ढीले वस्त्र बाँधकर काम या सेवा के लिए तैयार होगा।
    reason: cultural_note
  - marker: d
    text: शाब्दिक रूप से, ‘उन्हें टिककर लेटाएगा’; प्राचीन भोज में लोग मेज़ के पास टिककर या लेटकर खाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य
  rationale: यह यीशु के गंभीर आशीर्वचन की धार्मिक और साहित्यिक गरिमा बनाए रखता है; ‘सुखी’ केवल मनोदशा और ‘भाग्यशाली’ केवल परिस्थिति का बोध करा सकता है।
- source_word: δοῦλοι
  choice: दास
  rationale: घराने के पदानुक्रम और स्वामी के अधीन स्थिति को स्पष्ट रखता है। आधुनिक हिन्दी में ‘गुलाम’ अनावश्यक रूप से कठोर या केवल ऐतिहासिक दासता-केंद्रित सुनाई दे सकता है, जबकि ‘सेवक’ बंधी हुई अधीनता को हल्का कर देता है।
- source_word: κύριος
  choice: स्वामी
  rationale: तत्काल दृष्टान्त में घर लौटने वाला व्यक्ति अपने दासों का स्वामी है। यूनानी शब्द ‘प्रभु’ भी हो सकता है, इसलिए उस व्यापक अनुगूँज को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: γρηγοροῦντας
  choice: जागते हुए
  rationale: मूल क्रिया का प्रत्यक्ष अर्थ जागते रहना है और प्रसंग में तत्परता तथा चौकसी भी निहित है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के बलपूर्ण कथन-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περιζώσεται
  choice: सेवा के लिए कमर कसेगा
  rationale: कमर कसने की मूल सांस्कृतिक छवि और सेवा के उद्देश्य—दोनों को बनाए रखता है।
- source_word: ἀνακλινεῖ αὐτούς
  choice: उन्हें भोजन के लिए बैठाएगा
  rationale: क्रिया भोजन के समय टिककर या लेटकर खाने की मुद्रा का संकेत देती है; आधुनिक हिन्दी में स्वाभाविक अर्थ दिया गया है और ऐतिहासिक मुद्रा पादटिप्पणी में स्पष्ट की गई है।
- source_word: παρελθὼν
  choice: पास आकर
  rationale: सेवा करते हुए उनके निकट आने या उनके बीच से जाने की गति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: διακονήσει αὐτοῖς
  choice: उनकी सेवा करेगा
  rationale: यहाँ विशेष रूप से भोजन परोसने सहित व्यावहारिक सेवा का भाव है; सामान्य हिन्दी पद मूल के आश्चर्यजनक भूमिकापलट को स्पष्ट रखता है।
theological_decisions:
- issue: κύριος का दृष्टान्तगत और सम्भावित मसीही अर्थ
  choice: मुख्य पाठ में ‘स्वामी’, पादटिप्पणी में ‘प्रभु’
  alternative: मुख्य पाठ में ‘प्रभु’
  rationale: घराने के तत्काल दृश्य में ‘स्वामी’ सबसे स्वाभाविक है, पर κύριος की ‘प्रभु’ वाली सम्भावित अनुगूँज को हटाया नहीं गया; पादटिप्पणी दोनों स्तरों को खुला रखती है।
- issue: δοῦλοι की सामाजिक अधीनता
  choice: दास
  alternative: सेवक; गुलाम
  rationale: ‘दास’ स्वामी के अधीन बंधी स्थिति को बनाए रखता है, फिर भी आधुनिक हिन्दी में ‘गुलाम’ से जुड़ी अतिरिक्त ऐतिहासिक और भावात्मक विशिष्टता को अनिवार्य नहीं बनाता।
- issue: स्वामी द्वारा दासों की सेवा का भूमिकापलट
  choice: सीधे शब्दों में ‘उनकी सेवा करेगा’
  alternative: ‘उनकी आवभगत करेगा’ या इसे केवल भोज-सत्कार के रूप में सीमित करना
  rationale: मूल में διακονήσει व्यापक सेवा का शब्द है, यद्यपि भोज का प्रसंग प्रबल है। सीधा अनुवाद कथन की विस्मयकारी और धर्मवैचारिक तीव्रता को बिना व्याख्यात्मक सीमा लगाए बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की आश्चर्यजनक उलटबाँसी—स्वामी का दासों की सेवा करना—ज्यों की त्यों रखी गई है। ‘लौटकर’ आगमन को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि समयगत अर्थ ‘जब वह आए’ के बराबर है।
