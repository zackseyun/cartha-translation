id: LUK.12.13
reference: Luke 12:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: hi
  text: तब भीड़ में से किसी ने उससे कहा, “गुरु, मेरे भाई से कहिए कि वह विरासत मेरे साथ बाँटे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: तब ... कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग की स्वाभाविक प्रगति दिखाता है, बिना प्रबल विरोध का भाव जोड़े।
- source_word: τις ἐκ τοῦ ὄχλου
  choice: भीड़ में से किसी ने
  rationale: यह किसी अनिर्दिष्ट व्यक्ति को भीड़ के बीच से बोलते हुए दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सम्बोधन का अप्रत्यक्ष कर्म यीशु है; हिन्दी में ‘उससे कहा’ सहज रूप है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यह शिक्षक के लिए सम्बोधन है; ‘गुरु’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी में बोधगम्य है।
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: मेरे भाई से कहिए
  rationale: आज्ञार्थक रूप यहाँ यीशु से विनम्र अनुरोध के रूप में आता है; ‘कहिए’ हिन्दी में उपयुक्त आदरसूचक रूप है।
- source_word: μερίσασθαι
  choice: बाँटे
  rationale: मध्यवाच्य अनन्त रूप का अर्थ हिस्सों में बाँटना या वितरण करना है; विरासत के प्रसंग में ‘बाँटे’ स्वाभाविक है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: μετά सम्बन्ध या सहभागिता व्यक्त करता है; ‘मेरे साथ’ यूनानी अभिव्यक्ति की अस्पष्टता बनाए रखता है और ‘हम दोनों के बीच’ जैसी व्याख्या नहीं जोड़ता।
- source_word: τὴν κληρονομίαν
  choice: विरासत
  rationale: यह उत्तराधिकार में मिली संपत्ति या सम्पदा को व्यापक रूप से दर्शाता है; ‘विरासत’ सामान्य और सटीक हिन्दी शब्द है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में आदरसूचक ‘कहिए’ रखा गया है। वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी हिन्दी में आवश्यक नहीं रही, क्योंकि ‘मेरे साथ बाँटे’ मूल के प्रमुख शाब्दिक विकल्प को सीधे सुरक्षित रखता है।
