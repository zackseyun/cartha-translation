lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: और ... क्यों
  rationale: यह पदबंध पिछले कथन से जोड़ते हुए एक दबावपूर्ण आलंकारिक प्रश्न प्रस्तुत करता है। आधुनिक हिन्दी में ‘और ... क्यों’ इसके संयोजक और प्रश्नात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀφ’ ἑαυτῶν
  choice: तुम स्वयं ही
  rationale: यह अपने विवेक या अपनी पहल से निर्णय करने का भाव रखता है। ‘स्वयं ही’ उस स्वतंत्र व्यक्तिगत परख को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐ κρίνετε
  choice: नहीं परखते
  rationale: κρίνω यहाँ मूल्यांकन करके निर्णय पहचानने के अर्थ में है। ‘परखते’ न्यायिक अर्थ तक सीमित हुए बिना इस विवेकपूर्ण मूल्यांकन को स्पष्ट करता है।
- source_word: τὸ δίκαιον
  choice: क्या उचित है
  rationale: नपुंसकलिंग विशेषण यहाँ संज्ञा के रूप में ‘उचित/न्यायसंगत बात’ को दर्शाता है। ‘क्या उचित है’ नैतिक और व्यावहारिक दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: τὸ δίκαιον का अर्थ-क्षेत्र
  choice: क्या उचित है
  alternative: क्या न्यायसंगत है; सही बात क्या है
  rationale: सन्दर्भ में नैतिक और व्यावहारिक विवेक दोनों सम्मिलित हो सकते हैं। ‘उचित’ अर्थ को केवल कानूनी न्याय तक सीमित नहीं करता, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
