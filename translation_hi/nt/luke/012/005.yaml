source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: hi
  text: 'पर मैं तुम्हें दिखाऊँगा कि तुम्हें किससे डरना चाहिए: उससे डरो, जिसके पास मार डालने के बाद गेहन्ना[a] में फेंक देने का अधिकार है। हाँ, मैं तुमसे कहता हूँ, उसी से डरो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नरक’। यूनानी शब्द ‘गेहन्ना’ है, जो न्याय का एक शब्द है और हिन्नोम की घाटी के बिंब से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: मैं तुम्हें बताऊँगा
  rationale: भविष्यकालीन क्रिया यहाँ यह बताती है कि यीशु स्पष्ट रूप से निर्देश देने जा रहे हैं। ‘बताऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और संकेत करके समझाने का भाव रखता है।
- source_word: τίνα φοβηθῆτε
  choice: तुम्हें किससे डरना चाहिए
  rationale: अप्रत्यक्ष प्रश्न को सहज हिन्दी में व्यक्त करता है और यूनानी वाक्य का निर्देशात्मक बल बनाए रखता है।
- source_word: φοβήθητε
  choice: डरो
  rationale: आज्ञार्थक रूप की गंभीरता और पद में इसकी पुनरावृत्ति को सीधे सुरक्षित रखता है; ‘श्रद्धा करो’ इस न्याय-संदर्भ में पर्याप्त नहीं है।
- source_word: τὸν
  choice: उससे
  rationale: संज्ञा के समान प्रयुक्त यूनानी निश्चित लेख को हिन्दी में स्वाभाविक सर्वनाम से व्यक्त किया गया है। संदर्भ व्यक्ति की पहचान स्पष्ट करता है, पर उसे मुख्य पाठ में नाम नहीं देता।
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: मार डालने के बाद
  rationale: μετά के साथ आर्टिक्युलर इनफिनिटिव की कालानुक्रमिकता को स्पष्ट और संक्षिप्त ढंग से दर्शाता है।
- source_word: ἔχοντα ἐξουσίαν
  choice: जिसके पास ... अधिकार है
  rationale: ἐξουσία को केवल सामर्थ्य नहीं, वैध अधिकार के रूप में व्यक्त करता है।
- source_word: ἐμβαλεῖν εἰς
  choice: में डालने
  rationale: लक्ष्य की ओर फेंकने या डालने का अर्थ रखता है; हिन्दी में ‘डालने’ गंभीर संदर्भ में स्वाभाविक है और अनावश्यक पुरातनता से बचता है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: यूनानी न्याय-संबंधी शब्द का लिप्यंतरण उसके यहूदी सांस्कृतिक और हिन्नोम की घाटी से जुड़े बिंब को सुरक्षित रखता है; अधिक व्याख्यात्मक ‘नरक’ पादटिप्पणी में दिया गया है।
- source_word: ναί
  choice: हाँ
  rationale: वक्ता की जोरदार पुष्टि को सरल आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῦτον
  choice: उसी से
  rationale: संकेतवाचक सर्वनाम के विशेष बल को ‘उसी’ द्वारा सुरक्षित रखता है, जो साधारण ‘उससे’ से अधिक जोरदार है।
theological_decisions:
- issue: न्याय के संदर्भ में γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मुख्य पाठ में मूल न्याय-संबंधी शब्द को बनाए रखने से बाद की व्यापक धर्मवैज्ञानिक धारणाएँ स्वतः आरोपित नहीं होतीं। हिन्दी पाठकों के लिए प्रचलित कार्यात्मक समानार्थी ‘नरक’ को पादटिप्पणी में रखा गया है।
- issue: जिससे डरना है उसकी पहचान
  choice: स्रोत की तरह अप्रत्यक्ष—‘उससे/उसी से’
  alternative: स्पष्ट रूप से ‘परमेश्वर से’
  rationale: संदर्भ प्रबल रूप से परमेश्वर की ओर संकेत करता है, किंतु इस पद का यूनानी पाठ नाम नहीं लेता। अनुवाद उसी अप्रत्यक्षता और व्याख्यात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘तुम’ संबोधन यूनानी बहुवचन ὑμῖν के अनुरूप सामूहिक श्रोताओं को संबोधित करता है। मुख्य पाठ में [a] चिह्न संबंधित शब्द के तुरंत बाद रखा गया है।
