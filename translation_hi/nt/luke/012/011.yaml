review_pass:
  verdict: revise
  source_fidelity: ‘जब’ is acceptable in context, but ‘जब भी’ better represents the indefinite future contingency of ὅταν. The draft’s ‘किन शब्दों में’ is a defensible idiomatic interpretation of τί in a forensic context, yet it narrows the Greek ‘what’ and is best replaced with wording that retains both ‘how’ and ‘what’ while naturally expressing ἀπολογήσησθε.
  naturalness: The register is modern, clear, and appropriate. ‘आराधनालय’ and ‘अपना बचाव’ are natural in biblical and judicial Hindi. ‘कैसे या क्या कहकर अपना बचाव करोगे’ is smoother and more source-transparent than ‘कैसे या किन शब्दों में करोगे.’
  terminology: ‘आराधनालयों,’ ‘शासकों,’ and ‘अधिकारियों’ preserve the three source terms without unwarranted institutional specification. ‘अपना बचाव’ appropriately conveys the forensic sense of ἀπολογήσησθε.
  issues:
  - severity: low
    issue: Indefinite contingency is not fully explicit.
    rationale: ὅταν normally denotes ‘whenever’; Hindi ‘जब भी’ expresses this more precisely than the simple ‘जब’ without making the sentence unnatural.
  - severity: medium
    issue: ‘किन शब्दों में’ narrows τί (‘what’) to verbal formulation.
    rationale: The Greek retains a broad paired question, ‘how or what,’ in connection with making a defense. ‘क्या कहकर’ preserves the content component while fitting Hindi legal expression.
  - severity: low
    issue: Footnote a does not reflect the revised, source-faithful phrasing.
    rationale: The lexical-alternative note should state a formal alternative that includes the defense sense and both interrogatives.
  revised_text: पर जब भी वे तुम्हें आराधनालयों, शासकों और अधिकारियों के सामने ले जाएँ, तो इस बात की चिंता मत करना कि तुम अपना बचाव कैसे या क्या कहकर करोगे, अथवा क्या कहोगे;[b]
