  to: पर जब भी वे तुम्हें आराधनालयों, शासकों और अधिकारियों के सामने ले जाएँ, तो इस बात की चिंता मत करना कि तुम अपना बचाव कैसे या क्या कहकर करोगे, अथवा क्या कहोगे;[b]
