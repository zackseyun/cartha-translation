source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: hi
  text: पर जब भी वे तुम्हें आराधनालयों, शासकों और अधिकारियों के सामने ले जाएँ, तो इस बात की चिंता मत करना कि तुम अपना बचाव कैसे या क्या कहकर करोगे, अथवा क्या कहोगे;[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “आराधनालयों, शासकों और अधिकारियों” से धार्मिक और नागरिक निकायों का संकेत मिलता है, जिनके सामने शिष्यों से पूछताछ की जा सकती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ὅταν δὲ
  choice: पर जब
  rationale: ὅταν भविष्य की अनिश्चित परिस्थिति को व्यक्त करता है; हिन्दी में ‘जब’ प्रसंगानुकूल और स्वाभाविक है। δέ के हल्के विरोधात्मक/संक्रमणकारी भाव को ‘पर’ से रखा गया है।
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: वे तुम्हें ... ले जाएँ
  rationale: न्यायिक प्रसंग में क्रिया का अर्थ किसी व्यक्ति को पूछताछ या सुनवाई के लिए अधिकारियों के सामने ले जाना है।
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: आराधनालयों, शासकों और अधिकारियों के सामने
  rationale: ἐπί + कर्मकारक यहाँ न्यायिक उपस्थिति का भाव देता है। तीनों पदों का भेद बनाए रखा गया है; συναγωγάς का शाब्दिक रूप रखा गया है, यद्यपि प्रसंग में उससे आराधनालय से जुड़ी परिषद भी सूचित हो सकती है।
- source_word: μὴ μεριμνήσητε
  choice: चिंता मत करना
  rationale: यह निषेध व्याकुल होकर पहले से सोचते रहने के विरुद्ध है; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: तुम अपना बचाव कैसे या किन शब्दों में करोगे
  rationale: πῶς और τί दोनों को व्यक्त किया गया है। ἀπολογήσησθε के न्यायिक अर्थ को ‘अपना बचाव ... करोगे’ से रखा गया है, जबकि ‘किन शब्दों में’ हिन्दी में τί को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἢ τί εἴπητε
  choice: अथवा क्या कहोगे
  rationale: यह पिछली बचाव-संबंधी अभिव्यक्ति के बाद सामान्य रूप से कही जाने वाली बात की विषयवस्तु को अलग से बनाए रखता है।
