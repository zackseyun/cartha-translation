  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आराधनालय’ हिन्दी बाइबिलीय प्रयोग में परिचित है। मूल के कानूनी प्रसंग और ‘कैसे या क्या’ के दोहरे प्रश्न को बिना धर्मसिद्धान्तगत विस्तार के सुरक्षित रखा गया है।
