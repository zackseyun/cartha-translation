source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: hi
  text: और तुम उन लोगों के समान बनो जो अपने स्वामी की प्रतीक्षा कर रहे हैं कि वह विवाह-भोज से कब लौटे, ताकि जब वह आकर द्वार खटखटाए, तो वे तुरन्त उसके लिए द्वार खोल दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριον
  choice: स्वामी
  rationale: यहाँ घरेलू सेवकों के संबंध में κύριος का अर्थ उनके स्वामी से है; ‘प्रभु’ संभावित धार्मिक संकेत को अनावश्यक रूप से प्रमुख कर सकता है।
- source_word: ἀναλύσῃ
  choice: लौटे
  rationale: इस प्रसंग में क्रिया का आशय विवाह-भोज से प्रस्थान करके वापस आना है; स्वाभाविक हिन्दी में ‘लौटे’ उपयुक्त है।
- source_word: ἐκ τῶν γάμων
  choice: विवाह-भोज से
  rationale: बहुवचन γάμοι विवाह के उत्सव या भोज को सूचित कर सकता है; प्रसंग में भोज से लौटना अभिप्रेत है।
- source_word: κρούσαντος
  choice: द्वार खटखटाए
  rationale: यूनानी में वस्तु व्यक्त नहीं है, पर हिन्दी में ‘द्वार’ जोड़ना क्रिया का स्वाभाविक और संदर्भ-स्पष्ट प्रयोग है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: मूल की तात्कालिकता को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: κύριος के अनुवाद में धार्मिक उपाधि या घरेलू संबंध
  choice: स्वामी
  alternative: प्रभु
  rationale: दृष्टान्त के प्रत्यक्ष दृश्य में सेवक अपने घर के स्वामी की प्रतीक्षा करते हैं। ‘स्वामी’ इस अर्थ को बनाए रखता है, जबकि व्यापक मसीही संकेत पाठक के लिए खुला रहता है।
- issue: γάμοι का आशय
  choice: विवाह-भोज
  alternative: विवाह
  rationale: स्वामी किसी विवाह-उत्सव से लौट रहा है; ‘विवाह-भोज’ आधुनिक हिन्दी में उस सामाजिक अवसर को अधिक स्पष्टता से व्यक्त करता है, बिना किसी विशिष्ट अन्तकालीन विवाह-भोज की पहचान आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘उन लोगों’ समावेशी सामान्य अभिव्यक्ति है और ἀνθρώποις का अनावश्यक रूप से पुरुष-विशिष्ट अनुवाद नहीं करती।
