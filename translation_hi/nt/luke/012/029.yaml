  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: hi
  text: और तुम यह न खोजते रहो कि क्या खाओ और क्या पियो, और व्याकुल न हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चिंतित न हो,’ ‘अस्थिर न हो’; अधिक शाब्दिक भाव, ‘अनिश्चितता में न झूलते रहो।’
    reason: μετεωρίζεσθε के मानसिक व्याकुलता, अस्थिरता और अधर या अनिश्चितता में रहने से जुड़े अर्थ-विस्तार को दिखाने के लिए।
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है। वाक्य के आरम्भ में ‘और तुम’ रखने से इस बल को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ζητεῖτε
  choice: इस खोज में न लगे रहो
  rationale: ζητέω का मूल भाव ‘खोजना/पाने का प्रयत्न करना’ है। यह वाक्यांश वर्तमान निषेध के निरन्तर, व्यग्र प्रयत्न के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τί φάγητε καὶ τί πίητε
  choice: कि क्या खाओ और क्या पियो
  rationale: यह भोजन और पेय के विषय में खुली या विचारात्मक अनिश्चितता व्यक्त करता है। ‘क्या खाओ और क्या पियो’ यूनानी समानांतर रचना और दोहराए गए καί को बनाए रखता है।
- source_word: μετεωρίζεσθε
  choice: व्याकुल न हो
  rationale: यह दुर्लभ क्रिया मानसिक अस्थिरता, अनिश्चितता में झूलने या चिंता से व्याकुल होने का भाव रखती है। ‘व्याकुल’ प्रसंग में स्वाभाविक है, पर शब्द को केवल सामान्य ‘चिंता’ तक सीमित नहीं करता।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... और
  rationale: बार-बार आए καί की संचयी लय और यूनानी समन्वय को हिन्दी में यथासम्भव सुरक्षित रखा गया है।
theological_decisions:
- issue: भोजन-पेय की खोज के निषेध का आशय
  choice: भौतिक आवश्यकताओं को लेकर व्यग्र खोज और मानसिक व्याकुलता का निषेध
  alternative: भोजन-पेय की साधारण योजना बनाने का पूर्ण निषेध या शारीरिक आवश्यकताओं के प्रति उदासीनता की आज्ञा
  rationale: आसपास का प्रसंग आवश्यकताओं को लेकर चिंता से सम्बद्ध है। अनुवाद आज्ञा की तीव्रता को बनाए रखता है, पर इसमें तपस्वी या भौतिक-विरोधी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध संबोधन। ‘तुम’ सामूहिक द्वितीय पुरुष को दर्शाता है।
