source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: hi
  text: और तुममें से कौन चिंता करके अपनी आयु में एक हाथ भी बढ़ा सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“आयु” के लिए प्रयुक्त यूनानी शब्द का अर्थ “कद” भी हो सकता है; इसलिए अनुवाद हो सकता है: “अपने कद में एक हाथ भी बढ़ा सकता है?” एक हाथ लगभग आधा मीटर की लंबाई थी।'
    reason: मूल यूनानी ἡλικία की वास्तविक शब्दगत अस्पष्टता और πῆχυς की प्राचीन माप को स्पष्ट करना।
lexical_decisions:
- source_word: μεριμνῶν
  choice: चिंता करके
  rationale: यह वर्तमान कृदंत चिंता करने की क्रिया/साधन को व्यक्त करता है; सरल और स्वाभाविक हिन्दी में यही अर्थ स्पष्ट है।
- source_word: ἡλικίαν
  choice: आयु
  rationale: ἡλικία का अर्थ ‘आयु’ या ‘कद’ हो सकता है। निकटवर्ती प्रसंग में जीवन की चिंता और जीवन बढ़ाने की असमर्थता के कारण ‘आयु’ मुख्य पाठ में अधिक स्वाभाविक है, पर वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: πῆχυν
  choice: एक हाथ
  rationale: πῆχυς कोहनी से उँगलियों के सिरे तक की प्राचीन लंबाई की माप है। हिन्दी में पारंपरिक और सुबोध समतुल्य ‘हाथ’ है; आयु के साथ इसका प्रयोग जानबूझकर रूपकात्मक है।
- source_word: δύναται ... προσθεῖναι
  choice: बढ़ा सकता है
  rationale: क्षमता और जोड़ने/बढ़ाने—दोनों भावों को स्वाभाविक हिन्दी में संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: ἡλικία और πῆχυς के संयुक्त वाक्यांश का अर्थ
  choice: अपनी आयु में एक हाथ भी बढ़ा सकता है
  alternative: अपने कद में एक हाथ भी बढ़ा सकता है
  rationale: मूल में ‘आयु/कद’ की अर्थगत अस्पष्टता है। लूका 12:22–26 में जीवन और चिंता का प्रसंग ‘आयु’ का समर्थन करता है, जबकि लंबाई की माप ‘हाथ’ वैकल्पिक ‘कद’ अर्थ को संभव बनाती है। मुख्य पाठ प्रसंगानुकूल अर्थ रखता है और पादटिप्पणी दूसरे वास्तविक अर्थ को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुममें से’ है। प्रश्न की अलंकारिक तीक्ष्णता और मूल की ‘एक हाथ’ वाली ठोस माप को बनाए रखा गया है।
