  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: hi
  text: 'और मैं तुमसे कहता हूँ: जो कोई लोगों के सामने मुझे स्वीकार करेगा[a], मनुष्य का पुत्र भी परमेश्वर के स्वर्गदूतों के सामने उसे स्वीकार करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वीकार करेगा’ का अर्थ यहाँ लोगों के सामने खुलकर मानना या अंगीकार करना है। यूनानी में दोनों बार एक ही क्रिया आई है।
    reason: lexical_clarification
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: और मैं तुमसे कहता हूँ
  rationale: δέ यहाँ हल्का संयोजक है; ‘और’ पिछले कथन से स्वाभाविक संबंध बनाए रखता है और अनावश्यक विरोध नहीं जोड़ता। वर्तमानकालीन λέγω को हिन्दी की स्वाभाविक गंभीर उद्घोषणा ‘मैं तुमसे कहता हूँ’ से व्यक्त किया गया है।
- source_word: πᾶς ὃς ἂν
  choice: जो कोई
  rationale: यह अनिश्चित सामान्य शर्त और व्यापक समावेश व्यक्त करता है; आधुनिक हिन्दी में ‘जो कोई’ स्वाभाविक और स्पष्ट है।
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: स्वीकार करेगा … स्वीकार करेगा
  rationale: ὁμολογέω यहाँ सार्वजनिक रूप से किसी को मानने या स्वीकार करने का भाव रखता है। दोनों स्थानों पर एक ही हिन्दी क्रिया रखने से मानवीय स्वीकार और मनुष्य के पुत्र के प्रत्युत्तर के बीच की समानता सुरक्षित रहती है।
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: मुझे … उसे
  rationale: ὁμολογέω के साथ ἐν + दत्तिवाचक का शाब्दिक हिन्दी रूप अस्वाभाविक होगा। कर्मवाचक ‘मुझे/उसे स्वीकार करेगा’ सम्बन्धित व्यक्ति की सार्वजनिक स्वीकृति को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: ἔμπροσθεν का अर्थ ‘के सामने/उपस्थिति में’ है। यहाँ ἀνθρώπων सामान्य रूप से मानव समुदाय को सूचित करता है, इसलिए ‘लोगों’ आधुनिक हिन्दी में उसके प्रतिनिधिक और समावेशी अर्थ को ठीक व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की विशिष्ट आत्म-उपाधि है और दानिय्येल-संबंधी प्रतिध्वनि रखती है; स्थापित हिन्दी रूप इसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: परमेश्वर के स्वर्गदूतों के सामने
  rationale: यह सीधा अनुवाद स्वर्गीय उपस्थिति में सार्वजनिक स्वीकृति के गंभीर दृश्य को बनाए रखता है।
theological_decisions:
- issue: ἐν + दत्तिवाचक के साथ पारस्परिक स्वीकारोक्ति
  choice: ‘मुझे स्वीकार करेगा … उसे स्वीकार करेगा’
  alternative: ‘मुझमें अंगीकार करेगा … उसमें अंगीकार करेगा’ अथवा ‘मेरा अंगीकार करेगा … उसका अंगीकार करेगा’
  rationale: शाब्दिक ‘मुझमें/उसमें’ हिन्दी में अस्पष्ट और अप्राकृतिक है। चुना गया रूप सार्वजनिक स्वीकृति का मुख्य अर्थ और दोनों खंडों की पारस्परिकता बनाए रखता है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
- issue: ἀνθρώπων का लिंग और व्यापकता
  choice: ‘लोगों’
  alternative: ‘मनुष्यों’ अथवा ‘पुरुषों’
  rationale: यूनानी संज्ञा यहाँ सामान्य मानव समुदाय के लिए प्रयुक्त है, केवल वयस्क पुरुषों के लिए नहीं। ‘लोगों’ स्रोत के आशय को आधुनिक हिन्दी में सबसे स्वाभाविक रूप से व्यक्त करता है।
- issue: ‘मनुष्य का पुत्र’ की उपाधि
  choice: उपाधि को ज्यों का त्यों अनूदित रखना
  alternative: इसे ‘मैं’ कहकर स्पष्ट करना
  rationale: ‘मैं’ अर्थगत संदर्भ बता सकता है, पर मूल की विशिष्ट आत्म-उपाधि और उसके धर्मवैचारिक तथा शास्त्रीय संकेतों को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लोगों के सामने’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘मनुष्य का पुत्र’ जैसी महत्त्वपूर्ण शास्त्रीय उपाधि को औपचारिक रूप में सुरक्षित रखा गया है।
