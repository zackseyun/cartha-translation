  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: hi
  text: पर जो मनुष्यों के सामने मुझे नकारता है, वह परमेश्वर के स्वर्गदूतों के सामने नकारा जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह अस्वीकार किया जाएगा”; यूनानी में यहाँ पहले आए “नकारता है” से संबंधित, किंतु अधिक प्रबल हो सकने वाली क्रिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνησάμενός με
  choice: जो ... मुझे नकारता है
  rationale: लेखयुक्त कृदंत व्यक्ति को सूचित करता है और इस सामान्य सिद्धांत को आधुनिक हिन्दी में स्वाभाविक वर्तमान काल से व्यक्त किया गया है। ‘मुझे नकारता है’ प्रत्यक्ष कर्म को बनाए रखता है और अगले क्रियापद के साथ शब्दगत समानता भी सुरक्षित रखता है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह सार्वजनिक उपस्थिति और साक्षी के भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों
  rationale: यहाँ शब्द समस्त मानव-समुदाय को सूचित करता है और ‘परमेश्वर के स्वर्गदूतों’ के साथ मूल पाठ का विरोध बनाए रखता है; हिन्दी में ‘मनुष्यों’ का प्रयोग लिंग-समावेशी है।
- source_word: ἀπαρνηθήσεται
  choice: नकारा जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए यह पहले आए ‘नकारता है’ के साथ गंभीर पारस्परिक समानता सुरक्षित रखता है। उपसर्गयुक्त यूनानी क्रिया में अधिक प्रबल अस्वीकार का भाव हो सकता है, जिसे पादटिप्पणी में दर्शाया गया है।
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: यह संबंधकारक पदबंध का स्पष्ट और स्वाभाविक अनुवाद है तथा स्वर्गीय सभा का संदर्भ बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में स्वीकार करने के कथन के साथ स्पष्ट विरोध दर्शाता है।
theological_decisions:
- issue: ‘नकारा जाएगा’ में कर्ता की पहचान
  choice: कर्मवाच्य को यथावत रखा गया है और किसी कर्ता का नाम नहीं जोड़ा गया।
  alternative: ‘मनुष्य का पुत्र उसे नकार देगा’ या ‘परमेश्वर उसे नकार देगा।’
  rationale: यूनानी पाठ में कर्मवाच्य क्रिया है, पर कार्य करने वाले का स्पष्ट उल्लेख नहीं है। निकट संदर्भ से पाठक मनुष्य के पुत्र या परमेश्वर को समझ सकते हैं, किंतु पद स्वयं इस प्रश्न को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जो ... वह ...’ की रचना यूनानी के व्यक्तिवाचक कृदंत को स्वाभाविक हिन्दी में व्यक्त करती है; अनाम कर्मवाच्य जानबूझकर सुरक्षित रखा गया है।
