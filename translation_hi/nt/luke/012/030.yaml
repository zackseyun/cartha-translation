id: LUK.12.30
reference: Luke 12:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: hi
  text: क्योंकि संसार के राष्ट्र इन सब वस्तुओं की खोज में लगे रहते हैं,[a] पर तुम्हारा पिता जानता है कि तुम्हें इनकी आवश्यकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार के अन्यजाति लोग।” यूनानी शब्द का अर्थ “राष्ट्र” अथवा “अन्यजाति लोग” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: इन सब वस्तुओं
  rationale: यह पदबंध पिछले संदर्भ में भोजन, पेय और वस्त्र जैसी आवश्यक वस्तुओं की ओर संकेत करता है। ‘इन सब वस्तुओं’ से उसका बहुवचन और स्पष्ट संदर्भ बना रहता है।
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: संसार की जातियाँ
  rationale: ἔθνη का अर्थ ‘जातियाँ/राष्ट्र’ या प्रसंगानुसार ‘गैर-यहूदी लोग’ हो सकता है। मुख्य पाठ में अपेक्षाकृत शाब्दिक और व्यापक अर्थ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐπιζητοῦσιν
  choice: खोज में लगी रहती हैं
  rationale: यह अभिव्यक्ति सक्रिय और निरंतर प्रयास का भाव देती है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμῶν ... ὁ πατήρ
  choice: तुम्हारा पिता
  rationale: यूनानी पाठ में केवल ‘तुम्हारा पिता’ है; समानांतर पाठ से ‘स्वर्गीय’ जोड़ना उचित नहीं होगा।
- source_word: οἶδεν
  choice: जानता है
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक होते हुए भी यहाँ वर्तमान अर्थ रखता है।
- source_word: χρῄζετε τούτων
  choice: तुम्हें इनकी आवश्यकता है
  rationale: यह आधुनिक, स्पष्ट हिन्दी में आवश्यकता का अर्थ व्यक्त करता है और τούτων के संकेत को ‘इनकी’ से बनाए रखता है।
theological_decisions:
- issue: सांसारिक खोज और पिता पर शिष्यगत भरोसे के बीच विरोध
  choice: ‘संसार की जातियाँ’ और ‘तुम्हारा पिता’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ἔθνη को मुख्य पाठ में ‘गैर-यहूदी लोग’ कहना या ‘पिता’ से पहले ‘स्वर्गीय’ जोड़ना।
  rationale: पद संसार के लोगों की भौतिक आवश्यकताओं के पीछे लगी रहने की प्रवृत्ति को शिष्यों के परमेश्वर के साथ पितृ-संबंध के सामने रखता है। अनुवाद इस विरोध को बनाए रखता है, पर यूनानी पाठ से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खोज में लगी रहती हैं’ निरंतर और सक्रिय प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है; ‘स्वर्गीय’ जैसा समानांतर पद से लिया गया शब्द नहीं जोड़ा गया।
