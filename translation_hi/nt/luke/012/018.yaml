  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोठार’ प्राचीन कृषि-संदर्भ को बनाए रखता है, जबकि पादटिप्पणी उसका अधिक सामान्य विकल्प देती है। प्रत्यक्ष कथन में योजनाबद्ध आत्मकेंद्रित दोहराव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
