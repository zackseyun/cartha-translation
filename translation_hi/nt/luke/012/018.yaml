source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: hi
  text: 'और उसने कहा, “मैं यह करूँगा: अपने कोठारों[a] को ढहा दूँगा और उनसे बड़े कोठार बनाऊँगा। फिर वहीं अपना सारा अनाज[b] और अपनी संपत्ति[c] इकट्ठी करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भंडारगृहों।”
    reason: lexical_alternative
  - marker: b
    text: “अनाज” (σῖτος) कुछ संदर्भों में विशेष रूप से “गेहूँ” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “अपनी वस्तुएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: मैं यह करूँगा
  rationale: यह स्वाभाविक हिन्दी में τοῦτο की संकेतात्मक प्रमुखता और भविष्य की योजना—दोनों को बनाए रखता है।
- source_word: καθελῶ
  choice: ढहा दूँगा
  rationale: मौजूदा संरचनाओं को गिरा देने की ठोस और पूर्ण कार्रवाई को संक्षेप में व्यक्त करता है।
- source_word: ἀποθήκας
  choice: कोठारों
  rationale: कृषि-संदर्भ में अन्न आदि रखने के भवनों के लिए उपयुक्त शब्द है; व्यापक अर्थ ‘भंडारगृह’ पादटिप्पणी में दिया गया है।
- source_word: μείζονας οἰκοδομήσω
  choice: उनसे बड़े कोठार बनाऊँगा
  rationale: तुलनात्मक अर्थ को स्पष्ट करता है और यूनानी में निहित संज्ञा को सहज हिन्दी में दोहराता है।
- source_word: συνάξω ἐκεῖ
  choice: वहीं … इकट्ठी करूँगा
  rationale: συνάγω के मूल ‘एक जगह एकत्र करने’ के भाव और ἐκεῖ के स्थान-सूचक बल को बनाए रखता है, बिना ‘संचय’ की व्याख्यात्मक भाषा बढ़ाए।
- source_word: πάντα τὸν σῖτον
  choice: अपना सारा अनाज
  rationale: σῖτος को व्यापक कृषि-अर्थ में ‘अनाज’ रखा गया है; ‘अपना’ वक्ता के स्वामित्व और अगले पदबंध के समानांतर भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὰ ἀγαθά μου
  choice: अपनी सारी संपत्ति
  rationale: यह भौतिक वस्तुओं और माल-असबाब के व्यापक अर्थ को व्यक्त करता है, उसे केवल धन तक सीमित नहीं करता।
