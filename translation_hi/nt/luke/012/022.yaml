  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: hi
  text: फिर उसने अपने शिष्यों से कहा, “इस कारण मैं तुमसे कहता हूँ, अपने जीवन[b] की चिंता[a] मत करो कि तुम क्या खाओगे, और न अपने शरीर की कि क्या पहनोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘व्याकुल मत हो।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘प्राण’ अथवा ‘आत्मा’; यहाँ यूनानी शब्द भोजन से बनाए रखे जाने वाले सांसारिक जीवन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: फिर उसने कहा
  rationale: δέ एक हल्का कथात्मक संयोजक है; ‘फिर’ प्रसंग की स्वाभाविक प्रगति दिखाता है, बिना प्रबल विरोध जोड़े।
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: अपने शिष्यों से
  rationale: ‘अपने’ αὐτοῦ के संबंध को बनाए रखता है और ‘शिष्य’ μαθητής का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: Διὰ τοῦτο
  choice: इस कारण
  rationale: यह पद पिछले कथन की ओर संकेत करके उससे निकला निष्कर्ष प्रस्तुत करता है; ‘इस कारण’ उस संबंध को स्पष्ट रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रत्यक्ष संबोधन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: μὴ μεριμνᾶτε
  choice: चिंता मत करो
  rationale: μεριμνάω यहाँ व्याकुल कर देने वाली चिंता को व्यक्त करता है; ‘चिंता मत करो’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: τῇ ψυχῇ
  choice: अपने जीवन के लिए
  rationale: इस प्रसंग में ψυχή भोजन से बनाए रखे जाने वाले सांसारिक जीवन या अस्तित्व की ओर संकेत करता है, न कि अनिवार्य रूप से शरीर से अलग आत्मा की ओर।
- source_word: τί φάγητε
  choice: कि क्या खाओगे
  rationale: यह भविष्य की आवश्यकता से संबंधित परोक्ष विचार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μηδὲ τῷ σώματι
  choice: न अपने शरीर के लिए
  rationale: μηδέ दूसरे समानांतर निषेध को जोड़ता है; यह रूप जीवन/भोजन और शरीर/वस्त्र की समानांतर संरचना बनाए रखता है।
- source_word: τί ἐνδύσησθε
  choice: कि क्या पहनोगे
  rationale: मध्यवाच्य ἐνδύσησθε का आशय कपड़े पहनने से है; चुना हुआ रूप सहज हिन्दी है और ‘क्या खाओगे’ के समानांतर है।
theological_decisions:
- issue: इस प्रसंग में ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण या आत्मा
  rationale: भोजन का ψυχή से और वस्त्र का शरीर से संबंध बताता है कि यहाँ मनुष्य के वर्तमान सांसारिक जीवन का आशय है। ‘जीवन’ चुनने से ऐसा शरीर-आत्मा द्वैत पाठ में नहीं जोड़ा जाता जिसकी इस पद में आवश्यकता नहीं है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। समानांतर निषेध को डैश और ‘न…न…’ संरचना से उभारा गया है। परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान अर्थ से मेल नहीं खाता था; हिन्दी मुख्य पाठ में [a] को ‘चिंता’ और [b] को ‘जीवन’ पर रखा गया है।
