  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: hi
  text: तुम भी तैयार रहो[a], क्योंकि मनुष्य का पुत्र उस समय आएगा जब तुम उसकी अपेक्षा नहीं करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम भी तैयार बने रहो।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “जिस घड़ी तुम ऐसा नहीं सोचते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: यह पद सुननेवालों को पिछले दृष्टांत के सेवकों के साथ सम्मिलित करते हुए उन पर बल देता है; ‘तुम भी’ इस समावेश और बल को स्वाभाविक हिन्दी में रखता है।
- source_word: γίνεσθε ἕτοιμοι
  choice: तैयार रहो
  rationale: वर्तमान काल की आज्ञा निरंतर तत्पर अवस्था बनाए रखने का आह्वान करती है। ‘तैयार रहो’ संक्षिप्त, स्वाभाविक और स्पष्ट आज्ञार्थक हिन्दी है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक तैयार रहने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: ᾗ ὥρᾳ
  choice: जिस घड़ी … उसी घड़ी
  rationale: सम्बन्धवाचक कालसूचक वाक्यांश को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘जिस… उसी…’ संरचना अपनाई गई है; यह किसी ज्ञात निश्चित घड़ी का संकेत नहीं देती।
- source_word: οὐ δοκεῖτε
  choice: तुम उसकी आशा भी नहीं करोगे
  rationale: δοκέω का मूल अर्थ ‘सोचना/मानना’ हो सकता है, पर इस चेतावनी में व्यावहारिक अर्थ किसी आगमन की आशा न करना है। ‘भी’ अनपेक्षितता पर स्वाभाविक बल देता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की विशिष्ट उपाधि का पारंपरिक और पारदर्शी अनुवाद है तथा दानिय्येल 7 की संभावित प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: यूनानी वर्तमान काल यहाँ भविष्यसूचक अर्थ में प्रयुक्त है। ‘आ रहा है’ उसके वर्तमान रूप, सजीवता और चेतावनी की निकटता को बनाए रखता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου की मसीह-संबंधी उपाधि
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: स्थापित शाब्दिक रूप यीशु की आत्म-पहचान और दानिय्येल 7:13–14 से संभावित मसीही तथा अंतकालीन संबंध को बनाए रखता है, बिना पाठ से आगे कोई सिद्धान्त थोपे।
- issue: अंतकालीन कथन में ἔρχεται का कालगत बल
  choice: आ रहा है
  alternative: आएगा
  rationale: यूनानी वर्तमान भविष्य की घटना को सजीव और निकट रूप में प्रस्तुत कर सकता है। यह चयन किसी विशेष अंतकालीन व्यवस्था का निर्णय किए बिना उसी चेतावनी-स्वर को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक रूप अपनाया गया है। ‘घड़ी’ बाइबिलीय गंभीरता बनाए रखते हुए सामान्य पाठक के लिए सहज है। सर्वनाम ‘तुम’ मूल बहुवचन संबोधन के अनुकूल है।
