source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: hi
  text: 'कौओं को ध्यान से देखो[a]: वे न बोते हैं, न फसल काटते हैं; उनके पास न भंडार-कक्ष है, न कोठार[b], और परमेश्वर उन्हें खिलाता है। तुम पक्षियों से कितने अधिक मूल्यवान हो![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कौओं पर ध्यान दो’ अथवा ‘कौओं के विषय में ध्यानपूर्वक विचार करो।’
    reason: lexical_alternative
  - marker: b
    text: ‘भंडार-कक्ष’ यूनानी ταμεῖον का और ‘कोठार’ ἀποθήκη का अनुवाद है। यूनानी में भंडारण के स्थानों के लिए दो अलग शब्द हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम पक्षियों से कितने बढ़कर हो!’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: ध्यान दो
  rationale: यह आज्ञार्थक क्रिया केवल देखने नहीं, बल्कि ध्यानपूर्वक देखकर विचार करने का आह्वान करती है। ‘ध्यान दो’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τοὺς κόρακας
  choice: कौवों
  rationale: κόραξ कौए या रैवन जाति के पक्षी को दर्शाता है। सामान्य हिन्दी पाठक के लिए ‘कौवा’ ठोस, परिचित और स्वाभाविक नाम है।
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: वे न बोते हैं, न काटते हैं
  rationale: दोनों कृषि-क्रियाओं का संक्षिप्त समानांतर रूप सुरक्षित रखा गया है; ‘काटते’ का अर्थ प्रसंग में फसल काटना है।
- source_word: ταμεῖον
  choice: भंडार-कक्ष
  rationale: यह भीतर के ऐसे कक्ष को सूचित कर सकता है जहाँ वस्तुएँ संचित की जाती हैं। यह चयन अगले भंडारण-शब्द ἀποθήκη से भेद बनाए रखता है।
- source_word: ἀποθήκη
  choice: कोठार
  rationale: उपज या अनाज रखने के स्थान के लिए ‘कोठार’ उपयुक्त है और ‘भंडार-कक्ष’ से अलग दूसरा संज्ञा-पद बनाए रखता है।
- source_word: τρέφει
  choice: खिलाता है
  rationale: सरल वर्तमान काल परमेश्वर के निरंतर प्रबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πόσῳ μᾶλλον
  choice: कितने अधिक
  rationale: यह छोटे से बड़े की ओर जाने वाले तुलनात्मक तर्क की प्रबलता को संक्षेप में बनाए रखता है।
- source_word: διαφέρετε
  choice: मूल्यवान हो
  rationale: इस प्रसंग में क्रिया केवल भिन्न होने के बजाय मूल्य या महत्त्व में बढ़कर होने का भाव रखती है।
- source_word: τῶν πετεινῶν
  choice: पक्षियों से
  rationale: विशेष रूप से कौवों के उल्लेख के बाद यूनानी पाठ व्यापक पक्षी-वर्ग से तुलना करता है।
theological_decisions:
- issue: तुलना में परमेश्वर का प्रबंध
  choice: फिर भी परमेश्वर उन्हें खिलाता है
  alternative: और परमेश्वर उनका पालन-पोषण करता है
  rationale: पाठ परमेश्वर की सक्रिय देखभाल को मनुष्यों के अधिक मूल्य के तर्क का आधार बनाता है। ‘खिलाता है’ मूल क्रिया को सीधे रखता है और उससे आगे कोई विस्तृत धर्मसैद्धांतिक दावा नहीं जोड़ता।
- issue: मनुष्यों और पक्षियों के मूल्य की तुलना
  choice: तुम पक्षियों से कितने अधिक मूल्यवान हो!
  alternative: तुम पक्षियों से कितने बढ़कर हो!
  rationale: διαφέρετε में सामान्य ‘भिन्न होने’ का अर्थ संभव है, पर इस प्रसंग का कम से अधिक वाला तर्क मूल्य और महत्त्व में श्रेष्ठता बताता है। विस्मयादिबोधक चिह्न कथन की आलंकारिक प्रबलता व्यक्त करता है, बिना उसे साधारण सूचना में बदलने के।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘भंडार-कक्ष’ और ‘कोठार’ मूल के दो अलग भंडारण-संज्ञा पदों का भेद बनाए रखते हैं। ‘कौवों’ मानक हिन्दी में परिचित प्राकृतिक बिंब देता है; ‘रैवन’ जैसे अप्रचलित लिप्यंतरण से बचा गया है।
