  verdict: revise
  source_fidelity: The draft accurately represents the prohibition, the collective pastoral vocative, the causal conjunction, the plural addressees, and βασιλεία as “राज्य.” However, “तुम्हें राज्य देने में प्रसन्न हुए हैं” can mean that the Father was pleased while/in the process of giving, rather than that it pleased him to give. The Greek εὐδόκησεν + infinitive expresses favorable pleasure in the giving itself as the intended action.
  naturalness: The register is clear and modern. “मत डर” is defensible with the collective singular “झुंड,” though the vocative is a group. Recasting the εὐδόκησεν clause as “को ... देना अच्छा लगा” is more idiomatic Hindi and preserves the Greek infinitival construction's relation to the verb.
  terminology: “झुंड” appropriately retains the flock metaphor, and “राज्य” is the established Hindi biblical equivalent for βασιλεία while preserving its breadth. The explanatory note should retain both royal-rule and realm dimensions without treating either as exclusive.
  issues:
  - severity: medium
    issue: The phrase “देने में प्रसन्न हुए हैं” does not clearly express εὐδόκησεν + δοῦναι.
    rationale: It may imply pleasure in the act or manner of giving rather than the Father's good pleasure to give. “तुम्हारे पिता को तुम्हें राज्य देना अच्छा लगा” directly renders the construction and remains nontechnical.
