source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: hi
  text: “मत डर[a], हे छोटे झुंड[b], क्योंकि तुम्हारे पिता को तुम्हें राज्य[c] देना अच्छा लगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत घबरा।”
    reason: lexical_alternative
  - marker: b
    text: या, “छोटे-से झुंड।”
    reason: lexical_alternative
  - marker: c
    text: “राज्य” का अर्थ “राजकीय शासन” भी हो सकता है; यह शब्द परमेश्वर के शासन के साथ-साथ उसकी प्रजा को दिए जाने वाले राज्य की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: μή के साथ वर्तमान आज्ञार्थक रूप सीधे निषेध को व्यक्त करता है। ‘मत डर’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और मूल के एकवचन संबोधन के अनुरूप है।
- source_word: τὸ μικρὸν ποίμνιον
  choice: हे छोटे झुंड
  rationale: ποίμνιον भेड़ों के झुंड का चरवाही रूपक बनाए रखता है और μικρόν उसके छोटे आकार को बताता है। ‘हे’ संबोधन को स्पष्ट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι न डरने का कारण प्रस्तुत करता है; ‘क्योंकि’ इस कारणात्मक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εὐδόκησεν
  choice: प्रसन्न हुए हैं
  rationale: εὐδοκέω पिता की अनुकूल इच्छा और सद्भावपूर्ण प्रसन्नता व्यक्त करता है। यह अनुवाद उस भाव को बनाए रखता है, पर इसे किसी तकनीकी धर्मवैज्ञानिक निर्णय के रूप में नहीं समझाता।
- source_word: ὁ πατὴρ ὑμῶν
  choice: तुम्हारे पिता
  rationale: मूल में केवल ‘तुम्हारे पिता’ है; ‘स्वर्गीय’ जैसा कोई अतिरिक्त विशेषण नहीं जोड़ा गया। बहुवचन ὑμῶν को हिन्दी में ‘तुम्हारे’ से व्यक्त किया गया है।
- source_word: δοῦναι ὑμῖν
  choice: तुम्हें ... देने
  rationale: δίδωμι के infinitive और बहुवचन dative pronoun का सीधा, सहज हिन्दी रूप ‘तुम्हें ... देने’ है।
- source_word: τὴν βασιλείαν
  choice: राज्य
  rationale: βασιλεία राजकीय शासन और राज्य—दोनों अर्थ-छायाएँ रख सकता है। ‘राज्य’ परिचित बाइबलीय शब्द है और इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: βασιλεία का अर्थ-क्षेत्र
  choice: राज्य
  alternative: राजकीय शासन
  rationale: ‘राज्य’ परमेश्वर के शासन और उसकी प्रजा को दिए जाने वाले राज्य, दोनों की ओर संकेत की गुंजाइश बनाए रखता है; ‘राजकीय शासन’ अर्थ को केवल शासन-क्रिया की ओर संकुचित कर सकता है।
- issue: εὐδόκησεν और पिता की इच्छा
  choice: प्रसन्न हुए हैं
  alternative: कृपापूर्वक चुन लिया है
  rationale: मूल पिता की सद्भावपूर्ण प्रसन्नता और पहल बताता है। ‘प्रसन्न हुए हैं’ इस आशय को व्यक्त करता है, जबकि ‘चुन लिया’ मूल से अधिक तकनीकी धर्मवैज्ञानिक अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल में समझ आने वाली शैली रखी गई है। चरवाही रूपक और स्नेहपूर्ण संबोधन सुरक्षित हैं। एकवचन आज्ञा ‘मत डर’ पूरे झुंड को एक इकाई मानकर किए गए यूनानी संबोधन को दर्शाती है।
