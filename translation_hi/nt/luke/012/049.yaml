  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: hi
  text: मैं पृथ्वी पर आग लगाने आया हूँ; और मैं कितना चाहता हूँ कि वह पहले ही भड़क उठी होती![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप में: “और मैं क्या चाहता हूँ, यदि वह पहले ही भड़क उठी है?” यूनानी वाक्यांश कठिन है; मुख्य पाठ इसे प्रबल लालसा व्यक्त करने वाला मुहावरा मानता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: आग
  rationale: रूपक को बिना उसकी व्याख्या ‘न्याय’, ‘शुद्धि’ या किसी अन्य धारणा के रूप में किए ज्यों का त्यों रखा गया है।
- source_word: ἦλθον βαλεῖν
  choice: लगाने आया हूँ
  rationale: शाब्दिक ‘फेंकने आया’ हिन्दी में आग के साथ अस्वाभाविक है; ‘आग लगाना’ βάλλω की सजीव क्रिया और उद्देश्यसूचक infinitive का स्वाभाविक हिन्दी रूप है। ‘आया हूँ’ यीशु के मिशन-वक्तव्य के रूप में सहज है।
- source_word: ἐπὶ τὴν γῆν
  choice: पृथ्वी पर
  rationale: γῆ के व्यापक अर्थ को बनाए रखता है; ‘देश’ या ‘भूमि’ अनावश्यक रूप से दायरा सीमित कर सकते हैं।
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: और मेरी कैसी लालसा है कि वह पहले ही भड़क उठी होती!
  rationale: कठिन यूनानी वाक्यांश को प्रबल इच्छा के विस्मयात्मक भाव में प्रस्तुत किया गया है, साथ ही अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ἀνήφθη
  choice: भड़क उठी होती
  rationale: ἀνάπτω के निष्क्रिय आग-सुलगने के भाव को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है; ‘प्रज्वलित’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है।
theological_decisions:
- issue: यीशु के कथन में ‘आग’ का अर्थ
  choice: ‘आग’ के रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: न्याय, शुद्धि, पवित्र आत्मा, या यीशु के मिशन से उत्पन्न विभाजन
  rationale: पद स्वयं रूपक का एक निश्चित अर्थ नहीं बताता; अनुवाद को इसकी सम्भावित बहुस्तरीयता और धर्मवैज्ञानिक तनाव सुरक्षित रखना चाहिए।
- issue: τί θέλω εἰ ἤδη ἀνήφθη का बल
  choice: तीव्र लालसा व्यक्त करने वाला विस्मयादिबोधक वाक्य
  alternative: 'अधिक शाब्दिक प्रश्न: ‘और यदि वह पहले ही भड़क उठी है, तो मैं और क्या चाहता हूँ?’'
  rationale: यूनानी संरचना कठिन और सम्भवतः मुहावरेदार है। मुख्य पाठ में प्रसंगानुकूल प्रबल इच्छा दी गई है, पर वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘आग लगाने’ का स्वाभाविक प्रयोग मूल की सजीव छवि बनाए रखता है; ‘मेरी कैसी लालसा है’ कथन के गंभीर और तीव्र भाव को व्यक्त करता है।
