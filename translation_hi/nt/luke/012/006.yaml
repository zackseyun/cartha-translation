source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: hi
  text: क्या पाँच गौरैयाँ दो अस्सारिया में नहीं बिकतीं?[a] फिर भी, उनमें से एक भी परमेश्वर की दृष्टि में भूली हुई नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अस्सारिया’ छोटे रोमी ताँबे के सिक्के थे; या, ‘दो छोटे ताँबे के सिक्कों में।’
    reason: cultural_note
  - marker: b
    text: या, ‘परमेश्वर की दृष्टि में अनदेखी नहीं है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: गौरैयाँ
  rationale: यह शब्द छोटे पक्षियों के लिए प्रयुक्त हो सकता है, पर इस प्रसंग में ‘गौरैयाँ’ उसका स्वाभाविक और प्रचलित विशिष्ट अर्थ है।
- source_word: πωλοῦνται
  choice: बिकतीं
  rationale: वर्तमानकालीन कर्मवाच्य रूप को हिन्दी में स्वाभाविक कर्मवाच्य ‘बिकतीं’ से व्यक्त किया गया है।
- source_word: ἀσσαρίων δύο
  choice: दो अस्सारिया में
  rationale: प्राचीन रोमी सिक्के का विशिष्ट नाम बनाए रखा गया है; आधुनिक मुद्रा से उसका भ्रामक सटीक मूल्य नहीं जोड़ा गया।
- source_word: ἐπιλελησμένον
  choice: भूली हुई नहीं है
  rationale: पूर्णकालिक कृदन्त उस अवस्था को व्यक्त करता है जिसमें कोई भुला हुआ हो; यह अनुवाद मूल के स्मरण-विस्मरण संबंधी रूपक को बनाए रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह मूल अभिव्यक्ति का निकट और समझने योग्य अनुवाद है तथा बात को केवल मानवीय दृष्टि या देखभाल की व्याख्या तक सीमित नहीं करता।
- source_word: οὐχὶ ... ;
  choice: क्या ... नहीं ...?
  rationale: यह प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी की यह प्रश्न-रचना उसी आलंकारिक बल को व्यक्त करती है।
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: फिर भी उनमें से एक भी
  rationale: ‘एक भी’ प्रत्येक छोटी गौरैया पर बल देता है, जबकि ‘फिर भी’ उनके कम बाजार-मूल्य और परमेश्वर के स्मरण के बीच निहित विरोध को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: परमेश्वर के स्मरण और देखभाल की भाषा
  choice: एक भी परमेश्वर के सामने भूली हुई नहीं है
  alternative: एक भी परमेश्वर की दृष्टि में अनदेखी नहीं है
  rationale: ‘भूली हुई’ यूनानी क्रिया के निकट है और परमेश्वर के सजग ज्ञान की बात कहती है, पर पद में कही गई बात से आगे बढ़कर देखभाल या विधान का विस्तृत धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप अपनाया गया है। प्राचीन सिक्के का नाम मूल के सांस्कृतिक संदर्भ को बचाने के लिए रखा गया है और उसकी व्याख्या पाद-टिप्पणी में दी गई है।
