source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: hi
  text: 'पर मेरे मित्रों, मैं तुमसे कहता हूँ: उन लोगों से मत डरो जो शरीर को मार डालते हैं और उसके बाद वे और कुछ नहीं कर सकते।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: पर ... कहता हूँ
  rationale: δέ यहाँ संबोधन में हल्का संक्रमण या विरोध दिखाता है। ‘पर’ इस बदलाव को स्वाभाविक रूप से व्यक्त करता है, बिना विरोध को अनावश्यक रूप से तीखा बनाए।
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: तुमसे, जो मेरे मित्र हो
  rationale: 'यह दत्तिव पदबंध व्याख्यात्मक/appositional है: यीशु उन्हीं श्रोताओं को ‘मेरे मित्र’ कहकर संबोधित करते हैं। यह रूप सर्वनाम और आत्मीय संबोधन दोनों सुरक्षित रखता है।'
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: उनसे मत डरो जो ... मार डालते हैं
  rationale: μή के साथ क्रिया निषेध व्यक्त करती है, और ἀπό भय के विषय को चिह्नित करता है। वर्तमान कृदन्त को सामान्य चरित्र वाले कथन के रूप में ‘जो ... मार डालते हैं’ किया गया है।
- source_word: τὸ σῶμα
  choice: शरीर को
  rationale: σῶμα यहाँ भौतिक शरीर को सूचित करता है। ‘शरीर’ सरल, प्रचलित और प्रसंगानुकूल है।
- source_word: καὶ μετὰ ταῦτα
  choice: और उसके बाद
  rationale: यह पदबंध कालगत क्रम बताता है—शरीर को मार डालने के बाद। ‘उसके बाद’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: इससे अधिक कुछ नहीं कर सकते
  rationale: वाक्यांश उन हत्यारों की सीमा बताता है। περισσότερόν τι का आशय ‘इससे अधिक/आगे कुछ’ है; चुना हुआ रूप उनकी असमर्थता और तुलना दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: शारीरिक मृत्यु के बाद मनुष्यों की शक्ति की सीमा
  choice: पद केवल यह कहता है कि वे शरीर को मारने के बाद इससे अधिक कुछ नहीं कर सकते।
  alternative: स्पष्ट रूप से जोड़ना कि वे आत्मा को नहीं मार सकते।
  rationale: यद्यपि अगला पद मनुष्य की सीमित शक्ति और परमेश्वर के अधिकार में भेद करता है, इस पद में ‘आत्मा’ का उल्लेख नहीं है। इसलिए अगले पद की व्याख्या यहाँ नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक संबोधन के अनुकूल शैली। ‘तुम’ मूल के बहुवचन ὑμῖν और मित्रतापूर्ण निकटता को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मूल में अर्थगत विकल्प को मुख्य पाठ में स्वाभाविक रूप से सुरक्षित रखा गया है।
