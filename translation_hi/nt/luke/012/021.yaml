  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: hi
  text: “उस व्यक्ति के साथ ऐसा ही होता है जो अपने लिए धन बटोरता है, पर परमेश्वर के प्रति धनी नहीं होता[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के सामने धनी नहीं होता।”
    reason: εἰς θεόν के संबंधपरक वाक्यांश का एक सम्भव वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: οὕτως
  choice: ऐसा ही
  rationale: यह शब्द पिछले दृष्टान्त से उसके निष्कर्ष और अनुप्रयोग की ओर संकेत करता है। ‘ऐसा ही’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से उस व्यक्ति की दशा बताता है।
- source_word: ὁ θησαυρίζων
  choice: वह मनुष्य जो ... धन इकट्ठा करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त किसी ऐसे प्रतिनिधि व्यक्ति को दर्शाता है जिसकी पहचान इस लगातार या चरित्रगत काम से होती है। ‘धन इकट्ठा करता है’ खजाना जमा करने की मूल धारणा को बनाए रखता है।
- source_word: ἑαυτῷ
  choice: अपने लिए
  rationale: आत्मवाचक चतुर्थी निजी लाभ और स्वयं की ओर केंद्रित संचय को सीधे व्यक्त करती है।
- source_word: καὶ μὴ
  choice: पर ... नहीं
  rationale: यूनानी में सामान्य संयोजक है, किंतु यहाँ दो विपरीत स्थितियों—अपने लिए संचय करना और परमेश्वर के प्रति धनी न होना—को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘पर’ उपयुक्त है।
- source_word: εἰς θεὸν
  choice: परमेश्वर के प्रति
  rationale: εἰς का दिशात्मक और संबंधपरक भाव बनाए रखा गया है। यह वाक्यांश अर्थ को केवल परमेश्वर के मूल्यांकन या किसी विशिष्ट धार्मिक कर्म तक सीमित नहीं करता।
- source_word: πλουτῶν
  choice: धनी
  rationale: कृदन्त का भाव हिन्दी में विधेय विशेषण ‘धनी’ से स्वाभाविक रूप से व्यक्त होता है और सांसारिक संचय के साथ विरोध भी बना रहता है।
theological_decisions:
- issue: नैतिक उक्ति में प्रतिनिधि पुल्लिंग एकवचन
  choice: वह मनुष्य जो
  alternative: वह जो / ऐसा व्यक्ति जो
  rationale: यूनानी पाठ में पुल्लिंग एकवचन संज्ञात्मक कृदन्त है। ‘वह मनुष्य’ प्रतिनिधि उदाहरण को बनाए रखता है; उक्ति का अनुप्रयोग केवल पुरुषों तक सीमित करने का आशय नहीं जोड़ा गया है।
- issue: ‘परमेश्वर के प्रति धनी’ होने का अर्थ
  choice: संबंधपरक और दिशात्मक वाक्यांश को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: परमेश्वर के सामने धनी / उन बातों में धनी जो परमेश्वर के लिए महत्त्वपूर्ण हैं
  rationale: पद स्वयं इस धनवान होने का पूरा अर्थ नहीं खोलता। इसलिए किसी विशेष धार्मिक या नैतिक व्याख्या को मुख्य पाठ में जोड़ने के बजाय मूल की अर्थगत व्यापकता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली रखी गई है। ‘परमेश्वर के प्रति धनी’ कुछ असामान्य किंतु समझने योग्य अभिव्यक्ति है, जिसे मूल यूनानी के दिशात्मक-संबंधपरक तनाव को बचाने के लिए जानबूझकर रखा गया है।
