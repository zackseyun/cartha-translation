id: LUK.12.42
reference: Luke 12:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: hi
  text: और प्रभु ने कहा, “तो वह विश्वासयोग्य और समझदार[a] गृह-प्रबंधक कौन है, जिसे स्वामी अपने सेवक-दल पर नियुक्त करेगा, ताकि वह उन्हें ठीक समय पर उनके हिस्से का भोजन[b] दे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “बुद्धिमान।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अनाज की नापी हुई खुराक,” अर्थात प्रत्येक सेवक के लिए निर्धारित भोजन का हिस्सा।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु / स्वामी
  rationale: वक्ता यीशु के लिए कथात्मक संबोधन में ‘प्रभु’ स्वाभाविक है; दृष्टांत के भीतर गृहस्वामी के लिए उसी यूनानी शब्द का प्रसंगानुकूल अर्थ ‘स्वामी’ है।
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यह सौंपी गई जिम्मेदारी में भरोसेमंद और निष्ठावान होने का भाव व्यक्त करता है।
- source_word: οἰκονόμος
  choice: गृह-प्रबंधक
  rationale: यह घर या संपत्ति के प्रबंधन की जिम्मेदारी पाए व्यक्ति को स्पष्ट करता है; केवल ‘भंडारी’ कहने से आधुनिक हिन्दी में भूमिका अनावश्यक रूप से भंडार तक सीमित समझी जा सकती है।
- source_word: φρόνιμος
  choice: समझदार
  rationale: यह व्यावहारिक बुद्धि और उचित निर्णय-क्षमता को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘बुद्धिमान’ भी संभव है।
- source_word: καταστήσει
  choice: नियुक्त करेगा
  rationale: यह किसी को अधिकार और जिम्मेदारी के पद पर रखने का अर्थ स्पष्ट करता है।
- source_word: θεραπείας
  choice: घर के सेवकों
  rationale: यहाँ शब्द अमूर्त ‘सेवा’ नहीं, बल्कि स्वामी के अधीन सेवक-दल को सूचित करता है।
- source_word: ἐν καιρῷ
  choice: ठीक समय पर
  rationale: यह उपयुक्त या नियत समय का स्वाभाविक हिन्दी रूप है।
- source_word: σιτομέτριον
  choice: उनके हिस्से का भोजन
  rationale: यह प्रत्येक सेवक को मिलने वाली नापी हुई खाद्य-खुराक का कार्यात्मक अर्थ स्पष्ट करता है; अनाज संबंधी शाब्दिक बारीकी पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: दो बार आए κύριος का अनुवाद
  choice: यीशु के लिए ‘प्रभु’ और दृष्टांत के गृहस्वामी के लिए ‘स्वामी’
  alternative: दोनों स्थानों पर ‘प्रभु’
  rationale: मूल में एक ही शब्द है, पर दोनों प्रयोगों के संदर्भ अलग हैं। हिन्दी में यह भेद कथावाचक द्वारा यीशु के पदनाम और दृष्टांत के अंदर के पात्र को स्पष्ट रखता है, बिना मूल अर्थ को बदले।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘गृह-प्रबंधक’ प्रशासनिक जिम्मेदारी को स्पष्ट करता है, जबकि ‘घर के सेवकों’ से θεραπεία का सामूहिक मानवीय अर्थ बना रहता है।
