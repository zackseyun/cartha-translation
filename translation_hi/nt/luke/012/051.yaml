id: LUK.12.51
reference: Luke 12:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: hi
  text: क्या तुम समझते हो कि मैं पृथ्वी पर शांति देने आया हूँ? नहीं, मैं तुमसे कहता हूँ, बल्कि विभाजन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: क्या तुम समझते हो
  rationale: यह बहुवचन में श्रोताओं की धारणा को चुनौती देने वाला आलंकारिक प्रश्न है। ‘क्या तुम समझते हो’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: εἰρήνην
  choice: शांति
  rationale: यह मानक और व्यापक समतुल्य है; प्रसंग में सामाजिक और पारिवारिक मेल भी इसके अर्थ-क्षेत्र में आता है।
- source_word: παρεγενόμην
  choice: मैं ... आया हूँ
  rationale: यहाँ क्रिया यीशु के उद्देश्यपूर्ण आगमन को व्यक्त करती है। हिन्दी में वर्तमान से संबद्ध आगमन के लिए ‘आया हूँ’ स्वाभाविक है।
- source_word: δοῦναι
  choice: देने
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है और ‘शांति देने’ का प्रयोग हिन्दी में भी सुबोध है, इसलिए अधिक व्याख्यात्मक ‘लाने’ की आवश्यकता नहीं।
- source_word: ἐν τῇ γῇ
  choice: पृथ्वी पर
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है; यहाँ व्यापक संदर्भ के कारण ‘पृथ्वी पर’ अधिक उपयुक्त है।
- source_word: οὐχί
  choice: नहीं
  rationale: यह प्रश्न का स्पष्ट और बलपूर्ण नकारात्मक उत्तर है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह सुसमाचारों का सामान्य प्रत्यक्ष संबोधन-सूत्र है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀλλ’ ἢ
  choice: बल्कि
  rationale: 'नकार के बाद तीखा विरोध व्यक्त करता है: शांति नहीं, बल्कि उसका विपरीत सामाजिक परिणाम।'
- source_word: διαμερισμόν
  choice: विभाजन
  rationale: यह निकटवर्ती प्रसंग में लोगों और परिवारों के बँटने को दर्शाता है; ‘विभाजन’ सीधा और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: शांति संबंधी अन्य कथनों के साथ प्रतीत होने वाले तनाव को नरम करना या बनाए रखना
  choice: शांति और विभाजन के बीच मूल पाठ का तीखा विरोध बनाए रखा गया है।
  alternative: इसे ‘संघर्ष’ कहकर अधिक व्याख्यात्मक बनाना, या केवल अनचाहे सामाजिक प्रभाव के रूप में नरम करना।
  rationale: यूनानी पाठ जानबूझकर तीखा है। निकटवर्ती प्रसंग यीशु के मिशन के कारण परिवारों में होने वाले विभाजन को स्पष्ट करता है; अनुवाद को इस वास्तविक धर्मवैचारिक तनाव का मौन समाधान नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध भाषा। मूल के संक्षिप्त और आघातकारी अंतिम वाक्यांश ‘बल्कि विभाजन’ को विस्तार देकर नरम नहीं किया गया है।
