  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: hi
  text: पर वह दास, जो अपने स्वामी की इच्छा जानता था, पर न तो तैयार हुआ और न उसकी इच्छा के अनुसार काम किया, बहुत मार खाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “बहुत से वार सहेगा” या “कई बार पीटा जाएगा।” यूनानी में वारों के लिए संज्ञा निहित है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द स्वामी के अधीन बँधे हुए व्यक्ति को दर्शाता है, केवल वेतन पाने वाले सेवक को नहीं। आधुनिक हिन्दी में ‘दास’ इस संबंध और स्वामी के दंडाधिकार दोनों को संक्षेप में व्यक्त करता है।
- source_word: γνοὺς
  choice: जानता था
  rationale: अओरिस्ट कृदंत स्वामी की इच्छा के पूर्वज्ञान को दिखाता है; ‘जानता था’ स्वाभाविक हिन्दी में यही भाव रखता है।
- source_word: θέλημα
  choice: इच्छा
  rationale: यहाँ स्वामी की चाही हुई बात या मंशा अभिप्रेत है; ‘इच्छा’ सामान्य, स्पष्ट और प्रसंगानुकूल है।
- source_word: κυρίου αὐτοῦ
  choice: अपने स्वामी की
  rationale: घराने के दृष्टान्त में κύριος दास के स्वामी को दर्शाता है। ‘स्वामी’ सामाजिक संबंध को स्पष्ट करता है और इस पद में सीधे ईश्वरीय उपाधि जोड़ने से बचता है।
- source_word: μὴ ἑτοιμάσας
  choice: न तो तैयार हुआ
  rationale: यूनानी पाठ तैयारी की वस्तु को अनकहा छोड़ता है। हिन्दी में भी ‘तैयार हुआ’ उस खुलेपन को बनाए रखते हुए स्वाभाविक है।
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: और न उसकी इच्छा के अनुसार काम किया
  rationale: यह तैयारी न करने से अलग दूसरी विफलता को व्यक्त करता है। ‘काम किया’ ποιέω का सहज हिन्दी रूप है और πρός के अनुरूपता-भाव को ‘के अनुसार’ सुरक्षित रखता है।
- source_word: δαρήσεται πολλάς
  choice: बहुत मार खाएगा
  rationale: भविष्यत् कर्मवाच्य शारीरिक पिटाई का संकेत देता है और πολλάς में वारों की बहुलता है, जबकि संज्ञा यूनानी में निहित है। हिन्दी मुहावरा ‘बहुत मार खाएगा’ उसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त के घरेलू प्रसंग में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: पद के भीतर संबंध दास और उसके अधिकार-संपन्न स्वामी का है। ‘स्वामी’ इस प्रत्यक्ष सामाजिक अर्थ को सुरक्षित रखता है, जबकि दृष्टान्त के व्यापक ईश्वरीय संकेत को नकारता नहीं।
- issue: δαρήσεται πολλάς में दंड की तीव्रता और निहित संज्ञा
  choice: बहुत मार खाएगा
  alternative: बहुत से कोड़े खाएगा / कई बार पीटा जाएगा
  rationale: यूनानी में ‘वार’ या ‘कोड़े’ की संज्ञा स्पष्ट रूप से नहीं दी गई है। चुना हुआ हिन्दी मुहावरा दंड और उसकी बहुलता को रखता है, पर दंड के साधन को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण दृष्टान्त-शैली। ‘पर’, ‘दास’, ‘स्वामी’ और ‘बहुत मार खाएगा’ सामान्य पाठक के लिए सहज हैं। मूल की दोहरी विफलता—तैयार न होना और इच्छा के अनुसार काम न करना—स्पष्ट रखी गई है।
