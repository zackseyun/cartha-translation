  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: hi
  text: हे कपटियो! तुम धरती और आकाश की दशा को परखना जानते हो, पर इस समय[a] को कैसे नहीं परखना जानते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस अवसर’ अथवा ‘इस निर्णायक समय’। यूनानी शब्द καιρός केवल सामान्य समय नहीं, बल्कि किसी महत्त्वपूर्ण या उपयुक्त समय को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: हे कपटियो
  rationale: यह सीधा संबोधन और नैतिक ढोंग के लिए कड़ी फटकार है; ‘कपटियो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: धरती और आकाश का रूप
  rationale: πρόσωπον यहाँ शाब्दिक ‘मुख’ नहीं, बल्कि दिखाई देने वाला रूप या दशा बताता है। ‘आकाश’ मौसम-संबंधी संदर्भ में ‘स्वर्ग’ से अधिक उपयुक्त है।
- source_word: οἴδατε δοκιμάζειν
  choice: परखना जानते हो
  rationale: οἴδατε के साथ infinitive योग्यता या जानकारी दर्शाता है, और δοκιμάζειν यहाँ दिखाई देने वाले संकेतों का मूल्यांकन करके अर्थ समझने के भाव में है। ‘परखना जानते हो’ संक्षिप्त और स्वाभाविक है।
- source_word: τὸν καιρὸν τοῦτον
  choice: इस समय
  rationale: καιρός सामान्य काल के साथ किसी महत्त्वपूर्ण या उपयुक्त अवसर का भाव भी रख सकता है। मुख्य पाठ में ‘इस समय’ मूल की व्यापकता और अस्पष्टता को बनाए रखता है।
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: परखना क्यों नहीं जानते?
  rationale: πῶς यहाँ विस्मय और फटकार से भरा आलंकारिक प्रश्न है। हिन्दी में ‘क्यों नहीं जानते?’ उसी व्यावहारिक बल को स्वाभाविक ढंग से व्यक्त करता है और δοκιμάζειν की पुनरावृत्ति भी बनाए रखता है।
theological_decisions:
- issue: καιρός में यीशु के सेवाकाल और परमेश्वर के कार्य के निर्णायक अवसर का संभावित संकेत
  choice: इस समय
  alternative: इस निर्णायक समय / इस अवसर
  rationale: संदर्भ इस समय के विशेष महत्त्व की ओर संकेत करता है, पर यूनानी शब्द स्वयं उस महत्त्व की सटीक धार्मिक व्याख्या नहीं करता। इसलिए मुख्य पाठ उसे अधिक निश्चित नहीं बनाता; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘हे कपटियो!’ संबोधन की तीखी फटकार को बनाए रखता है। दोनों खंडों में ‘परखना’ दोहराकर मूल यूनानी की समानांतर रचना सुरक्षित रखी गई है।
