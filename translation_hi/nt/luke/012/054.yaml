    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: कहता था
  rationale: अपूर्ण भूतकाल की जारी अथवा प्रचलित पृष्ठभूमि-क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ καὶ
  choice: यह भी
  rationale: καί की योगात्मक शक्ति को सुरक्षित रखता है; δέ को हिन्दी में अलग शब्द देकर अनावश्यक रूप से भारी नहीं किया गया।
- source_word: τοῖς ὄχλοις
  choice: जनसमूहों से
  rationale: यूनानी बहुवचन को बनाए रखते हुए ‘भीड़ों’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी देता है।
- source_word: Ὅταν ἴδητε
  choice: जब तुम ... देखते हो
  rationale: ὅταν और विधिलिंग द्वारा व्यक्त सामान्य परिस्थिति को हिन्दी के सहज सामान्य-वर्तमान रूप में प्रकट करता है।
- source_word: νεφέλην
  choice: कोई बादल
  rationale: मूल शब्द केवल ‘बादल’ कहता है; वर्षा का अर्थ संदर्भ से निकलता है, इसलिए ‘वर्षा का बादल’ नहीं जोड़ा गया।
- source_word: ἀνατέλλουσαν
  choice: उठता हुआ
  rationale: बादल के ऊपर उठने या क्षितिज पर उभरने की दृश्य छवि को बनाए रखता है।
- source_word: ἐπὶ δυσμῶν
  choice: पश्चिम में
  rationale: मौसम देखने के इस संदर्भ में पश्चिमी दिशा या क्षितिज का स्वाभाविक हिन्दी संकेत है; ‘पश्चिम से’ भी सम्भव है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: क्रियाविशेषण की तत्कालता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: λέγετε
  choice: कहते हो
  rationale: वर्तमान काल की प्रचलित या बार-बार होने वाली क्रिया को सुरक्षित रखता है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के उद्धरण-चिह्न
  rationale: यहाँ ὅτι कथन की विषयवस्तु का परिचय देता है; हिन्दी में प्रत्यक्ष उद्धरण अधिक स्वाभाविक है।
- source_word: Ὄμβρος
  choice: बारिश
  rationale: शब्द सामान्य वर्षा से लेकर तेज वर्षा तक का बोध करा सकता है। मुख्य पाठ में व्यापक और सामान्य हिन्दी शब्द चुना गया तथा अधिक विशिष्ट अर्थ पाद-टिप्पणी में रखा गया।
- source_word: ἔρχεται
  choice: आने वाली है
  rationale: निकट भविष्य या आसन्न घटना के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γίνεται οὕτως
  choice: वैसा ही होता है
  rationale: कही गई मौसम-संबंधी बात के सच घटित होने का सीधा अर्थ सुरक्षित रखता है।
