base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: hi
  text: वह जनसमूहों से भी कहता था, “जब तुम पश्चिम में कोई बादल उठता हुआ देखते हो, तो तुरंत कहते हो, ‘बारिश आने वाली है[a],’ और ऐसा ही होता है।”
  philosophy: optimal-equivalence
  footnotes:
