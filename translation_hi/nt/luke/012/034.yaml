  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: hi
  text: क्योंकि जहाँ तुम्हारा खज़ाना है, वहीं तुम्हारा हृदय भी होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थानवाचक संबंध को सहज ढंग से व्यक्त करता है और ἐκεῖ के साथ ‘जहाँ… वहीं…’ की यूनानी संरचना बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: पिछले निर्देश से इस कथन के व्याख्यात्मक संबंध को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: θησαυρός
  choice: खज़ाना
  rationale: संदर्भ में धन-संपत्ति के शाब्दिक अर्थ और मनुष्य जिसे मूल्यवान मानता है उस व्यापक रूपक—दोनों को बनाए रखता है।
- source_word: καρδία
  choice: हृदय
  rationale: इच्छाओं, लगावों और आंतरिक दिशा के केंद्र का बाइबलीय अर्थ सुरक्षित रखता है, बिना इसे केवल ‘मन’ या ‘इच्छा’ तक सीमित किए।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: ὅπου के साथ सहसंबंधी ‘जहाँ… वहीं…’ रूप बनाता है; ‘ही’ स्थानगत संबंध पर स्वाभाविक बल देता है।
- source_word: καὶ
  choice: भी
  rationale: यह दर्शाता है कि खज़ाना जिस स्थान पर है, हृदय भी उसी के साथ वहाँ होगा।
- source_word: ἔσται
  choice: होगा
  rationale: यूनानी के स्पष्ट भविष्यकाल को बनाए रखता है और परिणाम तथा लोकोक्तिपरक निश्चितता दोनों व्यक्त कर सकता है।
- source_word: ὑμῶν
  choice: तुम्हारा
  rationale: दोनों प्रयोगों में द्वितीय पुरुष बहुवचन संबंधसूचक रूप है; हिन्दी में सामूहिक श्रोताओं को संबोधित करते हुए ‘तुम्हारा’ स्वाभाविक है।
theological_decisions:
- issue: ‘हृदय’ का मानवशास्त्रीय अर्थ
  choice: ‘हृदय’ को मनुष्य के लगावों, संकल्पों और आंतरिक दिशा के केंद्र के अर्थ में बनाए रखा गया है।
  alternative: अधिक व्याख्यात्मक रूप से ‘मन’ या ‘इच्छाएँ’ कहना।
  rationale: मूल कथन मनुष्य की भीतरी दिशा और उसके मूल्यवान माने हुए खज़ाने के संबंध को लोकोक्तिपरक ढंग से व्यक्त करता है। ‘हृदय’ अर्थ को किसी एक मनोवैज्ञानिक पक्ष तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘जहाँ… वहीं…’ मूल की संतुलित संरचना को स्वाभाविक रूप में सुरक्षित रखता है। ‘खज़ाना’ सामान्य पाठक के लिए परिचित है और शाब्दिक तथा रूपकात्मक दोनों अर्थ वहन करता है।
