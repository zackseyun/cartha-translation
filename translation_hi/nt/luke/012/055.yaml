  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: hi
  text: और जब दक्षिणी हवा चलती है, तो तुम कहते हो, ‘झुलसा देने वाली गर्मी पड़ेगी,’ और ऐसा होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: दक्षिणी हवा
  rationale: इस शब्द का मूल अर्थ ‘दक्षिण’ या ‘दक्षिणी हवा’ हो सकता है; πνέοντα (‘चलती है’) के साथ मौसम-संबंधी संदर्भ में ‘दक्षिणी हवा’ स्वाभाविक और स्पष्ट है।
- source_word: πνέοντα
  choice: चलती है
  rationale: वर्तमान कृदंत हवा के चलने की जारी दशा बताता है; हिन्दी में ‘हवा चलती है’ सहज अभिव्यक्ति है।
- source_word: λέγετε
  choice: तुम कहते हो
  rationale: वर्तमान काल यहाँ लोगों की सामान्य और बार-बार की जानेवाली मौसम-भविष्यवाणी को व्यक्त करता है।
- source_word: Καύσων
  choice: झुलसा देनेवाली गरमी
  rationale: यह संज्ञा तीखी, दाहक गरमी का बोध कराती है; यह चयन उसकी तीव्रता को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔσται
  choice: पड़ेगी
  rationale: गरमी के विषय में हिन्दी का स्वाभाविक प्रयोग ‘गरमी पड़ेगी’ है और यह भविष्यकालीन भविष्यवाणी को स्पष्ट रखता है।
- source_word: γίνεται
  choice: ऐसा ही होता है
  rationale: यह भविष्यवाणी के सच हो जाने को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
