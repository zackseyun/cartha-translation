source:
  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: hi
  text: 'तब उसने उन्हें एक दृष्टान्त सुनाया: “किसी धनी मनुष्य की भूमि ने भरपूर उपज दी।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत फल दिया” अथवा “बहुत उपजाऊ सिद्ध हुई।”
    reason: εὐφόρησεν के वैकल्पिक अर्थ-रूप दिए गए हैं; यूनानी क्रिया प्रचुर उपज और भूमि के फलदायी होने—दोनों ढंग से व्यक्त की जा सकती है।
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: तब उसने ... सुनाया
  rationale: δέ को कथा की स्वाभाविक प्रगति दिखाने वाले हल्के संयोजक ‘तब’ से व्यक्त किया गया है। παραβολή कर्म होने के कारण हिन्दी में ‘दृष्टान्त कहा’ की अपेक्षा ‘दृष्टान्त सुनाया’ अधिक स्वाभाविक है।
- source_word: παραβολὴν
  choice: एक दृष्टान्त
  rationale: ‘दृष्टान्त’ सुसमाचारों में παραβολή की स्थापित, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य अभिव्यक्ति है।
- source_word: πρὸς αὐτοὺς
  choice: उन्हें
  rationale: सम्बोधन का भाव हिन्दी की स्वाभाविक क्रिया-रचना ‘उन्हें ... सुनाया’ में सुरक्षित है।
- source_word: λέγων
  choice: 'सुनाया:'
  rationale: यह कृदन्त दृष्टान्त के कथ्य का परिचय देता है; हिन्दी में उद्धरण से पहले विसर्ग लगाना ‘यह कहते हुए’ की पुनरुक्ति से अधिक सहज है।
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: किसी धनी मनुष्य की
  rationale: ‘किसी’ τινός की अनिश्चितता को बनाए रखता है, और सम्बन्धकारक पदबंध भूमि पर उस धनी मनुष्य के स्वामित्व को व्यक्त करता है।
- source_word: εὐφόρησεν
  choice: भरपूर उपज दी
  rationale: यह क्रिया भूमि के अच्छी तरह फलने या प्रचुर उत्पादन करने को दर्शाती है। ‘भरपूर उपज दी’ आधुनिक हिन्दी में स्पष्ट और कृषि-सन्दर्भ के अनुकूल है।
- source_word: ἡ χώρα
  choice: भूमि
  rationale: यहाँ χώρα किसी देश के बजाय खेती योग्य भूमि या जायदाद को सूचित करता है; ‘भूमि’ उसके कृषि-सन्दर्भ और स्वामित्व—दोनों के अनुकूल है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए λέγων को अलग से शाब्दिक रूप में न दोहराकर उद्धरण के परिचय में समाहित किया गया है।
