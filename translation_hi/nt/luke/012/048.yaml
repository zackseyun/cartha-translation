id: LUK.12.48
reference: Luke 12:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: hi
  text: पर जो नहीं जानता था, फिर भी उसने मार खाने योग्य काम किए, वह थोड़ी मार खाएगा। हर उस व्यक्ति से जिसे बहुत दिया गया, बहुत माँगा जाएगा; और जिसे उन्होंने बहुत सौंपा, उससे वे और भी अधिक माँगेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उन्होंने’ और ‘वे’ किसके लिए प्रयुक्त हैं, यह स्पष्ट नहीं किया गया है।
    reason: मूल पाठ के अनिश्चित बहुवचन कर्ता को स्पष्ट करने के बजाय उसकी अनिश्चितता बताना।
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: जो नहीं जानता था
  rationale: यह संज्ञा के रूप में प्रयुक्त नकारात्मक कृदंत का स्वाभाविक हिन्दी रूप है और अज्ञान को दोषमुक्ति या जानबूझकर की गई अवज्ञा के रूप में अतिरिक्त रूप से परिभाषित नहीं करता।
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: उसने मार खाने योग्य काम किए
  rationale: यह कर्मों और उनके योग्य दंड के बीच संबंध को बनाए रखता है तथा πληγή की ठोस मार की छवि को अस्पष्ट ‘दंड’ में नहीं बदलता।
- source_word: δαρήσεται ὀλίγας
  choice: वह थोड़ी मार खाएगा
  rationale: δέρω के स्पष्ट पिटाई-संबंधी अर्थ और ὀλίγας के कम मात्रा वाले विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: हर उस व्यक्ति से जिसे बहुत दिया गया
  rationale: सामान्य उत्तरदायित्व के सिद्धांत और यूनानी संबंधवाचक रचना को स्पष्ट हिन्दी में रखता है।
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: बहुत माँगा जाएगा
  rationale: यहाँ ζητέω उत्तरदायित्व के रूप में अपेक्षा या माँग का भाव देता है; ‘माँगा जाएगा’ निष्क्रिय रूप और ‘से’ के अर्थ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρέθεντο
  choice: उन्होंने बहुत सौंपा
  rationale: παρατίθημι यहाँ किसी के भरोसे या देखरेख में देने को दर्शाता है; ‘सौंपा’ संक्षिप्त और प्रचलित हिन्दी है।
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: उससे वे और भी अधिक माँगेंगे
  rationale: यह सक्रिय अनिश्चित बहुवचन को बनाए रखता है, αἰτέω को ‘माँगना’ और περισσότερον को ‘और भी अधिक’ के रूप में व्यक्त करता है।
theological_decisions:
- issue: दंड की छवि का स्वरूप
  choice: ‘मार’ की ठोस और क्रमित दंड की छवि को बनाए रखा गया है।
  alternative: इसे केवल ‘दंड’ कहना या किसी खास साधन से कोड़े लगाए जाने की कल्पना जोड़ना।
  rationale: पद ज्ञान और उत्तरदायित्व के अनुपात में दंड की दृष्टांतात्मक छवि देता है; अनुवाद को न तो इसे अस्पष्ट करना चाहिए, न किसी विशिष्ट अंतिम-न्याय व्यवस्था का विवरण बनाना चाहिए।
- issue: अंतिम उपवाक्य में कर्ता
  choice: ‘उन्होंने’ और ‘वे’ के अनिश्चित बहुवचन को सुरक्षित रखा गया है।
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘लोग’ को कर्ता बनाना।
  rationale: यूनानी पाठ में कर्ता का स्पष्ट नाम नहीं है। किसी विशेष कर्ता को जोड़ना मूल की वास्तविक अनिश्चितता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘मार खाएगा’ ठोस दृष्टांतात्मक भाषा को बनाए रखता है; ‘सौंपा’ उत्तरदायित्व का स्वाभाविक बोध देता है।
