source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: hi
  text: पर यदि परमेश्वर मैदान की घास को[a], जो आज है और कल तंदूर में झोंक दी जाती है[b], इस प्रकार वस्त्र पहनाता है, तो, हे अल्पविश्वासियो, वह तुम्हें कितना अधिक वस्त्र पहनाएगा!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घास’ का अनुवाद ‘वनस्पति’ या ‘हरियाली’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह रोटी पकाने का तंदूर था; सूखी मैदानी घास ईंधन के रूप में झोंकी जा सकती थी।
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: घास
  rationale: यहाँ χόρτος मैदान में उगने वाली अल्पजीवी घास या वनस्पति को दर्शाता है। ‘घास’ सहज और प्रसंगानुकूल है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν ἀγρῷ
  choice: मैदान की
  rationale: यह प्रयोग घास के खुले मैदान में होने का सामान्य भाव रखता है। हिंदी में ‘मैदान की घास’ स्वाभाविक है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: जो आज है और कल ... झोंक दी जाती है
  rationale: यूनानी कृदंत-रचना को स्पष्ट हिंदी वाक्य में विस्तृत किया गया है, जिससे घास की क्षणभंगुरता और आज-कल का विरोध बना रहता है।
- source_word: κλίβανον
  choice: तंदूर
  rationale: κλίβανος रोटी पकाने के मिट्टी के ओवन को दर्शा सकता है। ‘तंदूर’ आधुनिक हिंदी पाठक के लिए ठोस और सांस्कृतिक रूप से बोधगम्य शब्द है; इसे आधुनिक औद्योगिक भट्ठी समझने से बचाने के लिए पादटिप्पणी दी गई है।
- source_word: ἀμφιέζει
  choice: पहनाता है
  rationale: क्रिया का मूल अर्थ वस्त्र पहनाना या सजाना है। ‘पहनाता है’ आस-पास के वस्त्र-विषयक प्रसंग और मनुष्यों से की गई तुलना दोनों को बनाए रखता है।
- source_word: πόσῳ μᾶλλον
  choice: कितना अधिक
  rationale: यह छोटे से बड़े की ओर दिए गए तर्क की मानक तुलनात्मक अभिव्यक्ति है और हिंदी में स्वाभाविक है।
- source_word: ὀλιγόπιστοι
  choice: हे अल्पविश्वासियो
  rationale: संबोधन को प्रत्यक्ष रखा गया है। ‘अल्पविश्वासी’ विश्वास की कमी पर हल्की फटकार व्यक्त करता है, पर इसे अविश्वास या धर्मत्याग के तकनीकी दावे में नहीं बदलता।
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: δέ पिछले कथन से जुड़े हल्के विरोध या तर्कगत मोड़ को दिखाता है; ‘पर यदि’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: ὁ θεός का स्पष्ट और प्रतिष्ठित आधुनिक हिंदी समतुल्य।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह परमेश्वर द्वारा घास को पहनाने की रीति की ओर संकेत करता है और यूनानी बल को स्पष्ट रखता है।
theological_decisions:
- issue: ὀλιγόπιστοι संबोधन का भाव
  choice: 'सीधी किंतु संयत फटकार: ‘हे अल्पविश्वासियो’'
  alternative: ‘तुम अविश्वासियो’ अथवा केवल वर्णनात्मक ‘तुम्हारा विश्वास थोड़ा है’
  rationale: यह शब्द परमेश्वर पर अपर्याप्त भरोसे को चुनौती देता है, पर उद्धारकारी विश्वास की अनुपस्थिति या धर्मत्याग का तकनीकी निष्कर्ष नहीं देता। संबोधन का प्रत्यक्ष और चरवाहीपूर्ण तनाव बनाए रखा गया है।
- issue: πόσῳ μᾶλλον में निहित आश्वासन
  choice: ‘वह तुम्हें कितना अधिक पहनाएगा!’
  alternative: 'प्रश्नात्मक रूप: ‘तो वह तुम्हें कितना अधिक नहीं पहनाएगा?’'
  rationale: यूनानी में यह अल्प से महत् की ओर जाने वाला अलंकारिक आश्वासन है। सकारात्मक हिंदी रूप इसका निश्चित आश्वासन और विस्मय बनाए रखता है, बिना अतिरिक्त धार्मिक प्रतिज्ञा जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे अल्पविश्वासियो’ प्रत्यक्ष संबोधन के कारण कुछ साहित्यिक है, किंतु यूनानी संबोधन की शक्ति और बाइबलीय गरिमा को स्पष्ट रूप से बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
