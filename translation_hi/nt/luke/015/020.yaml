  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: hi
  text: तब वह उठकर अपने पिता के पास चला गया। पर वह अभी दूर ही था[a] कि उसके पिता ने उसे देख लिया और करुणा से भर गया। वह दौड़कर उसके गले से लिपट गया और उसे बड़े प्यार से चूमा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अभी बहुत दूर था।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया में गहरे स्नेह की तीव्रता है और इसका अर्थ संभवतः “उसे बार-बार चूमा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठकर
  rationale: यह क्रिया-पद पुत्र के निर्णायक रूप से उठने और फिर पिता के पास जाने के क्रम को बनाए रखता है।
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: अपने पिता के पास चला गया
  rationale: ἔρχομαι प्रसंग और दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। हिन्दी कथन में पुत्र के स्थान से गति व्यक्त करने के लिए ‘चला गया’ स्वाभाविक है, और ἑαυτοῦ का भाव ‘अपने’ से स्पष्ट होता है।
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: पर वह अभी दूर ही था
  rationale: यह समकालीन परिस्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है और दूरी पर बल देने वाले μακράν के भाव को सुरक्षित रखता है।
- source_word: ἐσπλαγχνίσθη
  choice: करुणा से भर गया
  rationale: यह गहरी आंतरिक दया और भावनात्मक उद्वेलन को व्यक्त करता है; केवल ‘दया की’ की अपेक्षा मूल क्रिया की तीव्रता बेहतर बनाए रखता है।
- source_word: δραμὼν
  choice: दौड़कर
  rationale: सरल और प्रत्यक्ष रूप से पिता की तत्काल क्रिया व्यक्त करता है।
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: उसके गले से लिपट गया
  rationale: शाब्दिक रूप ‘उसकी गर्दन पर गिर पड़ा’ हिन्दी में भ्रामक या अस्वाभाविक हो सकता है। यह चयन यूनानी मुहावरे में निहित भावपूर्ण आलिंगन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατεφίλησεν
  choice: उसे बड़े प्यार से चूमा
  rationale: καταφιλέω साधारण चुंबन से अधिक स्नेहपूर्ण तीव्रता व्यक्त कर सकता है। यह रूप उस उष्मा को बनाए रखता है, पर पुनरावृत्ति को निश्चित तथ्य नहीं बनाता।
theological_decisions:
- issue: दृष्टांत में पिता की करुणा का चित्रण
  choice: पिता की प्रतिक्रिया को भावनात्मक रूप से सजीव रखा गया है, पर उसका स्पष्ट धर्मवैज्ञानिक रूपक नहीं बनाया गया।
  alternative: भावना को अधिक संयत करना, या पिता को सीधे परमेश्वर बताने वाली व्याख्या जोड़ना।
  rationale: मूल पद स्वयं करुणा, दौड़ने, आलिंगन और चुंबन के द्वारा पिता की पहल को प्रबलता से चित्रित करता है। अनुवाद को यह बल बनाए रखना चाहिए, लेकिन पाठ से आगे बढ़कर धर्मसिद्धान्त नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘गले से लिपट गया’ यूनानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है; भाषा भावपूर्ण है, पर व्याख्यात्मक विस्तार से बचती है।
