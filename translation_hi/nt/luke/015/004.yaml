source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: hi
  text: “तुम में से कौन आदमी है जिसके पास सौ भेड़ें हों और उनमें से एक खो जाए, जो निन्यानबे को खुले देहात में छोड़कर उस खोई हुई भेड़ के पीछे तब तक न जाए, जब तक उसे पा न ले?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्जन स्थान में।” यूनानी शब्द खुले देहात, चराई के क्षेत्र या निर्जन स्थान के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: तुम में से ऐसा कौन आदमी है
  rationale: यह प्रतिनिधिक, व्याकरणतः पुल्लिंग एकवचन प्रश्न है। ‘आदमी’ मूल रूप को बनाए रखता है, जबकि ‘ऐसा कौन’ हिन्दी में अपेक्षित सकारात्मक उत्तर वाला स्वाभाविक आलंकारिक प्रश्न बनाता है।
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: जिसके पास सौ भेड़ें हों
  rationale: सम्बन्धवाचक उपवाक्य हिन्दी में कृदन्त से अधिक स्वाभाविक है और स्वामित्व का अर्थ स्पष्ट रखता है।
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: उनमें से एक खो जाए
  rationale: इस प्रसंग में क्रिया का आशय भेड़ का खो जाना है, जानबूझकर नष्ट करना नहीं। हिन्दी की अकर्मक रचना अर्थ को सहजता से व्यक्त करती है।
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: तो वह निन्यानबे को ... छोड़कर ... न जाए
  rationale: ग्रीक का नकारात्मक आलंकारिक प्रश्न हिन्दी में ‘ऐसा कौन...तो...न जाए?’ द्वारा स्वाभाविक रूप से सुरक्षित है और ‘निन्यानबे’ का संदर्भ भेड़ों से स्पष्ट है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: खुले मैदान में
  rationale: ἔρημος निर्जन स्थान, खुला देहात या चराई का खुला क्षेत्र सूचित कर सकता है। चरवाही के प्रसंग में ‘खुला मैदान’ स्वाभाविक है; ‘निर्जन स्थान’ को पादटिप्पणी में रखा गया है।
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: उस खोई हुई भेड़ के पीछे ... जाए
  rationale: दिशा और खोज—दोनों का भाव ‘पीछे जाए’ में आता है। संज्ञा ‘भेड़’ दोहराने से हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: ἕως εὕρῃ αὐτό
  choice: जब तक उसे पा न ले
  rationale: यह सीमा-सूचक उपवाक्य खोज के उसके मिल जाने तक जारी रहने का अर्थ ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्तात्मक प्रश्न में प्रतिनिधिक पुल्लिंग भाषा
  choice: आदमी
  alternative: व्यक्ति
  rationale: ग्रीक ἄνθρωπος यहाँ पुल्लिंग एकवचन प्रतिनिधिक उदाहरण प्रस्तुत करता है। ‘आदमी’ रूपगत विशेषता बनाए रखता है, पर कथन को केवल पुरुषों तक सीमित नहीं करता।
- issue: निन्यानबे को ἐρήμῳ में छोड़ना
  choice: खुले मैदान में
  alternative: निर्जन स्थान में
  rationale: शब्द के अर्थ-क्षेत्र को किसी उजाड़ रेगिस्तान तक सीमित नहीं किया गया; पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु बोलचाल में सहज आलंकारिक प्रश्न। ‘भेड़ के पीछे जाना’ खोज का भाव संदर्भ से व्यक्त करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में रखा गया है।
