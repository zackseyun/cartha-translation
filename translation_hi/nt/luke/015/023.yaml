lexical_decisions:
- source_word: φέρετε
  choice: ले आओ
  rationale: बहुवचन आज्ञार्थक रूप है। ‘ले आओ’ प्रसंग में स्वाभाविक है और वस्तु को वक्ता के पास लाने का भाव स्पष्ट करता है।
- source_word: μόσχον τὸν σιτευτόν
  choice: पाला-पोसा बछड़ा
  rationale: μόσχος छोटे गोवंश को और σιτευτός विशेष अवसर के लिए खिलाकर पाले गए पशु को सूचित करता है। ‘पाला-पोसा बछड़ा’ सहज आधुनिक हिन्दी में इस आशय को व्यक्त करता है; केवल ‘मोटा बछड़ा’ उसके विशेष रूप से तैयार किए जाने का भाव कम कर देता।
- source_word: θύσατε
  choice: उसे काटो
  rationale: θύω यहाँ भोज के लिए पशु वध करने को सूचित करता है। हिन्दी में पशु को भोजन हेतु मारने के लिए ‘काटो’ स्वाभाविक है और अनावश्यक रूप से स्पष्ट अनुष्ठानिक बलिदान का अर्थ नहीं जोड़ता। व्यापक बलिदान-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: φαγόντες
  choice: हम खाएँ
  rationale: क्रियाविशेषणात्मक भूतकालिक कृदन्त शाब्दिक रूप से ‘खाकर’ हो सकता है, पर εὐφρανθῶμεν के साथ आशय सम्मिलित भोज और उत्सव का है। हिन्दी में समानांतर विधिलिंग ‘हम खाएँ’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: εὐφρανθῶμεν
  choice: आनन्द मनाएँ
  rationale: प्रथम पुरुष बहुवचन प्रेरणार्थक विधिलिंग उत्सवपूर्वक प्रसन्न होने का भाव देता है। ‘आनन्द मनाएँ’ भोज और उत्सव दोनों के प्रसंग में स्पष्ट, वर्तमान और गरिमापूर्ण है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोहराया गया καί आदेशों और सामूहिक उत्सव के आह्वान को क्रमशः जोड़ता है; ‘और’ इस संचयी प्रवाह को बनाए रखता है।
theological_decisions:
- issue: θύσατε में संभावित बलिदान-संबंधी अर्थछाया
  choice: मुख्य पाठ में भोज की तैयारी के अर्थ में ‘उसे काटो’
  alternative: ‘उसका बलिदान करो’
  rationale: θύω बलिदान के लिए पशु वध का अर्थ भी रख सकता है, किंतु इस घरेलू उत्सव के प्रसंग में प्रमुख अर्थ भोज हेतु पशु काटना है। ‘बलिदान करो’ स्पष्ट उपासना-विधि का अर्थ आरोपित कर सकता है जो कथा में आवश्यक नहीं; फिर भी संभावित अर्थछाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; घरेलू आदेश और उत्सव का स्वाभाविक, गरिमापूर्ण स्वर। ‘पाला-पोसा’ सामान्य पाठक के लिए ‘हृष्ट-पुष्ट’ या ‘पुष्ट किया हुआ’ से अधिक सहज है।
