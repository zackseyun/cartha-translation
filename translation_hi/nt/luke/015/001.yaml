lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: रहते थे
  rationale: ἦσαν के साथ वर्तमान कृदंत की परिधीय रचना भूतकाल में जारी या बार-बार होने वाली क्रिया व्यक्त करती है। δέ के लिए अलग संयोजक जोड़ना हिन्दी में आवश्यक नहीं है।
- source_word: αὐτῷ ἐγγίζοντες
  choice: उसके पास आते रहते थे
  rationale: यह स्वाभाविक आधुनिक हिन्दी में निकट आने की जारी अथवा बार-बार होने वाली क्रिया को व्यक्त करता है और ἐγγίζω का स्थानिक भाव बनाए रखता है।
- source_word: πάντες
  choice: सभी
  rationale: यह दोनों उल्लिखित समूहों की व्यापकता पर दिए गए यूनानी बल को स्पष्ट रूप से व्यक्त करता है।
- source_word: οἱ τελῶναι
  choice: कर-वसूलने वाले
  rationale: τελῶναι शासकीय कर या राजस्व वसूलने वालों को सूचित करता है। यह आधुनिक पाठकों के लिए स्पष्ट है और केवल किसी खास प्रकार की चुंगी तक अर्थ को सीमित नहीं करता।
- source_word: οἱ ἁμαρτωλοὶ
  choice: पापी लोग
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण उन लोगों को सूचित करता है जिन्हें पापी माना जाता था; ‘लोग’ हिन्दी में इसे स्वाभाविक बनाता है, बिना व्याख्यात्मक विस्तार के।
- source_word: ἀκούειν αὐτοῦ
  choice: उसकी बात सुनने के लिए
  rationale: अनन्त क्रिया उद्देश्य बताती है। ‘उसकी बात सुनना’ हिन्दी में किसी व्यक्ति की शिक्षा या कथन को ध्यान से सुनने का स्वाभाविक ढंग है।
theological_decisions:
- issue: ‘कर-वसूलने वाले और पापी’ का सामाजिक-धार्मिक प्रभाव
  choice: दोनों श्रेणियों को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
  alternative: कर-वसूलने वाले और समाज से बहिष्कृत अन्य लोग
  rationale: यूनानी पाठ दो पहचाने जाने योग्य समूहों का नाम लेता है। ‘बहिष्कृत’ या ‘कुख्यात’ जैसे शब्द जोड़ने से कथा में निहित तनाव की व्याख्या पाठ के भीतर ही कर दी जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कर-वसूलने वाले’ आज के सामान्य पाठक के लिए ‘चुंगी लेने वाले’ से अधिक व्यापक और स्पष्ट है; जारी या बार-बार आने का पक्ष ‘आते रहते थे’ से व्यक्त किया गया है।
