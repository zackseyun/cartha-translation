  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: hi
  text: पर जब वह होश में आया[a], तो उसने कहा, ‘मेरे पिता के कितने मज़दूरों के पास ज़रूरत से भी अधिक रोटी है[b], और मैं यहाँ भूख से मरा जा रहा हूँ[c]!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब वह अपने आप में आया”; अर्थात जब उसे अपनी दशा का बोध हुआ।
    reason: lexical_alternative
  - marker: b
    text: या “रोटी बची रहती है।”
    reason: lexical_alternative
  - marker: c
    text: या “नष्ट हुआ जा रहा हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: जब वह होश में आया
  rationale: यूनानी मुहावरे का अर्थ अपनी स्थिति का स्पष्ट बोध लौटना है। स्वाभाविक आधुनिक हिन्दी में ‘होश में आया’ यह अर्थ देता है; शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: ἔφη
  choice: उसने कहा
  rationale: कथात्मक एओरिस्ट को हिन्दी में सामान्य भूतकाल से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: μίσθιοι
  choice: मज़दूरों
  rationale: यह वेतन पर काम करने वालों को दर्शाता है, दासों को नहीं। ‘मज़दूर’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: περισσεύονται ἄρτων
  choice: ज़रूरत से भी अधिक रोटी है
  rationale: περισσεύονται बहुतायत अथवा बच रहने जितनी प्रचुरता व्यक्त करता है; यह अनुवाद उस अतिरिक्त उपलब्धता को स्पष्ट रखता है।
- source_word: ἄρτων
  choice: रोटी
  rationale: यूनानी में ठोस शब्द ‘रोटी’ है; इसे सामान्यीकृत करके ‘भोजन’ नहीं किया गया।
- source_word: λιμῷ
  choice: भूख से
  rationale: इस प्रसंग में λιμός अकाल की व्यापक परिस्थिति से अधिक तीव्र भूख को सूचित करता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: यह पिता के घर और पुत्र की वर्तमान दयनीय दशा के बीच स्थानगत तथा परिस्थितिगत विरोध को बनाए रखता है।
- source_word: ἀπόλλυμαι
  choice: मरा जा रहा हूँ
  rationale: वर्तमानकालीन क्रिया जारी विनाश और मृत्यु के निकट पहुँचने की तीव्रता व्यक्त करती है। हिन्दी का यह मुहावरा स्वाभाविक है; व्यापक ‘नष्ट हो रहा हूँ’ विकल्प पादटिप्पणी में सुरक्षित है।
