lexical_decisions:
- source_word: πορευθεὶς
  choice: जाकर
  rationale: यह मुख्य क्रिया से पहले हुई गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: ἐκολλήθη
  choice: के साथ जा लगा
  rationale: यूनानी क्रिया में किसी से निकटता से जुड़ने और उस पर आश्रित हो जाने का भाव है। यह हिन्दी प्रयोग उस सक्रिय, विवशतापूर्ण जुड़ाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἑνὶ τῶν πολιτῶν
  choice: नागरिकों में से एक
  rationale: πολίτης किसी राजनीतिक समुदाय के नागरिक या सदस्य को सूचित करता है; ‘नागरिक’ इसका सीधा और स्पष्ट अनुवाद है।
- source_word: τῆς χώρας ἐκείνης
  choice: उस देश के
  rationale: χώρα के ‘देश’, ‘प्रदेश’ या ‘इलाका’ अर्थ हो सकते हैं; यहाँ पहले वर्णित दूर देश की कथा-संगति में ‘उस देश’ उपयुक्त है।
- source_word: ἔπεμψεν
  choice: उसने उसे ... भेज दिया
  rationale: कर्ता अभी उल्लिखित नागरिक है। ‘भेज दिया’ हिन्दी में पूर्ण हुई क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: अपने खेतों में
  rationale: ἀγρούς बहुवचन है और खेत अथवा कृषि-भूमि को दर्शाता है। ‘अपने’ का संबंध वाक्य के कर्ता, उस नागरिक, से स्पष्ट है।
- source_word: βόσκειν
  choice: चराने के लिए
  rationale: βόσκω पशुओं को चराने या खिलाने का अर्थ देता है। खेतों के प्रसंग में ‘चराने’ स्वाभाविक और सटीक है।
- source_word: χοίρους
  choice: सूअर
  rationale: यह χοίρους का सामान्य, आधुनिक और स्पष्ट हिन्दी पर्याय है।
