source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: hi
  text: पर उसने अपने पिता को उत्तर दिया, ‘देखिए, इतने वर्षों से मैं आपकी सेवा करता आया हूँ[a], और मैंने कभी आपकी आज्ञा नहीं टाली; फिर भी आपने मुझे कभी बकरी का एक बच्चा तक नहीं दिया कि मैं अपने मित्रों के साथ उत्सव मना सकूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक प्रबल अर्थ में, “मैं आपके लिए दास की तरह काम करता आया हूँ।” यूनानी क्रिया δουλεύω का अर्थ “सेवा करना” हो सकता है और अधीनता या दासवत सेवा का अधिक प्रबल भाव भी दे सकता है। यहाँ यह बड़े पुत्र की कटु, शिकायत-भरी आत्म-धारणा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: अपने पिता को उत्तर दिया
  rationale: ‘उत्तर देकर कहा’ यूनानी मुहावरे का अनावश्यक दोहराव होगा; हिंदी में ‘उत्तर दिया’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान खींचने वाला, शिकायत को बल देने वाला संबोधन-सूचक है; पिता के लिए आदरसूचक रूप हिंदी संवाद में स्वाभाविक है।
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: इतने वर्षों से मैं आपके लिए दास की तरह काम करता आया हूँ
  rationale: δουλεύω अधीनस्थ अथवा दासवत सेवा का बोध करा सकता है। शिकायत के कटु स्वर को रखते हुए यह हिंदी में शाब्दिक ‘गुलामी करता हूँ’ से अधिक स्वाभाविक है।
- source_word: ἐντολήν σου παρῆλθον
  choice: आपकी आज्ञा नहीं टाली
  rationale: यहाँ παρέρχομαι का अर्थ आज्ञा का उल्लंघन या उसकी अवज्ञा करना है; ‘आज्ञा टालना’ स्पष्ट, संक्षिप्त और प्रचलित हिंदी है।
- source_word: ἔδωκας ἔριφον
  choice: बकरी का एक बच्चा तक नहीं दिया
  rationale: ἔριφος बकरी के बच्चे को दर्शाता है; ‘तक’ पुत्र की तुलना और शिकायत में निहित न्यूनता पर बल देता है।
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: कि मैं अपने मित्रों के साथ आनंद मनाता
  rationale: उद्देश्यसूचक उपवाक्य और उत्सवी संदर्भ को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: बड़े पुत्र के कथन में δουλεύω का अर्थ-बल
  choice: दास की तरह काम करता आया हूँ
  alternative: आपकी सेवा करता आया हूँ
  rationale: यह कथन वास्तविक कानूनी दासता पर धर्मवैज्ञानिक दावा नहीं करता, बल्कि बड़े पुत्र की कटु आत्म-धारणा प्रकट करता है। मुख्य पाठ में दासवत परिश्रम का बल रखा गया है और नरम अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; पुत्र पिता से ‘आप’ कहता है, पर उसकी शिकायत की तीक्ष्णता बनी रहती है। भाषा गरिमापूर्ण, बोलचाल में सहज और गैर-सांप्रदायिक रखी गई है।
