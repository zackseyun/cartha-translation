  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: hi
  text: उसने उससे कहा, “तुम्हारा भाई आ गया है, और तुम्हारे पिता ने खूब खिलाया-पिलाया हुआ बछड़ा कटवाया है, क्योंकि उन्होंने उसे सकुशल[a] वापस पा लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वस्थ।’ यूनानी शब्द ὑγιαίνοντα का अर्थ ‘स्वस्थ होना’ भी हो सकता है, या इस संदर्भ में अधिक व्यापक रूप से ‘सकुशल’ होना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: लौट आया है
  rationale: क्रिया आगमन और उसके वर्तमान परिणाम को व्यक्त करती है। प्रसंग में भाई घर वापस आया है, इसलिए ‘लौट आया है’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ἔθυσεν
  choice: कटवाया है
  rationale: यहाँ उत्सव के भोज के लिए पशु वध कराने का अर्थ है; ‘बलि चढ़ाया’ अनावश्यक रूप से धार्मिक अनुष्ठान का संकेत दे सकता है। कर्ता पिता है, इसलिए हिंदी में प्रेरणार्थक रूप स्वाभाविक है।
- source_word: μόσχον τὸν σιτευτόν
  choice: पाला-पोसा बछड़ा
  rationale: यह पद विशेष रूप से खिलाकर तैयार किए गए बछड़े को दर्शाता है। ‘पाला-पोसा’ साधारण पाठक के लिए स्वाभाविक है और उत्सव हेतु तैयार पशु का भाव देता है।
- source_word: ὑγιαίνοντα
  choice: भला-चंगा
  rationale: प्रतिभागी रूप स्वस्थ अथवा सकुशल होने का अर्थ दे सकता है। ‘भला-चंगा’ दोनों अर्थों के बीच की व्यापकता को सहज हिंदी में बनाए रखता है।
- source_word: ἀπέλαβεν
  choice: वापस पाया है
  rationale: क्रिया किसी को फिर से पा लेने या वापस प्राप्त करने का भाव रखती है। ‘वापस पाया’ पिता की पुनर्प्राप्ति और राहत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: उसने उससे कहा,
  rationale: δέ यहाँ हल्का संयोजक है और हिंदी में अलग से ‘परन्तु’ आवश्यक नहीं। ὅτι प्रत्यक्ष कथन आरम्भ करता है, जिसे उद्धरण-चिह्नों से व्यक्त किया गया है।
