  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: hi
  text: पर उसने उससे कहा, “बच्चे[a], तू सदा मेरे साथ है, और जो कुछ मेरा है, वह तेरा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेटे।” यूनानी शब्द का शाब्दिक अर्थ “बच्चे” है और यह स्नेहपूर्ण पारिवारिक सम्बोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: बच्चे
  rationale: सम्बोधन रूप τέκνον स्नेहपूर्ण पारिवारिक सम्बोधन है। ‘बच्चे’ मूल के व्यापक अर्थ को बनाए रखता है; ‘बेटे’ प्रसंग के अनुसार सम्भव है, पर यूनानी में यहाँ स्पष्ट पुरुषवाचक υἱός नहीं है।
- source_word: πάντοτε
  choice: सदा
  rationale: πάντοτε का अर्थ ‘हर समय/हमेशा’ है। ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: सम्बन्ध या संगति बताने वाले μετά के अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντα τὰ ἐμὰ
  choice: जो कुछ मेरा है
  rationale: यह नपुंसकलिंग बहुवचन वाक्यांश पिता की समस्त सम्पत्ति को व्यापक रूप से समेटता है; हिन्दी में यह सहज और अर्थपूर्ण है।
- source_word: σά ἐστιν
  choice: वह तेरा है
  rationale: यह यूनानी के ‘तेरा है’ अर्थ और उसकी व्यापक वैधानिक अथवा सम्बन्धपरक सम्भावना को बिना अधिक स्पष्ट किए बनाए रखता है।
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: पर उसने उससे कहा
  rationale: δέ यहाँ बड़े बेटे की शिकायत और पिता के उत्तर के बीच हल्का विरोध दर्शा सकता है। ‘पर’ उस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पिता का स्नेहपूर्ण पारिवारिक सम्बोधन
  choice: τέκνον को ‘बच्चे’ अनुवादित किया गया है
  alternative: ‘बेटे’ अथवा ‘मेरे बेटे’
  rationale: ‘बच्चे’ मूल शब्द की स्नेहपूर्णता और व्यापकता दोनों को बनाए रखता है। ‘बेटे’ प्रसंगानुकूल है, पर मूल में υἱός नहीं है; ‘मेरे बेटे’ एक ऐसा सम्बन्धसूचक सर्वनाम जोड़ता है जो यूनानी में स्पष्ट रूप से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप। ‘तू/तेरा’ यहाँ तिरस्कार नहीं, बल्कि पिता-पुत्र की घनिष्ठता और यूनानी के एकवचन सम्बोधन को व्यक्त करता है।
