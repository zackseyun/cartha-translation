base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: hi
  text: परन्तु उत्सव मनाना और आनन्दित होना आवश्यक था[a], क्योंकि तुम्हारा यह भाई मरा हुआ था और फिर जीवित हो गया[b]; वह खो गया था और मिल गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्सव मनाना और आनन्दित होना उचित था।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “जीवित हुआ”; दृष्टान्त में यह वाक्यांश सम्भवतः पुनर्स्थापन का रूपक है।
    reason: lexical_alternative
  - marker: c
    text: या, “पाया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: उत्सव मनाना
  rationale: भोज और आनन्द के प्रसंग में यह स्वाभाविक आधुनिक हिन्दी है और क्रिया के उत्सवी भाव को स्पष्ट रखती है।
- source_word: χαρῆναι
  choice: आनन्दित होना
  rationale: निकटार्थी दूसरी क्रिया को अलग बनाए रखता है और मूल के दोहरे आनन्द-प्रयोग को नहीं समेटता।
- source_word: ἔδει
  choice: आवश्यक था
  rationale: अपूर्णकालीन निरपेक्ष क्रिया यहाँ नैतिक या परिस्थितिजन्य आवश्यकता व्यक्त करती है; अनुवाद उसके अपेक्षाकृत प्रबल बल को बनाए रखता है।
- source_word: ὁ ἀδελφός σου οὗτος
  choice: तुम्हारा यह भाई
  rationale: सम्बन्धसूचक σου और संकेतवाचक οὗτος दोनों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
- source_word: νεκρὸς ἦν
  choice: मर गया था
  rationale: हिन्दी में पुनर्जीवन के साथ स्वाभाविक विरोध प्रस्तुत करता है; दृष्टान्त में इसका रूपकात्मक अर्थ प्रसंग पर छोड़ा गया है।
- source_word: ἔζησεν
  choice: फिर जीवित हो गया
  rationale: यूनानी में शाब्दिक रूप से ‘जी उठा/जीवित हुआ’ का भाव है; ‘फिर’ मृत्यु-जीवन के विरोध में निहित पुनर्स्थापन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπολωλὼς
  choice: खो गया था
  rationale: सिद्ध कृदन्त की परिणामी अवस्था ‘खोया हुआ’ को यहाँ सहज वाक्यात्मक हिन्दी में व्यक्त करता है।
- source_word: εὑρέθη
  choice: मिल गया
  rationale: कर्मवाच्य ‘पाया गया’ सम्भव है, पर ‘मिल गया’ आधुनिक हिन्दी में स्वाभाविक है और खोने-मिलने की जोड़ी को स्पष्ट रखता है।
theological_decisions:
- issue: ἔζησεν को शारीरिक पुनरुत्थान या रूपकात्मक पुनर्स्थापन के रूप में कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘फिर जीवित हो गया’ रखकर मृत्यु-जीवन का मूल रूपक सुरक्षित रखा गया।
  alternative: ‘जी उठा’ या अर्थ खोलकर ‘फिर लौट आया’
  rationale: दृष्टान्त में यह भाषा पुनर्स्थापन की ओर संकेत करती है, पर अनुवाद को रूपक मिटाकर केवल ‘लौट आया’ नहीं कहना चाहिए और न इसे अनिवार्यतः शारीरिक पुनरुत्थान की तकनीकी भाषा बनाना चाहिए।
- issue: ἔδει की आवश्यकता बनाम उपयुक्तता
  choice: ‘आवश्यक था’
  alternative: ‘उचित था’
  rationale: ἔδει आवश्यकता या बाध्यता का अपेक्षाकृत प्रबल भाव रख सकता है; वैकल्पिक ‘उचित’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘परन्तु’ कथन के प्रत्युत्तरात्मक δέ को दर्शाता है। मूल यूनानी εὑρέθη के लिए अलग पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘मिल गया’ उसका स्वाभाविक हिन्दी कर्मवाच्यार्थ देता है।
