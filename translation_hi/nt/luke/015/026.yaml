  footnotes:
  - marker: a
    text: या, “इसका क्या अर्थ हो सकता है?” यूनानी में अधिक शाब्दिक रूप से है, “ये बातें क्या हो सकती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: मध्यवाच्य कृदंत का भाव है कि उसने किसी को अपने पास बुलाया और फिर उससे पूछा; ‘अपने पास बुलाकर’ इस क्रम और दिशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παίδων
  choice: सेवकों
  rationale: παῖς का अर्थ ‘बालक’ या ‘सेवक’ हो सकता है, पर इस घराने के प्रसंग में उत्सव के विषय में बताए जाने के लिए बुलाया गया व्यक्ति सेवक ही अधिक स्वाभाविक है।
- source_word: ἐπυνθάνετο
  choice: पूछा
  rationale: यह क्रिया जानकारी लेने या पूछताछ करने को दर्शाती है। अपूर्ण काल का जारी रहने वाला पक्ष यहाँ प्रमुख नहीं है, इसलिए स्वाभाविक हिन्दी में ‘पूछा’ उपयुक्त है।
- source_word: τί ἂν εἴη ταῦτα
  choice: यह सब क्या हो सकता है
  rationale: यह अनिश्चितता लिए हुए परोक्ष प्रश्न है। ‘यह सब’ बहुवचन ταῦτα को सामूहिक रूप से स्वाभाविक हिन्दी में व्यक्त करता है, और ‘क्या हो सकता है’ ἄν सहित संभावनार्थक भाव को बनाए रखता है।
