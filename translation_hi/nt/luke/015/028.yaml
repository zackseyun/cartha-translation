  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: hi
  text: पर वह क्रोधित हो गया और भीतर जाने को तैयार नहीं था।[a] तब उसका पिता बाहर आया और उससे विनती करता रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
