    text: या ‘भीतर जाना नहीं चाहता था’ अथवा ‘उसने भीतर जाने से इनकार कर दिया।’
    reason: lexical_alternative
  - marker: b
    text: ‘विनती करता रहा’ का अनुवाद ‘आग्रह करता रहा’ या ‘अनुनय करता रहा’ भी हो सकता है; यूनानी अपूर्ण भूतकाल निरन्तर या बार-बार की गई अपील का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोधित हो गया
  rationale: यहाँ क्रिया का रूप क्रोध की अवस्था आरम्भ होने का भाव दे सकता है। ‘क्रोधित हो गया’ इस परिवर्तन को व्यक्त करता है और ‘आग-बबूला हो गया’ जैसी अधिक तीव्र अभिव्यक्ति से बचता है।
- source_word: δὲ
  choice: पर
  rationale: पहला δέ पिछली आयत के उत्सव और बड़े पुत्र की प्रतिक्रिया के बीच हल्का विरोध दिखाता है; आधुनिक हिन्दी में ‘पर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: भीतर जाने को तैयार नहीं था
  rationale: θέλω के साथ infinitive इच्छा अथवा तत्परता का अभाव व्यक्त करता है। यह अनुवाद उसकी अनिच्छा को स्पष्ट करता है, पर इसे अनिवार्य रूप से औपचारिक इनकार नहीं बनाता।
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: तब उसका पिता
  rationale: दूसरा δέ पिता की प्रत्युत्तरात्मक अगली कार्रवाई प्रस्तुत करता है। ‘तब’ कथा के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना प्रबल कारणात्मकता जोड़े।
- source_word: ἐξελθὼν
  choice: बाहर आया
  rationale: ἐξέρχομαι का कृदन्त घर के भीतर से बाहर आने की क्रिया बताता है; दृश्य के संदर्भ में ‘बाहर आया’ सहज है।
- source_word: παρεκάλει
  choice: विनती करता रहा
  rationale: παρακαλέω यहाँ आग्रहपूर्ण निवेदन बताता है, और अपूर्ण भूतकाल निरन्तर अथवा बार-बार किए गए आग्रह का संकेत देता है। ‘करता रहा’ उस पक्ष को सुरक्षित रखता है।
- source_word: αὐτόν
  choice: उससे
  rationale: सर्वनाम बड़े पुत्र की ओर संकेत करता है; हिन्दी में ‘विनती करना’ के साथ ‘उससे’ स्वाभाविक कारक-रूप है।
theological_decisions:
- issue: पिता के आग्रह का स्वर
  choice: ‘उससे विनती करता रहा’
  alternative: ‘उसे समझाता रहा’ या ‘उससे आग्रह करता रहा’
  rationale: यह पिता की स्वयं बाहर आकर की गई गंभीर और निरन्तर अपील को सुरक्षित रखता है, पर उसके उद्देश्य या परिणाम के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
