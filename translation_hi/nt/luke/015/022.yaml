id: LUK.15.22
reference: Luke 15:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: hi
  text: पर पिता ने अपने दासों[a] से कहा, ‘जल्दी से सबसे अच्छा चोगा[b] निकाल लाओ और उसे वह चोगा पहना दो; उसके हाथ में एक अँगूठी[c] और उसके पैरों में सैंडल पहना दो।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’; यूनानी शब्द घराने के बँधुआ दासों को सूचित करता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ ‘पहला चोगा’; यहाँ सम्भवतः ‘सबसे अच्छा’ या ‘सबसे प्रमुख चोगा’ अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ केवल ‘एक अँगूठी’ कहता है; कुछ लोग इसे पुनः मिली प्रतिष्ठा की सूचक मुहरदार अँगूठी समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: दासों
  rationale: यह शब्द घराने के बँधुआ दासों को सूचित करता है; ‘दास’ उस प्राचीन सामाजिक वास्तविकता को ‘सेवकों’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: Ταχὺ
  choice: जल्दी से
  rationale: यह क्रियाविशेषण तत्काल कार्य करने की पिता की उत्कंठा व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐξενέγκατε
  choice: निकाल लाओ
  rationale: ἐκφέρω यहाँ भीतर या भंडार में रखी वस्तु को बाहर लाने का निर्देश देता है।
- source_word: στολὴν τὴν πρώτην
  choice: सबसे अच्छा चोगा
  rationale: शाब्दिक रूप ‘पहला चोगा’ है, पर प्रसंग में πρῶτος का आशय प्रमुख अथवा सर्वोत्तम होने की अधिक सम्भावना है; ‘चोगा’ लम्बे बाहरी वस्त्र का बोध कराता है।
- source_word: ἐνδύσατε αὐτόν
  choice: इसे पहना दो
  rationale: पहले उल्लिखित चोगे को उस पर पहनाने की ठोस क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: δακτύλιον
  choice: एक अँगूठी
  rationale: मूल शब्द केवल अँगूठी कहता है; उसमें मुहरदार अँगूठी होने का अर्थ जोड़ना पाठ से आगे जाना होगा।
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: उसकी उँगली में
  rationale: यूनानी में ‘उसके हाथ पर/में’ है; अँगूठी के साथ स्वाभाविक हिन्दी ‘उँगली में’ है, यद्यपि उँगली मूल में अलग से निर्दिष्ट नहीं है।
- source_word: ὑποδήματα
  choice: जूतियाँ
  rationale: यह प्राचीन भूमध्यसागरीय संदर्भ के पादत्राण को दर्शाता है; ‘जूतियाँ’ आधुनिक हिन्दी में समझने योग्य और ऐतिहासिक संदर्भ के अनुकूल है।
- source_word: εἰς τοὺς πόδας
  choice: उसके पैरों में
  rationale: पादत्राण पहनाने के लिए हिन्दी का स्वाभाविक प्रयोग ‘पैरों में’ है।
- source_word: δὲ
  choice: पर
  rationale: यह पुत्र की बात से पिता की प्रत्युत्तरात्मक कार्रवाई की ओर हल्का विरोध अथवा कथात्मक मोड़ दिखाता है।
theological_decisions:
- issue: δούλους को ‘दासों’ या ‘सेवकों’ के रूप में प्रस्तुत करना
  choice: दासों
  alternative: सेवकों
  rationale: दृष्टान्त के घराने में इन लोगों की बँधुआ सामाजिक स्थिति को मूल शब्द व्यक्त करता है; ‘दास’ इसे बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के सुरक्षित रखता है।
- issue: στολὴν τὴν πρώτην में πρῶτην का शाब्दिक या मुहावरेदार अर्थ
  choice: सबसे अच्छा चोगा
  alternative: पहला चोगा / प्रमुख चोगा
  rationale: यहाँ क्रम में पहले वस्त्र की अपेक्षा गुणवत्ता या प्रतिष्ठा में सर्वोत्तम वस्त्र अभिप्रेत होने की अधिक सम्भावना है; पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: δακτύλιον को केवल अँगूठी कहना या मुहरदार अँगूठी बनाना
  choice: एक अँगूठी
  alternative: एक मुहरदार अँगूठी
  rationale: अँगूठी पुनर्स्थापित प्रतिष्ठा का संकेत हो सकती है, पर मूल संज्ञा उसके मुहरदार होने को निर्दिष्ट नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘दास’ प्राचीन सामाजिक यथार्थ को बनाए रखता है; ‘निकाल लाओ’ और ‘पहना दो’ बहुवचन आज्ञाओं को स्वाभाविक हिन्दी में व्यक्त करते हैं।
