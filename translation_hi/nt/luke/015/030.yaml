source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: hi
  text: लेकिन जब आपका यह बेटा आया—जिसने वेश्याओं के साथ आपकी संपत्ति उड़ा दी[a]—तो आपने उसके लिए खिलाकर मोटा किया हुआ बछड़ा कटवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खा डाला”; यहाँ यूनानी क्रिया का अर्थ किसी चीज़ को चट कर जाना है, और ‘जीवन-निर्वाह के साधन’ के लिए प्रयुक्त शब्द धन-संपत्ति या जायदाद का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: लेकिन जब
  rationale: δέ यहाँ बड़े बेटे की शिकायत में विरोध का हल्का भाव देता है और ὅτε समयसूचक है; ‘लेकिन जब’ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ υἱός σου οὗτος
  choice: आपका यह बेटा
  rationale: यह अभिव्यक्ति οὗτος के संकेतात्मक और तिरस्कारपूर्ण दूरी बनाने वाले भाव को रखती है; बड़ा बेटा ‘मेरा भाई’ नहीं कहता।
- source_word: ὁ καταφαγών σου τὸν βίον
  choice: जिसने ... आपकी संपत्ति उड़ा दी
  rationale: κατεσθίω का मूल चित्र ‘खा जाना’ है और βίος यहाँ जीवन-निर्वाह के साधन, धन-संपत्ति या जायदाद को सूचित करता है। हिंदी में ‘संपत्ति उड़ा दी’ उस विनाशकारी अपव्यय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; मूल का सजीव रूपक पादटिप्पणी में दिया गया है।
- source_word: μετὰ πορνῶν
  choice: वेश्याओं के साथ
  rationale: आरोप को बिना नरम किए आधुनिक, सीधी हिंदी में व्यक्त करता है।
- source_word: ἦλθεν
  choice: आया
  rationale: यूनानी पाठ केवल ‘आया’ कहता है; प्रसंग से लौटना निहित होने पर भी अनुवाद में ‘लौटा’ जोड़ना आवश्यक नहीं।
- source_word: ἔθυσας
  choice: कटवाया
  rationale: यहाँ θύω भोज के लिए पशु वध करने को सूचित करता है। पिता ने स्वयं वध किया, यह हिंदी में अनावश्यक रूप से निहित न हो, इसलिए स्वाभाविक कारक रूप ‘कटवाया’ चुना गया है; इससे बलिदान का धार्मिक अर्थ भी नहीं जुड़ता।
- source_word: τὸν σιτευτὸν μόσχον
  choice: पाला-पोसा बछड़ा
  rationale: σιτευτός उस बछड़े को बताता है जिसे विशेष रूप से खिला-पिलाकर भोज के लिए तैयार किया गया था। ‘पाला-पोसा बछड़ा’ सामान्य हिंदी में समझने योग्य है और केवल स्वाभाविक मोटेपन के बजाय जानबूझकर तैयार किए जाने का भाव देता है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सम्प्रदान कारक यहाँ लाभार्थी या सम्मानित व्यक्ति को सूचित करता है—बछड़ा उसके स्वागत में कटवाया गया।
theological_decisions:
- issue: वेश्याओं के साथ संपत्ति नष्ट करने की बात को सिद्ध तथ्य मानना या बड़े बेटे का आरोप
  choice: मुख्य पाठ में बड़े बेटे के आरोप को उसके सीधे कथन के रूप में रखा गया है, बिना किसी अतिरिक्त योग्यता के।
  alternative: ‘जिसने कथित रूप से...’ अथवा पद 13 के आधार पर केवल ‘जिसने संपत्ति उड़ा दी’
  rationale: इस पद में ये शब्द बड़े बेटे के हैं, कथावाचक की स्वतंत्र पुष्टि नहीं। ‘कथित रूप से’ जोड़ना कथन को कमजोर करता, जबकि आरोप को हटाना या समरस करना कथा के तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; पिता के लिए आदरसूचक ‘आप’ रखा गया है। भाषा सीधी और गरिमापूर्ण है, जबकि बड़े बेटे के तिरस्कार और तीखे आरोप को नरम नहीं किया गया।
