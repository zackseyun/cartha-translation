  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: hi
  text: और जब वह उसे पा लेती है, तो अपनी सहेलियों और पड़ोसियों को बुलाकर कहती है, ‘मेरे साथ आनंद मनाओ, क्योंकि मैंने वह द्राखमा[a] पा लिया है जिसे मैंने खो दिया था।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: द्राखमा यूनानी चाँदी का एक सिक्का था, जिसका मूल्य कई प्रसंगों में एक मज़दूर की लगभग एक दिन की मज़दूरी के बराबर था।
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: जब वह उसे पा लेती है
  rationale: स्त्रीलिंग कर्ता को बनाए रखते हुए एओरिस्ट कृदन्त को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है; ‘उसे’ प्रसंग में खोए हुए सिक्के की ओर संकेत करता है।
- source_word: συγκαλεῖ
  choice: बुलाकर
  rationale: यूनानी वर्तमान काल की जीवंत कथात्मक गति को मुख्य क्रिया ‘कहती है’ के साथ स्वाभाविक हिन्दी क्रम में रखा गया है; भाव है लोगों को अपने पास एकत्र होने के लिए बुलाना।
- source_word: φίλας καὶ γείτονας
  choice: अपनी सहेलियों और पड़ोसिनों
  rationale: φίλας का स्त्रीलिंग बहुवचन ‘सहेलियों’ से स्पष्ट है; समन्वित γείτονας को प्रसंगानुसार ‘पड़ोसिनों’ कहना स्त्रियों के सामाजिक समूह को स्वाभाविक और लिंग-सटीक ढंग से व्यक्त करता है।
- source_word: Συγχάρητέ μοι
  choice: मेरे साथ आनन्द मनाओ
  rationale: बहुवचन आज्ञार्थक का अर्थ उसके आनन्द में सहभागी होना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह साथ आनन्द मनाने का कारण प्रस्तुत करता है।
- source_word: εὗρον
  choice: मैंने ... पा लिया है
  rationale: एओरिस्ट की पूर्ण घटना को प्रत्यक्ष वचन में वर्तमान परिणाम सहित स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: δραχμὴν
  choice: द्राखमा
  rationale: विशिष्ट यूनानी सिक्के का नाम सुरक्षित रखा गया है और सांस्कृतिक जानकारी पादटिप्पणी में दी गई है।
- source_word: ἣν ἀπώλεσα
  choice: जिसे मैंने खो दिया था
  rationale: सम्बन्धवाचक उपवाक्य सिक्के की पहचान करता है; ‘था’ पाने से पहले हुई हानि का कालक्रम स्पष्ट करता है।
theological_decisions: []
