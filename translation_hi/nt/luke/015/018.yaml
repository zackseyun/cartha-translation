  source_fidelity: '‘मैं उठकर … जाऊँगा’ correctly represents the participle-plus-future construction, and ‘अपने पिता के पास’ adequately conveys πρὸς τὸν πατέρα μου. The confession preserves the distinct source expressions: εἰς τὸν οὐρανὸν as ‘स्वर्ग के विरुद्ध’ and ἐνώπιόν σου as ‘आपके सामने,’ without conflating the latter with ‘आपके विरुद्ध.’'
