id: LUK.15.18
reference: Luke 15:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: hi
  text: मैं उठकर अपने पिता के पास जाऊँगा और उनसे कहूँगा, ‘पिता, मैंने स्वर्ग के विरुद्ध[a] और आपके सामने[b] पाप किया है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के विरुद्ध’; यहाँ ‘स्वर्ग’ संभवतः परमेश्वर का नाम सीधे लेने के बजाय उनके लिए प्रयुक्त श्रद्धापूर्ण अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपकी दृष्टि में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: मैं उठकर
  rationale: अओरिस्ट कृदंत मुख्य भविष्यकालीन क्रिया से पहले होने वाली पहली कार्रवाई बताता है। ‘उठकर’ हिंदी में क्रम और ठोस शारीरिक गति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πορεύσομαι
  choice: जाऊँगा
  rationale: यह भविष्यकालीन रूप पिता की ओर जाने के निश्चय को व्यक्त करता है; ‘जाऊँगा’ सरल, स्पष्ट और प्रसंगानुकूल है।
- source_word: πρὸς τὸν πατέρα μου
  choice: अपने पिता के पास
  rationale: πρός यहाँ किसी व्यक्ति की ओर जाकर उसके पास पहुँचने का भाव देता है। हिंदी में ‘अपने पिता के पास’ संबंध और गंतव्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐρῶ αὐτῷ
  choice: उनसे कहूँगा
  rationale: λέγω का भविष्यकाल और दत्तिव सर्वनाम प्रत्यक्ष कथन की भूमिका बाँधते हैं। पिता के लिए आदरसूचक ‘उनसे’ आधुनिक मानक हिंदी में स्वाभाविक है।
- source_word: Πάτερ
  choice: पिता
  rationale: यह प्रत्यक्ष संबोधन है। ‘पिता’ मूल में निहित संबोधन को बिना ‘मेरे’ या किसी अतिरिक्त स्नेहसूचक पद के बनाए रखता है।
- source_word: ἥμαρτον
  choice: मैंने ... पाप किया है
  rationale: अओरिस्ट एक घटित कार्य को स्वीकार करता है, जबकि हिंदी का पूर्ण वर्तमान उस पाप की वर्तमान नैतिक प्रासंगिकता सहित स्वीकारोक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸν οὐρανὸν
  choice: स्वर्ग के विरुद्ध
  rationale: मूल पाठ का ‘स्वर्ग’ संभवतः परमेश्वर के लिए श्रद्धापूर्ण परोक्ष अभिव्यक्ति है। उसे मुख्य पाठ में बनाए रखने से मूल रूपक और उसकी अर्थगत गहराई सुरक्षित रहती है।
- source_word: ἐνώπιόν σου
  choice: आपके सामने
  rationale: ἐνώπιον का मूल भाव किसी की उपस्थिति या दृष्टि के सामने होना है। ‘आपके सामने’ पिछले ‘के विरुद्ध’ से अलग शब्दावली रखते हुए संबंधपरक और नैतिक भाव बनाए रखता है।
theological_decisions:
- issue: क्या ‘स्वर्ग’ को मुख्य पाठ में सीधे ‘परमेश्वर’ कर दिया जाए
  choice: मुख्य पाठ में ‘स्वर्ग’ बनाए रखा गया है।
  alternative: ‘मैंने परमेश्वर के विरुद्ध और आपके विरुद्ध पाप किया है।’
  rationale: οὐρανός संभवतः परमेश्वर के लिए श्रद्धापूर्ण परोक्ष संकेत है, फिर भी यूनानी पाठ स्पष्ट रूप से ‘स्वर्ग’ कहता है। इसे बनाए रखने से पाठ की वास्तविक अभिव्यक्ति और धर्मवैचारिक तनाव सुरक्षित रहते हैं; पादटिप्पणी संभावित आशय स्पष्ट करती है।
- issue: ἐνώπιόν σου को ‘आपके विरुद्ध’ या ‘आपके सामने’ कहना
  choice: ‘आपके सामने’ चुना गया है।
  alternative: ‘आपके विरुद्ध’ अथवा ‘आपकी दृष्टि में’
  rationale: ‘आपके सामने’ मूल के स्थानिक, संबंधपरक और न्यायिक आयामों को खुला रखता है। ‘आपके विरुद्ध’ इसे पहले वाक्यांश के समान बना देता और मूल की भिन्न रचना मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पुत्र द्वारा पिता के संबोधन में आदरसूचक ‘आप/उन’ का प्रयोग हिंदी में स्वाभाविक पारिवारिक सम्मान व्यक्त करता है; यूनानी एकवचन सर्वनाम स्वयं आदर-स्तर निर्धारित नहीं करता। पादटिप्पणी-चिह्न उन्हीं पदबंधों पर लगाए गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
