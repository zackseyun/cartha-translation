    text: या, अधिक शाब्दिक रूप से, ‘पाया गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिता द्वारा उत्सव का कारण बताने वाला स्वाभाविक कारणसूचक संयोजक है।
- source_word: οὗτος ὁ υἱός μου
  choice: मेरा यह बेटा
  rationale: यह हिन्दी में स्वाभाविक रहते हुए οὗτος के संकेतात्मक बल और पिता के आत्मीय संबंध, दोनों को बनाए रखता है।
- source_word: νεκρὸς ἦν
  choice: मर गया था
  rationale: सन्दर्भ में यह रूप स्वाभाविक हिन्दी में पूर्व स्थिति व्यक्त करता है और मूल के तीखे मृत्यु-जीवन रूपक को नरम नहीं करता।
- source_word: ἀνέζησεν
  choice: फिर जी उठा है
  rationale: ἀναζάω के फिर जीवित होने के अर्थ और बहाली के वर्तमान परिणाम को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: ἦν ἀπολωλὼς
  choice: वह खो गया था
  rationale: लूका 15 के खोए और मिलने के केंद्रीय प्रतिमान को बनाए रखते हुए पूर्व अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὑρέθη
  choice: मिल गया है
  rationale: ग्रीक के कर्मवाच्य का कर्ता अनिर्दिष्ट रखता है; हिन्दी में अकर्मक परिणामात्मक रूप स्वाभाविक है और वर्तमान में मिली हुई अवस्था पर बल देता है।
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: वे उत्सव मनाने लगे
  rationale: ἤρξαντο का आरम्भसूचक बल सुरक्षित है और भोज के सन्दर्भ में εὐφραίνεσθαι के आनन्दपूर्ण उत्सव का आधुनिक, सहज हिन्दी रूप है।
theological_decisions:
- issue: ‘मर गया था’ और ‘फिर जी उठा’ की रूपकात्मक शक्ति
  choice: मूल के मृत्यु और फिर जीवित होने के शब्दों को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘हमारे लिए मरे समान था और आत्मिक अथवा सामाजिक रूप से लौट आया’ जैसा स्पष्टार्थक कथन।
  rationale: कहानी में ये शब्द अलगाव और पुनर्बहाली के रूपक हैं, पर मूल जानबूझकर तीखी मृत्यु-जीवन भाषा प्रयोग करता है; अनुवाद को इस धार्मिक और साहित्यिक तनाव को स्वयं हल नहीं करना चाहिए।
- issue: εὑρέθη में खोजने वाले कर्ता की पहचान
  choice: ‘मिल गया है’ कहकर कर्ता अनिर्दिष्ट रखा गया है।
  alternative: ‘हमने उसे पा लिया है’ या ‘परमेश्वर ने उसे खोज लिया है।’
  rationale: ग्रीक कर्मवाच्य किसी कर्ता का स्पष्ट नाम नहीं लेता; इसलिए मानवीय या दैवी कर्ता जोड़ना मूल की खुली अर्थ-संभावना को अनावश्यक रूप से सीमित करता।
