  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘बेटा’ सामान्य पाठक के लिए आत्मीय और स्वाभाविक है। मृत्यु/जीवन तथा खोने/मिलने की समानांतर संरचना सुरक्षित रखी गई है।
