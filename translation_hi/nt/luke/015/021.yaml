id: LUK.15.21
reference: Luke 15:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: hi
  text: पर पुत्र ने उससे कहा, “पिता, मैंने स्वर्ग के विरुद्ध[a] और आपके सामने पाप किया है। अब मैं आपका पुत्र कहलाने योग्य नहीं हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “स्वर्ग” परमेश्वर का नाम सीधे लेने के बजाय उनके लिए प्रयुक्त एक श्रद्धापूर्ण अभिव्यक्ति है; कुछ अनुवाद इसका अर्थ खोलकर “परमेश्वर के विरुद्ध” लिखते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियाँ पुत्र के कथन को इन अर्थ वाले शब्दों के साथ आगे बढ़ाती हैं: “मुझे अपने मज़दूरों में से एक के समान रख लीजिए।” यह पद 19 के अनुरूप है; SBLGNT का पाठ कथन को “आपका पुत्र” पर समाप्त करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: पर ... ने कहा
  rationale: δέ एक हल्का संयोजक है; यहाँ “पर” पिता के स्वागतपूर्ण व्यवहार के बाद पुत्र की अपराध-स्वीकृति की ओर कथा के मोड़ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ υἱὸς αὐτῷ
  choice: पुत्र ने उससे कहा
  rationale: यूनानी पदक्रम और सर्वनाम को बनाए रखते हुए यह हिंदी में स्पष्ट और स्वाभाविक है; “पुत्र” प्रसंग से निश्चित व्यक्ति को दर्शाता है।
- source_word: Πάτερ
  choice: पिता
  rationale: सम्बोधन रूप का सीधा और स्वाभाविक अनुवाद; मूल में निहित न होने के कारण “मेरे” नहीं जोड़ा गया।
- source_word: ἥμαρτον
  choice: मैंने ... पाप किया है
  rationale: अपराध-स्वीकृति के प्रसंग में यूनानी एओरिस्ट को वर्तमान प्रासंगिकता वाले पूर्ण कार्य के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: εἰς τὸν οὐρανὸν
  choice: स्वर्ग के विरुद्ध
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण यहूदी परोक्ष अभिव्यक्ति है। मुख्य पाठ में यूनानी रूप को सुरक्षित रखा गया है और अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: καὶ ἐνώπιόν σου
  choice: और आपके सामने
  rationale: ἐνώπιον का मूल भाव “सामने/उपस्थिति में” है। यह अनुवाद संबंधपरक भाव बनाए रखता है और इसे अधिक व्याख्यात्मक “आपके विरुद्ध” में नहीं बदलता।
- source_word: οὐκέτι
  choice: अब ... नहीं
  rationale: समयगत परिवर्तन और “अब और नहीं” के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἄξιος
  choice: योग्य
  rationale: पश्चात्ताप और पारिवारिक संबंध के संदर्भ में नैतिक तथा संबंधपरक पात्रता का भाव व्यक्त करता है।
- source_word: κληθῆναι
  choice: कहलाने
  rationale: καλέω के कर्मवाच्य अनंत रूप का स्वाभाविक हिंदी प्रतिरूप है।
- source_word: υἱός σου
  choice: आपका पुत्र
  rationale: पुत्र होने की उस पारिवारिक पहचान को बनाए रखता है जिसे वक्ता धारण करने के योग्य स्वयं को नहीं मानता।
theological_decisions:
- issue: पाप-स्वीकार में “स्वर्ग” का अर्थ
  choice: “स्वर्ग के विरुद्ध” को मुख्य पाठ में यथावत रखा गया और इसे परमेश्वर के लिए श्रद्धापूर्ण परोक्ष संकेत के रूप में समझाया गया।
  alternative: व्याख्यात्मक रूप से “परमेश्वर के विरुद्ध” कहना।
  rationale: यूनानी पाठ स्पष्ट रूप से “स्वर्ग” कहता है। मूल अभिव्यक्ति को बनाए रखना वास्तविक सांस्कृतिक और धर्मवैचारिक स्वर को सुरक्षित रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
- issue: इस पद में पुत्र के कथन की सीमा
  choice: SBLGNT के अनुसार कथन “आपका पुत्र” पर समाप्त किया गया।
  alternative: पद 19 के अनुरूप “मुझे अपने मज़दूरों में से एक के समान रख लीजिए” जैसे शब्द जोड़ना।
  rationale: प्रदत्त मूल पाठ यहीं कथन समाप्त करता है। कुछ पांडुलिपियों में मिले लंबे पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। पिता के प्रति पुत्र के सम्बोधन में आदरसूचक “आप” रखा गया है। मूल की “स्वर्ग” वाली अभिव्यक्ति और “आपके सामने” की स्थानिक-संबंधपरक छवि को अनावश्यक व्याख्या के बिना सुरक्षित रखा गया है।
