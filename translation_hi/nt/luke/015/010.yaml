  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: hi
  text: इसी प्रकार[a] मैं तुमसे कहता हूँ कि एक पापी के मन फिराने पर परमेश्वर के स्वर्गदूतों के सामने[b] आनन्द होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस प्रकार’ अथवा ‘ऐसे ही’।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में आनन्द ‘परमेश्वर के स्वर्गदूतों के सामने’ होने की बात है; यह स्पष्ट रूप से नहीं कहा गया कि स्वर्गदूत स्वयं आनन्द कर रहे हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले दृष्टान्त से निष्कर्ष और समानता दोनों को व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: सीधे सम्बोधन और यीशु के बलपूर्ण कथन-सूत्र को सहज हिन्दी में बनाए रखता है।
- source_word: γίνεται χαρά
  choice: आनन्द होता है
  rationale: आनन्द के उत्पन्न या विद्यमान होने का भाव देता है, बिना किसी अनकहे कर्ता को जोड़ने के।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: उपस्थिति के स्थानिक/दरबारी भाव को सुरक्षित रखता है और यह नहीं कहता कि स्वर्गदूत ही आनन्द करने वाले हैं।
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: सम्बन्धवाचक यूनानी रचना का स्पष्ट और प्रतिष्ठित हिन्दी रूप है।
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: एक पापी के ... पर
  rationale: यह उस अवसर या कारण को व्यक्त करता है जिस पर आनन्द होता है।
- source_word: μετανοοῦντι
  choice: मन फिराने
  rationale: पश्चात्ताप के अर्थ-क्षेत्र को सामान्य आधुनिक हिन्दी में व्यक्त करता है, पर पद में न दी गई विस्तृत धर्मशास्त्रीय व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: पश्चात्ताप की भाषा
  choice: मन फिराने
  alternative: पश्चात्ताप करने
  rationale: ‘मन फिराना’ μετανοέω की दिशा-परिवर्तन और अंतर्मन के बदलाव की व्यापकता को सहज हिन्दी में रखता है; इसे केवल भावना या पछतावे तक सीमित नहीं करता।
- issue: आनन्द का स्थान अथवा कर्ता
  choice: परमेश्वर के स्वर्गदूतों के सामने आनन्द होता है
  alternative: परमेश्वर के स्वर्गदूत आनन्द करते हैं
  rationale: मूल यूनानी आनन्द को स्वर्गदूतों ‘के सामने’ बताता है, पर स्पष्ट रूप से स्वर्गदूतों को उसका कर्ता नहीं कहता। चुना हुआ रूप इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के लिए सहज। ‘आनन्द’ और ‘परमेश्वर’ बाइबलीय गरिमा रखते हुए सामान्य पाठकों के लिए परिचित हैं।
