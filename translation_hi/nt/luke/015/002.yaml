  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: hi
  text: और फरीसी और शास्त्री दोनों यह कहते हुए बड़बड़ा रहे थे, “यह आदमी पापियों का स्वागत[a] करता है और उनके साथ खाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापियों को ग्रहण करता है और उनके साथ खाता है।”
    reason: προσδέχεται के अधिक औपचारिक, निकट-शाब्दिक विकल्प को पूरे संबद्ध वाक्यांश में स्पष्ट करता है।
lexical_decisions:
- source_word: διεγόγγυζον
  choice: कुड़कुड़ा रहे थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली क्रिया दिखाता है। ‘कुड़कुड़ा रहे थे’ दबे स्वर में असंतोष और शिकायत करने की नकारात्मक ध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: फरीसी और शास्त्री—दोनों
  rationale: ‘दोनों’ τε ... καί की सहसंबंधी शक्ति को बनाए रखता है। ‘शास्त्री’ सुसमाचारों के संदर्भ में γραμματεῖς का प्रचलित और संक्षिप्त हिन्दी रूप है।
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: कृदंत मुख्य क्रिया के साथ-साथ चल रहे कथन को दर्शाता है; ‘यह कहते हुए’ हिन्दी में इस संबंध को स्पष्ट और सहज रखता है।
- source_word: Οὗτος
  choice: यह आदमी
  rationale: संकेतवाचक सर्वनाम में यहाँ दूरी बनाने या कुछ तिरस्कार का भाव हो सकता है। ‘यह आदमी’ उस संभावित लहजे को ‘वह’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: ἁμαρτωλοὺς
  choice: पापियों
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का सीधा और प्रचलित अनुवाद ‘पापी’ है; यह आरोप में निहित सामाजिक-धार्मिक श्रेणी को बनाए रखता है।
- source_word: προσδέχεται
  choice: स्वागत करता है
  rationale: क्रिया का आशय लोगों को अनुकूल भाव से अपने पास आने देना या ग्रहण करना है। ‘स्वागत करता है’ आधुनिक हिन्दी में स्वाभाविक है और सकारात्मक ग्रहणशीलता व्यक्त करता है।
- source_word: συνεσθίει αὐτοῖς
  choice: उनके साथ खाता है
  rationale: संयुक्त क्रिया और दत्तिव संबंध साथ भोजन करने को बताते हैं। यह सीधा अनुवाद संगति-भोज के सामाजिक महत्व को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: यीशु का पापियों को ग्रहण करना और उनके साथ भोजन करना
  choice: आरोप को सीधे शब्दों में रखते हुए ‘स्वागत करता है और उनके साथ खाता है’ कहना
  alternative: ‘पापियों को ग्रहण करता है और उनके साथ खाता है’
  rationale: पद में फरीसियों और शास्त्रियों की आपत्ति यीशु द्वारा ‘पापियों’ को अनुकूल भाव से ग्रहण करने और उनके साथ मेज की संगति रखने पर है। अनुवाद इस आपत्ति की तीक्ष्णता को बनाए रखता है, पर पाठ से आगे बढ़कर किसी विशेष धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘कुड़कुड़ा रहे थे’ शिकायत भरे दबे स्वर को व्यक्त करता है; ‘फरीसी’ और ‘शास्त्री’ परिचित बाइबलीय पद हैं। उद्धरण में वर्तमान काल मूल यूनानी के नाटकीय प्रत्यक्ष कथन को बनाए रखता है।
