source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: hi
  text: पर जब वह सब कुछ खर्च कर चुका, तो उस पूरे देश[a] में भयंकर अकाल पड़ा, और उसे तंगी होने लगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पूरे इलाके में।’
    reason: χώρα का अर्थ संदर्भ के अनुसार ‘देश’ या ‘इलाका/क्षेत्र’ हो सकता है।
  - marker: b
    text: या, ‘उसे कमी होने लगी’ या ‘वह अभाव में पड़ने लगा।’
    reason: ἤρξατο ὑστερεῖσθαι आरंभ होने वाली कमी या अभाव की अवस्था को व्यक्त करता है।
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: जब वह सब कुछ खर्च कर चुका
  rationale: संबंधकारक निरपेक्ष रचना और भूतकालिक कृदंत को स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है। ‘खर्च’ δαπανάω का सीधा अर्थ देता है; ‘उड़ा दिया’ जैसा मूल्यांकन इस पद के क्रिया-शब्द में स्वयं अनिवार्य नहीं है।
- source_word: δέ
  choice: पर
  rationale: यह कथा में समृद्धि से संकट की ओर मोड़ और हल्का विरोध दिखाता है।
- source_word: ἐγένετο
  choice: पड़ा
  rationale: अकाल के साथ हिंदी में ‘अकाल पड़ा’ घटना के आरंभ को व्यक्त करने वाला स्वाभाविक मुहावरा है।
- source_word: λιμὸς ἰσχυρά
  choice: भयंकर अकाल
  rationale: ἰσχυρά यहाँ अकाल की तीव्रता बताता है; ‘भयंकर’ आधुनिक हिंदी में गंभीरता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: उस पूरे देश में
  rationale: κατά + कर्मकारक का क्षेत्रभर में विस्तार का भाव ‘पूरे’ से व्यक्त होता है। χώρα को कथा के दूर देश के संदर्भ में ‘देश’ कहा गया है, यद्यपि ‘इलाका’ भी संभव है।
- source_word: ἤρξατο ὑστερεῖσθαι
  choice: उसे तंगी होने लगी
  rationale: ‘होने लगी’ आरंभसूचक ἤρξατο को और ‘तंगी’ संसाधनों की कमी वाले ὑστερεῖσθαι को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: αὐτὸς
  choice: उसे
  rationale: स्पष्ट यूनानी सर्वनाम का संदर्भ हिंदी के स्वाभाविक दत्तिवाचक प्रयोग में बनाए रखा गया है; ‘वह स्वयं’ कहना यहाँ अनावश्यक रूप से भारी होता।
