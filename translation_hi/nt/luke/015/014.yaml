translation_notes:
  register: भाषा आधुनिक, सहज और कथात्मक रखी गई है। ‘अकाल पड़ा’ और ‘तंगी होने लगी’ सामान्य हिंदी के स्वाभाविक प्रयोग हैं; अर्थ को अनावश्यक नैतिक रंग देने वाले ‘सब उड़ा दिया’ से बचा गया है।
