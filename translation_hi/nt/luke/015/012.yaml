base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: hi
  text: और उनमें से छोटे ने पिता से कहा, “पिताजी, सम्पत्ति का जो हिस्सा मेरे भाग में आता है, वह मुझे दे दीजिए।” तब पिता ने अपने जीवन-निर्वाह के साधन[a] उन दोनों में बाँट दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “जीवन” या “जीविका” (βίον); यहाँ आशय पिता की सम्पत्ति अथवा जीवन-निर्वाह के साधनों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: छोटे
  rationale: तुलनात्मक विशेषण यहाँ संज्ञा की तरह प्रयुक्त है—‘छोटा [पुत्र]’। प्रसंग से ‘पुत्र’ स्पष्ट है, पर यूनानी में इस पद में वह शब्द नहीं है।
- source_word: δός μοι
  choice: मुझे दे दीजिए
  rationale: आज्ञार्थक रूप को पुत्र द्वारा पिता से किए गए सीधे अनुरोध के रूप में स्वाभाविक और आदरपूर्ण आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: τὸ ἐπιβάλλον μέρος τῆς οὐσίας
  choice: सम्पत्ति का जो हिस्सा मेरे भाग में आता है
  rationale: ἐπιβάλλον में मिलने, हिस्से में आने या देय होने का भाव है; यह अनुवाद उत्तराधिकार-सन्दर्भ को स्पष्ट रखते हुए मूल अभिव्यक्ति का अर्थ बचाता है।
- source_word: διεῖλεν αὐτοῖς
  choice: उन दोनों में बाँट दी
  rationale: क्रिया का मूल अर्थ ‘बाँटना’ है। बहुवचन αὐτοῖς और प्रसंग में दो पुत्र होने के कारण ‘उन दोनों में’ स्वाभाविक है।
- source_word: βίον
  choice: अपनी जीविका
  rationale: βίος यहाँ पिता के जीवन-निर्वाह के साधनों, अर्थात उसकी जीवित सम्पत्ति, को सूचित करता है। ‘जीविका’ मूल के जीवन/निर्वाह संबंधी अर्थ को बनाए रखती है; पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठकों के लिए सहज हिन्दी। पिता को सम्बोधन और अनुरोध में आदरसूचक ‘पिताजी’ तथा ‘दे दीजिए’ रखा गया है। ‘छोटे’ मूल की संक्षिप्तता बनाए रखता है, जबकि प्रसंग से ‘पुत्र’ स्पष्ट रहता है।
