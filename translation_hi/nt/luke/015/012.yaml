    issue: ‘अपनी जीविका’ is awkward and potentially misleading as the object divided.
    rationale: In modern Hindi, जीविका ordinarily means a person's livelihood, occupation, or way of earning a living. The Greek βίον in this context refers collectively to the father’s means of living/assets, which he apportions.
