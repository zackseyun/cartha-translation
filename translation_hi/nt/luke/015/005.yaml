  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: hi
  text: और जब वह उसे पा लेता है[a], तो आनन्दित होकर उसे अपने कंधों पर उठा लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् पिछले प्रसंग में बताई गई खोई हुई भेड़।
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: जब वह उसे पा लेता है
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य से व्यक्त किया गया है। प्रत्यक्ष कर्म ‘उसे’ यूनानी में निहित है और पिछले पद की खोई हुई भेड़ को सूचित करता है।
- source_word: ἐπιτίθησιν
  choice: उसे ... उठा लेता है
  rationale: यहाँ क्रिया का अर्थ भेड़ को कंधों पर रखना या उठा लेना है। ‘कंधों पर उठा लेता है’ आधुनिक हिन्दी में चरवाहे की क्रिया को स्वाभाविक और सजीव ढंग से व्यक्त करता है।
- source_word: ἐπὶ τοὺς ὤμους αὐτοῦ
  choice: अपने कंधों पर
  rationale: ἐπί के साथ कर्मकारक किसी वस्तु को कंधों के ऊपर रखने की गति दर्शाता है। ‘अपने’ स्पष्ट करता है कि कंधे चरवाहे के हैं; बहुवचन ὤμους के लिए ‘कंधों’ रखा गया है।
- source_word: χαίρων
  choice: आनन्दित होकर
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चलने वाली मनःस्थिति को व्यक्त करता है। ‘आनन्दित होकर’ उसका कृदन्तीय संबंध बनाए रखते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: यूनानी में निहित प्रत्यक्ष कर्म की पूर्ति
  choice: ‘उसे’ जोड़ा गया, जिसका संकेत खोई हुई भेड़ की ओर है।
  alternative: 'कर्म को न व्यक्त करना: ‘जब वह पा लेता है...’'
  rationale: यूनानी प्रसंग के कारण कर्म को अनकहा छोड़ सकता है, पर हिन्दी में ‘उसे’ वाक्य को स्पष्ट और स्वाभाविक बनाता है। इससे कोई नया धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘आनन्दित’ भाव की गरिमा रखता है, जबकि ‘उठा लेता है’ चरवाहे की क्रिया को सामान्य पाठक के लिए सहज बनाता है।
