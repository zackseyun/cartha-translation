    text: यूनानी शब्द विशेष रूप से कैरब वृक्ष की फलियों के लिए है, जो सामान्यतः पशुओं के चारे में प्रयोग होती थीं।
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπεθύμει
  choice: तरसता था
  rationale: अपूर्णकालिक क्रिया निरंतर और प्रबल इच्छा व्यक्त करती है; ‘तरसता था’ भूख से उपजी लालसा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γεμίσαι
  choice: भरने
  rationale: मूल क्रिया के ठोस अर्थ ‘भरना’ को बनाए रखता है और ‘तृप्त करना’ जैसी व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: अपना पेट
  rationale: इस प्रसंग में κοιλία भूख के संदर्भ में पेट को दर्शाता है; ‘अपना पेट’ स्वाभाविक हिन्दी है और αὐτοῦ का आत्मवाचक संबंध स्पष्ट करता है।
- source_word: ἀπὸ τῶν κερατίων
  choice: उन खुरचनियों से
  rationale: ἀπό यहाँ पेट भरने के साधन या स्रोत को दर्शाता है; ‘से’ मूल पूर्वसर्ग की छवि बनाए रखता है।
- source_word: κερατίων
  choice: खुरचनियों
  rationale: यह शब्द कैरब वृक्ष की फलियों के लिए प्रयुक्त होता है। हिन्दी बाइबलीय परंपरा में ‘खुरचनियाँ’ परिचित पद है; पादटिप्पणी इसका सटीक वनस्पतिक अर्थ स्पष्ट करती है।
- source_word: οἱ χοῖροι
  choice: सूअर
  rationale: आधुनिक मानक हिन्दी में इसका सीधा, सामान्य और सहज समतुल्य है।
- source_word: ἤσθιον
  choice: खा रहे थे
  rationale: अपूर्णकाल का प्रगतिशील पक्ष दृश्य में जारी क्रिया को व्यक्त करता है।
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: कोई उसे कुछ नहीं देता था
  rationale: ἐδίδου का अपूर्णकाल लगातार अभाव को दर्शाता है; ‘कुछ’ मूल में निहित कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
