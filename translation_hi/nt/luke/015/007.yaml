review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the future joy 'in heaven,' the singular sinner who is repenting, and the unqualified designation 'righteous.' However, its 'जितना... उतना... नहीं होगा' recasts the Greek comparison as an explicit negated parallel statement. The source states that joy will be greater over the one sinner than over the ninety-nine; a direct comparative is more faithful and clearer.
  naturalness: The sentence is understandable, but the correlative negative construction is somewhat heavy and can momentarily suggest that there will be no joy at all over the ninety-nine. '...की अपेक्षा अधिक आनन्द होगा' is idiomatic modern Hindi and expresses the intended comparison directly.
  terminology: ‘मन फिराने वाला,’ ‘पापी,’ ‘धर्मी,’ and ‘स्वर्ग’ are suitable established biblical-Hindi terms. ‘धर्मियों’ properly preserves the Greek wording without deciding whether contextual irony is intended.
  issues:
  - severity: medium
    issue: The comparative is rendered as ‘जितना... उतना ... नहीं होगा.’
    rationale: 'Greek ἢ marks the second term of a comparison: joy is greater over one repenting sinner than over the ninety-nine righteous. An explicit direct comparison avoids adding a potentially misleading absolute-sounding negation and follows the source structure more closely.'
