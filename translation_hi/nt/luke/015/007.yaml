id: LUK.15.7
reference: Luke 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, इसी प्रकार[a] स्वर्ग में एक मन फिराने वाले पापी के विषय में उन निन्यानवे धर्मियों की अपेक्षा अधिक आनन्द होगा, जिन्हें मन फिराने की आवश्यकता नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस प्रकार” अथवा “ऐसे ही।” यह वाक्यांश स्वर्ग के आनन्द को पिछले दृष्टान्त के मुख्य बिन्दु से जोड़ता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में “धर्मी” ही है। सन्दर्भ में इसे सीधे अर्थ में या विडम्बना के साथ समझा जा सकता है; अनुवाद किसी एक अर्थ को निर्णायक नहीं बनाता।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह यीशु के सीधे और बलयुक्त कथन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले दृष्टान्त के निष्कर्ष से इस कथन का सम्बन्ध स्पष्ट करता है और ‘इस प्रकार’ का अर्थ बनाए रखता है।
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: स्वर्ग में ... आनन्द होगा
  rationale: भविष्यकाल और स्थानवाचक अर्थ दोनों सुरक्षित रहते हैं; आनन्द मनाने वाला कोई विशिष्ट कर्ता पाठ में नहीं जोड़ा गया।
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι
  choice: एक मन फिराने वाले पापी के कारण
  rationale: ἐπί आनन्द के कारण या अवसर को व्यक्त करता है। ‘मन फिराने वाला’ μετανοέω के विचार और सक्रिय वर्तमान कृदन्त को सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις
  choice: जितना ... उतना ... नहीं ... उन निन्यानवे धर्मियों के कारण
  rationale: यूनानी ἢ यहाँ तुलनात्मक बल रखता है। हिन्दी की ‘जितना...उतना नहीं’ रचना एक के ऊपर अधिक आनन्द के निहित तुलनात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: जिन्हें मन फिराने की आवश्यकता नहीं है
  rationale: यह यूनानी संज्ञात्मक अभिव्यक्ति का स्पष्ट, सहज और पूर्ण हिन्दी रूप है।
theological_decisions:
- issue: क्या ‘धर्मी’ वास्तव में धर्मी लोगों को सूचित करता है या सन्दर्भ में विडम्बनापूर्ण है
  choice: ‘धर्मियों’ शब्द को बिना व्याख्यात्मक परिवर्तन के रखा गया है।
  alternative: ‘जो अपने को धर्मी समझते हैं’ अथवा उद्धरण-चिह्नों में ‘धर्मी’
  rationale: यूनानी पाठ सीधे δικαίοις कहता है और विडम्बना को व्याकरण में स्पष्ट नहीं करता। इसलिए अनुवाद दोनों सम्भावनाओं के बीच का तनाव सुरक्षित रखता है।
- issue: स्वर्ग में आनन्द का कर्ता कौन है
  choice: केवल स्थानवाचक ‘स्वर्ग में ... आनन्द होगा’ रखा गया है।
  alternative: ‘परमेश्वर आनन्दित होगा’ या ‘स्वर्गदूत आनन्दित होंगे’
  rationale: इस पद में आनन्द का स्थान बताया गया है, उसका कर्ता स्पष्ट नहीं किया गया; किसी कर्ता को जोड़ना मूल पाठ से आगे जाना होगा।
- issue: μετανοέω का हिन्दी रूप
  choice: ‘मन फिराना’
  alternative: ‘पश्चाताप करना’ या ‘मन बदलना’
  rationale: ‘मन फिराना’ सोच और दिशा में परिवर्तन का सक्रिय भाव व्यक्त करता है, केवल खेद तक अर्थ को सीमित नहीं करता और बाइबलीय हिन्दी में समझने योग्य है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धर्मी’ और ‘मन फिराना’ जैसे परिचित बाइबलीय शब्दों का उपयोग किया गया है, पर वाक्य-रचना स्वाभाविक हिन्दी की है।
