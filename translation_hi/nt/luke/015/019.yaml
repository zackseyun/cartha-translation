    text: या, “वेतन पर रखे हुए कामगारों में से एक के समान।” यूनानी शब्द ऐसे कामगार को दर्शाता है जिसे मज़दूरी दी जाती थी, न कि घर के दास को।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: अब ... नहीं रहा
  rationale: यह बदली हुई स्थिति का समय-सूचक निषेध स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄξιος
  choice: योग्य
  rationale: यह पुत्र का दर्जा पाने के योग्य या अधिकारी होने के नैतिक-सामाजिक भाव को बनाए रखता है।
- source_word: κληθῆναι
  choice: कहलाऊँ
  rationale: निष्क्रिय क्रिया का अर्थ किसी नाम या दर्जे से पहचाना जाना है; ‘कहलाऊँ’ संक्षिप्त और स्वाभाविक है।
- source_word: υἱός
  choice: पुत्र
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और दृष्टान्त में पिता-पुत्र के विशिष्ट संबंध को व्यक्त करता है।
- source_word: ποίησόν με
  choice: मुझे ... रख लीजिए
  rationale: शाब्दिक ‘मुझे बना दीजिए’ हिन्दी में कृत्रिम लगता है; यहाँ पिता से अपने मज़दूरों जैसी स्थिति देने की विनती है, जिसे ‘रख लीजिए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς
  choice: जैसा
  rationale: यह समानता या तुलना व्यक्त करता है, पूर्ण पहचान नहीं।
- source_word: ἕνα τῶν μισθίων σου
  choice: अपने मज़दूरों में से एक
  rationale: μίσθιος मज़दूरी पाने वाले कामगार को दर्शाता है, घरेलू दास को नहीं; ‘मज़दूर’ आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions:
- issue: पुत्र की स्वीकारोक्ति में दर्जे और योग्यता की भाषा
  choice: ‘योग्य’ और ‘पुत्र’ को स्पष्ट रूप से बनाए रखा गया।
  alternative: अब मैं आपका बेटा कहलाने के लायक नहीं हूँ।
  rationale: मूल पाठ पुत्र होने के संबंधपरक और सामाजिक दर्जे के प्रति उसकी अनुभूत अयोग्यता व्यक्त करता है; इसे केवल सामान्य लज्जा या भावना में नहीं बदला गया।
- issue: ποίησόν με में स्थिति देने का भाव
  choice: ‘मुझे ... रख लीजिए’
  alternative: मुझे ... बना लीजिए
  rationale: इससे पिता से निम्न कार्यकारी स्थिति देने की विनती स्वाभाविक हिन्दी में आती है, बिना यह तय किए कि पुत्र कानूनी रूप से अपना पुत्रत्व खो सकता था या नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पिता को संबोधन में आदरसूचक ‘आपका’ और विनती में ‘रख लीजिए’ प्रयुक्त है। ‘पुत्र’ संबंध की विशिष्टता बनाए रखता है और ‘मज़दूर’ वेतन पाने वाले कामगार का भेद स्पष्ट करता है।
