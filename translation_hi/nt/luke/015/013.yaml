source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: hi
  text: और कुछ ही दिनों बाद[a], छोटे बेटे ने सब कुछ समेटा और दूर देश चला गया। वहाँ उसने लापरवाह ढंग से जीते हुए[c] अपनी संपत्ति[b] उड़ा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “बहुत दिन न बीतने पर।”'
    reason: lexical_alternative
  - marker: b
    text: या “अपनी सारी धन-दौलत” अथवा “अपनी माल-मिल्कियत।”
    reason: lexical_alternative
  - marker: c
    text: या “अपव्ययी ढंग से जीते हुए” अथवा “उच्छृंखल जीवन जीते हुए।” मूल पाठ यहाँ किसी विशेष पाप का नाम नहीं लेता, बल्कि लापरवाह और अपव्ययी जीवन-ढंग बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: कुछ ही दिनों बाद
  rationale: यूनानी का शाब्दिक रूप ‘बहुत दिन न बीतने पर’ है; ‘कुछ ही दिनों बाद’ वही समय-संबंध स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συναγαγὼν πάντα
  choice: सब कुछ समेटा
  rationale: यह पूर्वकालिक कृदंत प्रस्थान से पहले सब कुछ एकत्र या व्यवस्थित करने की क्रिया बताता है। ‘समेटा’ जानबूझकर इतना व्यापक है कि यह केवल बेचने या नकद में बदलने का दावा नहीं करता।
- source_word: ὁ νεώτερος υἱός
  choice: छोटे बेटे
  rationale: दो बेटों के कथानक में तुलनात्मक विशेषण का सहज हिन्दी रूप ‘छोटा बेटा’ है।
- source_word: ἀπεδήμησεν
  choice: चला गया
  rationale: क्रिया अपने स्थान से दूर जाने को व्यक्त करती है; अगले पदबंध ‘दूर देश’ के साथ ‘चला गया’ स्पष्ट और स्वाभाविक है।
- source_word: εἰς χώραν μακράν
  choice: दूर देश
  rationale: χώρα यहाँ किसी दूर भूभाग या देश को दर्शाता है; ‘दूर देश’ सटीक, संक्षिप्त और प्रचलित है।
- source_word: διεσκόρπισεν
  choice: उड़ा दी
  rationale: धन-संपत्ति के संदर्भ में क्रिया का भाव बिखेरकर नष्ट करने या अपव्यय करने का है। ‘संपत्ति उड़ा दी’ आधुनिक हिन्दी में इस मुहावरेदार अर्थ को स्पष्ट करता है।
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: अपनी संपत्ति
  rationale: οὐσία उसकी माल-मिल्कियत या आर्थिक साधनों का व्यापक संकेत है; ‘संपत्ति’ अनावश्यक संकीर्णता से बचता है।
- source_word: ζῶν ἀσώτως
  choice: लापरवाही का जीवन जीते हुए
  rationale: यह उसके जीवन के गैर-जिम्मेदार और अपव्ययी ढंग को बताता है। अनुवाद किसी खास प्रकार के अनैतिक आचरण को नहीं जोड़ता, क्योंकि पद स्वयं उसका उल्लेख नहीं करता।
theological_decisions:
- issue: ἀσώτως में निहित अनैतिकता की सीमा
  choice: लापरवाही का जीवन जीते हुए
  alternative: व्यभिचारी जीवन जीते हुए / ऐयाशी करते हुए
  rationale: मूल शब्द उच्छृंखल, अपव्ययी या गैर-जिम्मेदार जीवन को दर्शाता है, पर इस पद में किसी खास यौन पाप को स्पष्ट नहीं करता। व्यापक अभिव्यक्ति कथन की सीमा और अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समेटा’ मूल की व्यापकता बनाए रखता है, जबकि ‘उड़ा दी’ संपत्ति के अपव्यय का स्वाभाविक हिन्दी मुहावरा है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
