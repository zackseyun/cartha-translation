    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: था
  rationale: δέ यहाँ कथा को अगले दृश्य की ओर ले जाता है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य-विन्यास से यह संक्रमण स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: उसका बड़ा बेटा
  rationale: πρεσβύτερος तुलनात्मक अर्थ में ‘बड़ा’ है, अनिवार्यतः ‘सबसे बड़ा’ नहीं; यह छोटे बेटे के साथ विरोध भी स्पष्ट रखता है।
- source_word: ἐν ἀγρῷ
  choice: खेत में
  rationale: ἀγρός का सीधा और स्वाभाविक हिन्दी रूप ‘खेत’ है।
- source_word: ὡς ἐρχόμενος
  choice: जब वह लौटते हुए
  rationale: आते हुए होने की जारी परिस्थिति को ‘लौटते हुए’ स्वाभाविक हिन्दी में व्यक्त करता है; खेत से घर की ओर आने का प्रसंग लौटने का भाव स्पष्ट करता है।
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: घर के पास पहुँचा
  rationale: ἐγγίζω निकट आने या पास पहुँचने को दर्शाता है; यह हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: ἤκουσεν
  choice: उसने ... आवाज़ सुनी
  rationale: साधारण आख्यानात्मक भूतकाल रखा गया है; संगीत और नृत्य को सुनने योग्य ध्वनि के रूप में स्वाभाविक हिन्दी में व्यक्त करने हेतु ‘आवाज़’ जोड़ा गया है।
- source_word: συμφωνίας
  choice: संगीत
  rationale: शब्द संगीत, विशेषतः वाद्य-संगीत, का संकेत दे सकता है; ‘संगीत’ स्पष्ट है और आधुनिक ‘सिम्फनी’ का भ्रामक अर्थ नहीं लाता।
- source_word: χορῶν
  choice: नाचने
  rationale: χορός नृत्य अथवा नर्तकों के समूह को दर्शा सकता है; ‘नाचने की आवाज़’ प्रसंग में स्वाभाविक है, जबकि वैकल्पिक सामूहिक अर्थ पादटिप्पणी में सुरक्षित है।
