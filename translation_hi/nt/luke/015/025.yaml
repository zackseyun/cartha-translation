  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आख्यान-शैली। ‘बड़ा बेटा’ सामान्य पाठक के लिए ‘ज्येष्ठ पुत्र’ से अधिक सहज है। मुख्य पाठ में अर्थगत घटना ‘संगीत और नाचना’ रखी गई है और यूनानी पदों की सामूहिक/प्रदर्शन-संबंधी अस्पष्टता पादटिप्पणी में संरक्षित है।
