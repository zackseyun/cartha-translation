  verdict: revise
  source_fidelity: The draft accurately preserves the connective ‘या,’ the rhetorical question expecting an affirmative answer, the ten drachmas and one lost drachma, lighting a lamp, sweeping the house, careful searching, and the endpoint of finding the coin. The revision retains all of these elements while making the rhetorical syntax more direct in modern Hindi.
  naturalness: The draft is understandable, but ‘कौन-सी स्त्री ऐसी होगी ... तो ... न खोजती रहे?’ combines a future rhetorical setup with a present progressive negative sequence and is somewhat cumbersome. A direct negative rhetorical question is smoother and clearer. ‘घर में झाड़ू लगाना’ is more current everyday Hindi than ‘घर बुहारना.’
  terminology: ‘द्राख्मा’ appropriately retains the specific Greek coin name, and the cultural footnote is accurate. ‘दीपक’ suitably renders λύχνος. ‘सावधानी से’ naturally conveys ἐπιμελῶς; the alternative ‘लगन से’ is valid and is anchored to that expression.
  issues:
  - severity: low
    issue: The rhetorical-question construction is stylistically awkward.
    rationale: ‘कौन-सी स्त्री ऐसी होगी ... तो दीया न जलाए ... न खोजती रहे?’ shifts tense/aspect within one rhetorical conditional. A single future-form negative rhetorical question is more idiomatic while preserving the expected affirmative answer.
  - severity: low
    issue: ‘घर बुहारे’ is less current in modern standard Hindi.
    rationale: It is intelligible, but ‘घर में झाड़ू लगाए’ is more natural contemporary wording for sweeping the house.
  revised_text: या कौन-सी स्त्री, जिसके पास दस द्राख्मा[a] हों, उनमें से एक खो देने पर दीपक नहीं जलाएगी, घर में झाड़ू नहीं लगाएगी और उसे मिलने तक सावधानी से[b] नहीं खोजेगी?
