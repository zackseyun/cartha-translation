reference: Luke 15:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: hi
  text: या कौन-सी स्त्री, जिसके पास दस द्राख्मा[a] हों, उनमें से एक खो देने पर दीपक नहीं जलाएगी, घर में झाड़ू नहीं लगाएगी और उसे मिलने तक सावधानी से[b] नहीं खोजेगी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: द्राख्मा चाँदी का एक यूनानी सिक्का था।
    reason: cultural_note
  - marker: b
    text: या, ‘लगन से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: या
  rationale: यह पिछले दृष्टांत से जुड़े समानांतर उदाहरण का परिचय देता है; ‘या’ उसके संयोजक बल को सहज रूप में बनाए रखता है।
- source_word: τίς γυνὴ
  choice: कौन-सी स्त्री ऐसी होगी
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है। यह हिंदी अभिव्यक्ति उसी प्रश्नात्मक प्रभाव को स्वाभाविक ढंग से व्यक्त करती है और मूल में अनुपस्थित ‘तुममें से’ नहीं जोड़ती।
- source_word: δραχμὰς
  choice: द्राख्मा
  rationale: सामान्य ‘सिक्के’ कहने के बजाय विशिष्ट ऐतिहासिक यूनानी मुद्रा का नाम सुरक्षित रखा गया है; उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔχουσα δέκα
  choice: जिसके पास दस ... हों
  rationale: यूनानी कृदंत को स्वाभाविक हिंदी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: ἐὰν ἀπολέσῃ
  choice: यदि वह ... खो दे
  rationale: ἐάν के साथ एओरिस्ट सब्जंक्टिव सामान्य संभावित परिस्थिति बताता है; ‘यदि ... खो दे’ शर्त और सक्रिय ‘खोने’ दोनों को बनाए रखता है।
- source_word: δραχμὴν μίαν
  choice: उनमें से एक द्राख्मा
  rationale: ‘एक’ पर बल और दस सिक्कों में से उसके एक होने का संबंध स्पष्ट रखा गया है।
- source_word: οὐχὶ
  choice: न ... न ... न
  rationale: यह ऐसा आलंकारिक प्रश्न बनाता है जिसका अपेक्षित उत्तर ‘हाँ’ है। हिंदी में क्रमबद्ध क्रियाओं के साथ ‘न’ की पुनरावृत्ति प्रश्न का बल और स्पष्टता बनाए रखती है।
- source_word: ἅπτει λύχνον
  choice: दीया ... जलाए
  rationale: ἅπτω यहाँ प्रकाश-स्रोत को जलाने के अर्थ में है; ‘दीया जलाना’ घरेलू दृश्य के लिए सहज और स्पष्ट आधुनिक हिंदी है।
- source_word: σαροῖ τὴν οἰκίαν
  choice: घर ... बुहारे
  rationale: ‘घर बुहारना’ σαρόω और οἰκία दोनों का ठोस घरेलू अर्थ स्वाभाविक हिंदी में देता है।
- source_word: ζητεῖ ἐπιμελῶς
  choice: ध्यान से ... खोजती रहे
  rationale: ‘ध्यान से’ सावधानी और एकाग्रता व्यक्त करता है, जबकि ‘खोजती रहे’ जारी प्रयत्न को स्वाभाविक रूप में सामने लाता है।
- source_word: ἕως οὗ εὕρῃ
  choice: जब तक वह मिल न जाए
  rationale: यह खोज की अंतिम सीमा को व्यक्त करता है। हिंदी में सिक्के के लिए ‘वह मिल न जाए’ स्वाभाविक है और संदर्भित कर्म को स्पष्ट रखता है।
