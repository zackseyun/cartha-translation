  to: या कौन-सी स्त्री, जिसके पास दस द्राख्मा[a] हों, उनमें से एक खो देने पर दीपक नहीं जलाएगी, घर में झाड़ू नहीं लगाएगी और उसे मिलने तक सावधानी से[b] नहीं खोजेगी?
