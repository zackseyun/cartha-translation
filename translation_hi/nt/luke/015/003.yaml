lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: λέγω का एओरिस्ट रूप वाणी की क्रिया को व्यक्त करता है। ‘दृष्टान्त कहा’ हिन्दी में स्वाभाविक है और यूनानी संरचना के निकट भी रहता है।
- source_word: δὲ
  choice: तब
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। ‘तब’ पिछले पदों की शिकायत के प्रत्युत्तर में यीशु के कथन की ओर सहज संक्रमण कराता है, बिना प्रबल विरोध जोड़े।
- source_word: πρὸς αὐτοὺς
  choice: उनसे
  rationale: πρός के साथ कर्मकारक संबोधित व्यक्तियों को दर्शाता है। हिन्दी में ‘उनसे ... कहा’ इसका स्वाभाविक रूप है।
- source_word: τὴν παραβολὴν ταύτην
  choice: यह दृष्टान्त
  rationale: सिनॉप्टिक सुसमाचारों में παραβολή के लिए स्थापित और संदर्भानुकूल हिन्दी शब्द ‘दृष्टान्त’ है; ταύτην को ‘यह’ से स्पष्ट रखा गया है।
- source_word: λέγων
  choice: 'कहा:'
  rationale: वर्तमान कृदन्त λέγων आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में मुख्य क्रिया के साथ इसका शाब्दिक दोहराव (‘कहते हुए कहा’) भारी लगता है, इसलिए कोलन से उसके परिचयात्मक कार्य को व्यक्त किया गया है।
