base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: hi
  text: और जब वह घर पहुँचता है[a], तो अपने मित्रों और पड़ोसियों को एक साथ बुलाता है और उनसे कहता है, ‘मेरे साथ आनन्द मनाओ[b], क्योंकि मुझे अपनी वह भेड़ मिल गई है जो खो गई थी[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘घर में आता है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मेरी खुशी में शामिल हो जाओ।’ यूनानी क्रिया का अर्थ किसी के साथ मिलकर आनन्दित होना है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपनी खोई हुई भेड़।’ यूनानी में शाब्दिक रूप से ‘अपनी भेड़, वह जो खो गई थी’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: जब वह घर पहुँचता है
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘घर में आने पर’ है; हिन्दी में ‘घर पहुँचता है’ उसी क्रम और गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συγκαλεῖ
  choice: बुलाकर
  rationale: क्रिया का अर्थ लोगों को एक साथ बुलाना है। ‘अपने मित्रों और पड़ोसियों को बुलाकर’ हिन्दी में संक्षिप्त और सहज है।
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: अपने मित्रों और पड़ोसियों को
  rationale: दोनों सामाजिक समूहों का सीधा और सामान्य हिन्दी रूप रखा गया है; सन्दर्भ से सम्बन्ध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: Συγχάρητέ μοι
  choice: मेरे साथ आनन्द मनाओ
  rationale: आज्ञार्थक क्रिया किसी के आनन्द में सहभागी होने का निमंत्रण देती है। यह रूप साझा आनन्द को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ὅτι εὗρον
  choice: क्योंकि मुझे ... मिल गई है
  rationale: ὅτι कारण बताता है। यूनानी भूतकालीन क्रिया के वर्तमान परिणाम को हिन्दी पूर्ण पक्ष ‘मिल गई है’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: अपनी वह भेड़ ... जो खो गई थी
  rationale: लेख और पूर्ण कृदन्त की संरचना को सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है, जिससे ‘मेरी भेड़—वह जो खो गई थी’ का बल सुरक्षित रहता है।
theological_decisions:
- issue: खोई भेड़ की दृष्टान्तात्मक छवि
  choice: अपनी वह भेड़ ... जो खो गई थी
  alternative: अपनी खोई हुई भेड़
  rationale: पद में ठोस दृष्टान्तात्मक छवि को ज्यों का त्यों रखा गया है और यहाँ ‘पापी’ या ‘उद्धार’ जैसी व्याख्यात्मक भाषा नहीं जोड़ी गई। सम्बन्धवाचक रचना यूनानी τὸ πρόβατόν μου τὸ ἀπολωλός की विशेष बलयुक्त संरचना भी दर्शाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘आनन्द मनाओ’ साझा उत्सव का भाव रखता है; ‘वह भेड़ ... जो खो गई थी’ मूल की विशेषणात्मक कृदन्त रचना को बिना अस्वाभाविक कठोरता के सुरक्षित रखता है।
