source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: hi
  text: लेकिन जब लोगों की भीड़ को इसका पता चला, तो वे उसके पीछे चल पड़े। उनका स्वागत करके वह उनसे परमेश्वर के राज्य के विषय में बातें करता रहा और जिन्हें उपचार की आवश्यकता थी[a], उन्हें चंगा करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें चंगाई की आवश्यकता थी।” यूनानी शब्द θεραπεία का अर्थ “चंगाई” अथवा “उपचार/देखभाल” हो सकता है।
    reason: θεραπεία की शब्दार्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: लेकिन ... भीड़ के लोगों को
  rationale: δέ को पिछले प्रसंग से हल्का विरोध/संक्रमण दिखाने के लिए ‘लेकिन’ कहा गया है। ὄχλοι बहुवचन है; हिन्दी में अप्राकृतिक ‘भीड़ें’ के बजाय ‘भीड़ के लोग’ सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γνόντες
  choice: जब ... इसका पता चला
  rationale: अओरिस्ट कृदंत को कालसूचक उपवाक्य के रूप में रखा गया है; ‘इसका’ यीशु के स्थान या वहाँ चले जाने की सूचना की ओर संकेत करता है, जैसा संदर्भ से समझ आता है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: वे उसके पीछे हो लिए
  rationale: यह वास्तविक रूप से पीछे जाने का स्वाभाविक हिन्दी वर्णन है और ἀκολουθέω की व्यापक शिष्यत्व-संबंधी प्रतिध्वनि को भी अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀποδεξάμενος αὐτούς
  choice: उसने उनका स्वागत किया
  rationale: ἀποδέχομαι यहाँ अनुकूलतापूर्वक ग्रहण करने का भाव रखता है; ‘स्वागत किया’ केवल ‘स्वीकार किया’ की अपेक्षा प्रसंगानुकूल और आत्मीय है।
- source_word: ἐλάλει αὐτοῖς
  choice: वह उनसे ... बातें करता रहा
  rationale: अपूर्णकालिक क्रिया की जारी रहने वाली क्रिया को ‘करता रहा’ से स्पष्ट किया गया है।
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य के विषय में
  rationale: मुख्य बाइबलीय पदावली को संगत और पारदर्शी रूप में रखा गया है; ‘राज्य’ βασιλεία के स्थापित अर्थ को सुरक्षित रखता है।
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: जिन्हें उपचार की आवश्यकता थी
  rationale: θεραπεία संज्ञा उपचार, देखभाल या चंगाई का अर्थ दे सकती है। ‘उपचार’ मूल की संज्ञात्मक रचना को बनाए रखता है और अगले ‘चंगा करता रहा’ के साथ अनावश्यक पुनरुक्ति से बचाता है।
- source_word: ἰᾶτο
  choice: उन्हें चंगा करता रहा
  rationale: ἰάομαι के अपूर्णकालिक रूप की निरंतर उपचारकारी क्रिया को ‘करता रहा’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘शासन’ परमेश्वर के सक्रिय राज करने पर बल दे सकता है, पर ‘परमेश्वर का राज्य’ सुसमाचारों की स्थापित और पर्याप्त रूप से व्यापक पदावली है; यह अर्थ को केवल स्थान तक सीमित किए बिना पाठगत संगति बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भीड़ के लोग’ हिन्दी में अप्राकृतिक बहुवचन ‘भीड़ें’ से बचते हुए यूनानी के जनसमूह-संबंधी भाव को व्यक्त करता है। दोनों अपूर्णकालिक क्रियाओं को ‘करता रहा’ से निरंतर क्रिया के रूप में दर्शाया गया है।
