source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: hi
  text: और उसने उनसे कहा, “लेकिन तुम मुझे कौन कहते हो?” पतरस ने उत्तर दिया, “परमेश्वर का मसीह[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “परमेश्वर का ख्रीस्त।”'
    reason: χριστός के अर्थपरक ‘मसीह’ के स्थान पर पारम्परिक लिप्यन्तरण का lexical alternative।
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलाघाती है। हिन्दी में पहले आए ‘लेकिन’ और ‘तुम’ के स्पष्ट प्रयोग से दूसरों की राय के विपरीत शिष्यों की अपनी राय पर पर्याप्त बल आता है।
- source_word: τίνα με λέγετε εἶναι
  choice: तुम मुझे कौन कहते हो
  rationale: यह λέγετε और εἶναι वाले अप्रत्यक्ष कथन का स्वाभाविक आधुनिक हिन्दी रूप है; अर्थ है कि शिष्य यीशु की पहचान किस रूप में करते हैं।
- source_word: ἀποκριθεὶς εἶπεν
  choice: ने उत्तर दिया
  rationale: यूनानी कृदन्त और मुख्य क्रिया के संयुक्त भाव को हिन्दी में एक स्वाभाविक कथन-क्रिया से व्यक्त किया गया है।
- source_word: χριστόν
  choice: मसीह
  rationale: यहाँ शब्द पतरस की स्वीकारोक्ति में एक उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिन्दी में इस्राएल के अपेक्षित अभिषिक्त राजा की प्रचलित और समझने योग्य उपाधि है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक पद का सीधा अनुवाद किया गया है और मूल की संक्षिप्त स्वीकारोक्तिपूर्ण अभिव्यक्ति बनाए रखी गई है।
- source_word: δέ
  choice: तब / लेकिन
  rationale: पहला δέ कथानक को आगे बढ़ाने वाला हल्का संयोजक है, इसलिए ‘तब’; प्रश्न में दूसरा δέ पिछली रायों के साथ स्पष्ट विरोध दिखाता है, इसलिए ‘लेकिन’ चुना गया है।
theological_decisions:
- issue: पतरस की स्वीकारोक्ति में χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ χριστός नाम नहीं, बल्कि यीशु की पहचान बताने वाली उपाधि है। इसलिए अर्थपूर्ण और प्रचलित उपाधि ‘मसीह’ मुख्य पाठ में रखी गई है; पारम्परिक लिप्यन्तरण ‘ख्रीष्ट’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लेकिन तुम’ यूनानी के विरोध और बलाघात को बिना अस्वाभाविक ‘तुम स्वयं’ जोड़े व्यक्त करता है। मुख्य पाठ में पादटिप्पणी-चिह्न सम्बद्ध शब्द ‘मसीह’ के तुरंत बाद रखा गया है।
