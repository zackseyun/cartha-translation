source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: hi
  text: 'पर मैं तुमसे सच कहता हूँ: यहाँ खड़े लोगों में कुछ ऐसे हैं जो परमेश्वर का राज्य देख लेने तक मृत्यु का स्वाद कदापि नहीं चखेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु का स्वाद चखना’ एक मुहावरा है, जिसका अर्थ ‘मृत्यु का अनुभव करना’ या ‘मरना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: पर मैं तुमसे सच कहता हूँ
  rationale: ‘पर’ δέ के प्रसंगगत विरोध या आगे बढ़ने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सच’ ἀληθῶς का क्रियाविशेषणीय बल बनाए रखता है।
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: यहाँ खड़े लोगों में कुछ ऐसे हैं
  rationale: यह अभिव्यक्ति अंशवाचक संबंध को स्पष्ट रखती है और αὐτοῦ के स्थानवाचक अर्थ ‘यहाँ/इसी स्थान पर’ तथा ἑστηκότων की वर्तमान अवस्था को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: जो ... मृत्यु का स्वाद कदापि नहीं चखेंगे
  rationale: ‘कदापि नहीं’ οὐ μή के प्रबल निषेध को व्यक्त करता है, जबकि ‘मृत्यु का स्वाद चखना’ मूल रूपक को बनाए रखता है।
- source_word: ἕως ἂν ἴδωσιν
  choice: देख लेने तक
  rationale: यह भविष्य की सीमा को स्वाभाविक हिन्दी में व्यक्त करता है और अओरिस्ट क्रिया के पूर्ण घटना-बोध को अनावश्यक रूप से अधिक स्पष्ट किए बिना दर्शाता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह βασιλεία की व्यापक अर्थ-सीमा को बनाए रखने वाला प्रचलित और सहज बाइबलीय पद है; इसे केवल ‘शासन’ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘परमेश्वर का राज्य देखना’ किस घटना की ओर संकेत करता है
  choice: वाक्यांश को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
  alternative: इसे रूपान्तरण, पुनरुत्थान और स्वर्गारोहण, यरूशलेम के विनाश, या कलीसिया के प्रसार से स्पष्ट रूप से जोड़ना।
  rationale: मूल पाठ निर्दिष्ट घटना का नाम नहीं देता और प्रसंग की व्याख्या के कई सम्भव मत हैं। अनुवाद किसी एक युगान्तशास्त्रीय व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कदापि नहीं’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर यहाँ यूनानी के अत्यन्त प्रबल निषेध को संक्षेप में व्यक्त करता है।
