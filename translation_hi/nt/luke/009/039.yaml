id: LUK.9.39
reference: Luke 9:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: hi
  text: और देखिए, एक आत्मा[a] उसे पकड़ लेती है। वह अचानक चिल्ला उठता है, और वह आत्मा उसे झाग निकालते हुए ऐंठन में डालती है। वह उसे कुचलती हुई बड़ी मुश्किल से उससे अलग होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक दुष्ट आत्मा’ अथवा ‘एक दुष्टात्मा’; यहाँ यूनानी पाठ में केवल ‘आत्मा’ है।
    reason: मूल शब्द की अनिर्दिष्टता बनाए रखते हुए प्रसंग से संभव अधिक विशिष्ट अर्थ बताना।
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखिए
  rationale: पिता के वर्णन की सजीवता और सामने की स्थिति की ओर ध्यान खींचने वाले संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: πνεῦμα
  choice: एक आत्मा
  rationale: यूनानी पाठ केवल ‘आत्मा’ कहता है; प्रसंग में वह विरोधी है, पर मुख्य पाठ में उससे अधिक विशिष्ट पहचान नहीं जोड़ी गई।
- source_word: λαμβάνει
  choice: पकड़ लेती है
  rationale: अचानक किसी को अपने वश में कर लेने की प्रबलता को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐξαίφνης κράζει
  choice: वह अचानक चिल्ला उठता है
  rationale: क्रिया का समझा हुआ कर्ता लड़का है; ‘चिल्ला उठता है’ आकस्मिकता और तीव्रता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σπαράσσει αὐτὸν μετὰ ἀφροῦ
  choice: उसे इस तरह मरोड़ती है कि वह झाग निकालने लगता है
  rationale: शारीरिक ऐंठन और उसके साथ होने वाले झाग को आधुनिक पाठक के लिए स्पष्ट करता है, बिना ‘मुँह’ जैसा स्रोत में अनुपस्थित विवरण जोड़े।
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: बड़ी मुश्किल से उससे अलग होती है
  rationale: आत्मा के उससे हटने में कठिनाई अथवा अनिच्छा का भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: συντρῖβον αὐτόν
  choice: उसे कुचलती हुई
  rationale: मूल क्रिया की हिंसक और विनाशकारी शक्ति को बनाए रखता है और किसी खास प्रकार की चोट को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: क्या πνεῦμα को मुख्य पाठ में स्पष्ट रूप से दुष्टात्मा या दुष्ट आत्मा कहा जाए
  choice: एक आत्मा
  alternative: एक दुष्ट आत्मा / एक दुष्टात्मा
  rationale: व्यापक प्रसंग विरोधी अलौकिक सत्ता की ओर संकेत करता है, पर इस पद में यूनानी शब्द केवल πνεῦμα है। इसलिए मुख्य पाठ मूल की अनिर्दिष्टता बनाए रखता है और प्रसंगगत विकल्प पाद-टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सजीव और गरिमापूर्ण रखी गई है। वाक्य-विभाजन हिन्दी में स्पष्टता के लिए किया गया है; स्त्रीलिंग सर्वनाम ‘आत्मा’ के हिन्दी व्याकरण के अनुसार हैं।
