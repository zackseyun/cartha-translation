source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: hi
  text: उन्होंने उत्तर दिया, “यूहन्ना बपतिस्मा देनेवाला; कुछ कहते हैं, एलिय्याह; और कुछ कहते हैं कि प्राचीन भविष्यद्वक्ताओं में से कोई उठ खड़ा हुआ है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुराने समय का कोई भविष्यद्वक्ता जी उठा है।”
    reason: यूनानी वाक्यांश को अधिक मुहावरेदार ढंग से समझा जा सकता है। ἀνέστη का अर्थ ‘उठ खड़ा हुआ है’ हो सकता है, और संदर्भ में ‘जी उठा है’ की संभावना भी रखता है।
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: उन्होंने उत्तर दिया
  rationale: कृदन्त और मुख्य क्रिया का यह संयोजन यूनानी में प्रचलित उत्तर देने की अभिव्यक्ति है; स्वाभाविक हिन्दी में ‘उन्होंने उत्तर दिया’ उसके अर्थ को बिना अनावश्यक दोहराव के व्यक्त करता है।
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: यूहन्ना बपतिस्मा देनेवाला
  rationale: ‘यूहन्ना’ नाम का प्रचलित हिन्दी रूप है और ‘बपतिस्मा देनेवाला’ βαπτιστής की भूमिका को स्पष्ट तथा परिचित ढंग से व्यक्त करता है।
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: कुछ कहते हैं ... और कुछ कहते हैं
  rationale: यह दो अलग समूहों को दर्शानेवाली पुनरावृत्त संरचना को बनाए रखता है; ‘कहते हैं’ जोड़ना हिन्दी में सूची को स्पष्ट और स्वाभाविक बनाता है।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: यह इस भविष्यद्वक्ता के नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: प्राचीन भविष्यद्वक्ताओं में से कोई
  rationale: τις की अनिश्चितता और τῶν ἀρχαίων के उस पुराने समूह से संबंध—दोनों को स्पष्ट करता है, साथ ही हिन्दी में स्वाभाविक है।
- source_word: ἀνέστη
  choice: जी उठा है
  rationale: संदर्भ में अतीत के किसी भविष्यद्वक्ता के फिर उठने की धारणा है। ‘जी उठा है’ पुनरुत्थान की संभावित प्रतिध्वनि को बनाए रखता है, पर पद से आगे जाकर उसका स्वरूप नहीं समझाता।
theological_decisions:
- issue: क्या ἀνέστη को स्पष्ट रूप से पुनरुत्थान बतानेवाली भाषा में अनुवाद किया जाए
  choice: जी उठा है
  alternative: उठ खड़ा हुआ है / प्रकट हुआ है
  rationale: क्रिया उठने या जी उठने दोनों की ओर संकेत कर सकती है। इस प्रसंग में भीड़ किसी प्राचीन भविष्यद्वक्ता के फिर उपस्थित होने की अटकल लगा रही है; ‘जी उठा है’ मूल की पुनरुत्थान-संबंधी संभावित गूँज को सुरक्षित रखता है, जबकि उसका कोई विस्तृत धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल-सुलभ शैली रखी गई है। उत्तर की खंडित सूची को बनाए रखते हुए जहाँ आवश्यक था वहाँ ‘कहते हैं’ दोहराया गया है, ताकि हिन्दी पाठ स्पष्ट रहे।
