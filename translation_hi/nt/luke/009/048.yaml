id: LUK.9.48
reference: Luke 9:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: hi
  text: और उसने उनसे कहा, “जो कोई इस बच्चे को मेरे नाम से[b] स्वीकार करता है[a], वह मुझे स्वीकार करता है; और जो मुझे स्वीकार करता है, वह उसे स्वीकार करता है जिसने मुझे भेजा है। क्योंकि तुम सब में जो सबसे छोटा है—वही महान है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वीकार करता है” के स्थान पर पूरे पद में “स्वागत करता है” भी हो सकता है; यूनानी क्रिया में स्वीकार करने और आतिथ्यपूर्वक ग्रहण करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे नाम से” का अर्थ “मेरे नाम के आधार पर” या “मेरे नाम के कारण” भी हो सकता है; अर्थात ऐसा स्वीकार यीशु के अधिकार और उससे संबंध के संदर्भ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: स्वीकार करता है
  rationale: यह चयन यूनानी क्रिया की पुनरावृत्ति को बनाए रखता है और व्यक्ति को स्वीकार करने का अर्थ सहज हिंदी में व्यक्त करता है। ‘स्वागत करता है’ आतिथ्य के भाव को अधिक स्पष्ट करता, पर अर्थ को उसी तक सीमित कर सकता था।
- source_word: παιδίον
  choice: बच्चे
  rationale: यह παιδίον का सीधा और स्वाभाविक आधुनिक हिंदी रूप है; यहाँ ‘छोटे बच्चे’ कहना आवश्यक नहीं है।
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह वाक्यांश यीशु के नाम, अधिकार और उससे संबंध के आधार पर किए गए स्वीकार को व्यक्त करता है, पर इनमें से किसी एक अर्थ तक इसे सीमित नहीं करता।
- source_word: τὸν ἀποστείλαντά με
  choice: उसे ... जिसने मुझे भेजा है
  rationale: यह संज्ञार्थक कृदंत का स्वाभाविक हिंदी रूप है और भेजने वाले को ‘पिता’ या ‘परमेश्वर’ कहकर मूल से अधिक स्पष्ट नहीं बनाता।
- source_word: μικρότερος
  choice: सबसे छोटा
  rationale: समूह के भीतर तुलनात्मक न्यूनता को हिंदी में सहज रूप से व्यक्त करता है। संदर्भ में इसका संबंध पद और महत्त्व से है, फिर भी अनुवाद मूल की ‘छोटा’ वाली छवि को बनाए रखता है।
- source_word: ἐν πᾶσιν ὑμῖν
  choice: तुम सब में
  rationale: यह समूह के भीतर किसी की स्थिति का स्वाभाविक और संक्षिप्त हिंदी रूप है।
- source_word: ὑπάρχων
  choice: जो ... है
  rationale: कृदंत को हिंदी के स्वाभाविक संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: οὗτός ἐστιν μέγας
  choice: वही महान है
  rationale: ‘वही’ οὗτος के बलाघात को बनाए रखता है और विरोधाभासी निष्कर्ष को स्पष्ट करता है।
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: जो कोई ... और जो
  rationale: यह अनिश्चित सामान्य शर्त को स्वाभाविक हिंदी में व्यक्त करता है; दूसरी बार ‘कोई’ न दोहराने से वाक्य अधिक सहज रहता है।
- source_word: καὶ εἶπεν αὐτοῖς
  choice: और उसने उनसे कहा
  rationale: यह καί और मूल के सर्वनाम को बिना अतिरिक्त कालगत या पहचान-संबंधी सूचना जोड़े दर्शाता है।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ का संदर्भ
  choice: भेजने वाले का संकेत निहित ही रखा गया है।
  alternative: ‘पिता जिसने मुझे भेजा है’ या ‘परमेश्वर जिसने मुझे भेजा है’
  rationale: यूनानी पाठ भेजने वाले का नाम स्पष्ट रूप से नहीं लेता। यह रूप यीशु के भेजे जाने का संबंध बनाए रखता है, पर पाठ से बाहर की स्पष्टता नहीं जोड़ता।
- issue: बच्चे को ‘मेरे नाम से’ स्वीकार करने का अर्थ
  choice: यीशु के नाम, अधिकार और उससे संबंध की अर्थ-व्याप्ति खुली रखी गई है।
  alternative: ‘मेरे कारण’ या ‘क्योंकि वह मेरा है’
  rationale: इन विकल्पों में से किसी एक को मुख्य पाठ में रखने से वाक्यांश का प्रतिनिधित्व, अधिकार और निष्ठा-संबंधी व्यापक अर्थ संकरा हो सकता था।
- issue: छोटे और महान होने का विरोधाभास
  choice: ‘सबसे छोटा’ और ‘महान’ का सीधा विरोध बनाए रखा गया है।
  alternative: ‘सबसे कम महत्त्व वाला’ या ‘सबसे छोटा समझा जाने वाला’
  rationale: संदर्भ सामाजिक विनम्रता और निम्न स्थान की ओर संकेत करता है, पर व्याख्यात्मक विस्तार किए बिना मूल की सशक्त विरोधाभासी भाषा को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुख्य क्रिया की पुनरावृत्ति जानबूझकर सुरक्षित है, और अंतिम वाक्य में दीर्घ विराम-चिह्न विरोधाभासी बल को उभारता है।
