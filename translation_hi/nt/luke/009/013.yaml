id: LUK.9.13
reference: Luke 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “तुम ही उन्हें खाने को दो।”[a] उन्होंने कहा, “हमारे पास पाँच रोटियों और दो मछलियों से अधिक कुछ नहीं है—जब तक कि हम स्वयं जाकर इन सब लोगों[b] के लिए भोजन न खरीदें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “तुम स्वयं उन्हें खाने के लिए कुछ दो।”
    reason: lexical_alternative
  - marker: b
    text: या “इस सारी भीड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: तुम ही उन्हें खाने को दो
  rationale: ‘खाने को दो’ आधुनिक हिन्दी में स्वाभाविक रूप से ‘खाने के लिए कुछ दो’ का अर्थ देता है, और ‘तुम ही’ स्पष्ट सर्वनाम ὑμεῖς के बलाघात को बनाए रखता है।
- source_word: πλεῖον ἢ ἄρτοι πέντε καὶ ἰχθύες δύο
  choice: पाँच रोटियों और दो मछलियों से अधिक कुछ नहीं
  rationale: नकार सहित πλεῖον ἢ उपलब्ध सामग्री की सीमा बताता है। ἄρτοι को गिनी जा सकने वाली छोटी रोटियों के रूप में ‘रोटियाँ’ कहना प्रसंगानुकूल है।
- source_word: εἰ μήτι
  choice: जब तक कि
  rationale: यह वाक्यांश अपवाद अथवा संकोचपूर्ण वैकल्पिक संभावना प्रस्तुत करता है; ‘जब तक कि’ शिष्यों की व्यावहारिक आपत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: हम स्वयं जाकर … न खरीदें
  rationale: कृदन्त πορευθέντες को हिन्दी में ‘जाकर’ से स्वाभाविक ढंग से व्यक्त किया गया है और स्पष्ट ἡμεῖς का बल ‘हम स्वयं’ से सुरक्षित रखा गया है।
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: इन सब लोगों
  rationale: λαός का मूल सामूहिक अर्थ ‘लोग’ से व्यक्त होता है, जबकि πάντα और τοῦτον क्रमशः ‘सब’ और ‘इन’ में सुरक्षित हैं।
- source_word: βρώματα
  choice: भोजन
  rationale: बहुवचन βρώματα खाने की वस्तुओं को सूचित करता है; इस संदर्भ में सामूहिक हिन्दी संज्ञा ‘भोजन’ सहज और पर्याप्त है।
theological_decisions:
- issue: यीशु की आज्ञा में ὑμεῖς का बल
  choice: ‘तुम ही’ द्वारा बलाघात बनाए रखा गया
  alternative: ‘तुम स्वयं उन्हें खाने को दो’
  rationale: मूल पाठ में सर्वनाम स्पष्ट और बलाघाती है। ‘तुम ही’ इसे बिना अतिरिक्त झिड़की या कटुता जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: शिष्यों के उत्तर का भाव
  choice: सीधी व्यावहारिक आपत्ति के रूप में अनुवाद
  alternative: उत्तर में खीझ, व्यंग्य या असंभवता का अधिक प्रबल भाव जोड़ना
  rationale: यूनानी पाठ वैकल्पिक संभावना प्रस्तुत करता है, पर किसी निश्चित भावात्मक रंग को स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को बढ़ाता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रोटियाँ’ स्थानीय पाठक के लिए गिनी जा सकने वाली ἄρτοι का स्वाभाविक रूप है। संवाद में मूल का सीधापन बनाए रखा गया है और अनावश्यक भावात्मक या सांप्रदायिक व्याख्या नहीं जोड़ी गई।
