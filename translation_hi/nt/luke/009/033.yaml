reference: Luke 9:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: hi
  text: जब वे उससे विदा हो रहे थे, तब पतरस ने यीशु से कहा, “स्वामी, हमारा यहाँ रहना अच्छा है। हम तीन तंबू[a] बनाएँ—एक आपके लिए, एक मूसा के लिए और एक एलिय्याह के लिए।” वह नहीं जानता था कि वह क्या कह रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “डेरे,” “अस्थायी आश्रय” या “झोंपड़ियाँ” भी हो सकता है; परंपरागत अनुवाद में “तंबू” मिलता है। इसमें झोंपड़ियों के पर्व की बाइबिलीय छवि की प्रतिध्वनि सम्भव है।
    reason: शब्दार्थ के विकल्प और सम्भावित बाइबिलीय संकेत को बिना निर्णायक व्याख्या थोपे सुरक्षित रखना।
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: जब वे उससे अलग होकर जाने लगे
  rationale: यह यूनानी कथात्मक रचना उसी समय घट रही क्रिया को दिखाती है। ‘अलग होकर जाने लगे’ मूसा और एलिय्याह के यीशु से अलग होने और प्रस्थान करने—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: Ἐπιστάτα
  choice: स्वामी
  rationale: लूका में यह यीशु को अधिकार-संपन्न व्यक्ति मानकर किया गया आदरपूर्ण संबोधन है। ‘स्वामी’ इसे ‘शिक्षक’ तक सीमित नहीं करता और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: हमारा यहाँ रहना अच्छा है
  rationale: यह καλόν के सीधे मूल्यांकन और यूनानी क्रियार्थक रचना, दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιήσωμεν
  choice: हम ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन संभावनार्थक रूप पतरस के प्रस्ताव या आग्रह को व्यक्त करता है; हिन्दी का ‘हम बनाएँ’ उसी भाव को सीधे बनाए रखता है।
- source_word: σκηνὰς
  choice: तंबू
  rationale: σκηνή किसी अस्थायी डेरे, तंबू या छाजन को सूचित कर सकता है। ‘तंबू’ सामान्य आधुनिक पाठक के लिए स्पष्ट है और मूल शब्द को किसी एक पर्व-संबंधी व्याख्या तक सीमित नहीं करता।
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: वह नहीं जानता था कि वह क्या कह रहा है
  rationale: यह कृदंत पतरस की उसी समय की अनभिज्ञता बताता है। ‘क्या कह रहा है’ वर्तमानकालिक λέγει के चलते हुए कथन के भाव को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: रूपान्तरण के प्रसंग में σκηνάς का अनुवाद और सम्भावित पर्व-संबंधी संकेत
  choice: तंबू
  alternative: मंडप, डेरे, अस्थायी छाजन
  rationale: पद स्वयं इन संरचनाओं को झोपड़ियों के पर्व या पवित्र निवास-तंबू से स्पष्ट रूप से नहीं जोड़ता। इसलिए मुख्य पाठ में सामान्य और ठोस शब्द रखा गया है, जबकि सम्भावित बाइबिलीय प्रतिध्वनि पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और आदरपूर्ण रखी गई है। यीशु के लिए ‘आपके’ का प्रयोग पतरस के आदरपूर्ण संबोधन के अनुरूप है। ‘वे’ का संदर्भ प्रसंगानुसार मूसा और एलिय्याह है; मूल पद की तरह उनके नाम प्रारम्भिक उपवाक्य में नहीं जोड़े गए।
