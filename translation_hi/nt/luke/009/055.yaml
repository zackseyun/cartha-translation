  text: στραφεὶς δὲ ἐπετίμησεν ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/055.yaml
  text: But he turned and rebuked them[a].
translation:
  language: hi
  text: पर उसने मुड़कर उन्हें डाँटा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बाद की कुछ पांडुलिपियाँ आगे जोड़ती हैं: “और कहा, ‘तुम नहीं जानते कि तुम किस प्रकार की आत्मा के हो; क्योंकि मनुष्य का पुत्र लोगों के प्राण नष्ट करने नहीं, बल्कि उन्हें बचाने आया है।’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: एओरिस्ट कृदंत यीशु के शिष्यों की ओर मुड़ने की क्रिया को मुख्य क्रिया से पहले घटित दिखाता है; ‘मुड़कर’ स्वाभाविक हिन्दी में इस संबंध को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ शिष्यों के पिछले प्रस्ताव के प्रति हल्का विरोध दर्शाता है; ‘पर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: ἐπιτιμάω कड़ी मौखिक फटकार या सुधार व्यक्त करता है। ‘डाँटा’ आम पाठक के लिए सहज है और प्रसंग में अपेक्षित तीव्रता रखता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: बहुवचन सर्वनाम प्रसंग में याकूब और यूहन्ना, अथवा संबोधित शिष्यों, की ओर संकेत करता है। हिन्दी में ‘डाँटा’ के साथ ‘उन्हें’ स्वाभाविक कर्म-रूप है।
theological_decisions:
- issue: बाद की कुछ पांडुलिपियों में पाया जाने वाला लंबा पाठ-विस्तार
  choice: 'मुख्य पाठ में केवल SBLGNT का संक्षिप्त पाठ रखा गया: ‘पर उसने मुड़कर उन्हें डाँटा।’'
  alternative: ‘पर उसने मुड़कर उन्हें डाँटा और कहा, “तुम नहीं जानते कि तुम किस प्रकार की आत्मा के हो; क्योंकि मनुष्य का पुत्र लोगों के प्राण नष्ट करने नहीं, बल्कि उन्हें बचाने आया है।”’
  rationale: दिए गए यूनानी स्रोत में केवल संक्षिप्त पाठ है। लंबा कथन बाद की कुछ पांडुलिपियों में मिलता है; इसलिए उसे मुख्य पाठ में जोड़ने के बजाय पाठांतर के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘डाँटा’ को अधिक संस्कृतनिष्ठ ‘फटकारा’ के बजाय चुना गया है, क्योंकि यह वर्तमान बोलचाल और साहित्यिक गद्य दोनों में स्वाभाविक है।
