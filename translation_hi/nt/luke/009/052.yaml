source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: hi
  text: और उसने अपने आगे[a] दूतों को भेजा। वे गए और सामरियों के एक गाँव[b] में दाखिल हुए, ताकि उसके लिए तैयारी करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘उसके मुख के आगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘एक सामरी गाँव।’ यूनानी में अधिक शाब्दिक रूप से ‘सामरियों का एक गाँव’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: ἀποστέλλω के सामान्य अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγγέλους
  choice: दूतों
  rationale: यहाँ सन्दर्भ मनुष्य संदेशवाहकों का है; ‘दूत’ इस अर्थ को व्यक्त करते हुए यूनानी शब्द की व्यापक अर्थ-सीमा भी बनाए रखता है।
- source_word: πρὸ προσώπου αὐτοῦ
  choice: अपने आगे
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘अपने मुख के आगे’ है, पर गति और पहले पहुँचने का भाव आधुनिक हिन्दी में ‘अपने आगे’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: πορευθέντες
  choice: वे गए
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की गति बताता है; स्वतंत्र क्रिया के रूप में अनुवाद हिन्दी कथा-शैली में सहज है।
- source_word: εἰσῆλθον
  choice: दाखिल हुए
  rationale: गाँव में प्रवेश करने की पूर्ण घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη सामान्यतः नगर से छोटी बस्ती को सूचित करता है।
- source_word: Σαμαριτῶν
  choice: सामरियों के
  rationale: सम्बन्धकारक बहुवचन को निकटता से रखते हुए यह उस गाँव को सामरियों का या सामरियों द्वारा बसाया हुआ बताता है।
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: ताकि उसके लिए तैयारी करें
  rationale: ὡς के साथ अनन्त क्रिया यहाँ उद्देश्य प्रकट करती है; तैयारी की वस्तु को यूनानी की तरह अनकहा रखा गया है।
