    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: जब वे ... जा रहे थे
  rationale: वर्तमान कृदन्त वाला संबंधवाचक निरपेक्ष प्रयोग साथ-साथ चल रही क्रिया दिखाता है; यह हिन्दी में स्वाभाविक रूप से उसी कालगत अर्थ को व्यक्त करता है।
- source_word: ἐν τῇ ὁδῷ
  choice: मार्ग में
  rationale: यह ठोस यात्रा-परिवेश को बनाए रखता है और लूका के यात्रा-विषय की संभावित अनुगूँज को बिना व्याख्यात्मक विस्तार के खुला छोड़ता है।
- source_word: εἶπέν τις
  choice: किसी ने ... कहा
  rationale: τις अनिश्चित व्यक्ति को सूचित करता है; मूल यूनानी यहाँ उस व्यक्ति को पुरुष नहीं कहता।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: बोलने की क्रिया के साथ πρός का स्वाभाविक हिन्दी रूप।
- source_word: Ἀκολουθήσω σοι
  choice: मैं आपके पीछे चलूँगा
  rationale: यह भविष्यकालीन संकल्प को व्यक्त करता है तथा शाब्दिक साथ चलने और शिष्यत्व—दोनों अर्थ-छायाओं को सुरक्षित रखता है।
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: जहाँ कहीं भी जाएँगे
  rationale: ὅπου, ἐάν और संभावनार्थक क्रिया का संयोजन अनिश्चित व्यापकता, अर्थात ‘जहाँ कहीं भी’, व्यक्त करता है; ἀπέρχομαι के विदा होने के अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ἀκολουθέω में शिष्यत्व का गहन अर्थ
  choice: आपके पीछे चलूँगा
  alternative: मैं आपका शिष्य बनकर चलूँगा
  rationale: मूल क्रिया में शिष्यत्व की अनुगूँज है, पर स्पष्ट व्याख्यात्मक विस्तार जोड़ना उचित नहीं। चुना हुआ रूप वास्तविक यात्रा और शिष्यत्व दोनों को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘मार्ग’ यात्रा-परिवेश और साहित्यिक गरिमा दोनों बनाए रखता है।
