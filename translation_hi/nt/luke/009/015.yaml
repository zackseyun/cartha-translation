  text: And they did so[a], and had them all sit down.
translation:
  language: hi
  text: और उन्होंने वैसा ही किया और सबको बैठा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “सबको भोजन के लिए टिकाकर बैठा दिया” अथवा “सबको लिटा दिया।” यूनानी क्रिया भोजन के लिए लोगों को व्यवस्थित करने को दर्शाती है; उस समय लोग प्रायः टिककर या लेटकर भोजन करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल संयोजक के रूप में यह इस कार्य को पिछले निर्देश से जोड़ता है और कथा का क्रम बनाए रखता है।
- source_word: ἐποίησαν οὕτως
  choice: उन्होंने वैसा ही किया
  rationale: यह स्वाभाविक हिन्दी में पिछले पद में दिए गए यीशु के निर्देश का पालन व्यक्त करता है; οὕτως का अर्थ ‘उसी प्रकार’ या ‘वैसे ही’ है।
- source_word: καὶ
  choice: और
  rationale: दूसरे कार्य को पहले कार्य से जोड़ने वाला साधारण संयोजक; इसमें अतिरिक्त कालक्रमिक अर्थ नहीं जोड़ा गया है।
- source_word: κατέκλιναν
  choice: बैठा दिया
  rationale: κατακλίνω यहाँ भोजन के लिए लोगों को बैठाने अथवा टिकाकर/लेटाकर व्यवस्थित करने का कारक भाव रखता है। आधुनिक हिन्दी में ‘बैठा दिया’ प्रसंग का आशय स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἅπαντας
  choice: सबको
  rationale: यह कर्म के रूप में उपस्थित सभी लोगों को समाविष्ट करता है और यूनानी के पूर्ण समावेश के भाव को बनाए रखता है।
