id: LUK.9.24
reference: Luke 9:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: hi
  text: क्योंकि जो कोई अपना जीवन[a] बचाना चाहता है, वह उसे खो देगा; पर जो कोई मेरे लिए अपना जीवन खो देता है, वही उसे बचाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ सन्दर्भ के अनुसार “जीवन,” “प्राण,” “आत्मा,” या “स्वयं” हो सकता है।
    reason: ψυχή की व्यापक अर्थ-सीमा बताने और मुख्य पाठ में चुने गए ‘जीवन’ को अनावश्यक रूप से संकीर्ण न समझे जाने के लिए।
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: क्योंकि जो कोई ... बचाना चाहेगा
  rationale: γάρ पिछले कथन से व्याख्यात्मक सम्बन्ध जोड़ता है, इसलिए ‘क्योंकि’ रखा गया है। ὃς ... ἂν के साथ संभावनार्थक क्रिया एक सामान्य, अनिश्चित शर्त व्यक्त करती है; ‘जो कोई’ और ‘चाहेगा’ इसे स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: यहाँ ψυχή का तात्कालिक अर्थ व्यक्ति का जीवन है, जिसे बचाने या खोने की बात हो रही है। ‘जीवन’ आत्मा-मात्र का संकीर्ण अर्थ थोपे बिना कथन की व्यापकता बनाए रखता है; अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं। αὐτοῦ को हिन्दी के स्वाभाविक निजवाचक ‘अपना’ से व्यक्त किया गया है।
- source_word: σῶσαι / σώσει
  choice: बचाना / बचाएगा
  rationale: दोनों रूप एक ही क्रिया σῴζω के हैं। एक ही हिन्दी मूल ‘बचा-’ रखकर मूल कथन की विरोधाभासी पुनरुक्ति और शब्द-साम्य सुरक्षित रखा गया है।
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: खो देगा
  rationale: इस प्रसंग में ἀπόλλυμι का अर्थ ‘खोना’ है। ‘नष्ट करना’ अनावश्यक रूप से आत्म-विनाश का सक्रिय भाव ला सकता है; ‘खो देना’ जीवन बचाने और खोने के विरोध को स्पष्ट रखता है।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: ἕνεκεν सम्बन्धित कारण या प्रेरणा बताता है। ‘मेरे कारण’ स्वाभाविक आधुनिक हिन्दी में यीशु के कारण जीवन खोने का व्यक्तिगत शिष्यत्व-सन्दर्भ बनाए रखता है।
- source_word: οὗτος
  choice: वही
  rationale: οὗτος उस व्यक्ति को बल देकर अलग पहचानता है। हिन्दी में ‘वही’ इस बल को स्वाभाविक और संक्षिप्त रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण; आत्मा; स्वयं
  rationale: निकटवर्ती प्रसंग आत्म-त्याग, शिष्यत्व और यीशु के कारण जीवन खोने की बात करता है। ‘जीवन’ इस कथन का प्रत्यक्ष अर्थ व्यक्त करता है और इसे केवल अभौतिक ‘आत्मा’ तक सीमित नहीं करता। मूल शब्द की अर्थ-व्याप्ति पाद-टिप्पणी में सुरक्षित है।
- issue: सामान्य व्यक्ति के लिए पुल्लिंग एकवचन संरचना
  choice: जो कोई ... अपना ... वह/वही
  alternative: बहुवचन या लिंग-विशिष्ट ‘पुरुष’
  rationale: यूनानी की एकवचन प्रतिनिधिक संरचना हिन्दी के ‘जो कोई’ में बिना पुरुषों तक सीमित किए स्वाभाविक रूप से व्यक्त होती है। ‘अपना’ और ‘वही’ मूल की एकवचनता तथा बल दोनों बनाए रखते हैं।
- issue: परस्पर-विरोधी कथन में ‘बचाने’ का कालगत आयाम
  choice: पहले जीवन बचाने की इच्छा, फिर उसे खोना; यीशु के कारण खोना, फिर उसे बचाना
  alternative: ‘बचाना’ को केवल सांसारिक संरक्षण या केवल अंतिम उद्धार तक स्पष्ट रूप से सीमित करना
  rationale: मूल कथन जानबूझकर एक ही शब्द-समूह से सांसारिक और गहरे/अंतिम परिणाम के बीच तनाव उत्पन्न करता है। अनुवाद इस तनाव को बिना किसी एक धर्मवैज्ञानिक व्याख्या में सीमित किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्योंकि’ पिछले पद से सम्बन्ध बनाए रखता है; ‘पर’ विरोध को स्पष्ट करता है; और ‘वही’ οὗτος के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
