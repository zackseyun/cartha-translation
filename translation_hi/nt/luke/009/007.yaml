base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: hi
  text: हेरोदेस, चौथाई प्रदेश के शासक, ने जो कुछ हो रहा था, उस सब के बारे में सुना; और वह उलझन में था, क्योंकि कुछ लोग कह रहे थे कि यूहन्ना को मृतकों में से जिलाया गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूहन्ना मृतकों में से जी उठा था।” यूनानी क्रिया कर्मवाच्य है; शाब्दिक अर्थ है, “जिलाया गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: के बारे में सुना
  rationale: ἀκούω के साथ घटनाओं का कर्म होने के कारण हिन्दी में ‘के बारे में सुना’ स्वाभाविक रूप से समाचार मिलने का भाव व्यक्त करता है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में नए वाक्य और प्रसंग-क्रम से इसका कार्य स्पष्ट है; ‘अब’ या ‘तब’ जोड़ने से ऐसा काल-संकेत आ सकता है जो यूनानी में स्पष्ट नहीं है।
- source_word: ὁ τετραάρχης
  choice: चौथाई प्रदेश के शासक
  rationale: यह τετραάρχης की विशिष्ट ऐतिहासिक-राजनीतिक उपाधि का अर्थ सामान्य पाठक के लिए समझने योग्य रूप में रखता है और इसे ‘राजा’ नहीं बनाता।
- source_word: τὰ γινόμενα πάντα
  choice: जो कुछ हो रहा था, उस सब
  rationale: यह चल रही घटनाओं के व्यापक संदर्भ और γινόμενα के अपूर्णतापरक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: διηπόρει
  choice: बड़ी उलझन में था
  rationale: διαπορέω गहरी असमंजस या अनिश्चितता की अवस्था बताता है; यह हिन्दी में वर्तमान, सहज और कथात्मक रूप है।
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: क्योंकि कुछ लोग कह रहे थे
  rationale: διά के कारणसूचक अर्थ और τινων के अनिश्चित कर्ता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है। यूनानी का व्याकरणिक कर्मवाच्य यहाँ हिन्दी के कर्तृवाच्य में बदला है, पर अर्थ अपरिवर्तित है।
- source_word: ἠγέρθη
  choice: जिलाया गया है
  rationale: यह ἐγείρω के कर्मवाच्य रूप को बनाए रखता है और पुनर्जीवन के प्रसंग में स्वाभाविक हिन्दी है; जिलाने वाले का नाम पाठ की तरह अनकहा रहता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह बहुवचन νεκρῶν और ἐκ के ‘बीच में से बाहर’ के भाव को स्पष्ट तथा प्रचलित हिन्दी बाइबलीय भाषा में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के पुनर्जीवन की सूचना में कर्मवाच्य
  choice: यूहन्ना को मरे हुओं में से जिलाया गया है
  alternative: यूहन्ना मरे हुओं में से जी उठा है
  rationale: यूनानी ἠγέρθη कर्मवाच्य है। मुख्य पाठ उसी रूप को सुरक्षित रखता है, बिना जिलाने वाले की पहचान स्पष्ट किए; वैकल्पिक अकर्मक रूप पाठक की जानकारी के लिए पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चौथाई प्रदेश के शासक’ ऐतिहासिक पद को समझने योग्य बनाता है। वाक्य-विन्यास हिन्दी की स्वाभाविक कथात्मक शैली के अनुसार है, जबकि पुनर्जीवन संबंधी कर्मवाच्य और मूल पाठ की अनिर्दिष्ट कर्तृता सुरक्षित हैं।
