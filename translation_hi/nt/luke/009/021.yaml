- source_word: ἐπιτιμήσας
  choice: कड़ी चेतावनी दी
  rationale: इस कृदन्त में डाँटने अथवा सख्ती से चेताने का भाव हो सकता है। यहाँ शिष्यों को रहस्य प्रकट न करने का निर्देश है, इसलिए ‘कड़ी चेतावनी दी’ प्रसंग में स्वाभाविक रहते हुए उसकी प्रबलता बनाए रखता है।
- source_word: παρήγγειλεν
  choice: आज्ञा दी
  rationale: क्रिया अधिकारपूर्वक निर्देश देने को व्यक्त करती है; ‘आज्ञा दी’ उसकी शक्ति को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: μηδενὶ
  choice: किसी से न
  rationale: निषेध के साथ यह बोलने के अप्रत्यक्ष कर्म को व्यक्त करता है; हिन्दी में ‘किसी से न कहें’ सहज समतुल्य है।
- source_word: λέγειν
  choice: कहें
  rationale: व्यक्ति और कथ्य के साथ λέγω का यहाँ स्वाभाविक हिन्दी रूप ‘किसी से ... कहें’ है।
- source_word: τοῦτο
  choice: यह बात
  rationale: संकेतवाचक शब्द ठीक पहले की पतरस की स्वीकारोक्ति की ओर लौटता है। ‘यह बात’ संकेत को बनाए रखता है और उसके आशय को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: पतरस की स्वीकारोक्ति के बाद यीशु के निषेध की तीव्रता
  choice: इस समय यह बात किसी को न बताने की कड़ी और अधिकारपूर्ण मनाही
  alternative: इसका उल्लेख न करने की अपेक्षाकृत हल्की चेतावनी
  rationale: ἐπιτιμήσας और παρήγγειλεν का मेल साधारण अनुरोध से अधिक प्रबल निषेध दिखाता है। अनुवाद इस कथात्मक तनाव को बनाए रखता है, पर उसके कारण की कोई धर्मवैज्ञानिक व्याख्या पाठ में नहीं जोड़ता।
