reference: Luke 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: hi
  text: प्रेरित लौटकर आए और उन्होंने यीशु को वह सब बताया जो उन्होंने किया था। तब वह उन्हें अपने साथ लेकर बैतसैदा नामक नगर में एकांत में चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: लौटकर आए
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई वापसी को दर्शाता है; यह हिन्दी में क्रम और समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरित
  rationale: लूका के इस मिशन-संदर्भ में यह बारह शिष्यों के लिए स्थापित पदनाम है; ‘प्रेरित’ मानक हिन्दी बाइबलीय शब्द है।
- source_word: διηγήσαντο αὐτῷ
  choice: उन्होंने यीशु को ... बताया
  rationale: διηγέομαι किसी बात का वृत्तांत देने या बताने को व्यक्त करता है। सर्वनाम αὐτῷ का संदर्भ यीशु है, इसलिए हिन्दी में स्पष्टता के लिए नाम दिया गया है।
- source_word: ὅσα ἐποίησαν
  choice: वह सब ... जो उन्होंने किया था
  rationale: ὅσα की व्यापकता को ‘वह सब जो’ व्यक्त करता है; ‘किया था’ उनके बताने से पहले पूरे हुए कार्य को स्पष्ट करता है।
- source_word: παραλαβὼν αὐτούς
  choice: उन्हें अपने साथ लेकर
  rationale: यहाँ παραλαμβάνω का अर्थ साथियों को अपने साथ ले जाना है; यह हिन्दी में सम्बन्ध और गति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπεχώρησεν
  choice: चले गए
  rationale: क्रिया का भाव सार्वजनिक स्थान या लोगों से हटकर चले जाने का है। ‘चले गए’ प्राकृतिक हिन्दी है, जबकि अलग होने का विशेष भाव अगले पदबंध ‘एकांत में’ से प्रकट होता है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: पदबंध का अर्थ निजी तौर पर या दूसरों से अलग होना है। यीशु प्रेरितों को साथ ले गए थे, इसलिए यह पूर्ण अकेलेपन का संकेत नहीं देता; पादटिप्पणी इस सूक्ष्मता को सुरक्षित रखती है।
- source_word: εἰς πόλιν καλουμένην Βηθσαϊδά
  choice: बैतसैदा नामक नगर की ओर
  rationale: πόλις के लिए ‘नगर’ उपयुक्त और आकार के विषय में अनावश्यक रूप से निश्चित न होने वाला शब्द है। εἰς को ‘की ओर’ कहना गंतव्य की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Βηθσαϊδά
  choice: बैतसैदा
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण चुना गया है।
theological_decisions:
- issue: κατ’ ἰδίαν का अर्थ, जबकि प्रेरित यीशु के साथ थे
  choice: ‘एकांत में’—अर्थात सार्वजनिक भीड़ या अन्य लोगों से अलग
  alternative: ‘अकेले’ अथवा ‘निजी तौर पर’
  rationale: ‘अकेले’ पाठ के इस कथन से टकराता कि यीशु प्रेरितों को साथ ले गए। ‘एकांत में’ अलग हटने का भाव बनाए रखता है और पूर्ण एकाकीपन का अनिवार्य अर्थ नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में यीशु का नाम स्पष्टता के लिए दिया गया है। ‘एकांत में’ के साथ पादटिप्पणी मूल यूनानी की अर्थगत सूक्ष्मता को सुरक्षित रखती है।
