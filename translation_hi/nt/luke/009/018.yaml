  naturalness: The Hindi is clear, modern, and suitably dignified. ‘और ऐसा हुआ कि’ is a natural rendering of the narrative transition, and the two-sentence presentation preserves the source’s juxtaposition without producing an awkwardly long Hindi sentence. ‘भीड़ मुझे कौन कहती है?’ is idiomatic enough with ‘भीड़’ used collectively.
  terminology: ‘चेले,’ ‘प्रार्थना,’ and ‘अकेले’ are appropriate standard Hindi choices. The footnote appropriately preserves the lexical range of κατὰ μόνας and does not resolve the contextual tension interpretively.
