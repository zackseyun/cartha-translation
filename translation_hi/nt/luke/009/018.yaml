  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह अकेले[a] प्रार्थना कर रहा था, तब चेले उसके साथ थे। उसने उनसे पूछा, “भीड़ मुझे कौन कहती है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एकांत में।” यूनानी पद का अर्थ पूर्णतः अकेला होना या दूसरों से अलग होकर निजी रूप से होना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: और ऐसा हुआ कि
  rationale: लूका की सामान्य कथात्मक भूमिका को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: जब वह ... प्रार्थना कर रहा था
  rationale: ἐν के साथ प्रयुक्त articular infinitive की समकालिकता को हिन्दी के सहज कालवाचक वाक्यांश से व्यक्त करता है।
- source_word: κατὰ μόνας
  choice: अकेले
  rationale: वाक्यांश का सीधा अर्थ ‘अकेले’ या ‘एकांत में’ हो सकता है; मुख्य पाठ में संक्षिप्त रूप रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: चेले उसके साथ थे
  rationale: सरल संबंधपरक अर्थ को सुरक्षित रखता है और यह अनुमान नहीं जोड़ता कि चेले केवल पास में थे।
- source_word: ἐπηρώτησεν αὐτοὺς
  choice: उसने उनसे पूछा
  rationale: सामान्य प्रश्न पूछने के लिए स्वाभाविक आधुनिक हिन्दी।
- source_word: λέγων
  choice: प्रत्यक्ष उद्धरण द्वारा अंतर्निहित
  rationale: हिन्दी में ‘यह कहते हुए पूछा’ अनावश्यक रूप से भारी होता; ‘पूछा’ के बाद सीधा कथन λέγων का कार्य स्वाभाविक ढंग से निभाता है।
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: भीड़ मुझे कौन कहती है?
  rationale: ग्रीक अप्रत्यक्ष प्रश्न को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है तथा ‘मैं कौन हूँ’ के बारे में भीड़ की पहचान-संबंधी धारणा सुरक्षित रखता है।
- source_word: οἱ ὄχλοι
  choice: भीड़
  rationale: ग्रीक बहुवचन विभिन्न जनसमूहों को सूचित कर सकता है, पर हिन्दी में सामूहिक ‘भीड़’ अधिक स्वाभाविक है और जनसमुदाय का अर्थ बनाए रखता है।
theological_decisions:
- issue: यीशु के ‘अकेले’ प्रार्थना करने और चेलों के ‘उसके साथ’ होने के बीच प्रत्यक्ष तनाव
  choice: 'दोनों कथनों को बिना सामंजस्य बैठाए सीधे रखा गया: वह अकेले प्रार्थना कर रहा था, और चेले उसके साथ थे।'
  alternative: ‘एकांत में’ कहना या यह जोड़ना कि चेले पास ही थे।
  rationale: κατὰ μόνας एकांत अथवा निजी रूप से होने का भाव भी दे सकता है, किंतु मूल पाठ स्वयं स्थिति की व्याख्या नहीं करता। अनुवाद किसी स्थानिक व्यवस्था को जोड़कर अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेले’ और ‘भीड़’ सामान्य पाठक के लिए परिचित हैं। कथात्मक तनाव को स्पष्ट करने के लिए दो वाक्य रखे गए हैं, पर मूल अर्थ में कोई व्याख्यात्मक विवरण नहीं जोड़ा गया।
