id: LUK.9.12
reference: Luke 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: hi
  text: दिन ढलने लगा। तब वे बारह उनके पास आए और उनसे कहा, “भीड़ को विदा कर दीजिए, ताकि लोग आस-पास के गाँवों और देहात में जाकर ठहरने की जगह और भोजन-सामग्री[a] ढूँढ़ लें, क्योंकि हम यहाँ एक निर्जन स्थान[b] में हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खाने का सामान।” यूनानी शब्द का अर्थ भोजन या खाद्य-रसद हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उजाड़ स्थान।” यूनानी शब्द ऐसे क्षेत्र को बता सकता है जहाँ कोई नहीं रहता या बहुत कम लोग रहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: दिन ढलने लगा
  rationale: दिन के संध्या की ओर बढ़ने के लिए यूनानी रूपक को स्वाभाविक और संक्षिप्त हिन्दी मुहावरे में रखा गया है; δέ का कथात्मक संबंध अगले वाक्य में “तब” से सहज रूप में व्यक्त होता है।
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: तब वे बारह उनके पास आए
  rationale: οἱ δώδεκα की पदवी-सदृश अभिव्यक्ति को “वे बारह” के रूप में रखा गया है, बिना “प्रेरित” या “शिष्य” जोड़कर अर्थ को अधिक स्पष्ट करने के। προσέρχομαι का निकट आने का भाव “पास आए” में बना रहता है।
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: भीड़ को विदा कर दीजिए
  rationale: इस प्रसंग में ἀπολύω का अर्थ छोड़ देना नहीं, बल्कि लोगों को वहाँ से जाने देना या विदा करना है। यीशु को संबोधन में आधुनिक हिन्दी का आदरसूचक रूप स्वाभाविक है।
- source_word: ἵνα πορευθέντες
  choice: ताकि लोग ... जाकर
  rationale: ἵνα के उद्देश्य और πορευθέντες की पूर्ववर्ती गति—जाकर फिर ढूँढ़ना—दोनों को स्वाभाविक हिन्दी रचना में सुरक्षित रखा गया है।
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: आस-पास के गाँवों और देहात में
  rationale: κώμαι के लिए “गाँव” और ἀγροί के व्यापक ग्रामीण अर्थ के लिए “देहात” चुना गया है; इससे इसे केवल खेतों तक सीमित नहीं किया गया।
- source_word: καταλύσωσιν
  choice: ठहरने की जगह ... ढूँढ़ लें
  rationale: यहाँ क्रिया का आशय रात बिताने या टिकने का स्थान पाना है। “ठहरने की जगह” सामान्य पाठक के लिए स्पष्ट है और अनावश्यक तकनीकी शब्दावली से बचता है।
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: भोजन-सामग्री ढूँढ़ लें
  rationale: ἐπισιτισμός केवल तैयार भोजन नहीं, बल्कि खाने की रसद या सामग्री भी सूचित कर सकता है। “भोजन-सामग्री” इस विस्तार को बनाए रखती है।
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: क्योंकि हम यहाँ एक निर्जन स्थान में हैं
  rationale: ὧδε को “यहाँ” से स्पष्ट रखा गया है। ἔρημος के लिए “निर्जन” चुना गया है, जो कम या न के बराबर आबादी वाले स्थान को बताता है और आवश्यक रूप से मरुस्थल का अर्थ नहीं देता।
theological_decisions:
- issue: ἔρημος को धार्मिक अर्थ में “जंगल” या “मरुभूमि” मानना
  choice: निर्जन स्थान
  alternative: उजाड़ स्थान / मरुभूमि
  rationale: इस प्रसंग में शब्द का मुख्य बल आबादी और उपलब्ध संसाधनों से दूर स्थान पर है। अनिश्चित भूगोल या निर्गमन-संबंधी धार्मिक संकेत को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए हिन्दी का आदरसूचक बहुवचन (“उनके,” “उनसे,” “कर दीजिए”) प्रयोग किया गया है, जबकि यूनानी के एकवचन संदर्भ का आशय नहीं बदला गया। “वे बारह” मूल की संक्षिप्त पदवी को बनाए रखता है।
