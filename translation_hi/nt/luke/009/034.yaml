  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: hi
  text: जब वह ये बातें कह रहा था, तब एक बादल प्रकट हुआ[b] और उन पर छाने लगा।[a] जब वे बादल के भीतर प्रवेश कर रहे थे, तो वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बादल आया और उन पर छा गया।” यूनानी क्रिया का अनुवाद आरंभ होने के भाव के बिना भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह बादल संभवतः पुराने नियम के उन दृश्यों की याद दिलाता है जिनमें परमेश्वर अपनी उपस्थिति प्रकट करते हैं, यद्यपि यह पद स्वयं ऐसा स्पष्ट रूप से नहीं कहता।
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक रूप को बनाए रखता है और पतरस की पिछली बातों की ओर स्वाभाविक ढंग से संकेत करता है।
- source_word: αὐτοῦ λέγοντος
  choice: जब वह ... कह ही रहा था
  rationale: वर्तमान कृदंत वाले संबंधरहित संबंधकारक की समकालिक और जारी क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐγένετο νεφέλη
  choice: एक बादल प्रकट हुआ
  rationale: बादल के दृश्य में आने या उपस्थित होने का भाव देता है, पर उसके उद्गम के बारे में कुछ नहीं जोड़ता।
- source_word: ἐπεσκίαζεν
  choice: उन पर छाने लगा
  rationale: अपूर्ण भूतकाल के विकसित होती क्रिया वाले संभावित भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘छाना’ बादल की क्रिया को स्पष्ट रखता है।
- source_word: ἐφοβήθησαν
  choice: वे डर गए
  rationale: भय उत्पन्न होने की घटना को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: जब वे ... प्रवेश कर रहे थे
  rationale: समकालिक समय व्यक्त करने वाली रचना और उसके कर्ता ‘वे’ को बनाए रखता है।
- source_word: εἰς τὴν νεφέλην
  choice: बादल के भीतर
  rationale: εἰς द्वारा व्यक्त बादल के अंदर जाने की स्थानिक गति को केवल उसके नीचे आने से अलग और स्पष्ट रखता है।
theological_decisions:
- issue: बादल का स्वरूप और उसकी क्रिया
  choice: मुख्य पाठ में केवल यह वर्णन कि बादल प्रकट हुआ और उन पर छाने लगा
  alternative: बादल को सीधे परमेश्वर की प्रकट उपस्थिति या महिमा का बादल बताना
  rationale: संदर्भ पुराने नियम में परमेश्वर की प्रकट उपस्थिति वाले दृश्यों की याद दिलाता है, पर यह पद स्वयं बादल की स्पष्ट धार्मिक पहचान नहीं बताता; इसलिए संकेत सुरक्षित है, पर व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘कह ही रहा था’ समकालिकता को, ‘छाने लगा’ जारी या आरंभ होती क्रिया को, और ‘बादल के भीतर’ वास्तविक प्रवेश के स्थानिक भाव को स्पष्ट करता है।
