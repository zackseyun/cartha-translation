  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: hi
  text: पर यीशु ने उनके मन में चल रहे तर्क-विचार को जानकर एक बच्चे को पकड़कर उसे अपने पास खड़ा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: जानकर
  rationale: यह कृदंत यहाँ मानसिक बोध या जानकारी व्यक्त करता है। ‘जानकर’ स्वाभाविक हिन्दी है और यह नहीं बताता कि यीशु ने यह किस माध्यम से जाना।
- source_word: διαλογισμὸν
  choice: विचार
  rationale: संज्ञा भीतर के तर्क-विचार या मनन को सूचित कर सकती है। एकवचन ‘विचार’ मूल की संख्या को बनाए रखता है और प्रसंग में शिष्यों की आपसी होड़ से जुड़े मनोभाव को समेटता है।
- source_word: τῆς καρδίας αὐτῶν
  choice: उनके मन का
  rationale: मूल में ‘हृदय’ एकवचन और संबंधवाचक सर्वनाम बहुवचन है। हिन्दी में ‘उनके मन का’ यह सामूहिक एकवचन स्वाभाविक रूप से बनाए रखता है; यहाँ ‘मन’ भीतरी विचारों के स्थान के अर्थ में सामान्य और सुबोध है।
- source_word: ἐπιλαβόμενος
  choice: अपने पास लिया
  rationale: क्रिया का मूल अर्थ पकड़ने या थामने से जुड़ा है, पर बच्चे के संदर्भ में ‘अपने पास लिया’ क्रिया की ठोस पहल और हिन्दी की स्वाभाविकता दोनों रखता है, बिना अनावश्यक कठोरता के।
- source_word: παιδίον
  choice: एक बच्चे को
  rationale: ‘बच्चा’ आयु के अनिर्दिष्ट छोटे बालक के लिए स्पष्ट आधुनिक हिन्दी है; ‘छोटा’ जोड़ना मूल से अधिक बल देता।
- source_word: ἔστησεν
  choice: खड़ा किया
  rationale: ἵστημι का सकर्मक रूप यहाँ ‘खड़ा करना’ है। यह केवल ‘रख दिया’ की अपेक्षा मूल की शारीरिक मुद्रा को अधिक स्पष्टता से बचाता है।
- source_word: παρ’ ἑαυτῷ
  choice: अपने बगल में
  rationale: वाक्यांश यीशु के ठीक पास होने को बताता है। ‘अपने बगल में’ आधुनिक हिन्दी में स्पष्ट है और आत्मवाचक संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु का भीतर का विचार जानना
  choice: पाठ केवल यह कहता है कि यीशु ने उनका विचार जाना; जानने का माध्यम नहीं बताया गया।
  alternative: इसे स्पष्टतः अलौकिक सर्वज्ञता या केवल तीक्ष्ण मानवीय समझ के रूप में समझाना।
  rationale: लूका के कथन को उसी सीमा में रखते हुए अनिर्णीत धार्मिक तनाव सुरक्षित रखा गया है और कोई अतिरिक्त व्याख्या अनुवाद में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन’ हिन्दी में आंतरिक विचार और अभिप्राय का स्वाभाविक संकेत देता है। वाक्य की क्रियाओं को क्रमबद्ध और दृश्यात्मक रखा गया है।
