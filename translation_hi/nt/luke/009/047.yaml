revisions:
- from: पर यीशु ने उनके मन का विचार जानकर एक बच्चे को अपने पास लिया और उसे अपने बगल में खड़ा किया।
  to: पर यीशु ने उनके मन में चल रहे तर्क-विचार को जानकर एक बच्चे को पकड़कर उसे अपने पास खड़ा किया।
  rationale: The revision replaces an unnatural and overly flat expression with “मन में चल रहे तर्क-विचार,” preserving the inward and deliberative sense of the Greek without making a claim about the means of Jesus’ knowledge. It also renders ἐπιλαβόμενος concretely as “पकड़कर,” while “अपने पास खड़ा किया” faithfully and naturally conveys that Jesus set the child beside himself. No footnotes are needed because the Hindi wording does not introduce a material ambiguity requiring explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ awareness of the disciples’ inward deliberation, the taking of a child, and setting the child beside himself. However, “उनके मन का विचार” is semantically repetitive and does not naturally express διαλογισμός, which has a deliberative/reasoning nuance. “अपने पास लिया” can suggest receiving or embracing the child rather than the concrete action of taking hold of the child (ἐπιλαβόμενος).
  naturalness: The sentence is otherwise clear and appropriately dignified, but “उनके मन का विचार” is not idiomatic modern Hindi. “उनके मन में चल रहे तर्क-विचार” naturally conveys inward reasoning without specifying how Jesus knew it.
  terminology: “यीशु,” “बच्चा,” and “खड़ा किया” are suitable. “तर्क-विचार” best preserves the cognitive and potentially disputatious force of διαλογισμός. “अपने पास” is a natural rendering of παρ’ ἑαυτῷ and avoids the slightly physical/colloquial feel of “अपने बगल में.”
  issues:
  - severity: medium
    issue: “उनके मन का विचार” is awkward and underspecifies διαλογισμός.
    rationale: The phrase is redundant in Hindi (“thought of their mind”) and “विचार” alone can be merely a thought. The Greek denotes reasoning, deliberation, or argumentation.
  - severity: low
    issue: “अपने पास लिया” weakens ἐπιλαβόμενος.
    rationale: It may mean welcomed, received, or drew near, whereas the Greek participle denotes taking hold of. “पकड़कर” preserves the concrete action in natural Hindi.
  revised_text: पर यीशु ने उनके मन में चल रहे तर्क-विचार को जानकर एक बच्चे को पकड़कर उसे अपने पास खड़ा किया।
  revised_footnotes: []
  revision_rationale: The revision replaces an unnatural and overly flat expression with “मन में चल रहे तर्क-विचार,” preserving the inward and deliberative sense of the Greek without making a claim about the means of Jesus’ knowledge. It also renders ἐπιλαβόμενος concretely as “पकड़कर,” while “अपने पास खड़ा किया” faithfully and naturally conveys that Jesus set the child beside himself. No footnotes are needed because the Hindi wording does not introduce a material ambiguity requiring explanation.
