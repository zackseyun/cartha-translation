source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: hi
  text: तब उसने उन पाँच रोटियों और दो मछलियों को लिया, स्वर्ग की ओर आँखें उठाईं, उन्हें आशीष दी[a], उनके टुकड़े किए, और उन्हें चेलों को देता रहा ताकि वे उन्हें भीड़ के सामने परोसें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके लिए धन्यवाद दिया।” यहाँ यूनानी क्रिया का शाब्दिक अर्थ “आशीष दी” है, जबकि कुछ समानान्तर वृत्तान्तों में “धन्यवाद दिया” वाली क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: लिया
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले की सहायक क्रिया बताता है। हिन्दी में क्रमबद्ध क्रियाओं के साथ ‘लिया’ स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: तब
  rationale: यह कथानक की हल्की प्रगति दिखाता है; ‘तब’ आधुनिक हिन्दी में इस संयोजक बल को सहजता से व्यक्त करता है।
- source_word: ἄρτους
  choice: रोटियों
  rationale: इस भोजन-वितरण प्रसंग में बहुवचन ἄρτους अलग-अलग रोटियों को सूचित करता है, न कि अमूर्त रूप से भोजन या रोटी को।
- source_word: ἰχθύας
  choice: मछलियों
  rationale: यह यूनानी बहुवचन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: स्वर्ग की ओर आँखें उठाईं
  rationale: यह प्रार्थनापूर्ण मुद्रा में ऊपर देखने की क्रिया को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οὐρανὸν
  choice: स्वर्ग
  rationale: आशीष देने की प्रार्थनापूर्ण पृष्ठभूमि में ‘स्वर्ग’ केवल भौतिक आकाश की अपेक्षा प्रसंगगत अर्थ को बेहतर सुरक्षित रखता है।
- source_word: εὐλόγησεν αὐτοὺς
  choice: उन्हें आशीष दी
  rationale: क्रिया का अर्थ ‘आशीष देना’ है और पुल्लिंग बहुवचन सर्वनाम रोटियों तथा मछलियों को सामूहिक रूप से संदर्भित करता है।
- source_word: κατέκλασεν
  choice: उनके टुकड़े किए
  rationale: भोजन को बाँटने के लिए तोड़ने की क्रिया है। हिन्दी में ‘टुकड़े किए’ निहित कर्म को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐδίδου
  choice: देता रहा
  rationale: अपूर्ण भूतकाल वितरण के दौरान जारी या बार-बार होने वाली क्रिया दर्शाता है; ‘देता रहा’ इस पहलू को सुरक्षित रखता है।
- source_word: μαθηταῖς
  choice: चेलों
  rationale: मूल में निश्चित पद है, पर ‘उसके’ स्पष्ट रूप से नहीं है; प्रसंग में ‘चेलों’ पर्याप्त रूप से स्पष्ट है।
- source_word: παραθεῖναι
  choice: सामने परोसें
  rationale: उद्देश्यसूचक क्रिया भोजन को लोगों के सामने रखने के लिए है। भोजन के प्रसंग में ‘सामने परोसें’ ठोस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὄχλῳ
  choice: भीड़
  rationale: ὄχλος यहाँ एकत्र जनसमूह को दर्शाता है; ‘भीड़’ आधुनिक और प्रसंगानुकूल है।
theological_decisions:
- issue: प्रार्थनापूर्ण प्रसंग में οὐρανός का अर्थ
  choice: स्वर्ग
  alternative: आकाश
  rationale: ऊपर की ओर दृष्टि उठाना आशीष देने के साथ जुड़ा है, इसलिए ‘स्वर्ग’ बिना अतिरिक्त सिद्धान्त जोड़े प्रसंग के धार्मिक आयाम को सुरक्षित रखता है।
- issue: εὐλόγησεν का अनुवाद
  choice: उन्हें आशीष दी
  alternative: उनके लिए धन्यवाद दिया
  rationale: लूका ने यहाँ εὐλογέω अर्थात ‘आशीष देना’ प्रयुक्त किया है, εὐχαριστέω अर्थात ‘धन्यवाद देना’ नहीं। इसलिए समानान्तर वृत्तान्तों के अनुरूप अर्थ समतल करने के बजाय मूल की शब्दगत विशिष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज कथात्मक प्रवाह और गरिमापूर्ण बाइबलीय शैली। जारी वितरण को ‘देता रहा’ से व्यक्त किया गया है और स्रोत की ‘आशीष’ संबंधी शब्दगत विशिष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
