  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: hi
  text: पर यीशु ने उत्तर दिया, “हे अविश्वासी और भ्रष्ट पीढ़ी! मैं कब तक तुम्हारे साथ रहूँगा और तुम्हें सहता रहूँगा? अपने बेटे को यहाँ ले आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄπιστος
  choice: अविश्वासी
  rationale: यह शब्द विश्वास न करने या विश्वास के अभाव को व्यक्त करता है; ‘अविश्वासी’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: διεστραμμένη
  choice: टेढ़ी
  rationale: मूल शब्द के ‘मुड़ी हुई/विकृत’ नैतिक रूपक को बनाए रखता है और अर्थ को किसी विशिष्ट doctrinal व्याख्या तक सीमित नहीं करता।
- source_word: ἀνέξομαι ὑμῶν
  choice: तुम्हें सहता रहूँगा
  rationale: क्रिया के धैर्यपूर्वक सहने के भाव तथा प्रश्न की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσάγαγε ὧδε
  choice: यहाँ ले आओ
  rationale: आज्ञार्थक अभिव्यक्ति का सीधा, वर्तमान हिन्दी रूप है।
theological_decisions:
- issue: ‘अविश्वासी और टेढ़ी पीढ़ी’ का संबोधन किन लोगों के लिए है
  choice: संबोधन को सामूहिक और अनिर्दिष्ट रखा गया है
  alternative: इसे केवल चेलों, पिता, या उपस्थित भीड़ पर स्पष्ट रूप से लागू करना
  rationale: यूनानी पाठ ‘पीढ़ी’ कहता है, पर संबोधन की सटीक सीमा नहीं बताता; अनुवाद को यह अस्पष्टता बनाए रखनी चाहिए।
- issue: यीशु के प्रश्न का भाव
  choice: प्रश्न को विलाप और धैर्य की सीमा व्यक्त करने वाले प्रश्न के रूप में यथावत रखा गया है
  alternative: इसे केवल निंदा या केवल अलंकारिक कथन बनाकर स्पष्ट करना
  rationale: मूल पाठ में भावात्मक तनाव है, जिसे अतिरिक्त व्याख्या के बिना संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे’ बाइबलीय संबोधन की गंभीरता बनाए रखता है, जबकि शेष वाक्य स्वाभाविक आधुनिक हिन्दी में है।
