  verdict: revise
  source_fidelity: The draft accurately renders the address, the two future-oriented questions, and the imperative. However, ‘टेढ़ी पीढ़ी’ is overly literal in Hindi and can suggest merely physical crookedness rather than the Greek moral metaphor of a generation that is distorted/corrupt.
  naturalness: The sentence structure and register are clear, dignified modern Hindi. Replacing ‘टेढ़ी’ with ‘भ्रष्ट’ makes the moral-metaphorical force natural and immediately intelligible without adding interpretive specificity.
  terminology: ‘अविश्वासी,’ ‘सहता रहूँगा,’ and ‘यहाँ ले आओ’ are appropriate. ‘भ्रष्ट’ is a standard Hindi rendering for διεστραμμένη in this collective moral characterization and does not identify a narrower target for Jesus’ address.
  issues:
  - severity: low
    issue: ‘टेढ़ी पीढ़ी’ is not an idiomatic moral characterization in contemporary Hindi.
    rationale: διεστραμμένη is figuratively ‘twisted/perverted,’ denoting moral distortion. ‘भ्रष्ट पीढ़ी’ conveys this sense naturally; the collective referent remains unspecified, as in the Greek.
