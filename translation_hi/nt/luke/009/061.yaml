id: LUK.9.61
reference: Luke 9:61
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: hi
  text: एक और व्यक्ति ने भी कहा, “प्रभु, मैं आपके पीछे चलूँगा; पर पहले मुझे अपने घर के लोगों से विदा लेने की अनुमति दीजिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: एक और व्यक्ति
  rationale: यह पिछले वक्ताओं से अलग एक अतिरिक्त व्यक्ति का परिचय देता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: Ἀκολουθήσω σοι
  choice: मैं आपके पीछे चलूँगा
  rationale: भविष्यत् सूचक रूप वक्ता के घोषित इरादे को व्यक्त करता है; ‘पीछे चलना’ शिष्यत्व के संदर्भ को भी स्वाभाविक रूप से बनाए रखता है।
- source_word: κύριε
  choice: प्रभु
  rationale: यीशु के लिए सीधे संबोधन में यह सम्मान और संभावित गहरे धर्मवैज्ञानिक अर्थ, दोनों को खुला रखता है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह कार्यों की प्राथमिकता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπίτρεψόν μοι
  choice: मुझे ... की अनुमति दीजिए
  rationale: आज्ञार्थक रूप यहाँ विनम्रतापूर्वक अनुमति माँगता है; यह आधुनिक मानक हिन्दी में गरिमापूर्ण है।
- source_word: ἀποτάξασθαι
  choice: विदा लेने
  rationale: मध्यवाच्य अनन्त रूप का अर्थ यहाँ घर के लोगों से विदाई लेना है; ‘विदा लेने’ में अपेक्षित अर्थ संक्षेप और स्वाभाविकता से आता है।
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: अपने घर के लोगों से
  rationale: यूनानी वाक्यांश का आशय उसके घर में रहने वाले या घर से जुड़े लोगों से है; यह हिन्दी में स्वाभाविक है और केवल भवन को संबोधित करने की अस्वाभाविकता से बचता है।
- source_word: δὲ καὶ
  choice: भी ... पर
  rationale: ‘भी’ एक और उदाहरण जुड़ने का भाव रखता है, जबकि ‘पर’ वक्ता की प्रतिबद्धता और पहले रखी गई शर्त के बीच विरोध को व्यक्त करता है।
theological_decisions:
- issue: यीशु को संबोधित करते हुए κύριε का अनुवाद
  choice: प्रभु
  alternative: स्वामी / महोदय
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और यीशु की पहचान से जुड़े संभावित धर्मवैज्ञानिक भार दोनों को बनाए रखता है; इसे केवल सांसारिक शिष्टाचार या कार्यात्मक स्वामित्व तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक ‘आप’ का प्रयोग। वाक्य को साधारण पाठक के लिए सहज रखते हुए मूल की क्रमबद्धता, प्रतिबद्धता और उसके बाद आने वाली शर्त को सुरक्षित रखा गया है।
