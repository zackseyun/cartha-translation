base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: hi
  text: ऐसा हुआ कि जब उसके उठा लिए जाने के दिन पूरे हो रहे थे, तब उसने स्वयं यरूशलेम जाने का दृढ़ निश्चय किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यूनानी में शाब्दिक रूप से, ‘उसने अपना मुख स्थिर किया।’ यह दृढ़ निश्चय व्यक्त करने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह कथानक में नए घटनाक्रम का सूत्रपात करने वाली अभिव्यक्ति है। ‘ऐसा हुआ कि’ उसके घटनासूचक बल को स्वाभाविक आधुनिक हिन्दी में रखता है, बिना किसी ऐसे स्पष्ट ‘अब’ को जोड़ने के जो यूनानी में नहीं है।
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: जब ... के दिन पूरे हो रहे थे
  rationale: ἐν के साथ वर्तमानकालिक articular infinitive समय और जारी प्रक्रिया दोनों व्यक्त करता है। ‘पूरे हो रहे थे’ अवधि के पूर्ण होने की ओर बढ़ने का भाव बनाए रखता है।
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: उसके उठा लिए जाने
  rationale: ἀνάλημψις का मूल भाव ‘ऊपर उठा लिया जाना’ है। यह रूप पारंपरिक ‘स्वर्गारोहण’ से कुछ व्यापक रहकर यूनानी की निष्क्रिय अभिव्यक्ति और उसके संभावित व्यापक कथात्मक संकेत को सुरक्षित रखता है।
- source_word: καὶ αὐτὸς
  choice: तब उसने स्वयं
  rationale: αὐτός के बलाघात को ‘स्वयं’ द्वारा व्यक्त किया गया है; ‘तब’ हिन्दी वाक्य में मुख्य उपवाक्य को समयसूचक अधीन उपवाक्य से स्वाभाविक रूप से जोड़ता है।
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: अपना मुख दृढ़ कर लिया
  rationale: स्रोत का सजीव सामी मुहावरा सुरक्षित रखा गया है। हिन्दी में यह दृढ़ निश्चय का भाव देता है, और पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: यरूशलेम जाने के लिए
  rationale: यहाँ genitive articular infinitive उद्देश्य व्यक्त करता है; ‘जाने के लिए’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: ἀναλήμψεως αὐτοῦ का आशय
  choice: उसके उठा लिए जाने
  alternative: उसके स्वर्गारोहण
  rationale: यूनानी संज्ञा शाब्दिक रूप से उठा लिए जाने को व्यक्त करती है और सम्भवतः यीशु की मृत्यु, पुनरुत्थान तथा महिमा में उठाए जाने की आगामी गति को व्यापक रूप से समेटती है। मुख्य पाठ इस तनाव को संकीर्ण नहीं करता; पारंपरिक और सम्भव अर्थ पादटिप्पणी में दिया गया है।
- issue: τὸ πρόσωπον ἐστήρισεν का मुहावरा
  choice: अपना मुख दृढ़ कर लिया
  alternative: दृढ़ निश्चय किया
  rationale: मुहावरे को बनाए रखने से यीशु के अटल संकल्प के साथ स्रोत की साहित्यिक और भविष्यद्वक्ताई प्रतिध्वनि भी बनी रहती है, जबकि पादटिप्पणी साधारण अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप अपनाया गया है। ‘ऐसा हुआ कि’ बाइबिलीय कथाभाव को रखता है पर अत्यधिक पुरातन नहीं है। ‘मुख दृढ़ कर लिया’ जानबूझकर सजीव स्रोत-मुहावरे को सुरक्षित रखता है; उसका अर्थ पादटिप्पणी में स्पष्ट है।
