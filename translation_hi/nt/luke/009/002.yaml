  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: hi
  text: और उसने उन्हें परमेश्वर के राज्य[a] का प्रचार करने और बीमारों को चंगा करने के लिए भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का शासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: संदर्भ में यह शिष्यों को एक निश्चित कार्य के लिए भेजे जाने को व्यक्त करता है; हिन्दी में ‘भेजा’ स्वाभाविक रूप से इस आशय को संप्रेषित करता है।
- source_word: κηρύσσειν
  choice: प्रचार करने
  rationale: यह सार्वजनिक रूप से घोषणा करने का भाव रखता है। ‘प्रचार करना’ आधुनिक बाइबलीय हिन्दी में परिचित है और केवल निजी शिक्षा देने के बजाय सार्वजनिक उद्घोषणा को व्यक्त करता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित, व्यापक और पारदर्शी हिन्दी अभिव्यक्ति है, जो परमेश्वर के शासन और उसके राज्य—दोनों अर्थ-आयामों को खुला रखती है।
- source_word: ἰᾶσθαι
  choice: चंगा करने
  rationale: यह शारीरिक आरोग्य प्रदान करने के सामान्य अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοὺς ἀσθενεῖς
  choice: बीमारों को
  rationale: ἀσθενής का व्यापक अर्थ ‘निर्बल’ हो सकता है, पर चंगा करने के इस संदर्भ में इसका आशय रोगियों से है; ‘बीमारों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ की अर्थ-व्याप्ति
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘राज्य’ पारंपरिक होने के साथ मूल पद की व्यापकता बनाए रखता है; ‘शासन’ उसके सक्रिय राजकीय अधिकार को उभारता है, पर अर्थ को कुछ संकरा कर सकता है। विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, सहज और गरिमापूर्ण रखा गया है। ‘प्रचार’ तथा ‘चंगा करना’ सामान्य हिन्दी बाइबलीय प्रयोग हैं, जबकि पद की मूल समानांतर रचना—घोषणा करना और चंगा करना—सुरक्षित है।
