reference: Luke 9:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: hi
  text: पर जब वह अभी पास आ रहा था, तभी दुष्टात्मा ने उसे भूमि पर पटक दिया और उसे ऐंठन में डाल दिया। लेकिन यीशु ने अशुद्ध आत्मा को डाँटा, लड़के को चंगा किया और उसे उसके पिता को वापस सौंप दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उसके पिता के पास लौटा दिया।”
    reason: ἀπέδωκεν में ‘वापस सौंपने’ और ‘लौटा देने’ के निकटवर्ती भाव हैं; वैकल्पिक रूप पुनर्स्थापन के पहलू को स्पष्ट करता है।
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: पर जब वह अभी पास आ ही रहा था
  rationale: वर्तमान कृदन्त वाले संबंधवाचक स्वतंत्र वाक्यांश से साथ-साथ चल रही क्रिया व्यक्त होती है। ‘अभी ... आ ही रहा था’ ἔτι के जारी रहने के भाव और निकट आने की गति, दोनों को स्वाभाविक हिन्दी में रखता है; δέ को हल्के कथात्मक संक्रमण ‘पर’ से व्यक्त किया गया है।
- source_word: ἔρρηξεν αὐτὸν
  choice: उसे भूमि पर पटक दिया
  rationale: यहाँ क्रिया हिंसक ढंग से नीचे गिराने का भाव देती है। ‘भूमि पर पटक दिया’ प्रसंग में स्पष्ट और स्वाभाविक है तथा अस्पष्ट शाब्दिक अनुवाद से बचता है।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: यह व्यक्तिगत अलौकिक दुष्ट सत्ता को सीधे व्यक्त करता है। आगे आए πνεῦμα ἀκάθαρτον से शब्दावली का भेद भी बना रहता है।
- source_word: συνεσπάραξεν
  choice: बुरी तरह ऐंठ दिया
  rationale: क्रिया तीव्र मरोड़ या ऐंठन उत्पन्न करने का भाव रखती है। यह हिन्दी अभिव्यक्ति क्रिया के कारणात्मक और हिंसक स्वरूप को सहज ढंग से बताती है।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: सुसमाचारों में यह अधिकारपूर्वक फटकारने की प्रचलित क्रिया है। ‘डाँटा’ सरल आधुनिक हिन्दी में उसी मौखिक अधिकार को व्यक्त करता है।
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: अशुद्ध आत्मा
  rationale: यह यूनानी पदबंध का सीधा और स्थापित हिन्दी रूप है तथा अशुद्धता के धार्मिक और नैतिक संकेत को सुरक्षित रखता है।
- source_word: ἰάσατο
  choice: चंगा किया
  rationale: चमत्कारिक आरोग्य के प्रसंग में ἰάομαι का अर्थ स्पष्ट रूप से स्वस्थ करना है। ‘चंगा किया’ सामान्य बाइबलीय हिन्दी में सहज और बोधगम्य है।
- source_word: τὸν παῖδα
  choice: लड़के
  rationale: παῖς के व्यापक अर्थों में बालक, लड़का या पुत्र हो सकते हैं। प्रसंग एक युवा पुरुष संतान का है; ‘लड़का’ आयु और लिंग को स्वाभाविक रूप से व्यक्त करता है, बिना यूनानी में अनुपस्थित स्पष्ट संबंधसूचक ‘पुत्र’ जोड़ने के।
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: उसे उसके पिता को वापस सौंप दिया
  rationale: ἀποδίδωμι यहाँ किसी को पुनः उसके अपने जन के सुपुर्द करने या लौटा देने का भाव रखता है। ‘वापस सौंप दिया’ पुनर्स्थापन और पिता के पास सुरक्षित सुपुर्द किए जाने, दोनों को व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्मिक पीड़ा की भाषा
  choice: δαιμόνιον और πνεῦμα ἀκάθαρτον को क्रमशः ‘दुष्टात्मा’ और ‘अशुद्ध आत्मा’ के रूप में व्यक्तिगत आत्मिक सत्ता की भाषा में अनूदित किया गया है।
  alternative: इन्हें केवल ‘बुरी शक्ति’, रोग या मानसिक अवस्था के रूप में अनूदित करना।
  rationale: यूनानी पाठ एक कर्ता के रूप में दुष्टात्मा को प्रस्तुत करता है, जिसे यीशु डाँटते हैं। साथ ही पाठ कहता है कि यीशु ने लड़के को चंगा किया; इसलिए आत्मिक मुक्ति और आरोग्य, दोनों आयाम बिना एक को दूसरे में घटाए सुरक्षित रखे गए हैं।
- issue: ἰάσατο में चंगाई और भूत-विमोचन का संबंध
  choice: ‘लड़के को चंगा किया’ रखा गया है।
  alternative: इसे केवल ‘दुष्टात्मा से छुड़ाया’ कहना।
  rationale: मूल पाठ स्पष्ट रूप से ἰάσατο का प्रयोग करता है। अनुवाद भूत-विमोचन को स्वीकारते हुए भी लेखक द्वारा चुनी गई चंगाई की भाषा को प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पास आ ही रहा था’, ‘भूमि पर पटक दिया’ और ‘वापस सौंप दिया’ सामान्य पाठक के लिए स्पष्ट हैं; ‘दुष्टात्मा’ तथा ‘अशुद्ध आत्मा’ मूल की अलग किन्तु सह-संदर्भित अभिव्यक्तियों को बनाए रखते हैं।
