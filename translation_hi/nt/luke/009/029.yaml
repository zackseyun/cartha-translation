id: LUK.9.29
reference: Luke 9:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: hi
  text: और जब वह प्रार्थना कर रहा था, तब उसके चेहरे का रूप बदल गया[a], और उसके वस्त्र सफेद होकर बिजली के समान चमकने लगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसके चेहरे का रूप दूसरा हो गया।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके वस्त्र सफेद और चकाचौंध करने वाले हो गए’; यूनानी शब्द बिजली जैसी कौंधती चमक का बिंब देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: जब वह प्रार्थना कर रहा था, तब
  rationale: लूका की इस कालसूचक रचना का स्वाभाविक हिन्दी रूप है; यह प्रार्थना के दौरान घटना घटने का भाव रखता है, बिना अनावश्यक रूप से ‘ऐसा हुआ’ जोड़ने के।
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον
  choice: उसके चेहरे का रूप बदल गया
  rationale: εἶδος दृश्य रूप को और ἕτερον उसके पहले से भिन्न हो जाने को व्यक्त करता है। हिन्दी में ‘रूप बदल गया’ स्वाभाविक है और समानांतर सुसमाचारों की अधिक विशिष्ट भाषा नहीं मिलाता।
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: उसके वस्त्र
  rationale: ἱματισμός के लिए ‘वस्त्र’ आधुनिक, गरिमापूर्ण और कथात्मक शैली के अनुकूल है।
- source_word: λευκὸς
  choice: सफेद
  rationale: यह रंग का सीधा अर्थ रखता है; चमक का भाव अगले कृदन्त से व्यक्त किया गया है।
- source_word: ἐξαστράπτων
  choice: बिजली के समान चमकने लगे
  rationale: यह शब्द बिजली जैसी कौंधती चमक का सजीव बिंब देता है; ‘चमकदार’ या ‘चकाचौंध करने वाले’ की अपेक्षा मूल बिंब अधिक स्पष्ट रहता है।
theological_decisions:
- issue: यीशु के रूपान्तरण का वर्णन
  choice: चेहरे के दृश्य रूप में परिवर्तन को ‘उसके चेहरे का रूप बदल गया’ कहना
  alternative: उसका चेहरा चमक उठा
  rationale: लूका का कथन दृश्य परिवर्तन बताता है, पर मत्ती के समान चेहरे के सूर्य की तरह चमकने की बात नहीं कहता। इसलिए समानांतर वृत्तान्त की भाषा मिलाए बिना लूका की संयत अभिव्यक्ति रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘वस्त्र’ साहित्यिक गरिमा रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
