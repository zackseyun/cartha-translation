base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: hi
  text: फिर वह सबसे कहता था, “यदि कोई[a] मेरे पीछे आना चाहता है, तो वह अपने आप का इन्कार करे, प्रतिदिन अपना क्रूस उठाए और मेरा अनुसरण करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ सामान्य एकवचन है—“यदि कोई ... वह ... अपना क्रूस।” यह किसी भी व्यक्ति पर लागू होने वाली व्यक्तिगत पुकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: फिर वह ... कहता था
  rationale: अपूर्ण भूतकाल ongoing या repeated speech का संकेत दे सकता है; ‘कहता था’ इस aspect को स्वाभाविक हिन्दी में बनाए रखता है। δὲ को प्रसंग आगे बढ़ाने वाले ‘फिर’ से व्यक्त किया गया है।
- source_word: πρὸς πάντας
  choice: सबसे
  rationale: यह यीशु के संबोधन की सामूहिक व्यापकता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Εἴ τις θέλει
  choice: यदि कोई ... चाहता है
  rationale: τις अनिश्चित और सामान्य एकवचन है; ‘कोई’ उसका स्वाभाविक हिन्दी रूप है। θέλει को बिना अतिरिक्त बल जोड़े ‘चाहता है’ कहा गया है।
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: मेरे पीछे आना
  rationale: यह शिष्यत्व का मुहावरा है, पर अनुवाद मूल चित्र को बनाए रखता है और इसे बाद के स्पष्ट ἀκολουθείτω के साथ मिला नहीं देता।
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: वह अपने आप को नकारे
  rationale: तीसरे पुरुष की आज्ञा को ‘वह ... नकारे’ से व्यक्त किया गया है। ‘नकारे’ स्वयं से संबंध-विच्छेद या स्वयं का दावा छोड़ने की कठोरता को बनाए रखता है, जबकि ‘त्याग करे’ अर्थ को पहले से व्याख्यायित कर सकता है।
- source_word: ἀράτω
  choice: उठाए
  rationale: क्रूस के संदर्भ में यह उसे उठा लेने की क्रिया को सीधे व्यक्त करता है; केवल ‘ढोए’ कहना क्रिया के आरंभिक भाव को बदल देता।
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: अपना क्रूस
  rationale: ‘क्रूस’ concrete source term को सुरक्षित रखता है। हिन्दी का reflexive possessive ‘अपना’ αὐτοῦ को subject के साथ स्पष्ट रूप से जोड़ता है।
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह लूका के विशिष्ट ‘हर दिन’ के बल को संक्षिप्त, प्रतिष्ठित और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀκολουθείτω μοι
  choice: मेरे पीछे चलता रहे
  rationale: वर्तमान आज्ञार्थक का निरंतर भाव ‘चलता रहे’ से उभरता है और ὀπίσω μου ἔρχεσθαι से जुड़ी मूल पुनरुक्ति भी बनी रहती है।
theological_decisions:
- issue: शिष्यत्व में ‘क्रूस’ का अर्थ
  choice: मूल concrete शब्द को ‘क्रूस’ ही रखा गया है।
  alternative: बोझ, दुःख या बलिदान
  rationale: σταυρός को किसी एक रूपकात्मक अर्थ में बदलना उसकी मृत्यु, लज्जा, दुःख और शिष्यत्व से जुड़ी अर्थ-व्याप्ति को अनावश्यक रूप से सीमित कर देता।
- issue: सामान्य एकवचन का प्रतिनिधित्व
  choice: ‘यदि कोई ... तो वह ... अपने ... अपना’
  alternative: बहुवचन ‘लोग ... वे ... अपने’
  rationale: यूनानी में अनिश्चित सामान्य एकवचन और उसके बाद एकवचन आज्ञाएँ तथा reflexive forms हैं। हिन्दी में ‘कोई ... वह’ किसी भी स्त्री या पुरुष पर लागू होने वाला स्वाभाविक सामान्य एकवचन है और मूल की व्यक्तिगत पुकार को बनाए रखता है।
- issue: ἀκολουθείτω की आज्ञा का aspect
  choice: ‘चलता रहे’ द्वारा निरंतर अनुसरण
  alternative: ‘मेरे पीछे चले’
  rationale: वर्तमान आज्ञार्थक निरंतर या जारी रहने वाली क्रिया का संकेत दे सकता है; ‘चलता रहे’ उस संभावना को सुरक्षित रखता है, जबकि इसे किसी विशिष्ट doctrinal formula में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘क्रूस’ प्रचलित बाइबलीय शब्द के रूप में रखा गया है। ‘मेरे पीछे आना’ और ‘मेरे पीछे चलता रहे’ की निकट पुनरुक्ति जानबूझकर सुरक्षित है, क्योंकि मूल यूनानी दो संबंधित लेकिन अलग क्रियाएँ प्रयोग करता है।
