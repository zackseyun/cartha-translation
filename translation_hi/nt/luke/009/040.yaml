source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: hi
  text: और मैंने आपके चेलों से विनती की कि वे उसे बाहर निकाल दें[a], पर वे ऐसा नहीं कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ का संकेत दुष्ट आत्मा की ओर हो सकता है, या लड़के की ओर।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: मैंने…विनती की
  rationale: यह क्रिया साधारण अनुरोध नहीं, बल्कि संकट में किया गया आग्रह व्यक्त करती है। ‘विनती की’ पिता की व्याकुलता को स्वाभाविक और गरिमापूर्ण हिन्दी में प्रकट करता है।
- source_word: τῶν μαθητῶν σου
  choice: आपके चेलों से
  rationale: सुसमाचारों के गुरु–शिष्य संबंध के लिए ‘चेला’ प्रचलित, सहज और सटीक हिन्दी शब्द है; ‘आपके’ संबोधन को आदरपूर्ण रखता है।
- source_word: ἵνα ἐκβάλωσιν
  choice: कि वे…बाहर निकाल दें
  rationale: ἵνα के उद्देश्य/अनुरोध के भाव और ἐκβάλλω के निष्कासन-अर्थ, विशेषकर दुष्टात्मा निकालने के प्रसंग, दोनों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτό
  choice: उसे
  rationale: हिन्दी का ‘उसे’ संदर्भ को अनावश्यक रूप से निश्चित किए बिना आत्मा अथवा लड़के—दोनों संभावित संकेतों को बनाए रखता है।
- source_word: οὐκ ἠδυνήθησαν
  choice: वे ऐसा नहीं कर सके
  rationale: यह उनकी असमर्थता को साफ और सहज आधुनिक हिन्दी में व्यक्त करता है; ‘ऐसा’ पहले बताए गए बाहर निकालने के काम की ओर संकेत करता है।
theological_decisions:
- issue: झाड़-फूँक के प्रसंग में αὐτό का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखकर संदर्भ की वास्तविक अस्पष्टता बनाए रखी गई है।
  alternative: इसे दुष्ट आत्मा का स्पष्ट संकेत मानकर ‘उस आत्मा को’, अथवा लड़के का संकेत मानकर ‘उस लड़के को’ कहा जा सकता है।
  rationale: नपुंसकलिंग αὐτό निकटवर्ती प्रसंग में πνεῦμα (‘आत्मा’) से स्वाभाविक रूप से जुड़ सकता है, और ἐκβάλλω सामान्यतः दुष्ट आत्मा को निकालने के लिए आता है; फिर भी लड़का भी संभावित संदर्भ है। हिन्दी ‘उसे’ किसी एक व्याख्या को थोपे बिना दोनों संभावनाएँ सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, आदरपूर्ण और गरिमापूर्ण शैली। ‘चेलों’ सुसमाचारों की परिचित शब्दावली है, जबकि ‘विनती की’ पिता की तात्कालिक व्याकुलता व्यक्त करता है।
