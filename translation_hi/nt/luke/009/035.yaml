  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: hi
  text: 'और बादल में से एक आवाज़ आई: “यह मेरा पुत्र है, जिसे चुना गया है; इसकी सुनो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: एक आवाज़ आई
  rationale: यूनानी मुहावरा किसी आवाज़ के सुनाई देने की घटना बताता है। आधुनिक हिन्दी में ‘एक आवाज़ आई’ स्वाभाविक और घटनात्मक है।
- source_word: ἐκ τῆς νεφέλης
  choice: बादल में से
  rationale: ἐκ स्रोत को दर्शाता है। ‘बादल में से’ स्पष्ट करता है कि आवाज़ का स्रोत बादल था।
- source_word: λέγουσα
  choice: उद्धरण से प्रत्यक्ष कथन
  rationale: 'हिन्दी में ‘आवाज़ आई: …’ के बाद प्रत्यक्ष कथन रखना ‘कहती हुई’ जैसे अस्वाभाविक कृदन्त से अधिक सहज है और कथन का पूरा बल बनाए रखता है।'
- source_word: Οὗτός ἐστιν ὁ υἱός μου
  choice: यह मेरा पुत्र … है
  rationale: यह पहचान कराने वाली सीधी घोषणा है। ‘पुत्र’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है।
- source_word: ὁ ἐκλελεγμένος
  choice: चुना हुआ जन
  rationale: यह ἐκλέγομαι का पूर्णकालिक कर्मवाच्य कृदन्त है और चुने गए व्यक्ति को सूचित करता है। ‘प्रिय’ पाठांतर है, इसलिए उसे मुख्य पाठ में नहीं मिलाया गया। ‘जन’ जोड़ने से हिन्दी में संज्ञात्मक पद स्वाभाविक बनता है, जबकि यूनानी का विशिष्ट उपाधिसदृश बल बना रहता है।
- source_word: αὐτοῦ ἀκούετε
  choice: इसकी सुनो
  rationale: यहाँ ἀκούω केवल ध्वनि सुनने के बजाय ध्यान देने और मानने का आदेश देता है। ‘इसकी सुनो’ संक्षिप्त, स्वाभाविक और आदेशात्मक है।
theological_decisions:
- issue: स्वर्गीय आवाज़ में मसीह के लिए प्रयुक्त पाठांतर
  choice: ἐκλελεγμένος के अनुसार ‘चुना हुआ जन’
  alternative: ἀγαπητός के अनुसार ‘प्रिय पुत्र’
  rationale: मुख्य पाठ SBLGNT के दिए हुए पाठ का अनुसरण करता है और लूका की विशिष्ट अभिव्यक्ति को समानान्तर सुसमाचारों के अधिक परिचित ‘प्रिय’ पाठ से नहीं मिलाता। पुत्रत्व और चुने जाने—दोनों कथनों को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘चुना हुआ जन’ स्रोत के कर्मवाच्य कृदन्त और उपाधिसदृश प्रयोग को सुरक्षित रखता है; पाठांतर केवल पादटिप्पणी में दिया गया है।
