  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: hi
  text: और यीशु ने उससे कहा, “लोमड़ियों की माँदें होती हैं और आकाश के पक्षियों के घोंसले होते हैं, पर मनुष्य के पुत्र[a] के पास सिर टिकाने की जगह नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य का पुत्र’ यीशु द्वारा अपने लिए प्रयुक्त एक विशेष पदवी है; इसमें दानिय्येल 7:13–14 की प्रतिध्वनि हो सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: लोमड़ियाँ
  rationale: यह पशु का सीधा और स्वाभाविक हिन्दी नाम है; यहाँ सामान्यीकरण की आवश्यकता नहीं है।
- source_word: φωλεούς
  choice: माँद
  rationale: लोमड़ियों के रहने के स्थान के लिए ‘माँद’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: यूनानी पदबंध का निकट और सहज अनुवाद; ‘स्वर्ग के पक्षी’ इस संदर्भ में अनावश्यक धार्मिक अर्थ जगा सकता है।
- source_word: κατασκηνώσεις
  choice: घोंसले
  rationale: शब्द मूलतः बसने या ठहरने के स्थानों को बताता है; पक्षियों के संदर्भ में ‘घोंसले’ सर्वाधिक स्वाभाविक है।
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट आत्म-पदवी को पारंपरिक, पहचाने जाने योग्य रूप में रखा गया है और उसका संभावित दानिय्येली संकेत सुरक्षित रहता है।
- source_word: οὐκ ἔχει ποῦ
  choice: के पास ... जगह नहीं है
  rationale: नकार सहित ποῦ का भाव ‘कहीं जगह न होना’ है; हिन्दी में यह स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: सिर टिकाने
  rationale: ठहरने या विश्राम की जगह के अभाव की ठोस छवि को सहज हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: पशु-पक्षियों के आश्रय और मनुष्य के पुत्र की आश्रयहीनता के बीच स्पष्ट विरोध दर्शाता है।
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी कथन-सूत्र का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: यीशु की आत्म-पदवी υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: स्थापित पदवी को बनाए रखने से कथन की आत्म-संदर्भी प्रकृति और दानिय्येल 7:13–14 की संभावित प्रतिध्वनि दोनों सुरक्षित रहती हैं; मुख्य पाठ में किसी एक व्याख्या को थोपा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘माँद’, ‘घोंसले’ और ‘सिर टिकाने’ जैसे सामान्य शब्द मूल की ठोस छवियों को बनाए रखते हैं। ‘तक’ अभाव की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कथन का अर्थ बदलने के।
