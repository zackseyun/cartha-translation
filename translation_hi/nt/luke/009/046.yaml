  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: hi
  text: तब उनके बीच यह विवाद[a] उठ खड़ा हुआ कि उनमें से कौन सबसे बड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बीच यह चर्चा उठी”; अथवा, “उनके मन में यह विचार उठा।”
    reason: διαλογισμός ‘विवाद,’ ‘चर्चा,’ या ‘विचार’ का अर्थ दे सकता है; ἐν αὐτοῖς का अर्थ ‘उनके बीच’ अथवा ‘उनके भीतर/मन में’ समझा जा सकता है।
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: उठ खड़ा हुआ
  rationale: मूल अर्थ ‘प्रवेश किया’ है, पर διαλογισμός के साथ यह किसी विचार, चर्चा या विवाद के उत्पन्न होने का मुहावरा है; ‘उठ खड़ा हुआ’ आधुनिक हिन्दी में घटना के आरम्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है, जो प्रसंग की अगली घटना की ओर बढ़ाता है।
- source_word: διαλογισμὸς
  choice: विवाद
  rationale: यह शब्द मन के विचार-विमर्श, तर्क या आपसी बहस को व्यक्त कर सकता है। महानता की होड़ वाले प्रसंग में ‘विवाद’ उसका संभावित आपसी और प्रतिस्पर्धी स्वर स्पष्ट करता है, जबकि पाद-टिप्पणी अन्य वास्तविक अर्थ-संभावनाएँ सुरक्षित रखती है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: शाब्दिक रूप ‘उनमें’ है; बहुवचन व्यक्तियों के समूह में घट रही बात के लिए ‘उनके बीच’ स्वाभाविक हिन्दी है।
- source_word: τὸ τίς ἂν εἴη
  choice: इस बात को लेकर ... कौन ... हो सकता है
  rationale: यह रचना विचार या विवाद की विषय-वस्तु बताती है। ‘हो सकता है’ ἄν के साथ optative की संभाव्यता को बनाए रखता है।
- source_word: μείζων
  choice: सबसे बड़ा
  rationale: यूनानी में रूप तुलनात्मक ‘बड़ा’ है, पर पूरे समूह में पद या महत्त्व की तुलना होने के कारण हिन्दी में ‘सबसे बड़ा’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτῶν
  choice: उनमें से
  rationale: यह उस सीमित समूह को दिखाता है जिसके सदस्यों के बीच तुलना की जा रही है।
theological_decisions:
- issue: चेलों की परस्पर क्रिया का स्वरूप
  choice: विवाद
  alternative: मन में विचार या आपसी चर्चा
  rationale: महानता के प्रश्न का प्रतिस्पर्धी स्वर ‘विवाद’ का समर्थन करता है, पर यूनानी संज्ञा आन्तरिक विचार या चर्चा भी सूचित कर सकती है; इसलिए विकल्प को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सबसे बड़ा’ यहाँ आकार नहीं, बल्कि समूह में पद, महत्त्व या प्रतिष्ठा में श्रेष्ठ होने को व्यक्त करता है।
