reference: Luke 9:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: hi
  text: पर वे इस बात[a] को नहीं समझते थे, और यह उनसे छिपी हुई थी ताकि वे इसका बोध न कर सकें;[b] और वे उस बात के विषय में उससे पूछने से डरते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वचन,’ ‘कथन’ अथवा ‘विषय’; यूनानी ῥῆμα के लिए।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ कहता है, ‘यह उनसे छिपी हुई थी,’ पर यह नहीं बताता कि इसे किसने छिपाया।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: नहीं समझे
  rationale: सन्दर्भ में यह यीशु के कथन का अर्थ न समझ पाने को व्यक्त करता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ῥῆμα
  choice: बात
  rationale: यहाँ शब्द यीशु के अभी कहे हुए कथन को सूचित करता है। ‘बात’ स्वाभाविक हिन्दी है और कथन अथवा विषय—दोनों की सम्भावना को खुला रखती है।
- source_word: παρακεκαλυμμένον
  choice: छिपी हुई थी
  rationale: ἦν के साथ पूर्ण निष्क्रिय कृदन्त छिपी हुई अवस्था व्यक्त करता है। हिन्दी में निष्क्रिय रूप बनाए रखने से छिपाने वाला अनिर्दिष्ट रहता है।
- source_word: ἀπ’ αὐτῶν
  choice: उनसे
  rationale: ἀπό का स्वाभाविक अर्थ ‘से’ है; इससे स्पष्ट होता है कि वह बात उनकी समझ से छिपी थी।
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: ताकि वे इसे जान न सकें
  rationale: αἰσθάνομαι यहाँ बोध होने अथवा जान पाने का भाव देता है। ‘जान न सकें’ पहले प्रयुक्त ‘नहीं समझे’ की अनावश्यक पुनरावृत्ति से बचते हुए प्रयोजन/परिणाम की रचना को सुरक्षित रखता है।
- source_word: ἐφοβοῦντο
  choice: डरते थे
  rationale: अपूर्ण काल उनकी बनी हुई मनःस्थिति को दर्शाता है; ‘डरते थे’ सहज आधुनिक हिन्दी है।
- source_word: ἐρωτῆσαι
  choice: पूछने
  rationale: यह यीशु से स्पष्टीकरण माँगने को सूचित करता है; ‘पूछना’ इसका सर्वाधिक स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: बात को छिपाए जाने का कर्ता
  choice: निष्क्रिय वाक्य ‘यह उनसे छिपी हुई थी’ रखा गया है और कर्ता नहीं बताया गया।
  alternative: परमेश्वर ने इसे उनसे छिपाया था; अथवा यह उनके लिए अपने-आप अस्पष्ट बनी रही।
  rationale: यूनानी निष्क्रिय रचना छिपाने वाले का नाम नहीं बताती। कर्ता जोड़ने से पद की वास्तविक धर्मवैचारिक अस्पष्टता समाप्त हो जाती।
- issue: ἵνα उपवाक्य में प्रयोजन अथवा परिणाम
  choice: ‘ताकि’ के द्वारा यूनानी रचना का लक्ष्य/परिणाम-सदृश तनाव बनाए रखा गया है।
  alternative: ‘इसलिए वे इसे जान नहीं सके’ कहकर केवल परिणाम व्यक्त करना।
  rationale: ἵνα μή को केवल परिणाम में बदल देना मूल की सम्भावित प्रयोजन-छाया को मिटा देता; इसलिए हिन्दी में उसे खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ कथात्मक विरोध को स्पष्ट करता है; ‘बात’ बोलचाल की सहजता और शास्त्रीय गरिमा के बीच संतुलन रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
