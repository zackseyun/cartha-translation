  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: hi
  text: और जब वह वाणी सुनाई दी, तो यीशु अकेले पाए गए।[a] और वे चुप रहे और उन दिनों जो कुछ उन्होंने देखा था, उसके बारे में किसी को कुछ नहीं बताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल यीशु ही रह गए,” अथवा “केवल यीशु दिखाई दिए।” यूनानी में शाब्दिक रूप से है, “यीशु अकेले पाए गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: जब वह वाणी सुनाई दे चुकी
  rationale: ἐν के साथ articular infinitive समय बताता है। प्रसंग में φωνή एक स्वर्गीय कथन है; हिंदी में ‘वाणी सुनाई देना’ स्वाभाविक है और पूर्ण हो चुकी घटना के बाद का परिणाम स्पष्ट करता है।
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: यीशु अकेले पाए गए
  rationale: यह εὑρίσκω के aorist passive और μόνος, दोनों को निकटता से सुरक्षित रखता है तथा यह व्याख्या नहीं जोड़ता कि शिष्यों ने केवल यीशु को देखा या केवल यीशु ही रह गए।
- source_word: ἐσίγησαν
  choice: वे चुप रहे
  rationale: σιγάω का सीधा और स्वाभाविक हिंदी अर्थ है; यह उनकी निरंतर गोपनीयता को अगले वाक्य से जोड़ता है।
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: किसी को कुछ नहीं बताया
  rationale: ἀπαγγέλλω यहाँ किसी घटना की सूचना देने या बताने के अर्थ में है। यह आधुनिक हिंदी में स्वाभाविक रूप से दोहरे निषेध द्वारा यूनानी नकारात्मक बल व्यक्त करता है।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: मूल के कालसूचक वाक्यांश का संक्षिप्त और प्रचलित हिंदी रूप।
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: जो कुछ उन्होंने देखा था, उसके बारे में ... कुछ नहीं
  rationale: यह relative clause और οὐδέν के व्यापक निषेध को स्पष्ट, स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: स्वर्गीय वाणी के बाद यीशु की एकाकी उपस्थिति का कथात्मक निहितार्थ
  choice: ‘यीशु अकेले पाए गए’ के रूप में वर्णनात्मक अनुवाद
  alternative: ‘केवल यीशु ही रह गए’ या ‘उन्हें केवल यीशु दिखाई दिए’
  rationale: मूल पाठ परिणाम बताता है, लेकिन यह स्पष्ट नहीं करता कि बल यीशु के रह जाने पर है या शिष्यों द्वारा केवल उन्हें देखे जाने पर। मुख्य पाठ यूनानी रूप को सुरक्षित रखता है और पादटिप्पणी स्वाभाविक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘वाणी’ स्वर्गीय कथन के प्रसंग के अनुकूल है, जबकि मुख्य पाठ में यूनानी निष्क्रिय रचना की असामान्य किंतु अर्थपूर्ण संयमितता रखी गई है।
