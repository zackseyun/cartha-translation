  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: hi
  text: पतरस और उसके साथी नींद से बोझिल थे; लेकिन जब वे पूरी तरह जाग गए[a], तो उन्होंने उसकी महिमा और उन दो पुरुषों को देखा, जो उसके साथ खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जागने के बाद” अथवा “जब वे पूरी तरह सचेत हो गए।” यूनानी क्रिया दुर्लभ है और सम्भवतः पूरे समय जागते रहने के बजाय पूरी तरह जाग जाने या सचेत होने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: नींद से बोझिल थे
  rationale: यह पदबंध नींद के भारी दबाव में होने की अवस्था बताता है; यह केवल ‘उनींदे थे’ से अधिक प्रबल है और यूनानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διαγρηγορήσαντες
  choice: जब वे पूरी तरह जाग गए
  rationale: दुर्लभ यूनानी क्रिया यहाँ नींद के बोझ के विपरीत पूर्ण रूप से सचेत हो जाने को सूचित करती है। सन्दर्भ में यह अर्थ ‘जागते रहे’ की अपेक्षा अधिक स्वाभाविक है, पर lexical ambiguity को पादटिप्पणी में रखा गया है।
- source_word: δόξαν
  choice: महिमा
  rationale: ‘महिमा’ δόξα का स्थापित बाइबलीय प्रतिशब्द है और रूपान्तरण के प्रसंग में दिखाई देने वाले तेज तथा व्यापक धर्मवैज्ञानिक अनुनाद—दोनों को बनाए रखता है।
- source_word: τοὺς δύο ἄνδρας
  choice: उन दो पुरुषों को
  rationale: ἀνήρ यहाँ दो वयस्क पुरुषों, प्रसंगानुसार मूसा और एलिय्याह, को दर्शाता है। ‘उन दो पुरुषों’ से निश्चितता और पहचानसूचक यूनानी पदबंध सुरक्षित रहता है।
- source_word: συνεστῶτας αὐτῷ
  choice: जो उसके साथ खड़े थे
  rationale: यह कृदन्त उनके यीशु के साथ उपस्थित और खड़े होने का दृश्य प्रस्तुत करता है; हिन्दी सम्बन्धवाचक उपवाक्य इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ … δὲ
  choice: …; लेकिन
  rationale: पहला δέ हल्के कथानक-विकास का संकेत देता है और हिन्दी में बिना किसी अलग आरम्भिक अव्यय के स्वाभाविक है; दूसरा δέ नींद से बोझिल होने और फिर देखने के बीच विरोध को ‘लेकिन’ से व्यक्त करता है।
theological_decisions:
- issue: रूपान्तरण के प्रसंग में δόξα का अनुवाद
  choice: उसकी महिमा
  alternative: उसका तेज / उसका प्रताप
  rationale: ‘महिमा’ दृश्य प्रगटीकरण और बाइबलीय धर्मवैज्ञानिक निरन्तरता दोनों को सुरक्षित रखती है, बिना पद में उसकी प्रकृति की अतिरिक्त व्याख्या जोड़े।
- issue: διαγρηγορήσαντες का अर्थ
  choice: जब वे पूरी तरह जाग गए
  alternative: जागते रहने पर
  rationale: चुना हुआ पाठ यह दावा नहीं करता कि पतरस और उसके साथी पूरे समय जागते रहे। यह ‘नींद से बोझिल’ होने के साथ कथात्मक तनाव बनाए रखता है, जबकि वैकल्पिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘नींद से बोझिल’ मूल रूपक को स्पष्ट रखता है; ‘उसके साथी’ स्वाभाविक हिन्दी में οἱ σὺν αὐτῷ को व्यक्त करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बद्ध क्रिया के तुरन्त बाद रखा गया है।
