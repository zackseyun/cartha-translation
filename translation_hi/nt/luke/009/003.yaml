  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: hi
  text: और उसने उनसे कहा, “यात्रा के लिए कुछ भी मत लेना—न लाठी, न थैला[a], न रोटी, न पैसे[b]; और न दो-दो कुरते[c] रखना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यात्रा में सामान या भोजन रखने का थैला।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘चाँदी’; यहाँ उससे आशय पैसे से है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी अभिव्यक्ति का अर्थ है कि हर एक व्यक्ति दो कुरते न रखे।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: यात्रा के लिए कुछ भी मत लेना
  rationale: यह यात्रा की तैयारी के संदर्भ में निषेधात्मक आदेश है। यह रूप यूनानी वाक्यांश का आशय स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ῥάβδον
  choice: लाठी
  rationale: यात्रा के संदर्भ में यह चलने के सहारे की लाठी को सूचित करता है; ‘लाठी’ संक्षिप्त और सर्वसुलभ हिन्दी है।
- source_word: πήραν
  choice: थैला
  rationale: यह यात्रा में सामान या भोजन रखने के थैले को दर्शाता है। मुख्य पाठ में सामान्य और स्वाभाविक शब्द रखा गया है तथा विशेष अर्थ footnote में स्पष्ट किया गया है।
- source_word: ἄρτον
  choice: रोटी
  rationale: मूल शब्द का सामान्य अर्थ रोटी है; इसे व्यापक अर्थ ‘भोजन’ में बदलने की आवश्यकता नहीं है।
- source_word: ἀργύριον
  choice: पैसे
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर इस प्रसंग में चाँदी मुद्रा या धन के रूप में प्रयुक्त है। ‘पैसे’ आधुनिक हिन्दी में व्यावहारिक आशय स्पष्ट करता है।
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: दो-दो कुरते रखना
  rationale: ἀνά के साथ संख्या का प्रयोग वितरण का भाव देता है—हर व्यक्ति के पास दो। हिन्दी का ‘दो-दो’ इस अर्थ को सहजता से सुरक्षित रखता है।
- source_word: χιτῶνας
  choice: कुरते
  rationale: χιτών शरीर पर पहना जाने वाला मूल वस्त्र था। ‘कुरते’ ऐतिहासिक वस्त्र का निकट, समझने योग्य हिन्दी रूप है और सामान्य ‘कपड़ों’ की अपेक्षा अधिक विशिष्ट है।
