source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: hi
  text: पर यीशु ने उससे कहा, “उसे मत रोको[a], क्योंकि जो तुम्हारे विरोध में नहीं है, वह तुम्हारे पक्ष में है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे बाधा मत दो’ अथवा ‘उसे मना मत करो।’
    reason: κωλύω के अर्थ-क्षेत्र में रोकना, बाधा देना और मना करना शामिल हैं।
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: पर यीशु ने उससे कहा
  rationale: δέ पिछले पद में यूहन्ना द्वारा उठाई गई आपत्ति के उत्तर में हल्का विरोध सूचित करता है, इसलिए ‘पर’ स्वाभाविक है। ‘उससे’ मूल के सर्वनाम αὐτόν को बनाए रखता है और अनावश्यक रूप से ‘यूहन्ना’ नाम नहीं जोड़ता।
- source_word: Μὴ κωλύετε
  choice: उसे मत रोको
  rationale: κωλύω यहाँ किसी को कार्य करने से रोकने, बाधा देने या मना करने का भाव रखता है। प्रसंग में शिष्यों ने उस व्यक्ति को रोकने का प्रयास किया था; ‘मत रोको’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ὃς γὰρ
  choice: क्योंकि जो
  rationale: γάρ कथन का कारण प्रस्तुत करता है और ὃς तत्काल प्रसंग से आगे लागू होने वाला सामान्य सिद्धांत व्यक्त कर सकता है। ‘क्योंकि जो’ उस व्यापकता को बनाए रखता है।
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: तुम्हारे विरोध में नहीं है
  rationale: κατά के साथ सम्बन्धकारक यहाँ विरोध या प्रतिकूलता व्यक्त करता है। ‘विरोध में’ आधुनिक हिन्दी में स्पष्ट है और बहुवचन ὑμῶν को संदर्भानुसार ‘तुम्हारे’ में सुरक्षित रखता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे पक्ष में है
  rationale: ὑπέρ यहाँ समर्थन या अनुकूल पक्ष में होने का अर्थ देता है। ‘पक्ष में’ पहले खंड के ‘विरोध में’ के साथ मूल की संतुलित प्रतिकूलता बनाए रखता है।
theological_decisions:
- issue: यीशु के कथन का दायरा
  choice: ‘जो ...’ के द्वारा इसे सामान्य सिद्धांत के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल उसी अज्ञात व्यक्ति तक सीमित करते हुए ‘वह व्यक्ति जो तुम्हारे विरोध में नहीं है’ कहना।
  rationale: सापेक्ष सर्वनाम तत्काल व्यक्ति की ओर संकेत कर सकता है, पर साथ ही एक व्यापक सूक्ति भी व्यक्त करता है। हिन्दी का ‘जो’ दोनों संभावनाओं को खुला रखता है और कथन में अतिरिक्त धर्मसैद्धांतिक सीमा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मत रोको’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल क्रिया के निकटवर्ती अर्थ-विकल्प सुरक्षित रखती है।
