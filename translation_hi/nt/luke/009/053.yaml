  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: hi
  text: पर उन्होंने उसका स्वागत नहीं किया[a], क्योंकि उसका रुख यरूशलेम की ओर था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उसे ग्रहण नहीं किया” अथवा “उन्होंने उसे स्वीकार नहीं किया।” यहाँ संभवतः आतिथ्य या ठहरने की जगह देने से इनकार का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका मुख यरूशलेम की ओर जा रहा था।” यह अभिव्यक्ति यरूशलेम की ओर उसकी दिशा या दृढ़ अभिमुखता का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: स्वागत नहीं किया
  rationale: δέχομαι का अर्थ ग्रहण करना, स्वीकार करना या स्वागत करना हो सकता है। यात्रा और आतिथ्य के इस प्रसंग में ‘स्वागत नहीं किया’ स्वाभाविक रूप से उनके द्वारा यीशु को ठहरने या ग्रहण करने से इनकार को व्यक्त करता है।
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: उसका मुख
  rationale: πρόσωπον का मूल अर्थ ‘मुख’ है। इसे बनाए रखने से यूनानी पाठ की सामी शैली की सजीव अभिव्यक्ति सुरक्षित रहती है।
- source_word: ἦν πορευόμενον
  choice: जा रहा था
  rationale: यह परिधीय क्रिया-रचना वास्तविक गमन या यात्रा को व्यक्त करती है। ‘जा रहा था’ निकटवर्ती प्रसंग से ‘दृढ़ निश्चय’ को अनावश्यक रूप से इस पद में आयात किए बिना यूनानी सहभागी रूप को सीधे दर्शाता है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम की ओर
  rationale: εἰς दिशा या गंतव्य बताता है। ‘मुख ... जा रहा था’ के साथ ‘की ओर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दिशात्मक अर्थ को सुरक्षित रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: ὅτι यहाँ उनके इनकार का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘उसका मुख यरूशलेम की ओर जा रहा था’ की मुहावरेदार शक्ति
  choice: मुख्य पाठ में यूनानी की सजीव और कुछ असामान्य अभिव्यक्ति को बनाए रखा गया है, और पादटिप्पणी में उसके दिशात्मक तथा संभावित संकल्प-सूचक भाव को स्पष्ट किया गया है।
  alternative: ‘वह यरूशलेम जाने के लिए दृढ़-संकल्प था’ या केवल ‘वह यरूशलेम जा रहा था।’
  rationale: पहला विकल्प पाठ में ‘दृढ़-संकल्प’ को अपेक्षा से अधिक स्पष्ट कर देता है, जबकि दूसरा ‘मुख’ की सजीव सामी अभिव्यक्ति को मिटा देता है। चुना हुआ रूप वास्तविक यात्रा और दृढ़ अभिमुखता के बीच की अर्थगत व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘मुख’ को ‘चेहरा’ पर वरीयता दी गई है, क्योंकि यह बाइबलीय कथन में स्वाभाविक है और मूल की मुहावरेदार छवि को अधिक अच्छी तरह बनाए रखता है। सर्वनाम ‘उसका’ मूल के पुल्लिंग एकवचन को सीधे दर्शाता है; संदर्भ में संकेत यीशु की ओर है।
