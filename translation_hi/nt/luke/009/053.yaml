  rationale: मुख्य पाठ में “रुख” को यूनानी ‘मुख’ वाली दिशासूचक मुहावरेदार अभिव्यक्ति के स्वाभाविक हिन्दी समकक्ष के रूप में रखा गया है। इससे मूल का अर्थ—यरूशलेम की ओर उसका अभिमुख होना, जो उनके स्वागत न करने का कारण था—बना रहता है, जबकि अस्वाभाविक शाब्दिक हिन्दी से बचा जाता है। पादटिप्पणी मूल की अधिक शाब्दिक छवि सुरक्षित रखती है।
