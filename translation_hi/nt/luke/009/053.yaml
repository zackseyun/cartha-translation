review_pass:
  verdict: revise
  source_fidelity: 'The causal relation and the contextual sense of ἐδέξαντο are conveyed accurately. However, “उसका मुख ... जा रहा था” is not idiomatic Hindi: a मुख does not itself ‘go.’ “रुख” is a natural Hindi idiomatic counterpart for πρόσωπον in this directional construction and preserves the expressed orientation without adding a stronger claim of resolve.'
  naturalness: “उन्होंने उसका स्वागत नहीं किया” is clear and suitably natural in this hospitality context. Replacing the awkward literalism “उसका मुख यरूशलेम की ओर जा रहा था” with “उसका रुख यरूशलेम की ओर था” produces fluent modern standard Hindi while retaining the source expression’s directional force.
  terminology: “स्वागत” appropriately expresses refusal of reception/hospitality here. “यरूशलेम” is a standard Hindi biblical form. The footnote preserves the literal ‘face’ wording and appropriately identifies the idiomatic directional/possibly resolute nuance without imposing an interpretation.
  issues:
  - severity: medium
    issue: The expression “उसका मुख यरूशलेम की ओर जा रहा था” is structurally understandable but unnatural and semantically strained in modern Hindi.
    rationale: It follows the Greek image too mechanically. Hindi normally uses “रुख ... की ओर था” for a person’s direction or orientation; this is a close idiomatic equivalent rather than an interpretive expansion.
