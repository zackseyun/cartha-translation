id: LUK.9.5
reference: Luke 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: hi
  text: और जो लोग तुम्हें ग्रहण न करें[a], उस नगर[b] से निकलते समय अपने पैरों की धूल झाड़ दो, ताकि वह उनके विरुद्ध गवाही हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारा स्वागत न करें।’ यहाँ प्रयुक्त क्रिया में संदेशवाहकों को स्वीकार करने और उनका स्वागत करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस शहर।’ यूनानी शब्द πόλις संदर्भ के अनुसार नगर या शहर को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται
  choice: जो लोग ... ग्रहण न करें
  rationale: ὅσοι के साथ ἄν अनिश्चित और सामान्य अर्थ देता है—संख्या चाहे जितनी हो, ऐसे सभी लोग। δέχομαι में संदेशवाहकों को स्वीकार करने और उनका स्वागत करने, दोनों का भाव हो सकता है; ‘ग्रहण करना’ इस व्यापकता को बनाए रखता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह चेलों अथवा भेजे गए संदेशवाहकों के लिए प्रयुक्त द्वितीय पुरुष बहुवचन कर्म है। संदर्भ में ‘तुम्हें’ स्वाभाविक और स्पष्ट है।
- source_word: ἐξερχόμενοι
  choice: निकलते समय
  rationale: यह कृदंत मुख्य आज्ञा के साथ-साथ होने वाली क्रिया बताता है। ‘निकलते समय’ उसके कालगत संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: उस नगर से
  rationale: πόλις संदर्भ के अनुसार छोटे या बड़े शहरी निवास को सूचित कर सकता है। हिन्दी में ‘नगर’ आकार को अनावश्यक रूप से निश्चित किए बिना अर्थ को सँभालता है; ‘उस’ ἐκείνης को व्यक्त करता है।
- source_word: τὸν κονιορτὸν
  choice: धूल
  rationale: κονιορτός भूमि की ढीली धूल को सूचित करता है। प्रतीकात्मक क्रिया के इस प्रसंग में ‘धूल’ सटीक और स्वाभाविक है।
- source_word: ἀπὸ τῶν ποδῶν ὑμῶν
  choice: अपने पैरों की
  rationale: यह बताता है कि धूल उनके पैरों पर लगी है और वहीं से हटाई जानी है। ‘अपने पैरों की धूल’ हिन्दी में स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: ἀποτινάσσετε
  choice: झाड़ दो
  rationale: आज्ञार्थक क्रिया धूल को झटककर हटा देने की प्रतीकात्मक कार्रवाई बताती है। ‘झाड़ दो’ आधुनिक हिन्दी में स्पष्ट और सजीव है।
- source_word: εἰς μαρτύριον
  choice: ताकि वह ... गवाही हो
  rationale: वाक्यांश इस क्रिया का उद्देश्य अथवा परिणाम व्यक्त करता है। ‘ताकि वह ... गवाही हो’ गवाही के प्रमाणात्मक भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐπ’ αὐτούς
  choice: उनके विरुद्ध
  rationale: इस संदर्भ में μαρτύριον के साथ ἐπί का भाव प्रतिकूल गवाही का है। ‘उनके विरुद्ध’ अस्वीकार करने वालों के संबंध में इस संकेत की चेतावनी और न्यायिक गंभीरता को व्यक्त करता है।
theological_decisions:
- issue: पैरों की धूल झाड़ने की प्रतीकात्मक क्रिया का अभिप्राय
  choice: इसे संदेशवाहकों को अस्वीकार करने वालों के विरुद्ध गवाही के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल उनके लिए एक तटस्थ संकेत, अथवा अंतिम दण्ड की स्पष्ट घोषणा मानना।
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς एक तटस्थ संकेत से अधिक गंभीर है, पर पद स्वयं अंतिम दण्ड का पूरा स्वरूप नहीं बताता। इसलिए अनुवाद चेतावनी और न्यायिक गवाही का भाव रखता है, पर उससे आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक रूप अपनाया गया है। ‘ग्रहण’ व्यापक स्वीकार के भाव को रखता है, जबकि पादटिप्पणी अधिक आतिथ्यपरक ‘स्वागत’ को स्पष्ट करती है। ‘नगर’ ने πόλις के आकार-संबंधी खुलेपन को यथासंभव बनाए रखा है।
