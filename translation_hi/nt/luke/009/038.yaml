  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: hi
  text: और देखिए, भीड़ में से एक आदमी ने पुकारकर कहा, “गुरु, मैं आपसे विनती करता हूँ कि मेरे बेटे की ओर ध्यान दीजिए, क्योंकि वह मेरी इकलौती संतान है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मेरा इकलौता बेटा है।” यूनानी में शाब्दिक भाव है कि वह मेरे लिए ‘एकमात्र’ है। प्रसंग में उसे पहले ही बेटा कहा गया है, इसलिए दोनों अनुवाद सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखिए
  rationale: यह कथावाचक का ध्यान आकर्षित करने वाला संकेत है। ‘देखिए’ लूका की वर्णन-शैली को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: भीड़ में से एक आदमी
  rationale: ἀνήρ के पुरुषवाचक अर्थ और भीड़ में उस व्यक्ति की उपस्थिति—दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐβόησεν λέγων
  choice: पुकारकर कहने लगा
  rationale: ἐβόησεν की ऊँची और व्याकुल पुकार को व्यक्त करता है तथा यूनानी कृदन्तीय संबंध को सहज हिन्दी में रखता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में διδάσκαλος का सीधा और प्रतिष्ठित हिन्दी पर्याय है; इसमें ‘स्वामी’ जैसा अतिरिक्त अधिकार-सूचक भाव नहीं जोड़ा गया।
- source_word: δέομαί σου
  choice: मैं आपसे विनती करता हूँ
  rationale: साधारण अनुरोध से अधिक गंभीर और आग्रहपूर्ण याचना को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπιβλέψαι ἐπὶ
  choice: की ओर ध्यान दीजिए
  rationale: यह केवल देखने की क्रिया नहीं, बल्कि किसी पर ध्यान देने और उसकी दशा पर गौर करने का भाव भी रखता है। यह चयन उस व्यापक अर्थ को बिना ‘कृपा’ जैसी अतिरिक्त धारणा जोड़े व्यक्त करता है।
- source_word: τὸν υἱόν μου
  choice: मेरे बेटे
  rationale: υἱός के पुरुषवाचक और पारिवारिक अर्थ का सीधा, सामान्य हिन्दी रूप है।
- source_word: μονογενής μοί ἐστιν
  choice: वह मेरी इकलौती संतान है
  rationale: μονογενής यहाँ उस बच्चे के पिता की एकमात्र संतान होने पर बल देता है। पहले ही उसे बेटा कहा गया है, इसलिए ‘इकलौती संतान’ अर्थ को स्पष्ट रखता है, जबकि ‘इकलौता बेटा’ की सम्भावना पाद-टिप्पणी में सुरक्षित है।
