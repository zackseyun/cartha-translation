source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: hi
  text: जब उसके शिष्य याकूब और यूहन्ना ने यह देखा, तो उन्होंने कहा, “प्रभु, क्या आप चाहते हैं कि हम कहें कि आकाश से आग उतरे और उन्हें भस्म कर दे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: जब ... ने यह देखा
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है। ‘यह’ पिछले पद में सामरियों द्वारा किए गए इनकार की ओर संकेत करता है; यूनानी में कर्म स्पष्ट रूप से नहीं दिया गया।
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: शिष्यों याकूब और यूहन्ना
  rationale: यह समानाधिकरण दोनों व्यक्तियों को शिष्यों के रूप में पहचानता है और उनके नाम सीधे देता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे संबोधित करते समय κύριε के लिए यह मानक, गरिमापूर्ण और स्वाभाविक हिन्दी संबोधन है।
- source_word: θέλεις
  choice: क्या आप चाहते हैं
  rationale: यहाँ θέλω इच्छा और अनुमति देने की तत्परता व्यक्त करता है; आधुनिक हिन्दी में यह प्रश्न स्वाभाविक है।
- source_word: εἴπωμεν
  choice: हम आज्ञा दें
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘हम कहें’ है, पर इसके बाद अग्नि के उतरने का infinitive आने से प्रसंग में आदेश देने का भाव है। मुख्य पाठ में ‘आज्ञा दें’ उस आशय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: आकाश से आग उतरे
  rationale: यह मूल बिंब और भविष्यद्वक्ताओं के न्याय-संबंधी वर्णन की प्रतिध्वनि को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναλῶσαι
  choice: भस्म कर दे
  rationale: यह क्रिया यहाँ आग द्वारा पूरी तरह नष्ट कर देने का भाव रखती है। ‘भस्म कर दे’ अग्नि के बिंब को ‘नष्ट कर दे’ से अधिक प्रत्यक्ष रूप में सुरक्षित रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह बहुवचन सर्वनाम पिछले प्रसंग के सामरी लोगों की ओर संकेत करता है।
theological_decisions:
- issue: ‘देखा’ का अव्यक्त कर्म
  choice: ‘यह’ जोड़कर पिछले पद में हुए इनकार की ओर संकेत किया गया।
  alternative: ‘याकूब और यूहन्ना ने देखकर’ अथवा ‘जब याकूब और यूहन्ना ने देखा’
  rationale: यूनानी कृदन्त में कर्म व्यक्त नहीं है। हिन्दी में ‘यह’ कथानक का संबंध स्पष्ट करता है, पर कोई नई घटना नहीं जोड़ता।
- issue: शिष्यों के प्रस्ताव का बल
  choice: εἴπωμεν को मुख्य पाठ में ‘हम आज्ञा दें’ किया गया।
  alternative: ‘हम कहें’ अथवा ‘हम आकाश से आग बुलाएँ’
  rationale: यूनानी में सामान्य क्रिया λέγω है, कोई विशिष्ट ‘आज्ञा देना’ क्रिया नहीं; फिर भी अग्नि से उतरने को कहना इस प्रसंग में आदेश का कार्य करता है। मुख्य पाठ अर्थ को स्वाभाविक रूप में देता है और पादटिप्पणी मूल की असामान्य शाब्दिक बनावट सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘आकाश’, ‘आग’ और ‘भस्म कर दे’ सामान्य पाठकों के लिए स्पष्ट हैं तथा मूल के न्याय-संबंधी तीखे बिंब को बनाए रखते हैं।
