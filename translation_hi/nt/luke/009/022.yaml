id: LUK.9.22
reference: Luke 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: hi
  text: उन्होंने कहा, “मनुष्य के पुत्र के लिए यह आवश्यक है कि वह बहुत-से दुःख सहे, बुज़ुर्गों, प्रधान याजकों और शास्त्रियों के द्वारा अस्वीकार किया जाए, मार डाला जाए और तीसरे दिन उठाया जाए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जी उठे।” यूनानी में क्रिया निष्क्रिय है: “उठाया जाए।”'
    reason: निष्क्रिय यूनानी रूप को स्पष्ट करते हुए स्वाभाविक हिन्दी विकल्प देना।
lexical_decisions:
- source_word: εἰπὼν
  choice: उन्होंने कहा
  rationale: अओरिस्ट कृदंत पिछले प्रसंग से जुड़कर यीशु के कथन का परिचय देता है। हिन्दी में ‘उन्होंने कहा’ इस कथन को स्वाभाविक और स्पष्ट ढंग से आरम्भ करता है।
- source_word: Δεῖ
  choice: के लिए यह आवश्यक है कि
  rationale: यह केवल सुविधा नहीं, बल्कि अनिवार्यता व्यक्त करता है। यह रूप यूनानी की निर्वैयक्तिक रचना और परमेश्वर की योजना में निहित आवश्यकता—दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्व-पदवी का स्थापित और अंतर्पाठीय अर्थ रखने वाला अनुवाद है; इसे सामान्य ‘मनुष्य’ कहकर परिभाषित नहीं किया गया।
- source_word: πολλὰ παθεῖν
  choice: बहुत-से दुःख सहे
  rationale: नपुंसकलिंग बहुवचन πολλὰ दुःख की व्यापकता बताता है। ‘बहुत-से दुःख’ हिन्दी में स्वाभाविक रहते हुए इस बहुलता को व्यक्त करता है।
- source_word: ἀποδοκιμασθῆναι
  choice: ठुकराया जाए
  rationale: निष्क्रिय क्रिया आधिकारिक जाँच या मूल्यांकन के बाद अस्वीकार किए जाने का भाव देती है; ‘ठुकराया जाए’ वर्तमान हिन्दी में स्पष्ट और प्रभावी है।
- source_word: πρεσβυτέρων
  choice: पुरनियों
  rationale: यह यहूदी नेतृत्व के एक मान्य संस्थागत वर्ग का पद है। ‘पुरनियों’ उस समूह-संज्ञा को सामान्य ‘अगुओं’ में विलीन किए बिना सुरक्षित रखता है।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन यहाँ प्रधान-याजकीय वर्ग को सूचित करता है, न कि एक साथ कई एकमात्र महायाजकों को।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: यह मान्य धार्मिक-लेखकीय और व्याख्यात्मक वर्ग की सीधी पद-संज्ञा है; ‘व्यवस्था के शिक्षक’ कहना अधिक व्याख्यात्मक होता।
- source_word: ἀποκτανθῆναι
  choice: मार डाला जाए
  rationale: यह निष्क्रिय अनंत क्रिया हत्या किए जाने को सीधे व्यक्त करती है। हिन्दी में यह ‘मृत्युदंड दिया जाए’ की अपेक्षा कम कानूनी और यूनानी के अधिक निकट है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: कालवाचक सम्प्रदान का स्वाभाविक हिन्दी रूप है और परिचित पुनरुत्थान-सूत्र को बनाए रखता है।
- source_word: ἐγερθῆναι
  choice: उठाया जाए
  rationale: निष्क्रिय रूप को सुरक्षित रखता है और उठाने वाले कर्ता को स्पष्ट रूप से जोड़ता नहीं, ठीक जैसे यूनानी पाठ कर्ता का नाम नहीं देता।
theological_decisions:
- issue: पुनरुत्थान की क्रिया का निष्क्रिय रूप
  choice: उठाया जाए
  alternative: जी उठे
  rationale: ἐγερθῆναι निष्क्रिय अनंत क्रिया है। ‘उठाया जाए’ परमेश्वर के निहित कार्य की सम्भावना को बनाए रखता है, पर पाठ में अनुपस्थित कर्ता को स्पष्ट रूप से नहीं जोड़ता।
- issue: Δεῖ में व्यक्त अनिवार्यता
  choice: मनुष्य के पुत्र के लिए यह आवश्यक है कि
  alternative: मनुष्य के पुत्र को अवश्य
  rationale: चुना हुआ रूप यूनानी की निर्वैयक्तिक रचना को अधिक निकटता से दर्शाता है और घटनाओं को परमेश्वर की उद्धार-योजना में आवश्यक बताता है, पर उस आवश्यकता की कार्यप्रणाली की अतिरिक्त व्याख्या नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मनुष्य का पुत्र’, ‘प्रधान याजक’ और ‘शास्त्री’ जैसी स्थापित पद-संज्ञाएँ अंतर्पाठीय और ऐतिहासिक पहचान बचाती हैं। ‘पुरनियों’ कुछ पारंपरिक है, पर यहाँ विशिष्ट नेतृत्व-वर्ग को ठीक प्रकार सूचित करता है। समानांतर निष्क्रिय क्रियाओं की शृंखला यूनानी वाक्य की गंभीर लय और धर्मवैचारिक तनाव को बनाए रखती है।
