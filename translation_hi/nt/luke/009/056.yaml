lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य समुच्चयबोधक है और कथा की पिछली घटना से सरल संबंध बनाए रखता है; अनावश्यक कालगत अर्थ नहीं जोड़ता।
- source_word: ἐπορεύθησαν
  choice: वे ... चले गए
  rationale: πορεύομαι के इस रूप का मूल अर्थ जाना या आगे बढ़ना है। संदर्भ में अस्वीकार किए जाने के बाद वहाँ से दूसरे स्थान को जाना व्यक्त होता है; ‘चले गए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: εἰς
  choice: में
  rationale: गति के क्रियापद के साथ εἰς गंतव्य की ओर गति बताता है। हिन्दी में ‘गाँव में चले गए’ इस संदर्भ में स्वाभाविक रूप से वहाँ जाने और पहुँचने का भाव देता है।
- source_word: ἑτέραν
  choice: किसी दूसरे
  rationale: ἕτερος का अर्थ ‘दूसरा’ अथवा ‘भिन्न’ हो सकता है। ‘किसी दूसरे’ अनिश्चित गंतव्य और पहले गाँव से भिन्नता—दोनों को सहज ढंग से व्यक्त करता है।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη नगर की अपेक्षा छोटी, ग्रामीण बस्ती को सूचित करता है; इसलिए ‘गाँव’ सटीक और सामान्य हिन्दी है।
