  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: hi
  text: फिर उसने किसी और से कहा, “मेरे पीछे आओ।” लेकिन उसने कहा, “प्रभु, मुझे पहले जाकर अपने पिता को दफनाने की अनुमति दें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु, मुझे पहले जाकर अपने पिता को दफनाने दें।”
    reason: यूनानी सहभागी पदबंध ἀπελθόντι πρῶτον को अनुमति की क्रिया के साथ वैकल्पिक, स्वाभाविक हिन्दी विन्यास में व्यक्त किया गया है; अर्थ में कोई महत्वपूर्ण अंतर नहीं है।
lexical_decisions:
- source_word: ἕτερον
  choice: किसी और
  rationale: यह ἕτερος के ‘एक अन्य व्यक्ति’ के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और व्यक्ति की पहचान के बारे में कुछ अतिरिक्त नहीं जोड़ता।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे आओ
  rationale: हिन्दी में यह किसी का अनुयायी बनने या उसके साथ चलने के आह्वान को स्वाभाविक रूप से व्यक्त करता है। यूनानी वर्तमान आज्ञार्थक के पक्षगत बल को ‘लगातार’ जोड़कर अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे संबोधित करते समय यह आदर और संभावित मसीही धार्मिक अर्थ—दोनों को बनाए रखता है; ‘महोदय’ अर्थ को केवल सामाजिक आदर तक सीमित कर देता।
- source_word: ἐπίτρεψόν
  choice: अनुमति दें
  rationale: यह अनुमति माँगने वाले आज्ञार्थक रूप को सम्मानपूर्ण और वर्तमान हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀπελθόντι πρῶτον
  choice: पहले जाकर
  rationale: यह जाने और फिर पिता को दफनाने के क्रम को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: θάψαι τὸν πατέρα μου
  choice: अपने पिता को दफना दूँ
  rationale: यह दफनाने की क्रिया और वक्ता के पिता को उसके कर्म के रूप में सीधे व्यक्त करता है; ‘अपने’ हिन्दी में समान कर्ता के संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी; महोदय
  rationale: ‘प्रभु’ संबोधन के आदर और लूका के व्यापक मसीही धार्मिक संकेत, दोनों को खुला रखता है। ‘महोदय’ इसे केवल शिष्ट संबोधन बना सकता है, जबकि ‘स्वामी’ हिन्दी में अलग सामाजिक अर्थ उत्पन्न कर सकता है।
translation_notes:
  register: आधुनिक, सहज और सम्मानपूर्ण हिन्दी अपनाई गई है। यीशु की आज्ञा के लिए ‘मेरे पीछे आओ’ प्रचलित शिष्यत्व-संबंधी अर्थ को बिना कृत्रिम या अत्यधिक पुरातन भाषा के व्यक्त करता है।
