id: LUK.9.6
reference: Luke 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: hi
  text: तब वे निकल पड़े और गाँव-गाँव जाकर[a] हर जगह शुभ समाचार सुनाते[b] और लोगों को चंगा करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गाँवों में घूमते हुए।’ यूनानी अभिव्यक्ति अलग-अलग गाँवों में जाने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सुसमाचार का प्रचार करते।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: निकल पड़े
  rationale: यह क्रिया यीशु से निर्देश पाने के बाद शिष्यों के प्रस्थान को दर्शाती है; ‘निकल पड़े’ स्वाभाविक हिन्दी में क्रमिक कथा-प्रवाह को व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ पिछले निर्देशों के बाद हुई अगली घटना को सहज रूप से जोड़ता है।
- source_word: διήρχοντο
  choice: जाकर … करते रहे
  rationale: अपूर्णकालीन क्रिया निरंतर और स्थान-स्थान पर होने वाली गतिविधि का संकेत देती है; ‘करते रहे’ उसकी जारी प्रकृति को व्यक्त करता है।
- source_word: κατὰ τὰς κώμας
  choice: गाँव-गाँव
  rationale: κατά और बहुवचन कर्मकारक का प्रयोग यहाँ वितरणात्मक है—वे अलग-अलग गाँवों में गए। ‘गाँव-गाँव’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुनाते
  rationale: यह लोगों तक शुभ संदेश पहुँचाने की घोषणा को दर्शाता है। ‘शुभ समाचार सुनाते’ अर्थ को साधारण पाठकों के लिए स्पष्ट रखता है और अनावश्यक धार्मिक पारिभाषिकता से बचता है।
- source_word: θεραπεύοντες
  choice: लोगों को चंगा करते
  rationale: संदर्भ में यह शारीरिक रोगों से आरोग्य देने की गतिविधि है। हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति के लिए निहित मानवीय कर्म ‘लोगों को’ जोड़ा गया है।
- source_word: πανταχοῦ
  choice: हर जगह
  rationale: यह उनकी सेवकाई के व्यापक स्थानिक विस्तार पर बल देता है; ‘हर जगह’ सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: εὐαγγελιζόμενοι का मिशन-संबंधी अर्थ
  choice: शुभ समाचार सुनाते
  alternative: सुसमाचार का प्रचार करते
  rationale: मूल शब्द शुभ संदेश की सार्वजनिक घोषणा बताता है, पर इस पद में बाद की विकसित पारिभाषिक व्याख्या को अलग से निर्दिष्ट नहीं करता। चुना हुआ रूप प्रचार के आशय को बनाए रखते हुए सामान्य पाठक के लिए सुलभ है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। अपूर्णकाल की निरंतरता ‘करते रहे’ से और गाँवों के बीच वितरणात्मक गति ‘गाँव-गाँव’ से व्यक्त की गई है।
