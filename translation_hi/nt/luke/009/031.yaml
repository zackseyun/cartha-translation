  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: hi
  text: जो महिमा में प्रकट हुए थे, वे उनके उस प्रस्थान[a] के बारे में बात कर रहे थे, जिसे यीशु यरूशलेम में पूरा करने वाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रस्थान’ के लिए प्रयुक्त यूनानी शब्द का मूल अर्थ ‘बाहर जाना’ या ‘निर्गमन’ भी हो सकता है। इस संदर्भ में यह यीशु की आने वाली मृत्यु से संबंधित है और संभवतः निर्गमन की प्रतिध्वनि भी रखता है।
    reason: मुख्य पाठ में शब्द की व्यापकता बनाए रखते हुए उसके संदर्भगत मृत्यु-संकेत और संभावित साहित्यिक प्रतिध्वनि को तटस्थ ढंग से स्पष्ट करता है।
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: महिमा में दिखाई दिए
  rationale: दृश्य रूप से प्रकट होने और महिमामय अवस्था—दोनों भावों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔξοδον
  choice: प्रस्थान
  rationale: यूनानी शब्द का मूल अर्थ ‘बाहर जाना/प्रस्थान’ है; यहाँ यीशु की आगामी मृत्यु और उससे जुड़े घटनाक्रम की ओर संकेत है, पर अनुवाद उस बहुस्तरीय संकेत को केवल ‘मृत्यु’ तक सीमित नहीं करता।
- source_word: πληροῦν
  choice: पूरा करने
  rationale: यह केवल किसी घटना को घटित होने देने के बजाय उसे सिद्धि तक पहुँचाने या पूरा करने का भाव रखता है; इसलिए ‘करने’ या ‘संपन्न करने’ की अपेक्षा ‘पूरा करने’ को चुना गया।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थानवाचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: यीशु के आगामी ‘ἔξοδος’ का आशय
  choice: मुख्य पाठ में ‘प्रस्थान’ रखा गया
  alternative: ‘मृत्यु’ या ‘संसार से विदा होना’
  rationale: संदर्भ में यीशु की मृत्यु प्रमुख है, पर ‘ἔξοδος’ में मृत्यु से व्यापक प्रस्थान तथा निर्गमन-संबंधी संभावित प्रतिध्वनि बनी रहती है। ‘प्रस्थान’ इस अर्थ-व्याप्ति और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: πληροῦν में उद्देश्यपूर्ण पूर्णता का भाव
  choice: ‘जिसे वह ... पूरा करने वाले थे’
  alternative: ‘जो ... होने वाला था’ या ‘जिसे वह ... संपन्न करने वाले थे’
  rationale: सक्रिय क्रिया को निष्क्रिय घटना में नहीं बदला गया और ‘पूरा करना’ प्रतिज्ञा/योजना की सिद्धि की संभावित ध्वनि को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। यीशु के लिए आदरसूचक बहुवचन क्रिया ‘करने वाले थे’ रखी गई है। वाक्य को पिछले पद के पुरुषों से जोड़ने के लिए आरंभ में ‘वे’ प्रयोग किया गया है।
