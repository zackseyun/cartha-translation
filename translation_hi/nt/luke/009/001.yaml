source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: hi
  text: और उसने उन बारहों को एक साथ बुलाकर उन्हें सब दुष्टात्माओं पर और रोगों को चंगा करने के लिए सामर्थ्य और अधिकार दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: एक साथ बुलाकर
  rationale: सम्बन्धसूचक उपसर्ग συν- के ‘एक साथ’ भाव और मुख्य क्रिया से पहले की कृदन्तीय क्रिया—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: फिर
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; ‘फिर’ कथा की अगली क्रिया को सहज रूप से जोड़ता है, बिना विरोध का भाव जोड़े।
- source_word: τοὺς δώδεκα
  choice: उन बारहों को
  rationale: मूल में केवल ‘बारह’ हैं; ‘शिष्य’ या ‘प्रेरित’ जोड़ने से बचते हुए हिन्दी में पहचाने हुए समूह का संकेत देता है।
- source_word: δύναμιν καὶ ἐξουσίαν
  choice: सामर्थ्य और अधिकार
  rationale: δύναμις की कार्य करने की क्षमता और ἐξουσία के प्रदत्त अधिकार का भेद बनाए रखता है।
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: सब दुष्टात्माओं पर
  rationale: ἐπί के प्रभुत्व-सूचक अर्थ को ‘पर’ से और πάντα τὰ δαιμόνια को स्वाभाविक सामूहिक बहुवचन से व्यक्त किया गया है।
- source_word: νόσους θεραπεύειν
  choice: रोगों को चंगा करने की शक्ति
  rationale: θεραπεύειν के उपचारार्थक भाव को ‘चंगा करने’ से व्यक्त किया गया है; हिन्दी वाक्य में दूसरे उद्देश्य को स्पष्ट रूप से δύναμις से जोड़ने के लिए ‘शक्ति’ दोहराई गई है।
theological_decisions:
- issue: δύναμις और ἐξουσία का भेद
  choice: ‘सामर्थ्य और अधिकार’ के रूप में दोनों अलग शब्द रखे गए
  alternative: केवल ‘शक्ति’ या ‘अधिकार और शक्ति’
  rationale: पाठ क्षमता और प्रदत्त अधिकार—दो सम्बद्ध किंतु भिन्न पहलुओं—का उल्लेख करता है; दोनों को एक शब्द में समेटना अर्थ को सपाट कर देता।
- issue: ‘बारहों’ की पहचान
  choice: ‘उन बारहों’ रखा गया; ‘शिष्य’ या ‘प्रेरित’ नहीं जोड़ा गया
  alternative: ‘बारह शिष्यों’ अथवा ‘बारह प्रेरितों’
  rationale: यूनानी पाठ इस पद में केवल τοὺς δώδεκα कहता है; निकटवर्ती संदर्भ की उपाधि जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: दुष्टात्माओं और रोगों पर दिए गए अधिकार/सामर्थ्य का वाक्यगत सम्बन्ध
  choice: दुष्टात्माओं पर ‘सामर्थ्य और अधिकार’, तथा रोग चंगा करने के लिए ‘शक्ति’
  alternative: ‘सब दुष्टात्माओं और रोगों पर सामर्थ्य और अधिकार’
  rationale: यूनानी में ἐπί स्पष्टतः दुष्टात्माओं से जुड़ता है, जबकि θεραπεύειν रोगों को चंगा करने की क्रिया बताता है। हिन्दी में रोगों ‘पर अधिकार’ का अनपेक्षित अर्थ न निकले, इसलिए संरचना स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘दुष्टात्मा’, ‘सामर्थ्य’, ‘अधिकार’ और ‘चंगा करना’ सामान्य बाइबलीय शब्दावली हैं, पर वाक्यरचना समकालीन और सहज रखी गई है।
