base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: hi
  text: पर उसने उससे कहा[a], “मरे हुओं को अपने ही मरे हुओं को दफ़नाने दो; पर तुम जाकर परमेश्वर के राज्य की घोषणा करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहली बार आए “मरे हुए” का अर्थ सम्भवतः रूपकात्मक है—अर्थात आत्मिक रूप से अनुत्तरदायी लोग—जबकि दूसरी बार इसका संकेत शारीरिक रूप से मरे हुओं की ओर है। यूनानी में दोनों जगह एक ही शब्द प्रयुक्त हुआ है, इसलिए अनुवाद में भी उसकी पुनरावृत्ति रखी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: दफ़नाने दो
  rationale: आज्ञार्थक ἄφες को infinitive θάψαι के साथ स्वाभाविक हिन्दी में ‘दफ़नाने दो’ कहा गया है। यह अनुमति-जैसी व्याकरणिक रचना रखते हुए प्रसंग में तीखा निर्देश व्यक्त करता है।
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: मरे हुओं ... अपने मरे हुओं
  rationale: νεκρούς की जानबूझकर की गई पुनरावृत्ति और कथन का विरोधाभास सुरक्षित रखा गया है। ἑαυτῶν का बल ‘अपने’ से व्यक्त होता है।
- source_word: θάψαι
  choice: दफ़नाने
  rationale: यह Ἄφες के साथ प्रयुक्त infinitive है और मृत व्यक्ति के संस्कारार्थ गाड़े जाने को स्पष्ट तथा सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπελθὼν
  choice: जाकर
  rationale: पूर्ववर्ती aorist participle को हिन्दी के स्वाभाविक संयुक्त क्रियात्मक क्रम ‘जाकर ... प्रचार करो’ से व्यक्त किया गया है; इससे प्रस्थान और फिर घोषणा का क्रम बना रहता है।
- source_word: διάγγελλε
  choice: प्रचार करो
  rationale: Present imperative सार्वजनिक और निरंतर घोषणा का भाव देता है। ‘प्रचार करो’ राज्य-संदर्भ में स्वाभाविक और व्यापक रूप से समझा जाने वाला पद है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: यह स्थापित बाइबलीय अभिव्यक्ति है और परमेश्वर के शासन तथा राज्य—दोनों से जुड़े स्रोत-पाठ के अर्थक्षेत्र को खुला रखती है।
theological_decisions:
- issue: ‘मरे हुए’ के दोनों प्रयोगों का अर्थ
  choice: मुख्य पाठ में दोनों स्थानों पर ‘मरे हुए’ रखकर रूपक और शाब्दिक अर्थ का तनाव सुरक्षित रखा गया।
  alternative: पहले प्रयोग को स्पष्ट करते हुए ‘आत्मिक रूप से मरे हुए’ कहना।
  rationale: पहला प्रयोग सम्भवतः आत्मिक रूप से अनुत्तरदायी लोगों के लिए रूपक है और दूसरा शारीरिक रूप से मृत लोगों के लिए; किन्तु यूनानी में दोनों जगह वही शब्द है। मुख्य पाठ में व्याख्या जोड़ना स्रोत की जानबूझकर रखी गई तीक्ष्णता और अस्पष्टता को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दफ़नाने दो’ बोलचाल और साहित्यिक हिन्दी दोनों में स्वाभाविक है; ‘जाकर ... प्रचार करो’ यूनानी participle और imperative के क्रम को बिना कृत्रिम शाब्दिकता के व्यक्त करता है।
