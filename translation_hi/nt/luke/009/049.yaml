  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: hi
  text: तब यूहन्ना ने उत्तर में कहा, “स्वामी, हमने किसी को आपके नाम से दुष्टात्माएँ निकालते देखा, और हमने उसे रोकने की कोशिश की, क्योंकि वह हमारे साथ आपका अनुसरण नहीं करता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: तब यूहन्ना ने कहा
  rationale: यह यूनानी कथात्मक प्रत्युत्तर और प्रसंग की आगे बढ़ती गति व्यक्त करता है। हिन्दी में ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता, जबकि ‘तब ... ने कहा’ स्वाभाविक है।
- source_word: Ἐπιστάτα
  choice: स्वामी
  rationale: लूका में यह यीशु के अधिकार और नेतृत्व को मानने वाला विशिष्ट संबोधन है; ‘स्वामी’ आधुनिक हिन्दी में गरिमापूर्ण है और केवल शिक्षण की भूमिका तक सीमित नहीं करता।
- source_word: εἴδομέν τινα
  choice: हमने किसी को ... देखा
  rationale: τινα अनिश्चित व्यक्ति को दर्शाता है; ‘किसी को’ हिन्दी का सहज और सटीक समतुल्य है।
- source_word: ἐν τῷ ὀνόματί σου
  choice: आपके नाम से
  rationale: यह यीशु के नाम और अधिकार के आधार पर कार्य करने का भाव रखता है। ‘आपके नाम से’ हिन्दी में स्वाभाविक है और मूल मुहावरे का धार्मिक भार बनाए रखता है।
- source_word: ἐκβάλλοντα δαιμόνια
  choice: दुष्टात्माएँ निकालते
  rationale: ἐκβάλλω का यहाँ अर्थ किसी व्यक्ति से दुष्टात्माओं को बाहर निकालना है। यह हिन्दी में परिचित और स्पष्ट अभिव्यक्ति है।
- source_word: ἐκωλύομεν
  choice: हमने उसे रोकने की कोशिश की
  rationale: अपूर्ण भूतकाल चल रहे या प्रयास किए गए निषेध का संकेत दे सकता है; यह अनुवाद उस पक्षगत सूक्ष्मता को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: क्योंकि वह हमारे साथ होकर आपके पीछे नहीं चलता
  rationale: μεθ’ ἡμῶν के ‘हमारे साथ’ भाव को स्पष्ट रखते हुए हिन्दी में ‘पीछे चलना’ का अपेक्षित संबंध यीशु से जोड़ा गया है। इससे यह नहीं कहा जाता कि वह यूहन्ना और अन्य शिष्यों को अपना गुरु मानकर उनके पीछे चले; शिकायत यह है कि वह उनके साथ यीशु का अनुसरण नहीं करता।
theological_decisions:
- issue: शिष्यत्व की निष्ठा और समूह-संबंध के बीच संभावित अस्पष्टता
  choice: “वह हमारे साथ होकर आपके पीछे नहीं चलता”
  alternative: “वह हमारे पीछे नहीं चलता” / “वह हमारे साथ नहीं चलता”
  rationale: यूनानी में ἀκολουθεῖ के साथ μεθ’ ἡμῶν स्पष्टतः ‘हमारे साथ’ है। हिन्दी वाक्य यीशु को अनुसरण का केंद्र रखते हुए समूह में सम्मिलित न होने की शिकायत को सुरक्षित रखता है और उस व्यक्ति को यीशु-विरोधी ठहराने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’ और सरल किंतु गरिमापूर्ण बाइबिलीय शैली। ‘स्वामी’ लूका के विशिष्ट संबोधन में अधिकार का भाव रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में μεθ’ ἡμῶν की सूक्ष्मता स्पष्ट रूप से समाहित है।
