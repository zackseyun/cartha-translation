  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: hi
  text: और कुछ लोग कहते थे कि एलिय्याह प्रकट हुआ था, और दूसरे कहते थे कि प्राचीन समय के भविष्यद्वक्ताओं में से कोई जी उठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: कुछ लोगों का कहना था ... कुछ का
  rationale: यूनानी में कर्तृवाचक स्रोत और पिछले पद से जुड़ी लुप्त कथन-क्रिया है। स्वाभाविक हिन्दी में ‘कहना था’ जोड़कर दोनों मतों की समानांतर रचना स्पष्ट की गई है।
- source_word: δὲ ... δὲ
  choice: और ... और
  rationale: यहाँ δέ अलग-अलग जनमतों को सूची में जोड़ता है; ‘और’ हल्के संयोजक भाव को बनाए रखता है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: ἐφάνη
  choice: प्रकट हुआ है
  rationale: क्रिया का अर्थ दिखाई देना या प्रकट होना है। यह अगले खंड के ἀνέστη से भेद बनाए रखता है।
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: प्राचीन समय के भविष्यद्वक्ताओं में से कोई
  rationale: τις अनिश्चितता व्यक्त करता है और τῶν ἀρχαίων पुराने समय से संबंधित समूह को सूचित करता है। हिन्दी में यह रूप स्वाभाविक रहते हुए किसी एक अज्ञात प्राचीन भविष्यद्वक्ता का आशय देता है।
- source_word: ἀνέστη
  choice: जी उठा है
  rationale: संदर्भ में यह मृतकों में से उठने की धारणा व्यक्त करता है। ‘जी उठा’ पुनर्जीवन का संकेत सुरक्षित रखता है और यूनानी में निहित न होने वाला स्पष्ट कर्मवाच्य नहीं जोड़ता।
theological_decisions:
- issue: प्राचीन भविष्यद्वक्ता के विषय में लोगों के दावे का स्वरूप
  choice: जी उठा है
  alternative: फिर प्रकट हुआ है / जिलाया गया है
  rationale: ἀνέστη यहाँ उठने, और प्रसंगतः मृत्यु से जी उठने, का अर्थ देता है। अनुवाद उस जनमत को प्रस्तुत करता है, उसकी सत्यता की पुष्टि नहीं करता और यह निर्धारित नहीं करता कि वह कौन-सा भविष्यद्वक्ता था।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण। पद पिछले वाक्य की सूची को आगे बढ़ाता है, इसलिए कथन-क्रिया को हिन्दी में स्पष्ट किया गया है।
