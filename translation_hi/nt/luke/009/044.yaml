source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: hi
  text: “तुम इन बातों को अपने कानों में डाल लो, क्योंकि मनुष्य का पुत्र मनुष्यों[b] के हाथों में सौंपा[a] जाने वाला है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पकड़वाया” अथवा “विश्वासघात करके सौंपा।” यूनानी क्रिया का अर्थ “सौंपना,” “अधिकार में दे देना,” और कुछ संदर्भों में “विश्वासघात करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आदमियों” अथवा “लोगों।” यहाँ यूनानी शब्द व्यापक रूप से मानवों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς
  choice: तुम ... डाल लो
  rationale: आज्ञार्थक क्रिया को सीधे और स्वाभाविक रूप में रखा गया है; स्पष्ट सर्वनाम ὑμεῖς का बल ‘तुम’ से बना रहता है।
- source_word: εἰς τὰ ὦτα ὑμῶν
  choice: अपने कानों में
  rationale: यूनानी का सजीव रूपक सुरक्षित रखा गया है; इसका आशय ध्यान से सुनकर बात को मन में बनाए रखना है, पर मुख्य पाठ में उस रूपक को व्याख्यात्मक ढंग से नहीं बदला गया।
- source_word: τοὺς λόγους τούτους
  choice: इन बातों को
  rationale: संदर्भ में λόγους यीशु के अगले कथन की ओर संकेत करता है। आधुनिक हिन्दी में ‘इन बातों’ स्वाभाविक है और अर्थ को पर्याप्त निकटता से व्यक्त करता है।
- source_word: ὁ γὰρ
  choice: क्योंकि
  rationale: γάρ आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट उपाधि का पारंपरिक, शाब्दिक और अंतरपाठीय महत्व सुरक्षित रहता है।
- source_word: μέλλει
  choice: जाने वाला है
  rationale: यह निकट भविष्य में होने वाली घटना का संकेत देता है, बिना ‘नियत’ जैसे अधिक प्रबल भाग्य-संबंधी अर्थ को जोड़े।
- source_word: παραδίδοσθαι
  choice: सौंपा जाना
  rationale: यह निष्क्रिय क्रिया किसी दूसरे के अधिकार में दिए जाने का व्यापक अर्थ बनाए रखती है और इसे केवल यहूदा के विश्वासघात तक सीमित नहीं करती।
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: मनुष्यों के हाथों में
  rationale: ‘हाथों में’ वाला मूल मुहावरा किसी के अधिकार में दिए जाने का भाव रखता है। ‘मनुष्यों’ से ἀνθρώπων का व्यापक मानवीय संदर्भ और ‘मनुष्य का पुत्र’ के साथ शब्दगत प्रतिध्वनि दोनों बने रहते हैं।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου की उपाधि
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ स्थापित हिन्दी रूप है और उपाधि की अस्पष्टता, दानिय्येल 7 की संभावित प्रतिध्वनि तथा मसीही अर्थभार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: παραδίδοσθαι का अर्थ-क्षेत्र
  choice: सौंपा जाना
  alternative: पकड़वाया जाना / विश्वासघात करके सौंपा जाना
  rationale: मूल क्रिया सौंपे जाने और कुछ संदर्भों में विश्वासघात किए जाने—दोनों का भाव रख सकती है। व्यापक मुख्य-पाठ रूप कथा के इस चरण में अर्थ को समय से पहले संकीर्ण नहीं करता।
- issue: ἀνθρώπων का विस्तार
  choice: मनुष्यों
  alternative: आदमियों / लोगों
  rationale: ‘मनुष्यों’ यहाँ स्वाभाविक सामूहिक अर्थ देता है और ‘मनुष्य का पुत्र’ के साथ जानबूझकर बनी विडंबनापूर्ण प्रतिध्वनि को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘अपने कानों में डाल लो’ सामान्य हिन्दी से कुछ अधिक सजीव है, पर मूल यूनानी की जानबूझकर प्रयुक्त श्रवण-छवि को सुरक्षित रखने के लिए इसे रखा गया है।
