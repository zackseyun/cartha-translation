lexical_decisions:
- source_word: ἔφαγον
  choice: खाया
  rationale: साधारण भूतकालीन घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐχορτάσθησαν
  choice: तृप्त हो गए
  rationale: भरपेट खा लेने का भाव सहज, वर्तमान और गरिमापूर्ण हिन्दी में देता है।
- source_word: πάντες
  choice: सबने
  rationale: इस बात पर मूल पाठ का बल बनाए रखता है कि उपस्थित सभी लोगों ने खाया।
- source_word: ἤρθη
  choice: उठा लिए गए
  rationale: निष्क्रिय क्रिया का रूप बनाए रखते हुए बचे टुकड़ों को समेटे जाने का प्रसंगानुकूल अर्थ देता है।
- source_word: τὸ περισσεῦσαν
  choice: बचे हुए
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त का स्वाभाविक हिन्दी रूप है।
- source_word: αὐτοῖς
  choice: अलग से व्यक्त नहीं किया
  rationale: इस दत्तिव का सटीक संबंध संदिग्ध है; हिन्दी में ‘उनके लिए’ जोड़ना अप्राकृतिक या भ्रामक हो सकता है, जबकि प्रसंग से स्पष्ट है कि भोजन करने वालों के बाद टुकड़े बचे थे।
- source_word: κλασμάτων
  choice: टुकड़े
  rationale: रोटी आदि के टूटे हुए हिस्सों का स्पष्ट और सामान्य हिन्दी शब्द है।
- source_word: κόφινοι δώδεκα
  choice: बारह टोकरियाँ भर
  rationale: केवल ‘बारह टोकरियाँ’ हिन्दी में गणना का अधूरा आभास दे सकती है; ‘भर’ से मूल की मात्रा-सूचक परिणति स्वाभाविक रूप से व्यक्त होती है।
