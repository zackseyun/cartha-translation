id: LUK.9.62
reference: Luke 9:62
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: hi
  text: परन्तु यीशु ने कहा, “जो कोई हल पर हाथ रखकर[a] पीछे की ओर देखता रहता है, वह परमेश्वर के राज्य के लिए उपयुक्त[b] नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हल पर हाथ रख चुका हो।” चित्र हल चलाने का काम आरम्भ करने और फिर अपना ध्यान पीछे की ओर करने का है।
    reason: lexical_alternative
  - marker: b
    text: या, “सुयोग्य”; अथवा “उपयोगी।”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐδεὶς
  choice: जो कोई … वह … नहीं
  rationale: यह हिन्दी संरचना यूनानी के सार्वभौमिक निषेध ‘कोई भी नहीं’ को स्वाभाविक और लिंग-निरपेक्ष ढंग से व्यक्त करती है।
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: हल पर हाथ रखकर
  rationale: अओरिस्ट कृदन्त हल चलाने का काम आरम्भ करने के लिए हाथ लगाने की पूर्ववर्ती क्रिया दर्शाता है। यह अनुवाद कृषि-बिम्ब को स्पष्ट और संक्षिप्त रखता है।
- source_word: ἄροτρον
  choice: हल
  rationale: यह आधुनिक हिन्दी में इस कृषि-उपकरण के लिए सामान्य और सहज शब्द है।
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: पीछे की ओर देखता रहता है
  rationale: वर्तमान कृदन्त लगातार या बार-बार पीछे देखने का भाव दे सकता है। ‘देखता रहता है’ ध्यान और निष्ठा के निरन्तर पीछे मुड़ने को व्यक्त करता है, बिना इसे केवल शारीरिक रूप से लौट जाने का अर्थ दिए।
- source_word: εὔθετός
  choice: उपयुक्त
  rationale: इसका मूल भाव किसी उद्देश्य के लिए सुयोग्य, अनुकूल या उपयोगी होना है। ‘उपयुक्त’ नैतिक पात्रता अथवा उद्धार-सम्बन्धी निष्कर्ष को अनावश्यक रूप से जोड़े बिना इस अर्थ को सुरक्षित रखता है।
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य के लिए
  rationale: εὔθετος के साथ सम्प्रदान कारक को हिन्दी में स्वाभाविक रूप से ‘के लिए’ कहा गया है। ‘परमेश्वर का राज्य’ βασιλεία τοῦ θεοῦ का परिचित और पर्याप्त रूप से स्पष्ट अनुवाद है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन के उत्तर में हल्के विरोध अथवा सुधारात्मक मोड़ को दर्शाता है। ‘परन्तु’ गरिमापूर्ण और स्वाभाविक है।
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ का आशय
  choice: परमेश्वर के राज्य के लिए उपयुक्त नहीं है
  alternative: परमेश्वर के राज्य में प्रवेश करने के योग्य नहीं है; परमेश्वर के राज्य की सेवा में उपयोगी नहीं है
  rationale: मूल पाठ ‘उपयुक्तता’ की बात करता है, पर यह स्पष्ट नहीं करता कि आशय अन्तिम उद्धार से बहिष्कार है या राज्य की सेवा में उपयोगिता। चुना गया रूप शिष्यत्व में अविभाजित निष्ठा की चेतावनी को बनाए रखते हुए इस धर्मवैज्ञानिक तनाव को खुला छोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सहज किन्तु गरिमापूर्ण रखी गई है। कृषि-बिम्ब को ज्यों का त्यों रखा गया है। ‘देखता रहता है’ वर्तमान कृदन्त की निरन्तरता और ‘उपयुक्त’ εὔθετος की अर्थगत व्यापकता को सुरक्षित रखते हैं।
