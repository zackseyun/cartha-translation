reference: Luke 9:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: hi
  text: इन बातों[a] के लगभग आठ दिन[b] बाद, यीशु पतरस, यूहन्ना और याकूब को अपने साथ लेकर प्रार्थना करने पहाड़ पर चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन वचनों के।” यहाँ यूनानी λόγους का अर्थ “बातें,” “कथन” या “वचन” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “लगभग आठ दिन”; ὡσεὶ समय को अनुमानित बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: मुख्य वाक्य में अलग शब्दों से व्यक्त नहीं किया
  rationale: यहाँ यह यूनानी पदबंध मुख्यतः कथा को आगे बढ़ाने वाला संक्रमण है। हिन्दी में ‘ऐसा हुआ कि’ जोड़ना अनावश्यक रूप से कृत्रिम होता; समयसूचक आरंभ ही कथा का स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: μετὰ τοὺς λόγους τούτους
  choice: इन बातों के ... बाद
  rationale: λόγους का संकेत ठीक पहले कही गई बातों की ओर है। ‘बातों’ आधुनिक हिन्दी में स्वाभाविक है और बोले गए कथनों का आशय देता है; ‘वचनों’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: लगभग आठ दिन
  rationale: ὡσεὶ समय को अनुमानित बताता है, इसलिए ‘लगभग’ को बनाए रखा गया है और संख्या को ठीक आठ दिन के रूप में प्रस्तुत नहीं किया गया।
- source_word: παραλαβὼν
  choice: अपने साथ लेकर
  rationale: यह कृदंत साथ ले जाने का भाव देता है और मुख्य क्रिया के साथ जुड़ा है। हिन्दी में ‘अपने साथ लेकर’ इस संबंध को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: पतरस, यूहन्ना और याकूब
  rationale: नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं। हिन्दी सूची-रचना के अनुसार अंतिम नाम से पहले ‘और’ रखा गया है।
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: पहाड़ पर चढ़ गए
  rationale: ἀνέβη ऊपर जाने या चढ़ने की गति व्यक्त करता है। ‘पहाड़ पर चढ़ गए’ हिन्दी में स्वाभाविक है और किसी ऐसे खास पहाड़ की पहचान नहीं कराता जिसका नाम पाठ में नहीं दिया गया।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने
  rationale: 'अनन्त क्रिया यहाँ उद्देश्य बताती है: पहाड़ पर चढ़ने का उद्देश्य प्रार्थना करना था।'
- source_word: implicit subject of παραλαβὼν / ἀνέβη
  choice: यीशु
  rationale: यूनानी में कर्ता पूर्ववर्ती संदर्भ से समझा जाता है। हिन्दी में वाक्य को स्वतंत्र रूप से स्पष्ट और सहज बनाने के लिए संदर्भगत कर्ता ‘यीशु’ व्यक्त किया गया है।
theological_decisions:
- issue: समानांतर सुसमाचार-वृत्तांतों के संबंध में समय की गणना
  choice: लगभग आठ दिन
  alternative: आठ दिन; छः दिन से सामंजस्य बैठाना
  rationale: लूका के पाठ में ὡσεὶ स्पष्ट रूप से अनुमान का संकेत देता है। अनुवाद इसी अनुमान को बनाए रखता है और अन्य वृत्तांतों से संख्या का मौन सामंजस्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। यीशु के लिए आदरसूचक बहुवचन क्रिया ‘चढ़ गए’ प्रयुक्त हुई है। अत्यधिक संस्कृतनिष्ठ ‘वचन’ के स्थान पर मुख्य पाठ में सामान्य ‘बातों’ रखा गया है, जबकि निकटतर वैकल्पिक रूप पादटिप्पणी में दिया गया है।
