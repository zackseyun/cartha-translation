  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: hi
  text: क्योंकि मनुष्य को क्या लाभ होता है, यदि वह सारे संसार को पा ले, पर अपने आपको[a] खो दे या अपनी ही हानि उठाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने जीवन को” अथवा “अपनी आत्मा को।” यूनानी में शाब्दिक रूप से “अपने आप को” है; यहाँ “जीवन” या “आत्मा” के लिए सामान्य शब्द नहीं, बल्कि आत्मवाचक सर्वनाम आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: क्योंकि ... क्या लाभ होता है
  rationale: ‘क्या लाभ’ अलंकारिक प्रश्न में ὠφελεῖται के लाभ या फ़ायदे के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘क्योंकि’ γὰρ के पिछले कथन को आधार देने वाले संबंध को बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधि मानव व्यक्ति की बात है। ‘मनुष्य’ यूनानी के सामान्य मानवीय अर्थ को गरिमापूर्ण और सहज हिन्दी में रखता है।
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: यदि वह सारे संसार को पा ले
  rationale: कृदन्त की काल्पनिक परिस्थिति को हिन्दी में ‘यदि’ से स्पष्ट और स्वाभाविक बनाया गया है; ‘सारे संसार’ मूल पदबंध की व्यापकता बनाए रखता है।
- source_word: ἑαυτόν
  choice: अपने आप को
  rationale: मूल में आत्मवाचक सर्वनाम है, ‘प्राण’ या ‘आत्मा’ के लिए विशिष्ट संज्ञा नहीं। इसलिए व्यापक अर्थ को संकुचित किए बिना सीधा आत्मवाचक अनुवाद किया गया है।
- source_word: ἀπολέσας
  choice: खो दे
  rationale: यहाँ अपने अस्तित्व या स्वयं को गँवा देने के भाव को सरल और सटीक रूप से व्यक्त करता है।
- source_word: ζημιωθείς
  choice: स्वयं हानि उठाए
  rationale: निष्क्रिय कृदन्त में हानि सहने या नुकसान उठाने का भाव है। यह ‘खो दे’ से संबंधित किंतु अलग छाया को बनाए रखता है।
theological_decisions:
- issue: ἑαυτόν का मनुष्य के अंतिम परिणाम से संबंध
  choice: अपने आप को
  alternative: अपने प्राण को / अपनी आत्मा को
  rationale: मूल यूनानी पाठ ψυχή के बजाय आत्मवाचक सर्वनाम इस्तेमाल करता है। ‘अपने आप को’ व्यक्ति की संपूर्ण सत्ता की व्यापकता और पाठ की धार्मिक अर्थ-तनाव को सुरक्षित रखता है।
- issue: ἀπολέσας और ζημιωθείς के बीच संबंध
  choice: खो दे या स्वयं हानि उठाए
  alternative: नष्ट कर दे या नाश हो जाए
  rationale: ‘या’ दोनों अभिव्यक्तियों का भेद बनाए रखता है, जबकि अनुवाद हानि के स्वरूप या अंतिम अवस्था को आवश्यकता से अधिक निर्धारित नहीं करता।
