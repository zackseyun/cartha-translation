source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: hi
  text: अगले दिन[a], जब वे पहाड़ से नीचे उतर आए, तो एक बड़ी भीड़ उससे आ मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके अगले दिन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: तो
  rationale: यह यूनानी मुहावरा कथा में संक्रमण कराता है; हिन्दी में मुख्य वाक्य से पहले ‘तो’ प्रसंग का स्वाभाविक संबंध दिखाता है, बिना अलग से ‘ऐसा हुआ’ जोड़कर अभिव्यक्ति को भारी बनाए।
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: अगले दिन
  rationale: यह कालवाचक पद अगले अथवा उसके बाद आने वाले दिन को दर्शाता है; ‘अगले दिन’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: κατελθόντων αὐτῶν
  choice: जब वे ... नीचे उतर आए
  rationale: संबंधविहीन षष्ठी कृदंत मुख्य घटना की पृष्ठभूमि बताता है। ‘उतर आए’ मुख्य क्रिया से पहले पूरी हुई क्रिया का स्वाभाविक हिन्दी संकेत देता है।
- source_word: ἀπὸ τοῦ ὄρους
  choice: पहाड़ से
  rationale: ὄρος के लिए इस प्रसंग में ‘पहाड़’ सामान्य, स्पष्ट और उपयुक्त हिन्दी शब्द है।
- source_word: συνήντησεν αὐτῷ
  choice: उससे आ मिली
  rationale: क्रिया मिलने अथवा मिलने के लिए सामने आने का अर्थ रखती है। भीड़ के लिए एकवचन स्त्रीलिंग क्रिया हिन्दी व्याकरण के अनुरूप है, और ‘आ मिली’ गति सहित भेंट होने का भाव सुरक्षित रखता है।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: यह पद भीड़ के बड़े आकार को बताता है; ‘एक बड़ी भीड़’ सहज आधुनिक हिन्दी है।
theological_decisions: []
