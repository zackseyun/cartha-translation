  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: hi
  text: और देखो, दो पुरुष उससे बातचीत कर रहे थे। वे मूसा और एलिय्याह थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह शब्द अचानक ध्यान खींचने और दृश्य को सजीव बनाने वाला लूका का कथात्मक संकेत है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और स्पष्ट है।
- source_word: ἄνδρες δύο
  choice: दो पुरुष
  rationale: ἀνήρ यहाँ दो पहचाने जाने योग्य पुरुष व्यक्तियों, मूसा और एलिय्याह, के लिए प्रयुक्त है; ‘दो पुरुष’ अर्थ को ठीक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: συνελάλουν
  choice: बातचीत कर रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दर्शाता है, और συλλαλέω परस्पर बातचीत का भाव रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: συλλαλέω के साथ संप्रदान कारक उस व्यक्ति को बताता है जिसके साथ बातचीत हो रही थी; हिन्दी में ‘उससे बातचीत’ स्वाभाविक पारस्परिक अर्थ देता है।
- source_word: οἵτινες
  choice: वे ... थे
  rationale: यह सम्बन्धवाचक सर्वनाम उन दोनों पुरुषों की पहचान बताता है। हिन्दी में अलग वाक्य ‘वे मूसा और एलिय्याह थे’ अधिक स्वाभाविक है और बिना अतिरिक्त बल जोड़े वही पहचान सुरक्षित रखता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: इस बाइबलीय नाम का मानक हिन्दी रूप।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: इब्रानी भविष्यद्वक्ता के नाम का प्रचलित और पहचानने योग्य हिन्दी रूप।
theological_decisions:
- issue: रूपान्तरण के समय दिखाई देने वाले दो व्यक्तियों की पहचान
  choice: पाठ दोनों पुरुषों की सीधी पहचान मूसा और एलिय्याह के रूप में करता है।
  alternative: उनकी प्रतीकात्मक या युगान्त-संबंधी भूमिका की व्याख्या जोड़ना।
  rationale: मूल पाठ केवल उनकी पहचान बताता है; इसलिए अनुवाद किसी अतिरिक्त प्रतीकात्मक या धर्मवैज्ञानिक अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, सजीव और गरिमापूर्ण कथात्मक शैली। ‘देखो’ ध्यानाकर्षक संकेत को बनाए रखता है, जबकि दो छोटे वाक्य हिन्दी में स्वाभाविक प्रवाह देते हैं।
