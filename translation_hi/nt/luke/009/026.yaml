id: LUK.9.26
reference: Luke 9:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: hi
  text: क्योंकि जो कोई मुझसे और मेरे वचनों से लज्जित होगा, उससे[a] मनुष्य का पुत्र भी उस समय लज्जित होगा, जब वह अपनी महिमा में और पिता तथा पवित्र स्वर्गदूतों की महिमा में आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उस व्यक्ति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: क्योंकि जो कोई
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और ὃς ... ἄν का सामान्य, अनिश्चित भाव ‘जो कोई’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: लज्जित होगा ... लज्जित होगा
  rationale: एक ही क्रिया की पारस्परिक पुनरावृत्ति बनाए रखी गई है; ‘अस्वीकार करेगा’ जैसे विकल्प मूल के अर्थ से अधिक व्याख्यात्मक होते।
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: मुझसे और मेरे वचनों से
  rationale: हिन्दी में ‘किसी से लज्जित होना’ स्वाभाविक है; ‘वचन’ λόγους को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τοῦτον
  choice: उससे
  rationale: यह पहले आए ‘जो कोई’ की ओर संकेत करता है। हिन्दी का एकवचन ‘उससे’ मूल के संकेतवाचक संबंध को स्वाभाविक रूप में रखता है और अनावश्यक लैंगिक विशिष्टता से बचता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह पदवी का स्थापित और पारदर्शी रूप है तथा उसके शास्त्रीय अंतर्पाठीय संबंधों को बनाए रखता है।
- source_word: ὅταν ἔλθῃ
  choice: जब वह ... आएगा
  rationale: ὅταν और एओरिस्ट सब्जंक्टिव का भावी कालगत अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: अपनी महिमा में और पिता तथा पवित्र स्वर्गदूतों की महिमा में
  rationale: मूल में ἐν केवल एक बार है और δόξῃ के साथ बाद के संबंधकारक जुड़े हैं। हिन्दी में स्पष्टता के लिए दूसरे ‘महिमा में’ की पूर्ति की गई है, जबकि वाक्यरचना की वास्तविक सम्भावना फुटनोट में सुरक्षित है।
- source_word: τῶν ἁγίων ἀγγέλων
  choice: पवित्र स्वर्गदूतों
  rationale: ‘स्वर्गदूत’ सामान्य हिन्दी बाइबलीय शब्दावली में ἄγγελοι का स्पष्ट रूप है और ‘पवित्र’ उनके विशेषण को सीधे बनाए रखता है।
theological_decisions:
- issue: लज्जित होने की पारस्परिक चेतावनी
  choice: ‘लज्जित होगा’ को दोनों स्थानों पर समान रखा गया
  alternative: दूसरे स्थान पर ‘अस्वीकार करेगा’ या ‘अपना मानने से इनकार करेगा’
  rationale: समान यूनानी क्रिया की पुनरावृत्ति इस कथन की पारस्परिकता को उभारती है। अधिक कठोर विकल्प संभावित परिणाम की व्याख्या करते, पर मूल शब्द से आगे जाते।
- issue: मनुष्य के पुत्र, पिता और पवित्र स्वर्गदूतों की महिमा
  choice: ‘अपनी महिमा में और पिता तथा पवित्र स्वर्गदूतों की महिमा में’
  alternative: ‘अपनी, पिता की और पवित्र स्वर्गदूतों की महिमा में’
  rationale: चुना हुआ रूप पुत्र की अपनी महिमा और पिता तथा स्वर्गदूतों से संबद्ध महिमा दोनों को स्पष्ट रखता है, बिना इस संबंध की धर्मवैज्ञानिक प्रकृति को मूल से अधिक परिभाषित किए।
- issue: τοῦτον का संकेतवाचक और प्रतिनिधिक बल
  choice: ‘उससे’
  alternative: ‘उस व्यक्ति से’ या पुल्लिंग-विशिष्ट ‘उस पुरुष से’
  rationale: ‘उससे’ एकवचन संकेत को बनाए रखता है और चेतावनी के सार्वभौमिक दायरे को स्वाभाविक हिन्दी में व्यक्त करता है; मूल का व्याकरणिक पुल्लिंग स्त्रियों को दायरे से बाहर नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘वचन’, ‘मनुष्य का पुत्र’ और ‘पवित्र स्वर्गदूत’ परिचित बाइबलीय शब्द हैं; वाक्य को अनावश्यक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट नहीं बनाया गया।
