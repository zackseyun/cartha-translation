  rationale: ἀνά संख्या के साथ वितरण का भाव देता है; हिन्दी में संख्या की पुनरुक्ति इस भाव को सहजता से व्यक्त करती है।
- source_word: γὰρ ... δὲ
  choice: क्योंकि ... तब
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को बनाए रखता है, जबकि ‘तब’ δέ के कथात्मक संक्रमण को सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: अपने चेलों से
  rationale: αὐτοῦ का संबंध यीशु से है; हिन्दी का निजवाचक ‘अपने’ स्वामित्व को स्वाभाविक रूप से बनाए रखता है।
