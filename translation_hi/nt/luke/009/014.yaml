  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: hi
  text: क्योंकि वहाँ लगभग पाँच हज़ार पुरुष[a] थे। तब उसने अपने चेलों से कहा, “उन्हें लगभग पचास-पचास के समूहों में बैठा दो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘पुरुष’ अर्थात वयस्क पुरुषों के लिए शब्द है; यह संख्या पूरे जनसमूह की नहीं, विशेष रूप से पुरुषों की है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन्हें लगभग पचास-पचास के समूहों में टिककर बैठने दो।’ यूनानी क्रिया भोजन के लिए टिककर या लेटकर बैठने का विशेष संकेत देती है।
    reason: lexical_alternative
