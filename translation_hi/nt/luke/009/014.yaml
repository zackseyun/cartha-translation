- source_word: πεντακισχίλιοι
  choice: पाँच हज़ार
  rationale: यह ‘पुरुष’ की संख्या बताने वाली सीधी संख्या है।
- source_word: Κατακλίνατε
  choice: भोजन के लिए बैठा दो
  rationale: क्रिया का अर्थ किसी को भोजन के लिए टिककर बैठने अथवा लेटने की मुद्रा में लगाना है। आधुनिक हिन्दी में ‘भोजन के लिए बैठा दो’ उस प्रसंगगत भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κλισίας
  choice: समूहों में
  rationale: बहुवचन संज्ञा व्यवस्थित टोलियों या समूहों को सूचित करती है; ‘समूहों में’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀνὰ πεντήκοντα
