reference: Luke 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: hi
  text: पर हेरोदेस ने कहा, “यूहन्ना का सिर तो मैंने कटवाया; पर यह कौन है, जिसके विषय में मैं ऐसी बातें सुन रहा हूँ?” और वह उसे देखने का प्रयत्न करता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह उसे देखने की कोशिश में था।” यूनानी अपूर्ण भूतकाल जारी या बार-बार किए गए प्रयत्न का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले वृत्तांत से जुड़े रहते हुए हेरोदेस की प्रतिक्रिया और उसके असमंजस की ओर हल्का विरोधात्मक मोड़ दिखाता है।
- source_word: Ἡρῴδης
  choice: हेरोदेस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ἐγὼ
  choice: तो मैंने
  rationale: स्पष्ट सर्वनाम के बल को ‘तो मैंने’ से व्यक्त किया गया है, जिससे यूहन्ना के विषय में हेरोदेस का अपना दावा और इस अज्ञात व्यक्ति से उसका भेद उभरता है।
- source_word: ἀπεκεφάλισα
  choice: सिर कटवाया
  rationale: क्रिया विशेष रूप से सिर काटकर मारने को दर्शाती है। हिन्दी में ‘कटवाया’ स्वाभाविक रूप से हेरोदेस द्वारा कराए गए वध को व्यक्त करता है, बिना यह संकेत दिए कि उसने स्वयं अपने हाथ से सिर काटा।
- source_word: τίς ... ἐστιν οὗτος
  choice: यह कौन है
  rationale: मूल प्रश्न की संक्षिप्तता और हेरोदेस के विस्मय तथा दूरी के भाव को बनाए रखता है; ‘मनुष्य’ जैसा कोई अनकहा शब्द नहीं जोड़ा गया।
- source_word: περὶ οὗ
  choice: जिसके विषय में
  rationale: किसी व्यक्ति के संबंध में सुनी जा रही बातों के लिए περί के संबंधवाचक प्रयोग का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀκούω
  choice: मैं ... सुन रहा हूँ
  rationale: वर्तमान काल को प्रसंगानुकूल चालू सुनवाई के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοιαῦτα
  choice: ऐसी बातें
  rationale: यूनानी अभिव्यक्ति की व्यापकता बनाए रखता है और ‘समाचार’ या ‘चमत्कार’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: ἐζήτει
  choice: प्रयत्न करता रहा
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδεῖν
  choice: देखने
  rationale: क्रिया का सीधा अर्थ रखा गया है; ‘मिलने’ जैसा संदर्भगत पर अधिक व्याख्यात्मक अर्थ नहीं अपनाया गया।
- source_word: αὐτόν
  choice: उसे
  rationale: संदर्भ में यीशु की ओर संकेत करने वाला सामान्य हिन्दी सर्वनाम है।
theological_decisions:
- issue: यूहन्ना के वध के विषय में हेरोदेस का कथन और यीशु को लेकर उसकी जिज्ञासा
  choice: इसे सीधे ऐतिहासिक कथन और प्रश्न के रूप में रखा गया है।
  alternative: यह स्पष्ट जोड़ना कि हेरोदेस को भय था कि यूहन्ना जी उठा है।
  rationale: पूर्ववर्ती प्रसंग हेरोदेस का असमंजस बताता है, पर यह पद केवल यूहन्ना का सिर कटवाने के उसके कथन, अज्ञात व्यक्ति के विषय में उसके प्रश्न और उसे देखने के प्रयत्न को व्यक्त करता है। अनुवाद पुनरुत्थान या पहचान संबंधी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तो मैंने’ मूल के बलाघात को व्यक्त करता है, जबकि ‘सिर कटवाया’ हिन्दी में शासक द्वारा कराए गए शिरच्छेद का स्वाभाविक वर्णन है।
