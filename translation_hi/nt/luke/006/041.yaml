id: LUK.6.41
reference: Luke 6:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: hi
  text: पर तुम अपने भाई की आँख में पड़े तिनके को क्यों देखते हो, लेकिन अपनी ही आँख में पड़े शहतीर को ध्यान से नहीं देखते? [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तिनके” के लिए “फाँस” या “छोटा सूखा कण” भी सम्भव है; यूनानी κάρφος एक बहुत छोटी वस्तु को सूचित करता है, जिसका बड़े शहतीर के साथ विरोध किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “भाई” यूनानी के पुल्लिंग एकवचन शब्द का अनुवाद है; यह शिक्षा केवल पुरुष सहोदर तक सीमित नहीं, बल्कि अधिक व्यापक रूप से लागू होती है।
    reason: cultural_note
lexical_decisions:
- source_word: τί δὲ
  choice: पर ... क्यों
  rationale: यहाँ τί प्रश्नवाचक होकर चुनौतीपूर्ण कारणसूचक अर्थ देता है—‘क्यों’; δέ पिछले कथन से हल्का विरोध जोड़ता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: βλέπεις
  choice: देखता है
  rationale: साधारण दृश्य क्रिया को बनाए रखता है और आँख से जुड़े रूपक को प्रत्यक्ष रखता है।
- source_word: κάρφος
  choice: तिनका
  rationale: κάρφος किसी छोटे सूखे कण, तिनके या फाँस को सूचित कर सकता है। ‘तिनका’ आधुनिक हिन्दी में स्वाभाविक है और बड़े शहतीर के साथ अतिशयोक्तिपूर्ण विरोध स्पष्ट करता है।
- source_word: ἀδελφοῦ
  choice: भाई
  rationale: यूनानी पाठ के पुल्लिंग एकवचन संबंधवाचक शब्द को यथावत रखता है; व्यापक अनुप्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δοκόν
  choice: शहतीर
  rationale: δοκός भवन में प्रयुक्त लकड़ी की बड़ी धरन है। ‘शहतीर’ छोटे तिनके के विपरीत उसके विशाल आकार और संरचनात्मक अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἰδίῳ
  choice: अपनी ही
  rationale: ἴδιος में निहित स्वामित्व और जोर को व्यक्त करता है तथा भाई की आँख के साथ तीखा विरोध बनाता है।
- source_word: οὐ κατανοεῖς
  choice: ध्यान नहीं देता
  rationale: κατανοέω केवल देखने से आगे सावधानी से गौर करने या समझने का भाव रखता है; यह अनदेखी की विडंबना को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀδελφοῦ का लिंगयुक्त संबंधवाचक अर्थ
  choice: भाई
  alternative: भाई या बहन; संगी विश्वासी
  rationale: मूल पाठ पुल्लिंग एकवचन में एक प्रतिनिधिक नैतिक चित्र प्रस्तुत करता है। अनुवाद उस रूप को बनाए रखता है, पर पादटिप्पणी बताती है कि शिक्षा केवल सगे पुरुष भाई तक सीमित नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तू’ यीशु के प्रत्यक्ष, एकवचन और चुनौतीपूर्ण संबोधन को बनाए रखता है। ‘पड़े’ को दोनों आँख-संबंधी वाक्यांशों में जोड़कर हिन्दी की स्वाभाविकता और दृश्य स्पष्टता बढ़ाई गई है। ‘शहतीर’ सटीक है; इसलिए उसके लिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
