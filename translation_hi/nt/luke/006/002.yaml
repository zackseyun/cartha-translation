  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: hi
  text: पर कुछ फरीसियों ने कहा, “तुम वह काम क्यों कर रहे हो जो सब्त के दिन[a] करना अनुमत नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “सब्तों में” है; यह “सब्त के दिन” कहने का एक सामान्य मुहावरा था।
    reason: स्रोत के बहुवचन रूप और उसके मुहावरेदार एकवचन अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: τινὲς
  choice: कुछ
  rationale: यह अनिश्चित बहुवचन फरीसियों के पूरे समूह को नहीं, उसके कुछ सदस्यों को सूचित करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले वर्णन से हल्का विरोध और विवाद की ओर कथात्मक मोड़ दिखाता है।
- source_word: Φαρισαίων
  choice: फरीसियों
  rationale: इस यहूदी धार्मिक समूह के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Τί ποιεῖτε
  choice: तुम ... क्यों कर रहे हो
  rationale: शाब्दिक रूप से प्रश्नवाचक शब्द 'क्या' है, पर इस चुनौतीपूर्ण वाक्य-विन्यास में प्रश्न का स्वाभाविक अर्थ कारण पूछना है; वर्तमान काल तत्काल चल रही क्रिया को दर्शाता है।
- source_word: ὃ οὐκ ἔξεστιν
  choice: वह काम ... जो ... करना उचित नहीं है
  rationale: यह उस कार्य की ओर संकेत करता है जिसे व्यवस्था या मान्य धार्मिक नियम के अनुसार अनुमत नहीं माना गया; 'उचित नहीं' हिन्दी में आरोप का विधि-धार्मिक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी बहुवचन यहाँ सब्त के लिए प्रचलित मुहावरेदार प्रयोग है। हिन्दी में एक विशेष साप्ताहिक दिन के लिए 'सब्त के दिन' सहज और अर्थ-सटीक है; स्रोत का बहुवचन पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: सब्त-संबंधी बहुवचन का अनुवाद
  choice: सब्त के दिन
  alternative: सब्त के दिनों में
  rationale: τοῖς σάββασιν रूपतः बहुवचन है, पर सब्त के दिन के लिए यह सामान्य यूनानी मुहावरा है। प्रसंग में उसी समय की एक घटना पर आपत्ति की जा रही है, इसलिए हिन्दी में स्वाभाविक एकवचन रखा गया और रूपगत जानकारी पादटिप्पणी में दी गई।
translation_notes:
