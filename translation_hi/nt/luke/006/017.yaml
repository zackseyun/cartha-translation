reference: Luke 6:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: hi
  text: और वह उनके साथ नीचे उतरकर एक समतल स्थान[a] पर खड़ा हुआ। वहाँ उसके शिष्यों की एक बड़ी भीड़ थी और सारे यहूदिया, यरूशलेम तथा सूर और सैदा के समुद्रतटीय क्षेत्र से आए लोगों का एक बड़ा जनसमूह भी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक मैदान में।” यूनानी वाक्यांश का शाब्दिक अर्थ “एक समतल स्थान पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: नीचे उतरकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले या उसके साथ हुई नीचे की ओर गति व्यक्त करता है। ‘नीचे उतरकर’ आधुनिक हिन्दी में स्वाभाविक है और दिशा को स्पष्ट रखता है।
- source_word: ἔστη
  choice: खड़ा हुआ
  rationale: यहाँ ἵστημι का अओरिस्ट खड़े होने या स्थान ग्रहण करने को दर्शाता है। ‘खड़ा हुआ’ कथा-क्रम के अनुरूप सीधा अनुवाद है।
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: एक समतल स्थान पर
  rationale: τόπος का अर्थ ‘स्थान’ और πεδινός का अर्थ ‘समतल’ है। यह अनुवाद भू-आकृति को व्यक्त करता है, पर इसे अनिवार्यतः विस्तृत मैदान नहीं मानता।
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: उसके शिष्यों की एक बड़ी भीड़
  rationale: ὄχλος ‘भीड़’ और πολύς उसके बड़े आकार को दर्शाता है; संबंधकारक पद बताता है कि भीड़ उसके शिष्यों से बनी थी।
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: लोगों का एक बड़ा जनसमूह
  rationale: πλῆθος बड़ी संख्या या जनसमूह पर बल देता है। ‘लोगों’ से व्यापक जनता का संकेत मिलता है, जिसे शिष्यों की भीड़ से अलग बताया गया है।
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: सारे यहूदिया से
  rationale: πάσης क्षेत्र की व्यापकता व्यक्त करता है; ‘सारे यहूदिया से’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: सूर और सैदा के समुद्रतटीय क्षेत्र से
  rationale: παράλιος समुद्र के किनारे स्थित तटीय भूभाग को दर्शाता है। यह चयन दोनों नगरों से जुड़े तटीय क्षेत्र का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: उपदेश के स्थल से संबंधित स्थलाकृतिक शब्दावली
  choice: एक समतल स्थान पर
  alternative: एक मैदान में
  rationale: यूनानी पद का निकटतम अर्थ ‘समतल स्थान’ है। इससे लूका के कथन को मत्ती के पहाड़ी परिवेश से न तो कृत्रिम रूप से मिलाया जाता है, न उसके साथ अनावश्यक विरोध खड़ा किया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी में निहित ‘से आए’ संबंध को स्वाभाविक हिन्दी के लिए स्पष्ट किया गया है; इससे नई सूचना नहीं जोड़ी जाती। दोनों समूहों—शिष्यों की भीड़ और व्यापक जनता—का भेद बनाए रखा गया है।
