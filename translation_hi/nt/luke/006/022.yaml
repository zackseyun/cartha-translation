source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: hi
  text: जब लोग मनुष्य के पुत्र के कारण तुमसे घृणा करें, तुम्हें अपने बीच से निकाल दें, तुम्हारा अपमान करें और तुम्हारे नाम को बुरा ठहराकर ठुकरा दें[a], तब तुम धन्य हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे नाम को बुरा मानकर अस्वीकार कर दें”; अर्थात वे तुम्हें नैतिक रूप से बुरा ठहराकर सार्वजनिक रूप से तुम्हारी निन्दा करें या तुम्हें अस्वीकार कर दें।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: धन्य
  rationale: यह यीशु के धन्य-वचन की परिचित, गरिमापूर्ण भाषा और μακάριος के धार्मिक आशय को बनाए रखता है; ‘सुखी’ इसे केवल भावनात्मक बना सकता है।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यहाँ शब्द सामान्य रूप से समाज के लोगों को दर्शाता है, केवल पुरुषों को नहीं।
- source_word: ἀφορίσωσιν
  choice: अपने बीच से निकाल दें
  rationale: सामाजिक या सामुदायिक बहिष्कार का आशय सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ὀνειδίσωσιν
  choice: अपमान करें
  rationale: मौखिक निन्दा और तिरस्कार को स्वाभाविक, सुलभ हिन्दी में व्यक्त करता है।
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: तुम्हारे नाम को बुरा ठहराकर ठुकरा दें
  rationale: नाम/प्रतिष्ठा को दुष्ट मानकर सार्वजनिक रूप से अस्वीकार करने का आशय रखता है और यूनानी मुहावरे की कुछ असामान्यता भी बचाता है।
- source_word: ἕνεκα
  choice: के कारण
  rationale: यहाँ उत्पीड़न का कारण बताने वाला सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस स्थापित उपाधि और उसके सुसमाचारी तथा दानिय्येली संकेतों को बनाए रखता है।
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν का मुहावरा
  choice: तुम्हारे नाम को बुरा ठहराकर ठुकरा दें
  alternative: तुम्हारी बदनामी करें कि तुम बुरे हो
  rationale: मुख्य पाठ ‘नाम’ को बनाए रखता है और नैतिक रूप से बुरा घोषित करके अस्वीकार करने के सामाजिक आशय को व्यक्त करता है, बिना सार्वजनिक निन्दा की सटीक रीति तय किए।
- issue: οἱ ἄνθρωποι का सामान्य अर्थ
  choice: लोग
  alternative: मनुष्य
  rationale: सन्दर्भ सभी सामाजिक विरोधियों की ओर है, केवल पुरुषों की ओर नहीं।
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου की उपाधि
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: परिचित बाइबिलीय उपाधि मूल संरचना और उसके व्यापक अन्तरपाठीय अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। वाक्य को हिन्दी की स्वाभाविक कारण–परिस्थिति–निष्कर्ष संरचना में रखा गया है। ‘धन्य’ धन्य-वचन की धार्मिक शैली बनाए रखता है।
