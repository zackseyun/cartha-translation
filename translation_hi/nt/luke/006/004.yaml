source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: hi
  text: कि वह कैसे परमेश्वर के भवन में प्रवेश किया और उपस्थिति की रोटियाँ[a] लेकर खाईं, और जो उसके साथ थे उन्हें दीं—जिन्हें केवल याजक ही विधिसम्मत रूप से खा सकते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भेंट की रोटियाँ’; शाब्दिक अर्थ, ‘सामने रखी हुई रोटियाँ।’ ये परमेश्वर की उपस्थिति में रखी जाने वाली पवित्र रोटियाँ थीं। परम्परागत रूप से इन्हें ‘दर्शन की रोटियाँ’ भी कहा जाता है।
    reason: ἄρτους τῆς προθέσεως के वैकल्पिक प्रचलित अनुवाद, उसके शाब्दिक अर्थ और पारम्परिक पदनाम को बताना।
lexical_decisions:
- source_word: ὡς
  choice: कि वह कैसे
  rationale: यहाँ ὡς पिछले पद में दाऊद के कार्य के विषय में आरम्भ हुए अप्रत्यक्ष प्रश्न को आगे बढ़ाता है; ‘कैसे’ उसके किए हुए कार्य का विवरण प्रस्तुत करता है।
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: परमेश्वर के भवन में गया
  rationale: ‘परमेश्वर का भवन’ οἶκος τοῦ θεοῦ का सीधा और स्वाभाविक रूप है तथा मूल शास्त्रीय प्रसंग की शब्दावली को ‘मन्दिर’ कहकर सीमित नहीं करता।
- source_word: ἄρτους τῆς προθέσεως
  choice: भेंट की रोटियाँ
  rationale: यह उन पवित्र रोटियों को सूचित करता है जिन्हें परमेश्वर के सामने रखा जाता था। ‘भेंट की रोटियाँ’ आधुनिक हिन्दी में समझने योग्य है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: λαβὼν ἔφαγεν
  choice: लेकर खाईं
  rationale: कृदन्त और मुख्य क्रिया का क्रम हिन्दी में स्वाभाविक रूप से सुरक्षित रहता है; बहुवचन ‘रोटियाँ’ के अनुसार ‘खाईं’ रखा गया है।
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: जो उसके साथ थे उन्हें भी दीं
  rationale: यह τοῖς μετ’ αὐτοῦ को बिना ‘साथी’ जैसे अतिरिक्त संबंध-सूचक अर्थ के व्यक्त करता है। ‘भी’ καί के योगात्मक बल को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: जिन्हें याजकों को छोड़ किसी और का खाना विधिसम्मत नहीं है
  rationale: ‘विधिसम्मत नहीं’ धार्मिक-कानूनी अनुमति के भाव को बनाए रखता है, और ‘याजकों को छोड़ किसी और’ εἰ μὴ μόνους की विशिष्टता स्पष्ट करता है।
theological_decisions:
- issue: पवित्र रोटियों पर याजकीय प्रतिबंध
  choice: विधिसम्मत नहीं है
  alternative: अनुमति नहीं है
  rationale: वचन केवल सामान्य अनुमति या सामाजिक रीति की बात नहीं करता, बल्कि इस्राएल की उपासना-व्यवस्था में मान्य धार्मिक-कानूनी सीमा की ओर संकेत करता है। ‘विधिसम्मत’ उस तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘विधिसम्मत’ अपेक्षाकृत औपचारिक है, पर यहाँ धार्मिक-कानूनी आशय को सटीक रूप से व्यक्त करता है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरम्भ में ‘कि वह कैसे’ रखा गया है।
