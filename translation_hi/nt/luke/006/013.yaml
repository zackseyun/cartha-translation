  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: hi
  text: और जब दिन हुआ, तो उसने अपने चेलों को अपने पास बुलाया[a] और उनमें से बारह को चुना, और उन्हें प्रेरित भी कहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने चेलों को पुकारा” अथवा “अपने चेलों को संबोधित किया।” यूनानी क्रिया में ये अर्थ संभव हैं, पर यहाँ बारह को चुनने के लिए उन्हें अपने पास बुलाने का अर्थ संदर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें उसने प्रेरित नाम दिया।” यूनानी क्रिया का अर्थ किसी को नाम देना या किसी नाम से पुकारना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: जब दिन हुआ
  rationale: यह यूनानी कालवाचक वाक्यांश का स्वाभाविक और निकट हिन्दी रूप है; इससे रात के बाद दिन होने का भाव बना रहता है।
- source_word: προσεφώνησεν
  choice: अपने पास बुलाया
  rationale: क्रिया का अर्थ पुकारना, संबोधित करना, या पास बुलाना हो सकता है। यहाँ आगे शिष्यों में से बारह को चुनने का प्रसंग है, इसलिए एकत्र करने के लिए अपने पास बुलाने का अर्थ सबसे उपयुक्त है।
- source_word: μαθητὰς
  choice: चेलों
  rationale: सुसमाचारों के संदर्भ में μαθητής के लिए ‘चेला’ सहज, प्रचलित और संबंधपरक शिक्षा का भाव रखने वाला शब्द है।
- source_word: ἐκλεξάμενος
  choice: चुना
  rationale: यह सरल और स्वाभाविक हिन्दी है तथा बड़े समूह में से विचारपूर्वक चयन करने का भाव व्यक्त करता है।
- source_word: ἀπ’ αὐτῶν
  choice: उनमें से
  rationale: इससे स्पष्ट होता है कि बारह व्यक्तियों को चेलों के बड़े समूह में से चुना गया।
- source_word: δώδεκα
  choice: बारह
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: ἀποστόλους
  choice: प्रेरित
  rationale: यह यीशु द्वारा बारह को दी गई विशिष्ट पदवी के रूप में प्रयुक्त है। ‘प्रेरित’ हिन्दी बाइबल परंपरा में स्थापित शब्द है और यहाँ सामान्य ‘संदेशवाहक’ की अपेक्षा कथात्मक पदवी को बेहतर बनाए रखता है।
- source_word: ὠνόμασεν
  choice: नाम दिया
  rationale: क्रिया किसी नाम या पदवी से निर्दिष्ट करने का भाव देती है। ‘नाम दिया’ पहले प्रयुक्त ‘बुलाया’ से इसे स्पष्ट रूप से अलग रखता है।
theological_decisions:
- issue: ἀποστόλους को सामान्य अर्थ ‘भेजे हुए’ या स्थापित पदवी ‘प्रेरित’ के रूप में प्रस्तुत करना
  choice: प्रेरित
  alternative: भेजे हुए; संदेशवाहक
  rationale: इस पद में यह शब्द केवल किसी काम पर भेजे गए लोगों का सामान्य वर्णन नहीं, बल्कि बारह को यीशु द्वारा दी गई पदवी है। ‘प्रेरित’ उस उभरते विशिष्ट अर्थ को बनाए रखता है, बिना पद के भीतर अतिरिक्त कलीसियाई सिद्धांत जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चेला’ और ‘प्रेरित’ सुसमाचार-संदर्भ में प्रचलित शब्द हैं। उद्धरण-चिह्न यह स्पष्ट करते हैं कि ‘प्रेरित’ यहाँ दी गई पदवी है।
