  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: hi
  text: और जैसा तुम चाहते हो कि लोग तुम्हारे लिए[a] करें, तुम भी उनके लिए वैसा ही करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जैसा तुम इच्छा करते हो कि दूसरे तुम्हारे लिए करें, तुम भी उनके लिए वैसा ही करो।”
    reason: अंग्रेज़ी POB audit trail में दिए गए वैकल्पिक, अधिक औपचारिक ‘wish/others/do likewise’ रूप को बिना अर्थ बदले दर्शाता है।
lexical_decisions:
- source_word: καθὼς
  choice: जैसा
  rationale: यह तुलना का मानक प्रस्तुत करता है; ‘जैसा...वैसा’ हिन्दी में स्वाभाविक है और यूनानी वाक्य की तुलनात्मक संरचना बनाए रखता है।
- source_word: θέλετε
  choice: तुम चाहते हो
  rationale: यहाँ θέλω सामान्य इच्छा या अपेक्षा व्यक्त करता है; ‘चाहते हो’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἵνα
  choice: कि
  rationale: θέλετε के बाद ἵνα इच्छित बात की विषय-वस्तु बताता है; हिन्दी में ‘चाहते हो कि...’ इसका स्वाभाविक रूप है।
- source_word: ποιῶσιν
  choice: करें
  rationale: ποιέω का अर्थ व्यापक है। ‘करें’ इस व्यापकता को बनाए रखता है और पद में इसी क्रिया की पुनरावृत्ति को भी प्रतिबिंबित करता है।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यह शब्द यहाँ सभी मनुष्यों के लिए सामान्य रूप से प्रयुक्त है, केवल पुरुषों के लिए नहीं; ‘लोग’ आधुनिक हिन्दी में इसका सहज और लिंग-समावेशी समतुल्य है।
- source_word: ποιεῖτε
  choice: करो
  rationale: वर्तमानकालीन आज्ञार्थक नैतिक आचरण की आज्ञा देता है; हिन्दी का ‘करो’ इसे स्वाभाविक रूप से व्यक्त करता है, बिना क्रिया-पक्ष को अनावश्यक रूप से विस्तार दिए।
- source_word: αὐτοῖς
  choice: उनके साथ
  rationale: सन्दर्भ में बात दूसरों के प्रति किए जाने वाले व्यवहार की है। ‘उनके साथ’ हिन्दी में स्वाभाविक है और ὑμῖν के साथ पारस्परिक समानता स्पष्ट करता है।
- source_word: ὁμοίως
  choice: वैसा ही
  rationale: यह अनुरूप या समान कार्य को सूचित करता है; ‘जैसा...वैसा ही’ हिन्दी में संक्षिप्त और मुहावरेदार समानांतर संरचना है।
theological_decisions:
- issue: οἱ ἄνθρωποι का सामान्य मानवीय सन्दर्भ
  choice: लोग
  alternative: मनुष्य / पुरुष
  rationale: सन्दर्भ समस्त लोगों का है, केवल पुरुषों का नहीं। ‘लोग’ स्रोत के सामान्य और प्रतिनिधिक अर्थ को बिना किसी पुरुष-विशेष सीमा के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है और निकटवर्ती उपदेशात्मक शैली के अनुरूप है। ‘जैसा...वैसा ही’ मूल की तुलना और दोहराई गई ποιέω क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखता है।
