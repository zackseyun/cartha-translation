  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: hi
  text: चेला अपने गुरु से बढ़कर नहीं है, पर हर कोई, जब पूरी तरह प्रशिक्षित हो जाएगा[a], अपने गुरु के समान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसे पूरी तरह तैयार किया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: चेला
  rationale: ‘चेला’ गुरु से जुड़े हुए सीखने वाले व्यक्ति के संबंधपरक और गठनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘विद्यार्थी’ अधिक अकादमिक लग सकता है।
- source_word: ὑπὲρ
  choice: से बड़ा
  rationale: यहाँ ὑπέρ पद या श्रेष्ठता की तुलना बताता है; ‘से बड़ा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διδάσκαλος
  choice: गुरु
  rationale: ‘गुरु’ यहाँ शिक्षा देने वाले और चेले को गढ़ने वाले व्यक्ति के लिए स्वाभाविक है तथा μαθητής के लिए चुने गए ‘चेला’ के साथ उपयुक्त युग्म बनाता है।
- source_word: κατηρτισμένος
  choice: पूरी तरह प्रशिक्षित हो जाने पर
  rationale: पूर्ण कर्मवाच्य कृदन्त किसी व्यक्ति के तैयार, सुगठित या प्रशिक्षित किए जाने की पूर्ण अवस्था बताता है; शिक्षा के संदर्भ में यह चयन सबसे स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: πᾶς
  choice: हर कोई
  rationale: पुल्लिंग एकवचन रूप यहाँ सामान्य और व्यापक अर्थ रखता है; ‘हर कोई’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς
  choice: के समान
  rationale: यह तुलना सूचित करता है; ‘के समान’ कथन की गरिमा और स्पष्टता बनाए रखता है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: यह सर्वनाम प्रत्येक चेले के उसके अपने गुरु से संबंध को दर्शाता है; हिन्दी का ‘अपने’ स्रोत के एकवचन संबंध को सहज रूप से सुरक्षित रखता है।
theological_decisions:
- issue: चेले और गुरु के बीच तुलना का स्वरूप
  choice: ‘अपने गुरु के समान होगा’
  alternative: ‘अपने गुरु जितना होगा’
  rationale: ὡς समानता की तुलना करता है, अनिवार्यतः हर दृष्टि से बराबरी या पद की पूर्ण समानता नहीं; ‘के समान’ इस खुलेपन को सुरक्षित रखता है।
- issue: κατηρτισμένος का अर्थ
  choice: ‘पूरी तरह प्रशिक्षित हो जाने पर’
  alternative: ‘पूरी तरह तैयार/सुसज्जित किए जाने पर’
  rationale: चेले और गुरु के निकट संदर्भ में प्रशिक्षण प्रमुख अर्थ है, पर क्रिया का व्यापक अर्थ तैयार या सुयोग्य बनाए जाने को भी समेट सकता है; उसे पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘चेला–गुरु’ का पारंपरिक किन्तु आज भी बोधगम्य संबंधपरक युग्म चुना गया है। मुख्य पाठ में एक ही पादटिप्पणी-चिह्न [a] दिया गया है।
