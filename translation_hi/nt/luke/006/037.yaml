review_pass:
  verdict: revise
  source_fidelity: κρίνετε and καταδικάζετε are correctly distinguished as judging and condemning. The emphatic οὐ μή clauses and the passive results are retained. In this context, ἀπολύετε / ἀπολυθήσεσθε most naturally concern forgiving or releasing a person from a claim; the draft's bare “छोड़ दो / तुम्हें छोड़ दिया जाएगा” is too indeterminate in Hindi and can suggest abandonment rather than the intended relational release.
  naturalness: The parallel structure is clear, but “कदापि” is literary/archaic rather than modern standard Hindi, and the final “छोड़ दो” is unnatural without an object. “क्षमा करो” and “तुम्हें क्षमा किया जाएगा” are idiomatic and preserve the contextual sense.
  terminology: “दोषी ठहराना” appropriately renders the stronger καταδικάζω. “न्याय करना” is retained for κρίνω, while “क्षमा करना” is used contextually for ἀπολύω. A footnote preserves the broader lexical possibilities without making an unnatural literalism the main text.
  issues:
  - severity: medium
    issue: The main-text rendering “छोड़ दो, और तुम्हें छोड़ दिया जाएगा” is semantically underdetermined and idiomatically misleading in Hindi.
    rationale: Without an expressed object, “छोड़ दो” normally means to leave, abandon, or stop something. It does not naturally communicate releasing another person from a claim or forgiving them, which is the contextual force of ἀπολύω here.
  - severity: low
    issue: “कदापि” is not the most natural modern-standard Hindi expression of emphatic negation.
    rationale: “बिल्कुल नहीं” gives clear contemporary emphasis while avoiding an archaizing register.
  revised_text: न्याय न करो, और तुम्हारा न्याय बिल्कुल नहीं किया जाएगा; किसी को दोषी न ठहराओ, और तुम्हें बिल्कुल दोषी नहीं ठहराया जाएगा। क्षमा करो[a], और तुम्हें क्षमा किया जाएगा।
