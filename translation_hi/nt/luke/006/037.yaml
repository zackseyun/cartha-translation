- from: न्याय न करो, और तुम्हारा न्याय कदापि नहीं किया जाएगा; दोषी न ठहराओ, और तुम कदापि दोषी नहीं ठहराए जाओगे। छोड़ दो[a], और तुम्हें छोड़ दिया जाएगा।
  to: न्याय न करो, और तुम्हारा न्याय बिल्कुल नहीं किया जाएगा; किसी को दोषी न ठहराओ, और तुम्हें बिल्कुल दोषी नहीं ठहराया जाएगा। क्षमा करो[a], और तुम्हें क्षमा किया जाएगा।
  rationale: The revision replaces the potentially misleading literal Hindi “छोड़ दो” with the contextually natural “क्षमा करो.” The footnote preserves the Greek verb’s wider range, including release or setting free. “किसी को” makes the object of condemnation explicit for natural Hindi without altering the sense, and “बिल्कुल नहीं” conveys the emphatic οὐ μή in contemporary register.
