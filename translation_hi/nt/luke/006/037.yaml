source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: hi
  text: न्याय न करो, और तुम्हारा न्याय बिल्कुल नहीं किया जाएगा; किसी को दोषी न ठहराओ, और तुम्हें बिल्कुल दोषी नहीं ठहराया जाएगा। क्षमा करो[a], और तुम्हें क्षमा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुक्त कर दो, और तुम्हें मुक्त किया जाएगा।” यूनानी क्रिया का अर्थ “छोड़ना,” “मुक्त करना,” या “जाने देना” हो सकता है; इस प्रसंग में इसका अर्थ “क्षमा करना” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: न्याय न करो
  rationale: κρίνω के सामान्य अर्थ ‘न्याय करना/निर्णय देना’ को संक्षिप्त आज्ञार्थक रूप में रखता है और अगले अधिक प्रबल क्रिया-पद ‘दोषी ठहराना’ से भेद बनाए रखता है।
- source_word: οὐ μὴ κριθῆτε
  choice: तुम्हारा न्याय कदापि नहीं किया जाएगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कदापि नहीं’ व्यक्त करता है; कर्मवाच्य भी सुरक्षित रहता है।
- source_word: καταδικάζετε
  choice: दोषी न ठहराओ
  rationale: καταδικάζω केवल मूल्यांकन से बढ़कर प्रतिकूल निर्णय या दोषी घोषित करने का भाव रखता है; यह κρίνω से अर्थगत तीव्रता को बनाए रखता है।
- source_word: οὐ μὴ καταδικασθῆτε
  choice: तुम कदापि दोषी नहीं ठहराए जाओगे
  rationale: प्रबल निषेध और कर्मवाच्य दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπολύετε
  choice: छोड़ दो
  rationale: ἀπολύω की व्यापक अर्थ-सीमा—छोड़ना, मुक्त करना, जाने देना, अथवा प्रसंग में क्षमा करना—को ‘छोड़ दो’ अपेक्षाकृत खुला रखता है और इसे केवल क्षमा तक सीमित नहीं करता।
- source_word: ἀπολυθήσεσθε
  choice: तुम्हें छोड़ दिया जाएगा
  rationale: मूल में सक्रिय आज्ञा और उसके अनुरूप कर्मवाच्य परिणाम के शब्द-संबंध को बनाए रखता है तथा यूनानी क्रिया की व्यापकता सुरक्षित करता है।
- source_word: καὶ
  choice: और
  rationale: बार-बार आए καὶ की समांतर संरचना और लय को सीधा बनाए रखता है।
theological_decisions:
- issue: ἀπολύετε / ἀπολυθήσεσθε को संकीर्ण रूप से ‘क्षमा करो / क्षमा किए जाओगे’ कहना या व्यापक ‘छोड़ दो / छोड़ दिए जाओगे’ रखना
  choice: मुख्य पाठ में ‘छोड़ दो / तुम्हें छोड़ दिया जाएगा’
  alternative: ‘क्षमा करो / तुम्हें क्षमा किया जाएगा’
  rationale: न्याय और दोषी ठहराने के निकट प्रसंग में क्षमा का अर्थ स्वाभाविक और सम्भव है, पर यूनानी क्रिया छोड़ने, मुक्त करने या जाने देने का अधिक व्यापक अर्थ भी रखती है। मुख्य पाठ व्यापकता और पारस्परिक क्रिया-संबंध सुरक्षित रखता है; परिचित संकीर्ण अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘कदापि नहीं’ प्रबल निषेध को व्यक्त करता है, जबकि समांतर वाक्य-विन्यास मूल की लय बनाए रखता है। पाद-टिप्पणी का [a] चिह्न उसी पद ‘छोड़ दो’ के बाद रखा गया है जिससे वह वास्तव में संबंधित है।
