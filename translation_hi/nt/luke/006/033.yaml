source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: hi
  text: और यदि तुम उनका भला करते हो जो तुम्हारा भला करते हैं, तो तुम्हें क्या श्रेय मिलता है?[a] पापी भी ऐसा ही करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए क्या अनुग्रह है?” यूनानी शब्द का अर्थ “अनुग्रह,” “कृपा,” “धन्यवाद” या “श्रेय” भी हो सकता है; यहाँ आशय बदले में की गई भलाई के लिए मिलने वाली प्रशंसा या श्रेय से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: भला करते हो
  rationale: क्रिया का अर्थ किसी का भला करना या उसे लाभ पहुँचाना है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और आगे के कृदंत के साथ शब्दगत संबंध बनाए रखता है।
- source_word: τοὺς ἀγαθοποιοῦντας ὑμᾶς
  choice: जो तुम्हारा भला करते हैं
  rationale: यूनानी कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य से व्यक्त किया गया है और उसी मूल भाव ‘भला करना’ को दोहराया गया है।
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: इसमें तुम्हारी क्या प्रशंसा है
  rationale: इस नैतिक प्रसंग में χάρις उद्धार-संबंधी ‘अनुग्रह’ के बजाय किसी काम के लिए मिलने वाली सराहना, मान्यता या श्रेय की ओर संकेत करता है। ‘क्या प्रशंसा’ हिन्दी में अलंकारिक प्रश्न का अर्थ सहज रूप से पहुँचाता है।
- source_word: οἱ ἁμαρτωλοὶ
  choice: पापी
  rationale: यह लूका में प्रयुक्त सामाजिक-धार्मिक श्रेणी का सीधा और प्रचलित हिन्दी रूप है।
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ऐसा ही करते हैं
  rationale: यह यूनानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: καὶ
  choice: और / भी
  rationale: पहला καὶ पिछले समानांतर कथन से प्रवाह जोड़ने के लिए ‘और’ है; दूसरा संदर्भ में समावेशी अथवा बलसूचक है, जिसे ‘भी’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नैतिक शिक्षा के इस प्रसंग में χάρις का अर्थ
  choice: प्रशंसा या श्रेय
  alternative: अनुग्रह, कृपा, धन्यवाद
  rationale: प्रश्न पारस्परिक भलाई करने पर मिलने वाली विशेष सराहना के विषय में है। मुख्य पाठ में ‘अनुग्रह’ रखने से ऐसा उद्धार-संबंधी अर्थ उभर सकता है जिसे यह प्रसंग आवश्यक नहीं बनाता; फिर भी शब्द की वास्तविक व्यापकता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में संदर्भानुसार अनौपचारिक बहुवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है।
