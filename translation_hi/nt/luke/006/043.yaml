source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: hi
  text: क्योंकि कोई अच्छा पेड़ सड़ा हुआ[a] फल नहीं देता, और न ही, इसके विपरीत, कोई सड़ा हुआ पेड़ अच्छा फल देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खराब फल” / “खराब पेड़।” यूनानी शब्द σαπρός का अर्थ सड़ा हुआ, बिगड़ा हुआ, या खराब हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: क्योंकि कोई … नहीं
  rationale: γάρ पिछले कथन से व्याख्यात्मक संबंध जोड़ता है, इसलिए ‘क्योंकि’ स्वाभाविक है; Οὐ और अस्तित्वसूचक ἐστιν को हिन्दी में ‘कोई … नहीं’ से व्यक्त किया गया है।
- source_word: δένδρον καλὸν
  choice: अच्छा पेड़
  rationale: καλός का अर्थ यहाँ अच्छा या स्वस्थ हो सकता है। ‘अच्छा’ कृषि-संबंधी चित्र और उसके नैतिक संकेत—दोनों को खुला रखता है।
- source_word: ποιοῦν καρπὸν
  choice: फल देता
  rationale: ποιέω का मूल अर्थ ‘करना/बनाना’ है, पर पेड़ और फल के साथ आधुनिक हिन्दी में ‘फल देना’ स्वाभाविक मुहावरा है और कृदंत की निरंतर विशेषता को व्यक्त करता है।
- source_word: σαπρόν
  choice: सड़ा
  rationale: σαπρός का ठोस अर्थ सड़ा या बिगड़ा हुआ है और विस्तारित अर्थ खराब है। ‘सड़ा’ कृषि-चित्र की तीव्रता बनाए रखता है और नैतिक अर्थ को रूपक से उभरने देता है।
- source_word: οὐδὲ πάλιν
  choice: और न ही
  rationale: οὐδέ दूसरी नकारात्मक समांतर पंक्ति जोड़ता है। πάλιν यहाँ विपरीत दिशा में उसी सत्य को दोहराता है; हिन्दी का ‘और न ही’ इसे स्वाभाविक रूप से व्यक्त करता है, जबकि अलग से ‘फिर’ कहना बोझिल होता।
- source_word: καρπὸν καλόν
  choice: अच्छा फल
  rationale: यह पहली पंक्ति के विरोधात्मक समानांतर को बनाए रखता है और καλός का वही व्यापक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: कृषि-रूपक और नैतिक अर्थ की तीव्रता
  choice: σαπρός के लिए मुख्य पाठ में ‘सड़ा’
  alternative: ‘खराब’
  rationale: ‘सड़ा’ मूल कृषि-चित्र को ठोस रखता है और पाठक को उससे नैतिक निष्कर्ष ग्रहण करने देता है; ‘खराब’ अधिक सामान्य और अमूर्त है।
- issue: πάλιν की अभिव्यक्ति
  choice: विरोधात्मक पुनरुक्ति को ‘और न ही’ की समांतर रचना में समाहित करना
  alternative: ‘और फिर कोई सड़ा पेड़…’
  rationale: यहाँ πάλιν कालगत ‘फिर’ से अधिक उलटी दिशा में उसी बात की पुनरावृत्ति दर्शाता है। स्पष्ट हिन्दी समानांतरता अर्थ को सुरक्षित रखते हुए अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फल देता’ सामान्य हिन्दी मुहावरा है। दोनों खंडों की विरोधात्मक समानांतरता सुरक्षित है; एक ही यूनानी विशेषण के दोनों प्रयोगों के लिए ‘सड़ा’ रखा गया है।
