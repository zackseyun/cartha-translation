  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: hi
  text: 'लेकिन तुम जो सुन रहे हो[a], मैं तुमसे कहता हूँ: अपने शत्रुओं से प्रेम करो; जो तुमसे घृणा करते हैं, उनका भला करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जो सुनते हो।” यूनानी कृदंत का यह अधिक रूपगत अनुवाद है; मुख्य पाठ में “सुन रहे हो” सन्दर्भ में जारी और सक्रिय रूप से सुनने का भाव उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: लेकिन
  rationale: यह पिछले कथन से स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμῖν λέγω
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन-सूत्र, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: τοῖς ἀκούουσιν
  choice: तुम जो सुन रहे हो
  rationale: वर्तमान कृदंत की जारी और ध्यानपूर्वक सुनने की भावना को सन्दर्भानुकूल ढंग से व्यक्त करता है; अधिक रूपगत अनुवाद ‘जो सुनते हो’ भी सम्भव है।
- source_word: ἀγαπᾶτε
  choice: प्रेम करो
  rationale: आज्ञार्थक भाव को स्पष्ट रखता है और ἀγαπάω का सामान्य, गरिमापूर्ण हिन्दी प्रतिशब्द है।
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: अपने शत्रुओं से
  rationale: सम्बन्ध और कर्म को स्वाभाविक हिन्दी प्रयोग में व्यक्त करता है।
- source_word: καλῶς ποιεῖτε
  choice: भला करो
  rationale: यूनानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप है, जिसमें नैतिक भलाई और सक्रिय आचरण दोनों बने रहते हैं।
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: जो तुमसे घृणा करते हैं, उनका
  rationale: द्वेष की तीव्रता को नरम किए बिना हिन्दी में ‘भला करो’ के साथ स्वाभाविक सम्बन्ध बनाता है।
theological_decisions:
- issue: विरोधियों के प्रति नैतिक आज्ञाएँ
  choice: आज्ञाओं को बिना किसी अनकही सीमा के सीधे और सार्वत्रिक रूप में प्रस्तुत किया गया है।
  alternative: इन्हें केवल निजी शत्रुओं तक सीमित करना या अलंकारिक अतिशयोक्ति मानकर नरम करना।
  rationale: यूनानी पाठ में द्वितीय पुरुष बहुवचन की सीधी आज्ञाएँ हैं और उनके दायरे पर कोई स्पष्ट सीमा नहीं लगाई गई। इसलिए अनुवाद उनकी चुनौतीपूर्ण नैतिक शक्ति और व्याख्यात्मक तनाव दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रत्यक्ष रखी गई है। ‘तुम’ बहुवचन श्रोताओं को सम्बोधित करता है। विराम-चिह्नों से संबोधन और दो समानान्तर आज्ञाओं की संरचना स्पष्ट की गई है।
