  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: hi
  text: परन्तु वे विवेकहीन क्रोध से भर गए[a] और आपस में चर्चा करने लगे कि वे यीशु के साथ क्या करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पागलपन से भर गए” अथवा “मूर्खता से भर गए।” यूनानी शब्द विवेकहीनता, मूर्खता या उन्मत्त ढंग से समझ खो बैठने का भाव प्रकट कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: परन्तु वे
  rationale: δὲ का विरोधसूचक बल ‘परन्तु’ से स्वाभाविक रूप में व्यक्त होता है; αὐτοὶ का जोर प्रसंगगत विरोध से पर्याप्त स्पष्ट है।
- source_word: ἐπλήσθησαν ἀνοίας
  choice: विवेकहीन क्रोध से भर गए
  rationale: मूल का ‘भर गए’ मुहावरा सुरक्षित रखा गया है। ἄνοια का मूल भाव विवेक या समझ का अभाव है; इस शत्रुतापूर्ण प्रसंग में ‘विवेकहीन क्रोध’ उसकी अतार्किकता और भावात्मक तीव्रता दोनों व्यक्त करता है।
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: आपस में चर्चा करने लगे
  rationale: अपूर्ण भूतकाल जारी पारस्परिक विचार-विमर्श को दिखाता है; ‘चर्चा करने लगे’ आधुनिक हिन्दी में इस गतिशील पक्ष को सहजता से व्यक्त करता है।
- source_word: τί ἂν ποιήσαιεν
  choice: क्या करें
  rationale: τί के साथ ἄν और विधिलिङ्ग परोक्ष विचार-विमर्श में संभावित कार्यवाही का संकेत देते हैं। हिन्दी में ‘क्या करें’ इस अनिश्चित विचार-विमर्श को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ Ἰησοῦ
  choice: यीशु के साथ
  rationale: ποιέω के साथ सम्प्रदान कारक यीशु की ओर निर्देशित सोची जा रही कार्यवाही बताता है। ‘यीशु के साथ क्या करें’ शत्रुता को मूल से अधिक स्पष्ट किए बिना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ἀνοίας को मानसिक रोग, केवल मूर्खता, या नैतिक-अतार्किक आवेश के रूप में व्यक्त करना
  choice: विवेकहीन क्रोध
  alternative: पागलपन; मूर्खता; क्रोध
  rationale: यह चयन आधुनिक चिकित्सकीय अर्थ में मानसिक रोग का आरोप लगाने से बचता है और चंगाई के बाद विरोधियों की विवेकहीन, उग्र प्रतिक्रिया को व्यक्त करता है। पादटिप्पणी शब्द की वास्तविक अर्थ-व्याप्ति बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘विवेकहीन’ सामान्य पाठक के लिए बोधगम्य है और ἄνοια की अर्थगत अनिश्चितता को पादटिप्पणी सहित सुरक्षित रखता है।
