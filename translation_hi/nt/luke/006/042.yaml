id: LUK.6.42
reference: Luke 6:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: hi
  text: तुम अपने भाई से कैसे कह सकते हो, ‘भाई, मुझे तुम्हारी आँख में पड़ा तिनका निकालने दो,’ जबकि तुम अपनी ही आँख में पड़ा शहतीर नहीं देखते? कपटी! पहले अपनी आँख से शहतीर निकालो, तब तुम्हें साफ़ दिखाई देगा और तुम अपने भाई की आँख में पड़ा तिनका निकाल सकोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: तुम ... कैसे कह सकते हो
  rationale: यह स्वाभाविक हिन्दी में उस अलंकारिक प्रश्न को बनाए रखता है जो ऐसा कहने की योग्यता और उचितता, दोनों को चुनौती देता है।
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: भाई / भाई / भाई की
  rationale: यूनानी पाठ का संबोधन और उल्लेख पुल्लिंग एकवचन है; इसलिए उसे सामान्यीकृत किए बिना ठीक उसी रूप में रखा गया है।
- source_word: ἄφες ἐκβάλω
  choice: मुझे ... निकालने दो
  rationale: यहाँ ἄφες अनुमति माँगने का मुहावरा है; आधुनिक हिन्दी में यह उसका स्वाभाविक समतुल्य है।
- source_word: κάρφος
  choice: तिनका
  rationale: यह सूखी सामग्री के अत्यंत छोटे कण को दर्शाता है। ‘तिनका’ हिन्दी में आँख के बिंब के साथ स्वाभाविक है और बड़े शहतीर के साथ तीखा विरोध बनाए रखता है।
- source_word: δοκός
  choice: शहतीर
  rationale: δοκός किसी भवन में प्रयुक्त लकड़ी के बड़े धरन या बीम को दर्शाता है; ‘शहतीर’ अतिशयोक्तिपूर्ण बिंब को सटीक और स्पष्ट रखता है।
- source_word: αὐτὸς ... οὐ βλέπων
  choice: जबकि तुम अपनी ही ... नहीं देखते
  rationale: ‘अपनी ही’ αὐτός के बलाघात और दूसरे की कमी देखने के विपरीत अपनी कमी न देखने के विरोध को व्यक्त करता है।
- source_word: ὑποκριτά
  choice: कपटी!
  rationale: एकवचन संबोधन का तीखा प्रत्यक्ष तिरस्कार संक्षिप्त और प्रतिष्ठित हिन्दी में सुरक्षित रहता है।
- source_word: διαβλέψεις ... ἐκβαλεῖν
  choice: तुम्हें साफ़ दिखाई देगा और तुम ... निकाल सकोगे
  rationale: διαβλέπω स्पष्ट दृष्टि प्राप्त करने को बताता है; हिन्दी में उद्देश्यसूचक अनंत क्रिया को सहज रूप से व्यक्त करने के लिए परिणाम और क्षमता का यह विन्यास प्रयुक्त है।
theological_decisions:
- issue: नैतिक शिक्षा में ἀδελφός का लिंगयुक्त संबंध-सूचक प्रयोग
  choice: भाई
  alternative: भाई या बहन; संगी विश्वासी
  rationale: मूल पाठ में संबोधन और उल्लेख पुल्लिंग एकवचन है। व्यापक अनुप्रयोग संभव है, पर अनुवाद मूल की व्याकरणिक विशिष्टता को चुपचाप नहीं बदलता।
- issue: κάρφος और δοκός का अतिशयोक्तिपूर्ण विरोध
  choice: तिनका ... शहतीर
  alternative: कण ... लट्ठा; तिनका ... धरन
  rationale: यह चयन छोटी और विशाल वस्तु के नैतिक रूपक को स्पष्ट रखता है तथा आत्म-परीक्षण और दूसरे को सुधारने के बीच मूल तनाव को कम नहीं करता।
- issue: διαβλέψεις के बाद दूसरे की आँख से तिनका निकालना
  choice: साफ़ दिखाई देगा और ... निकाल सकोगे
  alternative: तब तुम स्पष्ट देखोगे कि ... कैसे निकालना है
  rationale: पाठ दूसरे को कभी न सुधारने की मनाही नहीं करता, बल्कि पहले आत्म-सुधार की माँग करता है; अनुवाद इसी क्रम को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष एकवचन संबोधन और dignified बोलचाल का संतुलन। ‘शहतीर’ भवन की बड़ी लकड़ी का सटीक और सामान्यतः समझ में आने वाला शब्द है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पाद-टिप्पणी चिह्न नहीं है।
