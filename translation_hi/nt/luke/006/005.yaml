  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: hi
  text: और वह उनसे कह रहा था, “मनुष्य का पुत्र सब्त का प्रभु है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य का पुत्र सब्त पर अधिकार रखता है।”
