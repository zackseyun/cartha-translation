lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को बनाए रखता है और यूनानी पाठ में निहित न होने वाली अतिरिक्त कालगत बारीकी नहीं जोड़ता।
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल की जारी या पुनरावृत्त क्रिया की संभावना को सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: दत्तिव बहुवचन सर्वनाम का प्रसंगानुकूल और स्वाभाविक हिन्दी रूप, बिना वार्ताकारों की पहचान में अनावश्यक विशिष्टता जोड़े।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ यह केवल आदरसूचक संबोधन नहीं, बल्कि अधिकार व्यक्त करने वाली उपाधि है; ‘प्रभु’ इसके मसीही और अधिकार-संबंधी बल को बनाए रखता है।
- source_word: τοῦ σαββάτου
  choice: सब्त का
  rationale: κύριος के साथ आए संबंधकारक का संक्षिप्त और सीधा रूप है। यह सब्त के संबंध में अधिकार को व्यक्त करता है, जबकि ‘सब्त पर’ को पादटिप्पणी में स्पष्ट वैकल्पिक अभिव्यक्ति के रूप में रखा गया है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु द्वारा प्रयुक्त स्थापित आत्म-संदर्भात्मक उपाधि को सुरक्षित रखता है और उसकी सामी पृष्ठभूमि तथा दानिय्येल 7 से संभावित संबंध को खुला रखता है।
theological_decisions:
- issue: सब्त के संबंध में मनुष्य के पुत्र के प्रभुत्व का मसीही बल
  choice: “मनुष्य का पुत्र सब्त का प्रभु है” के रूप में सीधा दावा
  alternative: “मनुष्य का पुत्र सब्त पर प्रभु है” अथवा “सब्त का भी प्रभु है”
  rationale: यूनानी शब्द-क्रम κύριος को प्रमुखता देता है और मूल दावा सब्त के संबंध में मनुष्य के पुत्र का अधिकार है। मुख्य पाठ मजबूत मसीही दावे को बनाए रखता है; ‘भी’ नहीं जोड़ा गया, क्योंकि वह इस यूनानी वाक्य में स्पष्ट नहीं है। ‘सब्त पर’ को अर्थ-स्पष्टीकरण वाले विकल्प के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘सब्त’ बाइबलीय संस्था के परिचित नाम के रूप में रखा गया है; ‘मनुष्य का पुत्र’ स्थापित उपाधि है। अपूर्ण भूतकाल को ‘कह रहा था’ द्वारा दृश्यमान रखा गया है।
