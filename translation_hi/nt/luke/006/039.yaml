reference: Luke 6:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: hi
  text: 'फिर उसने उन्हें एक दृष्टान्त भी सुनाया: “क्या एक अंधा दूसरे अंधे को राह दिखा सकता है? क्या वे दोनों गड्ढे में नहीं गिरेंगे?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खाई में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: भी
  rationale: δὲ के साथ इसका योगात्मक भाव है; हिन्दी में ‘फिर ... भी’ प्रसंग को आगे बढ़ाते हुए इस अतिरिक्त कथन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: यह सुसमाचारों में प्रयुक्त चित्रात्मक अथवा तुलनात्मक कथन का मानक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी शब्द है।
- source_word: Μήτι δύναται
  choice: क्या ... सकता है?
  rationale: Μήτι ऐसे प्रश्न का संकेत देता है जिसका अपेक्षित उत्तर नकारात्मक है; हिन्दी की सामान्य प्रश्न-रचना इस आलंकारिक बल को पर्याप्त रूप से बनाए रखती है।
- source_word: τυφλὸς ... τυφλὸν
  choice: एक अंधा ... दूसरे अंधे को
  rationale: यूनानी में पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रतिनिधिक अर्थ रखता है। ‘एक ... दूसरे’ हिन्दी में दो अलग व्यक्तियों को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὁδηγεῖν
  choice: राह दिखा सकता है
  rationale: यह मार्ग पर किसी का निर्देशन करने की ठोस छवि को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: οὐχί सकारात्मक उत्तर की अपेक्षा वाला प्रश्न प्रस्तुत करता है; ‘क्या ... नहीं’ हिन्दी में वही आलंकारिक बल रखता है।
- source_word: ἀμφότεροι
  choice: वे दोनों
  rationale: यह दोनों व्यक्तियों के साथ होने वाले परिणाम को स्पष्ट रूप से व्यक्त करता है।
- source_word: βόθυνον
  choice: गड्ढे
  rationale: βόθυνος गड्ढे या खाई का बोध करा सकता है; ‘गड्ढा’ व्यापक, दृश्यात्मक और सामान्य हिन्दी में स्वाभाविक है।
- source_word: ἐμπεσοῦνται
  choice: गिरेंगे
  rationale: भविष्यकालीन क्रिया को हिन्दी में सीधे भविष्यकाल से व्यक्त किया गया है; ‘गड्ढे में’ के साथ प्रवेश का भाव स्पष्ट है।
theological_decisions:
- issue: τυφλός का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: एक अंधा ... दूसरे अंधे को
  alternative: एक दृष्टिहीन व्यक्ति ... दूसरे दृष्टिहीन व्यक्ति को
  rationale: मूल में पुल्लिंग एकवचन रूप कहावत-सदृश प्रतिनिधिक अर्थ में है। हिन्दी का ‘अंधा’ मूल की ठोस रूपक-छवि और व्याकरणिक रूप को बनाए रखता है, जबकि कथन का प्रयोग सामान्य मानव स्थिति पर होता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दृष्टान्त’ बाइबलीय विधा को पहचानने योग्य रखता है, जबकि ‘राह दिखाना’ और ‘गड्ढा’ सामान्य पाठक के लिए स्वाभाविक हैं।
