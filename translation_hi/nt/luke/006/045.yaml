id: LUK.6.45
reference: Luke 6:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: hi
  text: भला मनुष्य अपने हृदय के भले भंडार से भलाई निकालता है, और दुष्ट मनुष्य अपने दुष्ट भंडार से बुराई निकालता है; क्योंकि उसका मुँह हृदय की भरपूरी[a] से बोलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसका मुँह हृदय की बहुतायत से बोलता है।”
    reason: περισσεύματος का निकट शाब्दिक विकल्प; ‘भरपूरी’ के साथ ‘बहुतायत’ प्रचुरता के अर्थ-रंग को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: भला मनुष्य
  rationale: ‘मनुष्य’ प्रतिनिधिक एकवचन को स्वाभाविक हिन्दी में रखता है, और ‘भला’ यहाँ नैतिक अच्छाई व्यक्त करता है।
- source_word: θησαυροῦ
  choice: भंडार
  rationale: यह भीतर संचित वस्तुओं के स्रोत की रूपकात्मक छवि को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है; ‘खज़ाना’ मूल्यवान संपत्ति पर अनावश्यक बल दे सकता है।
- source_word: καρδίας
  choice: हृदय
  rationale: यह भीतरी व्यक्ति—उसकी इच्छा, भावनाओं और नैतिक प्रवृत्ति—के लिए स्रोत का परिचित रूपक सुरक्षित रखता है।
- source_word: προφέρει
  choice: निकालता है
  rationale: भीतर के भंडार से किसी वस्तु को बाहर लाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों विरोधी खंडों की समानांतरता बनाए रखता है।
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: दुष्ट / दुष्ट / बुराई
  rationale: व्यक्ति और उसके भंडार के लिए ‘दुष्ट’ नैतिक तीव्रता बनाए रखता है, जबकि संज्ञात्मक τὸ πονηρόν के लिए ‘बुराई’ सहज हिन्दी है।
- source_word: περισσεύματος
  choice: भरपूरी
  rationale: हृदय में प्रचुर मात्रा में भरे हुए तत्व से वाणी निकलने का भाव रखता है; ‘उमड़ना’ अधिक गतिशील वैकल्पिक छवि है, जिसे पादटिप्पणी में दिया गया है।
- source_word: λαλεῖ
  choice: बोलता है
  rationale: कहावत के संदर्भ में सामान्य, स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: τὸ στόμα αὐτοῦ
  choice: उसका मुँह
  rationale: यूनानी पाठ की स्पष्ट देहात्मक छवि को बनाए रखता है, जिसमें मुँह हृदय की भीतरी दशा को बाहर प्रकट करता है।
theological_decisions:
- issue: ἀγαθός और πονηρός का नैतिक विरोध
  choice: ‘भला’ और ‘दुष्ट/बुराई’ के नैतिक वर्ग बनाए रखे गए हैं।
  alternative: ‘अच्छा’ और ‘खराब’ जैसे अपेक्षाकृत हल्के या केवल गुणात्मक शब्द
  rationale: यह कथन केवल उपयोगिता या व्यवहार-कुशलता नहीं, बल्कि चरित्र की नैतिक दशा और उससे निकलने वाले फल का विरोध प्रस्तुत करता है।
- issue: हृदय और वाणी का संबंध
  choice: मुँह की वाणी को हृदय की भरपूरी से निकलता हुआ कहा गया है।
  alternative: इसे सामान्यीकृत करके केवल ‘मनुष्य वही बोलता है जो वह सोचता है’ कहना
  rationale: मूल पाठ हृदय को भीतरी नैतिक स्रोत और मुँह को उसके बाहरी प्रकटीकरण के रूप में रखता है; इस तनावपूर्ण रूपक को व्याख्यात्मक गद्य में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल किंतु गरिमापूर्ण रखी गई है। ‘भला मनुष्य’ और ‘दुष्ट मनुष्य’ का समानांतर ढाँचा मूल के नैतिक विरोध को स्पष्ट करता है।
