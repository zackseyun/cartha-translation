base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: hi
  text: और मत्ती और थोमा, और हलफई के पुत्र याकूब, और शमौन जो ज़ीलोती कहलाता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उत्साही कहलाता था।” यूनानी पद एक उपनाम हो सकता है; केवल इस शब्द के आधार पर यह निश्चित नहीं होता कि शमौन किसी बाद के औपचारिक राजनीतिक आंदोलन का सदस्य था।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: नामों की सूची को जोड़ने वाला सामान्य समुच्चयबोधक; यूनानी की सूचीबद्ध लय बनाए रखने के लिए इसकी पुनरावृत्ति रखी गई है।
- source_word: Μαθθαῖον
  choice: मत्ती
  rationale: Μαθθαῖος नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: Θωμᾶν
  choice: थोमा
  rationale: Θωμᾶς नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: Ἰάκωβον Ἁλφαίου
  choice: हलफई के पुत्र याकूब
  rationale: इस नामकरण-रचना में संबंधकारक Ἁλφαίου स्वाभाविक रूप से पिता-पुत्र का संबंध बताता है; हिन्दी में ‘के पुत्र’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Σίμωνα
  choice: शमौन
  rationale: Σίμων नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: τὸν καλούμενον
  choice: जो ... कहलाता था
  rationale: लेख सहित कर्मवाच्य कृदंत उस उपनाम से पहचाने जाने का भाव देता है; कथा के भूतकालीन संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: Ζηλωτὴν
  choice: उत्साही
  rationale: यह पहचानसूचक उपनाम उत्साह या जोश से संबंधित है। ‘उत्साही’ सामान्य पाठक के लिए अर्थपूर्ण है और अपने-आप किसी औपचारिक राजनीतिक दल की सदस्यता निश्चित नहीं करता।
theological_decisions:
- issue: क्या Ζηλωτής को राजनीतिक दल की पदवी माना जाए या वर्णनात्मक उपनाम
  choice: मुख्य पाठ में ‘उत्साही’ रखा गया है और वैकल्पिक पदवी ‘ज़ीलोती’ पादटिप्पणी में दी गई है।
  alternative: ‘ज़ीलोती’ को मुख्य पाठ में रखकर इसे किसी विशिष्ट आंदोलन या दल से जुड़ी पदवी समझना।
  rationale: यूनानी शब्द एक पहचानसूचक उपनाम अवश्य है, पर वह अकेला औपचारिक राजनीतिक सदस्यता का ऐतिहासिक प्रश्न तय नहीं करता। यह प्रस्तुति उसी अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों की सूची में यूनानी के बार-बार आने वाले ‘और’ को बनाए रखा गया है। ‘उत्साही’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी ऐतिहासिक और शब्दार्थगत अनिश्चितता सुरक्षित रखती है।
