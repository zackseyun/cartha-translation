source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: hi
  text: उस दिन आनन्दित हो और खुशी से उछलो[a], क्योंकि देखो, स्वर्ग में तुम्हारा प्रतिफल बड़ा है; क्योंकि उनके पुरखे भविष्यद्वक्ताओं के साथ भी ऐसा ही किया करते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दिन प्रसन्न हो और उछलो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके पुरखे भविष्यद्वक्ताओं के साथ भी वैसा ही किया करते थे।” यहाँ क्रिया सामान्य है; संदर्भ से भविष्यद्वक्ताओं के प्रति वैसा ही विरोधी व्यवहार अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: आनन्दित होना
  rationale: बहुवचन आज्ञार्थक क्रिया सक्रिय आनन्द की आज्ञा देती है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: σκιρτήσατε
  choice: खुशी से उछलना
  rationale: यह शब्द आनन्द की प्रबल शारीरिक अभिव्यक्ति बताता है; 'खुशी से उछलना' क्रिया और उसके भाव दोनों को स्पष्ट रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आगे दिए गए कारण की ओर ध्यान खींचता है; 'देखो' हिन्दी में इसके संवादात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: μισθὸς
  choice: प्रतिफल
  rationale: सन्दर्भ में यह परमेश्वर से मिलने वाले सकारात्मक प्रतिदान का बोध कराता है, केवल आर्थिक मजदूरी का नहीं।
- source_word: πολὺς
  choice: बड़ा
  rationale: '''प्रतिफल बड़ा है'' मूल के विधेय विशेषण और उसके बल को निकटता से व्यक्त करता है।'
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: एकवचन संज्ञा यहाँ स्वर्गीय क्षेत्र को दर्शाती है; यह सीधा और प्रचलित हिन्दी रूप है।
- source_word: κατὰ τὰ αὐτά
  choice: ऐसा ही
  rationale: यह मुहावरा समान रीति या व्यवहार को बताता है; 'ऐसा ही' हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐποίουν
  choice: किया करते थे
  rationale: अपूर्ण भूतकाल की अभ्यस्त या बार-बार होने वाली क्रिया को यह रूप स्पष्ट करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: τοῖς προφήταις
  choice: भविष्यद्वक्ताओं के साथ
  rationale: ποιέω के साथ प्रयुक्त सम्प्रदान कारक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि व्यवहार के शत्रुतापूर्ण स्वरूप को प्रसंग और पादटिप्पणी पर छोड़ता है।
- source_word: οἱ πατέρες αὐτῶν
  choice: उनके पुरखे
  rationale: यहाँ 'पिता' से अभिप्राय पूर्वजों से है; 'पुरखे' पारिवारिक और पीढ़ीगत सम्बन्ध को स्पष्ट रखते हुए सामान्य हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: प्रतिज्ञात प्रतिफल का स्वरूप और स्थान
  choice: स्वर्ग में तुम्हारा प्रतिफल बड़ा है
  alternative: स्वर्ग में परमेश्वर के पास तुम्हारा प्रतिफल बड़ा है
  rationale: मूल पाठ प्रतिफल को 'स्वर्ग में' रखता है, पर अतिरिक्त रूप से 'परमेश्वर के पास' नहीं कहता; चुना हुआ रूप इस परलोक-संबंधी तनाव को बिना विस्तार दिए सुरक्षित रखता है।
- issue: '''उनके पुरखे'' का सन्दर्भ'
  choice: उनके पुरखे
  alternative: उनके पिता
  rationale: वाक्य वर्तमान विरोधियों को उन पूर्वजों से जोड़ता है जिन्होंने भविष्यद्वक्ताओं के साथ वैसा ही किया था। 'पुरखे' अभिप्रेत पीढ़ीगत अर्थ को स्पष्ट करता है, बिना किसी विशेष समूह की अतिरिक्त पहचान जोड़े।
- issue: भविष्यद्वक्ताओं के प्रति किए गए व्यवहार की स्पष्टता
  choice: किया करते थे
  alternative: व्यवहार किया करते थे / सताया करते थे
  rationale: मूल क्रिया सामान्य और प्रसंगाधीन है। चुना हुआ रूप शत्रुतापूर्ण व्यवहार का अर्थ संदर्भ से उभरने देता है और 'सताया' जैसे अधिक विशिष्ट अर्थ को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट स्तर अपनाया गया है। दोनों आज्ञार्थक क्रियाओं के लिए हिन्दी में स्वाभाविक संयुक्त आदेश-रचना ('आनन्दित होना ... उछलना') रखी गई है। 'प्रतिफल', 'स्वर्ग' और 'भविष्यद्वक्ता' बाइबिलीय सन्दर्भ में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं।
