  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: hi
  text: हाय तुम पर, जो अभी तृप्त हो, क्योंकि तुम भूखे रहोगे। हाय तुम पर, जो अभी हँस रहे हो, क्योंकि तुम शोक करोगे और रोओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: हाय तुम पर
  rationale: यह अभिव्यक्ति भविष्य के न्याय और उलटफेर की भविष्यद्वक्तापूर्ण चेतावनी का बल बनाए रखती है; इसे केवल सहानुभूति के उद्गार तक सीमित नहीं करती।
- source_word: ἐμπεπλησμένοι
  choice: तृप्त हो
  rationale: पूर्ण कृदंत से प्राप्त वर्तमान अवस्था व्यक्त होती है। ‘तृप्त हो’ स्वाभाविक हिन्दी में वर्तमान संतुष्टि और भावी भूख का स्पष्ट विरोध रखता है।
- source_word: νῦν
  choice: अभी
  rationale: वर्तमान दशा और आने वाले उलटफेर के बीच केंद्रीय कालगत विरोध को सुरक्षित रखता है।
- source_word: πεινάσετε
  choice: भूखे रहोगे
  rationale: भविष्य में आने वाली भूख को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γελῶντες
  choice: हँस रहे हो
  rationale: वर्तमान कृदंत की जारी क्रिया को सीधे व्यक्त करता है और अर्थ को व्यापक ‘आनन्द मनाने’ तक नहीं फैलाता।
- source_word: πενθήσετε
  choice: शोक करोगे
  rationale: गहरे मातम और विलाप के भाव को बनाए रखता है तथा अगले क्रियापद ‘रोओगे’ से भेद भी रखता है।
- source_word: κλαύσετε
  choice: रोओगे
  rationale: प्रत्यक्ष रोने या विलाप करने का अर्थ देता है और ‘शोक करोगे’ के साथ आने वाली अलंकारिक तीव्रता को सुरक्षित रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: हाय कहे जाने का कारण आधुनिक हिन्दी में स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: हाय-वचन का स्वरूप
  choice: जो अभी तृप्त और निश्चिंत हैं, उनके लिए आने वाले उलटफेर और न्याय की भविष्यद्वक्तापूर्ण चेतावनी
  alternative: भाग्य बदलने के बारे में मात्र सामाजिक अवलोकन
  rationale: दोहराया गया οὐαί, भविष्यकालीन क्रियाएँ और आस-पास के धन्य-वचनों के साथ समानांतर रचना न्याय तथा आने वाले उलटफेर की चेतावनी दर्शाती है। अनुवाद उसके ठीक साधन या समय को निर्धारित किए बिना यह तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों समानांतर वाक्यों में ‘हाय तुम पर’ दोहराकर यूनानी की संरचना और भविष्यद्वक्तापूर्ण तीव्रता सुरक्षित रखी गई है।
