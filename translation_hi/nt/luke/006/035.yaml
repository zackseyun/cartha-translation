source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: hi
  text: परन्तु अपने शत्रुओं से प्रेम करो, भलाई करो और उधार दो, और बदले में कुछ पाने की आशा न रखो[a]। तुम्हारा प्रतिफल बहुत बड़ा होगा, और तुम परमप्रधान के पुत्र[b] होगे, क्योंकि वह कृतघ्नों और दुष्टों के प्रति भला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश का अर्थ कठिन है। यहाँ प्रसंग के अनुसार इसका अर्थ उधार दी हुई वस्तु की वापसी या किसी प्रतिदान की आशा न रखना समझा गया है। कम सम्भावित अर्थ हैं: “किसी से निराश न होओ” या “कभी आशा न छोड़ो।”'
    reason: lexical_alternative
  - marker: b
    text: “पुत्र” यूनानी के पुल्लिंग बहुवचन शब्द का अनुवाद है; यहाँ उसका प्रयोग प्रतिनिधिक अर्थ में भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यह पिछले पदों में वर्णित पारस्परिक प्रेम और यहाँ दी गई अधिक कठिन आज्ञा के बीच स्पष्ट विरोध दर्शाता है।
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: अपने शत्रुओं से प्रेम करो
  rationale: आज्ञार्थक भाव और ‘शत्रुओं’ की चौंकाने वाली स्पष्टता को बिना नरम किए स्वाभाविक हिन्दी में रखता है।
- source_word: ἀγαθοποιεῖτε
  choice: भलाई करो
  rationale: क्रिया में निहित सक्रिय रूप से अच्छा करने का भाव संक्षिप्त और सहज हिन्दी में व्यक्त होता है।
- source_word: δανίζετε
  choice: उधार दो
  rationale: मूल क्रिया उधार देने को कहती है; ‘पैसा’ जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: μηδὲν ἀπελπίζοντες
  choice: बदले में कुछ पाने की आशा न रखो
  rationale: उधार और पारस्परिक प्रतिदान के निकट संदर्भ में इसका सबसे संभावित अर्थ वापसी या प्रतिफल की अपेक्षा छोड़ना है; कठिन वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: μισθὸς ὑμῶν πολύς
  choice: तुम्हारा प्रतिफल बड़ा होगा
  rationale: ‘प्रतिफल’ नैतिक और भावी प्रतिदान का भाव रखता है, जबकि ‘मजदूरी’ अनावश्यक रूप से व्यावसायिक सुनाई देती।
- source_word: υἱοὶ Ὑψίστου
  choice: परमप्रधान के पुत्र
  rationale: Ὑψίστου के प्रचलित ईश्वरीय शीर्षक और υἱοὶ के स्पष्ट पुल्लिंग बहुवचन, दोनों को सुरक्षित रखता है।
- source_word: χρηστός
  choice: कृपालु
  rationale: यह उन लोगों के प्रति भी परमेश्वर की हितकारी और अनुग्रहपूर्ण भलाई को स्वाभाविक हिन्दी में व्यक्त करता है जो उसके योग्य नहीं हैं।
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: कृतघ्नों और दुष्टों
  rationale: दोनों विशेषणों को संज्ञात्मक बहुवचन रूप में स्पष्ट और सीधा रखा गया है।
theological_decisions:
- issue: υἱοὶ Ὑψίστου में लैंगिक रूप
  choice: परमप्रधान के पुत्र
  alternative: परमप्रधान की सन्तान
  rationale: यूनानी पाठ में υἱοὶ स्पष्ट रूप से ‘पुत्र’ का पुल्लिंग बहुवचन है। मुख्य पाठ इसे सुरक्षित रखता है, जबकि प्रसंग में इसके प्रतिनिधिक प्रयोग की संभावना पादटिप्पणी में बताई गई है।
- issue: μηδὲν ἀπελπίζοντες का अर्थ
  choice: बदले में कुछ पाने की आशा न रखो
  alternative: किसी से निराश न होओ / कभी आशा न छोड़ो
  rationale: उधार देने और प्रतिदान के तात्कालिक संदर्भ में वापसी की अपेक्षा न रखना सबसे उपयुक्त अर्थ है, पर यूनानी वाक्यांश की वास्तविक व्याख्यात्मक कठिनाई पादटिप्पणी में सुरक्षित है।
- issue: ἔσεσθε υἱοὶ का सम्बन्धसूचक भाव
  choice: तुम ... पुत्र ठहरोगे
  alternative: तुम ... पुत्र होगे
  rationale: ‘ठहरोगे’ को कर्मों द्वारा पुत्रत्व कमाने के अर्थ में नहीं, बल्कि उस पहचान या समानता में प्रकट होने के सम्बन्धसूचक भाव में चुना गया है; यह हिन्दी में वाक्य को सहज बनाता है, यद्यपि सीधा ‘होगे’ भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और आज्ञात्मक रूप अपनाया गया है। ‘परमप्रधान’, ‘प्रतिफल’, ‘कृतघ्न’ और ‘कृपालु’ बाइबलीय गरिमा रखते हुए सामान्य पाठकों के लिए बोधगम्य हैं। ‘परन्तु’ औपचारिक है, पर अत्यधिक पुरातन नहीं।
