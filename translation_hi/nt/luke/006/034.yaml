source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: hi
  text: और यदि तुम उन लोगों को उधार देते हो जिनसे तुम वापस पाने की आशा रखते हो, तो तुम्हें क्या श्रेय है?[a] पापी भी पापियों को उधार देते हैं, ताकि वे उतना ही वापस पा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो तुम्हें क्या धन्यवाद मिलता है?” यूनानी शब्द का अर्थ “धन्यवाद” भी हो सकता है; यहाँ संभवतः उसका भाव श्रेय या अनुकूल मान्यता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: उधार देते हो / उधार देते हैं
  rationale: यह क्रिया धन या वस्तु उधार देने को व्यक्त करती है; आधुनिक हिन्दी में ‘उधार देना’ स्वाभाविक और स्पष्ट है।
- source_word: παρ’ ὧν
  choice: जिनसे
  rationale: παρά के संबंध को अपेक्षित वापसी के स्रोत के रूप में रखा गया है; हिन्दी में ‘जिनसे वापस पाने’ से यह संबंध सहज रूप में व्यक्त होता है।
- source_word: ἐλπίζετε λαβεῖν
  choice: वापस पाने की आशा रखते हो
  rationale: ἐλπίζω में आशा और अपेक्षा दोनों की अर्थ-छाया है। ‘आशा रखते हो’ मूल की संभावित अस्पष्टता बचाता है, जबकि प्रसंगानुसार ‘वापस पाने’ से प्रत्यावर्तन स्पष्ट होता है।
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: इसमें तुम्हारी क्या सराहना है?
  rationale: यहाँ χάρις उद्धारकारी ‘अनुग्रह’ की अपेक्षा प्रशंसनीयता, मान्यता या favorable regard का बोध कराता है। ‘सराहना’ हिन्दी में इस आलंकारिक प्रश्न का स्वाभाविक अर्थ देती है।
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: विशेषण का संज्ञात्मक प्रयोग है; ‘पापी’ लूका में प्रयुक्त नैतिक श्रेणी को सीधे बनाए रखता है।
- source_word: ἵνα ἀπολάβωσιν
  choice: ताकि उन्हें ... वापस मिल जाए
  rationale: ἀπολαμβάνω यहाँ दिए हुए को प्रत्युत्तर में वापस पाने का अर्थ देता है; यह रूप हिन्दी में सहज है और ऋण-वापसी को स्पष्ट करता है।
- source_word: τὰ ἴσα
  choice: उतना ही
  rationale: शाब्दिक अर्थ ‘बराबर की चीज़ें’ है; ‘उतना ही’ समान मात्रा या मूल्य की वापसी बताता है, बिना ब्याज या लाभ जोड़ने के।
theological_decisions:
- issue: यीशु के आलंकारिक प्रश्न में χάρις का अर्थ
  choice: ‘सराहना’—अर्थात प्रशंसनीय मान्यता या नैतिक श्रेय
  alternative: अनुग्रह; धन्यवाद; लाभ
  rationale: निकटवर्ती प्रसंग शिष्यों के आचरण और पापियों के पारस्परिक व्यवहार के बीच भेद पूछता है। इसलिए यहाँ अमूर्त उद्धारकारी अनुग्रह के बजाय प्रशंसनीयता का अर्थ उपयुक्त है; पाठ-टिप्पणी में ‘धन्यवाद’ की वास्तविक वैकल्पिक संभावना भी दी गई है।
- issue: उधार से अपेक्षित प्रतिफल का स्वरूप
  choice: समान मात्रा या मूल्य की वापसी
  alternative: ब्याज सहित भुगतान; लाभ सहित पूरी वसूली
  rationale: τὰ ἴσα बराबर प्रतिफल को दर्शाता है। अनुवाद मूलधन या सममूल्य वापसी से आगे कोई ब्याज, सूद या लाभ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक शिक्षा के अनुकूल शैली रखी गई है। ‘तुम’ बहुवचन श्रोताओं के लिए है। ‘उतना ही’ आर्थिक अर्थ को सहज रखता है और ब्याज का संकेत नहीं देता।
