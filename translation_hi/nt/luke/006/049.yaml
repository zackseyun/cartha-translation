id: LUK.6.49
reference: Luke 6:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: hi
  text: पर जो सुनता है, पर करता नहीं, वह उस मनुष्य के समान है जिसने बिना नींव के भूमि पर घर बनाया। नदी उससे टकराई, और वह तुरन्त ढह गया; उस घर का विनाश बड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: पर जो मेरी बातें सुनकर उन पर नहीं चलता
  rationale: यूनानी में सुनने और न करने का सीधा विरोध है। हिन्दी में ‘उन पर नहीं चलता’ स्वाभाविक रूप से यीशु की बातों के अनुसार आचरण न करने का अर्थ देता है; ‘मेरी बातें’ निकटवर्ती संदर्भ (लूका 6:47) से स्पष्ट किया गया है।
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: वह उस मनुष्य के समान है
  rationale: यह तुलना की सामान्य, गरिमापूर्ण हिन्दी है और ἀνθρώπῳ के प्रतिनिधिक एकवचन को बनाए रखती है।
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: जिसने बिना नींव के भूमि पर घर बनाया
  rationale: ‘भूमि’ यहाँ निर्माण की सतह को दर्शाता है और ‘बिना नींव के’ χωρὶς θεμελίου का सीधा अर्थ है।
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: नदी उस घर से आ टकराई
  rationale: προσρήγνυμι प्रबल टक्कर का भाव रखता है। सम्बन्धवाचक रचना को सहज हिन्दी वाक्य में बदला गया है और उसका पूर्वपद ‘घर’ स्पष्ट रखा गया है।
- source_word: εὐθὺς συνέπεσεν
  choice: वह तुरन्त ढह गया
  rationale: συμπίπτω भवन के गिरकर धराशायी होने को व्यक्त करता है; ‘ढह गया’ हिन्दी में सटीक और स्वाभाविक है।
- source_word: ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: उस घर का विनाश बहुत बड़ा हुआ
  rationale: ῥῆγμα टूटने, दरार या परिणामस्वरूप हुए विध्वंस को सूचित कर सकता है। घर के तत्काल ढहने के प्रसंग में ‘विनाश’ सहज है, जबकि ‘बहुत बड़ा’ μέγα की तीव्रता बनाए रखता है।
theological_decisions:
- issue: तुलना में प्रतिनिधिक पुल्लिंग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ἀνθρώπῳ एकवचन मानवीय उदाहरण है। ‘मनुष्य’ आधुनिक हिन्दी में प्रतिनिधिक अर्थ रखते हुए स्रोत के एकवचन चित्र को सुरक्षित रखता है।
- issue: सुनने के बाद ‘करने’ का आशय
  choice: मेरी बातें सुनकर उन पर नहीं चलता
  alternative: सुनकर उन्हें नहीं करता
  rationale: सन्दर्भ यीशु के वचनों के अनुसार आचरण का है। चुना हुआ रूप इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट साम्प्रदायिक अर्थ को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘तुरन्त’ और ‘ढह गया’ विनाश की आकस्मिकता और दृश्यात्मकता बनाए रखते हैं।
