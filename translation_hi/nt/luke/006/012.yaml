base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: hi
  text: उन दिनों ऐसा हुआ कि वह प्रार्थना करने के लिए पहाड़ पर निकल गया और परमेश्वर से प्रार्थना में उसने पूरी रात बिताई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पूरी रात परमेश्वर से प्रार्थना करता रहा।”
    reason: ἦν διανυκτερεύων की निरंतर क्रिया को व्यक्त करने वाला वैकल्पिक स्वाभाविक अनुवाद।
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: लूका की सामान्य कथात्मक संक्रमण-शैली को स्वाभाविक हिन्दी में व्यक्त करता है। δέ को अलग संयोजक से भारी बनाए बिना वाक्य का संक्रमण सुरक्षित रहता है।
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: उन दिनों
  rationale: यह प्रसंग में चल रहे समय की ओर संकेत करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐξελθεῖν αὐτὸν
  choice: वह ... गया
  rationale: ἐγένετο के बाद आए कर्मकारक और infinitive को हिन्दी में सहज सीमित उपवाक्य के रूप में व्यक्त किया गया है; गमन का भाव बना रहता है।
- source_word: εἰς τὸ ὄρος
  choice: पहाड़ पर
  rationale: ὄρος का सीधा और सामान्य अर्थ ‘पहाड़’ है। यूनानी निश्चित लेख को हिन्दी में अनावश्यक रूप से ‘उस’ बनाना किसी पहले से पहचाने गए विशेष पहाड़ का अतिरिक्त संकेत दे सकता था।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने के लिए
  rationale: गमन के उद्देश्य को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἦν διανυκτερεύων
  choice: उसने पूरी रात बिताई
  rationale: परिधीय imperfect और participle की निरंतरता तथा διανυκτερεύω के ‘पूरी रात बिताना’ भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: परमेश्वर से प्रार्थना करते हुए
  rationale: τοῦ θεοῦ को प्रार्थना के लक्ष्य के रूप में समझते हुए हिन्दी का स्वाभाविक ‘परमेश्वर से प्रार्थना’ प्रयोग किया गया है; इससे यह भ्रामक अर्थ नहीं निकलता कि प्रार्थना परमेश्वर की अपनी प्रार्थना थी।
theological_decisions:
- issue: यीशु की प्रार्थना के संबंध में τοῦ θεοῦ का अर्थ
  choice: परमेश्वर से प्रार्थना
  alternative: परमेश्वर की प्रार्थना
  rationale: संदर्भ में प्रार्थना परमेश्वर की ओर निर्देशित है। यह अनुवाद यीशु के परमेश्वर से प्रार्थना करने की बात को ज्यों का त्यों रखता है और पाठ में कोई अतिरिक्त धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
