source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: hi
  text: वह एक घर बनाने वाले मनुष्य के समान है। उस मनुष्य ने गहराई तक खोदा और चट्टान पर नींव डाली। जब बाढ़ आई, तो नदी उस घर से बड़े वेग से टकराई, पर उसे हिला न सकी, क्योंकि वह अच्छी तरह बनाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: वह उस मनुष्य के समान है
  rationale: यह तुलना का सीधा और स्वाभाविक हिन्दी रूप है; ἀνθρώπῳ के एकवचन प्रतिनिधि पुरुष को बनाए रखता है।
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: जो घर बना रहा था
  rationale: वर्तमान कृदंत निर्माण की चल रही क्रिया दिखाता है; हिन्दी में प्रसंगानुकूल और सहज रूप।
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: उसने गहरा खोदा
  rationale: दोनों यूनानी क्रियाएँ खुदाई और उसे गहरा करने पर बल देती हैं; यह संक्षिप्त हिन्दी उस संयुक्त बल को व्यक्त करती है।
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: चट्टान पर नींव डाली
  rationale: निर्माण-संदर्भ में स्वाभाविक हिन्दी पदावली है और πέτρα को व्याख्यात्मक ‘आधार-शिला’ बनाने के बजाय ठोस चट्टान के रूप में रखती है।
- source_word: πλημμύρης δὲ γενομένης
  choice: जब बाढ़ आई
  rationale: काल-सूचक परिस्थिति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: नदी उस घर से बड़े वेग से टकराई
  rationale: प्रसέρηξεν के हिंसक प्रहार का भाव ‘बड़े वेग से टकराई’ में स्पष्ट होता है, जबकि ποταμός के लिए ‘नदी’ रखा गया है।
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: उसे हिला न सकी
  rationale: असमर्थता और घर को अस्थिर करने के अर्थ—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: क्योंकि वह अच्छी तरह बनाया गया था
  rationale: कारण-सूचक रचना और निष्क्रिय भाव दोनों सुरक्षित रहते हैं; ‘वह’ का संदर्भ घर से है।
theological_decisions:
- issue: प्रतिनिधि उपमा में ἀνθρώπῳ का लिंग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: यूनानी में एकवचन पुरुष उदाहरण है। हिन्दी ‘मनुष्य’ संदर्भ में पुरुषवाचक व्याकरण के साथ उस रूप को बनाए रखता है, जबकि उपमा की व्यापक प्रतिनिधि शक्ति को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। निर्माण और बाढ़ की छवि को ठोस रखा गया है तथा यूनानी के कारण-सूचक निष्क्रिय वाक्यांश को बिना धर्मवैज्ञानिक विस्तार के अनूदित किया गया है।
