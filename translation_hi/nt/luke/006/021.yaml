  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: hi
  text: धन्य हो तुम जो अभी भूखे हो,[a] क्योंकि तुम तृप्त किए जाओगे।[b] धन्य हो तुम जो अभी रोते हो, क्योंकि तुम हँसोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्य हैं वे जो अभी भूखे हैं ... धन्य हैं वे जो अभी रोते हैं।” यूनानी में उपपद-सहित कृदंत हैं, जिन्हें सामान्य समूह के रूप में भी व्यक्त किया जा सकता है; लेकिन निकट प्रसंग और भविष्यकालीन द्वितीय-पुरुष बहुवचन क्रियाएँ सीधे संबोधन का समर्थन करती हैं।
    reason: alternative_reading
  - marker: b
    text: या, “तुम्हारा पेट भर जाएगा।” यूनानी क्रिया विशेष रूप से भोजन से भर जाने और विस्तार से पूरी तरह तृप्त होने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हो
  rationale: यह यीशु के धन्य-वचनों की गरिमा और परमेश्वर से मिलने वाली भलाई के भाव को बनाए रखता है; केवल मन की अनुभूति बताने वाला ‘सुखी’ यहाँ अपर्याप्त होगा।
- source_word: οἱ πεινῶντες νῦν
  choice: तुम जो अभी भूखे हो
  rationale: यूनानी में संज्ञा-सदृश सवर्णक कृदंत है, पर आगे की क्रिया द्वितीय पुरुष बहुवचन में है और निकट प्रसंग शिष्यों से सीधे संबोधन का है। ‘अभी’ वर्तमान अभाव और भावी उलटाव का विरोध स्पष्ट करता है।
- source_word: χορτασθήσεσθε
  choice: तुम तृप्त किए जाओगे
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए यह भोजन से भर जाने के ठोस बिंब और व्यापक रूप से पूर्ण संतोष—दोनों की संभावना खुली रखता है; कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: οἱ κλαίοντες νῦν
  choice: तुम जो अभी रोते हो
  rationale: सीधा संबोधन प्रसंग और द्वितीय पुरुष बहुवचन भविष्यत् क्रिया से समर्थित है। ‘रोते हो’ κλαίω का व्यापक अर्थ रखता है और इसे केवल शोक-मृत्यु तक सीमित नहीं करता।
- source_word: γελάσετε
  choice: तुम हँसोगे
  rationale: यह क्रिया के ठोस अर्थ और वर्तमान रोने से भावी हँसी के सजीव उलटाव को सुरक्षित रखता है; ‘आनन्दित होगे’ अधिक व्याख्यात्मक होता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धन्य कहे जाने का कारण प्रस्तुत करने वाले यूनानी संबंध को सहज आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: सीधा संबोधन या सामान्य तृतीय-पुरुष धन्य-वचन
  choice: ‘तुम जो अभी भूखे हो/रोते हो’ के रूप में सीधा संबोधन
  alternative: ‘वे जो अभी भूखे हैं/रोते हैं’ के रूप में सामान्य कथन
  rationale: यूनानी कर्ता-रूप अपने आप में सामान्य समूह की तरह पढ़े जा सकते हैं, लेकिन दोनों प्रतिज्ञाओं की क्रियाएँ द्वितीय पुरुष बहुवचन में हैं और प्रसंग शिष्यों को संबोधित करता है। पादटिप्पणी रूपगत विकल्प को सुरक्षित रखती है।
- issue: प्रतिज्ञा किए गए उलटाव का स्वरूप और समय
  choice: ‘तृप्त किए जाओगे’ और ‘हँसोगे’ जैसे ठोस शब्द, बिना समय या ढंग को परिभाषित किए
  alternative: इसे केवल आत्मिक तृप्ति या केवल अन्त-समय की पूर्ति के रूप में स्पष्ट करना
  rationale: पद उलटाव की प्रतिज्ञा करता है, पर यहीं यह नहीं बताता कि उसकी पूर्ति लौकिक, आत्मिक या अन्तकालीन किस अर्थ में होगी। अनुवाद उस तनाव को खुला रखता है।
- issue: χορτασθήσεσθε में निहित कर्ता
  choice: कर्मवाच्य ‘तृप्त किए जाओगे’
  alternative: ‘परमेश्वर तुम्हें तृप्त करेगा’
  rationale: परमेश्वर को निहित कर्ता समझना संभव है, पर यूनानी पाठ कर्ता का नाम नहीं लेता; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘अभी’ वर्तमान दशा और भावी उलटाव को उभारता है। समानांतर वाक्य-विन्यास मूल के धन्य-वचन रूप और लय को बनाए रखता है।
