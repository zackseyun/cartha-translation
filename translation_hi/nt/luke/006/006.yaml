  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: hi
  text: एक और सब्त के दिन ऐसा हुआ कि वह आराधनालय में प्रवेश किया और शिक्षा दे रहा था। वहाँ एक आदमी था, जिसका दाहिना हाथ सूख गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुरझाया हुआ।” यूनानी विशेषण किसी सूखी या मुरझाई हुई वस्तु का वर्णन कर सकता है; यहाँ यह उस आदमी के अशक्त दाहिने हाथ की दशा को बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ
  rationale: यह लूका की सामान्य घटना-परिचायक अभिव्यक्ति है। ‘ऐसा हुआ’ उसके कथात्मक कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; δέ का हल्का संयोजक बल प्रसंग से स्पष्ट है, इसलिए अलग से भारी संयोजक नहीं जोड़ा गया।
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: एक और सब्त के दिन
  rationale: ἕτερος उसी प्रकार के एक अन्य अवसर को दर्शाता है। यह अनुवाद समय-संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: कि वह आराधनालय में गया
  rationale: ἐγένετο के बाद आए यूनानी क्रियार्थक रूप को स्वाभाविक हिन्दी की पूर्ण उपवाक्य-रचना में व्यक्त किया गया है। ‘आराधनालय’ यहूदी συναγωγή के लिए प्रचलित और समझने योग्य शब्द है।
- source_word: καὶ διδάσκειν
  choice: और शिक्षा दे रहा था
  rationale: वर्तमानकालिक क्रियार्थक रूप की अपूर्णतापरकता को ‘दे रहा था’ से व्यक्त किया गया है, जिससे चल रही क्रिया का भाव बना रहता है।
- source_word: ἄνθρωπος
  choice: एक आदमी
  rationale: संज्ञा और प्रसंग एक पुरुष व्यक्ति की ओर संकेत करते हैं। ‘आदमी’ आधुनिक सामान्य हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: जिसका दाहिना हाथ
  rationale: यूनानी में विशेष रूप से दाहिने हाथ की पहचान की गई है। सम्बन्धवाचक रचना हिन्दी में वाक्य को सहज बनाती है।
- source_word: ξηρά
  choice: सूखा हुआ
  rationale: विशेषण का मूल अर्थ ‘सूखा’ या ‘मुरझाया’ है और यहाँ वह निष्क्रिय या विकृत हाथ की दशा बताता है। ‘सूखा हुआ’ स्रोत की छवि को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
