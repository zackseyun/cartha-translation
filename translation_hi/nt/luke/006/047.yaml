source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: hi
  text: जो कोई मेरे पास आता है, मेरी बातें सुनता है और उन पर चलता है—मैं तुम्हें बताऊँगा कि वह किसके समान है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “वह किसके समान है।” यहाँ पुल्लिंग एकवचन का प्रयोग सामान्य अर्थ में किसी भी ऐसे व्यक्ति के लिए हुआ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: जो कोई मेरे पास आता है
  rationale: यह कृदंत-रचना सामान्य और सर्वसमावेशी अर्थ रखती है। ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है और प्रत्येक व्यक्ति को समेटता है; πρός με का गति-सूचक अर्थ ‘मेरे पास’ से व्यक्त होता है।
- source_word: ἀκούων μου τῶν λόγων
  choice: मेरी बातें सुनता है
  rationale: λόγοι यहाँ यीशु की कही हुई शिक्षाओं को सूचित करता है। हिन्दी में ‘मेरी बातें’ इस संदर्भ में ‘मेरे शब्द’ की अपेक्षा अधिक स्वाभाविक है और सुनने की क्रिया को सीधे बनाए रखता है।
- source_word: ποιῶν αὐτούς
  choice: उन पर चलता है
  rationale: यीशु की बातों के संबंध में ποιέω का आशय उन्हें व्यवहार में लाना या उनका पालन करना है। ‘उन पर चलता है’ प्रचलित, स्पष्ट हिन्दी है और केवल सुनने तथा आचरण करने के बीच का विरोध बनाए रखता है।
- source_word: ὑποδείξω ὑμῖν
  choice: मैं तुम्हें बताऊँगा
  rationale: ὑποδείκνυμι आगामी उदाहरण के द्वारा स्पष्ट करने का भाव रखता है। ‘बताऊँगा’ सहज हिन्दी है और अगले पद में दिए जाने वाले दृष्टांत की भूमिका स्पष्ट करता है।
- source_word: τίνι ἐστὶν ὅμοιος
  choice: वह किसके समान है
  rationale: यह मूल यूनानी के प्रश्नवाचक दत्तिव और तुलना की रचना को निकटता से सुरक्षित रखता है। अगले पद में तुलना एक घर बनाने वाले मनुष्य से है, इसलिए ‘किसके समान’ हिन्दी में स्वाभाविक भी है।
- source_word: masculine singular participles / ὅμοιος
  choice: वह
  rationale: यूनानी में व्याकरणिक रूप पुल्लिंग एकवचन है, पर प्रयोग सामान्यतः किसी भी व्यक्ति के लिए है। हिन्दी का ‘वह’ लिंग-निरपेक्ष रूप से काम करता है और प्रतिनिधिक एकवचन को बनाए रखता है।
theological_decisions:
- issue: सुनने के साथ अपेक्षित प्रत्युत्तर
  choice: ‘उन पर चलता है’ द्वारा शिक्षाओं को आचरण में लाने का भाव व्यक्त किया गया
  alternative: ‘उन्हें करता है’ या ‘उनका पालन करता है’
  rationale: ποιῶν αὐτούς का सीधा रूप ‘उन्हें करता है’ हिन्दी में असहज है। ‘पालन करता है’ आज्ञापालन को अधिक स्पष्ट करता, पर मूल के व्यापक ‘करने’ को कुछ संकरा कर सकता है। ‘उन पर चलता है’ व्यावहारिक प्रत्युत्तर को स्वाभाविक रूप से व्यक्त करता है।
- issue: सामान्य पुल्लिंग एकवचन
  choice: ‘वह’ से प्रतिनिधिक एकवचन सुरक्षित रखा
  alternative: ‘वह व्यक्ति’ को दोहराना या बहुवचन प्रयोग करना
  rationale: मूल वचन किसी भी आने, सुनने और करने वाले व्यक्ति की बात करता है। हिन्दी में ‘वह’ अनावश्यक लैंगिक विशिष्टता के बिना एकवचन संदर्भ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक शिक्षण के अनुकूल। ‘मेरी बातें’ तथा ‘उन पर चलता है’ आम पाठक के लिए सहज हैं, जबकि तुलना की मूल संरचना ‘किसके समान’ के रूप में सुरक्षित रखी गई है।
