source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: hi
  text: परन्तु हे धनवानों, तुम पर हाय! क्योंकि तुम अपनी सांत्वना[a] पा चुके हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आराम” अथवा “दिलासा।”
    reason: παράκλησις के निकटवर्ती अर्थों को सुरक्षित रखना।
  - marker: b
    text: या, “पूरी तरह पा चुके हो।” यह क्रिया पूरा देय या पूरा भुगतान प्राप्त कर लेने का भाव भी दे सकती है।
    reason: ἀπέχετε में निहित संभावित पूर्ण-प्राप्ति के अर्थ को बताना।
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यह पिछले धन्य-वचनों के साथ स्पष्ट और गंभीर विरोध प्रकट करता है।
- source_word: οὐαὶ ὑμῖν τοῖς πλουσίοις
  choice: तुम धनवानों पर हाय
  rationale: सीधे संबोधन और भविष्यद्वक्ताओं जैसी कठोर चेतावनी—दोनों को बनाए रखता है; इसे केवल दुःखसूचक विलाप बनाकर नरम नहीं करता।
- source_word: ἀπέχετε
  choice: पा चुके हो
  rationale: वर्तमान रूप यहाँ किसी वस्तु को प्राप्त कर चुकने या अपने पास रखने का भाव दे सकता है। हिन्दी में यह प्रयोग उस पूर्णता के भाव को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘पूरी तरह’ का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: παράκλησιν
  choice: सांत्वना
  rationale: यह ‘दिलासा, सांत्वना, आराम’ के अर्थ-क्षेत्र को व्यक्त करता है और आने वाले उलटाव के संदर्भ में गंभीर तथा स्वाभाविक है।
- source_word: ὑμῶν
  choice: अपनी
  rationale: कर्ता और संबंध दोनों एक ही समूह के होने के कारण आधुनिक हिन्दी में ‘अपनी’ स्वाभाविक संबंधवाचक रूप है।
theological_decisions:
- issue: धनवानों के विरुद्ध चेतावनी का स्वरूप
  choice: धनवानों को सीधे संबोधित करते हुए कठोर ‘हाय’ को बनाए रखा गया है।
  alternative: ‘अफसोस’ कहकर इसे केवल विलाप बनाना, अथवा ‘धन पर भरोसा रखने वालों’ जैसी व्याख्या जोड़ना।
  rationale: यूनानी पाठ सीधे ‘तुम धनवानों’ को संबोधित करता है और कारण या नैतिक योग्यता के बारे में कोई अतिरिक्त सीमा नहीं जोड़ता।
- issue: ἀπέχετε का काल और पूर्णता-बोध
  choice: मुख्य पाठ में ‘पा चुके हो’ रखा गया है और ‘पूरी तरह’ का व्यावसायिक/पूर्ण-प्राप्ति वाला भाव पादटिप्पणी में दिया गया है।
  alternative: ‘पा रहे हो’ या मुख्य पाठ में ही ‘पूरी तरह पा चुके हो’।
  rationale: क्रिया वर्तमान रूप में होते हुए भी प्राप्ति हो चुकने अथवा पूरा भुगतान मिल जाने का मुहावरेदार अर्थ रख सकती है। पादटिप्पणी वास्तविक अर्थगत तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाय’ बाइबिलीय चेतावनी का गंभीर स्वर बनाए रखता है; ‘परन्तु’ पिछले धन्य-वचनों से तीखा विरोध स्पष्ट करता है।
