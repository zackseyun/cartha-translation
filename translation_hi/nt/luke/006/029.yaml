source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: hi
  text: जो तुम्हारे गाल[a] पर मारे, उसे दूसरा गाल भी आगे कर दो[b]; और जो तुम्हारी चादर[c] ले जाए, उसे तुम्हारा कुरता भी लेने से मत रोको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जबड़े पर’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अधिक शाब्दिक अर्थ है, ‘दूसरा भी आगे कर दो’ या ‘प्रस्तुत कर दो’; यहाँ ‘फेर दो’ नहीं कहा गया है।
    reason: alternative_reading
  - marker: c
    text: ‘चादर’ (ἱμάτιον) ऊपर का बाहरी वस्त्र था, जबकि ‘कुरता’ (χιτών) शरीर के पास पहना जाने वाला भीतरी वस्त्र था।
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: जो ... मारे
  rationale: वर्तमान कृदंत यहाँ संज्ञा के रूप में किसी भी ऐसे व्यक्ति को सूचित करता है जो यह काम करे। ‘जो ... मारे’ आधुनिक हिन्दी में स्वाभाविक है और कथन की सामान्य, अनिर्दिष्ट प्रकृति बनाए रखता है।
- source_word: ἐπὶ τὴν σιαγόνα
  choice: गाल पर
  rationale: σιαγών का अर्थ ‘जबड़ा’ या ‘गाल’ हो सकता है। चेहरे पर प्रहार के इस प्रसंग में ‘गाल’ स्वाभाविक है, जबकि वैकल्पिक शारीरिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πάρεχε
  choice: उसके सामने ... कर दो
  rationale: παρέχω का मूल भाव उपलब्ध कराने, प्रस्तुत करने या सामने करने का है। यह हिन्दी प्रयोग आज्ञा की सक्रियता बनाए रखता है और मत्ती के समानांतर पाठ से ‘फेर दो’ जैसा भिन्न यूनानी क्रिया का भाव आयात नहीं करता।
- source_word: καὶ τὴν ἄλλην
  choice: दूसरा गाल भी
  rationale: ἄλλην का निहित संज्ञा ‘गाल’ है और καί का अतिरिक्त बल ‘भी’ से व्यक्त हुआ है। स्पष्ट हिन्दी के लिए ‘गाल’ दोहराया गया है।
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: जो तुम्हारी ... ले जाए
  rationale: अभिव्यक्ति उस व्यक्ति को सूचित करती है जो वस्त्र लेता या उठा ले जाता है। ‘ले जाए’ αἴρω के हटाकर ले जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἱμάτιον
  choice: चादर
  rationale: ἱμάτιον सामान्यतः ऊपर पहने या ओढ़े जाने वाले बाहरी वस्त्र को दर्शाता है। ‘चादर’ साधारण पाठक के लिए सुबोध है और भीतरी कुरते से उसका अंतर बनाए रखती है; ऐतिहासिक वस्त्र-भेद पादटिप्पणी में स्पष्ट है।
- source_word: τὸν χιτῶνα
  choice: तुम्हारा कुरता
  rationale: χιτών शरीर के पास पहना जाने वाला भीतरी वस्त्र था। ‘कुरता’ आधुनिक हिन्दी में निकटतम सहज समतुल्य है, यद्यपि यह प्राचीन वस्त्र का पूर्ण सांस्कृतिक प्रतिरूप नहीं है।
- source_word: μὴ κωλύσῃς
  choice: लेने से मत रोको
  rationale: κωλύω का अर्थ रोकना या बाधा देना है। ‘लेने से मत रोको’ वस्त्र-हरण के प्रसंग में सीधा, स्वाभाविक और यूनानी निषेध के अनुरूप है।
theological_decisions:
- issue: क्या लूका के शब्दों को मत्ती के अधिक परिचित ‘दूसरा गाल फेर दो’ के अनुरूप बनाया जाए
  choice: लूका की विशिष्ट अभिव्यक्ति के अनुसार ‘उसके सामने दूसरा गाल भी कर दो’
  alternative: ‘दूसरा गाल भी फेर दो’
  rationale: यहाँ यूनानी क्रिया πάρεχε है, जिसका अर्थ देना, प्रस्तुत करना या सामने करना है; ‘फेरना’ अर्थ वाली क्रिया नहीं है। इसलिए समानांतर सुसमाचार की शब्दावली को इस पद में नहीं मिलाया गया।
- issue: क्या इन आज्ञाओं को मुख्य पाठ में सीमित, नरम या व्याख्यायित किया जाए
  choice: आज्ञाओं को बिना किसी जोड़ी हुई योग्यता के सीधे रूप में रखना
  alternative: मुख्य पाठ में ‘बदला मत लो’, ‘यदि संभव हो’ या अतिशयोक्ति-सूचक व्याख्या जोड़ना
  rationale: यूनानी पाठ सीधे द्वितीय-पुरुष आज्ञार्थक रूपों का प्रयोग करता है। अनुवाद यीशु की शिक्षा की तीक्ष्णता और उसकी व्याख्यात्मक-धर्मवैज्ञानिक तनाव को अतिरिक्त समाधान दिए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष लहजा रखा गया है। एकवचन संबोधन को ‘तुम्हारे/कर दो/मत रोको’ से व्यक्त किया गया है। प्राचीन वस्त्रों के लिए सुबोध हिन्दी शब्द चुने गए हैं और उनके सांस्कृतिक अंतर को पादटिप्पणी में सुरक्षित रखा गया है।
