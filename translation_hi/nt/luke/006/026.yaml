base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: hi
  text: हाय तुम पर जब सब लोग तुम्हारी प्रशंसा करें,[a] क्योंकि उनके पुरखे झूठे भविष्यद्वक्ताओं के प्रति भी वैसा ही व्यवहार किया करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विषय में अच्छी बातें कहें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: हाय तुम पर
  rationale: यह अभिव्यक्ति भविष्यद्वाणी-सदृश धिक्कार और गंभीर चेतावनी का बल बनाए रखती है; केवल ‘हाय’ की अपेक्षा आधुनिक हिन्दी में संबोधन अधिक स्पष्ट है।
- source_word: ὅταν
  choice: जब
  rationale: यह सामान्य या संभावित परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: तुम्हारी प्रशंसा करें
  rationale: यूनानी मुहावरे का आशय किसी के विषय में अच्छी या अनुकूल बातें कहना है; ‘प्रशंसा करें’ वर्तमान हिन्दी में संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πάντες οἱ ἄνθρωποι
  choice: सब लोग
  rationale: यह मानव-समूह के सामान्य और लिंग-समावेशी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὰ αὐτά
  choice: ऐसा ही
  rationale: ποιέω के साथ इस पदबंध का स्वाभाविक अर्थ ‘वही व्यवहार करना’ है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले धिक्कार का कारण प्रस्तुत करने वाले व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: ἐποίουν
  choice: किया करते थे
  rationale: यह अपूर्ण भूतकाल के प्रचलित अथवा बार-बार होने वाले कार्य का भाव व्यक्त करता है।
- source_word: τοῖς ψευδοπροφήταις
  choice: झूठे भविष्यद्वक्ताओं के साथ
  rationale: हिन्दी में ‘ऐसा ही करना’ के साथ ‘के साथ’ लक्षित व्यक्तियों के प्रति व्यवहार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ πατέρες αὐτῶν
  choice: उनके पुरखे
  rationale: यहाँ ‘पिता’ पिछली पीढ़ियों या पूर्वजों के सामूहिक अर्थ में है; ‘पुरखे’ उस ऐतिहासिक और पीढ़ीगत भाव को स्पष्ट तथा संक्षिप्त रखता है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं से तुलना का आशय और बल
  choice: पद सार्वभौमिक मानवीय प्रशंसा को उस ऐतिहासिक व्यवहार से जोड़कर चेतावनी देता है जो पिछली पीढ़ियों ने झूठे भविष्यद्वक्ताओं के साथ किया था।
  alternative: इसे हर प्रकार की सकारात्मक प्रशंसा की निरपेक्ष निंदा या केवल लोकप्रियता की आलोचना समझना।
  rationale: γάρ और κατὰ τὰ αὐτά धिक्कार का आधार ऐतिहासिक समानता में रखते हैं। अनुवाद इस तनाव को बनाए रखता है और हर उचित सराहना को स्वतः दोषपूर्ण घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाय तुम पर’ भविष्यद्वाणी-सदृश चेतावनी को बनाए रखता है; ‘पुरखे’ सांस्कृतिक अर्थ को मुख्य पाठ में स्वाभाविक रूप से स्पष्ट करता है, इसलिए उसके लिए अलग पादटिप्पणी आवश्यक नहीं है।
