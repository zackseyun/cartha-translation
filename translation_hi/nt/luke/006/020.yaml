base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: hi
  text: और उसने अपने शिष्यों की ओर आँखें उठाकर कहा, “तुम जो गरीब हो, धन्य हो[a][b], क्योंकि परमेश्वर का राज्य तुम्हारा है।”
  philosophy: optimal-equivalence
  footnotes:
