    text: लूका यहाँ केवल “गरीब” कहता है, “मन के दीन” नहीं (तुलना करें मत्ती 5:3)।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: आँखें उठाकर
  rationale: यूनानी कृदंत मुख्य क्रिया से पहले की क्रिया और दृष्टि उठाने का ठोस चित्र व्यक्त करता है; हिंदी में ‘आँखें उठाकर’ स्वाभाविक और निकट अर्थ वाला है।
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: अपने शिष्यों की ओर
  rationale: εἰς यहाँ दृष्टि की दिशा बताता है; ‘की ओर’ हिंदी में यही अर्थ सहजता से व्यक्त करता है।
- source_word: ἔλεγεν
  choice: कहा
  rationale: यूनानी अपूर्णकाल कथन को आरंभ करने या जारी रहने की पृष्ठभूमि दे सकता है। हिंदी में प्रत्यक्ष वचन के परिचय में ‘कहा’ अधिक स्वाभाविक है; ‘कह रहा था’ यहाँ अनावश्यक रूप से अधूरा प्रतीत होता।
- source_word: Μακάριοι
  choice: धन्य हो
  rationale: धन्य-वचनों के धार्मिक और ईश्वरीय अनुमोदन के भाव को ‘धन्य’ सुरक्षित रखता है; ‘सुखी’ इसे केवल मनोदशा तक सीमित कर सकता है। दूसरे पुरुष के सीधे संबोधन के कारण ‘हो’ चुना गया है।
- source_word: οἱ πτωχοί
  choice: तुम, जो गरीब हो
  rationale: शब्दशः रूप ‘गरीब’ लोगों को सूचित करता है, जबकि अगले पदबंध ὑμετέρα (‘तुम्हारा’) से स्पष्ट है कि यीशु सीधे शिष्यों को संबोधित कर रहे हैं। स्वाभाविक हिंदी में ‘तुम, जो गरीब हो’ दोनों बातों को व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धन्य होने का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट आधुनिक हिंदी रूप है।
- source_word: ὑμετέρα ἐστὶν
  choice: तुम्हारा है
  rationale: संबंधवाचक विशेषण विधेय के रूप में प्रयुक्त है; ‘तुम्हारा है’ यूनानी बल और सीधे संबोधन को बनाए रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित, व्यापक अर्थ वाला और स्वाभाविक हिंदी रूप है; केवल ‘शासन’ कहना अर्थ-क्षेत्र को अनावश्यक रूप से संकुचित कर सकता है।
theological_decisions:
- issue: क्या πτωχοί को आत्मिक अर्थ देकर ‘मन के दीन’ कहा जाए या केवल ‘गरीब’
  choice: गरीब
  alternative: मन के दीन / आत्मा में दीन
  rationale: लूका के यूनानी पाठ में केवल ‘गरीब’ है। मत्ती 5:3 के समानांतर वचन से ‘आत्मा में’ जोड़ना लूका के विशिष्ट शब्दों और उनके सामाजिक-भौतिक तथा व्यापक धार्मिक तनाव को मिटा देगा।
- issue: धन्य-वचन को तीसरे पुरुष में रखा जाए या सीधे संबोधन में
  choice: धन्य हो तुम, जो गरीब हो
  alternative: धन्य हैं गरीब
  rationale: οἱ πτωχοί रूप की दृष्टि से तीसरे पुरुष में है, पर तुरंत बाद ὑμετέρα (‘तुम्हारा’) सीधा दूसरे पुरुष का संबोधन है। मुख्य पाठ में स्वाभाविक सीधा संबोधन रखा गया है और औपचारिक रूप पादटिप्पणी में सुरक्षित है।
