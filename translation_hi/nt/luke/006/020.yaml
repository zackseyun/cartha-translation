    text: 'अधिक शाब्दिक रूप में: “धन्य हैं गरीब।” यूनानी अभिव्यक्ति रूप में तीसरे पुरुष की है, लेकिन आगे का “तुम्हारा” संबोधन को प्रत्यक्ष बना देता है।'
    reason: lexical_alternative
