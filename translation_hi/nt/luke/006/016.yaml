source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: hi
  text: और याकूब के पुत्र यहूदा[a], और यहूदा इस्करियोती, जो विश्वासघाती बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब के भाई यहूदा”; यूनानी में केवल “याकूब का यहूदा” है।
    reason: मूल यूनानी संबंध को स्पष्ट नहीं करता; ‘पुत्र’ और ‘भाई’ दोनों पूर्तियाँ प्रस्तावित की गई हैं।
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: याकूब के पुत्र यहूदा
  rationale: यूनानी में शाब्दिक रूप से ‘याकूब का यहूदा’ है और संबंध अनकहा है। प्रेरितों की सूची में ‘पुत्र’ स्वाभाविक और अधिक संभावित पूर्ति है; दूसरी संभावना पाद-टिप्पणी में रखी गई है।
- source_word: Ἰσκαριὼθ
  choice: इस्करियोती
  rationale: यह व्यक्ति का प्रचलित नाम/उपनाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: ὃς ἐγένετο
  choice: जो ... बन गया
  rationale: यह γίνομαι के ‘हो जाना/बन जाना’ अर्थ को बनाए रखता है और केवल ‘था’ कहने की अपेक्षा मूल क्रिया की गतिशीलता व्यक्त करता है।
- source_word: προδότης
  choice: विश्वासघाती
  rationale: यह उस व्यक्ति को सूचित करता है जो विश्वास तोड़कर किसी को पकड़वा देता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक संज्ञात्मक विशेषण है।
- source_word: καὶ
  choice: और
  rationale: बार-बार आया संयोजक सूची के अंतिम नामों को सीधे जोड़ता है।
theological_decisions:
- issue: Ἰακώβου में निहित यहूदा और याकूब का संबंध
  choice: मुख्य पाठ में ‘याकूब के पुत्र यहूदा’
  alternative: ‘याकूब के भाई यहूदा’; यूनानी केवल ‘याकूब का यहूदा’ कहता है।
  rationale: संबंध मूल यूनानी में स्पष्ट नहीं है। सुबोध हिन्दी के लिए ‘पुत्र’ को अधिक संभावित पूर्ति के रूप में रखा गया, लेकिन वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- issue: ὃς ἐγένετο προδότης का कालगत और चरित्रात्मक बल
  choice: ‘जो विश्वासघाती बन गया’
  alternative: ‘जो विश्वासघाती था’ या ‘जो पकड़वाने वाला बना’
  rationale: ‘बन गया’ मूल के परिवर्तन/परिणति-सूचक भाव को सुरक्षित रखता है और यह दावा नहीं करता कि वह आरंभ से ही इसी भूमिका में था।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण मानक हिन्दी। नामों के लिए प्रचलित बाइबलीय रूप ‘याकूब’, ‘यहूदा’ और ‘इस्करियोती’ रखे गए हैं। ‘विश्वासघाती’ सामान्य पाठक के लिए स्वाभाविक है और προδότης की चरित्रात्मक संज्ञा का बल व्यक्त करता है।
