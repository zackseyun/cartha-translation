  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: hi
  text: जो तुम्हें शाप देते हैं, उन्हें आशीष दो; जो तुम्हारे साथ दुर्व्यवहार करते हैं[a], उनके लिए प्रार्थना करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो तुम्हारा अपमान करते हैं’ या ‘जो तुम्हारे साथ बुरा व्यवहार करते हैं।’ यूनानी क्रिया शत्रुतापूर्ण दुर्व्यवहार के विभिन्न रूपों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: आशीष दो
  rationale: बहुवचन आज्ञार्थक क्रिया है। ‘आशीष दो’ यूनानी क्रिया का स्वाभाविक और प्रचलित हिन्दी रूप है तथा ‘शाप देने’ के साथ उसके जानबूझकर रखे गए नैतिक विरोध को बनाए रखता है।
- source_word: καταρωμένους ὑμᾶς
  choice: जो तुम्हें शाप देते हैं
  rationale: लेखयुक्त कृदंत यहाँ संज्ञा की तरह प्रयुक्त है—‘तुम्हें शाप देनेवाले’। यह रूप hostile speech का स्पष्ट और सहज आधुनिक हिन्दी अनुवाद है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप। यूनानी वर्तमान काल निरंतर मनोवृत्ति का संकेत दे सकता है, पर उसे अलग से जोड़ना अनावश्यक अतिव्याख्या होगी।
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: जो तुम्हारे साथ बुरा व्यवहार करते हैं, उनके लिए
  rationale: προσεύχομαι के साथ περί का अर्थ ‘के लिए’ है। ἐπηρεάζω अपमान, दुर्व्यवहार या अन्य शत्रुतापूर्ण बरताव को समेट सकता है; ‘बुरा व्यवहार’ इस व्यापकता को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: शत्रुओं के प्रति प्रेम संबंधी आज्ञाओं का दायरा
  choice: दोनों आज्ञाओं को सीधे नैतिक आदेशों के रूप में प्रस्तुत किया गया है।
  alternative: इनमें क्षमा, अहिंसा या प्रतिशोध के विषय में अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़ना।
  rationale: पद विरोध करनेवालों के प्रति प्रतिक्रिया के बारे में स्पष्ट आदेश देता है। अनुवाद को इन आदेशों की शक्ति और तनाव बनाए रखना चाहिए, न कि किसी विशेष मत की व्याख्या जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘तुम’ मूल यूनानी के बहुवचन संबोधन के लिए हिन्दी में सहज सामुदायिक संबोधन है।
