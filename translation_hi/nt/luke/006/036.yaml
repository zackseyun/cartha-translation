  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: hi
  text: दयालु[a] बनो, जैसे तुम्हारा पिता दयालु है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करुणामय।’ यूनानी विशेषण ऐसे व्यक्ति को दर्शा सकता है जो करुणा से द्रवित होकर दया करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: बनो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर आचरण का आह्वान करता है। ‘बनो’ γίνομαι की परिवर्तन अथवा चरित्र में ढलने की छाया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: दयालु
  rationale: यह विशेषण करुणा से प्रेरित होकर दया दिखाने वाले व्यक्ति को दर्शाता है। ‘दयालु’ आधुनिक हिन्दी में सहज है और पद में दोनों occurrences के लिए एक ही शब्द रखकर मूल की पुनरावृत्ति सुरक्षित करता है।
- source_word: καθὼς
  choice: जैसे
  rationale: यह पिता के चरित्र को शिष्यों के आचरण का तुलनात्मक आदर्श बताता है; ‘जैसे’ हिन्दी में स्पष्ट और स्वाभाविक तुलना व्यक्त करता है।
- source_word: ὁ πατὴρ ὑμῶν
  choice: तुम्हारा पिता
  rationale: मूल पाठ में केवल ‘तुम्हारा पिता’ है; ‘स्वर्गीय’ जोड़ना समानांतर परंपरा से अनावश्यक विस्तार होता। एकवचन ‘तुम्हारा’ संबोधित समुदाय के साझा पिता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आज्ञा और पिता के चरित्र का संबंध
  choice: पिता की दयालुता को आचरण का आदर्श बताते हुए ‘जैसे’
  alternative: पिता की दयालुता को कारण बताते हुए ‘क्योंकि’
  rationale: καθὼς यहाँ तुलना सूचित करता है, कारण नहीं; इसलिए पद नैतिक अनुकरण को व्यक्त करता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: पिता के लिए विशेषण जोड़ना
  choice: ‘तुम्हारा पिता’
  alternative: ‘तुम्हारा स्वर्गीय पिता’
  rationale: ‘स्वर्गीय’ इस यूनानी पाठ में उपस्थित नहीं है, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘दयालु’ की पुनरावृत्ति मूल यूनानी की शब्दगत समानता बनाए रखती है।
