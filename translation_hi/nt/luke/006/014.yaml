- source_word: Πέτρον
  choice: पतरस
  rationale: Πέτρος का हिन्दी मसीही साहित्य में स्थापित नाम-रूप।
- source_word: Ἀνδρέαν
  choice: अन्द्रियास
  rationale: Ἀνδρέας का हिन्दी बाइबल परंपरा में परिचित रूप।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: उसका भाई
  rationale: यहाँ ἀδελφός सगे पुरुष भाई को सूचित करता है; हिन्दी में सर्वनाम का निकटतम स्वाभाविक संबंध शमौन से स्पष्ट है।
- source_word: Ἰάκωβον
  choice: याकूब
  rationale: Ἰάκωβος के मूल नाम-संबंध को सुरक्षित रखने वाला और हिन्दी पाठकों में स्थापित रूप।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: Ἰωάννης का प्रचलित हिन्दी बाइबलीय नाम-रूप।
- source_word: Φίλιππον
  choice: फिलिप्पुस
  rationale: Φίλιππος का स्रोत-रूप के निकट और हिन्दी बाइबल परंपरा में पहचाना जाने वाला लिप्यंतरण।
- source_word: Βαρθολομαῖον
  choice: बरतुलमै
  rationale: Βαρθολομαῖος का हिन्दी बाइबल परंपरा में स्थापित नाम-रूप।
- source_word: καὶ
  choice: और
  rationale: सूची में बार-बार आया καί समन्वयकारी ‘और’ है; हिन्दी में इसकी पुनरावृत्ति यूनानी सूची की लय और संरचना बनाए रखती है।
