source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: hi
  text: शास्त्री और फ़रीसी उस पर कड़ी नज़र रखे हुए थे[a] कि क्या वह सब्त के दिन चंगा करेगा, ताकि वे उस पर आरोप लगाने का कोई आधार ढूँढ़ सकें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्यान से देख रहे थे।” यूनानी क्रिया में निकटता से, और प्रसंगानुसार विरोधी भाव से, निगरानी करने का अर्थ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके विरुद्ध कोई आरोप ढूँढ़ सकें,” अथवा केवल, “उस पर आरोप लगा सकें।” यूनानी अभिव्यक्ति किसी आरोप का आधार या अवसर खोजने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: उस पर कड़ी नज़र रखे हुए थे
  rationale: अपूर्ण काल निरंतर और उद्देश्यपूर्ण निगरानी दर्शाता है। प्रसंग में यह निगरानी संदेहपूर्ण और विरोधी है; ‘कड़ी नज़र’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘उस पर’ प्रसंग से स्पष्ट यीशु को सूचित करता है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों में व्यवस्था के विद्वान वर्ग के लिए यह प्रचलित, संक्षिप्त और स्रोत के निकट हिन्दी पद है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: यह धार्मिक समूह का मानक हिन्दी नाम है।
- source_word: εἰ
  choice: कि ... या नहीं
  rationale: देखने या निगरानी करने की क्रिया के बाद εἰ परोक्ष प्रश्न प्रस्तुत करता है; हिन्दी में ‘कि ... या नहीं’ इसका स्वाभाविक रूप है।
- source_word: ἐν τῷ σαββάτῳ
  choice: सब्त के दिन
  rationale: समय-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप है और यूनानी के एकवचन को बनाए रखता है।
- source_word: θεραπεύει
  choice: किसी को चंगा करता है
  rationale: वर्तमान काल को परोक्ष प्रश्न में स्वाभाविक हिन्दी के रूप में रखा गया है। ‘किसी को’ हिन्दी में सकर्मक प्रयोग को पूरा करता है, पर किसी विशेष रोगी की पहचान नहीं जोड़ता।
- source_word: ἵνα εὕρωσιν
  choice: ताकि वे ... ढूँढ़ सकें
  rationale: ἵνα का उद्देश्यबोध स्पष्ट करता है और εὕρωσιν के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατηγορεῖν αὐτοῦ
  choice: उस पर आरोप लगाने का कोई आधार
  rationale: εὕρωσιν के साथ यह अभिव्यक्ति आरोप लगाने के लिए कारण या अवसर खोजने का भाव रखती है। ‘आधार’ इस निहितार्थ को स्पष्ट करता है, जबकि ‘आरोप’ न्यायिक और विरोधी संदर्भ को बनाए रखता है।
theological_decisions:
- issue: विरोधियों के उद्देश्य का चित्रण
  choice: उनकी निगरानी को जानबूझकर की गई विरोधी जाँच के रूप में व्यक्त किया गया है, जिसका लक्ष्य आरोप का आधार पाना था।
  alternative: अधिक तटस्थ रूप में कहा जा सकता था कि वे केवल ध्यान से देख रहे थे कि वह चंगा करता है या नहीं।
  rationale: παρετηροῦντο का प्रसंग और ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ वाला उद्देश्य-वाक्य मिलकर दिखाते हैं कि यह तटस्थ अवलोकन नहीं था। फिर भी अनुवाद उनके बारे में इस पद से आगे कोई अतिरिक्त मंशा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शास्त्री,’ ‘फ़रीसी’ और ‘सब्त’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; वाक्य-संरचना हिन्दी के स्वाभाविक प्रवाह के अनुसार है।
