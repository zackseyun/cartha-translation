  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: hi
  text: एक सब्त के दिन ऐसा हुआ कि यीशु अनाज के खेतों में से होकर जा रहे थे। उनके शिष्य अनाज की बालियाँ तोड़कर, उन्हें हाथों से मसलकर, दाने खा रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: लूका के सामान्य वृत्तांत-संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है; δέ के हल्के संयोजक बल को अलग भारी शब्द से दिखाना आवश्यक नहीं।
- source_word: ἐν σαββάτῳ
  choice: एक सब्त के दिन
  rationale: अनिश्चित, पहले से निर्दिष्ट न किए गए सब्त का भाव सुरक्षित रहता है और हिन्दी में स्वाभाविक है।
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: यीशु अनाज के खेतों में से होकर जा रहे थे
  rationale: चल रही क्रिया का अपूर्णतावाची भाव रखा गया है। αὐτόν का स्पष्ट संदर्भ पाठक के लिए नाम से व्यक्त किया गया है, जबकि σπορίμων में फसल का प्रकार अनिर्दिष्ट रखा गया है।
- source_word: ἔτιλλον
  choice: बालें तोड़कर
  rationale: क्रिया का ठोस अर्थ स्वाभाविक हिन्दी में देता है; अगली समकालिक क्रियाओं के साथ हिन्दी की कृदंत-रचना प्रवाहपूर्ण है।
- source_word: καὶ ἤσθιον τοὺς στάχυας
  choice: दाने खा रहे थे
  rationale: मसलने की क्रिया से स्पष्ट खाद्य भाग दाने हैं। यह हिन्दी में 'बालें खा रहे थे' की भ्रामक छवि से बचता है, जबकि बालों को तोड़ने की क्रिया पहले स्पष्ट है।
- source_word: ψώχοντες ταῖς χερσίν
  choice: हाथों से मसलकर
  rationale: हाथों में बालें रगड़कर खाद्य दाने अलग करने की क्रिया को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
