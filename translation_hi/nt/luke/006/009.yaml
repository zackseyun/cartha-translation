reference: Luke 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: hi
  text: 'परन्तु यीशु ने उनसे कहा, “मैं तुमसे पूछता हूँ: क्या सब्त के दिन भला करना उचित है या बुरा करना[a], किसी का जीवन बचाना या उसे नष्ट करना[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भलाई करना या हानि पहुँचाना।” यूनानी शब्द भला करने और बुरा अथवा हानिकारक कार्य करने के बीच नैतिक विरोध रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “प्राण बचाना या नष्ट करना।” यहाँ “जीवन” किसी व्यक्ति के जीवन की रक्षा या विनाश के ठोस अर्थ में है; यूनानी शब्द का अनुवाद कुछ प्रसंगों में “प्राण” या “आत्मा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह कथानक में हल्का विरोध और प्रसंग का मोड़ दिखाता है, जब यीशु अपने विरोधियों की मंशा के उत्तर में बोलते हैं।
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: मैं तुमसे पूछता हूँ
  rationale: सीधी चुनौती के रूप में पूछे गए प्रश्न का बल बनाए रखते हुए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: εἰ ἔξεστιν
  choice: क्या ... उचित है
  rationale: यह सब्त के विषय में व्यवस्था और स्वीकृत आचरण की अनुमति से जुड़ा प्रश्न है; ‘उचित है’ हिन्दी में इसके विधिक-नैतिक आशय को सहज रूप से व्यक्त करता है।
- source_word: τῷ σαββάτῳ
  choice: सब्त के दिन
  rationale: समयवाचक प्रयोग और विशेष पवित्र दिन, दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαθοποιῆσαι
  choice: भला करना
  rationale: यह संक्षिप्त और स्वाभाविक अभिव्यक्ति अगले विरोधी पद ‘बुरा करना’ के साथ स्पष्ट नैतिक समानांतर बनाती है।
- source_word: κακοποιῆσαι
  choice: बुरा करना
  rationale: यूनानी में भला और बुरा करने के नैतिक विरोध को सीधे बनाए रखता है; प्रसंग में इसमें हानि पहुँचाना भी सम्मिलित है।
- source_word: ψυχὴν
  choice: किसी का जीवन
  rationale: इस प्रसंग में ψυχή किसी व्यक्ति के ठोस जीवन को सूचित करता है, न कि अनिवार्य रूप से शरीर से अलग ‘आत्मा’ को।
- source_word: σῶσαι
  choice: बचाना
  rationale: जीवन की रक्षा के तात्कालिक अर्थ तथा बाइबलीय ‘बचाने’ की व्यापक शब्द-संगति, दोनों को बनाए रखता है।
- source_word: ἀπολέσαι
  choice: उसे नष्ट करना
  rationale: ‘बचाना’ के साथ तीखा विरोध बनाए रखता है और ‘मार डालना’ जैसे अधिक संकुचित अर्थ को आरोपित नहीं करता।
theological_decisions:
- issue: ψυχὴν σῶσαι ἢ ἀπολέσαι में ψυχή का अर्थ
  choice: किसी का जीवन बचाना या उसे नष्ट करना
  alternative: किसी के प्राण बचाना या उन्हें नष्ट करना; किसी आत्मा को बचाना या नष्ट करना
  rationale: सब्त के दिन चंगाई के तात्कालिक प्रसंग में बात मानव-जीवन को बचाने या हानि पहुँचाने की है। ‘जीवन’ व्यावहारिक नैतिक बल को सुरक्षित रखता है और आत्मा के स्वरूप के विषय में बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘भला करना या बुरा करना’ समानांतर और स्मरणीय नैतिक विरोध प्रस्तुत करता है; ‘सब्त’ प्रचलित बाइबलीय पद के रूप में रखा गया है।
