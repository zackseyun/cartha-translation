  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “क्या तुमने यह भी नहीं पढ़ा कि दाऊद ने उस समय क्या किया, जब वह और उसके साथ के लोग भूखे थे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया का यह सामान्य यूनानी प्रयोग हिन्दी में स्वाभाविक रूप से ‘उत्तर दिया’ से व्यक्त होता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से दोहरावपूर्ण होता।
- source_word: πρὸς αὐτοὺς
  choice: उन्हें
  rationale: ‘उन्हें उत्तर दिया’ आधुनिक मानक हिन्दी में स्वाभाविक है और संबोधित लोगों को स्पष्ट रखता है।
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: क्या तुमने यह भी नहीं पढ़ा
  rationale: οὐδέ के बल को ‘यह भी नहीं’ से बनाए रखा गया है और प्रश्न को शास्त्र-ज्ञान पर तीखी आलंकारिक चुनौती के रूप में व्यक्त किया गया है।
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: कि दाऊद ने ... क्या किया
  rationale: यह हिन्दी में स्वाभाविक परोक्ष-प्रश्न संरचना है और यूनानी संबंधवाचक वाक्यांश का आशय सुरक्षित रखती है।
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: बाइबलीय हिन्दी में प्रचलित नाम-रूप।
- source_word: ὁπότε
  choice: उस समय ... जब
  rationale: काल-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπείνασεν
  choice: भूखे थे
  rationale: संदर्भ में दाऊद और उसके साथ के लोगों, दोनों की भूख बताई गई है; संयुक्त कर्ता के अनुसार बहुवचन हिन्दी रूप स्वाभाविक है।
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: वह और उसके साथ के लोग
  rationale: स्पष्ट सर्वनाम और साथ उपस्थित लोगों—दोनों को बनाए रखता है, बिना उन्हें अधिक व्याख्यात्मक रूप से ‘साथी’ कहे।
theological_decisions: []
