id: LUK.6.38
reference: Luke 6:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: hi
  text: 'दो, तो तुम्हें दिया जाएगा: एक अच्छी नाप—दबाई हुई, हिलाकर बैठाई हुई और छलकती हुई[a]—वे तुम्हारी गोद[b] में डालेंगे। क्योंकि जिस नाप से तुम नापते हो, उसी नाप से तुम्हें बदले में नापा जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उमड़कर बाहर बहती हुई।’ चित्र ऐसे पात्र का है जो इतना भर दिया गया है कि उसकी सामग्री बाहर छलकने लगती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वस्त्र के सामने का वह मोड़, जिसे थैली की तरह फैलाकर नापी हुई वस्तुएँ ली जा सकती थीं।
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: दो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक का स्वाभाविक हिन्दी रूप; यूनानी पक्ष को अनावश्यक रूप से ‘देते रहो’ बनाकर अधिक स्पष्ट नहीं किया गया।
- source_word: δοθήσεται ὑμῖν
  choice: तुम्हें दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य और सम्प्रदान भाव को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μέτρον καλὸν
  choice: अच्छा नाप
  rationale: ‘नाप’ मापने के पात्र और मापी हुई मात्रा—दोनों की छवि बनाए रखता है; ‘भरपूर’ या ‘उदार’ मूल से अधिक व्याख्यात्मक होते।
- source_word: πεπιεσμένον
  choice: दबाया हुआ
  rationale: माप के पात्र में वस्तु को दबाकर अधिक भरने की बाजार-संबंधी छवि को बनाए रखता है।
- source_word: σεσαλευμένον
  choice: हिलाकर बैठाया हुआ
  rationale: 'केवल ‘हिलाया हुआ’ की अपेक्षा प्रसंगगत परिणाम स्पष्ट करता है: पात्र को हिलाने से भीतर की सामग्री बैठ जाती है।'
- source_word: ὑπερεκχυννόμενον
  choice: छलकता हुआ
  rationale: पात्र के अत्यधिक भर जाने से सामग्री के बाहर गिरने की सजीव छवि व्यक्त करता है।
- source_word: δώσουσιν
  choice: वे ... डालेंगे
  rationale: यूनानी के अनिर्दिष्ट तृतीय पुरुष बहुवचन कर्ता को मिटाकर कर्मवाच्य नहीं बनाया गया; हिन्दी में गोद में मापी वस्तु देने के लिए ‘डालेंगे’ स्वाभाविक है।
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: तुम्हारी गोद में
  rationale: आधुनिक हिन्दी में सहज अभिव्यक्ति है; वस्त्र के सामने वाले मोड़ में सामान लेने की सांस्कृतिक छवि पादटिप्पणी में स्पष्ट की गई है।
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: क्योंकि जिस नाप से तुम नापते हो
  rationale: कारणसूचक संबंध, नाप की पुनरावृत्ति और पारस्परिकता की भूमिका—तीनों सुरक्षित रहते हैं।
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: उसी से तुम्हारे लिए भी नापा जाएगा
  rationale: ἀντί में निहित प्रत्युत्तर/प्रतिदान का भाव ‘उसी से’ और ‘भी’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है, बिना इसे आर्थिक भुगतान तक सीमित किए।
theological_decisions:
- issue: क्या इस कथन को विशेष रूप से धन या दान देने तक सीमित किया जाए
  choice: देने और उसी नाप से प्रत्युत्तर मिलने की व्यापक भाषा बनाए रखी गई।
  alternative: इसे केवल भिक्षादान या भौतिक उदारता के विषय में स्पष्ट कर देना।
  rationale: निकटवर्ती प्रसंग में दया, दोष न लगाना, क्षमा और देना सम्मिलित हैं; यूनानी पाठ इसे केवल धन तक सीमित नहीं करता। इसलिए अनुवाद न तो समृद्धि-संबंधी प्रतिज्ञा जोड़ता है, न व्यापक नैतिक संदर्भ को संकीर्ण करता है।
- issue: अनिर्दिष्ट ‘वे’ को परमेश्वर के रूप में स्पष्ट करना
  choice: अनिर्दिष्ट बहुवचन ‘वे’ सुरक्षित रखा गया।
  alternative: ‘परमेश्वर तुम्हारी गोद में डालेंगे’ या पूर्ण कर्मवाच्य प्रयोग करना।
  rationale: मूल पाठ कर्ता की पहचान नहीं करता। उसे स्पष्ट रूप से परमेश्वर या मनुष्य कहना वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बाजार में अनाज या अन्य वस्तु नापने की मूर्त छवि बनाए रखने के लिए ‘नाप’, ‘दबाया’, ‘हिलाकर बैठाया’ और ‘गोद’ का प्रयोग किया गया है। पादटिप्पणी-चिह्न संबंधित शब्दों पर लगाए गए हैं।
