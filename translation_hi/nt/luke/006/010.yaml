  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: hi
  text: उसने उन सबकी ओर दृष्टि डालकर उस मनुष्य से कहा, “अपना हाथ आगे बढ़ा।” उसने वैसा ही किया, और उसका हाथ अपनी पहले की दशा में बहाल हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका हाथ ठीक हो गया।” यूनानी में अधिक शाब्दिक अर्थ है, “उसका हाथ बहाल हो गया,” जो उसके उचित या पहले की दशा में लौट आने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: चारों ओर दृष्टि डाली
  rationale: अओरिस्ट कृदंत यह बताता है कि बोलने से पहले यीशु ने उपस्थित लोगों पर चारों ओर दृष्टि डाली; यह हिन्दी में स्वाभाविक रूप से क्रियाओं का क्रम बनाए रखता है।
- source_word: πάντας αὐτούς
  choice: उन सब पर
  rationale: यह वाक्यांश जिन लोगों की ओर उसने देखा, उनकी समग्रता पर बल देता है।
- source_word: εἶπεν αὐτῷ
  choice: उस मनुष्य से कहा
  rationale: दत्तिव αὐτῷ को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत किया गया है; प्रसंग के अनुसार सर्वनाम का संदर्भ स्पष्ट करने के लिए ‘उस मनुष्य’ कहा गया।
- source_word: Ἔκτεινον
  choice: आगे बढ़ा
  rationale: यह सीधी आज्ञा है। हाथ के संबंध में ‘आगे बढ़ा’ आधुनिक हिन्दी में स्वाभाविक है और शारीरिक क्रिया को स्पष्ट करता है।
- source_word: τὴν χεῖρά σου
  choice: अपना हाथ
  rationale: χείρ का सामान्य अर्थ ‘हाथ’ है; हिन्दी में कर्ता-संबंधी स्वामित्व के लिए ‘अपना’ स्वाभाविक है।
- source_word: ὁ δὲ ἐποίησεν
  choice: उसने वैसा ही किया
  rationale: ποιέω यहाँ पिछली आज्ञा के पालन को सूचित करता है; δέ को कथा के सहज प्रवाह में अलग विरोधसूचक शब्द के बिना व्यक्त किया गया है।
- source_word: ἀπεκατεστάθη
  choice: फिर पहले जैसा हो गया
  rationale: ἀποκαθίστημι का अर्थ उचित या पूर्व दशा में बहाल होना है। यह हिन्दी अभिव्यक्ति उसी पुनर्स्थापन को सहज भाषा में व्यक्त करती है, बिना केवल चिकित्सकीय ‘चंगा हुआ’ तक अर्थ सीमित किए।
- source_word: ἡ χεὶρ αὐτοῦ
  choice: उसका हाथ
  rationale: यूनानी की स्पष्ट पुनरावृत्ति को बनाए रखते हुए परिणाम और चमत्कार के केंद्र पर बल दिया गया है।
theological_decisions:
- issue: ἀπεκατεστάθη में चमत्कार का स्वरूप
  choice: 'पुनः पूर्व दशा में आने की भाषा: ‘फिर पहले जैसा हो गया’'
  alternative: ‘चंगा हो गया’ या ‘ठीक हो गया’
  rationale: यूनानी क्रिया पुनर्स्थापन पर बल देती है। चुना हुआ पाठ चमत्कार को स्पष्ट रखते हुए मूल शब्द के ‘पूर्व/उचित दशा में लौटने’ के भाव को सुरक्षित रखता है।
