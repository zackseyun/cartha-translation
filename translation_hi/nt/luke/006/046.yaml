  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: hi
  text: “तुम मुझे ‘प्रभु, प्रभु’[a] क्यों कहते हो, और जो मैं कहता हूँ, वह नहीं करते?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “स्वामी, स्वामी।” यूनानी: “क्यूरिए, क्यूरिए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: क्यों
  rationale: यहाँ τί कारण पूछने वाले क्रियाविशेषण की तरह प्रयुक्त है; ‘क्यों’ प्रश्न की फटकार और स्वाभाविक हिन्दी दोनों को व्यक्त करता है।
- source_word: δέ
  choice: —
  rationale: δέ एक हल्का प्रसंग-संयोजक है। हिन्दी में इस प्रश्न के आरम्भ में अलग संयोजक न रखना अधिक स्वाभाविक है, और प्रसंग से उसका संवादात्मक कार्य स्पष्ट रहता है।
- source_word: με
  choice: मुझे
  rationale: यह καλεῖτε का सीधा कर्म है; ‘मुझे’ इसका सहज हिन्दी रूप है।
- source_word: καλεῖτε
  choice: कहते हो
  rationale: सम्बोधन के प्रसंग में हिन्दी का ‘मुझे … कहते हो’ स्वाभाविक रूप से किसी को उपाधि देकर पुकारने का अर्थ देता है।
- source_word: Κύριε κύριε
  choice: प्रभु, प्रभु
  rationale: दोहराया हुआ सम्बोधन ज्यों का त्यों रखा गया है, जिससे मौखिक स्वीकार और आज्ञा न मानने के बीच का बलपूर्ण विरोध बना रहे।
- source_word: καὶ οὐ
  choice: और … नहीं
  rationale: यह प्रभु कहने और कथन का पालन न करने के बीच समन्वयात्मक किन्तु स्पष्ट विरोध प्रकट करता है।
- source_word: ποιεῖτε
  choice: करते
  rationale: यहाँ ποιέω यीशु के कहे को व्यवहार में लाने या मानने के अर्थ में है; ‘करना’ सरल और प्रत्यक्ष है।
- source_word: ἃ
  choice: जो … उसे
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक को हिन्दी में सामूहिक अर्थ वाले ‘जो … उसे’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: λέγω
  choice: मैं कहता हूँ
  rationale: वर्तमानकालीन λέγω का सीधा और अर्थ-संगत हिन्दी रूप है; इसमें अनावश्यक रूप से ‘तुमसे’ नहीं जोड़ा गया।
theological_decisions:
- issue: κύριος को मसीह-संबंधी उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में κύριος सीधे यीशु के लिए प्रयुक्त सम्बोधन है और आदर के साथ मसीह-संबंधी गहराई भी रखता है। ‘प्रभु’ इस भार को सुरक्षित रखता है; ‘स्वामी’ सम्भव शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक प्रश्न। ‘प्रभु, प्रभु’ की पुनरुक्ति और कथन तथा आचरण के बीच का तनाव सुरक्षित रखा गया है।
