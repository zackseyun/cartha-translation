source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: hi
  text: जो कोई तुमसे माँगे, उसे दो; और जो तुम्हारा कुछ ले जाए, उससे उसे वापस मत माँगो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे लौटाने की माँग मत करो।”
    reason: ἀπαιτέω में साधारण रूप से वापस माँगने और अधिक दृढ़ता से लौटाने की माँग करने—दोनों का भाव संभव है।
lexical_decisions:
- source_word: παντὶ
  choice: जो कोई
  rationale: यह रूप प्रत्येक माँगने वाले को समेटने वाला व्यापक, वितरणात्मक अर्थ व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αἰτοῦντί σε
  choice: तुमसे माँगे
  rationale: αἰτέω सामान्य रूप से माँगने या निवेदन करने को दर्शाता है; ‘भीख माँगे’ सामाजिक स्थिति का ऐसा संकेत जोड़ देता जो यूनानी में स्पष्ट नहीं है।
- source_word: δίδου
  choice: उसे दो
  rationale: वर्तमानकालिक आज्ञार्थक क्रिया को सहज हिन्दी आज्ञा में रखा गया है; इसका सामान्य अथवा निरंतर लागू होने वाला बल संदर्भ में बना रहता है।
- source_word: ἀπὸ τοῦ αἴροντος
  choice: जो … ले जाए, उससे
  rationale: αἴρω यहाँ किसी वस्तु को अपने साथ ले जाने या हटा लेने का अर्थ दे सकता है। ‘ले जाए’ इस भाव को रखता है, पर इसे अनिवार्य रूप से चोरी जैसी कानूनी श्रेणी तक सीमित नहीं करता।
- source_word: τὰ σὰ
  choice: तुम्हारा कुछ
  rationale: शाब्दिक भाव ‘तुम्हारी चीज़ें/जो तुम्हारा है’ है। ‘तुम्हारा कुछ’ हिन्दी में सहज है और वस्तुओं या संपत्ति का व्यापक संदर्भ बनाए रखता है।
- source_word: μὴ ἀπαίτει
  choice: उसे वापस मत माँगो
  rationale: ἀπαιτέω का अर्थ वापस माँगना, वापस देने की माँग करना, या दावा करके लौटाना चाहना हो सकता है। मुख्य पाठ का रूप संक्षिप्त, स्वाभाविक और मूल निषेध के अनुरूप है।
theological_decisions:
- issue: यीशु की नैतिक आज्ञाओं का विस्तार और बल
  choice: आज्ञाओं को व्यापक और सीधे रूप में रखा गया है।
  alternative: इन्हें अतिशयोक्ति मानकर नरम करना, केवल दान देने तक सीमित करना, या दूसरी आज्ञा को केवल कानूनी चोरी और क्षतिपूर्ति से जोड़ना।
  rationale: यूनानी पाठ सीधे आज्ञार्थक रूपों और व्यापक भाषा का प्रयोग करता है। अनुवाद को उनके व्यावहारिक उपयोग पर चलने वाली बहस का निर्णय करने के बजाय कथन की व्यापकता और नैतिक तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के एकवचन रूप ‘तुम’ को बनाए रखते हुए भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। अर्धविराम दोनों समानांतर आज्ञाओं का संबंध स्पष्ट करता है।
