source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: hi
  text: पर वह उनके विचारों[a] को जानता था। उसने उस आदमी से, जिसका हाथ सूखा हुआ[b] था, कहा, “उठो और बीच में[c] आकर खड़े हो जाओ।” वह उठकर खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके तर्क-वितर्क।”
    reason: lexical_alternative
  - marker: b
    text: या “सिकुड़ा हुआ हाथ।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी “बीच की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: जानता था
  rationale: οἶδα का यह रूप यहाँ वर्तमान अर्थ वाला ज्ञान व्यक्त करता है; हिन्दी कथन में ‘जानता था’ स्वाभाविक है और ज्ञान के साधन के बारे में कुछ नहीं जोड़ता।
- source_word: διαλογισμοὺς
  choice: मन के विचारों
  rationale: शब्द विचार, तर्क-वितर्क या भीतरी मनन को सूचित कर सकता है। ‘मन के विचार’ आंतरिकता स्पष्ट करता है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ἀνδρὶ
  choice: आदमी
  rationale: ἀνήρ वयस्क पुरुष को सूचित करता है; ‘आदमी’ आधुनिक और सहज हिन्दी में लिंग-सटीक संदर्भ बनाए रखता है।
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: एक हाथ सूखा हुआ
  rationale: ξηρός शरीर के अंग के लिए सूखे, सिकुड़े या निष्क्रिय होने का भाव देता है। हिन्दी में ‘हाथ सूखा हुआ’ स्रोत-रूपक को बनाए रखते हुए समझने योग्य है। अनिश्चित ‘एक’ हिन्दी में स्वाभाविक है और यूनानी निश्चित पदबंध को व्यक्ति की पहचानी हुई अवस्था के रूप में व्यक्त करता है।
- source_word: Ἔγειρε
  choice: उठो
  rationale: पहली आज्ञा स्थान से उठने को कहती है और अगली आज्ञा στῆθι से अलग रखी गई है।
- source_word: στῆθι εἰς τὸ μέσον
  choice: बीच में आकर खड़े हो जाओ
  rationale: εἰς गति को बीच की ओर दर्शाता है। हिन्दी में ‘आकर’ इस गति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘खड़े हो जाओ’ στῆθι को स्पष्ट रखता है।
- source_word: ἀναστὰς ἔστη
  choice: वह उठकर खड़ा हो गया
  rationale: कृदंत और मुख्य क्रिया की क्रमिकता ‘उठकर खड़ा हो गया’ में बनी रहती है; कोई अनावश्यक स्थानवाचक शब्द नहीं जोड़ा गया।
theological_decisions:
- issue: यीशु द्वारा दूसरों के भीतरी विचारों का ज्ञान
  choice: कथन को सीधे ‘उनके मन के विचारों को जानता था’ के रूप में रखा गया।
  alternative: ‘उनकी मंशा भाँप गया’ या ‘अलौकिक रीति से उनके विचार जानता था।’
  rationale: पद ज्ञान की पुष्टि करता है, पर उसका साधन नहीं बताता। अनुवाद न तो इसे केवल अनुमान बनाता है, न कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’ कथात्मक विरोध को व्यक्त करता है। दो अलग आज्ञाओं—‘उठो’ और ‘खड़े हो जाओ’—को सुरक्षित रखा गया है। मुख्य पाठ के सभी पादटिप्पणी-चिह्न क्रम से उपस्थित हैं।
