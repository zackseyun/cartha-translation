review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the distributive proverb, the passive recognition of a tree by its own fruit, and the distinction between thorny growth (ἀκάνθαι) and a bramble-like bush (βάτος). However, its second sentence leaves the explanatory force of the second γάρ unexpressed. Rendering ἀκανθῶν as “काँटों” is also more direct and proverbially natural than the interpretive “काँटेदार पौधों,” while retaining the source’s broad reference.
  naturalness: The Hindi is clear and modern. “आखिर” naturally carries the explanatory/proverbial force of the second γάρ without an overly repetitive “क्योंकि.” “काँटों से अंजीर बटोरते” is idiomatic and concise.
  terminology: “पेड़,” “अपने ही फल,” “अंजीर,” “कँटीली झाड़ी,” and “अंगूर तोड़ते” are appropriate, accurate modern-Hindi choices. “कँटीली झाड़ी” suitably represents βάτος without specifying an uncertain species.
  issues:
  - severity: low
    issue: The second γάρ is not explicitly represented.
    rationale: “लोग न तो …” states the example but does not retain its explanatory connection. “आखिर” expresses the source’s proverbial explanatory force naturally in Hindi.
  - severity: low
    issue: “काँटेदार पौधों” is somewhat more interpretive and less direct than needed for ἀκανθῶν.
    rationale: “काँटों” is a direct rendering and reads more naturally in the established agricultural comparison, while the following “कँटीली झाड़ी” continues to distinguish βάτος.
  revised_text: क्योंकि हर पेड़ अपने ही फल से पहचाना जाता है। आखिर, लोग न तो काँटों से अंजीर बटोरते हैं, और न कँटीली झाड़ी से अंगूर तोड़ते हैं।
