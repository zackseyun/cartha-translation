id: LUK.6.44
reference: Luke 6:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: hi
  text: क्योंकि हर पेड़ अपने ही फल से पहचाना जाता है। आखिर, लोग न तो काँटों से अंजीर बटोरते हैं, और न कँटीली झाड़ी से अंगूर तोड़ते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: हर पेड़
  rationale: एकवचन के साथ ἕκαστον का वितरणात्मक भाव है; ‘हर पेड़’ आधुनिक हिन्दी में स्वाभाविक है और प्रत्येक पेड़ पर अलग-अलग लागू होने वाला अर्थ बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पहला γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है। दूसरे γάρ की तर्कात्मक शक्ति अगले उदाहरणों की संरचना से हिन्दी में स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐκ τοῦ ἰδίου καρποῦ γινώσκεται
  choice: अपने ही फल से पहचाना जाता है
  rationale: ‘से पहचाना जाता है’ हिन्दी में साधन या प्रमाण का स्वाभाविक प्रयोग है; ‘ही’ ἰδίου के अपनेपन और पेड़ तथा उसके फल के विशिष्ट संबंध पर बल देता है।
- source_word: ἀκανθῶν
  choice: काँटेदार पौधों
  rationale: बहुवचन ἀκάνθαι सामान्य रूप से काँटेदार वनस्पतियों को दर्शाता है। ‘काँटेदार पौधों’ से बहुवचन और व्यापक वनस्पति-संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: συλλέγουσιν σῦκα
  choice: अंजीर बटोरते हैं
  rationale: συλλέγω का सामान्य अर्थ इकट्ठा करना या बटोरना है; फल के संदर्भ में ‘अंजीर बटोरते हैं’ सहज है।
- source_word: βάτου
  choice: कँटीली झाड़ी
  rationale: βάτος किसी सामान्य झाड़ी से अधिक विशेष रूप से ब्रैम्बल-जैसी काँटेदार झाड़ी को सूचित करता है; किसी अनिश्चित प्रजाति को आरोपित किए बिना ‘कँटीली झाड़ी’ यह विशेषता स्पष्ट करती है।
- source_word: σταφυλὴν τρυγῶσιν
  choice: अंगूर तोड़ते हैं
  rationale: τρυγάω पके फल, विशेषकर अंगूर, तोड़ने या काटने के लिए प्रयुक्त होता है। हिन्दी में सामूहिक अर्थ वाला ‘अंगूर’ और क्रिया ‘तोड़ते हैं’ स्वाभाविक कृषि-भाषा है।
theological_decisions:
- issue: फल के रूपक का नैतिक आशय
  choice: कृषि-संबंधी कहावत को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘फल’ को स्पष्ट रूप से चरित्र, काम या आचरण बताना।
  rationale: यूनानी पाठ इस पद में रूपक की नैतिक व्याख्या को सीधे नहीं जोड़ता। मूल बिंब को बनाए रखने से प्रसंग में उसका बल और उचित खुलापन सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हर पेड़’, ‘अंजीर बटोरते हैं’ और ‘अंगूर तोड़ते हैं’ साधारण पाठक के लिए सहज हैं; ‘काँटेदार पौधों’ तथा ‘कँटीली झाड़ी’ मूल के दो अलग वनस्पति-शब्दों का अंतर बनाए रखते हैं।
