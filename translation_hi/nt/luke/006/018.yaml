  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: hi
  text: वे उसे सुनने और अपने रोगों से चंगे होने आए थे। अशुद्ध आत्माओं से सताए जाते लोग[a] भी चंगे किए जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशुद्ध आत्माओं से पीड़ित लोग।” यूनानी कृदंत का अर्थ प्रसंग के अनुसार “सताए हुए,” “पीड़ित,” या “यातना झेल रहे” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: वे … आए थे
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद की भीड़ की ओर संकेत करता है। स्वतंत्र पद के रूप में स्वाभाविक हिन्दी के लिए ‘वे’ रखा गया है; ‘आए थे’ पूर्ववर्ती आगमन को सहज कथात्मक ढंग से व्यक्त करता है।
- source_word: ἀκοῦσαι αὐτοῦ
  choice: उसे सुनने
  rationale: उद्देश्यसूचक infinitive को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है; ‘उसकी शिक्षा सुनने’ कहना मूल से अतिरिक्त व्याख्या जोड़ता।
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: अपने रोगों से चंगे होने
  rationale: निष्क्रिय infinitive और ἀπό के छुटकारे/अलगाव के भाव को बनाए रखते हुए प्रचलित बाइबिलीय हिन्दी ‘चंगे होने’ और स्वाभाविक ‘रोगों से’ चुना गया है।
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: अशुद्ध आत्माओं से सताए जाते लोग
  rationale: ἐνοχλούμενοι चल रही पीड़ा या उत्पीड़न बताता है और ἀπό उसके स्रोत/कारण को। ‘सताए जाते’ इसकी तीव्रता को अनावश्यक रूप से ‘यातना’ तक बढ़ाए बिना व्यक्त करता है।
- source_word: ἐθεραπεύοντο
  choice: चंगे किए जा रहे थे
  rationale: अपूर्ण भूतकाल और निष्क्रिय वाच्य दोनों को सुरक्षित रखा गया है, जिससे दृश्य में जारी या बार-बार हो रही चंगाई का भाव बना रहता है।
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων का अनुवाद
  choice: अशुद्ध आत्माओं
  alternative: दुष्टात्माओं / अपवित्र आत्माओं
  rationale: ‘अशुद्ध आत्माएँ’ यूनानी पद की स्थापित बाइबिलीय अभिव्यक्ति और उसके धार्मिक-नैतिक भाव को बनाए रखती है; ‘दुष्टात्माएँ’ अर्थ की व्याख्या तो करती है, पर मूल के ‘अशुद्ध’ विशेषण को बदल देती है।
- issue: ἐθεραπεύοντο का पक्ष और वाच्य
  choice: चंगे किए जा रहे थे
  alternative: चंगे हो जाते थे / चंगे किए गए
  rationale: चुना गया रूप अपूर्ण पक्ष की जारी क्रिया और यूनानी निष्क्रिय वाच्य को बनाए रखता है, बिना चंगा करने वाले कर्ता को स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘चंगा’ सुसमाचारों के चंगाई-वर्णनों में व्यापक रूप से समझा जाने वाला पद है। ‘भी’ यूनानी καί का स्वाभाविक हिन्दी प्रतिनिधित्व करता है और दूसरी श्रेणी के लोगों को पहली के साथ जोड़ता है।
