source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: hi
  text: और यदि तुम उनसे प्रेम करते हो जो तुमसे प्रेम करते हैं, तो तुम्हें इससे क्या श्रेय मिलता है?[a] क्योंकि पापी भी उनसे प्रेम करते हैं जो उनसे प्रेम करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें इससे क्या अनुग्रह है?” यूनानी शब्द का अर्थ ‘अनुग्रह,’ ‘श्रेय,’ ‘अनुकूलता,’ या ‘सराहना’ हो सकता है; यहाँ उसका आशय उस बात से है जो प्रशंसनीय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: प्रेम करते हो / प्रेम करते हैं
  rationale: तीनों प्रयोगों में ‘प्रेम’ को समान रूप से रखा गया है, ताकि यूनानी मूल की जानबूझकर की गई पुनरावृत्ति और कथन का नैतिक बल बना रहे।
- source_word: ποία
  choice: क्या
  rationale: यहाँ प्रश्न श्रेय के प्रकार या मात्रा को लेकर आलंकारिक ढंग से पूछा गया है; आधुनिक हिन्दी में सरल ‘क्या’ स्वाभाविक और पर्याप्त है।
- source_word: χάρις
  choice: श्रेय
  rationale: इस प्रसंग में शब्द का आशय उद्धार-संबंधी ‘अनुग्रह’ से अधिक प्रशंसा, मान्यता या सराहनीयता से है। ‘श्रेय’ इस नैतिक तुलना को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: मूल के विशेषण-संज्ञा रूप को सामान्य और प्रचलित बाइबलीय हिन्दी में सीधे व्यक्त करता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: ‘क्योंकि’ γάρ के कारणसूचक संबंध को और ‘भी’ καί के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हारा
  rationale: χάρις के साथ दत्तिव ὑμῖν को हिन्दी मुहावरे ‘तुम्हारा क्या श्रेय है’ में स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु के कथन में χάρις का अर्थ
  choice: नैतिक ‘श्रेय’ या सराहनीयता
  alternative: अनुग्रह; धन्यवाद; कृपा
  rationale: निकटवर्ती प्रसंग यह पूछता है कि केवल प्रत्युत्तर में प्रेम करना किस प्रकार सराहनीय है। मुख्य पाठ में ‘अनुग्रह’ रखने से ऐसा विशिष्ट धर्मवैज्ञानिक अर्थ उभर सकता है जिसे यह प्रसंग आवश्यक नहीं बनाता; फिर भी मूल शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उन्हीं’ पारस्परिक प्रेम तक सीमित रहने के विरोध को स्पष्ट करता है, जबकि ‘प्रेम’ की तीनों पुनरावृत्तियाँ मूल पाठ के अनुरूप सुरक्षित हैं।
