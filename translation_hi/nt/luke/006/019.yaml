source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: hi
  text: और सारी भीड़ उसे छूने की कोशिश कर रही थी, क्योंकि उससे शक्ति निकल रही थी और सबको चंगा कर रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: यह सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और बताता है कि पूरी एकत्रित भीड़ इस प्रयास में लगी थी।
- source_word: ἐζήτουν
  choice: कोशिश कर रही थी
  rationale: अपूर्णकाल जारी या बार-बार किए जा रहे प्रयास को दर्शाता है; हिन्दी में सामूहिक संज्ञा ‘भीड़’ के साथ एकवचन स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: ἅπτεσθαι
  choice: छूने
  rationale: चंगाई के इस प्रसंग में क्रिया का सीधा और स्वाभाविक अर्थ ‘छूना’ है।
- source_word: δύναμις
  choice: शक्ति
  rationale: यह यीशु से निकलकर प्रभावी चंगाई करने वाली सामर्थ्य को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; ‘चमत्कारी’ जोड़ना मूल पाठ से अधिक स्पष्टता जोड़ देता।
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: उससे शक्ति निकल रही थी
  rationale: ‘निकल रही थी’ अपूर्णकाल की जारी क्रिया और यीशु से शक्ति के उद्गम—दोनों को स्पष्ट रखता है; हिन्दी में आने/जाने की अनावश्यक दृष्टिकोणगत कठिनाई से भी बचता है।
- source_word: ἰᾶτο
  choice: चंगा कर रही थी
  rationale: अपूर्णकाल को जारी चंगाई के रूप में व्यक्त करता है और स्त्रीलिंग ‘शक्ति’ के साथ व्याकरणिक संबंध स्पष्ट रखता है।
- source_word: πάντας
  choice: सबको
  rationale: यह मूल के व्यापक ‘सभी’ को स्वाभाविक हिन्दी में रखता है और संदर्भ से लोगों का संकेत स्पष्ट है।
theological_decisions:
- issue: यीशु से निकलने वाली δύναμις का स्वरूप
  choice: ‘उससे शक्ति निकल रही थी’—बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के
  alternative: ‘उससे चमत्कारी शक्ति निकल रही थी’
  rationale: मूल पाठ यीशु को चंगा करने वाली प्रभावी शक्ति का स्रोत बताता है, पर δύναμις के साथ ‘चमत्कारी’ विशेषण नहीं जोड़ता। अनुवाद कथन की शक्ति बनाए रखते हुए उससे आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘चंगा करना’ सामान्य हिन्दी पाठकों के लिए समझने योग्य है और बाइबलीय चंगाई के प्रसंग को सटीक रखता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि हिन्दी ‘निकल रही थी’ यूनानी अभिव्यक्ति को स्वाभाविक रूप से समेटती है।
