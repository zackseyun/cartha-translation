  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: hi
  text: चट्टान पर वाले वे हैं, जो वचन सुनकर उसे आनन्द से ग्रहण करते हैं। पर उनकी कोई जड़ नहीं होती; वे कुछ समय तक विश्वास करते हैं, और परीक्षा के समय[a] विश्वास से हट जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रलोभन के समय” अथवा “जब संकट आता है।” यूनानी शब्द का अर्थ संदर्भ के अनुसार परीक्षा, संकट या प्रलोभन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: चट्टान पर पड़े हुए
  rationale: यह अनुवाद एकवचन πέτρα की ठोस चट्टान वाली छवि को बनाए रखता है और बोए गए बीज के दृष्टान्त के संदर्भ में स्वाभाविक है।
- source_word: μετὰ χαρᾶς δέχονται τὸν λόγον
  choice: वचन को आनन्द से ग्रहण करते हैं
  rationale: ‘ग्रहण करते हैं’ δέχονται का सीधा और प्रतिष्ठित हिन्दी समतुल्य है; ‘वचन’ दृष्टान्त में घोषित सन्देश के लिए प्रचलित बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: उनकी कोई जड़ नहीं होती
  rationale: एकवचन ‘जड़’ यूनानी पाठ के रूपक और व्याकरण, दोनों को सुरक्षित रखता है।
- source_word: πρὸς καιρὸν πιστεύουσιν
  choice: वे कुछ समय तक विश्वास करते हैं
  rationale: यह सीमित अवधि और πιστεύουσιν के सीधे अर्थ को व्यक्त करता है, बिना विश्वास की प्रकृति पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष थोपे।
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: परीक्षा के समय
  rationale: πειρασμός में परीक्षा, संकट और प्रलोभन की अर्थ-सीमा हो सकती है; ‘परीक्षा’ मुख्य पाठ में इस व्यापकता को सबसे अच्छी तरह सुरक्षित रखती है।
- source_word: ἀφίστανται
  choice: पीछे हट जाते हैं
  rationale: यह पूर्व विश्वास से हटने की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘धर्मत्याग’ जैसे अधिक तकनीकी शब्द से बचता है।
theological_decisions:
- issue: क्या πιστεύουσιν सच्चे उद्धारकारी विश्वास या केवल सतही विश्वास को सूचित करता है
  choice: ‘विश्वास करते हैं’ का तटस्थ अनुवाद
  alternative: ‘ऊपरी तौर पर विश्वास करते हैं’ अथवा ‘सच्चा विश्वास करते हैं’
  rationale: पद विश्वास को कुछ समय तक रहने और बाद में हट जाने की बात कहता है, लेकिन विश्वास की उद्धारकारी प्रकृति या स्थिरता से जुड़े बाद के धर्मवैज्ञानिक विवादों का स्वयं निर्णय नहीं करता।
- issue: इस संदर्भ में πειρασμός का अर्थ
  choice: परीक्षा
  alternative: प्रलोभन अथवा संकट
  rationale: यूनानी शब्द बाहरी संकट, परख या आन्तरिक प्रलोभन को सूचित कर सकता है। मुख्य पाठ में ‘परीक्षा’ व्यापक अर्थ रखता है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। दृष्टान्त की कृषि-संबंधी छवि और विश्वास से जुड़ा धर्मवैज्ञानिक तनाव दोनों सुरक्षित हैं।
