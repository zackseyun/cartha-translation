source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: hi
  text: और जो काँटों में गिरा था, वे वे लोग हैं जिन्होंने सुना है, पर चलते-चलते वे चिंताओं, धन-दौलत और जीवन के सुखों से घुट जाते हैं और परिपक्व फल नहीं लाते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: जो काँटों के बीच गिरा
  rationale: नपुंसकलिंग एकवचन कृदंत बोए गए बीज की ओर संकेत करता है। हिन्दी में संज्ञा जोड़े बिना यह अभिव्यक्ति स्वाभाविक रहती है और दृष्टांत की व्याख्यात्मक शैली बनाए रखती है।
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: वह उन लोगों को दर्शाता है जिन्होंने वचन सुना है
  rationale: शाब्दिक ‘ये वे हैं’ हिन्दी में असहज है; ‘दर्शाता है’ दृष्टांत और उसके अभिप्राय का संबंध स्पष्ट करता है। ‘वचन’ तत्काल संदर्भ (लूका 8:11–13) से स्पष्ट पूर्ति है, यद्यपि इस पद में संज्ञा दोहराई नहीं गई।
- source_word: μεριμνῶν
  choice: चिंताओं
  rationale: यह शब्द देखभाल, चिंता या व्याकुलता का अर्थ दे सकता है। यहाँ नकारात्मक रूप से दबाने वाली सांसारिक व्यस्तताओं के लिए ‘चिंताओं’ सहज और पर्याप्त व्यापक है।
- source_word: πλούτου
  choice: धन-दौलत
  rationale: ‘धन-दौलत’ सामान्य आधुनिक हिन्दी में भौतिक समृद्धि का स्पष्ट और स्वाभाविक बोध कराता है।
- source_word: ἡδονῶν τοῦ βίου
  choice: जीवन के सुख-विलास
  rationale: ἡδονή केवल साधारण आनंद नहीं, भोग-सुख का संकेत दे सकता है; ‘सुख-विलास’ उस नकारात्मक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है। βίος को ‘जीवन’ रखा गया है, बिना ‘इस संसार’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: πορευόμενοι
  choice: चलते-चलते
  rationale: वर्तमान कृदंत की जारी प्रक्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; इसे स्पष्ट रूप से पूरे जीवन की आध्यात्मिक यात्रा कहकर अतिव्याख्यायित नहीं करता।
- source_word: συμπνίγονται
  choice: दब जाते हैं
  rationale: क्रिया का मूल चित्र साथ उगे काँटों द्वारा पौधे को घोंटने या दबाने का है। ‘दब जाते हैं’ हिन्दी में पौधे की वृद्धि रुकने और सांसारिक प्रभावों से परास्त होने, दोनों को सहजता से व्यक्त करता है।
- source_word: οὐ τελεσφοροῦσιν
  choice: उनका फल पक नहीं पाता
  rationale: τελεσφορέω फल को पूर्णता या परिपक्वता तक पहुँचाने का अर्थ रखता है। यह अनुवाद फल के रूपक और अधूरी परिपक्वता, दोनों को बनाए रखता है।
theological_decisions:
- issue: काँटों वाली भूमि के सुनने वालों की विफलता का धर्मवैज्ञानिक स्वरूप
  choice: वचन सुनने और फल के परिपक्व न होने का वर्णन रखा गया है, पर उनके पुनर्जन्म, धर्मत्याग या प्रतिफल के विषय में कोई निष्कर्ष नहीं जोड़ा गया।
  alternative: इसे झूठे विश्वासियों, उद्धार खो चुके सच्चे विश्वासियों, या केवल प्रतिफल खोने वालों का निश्चित वर्णन मानना।
  rationale: पद सांसारिक चिंताओं, धन और सुखों के दबाव तथा अपरिपक्व फल का वर्णन करता है, पर बाद के धर्मवैज्ञानिक विवादों का स्पष्ट निर्णय नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। कृषि-रूपक को ‘काँटे’ और ‘फल पकना’ द्वारा बनाए रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
