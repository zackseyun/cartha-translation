source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: hi
  text: जब यीशु लौटे, तो भीड़ ने उनका स्वागत किया[a], क्योंकि वे सब उनकी प्रतीक्षा कर रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भीड़ ने उन्हें ग्रहण किया”; यूनानी क्रिया का अर्थ ग्रहण करना या स्वागत करना हो सकता है, और इस प्रसंग में भाव सकारात्मक है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि वे सब उनके आने की अपेक्षा कर रहे थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: जब ... लौटे, तो
  rationale: ἐν + सप्रत्यय क्रियार्थक संज्ञा यहाँ समयसूचक उपवाक्य बनाती है। δέ कथा को आगे बढ़ाता है; हिन्दी में स्वाभाविक ‘जब ... तो’ रचना उसका पर्याप्त संकेत देती है।
- source_word: ὑποστρέφειν
  choice: लौटे
  rationale: क्रिया का सामान्य अर्थ वापस आना या लौटना है; ‘लौटे’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀπεδέξατο
  choice: स्वागत किया
  rationale: यहाँ क्रिया अनुकूल भाव से ग्रहण करने का संकेत देती है। ‘स्वागत किया’ आधुनिक हिन्दी में उस सकारात्मक अर्थ को स्पष्ट करता है, बिना ‘खुशी से’ जैसा अतिरिक्त भाव जोड़े।
- source_word: ὁ ὄχλος
  choice: भीड़
  rationale: यह शब्द एकत्र जनसमूह को दर्शाता है; ‘भीड़’ सहज आधुनिक हिन्दी है।
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: क्योंकि वे सब उनकी प्रतीक्षा कर रहे थे
  rationale: γάρ स्वागत का कारण बताता है। προσδοκάω में प्रतीक्षा और अपेक्षा दोनों अर्थ संभव हैं; इस आगमन-प्रसंग में ‘प्रतीक्षा कर रहे थे’ स्वाभाविक है और चल रही अवस्था को सुरक्षित रखता है।
- source_word: πάντες
  choice: वे सब
  rationale: ‘सब’ को स्पष्ट रखकर पूरे जनसमूह की प्रतीक्षा पर मूल का बल सुरक्षित किया गया है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिन्दी रूप अपनाया गया है।
