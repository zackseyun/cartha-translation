  to: तब उसने उनसे कहा, “तुम्हारा विश्वास[a] कहाँ है?” वे डर गए और अचंभित हुए, और एक-दूसरे से कहने लगे, “आखिर यह कौन है, जो हवाओं और पानी तक को आज्ञा देता है, और वे उसकी आज्ञा मानते हैं?”
