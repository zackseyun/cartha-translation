source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: hi
  text: तब उसने उनसे कहा, “तुम्हारा विश्वास[a] कहाँ है?” वे डर गए और अचंभित हुए, और एक-दूसरे से कहने लगे, “आखिर यह कौन है, जो हवाओं और पानी तक को आज्ञा देता है, और वे उसकी आज्ञा मानते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “भरोसा।” यीशु के प्रश्न का अर्थ यह भी समझा जा सकता है: “तुम्हारा भरोसा कहाँ है?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: कहाँ
  rationale: स्थानवाचक प्रश्न की सीधी और तीखी अभिव्यक्ति को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘तुम्हें विश्वास क्यों नहीं है’ नहीं बनाया गया।
- source_word: πίστις
  choice: विश्वास
  rationale: यह सामान्य और व्यापक हिन्दी समतुल्य है; इस प्रसंग में भरोसे की छाया भी समाहित है, जिसे पादटिप्पणी में दर्शाया गया है।
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: वे डर गए और अचंभित होकर
  rationale: भय और विस्मय दोनों प्रतिक्रियाओं को उनके क्रम सहित स्वाभाविक हिन्दी में व्यक्त करता है, बिना भय की तीव्रता बढ़ाए।
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: आखिर यह कौन है
  rationale: ἄρα की निष्कर्षात्मक और विस्मयभरी शक्ति को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐπιτάσσει
  choice: आज्ञा देता है
  rationale: क्रिया के आदेश देने वाले सीधे अर्थ को व्यक्त करता है; पिछले पद के आधार पर ‘डाँटता है’ नहीं जोड़ा गया।
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: हवाओं और पानी
  rationale: यूनानी के बहुवचन ‘हवाओं’ और एकवचन ‘पानी’ को निकटता से सुरक्षित रखता है; ‘लहरें’ या ‘समुद्र’ नहीं जोड़ा गया।
- source_word: ὑπακούουσιν αὐτῷ
  choice: वे उसकी मानते हैं
  rationale: सृष्टि के मानवीकरण के साथ आज्ञापालन का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: 'πίστις का अर्थ: विश्वास या भरोसा'
  choice: विश्वास
  alternative: भरोसा
  rationale: ‘विश्वास’ शब्द मूल की व्यापक धार्मिक और संबंधपरक अर्थ-सीमा को बनाए रखता है, जबकि प्रसंगगत ‘भरोसा’ को वैध विकल्प के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘आखिर’ शिष्यों के विस्मय और ἄρα की निष्कर्षात्मक शक्ति को सहज रूप से व्यक्त करता है।
