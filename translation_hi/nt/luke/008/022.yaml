  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: hi
  text: उन दिनों में एक दिन ऐसा हुआ कि वह और उसके चेले एक नाव में सवार हुए। उसने उनसे कहा, “आओ, झील के उस पार चलें।”[a] तब वे नाव लेकर चल पड़े।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आओ, झील के दूसरे किनारे चलें।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया नौका के संदर्भ में “नाव खोलकर चलना,” “नाव आगे बढ़ाना,” या “रवाना होना” भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य कथा-आरंभ अभिव्यक्ति है। ‘ऐसा हुआ कि’ उसके घटना-परिचायक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; δέ के हल्के संयोजक बल को अलग भारी शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: उन दिनों में से एक दिन
  rationale: यह अनिश्चित दिन को एक ज्ञात समयावधि के भीतर रखता है और यूनानी के अंशवाचक भाव को बनाए रखता है।
- source_word: αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: वह अपने चेलों के साथ एक नाव पर चढ़ा
  rationale: यह स्वाभाविक हिन्दी में स्पष्ट करता है कि वह और उसके चेले नाव में सवार हुए, बिना αὐτός पर अनावश्यक आत्मवाचक जोर डाले।
- source_word: εἶπεν πρὸς αὐτούς
  choice: उनसे कहा
  rationale: λέγω + πρός का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Διέλθωμεν
  choice: आओ, … चलें
  rationale: प्रथम पुरुष बहुवचन संभावनार्थक यहाँ सम्मिलित प्रस्ताव या आग्रह है; ‘आओ … चलें’ उसका सहज हिन्दी रूप है।
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: झील के उस पार
  rationale: τὸ πέραν गंतव्य रूप में झील की दूसरी ओर को दर्शाता है; ‘उस पार’ संक्षिप्त, स्पष्ट और मुहावरेदार है।
- source_word: ἀνήχθησαν
  choice: वे चल पड़े
  rationale: यह प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है। क्रिया के विशिष्ट नौकायन-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
