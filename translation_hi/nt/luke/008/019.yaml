  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: hi
  text: तब उसकी माता और उसके भाई[b] उसके पास आए, पर भीड़ के कारण वे उस तक पहुँच नहीं सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे मिल नहीं सके” अथवा “उसके पास नहीं पहुँच सके।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “भाई”; कुछ लोग इसका व्यापक अर्थ “रिश्तेदार” या “कुटुम्बी” समझते हैं, पर मूल पाठ स्वयं “भाई” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: तब ... उसके पास आए
  rationale: यह वाक्यांश कथा में अगले घटनाक्रम और यीशु की ओर उसके परिवार के आने को व्यक्त करता है। हिन्दी में बहुवचन कर्ता के अनुसार ‘आए’ स्वाभाविक है।
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: उसकी माता और उसके भाई
  rationale: ‘माता’ और ‘भाई’ मूल के प्रत्यक्ष संबंध-सूचक शब्दों को बनाए रखते हैं। ἀδελφοί पुल्लिंग बहुवचन है; इसलिए इसे व्यापक अर्थ वाले ‘रिश्तेदार’ से नहीं बदला गया।
- source_word: οὐκ ἠδύναντο
  choice: नहीं सके
  rationale: यह अपूर्णकालीन क्रिया उस परिस्थिति में उनकी असमर्थता व्यक्त करती है; संक्षिप्त हिन्दी ‘नहीं सके’ स्वाभाविक और स्पष्ट है।
- source_word: συντυχεῖν αὐτῷ
  choice: उस तक पहुँच
  rationale: संदर्भ में भीड़ के कारण संपर्क न कर पाने का व्यावहारिक भाव है। ‘पहुँचना’ इसे स्वाभाविक रूप से व्यक्त करता है, जबकि ‘मिलना’ भी संभव अर्थ है।
- source_word: διὰ τὸν ὄχλον
  choice: भीड़ के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: ‘उसके भाई’ का सटीक पारिवारिक संबंध
  choice: मूल के अनुसार ‘उसके भाई’
  alternative: ‘उसके रिश्तेदार’ या ‘उसके कुटुम्बी’
  rationale: मूल पाठ ἀδελφοί कहता है। वह यह स्पष्ट नहीं करता कि वे सगे भाई, सौतेले भाई या किसी व्यापक अर्थ में संबंधी थे; इसलिए अनुवाद इस ऐतिहासिक धर्मवैज्ञानिक विवाद का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘माता’ बाइबलीय प्रसंग के अनुकूल सम्मानजनक है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
