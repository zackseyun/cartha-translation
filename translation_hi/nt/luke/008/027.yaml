  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: hi
  text: जब वह उतरकर भूमि पर आया[a], तो नगर का एक आदमी उसे मिला, जिसमें दुष्टात्माएँ थीं[b]। और वह बहुत समय से कोई वस्त्र नहीं पहना था, और किसी घर में नहीं रहता था, बल्कि कब्रों के बीच रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार रूप में, “जब उसने किनारे पर कदम रखा।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो दुष्टात्माओं से ग्रस्त था।” यूनानी में शाब्दिक रूप से “जिसमें दुष्टात्माएँ थीं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: जब वह उतरकर भूमि पर आया
  rationale: यह दत्तिव कृदन्त को कालवाचक रूप में व्यक्त करता है और नाव से भूमि पर आने का प्रसंग स्वाभाविक हिन्दी में स्पष्ट करता है, बिना ‘किनारे’ को मूल पाठ में अनिवार्य मानने के।
- source_word: ὑπήντησεν
  choice: उसे मिला
  rationale: सीधी भेंट या सामना होने के साधारण कथात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  choice: नगर का एक पुरुष
  rationale: ἀνήρ के पुरुष-सूचक अर्थ और τις की अनिश्चितता को बनाए रखता है; ἐκ τῆς πόλεως को सम्बन्ध अथवा उद्गम के अर्थ में ‘नगर का’ कहा गया है।
- source_word: ἔχων δαιμόνια
  choice: जिसमें दुष्टात्माएँ थीं
  rationale: यूनानी के शाब्दिक ‘दुष्टात्माएँ रखने/होने’ के निकट रहता है और मुख्य पाठ में अधिक व्याख्यात्मक ‘दुष्टात्माओं से ग्रस्त’ को आरोपित नहीं करता।
- source_word: χρόνῳ ἱκανῷ
  choice: बहुत समय से
  rationale: पर्याप्त या लंबी अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: उसने कोई वस्त्र नहीं पहना था
  rationale: ἐνδύω के ‘पहनना’ और ἱμάτιον के वस्त्र-सूचक अर्थ को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: वह किसी घर में नहीं रहता था
  rationale: अपूर्णकाल की प्रचलित या निरंतर अवस्था तथा μένω के यहाँ ‘रहना’ अर्थ को सहज हिन्दी में प्रस्तुत करता है।
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: बल्कि कब्रों के बीच रहता था
  rationale: विरोधसूचक ἀλλά को स्पष्ट रखता है और दफनाने के स्थानों के बीच निवास का दृश्य साधारण पाठकों के लिए स्वाभाविक भाषा में देता है।
theological_decisions:
- issue: δαιμόνια का अनुवाद
  choice: दुष्टात्माएँ
  alternative: अशुद्ध आत्माएँ
  rationale: यहाँ मूल शब्द δαιμόνια है, πνεύματα ἀκάθαρτα नहीं; इसलिए दोनों यूनानी अभिव्यक्तियों को बिना कारण एक नहीं किया गया।
- issue: ἔχων δαιμόνια को ‘ग्रस्त’ के रूप में प्रस्तुत करना
  choice: जिसमें दुष्टात्माएँ थीं
  alternative: जो दुष्टात्माओं से ग्रस्त था
  rationale: मुख्य पाठ मूल की ‘having demons’ संरचना के निकट रहता है; अधिक प्रचलित किंतु व्याख्यात्मक रूप को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘भूमि पर आया’ मूल की व्यापक अभिव्यक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी नाव से उतरने के प्रसंगानुकूल मुहावरेदार विकल्प देती है। ‘कब्रों के बीच’ को तकनीकी या अत्यधिक विशिष्ट पुरातात्त्विक शब्दावली से अधिक सहज माना गया है।
