  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: hi
  text: तब दुष्टात्माएँ उस मनुष्य में से निकलकर सूअरों में जा घुसीं। और सूअरों का झुंड खड़ी ढलान से नीचे की ओर[a] दौड़ पड़ा और झील में जा गिरा और डूब गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चट्टान से नीचे’ अथवा ‘कगार के ऊपर से’; यूनानी शब्द खड़ी उतराई को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: निकलकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया को दिखाता है; ‘निकलकर’ हिन्दी में इस क्रम को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माएँ
  rationale: यहाँ प्रयुक्त संज्ञा विशेष रूप से अलौकिक दुष्ट सत्ताओं को सूचित करती है। आधुनिक हिन्दी में ‘दुष्टात्माएँ’ स्पष्ट और प्रचलित है तथा इसे ‘अशुद्ध आत्माएँ’ जैसे भिन्न यूनानी पद से नहीं मिलाती।
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: उस मनुष्य में से
  rationale: निश्चित पदबंध पहले वर्णित मनुष्य की ओर संकेत करता है; ‘में से’ भीतर से बाहर आने की गति को स्पष्ट करता है।
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: सूअरों में जा घुसीं
  rationale: यूनानी पद सूअरों के भीतर प्रवेश करने की गति बताता है। ‘जा घुसीं’ आधुनिक हिन्दी में आकस्मिक प्रवेश का स्वाभाविक वर्णन है, बिना अतिरिक्त उद्देश्य जोड़े।
- source_word: χοίρους
  choice: सूअरों
  rationale: ‘सूअर’ आधुनिक मानक हिन्दी का सामान्य और सटीक शब्द है।
- source_word: ὥρμησεν
  choice: जा दौड़ा
  rationale: क्रिया अचानक और वेगपूर्ण गति व्यक्त करती है; ‘जा दौड़ा’ झुंड की तीव्र नीचे की ओर गति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἡ ἀγέλη
  choice: सूअरों का झुंड
  rationale: ‘झुंड’ सामूहिक संज्ञा का सामान्य हिन्दी रूप है; ‘सूअरों का’ जोड़ने से संदर्भ तत्काल स्पष्ट रहता है।
- source_word: κατὰ τοῦ κρημνοῦ
  choice: खड़ी ढलान से नीचे
  rationale: पदबंध तीखी उतराई के साथ नीचे की ओर गति दर्शाता है। यह अनुवाद उसे अनिवार्यतः सीधी चट्टान या कगार नहीं बनाता।
- source_word: εἰς τὴν λίμνην
  choice: झील में
  rationale: λίμνη का सामान्य अर्थ ‘झील’ है; लूका द्वारा प्रयुक्त शब्दभेद को बनाए रखा गया है।
- source_word: ἀπεπνίγη
  choice: डूब गया
  rationale: जल में गिरने के इस प्रसंग में क्रिया डूबकर मरने को व्यक्त करती है। एकवचन ‘झुंड’ के साथ ‘डूब गया’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: δαιμόνια का अनुवाद
  choice: दुष्टात्माएँ
  alternative: अशुद्ध आत्माएँ
  rationale: मूल पाठ में δαιμόνια है, न कि ‘अशुद्ध आत्माएँ’ वाला भिन्न पद। चुना हुआ रूप इस शाब्दिक भेद को बनाए रखता है और किसी अतिरिक्त धार्मिक वर्गीकरण को नहीं जोड़ता।
- issue: κρημνός में स्थलाकृति की तीव्रता
  choice: खड़ी ढलान
  alternative: चट्टान / कगार
  rationale: शब्द तीखी उतराई को सूचित कर सकता है, पर अनिवार्यतः एकदम सीधी चट्टान नहीं। मुख्य पाठ में अपेक्षाकृत खुला अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- issue: ἀπεπνίγη का वाच्य और परिणाम
  choice: डूब गया
  alternative: डुबो दिया गया
  rationale: रूप व्याकरणतः निष्क्रिय है, पर इस संदर्भ में हिन्दी का अकर्मक ‘डूब गया’ स्वाभाविक रूप से घटना और मृत्यु का परिणाम व्यक्त करता है, बिना किसी बाहरी कर्ता का संकेत दिए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य को दो भागों में बाँटने से घटनाक्रम सहज पढ़ा जाता है। ‘दुष्टात्माएँ’, ‘सूअर’, ‘झुंड’ और ‘झील’ सामान्य पाठक के लिए परिचित शब्द हैं।
