base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: hi
  text: और हेरोदेस के भंडारी खूजा की पत्नी योअन्ना, और सुसन्ना, और बहुत-सी अन्य स्त्रियाँ, जो अपनी संपत्ति से उन सब की[a] सेवा करती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में यहाँ एकवचन है: “उसकी [सेवा]।”'
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: खूजा की पत्नी
  rationale: व्यक्तिवाचक नाम के संबंधकारक के साथ γυνή यहाँ स्वाभाविक रूप से वैवाहिक संबंध बताता है।
- source_word: ἐπιτρόπου
  choice: भण्डारी
  rationale: यह किसी के मामलों या सम्पत्ति की देखरेख के लिए नियुक्त अधिकारी को दर्शाता है; राज-दरबार अथवा गृह-प्रबंध के संदर्भ में ‘भण्डारी’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ἕτεραι πολλαί
  choice: बहुत-सी अन्य स्त्रियाँ
  rationale: स्त्रीलिंग बहुवचन को हिन्दी में स्पष्ट करने के लिए ‘स्त्रियाँ’ जोड़ा गया है।
- source_word: διηκόνουν
  choice: सेवा करती थीं
  rationale: यह व्यापक सेवा या सहायता का भाव बनाए रखता है और अनावश्यक रूप से किसी बाद की कलीसियाई पदवी का संकेत नहीं देता।
- source_word: αὐτοῖς
  choice: उनकी
  rationale: मुद्रित SBLGNT पाठ में बहुवचन है, जिसका स्वाभाविक संदर्भ यीशु और उनके साथियों से है।
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: अपनी सम्पत्ति से
  rationale: यह स्त्रियों के अपने अधिकार में मौजूद संसाधनों अथवा साधनों से दी गई सहायता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: αὐτοῖς का वचन और संदर्भ
  choice: 'बहुवचन: ‘उनकी सेवा’—यीशु और उनके साथियों की'
  alternative: 'एकवचन: ‘उनकी सेवा’—केवल यीशु की; हिन्दी सर्वनाम में वचन स्पष्ट नहीं होता'
  rationale: प्रदत्त SBLGNT पाठ बहुवचन αὐτοῖς पढ़ता है। हिन्दी ‘उनकी’ आदरसूचक एकवचन भी हो सकता है, इसलिए पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
- issue: सेवा का स्वरूप
  choice: व्यापक ‘सेवा’, जिसका साधन अपनी सम्पत्ति थी
  alternative: केवल आर्थिक सहायता या भोजन-व्यवस्था के रूप में स्पष्ट करना
  rationale: διηκόνουν व्यापक है, जबकि अगला वाक्यांश संसाधनों के स्रोत को बताता है; इसलिए मुख्य पाठ सेवा के स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण शैली रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘हेरोदेस’, ‘खूजा’, ‘योअन्ना’ और ‘सूसन्ना’ अपनाए गए हैं। ‘बहुत-सी अन्य स्त्रियाँ’ से यूनानी स्त्रीलिंग बहुवचन स्पष्ट होता है।
