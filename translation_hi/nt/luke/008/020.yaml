base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: hi
  text: तब उसे बताया गया, “आपकी माँ और आपके भाई[a] बाहर खड़े हैं और आपको देखना चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रिश्तेदार’; यदि प्रसंग में ἀδελφοί को व्यापक अर्थ में समझा जाए। यूनानी शब्द का सामान्य अर्थ ‘भाई’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: उसे बताया गया
  rationale: अओरिस्ट कर्मवाच्य को स्वाभाविक हिन्दी में रखते हुए यह व्यक्त करता है कि यीशु तक यह समाचार पहुँचाया गया।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ हिन्दी में प्रसंग की अगली घटना को सहज रूप से जोड़ता है।
- source_word: μήτηρ
  choice: माँ
  rationale: ‘माँ’ आधुनिक मानक हिन्दी में स्वाभाविक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज शब्द है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: पुल्लिंग बहुवचन ἀδελφοί का सामान्य अर्थ ‘भाई’ है; अनुवाद बिना व्याख्यात्मक विस्तार के इसी प्रत्यक्ष अर्थ को रखता है।
- source_word: ἑστήκασιν
  choice: खड़े हैं
  rationale: पूर्णकालिक रूप यहाँ वर्तमान परिणामी अवस्था बताता है; ‘खड़े हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔξω
  choice: बाहर
  rationale: स्थानवाचक क्रियाविशेषण का सीधा अनुवाद है और पाठ में न दिए गए किसी भवन या स्थान को नहीं जोड़ता।
- source_word: ἰδεῖν
  choice: देखना
  rationale: ὁράω के मूल अर्थ को सुरक्षित रखता है; ‘मिलना’ प्रसंग में संभव भाव है, पर वह अधिक व्याख्यात्मक होगा।
- source_word: θέλοντες
  choice: चाहते हैं
  rationale: वर्तमान कृदंत माँ और भाइयों की उसी समय की इच्छा बताता है; हिन्दी में इसे संयुक्त क्रिया के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: αὐτῷ / σου / σε
  choice: उसे / आपकी / आपको
  rationale: वर्णन में परोक्ष कर्म ‘उसे’ रखा गया है, जबकि प्रत्यक्ष संबोधन में आधुनिक सम्मानसूचक हिन्दी ‘आप’ का प्रयोग स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: यीशु के परिवार के संबंध में ἀδελφοί का आशय
  choice: ‘भाई’ के रूप में अनुवाद
  alternative: रिश्तेदार
  rationale: इस पद में प्रयुक्त यूनानी शब्द का सामान्य अर्थ ‘भाई’ है। यीशु के पारिवारिक संबंधों पर बाद की धर्मवैज्ञानिक व्याख्याओं को पाठ में आरोपित न करते हुए मुख्य पाठ सीधा शब्दार्थ रखता है और व्यापक संभावित अर्थ को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण कथात्मक रूप अपनाया गया है। संवाद में सम्मानसूचक ‘आप’ रखा गया है। वाक्य-संरचना संक्षिप्त है और यूनानी पाठ के स्थान, अवस्था तथा इच्छा-संबंधी अर्थों को बिना अनावश्यक विस्तार के सुरक्षित रखती है।
