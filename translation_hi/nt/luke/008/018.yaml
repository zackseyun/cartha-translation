id: LUK.8.18
reference: Luke 8:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: hi
  text: इसलिए ध्यान दो कि तुम किस तरह सुनते हो; क्योंकि जिसके पास है, उसे और दिया जाएगा, और जिसके पास नहीं है, उससे वह भी ले लिया जाएगा जो वह समझता है कि उसके पास है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके पास है ऐसा प्रतीत होता है, वह भी उससे ले लिया जाएगा।”
    reason: δοκεῖ का अर्थ ‘वह समझता है’ अथवा ‘प्रतीत होता है’ हो सकता है; पादटिप्पणी इस वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: βλέπετε
  choice: ध्यान दो
  rationale: यह आज्ञार्थक क्रिया यहाँ शाब्दिक रूप से देखने के बजाय सावधान होकर ध्यान देने का आह्वान करती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष और सुनने के विषय से तार्किक संबंध को स्पष्ट करता है।
- source_word: πῶς ἀκούετε
  choice: तुम किस तरह सुनते हो
  rationale: πῶς सुनने के ढंग पर बल देता है, जबकि ἀκούετε यहाँ केवल ध्वनि सुनने से आगे ग्रहणशील और उत्तरदायी सुनने का भाव रखता है।
- source_word: ὃς ἂν ... ἔχῃ
  choice: जिसके पास है
  rationale: ἄν के साथ संबंधवाचक उपवाक्य एक सामान्य, अनिश्चित शर्त व्यक्त करता है; हिंदी में यह रूप कहावत-जैसी व्यापकता बनाए रखता है।
- source_word: δοθήσεται αὐτῷ
  choice: उसे और दिया जाएगा
  rationale: यूनानी में कर्म स्पष्ट नहीं है, पर समानांतर वाक्य-विन्यास वृद्धि का संकेत देता है; अर्थ को स्वाभाविक हिंदी में व्यक्त करने के लिए ‘और’ जोड़ा गया है।
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: जिसके पास नहीं है
  rationale: यह पहले सामान्य संबंधवाचक उपवाक्य के साथ विरोधात्मक समानांतरता बनाए रखता है।
- source_word: ὃ δοκεῖ ἔχειν
  choice: जो वह समझता है कि उसके पास है
  rationale: δοκέω का अर्थ ‘समझना’ या ‘प्रतीत होना’ हो सकता है। मुख्य पाठ में आत्मधारणा का स्वाभाविक हिंदी रूप रखा गया है और दूसरे संभव अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: उससे ... ले लिया जाएगा
  rationale: भविष्यत् कर्मवाच्य यहाँ किसी वस्तु से वंचित किए जाने या उसे हटा लिए जाने का अर्थ देता है।
- source_word: αὐτῷ / αὐτοῦ
  choice: उसे / उससे
  rationale: संदर्भित व्यक्ति के लिए हिंदी के स्वाभाविक एकवचन सर्वनाम प्रयुक्त हैं; ये अनावश्यक रूप से लिंग नहीं जोड़ते।
theological_decisions:
- issue: ‘होने’ और ‘न होने’ संबंधी विरोधाभासी कहावत का अर्थ
  choice: कथन को यीशु की बात सुनने और उसे ग्रहण करने के तात्कालिक संदर्भ में खुला रखा गया है।
  alternative: इसे पूर्वनियति, मानवीय योग्यता, भौतिक समृद्धि या किसी विशिष्ट भंडारीपन-सिद्धांत का स्पष्ट कथन माना जा सकता है।
  rationale: पद स्वयं सुनने के ढंग से जुड़ा एक विरोधाभासी सिद्धांत बताता है। अनुवाद किसी ऐसी धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं जोड़ता जिसे मूल वाक्य स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक शिक्षा के अनुकूल शैली रखी गई है। ‘ध्यान दो’ चेतावनी का बल बनाए रखता है, और अर्धविराम कारणसूचक अगले कथन से स्पष्ट संबंध दिखाता है।
