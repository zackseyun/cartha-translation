id: LUK.8.12
reference: Luke 8:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: hi
  text: और मार्ग के किनारे वाले वे लोग हैं जिन्होंने सुना है; फिर शैतान आता है और उनके हृदयों में से वचन उठा ले जाता है, ताकि वे विश्वास न करें और उद्धार न पाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: मार्ग के किनारे
  rationale: παρά के स्थानवाचक अर्थ और बोए गए बीज के चित्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀκούσαντες
  choice: जिन्होंने सुना है
  rationale: अओरिस्ट कृदन्त उन लोगों की पहचान उनके सुन चुकने से कराता है; हिन्दी का पूर्ण पक्ष व्याख्यात्मक संदर्भ में स्वाभाविक है।
- source_word: εἶτα
  choice: फिर
  rationale: इसके बाद होने वाली क्रिया का सीधा क्रम व्यक्त करता है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: यहाँ शब्द व्यक्तिगत दुष्ट सत्ता को सूचित करता है; हिन्दी में ‘शैतान’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: αἴρει
  choice: उठा ले जाता है
  rationale: हृदय से वचन को हटा देने या ले जाने का अर्थ व्यक्त करता है और क्रिया की रीति को अनावश्यक रूप से ‘छीनने’ तक तीव्र नहीं बनाता।
- source_word: τὸν λόγον
  choice: वचन
  rationale: दृष्टान्त के संदर्भ में यह परमेश्वर के घोषित संदेश को सूचित करता है; ‘वचन’ स्थापित बाइबलीय प्रयोग को बनाए रखता है।
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: उनके हृदयों में से
  rationale: ἀπό के स्रोत/वियोग और καρδίας के एकवचन रूप के साथ बहुवचन सर्वनाम के सामूहिक वितरण को स्वाभाविक हिन्दी बहुवचन में व्यक्त करता है।
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: ताकि वे विश्वास करके उद्धार न पाएँ
  rationale: नकार का मुख्य संबंध σωθῶσιν से रखते हुए πιστεύσαντες की कृदन्तीय, पूर्ववर्ती परिस्थिति को ‘विश्वास करके’ से सुरक्षित रखता है; साथ ही शैतान की मंशा का भाव बना रहता है।
- source_word: πιστεύσαντες
  choice: विश्वास करके
  rationale: πιστεύω का सीधा और धार्मिक रूप से तटस्थ हिन्दी समतुल्य है तथा कृदन्त की अधीन रचना को बनाए रखता है।
- source_word: σωθῶσιν
  choice: उद्धार पाएँ
  rationale: लूका के इस संदर्भ में पूर्ण उद्धार का अर्थ है; ‘उद्धार पाएँ’ हिन्दी बाइबल-प्रयोग में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: विश्वास और उद्धार का संबंध
  choice: ‘विश्वास करके उद्धार न पाएँ’
  alternative: ‘विश्वास न करें और उद्धार न पाएँ’
  rationale: यूनानी में πιστεύσαντες कृदन्त है और σωθῶσιν मुख्य क्रिया; चुना हुआ रूप इस व्याकरणिक संबंध को सुरक्षित रखता है तथा विश्वास और उद्धार के व्यापक सिद्धान्तगत संबंध को किसी सम्प्रदायगत ढाँचे में नहीं बाँधता।
- issue: ἵνα μή में उद्देश्य अथवा परिणाम
  choice: ‘ताकि’
  alternative: ‘कहीं ऐसा न हो कि’
  rationale: संदर्भ में शैतान द्वारा वचन हटाने की मंशा प्रमुख है। ‘ताकि’ उद्देश्य को स्पष्ट करता है, जबकि यूनानी रचना में निहित उद्देश्य/परिणाम की निकटता को किसी अतिरिक्त व्याख्या से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘मार्ग’, ‘हृदय’, ‘वचन’, ‘विश्वास’ और ‘उद्धार’ जैसे परिचित धार्मिक शब्द रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
