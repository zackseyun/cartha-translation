review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the sequence, the devil's removal of the word, and the plural/distributive sense of ‘their hearts.’ However, ‘विश्वास करके उद्धार न पाएँ’ can imply that they do believe but fail to receive salvation. The Greek negation prevents both believing and being saved; Hindi should make that scope clear.
  naturalness: ‘मार्ग के किनारे वाले वे हैं’ is understandable but somewhat elliptical in modern Hindi. Adding ‘लोग’ makes the referent and syntax more natural without adding interpretive content.
  terminology: ‘शैतान,’ ‘वचन,’ ‘हृदय,’ ‘विश्वास,’ and ‘उद्धार’ are appropriate, established Hindi biblical terms. No footnote is required for this verse.
  issues:
  - severity: medium
    issue: The final purpose clause is semantically ambiguous in Hindi.
    rationale: ‘ताकि वे विश्वास करके उद्धार न पाएँ’ may be read as ‘so that, having believed, they may not receive salvation.’ In Greek, μή negates the purpose of believing-and-being-saved. ‘ताकि वे विश्वास न करें और उद्धार न पाएँ’ clearly preserves this meaning.
  - severity: low
    issue: The opening nominal expression is slightly unnatural.
    rationale: ‘मार्ग के किनारे वाले वे हैं’ leaves the personal referent implicit. ‘मार्ग के किनारे वाले वे लोग हैं’ is natural modern Hindi and retains the source's referential ellipsis.
  revised_text: और मार्ग के किनारे वाले वे लोग हैं जिन्होंने सुना है; फिर शैतान आता है और उनके हृदयों में से वचन उठा ले जाता है, ताकि वे विश्वास न करें और उद्धार न पाएँ।
  revised_footnotes: []
  revision_rationale: The revision clarifies that the devil's purpose is to prevent both faith and salvation, rather than suggesting salvation is withheld from people after they believe. It also smooths the opening expression by explicitly identifying the referents as people. All other wording is retained because it faithfully reflects the Greek and suits modern standard Hindi.
