revisions:
- from: और मार्ग के किनारे वाले वे हैं जिन्होंने सुना है; फिर शैतान आता है और उनके हृदयों में से वचन उठा ले जाता है, ताकि वे विश्वास करके उद्धार न पाएँ।
  to: और मार्ग के किनारे वाले वे लोग हैं जिन्होंने सुना है; फिर शैतान आता है और उनके हृदयों में से वचन उठा ले जाता है, ताकि वे विश्वास न करें और उद्धार न पाएँ।
  rationale: The revision clarifies that the devil's purpose is to prevent both faith and salvation, rather than suggesting salvation is withheld from people after they believe. It also smooths the opening expression by explicitly identifying the referents as people. All other wording is retained because it faithfully reflects the Greek and suits modern standard Hindi.
  reviewer_model: gpt-5.6-terra
