id: LUK.8.49
reference: Luke 8:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: hi
  text: जब वह अब भी बोल रहा था, तब आराधनालय के अगुए के यहाँ से कोई आया और बोला, “आपकी बेटी मर गई है। अब शिक्षक को और कष्ट न दीजिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: जब वह अभी बोल ही रहा था
  rationale: यह संबंधकारक निरपेक्ष रचना उसी समय जारी क्रिया को व्यक्त करती है। ‘अभी बोल ही रहा था’ ἔτι के ‘अब भी/अभी’ भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔρχεταί τις
  choice: कोई आया
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है और τις की अनिश्चितता ‘कोई’ में सुरक्षित है।
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: आराधनालय के अगुए के यहाँ से
  rationale: παρά के संबंधकारक प्रयोग में स्रोत का अर्थ है। यह वाक्यांश बताता है कि व्यक्ति आराधनालय के अगुए की ओर से अथवा उसके यहाँ से आया; हिन्दी अभिव्यक्ति मूल की इस हल्की अस्पष्टता को बनाए रखती है।
- source_word: λέγων
  choice: और बोला
  rationale: संदेश का परिचय देने वाले कृदंत को स्वाभाविक हिन्दी कथन-क्रम में समापिका क्रिया से व्यक्त किया गया है।
- source_word: Τέθνηκεν
  choice: मर गई है
  rationale: पूर्ण काल मृत्यु की घटना और उससे उत्पन्न वर्तमान अवस्था दोनों व्यक्त करता है; ‘मर गई है’ हिन्दी में दोनों पहलुओं को सहज रूप से रखता है।
- source_word: ἡ θυγάτηρ σου
  choice: आपकी बेटी
  rationale: अर्थ सीधा रखा गया है। प्रसंग में आराधनालय के अगुए को संबोधन होने के कारण सम्मानसूचक ‘आपकी’ स्वाभाविक है; यूनानी एकवचन सर्वनाम सम्मान-स्तर निर्धारित नहीं करता।
- source_word: μηκέτι σκύλλε
  choice: अब ... और कष्ट न दीजिए
  rationale: μηκέτι का आगे से रोक देने का भाव ‘अब ... और नहीं’ में आता है, और σκύλλω के ‘कष्ट देना/परेशान करना’ अर्थ को गरिमापूर्ण आधुनिक हिन्दी में ‘कष्ट देना’ से व्यक्त किया गया है।
- source_word: τὸν διδάσκαλον
  choice: गुरु को
  rationale: यहाँ διδάσκαλος का सामान्य अर्थ ‘शिक्षक’ है। यीशु के संबोधन में ‘गुरु’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और सम्मानपूर्ण है तथा अनावश्यक रूप से कोई ऊँची धर्मवैज्ञानिक उपाधि नहीं जोड़ता।
theological_decisions:
- issue: ἀρχισυνάγωγος की संस्थागत भूमिका
  choice: आराधनालय का अगुआ
  alternative: आराधनालय का अधिकारी
  rationale: शब्द स्थानीय यहूदी आराधनालय के नेतृत्वकारी अधिकारी को दर्शाता है। ‘अगुआ’ भूमिका को स्पष्ट रखता है और बाद की कलीसियाई पदावली आरोपित नहीं करता।
- issue: διδάσκαλος का संबोधन
  choice: गुरु
  alternative: शिक्षक
  rationale: मूल में सामान्यतः ‘शिक्षक’ अर्थ वाला संबोधन है। हिन्दी प्रसंग में ‘गुरु’ उसी सम्मानपूर्ण संबोधन को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘स्वामी’ जैसी अधिक व्याख्यात्मक उपाधि अपनाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में आराधनालय के अगुए के प्रति सामाजिक सम्मान दिखाने के लिए ‘आपकी’ और ‘दीजिए’ प्रयुक्त हैं। मूल पाठ में कोई ऐसी पाठगत या अर्थगत कठिनाई नहीं है जिसके लिए प्रकाशन-पाठ में पादटिप्पणी आवश्यक हो।
