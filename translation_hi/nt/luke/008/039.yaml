source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: hi
  text: “अपने घर लौट जा और बता कि परमेश्वर ने तेरे लिए क्या-क्या किया है।” तब वह चला गया और सारे नगर में यह घोषणा करता रहा कि यीशु ने उसके लिए क्या-क्या किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: लौट जा
  rationale: वर्तमान काल की आज्ञा अपने पहले स्थान पर वापस जाने का सीधा आदेश देती है; आधुनिक हिन्दी में ‘लौट जा’ स्वाभाविक और संक्षिप्त है।
- source_word: εἰς τὸν οἶκόν σου
  choice: अपने घर
  rationale: εἰς के साथ οἶκος यहाँ गंतव्य और निवास-स्थान को सूचित करता है; ‘अपने घर’ स्थान और घर-वापसी, दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: διηγοῦ
  choice: बता
  rationale: διηγέομαι का अर्थ विस्तार से सुनाना या वर्णन करना हो सकता है; इस आज्ञा में ‘बता’ सरल, वर्तमान और प्रसंगानुकूल है।
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: परमेश्वर ने तेरे लिए क्या-क्या किया है
  rationale: ὅσα की व्यापकता ‘क्या-क्या’ से व्यक्त होती है। मूल में ‘महान’ जैसा कोई विशेषण नहीं है, इसलिए उसे जोड़े बिना कार्यों की बहुलता और परिमाण बनाए रखा गया है। यूनानी भूतकाल के परिणाम वर्तमान तक प्रासंगिक होने के कारण हिन्दी में पूर्ण वर्तमान स्वाभाविक है।
- source_word: ἀπῆλθεν
  choice: वह चला गया
  rationale: यह घटनास्थल से उसके प्रस्थान को बताता है; ‘चला गया’ सहज कथात्मक हिन्दी है।
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: सारे नगर में
  rationale: κατά यहाँ वितरणात्मक अर्थ रखता है, अर्थात नगर भर में; ‘सारे नगर में’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κηρύσσων
  choice: घोषणा करता रहा
  rationale: κηρύσσω सार्वजनिक रूप से प्रचारित या घोषित करने का भाव रखता है। ‘घोषणा’ इसकी सार्वजनिकता बनाए रखती है और कृदंत की जारी गतिविधि को ‘करता रहा’ व्यक्त करता है।
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उसके लिए क्या-क्या किया था
  rationale: पहले खंड के ὅσα के साथ समानता बनाए रखने के लिए फिर ‘क्या-क्या’ रखा गया है। कथानक की पूर्ववर्ती घटना के लिए ‘किया था’ स्वाभाविक है।
theological_decisions:
- issue: यीशु की आज्ञा में ‘परमेश्वर’ और उस व्यक्ति की घोषणा में ‘यीशु’ के बीच समानांतरता
  choice: 'दोनों पदों को ज्यों का त्यों अलग रखते हुए समानांतर भाषा: ‘परमेश्वर ने...’ / ‘यीशु ने...’'
  alternative: दोनों स्थानों पर ‘परमेश्वर’ या दोनों पर ‘यीशु’ करना, अथवा ‘अर्थात यीशु’ जोड़कर संबंध स्पष्ट करना
  rationale: लूका का पाठ परमेश्वर और यीशु को निकट कथात्मक समानांतरता में रखता है, पर उसका अर्थ संपादकीय जोड़ से स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव और संकेत को बिना समानीकरण या व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्रत्यक्ष संबोधन में एकवचन ‘तेरे/जा’ प्रसंग के व्यक्तिगत आदेश को स्वाभाविक रूप से व्यक्त करता है। ‘नगर’ बाइबलीय गद्य के लिए परिचित किंतु आज भी बोधगम्य है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘क्या-क्या’ ὅσα को बिना अतिरिक्त विशेषण के पर्याप्त रूप से व्यक्त करता है।
