    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: नाव से … पहुँचे
  rationale: क्रिया जलमार्ग से किसी स्थान तक आने या पहुँचने को व्यक्त करती है। हिंदी में ‘नाव से पहुँचे’ माध्यम और गंतव्य—दोनों को स्वाभाविक रूप से स्पष्ट करता है; κατά की संभावित दिशात्मक छाया को कृत्रिम रूप से ‘नीचे’ कहकर नहीं जोड़ा गया।
- source_word: χώραν
  choice: प्रदेश
  rationale: यहाँ शब्द किसी आधुनिक राष्ट्र के बजाय भूभाग या इलाके को दर्शाता है; ‘प्रदेश’ dignified और सामान्य हिंदी में उपयुक्त है।
- source_word: Γερασηνῶν
  choice: गिरासेनियों
  rationale: यूनानी जातिवाचक/निवासी-सूचक नाम का हिंदी लिप्यंतरण किया गया है और मुख्य पाठ में SBLGNT का पाठ रखा गया है।
- source_word: ἥτις
  choice: जो
  rationale: यह प्रदेश का वर्णन करने वाला संबंधवाचक उपवाक्य आरंभ करता है; हिंदी में ‘जो’ इसका सहज समतुल्य है।
- source_word: ἀντιπέρα
  choice: सामने दूसरी ओर
  rationale: यह गलील के आमने-सामने या जल के पार स्थित होने का भाव देता है। ‘सामने दूसरी ओर’ मूल की भौगोलिक संबंधवाचकता बनाए रखता है, बिना मुख्य पाठ में ‘झील’ जैसा अनुल्लिखित संज्ञा जोड़ने के।
- source_word: Γαλιλαίας
  choice: गलील
  rationale: स्थान-नाम का प्रचलित हिंदी रूप।
theological_decisions:
- issue: समानांतर सुसमाचारों और पांडुलिपियों में स्थान-नाम का पाठांतर
  choice: गिरासेनियों
  alternative: गदरेनियों अथवा गिरगासेनियों
  rationale: SBLGNT के मुख्य पाठ में Γερασηνῶν है, इसलिए मुख्य अनुवाद उसी का अनुसरण करता है। अन्य प्राचीन पाठों को समरस करके मिटाने के बजाय पादटिप्पणी में पारदर्शी रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘नाव से पहुँचे’ शाब्दिक कठोरता से बचते हुए मूल क्रिया का जलमार्ग-संबंधी अर्थ सुरक्षित रखता है।
