  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: hi
  text: और वे नाव से गिरासेनियों[a] के प्रदेश में पहुँचे, जो गलील के सामने है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
