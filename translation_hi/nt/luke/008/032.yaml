source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: hi
  text: वहाँ सूअरों का एक बड़ा झुंड[a] पहाड़ पर[b] चर रहा था। उन्होंने[c] उससे विनती की कि वह उन्हें उन सूअरों में प्रवेश करने दे; और उसने उन्हें अनुमति दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत-से सूअरों का झुंड’ अथवा ‘सूअरों का एक काफ़ी बड़ा झुंड।’
    reason: lexical_alternative
  - marker: b
    text: या ‘पहाड़ी ढलान पर।’
    reason: lexical_alternative
  - marker: c
    text: प्रसंग में ‘उन्होंने’ का संकेत दुष्टात्माओं या अशुद्ध आत्माओं की ओर है; कुछ अनुवाद इसे मुख्य पाठ में स्पष्ट कर देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: सूअरों का एक बड़ा झुंड
  rationale: ἀγέλη के लिए ‘झुंड’ स्वाभाविक सामूहिक संज्ञा है; ἱκανῶν यहाँ सूअरों की बड़ी संख्या बताता है, जिसे सहज हिन्दी में ‘बड़ा झुंड’ कहा गया है।
- source_word: βοσκομένη
  choice: चर रहा था
  rationale: मध्यवाच्य कृदन्त झुंड के भोजन करने की गतिविधि बताता है; ‘चर रहा था’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ἐν τῷ ὄρει
  choice: पहाड़ पर
  rationale: ὄρος का निकट और सामान्य हिन्दी समतुल्य ‘पहाड़’ है; ἐν का स्थानगत अर्थ प्रसंग में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: παρεκάλεσαν
  choice: विनती की
  rationale: क्रिया आग्रहपूर्ण अनुरोध को व्यक्त करती है; ‘विनती की’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: प्रवेश करने दे / अनुमति दे दी
  rationale: पहले प्रयोग में हिन्दी की स्वाभाविक आश्रित रचना ‘करने दे’ रखी गई है और उत्तर में अनुमति दिए जाने को स्पष्ट करने के लिए ‘अनुमति दे दी’ कहा गया है।
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: उन सूअरों में प्रवेश करने
  rationale: ἐκείνους के संकेतवाचक बल और सूअरों की स्पष्ट पूर्वसंदर्भता को ‘उन सूअरों’ से बनाए रखा गया है; εἰσελθεῖν को ‘प्रवेश करने’ से निकट रूप में व्यक्त किया गया है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δὲ कथा को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी में नया वाक्य और प्रसंग-संबंध ही इसका कार्य स्वाभाविक रूप से निभाते हैं; ‘अब’ जोड़ने से अनावश्यक कालगत संकेत उत्पन्न हो सकता है।
theological_decisions:
- issue: ‘उन्होंने’ का कर्ता
  choice: यूनानी पाठ की तरह बहुवचन कर्ता को अप्रकट रखते हुए ‘उन्होंने’ कहा गया है।
  alternative: ‘दुष्टात्माओं ने उससे विनती की’ कहकर कर्ता स्पष्ट करना।
  rationale: आस-पास का प्रसंग कर्ता को दुष्टात्माओं/अशुद्ध आत्माओं के रूप में पहचानता है, पर इस पद में संज्ञा दोहराई नहीं गई। सर्वनाम-सदृश हिन्दी रचना स्रोत की अंतर्निहितता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। वाक्य स्रोत की पुनरुक्ति—अनुमति माँगना और अनुमति मिलना—को बनाए रखता है, जबकि हिन्दी में स्वाभाविक क्रियारूपों का प्रयोग करता है।
