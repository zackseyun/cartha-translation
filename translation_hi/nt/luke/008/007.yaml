translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल यूनानी के साथ-साथ बढ़ने के भाव को सुरक्षित रखा गया है, जबकि पौधे के संदर्भ में अस्वाभाविक ‘दम घोंट दिया’ के बदले प्रचलित ‘दबा दिया’ चुना गया है।
