base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: hi
  text: और दूसरा बीज काँटों के बीच[a] गिरा, और काँटे उसके साथ उग आए[b] और उसे दबा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘काँटों के बीचों-बीच।’
    reason: ‘ἐν μέσῳ’ के अधिक शाब्दिक स्थानवाचक विकल्प को दर्शाता है।
  - marker: b
    text: या, ‘काँटों ने, उसके साथ उगकर, उसे दबा दिया।’
    reason: यूनानी कृदन्त συμφυεῖσαι की संरचना और उसके साथ उगने के भाव को अधिक निकटता से दर्शाता है।
lexical_decisions:
- source_word: ἕτερον
  choice: कुछ बीज
  rationale: नपुंसकलिंग एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और पिछले प्रसंग के बीज की ओर संकेत करता है। हिन्दी में निहित संज्ञा ‘बीज’ को स्पष्ट करना स्वाभाविक है; ‘कुछ बीज’ बोए गए बीज के एक हिस्से का सहज बोध कराता है।
- source_word: ἔπεσεν
  choice: गिरा
  rationale: πίπτω के सरल भूतकालीन कथात्मक अर्थ को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: काँटों के बीच
  rationale: ἐν μέσῳ का स्थानवाचक अर्थ ‘के बीच’ है; यह मूल चित्र को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: काँटे / काँटों
  rationale: ἄκανθα काँटेदार वनस्पतियों को दर्शाता है। ‘काँटे’ हिन्दी बाइबलीय और कृषि-चित्र दोनों में सहज है तथा अनावश्यक रूप से किसी खास झाड़ी का अर्थ नहीं जोड़ता।
- source_word: συμφυεῖσαι
  choice: उसके साथ-साथ बढ़कर
  rationale: συμφύομαι बीज के साथ या उसी समय बढ़ने का भाव देता है। यह पद उस संयुक्त वृद्धि को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ἀπέπνιξαν
  choice: दबा दिया
  rationale: ἀποπνίγω का शाब्दिक भाव दम घोंटने का है, पर पौधों के संदर्भ में ‘दबा दिया’ स्वाभाविक हिन्दी कृषि-रूपक है और काँटों द्वारा उसकी वृद्धि रोक देने का अर्थ देता है।
- source_word: αὐτό
  choice: उसे
  rationale: सर्वनाम पहले स्पष्ट किए गए ‘बीज’ की ओर लौटता है; हिन्दी में ‘उसे’ स्वाभाविक और स्पष्ट है।
