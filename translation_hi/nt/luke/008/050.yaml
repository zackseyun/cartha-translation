source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: hi
  text: परन्तु यीशु ने यह सुनकर उसे उत्तर दिया, “मत डर; केवल विश्वास कर[a], और वह बच जाएगी[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “केवल भरोसा रख।”
    reason: lexical_alternative
  - marker: b
    text: या “वह चंगी हो जाएगी” अथवा “वह स्वस्थ हो जाएगी।” यूनानी क्रिया का अर्थ बचाना, छुड़ाना या चंगा करना हो सकता है; इस प्रसंग में इसमें मृत्यु के कगार से पुनर्स्थापना का भाव सम्मिलित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: अओरिस्ट कृदन्त पूर्ववर्ती क्रिया दर्शाता है; प्रसंग से निहित बात के लिए ‘यह’ जोड़ना हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसे उत्तर दिया
  rationale: दत्तिव αὐτῷ सहित यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध है। एक व्यक्ति को प्रत्यक्ष संबोधन में ‘मत डर’ सहज, संक्षिप्त और गंभीर है।
- source_word: μόνον πίστευσον
  choice: केवल विश्वास कर
  rationale: μόνον आगामी आज्ञा को सीमित करता है और πίστευσον विश्वास/भरोसा रखने की आज्ञा देता है। ‘विश्वास कर’ मूल क्रिया से सीधा संबंध बनाए रखता है।
- source_word: σωθήσεται
  choice: वह बच जाएगी
  rationale: σῴζω के व्यापक अर्थ—बचाना, उद्धार करना, चंगा करना—को संकुचित किए बिना स्त्रीलिंग कर्ता और भविष्यत् कर्मवाच्य को व्यक्त करता है; प्रसंगगत ‘चंगी हो जाएगी’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πίστευσον में बौद्धिक विश्वास और संबंधपरक भरोसे का संबंध
  choice: विश्वास कर
  alternative: भरोसा रख
  rationale: ‘विश्वास कर’ πιστεύω का सीधा और परिचित हिन्दी प्रतिरूप है, जबकि ‘भरोसा रख’ उसके संबंधपरक भाव को स्पष्ट करता है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मृत्यु/चंगाई के प्रसंग में σωθήσεται का अर्थ
  choice: वह बच जाएगी
  alternative: वह चंगी हो जाएगी / वह भली-चंगी हो जाएगी
  rationale: ‘बच जाएगी’ σῴζω की व्यापक अर्थ-सीमा और संभावित धर्मवैज्ञानिक प्रतिध्वनि बनाए रखता है। तत्काल प्रसंग में शारीरिक पुनर्स्थापना का अर्थ प्रबल है, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज प्रत्यक्ष वचन। ‘परन्तु’ से δέ का विरोधात्मक/संक्रमणकारी बल, ‘यह सुनकर’ से पूर्ववर्ती संदेश का संकेत, और ‘वह’ से याईर की बेटी का स्त्रीलिंग संदर्भ स्वाभाविक रूप से व्यक्त किया गया है।
