source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: hi
  text: क्योंकि ऐसा कुछ भी छिपा नहीं है जो प्रकट न हो[a], और न ऐसी कोई गुप्त बात है जो जानी न जाए[b] और सामने न आए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रकट न हो जाए।’
    reason: lexical_alternative
  - marker: b
    text: 'मूल यूनानी रचना इस बात का प्रबल निषेध करती है कि कोई गुप्त बात अज्ञात रह जाएगी; भावार्थ: ‘निश्चय ही जानी जाएगी।’'
    reason: lexical_alternative
  - marker: c
    text: या, ‘खुलकर सामने न आए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह अव्यय पिछली बात का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κρυπτὸν
  choice: छिपा
  rationale: κρυπτός उस वस्तु या बात को दर्शाता है जो छिपी हुई है। ‘छिपा’ सामान्य, स्पष्ट हिन्दी है और आगे के ‘प्रकट’ के साथ सीधा विरोध बनाता है।
- source_word: φανερὸν γενήσεται
  choice: प्रकट न हो
  rationale: नकारात्मक संबंधवाचक रचना के भीतर यह पदबंध इस अर्थ को व्यक्त करता है कि छिपी हुई बात अंततः प्रकट होगी। ‘प्रकट न हो’ हिन्दी में मूल के द्विनिषेध को स्वाभाविक रूप से बनाए रखता है; ‘हो जाए’ परिवर्तन की छाया को अधिक स्पष्ट कर सकता है।
- source_word: ἀπόκρυφον
  choice: गुप्त बात
  rationale: ἀπόκρυφος छिपी या गुप्त वस्तु/बात को सूचित करता है। ‘गुप्त बात’ κρυπτόν के लिए प्रयुक्त ‘छिपा’ से हल्का शब्दभेद रखते हुए समानांतरता बनाए रखता है।
- source_word: οὐ μὴ γνωσθῇ
  choice: जानी न जाए
  rationale: मूल में प्रबल निषेध है, जो पूरे नकारात्मक संबंधवाचक वाक्य में यह सुनिश्चित करता है कि कोई गुप्त बात अज्ञात नहीं रहेगी। ‘जानी न जाए’ इस संरचना और कर्मवाच्य को हिन्दी में बनाए रखता है।
- source_word: εἰς φανερὸν ἔλθῃ
  choice: सामने न आए
  rationale: यह पदबंध खुले रूप से प्रकट होने का मुहावरा है। ‘सामने आए’ आधुनिक हिन्दी में सार्वजनिक या स्पष्ट रूप से प्रकट होने का सहज समतुल्य है।
theological_decisions:
- issue: प्रकटीकरण संबंधी कथन का दायरा
  choice: पद को एक व्यापक सिद्धांत के रूप में रखा गया है कि छिपी या गुप्त बात अंततः प्रकट होगी।
  alternative: इसे केवल अंतिम न्याय के समय होने वाले प्रकाशन या केवल यीशु की शिक्षा के तत्काल प्रकटीकरण तक सीमित समझना।
  rationale: पद स्वयं प्रकटीकरण का समय या उसका एकमात्र संदर्भ निर्धारित नहीं करता। इसलिए अनुवाद व्यापक कथन को बनाए रखता है और उसके युगांत-संबंधी तथा तात्कालिक संदर्भगत अनुप्रयोगों के बीच निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण रखी गई है। मूल यूनानी के समानांतर द्विनिषेध को हिन्दी की स्वाभाविक ‘ऐसा कुछ भी नहीं… जो न…’ रचना से व्यक्त किया गया है। ‘छिपा/प्रकट’ और ‘गुप्त बात/सामने आए’ के जोड़े मूल की पुनरुक्ति और सूक्ष्म शब्दभेद दोनों को बनाए रखते हैं।
