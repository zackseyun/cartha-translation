base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: hi
  text: घर में पहुँचने पर उसने पतरस, यूहन्ना और याकूब तथा लड़की[a] के पिता और माता के सिवा किसी को अपने साथ भीतर आने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ सामान्य रूप से “बच्चा” भी हो सकता है। यहाँ निकट प्रसंग से स्पष्ट है कि यह लड़की के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν ... εἰς τὴν οἰκίαν
  choice: जब वह घर पहुँचा
  rationale: कालवाचक कृदंत और गंतव्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; घटनाक्रम स्पष्ट रहता है।
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: भीतर आने नहीं दिया
  rationale: यहाँ ἀφίημι का अर्थ अनुमति देना है; यह पदबंध निषेध और प्रवेश दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: τινα σὺν αὐτῷ
  choice: किसी को अपने साथ
  rationale: नकारात्मक वाक्य में अनिश्चित सर्वनाम का सामान्य अर्थ ‘किसी को’ है; σὺν αὐτῷ को प्रवेश की क्रिया से जोड़ा गया है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: नकार के बाद यह अपवाद सूचित करता है, शर्त नहीं।
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: पतरस, यूहन्ना और याकूब
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप और स्वाभाविक सूची-विन्यास अपनाए गए हैं।
- source_word: τῆς παιδὸς
  choice: लड़की
  rationale: παῖς सामान्यतः बच्चे के लिए प्रयुक्त हो सकता है, पर यहाँ स्त्रीलिंग व्याकरण और निकट प्रसंग याईर की बेटी की पहचान कराते हैं।
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: पिता और माता
  rationale: दोनों व्यक्तियों का अलग-अलग उल्लेख सुरक्षित रखा गया है; इसे केवल ‘माता-पिता’ में समेटा नहीं गया।
theological_decisions:
- issue: παῖς की प्रसंगानुसार विशिष्टता
  choice: लड़की के पिता और माता
  alternative: बच्ची के पिता और माता / बच्चे के पिता और माता
  rationale: मूल शब्द का अर्थ व्यापक रूप से ‘बच्चा’ हो सकता है, किंतु स्त्रीलिंग रूप और कथा में याईर की बेटी का स्पष्ट उल्लेख यहाँ लड़की-सूचक अनुवाद का समर्थन करते हैं। यह कोई doctrinal निष्कर्ष नहीं, बल्कि व्याकरण और प्रसंग पर आधारित चयन है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और सम्मानपूर्ण रखी गई है। ‘पहुँचा’ आगमन को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘अपने साथ भीतर आने नहीं दिया’ मूल वाक्य के निषेध तथा साथ प्रवेश करने के भाव को स्पष्ट रखता है।
