source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: hi
  text: तब यीशु ने उससे पूछा, “तुम्हारा नाम क्या है?” उसने कहा, “लेगियोन”[a], क्योंकि बहुत-सी दुष्टात्माएँ उसमें प्रवेश कर चुकी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लेगियोन” लातीनी मूल का शब्द है, जो रोमी सेना की एक बड़ी इकाई को दर्शाता था; यहाँ यह इस बात को सूचित करता है कि उस मनुष्य में बहुत-सी दुष्टात्माएँ थीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: यह क्रिया सीधे प्रश्न का परिचय देती है; आधुनिक हिन्दी में “पूछा” स्वाभाविक और अर्थ की दृष्टि से पर्याप्त सटीक है।
- source_word: δὲ
  choice: तब
  rationale: δέ यहाँ कथा को आगे बढ़ाता है; “तब” उसके हल्के क्रमिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Τί σοι ὄνομά ἐστιν
  choice: तुम्हारा नाम क्या है?
  rationale: यूनानी मुहावरे का यह स्वाभाविक हिन्दी रूप है, जो प्रश्न का पूरा अर्थ सुरक्षित रखता है।
- source_word: Λεγιών
  choice: लिगियोन
  rationale: यूनानी रूप का देवनागरी लिप्यंतरण किया गया है। इसके रोमी सैनिक संदर्भ को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह नाम “लिगियोन” दिए जाने का कारण बताता है; “क्योंकि” कारणवाचक संबंध को स्पष्ट रखता है।
- source_word: εἰσῆλθεν
  choice: प्रवेश कर चुकी थीं
  rationale: यूनानी क्रिया भूतकाल में है; हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि दुष्टात्माओं का प्रवेश इस उत्तर से पहले हो चुका था। बहुवचन स्त्रीलिंग क्रिया हिन्दी में “दुष्टात्माएँ” के अनुरूप है।
- source_word: δαιμόνια πολλὰ
  choice: बहुत-सी दुष्टात्माएँ
  rationale: यह रूप अनेक दुष्ट आत्मिक प्राणियों के स्पष्ट उल्लेख को बनाए रखता है और आधुनिक हिन्दी बाइबलीय प्रयोग में सहज है।
- source_word: εἰς αὐτόν
  choice: उसमें
  rationale: संदर्भ में “उसमें प्रवेश” यूनानी εἰς की भीतर की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्मिक अधीनता के संदर्भ में δαιμόνια का अनुवाद
  choice: दुष्टात्माएँ
  alternative: दुष्ट आत्मिक प्राणी
  rationale: “दुष्टात्माएँ” मूल पाठ में बताए गए व्यक्तिगत और बुरे आत्मिक प्राणियों को सीधे व्यक्त करता है तथा कथन के अलौकिक आशय को नरम नहीं करता।
- issue: εἰσῆλθεν और “लिगियोन” नाम के बीच काल-संबंध
  choice: प्रवेश कर चुकी थीं
  alternative: प्रवेश किया
  rationale: पूर्ण भूतकाल यह स्पष्ट करता है कि उनका प्रवेश नाम बताए जाने से पहले हुआ था; यह समय-संबंध की भाषिक स्पष्टता है, कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “लिगियोन” को अंग्रेज़ी रूप के आधार पर नहीं, यूनानी पाठ के रूप के निकट देवनागरी में लिप्यंतरित किया गया है। कारणसूचक ὅτι को मुख्य पाठ में ही “क्योंकि” से व्यक्त किया गया है; इसके लिए अलग पाद-टिप्पणी आवश्यक नहीं है।
