id: LUK.8.28
reference: Luke 8:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: hi
  text: जब उसने यीशु को देखा, तो वह चिल्ला उठा, उसके सामने गिर पड़ा और ऊँची आवाज़ में बोला, “हे यीशु, परमप्रधान परमेश्वर के पुत्र, मेरा तुझसे क्या लेना-देना है?[a] मैं तुझसे विनती करता हूँ, मुझे यातना न दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक शब्दशः, “मेरे और तेरे बीच क्या है?”
    reason: मूल के सामी प्रभाव वाले मुहावरे का अधिक शब्दशः विकल्प देने के लिए।
lexical_decisions:
- source_word: ἰδὼν
  choice: जब उसने … को देखा
  rationale: एओरिस्ट कृदन्त मुख्य क्रियाओं से पहले की परिस्थिति बताता है; यह रूप उसके कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνακράξας
  choice: वह चिल्ला उठा
  rationale: यह शब्द अचानक और ऊँचे स्वर में पुकारने को दर्शाता है; ‘चिल्ला उठा’ उस आकस्मिकता को बनाए रखता है और आगे आने वाले ‘ऊँची आवाज़ में’ को अलग अभिव्यक्ति के रूप में रहने देता है।
- source_word: προσέπεσεν αὐτῷ
  choice: उसके सामने गिर पड़ा
  rationale: यह यीशु के सम्मुख गिरने की मुद्रा व्यक्त करता है; ‘उसके पैरों पर’ कहने से जो विशिष्टता मूल में स्पष्ट नहीं है, वह नहीं जोड़ी गई।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: रीति या माध्यम बताने वाले दत्तिव का स्वाभाविक और सजीव हिन्दी रूप।
- source_word: Τί ἐμοὶ καὶ σοί
  choice: मेरा तुझसे क्या लेना-देना है?
  rationale: यह सामी प्रभाव वाला मुहावरा दूरी बनाने या विरोध जताने का भाव रखता है। चुना गया रूप आधुनिक हिन्दी में स्वाभाविक है; अधिक शब्दशः रूप पादटिप्पणी में सुरक्षित है।
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर के पुत्र
  rationale: यह संबंधकारक पदबंध को एक प्रतिष्ठित उपाधि के रूप में रखता है और यीशु की पहचान के कथन को बिना व्याख्यात्मक विस्तार के सुरक्षित करता है।
- source_word: δέομαί σου
  choice: मैं तुझसे विनती करता हूँ
  rationale: यह आग्रहपूर्ण याचना को सीधे, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μή με βασανίσῃς
  choice: मुझे यातना न दे
  rationale: βασανίζω की तीव्र पीड़ा या दंड देने की अर्थ-छाया को बनाए रखता है, पर शारीरिक यातना का अनावश्यक विशेषीकरण नहीं करता।
theological_decisions:
- issue: दुष्टात्मा द्वारा यीशु की पहचान की उद्घोषणा
  choice: हे यीशु, परमप्रधान परमेश्वर के पुत्र
  alternative: हे यीशु, परमप्रधान के पुत्र
  rationale: ‘परमेश्वर’ मूल के θεοῦ को स्पष्ट रूप से प्रस्तुत करता है और पूरे मसीही पहचान-सूचक संबोधन को न तो हल्का करता है, न बाद की धर्मवैज्ञानिक भाषा से विस्तृत करता है।
- issue: βασανίσῃς में दंड और पीड़ा की अर्थ-छाया
  choice: यातना न दे
  alternative: कष्ट न दे
  rationale: ‘यातना’ मूल क्रिया की तीव्रता और इस प्रसंग के न्याय-संबंधी संकेत को सुरक्षित रखती है; ‘कष्ट’ अपेक्षाकृत कमजोर होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली स्वाभाविक और गरिमापूर्ण रखी गई है। दुष्टात्मा के सीधे संबोधन में ‘तू/तेरा’ के रूप (‘तुझसे’, ‘दे’) मूल की एकवचन निकटता और टकरावपूर्ण स्वर को व्यक्त करते हैं, न कि अनादर पर कोई अतिरिक्त धर्मवैज्ञानिक निर्णय। पादटिप्पणी-चिह्न संबंधित मुहावरे के तुरंत बाद रखा गया है।
