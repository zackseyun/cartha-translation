source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: hi
  text: तब गेरासेनियों के आसपास के क्षेत्र की सारी भीड़ ने उससे अनुरोध किया कि वह उनके पास से चला जाए, क्योंकि वे बड़े भय से जकड़े हुए थे। तब वह नाव में चढ़कर लौट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησεν
  choice: विनती की
  rationale: यहाँ ἐρωτάω किसी से कुछ करने का अनुरोध करने के अर्थ में है। ‘विनती की’ प्रसंग की गंभीरता व्यक्त करता है, पर ‘गिड़गिड़ाए’ जैसी अत्यधिक तीव्रता नहीं जोड़ता।
- source_word: ἅπαν τὸ πλῆθος
  choice: पूरी भीड़
  rationale: ἅπαν की समग्रता और πλῆθος के सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τῆς περιχώρου
  choice: आस-पास के सारे क्षेत्र की
  rationale: περίχωρος नगर या स्थान के चारों ओर के क्षेत्र को सूचित करता है; यह वाक्यांश भीड़ के भौगोलिक विस्तार को स्पष्ट करता है।
- source_word: τῶν Γερασηνῶν
  choice: गिरासेनियों के
  rationale: प्रदत्त SBLGNT पाठ के Γερασηνῶν को निवासियों के नाम के रूप में लिप्यंतरित किया गया है, किसी भिन्न पाठ-पठन को नहीं अपनाया गया।
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: उनके यहाँ से चला जाए
  rationale: यह हिन्दी में स्वाभाविक रूप से यीशु से उनके क्षेत्र को छोड़ने का अनुरोध व्यक्त करता है और ἀπό की पृथक्करण-दिशा बनाए रखता है।
- source_word: φόβῳ μεγάλῳ
  choice: बड़े भय से
  rationale: μέγας की तीव्रता को सीधे व्यक्त करता है, बिना भय के स्वरूप की व्याख्या किए।
- source_word: συνείχοντο
  choice: जकड़े हुए थे
  rationale: συνέχω के पकड़े या दबोचे रहने वाले रूपक को सजीव और वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: ἐμβὰς εἰς πλοῖον
  choice: नाव पर चढ़कर
  rationale: नाव में सवार होने की क्रिया का स्वाभाविक हिन्दी वर्णन है; यूनानी में निश्चित उपपद न होने के कारण किसी खास नाव पर अनावश्यक बल नहीं दिया गया।
- source_word: ὑπέστρεψεν
  choice: लौट गया
  rationale: ὑποστρέφω के वापस जाने के कथात्मक अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: गिरासेनी क्षेत्र के लोगों के भय का स्वरूप
  choice: केवल यह कहा गया है कि वे बड़े भय से जकड़े थे।
  alternative: भय को विशेष रूप से ईश्वरीय विस्मय, आर्थिक हानि की चिंता, या यीशु के प्रति शत्रुता बताना।
  rationale: यूनानी पाठ भय का कारण या नैतिक स्वरूप निर्धारित नहीं करता; इसलिए अनुवाद इस धार्मिक और कथात्मक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज कथात्मक शैली। ‘यीशु’ को स्पष्टता के लिए सर्वनाम के स्थान पर रखा गया है, क्योंकि स्वतंत्र पद के रूप में ‘उससे’ का संदर्भ अस्पष्ट हो सकता था। कोई पादटिप्पणी आवश्यक नहीं मानी गई; अंग्रेज़ी पादटिप्पणी मुख्यतः उसी पाठ में प्रयुक्त ‘gripped’ के वैकल्पिक अंग्रेज़ी शब्दांकन से संबंधित है।
