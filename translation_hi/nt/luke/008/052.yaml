  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: hi
  text: सब लोग उसके लिए रो रहे थे और शोक मना रहे थे। पर उसने कहा, “मत रोओ, क्योंकि वह मरी नहीं है, बल्कि सो रही है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोई हुई है।” यहाँ यीशु की ‘सोने’ की भाषा लड़की के शीघ्र पुनः जीवित किए जाने के प्रसंग में उसकी दशा का रूपकात्मक वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: रो रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को व्यक्त करता है; यह रूप उस निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πάντες
  choice: सब लोग
  rationale: शोक करनेवालों की समग्रता को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: ἐκόπτοντο αὐτήν
  choice: उसके लिए ... शोक मना रहे थे
  rationale: शोक के प्रसंग में क्रिया विलाप या मातम करने को दर्शाती है; यह अनुवाद संभावित छाती पीटने की क्रिया को अनावश्यक रूप से निश्चित किए बिना अर्थ देता है।
- source_word: Μὴ κλαίετε
  choice: मत रोओ
  rationale: वर्तमान निषेधाज्ञा प्रसंग में जारी रोना रोकने का भाव रख सकती है; ‘मत रोओ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ रोने से मना करने का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: ἀπέθανεν
  choice: मरी नहीं है
  rationale: अओरिस्ट क्रिया को हिन्दी में ऐसे ढंग से व्यक्त किया गया है कि मृत्यु की घटना और उससे जुड़ी वर्तमान दशा दोनों सामने रहें।
- source_word: καθεύδει
  choice: सो रही है
  rationale: वर्तमान काल और यीशु द्वारा प्रयुक्त ‘सोने’ की भाषा को विशेषणात्मक ‘सोई हुई है’ में बदलने के बजाय क्रियात्मक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: यीशु का कथन कि लड़की मरी नहीं, बल्कि सो रही है
  choice: 'मुख्य पाठ में कथन को ज्यों का त्यों तनाव सहित रखना: ‘मरी नहीं है, बल्कि सो रही है।’'
  alternative: ‘वह स्थायी रूप से नहीं मरी’ या ‘वह वास्तव में केवल सोई है’ कहकर अर्थ स्पष्ट कर देना
  rationale: मूल कथन लड़की की दशा को यीशु की ‘सोने’ वाली भाषा में प्रस्तुत करता है। अनुवाद को यह तय नहीं करना चाहिए कि यह केवल रूपक है, आसन्न पुनर्जीवन की दृष्टि से कथन है, या लड़की की दशा का कोई और वर्णन; कथात्मक और धर्मवैचारिक तनाव सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘उसने’ का संदर्भ प्रसंगानुसार यीशु से है। मुख्य पाठ में अर्थ की अस्पष्टता और धर्मवैचारिक तनाव को नहीं सुलझाया गया है।
