id: LUK.8.16
reference: Luke 8:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: hi
  text: कोई भी दीपक जलाकर उसे किसी बरतन से नहीं ढकता या पलंग के नीचे नहीं रखता, बल्कि दीपाधार पर रखता है, ताकि भीतर आनेवाले उसका प्रकाश देख सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: दीपक
  rationale: यह तेल से जलने वाले छोटे घरेलू दीप का स्वाभाविक और व्यापक रूप से समझा जाने वाला हिन्दी शब्द है।
- source_word: σκεύει
  choice: किसी बरतन से
  rationale: σκεῦος का अर्थ सामान्य पात्र या बरतन है; यहाँ करण भाव के कारण 'से' स्वाभाविक है और पात्र के प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: κλίνης
  choice: पलंग
  rationale: प्रसंग में लेटने या सोने के घरेलू फर्नीचर का सामान्य आधुनिक हिन्दी रूप।
- source_word: λυχνίας
  choice: दीपाधार
  rationale: दीपक को ऊँचा रखकर प्रकाश फैलाने वाले stand का संक्षिप्त, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप।
- source_word: τὸ φῶς
  choice: उसका प्रकाश
  rationale: निश्चित पदबंध का संकेत उसी दीपक के प्रकाश की ओर है; हिन्दी में 'उसका' संबंध को स्वाभाविक और स्पष्ट बनाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, घरेलू बिंब और गरिमापूर्ण शैली रखी गई है। आरम्भिक δέ को अलग शब्द से नहीं व्यक्त किया गया, क्योंकि यहाँ वह हल्का कथन-संयोजक है और हिन्दी में अनावश्यक 'अब' या 'परन्तु' जोड़ने से अर्थ अधिक निश्चित हो जाता। उद्देश्यसूचक ἵνα को 'ताकि ... देख सकें' से स्वाभाविक रूप में व्यक्त किया गया है।
