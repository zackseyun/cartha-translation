  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: hi
  text: पर उसने उस स्त्री से कहा, “बेटी, तुम्हारे विश्वास ने तुम्हें बचाया है[a]; शांति से जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें स्वस्थ किया है” अथवा “तुम्हें चंगा किया है।” यूनानी क्रिया चंगा करने के साथ-साथ बचाने या उद्धार करने का अर्थ भी दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: बेटी
  rationale: मूल यूनानी के संबोधन को सीधे बनाए रखता है और यीशु की कोमल, अपनत्व भरी वाणी व्यक्त करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस प्रसंग में यीशु पर उस स्त्री के भरोसे का बोध कराता है और शब्द के धार्मिक-वैचारिक महत्व को भी बनाए रखता है।
- source_word: σέσωκέν
  choice: बचाया है
  rationale: σῴζω के पूर्णकालीन रूप का व्यापक अर्थ सुरक्षित रखता है, जिसमें उद्धार और चंगाई दोनों की गूँज हो सकती है; शारीरिक चंगाई का संकरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: πορεύου
  choice: जाओ
  rationale: आज्ञार्थक क्रिया का आधुनिक हिन्दी में सहज और सीधा अनुवाद है।
- source_word: εἰς εἰρήνην
  choice: शांति से
  rationale: यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी मुहावरे में प्रस्तुत करता है और शांति के साथ विदा होने का भाव बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का संक्रमण और भयभीत स्त्री के प्रति यीशु के आश्वासन का सौम्य विरोधाभास व्यक्त करता है।
theological_decisions:
- issue: चंगाई के प्रसंग में σῴζω का अर्थ-क्षेत्र
  choice: मुख्य पाठ में व्यापक अर्थ वाला “बचाया है”
  alternative: “चंगा किया है” या “स्वस्थ किया है”
  rationale: तात्कालिक प्रसंग शारीरिक चंगाई का है, पर यूनानी क्रिया शारीरिक स्वस्थता से आगे बचाव या उद्धार का अर्थ भी रख सकती है। मुख्य पाठ व्यापक अर्थ को सुरक्षित रखता है और पादटिप्पणी प्रसंगगत चंगाई को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भाषा रखी गई है। “तुम्हारे/तुम्हें/जाओ” आत्मीय संबोधन को स्वाभाविक ढंग से व्यक्त करते हैं; “उस स्त्री” संदर्भ को स्पष्ट करता है।
