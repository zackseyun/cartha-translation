  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: hi
  text: जब एक बड़ी भीड़ इकट्ठी हो रही थी और नगर-नगर से लोग उसके पास आ रहे थे, तब उसने एक दृष्टान्त देकर कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने एक दृष्टान्त में कहा।” यूनानी अभिव्यक्ति διὰ παραβολῆς साधन या रीति—दोनों का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: इकट्ठी हो रही थी
  rationale: ὄχλου πολλοῦ के साथ यह संबंधकारक निरपेक्ष रचना है और चल रही प्रक्रिया दिखाती है; यह हिन्दी अभिव्यक्ति भीड़ के क्रमशः एकत्र होने का भाव स्वाभाविक रूप से देती है।
- source_word: δὲ
  choice: जब ... तो
  rationale: यहाँ δέ कथा को आगे बढ़ाता है, प्रबल विरोध नहीं दिखाता। हिन्दी में संबंधकारक निरपेक्ष परिस्थिति और मुख्य क्रिया को ‘जब ... तो’ से जोड़ना सहज है।
- source_word: ὄχλου πολλοῦ
  choice: एक बड़ी भीड़
  rationale: ὄχλος का अर्थ ‘भीड़’ और πολύς का अर्थ यहाँ उसके बड़े आकार से है; ‘बड़ी भीड़’ आधुनिक मानक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: नगर-नगर से लोग ... आ रहे थे
  rationale: κατὰ πόλιν का वितरणात्मक भाव अलग-अलग नगरों से लोगों के आने को दर्शाता है। ‘नगर-नगर से’ इस भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: πρός और कर्मकारक यहाँ यीशु की ओर गति दिखाते हैं; ‘उसके पास’ हिन्दी में स्वाभाविक है और संदर्भ में सर्वनाम स्पष्ट है।
- source_word: εἶπεν
  choice: उसने ... कहा
  rationale: εἶπεν की सामान्य और सीधी हिन्दी ‘कहा’ है; अगली रीति/साधन-सूचक अभिव्यक्ति के साथ यह सहज बैठती है।
- source_word: διὰ παραβολῆς
  choice: एक दृष्टान्त के द्वारा
  rationale: διά के संबंधकारक रूप में साधन या रीति दोनों का भाव हो सकता है। ‘के द्वारा’ साधन को निकटता से व्यक्त करता है, जबकि वैकल्पिक रीति-सूचक अर्थ फुटनोट में सुरक्षित है।
