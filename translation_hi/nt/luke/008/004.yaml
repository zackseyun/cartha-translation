  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘दृष्टान्त’ बाइबलीय संदर्भ में परिचित और अर्थपूर्ण शब्द है। मुख्य पाठ में यूनानी वाक्य की चल रही पृष्ठभूमि-क्रियाओं और वितरणात्मक ‘नगर-नगर’ को बनाए रखा गया है।
