  naturalness: The sentence is generally natural. However, 'एक दृष्टान्त के द्वारा कहा' is grammatically possible but somewhat wooden in modern Hindi. 'एक दृष्टान्त देकर कहा' is more idiomatic while retaining the instrumental/manner sense of διὰ παραβολῆς.
  terminology: ‘दृष्टान्त’ is an established, suitable biblical term for παραβολή. ‘नगर-नगर’ effectively preserves the distributive expression without overexplaining it.
