  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: hi
  text: और जिन लोगों ने यह देखा था, उन्होंने लोगों को बताया कि उस दुष्टात्मा-ग्रस्त मनुष्य को कैसे बचाया गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दुष्टात्मा-ग्रस्त मनुष्य को कैसे चंगा किया गया था” अथवा “कैसे छुड़ाया गया था।” यूनानी क्रिया का अर्थ प्रसंग के अनुसार बचाना, चंगा करना या छुड़ाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: ἀπαγγέλλω यहाँ देखी हुई घटना का वृत्तांत दूसरों को बताने के अर्थ में है। ‘बताया’ सहज आधुनिक हिन्दी है और प्रसंग के लिए पर्याप्त रूप से औपचारिक भी है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध प्रकट किए बिना प्रवाह बनाए रखता है।
- source_word: αὐτοῖς
  choice: लोगों को
  rationale: सर्वनाम का संकेत पिछले पद में आए लोगों की ओर है। हिन्दी में अस्पष्ट ‘उन्हें’ के बजाय ‘लोगों को’ संदर्भ स्पष्ट और स्वाभाविक करता है।
- source_word: οἱ ἰδόντες
  choice: जिन्होंने यह देखा था
  rationale: संज्ञार्थक कृदंत घटना के प्रत्यक्षदर्शियों को दर्शाता है। ‘यह’ निकटवर्ती पूरी घटना की ओर संकेत करता है और हिन्दी में स्वाभाविक है।
- source_word: πῶς
  choice: कैसे
  rationale: πῶς घटना के ढंग अथवा उसके घटित होने की बात प्रस्तुत करता है; ‘कैसे’ इस खुलापन को बनाए रखता है।
- source_word: ἐσώθη
  choice: बचाया गया था
  rationale: σῴζω का अर्थ बचाना, चंगा करना या छुड़ाना हो सकता है। ‘बचाया गया था’ मूल क्रिया की व्यापकता और कर्मवाच्य को बनाए रखता है; प्रसंगानुकूल विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: ὁ δαιμονισθείς
  choice: वह दुष्टात्मा से ग्रस्त मनुष्य
  rationale: यह पुरुषवाचक संज्ञार्थक कृदंत उस मनुष्य को दर्शाता है जो दुष्टात्माओं के प्रभाव में रहा था। ‘दुष्टात्मा से ग्रस्त’ आधुनिक हिन्दी में स्पष्ट है और व्यक्ति को केवल उसकी दशा का नाम बनाकर प्रस्तुत नहीं करता।
theological_decisions:
- issue: दुष्टात्मा से मुक्ति और चंगाई के प्रसंग में ἐσώθη (σῴζω) का अनुवाद
  choice: बचाया गया था
  alternative: चंगा किया गया था; छुड़ाया गया था
  rationale: यूनानी क्रिया में बचाव, छुटकारे और चंगाई—तीनों की अर्थ-संभावना है। मुख्य पाठ में ‘बचाया गया था’ इसकी व्यापक प्रतिध्वनि बनाए रखता है, जबकि पाद-टिप्पणी प्रसंगानुकूल अर्थों को सुरक्षित रखती है और इसे केवल आत्मिक उद्धार या केवल शारीरिक चंगाई तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य-संरचना सरल रखी गई है, पर यूनानी पाठ का कर्मवाच्य और σῴζω की अर्थगत व्यापकता सुरक्षित है।
