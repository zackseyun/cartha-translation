  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: hi
  text: 'दृष्टान्त यह है[a]: बीज परमेश्वर का वचन है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दृष्टान्त का अर्थ यह है।” यूनानी में अधिक शाब्दिक रूप से “दृष्टान्त यह है” लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: है
  rationale: संबंधसूचक क्रिया का सीधा अनुवाद ‘है’ है; ‘अर्थ है’ कहना प्रसंग को स्पष्ट करता, पर मूल में निहित न होने वाला शब्द जोड़ देता।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया गया
  rationale: यह हल्के संक्रमण को सूचित करता है। हिन्दी में व्याख्या आरम्भ करने वाली वाक्य-रचना स्वयं यह संक्रमण स्वाभाविक रूप से व्यक्त करती है; ‘अब’ जोड़ने से कालगत भाव अनावश्यक रूप से उभर सकता है।
- source_word: αὕτη ἡ παραβολή
  choice: दृष्टान्त यह
  rationale: यह मूल की औपचारिक संरचना और ‘दृष्टान्त’ शब्द को बनाए रखता है, जबकि हिन्दी में ‘दृष्टान्त यह है’ स्वाभाविक ढंग से आगामी व्याख्या प्रस्तुत करता है।
- source_word: ὁ σπόρος
  choice: बीज
  rationale: एकवचन ‘बीज’ यहाँ सामूहिक अर्थ में स्वाभाविक है और दृष्टान्त की कृषि-संबंधी छवि को बनाए रखता है।
- source_word: ὁ λόγος
  choice: वचन
  rationale: यहाँ λόγος परमेश्वर द्वारा संप्रेषित बात या संदेश को दर्शाता है। ‘वचन’ हिन्दी बाइबलीय प्रयोग में परिचित, गरिमापूर्ण और अर्थ की व्यापकता को सुरक्षित रखने वाला शब्द है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; ‘परमेश्वर की ओर से’ कहना उद्गम के अर्थ को अधिक स्पष्ट रूप से व्याख्यायित करता।
theological_decisions:
- issue: क्या παραβολή को केवल ‘दृष्टान्त’ रखा जाए या प्रसंगानुसार ‘दृष्टान्त का अर्थ’ कहा जाए
  choice: दृष्टान्त
  alternative: दृष्टान्त का अर्थ
  rationale: यीशु यहाँ निश्चय ही दृष्टान्त की व्याख्या आरम्भ करते हैं, फिर भी यूनानी पाठ शाब्दिक रूप से ‘दृष्टान्त यह है’ कहता है। मुख्य पाठ उस अभिव्यक्ति और उसकी हल्की असामान्यता को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वचन’ परिचित बाइबलीय शब्दावली है, जबकि वाक्य-विन्यास मूल की संरचना और व्याख्यात्मक तनाव को बनाए रखता है।
