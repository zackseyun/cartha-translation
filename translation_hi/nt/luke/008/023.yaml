source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: hi
  text: जब वे नाव से जा रहे थे, तो वह सो गया। तब हवा का एक प्रचंड तूफ़ान झील पर उतर आया। उनकी नाव पानी से भरती जा रही थी[a], और वे खतरे में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे भरते जा रहे थे”; आशय सम्भवतः यह है कि नाव में पानी भरता जा रहा था।
    reason: मूल यूनानी के बहुवचन रूप की व्याकरणिक अस्पष्टता को सुरक्षित रखते हुए संदर्भगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: जब वे नाव से जा रहे थे
  rationale: वर्तमान कृदंत के साथ यह संबंधवाचक रचना उस समय जारी पृष्ठभूमि की क्रिया बताती है। यह हिन्दी में स्वाभाविक रूप से नाव द्वारा यात्रा करने का भाव व्यक्त करती है, बिना यह कहे कि वे स्वयं नाव चला रहे थे।
- source_word: ἀφύπνωσεν
  choice: वह सो गया
  rationale: यहाँ एओरिस्ट क्रिया नींद आरम्भ होने का भाव देती है। संदर्भ से कर्ता यीशु है, पर मूल की तरह सर्वनाम रखा गया है।
- source_word: κατέβη
  choice: उतर आया
  rationale: क्रिया तूफ़ान के झील पर नीचे आने की भौगोलिक और दृश्यात्मक छवि बनाए रखती है।
- source_word: λαῖλαψ ἀνέμου
  choice: हवा का एक प्रचंड तूफ़ान
  rationale: λαῖλαψ की उग्रता और ἀνέμου के हवा-संबंधी स्वरूप, दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: εἰς τὴν λίμνην
  choice: झील पर
  rationale: मौसम की घटना के साथ हिन्दी में ‘झील पर’ स्वाभाविक है और तूफ़ान के झील पर उतरने का दृश्य सुरक्षित रखता है।
- source_word: συνεπληροῦντο
  choice: उनकी नाव पानी से भरती जा रही थी
  rationale: अपूर्णकाल जारी प्रक्रिया दिखाता है। यूनानी में कर्ता बहुवचन है और शाब्दिक रूप कुछ अस्पष्ट है; संदर्भगत अर्थ नाव में पानी भरने का है। हिन्दी में अर्थ स्पष्ट किया गया है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐκινδύνευον
  choice: वे खतरे में थे
  rationale: अपूर्णकाल लगातार बनी हुई संकटपूर्ण स्थिति बताता है; यह आधुनिक हिन्दी में स्पष्ट और गंभीर अभिव्यक्ति है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। तूफ़ान की तीव्रता तथा चल रहे संकट को स्पष्ट रखा गया है, और यूनानी बहुवचन की वास्तविक अस्पष्टता पादटिप्पणी में दर्शाई गई है।
