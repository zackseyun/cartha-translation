  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: hi
  text: इसके बाद ऐसा हुआ कि वह नगर-नगर और गाँव-गाँव घूमता हुआ परमेश्वर के राज्य की घोषणा करता और परमेश्वर के राज्य का शुभ समाचार सुनाता था। वे बारह भी उसके साथ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: इसके कुछ ही समय बाद ऐसा हुआ कि
  rationale: लूका की कथात्मक संक्रमण-उक्ति को बनाए रखते हुए ἐν τῷ καθεξῆς की निकटवर्ती काल-क्रम की भावना स्वाभाविक आधुनिक हिन्दी में व्यक्त होती है।
- source_word: αὐτὸς
  choice: वह
  rationale: यूनानी में कर्ता स्पष्ट है, पर इस संदर्भ में विशेष बल आवश्यक नहीं; हिन्दी में ‘वह’ सहज है।
- source_word: διώδευεν
  choice: घूमता हुआ ... था
  rationale: अपूर्णकाल निरंतर अथवा बार-बार होने वाली यात्रा दिखाता है; ‘घूमता हुआ’ विभिन्न स्थानों से होकर जाने की भावना देता है।
- source_word: κατὰ πόλιν καὶ κώμην
  choice: नगर-नगर और गाँव-गाँव
  rationale: κατά के वितरणात्मक अर्थ और एक के बाद दूसरे स्थान पर जाने की पुनरावृत्ति को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κηρύσσων
  choice: घोषणा करता
  rationale: सार्वजनिक रूप से उद्घोषित करने का भाव रखता है और इसे केवल औपचारिक उपदेश तक सीमित नहीं करता।
- source_word: εὐαγγελιζόμενος
  choice: शुभ समाचार सुनाता
  rationale: κηρύσσων से शब्दगत भेद बनाए रखते हुए सुसमाचार सुनाने का अर्थ स्पष्ट करता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह प्रचलित और अर्थ की दृष्टि से व्यापक पद है, जो βασιλεία में निहित शासन और राज्य—दोनों आयामों को खुला रखता है।
- source_word: οἱ δώδεκα
  choice: वे बारह
  rationale: समूह के मूल पदनाम को सुरक्षित रखता है और पाठ में न आए ‘चेले’ या ‘प्रेरित’ को नहीं जोड़ता।
- source_word: σὺν αὐτῷ
  choice: उसके साथ थे
  rationale: साथ होने का भाव स्वाभाविक पूर्ण हिन्दी वाक्य में व्यक्त करता है।
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘राज्य’ पारंपरिक और व्यापक है तथा स्थान/समुदाय और सक्रिय राजकीय शासन के बीच विद्यमान अर्थगत तनाव को किसी एक दिशा में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नगर-नगर और गाँव-गाँव’ वितरणात्मक गति को सहज हिन्दी में व्यक्त करता है; ‘घोषणा’ और ‘शुभ समाचार सुनाता’ दोनों यूनानी कृदंतों का भेद बनाए रखते हैं।
