lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: वर्णन में अचानक आए महत्त्वपूर्ण व्यक्ति की ओर ध्यान खींचने वाले यूनानी संकेत को स्वाभाविक और स्पष्ट रूप में बनाए रखता है।
- source_word: ἀνήρ
  choice: एक व्यक्ति
  rationale: यहाँ वयस्क पुरुष का उल्लेख है; आधुनिक हिन्दी में 'व्यक्ति' प्रसंगानुकूल और स्वाभाविक है, जबकि नाम से पुरुष होना स्पष्ट है।
- source_word: ἄρχων τῆς συναγωγῆς
  choice: सभा-घर का अगुआ
  rationale: यह आराधनालय में नेतृत्व अथवा प्रशासनिक जिम्मेदारी रखने वाले व्यक्ति को दर्शाता है; 'अगुआ' पद की प्रकृति बताता है, पर उसकी सटीक जिम्मेदारियों को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: यीशु के चरणों में गिरकर
  rationale: मूल की शारीरिक मुद्रा और नम्र, अत्यावश्यक विनती दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεκάλει
  choice: विनती करने लगा
  rationale: अपूर्णकाल रूप लगातार अथवा आग्रहपूर्ण निवेदन का भाव देता है; यह चयन उसी भाव को सहज हिन्दी में रखता है।
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: उसके घर चलें
  rationale: शाब्दिक 'उसके घर में प्रवेश करें' की अपेक्षा हिन्दी में निमंत्रण/निवेदन का स्वाभाविक रूप है और अर्थ सुरक्षित रखता है।
