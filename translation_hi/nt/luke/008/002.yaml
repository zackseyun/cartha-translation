source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: hi
  text: और कुछ स्त्रियाँ[a], जिन्हें दुष्ट आत्माओं और बीमारियों से चंगा किया गया था—मगदलीनी कहलाने वाली मरियम, जिसमें से सात दुष्टात्माएँ निकल गई थीं[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कतिपय स्त्रियाँ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘बाहर आ गई थीं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: कुछ स्त्रियाँ
  rationale: τινες बहुवचन संज्ञा के साथ एक अनिश्चित समूह को दर्शाता है। ‘कुछ स्त्रियाँ’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: τεθεραπευμέναι
  choice: चंगा किया गया था
  rationale: ἦσαν के साथ यह पूर्ण निष्क्रिय कृदंत पहले हो चुके उपचार और उसके बने हुए परिणाम को व्यक्त करता है। बहुवचन स्त्रियों के लिए सम्बन्धवाचक उपवाक्य में ‘जिन्हें ... चंगा किया गया था’ स्वाभाविक हिन्दी है और आत्मिक तथा शारीरिक दोनों प्रकार की पीड़ा को समेटता है।
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: दुष्ट आत्माओं से
  rationale: πονηρῶν का सीधा अर्थ ‘दुष्ट’ है; मूल पाठ में ‘अशुद्ध’ के लिए ἀκάθαρτος नहीं आया है।
- source_word: καὶ ἀσθενειῶν
  choice: और बीमारियों से
  rationale: ἀσθένεια यहाँ रोग या शारीरिक दुर्बलता को सूचित करता है। ‘बीमारियाँ’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: Μαρία ἡ καλουμένη Μαγδαληνή
  choice: मगदलीनी कहलाने वाली मरियम
  rationale: कृदंत καλουμένη मरियम की पहचान ‘मगदलीनी’ नाम से कराता है। यह क्रम हिन्दी में सहज है और मूल अर्थ को बनाए रखता है।
- source_word: ἀφ’ ἧς
  choice: जिसमें से
  rationale: ἀπό अलगाव या स्रोत को दर्शाता है। ‘जिसमें से’ हिन्दी में दुष्टात्माओं के निकलने की बात को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δαιμόνια ἑπτὰ
  choice: सात दुष्टात्माएँ
  rationale: δαιμόνια विशेष रूप से दुष्टात्मिक प्राणियों को दर्शाता है और पहले आए व्यापक πνεύματα से शब्दगत भेद बनाए रखता है।
- source_word: ἐξεληλύθει
  choice: निकल गई थीं
  rationale: ἐξέρχομαι का पूर्णभूत रूप बताता है कि दुष्टात्माओं का निकलना कथा के इस समय से पहले पूरा हो चुका था। ‘निकल गई थीं’ इस पूर्व पूर्ण घटना को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्मिक पीड़ा की भाषा
  choice: ‘दुष्ट आत्माओं’ और ‘दुष्टात्माएँ’ को वास्तविक व्यक्तिगत दुष्टात्मिक सत्ताओं की भाषा के रूप में रखा गया है।
  alternative: इसे केवल मानसिक या शारीरिक रोगों का रूपक मानकर अनुवाद करना।
  rationale: यूनानी पाठ πνευμάτων πονηρῶν और δαιμόνια को ἀσθενειῶν से अलग रखता है। अनुवाद आत्मिक पीड़ा और बीमारी के इस भेद को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पद पिछले वाक्य से जुड़ा हुआ अंश है, इसलिए आरम्भ का ‘और’ तथा अन्त का अल्पविराम बनाए रखा गया है। ‘चंगा किया गया था’ उपचार के निष्क्रिय भाव और उसके स्थायी परिणाम को सुरक्षित रखता है।
