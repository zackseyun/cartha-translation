source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: hi
  text: उसने कहा, “तुम्हें परमेश्वर के राज्य के भेदों[a] को जानने के लिए दिया गया है, पर बाकी लोगों को दृष्टान्तों में बताया जाता है, ताकि वे देखते हुए भी न देखें और सुनते हुए भी न समझें।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रहस्य।” यहाँ “भेद” से आशय परमेश्वर के राज्य के उन सत्यों से है जो कुछ लोगों से छिपे हैं और दूसरों पर प्रकट किए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: “ताकि वे देखते हुए भी न देखें और सुनते हुए भी न समझें” यशायाह 6:9–10 की प्रतिध्वनि है। इसे दैवी उद्देश्य, न्यायिक परिणाम, या दोनों को व्यक्त करनेवाला समझा जा सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: वरदान दिया गया है
  rationale: यूनानी पूर्णकालिक कर्मवाच्य पहले दिए गए अनुग्रह और उससे बनी वर्तमान स्थिति को व्यक्त करता है। कर्मवाच्य के कारण देनेवाला मूल पाठ की तरह निहित रहता है।
- source_word: γνῶναι
  choice: जानने
  rationale: ‘जानने’ से γινώσκω का सीधा अर्थ बना रहता है और पद के अंत में συνίημι के लिए प्रयुक्त ‘समझें’ से भेद भी सुरक्षित रहता है।
- source_word: μυστήρια
  choice: भेदों
  rationale: ‘भेद’ उन दैवी सत्यों को दर्शाता है जो छिपे थे और प्रकट किए जाते हैं; आधुनिक हिन्दी में ‘रहस्य’ की तुलना में यह निजी गूढ़वाद का संकेत कम देता है। वैकल्पिक शब्द पादटिप्पणी में दिया गया है।
- source_word: βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: यह परिचित और व्यापक अभिव्यक्ति परमेश्वर के शासन तथा उसके राज्य—दोनों अर्थ-छायाओं को समेट सकती है।
- source_word: τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  choice: पर बाकी लोगों को ये बातें दृष्टान्तों में बताई जाती हैं
  rationale: यूनानी वाक्यांश में क्रिया लुप्त है। स्वाभाविक हिन्दी के लिए उसे स्पष्ट किया गया है, जबकि ‘बाकी लोगों’ और ‘दृष्टान्तों में’ का अर्थ सुरक्षित रखा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम—दोनों की सम्भावना खुली रखता है और यूनानी कथन की धर्मवैचारिक तीक्ष्णता को नरम नहीं करता।
- source_word: βλέποντες μὴ βλέπωσιν
  choice: वे देखते हुए भी न देखें
  rationale: एक ही धातु की पुनरावृत्ति बनाए रखी गई है; ‘हुए भी’ हिन्दी में इसके विरोधाभासी/रियायती भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: सुनते हुए भी न समझें
  rationale: ‘समझें’ συνίημι का स्वाभाविक आधुनिक हिन्दी समतुल्य है और सुनने तथा बोध करने का भेद बनाए रखता है।
theological_decisions:
- issue: यशायाह 6 की प्रतिध्वनि में ἵνα उपवाक्य का उद्देश्य अथवा परिणाम
  choice: ‘ताकि’ द्वारा उद्देश्य/परिणाम का तनाव बनाए रखा गया
  alternative: ‘जिसके परिणामस्वरूप’ कहकर केवल परिणाम पर बल देना, अथवा ‘क्योंकि’ कहकर उद्देश्य-भाव को नरम करना
  rationale: ἵνα उद्देश्य और परिणाम दोनों से जुड़ सकता है। अनुवाद को यह निर्णय नहीं करना चाहिए कि यहाँ केवल दैवी न्याय का उद्देश्य है या न्यायिक परिणाम; मूल पाठ की सम्भावित दोनों दिशाएँ सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के अपूर्ण वाक्यांश को हिन्दी में स्वाभाविक बनाने के लिए ‘ये बातें ... बताई जाती हैं’ जोड़ा गया है। ‘दृष्टान्त’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है; उद्देश्य और न्याय से जुड़े धर्मवैचारिक तनाव को स्पष्ट किए बिना सुरक्षित रखा गया है।
