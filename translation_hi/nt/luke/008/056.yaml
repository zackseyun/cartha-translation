  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: hi
  text: उसके माता-पिता चकित रह गए[a], पर उसने उन्हें निर्देश दिया[b] कि वे किसी को न बताएँ कि क्या हुआ था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आश्चर्य से अभिभूत हो गए”; क्रिया अत्यन्त विस्मय, यहाँ तक कि अपने-आपे से बाहर हो जाने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “आदेश दिया” अथवा “आज्ञा दी।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वह बात जो घटित हुई थी” अथवा “घटना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: चकित रह गए
  rationale: यह क्रिया यहाँ अत्यन्त आश्चर्य से अभिभूत होने का भाव देती है। ‘चकित रह गए’ आधुनिक हिन्दी में स्वाभाविक है और प्रतिक्रिया की तीव्रता को स्पष्ट रखती है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: γονεῖς का सीधा और प्रचलित हिन्दी समतुल्य ‘माता-पिता’ है।
- source_word: παρήγγειλεν
  choice: आदेश दिया
  rationale: παραγγέλλω में अधिकारपूर्वक निर्देश देने का बल है। ‘आदेश दिया’ उस बल को सुरक्षित रखता है, जबकि आगे का उपवाक्य आदेश की विषयवस्तु बताता है।
- source_word: μηδενὶ
  choice: किसी को न
  rationale: निषेध के साथ μηδενί का स्वाभाविक हिन्दी रूप ‘किसी को न’ है।
- source_word: εἰπεῖν
  choice: बताएँ
  rationale: व्यक्ति-वाचक अप्रत्यक्ष कर्म के साथ εἰπεῖν का आशय किसी को घटना बताना है; इसलिए ‘बताएँ’ हिन्दी में ‘कहें’ से अधिक स्वाभाविक है।
- source_word: τὸ γεγονός
  choice: जो कुछ हुआ था
  rationale: पूर्ण कृदन्त का संज्ञात्मक प्रयोग घटित घटना की ओर संकेत करता है। ‘जो कुछ हुआ था’ पूर्ण हो चुकी घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ माता-पिता की चकित प्रतिक्रिया और यीशु के निर्देश के बीच हल्का विरोध दिखाता है; ‘पर’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के मौन रखने के निर्देश का आशय और सीमा
  choice: किसी को घटना न बताने के निर्देश को सीधे रूप में प्रस्तुत किया गया है।
  alternative: इसे व्यापक ‘मसीही रहस्य’ की नीति अथवा केवल अस्थायी और सीमित निर्देश के रूप में स्पष्ट करना।
  rationale: पद निर्देश का कारण, अवधि या व्यापक धर्मवैज्ञानिक उद्देश्य नहीं बताता; इसलिए अनुवाद उस तनाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चकित रह गए’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी यूनानी क्रिया की अधिक तीव्र अर्थ-छाया सुरक्षित रखती है। ‘आदेश दिया’ मूल क्रिया के अधिकारपूर्ण निर्देश को व्यक्त करता है; सम्मानसूचक बहुवचन ‘बताएँ’ माता-पिता के लिए स्वाभाविक हिन्दी प्रयोग है।
