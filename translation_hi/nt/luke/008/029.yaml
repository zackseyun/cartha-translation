id: LUK.8.29
reference: Luke 8:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: hi
  text: क्योंकि यीशु उस अशुद्ध आत्मा को उस मनुष्य में से निकल जाने की आज्ञा दे रहे थे। क्योंकि उस अशुद्ध आत्मा ने उसे बहुत समय से[a] दबोच रखा था। उसे जंजीरों और बेड़ियों से बाँधकर पहरे में रखा जाता था, और वह बंधनों को तोड़कर दुष्टात्मा के द्वारा सुनसान जगहों[b] में खदेड़ दिया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत बार।” यूनानी पद का अर्थ बार-बार होने वाली घटनाएँ भी हो सकता है, पर यहाँ इसका स्वाभाविक अर्थ लम्बी अवधि है।
    reason: lexical_alternative
  - marker: b
    text: या, “वीरान प्रदेशों में।” यूनानी में यह बहुवचन है—शाब्दिक अर्थ, “सुनसान जगहों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: आज्ञा दी थी
  rationale: अपूर्ण भूतकाल यहाँ कारण बताने वाले γάρ के साथ पृष्ठभूमि की उस आज्ञा को दर्शाता है जो आगे के संवाद से पहले दी गई थी; हिन्दी में पूर्णभूत स्वाभाविक है।
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: अशुद्ध आत्मा
  rationale: नए नियम की प्रचलित अभिव्यक्ति और अशुद्धता से जुड़े मूल शब्द-संबंध को बनाए रखता है।
- source_word: πολλοῖς χρόνοις
  choice: बहुत बार
  rationale: बहुवचन और बार-बार बाँधे जाने के प्रसंग से पुनरावृत्त घटनाओं का अर्थ उपयुक्त है; दीर्घ अवधि की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: συνηρπάκει
  choice: धर दबोचता था
  rationale: अचानक और बलपूर्वक काबू में कर लेने का भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: जंजीरों और बेड़ियों से
  rationale: दो अलग प्रकार के बंधनों को स्पष्ट और प्रचलित हिन्दी शब्दों से अलग-अलग रखता है।
- source_word: φυλασσόμενος
  choice: उस पर पहरा रखते
  rationale: निष्क्रिय कृदंत का परिस्थितिजन्य अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: बंधनों को तोड़ डालता था
  rationale: δεσμά को सामान्य 'बंधन' कहने से पहले आए जंजीरों और बेड़ियों की अनावश्यक पुनरावृत्ति नहीं होती; 'तोड़ डालता' क्रिया की शक्ति रखता है।
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: दुष्टात्मा उसे ... खदेड़ ले जाता था
  rationale: ग्रीक निष्क्रिय रचना को स्वाभाविक हिन्दी सक्रिय वाक्य में बदलते हुए दुष्टात्मा की बलपूर्वक प्रेरक भूमिका सुरक्षित रखी गई है।
- source_word: εἰς τὰς ἐρήμους
  choice: सुनसान जगहों में
  rationale: ग्रीक बहुवचन को बनाए रखता है और किसी विशिष्ट रेगिस्तानी भूभाग का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον और δαιμόνιον का चित्रण
  choice: इनका सीधा अनुवाद क्रमशः ‘अशुद्ध आत्मा’ और ‘दुष्टात्मा’ किया गया है।
  alternative: इन्हें केवल बीमारी या मानसिक अवस्था के रूप में समझाकर अनुवाद करना।
  rationale: वर्णन व्यक्तिगत अलौकिक कर्तृत्व प्रस्तुत करता है; अनुवाद उसे न तो मनोवैज्ञानिक रूपक बनाता है, न उससे आगे कोई साम्प्रदायिक व्याख्या जोड़ता है।
- issue: καί के प्रसंगगत विरोध का हिन्दी में रूप
  choice: ‘फिर भी’
  alternative: सिर्फ ‘और’
  rationale: ग्रीक में साधारण संयोजक है, पर पहरे और बंधनों के बावजूद उनके टूटने का निहित विरोध हिन्दी में ‘फिर भी’ से स्वाभाविक रूप में स्पष्ट होता है; इससे घटना का आशय नहीं बदला जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दुष्टात्मा’ हिन्दी बाइबलीय प्रयोग में ‘दानव’ से अधिक स्वाभाविक है और भारतीय पौराणिक अर्थछाया से बचाता है।
