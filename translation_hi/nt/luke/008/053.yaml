  text: And they were laughing at him, because they knew that she had died.
translation:
  language: hi
  text: और वे उस पर हँस रहे थे, क्योंकि वे जानते थे कि वह मर चुकी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: हँस रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार हो रही उपहासपूर्ण प्रतिक्रिया को व्यक्त करता है। ‘उस पर हँस रहे थे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में निहित तिरस्कार भी प्रकट करता है।
- source_word: αὐτοῦ
  choice: उस पर
  rationale: καταγελάω के साथ यह सर्वनाम उस व्यक्ति को सूचित करता है जिसका उपहास किया जा रहा था; हिन्दी में ‘उस पर हँसना’ इसका स्वाभाविक रूप है।
- source_word: εἰδότες
  choice: क्योंकि वे जानते थे
  rationale: यद्यपि यूनानी में यह कृदन्त है, प्रसंग में उनके हँसने का कारण बताता है। कारणवाचक उपवाक्य साधारण हिन्दी में अर्थ को स्पष्ट और सहज रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनके ज्ञान की विषय-वस्तु प्रस्तुत करता है—वे जानते थे ‘कि’ वह मर चुकी थी।
- source_word: ἀπέθανεν
  choice: मर चुकी थी
  rationale: अओरिस्ट मृत्यु की घटित और पूर्ण घटना बताता है। हिन्दी का पूर्णभूत ‘मर चुकी थी’ कथानक में उस समय से पहले पूरी हो चुकी घटना को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या क्रिया के स्त्रीलिंग कर्ता की पहचान स्पष्ट करने के लिए ‘लड़की’ या ‘बच्ची’ जोड़ा जाए
  choice: वह मर चुकी थी
  alternative: लड़की मर चुकी थी / बच्ची मर चुकी थी
  rationale: यूनानी पाठ में यहाँ कोई संज्ञा नहीं है; कर्ता आसपास के प्रसंग से स्पष्ट है। ‘वह’ स्रोत की संक्षिप्तता बनाए रखता है और अनावश्यक शब्द नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘उपहास कर रहे थे’ की अपेक्षा ‘उस पर हँस रहे थे’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि प्रसंग तिरस्कार का भाव स्पष्ट करता है।
