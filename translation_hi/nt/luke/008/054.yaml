source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: hi
  text: परन्तु उसने उसका हाथ पकड़कर ऊँचे स्वर में कहा, “बच्ची[a], उठ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़की।” यूनानी शब्द παῖς का अर्थ “बच्चा” हो सकता है और इस प्रसंग में “लड़की” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: परन्तु उसने
  rationale: δέ यहाँ कथा में विरोधात्मक मोड़ देता है; αὐτός को हिन्दी में स्वाभाविक सर्वनाम से व्यक्त किया गया है, अनावश्यक बल के लिए ‘स्वयं’ नहीं जोड़ा गया।
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: उसका हाथ पकड़कर
  rationale: यह हिन्दी में हाथ थामने की ठोस क्रिया को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐφώνησεν λέγων
  choice: ऊँचे स्वर में कहा
  rationale: φωνέω सुनाई देने वाली पुकार को सूचित करता है; ‘ऊँचे स्वर में कहा’ इसे बिना व्याकुलता का भाव जोड़े सहज हिन्दी में व्यक्त करता है। λέγων को अलग से दोहराने के बजाय इसी वाक्यांश में समाहित किया गया है।
- source_word: Ἡ παῖς
  choice: बच्ची
  rationale: παῖς का अर्थ ‘बालक/बच्चा’ हो सकता है, पर प्रसंग में संबोधित व्यक्ति लड़की है; ‘बच्ची’ आधुनिक हिन्दी में स्वाभाविक, स्नेहपूर्ण और आयु-सापेक्ष संबोधन है।
- source_word: ἔγειρε
  choice: उठ
  rationale: वर्तमान आज्ञार्थक का सीधा और स्वाभाविक आधुनिक हिन्दी रूप; यह खड़े होने अथवा जीवन में उठने की प्रसंगगत शक्ति को खुला रखता है।
theological_decisions:
- issue: यीशु द्वारा लड़की को संबोधन
  choice: बच्ची
  alternative: लड़की
  rationale: παῖς की बालक-संबंधी अर्थ-सीमा और प्रसंग में स्त्रीलिंग पहचान दोनों को ‘बच्ची’ सहज रूप से व्यक्त करता है; ‘छोटी लड़की’ कहकर समानान्तर वृत्तान्त की अधिक स्पष्ट लघुता आयात नहीं की गई।
- issue: जी उठाने की आज्ञा का अनुवाद
  choice: उठ
  alternative: जी उठ
  rationale: मूल ἔγειρε सीधे ‘उठ’ कहता है। ‘जी उठ’ चमत्कार का आशय स्पष्ट कर देता, पर मूल की संक्षिप्त आज्ञा और उसमें निहित अर्थगत तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। ‘ऊँचे स्वर में कहा’ पुकारने का भाव रखता है, जबकि ‘उठ’ संक्षिप्त प्रत्यक्ष आज्ञा को बनाए रखता है।
