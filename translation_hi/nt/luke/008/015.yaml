reference: Luke 8:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: hi
  text: परन्तु अच्छी मिट्टी में पड़ा बीज उन लोगों को दर्शाता है, जो अच्छे और नेक हृदय से वचन सुनकर उसे थामे रहते हैं और धीरज के साथ फल उत्पन्न करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: अच्छी मिट्टी में पड़ा बीज
  rationale: यूनानी वाक्यांश संक्षिप्त है और दृष्टान्त के संदर्भ में पहले बताए गए बीज की ओर संकेत करता है। हिन्दी में ‘बीज’ और ‘पड़ा’ जोड़ने से आशय स्वाभाविक और स्पष्ट होता है।
- source_word: καλῇ γῇ
  choice: अच्छी मिट्टी
  rationale: यहाँ γῆ खेती योग्य भूमि या मिट्टी है; ‘अच्छी मिट्टी’ दृष्टान्त की कृषि-छवि और उसके विरोधाभास को सहज रूप में बनाए रखता है।
- source_word: οὗτοί εἰσιν οἵτινες
  choice: उन लोगों को दर्शाता है, जो
  rationale: यह रचना दृष्टान्त के तत्व की पहचान उसके द्वारा सूचित लोगों से कराती है। हिन्दी में ‘दर्शाता है’ रूपक-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: अच्छे और नेक मन से
  rationale: καρδία यहाँ भीतरी व्यक्ति या आन्तरिक प्रवृत्ति को सूचित करता है। ‘अच्छे और नेक’ दोनों निकटार्थी विशेषणों की दोहरी नैतिक प्रशंसा बनाए रखते हैं; ‘मन’ आधुनिक हिन्दी में इस संदर्भ में स्वाभाविक है।
- source_word: ἀκούσαντες τὸν λόγον
  choice: वचन सुनकर
  rationale: 'अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले होने वाली क्रिया बताता है: वे पहले वचन सुनते हैं, फिर उसे थामे रहते और फल लाते हैं।'
- source_word: κατέχουσιν
  choice: उसे थामे रहते हैं
  rationale: κατέχω दृढ़ता से पकड़े रखने या सुरक्षित बनाए रखने का भाव देता है। ‘थामे रहते हैं’ सक्रिय और निरन्तर दृढ़ता को व्यक्त करता है।
- source_word: καρποφοροῦσιν
  choice: फल लाते हैं
  rationale: यह प्रचलित बाइबलीय-कृषि रूपक को बनाए रखता है और आधुनिक हिन्दी में सुबोध है।
- source_word: ἐν ὑπομονῇ
  choice: धीरज के साथ
  rationale: ὑπομονή कठिनाई के बीच स्थिर बने रहने और सहनशील दृढ़ता का भाव रखता है। ‘धीरज के साथ’ फल लाने के ढंग को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ग्रहणशील मन का नैतिक वर्णन
  choice: अच्छे और नेक मन से
  alternative: ईमानदार और अच्छे मन से; अच्छे और खरे मन से
  rationale: पद सुनने वालों की आन्तरिक प्रवृत्ति की प्रशंसा करता है, पर यह नहीं बताता कि ऐसा मन किस सिद्धान्तगत प्रक्रिया से बनता है। चुना हुआ अनुवाद दोनों यूनानी विशेषणों को अलग रूप में व्यक्त करता है और जन्मजात अच्छाई, पुनर्जन्म के क्रम या पुण्य के विषय में कोई अतिरिक्त मत नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ पूर्ववर्ती प्रकार की भूमि से विरोध को बनाए रखता है। ‘मन’ को यहाँ καρδία के आन्तरिक व्यक्ति वाले अर्थ में लिया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘अच्छे और नेक मन’ मूल की द्विगुणित नैतिक विशेषता को पर्याप्त रूप से सुरक्षित रखता है।
