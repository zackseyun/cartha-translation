  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: hi
  text: तब यीशु ने कहा, “वह कौन है जिसने मुझे छुआ?” लेकिन जब सभी इस बात से इनकार कर रहे थे, तो पतरस ने कहा, “स्वामी, भीड़ आपको चारों ओर से घेर रही है और आप पर दबाव डाल रही है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ आपके चारों ओर उमड़ रही है और आपको दबा रही है।”
    reason: συνέχω और ἀποθλίβω के संयुक्त चित्र का अधिक संक्षिप्त और बलयुक्त सम्भव अनुवाद।
lexical_decisions:
- source_word: ἁψάμενός μου
  choice: जिसने मुझे छुआ
  rationale: मध्यवाच्य ἅπτομαι यहाँ शारीरिक स्पर्श को व्यक्त करता है। ‘जिसने मुझे छुआ’ स्वाभाविक हिन्दी है और सापेक्ष-वाक्य के द्वारा यूनानी के ‘वह कौन है जिसने...’ वाले पहचानसूचक बल को बनाए रखता है।
- source_word: ἀρνουμένων δὲ πάντων
  choice: जब सभी इस बात से इनकार कर रहे थे
  rationale: वर्तमान कृदन्त चल रही क्रिया का भाव देता है। ‘इस बात से’ प्रसंग से पूरित है और हिन्दी में यह स्पष्ट करता है कि सभी स्वयं स्पर्श करने से इनकार कर रहे थे।
- source_word: Ἐπιστάτα
  choice: स्वामी
  rationale: लूका में यह यीशु के लिए आदर और मान्य अधिकार का संबोधन है। ‘स्वामी’ इस भाव को व्यक्त करता है, जबकि ‘प्रभु’ चुनने से κύριος से अधिक निकट और अपेक्षाकृत प्रबल उपाधि का अनावश्यक आरोप हो सकता था।
- source_word: οἱ ὄχλοι
  choice: लोगों की भीड़ें
  rationale: यूनानी बहुवचन को बनाए रखने के लिए ‘भीड़ें’ रखा गया है; ‘लोगों की’ से आधुनिक हिन्दी में अर्थ तुरंत स्पष्ट और अपेक्षाकृत स्वाभाविक बनता है।
- source_word: συνέχουσίν σε
  choice: आपको चारों ओर से घेर रही हैं
  rationale: συνέχω यहाँ चारों ओर से घेरकर स्थान संकुचित करने का चित्र देता है।
- source_word: ἀποθλίβουσιν
  choice: आपसे सटकर दबाव डाल रही हैं
  rationale: यह क्रिया भीड़ के निकट शारीरिक दबाव को व्यक्त करती है। ‘सटकर दबाव डालना’ पहले क्रियापद ‘घेरना’ से भेद भी बनाए रखता है और ‘कुचलना’ जितना अतिशयोक्तिपूर्ण नहीं है।
theological_decisions:
- issue: यीशु के लिए संबोधन Ἐπιστάτα का अनुवाद
  choice: स्वामी
  alternative: गुरु; प्रभु
  rationale: यहाँ मूल पाठ में κύριος नहीं, बल्कि लूका-विशिष्ट Ἐπιστάτα है। ‘स्वामी’ सम्मान और अधिकार को व्यक्त करता है; ‘गुरु’ केवल शिक्षकीय भूमिका की ओर झुक सकता है, और ‘प्रभु’ मूल शब्द से अधिक स्पष्ट मसीही उपाधि का भाव ला सकता है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और कथात्मक हिन्दी। यीशु के लिए आदरसूचक ‘आप’ और पतरस के संबोधन में ‘स्वामी’ रखा गया है। प्रश्न की यूनानी पहचानसूचक रचना को ‘वह कौन है जिसने...?’ द्वारा बनाए रखा गया है।
