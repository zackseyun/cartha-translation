source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: hi
  text: जिस आदमी में से दुष्टात्माएँ निकल गई थीं, वह यीशु से विनती करता रहा कि वह उनके साथ रहे; पर उन्होंने उसे विदा करके कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: विनती करता रहा
  rationale: अपूर्णकाल का रूप लगातार या बार-बार की गई आग्रहपूर्ण विनती को दर्शाता है; यह साधारण ‘पूछा’ से अधिक प्रबल और स्वाभाविक है।
- source_word: αὐτοῦ
  choice: यीशु से
  rationale: δέομαι के साथ संबंधकारक उस व्यक्ति को बताता है जिससे विनती की जाती है। हिन्दी में नाम स्पष्ट करने से लगातार आने वाले सर्वनामों की अस्पष्टता दूर होती है; संदर्भ में व्यक्ति यीशु हैं।
- source_word: ὁ ἀνὴρ
  choice: जिस पुरुष
  rationale: ἀνήρ पहले वर्णित वयस्क पुरुष को निर्दिष्ट करता है। संबंधवाचक उपवाक्य के साथ ‘जिस पुरुष’ हिन्दी में स्वाभाविक है।
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: जिस पुरुष में से दुष्टात्माएँ निकल गई थीं
  rationale: पूर्णभूतकालीन ἐξεληλύθει मुख्य क्रिया से पहले पूरी हो चुकी घटना दर्शाता है; ‘निकल गई थीं’ उस काल-संबंध को बनाए रखता है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माएँ
  rationale: यह हिन्दी बाइबलीय प्रयोग में व्यक्तिगत अलौकिक दुष्ट सत्ताओं का स्पष्ट और सामान्य नाम है; इसे केवल अस्पष्ट ‘बुरी शक्तियाँ’ नहीं बनाया गया।
- source_word: εἶναι σὺν αὐτῷ
  choice: उसे उनके साथ रहने दिया जाए
  rationale: ग्रीक का शाब्दिक भाव ‘उसके साथ होना’ है। हिन्दी में विनती के आशय को स्वाभाविक बनाने के लिए ‘रहने दिया जाए’ कहा गया है; ‘उनके’ आदरसूचक रूप से यीशु को संदर्भित करता है।
- source_word: ἀπέλυσεν αὐτόν
  choice: यीशु ने उसे विदा किया
  rationale: संदर्भ में यीशु उसकी विनती स्वीकार नहीं करते और उसे दूसरी दिशा देते हैं। ‘विदा किया’ स्वाभाविक है तथा अनावश्यक कठोरता नहीं जोड़ता।
- source_word: λέγων
  choice: कहते हुए कहा
  rationale: प्रस्तुत पाठ में इसे ‘विदा करते हुए कहा’ के संयुक्त रूप में रखा गया है, जो समकालिक कृदंत का भाव सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्माओं के उल्लेख को कैसे व्यक्त किया जाए
  choice: दुष्टात्माएँ
  alternative: बुरी आत्माएँ / दुष्ट शक्तियाँ
  rationale: मूल पाठ δαιμόνια को व्यक्तिगत अलौकिक सत्ताओं के रूप में प्रस्तुत करता है। ‘दुष्टात्माएँ’ इस दावे को बनाए रखता है और उसे मनोवैज्ञानिक या निराकार शक्तियों में नहीं बदलता।
- issue: पुरुष की इच्छा को शिष्यत्व की तकनीकी श्रेणी बनाना या मूल की सामान्य अभिव्यक्ति रखना
  choice: उनके साथ रहने दिया जाए
  alternative: वह उनका शिष्य बन जाए / उनके साथ चला जाए
  rationale: εἶναι σὺν αὐτῷ का अर्थ सामान्यतः ‘उसके साथ होना’ है। सम्भावित शिष्यत्व-संबंधी संकेत को नकारे बिना अनुवाद उसमें ऐसा तकनीकी अर्थ नहीं जोड़ता जो शब्दों में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यीशु के लिए आदरसूचक बहुवचन सर्वनाम रखा गया है। आरम्भ में कोई अतिरिक्त ‘अब’ नहीं जोड़ा गया, क्योंकि यूनानी में स्पष्ट कालवाचक ‘अब’ नहीं है। पद अगले पद के प्रत्यक्ष कथन की ओर ले जाने वाले अल्पविराम पर समाप्त होता है।
