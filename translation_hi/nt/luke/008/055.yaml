source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: hi
  text: और उसकी आत्मा लौट आई[a], और वह तुरन्त उठ खड़ी हुई, और यीशु ने निर्देश दिया कि उसे कुछ खाने को दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी श्वास लौट आई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आई
  rationale: यहाँ क्रिया लड़की के जीवन/आत्मा के लौटने को बताती है; ‘लौट आई’ स्वाभाविक हिन्दी है और मूल का ठोस भाव बनाए रखती है।
- source_word: τὸ πνεῦμα αὐτῆς
  choice: उसकी आत्मा
  rationale: πνεῦμα का अर्थ ‘आत्मा’ या ‘श्वास’ हो सकता है। मृत्यु से जिलाए जाने के प्रसंग में ‘उसकी आत्मा’ व्यापक अर्थ और धार्मिक तनाव को सुरक्षित रखता है; ‘उसकी श्वास’ सम्भव विकल्प है।
- source_word: ἀνέστη
  choice: वह उठ खड़ी हुई
  rationale: ἀνίστημι यहाँ शारीरिक रूप से उठने की तत्काल क्रिया दर्शाता है। ‘उठ खड़ी हुई’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रिया की तात्कालिकता पर बल देता है; ‘तुरन्त’ इसका संक्षिप्त और सामान्य हिन्दी समतुल्य है।
- source_word: διέταξεν
  choice: निर्देश दिया
  rationale: διατάσσω अधिकारपूर्वक आदेश या निर्देश देने का भाव रखता है। व्यावहारिक प्रसंग में ‘निर्देश दिया’ अधिकार और स्वाभाविकता दोनों बनाए रखता है।
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: उसे कुछ खाने को दिया जाए
  rationale: यह अनन्त क्रिया-विन्यास स्पष्ट रूप से बताता है कि उसे खाने के लिए कुछ दिया जाए। हिन्दी मुहावरे में यह मूल के δοθῆναι और φαγεῖν दोनों को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: पुनर्जीवन के प्रसंग में πνεῦμα का अर्थ
  choice: उसकी आत्मा लौट आई
  alternative: उसकी श्वास लौट आई
  rationale: मूल शब्द दोनों अर्थों की सम्भावना रखता है। मुख्य पाठ में ‘आत्मा’ पुनर्जीवन के प्रसंग और शब्द की व्यापक अर्थ-सीमा को अधिक अच्छी तरह सुरक्षित रखता है, जबकि ‘श्वास’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। कर्ता की अस्पष्टता से बचने के लिए प्रसंगानुसार ‘यीशु’ स्पष्ट किया गया है।
