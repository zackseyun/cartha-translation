- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: बीज बोनेवाला … निकला
  rationale: Ἐξῆλθεν का सामान्य आधुनिक हिन्दी रूप ‘निकला’ है। संज्ञा के रूप में प्रयुक्त ὁ σπείρων को ‘बीज बोनेवाला’ कहना स्वाभाविक है और पाठ में किसान होने की बात अनावश्यक रूप से नहीं जोड़ता।
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: अपना बीज बोने
  rationale: सकार्थक infinitive उद्देश्य बताता है; ‘अपना बीज बोने’ हिन्दी में गति के क्रियापद के साथ स्वाभाविक रूप से यही उद्देश्य व्यक्त करता है।
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: जब वह बो रहा था
  rationale: ἐν के साथ articular infinitive समकालिक क्रिया दर्शाता है। अपूर्ण वर्तमान भाव वाला ‘बो रहा था’ इस प्रक्रिया को स्पष्ट और सहज ढंग से रखता है।
- source_word: ὃ μὲν
  choice: कुछ बीज
  rationale: नपुंसकलिंग एकवचन संबंधवाचक रूप बीज के एक हिस्से को वितरणात्मक ढंग से इंगित करता है। हिन्दी में ‘कुछ बीज’ स्वाभाविक है और आगे आने वाले अन्य हिस्सों की भूमिका तैयार करता है।
- source_word: παρὰ τὴν ὁδόν
  choice: रास्ते के किनारे
  rationale: παρά के साथ कर्मकारक यहाँ रास्ते के पास या किनारे का स्थान बताता है। यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: κατεπατήθη
  choice: पैरों तले रौंदा गया
  rationale: निष्क्रिय क्रिया का अर्थ रौंदा जाना है। ‘पैरों तले’ हिन्दी में मुहावरेदार स्पष्टता देता है, यद्यपि यह क्रिया में निहित भाव को व्यक्त रूप में रखता है।
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षियों
  rationale: यह यूनानी पद शाब्दिक रूप से आकाश/स्वर्ग के पक्षियों को दर्शाता है। कृषि-दृश्य में ‘आकाश के पक्षी’ स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: κατέφαγεν αὐτό
  choice: उसे चट कर लिया
  rationale: κατεσθίω साधारण खाने से अधिक प्रबल, पूरा खा जाने का भाव देता है। ‘चट कर लिया’ साधारण आधुनिक हिन्दी में उस पूर्णता और तीव्रता को व्यक्त करता है।
