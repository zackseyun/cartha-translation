source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: hi
  text: उसने पीछे से पास आकर उनके वस्त्र की झालर[a] को छुआ, और उसी क्षण उसका रक्तस्राव रुक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किनारा,” “छोर,” अथवा “लटकन।”
    reason: κράσπεδον के सामान्य वस्त्र-किनारे और अधिक विशिष्ट लटकन—दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: पीछे से पास आकर
  rationale: क्रियाविशेषण ὄπισθεν पीछे की ओर स्थिति या वहाँ से आने को बताता है, और अओरिस्ट कृदंत προσελθοῦσα मुख्य क्रिया से पहले की निकट आने वाली सहायक क्रिया व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को बनाए रखता है।
- source_word: ἥψατο
  choice: छुआ
  rationale: इस प्रयोग में ἅπτω का मध्यम रूप सामान्यतः स्पर्श करने का अर्थ देता है; 'छुआ' अनावश्यक रूप से पकड़ने या हल्के स्पर्श की बारीकी नहीं जोड़ता।
- source_word: τοῦ κρασπέδου
  choice: झालर
  rationale: κράσπεδον वस्त्र के किनारे, छोर, झालर या लटकन को सूचित कर सकता है। 'झालर' संभावित वस्त्र-सीमा और लटकन, दोनों की छाया बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: उनके वस्त्र की
  rationale: ἱμάτιον सामान्यतः वस्त्र, विशेषकर बाहरी वस्त्र, को बताता है। 'वस्त्र' व्यापक और गरिमापूर्ण है तथा चोगा या ओढ़नी जैसी अनावश्यक विशिष्टता नहीं जोड़ता। सम्मानसूचक 'उनके' आधुनिक हिंदी कथन में यीशु के लिए स्वाभाविक है।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: यह क्रियाविशेषण परिणाम की तात्कालिकता व्यक्त करता है। 'उसी क्षण' आधुनिक हिंदी में स्पष्ट और प्रभावपूर्ण है।
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: उसका रक्तस्राव रुक गया
  rationale: यूनानी वाक्यांश का शाब्दिक आशय उसके रक्त के बहाव का रुकना है। 'रक्तस्राव' संदर्भ में सटीक, संक्षिप्त और सहज चिकित्सकीय शब्द है।
theological_decisions:
- issue: κράσπεδον में यहूदी वस्त्र की विशिष्ट लटकन का संभावित संकेत
  choice: मुख्य पाठ में 'झालर'
  alternative: किनारा, छोर या लटकन
  rationale: यह शब्द सामान्य वस्त्र-किनारे अथवा व्यवस्था से संबद्ध लटकन को सूचित कर सकता है। पद स्वयं किसी एक अर्थ को निश्चित नहीं करता, इसलिए मुख्य पाठ व्यापक शब्द रखता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। 'रक्तस्राव' सटीक और सामान्यतः समझ में आने वाला है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्द के तुरंत बाद रखा गया है।
