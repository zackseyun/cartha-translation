  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: hi
  text: जब उस स्त्री ने देखा कि वह छिपी नहीं रह सकी[a], तो वह काँपती हुई आई और उसके सामने गिर पड़ी[b]। उसने सब लोगों के सामने बताया कि उसने उसे क्यों छुआ था और वह उसी क्षण कैसे चंगी हो गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह नज़र से नहीं बच सकी” अथवा “उसका किया हुआ छिपा नहीं रहा।”
    reason: lexical_alternative
  - marker: b
    text: या “उसके पाँवों के आगे गिर पड़ी।” यूनानी पाठ में शाब्दिक रूप से “उसके सामने गिरकर” है; उसमें पाँवों का स्पष्ट उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: जब ... ने देखा
  rationale: अओरिस्ट कृदंत मुख्य क्रिया की परिस्थिति बताता है; हिंदी में कालगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἔλαθεν
  choice: वह छिपी नहीं रह सकी
  rationale: λανθάνω के भाव—नज़र से बचना या छिपा रहना—को स्त्री की स्थिति के संदर्भ में स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τρέμουσα
  choice: काँपती हुई
  rationale: शारीरिक और भावनात्मक अवस्था की सजीवता बनाए रखता है और इसे केवल भय के रूप में सीमित नहीं करता।
- source_word: προσπεσοῦσα αὐτῷ
  choice: उसके सामने गिरकर
  rationale: मूल यूनानी में सामने गिरने का भाव है; 'पाँवों पर' न जोड़कर स्रोत की अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: δι’ ἣν αἰτίαν
  choice: क्यों
  rationale: कारण पूछने या बताने वाले वाक्यांश का संक्षिप्त, आधुनिक और स्वाभाविक हिंदी रूप।
- source_word: ἥψατο αὐτοῦ
  choice: उसने उसे ... छुआ था
  rationale: ἅπτομαι के सामान्य अर्थ 'छूना' को रखता है; 'था' सार्वजनिक कथन से पहले हुई क्रिया को दर्शाता है।
- source_word: ἀπήγγειλεν
  choice: बताने लगी
  rationale: सार्वजनिक रूप से वृत्तांत सुनाने का भाव सहज हिंदी में देता है; इसे औपचारिक धार्मिक घोषणा नहीं बनाता।
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: सब लोगों के सामने
  rationale: उपस्थित समस्त लोगों के समक्ष बोलने का स्पष्ट और स्रोत-संगत अनुवाद।
- source_word: ὡς ἰάθη
  choice: कैसे ... चंगी हो गई थी
  rationale: ὡς के रीति/घटना-वर्णन संबंधी भाव को सुरक्षित रखता है और चंगाई को उसके बाद के कथन से पूर्व की घटना दिखाता है।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: तत्काल घटित होने पर लूका के बल को प्राकृतिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: स्त्री के सार्वजनिक कथन और मुद्रा का स्वरूप
  choice: 'पद को वर्णनात्मक रखा गया है: वह काँपती हुई आई, सामने गिरी और कारण तथा चंगाई बताई।'
  alternative: इसे स्पष्ट पश्चाताप, आराधना या विश्वास की औपचारिक स्वीकारोक्ति कहना।
  rationale: यूनानी पाठ श्रद्धा या विनती का संकेत दे सकने वाली मुद्रा बताता है, पर स्पष्टतः पश्चाताप या आराधना नहीं कहता; इसलिए धार्मिक अर्थ का अनावश्यक विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। 'चंगी' बाइबलीय हिंदी में परिचित है और यहाँ शारीरिक आरोग्य को स्पष्ट करती है। सर्वनाम मूल पाठ की तरह रखे गए हैं; संदर्भ में उनका आशय स्पष्ट है।
