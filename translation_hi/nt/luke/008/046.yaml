source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: hi
  text: पर यीशु ने कहा, “किसी ने मुझे छुआ है, क्योंकि मुझे मालूम हुआ कि मुझमें से सामर्थ्य निकली है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: किसी ने मुझे छुआ है
  rationale: अनिश्चित सर्वनाम τις और स्पर्श की पूर्ण क्रिया का स्वाभाविक तथा सटीक हिन्दी रूप।
- source_word: ἔγνων
  choice: मुझे मालूम हुआ
  rationale: यहाँ यीशु द्वारा सामर्थ्य निकलने को जान लेने/पहचान लेने का बोध देता है; वर्तमान संदर्भ में यह साधारण पाठकों के लिए स्वाभाविक है और मात्र इंद्रियगत अनुभव तक अर्थ को सीमित नहीं करता।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: लूका के संदर्भ में चंगाई की प्रभावकारी शक्ति के लिए dignified और प्रचलित बाइबिलीय हिन्दी शब्द।
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: मुझमें से सामर्थ्य निकली है
  rationale: 'पूर्ण कृदन्त का परिणामकारी भाव बनाए रखता है: सामर्थ्य यीशु से निकल चुकी है।'
theological_decisions:
- issue: यीशु के जानने की प्रकृति
  choice: मुझे मालूम हुआ
  alternative: मैंने अनुभव किया
  rationale: ἔγνων मूलतः जानने/पहचानने को व्यक्त करता है। अनुवाद इसे केवल शारीरिक अनुभूति नहीं बनाता और न ही यह निर्धारित करता है कि यीशु ने किस प्रकार जाना।
- issue: सामर्थ्य का यीशु से निकलना
  choice: मुझमें से सामर्थ्य निकली है
  alternative: मेरे पास से शक्ति निकल गई है
  rationale: ἀπ’ ἐμοῦ के स्रोत-संबंध और पूर्ण क्रिया के परिणामी भाव को स्पष्ट रखा गया है, बिना चंगाई की प्रक्रिया की अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक संवाद के अनुरूप है। “पर” δέ के हल्के विरोधात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
