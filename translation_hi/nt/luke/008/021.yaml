  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “मेरी माँ और मेरे भाई[a] वे हैं जो परमेश्वर का वचन सुनते और उस पर अमल करते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहन।” यूनानी में शब्दशः “भाई” है, पर इस कथन का लागू होना केवल पुरुषों तक ही सीमित हो, यह आवश्यक नहीं है।
