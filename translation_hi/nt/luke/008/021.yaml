lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: उसने उन्हें उत्तर दिया
  rationale: यूनानी कथन-युग्म का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘उत्तर देकर कहा’ अधिक शब्दशः होता, पर यहाँ अनावश्यक रूप से भारी लगता।
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: मेरी माँ और मेरे भाई
  rationale: संज्ञाओं और स्वत्व-संबंध को सीधे रखा गया है। ἀδελφοί व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और प्रसंग में यीशु के वास्तविक भाइयों की प्रतिध्वनि भी रखता है; व्यापक अनुप्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οὗτοί εἰσιν οἱ
  choice: वे हैं जो
  rationale: यह हिन्दी में स्वाभाविक रहते हुए संकेतवाचक पहचान और आगे आने वाले कृदन्तीय वर्णन को जोड़ता है। ‘ये हैं—वे जो’ अधिक शब्दशः, पर हिन्दी में अपेक्षाकृत अटपटा होता।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह λόγος के ‘वचन/संदेश’ अर्थ और संबंधकारक संरचना को बनाए रखने वाला प्रचलित तथा अर्थपूर्ण हिन्दी रूप है।
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: सुनते और उस पर अमल करते हैं
  rationale: वर्तमान कृदन्तों की निरंतर विशेषता को हिन्दी के सामान्य वर्तमान काल से व्यक्त किया गया है। ‘उस पर अमल करते हैं’ ποιεῖν का स्वाभाविक हिन्दी अर्थ देता है, बिना इसे केवल मानसिक सहमति तक सीमित किए।
theological_decisions:
- issue: यीशु द्वारा परिवार की पुनर्परिभाषा का दायरा
  choice: वचन सुनने और उस पर अमल करने वालों को यीशु अपनी माँ और भाई कहते हैं।
  alternative: इसे यीशु द्वारा अपने जैविक परिवार का पूर्ण अस्वीकार मानना।
  rationale: पद उत्तरदायी श्रोताओं को पारिवारिक निकटता देता है, पर जैविक परिवार को स्पष्टतः नकारता नहीं; अनुवाद इस तनाव को खुला रखता है।
- issue: ἀδελφοί का लिंग और व्यापक अनुप्रयोग
  choice: मुख्य पाठ में ‘भाई’, व्यापक अर्थ की संभावना पादटिप्पणी में।
  alternative: मुख्य पाठ में ‘भाई-बहन’।
  rationale: ‘भाई’ यूनानी के पुल्लिंग बहुवचन और तत्काल पारिवारिक संदर्भ को सुरक्षित रखता है, जबकि कथन का अनुप्रयोग केवल पुरुषों तक सीमित होना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य-संरचना को अत्यधिक शब्दशः बनाने के बजाय स्वाभाविक रखा गया है, जबकि ‘परमेश्वर का वचन’ जैसी प्रमुख धार्मिक अभिव्यक्ति सुरक्षित है।
