review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the causal connection, Jairus''s only daughter, her approximate age, her ongoing dying, and the crowd''s intense pressure. However, “भीड़ें उसे चारों ओर से दबाए जा रही थीं” is grammatically misdirected in Hindi: it can imply that the crowds were being pressed, rather than that they were pressing Jesus. The pronoun “वह” in “जब वह जा रहा था” can also be momentarily ambiguous in the immediate context.'
  naturalness: “भीड़ें” is a marked and less idiomatic Hindi rendering. Hindi naturally uses the collective singular “भीड़” here without losing the sense of a pressing multitude. Naming यीशु in the second sentence makes the referent immediately clear, and “भीड़ उन्हें चारों ओर से दबा रही थी” is natural, accurate, and suitably vivid.
  terminology: “एकमात्र बेटी” is a clear, natural equivalent of μονογενὴς with θυγάτηρ and avoids any unintended ‘begotten’ sense. “लगभग बारह वर्ष” preserves the approximation expressed by ὡς. The footnote appropriately retains “इकलौती बेटी” as a lexical alternative.
  issues:
  - severity: medium
    issue: The clause “भीड़ें उसे चारों ओर से दबाए जा रही थीं” has an unsuitable verbal construction.
    rationale: 'The Greek συνέπνιγον is active: the crowds were pressing Jesus. In Hindi, “दबाए जा रही थीं” is a passive/progressive construction whose grammatical force is unclear and may reverse the action. An active construction is needed.'
  - severity: low
    issue: The referent of “वह” in “जब वह जा रहा था” is potentially unclear.
    rationale: The Greek pronoun refers to Jesus, whereas the preceding sentence concerns Jairus's daughter. Explicitly naming यीशु removes avoidable ambiguity.
  - severity: low
    issue: “भीड़ें” is overly literal and less idiomatic in this Hindi context.
    rationale: Although Greek uses a plural noun, Hindi commonly expresses a mass of people as singular collective “भीड़.” This is natural modern Hindi and does not alter the source meaning.
  revised_text: क्योंकि उसकी एकमात्र बेटी थी[a], जिसकी उम्र लगभग बारह वर्ष थी, और वह मर रही थी। यीशु के जाते समय भीड़ उन्हें चारों ओर से दबा रही थी[b]।
