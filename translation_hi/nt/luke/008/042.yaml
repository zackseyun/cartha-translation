base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: hi
  text: क्योंकि उसकी एकमात्र बेटी थी[a], जिसकी उम्र लगभग बारह वर्ष थी, और वह मर रही थी। यीशु के जाते समय भीड़ उन्हें चारों ओर से दबा रही थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इकलौती बेटी।’
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी क्रिया का अर्थ इतनी कसकर दबाना भी हो सकता है कि मानो दम घुटने लगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: एक ही बेटी
  rationale: θυγάτηρ के साथ इसका अर्थ उसकी इकलौती अथवा एकमात्र बेटी है; यहाँ जन्म या उत्पत्ति पर केंद्रित अर्थ नहीं है।
- source_word: ὡς ἐτῶν δώδεκα
  choice: लगभग बारह वर्ष की
  rationale: ὡς संख्या को अनुमानित बताता है; हिन्दी में यह आयु व्यक्त करने का स्वाभाविक ढंग है।
- source_word: ἀπέθνῃσκεν
  choice: मर रही थी
  rationale: अपूर्णकाल चल रही मृत्यु-प्रक्रिया को दिखाता है, न कि यह कि उसकी मृत्यु हो चुकी थी।
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: जब वह जा रहा था
  rationale: ἐν के साथ संज्ञार्थक क्रियारूप समकालीन क्रिया व्यक्त करता है; सर्वनाम मूल पाठ की अभिव्यक्ति को बनाए रखता है।
- source_word: οἱ ὄχλοι
  choice: भीड़ें
  rationale: मूल यूनानी में संज्ञा बहुवचन है; हिन्दी में बहुवचन रखना उस रूप को सुरक्षित रखता है।
- source_word: συνέπνιγον
  choice: चारों ओर से दबाए जा रही थीं
  rationale: क्रिया बहुत कसकर घेरने और दबाने का शारीरिक भाव देती है; यह अनुवाद उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है, पर वास्तविक दम घुटने की बात निश्चित रूप से नहीं जोड़ता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में याईर की विनती का कारण बताता है और पद के कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: αὐτῷ
  choice: उसकी ... थी
  rationale: ἦν के साथ यह सम्प्रदान कारक स्वामित्व व्यक्त करता है; हिन्दी में सम्बन्धकारक रचना स्वाभाविक है।
