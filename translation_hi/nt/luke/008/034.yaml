  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: hi
  text: जब सूअरों को चराने वाले लोगों ने देखा कि जो हुआ था, तो वे भाग गए और उन्होंने नगर और देहात में इसकी खबर दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδόντες
  choice: जब ... ने देखा
  rationale: अोरिस्ट कृदंत को मुख्य क्रियाओं के साथ उसके काल-संबंध को स्वाभाविक हिन्दी में व्यक्त करने के लिए कालवाचक उपवाक्य बनाया गया है।
- source_word: οἱ βόσκοντες
  choice: सूअरों को चरा रहे लोग
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत उन लोगों को सूचित करता है जो प्रसंग में सूअरों के झुंड की देखभाल कर रहे थे। केवल ‘चरवाहे’ कहने से भेड़ों का भ्रामक संकेत मिल सकता है।
- source_word: τὸ γεγονός
  choice: क्या हुआ था
  rationale: γίνομαι का पूर्ण कृदंत यहाँ घट चुकी घटना को संज्ञात्मक रूप में व्यक्त करता है; यह हिन्दी में स्वाभाविक ढंग से पूर्ण घटना का भाव बनाए रखता है।
- source_word: ἔφυγον
  choice: वे भाग गए
  rationale: φεύγω का सीधा और स्वाभाविक हिन्दी रूप; इसमें मूल पाठ से परे ‘बच निकलने’ का भाव नहीं जोड़ा गया है।
- source_word: ἀπήγγειλαν
  choice: उन्होंने ... इसकी खबर दी
  rationale: ἀπαγγέλλω किसी बात की सूचना देने या उसका समाचार पहुँचाने को दर्शाता है। ‘इसकी’ का संकेत पूर्वोक्त घटना की ओर है।
- source_word: εἰς τὴν πόλιν
  choice: नगर ... में
  rationale: यद्यपि εἰς मूलतः दिशा सूचित कर सकता है, सूचना देने की क्रिया के साथ यहाँ उन स्थानों में खबर फैलाने का क्षेत्र अभिप्रेत है।
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: और देहात में
  rationale: ἀγροί का शब्दशः अर्थ ‘खेत’ है, पर नगर के साथ विरोध में यह आसपास के ग्रामीण क्षेत्र को सूचित करता है; ‘देहात’ आधुनिक हिन्दी में इस भौगोलिक अर्थ को स्पष्ट करता है।
