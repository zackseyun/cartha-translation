base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: hi
  text: और एक और बीज अच्छी मिट्टी[a] में गिरा, और उगने पर उसने सौ गुना फल दिया। ये बातें कहते हुए उसने पुकारकर कहा, “जिसके सुनने के कान हों, वह सुन ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अच्छी ज़मीन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: कुछ बीज
  rationale: नपुंसकलिंग एकवचन यहाँ दृष्टान्त में बोए गए बीज के अगले भाग को सूचित करता है। हिन्दी में केवल ‘दूसरा’ कहने की अपेक्षा ‘कुछ बीज’ प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: γῆν τὴν ἀγαθήν
  choice: अच्छी मिट्टी
  rationale: कृषि-संदर्भ में γῆ के लिए ‘मिट्टी’ आधुनिक हिन्दी में ‘भूमि’ या ‘ज़मीन’ से अधिक सटीक और सहज है।
- source_word: φυὲν
  choice: वह उगा
  rationale: φύω के अओरिस्ट कृदन्त को मुख्य क्रिया से पहले हुई वृद्धि के रूप में संक्षेप और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἐποίησεν καρπὸν
  choice: उसने ... फल दिया
  rationale: शाब्दिक ‘फल बनाया’ के बजाय ‘फल दिया’ खेती की उपज के लिए स्वाभाविक हिन्दी है और मूल अर्थ को बनाए रखता है।
- source_word: ἑκατονταπλασίονα
  choice: सौ गुना
  rationale: यह उपज की परिमाणात्मक बहुलता को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ταῦτα λέγων
  choice: ये बातें कहते हुए
  rationale: वर्तमान कृदन्त और मुख्य क्रिया की समकालिकता को सुरक्षित रखता है।
- source_word: ἐφώνει
  choice: ऊँची आवाज़ में कहा
  rationale: φωνέω के अपूर्णकाल का जोरदार सार्वजनिक उच्चारण यहाँ स्पष्ट होता है, बिना ‘चिल्लाया’ जैसे संभावित कठोर भाव के।
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: जिसके सुनने के कान हों
  rationale: यह प्रतिनिधिक एकवचन और सुनने की क्षमता/तत्परता की अभिव्यक्ति को स्वाभाविक, गैर-लिंगविशिष्ट हिन्दी में रखता है।
- source_word: ἀκουέτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष वर्तमान आज्ञार्थक का गंभीर आह्वान हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: यीशु के आह्वान में प्रतिनिधिक एकवचन और लिंग
  choice: “जिसके सुनने के कान हों, वह सुन ले”
  alternative: “जिसके कान हों, वह सुन ले”
  rationale: यूनानी रचना किसी पुरुष विशेष तक सीमित नहीं है। चुना हुआ पाठ प्रतिनिधिक एकवचन बनाए रखता है और ἀκούειν को भी स्पष्ट रूप से व्यक्त करता है।
- issue: ‘सुनने के कान’ का अर्थ
  choice: मुहावरे के तनाव को बनाए रखा गया
  alternative: “जो समझ सकता है, वह ध्यान दे”
  rationale: व्याख्यात्मक विकल्प आशय को पहले ही ‘समझने’ में सीमित कर देता; मूल पाठ कान और सुनने की ठोस भाषा द्वारा श्रोता को उत्तरदायी बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। वाक्य में दृष्टान्त की कृषि-भाषा और अंतिम गंभीर आह्वान दोनों को स्वाभाविक रूप से रखा गया है।
