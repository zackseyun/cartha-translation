- source_word: φυὲν
  choice: उगने के बाद
  rationale: बीज के उग आने और फिर सूखने का कालक्रम स्पष्ट करता है तथा यूनानी कृदंत के पूर्वकालिक संबंध को बनाए रखता है।
- source_word: ἐξηράνθη
