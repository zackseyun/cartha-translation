  rationale: वनस्पति के संदर्भ में यह सहज हिन्दी है और यहाँ निष्क्रिय रूप के बजाय परिणामसूचक अकर्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διὰ τὸ μὴ ἔχειν
