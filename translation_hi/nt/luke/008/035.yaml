source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: hi
  text: तब वे यह देखने बाहर निकले कि क्या हुआ था। वे यीशु के पास आए और उन्होंने उस मनुष्य को, जिसमें से दुष्टात्माएँ निकल गई थीं[a], कपड़े पहने हुए और पूरी सुध-बुध में यीशु के चरणों के पास बैठा हुआ पाया; और वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में क्रिया बहुवचन में है—“दुष्टात्माएँ निकल गई थीं।” मुद्रित पाठ में बहुवचन कर्ता के साथ क्रिया एकवचन में है; आशय में कोई अंतर नहीं पड़ता।
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονός
  choice: तब वे यह देखने बाहर निकले कि क्या हुआ था
  rationale: क्रियाओं की कथात्मक क्रमबद्धता और उद्देश्यवाचक infinitive को सहज आधुनिक हिन्दी में व्यक्त करता है; perfect participle का पूर्वघटित भाव ‘क्या हुआ था’ में सुरक्षित है।
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: जिसमें से दुष्टात्माएँ निकल गई थीं
  rationale: ἀπό के स्रोत-बोध और पहले पूरी हो चुकी घटना को व्यक्त करता है। ‘दुष्टात्माएँ’ δαιμόνια के व्यक्तिगत और अलौकिक आशय को बनाए रखता है। मुद्रित यूनानी पाठ में बहुवचन कर्ता के साथ एकवचन क्रिया है, जिसका उल्लेख पादटिप्पणी में किया गया है।
- source_word: ἱματισμένον
  choice: कपड़े पहने
  rationale: पहले की नग्न अवस्था के विपरीत अब उसकी बदली हुई दशा को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: σωφρονοῦντα
  choice: सुध-बुध में
  rationale: यह सहज हिन्दी अभिव्यक्ति मानसिक संतुलन, स्पष्ट चेतना और आत्मसंयम की बहुआयामी धारणा को बिना आधुनिक चिकित्सकीय निदान थोपे व्यक्त करती है।
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: यीशु के चरणों के पास
  rationale: παρά के स्थान-बोध को ठीक रूप से व्यक्त करता है और शिष्यत्व या समर्पण का अर्थ स्पष्ट रूप से जोड़े बिना संभावित संकेत को खुला रखता है।
- source_word: ἐφοβήθησαν
  choice: वे डर गए
  rationale: aorist क्रिया की कथात्मक परिणति को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: झाड़-फूँक के प्रसंग में δαιμόνια का अनुवाद
  choice: दुष्टात्माएँ
  alternative: दुष्ट शक्तियाँ
  rationale: ‘दुष्टात्माएँ’ हिन्दी बाइबिलीय प्रयोग में स्वाभाविक है और वृत्तांत में वर्णित व्यक्तिगत, अलौकिक सत्ताओं को केवल बीमारी या रूपक में सीमित नहीं करता।
- issue: σωφρονοῦντα में बहाल मानसिक दशा का आशय
  choice: सुध-बुध में
  alternative: स्वस्थ मन वाला
  rationale: चुना हुआ रूप बहाल समझ-बूझ और आत्मसंयम को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है, पर आधुनिक नैदानिक श्रेणी नहीं थोपता।
- issue: यीशु के चरणों के पास बैठने का संभावित संकेत
  choice: स्थानगत अर्थ को सीधे प्रस्तुत किया गया
  alternative: शिष्य की तरह यीशु के चरणों में
  rationale: मूल पदबंध शिष्यत्व या समर्पण का संकेत दे सकता है, पर उसे स्पष्ट रूप से नहीं कहता; इसलिए अनुवाद वास्तविक मुद्रा और स्थान तक सीमित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘चरणों’ धार्मिक-साहित्यिक प्रसंग में स्वाभाविक है, जबकि ‘के पास’ मूल के स्थानगत अर्थ को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान विषय से मेल नहीं खाता था; हिन्दी मसौदे में पाठालोचनात्मक टिप्पणी को ‘निकल गई थीं’ और शब्दार्थ-विकल्प को ‘सुध-बुध में’ के साथ जोड़ा गया है।
