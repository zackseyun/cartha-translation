  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: hi
  text: और उन्होंने पत्थर को कब्र से लुढ़का हुआ पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: उन्होंने … पाया
  rationale: यह भूतकालिक सक्रिय क्रिया तीसरे पुरुष बहुवचन में है; कर्ता पिछले पद की स्त्रियाँ हैं। हिंदी में स्वाभाविक पूर्ण वाक्य के लिए सर्वनाम व्यक्त किया गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि कथा को आगे बढ़ाने वाला हल्का संयोजक है; इसलिए ‘और’ स्वाभाविक है।
- source_word: τὸν λίθον
  choice: पत्थर को
  rationale: दफनाने के संदर्भ में λίθος उस पत्थर को सूचित करता है जिससे कब्र का द्वार बंद किया गया था। निश्चितता संदर्भ से स्पष्ट है; हिंदी में अलग निश्चित उपपद आवश्यक नहीं।
- source_word: ἀποκεκυλισμένον
  choice: लुढ़का हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदंत पत्थर की परिणामी अवस्था बताता है—उसे लुढ़काकर हटा दिया गया था और वह वैसा ही पड़ा था। ‘लुढ़का हुआ’ इस रूप और चित्र दोनों को संक्षेप में रखता है।
- source_word: ἀπὸ τοῦ μνημείου
  choice: कब्र से
  rationale: सुसमाचारों के दफन-संदर्भ में μνημεῖον का स्वाभाविक हिंदी रूप ‘कब्र’ है। ἀπό अलगाव या दूरी दर्शाता है, जिसे ‘से’ व्यक्त करता है।
theological_decisions:
- issue: यूनानी वाक्य में कर्ता का पुनरुल्लेख नहीं
  choice: उन्होंने
  alternative: बिना व्यक्त कर्ता के अनुवाद
  rationale: बहुवचन क्रिया का कर्ता पिछले पद में उल्लिखित स्त्रियाँ हैं। आधुनिक हिंदी में ‘उन्होंने’ जोड़ना संदर्भ को स्पष्ट करता है, बिना कोई धर्मवैज्ञानिक अर्थ जोड़े।
- issue: पूर्णकालिक कर्मवाच्य कृदंत में कर्ता का अनुल्लेख
  choice: लुढ़का हुआ
  alternative: किसी ने पत्थर लुढ़का दिया था
  rationale: मूल पाठ यह नहीं बताता कि पत्थर किसने हटाया। इसलिए अनुवाद परिणामी अवस्था को बनाए रखता है और कर्ता की पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘कब्र’ सामान्य पाठक के लिए स्वाभाविक है; वाक्य विन्यास मूल के अर्थ और परिणामी अवस्था को स्पष्ट रखता है।
