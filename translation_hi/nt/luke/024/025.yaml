  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: hi
  text: और उसने उनसे कहा, “हे नासमझ लोगो![a] और भविष्यद्वक्ताओं की कही हुई हर बात पर विश्वास करने में हृदय से सुस्त लोगो![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ से रहित लोगो” अथवा “मूर्ख लोगो।”
    reason: lexical_alternative
  - marker: b
    text: ‘हृदय से सुस्त’ एक मुहावरेदार अभिव्यक्ति है, जो परमेश्वर की कही बात को समझने, स्वीकार करने और उस पर भरोसा करने में भीतरी व्यक्ति की सुस्ती को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: तब उसने उनसे कहा
  rationale: कथा के प्रवाह में καί को स्वाभाविक हिन्दी ‘तब’ से व्यक्त किया गया है। αὐτός पर अनावश्यक बल डाले बिना सामान्य सर्वनाम ‘उसने’ रखा गया है।
- source_word: Ὦ
  choice: हे
  rationale: प्रत्यक्ष संबोधन और गंभीर उलाहने का भाव बनाए रखने के लिए हिन्दी का गरिमापूर्ण संबोधन ‘हे’ चुना गया है।
- source_word: ἀνόητοι
  choice: नासमझ लोगो
  rationale: यह शब्द यहाँ केवल नैतिक दुष्टता नहीं, बल्कि समझ की कमी दर्शाता है। ‘नासमझ लोगो’ बहुवचन संबोधन को स्पष्ट और आधुनिक हिन्दी में स्वाभाविक रखता है।
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: तुम्हारा हृदय कितना धीमा है
  rationale: ‘हृदय’ को बनाए रखने से यूनानी मुहावरे में निहित भीतरी समझ, ग्रहणशीलता और भरोसे का संयुक्त भाव सुरक्षित रहता है; ‘कितना’ उलाहने की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ πιστεύειν
  choice: विश्वास करने में
  rationale: βραδεῖς के साथ इस क्रियारूप का स्वाभाविक हिन्दी संबंध ‘विश्वास करने में धीमा’ है।
- source_word: ἐπὶ πᾶσιν οἷς
  choice: जो कुछ … उस सब पर
  rationale: यह रचना भविष्यद्वक्ताओं के पूरे कथन को विश्वास का विषय बनाती है और πᾶσιν की समग्रता सुरक्षित रखती है।
- source_word: ἐλάλησαν οἱ προφῆται
  choice: भविष्यद्वक्ताओं ने … कहा है
  rationale: ‘भविष्यद्वक्ता’ मानक और सटीक पद है। ‘कहा है’ पूर्ण हो चुके किंतु वर्तमान में प्रासंगिक भविष्यद्वाणी-साक्ष्य को सहज हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: यीशु के उलाहने का स्वरूप
  choice: उलाहना भविष्यद्वक्ताओं के साक्ष्य को समझने और उस पर भरोसा करने—दोनों की कमी को संबोधित करता है।
  alternative: इसे केवल नैतिक मूर्खता अथवा केवल बौद्धिक भूल के रूप में समझना।
  rationale: ἀνόητοι समझ की कमी बताता है, जबकि ‘हृदय’ और ‘विश्वास’ भीतरी ग्रहणशीलता और भरोसे को सामने रखते हैं। अनुवाद किसी एक पक्ष तक अर्थ को सीमित नहीं करता।
- issue: भविष्यद्वक्ताओं के कथन की व्यापकता
  choice: ‘जो कुछ … उस सब पर’ द्वारा πᾶσιν का व्यापक अर्थ बनाए रखा गया है।
  alternative: केवल मसीह से संबंधित चुनी हुई भविष्यवाणियों तक कथन को स्पष्ट रूप से सीमित कर देना।
  rationale: इस पद की भाषा स्वयं ‘सब’ कहती है; संदर्भ अर्थ को निर्देशित कर सकता है, पर अनुवाद में ऐसी सीमा जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे’ संबोधन गंभीर उलाहने को सँभालता है, जबकि ‘नासमझ लोगो’ आज के सामान्य पाठक के लिए बोधगम्य है। ‘हृदय’ को जानबूझकर बनाए रखा गया है ताकि मूल की मानव-भीतरता संबंधी व्यापकता केवल बुद्धि या भावना तक सीमित न हो।
