reference: Luke 24:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: hi
  text: पर पतरस उठकर कब्र की ओर दौड़ा; और झुककर भीतर देखते हुए वह केवल कफ़न के कपड़े देखता है। फिर जो कुछ हुआ था, उस पर अचंभा करता हुआ वह अपने घर चला गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो कुछ हुआ था उस पर अपने आप में अचंभा करता हुआ चला गया।”
    reason: πρὸς ἑαυτόν को गंतव्य (‘अपने घर/स्थान को’) अथवा आंतरिक अवस्था (‘अपने आप में’) के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: μνημεῖον
  choice: कब्र
  rationale: यहाँ चट्टान में बनी दफ़नाने की जगह अभिप्रेत है; आधुनिक हिन्दी में ‘कब्र’ सहज और स्पष्ट है।
- source_word: παρακύψας
  choice: झुककर भीतर देखने पर
  rationale: क्रिया का अर्थ झुककर या नीचे होकर भीतर झाँकना है; प्रसंगानुकूल क्रिया को स्पष्ट किया गया है।
- source_word: τὰ ὀθόνια μόνα
  choice: केवल कफ़न की पट्टियाँ
  rationale: ὀθόνια बहुवचन में शव को लपेटने के लिनन कपड़ों/पट्टियों को दर्शाता है; μόνα से उनके अकेले पड़े होने पर बल है।
- source_word: βλέπει
  choice: उसे ... दिखाई दीं
  rationale: यूनानी में ऐतिहासिक वर्तमान ‘वह देखता है’ कथा को सजीव बनाता है, पर आधुनिक हिन्दी में आसपास के भूतकाल के साथ स्वाभाविक कथन हेतु भूतकाल रखा गया है।
- source_word: θαυμάζων
  choice: अचंभा करते हुए
  rationale: यह आश्चर्यचकित होकर विचार करने की प्रतिक्रिया बताता है; ‘अचंभा’ परिणाम के विषय में अनिश्चित विस्मय को बनाए रखता है।
theological_decisions:
- issue: πρὸς αὑτόν का अर्थ
  choice: अपने घर चला गया
  alternative: अपने आप में अचंभा करता हुआ चला गया
  rationale: इस पदबंध का स्वाभाविक कथात्मक अर्थ संभवतः ‘अपने स्थान/घर को’ है, पर ‘अपने आप में’ भी व्याकरणतः संभव है; इसलिए मुख्य पाठ में सहज अर्थ और पादटिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: अचंभे की प्रकृति
  choice: जो कुछ हुआ था उस पर अचंभा
  alternative: पुनरुत्थान पर विश्वास
  rationale: पाठ केवल पतरस के आश्चर्य का वर्णन करता है; वह यहाँ स्पष्ट रूप से विश्वास या किसी निश्चित व्याख्या की बात नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखा गया है। ‘कफ़न की पट्टियाँ’ सांस्कृतिक संदर्भ बताती हैं, जबकि पतरस की प्रतिक्रिया को पाठ से अधिक निश्चित नहीं बनाया गया।
