lexical_decisions:
- source_word: ἐφάνησαν
  choice: लगीं
  rationale: ὡσεὶ λῆρος के साथ यह क्रिया यहाँ दृश्य रूप से ‘दिखाई दीं’ नहीं, बल्कि श्रोताओं के आकलन को व्यक्त करती है; हिन्दी में ‘उन्हें…लगीं’ स्वाभाविक है।
- source_word: ἐνώπιον αὐτῶν
  choice: उन्हें
  rationale: शाब्दिक अर्थ ‘उनके सामने’ है, पर इस मूल्यांकनात्मक प्रयोग में ‘उन्हें’ हिन्दी में दृष्टिकोण को सहज और ठीक रूप से व्यक्त करता है।
- source_word: ὡσεὶ λῆρος
  choice: बकवास-सी
  rationale: ὡσεὶ की तुलनात्मकता ‘-सी’ से बनी रहती है और λῆρος ऐसी बात को सूचित करता है जिसे निरर्थक, बेहूदा या प्रलाप-जैसा समझा जाए। ‘बकवास-सी’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τὰ ῥήματα ταῦτα
  choice: ये बातें
  rationale: ῥήματα का सन्दर्भ स्त्रियों द्वारा कही गई बातों से है; हिन्दी में ‘ये बातें’ ‘ये शब्द’ की तुलना में अधिक स्वाभाविक है और मूल की संकेतवाचक संरचना बनाए रखता है।
- source_word: ἠπίστουν
  choice: विश्वास नहीं किया
  rationale: अपूर्ण भूतकाल उनके उस समय जारी अविश्वास को दर्शाता है। ‘विश्वास नहीं किया’ स्वाभाविक है और ‘विश्वास करने से इनकार किया’ जैसी अनावश्यक इच्छापूर्वकता नहीं जोड़ता।
- source_word: αὐταῖς
  choice: उन स्त्रियों पर
  rationale: सर्वनाम स्त्रीलिंग बहुवचन है और निकटवर्ती सन्दर्भ की स्त्रियों की ओर संकेत करता है। हिन्दी में ‘उन स्त्रियों पर विश्वास नहीं किया’ सन्दर्भ स्पष्ट करता है और πιστεύω के साथ व्यक्ति पर विश्वास करने का भाव बनाए रखता है।
