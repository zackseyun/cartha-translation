translation:
  language: hi
  text: यह कहते हुए[a], “प्रभु सचमुच जिलाया गया है और शमौन को दिखाई दिया है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “प्रभु सचमुच जी उठा है” अथवा “प्रभु निश्चय ही जिलाया गया।” यूनानी क्रिया और क्रिया-विशेषण के कई निकटार्थी अनुवाद सम्भव हैं; मुख्य पाठ यूनानी का कर्मवाच्य बनाए रखता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: यह कहते हुए
  rationale: वर्तमान कृदन्त को पिछले वाक्य से जोड़ते हुए हिन्दी में स्वाभाविक रूप से व्यक्त करता है और कर्ता को अनावश्यक रूप से दोहराता नहीं।
- source_word: ὅτι
  choice: उद्धरण-चिह्न
  rationale: ὅτι यहाँ कथन की विषय-वस्तु प्रस्तुत करता है; प्रत्यक्ष कथन के लिए हिन्दी में उद्धरण-चिह्न स्वाभाविक हैं।
- source_word: ὄντως
  choice: सचमुच
  rationale: यह पुनरुत्थान के समाचार की वास्तविकता पर दिए गए बल को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἠγέρθη
  choice: जिलाया गया है
  rationale: ἐγείρω के अओरिस्ट कर्मवाच्य को सुरक्षित रखता है और पुनरुत्थान के संदर्भ में स्वाभाविक हिन्दी देता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यह यीशु के लिए प्रयुक्त मसीही उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: καὶ
  choice: और
  rationale: दोनों कथनों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: ὤφθη
  choice: दिखाई दिया है
  rationale: ὁράω के कर्मवाच्य रूप का यहाँ प्रकट होने के अर्थ में स्वाभाविक हिन्दी अनुवाद है; अत्यधिक शाब्दिक ‘देखा गया’ से बचता है।
- source_word: Σίμωνι
  choice: शमौन को
  rationale: दत्तिव रूप को हिन्दी के ‘को’ से व्यक्त किया गया है; मूल में ‘पतरस’ स्पष्ट रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: पुनरुत्थान क्रिया का वाच्य
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: यूनानी ἠγέρθη कर्मवाच्य है। मुख्य पाठ में कर्मवाच्य रखने से स्रोत की व्याकरणिक और धर्मवैचारिक सूक्ष्मता बनी रहती है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में κύριος यीशु की उपाधि है; ‘प्रभु’ उसका स्थापित और गरिमापूर्ण मसीही अर्थ बनाए रखता है।
- issue: ὤφθη का रूप
  choice: दिखाई दिया है
  alternative: देखा गया
  rationale: यद्यपि रूप व्याकरणतः कर्मवाच्य है, पुनरुत्थान-दर्शन के संदर्भ में इसका मुहावरेदार अर्थ ‘दिखाई दिया’ है; यह किसी मानवीय खोज की अपेक्षा उसके प्रकट होने पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘जिलाया गया है’ स्रोत के कर्मवाच्य को सुरक्षित रखता है; ‘शमौन’ मूल नाम को बिना ‘पतरस’ जोड़े प्रस्तुत करता है।
