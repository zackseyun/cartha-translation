  choice: निरन्तर ... रहते थे
  rationale: अपूर्ण भूतकाल और διὰ παντός का मुहावरा मिलकर बीते समय में जारी और नियमित गतिविधि व्यक्त करते हैं; हिन्दी में यह प्रयोग स्वाभाविक रूप से उस निरन्तरता को प्रकट करता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित कर सकता है, केवल भीतरी पवित्रस्थान को नहीं। संक्षिप्त हिन्दी में ‘मन्दिर’ इसका मानक और स्वाभाविक अनुवाद है।
- source_word: εὐλογοῦντες
