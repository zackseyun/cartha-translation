- source_word: τὸν θεόν
  choice: परमेश्वर को
  rationale: यह εὐλογοῦντες का प्रत्यक्ष कर्म है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण चयन है।
theological_decisions:
