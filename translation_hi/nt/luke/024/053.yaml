  choice: परमेश्वर को धन्य कहते
  alternative: परमेश्वर की स्तुति करते
  rationale: मूल क्रिया εὐλογέω है, αἰνέω नहीं। ‘धन्य कहते’ मूल क्रिया की विशिष्टता बनाए रखता है, जबकि पादटिप्पणी सन्दर्भानुकूल अर्थ ‘स्तुति करते’ बताती है और वास्तविक अर्थ-विकल्प को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘मन्दिर’ मन्दिर-परिसर के व्यापक अर्थ को समेटता है, और ‘रहते थे’ जारी गतिविधि का स्वाभाविक हिन्दी रूप है।
