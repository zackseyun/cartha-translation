lexical_decisions:
- source_word: οὐχὶ
  choice: क्या ... नहीं था
  rationale: यह प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी की यह प्रश्नात्मक रचना उस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ταῦτα
  choice: ये सब दुःख
  rationale: संकेतवाचक शब्द पूर्ववर्ती प्रसंग में बताए गए कष्टों की ओर संकेत करता है। ‘ये सब दुःख’ हिन्दी में स्वाभाविक है और संदर्भ को स्पष्ट रखता है।
- source_word: ἔδει
  choice: आवश्यक ... था
  rationale: अपूर्णकालिक δεῖ यहाँ परमेश्वर की योजना और पवित्रशास्त्र की पूर्ति से जुड़ी आवश्यकता व्यक्त करता है; ‘आवश्यक था’ अनिवार्यता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: παθεῖν
  choice: सहे
  rationale: πάσχω का अओरिस्ट अनंत रूप दुःख उठाने या सहने को व्यक्त करता है; ‘दुःख सहे’ संक्षिप्त, वर्तमान हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: τὸν χριστὸν
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि है। ‘मसीह’ हिन्दी में प्रचलित उपाधि है और पवित्रशास्त्रीय पूर्ति के संदर्भ को सुरक्षित रखती है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों अनंत क्रियाओं को साधारण समन्वय से जोड़ता है; ‘फिर’ जोड़ने से मूल में निहित न होने वाला क्रम अधिक स्पष्ट हो जाता।
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: अपनी महिमा में प्रवेश करे
  rationale: ‘अपनी’ αὐτοῦ के आत्मवाची हिन्दी प्रयोग को स्वाभाविक ढंग से व्यक्त करता है, और ‘महिमा में प्रवेश करे’ मूल पूर्वसर्गीय अभिव्यक्ति को बनाए रखता है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα के लिए ‘महिमा’ मानक और संदर्भानुकूल शब्द है, विशेषकर पुनरुत्थान और उत्कर्ष के प्रसंग में।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रिस्त
  rationale: यहाँ शब्द नाम मात्र नहीं, बल्कि अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ उसके पवित्रशास्त्रीय और मसीहाई अर्थ को हिन्दी में स्पष्ट रखता है।
- issue: ἔδει की शक्ति
  choice: आवश्यक था
  alternative: होना ही था
  rationale: लूका के इस प्रसंग में आवश्यकता परमेश्वर की उद्धारकारी योजना और पवित्रशास्त्र की पूर्ति से जुड़ी है। ‘आवश्यक था’ इस भार को बनाए रखता है, पर मुख्य पाठ में उसकी प्रकृति की व्याख्या जोड़कर तनाव को समाप्त नहीं करता।
- issue: αὐτοῦ में महिमा का संबंध
  choice: अपनी महिमा
  alternative: उसके लिए ठहराई गई महिमा
  rationale: मूल पाठ केवल संबंधवाचक सर्वनाम देता है। ‘अपनी महिमा’ उस संबंध को सीधे सुरक्षित रखता है और यह अतिरिक्त रूप से तय नहीं करता कि महिमा स्वभावतः उसकी है या उसके लिए नियुक्त की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज प्रश्न-वाक्य रखा गया है। ‘ये सब दुःख सहे’ पूर्ववर्ती कष्टों की ओर संकेत को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपनी महिमा’ हिन्दी के आत्मवाची प्रयोग के अनुसार है।
