    text: अथवा, ‘ख्रीस्त।’ यूनानी उपाधि Χριστός को पवित्रशास्त्र की पूर्ति के इस संदर्भ में उसके अर्थ को बनाए रखने के लिए ‘मसीह’ अनूदित किया गया है।
