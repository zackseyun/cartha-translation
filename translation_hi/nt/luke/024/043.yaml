lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: साधारण संयोजक के रूप में यह पिछले पद की घटना से स्वाभाविक रूप से जोड़ता है; यूनानी से अधिक कालक्रम नहीं जोड़ता।
- source_word: λαβὼν
  choice: लेकर
  rationale: अओरिस्ट कर्तृवाच्य कृदन्त मुख्य क्रिया से पहले की सहायक क्रिया व्यक्त करता है। हिन्दी में ‘लेकर’ इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: ἐνώπιον αὐτῶν
  choice: उनके सामने
  rationale: यह उनके देखते हुए अथवा उनकी उपस्थिति में किए गए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है और दृश्य के प्रमाणात्मक बल को बनाए रखता है।
- source_word: ἔφαγεν
  choice: खाया
  rationale: अओरिस्ट मुख्य क्रिया पूर्ण हुई घटना का वर्णन करती है। वस्तु पिछले पद से स्पष्ट होने के कारण हिन्दी में क्रिया के साथ उसे दोहराना आवश्यक नहीं है।
theological_decisions:
- issue: यूनानी में निहित कर्म को स्पष्ट करना
  choice: ‘वह टुकड़ा’ केवल ‘लेकर’ के साथ स्पष्ट किया गया
  alternative: ‘और लेकर उसने उनके सामने खाया’ अथवा ‘और उसने उसे लेकर उनके सामने खाया’
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर पिछले पद में मछली का टुकड़ा संदर्भित है। ‘वह टुकड़ा’ पाठक के लिए संबंध स्पष्ट करता है, जबकि ‘खाया’ के बाद कर्म दोहराए बिना हिन्दी को स्वाभाविक रखता है। इससे पुनरुत्थित यीशु के वास्तविक रूप से खाने की घटना बनी रहती है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
