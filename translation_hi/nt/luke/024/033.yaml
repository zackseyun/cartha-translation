  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: hi
  text: और वे उसी घड़ी उठकर यरूशलेम लौट गए। वहाँ उन्होंने उन ग्यारहों और उनके साथ के लोगों को एकत्र पाया[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, जब वे वहाँ पहुँचे, तब ये लोग पहले से एकत्र थे।
    reason: यूनानी पूर्ण कृदंत उस पहले से विद्यमान एकत्र अवस्था का वर्णन करता है जिसमें उन्होंने उन्हें पाया।
lexical_decisions:
- source_word: ἀναστάντες
  choice: उठकर
  rationale: यह भूतकालिक कृदंत मुख्य क्रिया से पहले हुई शारीरिक क्रिया बताता है; ‘उठकर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह विशिष्ट समय और तत्कालता—दोनों पर दिए गए बल को सुरक्षित रखता है।
- source_word: ὑπέστρεψαν
  choice: लौट गए
  rationale: यात्रा के प्रसंग में यरूशलेम वापस जाने का स्वाभाविक हिन्दी वर्णन।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: εὗρον
  choice: पाया
  rationale: वर्णनात्मक प्रसंग में εὑρίσκω का सीधा और स्वाभाविक अर्थ।
- source_word: ἠθροισμένους
  choice: एकत्र पाया
  rationale: पूर्ण निष्क्रिय कृदंत उस अवस्था को बताता है जिसमें वे मिले; यह हिन्दी अभिव्यक्ति पहले से एकत्र होने की परिणामी अवस्था बनाए रखती है।
- source_word: τοὺς ἕνδεκα
  choice: उन ग्यारहों
  rationale: यह यीशु के मुख्य शिष्य-समूह की यूनानी पदवी को बनाए रखता है और ‘प्रेरित’ जैसा अनकहा शब्द नहीं जोड़ता।
- source_word: τοὺς σὺν αὐτοῖς
  choice: उनके साथ के लोगों
  rationale: यह साथ उपस्थित अन्य व्यक्तियों को स्वाभाविक हिन्दी में व्यक्त करता है, उनकी पहचान के बारे में अतिरिक्त विशिष्टता जोड़े बिना।
theological_decisions:
- issue: यहूदा की अनुपस्थिति और सम्भवतः थोमा के वहाँ न होने पर भी ‘ग्यारहों’ का प्रयोग
  choice: समूह की पदवी के रूप में ‘उन ग्यारहों’ को बनाए रखा गया।
  alternative: ‘ग्यारह प्रेरित’ या ‘बाकी शिष्य’
  rationale: यूनानी पाठ τοὺς ἕνδεκα कहता है। सीधा अनुवाद ठीक उसी समय उपस्थित व्यक्तियों की संख्या या सदस्यता का सामंजस्य बैठाए बिना लूका की शब्दावली सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उसी घड़ी’ मूल के समय-संबंधी बल को रखता है। पठनीयता के लिए हिन्दी में दो वाक्य किए गए हैं; ‘वहाँ’ गंतव्य पर पहुँचने के बाद खोजे जाने का स्वाभाविक संबंध स्पष्ट करता है।
