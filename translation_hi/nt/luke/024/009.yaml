  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: hi
  text: और वे स्त्रियाँ कब्र से लौटकर ये सारी बातें उन ग्यारहों और बाकी सब लोगों को बताईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: लौटकर
  rationale: यह स्त्रीलिंग बहुवचन एओरिस्ट कृदंत है और पिछले संदर्भ की स्त्रियों की ओर संकेत करता है। ‘लौटकर’ मुख्य क्रिया से इसका संबंध स्वाभाविक हिन्दी में बनाए रखता है; स्त्रीलिंग बहुवचन का संकेत आगे ‘बताईं’ में स्पष्ट होता है।
- source_word: μνημείου
  choice: कब्र
  rationale: पुनरुत्थान के इस प्रसंग में यह यीशु के शव को रखे जाने के स्थान को दर्शाता है। ‘कब्र’ आधुनिक हिन्दी में सीधा और सामान्य शब्द है तथा ‘समाधि’ से जुड़ सकने वाले अन्य धार्मिक अर्थों से बचता है।
- source_word: ἀπήγγειλαν
  choice: बताईं
  rationale: क्रिया का अर्थ सूचना पहुँचाना या वृत्तांत सुनाना है। ‘बताईं’ सामान्य पाठक के लिए स्वाभाविक है और ‘ये सारी बातें’ के साथ स्त्रीलिंग बहुवचन सामंजस्य रखते हुए मूल के स्त्रीलिंग बहुवचन कर्ता को भी संदर्भतः प्रकट करता है।
- source_word: ταῦτα πάντα
  choice: ये सारी बातें
  rationale: यह अनुवाद संकेतवाचक ‘ταῦτα’ और समग्रता व्यक्त करने वाले ‘πάντα’ दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς ἕνδεκα
  choice: उन ग्यारहों
  rationale: मूल में केवल ‘ग्यारह’ कहा गया है। ‘प्रेरितों’ जोड़ने के बजाय ‘उन ग्यारहों’ परिचित समूह की ओर संकेत करता है और मूल की संक्षिप्त पदवी बनाए रखता है।
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: बाकी सब लोगों
  rationale: यह ग्यारह जनों से अलग उपस्थित व्यापक समूह को दर्शाता है। ‘बाकी सब लोगों’ आधुनिक हिन्दी में स्वाभाविक है और πᾶσιν की समग्रता तथा λοιποῖς के ‘शेष’ भाव दोनों को व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग कृदंत और बहुवचन क्रिया का कर्ता
  choice: कर्ता को पिछले संदर्भ की स्त्रियाँ मानते हुए ‘उन्होंने ... बताईं’ द्वारा संदर्भतः स्त्रीलिंग बहुवचन प्रकट किया गया है।
  alternative: ‘वे स्त्रियाँ ... लौटकर’ कहकर कर्ता को स्पष्ट रूप से जोड़ना।
  rationale: यूनानी व्याकरण स्त्रीलिंग बहुवचन कर्ता बताता है, पर इस पद में ‘स्त्रियाँ’ संज्ञा प्रत्यक्ष रूप से नहीं है। इसलिए उसे जोड़े बिना हिन्दी की क्रिया में लिंग-संकेत सुरक्षित रखा गया है।
- issue: प्रेरितों के समूह की पदवी
  choice: ‘उन ग्यारहों’
  alternative: ‘उन ग्यारह प्रेरितों’
  rationale: मूल पाठ केवल ‘ग्यारह’ कहता है। ‘प्रेरित’ जोड़ना संदर्भ की व्याख्या तो करेगा, पर मूल में अनुपस्थित संज्ञा को पाठ में ले आएगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की यूनानी संरचना को यथासंभव बनाए रखते हुए हिन्दी में स्वाभाविक ‘लौटकर ... बताईं’ का प्रयोग किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
