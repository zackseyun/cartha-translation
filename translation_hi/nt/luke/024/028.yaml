  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: hi
  text: और वे उस गाँव के पास पहुँचे जहाँ वे जा रहे थे, और उसने ऐसा दिखाया मानो वह और आगे जा रहा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: पास पहुँचे
  rationale: यह क्रिया किसी स्थान के निकट पहुँचने को व्यक्त करती है; ‘पास पहुँचे’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη सामान्यतः नगर से छोटी बस्ती को दर्शाता है; इसलिए ‘गाँव’ उपयुक्त है।
- source_word: οὗ ἐπορεύοντο
  choice: जहाँ वे जा रहे थे
  rationale: सम्बन्धवाचक क्रियाविशेषण और अपूर्णकालीन क्रिया उनकी चल रही यात्रा के गंतव्य को बताते हैं।
- source_word: προσεποιήσατο
  choice: ऐसा जताया मानो
  rationale: यह अभिव्यक्ति किसी कार्य का आभास देने को व्यक्त करती है। ‘ऐसा जताया मानो’ कथात्मक तनाव बनाए रखती है, पर यूनानी से अधिक प्रबल छल का आरोप नहीं लगाती।
- source_word: πορρώτερον
  choice: आगे
  rationale: तुलनात्मक क्रियाविशेषण यहाँ यात्रा में अधिक दूर अथवा आगे जाने का भाव देता है; हिन्दी में ‘आगे’ स्वाभाविक है।
- source_word: πορεύεσθαι
  choice: जा रहा हो
  rationale: यह पूरक क्रियारूप उस कार्य को बताता है जिसका आभास दिया गया; ‘मानो वह आगे जा रहा हो’ हिन्दी में स्वाभाविक रचना है।
theological_decisions:
- issue: यीशु के कार्य के सम्बन्ध में προσεποιήσατο का अनुवाद
  choice: ऐसा जताया मानो वह आगे जा रहा हो
  alternative: उसने आगे जाने का बहाना किया / वह ऐसे करने लगा जैसे आगे जा रहा हो
  rationale: यूनानी पाठ यह बताता है कि उसने आगे बढ़ने का आभास दिया। चुना हुआ अनुवाद इस कथात्मक तनाव को सुरक्षित रखता है और छल के विषय में पाठ से अधिक कठोर निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। सर्वनाम ‘उसने’ निकटवर्ती प्रसंग में यीशु की ओर संकेत करता है।
