  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: hi
  text: और वे आपस में इन सभी घटी हुई बातों के बारे में बातचीत कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे एक-दूसरे से इन सभी घटी हुई घटनाओं के विषय में चर्चा कर रहे थे।”
    reason: ‘बातों/घटनाओं’ तथा ‘बातचीत/चर्चा’ के सम्भव शाब्दिक विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है और मूल में निहित न होने वाला अतिरिक्त काल-संबंध नहीं जोड़ता।
- source_word: αὐτοὶ
  choice: वे
  rationale: यूनानी में सर्वनाम स्पष्ट है; यहाँ उसका हल्का बल हिन्दी के स्वाभाविक कर्ता ‘वे’ में पर्याप्त रूप से व्यक्त होता है।
- source_word: ὡμίλουν
  choice: बातचीत कर रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया दर्शाता है; ὁμιλέω यहाँ औपचारिक भाषण नहीं, परस्पर वार्तालाप का बोध देता है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: यह पारस्परिक बातचीत को सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περὶ πάντων
  choice: इन सब ... के बारे में
  rationale: περί बातचीत का विषय बताता है और πάντων घटनाओं अथवा बातों के पूरे समूह को समेटता है।
- source_word: τῶν συμβεβηκότων τούτων
  choice: इन सब बातों ... जो घट चुकी थीं
  rationale: सम्पूर्ण कृदन्त उन घटनाओं को दर्शाता है जो घट चुकी थीं और जिनका प्रभाव कथा के वर्तमान क्षण में बना हुआ था; ‘बातों’ मूल की व्यापकता बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘घट चुकी थीं’ पूर्ण हो चुकी घटनाओं और उनकी वर्तमान प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है।
