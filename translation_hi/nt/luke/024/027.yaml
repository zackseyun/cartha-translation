source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: hi
  text: और उसने मूसा और सभी भविष्यद्वक्ताओं[a] से आरम्भ करके, समस्त पवित्रशास्त्र में अपने विषय में जो बातें थीं, उनका अर्थ उन्हें समझाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मूसा और सभी भविष्यद्वक्ताओं’ से आशय मूसा से संबद्ध धर्मग्रन्थों और भविष्यद्वक्ताओं की पुस्तकों से है।
    reason: cultural_note
  - marker: b
    text: या, ‘उन्हें विस्तार से समझाया’ या ‘उन्हें व्याख्या करके समझाया।’ यूनानी क्रिया विस्तार से अर्थ खोलकर बताने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: आरम्भ करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया की भूमिका बाँधता है। ‘आरम्भ करके’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπὸ Μωϋσέως
  choice: मूसा से
  rationale: ἀπό आरम्भ-बिन्दु बताता है। प्रसंग में मूसा से संबद्ध धर्मग्रन्थों से व्याख्या आरम्भ करने का भाव है; मुख्य पाठ संक्षिप्त रहता है और पादटिप्पणी इसका सांस्कृतिक अर्थ स्पष्ट करती है।
- source_word: πάντων τῶν προφητῶν
  choice: सभी भविष्यद्वक्ताओं
  rationale: यह मूसा के साथ धर्मग्रन्थों के भविष्यद्वक्ताओं वाले विभाग की ओर संकेत करता है। हिन्दी में स्वाभाविक पद रखा गया है और उसके ग्रन्थ-संबंधी आशय को पादटिप्पणी में बताया गया है।
- source_word: διερμήνευσεν
  choice: अर्थ उन्हें समझाया
  rationale: क्रिया विस्तृत व्याख्या अथवा अर्थ खोलकर बताने का भाव रखती है। यह हिन्दी प्रयोग सामान्य पाठक के लिए सहज है और ‘व्याख्या की’ को पादटिप्पणी में विकल्प के रूप में सुरक्षित रखता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक के सरल और स्वाभाविक हिन्दी रूप को रखा गया है।
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: सारे पवित्रशास्त्र में
  rationale: γραφή यहाँ पवित्र धर्मग्रन्थ का बोध कराता है, और πάσαις उसकी व्यापकता व्यक्त करता है। यह अनुवाद किसी एक प्रकार के अंश तक अर्थ को सीमित नहीं करता।
- source_word: τὰ περὶ ἑαυτοῦ
  choice: अपने विषय में जो बातें थीं
  rationale: नपुंसकलिंग बहुवचन रचना यीशु से संबंधित बातों, अंशों या विषयों के लिए व्यापक है। यह रूप उन्हें केवल प्रत्यक्ष भविष्यवाणियाँ कहकर अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: यीशु द्वारा पवित्रशास्त्र की व्याख्या का दायरा
  choice: पाठ यह कहता है कि यीशु ने सारे पवित्रशास्त्र में अपने विषय से संबंधित बातों का अर्थ समझाया, पर उनकी केवल एक व्याख्यात्मक श्रेणी निर्धारित नहीं करता।
  alternative: इसे केवल प्रत्यक्ष मसीही भविष्यवाणियों तक सीमित करना, अथवा यह कहना कि पवित्रशास्त्र का प्रत्येक अलग पद सीधे उन्हीं के विषय में है।
  rationale: यूनानी पाठ व्यापक मसीह-केंद्रित व्याख्या का संकेत देता है, किन्तु न तो उसे केवल स्पष्ट भविष्यवाणियों तक सीमित करता है और न प्रत्येक अंश के सीधे संदर्भ का दावा स्पष्ट रूप से करता है। अनुवाद इसी व्यापकता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘पवित्रशास्त्र’ धार्मिक ग्रन्थ-संदर्भ को स्पष्ट करता है; वाक्यरचना मूल के क्रम को पर्याप्त रूप से बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक रखी गई है।
