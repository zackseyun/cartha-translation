- from: और उसका शरीर न पाकर[a] वे लौट आईं और कहने लगीं कि उन्होंने स्वर्गदूतों का एक दर्शन भी देखा था[b], जो कहते हैं कि वह जीवित है।
  to: और उसका शरीर न पाकर[a] वे यह कहती हुई आईं कि उन्होंने स्वर्गदूतों का दर्शन भी देखा था[b], जो कहते हैं कि वह जीवित है।
  rationale: The revision corrects two small additions in the Hindi wording (‘लौट’ and the inceptive implication of ‘लगीं’) and makes the expression for the angelic vision idiomatic. It preserves the Greek present in ‘कहते हैं,’ the ascensive/additive force of καί in ‘भी,’ and the supplied alternative syntactic reading with its anchor.
