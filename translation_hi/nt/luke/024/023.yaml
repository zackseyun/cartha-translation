  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: hi
  text: और उसका शरीर न पाकर[a] वे यह कहती हुई आईं कि उन्होंने स्वर्गदूतों का दर्शन भी देखा था[b], जो कहते हैं कि वह जीवित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक कम संभावित अनुवाद: “और उसका शरीर न पाकर वे यह कहती हुई आईं कि उन्होंने स्वर्गदूतों का दर्शन देखा था और वे कहती हैं कि वह जीवित है।” इसमें “जो कहते हैं” का संबंध स्वर्गदूतों के बजाय स्त्रियों से माना जाता है।'
    reason: alternative_reading
  - marker: b
    text: या, “कि उन्होंने स्वर्गदूतों का दर्शन तक देखा था।”
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ
  choice: उसका शरीर न पाकर
  rationale: स्त्रीलिंग बहुवचन एओरिस्ट कृदंत स्त्रियों से संबंधित है। हिंदी में पूर्वकालिक कृदंत ‘न पाकर’ स्वाभाविक है और μή की नकारात्मकता को स्पष्ट रखता है।
- source_word: ἦλθον λέγουσαι
  choice: वे लौट आईं और कहने लगीं
  rationale: ἦλθον का मूल अर्थ ‘आईं’ है; प्रसंग में कब्र से वापस आने का भाव स्पष्ट होने के कारण ‘लौट आईं’ सहज हिंदी है। λέγουσαι को स्वाभाविक कथात्मक शैली में ‘कहने लगीं’ किया गया है।
- source_word: καὶ ὀπτασίαν ἀγγέλων
  choice: स्वर्गदूतों का एक दर्शन भी
  rationale: καί यहाँ पहले आश्चर्यजनक समाचार के साथ एक और बात जोड़ता है, इसलिए ‘भी’ उपयुक्त है। ὀπτασία के अलौकिक दृश्य के भाव को ‘दर्शन’ व्यक्त करता है।
- source_word: ἑωρακέναι
  choice: उन्होंने ... देखा था
  rationale: पूर्णकालिक infinitive परोक्ष कथन में है; हिंदी का ‘देखा था’ उस पूर्ववर्ती अनुभव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἳ λέγουσιν αὐτὸν ζῆν
  choice: जो कहते हैं कि वह जीवित है
  rationale: वर्तमान काल λέγουσιν को ‘कहते हैं’ और ζῆν को स्वाभाविक हिंदी में ‘जीवित है’ रखा गया है।
theological_decisions:
- issue: οἳ λέγουσιν में संबंधवाचक सर्वनाम का पूर्वपद
  choice: ‘जो’ का संबंध स्वर्गदूतों से है
  alternative: 'इसे स्त्रियों के कथन से जोड़ना: ‘और वे कहती हैं कि वह जीवित है’'
  rationale: पुल्लिंग बहुवचन οἳ का निकटतम और व्याकरणतः स्वाभाविक पूर्वपद ἀγγέλων (‘स्वर्गदूतों’) है। कम संभावित वैकल्पिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। स्त्रियों के लिए स्त्रीलिंग बहुवचन स्पष्ट रखा गया है। ‘दर्शन’ धार्मिक संदर्भ में स्वाभाविक है, पर वाक्य में इसे अलौकिक अनुभव के रूप में ही समझा जाता है।
