review_pass:
  verdict: revise
  source_fidelity: ‘लौट आईं’ adds a return nuance that ἦλθον (‘they came’) does not state explicitly. ‘कहने लगीं’ can suggest that they began speaking, whereas the participle λέγουσαι simply accompanies their coming. The revision retains the participial/reporting sense without either addition. The relative clause remains linked most naturally to ‘स्वर्गदूतों’; its less likely linkage to the women is retained in the footnote.
  naturalness: ‘वे यह कहती हुई आईं’ is natural, concise modern Hindi for ἦλθον λέγουσαι. Removing ‘एक’ from ‘स्वर्गदूतों का एक दर्शन’ avoids an awkward, English-like indefinite construction; ‘स्वर्गदूतों का दर्शन’ is idiomatic Hindi in this narrative register.
  terminology: ‘शरीर,’ ‘स्वर्गदूतों,’ ‘दर्शन,’ and ‘जीवित है’ are appropriate, clear, and theologically non-speculative. ‘दर्शन’ suitably conveys ὀπτασία without unnecessarily elaborating its supernatural character.
  issues:
  - severity: medium
    issue: ‘लौट आईं’ translates ἦλθον too specifically.
    rationale: Although the women have in context been at the tomb, the Greek verb says ‘came,’ not explicitly ‘returned.’ Optimal-equivalence Hindi should avoid adding that directional nuance.
  - severity: low
    issue: ‘कहने लगीं’ introduces an inceptive nuance.
    rationale: This can mean ‘began to say,’ while λέγουσαι means ‘saying’ and functions as an attendant participle. ‘यह कहती हुई आईं’ more closely represents the construction.
  - severity: low
    issue: ‘स्वर्गदूतों का एक दर्शन’ is stylistically awkward.
    rationale: Hindi normally does not require an equivalent to the Greek indefinite article here. ‘स्वर्गदूतों का दर्शन’ is more idiomatic and retains the sense.
  revised_text: और उसका शरीर न पाकर[a] वे यह कहती हुई आईं कि उन्होंने स्वर्गदूतों का दर्शन भी देखा था[b], जो कहते हैं कि वह जीवित है।
  revised_footnotes:
