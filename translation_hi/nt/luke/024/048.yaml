translation:
  language: hi
  text: तुम इन बातों के गवाह हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “तुम इनके गवाह हो।” यूनानी संकेतवाचक शब्द उन घटनाओं की ओर इशारा करता है जिनका यीशु ने अभी उल्लेख किया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: स्पष्ट द्वितीय-पुरुष बहुवचन सर्वनाम होने के कारण कर्ता पर हल्का बल है। आधुनिक हिन्दी में स्वतंत्र ‘तुम’ स्वाभाविक रूप से इसे व्यक्त करता है; ‘तुम स्वयं’ यहाँ अनावश्यक रूप से अधिक बल देता।
- source_word: ἐστε
  choice: हो
  rationale: वर्तमानकालिक ‘होना’ का द्वितीय-पुरुष बहुवचन रूप; ‘तुम’ के साथ स्वाभाविक हिन्दी प्रयोग।
- source_word: μάρτυρες
  choice: गवाह
  rationale: यहाँ आशय उन लोगों से है जो देखी-सुनी घटनाओं की गवाही देते हैं। ‘गवाह’ सहज और प्रचलित हिन्दी शब्द है तथा बाद में विकसित हुई ‘शहीद’ की धारणा को अनावश्यक रूप से नहीं लाता।
- source_word: τούτων
  choice: इन बातों के
  rationale: संबंधकारक बहुवचन संकेतवाचक निकटवर्ती कथनों और घटनाओं की ओर लौटता है। ‘इन बातों के’ हिन्दी में स्पष्ट और मुहावरेदार है, जबकि केवल ‘इनके’ अस्पष्ट हो सकता है।
theological_decisions:
- issue: शिष्यों की μάρτυρες के रूप में भूमिका
  choice: यह पद शिष्यों को अभी बताई गई घटनाओं की गवाही देने वाले गवाह ठहराता है।
  alternative: इसे ‘शहीद’ के बाद के मसीही तकनीकी अर्थ में समझना।
  rationale: तात्कालिक प्रसंग यीशु के दुःख, पुनरुत्थान और घोषित किए जाने वाले संदेश की गवाही का है। इसलिए अनुवाद बाद में विकसित शहादत-संबंधी अर्थ को यहाँ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। ‘गवाह’ सामान्य पाठक के लिए स्पष्ट है और न्यायिक अर्थ तक सीमित नहीं है।
