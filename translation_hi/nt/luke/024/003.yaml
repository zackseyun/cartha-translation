lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: जब वे भीतर गईं
  rationale: यह स्त्रीलिंग बहुवचन एओरिस्ट कृदंत है और उन स्त्रियों की ओर संकेत करता है। हिन्दी में काल-सूचक उपवाक्य इसके अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: 'यह कथा को आगे बढ़ाते हुए हल्का विरोध दिखाता है: वे भीतर गईं, पर अपेक्षित शरीर वहाँ नहीं मिला।'
- source_word: οὐχ εὗρον
  choice: उन्हें ... नहीं मिला
  rationale: हिन्दी में किसी वस्तु को खोजकर न पाने के लिए यह स्वाभाविक और सीधा प्रयोग है; इससे यूनानी एओरिस्ट का साधारण कथात्मक भाव बना रहता है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: σῶμα का सामान्य अर्थ ‘शरीर’ है। ‘लाश’ की अपेक्षा यह अधिक सीधा है और मूल पाठ में निहित पुनरुत्थान-संबंधी कथात्मक संबंध पर अतिरिक्त रंग नहीं चढ़ाता।
theological_decisions:
- issue: क्या यह स्पष्ट किया जाए कि शरीर किसका था
  choice: शरीर
  alternative: प्रभु यीशु का शरीर
  rationale: प्रदत्त SBLGNT पाठ में केवल τὸ σῶμα (‘शरीर’) है। अधिक स्पष्ट लंबा पाठ कुछ पांडुलिपियों में मिलता है, इसलिए उसे मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्त्रीलिंग बहुवचन ‘गईं’ से पूर्ववर्ती स्त्रियों का संदर्भ स्पष्ट रहता है; ‘पर ... तो’ कथा के हल्के विरोध और समय-संबंध को स्वाभाविक रूप देता है।
