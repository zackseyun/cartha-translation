lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य रूप उस बात को दर्शाता है जो पवित्रशास्त्र में लिखी हुई है और अब भी प्रमाण के रूप में बनी हुई है; ‘लिखा है’ हिन्दी की स्वाभाविक शास्त्रीय अभिव्यक्ति है।
- source_word: παθεῖν
  choice: दुःख उठाएगा
  rationale: अनंत क्रिया लिखी हुई बात की विषयवस्तु बताती है। भविष्यकालीन हिन्दी रूप सन्दर्भ में स्वाभाविक है और यूनानी में स्पष्ट रूप से न पाए जाने वाले ‘अवश्य’ को नहीं जोड़ता।
- source_word: τὸν χριστόν
  choice: मसीह
  rationale: सवर्ण पद यहाँ उपाधि के रूप में प्रयुक्त है। ‘मसीह’ यहूदी और शास्त्रीय ‘अभिषिक्त जन’ की पृष्ठभूमि को बनाए रखता है।
- source_word: ἀναστῆναι
  choice: जी उठेगा
  rationale: यूनानी सक्रिय अनंत क्रिया को सक्रिय और अकर्मक रूप में रखा गया है; ‘जिलाया जाएगा’ मूल के वाच्य को बदल देता। ‘जी उठना’ पुनरुत्थान के लिए स्पष्ट और प्रचलित हिन्दी है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह अनुवाद ἐκ के ‘में से’ भाव को स्पष्ट रूप से सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: सम्प्रदान कारक यहाँ समयसूचक है; ‘तीसरे दिन’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह अभिव्यक्ति लिखी हुई बात की रीति अथवा विषयवस्तु का परिचय देती है और शास्त्रीय कथन का गरिमापूर्ण स्वर बनाए रखती है।
- source_word: ὅτι
  choice: कि
  rationale: ‘कि’ हिन्दी में कथन की विषयवस्तु आरम्भ करने का स्वाभाविक तरीका है और यूनानी संयोजक को प्रत्यक्ष रूप से दर्शाता है।
theological_decisions:
- issue: दुःख और पुनरुत्थान के सारांश में Χριστός का अनुवाद
  choice: मसीह
  alternative: अभिषिक्त जन; ख्रीष्ट
  rationale: यहाँ Χριστός नाम-सदृश प्रयोग नहीं, बल्कि निश्चित उपाधि है। ‘मसीह’ शास्त्रीय और राजकीय-अभिषेक की पृष्ठभूमि को सुरक्षित रखता है।
- issue: ἀναστῆναι में पुनरुत्थान क्रिया का वाच्य
  choice: जी उठेगा
  alternative: जिलाया जाएगा
  rationale: मूल यूनानी रूप सक्रिय है। नया नियम अन्य स्थानों पर यीशु के जिलाए जाने की बात भी करता है, पर इस पद में निष्क्रिय रूप रख देने से यहाँ की वास्तविक व्याकरणिक अभिव्यक्ति बदल जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस प्रकार लिखा है’ शास्त्रीय सूत्र की औपचारिकता बनाए रखता है, जबकि ‘दुःख उठाएगा’ और ‘जी उठेगा’ सामान्य हिन्दी पाठक के लिए स्पष्ट हैं।
