  text: तब उसने उनकी बुद्धि खोल दी, ताकि वे पवित्र शास्त्रों को समझ सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा के घटनाक्रम में समय और क्रम को सूचित करता है; संक्षिप्त और स्वाभाविक हिन्दी समतुल्य।
- source_word: διήνοιξεν
  choice: खोल दी
  rationale: διανοίγω के ठोस रूपक को बनाए रखता है और इसे केवल ‘सक्षम किया’ कहकर व्याख्यात्मक नहीं बनाता।
- source_word: αὐτῶν τὸν νοῦν
  choice: उनकी बुद्धि
  rationale: νοῦς यहाँ समझने और ग्रहण करने की मानसिक क्षमता को दर्शाता है। हिन्दी में ‘उनकी बुद्धि’ एकवचन सामूहिक प्रयोग के रूप में स्वाभाविक है और ‘खोल दी’ के रूपक को सुरक्षित रखता है।
- source_word: τοῦ συνιέναι
  choice: समझने के लिए
  rationale: संज्ञार्थक क्रियारूप यहाँ उद्देश्य अथवा परिणाम व्यक्त कर सकता है; यह हिन्दी प्रयोग दोनों के बीच की निकटता को अनावश्यक विस्तार के बिना बनाए रखता है।
- source_word: τὰς γραφάς
  choice: पवित्र शास्त्रों
  rationale: लूका–प्रेरितों के इस संदर्भ में γραφαί इस्राएल के मान्य पवित्र लेखों का द्योतक है; ‘पवित्र शास्त्र’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित पद है।
theological_decisions:
- issue: यीशु द्वारा बुद्धि खोलने की क्रिया का स्वरूप
  choice: सीधा कथन रखा गया है कि उसने उनकी बुद्धि खोल दी।
  alternative: उसने उन्हें समझने योग्य बनाया; उसने उन्हें पवित्र शास्त्र समझाए।
  rationale: यूनानी पाठ यीशु की क्रिया को सीधे ‘बुद्धि खोलने’ के रूप में कहता है। अनुवाद न तो इसे केवल व्याख्या देने तक सीमित करता है, न बाद की किसी विशिष्ट ‘प्रकाशन’ संबंधी धर्मवैज्ञानिक व्याख्या को जोड़ता है।
- issue: τοῦ συνιέναι में उद्देश्य और परिणाम
  choice: ‘समझने के लिए’
  alternative: ‘ताकि वे पवित्र शास्त्रों को समझ सकें’
  rationale: यूनानी संज्ञार्थक क्रियारूप उद्देश्य या परिणामी क्षमता दोनों की छाया रख सकता है। संक्षिप्त हिन्दी वाक्यांश इस तनाव को पर्याप्त रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बुद्धि खोल दी’ मूल के रूपक को बनाए रखता है; ‘पवित्र शास्त्रों’ से संदर्भित धर्मग्रंथ स्पष्ट होते हैं।
