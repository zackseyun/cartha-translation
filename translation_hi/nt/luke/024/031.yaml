  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: hi
  text: तब उनकी आँखें खुल गईं और उन्होंने उसे पहचान लिया; और वह उनकी दृष्टि से ओझल हो गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनके लिए अदृश्य हो गया” या “वह उनकी दृष्टि से गायब हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: खुल गईं
  rationale: διανοίγω के अओरिस्ट कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है और यह भाव बनाए रखता है कि उनकी समझने की क्षमता स्वयं उनके प्रयास से नहीं, बल्कि उनके लिए खोली गई।
- source_word: οἱ ὀφθαλμοὶ
  choice: उनकी आँखें
  rationale: यूनानी में ‘आँखें’ कर्ता हैं और αὐτῶν संबंधसूचक है; ‘उनकी आँखें’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ἐπέγνωσαν
  choice: पहचान लिया
  rationale: संदर्भ में क्रिया का अर्थ उस व्यक्ति को पहचान लेना है जिसे वे पहले पहचान नहीं पाए थे; ‘जान लिया’ की अपेक्षा यह अधिक सटीक है।
- source_word: ἄφαντος
  choice: ओझल
  rationale: ἄφαντος का मूल भाव ‘दिखाई न देने वाला’ है। ‘ओझल’ घटना को स्पष्ट करता है, पर यह निश्चित नहीं करता कि यीशु किस रीति से उनकी दृष्टि से हटे।
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: उनकी दृष्टि से … हो गया
  rationale: शाब्दिक संरचना ‘उनसे … हो गया’ हिन्दी में अस्वाभाविक है। ‘उनकी दृष्टि से ओझल हो गया’ ἀπό के संबंधपरक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा में अगले घटनाक्रम की ओर बढ़ाता है; ‘तब’ उस क्रम को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के दिखाई न देने की प्रकृति
  choice: वह उनकी दृष्टि से ओझल हो गया
  alternative: वह उनके लिए अदृश्य हो गया / वह उनके सामने से गायब हो गया
  rationale: ἄφαντος ἐγένετο यह बताता है कि वह उन्हें दिखाई नहीं दिया, पर इसकी प्रक्रिया नहीं समझाता। ‘ओझल हो गया’ इस रहस्य और अस्पष्टता को बनाए रखता है तथा किसी विशेष अलौकिक प्रक्रिया को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘आँखें खुल गईं’ परिचित मुहावरे और यूनानी कर्मवाच्य दोनों को स्वाभाविक रूप से बनाए रखता है; ‘दृष्टि से ओझल’ साधारण पाठक के लिए स्पष्ट है और घटना की रीति को अनावश्यक रूप से निश्चित नहीं करता।
