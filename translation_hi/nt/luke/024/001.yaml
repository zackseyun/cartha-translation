  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: hi
  text: सप्ताह के पहले दिन[a], भोर के बहुत तड़के, वे उन सुगंधित द्रव्यों को लेकर कब्र पर आईं जिन्हें उन्होंने तैयार किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सब्तों में से पहला [दिन]”; यह सप्ताह के पहले दिन के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: पर सप्ताह के पहले दिन
  rationale: यह सामी/कोइने मुहावरा सप्ताह के पहले दिन को सूचित करता है। हिन्दी में यही स्वाभाविक और स्पष्ट है; शाब्दिक ‘सब्तों में से पहले’ अर्थ को धुँधला कर देगा।
- source_word: ὄρθρου βαθέως
  choice: भोर बहुत तड़के
  rationale: वाक्यांश भोर के अत्यन्त आरम्भिक समय पर बल देता है। ‘भोर बहुत तड़के’ इस तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸ μνῆμα
  choice: कब्र पर
  rationale: गति-सूचक क्रिया के साथ ἐπί गंतव्य की ओर आने को बताता है। दफ़नाने के इस प्रसंग में ‘कब्र’ सामान्य हिन्दी का स्पष्ट शब्द है।
- source_word: ἦλθον
  choice: आईं
  rationale: क्रिया बहुवचन कर्ता के आगमन को साधारण कथात्मक ढंग से बताती है। निकटवर्ती स्त्रीलिंग कृदंत φέρουσαι से स्पष्ट है कि आनेवाली स्त्रियाँ थीं, इसलिए हिन्दी में स्त्रीलिंग ‘आईं’ उचित है।
- source_word: φέρουσαι
  choice: लेकर
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ होने वाली क्रिया बताता है। हिन्दी में ‘लेकर ... आईं’ स्वाभाविक समकालिक संरचना है।
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: अपनी तैयार की हुई सुगंधित वस्तुएँ
  rationale: ἀρώματα दफ़न-संस्कार के लिए तैयार की गई सुगंधित सामग्री को दर्शाता है। ‘सुगंधित वस्तुएँ’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और केवल खाने के मसालों का भ्रम टालता है।
theological_decisions:
- issue: पुनरुत्थान के प्रसंग में काल-सूचक मुहावरा τῇ μιᾷ τῶν σαββάτων
  choice: सप्ताह के पहले दिन
  alternative: सब्तों में से पहले दिन
  rationale: सामान्य मुहावरेदार अर्थ को अपनाया गया है, ताकि यूनानी से अनिवार्य न होने वाला कोई विशिष्ट पंचांगीय या साम्प्रदायिक दावा पाठ में न जोड़ा जाए। शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, कथात्मक और गरिमापूर्ण है। ‘भोर बहुत तड़के’ मूल के समयगत बल को बनाए रखता है, जबकि ‘सुगंधित वस्तुएँ’ दफ़न-संस्कार की सामग्री को सामान्य पाठक के लिए स्पष्ट करता है।
