review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the attention signal, the Father’s promise without interpretive identification, the command to remain in the city, and the ‘from on high’ source of power. However, ‘सामर्थ्य धारण न कर लो’ can suggest that the disciples themselves acquire or take up power, whereas ἐνδύσησθε δύναμιν presents power as that with which they are clothed.
  naturalness: The Hindi is clear and appropriately dignified. Recasting the final clothing expression as ‘सामर्थ्य से आवृत न हो जाओ’ is natural modern Hindi and better retains the passive/resultative force of the image.
  terminology: ‘प्रतिज्ञा,’ ‘नगर,’ and ‘सामर्थ्य’ are suitable, consistent terms. No doctrinal expansion of ‘the promise’ is needed.
  issues:
  - severity: low
    issue: Agency and imagery in ‘सामर्थ्य धारण न कर लो’
    rationale: This wording is intelligible, but ‘धारण कर लो’ tends to make the disciples the agents who take on power. The Greek clothing metaphor is better represented by their becoming clothed/covered with power.
  revised_text: और देखो, मैं अपने पिता की प्रतिज्ञा तुम पर भेज रहा हूँ। पर तुम नगर में तब तक ठहरे रहो, जब तक तुम ऊपर से सामर्थ्य से आवृत न हो जाओ।
  revised_footnotes: []
  revision_rationale: The revision is limited to the final clause. It preserves the metaphor of being clothed, avoids identifying the promise beyond the verse’s wording, and retains the spatial-theological expression ‘ऊपर से.’
