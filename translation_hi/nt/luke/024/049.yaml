  to: और देखो, मैं अपने पिता की प्रतिज्ञा तुम पर भेज रहा हूँ। पर तुम नगर में तब तक ठहरे रहो, जब तक तुम ऊपर से सामर्थ्य से आवृत न हो जाओ।
