id: LUK.24.49
reference: Luke 24:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: hi
  text: और देखो, मैं अपने पिता की प्रतिज्ञा तुम पर भेज रहा हूँ। पर तुम नगर में तब तक ठहरे रहो, जब तक तुम ऊपर से सामर्थ्य से आवृत न हो जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संबोधन है; आधुनिक हिन्दी में सरल और स्वाभाविक रूप से ‘देखो’ इसके बल को बनाए रखता है।
- source_word: ἐξαποστέλλω
  choice: भेज रहा हूँ
  rationale: यूनानी वर्तमानकाल की प्रत्यक्ष और आसन्न क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: अपने पिता की प्रतिज्ञा
  rationale: मूल पाठ के संक्षिप्त रूप को बनाए रखता है और प्रतिज्ञा की विषयवस्तु को व्याख्यात्मक रूप से नाम नहीं देता।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम पर
  rationale: मूल उपसर्गीय अभिव्यक्ति की दिशा और आगमन का भाव सुरक्षित रखता है।
- source_word: καθίσατε ἐν τῇ πόλει
  choice: नगर में ... ठहरे रहो
  rationale: यहाँ καθίζω का आशय बैठने की शारीरिक मुद्रा से अधिक एक स्थान पर बने रहने का आदेश है।
- source_word: ἐνδύσησθε
  choice: धारण न कर लो
  rationale: वस्त्र पहनने के रूपक को हिन्दी की स्वाभाविक धार्मिक-साहित्यिक अभिव्यक्ति में सुरक्षित रखता है।
- source_word: ἐξ ὕψους δύναμιν
  choice: ऊपर से सामर्थ्य
  rationale: ‘ऊपर से’ दिव्य स्रोत की मूल स्थानिक-रूपकात्मक भाषा बनाए रखता है; δύναμις के लिए ‘सामर्थ्य’ गरिमापूर्ण और व्यापक है।
theological_decisions:
- issue: ‘पिता की प्रतिज्ञा’ की पहचान
  choice: प्रतिज्ञा को पाठ में स्पष्ट रूप से पवित्र आत्मा नहीं कहा गया
  alternative: ‘मेरे पिता द्वारा प्रतिज्ञा किया हुआ पवित्र आत्मा’
  rationale: निकटवर्ती और व्यापक लूकीय संदर्भ इसकी पहचान स्पष्ट कर सकता है, पर इस पद की संक्षिप्त और संकेतात्मक भाषा को अनावश्यक विस्तार के बिना सुरक्षित रखा गया है।
- issue: ‘सामर्थ्य धारण’ का रूपक
  choice: रूपक को बनाए रखा गया
  alternative: ‘सामर्थ्य से भर दिए जाओ’
  rationale: ‘भरना’ अर्थ की व्याख्या करता, जबकि मूल पाठ वस्त्र धारण करने का विशिष्ट रूपक प्रयोग करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘देखो’ मूल के ध्यानाकर्षक बल को रखता है। ‘नगर’ मूल पाठ की अनिर्दिष्टता बनाए रखता है, यद्यपि संदर्भ में यरूशलेम अभिप्रेत है।
