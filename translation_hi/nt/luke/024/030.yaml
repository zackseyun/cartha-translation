source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह भोजन के लिए उनके साथ टेक लगाकर बैठा[a], तो उसने रोटी ली, उस पर आशीष दी, और उसे तोड़कर उन्हें देने लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके साथ भोजन करने बैठा।” यूनानी शब्द विशेष रूप से प्राचीन रीति के अनुसार भोजन के लिए मेज़ पर टेक लगाकर या लेटकर बैठने का संकेत देता है।
    reason: cultural_note
  - marker: b
    text: या “उन्हें देता जा रहा था।” यूनानी अपूर्ण भूतकाल जारी क्रिया पर बल दे सकता है; “देने लगा” यहाँ क्रिया के आरंभ को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: और ऐसा हुआ कि
  rationale: लूका की कथात्मक संक्रमण-शैली को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: जब वह उनके साथ भोजन करने के लिए लेटा
  rationale: कालवाचक रचना को स्पष्ट करता है और प्राचीन रीति के अनुसार मेज़ पर टिककर या लेटकर भोजन करने का भाव सुरक्षित रखता है।
- source_word: λαβὼν τὸν ἄρτον
  choice: उसने रोटी ली
  rationale: कृदंत को स्वाभाविक हिन्दी में क्रियाओं के क्रम के रूप में व्यक्त करता है; निश्चित रोटी प्रसंग में सामने रखी रोटी है।
- source_word: εὐλόγησεν
  choice: उस पर आशीष कही
  rationale: भोजन के प्रसंग में रोटी पर आशीर्वचन कहने का भाव देता है और εὐχαριστέω के अर्थ ‘धन्यवाद दिया’ को आरोपित नहीं करता।
- source_word: κλάσας
  choice: उसे तोड़कर
  rationale: मुख्य क्रिया से पहले हुई क्रिया का क्रम संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐπεδίδου
  choice: उन्हें देने लगा
  rationale: अपूर्ण भूतकाल की आरंभिक या जारी क्रिया की संभावना में से प्रसंगानुकूल आरंभिक भाव व्यक्त करता है; विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: भोजन की क्रियाओं में संभावित प्रभु-भोज या संस्कार-संबंधी संकेत
  choice: मुख्य पाठ में साधारण भोजन की भाषा रखते हुए मूल क्रियाक्रम सुरक्षित रखा गया
  alternative: ऐसी शब्दावली अपनाना जो प्रभु-भोज का अधिक स्पष्ट संस्कारात्मक संकेत दे
  rationale: ‘लिया, आशीष कही, तोड़ा, दिया’ का क्रम अन्य भोजन-वृत्तांतों की प्रतिध्वनि कर सकता है, पर यह पद स्वयं इसे संस्कार घोषित नहीं करता। इसलिए किसी सम्प्रदायगत निष्कर्ष को जोड़े बिना पाठ की संभावित प्रतिध्वनि खुली रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘भोजन करने के लिए लेटा’ सांस्कृतिक दूरी को बनाए रखता है, जबकि पादटिप्पणी अधिक सामान्य हिन्दी विकल्प देती है।
