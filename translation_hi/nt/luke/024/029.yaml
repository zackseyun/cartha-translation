source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: hi
  text: पर उन्होंने उससे बहुत आग्रह किया[a], “हमारे साथ ठहर जाइए, क्योंकि शाम होने को है और दिन पहले ही ढल चुका है[b]।” और वह उनके साथ ठहरने के लिए भीतर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उस पर बहुत ज़ोर डाला”; परम्परागत रूप से, “उन्होंने उसे विवश किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “दिन अब बहुत ढल गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: उन्होंने उससे बहुत आग्रह किया
  rationale: मध्यवाच्य रूप यहाँ शारीरिक बल की अपेक्षा प्रबल और लगातार आग्रह व्यक्त करता है। यह हिन्दी प्रयोग तीव्रता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: Μεῖνον
  choice: ठहर जाइए
  rationale: आतिथ्य के प्रसंग में μένω का अर्थ उस रात वहीं ठहरने का अनुरोध है। आदरसूचक आज्ञार्थक रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μεθ’ ἡμῶν
  choice: हमारे साथ
  rationale: सम्बन्ध और संगति का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: क्योंकि शाम होने को है
  rationale: πρὸς ἑσπέραν शाम के निकट आने को दर्शाता है, न कि अनिवार्यतः शाम पूरी तरह हो चुकने को।
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: दिन पहले ही ढल चुका है
  rationale: κλίνω के पूर्णकालिक रूप में दिन के झुकने या ढलने का चित्र है; यह अनुवाद उस रूपक और पूर्ण हो चुकी अवस्था दोनों को सुरक्षित रखता है।
- source_word: εἰσῆλθεν
  choice: वह भीतर गया
  rationale: प्रसंग में किसी घर या ठहरने के स्थान में प्रवेश निहित है; ‘भीतर गया’ सहज कथात्मक हिन्दी है।
- source_word: τοῦ μεῖναι
  choice: ठहरने के लिए
  rationale: सन्धियुक्त क्रियार्थक संज्ञा यहाँ उद्देश्य को व्यक्त करती है और पहले आए ‘ठहर जाइए’ से शब्दगत सम्बन्ध बनाए रखती है।
- source_word: σὺν αὐτοῖς
  choice: उनके साथ
  rationale: σύν की संगति का सीधा अर्थ सुरक्षित रहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक रखी गई है। अनजान यात्री के प्रति बोले गए अनुरोध में ‘ठहर जाइए’ आदरसूचक है, जबकि वर्णन में स्वाभाविक हिन्दी के अनुसार एकवचन ‘वह’ प्रयुक्त है। दोनों καὶ को अत्यधिक व्याख्यात्मक कारण-सूचक सम्बन्ध में बदलने के बजाय दूसरे को ‘और’ से व्यक्त किया गया है।
