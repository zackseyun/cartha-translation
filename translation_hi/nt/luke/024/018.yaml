  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: hi
  text: तब उनमें से एक ने, जिसका नाम क्लियोपास था, उसे उत्तर दिया, “क्या यरूशलेम में केवल तुम ही ऐसे परदेसी[a] हो जो इन दिनों वहाँ हुई घटनाओं से अनजान हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम में परदेशी की तरह रह रहे हो।” यूनानी क्रिया किसी बाहरी व्यक्ति या अस्थायी निवासी के रूप में रहने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: तब ... उत्तर दिया
  rationale: δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, और ἀποκριθείς उत्तर में बोलने का भाव देता है; हिन्दी में इसे स्वाभाविक मुख्य क्रिया के रूप में रखा गया है।
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: उनमें से एक ने, जिसका नाम क्लियोपास था
  rationale: εἷς संदर्भ में उन दो शिष्यों में से एक को सूचित करता है, जबकि ὀνόματι व्यक्तिगत नाम का परिचय देता है।
- source_word: εἶπεν πρὸς αὐτόν
  choice: उसे ... दिया
  rationale: उत्तर दिया में बोलने की क्रिया स्वाभाविक रूप से समाहित है; αὐτόν को ‘उसे’ के रूप में रखा गया है और नाम अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: Σὺ μόνος
  choice: केवल तुम ही
  rationale: μόνος के विशिष्टता और आश्चर्य के बल को सहज हिन्दी प्रश्न में सुरक्षित रखा गया है।
- source_word: παροικεῖς
  choice: परदेशी होकर ठहरे लोगों में
  rationale: παροικέω किसी स्थान में बाहरी व्यक्ति अथवा अस्थायी निवासी के रूप में रहने का अर्थ देता है। बहुवचन ‘लोगों में’ हिन्दी में μόνος के साथ निहित तुलना को स्पष्ट करता है।
- source_word: οὐκ ἔγνως
  choice: नहीं जानते
  rationale: यद्यपि यूनानी क्रिया एओरिस्ट है, यहाँ उसका अर्थ हाल की घटनाओं से वर्तमान अनभिज्ञता है; हिन्दी वर्तमान काल इस परिणामसूचक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: वहाँ क्या-क्या हुआ है
  rationale: संज्ञार्थक कृदन्त हाल की घटनाओं को समग्र रूप से दर्शाता है; ‘क्या-क्या’ अनेक चर्चित घटनाओं के आशय को सहज हिन्दी में व्यक्त करता है और ‘वहाँ’ यरूशलेम की ओर संकेत करता है।
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: इन दिनों
  rationale: मूल के निकट और आधुनिक हिन्दी में स्वाभाविक समय-सूचक अभिव्यक्ति।
theological_decisions:
- issue: παροικεῖς में आगंतुक और अस्थायी परदेशी निवासी के बीच अर्थ-छाया
  choice: परदेशी होकर ठहरे
  alternative: यरूशलेम आए हुए
  rationale: चुना गया रूप बाहरी अथवा अस्थायी निवासी होने के मूल अर्थ को सुरक्षित रखता है और केवल थोड़े समय के आगंतुक तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और कथात्मक शैली। प्रश्न में क्लियोपास के आश्चर्य का बल रखा गया है। ‘परदेशी होकर ठहरे’ मूल क्रिया की बाहरी/अस्थायी निवासी वाली अर्थ-छाया को साधारण पाठक के लिए स्पष्ट करता है।
