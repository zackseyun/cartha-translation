  rationale: यात्रा के ठोस प्रसंग में यह स्वाभाविक है और ‘मार्ग में’ की अपेक्षा सामान्य पाठक के लिए अधिक सुबोध है।
- source_word: διήνοιγεν ἡμῖν τὰς γραφάς
  choice: हमारे लिए पवित्र शास्त्रों का अर्थ खोल रहा था
  rationale: ‘खोलने’ के मूल रूपक को रखते हुए हिन्दी में उसका आशय स्पष्ट करता है; केवल ‘शास्त्र खोलना’ पुस्तक खोलने का भ्रामक अर्थ दे सकता है।
- source_word: τὰς γραφάς
  choice: पवित्र शास्त्रों
  rationale: यह प्रसंग में मान्य पवित्र लेखों के बहुवचन को स्पष्ट और प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘हृदय जलने’ के रूपक का अर्थ
  choice: ‘हमारा हृदय हमारे भीतर जल नहीं रहा था’ रूपक को यथावत रखना
  alternative: ‘हम बहुत उत्साहित/प्रभावित नहीं हो रहे थे’
  rationale: पाठ यह निश्चित नहीं करता कि अनुभव मुख्यतः भावनात्मक, आत्मिक या बौद्धिक था; रूपक इस अर्थगत और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: διανοίγω का रूपक
  choice: ‘पवित्र शास्त्रों का अर्थ खोल रहा था’
  alternative: ‘पवित्र शास्त्र समझा रहा था’
  rationale: चुना हुआ रूप मूल के ‘खोलने’ वाले बिंब को बनाए रखता है और साथ ही हिन्दी पाठक के लिए उसके प्रसंगगत आशय को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘हृदय’ और ‘पवित्र शास्त्र’ बाइबलीय संदर्भ के अनुरूप हैं, जबकि ‘रास्ते में’ तथा ‘बात कर रहा था’ सामान्य पाठक के लिए स्वाभाविक हैं।
