id: LUK.24.21
reference: Luke 24:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: hi
  text: पर हम आशा लगाए हुए थे कि वही इस्राएल का छुटकारा करनेवाला है[a][b]। लेकिन इन सब बातों के अलावा भी, आज इन घटनाओं को हुए तीसरा दिन हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वही इस्राएल का छुटकारा करनेवाला था” भी किया जा सकता है। यूनानी में उनकी बीती आशा के कथ्य के भीतर “है” वर्तमानकाल में है।
    reason: alternative_reading
  - marker: b
    text: “इस्राएल का छुटकारा” मसीह से अपेक्षित व्यापक मुक्ति का संकेत हो सकता है; यहाँ यह स्पष्ट नहीं किया गया कि उनका आशय राजनीतिक मुक्ति, आत्मिक उद्धार या दोनों से था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: पर हम
  rationale: δέ के विरोधसूचक भाव और ἡμεῖς के स्पष्ट बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἠλπίζομεν
  choice: आशा लगाए हुए थे
  rationale: अपूर्णकाल में निहित बीते समय की निरंतर आशा और अब अनुभव हो रही निराशा, दोनों को दर्शाता है।
- source_word: ὅτι αὐτός ἐστιν
  choice: कि वही ... है
  rationale: ग्रीक में भूतकालीन आशा के कथ्य के भीतर वर्तमानकाल ἐστιν बना रहता है; हिन्दी में भी इसे सुरक्षित रखा गया है।
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: छुटकारा करनेवाला
  rationale: μέλλων की प्रत्याशित भावी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि वह कार्य राजनीतिक, आत्मिक या दोनों प्रकार का है।
- source_word: λυτροῦσθαι
  choice: छुटकारा करना
  rationale: मुक्ति और उद्धार के व्यापक मसीही अर्थ को रखता है तथा केवल राजनीतिक आज़ादी या केवल आत्मिक उद्धार तक सीमित नहीं करता।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल
  rationale: वाचा-समुदाय के लिए मूल पाठ के सीधे पद को बनाए रखता है।
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: और इन सब बातों के अलावा
  rationale: पहले कही बातों में एक और निराशाजनक तथ्य जोड़नेवाले संचयी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: आज ... तीसरा दिन हो गया है
  rationale: समय बीतने के यूनानी मुहावरे को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: इन घटनाओं को हुए
  rationale: जिस समय से गणना आरम्भ होती है, उस संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: “इस्राएल का छुटकारा” में मसीही अपेक्षा
  choice: छुटकारे को व्यापक और अनिर्दिष्ट रखा गया है।
  alternative: इस्राएल को राजनीतिक रूप से स्वतंत्र करना; इस्राएल का केवल आत्मिक उद्धार करना
  rationale: मूल पाठ छुटकारे की विधि को सीमित नहीं करता; इसलिए राष्ट्रीय पुनर्स्थापना और आत्मिक उद्धार के बीच का तनाव सुरक्षित रखा गया है।
- issue: अपूर्णकाल ἠλπίζομεν के बाद वर्तमान ἐστιν
  choice: “वही ... है” द्वारा वर्तमानकाल बनाए रखा गया है।
  alternative: “वही ... था”
  rationale: यह ग्रीक में उनकी बीती आशा के भीतर वर्तमान रूप को प्रतिबिंबित करता है और वाक्य को पूर्णतः भूतकाल में बदलकर अर्थ का निर्णय नहीं करता।
- issue: μέλλων का कालगत भाव
  choice: “छुटकारा करनेवाला”
  alternative: “छुटकारा करनेवाला था”; “छुटकारा करने ही वाला है”
  rationale: यह अपेक्षित भूमिका को सुरक्षित रखता है, पर हिन्दी में ऐसा कृत्रिम तात्कालिकता-बोध नहीं लाता मानो कार्य बस उसी क्षण होने वाला हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और जनसुलभ रूप अपनाया गया है। “आशा लगाए हुए थे” निरंतर बीती अपेक्षा को और “छुटकारा” मूल के व्यापक मुक्तिपरक अर्थ को व्यक्त करता है।
