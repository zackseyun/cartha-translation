  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह उन्हें आशीष दे रहा था, तब वह उनसे अलग हो गया और स्वर्ग में उठा लिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “और स्वर्ग में उठा लिया गया” नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य कथात्मक अभिव्यक्ति है; यह घटना के घटित होने को सहज आधुनिक हिन्दी में चिह्नित करती है।
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: जब वह उन्हें आशीष दे रहा था
  rationale: ἐν के साथ प्रयुक्त articular infinitive समकालिक और जारी क्रिया व्यक्त करता है; यह अनुवाद उसी दौरान हुए अलगाव को स्पष्ट रखता है।
- source_word: εὐλογεῖν
  choice: आशीष दे रहा था
  rationale: क्रिया का सीधा अर्थ आशीष देना है; अपूर्णतासूचक हिन्दी रूप उस समय जारी क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διέστη ἀπ’ αὐτῶν
  choice: वह उनसे अलग हो गया
  rationale: यह पद उनसे पृथक होने या दूर चले जाने को व्यक्त करता है; ‘अलग हो गया’ अस्पष्टता को बनाए रखते हुए सहज हिन्दी है।
- source_word: ἀνεφέρετο
  choice: ऊपर उठा लिया गया
  rationale: निष्क्रिय क्रियारूप ऊपर ले जाए जाने का भाव देता है; यह कर्ता की पहचान जोड़े बिना निष्क्रियता और ऊर्ध्वगमन दोनों को बनाए रखता है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग में
  rationale: इस प्रसंग में οὐρανός केवल दृश्य आकाश के बजाय स्वर्ग का संकेत करता है; εἰς के गंतव्य-बोध को ‘में’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कोष्ठकित पाठ καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: मुख्य पाठ में सम्मिलित करके पाठांतर की पादटिप्पणी देना
  alternative: इस वाक्यांश को मुख्य पाठ से छोड़ देना
  rationale: SBLGNT में यह वाक्यांश कोष्ठकों में है, जो पाठगत अनिश्चितता दर्शाता है। दिए गए स्रोत में उपस्थित होने के कारण इसे मुख्य पाठ में रखा गया है, पर कुछ पांडुलिपियों में इसके अभाव को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ कथात्मक रूप अपनाया गया है। ‘आशीष’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्यरचना अनावश्यक रूप से संस्कृतनिष्ठ नहीं रखी गई।
