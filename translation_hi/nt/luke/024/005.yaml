source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: hi
  text: जब वे भयभीत हो गईं और अपने चेहरे भूमि की ओर झुका दिए, तो उन्होंने उनसे कहा, “तुम जीवित व्यक्ति को मरे हुओं के बीच क्यों खोज रही हो?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “तुम जीवित व्यक्ति को मरे हुओं के साथ क्या खोज रही हो?” प्रसंग में इसका भाव है, “तुम जीवित व्यक्ति को मरे हुओं के बीच क्यों खोज रही हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: जब वे भयभीत हो गईं
  rationale: ἔμφοβος गहरे भय को व्यक्त करता है और γενομένων अवस्था में आने का भाव देता है। स्त्रीलिंग बहुवचन संदर्भ में स्त्रियों के लिए है।
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: अपने मुँह भूमि की ओर झुका लिए
  rationale: यह अनुवाद भय और आदर से किए गए ठोस शारीरिक हाव-भाव को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: εἶπαν πρὸς αὐτάς
  choice: उन्होंने उनसे कहा
  rationale: मूल पाठ की तरह कर्ता और स्त्रियों, दोनों के लिए सर्वनाम रखे गए हैं; निकटवर्ती संदर्भ से उनके संकेत स्पष्ट होते हैं।
- source_word: Τί ζητεῖτε
  choice: क्यों खोज रही हो
  rationale: τί का मूल प्रश्नवाचक अर्थ ‘क्या’ हो सकता है, पर इस प्रसंग में प्रश्न खोजने के कारण या अनुपयुक्तता को चुनौती देता है; इसलिए मुख्य पाठ में ‘क्यों’ स्वाभाविक है। वर्तमानकालीन ζητεῖτε के लिए ‘खोज रही हो’ रखा गया है।
- source_word: τὸν ζῶντα
  choice: जो जीवित है उसे
  rationale: एकवचन विशेष्यवत् कृदन्त किसी जीवित व्यक्ति की ओर संकेत करता है। यह हिन्दी में स्वाभाविक है और यीशु का नाम जोड़े बिना मूल की व्यक्तिगत तथा पुनरुत्थान-संबंधी शक्ति बनाए रखता है।
- source_word: μετὰ τῶν νεκρῶν
  choice: मरे हुओं के बीच
  rationale: μετά के संबंधवाचक प्रयोग का अर्थ ‘साथ/बीच’ है; इस प्रसंग में ‘मरे हुओं के बीच’ जीवित व्यक्ति और मृतकों के बीच विरोध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: τὸν ζῶντα में पुनरुत्थान का निहितार्थ
  choice: जो जीवित है उसे
  alternative: जीवित जन को
  rationale: चुना हुआ रूप यीशु को मृतकों के विपरीत जीवित बताता है, पर मूल पाठ में न दिया गया कोई स्पष्टीकरण या नाम नहीं जोड़ता।
- issue: Τί ζητεῖτε की प्रश्नात्मक अस्पष्टता
  choice: मुख्य पाठ में ‘क्यों खोज रही हो’
  alternative: ‘क्या खोज रही हो’
  rationale: संदर्भगत अर्थ ‘क्यों’ है, फिर भी τί के अधिक शाब्दिक ‘क्या’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘भूमि’ बाइबिलीय गरिमा बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए सहज है। स्त्रियों के लिए स्त्रीलिंग बहुवचन क्रियाएँ रखी गई हैं और मूल के सर्वनाम अनावश्यक रूप से स्पष्ट नहीं किए गए।
