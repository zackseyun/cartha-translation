    issue: The phrase ‘तुम जो जीवित है उसे’ lacks the necessary relative-clause punctuation and is syntactically rough.
    rationale: The Greek τὸν ζῶντα is a singular personal substantival participle. Hindi ‘जीवित व्यक्ति को’ expresses this clearly and naturally, while retaining the source’s lack of an explicit name.
  - severity: low
    issue: ‘अपने मुँह भूमि की ओर झुका लिए’ is not the most natural Hindi expression for the women’s action.
    rationale: ‘अपने चेहरे भूमि की ओर झुका दिए’ is idiomatic, retains the plural concrete image of πρόσωπα, and appropriately renders κλίνω in context.
  - severity: low
    issue: The footnote repeats the same syntactic problem as the main text.
    rationale: Its literal alternative needs the same clear personal phrasing in order to be readable Hindi.
