  terminology: ‘भयभीत,’ ‘भूमि,’ and ‘मरे हुओं के बीच’ fit a dignified modern biblical register. ‘जीवित व्यक्ति’ naturally conveys the singular personal substantival participle without naming Jesus or adding doctrinal explanation.
  issues:
