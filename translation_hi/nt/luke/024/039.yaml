id: LUK.24.39
reference: Luke 24:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: hi
  text: मेरे हाथ और मेरे पाँव देखो कि मैं ही हूँ। मुझे छूकर देखो,[a] क्योंकि आत्मा के पास मांस और हड्डियाँ नहीं होतीं, जैसा कि तुम मुझ में देख रहे हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छूकर देखो’ का अनुवाद ‘मुझे टटोलो’ या ‘मुझे छूकर जाँचो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में ‘मैं ही हूँ’ पर विशेष बल है। पहले वाक्य का अनुवाद यह भी हो सकता है: “मेरे हाथ और मेरे पाँव देखो, क्योंकि मैं ही हूँ।”'
    reason: ambiguity
lexical_decisions:
- source_word: ἴδετε
  choice: देखो / देख रहे हो
  rationale: दोनों प्रयोग देखने और प्रत्यक्ष निरीक्षण करने का भाव रखते हैं; पहले में बहुवचन आज्ञार्थक और दूसरे में वर्तमान अवलोकन व्यक्त किया गया है।
- source_word: χεῖράς ... πόδας
  choice: हाथ ... पाँव
  rationale: ये ठोस शारीरिक अंगों के सीधे और स्वाभाविक हिन्दी पर्याय हैं।
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: और जान लो कि मैं स्वयं ही हूँ
  rationale: ἐγώ और αὐτός के संयुक्त बल को ‘मैं स्वयं ही’ सुरक्षित रखता है। ‘जान लो’ हिन्दी में देखने के अपेक्षित निष्कर्ष को स्वाभाविक बनाता है, बिना पहचान के कथन को कोई अतिरिक्त धर्मवैज्ञानिक अर्थ दिए।
- source_word: ψηλαφήσατέ
  choice: छूकर देखो
  rationale: क्रिया केवल हल्का स्पर्श नहीं, स्पर्श द्वारा जाँचने का भाव भी दे सकती है; यह हिन्दी प्रयोग उस प्रत्यक्ष भौतिक सत्यापन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यह πνεῦμα का सीधा और प्रसंगानुकूल पर्याय है; ‘भूत’ सम्भव प्रसंगगत अर्थ है, पर अधिक व्याख्यात्मक और सांस्कृतिक रूप से भ्रामक हो सकता है।
- source_word: σάρκα καὶ ὀστέα
  choice: मांस और हड्डियाँ
  rationale: शरीर की मूर्त वास्तविकता बताने वाली अभिव्यक्ति को सीधे रूप में सुरक्षित रखा गया है।
- source_word: καθὼς
  choice: जैसे
  rationale: शिष्य जो यीशु में देख रहे हैं और आत्मा में जो नहीं होता, उनके बीच तुलना को सहज रूप से व्यक्त करता है।
- source_word: θεωρεῖτε
  choice: तुम देख रहे हो
  rationale: वर्तमानकालीन, ध्यानपूर्वक प्रत्यक्ष अवलोकन का भाव सरल आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἔχοντα
  choice: कि मेरी हैं
  rationale: ἐμέ से सम्बद्ध कृदन्त को स्वाभाविक हिन्दी उपवाक्य में बदला गया है; स्त्रीलिंग बहुवचन ‘हड्डियाँ’ के कारण ‘मेरी हैं’ व्याकरणसम्मत है और मांस भी संयुक्त अर्थ में सम्मिलित रहता है।
theological_decisions:
- issue: पुनरुत्थान के बाद यीशु की शारीरिक वास्तविकता
  choice: ‘आत्मा के मांस और हड्डियाँ नहीं होतीं’ तथा देखने और छूने की आज्ञाओं को स्पष्ट रूप से रखा गया है।
  alternative: शारीरिक विरोध को हल्का या केवल रूपकात्मक बना देने वाला अनुवाद
  rationale: यूनानी पाठ दृष्टि, स्पर्श, मांस और हड्डियों के द्वारा मूर्त देहधारण पर बल देता है। अनुवाद इसी बल को रखता है, पर पद से बाहर कोई सिद्धान्तगत व्याख्या नहीं जोड़ता।
- issue: ὅτι ἐγώ εἰμι αὐτός में ὅτι का सम्बन्ध
  choice: 'देखने के फलस्वरूप पहचान: ‘देखो और जान लो कि मैं स्वयं ही हूँ’'
  alternative: 'कारणवाचक: ‘देखो, क्योंकि मैं स्वयं ही हूँ’'
  rationale: यहाँ ὅτι को उस बात की विषयवस्तु मानना सम्भव है जिसे शिष्यों को देखकर पहचानना है। हिन्दी में अकेला ‘देखो कि’ असहज होता, इसलिए ‘और जान लो’ से सम्बन्ध स्पष्ट किया गया है; कारणवाचक सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन। ‘पाँव’ सामान्य पाठक के लिए स्वाभाविक है; ‘मांस और हड्डियाँ’ मूल की ठोस शारीरिक भाषा को बनाए रखता है।
