  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ये कैसी बातें’ तथा ‘एक-दूसरे से’ संवाद के पारस्परिक स्वरूप को सामान्य पाठक के लिए स्वाभाविक बनाते हैं; ‘उदास चेहरा लिए’ मूल में दिखाई देने वाली विषादपूर्ण मुख-मुद्रा को स्पष्ट करता है।
