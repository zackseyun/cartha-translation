  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: hi
  text: उसने उनसे कहा, “तुम चलते-चलते आपस में ये कौन-सी बातें कर रहे हो?”[a] और वे रुक गए, उनके चेहरे उदास थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम चलते-चलते आपस में किन बातों पर चर्चा कर रहे हो?”
    reason: lexical_alternative
  - marker: b
    text: या “वे रुक गए और उदास दिखाई दिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: यूनानी क्रिया का सामान्य अर्थ ‘कहा’ है। कथन प्रश्न के रूप में है, फिर भी ‘पूछा’ करने के बजाय मूल क्रिया की अभिव्यक्ति बनाए रखी गई है।
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: ये कैसी बातें
  rationale: λόγοι का शाब्दिक अर्थ ‘शब्द’ है, पर यहाँ इसका संकेत चल रही बातचीत की बातों की ओर है। आधुनिक हिन्दी में ‘ये कैसी बातें’ स्वाभाविक है और प्रश्न का आशय स्पष्ट रखता है।
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: तुम एक-दूसरे से … बातें कर रहे हो
  rationale: ἀντιβάλλετε परस्पर आगे-पीछे होने वाले मौखिक विचार-विनिमय को व्यक्त करता है। यह हिन्दी प्रयोग पारस्परिक बातचीत का भाव रखता है, बिना इसे अनिवार्य रूप से वाद-विवाद ठहराए।
- source_word: περιπατοῦντες
  choice: चलते-चलते
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ चल रही क्रिया बताता है। ‘चलते-चलते’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐστάθησαν
  choice: रुक गए
  rationale: यह रूप प्रसंग में चलते हुए ठहर जाने को दर्शाता है। ‘रुक गए’ हिन्दी में उस घटनात्मक परिवर्तन को ‘खड़े रहे’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: σκυθρωποί
  choice: उदास चेहरा लिए
  rationale: यह शब्द उदासी या विषाद से भरे चेहरे के भाव को दर्शाता है। ‘उदास चेहरा लिए’ उसके दृश्य, मुख-मुद्रा संबंधी अर्थ को बनाए रखता है।
