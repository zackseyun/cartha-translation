  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: hi
  text: और यरूशलेम से आरम्भ करके उसके नाम से पापों की क्षमा के लिए पश्चाताप[a] का प्रचार सभी राष्ट्रों[b] में किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पश्चाताप और पापों की क्षमा”; यूनानी वाक्य को प्रचार की दो समन्वित विषय-वस्तुओं के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “सभी गैर-यहूदियों में”; यूनानी शब्द का कुछ प्रसंगों में यह अर्थ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: प्रचार किया जाए
  rationale: यह निष्क्रिय अनंत क्रिया सार्वजनिक घोषणा का भाव रखती है और पिछले पद के पवित्रशास्त्रीय पूर्ति-संदर्भ से जुड़ी है।
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: उसके नाम में
  rationale: यह यीशु के व्यक्तित्व और अधिकार के आधार पर की जाने वाली घोषणा को व्यक्त करता है; हिन्दी में यह स्वाभाविक बाइबलीय प्रयोग है।
- source_word: μετάνοιαν
  choice: मन फिराव
  rationale: यह केवल विचार बदलने तक सीमित नहीं, बल्कि मनुष्य के भीतर और जीवन की दिशा में परमेश्वर की ओर मुड़ने का भाव व्यक्त करता है।
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा के लिए
  rationale: यह मुख्य पाठ में मन फिराव और पाप-क्षमा के निकट संबंध को सहज रूप से व्यक्त करता है, पर यूनानी की समन्वयी सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰς πάντα τὰ ἔθνη
  choice: सब जातियों में
  rationale: यह विश्वव्यापी विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है; ἔθνη का अर्थ कुछ प्रसंगों में गैर-यहूदी भी हो सकता है।
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: यरूशलेम से आरम्भ करके
  rationale: यह घोषणा के आरम्भ-बिंदु को स्पष्ट करता है और ἀπό की दिशात्मक बारीकी बनाए रखता है।
theological_decisions:
- issue: घोषणा में मन फिराव और क्षमा का संबंध
  choice: पापों की क्षमा के लिए मन फिराव
  alternative: मन फिराव और पापों की क्षमा
  rationale: मुख्य पाठ दोनों के निकट संबंध को व्यक्त करता है, लेकिन उद्धार-क्रम का अतिरिक्त सिद्धान्त नहीं जोड़ता; यूनानी में दोनों को प्रचार की समन्वित विषय-वस्तु मानने की सम्भावना पादटिप्पणी में दी गई है।
- issue: ἔθνη का आशय
  choice: सब जातियों
  alternative: सब गैर-यहूदियों
  rationale: पुनरुत्थान के बाद की इस आज्ञा में विश्वव्यापी जनसमूह अभिप्रेत हैं; यह चयन अर्थ को केवल गैर-यहूदियों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। “मन फिराव” धार्मिक रूप से परिचित होते हुए भी μετάνοια के दिशा-परिवर्तन के भाव को “मन बदलना” से अधिक समग्र रूप में व्यक्त करता है।
