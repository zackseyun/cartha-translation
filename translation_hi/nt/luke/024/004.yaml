source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वे इस बात को लेकर असमंजस में थीं, तो देखो, चकाचौंध कर देने वाले वस्त्र[a] पहने दो पुरुष उनके पास आ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “बिजली के समान चमकते वस्त्र में।”
    reason: मूल यूनानी में बिजली-जैसी चमक का सजीव बिंब है; मुख्य पाठ की सहज अभिव्यक्ति के साथ उस बिंब को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: लूका की घटना-परिचायक कथन-शैली को सहज और गैर-पुरातन हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: जब वे ... असमंजस में थीं
  rationale: ἐν के साथ प्रयुक्त articular infinitive का कालगत अर्थ ‘जब’ से व्यक्त होता है; ἀπορέω केवल आश्चर्य नहीं, बल्कि समझ न आने और दुविधा की दशा बताता है।
- source_word: περὶ τούτου
  choice: इस बात को लेकर
  rationale: यह पिछले प्रसंग की ओर संकेत करने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: अचानक सामने आए घटनाक्रम की ओर ध्यान खींचने वाले यूनानी discourse marker की सजीवता बनाए रखता है।
- source_word: ἄνδρες δύο
  choice: दो पुरुष
  rationale: इस पद में आकृतियों को सीधे ‘पुरुष’ कहा गया है; निकटवर्ती प्रसंग के आधार पर उन्हें पहले ही ‘स्वर्गदूत’ कहना पाठ से अधिक व्याख्यात्मक होता।
- source_word: ἐπέστησαν αὐταῖς
  choice: उनके पास आ खड़े हुए
  rationale: निकट आकर या अचानक पास उपस्थित होकर खड़े होने का स्थानगत और आकस्मिक भाव दोनों सहज हिन्दी में व्यक्त होते हैं।
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: चकाचौंध कर देने वाले वस्त्र पहने
  rationale: मुख्य पाठ में तेज, असाधारण चमक को स्वाभाविक हिन्दी में व्यक्त करता है; मूल के बिजली-जैसे चमकने वाले बिंब को पादटिप्पणी में स्पष्ट रखा गया है।
theological_decisions:
- issue: दो आकृतियों की पहचान
  choice: मुख्य पाठ में ‘दो पुरुष’
  alternative: दो स्वर्गदूत
  rationale: यद्यपि व्यापक प्रसंग उन्हें स्वर्गीय संदेशवाहक समझने का आधार देता है, इस पद का यूनानी पाठ उन्हें ‘दो पुरुष’ के रूप में प्रस्तुत करता है। अनुवाद निकटतम पाठ को बनाए रखता है और पहचान को प्रसंग पर छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘देखो’ को जानबूझकर रखा गया है ताकि मूल का ध्यानाकर्षक कथात्मक संकेत बना रहे।
