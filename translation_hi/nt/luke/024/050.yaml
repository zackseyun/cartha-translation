  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: hi
  text: फिर वह उन्हें बाहर बैतनियाह के पास तक ले गया और अपने हाथ उठाकर उन्हें आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: ले गया
  rationale: ἐξάγω में बाहर ले जाने का भाव है। हिन्दी में प्रसंग और गंतव्य के साथ ‘ले गया’ स्वाभाविक है; ‘बाहर’ जोड़ना यहाँ आवश्यक नहीं, क्योंकि नगर से निकलने का भाव आगे के दिशासूचक वाक्यांश से स्पष्ट है।
- source_word: δὲ
  choice: फिर
  rationale: यहाँ δέ विरोध नहीं, बल्कि कथा की अगली घटना की ओर संक्रमण दिखाता है; ‘फिर’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: ἕως πρὸς Βηθανίαν
  choice: बैतनियाह की ओर दूर तक
  rationale: ἕως और πρός का संयुक्त प्रयोग गंतव्य की दिशा तथा वहाँ तक पहुँचने/उसके निकट जाने की सीमा—दोनों का संकेत देता है। यह अनुवाद असामान्य यूनानी अभिव्यक्ति की कुछ पूर्णता बनाए रखता है, जबकि पादटिप्पणी अधिक सहज विकल्प देती है।
- source_word: Βηθανίαν
  choice: बैतनियाह
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: अपने हाथ उठाकर
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी संयुक्त क्रिया से व्यक्त किया गया है। बहुवचन ‘हाथ’ आशीष देने की दृश्य मुद्रा सुरक्षित रखता है।
- source_word: εὐλόγησεν αὐτούς
  choice: उन्हें आशीष दी
  rationale: εὐλογέω यहाँ शिष्यों को आशीष देने के कार्य को बताता है। ‘आशीष दी’ मानक, स्पष्ट और धार्मिक अर्थ को अनावश्यक रूप से विस्तृत न करने वाला हिन्दी प्रयोग है।
theological_decisions:
- issue: यीशु द्वारा शिष्यों को आशीष देने के कार्य का स्वरूप
  choice: सरल कथन ‘उन्हें आशीष दी’ रखा गया।
  alternative: ‘उन पर आशीष का वचन कहा’ या किसी याजकीय/अनुष्ठानिक सूत्र के रूप में विस्तार करना।
  rationale: मूल पाठ उठे हुए हाथों के साथ आशीष देने का कार्य बताता है, पर उसकी कोई निश्चित अनुष्ठानिक या बाद की कलीसियाई व्याख्या नहीं करता। सरल अभिव्यक्ति उसी सीमा को बनाए रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बैतनियाह की ओर दूर तक’ मूल की दिशात्मक और सीमासूचक अस्पष्टता को कुछ हद तक बनाए रखता है; पादटिप्पणी सामान्य वैकल्पिक अर्थ स्पष्ट करती है।
