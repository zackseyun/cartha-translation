revisions:
- from: फिर वह उन्हें बैतनियाह की ओर दूर तक[a] ले गया और अपने हाथ उठाकर उन्हें आशीष दी।
  to: फिर वह उन्हें बाहर बैतनियाह के पास तक ले गया और अपने हाथ उठाकर उन्हें आशीर्वाद दिया।
  rationale: The revision replaces an unnatural destination phrase with idiomatic Hindi that reflects the Greek expression’s directional and limiting nuance, restores the outward sense of ἐξήγαγεν, and uses the standard expression for an act of blessing. The footnote preserves the source expression’s ambiguity and supplies the principal alternatives without overstating a disputed spatial precision.
