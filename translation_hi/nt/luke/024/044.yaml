id: LUK.24.44
reference: Luke 24:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: hi
  text: 'फिर उसने उनसे कहा, “ये मेरी वे बातें हैं जो मैंने तुमसे तब कही थीं, जब मैं अब भी तुम्हारे साथ था: मेरे विषय में[c] मूसा की व्यवस्था, भविष्यद्वक्ताओं और भजनों[b] में जो कुछ लिखा है[a], वह सब अवश्य पूरा होना चाहिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लिखी हुई सभी बातें।”
    reason: lexical_alternative
  - marker: b
    text: “मूसा की व्यवस्था, भविष्यद्वक्ता और भजन” संभवतः इस्राएल के शास्त्रों के प्रमुख विभागों की ओर संकेत करते हैं। “भजन” से विशेष रूप से भजन-संग्रह या अधिक व्यापक रूप से “लेखों” का संकेत हो सकता है।
    reason: cultural_note
  - marker: c
    text: या, “मेरे बारे में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: फिर उसने उनसे कहा
  rationale: δέ कथा को हल्के संयोजक के रूप में आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी प्रवाह देता है, और πρὸς αὐτούς का सीधा अर्थ ‘उनसे’ है।
- source_word: Οὗτοι οἱ λόγοι μου οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: मैंने तुमसे जो बातें कही थीं, वे यही हैं
  rationale: हिन्दी में संबंधवाचक वाक्य को पहले रखकर यह रचना अधिक स्वाभाविक बनती है। λόγοι के लिए ‘बातें’ प्रसंगानुकूल है और ‘वे यही हैं’ संकेतवाचक बल को बनाए रखता है।
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: जब मैं अभी तुम्हारे साथ था
  rationale: कालसूचक आशय को स्पष्ट रखते हुए ἔτι को ‘अभी’ से व्यक्त किया गया है। यह पुनरुत्थान के बाद यीशु की वर्तमान उपस्थिति और उनकी पहले की संगति के बीच पाठ में मौजूद तनाव को मिटाता नहीं है।
- source_word: δεῖ πληρωθῆναι
  choice: अवश्य पूरा होना चाहिए
  rationale: δεῖ की आवश्यकता और πληρωθῆναι के शास्त्रीय पूर्ण होने—दोनों को व्यक्त करता है; केवल ‘सच होना’ जैसी संकुचित व्याख्या से बचता है।
- source_word: πάντα τὰ γεγραμμένα
  choice: जो कुछ लिखा है, वह सब
  rationale: यह neuter plural अभिव्यक्ति लिखी हुई बातों को समग्र रूप से समेटती है। हिन्दी में ‘जो कुछ…वह सब’ स्वाभाविक है और πάντα के व्यापक बल को बनाए रखता है।
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: मूसा की व्यवस्था, भविष्यद्वक्ताओं और भजनों में
  rationale: तीनों शास्त्रीय समूहों को बिना अतिरिक्त व्याख्या मुख्य पाठ में रखा गया है। ‘मूसा की व्यवस्था’ मूल के संबंधकारक विन्यास को स्पष्ट रूप में व्यक्त करता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: περί के संबंधसूचक अर्थ को dignified, सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘मेरे बारे में’ भी संभव है।
theological_decisions:
- issue: शास्त्र के पूरा होने की आवश्यकता
  choice: ‘अवश्य पूरा होना चाहिए’
  alternative: ‘पूरा होना था’ या ‘सच होना ही था’
  rationale: यह δεῖ की दैवी आवश्यकता का बल बनाए रखता है, पर भविष्यवाणी किस रीति से पूरी होती है, इसका कोई अतिरिक्त सिद्धान्त पद में नहीं जोड़ता।
- issue: ‘मूसा की व्यवस्था, भविष्यद्वक्ता और भजन’ की पहचान
  choice: इन्हें नामित शास्त्रीय समूहों के रूप में अनूदित किया गया है और व्यापक पहचान को पादटिप्पणी में खुला रखा गया है।
  alternative: ‘भजनों’ को सीधे ‘लेखों’ से बदल देना या तीनों को स्पष्ट तकनीकी कैननिक विभाग घोषित करना
  rationale: शब्दावली इस्राएल के शास्त्रों के प्रमुख विभागों की ओर संकेत कर सकती है, पर ψαλμοῖς केवल भजन-संग्रह को भी सूचित कर सकता है; मुख्य पाठ इस प्रश्न को अनावश्यक रूप से तय नहीं करता।
- issue: पुनरुत्थान के बाद ‘जब मैं अभी तुम्हारे साथ था’
  choice: ἔτι को स्पष्ट रूप से ‘अभी’ से व्यक्त किया गया है।
  alternative: केवल ‘जब मैं तुम्हारे साथ था’
  rationale: मूल में ‘अब भी/अभी’ का तत्व मौजूद है। उसे हटाने से पद की समय-संबंधी और धर्मवैचारिक तान घट सकती है, इसलिए उसे बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। सर्वनाम ‘तुम’ शिष्य-समूह को संबोधन के स्वाभाविक बहुवचन रूप में रखा गया है। वाक्य-विन्यास को हिन्दी की सहजता के लिए पुनर्गठित किया गया है, पर मूल के संकेत, आवश्यकता और संभावित शास्त्रीय त्रिविभाजन को सुरक्षित रखा गया है।
