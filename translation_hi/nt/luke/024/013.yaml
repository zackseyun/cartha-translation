id: LUK.24.13
reference: Luke 24:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: hi
  text: और देखो, उसी दिन उनमें से दो जन यरूशलेम से साठ स्टेडियम दूर एक गाँव की ओर जा रहे थे, जिसका नाम इम्माऊस था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्टेडियम दूरी की एक प्राचीन इकाई थी; साठ स्टेडियम लगभग 11 किलोमीटर के बराबर हैं।
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: और देखो
  rationale: लूका के ध्यान आकर्षित करने वाले कथात्मक संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: δύο ἐξ αὐτῶν
  choice: उनमें से दो जन
  rationale: अंशवाचक अभिव्यक्ति को सहज रूप से प्रस्तुत करता है और बड़े समूह की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: उसी दिन
  rationale: αὐτῇ से आए बल को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἦσαν πορευόμενοι
  choice: जा रहे थे
  rationale: परिप्रयुक्त अपूर्णकाल की जारी गति को सामान्य हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: εἰς κώμην
  choice: एक गाँव की ओर
  rationale: κώμη को सही सामाजिक-भौगोलिक स्तर पर 'गाँव' कहता है; 'की ओर' उस समय जारी यात्रा को दर्शाता है।
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: यरूशलेम से साठ स्टेडियम दूर
  rationale: मूल प्राचीन माप को मुख्य पाठ में सुरक्षित रखता है; आधुनिक अनुमान पादटिप्पणी में दिया गया है।
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: जिसका नाम इम्माऊस था
  rationale: यूनानी संबंधवाचक नाम-संरचना को निकटता से और फिर भी स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और स्रोत के निकट रखी गई है। 'देखो' ध्यानाकर्षक संकेत को बनाए रखता है, जबकि प्राचीन दूरी की इकाई को समझाने के लिए पादटिप्पणी दी गई है।
