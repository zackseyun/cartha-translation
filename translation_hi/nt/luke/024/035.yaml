base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: hi
  text: और वे स्वयं रास्ते में हुई बातें बता रहे थे, और यह भी कि रोटी तोड़ने के समय[b] वह उन्हें कैसे पहचान में आया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन्हें प्रकट किया गया था।” यूनानी में क्रिया कर्मवाच्य है; इसका आशय यह हो सकता है कि उन्होंने उसे पहचाना, या यह कि वह उन्हें प्रकट किया गया।
    reason: alternative_reading
  - marker: b
    text: या, “रोटी तोड़ने में।” यूनानी पदबंध अधिक शाब्दिक रूप से ऐसा है; प्रसंग में यह उसी विशेष भोजन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: स्पष्ट सर्वनाम का बल बनाए रखता है और बताता है कि अब वही दोनों शिष्य अपना वृत्तांत सुना रहे थे।
- source_word: ἐξηγοῦντο
  choice: बता रहे थे
  rationale: अपूर्णकाल की जारी क्रिया और घटनाओं का वृत्तांत सुनाने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: रास्ते में हुई बातें
  rationale: यूनानी पदबंध संक्षिप्त है; ‘हुई बातें’ उसके प्रसंगगत आशय को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना नई घटना जोड़े।
- source_word: ὡς
  choice: कैसे
  rationale: यह उनके वृत्तांत की विषयवस्तु और पहचान होने की रीति दोनों का परिचय देता है।
- source_word: ἐγνώσθη αὐτοῖς
  choice: वह उन्हें पहचान में आया था
  rationale: यह स्वाभाविक हिन्दी प्रयोग पहचान के घटित होने का भाव रखता है और उसे केवल शिष्यों की सक्रिय उपलब्धि के रूप में प्रस्तुत नहीं करता।
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: रोटी तोड़ने के समय
  rationale: विशिष्ट भोजन-दृश्य में रोटी तोड़ने की क्रिया और उस अवसर को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐγνώσθη में मानवीय पहचान और किसी के द्वारा प्रकट किए जाने के बीच निहित तनाव
  choice: वह उन्हें पहचान में आया था
  alternative: उन्होंने उसे पहचान लिया था; वह उन पर प्रकट किया गया था
  rationale: चुना हुआ वाक्यांश हिन्दी में स्वाभाविक रहते हुए पहचान के घटित होने का भाव देता है। यह न तो केवल मानवीय बोध पर जोर देता है, न ही यूनानी पाठ से अधिक स्पष्ट दिव्य कर्ता जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वे स्वयं’ मूल के बल को, ‘बता रहे थे’ जारी वृत्तांत को, और ‘पहचान में आया’ कर्मवाच्य की वास्तविक अस्पष्टता को यथासंभव सुरक्षित रखता है।
