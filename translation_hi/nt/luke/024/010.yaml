reference: Luke 24:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: hi
  text: वे स्त्रियाँ थीं—मरियम मगदलीनी, योअन्ना, याकूब की माता मरियम[a], और उनके साथ की अन्य स्त्रियाँ। वे ये बातें प्रेरितों को बता रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “याकूब की मरियम” है। संभवतः इसका अर्थ “याकूब की माता मरियम” है, हालाँकि “याकूब की पत्नी मरियम” भी संभव है।
    reason: मूल यूनानी में पारिवारिक संबंध स्पष्ट नहीं है।
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: वे स्त्रियाँ थीं
  rationale: बहुवचन अपूर्णकाल पहले उल्लिखित स्त्रियों की पहचान कराता है। हिन्दी में संदर्भित संज्ञा ‘स्त्रियाँ’ को स्पष्ट करना स्वाभाविक है; δέ के हल्के संक्रमण को अलग, भारी संयोजक से व्यक्त करना आवश्यक नहीं।
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: मरियम मगदलीनी
  rationale: नाम और स्थान-सूचक उपाधि का प्रचलित तथा सहज हिन्दी रूप।
- source_word: Ἰωάννα
  choice: योअन्ना
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Μαρία ἡ Ἰακώβου
  choice: याकूब की माता मरियम[a]
  rationale: संक्षिप्त संबंधकारक पदबंध में संबंध स्पष्ट नहीं किया गया है; सुसमाचारों की नामकरण-रीति में ‘याकूब की माता’ सबसे संभावित अर्थ है, जबकि मूल की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: उनके साथ की दूसरी स्त्रियाँ
  rationale: स्त्रीलिंग बहुवचन विशेषण में निहित संज्ञा को हिन्दी में ‘स्त्रियाँ’ कहकर स्पष्ट किया गया है।
- source_word: ἔλεγον
  choice: बता रही थीं
  rationale: अपूर्णकाल की जारी या बार-बार होने वाली क्रिया को हिन्दी की अपूर्ण भूतकालीन अभिव्यक्ति सुरक्षित रखती है।
- source_word: πρὸς τοὺς ἀποστόλους
  choice: प्रेरितों को
  rationale: ἀπόστολος के लिए स्थापित और संदर्भानुकूल हिन्दी शब्द ‘प्रेरित’ है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पहले बताए गए समाचार और घटनाओं की ओर लौटता है।
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου में मरियम और याकूब के संबंध की पहचान
  choice: याकूब की माता मरियम
  alternative: याकूब की मरियम; अथवा याकूब की पत्नी मरियम
  rationale: यूनानी में संबंधकारक संक्षिप्त और वास्तविक रूप से अस्पष्ट है। नामकरण की सुसमाचारीय रीति में माता का अर्थ अधिक संभावित और हिन्दी में अधिक स्पष्ट है, पर पत्नी होने की संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। पहचान-सूची को दीर्घ विराम से स्वाभाविक बनाया गया है और ἔλεγον के अपूर्ण पक्ष को ‘बता रही थीं’ से व्यक्त किया गया है।
