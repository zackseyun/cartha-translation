  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: hi
  text: जब वे बातचीत और विचार-विमर्श[a] कर रहे थे, तब ऐसा हुआ कि यीशु स्वयं उनके पास आए और उनके साथ चल रहे थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहस” अथवा “वाद-विवाद”; यूनानी शब्द अधिक तीखी चर्चा का संकेत भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके निकट आकर उनके साथ चल रहे थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: तब ऐसा हुआ कि
  rationale: लूका की कथात्मक संक्रमण-शैली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना पुराने मुहावरे का सहारा लिए।
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: जब वे आपस में बातचीत ... कर रहे थे
  rationale: ἐν के साथ प्रयुक्त articular infinitive का कालवाचक अर्थ ‘जब/जिस समय’ है; ‘बातचीत’ सामान्य संवाद के भाव को सहज हिन्दी में रखता है।
- source_word: συζητεῖν
  choice: विचार-विमर्श
  rationale: यह शब्द मिलकर चर्चा करने से लेकर बहस करने तक का अर्थ दे सकता है। ‘विचार-विमर्श’ गंभीर चर्चा को व्यक्त करता है, पर अनावश्यक रूप से झगड़े का भाव नहीं जोड़ता।
- source_word: αὐτὸς Ἰησοῦς
  choice: यीशु स्वयं
  rationale: αὐτός से यीशु की पहचान पर दिए गए व्याकरणिक बल को सुरक्षित रखा गया है।
- source_word: ἐγγίσας
  choice: उनके पास आए
  rationale: यह उनके निकट आने की गति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνεπορεύετο
  choice: उनके साथ-साथ चलने लगे
  rationale: अपूर्ण भूतकाल ongoing साथ चलने को दर्शाता है; ‘चलने लगे’ प्रसंग में उस आरम्भ हुई और जारी रही क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... तब ... और
  rationale: दोनों गतिविधियों तथा आगे की घटनाओं के संयोजन को हिन्दी की स्वाभाविक वाक्य-रचना में बनाए रखा गया है।
theological_decisions:
- issue: पास आने वाले व्यक्ति की पहचान पर कथात्मक बल
  choice: यीशु स्वयं
  alternative: यीशु
  rationale: मूल पाठ में αὐτός नाम के साथ बलसूचक है। ‘स्वयं’ इस व्याकरणिक बल को रखता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विचार-विमर्श’ गंभीरता बनाए रखता है, जबकि पादटिप्पणी मूल यूनानी में सम्भव अधिक तीखे अर्थ को सुरक्षित करती है।
