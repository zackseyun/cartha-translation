source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: hi
  text: उसने उनसे कहा, “कौन-सी बातें?” उन्होंने उससे कहा, “यीशु नासरी[a] के विषय में बातें। वह एक पुरुष, एक भविष्यद्वक्ता था[b], जो परमेश्वर और सारी जनता के सामने कर्म और वचन में सामर्थी था,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नासरत के यीशु”; यूनानी में “यीशु नासरी।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “जो एक पुरुष, एक भविष्यद्वक्ता बना”; यहाँ यूनानी क्रिया का स्वाभाविक अर्थ “था” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: कौन-सी बातें?
  rationale: नपुंसकलिंग बहुवचन प्रश्नवाचक रूप को स्वाभाविक हिन्दी में स्पष्ट रखता है और पहले कही गई घटनाओं की ओर संकेत करता है।
- source_word: Τὰ περὶ Ἰησοῦ
  choice: यीशु ... के विषय की बातें
  rationale: περί पदबंध के अर्थ को बिना ‘जो कुछ हुआ’ जैसी अतिरिक्त घटना-भाषा जोड़े व्यक्त करता है।
- source_word: Ναζαρηνοῦ
  choice: नासरी
  rationale: यूनानी विशेषणात्मक संबोधन ‘नाज़री’ को हिन्दी बाइबलीय प्रयोग में प्रचलित और संक्षिप्त रूप से दर्शाता है; ‘नासरत का’ अर्थ-स्पष्टीकरण को पादटिप्पणी में रखा गया है।
- source_word: ἐγένετο
  choice: था
  rationale: इस वर्णनात्मक संदर्भ में γίνομαι का स्वाभाविक हिन्दी अर्थ ‘था’ है। शाब्दिक ‘बना’ यह भ्रामक संकेत दे सकता है कि वह पहले पुरुष या भविष्यद्वक्ता नहीं था।
- source_word: ἀνὴρ προφήτης
  choice: एक पुरुष था—एक भविष्यद्वक्ता
  rationale: ἀνήρ और προφήτης दोनों को स्पष्ट रखता है; डैश उनके समानाधिकरण संबंध को सहज हिन्दी में दिखाता है।
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: काम और वचन में सामर्थी
  rationale: कार्य तथा वाणी की युग्मित धारणा को गरिमापूर्ण, परिचित बाइबलीय हिन्दी में सुरक्षित रखता है।
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: परमेश्वर और सारी जनता के सामने
  rationale: ἐναντίον के उपस्थिति और दृष्टि में होने के भाव को संक्षिप्त रूप से व्यक्त करता है तथा ईश्वरीय और सार्वजनिक साक्ष्य दोनों बनाए रखता है।
theological_decisions:
- issue: यीशु के लिए ἀνὴρ का अनुवाद
  choice: एक पुरुष था—एक भविष्यद्वक्ता
  alternative: वह एक भविष्यद्वक्ता था
  rationale: वक्ताओं के प्रसंगगत वर्णन में यूनानी पाठ ἀνήρ को स्पष्ट रूप से रखता है। इसे छोड़ने के बजाय अनुवाद में बनाए रखा गया है, बिना इससे व्यापक मसीह-विज्ञान पर कोई अतिरिक्त निष्कर्ष थोपे।
- issue: ἐγένετο को अस्तित्वगत या आरंभसूचक ढंग से समझना
  choice: था
  alternative: बना / हो गया
  rationale: यहाँ क्रिया वर्णनात्मक रूप से कार्य करती है। ‘बना’ हिन्दी में अनुचित कालगत या अस्तित्वगत निष्कर्ष सुझा सकता है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘जनता’ λαός के सामूहिक सार्वजनिक अर्थ को व्यक्त करता है। ‘काम और वचन’ मूल के एकवचन युग्म को बनाए रखता है।
