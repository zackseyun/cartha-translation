  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: hi
  text: “कि मनुष्य के पुत्र को पापी मनुष्यों के हाथों में सौंपा जाना[a], क्रूस पर चढ़ाया जाना और तीसरे दिन जी उठना[b] अवश्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पापी मनुष्यों के हाथों में सौंप दिया जाना।”
    reason: lexical_alternative
  - marker: b
    text: या “उठना”; यूनानी क्रिया सक्रिय है, निष्क्रिय “जिलाया जाना” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: मुख्य पाठ में अलग से अनूदित नहीं
  rationale: यह वर्तमान कृदन्त पिछले पद के स्मरण-वाक्य से जुड़ा है। पद 7 को स्वतंत्र उद्धरण के रूप में देते समय हिन्दी में ‘कि’ अथवा ‘यह कहते हुए’ जोड़ना अस्वाभाविक होगा; वाक्य पिछले पद के ‘उसने तुमसे क्या कहा था’ का आशय पूरा करता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है और सुसमाचारों तथा दानिय्येल-संबंधी प्रतिध्वनि को सुरक्षित रखती है।
- source_word: ὅτι δεῖ
  choice: अवश्य है
  rationale: δεῖ केवल भविष्यवाणी नहीं, परमेश्वर की योजना से जुड़ी आवश्यकता व्यक्त करता है। हिन्दी में ‘अवश्य है’ इस बल को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: παραδοθῆναι
  choice: सौंपा जाना
  rationale: निष्क्रिय अनन्त क्रिया का अर्थ किसी के अधिकार में सौंप दिया जाना है। यह ‘विश्वासघात किया जाना’ से व्यापक है और केवल यहूदा के कार्य तक अर्थ सीमित नहीं करता।
- source_word: εἰς χεῖρας
  choice: हाथों में
  rationale: यह किसी के वश या अधिकार में दिए जाने का स्वाभाविक हिन्दी मुहावरा है और यूनानी बिंब भी बचाता है।
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: पापी मनुष्यों
  rationale: यह यूनानी संज्ञा और विशेषण दोनों को व्यक्त करता है। ‘पापियों’ भी संभव है, पर उसमें ἀνθρώπων का स्पष्ट तत्व लुप्त हो जाता है।
- source_word: σταυρωθῆναι
  choice: क्रूस पर चढ़ाया जाना
  rationale: यह निष्क्रिय अनन्त क्रिया और क्रूस-मृत्यु की विधि को सटीक, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: कालवाचक सम्प्रदान का स्वाभाविक हिन्दी रूप है; किसी अतिरिक्त व्याख्या की आवश्यकता नहीं।
- source_word: ἀναστῆναι
  choice: जी उठना
  rationale: यूनानी रूप सक्रिय है। ‘जी उठना’ पुनर्जीवन के प्रसंग में स्वाभाविक है और इसे निष्क्रिय ‘जिलाया जाना’ में नहीं बदलता।
theological_decisions:
- issue: यीशु की दुःखभोग-वाणी में δεῖ का बल
  choice: अवश्य है—दैवी योजना से जुड़ी आवश्यकता
  alternative: होगा—केवल भविष्य की घटना
  rationale: लूका में δεῖ प्रायः परमेश्वर की उद्धार-योजना की आवश्यक पूर्ति दर्शाता है। ‘अवश्य है’ इस अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: ἀναστῆναι की वाच्यता
  choice: जी उठना—सक्रिय
  alternative: जिलाया जाना—निष्क्रिय
  rationale: यहाँ यूनानी अनन्त क्रिया सक्रिय है। अन्य स्थानों पर निष्क्रिय पुनरुत्थान-भाषा धर्मवैज्ञानिक रूप से संगत हो सकती है, पर इस पद के व्याकरण को नहीं बदलना चाहिए।
- issue: ἀνθρώπων ἁμαρτωλῶν में लिंग और संदर्भ
  choice: पापी मनुष्यों
  alternative: पापी लोगों; पापियों
  rationale: ‘मनुष्यों’ मूल संज्ञा को स्पष्ट रखता है। हिन्दी में यह मानव व्यक्तियों के लिए सामान्य शब्द है; अनुवाद पाठ से आगे बढ़कर एजेंटों की पहचान या लिंग को अधिक विशिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और बोलचाल में बोधगम्य। पद को पिछले पद से चल रहे प्रत्यक्ष उद्धरण के रूप में रखा गया है। ‘सौंपा जाना’ और ‘हाथों में’ मूल के निष्क्रिय रूप तथा अधिकार-संबंधी बिंब को सुरक्षित रखते हैं।
