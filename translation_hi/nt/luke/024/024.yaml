language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: hi
  text: और हमारे साथियों में से कुछ कब्र पर गए और उन्होंने वहाँ वैसा ही पाया, जैसा स्त्रियों ने कहा था; पर उन्होंने उसे नहीं देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: गए
  rationale: यहाँ क्रिया कब्र की ओर जाने की साधारण कथात्मक गति बताती है; ‘गए’ स्वाभाविक और पर्याप्त है।
- source_word: τινες τῶν σὺν ἡμῖν
  choice: हमारे साथियों में से कुछ
  rationale: यह वाक्यांश वक्ताओं के साथ के लोगों में से एक अनिश्चित समूह को सूचित करता है। यह हिन्दी में सहज है और अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ἐπὶ τὸ μνημεῖον
  choice: कब्र पर
  rationale: पुनरुत्थान के इस प्रसंग में μνημεῖον यीशु के दफनाए जाने के स्थान को सूचित करता है; ‘कब्र’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: εὗρον
  choice: पाया
  rationale: सरल कथात्मक अर्थ ‘पाया’ है; इससे खोज या अन्वेषण का अतिरिक्त भाव नहीं जुड़ता।
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: सब कुछ वैसा ही ... जैसा स्त्रियों ने कहा था
  rationale: οὕτως καθὼς रिपोर्ट और मिली हुई स्थिति के बीच अनुरूपता व्यक्त करता है। ‘कहा था’ घटनाक्रम का क्रम स्पष्ट करता है; καί का योगात्मक बल तुलना में स्वाभाविक रूप से निहित है। ‘सब कुछ’ हिन्दी में εὗρον के निहित कर्म को सहज बनाता है, बिना किसी खास विवरण को जोड़े।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का संकेत यीशु की ओर है। ‘उसे’ मूल की सर्वनामिक संबद्धता बनाए रखता है और नाम को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: यह कब्र को कथन के अनुसार पाए जाने और यीशु को न देखने के बीच हल्का विरोध प्रकट करता है।
- source_word: οὐκ εἶδον
  choice: उन्होंने उसे नहीं देखा
  rationale: मूल क्रिया ὁράω का अर्थ ‘देखना’ है, ‘पाना’ नहीं। कर्ता वही पहले उल्लिखित साथी हैं।
theological_decisions:
- issue: पुनरुत्थान-वृत्तांत की शब्दावली
  choice: जाने वालों ने स्त्रियों के कथन के अनुरूप स्थिति पाई, पर स्वयं यीशु को नहीं देखा।
  alternative: अन्य सुसमाचार-वृत्तांतों के आधार पर कब्र की दशा या वहाँ उपस्थित व्यक्तियों का विवरण स्पष्ट करना।
  rationale: अनुवाद मूल यूनानी में उपस्थित कथात्मक भेद और तनाव को बनाए रखता है तथा समानांतर वृत्तांतों से कोई सामंजस्यकारी विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘हमारे साथियों में से कुछ’ मूल संरचना के निकट रहते हुए सामान्य पाठक के लिए स्वाभाविक है। किसी पादटिप्पणी की आवश्यकता नहीं है।
