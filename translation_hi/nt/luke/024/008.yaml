- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम का संदर्भ प्रसंग में यीशु से है, पर यूनानी पाठ केवल ‘उसकी’ कहता है; इसलिए अनुवाद भी उसी सर्वनामिक रूप को बनाए रखता है।
