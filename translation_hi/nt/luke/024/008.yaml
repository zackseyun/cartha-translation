  choice: उन्हें याद आईं
  rationale: यहाँ क्रिया का अर्थ सक्रिय रूप में ‘याद करना’ है। हिंदी में ‘उन्हें ... याद आईं’ स्वाभाविक और सीधा प्रयोग है।
- source_word: τῶν ῥημάτων
  choice: बातें
