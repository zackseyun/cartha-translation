lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ यूनानी की सरल कड़ी को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
- source_word: αὐτοὶ
  choice: वे
  rationale: यूनानी सर्वनाम स्पष्ट और कुछ बलयुक्त है, पर आधुनिक हिन्दी में ‘वे’ स्वाभाविक है; ‘वे स्वयं’ यहाँ अनावश्यक रूप से चिह्नित लगेगा।
- source_word: προσκυνήσαντες αὐτόν
  choice: उसे दण्डवत् करके
  rationale: कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘दण्डवत् करना’ προσκυνέω में निहित झुकने, श्रद्धा प्रकट करने और आराधनात्मक सम्मान की अर्थ-सीमा को हिन्दी में स्वाभाविक ढंग से खुला रखता है।
- source_word: ὑπέστρεψαν
  choice: लौट गए
  rationale: क्रिया का सीधा अर्थ लौटना है; ‘लौट गए’ आधुनिक हिन्दी कथन में सहज है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: ‘लौट गए’ के साथ गन्तव्य का ‘को’ अथवा ‘में’ हिन्दी में आवश्यक नहीं; नगर का नाम सीधे रखना स्वाभाविक है।
- source_word: μετὰ χαρᾶς μεγάλης
  choice: बड़े आनन्द के साथ
  rationale: यह χαρά संज्ञा और μεγάλη की तीव्रता—दोनों को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: जी उठे यीशु के प्रति προσκυνέω का अनुवाद
  choice: उसे दण्डवत् करके
  alternative: उसकी आराधना करके
  rationale: सन्दर्भ में आराधना का प्रबल भाव सम्भव है, पर यूनानी क्रिया शारीरिक रूप से झुककर श्रद्धा या सम्मान प्रकट करने की अर्थ-सीमा भी रखती है। ‘दण्डवत् करना’ इस वास्तविक अर्थगत विस्तार और मसीही महत्त्व—दोनों को बिना एक अर्थ को अनिवार्य बनाए सुरक्षित रखता है।
- issue: कोष्ठकित पाठ [προσκυνήσαντες αὐτόν]
  choice: मुख्य पाठ में रखा गया और पाठान्तर पादटिप्पणी में बताया गया
  alternative: वाक्यांश को मुख्य पाठ से छोड़ देना
  rationale: प्रदत्त आलोचनात्मक यूनानी पाठ में वाक्यांश उपस्थित है, पर उसकी पाठगत अनिश्चितता चिह्नित है; इसलिए उसे रखना और साक्ष्य की अनिश्चितता बताना पारदर्शी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण कथात्मक शैली। ‘आनन्द’ तथा ‘यरूशलेम’ जैसे प्रचलित बाइबलीय रूप रखे गए हैं; ‘दण्डवत्’ स्रोत की अर्थगत और धर्मवैचारिक अस्पष्टता को बनाए रखता है।
