    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: चौंक गए
  rationale: यह अचानक घबरा उठने या चौंक जाने का भाव व्यक्त करता है; आगे आए स्पष्ट भय के शब्द को दोहराए बिना तत्काल प्रतिक्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह यीशु के प्रकट होने और शिष्यों की प्रतिक्रिया के बीच हल्का विरोध अथवा कथात्मक मोड़ दिखाता है।
- source_word: ἔμφοβοι γενόμενοι
  choice: डर गए
  rationale: γενόμενοι के साथ यह भय की अवस्था में प्रवेश को व्यक्त करता है; ‘डर गए’ आधुनिक हिन्दी में इस आरंभिक भाव को सहजता से रखता है।
- source_word: ἐδόκουν
  choice: उन्हें लगा
  rationale: यह उनकी धारणा या समझ को दर्शाता है, न कि वास्तविकता को; अपूर्ण काल का जारी प्रभाव पूरे वाक्य से स्पष्ट है।
- source_word: πνεῦμα
  choice: किसी आत्मा
  rationale: ‘आत्मा’ πνεῦμα का सीधा और प्रसंगानुकूल समतुल्य है। ‘किसी’ हिन्दी में अनिश्चित संदर्भ को स्वाभाविक बनाता है।
- source_word: θεωρεῖν
  choice: देख रहे हैं
  rationale: वर्तमान infinitive की जारी दृश्य-अनुभूति को हिन्दी के प्रगतिशील रूप से व्यक्त किया गया है।
theological_decisions:
- issue: पुनरुत्थान के प्रकट होने के प्रसंग में πνεῦμα का अनुवाद
  choice: आत्मा
  alternative: भूत / प्रेत
  rationale: ‘आत्मा’ यूनानी शब्द के अधिक निकट है और लोककथात्मक धारणाएँ अनावश्यक रूप से नहीं जोड़ता। यह शिष्यों की भूलपूर्ण धारणा और आगे यीशु की देहधारी वास्तविकता के बीच कथात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। दो क्रमिक प्रतिक्रियाओं—चौंकना और डरना—को अलग रखा गया है, और ‘उन्हें लगा’ से उनकी धारणा की अनिश्चितता सुरक्षित रहती है।
