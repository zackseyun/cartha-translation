lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह हल्का संयोजक यहाँ यीशु की उपस्थिति और शिष्यों के उसे न पहचान पाने के बीच विरोध को व्यक्त करता है।
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτῶν
  choice: उनकी आँखें
  rationale: यूनानी की ठोस शारीरिक छवि को बनाए रखता है और अभिव्यक्ति को केवल ‘वे’ में अमूर्त नहीं करता।
- source_word: ἐκρατοῦντο
  choice: रोकी गई थीं
  rationale: निष्क्रिय क्रिया का रोके या थामे जाने का भाव बनाए रखता है, पर रोकने वाले कर्ता को नहीं बताता।
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: पहचानने से
  rationale: संदर्भ में ἐπιγινώσκω का अर्थ सामान्य रूप से जानना नहीं, बल्कि व्यक्ति को पहचानना है; यह पदबंध रुकावट के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: संदर्भ में यह यीशु की ओर संकेत करने वाला सीधा कर्म है।
theological_decisions:
- issue: उसे पहचानने से किसने रोका
  choice: 'निष्क्रिय रचना रखी गई: ‘उनकी आँखें उसे पहचानने से रोकी गई थीं।’'
  alternative: ‘परमेश्वर ने उनकी आँखों को उसे पहचानने नहीं दिया’ अथवा ‘वे उसे पहचान नहीं सके।’
  rationale: यूनानी पाठ कर्ता का नाम नहीं बताता। निष्क्रिय रचना उस अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखती है तथा न तो स्पष्ट रूप से दैवी कर्तृत्व जोड़ती है, न बाहरी रोक के भाव को केवल असमर्थता बना देती है।
