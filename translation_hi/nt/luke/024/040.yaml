lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य संयोजक के रूप में यह कथा के प्रवाह को बनाए रखता है और यूनानी से अधिक कालगत बल नहीं जोड़ता।
- source_word: τοῦτο εἰπὼν
  choice: यह कहने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और क्रम की दृष्टि से स्पष्ट है।
- source_word: ἔδειξεν
  choice: दिखाए
  rationale: यहाँ δείκνυμι का अर्थ किसी वस्तु को प्रत्यक्ष रूप से दिखाना है; ‘दिखाए’ सीधा और स्वाभाविक अनुवाद है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: हिन्दी में ‘दिखाना’ के साथ अप्रत्यक्ष कर्म को ‘उन्हें’ कहना स्वाभाविक है।
- source_word: τὰς χεῖρας
  choice: अपने हाथ
  rationale: यूनानी में निश्चित उपपद है, पर प्रसंग स्पष्ट करता है कि ये यीशु के अपने हाथ हैं; हिन्दी में निजवाचक ‘अपने’ स्वाभाविक है।
- source_word: τοὺς πόδας
  choice: पैर
  rationale: शारीरिक संदर्भ में πόδας का सामान्य आधुनिक हिन्दी समतुल्य ‘पैर’ है; ‘अपने’ का संबंध संयुक्त पद ‘हाथ और पैर’ दोनों से है।
theological_decisions:
- issue: पूरे वचन की पाठालोचनात्मक स्थिति
  choice: मुख्य पाठ में सम्मिलित कर पाठांतर की पाद-टिप्पणी देना
  alternative: वाक्य को मुख्य पाठ से छोड़ देना
  rationale: SBLGNT पूरे वाक्य को कोष्ठकों में रखकर उसके पाठ की महत्त्वपूर्ण अनिश्चितता दिखाता है। दिए गए स्रोत में वाक्य उपस्थित है, इसलिए उसका अनुवाद मुख्य पाठ में रखा गया है और पाद-टिप्पणी में अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह कहने के बाद’ कृदंत की पूर्वकालिकता स्पष्ट करता है, और ‘अपने हाथ और पैर’ हिन्दी की स्वाभाविक देह-संबंधी अभिव्यक्ति है।
