  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: hi
  text: वह यहाँ नहीं है, बल्कि जिलाया गया है[a]। याद करो कि जब वह गलील में ही था, तब उसने तुमसे क्या कहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जी उठा है।” यूनानी क्रिया कर्मवाच्य है—“जिलाया गया है”—हालाँकि पुनरुत्थान की घटना को हिन्दी में “जी उठा है” भी कहा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: वह यहाँ नहीं है
  rationale: यूनानी में कर्ता व्यक्त नहीं है, पर संदर्भ स्पष्ट रूप से यीशु की ओर संकेत करता है; स्वाभाविक हिन्दी में ‘वह’ आवश्यक है। ὧδε का सीधा स्थानवाचक अर्थ ‘यहाँ’ है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: 'यह पहले कथन के विपरीत वास्तविकता प्रस्तुत करता है: वह यहाँ नहीं है, बल्कि जिलाया गया है।'
- source_word: ἠγέρθη
  choice: जिलाया गया है
  rationale: ἐγείρω का यह अओरिस्ट कर्मवाच्य रूप है। ‘जिलाया गया है’ यूनानी कर्मवाच्य को बनाए रखता और निहित ईश्वरीय कर्तृत्व को बिना स्पष्ट कर्ता जोड़े रहने देता है।
- source_word: μνήσθητε
  choice: याद करो
  rationale: अओरिस्ट आज्ञार्थक का सीधा और स्वाभाविक बहुवचन सम्बोधन।
- source_word: ὡς
  choice: क्या
  rationale: इस प्रसंग में ὡς यीशु के कहे हुए कथन की विषयवस्तु की ओर ले जाता है; आधुनिक हिन्दी में ‘उसने तुमसे क्या कहा था’ ‘कैसे कहा था’ से अधिक स्वाभाविक है और कथन की रीति का अनावश्यक भाव नहीं देता।
- source_word: ἐλάλησεν ὑμῖν
  choice: उसने तुमसे ... कहा था
  rationale: λαλέω के सामान्य अर्थ ‘बोलना/कहना’ को यहाँ हिन्दी की स्वाभाविक कथन-रचना में व्यक्त किया गया है।
- source_word: ἔτι ὢν
  choice: जब वह ... ही था
  rationale: ἔτι का ‘अभी भी/ही’ भाव और ὢν की कालवाचक परिस्थिति हिन्दी के ‘जब...तब’ ढाँचे में स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: गलील में
  rationale: स्थानवाचक वाक्यांश का मानक हिन्दी रूप और प्रचलित स्थान-नाम।
theological_decisions:
- issue: पुनरुत्थान की क्रिया ἠγέρθη का अनुवाद
  choice: जिलाया गया है
  alternative: जी उठा है / उठाया गया है
  rationale: मुख्य पाठ में कर्मवाच्य बनाए रखने से यूनानी रूप और निहित ईश्वरीय कर्तृत्व सुरक्षित रहते हैं। ‘जी उठा है’ घटना को स्वाभाविक रूप से व्यक्त करता है, पर कर्मवाच्य को मिटा देता है; ‘उठाया गया है’ हिन्दी में केवल शारीरिक रूप से उठाने का भ्रम पैदा कर सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जिलाया गया है’ सामान्य ‘जी उठा है’ की तुलना में कुछ अधिक औपचारिक है, पर मूल यूनानी के कर्मवाच्य और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है। स्त्रियों के बहुवचन सम्बोधन के लिए ‘याद करो’ प्रयुक्त है।
