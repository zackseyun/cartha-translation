lexical_decisions:
- source_word: οἱ δὲ
  choice: तब उन्होंने
  rationale: οἱ यहाँ संज्ञात्मक रूप से पहले उल्लिखित एकत्र लोगों की ओर संकेत करता है, और δέ हल्का कथात्मक संयोजक है। ‘तब उन्होंने’ हिन्दी में प्रसंग की स्वाभाविक निरंतरता व्यक्त करता है, बिना अनावश्यक विरोध दिखाए।
- source_word: ἐπέδωκαν
  choice: दिया
  rationale: ἐπιδίδωμι का यह रूप इस प्रसंग में ‘देना/सौंपना’ दर्शाता है। ‘दिया’ सबसे सहज और सीधा हिन्दी रूप है।
- source_word: αὐτῷ
  choice: उसे
  rationale: दत्तिव अप्रत्यक्ष कर्म को हिन्दी में ‘उसे’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: भुनी हुई मछली का एक टुकड़ा
  rationale: μέρος प्रधान संज्ञा ‘टुकड़ा/भाग’ है और ἰχθύος ὀπτοῦ बताता है कि वह भुनी हुई मछली का था। यह रूप मूल संरचना और सामान्य हिन्दी दोनों के अनुकूल है।
- source_word: ὀπτοῦ
  choice: भुनी हुई
  rationale: ὀπτός आग या ताप पर भूनकर पकाए भोजन को दर्शाता है। ‘भुनी हुई’ आधुनिक हिन्दी में सटीक, स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: लूका 24:42 का पाठ-रूप
  choice: SBLGNT के पाठ के अनुसार केवल ‘भुनी हुई मछली का एक टुकड़ा’ मुख्य पाठ में रखा गया है।
  alternative: कुछ बाद की पांडुलिपियाँ ‘और मधु के छत्ते में से कुछ’ जोड़ती हैं।
  rationale: दिया गया आलोचनात्मक यूनानी पाठ μέρος पर समाप्त होता है और उसमें लंबा पाठ नहीं है। पारदर्शिता के लिए बाद के पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। ‘भुनी हुई मछली’ सामान्य पाठक के लिए स्पष्ट है और यूनानी पाक-संबंधी अर्थ को पर्याप्त सटीकता से व्यक्त करती है।
