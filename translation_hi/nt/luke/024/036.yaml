  choice: प्रदत्त SBLGNT के अनुसार इसे मुख्य पाठ से बाहर रखा गया है।
  alternative: 'कुछ पांडुलिपियों के अनुसार जोड़ें: ‘और उसने उनसे कहा, “तुम्हें शांति मिले।”’'
  rationale: दिया गया यूनानी स्रोत ‘उनके बीच’ पर समाप्त होता है। इसलिए मुख्य पाठ उसी का अनुसरण करता है; महत्वपूर्ण वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
