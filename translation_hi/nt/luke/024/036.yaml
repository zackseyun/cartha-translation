lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछली चर्चा की बातों की ओर संकेत करता है; हिन्दी में ‘ये बातें’ बहुवचन और प्रसंग-संबंध दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: जब वे ... कह ही रहे थे, तब
  rationale: वर्तमान कृदन्त वाला संबंधकारक निरपेक्ष-वाक्यांश उसी समय चल रही बातचीत को दर्शाता है। ‘कह ही रहे थे’ जारी क्रिया और उसी दौरान हुई अगली घटना को व्यक्त करता है; ‘तब’ मुख्य घटना से सहज संबंध जोड़ता है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: स्पष्ट सर्वनाम यहाँ बलाघात लिए हुए है। ‘वह स्वयं’ उस व्यक्ति की प्रत्यक्ष उपस्थिति पर दिए गए जोर को सुरक्षित रखता है।
- source_word: ἔστη
  choice: आ खड़ा हुआ
  rationale: ἵστημι का यह रूप खड़े होने या खड़ा हो जाने को बताता है। हिन्दी में ‘आ खड़ा हुआ’ आकस्मिक रूप से समूह के बीच उपस्थित होकर खड़े होने का स्वाभाविक वर्णन है, यद्यपि ‘आ’ यूनानी में अलग गति-क्रिया के रूप में व्यक्त नहीं है।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच
  rationale: यह पद समूह के मध्य उपस्थित होने का अर्थ देता है। ‘उनके बीच’ आधुनिक हिन्दी में सहज और सटीक है।
