  verdict: revise
  source_fidelity: The draft correctly conveys the connective continuation, the speakers’ identification in “our,” the judicial handing over, and the Greek’s direct attribution of crucifixion to the chief priests and rulers. However, “मृत्युदण्ड दिए जाने के लिए” is needlessly periphrastic and can suggest that the handing over itself was for the act of pronouncing the sentence rather than succinctly expressing εἰς κρίμα θανάτου.
  naturalness: “मृत्युदण्ड के लिए सौंप दिया” is more idiomatic, concise modern Hindi while retaining the judicial sense. “प्रधान याजक,” “शासक,” and “क्रूस पर चढ़ाया” are appropriate established biblical-register terms.
  terminology: Retain “प्रधान याजक,” not “महायाजक,” because ἀρχιερεῖς is plural and refers to the chief-priestly leadership. Retain direct “क्रूस पर चढ़ाया,” since the active Greek wording attributes responsibility directly; an alternative footnote may note “चढ़वा दिया” without replacing the text.
  issues:
  - severity: low
    issue: The phrase “मृत्युदण्ड दिए जाने के लिए” is awkwardly expanded.
    rationale: It represents the judicial outcome but is less natural than “मृत्युदण्ड के लिए” and slightly over-specifies the process of sentencing.
  - severity: low
    issue: The sole existing footnote is attached at the end of the whole sentence although it concerns only the final verb.
    rationale: Placing the anchor immediately after “चढ़ाया” makes its scope clear. A separate anchor after “मृत्युदण्ड” preserves the English audit trail’s lexical alternative for εἰς κρίμα θανάτου.
