  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: hi
  text: और यह भी कि हमारे प्रधान याजकों और शासकों ने उसे मृत्युदण्ड के लिए[a] सौंप दिया और उसे क्रूस पर चढ़ाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्युदण्ड की सज़ा के लिए” या “मृत्युदण्ड का न्यायिक निर्णय पाने के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे क्रूस पर चढ़वा दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: और यह भी कि
  rationale: पिछले कथन को आगे बढ़ाने वाला संयोजक भाव व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρέδωκαν
  choice: सौंप दिया
  rationale: न्यायिक अधिकारियों के हाथ में कर देने का अर्थ रखता है; यहाँ ‘विश्वासघात किया’ जैसा संकरा अर्थ आवश्यक नहीं है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: दूसरे मन्दिर काल के महायाजकीय नेतृत्व-वर्ग के लिए हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रचलित पद है।
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: हमारे ... शासकों
  rationale: राजकीय और न्यायिक अधिकार रखने वाले अगुओं का भाव देता है तथा ἡμῶν को सुरक्षित रखता है।
- source_word: εἰς κρίμα θανάτου
  choice: मृत्युदण्ड दिए जाने के लिए
  rationale: κρίμα के न्यायिक निर्णय और θανάτου के मृत्यु-विषयक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσταύρωσαν αὐτόν
  choice: उसे क्रूस पर चढ़ाया
  rationale: यूनानी सक्रिय क्रिया द्वारा नेतृत्व पर सीधे रखी गई जिम्मेदारी को बनाए रखता है, बिना क्रियान्वयन की ऐतिहासिक मध्यस्थता पाठ में जोड़े।
theological_decisions:
- issue: यीशु के क्रूस पर चढ़ाए जाने में कर्तृत्व
  choice: उसे क्रूस पर चढ़ाया
  alternative: उसे क्रूस पर चढ़वा दिया
  rationale: यूनानी में प्रधान याजक और शासक सक्रिय बहुवचन क्रिया के कर्ता हैं। सीधा अनुवाद उनकी उत्तरदायित्वपूर्ण भूमिका बनाए रखता है; ‘चढ़वा दिया’ रोमी क्रियान्वयन को स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘प्रधान याजक’ और ‘क्रूस’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य पिछले पद पर निर्भर कथन की निरन्तरता को ‘और यह भी कि’ से दर्शाता है।
