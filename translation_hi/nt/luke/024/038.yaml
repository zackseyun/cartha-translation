id: LUK.24.38
reference: Luke 24:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: hi
  text: उसने उनसे कहा, “तुम क्यों घबराए हुए हो, और तुम्हारे हृदय में संदेह[a] क्यों उठ रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विचार” या “तर्क-वितर्क”।
    reason: διαλογισμοὶ के व्यापक शाब्दिक अर्थों को सुरक्षित रखने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: Τί
  choice: क्यों
  rationale: विशेषण और εἰμί के साथ यह प्रश्नवाचक शब्द यहाँ कारण पूछता है; इसलिए मुहावरेदार हिन्दी में ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: τεταραγμένοι
  choice: घबराए हुए
  rationale: पूर्ण निष्क्रिय कृदन्त उनकी वर्तमान आंतरिक व्याकुलता की अवस्था बताता है। ‘घबराए हुए’ साधारण आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: διαλογισμοὶ
  choice: संदेह
  rationale: शब्द का व्यापक अर्थ ‘विचार’ या ‘तर्क-वितर्क’ हो सकता है, पर इस प्रसंग में यीशु को देखकर शिष्यों के भीतर उठी अनिश्चितता और शंका प्रमुख है। विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: ἀναβαίνουσιν
  choice: उठ रहे हैं
  rationale: मूल अर्थ ‘ऊपर आना’ है; आंतरिक विचारों या संदेहों के लिए हिन्दी में ‘उठना’ उसी रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: तुम्हारे हृदय में
  rationale: यूनानी में ‘हृदय’ एकवचन और ‘तुम्हारे’ बहुवचन है, जो समूह के प्रत्येक व्यक्ति पर लागू होने वाला वितरणात्मक प्रयोग है। हिन्दी में सामूहिक संबोधन के साथ एकवचन ‘तुम्हारे हृदय में’ स्वाभाविक है और स्रोत-रूप को भी बनाए रखता है।
- source_word: καρδία
  choice: हृदय
  rationale: यह भीतर के व्यक्ति—विचार, भावना और प्रवृत्ति—का बाइबलीय बोध रखता है। केवल ‘मन’ कहना अर्थ को मानसिक क्रिया तक सीमित कर सकता है।
theological_decisions:
- issue: मानव-स्वभाव संबंधी शब्द καρδία
  choice: हृदय
  alternative: मन; अंतर्मन
  rationale: मूल पाठ में हृदय विचार और संदेह का भी स्थान है। ‘हृदय’ रखने से बाइबलीय मानव-दृष्टि सुरक्षित रहती है और इसे केवल आधुनिक मनोवैज्ञानिक श्रेणी में सीमित नहीं किया जाता।
- issue: διαλογισμοὶ का प्रसंगगत अर्थ
  choice: संदेह
  alternative: विचार; तर्क-वितर्क
  rationale: पुनरुत्थित यीशु के प्रकट होने पर शिष्यों की अनिश्चितता के कारण ‘संदेह’ प्रसंग के नकारात्मक और डगमगाते भाव को अच्छी तरह व्यक्त करता है; फिर भी शब्द की व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘घबराए हुए’ आंतरिक व्याकुलता को सामान्य पाठक के लिए सहज बनाता है, जबकि ‘हृदय’ मूल की बाइबलीय मानव-दृष्टि बनाए रखता है।
