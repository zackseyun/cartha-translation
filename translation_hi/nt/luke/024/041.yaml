language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: hi
  text: जब वे आनन्द के कारण अब भी विश्वास नहीं कर पा रहे थे और विस्मित हो रहे थे[a], तब उसने उनसे कहा, “क्या तुम्हारे पास यहाँ खाने के लिए कुछ है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब आनन्द के मारे उन्हें अब भी विश्वास नहीं हो रहा था और वे विस्मित हो रहे थे।”
    reason: यह वैकल्पिक हिन्दी ἀπιστούντων को अधिक मुहावरेदार ढंग से व्यक्त करती है, जबकि आनन्द से उत्पन्न विश्वास न कर पाने और जारी विस्मय का सम्बन्ध बनाए रखती है।
lexical_decisions:
- source_word: ἔτι δὲ
  choice: जब वे ... अब भी
  rationale: ἔτι की निरन्तरता को ‘अब भी’ से और δέ तथा सम्बन्धित कृदन्तीय वाक्य-रचना को प्रसंगानुकूल ‘जब ... तब’ से व्यक्त किया गया है।
- source_word: ἀπιστούντων
  choice: विश्वास नहीं कर रहे थे
  rationale: यह वर्तमान कृदन्त उनकी उस समय जारी प्रतिक्रिया को बताता है; यह अनुवाद उसे स्थायी अविश्वास घोषित किए बिना मूल नकारात्मक अर्थ बनाए रखता है।
- source_word: ἀπὸ τῆς χαρᾶς
  choice: आनन्द के कारण
  rationale: यहाँ ἀπό कारण या स्रोत बताता है; यह वाक्यांश उस विरोधाभास को स्पष्ट रखता है कि आनन्द के कारण ही उन्हें विश्वास करने में कठिनाई हो रही थी।
- source_word: θαυμαζόντων
  choice: चकित हो रहे थे
  rationale: यह ἀπιστούντων के समानान्तर जारी आश्चर्य की प्रतिक्रिया व्यक्त करता है और θαυμάζω के विस्मय-बोध को सहज हिन्दी में रखता है।
- source_word: Ἔχετέ τι βρώσιμον ἐνθάδε
  choice: क्या तुम्हारे पास यहाँ खाने के लिए कुछ है?
  rationale: Ἔχετε को ‘तुम्हारे पास ... है’, प्रश्न में τι को ‘कुछ’, βρώσιμον को स्वाभाविक ‘खाने के लिए’, और ἐνθάδε को ‘यहाँ’ से व्यक्त किया गया है।
theological_decisions:
- issue: जी उठे यीशु के प्रति चेलों की प्रतिक्रिया का स्वरूप
  choice: ‘आनन्द के कारण अब भी विश्वास नहीं कर रहे थे’ कहकर अस्थायी अविश्वास, प्रबल आनन्द और विस्मय के बीच मूल तनाव बनाए रखा गया है।
  alternative: ‘आनन्द के मारे उन्हें विश्वास नहीं हो रहा था’ कहना, जो उनकी प्रतिक्रिया को अनैच्छिक असमर्थता के रूप में अधिक स्पष्ट करता है।
  rationale: मूल पाठ ἀπιστούντων को ἀπὸ τῆς χαρᾶς और θαυμαζόντων के साथ रखता है। इसलिए अनुवाद न तो इसे कठोर, स्थायी अविश्वास बनाता है, न ही मूल की नकारात्मक क्रिया को पूरी तरह नरम करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘आनन्द’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
