  text: And they were not able to reply to these things[a].
translation:
  language: hi
  text: और वे इन बातों का कोई उत्तर न दे सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनके उत्तर में कुछ न कह सके।” यूनानी में शाब्दिक रूप से बहुवचन अभिव्यक्ति “इन बातों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: साधारण संयोजक के रूप में यह पिछले प्रसंग से स्वाभाविक संबंध बनाए रखता है और कोई अतिरिक्त कालगत या परिणामसूचक अर्थ नहीं जोड़ता।
- source_word: οὐκ
  choice: न
  rationale: यह क्रिया-समूह का सीधा निषेध है; ‘न ... सके’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἴσχυσαν
  choice: सके
  rationale: यहाँ ἰσχύω शारीरिक सामर्थ्य नहीं, बल्कि उत्तर देने की क्षमता व्यक्त करता है; ‘न दे सके’ उस अर्थ को सहज रूप से प्रकट करता है।
- source_word: ἀνταποκριθῆναι
  choice: कोई उत्तर न दे सके
  rationale: क्रिया प्रत्युत्तर देने का भाव रखती है। ‘उत्तर देना’ स्पष्ट और स्वाभाविक है; ‘जवाब देना’ भी संभव है, पर कभी-कभी उसमें प्रतिवाद या उद्दंडता की छाया आ सकती है। ‘कोई’ हिन्दी में उनकी पूर्ण असमर्थता को स्वाभाविक ढंग से व्यक्त करता है, बिना यूनानी में अलग सर्वनाम मानने के।
- source_word: πρὸς ταῦτα
  choice: इन बातों का
  rationale: यूनानी बहुवचन ταῦτα को ‘इन बातों’ से सुरक्षित रखा गया है। हिन्दी में ‘इन बातों का उत्तर’ ‘इन बातों के प्रति उत्तर’ से अधिक स्वाभाविक है।
