id: LUK.14.8
reference: Luke 14:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: hi
  text: जब कोई तुम्हें विवाह-भोज[a] में बुलाए, तो सबसे सम्मानित स्थान[b] पर मत बैठो[c], कहीं ऐसा न हो कि उसने तुमसे अधिक सम्मानित किसी व्यक्ति को बुला रखा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विवाह में।” यूनानी में बहुवचन शब्द विवाह के उत्सवों, विशेषकर विवाह-भोज, को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, भोजन के समय सबसे अधिक सम्मान वाला स्थान।
    reason: cultural_note
  - marker: c
    text: मूल यूनानी में “लेटो” है। प्राचीन समय के औपचारिक भोजों में लोग सामान्यतः मेज़ के पास लेटकर भोजन करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: जब कोई तुम्हें ... बुलाए
  rationale: Ὅταν यहाँ एक सामान्य संभावित परिस्थिति प्रस्तुत करता है; भोज के संदर्भ में καλέω का स्वाभाविक अर्थ ‘बुलाना/निमंत्रित करना’ है। ‘जब कोई तुम्हें बुलाए’ आधुनिक हिन्दी में सहज है और अनिश्चित कर्ता को बनाए रखता है।
- source_word: εἰς γάμους
  choice: विवाह-भोज
  rationale: बहुवचन γάμους विवाह के उत्सवों, विशेषकर भोज, को सूचित कर सकता है। अगले वाक्यांश में भोजन के स्थान का उल्लेख होने के कारण ‘विवाह-भोज’ संदर्भ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: μὴ κατακλιθῇς
  choice: मत बैठो
  rationale: κατακλίνω का ऐतिहासिक अर्थ भोजन के लिए लेटना है, पर आधुनिक हिन्दी में ‘लेटना’ यहाँ भ्रामक लग सकता है। ‘मत बैठो’ भोज में स्थान ग्रहण करने का स्वाभाविक समतुल्य है; मूल सांस्कृतिक चित्र फुटनोट में सुरक्षित रखा गया है।
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: सबसे सम्मानित स्थान पर
  rationale: πρωτοκλισία भोज में सर्वोच्च प्रतिष्ठा वाले स्थान को दर्शाता है। यह अनुवाद सामाजिक सम्मान को व्यक्त करता है, जबकि ‘पहली सीट’ जैसा शाब्दिक रूप भ्रामक हो सकता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेध के पीछे संभावित आशंका या चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐντιμότερός σου
  choice: तुमसे अधिक सम्मानित किसी व्यक्ति को
  rationale: ἐντιμότερος तुलनात्मक रूप में अधिक आदर या सामाजिक प्रतिष्ठा का संकेत देता है; ‘अधिक सम्मानित’ मूल के सम्मान-केंद्रित भाव को बनाए रखता है।
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: उसने ... बुला रखा हो
  rationale: ‘बुला रखा हो’ पूर्ण हुए निमंत्रण की वर्तमान प्रासंगिकता को व्यक्त करता है, और ‘हो’ μήποτε के बाद संभाव्यता को बनाए रखता है। ‘उसने’ पहले उल्लिखित निमंत्रण देने वाले व्यक्ति की ओर संकेत करता है।
