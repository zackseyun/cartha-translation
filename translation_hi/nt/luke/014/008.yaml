  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्राचीन भोज की अपरिचित मुद्रा को मुख्य पाठ में स्वाभाविक हिन्दी ‘बैठो’ से व्यक्त किया गया है, जबकि मूल का अधिक विशिष्ट सांस्कृतिक अर्थ फुटनोट में दिया गया है।
