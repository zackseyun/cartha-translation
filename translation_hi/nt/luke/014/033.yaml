  naturalness: The revised wording is concise, idiomatic modern standard Hindi, and suitably direct for Jesus’ discourse. “हर एक” avoids an unnecessary generic masculine noun while retaining the individualizing force.
  terminology: “संपत्ति,” “त्याग,” and “चेला” are clear, established choices. “त्याग” fits the contextual sense of ἀποτάσσεται better than the relational idiom “नाता तोड़ना.”
