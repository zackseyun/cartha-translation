source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: hi
  text: इसलिए, तुम में से हर एक[b] जो अपनी सारी संपत्ति का त्याग नहीं करता[a], मेरा चेला नहीं हो सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उसके पास है, वह सब छोड़ नहीं देता।” यूनानी क्रिया का शाब्दिक भाव “विदा कहना” भी हो सकता है; यहाँ इसका आशय अपनी संपत्ति पर अपना दावा छोड़ने से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ पुल्लिंग एकवचन रूप है, पर उसका प्रयोग सामान्य अर्थ में हुआ है और यह माँग प्रत्येक चेले पर लागू होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: तो इसी तरह
  rationale: यह पद पिछले दोनों दृष्टान्तों से निष्कर्ष निकालता है। ‘तो’ οὖν की निष्कर्षसूचक शक्ति और ‘इसी तरह’ οὕτως के पिछले उदाहरणों से संबंध—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶς ἐξ ὑμῶν
  choice: तुम में से हर व्यक्ति
  rationale: यह अभिव्यक्ति माँग को प्रत्येक श्रोता पर अलग-अलग लागू करती है; ‘हर व्यक्ति’ उस वितरणात्मक बल को स्पष्ट रखता है।
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: जो ... से नाता नहीं तोड़ता
  rationale: ἀποτάσσομαι का मूल भाव विदा कहना या अलग होना है। संपत्ति के संदर्भ में ‘नाता तोड़ना’ स्वामित्व के दावे और आसक्ति के निर्णायक त्याग को व्यक्त करता है, पर केवल भौतिक बिक्री को अनिवार्य अर्थ बनाकर मूल की तनावपूर्ण व्यापकता को सीमित नहीं करता।
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: अपनी सारी संपत्ति
  rationale: ὑπάρχουσιν यहाँ किसी व्यक्ति की संपत्ति या उसके पास की वस्तुओं को सूचित करता है। ‘अपनी सारी संपत्ति’ सम्पूर्णता और आत्मवाचक संबंध दोनों को सहज हिन्दी में रखता है।
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: मेरा चेला नहीं हो सकता
  rationale: यह केवल अनुचित होने की बात नहीं, बल्कि असमर्थता या असम्भवता का कथन है। ‘नहीं हो सकता’ οὐ δύναται का पूरा बल रखता है।
- source_word: μαθητής
  choice: चेला
  rationale: सुसमाचारों के संदर्भ में ‘चेला’ यीशु का अनुसरण करने और उससे सीखने के संबंध को साधारण, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संपत्ति के विषय में माँग का स्वरूप
  choice: ‘अपनी सारी संपत्ति से नाता नहीं तोड़ता’—संपत्ति पर अपने दावे और उससे आसक्ति के निर्णायक त्याग को सामने रखना
  alternative: ‘अपनी सारी संपत्ति छोड़ नहीं देता’—जिसे हर परिस्थिति में पूर्ण भौतिक संपत्ति-विसर्जन का आदेश समझा जा सकता है
  rationale: ἀποτάσσεται में ‘विदा कहना’ और ‘त्यागना’ दोनों का भाव है। चुना हुआ अनुवाद चेलेपन की कठोर और सर्वग्रासी माँग को बनाए रखता है, पर पाठ से आगे बढ़कर किसी एक आर्थिक व्यवस्था को अनिवार्य नहीं ठहराता। पादटिप्पणी अधिक शाब्दिक विकल्प को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष रूप अपनाया गया है। ‘तो इसी तरह’ पिछले दृष्टान्तों से संबंध बनाए रखता है। ‘नाता तोड़ना’ साधारण पाठक के लिए सहज है और मूल क्रिया के ‘विदा कहने/त्यागने’ के अर्थ-क्षेत्र को बिना अनावश्यक सिद्धान्तगत संकुचन के व्यक्त करता है।
