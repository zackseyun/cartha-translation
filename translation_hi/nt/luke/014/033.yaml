    issue: “अपनी सारी संपत्ति से नाता नहीं तोड़ता” is less direct than the Greek verb in this context.
    rationale: ἀποτάσσεται literally involves taking leave of/saying farewell to, and here denotes renouncing or relinquishing one’s possessions/claim to them. “नाता तोड़ना” can primarily suggest ending emotional attachment rather than the decisive renunciation stated by the source.
