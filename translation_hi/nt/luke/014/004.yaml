lexical_decisions:
- source_word: οἱ δὲ
  choice: पर वे
  rationale: οἱ पिछले संदर्भ में उपस्थित व्यवस्था के जानकारों और फरीसियों की ओर संकेत करता है; δέ यीशु के प्रश्न के बाद हल्का विरोध दर्शाता है, इसलिए ‘पर वे’ स्वाभाविक है।
- source_word: ἡσύχασαν
  choice: चुप रहे
  rationale: यहाँ क्रिया उत्तर न देने को व्यक्त करती है। ‘चुप रहे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा ‘कुछ नहीं कहा’ की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: ἐπιλαβόμενος
  choice: उस मनुष्य को पकड़कर
  rationale: ἐπιλαμβάνομαι में शारीरिक रूप से पकड़ने या थामने का भाव है। संदर्भ स्पष्ट रखने के लिए सर्वनाम के स्थान पर ‘उस मनुष्य’ कहा गया है।
- source_word: ἰάσατο
  choice: चंगा किया
  rationale: ἰάομαι शारीरिक रोग से चंगा करने को दर्शाता है; ‘चंगा किया’ हिन्दी बाइबलीय भाषा में परिचित और सामान्य पाठक के लिए स्पष्ट है।
- source_word: αὐτὸν
  choice: उस मनुष्य को
  rationale: पुल्लिंग एकवचन सर्वनाम पिछले संदर्भ के रोगी को दर्शाता है; हिन्दी में संदर्भ की स्पष्टता के लिए संज्ञा दोहराई गई है।
- source_word: ἀπέλυσεν
  choice: जाने दिया
  rationale: ἀπολύω का अर्थ छोड़ देना, विदा करना या जाने देना हो सकता है। यहाँ ‘जाने दिया’ स्वाभाविक है और बंदीगृह अथवा कानूनी रिहाई का अनावश्यक संकेत नहीं देता।
