- from: पर वे चुप रहे[a]। तब उसने उस मनुष्य को पकड़कर चंगा किया और जाने दिया[b]।
  to: पर वे चुप रहे[a]। और उसने उस मनुष्य को थामकर उसे चंगा किया और विदा कर दिया[b]।
  rationale: The revision replaces the temporal ‘तब’ with the neutral connective ‘और,’ explicitly retains the pronoun governed by ‘चंगा किया,’ and uses ‘विदा कर दिया’ as the primary contextual rendering of ἀπέλυσεν. The footnote anchor remains attached to that verb and supplies legitimate alternatives.
  reviewer_model: gpt-5.6-terra
