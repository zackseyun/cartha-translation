language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: hi
  text: तब उसके साथ भोजन करने बैठे लोगों में से एक ने ये बातें सुनकर उससे कहा, “धन्य है वह, जो परमेश्वर के राज्य में रोटी खाएगा[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रोटी खाना” यूनानी में साथ भोजन करने के अर्थ में प्रयुक्त हो सकता है; यहाँ मूल का शाब्दिक बिंब बनाए रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: सुनकर
  rationale: कालवाचक एओरिस्ट कृदंत को स्वाभाविक हिन्दी पूर्वकालिक क्रिया से व्यक्त किया गया है।
- source_word: δέ
  choice: तब
  rationale: यह प्रसंग में हल्के कथात्मक परिवर्तन और पिछली बात पर प्रतिक्रिया को दर्शाता है; हिन्दी में ‘तब’ अधिक स्वाभाविक है।
- source_word: τις τῶν συνανακειμένων
  choice: उसके साथ भोजन करने बैठे लोगों में से एक
  rationale: यह एक अनाम सहभोजी को सूचित करता है। ‘भोजन करने बैठे’ प्राचीन मेज़ पर अधलेटे होने की मुद्रा को शाब्दिक और अस्वाभाविक ढंग से थोपे बिना भोजन का प्रसंग स्पष्ट रखता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक यीशु की ठीक पिछली बातों की ओर लौटता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: सरल कथात्मक अभिव्यक्ति; सर्वनाम का संदर्भ प्रसंग में स्पष्ट है।
- source_word: Μακάριος
  choice: धन्य है
  rationale: यह केवल मनोवैज्ञानिक प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा से जुड़ी शुभ अवस्था को व्यक्त करता है और धन्य-वचन का भार बनाए रखता है।
- source_word: ὅστις
  choice: वह, जो
  rationale: अनिश्चित-सामान्य संबंधवाचक अर्थ को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: φάγεται
  choice: खाएगा
  rationale: भविष्यकालीन क्रिया परमेश्वर के राज्य में भावी सहभागिता की ओर संकेत करती है।
- source_word: ἄρτον
  choice: रोटी
  rationale: मूल का ठोस शब्द और भोज की छवि सुरक्षित रहती है, यद्यपि यूनानी मुहावरे में इसका अर्थ भोजन करना भी हो सकता है।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: पूर्वसर्गीय वाक्यांश का सीधा और स्वाभाविक अनुवाद; मुख्य पाठ में ‘भोज’ जैसी निहित कल्पना नहीं जोड़ी गई।
theological_decisions:
- issue: भावी राज्य-भोज के कथन में Μακάριος का आशय
  choice: धन्य है वह, जो परमेश्वर के राज्य में रोटी खाएगा
  alternative: सुखी है वह, जो परमेश्वर के राज्य में भोजन करेगा
  rationale: ‘धन्य’ दैवी अनुग्रह और युगांतकारी सहभागिता का धार्मिक भार बनाए रखता है; ‘सुखी’ इसे केवल अनुभूत प्रसन्नता तक सीमित कर सकता है। ‘रोटी खाएगा’ मूल बिंब को भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन सहभोज-मुद्रा को कृत्रिम ‘अधलेटा’ शब्दावली से न देकर ‘भोजन करने बैठे’ कहा गया है; ‘धन्य’ और ‘रोटी खाएगा’ मूल के धार्मिक भार तथा भोज-बिंब को बनाए रखते हैं।
