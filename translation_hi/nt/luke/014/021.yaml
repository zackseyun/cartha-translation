source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: hi
  text: जब सेवक लौटकर आया, तो उसने अपने स्वामी को ये बातें बताईं। तब घर के मालिक ने क्रोधित होकर अपने सेवक से कहा, ‘जल्दी से बाहर निकल और नगर की चौड़ी सड़कों और गलियों में जा, और गरीबों, अपंगों[a], अंधों और लँगड़ों को यहाँ ले आ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंग-विकल लोगों” अथवा “अंग-भंग लोगों।”
    reason: ἀναπείρους गंभीर शारीरिक अक्षमता या अंग-विकलता का अधिक विशिष्ट अर्थ भी दे सकता है।
lexical_decisions:
- source_word: παραγενόμενος
  choice: लौटकर आया
  rationale: कथा-संदर्भ में सेवक निमंत्रित लोगों के उत्तर सुनकर वापस आकर सूचना देता है; यह स्वाभाविक हिन्दी में निहित वापसी को स्पष्ट करता है।
- source_word: δοῦλος
  choice: सेवक
  rationale: यहाँ घरेलू व्यवस्था में उसकी भूमिका प्रमुख है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि यूनानी शब्द दासत्व का अर्थ भी रख सकता है।
- source_word: ἀπήγγειλεν
  choice: बताईं
  rationale: अपने अधिकारी को मिली हुई जानकारी सुनाने के अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριος
  choice: स्वामी
  rationale: यहाँ शब्द मनुष्य, अर्थात सेवक के अधिकारी, के लिए है; ‘स्वामी’ संबंधगत अधिकार व्यक्त करता है, बिना इसे परमेश्वर की उपाधि बनाए।
- source_word: ὀργισθεὶς
  choice: क्रोधित होकर
  rationale: कृदंत को मुख्य आदेश से पहले हुई प्रतिक्रिया के रूप में संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἰκοδεσπότης
  choice: घर का मालिक
  rationale: घर अथवा परिवार पर अधिकार रखने वाले व्यक्ति का स्पष्ट, वर्तमान और सहज हिन्दी रूप।
- source_word: πλατείας καὶ ῥύμας
  choice: चौड़ी सड़कों और गलियों
  rationale: पहला शब्द खुले या चौड़े सार्वजनिक मार्गों और दूसरा संकरे मार्गों को सूचित करता है; अनुवाद दोनों के अंतर को बनाए रखता है।
- source_word: ἀναπείρους
  choice: अपंगों
  rationale: शारीरिक रूप से अशक्त या अंग-विकल लोगों के लिए व्यापक, सम्मानजनक और प्रसंगानुकूल हिन्दी शब्द; पाठगत अर्थ की संभावित तीव्रता फुटनोट में दी गई है।
- source_word: εἰσάγαγε ὧδε
  choice: यहाँ ले आ
  rationale: अंदर लाने की दिशा और वक्ता के स्थान तक पहुँचाने—दोनों भावों को स्वाभाविक हिन्दी आदेश में रखता है।
theological_decisions:
- issue: δοῦλος का सामाजिक अर्थ
  choice: सेवक
  alternative: दास
  rationale: दृष्टांत में घरेलू भूमिका अग्रभूमि में है, फिर भी मूल शब्द दासत्व को भी सूचित कर सकता है। ‘सेवक’ सामान्य पाठक के लिए सहज है और यहाँ कोई विशिष्ट सांप्रदायिक अर्थ नहीं जोड़ता।
- issue: मानवीय अधिकारी के लिए κύριος
  choice: स्वामी
  alternative: मालिक / प्रभु
  rationale: संदर्भ में यह परमेश्वर या मसीह की उपाधि नहीं, बल्कि सेवक का मानवीय अधिकारी है। ‘स्वामी’ अधिकार-संबंध बनाए रखता है; οἰκοδεσπότης को अलग से ‘घर का मालिक’ कहा गया है।
- issue: ἀναπείρους की अर्थ-सीमा
  choice: अपंगों
  alternative: अंग-विहीनों / अंग-भंग लोगों
  rationale: यूनानी शब्द गंभीर शारीरिक अक्षमता, यहाँ तक कि अंग-विकलता, को सूचित कर सकता है। मुख्य पाठ में व्यापक और सम्मानजनक रूप रखा गया है तथा संकीर्ण विकल्प फुटनोट में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सामान्य पाठक के लिए सहज। आदेश में एकवचन ‘जा’ और ‘ले आ’ रखा गया है, क्योंकि स्वामी एक सेवक से बोल रहा है। ‘लँगड़ों’ की वर्तनी आधुनिक मानक रूप में है।
