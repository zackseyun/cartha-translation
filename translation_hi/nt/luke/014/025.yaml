  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: hi
  text: 'बड़ी-बड़ी भीड़ें उसके साथ चली जा रही थीं, और मुड़कर उसने उनसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: साथ चली जा रही थीं
  rationale: अपूर्ण भूतकाल की जारी क्रिया और साथ यात्रा करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ हल्के कथात्मक संक्रमण को दर्शाता है; प्रबल विरोध का भाव नहीं देता। इसे पहले वाक्य के बजाय अगले वाक्य में रखना हिन्दी प्रवाह के अनुकूल है।
- source_word: αὐτῷ
  choice: उसके साथ
  rationale: साथ होने का दातृकारकीय भाव बनाए रखता है और स्पष्ट संदर्भ में यीशु का नाम अनावश्यक रूप से नहीं दोहराता।
- source_word: ὄχλοι πολλοί
  choice: बड़ी-बड़ी भीड़ें
  rationale: बहुवचन भीड़ और उनकी बड़ी संख्या—दोनों पर यूनानी बल को साधारण, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ
  choice: तब
  rationale: हिन्दी में घटनाक्रम का सहज संबंध बनाता है; δὲ के हल्के संक्रमण के साथ संयुक्त रूप से व्यक्त हुआ है।
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: पूर्वकालिक कृदंत से सूचित संक्षिप्त क्रम—पहले मुड़ना, फिर कहना—को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘पीछे’ जैसी अतिरिक्त दिशा जोड़े।
- source_word: εἶπεν
  choice: कहा
  rationale: λέγω के सामान्य कथात्मक अर्थ का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: वचन के संबोधित लोगों को स्पष्ट करता है और यूनानी सर्वनाम को बनाए रखता है।
