- from: तब दास ने कहा, “स्वामी, जैसा आपने आदेश दिया था, वैसा कर दिया गया है, और अब भी जगह है।”
  to: और दास ने कहा, “स्वामी, जो आपने आदेश दिया था, वह पूरा हो चुका है, और अब भी जगह है।”
  rationale: The revision replaces the comparative, impersonal construction with a direct relative-clause expression that reflects the Greek syntax and perfect-result sense more naturally. “और” preserves καὶ without importing a temporal inference, while the established contextual terms “दास,” “स्वामी,” and “जगह” are retained.
