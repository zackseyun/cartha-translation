  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: hi
  text: और दास ने कहा, “स्वामी, जो आपने आदेश दिया था, वह पूरा हो चुका है, और अब भी जगह है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यूनानी शब्द δοῦλος अधीन और स्वामित्व-संबंध में बँधे सेवक को दर्शा सकता है। ‘दास’ इस सामाजिक संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: Κύριε
  choice: स्वामी
  rationale: यह संबोधन दृष्टान्त के गृहस्वामी से है। ‘स्वामी’ घरेलू अधिकार-संबंध को स्वाभाविक रूप से व्यक्त करता है और इस प्रसंग में अनावश्यक रूप से दिव्य उपाधि का संकेत नहीं जोड़ता।
- source_word: γέγονεν
  choice: कर दिया गया है
  rationale: पूर्णकालिक रूप आदेश के पूरा हो चुकने और उसके वर्तमान परिणाम को व्यक्त करता है; ‘कर दिया गया है’ हिन्दी में इस परिणामात्मक भाव को सहजता से रखता है।
- source_word: ὃ ἐπέταξας
  choice: जैसा आपने आदेश दिया था
  rationale: सापेक्ष वाक्य आदेश की विषयवस्तु की ओर संकेत करता है। हिन्दी में ‘जैसा…वैसा’ संरचना उस आदेश के अनुसार कार्य पूरा होने का आशय स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἔτι
  choice: अब भी
  rationale: यह बताता है कि आदेश पूरा होने के बाद भी जगह शेष है।
- source_word: τόπος
  choice: जगह
  rationale: भोज के प्रसंग में τόπος उपलब्ध स्थान या क्षमता को दर्शाता है; ‘जगह’ साधारण आधुनिक हिन्दी में सबसे स्वाभाविक है।
