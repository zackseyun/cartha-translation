  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: hi
  text: और भोज के समय उसने अपने दास को उन लोगों से यह कहने के लिए भेजा जिन्हें पहले बुलाया गया था, “आइए, क्योंकि अब सब कुछ तैयार है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि अब तैयार हैं।” यूनानी में कर्ता व्यक्त नहीं किया गया है और ‘तैयार’ का रूप नपुंसकलिंग बहुवचन है; भाव है कि भोजन और उसकी सारी तैयारियाँ पूरी हो चुकी हैं।
    reason: मूल भाषा की व्याकरणिक अस्पष्टता और सामूहिक अभिव्यक्ति स्पष्ट करना
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: साधारण भूतकालीन कथन के लिए ‘भेजा’ स्वाभाविक और अर्थ की दृष्टि से सीधा है।
- source_word: δοῦλον
  choice: दास
  rationale: δοῦλος घराने के अधीन व्यक्ति को दर्शाता है। ‘दास’ उसकी सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है और इस दृष्टान्त में भी बोधगम्य है।
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: भोज के समय
  rationale: यह निश्चित भोजन के अवसर को दर्शाता है। प्रसंग बड़े भोज का है, इसलिए ‘भोज के समय’ आधुनिक हिन्दी में स्वाभाविक है और केवल दिन के सामान्य भोजन का आभास नहीं देता।
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: बुलाए हुए लोगों से यह कहने
  rationale: पूर्ण निष्क्रिय कृदन्त पहले से दिए जा चुके निमंत्रण को सूचित करता है। ‘बुलाए हुए लोगों’ में यह पूर्व स्थिति बनी रहती है, जबकि ‘मेहमान’ यूनानी में निहित न होने वाला संज्ञात्मक विस्तार होता।
- source_word: Ἔρχεσθε
  choice: आइए
  rationale: यह बुलाए हुए अनेक लोगों को संबोधित आमंत्रणात्मक आज्ञा है। आदरसूचक बहुवचन ‘आइए’ हिन्दी में इस अवसर के अनुकूल और स्वाभाविक है।
- source_word: ὅτι ἤδη ἕτοιμά ἐστιν
  choice: क्योंकि अब सब कुछ तैयार है
  rationale: ὅτι कारण बताता है और ἤδη वर्तमान अवस्था तक तैयारी पूरी हो जाने पर बल देता है। यूनानी में कर्ता अप्रकट है; सामूहिक नपुंसकलिंग बहुवचन को हिन्दी में ‘सब कुछ’ से स्वाभाविक रूप से व्यक्त किया गया है।
