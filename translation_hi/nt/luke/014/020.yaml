  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of excuses, the causal connection, and the claimed inability to come. However, ‘एक दूसरे’ means ‘one another’ in Hindi and does not render ἕτερος (‘another [person]’). The marriage expression is understandable, but it omits the explicit object ‘wife’ found in Γυναῖκα ἔγημα.
  naturalness: ‘एक और ने कहा’ is idiomatic modern Hindi. ‘मैंने पत्नी से विवाह किया है’ is clear, natural, and retains the stated marital relationship without unnecessary literalism.
  terminology: No specialized theological terminology occurs. ‘पत्नी से विवाह’ accurately reflects γυνή in its contextually required sense of ‘wife.’
  issues:
  - severity: high
    issue: ‘एक दूसरे’ used for ἕτερος
    rationale: In modern Hindi, ‘एक दूसरे’ ordinarily means ‘each other/one another,’ not ‘another person.’ It changes the referential sense. ‘एक और’ accurately introduces a further respondent.
  - severity: medium
    issue: The object ‘wife’ is omitted from ‘मैंने विवाह किया है’
    rationale: Although the Hindi wording can imply marriage, Γυναῖκα explicitly identifies the marriage as to a wife. Adding ‘पत्नी से’ preserves this source detail naturally.
