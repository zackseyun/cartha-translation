  text: और एक और ने कहा, “मैंने पत्नी से विवाह किया है, इसलिए मैं नहीं आ सकता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: एक दूसरे
  rationale: यह शब्द बहानों की क्रमिक शृंखला में एक और व्यक्ति का परिचय देता है; ‘एक दूसरे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Γυναῖκα ἔγημα
  choice: मैंने विवाह किया है
  rationale: γυνή यहाँ γαμέω के कर्म के रूप में पत्नी का अर्थ रखता है। हिन्दी में ‘मैंने विवाह किया है’ स्वाभाविक रूप से हाल में सम्पन्न विवाह और उसकी वर्तमान प्रासंगिकता व्यक्त करता है; ‘मैंने एक पत्नी से विवाह किया’ अनावश्यक रूप से शब्दशः और अस्वाभाविक लगेगा।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पदबंध विवाह को न आने के बताए गए कारण से जोड़ता है; ‘इसलिए’ संक्षिप्त और स्वाभाविक कारणात्मक संयोजक है।
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: मैं नहीं आ सकता
  rationale: δύναμαι और क्रियार्थक रूप ἐλθεῖν का सीधा, प्रचलित हिन्दी समतुल्य है और वक्ता की कथित असमर्थता को सुरक्षित रखता है।
