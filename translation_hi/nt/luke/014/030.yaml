  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: hi
  text: यह कहते हुए, “इस आदमी ने बनाना तो शुरू किया, पर पूरा न कर सका।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: वर्तमान कृदन्त पिछले पद के निहित बहुवचन कर्ता से जुड़ा है; ‘यह कहते हुए’ उस क्रिया-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के लिए उद्धरण-चिह्न
  rationale: यहाँ ὅτι कथन की विषयवस्तु प्रस्तुत करता है; हिन्दी में प्रत्यक्ष उद्धरण अधिक स्वाभाविक है।
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: इस आदमी ने
  rationale: संकेतवाचक और पुल्लिंग संज्ञा के pointed सार्वजनिक स्वर को बिना अनावश्यक तिरस्कार जोड़े व्यक्त करता है।
- source_word: ἤρξατο οἰκοδομεῖν
  choice: बनाना तो शुरू किया
  rationale: ‘बनाना शुरू किया’ मूल अर्थ को सहज रूप में देता है; ‘तो’ आगे आने वाली असफलता के विरोध को स्वाभाविक हिन्दी में उभारता है, कोई नया तथ्य नहीं जोड़ता।
- source_word: οὐκ ἴσχυσεν
  choice: न कर सका
  rationale: इस प्रसंग में ἰσχύω सामान्य सामर्थ्य या क्षमता दर्शाता है, केवल शारीरिक बल नहीं; ‘न कर सका’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐκτελέσαι
  choice: पूरा
  rationale: निर्माण को अंत तक ले जाने का अर्थ देता है; संयुक्त वाक्यांश ‘पूरा न कर सका’ आधुनिक हिन्दी में सहज है।
theological_decisions: []
