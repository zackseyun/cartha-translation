    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: सुनाने लगा
  rationale: अपूर्ण काल चल रही अथवा दृश्य की पृष्ठभूमि बनाने वाली क्रिया को दिखाता है। अगले पदों में आने वाले कथन की भूमिका के रूप में यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; हिन्दी वाक्य का प्रवाह बिना किसी स्पष्ट ‘अब’ या विरोधसूचक शब्द के ही इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς κεκλημένους
  choice: निमंत्रित लोग
  rationale: पूर्ण कृदन्त उन लोगों की निमंत्रित अवस्था पर बल देता है। ‘लोग’ मूल में निहित व्यक्तियों को सहज हिन्दी में व्यक्त करता है, जबकि ‘मेहमान’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ता।
- source_word: παραβολήν
  choice: दृष्टान्त
  rationale: सुसमाचारों में παραβολή के लिए यह प्रचलित और अर्थपूर्ण हिन्दी शब्द है तथा लेखक द्वारा दिए गए साहित्यिक वर्गीकरण को बनाए रखता है।
- source_word: ἐπέχων
  choice: यह देखकर
  rationale: यह कृदन्त उस सावधान अवलोकन को बताता है जिसने दृष्टान्त को प्रेरित किया; ‘देखकर’ हिन्दी में प्रसंगानुकूल और सहज है।
- source_word: πῶς
  choice: कैसे
  rationale: यह उनके चुनाव करने के ढंग का सीधा और स्वाभाविक संकेत है।
- source_word: πρωτοκλισίας
  choice: सम्मान की जगहें
  rationale: यह भोज में सबसे प्रतिष्ठित स्थानों को सूचित करता है। यह अनुवाद आधुनिक पाठक के लिए उनकी सामाजिक महत्ता को स्पष्ट करता है।
- source_word: ἐξελέγοντο
  choice: अपने लिए ... चुन रहे थे
  rationale: अपूर्ण मध्यम रूप जारी या बार-बार हो रहे चुनाव और उसके आत्मसंबंधी भाव को व्यक्त करता है; हिन्दी में ‘अपने लिए’ उस भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: λέγων πρὸς αὐτούς
  choice: उन्हें ... सुनाने लगा
  rationale: यह आगामी प्रत्यक्ष कथन का परिचय देता है। ‘उन्हें’ संबोधन को और ‘सुनाने’ दृष्टान्त कहने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
