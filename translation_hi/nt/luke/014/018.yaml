  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: hi
  text: पर वे सब एक साथ बहाने बनाकर मना करने लगे। पहले ने उससे कहा, “मैंने एक खेत खरीदा है और मुझे बाहर जाकर उसे देखना है। मैं तुमसे विनती करता हूँ, मुझे क्षमा किया हुआ मानो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: पर
  rationale: यह संयोजक पिछले निमंत्रण के प्रत्युत्तर में आए विरोधी मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: वे सब ... बहाने बनाकर मना करने लगे
  rationale: παραιτεῖσθαι यहाँ निमंत्रण को कारण या बहाना देकर अस्वीकार करने का भाव रखता है; यह अनुवाद उसके इनकार और बहाने, दोनों पक्षों को स्पष्ट रखता है।
- source_word: ἀπὸ μιᾶς
  choice: एक साथ
  rationale: यह यूनानी मुहावरा सामूहिक रूप से या एकमत होकर किए गए कार्य को दर्शाता है; ‘एक साथ’ सहज हिन्दी में उसके सामूहिक बल को सुरक्षित रखता है।
- source_word: Ἀγρὸν ἠγόρασα
  choice: मैंने एक खेत खरीदा है
  rationale: ‘खेत’ ἀγρός का सीधा और व्यापक समतुल्य है; पूर्ण वर्तमान हाल में हुई खरीद की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔχω ἀνάγκην ἐξελθὼν ἰδεῖν αὐτόν
  choice: मुझे बाहर जाकर उसे देखना है
  rationale: यह आवश्यकता तथा बाहर जाकर देखने की सहगामी क्रिया को बिना ‘निरीक्षण’ जैसा अतिरिक्त अर्थ जोड़े सहज रूप में व्यक्त करता है।
- source_word: ἐρωτῶ σε
  choice: मैं तुमसे विनती करता हूँ
  rationale: संदर्भ में यह विनम्र अनुरोध है; ‘विनती’ सामान्य ‘पूछने’ की अपेक्षा अनुरोध का आशय अधिक ठीक व्यक्त करती है।
- source_word: ἔχε με παρῃτημένον
  choice: मुझे क्षमा समझो
  rationale: यह हिन्दी का स्वाभाविक विनम्र मुहावरा है, जो वक्ता के निमंत्रण अस्वीकार करने को स्वीकार कर लेने का अनुरोध व्यक्त करता है।
