translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संवाद में प्रसंगानुकूल अनौपचारिक एकवचन ‘तुम’ प्रयुक्त है।
