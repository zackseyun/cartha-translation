source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: hi
  text: और मालिक ने दास से कहा, “सड़कों और बाड़ों की ओर निकल जा और लोगों को भीतर आने के लिए विवश कर[a], ताकि मेरा घर भर जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें भीतर आने के लिए बहुत आग्रह कर।” यूनानी क्रिया प्रबल है और उसका अर्थ “विवश करना” या “दबाव डालना” हो सकता है; पर इस दृष्टान्त में इससे शारीरिक बल का प्रयोग अभिप्रेत होना आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: मालिक
  rationale: दृष्टान्त के भीतर यह शब्द घर और भोज के स्वामी के लिए है। ‘मालिक’ उस सामाजिक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है और इसे सीधे ईश्वरीय उपाधि नहीं बनाता।
- source_word: δοῦλον
  choice: दास
  rationale: ‘दास’ घर के मालिक के अधीन बँधी हुई सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: Ἔξελθε
  choice: निकल जा
  rationale: यह आज्ञा बाहर की ओर जाने की दिशा को स्पष्ट रूप से व्यक्त करती है।
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: सड़कों और बाड़ों की ओर
  rationale: ὁδοί बाहरी रास्तों या सड़कों को और φραγμοί सीमा बनाने वाली बाड़ों को सूचित करता है। ‘की ओर’ हिन्दी में गन्तव्य को स्वाभाविक बनाता है, बिना यह असंगत अर्थ दिए कि दास बाड़ों के भीतर जाए।
- source_word: ἀνάγκασον
  choice: विवश कर
  rationale: यह क्रिया प्रबल दबाव या बाध्य करने का भाव रखती है। मुख्य पाठ में इसकी शक्ति सुरक्षित है; सन्दर्भ में शारीरिक बल अनिवार्य न होने की बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: εἰσελθεῖν
  choice: भीतर आने के लिए
  rationale: भोज के घर में प्रवेश करने के सन्दर्भ में यह स्वाभाविक हिन्दी है और गति की दिशा बनाए रखती है।
- source_word: ἵνα γεμισθῇ μου ὁ οἶκος
  choice: ताकि मेरा घर भर जाए
  rationale: यह आदेश का उद्देश्य व्यक्त करता है और निष्क्रिय यूनानी रूप का आशय संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद
  choice: मालिक
  alternative: प्रभु
  rationale: यहाँ κύριος दृष्टान्त के कथानक में घर के मानवीय स्वामी को दर्शाता है। ‘मालिक’ प्रत्यक्ष ईश्वरीय उपाधि आरोपित किए बिना दृष्टान्त के व्यापक धार्मिक आशय के लिए स्थान छोड़ता है।
- issue: ἀνάγκασον में दबाव की तीव्रता
  choice: विवश कर
  alternative: बहुत आग्रह कर
  rationale: मुख्य पाठ में यूनानी क्रिया की प्रबलता को नरम नहीं किया गया है। फिर भी दृष्टान्त में इसे शारीरिक बल का आदेश मानना आवश्यक नहीं; इस वास्तविक अर्थ-सीमा को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली रखी गई है। ‘दास’ ऐतिहासिक अधीन स्थिति को सुरक्षित रखता है; ‘मालिक’ दृष्टान्त के घरेलू-सामाजिक सम्बन्ध को स्पष्ट करता है।
