  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: hi
  text: और दूसरे ने कहा[a], “मैंने पाँच जोड़ी बैल खरीदे हैं और उन्हें परखने जा रहा हूँ। मैं तुमसे विनती करता हूँ, मुझे क्षमा किया हुआ समझो[b]।”
  philosophy: optimal-equivalence
  footnotes:
