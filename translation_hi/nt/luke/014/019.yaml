    text: या, “एक और व्यक्ति ने कहा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मुझे क्षमा किया हुआ रखो”; अर्थात, मुझे छूट पाया हुआ समझो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: एक दूसरे
  rationale: निमंत्रित लोगों की क्रमिक प्रतिक्रियाओं में यह किसी अन्य व्यक्ति को स्वाभाविक रूप से दर्शाता है।
- source_word: Ζεύγη βοῶν ... πέντε
  choice: पाँच जोड़ी बैल
  rationale: ζεῦγος यहाँ काम के लिए जोते जाने वाले दो बैलों की जोड़ी है; ‘पाँच जोड़ी बैल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἠγόρασα
  choice: मैंने ... खरीदे हैं
  rationale: यूनानी अओरिस्ट खरीद की पूर्ण घटना बताता है, और हिन्दी पूर्ण भूत वर्तमान बहाने से उसका तात्कालिक संबंध सहज रूप से व्यक्त करता है।
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: उन्हें परखने जा रहा हूँ
  rationale: πορεύομαι वर्तमान गमन या तत्काल अभिप्राय और δοκιμάσαι बैलों की क्षमता जाँचने का भाव देता है; ‘परखने’ में व्यावहारिक परीक्षण का अर्थ बना रहता है।
- source_word: ἐρωτῶ σε
  choice: मैं तुमसे विनती करता हूँ
  rationale: ἐρωτάω यहाँ सामान्य प्रश्न नहीं बल्कि विनम्र अनुरोध है; ‘विनती करता हूँ’ प्रसंगानुकूल आग्रह व्यक्त करता है।
- source_word: ἔχε με παρῃτημένον
  choice: मुझे क्षमा किया हुआ मानो
  rationale: ἔχε और पूर्ण निष्क्रिय कृदन्त का संयोग व्यक्ति को पहले से छूट पाया हुआ मानने का अनुरोध करता है; यह अनुवाद उस परिणामी अवस्था को बनाए रखता है।
