source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: hi
  text: वह न तो मिट्टी के लिए और न खाद के ढेर के लिए[a] उपयुक्त है; लोग उसे बाहर फेंक देते हैं। जिसके सुनने के कान हों[b], वह सुन ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गोबर के ढेर के लिए।’
    reason: lexical_alternative
  - marker: b
    text: या ‘जिस किसी के सुनने के कान हों, वह सुन ले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: मिट्टी
  rationale: यहाँ कृषि-संदर्भ में खेती की मिट्टी अभिप्रेत है, न कि ब्रह्मांडीय अर्थ में ‘पृथ्वी’।
- source_word: κοπρίαν
  choice: खाद का ढेर
  rationale: शब्द गोबर अथवा उससे बनी खाद के ढेर को दर्शाता है; ‘खाद का ढेर’ आधुनिक हिन्दी में स्वाभाविक और कृषि-संदर्भ के अनुकूल है।
- source_word: εὔθετόν
  choice: उपयुक्त
  rationale: यह चयन किसी उपयोग के योग्य अथवा काम आने लायक होने का मूल्यांकन व्यक्त करता है, बिना अर्थ को केवल ‘उपयोगी’ तक सीमित किए।
- source_word: ἔξω βάλλουσιν αὐτό
  choice: लोग उसे बाहर फेंक देते हैं
  rationale: यूनानी में क्रिया सक्रिय बहुवचन है और कर्ता अनिश्चित है; ‘लोग’ इस अनिश्चित कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है और ठोस चित्र बनाए रखता है।
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: जिसके सुनने के कान हों, वह सुन ले
  rationale: यह प्रचलित उपदेशात्मक सूत्र यूनानी के संबंधवाचक भाव और तीसरे पुरुष की आज्ञा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: समापन आह्वान में प्रतिनिधिक पुल्लिंग
  choice: जिसके सुनने के कान हों, वह सुन ले
  alternative: जिस किसी के सुनने के कान हों, वह सुने
  rationale: यूनानी व्याकरणतः पुल्लिंग एकवचन है, पर सामान्य रूप से हर सुनने वाले पर लागू होता है। हिन्दी का ‘जिसके... वह’ इस प्रतिनिधिक अर्थ को स्वाभाविक ढंग से बनाए रखता है और अनावश्यक रूप से किसी एक पुरुष तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कृषि-चित्र की ठोसता बनाए रखने वाली है। ‘लोग’ यूनानी के अनिश्चित बहुवचन कर्ता को स्वाभाविक रूप देता है।
