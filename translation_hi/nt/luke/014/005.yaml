source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: hi
  text: और उसने उनसे कहा[a], “तुम में से किसका बेटा या बैल कुएँ में गिर जाए, और वह उसे सब्त के दिन तुरंत बाहर न निकाले?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “बेटा” के स्थान पर “गधा” है।
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: तुममें से ऐसा कौन है जिसका
  rationale: यूनानी संबंधवाचक प्रश्न को स्वाभाविक हिन्दी में इस प्रकार व्यक्त किया गया है; इससे अलंकारिक प्रश्न की धार बनी रहती है।
- source_word: υἱὸς
  choice: बेटा
  rationale: मूल शब्द पुल्लिंग एकवचन में विशेष रूप से ‘बेटा’ है, इसलिए अधिक सामान्य ‘बच्चा’ नहीं चुना गया।
- source_word: βοῦς
  choice: बैल
  rationale: यह बोविड जाति के पशु, विशेषकर काम में लगाए जाने वाले बैल, का प्रचलित और संदर्भानुकूल हिन्दी रूप है।
- source_word: φρέαρ
  choice: कुआँ
  rationale: मूल शब्द यहाँ स्वाभाविक रूप से कुएँ को सूचित करता है; समानांतर प्रसंगों के आधार पर इसे ‘गड्ढा’ नहीं बनाया गया।
- source_word: πεσεῖται
  choice: गिर जाए
  rationale: भविष्यकालीन रूप इस शर्तसूचक अलंकारिक प्रश्न में हिन्दी के संभावनार्थक ‘गिर जाए’ से स्वाभाविक और सटीक रूप से व्यक्त होता है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह बचाव में किसी विलंब के न होने पर दिए गए मूल बल को स्पष्ट रखता है।
- source_word: ἀνασπάσει
  choice: बाहर न निकाले
  rationale: क्रिया नीचे से ऊपर खींचकर निकालने का बोध देती है; हिन्दी में ‘बाहर निकाले’ स्वाभाविक है और कुएँ से बचाने का आशय स्पष्ट करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: एकवचन सर्वनाम बेटा या बैल—दोनों की ओर लौट सकता है और हिन्दी में अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: सब्त के दिन
  rationale: यह ‘दिन’ को स्पष्ट रखते हुए मूल पदबंध का सहज और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: उदाहरण में कुएँ में गिरने वाले की पाठांतर-संबंधी पहचान
  choice: बेटा या बैल
  alternative: गधा या बैल
  rationale: दिए गए SBLGNT पाठ में υἱὸς (‘बेटा’) है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। कुछ हस्तलिपियों का ‘गधा’ पाठ पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में नहीं मिलाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए प्रसंगानुकूल ‘तुम’ और संक्षिप्त, गरिमापूर्ण अलंकारिक प्रश्न। ‘सब्त’ बाइबलीय सांस्कृतिक शब्द को बनाए रखता है।
