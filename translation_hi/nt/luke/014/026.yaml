source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: hi
  text: यदि कोई मेरे पास आता है और अपने पिता, माता, पत्नी, बच्चों, भाइयों और बहनों से—यहाँ तक कि अपने जीवन से भी[b]—घृणा नहीं करता[a], तो वह मेरा शिष्य नहीं हो सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे अपने पिता, माता, पत्नी, बच्चों, भाइयों और बहनों को—और यहाँ तक कि अपने जीवन को भी—से अधिक प्रिय नहीं मानता।” क्रिया का शाब्दिक अर्थ “घृणा करना” है, पर इस प्रसंग में यह माँग प्रकट होती है कि यीशु के प्रति निष्ठा निकटतम पारिवारिक संबंधों से भी बढ़कर हो; तुलना करें मत्ती 10:37।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने प्राण से भी।” यहाँ ψυχή का संभावित अर्थ शिष्यत्व की कीमत के प्रसंग में व्यक्ति का अपना जीवन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: घृणा नहीं करता
  rationale: यूनानी क्रिया का सीधा अर्थ ‘घृणा करना’ है। मुख्य पाठ में इसकी कठोर और चौंकाने वाली अभिव्यक्ति बनाए रखी गई है; निकट संबंधों की अपेक्षा यीशु को सर्वोच्च निष्ठा देने का तुलनात्मक भाव पादटिप्पणी में दिया गया है।
- source_word: ἔρχεται πρός με
  choice: मेरे पास आता है
  rationale: यह πρός के साथ प्रयुक्त वाक्यांश का सीधा और स्वाभाविक अनुवाद है; ‘मेरे पीछे आता है’ कहना मूल अभिव्यक्ति से अलग शिष्यत्व-संबंधी मुहावरा जोड़ देता।
- source_word: πατέρα ἑαυτοῦ
  choice: अपने पिता
  rationale: ‘अपने’ यूनानी निजवाचक ἑαυτοῦ के व्यक्तिगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: परिवार के सदस्यों की इस सूची में γυνή का प्रसंगानुकूल अर्थ ‘पत्नी’ है।
- source_word: τὰ τέκνα
  choice: बच्चों
  rationale: ‘बच्चे’ τέκνα का सहज, लिंग-समावेशी और आधुनिक हिन्दी रूप है।
- source_word: ἀδελφοὺς καὶ τὰς ἀδελφάς
  choice: भाइयों और बहनों
  rationale: मूल पाठ में पुल्लिंग और स्त्रीलिंग, दोनों सहोदर शब्द स्पष्ट रूप से आए हैं, इसलिए दोनों को रखा गया है।
- source_word: ἔτι τε καὶ
  choice: यहाँ तक कि ... भी
  rationale: यह हिन्दी अभिव्यक्ति सूची की अंतिम बात पर दिए गए चरम बल को स्वाभाविक ढंग से प्रकट करती है।
- source_word: ψυχὴν ἑαυτοῦ
  choice: अपने जीवन से
  rationale: शिष्यत्व की कीमत के इस प्रसंग में ψυχή मुख्यतः व्यक्ति के अपने जीवन को सूचित करता है, न कि अनिवार्य रूप से शरीर से अलग किसी तत्त्व को।
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: वह मेरा शिष्य नहीं हो सकता
  rationale: यह असमर्थता अथवा शिष्यत्व के साथ असंगति के बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: क्या μισεῖ की कठोर अभिव्यक्ति को मुख्य पाठ में तुलनात्मक अर्थ देकर नरम किया जाए
  choice: मुख्य पाठ में ‘घृणा नहीं करता’ रखा गया और तुलनात्मक/प्राथमिकता का संभावित भाव पादटिप्पणी में समझाया गया।
  alternative: मुख्य पाठ में ‘मुझसे कम प्रेम नहीं करता’ या ‘कम प्रिय नहीं मानता’ लिखा जा सकता था।
  rationale: यीशु के कथन का जानबूझकर चौंकाने वाला रूप और उसकी धर्मवैचारिक खींचतान सुरक्षित रहनी चाहिए। साथ ही, मत्ती 10:37 से स्पष्ट होने वाला सर्वोच्च निष्ठा का तुलनात्मक भाव पाठक के लिए पादटिप्पणी में उपलब्ध है।
- issue: इस पद में ψυχή का अर्थ
  choice: ‘जीवन’
  alternative: ‘प्राण’ या ‘स्वयं’
  rationale: यहाँ विषय शिष्यत्व की कीमत और अपने जीवन पर अंतिम अधिकार छोड़ना है। ‘जीवन’ आधुनिक हिन्दी में इस प्रसंग का अर्थ स्पष्ट करता है, जबकि ‘प्राण’ को वैकल्पिक शाब्दिक रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घृणा’ की कठोरता मूल यूनानी के तनाव को सुरक्षित रखती है, जबकि डैश और ‘यहाँ तक कि ... भी’ सूची के चरम बिंदु को स्पष्ट करते हैं।
