  terminology: ‘अंतिम स्थान’ preserves the lexical ambiguity of τὸν ἔσχατον τόπον, while the footnote correctly explains the banquet-context implication of the lowest place of honor. ‘लज्जित’ suitably conveys αἰσχύνη in this social setting.
