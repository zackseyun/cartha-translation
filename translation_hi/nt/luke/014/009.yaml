  source_fidelity: 'The draft accurately represents the sequence and sense of the Greek: the inviter of both guests comes and speaks; the imperative requires yielding one’s place; and the addressee then begins, shamefully, to occupy the last place. ‘अपनी जगह’ appropriately makes explicit the contextual implication of Δὸς τούτῳ τόπον without altering the sense.'
