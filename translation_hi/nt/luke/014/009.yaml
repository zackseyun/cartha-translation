id: LUK.14.9
reference: Luke 14:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: hi
  text: और जिसने तुम्हें और उसे बुलाया था, वह आकर तुमसे कहेगा, “अपनी जगह इस व्यक्ति को दे दो।” तब तुम लज्जित होकर अंतिम स्थान[a] ग्रहण करने लगोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे नीचा स्थान।” यूनानी अभिव्यक्ति τὸν ἔσχατον τόπον क्रम में अंतिम स्थान को दर्शा सकती है और इस भोज के प्रसंग में सम्मान की दृष्टि से सबसे नीची जगह का अर्थ भी रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: जिसने तुम्हें और उसे बुलाया था
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत निमंत्रण देने वाले व्यक्ति को दर्शाता है। यह अनुवाद दोनों अतिथियों का अलग-अलग उल्लेख बनाए रखता है और प्रसंग से मेज़बान का भाव स्पष्ट होने देता है।
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: वह आकर तुमसे कहेगा
  rationale: भूतकालिक कृदंत मुख्य भविष्यकालीन क्रिया से पहले होने वाली क्रिया बताता है। हिंदी में ‘आकर ... कहेगा’ क्रम और वाक्य-प्रवाह दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Δὸς τούτῳ τόπον
  choice: अपनी जगह इस व्यक्ति को दे दो
  rationale: भोज के प्रसंग में आदेश का अर्थ केवल स्थान बनाना नहीं, बल्कि अपना स्थान दूसरे अतिथि को सौंपना है। ‘अपनी’ प्रसंग में निहित अर्थ को स्पष्ट करता है।
- source_word: μετὰ αἰσχύνης
  choice: लज्जित होकर
  rationale: αἰσχύνη सामाजिक अपमान और लज्जा का भाव रखता है। ‘लज्जित होकर’ आधुनिक हिंदी में स्वाभाविक है और केवल हल्की झेंप की अपेक्षा अधिक प्रबल भाव व्यक्त करता है।
- source_word: τὸν ἔσχατον τόπον
  choice: अंतिम स्थान
  rationale: ἔσχατος का मूल भाव ‘अंतिम’ है; भोज में यह सम्मान-क्रम की सबसे नीची जगह भी सूचित कर सकता है। मुख्य पाठ मूल अभिव्यक्ति को बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: κατέχειν
  choice: ग्रहण करने
  rationale: यहाँ क्रिया किसी स्थान को लेने या उस पर रहने के अर्थ में है। ‘स्थान ग्रहण करना’ हिंदी में भोज की बैठक-व्यवस्था के लिए स्पष्ट और गरिमापूर्ण है।
