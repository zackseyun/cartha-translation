source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: hi
  text: यीशु ने उत्तर देते हुए व्यवस्था के विशेषज्ञों और फ़रीसियों से कहा, “क्या सब्त के दिन चंगा करना अनुमत है या नहीं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: तब ... कहा
  rationale: यह यूनानी कथात्मक पदबंध प्रायः किसी स्थिति या निहित चुनौती के प्रत्युत्तर में बोलने का परिचय देता है। हिंदी में ‘उत्तर देकर कहा’ अस्वाभाविक और अनावश्यक रूप से दोहरावपूर्ण होता; ‘तब ... कहा’ प्रसंगगत प्रत्युत्तर और वाणी—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: νομικοὺς
  choice: व्यवस्था के जानकारों
  rationale: यहाँ आधुनिक वकील नहीं, यहूदी/मूसा की व्यवस्था के विशेषज्ञ अभिप्रेत हैं। यह चयन अर्थ को सामान्य हिंदी पाठक के लिए स्पष्ट रखता है।
- source_word: Φαρισαίους
  choice: फ़रीसियों
  rationale: धार्मिक समूह के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: Ἔξεστιν
  choice: व्यवस्था के अनुसार उचित है
  rationale: सब्त-विवाद के संदर्भ में यह पद केवल सामान्य अनुमति नहीं, बल्कि व्यवस्था-सम्मत होने का प्रश्न उठाता है।
- source_word: τῷ σαββάτῳ
  choice: सब्त के दिन
  rationale: कालवाचक दत्तिव का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: θεραπεῦσαι
  choice: चंगा करना
  rationale: सुसमाचारों में शारीरिक आरोग्य प्रदान करने के लिए प्रचलित और अर्थानुकूल हिंदी अभिव्यक्ति।
- source_word: ἢ οὔ
  choice: या नहीं
  rationale: वैकल्पिक प्रश्न के संक्षिप्त और स्वाभाविक हिंदी अंत को सुरक्षित रखता है।
theological_decisions:
- issue: सब्त संबंधी वैधानिक प्रश्न को यीशु के निष्कर्ष से पहले खुला रखना
  choice: क्या सब्त के दिन चंगा करना व्यवस्था के अनुसार उचित है या नहीं?
  alternative: क्या सब्त के दिन चंगा करने की अनुमति है या नहीं?
  rationale: अनुवाद प्रश्न के व्यवस्था-संबंधी बल को बनाए रखता है, पर दया, आवश्यकता या यीशु के अधिकार के विषय में कोई निष्कर्ष इस पद में पहले से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। ‘व्यवस्था के जानकार’ νομικοί का धार्मिक-विधिक आशय सीधे बताता है; इसलिए फुटनोट आवश्यक नहीं है।
