id: LUK.14.1
reference: Luke 14:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: hi
  text: ऐसा हुआ कि जब वह सब्त के दिन फरीसियों के अगुओं में से किसी एक के घर भोजन करने[a] गया, तो वे उसे ध्यान से देख रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोटी खाने”; यह अभिव्यक्ति भोजन करने के अर्थ में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर कड़ी नज़र रखे हुए थे”; यूनानी शब्द संदेहपूर्ण या शत्रुतापूर्ण निगरानी का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य घटना-परिचायक कथन-शैली को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: जब वह ... गया
  rationale: ἐν के साथ प्रयुक्त articular infinitive समयसूचक है; यह रूप उसके अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἶκόν
  choice: घर
  rationale: यह मूल शब्द का सीधा और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: फरीसियों के अगुओं में से किसी एक के
  rationale: यह genitive construction और समूह में से एक व्यक्ति के भाव को सुरक्षित रखता है; ‘अगुआ’ ἀρχών के नेतृत्व-सूचक अर्थ को बिना अनावश्यक राजनीतिक अर्थ जोड़े व्यक्त करता है।
- source_word: σαββάτῳ
  choice: सब्त के दिन
  rationale: Dative यहाँ समयसूचक है; यह हिन्दी में स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: φαγεῖν ἄρτον
  choice: भोजन करने
  rationale: शाब्दिक अर्थ ‘रोटी खाने’ है, पर यह यूनानी मुहावरा सामान्यतः भोजन करने को दर्शाता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: παρατηρούμενοι
  choice: ध्यान से देख रहे थे
  rationale: यह सतर्क निरीक्षण का अर्थ देता है, पर अपने आप शत्रुतापूर्ण मंशा निश्चित नहीं करता।
- source_word: αὐτοὶ
  choice: वे
  rationale: यूनानी सर्वनाम में कुछ बल है, लेकिन हिन्दी में ‘वे’ प्रसंगगत विषय को स्वाभाविक रूप से व्यक्त करता है; ‘वे स्वयं’ यहाँ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: यीशु पर नज़र रखने वालों की संभावित शत्रुतापूर्ण मंशा
  choice: वे उसे ध्यान से देख रहे थे
  alternative: वे उस पर कड़ी नज़र रखे हुए थे / वे उसकी ताक में थे
  rationale: παρατηρέω संदेहपूर्ण या शत्रुतापूर्ण निगरानी का संकेत दे सकता है, पर इस पद में मंशा स्पष्ट रूप से नहीं कही गई। चुना गया रूप कथात्मक तनाव बनाए रखता है और आरोप को मूल से अधिक प्रबल नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और कथात्मक है। ‘सब्त’ और ‘फरीसी’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। ‘अगुआ’ नेतृत्व का भाव देता है, जबकि ‘ध्यान से देख रहे थे’ मूल पाठ में निहित तनाव को बिना अतिव्याख्या के बनाए रखता है।
