  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य संख्याओं के साथ ‘सैनिकों’ को निहित अर्थ स्पष्ट करने के लिए जोड़ा गया है।
