id: LUK.14.31
reference: Luke 14:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: hi
  text: या कौन-सा राजा, किसी दूसरे राजा से युद्ध में भिड़ने के लिए जाते समय, पहले बैठकर यह विचार नहीं करेगा कि क्या वह अपने दस हज़ार सैनिकों के साथ उस राजा का सामना कर सकता है, जो बीस हज़ार सैनिकों के साथ उसके विरुद्ध आ रहा है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह यीशु के दूसरे उदाहरण को पहले उदाहरण से जोड़ता है और प्रश्नात्मक प्रवाह बनाए रखता है।
- source_word: τίς βασιλεὺς
  choice: कौन-सा राजा
  rationale: सामान्य अर्थ वाले आलंकारिक प्रश्न के लिए स्वाभाविक आधुनिक हिन्दी।
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: किसी दूसरे राजा से युद्ध में भिड़ने के लिए जाते समय
  rationale: वाक्यांश सशस्त्र मुठभेड़ की ओर जाने को दर्शाता है; ‘भिड़ने’ से युद्ध का भाव स्पष्ट होता है, बिना परिणाम तय किए।
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: पहले बैठकर यह विचार नहीं करेगा
  rationale: οὐχί अपेक्षित सकारात्मक उत्तर वाला आलंकारिक प्रश्न बनाता है; बैठकर विचार करने का क्रम भी सुरक्षित है।
- source_word: εἰ δυνατός ἐστιν
  choice: क्या वह ... कर सकता है
  rationale: यह क्षमता का आकलन व्यक्त करता है और हिन्दी में सहज है।
- source_word: ἐν δέκα χιλιάσιν
  choice: अपने दस हज़ार सैनिकों के साथ
  rationale: सैन्य प्रसंग में संख्या से सैनिकों का संकेत है; ‘अपने’ उपलब्ध सेना को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὑπαντῆσαι
  choice: सामना कर सकता है
  rationale: मूल क्रिया का आधारभूत अर्थ आगे बढ़कर मिलने का है, जबकि यहाँ सैन्य विरोध का संदर्भ है; ‘सामना करना’ दोनों पहलुओं को उपयुक्त रूप से समेटता है।
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: उस राजा का ... जो बीस हज़ार सैनिकों के साथ उसके विरुद्ध आ रहा है
  rationale: विरोधी राजा और उसकी बड़ी सेना को स्पष्ट करता है तथा ἐπ’ αὐτόν की शत्रुतापूर्ण दिशा बनाए रखता है।
theological_decisions: []
