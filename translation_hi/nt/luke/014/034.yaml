base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: hi
  text: इसलिए नमक अच्छा है; पर यदि नमक भी बेस्वाद हो जाए,[a] तो उसे किससे फिर स्वाद दिया जाएगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का शाब्दिक अर्थ ‘मूर्ख हो जाना’ भी हो सकता है, पर यहाँ नमक के लिए इसका अर्थ ‘स्वाद खो देना’ या ‘फीका हो जाना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: अच्छा
  rationale: यहाँ καλός नमक का सामान्य सकारात्मक मूल्यांकन करता है; ‘अच्छा’ स्वाभाविक है और उपयोगिता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछली शिक्षा से निष्कर्ष या संबंध सूचित करता है; ‘इसलिए’ इस संयोजक बल को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἅλας
  choice: नमक
  rationale: शाब्दिक और लोकोक्तिपरक चित्र को यथावत रखा गया है।
- source_word: ἐὰν δὲ καὶ
  choice: पर यदि ... भी
  rationale: '‘पर’ विरोध और ‘भी’ καί के बल को सुरक्षित रखते हैं: नमक जैसी वस्तु तक के बेस्वाद होने की स्थिति प्रस्तुत की गई है।'
- source_word: μωρανθῇ
  choice: बेस्वाद हो जाए
  rationale: μωραίνω का मूल अर्थ ‘मूर्ख होना’ हो सकता है, पर नमक के संदर्भ में इसका भाव स्वादहीन या फीका हो जाना है। ‘बेस्वाद हो जाए’ हिन्दी में स्वाभाविक है और आरंभिक/परिवर्तनकारी भाव रखता है।
- source_word: ἐν τίνι
  choice: किससे
  rationale: यह साधन का प्रश्न है; ‘किससे’ संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἀρτυθήσεται
  choice: स्वादिष्ट किया जाएगा
  rationale: ἀρτύω का अर्थ मसाला देकर स्वादयुक्त करना है। ‘स्वादिष्ट किया जाएगा’ पाक-संबंधी रूपक और कर्मवाच्य को बनाए रखता है; ‘फिर नमकीन बनाया जाएगा’ की तुलना में यह क्रिया के व्यापक अर्थ के निकट है।
theological_decisions:
- issue: नमक के कथन का रूपकात्मक अभिप्राय
  choice: लोकोक्ति को शाब्दिक चित्र के रूप में रखा गया है; शिष्यत्व संबंधी आशय को पद के भीतर स्पष्ट नहीं किया गया।
  alternative: ‘यदि शिष्य अपनी विशिष्टता खो दें’ जैसे व्याख्यात्मक विस्तार का प्रयोग करना।
  rationale: मूल पद नमक का चित्र प्रस्तुत करता है और उसका अनुप्रयोग प्रसंग पर छोड़ता है। अनुवाद में इसे खोल देने से मूल की रूपकात्मक और धर्मवैचारिक तनावपूर्ण खुली प्रकृति समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और लोकोक्तिपरक। ‘इसलिए’ प्रसंग-संबंध को स्पष्ट करता है। मुख्य वाक्य में रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
