  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ कि उन पुरुषों में से, जिन्हें निमंत्रित किया गया था, कोई भी मेरे भोज[a] का स्वाद नहीं चखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा रात्रि-भोज’ अथवा ‘मेरा महाभोज’।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुम लोगों से कहता हूँ
  rationale: यह अनुवाद γάρ के व्याख्यात्मक संबंध, λέγω की प्रत्यक्ष वाणी और बहुवचन ὑμῖν को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: उन पुरुषों में से ... कोई भी
  rationale: οὐδείς की पूर्ण निषेधात्मक शक्ति, ἀνδρῶν का पुरुषवाचक अर्थ और ἐκείνων का पूर्वोक्त लोगों की ओर संकेत—तीनों सुरक्षित रहते हैं।
- source_word: τῶν κεκλημένων
  choice: जिन्हें बुलाया गया था
  rationale: भोज के प्रसंग में καλέω का अर्थ निमंत्रण देना है; हिन्दी में ‘बुलाया गया था’ सहज है और पूर्ण निष्क्रिय कृदंत द्वारा व्यक्त पूर्व निमंत्रण को दर्शाता है।
- source_word: γεύσεταί
  choice: स्वाद नहीं चखेगा
  rationale: γεύομαι की स्वाद चखने वाली सजीव छवि को बनाए रखा गया है; प्रसंग में इससे भोज में भाग न पाने का भाव भी निकलता है।
- source_word: μου τοῦ δείπνου
  choice: मेरे भोज
  rationale: μου का प्रथम-पुरुष स्वामित्व स्पष्ट रखा गया है। δεῖπνον मुख्य अथवा संध्या-भोजन को सूचित कर सकता है और इस दृष्टान्त में ‘भोज’ स्वाभाविक तथा प्रसंगानुकूल है।
theological_decisions:
- issue: मेज़बान के कथन और दृष्टान्त के धर्मवैचारिक अर्थ का संबंध
  choice: प्रथम-पुरुष ‘मेरे भोज’ को रखते हुए कथन को दृष्टान्त की अपनी वाणी में रहने देना
  alternative: इसे स्पष्ट रूप से परमेश्वर के राज्य या मसीही भोज के रूप में व्याख्यायित करना
  rationale: मूल यूनानी कथावाचक स्तर पर मेज़बान का कथन देता है। अनुवाद में किसी विशिष्ट धर्मवैचारिक पहचान को जोड़ना मूल की कथात्मक और धर्मवैचारिक खुलावट को समय से पहले समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथन। ‘तुम लोगों’ से यूनानी बहुवचन स्पष्ट होता है; ‘भोज’ सामान्य पाठक के लिए स्वाभाविक है और दृष्टान्त के बड़े भोजन का भाव बनाए रखता है।
