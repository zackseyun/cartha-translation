  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: hi
  text: पर जब तुम्हें निमंत्रित किया जाए, तो जाकर सबसे नीची जगह पर बैठो[a], ताकि जब तुम्हें निमंत्रित करने वाला आए, तो वह तुमसे कहे, ‘मित्र, और ऊपर आओ[b]।’ तब तुम्हारे साथ भोजन करने वाले सभी लोगों के सामने तुम्हारा सम्मान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सबसे नीची जगह पर भोजन के लिए टिककर लेट जाओ।” यूनानी क्रिया विशेष रूप से भोजन करते समय टिककर लेटने की प्रथा को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “और अधिक ऊँचे स्थान पर आओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: तुम्हें बुलाया जाए
  rationale: भोज के प्रसंग में इसका अर्थ निमंत्रित किया जाना है। ‘बुलाया जाए’ स्वाभाविक हिन्दी है और इसी प्रसंग में निमंत्रण का भाव स्पष्ट रखता है।
- source_word: πορευθεὶς
  choice: जाकर
  rationale: यह कृदन्त मुख्य आज्ञा के साथ जुड़ी हुई क्रिया बताता है; ‘जाकर ... बैठो’ हिन्दी में सहज है।
- source_word: ἀνάπεσε
  choice: बैठो
  rationale: यूनानी क्रिया भोजन के समय मेज पर टिककर लेटने को सूचित करती है, पर आधुनिक हिन्दी में ‘बैठो’ अधिक सहज है; ऐतिहासिक भोजन-मुद्रा को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔσχατον τόπον
  choice: सबसे नीची जगह
  rationale: यह भोज में सबसे कम प्रतिष्ठित स्थान को दर्शाता है और ऊँचे-नीचे सम्मान की स्थानिक छवि बनाए रखता है।
- source_word: ὁ κεκληκώς σε
  choice: तुम्हें बुलाने वाला
  rationale: यह पूर्ण कृदन्त को स्पष्ट रूप से व्यक्त करता है और ‘मेज़बान’ जैसे थोड़े अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: Φίλε
  choice: मित्र
  rationale: यह विनम्र प्रत्यक्ष संबोधन का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: προσανάβηθι ἀνώτερον
  choice: और ऊपर आओ
  rationale: यह अधिक प्रतिष्ठित स्थान की ओर ऊपर बढ़ने की मूल छवि को बनाए रखता है।
- source_word: δόξα
  choice: सम्मान
  rationale: इस सामाजिक प्रसंग में शब्द सार्वजनिक प्रतिष्ठा या आदर को सूचित करता है, न कि आवश्यक रूप से ईश्वरीय महिमा को।
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: तुम्हारे साथ भोजन करने वाले सभी लोगों के सामने
  rationale: यह सार्वजनिक सम्मान और साझा भोज—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कथन का स्वरूप
  choice: इसे नम्रता और सम्मान के उलटाव पर भोज-दृष्टान्त के भीतर दी गई व्यावहारिक शिक्षा के रूप में रखा गया है।
  alternative: इसे केवल सामाजिक शिष्टाचार या केवल अंतकालीन प्रतिफल की शिक्षा मानना।
  rationale: पद भोज की सामाजिक छवि के द्वारा नम्रता और सम्मान की बात करता है, पर अनुवाद उसके सामाजिक अथवा अंतकालीन आशय को एकांगी रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘बैठो’ आधुनिक भोजन-प्रयोग के अनुकूल है, जबकि पादटिप्पणी मूल सांस्कृतिक मुद्रा सुरक्षित रखती है।
