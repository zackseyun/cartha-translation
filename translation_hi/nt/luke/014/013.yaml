  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: hi
  text: पर जब भी तुम भोज दो[a], तो गरीबों, अपंगों[b], लँगड़ों और अंधों को बुलाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दावत दो” अथवा “स्वागत-भोज आयोजित करो।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात शारीरिक अक्षमता या अंग-दोष वाले लोग; यूनानी शब्द का अर्थ-क्षेत्र व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: पर
  rationale: पिछले निर्देश के विपरीत अब किसे बुलाना चाहिए, यह बताने वाला स्वाभाविक और संक्षिप्त विरोधसूचक संयोजक।
- source_word: ὅταν
  choice: जब भी
  rationale: अनिश्चित कालवाचक उपवाक्य और पुनरावृत्तिमूलक भाव को व्यक्त करता है; बात किसी एक अवसर तक सीमित नहीं है।
- source_word: δοχὴν ποιῇς
  choice: तुम भोज दो
  rationale: यूनानी मुहावरे का अर्थ भोज या स्वागत-भोज आयोजित करना है। यह हिंदी में सहज है और केवल रात्रि-भोजन तक अर्थ को सीमित नहीं करता।
- source_word: κάλει
  choice: बुलाओ
  rationale: भोज के संदर्भ में καλέω का अर्थ निमंत्रित करना है; हिंदी में ‘भोज पर बुलाओ’ स्वाभाविक प्रयोग है।
- source_word: πτωχούς
  choice: गरीबों
  rationale: संज्ञावत विशेषण आर्थिक रूप से निर्धन लोगों के वर्ग को सूचित करता है।
- source_word: ἀναπείρους
  choice: अपंगों
  rationale: यह व्यापक शारीरिक अक्षमता या अंग-दोष वाले लोगों को सूचित करता है। ‘अपंग’ χωλούς के चलने-संबंधी विशिष्ट अर्थ से इसे यथासंभव अलग रखता है।
- source_word: χωλούς
  choice: लँगड़ों
  rationale: यह विशेष रूप से चलने में बाधा वाले लोगों को सूचित करता है और ἀναπείρους से अलग सूची-पद बनाए रखता है।
- source_word: τυφλούς
  choice: अंधों
  rationale: दृष्टिहीन लोगों के लिए प्रयुक्त संज्ञावत विशेषण का सीधा और प्रचलित हिंदी रूप।
theological_decisions:
- issue: शारीरिक अक्षमता से जुड़े दो अलग यूनानी पदों का आधुनिक हिंदी में निरूपण
  choice: ἀναπείρους के लिए ‘अपंगों’ और χωλούς के लिए ‘लँगड़ों’ का प्रयोग करके सूची का भेद बनाए रखना
  alternative: व्यक्ति-प्रथम भाषा में ‘शारीरिक अक्षमता वाले लोगों’ और ‘चलने में असमर्थ लोगों’ कहना, अथवा दोनों को एक ही व्यापक शब्द से व्यक्त करना
  rationale: पद का उद्देश्य सामाजिक रूप से उपेक्षित लोगों को आतिथ्य देने की आज्ञा है। अलग शब्द मूल यूनानी सूची की संरचना और व्यापक शारीरिक अक्षमता तथा चलने की विशिष्ट बाधा के बीच संभावित अंतर को सुरक्षित रखते हैं; पादटिप्पणी पहले पद के अर्थ-क्षेत्र को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और बोलचाल में समझ आने वाली आज्ञार्थक शैली। यूनानी की चार-पद वाली सूची सुरक्षित रखी गई है; disability-संबंधी ऐतिहासिक सामाजिक श्रेणियों को अनावश्यक व्याख्या से नहीं बदला गया।
