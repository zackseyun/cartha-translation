  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: hi
  text: नहीं तो ऐसा न हो कि नींव डालने के बाद वह उसे पूरा न कर सके, और देखनेवाले सब लोग उसका मज़ाक उड़ाने लगें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: नहीं तो ऐसा न हो कि
  rationale: यह पदबंध उस अनचाहे संभावित परिणाम की चेतावनी देता है जिससे बचना है; हिंदी में यह स्वाभाविक रूप से सावधानी और संभावना दोनों व्यक्त करता है।
- source_word: γέντος αὐτοῦ
  choice: नींव डालने के बाद वह
  rationale: 'क्षमा: स्रोत में θέντος αὐτοῦ है। यह genitive absolute मुख्य क्रिया से पहले हुई कार्रवाई को दिखाता है; हिंदी में ‘नींव डालने के बाद वह’ समय-क्रम स्पष्ट करता है।'
- source_word: θεμέλιον
  choice: नींव
  rationale: निर्माण के संदर्भ में यही सामान्य, सटीक और स्वाभाविक हिंदी शब्द है।
- source_word: μὴ ἰσχύοντος
  choice: न कर सके
  rationale: यहाँ ἰσχύω शारीरिक बल से अधिक सामर्थ्य या क्षमता को सूचित करता है; ‘न कर सके’ संभावित असमर्थता को सहज हिंदी में रखता है।
- source_word: ἐκτελέσαι
  choice: उसे पूरा
  rationale: निर्माण-कार्य को अंत तक पहुँचाने का भाव है; सर्वनाम ‘उसे’ नींव से आरंभ हुए निर्माण को स्वाभाविक रूप से संकेत करता है।
- source_word: πάντες οἱ θεωροῦντες
  choice: देखनेवाले सब लोग
  rationale: θεωρέω का अर्थ ध्यान से देखना या अवलोकन करना है; यह अनुवाद बिना अनावश्यक विस्तार के दृश्य के साक्षियों को व्यक्त करता है।
- source_word: ἄρξωνται
  choice: लगें
  rationale: ‘मज़ाक उड़ाने लगें’ आरंभ होने के अर्थ को तथा चेतावनी-वाक्य की संभाव्यता को स्वाभाविक रूप में व्यक्त करता है।
- source_word: αὐτῷ ἐμπαίζειν
  choice: उसका मज़ाक उड़ाने
  rationale: यह ἐμπαίζω के उपहास या खिल्ली उड़ाने के भाव को आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी में देता है।
theological_decisions: []
