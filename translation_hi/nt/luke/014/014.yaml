source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: hi
  text: और तुम धन्य होगे, क्योंकि वे तुम्हारा प्रत्युपकार नहीं कर सकते; क्योंकि धर्मियों के पुनरुत्थान के समय तुम्हें प्रतिफल दिया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: ‘धन्य’ यीशु के कथनों में निहित परमेश्वर की कृपा और भावी प्रतिफल का भार बनाए रखता है; ‘सुखी’ इसे केवल मनोदशा तक सीमित कर सकता है।
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: उनके पास तुम्हें बदला चुकाने का सामर्थ्य नहीं है
  rationale: यह यूनानी रचना शाब्दिक रूप से ‘उनके पास लौटाकर देने को नहीं है’ कहती है और यहाँ साधन या क्षमता की कमी व्यक्त करती है। यह हिंदी वाक्य दायित्व की अनुपस्थिति का गलत अर्थ आने से बचाता है।
- source_word: ἀνταποδοθήσεται
  choice: तुम्हें प्रतिफल दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखते हुए यह स्वाभाविक हिंदी में भावी प्रत्युपकार या पुरस्कार व्यक्त करता है।
- source_word: ἐν τῇ ἀναστάσει
  choice: पुनरुत्थान के समय
  rationale: ἐν यहाँ कालसूचक है; ‘के समय’ आधुनिक हिंदी में स्वाभाविक है और घटना के भीतर या अवसर पर होने का भाव देता है।
- source_word: τῶν δικαίων
  choice: धर्मियों के
  rationale: यह संक्षिप्त और स्थापित हिंदी अभिव्यक्ति है, जो नैतिक तथा धर्मवैज्ञानिक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
theological_decisions:
- issue: ‘धर्मियों के पुनरुत्थान’ का अभिप्राय
  choice: इसे धर्मियों से संबद्ध भावी पुनरुत्थान के रूप में सीधे अनूदित किया गया है।
  alternative: इसे या तो सामान्य पुनरुत्थान में धर्मियों पर बल, या दूसरों से अलग धर्मियों के पुनरुत्थान के रूप में समझा जा सकता है।
  rationale: पद स्वयं पुनरुत्थान में भावी ईश्वरीय प्रतिफल की पुष्टि करता है, पर पुनरुत्थान की घटनाओं का क्रम या संरचना निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बदला चुकाना’ यहाँ प्रत्युपकार के अर्थ में है, प्रतिशोध के अर्थ में नहीं; ‘प्रतिफल’ भावी ईश्वरीय प्रत्युपकार को स्वाभाविक रूप से व्यक्त करता है।
