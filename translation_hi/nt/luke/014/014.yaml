review_pass:
  verdict: revise
  source_fidelity: ‘धन्य होगे,’ ‘धर्मियों के पुनरुत्थान के समय,’ and the future passive ‘तुम्हें प्रतिफल दिया जाएगा’ accurately convey μακάριος, ἐν τῇ ἀναστάσει τῶν δικαίων, and ἀνταποδοθήσεται. The first reciprocal expression, however, is better rendered directly as inability to reciprocate, without the potentially misleading Hindi idiom ‘बदला चुकाना.’
  naturalness: The draft is generally clear and appropriately dignified. In modern Hindi, ‘तुम्हें बदला चुकाने’ can suggest retaliation and is less idiomatic for reciprocal repayment or return hospitality. ‘वे तुम्हारा प्रत्युपकार नहीं कर सकते’ is natural and clear in this context.
  terminology: ‘धन्य,’ ‘प्रतिफल,’ ‘पुनरुत्थान,’ and ‘धर्मी’ are suitable established biblical terms. ‘प्रत्युपकार’ accurately expresses reciprocal return without importing the retaliatory sense often associated with ‘बदला.’
  issues:
  - severity: medium
    issue: ‘तुम्हें बदला चुकाने’ is ambiguous and awkward in this context.
    rationale: Although the note explains the intended sense, ‘बदला’ commonly denotes revenge in current Hindi. The Greek ἀνταποδοῦναι refers here to repaying or reciprocating hospitality, so a non-retaliatory expression is preferable.
  revised_text: और तुम धन्य होगे, क्योंकि वे तुम्हारा प्रत्युपकार नहीं कर सकते; क्योंकि धर्मियों के पुनरुत्थान के समय तुम्हें प्रतिफल दिया जाएगा।
