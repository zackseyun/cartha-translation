  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: hi
  text: जो कोई अपना क्रूस नहीं ढोता और मेरे पीछे नहीं आता, वह मेरा चेला नहीं हो सकता।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपना क्रूस उठाता है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरे पीछे आता’; शिष्यत्व की प्रचलित अभिव्यक्ति ‘मेरे पीछे चलना’ से तुलना करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: जो कोई
  rationale: यह अनिश्चित सम्बन्धवाचक सर्वनाम एक सामान्य और सब पर लागू शर्त प्रस्तुत करता है; ‘जो कोई’ हिन्दी में स्वाभाविक रूप से उसका व्यापक बल बनाए रखता है।
- source_word: βαστάζει
  choice: उठाता
  rationale: क्रूस के ठोस बिंब के साथ ‘उठाना’ सहज हिन्दी है और उसे ढोने तथा शिष्यत्व की कीमत सहने—दोनों अर्थ-छायाओं को खुला रखता है।
- source_word: τὸν σταυρόν
  choice: क्रूस
  rationale: σταυρός के लिए प्रचलित और सटीक बाइबलीय शब्द; यहाँ यह मृत्युदंड के साधन तथा शिष्यत्व की कीमत और लज्जा का बिंब है।
- source_word: ἑαυτοῦ
  choice: अपना
  rationale: एकवचन आत्मवाचक सर्वनाम का बल स्वाभाविक हिन्दी में ‘अपना’ से सुरक्षित रहता है; ‘जो कोई’ के कारण कथन का सामान्य अनुप्रयोग स्पष्ट है।
- source_word: ἔρχεται ὀπίσω μου
  choice: मेरे पीछे आता
  rationale: यह मूल अभिव्यक्ति के स्थानिक और गतिशील बिंब को बनाए रखता है, साथ ही शिष्य के रूप में अनुसरण करने का आशय भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: मेरा चेला नहीं हो सकता
  rationale: यह केवल निषेध नहीं, बल्कि असमर्थता अथवा असंगति का बल व्यक्त करता है। ‘चेला’ सुसमाचारों के शिष्यत्व-संदर्भ में साधारण पाठकों के लिए परिचित और स्वाभाविक है।
theological_decisions:
- issue: एकवचन आत्मवाचक सर्वनाम का सामान्य, सब पर लागू बल
  choice: ‘अपना क्रूस’ के द्वारा एकवचन और आत्मवाचक बल बनाए रखा गया
  alternative: ‘अपने-अपने क्रूस’ या बहुवचन रूप
  rationale: यूनानी पाठ व्याकरणिक रूप से एकवचन है, जबकि ὅστις इसे सार्वत्रिक शर्त बनाता है। हिन्दी ‘जो कोई अपना’ लिंग को अनावश्यक रूप से उभारने के बिना दोनों विशेषताओं को सुरक्षित रखता है।
- issue: क्रूस का बिंब—शाब्दिक वहन और शिष्यत्व की कीमत
  choice: बिंब को ‘क्रूस उठाता’ के रूप में बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘दुःख सहता’ या ‘बलिदान करता’
  rationale: व्याख्यात्मक विकल्प बिंब को किसी एक धार्मिक अर्थ तक सीमित कर देते; मूल कथन मृत्युदंड, लज्जा, कष्ट और शिष्यत्व की कीमत की तनावपूर्ण अर्थ-सीमा को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘क्रूस’ और ‘चेला’ स्थापित बाइबलीय शब्द हैं; वाक्य-विन्यास मूल यूनानी की सामान्य शर्त और निर्णायक निष्कर्ष को स्पष्ट रखता है।
