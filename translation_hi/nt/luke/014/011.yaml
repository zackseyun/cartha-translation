  verdict: revise
  source_fidelity: The draft correctly preserves the explanatory force of ὅτι, the universal proverbial construction, the reflexive sense, the future passive verbs, the implicit agent, and the balanced two-part structure. However, ‘अपने आप को दीन करता है’ is not the best equivalent for ταπεινῶν ἑαυτόν in this context.
