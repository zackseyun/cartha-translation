  terminology: Use ‘नम्र’ for self-humbling here. Retain ‘ऊँचा’/‘नीचा’ for the deliberate lexical and rhetorical contrast of ὑψόω and ταπεινόω, without specifying the unstated agent of the passive verbs. The generic singular Hindi construction is appropriate; the footnote accurately explains its inclusive application.
