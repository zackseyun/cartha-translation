  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: hi
  text: क्योंकि जो कोई अपने आप को ऊँचा करता है, वह नीचा किया जाएगा; और जो अपने आप को नम्र करता है, वह ऊँचा किया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में एकवचन पुल्लिंग रूप सामान्य अर्थ में प्रयुक्त हुए हैं; यह कथन स्त्री और पुरुष, सभी पर लागू है।
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पिछली शिक्षा का कारण बताता है। ‘क्योंकि’ यूनानी संयोजक की व्याख्यात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: जो कोई अपने आप को ऊँचा करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत और πᾶς मिलकर सार्वभौमिक, लोकोक्तिपरक कथन बनाते हैं। यह हिन्दी अभिव्यक्ति उस व्यापक अर्थ और आत्म-उन्नयन के भाव को स्पष्ट रखती है।
- source_word: ταπεινωθήσεται
  choice: नीचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए यह ὑψόω के साथ ऊँचा–नीचा का अर्थगत विरोध स्पष्ट करता है।
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: जो अपने आप को दीन करता है
  rationale: यह स्वेच्छा से स्वयं को नम्र अथवा निम्न स्थान पर रखने का भाव व्यक्त करता है और यूनानी कृदंत की सामान्य, प्रतिनिधिक शक्ति बनाए रखता है।
- source_word: ὑψωθήσεται
  choice: ऊँचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य और पहले खंड के साथ समानांतर रचना दोनों सुरक्षित रहते हैं; कर्ता को अनुवाद में स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: καὶ
  choice: और
  rationale: यूनानी दोनों विरोधी खंडों को समन्वित करता है। हिन्दी में ‘और’ मूल संयोजन को बनाए रखता है, जबकि विरोध वाक्य की समानांतर संरचना से स्पष्ट है।
theological_decisions:
- issue: दोनों भविष्यत् कर्मवाच्य क्रियाओं का अनकहा कर्ता
  choice: कर्मवाच्य को बनाए रखते हुए ‘परमेश्वर के द्वारा’ न जोड़ना
  alternative: वह परमेश्वर के द्वारा नीचा/ऊँचा किया जाएगा
  rationale: व्यापक बाइबिलीय विषय में परमेश्वर का कर्तृत्व निहित हो सकता है, पर यूनानी पाठ कर्ता का नाम नहीं लेता। उसे अनकहा रखना पाठ की वास्तविक धर्मवैचारिक गुंजाइश को सुरक्षित रखता है।
- issue: एकवचन पुल्लिंग का सामान्य प्रयोग
  choice: ‘जो कोई…करता है, वह…किया जाएगा’ की प्रतिनिधिक हिन्दी रचना
  alternative: बहुवचन या स्पष्ट लिंग-निरपेक्ष पुनर्रचना
  rationale: यूनानी में एकवचन पुल्लिंग रूप सामान्य अर्थ में सभी लोगों पर लागू होते हैं। हिन्दी में भी यह परंपरागत सामान्य रचना स्रोत के एकवचन और लोकोक्तिपरक बल को बनाए रखती है; पादटिप्पणी इसके समावेशी आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचा करता है/नीचा किया जाएगा’ तथा ‘दीन करता है/ऊँचा किया जाएगा’ मूल की संतुलित विरोधात्मक रचना को व्यक्त करते हैं। अर्धविराम दोनों समानांतर खंडों को स्पष्ट करता है।
