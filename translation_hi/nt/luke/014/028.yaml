base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: hi
  text: क्योंकि तुम में से कौन, जो एक मीनार बनाना चाहता है, पहले बैठकर उसकी लागत[a] का हिसाब नहीं लगाता कि उसके पास उसे पूरा करने के लिए पर्याप्त साधन हैं या नहीं?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके खर्च की गणना न करे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्या उसके पास पूरा करने के लिए है।” भाव यह है कि क्या उसके पास निर्माण पूरा करने के लिए पर्याप्त साधन हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: क्योंकि तुम में से कौन है
  rationale: यह श्रोताओं से किया गया आलंकारिक प्रश्न है; ‘क्योंकि’ γάρ के द्वारा पिछले कथन से संबंध बनाए रखता है।
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: जो एक मीनार बनाना चाहता हो
  rationale: यह अनुवाद इच्छा अथवा इरादे के सहभागी भाव को स्वाभाविक हिन्दी में रखता है और πύργος के ठोस बिंब को सुरक्षित रखता है।
- source_word: πρῶτον καθίσας
  choice: पहले बैठकर
  rationale: पूर्ववर्ती क्रिया का क्रम स्पष्ट और हिन्दी में सहज है।
- source_word: ψηφίζει τὴν δαπάνην
  choice: उसकी लागत का हिसाब लगाए
  rationale: ψηφίζω यहाँ निर्माण-व्यय की गणना करने को दर्शाता है; ‘लागत का हिसाब लगाना’ सामान्य और स्पष्ट हिन्दी है।
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: कि उसे पूरा करने के लिए उसके पास पर्याप्त साधन हैं या नहीं
  rationale: मूल का शाब्दिक अर्थ ‘क्या उसके पास पूरा करने के लिए है’ है; सन्दर्भ में निहित पर्याप्तता को ‘पर्याप्त साधन’ से स्पष्ट किया गया है।
