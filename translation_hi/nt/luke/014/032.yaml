lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: पर यदि नहीं
  rationale: यह पदबंध पिछले प्रश्न के नकारात्मक उत्तर की स्थिति बताता है। ‘पर यदि नहीं’ यूनानी की शर्तात्मक और विरोधसूचक बनावट को सुरक्षित रखता है।
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: जब दूसरा राजा अभी दूर ही होता है
  rationale: यह संबंधकारक निरपेक्ष रचना समकालीन परिस्थिति बताती है। संदर्भ में αὐτοῦ से विरोधी राजा अभिप्रेत है; ‘दूसरा राजा’ उसका संदर्भ स्पष्ट करता है।
- source_word: πρεσβείαν
  choice: एक प्रतिनिधिमंडल
  rationale: यह शब्द दूतमंडल या राजनयिक प्रतिनिधियों के समूह को दर्शा सकता है। ‘प्रतिनिधिमंडल’ आधुनिक, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀποστείλας
  choice: भेजकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले या उसके साथ जुड़ी हुई क्रिया दिखाता है। ‘भेजकर’ हिन्दी में क्रियाओं का क्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐρωτᾷ
  choice: पूछता है
  rationale: यहाँ क्रिया अनुरोध करने या माँगने के अर्थ में है। ‘शांति की शर्तें पूछता है’ सहज हिन्दी में वार्ता का भाव व्यक्त करता है।
- source_word: τὰ πρὸς εἰρήνην
  choice: शांति की शर्तें
  rationale: शाब्दिक अर्थ ‘शांति से संबंधित बातें’ है, पर युद्ध के प्रसंग में यह शांति स्थापित करने की शर्तों को सूचित करता है।
