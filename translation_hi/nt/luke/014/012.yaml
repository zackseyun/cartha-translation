reference: Luke 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: hi
  text: वह उस व्यक्ति से भी कह रहा था जिसने उसे निमंत्रित किया था, “जब तुम दोपहर का भोजन[a] या रात का भोज दो, तो अपने मित्रों, भाइयों, संबंधियों या धनी पड़ोसियों को मत बुलाओ। कहीं ऐसा न हो कि वे भी तुम्हें बदले में बुलाएँ[b] और वह तुम्हारे लिए प्रतिदान हो जाए[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द दिन के आरंभिक भोजन को दर्शाता है, जो प्रायः दोपहर के आसपास होता था; अनुवाद ‘दिन का भोजन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् वे भी प्रत्युत्तर में तुम्हें निमंत्रित करें।
    reason: lexical_clarification
  - marker: c
    text: यूनानी में अधिक शाब्दिक रूप से, ‘और वह तुम्हारे लिए प्रतिदान हो जाए।’
    reason: literal_rendering
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: वह यह भी कह रहा था
  rationale: अपूर्णकाल Ἔλεγεν की चल रही कथात्मक क्रिया को ‘कह रहा था’ से रखा गया है; καὶ का भाव ‘भी’ से व्यक्त होता है।
- source_word: τῷ κεκληκότι αὐτόν
  choice: जिसने उसे निमंत्रित किया था, उससे
  rationale: पूर्ण कृदंत पूर्व में दिए गए निमंत्रण की ओर संकेत करता है। यह रूप ‘मेज़बान’ की अपेक्षा मूल वाक्य के अधिक निकट और फिर भी स्वाभाविक है।
- source_word: Ὅταν ποιῇς
  choice: जब तुम ... दो
  rationale: भोजन के साथ ποιέω का आशय भोजन आयोजित करना या देना है, केवल उसे बनाना नहीं।
- source_word: ἄριστον
  choice: दोपहर का भोजन
  rationale: यह दिन के पहले या अपेक्षाकृत आरंभिक मुख्य भोजन को दर्शाता है, जो प्रायः दोपहर के आसपास होता था; आधुनिक हिन्दी में यह δεῖπνον से स्पष्ट भेद रखता है।
- source_word: δεῖπνον
  choice: रात का भोज
  rationale: यह सामान्यतः दिन के बाद के समय का प्रमुख भोजन था। ‘रात का भोज’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: μὴ φώνει
  choice: मत बुलाओ
  rationale: φωνέω का मूल अर्थ ‘बुलाना’ है और यहाँ भोजन के निमंत्रण का प्रसंग है।
- source_word: τοὺς φίλους σου
  choice: अपने मित्रों
  rationale: सामाजिक प्रसंग में φίλοι का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τοὺς ἀδελφούς σου
  choice: भाइयों
  rationale: मूल यूनानी में पुल्लिंग बहुवचन है; उसे अनावश्यक रूप से लिंग-निरपेक्ष नहीं बनाया गया है।
- source_word: τοὺς συγγενεῖς σου
  choice: संबंधियों
  rationale: यह रिश्तेदारों या कुटुंबियों के लिए व्यापक शब्द है; ‘संबंधी’ आधुनिक और स्पष्ट है।
- source_word: γείτονας πλουσίους
  choice: धनी पड़ोसियों
  rationale: πλουσίους सीधे γείτονας को विशेषित करता है; यह संक्षिप्त और स्वाभाविक अनुवाद है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका या चेतावनी व्यक्त करता है; हिन्दी का यह मुहावरा उसी भाव को स्वाभाविक ढंग से रखता है।
- source_word: ἀντικαλέσωσίν σε
  choice: वे भी तुम्हें बदले में बुलाएँ
  rationale: संयुक्त क्रिया का अर्थ प्रत्युत्तर में निमंत्रण देना है; ‘बदले में बुलाएँ’ पारस्परिकता को स्पष्ट रखता है।
- source_word: ἀνταπόδομά σοι
  choice: तुम्हें उसका प्रतिदान मिल जाए
  rationale: ἀνταπόδομα प्रत्युत्तर में मिलने वाले भुगतान या प्रतिफल को दर्शाता है। ‘प्रतिदान’ सामाजिक लेन-देन का भाव रखता है और ‘बदला’ के प्रतिशोधात्मक अर्थ से बचता है।
theological_decisions:
- issue: प्रतिदान का स्वरूप
  choice: वाक्य को सामाजिक प्रत्युपकार के सामान्य अर्थ में रखा गया है
  alternative: इसे स्पष्ट रूप से परमेश्वर से मिलने वाले अनन्त पुरस्कार या उसके अभाव के रूप में समझाना
  rationale: इस पद में तत्काल भाषा मनुष्यों द्वारा लौटाए गए निमंत्रण और उसके प्रतिदान की है। आगे के प्रसंग से व्यापक धार्मिक निहितार्थ निकल सकते हैं, पर उन्हें इस वाक्य में जोड़ना मूल की अस्पष्टता और तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन के लिए एकवचन आशय वाला सामान्य हिन्दी ‘तुम’ प्रयोग हुआ है। ‘दोपहर का भोजन’ और ‘रात का भोज’ मूल के दो भोजन-संबंधी शब्दों का अंतर बनाए रखते हैं।
