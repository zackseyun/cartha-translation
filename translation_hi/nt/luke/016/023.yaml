base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: hi
  text: और हेडीज़[a] में यातना सहते हुए, वह आँखें उठाकर दूर से अब्राहम को और लाज़र को उसकी गोद में[b] देखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मृतकों का लोक। यूनानी शब्द ‘हेडीज़’ है; यह ‘गेहन्ना’ से भिन्न है, जो अंतिम न्याय के स्थान के लिए प्रयुक्त होता है। कुछ अनुवादों में यहाँ ‘नरक’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी छाती/गोद में”; परंपरागत अभिव्यक्ति है, “अब्राहम की गोद में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: हेडीज़
  rationale: यूनानी विशिष्ट नाम को लिप्यंतरित किया गया है, ताकि इसे अंतिम न्याय के स्थान के अर्थ वाले ‘गेहन्ना’ के साथ न मिला दिया जाए; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: आँखें उठाकर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में मूल क्रिया-चित्र और परिस्थितिवाचक कृदन्त—दोनों को संक्षेप में बनाए रखता है।
- source_word: ὑπάρχων ἐν βασάνοις
  choice: यातना सहते हुए
  rationale: यूनानी बहुवचन का शब्दशः अस्वाभाविक अनुवाद करने के बजाय उसकी अवस्था और भीषण पीड़ा को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁρᾷ
  choice: देखता है
  rationale: मूल के सजीव वर्तमान काल को बनाए रखा गया है, यद्यपि कथा का व्यापक संदर्भ भूतकालीन है।
- source_word: ἀπὸ μακρόθεν
  choice: दूर से
  rationale: स्थानिक दूरी को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: उसकी गोद में
  rationale: κόλπος की निकटता, स्नेह और सम्मान की सांस्कृतिक छवि को सहज हिन्दी में व्यक्त करता है; ‘उसकी’ का निकटतम स्पष्ट पूर्वपद अब्राहम है।
theological_decisions:
- issue: ᾅδης को ऐसे प्रसंग में प्रस्तुत करना जिसका संबंध मृत्यु के बाद की अवस्था और दण्ड से जोड़ा जाता है
  choice: हेडीज़
  alternative: अधोलोक; मृतकों का लोक; नरक
  rationale: लिप्यंतरण यूनानी पद की विशिष्टता बनाए रखता है और इसे अंतिम न्याय के स्थान ‘गेहन्ना’ के साथ अनावश्यक रूप से एक नहीं करता। पादटिप्पणी साधारण पाठक के लिए अर्थ स्पष्ट करती है।
- issue: अब्राहम के κόλποις की छवि
  choice: उसकी गोद में
  alternative: अब्राहम की गोद में; उसकी छाती से लगा; उसके पास
  rationale: ‘गोद में’ मूल की आत्मीय निकटता को स्वाभाविक हिन्दी में बचाता है। सर्वनाम मूल पाठ की अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी पारंपरिक स्पष्ट रूप देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में मूल यूनानी का सजीव वर्तमान ‘देखता है’ सुरक्षित है। ‘हेडीज़’ जैसे अपेक्षाकृत अपरिचित पद को मुख्य पाठ में सटीकता के लिए रखा और पादटिप्पणी में समझाया गया है।
