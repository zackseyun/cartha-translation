  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संवाद में सीधेपन को रखा गया है और λέγει के ऐतिहासिक वर्तमान को भूतकाल में समतल नहीं किया गया। प्राचीन माप ‘कोर’ को सांस्कृतिक टिप्पणी सहित सुरक्षित रखा गया है।
