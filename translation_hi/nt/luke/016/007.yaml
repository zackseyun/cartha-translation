id: LUK.16.7
reference: Luke 16:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: hi
  text: फिर उसने एक और व्यक्ति से कहा, “और तुम पर कितना कर्ज़ है?” उसने कहा, “गेहूँ के सौ कोर[a]।” वह उससे कहता है, “अपना हिसाब-पत्र[b] लो और अस्सी लिख दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोर अनाज के लिए प्रयोग होने वाली एक बड़ी प्राचीन सूखी माप थी।
    reason: cultural_note
  - marker: b
    text: या “अपना कर्ज़नामा” अथवा “अपने दस्तावेज़”; यूनानी में शाब्दिक अर्थ “अपने लिखित दस्तावेज़” है, जो यहाँ कर्ज़दार के लिखित हिसाब या देनदारी-पत्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: फिर
  rationale: यह क्रम बताने वाला क्रियाविशेषण है; ‘फिर’ अगले कर्ज़दार की ओर बढ़ने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἑτέρῳ
  choice: एक और व्यक्ति से
  rationale: यह पिछले कर्ज़दार से भिन्न दूसरे व्यक्ति को दर्शाता है। ‘व्यक्ति’ स्पष्टता देता है, पर मूल में निहित न होने के कारण लिंग नहीं जोड़ता।
- source_word: Σὺ δὲ
  choice: और तुम
  rationale: सर्वनाम पर बल और δέ के हल्के संक्रमण/अंतर—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: πόσον ὀφείλεις
  choice: तुम पर कितना कर्ज़ है
  rationale: वित्तीय देनदारी के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: Ἑκατὸν κόρους σίτου
  choice: गेहूँ के सौ कोर
  rationale: κόρος एक विशिष्ट प्राचीन सूखी माप है, इसलिए सामान्य ‘माप’ कहने के बजाय उसका लिप्यंतरण रखा गया है; σῖτος इस संदर्भ में गेहूँ है।
- source_word: λέγει αὐτῷ
  choice: वह उससे कहता है
  rationale: यूनानी के ऐतिहासिक वर्तमान को सुरक्षित रखकर कथा की सजीवता बनाए रखता है।
- source_word: Δέξαι
  choice: लो
  rationale: दस्तावेज़ अपने हाथ में लेने की आज्ञा के लिए यह सबसे स्वाभाविक हिन्दी रूप है।
- source_word: σου τὰ γράμματα
  choice: अपना हिसाब-पत्र
  rationale: शाब्दिक अर्थ ‘तुम्हारे लिखित दस्तावेज़’ है, पर कर्ज़ के प्रसंग में यह लिखित हिसाब या देनदारी-पत्र को दर्शाता है। एकवचन कार्यगत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: γράψον ὀγδοήκοντα
  choice: अस्सी लिख दो
  rationale: लिखित राशि को अस्सी करने की आज्ञा को मूल के निकट और स्पष्ट रूप में व्यक्त करता है।
