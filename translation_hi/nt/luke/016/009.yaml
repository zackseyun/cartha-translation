source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: hi
  text: 'और मैं तुमसे कहता हूँ: अधर्म के धन[a] से अपने लिए मित्र बनाओ, ताकि जब वह समाप्त हो जाए[b], तो वे तुम्हारा स्वागत अनंत निवासों[c] में करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्म के मम्मोन से।’ ‘मम्मोन’ धन या पैसे के लिए प्रयुक्त, यूनानी पाठ में आया एक पारंपरिक सामी मूल का शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब वह चुक जाए’; अथवा ‘जब तुम्हारा अंत हो जाए।’ यूनानी क्रिया का कर्ता यहाँ स्पष्ट नहीं है। अधिकतर इसे धन के समाप्त होने से जोड़ते हैं, जबकि कुछ इसे व्यक्ति की मृत्यु के अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: c
    text: या ‘अनंत तंबुओं में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: अपने लिए मित्र बनाओ
  rationale: यह कर्मवाचक आज्ञा और आत्मवाचक भाव को स्वाभाविक आधुनिक हिन्दी में निकटता से व्यक्त करता है।
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: अधर्म के धन के द्वारा
  rationale: ‘के द्वारा’ प्रसंग में साधन का भाव स्पष्ट करता है। ‘अधर्म का धन’ अभिव्यक्ति को केवल बेईमानी से कमाए गए धन तक सीमित नहीं करती, बल्कि वर्तमान अन्यायपूर्ण व्यवस्था से जुड़े सांसारिक धन की व्यापक नैतिक जटिलता बनाए रखती है।
- source_word: μαμωνᾶ
  choice: धन
  rationale: यह आधुनिक हिन्दी में स्पष्ट और सहज है; पारम्परिक ‘मम्मोन’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῆς ἀδικίας
  choice: अधर्म के
  rationale: ‘अधर्म’ ἀδικία के अन्याय और नैतिक बुराई—दोनों से जुड़े व्यापक अर्थ को व्यक्त करता है; ‘बेईमानी का’ कहना अर्थ को अनुचित ढंग से केवल धोखे से अर्जित धन तक सीमित कर सकता था।
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: ताकि जब वह समाप्त हो जाए
  rationale: निकटतम सम्भावित संदर्भ ‘धन’ है और क्रिया उसके निष्फल या समाप्त हो जाने का भाव देती है। यूनानी में कर्ता स्पष्ट न होने के कारण दूसरे सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: δέξωνται ὑμᾶς
  choice: वे तुम्हारा स्वागत करें
  rationale: δέχομαι यहाँ किसी स्थान में ग्रहण करने और आतिथ्यपूर्वक स्वीकार करने का भाव देता है। ‘वे’ किसे सूचित करता है, इसे मूल पाठ की तरह अनिर्दिष्ट रखा गया है।
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: अनन्त निवासों में
  rationale: ‘निवास’ σκηνή के रहने के स्थान वाले प्रासंगिक भाव को सहज हिन्दी में देता है; शाब्दिक ‘तम्बुओं’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘अधर्म के धन’ का अर्थ
  choice: वर्तमान अधार्मिक संसार से जुड़ा सांसारिक धन; केवल धोखे से कमाया हुआ धन नहीं
  alternative: बेईमानी से अर्जित धन; अथवा प्रतिद्वन्द्वी स्वामी के रूप में व्यक्तिवाची ‘मम्मोन’
  rationale: अनुवाद वाक्य को केवल चोरी या धोखाधड़ी के धन तक सीमित नहीं करता और न ही यहाँ ‘मम्मोन’ का पूर्ण व्यक्तिकरण थोपता है। इससे मूल की नैतिक और धर्मवैचारिक तनातनी बनी रहती है।
- issue: ἐκλίπῃ का कर्ता
  choice: धन समाप्त होता है
  alternative: तुम्हारा अंत होता है, अर्थात मृत्यु; अथवा सांसारिक साधन सामान्य रूप से चुक जाते हैं
  rationale: निकटतम और सबसे स्वाभाविक पूर्वपद धन है, पर यूनानी क्रिया का कर्ता व्यक्त नहीं है; इसलिए वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- issue: स्वागत करने वाले ‘वे’ कौन हैं
  choice: पहचान अनिर्दिष्ट रखी गई
  alternative: धन के उदार उपयोग से बने मित्र; निर्धन या परमेश्वर के लोग; स्वर्गीय प्राणी
  rationale: यूनानी पाठ δέξωνται के बहुवचन कर्ता की पहचान नहीं बताता। किसी एक पहचान को मुख्य पाठ में जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधर्म के धन’ मूल की नैतिक तीक्ष्णता को बनाए रखता है, जबकि ‘निवासों’ से वाक्य स्वाभाविक रहता है और शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
