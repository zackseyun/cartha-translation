  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: hi
  text: उसने कहा, “जैतून के तेल के एक सौ बत[a]।” तब उसने उससे कहा, “अपना ऋणपत्र[b] लो, बैठकर जल्दी से पचास लिखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बत’ प्राचीन समय में तरल पदार्थ नापने की एक इकाई थी। यूनानी पाठ में शाब्दिक रूप से ‘जैतून के तेल के एक सौ बत’ है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘अपना लिखित करार’ या ‘अपने दस्तावेज़’ भी हो सकता है। यूनानी में शाब्दिक रूप से ‘अपने लिखित कागज़ात’ है; इस प्रसंग में इसका अर्थ देनदार का ऋणपत्र या ऋण का लिखित अभिलेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: बत
  rationale: यह एक विशिष्ट प्राचीन तरल माप है। इकाई के नाम को लिप्यंतरित करने से मूल का ठोस आर्थिक विवरण बना रहता है; उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἐλαίου
  choice: जैतून का तेल
  rationale: इस प्रसंग में ἔλαιον से जैतून का तेल अभिप्रेत है; केवल ‘तेल’ की अपेक्षा यह आधुनिक पाठक के लिए अधिक स्पष्ट है।
- source_word: Δέξαι
  choice: लो
  rationale: यहाँ आज्ञा का आशय दस्तावेज़ को अपने हाथ में लेने से है। ‘लो’ स्वाभाविक, सीधा और प्रसंगानुकूल है।
- source_word: τὰ γράμματα
  choice: अपना ऋणपत्र
  rationale: शाब्दिक अर्थ ‘लिखित दस्तावेज़’ है, पर ऋण के इस प्रसंग में यह देनदारी के लिखित अभिलेख को सूचित करता है। ‘ऋणपत्र’ संक्षिप्त और स्पष्ट है, जबकि मूल की व्यापकता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: καθίσας
  choice: बैठो
  rationale: यह कृदन्त अगले आज्ञार्थक क्रिया के साथ संबद्ध सहायक क्रिया है; हिन्दी में समान क्रम वाली आज्ञा के रूप में ‘बैठो और ... लिखो’ स्वाभाविक है।
- source_word: ταχέως
  choice: जल्दी
  rationale: यह कार्य की शीघ्रता को सीधे व्यक्त करता है और बोलचाल में भी सहज है।
- source_word: γράψον
  choice: लिखो
  rationale: ऋणपत्र पर बदली हुई मात्रा लिखने की आज्ञा है। मूल से अधिक व्याख्या जोड़े बिना ‘लिखो’ पर्याप्त स्पष्ट है।
- source_word: πεντήκοντα
  choice: पचास
  rationale: मूल संख्या का सीधा और निर्विवाद अनुवाद।
