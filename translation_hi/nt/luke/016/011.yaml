id: LUK.16.11
reference: Luke 16:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: hi
  text: इसलिए यदि तुम अधर्म की धन-संपत्ति[a] के उपयोग में विश्वासयोग्य नहीं रहे, तो सच्ची धन-संपत्ति[b] तुम्हें कौन सौंपेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अन्याय की धन-संपत्ति”; यूनानी में शाब्दिक रूप से “अधर्मी मामोन।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सच्ची वस्तु” या “जो सचमुच का है”; प्रसंग में इसका विरोध सांसारिक धन-संपत्ति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: अधर्म की
  rationale: ἄδικος का मूल नैतिक भाव ‘अधर्मी/अन्यायी’ है। ‘अधर्म की’ यूनानी अभिव्यक्ति की नैतिक तीक्ष्णता बनाए रखता है, जबकि ‘बेईमानी से कमाई हुई’ अर्थ को अनावश्यक रूप से केवल छल से अर्जित धन तक सीमित कर देगा।
- source_word: μαμωνᾷ
  choice: धन-संपत्ति
  rationale: μαμωνᾶς धन और संपत्ति दोनों को समेट सकता है। ‘धन-संपत्ति’ आधुनिक हिन्दी में स्वाभाविक है और केवल नकद पैसे से व्यापक अर्थ देता है।
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: अधर्म की धन-संपत्ति के उपयोग में
  rationale: ἐν यहाँ उस क्षेत्र या साधन को दर्शाता है जिसमें विश्वासयोग्यता प्रकट होती है। हिन्दी में ‘के उपयोग में’ प्रबंधकीय संदर्भ को स्वाभाविक बनाता है, यद्यपि ‘उपयोग’ स्पष्टता के लिए जोड़ा गया है।
- source_word: πιστοὶ
  choice: विश्वासयोग्य
  rationale: संदर्भ में πιστός सौंपे गए साधनों के प्रबंधन में भरोसेमंद और निष्ठावान होने का भाव देता है। ‘विश्वासयोग्य’ इस प्रबंधकीय आशय को स्पष्ट रखता है।
- source_word: οὐκ ἐγένεσθε
  choice: नहीं रहे
  rationale: γίνομαι और विधेय विशेषण का मेल यहाँ व्यवहार में वैसा सिद्ध होने या रहने का भाव देता है। ‘नहीं रहे’ शर्त-वाक्य में सहज आधुनिक हिन्दी है।
- source_word: τὸ ἀληθινὸν
  choice: सच्ची धन-संपत्ति
  rationale: यूनानी में विशेषण संज्ञा के बिना प्रयुक्त है—शाब्दिक अर्थ ‘सच्ची वस्तु/जो सचमुच का है।’ निकटवर्ती μαμωνᾶς से विरोध के कारण ‘धन-संपत्ति’ की पूर्ति अर्थ स्पष्ट करती है; पादटिप्पणी मूल की संक्षिप्तता सुरक्षित रखती है।
- source_word: πιστεύσει
  choice: सौंपेगा
  rationale: यहाँ πιστεύω किसी व्यक्ति को कोई वस्तु सौंपने के अर्थ में है, न कि उस पर विश्वास करने के अर्थ में। ‘सौंपेगा’ आधुनिक हिन्दी में ठीक अर्थ देता है।
theological_decisions:
- issue: ‘τὸ ἀληθινὸν’ का अधर्म की धन-संपत्ति से विरोध
  choice: मुख्य पाठ में ‘सच्ची धन-संपत्ति’
  alternative: ‘जो सचमुच का है’ अथवा ‘सच्ची वस्तु’
  rationale: मूल यूनानी संज्ञा को अनकहा छोड़ता है, इसलिए कुछ अस्पष्टता वास्तविक है। फिर भी धन-संपत्ति के साथ तत्काल विरोध हिन्दी में ‘सच्ची धन-संपत्ति’ को प्रसंगानुकूल बनाता है। पादटिप्पणी पाठक को शाब्दिक रूप बताती है और इसे किसी खास प्रकार की स्वर्गीय संपदा के रूप में सिद्धांततः निर्धारित नहीं करती।
- issue: ‘अधर्म की धन-संपत्ति’ का नैतिक आशय
  choice: धन-संपत्ति को ‘अधर्म की’ कहा गया है
  alternative: ‘बेईमानी की धन-संपत्ति’ या ‘सांसारिक धन-संपत्ति’
  rationale: ‘बेईमानी की’ यह संकेत दे सकती है कि धन अनिवार्यतः धोखे से कमाया गया था, जबकि ‘सांसारिक’ मूल के नैतिक रंग को कम कर देता है। चुना हुआ रूप तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मामोन’ के लिप्यंतरण के बजाय ‘धन-संपत्ति’ अपनाया गया है। वचन में शिष्य-समूह को संबोधित बहुवचन ‘तुम’ रखा गया है।
