  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: hi
  text: तब उसने कहा, “तो फिर, पिता, मैं आपसे अनुरोध करता हूँ[a] कि आप उसे मेरे पिता के घर भेज दें,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनती करता हूँ।” यूनानी क्रिया गंभीर आग्रह व्यक्त कर सकती है, यद्यपि उसका अधिक मूल अर्थ “अनुरोध करना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: तब उसने कहा
  rationale: δέ यहाँ हल्के कथात्मक संयोजक के रूप में बात को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में प्रसंग की प्रगति स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἐρωτῶ
  choice: मैं आपसे अनुरोध करता हूँ
  rationale: ἐρωτάω का मूल अर्थ पूछना या अनुरोध करना है। इस प्रसंग में यह एक गंभीर निवेदन है; ‘अनुरोध करता हूँ’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘विनती’ जितना भावात्मक आग्रह अनिवार्य नहीं बनाता।
- source_word: σε οὖν
  choice: तो फिर … आपसे
  rationale: οὖν पिछली अस्वीकृति के आधार पर अगले अनुरोध की ओर बढ़ने का संकेत देता है। ‘तो फिर’ हिन्दी में इस निष्कर्षात्मक और निरंतरतामूलक संबंध को स्पष्ट रखता है; ‘आपसे’ संबोधित व्यक्ति को आदरपूर्वक व्यक्त करता है।
- source_word: πάτερ
  choice: पिता
  rationale: यह दृष्टान्त में अब्राहम के लिए पूर्वज-संबोधन है, परमेश्वर के लिए कोई विशिष्ट उपाधि नहीं। ‘पिता’ इस संबोधन को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े सुरक्षित रखता है।
- source_word: ἵνα πέμψῃς
  choice: कि आप … भेज दें
  rationale: अनुरोध की क्रिया के बाद ἵνα और संभावनार्थक क्रिया अनुरोध की विषयवस्तु बताते हैं। ‘कि आप … भेज दें’ आधुनिक हिन्दी में स्वाभाविक आश्रित रचना है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम पिछले प्रसंग के लाज़र को संदर्भित करता है; ‘उसे’ सीधा और स्वाभाविक रूप है।
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: मेरे पिता के घर
  rationale: εἰς गंतव्य और οἶκος यहाँ घर या गृहस्थी को दर्शाता है। ‘मेरे पिता के घर’ सटीक और सहज हिन्दी है।
theological_decisions:
- issue: दृष्टान्त में πάτερ का संबोधन
  choice: पिता
  alternative: हे पिता
  rationale: वक्ता अब्राहम को अपने पूर्वज के रूप में संबोधित करता है। सरल ‘पिता’ आधुनिक संवाद में स्वाभाविक है और इसे परमेश्वर के लिए प्रयुक्त औपचारिक धार्मिक संबोधन मानने की संभावना नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तो फिर’ οὖν के निष्कर्षात्मक प्रवाह को व्यक्त करता है, जबकि ‘अनुरोध करता हूँ’ मूल क्रिया की अर्थ-सीमा को अतिनाटकीय बनाए बिना सुरक्षित रखता है।
