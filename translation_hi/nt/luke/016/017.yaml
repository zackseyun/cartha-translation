source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: hi
  text: परन्तु व्यवस्था के एक अक्षर की छोटी-सी रेखा के भी लुप्त हो जाने की अपेक्षा आकाश और पृथ्वी का मिट जाना आसान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक छोटी नोक/रेखा का गिर जाना’; अर्थात किसी अक्षर को दूसरे से अलग दिखाने वाली अत्यन्त छोटी रेखा।
    reason: मूल κεραία और πεσεῖν की शाब्दिक छवि तथा सूक्ष्म लिखित चिह्न का अर्थ सुरक्षित करना।
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: आसान है
  rationale: 'तुलनात्मक अर्थ को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है: एक घटना का होना दूसरी की अपेक्षा आसान है।'
- source_word: δέ
  choice: परन्तु
  rationale: पिछले कथन के साथ हल्का विरोध बनाए रखता है और गरिमापूर्ण आधुनिक हिन्दी में सहज है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: आकाश और पृथ्वी
  rationale: समस्त सृष्टि के लिए प्रयुक्त बाइबलीय युग्म को सुरक्षित रखता है।
- source_word: παρελθεῖν
  choice: मिट जाना
  rationale: इस प्रसंग में अस्तित्व से हट जाने या समाप्त हो जाने का भाव देता है; केवल पास से गुजरने का अर्थ अभिप्रेत नहीं है।
- source_word: τοῦ νόμου
  choice: व्यवस्था की
  rationale: यहाँ νόμος सामान्य नियम नहीं, पवित्रशास्त्र में प्रकट परमेश्वर की व्यवस्था को सूचित करता है; हिन्दी का स्थापित बाइबलीय शब्द 'व्यवस्था' इस संदर्भ को स्पष्ट करता है।
- source_word: μίαν κεραίαν
  choice: एक छोटी-सी रेखा
  rationale: किसी अक्षर की अत्यन्त सूक्ष्म रेखा या नोक का अर्थ सामान्य आधुनिक पाठक तक पहुँचाता है, बिना पुराने तकनीकी शब्द पर निर्भर हुए।
- source_word: πεσεῖν
  choice: मिट जाने
  rationale: शाब्दिक अर्थ 'गिरना' है, पर लिखित चिह्न के संदर्भ में उसके लुप्त या निष्प्रभावी होने का भाव है; 'मिट जाना' हिन्दी में उस चित्र को अधिक स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: νόμος का संदर्भ
  choice: पवित्रशास्त्रीय व्यवस्था
  alternative: सामान्य रूप से कोई कानून या नियम
  rationale: लूका के यहूदी-पवित्रशास्त्रीय प्रसंग और व्यवस्था के सूक्ष्म लिखित चिह्न का उल्लेख विशेष रूप से परमेश्वर की प्रकट व्यवस्था की ओर संकेत करते हैं।
- issue: κεραία का अर्थ
  choice: अक्षर की एक छोटी-सी रेखा
  alternative: मात्रा, बिन्दु, नोक, या पुराना पारिभाषिक शब्द 'तिलक'/'टिटल'
  rationale: मूल शब्द किसी लिखित अक्षर के बहुत छोटे उभार या आघात को दर्शाता है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी उसकी प्रकृति बताती है, पर किसी खास लिपि-विशेष के चिह्न तक अर्थ को सीमित नहीं करती।
- issue: πεσεῖν की रूपकात्मक शक्ति
  choice: मिट जाना
  alternative: गिर जाना
  rationale: मूल में 'गिरना' का बिंब है, किन्तु हिन्दी में किसी लिखित रेखा का 'गिरना' अस्पष्ट होगा। 'मिट जाना' उसके लुप्त होने या प्रभाव खोने की दिशा को व्यक्त करता है, बिना इस बात को विस्तार से तय किए कि अभिप्राय केवल पाठीय लोप है या वैधता का समाप्त होना।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। 'आकाश और पृथ्वी' तथा 'व्यवस्था' जैसे स्थापित बाइबलीय पद बनाए गए हैं। मुख्य वाक्य में तुलना का जोर और मूल की अतिशयोक्तिपूर्ण दृढ़ता सुरक्षित रखी गई है।
