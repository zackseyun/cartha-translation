  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: hi
  text: वह चेलों से भी कह रहा था, “एक धनवान मनुष्य था, जिसका एक प्रबंधक[a] था। उस धनवान के पास उस प्रबंधक के विरुद्ध यह आरोप लगाया गया[b] कि वह धनवान की संपत्ति उड़ा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कारिंदा’ अथवा पारंपरिक रूप में ‘भंडारी’; यूनानी शब्द उस व्यक्ति को दर्शाता है जिसे किसी घराने या संपदा की देखरेख और व्यवस्था सौंपी गई हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके विरुद्ध धनवान से शिकायत की गई।’ यूनानी क्रिया आरोप लगाने, चुगली करने या प्रतिकूल सूचना देने का अर्थ रख सकती है; इससे आरोप का सिद्ध होना आवश्यक नहीं है।
    reason: lexical_alternative
