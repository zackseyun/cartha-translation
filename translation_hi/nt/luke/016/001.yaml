- source_word: πρὸς τοὺς μαθητάς
  choice: चेलों से
  rationale: πρός यहाँ संबोधन की दिशा बताता है। मूल में स्वत्वसूचक सर्वनाम नहीं है, इसलिए ‘अपने चेलों’ नहीं जोड़ा गया।
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: एक धनवान मनुष्य था
  rationale: यह दृष्टांत के पात्र का अनिश्चित किंतु विशिष्ट परिचय है; ‘एक ... मनुष्य था’ आधुनिक हिंदी में स्वाभाविक कथात्मक रूप है।
- source_word: οἰκονόμον
  choice: प्रबंधक
  rationale: οἰκονόμος घराने या संपदा के प्रशासन के लिए नियुक्त व्यक्ति है। ‘प्रबंधक’ आधुनिक पाठक के लिए स्पष्ट है, जबकि पारंपरिक विकल्प ‘भंडारी’ अर्थ को संकुचित कर सकता है।
- source_word: οὗτος
  choice: उस प्रबंधक
  rationale: संकेतवाचक सर्वनाम पहले बताए गए प्रबंधक पर जोर देकर लौटता है; संज्ञा को दोहराने से हिंदी में संदर्भ अस्पष्ट नहीं होता।
- source_word: διεβλήθη αὐτῷ
  choice: धनवान के सामने यह आरोप लगाया गया
  rationale: निष्क्रिय διαβάλλω किसी के विरुद्ध आरोप लगाने या प्रतिकूल सूचना देने का अर्थ रख सकता है। ‘धनवान के सामने’ अप्रत्यक्ष कर्म αὐτῷ को स्पष्ट करता है, पर आरोप को सिद्ध तथ्य नहीं बनाता।
- source_word: ὡς διασκορπίζων
  choice: कि वह ... उड़ा रहा है
  rationale: ὡς सहित कृदंत आरोप की विषयवस्तु बताता है। आर्थिक संदर्भ में ‘संपत्ति उड़ाना’ अपव्यय का सहज और अर्थपूर्ण हिंदी रूप है।
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: उसकी संपत्ति
  rationale: यह धनवान की मिल्कियत या संपदा को सूचित करता है; एकवचन सामूहिक ‘संपत्ति’ आधुनिक हिंदी में स्वाभाविक है।
