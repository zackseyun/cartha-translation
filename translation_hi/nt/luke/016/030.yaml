  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: hi
  text: पर उसने कहा, “नहीं, पिता अब्राहम, बल्कि यदि मरे हुओं में से[a] कोई उनके पास जाए, तो वे पश्चाताप करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृतकों में से।”
    reason: ἀπὸ νεκρῶν के लिए अधिक संक्षिप्त और औपचारिक शब्दावली वाला विकल्प।
lexical_decisions:
- source_word: Οὐχί
  choice: नहीं
  rationale: यह पहले कथन का स्पष्ट और प्रबल खंडन है। आधुनिक हिन्दी के सीधे संवाद में ‘नहीं’ स्वाभाविक है और अनावश्यक अतिशयोक्ति नहीं जोड़ता।
- source_word: πάτερ Ἀβραάμ
  choice: पिता अब्राहम
  rationale: यह संबोधन अब्राहम को पूर्वज मानकर की गई अपील को बनाए रखता है; ‘पिता’ यहाँ उपाधि से अधिक संबंधसूचक संबोधन है।
- source_word: ἀλλ’ ἐάν
  choice: बल्कि यदि
  rationale: यह पिछले कथन का सुधारात्मक विरोध और उसके स्थान पर प्रस्तावित शर्त—दोनों व्यक्त करता है।
- source_word: ἀπὸ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह बहुवचन νεκρῶν और उनके बीच से किसी के जाने की धारणा को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है। संक्षिप्त विकल्प ‘मृतकों में से’ पादटिप्पणी में दिया गया है।
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: कोई उनके पास जाए
  rationale: ἐάν के बाद का संभाव्य भविष्यगत कथन हिन्दी में ‘यदि ... जाए’ से स्वाभाविक रूप से व्यक्त होता है; ‘उनके पास’ गमन की दिशा को बनाए रखता है।
- source_word: μετανοήσουσιν
  choice: वे पश्चाताप करेंगे
  rationale: लूका के प्रसंग में यह केवल विचार बदलने नहीं, बल्कि चेतावनी के प्रत्युत्तर में नैतिक और आत्मिक परिवर्तन को दर्शाता है। ‘पश्चाताप करेंगे’ आधुनिक बाइबलीय हिन्दी में इस अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: μετανοήσουσιν में पश्चाताप का अर्थ
  choice: वे पश्चाताप करेंगे
  alternative: वे अपना मन बदलेंगे / वे मन फिराएँगे
  rationale: इस प्रसंग में धनी व्यक्ति अपने भाइयों द्वारा परमेश्वर की चेतावनी का ऐसा प्रत्युत्तर देने की बात करता है जिसमें नैतिक-आत्मिक परिवर्तन निहित है। ‘अपना मन बदलेंगे’ इसे केवल बौद्धिक पुनर्विचार तक सीमित कर सकता है, जबकि ‘पश्चाताप करेंगे’ मूल की धार्मिक और नैतिक गंभीरता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संवाद के अनुकूल रखी गई है। ‘पिता अब्राहम’ संबंधसूचक संबोधन है; विस्मयादिबोधक चिह्न संबोधन की सीमा स्पष्ट करता है। ‘बल्कि यदि’ यूनानी के सुधारात्मक विरोध को बनाए रखता है।
