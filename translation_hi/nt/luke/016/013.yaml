  terminology: ‘घरेलू सेवक,’ ‘स्वामी,’ ‘परमेश्वर,’ and the retained loanword ‘मामोन’ are appropriate. The note adequately explains that मामोन denotes wealth/money rhetorically presented as a rival master, without treating it as a literal deity.
