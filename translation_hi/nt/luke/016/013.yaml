id: LUK.16.13
reference: Luke 16:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: hi
  text: कोई घरेलू सेवक दो स्वामियों की सेवा नहीं कर सकता; क्योंकि या तो वह एक से घृणा करेगा और दूसरे से प्रेम करेगा, या एक के प्रति निष्ठावान रहेगा और दूसरे को तुच्छ समझेगा। तुम परमेश्वर और मामोन[a]—दोनों की सेवा नहीं कर सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘धन-संपत्ति’ या ‘पैसा’। यूनानी पाठ में ‘मामोन’ है, जो यहाँ धन-दौलत को एक प्रतिद्वंद्वी स्वामी के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: घरेलू सेवक
  rationale: यह शब्द सामान्य सेवक की अपेक्षा घर-परिवार से जुड़े सेवक को सूचित करता है। ‘घरेलू सेवक’ घरेलू संदर्भ और स्वामी-सेवक संबंध दोनों को स्पष्ट रखता है।
- source_word: κυρίοις
  choice: स्वामियों
  rationale: यहाँ सामाजिक संदर्भ में घर के मालिक अभिप्रेत हैं; ‘स्वामियों’ से अधिकार और सेवा का संबंध स्पष्ट होता है।
- source_word: δουλεύειν
  choice: सेवा करना
  rationale: क्रिया अधीन होकर सेवक की तरह सेवा करने का भाव रखती है। ‘सेवा करना’ हिंदी में स्वाभाविक है और दोनों स्वामियों तथा परमेश्वर-मामोन के समानांतर कथन को बनाए रखता है।
- source_word: μισήσει
  choice: बैर रखेगा
  rationale: मूल शब्द का प्रबल अर्थ ‘घृणा करना’ है। इस संबंधपरक विरोध में ‘बैर रखना’ प्रेम के प्रतिलोम को स्वाभाविक और प्रभावशाली हिंदी में व्यक्त करता है, बिना उसे केवल ‘कम प्रेम करना’ बनाकर नरम किए।
- source_word: ἀγαπήσει
  choice: प्रेम करेगा
  rationale: यह मूल शब्द के सामान्य अर्थ को सीधे रखता है और ‘बैर रखेगा’ के साथ जानबूझकर किए गए विरोध को सुरक्षित रखता है।
- source_word: ἀνθέξεται
  choice: के प्रति निष्ठावान रहेगा
  rationale: क्रिया किसी एक को थामे रहने, उससे जुड़े रहने और उसका पक्ष निभाने का भाव देती है। ‘निष्ठावान रहेगा’ यहाँ संबंधपरक लगाव और वफादारी को सहज हिंदी में व्यक्त करता है।
- source_word: καταφρονήσει
  choice: तुच्छ समझेगा
  rationale: इसमें अवमानना से किसी को कमतर मानने का भाव है। ‘तुच्छ समझेगा’ अर्थ और कथन की तीव्रता दोनों बनाए रखता है।
- source_word: θεῷ
  choice: परमेश्वर
  rationale: यहाँ परमेश्वर स्पष्ट रूप से सेवा का दत्तिव कर्म है; आधुनिक बाइबलीय हिंदी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μαμωνᾷ
  choice: मामोन
  rationale: सेमिटिक मूल का यह शब्द धन-संपत्ति को प्रतिद्वंद्वी स्वामी के रूप में प्रस्तुत करता है। लिप्यंतरण उस व्यक्तिरूपक प्रभाव को बनाए रखता है; पादटिप्पणी अर्थ स्पष्ट करती है।
theological_decisions:
- issue: θεῷ और μαμωνᾷ के बीच विरोध
  choice: परमेश्वर और मामोन
  alternative: परमेश्वर और धन / धन-संपत्ति
  rationale: ‘मामोन’ रखने से धन को प्रतिद्वंद्वी स्वामी के रूप में प्रस्तुत करने वाला मूल का व्यक्तिरूपक और धर्मवैचारिक तनाव सुरक्षित रहता है। इससे मामोन को वास्तविक देवता घोषित नहीं किया जाता।
- issue: एकवचन सेवक के लिए प्रतिनिधिक पुल्लिंग
  choice: वह ... रखेगा ... करेगा ... रहेगा ... समझेगा
  alternative: वह सेवक ... / वे ...
  rationale: यूनानी पाठ प्रतिनिधिक एकवचन रूपों का प्रयोग करता है। हिंदी में उसी एकवचन उदाहरण और उसकी कहावत-जैसी संरचना को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले वाक्य में ‘घरेलू सेवक’ सामाजिक संदर्भ स्पष्ट करता है; अंतिम वाक्य में दीर्घ विराम ‘दोनों’ पर बल देता है।
