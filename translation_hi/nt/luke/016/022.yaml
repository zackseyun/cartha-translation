source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: hi
  text: ऐसा हुआ कि वह गरीब आदमी मर गया, और स्वर्गदूतों द्वारा उसे अब्राहम की गोद[a] में ले जाया गया। धनी आदमी भी मर गया और दफ़नाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम के पास।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ “अब्राहम की गोद में” है; यह निकटता, आदर और संगति का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: ऐसा हुआ कि … मर गया
  rationale: लूका की कथात्मक रचना ἐγένετο + infinitive को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। δέ के हल्के संक्रमण को अलग कालसूचक शब्द जोड़कर अधिक स्पष्ट नहीं किया गया।
- source_word: τὸν πτωχὸν
  choice: वह गरीब आदमी
  rationale: πτωχός यहाँ निर्धन या दरिद्र व्यक्ति को सूचित करता है। ‘गरीब आदमी’ सीधा और सामान्य पाठक के लिए सहज है; ‘भिखारी’ इस पद में स्पष्ट रूप से कही गई बात से अधिक जोड़ देता।
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: स्वर्गदूत उसे उठाकर … ले गए
  rationale: यह हिन्दी में स्वाभाविक रूप से उस क्रिया और स्वर्गदूतों की स्पष्ट भूमिका को व्यक्त करता है, जिसे यूनानी कर्मवाच्य रचना बताती है। ‘उठाकर’ यहाँ उसे अपने साथ ले जाने का भाव देता है, पुनरुत्थान का नहीं।
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: अब्राहम की गोद में
  rationale: κόλπος का मूल बिंब छाती, गोद या अत्यंत निकट स्थान का है। ‘गोद’ निकटता, आदर और संगति के रूपक को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: वह धनी आदमी भी मर गया
  rationale: καί का समानांतर बल ‘भी’ से बना रहता है और दोनों व्यक्तियों की मृत्यु को साथ रखता है।
- source_word: ἐτάφη
  choice: उसे दफ़नाया गया
  rationale: θάπτω के कर्मवाच्य का सीधा और प्रतिष्ठित आधुनिक हिन्दी रूप है; मूल की संक्षिप्तता भी बनी रहती है।
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ का रूपक
  choice: अब्राहम की गोद में
  alternative: अब्राहम के पास
  rationale: मुख्य पाठ में मूल सांस्कृतिक और धर्मवैचारिक बिंब को बनाए रखा गया है, ताकि उसे केवल एक सामान्य परलोक-स्थान मानकर पहले से न समझा दिया जाए। अधिक अर्थ-स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अब्राहम की गोद’ पारंपरिक बिंब को बचाता है, जबकि पादटिप्पणी उसका अर्थ सामान्य पाठक के लिए स्पष्ट करती है।
