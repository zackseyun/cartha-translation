base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: hi
  text: एक धनी मनुष्य था, जो बैंगनी वस्त्र और महीन लिनन पहनता था और हर दिन बड़े ठाट-बाट से आनंद मनाता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर दिन बड़े ठाट-बाट से भोज करता था।” यूनानी पद आनंदित होने या उत्सव मनाने के साथ-साथ दावत करने का भाव भी दे सकता है, और यहाँ का क्रिया-विशेषण वैभव तथा विलासिता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: एक ... मनुष्य था
  rationale: τις किसी अनिश्चित व्यक्ति का परिचय देता है; δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है, जिसके लिए अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: πλούσιος
  choice: धनी
  rationale: यह भौतिक संपन्नता का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐνεδιδύσκετο
  choice: पहनता था
  rationale: अपूर्णकाल इस काम की आदत या नियमितता दर्शाता है; हिन्दी का ‘पहनता था’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: πορφύραν
  choice: बैंगनी वस्त्र
  rationale: πορφύρα यहाँ बैंगनी रंग से रंगे महँगे वस्त्रों के लिए प्रयुक्त है; ‘वस्त्र’ जोड़ने से हिन्दी में आशय स्पष्ट होता है।
- source_word: βύσσον
  choice: महीन मलमल
  rationale: यह उच्च कोटि के महीन लिनन को दर्शाता है; ‘महीन मलमल’ कपड़े की बारीकी और विलासिता दोनों का सहज संकेत देता है।
- source_word: εὐφραινόμενος
  choice: आनंद-विलास करता था
  rationale: शब्द आनंद मनाने या उत्सवपूर्ण सुख भोगने का भाव रखता है और प्रसंग में भोज करना भी शामिल हो सकता है; यह चयन उस व्यापक अर्थ को बनाए रखता है।
- source_word: καθ’ ἡμέραν
  choice: हर दिन
  rationale: यह नियमित दैनिक क्रिया का स्पष्ट और सामान्य आधुनिक हिन्दी रूप है।
- source_word: λαμπρῶς
  choice: बड़े ठाट-बाट से
  rationale: क्रिया-विशेषण वैभव, भव्यता और विलासपूर्ण ढंग को व्यक्त करता है; यह हिन्दी पदबंध उस सामाजिक प्रदर्शन को स्वाभाविक रूप से संप्रेषित करता है।
