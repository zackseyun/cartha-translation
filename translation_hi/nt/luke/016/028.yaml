  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: hi
  text: क्योंकि मेरे पाँच भाई हैं—वह उन्हें गंभीर चेतावनी दे, ताकि वे भी यातना के इस स्थान में न आएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: क्योंकि मेरे ... हैं
  rationale: γάρ पिछली विनती का कारण बताता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है। ἔχω का संबंध-सूचक अर्थ ‘मेरे ... हैं’ से सहज रूप में आता है।
- source_word: πέντε ἀδελφούς
  choice: पाँच भाई
  rationale: ἀδελφούς पुल्लिंग बहुवचन है और यहाँ पुरुष सहोदरों का संकेत करता है; ‘पाँच भाई’ सटीक और स्वाभाविक है।
- source_word: ὅπως
  choice: वह ... दे
  rationale: ὅπως उद्देश्य बताता है। पिछली आयत की विनती के साथ मिलकर हिंदी में इच्छार्थक क्रिया-विन्यास उस उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διαμαρτύρηται αὐτοῖς
  choice: वह उन्हें गंभीरता से चेतावनी दे
  rationale: διαμαρτύρομαι में गंभीर गवाही देने अथवा दृढ़ चेतावनी देने का भाव है। आगामी नकारात्मक उद्देश्य के संदर्भ में ‘गंभीरता से चेतावनी दे’ इसकी तात्कालिकता और गंभीरता दोनों व्यक्त करता है।
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: ताकि वे भी ... न आएँ
  rationale: ἵνα μή नकारात्मक उद्देश्य दर्शाता है और καὶ αὐτοὶ में ‘वे भी’ का बल है; यह हिंदी रूप दोनों को स्पष्ट रखता है।
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: इस यातना के स्थान में
  rationale: εἰς गंतव्य/प्रवेश का भाव देता है, जिसे ‘में ... आएँ’ स्वाभाविक रूप से व्यक्त करता है। βάσανος की तीव्र पीड़ा के लिए ‘यातना’ उपयुक्त है और पाठ से आगे बढ़कर कोई व्यवस्थित परलोक-सिद्धांत नहीं जोड़ता।
theological_decisions:
- issue: धनी मनुष्य द्वारा परलोक के स्थान का वर्णन
  choice: इस यातना के स्थान
  alternative: इस पीड़ा के स्थान / इस कष्ट के स्थान
  rationale: βάσανος तीव्र पीड़ा या यातना का बोध कराता है। ‘यातना’ कथन की तीव्रता बनाए रखता है, पर इस आयत में न दिए गए अतिरिक्त सिद्धांत को नहीं जोड़ता।
- issue: διαμαρτύρηται का गवाही और चेतावनी के बीच अर्थ-क्षेत्र
  choice: गंभीरता से चेतावनी दे
  alternative: उन्हें गवाही दे / उन्हें दृढ़ता से चेताए
  rationale: संदर्भ में उद्देश्य भाइयों को इस स्थान पर आने से रोकना है, इसलिए चेतावनी का भाव प्रमुख है; पादटिप्पणी यूनानी क्रिया में निहित गवाही के वैकल्पिक भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। दो उद्देश्य-वाक्यों को अलग वाक्यों में रखकर हिंदी में स्पष्टता बढ़ाई गई है, जबकि मूल के तार्किक संबंध और अर्थगत गंभीरता सुरक्षित हैं।
