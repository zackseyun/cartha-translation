source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: hi
  text: और यदि तुम दूसरे की वस्तु के मामले में विश्वासयोग्य नहीं रहे, तो जो तुम्हारा अपना है, वह तुम्हें कौन देगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह विरोध वर्तमान में सांसारिक धन के विषय में विश्वासयोग्यता और बाद में सच्ची या स्थायी संपत्ति पाने की ओर संकेत कर सकता है; पर इस पद में दोनों के संदर्भ स्पष्ट नहीं किए गए हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: दूसरे की वस्तु
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग विशेषण उस वस्तु को दर्शाता है जो किसी दूसरे की है। यह चयन स्वामित्व का भाव और अगले पदबंध के साथ विरोध स्पष्ट रखता है।
- source_word: πιστοὶ
  choice: विश्वासयोग्य
  rationale: यहाँ अर्थ विश्वास करने का नहीं, बल्कि सौंपे गए धन या वस्तु के प्रबंध में भरोसेमंद और निष्ठावान होने का है।
- source_word: οὐκ ἐγένεσθε
  choice: विश्वासयोग्य नहीं रहे
  rationale: γίνομαι का यह रूप किसी दशा में होने या स्वयं को वैसा सिद्ध करने का भाव देता है; हिन्दी में यह अभिव्यक्ति शर्त वाले वाक्य में स्वाभाविक है।
- source_word: τὸ ὑμέτερον
  choice: जो तुम्हारा अपना है
  rationale: लेख सहित नपुंसकलिंग पद संज्ञा के रूप में 'वह जो तुम्हारा है' दर्शाता है और 'दूसरे की वस्तु' के साथ मूल विरोध बनाए रखता है।
- source_word: δώσει ὑμῖν
  choice: उसे तुम्हें ... देगा
  rationale: δίδωμι का सामान्य अर्थ 'देना' है। संदर्भ में 'सौंपना' संभव है, पर 'देना' यूनानी के अधिक निकट है और व्याख्या को अनावश्यक रूप से सीमित नहीं करता।
- source_word: καὶ εἰ
  choice: और यदि
  rationale: καί पिछले कथन से संबंध जोड़ता है और εἰ शर्त प्रस्तुत करता है।
- source_word: τίς
  choice: कौन
  rationale: प्रश्नवाचक सर्वनाम भावी देने वाले के विषय में आलंकारिक प्रश्न करता है।
theological_decisions:
- issue: '''दूसरे की वस्तु'' और ''जो तुम्हारा अपना है'' के बीच विरोध के अभिप्राय'
  choice: मुख्य पाठ में दोनों के विशिष्ट संदर्भों को अनिर्दिष्ट रखा गया है।
  alternative: इसे वर्तमान सांसारिक धन और भविष्य के सच्चे अथवा स्थायी धन के बीच विरोध के रूप में स्पष्ट करना।
  rationale: इस पद का यूनानी पाठ दोनों के संदर्भों की स्पष्ट पहचान नहीं करता। इसलिए अनुवाद मूल की अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। 'विश्वासयोग्य' को प्रबंध में भरोसेमंद होने के अर्थ में रखा गया है। मुख्य पाठ में मूल के स्वामित्व-संबंधी विरोध को स्पष्ट किया गया है, पर उसके धर्मवैचारिक संदर्भों को नहीं खोला गया।
