base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: hi
  text: पर अब्राहम ने कहा, “बेटे, याद कर कि तू अपने जीवन में अपनी अच्छी चीज़ें पा चुका[a], और लाज़र ने उसी तरह बुरी चीज़ें पाईं; पर अब वह यहाँ सांत्वना पा रहा है, और तू पीड़ा में है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हिस्से की अच्छी चीज़ें पूरी तरह पा चुका।” यूनानी क्रिया अपने हिस्से की वस्तु पाने या पूरा प्रतिफल पा लेने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू यातना सह रहा है।” यूनानी शब्द तीव्र पीड़ा या व्यथा को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: बेटे
  rationale: संबोधन में स्नेह और सामाजिक वरिष्ठता दोनों व्यक्त होते हैं; यहाँ इसका अर्थ अनिवार्य रूप से वास्तविक पुत्र होना नहीं है। आधुनिक हिन्दी में ‘बेटे’ स्वाभाविक है।
- source_word: μνήσθητι
  choice: याद कर
  rationale: आज्ञार्थक क्रिया सीधे स्मरण करने को कहती है; ‘याद कर’ सहज और स्पष्ट है।
- source_word: ἀπέλαβες
  choice: पा चुका
  rationale: क्रिया पाने या अपने हिस्से की वस्तुएँ पूरी तरह पा लेने का भाव रख सकती है। ‘पा चुका’ पूर्ण हो चुके प्राप्ति-भाव को दर्शाता है, जबकि अधिक प्रबल विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὰ ἀγαθά σου
  choice: अपनी अच्छी चीज़ें
  rationale: मूल का व्यापक और ठोस बहुवचन सुरक्षित रहता है; ‘आशीषें’ कहने से अनावश्यक धार्मिक अर्थ जुड़ सकता है।
- source_word: ἐν τῇ ζωῇ σου
  choice: अपने जीवन में
  rationale: पृथ्वी पर उसके जीवनकाल का सहज हिन्दी में संकेत करता है।
- source_word: ὁμοίως
  choice: उसी तरह
  rationale: धनी व्यक्ति को मिली अच्छी चीज़ों और लाज़र को मिली बुरी चीज़ों के समानांतर विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ κακά
  choice: बुरी चीज़ें
  rationale: यहाँ लाज़र द्वारा किए गए नैतिक बुरे काम नहीं, बल्कि उसके हिस्से आए प्रतिकूल अनुभव अभिप्रेत हैं। व्यापकता बनाए रखने के लिए शाब्दिक अभिव्यक्ति चुनी गई है।
- source_word: παρακαλεῖται
  choice: सांत्वना पा रहा है
  rationale: इस प्रसंग में कर्मवाच्य रूप किसी दूसरे से दिलासा या सांत्वना मिलने को व्यक्त करता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: कथा में अब्राहम के वर्तमान स्थान की ओर संकेत करने वाला सीधा स्थानवाचक शब्द है।
- source_word: ὀδυνᾶσαι
  choice: पीड़ा में है
  rationale: शब्द तीव्र शारीरिक या मानसिक कष्ट को व्यक्त कर सकता है। यह अनुवाद वास्तविक कष्ट को बनाए रखता है, पर उससे अधिक विशिष्ट यातना-सिद्धांत नहीं जोड़ता।
theological_decisions:
- issue: मृत्यु के बाद के कष्ट की भाषा
  choice: तू पीड़ा में है
  alternative: तू यातना सह रहा है
  rationale: पद सचेत और तीव्र कष्ट दिखाता है, पर ὀδυνᾶσαι अपने आप उस कष्ट के कारण या स्वरूप को पूर्णतः निर्धारित नहीं करता। ‘पीड़ा में है’ अर्थ सुरक्षित रखते हुए धर्मवैचारिक विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष संबोधन में प्रसंगानुकूल एकवचन ‘तू’ रखा गया है। ‘अच्छी/बुरी चीज़ें’ मूल यूनानी की व्यापकता को बचाती हैं, और पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्प दर्ज करती हैं।
