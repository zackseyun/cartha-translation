  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: hi
  text: मैं समझ गया कि मुझे क्या करना है, ताकि जब मुझे प्रबंधक के पद से हटा दिया जाए, तो वे मुझे अपने घरों में स्वीकार कर लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: मैं समझ गया
  rationale: यहाँ क्रिया का भूतकालीन रूप अचानक हुई समझ या निष्कर्ष पर पहुँचने को व्यक्त करता है। ‘मैं समझ गया’ इस परिवर्तन को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: τί ποιήσω
  choice: कि मुझे क्या करना है
  rationale: विचारसूचक संभावनार्थक रूप आगामी योजना पर मनन और अब बने निश्चय को व्यक्त करता है; यह हिन्दी में स्वाभाविक है।
- source_word: ἵνα ὅταν
  choice: ताकि जब
  rationale: यह संयोजन उद्देश्य और भविष्य में होने वाली परिस्थिति—दोनों को बनाए रखता है।
- source_word: μετασταθῶ
  choice: मुझे ... हटा दिया जाए
  rationale: निष्क्रिय क्रिया किसी पद या जिम्मेदारी से हटाए जाने का अर्थ देती है।
- source_word: ἐκ τῆς οἰκονομίας
  choice: प्रबंधक के पद से
  rationale: यहाँ οἰκονομία घर-बार की व्यवस्था सँभालने की जिम्मेदारी या पद को दर्शाता है। ‘प्रबंधक के पद’ से तत्काल कथा-संदर्भ सामान्य हिन्दी में स्पष्ट होता है।
- source_word: δέξωνταί με
  choice: वे मुझे ... स्वीकार कर लें
  rationale: δέχομαι का अर्थ ग्रहण करना या स्वागत करना हो सकता है। ‘अपने घरों में स्वीकार कर लें’ आतिथ्य का भाव देता है, पर अनावश्यक आत्मीयता नहीं जोड़ता।
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: अपने घरों में
  rationale: ‘अपने’ मूल के निजवाचक सर्वनाम को स्पष्ट करता है और οἶκος को आतिथ्य के संदर्भ में स्वाभाविक ‘घर’ के रूप में प्रस्तुत करता है।
