language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: hi
  text: तब प्रबंधक ने मन ही मन कहा[a], “मैं क्या करूँ? मेरा स्वामी मुझसे प्रबंध का काम ले रहा है। मुझमें खोदने की ताकत नहीं है, और भीख माँगने में मुझे लज्जा आती है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रबंधक’ के लिए ‘भंडारी’ और ‘प्रबंध का काम’ के लिए ‘भंडारी का पद’ भी अनुवाद किया जा सकता है। यूनानी में व्यक्ति और उसके पद या काम के लिए सजातीय शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: प्रबंधक / प्रबंध का अधिकार
  rationale: ये सजातीय यूनानी शब्द किसी दूसरे की संपत्ति और कामकाज की देखरेख करने वाले व्यक्ति तथा उसे सौंपे गए पद या दायित्व को बताते हैं। आधुनिक हिन्दी में ‘प्रबंधक’ स्पष्ट है; ‘प्रबंध का अधिकार’ उस जिम्मेदारी और पद के उससे छीने जाने का भाव व्यक्त करता है।
- source_word: ἐν ἑαυτῷ
  choice: मन ही मन कहा
  rationale: यह मुहावरा भीतर किए गए आत्म-संवाद को दर्शाता है; ‘मन ही मन कहा’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: Τί ποιήσω
  choice: मैं क्या करूँ?
  rationale: विचारार्थक प्रश्न भविष्य में अपनाए जाने वाले कदम पर असमंजस व्यक्त करता है। हिन्दी का वर्तमान संभावनार्थक रूप यही भाव स्वाभाविक रूप से देता है।
- source_word: κύριός μου
  choice: मेरा स्वामी
  rationale: यहाँ κύριος दृष्टांत के मानवीय अधिकारी को दर्शाता है। ‘स्वामी’ उसके अधिकार-संबंध को बनाए रखता है और इसे परमेश्वर के लिए प्रयुक्त उपाधि नहीं बनाता।
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: मुझसे ... ले रहा है
  rationale: यह अभिव्यक्ति किसी पद या अधिकार को व्यक्ति से वापस लिए जाने का चालू घटनाक्रम बताती है।
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: मुझमें खोदने की ताकत नहीं है
  rationale: ἰσχύω में सामर्थ्य, और इस प्रसंग में विशेषकर कठिन शारीरिक श्रम की शक्ति का भाव है।
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: भीख माँगने में मुझे लज्जा आती है
  rationale: ἐπαιτεῖν भिक्षा माँगने और αἰσχύνομαι उसके प्रति लज्जित होने को व्यक्त करता है। यह अनुवाद दोनों भावों को सीधे और गरिमापूर्ण ढंग से रखता है।
theological_decisions:
- issue: गैर-ईश्वरीय प्रसंग में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु; मालिक
  rationale: यहाँ संदर्भ दृष्टांत के धनी मनुष्य और उसके अधीन प्रबंधक का है। ‘स्वामी’ मानवीय अधिकार-संबंध को व्यक्त करता है, जबकि ‘प्रभु’ अनावश्यक धार्मिक अर्थ जगा सकता है और ‘मालिक’ मुख्यतः संपत्ति के स्वामित्व पर जोर देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आत्म-संवाद को स्वाभाविक हिन्दी विराम-चिह्नों के साथ प्रस्तुत किया गया है। ‘लज्जा आती है’ ने मूल के स्पष्ट लज्जा-बोध को बनाए रखा है।
