  verdict: revise
  source_fidelity: The draft accurately renders the internal deliberation, the prospective question, the human social sense of κύριός μου, physical incapacity for digging, and shame at begging. However, ‘प्रबंध का अधिकार’ narrows οἰκονομία to authority, whereas the Greek denotes the entrusted managerial office or responsibility being removed.
  naturalness: The Hindi is clear, modern, and appropriately dignified. ‘मन ही मन कहा,’ ‘मैं क्या करूँ?,’ and ‘भीख माँगने में मुझे लज्जा आती है’ are natural in this register.
  terminology: ‘प्रबंधक’ is a suitable modern rendering of οἰκονόμος, and ‘स्वामी’ correctly avoids a theological sense for κύριος in this parable. Replacing ‘प्रबंध का अधिकार’ with ‘प्रबंध का काम’ better represents the managerial assignment/office while retaining a natural cognate pairing with ‘प्रबंधक.’
  issues:
  - severity: medium
    issue: ‘प्रबंध का अधिकार’ for οἰκονομία
    rationale: ‘अधिकार’ chiefly means authority or entitlement. In context οἰκονομία is the manager’s entrusted administration/position; its removal means loss of his managerial assignment, not merely loss of authority.
