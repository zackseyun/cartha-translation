id: LUK.16.2
reference: Luke 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: hi
  text: तब उसने उसे बुलाकर उससे कहा, “यह क्या है जो मैं तुम्हारे बारे में सुन रहा हूँ? अपने प्रबंध का हिसाब दो[a], क्योंकि अब तुम प्रबंध नहीं कर सकते[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने प्रबंध का लेखा प्रस्तुत करो।”
    reason: λόγος और ἀπόδος के अधिक औपचारिक लेखांकन-संबंधी अनुवाद को दर्शाने वाला शाब्दिक विकल्प।
  - marker: b
    text: या “क्योंकि अब तुम प्रबंधक नहीं रह सकते।”
    reason: οἰκονομεῖν का पद या भूमिका-केंद्रित अनुवाद।
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: उसने उसे बुलाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है। ‘बुलाकर’ क्रम को संक्षेप और स्वाभाविक हिन्दी में रखता है।
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: यह क्या है जो मैं तुम्हारे बारे में सुन रहा हूँ?
  rationale: यह यूनानी प्रश्न की विस्मय और जवाब-तलब करने वाली शक्ति को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ἀπόδος τὸν λόγον
  choice: हिसाब दो
  rationale: प्रशासनिक प्रसंग में λόγος लेखे या हिसाब को सूचित करता है, और ἀπόδος उसकी माँग करने वाली आज्ञा है। ‘हिसाब दो’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: τῆς οἰκονομίας σου
  choice: अपने प्रबंध का
  rationale: οἰκονομία किसी दूसरे की संपत्ति या घर सँभालने की जिम्मेदारी और उसके प्रशासन को सूचित करता है। ‘प्रबंध’ पद और कार्य—दोनों के अर्थक्षेत्र को पर्याप्त रूप से व्यक्त करता है।
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: क्योंकि अब तुम प्रबंध नहीं कर सकते
  rationale: δύνῃ के साथ क्रियार्थक रूप सामर्थ्य या अनुमति की समाप्ति व्यक्त करता है और ἔτι का नकार ‘अब ... नहीं’ से स्वाभाविक रूप में आता है। वाक्य जानबूझकर यह तय नहीं करता कि असमर्थता व्यावहारिक है या स्वामी द्वारा पद से हटाए जाने का परिणाम।
theological_decisions:
- issue: प्रबंध करने की असमर्थता बनाम पद से हटाया जाना
  choice: अब तुम प्रबंध नहीं कर सकते
  alternative: अब तुम प्रबंधक नहीं रह सकते
  rationale: मुख्य पाठ यूनानी δύνῃ + οἰκονομεῖν की क्रियात्मक रचना को निकटता से रखता है। वैकल्पिक पद-आधारित अर्थ को पादटिप्पणी में रखा गया है, ताकि कथन की प्रशासनिक और प्रसंगगत तनावपूर्ण अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रबंध’ और ‘हिसाब’ प्रशासनिक प्रसंग को स्पष्ट करते हैं; पद-विशेष के वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
