  verdict: approve
  source_fidelity: The Hindi accurately conveys the antecedent calling (φωνήσας), the confrontational question, the demand for an accounting (ἀπόδος τὸν λόγον), and the stated inability to continue managing (οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν). “अपने प्रबंध का हिसाब दो” appropriately renders the administrative-accounting sense without adding interpretive detail.
  naturalness: The wording is clear, modern, and suitably dignified. “यह क्या है जो मैं तुम्हारे बारे में सुन रहा हूँ?” and “हिसाब दो” are idiomatic in this context. The repeated use of “प्रबंध” is understandable and helps retain the lexical relationship between οἰκονομία and οἰκονομεῖν.
  terminology: “प्रबंध” adequately represents stewardship/management in this administrative setting, while “हिसाब” accurately expresses λόγος as an account or reckoning. The footnote alternative “प्रबंधक नहीं रह सकते” responsibly preserves the role-focused rendering without forcing it into the main text.
