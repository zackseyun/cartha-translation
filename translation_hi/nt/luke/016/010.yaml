id: LUK.16.10
reference: Luke 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: hi
  text: जो बहुत कम में विश्वासयोग्य है, वह बहुत अधिक में भी विश्वासयोग्य है[a]; और जो बहुत कम में अधर्मी है, वह बहुत अधिक में भी अधर्मी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सबसे छोटी बात में।’ यूनानी अभिव्यक्ति किसी बहुत छोटी या नगण्य वस्तु अथवा बात की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: ‘अधर्मी’ के लिए ‘बेईमान’ या ‘अन्यायी’ भी अनुवाद किया जा सकता है। यूनानी शब्द आर्थिक बेईमानी से अधिक व्यापक है, यद्यपि आसपास के प्रसंग में वह भाव उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यहाँ अर्थ केवल विश्वास करने वाला नहीं, बल्कि सौंपी गई बात में भरोसेमंद और निष्ठावान होना है। ‘विश्वासयोग्य’ इस भाव को व्यक्त करता है और समानांतर कथन को बनाए रखता है।
- source_word: ἐν ἐλαχίστῳ
  choice: बहुत थोड़े में
  rationale: ἐν के साथ यह पद उस क्षेत्र या परिस्थिति को बताता है जिसमें कोई विश्वासयोग्य अथवा अधर्मी सिद्ध होता है। यह अनुवाद πολλῷ के साथ मात्रात्मक विरोध को स्पष्ट रखता है।
- source_word: πολλῷ
  choice: बहुत में
  rationale: नपुंसकलिंग एकवचन रूप मात्रा या परिमाण को सूचित करता है और ἐλαχίστῳ के विपरीत खड़ा है। ‘बहुत में’ यूनानी समानांतरता को संक्षेप में सुरक्षित रखता है।
- source_word: ἄδικος
  choice: अधर्मी
  rationale: यह शब्द अन्यायपूर्ण या गलत आचरण का व्यापक नैतिक अर्थ रखता है। धन और भण्डारीपन के प्रसंग में ‘बेईमान’ संभव है, पर उससे अर्थ अनावश्यक रूप से आर्थिक बेईमानी तक सीमित हो सकता है।
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: जो ... विश्वासयोग्य है / जो ... अधर्मी है
  rationale: विशेषण के साथ प्रयुक्त निश्चित उपपद यहाँ व्यक्ति को सामान्य प्रतिनिधि के रूप में दर्शाता है। हिन्दी का ‘जो ... वह’ स्वाभाविक और लिंग-निरपेक्ष ढंग से यही बल व्यक्त करता है।
- source_word: καὶ
  choice: भी; और
  rationale: दोनों अर्धवाक्यों के भीतर ‘भी’ समान स्थितियों में गुण के बने रहने को दिखाता है, जबकि मुख्य कथनों को जोड़ने वाला καί ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: भण्डारीपन के प्रसंग में नैतिक विशेषण ἄδικος
  choice: अधर्मी
  alternative: बेईमान; अन्यायी
  rationale: कथन केवल धन-संबंधी ईमानदारी नहीं, बल्कि एक व्यापक नैतिक सिद्धान्त प्रकट करता है। ‘अधर्मी’ उस व्यापकता को बनाए रखता है, जबकि प्रसंग के कारण बेईमानी का भाव भी उससे बाहर नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में ‘जो ... वह’ संरचना से यूनानी प्रतिनिधि एकवचन और पद्य का संतुलित समानांतर रूप सुरक्षित रखा गया है। ‘बहुत थोड़े में / बहुत में’ जानबूझकर सममित है। भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है।
