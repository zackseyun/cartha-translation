  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: hi
  text: फ़रीसी, जो धन से प्रेम करते थे, ये सब बातें सुन रहे थे और उनका उपहास कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर नाक-भौं चढ़ाकर हँस रहे थे।” यूनानी क्रिया खुले उपहास या तिरस्कारपूर्ण ठट्ठे का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: सुन रहे थे
  rationale: अपूर्ण भूतकालीन रूप चल रही या उसी समय हो रही क्रिया को दिखाता है; इसलिए साधारण “सुना” के बजाय “सुन रहे थे” रखा गया है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ हल्के कथात्मक संक्रमण का काम करता है, प्रबल विरोध का नहीं। हिंदी वाक्य-प्रवाह में इसे अलग संयोजक दिए बिना स्वाभाविक रूप से व्यक्त किया जा सकता है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: यह यीशु की ठीक पहले कही गई बातों की ओर संकेत करता है; “ये सब बातें” हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसी
  rationale: सुसमाचारों में इस यहूदी धार्मिक समूह के लिए प्रचलित हिंदी नाम।
- source_word: φιλάργυροι ὑπάρχοντες
  choice: जो धन से प्रेम करते थे
  rationale: यह पदबंध उनकी स्थायी प्रवृत्ति का वर्णन करता है। यह “लालची” जैसे अधिक व्यापक नैतिक निष्कर्ष के बजाय यूनानी के ‘धन-प्रेमी’ अर्थ को सीधे रखता है।
- source_word: ἐξεμυκτήριζον
  choice: उपहास कर रहे थे
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार की जा रही क्रिया का संकेत देता है। “उपहास” में खुले तिरस्कार और ठट्ठे दोनों का भाव आ सकता है।
- source_word: αὐτόν
  choice: उनका
  rationale: सर्वनाम संदर्भ में यीशु की ओर संकेत करता है; हिंदी में आदरसूचक “उनका” स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: φιλάργυροι में फ़रीसियों के दोष का स्वरूप
  choice: जो धन से प्रेम करते थे
  alternative: जो लालची थे
  rationale: यूनानी शब्द विशेष रूप से धन से प्रेम को व्यक्त करता है। सीधा अनुवाद निकटवर्ती धन-संबंधी शिक्षा से संबंध बनाए रखता है और व्यापक नैतिक अर्थ अनावश्यक रूप से नहीं जोड़ता।
- issue: ἐξεμυκτήριζον में तिरस्कार की तीव्रता
  choice: उपहास कर रहे थे
  alternative: नाक चढ़ाकर उनकी हँसी उड़ा रहे थे
  rationale: मुख्य पाठ में संक्षिप्त और स्वाभाविक हिंदी रखी गई है, जबकि पाद-टिप्पणी बताती है कि क्रिया में केवल हल्का मज़ाक नहीं, बल्कि तिरस्कारपूर्ण ठट्ठा भी निहित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। “धन से प्रेम करते थे” मूल शब्द की विशिष्टता बनाए रखता है, और दोनों अपूर्ण भूतकालीन क्रियाओं को “रहे थे” से व्यक्त किया गया है।
