base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: hi
  text: लेकिन अब्राहम ने कहा, “उनके पास मूसा और भविष्यद्वक्ता हैं[a]; वे उनकी बात सुनें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मूसा और भविष्यद्वक्ता” से आशय मूसा से संबद्ध पवित्रशास्त्र के लेखों और भविष्यद्वक्ताओं की पुस्तकों के साक्ष्य से है।
    reason: cross_reference
  - marker: b
    text: या अधिक शाब्दिक रूप में, “वे उन्हें सुनें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: लेकिन ... ने कहा
  rationale: λέγει कथात्मक ऐतिहासिक वर्तमान है, जिसे स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है। δέ यहाँ उत्तर में हल्का विरोध दर्शाता है, इसलिए ‘लेकिन’ उपयुक्त है।
- source_word: Ἀβραάμ
  choice: अब्राहम
  rationale: नाम का रूप आधुनिक हिन्दी बाइबलीय परंपरा और प्रचलित उच्चारण के अनुरूप रखा गया है।
- source_word: Ἔχουσι
  choice: उनके पास ... हैं
  rationale: वर्तमान काल में उपलब्धता या अधिकार को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: मूसा और भविष्यद्वक्ता
  rationale: मूल का संक्षिप्त यहूदी मुहावरा सुरक्षित रखा गया है; यहाँ ये नाम उनसे संबद्ध पवित्रशास्त्रीय साक्ष्य की ओर संकेत करते हैं, पर मुख्य पाठ में इसे विस्तार देकर नहीं समझाया गया।
- source_word: ἀκουσάτωσαν
  choice: वे ... सुनें
  rationale: तीसरे पुरुष बहुवचन की आज्ञार्थक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; प्रसंग में इसका आशय ध्यान देकर मानना भी हो सकता है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: ἀκούω के साथ संबंधवाचक रूप सुनने के स्रोत की ओर संकेत करता है। हिन्दी ‘उनकी सुनें’ मूसा और भविष्यद्वक्ताओं के साक्ष्य पर ध्यान देने का भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘मूसा और भविष्यद्वक्ता’ का अभिप्राय
  choice: मुख्य पाठ में मूल मुहावरा रखा गया है और पादटिप्पणी में उसे मूसा से संबद्ध लेखों तथा भविष्यद्वक्ताओं की पुस्तकों के पवित्रशास्त्रीय साक्ष्य के रूप में स्पष्ट किया गया है।
  alternative: इसे केवल ऐतिहासिक व्यक्तियों मूसा और भविष्यद्वक्ताओं का संदर्भ मानना, या मुख्य पाठ में ‘मूसा की व्यवस्था और भविष्यद्वक्ताओं की पुस्तकें’ लिखना।
  rationale: लूका और यहूदी प्रयोग में यह वाक्यांश सामान्यतः पवित्रशास्त्र की ओर संकेत करता है। शाब्दिक वाक्यांश बनाए रखने से मूल की संक्षिप्तता और वास्तविक भाषिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘उनकी सुनें’ सामान्य पाठक के लिए स्वाभाविक है और सुनकर ध्यान देने के भाव को बनाए रखता है।
