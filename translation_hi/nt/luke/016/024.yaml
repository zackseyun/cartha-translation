  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: hi
  text: और उसने पुकारकर कहा, “हे पिता अब्राहम, मुझ पर दया कीजिए और लाज़र को भेजिए कि वह अपनी उँगली का सिरा पानी में डुबोकर मेरी जीभ को ठंडक पहुँचाए, क्योंकि मैं इस ज्वाला में घोर पीड़ा सह रहा हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं इस ज्वाला में यातना पा रहा हूँ।” यूनानी क्रिया तीव्र पीड़ा या यातना को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: पुकारकर
  rationale: यह कृदन्त ऊँची और व्याकुल आवाज़ में की गई पुकार का भाव देता है; ‘पुकारकर’ स्वाभाविक और स्रोत के निकट है।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: प्रत्यक्ष विनती में करुणा और दया दिखाने का सामान्य, गरिमापूर्ण हिन्दी प्रयोग।
- source_word: πέμψον
  choice: भेजिए
  rationale: आज्ञार्थक क्रिया का सीधा अर्थ रखते हुए आदरसूचक संबोधन के अनुरूप रूप चुना गया है।
- source_word: βάψῃ
  choice: डुबोकर
  rationale: βάπτω यहाँ उँगली के सिरे को पानी में क्षणभर डुबाने की ठोस क्रिया बताता है।
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: अपनी उँगली का सिरा
  rationale: यूनानी पदबंध की शारीरिक और दृश्यात्मक बारीकी को स्पष्ट रूप से बनाए रखता है।
- source_word: ὕδατος
  choice: पानी में
  rationale: βάψῃ के साथ प्रयुक्त संबंधकारक का स्वाभाविक हिन्दी रूप ‘पानी में डुबोकर’ है।
- source_word: καταψύξῃ
  choice: ठंडी करे
  rationale: ठंडक पहुँचाने की प्रत्यक्ष शारीरिक क्रिया को ‘ताज़ा करे’ की अपेक्षा अधिक ठीक से व्यक्त करता है।
- source_word: γλῶσσάν μου
  choice: मेरी जीभ
  rationale: शरीर के अंग का सीधा उल्लेख है; इसे रूपक बनाने का कोई संदर्भगत कारण नहीं है।
- source_word: ὀδυνῶμαι
  choice: मैं ... घोर पीड़ा सह रहा हूँ
  rationale: क्रिया तीव्र दुख या वेदना बताती है। ‘घोर पीड़ा’ उसकी तीव्रता रखती है, पर पीड़ा पहुँचाने वाले किसी बाहरी कर्ता को नहीं जोड़ती।
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: इस ज्वाला में
  rationale: φλόξ का विशिष्ट अर्थ ‘ज्वाला’ है, केवल व्यापक ‘आग’ नहीं; एकवचन चित्र भी सुरक्षित रहता है।
- source_word: Πάτερ Ἀβραάμ
  choice: हे पिता अब्राहम
  rationale: पूर्वज के रूप में किए गए संबोधन को सीधे और गरिमापूर्ण ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: धनी व्यक्ति की पीड़ा का निरूपण
  choice: क्योंकि मैं इस ज्वाला में घोर पीड़ा सह रहा हूँ
  alternative: क्योंकि मैं इस ज्वाला में यातना पा रहा हूँ
  rationale: ὀδυνῶμαι तीव्र पीड़ा व्यक्त करता है, लेकिन स्वयं यह नहीं बताता कि कोई बाहरी कर्ता उसे यातना दे रहा है। चुना हुआ रूप कथन की तीव्रता बनाए रखते हुए उस अतिरिक्त अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। अब्राहम के प्रति आदरसूचक क्रियारूप रखे गए हैं। ‘ज्वाला’ और ‘उँगली का सिरा’ मूल के ठोस चित्र को बनाए रखते हैं।
