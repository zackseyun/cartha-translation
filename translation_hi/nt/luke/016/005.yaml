source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: hi
  text: अपने स्वामी[a] के देनदारों में से हर एक को अपने पास बुलाकर उसने पहले व्यक्ति से कहा, “तुम्हें मेरे स्वामी को कितना देना है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द κύριος का अनुवाद प्रायः “प्रभु” किया जाता है, लेकिन यहाँ यह प्रबंधक के मानवीय अधिकारी को दर्शाता है; इसलिए प्रसंग के अनुसार “स्वामी” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाया
  rationale: मध्यवाच्य कृदन्त में किसी को अपने पास बुलाने का भाव है; हिन्दी में यह स्वाभाविक है और मुख्य क्रिया से पहले की कार्रवाई को बनाए रखता है।
- source_word: ἕνα ἕκαστον
  choice: हर एक
  rationale: यह पदबंध वितरणात्मक बल देता है; ‘हर एक’ प्रत्येक देनदार को अलग-अलग बुलाए जाने का भाव संक्षेप में व्यक्त करता है।
- source_word: χρεοφειλετῶν
  choice: देनदारों
  rationale: व्यावसायिक प्रसंग में यह उन लोगों को सूचित करता है जिन पर स्वामी का ऋण बकाया था; ‘देनदार’ सटीक और प्रचलित शब्द है।
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: अपने स्वामी के
  rationale: ἑαυτοῦ प्रबंधक की ओर लौटता है और κύριος यहाँ उसके मानवीय अधिकारी को दर्शाता है; इसलिए ‘अपने स्वामी के’ उपयुक्त है।
- source_word: ἔλεγεν
  choice: पूछा
  rationale: यूनानी अपूर्णकाल दृश्यगत अथवा क्रमिक क्रिया दिखा सकता है। हिन्दी में प्रत्येक देनदार के साथ होने वाली बातचीत की शुरुआत के लिए ‘पूछा’ अधिक स्वाभाविक है, और प्रश्नवाचक प्रत्यक्ष कथन ‘कहा’ की अपेक्षा आशय को स्पष्ट करता है।
- source_word: τῷ πρώτῳ
  choice: पहले से
  rationale: क्रम में पहले व्यक्ति को सूचित करने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Πόσον ὀφείλεις
  choice: तुम्हें ... कितना देना है
  rationale: ऋण के प्रसंग में πόσον राशि पूछता है और ὀφείλεις बकाया होने को; यह हिन्दी प्रयोग वर्तमान देयता को सहज रूप में व्यक्त करता है।
- source_word: τῷ κυρίῳ μου
  choice: मेरे स्वामी का
  rationale: यहाँ κύριος मानवीय स्वामी है और μου प्रबंधक के दृष्टिकोण को बनाए रखता है। ‘का ... देना’ आधुनिक हिन्दी में किसी व्यक्ति के प्रति बकाया राशि का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: घरेलू-आर्थिक दृष्टान्त में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: इस पद में संदर्भ प्रबंधक के मानवीय अधिकारी का है, किसी ईश्वरीय या मसीही उपाधि का नहीं। ‘स्वामी’ सामाजिक-आर्थिक संबंध को स्पष्ट करता है और अनावश्यक ईश्वरीय संकेत से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘अपने पास बुलाया’ मूल के मध्यवाच्य भाव को और ‘हर एक’ वितरणात्मक बल को बनाए रखता है।
