  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: hi
  text: पर उसने उससे कहा, “यदि वे मूसा और भविष्यद्वक्ताओं की बात नहीं सुनते[a], तो मरे हुओं में से[b] कोई जी उठे, तब भी वे कायल नहीं होंगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नहीं सुनते और ध्यान नहीं देते।” यूनानी क्रिया सुनने के साथ बात पर ध्यान देने या उसे मानने का भाव भी समेट सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “मृतकों में से।” यूनानी में ‘मरे हुओं’ के लिए बहुवचन है।
    reason: lexical_alternative
  - marker: c
    text: या “आश्वस्त नहीं होंगे” या “राज़ी नहीं होंगे।” यूनानी का अर्थ कायल या आश्वस्त होना है; यहाँ अनिवार्य रूप से संकुचित धार्मिक अर्थ में ‘विश्वास करना’ नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: पर उसने उससे कहा
  rationale: δέ संवाद में हल्का विरोध प्रकट करता है; ‘पर’ इसे सहज हिन्दी में बनाए रखता है।
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: मूसा और भविष्यद्वक्ताओं की बात
  rationale: यह इस्राएल को दिए गए अधिकृत शास्त्रीय साक्ष्य की प्रचलित यहूदी अभिव्यक्ति है। ‘की बात’ हिन्दी में ἀκούω के स्वाभाविक संबंध को स्पष्ट करती है, पर इसे ‘पवित्रशास्त्र’ कहकर मूल मुहावरे को नहीं बदलती।
- source_word: οὐκ ἀκούουσιν
  choice: नहीं सुनते
  rationale: ἀκούω में सुनना और ध्यान देकर ग्रहण करना, दोनों अर्थ हो सकते हैं। ‘नहीं सुनते’ इस अर्थ-व्याप्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐδ’ ἐάν
  choice: तो ... तब भी नहीं
  rationale: यह रचना पहली नकारात्मक शर्त को दूसरी, अधिक प्रबल काल्पनिक स्थिति तक ले जाती है। ‘तब भी’ उसका आलंकारिक बल स्पष्ट करता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: ἐκ के ‘में से’ और νεκρῶν के बहुवचन को स्पष्ट रखते हुए यह पुनरुत्थान की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ἀναστῇ
  choice: जी उठे
  rationale: ἐάν के साथ प्रयुक्त aorist subjunctive को हिन्दी की सहज शर्तसूचक क्रिया से व्यक्त किया गया है; पुनरुत्थान के प्रसंग में ‘जी उठे’ स्पष्ट और स्वाभाविक है।
- source_word: πεισθήσονται
  choice: वे नहीं मानेंगे
  rationale: πεισθήσονται का अर्थ किसी बात से सहमत या कायल होना है। ‘नहीं मानेंगे’ सामान्य हिन्दी में इस भाव को व्यक्त करता है और इसे केवल संकुचित धार्मिक अर्थ वाले ‘विश्वास करेंगे’ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘मूसा और भविष्यद्वक्ताओं’ का आशय
  choice: इस्राएल को पहले से दिए गए अधिकृत शास्त्रीय साक्ष्य का संदर्भ
  alternative: केवल दो प्रतिनिधि व्यक्तियों—मूसा और भविष्यद्वक्ताओं—का उल्लेख
  rationale: प्रसंग में यह अभिव्यक्ति व्यवस्था और भविष्यद्वक्ताओं में उपलब्ध शास्त्रीय गवाही की ओर संकेत करती है। फिर भी अनुवाद में मूल अभिव्यक्ति रखी गई है, उसे व्याख्यात्मक रूप से ‘पवित्रशास्त्र’ नहीं बनाया गया।
- issue: πεισθήσονται का बल
  choice: बात मानना या उससे कायल होना
  alternative: विशेष रूप से धार्मिक विश्वास करना या मन फिराना
  rationale: यूनानी क्रिया सामान्य रूप से राज़ी या आश्वस्त होने को बताती है। ‘विश्वास करेंगे’ अथवा ‘मन फिराएँगे’ कहना मूल से अधिक विशिष्ट धर्मवैज्ञानिक अर्थ जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’, ‘बात नहीं सुनते’, ‘जी उठे’ और ‘तब भी’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘मूसा और भविष्यद्वक्ताओं’ का मूल शास्त्रीय मुहावरा सुरक्षित रखा गया है, और πεισθήσονται की व्यापक अर्थ-सीमा को ‘नहीं मानेंगे’ तथा पादटिप्पणी द्वारा संरक्षित किया गया है।
