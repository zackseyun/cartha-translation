reference: Luke 16:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: hi
  text: व्यवस्था और भविष्यद्वक्ता यूहन्ना तक थे; तब से परमेश्वर के राज्य का शुभ समाचार सुनाया जा रहा है, और हर कोई उसमें बलपूर्वक प्रवेश कर रहा है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हर कोई उसमें जोर लगाकर प्रवेश कर रहा है।” यूनानी क्रिया बल या प्रबल प्रयास के साथ आगे बढ़ने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: मत्ती 11:12 के समान कथन के प्रकाश में कुछ लोग अंतिम खंड को अधिक नकारात्मक अर्थ में समझते हैं। पर यहाँ यूनानी वाक्य में क्रिया का कर्ता “हर कोई” है, “राज्य” नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: व्यवस्था और भविष्यद्वक्ता
  rationale: यह यहूदी पवित्रशास्त्र की प्रचलित दोहरी श्रेणी को दर्शाता है; ‘व्यवस्था’ मूसा की व्यवस्था और ‘भविष्यद्वक्ता’ उस मान्य शास्त्रीय वर्ग को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: μέχρι Ἰωάννου
  choice: यूहन्ना तक थे
  rationale: ‘तक’ उद्धार-इतिहास में एक समय-सीमा को बनाए रखता है। प्रसंग से यूहन्ना बपतिस्मा देनेवाला अभिप्रेत है, इसलिए अतिरिक्त उपाधि जोड़ना आवश्यक नहीं। ‘थे’ यूनानी के संक्षिप्त, क्रियारहित वाक्य का हिन्दी में स्वाभाविक पूरक है।
- source_word: ἀπὸ τότε
  choice: तब से
  rationale: समय में आरम्भ हुए और आगे जारी परिवर्तन को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: βασιλεία के शासन और राज्य—दोनों संभावित आयामों को खुला रखने वाला मानक हिन्दी पद है।
- source_word: εὐαγγελίζεται
  choice: शुभ समाचार सुनाया जा रहा है
  rationale: वर्तमानकालीन कर्मवाच्य और εὐαγγελίζω के शुभ-संदेश वाले अर्थ दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: πᾶς
  choice: हर कोई
  rationale: एकवचन के वितरणात्मक और व्यापक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτὴν βιάζεται
  choice: उसमें बलपूर्वक प्रवेश कर रहा है
  rationale: εἰς के भीतर की ओर गति और कठिन βιάζεται की प्रबल/जोरदार गति का अर्थ सुरक्षित रहता है; हिन्दी वाक्य में कर्ता ‘हर कोई’ ही बना रहता है।
theological_decisions:
- issue: βιάζεται का अर्थ और कर्ता
  choice: लोग परमेश्वर के राज्य में बलपूर्वक प्रवेश कर रहे हैं
  alternative: लोग उसमें जोर लगाकर प्रवेश कर रहे हैं; अथवा, समानांतर कथन के प्रभाव में इसे राज्य पर हिंसा होने के अर्थ में समझना
  rationale: लूका के यूनानी वाक्य में πᾶς (‘हर कोई’) βιάζεται का कर्ता है और εἰς αὐτήν राज्य के भीतर की ओर गति दिखाता है। फिर भी क्रिया का मध्य/कर्मवाच्य रूप और उसका बल अथवा हिंसा संबंधी अर्थ कठिन है, इसलिए वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है; अनुवाद इसे आत्म-उद्धार या पुण्य कमाने का सिद्धान्त नहीं बनाता।
- issue: ‘व्यवस्था और भविष्यद्वक्ता ... तक’ का संबंध
  choice: यूहन्ना तक एक समय-सीमा का संक्षिप्त कथन
  alternative: व्यवस्था और भविष्यद्वक्ताओं की वैधता यूहन्ना पर पूर्णतः समाप्त हो गई
  rationale: मूल पाठ केवल समय-सीमा बताता है और स्पष्ट रूप से ‘समाप्त’ या ‘निरस्त’ नहीं कहता; इसलिए अनुवाद अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘शुभ समाचार सुनाया जा रहा है’ कर्मवाच्य और सतत घोषणा को बनाए रखता है। कठिन अंतिम खंड को मुख्य पाठ में स्पष्ट किया गया है, पर उसकी वास्तविक शाब्दिक और धर्मवैज्ञानिक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
