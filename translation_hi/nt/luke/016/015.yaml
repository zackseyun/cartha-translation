source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: hi
  text: और उसने उनसे कहा, “तुम ही वे लोग हो जो लोगों के सामने अपने आपको धर्मी ठहराते हो, पर परमेश्वर तुम्हारे हृदयों को जानता है। क्योंकि जो कुछ लोगों के बीच ऊँचा माना जाता है[a], वह परमेश्वर की दृष्टि में घृणित है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे लोग बहुत मूल्यवान समझते हैं।”
    reason: alternative_reading
  - marker: b
    text: या, “परमेश्वर की दृष्टि में घृणास्पद वस्तु है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: अपने आपको धर्मी ठहराते हो
  rationale: 'यह प्रतिवर्ती क्रिया के आरोपात्मक भाव को बनाए रखता है: वे दूसरों के सामने स्वयं को धर्मी या सही सिद्ध करते हैं। ‘धर्मी ठहराना’ δικαιόω के धार्मिक और न्यायिक अर्थ-संबंध को भी सुरक्षित रखता है।'
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: ἐνώπιον का अर्थ ‘सामने/दृष्टि में’ है और ἀνθρώπων यहाँ सभी मनुष्यों के लिए सामान्य रूप से प्रयुक्त है। आधुनिक हिन्दी में ‘लोगों’ से यह समावेशी अर्थ स्वाभाविक ढंग से व्यक्त होता है।
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: तुम्हारे हृदयों को जानता है
  rationale: ‘हृदय’ बाइबलीय रूपक को बनाए रखता है, जिसमें मनुष्य का भीतरी व्यक्तित्व, विचार और अभिप्राय सम्मिलित हैं।
- source_word: τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: जो कुछ लोगों के बीच ऊँचा माना जाता है
  rationale: यह ὑψηλόν के ऊँचाई वाले रूपक और सामाजिक प्रतिष्ठा—दोनों को बनाए रखता है। ‘माना जाता है’ हिन्दी में वाक्य को स्वाभाविक बनाता है, जबकि मूल्यवान या प्रतिष्ठित होने तक अर्थ को सीमित नहीं करता।
- source_word: βδέλυγμα
  choice: घृणित
  rationale: यह परमेश्वर की दृष्टि में अत्यन्त अप्रिय और अस्वीकार्य होने का प्रबल भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। अधिक औपचारिक विकल्प ‘घृणास्पद वस्तु’ पादटिप्पणी में दिया गया है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर की दृष्टि में
  rationale: यह दैवी मूल्यांकन का भाव स्पष्ट करता है और पहले खंड में मनुष्यों के सामने किए गए आत्म-प्रदर्शन के साथ विरोध बनाए रखता है।
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: तुम ही वे लोग हो जो ...
  rationale: ‘तुम ही’ यूनानी सर्वनाम की प्रबलता को व्यक्त करता है और आरोप को सपाट सामान्य कथन बनने से बचाता है।
theological_decisions:
- issue: δικαιοῦντες का आत्म-धर्मी प्रदर्शन और न्यायिक अर्थ
  choice: अपने आपको धर्मी ठहराते हो
  alternative: अपने आपको सही सिद्ध करते हो
  rationale: मुख्य पाठ δικαιόω के ‘धर्मी ठहराने’ वाले अर्थ-संबंध को सुरक्षित रखता है, पर यह दावा नहीं करता कि वे वास्तव में परमेश्वर द्वारा धर्मी ठहराए गए हैं; संदर्भ में यह लोगों के सामने स्वयं को धर्मी प्रस्तुत करने का आरोप है।
- issue: τὸ ἐν ἀνθρώποις ὑψηλόν का अर्थ
  choice: जो कुछ लोगों के बीच ऊँचा माना जाता है
  alternative: जिसे लोग बहुत मूल्यवान समझते हैं
  rationale: यूनानी पद सामाजिक प्रतिष्ठा, प्रशंसा या उच्च मूल्यांकन की ओर संकेत कर सकता है। मुख्य पाठ ऊँचाई का रूपक और अर्थ की व्यापकता बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में है।
- issue: βδέλυγμα की धार्मिक तीव्रता
  choice: घृणित
  alternative: घृणास्पद वस्तु
  rationale: ‘घृणित’ मूल की तीव्र नकारात्मक दैवी प्रतिक्रिया को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है। पादटिप्पणी संज्ञात्मक संरचना को सुरक्षित रखती है, बिना किसी विशेष सांप्रदायिक अर्थ को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम ही’ मूल के बलाघात को दर्शाता है; ‘लोगों’ का प्रयोग यूनानी ἀνθρώπων के सामान्य, समावेशी अर्थ के लिए किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
