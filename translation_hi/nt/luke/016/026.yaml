reference: Luke 16:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: hi
  text: और इन सब बातों के अलावा[a], हमारे और तुम लोगों के बीच एक बड़ी खाई कायम कर दी गई है, ताकि जो यहाँ से तुम्हारे पास पार जाना चाहें, वे न जा सकें, और न ही वहाँ से लोग हमारे पास पार आ सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इन सब बातों में।” यूनानी पदबंध का यह अधिक शाब्दिक अनुवाद है; संदर्भ में यह एक और विचार जोड़ने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: इन सब बातों के अलावा
  rationale: संदर्भ में यह यूनानी पदबंध एक अतिरिक्त विचार प्रस्तुत करता है। यह हिन्दी में स्वाभाविक है; अधिक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है।
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: हमारे और तुम लोगों के बीच
  rationale: ὑμῶν के बहुवचन को ‘तुम लोगों’ से स्पष्ट किया गया है और स्थानिक संबंध सुरक्षित रखा गया है।
- source_word: χάσμα μέγα
  choice: एक बड़ी खाई
  rationale: ‘खाई’ दोनों ओर के बीच गहरे, पार न किए जा सकने वाले अंतराल को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐστήρικται
  choice: कायम कर दी गई है
  rationale: पूर्ण निष्क्रिय क्रिया द्वारा व्यक्त स्थापित और बनी हुई अवस्था को स्वाभाविक हिन्दी में दर्शाता है, बिना कर्ता को स्पष्ट रूप से जोड़ने के।
- source_word: ὅπως
  choice: ताकि
  rationale: आगे आने वाले उद्देश्य/परिणाम संबंध को संक्षेप और स्वाभाविक रूप में बनाए रखता है।
- source_word: οἱ θέλοντες διαβῆναι
  choice: जो ... पार जाना चाहें
  rationale: इच्छा व्यक्त करने वाले संज्ञात्मक कृदंत और पार जाने की स्थानिक क्रिया, दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: ἔνθεν πρὸς ὑμᾶς
  choice: यहाँ से तुम्हारे पास
  rationale: वक्ता की ओर से आरंभ होने वाली दिशा को सुरक्षित रखता है।
- source_word: μὴ δύνωνται
  choice: न जा सकें
  rationale: यह निषेध नहीं बल्कि असमर्थता व्यक्त करता है; हिन्दी में ‘सकें’ वही भाव स्पष्ट करता है।
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: और न ही वहाँ से लोग हमारे पास पार आ सकें
  rationale: दूसरी दिशा से पार आने की समान असंभवता को दर्शाता है। यूनानी में दूसरे खंड का कर्ता निहित है; हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए सामान्य ‘लोग’ रखा गया है।
theological_decisions:
- issue: दृष्टान्त में दोनों क्षेत्रों के बीच अलगाव की प्रकृति
  choice: भाषा को स्थापित और पार न किए जा सकने वाले अलगाव के रूप में प्रस्तुत किया गया है, पर इसे पद से आगे बढ़ाकर कोई व्यवस्थित परलोक-सिद्धान्त नहीं बनाया गया।
  alternative: खाई को परलोक की अक्षरशः भौगोलिक रचना मानना, या भाषा को केवल अलंकारिक मानकर स्थायी अलगाव के संकेत को कम करना।
  rationale: पद स्वयं खाई के कायम होने और दोनों दिशाओं से पार जाने की असमर्थता पर बल देता है। अनुवाद इसी तनाव को रखता है और अतिरिक्त doctrinal निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘तुम लोगों’ से मूल का बहुवचन स्पष्ट होता है। ‘कायम कर दी गई है’ स्थिर और बनी हुई अवस्था व्यक्त करता है, जबकि किसी अनुल्लिखित कर्ता या अतिरिक्त धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
