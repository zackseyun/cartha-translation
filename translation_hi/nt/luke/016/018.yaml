  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: hi
  text: जो कोई अपनी पत्नी को तलाक देकर दूसरी स्त्री से विवाह करता है, वह व्यभिचार करता है; और जो कोई अपने पति से तलाकशुदा स्त्री से विवाह करता है, वह व्यभिचार करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: जो कोई
  rationale: यह सामान्य और सार्वभौमिक कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπολύων
  choice: तलाक देकर
  rationale: वैवाहिक संदर्भ में क्रिया का अर्थ केवल ‘छोड़ देना’ नहीं, बल्कि विवाह-विच्छेद करना है। कृदन्त का संबंध अगली क्रिया से बनाए रखने के लिए ‘देकर’ चुना गया है।
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी को
  rationale: यहाँ γυνή का अर्थ वैवाहिक संदर्भ के कारण ‘पत्नी’ है; आत्मवाचक ‘अपनी’ हिन्दी में कर्ता के साथ संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: γαμῶν ἑτέραν
  choice: दूसरी स्त्री से विवाह करता है
  rationale: ἑτέραν स्त्रीलिंग में प्रयुक्त होकर ‘दूसरी स्त्री’ का बोध कराता है। हिन्दी में विवाह के साथ ‘से’ स्वाभाविक है।
- source_word: μοιχεύει
  choice: व्यभिचार करता है
  rationale: यह क्रिया वैवाहिक बेवफाई अर्थात व्यभिचार करने को दर्शाती है; यह हिन्दी में स्पष्ट और प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: पति से तलाक पाई हुई स्त्री
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त तलाक के बाद की अवस्था को व्यक्त करता है। ‘पति से’ ἀπό की ‘से’ वाली अभिव्यक्ति को बनाए रखता है और उसे अधिक विशिष्ट रूप से ‘पति द्वारा’ कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: तलाक और पुनर्विवाह संबंधी कथन का दायरा
  choice: लूका में दिए गए कथन को बिना किसी अतिरिक्त अपवाद के सार्वभौमिक नैतिक कथन के रूप में अनूदित किया गया है।
  alternative: मत्ती के समानांतर कथन से व्यभिचार-संबंधी अपवाद जोड़ना या किसी विशिष्ट कानूनी परिस्थिति तक इसका अर्थ सीमित करना।
  rationale: इस पद के यूनानी पाठ में कोई अपवाद अथवा स्पष्ट सीमित परिस्थिति नहीं दी गई है। दूसरे अंशों से योग्यता जोड़ना अनुवाद के बजाय सामंजस्यकारी व्याख्या होगी।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तलाक’ सामान्य पाठक के लिए ‘त्यागपत्र देना’ या ‘परित्याग करना’ से अधिक सटीक और सहज है। दोनों खंडों की समानांतर संरचना और मूल कथन की कठोरता सुरक्षित रखी गई है।
