reference: Luke 16:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: hi
  text: और मालिक[a] ने उस अधर्मी प्रबंधक की प्रशंसा की, क्योंकि उसने चतुराई से काम लिया। क्योंकि इस युग के पुत्र[b] अपनी पीढ़ी के लोगों के साथ व्यवहार करने में ज्योति के पुत्रों से अधिक चतुर हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु ने उस अधर्मी प्रबंधक की प्रशंसा की।” यहाँ “मालिक” अधिक संभावित है, क्योंकि κύριος स्वाभाविक रूप से दृष्टान्त के मालिक की ओर संकेत करता है, न कि सीधे यीशु या परमेश्वर की ओर।
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक रूप से “इस युग के पुत्र” और “ज्योति के पुत्र” है। ये अभिव्यक्तियाँ वर्तमान युग से ढले लोगों और परमेश्वर की ज्योति से पहचाने जाने वाले लोगों के बीच भेद करती हैं।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से, “अपनी ही पीढ़ी के प्रति ज्योति के पुत्रों से अधिक चतुर हैं।” यूनानी वाक्यांश कठिन है; मुख्य पाठ अपनी पीढ़ी या अपने समकालीन लोगों के बीच चतुराई से व्यवहार करने का संभावित भाव स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: मालिक
  rationale: दृष्टान्त के तत्काल संदर्भ में यह धनी व्यक्ति, अर्थात प्रबंधक के मालिक, की ओर संकेत करता है। ‘मालिक’ आधुनिक हिन्दी में इस सामाजिक भूमिका को स्पष्ट करता है; ‘प्रभु’ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: οἰκονόμον
  choice: प्रबंधक
  rationale: यह घर या सम्पत्ति के प्रशासन का दायित्व सँभालने वाले व्यक्ति के लिए सहज आधुनिक हिन्दी शब्द है; ‘भण्डारी’ अधिक पारम्परिक और आज कम पारदर्शी है।
- source_word: τῆς ἀδικίας
  choice: अधर्मी
  rationale: यह संबंधकारक प्रयोग प्रबंधक के नैतिक चरित्र या अधर्म से उसके संबंध को बताता है। ‘अधर्मी’ नैतिक बल बनाए रखता है, पर अपराध के किसी खास रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: φρονίμως
  choice: चतुराई से
  rationale: यह परिणाम साधने वाली व्यावहारिक सूझ-बूझ को व्यक्त करता है। ‘चतुराई से’ उसकी रणनीतिक कुशलता की प्रशंसा दिखाता है, पर उसके आचरण को नैतिक रूप से बुद्धिमान घोषित नहीं करता।
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: इस युग के पुत्र
  rationale: यह सामी शैली का वर्ग-सूचक रूपक है। स्रोत की पुत्र-छवि और ‘ज्योति के पुत्रों’ के साथ समानांतरता सुरक्षित रखी गई है।
- source_word: φρονιμώτεροι
  choice: अधिक चतुर
  rationale: यह φρονίμως के ही अर्थ-क्षेत्र को तुलनात्मक रूप में बनाए रखता है और ‘अधिक बुद्धिमान’ के सम्भावित नैतिक अनुमोदन से बचता है।
- source_word: ὑπὲρ
  choice: से अधिक
  rationale: तुलनात्मक विशेषण के साथ ὑπέρ तुलना का चिह्न है; हिन्दी में ‘से अधिक’ इसका स्वाभाविक समतुल्य है।
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: ज्योति के पुत्र
  rationale: यह परमेश्वर की ज्योति से पहचाने जाने वाले लोगों के लिए बाइबलीय रूपक है और ‘इस युग के पुत्र’ के साथ औपचारिक समानांतरता बनाए रखता है।
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: अपनी पीढ़ी के लोगों के साथ व्यवहार करने में
  rationale: यूनानी वाक्यांश कठिन है और उसका शाब्दिक रूप ‘अपनी पीढ़ी के प्रति/लिए’ हिन्दी में अस्पष्ट रहेगा। चुना हुआ रूप अपनी समकालीन मंडली या अपने वर्ग के भीतर व्यवहार करने के सम्भावित संबंधपरक भाव को स्पष्ट करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पहले उपवाक्य में ὁ κύριος की पहचान
  choice: दृष्टान्त के भीतर का मालिक
  alternative: ‘प्रभु’—अर्थात यीशु या परमेश्वर के लिए सीधा संबोधन
  rationale: निकट साहित्यिक संदर्भ धनी व्यक्ति और उसके प्रबंधक का है। ‘मालिक’ आंतरिक कथात्मक संदर्भ को बनाए रखता है और यह अनावश्यक संकेत नहीं देता कि यीशु अधर्म का नैतिक अनुमोदन कर रहे हैं। फिर भी यूनानी शब्द की वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: प्रबंधक के कार्य का नैतिक मूल्यांकन
  choice: अधर्म का अनुमोदन किए बिना उसकी व्यावहारिक चतुराई की प्रशंसा
  alternative: उसके कार्य को नैतिक बुद्धिमत्ता मानना या उसकी बेईमानी का अनुमोदन समझना
  rationale: पद प्रबंधक को ἀδικία से चिह्नित करता है, फिर भी कहता है कि उसने φρονίμως कार्य किया। ‘अधर्मी’ और ‘चतुराई’ दोनों रखकर मूल पाठ का नैतिक तनाव सुलझाए बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रबंधक’ आज के पाठक के लिए ‘भण्डारी’ से अधिक स्पष्ट है। ‘चतुराई’ रणनीतिक सूझ को व्यक्त करती है और नैतिक प्रशंसा का अर्थ थोपने से बचती है। स्रोत के समानांतर रूपकों को सुरक्षित रखने के लिए ‘इस युग के पुत्र’ और ‘ज्योति के पुत्र’ बनाए रखे गए हैं।
