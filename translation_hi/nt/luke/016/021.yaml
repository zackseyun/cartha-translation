  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: hi
  text: और वह तरसता था कि धनी की मेज़ से जो कुछ गिरता था, उसी से उसका पेट भर जाए[a]। पर कुत्ते भी आकर उसके घाव चाटते रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धनी की मेज़ से गिरने वाले टुकड़ों से।” यूनानी में शाब्दिक रूप से “जो कुछ गिरता था” है; “टुकड़े” भोजन के प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: तरसता था
  rationale: वर्तमान कृदन्त लाज़र की लगातार और तीव्र इच्छा प्रकट करता है; ‘तरसता था’ आधुनिक हिन्दी में इस जारी लालसा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χορτασθῆναι
  choice: उसका पेट भर जाए
  rationale: निष्क्रिय अनंत क्रिया भोजन से तृप्त किए जाने का भाव रखती है। हिन्दी में ‘उसका पेट भर जाए’ निष्क्रिय परिणाम और भोजन-संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τῶν πιπτόντων
  choice: जो कुछ गिरता था, उसी से
  rationale: लेखयुक्त कृदन्त का अर्थ शाब्दिक रूप से ‘जो गिर रहा था’ है। ‘जो कुछ गिरता था’ अपूर्ण पक्ष को बनाए रखता है और मूल में न आए ‘टुकड़े’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: धनी की मेज़ से
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण पिछले पद के धनी मनुष्य को सूचित करता है; हिन्दी में ‘धनी की मेज़’ संक्षिप्त और स्पष्ट है।
- source_word: ἀλλὰ καὶ
  choice: पर ... भी
  rationale: यह संरचना विरोध के साथ एक अतिरिक्त, चौंकाने वाला तथ्य जोड़ती है; ‘पर ... भी’ दोनों तत्वों को बनाए रखता है।
- source_word: οἱ κύνες
  choice: कुत्ते
  rationale: मूल में साधारण बहुवचन ‘कुत्ते’ है; उनके प्रकार या व्यवहार के आशय को अतिरिक्त रूप से निर्दिष्ट नहीं किया गया।
- source_word: ἐρχόμενοι
  choice: आकर
  rationale: परिस्थितिजन्य कृदन्त को हिन्दी में ‘आकर’ मुख्य क्रिया से स्वाभाविक रूप से जोड़ता है।
- source_word: ἐπέλειχον
  choice: चाटते रहते थे
  rationale: अपूर्णकाल बार-बार या लगातार होने वाली क्रिया दिखाता है; ‘चाटते रहते थे’ इस पक्ष को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τὰ ἕλκη αὐτοῦ
  choice: उसके घाव
  rationale: ἕλκη खुले या फोड़े-जैसे घावों को सूचित करता है। ‘घाव’ सामान्य पाठकों के लिए स्पष्ट और गरिमापूर्ण है, जबकि अधिक चिकित्सकीय शब्द अनावश्यक रूप से संकीर्ण होंगे।
theological_decisions:
- issue: कुत्तों द्वारा घाव चाटने का आशय
  choice: क्रिया को बिना व्याख्यात्मक मूल्यांकन के प्रस्तुत किया गया है
  alternative: इसे करुणा, उपचार, अपमान या अशुद्धता के संकेत के रूप में स्पष्ट करना
  rationale: यूनानी पाठ केवल कुत्तों के आने और घाव चाटते रहने की बात कहता है; वह इस क्रिया का धार्मिक या भावात्मक अर्थ स्वयं निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘तरसता था’ और ‘चाटते रहते थे’ जारी क्रियाओं का भाव रखते हैं। मुख्य पाठ में संदर्भ से अनुमानित ‘टुकड़े’ नहीं जोड़ा गया, बल्कि पादटिप्पणी में विकल्प दिया गया है।
