id: LUK.18.8
reference: Luke 18:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: hi
  text: मैं तुमसे कहता हूँ कि वह शीघ्र ही उन्हें न्याय दिलाएगा।[a] फिर भी, जब मनुष्य का पुत्र आएगा, तो क्या वह पृथ्वी पर विश्वास पाएगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका पक्ष सही ठहराएगा’ अथवा ‘उनके लिए न्याय करेगा।’ यूनानी पद किसी व्यक्ति के पक्ष में कानूनी न्याय या उसके उचित ठहराए जाने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भरोसा’ अथवा ‘निष्ठा।’ यूनानी शब्द विश्वास, भरोसे या विश्वासयोग्यता का भाव दे सकता है; मुख्य पाठ में व्यापक शब्द ‘विश्वास’ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: उन्हें न्याय दिलाएगा
  rationale: विधवा की कानूनी फरियाद के संदर्भ में यह प्रयोग प्रतिशोध से अधिक न्याय दिलाने या पक्ष में न्याय करने का भाव रखता है; हिन्दी में यह स्वाभाविक रूप से लाभार्थियों को भी स्पष्ट करता है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: यह अभिव्यक्ति तेजी से या बिना विलंब के कार्य करने का भाव रखती है। ‘शीघ्र ही’ उसकी समय-संबंधी शक्ति बनाए रखता है, पर किसी निश्चित समय-सारणी को नहीं थोपता।
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले आश्वासन और आगे के खोजी प्रश्न के बीच प्रबल विरोधसूचक संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट आत्म-उपाधि और दानिय्येल 7 से उसके अंतर्पाठीय संबंध को सुरक्षित रखता है।
- source_word: ἐλθὼν
  choice: जब ... आएगा
  rationale: कृदंत को यहाँ मुख्य क्रिया के साथ कालवाचक संबंध में समझना स्वाभाविक है; हिन्दी में ‘जब ... आएगा’ स्पष्ट और सहज है।
- source_word: ἆρα
  choice: क्या
  rationale: ἆρα प्रश्न को विचारोत्तेजक और खोजी बनाता है। हिन्दी की प्रश्न-रचना और प्रसंग में ‘क्या’ इस बल को स्वाभाविक रूप से वहन करता है; ‘वास्तव में’ जोड़ना अर्थ को अनावश्यक रूप से अधिक स्पष्ट कर सकता है।
- source_word: τὴν πίστιν
  choice: विश्वास
  rationale: ‘विश्वास’ πίστις की व्यापकता को बनाए रखता है और इसे केवल निष्ठा या भरोसे तक सीमित नहीं करता। निश्चित लेख प्रसंग में उस प्रकार के धीरजपूर्ण विश्वास की ओर संकेत कर सकता है, पर मुख्य पाठ इसे व्याख्यात्मक रूप से संकरा नहीं करता।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: अंतकालीन प्रसंग में γῆ का व्यापक अर्थ यहाँ सबसे स्वाभाविक है; ‘पृथ्वी पर’ हिन्दी में स्पष्ट है और इसे केवल किसी विशेष देश तक सीमित नहीं करता।
theological_decisions:
- issue: πίστις का अर्थ विश्वास, भरोसा या विश्वासयोग्यता/निष्ठा हो सकता है
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता या निष्ठा
  rationale: मुख्य पाठ में ‘विश्वास’ यूनानी शब्द की अर्थ-व्याप्ति को सबसे अच्छी तरह खुला रखता है। प्रार्थना में टिके रहने का प्रसंग भरोसे या निष्ठा का संकेत दे सकता है, इसलिए ये संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: ἐκδίκησις में न्याय दिलाने और प्रतिशोध लेने के भावों का संबंध
  choice: उन्हें न्याय दिलाएगा
  alternative: उनका पक्ष सही ठहराएगा; उनके लिए न्याय करेगा; उनका बदला लेगा
  rationale: दृष्टान्त का न्यायिक प्रसंग कानूनी न्याय और पक्ष-समर्थन को प्रमुख बनाता है। ‘बदला लेगा’ सम्भव शब्दार्थ होते हुए भी हिन्दी में प्रतिशोध का अधिक प्रबल अर्थ ला सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘मनुष्य का पुत्र’ पारंपरिक बाइबिलीय उपाधि के रूप में रखा गया है। वाक्य की प्रश्नात्मक तीक्ष्णता बनाए रखते हुए अनावश्यक व्याख्यात्मक शब्द नहीं जोड़े गए।
