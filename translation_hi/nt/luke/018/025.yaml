source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: hi
  text: क्योंकि ऊँट के लिए सुई के छेद में से प्रवेश करना, धनवान व्यक्ति के लिए परमेश्वर के राज्य में प्रवेश करने से अधिक आसान है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सुई की आँख में से।”'
    reason: lexical_alternative
  - marker: b
    text: बाद की कुछ व्याख्याओं में “सुई का छेद” नामक संकरे फाटक का विचार, या “ऊँट” के स्थान पर “रस्सी” का अर्थ प्रस्तावित किया गया है; पर यहाँ यूनानी पाठ में “ऊँट” ही है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: अधिक आसान
  rationale: तुलनात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दोनों पक्षों की कठिनाई की सीधी तुलना बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण या स्पष्टीकरण से पद को जोड़ता है।
- source_word: κάμηλον
  choice: ऊँट
  rationale: यूनानी शब्द का सामान्य और पाठ-साक्ष्य से समर्थित अर्थ ‘ऊँट’ है; इसे ‘रस्सी’ जैसे व्याख्यात्मक विकल्प से बदलना उचित नहीं।
- source_word: διὰ τρήματος βελόνης
  choice: सुई के छेद में से
  rationale: शाब्दिक अर्थ ‘सुई के छेद/खुलाव के बीच से’ है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने / निकल जाना
  rationale: दोनों बार एक ही यूनानी क्रिया है। राज्य के साथ ‘प्रवेश करना’ स्वाभाविक है, जबकि सुई के छेद के बिंब में ‘में से निकल जाना’ हिन्दी में अधिक सहजता से आर-पार जाने का अर्थ देता है।
- source_word: πλούσιον
  choice: किसी धनवान
  rationale: पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है; ‘धनवान’ प्रतिनिधिक व्यक्ति को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: मुख्य बाइबलीय पदावली ‘परमेश्वर का राज्य’ सुरक्षित रहती है और ‘में’ प्रवेश की दिशात्मकता व्यक्त करता है।
theological_decisions:
- issue: ऊँट और सुई के छेद के बिंब की व्याख्या
  choice: असंभवता को उभारने वाला शाब्दिक अतिशयोक्तिपूर्ण बिंब ‘ऊँट ... सुई के छेद में से’ बनाए रखा गया।
  alternative: ‘सुई का छेद’ नामक संकरे फाटक की व्याख्या करना, या ‘ऊँट’ के बदले ‘रस्सी’ लेना।
  rationale: प्रदत्त यूनानी पाठ में κάμηλον का अर्थ ‘ऊँट’ है। किसी विशेष फाटक या ‘रस्सी’ की धारणा को मुख्य पाठ में लाने के लिए यहाँ पाठगत आधार नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्यक्रम को हिन्दी की स्वाभाविक तुलना के अनुसार बदला गया है, जबकि यूनानी पाठ का कारणसूचक संबंध, असंभवता का तीखा बिंब और ‘परमेश्वर का राज्य’ पदावली सुरक्षित रखी गई है।
