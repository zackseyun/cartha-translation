base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: hi
  text: पर उसने कहा, “जो मनुष्यों के लिए असम्भव है, वह परमेश्वर के लिए सम्भव है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: जो … असम्भव है
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। हिन्दी में ‘जो … असम्भव है’ स्वाभाविक है और मानव-सामर्थ्य से परे बात का सामान्य दायरा बनाए रखता है।
- source_word: παρὰ ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: सम्प्रदान कारक के साथ παρά यहाँ सम्बन्ध अथवा क्षेत्र बताता है। ‘मनुष्यों के लिए’ सामान्य मानव-सन्दर्भ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: δυνατὰ
  choice: सम्भव
  rationale: यह ἀδύνατα का प्रतिलोम है और उसी संज्ञात्मक रचना में आया है; ‘सम्भव’ सीधा और स्वाभाविक समतुल्य है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: यह समानान्तर παρά-वाक्यांश मानव और परमेश्वर के क्षेत्र अथवा सामर्थ्य का विरोध दिखाता है; ‘परमेश्वर के लिए’ हिन्दी में स्वाभाविक रूप से उस समानता को बनाए रखता है।
- source_word: ὁ δὲ εἶπεν
  choice: पर उसने कहा
  rationale: δέ यहाँ हल्का विरोध अथवा संक्रमण व्यक्त करता है। पिछले कथन के उत्तर में ‘पर’ प्रसंगानुकूल है।
theological_decisions:
- issue: ईश्वरीय सम्भावना का दायरा
  choice: कथन मानव के लिए असम्भव और परमेश्वर के लिए सम्भव होने का विरोध प्रस्तुत करता है, विशेषतः निकटवर्ती उद्धार-सन्दर्भ में, पर इसका दायरा अनुवाद में कृत्रिम रूप से सीमित नहीं किया गया।
  alternative: इसे प्रत्येक कल्पनीय कार्य के विषय में एक निरपेक्ष दार्शनिक प्रतिज्ञप्ति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ व्यापक कथन करता है, जबकि प्रसंग धनवान के परमेश्वर के राज्य में प्रवेश और उद्धार का है। अनुवाद न तो कथन को संकुचित करता है, न पाठ से परे दार्शनिक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। समानान्तर ‘मनुष्यों के लिए / परमेश्वर के लिए’ रचना यूनानी विरोध को स्पष्ट रखती है।
