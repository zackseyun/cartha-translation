id: LUK.18.32
reference: Luke 18:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: hi
  text: क्योंकि उसे गैर-यहूदियों[a] के हाथ सौंप दिया जाएगा, और उसका उपहास किया जाएगा, उसका अपमान[b] किया जाएगा और उस पर थूका जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जातियों के हाथ।’ यहाँ आशय विशेष रूप से गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके साथ लज्जाजनक दुर्व्यवहार किया जाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: उसे … के हाथ सौंप दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखता है और किसी एजेंट या मंशा को अनावश्यक रूप से निर्धारित नहीं करता। ‘के हाथ’ हिंदी में किसी के अधिकार में सौंपे जाने का स्वाभाविक भाव देता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या या उसका आधार प्रस्तुत करने वाले संबंध को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: इस प्रसंग में ἔθνη सामान्यतः राष्ट्रों के बजाय यहूदी समुदाय से बाहर के लोगों, विशेषकर गैर-यहूदी अधिकारियों, को सूचित करता है। यह पद सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐμπαιχθήσεται
  choice: उसका उपहास किया जाएगा
  rationale: ἐμπαίζω के तिरस्कारपूर्ण मज़ाक और खिल्ली उड़ाने के अर्थ को गरिमापूर्ण, प्रचलित हिंदी में व्यक्त करता है।
- source_word: ὑβρισθήσεται
  choice: उसका अपमान किया जाएगा
  rationale: ὑβρίζω में अपमानित करने और लज्जाजनक ढंग से व्यवहार करने का व्यापक भाव है। ‘अपमान’ प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी अर्थ की व्यापकता सुरक्षित रखती है।
- source_word: ἐμπτυσθήσεται
  choice: उस पर थूका जाएगा
  rationale: मूल के ठोस अपमानजनक कृत्य और कर्मवाच्य दोनों को सीधी, वर्तमान हिंदी में बनाए रखता है।
theological_decisions:
- issue: कर्मवाच्य क्रियाओं का निहित कर्ता
  choice: हिंदी में ‘उसे/उसका/उस पर’ रखा गया है, जिसका संकेत पिछले पद के ‘मनुष्य के पुत्र’ की ओर है।
  alternative: हर खंड में ‘मनुष्य का पुत्र’ दोहराना।
  rationale: यूनानी में इस पद में कर्ता स्पष्ट रूप से नहीं दोहराया गया, पर पिछले संदर्भ से उसका निर्देश स्पष्ट है। सर्वनाम स्वाभाविक हिंदी देता है और कोई अतिरिक्त धर्मवैचारिक दावा नहीं जोड़ता।
- issue: τοῖς ἔθνεσιν का सामुदायिक अर्थ
  choice: ‘गैर-यहूदियों’
  alternative: ‘जातियों’ या ‘राष्ट्रों’
  rationale: ऐतिहासिक और कथात्मक संदर्भ में विरोध यहूदियों और गैर-यहूदियों के बीच है; फिर भी शब्द का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। क्रमिक कर्मवाच्य रचना मूल के चार भावों—सौंपे जाने, उपहास, अपमान और थूके जाने—को अलग-अलग बनाए रखती है।
