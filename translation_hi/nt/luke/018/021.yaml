  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: hi
  text: उसने कहा, “इन सब बातों का पालन तो मैं अपनी युवावस्था से करता आया हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: उसने कहा
  rationale: δέ हल्का कथात्मक संयोजक है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य-प्रवाह स्वाभाविक रहता है और अनावश्यक विरोध का भाव नहीं आता।
- source_word: Ταῦτα πάντα
  choice: इन सब बातों का
  rationale: यूनानी में शाब्दिक रूप से ‘ये सब बातें’ है। पूर्ववर्ती संदर्भ में आज्ञाएँ अभिप्रेत हैं, पर यहाँ ‘आज्ञाएँ’ शब्द स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐφύλαξα
  choice: पालन तो मैं ... करता आया हूँ
  rationale: φυλάσσω यहाँ आज्ञाओं के पालन के अर्थ में है। ‘करता आया हूँ’ युवावस्था से वर्तमान तक जारी दावे को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तो’ पूर्ववर्ती सूची के प्रति उत्तर का हल्का बल दर्शाता है।
- source_word: ἐκ νεότητος μου
  choice: अपनी युवावस्था से
  rationale: ἐκ समय के आरंभ-बिंदु को दर्शाता है; ‘अपनी युवावस्था से’ इसका स्पष्ट और आधुनिक हिन्दी रूप है।
