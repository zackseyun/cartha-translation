source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: hi
  text: तो क्या परमेश्वर अपने चुने हुओं को न्याय नहीं दिलाएगा, जो दिन-रात उसे पुकारते हैं? क्या वह उनके लिए बहुत देर करेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि वह उनके प्रति धीरज रखता है,” अथवा “क्या वह उनके प्रति धीरज रखता है?” यूनानी वाक्यांश का अर्थ देर करने के बजाय धीरज या सहनशीलता रखना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: न्याय दिलाएगा
  rationale: दृष्टांत के न्यायिक संदर्भ में यह निजी बदला लेने के बजाय न्याय, कानूनी राहत या पक्ष में उचित निर्णय दिलाने का भाव व्यक्त करता है।
- source_word: ἐκλεκτῶν
  choice: चुने हुओं
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। यह परमेश्वर द्वारा चुने गए लोगों का भाव बनाए रखता है, बिना किसी संकीर्ण सम्प्रदायगत अर्थ को जोड़े।
- source_word: βοώντων
  choice: पुकारते हैं
  rationale: यह तीव्र और बार-बार की जाने वाली विनती को दर्शाता है; हिन्दी में ‘पुकारते हैं’ प्रार्थनापूर्ण आग्रह के लिए स्वाभाविक है।
- source_word: ἡμέρας καὶ νυκτός
  choice: दिन-रात
  rationale: यह मूल के निरंतर समय-संबंधी बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: क्या वह उनके विषय में देर तक ठहरेगा?
  rationale: यूनानी वाक्यांश धैर्य रखने अथवा कार्रवाई में देर करने—दोनों अर्थों की सम्भावना रखता है। मुख्य पाठ में अगले पद की शीघ्र न्याय की बात के अनुरूप विलंब का भाव रखा गया है, पर अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: οὐ μὴ ποιήσῃ
  choice: क्या ... नहीं दिलाएगा
  rationale: οὐ μή के साथ प्रश्न निश्चित सकारात्मक उत्तर की अपेक्षा करता है। हिन्दी का नकारात्मक आलंकारिक प्रश्न इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: आधुनिक मानक हिन्दी बाइबलीय शैली में θεός का स्वाभाविक और गरिमापूर्ण रूप।
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖς का परमेश्वर के चरित्र और कार्रवाई से संबंध
  choice: 'मुख्य पाठ में इसे कार्रवाई करने में देर के प्रश्न के रूप में रखा गया है: ‘क्या वह उनके विषय में देर तक ठहरेगा?’'
  alternative: ‘यद्यपि वह उनके प्रति धीरज रखता है’ अथवा ‘क्या वह उनके प्रति धीरज रखता है?’
  rationale: मूल यूनानी धीरज/सहनशीलता का अर्थ भी दे सकता है, जबकि निकट संदर्भ, विशेषकर पद 8, शीघ्र न्याय पर बल देता है। इसलिए मुख्य पाठ कथानक के प्रवाह को रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘न्याय दिलाना’ न्यायिक संदर्भ को स्पष्ट करता है; ‘दिन-रात’ और ‘पुकारते हैं’ सामान्य पाठक के लिए स्वाभाविक हैं। मुख्य पाठ में वास्तविक यूनानी अस्पष्टता को पूरी तरह समाप्त न करते हुए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
