  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: hi
  text: “तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?” उसने कहा, “प्रभु[a], मैं फिर से देख सकूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय”; यूनानी κύριε आदरसूचक संबोधन भी हो सकता है, यद्यपि इस परियोजना में κύριος का सामान्य अनुवाद “प्रभु” है।
    reason: alternative_reading
  - marker: b
    text: या “मैं अपनी दृष्टि फिर पा सकूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: क्या
  rationale: यह प्रश्नवाचक सर्वनाम व्यक्ति की विशेष माँग पूछता है; यहाँ कारणसूचक ‘क्यों’ नहीं, बल्कि ‘क्या’ स्वाभाविक अर्थ है।
- source_word: σοι
  choice: तुम्हारे लिए
  rationale: ποιήσω के साथ दत्तिवाचक सर्वनाम हितार्थक है; आधुनिक हिन्दी में ‘तुम्हारे लिए करूँ’ स्वाभाविक है।
- source_word: θέλεις
  choice: तुम क्या चाहते हो
  rationale: θέλω इच्छा या चाह व्यक्त करता है; ‘चाहते हो’ सीधा, आधुनिक और संवाद के अनुकूल है।
- source_word: ποιήσω
  choice: कि मैं ... करूँ
  rationale: θέλεις के बाद अओरिस्ट सब्जंक्टिव को हिन्दी में ‘चाहते हो कि मैं ... करूँ’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ὁ δὲ εἶπεν
  choice: उसने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है, प्रबल विरोधसूचक नहीं; हिन्दी में अलग उत्तर-वाक्य में संयोजक छोड़ना सहज है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος के लिए परियोजना का सामान्य अनुवाद ‘प्रभु’ रखा गया है। यह आदरसूचक संबोधन और सम्भावित गहरे मसीही आशय—दोनों के लिए खुला रहता है।
- source_word: ἵνα
  choice: मैं ... लगूँ
  rationale: ἵνα यहाँ माँग की विषयवस्तु बताता है; हिन्दी में सीधे ‘मैं फिर से देखने लगूँ’ कहना स्वाभाविक है।
- source_word: ἀναβλέψω
  choice: मैं फिर से देखने लगूँ
  rationale: चंगाई के प्रसंग में ἀναβλέπω का अर्थ दृष्टि फिर पाना है। ‘फिर से देखने लगूँ’ इस अर्थ को सरल और प्रत्यक्ष रूप में व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए सीधे संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: ‘प्रभु’ आदर के साथ सम्भावित मसीही अर्थगर्भिता को भी बनाए रखता है। पादटिप्पणी यह स्पष्ट करती है कि यूनानी शब्द केवल सम्मानसूचक संबोधन भी हो सकता है, अतः अस्पष्टता को दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। ‘तुम’ प्रसंग के प्रत्यक्ष संबोधन के लिए स्वाभाविक है। प्रश्न में यूनानी संरचना का अर्थ बचाते हुए हिन्दी का सहज क्रम अपनाया गया है; उत्तर में विनम्र माँग व्यक्त करने के लिए ‘देखने लगूँ’ रखा गया है।
