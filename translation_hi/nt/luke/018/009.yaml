revisions:
- from: और उसने उन कुछ लोगों से भी, जिन्हें अपने ऊपर भरोसा था कि वे धर्मी हैं और जो बाकी सबको तुच्छ समझते थे, यह दृष्टान्त कहा:[a]
  to: और उसने यह दृष्टान्त उन कुछ लोगों को भी सुनाया, जिन्हें अपने आप पर भरोसा था कि वे धर्मी हैं और जो बाकी लोगों को तुच्छ समझते थे:[a]
  rationale: 'Revision improves modern Hindi idiom and narrative flow while retaining every principal element of the Greek: Jesus additionally addresses a particular group, their confidence is in themselves, their asserted status is ‘righteous,’ and they hold the remaining people in contempt. It does not make δίκαιοι pejorative or add doctrinal interpretation.'
