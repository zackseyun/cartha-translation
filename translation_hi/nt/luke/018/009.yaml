id: LUK.18.9
reference: Luke 18:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: hi
  text: और उसने यह दृष्टान्त उन कुछ लोगों को भी सुनाया, जिन्हें अपने आप पर भरोसा था कि वे धर्मी हैं और जो बाकी लोगों को तुच्छ समझते थे:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरों को तुच्छ समझते थे” अथवा “बाकी लोगों को नीची दृष्टि से देखते थे।”
    reason: ἐξουθενοῦντας के ‘तुच्छ समझना/तिरस्कार करना’ और τοὺς λοιπούς के ‘दूसरे/बाकी लोग’ संबंधी निकट वैकल्पिक अर्थों को दर्ज करना।
lexical_decisions:
- source_word: Εἶπεν
  choice: उसने ... कहा
  rationale: λέγω का सामान्य अर्थ ‘कहना’ है; ‘दृष्टान्त कहा’ हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति है और कथात्मक बल बनाए रखती है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; ‘और’ बिना अनावश्यक विरोध जोड़े प्रसंग को आगे बढ़ाता है।
- source_word: καὶ
  choice: भी
  rationale: क्रियाविशेषणात्मक καί एक और शिक्षा दिए जाने का योगात्मक भाव व्यक्त करता है।
- source_word: πρός τινας
  choice: उन कुछ लोगों से
  rationale: वचन-क्रिया के साथ πρός संबोधित श्रोताओं को दर्शाता है; हिन्दी में ‘लोगों से ... कहा’ स्वाभाविक है।
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: जिन्हें अपने ऊपर भरोसा था
  rationale: पूर्णकालिक कृदन्त स्थायी आत्मविश्वास की दशा दिखाता है; यह चयन आत्मनिर्भरता के भाव को स्पष्ट रखता है।
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: कि वे धर्मी हैं
  rationale: प्रत्यक्ष आशय के भीतर वर्तमानकाल ‘हैं’ मूल εἰσὶν को बनाए रखता है; ‘धर्मी’ δίκαιοι के नैतिक-धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: ἐξουθενοῦντας
  choice: तुच्छ समझते थे
  rationale: ἐξουθενέω किसी को नगण्य मानने, हेय समझने या उसका तिरस्कार करने का भाव देता है; ‘तुच्छ समझना’ दृष्टिकोण और अवमानना दोनों व्यक्त करता है।
- source_word: τοὺς λοιπούς
  choice: बाकी सबको
  rationale: οἱ λοιποί का अर्थ ‘शेष लोग’ है; इस संदर्भ में ‘बाकी सब’ स्वाभाविक हिन्दी में उस व्यापक विरोध को व्यक्त करता है।
- source_word: τὴν παραβολὴν ταύτην
  choice: यह दृष्टान्त
  rationale: ‘दृष्टान्त’ सुसमाचारों में παραβολή के लिए परिचित और सटीक हिन्दी शब्द है।
theological_decisions:
- issue: आत्म-धार्मिकता के संदर्भ में δίκαιοι का अनुवाद
  choice: धर्मी
  alternative: सही / न्यायी
  rationale: मूल शब्द स्वयं निंदात्मक नहीं है। ‘धर्मी’ प्रमुख धार्मिक शब्दावली को बनाए रखता है और विडंबना तथा आलोचना को संदर्भ से उभरने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। वाक्य-रचना ने मूल यूनानी के श्रोता-वर्णन और दो समानांतर कृदन्तों का संबंध स्पष्ट रखा है।
