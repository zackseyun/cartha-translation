  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: hi
  text: यीशु ने उसे देखकर कहा, “जिनके पास धन-संपत्ति[a] है, उनके लिए परमेश्वर के राज्य में प्रवेश करना कितना कठिन है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन”; यूनानी शब्द पैसे या संपत्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: उसे देखकर
  rationale: ὁράω के अओरिस्ट कृदंत को स्वाभाविक हिन्दी पूर्वकालिक कृदंत से व्यक्त किया गया है; इससे देखने और कहने का संबंध बना रहता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में प्रसंग की निरंतरता और कृदंत-रचना इसे पर्याप्त रूप से व्यक्त करती है; ‘और’ जोड़ना अनावश्यक रूप से भारी लगता।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम पिछले प्रसंग के धनी अधिकारी की ओर संकेत करता है।
- source_word: Πῶς δυσκόλως
  choice: कितनी कठिनाई से
  rationale: यह रचना विस्मयपूर्ण मात्रा व्यक्त करती है। ‘कितनी कठिनाई से’ यूनानी क्रियाविशेषण के रूप और कथन की तीव्रता, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: जिनके पास धन-संपत्ति है
  rationale: यह चयन कृदंत-वाक्यांश ‘जो धन/संपत्ति रखते हैं’ को वर्ग-सूचक ‘धनी’ में सीमित किए बिना स्वाभाविक हिन्दी में प्रस्तुत करता है। χρήματα पैसे के साथ व्यापक संपत्ति को भी सूचित कर सकता है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: यह परिचित और पारदर्शी बाइबलीय अभिव्यक्ति है तथा εἰς के प्रवेश-दिशा संबंधी अर्थ को हिन्दी की ‘में प्रवेश करना’ रचना व्यक्त करती है।
- source_word: εἰσπορεύονται
  choice: प्रवेश करते हैं
  rationale: वर्तमानकालीन क्रिया को सामान्य कथन के रूप में रखा गया है; इससे यूनानी वाक्य की सीमित क्रिया और सार्वत्रिक बल सुरक्षित रहते हैं।
theological_decisions:
- issue: धन रखने वालों के लिए परमेश्वर के राज्य में प्रवेश की कठिनाई
  choice: कथन को वास्तविक और तीव्र कठिनाई के सामान्य कथन के रूप में रखा गया है
  alternative: इसे पूर्ण असंभवता के कथन के रूप में प्रस्तुत करना
  rationale: इस पद में δυσκόλως ‘कठिनाई से’ कहता है, ‘असंभव’ नहीं। इसलिए अनुवाद कठिनाई को न तो हल्का करता है, न अगले पदों के आधार पर पहले ही असंभवता में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास अपनाया गया है। ‘कितनी कठिनाई से’ विस्मयात्मक बल को बनाए रखता है, जबकि ‘धन-संपत्ति’ सामान्य पाठक के लिए χρήματα की व्यापकता स्पष्ट करता है।
