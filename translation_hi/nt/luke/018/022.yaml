source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: hi
  text: 'यह सुनकर यीशु ने उससे कहा, “तुझे अभी एक बात की कमी है: अपना सब कुछ बेचकर गरीबों में बाँट दे, और तुझे स्वर्ग में धन मिलेगा; आ, मेरे पीछे चल।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: यह सुनकर यीशु ने
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी में ‘यह सुनकर’ कहा गया है; δέ यहाँ कथानक को आगे बढ़ाता है और अलग विरोधसूचक शब्द आवश्यक नहीं है।
- source_word: Ἔτι ἕν σοι λείπει
  choice: तुझमें अभी एक बात की कमी है
  rationale: यह हिन्दी में स्वाभाविक रहते हुए एक शेष कमी पर बल देता है। यूनानी की अधिक शाब्दिक रचना, जिसमें ‘एक बात’ कर्ता है, पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: अपना सब कुछ बेचकर
  rationale: πάντα ὅσα की समग्रता ‘अपना सब कुछ’ से स्पष्ट होती है। अगले समन्वित आदेश के साथ हिन्दी में ‘बेचकर ... बाँट दे’ स्वाभाविक और निर्णायक आदेश बना रहता है।
- source_word: διάδος πτωχοῖς
  choice: गरीबों में बाँट दे
  rationale: διαδίδωμι के वितरण के भाव को ‘बाँट दे’ व्यक्त करता है; ‘गरीबों में’ अनेक जरूरतमंदों के बीच वितरण का संकेत देता है।
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: तुझे स्वर्ग में धन मिलेगा
  rationale: ἕξεις का अधिकार/प्राप्ति भाव सहज हिन्दी में ‘मिलेगा’ से व्यक्त है। θησαυρός के लिए ‘धन’ सामान्य पाठक के लिए स्पष्ट है; οὐρανοῖς का यूनानी बहुवचन हिन्दी मुहावरे में सामान्यतः एकवचन ‘स्वर्ग’ होता है।
- source_word: δεῦρο ἀκολούθει μοι
  choice: फिर आकर मेरे पीछे चल
  rationale: δεῦρο के आने के आह्वान और ἀκολούθει के निरंतर शिष्यत्व-संबंधी अनुसरण को सहज हिन्दी में रखा गया है; ‘मेरे पीछे चल’ केवल शारीरिक गति तक सीमित नहीं है।
theological_decisions:
- issue: त्याग और शिष्यत्व की माँग
  choice: यीशु के इस व्यक्ति को दिए गए ठोस आदेश—सब कुछ बेचना, गरीबों में बाँटना और उनके पीछे चलना—की पूरी तीव्रता बनाए रखी गई है।
  alternative: इसे हर विश्वासी के लिए सीधे सार्वभौमिक संपत्ति-त्याग का नियम मानना, या इसे केवल प्रतीकात्मक और आर्थिक अर्थ से रहित समझना।
  rationale: पद का संबोधन एक विशिष्ट व्यक्ति से है, पर आदेश वास्तविक और ठोस है। अनुवाद न तो उसके दायरे को सिद्धान्ततः बढ़ाता है, न उसकी आर्थिक माँग को कम करता है।
- issue: स्वर्गीय धन का स्वरूप
  choice: ‘स्वर्ग में धन’ को बिना अतिरिक्त व्याख्या के रखा गया है।
  alternative: इसे किसी खास प्रकार के पुण्य, प्रतिफल या उद्धार के तकनीकी सिद्धान्त के रूप में स्पष्ट करना।
  rationale: मूल पाठ θησαυρός कहता है, पर यहाँ उसके सटीक धर्मवैज्ञानिक स्वरूप को परिभाषित नहीं करता; इसलिए तनाव और खुलापन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। प्रसंग के प्रत्यक्ष एकवचन संबोधन के अनुरूप ‘तू/तुझ/तेरे’ रूप रखे गए हैं; यह अवमानना नहीं, बाइबिलीय प्रत्यक्ष संबोधन है। ‘गरीबों में बाँट दे’ वितरण के अर्थ को और ‘मेरे पीछे चल’ शिष्यत्व के आह्वान को स्वाभाविक ढंग से व्यक्त करता है।
