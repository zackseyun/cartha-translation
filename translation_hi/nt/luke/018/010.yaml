  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: hi
  text: दो मनुष्य प्रार्थना करने के लिए मंदिर[a] में चढ़कर गए। उनमें एक फरीसी था और दूसरा कर वसूलने वाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν पूरे मंदिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: दो मनुष्य
  rationale: ἄνθρωποι यहाँ दो पुरुष व्यक्तियों को सूचित करता है; आगे दोनों के लिए पुल्लिंग पहचान दी गई है। ‘दो मनुष्य’ मूल के निकट रहते हुए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀνέβησαν
  choice: ऊपर गए
  rationale: ἀναβαίνω के चढ़कर जाने के भाव को सुरक्षित रखता है; मंदिर की ओर जाना भौगोलिक और पारंपरिक दोनों अर्थों में ‘ऊपर जाना’ कहा जा सकता था।
- source_word: εἰς τὸ ἱερὸν
  choice: मंदिर में
  rationale: εἰς प्रवेश अथवा गंतव्य का भाव देता है। ἱερόν पूरे मंदिर-परिसर को सूचित करता है; मुख्य पाठ में परिचित ‘मंदिर’ रखा गया और सटीक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने के लिए
  rationale: यह प्रयोजन बताने वाला अनंत क्रियारूप है; हिन्दी में यह सीधा और स्वाभाविक उद्देश्य-वाचक अनुवाद है।
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: एक ... और दूसरा
  rationale: दो व्यक्तियों के बीच मूल के वितरणात्मक विरोध को सहज हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: Φαρισαῖος
  choice: फरीसी
  rationale: इस यहूदी धार्मिक समूह के लिए प्रचलित हिन्दी रूप।
- source_word: τελώνης
  choice: कर-वसूलनेवाला
  rationale: τελώνης कर या चुंगी वसूलने वाले व्यक्ति को दर्शाता है। यह रूप आधुनिक पाठक के लिए स्पष्ट है और पुराने अथवा भ्रामक पद से बचता है।
theological_decisions:
- issue: ἱερόν और ναός के अर्थों में भेद
  choice: मुख्य पाठ में ‘मंदिर’, पादटिप्पणी में ‘पूरा मंदिर-परिसर’
  alternative: मंदिर-परिसर
  rationale: ἱερόν केवल भीतरी पवित्रस्थान नहीं, व्यापक मंदिर-परिसर को दर्शाता है। पठनीयता के लिए मुख्य पाठ में सामान्य पद रखा गया, पर अर्थ-भेद को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἄνθρωποι का लिंग-सापेक्ष अनुवाद
  choice: दो मनुष्य
  alternative: दो लोग
  rationale: यद्यपि ἄνθρωποι व्यापक अर्थ में ‘लोग’ हो सकता है, निकट संदर्भ दोनों व्यक्तियों को पुल्लिंग रूपों और पहचानों से प्रस्तुत करता है। ‘मनुष्य’ मूल की मानवीय संज्ञा और संदर्भगत पुल्लिंग—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण शैली। वाक्य को दो भागों में बाँटकर सहज पठनीयता रखी गई है; ‘ऊपर गए’ मूल क्रिया का स्थानगत भाव सुरक्षित करता है।
