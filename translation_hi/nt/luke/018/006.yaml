  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: hi
  text: और प्रभु ने कहा, “सुनो कि वह अन्यायी न्यायाधीश[a] क्या कहता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्मी न्यायाधीश।” यूनानी में शाब्दिक रूप से, “अन्याय/अधर्म का न्यायाधीश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: कथा-वर्णन में λέγω के एओरिस्ट रूप के लिए सरल भूतकाल ‘कहा’ स्वाभाविक और सटीक है।
- source_word: δὲ
  choice: तब
  rationale: यह कथा को आगे बढ़ाने वाला संयोजक है। ‘तब’ आधुनिक हिन्दी में प्रसंग का सहज क्रम बनाए रखता है, बिना किसी प्रबल विरोध का भाव जोड़े।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: लूका के वर्णन में यह यीशु के लिए प्रयुक्त उपाधि है; ‘प्रभु’ इसके सम्मानसूचक और मसीह-संबंधी भार को बनाए रखता है।
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: एओरिस्ट आज्ञार्थक रूप ध्यान देकर सुनने का सीधा आदेश देता है; ‘सुनो’ संक्षिप्त और स्वाभाविक है।
- source_word: τί
  choice: क्या
  rationale: यह न्यायाधीश के कथन की विषय-वस्तु प्रस्तुत करता है, इसलिए ‘क्या’ उपयुक्त है।
- source_word: ὁ κριτὴς
  choice: न्यायाधीश
  rationale: यह उस न्यायाधीश की ओर संकेत करता है जिसका उल्लेख दृष्टान्त में पहले हो चुका है; ‘न्यायाधीश’ इसका सामान्य आधुनिक हिन्दी रूप है।
- source_word: τῆς ἀδικίας
  choice: अधर्मी
  rationale: यूनानी संबंधकारक पद शाब्दिक रूप से ‘अधर्म/अन्याय का’ है और न्यायाधीश के नैतिक चरित्र को बताता है। ‘अधर्मी’ व्यापक नैतिक आशय को रखता है; ‘अन्यायी’ सम्भव विकल्प है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी वर्तमान काल कथन को सजीव और तात्कालिक बनाता है; हिन्दी का सामान्य वर्तमान ‘कहता है’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में यह केवल सामाजिक संबोधन नहीं, बल्कि लूका के वर्णन में यीशु की उपाधि है। ‘प्रभु’ उस भार को सुरक्षित रखता है, जबकि ‘स्वामी’ अर्थ को अधिक सीमित कर सकता है।
- issue: τῆς ἀδικίας में नैतिक बनाम न्यायिक बल
  choice: अधर्मी न्यायाधीश
  alternative: अन्यायी न्यायाधीश
  rationale: मूल पद में नैतिक बुराई और न्याय-विरोध, दोनों की सम्भावना है। मुख्य पाठ में ‘अधर्मी’ व्यापक नैतिक आयाम रखता है और पादटिप्पणी ‘अन्यायी’ विकल्प तथा यूनानी की शाब्दिक बनावट बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सुनो’ की सीधी आज्ञा और ‘कहता है’ का वर्तमान काल मूल यूनानी की सजीवता बनाए रखते हैं। पादटिप्पणी का चिह्न उसी पद के बाद रखा गया है जिससे वह संबंधित है।
