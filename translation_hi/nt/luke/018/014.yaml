  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, यह व्यक्ति उस दूसरे की अपेक्षा धर्मी ठहरकर अपने घर उतरा[a]; क्योंकि हर वह व्यक्ति जो अपने आप को ऊँचा करता है, नीचा किया जाएगा, पर जो अपने आप को नीचा करता है, वह ऊँचा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दूसरे के बजाय”; यूनानी पदबंध तुलना या अधिक स्पष्ट विरोध, दोनों भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: धर्मी ठहराया हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदंत परमेश्वर के अनुकूल निर्णय और उसके बने रहने वाले परिणाम को व्यक्त करता है। यह पद न्यायिक भाव को बनाए रखता है, पर पद में निहित अर्थ से आगे कोई विस्तृत धर्मसैद्धांतिक प्रणाली नहीं जोड़ता।
- source_word: παρ’ ἐκεῖνον
  choice: उस दूसरे की अपेक्षा
  rationale: παρά के साथ कर्मकारक यहाँ तुलना अथवा विरोध दर्शाता है। यह रूप कर-वसूलने वाले और फरीसी के बीच के अंतर को व्यक्त करते हुए यूनानी पदबंध की तुलनात्मक गुंजाइश बनाए रखता है।
- source_word: κατέβη
  choice: उतरा
  rationale: καταβαίνω की वास्तविक नीचे की ओर गति को सुरक्षित रखा गया है; मंदिर-क्षेत्र से घर की ओर उतरने का संदर्भ इसे स्वाभाविक बनाता है। केवल ‘लौटा’ कहने से यह ठोस चित्र खो जाता।
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: अपने घर
  rationale: οἶκος के सामान्य अर्थ ‘घर’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: हर वह व्यक्ति जो अपने आपको ऊँचा करता है
  rationale: संज्ञास्वरूप कृदंत से व्यक्त सार्वभौमिक सिद्धांत और आत्मवाचक बल दोनों सुरक्षित रहते हैं। ‘व्यक्ति’ आधुनिक हिन्दी में प्रतिनिधिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ταπεινωθήσεται
  choice: नीचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखा गया है और कर्ता को यूनानी पाठ की तरह अप्रकट छोड़ा गया है।
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: पर जो अपने आपको नीचा करता है
  rationale: δέ का विरोध और पहले खंड के साथ समानांतर रचना दोनों स्पष्ट रहते हैं।
- source_word: ὑψωθήσεται
  choice: ऊँचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य सुरक्षित है और यह ‘नीचा किया जाएगा’ के साथ स्पष्ट उलटाव बनाता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पहले कथन का कारण बताता है और आधुनिक हिन्दी में कारण-संबंध को स्पष्ट रखता है।
- source_word: οὗτος
  choice: यह व्यक्ति
  rationale: यह पिछले संदर्भ के कर-वसूलने वाले की ओर संकेत करता है और दूसरे उपासक से उसका व्यक्तिगत विरोध स्पष्ट करता है।
theological_decisions:
- issue: दृष्टांत के निष्कर्ष में δικαιόω का अर्थ
  choice: परमेश्वर के अनुकूल न्यायिक निर्णय को ‘धर्मी ठहराया हुआ’ से व्यक्त करना
  alternative: व्यापक सामाजिक अर्थ में निर्दोष या सही सिद्ध किया गया
  rationale: तात्कालिक संदर्भ परमेश्वर के सामने आत्मधर्मी फरीसी और पश्चात्तापी कर-वसूलने वाले का विरोध करता है। ‘धर्मी ठहराया’ दैवी अनुकूल निर्णय का भार रखता है, किंतु इस एक पद से आगे कोई पूर्ण धर्मसैद्धांतिक व्याख्या आरोपित नहीं करता।
- issue: παρ’ ἐκεῖνον में तुलना और बहिष्कारी विरोध के बीच सूक्ष्मता
  choice: मुख्य पाठ में ‘उस दूसरे की अपेक्षा’
  alternative: ‘उस दूसरे के बजाय’
  rationale: यूनानी पदबंध तुलनात्मक विरोध व्यक्त कर सकता है। मुख्य पाठ तुलना की वास्तविक गुंजाइश बचाता है; पाद-टिप्पणी अधिक बहिष्कारी हिन्दी विकल्प देती है, जिससे यह अनिश्चितता चुपचाप समाप्त नहीं होती।
- issue: दो कर्मवाच्य क्रियाओं में अप्रकट कर्ता
  choice: ‘नीचा किया जाएगा’ और ‘ऊँचा किया जाएगा’ में कर्ता अप्रकट रखना
  alternative: परमेश्वर को स्पष्ट कर्ता बनाना
  rationale: संदर्भ दैवी क्रिया का संकेत दे सकता है, पर यूनानी पाठ कर्ता का नाम नहीं लेता। कर्मवाच्य रचना उस धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘उतरा’ मंदिर से नीचे जाने की मूल छवि बचाता है; ‘धर्मी ठहराया’ न्यायिक तथा परिणामसूचक भाव रखता है। समानांतर वाक्य-विन्यास से अंतिम सूक्ति का अलंकारिक संतुलन सुरक्षित है।
