lexical_decisions:
- source_word: ἐβόησεν
  choice: पुकारकर कहा
  rationale: βοάω ऊँची और आग्रहपूर्ण पुकार को व्यक्त करता है। ‘पुकारकर’ उसकी तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λέγων
  choice: कहा
  rationale: ग्रीक कृदन्त λέγων प्रत्यक्ष कथन का परिचय देता है; हिन्दी कथाशैली में इसे पिछले क्रियापद के साथ ‘पुकारकर कहा’ कहना स्वाभाविक है।
- source_word: Ἰησοῦ
  choice: हे यीशु
  rationale: यह नाम का संबोधन रूप है; ‘हे’ प्रत्यक्ष और आग्रहपूर्ण संबोधन को स्पष्ट करता है।
- source_word: υἱὲ Δαυίδ
  choice: दाऊद के पुत्र
  rationale: यहाँ यह दाऊद से आने वाले प्रतिज्ञात राजा से जुड़ी मसीही उपाधि है। शाब्दिक पदबंध उस बाइबलीय और धर्मवैज्ञानिक अर्थ को सुरक्षित रखता है।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: आज्ञार्थक रूप दयापूर्ण हस्तक्षेप की सीधी विनती है। आदरसूचक ‘कीजिए’ आधुनिक हिन्दी में यीशु को किए गए गंभीर संबोधन के अनुकूल है।
theological_decisions:
- issue: υἱὲ Δαυίδ का मसीही आशय
  choice: ‘दाऊद के पुत्र’ उपाधि के रूप में
  alternative: ‘दाऊद के वंशज’
  rationale: लूका के कथानक में यह केवल वंशावली का विवरण नहीं, बल्कि राजकीय-मसीही संबोधन भी है। ‘दाऊद के पुत्र’ मूल की शब्दावली और उसके निहित धर्मवैज्ञानिक तनाव—वंशज तथा प्रतिज्ञात राजा—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘पुकारकर कहा’ ग्रीक की मुख्य क्रिया और कृदन्त को स्वाभाविक रूप से जोड़ता है; संबोधन में ‘हे’ तथा विनती में आदरसूचक रूप रखा गया है।
