  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: hi
  text: जो इस समय में उससे कई गुना अधिक अवश्य पाएगा, और आनेवाले युग में अनन्त जीवन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: अवश्य
  rationale: οὐχὶ μὴ के प्रबल निषेध के साथ संभावनार्थक क्रिया निश्चित आश्वासन व्यक्त करती है; हिन्दी में सकारात्मक ‘अवश्य’ उसी बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: ἀπολάβῃ
  choice: पाएगा
  rationale: यहाँ क्रिया पाने या प्रतिफल के रूप में प्राप्त करने का भाव रखती है। ‘पाएगा’ सहज हिन्दी है और उपसर्ग के ‘वापस’ वाले भाव को अनावश्यक रूप से नहीं उभारता।
- source_word: πολλαπλασίονα
  choice: उससे कई गुना अधिक
  rationale: यह बहुगुणित प्रतिफल को दर्शाता है। पिछले पद में छोड़ी गई वस्तुओं के संदर्भ के कारण ‘उससे’ निहित तुलना को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: इस समय में
  rationale: καιρός यहाँ वर्तमान अवधि को सूचित करता है और आनेवाले युग के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: आनेवाले युग में
  rationale: यह अभिव्यक्ति वर्तमान काल और भविष्य के युग की नए नियम की दो-युगीय धारणा को सुरक्षित रखती है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: सुसमाचारों में यह स्थापित, स्वाभाविक और संदर्भानुकूल हिन्दी अभिव्यक्ति है।
- source_word: ὃς
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद में बताए गए व्यक्ति की ओर लौटता है; ‘जो’ वाक्यगत निरन्तरता बनाए रखता है।
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ की युगान्त-संबंधी अभिव्यक्ति
  choice: आनेवाले युग में
  alternative: भविष्य में
  rationale: ‘युग’ मूल αἰών की धारणा को बनाए रखता है और इसे केवल सामान्य भविष्यकाल में समतल नहीं करता।
- issue: οὐχὶ μὴ का आश्वासन
  choice: अवश्य पाएगा
  alternative: पाने से किसी प्रकार वंचित न रहेगा
  rationale: सकारात्मक हिन्दी संरचना मूल के निश्चित आश्वासन को स्पष्ट रखती है, जबकि शाब्दिक दोहरा निषेध हिन्दी में बोझिल होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और पिछले पद से जुड़ने वाली सम्बन्धवाचक वाक्य-रचना। ‘आनेवाले’ का संयुक्त रूप सामान्य बाइबलीय हिन्दी के अनुरूप रखा गया है।
