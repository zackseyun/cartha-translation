  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: hi
  text: कुछ समय तक वह अनिच्छुक रहा, पर इसके बाद उसने मन में कहा, ‘भले ही मैं परमेश्वर से नहीं डरता और न किसी मनुष्य का लिहाज़ करता हूँ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: तैयार नहीं था
  rationale: अपूर्ण काल कुछ समय तक बनी रही अनिच्छा को दर्शाता है; यह वाक्यांश इच्छा के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे अंतिम इनकार बना दिए।
- source_word: ἐπὶ χρόνον
  choice: कुछ समय तक
  rationale: यह समय की अनिश्चित अवधि को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: μετὰ ταῦτα δὲ
  choice: पर इसके बाद
  rationale: क्रम और हल्के विरोध—दोनों को बनाए रखता है।
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: उसने मन में कहा
  rationale: भीतरी आत्म-संवाद को आधुनिक, स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: Εἰ καὶ
  choice: भले ही
  rationale: यहाँ वाक्यांश स्वीकारोक्तिपरक रियायत व्यक्त करता है, न कि अनिश्चित शर्त।
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: मैं परमेश्वर से नहीं डरता
  rationale: φοβέομαι के सीधे अर्थ और स्थापित बाइबलीय अभिव्यक्ति को सुरक्षित रखता है; न्यायी की नैतिक कमी भी स्पष्ट रहती है।
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: और न किसी मनुष्य की परवाह करता हूँ
  rationale: ἐντρέπομαι यहाँ किसी के प्रति लिहाज़, संकोच या सम्मानजन्य परवाह रखने के अर्थ में है। ‘किसी मनुष्य’ यूनानी के एकवचन ἄνθρωπον के सामान्य मानवीय संदर्भ को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: एकवचन ἄνθρωπον का सामान्य मानवीय प्रयोग
  choice: किसी मनुष्य
  alternative: किसी की / लोगों की
  rationale: ‘किसी मनुष्य’ परमेश्वर और मनुष्य के बीच मूल समानांतरता तथा एकवचन संज्ञा को बनाए रखते हुए यह स्पष्ट करता है कि आशय किसी भी मानव व्यक्ति से है।
- issue: ἐντρέπομαι का नैतिक-सामाजिक अर्थ
  choice: परवाह करता हूँ
  alternative: सम्मान करता हूँ / लिहाज़ करता हूँ
  rationale: संदर्भ में न्यायी यह स्वीकार करता है कि वह लोगों के दबाव, प्रतिष्ठा या उचित दावे का कोई ध्यान नहीं रखता। ‘परवाह’ इस व्यापक अर्थ को सहज हिन्दी में रखता है, जबकि केवल ‘सम्मान’ अर्थ को कुछ संकरा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
