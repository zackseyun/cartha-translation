  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: hi
  text: तब लोगों ने उसे बताया, “यीशु नासरी[a] यहाँ से गुजर रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नासरत के यीशु यहाँ से गुजर रहे हैं।” यूनानी में अधिक शाब्दिक रूप से “यीशु नासरी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: लोगों ने बताया
  rationale: क्रिया का अर्थ सूचना देना या बताना है। कर्ता यूनानी में निहित बहुवचन है; हिन्दी में स्वाभाविकता और प्रसंग की स्पष्टता के लिए ‘लोगों ने’ रखा गया है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; ‘तब’ कथा को आगे बढ़ाता है और अनावश्यक विरोध का भाव नहीं जोड़ता।
- source_word: αὐτῷ
  choice: उसे
  rationale: सम्प्रदान कारक को हिन्दी में ‘उसे बताया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के उद्धरण-चिह्न
  rationale: ὅτι कथित सूचना का परिचय देता है। हिन्दी में प्रत्यक्ष कथन स्वाभाविक है और आशय को यथावत रखता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: ὁ Ναζωραῖος
  choice: नासरी
  rationale: यूनानी में यह ‘नासरत से’ वाली पूर्वसर्गीय अभिव्यक्ति नहीं, बल्कि यीशु का एक पदनाम है। ‘नासरी’ उस रूप को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: παρέρχεται
  choice: यहाँ से गुजर रहे हैं
  rationale: वर्तमान काल प्रसंग में उसी समय जारी गति बताता है। ‘यहाँ से गुजर रहे हैं’ हिन्दी में निकट से होकर निकलने का भाव स्पष्ट करता है; आदरसूचक बहुवचन यीशु के उल्लेख के लिए सामान्य हिन्दी प्रयोग है।
theological_decisions:
- issue: यीशु के लिए Ναζωραῖος का अनुवाद
  choice: नासरी
  alternative: नासरत के यीशु
  rationale: यह मुख्यतः भौगोलिक/पहचानसूचक पदनाम है। ‘नासरी’ यूनानी के संज्ञात्मक पदनाम को बनाए रखता है और कोई अतिरिक्त मसीही या सम्प्रदायगत अर्थ नहीं जोड़ता; अधिक परिचित वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘तब’ कथा-संबंध बनाए रखता है, और ‘गुजर रहे हैं’ तत्काल जारी घटना को सहज ढंग से व्यक्त करता है।
