source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: hi
  text: फ़रीसी अलग खड़ा होकर ये बातें कहकर प्रार्थना कर रहा था:[a] “हे परमेश्वर, मैं तेरा धन्यवाद करता हूँ कि मैं बाकी लोगों जैसा नहीं हूँ—लुटेरों, अधर्मियों और व्यभिचारियों जैसा—या इस कर-वसूलनेवाले जैसा भी नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़रीसी खड़ा होकर अपने आप से ये बातें कहकर प्रार्थना कर रहा था।” यूनानी वाक्यांश का अर्थ यह भी हो सकता है कि वह अलग खड़ा था, या यह कि वह अपने आप से प्रार्थना कर रहा था।
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: खड़ा होकर
  rationale: अओरिस्ट कृदंत मुद्रा और साथ होने वाली परिस्थिति बताता है; ‘खड़ा होकर’ स्वाभाविक हिन्दी है।
- source_word: πρὸς ἑαυτὸν
  choice: अलग
  rationale: मुख्य पाठ में स्थानगत अर्थ ‘अपने आप में/अलग’ लिया गया है, पर यूनानी वाक्यांश का ‘अपने आप से’ अर्थ भी संभव है; उसे पादटिप्पणी में रखा गया है।
- source_word: ταῦτα προσηύχετο
  choice: ये बातें प्रार्थना में कह रहा था
  rationale: ‘ये बातें’ demonstrative का स्पष्ट अर्थ रखता है और ‘कह रहा था’ अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐχαριστῶ σοι
  choice: मैं तेरा धन्यवाद करता हूँ
  rationale: यह आधुनिक और गरिमापूर्ण हिन्दी में दत्तिव सर्वनाम सहित सीधा अर्थ देता है।
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: बाकी लोगों जैसा
  rationale: यह λοιποί के ‘बाकी’ और ἄνθρωποι के सामान्य मानव-संदर्भ, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἅρπαγες
  choice: लुटेरा
  rationale: शब्द लोभ से दूसरों का माल छीनने या हड़पने वाले को दर्शाता है; ‘लुटेरा’ साधारण पाठक के लिए स्पष्ट है और शारीरिक डकैती तक सीमित नहीं होना चाहिए।
- source_word: ἄδικοι
  choice: अधर्मी
  rationale: यह नैतिक और धार्मिक दोनों आयामों को रखता है, जबकि केवल ‘अन्यायी’ अपेक्षाकृत संकरा हो सकता है।
- source_word: μοιχοί
  choice: व्यभिचारी
  rationale: यह विवाहेतर यौन संबंध रखने वाले के लिए मानक, गरिमापूर्ण बाइबलीय हिन्दी है।
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: और न इस कर-वसूलनेवाले जैसा
  rationale: ἢ καί की तीव्र तुलना को ‘और न’ स्वाभाविक रूप से आगे बढ़ाता है; ‘इस’ निकट उपस्थित व्यक्ति के प्रति तिरस्कार को बनाए रखता है।
theological_decisions:
- issue: πρὸς ἑαυτόν का अर्थ
  choice: 'मुख्य पाठ में स्थानगत अर्थ: ‘अलग खड़ा होकर’'
  alternative: ‘खड़ा होकर अपने आप से ये बातें प्रार्थना में कह रहा था’
  rationale: यूनानी वाक्यांश यह बता सकता है कि फ़रीसी दूसरों से अलग खड़ा था, या यह कि उसकी प्रार्थना विडंबनापूर्वक अपने ही प्रति/अपने आप से थी। मुख्य पाठ में स्थानगत अर्थ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में, ताकि निहित धार्मिक आलोचना को अनावश्यक रूप से निर्णीत न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। ‘कर-वसूलनेवाला’ सामान्य पाठक के लिए ‘चुंगी लेनेवाला’ से अधिक तत्काल स्पष्ट है। संबोधन में प्रार्थना-संदर्भ के अनुरूप एकवचन ‘तेरा’ रखा गया है।
