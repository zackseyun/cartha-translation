source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: hi
  text: क्योंकि यह विधवा मुझे परेशान करती रहती है, मैं उसे न्याय दिलाऊँगा[a], ताकि वह लगातार आकर मुझे थका न डाले[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं उसके पक्ष में न्याय करूँगा।’ कुछ संदर्भों में यूनानी क्रिया का अर्थ ‘बदला लेना’ भी हो सकता है, पर यहाँ बात न्यायिक राहत देने की है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक चित्र है, ‘मुझे आँख के नीचे मारे’; यहाँ इसका मुहावरेदार अर्थ ‘मुझे पस्त कर दे’ या ‘मुझे बेहाल कर दे’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: फिर भी, क्योंकि ... मुझे परेशान करती रहती है
  rationale: διά के साथ articular infinitive कारण बताता है, और γε उस कारण पर बल देता है। वर्तमान infinitive की जारी रहने वाली क्रिया को ‘करती रहती है’ से व्यक्त किया गया है।
- source_word: τὴν χήραν ταύτην
  choice: यह विधवा
  rationale: संज्ञा और संकेतवाचक का सीधा अनुवाद है; दृष्टांत में उसकी सामाजिक असुरक्षा के कारण ‘विधवा’ को स्पष्ट रखना महत्त्वपूर्ण है।
- source_word: ἐκδικήσω αὐτήν
  choice: मैं उसे न्याय दिलाऊँगा
  rationale: न्यायिक संदर्भ में क्रिया का अर्थ उसके पक्ष में न्याय करना या उसे न्यायिक प्रतिकार देना है, न कि निजी बदला लेना। ‘न्याय दिलाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰς τέλος ἐρχομένη
  choice: लगातार आकर
  rationale: संदर्भ में विधवा के बार-बार आते रहने और न्यायाधीश की झुँझलाहट को व्यक्त करता है। εἰς τέλος में ‘अंत तक/लगातार’ का भाव है; मुख्य पाठ में प्रसंगानुकूल निरंतरता चुनी गई है।
- source_word: ὑπωπιάζῃ με
  choice: मुझे थका न डाले
  rationale: क्रिया का शाब्दिक चित्र आँख के नीचे मारने का है, पर यहाँ लगातार दबाव डालकर पस्त या बेहाल कर देने का मुहावरेदार अर्थ प्रसंग में अधिक उपयुक्त है।
theological_decisions:
- issue: न्याय के दृष्टांत में ἐκδικήσω का अर्थ
  choice: मैं उसे न्याय दिलाऊँगा
  alternative: मैं उसका बदला लूँगा / मैं उसे निर्दोष ठहराऊँगा
  rationale: विधवा अदालत में न्यायिक राहत माँग रही है। यह चुनाव आसपास के पदों में न्याय के विषय से संबंध बनाए रखता है और अनावश्यक प्रतिशोध का भाव नहीं जोड़ता।
- issue: ὑπωπιάζῃ की तीव्र चित्रात्मक भाषा
  choice: मुझे थका न डाले
  alternative: मेरी आँख के नीचे न मारे / मुझे पस्त न कर दे
  rationale: मुख्य पाठ में मुहावरे का प्रसंगानुकूल अर्थ दिया गया है, जबकि पादटिप्पणी मूल यूनानी के अधिक तीखे शाब्दिक चित्र को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। न्यायाधीश की झुँझलाहट ‘परेशान करती रहती है’ और ‘थका न डाले’ से स्वाभाविक बोलचाल में व्यक्त होती है, जबकि पादटिप्पणियाँ मूल की न्यायिक और चित्रात्मक बारीकियाँ सुरक्षित रखती हैं।
