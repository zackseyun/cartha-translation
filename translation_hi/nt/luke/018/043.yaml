base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: hi
  text: और उसी क्षण उसे दृष्टि मिल गई[a], और वह परमेश्वर की महिमा करते हुए यीशु के पीछे चलने लगा। यह देखकर सब लोगों ने परमेश्वर की स्तुति की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह देखने लगा” अथवा “उसकी दृष्टि लौट आई।” यूनानी क्रिया का अर्थ दृष्टि पाना या फिर से देखने लगना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: यह बिना किसी देरी के तत्काल घटित होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνέβλεψεν
  choice: उसकी आँखों की रोशनी लौट आई
  rationale: चंगाई के इस प्रसंग में क्रिया का अर्थ दृष्टि पाना या फिर देखने लगना है। यह हिन्दी में स्वाभाविक है, जबकि उसके पहले कभी देख सकने की बात को निश्चित रूप से नहीं थोपता।
- source_word: ἠκολούθει
  choice: वह ... यीशु के पीछे चलने लगा
  rationale: अपूर्ण भूतकालीन रूप आरम्भ होकर जारी रहने वाली क्रिया का संकेत देता है। हिन्दी में ‘चलने लगा’ उस प्रवाह को सहजता से व्यक्त करता है। सर्वनाम की अस्पष्टता से बचने के लिए प्रसंगानुसार ‘यीशु’ कहा गया है।
- source_word: δοξάζων
  choice: परमेश्वर की महिमा करते हुए
  rationale: यह साथ-साथ चल रही क्रिया को बनाए रखता और δοξάζω को बाद के αἶνον से अलग व्यक्त करता है।
- source_word: πᾶς ὁ λαός
  choice: सब लोगों ने
  rationale: यूनानी सामूहिक एकवचन का स्वाभाविक हिन्दी बहुवचन रूप है।
- source_word: ἰδών
  choice: यह देखकर
  rationale: निहित कर्म को ‘यह’ से व्यक्त किया गया है, जो दृष्टि लौटने और उसके बाद की प्रतिक्रिया के पूरे दृश्य की ओर संकेत कर सकता है।
- source_word: ἔδωκεν αἶνον
  choice: स्तुति की
  rationale: शाब्दिक संरचना ‘स्तुति दी’ हिन्दी में अस्वाभाविक है; ‘स्तुति की’ वही अर्थ स्पष्ट और गरिमापूर्ण ढंग से देती है।
- source_word: θεόν / θεῷ
  choice: परमेश्वर
  rationale: θεός का मानक हिन्दी अनुवाद; दोनों बार दोहराव सुरक्षित रखा गया है।
theological_decisions:
- issue: दृष्टि पाने के बाद उस व्यक्ति के पीछे चलने की क्रिया का पक्ष
  choice: वह परमेश्वर की महिमा करते हुए यीशु के पीछे चलने लगा
  alternative: वह परमेश्वर की महिमा करते हुए यीशु के पीछे चलता रहा
  rationale: ἠκολούθει जारी क्रिया का भाव रखता है। ‘चलने लगा’ कथा में उसके नए प्रत्युत्तर की शुरुआत और निरंतरता को स्वाभाविक हिन्दी में दर्शाता है, बिना शिष्यत्व के बारे में अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
- issue: ἰδών का निहित कर्म
  choice: यह देखकर
  alternative: उसे यीशु के पीछे चलते देखकर
  rationale: यूनानी पाठ कर्म को स्पष्ट नहीं करता। ‘यह’ जानबूझकर व्यापक और अस्पष्ट रखा गया है, ताकि इसे केवल चंगाई या केवल पीछे चलने तक सीमित न किया जाए।
- issue: सामूहिक एकवचन πᾶς ὁ λαός
  choice: सब लोगों ने ... स्तुति की
  alternative: सारी जनता ने ... स्तुति की
  rationale: हिन्दी में लोगों के समूह के लिए बहुवचन अधिक स्वाभाविक है और मूल आशय में कोई धर्मवैज्ञानिक परिवर्तन नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘आँखों की रोशनी लौट आई’ सामान्य पाठक के लिए स्वाभाविक है; ‘महिमा’ और ‘स्तुति’ मूल में प्रयुक्त दो अलग शब्दों का भेद बनाए रखते हैं। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
