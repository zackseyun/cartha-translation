  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: hi
  text: और वे इन बातों में से कुछ भी नहीं समझे। यह कथन[a] उनसे छिपा हुआ था[b], और वे कही जा रही बातों को नहीं समझते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह बात’ अथवा ‘यह संदेश’।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में यह नहीं बताया गया कि इस कथन को उनसे किसने छिपाया।
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: समझे
  rationale: यहाँ क्रिया यीशु की पहले कही हुई बातों को बुद्धि से ग्रहण करने का बोध कराती है; ‘समझे’ सहज और सटीक है।
- source_word: οὐδὲν τούτων
  choice: इन बातों में से कुछ भी
  rationale: यह पहले कही गई अनेक बातों की ओर संकेत करता है और यूनानी बहुवचन का भाव बनाए रखता है।
- source_word: τὸ ῥῆμα τοῦτο
  choice: यह कथन
  rationale: ῥῆμα यहाँ कही हुई बात या कथन को दर्शाता है। ‘कथन’ प्रसंग में स्वाभाविक है और केवल एक शब्द का भ्रामक अर्थ नहीं देता।
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: उनसे छिपा हुआ था
  rationale: यह परिणामी अवस्था बताने वाले पूर्ण निष्क्रिय रूप को व्यक्त करता है और छिपाने वाले को अनिर्दिष्ट रखता है।
- source_word: ἐγίνωσκον
  choice: समझ नहीं पाए
  rationale: यद्यपि γινώσκω का मूल अर्थ ‘जानना’ है, इस प्रसंग में इसका आशय कही जा रही बात का बोध होना है। आधुनिक हिन्दी में ‘जान नहीं पाए’ अर्थ को अस्पष्ट कर सकता है, इसलिए प्रसंगगत अर्थ चुना गया है।
- source_word: τὰ λεγόμενα
  choice: जो कहा जा रहा था
  rationale: यह वर्तमान निष्क्रिय कृदंत के जारी कथन-संबंधी भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चेलों से कथन के छिपे होने का कारण या कर्ता
  choice: निष्क्रिय वाक्य रखा गया है और यह नहीं बताया गया कि कथन किसने या किस कारण से छिपाया।
  alternative: इसे स्पष्ट रूप से परमेश्वर का कार्य या केवल चेलों की मनोवैज्ञानिक उलझन बताना।
  rationale: यूनानी पाठ छिपाने वाले कर्ता को नहीं बताता; अनुवाद इस धार्मिक और कथात्मक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों उपवाक्यों में चेलों की नासमझी पर दिए गए क्रमिक बल को बनाए रखा गया है।
