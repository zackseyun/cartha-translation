id: LUK.18.17
reference: Luke 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, जो कोई परमेश्वर के राज्य को एक बच्चे के समान[a] ग्रहण नहीं करता, वह उसमें निश्चय ही प्रवेश नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बच्चे के रूप में।” इस वाक्यांश में बच्चे जैसी ग्रहणशीलता, भरोसा, नम्रता या निर्भरता पर बल हो सकता है; यूनानी पाठ ठीक-ठीक यह नहीं बताता कि कौन-सी विशेषता अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यीशु के आरंभिक गंभीर कथन-सूत्र में यह ἀμήν की सत्यता और निश्चयात्मकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह बहुवचन संबोधन सहित यूनानी कथन का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ὃς ἂν
  choice: जो कोई
  rationale: सापेक्ष सर्वनाम और ἄν से व्यक्त अनिश्चित सामान्य शर्त को ठीक प्रकार से प्रकट करता है।
- source_word: μὴ δέξηται
  choice: ग्रहण नहीं करता
  rationale: δέχομαι के स्वीकारपूर्वक पाने के भाव को बनाए रखता है और 'परमेश्वर के राज्य' के साथ हिन्दी में स्वाभाविक है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य को
  rationale: यह प्रचलित और पारदर्शी अनुवाद है; 'शासन' संभव है, पर यहाँ उसकी गतिशील धारणा को अनावश्यक रूप से प्रमुख करना उचित नहीं।
- source_word: ὡς παιδίον
  choice: एक बच्चे के समान
  rationale: तुलना को सुरक्षित रखता है और यह निर्धारित नहीं करता कि बच्चे की कौन-सी विशेषता अभिप्रेत है।
- source_word: οὐ μὴ εἰσέλθῃ
  choice: निश्चय ही प्रवेश नहीं करेगा
  rationale: οὐ μή और एओरिस्ट सब्जंक्टिव की प्रबल निषेधात्मक शक्ति को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτήν
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद 'राज्य' है; हिन्दी में 'उसमें प्रवेश' अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के राज्य को ‘एक बच्चे के समान’ ग्रहण करने का अर्थ
  choice: मुख्य पाठ में उपमा को बिना खोले सुरक्षित रखा गया है।
  alternative: बच्चे जैसी नम्रता, भरोसे, निर्भरता या ग्रहणशीलता के साथ; अथवा स्वयं एक बच्चे के रूप में
  rationale: यूनानी पाठ तुलना प्रस्तुत करता है, पर यह स्पष्ट नहीं करता कि बच्चे की कौन-सी विशेषता मुख्य है। किसी एक व्याख्या को पाठ में आरोपित करना वास्तविक अर्थगत और धर्मवैचारिक खुलापन मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘ग्रहण’ बाइबिलीय प्रसंग में परिचित है, फिर भी सामान्य पाठक के लिए बोधगम्य है।
