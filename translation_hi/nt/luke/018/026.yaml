translation:
  language: hi
  text: तब जिन लोगों ने यह सुना, उन्होंने कहा, “तो फिर कौन उद्धार पा सकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: कहा
  rationale: अओरिस्ट सूचक रूप को सरल भूतकालीन कथन के रूप में प्रस्तुत किया गया है।
- source_word: δὲ
  choice: तो फिर
  rationale: यहाँ δέ वार्तालाप में अगले प्रत्युत्तर की ओर संक्रमण कराता है; प्रश्न के भीतर καί के साथ मिलकर हिन्दी में ‘तो फिर’ स्वाभाविक रूप से आश्चर्य और निष्कर्षात्मक प्रतिक्रिया व्यक्त करता है।
- source_word: οἱ ἀκούσαντες
  choice: यह सुननेवालों ने
  rationale: संज्ञात्मक अओरिस्ट कृदंत उन लोगों को सूचित करता है जिन्होंने यीशु की पिछली बात सुनी; हिन्दी में संदर्भगत कर्म ‘यह’ जोड़ना स्पष्ट और स्वाभाविक है।
- source_word: Καὶ τίς
  choice: तो फिर कौन
  rationale: καί यहाँ चकित प्रतिक्रिया की निरंतरता/बल को व्यक्त करता है। ‘तो फिर कौन’ हिन्दी में वही संवादात्मक प्रभाव देता है, बिना किसी व्यक्ति-समूह को सीमित किए।
- source_word: δύναται
  choice: पा सकता है
  rationale: δύναται क्षमता या संभावना बताता है; संयुक्त पद ‘उद्धार पा सकता है’ आधुनिक हिन्दी में सहज है।
- source_word: σωθῆναι
  choice: उद्धार पा
  rationale: प्रसंग परमेश्वर के राज्य में प्रवेश और धनी व्यक्ति के लिए उसकी कठिनाई का है, इसलिए यहाँ क्रिया का उद्धार-संबंधी अर्थ प्रमुख है। हिन्दी में ‘उद्धार पाना’ प्रचलित और स्पष्ट धार्मिक अभिव्यक्ति है।
theological_decisions:
- issue: σωθῆναι का प्रसंगगत अर्थ
  choice: उद्धार पा सकता है
  alternative: बचाया जा सकता है / छुटकारा पा सकता है
  rationale: निकटवर्ती प्रसंग परमेश्वर के राज्य में प्रवेश की बात करता है, इसलिए केवल शारीरिक बचाव के बजाय उद्धार का अर्थ उचित है। फिर भी अनुवाद यह नहीं बताता कि उद्धार की प्रक्रिया या साधन क्या है; वह प्रश्न की मूल व्यापकता बनाए रखता है।
- issue: δύναται σωθῆναι में क्षमता और कर्मवाच्य
  choice: उद्धार पा सकता है
  alternative: बचाया जा सकता है
  rationale: ‘उद्धार पा सकता है’ स्वाभाविक हिन्दी में संभावना/क्षमता को सुरक्षित रखता है। यह परमेश्वर के विषय में अगली आयत के उत्तर को इस आयत में पहले से नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘सुननेवालों’ का संयुक्त रूप सामान्य बाइबलीय हिन्दी से परिचित है, जबकि वाक्य-संरचना वर्तमान बोलचाल के निकट है। प्रश्न में ‘तो फिर’ यूनानी δέ और καί के संयुक्त संवादात्मक प्रभाव को स्वाभाविक रूप में व्यक्त करता है।
