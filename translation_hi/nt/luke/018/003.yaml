    text: या “मुझे मेरे विरोधी के विरुद्ध न्याय दीजिए” अथवा “मेरे प्रतिपक्षी के विरुद्ध मेरे पक्ष में न्याय कीजिए।” यूनानी क्रिया का अर्थ कानूनी न्याय दिलाना या किसी का पक्ष सही ठहराना हो सकता है; यहाँ इसका आशय अनिवार्य रूप से व्यक्तिगत बदला लेना नहीं है।
