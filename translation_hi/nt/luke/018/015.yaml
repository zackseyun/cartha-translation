  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: hi
  text: लोग शिशुओं को भी उसके पास ला रहे थे, ताकि वह उन्हें छुए[a]; लेकिन जब चेलों ने यह देखा[c], तो वे उन्हें लाने वालों को डाँट रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नन्हे बच्चों को’। यहाँ प्रयुक्त यूनानी शब्द बहुत छोटी आयु के बच्चों, विशेषकर शिशुओं, के लिए है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उन लोगों को, जो शिशुओं को यीशु के पास ला रहे थे।
    reason: lexical_alternative
  - marker: c
    text: समानांतर वृत्तांतों में यीशु का स्पर्श बच्चों को आशीष देने और उन पर हाथ रखने से जुड़ा है (मत्ती 19:13; मरकुस 10:13, 16)।
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: ला रहे थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार हो रही क्रिया को दर्शाता है; इसलिए ‘ला रहे थे’ उपयुक्त है।
- source_word: δὲ
  choice: लेकिन
  rationale: पहले खंड में यह हल्का कथात्मक संयोजक है, जबकि दूसरे δὲ के साथ चेलों की प्रतिक्रिया का स्पष्ट विरोध उभरता है; स्वाभाविक हिन्दी में एक ही ‘लेकिन’ उस मोड़ को पर्याप्त रूप से व्यक्त करता है।
- source_word: καὶ τὰ βρέφη
  choice: छोटे बच्चों को भी
  rationale: βρέφη बहुत छोटी आयु के बच्चों को दर्शाता है। ‘छोटे बच्चे’ सहज आधुनिक हिन्दी है, और ‘भी’ καὶ की समावेशी/बलात्मक शक्ति रखता है।
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: कि वह उन्हें छुए
  rationale: ἵνα उद्देश्य बताता है और ἅπτομαι का सीधा अर्थ ‘छूना’ है; मुख्य पाठ में आशीष देना या हाथ रखना नहीं जोड़ा गया।
- source_word: ἰδόντες
  choice: जब चेलों ने यह देखा
  rationale: क्रियाविशेषणात्मक कृदन्त को हिन्दी में स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है। ‘यह’ पूरे दृश्य की ओर संकेत करता है।
- source_word: ἐπετίμων
  choice: डाँटने लगे
  rationale: अपूर्ण भूतकाल की जारी प्रतिक्रिया को ‘डाँटने लगे’ स्वाभाविक रूप से व्यक्त करता है और क्रिया की कड़ी फटकार का भाव बनाए रखता है।
- source_word: αὐτοῖς
  choice: उन्हें लानेवालों को
  rationale: सर्वनाम का सबसे स्वाभाविक संदर्भ बच्चों को लानेवाले लोग हैं। हिन्दी में अस्पष्ट और संभावित रूप से भ्रामक ‘उन्हें’ के बजाय संदर्भ स्पष्ट किया गया है।
theological_decisions:
- issue: यीशु द्वारा बच्चों को छूने की क्रिया का स्वरूप
  choice: उन्हें छुए
  alternative: उन्हें आशीष दे / उन पर हाथ रखे
  rationale: लूका के तत्काल यूनानी पाठ में ἅπτηται, अर्थात ‘छुए’, है। समानांतर वृत्तांत इस स्पर्श को आशीष और हाथ रखने से जोड़ते हैं, पर वह अर्थ मुख्य पाठ में जोड़ने के बजाय टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिशु’ की अपेक्षा मुख्य पाठ में अधिक सामान्य ‘छोटे बच्चे’ चुना गया है, जबकि स्रोत की आयु-संबंधी विशिष्टता पादटिप्पणी में स्पष्ट है। प्रत्येक पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
