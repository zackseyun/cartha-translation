source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: hi
  text: तब उसने उनसे कहा, “मैं तुमसे सच कहता हूँ, ऐसा कोई नहीं जिसने परमेश्वर के राज्य के लिए घर या पत्नी या भाई या माता-पिता या बच्चों को छोड़ दिया हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर और प्रामाणिक कथन-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप; ‘आमीन’ का अर्थ स्पष्ट करता है।
- source_word: ἀφῆκεν
  choice: छोड़ दिया हो
  rationale: यहाँ किसी व्यक्ति या घर को परमेश्वर के राज्य के कारण पीछे छोड़ने के अर्थ को व्यक्त करता है, बिना त्याग की परिस्थितियाँ अधिक निश्चित किए।
- source_word: οἰκίαν
  choice: घर
  rationale: शब्द निवास-स्थान या गृहस्थी दोनों का संकेत दे सकता है; ‘घर’ हिन्दी में यही व्यापकता बनाए रखता है।
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य के लिए
  rationale: कारण अथवा उद्देश्य के भाव को संक्षिप्त और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: परिवार और घर छोड़ने का कथन
  choice: सूची और कथन को बिना अतिरिक्त नैतिक स्पष्टीकरण के यथावत रखा गया है।
  alternative: ‘सेवा करने के लिए’ या ‘सुसमाचार के लिए’ जैसे व्याख्यात्मक शब्द जोड़ना।
  rationale: मूल पाठ केवल ‘परमेश्वर के राज्य के लिए’ कहता है; अतिरिक्त उद्देश्य जोड़ने से कथन का तनाव और व्यापकता घट सकती है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। पद अगले पद में पूरा होने वाला वाक्य है, इसलिए अंत में अल्पविराम रखा गया है।
