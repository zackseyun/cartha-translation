base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: hi
  text: और यीशु ने उससे कहा, “दृष्टि प्राप्त कर[a]; तेरे विश्वास ने तुझे बचाया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर से देखने लग।” यूनानी आदेश चंगाई के प्रसंग में दृष्टि वापस पाने का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे विश्वास ने तुझे चंगा किया है” अथवा “तेरे विश्वास ने तुझे स्वस्थ किया है।” यूनानी क्रिया उद्धार के साथ-साथ चंगाई का भी बोध करा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक के रूप में अनुवाद किया गया है; इससे मूल में निहित न होने वाला कारण या परिणाम नहीं जोड़ा जाता।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: यह यूनानी क्रिया और अप्रत्यक्ष कर्म का स्वाभाविक तथा सीधा हिन्दी रूप है।
- source_word: Ἀνάβλεψον
  choice: अपनी दृष्टि पा ले
  rationale: चंगाई के इस प्रसंग में क्रिया का अर्थ ऊपर देखना नहीं, बल्कि देखने की क्षमता प्राप्त करना या फिर से पाना है। यह रूप आदेश और चंगाई—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ शब्द यीशु पर उस व्यक्ति के भरोसे को दर्शाता है। “विश्वास” प्रचलित, व्यापक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: σέσωκέν
  choice: बचाया है
  rationale: σῴζω शारीरिक चंगाई और व्यापक उद्धार—दोनों का संकेत दे सकता है। “बचाया है” इस अर्थ-विस्तार को बनाए रखता है और इसे केवल शारीरिक उपचार तक सीमित नहीं करता; पूर्णकालिक भाव के लिए “है” रखा गया है।
theological_decisions:
- issue: चंगाई के प्रसंग में σῴζω का अर्थ-क्षेत्र
  choice: बचाया है
  alternative: तुझे चंगा किया है / तुझे अच्छा किया है
  rationale: तात्कालिक प्रसंग शारीरिक दृष्टि लौटने का है, पर क्रिया उद्धार का व्यापक अर्थ भी रख सकती है। मुख्य पाठ में “बचाया है” रखने से लूका के वर्णन में चंगाई और उद्धार के बीच की वास्तविक अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। यीशु और उस व्यक्ति के बीच प्रत्यक्ष संबोधन के लिए “तेरे/तुझे” रखा गया है, जो प्रसंग में स्वाभाविक है और अनादर व्यक्त नहीं करता। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
