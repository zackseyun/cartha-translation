  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: hi
  text: और जब उसने भीड़ को पास से गुजरते सुना, तो वह पूछने लगा कि यह क्या था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पूछता रहा कि यह क्या हो सकता था।” अपूर्णकालिक क्रिया बार-बार पूछने का भाव दे सकती है, और परोक्ष प्रश्न में प्रयुक्त विधिलिंग कुछ अनिश्चितता प्रकट कर सकता है।
    reason: क्रियात्मक और व्याकरणिक वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने … सुना
  rationale: एओरिस्ट कृदंत का परिस्थितिजन्य, मुख्यतः कालवाचक संबंध स्वाभाविक हिन्दी उपवाक्य से व्यक्त किया गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध प्रकट किए बिना प्रवाह बनाए रखता है।
- source_word: ὄχλου
  choice: भीड़
  rationale: अनिश्चित, एकवचन ὄχλου के लिए हिन्दी में बिना अनावश्यक ‘एक’ जोड़े ‘भीड़’ स्वाभाविक है।
- source_word: διαπορευομένου
  choice: पास से गुजरते
  rationale: वर्तमान कृदंत भीड़ की जारी गति बताता है; प्रसंग में ‘पास से गुजरते’ इस दृश्य को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐπυνθάνετο
  choice: पूछने लगा
  rationale: अपूर्णकालिक क्रिया के आरंभिक या जारी भाव में से यहाँ आरंभिक भाव कथानक में स्वाभाविक है; पुनरावृत्त पूछताछ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: τί εἴη τοῦτο
  choice: यह क्या था
  rationale: अतीतकालीन मुख्य क्रिया के बाद परोक्ष प्रश्न में आए विधिलिंग εἴη को सरल हिन्दी में निकटता से रखा गया है, बिना उसे ‘मतलब’ के अर्थ में व्याख्यायित किए।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक भीड़’ जैसे अस्वाभाविक प्रयोग से बचते हुए मूल के अनिश्चित भाव को हिन्दी की सामान्य अभिव्यक्ति में रखा गया है।
