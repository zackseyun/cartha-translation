  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: hi
  text: जब वह यरीहो के पास पहुँच रहा था, तो एक अंधा व्यक्ति सड़क के किनारे बैठा हुआ भीख माँग रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: तो
  rationale: यह यूनानी अभिव्यक्ति यहाँ मुख्यतः कथा को आगे बढ़ाने वाला संक्रमण है। हिंदी में ‘तो’ आश्रित कालवाचक उपवाक्य को मुख्य घटना से स्वाभाविक रूप से जोड़ता है, बिना अनावश्यक ‘ऐसा हुआ’ जोड़े।
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: जब वह यरीहो के पास पहुँच रहा था
  rationale: ἐν के साथ संज्ञीकृत वर्तमान infinitive समकालिक और जारी क्रिया व्यक्त करता है। ‘पहुँच रहा था’ उस अपूर्ण पक्ष को बनाए रखता है; ‘के पास’ εἰς के गंतव्य की ओर बढ़ने के भाव को सहज हिंदी में व्यक्त करता है।
- source_word: τυφλός τις
  choice: कोई अंधा व्यक्ति
  rationale: τις की अनिश्चित किंतु कुछ हद तक व्यक्तिवाचक छाया को ‘कोई’ व्यक्त करता है। ‘व्यक्ति’ आधुनिक, सम्मानजनक और सामान्य हिंदी है।
- source_word: ἐκάθητο
  choice: बैठा
  rationale: मुख्य सहायक क्रिया ‘था’ को ‘भीख माँग रहा था’ में रखकर हिंदी वाक्य में दोनों जारी क्रियाओं को स्वाभाविक ढंग से जोड़ा गया है; बैठने की दृश्य-पृष्ठभूमि बनी रहती है।
- source_word: παρὰ τὴν ὁδὸν
  choice: सड़क के किनारे
  rationale: παρά यहाँ सड़क के साथ लगी हुई स्थिति बताता है। ‘सड़क के किनारे’ स्पष्ट और प्रचलित आधुनिक हिंदी है।
- source_word: ἐπαιτῶν
  choice: भीख माँग रहा था
  rationale: वर्तमान कृदंत उस समय जारी भिक्षा माँगने की क्रिया बताता है। यह सीधा और सामान्य हिंदी रूप है।
