source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: hi
  text: पर चुंगी लेने वाला दूर खड़ा था। वह अपनी आँखें स्वर्ग की ओर उठाना भी नहीं चाहता था, बल्कि अपनी छाती पीटता जा रहा था और कह रहा था, ‘हे परमेश्वर, मुझ पापी पर दया कर[a]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे प्रति अनुकूल हो”; मूल क्रिया प्रायश्चित से जुड़ी भाषा से संबंधित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: चुंगी लेने वाला
  rationale: यह रोमी व्यवस्था के अधीन कर/चुंगी वसूलने वाले अधिकारी के लिए सहज और संदर्भानुकूल हिन्दी है तथा पात्र से जुड़ी सामाजिक बदनामी को बनाए रखती है।
- source_word: μακρόθεν ἑστὼς
  choice: दूर खड़ा था
  rationale: स्थानगत दूरी और विनम्रता से पीछे रहने की भाव-छाया, दोनों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: भी नहीं चाहता था
  rationale: θέλω की इच्छा या अनिच्छा को स्पष्ट करता है; इसे असमर्थता के रूप में नहीं दर्शाता।
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: अपनी आँखें स्वर्ग की ओर उठाना
  rationale: यूनानी मुहावरे और उसकी श्रद्धापूर्ण दिशा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἔτυπτε
  choice: पीटता जा रहा था
  rationale: अपूर्णकाल की निरंतर अथवा बार-बार की जाने वाली क्रिया को स्पष्ट करता है।
- source_word: τὸ στῆθος αὐτοῦ
  choice: अपनी छाती
  rationale: शोक और पश्चात्ताप के शारीरिक संकेत के लिए आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: ἱλάσθητί μοι
  choice: मुझ ... पर दया कर
  rationale: सीधी प्रार्थना में सहज और बोधगम्य है, जबकि प्रायश्चित तथा अनुकूल किए जाने से जुड़ी शब्दगत गहराई पादटिप्पणी में सुरक्षित है।
- source_word: τῷ ἁμαρτωλῷ
  choice: मुझ पापी
  rationale: यूनानी निश्चित पदबंध का आत्म-दीनता और जोर हिन्दी में स्वाभाविक रूप से व्यक्त होता है; केवल ‘एक पापी’ कहने से यह बल घट जाता।
theological_decisions:
- issue: ἱλάσθητί μοι में दया और प्रायश्चित-संबंधी अर्थ का संबंध
  choice: मुख्य पाठ में ‘मुझ पापी पर दया कर’
  alternative: ‘मेरे लिए प्रायश्चित करके मुझ पर अनुग्रह कर’ अथवा ‘मेरे प्रति अनुकूल हो’
  rationale: क्रिया दया की याचना करती है, पर उसका शब्द-समूह प्रायश्चित और परमेश्वर के अनुकूल होने से भी संबंधित है। मुख्य पाठ को स्पष्ट रखते हुए पादटिप्पणी इस धार्मिक गहराई को बिना किसी एक सिद्धान्तगत व्याख्या को थोपे सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘हे परमेश्वर’ प्रार्थना का आदरपूर्ण संबोधन बनाए रखता है; ‘पीटता जा रहा था’ यूनानी अपूर्णकाल की निरंतरता दर्शाता है।
