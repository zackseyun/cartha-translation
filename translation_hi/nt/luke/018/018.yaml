language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: hi
  text: एक अधिकारी ने उनसे पूछा, “अच्छे गुरु, अनन्त जीवन का वारिस होने के लिए मुझे क्या करना होगा[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “मैं क्या करके अनन्त जीवन का वारिस बनूँगा?”'
    reason: मूल यूनानी में ‘करके’ के अर्थ वाला कृदन्त और भविष्यकालीन मुख्य क्रिया है; मुख्य पाठ इसे स्वाभाविक हिन्दी प्रश्न के रूप में व्यक्त करता है।
lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: कथा के क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; यहाँ केवल संयोजक ‘और’ की अपेक्षा ‘तब’ अधिक सहज है।
- source_word: ἐπηρώτησέν
  choice: पूछा
  rationale: क्रिया का सामान्य अर्थ ‘पूछना’ है; यह न तो प्रश्न की औपचारिकता बढ़ाता है, न उसका भाव घटाता है।
- source_word: τις ... ἄρχων
  choice: एक अधिकारी
  rationale: τις व्यक्ति को अनिश्चित रखता है और ἄρχων अधिकार-पद वाले व्यक्ति को दर्शाता है। ‘अधिकारी’ पद को अनावश्यक रूप से राजनीतिक या धार्मिक बनाए बिना इस व्यापक अर्थ को व्यक्त करता है।
- source_word: Διδάσκαλε ἀγαθέ
  choice: हे उत्तम गुरु
  rationale: ‘गुरु’ शिक्षण करने वाले व्यक्ति का स्वाभाविक हिन्दी संबोधन है। ‘उत्तम’ ἀγαθός के सकारात्मक नैतिक मूल्य को बनाए रखता है और अगले पद में यीशु की प्रतिक्रिया के लिए आवश्यक शब्द-संबंध को सुरक्षित रखता है।
- source_word: τί ποιήσας
  choice: मुझे क्या करना होगा
  rationale: अओरिस्ट कृदन्त यहाँ उस कार्य या शर्त को व्यक्त करता है जिसे प्रश्नकर्ता अनन्त जीवन पाने से जोड़ता है। यह हिन्दी में स्वाभाविक है; अधिक शब्दशः रचना पाद-टिप्पणी में दी गई है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह वाक्यांश के कालातीत और युग-संबंधी धार्मिक आशय को व्यक्त करने वाला स्थापित, स्पष्ट हिन्दी पद है।
- source_word: κληρονομήσω
  choice: विरासत में पाने
  rationale: यह केवल ‘पाने’ की अपेक्षा κληρονομέω में निहित विरासत की धारणा को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: अनन्त जीवन और मानवीय कर्म के बीच प्रश्नकर्ता द्वारा बनाया गया संबंध
  choice: अनन्त जीवन विरासत में पाने के लिए मुझे क्या करना होगा
  alternative: अनन्त जीवन पाने के लिए मुझे क्या करना चाहिए
  rationale: मूल पाठ अधिकारी के प्रश्न को अपेक्षित कर्म के रूप में प्रस्तुत करता है। अनुवाद उसके दृष्टिकोण को ज्यों का त्यों रखता है और इस पद में न तो उसका समर्थन करता है, न बाद की धर्मवैज्ञानिक व्याख्या जोड़कर तनाव को मिटाता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदरसूचक सर्वनाम ‘उनसे’ यीशु के प्रति स्वाभाविक हिन्दी सम्मान व्यक्त करता है।
