id: LUK.18.20
reference: Luke 18:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: hi
  text: 'तुम आज्ञाएँ जानते हो: व्यभिचार न करना[a], हत्या न करना, चोरी न करना, झूठी गवाही न देना, और अपने पिता और माता का आदर करना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात विवाह-संबंध में यौन बेवफाई न करना।
    reason: ‘व्यभिचार’ का आधुनिक पाठकों के लिए संक्षिप्त अर्थ-स्पष्टीकरण; यूनानी μοιχεύω की वैवाहिक विशिष्टता को स्पष्ट करता है।
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: आज्ञाओं
  rationale: यहाँ ἐντολάς उन सुविख्यात, अधिकारपूर्ण आज्ञाओं को सूचित करता है जिन्हें यीशु दस आज्ञाओं से उद्धृत कर रहे हैं; इसलिए ‘आज्ञाओं’ स्वाभाविक और अंतर्पाठीय रूप से उपयुक्त है।
- source_word: οἶδας
  choice: जानते हो
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक है, पर कोइने यूनानी में इसका अर्थ वर्तमानकालिक ‘जानना’ होता है। संबोधित व्यक्ति के लिए आधुनिक हिन्दी का ‘जानते हो’ स्वाभाविक है।
- source_word: Μὴ μοιχεύσῃς
  choice: व्यभिचार न करना
  rationale: μοιχεύω का यहाँ विशिष्ट अर्थ विवाह-संबंध का उल्लंघन, अर्थात व्यभिचार करना है। ‘न करना’ यूनानी निषेध की आज्ञात्मक शक्ति को संक्षिप्त और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: Μὴ φονεύσῃς
  choice: हत्या न करना
  rationale: φονεύω सामान्य रूप से हर प्रकार के मारने के बजाय हत्या को सूचित करता है; ‘हत्या’ निषेध को अनावश्यक रूप से व्यापक किए बिना अधिक सटीक अर्थ देता है।
- source_word: Μὴ κλέψῃς
  choice: चोरी न करना
  rationale: κλέπτω का सीधा अर्थ चोरी करना है; यह सरल हिन्दी अभिव्यक्ति मूल के निषेध को ठीक प्रकार से रखती है।
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: झूठी गवाही न देना
  rationale: ψευδομαρτυρέω का अर्थ झूठी गवाही देना है। यह अनुवाद दस आज्ञाओं से संबंध को बनाए रखते हुए सामान्य पाठक के लिए भी स्पष्ट है।
- source_word: Τίμα
  choice: आदर करना
  rationale: τιμάω यहाँ माता-पिता को उचित सम्मान देने की नैतिक और वाचा-संबंधी धारणा व्यक्त करता है; ‘आदर करना’ आधुनिक हिन्दी में प्रतिष्ठित और अर्थानुकूल है।
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: अपने पिता और माता
  rationale: मूल में पिता और माता दोनों स्पष्ट रूप से नामित हैं। ‘अपने’ दोनों से स्वाभाविक रूप से जुड़ता है और हिन्दी में अनावश्यक पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: दस आज्ञाओं की शैली वाले निषेधों का अनुवाद
  choice: आधुनिक और स्पष्ट आज्ञात्मक शैली ‘... न करना’
  alternative: परंपरागत प्रत्यक्ष शैली ‘तू ... न करना’
  rationale: यूनानी में निषेधसूचक μή के साथ द्वितीय पुरुष एकवचन अओरिस्ट सब्जंक्टिव रूप हैं। हिन्दी में ‘... न करना’ उनकी निषेधात्मक आज्ञा को स्पष्ट रूप से रखता है और ‘तू’ से उत्पन्न होने वाले आधुनिक सामाजिक या अनादरसूचक भाव से बचता है; इससे आज्ञाओं की विषयवस्तु या धर्मवैज्ञानिक बल नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दस आज्ञाओं की गंभीर और संक्षिप्त लय बनाए रखती है। आरंभ में ‘तुम ... जानते हो’ प्रत्यक्ष संबोधन को स्वाभाविक बनाता है। सूची में समानांतर ‘न करना’ संरचना रखी गई है, और अंतिम पद से पहले ‘और’ जोड़कर हिन्दी प्रवाह स्पष्ट किया गया है।
