  source_fidelity: 'The Hindi accurately represents every principal element of the Greek: the responsive δέ (“पर”), Jesus’ speaking to the explicit pronoun referent (“उससे कहा”), the idiomatic causal question (“क्यों”), the repeated ἀγαθός (“भला”), the universal negation, and the μοναδिक exception identifying God. “केवल एक—परमेश्वर” preserves the force of εἰ μὴ εἷς ὁ θεός without resolving the Christological implication of Jesus’ question.'
  naturalness: The wording is clear, modern standard Hindi with a suitably dignified scriptural register. The compact final clause and dash are natural for an emphatic saying; the implied verb is readily understood from the preceding clause.
  terminology: “यीशु,” “भला,” and “परमेश्वर” are appropriate, established Hindi biblical terms. Repeating “भला” faithfully maintains the Greek lexical correspondence and does not over-specify the moral-theological sense.
