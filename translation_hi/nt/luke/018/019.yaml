id: LUK.18.19
reference: Luke 18:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: hi
  text: पर यीशु ने उससे कहा, “तुम मुझे भला क्यों कहते हो? कोई भला नहीं, केवल एक—परमेश्वर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह प्रसंग में उत्तर के साथ हल्का विरोध या सुधार का भाव दिखाता है; ‘और’ भी संभव है, पर यहाँ ‘पर’ अधिक स्वाभाविक है।
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: यीशु ने ... कहा
  rationale: λέγω का सीधा अर्थ ‘कहा’ है; उत्तर का भाव प्रसंग से स्पष्ट है, इसलिए ‘उत्तर दिया’ जोड़ना आवश्यक नहीं।
- source_word: αὐτῷ
  choice: उससे
  rationale: यूनानी सर्वनाम को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘उस मनुष्य से’ अनावश्यक व्याख्यात्मक विस्तार होता।
- source_word: Τί
  choice: क्यों
  rationale: τί यहाँ प्रश्नवाचक मुहावरे में कारण पूछता है; हिन्दी में ‘क्यों’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: με λέγεις ἀγαθόν
  choice: तुम मुझे भला ... कहते हो
  rationale: यह λέγεις और विधेय विशेषण ἀγαθόν की सीधी, स्वाभाविक अभिव्यक्ति है।
- source_word: ἀγαθόν / ἀγαθὸς
  choice: भला
  rationale: दोनों occurrences में एक ही शब्द रखकर मूल की पुनरावृत्ति सुरक्षित की गई है। ‘भला’ व्यक्ति के नैतिक गुण के लिए आधुनिक हिन्दी में स्वाभाविक है और ‘नैतिक रूप से अच्छा’ जैसी अति-व्याख्या से बचता है।
- source_word: οὐδεὶς
  choice: कोई ... नहीं
  rationale: यह सार्वभौमिक निषेध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰ μὴ εἷς
  choice: केवल एक
  rationale: अपवाद और एकमात्रता दोनों को संक्षेप में व्यक्त करता है। डैश अगले पद ‘परमेश्वर’ को उसी ‘एक’ की पहचान के रूप में उभारता है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: यह θεός के निश्चित, एकेश्वरवादी संदर्भ के लिए प्रतिष्ठित और व्यापक रूप से समझा जाने वाला हिन्दी रूप है।
theological_decisions:
- issue: यीशु के प्रश्न का मसीह-विषयक निहितार्थ
  choice: प्रश्न को उसके मूल खुले रूप में रखा गया है; यह न तो स्पष्ट रूप से यीशु की भलाई का निषेध करता है, न इसे सीधे उनके परमेश्वर होने की घोषणा में बदलता है।
  alternative: ऐसा भावानुवाद जो यीशु द्वारा अपनी परम भलाई के निषेध या अपनी ईश्वरता के प्रत्यक्ष दावे को स्पष्ट कर दे।
  rationale: यूनानी वाक्य स्वयं इस धर्मवैज्ञानिक तनाव का अंतिम निष्कर्ष स्पष्ट नहीं करता। निकट अनुवाद पाठक पर कोई अतिरिक्त सिद्धान्तगत निष्कर्ष आरोपित नहीं करता।
- issue: ‘एक—परमेश्वर’ में εἷς का बल
  choice: ‘केवल एक—परमेश्वर’
  alternative: ‘केवल परमेश्वर’
  rationale: चुना हुआ रूप εἷς (‘एक’) को प्रत्यक्ष रूप से बनाए रखता है और परमेश्वर को उस एकमात्र भले के रूप में पहचानता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘भला’ को दोनों स्थानों पर दोहराकर मूल का शाब्दिक और आलंकारिक संबंध सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
