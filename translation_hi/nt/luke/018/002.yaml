  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: hi
  text: उसने कहा, “किसी नगर में एक न्यायाधीश था, जो न तो परमेश्वर से डरता था और न किसी मनुष्य का सम्मान करता था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: उसने कहा
  rationale: वर्तमान कृदंत पिछले पद से जुड़कर दृष्टान्त के कथन का परिचय देता है। हिन्दी में स्वतंत्र पद के आरम्भ पर ‘उसने कहा’ स्वाभाविक है और सम्बन्ध बनाए रखता है।
- source_word: Κριτής τις
  choice: एक न्यायी
  rationale: τις अनिर्दिष्ट पात्र का परिचय देता है। ‘एक न्यायी’ आधुनिक हिन्दी की स्वाभाविक कथात्मक अभिव्यक्ति है; ‘कोई न्यायी’ की अपेक्षा यह दृष्टान्त के आरम्भ में अधिक सहज है।
- source_word: ἔν τινι πόλει
  choice: किसी नगर में
  rationale: τινι की अनिर्दिष्टता ‘किसी’ से स्पष्ट रहती है। ‘नगर’ गरिमापूर्ण और सामान्य बाइबलीय गद्य में सहज है।
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: परमेश्वर से डरता था
  rationale: φοβέομαι का धार्मिक और नैतिक अर्थ ‘डरना’ से सीधे व्यक्त होता है; इसे केवल ‘आदर करना’ कहने से मूल का बल कम हो सकता है।
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: किसी मनुष्य की परवाह करता था
  rationale: एकवचन ἄνθρωπον यहाँ सामान्य अर्थ में है। ‘किसी मनुष्य’ स्रोत की एकवचन रचना और ‘किसी व्यक्ति’ का व्यापक आशय दोनों रखता है; ἐντρέπομαι के लिए ‘परवाह करना’ यहाँ दूसरों के प्रति लिहाज़ या सम्मान न रखने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: परमेश्वर और मनुष्य के प्रति न्यायी के रवैये का समानान्तर विरोध
  choice: न तो परमेश्वर से डरता था और न किसी मनुष्य की परवाह करता था
  alternative: न परमेश्वर का भय मानता था, न लोगों का आदर करता था
  rationale: मुख्य पाठ मूल के दो कृदंतों और θεός/ἄνθρωπος के विरोध को स्पष्ट रखता है। ‘किसी मनुष्य’ सामान्य एकवचन को अनावश्यक रूप से केवल पुरुष तक सीमित नहीं करता, जबकि ‘परवाह’ ἐντρέπομαι में निहित लिहाज़ और सम्मान की व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। अनिर्दिष्ट τις को हिन्दी मुहावरे के अनुसार क्रमशः ‘एक’ और ‘किसी’ से व्यक्त किया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं है।
