source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: hi
  text: और जो लोग आगे चल रहे थे, वे उसे डाँट रहे थे कि वह चुप रहे; पर वह और भी अधिक पुकारता रहा, “हे दाऊद के पुत्र, मुझ पर दया कीजिए!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: जो लोग आगे चल रहे थे
  rationale: वर्तमान कृदन्त का संज्ञात्मक प्रयोग है और जुलूस या भीड़ में आगे चल रहे लोगों को दर्शाता है; यह अनुवाद उनकी भूमिका के विषय में अतिरिक्त अर्थ जोड़े बिना स्थानगत भाव बनाए रखता है।
- source_word: ἐπετίμων
  choice: डाँट रहे थे
  rationale: अपूर्णकाल चलती या बार-बार की जा रही कठोर रोक-टोक को दर्शाता है; ‘डाँट रहे थे’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: ἵνα σιγήσῃ
  choice: कि वह चुप रहे
  rationale: ἵνα और संभावनार्थक क्रिया उद्देश्य व्यक्त करते हैं; हिन्दी में यह रचना उस उद्देश्य को संक्षेप और स्वाभाविक ढंग से रखती है।
- source_word: αὐτὸς δὲ
  choice: पर वह
  rationale: δὲ विरोध दर्शाता है और αὐτός उस व्यक्ति पर बल देता है; हिन्दी में ‘पर वह’ संदर्भगत विरोध को स्पष्ट करता है, जबकि ‘वह स्वयं’ अनावश्यक रूप से भारी होता।
- source_word: πολλῷ μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक तीव्रता को बनाए रखता है और मूल में स्पष्ट न होने वाले ‘ज़ोर से’ जैसे ढंग-सूचक अर्थ को नहीं जोड़ता।
- source_word: ἔκραζεν
  choice: पुकारता रहा
  rationale: अपूर्णकाल उसकी लगातार या बार-बार की पुकार को व्यक्त करता है; ‘पुकारता रहा’ दृढ़ता और निरन्तरता दोनों को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: Υἱὲ Δαυίδ
  choice: हे दाऊद की सन्तान
  rationale: यह सम्बोधनात्मक दाऊदी-मसीही उपाधि है। ‘सन्तान’ हिन्दी में वंशज का भाव स्वाभाविक रूप से व्यक्त करती है और स्त्रीलिंग ‘पुत्र’ जैसे अधिक शाब्दिक रूप की अपेक्षा अर्थ को स्पष्ट रखती है।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: आज्ञार्थक विनती की तात्कालिकता और आदरयुक्त सम्बोधन दोनों को बनाए रखने वाला प्रचलित, स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: Υἱὲ Δαυίδ का मसीही महत्व
  choice: मुख्य पाठ में ‘हे दाऊद की सन्तान’ के रूप में अनुवाद
  alternative: इसे केवल सामान्य सम्मानसूचक सम्बोधन मानना या ‘दाऊद के पुत्र’ कहना
  rationale: लूका के वृत्तान्त में यह दाऊदी वंश और मसीही आशा से जुड़ी अर्थपूर्ण उपाधि है। ‘दाऊद की सन्तान’ उस वंशगत और मसीही संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। चलती हुई डाँट और लगातार पुकार को अपूर्णकाल-सदृश हिन्दी रचनाओं से व्यक्त किया गया है। परमेश्वर-संबंधी या मसीही सम्बोधन के प्रति आदर दिखाने के लिए ‘कीजिए’ प्रयुक्त है।
