  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: hi
  text: तब यीशु रुक गए और उन्होंने आज्ञा दी कि उस मनुष्य को उनके पास लाया जाए। जब वह पास आया, तो यीशु ने उससे पूछा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταθεὶς
  choice: रुक गए
  rationale: ἵστημι का यह अओरिस्ट कृदंत यहाँ अकर्मक अर्थ में है और बताता है कि यीशु चलते-चलते ठहर गए; आधुनिक हिन्दी में ‘रुक गए’ स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: तब
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘तब’ पिछले प्रसंग से स्वाभाविक क्रम जोड़ता है, बिना प्रबल विरोध का भाव दिए।
- source_word: ἐκέλευσεν
  choice: आज्ञा दी
  rationale: κελεύω अधिकारपूर्वक आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ उस बल को गरिमापूर्ण और सहज हिन्दी में सुरक्षित रखता है।
- source_word: αὐτὸν ἀχθῆναι πρὸς αὐτόν
  choice: उस मनुष्य को उनके पास लाया जाए
  rationale: ἄγω का कर्मवाच्य रूप किसी को ले आने या पहुँचाने का अर्थ देता है। सर्वनामों की अस्पष्टता घटाने के लिए पहले αὐτόν को ‘उस मनुष्य’ और यीशु-सूचक αὐτόν को आदरसूचक ‘उनके’ किया गया है।
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: जब वह पास आया
  rationale: यह संबंधवाचक स्वतंत्र कृदंत समय बताता है; ‘जब वह पास आया’ उसके अर्थ और संक्षिप्तता दोनों को बनाए रखता है। संदर्भ में कर्ता वही मनुष्य है।
- source_word: ἐπηρώτησεν αὐτόν
  choice: यीशु ने उससे पूछा
  rationale: ἐπερωτάω का सामान्य अर्थ ‘पूछना’ है। यूनानी में निहित कर्ता को हिन्दी में ‘यीशु’ कहकर स्पष्ट करना सर्वनाम-संदेह से बचाता है।
