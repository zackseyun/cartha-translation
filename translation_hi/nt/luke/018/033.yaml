  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: hi
  text: और वे उसे कोड़े लगाकर मार डालेंगे, और तीसरे दिन वह जी उठेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे जिलाया जाएगा।” यहाँ यूनानी में अधिक सीधे तौर पर “वह जी उठेगा” है।
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: कोड़े लगाकर
  rationale: अोरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है। ‘कोड़े लगाकर’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है तथा मूल की क्रूरता को कम नहीं करता।
- source_word: ἀποκτενοῦσιν
  choice: मार डालेंगे
  rationale: यह भविष्यकाल, कर्तृवाच्य और बहुवचन रूप है। ‘मार डालेंगे’ मूल के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘हत्या करेंगे’ मूल क्रिया में स्पष्ट निहित नৈতিক-कानूनी अर्थ जोड़ सकता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह कर्मवाचक सर्वनाम प्रसंग में यीशु/मनुष्य के पुत्र की ओर संकेत करता है।
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: कालवाचक दत्तिव का हिन्दी में स्वाभाविक और सटीक रूप ‘तीसरे दिन’ है।
- source_word: ἀναστήσεται
  choice: वह जी उठेगा
  rationale: ἀνίστημι का यह भविष्यकालीन मध्यवाच्य रूप यहाँ अकर्मक अर्थ देता है। ‘जी उठेगा’ मृत्यु के बाद पुनर्जीवन को स्पष्ट करते हुए यूनानी रूप के निकट रहता है और स्पष्ट कर्मवाच्य नहीं जोड़ता।
theological_decisions:
- issue: पुनरुत्थान की क्रियावाच्यता
  choice: वह जी उठेगा
  alternative: उसे जिलाया जाएगा
  rationale: यूनानी रूप भविष्यकालीन मध्यवाच्य है, कर्मवाच्य नहीं। इसलिए मुख्य पाठ में ‘वह जी उठेगा’ स्रोत के अधिक निकट है। ‘उसे जिलाया जाएगा’ नए नियम के अन्य स्थलों के अनुरूप धर्मवैज्ञानिक रूप से संभव है, पर यहाँ वह कर्ता की ओर ऐसा संकेत जोड़ता है जो इस क्रियारूप में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोड़े लगाकर’ तथा ‘मार डालेंगे’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘जी उठेगा’ प्रचलित बाइबलीय अभिव्यक्ति है और यहाँ के यूनानी मध्यवाच्य रूप को स्वाभाविक हिन्दी में व्यक्त करती है।
