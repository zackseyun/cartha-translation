lexical_decisions:
- source_word: νηστεύω
  choice: मैं ... उपवास करता हूँ
  rationale: वर्तमानकाल यहाँ नियमित आदत बताता है; हिन्दी में सामान्य वर्तमान इसका स्वाभाविक रूप है।
- source_word: δὶς τοῦ σαββάτου
  choice: सप्ताह में दो बार
  rationale: शाब्दिक रूप से ‘सब्त का दो बार’ जैसा वाक्यांश यूनानी मुहावरे में साप्ताहिक आवृत्ति बताता है; हिन्दी में ‘सप्ताह में दो बार’ स्पष्ट और स्वाभाविक है।
- source_word: ἀποδεκατῶ
  choice: दसवाँ अंश देता हूँ
  rationale: क्रिया का अर्थ किसी वस्तु का दसवाँ भाग देना है। यह रूप आधुनिक सामान्य हिन्दी में ‘दशमांश देता हूँ’ की अपेक्षा अधिक तुरंत समझ आता है।
- source_word: πάντα ὅσα
  choice: जो कुछ
  rationale: यह समग्रता और सम्बन्धवाचक भाव दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: κτῶμαι
  choice: प्राप्त करता हूँ
  rationale: मध्यवाच्य क्रिया यहाँ अपने लिए पाने या अर्जित करने का भाव रखती है; ‘प्राप्त करता हूँ’ व्यापक है और केवल वेतन या व्यापारिक कमाई तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: τοῦ σαββάτου का आशय
  choice: 'मुहावरेदार काल-सूचक अर्थ: ‘सप्ताह में’'
  alternative: 'अधिक शाब्दिक: ‘सब्त का’'
  rationale: यह कथन सब्त के दिन उपवास करने के विषय में धर्मवैचारिक दावा नहीं, बल्कि उपवास की आवृत्ति बताता है। मुहावरेदार अनुवाद सम्भावित भ्रम से बचाता है।
- issue: ἀποδεκατῶ का हिन्दी रूप
  choice: ‘दसवाँ अंश देता हूँ’
  alternative: ‘दशमांश देता हूँ’
  rationale: दोनों अर्थतः सम्भव हैं; चुना गया रूप सामान्य पाठक के लिए अधिक पारदर्शी है और किसी विशिष्ट कलीसियाई शब्दावली पर निर्भर नहीं करता।
