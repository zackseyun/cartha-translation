id: LUK.18.16
reference: Luke 18:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: hi
  text: पर यीशु ने उन्हें अपने पास बुलाकर कहा, “बच्चों को मेरे पास आने दो और उन्हें मत रोको, क्योंकि परमेश्वर का राज्य ऐसों ही का है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: उन्हें अपने पास बुलाकर
  rationale: मध्यवाच्य क्रिया में अपने निकट बुलाने का भाव है; यह हिन्दी में स्वाभाविक रूप से व्यक्त होता है और αὐτά के सर्वनामिक प्रवाह को बनाए रखता है।
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: बच्चों को मेरे पास आने दो
  rationale: ἄφετε यहाँ अनुमति देने के अर्थ में है; हिन्दी की यह रचना आज्ञा की सीधाई और गति की दिशा दोनों को स्पष्ट रखती है।
- source_word: μὴ κωλύετε αὐτά
  choice: उन्हें मत रोको
  rationale: κωλύω का अर्थ रोकना, बाधा देना या मना करना हो सकता है। प्रसंग में ‘मत रोको’ संक्षिप्त, स्वाभाविक और पर्याप्त व्यापक है।
- source_word: τῶν ... τοιούτων
  choice: ऐसों ही का
  rationale: यह अभिव्यक्ति उपस्थित बच्चों से आगे उनके समान लोगों के एक वर्ग की ओर संकेत करती है, पर यह नहीं बताती कि समानता का ठीक कौन-सा गुण अभिप्रेत है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित और प्रत्यक्ष हिन्दी समतुल्य है, जो βασιλεία के राजकीय शासन/राज्य संबंधी अर्थ को खुला रखता है।
theological_decisions:
- issue: τῶν τοιούτων का दायरा
  choice: ‘ऐसों ही का’ द्वारा उपस्थित बच्चों के समान लोगों तक व्यापक संकेत
  alternative: केवल वहाँ उपस्थित वास्तविक बच्चों का उल्लेख
  rationale: τοιούτων सामान्यतः उन व्यक्तियों के वर्ग को सूचित करता है जिनका प्रतिनिधित्व सामने उपस्थित लोग करते हैं। अनुवाद यह तय नहीं करता कि बच्चों का कौन-सा गुण मुख्य है, इसलिए मूल की धर्मवैज्ञानिक खुलावट बनी रहती है।
- issue: ἐστίν के साथ संबंधसूचक संबंध
  choice: ‘परमेश्वर का राज्य ऐसों ही का है’
  alternative: ‘परमेश्वर का राज्य ऐसे लोगों का है/ऐसे लोगों से संबंधित है’
  rationale: हिन्दी की संबंधसूचक रचना यूनानी ‘ऐसों का है’ की संक्षिप्तता और ‘अधिकार/संबद्धता’ के बीच की अर्थगत व्यापकता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘बच्चों’ में अनावश्यक रूप से ‘छोटे’ नहीं जोड़ा गया। ‘ऐसों ही का’ कुछ साहित्यिक है, पर सामान्य पाठक के लिए बोधगम्य और मूल की प्रतिनिधिक व्यापकता को संक्षेप में सुरक्षित रखता है।
