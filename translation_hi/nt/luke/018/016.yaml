  verdict: approve
  source_fidelity: ‘उन्हें अपने पास बुलाकर कहा’ accurately conveys προσεκαλέσατο αὐτὰ λέγων, including the sense of summoning the children to Jesus. ‘बच्चों को मेरे पास आने दो’ and ‘उन्हें मत रोको’ faithfully render both imperatives. ‘परमेश्वर का राज्य ऐसों ही का है’ preserves the possessive/associative force of τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ without defining the quality represented by the children.
  naturalness: The Hindi is clear, idiomatic, and suitably dignified in modern standard Hindi. The sequence of pronoun followed by ‘बच्चों’ is natural and mirrors the source’s referential flow. ‘ऐसों ही का’ is slightly elevated but familiar biblical-register Hindi and readily understandable.
  terminology: ‘यीशु,’ ‘परमेश्वर,’ and ‘परमेश्वर का राज्य’ are appropriate and consistent theological terms. No unnecessary interpretive wording, such as specifying ‘childlike qualities,’ has been added.
