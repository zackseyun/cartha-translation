  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: hi
  text: वह उन्हें इस बारे में एक दृष्टांत सुना रहा था कि उनके लिए सदा प्रार्थना करते रहना और हिम्मत न हारना आवश्यक है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन्हें यह दिखाने के लिए एक दृष्टांत सुना रहा था कि उन्हें सदा प्रार्थना करनी चाहिए और निराश नहीं होना चाहिए।”
    reason: πρὸς τὸ δεῖν की उद्देश्यसूचक व्याख्या तथा ἐγκακεῖν के वैकल्पिक स्वाभाविक अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: Ἔλεγεν
  choice: सुनाया
  rationale: यूनानी अपूर्ण काल यहाँ पृष्ठभूमि या चल रही कथन-क्रिया दिखा सकता है; हिन्दी में इस एक दृष्टांत के परिचय के लिए सामान्य भूतकाल ‘सुनाया’ अधिक स्वाभाविक है, जबकि प्रसंगगत प्रवाह बना रहता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यह एक हल्का प्रसंग-संयोजक है। हिन्दी में यहाँ कोई स्पष्ट संयोजक जोड़ना अनावश्यक या अधिक क्रमसूचक हो सकता था।
- source_word: παραβολὴν
  choice: एक दृष्टांत
  rationale: सुसमाचारों में παραβολή के लिए यह मानक, स्वाभाविक और विधागत रूप से सटीक हिन्दी शब्द है।
- source_word: πρὸς τὸ δεῖν
  choice: इस विषय में ... आवश्यक है
  rationale: πρὸς τὸ के संदर्भ/उद्देश्य और δεῖν की आवश्यकता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल सुझाव बना देने के।
- source_word: πάντοτε προσεύχεσθαι
  choice: सदा प्रार्थना करते रहना
  rationale: ‘सदा’ πάντοτε का सीधा अर्थ देता है और ‘करते रहना’ प्रसंग में लगातार बने रहने की भावना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ ἐγκακεῖν
  choice: हिम्मत न हारना
  rationale: ἐγκακέω के निरुत्साहित होकर ढीले पड़ने या साहस खोने के भाव को सरल, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में निरंतरता की अनिवार्यता
  choice: ‘उनके लिए आवश्यक है’ द्वारा आवश्यकता और आग्रह दोनों बनाए रखे गए हैं।
  alternative: ‘उन्हें ... चाहिए’ या ‘उन्हें ... अवश्य करना है’
  rationale: δεῖν वास्तविक आवश्यकता व्यक्त करता है। चुना हुआ पाठ इस बल को बनाए रखता है, पर प्रार्थना के प्रभाव के विषय में कोई अतिरिक्त धर्मवैज्ञानिक प्रणाली नहीं जोड़ता।
- issue: ‘सदा’ प्रार्थना करने का आशय
  choice: ‘सदा प्रार्थना करते रहना’
  alternative: ‘हर समय प्रार्थना करना’
  rationale: पाठ निरंतर दृढ़ता पर बल देता है; अनुवाद यह तय नहीं करता कि इसका अर्थ बिना रुके मौखिक प्रार्थना करना है।
