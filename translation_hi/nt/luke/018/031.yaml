  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: hi
  text: फिर वह बारहों को अपने साथ लेकर उनसे बोला, “देखो, हम यरूशलेम की ओर ऊपर जा रहे हैं, और भविष्यद्वक्ताओं के द्वारा मनुष्य के पुत्र के विषय में लिखी हुई सारी बातें पूरी होंगी।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “भविष्यद्वक्ताओं के द्वारा मनुष्य के पुत्र के लिए लिखी हुई सारी बातें।” यूनानी में “मनुष्य के पुत्र” के लिए प्रयुक्त रूप का अर्थ अधिक शाब्दिक रूप से “के लिए” हो सकता है, पर इस प्रसंग में आशय सामान्यतः उसके विषय में लिखी बातों से समझा जाता है।
    reason: यूनानी सम्प्रदान कारक के अधिक शाब्दिक विकल्प को दर्ज करते हुए मुख्य पाठ में प्रसंगानुकूल संबंध स्पष्ट करना।
lexical_decisions:
- source_word: Παραλαβὼν
  choice: अपने साथ लेकर
  rationale: παραλαμβάνω का मूल भाव किसी को साथ लेना है। प्रसंग निजी शिक्षा का है, पर यूनानी में ‘अलग’ स्पष्ट नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τοὺς δώδεκα
  choice: बारहों
  rationale: यूनानी में केवल ‘बारह’ है; ‘शिष्यों’ जोड़ने के बजाय हिन्दी में पहचाने हुए समूह के लिए स्वाभाविक ‘बारहों’ रखा गया।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान खींचने वाला कथन-सूचक है; ‘देखो’ आधुनिक और गरिमापूर्ण हिन्दी में उसका बल बनाए रखता है।
- source_word: ἀναβαίνομεν
  choice: ऊपर जा रहे हैं
  rationale: क्रिया में गति के साथ चढ़ने/ऊपर जाने का अर्थ है; यरूशलेम की यात्रा के भौगोलिक और कथात्मक भाव को सुरक्षित रखा गया।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: τελεσθήσεται
  choice: पूरी होंगी
  rationale: भविष्यत् कर्मवाच्य यह बताता है कि लिखी हुई बातें अपनी सिद्धि या पूर्णता तक पहुँचेंगी; बहुवचन ‘बातें’ के साथ सहज हिन्दी रूप चुना गया।
- source_word: πάντα τὰ γεγραμμένα
  choice: लिखी गई सभी बातें
  rationale: πάντα की समग्रता और γεγραμμένα के लिखित, स्थायी स्वरूप—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया।
- source_word: διὰ τῶν προφητῶν
  choice: भविष्यद्वक्ताओं के द्वारा
  rationale: διά + संबंधकारक माध्यम या कर्तृत्व व्यक्त करता है; यह रूप भविष्यद्वक्ताओं के माध्यम से लिखे जाने का भाव बचाता है।
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र के लिए
  rationale: सम्प्रदान कारक का अपेक्षाकृत औपचारिक ‘के लिए’ अनुवाद रखा गया, ताकि ‘उसके विषय में’ अर्थ को मुख्य पाठ में निश्चित न कर दिया जाए। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου उपाधि का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ यूनानी संरचना और दानिय्येल-संबंधी अंतर्पाठीय प्रतिध्वनि को पहचानने योग्य पारंपरिक हिन्दी में सुरक्षित रखता है, बिना उपाधि को सामान्य मानव-संज्ञा में बदलने के।
- issue: τῷ υἱῷ τοῦ ἀνθρώπου में सम्प्रदान कारक का संबंध
  choice: मनुष्य के पुत्र के लिए
  alternative: मनुष्य के पुत्र के विषय में
  rationale: यूनानी सम्प्रदान कारक ‘के लिए/उस पर घटने के लिए’ और प्रसंगानुसार ‘के विषय में’ के बीच अर्थ-संबंध की गुंजाइश देता है। मुख्य पाठ अधिक रूप-सन्निकट विकल्प रखता है और सामान्य व्याख्यात्मक विकल्प को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘बारहों’, ‘देखो’ और ‘ऊपर जा रहे हैं’ सामान्य पाठकों के लिए स्वाभाविक हैं। मुख्य पाठ में यूनानी की अस्पष्टता को अनावश्यक रूप से हल नहीं किया गया; [a] का चिह्न उसी संबंधित वाक्य के अंत में रखा गया है।
