  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: hi
  text: तब पतरस ने कहा, “देखिए, हमने अपनी चीज़ें छोड़ दी हैं और आपका अनुसरण किया है।[क]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जो हमारा था।” यूनानी अभिव्यक्ति व्यापक है और यह ठीक-ठीक नहीं बताती कि पतरस और दूसरों ने क्या छोड़ा था; इसका अर्थ केवल संपत्ति तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: कहा
  rationale: सीधी कथात्मक शैली में λέγω के भूतकाल का स्वाभाविक हिन्दी रूप ‘कहा’ है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथन को पिछले प्रसंग से जोड़ते हुए हल्का संक्रमण दिखाता है; ‘तब’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: ἰδού ध्यान आकर्षित करने वाला उद्गार है। यीशु को संबोधित करते हुए ‘देखिए’ आधुनिक, आदरपूर्ण और स्वाभाविक है।
- source_word: ἡμεῖς
  choice: हम
  rationale: मूल में स्पष्ट सर्वनाम बल देता है; हिन्दी में ‘हम’ और उसके बाद आने वाला कथन यह बल पर्याप्त रूप से व्यक्त करते हैं।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: अओरिस्ट कृदंत को मुख्य क्रिया के साथ स्वाभाविक हिन्दी क्रम में ‘छोड़कर ... हो लिए हैं’ कहा गया है; यह ‘त्याग देना’ जैसी अधिक प्रबल व्याख्या से बचता है।
- source_word: τὰ ἴδια
  choice: अपना सब कुछ
  rationale: यह यूनानी अभिव्यक्ति व्यक्ति की अपनी वस्तुओं या अपने से संबंधित बातों के लिए व्यापक है। ‘अपना सब कुछ’ हिन्दी में स्वाभाविक रहते हुए उसके व्यापक दायरे को बनाए रखता है और उसे केवल संपत्ति या घर तक सीमित नहीं करता।
- source_word: ἠκολουθήσαμέν σοι
  choice: आपके पीछे हो लिए हैं
  rationale: ἀκολουθέω शिष्य के रूप में पीछे चलने का मानक क्रियापद है। ‘आपके पीछे हो लिए हैं’ वास्तविक अनुसरण और शिष्यत्व—दोनों की छाया को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: τὰ ἴδια का दायरा
  choice: अपना सब कुछ
  alternative: अपनी सारी संपत्ति / अपना घर-बार
  rationale: मूल अभिव्यक्ति यह स्पष्ट नहीं करती कि छोड़ी गई चीजें केवल संपत्ति, घर, परिवार या इन सबका कोई व्यापक समूह थीं। इसलिए अनुवाद उसे किसी एक श्रेणी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; यीशु के लिए आदरसूचक ‘आप’ और पतरस के सीधे कथन में सहज, गरिमापूर्ण बोलचाल। ध्यानसूचक Ἰδοὺ को ‘देखिए’ से व्यक्त किया गया है।
