  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: hi
  text: फिर भी बुद्धि अपने सभी बच्चों के द्वारा सही ठहराई गई[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायसंगत ठहराई गई’ अथवा ‘सही सिद्ध हुई’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘बच्चे’ उन लोगों के लिए एक रूपक है जो अपनी प्रतिक्रिया या जीवन-शैली से बुद्धि की सच्चाई प्रकट करते हैं।
    reason: lexical_alternative
  - marker: c
    text: मत्ती 11:19 में है, ‘बुद्धि अपने कामों के द्वारा सही ठहराई गई।’
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: फिर भी
  rationale: पूर्ववर्ती प्रसंग में इस पीढ़ी की असंगत प्रतिक्रिया के विपरीत हल्का विरोध प्रकट होता है; इसलिए सामान्य अर्थ ‘और’ के बजाय ‘फिर भी’ स्वाभाविक है।
- source_word: ἐδικαιώθη
  choice: सही ठहराई गई
  rationale: यहाँ अर्थ पौलुस के पत्रों वाले न्यायालय-संबंधी धर्मी ठहराए जाने का नहीं, बल्कि किसी को सही सिद्ध या स्वीकार किए जाने का है। यह चयन यूनानी कर्मवाच्य को भी बनाए रखता है।
- source_word: ἡ σοφία
  choice: बुद्धि
  rationale: σοφία का मानक और स्वाभाविक हिन्दी रूप ‘बुद्धि’ है; वाक्य में इसका मानवीकरण किया गया है।
- source_word: ἀπὸ πάντων
  choice: अपने सभी ... के द्वारा
  rationale: कर्मवाच्य क्रिया के साथ ἀπό यहाँ माध्यम अथवा कर्तृत्व का बोध करा सकता है; हिन्दी में ‘के द्वारा’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν τέκνων αὐτῆς
  choice: अपने सभी बच्चों
  rationale: τέκνων का सीधा अर्थ ‘बच्चे’ है। ‘अपने’ से σοφία के साथ αὐτῆς का संबंध स्वाभाविक हिन्दी में व्यक्त होता है और बुद्धि के मानवीकरण को बनाए रखा जाता है।
theological_decisions:
- issue: ‘बुद्धि के बच्चों’ का अर्थ
  choice: मुख्य पाठ में रूपक को अक्षुण्ण रखते हुए ‘बच्चों’ का शाब्दिक अनुवाद
  alternative: बुद्धि के परिणाम/फल; अथवा मत्ती 11:19 के समान ‘काम’
  rationale: लूका के यूनानी पाठ में τέκνων (‘बच्चों’) है। इसे व्याख्यात्मक रूप से ‘फल’, ‘अनुयायी’ या ‘काम’ बना देना मूल रूपक और उसकी धर्मवैचारिक अर्थ-बहुलता को समय से पहले सीमित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध अभिव्यक्ति। ‘फिर भी’ प्रसंगगत विरोध को व्यक्त करता है; ‘सही ठहराई गई’ कर्मवाच्य और सार्वजनिक पुष्टि—दोनों भावों को सुरक्षित रखता है।
