base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: hi
  text: जब यीशु लोगों के सुनते हुए अपनी सारी बातें कह चुके, तब उन्होंने कफरनहूम में प्रवेश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: जब ... चुके, तब
  rationale: यहाँ संयोजक कारण नहीं, बल्कि मुख्य क्रिया से पहले पूरी हुई घटना का समय बताता है; यह हिन्दी संरचना कथानक का क्रम स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ
  choice: अपनी सारी बातें सुना चुके
  rationale: शाब्दिक अर्थ ‘अपने सभी वचन पूरे किए’ है, पर इस प्रसंग में πληρόω बोलना समाप्त करने का भाव देता है। ‘बातें सुना चुके’ कथन की पूर्णता और श्रोताओं तक उसके पहुँचने—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: लोगों को ... सुना
  rationale: यूनानी मुहावरे का शाब्दिक रूप ‘लोगों के कानों में’ है। हिन्दी में ‘लोगों को सुना’ वही सार्वजनिक श्रवण का आशय स्वाभाविक ढंग से देता है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: λαοῦ
  choice: लोगों
  rationale: λαός सामूहिक रूप से लोगों को दर्शाता है। ‘भीड़’ कहना इस स्थल की सामाजिक स्थिति को अनावश्यक रूप से अधिक निश्चित कर देता।
- source_word: εἰσῆλθεν εἰς Καφαρναούμ
  choice: कफरनहूम में गए
  rationale: अर्थतः ‘कफरनहूम में प्रवेश किया।’ आधुनिक हिन्दी में नगर के संदर्भ में ‘में गए’ अधिक स्वाभाविक है, जबकि प्रवेश का दिशात्मक भाव बना रहता है।
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित और पाठकों के लिए परिचित स्थान-नाम है।
theological_decisions:
- issue: कर्ता का स्पष्ट उल्लेख
  choice: यीशु
  alternative: वे
  rationale: यूनानी में कर्ता क्रिया में निहित है और पूर्व प्रसंग से यीशु स्पष्ट हैं। पद को स्वतंत्र रूप से समझने योग्य बनाने के लिए नाम जोड़ा गया है; इससे अर्थगत या धर्मवैज्ञानिक विस्तार नहीं होता।
- issue: सम्मानसूचक वचन
  choice: सुना चुके ... गए
  alternative: सुना चुका ... गया
  rationale: आधुनिक मानक हिन्दी में यीशु के लिए सम्मानसूचक बहुवचन स्वाभाविक और गरिमापूर्ण है; यह मूल पाठ में व्यक्तियों की संख्या नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बातें सुना चुके’ बोली समाप्त करने के यूनानी मुहावरे को साधारण पाठक के लिए स्पष्ट करता है। सम्मानसूचक बहुवचन का प्रयोग किया गया है।
