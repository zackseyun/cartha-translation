id: LUK.7.12
reference: Luke 7:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: hi
  text: जब वह नगर के फाटक के पास पहुँचा, तो देखो, एक मरे हुए व्यक्ति को बाहर ले जाया जा रहा था। वह अपनी माँ का इकलौता पुत्र[a] था, और वह विधवा थी। नगर की एक काफ़ी बड़ी भीड़ उसके साथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका एक ही पुत्र था।”
    reason: μονογενής के ‘एकमात्र संतान/पुत्र’ वाले अर्थ की स्वाभाविक वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: जब वह…के पास पहुँचा
  rationale: यह पदबंध निकट पहुँचने की घटना को समय-सूचक रूप में स्वाभाविक हिन्दी में व्यक्त करता है; δέ की हल्की कथात्मक संयोजकता वाक्य-प्रवाह में समाहित है।
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: नगर के फाटक के पास
  rationale: यह नगर के प्रवेश-द्वार का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: καὶ ἰδοὺ
  choice: तो देखो
  rationale: ἰδού अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘तो देखो’ आधुनिक हिन्दी में उसके कथात्मक बल को बनाए रखता है।
- source_word: ἐξεκομίζετο
  choice: बाहर ले जाया जा रहा था
  rationale: अपूर्ण भूतकालीन कर्मवाच्य उस समय जारी शवयात्रा की क्रिया को व्यक्त करता है।
- source_word: τεθνηκώς
  choice: एक मरे हुए व्यक्ति
  rationale: पूर्ण कृदंत उस व्यक्ति की मृत्यु के बाद की अवस्था बताता है; यह रूप अर्थ को सीधे और सम्मानपूर्ण ढंग से प्रकट करता है।
- source_word: μονογενὴς υἱός
  choice: इकलौता पुत्र
  rationale: इस पारिवारिक प्रसंग में μονογενής माँ के एकमात्र पुत्र को सूचित करता है; ‘इकलौता पुत्र’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: और वह विधवा थी
  rationale: स्त्रीलिंग सर्वनाम पर मूल भाषा के बल को बनाए रखते हुए माँ की असहाय परिस्थिति स्पष्ट की गई है।
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: नगर की एक काफ़ी बड़ी भीड़
  rationale: ἱκανός यहाँ संख्या की पर्याप्तता या उल्लेखनीय आकार बताता है; ‘काफ़ी बड़ी’ बिना अतिशयोक्ति के यह भाव देता है।
- source_word: ἦν σὺν αὐτῇ
  choice: उसके साथ थी
  rationale: σύν संगति अथवा साथ चलने को बताता है; शवयात्रा का प्रसंग साथ चलने का आशय स्पष्ट कर देता है।
theological_decisions:
- issue: गैर-मसीही प्रसंग में μονογενής का अनुवाद
  choice: इकलौता पुत्र
  alternative: एकमात्र पुत्र / उसका एक ही पुत्र
  rationale: यहाँ शब्द विधवा के पुत्र की पारिवारिक विशिष्टता बताता है, न कि यूहन्ना के लेखन में मिलने वाला कोई विशेष मसीह-संबंधी प्रयोग। इसलिए सामान्य प्रासंगिक अर्थ चुना गया और वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तो देखो’ मूल के ध्यानाकर्षक कथात्मक संकेत को बचाता है, जबकि छोटे वाक्य शोकपूर्ण दृश्य को स्पष्ट करते हैं।
