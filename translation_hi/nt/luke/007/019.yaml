language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: hi
  text: उसने प्रभु के पास यह संदेश भेजा, “क्या आप ही आने वाले[a] हैं, या हम किसी और की प्रतीक्षा करें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो आने वाला है।” यूनानी अभिव्यक्ति को अधिक वर्णनात्मक रूप में भी समझा जा सकता है, पर यहाँ संभवतः यह मसीह की पदवी के रूप में प्रयुक्त हुई है।
    reason: ὁ ἐρχόμενος के पदवी-सदृश और वर्णनात्मक, दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔπεμψεν
  choice: उसने ... भेजा
  rationale: यूनानी क्रिया भूतकाल की सीधी कथात्मक क्रिया है। मूल में भेजे गए व्यक्तियों का उल्लेख इस पद में निहित है; हिन्दी में भी संदर्भ के आधार पर कर्म को अनकहा रखा गया है।
- source_word: πρὸς τὸν κύριον
  choice: प्रभु के पास
  rationale: πρός के दिशासूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। κύριος के सम्मानसूचक और मसीह-संबंधी भार को बनाए रखने के लिए ‘प्रभु’ चुना गया है।
- source_word: λέγων
  choice: यह पूछने
  rationale: कृदंत सीधे प्रश्न की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘यह पूछने भेजा’ प्रसंगानुकूल और स्वाभाविक है तथा संदेश देने के उद्देश्य को स्पष्ट करता है।
- source_word: ὁ ἐρχόμενος
  choice: आनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त सविभक्त वर्तमान कृदंत को संक्षिप्त रूप में रखा गया है। संदर्भ में यह अपेक्षित मसीही व्यक्ति की पदवी की तरह काम करता है, पर वर्णनात्मक अर्थ भी बना रहता है।
- source_word: ἄλλον
  choice: किसी और
  rationale: व्यक्ति के लिए हिन्दी में ‘किसी और’ केवल ‘दूसरे’ की अपेक्षा अधिक स्वाभाविक है और यूनानी के वैकल्पिक व्यक्ति के भाव को ठीक व्यक्त करता है।
- source_word: προσδοκῶμεν
  choice: हम ... प्रतीक्षा करें
  rationale: विचार-विमर्श वाले प्रश्न में यह रूप जारी अपेक्षा और प्रतीक्षा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ यूनानी पदवी के सम्मानसूचक और मसीह-संबंधी दोनों आयाम बनाए रखता है; ‘स्वामी’ यहाँ उसके अर्थ-भार को कुछ कम कर सकता है।
- issue: ὁ ἐρχόμενος पदवी है या सामान्य वर्णन
  choice: आनेवाला
  alternative: वह जो आनेवाला है
  rationale: ‘आनेवाला’ अपेक्षित मसीही व्यक्ति की पदवी-सदृश शक्ति को बनाए रखता है, फिर भी यूनानी कृदंत के वर्णनात्मक अर्थ को समाप्त नहीं करता। पादटिप्पणी वैकल्पिक, अधिक खुला रूप देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और आदरपूर्ण रखी गई है। ‘क्या आनेवाला आप ही हैं’ हिन्दी में पदवी-सदृश अभिव्यक्ति को स्वाभाविक ढंग से सामने लाता है; ‘प्रतीक्षा करें’ सामान्य पाठकों के लिए स्पष्ट है।
