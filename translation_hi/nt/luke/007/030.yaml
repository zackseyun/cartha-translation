source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: hi
  text: परन्तु फरीसियों और व्यवस्था के विशेषज्ञों ने, उससे बपतिस्मा न लेकर, अपने लिए परमेश्वर की योजना को ठुकरा दिया[a]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ही विरुद्ध परमेश्वर की सम्मति” अथवा “अपने विषय में परमेश्वर की योजना।”
    reason: alternative_reading
  - marker: b
    text: अर्थात् यूहन्ना बपतिस्मा देनेवाले से।
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: व्यवस्था के विशेषज्ञ
  rationale: यह शब्द मूसा की व्यवस्था के जानकारों को दर्शाता है। ‘व्यवस्था के विशेषज्ञ’ आधुनिक हिन्दी में स्पष्ट है और इसे भिन्न समूह ‘शास्त्रियों’ के साथ नहीं मिलाता।
- source_word: βουλὴν
  choice: योजना
  rationale: βουλή यहाँ उद्देश्य, योजना या सम्मति का अर्थ दे सकता है। ‘योजना’ स्वाभाविक हिन्दी में परमेश्वर के अभिप्राय को व्यक्त करती है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἠθέτησαν
  choice: ठुकरा दिया
  rationale: ἀθετέω के अस्वीकार करने या एक ओर कर देने के भाव को ‘ठुकरा दिया’ सीधी और सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς ἑαυτούς
  choice: अपने लिए
  rationale: यह वाक्यांश बताता है कि परमेश्वर की योजना व्यक्तिगत रूप से उन्हीं से संबंधित थी। ‘अपने लिए’ मुख्य अर्थ को स्पष्ट रखता है; ‘अपने विरुद्ध’ और ‘अपने विषय में’ पाद-टिप्पणी में दिए गए हैं।
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: उन्होंने उससे बपतिस्मा नहीं लिया था
  rationale: यह नकारात्मक कृदन्त को अलग उपवाक्य में स्वाभाविक हिन्दी देता है और उसे स्पष्ट रूप से कारणसूचक ‘क्योंकि’ बनाकर उसके संबंध को आवश्यकता से अधिक निर्धारित नहीं करता।
- source_word: αὐτοῦ
  choice: उससे
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया है; संदर्भ से इसका संकेत यूहन्ना बपतिस्मा देनेवाले की ओर है, जिसकी पहचान पाद-टिप्पणी स्पष्ट करती है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ पिछले पद में वर्णित लोगों की प्रतिक्रिया से विरोध प्रकट करता है; ‘परन्तु’ इस विरोध को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: फरीसियों और व्यवस्था के विशेषज्ञों के संबंध में परमेश्वर की βουλή का अर्थ
  choice: अपने लिए परमेश्वर की योजना
  alternative: अपने ही विरुद्ध परमेश्वर की सम्मति; अपने विषय में परमेश्वर की योजना
  rationale: मुख्य अनुवाद बताता है कि उन्होंने अपने संबंध में परमेश्वर के अभिप्राय को अस्वीकार किया, पर इससे परमेश्वर की इच्छा के विफल होने के विषय में कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं निकाला गया। सम्भव वैकल्पिक संबंधों को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ‘व्यवस्था के विशेषज्ञ’ तकनीकी अर्थ को स्पष्ट करता है; कृदन्त को कारणसूचक बनाए बिना स्वतंत्र उपवाक्य के रूप में रखा गया है।
