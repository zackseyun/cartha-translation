  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: hi
  text: और उस स्त्री की ओर मुड़कर उसने शमौन से कहा, “क्या तुम इस स्त्री को देखते हो? मैं तुम्हारे घर में आया; तुमने मेरे पाँवों के लिए पानी तक नहीं दिया[a], पर इसने अपने आँसुओं से मेरे पाँव भिगोए और अपने बालों से उन्हें पोंछा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तुमने मेरे पाँवों पर पानी नहीं दिया।” आशय पाँव धोने के लिए पानी उपलब्ध कराने की प्रथा से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: उस स्त्री की ओर मुड़कर
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में मुख्य कथन से पहले हुई शारीरिक क्रिया के रूप में व्यक्त करता है।
- source_word: τῷ Σίμωνι ἔφη
  choice: उसने शमौन से कहा
  rationale: ग्रीक के कथात्मक प्रयोग को सहज हिन्दी भूतकाल में रखता है और संबोधित व्यक्ति को स्पष्ट करता है।
- source_word: Βλέπεις ταύτην τὴν γυναῖκα
  choice: क्या तुम इस स्त्री को देखते हो?
  rationale: वर्तमानकालीन अलंकारिक प्रश्न और संकेतवाचक ‘इस’ दोनों को बनाए रखता है; ‘देखते हो’ मूल क्रिया के निकट है।
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: मैं तुम्हारे घर में आया
  rationale: हिन्दी में ‘घर में आया’ स्वाभाविक है और οἰκία का सामान्य अर्थ सुरक्षित रखता है।
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: तुमने मेरे पाँवों के लिए पानी तक नहीं दिया
  rationale: पानी देने के स्पष्ट कथन को बनाए रखते हुए ‘तक’ शमौन और स्त्री के व्यवहार के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; पैर धोने की क्रिया को मुख्य पाठ में जोड़कर मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: इसने अपने आँसुओं से मेरे पाँव भिगोए
  rationale: साधनवाचक दत्तिव को ‘अपने आँसुओं से’ और अओरिस्ट को पूर्ण भूतकालीन क्रिया के रूप में व्यक्त करता है।
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: अपने बालों से उन्हें पोंछा
  rationale: ἐκμάσσω के पोंछने के अर्थ को सहज रूप में देता है; ‘उन्हें’ का संकेत पाँवों की ओर स्पष्ट है।
