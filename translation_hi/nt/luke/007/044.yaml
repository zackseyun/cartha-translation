translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘शमौन’ पारंपरिक हिन्दी बाइबलीय नामरूप है। आदरसूचक ‘आप’ के बजाय ‘तुम’ रखा गया है, क्योंकि संबोधन में औपचारिक बहुवचन का कोई स्पष्ट संकेत नहीं है और यह रूप सामान्य आधुनिक हिन्दी में सीधा किंतु अशिष्ट नहीं है।
