source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: hi
  text: और वह उनके पीछे, उनके पैरों के पास खड़ी होकर रोती हुई, अपने आँसुओं से उनके पैर भिगोने लगी। फिर वह अपने सिर के बालों से उन्हें पोंछती रही, उनके पैरों को बार-बार चूमती रही और उन पर सुगंधित तेल लगाती रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στᾶσα
  choice: खड़ी होकर
  rationale: एओरिस्ट कृदंत दृश्य की पृष्ठभूमि बनाता है; ‘खड़ी होकर’ स्वाभाविक हिन्दी में इस सहायक क्रिया-भाव को बनाए रखता है।
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: पीछे, उनके पैरों के पास
  rationale: ὀπίσω का ‘पीछे’ और παρά के स्थानवाचक अर्थ का ‘पैरों के पास’ दोनों सुरक्षित हैं; भोज में यीशु के टिककर बैठने की मुद्रा से भी यह मेल खाता है।
- source_word: κλαίουσα
  choice: रोने लगी
  rationale: कृदंत निरंतर रोने को दर्शाता है। अगले मुख्य क्रियापद ‘शुरू किए’ की पुनरावृत्ति से बचते हुए हिन्दी में दृश्य का आरम्भ स्वाभाविक रूप से व्यक्त होता है।
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: अपने आँसुओं से उनके पैर भिगोने शुरू किए
  rationale: ἤρξατο क्रिया के आरम्भ को और βρέχειν पैरों को गीला करने को व्यक्त करता है; ‘भिगोने’ यहाँ स्पष्ट और सहज है, बिना ‘तर-बतर’ जैसी अतिशयोक्ति के।
- source_word: ἐξέμασσεν
  choice: पोंछती रही
  rationale: इम्परफेक्ट काल चलती हुई क्रिया को दर्शाता है; ‘पोंछती रही’ उसे सुरक्षित रखता है, जबकि ‘सुखा दिए’ परिणाम को अनावश्यक रूप से निश्चित कर देता।
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: अपने सिर के बालों से
  rationale: मूल का स्पष्ट ‘उसके सिर के बाल’ हिन्दी के स्वाभाविक आत्मवाचक रूप में पूरा रखा गया है।
- source_word: κατεφίλει
  choice: बार-बार चूमती
  rationale: संयुक्त क्रिया καταφιλέω और इम्परफेक्ट दोनों स्नेहपूर्ण अथवा पुनरावृत्त चूमने का संकेत दे सकते हैं; ‘बार-बार’ पुनरावृत्ति को स्पष्ट करता है, जबकि भावनात्मक तीव्रता को मुख्य पाठ में नहीं बढ़ाता।
- source_word: ἤλειφεν
  choice: लगाती रही
  rationale: इम्परफेक्ट की जारी क्रिया को ‘रही’ से व्यक्त किया गया है। आधुनिक हिन्दी में तेल के साथ ‘लगाना’ ‘अभिषेक करना’ से अधिक स्वाभाविक है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: τῷ μύρῳ
  choice: सुगंधित तेल
  rationale: μύρον सुगंधित तेल या मरहम को सूचित करता है; ‘सुगंधित तेल’ सामान्य पाठक के लिए स्पष्ट है और पदार्थ की प्राचीन प्रकृति को आधुनिक ‘इत्र’ की अपेक्षा बेहतर व्यक्त करता है।
theological_decisions:
- issue: यीशु के पैरों के प्रति स्त्री की शारीरिक और भावनात्मक क्रियाएँ
  choice: आँसुओं से भिगोना, बालों से पोंछना, बार-बार चूमना और सुगंधित तेल लगाना—सभी ठोस क्रियाएँ स्पष्ट रखी गईं।
  alternative: इनका सार ‘भक्ति प्रकट की’ जैसे व्याख्यात्मक वाक्य में देना, या चूमने की पुनरावृत्ति को कम करना।
  rationale: यूनानी पाठ इन क्रियाओं को सजीव और भावपूर्ण रूप में प्रस्तुत करता है, पर उनके लिए कोई स्पष्ट धार्मिक व्याख्या नहीं जोड़ता; इसलिए अनुवाद न तो उन्हें नरम करता है, न किसी संप्रदायगत अर्थ से विस्तार देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। आदरसूचक बहुवचन ‘उनके’ यीशु के लिए स्वाभाविक हिन्दी प्रयोग है। चलती हुई क्रियाओं को ‘पोंछती रही’ और ‘लगाती रही’ से व्यक्त किया गया है।
