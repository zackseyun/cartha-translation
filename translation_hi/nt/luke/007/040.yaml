  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: hi
  text: और यीशु ने उसे उत्तर में कहा, “शमौन, मुझे तुमसे कुछ कहना है।” शमौन ने कहा, “गुरु, कहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν
  choice: तब यीशु ने उत्तर देते हुए ... कहा
  rationale: ἀποκριθείς के उत्तर देने के भाव को बनाए रखते हुए εἶπεν के साथ आए यूनानी कथात्मक विन्यास को स्वाभाविक हिन्दी में प्रस्तुत किया गया है। ‘तब’ प्रसंग में प्रतिक्रिया का संकेत देता है।
- source_word: εἶπεν πρὸς αὐτόν
  choice: उससे कहा
  rationale: πρός के साथ आए संबोधन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Σίμων
  choice: शमौन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἔχω σοί τι εἰπεῖν
  choice: मुझे तुमसे कुछ कहना है
  rationale: यूनानी मुहावरे और σοί के स्पष्ट व्यक्तिगत संदर्भ को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: διδάσκαλος का अर्थ शिक्षक या गुरु है; प्रत्यक्ष संबोधन में ‘गुरु’ स्वाभाविक, सम्मानपूर्ण और संक्षिप्त हिन्दी है, बिना ‘स्वामी’ का अधिक प्रबल अधिकार-बोध जोड़े।
- source_word: εἰπέ
  choice: कहिए
  rationale: आज्ञार्थक क्रिया को सम्मानसूचक हिन्दी में प्रस्तुत करता है। प्रसंग से कही जाने वाली बात स्पष्ट है, इसलिए अलग से ‘इसे’ जोड़ना आवश्यक नहीं।
- source_word: φησίν
  choice: उसने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में यीशु के प्रति सम्मानसूचक ‘कहिए’ और यीशु द्वारा शमौन के लिए प्रसंगानुकूल ‘तुमसे’ रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
