  choice: कर्ज़ माफ किया
  alternative: अधिक क्षमा किया; अधिक कर्ज़ रद्द किया
  rationale: तात्कालिक संदर्भ ऋण का है, जबकि आगे का प्रसंग पापों की क्षमा से इसे जोड़ता है। ‘कर्ज़ माफ किया’ दोनों स्तरों की कड़ी को बनाए रखता है और किसी अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘कर्ज़’ आम पाठक के लिए ‘ऋण’ से अधिक स्वाभाविक है; वाक्य में शमौन की हिचक और यीशु की संक्षिप्त पुष्टि दोनों सुरक्षित रखी गई हैं।
