  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: hi
  text: फरीसियों में से एक उससे आग्रह कर रहा था कि वह उसके साथ भोजन करे, और फरीसी के घर में प्रवेश करने के बाद वह भोजन के लिए टेक लगाकर लेट गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय औपचारिक भोजन में लोग मेज़ के पास सीधे बैठने के बजाय टेक लगाकर लेटते थे।
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: आग्रह कर रहा था
  rationale: अपूर्ण भूतकाल चल रही या बार-बार की जा रही विनती का संकेत दे सकता है। ‘आग्रह कर रहा था’ इस पक्ष को स्वाभाविक हिन्दी में रखता है और प्रसंग में निमंत्रण का भाव भी व्यक्त करता है।
- source_word: δέ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है। हिन्दी में ‘तब’ कथा को आगे बढ़ाता है, पर प्रबल विरोध नहीं दर्शाता।
- source_word: τις ... τῶν Φαρισαίων
  choice: फरीसियों में से एक
  rationale: अंशवाचक संबंध का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: कि वह उसके साथ भोजन करे
  rationale: ἵνα तथा संभावनार्थक क्रिया उद्देश्य या आग्रह की विषयवस्तु बताते हैं; यह रूप यूनानी वाक्य-संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: वह फरीसी के घर में गया
  rationale: पूर्वकालिक कृदन्त मुख्य क्रिया से पहले घर में प्रवेश को दर्शाता है। हिन्दी में क्रम से रखी गई क्रियाएँ इस संबंध को स्वाभाविक रूप से प्रकट करती हैं।
- source_word: κατεκλίθη
  choice: भोजन करने के लिए लेट गया
  rationale: यह क्रिया औपचारिक भोजन के समय प्रचलित टेक लगाकर लेटने की मुद्रा को दर्शाती है। ‘बैठ गया’ ऐतिहासिक मुद्रा खो देता, जबकि केवल ‘लेट गया’ भोजन का प्रसंग अस्पष्ट कर सकता था।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘फरीसी’ प्रचलित बाइबलीय समूह-नाम के रूप में रखा गया है। सर्वनामों की पुनरावृत्ति मूल की हल्की अस्पष्टता बनाए रखती है, यद्यपि प्रसंग से पहला ‘वह’ यीशु को और ‘उसके’ फरीसी को सूचित करता है।
