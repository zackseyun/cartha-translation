  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: hi
  text: तब उसने उस स्त्री से कहा, “तुम्हारे पाप क्षमा हो गए हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पाप क्षमा किए जा चुके हैं।” यूनानी पूर्णकाल कर्मवाच्य पूरी हो चुकी क्रिया और उसके बने हुए परिणाम पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: उसने...कहा
  rationale: λέγω के अओरिस्ट का स्वाभाविक हिन्दी रूप ‘कहा’ है; कर्ता प्रसंग से यीशु है, इसलिए मूल के सर्वनाम-सदृश निहित कर्ता को ‘उसने’ से रखा गया है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है जो घटना को आगे बढ़ाता है; ‘तब’ बिना अनावश्यक विरोध जोड़े स्वाभाविक हिन्दी प्रवाह देता है।
- source_word: αὐτῇ
  choice: उस स्त्री से
  rationale: दत्तिव सर्वनाम का अर्थ ‘उससे’ है; हिन्दी में अस्पष्टता घटाने और प्रसंगगत स्त्री-संबोधन स्पष्ट रखने के लिए ‘उस स्त्री से’ स्वाभाविक है।
- source_word: Ἀφέωνταί
  choice: क्षमा हो गए हैं
  rationale: ἀφίημι का पूर्णकाल कर्मवाच्य एक पूरी हुई क्रिया और उसके बने हुए वर्तमान परिणाम—दोनों को व्यक्त करता है। ‘क्षमा हो गए हैं’ हिन्दी में इस पूर्णकालिक बल को सहज रूप से रखता है।
- source_word: σου
  choice: तुम्हारे
  rationale: द्वितीय पुरुष एकवचन संबंधकारक को पापों के साथ स्वाभाविक हिन्दी संबंधसूचक रूप ‘तुम्हारे’ में व्यक्त किया गया है।
- source_word: αἱ ἁμαρτίαι
  choice: पाप
  rationale: ἁμαρτίαι का अर्थ परमेश्वर के सामने नैतिक अपराधों के रूप में ‘पाप’ है। हिन्दी में ‘तुम्हारे’ के साथ अलग निश्चिततासूचक की आवश्यकता नहीं है।
theological_decisions:
- issue: क्षमा की घोषणा में पूर्णकाल कर्मवाच्य Ἀφέωνταί का बल
  choice: “तुम्हारे पाप क्षमा हो गए हैं” के रूप में पूरी हुई क्षमा और उसके वर्तमान परिणाम को व्यक्त करना।
  alternative: “तुम्हारे पाप क्षमा किए जाते हैं” या “तुम्हारे पाप क्षमा हैं।”
  rationale: यूनानी पूर्णकाल कर्मवाच्य पूरी हुई क्रिया के टिके हुए परिणाम पर बल दे सकता है। चुना हुआ हिन्दी रूप क्षमा के कर्ता को, जो यूनानी कर्मवाच्य में अनकहा है, जोड़े बिना इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उस स्त्री’ प्रसंगगत संदर्भ को स्पष्ट करता है; प्रत्यक्ष वचन में ‘तुम्हारे’ सामान्य आधुनिक संबोधन है।
