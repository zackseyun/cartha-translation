base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: hi
  text: और उसने उस स्त्री से कहा, “तुम्हारे विश्वास ने तुम्हें बचाया है[a]; शान्ति के साथ जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चंगा किया है।” यूनानी क्रिया का अर्थ “बचाना,” “छुड़ाना” या “चंगा करना” हो सकता है; पर यहाँ संदर्भ क्षमा और उद्धार पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: और उसने ... कहा
  rationale: δέ यहाँ कथा को आगे बढ़ाता है; हिन्दी में ‘और’ इसके हल्के संयोजक बल को स्वाभाविक रूप से व्यक्त करता है। εἶπεν के लिए ‘कहा’ सीधा और उपयुक्त है।
- source_word: πρὸς τὴν γυναῖκα
  choice: उस स्त्री से
  rationale: संदर्भ में γυνή उस दृश्य की पहले से उल्लिखित स्त्री को बताता है; हिन्दी में बोलने के क्रियापद के साथ ‘से’ स्वाभाविक है।
- source_word: Ἡ πίστις σου
  choice: तुम्हारे विश्वास
  rationale: πίστις यहाँ यीशु पर उस स्त्री के भरोसेपूर्ण प्रत्युत्तर को दर्शाता है। ‘विश्वास’ प्रचलित, स्पष्ट और धर्मवैज्ञानिक भार को बनाए रखने वाला शब्द है।
- source_word: σέσωκέν σε
  choice: ने तुम्हें बचाया है
  rationale: σῴζω का पूर्णकाल पूरा हो चुके कार्य और उसके वर्तमान परिणाम को व्यक्त करता है। क्षमा-केंद्रित संदर्भ में ‘बचाया है’ सबसे उपयुक्त है, जबकि क्रिया का ‘चंगा किया है’ अर्थ भी अन्य संदर्भों में सम्भव है।
- source_word: πορεύου εἰς εἰρήνην
  choice: शान्ति के साथ जाओ
  rationale: यह प्रस्थान का सामी-प्रभावित यूनानी मुहावरा है। ‘शान्ति के साथ जाओ’ प्राकृतिक हिन्दी में साथ बनी रहने वाली शान्ति का भाव व्यक्त करता है, बिना εἰς को अस्वाभाविक रूप से ‘में/की ओर’ कहे।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: 'भरोसा; यहाँ कम सम्भावित: विश्वासयोग्यता'
  rationale: संदर्भ उस स्त्री की यीशु के प्रति भरोसेपूर्ण प्रतिक्रिया पर बल देता है। ‘विश्वास’ मूल शब्द की व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: क्षमा और उद्धार के संदर्भ में σῴζω का अर्थ
  choice: बचाया है
  alternative: चंगा किया है; स्वस्थ किया है
  rationale: लूका 7:36–50 का निकट संदर्भ पापों की क्षमा और विश्वास पर केंद्रित है, किसी शारीरिक रोगमुक्ति पर नहीं। फिर भी यूनानी क्रिया की उपचार-संबंधी अर्थ-सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक पाठ। ‘शान्ति’ पारंपरिक किन्तु आज भी स्पष्ट बाइबलीय शब्दावली है। मुख्य पाठ में केवल वही पादटिप्पणी-चिह्न रखा गया है जिसकी पादटिप्पणी दी गई है।
