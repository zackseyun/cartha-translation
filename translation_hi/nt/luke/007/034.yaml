id: LUK.7.34
reference: Luke 7:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: hi
  text: मनुष्य का पुत्र खाता-पीता आया है, और तुम कहते हो, ‘देखो, यह आदमी पेटू और पियक्कड़[a] है—चुंगी लेनेवालों और पापियों का मित्र!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मदिरा पीनेवाला।”
    reason: οἰνοπότης का अधिक रूपात्मक रूप से निकट विकल्प देना, जबकि मुख्य पाठ में आरोप का निन्दात्मक भाव ‘पियक्कड़’ से व्यक्त किया गया है।
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: आया है
  rationale: यूनानी पूर्णकाल उसके आने और अब उपस्थित होने की स्थिति को व्यक्त करता है; हिन्दी का ‘आया है’ इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है; यह अभिव्यक्ति उसके संभावित दानिय्येली संकेत और मसीही अर्थ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
- source_word: ἐσθίων καὶ πίνων
  choice: खाता-पीता
  rationale: वर्तमान कृदन्त उसके आने के ढंग को बताते हैं। संयुक्त हिन्दी अभिव्यक्ति संक्षिप्त, स्वाभाविक और मूल के समानांतर है।
- source_word: λέγετε
  choice: तुम कहते हो
  rationale: वर्तमानकालीन प्रत्यक्ष संबोधन का सहज और सटीक हिन्दी रूप।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: विस्मय और ध्यान खींचने की शक्ति को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: यह आदमी
  rationale: मूल में संज्ञा स्पष्ट रूप से उपस्थित है। ‘यह’ हिन्दी में ‘देखो’ के साथ आरोपात्मक संकेत को स्वाभाविक बनाता है।
- source_word: φάγος
  choice: पेटू
  rationale: यह अतिभोजन करनेवाले व्यक्ति के लिए तीखा और प्रचलित अपमानसूचक शब्द है।
- source_word: οἰνοπότης
  choice: पियक्कड़
  rationale: आरोप की निन्दात्मक तीव्रता को सहज आधुनिक हिन्दी में बनाए रखता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: φίλος
  choice: मित्र
  rationale: सीधा और गरिमापूर्ण रूप, जो आरोप की सामाजिक धार को सुरक्षित रखता है।
- source_word: τελωνῶν
  choice: चुंगी लेनेवालों
  rationale: रोमी व्यवस्था में कर/महसूल वसूलनेवाले वर्ग के लिए बाइबलीय हिन्दी में परिचित और ऐतिहासिक रूप से उपयुक्त अभिव्यक्ति।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: विरोधियों द्वारा प्रयुक्त सामाजिक-धार्मिक पदनाम का सीधा अनुवाद।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου पदवी का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मानव
  rationale: परंपरागत और स्रोत-संगत पदवी मसीही तथा संभावित दानिय्येली प्रतिध्वनि को बनाए रखती है; अधिक गतिशील रूप उसके पदवीगत स्वरूप को धुँधला कर सकते हैं।
- issue: यीशु के विरुद्ध आरोपों की तीव्रता
  choice: पेटू और पियक्कड़
  alternative: बहुत खानेवाला और मदिरा पीनेवाला
  rationale: यह कथन विरोधियों की निन्दा को उद्धृत करता है, कथावाचक का नैतिक निर्णय नहीं। चुने हुए शब्द मूल आरोप की तीखी और अपमानसूचक शक्ति बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज किन्तु गरिमापूर्ण है। प्रत्यक्ष उद्धरण में विरोधियों की व्यंग्यपूर्ण और निन्दात्मक भाषा को जानबूझकर नरम नहीं किया गया है।
