  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: hi
  text: और जो लोग उसके साथ भोजन पर बैठे थे, वे आपस में[a] कहने लगे, “यह कौन है, जो पाप भी क्षमा करता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने-अपने मन में।” यूनानी अभिव्यक्ति अतिथियों की आपसी बातचीत या उनके भीतर के विचार—दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: कहने लगे
  rationale: आरंभसूचक क्रिया की शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ συνανακείμενοι
  choice: जो लोग उसके साथ भोजन पर बैठे थे
  rationale: यह भोजन में साथ उपस्थित लोगों को दर्शाता है। प्राचीन काल में मेज़ पर टेक लगाकर भोजन करने की मुद्रा को शब्दशः रखने के बजाय हिन्दी में स्वाभाविक भोजन-संदर्भ दिया गया है।
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: आपस में[a] कहने
  rationale: बहुवचन कर्ता के संदर्भ में यह पारस्परिक बातचीत को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी भीतर-ही-भीतर कहने की सम्भावना सुरक्षित रखती है।
- source_word: Τίς οὗτός ἐστιν
  choice: यह कौन है
  rationale: मूल यूनानी की संक्षिप्त और तीखी प्रश्नात्मक अभिव्यक्ति को बिना ‘मनुष्य’ जोड़े सुरक्षित रखता है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καί आश्चर्य और सीमा-विस्तार का भाव देता है; हिन्दी में ‘पाप भी क्षमा करता है’ वही बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἁμαρτίας ἀφίησιν
  choice: पाप ... क्षमा करता है
  rationale: इस संदर्भ में ἀφίημι पापों की क्षमा के लिए प्रचलित धार्मिक अभिव्यक्ति है; हिन्दी में ‘क्षमा करना’ स्पष्ट और स्थापित समतुल्य है।
theological_decisions:
- issue: पाप क्षमा करने के यीशु के अधिकार का निहितार्थ
  choice: 'अतिथियों का प्रश्न बिना व्याख्यात्मक विस्तार के रखा गया: “यह कौन है, जो पाप भी क्षमा करता है?”'
  alternative: यह मनुष्य कौन है, जो पाप भी क्षमा करता है?
  rationale: पद आश्चर्य के माध्यम से मसीह-संबंधी प्रश्न उठाता है, पर स्वयं कोई व्याख्यात्मक निष्कर्ष नहीं देता। इसलिए अनुवाद धर्मवैज्ञानिक तनाव को बनाए रखता है और मूल में न होने वाला ‘मनुष्य’ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। ‘भोजन पर बैठे’ सांस्कृतिक परिस्थिति को स्वाभाविक हिन्दी में देता है, जबकि ‘आपस में’ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
