id: LUK.7.10
reference: Luke 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: hi
  text: और जब भेजे गए लोग घर लौटे, तो उन्होंने दास[a] को स्वस्थ पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुलाम”; इस यूनानी शब्द का अनुवाद प्रसंग के अनुसार “दास,” “गुलाम” या “सेवक” हो सकता है।
    reason: δοῦλος के सामाजिक अर्थ और हिन्दी में प्रचलित वैकल्पिक अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: जब ... लौटे
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले घटित समयसूचक कार्य बताता है; ‘जब ... लौटे’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὸν οἶκον
  choice: घर
  rationale: εἰς के साथ यह पद घर की ओर लौटने को बताता है; हिन्दी में ‘घर लौटे’ स्वाभाविक है और स्थान को अनावश्यक रूप से ‘घर के भीतर’ तक सीमित नहीं करता।
- source_word: οἱ πεμφθέντες
  choice: भेजे गए लोग
  rationale: यह रूप कर्मवाच्य को बनाए रखता है और ‘सन्देशवाहक’ जैसा ऐसा संज्ञात्मक अर्थ नहीं जोड़ता जो यूनानी पाठ में स्पष्ट रूप से नहीं है।
- source_word: εὗρον
  choice: उन्होंने ... पाया
  rationale: कथात्मक प्रसंग में εὑρίσκω का सीधा और स्वाभाविक हिन्दी रूप ‘पाया’ है।
- source_word: τὸν δοῦλον
  choice: दास
  rationale: δοῦλος यहाँ सूबेदार के अधिकार के अधीन बंधे व्यक्ति को सूचित करता है। ‘दास’ उसकी सामाजिक अधीनता को ‘सेवक’ से अधिक स्पष्ट रखता है, जबकि ‘गुलाम’ की तुलना में हिन्दी बाइबलीय गद्य में अधिक गरिमापूर्ण है।
- source_word: ὑγιαίνοντα
  choice: स्वस्थ
  rationale: ὑγιαίνω का अर्थ स्वस्थ या ठीक अवस्था में होना है। ‘स्वस्थ’ मूल पद के अवस्थासूचक अर्थ को रखता है और ‘चंगा किया हुआ’ कहकर परिणाम की व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: चंगाई के प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम
  rationale: पाठ व्यक्ति की अधीन और बंधी सामाजिक स्थिति को नहीं मिटाता, इसलिए ‘दास’ चुना गया। फिर भी हिन्दी में इसे परंपरागत रूप से ‘सेवक’ भी कहा जाता है; इस भाषिक विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण कथात्मक हिन्दी। ‘जब ... तो’ संरचना यूनानी कृदंत और मुख्य क्रिया का समयक्रम स्पष्ट करती है; ‘दास’ स्रोत की सामाजिक वास्तविकता को बनाए रखता है।
