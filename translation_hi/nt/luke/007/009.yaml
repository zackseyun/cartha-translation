reference: Luke 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: hi
  text: जब यीशु ने ये बातें सुनीं, तो उन्हें उस पर आश्चर्य हुआ। फिर उन्होंने मुड़कर अपने पीछे चल रही भीड़ से कहा, “मैं तुमसे कहता हूँ, इस्राएल में भी मैंने इतना विश्वास[a] नहीं पाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इतना भरोसा।” यहाँ प्रयुक्त यूनानी शब्द का अनुवाद प्रायः “विश्वास” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: जब यीशु ने ये बातें सुनीं
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; δέ को स्वाभाविक हिन्दी प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं, और ταῦτα का बहुवचन ‘ये बातें’ में सुरक्षित है।
- source_word: ἐθαύμασεν αὐτόν
  choice: उन्हें उस पर आश्चर्य हुआ
  rationale: θαυμάζω वास्तविक अचंभे या विस्मय को व्यक्त करता है। ‘आश्चर्य हुआ’ आधुनिक और गरिमापूर्ण हिन्दी है; αὐτόν का संकेत सूबेदार की ओर ‘उस पर’ से बना रहता है।
- source_word: στραφεὶς
  choice: फिर उन्होंने मुड़कर
  rationale: यह अओरिस्ट कृदंत अगली क्रिया से जुड़ी पूर्ववर्ती गति बताता है; ‘फिर’ घटनाक्रम को स्वाभाविक बनाता है, और ‘मुड़कर’ उसका संक्षिप्त सीधा रूप है।
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: अपने पीछे चल रही भीड़ से
  rationale: वर्तमान कृदंत निरंतर चलने की क्रिया दर्शाता है। ‘अपने पीछे चल रही’ हिन्दी में αὐτῷ और ἀκολουθοῦντι दोनों का सहज अर्थ देता है।
- source_word: Λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रत्यक्ष संबोधन का प्रचलित सूत्र है; हिन्दी में इसका स्वाभाविक और अर्थनिष्ठ रूप यही है।
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: इस्राएल में भी ... नहीं
  rationale: οὐδέ का बल हिन्दी की ‘भी ... नहीं’ संरचना में स्वाभाविक रूप से व्यक्त होता है; ‘इस्राएल में’ स्थान तथा इस्राएली समुदाय—दोनों की सम्भावित छाया बनाए रखता है।
- source_word: τοσαύτην πίστιν
  choice: इतना विश्वास
  rationale: τοσαύτην मात्रा या परिमाण की तीव्रता व्यक्त करता है; ‘इतना विश्वास’ साधारण आधुनिक हिन्दी में स्पष्ट है। πίστις यहाँ यीशु के अधिकार पर भरोसे से युक्त विश्वास को सूचित करता है।
- source_word: εὗρον
  choice: मैंने ... नहीं पाया
  rationale: ग्रीक अओरिस्ट को हिन्दी का सामान्य पूर्ण भूत रूप ठीक प्रकार व्यक्त करता है; प्रसंग में वर्तमान तक के अनुभव का भाव स्वतः समझ में आता है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा
  rationale: यहाँ सूबेदार का यीशु के अधिकार पर भरोसा अभिप्रेत है, फिर भी ‘विश्वास’ πίστις का व्यापक और धर्मवैचारिक रूप से तटस्थ मानक अनुवाद है। ‘भरोसा’ अर्थ की एक उपयोगी छाया के रूप में पादटिप्पणी में रखा गया है।
- issue: यीशु के आश्चर्य का वर्णन
  choice: उन्हें ... आश्चर्य हुआ
  alternative: वे ... चकित हुए
  rationale: मूल पाठ यीशु के आश्चर्य को सीधे व्यक्त करता है। अनुवाद इस कथन को न तो कम करता है और न उसके दार्शनिक या मसीह-विज्ञान संबंधी निहितार्थों को अतिरिक्त व्याख्या से सुलझाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। आदरसूचक बहुवचन सर्वनाम यीशु के लिए प्रयुक्त हुए हैं। वाक्य-विन्यास मूल घटनाक्रम और कथन के बल को सुरक्षित रखते हुए हिन्दी के स्वाभाविक प्रवाह के अनुसार है।
