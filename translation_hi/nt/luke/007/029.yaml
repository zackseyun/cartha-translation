lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: सब लोगों
  rationale: एकवचन सामूहिक पद का स्वाभाविक हिन्दी रूप; यह अभिव्यक्ति व्यापक दायरे को बनाए रखती है।
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: भूतकालिक कृदन्त को प्रसंगानुसार कालवाचक रूप में रखा गया है; ‘यह’ पूर्ववर्ती कथन की ओर संकेत करता है।
- source_word: οἱ τελῶναι
  choice: चुंगी लेनेवालों
  rationale: पहली सदी के कर-संग्रहकर्ताओं के लिए प्रचलित और सामान्य हिन्दी बाइबलीय पद। ‘समेत’ यूनानी समुच्चय को बिना अनावश्यक विशेष जोर के समावेश के रूप में व्यक्त करता है।
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: परमेश्वर को न्यायी ठहराया
  rationale: 'δικαιόω का न्यायिक भाव सुरक्षित रहता है: लोगों ने परमेश्वर को न्यायी और सही स्वीकार किया, न कि उसे न्यायी बनाया।'
- source_word: βαπτισθέντες
  choice: उन्होंने ... बपतिस्मा लिया था
  rationale: यूनानी भूतकालिक कर्मवाच्य कृदन्त को पृष्ठभूमि बताने वाले स्वाभाविक हिन्दी वाक्य में बदला गया है। इसमें कारण का भाव अनिवार्य नहीं किया गया।
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: यूहन्ना का बपतिस्मा
  rationale: संबंधवाचक यूनानी पद का संक्षिप्त और स्वाभाविक हिन्दी रूप, जो यूहन्ना द्वारा दिए जाने वाले बपतिस्मे को दर्शाता है।
theological_decisions:
- issue: ‘परमेश्वर को न्यायी ठहराया’ का अर्थ
  choice: लोगों ने स्वीकार किया कि परमेश्वर न्यायी और सही था।
  alternative: ‘उन्होंने परमेश्वर को सही माना’ या अधिक शब्दशः ‘परमेश्वर को धर्मी ठहराया।’
  rationale: यह कथन परमेश्वर की दशा में किसी परिवर्तन की बात नहीं करता, बल्कि उसकी ओर लोगों की सकारात्मक स्वीकृति बताता है। ‘न्यायी ठहराया’ मूल की न्यायिक छटा को सुरक्षित रखता है।
- issue: βαπτισθέντες कृदन्त का संबंध
  choice: 'इसे परिस्थिति अथवा पूर्व पृष्ठभूमि के रूप में रखा गया है: उन्होंने यूहन्ना का बपतिस्मा लिया था।'
  alternative: 'इसे कारणवाचक समझा जा सकता है: ‘क्योंकि उन्होंने यूहन्ना का बपतिस्मा लिया था।’'
  rationale: प्रसंग में कारण का भाव संभव है, पर यूनानी कृदन्त स्वयं उसे अनिवार्य नहीं बनाता। मुख्य पाठ उस संबंध को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश से ‘चुंगी लेनेवालों समेत’ को समावेशी स्पष्टीकरण के रूप में रखा गया है; इससे यूनानी पाठ से अधिक आश्चर्य या जोर नहीं जुड़ता।
