language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: hi
  text: यूहन्ना के दूतों के चले जाने के बाद, यीशु ने भीड़ से यूहन्ना के बारे में कहना शुरू किया, “तुम निर्जन प्रदेश में क्या देखने गए थे?[a] हवा से हिलता हुआ सरकंडा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निहारने” अथवा “ध्यान से देखने”।
    reason: θεάσασθαι में सामान्य ‘देखने’ से अधिक ध्यानपूर्वक देखने या निहारने का भाव हो सकता है।
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: जब ... चले गए
  rationale: कर्तृवाचक संबंधवाचक स्वतंत्र रचना का कालसूचक भाव है; यह पहले दूतों के चले जाने और फिर यीशु के बोलने का क्रम स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀγγέλων Ἰωάννου
  choice: यूहन्ना के भेजे हुए लोग
  rationale: यहाँ ἄγγελοι मनुष्य-दूत हैं, स्वर्गदूत नहीं। ‘भेजे हुए लोग’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ἤρξατο λέγειν
  choice: यीशु ... कहने लगे
  rationale: आरंभसूचक रचना का बल ‘कहने लगे’ में बना रहता है। यूनानी में कर्ता अंतर्निहित है; हिन्दी में संदर्भ की स्पष्टता हेतु ‘यीशु’ व्यक्त किया गया है।
- source_word: πρὸς τοὺς ὄχλους
  choice: भीड़ों से
  rationale: ὄχλους बहुवचन है; ‘भीड़ों’ उसका रूप बनाए रखता है, और बोलने की क्रिया के साथ πρός का स्वाभाविक हिन्दी रूप ‘से’ है।
- source_word: περὶ Ἰωάννου
  choice: यूहन्ना के विषय में
  rationale: περί के संबंधसूचक अर्थ को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Τί ἐξήλθατε
  choice: तुम ... क्या ... गए थे?
  rationale: τί यहाँ मुख्यतः देखने की वस्तु पूछता है, कारण नहीं; इसलिए ‘क्या’, न कि ‘क्यों’।
- source_word: εἰς τὴν ἔρημον
  choice: निर्जन प्रदेश में
  rationale: ἔρημος उस कम आबाद क्षेत्र को दर्शाता है जहाँ यूहन्ना सेवा कर रहे थे। ‘निर्जन प्रदेश’ ‘रेगिस्तान’ की अपेक्षा भौगोलिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: θεάσασθαι
  choice: देखने
  rationale: यह क्रिया ध्यान से देखने या निहारने का भाव रख सकती है; मुख्य पाठ में सहज ‘देखने’ रखा गया है और सूक्ष्म विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: κάλαμον
  choice: सरकंडा
  rationale: κάλαμος का पौधे वाला ठोस बिंब हिन्दी में ‘सरकंडा’ से स्वाभाविक और स्पष्ट बनता है।
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: हवा से हिलता हुआ
  rationale: यह वायु के प्रभाव में सरकंडे की गति का सीधा चित्र बनाए रखता है और रूपक का अर्थ स्वयं नहीं खोलता।
theological_decisions:
- issue: यूहन्ना के संबंध में सरकंडे वाले आलंकारिक प्रश्न का आशय
  choice: मुख्य पाठ में शाब्दिक बिंब ‘हवा से हिलता हुआ सरकंडा?’ बनाए रखा गया है।
  alternative: ‘क्या तुम किसी अस्थिर या डगमगाने वाले मनुष्य को देखने गए थे?’ जैसी व्याख्यात्मक पुनरुक्ति।
  rationale: मूल पाठ स्वयं रूपक का स्पष्ट अर्थ नहीं बताता। शाब्दिक बिंब पाठक को निहितार्थ ग्रहण करने देता है और यूहन्ना के चरित्र पर कथन को अनावश्यक रूप से निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘भेजे हुए लोग’ से मानवीय दूत स्पष्ट किए गए हैं; ‘निर्जन प्रदेश’ यूहन्ना की सेवकाई के कम आबाद क्षेत्र के लिए चुना गया है। प्रश्नों की संक्षिप्तता और मूल रूपक सुरक्षित रखे गए हैं।
