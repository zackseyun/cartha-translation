source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: hi
  text: जिस फरीसी ने उसे न्योता दिया था, उसने यह देखकर अपने मन में कहा, “यदि यह आदमी नबी होता, तो जानता कि उसे छू रही स्त्री कौन है और कैसी है[a], क्योंकि वह पापिनी है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, उसकी पहचान क्या है और उसका चरित्र या लोगों में उसकी प्रतिष्ठा कैसी है। यूनानी में दोनों बातों पर बल है।
    reason: lexical_alternative
  - marker: b
    text: या, “कि वह पापिनी है।” इस उपवाक्य को या तो उस बात की विषय-वस्तु माना जा सकता है जिसे वह जानता, या स्त्री के ऐसे चरित्र या प्रतिष्ठा का कारण।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: उसने यह देखकर
  rationale: अओरिस्ट कृदंत मुख्य कथन की परिस्थिति बताता है। ‘यह’ निकटवर्ती प्रसंग में स्त्री के कार्य की ओर संकेत करता है; δέ को अलग और अनावश्यक आरंभिक शब्द से नहीं दर्शाया गया।
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: जिस फरीसी ने उसे न्योता दिया था
  rationale: भोजन के प्रसंग में καλέω का अर्थ बुलाने के बजाय निमंत्रित करना है; ‘दिया था’ पहले हो चुकी क्रिया को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: अपने मन में कहा
  rationale: यह आंतरिक कथन का मुहावरा है; हिन्दी में ‘कहा ... कहते हुए’ की पुनरुक्ति आवश्यक नहीं।
- source_word: Οὗτος
  choice: यह आदमी
  rationale: संकेतवाचक शब्द यीशु के प्रति फरीसी की दूरी और कुछ हद तक तिरस्कारपूर्ण लहजे को व्यक्त करता है।
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: यदि यह आदमी नबी होता, तो जानता
  rationale: εἰ के साथ अपूर्ण भूतकाल और फलवाक्य में ἄν फरीसी की दृष्टि से तथ्य-विरुद्ध शर्त दर्शाते हैं।
- source_word: τίς καὶ ποταπὴ
  choice: वह कौन और कैसी स्त्री है
  rationale: दोनों प्रश्नवाचक शब्द स्त्री की पहचान और उसके प्रकार, चरित्र या प्रतिष्ठा—दोनों पर बल देते हैं।
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: जो स्त्री उसे छू रही है
  rationale: वर्तमान काल दृश्य में जारी स्पर्श को व्यक्त करता है; ‘छू रही है’ इसे स्वाभाविक रूप से बनाए रखता है।
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: क्योंकि वह पापिनी है
  rationale: मुख्य पाठ में ὅτι को फरीसी के निष्कर्ष का कारण माना गया है, पर ‘कि’ के रूप में विषय-वस्तु संबंधी अर्थ भी संभव है और पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यीशु के नबी होने से संबंधित शर्त का भाव
  choice: ‘यदि यह आदमी नबी होता, तो जानता’—फरीसी की दृष्टि से तथ्य-विरुद्ध शर्त
  alternative: ‘यदि यह आदमी नबी है, तो वह जानता होगा’—अधिक तटस्थ शर्त
  rationale: यूनानी εἰ ἦν ... ἐγίνωσκεν ἂν स्वाभाविक रूप से संशयपूर्ण, तथ्य-विरुद्ध शर्त व्यक्त करता है। अनुवाद इसे फरीसी का विचार बनाए रखता है और कथावाचक की ओर से उसके निर्णय की पुष्टि नहीं करता।
- issue: ὅτι उपवाक्य का संबंध
  choice: 'कारण: ‘क्योंकि वह पापिनी है’'
  alternative: 'ज्ञान की विषय-वस्तु: ‘कि वह पापिनी है’'
  rationale: दोनों व्याकरणतः संभव हैं। मुख्य पाठ प्रसंगगत कारणात्मक प्रवाह अपनाता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘फरीसी’, ‘नबी’ और ‘पापिनी’ सामान्य बाइबिलीय शब्दावली के रूप में प्रयुक्त हैं। वाक्य-रचना मूल की तार्किक गति को बनाए रखते हुए साधारण पाठक के लिए स्वाभाविक रखी गई है।
