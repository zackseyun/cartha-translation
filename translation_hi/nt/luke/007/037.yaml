source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: hi
  text: और देखो, उस नगर में एक स्त्री थी, जो पापिनी थी। जब उसे पता चला कि यीशु उस फ़रीसी के घर में भोजन के लिए लेटे हुए हैं,[a] तो वह सुगंधित तेल की एक अलाबास्तर शीशी[b] लाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय औपचारिक भोजन में लोग मेज़ के पास करवट लेकर लेटते थे।
    reason: cultural_note
  - marker: b
    text: या, “सुगंधित लेप से भरा अलाबास्तर का एक पात्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथा में अचानक ध्यान खींचने और स्त्री के आगमन को सजीव ढंग से प्रस्तुत करने वाला स्वाभाविक आधुनिक हिन्दी संकेत है।
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: उस नगर में एक स्त्री थी
  rationale: ग्रीक के स्थान-सूचक वाक्यांश को बिना यह निश्चित किए रखा गया है कि वह वहीं रहती थी या केवल वहाँ उपस्थित थी।
- source_word: ἁμαρτωλός
  choice: पापिनी
  rationale: यह स्त्री के विषय में प्रयुक्त संज्ञात्मक नैतिक विशेषण को संक्षेप में व्यक्त करता है और उसके पाप का प्रकार नहीं बताता।
- source_word: ἐπιγνοῦσα
  choice: जब उसे पता चला
  rationale: मुख्य क्रिया से पहले जानकारी मिलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατάκειται
  choice: भोजन के लिए लेटे हुए हैं
  rationale: प्राचीन औपचारिक भोजन की लेटकर खाने की मुद्रा को स्पष्ट करता है; केवल ‘बैठे’ कहना ऐतिहासिक चित्र बदल देता।
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: फ़रीसी के घर में
  rationale: निश्चित फ़रीसी के घर को सहज हिन्दी संबंध-रचना में प्रस्तुत करता है।
- source_word: κομίσασα
  choice: लाई
  rationale: स्त्री द्वारा पात्र अपने साथ लाने की मुख्य क्रिया को संक्षिप्त और सहज रूप देता है।
- source_word: ἀλάβαστρον μύρου
  choice: सुगंधित तेल से भरा संगमरमर का एक पात्र
  rationale: μύρον को उस समय के सुगंधित तेल/लेप के रूप में और ἀλάβαστρον को उस पदार्थ से बने पात्र के रूप में पाठक-सुलभ हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्त्री का नैतिक परिचय
  choice: पापिनी
  alternative: बदचलन स्त्री / वेश्या
  rationale: मूल यूनानी केवल उसे पापिनी कहता है; उसके पाप का स्वरूप निर्दिष्ट नहीं करता। इसलिए पारंपरिक किंतु अप्रमाणित पहचान नहीं जोड़ी गई।
- issue: भोजन करने वाले पुरुष की पहचान
  choice: यीशु
  alternative: वह
  rationale: यूनानी क्रिया में कर्ता प्रसंग से समझा जाता है। हिन्दी में अस्पष्टता से बचाने के लिए पूर्ववर्ती प्रसंग के स्पष्ट कर्ता यीशु का नाम रखा गया है; इससे कोई नई धर्मवैज्ञानिक सूचना नहीं जुड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ से लूका का ध्यानाकर्षक कथन बना रहता है। ‘पापिनी’ उसके पाप को निर्दिष्ट किए बिना मूल की नैतिक संज्ञा बनाए रखता है।
