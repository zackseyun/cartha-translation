id: LUK.7.16
reference: Luke 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: hi
  text: तब उन सब पर भय छा गया, और वे परमेश्वर की महिमा करते हुए कहने लगे, “हमारे बीच एक महान भविष्यद्वक्ता उठ खड़ा हुआ है[a], और परमेश्वर ने अपनी प्रजा की सुधि ली है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे बीच एक महान भविष्यद्वक्ता उठाया गया है,” जिसमें परमेश्वर द्वारा भविष्यद्वक्ता को खड़ा किए जाने का भाव अधिक स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: “सुधि ली है” यहाँ परमेश्वर के अपनी प्रजा की ओर ध्यान देने और उसकी भलाई के लिए कार्य करने का बाइबलीय भाव व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: उन सब पर भय छा गया
  rationale: यह स्वाभाविक हिन्दी मुहावरा यूनानी वाक्यांश के अचानक और प्रबल प्रभाव को व्यक्त करता है। ‘भय’ φόβος का सीधा अर्थ रखता है और श्रद्धामिश्रित विस्मय की सम्भावना को भी समाप्त नहीं करता।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; प्रसंग में ‘तब’ हिन्दी कथा-प्रवाह को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: ἐδόξαζον τὸν θεὸν
  choice: वे परमेश्वर की महिमा करते हुए
  rationale: ‘महिमा करना’ δοξάζω से निकट lexical संबंध रखता है, और ‘करते हुए’ अपूर्णकाल की जारी क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: यह महिमा करने की अभिव्यक्ति की विषयवस्तु प्रस्तुत करता है; ‘कहने लगे’ भीड़ की आरम्भ हुई और जारी प्रतिक्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: Προφήτης μέγας
  choice: एक महान भविष्यद्वक्ता
  rationale: यह μέγας का सीधा मूल्यांकनात्मक बल और προφήτης का प्रचलित बाइबलीय हिन्दी रूप सुरक्षित रखता है।
- source_word: ἠγέρθη
  choice: उठ खड़ा हुआ है
  rationale: यह यूनानी निष्क्रिय रूप की अर्थगत खुली प्रकृति को बनाए रखते हुए स्वाभाविक हिन्दी है; इसमें किसी भविष्यद्वक्ता के प्रकट होने का भाव है, जबकि परमेश्वर द्वारा उठाए जाने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ἐν ἡμῖν
  choice: हमारे बीच
  rationale: सामुदायिक प्रसंग में यह सीधा और सहज हिन्दी रूप है।
- source_word: Ἐπεσκέψατο
  choice: सुधि ली है
  rationale: ‘सुधि लेना’ केवल भेंट करने के बजाय ध्यान, परवाह और हस्तक्षेप के बाइबलीय भाव को संक्षिप्त, प्रतिष्ठित हिन्दी में व्यक्त करता है, पर सहायता के किसी एक विशिष्ट रूप तक अर्थ को सीमित नहीं करता।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: आधुनिक मानक बाइबलीय हिन्दी में θεός का प्रचलित और गरिमापूर्ण रूप।
- source_word: τὸν λαὸν αὐτοῦ
  choice: अपनी प्रजा
  rationale: यह स्वाभाविक हिन्दी है और परमेश्वर से संबंधित समुदाय के वाचा-सदृश भाव को बनाए रखता है।
theological_decisions:
- issue: चमत्कार के बाद φόβος का अर्थ
  choice: भय
  alternative: विस्मय / श्रद्धामिश्रित भय
  rationale: मूल पाठ स्पष्ट रूप से φόβος कहता है। ‘भय’ उसकी तीव्रता और धर्मवैचारिक तनाव को बनाए रखता है; केवल ‘विस्मय’ कहना प्रतिक्रिया को व्याख्यात्मक रूप से नरम कर देता।
- issue: भविष्यद्वक्ता के विषय में ἠγέρθη का भाव
  choice: उठ खड़ा हुआ है
  alternative: उठाया गया है
  rationale: यूनानी निष्क्रिय रूप परमेश्वर की अप्रकट कर्तृता का संकेत दे सकता है, पर अभिव्यक्ति का अर्थ ‘प्रकट हुआ’ भी हो सकता है। मुख्य पाठ सहज हिन्दी रखता है और अधिक स्पष्ट दिव्य कर्तृता को पादटिप्पणी में देता है।
- issue: परमेश्वर के कार्य के लिए Ἐπεσκέψατο
  choice: अपनी प्रजा की सुधि ली है
  alternative: अपनी प्रजा के पास आया है / अपनी प्रजा की सहायता करने आया है
  rationale: यह ध्यानपूर्वक और हितकारी दिव्य हस्तक्षेप का भाव रखता है, पर उसे केवल भौतिक आगमन या किसी एक प्रकार की सहायता तक सीमित नहीं करता।
- issue: दो ὅτι उपवाक्यों का संबंध
  choice: एक संयुक्त उद्धरण
  alternative: 'दो अलग कथन: “एक महान भविष्यद्वक्ता...” और “परमेश्वर ने...”'
  rationale: दोनों समानांतर उपवाक्य λέγοντες की विषयवस्तु हैं। एक संयुक्त उद्धरण हिन्दी में स्वाभाविक है और मूल के संयुक्त उद्घोष को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘भविष्यद्वक्ता’, ‘महिमा’ और ‘प्रजा’ जैसे परिचित बाइबलीय पद मूल की धर्मवैचारिक प्रतिध्वनि बनाए रखते हैं; वाक्य-विन्यास हिन्दी कथा-शैली के अनुरूप स्वाभाविक किया गया है।
