source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: hi
  text: इस कारण मैं तुमसे कहता हूँ, उसके बहुत-से पाप क्षमा हो चुके हैं, क्योंकि[a] उसने बहुत प्रेम किया। पर जिसे कम क्षमा किया जाता है, वह कम प्रेम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए उसने बहुत प्रेम किया।” यहाँ यूनानी संयोजक को इस प्रकार भी समझा जा सकता है कि उसका प्रेम क्षमा पाने का कारण नहीं, बल्कि इस बात का प्रमाण है कि उसे क्षमा मिल चुकी है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: इस कारण
  rationale: यह स्वाभाविक हिन्दी में कारण अथवा निष्कर्ष की संयोजक शक्ति बनाए रखता है।
- source_word: ἀφέωνται
  choice: क्षमा हो चुके हैं
  rationale: पूर्णकालिक कर्मवाच्य उस संपन्न क्षमा और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है।
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: उसके बहुत-से पाप
  rationale: ग्रीक के विशेषणात्मक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: संयोजक का सामान्य कारणवाचक अर्थ सुरक्षित रहता है; प्रसंग में प्रेम को क्षमा के प्रमाण या फल के रूप में समझने की संभावना पादटिप्पणी में दी गई है।
- source_word: ἠγάπησεν πολύ
  choice: उसने बहुत प्रेम किया है
  rationale: ‘प्रेम’ मूल क्रिया के अर्थ को सीधे व्यक्त करता है; हिन्दी का पूर्ण भूत वर्तमान प्रसंग में प्रकट उसके प्रेमपूर्ण कार्यों और उनके विद्यमान प्रमाण को स्वाभाविक ढंग से दर्शाता है।
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: पर जिसे थोड़ा क्षमा किया जाता है
  rationale: सामान्य व्यक्ति-सूचक संबंधवाचक रचना और वर्तमान कर्मवाच्य को बनाए रखता है।
- source_word: ὀλίγον ἀγαπᾷ
  choice: वह थोड़ा प्रेम करता है
  rationale: पहले ‘थोड़ा’ के साथ मूल का संक्षिप्त समानांतर वाक्य-विन्यास सुरक्षित रहता है।
theological_decisions:
- issue: क्या ὅτι स्त्री के प्रेम को उसकी क्षमा का अर्जित करने वाला कारण बताता है
  choice: मुख्य पाठ में ‘क्योंकि’ रखकर ग्रीक की कारणवाचक अभिव्यक्ति और उसका तनाव सुरक्षित रखा गया है।
  alternative: इसे ‘इससे प्रकट होता है कि उसने बहुत प्रेम किया’ या ‘इसलिए उसने बहुत प्रेम किया’ के रूप में समझना।
  rationale: दृष्टान्त और पद 50 क्षमा को प्रेम से पहले रखते हुए प्रेम को उसका फल या प्रमाण समझने का आधार देते हैं; फिर भी मूल वाक्य को व्याख्यात्मक रूप से बदलना उचित नहीं, इसलिए वैकल्पिक समझ पादटिप्पणी में है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘बहुत-से पाप’ तथा ‘थोड़ा प्रेम’ मूल की मात्रात्मक समानता को स्पष्ट रखते हैं; स्त्री के लिए आदरसूचक बहुवचन न अपनाकर मूल के एकवचन और सामान्य कथन की सीधाई बनाए रखी गई है।
