base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: hi
  text: एक शताधिकारी का दास बीमार था और मरने ही वाला था, जिसे वह बहुत मूल्यवान मानता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: एक सूबेदार का
  rationale: यह प्रयोग स्वामी-संबंध और τινος की अनिश्चितता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सूबेदार’ सामान्य हिन्दी बाइबल-पाठकों के लिए रोमी शताधिकारी के पद का परिचित और सुबोध नाम है।
- source_word: δέ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ हल्के कथात्मक संक्रमण का संकेत देता है। हिन्दी में नया वाक्य और प्रसंग-क्रम इस परिवर्तन को पर्याप्त रूप से व्यक्त करते हैं; ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ उभर सकता है।
- source_word: δοῦλος
  choice: दास
  rationale: प्रथम शताब्दी के इस घरेलू संदर्भ में यह शब्द केवल सामान्य सेवा नहीं, बल्कि स्वामित्व और अधीनता से बँधी स्थिति बताता है। ‘दास’ उस संबंध को ‘सेवक’ से अधिक स्पष्टता से बनाए रखता है।
- source_word: κακῶς ἔχων
  choice: बीमार था
  rationale: यूनानी मुहावरे का आशय अस्वस्थ या बुरी दशा में होना है। यहाँ ‘बीमार था’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἤμελλεν τελευτᾶν
  choice: मरने पर था
  rationale: यह मृत्यु की निकटता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: वह दास उसे बहुत प्रिय था
  rationale: ἔντιμος यहाँ दास के प्रति सूबेदार के विशेष आदर और मूल्य को दर्शाता है। ‘बहुत प्रिय’ सहज हिन्दी है और यह नहीं बताता कि दास केवल आर्थिक रूप से मूल्यवान था। संज्ञा को दोहराने से सर्वनामों की अस्पष्टता भी दूर होती है।
theological_decisions:
- issue: घरेलू दासता के संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद में व्यक्ति की बँधी हुई सामाजिक और कानूनी अधीनता अर्थ का वास्तविक भाग है। ‘दास’ इसे सुरक्षित रखता है, जबकि ‘सेवक’ आधुनिक पाठक को स्वतंत्र रूप से नियुक्त कर्मचारी का संकेत दे सकता है। वैकल्पिक पारंपरिक अनुवाद पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शतपति’ की अपेक्षा अधिक परिचित ‘सूबेदार’ चुना गया है। दो वाक्यों की रचना से हिन्दी स्वाभाविक रहती है और अंतिम यूनानी संबंधवाचक उपवाक्य में सर्वनाम-संदर्भ स्पष्ट होता है।
