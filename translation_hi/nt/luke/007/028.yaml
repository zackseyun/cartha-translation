source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ,[a] स्त्रियों से जन्मे लोगों में यूहन्ना से बड़ा कोई नहीं है;[b] फिर भी परमेश्वर के राज्य में जो सबसे छोटा है,[c] वह उससे बड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं तुमसे कहता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: “स्त्रियों से जन्मे” सामान्य रूप से मनुष्यों के लिए प्रयुक्त एक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: इसे “परमेश्वर के राज्य में सबसे छोटा व्यक्ति” भी कहा जा सकता है। यूनानी में विशेषण का प्रयोग संज्ञा के रूप में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रचलित कथन-सूत्र का सीधा और स्वाभाविक हिन्दी रूप है तथा यूनानी वर्तमान काल की प्रत्यक्षता बनाए रखता है।
- source_word: μείζων
  choice: बड़ा
  rationale: तुलनात्मक अर्थ को बनाए रखता है और यह तय नहीं करता कि बड़ाई पद, महत्त्व, विशेषाधिकार या किसी अन्य दृष्टि से है।
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: स्त्रियों से जन्मे लोगों में
  rationale: मानवजाति के लिए प्रयुक्त मुहावरे को स्पष्ट हिन्दी में व्यक्त करते हुए उसके मूल चित्र को सुरक्षित रखता है।
- source_word: Ἰωάννου
  choice: यूहन्ना
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में मान्य रूप।
- source_word: οὐδείς ἐστιν
  choice: कोई नहीं है
  rationale: यूनानी निषेधात्मक कथन का स्वाभाविक हिन्दी रूप।
- source_word: ὁ δὲ μικρότερος
  choice: फिर भी ... जो सबसे छोटा है
  rationale: विशेषण के संज्ञात्मक प्रयोग को हिन्दी में संबंधवाचक उपवाक्य द्वारा स्वाभाविक रूप से व्यक्त करता है; ‘फिर भी’ δέ के विरोधात्मक बल को दर्शाता है।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: मूल संबंध और स्थानगत अर्थ को बनाए रखने वाला मानक हिन्दी पदबंध।
- source_word: μείζων αὐτοῦ ἐστιν
  choice: वह उससे बड़ा है
  rationale: तुलना को स्पष्ट और संक्षिप्त रखता है, जबकि ‘बड़ा’ होने का आधार अनिर्धारित छोड़ता है।
theological_decisions:
- issue: यूहन्ना और ‘परमेश्वर के राज्य में सबसे छोटे’ के बीच तुलना का आधार
  choice: तुलना को बिना व्याख्यात्मक विस्तार के विरोधाभासी रूप में बनाए रखा गया है।
  alternative: इसे वाचा-संबंधी विशेषाधिकार, नैतिक या आत्मिक महानता, उद्धार-इतिहास में स्थान, अथवा सम्मान-संबंधी अतिशयोक्ति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ यह नहीं बताता कि ‘बड़ा’ किस दृष्टि से है; इसलिए अनुवाद किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बड़ा’ और ‘सबसे छोटा’ मूल पाठ की तुलना तथा उसकी अर्थगत खुली जगह को सुरक्षित रखते हैं।
