lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: समाचार दिया
  rationale: क्रिया का अर्थ सूचना पहुँचाना या वृत्तांत सुनाना है। ‘समाचार दिया’ आधुनिक, सहज हिन्दी में बातों की सूचना यूहन्ना तक पहुँचाने का भाव व्यक्त करता है।
- source_word: Ἰωάννῃ
  choice: यूहन्ना को
  rationale: सम्प्रदान कारक के अप्रत्यक्ष कर्म को हिन्दी में ‘को’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्यों ने
  rationale: ‘शिष्य’ सुसमाचारों में μαθητής के शिक्षक-अनुयायी सम्बन्ध को सटीक और प्रचलित रूप से व्यक्त करता है। सर्वनाम का निकटतम सन्दर्भ यूहन्ना है।
- source_word: περὶ πάντων τούτων
  choice: इन सब बातों का
  rationale: ‘इन सब बातों’ से πάντων की समग्रता और τούτων का संकेतवाचक बल दोनों बने रहते हैं; ‘समाचार देना’ के साथ सम्बन्धसूचक ‘का’ स्वाभाविक हिन्दी है।
- source_word: προσκαλεσάμενος
  choice: बुलाकर
  rationale: मध्यवाच्य कृदन्त बताता है कि यूहन्ना ने उन्हें अपने पास आने के लिए बुलाया; ‘बुलाकर’ इसे संक्षेप और सहजता से व्यक्त करता है।
- source_word: δύο τινὰς
  choice: किन्हीं दो को
  rationale: τινάς की अनिश्चितता को ‘किन्हीं’ द्वारा सुरक्षित रखा गया है, जबकि संख्या दो स्पष्ट रहती है।
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: अपने शिष्यों में से
  rationale: 'यह अंश भागसूचक सम्बन्ध बताता है: यूहन्ना ने अपने शिष्यों के समूह में से दो चुने। ‘में से’ इसे हिन्दी में स्पष्ट करता है।'
- source_word: ὁ Ἰωάννης
  choice: यूहन्ना ने
  rationale: यूनानी में कृदन्त के बाद कर्ता स्पष्ट रूप से दोहराया गया है। हिन्दी में ‘तब यूहन्ना ने’ नए उपवाक्य के कर्ता को स्पष्ट और स्वाभाविक रखता है।
