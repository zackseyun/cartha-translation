source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: hi
  text: जब उसने यीशु के विषय में सुना, तो उसने यहूदियों के अगुओं को यीशु के पास भेजा और यीशु से निवेदन किया कि वे आकर उसके दास[a] को बचा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” यूनानी शब्द दूलोस किसी दास या सेवक को सूचित कर सकता है; यहाँ “दास” उसकी बंधित और अधीन सामाजिक स्थिति को अधिक स्पष्ट करता है।
    reason: वैकल्पिक अनुवाद और प्राचीन सामाजिक स्थिति की स्पष्टता
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: जब उसने यीशु के विषय में सुना, तो
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य से व्यक्त किया गया है। δέ हल्का संयोजक है, जिसका प्रवाह हिन्दी के ‘तो’ से स्पष्ट होता है।
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: यीशु के पास भेजा
  rationale: यूनानी सर्वनाम का संदर्भ यीशु है। हिन्दी में लगातार अनेक सर्वनामों से पैदा होने वाली अस्पष्टता दूर करने के लिए नाम दोहराया गया है।
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: यहूदियों के अगुओं
  rationale: यहाँ πρεσβύτεροι केवल अधिक आयु वाले पुरुष नहीं, बल्कि मान्य सामुदायिक अगुए हैं। ‘अगुए’ इस भूमिका को आधुनिक और सुबोध हिन्दी में व्यक्त करता है।
- source_word: ἐρωτῶν αὐτὸν
  choice: उनसे विनती की
  rationale: इस प्रसंग में ἐρωτάω विनम्र और गंभीर अनुरोध को व्यक्त करता है; ‘विनती’ केवल सामान्य प्रश्न पूछने की गलत धारणा से बचाती है।
- source_word: ὅπως ἐλθὼν διασώσῃ
  choice: कि वे आकर ... बचा लें
  rationale: ὅπως अनुरोध की विषयवस्तु बताता है और ἐλθών पहले आकर फिर बचाने का क्रम रखता है। ‘बचा लें’ διασῴζω की व्यापकता बनाए रखता है और उसे केवल ‘चंगा करें’ तक सीमित नहीं करता।
- source_word: τὸν δοῦλον αὐτοῦ
  choice: उसके दास
  rationale: δοῦλος उस व्यक्ति की अधीन और बंधित सामाजिक स्थिति दर्शाता है। ‘दास’ गरिमापूर्ण हिन्दी में यह अर्थ रखता है; प्रचलित विकल्प ‘सेवक’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बीमार व्यक्ति के लिए δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद की सामाजिक पृष्ठभूमि में यह व्यक्ति सूबेदार के अधिकार के अधीन था। ‘दास’ उस बंधित स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है, जबकि पादटिप्पणी पारंपरिक और प्रसंगतः संभव विकल्प को सुरक्षित रखती है।
- issue: διασώσῃ को शारीरिक चंगाई तक सीमित करना
  choice: बचा लें
  alternative: चंगा कर दें
  rationale: निकटवर्ती प्रसंग गंभीर बीमारी का है, पर यूनानी क्रिया का अर्थ ‘बचाना/सुरक्षित निकालना’ भी है। व्यापक शब्द मूल की अर्थगत गुंजाइश और प्रसंग का तनाव दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘यहूदियों के अगुओं’ से पदाधिकारी-सदृश सामुदायिक भूमिका स्पष्ट होती है, और सम्मानसूचक ‘वे/उनसे’ हिन्दी में यीशु के लिए स्वाभाविक है।
