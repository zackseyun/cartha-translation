    issue: The request is directed to the elders rather than to Jesus.
    rationale: “उनसे विनती की कि वे आकर” grammatically makes the elders the people appealed to and the ones expected to come, whereas Greek says the centurion sent the elders to Jesus, asking Jesus to come.
