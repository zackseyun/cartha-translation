source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: hi
  text: तुमने मेरे सिर पर तेल नहीं लगाया, पर इस स्त्री ने मेरे पाँवों पर सुगंधित तेल[a] लगाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इत्र’ अथवा ‘सुगंधित मरहम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: तेल
  rationale: यह ἔλαιον का करण कारक है। संदर्भ में सामान्य ‘तेल’ स्वाभाविक है; ‘जैतून का तेल’ अनावश्यक रूप से अधिक विशिष्ट होगा।
- source_word: ἤλειψας / ἤλειψεν
  choice: लगाया / लगाया है
  rationale: ἀλείφω का अर्थ तेल, मरहम या सुगंधित द्रव्य लगाना है। हिन्दी में ‘लगाना’ दोनों वस्तुओं—साधारण तेल और सुगंधित तेल—के साथ स्वाभाविक है तथा यहाँ अभिषेक-संस्कार का अतिरिक्त भाव नहीं जोड़ता। दूसरे खंड में ‘लगाया है’ उस कार्य की वर्तमान प्रसंग में बनी हुई प्रासंगिकता व्यक्त करता है।
- source_word: κεφαλήν μου
  choice: मेरे सिर पर
  rationale: मूल पदबंध का सीधा और स्वाभाविक हिन्दी रूप। लगाने की क्रिया के साथ हिन्दी में ‘पर’ उपयुक्त है।
- source_word: αὕτη δὲ
  choice: पर इस स्त्री ने
  rationale: αὕτη उपस्थित स्त्री की ओर बलपूर्वक संकेत करता है और δὲ पहले ‘तुमने’ के साथ स्पष्ट विरोध स्थापित करता है।
- source_word: μύρῳ
  choice: सुगंधित तेल
  rationale: μύρον सुगंधयुक्त तेल या मरहम को दर्शाता है। ‘सुगंधित तेल’ आधुनिक हिन्दी में स्पष्ट है और पहले खंड के साधारण तेल से अंतर बनाए रखता है।
- source_word: τοὺς πόδας μου
  choice: मेरे पाँवों पर
  rationale: बहुवचन पदबंध का स्वाभाविक हिन्दी रूप; ‘पर’ लगाने की क्रिया का स्थान बताता है।
theological_decisions:
- issue: यीशु की फटकार में सामाजिक सम्मान का विरोध
  choice: अतिथि-सत्कार में साधारण तेल न लगाने और स्त्री द्वारा सुगंधित तेल लगाने का विरोध सीधे रूप में रखा गया है।
  alternative: ऐसी अधिक संस्कारपरक शब्दावली अपनाना जो औपचारिक अभिषेक या धार्मिक प्रतिष्ठापन का संकेत दे।
  rationale: तात्कालिक संदर्भ शमौन की आतिथ्य-संबंधी कमी और स्त्री द्वारा दिए गए असाधारण सम्मान की तुलना करता है। ‘लगाया’ मूल क्रिया का अर्थ देता है, पर अनावश्यक संस्कारगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पाँवों’ सामान्य पाठक के लिए स्वाभाविक है; ‘सुगंधित तेल’ μύρον का अर्थ स्पष्ट करते हुए साधारण तेल के साथ मूल विरोध बनाए रखता है।
