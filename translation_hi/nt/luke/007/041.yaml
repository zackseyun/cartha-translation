  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: hi
  text: “किसी साहूकार के दो कर्ज़दार थे। एक पर पाँच सौ दीनार[a] का कर्ज़ था और दूसरे पर पचास का।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार चाँदी का एक प्रचलित रोमी सिक्का था, जिसे आम तौर पर एक मज़दूर की लगभग एक दिन की मज़दूरी के बराबर माना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: कर्ज़दार
  rationale: यह संज्ञा उन लोगों को दर्शाती है जिन पर ऋण है; आधुनिक हिन्दी में ‘कर्ज़दार’ सीधा और सहज है।
- source_word: δανιστῇ τινι
  choice: किसी साहूकार
  rationale: δανιστής धन उधार देने वाले व्यक्ति को दर्शाता है, और τινι एक अनिश्चित किंतु विशिष्ट पात्र का परिचय देता है। ‘किसी साहूकार’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὤφειλεν
  choice: पर … कर्ज़ था
  rationale: यूनानी अपूर्णकाल यहाँ जारी ऋण-संबंध की स्थिति बताता है; ‘पर … कर्ज़ था’ हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: δηνάρια
  choice: दीनार
  rationale: यह एक विशिष्ट रोमी सिक्के और मौद्रिक इकाई का नाम है; ऐतिहासिक संदर्भ बनाए रखने के लिए लिप्यंतरण किया गया है और उसका स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
- source_word: πεντακόσια
  choice: पाँच सौ
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: ἕτερος
  choice: दूसरे
  rationale: ὁ εἷς के साथ इसके विरोध को ‘एक … दूसरे’ की स्वाभाविक हिन्दी संरचना में व्यक्त किया गया है।
- source_word: πεντήκοντα
  choice: पचास
  rationale: मूल संख्या का सीधा अनुवाद; ‘दीनार’ और ‘कर्ज़’ पहले खंड से सहज ही समझे जाते हैं।
