  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: hi
  text: जब प्रभु ने उसे देखा, तो वह उसके लिए करुणा से भर उठा और उससे कहा, “मत रो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रोओ मत” अथवा “रोना बंद कर दो।” यूनानी वाक्य को सामान्य निषेध के रूप में या उस समय चल रहे उसके विलाप को रोकने के निर्देश के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... ने ... देखा
  rationale: ὁράω के अओरिस्ट कृदंत को मुख्य क्रिया से पहले घटित क्रिया के रूप में स्वाभाविक हिन्दी कालवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: लूका के वर्णन में κύριος यीशु के लिए प्रयुक्त एक ऊँचा मसीही पद है; ‘प्रभु’ उसके सामान्य और धर्मवैचारिक रूप से संयमित हिन्दी समतुल्य को सुरक्षित रखता है।
- source_word: ἐσπλαγχνίσθη
  choice: करुणा से भर उठा
  rationale: यह क्रिया गहरी आंतरिक दया और करुणा को व्यक्त करती है। ‘करुणा से भर उठा’ उसके भावात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐπ’ αὐτῇ
  choice: उसके लिए
  rationale: ἐπί और सम्प्रदान कारक यहाँ उस स्त्री को करुणा का लक्ष्य बताते हैं; हिन्दी में ‘उसके लिए’ इसका स्वाभाविक रूप है।
- source_word: εἶπεν αὐτῇ
  choice: उससे कहा
  rationale: λέγω के सामान्य अर्थ ‘कहना’ को रखा गया है; ‘उससे कहा’ निर्देश की प्रकृति के विषय में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: Μὴ κλαῖε
  choice: मत रो
  rationale: μή के साथ वर्तमान आज्ञार्थक रूप चल रहे विलाप को रोकने का निर्देश या सामान्य निषेध—दोनों रूपों में समझा जा सकता है। ‘मत रो’ κλαίω का सीधा, स्वाभाविक और अर्थ की दृष्टि से कम अतिनिर्धारित अनुवाद है।
theological_decisions:
- issue: यीशु के लिए κύριος का पद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ लूका के उन्नत मसीही वर्णन को सुरक्षित रखता है, जबकि ‘स्वामी’ यहाँ केवल सांसारिक मालिक या गुरु का भाव दे सकता है। फिर भी अनुवाद पद से उससे अधिक धर्मवैचारिक निष्कर्ष नहीं जोड़ता जितना मूल पाठ कहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘करुणा से भर उठा’ मूल क्रिया की गहरी भावात्मक शक्ति को व्यक्त करता है और ‘मत रो’ संक्षिप्त प्रत्यक्ष संबोधन को बनाए रखता है।
