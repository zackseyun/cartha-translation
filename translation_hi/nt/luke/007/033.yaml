id: LUK.7.33
reference: Luke 7:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: hi
  text: क्योंकि बपतिस्मा देनेवाला यूहन्ना न रोटी खाता, न दाखमधु पीता हुआ आया है, और तुम कहते हो, “उसमें दुष्टात्मा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: आया है
  rationale: पूर्णकाल के वर्तमान-संबंधित भाव को बनाए रखता है; केवल ‘आया’ कहने की अपेक्षा यूहन्ना के आगमन की वर्तमान प्रासंगिकता स्पष्ट होती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: बपतिस्मा देनेवाला यूहन्ना
  rationale: βαπτιστής की क्रियात्मक भूमिका को स्पष्ट करते हुए प्रचलित बाइबलीय नाम ‘यूहन्ना’ रखता है।
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: न तो रोटी खाता हुआ और न दाखमधु पीता हुआ
  rationale: ἄρτον को सामान्यीकृत ‘भोजन’ न बनाकर ठोस अर्थ ‘रोटी’ के रूप में सुरक्षित रखता है और दोनों निषेधों की समानांतर संरचना बनाए रखता है।
- source_word: λέγετε
  choice: तुम कहते हो
  rationale: वर्तमानकाल में श्रोताओं की लगातार अथवा सामान्य प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Δαιμόνιον ἔχει
  choice: उसमें दुष्टात्मा है
  rationale: यूनानी के ‘दुष्टात्मा रखता है’ वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे स्रोत में न आए ‘अशुद्ध आत्मा’ से मिला देने के।
theological_decisions:
- issue: यूहन्ना पर लगाए गए आरोप में δαιμόνιον का अनुवाद
  choice: दुष्टात्मा
  alternative: अशुद्ध आत्मा
  rationale: यहाँ δαιμόνιον प्रयुक्त है, न कि ‘अशुद्ध आत्मा’ का अलग यूनानी पदबंध; इसलिए शब्दावली का सामंजस्यकरण नहीं किया गया।
- issue: Δαιμόνιον ἔχει की अभिव्यक्ति
  choice: उसमें दुष्टात्मा है
  alternative: वह दुष्टात्मा से ग्रस्त है
  rationale: चुना हुआ रूप स्रोत की सीधी आरोपात्मक संरचना के अधिक निकट है, जबकि वैकल्पिक रूप अधिकार अथवा ग्रस्तता की व्याख्या अधिक स्पष्ट रूप से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दाखमधु’ बाइबलीय प्रसंग में οἶνον के लिए परिचित और सटीक है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई संकेतक नहीं है।
