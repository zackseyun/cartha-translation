  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: hi
  text: और वह मरा हुआ युवक उठकर बैठ गया और बोलने लगा, और यीशु ने उसे उसकी माँ को दे दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उसकी माँ को वापस दे दिया” अथवा “उसे उसकी माँ के पास लौटा दिया।” यूनानी पाठ में केवल “उसे उसकी माँ को दे दिया” है; वापस मिलने का भाव प्रसंग से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: उठकर बैठ गया
  rationale: यह क्रिया लेटी हुई अवस्था से उठकर बैठने को व्यक्त करती है। ‘उठकर बैठ गया’ आधुनिक हिन्दी में स्वाभाविक है और केवल पुनर्जीवित होने के बजाय शरीर की बताई गई मुद्रा को भी स्पष्ट रखता है।
- source_word: ὁ νεκρός
  choice: वह मरा हुआ युवक
  rationale: शाब्दिक अर्थ ‘वह मृत व्यक्ति’ है, पर निकटवर्ती प्रसंग में वह विधवा का जवान बेटा है। ‘मरा हुआ युवक’ उसके पूर्व वर्णित मृत होने और व्यक्तिगत पहचान, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἤρξατο λαλεῖν
  choice: बोलने लगा
  rationale: ἄρχομαι और infinitive का यह प्रयोग किसी क्रिया के आरम्भ को दर्शाता है। ‘बोलने लगा’ संक्षिप्त, स्वाभाविक और कथात्मक हिन्दी है।
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: यीशु ने उसे उसकी माँ को सौंप दिया
  rationale: यूनानी में कर्ता सर्वनाम से नहीं, क्रिया-रूप और प्रसंग से समझा जाता है; हिन्दी में ‘यीशु’ कहने से संदर्भ सहज और अस्पष्टतारहित बनता है। ‘सौंप दिया’ δίδωμι के ‘दे दिया’ भाव को इस व्यक्ति-संबंधी प्रसंग में स्वाभाविक रूप से व्यक्त करता है, पर ‘वापस’ नहीं जोड़ता।
theological_decisions:
- issue: क्या पुत्र को माँ के पास पुनः लौटाने का भाव ‘वापस’ जोड़कर स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल ‘उसकी माँ को सौंप दिया’
  alternative: ‘उसे उसकी माँ को वापस सौंप दिया’ अथवा ‘उसे उसकी माँ के पास लौटा दिया’
  rationale: प्रसंग में पुनर्स्थापन का भाव निहित है, लेकिन यूनानी पाठ में ‘वापस’ या ‘लौटाया’ स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ मूल की सादगी बनाए रखता है और व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी रखी गई है। ‘उठकर बैठ गया’ और ‘बोलने लगा’ सामान्य पाठक के लिए स्वाभाविक हैं। व्यक्ति को वस्तु की तरह ‘दे दिया’ कहने की कठोरता से बचने के लिए ‘सौंप दिया’ चुना गया है, जबकि मूल में अनुपस्थित ‘वापस’ को मुख्य पाठ में नहीं जोड़ा गया।
