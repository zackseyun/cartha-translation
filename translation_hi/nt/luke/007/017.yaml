  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: hi
  text: और उसके विषय में यह समाचार यहूदिया भर में और आस-पास के पूरे प्रदेश में फैल गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके विषय में यह खबर’ अथवा ‘उसके विषय में यह बात’।
    reason: λόγος के यहाँ ‘समाचार’, ‘खबर’ या प्रचलित ‘बात’ होने की वास्तविक शाब्दिक सीमा को दर्शाता है।
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: फैल गया
  rationale: शाब्दिक अर्थ ‘निकल गया’ है, पर समाचार के व्यापक रूप से पहुँचने के संदर्भ में ‘फैल गया’ स्वाभाविक हिन्दी मुहावरा है और गति/प्रसार का भाव स्पष्ट करता है।
- source_word: ὁ λόγος οὗτος
  choice: यह समाचार
  rationale: यहाँ λόγος किसी एक ‘शब्द’ के बजाय यीशु के कार्य के विषय में प्रचलित समाचार या चर्चा को दर्शाता है।
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: सारे यहूदिया ... में
  rationale: ἐν के साथ ὅλῃ यहाँ पूरे भौगोलिक क्षेत्र में प्रसार का वितरणात्मक अर्थ देता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के संबंधसूचक अर्थ को गरिमापूर्ण और सहज आधुनिक हिन्दी में व्यक्त करता है; सर्वनाम का संदर्भ यीशु है।
- source_word: πάσῃ τῇ περιχώρῳ
  choice: आस-पास के पूरे प्रदेश में
  rationale: περίχωρος आसपास के क्षेत्र को सूचित करता है; ‘प्रदेश’ स्पष्ट है और अनावश्यक प्रशासनिक विशिष्टता नहीं जोड़ता।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दो भौगोलिक क्षेत्रों को संचयी रूप से जोड़ने वाले मूल समन्वय को हिन्दी वाक्य-विन्यास में बनाए रखता है।
