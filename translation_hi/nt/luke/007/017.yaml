  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘उसके’ से तत्काल संदर्भ के अनुसार यीशु अभिप्रेत हैं। पादटिप्पणी-चिह्न मुख्य पाठ में रखा गया है।
