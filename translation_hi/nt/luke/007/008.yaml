source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: hi
  text: क्योंकि मैं भी एक ऐसा मनुष्य हूँ जो अधिकार के अधीन नियुक्त है, और मेरे अधीन सैनिक हैं। मैं इस व्यक्ति से कहता हूँ, ‘जा,’ और वह जाता है; दूसरे से, ‘आ,’ और वह आता है; और अपने दास[a] से, ‘यह कर,’ और वह करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। यूनानी शब्द दूलोस ऐसे अधीनस्थ व्यक्ति को सूचित कर सकता है जो बँधी हुई या स्वामित्वाधीन स्थिति में हो, हालाँकि कुछ प्रसंगों में इसका अधिक सामान्य अनुवाद ‘सेवक’ भी हो सकता है।
    reason: वैकल्पिक अर्थ और प्राचीन सामाजिक स्थिति की स्पष्टता
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद सूबेदार की पिछली बात का आधार बताता है। हिन्दी में ‘क्योंकि’ explanatory force को स्वाभाविक रूप से व्यक्त करता है; ἐγώ के साथ ‘भी’ καί की तुलनात्मक छाया को सँभालता है।
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: मैं भी एक मनुष्य हूँ
  rationale: स्पष्ट ἐγώ पर बल है और ἄνθρωπος वक्ता की मानवीय तथा अधीनस्थ स्थिति को दिखाता है। ‘मैं भी’ तुलना और बल दोनों को सहज हिन्दी में रखता है।
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: जिसे अधिकार के अधीन रखा गया है
  rationale: यह रूप केवल अधिकार के अधीन होने से अधिक, किसी व्यवस्था या पदानुक्रम में रखे जाने का निष्क्रिय भाव देता है। सम्बन्धवाचक रचना हिन्दी में स्वाभाविक रहते हुए इस भाव को सुरक्षित रखती है।
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: और मेरे अधीन सैनिक हैं
  rationale: यह सूबेदार के अपने सौंपे हुए अधिकार और सैनिक पदानुक्रम को संक्षिप्त, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: λέγω τούτῳ
  choice: मैं एक से कहता हूँ
  rationale: τούτῳ मूलतः संकेतवाचक ‘इससे/इस व्यक्ति से’ है, पर उदाहरणात्मक क्रम में ‘एक से’ आधुनिक हिन्दी में अधिक स्वाभाविक है और अगले ‘दूसरे से’ के साथ समानांतरता बनाए रखता है।
- source_word: Πορεύθητι / πορεύεται
  choice: ‘जा,’ और वह जाता है
  rationale: आज्ञा और उसके तत्काल पालन की सरल समानांतर संरचना मूल पाठ के प्रभाव को बनाए रखती है।
- source_word: Ἔρχου / ἔρχεται
  choice: ‘आ,’ और वह आता है
  rationale: सीधी आज्ञा और प्रतिक्रिया को बिना अनावश्यक विस्तार के प्रस्तुत किया गया है।
- source_word: τῷ δούλῳ μου
  choice: अपने दास[a] से
  rationale: δοῦλος स्वामित्व या बँधी हुई अधीनस्थ स्थिति वाले व्यक्ति को सूचित कर सकता है। इस अधिकार-श्रृंखला के उदाहरण में वह स्थिति प्रासंगिक है, इसलिए ‘दास’ चुना गया है; व्यापक ‘सेवक’ अर्थ पादटिप्पणी में रखा गया है।
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘यह कर,’ और वह करता है
  rationale: यह अनुवाद आदेश और पालन की संक्षिप्त पुनरावृत्ति तथा वर्तमानकालीन उदाहरणात्मक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: सूबेदार की उपमा में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद का मुख्य बिन्दु अधिकार और अधीनता की श्रृंखला है, इसलिए ‘दास’ प्राचीन सामाजिक स्थिति को अधिक स्पष्टता से रखता है। फिर भी δοῦλος कुछ प्रसंगों में सामान्य घरेलू सेवक के लिए भी प्रयुक्त हो सकता है; इस सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है, न कि मुख्य पाठ में चुपचाप निर्णीत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। आज्ञाओं के लिए एकवचन ‘जा’, ‘आ’ और ‘कर’ मूल की सीधी सैन्य/गृहस्थ आदेश-शैली को व्यक्त करते हैं; इन्हें असम्मानजनक आधुनिक संबोधन के रूप में नहीं, पदानुक्रम के उदाहरण के रूप में पढ़ा जाना चाहिए।
