source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: hi
  text: पर तुम क्या देखने बाहर गए थे? मुलायम वस्त्र पहने हुए एक आदमी को? देखो, जो शानदार वस्त्र पहनते हैं और विलासिता में रहते हैं, वे राजमहलों में होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: पिछले आलंकारिक प्रश्न से विरोधात्मक संक्रमण को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: ἐξήλθατε ἰδεῖν
  choice: क्या देखने बाहर गए थे
  rationale: अनन्त क्रिया ἰδεῖν उद्देश्य बताती है और अओरिस्ट ἐξήλθατε बीते हुए बाहर जाने को; यह हिन्दी प्रश्न-विन्यास दोनों को स्वाभाविक रूप से रखता है।
- source_word: ἄνθρωπον
  choice: किसी आदमी को
  rationale: यहाँ एक पुरुष व्यक्ति का उल्लेख है; अनिश्चित प्रश्न में ‘किसी आदमी को’ स्वाभाविक है।
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: बढ़िया मुलायम कपड़े पहने हुए
  rationale: μαλακοῖς की ‘मुलायम’ छवि सुरक्षित रखते हुए ‘बढ़िया’ प्रसंगगत महीन और विलासी वस्त्रों का संकेत देता है; नैतिक दुर्बलता का अर्थ आरोपित नहीं करता।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले निर्देशात्मक अव्यय का आधुनिक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: भड़कीले वस्त्र पहनते
  rationale: ἐνδόξῳ यहाँ वैभवशाली, शानदार पहनावे को दर्शाता है; ‘भड़कीले’ दृश्य ऐश्वर्य और सामाजिक आडंबर को सामान्य हिन्दी में प्रकट करता है।
- source_word: τρυφῇ ὑπάρχοντες
  choice: विलासिता में रहते हैं
  rationale: संज्ञा τρυφή के विलासी जीवन और सुख-सुविधा के भाव को हिन्दी में स्पष्ट करता है।
- source_word: ἐν τοῖς βασιλείοις
  choice: राजमहलों में
  rationale: नपुंसकलिंग बहुवचन βασιλείοις राजकीय निवासों या महलों को सूचित करता है; बहुवचन सुरक्षित रखा गया है।
theological_decisions:
- issue: μαλακοῖς का प्रसंगगत अर्थ
  choice: महीन और मुलायम विलासी कपड़ों का ठोस उल्लेख
  alternative: नैतिक दुर्बलता या स्त्रैणता का संकेत
  rationale: अगले वाक्यांश में वैभवशाली पहनावे, विलासिता और राजमहलों का उल्लेख सामाजिक-आर्थिक विरोध को स्थापित करता है, न कि व्यक्ति के चरित्र या लैंगिक अभिव्यक्ति पर निर्णय को।
- issue: βασιλείοις का सामाजिक स्थान
  choice: राजमहल
  alternative: राजाओं के दरबार
  rationale: यूनानी शब्द राजकीय निवास अथवा महल को सीधे व्यक्त कर सकता है; ‘राजमहल’ स्थानगत अर्थ को स्पष्ट रखते हुए दरबारी संस्था का अतिरिक्त भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; यीशु के क्रमिक आलंकारिक प्रश्नों की लय रखी गई है। भाषा साधारण पाठक के लिए सहज किंतु गरिमापूर्ण है। ‘मुलायम’ मूल बिंब को और ‘बढ़िया’ उसके प्रसंगगत विलासी गुण को व्यक्त करता है।
