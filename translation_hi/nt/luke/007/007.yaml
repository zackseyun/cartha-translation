base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: hi
  text: इसी कारण मैंने अपने आपको आपके पास आने योग्य भी नहीं समझा। परन्तु बस एक शब्द कह दीजिए, और मेरा सेवक[a] चंगा हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा लड़का’ अथवा ‘मेरा बच्चा’; यूनानी शब्द प्रसंग के अनुसार बच्चे, युवक या सेवक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसी कारण
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οὐδὲ ἐμαυτὸν ἠξίωσα
  choice: मैंने अपने आपको ... योग्य भी नहीं समझा
  rationale: ‘भी नहीं’ नकार के बल को और आत्मवाचक रचना यूनानी ἐμαυτόν को सुरक्षित रखती है; ἠξίωσα का अर्थ यहाँ योग्य मानना है।
- source_word: πρὸς σὲ ἐλθεῖν
  choice: आपके पास आने
  rationale: व्यक्तिगत रूप से यीशु के पास आने का सीधा और आदरपूर्ण आधुनिक हिन्दी रूप।
- source_word: ἀλλὰ εἰπὲ λόγῳ
  choice: परन्तु वचन भर कह दीजिए
  rationale: ‘वचन भर’ इस बात पर बल देता है कि यीशु का अधिकारपूर्ण कथन ही पर्याप्त है; आदरसूचक आज्ञार्थ हिन्दी संवाद के अनुकूल है।
- source_word: ἰαθήτω
  choice: चंगा हो जाए
  rationale: यह तीसरे पुरुष का निष्क्रिय आज्ञार्थ है; यह अनुवाद उसे भविष्यवाणी में बदले बिना इच्छित परिणाम की आज्ञार्थक प्रार्थना व्यक्त करता है।
- source_word: ὁ παῖς μου
  choice: मेरा सेवक
  rationale: παῖς का अर्थ बालक, बच्चा या सेवक हो सकता है। सूबेदार के घराने और अधिकार के प्रसंग में ‘सेवक’ सर्वाधिक स्पष्ट है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: सूबेदार के कथन में παῖς का अर्थ
  choice: मेरा सेवक
  alternative: मेरा लड़का या मेरा बच्चा
  rationale: प्रसंग अधीनस्थ घरेलू व्यक्ति की ओर संकेत करता है, इसलिए ‘सेवक’ उपयुक्त है; फिर भी मूल शब्द में आयु या स्नेह का भाव सम्भव है, अतः उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἰαθήτω का क्रियार्थ
  choice: चंगा हो जाए
  alternative: चंगा हो जाएगा
  rationale: मूल रूप निष्क्रिय आज्ञार्थ है, भविष्यकालीन निश्चयवाचक नहीं। चुना हुआ रूप वक्ता के विश्वास को बनाए रखते हुए व्याकरणिक तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज संवाद रखा गया है। यीशु के लिए ‘आप’ और ‘कह दीजिए’ आदर व्यक्त करते हैं। ‘वचन भर’ अधिकारपूर्ण कथन की पर्याप्तता को संक्षेप में सामने लाता है।
