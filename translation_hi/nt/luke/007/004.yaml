  register: आधुनिक मानक हिन्दी; सम्मानसूचक ‘आप/उनसे’ का प्रयोग यीशु के प्रति संवाद के स्वाभाविक और गरिमापूर्ण स्तर को बनाए रखता है। वाक्य में निवेदन की तीव्रता स्पष्ट है, पर उसे ‘विनती’ या ‘गिड़गिड़ाना’ जैसे अधिक प्रबल शब्दों से नहीं बढ़ाया गया।
