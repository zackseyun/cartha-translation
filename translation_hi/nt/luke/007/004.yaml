  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: hi
  text: जब वे यीशु के पास पहुँचे, तो उन्होंने उनसे बहुत आग्रह से कहा, “वह इस योग्य है कि आप उसके लिए यह करें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: पहुँचे
  rationale: यह कृदन्त यीशु के पास आ पहुँचने को दर्शाता है; ‘पहुँचे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: παρεκάλουν
  choice: आग्रह करके
  rationale: यहाँ शब्द सम्मानपूर्ण किन्तु प्रबल निवेदन को व्यक्त करता है; ‘आग्रह’ अनुरोध और उसकी तीव्रता दोनों को सहज हिन्दी में रखता है।
- source_word: σπουδαίως
  choice: बहुत
  rationale: ‘बहुत आग्रह करके’ यूनानी क्रिया-विशेषण की गंभीरता और तत्परता को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
- source_word: Ἄξιός
  choice: इस योग्य
  rationale: यह वक्ताओं के इस आकलन को बनाए रखता है कि सूबेदार अनुरोधित उपकार पाने के योग्य है।
- source_word: ᾧ
  choice: उसके लिए
  rationale: सम्बन्धवाचक सर्वनाम सूबेदार की ओर संकेत करता है; हिन्दी में इसे ‘उसके लिए’ से स्पष्ट और सहज रूप मिलता है।
- source_word: παρέξῃ
  choice: आप ... करें
  rationale: παρέχω यहाँ अनुरोधित कार्य या उपकार करने का अर्थ देता है; ‘करें’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘प्रदान करें’ जैसा अमूर्त भाव नहीं लाता।
- source_word: τοῦτο
  choice: यह
  rationale: संकेतवाचक शब्द पिछले पद में बताए गए अनुरोध की ओर संकेत करता है; ‘यह’ मूल की संक्षिप्तता बनाए रखता है।
