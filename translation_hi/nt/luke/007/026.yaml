id: LUK.7.26
reference: Luke 7:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: hi
  text: पर तुम क्या देखने बाहर गए थे? एक भविष्यद्वक्ता? हाँ, मैं तुमसे कहता हूँ, और भविष्यद्वक्ता से भी बढ़कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले आलंकारिक प्रश्न के विपरीत अगला प्रश्न प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: तुम क्या देखने बाहर गए थे?
  rationale: τί को क्रिया के कर्म ‘क्या’ के रूप में और उद्देश्यवाचक ἰδεῖν को ‘देखने’ के रूप में रखा गया है; भूतकालीन बाहर जाने की क्रिया भी सुरक्षित है।
- source_word: προφήτην
  choice: किसी भविष्यद्वक्ता को?
  rationale: यह पिछले प्रश्न का लुप्त क्रियापद वाला उत्तरात्मक प्रश्न है। ‘किसी’ जोड़ने से हिन्दी में स्वाभाविक प्रश्न बनता है, बिना संज्ञा को उपाधि बनाने के।
- source_word: ναί, λέγω ὑμῖν
  choice: हाँ, मैं तुमसे कहता हूँ
  rationale: ναί की स्पष्ट पुष्टि और सुसमाचारों की प्रत्यक्ष संबोधन-विधि दोनों संरक्षित हैं।
- source_word: καὶ περισσότερον προφήτου
  choice: बल्कि ऐसे व्यक्ति को जो भविष्यद्वक्ता से भी बढ़कर है
  rationale: तुलनात्मक अभिव्यक्ति का आशय स्वाभाविक हिन्दी में व्यक्त होता है। ‘ऐसे व्यक्ति’ नपुंसकलिंगी περισσότερον के रूपगत प्रभाव को समझने योग्य बनाता है, जबकि यूहन्ना की व्यक्ति-संदर्भता स्पष्ट रहती है; ‘बढ़कर’ उसकी श्रेष्ठता का स्वरूप नहीं खोलता।
theological_decisions:
- issue: यीशु द्वारा यूहन्ना की भविष्यद्वक्ता से बढ़कर स्थिति
  choice: यूहन्ना को भविष्यद्वक्ता स्वीकार करते हुए ‘भविष्यद्वक्ता से भी बढ़कर’ कहा गया है, पर इस पद में उस बढ़कर होने का ठीक स्वरूप नहीं बताया गया।
  alternative: इसे ‘सबसे महान भविष्यद्वक्ता’ या विशिष्ट अंतकालीन दूत कहकर स्पष्ट करना।
  rationale: मूल वाक्य केवल तुलनात्मक दावा करता है। निकटवर्ती संदर्भ आगे उसका अर्थ खोलता है, पर इस पद में वह व्याख्या जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, बोलचाल में समझ आने योग्य और फिर भी गरिमापूर्ण रखी गई है। ‘भविष्यद्वक्ता’ बाइबिलीय हिन्दी में प्रचलित और सटीक पद है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि हिन्दी का ‘भविष्यद्वक्ता से भी बढ़कर’ मूल तुलना को सहज और पर्याप्त रूप से सुरक्षित रखता है।
