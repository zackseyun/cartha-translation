base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: hi
  text: और पास आकर उसने अर्थी[a] को छुआ। उसे उठाए हुए लोग रुक गए। तब उसने कहा, “हे युवक, मैं तुझसे कहता हूँ, उठ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताबूत” अथवा “शव ले जाने की चौकी।” यूनानी शब्द शवयात्रा में शव को ले जाने के लिए प्रयुक्त अर्थी या ढाँचे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आकर
  rationale: यह यीशु के अर्थी के निकट आने और फिर उसे छूने का क्रम स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἥψατο
  choice: छुआ
  rationale: संदर्भ में क्रिया का सामान्य अर्थ ‘छूना’ है; ‘पकड़ा’ कहना मूल से अधिक प्रबल कार्रवाई का संकेत दे सकता है।
- source_word: σοροῦ
  choice: अर्थी
  rationale: यह शव को अंतिम यात्रा में ले जाने के लिए प्रयुक्त खुले ढाँचे या शववाहक चौकी को स्वाभाविक और ऐतिहासिक रूप से उपयुक्त हिन्दी में व्यक्त करता है; आधुनिक बंद ‘ताबूत’ आवश्यकतः अभिप्रेत नहीं है।
- source_word: οἱ δὲ βαστάζοντες
  choice: उसे उठाए हुए लोग
  rationale: यह कर्ताओं और उनके द्वारा अर्थी उठाए होने को सामान्य पाठक के लिए स्पष्ट करता है, बिना केवल पुरुष होने की ऐसी स्पष्टता जो यूनानी कृदंत में व्याकरणिक रूप से आवश्यक नहीं।
- source_word: ἔστησαν
  choice: रुक गए
  rationale: इस प्रसंग में इसका अर्थ चलती शवयात्रा में ठहर जाना है; आधुनिक हिन्दी में ‘रुक गए’ सहज और सटीक है।
- source_word: Νεανίσκε
  choice: हे जवान
  rationale: सम्बोधन एक युवा पुरुष से है। ‘हे जवान’ प्रत्यक्ष सम्बोधन और प्रसंग की गरिमा बनाए रखता है।
- source_word: σοὶ λέγω
  choice: मैं तुझसे कहता हूँ
  rationale: स्पष्ट सर्वनाम के बल और सीधे, व्यक्तिगत सम्बोधन को सुरक्षित रखता है।
- source_word: ἐγέρθητι
  choice: उठ
  rationale: आज्ञार्थक रूप को सीधा और स्वाभाविक रखता है। रूप व्याकरणतः निष्क्रिय हो सकता है, पर इस प्रसंग में प्रत्यक्ष आज्ञा के रूप में ‘उठ’ सर्वाधिक सहज है और पुनर्जीवन की व्याख्या अलग से नहीं जोड़ता।
theological_decisions:
- issue: मृत जवान को यीशु की आज्ञा का स्वर
  choice: “मैं तुझसे कहता हूँ, उठ!”
  alternative: “मैं तुझसे कहता हूँ, जी उठ!” अथवा “उठाया जा!”
  rationale: ‘उठ’ मूल की सीधी आज्ञा, संक्षिप्तता और अधिकारपूर्ण स्वर को बनाए रखता है। ‘जी उठ’ चमत्कार का आशय स्पष्ट करता, पर मूल क्रिया में ‘जी’ जोड़ता; ‘उठाया जा’ हिन्दी में अस्वाभाविक है और प्रत्यक्ष आज्ञा की शक्ति घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘अर्थी’ सामान्य पाठक के लिए ‘शववाहक चौकी’ से अधिक स्वाभाविक और आधुनिक बंद ताबूत से अधिक ऐतिहासिक रूप से उपयुक्त है। प्रत्यक्ष वचन में ‘तुझसे’ प्रसंगानुकूल एकवचन सम्बोधन और अधिकारपूर्ण निकटता व्यक्त करता है।
