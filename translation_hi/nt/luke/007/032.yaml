  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: hi
  text: वे उन बच्चों के समान हैं जो बाज़ार में बैठे हैं और एक-दूसरे को पुकारकर कहते हैं, “हमने तुम्हारे लिए बाँसुरी बजाई, पर तुम नहीं नाचे; हमने विलाप किया[a], पर तुम नहीं रोए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमने शोकगीत गाया।” यूनानी शब्द विलाप करने को दर्शा सकता है, जिसमें अंत्येष्टि का शोकगीत भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: वे ... के समान हैं
  rationale: यह तुलना का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις
  choice: उन बच्चों ... जो बाज़ार में बैठे हैं
  rationale: παιδίοις को बिना आयु या लिंग का अनावश्यक निर्धारण किए ‘बच्चों’ और ἀγορά को सार्वजनिक बाज़ार के रूप में व्यक्त किया गया है।
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: एक-दूसरे को पुकारकर
  rationale: यह संबोधन की ऊँची/सुनाई देने वाली पुकार तथा पारस्परिकता, दोनों को सहज हिन्दी में रखता है।
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: हमने तुम्हारे लिए बाँसुरी बजाई
  rationale: αὐλέω किसी बाँसुरी या पाइप-जैसे वाद्य को बजाने के लिए विशिष्ट है; ‘बाँसुरी बजाई’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: οὐκ ὠρχήσασθε
  choice: तुम नहीं नाचे
  rationale: क्रिया का सीधा और स्वाभाविक भूतकालीन अनुवाद है।
- source_word: ἐθρηνήσαμεν
  choice: हमने विलाप किया
  rationale: θρηνέω शोक-विलाप करने या शोकगीत गाने को सूचित कर सकता है; मुख्य पाठ में संक्षिप्त स्वाभाविक रूप रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὐκ ἐκλαύσατε
  choice: तुम नहीं रोए
  rationale: κλαίω का सामान्य आधुनिक हिन्दी समतुल्य ‘रोना’ है और यह बच्चों के दृश्य में सहज रहता है।
theological_decisions:
- issue: बच्चों के दो विपरीत खेलों की दृष्टान्तात्मक शक्ति
  choice: ठोस क्रियाएँ रखना—बाँसुरी बजाना, नाचना, विलाप करना और रोना
  alternative: इनका अर्थ खोलकर ‘आनन्द मनाना’ और ‘शोक मनाना’ कहना
  rationale: पद स्वयं चित्र प्रस्तुत करता है, उसका अनुप्रयोग नहीं समझाता; इसलिए ठोस बिंब रखना व्याख्यात्मक निष्कर्ष आरोपित करने से बचाता है।
- issue: θρηνέω की अर्थ-सीमा
  choice: मुख्य पाठ में ‘विलाप किया’
  alternative: ‘शोकगीत गाया’
  rationale: यूनानी क्रिया सामान्य विलाप और गाए जाने वाले अंत्येष्टि-विलाप दोनों को व्यक्त कर सकती है; पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, मौखिक रूप से सहज और गरिमापूर्ण। ‘बाज़ार’ सार्वजनिक चौक/बाज़ार के दृश्य को पर्याप्त रूप से व्यक्त करता है। प्रत्यक्ष कथन में बहुवचन ‘तुम’ मूल यूनानी के बहुवचन को बनाए रखता है।
