    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य घटना-आरंभ करने वाली कथात्मक अभिव्यक्ति है। ‘ऐसा हुआ कि’ उसके कार्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ἑξῆς
  choice: अगले दिन
  rationale: दिए गए SBLGNT पाठ और संदर्भ के अनुसार यह अगले समय, यहाँ अगले दिन, की ओर संकेत करता है; पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: ἐπορεύθη
  choice: गया
  rationale: πορεύομαι के सामान्य गतिसूचक अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς πόλιν
  choice: एक नगर में
  rationale: πόλις नगर या शहर हो सकता है। नाइन जैसी छोटी बस्ती के लिए ‘नगर’ उपयुक्त है, और ‘में’ εἰς के गंतव्य-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καλουμένην Ναΐν
  choice: नाइन नामक
  rationale: स्थान के नाम को देवनागरी में लिप्यंतरित करते हुए καλουμένην को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: συνεπορεύοντο
  choice: उसके साथ जा रहे थे
  rationale: अपूर्ण भूतकाल की जारी संग-साथ गति को बनाए रखता है; केवल ‘साथ थे’ कहने की अपेक्षा यात्रा का भाव भी स्पष्ट करता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: μαθηταί के लिए ‘शिष्य’ आधुनिक, सम्मानपूर्ण और सुस्पष्ट हिन्दी शब्द है।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: ὄχλος को ‘भीड़’ और πολύς को उसके बड़े आकार के रूप में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
