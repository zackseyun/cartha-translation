- from: वे पुरुष यीशु के पास आकर बोले, “यूहन्ना बपतिस्मा देनेवाले ने हमें आपके पास यह पूछने भेजा है, ‘क्या आप वही हैं जो आनेवाले हैं,[a] या हम किसी और की प्रतीक्षा करें?’”
  to: जब वे आदमी यीशु के पास आए, तो उन्होंने कहा, “यूहन्ना बपतिस्मा देनेवाले ने हमें आपके पास यह पूछने भेजा है, ‘क्या आप ही वह हैं जो आनेवाला है,[a] या हम किसी और की प्रतीक्षा करें?’”
  rationale: Revision improves modern Hindi idiom and resolves the singular definite sense of ὁ ἐρχόμενος without imposing a doctrinal identification. The reported question, respectful address, and the original’s open contrast with “another” are retained.
