reference: Luke 7:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: hi
  text: जब वे आदमी यीशु के पास आए, तो उन्होंने कहा, “यूहन्ना बपतिस्मा देनेवाले ने हमें आपके पास यह पूछने भेजा है, ‘क्या आप ही वह हैं जो आनेवाला है,[a] या हम किसी और की प्रतीक्षा करें?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या आप ही आनेवाले हैं?”
    reason: ‘आनेवाले’ ὁ ἐρχόμενος को उपाधि-जैसे, अपेक्षित व्यक्ति के पद के रूप में व्यक्त करता है; मुख्य पाठ उसके वर्णनात्मक अर्थ को अधिक स्पष्ट रखता है।
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: यीशु के पास आकर
  rationale: कृदन्त के परिस्थितिसूचक अर्थ और πρός की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भ से αὐτόν यीशु है; नाम का प्रयोग हिन्दी में सर्वनाम-संदेह दूर करता है।
- source_word: οἱ ἄνδρες
  choice: वे पुरुष
  rationale: ἀνήρ के पुरुष-वाचक अर्थ को बनाए रखता है और पहले उल्लिखित दूतों की ओर संकेत करता है।
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: यूहन्ना बपतिस्मा देनेवाला
  rationale: βαπτιστής के कार्यसूचक अर्थ को प्रचलित, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: हमें आपके पास यह पूछने भेजा है
  rationale: λέγων यहाँ भेजे गए संदेश का परिचय देता है; प्रश्न होने के कारण ‘यह पूछने’ स्वाभाविक है, जबकि पूर्ण क्रिया भेजने की वर्तमान प्रासंगिकता दर्शाती है।
- source_word: ὁ ἐρχόμενος
  choice: वही हैं जो आनेवाले हैं
  rationale: पदबंध की अपेक्षित/मसीही प्रतिध्वनि को बनाए रखते हुए इसे सहज हिन्दी में रखता है और सीधे ‘मसीह’ कहकर आशय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἄλλον προσδοκῶμεν
  choice: हम किसी और की प्रतीक्षा करें
  rationale: προσδοκάω में किसी अपेक्षित व्यक्ति की बाट देखने का भाव है; ‘प्रतीक्षा करें’ प्रश्न की स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ὁ ἐρχόμενος का मसीही या युगांत-संबंधी संकेत
  choice: वही हैं जो आनेवाले हैं
  alternative: आनेवाला
  rationale: चुना हुआ रूप संभावित उपाधिसूचक बल और शाब्दिक क्रिया—दोनों को सुनाई देता रहने देता है, पर उसे स्पष्ट रूप से ‘मसीह’ कहकर व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थक ‘आप’ और ‘आपके’ संदर्भानुकूल हैं। वाक्य प्रवाह सहज रखा गया है, जबकि मूल प्रश्न की अनिश्चितता और मसीही प्रतिध्वनि सुरक्षित हैं।
