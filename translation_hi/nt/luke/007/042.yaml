lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: जब उनके पास चुकाने के लिए कुछ नहीं था
  rationale: यह संबंधवाचक निरपेक्ष रचना उस परिस्थिति को बताती है जिसमें दोनों देनदार ऋण चुकाने में असमर्थ थे। यह हिन्दी सहज है और प्रसंग में निहित आर्थिक असमर्थता को स्पष्ट करती है।
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: उसने दोनों का ऋण कृपापूर्वक क्षमा कर दिया
  rationale: χαρίζομαι में अनुग्रहपूर्वक देने अथवा देय राशि छोड़ देने का भाव है। ऋण का स्पष्ट उल्लेख वित्तीय प्रसंग को बनाए रखता है, जबकि 'कृपापूर्वक क्षमा कर दिया' अनुग्रह और ऋण-मुक्ति दोनों अर्थों को व्यक्त करता है।
- source_word: τίς οὖν αὐτῶν
  choice: इसलिए उनमें से कौन
  rationale: οὖν पिछले कथन से निकलने वाले निष्कर्ष को सूचित करता है; 'इसलिए' आधुनिक मानक हिन्दी में इस तार्किक संबंध को स्पष्ट रखता है।
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: उससे अधिक प्रेम करेगा
  rationale: πλεῖον तुलनात्मक मात्रा 'अधिक' को और ἀγαπήσει भविष्यकालीन 'प्रेम करेगा' को स्वाभाविक तथा सीधी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ऋण के प्रसंग में χαρίζομαι का अनुवाद
  choice: दोनों का ऋण कृपापूर्वक क्षमा कर दिया
  alternative: दोनों के ऋण माफ़ कर दिए
  rationale: चुना हुआ पाठ तत्काल वित्तीय अर्थ और व्यापक क्षमा-अनुग्रह की प्रतिध्वनि दोनों को बनाए रखता है, पर किसी विशेष धर्मसैद्धांतिक व्याख्या को आरोपित नहीं करता।
