id: LUK.7.45
reference: Luke 7:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: hi
  text: तुमने मुझे चुम्बन नहीं दिया[a], परन्तु जब से मैं भीतर आया, इस स्त्री ने मेरे पाँवों को चूमना नहीं छोड़ा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वागत का चुम्बन”; चुम्बन आतिथ्य और अभिवादन की एक प्रचलित रीति थी।
    reason: cultural_note
  - marker: b
    text: 'मूल क्रिया स्नेहपूर्वक या बार-बार चूमने का भाव दे सकती है: “मेरे पाँवों को चुम्बनों से ढाँपना नहीं छोड़ा है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: चुम्बन
  rationale: यह संज्ञा यहाँ स्वागत में दिए जाने वाले चुम्बन को सूचित करती है। मुख्य पाठ में सरल ‘चुम्बन’ मूल की संक्षिप्तता बनाए रखता है; सांस्कृतिक आशय पाद-टिप्पणी में दिया गया है।
- source_word: μοι
  choice: मुझे
  rationale: सम्प्रदान कारक सर्वनाम ἔδωκας का अप्रत्यक्ष कर्म है; हिन्दी में ‘मुझे चुम्बन नहीं दिया’ स्वाभाविक है।
- source_word: ἔδωκας
  choice: दिया
  rationale: δίδωμι का सीधा अर्थ ‘देना’ है और चुम्बन देने की हिन्दी अभिव्यक्ति भी स्वाभाविक है।
- source_word: αὕτη δὲ
  choice: परन्तु ... इसने
  rationale: αὕτη उस स्त्री की ओर संकेत करते हुए शमौन के व्यवहार से स्पष्ट विरोध दिखाता है। निकट उपस्थित स्त्री के लिए ‘इसने’ स्वाभाविक और संकेतात्मक है।
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: जब से मैं भीतर आया हूँ, तब से
  rationale: यह पदबंध आरम्भ-बिन्दु से वर्तमान कथन-क्षण तक की अवधि बताता है। ‘जब से...तब से’ हिन्दी में इस निरन्तरता को स्पष्ट करता है।
- source_word: οὐ διέλιπεν
  choice: नहीं छोड़ा है
  rationale: διαλείπω का अर्थ रुकना या छोड़ देना है। पूर्ण वर्तमान रूप उस कार्य को प्रवेश के समय से बोलने के समय तक जारी दिखाता है।
- source_word: καταφιλοῦσά
  choice: चूमना
  rationale: καταφιλέω में स्नेहपूर्वक अथवा बार-बार चूमने का बल हो सकता है। मुख्य पाठ में स्वाभाविक ‘चूमना’ रखा गया है और प्रबल पुनरावृत्त अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: μου τοὺς πόδας
  choice: मेरे पाँव
  rationale: मूल में बहुवचन स्पष्ट है; ‘मेरे पाँव’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: स्वागत के चुम्बन का आतिथ्य-संबंधी सांस्कृतिक आशय
  choice: मुख्य पाठ में केवल ‘चुम्बन’ रखकर प्रथा की जानकारी पाद-टिप्पणी में देना
  alternative: ‘स्वागत का चुम्बन’ मुख्य पाठ में जोड़ना
  rationale: मूल यूनानी केवल क्रिया का उल्लेख करता है, जबकि प्रसंग में वह आतिथ्य की प्रथा से जुड़ी है। मुख्य पाठ को अनावश्यक व्याख्या से मुक्त रखते हुए सांस्कृतिक अर्थ पाद-टिप्पणी में सुरक्षित किया गया है।
- issue: καταφιλέω की तीव्रता और पुनरावृत्ति
  choice: मुख्य पाठ में ‘चूमना नहीं छोड़ा’ और पाद-टिप्पणी में ‘बार-बार/चुम्बनों से ढाँपना’
  alternative: मुख्य पाठ में ‘मेरे पाँवों को चुम्बनों से ढाँपना नहीं छोड़ा’
  rationale: सहायक क्रिया ‘नहीं छोड़ा’ निरन्तरता को पहले ही व्यक्त करती है, पर καταφιλέω का अधिक स्नेहपूर्ण या पुनरावृत्त बल वास्तविक है; उसे पाद-टिप्पणी में बताया गया है, किसी एक सूक्ष्म अर्थ को अनिवार्य बनाए बिना।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परन्तु’ विरोध को स्पष्ट रखता है; ‘इसने’ प्रसंग में उपस्थित स्त्री की ओर αὕτη के संकेत को बनाए रखता है। पाद-टिप्पणी चिह्न [a] और [b] मुख्य पाठ में संबंधित स्थानों पर दिए गए हैं।
