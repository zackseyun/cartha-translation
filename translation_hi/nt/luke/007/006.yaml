source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: hi
  text: तब यीशु उनके साथ जा रहे थे। पर जब वे घर से अधिक दूर नहीं थे, तो सूबेदार ने यीशु के पास अपने मित्रों को यह कहकर भेजा, “प्रभु[a], अपने को कष्ट न दीजिए, क्योंकि मैं इस योग्य[b] नहीं हूँ कि आप मेरी छत के नीचे आएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε एक सम्मानपूर्ण संबोधन हो सकता है और यीशु के अधिकार की पहचान का संकेत भी दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या “उपयुक्त” अथवा “पर्याप्त।” यूनानी शब्द पर्याप्तता, उपयुक्तता या योग्यता व्यक्त कर सकता है; यहाँ यह सूबेदार की विनम्रता प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: चल दिया
  rationale: अपूर्णकालीन क्रिया यीशु के उनके साथ आगे बढ़ने को बताती है। ‘चल दिया’ प्रसंग में स्वाभाविक है और गति का भाव बनाए रखता है।
- source_word: σὺν αὐτοῖς
  choice: उनके साथ
  rationale: यह साथ जाने के अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: जब वह घर से अब अधिक दूर नहीं था
  rationale: यह काल-सूचक संबंध और मूल के ‘दूर नहीं’ वाले नकारात्मक रूप, दोनों को बनाए रखता है।
- source_word: ἔπεμψεν φίλους
  choice: अपने मित्रों को ... भेजा
  rationale: φίλους का सीधा अर्थ ‘मित्रों’ है; स्वामित्व हिंदी में संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὁ ἑκατοντάρχης
  choice: सूबेदार
  rationale: हिंदी बाइबलीय प्रयोग में यह सौ सैनिकों के रोमी अधिकारी के लिए परिचित पद है, यद्यपि आधुनिक भारतीय सैन्य पद से इसका पूर्ण ऐतिहासिक साम्य नहीं है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह κύριε के सम्मानपूर्ण संबोधन को सुरक्षित रखता है और यीशु के अधिकार की संभावित गहरी पहचान को केवल ‘महोदय’ तक सीमित नहीं करता।
- source_word: μὴ σκύλλου
  choice: कष्ट न उठाइए
  rationale: इस प्रसंग में क्रिया का मुहावरेदार अर्थ स्वयं को परेशानी या कष्ट देना है; आदरसूचक रूप संबोधन के अनुरूप है।
- source_word: ἱκανός εἰμι
  choice: मैं इस योग्य नहीं हूँ
  rationale: ἱκανός पर्याप्तता, उपयुक्तता या योग्यता बता सकता है। यहाँ यह अधिकारी की विनम्रता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἵνα ... εἰσέλθῃς
  choice: कि आप ... आएँ
  rationale: यह आश्रित उपवाक्य उस बात को स्पष्ट करता है जिसके लिए अधिकारी स्वयं को योग्य नहीं मानता।
- source_word: ὑπὸ τὴν στέγην μου
  choice: मेरी छत के नीचे
  rationale: मूल की सजीव गृह-छवि को सुरक्षित रखता है; केवल ‘मेरे घर में’ कहना उस छवि को मिटा देता।
theological_decisions:
- issue: यीशु के लिए प्रत्यक्ष संबोधन κύριε
  choice: प्रभु
  alternative: महोदय
  rationale: संदर्भ में यह सम्मानसूचक संबोधन हो सकता है, साथ ही यीशु के अधिकार की पहचान भी सूचित कर सकता है। ‘प्रभु’ दोनों संभावनाओं को खुला रखता है और इसे अनिवार्य रूप से पूर्ण विकसित मसीही अंगीकार नहीं बनाता।
- issue: ἱκανός में योग्यता और पर्याप्तता का संबंध
  choice: योग्य
  alternative: उपयुक्त / समर्थ
  rationale: अधिकारी की विनम्रता के संदर्भ में ‘योग्य’ सबसे स्वाभाविक है, पर पादटिप्पणी मूल शब्द में निहित पर्याप्तता या उपयुक्तता के व्यापक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, आदरसूचक और सहज मानक हिंदी अपनाई गई है। यीशु के लिए ‘आप’ और संबोधन के अनुरूप बहुवचन-आदरसूचक क्रियाएँ प्रयुक्त हैं। ‘मेरी छत के नीचे’ मूल मुहावरे की ठोस छवि बनाए रखता है। पादटिप्पणी-चिह्न संबंधित शब्दों ‘प्रभु’ और ‘योग्य’ पर लगाए गए हैं।
