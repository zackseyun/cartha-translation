  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: hi
  text: और धन्य है वह, जो मेरे कारण ठोकर न खाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो मुझसे बुरा न माने” अथवा “जो मेरे कारण विश्वास से न हटे।”
    reason: σκανδαλισθῇ और ἐν ἐμοί की सम्भव अर्थ-छायाएँ बताने के लिए।
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: ‘धन्य’ यीशु के धन्यता-वचनों में शब्द के धार्मिक और परमेश्वर-संबंधी भार को स्वाभाविक हिन्दी में बनाए रखता है; ‘सुखी’ यहाँ अपेक्षाकृत हल्का पड़ता।
- source_word: ὃς ἐὰν μὴ
  choice: वह, जो ... न
  rationale: यह सामान्य शर्त वाले एक प्रतिनिधि व्यक्ति को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: σκανδαλισθῇ
  choice: ठोकर न खाए
  rationale: यह ठोकर खाने के रूपक को सुरक्षित रखता है और अर्थ को केवल भावनात्मक ‘बुरा मानने’ या निश्चित रूप से विश्वास-त्याग तक सीमित नहीं करता। हिन्दी में यह यूनानी निष्क्रिय रूप का यांत्रिक अनुवाद करने की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἐν ἐμοί
  choice: मेरे कारण
  rationale: इस प्रसंग में ἐν ἐμοί यीशु को ठोकर का अवसर या कारण मानने का भाव देता है; ‘मुझ में’ अस्पष्ट और अस्वाभाविक होता।
theological_decisions:
- issue: यीशु के कारण ठोकर खाने के भाव की व्याख्यात्मक सीमा
  choice: ठोकर के रूपक को मुख्य पाठ में बनाए रखा
  alternative: ‘मुझसे बुरा न माने’ अथवा ‘मेरे कारण विश्वास से न हटे’
  rationale: मूल क्रिया में अप्रसन्न या आहत होने से बढ़कर आध्यात्मिक रूप से लड़खड़ाने की संभावना है, पर इसे स्पष्टतः विश्वास-त्याग कहना अर्थ को अनावश्यक रूप से तय कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘धन्य’ बाइबलीय धार्मिक भाव रखता है, जबकि ‘ठोकर न खाए’ मूल रूपक और उसकी जानबूझकर बनी अर्थगत व्यापकता को सुरक्षित रखता है।
