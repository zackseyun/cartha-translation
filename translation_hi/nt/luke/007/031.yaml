  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: hi
  text: “तो मैं इस पीढ़ी के लोगों की तुलना किससे करूँ? वे किसके समान हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: मैं ... तुलना किससे करूँ
  rationale: यूनानी प्रश्नवाचक वाक्यांश का स्वाभाविक और अर्थ-सटीक हिन्दी रूप; प्रथम पुरुष और विचारात्मक प्रश्न दोनों सुरक्षित हैं।
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी के लोगों
  rationale: ἄνθρωποι यहाँ सामान्यतः लोगों/मनुष्यों के लिए है, केवल पुरुषों के लिए नहीं; ‘इस पीढ़ी’ समकालीन समूह की ओर संकेत बनाए रखता है।
- source_word: καὶ τίνι εἰσὶν ὅμοιοι
  choice: वे किसके समान हैं?
  rationale: दूसरे समानांतर प्रश्न को स्पष्ट और स्वाभाविक हिन्दी में स्वतंत्र प्रश्न के रूप में रखा गया है।
- source_word: οὖν
  choice: तो
  rationale: पूर्ववर्ती प्रसंग से निकले निष्कर्ष अथवा संक्रमण को संक्षेप में व्यक्त करता है।
