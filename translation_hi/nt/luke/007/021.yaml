  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: hi
  text: उस घड़ी[a] उसने बहुतों को रोगों, पीड़ाओं[b] और दुष्ट आत्माओं से चंगा किया, और बहुत-से अंधों को दृष्टि प्रदान की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी घड़ी।” यूनानी अभिव्यक्ति उस क्षण की तात्कालिकता पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “घोर कष्टों।” यूनानी शब्द का शाब्दिक अर्थ “कोड़े” है, पर इसका प्रयोग गंभीर शारीरिक पीड़ा या विपत्ति के लिए भी होता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उन्हें देखने के लिए अनुग्रहपूर्वक दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उस घड़ी
  rationale: यह अनुवाद यूनानी पदबंध की समय-संबंधी विशिष्टता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: सुसमाचारों में अलौकिक आरोग्य के प्रसंग में θεραπεύω के लिए यह प्रचलित, स्पष्ट और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: πολλοὺς
  choice: बहुतों को
  rationale: यूनानी में कर्म के रूप में व्यक्तियों का उल्लेख निहित है; हिन्दी में ‘बहुतों को’ अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἀπὸ νόσων
  choice: रोगों से
  rationale: ἀπό रोगों से मुक्ति या अलग किए जाने का भाव देता है; ‘से’ इस संबंध को सीधे व्यक्त करता है।
- source_word: μαστίγων
  choice: पीड़ाओं
  rationale: μάστιξ का शाब्दिक अर्थ कोड़ा है, पर यहाँ इसका विस्तारित अर्थ तीव्र शारीरिक कष्ट या व्याधिजन्य पीड़ा है। ‘पीड़ाओं’ आधुनिक पाठक के लिए स्पष्ट रहते हुए इस व्यापकता को सुरक्षित रखता है।
- source_word: πνευμάτων πονηρῶν
  choice: दुष्ट आत्माओं
  rationale: विशेषण πονηρός का सीधा अर्थ ‘दुष्ट’ है; अतः यह ‘अशुद्ध आत्माओं’ की अपेक्षा मूल शब्दावली को अधिक ठीक से दर्शाता है।
- source_word: τυφλοῖς πολλοῖς
  choice: बहुत-से अंधों को
  rationale: सम्प्रदान कारक उन लोगों को सूचित करता है जिन्हें दृष्टि मिली। यह अभिव्यक्ति लिंग को अनावश्यक रूप से सीमित नहीं करती।
- source_word: ἐχαρίσατο
  choice: प्रदान की
  rationale: χαρίζομαι उदारतापूर्वक या अनुग्रहपूर्वक देने का भाव रखता है। ‘प्रदान की’ लाभकारी उपहार के इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βλέπειν
  choice: दृष्टि
  rationale: शाब्दिक रूप ‘देखना’ है, पर हिन्दी में ‘दृष्टि प्रदान की’ अधिक स्वाभाविक है और देखने की क्षमता मिलने का वही अर्थ देता है।
theological_decisions:
- issue: दुष्ट आत्माओं से संबंधित यीशु के कार्य का स्वरूप
  choice: ‘दुष्ट आत्माओं’ को वास्तविक आत्मिक शक्तियों के रूप में प्रस्तुत किया गया है, जिन पर यीशु अधिकार रखता है।
  alternative: इस पदबंध को केवल मानसिक या शारीरिक रोगों का रूपक मानना।
  rationale: πνευμάτων πονηρῶν दुष्ट आत्माओं के लिए सीधी यूनानी अभिव्यक्ति है। अनुवाद पाठ के आत्मिक आशय को बनाए रखता है और उसे आधुनिक चिकित्सकीय श्रेणियों में घटाकर नहीं देखता।
- issue: ἐχαρίσατο में अनुग्रहपूर्ण देने का भाव
  choice: ‘दृष्टि प्रदान की’ द्वारा लाभकारी और उदार दान का भाव रखा गया है।
  alternative: केवल ‘दिखाई देने लगा’ कहना, जिसमें कर्ता के अनुग्रहपूर्ण कार्य का भाव मंद पड़ सकता है।
  rationale: मध्यवाच्य χαρίζομαι स्वतंत्र और कृपापूर्ण रूप से देने का अर्थ रखता है; फिर भी अनुवाद किसी विशिष्ट धर्मसैद्धांतिक प्रणाली को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘चंगा किया’ बाइबिलीय प्रसंग में व्यापक रूप से समझा जाता है, जबकि वाक्य-संरचना को सामान्य पाठक के लिए सरल रखा गया है।
