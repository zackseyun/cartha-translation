  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: hi
  text: 'यह वही है जिसके विषय में लिखा है:


    “देख, मैं अपने दूत[b] को तेरे आगे[a] भेजता हूँ,


    जो तेरे आगे तेरा मार्ग तैयार करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरे मुख के आगे”; अर्थात “तेरे आगे।”
    reason: lexical_alternative
  - marker: b
    text: “दूत” के लिए प्रयुक्त यूनानी शब्द का अर्थ “स्वर्गदूत” भी हो सकता है, पर यहाँ वह मानवीय संदेशवाहक यूहन्ना को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: यही वह है
  rationale: यह पदबंध यूहन्ना की ओर संकेत करने वाले बलयुक्त निर्देशवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περὶ οὗ γέγραπται
  choice: जिसके विषय में लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण की प्रचलित और गरिमापूर्ण हिन्दी शैली है तथा यूनानी पूर्णकालिक कर्मवाच्य के वर्तमान प्रासंगिक परिणाम को बनाए रखती है।
- source_word: Ἰδοὺ
  choice: देख
  rationale: यह भविष्यद्वाणी के उद्धरण में ध्यान आकर्षित करने वाला गंभीर आदेश है; आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: ἀποστέλλω
  choice: भेजता हूँ
  rationale: यूनानी वर्तमान काल की सजीव भविष्यद्वाणी को हिन्दी का सामान्य वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄγγελόν
  choice: दूत
  rationale: शब्द का मूल अर्थ संदेशवाहक है और यहाँ उसका संदर्भ एक मानवीय भेजे हुए व्यक्ति, यूहन्ना, से है; ‘स्वर्गदूत’ कहना भ्रामक होगा।
- source_word: πρὸ προσώπου σου
  choice: तेरे आगे
  rationale: मुहावरे का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘तेरे मुख के आगे’ का ठोस शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: κατασκευάσει
  choice: तैयार करेगा
  rationale: आने वाले कार्य के रूप में मार्ग को तैयार करने का अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὴν ὁδόν σου
  choice: तेरा मार्ग
  rationale: ‘मार्ग’ भविष्यद्वाणी की गरिमा और वास्तविक तथा रूपक दोनों संभावनाओं को बनाए रखता है।
- source_word: ἔμπροσθέν σου
  choice: तेरे सामने
  rationale: यह अंतिम स्थानवाचक पदबंध को पहले वाले ‘तेरे आगे’ से हल्के रूप में अलग रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: मलाकी/निर्गमन-सदृश उद्धरण को यीशु द्वारा यूहन्ना पर और अपने संबंध में लागू करना
  choice: द्वितीय पुरुष के सर्वनामों—‘तेरे’, ‘तेरा’—को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: यह स्पष्ट जोड़ना कि दूत प्रभु या मसीह का मार्ग तैयार करता है
  rationale: यूनानी पाठ स्वयं पहचान की व्याख्या नहीं जोड़ता। सर्वनामों को ज्यों का त्यों रखने से यीशु द्वारा उद्धरण के प्रयोग का धर्मवैज्ञानिक बल और तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भविष्यद्वाणी के उद्धरण में ‘देख’, ‘दूत’ और ‘मार्ग’ जैसे संक्षिप्त साहित्यिक शब्द रखे गए हैं। ‘तेरे’ का प्रयोग उद्धरण की प्रत्यक्ष संबोधन-शैली को बनाए रखता है।
