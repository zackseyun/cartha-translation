reference: Luke 7:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: hi
  text: 'और उसने उन्हें उत्तर दिया, “जाकर यूहन्ना को बता दो कि तुमने क्या-क्या देखा और सुना है: अंधे दृष्टि पाते हैं[a], लँगड़े चलते हैं, कोढ़ी शुद्ध किए जाते हैं, बहरे सुनते हैं, मरे हुए जिलाए जाते हैं, और गरीबों को शुभ समाचार सुनाया जाता है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंधे फिर से देखने लगते हैं।” यूनानी क्रिया का अर्थ दृष्टि वापस पाना या ऊपर देखना हो सकता है; यहाँ आशय देखने की क्षमता पाने से है।
    reason: lexical_alternative
  - marker: b
    text: 'या, “गरीबों को सुसमाचार सुनाया जाता है।” यूनानी वाक्य कर्मवाच्य है: गरीबों को शुभ समाचार सुनाया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उसने ... उत्तर दिया
  rationale: ग्रीक कृदंत उत्तर देने की क्रिया से मुख्य कथन को जोड़ता है। आधुनिक हिन्दी में ‘उसने उन्हें उत्तर दिया’ स्वाभाविक रूप से वही प्रत्युत्तर-संबंध व्यक्त करता है।
- source_word: Πορευθέντες
  choice: जाकर
  rationale: यह कृदंत अगले आदेश के साथ सहायक क्रिया की तरह काम करता है; ‘जाकर ... बता दो’ हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἀπαγγείλατε
  choice: बता दो
  rationale: संदेशवाहकों को अपने देखे-सुने का वृत्तांत यूहन्ना तक पहुँचाना है। ‘बता दो’ साधारण आधुनिक हिन्दी में स्पष्ट है और लौटकर सूचना देने का भाव रखता है।
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: कि तुमने क्या-क्या देखा और सुना है
  rationale: ‘क्या-क्या’ अनेक देखी-सुनी बातों की ओर संकेत करता है, और पूर्ण पक्ष वर्तमान में उनके प्रमाणगत महत्व को बनाए रखता है।
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: अंधे दृष्टि पाते हैं
  rationale: ἀναβλέπω यहाँ देखने की क्षमता मिलने या लौटने को दर्शाता है। ‘दृष्टि पाते हैं’ दोनों संभावनाओं को समेटता है और भविष्यद्वाणी-सदृश गरिमा बनाए रखता है।
- source_word: χωλοὶ περιπατοῦσιν
  choice: लँगड़े चलते हैं
  rationale: विशेषण-संज्ञा और क्रिया का सीधा, संक्षिप्त तथा स्वाभाविक हिन्दी रूप।
- source_word: λεπροὶ καθαρίζονται
  choice: कोढ़ी शुद्ध किए जाते हैं
  rationale: καθαρίζονται केवल रोगमुक्ति नहीं, शुद्ध ठहराए जाने का व्यापक धार्मिक-सामाजिक भाव भी रखता है; इसलिए ‘चंगे होते हैं’ की अपेक्षा ‘शुद्ध किए जाते हैं’ चुना गया।
- source_word: κωφοὶ ἀκούουσιν
  choice: बहरे सुनते हैं
  rationale: κωφός कभी बहरे या गूँगे के लिए आ सकता है, पर ἀκούουσιν के साथ यहाँ ‘बहरे’ स्पष्ट अर्थ है।
- source_word: νεκροὶ ἐγείρονται
  choice: मरे हुए जिलाए जाते हैं
  rationale: कर्मवाच्य रूप को बनाए रखते हुए यह हिन्दी में जीवन में उठाए जाने का अर्थ स्पष्ट करता है, बिना कर्ता को पाठ से अधिक स्पष्ट किए।
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: गरीबों को शुभ समाचार सुनाया जाता है
  rationale: ग्रीक कर्मवाच्य का प्राप्तकर्ता-केंद्रित भाव सुरक्षित रहता है। ‘शुभ समाचार सुनाया जाता है’ कलीसियाई तकनीकी शब्दावली से बचते हुए घोषणा का अर्थ देता है।
theological_decisions:
- issue: चमत्कारों की सूची का यीशु की पहचान और मिशन से संबंध
  choice: कार्यों को देखे जा सकने वाले पुनर्स्थापन के रूप में सीधे प्रस्तुत किया गया है, बिना मुख्य पाठ में स्पष्ट मसीही निष्कर्ष जोड़े।
  alternative: यशायाह की प्रतिध्वनियों को स्पष्ट करने के लिए ‘भविष्यद्वाणी पूरी हो रही है’ जैसे शब्द जोड़ना।
  rationale: पद स्वयं इन कार्यों को यूहन्ना को दिए जाने वाले उत्तर के रूप में रखता है। पहचाने जा सकने वाले शब्द यशायाह की प्रतिध्वनि रहने देते हैं, पर अनकहा निष्कर्ष नहीं जोड़ते।
- issue: सूची में कर्मवाच्य क्रियाओं का कर्ता
  choice: ‘शुद्ध किए जाते हैं,’ ‘जिलाए जाते हैं,’ और ‘सुनाया जाता है’ द्वारा कर्मवाच्य सुरक्षित रखा गया है।
  alternative: ‘परमेश्वर मरे हुओं को जिलाता है’ या ‘मैं गरीबों को शुभ समाचार सुनाता हूँ’ जैसे सक्रिय वाक्य।
  rationale: ग्रीक कर्ता को स्पष्ट नहीं करता। हिन्दी कर्मवाच्य वही धार्मिक संयम बनाए रखता है और किसी कर्ता को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर चमत्कार-सूची की संक्षिप्त लय सुरक्षित है। ‘कोढ़ी’ पारंपरिक और संक्षिप्त है; ‘शुद्ध किए जाते हैं’ चिकित्सकीय चंगाई से आगे मूल के शुद्धता-संबंधी आयाम को भी बनाए रखता है।
