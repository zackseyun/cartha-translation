source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: hi
  text: दिन के समय वह मन्दिर-परिसर में शिक्षा देता था,[a] और रात को बाहर जाकर उस पहाड़ पर रात बिताता था जो जैतून का पहाड़ कहलाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मन्दिर-परिसर’ से आशय पूरे मन्दिर के अहाते से है, केवल भीतरी पवित्रस्थान से नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘रात बिताता था’ का अर्थ ठहरना है; मूल यूनानी क्रिया खुले में रात बिताने का संकेत भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: वह ... शिक्षा देता था
  rationale: अपूर्णकालिक εἰμί और वर्तमान कृदन्त का यह विन्यास लगातार और प्रथागत गतिविधि व्यक्त करता है; हिन्दी का ‘देता था’ उसी पुनरावृत्त भाव को स्वाभाविक रूप से रखता है।
- source_word: τὰς ἡμέρας
  choice: दिन के समय
  rationale: कालवाचक कर्मकारक दिन के दौरान होने वाली गतिविधि बताता है और आगे के ‘रात को’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं; इसलिए हिन्दी में अर्थ को स्पष्ट करना उचित है।
- source_word: τὰς δὲ νύκτας
  choice: और रात को
  rationale: δέ यहाँ दिन और रात की गतिविधियों में हल्का विरोध/संक्रमण दिखाता है; हिन्दी में ‘और’ स्वाभाविक है और विपरीत समय-संरचना से विरोध स्वयं स्पष्ट रहता है।
- source_word: ἐξερχόμενος
  choice: बाहर जाकर
  rationale: कृदन्त मुख्य प्रथागत क्रिया के साथ बार-बार होने वाली प्रस्थान की क्रिया दर्शाता है।
- source_word: ηὐλίζετο
  choice: रात बिताता था
  rationale: αὐλίζομαι का मूल अर्थ रात बिताना या ठहरना है और इसमें खुले में ठहरने की सम्भावना भी हो सकती है; मुख्य पाठ में तटस्थ हिन्दी रखी गई है।
- source_word: εἰς τὸ ὄρος
  choice: उस पहाड़ पर
  rationale: εἰς गन्तव्य बताता है, पर रात बिताने की क्रिया के साथ परिणामी स्थान हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: जो जैतून का पहाड़ कहलाता है
  rationale: Ἐλαιῶν का अर्थ ‘जैतूनों/जैतून के पेड़ों का’ है; प्रचलित हिन्दी स्थान-नाम ‘जैतून का पहाड़’ अर्थ और पहचान दोनों सुरक्षित रखता है।
