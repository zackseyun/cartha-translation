  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। दिन और रात की प्रथागत गतिविधि को ‘देता था/बिताता था’ से व्यक्त किया गया है। ‘मन्दिर-परिसर’ तकनीकी अर्थ को मुख्य पाठ में स्पष्ट करता है और ‘जैतून का पहाड़’ प्रचलित बाइबलीय स्थान-नाम है।
