  text: And not a hair from your head will perish[a].
translation:
  language: hi
  text: और तुम्हारे सिर का एक बाल भी नष्ट नहीं होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप में: “तुम्हारे सिर का एक बाल भी निश्चय ही नष्ट नहीं होगा”; यूनानी में प्रबल दोहरा निषेध दृढ़ आश्वासन व्यक्त करता है।'
    reason: मूल यूनानी के प्रबल निषेध की संरचना स्पष्ट करना।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य संयोजक के रूप में यह पिछले कथन से प्रवाह बनाए रखता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: θρὶξ
  choice: एक बाल
  rationale: एकवचन संज्ञा को स्वाभाविक हिन्दी मुहावरे में रखा गया है; इससे पूर्ण सुरक्षा का कहावत-सदृश भाव बना रहता है।
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: तुम्हारे सिर का
  rationale: यूनानी पदबंध का भाव सिर से संबंधित एक बाल है; सामूहिक संबोधन में हिन्दी का एकवचन ‘सिर’ स्वाभाविक है।
- source_word: οὐ μὴ
  choice: भी नहीं होगा
  rationale: οὐ μή के प्रबल निषेध को हिन्दी में ‘एक बाल भी ... नहीं’ की स्वाभाविक और दृढ़ संरचना से व्यक्त किया गया है।
- source_word: ἀπόληται
  choice: नष्ट ... होगा
  rationale: ἀπόλλυμι के नाश या खो जाने के अर्थ को गंभीर किंतु सामान्य हिन्दी में व्यक्त करता है और केवल शारीरिक क्षति तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: निकटवर्ती पदों में सताव और कुछ शिष्यों की मृत्यु की भविष्यवाणी के साथ दिखाई देने वाला तनाव
  choice: कथन को ज्यों का त्यों एक प्रबल, कहावत-सदृश आश्वासन के रूप में रखा गया है।
  alternative: इसे ऐसी शाब्दिक प्रतिज्ञा मानकर अनुवाद करना कि किसी प्रकार की शारीरिक क्षति हो ही नहीं सकती।
  rationale: निकटवर्ती संदर्भ में कुछ शिष्यों के मारे जाने की बात भी है। इसलिए मुख्य पाठ में व्याख्या जोड़कर तनाव को मिटाया नहीं गया; अनुवाद मूल कथन की प्रबलता और वास्तविक अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक अनुवाद। ‘एक बाल भी ... नहीं’ हिन्दी में प्रबल निषेध को सहज ढंग से व्यक्त करता है।
