id: LUK.21.12
reference: Luke 21:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: hi
  text: परन्तु इन सब बातों से पहले वे तुम पर हाथ डालेंगे[a] और तुम्हें सताएँगे। वे तुम्हें आराधनालयों और बंदीगृहों के हवाले करेंगे और मेरे नाम के कारण[b] तुम्हें राजाओं और राज्यपालों के सामने ले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे तुम्हें पकड़ लेंगे।’ यूनानी में शाब्दिक रूप से ‘वे तुम पर अपने हाथ डालेंगे’ है; यह शत्रुतापूर्ण गिरफ्तारी या दुर्व्यवहार का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे नाम के कारण’ का अनुवाद ‘मेरे नाम की खातिर’ या अधिक व्याख्यात्मक रूप से ‘मेरे कारण’ भी किया जा सकता है। मुख्य पाठ यीशु के नाम को उनके व्यक्तित्व और अधिकार से जोड़ने वाली बाइबलीय अभिव्यक्ति को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: परन्तु इन सब बातों से पहले
  rationale: πρό संबंधकारक के साथ समय की प्राथमिकता बताता है; πάντων के कारण ‘सब बातों’ रखा गया है, और δέ पिछले कथन से विरोध अथवा संक्रमण दिखाता है।
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: वे तुम पर हाथ डालेंगे
  rationale: यह शत्रुतापूर्ण ढंग से पकड़ने या दुर्व्यवहार करने का मुहावरा है। ‘हाथ डालेंगे’ यूनानी का ठोस बिंब बनाए रखता है और हिन्दी में गिरफ्तारी की शत्रुतापूर्ण कार्रवाई समझा जा सकता है।
- source_word: διώξουσιν
  choice: तुम्हें सताएँगे
  rationale: यहाँ यीशु के अनुयायियों के विरोध के संदर्भ में διώκω का अर्थ केवल पीछा करना नहीं, बल्कि उत्पीड़न करना है।
- source_word: παραδιδόντες
  choice: हवाले करेंगे
  rationale: यह कृदन्त सताए जाने के तरीके को स्पष्ट करता है। ‘हवाले करेंगे’ न्यायिक और शत्रुतापूर्ण संदर्भ में स्वाभाविक आधुनिक हिन्दी है।
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: आराधनालयों और बंदीगृहों के हवाले
  rationale: εἰς दिशा या प्रवेश दोनों व्यक्त कर सकता है। παραδιδόντες के साथ हिन्दी में ‘के हवाले’ स्वाभाविक है। संस्थागत शब्दों को उनकी संभावित अधिकारियों अथवा कार्यवाहियों के अर्थ में विस्तार दिए बिना रखा गया है।
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: तुम्हें राजाओं और राज्यपालों के सामने ले जाएँगे
  rationale: ἀπάγω यहाँ हिरासत में अधिकारियों के पास ले जाने का भाव देता है, और न्यायिक संदर्भ में ἐπί का अर्थ उनके ‘सामने’ उपस्थित किया जाना है। हिन्दी वाक्य सक्रिय रूप में स्वाभाविक रहते हुए आशय सुरक्षित रखता है।
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: मेरे नाम के कारण
  rationale: ἕνεκεν कारण अथवा निमित्त बताता है। ‘मेरे नाम’ बाइबलीय अभिव्यक्ति को बनाए रखता है, जिसमें यीशु का व्यक्तित्व और अधिकार निहित हैं।
theological_decisions:
- issue: उत्पीड़न के संदर्भ में ‘मेरे नाम’ का अर्थ
  choice: ‘मेरे नाम के कारण’ अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘मेरे कारण’ अथवा ‘मेरे नाम की खातिर’
  rationale: τοῦ ὀνόματός μου यीशु के व्यक्तित्व और अधिकार से जुड़ी अर्थ-गहन बाइबलीय अभिव्यक्ति है। इसे व्याख्यात्मक रूप से केवल ‘मेरे कारण’ कर देना उसके शब्दचित्र और धार्मिक अनुगूँज को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘आराधनालय’, ‘बंदीगृह’ और ‘राज्यपाल’ औपचारिक किंतु बोधगम्य शब्द हैं। लंबे यूनानी वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है; घटनाओं का क्रम और संबंध सुरक्षित है।
