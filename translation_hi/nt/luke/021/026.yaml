review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal force of ἀπὸ φόβου, the generic reference of ἀνθρώπων, the scope of τῇ οἰκουμένῃ, and the future passive σαλευθήσονται. However, ‘आशंका’ adds a specifically apprehensive/foreboding sense to προσδοκία that the Greek does not state explicitly. The surrounding fear makes the expectation ominous without requiring that interpretive narrowing.
  naturalness: The opening coordination, ‘भय से और ... की आशंका के कारण,’ mixes parallel causal constructions and is less smooth in modern Hindi. ‘भय और ... की प्रतीक्षा के कारण’ is idiomatic and maintains the source structure. ‘आकाश की शक्तियाँ’ is more natural Hindi than the unusual plural expression ‘आकाशों की शक्तियाँ,’ while retaining the intended cosmic ambiguity.
  terminology: ‘बसे हुए संसार’ appropriately represents οἰκουμένη. ‘आकाश की शक्तियाँ’ preserves the ambiguity of αἱ δυνάμεις τῶν οὐρανῶν without deciding between celestial bodies and heavenly beings. The footnotes retain viable lexical and interpretive alternatives.
  issues:
  - severity: medium
    issue: ‘आशंका’ for προσδοκία
    rationale: ‘आशंका’ means apprehension or foreboding and therefore makes explicit an ominous nuance which is contextual rather than lexically explicit in προσδοκία. ‘प्रतीक्षा’ preserves the basic sense of expectation; the fear in the sentence supplies the ominous setting.
  - severity: low
    issue: Uneven causal coordination in the first clause
    rationale: ‘भय से और ... के कारण’ is stylistically uneven. Coordinating the two nouns under ‘के कारण’ improves fluency without changing meaning.
  - severity: low
    issue: ‘आकाशों की शक्तियाँ’ is unnatural in standard Hindi
    rationale: Although it reflects the Greek plural formally, Hindi normally uses the singular collective ‘आकाश’ here. This does not resolve the phrase’s ambiguity or materially reduce source fidelity.
