id: LUK.21.26
reference: Luke 21:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: hi
  text: भय और उन बातों की प्रतीक्षा के कारण जो बसे हुए संसार[a] पर आनेवाली हैं, लोग मूर्छित हो जाएँगे, क्योंकि आकाश की शक्तियाँ[b] हिलाई जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संसार’ या ‘पृथ्वी’; यूनानी में ‘बसा हुआ संसार’।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्वर्गीय शक्तियाँ’ अथवा ‘आकाशीय शक्तियाँ’। यह वाक्यांश व्यापक रूप से ब्रह्मांडीय या आकाशीय शक्तियों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων ἀνθρώπων
  choice: लोग ... मूर्छित हो जाएँगे
  rationale: ἀποψυχόντων में भय के कारण चेतना या शक्ति चुकने का शारीरिक-मनोवैज्ञानिक भाव है। ‘मूर्छित हो जाएँगे’ आधुनिक हिन्दी में स्वाभाविक है और पारंपरिक ‘हृदय बैठ जाना’ से मूल क्रिया के बल को अधिक स्पष्ट रखता है। ἀνθρώπων समस्त लोगों को सामान्य रूप से सूचित करता है।
- source_word: ἀπὸ φόβου
  choice: भय से
  rationale: ἀπό यहाँ कारण या स्रोत बताता है; ‘भय से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: προσδοκίας τῶν ἐπερχομένων
  choice: आनेवाली घटनाओं की आशंका के कारण
  rationale: προσδοκία का मूल भाव अपेक्षा या प्रतीक्षा है, पर इस भयावह संदर्भ में ‘आशंका’ उसकी चिंतापूर्ण दिशा को स्वाभाविक हिन्दी में व्यक्त करती है। τῶν ἐπερχομένων को बहुवचन घटनाओं के रूप में रखा गया है।
- source_word: τῇ οἰκουμένῃ
  choice: बसे हुए संसार पर
  rationale: οἰκουμένη केवल भौतिक पृथ्वी नहीं, बल्कि मनुष्यों से बसे जगत को सूचित कर सकता है। यह चयन उस विशेष अर्थ को बनाए रखता है; सरल विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: आकाशों की शक्तियाँ
  rationale: यह मूल यूनानी के बहुवचन और अस्पष्ट ब्रह्मांडीय अभिव्यक्ति को बनाए रखता है, बिना इसे केवल खगोलीय पिंडों या आत्मिक प्राणियों तक सीमित किए।
- source_word: σαλευθήσονται
  choice: हिलाई जाएँगी
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखते हुए यह ब्रह्मांडीय उथल-पुथल की छवि को सीधे व्यक्त करता है।
theological_decisions:
- issue: प्रकाशनात्मक संदर्भ में ‘आकाशों की शक्तियाँ’ का अर्थ
  choice: अस्पष्ट ब्रह्मांडीय अभिव्यक्ति ‘आकाशों की शक्तियाँ’ बनाए रखी गई है।
  alternative: ‘आकाशीय पिंड’ अथवा ‘स्वर्गीय आत्मिक शक्तियाँ’
  rationale: वाक्यांश ब्रह्मांडीय व्यवस्था, आकाशीय पिंडों या स्वर्गीय शक्तियों की ओर संकेत कर सकता है। मूल पाठ किसी एक अर्थ को निर्णायक रूप से नहीं चुनता, इसलिए अनुवाद भी इस धार्मिक और साहित्यिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बसे हुए संसार’ और ‘आकाशों की शक्तियाँ’ कुछ औपचारिक हैं, पर मूल यूनानी की विशिष्टता और वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखने के लिए चुने गए हैं।
