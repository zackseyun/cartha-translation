revisions:
- from: लोग भय से और बसे हुए संसार[a] पर आनेवाली घटनाओं की आशंका के कारण मूर्छित हो जाएँगे, क्योंकि आकाशों की शक्तियाँ[b] हिलाई जाएँगी।
  to: भय और उन बातों की प्रतीक्षा के कारण जो बसे हुए संसार[a] पर आनेवाली हैं, लोग मूर्छित हो जाएँगे, क्योंकि आकाश की शक्तियाँ[b] हिलाई जाएँगी।
  rationale: The revision removes the interpretively stronger ‘आशंका,’ restores the lexical openness of προσδοκία with ‘प्रतीक्षा,’ and recasts the clause for natural modern Hindi. It also uses the idiomatic collective ‘आकाश’ while preserving the deliberately unresolved cosmic sense of ‘the powers of the heavens.’ Footnote punctuation and alternatives have been normalized.
  reviewer_model: gpt-5.6-terra
