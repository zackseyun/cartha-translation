  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: hi
  text: पर जब ये बातें होने लगें[a], तो सीधे खड़े हो जाओ और अपने सिर ऊँचे उठाओ[b], क्योंकि तुम्हारा छुटकारा निकट आ रहा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब ये बातें घटित होने लगें।”
    reason: lexical_alternative
  - marker: b
    text: या, “ऊपर देखो और अपने सिर उठाओ।”
    reason: lexical_alternative
  - marker: c
    text: “छुटकारा” का अनुवाद “मुक्ति” भी किया जा सकता है; यहाँ यह यीशु के लोगों की निकट आती अंतिम मुक्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: पर जब ये बातें होने लगें
  rationale: संबंधवाचक कृदंत-रचना समय-सूचक परिस्थिति बताती है। ‘जब ... होने लगें’ ἀρχομένων और γίνεσθαι दोनों का स्वाभाविक रूप से अर्थ रखता है; δέ को पिछले संकट के वर्णन से आशापूर्ण प्रोत्साहन की ओर हल्के विरोध/संक्रमण के रूप में ‘पर’ कहा गया है।
- source_word: ἀνακύψατε
  choice: सीधे खड़े हो जाओ
  rationale: क्रिया झुकी हुई अवस्था से तनकर सीधा होने का बिंब देती है। संदर्भ में यह साहस और आशा भी व्यक्त करता है, पर अनुवाद शारीरिक बिंब को बनाए रखता है।
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: अपने सिर ऊँचे उठाओ
  rationale: यह बहुवचन आज्ञा के साथ आत्मविश्वास और आशा का मूल बिंब बनाए रखने वाला सहज हिन्दी प्रयोग है।
- source_word: διότι
  choice: क्योंकि
  rationale: कारण-सूचक संबंध को स्पष्ट और समकालीन हिन्दी में व्यक्त करता है।
- source_word: ἐγγίζει
  choice: निकट आ रहा है
  rationale: वर्तमान काल में बढ़ती हुई निकटता का भाव है; यह केवल स्थिर ‘निकट है’ की अपेक्षा उस प्रक्रिया को बेहतर व्यक्त करता है।
- source_word: ἀπολύτρωσις
  choice: छुटकारा
  rationale: इस प्रसंग में शब्द मुक्ति/उद्धार की ओर संकेत करता है। ‘छुटकारा’ साधारण पाठक के लिए स्पष्ट है और अंतिम मुक्ति के भाव को रखता है, जबकि पादटिप्पणी पारंपरिक ‘छुड़ौती’ विकल्प बताती है।
theological_decisions:
- issue: अंत-समय संबंधी उपदेश में ‘तुम्हारा ἀπολύτρωσις’ का अर्थ
  choice: ‘तुम्हारा छुटकारा’—यीशु के लोगों की निकट आती अंतिम मुक्ति/उद्धार के रूप में
  alternative: केवल तत्काल ऐतिहासिक संकट से बचाव; अथवा पूर्णतः आध्यात्मिक और गैर-अंतकालीन मुक्ति
  rationale: निकटवर्ती संदर्भ भविष्य और अंत-समय की घटनाओं से जुड़ा है। अनुवाद अंतिम मुक्ति की दिशा को बनाए रखता है, पर उसके तरीके को मूल पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल है। ‘सीधे खड़े हो जाओ’ और ‘सिर ऊँचे उठाओ’ मूल के दो समांतर शारीरिक बिंबों को अलग-अलग बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
