  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: hi
  text: जब कुछ लोग मंदिर[a] के बारे में कह रहे थे कि वह सुंदर पत्थरों और समर्पित भेंटों[b] से सजा हुआ है, तो उसने कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द से सामान्यतः पूरा मंदिर-परिसर अभिप्रेत है, केवल भीतरी पवित्रस्थान नहीं।
    reason: cultural_note
  - marker: b
    text: या, “मन्नत की भेंटों।” यूनानी शब्द उन भेंटों के लिए है जो परमेश्वर को समर्पित करके मंदिर में प्रदर्शित की जाती थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: जब कुछ लोग … कह रहे थे
  rationale: संबंधकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है; ‘कह रहे थे’ से वर्तमान कृदंत की जारी क्रिया बनी रहती है।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में प्रचलित और सहज ‘मंदिर’ रखा गया है तथा व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: λίθοις καλοῖς
  choice: सुंदर पत्थरों
  rationale: यह प्रयोग पत्थरों की प्रभावशाली सुंदरता और उत्कृष्टता को व्यक्त करता है; ‘सुंदर’ सरल और स्वाभाविक है।
- source_word: ἀναθήμασιν
  choice: समर्पित भेंटों
  rationale: यहाँ उन भेंटों का उल्लेख है जो परमेश्वर को समर्पित करके मंदिर में रखी या प्रदर्शित की गई थीं। ‘समर्पित भेंटें’ सामान्य पाठक के लिए स्पष्ट रहते हुए धार्मिक संदर्भ को बनाए रखता है।
- source_word: κεκόσμηται
  choice: सजा हुआ है
  rationale: पूर्णकालिक कर्मवाच्य का परिणामस्वरूप बनी हुई अवस्था इस हिंदी अभिव्यक्ति से स्वाभाविक ढंग से व्यक्त होती है।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: यूनानी क्रिया में कर्ता निहित है; नाम ‘यीशु’ जोड़ने के बजाय मूल पाठ की कथात्मक निरंतरता रखी गई है।
