id: LUK.21.25
reference: Luke 21:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: hi
  text: और सूर्य, चंद्रमा और तारों में चिन्ह होंगे, और पृथ्वी पर राष्ट्र समुद्र की गर्जना और उफान के कारण संकट और असमंजस में होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “समुद्र की ध्वनि और उफान के विषय में असमंजस में राष्ट्रों का संकट।”'
    reason: मूल यूनानी में ‘ध्वनि’ और ‘उफान’ अधिक व्यापक शब्द हैं, और इनके साथ राष्ट्रों के असमंजस का व्याकरणिक संबंध संक्षिप्त तथा कुछ हद तक खुला है।
lexical_decisions:
- source_word: σημεῖα
  choice: चिन्ह
  rationale: यह व्यापक और प्रचलित शब्द है, जो असाधारण खगोलीय घटनाओं को व्यक्त करता है, पर उन्हें अनिवार्य रूप से अशुभ शकुन नहीं ठहराता।
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: सूर्य, चंद्रमा और तारों में
  rationale: यूनानी के स्थानवाचक संबंध और तीनों खगोलीय तत्वों की समानांतर संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: συνοχὴ ἐθνῶν
  choice: राष्ट्र व्याकुल ... होंगे
  rationale: συνοχή दबावपूर्ण संकट या व्याकुलता की दशा बताता है और ἐθνῶν संसार के राष्ट्रों या जनसमूहों को; हिन्दी में विशेषणात्मक वाक्य-रचना मूल भाव को सहज रूप से व्यक्त करती है।
- source_word: ἐν ἀπορίᾳ
  choice: असमंजस में
  rationale: ἀπορία ऐसी उलझन और विवशता दर्शाता है जिसमें कोई राह या उपाय न सूझे; ‘असमंजस में’ आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: ἤχους θαλάσσης
  choice: समुद्र की गर्जना
  rationale: ἦχος मूलतः ध्वनि या शोर है; समुद्र के संदर्भ में ‘गर्जना’ उस प्रबल ध्वनि को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: σάλου
  choice: उफान
  rationale: σάλος समुद्र की उथल-पुथल, हिलोर या प्रचंड गति को सूचित करता है; ‘उफान’ संक्षिप्त और सहज है तथा अनावश्यक रूप से ‘लहरें’ जोड़ने से बचता है।
- source_word: ἐν ἀπορίᾳ ἤχους θαλάσσης καὶ σάλου
  choice: समुद्र की गर्जना और उफान के कारण ... असमंजस में
  rationale: 'ἐν के संबंध को यहाँ कारणसूचक रूप में समझना प्रसंगानुकूल है: समुद्र की विकराल हलचल राष्ट्रों की व्याकुलता और असमंजस का अवसर या कारण बनती है। पादटिप्पणी अधिक शाब्दिक संबंध बताती है।'
theological_decisions:
- issue: खगोलीय चिन्हों का स्वरूप
  choice: उन्हें सीधे ‘चिन्ह’ कहा गया है, बिना यह निर्धारित किए कि वे अक्षरशः खगोलीय घटनाएँ हैं, प्रतीकात्मक चित्रण हैं, या दोनों।
  alternative: उन्हें स्पष्टतः अक्षरशः ब्रह्मांडीय घटनाएँ अथवा केवल राजनीतिक-प्रतीकात्मक भाषा घोषित करना।
  rationale: पद स्वयं इस व्याख्यात्मक प्रश्न का निर्णय नहीं करता; इसलिए अनुवाद मूल की प्रलय-संबंधी भाषा और उसका तनाव सुरक्षित रखता है।
- issue: राष्ट्रों की व्याकुलता का समुद्र से संबंध
  choice: ‘के कारण’ द्वारा समुद्र की गर्जना और उफान को व्याकुलता एवं असमंजस का कारण या आधार बताया गया है।
  alternative: ‘के सामने’ या अत्यंत शाब्दिक ‘की ध्वनि में’ कहना।
  rationale: यूनानी संरचना संबंध की कुछ लचक रखती है; कारणसूचक हिन्दी प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी मूल के अधिक शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चंद्रमा’, ‘चिन्ह’, ‘व्याकुल’ और ‘असमंजस’ मानक हिन्दी के परिचित शब्द हैं। वाक्य की प्रलय-संबंधी गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
