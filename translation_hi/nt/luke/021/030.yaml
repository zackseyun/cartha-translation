translation:
  language: hi
  text: जब उनमें पहले ही नई कोंपलें फूट निकलती हैं[a], तब उन्हें देखकर तुम स्वयं जान लेते हो कि ग्रीष्म ऋतु पहले ही निकट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जब उनमें नया उगाव फूट निकलता है।” यूनानी मूल में “कोंपलें” स्पष्ट रूप से नहीं है, पर पेड़ों के संदर्भ से इसका संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह संभावित समय बताने वाला उपवाक्य आरम्भ करता है; दृष्टान्त में ‘जब’ सहज और सटीक है।
- source_word: προβάλωσιν
  choice: नई कोंपलें निकलने लगती हैं
  rationale: क्रिया का मूल अर्थ आगे निकलने या नया उगाव फूटने का है। पेड़ों के संदर्भ में ‘नई कोंपलें’ स्वाभाविक है, यद्यपि यूनानी में पत्तियों या कोंपलों का संज्ञा-रूप स्पष्टतः नहीं है।
- source_word: ἤδη
  choice: लगने / निकट है
  rationale: पहले ἤδη का आरम्भिक अवस्था-सूचक भाव ‘निकलने लगती हैं’ में स्वाभाविक रूप से व्यक्त है; दूसरे का भाव वर्तमान निकटता ‘निकट है’ से स्पष्ट है। दोनों जगह यांत्रिक रूप से ‘पहले ही’ रखने से हिन्दी असहज होती।
- source_word: βλέποντες
  choice: उन्हें देखकर
  rationale: यह कृदन्त देखने को जानने का साधन या साथ की परिस्थिति बताता है; ‘देखकर’ हिन्दी में इस संबंध को सहजता से व्यक्त करता है।
- source_word: ἀφ’ ἑαυτῶν
  choice: स्वयं
  rationale: मुहावरे का आशय अपने प्रत्यक्ष निरीक्षण से पहचानना है, न कि बाहरी सूचना से।
- source_word: γινώσκετε
  choice: जान लेते हो
  rationale: देखे हुए संकेत से होने वाली पहचान को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐγγὺς
  choice: निकट
  rationale: समय की समीपता का सीधा और गरिमापूर्ण रूप।
- source_word: θέρος
  choice: गरमी का मौसम
  rationale: यह ग्रीष्म ऋतु को सूचित करता है; ‘गरमी का मौसम’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
