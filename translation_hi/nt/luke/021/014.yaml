  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: hi
  text: इसलिए अपने मन में ठान लो कि अपने बचाव में क्या कहना है, इसकी तैयारी पहले से नहीं करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέτε
  choice: ठान लो
  rationale: τίθημι का आज्ञार्थक रूप यहाँ ‘मन में’ के साथ मुहावरेदार ढंग से दृढ़ निश्चय करने का भाव देता है। ‘ठान लो’ आधुनिक हिन्दी में स्वाभाविक है और आदेश की शक्ति बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को दिखाता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: अपने मन में
  rationale: यूनानी ‘अपने हृदयों में’ आंतरिक निश्चय का मुहावरा है। आधुनिक हिन्दी में ‘अपने मन में’ वही अर्थ अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ προμελετᾶν
  choice: तैयारी पहले से नहीं करोगे
  rationale: προμελετάω पहले से सोचने, तैयार करने या अभ्यास करने को सूचित करता है। यह रूप मुख्य आज्ञा ‘ठान लो’ पर निर्भर निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπολογηθῆναι
  choice: अपने बचाव में क्या कहना है
  rationale: ἀπολογέομαι न्यायिक या औपचारिक परिस्थिति में अपने पक्ष में उत्तर देने का भाव रखता है। प्रसंग में यह अनुवाद केवल सामान्य आत्मरक्षा के बजाय बचाव का वक्तव्य देने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: पहले से तैयारी न करने की आज्ञा का दायरा
  choice: आज्ञा को शिष्यों द्वारा अपने बचाव के उत्तर की पूर्व-तैयारी से जोड़ा गया है।
  alternative: इसे हर प्रकार की तैयारी के सार्वभौमिक निषेध के रूप में व्यक्त करना।
  rationale: προμελετᾶν और ἀπολογηθῆναι साथ मिलकर आने वाली न्यायिक गवाही में बचाव का वक्तव्य पहले से तैयार करने की बात करते हैं; पद से आगे बढ़कर सामान्य तैयारी पर निषेध लगाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने हृदयों में रख लो’ की अधिक शब्दशः अभिव्यक्ति के स्थान पर हिन्दी के स्वाभाविक मुहावरे ‘अपने मन में ठान लो’ का प्रयोग किया गया है।
