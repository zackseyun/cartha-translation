source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: hi
  text: तब जो यहूदिया में हों, वे पहाड़ों में भाग जाएँ; जो उसके[a] भीतर हों, वे निकल जाएँ; और जो देहात में हों, वे उसमें प्रवेश न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके” और “उसमें” यरूशलेम की ओर संकेत करते हैं। यूनानी में नगर के लिए स्त्रीलिंग सर्वनाम प्रयुक्त हुआ है।
    reason: सर्वनाम के संदर्भ और यूनानी के स्त्रीलिंग रूप को स्पष्ट करना।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह पिछले कथन के बाद होने वाली कार्रवाई का क्रम संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: जो यहूदिया में हों
  rationale: यह यहूदिया में मौजूद लोगों को सूचित करता है और हिन्दी में सहज संबंधवाचक संरचना बनाता है।
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: वे पहाड़ों में भाग जाएँ
  rationale: तीसरे पुरुष की आज्ञा का तात्कालिक बल बनाए रखता है और पहाड़ों को गंतव्य के रूप में व्यक्त करता है।
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: जो उसके भीतर हों
  rationale: ἐν μέσῳ का स्थानगत अर्थ ‘भीतर’ से स्वाभाविक रूप में आता है; सर्वनाम को बनाए रखने से स्रोत में निहित पूर्वसंदर्भ को मुख्य पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: ἐκχωρείτωσαν
  choice: वे निकल जाएँ
  rationale: यह किसी स्थान को छोड़कर बाहर चले जाने की तत्काल आज्ञा को आधुनिक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐν ταῖς χώραις
  choice: जो देहात में हों
  rationale: χῶραι यहाँ नगर से बाहर के ग्रामीण क्षेत्र का बोध कराता है; ‘देहात’ साधारण पाठकों के लिए स्वाभाविक है।
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: वे उसमें प्रवेश न करें
  rationale: नकारात्मक आज्ञा का बल और उसी पूर्वसंदर्भित स्थान में भीतर जाने की दिशा दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: αὐτῆς और αὐτήν का संदर्भ
  choice: मुख्य पाठ में ‘उसके/उसमें’ रखा और पादटिप्पणी में संदर्भ यरूशलेम बताया।
  alternative: मुख्य पाठ में सीधे ‘यरूशलेम’ या ‘नगर’ लिखना।
  rationale: पिछले संदर्भ से संकेत यरूशलेम की ओर है, पर इस पद में संज्ञा दोहराई नहीं गई है। सर्वनाम बनाए रखने से मूल की संदर्भ-निर्भरता सुरक्षित रहती है, जबकि पादटिप्पणी पाठक को स्पष्टता देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों समानांतर आज्ञाओं को ‘वे … जाएँ/करें’ के रूप में रखा गया है; विरामचिह्न उनकी क्रमिक तात्कालिकता को स्पष्ट करते हैं।
