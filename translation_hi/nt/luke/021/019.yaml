lexical_decisions:
- source_word: ὑπομονῇ
  choice: धीरज
  rationale: यह शब्द परीक्षा और विरोध के बीच दृढ़तापूर्वक टिके रहने का भाव देता है। आधुनिक हिन्दी में ‘धीरज’ स्वाभाविक और संक्षिप्त है तथा यहाँ केवल निष्क्रिय प्रतीक्षा नहीं, बल्कि स्थिर सहनशीलता व्यक्त करता है।
- source_word: κτήσασθε
  choice: प्राप्त करोगे
  rationale: SBLGNT में यह क्रिया आज्ञार्थक रूप में है, पर प्रसंग में इसका परिणामसूचक भाव भी समझा जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी हेतु भविष्यत् परिणाम रखा गया है, जबकि औपचारिक आज्ञार्थक रूप पादटिप्पणी में दिया गया है।
- source_word: ψυχὰς
  choice: प्राण
  rationale: ψυχή यहाँ जीवन, स्वयं या प्राण का बोध करा सकता है। ‘प्राण’ हिन्दी में व्यक्ति के जीवन का समग्र भाव रखता है और केवल देह से अलग अमूर्त आत्मा का अर्थ अनिवार्य नहीं करता। अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐν
  choice: के द्वारा
  rationale: यहाँ ἐν साधन या माध्यम व्यक्त करता है। ‘के द्वारा’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रूप से प्रकट करता है।
theological_decisions:
- issue: अन्तकालीन सताव के प्रसंग में ψυχή का अर्थ
  choice: समग्र जीवन को सूचित करने वाला ‘प्राण’
  alternative: ‘जीवन’, ‘अपने आपको’ या ‘आत्माएँ’
  rationale: यह अनुवाद शारीरिक संकट और अन्तिम सुरक्षा के बीच के तनाव को बनाए रखता है तथा मनुष्य को केवल शरीर और अमूर्त आत्मा में बाँटने वाली किसी संकीर्ण धारणा को पाठ पर आरोपित नहीं करता।
- issue: κτήσασθε का आज्ञार्थक रूप और परिणामसूचक अर्थ
  choice: मुख्य पाठ में ‘प्राप्त करोगे’, और पादटिप्पणी में औपचारिक आज्ञार्थक रूप
  alternative: मुख्य पाठ में ‘प्राप्त करो’
  rationale: यूनानी रूप सचमुच आज्ञार्थक है, इसलिए उसे पादटिप्पणी में स्पष्ट रखा गया है; साथ ही प्रसंग में धीरज के फल को व्यक्त करने वाला भविष्यत् अर्थ स्वाभाविक हिन्दी मुख्य पाठ में संप्रेषित होता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धीरज’ सताव के बीच दृढ़ बने रहने को व्यक्त करता है; ‘प्राण’ पारंपरिक रूप से परिचित होते हुए भी यहाँ समग्र जीवन का खुला अर्थ बनाए रखता है।
