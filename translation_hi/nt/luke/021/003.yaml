  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: hi
  text: और उसने कहा, “मैं तुमसे सच कहता हूँ कि इस गरीब विधवा ने उन सब से अधिक डाला है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: सच
  rationale: यह क्रियाविशेषण कथन की गंभीरता और निश्चितता पर बल देता है; ‘सच’ आधुनिक हिन्दी में स्वाभाविक है और यीशु के कथन की प्रामाणिक शक्ति बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और अधिकारपूर्ण कथन दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: χήρα
  choice: विधवा
  rationale: उस स्त्री के लिए मानक और सटीक हिन्दी शब्द जिसका पति मर चुका है।
- source_word: πτωχή
  choice: गरीब
  rationale: गरीबी को स्वाभाविक ढंग से व्यक्त करता है; ‘दरिद्र’ अधिक साहित्यिक और ‘अत्यंत निर्धन’ मूल से अधिक विशिष्ट होता।
- source_word: αὕτη
  choice: इस
  rationale: संकेतवाचक बल बनाए रखते हुए उस विशेष विधवा की ओर ध्यान दिलाता है।
- source_word: πλεῖον
  choice: अधिक
  rationale: तुलनात्मक और परिमाणात्मक अर्थ को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: πάντων
  choice: उन सब से
  rationale: संबंधकारक तुलना को व्यक्त करता है और प्रसंग में अन्य सभी दान देने वालों की ओर संकेत बनाए रखता है।
- source_word: ἔβαλεν
  choice: डाला है
  rationale: मन्दिर के भंडार में धन डालने की क्रिया के लिए सहज हिन्दी है; ‘फेंका’ अनावश्यक रूप से जोरदार या असावधान क्रिया का आभास दे सकता है।
theological_decisions:
- issue: विधवा के दान की तुलनात्मक घोषणा
  choice: उन सब से अधिक डाला है
  alternative: उनमें से किसी भी व्यक्ति से अधिक डाला है
  rationale: πλεῖον πάντων अन्य दानदाताओं के साथ तुलना व्यक्त करता है। अनुवाद यीशु की मूल्यांकनात्मक घोषणा को बनाए रखता है, पर अगले पद में दी गई अनुपात और त्याग की व्याख्या को समय से पहले इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के लिए स्वाभाविक। ‘तब’ καί को प्रसंगगत कथानक-संबंध के रूप में व्यक्त करता है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई।
