id: LUK.21.8
reference: Luke 21:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: hi
  text: उसने कहा, “सावधान रहो कि तुम बहकाए न जाओ; क्योंकि बहुत-से लोग मेरे नाम से आकर कहेंगे, ‘मैं वही हूँ,’[a] और, ‘समय निकट आ गया है।’ उनके पीछे मत जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “मैं हूँ”; अर्थात कोई झूठा दावेदार अपने को उस अपेक्षित व्यक्ति के रूप में प्रस्तुत करता है—संभवतः मसीह के रूप में।
    reason: मूल यूनानी Ἐγώ εἰμι में विधेय व्यक्त नहीं है और उसका संक्षिप्त रूप एक से अधिक ढंग से समझा जा सकता है।
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: सावधान रहो कि तुम बहकाए न जाओ
  rationale: यह चेतावनी सजग रहने और दूसरों के द्वारा सत्य से भटकाए जाने से बचने का निर्देश देती है। कर्मवाच्य ‘बहकाए न जाओ’ मूल की संरचना और भटकने के भाव को बनाए रखता है।
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम से आकर
  rationale: यह यीशु के नाम, अधिकार या पहचान का दावा करते हुए आने को व्यक्त करता है; ‘मेरे नाम से’ स्वाभाविक हिन्दी में इस अर्थ को खुला रखता है।
- source_word: Ἐγώ εἰμι
  choice: मैं वही हूँ
  rationale: मूल वाक्यांश में विधेय स्पष्ट नहीं है। ‘मैं वही हूँ’ किसी अपेक्षित व्यक्ति होने के दावे को संप्रेषित करता है, पर ‘मसीह’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: समय निकट आ गया है
  rationale: καιρός निर्णायक या नियत समय का संकेत दे सकता है, जबकि पूर्णकालीन क्रिया वर्तमान निकटता का भाव देती है। यह अनुवाद दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: उनके पीछे मत जाना
  rationale: यह उन दावेदारों के साथ चलने या उनका अनुसरण करने की मनाही है और ὀπίσω की दिशात्मक छवि को भी बनाए रखता है।
theological_decisions:
- issue: झूठे दावेदारों के प्रसंग में Ἐγώ εἰμι का अनुवाद
  choice: मैं वही हूँ
  alternative: मैं हूँ; मैं मसीह हूँ
  rationale: ‘मैं वही हूँ’ मूल की संक्षिप्त आत्म-पहचान और उसके निहित दावे को बनाए रखता है। ‘मैं मसीह हूँ’ प्रसंगानुकूल हो सकता है, पर वह ऐसा स्पष्ट विधेय जोड़ता है जो यूनानी पाठ में नहीं है; ‘मैं हूँ’ अधिक शाब्दिक विकल्प के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। ‘सावधान रहो’, ‘बहकाए न जाओ’ और ‘पीछे मत जाना’ चेतावनी की तत्परता तथा मूल की रूपकात्मक-दिशात्मक भाषा को बनाए रखते हैं।
