  terminology: ‘दृष्टान्त’ is an appropriate rendering of παραβολή, and ‘अंजीर के पेड़’ correctly identifies συκῆ as a tree. The alternative ‘ध्यान दो’ is a defensible contextual rendering of Ἴδετε.
