lexical_decisions:
- source_word: Καὶ
  choice: फिर
  rationale: यह संयोजक पिछले कथन से कथा को आगे बढ़ाता है; आधुनिक हिन्दी में यहाँ ‘फिर’ स्वाभाविक प्रवाह देता है, बिना किसी तीव्र कालगत अर्थ को जोड़े।
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: उसने उन्हें एक दृष्टान्त सुनाया
  rationale: यद्यपि εἶπεν का मूल अर्थ ‘कहा’ है, παραβολή के साथ हिन्दी में ‘दृष्टान्त सुनाया’ अधिक स्वाभाविक है और कथन की शिक्षात्मक विधा को बनाए रखता है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: सुसमाचारों में παραβολή के लिए यह प्रचलित, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी शब्द है।
- source_word: Ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप श्रोताओं का ध्यान सामने दिए गए उदाहरण की ओर खींचता है; ‘देखो’ इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν συκῆν
  choice: अंजीर के पेड़
  rationale: συκῆ उस वृक्ष को सूचित करता है, केवल फल को नहीं; इसलिए ‘अंजीर के पेड़’ स्पष्ट है।
- source_word: πάντα τὰ δένδρα
  choice: सब पेड़ों
  rationale: यूनानी पद का सीधा अर्थ ‘सब पेड़’ है। इसमें ‘दूसरे’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
