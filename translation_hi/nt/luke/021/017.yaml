  text: And you will be hated by all because of my name[a].
translation:
  language: hi
  text: और मेरे नाम के कारण सब लोग तुमसे घृणा करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे कारण।” यहाँ “मेरे नाम” से यीशु की पहचान, उनका अधिकार और उनके प्रति निष्ठा का अंगीकार सूचित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक पद इस वचन को पिछले कथन से जोड़ता है; हिन्दी में स्वाभाविक रूप से ‘और’ रखा गया है।
- source_word: ἔσεσθε μισούμενοι
  choice: तुमसे घृणा करेंगे
  rationale: εἰμί के भविष्य रूप और वर्तमान कर्मवाच्य कृदंत का संयुक्त अर्थ भविष्य में झेली जाने वाली घृणा है। हिन्दी का कर्तृवाच्य प्रयोग ‘सब लोग तुमसे घृणा करेंगे’ स्वाभाविक है और कर्मभोगी ‘तुम’ को स्पष्ट रखता है।
- source_word: ὑπὸ πάντων
  choice: सब लोग
  rationale: ὑπό सहित संबंधकारक व्यक्तिगत कर्ता को दर्शाता है। हिन्दी वाक्य को स्वाभाविक कर्तृवाच्य बनाने पर πάντων का अर्थ ‘सब लोग’ से व्यक्त होता है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά यहाँ कारण बताता है; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: τὸ ὄνομά μου
  choice: मेरे नाम
  rationale: मूल के ‘मेरे नाम’ को बनाए रखने से यीशु की पहचान, अधिकार और उनके प्रति निष्ठा से जुड़ी व्यापक अर्थ-छाया सुरक्षित रहती है।
theological_decisions:
- issue: सताव के संदर्भ में ‘मेरे नाम’ का आशय
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति ‘मेरे नाम के कारण’ बनाए रखी गई।
  alternative: ‘मेरे कारण’ अथवा ‘क्योंकि तुम मेरे कहलाते हो’
  rationale: यूनानी पाठ स्पष्ट रूप से ‘मेरे नाम के कारण’ कहता है। लूका–प्रेरितों में ‘नाम’ यीशु की पहचान, अधिकार और उनके प्रति अंगीकार को समेट सकता है; अर्थ को किसी एक पहलू तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण वाक्य। कर्मवाच्य की अपेक्षा स्वाभाविक हिन्दी कर्तृवाच्य चुना गया है, जबकि मूल का आशय और व्यापकता सुरक्षित रखी गई है।
