  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: hi
  text: 'मैं तुमसे सच कहता हूँ: यह पीढ़ी[a] तब तक हरगिज़ नहीं बीतेगी, जब तक सब बातें[b] घटित न हो जाएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह पीढ़ी’ का अनुवाद ‘ये लोग’ या ‘यह युग’ भी किया जा सकता है; यूनानी शब्द के एक से अधिक अर्थ हो सकते हैं, यद्यपि ‘पीढ़ी’ उसका सबसे सीधा अनुवाद है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘सब बातें’ है; इसका अनुवाद ‘सब कुछ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह गंभीर और अधिकारपूर्ण पुष्टि का सूचक है; ‘सच’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को स्पष्ट रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूनानी प्रत्यक्ष कथन-सूत्र को स्वाभाविक हिन्दी में निकटता से व्यक्त करता है।
- source_word: οὐ μὴ παρέλθῃ
  choice: निश्चय ही समाप्त नहीं होगी
  rationale: οὐ μή के अत्यंत प्रबल निषेध को ‘निश्चय ही ... नहीं’ व्यक्त करता है। παρέρχομαι यहाँ किसी पीढ़ी के बीत जाने या समाप्त हो जाने का बोध देता है।
- source_word: ἡ γενεὰ αὕτη
  choice: यह पीढ़ी
  rationale: γενεά का यहाँ सबसे सीधा शब्दार्थ ‘पीढ़ी’ है; इसके विवादित संदर्भ का निर्णय मुख्य पाठ में नहीं किया गया।
- source_word: ἕως ἂν
  choice: जब तक ... न हो जाएँ
  rationale: यह उस समय-सीमा को व्यक्त करने वाला स्वाभाविक हिन्दी विन्यास है, जिसके भीतर मुख्य कथन लागू रहता है।
- source_word: πάντα
  choice: ये सब बातें
  rationale: πάντα का शाब्दिक अर्थ ‘सब कुछ/सभी बातें’ है। हिन्दी में प्रसंगगत बहुवचन का संकेत देने के लिए ‘ये’ स्वाभाविक है, यद्यपि यूनानी में ‘ये’ अलग से नहीं है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: γένηται
  choice: घटित हो जाएँ
  rationale: γίνομαι यहाँ घटनाओं के होने या घटित होने को बताता है; ‘घटित हो जाएँ’ ἕως ἂν के बाद अपेक्षित भाव और भविष्यगत पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंत-समय संबंधी कथन में ‘यह पीढ़ी’ का अर्थ
  choice: मुख्य पाठ में ‘यह पीढ़ी’ रखा गया है और उसके संदर्भ का निर्णय नहीं किया गया।
  alternative: ‘ये लोग’, ‘यह युग’, अथवा ‘इन घटनाओं को देखने वाली पीढ़ी’
  rationale: यूनानी पदबंध का सीधा अनुवाद ‘यह पीढ़ी’ है, पर उसका अभिप्राय विवादित है। अनुवाद को यीशु के समकालीनों, किसी जनसमूह, किसी युग, या चिह्न देखने वाली पीढ़ी में से किसी एक व्याख्या को आरोपित नहीं करना चाहिए।
- issue: πάντα में संकेतवाचक ‘ये’ की स्पष्टता
  choice: मुख्य पाठ में प्रसंगानुकूल ‘ये सब बातें’ और पादटिप्पणी में शाब्दिक रूप की सूचना।
  alternative: ‘सब बातें’ या ‘सब कुछ’
  rationale: पूर्ववर्ती कथनों की ओर संकेत हिन्दी में स्पष्ट और स्वाभाविक है, पर मूल यूनानी में संकेतवाचक सर्वनाम नहीं है; इसलिए यह तथ्य पाठक के लिए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सच कहता हूँ’ पारंपरिक बाइबलीय गंभीरता को बनाए रखता है; ‘निश्चय ही’ प्रबल यूनानी निषेध को स्पष्ट करता है। पादटिप्पणी-चिह्न उसी संबंधित पद के तुरंत बाद रखे गए हैं।
