  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: hi
  text: आकाश और पृथ्वी मिट जाएँगे, पर मेरी बातें कभी नहीं मिटेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: आकाश और पृथ्वी
  rationale: यह स्थापित युग्म समूची सृष्टि के व्यापक दायरे को व्यक्त करता है; यहाँ οὐρανός केवल दिखाई देने वाला आसमान और γῆ कोई विशेष भूभाग नहीं है।
- source_word: παρελεύσονται
  choice: मिट जाएँगे / मिटेंगी
  rationale: इस संदर्भ में παρέρχομαι का अर्थ समाप्त हो जाना या अस्तित्व से जाता रहना है। हिंदी में लिंग के अनुसार रूप बदलते हुए दोनों जगह एक ही क्रिया रखी गई है, जिससे मूल की पुनरावृत्ति और विरोध सुरक्षित रहते हैं।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ सृष्टि की नश्वरता और यीशु की बातों के स्थायित्व के बीच स्पष्ट विरोध दिखाता है।
- source_word: λόγοι
  choice: बातें
  rationale: λόγοι यहाँ यीशु द्वारा कही गई बातों या वचनों को दर्शाता है। आधुनिक सामान्य हिंदी में ‘मेरी बातें’ स्वाभाविक और स्पष्ट है तथा बहुवचन भी बनाए रखता है।
- source_word: οὐ μὴ
  choice: कभी नहीं
  rationale: भविष्यकालीन क्रिया के साथ οὐ μὴ प्रबल निषेध है। ‘कभी नहीं’ हिंदी में स्वाभाविक ढंग से इसकी निश्चित और पूर्ण निषेधात्मक शक्ति व्यक्त करता है।
theological_decisions:
- issue: यीशु की बातों के स्थायित्व के दावे की प्रबलता
  choice: ‘कभी नहीं मिटेंगी’ द्वारा पूर्ण और प्रबल निषेध को स्पष्ट रखा गया है।
  alternative: ‘निश्चय ही नहीं मिटेंगी’
  rationale: मूल यूनानी οὐ μὴ साधारण निषेध से अधिक प्रबल है। ‘कभी नहीं’ सहज आधुनिक हिंदी में उस पूर्णता को व्यक्त करता है और पाठ में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘आकाश और पृथ्वी’ प्रचलित ब्रह्मांडीय युग्म है; ‘मिट जाएँगे/मिटेंगी’ मूल की समान क्रिया को हिंदी की व्याकरणिक लिंग-संगति के साथ दोहराता है।
