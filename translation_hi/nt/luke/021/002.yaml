  rationale: λεπτά अत्यल्प मूल्य के बहुत छोटे ताँबे के सिक्के थे। यह अनुवाद संख्या, आकार और धातु को सामान्य पाठक के लिए स्पष्ट करता है; मूल नाम को पादटिप्पणी में सुरक्षित रखा गया है।
