  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: hi
  text: और वे तलवार की धार से मारे जाएँगे, और उन्हें बन्दी बनाकर सब राष्ट्रों में ले जाया जाएगा[a]। यरूशलेम राष्ट्रों के पैरों तले रौंदा जाएगा[b], जब तक राष्ट्रों के समय पूरे न हो जाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें बन्दी बनाकर सब गैर-यहूदियों के बीच ले जाया जाएगा।” यूनानी शब्द का अर्थ “राष्ट्र” या “गैर-यहूदी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरूशलेम गैर-यहूदियों के पैरों तले रौंदा जाएगा।”
    reason: alternative_reading
  - marker: c
    text: या, “जब तक गैर-यहूदियों के समय पूरे न हो जाएँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: मारे जाएँगे
  rationale: युद्ध के प्रसंग में πίπτω का अर्थ तलवार से मर गिरना है। हिन्दी में केवल ‘गिरेंगे’ अस्पष्ट होता; ‘मारे जाएँगे’ प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: στόματι μαχαίρης
  choice: तलवार की धार से
  rationale: शाब्दिक रूप ‘तलवार के मुँह से’ है; ‘तलवार की धार से’ हिन्दी का स्वाभाविक और चित्रात्मक समतुल्य है।
- source_word: αἰχμαλωτισθήσονται
  choice: बन्दी बनाकर ... ले जाए जाएँगे
  rationale: भविष्यत् कर्मवाच्य रूप बन्दी बनाए जाने और वहाँ से ले जाए जाने, दोनों भावों को प्रकट करता है।
- source_word: εἰς τὰ ἔθνη πάντα
  choice: सब राष्ट्रों में
  rationale: εἰς गति को और πάντα व्यापकता को व्यक्त करता है। ‘में’ निर्वासन के बाद विभिन्न राष्ट्रों के बीच पहुँचाए जाने का स्वाभाविक हिन्दी रूप है।
- source_word: Ἰερουσαλὴμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: πατουμένη
  choice: पैरों तले रौंदा जाएगा
  rationale: ἔσται के साथ वर्तमान कर्मवाच्य कृदन्त भविष्य में जारी अधीनता दर्शाता है; यह हिन्दी प्रयोग मूल बिंब और अपमानजनक दमन दोनों को बनाए रखता है।
- source_word: ὑπὸ ἐθνῶν
  choice: राष्ट्रों के पैरों तले
  rationale: ὑπό कर्ता को सूचित करता है। ‘राष्ट्रों’ को पहले प्रयोग के अनुरूप रखा गया है और ‘पैरों तले’ रौंदने के बिंब में स्वाभाविक रूप से जुड़ता है।
- source_word: ἄχρι οὗ
  choice: जब तक
  rationale: कालगत सीमा बताने वाला संक्षिप्त और स्वाभाविक हिन्दी समतुल्य।
- source_word: πληρωθῶσιν
  choice: पूरे न हो जाएँ
  rationale: कर्मवाच्य भाव और निर्धारित अवधियों के पूर्ण होने का अर्थ बनाए रखता है, बिना किसी विशेष अंत-समय योजना को आरोपित किए।
- source_word: καιροὶ ἐθνῶν
  choice: राष्ट्रों के समय
  rationale: καιροί साधारण अवधि से अधिक विशेष या नियत समयों को सूचित कर सकता है। यह अनुवाद सम्बन्धवाचक पदबंध की अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: इस पद में ἔθνη के तीनों प्रयोग
  choice: राष्ट्र / राष्ट्रों
  alternative: गैर-यहूदी / गैर-यहूदियों
  rationale: एक ही यूनानी शब्द के तीनों प्रयोगों में शब्दगत एकता रखी गई है। ‘राष्ट्र’ भूराजनीतिक और गैर-यहूदी जनसमूह—दोनों सम्भावनाओं को समय से पहले सीमित नहीं करता; प्रासंगिक वैकल्पिक अर्थ पादटिप्पणियों में दिया गया है।
- issue: καιροὶ ἐθνῶν का आशय
  choice: राष्ट्रों के समय पूरे न हो जाएँ
  alternative: गैर-यहूदियों के समय पूरे न हो जाएँ; राष्ट्रों के नियत समय पूरे न हो जाएँ
  rationale: वाक्यांश किसी सीमाबद्ध या नियत अवधि की ओर संकेत कर सकता है, पर उसकी सटीक धर्मवैज्ञानिक योजना स्पष्ट नहीं करता। चुना हुआ रूप इस तनाव और सम्बन्ध की अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘बन्दी’, ‘तलवार की धार’ और ‘पैरों तले रौंदा’ जैसे परिचित पद मूल की युद्ध तथा अधीनता की छवियाँ बनाए रखते हैं। मुख्य पाठ में ἔθνη को लगातार ‘राष्ट्र’ रखा गया है और ‘गैर-यहूदी’ अर्थ पादटिप्पणियों में सुरक्षित है।
