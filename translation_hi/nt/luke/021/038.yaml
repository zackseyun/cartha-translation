review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the collective scope of πᾶς ὁ λαός, the customary force of the imperfect ὤρθριζεν, movement toward Jesus, the temple setting, and the purpose of hearing him. However, “भोर होते ही” more specifically means ‘as soon as dawn breaks,’ whereas the Greek denotes coming/rising very early; “भोर में बहुत जल्दी” preserves the early-morning sense without adding that immediate-at-dawn nuance.
  naturalness: The revised wording is natural modern standard Hindi and keeps the repeated/customary action clear with “आते थे.”
  terminology: “मंदिर” suitably renders ἱερόν when qualified by the cultural footnote. “उसे सुनने के लिए” is a direct, idiomatic rendering of ἀκούειν αὐτοῦ and avoids adding “बात,” which is not explicit in the Greek.
  issues:
  - severity: low
    issue: “भोर होते ही” is slightly narrower than ὤρθριζεν.
    rationale: It can imply arrival exactly when dawn begins. The source more broadly conveys very early-morning customary coming.
  revised_text: और सब लोग भोर में बहुत जल्दी उसे सुनने के लिए मंदिर में उसके पास आते थे।[a]
