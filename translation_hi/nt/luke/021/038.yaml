- from: और सब लोग उसकी बात सुनने के लिए भोर होते ही मन्दिर में उसके पास आ जाते थे।[a]
  to: और सब लोग भोर में बहुत जल्दी उसे सुनने के लिए मंदिर में उसके पास आते थे।[a]
  rationale: The revision replaces the overly immediate nuance of “भोर होते ही” with “भोर में बहुत जल्दी,” while retaining the imperfect’s customary sense in “आते थे.” It also uses “उसे सुनने के लिए,” which is closer to the Greek wording than “उसकी बात सुनने के लिए.” The footnote remains correctly anchored and accurately distinguishes the temple complex from the inner sanctuary.
