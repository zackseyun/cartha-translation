  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: hi
  text: और सब लोग भोर में बहुत जल्दी उसे सुनने के लिए मंदिर में उसके पास आते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν से आशय पूरे मंदिर-परिसर या उसके आँगनों से है, केवल भीतरी पवित्रस्थान से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: सब लोग
  rationale: यह सामूहिक और व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह अनावश्यक दावा किए कि प्रत्येक व्यक्ति आया था।
- source_word: ὤρθριζεν
  choice: भोर होते ही ... आ जाते थे
  rationale: क्रिया का अपूर्णकाल प्रायः होने वाली क्रिया को और ὀρθρίζω प्रातः बहुत जल्दी आने या उपस्थित होने को दर्शाता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर जाकर उसके पास पहुँचने का भाव देता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: सरल और प्रचलित हिन्दी अभिव्यक्ति; ἱερόν के व्यापक मन्दिर-परिसर वाले अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: ἀκούειν αὐτοῦ
  choice: उसकी बात सुनने के लिए
  rationale: यह उद्देश्यसूचक infinitive और यीशु को ध्यान से सुनने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
