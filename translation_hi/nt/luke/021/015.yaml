language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: hi
  text: क्योंकि मैं तुम्हें ऐसे शब्द और बुद्धि दूँगा कि तुम्हारे सभी विरोधी न तो उनका सामना कर सकेंगे, न उनका खंडन कर सकेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: शब्द
  rationale: शाब्दिक अर्थ ‘मुँह’ है, पर इस संदर्भ में यह बोलने की क्षमता अथवा कहे जाने वाले शब्दों का लाक्षणिक संकेत है। आधुनिक हिन्दी में ‘शब्द’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यह बोलते समय मिलने वाली समझ और विवेक को व्यक्त करता है; ‘बुद्धि’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: ἀντιστῆναι
  choice: सामना कर सकेंगे
  rationale: क्रिया का भाव विरोध में टिकने या प्रभावी प्रतिरोध करने का है। ‘सामना करना’ इस प्रसंग में सहज हिन्दी है और अगली क्रिया से अलग अर्थ बनाए रखता है।
- source_word: ἀντειπεῖν
  choice: खंडन
  rationale: यह प्रत्युत्तर में विरोध करने या कही बात को काटने का अर्थ देता है। ‘खंडन करना’ वाणी और तर्क के प्रसंग को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἅπαντες οἱ ἀντικείμενοι ὑμῖν
  choice: तुम्हारे सभी विरोधी
  rationale: ‘सभी’ स्रोत के समग्र बल को बनाए रखता है और ‘विरोधी’ उन लोगों को स्वाभाविक हिन्दी में दर्शाता है जो शिष्यों के विरुद्ध खड़े हैं।
theological_decisions:
- issue: यीशु द्वारा वाणी और बुद्धि दिए जाने का प्रत्यक्ष दावा
  choice: ‘मैं तुम्हें ... दूँगा’ को यथावत रखा गया
  alternative: इसे सामान्य ईश्वरीय सहायता या केवल प्रेरणा के रूप में समझाकर कहना
  rationale: मूल पाठ में कर्ता ἐγώ पर स्पष्ट बल है; अनुवाद को इस प्रत्यक्ष प्रतिज्ञा को बिना संप्रदायगत व्याख्या के बनाए रखना चाहिए।
- issue: विरोधियों की असमर्थता का स्वरूप
  choice: ‘न तो सामना ... और न खंडन’
  alternative: इसे विरोधियों की चुप्पी, पराजय या उद्धार की निश्चितता के रूप में विस्तृत करना
  rationale: पाठ केवल प्रभावी प्रतिरोध और प्रत्युत्तर की असमर्थता कहता है; परिणाम के बारे में इससे अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम’, और गरिमापूर्ण किंतु सहज वाक्य-विन्यास। ‘मुँह’ के अत्यधिक शाब्दिक रूप के स्थान पर प्रसंगानुकूल ‘शब्द’ चुना गया है।
