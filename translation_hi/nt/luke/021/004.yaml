revisions:
- from: क्योंकि इन सबने अपनी बहुतायत में से भेंटों[a] में डाला, पर इस स्त्री ने अपनी कमी[b] में से अपनी सारी जीविका—जो उसके पास थी—डाल दी।[c]
  to: क्योंकि इन सबने अपनी बहुतायत में से भेंट के रूप में चढ़ाया, पर इस स्त्री ने अपने अभाव में से अपने जीवन-निर्वाह के वे सारे साधन, जो उसके पास थे, डाल दिए।[a]
  rationale: 'The revision replaces two unnatural expressions with idiomatic modern Hindi while retaining every material source element: all the others gave from their abundance; the woman gave from her lack; and she deposited all the means by which she lived. ‘भेंट के रूप में चढ़ाया’ renders the donation action naturally without importing a temple treasury. The footnote anchor is retained and its content updated to cover the chief lexical clarification and alternatives.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explanatory γάρ, the contrast between surplus and lack, and βίος as means of subsistence rather than physical life. However, ‘भेंटों में डाला’ is not idiomatic Hindi and can misleadingly suggest that the gifts themselves were the container. The donation sense of ἔβαλον εἰς τὰ δῶρα is better expressed idiomatically as making/placing an offering, without adding ‘treasury.’
  naturalness: ‘अपनी कमी में से’ and especially ‘भेंटों में डाला’ are awkward in modern standard Hindi. ‘अपने अभाव में से’ is natural while retaining the lexical contrast with ‘बहुतायत,’ and ‘भेंट के रूप में चढ़ाया’ communicates the temple-donation action naturally.
  terminology: ‘बहुतायत,’ ‘अभाव,’ and ‘जीवन-निर्वाह के सारे साधन’ are appropriate, dignified modern Hindi renderings. The latter clearly conveys βίος as livelihood/resources. The footnotes are adjusted to match the revised wording and preserve the relevant alternatives.
  issues:
  - severity: medium
    issue: ‘भेंटों में डाला’ is semantically and idiomatically unclear in Hindi.
    rationale: Although it follows the Greek preposition mechanically, Hindi normally does not describe a donation as being put ‘into gifts.’ An idiomatic donation expression is needed while avoiding the unsupported addition ‘मंदिर के भंडार में।’
  - severity: low
    issue: ‘अपनी कमी में से’ is less natural than ‘अपने अभाव में से।’
    rationale: ‘अभाव’ is a standard Hindi expression for ὑστέρημα in this contrast and preserves the sense of lack/need without restricting it solely to social poverty.
  revised_text: क्योंकि इन सबने अपनी बहुतायत में से भेंट के रूप में चढ़ाया, पर इस स्त्री ने अपने अभाव में से अपने जीवन-निर्वाह के वे सारे साधन, जो उसके पास थे, डाल दिए।[a]
  revised_footnotes:
