id: LUK.21.4
reference: Luke 21:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: hi
  text: क्योंकि इन सबने अपनी बहुतायत में से भेंट के रूप में चढ़ाया, पर इस स्त्री ने अपने अभाव में से अपने जीवन-निर्वाह के वे सारे साधन, जो उसके पास थे, डाल दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपना सारा जीवन-निर्वाह।’ यूनानी शब्द का अर्थ उसके जीवन-निर्वाह के सारे साधन हैं, न कि उसका पूरा जीवन-अस्तित्व। ‘अपने अभाव में से’ के लिए ‘अपनी गरीबी में से’ या ‘अपनी आवश्यकता में से’ भी कहा जा सकता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: क्योंकि इन सबने
  rationale: γάρ पिछले कथन का कारण स्पष्ट करता है, इसलिए ‘क्योंकि’ स्वाभाविक है; πάντες οὗτοι का अर्थ ‘इन सबने’ रखा गया है।
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: अपनी बहुतायत में से
  rationale: περισσεύοντος उस चीज़ को दर्शाता है जो आवश्यकता से अधिक या प्रचुर मात्रा में हो; यह आगे आने वाली ‘कमी’ के साथ मूल विरोध बनाए रखता है।
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: भेंटों में डाला
  rationale: ἔβαλον के जमा करने वाले ठोस भाव को ‘डाला’ से और δῶρα के बहुवचन को ‘भेंटों’ से व्यक्त किया गया है; मंदिर का संदर्भ निहित है, पर पाठ में ‘भंडार’ नहीं जोड़ा गया।
- source_word: αὕτη δὲ
  choice: पर इस स्त्री ने
  rationale: स्त्रीलिंग संकेतवाचक पहले उल्लिखित विधवा की ओर संकेत करता है; ‘इस स्त्री’ स्पष्ट और स्वाभाविक है तथा δέ का विरोध ‘पर’ से सुरक्षित है।
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: अपनी कमी में से
  rationale: ὑστέρημα अभाव, कमी या आवश्यकता को व्यक्त करता है। ‘कमी’ बहुतायत के साथ शब्दार्थगत विरोध बनाए रखती है और केवल सामाजिक श्रेणी के रूप में गरीबी तक अर्थ सीमित नहीं करती।
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: अपनी सारी जीविका—जो उसके पास थी—
  rationale: βίος यहाँ जीवन-अस्तित्व नहीं, जीवन-निर्वाह के साधन को दर्शाता है। ‘जीविका’ उस भौतिक अर्थ को सुरक्षित रखती है और ὃν εἶχεν को अलग उपवाक्य में स्पष्ट करती है।
- source_word: ἔβαλεν
  choice: डाल दी
  rationale: सिक्के जमा करने की ठोस क्रिया को बनाए रखा गया है; ‘दी’ पूर्ण क्रिया और स्त्रीलिंग कर्ता के अनुरूप स्वाभाविक हिन्दी है।
theological_decisions:
- issue: विधवा के दान में βίος का अर्थ
  choice: भौतिक जीवन-निर्वाह के साधन के अर्थ में ‘जीविका’
  alternative: अपना सारा जीवन
  rationale: प्रसंग धन देने का है और βίος यहाँ निर्वाह-साधन को सूचित करता है। ‘सारा जीवन’ से यह भ्रामक अर्थ निकल सकता है कि उसने अपना अस्तित्व या जीवन स्वयं दे दिया।
- issue: τὰ δῶρα का संदर्भ
  choice: भेंटों
  alternative: चढ़ावे; मंदिर का भंडार
  rationale: δῶρα का सीधा अर्थ ‘भेंटें’ है। मंदिर का प्रसंग स्पष्ट है, किंतु इस पद में स्वयं ‘भंडार’ नहीं कहा गया; इसलिए अनावश्यक विशिष्टता नहीं जोड़ी गई।
- issue: ὑστέρημα की तीव्रता
  choice: कमी
  alternative: गरीबी; अभाव
  rationale: मूल शब्द कमी, अभाव या आवश्यकता के अर्थों को समेटता है। ‘कमी’ मूल की व्यापकता और ‘बहुतायत’ के साथ विरोध को सुरक्षित रखती है; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘बहुतायत’ और ‘कमी’ मूल के समानांतर विरोध को बनाए रखते हैं। ‘जीविका’ थोड़ा औपचारिक किंतु व्यापक रूप से बोधगम्य है और βίος के आर्थिक/निर्वाह संबंधी अर्थ को सटीक रखती है।
