    text: शाब्दिक रूप से, ‘अपना सारा जीवन-निर्वाह।’ यूनानी शब्द का अर्थ उसके जीवन-निर्वाह के सारे साधन हैं, न कि उसका पूरा जीवन-अस्तित्व। ‘अपने अभाव में से’ के लिए ‘अपनी गरीबी में से’ या ‘अपनी आवश्यकता में से’ भी कहा जा सकता है।
    reason: lexical_clarification
