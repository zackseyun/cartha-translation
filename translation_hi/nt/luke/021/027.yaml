id: LUK.21.27
reference: Luke 21:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: hi
  text: और तब वे मनुष्य के पुत्र को सामर्थ्य और बड़ी महिमा के साथ एक बादल में आते हुए देखेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बादल पर।” यूनानी पाठ में एकवचन “एक बादल में” है, जबकि यह बिंब दानिय्येल 7 और उससे संबंधित उन अंशों की प्रतिध्वनि करता है जिनमें मनुष्य का पुत्र बादलों के साथ आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: वे...देखेंगे
  rationale: भविष्यकालीन दृश्य बोध को सहज और सीधे आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह स्थापित मसीही उपाधि है और दानिय्येल 7 से इसके साहित्यिक तथा धर्मवैचारिक संबंध को बनाए रखती है।
- source_word: ἐρχόμενον
  choice: आते हुए
  rationale: वर्तमान कृदन्त उस जारी क्रिया को व्यक्त करता है जिसे लोग देखेंगे; ‘आते हुए’ हिन्दी में स्वाभाविक है।
- source_word: ἐν νεφέλῃ
  choice: एक बादल में
  rationale: यूनानी पाठ में संज्ञा एकवचन है और ἐν के साथ आई है; यह अनुवाद ‘बादलों’ करके सामंजस्य बैठाए बिना मूल रूप को सुरक्षित रखता है।
- source_word: μετὰ δυνάμεως
  choice: सामर्थ्य...के साथ
  rationale: μετά और संबंधकारक यहाँ साथ होने का भाव देते हैं; ‘सामर्थ्य’ प्रसंग के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: δόξης πολλῆς
  choice: बड़ी महिमा
  rationale: πολλῆς की मात्रा/महानता को हिन्दी के स्वाभाविक पदबंध ‘बड़ी महिमा’ से व्यक्त किया गया है।
theological_decisions:
- issue: मसीही उपाधि τὸν υἱὸν τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: मानव-पुत्र
  rationale: प्रचलित उपाधि दानिय्येल 7 की प्रतिध्वनि और नए नियम में इसके उपाधिगत प्रयोग को सुरक्षित रखती है।
- issue: बादल का बिंब और दानिय्येल/ईश्वर-प्रकटन की प्रतिध्वनि
  choice: एक बादल में
  alternative: एक बादल पर
  rationale: यह लूका के एकवचन νεφέλῃ और ἐν के सामान्य अर्थ का निकटता से अनुसरण करता है, जबकि पादटिप्पणी वास्तविक स्थानगत विकल्प को सामने रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य का पुत्र,’ ‘सामर्थ्य’ और ‘महिमा’ जैसे परिचित बाइबलीय पद अंतरपाठीय तथा धर्मवैचारिक प्रतिध्वनि बनाए रखते हैं; वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्पष्ट है।
