source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: hi
  text: लेकिन जब तुम यरूशलेम को सेनाओं से घिरा हुआ देखो[a], तब जान लो कि उसका उजड़ जाना[b] निकट आ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सैनिक छावनियों से घिरा हुआ।’ यूनानी शब्द छावनियों या छावनी डाले हुए सैन्य दलों के लिए प्रयुक्त हो सकता है; यहाँ आशय यरूशलेम को घेरने वाली सेनाओं से है।
    reason: lexical_alternative
  - marker: b
    text: ‘उजड़ जाना’ भविष्यद्वक्ताओं के न्याय-संबंधी शब्दों की प्रतिध्वनि है; मत्ती 24:15 और मरकुस 13:14 में संबंधित भाषा की तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: लेकिन जब
  rationale: ὅταν भविष्य की संभावित परिस्थिति प्रस्तुत करता है और δέ पिछले कथन से हल्का मोड़ या विरोध दिखाता है; आधुनिक हिन्दी में ‘लेकिन जब’ दोनों कार्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἴδητε
  choice: तुम ... देखो
  rationale: ὅταν के साथ आया अओरिस्ट सब्जंक्टिव भविष्य में दिखाई देने वाले चिह्न को बताता है; हिन्दी में ‘जब ... देखो’ स्वाभाविक और सीधा है।
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: सेनाओं से घिरा हुआ
  rationale: वर्तमान कर्मवाच्य कृदन्त यरूशलेम की उस समय की घिरी हुई दशा दिखाता है। στρατόπεδον छावनी या छावनी डाले सैन्य दल को सूचित कर सकता है; प्रसंग में ‘सेनाओं’ से घेराबंदी स्पष्ट होती है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: τότε γνῶτε
  choice: तब जान लो
  rationale: τότε परिणाम का समय बताता है और γνῶτε अओरिस्ट आज्ञार्थक है; ‘जान लो’ चिह्न का अर्थ पहचानने की सीधी आज्ञा व्यक्त करता है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: परफेक्ट काल ऐसी निकटता बताता है जो पास आने के फलस्वरूप अब उपस्थित है; ‘निकट आ गया है’ इस परिणामी अवस्था को बनाए रखता है।
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: उसका उजड़ जाना
  rationale: ἐρήμωσις उजाड़ या विनष्ट दशा की ओर संकेत करता है। ‘उजड़ जाना’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य ‘विनाश’ कहने की अपेक्षा भविष्यद्वाणी-संबंधी उजाड़ के भाव को अधिक सुरक्षित रखता है।
theological_decisions:
- issue: यरूशलेम पर आने वाले न्याय का स्वरूप
  choice: ἐρήμωσις को ‘उसका उजड़ जाना’ कहा गया है, बिना किसी विशिष्ट परवर्ती अंत-समय संबंधी व्याख्या को मुख्य पाठ में जोड़ने के।
  alternative: इसे ‘उसका विनाश’ कहना, या मुख्य पाठ में इसे ‘उजाड़ने वाली घृणित वस्तु’ से स्पष्ट रूप से जोड़ना।
  rationale: पद स्वयं सेनाओं से घिरे यरूशलेम के निकट आते उजड़ने की बात करता है। चुना हुआ रूप भविष्यद्वाणी-संबंधी न्याय की प्रतिध्वनि बनाए रखता है, पर इस पद से आगे बढ़कर किसी एक व्याख्यात्मक ढाँचे को निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लेकिन’ और ‘जान लो’ सामान्य पाठक के लिए स्वाभाविक हैं; ‘उजड़ जाना’ धार्मिक तकनीकी भाषा से बचते हुए मूल के भविष्यद्वाणी-संबंधी भार को बनाए रखता है।
