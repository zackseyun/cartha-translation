reference: Luke 21:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: hi
  text: उन्होंने उससे पूछा, “गुरु, तो ये बातें कब होंगी, और जब ये बातें होने वाली हों[a], तब कौन-सा चिन्ह होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब ये बातें होने को हों।” यूनानी क्रिया का अर्थ अधिक सामान्य रूप में भी लिया जा सकता है, केवल बिल्कुल आसन्न घटना के अर्थ में नहीं।
    reason: μέλλῃ में आसन्नता का भाव हो सकता है, पर इसका अर्थ अधिक व्यापक रूप से ‘होने वाली’ भी हो सकता है।
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: उन्होंने उससे पूछा
  rationale: साधारण भूतकालीन घटना और सीधे प्रश्न के प्रसंग में यह स्वाभाविक आधुनिक हिन्दी है; αὐτόν को ‘उससे’ द्वारा स्पष्ट रखा गया है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ हल्के कथात्मक संयोजक के रूप में बात को आगे बढ़ाता है; ‘तब’ हिन्दी में प्रसंग का सहज प्रवाह बनाए रखता है और अनावश्यक विरोध नहीं दर्शाता।
- source_word: λέγοντες
  choice: पूछा
  rationale: यूनानी कृदन्त प्रश्न के कथन को प्रस्तुत करता है। हिन्दी में ‘यह कहते हुए पूछा’ अनावश्यक रूप से भारी होता; ‘पूछा’ उसी कार्य को स्वाभाविक ढंग से समेटता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन में ‘गुरु’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा शिक्षक के अर्थ को व्यक्त करता है।
- source_word: πότε οὖν
  choice: कब
  rationale: πότε का समय-संबंधी प्रश्न सीधे ‘कब’ से व्यक्त होता है। οὖν का निष्कर्षात्मक संबंध हिन्दी के प्रसंग और आरम्भिक ‘तब’ में स्वाभाविक रूप से निहित है।
- source_word: ταῦτα ἔσται
  choice: ये बातें कब होंगी
  rationale: εἰμί का भविष्यकाल यहाँ घटनाओं के घटित होने का मुहावरेदार भाव रखता है; ‘होंगी’ यूनानी रूप के निकट रहते हुए हिन्दी में स्पष्ट है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह किसी आने वाली घटना की ओर संकेत करने वाले लक्षण को दर्शाता है; ‘चिन्ह’ इस प्रसंग में स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: ὅταν
  choice: जब ... तब
  rationale: भविष्याभिमुख कालवाचक उपवाक्य को हिन्दी की स्वाभाविक ‘जब…तब’ रचना से व्यक्त किया गया है।
- source_word: μέλλῃ
  choice: होने ही वाली हों
  rationale: ‘ही वाली’ निकट या आसन्न घटना की छाया को बनाए रखता है, पर उसे किसी निश्चित समय-सारिणी में नहीं बाँधता।
- source_word: γίνεσθαι
  choice: होने
  rationale: घटनाओं के घटित होने के अर्थ में यह सरल, स्वाभाविक हिन्दी है और पहले खंड के ‘होंगी’ से अर्थगत संबंध भी बनाए रखता है।
theological_decisions:
- issue: अन्तकाल-संबंधी भाषा और समय की सूक्ष्मता
  choice: μέλλῃ की आसन्नता को ‘होने ही वाली हों’ से बनाए रखा गया है, बिना यह तय किए कि घटनाएँ कितनी निकट या दूर हैं।
  alternative: इसे अधिक सामान्य रूप में ‘होने वाली हों’ या ‘घटने वाली हों’ कहा जा सकता है।
  rationale: शिष्य समय और पूर्वसूचक चिन्ह के विषय में पूछते हैं। अनुवाद को किसी विशेष अन्तकालीन योजना के पक्ष में प्रश्न का समाधान नहीं करना चाहिए, पर यूनानी क्रिया में उपस्थित आसन्नता की सम्भावना भी नहीं मिटानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी की ‘कहते हुए पूछा’ संरचना को हिन्दी में संक्षिप्त ‘पूछा’ किया गया है। ‘जब…तब’ रचना प्रश्न को स्वाभाविक बनाती है, और पद की वास्तविक समय-संबंधी अस्पष्टता फुटनोट में सुरक्षित है।
