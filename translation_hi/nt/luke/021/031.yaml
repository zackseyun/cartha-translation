id: LUK.21.31
reference: Luke 21:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: hi
  text: इसी प्रकार तुम भी, जब इन बातों को होते देखो[a], तो जान लो कि परमेश्वर का राज्य[b] निकट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों को घटित होते देखो।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का शासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: इसी प्रकार तुम भी
  rationale: यह पिछले उदाहरण को शिष्यों पर लागू करता है। ‘तुम भी’ स्पष्ट सर्वनाम के हल्के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὅταν ἴδητε
  choice: जब ... देखो
  rationale: यह भविष्य में होने वाली स्थिति को व्यक्त करता है। ‘जब ... देखो’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की भविष्यसूचक दिशा को बनाए रखता है।
- source_word: ταῦτα γινόμενα
  choice: इन बातों को होते
  rationale: यह पहले बताए गए संकेतों और घटनाओं के घटने की ओर संकेत करता है। ‘होते’ सरल और व्यापक है; ‘घटित होते’ अधिक औपचारिक विकल्प है।
- source_word: γινώσκετε
  choice: जान लो
  rationale: आज्ञार्थक रूप को स्पष्ट रूप से व्यक्त करता है और संकेतों का अर्थ पहचानने की अपेक्षा बताता है।
- source_word: ἐγγύς ἐστιν
  choice: निकट है
  rationale: मूल की स्थानिक-कालिक निकटता की उपमा को बिना अतिरिक्त कालगत व्याख्या के सुरक्षित रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह प्रचलित बाइबलीय पदावली है और क्षेत्र तथा राजकीय शासन—दोनों संभावित अर्थ-छायाओं को संकुचित नहीं करती।
theological_decisions:
- issue: अंत-काल संबंधी प्रसंग में ‘परमेश्वर का राज्य’ का अर्थ
  choice: ‘परमेश्वर का राज्य’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘परमेश्वर का शासन’
  rationale: पद राज्य की निकटता को बताए गए संकेतों से जोड़ता है, पर यह स्पष्ट नहीं करता कि मुख्य अभिप्राय उसके प्रकट होने, परिपूर्ण होने या न्यायोचित सिद्ध होने से है। मूल अभिव्यक्ति इस धर्मवैज्ञानिक तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘जान लो’ आज्ञार्थक बल को स्वाभाविक ढंग से व्यक्त करता है; ‘निकट है’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
