  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: hi
  text: तब उसने ऊपर देखा और धनी लोगों को अपनी भेंटें[a] कोष[b] में डालते देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दान।”
