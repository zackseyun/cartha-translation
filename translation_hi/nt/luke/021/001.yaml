    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: ऊपर देखा
  rationale: यह क्रिया यहाँ दृष्टि ऊपर उठाने की ठोस क्रिया बताती है; ‘ऊपर देखा’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग की आगे बढ़ती घटना को सहज रूप से जोड़ता है, बिना विरोध का भाव बढ़ाए।
- source_word: εἶδεν
  choice: देखा
  rationale: साधारण प्रत्यक्ष बोध को व्यक्त करता है; ‘देखा’ किसी अतिरिक्त अर्थ, जैसे विशेष ध्यान देने, को नहीं जोड़ता।
- source_word: τοὺς βάλλοντας
  choice: लोगों को ... डालते
  rationale: संज्ञा की तरह प्रयुक्त कृदंत को हिन्दी में ‘लोगों’ से स्पष्ट किया गया है; दान देने के प्रसंग में βάλλω के लिए ‘डालते’ स्वाभाविक है।
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: भंडार में
  rationale: γαζοφυλάκιον मंदिर के कोष-क्षेत्र अथवा दान-पात्रों का संकेत दे सकता है। ‘भंडार’ संक्षिप्त है और मूल की व्यापकता बनाए रखता है; ‘मंदिर’ इस पद में प्रत्यक्ष नहीं जोड़ा गया।
- source_word: τὰ δῶρα αὐτῶν
  choice: अपने दान
  rationale: δῶρα का मूल अर्थ ‘भेंटें/उपहार’ है, पर इस धार्मिक और आर्थिक प्रसंग में ‘दान’ सामान्य हिन्दी में स्वाभाविक है। ‘अपने’ αὐτῶν के कर्ता-संबंध को स्पष्ट करता है।
- source_word: πλουσίους
  choice: धनी लोगों
  rationale: विशेषण यहाँ संज्ञा की तरह उन लोगों का वर्णन करता है; ‘धनी लोगों’ आधुनिक हिन्दी में स्पष्ट और तटस्थ है।
