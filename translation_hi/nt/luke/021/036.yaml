source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: hi
  text: पर हर समय जागते रहो और प्रार्थना करते रहो कि तुममें इन सब आनेवाली घटनाओं से बच निकलने और मनुष्य के पुत्र के सामने खड़े होने की सामर्थ्य हो।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘कि तुम इन सब बातों से बच निकलने के योग्य ठहरो’ है, ‘कि तुममें ... सामर्थ्य हो’ के स्थान पर।
    reason: textual_variant
  - marker: b
    text: या, ‘जो घटित होने वाली हैं।’
    reason: lexical_alternative
  - marker: c
    text: ‘मनुष्य के पुत्र के सामने खड़े होने’ में उसके सामने स्वीकार किए जाने या निर्दोष ठहराए जाने का संकेत हो सकता है, पर यूनानी पाठ इसे स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: जागते रहो
  rationale: आज्ञार्थक क्रिया लगातार सतर्क जागरूकता का आह्वान करती है। यह अभिव्यक्ति मूल के जागते रहने वाले रूपक को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले चेतावनी-खंड से हल्का विरोध अथवा संक्रमण दिखाता है; ‘पर’ हिन्दी में इस प्रवाह को संक्षेप में व्यक्त करता है।
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह पदबंध निरंतरता और प्रत्येक अवसर का भाव देता है; ‘हर समय’ सहज आधुनिक हिन्दी है।
- source_word: δεόμενοι
  choice: प्रार्थना करते रहो
  rationale: कृदंत में विनतीपूर्ण प्रार्थना का भाव है। मुख्य आज्ञा के साथ इसकी सतत संगति को हिन्दी में ‘करते रहो’ से स्पष्ट किया गया है।
- source_word: ἵνα κατισχύσητε
  choice: कि तुममें ... सामर्थ्य हो
  rationale: κατισχύω का अर्थ समर्थ होना या प्रबल होना है। यह पाठ ‘योग्य ठहराए जाओ’ वाले पाठांतर के बजाय SBLGNT के पाठ को दर्शाता है।
- source_word: ἐκφυγεῖν
  choice: बच निकलने
  rationale: यह केवल बचने से अधिक संकट से निकल जाने का भाव व्यक्त करता है और ἐκφυγεῖν के अर्थ के निकट है।
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: इन सब आनेवाली घटनाओं
  rationale: μέλλω के भावी अथवा निकट भविष्य के अर्थ को ‘आनेवाली’ स्वाभाविक रूप से व्यक्त करता है, जबकि घटनाओं के घटित होने का भाव संज्ञा-रचना में निहित है।
- source_word: σταθῆναι
  choice: खड़े होने
  rationale: मूल का प्रत्यक्ष बिंब सुरक्षित रखा गया है; स्वीकार किए जाने या निर्दोष ठहरने का अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἔμπροσθεν
  choice: के सामने
  rationale: स्थानिक और संबंधपरक अर्थ का सहज हिन्दी रूप।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: सुसमाचारों में प्रयुक्त इस उपाधि का स्थापित हिन्दी रूप है और इसके सेमिटिक तथा मसीही संदर्भ को सुरक्षित रखता है।
theological_decisions:
- issue: κατισχύσητε का अंतकालीन संकट सहने से संबंध
  choice: ‘तुममें ... सामर्थ्य हो’
  alternative: ‘तुम योग्य ठहराए जाओ’
  rationale: SBLGNT में κατισχύσητε है, जिसका संबंध सामर्थ्य या प्रबल होने से है। ‘योग्य ठहराए जाओ’ एक प्रसिद्ध पाठांतर है, इसलिए उसे मुख्य पाठ में लेने के बजाय पादटिप्पणी में रखा गया है।
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου का आशय
  choice: ‘मनुष्य के पुत्र के सामने खड़े होने’
  alternative: ‘मनुष्य के पुत्र के सामने स्वीकार किए हुए खड़े होने’
  rationale: वाक्यांश में अंतिम न्याय के समय स्वीकार या निर्दोष ठहराए जाने का संकेत हो सकता है, पर यूनानी पाठ इसे स्पष्ट रूप से नहीं कहता। अतः मूल बिंब और उसकी व्याख्यात्मक खुलावट सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। ‘जागते रहो’ मूल रूपक को बनाए रखता है; ‘प्रार्थना करते रहो’ सतत क्रिया को स्वाभाविक बनाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
