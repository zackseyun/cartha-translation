  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: hi
  text: उन दिनों गर्भवती स्त्रियों और दूध पिलानेवाली स्त्रियों पर हाय! क्योंकि इस भूमि[a] पर बड़ा संकट आएगा और इस प्रजा पर क्रोध होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पृथ्वी पर।’ यूनानी शब्द γῆ का अर्थ ‘भूमि’ या ‘पृथ्वी’ हो सकता है। यहाँ यरूशलेम और यहूदिया के संदर्भ के कारण ‘भूमि’ चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘इस प्रजा के लिए क्रोध’ अथवा ‘इस प्रजा के विरुद्ध क्रोध।’
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: हाय
  rationale: यह भविष्यद्वक्ताओं जैसी शोक और न्याय की गंभीर पुकार को संक्षिप्त तथा प्रभावशाली ढंग से बनाए रखता है।
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: गर्भवती स्त्रियों
  rationale: यह ‘गर्भ में रखनेवाली’ यूनानी अभिव्यक्ति का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: ταῖς θηλαζούσαις
  choice: दूध पिलानेवाली स्त्रियों
  rationale: यह क्रिया में निहित शिशुओं को दूध पिलाने के मातृ-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: यह यूनानी काल-सूचक पदबंध का निकट और प्रचलित हिन्दी अनुवाद है।
- source_word: ἀνάγκη μεγάλη
  choice: बड़ा संकट
  rationale: इस विपत्ति और न्याय के प्रसंग में इसका अर्थ केवल आवश्यकता नहीं, बल्कि भारी कष्ट या विकट परिस्थिति है।
- source_word: ἐπὶ τῆς γῆς
  choice: देश पर
  rationale: γῆ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ दोनों हो सकता है; यरूशलेम और यहूदिया के निकटवर्ती संदर्भ के कारण मुख्य पाठ में ‘देश’ उपयुक्त है।
- source_word: ὀργὴ
  choice: कोप
  rationale: यह आनेवाले प्रचंड क्रोध और न्याय का भार बनाए रखता है, पर यूनानी में अनुपस्थित कर्ता को नहीं जोड़ता।
- source_word: τῷ λαῷ τούτῳ
  choice: इस प्रजा पर
  rationale: दत्तिव कारक यहाँ कोप से प्रभावित समुदाय को दर्शाता है; ‘प्रजा’ λαός की सामुदायिक और वाचा-संबंधी छाया को बनाए रखती है।
theological_decisions:
- issue: γῆ और ‘इस प्रजा’ का संदर्भ तथा दायरा
  choice: मुख्य पाठ में ‘देश’ और ‘इस प्रजा’ रखा गया है, जिससे तत्काल प्रसंग में इस्राएल/यहूदिया और वहाँ की प्रजा की ओर संकेत उभरता है।
  alternative: ‘पृथ्वी’ पढ़कर इसे सार्वभौमिक दायरे में समझना।
  rationale: आस-पास का प्रसंग यरूशलेम के घिरने, उसके उजड़ने और यहूदिया की दशा पर केंद्रित है; फिर भी पादटिप्पणी γῆ की व्यापक अर्थ-संभावना सुरक्षित रखती है।
- issue: ὀργή का कर्ता और स्वरूप
  choice: ‘कोप’ कहा गया है, पर मुख्य पाठ में ‘परमेश्वर का’ नहीं जोड़ा गया।
  alternative: ‘परमेश्वर का कोप’ या व्याख्यात्मक ‘न्याय’।
  rationale: प्रसंग में इसे ईश्वरीय कोप समझना संभव है, किंतु यूनानी पाठ कर्ता को स्पष्ट नहीं करता; इसलिए अनुवाद उस धार्मिक तनाव और अस्पष्टता को बनाए रखता है।
- issue: τῷ λαῷ τούτῳ के दत्तिव का संबंध
  choice: ‘इस प्रजा पर कोप’
  alternative: ‘इस प्रजा के लिए कोप’ या ‘इस प्रजा के विरुद्ध कोप’।
  rationale: दत्तिव को प्रभावित लक्ष्य के रूप में लेना प्रसंगानुकूल और हिन्दी में स्वाभाविक है, जबकि अन्य संबंधों की संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘हाय’, ‘संकट’ और ‘कोप’ भविष्यद्वाणी तथा न्याय की गंभीरता बनाए रखते हैं; अनावश्यक पुरातन पदावली से बचा गया है।
