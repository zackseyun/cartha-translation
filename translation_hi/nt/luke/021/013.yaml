  language: hi
  text: यह तुम्हारे लिए गवाही बन जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβήσεται
  choice: बन जाएगा
  rationale: भविष्यत् रूप यहाँ साधारण घटना नहीं, बल्कि पहले कही गई परिस्थितियों के परिणाम को व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: सम्प्रदान कारक शिष्यों के संदर्भ में होने वाले परिणाम को दर्शाता है; आधुनिक हिन्दी में ‘तुम्हारे लिए’ स्वाभाविक है।
- source_word: εἰς
  choice: का अवसर
  rationale: यहाँ εἰς परिणाम अथवा प्रयोजन सूचित करता है। हिन्दी में ‘अवसर बन जाएगा’ इस कार्यात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μαρτύριον
  choice: गवाही देने
  rationale: संज्ञा μαρτύριον गवाही या साक्ष्य को दर्शाती है। प्रसंग में अधिकारियों के सामने शिष्यों द्वारा गवाही देना प्रमुख है; क्रियात्मक अभिव्यक्ति हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: अधिकारियों के सामने शिष्यों के दुःख का आशय
  choice: ये घटनाएँ शिष्यों के लिए गवाही देने का अवसर बनेंगी।
  alternative: ये घटनाएँ उनके विरोधियों के विरुद्ध प्रमाण ठहरेंगी।
  rationale: लूका के प्रसंग में गिरफ्तारी और शासकों के सामने पेशी के कारण शिष्यों की गवाही का अर्थ अधिक स्वाभाविक है। फिर भी अनुवाद यह निर्धारित नहीं करता कि गवाही केवल प्रचारात्मक है या न्यायिक।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘गवाही देने का अवसर’ मूल के परिणाम/प्रयोजन और सार्वजनिक या न्यायिक गवाही के भाव को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
