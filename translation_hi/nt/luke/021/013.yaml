  verdict: revise
  source_fidelity: The draft correctly conveys the future resultant sense of ἀποβήσεται and the reference to the disciples (ὑμῖν). However, ‘गवाही देने का अवसर’ makes explicit an ‘opportunity’ and the disciples’ act of testifying, whereas εἰς μαρτύριον states more compactly that the outcome will be ‘for/as testimony.’ The contextual interpretation is plausible, but the Greek wording should retain its broader testimonial sense.
  naturalness: ‘यह तुम्हारे लिए गवाही बन जाएगा’ is clear, idiomatic enough in modern standard Hindi, and suitably concise for this aphoristic saying.
  terminology: ‘गवाही’ is an appropriate modern Hindi equivalent for μαρτύριον and retains the public/judicial resonance without deciding whether it is testimony by the disciples or evidence against opponents.
  issues:
  - severity: medium
    issue: ‘अवसर’ is not expressed in the Greek text.
    rationale: Although the immediate context supports testimony before authorities, translating μαρτύριον as ‘गवाही देने का अवसर’ adopts an explanatory contextual expansion and narrows the phrase’s possible force. Rendering it as ‘गवाही’ better preserves the source wording and its ambiguity.
  revised_text: यह तुम्हारे लिए गवाही बन जाएगा।
