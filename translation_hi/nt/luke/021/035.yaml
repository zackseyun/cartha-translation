  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: hi
  text: फंदे की तरह[a]। क्योंकि वह दिन सारी पृथ्वी[b] पर रहनेवाले सभी लोगों पर आ पड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जाल की तरह’।
    reason: lexical_alternative
  - marker: b
    text: ‘सारी पृथ्वी’ का अनुवाद ‘सारी भूमि’ या ‘सारा देश’ भी हो सकता है, यद्यपि यहाँ व्यापक अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: फंदे की तरह
  rationale: παγίς किसी पकड़नेवाले फंदे या जाल को दर्शाता है। आधुनिक हिन्दी में ‘फंदा’ अचानक और बच निकलना कठिन होने की छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπεισελεύσεται
  choice: आ पड़ेगा
  rationale: भविष्यत्कालीन क्रिया किसी घटना के लोगों पर आ पहुँचने या उन्हें अचानक घेर लेने का भाव देती है। प्रसंग से इसका निहित कर्ता पिछले पद में उल्लिखित ‘वह दिन’ है; स्पष्टता के लिए उसे पाठ में व्यक्त किया गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन के कारण या आधार को प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को साफ और स्वाभाविक रखता है।
- source_word: ἐπὶ πάντας
  choice: सभी लोगों पर
  rationale: ἐπί के साथ कर्मकारक यहाँ किसी घटना के सब पर आ पड़ने का भाव देता है। ‘सभी लोगों पर’ सार्वभौमिक मानवीय दायरे को स्पष्ट करता है।
- source_word: τοὺς καθημένους
  choice: रहनेवाले
  rationale: κάθημαι का मूल अर्थ ‘बैठना’ है, पर इस भौगोलिक मुहावरे में इसका आशय निवास करना है। ‘रहनेवाले’ साधारण आधुनिक हिन्दी में यही अर्थ देता है।
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: सारी पृथ्वी पर
  rationale: शाब्दिक ‘सारी पृथ्वी के मुख पर’ हिन्दी में अस्वाभाविक है। ‘सारी पृथ्वी पर’ मुहावरे का स्थानगत अर्थ और वाक्य का व्यापक दायरा सुरक्षित रखता है।
- source_word: πάσης τῆς γῆς
  choice: सारी पृथ्वी
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। इस अन्तकालीन चेतावनी और ‘सभी रहनेवालों’ के साथ ‘सारी पृथ्वी’ अधिक स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अन्तकालीन चेतावनी में γῆ का दायरा
  choice: सारी पृथ्वी
  alternative: सारा देश या सारी भूमि
  rationale: γῆ में दोनों अर्थ संभव हैं, पर ‘सभी रहनेवालों’ के साथ प्रयुक्त पूर्ण वाक्यांश व्यापक, सार्वभौमिक दायरे की ओर अधिक स्वाभाविक रूप से संकेत करता है। फिर भी शब्द की वास्तविक अर्थगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ἐπεισελεύσεται का निहित कर्ता
  choice: वह दिन
  alternative: सर्वनाम ‘वह’ या कर्ता को अनकहा रखना
  rationale: यूनानी में कर्ता क्रिया में निहित है और पिछले पद के ‘उस दिन’ से ग्रहण किया जाता है। हिन्दी में ‘वह दिन’ दोहराने से संदर्भ स्पष्ट होता है और कोई नया धर्मवैज्ञानिक आशय नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फंदे की तरह’ पिछले पद से जुड़े खंड का रूप बनाए रखता है। ‘पृथ्वी के मुख पर’ जैसे अत्यधिक शाब्दिक मुहावरे के स्थान पर स्वाभाविक ‘पृथ्वी पर’ चुना गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
