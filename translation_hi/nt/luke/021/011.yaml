source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: hi
  text: बड़े भूकम्प होंगे, और जगह-जगह अकाल और महामारियाँ होंगी; भयावह घटनाएँ और स्वर्ग से बड़े चिन्ह होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεισμοί τε μεγάλοι
  choice: बड़े-बड़े भूकम्प
  rationale: σεισμοί का सामान्य अर्थ वास्तविक भूकम्प है। बड़े-बड़े, μεγάλοι की तीव्रता या विशालता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ τόπους
  choice: जगह-जगह
  rationale: यह यूनानी मुहावरा अलग-अलग स्थानों में होने वाली घटनाओं का भौगोलिक फैलाव बताता है; जगह-जगह संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: λιμοὶ
  choice: अकाल
  rationale: यह शब्द साधारण भोजन-अभाव से अधिक गंभीर अकाल को दर्शाता है। हिन्दी में सामूहिक घटनाओं के लिए अकाल का रूप स्वाभाविक है।
- source_word: λοιμοὶ
  choice: महामारियाँ
  rationale: λοιμός महामारी, मरी या व्यापक संक्रामक रोग के प्रकोप को दर्शाता है। महामारियाँ आधुनिक पाठक के लिए स्पष्ट है और इसकी गंभीरता बनाए रखता है।
- source_word: φόβητρα
  choice: भयावह घटनाएँ
  rationale: दुर्लभ बहुवचन φόβητρα उन वस्तुओं या घटनाओं को दर्शाता है जो भय उत्पन्न करती हैं। भयावह घटनाएँ अर्थ को बिना किसी खास प्रकार की घटना तय किए सहज हिन्दी में रखता है।
- source_word: σημεῖα
  choice: चिन्ह
  rationale: σημεῖον का व्यापक और सामान्य अर्थ चिन्ह है। यह प्रलयकालीन संदर्भ में अपशकुन या पूर्वसूचक घटना की संभावना को बंद नहीं करता।
- source_word: ἀπ’ οὐρανοῦ
  choice: आकाश से
  rationale: οὐρανός का अर्थ आकाश या स्वर्ग दोनों हो सकता है। इस संदर्भ में दृश्य खगोलीय घटनाओं की संभावना के कारण आकाश से मुख्य पाठ में स्वाभाविक है, जबकि पाद-टिप्पणी स्वर्ग से की धार्मिक अनुगूँज सुरक्षित रखती है।
- source_word: μεγάλα
  choice: बड़े-बड़े
  rationale: यह σημεῖα की महत्ता या विशालता बताता है। बड़े-बड़े मूल विशेषण को सीधे रखता है और चमत्कारी सामर्थ्य जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἔσονται / ἔσται
  choice: आएँगे / पड़ेंगे / फैलेंगी / होंगी / प्रकट होंगे
  rationale: यूनानी में भविष्यकालीन अस्तित्व-सूचक क्रियाएँ हैं। हिन्दी में प्रत्येक संज्ञा के साथ स्वाभाविक क्रिया चुनने से भाव स्पष्ट रहता है और सभी घटनाओं का भविष्य में होना व्यक्त होता है।
theological_decisions:
- issue: प्रलयकालीन संदर्भ में οὐρανός का अर्थ
  choice: आकाश से
  alternative: स्वर्ग से
  rationale: यूनानी शब्द दृश्य आकाश और परमेश्वर के निवास के रूप में स्वर्ग—दोनों का अर्थ दे सकता है। मुख्य पाठ में आकाश से दृश्य घटनाओं के संदर्भ में सहज है; पाद-टिप्पणी स्वर्ग से की संभावित धार्मिक अनुगूँज को सुरक्षित रखती है।
- issue: σημεῖα का प्रलयकालीन भाव
  choice: चिन्ह
  alternative: पूर्वसूचक चिन्ह या अपशकुन
  rationale: चिन्ह नए नियम में शब्द का व्यापक अर्थ बनाए रखता है। अधिक विशिष्ट विकल्प संदर्भ में संभव है, पर वह इन चिन्हों के स्वरूप को अनावश्यक रूप से तय कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। जगह-जगह तथा बड़े-बड़े जैसे प्रचलित रूप मूल सूची की तीव्रता और लय बनाए रखते हैं। अलग-अलग हिन्दी क्रियाएँ मूल के बार-बार आने वाले अस्तित्व-सूचक भविष्यकाल को अधिक स्वाभाविक ढंग से व्यक्त करती हैं।
