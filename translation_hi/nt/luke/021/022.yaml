id: LUK.21.22
reference: Luke 21:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: hi
  text: क्योंकि ये प्रतिशोध के दिन हैं[a], ताकि लिखी हुई सारी बातें पूरी हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायपूर्ण दंड के दिन।”
    reason: lexical_alternative
  - marker: b
    text: या, “जिससे लिखी हुई सारी बातें पूरी हों।” यूनानी रचना उद्देश्य या परिणाम—दोनों का भाव दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἡμέραι ἐκδικήσεως
  choice: प्रतिशोध के दिन
  rationale: यह पदबंध न्यायिक बदले या दंड के दिनों को दर्शाता है। ‘प्रतिशोध’ मूल की कठोरता को बनाए रखता है, जबकि इसे केवल मानवीय द्वेष तक सीमित नहीं करता।
- source_word: αὗταί εἰσιν
  choice: ये ... दिन हैं
  rationale: संकेतवाचक और क्रिया को सीधे तथा स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: τοῦ πλησθῆναι
  choice: ताकि ... पूरी हों
  rationale: τοῦ के साथ अनंत क्रिया उद्देश्य अथवा परिणाम का भाव दे सकती है। ‘ताकि’ हिन्दी में इस संबंध को स्पष्ट करता है, जबकि टिप्पणी में परिणामसूचक विकल्प सुरक्षित रखा गया है।
- source_word: πάντα τὰ γεγραμμένα
  choice: लिखी हुई सारी बातें
  rationale: पूर्ण भूतकालिक कर्मवाच्य कृदंत को संज्ञात्मक रूप में रखा गया है। यह अभिव्यक्ति लिखित भविष्यवाणियों या शास्त्रीय कथनों की ओर संकेत करती है, पर मुख्य पाठ में ‘पवित्रशास्त्र’ जोड़कर संदर्भ को अनावश्यक रूप से संकीर्ण नहीं करती।
theological_decisions:
- issue: ἐκδικήσεως का न्यायिक और धर्मवैचारिक भाव
  choice: प्रतिशोध
  alternative: न्यायपूर्ण दंड; दंड का बदला
  rationale: ‘प्रतिशोध’ दैवी न्याय की कठोरता और दंडात्मक भाव को बनाए रखता है। प्रसंग इसे निजी या आवेशपूर्ण मानवीय बदले के रूप में नहीं, बल्कि लिखी हुई बातों की पूर्ति से जुड़े न्याय के रूप में प्रस्तुत करता है।
- issue: τοῦ + अनंत क्रिया का उद्देश्य अथवा परिणाम
  choice: ताकि ... पूरी हों
  alternative: जिससे ... पूरी हों
  rationale: यूनानी रचना उद्देश्य और परिणाम के बीच सूक्ष्म अर्थगत तनाव रख सकती है। मुख्य पाठ में सहज उद्देश्यसूचक रूप अपनाया गया है और परिणामसूचक संभावना टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रतिशोध’ बाइबिलीय न्याय की गंभीरता बनाए रखता है; ‘लिखी हुई सारी बातें’ मूल की व्यापकता को सुरक्षित रखता है।
