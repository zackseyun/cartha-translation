  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: hi
  text: पर अपने विषय में सावधान रहो, कहीं ऐसा न हो कि तुम्हारे हृदय मदिरापान की अति[a], मतवालेपन और जीवन की चिंताओं से बोझिल हो जाएँ, और वह दिन अचानक तुम पर आ पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द मदिरापान की अति से जुड़ी रंगरलियों, अथवा उसके बाद की खुमारी और दुष्प्रभावों का भी अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: पर अपने ऊपर सावधानी से नज़र रखो
  rationale: यह वाक्यांश आत्म-सतर्कता की आज्ञा देता है। यह हिंदी प्रयोग चेतावनी और जागरूकता, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह निवारक चेतावनी का स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: तुम्हारे मन ... बोझिल हो जाएँ
  rationale: ‘बोझिल’ मूल के भारी किए जाने वाले रूपक को बनाए रखता है। हिंदी में ‘मन’ यहाँ भीतरी नैतिक और आत्मिक जीवन को सहज रूप से व्यक्त करता है।
- source_word: κραιπάλῃ
  choice: भोग-विलास
  rationale: यह शब्द मदिरापान की अति, रंगरली और उसके दुष्प्रभाव तक का संकेत दे सकता है। ‘भोग-विलास’ मुख्य पाठ में उसके व्यापक असंयमित अतिरेक को व्यक्त करता है; विशिष्ट शाब्दिक विस्तार पादटिप्पणी में रखा गया है।
- source_word: μέθῃ
  choice: मतवालेपन
  rationale: यह नशे या मदहोशी की अवस्था को स्पष्ट करता है और निकटवर्ती κραιπάλῃ से अर्थगत संबंध भी बनाए रखता है।
- source_word: μερίμναις βιωτικαῖς
  choice: जीवन की चिंताओं
  rationale: यह सामान्य सांसारिक या दैनिक जीवन से जुड़ी चिंताओं को बिना अनावश्यक नकारात्मक अर्थ जोड़े व्यक्त करता है।
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: अचानक तुम पर आ पड़े
  rationale: यह आकस्मिक आगमन की तीव्र चेतावनी को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ἡ ἡμέρα ἐκείνη
  choice: वह दिन
  rationale: मूल पाठ केवल संकेतात्मक पदबंध देता है; अनुवाद संदर्भ से स्पष्ट युगांतकारी आशय में कोई अतिरिक्त doctrinal विवरण नहीं जोड़ता।
theological_decisions:
- issue: ‘वह दिन’ का युगांतकारी संदर्भ
  choice: वह दिन
  alternative: न्याय का वह दिन
  rationale: प्रसंग इसे निर्णायक भावी दिन के रूप में इंगित करता है, पर मूल यूनानी में ‘न्याय का’ नहीं जोड़ा गया है। इसलिए अनुवाद मूल की संक्षिप्तता और उसकी धार्मिक तनावपूर्ण व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। आत्म-सतर्कता की चेतावनी और हृदय के बोझिल होने का रूपक स्वाभाविक हिंदी में सुरक्षित हैं।
