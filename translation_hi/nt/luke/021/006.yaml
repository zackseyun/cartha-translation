  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: hi
  text: “इन चीज़ों को जो तुम देख रहे हो[a]—ऐसे दिन आएँगे जब पत्थर पर पत्थर नहीं छोड़ा जाएगा; हर पत्थर ढा दिया जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये चीज़ें जिन्हें तुम देख रहे हो।” यूनानी क्रिया का अर्थ सामान्य रूप से ‘देखना’ या अधिक विशेष रूप से ‘ध्यान से देखना/निहारना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पत्थर पर पत्थर नहीं छोड़ा जाएगा, जो ढाया नहीं जाएगा”; यह पूर्ण विध्वंस व्यक्त करने का ढंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: ये सब, जिन्हें तुम देख रहे हो
  rationale: Ταῦτα को आरम्भ में रखकर उसके विषयगत बल को बनाए रखा गया है। θεωρεῖτε का वर्तमानकालीन, ध्यानपूर्वक देखने का भाव सहज हिन्दी में ‘देख रहे हो’ से व्यक्त होता है।
- source_word: ἐλεύσονται ἡμέραι
  choice: ऐसे दिन आएँगे
  rationale: यह आने वाली घटनाओं के समय को सूचित करने वाला स्वाभाविक वाक्यांश है। ‘ऐसे’ आगे आने वाले सापेक्ष उपवाक्य से हिन्दी में सहज संबंध बनाता है, पर किसी निश्चित काल-व्यवस्था को नहीं जोड़ता।
- source_word: ἐν αἷς
  choice: जब
  rationale: यूनानी सापेक्ष पदबंध का अर्थ कालवाचक है; हिन्दी में ‘जब’ औपचारिक अर्थ को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
- source_word: οὐκ ἀφεθήσεται
  choice: नहीं छोड़ा जाएगा
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखते हुए निर्माण-विनाश के प्रसंग में ‘छोड़ा जाएगा’ स्पष्ट और प्रचलित है।
- source_word: λίθος ἐπὶ λίθῳ
  choice: पत्थर पर पत्थर
  rationale: यह हिन्दी में भी पूर्ण विध्वंस व्यक्त करने वाला स्वाभाविक और स्रोत के निकट वाक्यांश है।
- source_word: ὃς οὐ καταλυθήσεται
  choice: हर पत्थर ढा दिया जाएगा
  rationale: यूनानी का शाब्दिक रूप ‘जो ढाया न जाएगा’ पूर्ववर्ती निषेध के साथ पूर्णता को तीव्र करता है। हिन्दी में दोहरे निषेध की अस्पष्टता से बचते हुए उसी सर्वसमावेशी बल को सकारात्मक वाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: मन्दिर की संरचनाओं के विषय में यीशु की भविष्यवाणी का दायरा और बल
  choice: कथन को दृश्य संरचनाओं के पूर्ण भौतिक विध्वंस की ठोस भविष्यवाणी के रूप में रखा गया है।
  alternative: इसे मुख्यतः प्रतीकात्मक न्याय-वचन या किसी विशिष्ट अंत-कालीन मत के अनुसार स्पष्ट करना।
  rationale: यूनानी पाठ दिखाई देने वाली वस्तुओं और पत्थरों के ढाए जाने की बात करता है। अनुवाद इसी ठोस अर्थ को रखता है, पर पद से बाहर का कोई कालक्रम या सम्प्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट रजिस्टर अपनाया गया है। ‘तुम’ निकट संबोधन को स्वाभाविक रखता है। मुख्य पाठ में दोहरे निषेध को स्पष्ट हिन्दी में खोला गया है, जबकि पादटिप्पणी में यूनानी संरचना दी गई है।
