reference: Luke 21:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: hi
  text: तब उसने उनसे कहा, “राष्ट्र राष्ट्र के विरुद्ध उठ खड़ा होगा[a], और राज्य राज्य के विरुद्ध।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उठेगा।”
    reason: यूनानी क्रिया का सरल विकल्प ‘उठेगा’ है; ‘उठ खड़ा होगा’ संघर्ष के प्रसंग को अधिक स्पष्ट करता है, जबकि दोनों अनुवाद सम्भव हैं।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह काल-सूचक कथन को पिछले प्रसंग से जोड़ता है और कथा के क्रम को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἔλεγεν
  choice: उसने कहा
  rationale: यद्यपि यूनानी क्रिया अपूर्ण भूतकाल में है, प्रत्यक्ष कथन का परिचय देते समय हिन्दी में सामान्य भूतकाल अधिक स्वाभाविक है; इससे अनावश्यक रूप से निरंतरता या पुनरावृत्ति नहीं जोड़ी जाती।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: हिन्दी में ‘किसी से कहना’ इस सम्प्रदान भाव की स्वाभाविक अभिव्यक्ति है।
- source_word: Ἐγερθήσεται
  choice: उठ खड़ा होगा
  rationale: इस संघर्ष-सूत्र में क्रिया का अर्थ किसी विरोधी के विरुद्ध सक्रिय रूप से उठना है। यह रूप यूनानी मध्य/कर्मवाच्य आकार को कृत्रिम कर्मवाच्य बनाए बिना व्यक्त करता है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: राजनीतिक संघर्ष और ‘राज्य’ के समानांतर प्रयोग में यह किसी सामूहिक जन-राजनीतिक इकाई को सूचित करता है।
- source_word: ἐπ’ ἔθνος
  choice: राष्ट्र के विरुद्ध
  rationale: इस प्रसंग में ἐπί विरोध या शत्रुतापूर्ण टकराव प्रकट करता है; ‘के विरुद्ध’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: βασιλεία
  choice: राज्य
  rationale: यहाँ शब्द अमूर्त राजत्व नहीं, बल्कि राजनीतिक राज्य या शासन-क्षेत्र को दर्शाता है। आधुनिक हिन्दी में ‘राज्य’ इस अर्थ को स्पष्ट रखता है।
- source_word: ἐπὶ βασιλείαν
  choice: राज्य के विरुद्ध
  rationale: दोहराए गए संघर्ष-सूत्र में इसका अर्थ विरोध है, जिसे ‘के विरुद्ध’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: अंत-समय संबंधी संघर्ष-सूत्र
  choice: कथन को राष्ट्रों और राज्यों के बीच होने वाले संघर्ष की सीधी भविष्यवाणी के रूप में रखा गया है।
  alternative: इसे केवल यरूशलेम के पतन तक सीमित करना, या अंत के समय की विस्तृत समय-सारणी के रूप में प्रस्तुत करना।
  rationale: पद स्वयं व्यापक राजनीतिक उथल-पुथल का कथन करता है; अनुवाद को ऐसे किसी विशिष्ट अंत-समय सिद्धांत का निर्णय नहीं करना चाहिए जो शब्दों में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर संरचना ‘राष्ट्र राष्ट्र के विरुद्ध… राज्य राज्य के विरुद्ध’ मूल की संक्षिप्त भविष्यसूचक लय को बनाए रखती है।
