- from: लेकिन जब तुम युद्धों और अशान्तियों[a] के बारे में सुनो, तो भयभीत न होना; क्योंकि इन बातों का पहले होना आवश्यक है, परन्तु अन्त तुरन्त नहीं आएगा।[b]
  to: लेकिन जब तुम युद्धों और अशांतियों[a] के बारे में सुनो, तो भयभीत मत होना; क्योंकि पहले इन बातों का होना आवश्यक है, परंतु अंत तुरंत नहीं आएगा।[b]
  rationale: The revision makes only safe idiomatic and orthographic improvements. It preserves the source’s broad reference to disorder, its strong warning not to be frightened, the necessity and precedence of the events, and the open-ended statement that the end is not immediate. The footnote set retains both the lexical range of ἀκαταστασίας and the Greek’s verbless final expression.
