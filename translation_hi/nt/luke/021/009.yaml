review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal elements of the Greek: future-temporal ‘when,’ reports of wars and broad social disorder, the prohibition against fear, the necessity and prior sequence of these events, and the denial that the end is immediate. The supplied future verb in the final clause is a sound idiomatic completion of the Greek verbless clause.'
  naturalness: A small revision is needed because ‘भयभीत न होना’ is infinitival and less idiomatic as a direct prohibition in this context. ‘भयभीत मत होना’ is natural modern Hindi. Reordering ‘पहले’ also gives the explanatory clause more natural Hindi word order. आधुनिक मानक वर्तनी ‘अशांतियों,’ ‘परंतु,’ and ‘अंत’ is used.
  terminology: ‘युद्धों,’ ‘अशांतियों,’ and ‘अंत’ preserve the breadth and register of the source. ‘अशांतियों’ does not narrow ἀκαταστασίας to riots, revolt, or political insurrection. The literal footnote retains awareness that the final Greek clause has no expressed verb, without imposing an eschatological scheme.
  issues:
  - severity: low
    issue: The prohibition ‘भयभीत न होना’ is not the most natural imperative form in modern Hindi.
    rationale: The Greek μὴ πτοηθῆτε is a direct plural prohibition. ‘भयभीत मत होना’ conveys this directly while retaining the elevated but accessible register.
  - severity: low
    issue: The word order in ‘इन बातों का पहले होना आवश्यक है’ is somewhat stiff.
    rationale: ‘पहले इन बातों का होना आवश्यक है’ more naturally expresses πρῶτον while preserving its sequential force.
