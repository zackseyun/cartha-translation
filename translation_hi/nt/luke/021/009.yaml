  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: hi
  text: लेकिन जब तुम युद्धों और अशांतियों[a] के बारे में सुनो, तो भयभीत मत होना; क्योंकि पहले इन बातों का होना आवश्यक है, परंतु अंत तुरंत नहीं आएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उथल-पुथल,’ ‘उपद्रवों,’ अथवा ‘अव्यवस्थाओं।’
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘परंतु अंत तुरंत नहीं।’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: लेकिन जब
  rationale: ὅταν भविष्य की अनिश्चित कालवाचक स्थिति व्यक्त करता है और δέ पिछले कथन से हल्का संक्रमण अथवा विरोध दिखाता है; इसलिए ‘लेकिन जब’ स्वाभाविक और अर्थानुकूल है।
- source_word: ἀκούσητε
  choice: के बारे में सुनो
  rationale: यहाँ सुनने का आशय युद्धों और अशान्तियों की खबर मिलने से है; ‘के बारे में सुनो’ आधुनिक हिन्दी में इस आशय को स्पष्ट करता है।
- source_word: πολέμους
  choice: युद्धों
  rationale: πόλεμος का सामान्य बहुवचन अर्थ सशस्त्र संघर्ष अथवा युद्ध है।
- source_word: ἀκαταστασίας
  choice: अशान्तियों
  rationale: ἀκαταστασία अव्यवस्था, उथल-पुथल या सामाजिक अशान्ति का व्यापक बोध देता है। ‘अशान्तियों’ इस व्यापकता को बनाए रखता है और इसे केवल विद्रोह या दंगे तक सीमित नहीं करता।
- source_word: μὴ πτοηθῆτε
  choice: भयभीत न होना
  rationale: क्रिया अचानक भय या आतंक से विचलित होने का भाव रखती है। ‘भयभीत न होना’ उसके बल को dignified और सहज हिन्दी में व्यक्त करता है।
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: क्योंकि इन बातों का पहले होना आवश्यक है
  rationale: γάρ कारण बताता है, δεῖ आवश्यकता व्यक्त करता है, और πρῶτον घटनाओं का क्रम सूचित करता है। यह अनुवाद इन तीनों तत्वों को स्पष्ट रखता है।
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: परन्तु अन्त तुरन्त नहीं आएगा
  rationale: यूनानी वाक्यांश में स्पष्ट क्रिया नहीं है। हिन्दी में स्वाभाविकता के लिए ‘आएगा’ जोड़ा गया है, जबकि पादटिप्पणी अधिक शाब्दिक और संक्षिप्त रूप सुरक्षित रखती है।
theological_decisions:
- issue: अन्त के समय के विषय में कथन
  choice: युद्धों और अशान्तियों का पहले होना आवश्यक है, पर उनका सुनाई देना यह सिद्ध नहीं करता कि अन्त तुरन्त आ जाएगा।
  alternative: इन घटनाओं के तुरन्त बाद अन्त नहीं आएगा; अथवा ये अन्त से पहले के समय की घटनाएँ हैं, स्वयं अन्त नहीं।
  rationale: पद निकट आती उथल-पुथल को अन्त के तत्काल आगमन के बराबर मानने से रोकता है। अनुवाद किसी विशेष अन्त-काल संबंधी व्यवस्था को आरोपित किए बिना कालगत तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सामान्य-पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम’ यीशु द्वारा शिष्यों को किए गए बहुवचन सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करता है। ‘अन्त’ को बिना अतिरिक्त व्याख्या के रखा गया है, ताकि मूल का युगान्त-विषयक खुलापन बना रहे।
