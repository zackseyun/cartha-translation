id: LUK.21.16
reference: Luke 21:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: hi
  text: परन्तु यहाँ तक कि तुम्हारे माता-पिता, भाई, रिश्तेदार और मित्र भी तुम्हें पकड़वा देंगे, और वे तुममें से कुछ को मार डालेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: तुम्हें पकड़वा देंगे
  rationale: यह भाव बताता है कि निकट संबंधी शिष्यों को विरोधियों या अधिकारियों के हाथ सौंप देंगे। ‘पकड़वा देंगे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में निहित विश्वासघात का संकेत देता है, बिना क्रिया को केवल ‘विश्वासघात करना’ बना देने के।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले आश्वासन के बाद आने वाले हल्के विरोधी मोड़ को स्पष्ट करता है।
- source_word: καὶ (after δὲ)
  choice: तक
  rationale: 'यहाँ καὶ का बलवर्धक अर्थ है: बाहरी लोग ही नहीं, निकटतम संबंधी और मित्र तक ऐसा करेंगे। हिन्दी में सूची के अंत में ‘तक’ इस बल को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: γονέων
  choice: माता-पिता
  rationale: यह बहुवचन सामूहिक रूप से माता और पिता दोनों को दर्शाता है; ‘माता-पिता’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: ἀδελφῶν
  choice: भाई
  rationale: मुख्य पाठ में यूनानी पुल्लिंग बहुवचन का सीधा संबंधसूचक रूप रखा गया है। मिश्रित भाई-बहनों के समूह की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: συγγενῶν
  choice: रिश्तेदार
  rationale: यह परिवार या कुटुम्ब से जुड़े लोगों का व्यापक और आधुनिक हिन्दी पद है।
- source_word: φίλων
  choice: मित्र
  rationale: यह φίλων का सीधा, गरिमापूर्ण और सर्वसुलभ हिन्दी समतुल्य है।
- source_word: θανατώσουσιν
  choice: मार डालेंगे
  rationale: क्रिया का अर्थ मृत्यु का कारण बनना है। ‘मार डालेंगे’ जानबूझकर प्राण लेने का अर्थ स्पष्ट रखता है, पर इसे केवल औपचारिक मृत्युदण्ड तक सीमित नहीं करता।
- source_word: ἐξ ὑμῶν
  choice: तुममें से कुछ को
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि कथन सभी नहीं, समूह के कुछ लोगों के विषय में है।
theological_decisions:
- issue: कुटुम्ब-सूची में ἀδελφῶν का दायरा
  choice: भाई
  alternative: भाई-बहन
  rationale: पुल्लिंग बहुवचन को मुख्य पाठ में सीधे रखा गया है, जबकि यह सम्भावना कि पद मिश्रित भाई-बहनों के समूह को भी समेटता है, पादटिप्पणी में दी गई है। इससे स्रोत की व्याकरणिक आकृति और उसकी सम्भावित व्यापकता दोनों सुरक्षित रहती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। यूनानी निष्क्रिय वाक्य को हिन्दी के अधिक स्वाभाविक सक्रिय रूप में प्रस्तुत किया गया है; कर्ता वही निकट संबंधी और मित्र हैं जिन्हें मूल पाठ ὑπό के साथ साधनकर्ता के रूप में बताता है। सूची के अंत का ‘तक’ मूल के बलवर्धक καὶ को व्यक्त करता है।
