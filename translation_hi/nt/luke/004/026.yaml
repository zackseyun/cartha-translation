base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: hi
  text: और एलिय्याह उनमें से किसी के पास नहीं भेजा गया, सिवाय सीदोन के सारपत में, एक विधवा स्त्री के पास।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέμφθη
  choice: भेजा गया
  rationale: कर्मवाच्य रूप यूनानी पाठ की तरह भेजने वाले को अनकहा रखता है; प्रसंग में परमेश्वर का कार्य निहित है, पर उसे स्पष्ट रूप से जोड़ा नहीं गया।
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: उनमें से किसी के पास नहीं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में व्यक्तियों की ओर भेजे जाने और पूर्ण निषेध—दोनों को सुरक्षित रखता है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: यह इस बाइबलीय नाम का हिन्दी में प्रचलित रूप है।
- source_word: εἰ μὴ
  choice: सिवाय
  rationale: यहाँ पदबंध शर्त नहीं, बल्कि अपवाद प्रकट करता है।
- source_word: Σάρεπτα
  choice: सारपत
  rationale: यह 1 राजा 17:9 के पुराने नियम वाले स्थान का हिन्दी में पहचाना जाने वाला नाम है; यूनानी रूप ‘सारेप्ता’ को पादटिप्पणी में बताया गया है।
- source_word: τῆς Σιδωνίας
  choice: सीदोन के
  rationale: सम्बन्धकारक रूप सारपत का सीदोन से भौगोलिक सम्बन्ध बताता है; हिन्दी में ‘सीदोन के सारपत’ संक्षिप्त और स्रोत-संगत है।
- source_word: γυναῖκα χήραν
  choice: एक विधवा स्त्री
  rationale: यह संज्ञा और उसके विशेषणात्मक/appositional बल दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एलिय्याह को भेजने वाले का निहित कर्ता
  choice: ‘भेजा गया’ कहकर कर्ता को अनकहा रखा गया
  alternative: ‘परमेश्वर ने एलिय्याह को भेजा’
  rationale: यूनानी पाठ कर्मवाच्य है और भेजने वाले का नाम नहीं लेता। प्रसंग परमेश्वर की ओर संकेत करता है, फिर भी अनुवाद पाठ से अधिक स्पष्ट दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में निषेध और अपवाद का जोर सुरक्षित है; कर्मवाच्य के कारण निहित दिव्य कर्ता को स्पष्ट रूप से नहीं जोड़ा गया।
