  alternative: गलील; अथवा यहूदिया को व्यापक यहूदी भूभाग के अर्थ में समझना
  rationale: मूल यूनानी पाठ की प्रधानता के कारण ‘यहूदिया’ को संदर्भ के अनुसार बदलकर ‘गलील’ नहीं किया गया। पाठगत और कथात्मक तनाव को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
