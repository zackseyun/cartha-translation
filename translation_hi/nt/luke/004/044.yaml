  rationale: εἰμί के अपूर्णकाल और वर्तमान कृदन्त का यह संयुक्त रूप भूतकाल में जारी या बार-बार होने वाली क्रिया व्यक्त करता है। ‘प्रचार करता रहा’ इस पक्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: κηρύσσων
  choice: प्रचार करता
  rationale: κηρύσσω सार्वजनिक रूप से घोषणा करने को दर्शाता है। आराधनालय के प्रसंग में ‘प्रचार करना’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से उपयुक्त है।
- source_word: εἰς τὰς συναγωγάς
  choice: आराधनालयों में
  rationale: यद्यपि εἰς का सामान्य अर्थ ‘में/के भीतर की ओर’ है, यहाँ यह प्रचार की गतिविधि का स्थान या क्षेत्र बताता है; इसलिए हिन्दी में ‘आराधनालयों में’ स्वाभाविक है।
- source_word: συναγωγάς
  choice: आराधनालयों
  rationale: इस यहूदी प्रसंग में συναγωγή सभा और उसके उपासना-स्थान को सूचित करता है। ‘आराधनालय’ हिन्दी बाइबलीय प्रयोग में समझ में आने वाला मानक शब्द है।
- source_word: Ἰουδαίας
  choice: यहूदिया
  rationale: Ἰουδαία का सीधा भौगोलिक नाम ‘यहूदिया’ है। निकटवर्ती कथानक गलील का संकेत दे सकता है, फिर भी मुख्य पाठ SBLGNT की पाठ-रीति को बनाए रखता है।
theological_decisions:
- issue: आस-पास के गलीली प्रसंग के बीच τῆς Ἰουδαίας का भौगोलिक संकेत
