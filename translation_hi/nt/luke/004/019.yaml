translation:
  language: hi
  text: प्रभु की कृपा के वर्ष की घोषणा करने के लिए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के अनुग्रह के वर्ष की घोषणा करने के लिए।”
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “प्रभु के ग्रहणयोग्य वर्ष की घोषणा करने के लिए।” यह वाक्य यशायाह 61:2 की प्रतिध्वनि है और जुबली-वर्ष की ओर संकेत कर सकता है।'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: घोषणा करने के लिए
  rationale: यह अनंत क्रिया पिछले पद में आरम्भ हुए उद्देश्य-क्रम को आगे बढ़ाती है। ‘घोषणा’ सार्वजनिक रूप से उद्घोषित करने का भाव रखती है और अर्थ को केवल उपदेश देने तक सीमित नहीं करती।
- source_word: ἐνιαυτὸν
  choice: वर्ष
  rationale: इस शब्द का सामान्य अर्थ ‘वर्ष’ है। यशायाह 61:2 की प्रतिध्वनि और संभावित जुबली-संकेत के बावजूद इसे व्यापक ‘समय’ या ‘काल’ नहीं बनाया गया।
- source_word: κυρίου
  choice: प्रभु के
  rationale: κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप ‘प्रभु’ है। संबंधकारक को ‘के’ से व्यक्त किया गया है।
- source_word: δεκτόν
  choice: अनुग्रह के
  rationale: इस संदर्भ में δεκτός स्वीकार्यता और कृपापूर्ण अनुकूलता को व्यक्त करता है। हिन्दी में ‘अनुग्रह के वर्ष’ यशायाह-संबंधी मुहावरे को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक ‘ग्रहणयोग्य वर्ष’ आधुनिक पाठक के लिए भ्रामक होगा।
theological_decisions:
- issue: यशायाह 61:2 की ओर संकेत और जुबली की संभावित प्रतिध्वनि
  choice: मुख्य पाठ में ‘वर्ष’ रखा गया और ‘जुबली’ स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: प्रभु की जुबली की घोषणा करने के लिए
  rationale: यूनानी पाठ यशायाह 61:2 की प्रतिध्वनि करता है और जुबली का भाव जगा सकता है, पर ‘जुबली’ शब्द स्पष्टतः उपस्थित नहीं है। इसलिए संकेत को सुरक्षित रखा गया है, व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: δεκτόν का अर्थ
  choice: अनुग्रह के वर्ष
  alternative: ग्रहणयोग्य वर्ष / मनभावना वर्ष
  rationale: यहाँ जोर उस वर्ष पर है जो प्रभु की कृपा और अनुकूलता से चिह्नित है। ‘अनुग्रह’ हिन्दी में उस धर्मवैचारिक तनाव को बनाए रखता है, जबकि ‘ग्रहणयोग्य’ यह अस्पष्ट कर सकता है कि वर्ष किसके द्वारा स्वीकार किया जाता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: ‘प्रभु’ यूनानी κύριος का मानक रूप है और यशायाह के उद्धरण से संबंध बनाए रखता है, बिना मुख्य पाठ में दिव्य नाम को आवश्यकता से अधिक निर्दिष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सहज शैली। ‘अनुग्रह का वर्ष’ बाइबिलीय प्रतिध्वनि को बनाए रखते हुए सामान्य पाठक के लिए ‘ग्रहणयोग्य वर्ष’ से अधिक स्पष्ट है।
