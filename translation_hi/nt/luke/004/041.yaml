id: LUK.4.41
reference: Luke 4:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: hi
  text: बहुत-से लोगों में से दुष्टात्माएँ भी निकलती थीं और चिल्लाकर कहती थीं, “तू परमेश्वर का पुत्र है!” पर वह उन्हें डाँटता था और उन्हें बोलने नहीं देता था, क्योंकि वे जानती थीं कि वह मसीह[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट।” यूनानी Χριστός का अर्थ “मसीह” अथवा “अभिषिक्त जन” है।
    reason: Χριστός के पारंपरिक वैकल्पिक रूप और उसके शीर्षकीय अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: δαιμόνια
  choice: दुष्टात्माएँ
  rationale: यह शब्द सीधे दुष्ट आत्मिक प्राणियों को सूचित करता है; यहाँ यूनानी में ‘अशुद्ध आत्माएँ’ नहीं है, इसलिए उस अलग अभिव्यक्ति को नहीं अपनाया गया।
- source_word: ἐξήρχετο
  choice: निकलती थीं
  rationale: अपूर्ण भूतकाल चलती या बार-बार घटती क्रिया दिखाता है; बहुवचन हिंदी रूप प्रसंग के स्वाभाविक प्रवाह को बनाए रखता है।
- source_word: ἀπὸ πολλῶν
  choice: बहुतों में से
  rationale: यूनानी में ‘लोगों’ जैसा संज्ञा-पद व्यक्त नहीं है। हिंदी में ‘बहुतों में से’ मानवीय संदर्भ को समझने योग्य रखते हुए उस अंतर्निहितता को बचाता है।
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: चिल्लाकर कहती थीं
  rationale: यह ऊँची आवाज़ में पुकारने और कथन करने, दोनों क्रियाओं को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: शीर्षक की औपचारिक और मसीही पहचान-संबंधी शक्ति सुरक्षित रहती है।
- source_word: ἐπιτιμῶν
  choice: डाँटता
  rationale: यह यीशु की कड़ी फटकार और अधिकारपूर्ण रोक, दोनों को संक्षेप में व्यक्त करता है।
- source_word: οὐκ εἴα
  choice: बोलने नहीं देता था
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार अनुमति न देने का भाव रखता है।
- source_word: ᾔδεισαν
  choice: जानती थीं
  rationale: οἶδα का यह रूप यहाँ बीती हुई अवस्था को दर्शाता है; हिंदी में साधारण अपूर्ण भूतकाल स्वाभाविक है।
- source_word: τὸν χριστὸν
  choice: मसीह
  rationale: Χριστός यहाँ व्यक्तिगत नाम नहीं, अभिषिक्त उद्धारकर्ता का शीर्षक है; ‘मसीह’ उस शीर्षकीय अर्थ को स्पष्ट रखता है।
- source_word: αὐτὸν εἶναι
  choice: कि वही ... है
  rationale: ‘वही’ αὐτόν की पहचान पर बल को स्वाभाविक हिंदी में सामने लाता है, जबकि ‘है’ परोक्ष कथन में वर्तमान पहचान को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्माओं द्वारा Χριστός की पहचान
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: शब्द यहाँ शीर्षक के रूप में प्रयुक्त है। ‘मसीह’ अभिषिक्त जन का अर्थ बनाए रखता है; वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
- issue: ‘परमेश्वर का पुत्र’ और ‘मसीह’ का संबंध
  choice: दोनों उपाधियों को अलग रखा गया है
  alternative: दोनों को मिलाकर एक व्याख्यात्मक उपाधि बनाना
  rationale: यूनानी पाठ में दुष्टात्माओं का कथन ‘परमेश्वर का पुत्र’ है, जबकि वर्णनकर्ता उनकी जानकारी को ‘मसीह’ के रूप में बताता है। अनुवाद इस संबंधित किंतु भिन्न प्रस्तुति को नहीं मिटाता।
- issue: αὐτὸν में पहचान का बल
  choice: वही मसीह
  alternative: वह मसीह
  rationale: अभियुक्त सर्वनाम αὐτόν को विधेय शीर्षक के साथ हिंदी में ‘वही’ कहना पहचान के केंद्रित बल को स्वाभाविक रूप से दर्शाता है, बिना दोनों उपाधियों को एक करने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘तू’ प्रत्यक्ष संबोधन के एकवचन रूप को सुरक्षित रखता है और इस कथन में असम्मान जोड़ने के बजाय निकट, सीधा संबोधन व्यक्त करता है। अपूर्ण भूतकाल के लिए ‘निकलती थीं’, ‘डाँटता’ और ‘नहीं देता था’ से जारी या बार-बार होने वाली क्रिया का भाव रखा गया है।
