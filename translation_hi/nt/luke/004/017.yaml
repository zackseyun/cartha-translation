  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: hi
  text: 'और यशायाह भविष्यद्वक्ता का पुस्तक-पट[a] उसे दिया गया। पुस्तक-पट को खोलकर उसने वह स्थान पाया जहाँ लिखा था:'
  philosophy: optimal-equivalence
  footnotes:
