    text: या, “पुस्तक।” यूनानी शब्द βιβλίον सामान्यतः किसी लिखित दस्तावेज़ या पुस्तक का बोध करा सकता है, पर इस आराधनालय के प्रसंग में सबसे अधिक सम्भावना पुस्तक-पट की है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: उसे दी गई
  rationale: कर्मवाच्य क्रिया का स्वाभाविक हिन्दी रूप; आराधनालय में पाठ के लिए लिखित सामग्री दिए जाने का भाव स्पष्ट है, बिना ‘सौंप दी गई’ जैसे अधिक प्रबल अर्थ के।
- source_word: βιβλίον
  choice: पुस्तक
  rationale: βιβλίον सामान्यतः लिखित दस्तावेज़ या पुस्तक को दर्शा सकता है। सहज आधुनिक हिन्दी के लिए ‘पुस्तक’ चुना गया है; प्रथम शताब्दी के आराधनालय में इसके पुस्तक-पट होने की ऐतिहासिक संभावना पादटिप्पणी में दी गई है।
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: भविष्यद्वक्ता यशायाह की
  rationale: सम्बन्धकारक पदबंध को स्वाभाविक हिन्दी में प्रस्तुत करते हुए यशायाह की भविष्यद्वक्ता की उपाधि भी सुरक्षित रखी गई है।
- source_word: ἀναπτύξας
  choice: खोलकर
  rationale: यह क्रिया पुस्तक-पट को खोलने का संकेत देती है और मुख्य क्रिया से पहले की कार्रवाई व्यक्त करती है। ‘खोलकर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εὗρεν
  choice: ढूँढ़ निकाला
  rationale: εὑρίσκω का मूल भाव ‘पाना/खोजना’ है। लिखित सामग्री में किसी निश्चित स्थान तक पहुँचने के प्रसंग में ‘ढूँढ़ निकाला’ स्पष्ट और स्वाभाविक है।
- source_word: τόπον
  choice: वह स्थान
  rationale: शाब्दिक ‘स्थान’ को बनाए रखा गया है; प्रसंग से स्पष्ट है कि यह लिखित पाठ का स्थान है।
- source_word: οὗ ἦν γεγραμμένον
  choice: जहाँ लिखा था
  rationale: यह आगामी उद्धरण का परिचय देता है और यूनानी पूर्णकालिक कर्मवाच्य भाव को सहज हिन्दी में व्यक्त करता है।
