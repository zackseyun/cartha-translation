lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: भर गए
  rationale: πίμπλημι के अओरिस्ट कर्मवाच्य का स्वाभाविक हिन्दी रूप; यह मूल के ‘भर दिए गए/भर गए’ भाव को बनाए रखता है और ‘क्रोधित हो उठे’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: πάντες
  choice: सब लोग
  rationale: यह आराधनालय में उपस्थित पूरे समूह को सामूहिक रूप से सूचित करता है; आधुनिक हिन्दी में ‘सब लोग’ स्पष्ट और सहज है।
- source_word: θυμοῦ
  choice: क्रोध से
  rationale: θυμός यहाँ तीव्र रोष को व्यक्त करता है। ‘क्रोध’ गरिमापूर्ण और प्रचलित है, जबकि ‘प्रचंड रोष’ अर्थ को कुछ अधिक तीव्र कर सकता है।
- source_word: ἐν τῇ συναγωγῇ
  choice: आराधनालय में उपस्थित
  rationale: वाक्य-विन्यास में इसे ‘सब लोगों’ से जोड़ने पर स्थान-संबंध स्पष्ट और हिन्दी स्वाभाविक रहती है। συναγωγή के लिए ‘आराधनालय’ सामान्य पाठकों हेतु समझने योग्य धार्मिक-स्थल सूचक शब्द है।
- source_word: ἀκούοντες
  choice: जब ... सुनीं
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ घटित अवसर/समय बताता है; ‘जब ... सुनीं’ हिन्दी में इसका सहज कालवाचक रूप है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक यीशु की पिछली कही हुई बातों की ओर लौटता है; ‘ये बातें’ मूल की व्यापकता को रखता है और अनावश्यक रूप से ‘ये शब्द’ तक सीमित नहीं करता।
