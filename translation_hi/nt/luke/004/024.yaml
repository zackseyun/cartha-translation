- source_word: εἶπεν δέ
  choice: फिर उसने कहा
  rationale: δέ कथा में हल्के संयोजक का काम करता है। ‘फिर’ प्रवाह को स्वाभाविक रखता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: Ἀμὴν
  choice: सच
  rationale: यहाँ ἀμήν यीशु के गंभीर और प्रामाणिक कथन की भूमिका बाँधता है; ‘सच’ आधुनिक हिन्दी में ‘मैं तुमसे ... कहता हूँ’ के साथ स्वाभाविक है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यह सीधा बहुवचन संबोधन और कथन की गंभीरता दोनों बनाए रखता है।
- source_word: οὐδεὶς προφήτης
  choice: कोई भी भविष्यद्वक्ता
  rationale: नकारात्मक वाक्य में यह यूनानी के सार्वभौमिक निषेध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: δεκτός
  choice: स्वीकार नहीं किया जाता
  rationale: δεκτός का अर्थ अनुकूल रूप से ग्रहण या स्वीकार किया जाना है; यह चयन उसके सामाजिक और मूल्यांकनपरक भाव को बनाए रखता है।
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: अपने नगर
  rationale: πατρίς जन्मस्थान, अपना इलाका या स्वदेश बता सकता है। लूका 4 में नासरत की स्थानीय पृष्ठभूमि के कारण ‘अपने नगर’ मुख्य पाठ में सबसे स्वाभाविक है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित हैं।
