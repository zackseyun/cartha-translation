source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: hi
  text: तब वह उनसे कहने लगा, “आज यह पवित्रशास्त्र तुम्हारे सुनते-सुनते पूरा हुआ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: तब वह उनसे कहने लगा
  rationale: δέ कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। ἤρξατο के आरंभात्मक भाव को ‘कहने लगा’ सहज आधुनिक हिन्दी में व्यक्त करता है, और πρὸς αὐτούς को ‘उनसे’ संक्षेप में रखता है।
- source_word: Σήμερον
  choice: आज
  rationale: वाक्य के आरंभ में आया यह समयवाचक शब्द पूर्ति की तात्कालिकता पर बल देता है।
- source_word: πεπλήρωται
  choice: पूरा हुआ है
  rationale: पूर्ण निष्क्रिय रूप ऐसी पूरी हुई घटना बताता है जिसका परिणाम वर्तमान में बना हुआ है; ‘पूरा हुआ है’ हिन्दी में इस पक्ष और निष्क्रिय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ γραφὴ αὕτη
  choice: यह पवित्रशास्त्र
  rationale: γραφή यहाँ यशायाह से अभी पढ़े गए पवित्रशास्त्रीय वचन को दर्शाता है। ‘यह पवित्रशास्त्र’ मूल की संक्षिप्तता और पवित्र लेख के अर्थ को बनाए रखता है।
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: तुम्हारे सुनते-सुनते
  rationale: शाब्दिक रूप ‘तुम्हारे कानों में’ है। प्रसंग में इसका अर्थ है कि श्रोताओं के इसे सुनने के समय ही पूर्ति हुई; ‘तुम्हारे सुनते-सुनते’ इस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी कर्ता या साधन को जोड़े।
theological_decisions:
- issue: पूर्ति के दावे का स्वरूप
  choice: यीशु की बात को पवित्रशास्त्र की वर्तमान पूर्ति की घोषणा के रूप में रखा गया है, पर यह नहीं जोड़ा गया कि वह किस प्रकार या किसके द्वारा पूरी हुई।
  alternative: ‘आज यह भविष्यवाणी मेरे द्वारा पूरी हुई’ जैसे व्याख्यात्मक विस्तार करना।
  rationale: यूनानी पाठ ‘यह पवित्रशास्त्र’ पूरा होने की बात कहता है और पूर्ति को श्रोताओं के सुनने से जोड़ता है, पर ‘भविष्यवाणी’ अथवा ‘मेरे द्वारा’ स्पष्ट रूप से नहीं कहता। अनुवाद इस निहित धार्मिक बल को बनाए रखते हुए अस्पष्टता को नहीं मिटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘कहने लगा’ कथात्मक प्रवाह को स्वाभाविक रखता है। ‘तुम्हारे सुनते-सुनते’ मूल मुहावरे का अर्थ पहुँचाता है; अलग पादटिप्पणी आवश्यक नहीं मानी गई।
