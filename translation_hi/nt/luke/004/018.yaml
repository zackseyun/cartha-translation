source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: hi
  text: '“प्रभु की आत्मा मुझ पर है,

    क्योंकि उसने गरीबों को शुभ समाचार सुनाने के लिए मेरा अभिषेक किया है।

    उसने मुझे भेजा है कि मैं बंदियों के लिए छुटकारे[a] की घोषणा करूँ,

    अंधों को फिर से दृष्टि मिलने की घोषणा करूँ,

    और कुचले हुओं[b] को छुटकारा देकर भेजूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छुटकारे’ के स्थान पर ‘क्षमा’ भी सम्भव है (यूनानी ἄφεσις); यहाँ बंदियों और कुचले हुओं का प्रसंग मुक्ति के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘जो तोड़े जा चुके हैं’; ‘कुचले हुए’ प्रसंग में मूल बिंब और उत्पीड़न के भाव, दोनों को व्यक्त करता है।'
    reason: lexical_alternative
