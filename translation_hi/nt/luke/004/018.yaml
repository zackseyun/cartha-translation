  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘शुभ समाचार’, ‘घोषणा’, ‘छुटकारा’ और ‘कुचले हुए’ जैसे सामान्यतः समझ में आने वाले शब्द चुने गए हैं। काव्यात्मक उद्धरण का लयात्मक पंक्ति-विन्यास रखा गया है, पर अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
