  choice: प्रभु का आत्मा
  rationale: सम्बन्धकारक पद को स्वामित्व/स्रोत के सामान्य अर्थ में रखते हुए यशायाह की पृष्ठभूमि और नए नियम की परिचित अभिव्यक्ति सुरक्षित रहती है।
- source_word: ἐπ’ ἐμέ
  choice: मुझ पर है
  rationale: यूनानी में क्रिया निहित है; हिन्दी में ‘है’ जोड़ना आवश्यक और स्वाभाविक है, जबकि ‘मुझ पर’ मूल पूर्वसर्गीय अभिव्यक्ति को निकटता से रखता है।
- source_word: οὗ εἵνεκεν
  choice: क्योंकि
  rationale: यह पद आत्मा के मसीह पर होने का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔχρισέν με
  choice: उसने ... मेरा अभिषेक किया है
  rationale: ‘अभिषेक’ χρίω की राजकीय-मसीही प्रतिध्वनि बनाए रखता है; पूर्ण वर्तमान रूप उस कार्य के बने हुए प्रभाव को व्यक्त करता है।
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: गरीबों को शुभ समाचार सुनाने के लिए
  rationale: ‘शुभ समाचार’ मूलतः अच्छे समाचार की घोषणा का अर्थ देता है और ‘गरीबों’ को भौतिक या सामाजिक अर्थ तक सीमित नहीं करता।
- source_word: ἀπέσταλκέν με
  choice: उसने मुझे भेजा है
  rationale: यूनानी पूर्णकाल संपन्न भेजे जाने और उसके वर्तमान प्रभाव, दोनों को संकेत करता है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: κηρύξαι
  choice: घोषणा करूँ
  rationale: यह सार्वजनिक रूप से उद्घोषित करने का भाव देता है और केवल धार्मिक उपदेश तक अर्थ को संकीर्ण नहीं करता।
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: बंदियों के छुटकारे
  rationale: बंदियों और यशायाह की मुक्ति-संबंधी पृष्ठभूमि में ἄφεσις का प्राथमिक अर्थ ‘छुटकारा’ है; ‘क्षमा’ की वास्तविक वैकल्पिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: अंधों को फिर से दृष्टि मिलने
  rationale: ἀνάβλεψις केवल ‘दृष्टि’ नहीं, दृष्टि पाने या पुनः पाने का भाव रखता है; यह अभिव्यक्ति उस अर्थ को स्पष्ट करती है।
- source_word: ἀποστεῖλαι
  choice: भेजूँ
  rationale: मूल क्रिया का ‘भेजना’ अर्थ बचाया गया है, न कि उसे केवल ‘स्वतंत्र करूँ’ में बदल दिया गया है।
- source_word: τεθραυσμένους
  choice: कुचले हुओं
  rationale: पूर्ण निष्क्रिय कृदन्त का मूल बिंब ‘तोड़े/चकनाचूर किए गए’ लोगों का है; ‘कुचले हुए’ हिन्दी में इस बिंब और उत्पीड़न के प्रसंग दोनों को बनाए रखता है।
- source_word: ἐν ἀφέσει
  choice: छुटकारा देकर
  rationale: अत्यन्त शाब्दिक ‘छुटकारे में भेजूँ’ हिन्दी में अस्वाभाविक है। ‘छुटकारा देकर भेजूँ’ ἀποστεῖλαι और ἄφεσις दोनों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यशायाह के इस उद्धरण में ἄφεσις का अर्थ
  choice: छुटकारा/मुक्ति
  alternative: क्षमा
  rationale: निकट प्रसंग में बंदी, अंधे और कुचले हुए लोग हैं, इसलिए यशायाह की मुक्ति और पुनर्स्थापना की छवि प्रमुख है। फिर भी लूका में यही शब्द पापों की ‘क्षमा’ के लिए भी आता है; अतः मुख्य पाठ में ‘छुटकारा’ और पादटिप्पणी में ‘क्षमा’ देकर वास्तविक अर्थगत तनाव सुरक्षित रखा गया है।
- issue: τεθραυσμένους का सामाजिक या शाब्दिक बिंब
  choice: कुचले हुए
  alternative: तोड़े जा चुके लोग / उत्पीड़ित लोग
  rationale: ‘कुचले हुए’ मूल के टूटने-चकनाचूर होने के बिंब को बचाता है और प्रसंग में उत्पीड़न का अर्थ भी सहजता से व्यक्त करता है, बिना उसे केवल एक सामाजिक श्रेणी में सीमित किए।
