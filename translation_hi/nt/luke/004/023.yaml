source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: hi
  text: और उसने उनसे कहा, “निश्चय ही तुम मुझसे यह कहावत कहोगे, ‘वैद्य, अपने आप को चंगा कर।’ जो कुछ हमने सुना है कि कफरनहूम में[a] हुआ, वह यहाँ अपने नगर में भी कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, ‘कफरनहूम को/में जो कुछ हुआ।’ यूनानी में εἰς का सामान्य अर्थ ‘को/में’ की दिशा लिए होता है, पर यहाँ प्रसंग में अर्थ स्थानवाचक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: निश्चय ही
  rationale: यह यीशु द्वारा लोगों की आगामी प्रतिक्रिया का दृढ़तापूर्वक अनुमान व्यक्त करता है और भविष्यकालीन क्रिया के साथ स्वाभाविक हिन्दी है।
- source_word: ἐρεῖτέ μοι
  choice: तुम मुझसे ... कहोगे
  rationale: भविष्यत् निर्देशार्थक रूप को संभावना या आज्ञा न बनाकर स्पष्ट भविष्यवाणी के रूप में रखा गया है।
- source_word: παραβολὴν
  choice: कहावत
  rationale: यहाँ शब्द किसी विस्तृत दृष्टान्त के बजाय संक्षिप्त लोकोक्ति-सदृश उक्ति का परिचय देता है।
- source_word: Ἰατρέ
  choice: वैद्य
  rationale: सम्बोधन और कहावत की गरिमापूर्ण, पारंपरिक ध्वनि सुरक्षित रहती है; यह चिकित्सक को सूचित करता है।
- source_word: θεράπευσον σεαυτόν
  choice: अपने आप को चंगा कर
  rationale: आज्ञार्थक बल को सीधे रखा गया है; ‘चंगा कर’ उपचार के अर्थ को सहज और बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: जो कुछ हमने सुना है कि ... हुआ
  rationale: यह सुनकर प्राप्त समाचार और घटनाओं के घटित होने—दोनों को सुरक्षित रखता है, बिना यह जोड़े कि वे किसने किए।
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: कफरनहूम में
  rationale: यद्यपि εἰς का मूल स्थानगत अर्थ ‘को/में’ की दिशा लिए हो सकता है, घटित होने की क्रिया के साथ यहाँ स्वाभाविक अर्थ स्थानवाचक है।
- source_word: ποίησον καὶ ὧδε
  choice: वह यहाँ ... भी कर
  rationale: व्यापक आज्ञार्थक ‘कर’ और καί का समावेशी बल ‘भी’ से सुरक्षित है।
- source_word: ἐν τῇ πατρίδι σου
  choice: अपने नगर में
  rationale: नासरत के प्रसंग में πατρίς जन्मभूमि/गृहनगर को सूचित करता है; ‘अपने नगर’ आधुनिक हिन्दी में स्वाभाविक है और राष्ट्रीय ‘देश’ का भ्रम टालता है।
theological_decisions:
- issue: इस प्रसंग में παραβολή का स्वरूप
  choice: कहावत
  alternative: दृष्टान्त; उक्ति
  rationale: ‘वैद्य, अपने आप को चंगा कर’ एक संक्षिप्त प्रचलित कहावत है, कथा-रूप दृष्टान्त नहीं।
- issue: γενόμενα में कर्तृत्व का प्रश्न
  choice: हुआ
  alternative: किया गया
  rationale: यूनानी रूप घटनाओं के घटित होने को व्यक्त करता है और यहाँ कर्ता को स्पष्ट नहीं करता; ‘हुआ’ उस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वैद्य’ कहावत की पारंपरिक शैली बनाए रखता है, जबकि शेष वाक्य-विन्यास वर्तमान मानक हिन्दी के अनुरूप है।
