    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: सभा-घर
  rationale: यह यहूदियों के एकत्र होने और उपासना करने के स्थान को दर्शाता है। ‘सभा-घर’ आधुनिक हिन्दी में समझने योग्य और प्रसंगानुकूल है।
- source_word: ἄνθρωπος
  choice: आदमी
  rationale: कथा में एक पुरुष व्यक्ति का उल्लेख है; इसलिए ‘आदमी’ स्वाभाविक और लिंग-सटीक है।
- source_word: ἔχων
  choice: जिसमें ... थी
  rationale: यूनानी का शाब्दिक अर्थ ‘रखता हुआ’ है, पर हिन्दी में किसी आत्मा के वश या प्रभाव की स्थिति को बिना अतिरिक्त सिद्धान्त जोड़ते हुए ‘जिसमें ... थी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: एक अशुद्ध दुष्टात्मा
  rationale: यह सहज हिन्दी में अलौकिक और अशुद्ध सत्ता का अर्थ बनाए रखता है। यूनानी में πνεῦμα और δαιμόνιον दोनों पद होने की जानकारी पाद-टिप्पणी में दी गई है, क्योंकि दोनों को अलग-अलग ‘आत्मा’ और ‘दुष्टात्मा’ कहने पर हिन्दी अत्यन्त अस्वाभाविक और भ्रामक हो जाती है।
- source_word: ἀνέκραξεν
  choice: चिल्ला उठा
  rationale: यह अकस्मात और जोर से पुकारने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: यह यूनानी वाक्यांश का स्वाभाविक हिन्दी रूप है और आवाज़ की तीव्रता को स्पष्ट रखता है।
theological_decisions:
- issue: दुष्टात्मा-संबंधी पदावली
  choice: एक अशुद्ध दुष्टात्मा
  alternative: एक अशुद्ध दुष्टात्मा की आत्मा
  rationale: यूनानी में ‘आत्मा’ और ‘दुष्टात्मा’ दोनों शब्द हैं, पर उनका शब्दशः संयुक्त हिन्दी रूप ऐसा अर्थ दे सकता है मानो किसी दुष्टात्मा की अपनी अलग आत्मा हो। मुख्य पाठ में स्वाभाविक और प्रचलित रूप रखा गया है तथा स्रोत की विशिष्ट दोहरी पदावली पाद-टिप्पणी में सुरक्षित की गई है।
translation_notes:
