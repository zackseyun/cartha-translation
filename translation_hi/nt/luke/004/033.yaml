  text: और आराधनालय में एक आदमी था, जिसमें एक अशुद्ध आत्मा (दुष्टात्मा) थी[a]। वह ऊँची आवाज़ में चिल्ला उठा,
  philosophy: optimal-equivalence
  footnotes:
