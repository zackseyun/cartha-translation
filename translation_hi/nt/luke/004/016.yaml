source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: hi
  text: और वह नाज़रा[a] में आया, जहाँ वह पला-बढ़ा था। जैसा उसकी रीति थी, वह सब्त के दिन आराधनालय में गया और पढ़ने के लिए खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नाज़रत।’ यहाँ यूनानी पाठ में ‘नाज़रा’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: नाज़रा
  rationale: इस पद के यूनानी रूप Ναζαρά का सीधे देवनागरी लिप्यंतरण किया गया है; अधिक परिचित ‘नाज़रत’ को पादटिप्पणी में रखा गया है।
- source_word: τεθραμμένος
  choice: उसका पालन-पोषण हुआ था
  rationale: पूर्ण निष्क्रिय कृदंत यहाँ उस स्थान पर पाले-बढ़ाए जाने और उससे बनी अवस्था को व्यक्त करता है; यह हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: अपनी रीति के अनुसार
  rationale: यह अभिव्यक्ति यीशु के नियमित अभ्यास को दर्शाती है और हिंदी में संक्षिप्त तथा गरिमापूर्ण है।
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: यूनानी में बहुवचन रूप एक मुहावरेदार प्रयोग है, जिसका प्रसंगगत अर्थ एक सब्त का दिन है।
- source_word: συναγωγήν
  choice: आराधनालय
  rationale: यहूदी संदर्भ में यह सभा-स्थान/संस्था को सूचित करता है; ‘आराधनालय’ सामान्य हिंदी पाठक के लिए स्पष्ट है और किसी आधुनिक संप्रदायगत शब्दावली को आरोपित नहीं करता।
- source_word: ἀνέστη ἀναγνῶναι
  choice: पढ़ने के लिए खड़ा हुआ
  rationale: क्रिया और प्रयोजनसूचक infinitive की रचना को स्वाभाविक हिंदी में निकटता से व्यक्त करता है।
theological_decisions:
- issue: स्थान-नाम Ναζαρά का रूप
  choice: नाज़रा
  alternative: नाज़रत
  rationale: मुख्य पाठ इस पद में प्रमाणित यूनानी रूप का अनुसरण करता है और परिचित पारंपरिक नाम को वैकल्पिक रूप में पादटिप्पणी में देता है; इससे पाठ को अन्य रूपों के अनुरूप चुपचाप नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। वाक्य-विन्यास को हिंदी की स्वाभाविक लय के अनुसार दो वाक्यों में रखा गया है, जबकि यूनानी पाठ की घटनाओं का क्रम सुरक्षित है।
