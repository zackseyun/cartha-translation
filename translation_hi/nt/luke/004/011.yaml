  text: और “वे तुम्हें अपने हाथों पर उठाए रखेंगे[a], कहीं ऐसा न हो कि तुम्हारा पैर किसी पत्थर से टकरा जाए[b]।”
  philosophy: optimal-equivalence
  footnotes:
