  - marker: b
    text: या, “कहीं ऐसा न हो कि तुम्हारे पैर को किसी पत्थर से ठोकर लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद में आरम्भ हुए पवित्रशास्त्र के उद्धरण को आगे जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: ὅτι
  choice: उद्धरण-चिह्न द्वारा व्यक्त
  rationale: यहाँ ὅτι उद्धृत वचन की विषयवस्तु का परिचय देता है; स्वाभाविक हिन्दी में इसकी शक्ति सीधे उद्धरण को जारी रखकर व्यक्त होती है।
- source_word: Ἐπὶ χειρῶν
  choice: अपने हाथों पर
  rationale: यह मूल बिंब को बनाए रखता है कि स्वर्गदूत अपने हाथों पर उसे थामे या उठाए रहेंगे। 'अपने' का सम्बन्ध पिछले पद में आए स्वर्गदूतों से है।
- source_word: ἀροῦσίν σε
  choice: वे तुम्हें ... उठा लेंगे
  rationale: αἴρω का भाव यहाँ उठाने और थामकर ले चलने का है। 'उठा लेंगे' आधुनिक हिन्दी में स्वाभाविक है और हाथों पर सुरक्षित रखने के बिंब को बनाए रखता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशय या संभावित परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσκόψῃς
  choice: टकरा जाए
  rationale: पैर और पत्थर के प्रसंग में क्रिया का ठोस अर्थ किसी वस्तु से जा लगना है। 'टकरा जाए' इसे स्पष्ट रूप से व्यक्त करता है, जबकि 'ठोकर खाए' एक सम्भव विकल्प है।
- source_word: πρὸς λίθον
  choice: किसी पत्थर से
  rationale: προσκόπτω के साथ πρός पत्थर से संपर्क या टकराव बताता है। अनिश्चित λίθον के लिए 'किसी पत्थर' स्वाभाविक हिन्दी है।
- source_word: τὸν πόδα σου
  choice: तुम्हारा पैर
  rationale: यूनानी में एकवचन है, इसलिए हिन्दी में भी एकवचन रखा गया है।
theological_decisions:
- issue: भजन के उद्धरण में स्वर्गदूतीय सुरक्षा के बिंब को पठनीय आधुनिक हिन्दी में रखना
  choice: वे तुम्हें अपने हाथों पर उठा लेंगे
  alternative: वे तुम्हें अपने हाथों पर सँभाल लेंगे
  rationale: चुना हुआ रूप αἴρω के उठाने के अर्थ और हाथों पर धारण करने के चित्र—दोनों को बनाए रखता है। विकल्प सुरक्षा के भाव को अधिक उभारता है, पर क्रिया के उठाने वाले पक्ष को कुछ कम स्पष्ट करता है। किसी doctrinal निष्कर्ष को जोड़े बिना मूल की प्रतिमा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धरण का काव्यात्मक सुर सुरक्षित है, पर 'उठा लेंगे' और 'टकरा जाए' जैसे सामान्य वर्तमान हिन्दी प्रयोग किए गए हैं।
