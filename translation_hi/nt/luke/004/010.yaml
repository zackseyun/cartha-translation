  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: hi
  text: क्योंकि लिखा है, “वह तुम्हारे विषय में अपने स्वर्गदूतों को आज्ञा देगा कि वे तुम्हारी रक्षा करें,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण के लिए यह स्वाभाविक हिन्दी प्रयोग है और यूनानी पूर्णकाल में निहित वर्तमान प्रामाणिकता को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में दिए जा रहे शास्त्रीय प्रमाण का व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: ὅτι
  choice: उद्धरण-चिह्न
  rationale: ‘लिखा है’ के बाद हिन्दी में उद्धरण को सीधे प्रस्तुत करना स्वाभाविक है; अलग से ‘कि’ जोड़ना आवश्यक नहीं।
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: अपने स्वर्गदूतों को
  rationale: सम्बन्धवाचक सर्वनाम को हिन्दी में कर्ता की ओर संकेत करने वाले ‘अपने’ से स्वाभाविक रूप में व्यक्त किया गया है; प्रसंग में ἄγγελοι के लिए ‘स्वर्गदूत’ स्पष्ट और प्रचलित है।
- source_word: ἐντελεῖται
  choice: आज्ञा देगा
  rationale: भविष्यकालीन क्रिया का आदेश देने वाला अर्थ संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: περὶ σοῦ
  choice: तुम्हारे विषय में
  rationale: περί के सम्बन्धसूचक अर्थ ‘तुम्हारे बारे में/विषय में’ को निकटता से दर्शाता है और ‘तुम्हारे लिए’ कहकर लाभार्थक अर्थ को अनावश्यक रूप से प्रमुख नहीं करता।
- source_word: τοῦ διαφυλάξαι σε
  choice: कि वे तुम्हारी रक्षा करें
  rationale: उद्देश्यसूचक क्रिया-रूप को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; ‘रक्षा करें’ διαφυλάσσω के सावधानी से सुरक्षित रखने के भाव को बनाए रखता है।
theological_decisions:
- issue: शैतान द्वारा दिए गए भजन-संहिता के उद्धरण का रूप
  choice: लूका में उपलब्ध उद्धरणांश का ही निकट अनुवाद
  alternative: भजन 91:11 की छूटी हुई अगली या अन्य पंक्तियों को जोड़कर उद्धरण पूरा करना
  rationale: लूका ने यहाँ जितना पाठ दर्ज किया है, अनुवाद उतना ही प्रस्तुत करता है; मूल भजन से शब्द जोड़ना पाठ का अनधिकृत सामंजस्य होगा।
- issue: τοῦ διαφυλάξαι से व्यक्त उद्देश्य और स्वर्गदूतों की भूमिका
  choice: ‘कि वे तुम्हारी रक्षा करें’
  alternative: अव्यक्त कर्ता वाला अधिक शाब्दिक रूप ‘तुम्हारी रक्षा करने के लिए’
  rationale: यूनानी में रक्षा का कार्य आज्ञा पाने वाले स्वर्गदूतों से स्वाभाविक रूप से जुड़ता है। हिन्दी में ‘वे’ जोड़ना व्याकरणिक संबंध को स्पष्ट करता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। उद्धरण को लूका के यूनानी पाठ की सीमा में रखा गया है और पारंपरिक, अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
