  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: hi
  text: और उसके विषय में समाचार आस-पास के क्षेत्र में हर जगह फैलता जा रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके विषय में चर्चा आस-पास के क्षेत्र के हर स्थान तक पहुँच रही थी।”
    reason: ἦχος का अर्थ ‘समाचार/चर्चा’ और ἐξεπορεύετο का अधिक शब्दशः भाव ‘बाहर जाना/पहुँचना’ भी हो सकता है; यह विकल्प उस अभिव्यक्ति को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: फैलता जा रहा था
  rationale: अपूर्ण भूतकाल का रूप अतीत में जारी प्रक्रिया दिखाता है। ἦχος के साथ यह स्वाभाविक हिन्दी में समाचार के निरंतर फैलने को व्यक्त करता है, जबकि मूल के बाहर जाने के भाव को भी बनाए रखता है।
- source_word: ἦχος
  choice: समाचार
  rationale: इसका मूल अर्थ ‘ध्वनि’ हो सकता है, पर περὶ αὐτοῦ के साथ इस प्रसंग में यीशु के विषय में फैली खबर या चर्चा अभिप्रेत है। ‘समाचार’ स्पष्ट, आधुनिक और गरिमापूर्ण है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: यह पूर्वसर्गीय पदबंध समाचार की विषयवस्तु बताता है। ‘उसके विषय में’ मूल का सीधा और स्वाभाविक प्रतिनिधित्व है।
- source_word: εἰς πάντα τόπον
  choice: हर जगह
  rationale: यह πάντα τόπον की वितरणात्मक व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है। अधिक शब्दशः ‘हर स्थान तक’ भी संभव है।
- source_word: τῆς περιχώρου
  choice: आस-पास के क्षेत्र में
  rationale: περίχωρος निकटवर्ती या चारों ओर के भूभाग को सूचित करता है। ‘आस-पास का क्षेत्र’ इसके भौगोलिक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वृत्तांत से साधारण कथात्मक संबंध बनाए रखता है और कोई अतिरिक्त कारणात्मक या कालगत अर्थ नहीं जोड़ता।
