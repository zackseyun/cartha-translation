source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: hi
  text: आराधनालय से निकलकर वह शमौन के घर में गया। शमौन की सास तेज़ बुखार से पीड़ित थी, और उन्होंने उससे उसके बारे में पूछा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने उससे उसके बारे में पूछा।” इस संदर्भ में इसका अर्थ संभवतः उसकी सहायता के लिए निवेदन करना भी हो सकता है।
    reason: ἐρωτάω का अर्थ “पूछना” या “निवेदन करना” हो सकता है। मुख्य पाठ यूनानी की कम स्पष्ट अभिव्यक्ति को बनाए रखता है; पादटिप्पणी प्रसंगगत संभावना बताती है।
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: फिर वह आराधनालय से उठकर
  rationale: ἀναστάς को पूर्वकालिक कृदन्त के रूप में रखते हुए ‘उठकर’ मुख्य क्रिया से पहले की गति दिखाता है; ἀπό का स्थान से प्रस्थान का भाव ‘से’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: शमौन के घर में गया
  rationale: εἰσέρχομαι और εἰς घर के भीतर जाने को बताते हैं। ‘घर में गया’ आधुनिक हिन्दी में सहज है और प्रवेश का आशय स्पष्ट रखता है।
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: शमौन की सास
  rationale: πενθερά का सीधा संबंधवाचक अर्थ ‘सास’ है; अनुवाद इससे आगे कोई ऐतिहासिक या धार्मिक निष्कर्ष नहीं जोड़ता।
- source_word: ἦν συνεχομένη
  choice: जकड़ी हुई थी
  rationale: συνέχω का कर्मवाच्य प्रयोग बीमारी के द्वारा कसकर पकड़े या पीड़ित किए जाने का सजीव भाव देता है; ‘जकड़ी हुई’ उस बल और निरंतर अवस्था को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πυρετῷ μεγάλῳ
  choice: तेज़ बुखार से
  rationale: μέγας यहाँ बुखार की तीव्रता बताता है। ‘तेज़ बुखार’ आधुनिक हिन्दी का सामान्य और स्पष्ट चिकित्सकीय प्रयोग है।
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: उन्होंने उसके विषय में उससे विनती की
  rationale: ἐρωτάω में पूछने और अनुरोध करने दोनों की अर्थ-छाया हो सकती है। चंगाई के प्रसंग में ‘विनती की’ संभावित निवेदन को व्यक्त करता है, जबकि ‘उसके विषय में’ मूल के περὶ αὐτῆς को बनाए रखकर अनुरोध की सटीक विषयवस्तु को अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: πενθερὰ से शमौन की वैवाहिक स्थिति का निहितार्थ
  choice: संबंधवाचक शब्द का सीधा अनुवाद ‘शमौन की सास’ किया गया है।
  alternative: शमौन की पत्नी की माँ
  rationale: मूल पाठ सास का स्पष्ट उल्लेख करता है, पर अनुवाद को इससे आगे कोई धर्मसैद्धांतिक या ऐतिहासिक व्याख्या नहीं जोड़नी चाहिए।
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς में निवेदन की प्रकृति
  choice: मुख्य पाठ में ‘उन्होंने उसके विषय में उससे विनती की’ रखा गया है।
  alternative: उन्होंने उससे उसकी सहायता करने को कहा / उन्होंने उसके बारे में उससे पूछा
  rationale: संदर्भ सहायता या चंगाई के निवेदन की ओर संकेत करता है, किंतु यूनानी वाक्य यह स्पष्ट नहीं करता कि उन्होंने ठीक क्या माँगा। चुना हुआ रूप निवेदन का भाव रखता है और उस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आराधनालय’, ‘शमौन’, ‘सास’, ‘तेज़ बुखार’ और ‘विनती’ सामान्य हिन्दी पाठक के लिए समझने योग्य हैं। वाक्यरचना मूल घटनाक्रम और उसकी संक्षिप्तता को बनाए रखती है।
