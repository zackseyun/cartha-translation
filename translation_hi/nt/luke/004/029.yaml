source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: hi
  text: वे उठे और उसे नगर के बाहर खदेड़ दिया। फिर वे उसे उस पहाड़ की कगार तक ले गए, जिस पर उनका नगर बसा हुआ था, ताकि उसे नीचे फेंक दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: वे उठे
  rationale: अओरिस्ट कृदंत भीड़ के उठकर तुरंत कार्रवाई करने को दिखाता है; सरल हिन्दी में ‘वे उठे’ शारीरिक और कथात्मक दोनों गति बनाए रखता है।
- source_word: ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως
  choice: उसे नगर से बाहर निकाल दिया
  rationale: ἐκβάλλω यहाँ बलपूर्वक निष्कासन का भाव रखता है। ‘बाहर निकाल दिया’ स्वाभाविक हिन्दी है और अनावश्यक धार्मिक रंग से बचता है।
- source_word: πόλεως
  choice: नगर
  rationale: πόλις के लिए ‘नगर’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है; यह आकार के बारे में ‘शहर’ से अधिक दावा नहीं करता।
- source_word: ἤγαγον
  choice: ले गए
  rationale: ἄγω का व्यापक अर्थ ‘ले जाना’ है। संदर्भ शत्रुतापूर्ण है, पर ‘घसीट ले गए’ मूल क्रिया से अधिक हिंसा जोड़ता।
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: उस पहाड़ की कगार तक
  rationale: ὀφρύς का शाब्दिक अर्थ भौंह और स्थलाकृतिक अर्थ ऊँचाई का किनारा या कगार है। ‘कगार’ आधुनिक हिन्दी में इस स्थलाकृतिक भाव को स्पष्ट रखता है।
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: जिस पर उनका नगर बसा हुआ था
  rationale: यूनानी पूर्णभूत कर्मवाच्य नगर की स्थापित स्थिति बताता है। हिन्दी में ‘बसा हुआ था’ स्वाभाविक है और αὐτῶν का ‘उनका’ सुरक्षित रखता है।
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: ताकि उसे नीचे गिरा दें
  rationale: ὥστε के साथ अनंत क्रिया यहाँ लक्षित परिणाम या उद्देश्य व्यक्त करती है। κατακρημνίζω ऊँचाई से नीचे फेंकने/गिराने का अर्थ देता है; ‘नीचे गिरा दें’ आशय व्यक्त करता है, बिना ‘चट्टान’ जैसा अप्रकट संज्ञा जोड़ने के।
theological_decisions:
- issue: भीड़ की हिंसा और हत्या के आशय को किस स्तर तक स्पष्ट किया जाए
  choice: क्रम और अंतिम उद्देश्यवाचक वाक्यांश से हिंसक आशय प्रकट होने देना
  alternative: ‘उसे मार डालने के लिए’ या ‘उसे खाई में फेंकने के लिए’ कहना
  rationale: पद घातक आशय को स्पष्ट करता है, पर सीधे ‘हत्या’ या ‘खाई’ नहीं कहता। अनुवाद को हिंसा कम नहीं करनी चाहिए, फिर भी मूल से अधिक विवरण नहीं जोड़ना चाहिए।
- issue: ὥστε के उद्देश्य और परिणाम के बीच संभावित अर्थ-संबंध
  choice: ‘ताकि’ द्वारा अभिप्रेत उद्देश्य व्यक्त करना
  alternative: ‘जिससे वे उसे नीचे गिरा देते’ द्वारा परिणाम पर बल देना
  rationale: अनंत क्रिया और प्रसंग भीड़ के इरादे को प्रमुख बनाते हैं, जबकि घटना का परिणाम अभी घटित नहीं हुआ; इसलिए ‘ताकि’ सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘नगर’, ‘कगार’ और ‘बसा हुआ था’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य को दो भागों में बाँटकर क्रियाओं का क्रम और भीड़ की अचानक कार्रवाई सहज रखी गई है।
