- source_word: προσκυνήσῃς
  choice: दण्डवत् करके मेरी उपासना करो
  rationale: क्रिया में झुकने या दण्डवत् होने की शारीरिक मुद्रा और उपासना-सदृश श्रद्धांजलि, दोनों अर्थ संभव हैं। प्रसंग धार्मिक निष्ठा का है; संयुक्त अभिव्यक्ति मूल की अर्थ-व्याप्ति को बनाए रखती है।
- source_word: ἐνώπιον ἐμοῦ
  choice: मेरे सामने
  rationale: यह स्थानिक और संबंधपरक वाक्यांश का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ἔσται σοῦ πᾶσα
  choice: यह सब तुम्हारा हो जाएगा
  rationale: स्त्रीलिंग एकवचन πᾶσα पिछले पद में वर्णित सत्ता से अर्थ ग्रहण करता है। ‘यह सब’ उस पूर्वसंदर्भ को स्वाभाविक रूप से समेटता है, बिना यहाँ अनुपस्थित संज्ञा जोड़े।
