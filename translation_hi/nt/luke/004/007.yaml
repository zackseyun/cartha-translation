  choice: दण्डवत् करके मेरी उपासना करो
  alternative: मेरे सामने दण्डवत् करो
  rationale: क्रिया दोनों अर्थों को वहन कर सकती है। अगले पद में यीशु का उत्तर इसे परमेश्वर के लिए आरक्षित उपासना से जोड़ता है; फिर भी ‘दण्डवत्’ जोड़ने से मूल क्रिया का मूर्त, शारीरिक पहलू मिटता नहीं है।
