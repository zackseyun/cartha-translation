source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: hi
  text: और यीशु ने उसे डाँटकर कहा, “चुप हो जा और इसमें से निकल जा।” तब दुष्टात्मा उस मनुष्य को सबके बीच में फेंककर उसमें से निकल गई और उसे कोई हानि नहीं पहुँचाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: उसे डाँटकर कहा
  rationale: ἐπιτιμάω का अर्थ कठोरता और अधिकार के साथ डाँटना या आदेश देना है। हिन्दी में ‘डाँटकर कहा’ वाणी की उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है; ‘उसे’ का संदर्भ दुष्टात्मा से है।
- source_word: Φιμώθητι
  choice: चुप हो जा
  rationale: φιμόω का शाब्दिक बिंब मुँह पर लगाम लगाने का है, पर वाणी के प्रसंग में इसका स्वाभाविक अर्थ ‘चुप हो जा’ है। यह तीखा आदेश आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: इसमें से निकल जा
  rationale: आज्ञार्थक क्रिया और ἀπό के भाव को सीधे व्यक्त करता है। निकट संदर्भ में यीशु दुष्टात्मा से उस मनुष्य में से निकलने को कह रहे हैं।
- source_word: ῥίψαν αὐτὸν εἰς τὸ μέσον
  choice: उस मनुष्य को सबके बीच में पटककर
  rationale: ῥίπτω बलपूर्वक फेंकने का भाव रखता है और εἰς τὸ μέσον का अर्थ बीच में है। ‘सबके बीच में’ प्रसंगानुकूल और स्वाभाविक हिन्दी है, जबकि ‘पटककर’ घटना की हिंसक तीव्रता व्यक्त करता है, पर चोट लगने की बात नहीं जोड़ता।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: δαιμόνιον यहाँ एक अलौकिक दुष्ट सत्ता को दर्शाता है जिसे यीशु संबोधित करते हैं और जो मनुष्य से निकलती है। ‘दुष्टात्मा’ सामान्य हिन्दी बाइबलीय प्रयोग में स्पष्ट और सहज है।
- source_word: μηδὲν βλάψαν αὐτόν
  choice: उसे कोई हानि नहीं पहुँचाई
  rationale: μηδέν पूर्ण निषेध को और βλάπτω हानि या चोट पहुँचाने को व्यक्त करता है। यह हिन्दी अनुवाद हिंसक रूप से पटकने और वास्तविक हानि न होने के बीच पाठ के विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: δαιμόνιον का स्वरूप और संदर्भ
  choice: इसे ‘दुष्टात्मा’ कहा गया है और यीशु द्वारा सीधे संबोधित एक व्यक्तिगत दुष्ट आत्मिक सत्ता के रूप में कथा की प्रस्तुति सुरक्षित रखी गई है।
  alternative: इसे केवल ‘बुरी शक्ति’, रोग या मानसिक विकार के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ में सीधा संबोधन, आज्ञा, मनुष्य को पटकना और उसमें से निकलना—ये सभी व्यक्तिगत कर्तृत्व दर्शाते हैं। अनुवाद को इस प्रस्तुति को न तो अमूर्त बनाना चाहिए, न आधुनिक निदान से बदलना चाहिए।
- issue: αὐτός के बार-बार आने पर हिन्दी में संदर्भ की स्पष्टता
  choice: जहाँ आवश्यक है वहाँ ‘दुष्टात्मा’ और ‘उस मनुष्य’ स्पष्ट किया गया है।
  alternative: हर सर्वनाम को केवल ‘वह/उसे/उसमें’ से अनूदित करना।
  rationale: यूनानी में अलग-अलग लिंग वाले सर्वनाम संदर्भ स्पष्ट करते हैं, पर हिन्दी में यह भेद नहीं रहता। संज्ञाओं को सीमित रूप से दोहराने से अर्थ स्पष्ट होता है और कोई नई व्याख्या नहीं जुड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथात्मक शैली। ‘चुप हो जा’ और ‘निकल जा’ सीधे, अधिकारपूर्ण एकवचन आदेश हैं। ‘पटककर’ घटना की शक्ति व्यक्त करता है; अंतिम वाक्य स्पष्ट करता है कि मनुष्य को कोई हानि नहीं हुई।
