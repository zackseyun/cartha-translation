source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: hi
  text: और उसे ऊपर ले जाकर उसने उसे बसे हुए संसार[a] के सारे राज्य एक क्षण में[b] दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘संसार के।’ यूनानी शब्द का अर्थ प्रायः ‘बसा हुआ संसार’ होता है और कुछ संदर्भों में इससे विशेष रूप से सभ्य या साम्राज्यिक जगत अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पल भर में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: उसे ऊपर ले गया
  rationale: यह अनुवाद ऊपर की ओर ले जाने के भाव और मुख्य क्रिया से पहले की क्रियात्मक क्रमबद्धता को स्वाभाविक हिन्दी में रखता है। स्थान को ‘पहाड़’ नहीं कहा गया, क्योंकि लूका के इस पद में वह स्पष्ट नहीं है।
- source_word: ἔδειξεν
  choice: दिखाए
  rationale: δείκνυμι का यहाँ सामान्य कथात्मक अर्थ है; ‘दिखाए’ प्रत्यक्ष कर्म के साथ सहज और सटीक है।
- source_word: πάσας τὰς βασιλείας
  choice: सारे राज्य
  rationale: बहुवचन βασιλείας यहाँ अमूर्त राजत्व के बजाय राज्यों या राज्यक्षेत्रों को दर्शाता है; πάσας की व्यापकता ‘सारे’ से व्यक्त होती है।
- source_word: τῆς οἰκουμένης
  choice: बसे हुए संसार के
  rationale: οἰκουμένη का मूल भाव मनुष्यों द्वारा बसे संसार का है और कभी-कभी सभ्य या साम्राज्यिक जगत का संकेत हो सकता है। यह चयन उस विशिष्टता को बचाता है, पर अर्थ को केवल रोमी साम्राज्य तक सीमित नहीं करता।
- source_word: ἐν στιγμῇ χρόνου
  choice: पल भर में
  rationale: यह हिन्दी मुहावरा अत्यल्प समय या एक क्षण के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: शैतान ने राज्यों को किस प्रकार दिखाया
  choice: घटना का केवल वर्णन किया गया है; दिखाने की रीति निर्दिष्ट नहीं की गई।
  alternative: इसे दर्शन, अलौकिक प्रदर्शन, या किसी वास्तविक ऊँचे स्थान से दिखाई देने वाला दृश्य कहना।
  rationale: यूनानी पाठ केवल कहता है कि उसने बसे हुए संसार के सारे राज्य अत्यल्प समय में दिखाए। अनुवाद उस क्रिया को किसी विशेष तंत्र या भौगोलिक स्थान से नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पल भर में’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी यूनानी वाक्यांश का अधिक शाब्दिक रूप देती है। सभी पादटिप्पणी-चिह्न संबंधित पद के अंत में दिए गए हैं।
