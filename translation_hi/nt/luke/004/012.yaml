  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “कहा गया है[a], ‘तुम अपने प्रभु परमेश्वर[b] की परीक्षा न लेना।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवादों में प्रायः “लिखा है” मिलता है; यहाँ यूनानी का शाब्दिक अर्थ “कहा गया है” है।
    reason: alternative_reading
  - marker: b
    text: यह व्यवस्थाविवरण 6:16 का उद्धरण है। वहाँ इब्रानी पाठ में परमेश्वर का निज नाम YHWH है, जिसे अक्सर “यहोवा” लिप्यंतरित किया जाता है और जिसका अनुवाद प्रायः “प्रभु” किया जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: उसे उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया का यह यूनानी प्रयोग स्वाभाविक हिन्दी में ‘उत्तर दिया’ से पूरा व्यक्त होता है; αὐτῷ को ‘उसे’ से स्पष्ट रखा गया है।
- source_word: Εἴρηται
  choice: कहा गया है
  rationale: यह λέγω का पूर्णकालिक कर्मवाच्य रूप है, जिसका अर्थ ‘कहा गया है’ है। इससे यूनानी शब्दावली सुरक्षित रहती है और पवित्रशास्त्र के प्रामाणिक कथन का भाव भी बना रहता है।
- source_word: Οὐκ ἐκπειράσεις
  choice: परीक्षा में न डालना
  rationale: ἐκπειράζω का आशय किसी को परखने या उसकी परीक्षा लेने से है। यह अनुवाद परमेश्वर को पाप के लिए लुभाने का भ्रामक अर्थ उत्पन्न नहीं करता और निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριον τὸν θεόν σου
  choice: अपने प्रभु परमेश्वर
  rationale: ‘प्रभु’ κύριος और ‘परमेश्वर’ θεός को दर्शाता है; ‘अपने’ सम्बन्धवाचक σου को पूरी संयुक्त उपाधि से स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: पवित्रशास्त्र के उद्धरण का सूत्र (Εἴρηται)
  choice: कहा गया है
  alternative: लिखा है
  rationale: मूल यूनानी में ‘कहना’ वाला λέγω है, ‘लिखना’ वाला γράφω नहीं। इसलिए मुख्य पाठ मूल रूप को बनाए रखता है, जबकि प्रचलित विकल्प पादटिप्पणी में दिया गया है।
- issue: व्यवस्थाविवरण 6:16 के उद्धरण में κύριος
  choice: प्रभु
  alternative: याहवे
  rationale: लूका के यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है। उद्धृत इब्रानी पद में परमेश्वर का निज नाम YHWH है; यह स्रोत-संबंध पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम’ एकवचन सम्बोधन को स्वाभाविक आधुनिक रूप में व्यक्त करता है। उद्धरण के भीतर निषेध के लिए ‘न डालना’ आज्ञार्थक शैली रखी गई है।
