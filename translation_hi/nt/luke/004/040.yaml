  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: hi
  text: जब सूरज डूब रहा था[a], तब वे सब लोग, जिनके यहाँ तरह-तरह की बीमारियों से पीड़ित लोग थे, उन्हें यीशु के पास ले आए। वह उनमें से हर एक पर अपने हाथ रखकर उन्हें चंगा करता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूरज डूबते समय।” यूनानी में वर्तमान कृदंत के साथ एक स्वतंत्र कालवाचक रचना है, जो बताती है कि ये घटनाएँ सूरज डूबने के समय हुईं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: जब सूरज डूब रहा था, तब
  rationale: वर्तमान कृदंत वाले यूनानी संबंध-स्वतंत्र कालवाचक वाक्यांश से उसी समय जारी क्रिया प्रकट होती है। ‘जब…तब’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है; δέ को अलग ‘अब’ से अनूदित करना आवश्यक नहीं है।
- source_word: ἅπαντες ὅσοι
  choice: वे सब लोग, जिनके यहाँ
  rationale: यह संयुक्त अभिव्यक्ति व्यापकता पर बल देती है। ‘वे सब लोग, जिनके यहाँ’ इस बल को बनाए रखते हुए बीमार व्यक्तियों से उनके संबंध या देखभाल को स्वाभाविक हिन्दी में बताता है।
- source_word: ἀσθενοῦντας νόσοις ποικίλαις
  choice: तरह-तरह की बीमारियों से पीड़ित लोग
  rationale: चंगाई के प्रसंग में ἀσθενέω बीमारी को और ποικίλαις विभिन्न प्रकारों को सूचित करता है। ‘पीड़ित’ अनावश्यक पुनरुक्ति से बचते हुए आशय स्पष्ट करता है।
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: उन्हें यीशु के पास ले आए
  rationale: ἄγω यहाँ बीमारों को चंगाई के लिए किसी के पास लाने के अर्थ में है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए प्रसंगगत व्यक्ति का नाम ‘यीशु’ स्पष्ट किया गया है।
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: उनमें से हर एक पर
  rationale: दोहरा वितरणवाचक प्रयोग प्रत्येक व्यक्ति पर अलग-अलग ध्यान दिए जाने पर बल देता है।
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: अपने हाथ रखकर
  rationale: यह हाथ रखने की ठोस शारीरिक क्रिया को व्यक्त करता है और इसमें बाद की कोई संस्कारगत धारणा नहीं जोड़ी गई है।
- source_word: ἐθεράπευεν
  choice: चंगा करता गया
  rationale: अपूर्ण भूतकाल रूप निरंतर या बार-बार होने वाली क्रिया दिखाता है। ‘करता गया’ प्रत्येक व्यक्ति को क्रमशः चंगा किए जाने का भाव स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: हाथ रखने की क्रिया का अर्थ
  choice: वह उनमें से हर एक पर अपने हाथ रखकर उन्हें चंगा करता गया
  alternative: वह उनमें से हर एक पर हाथ रखता और उसे चंगा करता था
  rationale: अनुवाद यीशु की व्यक्तिगत और शारीरिक चंगाई की क्रिया को सुरक्षित रखता है, पर इसे किसी बाद की कलीसियाई विधि या संस्कार के रूप में परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तरह-तरह की बीमारियाँ’, ‘ले आए’ और ‘चंगा करता गया’ सामान्य हिन्दी पाठक के लिए स्पष्ट हैं। ‘चंगा’ सुसमाचारों के चंगाई-वर्णनों में परिचित है, जबकि वाक्यरचना अत्यधिक धार्मिक या पुरातन शैली से बचती है।
