base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: hi
  text: वे उसकी शिक्षा से चकित थे, क्योंकि उसकी वाणी में अधिकार था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसका संदेश अधिकारपूर्ण था’; अथवा, ‘वह जो कहता था, अधिकार के साथ कहता था।’
    reason: λόγος और ἐν ἐξουσίᾳ के संयुक्त वाक्यांश के स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: चकित थे
  rationale: यह क्रिया लोगों की प्रबल और जारी प्रतिक्रिया बताती है। ‘चकित थे’ आधुनिक हिन्दी में स्वाभाविक है और आश्चर्य की तीव्रता को बनाए रखता है।
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: उसके उपदेश से
  rationale: ἐπί के साथ यहाँ उसके उपदेश को उनके चकित होने का आधार बताया गया है। ‘उपदेश’ आराधनालय में दी गई शिक्षा के प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: διδαχῇ
  choice: उपदेश
  rationale: διδαχή शिक्षा देने की क्रिया या उसकी विषय-वस्तु दोनों को सूचित कर सकता है। इस प्रसंग में ‘उपदेश’ दोनों आयामों को पर्याप्त रूप से समेटता है।
- source_word: ἐν ἐξουσίᾳ
  choice: में अधिकार था
  rationale: यह पदबंध यीशु की कही हुई बात के अधिकारपूर्ण गुण को व्यक्त करता है। ‘बात में अधिकार था’ हिन्दी में ‘अधिकार के साथ था’ से अधिक स्वाभाविक है और मूल के दावे को बिना विस्तार दिए रखता है।
- source_word: ὁ λόγος αὐτοῦ
  choice: उसकी बात
  rationale: λόγος यहाँ यीशु के बोले हुए वचन या कथन को सूचित करता है। ‘उसकी बात’ आधुनिक हिन्दी में सहज है और इसे किसी तकनीकी धर्मशास्त्रीय अर्थ तक सीमित नहीं करती।
- source_word: ὅτι
  choice: क्योंकि
  rationale: ὅτι यहाँ लोगों के चकित होने का कारण प्रस्तुत करता है; ‘क्योंकि’ इस कारणात्मक संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु की वाणी के अधिकार का स्वरूप
  choice: ‘उसकी बात में अधिकार था’ के रूप में वर्णनात्मक अनुवाद
  alternative: ‘उसका संदेश अधिकारपूर्ण था’ या ‘वह अधिकार के साथ बोलता था’
  rationale: पद यीशु की वाणी को अधिकारयुक्त बताता है, पर उस अधिकार के पूर्ण धर्मशास्त्रीय आधार की व्याख्या नहीं करता। चुना हुआ अनुवाद इस दावे को बनाए रखते हुए पाठ से बाहर की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसकी बात’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल वाक्यांश के अधिक औपचारिक विकल्प सुरक्षित रखती है।
