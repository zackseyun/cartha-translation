  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: hi
  text: तब वह उसे यरूशलेम ले गया और उसे मंदिर[a] के ऊँचे निकले हुए भाग पर खड़ा किया और उससे कहा, “यदि तुम परमेश्वर के पुत्र हो[b], तो अपने आप को यहाँ से नीचे फेंक दो;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मंदिर के छोटे पंख पर।’ यूनानी शब्द मंदिर-परिसर के किसी बाहर निकले हुए छोर या ऊँचे भाग को सूचित करता है। यहाँ ‘मंदिर’ से केवल भीतरी पवित्र भवन नहीं, बल्कि पूरा मंदिर-परिसर अभिप्रेत है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: इसका अनुवाद ‘क्योंकि तुम परमेश्वर के पुत्र हो’ भी हो सकता है। यहाँ प्रलोभक की चुनौती को बनाए रखने के लिए ‘यदि’ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: तब वह उसे ... ले गया
  rationale: δέ कथा में अगले चरण की ओर बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’; ἤγαγεν के लिए ‘ले गया’ सक्रिय मार्गदर्शन और स्थान-परिवर्तन दोनों व्यक्त करता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: ἔστησεν
  choice: खड़ा किया
  rationale: यहाँ ἵστημι का सकर्मक अर्थ किसी को किसी स्थान पर खड़ा करना है; हिन्दी में यह ‘रखा’ की अपेक्षा अधिक सटीक है।
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: मन्दिर के सबसे ऊँचे निकले हुए भाग पर
  rationale: πτερύγιον का मूल बोध ‘छोटा पंख’ है, पर स्थापत्य-सन्दर्भ में यह किसी निकले हुए छोर या ऊँचे बिन्दु को दर्शाता है। यह अनुवाद आधुनिक पाठक के लिए अर्थ स्पष्ट करता है, जबकि टिप्पणी में वास्तविक दायरा सुरक्षित है। ἱερόν पूरे मन्दिर-परिसर को सूचित करता है।
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: यदि तुम परमेश्वर के पुत्र हो
  rationale: εἰ और निदर्शक क्रिया का भाव प्रसंग में चुनौती के रूप में ‘यदि’ से स्वाभाविक ढंग से व्यक्त होता है; ‘परमेश्वर के पुत्र’ उपाधिगत अर्थ को बनाए रखता है।
- source_word: βάλε σεαυτὸν
  choice: अपने आप को ... फेंक दो
  rationale: आज्ञार्थक βάλε यहाँ नीचे की ओर स्वयं को फेंकने का तीखा और सीधा आदेश है।
- source_word: ἐντεῦθεν κάτω
  choice: यहाँ से नीचे
  rationale: ἐντεῦθεν वर्तमान स्थान से गति और κάτω उसकी नीचे की दिशा बताता है; यह हिन्दी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: शैतान द्वारा यीशु की पहचान को चुनौती
  choice: यदि तुम परमेश्वर के पुत्र हो
  alternative: क्योंकि तुम परमेश्वर के पुत्र हो / जब तुम परमेश्वर के पुत्र हो ही
  rationale: यूनानी εἰ + निदर्शक कुछ प्रसंगों में मान ली गई सत्यता, लगभग ‘क्योंकि/जब’, व्यक्त कर सकता है; फिर भी यहाँ ‘यदि’ प्रलोभक की चुनौती और कथा का तनाव सुरक्षित रखता है, बिना कथावाचक की ओर से यीशु की पहचान पर सन्देह आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शिखर’ जैसा संभावित रूप स्थापत्य की ऐसी निश्चित आकृति का संकेत दे सकता है जो यूनानी में अनिवार्य नहीं; इसलिए वर्णनात्मक ‘सबसे ऊँचे निकले हुए भाग’ चुना गया। ‘मन्दिर’ की प्रचलित वर्तनी अपनाई गई है।
