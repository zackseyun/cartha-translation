base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: hi
  text: फिर यीशु, पवित्र आत्मा से परिपूर्ण होकर, यरदन से लौटे और आत्मा उन्हें निर्जन प्रदेश में ले जा रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: पवित्र आत्मा से परिपूर्ण
  rationale: πλήρης के साथ संबंधकारक यहाँ किसी से पूर्ण होने की अवस्था बताता है। यह अनुवाद वर्णनात्मक बल बनाए रखता है और किसी क्षणिक भर जाने की घटना का अनावश्यक संकेत नहीं देता।
- source_word: ὑπέστρεψεν
  choice: लौटे
  rationale: ὑποστρέφω का सामान्य अर्थ लौटना है। आदरसूचक बहुवचन आधुनिक हिन्दी में यीशु के लिए स्वाभाविक है।
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: यरदन से
  rationale: मूल पाठ केवल यरदन नाम देता है; ‘नदी’ जोड़ना आवश्यक नहीं है।
- source_word: ἤγετο
  choice: अगुवाई करता रहा
  rationale: अपूर्ण भूतकाल निरंतर चल रही क्रिया को व्यक्त करता है। हिन्दी में सक्रिय रचना स्वाभाविक है और निष्क्रिय यूनानी का आशय—आत्मा द्वारा यीशु का लगातार मार्गदर्शन—स्पष्ट रखती है।
- source_word: ἐν τῷ πνεύματι
  choice: आत्मा … अगुवाई करता रहा
  rationale: ἄγω के निष्क्रिय रूप के साथ ἐν को करण अथवा कर्ता-सूचक समझना प्रसंगानुकूल है। निकटवर्ती ‘पवित्र आत्मा’ के कारण वही इसका स्वाभाविक संदर्भ है। अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος किसी उजाड़, निर्जन क्षेत्र को दर्शा सकता है; यह अनुवाद रेतीले मरुस्थल या वन का अनावश्यक चित्र आरोपित नहीं करता।
- source_word: δὲ
  choice: फिर
  rationale: δέ यहाँ कथा में हल्का संक्रमण दिखाता है; ‘फिर’ पिछले प्रसंग से स्वाभाविक क्रम जोड़ता है।
theological_decisions:
- issue: ἐν τῷ πνεύματι में ‘आत्मा’ का संदर्भ
  choice: पवित्र आत्मा यीशु की अगुवाई कर रहा था
  alternative: यीशु आत्मा में थे अथवा यह उनकी आंतरिक आत्मिक अवस्था का संकेत है
  rationale: तुरंत पहले ‘पवित्र आत्मा से परिपूर्ण’ कहा गया है और लूका के वर्णन में पवित्र आत्मा सक्रिय कर्ता है। फिर भी ἐν की अधिक शाब्दिक अभिव्यक्ति ‘आत्मा में’ हो सकती है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ सामान्य पाठक के लिए स्पष्ट है और ‘जंगल’ या ‘रेगिस्तान’ की अपेक्षा मूल शब्द की व्यापकता बेहतर बनाए रखता है।
