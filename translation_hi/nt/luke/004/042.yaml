  verdict: revise
  source_fidelity: The temporal transition, sequential departure, isolated destination, ongoing search, arrival, and ongoing attempt to prevent Jesus' departure are all represented. However, “अपने यहाँ से” can suggest a physical place belonging to the crowds rather than the Greek sense “from them,” and “भीड़ें” is grammatical but less natural in modern standard Hindi.
  naturalness: “दिन निकलने पर,” “लोगों के समूह,” and “उसे अपने पास से जाने से रोकने की कोशिश” are more idiomatic modern Hindi while retaining the source's aspect and sense.
  terminology: “सुनसान जगह” appropriately renders the isolated/uninhabited sense of ἔρημος without implying a literal desert. No theological terminology is involved.
  issues:
  - severity: medium
    issue: “अपने यहाँ से जाने न देने” is imprecise.
    rationale: It can mean not letting him leave their own location, whereas ἀπ’ αὐτῶν means preventing him from going away from the people themselves. “अपने पास से जाने से रोकने” expresses this relation naturally.
  - severity: low
    issue: “भीड़ें” is stylistically marked in this context.
    rationale: Although it reflects the Greek plural form, “लोगों के समूह” is more natural modern Hindi and still conveys multiple crowds/groups.
