base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: hi
  text: दिन निकलने पर वह बाहर निकलकर एक सुनसान जगह[a] में चला गया। लोगों के समूह उसे ढूँढ़ रहे थे, और वे उसके पास आए और उसे अपने पास से जाने से रोकने की कोशिश कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक एकांत जगह’ अथवा ‘एक निर्जन स्थान।’ यूनानी शब्द ऐसे स्थान का वर्णन करता है जहाँ लोग न रहते हों या जो आबादी से अलग हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: जब दिन हुआ
  rationale: यह संबंधवाचक कृदन्तीय रचना समय के परिवर्तन को दर्शाती है; यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को सुरक्षित रखती है।
- source_word: ἐξελθὼν ἐπορεύθη
  choice: बाहर निकलकर ... चला गया
  rationale: पहले बाहर निकलने और फिर उस स्थान की ओर जाने—दोनों क्रमिक क्रियाओं को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς ἔρημον τόπον
  choice: एक सुनसान जगह में
  rationale: ἔρημος यहाँ निर्जन या एकांत स्थान का बोध करा सकता है, अनिवार्यतः रेगिस्तान का नहीं; ‘सुनसान जगह’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: οἱ ὄχλοι
  choice: भीड़ें
  rationale: ग्रीक में बहुवचन है और लोगों के अनेक समूहों का संकेत देता है; ‘भीड़ें’ उस रूप को बनाए रखता है।
- source_word: ἐπεζήτουν αὐτόν
  choice: उसे खोज रही थीं
  rationale: अपूर्ण भूतकाल जारी खोज को व्यक्त करता है; ‘खोज रही थीं’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: ἦλθον ἕως αὐτοῦ
  choice: वे उसके पास आ पहुँचीं
  rationale: यह उनके यीशु के स्थान तक पहुँच जाने को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: κατεῖχον αὐτὸν
  choice: उसे ... जाने न देने का प्रयत्न कर रही थीं
  rationale: κατέχω रोकने या थामे रखने का अर्थ दे सकता है; प्रसंग में उनके प्रयत्न को व्यक्त करते हुए यह अनावश्यक रूप से शारीरिक बल का संकेत नहीं देता।
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: अपने यहाँ से जाने न देने
  rationale: यह रोकने के उद्देश्य—उनसे दूर न जाने देने—को स्वाभाविक हिन्दी में व्यक्त करता है।
