  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: hi
  text: 'यीशु[b] ने उसे उत्तर दिया, “लिखा है: ‘मनुष्य[a] केवल रोटी से जीवित नहीं रहेगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कोई भी व्यक्ति; यहाँ “मनुष्य” पूरी मानव जाति के लिए सामान्य अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: यीशु व्यवस्थाविवरण 8:3 को उद्धृत कर रहे हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: उसे उत्तर दिया
  rationale: ἀποκρίνομαι के साथ πρός + कर्मकारक यहाँ उत्तर देने के सामान्य मुहावरे को व्यक्त करता है; ‘उसे उत्तर दिया’ स्वाभाविक हिन्दी है और संबंध को स्पष्ट रखता है।
- source_word: Γέγραπται
  choice: लिखा है
  rationale: पूर्णकालिक कर्मवाच्य रूप सुसमाचारों में पवित्रशास्त्र उद्धृत करने का मानक सूत्र है। ‘लिखा है’ वर्तमान में कायम लिखित अधिकार का भाव बनाए रखता है।
- source_word: ὅτι
  choice: उद्धरण से पहले अल्पविराम
  rationale: यहाँ ὅτι उद्धृत वचन का परिचय देता है। हिन्दी में इसे अलग शब्द से अनूदित करने के बजाय विराम-चिह्न द्वारा व्यक्त करना अधिक स्वाभाविक है।
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: केवल रोटी से
  rationale: ζήσεται के साथ ἐπί जीवन को बनाए रखने के आधार या साधन को दर्शाता है। ‘केवल रोटी से’ स्वाभाविक हिन्दी में वही अर्थ देता है।
- source_word: ζήσεται
  choice: जीवित नहीं रहेगा
  rationale: भविष्यकाल का रूप वर्तमान हिन्दी में ‘जीवित नहीं रहेगा’ से स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ ἄνθρωπος
  choice: मनुष्य
  rationale: व्यवस्थाविवरण 8:3 की प्रतिध्वनि में एकवचन शब्द समस्त मानव जाति के प्रत्येक सदस्य के लिए प्रतिनिधिक और सामान्य अर्थ रखता है। ‘मनुष्य’ इस एकवचन और व्यापक अर्थ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: पवित्रशास्त्रीय उद्धरण में ὁ ἄνθρωπος का सामान्य एकवचन अर्थ
  choice: मनुष्य
  alternative: कोई व्यक्ति
  rationale: ‘मनुष्य’ स्रोत के एकवचन प्रतिनिधिक रूप और व्यवस्थाविवरण 8:3 के अंतर्पाठीय संबंध को बनाए रखता है; इसे केवल पुरुष के अर्थ में समझने से बचाने के लिए व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। उद्धरण के भीतर उद्धरण दिखाने के लिए दोहरे और एकहरे उद्धरण-चिह्न प्रयुक्त हैं।
