base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: hi
  text: और भविष्यद्वक्ता एलीशा के समय इस्राएल में चर्मरोग से पीड़ित बहुत-से लोग[a] थे, और उनमें से किसी को शुद्ध नहीं किया गया, सिवाय सीरियावासी नामान के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “बहुत-से कोढ़ी।” यहाँ प्रयुक्त यूनानी शब्द कई प्रकार के चर्मरोगों को सूचित कर सकता है; यह आवश्यक नहीं कि हर बार आधुनिक हैन्सन रोग ही हो।'
    reason: मूल शब्द की चिकित्सकीय व्यापकता को सुरक्षित रखने और आधुनिक पाठक को ‘कोढ़’ की संभावित अतिविशिष्ट समझ से बचाने के लिए।
lexical_decisions:
- source_word: λεπροὶ
  choice: गंभीर चर्मरोग से पीड़ित बहुत-से लोग
  rationale: यूनानी शब्द बाइबलीय संदर्भ में विभिन्न गंभीर चर्मरोगों को सूचित कर सकता है और हर स्थिति में आधुनिक हैन्सन रोग तक सीमित नहीं है। व्यक्ति-केंद्रित यह अभिव्यक्ति अर्थ को स्पष्ट, सम्मानजनक और आधुनिक हिन्दी में रखती है।
- source_word: ἐν τῷ Ἰσραὴλ
  choice: इस्राएल में
  rationale: यह स्थान अथवा क्षेत्र को स्वाभाविक रूप से व्यक्त करता है और ‘देश’ या ‘लोगों के बीच’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: एलीशा भविष्यद्वक्ता के समय
  rationale: सम्बन्धकारक के साथ ἐπί यहाँ काल-सूचक है। यह अनुवाद मूल के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκαθαρίσθη
  choice: शुद्ध नहीं किया गया
  rationale: निष्क्रिय रूप को बनाए रखते हुए यह शारीरिक चंगाई और बाइबलीय शुद्धता—दोनों की प्रतिध्वनि सुरक्षित रखता है; केवल ‘चंगा’ कहना अर्थ को संकुचित कर देता।
- source_word: εἰ μὴ
  choice: केवल
  rationale: οὐδεὶς के बाद यह अपवाद प्रकट करता है। हिन्दी में ‘किसी को नहीं... केवल... को’ स्वाभाविक और स्पष्ट संरचना है।
- source_word: Ναιμὰν ὁ Σύρος
  choice: सीरियावासी नामान
  rationale: जातीय पहचान को नाम के साथ स्पष्ट रखा गया है, जिससे कथन का यह बल बना रहता है कि शुद्ध किया गया व्यक्ति इस्राएली नहीं बल्कि सीरियावासी था।
theological_decisions:
- issue: चर्मरोग के संदर्भ में शुद्ध किए जाने की भाषा
  choice: ἐκαθαρίσθη का अनुवाद ‘शुद्ध नहीं किया गया’ किया गया है।
  alternative: ‘चंगा नहीं किया गया’ अथवा ‘शुद्ध नहीं हुआ’
  rationale: ‘शुद्ध किया गया’ मूल के निष्क्रिय व्याकरण और चर्मरोग से जुड़ी शारीरिक तथा धार्मिक शुद्धता की बाइबलीय भाषा दोनों को सुरक्षित रखता है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के।
- issue: नामान की सीरियाई पहचान का बल
  choice: मुख्य पाठ में ‘सीरियावासी नामान’ रखा गया है।
  alternative: ‘नामान, जो सीरिया का था’ अथवा केवल ‘नामान’
  rationale: यूनानी पदबंध उसकी पहचानी हुई जातीय पहचान पर बल देता है। इसे बनाए रखना यीशु के उदाहरण में इस्राएल के बाहर के व्यक्ति को मिले अनुग्रह की कथात्मक विडंबना को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गंभीर चर्मरोग से पीड़ित लोग’ व्यक्ति को रोग से परिभाषित करने से बचाता है, जबकि पादटिप्पणी पारंपरिक शब्दावली और मूल की व्यापकता दोनों बताती है। वाक्य की तुलना और अंतिम अपवाद को दीर्घ विराम से उभारा गया है।
