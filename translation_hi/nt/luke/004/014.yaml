  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: hi
  text: तब यीशु आत्मा की सामर्थ्य में गलील लौटे। और उनके विषय में खबर[a] आस-पास के पूरे प्रदेश में फैल गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समाचार,” “ख्याति,” अथवा “अफ़वाह।” यूनानी शब्द व्यापक रूप से फैलने वाली किसी खबर या चर्चा को सूचित कर सकता है; वह अपने आप यह नहीं बताता कि वह सकारात्मक थी या नकारात्मक।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: लौटे
  rationale: यह क्रिया कथा में किसी स्थान पर वापस जाने का भाव देती है। ‘लौटे’ संक्षिप्त, स्वाभाविक और दिशात्मक अर्थ के प्रति निष्ठावान है।
- source_word: ἐν τῇ δυνάμει
  choice: सामर्थ्य में
  rationale: यह अनुवाद यूनानी पूर्वसर्गीय वाक्यांश की क्षेत्र अथवा रीति संबंधी खुली अर्थ-छाया को बनाए रखता है और इसे केवल साधन के अर्थ में सीमित नहीं करता।
- source_word: τοῦ πνεύματος
  choice: आत्मा की
  rationale: निकटवर्ती प्रसंग में संकेत पवित्र आत्मा की ओर है, पर यहाँ ‘पवित्र’ शब्द स्पष्ट रूप से नहीं आया है; इसलिए मुख्य पाठ में केवल ‘आत्मा’ रखा गया है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील
  rationale: ‘गलील लौटे’ आधुनिक हिन्दी में गंतव्य व्यक्त करने का सहज रूप है; अलग से ‘को’ या ‘में’ जोड़ना आवश्यक नहीं है।
- source_word: φήμη
  choice: खबर
  rationale: ‘खबर’ किसी व्यक्ति के विषय में व्यापक रूप से फैलने वाली सूचना को स्वाभाविक हिन्दी में व्यक्त करती है और अपने आप उसे सकारात्मक ‘ख्याति’ या नकारात्मक ‘अफ़वाह’ नहीं ठहराती।
- source_word: ἐξῆλθεν
  choice: फैल गई
  rationale: यूनानी में शाब्दिक गति-रूपक ‘निकल गई’ है, किंतु खबर के लिए हिन्दी में ‘फैल गई’ उसी आशय का अधिक स्वाभाविक और स्पष्ट कथन है।
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: आस-पास के पूरे प्रदेश में
  rationale: यह पद पूरे निकटवर्ती भूभाग में व्यापक प्रसार का भाव व्यक्त करता है।
- source_word: περὶ αὐτοῦ
  choice: उनके विषय में
  rationale: यह περί के संबंधसूचक अर्थ को वर्तमान, गरिमापूर्ण हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: πνεύματος का संदर्भ
  choice: ‘आत्मा’ से पवित्र आत्मा अभिप्रेत है
  alternative: किसी अनिर्दिष्ट आत्मा या यीशु की आंतरिक मनोदशा
  rationale: लूका 4 के तत्काल प्रसंग में यीशु के बपतिस्मे, परीक्षा और सेवकाई के आरम्भ के संबंध में आत्मा का लगातार उल्लेख पवित्र आत्मा के रूप में होता है। फिर भी मूल पद में विशेषण ‘पवित्र’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आत्मा की सामर्थ्य में’ मूल की अर्थगत खुली प्रकृति को बचाता है, जबकि ‘खबर फैल गई’ हिन्दी में प्रचलित अभिव्यक्ति है। आदरसूचक बहुवचन क्रियारूप और सर्वनाम यीशु के लिए सामान्य हिन्दी बाइबलीय प्रयोग के अनुसार रखे गए हैं।
