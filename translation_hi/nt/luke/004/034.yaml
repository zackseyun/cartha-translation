source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: hi
  text: “अरे![a] नासरत के यीशु,[c] हमसे तुम्हारा क्या काम है?[b][d] क्या तुम हमें नष्ट करने आए हो? मैं जानता हूँ कि तुम कौन हो—परमेश्वर का पवित्र जन।”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आह!” यूनानी Ἔα भय या विरोध की अचानक निकली पुकार है; भावार्थ के रूप में इसका अनुवाद “हमें छोड़ दो!” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “हमसे और तुमसे क्या?” यह दूरी बनाने या विरोध जताने वाला एक सामी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, “यीशु नासरी।”
    reason: lexical_alternative
  - marker: d
    text: यूनानी में “हम” बहुवचन है, पर यह स्पष्ट नहीं है कि दुष्टात्मा केवल प्रतिनिधि रूप में बोल रही है या व्यापक दुष्टात्मिक जगत को सम्मिलित कर रही है।
    reason: alternative_reading
  - marker: e
    text: या, “परमेश्वर का पवित्र व्यक्ति।” यूनानी में यह एकवचन उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: अरे!
  rationale: यह आकस्मिक भय या विरोध की पुकार है। ‘अरे!’ उसकी तीव्रता बनाए रखता है, पर संदर्भ का अर्थ खोलकर ‘हमें छोड़ दो’ नहीं जोड़ता।
- source_word: τί ἡμῖν καὶ σοί
  choice: हमसे तुम्हारा क्या काम है?
  rationale: शाब्दिक रूप से ‘हमसे और तुमसे क्या?’ एक सामी मुहावरा है, जो दूरी या विरोध व्यक्त करता है। चुना हुआ रूप स्वाभाविक आधुनिक हिन्दी में वही टकरावपूर्ण भाव रखता है।
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: नासरत के यीशु
  rationale: सम्बोधन में यीशु की पहचान नासरत से जुड़े व्यक्ति के रूप में होती है। यह हिन्दी में ‘यीशु नासरी’ की अपेक्षा अधिक सहज है।
- source_word: ἦλθες
  choice: क्या तुम ... आए हो?
  rationale: अओरिस्ट यहाँ वर्तमान आगमन के उद्देश्य पर प्रश्न करता है; हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से उस वर्तमान प्रभाव को व्यक्त करता है।
- source_word: ἀπολέσαι
  choice: नष्ट करने
  rationale: यहाँ क्रिया विनाशकारी न्याय या सर्वनाश का भाव रखती है। ‘नष्ट करना’ स्पष्ट है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἡμᾶς
  choice: हमें
  rationale: मूल का बहुवचन ज्यों का त्यों रखा गया है; वक्ता किन सबको सम्मिलित करता है, यह पाठ स्पष्ट नहीं करता।
- source_word: οἶδά σε τίς εἶ
  choice: मैं जानता हूँ कि तुम कौन हो
  rationale: यह मूल कथन का सीधा और स्वाभाविक हिन्दी रूप है, जिसमें पहचान के दावे को बिना विस्तार के रखा गया है।
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: परमेश्वर के पवित्र जन
  rationale: यह विशेष उपाधि यीशु की पवित्रता और परमेश्वर से उनके विशिष्ट सम्बन्ध को व्यक्त करती है। ‘पवित्र जन’ substantival विशेषण का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दुष्टात्मा के कथन में बहुवचन ἡμᾶς
  choice: केवल ‘हमें’ रखा गया, उसका संदर्भ निश्चित नहीं किया गया।
  alternative: दुष्टात्मा समस्त दुष्टात्मिक जगत की ओर से बोल रही है; अथवा अपने और ग्रस्त मनुष्य की ओर से बोल रही है।
  rationale: यूनानी पाठ प्रथम पुरुष बहुवचन देता है, पर उसके दायरे की पहचान नहीं करता। अनुवाद उसी अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
- issue: मसीही उपाधि ὁ ἅγιος τοῦ θεοῦ
  choice: ‘परमेश्वर के पवित्र जन’ के रूप में बिना धर्मसैद्धान्तिक विस्तार के रखा गया।
  alternative: इसे स्पष्ट रूप से ‘मसीहा’ या ‘परमेश्वर द्वारा अभिषिक्त पवित्र जन’ कहा जा सकता था।
  rationale: पद में यह एक महत्वपूर्ण मसीही उपाधि है, किन्तु उसके पूरे सिद्धान्तगत अर्थ की व्याख्या इसी वाक्य में नहीं की गई। इसलिए उपाधि को यथासम्भव पारदर्शी रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सम्बोधन और प्रश्नों की तीव्रता बनी रहती है। ‘दुष्टात्मा’ जैसे व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए, और बहुवचन ‘हमें’ की अस्पष्टता सुरक्षित रखी गई है।
