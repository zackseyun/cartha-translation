source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: hi
  text: 'और उत्तर देते हुए [यीशु ने उससे कहा], “लिखा है: ‘तू अपने परमेश्वर प्रभु की आराधना[a] कर और केवल उसी की सेवा कर।’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “अपने परमेश्वर प्रभु को दण्डवत् कर।”
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण व्यवस्थाविवरण 6:13 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यूनानी कृदन्त और मुख्य क्रिया को स्वाभाविक हिन्दी कथन में समेटते हुए उत्तर देने का भाव और अप्रत्यक्ष कर्म दोनों सुरक्षित रखे गए हैं।
- source_word: Γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है और पूर्णकाल में निहित स्थायी प्रामाणिकता को सहज हिन्दी में व्यक्त करता है।
- source_word: Κύριον τὸν θεόν σου
  choice: प्रभु अपने परमेश्वर
  rationale: κύριος के लिए ‘प्रभु’ और θεός के लिए ‘परमेश्वर’ रखकर यूनानी पाठ तथा वाचा-संबंधी ‘अपने’ को सीधे व्यक्त किया गया है।
- source_word: προσκυνήσεις
  choice: आराधना कर
  rationale: इस प्रसंग में क्रिया परमेश्वर के प्रति धार्मिक नमन और भक्ति को सूचित करती है; ‘आराधना’ उसका प्रसंगानुकूल अर्थ स्पष्ट करती है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: λατρεύσεις
  choice: सेवा कर
  rationale: यह देवता को दी जाने वाली धार्मिक सेवा का बोध कराती है। ‘सेवा कर’ स्वाभाविक है और आराधना के निकट संदर्भ से इसका पवित्र अर्थ बना रहता है।
- source_word: αὐτῷ μόνῳ
  choice: केवल उसी की
  rationale: ‘केवल’ को ‘उसी’ के साथ रखकर सेवा के एकमात्र पात्र पर यूनानी बल और अनन्यता सुरक्षित रखी गई है।
theological_decisions:
- issue: परमेश्वर के लिए प्रयुक्त κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: नए नियम का उपलब्ध यूनानी पाठ κύριος कहता है। ‘प्रभु’ उसके धार्मिक और शास्त्रीय भार को बनाए रखता है, जबकि ‘यहोवा’ अन्तर्निहित इब्रानी पाठ को सीधे नए नियम के मुख्य पाठ में ले आता और ‘स्वामी’ यहाँ अपेक्षाकृत दुर्बल होता।
- issue: προσκυνέω में शारीरिक नमन और आराधना का संबंध
  choice: मुख्य पाठ में ‘आराधना कर’
  alternative: ‘दण्डवत् कर’
  rationale: परीक्षा और परमेश्वर के प्रति अनन्य निष्ठा के प्रसंग में धार्मिक आराधना प्रमुख है; फिर भी क्रिया में निहित झुकने का मूर्त भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। उद्धरण में ‘तू’ शास्त्रीय आज्ञा के एकवचन रूप को बनाए रखता है; सामान्य कथन में अनावश्यक पुरातन शब्दावली से बचा गया है।
