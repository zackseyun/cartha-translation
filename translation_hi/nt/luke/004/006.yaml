  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: hi
  text: और शैतान ने उससे कहा, “मैं तुम्हें यह सारा अधिकार और उनका वैभव[a] दूँगा, क्योंकि यह मुझे सौंपा गया है, और मैं इसे जिसे चाहता हूँ उसे देता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी महिमा।” यूनानी शब्द इस प्रसंग में महिमा, वैभव या भव्यता का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: शैतान
  rationale: इस परीक्षा-वृत्तांत में यह एक व्यक्तिगत पदनाम है। आधुनिक हिन्दी में ‘शैतान’ साधारण पाठकों के लिए स्वाभाविक और स्पष्ट है; व्युत्पत्तिगत अर्थ ‘निन्दक’ यहाँ अभिप्रेत व्यक्ति को उतनी स्पष्टता से नहीं बताता।
- source_word: Σοὶ δώσω
  choice: मैं तुम्हें ... दूँगा
  rationale: आरम्भ में आए Σοί का बल ‘तुम्हें’ पर है। हिन्दी की स्वाभाविक शब्द-रचना में ‘मैं तुम्हें’ इस बल को पर्याप्त रूप से व्यक्त करती है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ शब्द शासन करने के अधिकार या प्रभुत्व को दर्शाता है, केवल सामर्थ्य को नहीं; इसलिए ‘अधिकार’ उपयुक्त है।
- source_word: ταύτην ἅπασαν
  choice: यह सारा
  rationale: संकेतवाचक और समग्रतासूचक शब्दों के मेल को स्वाभाविक हिन्दी में ‘यह सारा’ व्यक्त करता है।
- source_word: δόξαν αὐτῶν
  choice: उनका वैभव
  rationale: αὐτῶν पिछले पद में दिखाए गए राज्यों की ओर संकेत करता है। इस प्रसंग में δόξα उनकी चकाचौंध, प्रतिष्ठा और भव्यता को दर्शाता है; ‘वैभव’ आधुनिक हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παραδέδοται
  choice: मुझे सौंपा गया है
  rationale: पूर्णकालिक कर्मवाच्य पहले किए गए कार्य के वर्तमान परिणाम को बनाए रखता है। ‘सौंपा गया है’ इस रूप को सुरक्षित रखता है और दावे की वैधता पर कोई अतिरिक्त निर्णय नहीं देता।
- source_word: ᾧ ἂν θέλω
  choice: जिसे चाहता हूँ
  rationale: यह अनिश्चित सम्बन्धवाचक अभिव्यक्ति शैतान के इच्छानुसार किसी को देने के दावे को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: δίδωμι αὐτήν
  choice: मैं इसे ... देता हूँ
  rationale: वर्तमान काल सामान्य या प्रचलित क्रिया का बोध देता है; हिन्दी का सामान्य वर्तमान ‘देता हूँ’ इसे ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: क्या अनुवाद शैतान के इस दावे का समर्थन करता हुआ दिखाई दे कि राज्यों का अधिकार उसके पास है
  choice: वचन को शैतान के सीधे कथन के रूप में बिना किसी सम्पादकीय विशेषण के प्रस्तुत किया गया है।
  alternative: ‘वह दावा करता है’ जैसे दूरी बनाने वाले शब्द जोड़ना।
  rationale: यूनानी पाठ इसे शैतान का प्रत्यक्ष कथन बनाता है। अनुवाद को न तो उसके दावे की पुष्टि करनी चाहिए, न उसे मूल पाठ से अधिक कमजोर करना चाहिए; वक्ता की पहचान ही आवश्यक कथात्मक दूरी देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘वैभव’ प्रसंगगत अर्थ को मुख्य पाठ में स्पष्ट करता है, जबकि पाद-टिप्पणी ‘महिमा’ वाला अधिक शाब्दिक विकल्प सुरक्षित रखती है।
