base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: hi
  text: पर वह उनके बीच से निकलकर अपने रास्ते चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: वह
  rationale: यूनानी में कर्ता-सर्वनाम स्पष्ट और कुछ बलयुक्त है। हिन्दी में ‘वह’ स्वाभाविक है; ‘वह स्वयं’ यहाँ आवश्यकता से अधिक बल देता।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में भीड़ के हिंसक इरादे और यीशु के सुरक्षित चले जाने के बीच हल्का विरोध प्रकट करता है।
- source_word: διελθὼν
  choice: निकलकर
  rationale: अओरिस्ट कृदन्त समूह के बीच से होकर आगे जाने की क्रिया बताता है। ‘निकलकर’ मुख्य क्रिया से पहले हुई संबद्ध गति को सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ μέσου αὐτῶν
  choice: उनके बीच से
  rationale: यह समूह के मध्य से होकर जाने का स्थानिक अर्थ बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπορεύετο
  choice: अपने रास्ते चला गया
  rationale: अपूर्णकालिक रूप आगे बढ़ते रहने की गति प्रस्तुत करता है। यह वाक्यांश केवल ‘गया’ की तुलना में अपनी राह पर आगे चले जाने का भाव अधिक स्पष्ट करता है।
theological_decisions:
- issue: क्या पद को चमत्कारी बच निकलने का संकेत स्पष्ट रूप से देना चाहिए या वर्णनात्मक रूप से तटस्थ रहना चाहिए
  choice: 'वर्णनात्मक रूप से तटस्थ: ‘उनके बीच से निकलकर अपने रास्ते चला गया’'
  alternative: ‘चमत्कारिक रूप से उनके बीच से निकल गया’ जैसे शब्दों से अलौकिक रीति स्पष्ट करना
  rationale: यूनानी पाठ बताता है कि यीशु उनके मध्य से होकर चले गए, पर यह नहीं बताता कि ऐसा कैसे हुआ। तटस्थ भाषा पाठ की धार्मिक तनाव और वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य संक्षिप्त रखा गया है और मूल की वर्णनात्मक तटस्थता सुरक्षित है।
