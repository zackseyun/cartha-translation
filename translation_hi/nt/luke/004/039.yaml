source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: hi
  text: और उसके ऊपर खड़े होकर उसने ज्वर को डाँटा, और ज्वर ने उसे छोड़ दिया। वह तुरंत उठी और उनकी सेवा करने लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: उसके पास खड़े होकर
  rationale: यह वाक्यांश यीशु की स्त्री के निकट खड़े होने की स्थिति बताता है। शाब्दिक ‘उसके ऊपर खड़े होकर’ आधुनिक हिन्दी में अनचाहा भयावह भाव दे सकता है; ‘उसके पास खड़े होकर’ दृश्य और निकटता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: ज्वर को डाँटा
  rationale: क्रिया यीशु के अधिकारपूर्ण सम्बोधन को व्यक्त करती है और ज्वर को सीधे उसका कर्म बनाती है। ‘डाँटा’ इस असामान्य लेकिन जानबूझकर प्रयुक्त अभिव्यक्ति को बनाए रखता है।
- source_word: ἀφῆκεν αὐτήν
  choice: ज्वर उसे छोड़ गया
  rationale: यूनानी में कर्ता व्यक्त नहीं है, पर निकटतम प्रसंग में ज्वर ही निहित कर्ता है। संज्ञा को दोहराने से हिन्दी में अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह चंगाई और उसके बाद की प्रतिक्रिया की तात्कालिकता को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναστᾶσα
  choice: उठी
  rationale: यह कृदन्त चंगाई के बाद स्त्री के तत्काल उठने को बताता है; सरल भूतकाल हिन्दी में स्वाभाविक है।
- source_word: διηκόνει αὐτοῖς
  choice: उनकी सेवा करने लगी
  rationale: अपूर्ण भूतकाल सेवा के आरम्भ और जारी रहने का संकेत दे सकता है। ‘सेवा करने लगी’ इस आरम्भिक पक्ष को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ज्वर को डाँटने की भाषा से मानवीकरण या दुष्टात्मिक कारण का संकेत
  choice: ‘ज्वर को डाँटा’ को सीधे बनाए रखा गया
  alternative: ‘ज्वर को दूर होने की आज्ञा दी’ या बीमारी को दुष्टात्मा के रूप में स्पष्ट करना
  rationale: यूनानी पाठ ज्वर को डाँटे जाने वाली वस्तु के रूप में प्रस्तुत करता है, पर यह नहीं बताता कि ज्वर दुष्टात्मा था। सीधी अभिव्यक्ति यीशु के अधिकार को सुरक्षित रखती है और बीमारी के कारण के बारे में अतिरिक्त सिद्धान्त नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘ज्वर’ बाइबिलीय गरिमा बनाए रखते हुए व्यापक रूप से समझा जाने वाला शब्द है।
