base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: hi
  text: और हर प्रलोभन पूरा कर लेने के बाद, शैतान उचित समय तक यीशु से दूर हट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντελέσας
  choice: जब ... पूरी कर चुका
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले पूर्ण हुई क्रिया बताता है। यह रूप हिन्दी में कालगत सम्बन्ध को स्वाभाविक और स्पष्ट रखता है।
- source_word: πάντα πειρασμόν
  choice: हर परीक्षा
  rationale: एकवचन के साथ πᾶς यहाँ समस्त प्रलोभनों की व्यापकता व्यक्त करता है। हिन्दी में ‘हर परीक्षा’ स्वाभाविक है और ‘परीक्षा’ में जाँच तथा प्रलोभन, दोनों की सम्भावित अर्थच्छाया बनी रहती है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: लूका के प्रसंग में यह व्यक्तिगत अलौकिक विरोधी का प्रचलित हिन्दी नाम है।
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: यीशु से दूर चला गया
  rationale: क्रिया किसी से हटने या दूर चले जाने को व्यक्त करती है। सर्वनाम के स्थान पर ‘यीशु’ रखने से हिन्दी में सन्दर्भ स्पष्ट और प्रवाह स्वाभाविक रहता है।
- source_word: ἄχρι καιροῦ
  choice: एक अनुकूल समय तक
  rationale: καιρός केवल सामान्य समय नहीं, बल्कि उपयुक्त या अवसरपूर्ण समय सूचित कर सकता है; यह अनुवाद शैतान के हटने की अस्थायी और रणनीतिक प्रकृति बनाए रखता है।
theological_decisions:
- issue: 'πειρασμός का अर्थ: परीक्षा या प्रलोभन'
  choice: परीक्षा
  alternative: प्रलोभन
  rationale: यूनानी शब्द जाँच/परीक्षा और बुराई की ओर लुभाने वाले प्रलोभन, दोनों को व्यक्त कर सकता है। यहाँ शैतान की भूमिका ‘प्रलोभन’ को सन्दर्भगत रूप से बल देती है, पर घटना यीशु की परख भी है। मुख्य पाठ में व्यापक ‘परीक्षा’ और पादटिप्पणी में ‘प्रलोभन’ रखकर वास्तविक अर्थगत तनाव सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘जब ... चुका’ कृदन्त का स्वाभाविक हिन्दी रूप है और ‘एक अनुकूल समय तक’ मूल के अस्थायी, अवसर-सापेक्ष भाव को सुरक्षित रखता है।
