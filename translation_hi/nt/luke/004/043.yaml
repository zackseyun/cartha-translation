id: LUK.4.43
reference: Luke 4:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “मुझे दूसरे नगरों में भी परमेश्वर के राज्य का शुभ समाचार सुनाना ही है[a], क्योंकि मुझे इसी उद्देश्य से भेजा गया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुभ समाचार का प्रचार करना आवश्यक है।”
    reason: εὐαγγελίζω के लिए ‘प्रचार करना’ एक सम्भव पारंपरिक विकल्प है; मुख्य पाठ का ‘सुनाना’ अधिक सामान्य और सहज हिन्दी है।
  - marker: b
    text: या “क्योंकि इसी के लिए मुझे भेजा गया है।”
    reason: ἐπὶ τοῦτο का अधिक शाब्दिक और संक्षिप्त रूप दिया गया है; दोनों रूप प्रयोजन का भाव रखते हैं।
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: पर उसने उनसे कहा
  rationale: δέ यहाँ भीड़ की इच्छा के विपरीत यीशु के उत्तर में हल्का विरोध प्रकट करता है; इसलिए ‘पर’ प्रसंगानुकूल है।
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: दूसरे नगरों में भी
  rationale: καί का योगात्मक भाव ‘भी’ से और ἑτέραις का वर्तमान स्थान से भिन्न स्थानों का भाव ‘दूसरे’ से स्वाभाविक रूप में व्यक्त होता है। πόλις के लिए ‘नगर’ व्यापक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: εὐαγγελίσασθαί
  choice: शुभ समाचार सुनाना
  rationale: εὐαγγελίζω का मूल भाव शुभ समाचार की घोषणा करना है। ‘शुभ समाचार सुनाना’ सामान्य पाठक के लिए सहज है और केवल कलीसियाई पारिभाषिक शब्दावली तक सीमित नहीं होता।
- source_word: δεῖ
  choice: सुनाना ही है
  rationale: δεῖ की प्रबल आवश्यकता को हिन्दी में स्वाभाविक ढंग से ‘ही है’ व्यक्त करता है; इससे मिशन की अनिवार्यता बनी रहती है, पर उसके स्रोत को अनावश्यक रूप से नहीं खोला जाता।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: यह लूका का प्रमुख धर्मवैज्ञानिक पदबंध है। ‘परमेश्वर का राज्य’ राज्य और शासन—दोनों संभावित आयामों को बिना सीमित किए पारंपरिक और स्पष्ट रूप में बनाए रखता है।
- source_word: ἐπὶ τοῦτο
  choice: इसी उद्देश्य से
  rationale: यह पदबंध प्रयोजन या लक्ष्य बताता है। ‘इसी उद्देश्य से’ हिन्दी में स्पष्ट है और τοῦτο के संकेतात्मक बल को भी व्यक्त करता है।
- source_word: ἀπεστάλην
  choice: मुझे ... भेजा गया है
  rationale: कर्मवाच्य रूप मिशन और प्रेषण का भाव बनाए रखता है तथा मुख्य पाठ में भेजने वाले का नाम जोड़कर निहितार्थ को स्पष्ट सिद्धांत में नहीं बदलता।
theological_decisions:
- issue: यीशु के मिशन की अनिवार्यता
  choice: ‘मुझे ... सुनाना ही है’ के द्वारा प्रबल, मिशन-संबंधी आवश्यकता को बनाए रखा गया है।
  alternative: ‘मेरे लिए ... सुनाना आवश्यक है’ या केवल ‘मुझे ... सुनाना है’।
  rationale: लूका में δεῖ प्रायः ईश्वरीय योजना से जुड़ी आवश्यकता व्यक्त करता है। ‘ही है’ इस बल को स्वाभाविक हिन्दी में रखता है, पर मुख्य पाठ में ‘परमेश्वर की इच्छा के अनुसार’ जैसा विस्तार नहीं जोड़ता।
- issue: भेजने वाले की पहचान
  choice: कर्मवाच्य ‘मुझे ... भेजा गया है’ को यथावत रखा गया है।
  alternative: ‘परमेश्वर ने मुझे भेजा है।’
  rationale: प्रसंग में परमेश्वर भेजने वाले के रूप में निहित हो सकते हैं, किन्तु यूनानी वाक्य उनका स्पष्ट नाम नहीं लेता। अनुवाद इस निहितार्थ और अस्पष्टता दोनों को सुरक्षित रखता है।
- issue: परमेश्वर के राज्य का आशय
  choice: स्थिर पदबंध ‘परमेश्वर का राज्य’ रखा गया है।
  alternative: ‘परमेश्वर का शासन’।
  rationale: βασιλεία में शासन और राज्य-क्षेत्र दोनों के आयाम हो सकते हैं। केवल ‘शासन’ चुनना अर्थ को संकरा कर सकता है; ‘राज्य’ पाठ की धर्मवैज्ञानिक व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्वर अपनाया गया है। ‘परमेश्वर का राज्य’ जैसे केंद्रीय बाइबिलीय पदबंध को बनाए रखते हुए वाक्य-रचना को सामान्य पाठक के लिए सहज रखा गया है।
