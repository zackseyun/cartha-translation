- issue: जंगल में यीशु के अनुभव के लिए πειραζόμενος का अनुवाद
  choice: परखता रहा
  alternative: प्रलोभन देता रहा
  rationale: यूनानी क्रिया ‘परखने’ और ‘प्रलोभन देने’ दोनों का अर्थ दे सकती है। मुख्य पाठ में व्यापक ‘परखना’ रखा गया है और शैतान के शत्रुतापूर्ण नैतिक प्रलोभन का संभावित भाव पादटिप्पणी में सुरक्षित है; इस प्रकार पाठ theological तनाव को अनावश्यक रूप से हल नहीं करता।
