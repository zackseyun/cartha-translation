    text: या, “उसकी परीक्षा लेता रहा।” यूनानी क्रिया का अर्थ “प्रलोभित करना” या “परीक्षा लेना” दोनों हो सकता है; यहाँ शैतान कर्ता है, इसलिए “प्रलोभित करना” संदर्भ में अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: चालीस दिन तक
  rationale: समय-अवधि बताने वाले कर्मकारक को स्वाभाविक हिन्दी में ‘तक’ से व्यक्त किया गया है।
- source_word: πειραζόμενος
  choice: परखता रहा
  rationale: πειράζω में ‘परखना’ और ‘प्रलोभन देना’ दोनों अर्थ संभव हैं। हिन्दी में ‘शैतान उसे परखता रहा’ प्रसंग की विरोधी भूमिका को बनाए रखते हुए शब्द की वास्तविक अर्थगत अस्पष्टता भी सुरक्षित रखता है।
- source_word: ὑπὸ τοῦ διαβόλου
  choice: शैतान
  rationale: διάβολος यहाँ एक पहचाने हुए व्यक्तिगत विरोधी की उपाधि है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘शैतान’ स्पष्ट और स्वाभाविक है। सक्रिय वाक्य-विन्यास में वही कर्ता बनाया गया है।
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: उसने कुछ भी नहीं खाया
  rationale: ‘कुछ भी नहीं’ यूनानी के प्रबल निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: यह हिन्दी में उस पूरी अवधि का संक्षिप्त और स्वाभाविक समय-सूचक रूप है।
- source_word: συντελεσθεισῶν αὐτῶν
  choice: जब वे दिन पूरे हुए
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्पष्ट कालवाचक उपवाक्य में बदला गया है; ‘पूरे हुए’ συντελέω के पूर्ण होने के भाव को बनाए रखता है।
- source_word: ἐπείνασεν
  choice: उसे भूख लगी
  rationale: यह भूख के अनुभव अथवा आरम्भ को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी मुहावरा है।
