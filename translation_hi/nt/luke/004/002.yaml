  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: hi
  text: चालीस दिन तक शैतान उसे प्रलोभित करता[a] रहा। उन दिनों उसने कुछ भी नहीं खाया, और जब वे दिन पूरे हुए, तो उसे भूख लगी।
  philosophy: optimal-equivalence
  footnotes:
