  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: hi
  text: और वह उनके आराधनालयों में शिक्षा देता था, और सब लोग उसकी महिमा करते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब लोग उसकी प्रशंसा करते थे” अथवा “सब लोग उसका सम्मान करते थे।” यूनानी शब्द δοξαζόμενος का अर्थ सार्वजनिक रूप से प्रशंसा या सम्मान करना भी हो सकता है; “महिमा करते थे” मूल शब्द के महिमा-सम्बन्धी भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले वर्णन से पद को जोड़ता है और कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: αὐτὸς
  choice: वह
  rationale: यूनानी में सर्वनाम स्पष्ट है और हल्का बल दे सकता है; हिन्दी में ‘वह’ स्वाभाविक रूप से यीशु की ओर संकेत करता है, जबकि ‘वह स्वयं’ अनावश्यक रूप से बल बढ़ा देता।
- source_word: ἐδίδασκεν
  choice: शिक्षा देता था
  rationale: अपूर्ण भूतकालीन क्रिया जारी या प्रथागत कार्य को व्यक्त करती है; यह रूप उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: उनकी आराधनालयों में
  rationale: यह स्थानसूचक वाक्यांश है। ‘आराधनालय’ आधुनिक हिन्दी में यहूदी सभा और उसके स्थान के लिए समझ में आने वाला पद है; ‘उनकी’ यूनानी संबंधवाचक सर्वनाम को सुरक्षित रखता है।
- source_word: δοξαζόμενος
  choice: उसकी महिमा करते थे
  rationale: δοξάζω में महिमा करने, सम्मान देने या प्रशंसा करने का अर्थ हो सकता है। सक्रिय हिन्दी संरचना कर्मवाच्य कृदंत का आशय सहज रूप से व्यक्त करती है और ‘महिमा’ से मूल शब्द का गौरव-संबंधी बल सुरक्षित रहता है।
- source_word: ὑπὸ πάντων
  choice: सब लोग
  rationale: ὑπό के साथ संबंधकारक कर्ता को सूचित करता है। हिन्दी की सक्रिय संरचना में ‘सब लोग’ उसी व्यापक सार्वजनिक प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु के संबंध में δοξαζόμενος का अनुवाद
  choice: सब लोग उसकी महिमा करते थे
  alternative: सब लोग उसकी प्रशंसा करते थे / सब लोग उसका सम्मान करते थे
  rationale: संदर्भ में शब्द यीशु की शिक्षा के प्रति व्यापक अनुकूल सार्वजनिक प्रतिक्रिया बताता है। ‘महिमा करते थे’ δοξάζω के अधिक प्रबल और लूका के महिमा-विषयक शब्द-सम्बन्ध को बनाए रखता है, जबकि पादटिप्पणी उसके सामान्य सामाजिक अर्थ—प्रशंसा या सम्मान—को स्पष्ट करती है और पूर्ण विकसित धर्मवैज्ञानिक दावा आरोपित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। निरंतर भूतकाल के लिए ‘शिक्षा देता था’ चुना गया है। दूसरे खंड में शाब्दिक कर्मवाच्य ‘सबके द्वारा महिमा पाया जाता था’ के बजाय स्वाभाविक सक्रिय रचना अपनाई गई है, अर्थ और व्यापक कर्तृत्व दोनों सुरक्षित रखते हुए।
