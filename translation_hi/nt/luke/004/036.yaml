  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: hi
  text: तब सब पर विस्मय छा गया, और वे आपस में बातें कर रहे थे, “यह कैसा वचन[a] है कि वह अधिकार और सामर्थ्य के साथ अशुद्ध आत्माओं को आज्ञा देता है, और वे निकल जाती हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह कैसी बात है?” यूनानी शब्द लोगोस का अर्थ “वचन,” “संदेश,” या “बात” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: विस्मय
  rationale: यह शब्द गहरे आश्चर्य और स्तब्धता का भाव व्यक्त करता है; ‘विस्मय’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: सब पर विस्मय छा गया
  rationale: यह स्वाभाविक हिन्दी मुहावरा उस यूनानी रचना का भाव बनाए रखता है जिसमें विस्मय लोगों पर आ पड़ता है।
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: वे आपस में कह रहे थे
  rationale: अपूर्ण भूतकाल जारी पारस्परिक बातचीत को दिखाता है; यह अनुवाद बिना औपचारिक चर्चा का अर्थ जोड़े उस निरंतरता को व्यक्त करता है।
- source_word: Τίς ὁ λόγος οὗτος
  choice: यह कैसा वचन है
  rationale: λόγος यहाँ बोले गए वचन, संदेश या बात की ओर संकेत कर सकता है। ‘वचन’ यीशु की प्रभावशाली उक्ति से संबंध बनाए रखता है, जबकि ‘कैसा’ विस्मयपूर्ण प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: अधिकार और सामर्थ्य के साथ
  rationale: यह क्रम यूनानी पाठ का अनुसरण करते हुए वैध अधिकार और प्रभावकारी शक्ति, दोनों को अलग-अलग बनाए रखता है।
- source_word: ἐπιτάσσει
  choice: आज्ञा देता है
  rationale: यह वर्तमानकालीन, सजीव कथन को बनाए रखते हुए आदेश देने का स्पष्ट अर्थ व्यक्त करता है।
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: अशुद्ध आत्माओं
  rationale: ‘अशुद्ध’ यूनानी शब्द का सीधा अर्थ और सुसमाचारों की शुद्धता-संबंधी पृष्ठभूमि बनाए रखता है; ‘आत्माओं’ अलौकिक प्राणियों के कथात्मक संदर्भ को स्पष्ट रखता है।
- source_word: ἐξέρχονται
  choice: वे निकल जाती हैं
  rationale: यह व्यक्तियों में से आत्माओं के बाहर आने के लिए स्वाभाविक हिन्दी है और यूनानी वर्तमानकाल की सजीवता को बनाए रखता है।
theological_decisions:
- issue: झाड़-फूँक के प्रसंग में दुष्ट आत्मिक प्राणियों का वर्णन
  choice: अशुद्ध आत्माओं
  alternative: अपवित्र आत्माओं
  rationale: यह चयन कथानक के अलौकिक आशय और यूनानी शुद्धता-संबंधी शब्दावली को बनाए रखता है, उसे मनोवैज्ञानिक रूपक में नहीं बदलता।
- issue: ἐξουσία और δύναμις के बीच भेद
  choice: अधिकार और सामर्थ्य
  alternative: शक्ति और अधिकार
  rationale: दोनों संज्ञाओं को अलग रखकर पाठ में उपस्थित वैध अधिकार और प्रभावकारी सामर्थ्य के तनाव को सुरक्षित रखा गया है तथा मूल क्रम भी बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण रखी गई है। ‘सब पर विस्मय छा गया’ मूल मुहावरे का प्रभाव बचाता है, और प्रश्न में ‘यह कैसा वचन है’ स्वाभाविक हिन्दी के साथ λόγος की अर्थगत व्यापकता बनाए रखता है।
