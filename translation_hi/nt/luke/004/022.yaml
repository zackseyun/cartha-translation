source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: hi
  text: और सब लोग उसके विषय में अच्छी बातें कह रहे थे[a] और उसके मुँह से निकलनेवाले अनुग्रह से भरे वचनों[b] पर अचम्भा कर रहे थे। वे कह रहे थे, “क्या यह यूसुफ का बेटा नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके पक्ष में गवाही दे रहे थे।’ यूनानी पदबंध का अर्थ उसके विषय में अनुकूल बातें कहना अथवा उसके पक्ष में साक्षी देना—दोनों हो सकता है। इस प्रसंग में साथ आया ‘अचम्भा कर रहे थे’ अनुकूल अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अनुग्रह के वचन’; अर्थात ऐसे वचन जिनमें अनुग्रह, कृपा या मनोहरता थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: उसके विषय में अच्छी बातें कह रहे थे
  rationale: यूनानी पदबंध का अर्थ उसके पक्ष में गवाही देना या उसके विषय में अनुकूल बातें कहना हो सकता है। यहाँ ‘अचम्भा कर रहे थे’ के साथ प्रयुक्त होने के कारण अनुकूल प्रतिक्रिया का भाव प्रमुख है; यह हिंदी रूप सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἐθαύμαζον
  choice: अचम्भा कर रहे थे
  rationale: अपूर्ण भूतकाल लगातार चल रही प्रतिक्रिया दिखाता है। ‘अचम्भा कर रहे थे’ विस्मय का भाव बनाए रखता है, पर उसे केवल भय या स्तब्धता तक सीमित नहीं करता।
- source_word: ἐπὶ τοῖς λόγοις
  choice: वचनों पर
  rationale: ἐπί और चतुर्थी यहाँ उनके अचम्भे के आधार या अवसर को सूचित करते हैं। ‘वचनों पर अचम्भा’ हिंदी में स्वाभाविक है।
- source_word: τῆς χάριτος
  choice: अनुग्रह से भरे
  rationale: सम्बन्धकारक पद वचनों के गुण को प्रकट कर सकता है—वे अनुग्रह, कृपा या मनोहरता से चिह्नित थे। ‘अनुग्रह से भरे’ मूल धार्मिक और भावात्मक विस्तार को खुला रखता है।
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: उसके मुँह से निकलनेवाले
  rationale: यह कृदन्तीय पद ‘वचनों’ का विशेषण है और उनके स्रोत की ठोस छवि बनाए रखता है।
- source_word: Οὐχὶ
  choice: क्या ... नहीं है?
  rationale: Οὐχί ऐसी प्रश्नवाचक रचना आरम्भ करता है जिसमें सकारात्मक उत्तर की अपेक्षा है। हिंदी की ‘क्या ... नहीं है?’ रचना इस आलंकारिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: यह यूसुफ का बेटा ... है
  rationale: सम्बन्धकारक Ἰωσήφ को सहज स्वामित्वसूचक हिंदी में व्यक्त किया गया है। ‘बेटा’ भीड़ की सामान्य बोलचाल के अनुकूल है।
theological_decisions:
- issue: कुँवारी से गर्भधारण के प्रकाश में यीशु को यूसुफ का बेटा कहना
  choice: भीड़ के कथन को बिना किसी योग्यता या स्पष्टीकरण के सीधे ‘यूसुफ का बेटा’ अनूदित किया गया है।
  alternative: ऐसा व्याख्यात्मक शब्द जोड़ना जिससे स्पष्ट हो कि यह केवल भीड़ की धारणा थी।
  rationale: यह कथन भीड़ की समझ को प्रस्तुत करता है, कथावाचक की धर्मवैज्ञानिक पुष्टि को नहीं। अनुवाद में स्पष्टीकरण जोड़ने से मूल पाठ का नाटकीय और धर्मवैज्ञानिक तनाव अनावश्यक रूप से समाप्त हो जाता।
- issue: τῆς χάριτος में ‘अनुग्रह’ और ‘मनोहरता’ का अर्थ-विस्तार
  choice: मुख्य पाठ में ‘अनुग्रह से भरे वचन’ रखा गया है।
  alternative: ‘मनोहर वचन’ या केवल ‘कृपापूर्ण वचन’।
  rationale: ‘अनुग्रह’ लूका की भाषा में संभव धर्मवैज्ञानिक प्रतिध्वनि को सुरक्षित रखता है, जबकि ‘से भरे’ इन वचनों के आकर्षक और अनुकूल गुण को भी व्यक्त कर सकता है। पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ बाइबलीय प्रसंग के अनुकूल है, जबकि ‘बेटा’ भीड़ के सीधे प्रश्न की स्वाभाविकता बनाए रखता है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
