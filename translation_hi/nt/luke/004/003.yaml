source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: hi
  text: तब शैतान ने उससे कहा, “यदि तुम परमेश्वर के पुत्र हो,[a] तो इस पत्थर से कहो कि यह रोटी बन जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम परमेश्वर के पुत्र हो।” यूनानी शर्त को इस चुनौती के लिए आधार-वाक्य को स्वीकार करके कही गई बात के रूप में भी समझा जा सकता है; मुख्य पाठ शर्तवाचक रूप को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; यहाँ ‘तब’ घटनाक्रम की प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: इस प्रसंग में यह परमेश्वर के विरोधी व्यक्ति का प्रचलित पदनाम है। आधुनिक हिन्दी बाइबलीय भाषा में ‘शैतान’ स्पष्ट और स्वाभाविक है; ‘निंदक’ जैसी व्युत्पत्तिपरक संज्ञा यहाँ कृत्रिम होगी।
- source_word: Εἰ
  choice: यदि
  rationale: ‘यदि’ यूनानी शर्तवाचक रूप को बनाए रखता है और परीक्षा के कथन में निहित तनाव को समय से पहले हल नहीं करता।
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: इस मसीही प्रसंग में विधेय पद गुणात्मक/निश्चित अर्थ रखता है; इसलिए इसे अनिश्चित ‘परमेश्वर के एक पुत्र’ नहीं बनाया गया।
- source_word: εἰπὲ τῷ λίθῳ τούτῳ
  choice: इस पत्थर से कहो
  rationale: λέγω का मूल वाचिक अर्थ सुरक्षित रखते हुए हिन्दी में संबोधित वस्तु के साथ ‘से कहो’ स्वाभाविक है; ‘आज्ञा दो’ मूल क्रिया से अधिक व्याख्यात्मक और प्रबल होता।
- source_word: ἵνα γένηται
  choice: कि यह ... बन जाए
  rationale: ἵνα और संभावनार्थक क्रिया के आशय को हिन्दी की स्वाभाविक कथन-विषयक रचना में व्यक्त किया गया है। ‘यह’ पत्थर को स्पष्ट रूप से संदर्भित करता है।
- source_word: ἄρτος
  choice: रोटी
  rationale: यह सामान्य खाद्य ‘ब्रेड/रोटी’ को दर्शाता है; ‘रोटी का टुकड़ा’ या ‘भोजन’ मूल से क्रमशः अधिक विशिष्ट या अधिक व्यापक होते।
theological_decisions:
- issue: εἰ υἱὸς εἶ τοῦ θεοῦ की शर्त का बल
  choice: यदि तुम परमेश्वर के पुत्र हो
  alternative: क्योंकि तुम परमेश्वर के पुत्र हो / जब तुम परमेश्वर के पुत्र हो ही
  rationale: मुख्य पाठ यूनानी के प्रत्यक्ष शर्तवाचक रूप को सुरक्षित रखता है। पादटिप्पणी बताती है कि चुनौती में वक्ता आधार-वाक्य को तर्क के लिए मानकर भी चल सकता है; इस प्रकार यीशु के पुत्रत्व को नकारे बिना कथात्मक और धर्मवैचारिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर के पुत्र’ स्थापित बाइबलीय पद है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक हिन्दी में है।
