id: LUK.4.25
reference: Luke 4:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: hi
  text: पर मैं तुमसे सच कहता हूँ, एलिय्याह के दिनों में इस्राएल में बहुत-सी विधवाएँ थीं। उस समय आकाश तीन वर्ष और छः महीने तक बन्द रहा और सारे देश में बड़ा अकाल पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: सच
  rationale: यह वाक्यांश कथन की सत्यता पर बल देता है; ‘सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: χῆραι
  choice: विधवाएँ
  rationale: यूनानी बहुवचन का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: आकाश ... बन्द रहा
  rationale: मूल के निष्क्रिय रूप और वर्षा रुकने की चित्रात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: λιμὸς μέγας
  choice: बड़ा अकाल
  rationale: तीव्रता और घटना, दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: सारे देश में
  rationale: सन्दर्भ में γῆ का आशय इस्राएल की पूरी भूमि/देश से है; ‘सारी पृथ्वी’ यहाँ अनावश्यक वैश्विक अर्थ दे सकता है।
theological_decisions:
- issue: अकाल के भौगोलिक विस्तार का अर्थ
  choice: सारे देश में
  alternative: सारी धरती पर
  rationale: γῆ ‘भूमि’, ‘देश’ या ‘धरती’ हो सकता है। निकटवर्ती सन्दर्भ इस्राएल की भूमि की ओर संकेत करता है, इसलिए स्थानीय अर्थ चुना गया, बिना किसी साम्प्रदायिक व्याख्या को आयात किए।
- issue: आकाश बन्द होने का कर्ता
  choice: निष्क्रिय अभिव्यक्ति बनाए रखी गई
  alternative: परमेश्वर ने आकाश बन्द कर दिया
  rationale: मूल पाठ कर्ता का स्पष्ट नाम नहीं लेता; हिन्दी में भी उसे न जोड़कर मूल की निहित ईश्वरीय क्रिया और अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, मौखिक कथन के अनुकूल और गरिमापूर्ण। ‘छः’ पारंपरिक शुद्ध वर्तनी में रखा गया है।
