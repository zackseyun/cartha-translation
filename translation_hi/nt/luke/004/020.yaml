source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: hi
  text: फिर उसने ग्रंथ[a] को लपेटकर परिचारक[b] को वापस दिया और बैठ गया। सभा-घर में उपस्थित सब लोगों की आँखें उसी पर टिकी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पुस्तक।’ यूनानी शब्द किसी लिखित दस्तावेज़ के लिए सामान्य रूप से भी प्रयुक्त हो सकता है; पर उस समय सभा-घर में पढ़ा जाने वाला ग्रंथ लपेटी हुई ग्रंथ-पांडुलिपि (स्क्रॉल) होता था।
    reason: lexical_alternative
  - marker: b
    text: अर्थात सभा-घर का वह परिचारक जो ग्रंथों को सँभालता और सभा की सेवा में सहायता करता था।
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: लपेटकर
  rationale: यह क्रिया उस ग्रंथ को फिर से लपेटने का संकेत देती है जो कुण्डली के रूप में था; इसलिए ‘बन्द करके’ की अपेक्षा ‘लपेटकर’ ऐतिहासिक वस्तु के अनुरूप और स्पष्ट है।
- source_word: βιβλίον
  choice: ग्रंथ
  rationale: यूनानी शब्द लिखित दस्तावेज़ या पुस्तक के लिए व्यापक रूप से प्रयुक्त हो सकता है। ‘ग्रंथ’ स्वाभाविक हिन्दी है, और ‘लपेटकर’ से यहाँ उसकी कुण्डलीनुमा भौतिक आकृति स्पष्ट हो जाती है।
- source_word: ἀποδοὺς
  choice: वापस दिया
  rationale: क्रिया का आशय उपयोग के बाद वस्तु को उसके जिम्मेदार व्यक्ति को लौटा देना है।
- source_word: ὑπηρέτῃ
  choice: परिचारक
  rationale: यहाँ सभा-घर की सेवा और ग्रंथों की देखभाल करने वाला सहायक अभिप्रेत है; ‘परिचारक’ आधुनिक हिन्दी में ‘दास’ या सामान्य ‘सेवक’ से कम भ्रामक है।
- source_word: ἐκάθισεν
  choice: बैठ गया
  rationale: यह सीधी कथात्मक क्रिया है और हिन्दी में स्वाभाविक रूप से अगली अवस्था में प्रवेश को व्यक्त करती है।
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: सब लोगों की आँखें
  rationale: यह यूनानी की सजीव शारीरिक अभिव्यक्ति और सभी उपस्थित लोगों के समावेश—दोनों को बनाए रखता है।
- source_word: ἀτενίζοντες αὐτῷ
  choice: उसी पर टिकी थीं
  rationale: यह लगातार और ध्यानपूर्वक देखने का भाव व्यक्त करता है, पर ‘घूरना’ जैसा असभ्यता या शत्रुता का अनावश्यक संकेत नहीं जोड़ता।
- source_word: συναγωγῇ
  choice: सभा-घर
  rationale: इस प्रसंग में यह यहूदी आराधना और सामुदायिक सभा के स्थान को दर्शाता है। ‘सभा-घर’ सामान्य पाठक के लिए सुबोध है और केवल सभा की अमूर्त धारणा तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: सभा-घर में प्रयुक्त βιβλίον का ऐतिहासिक रूप
  choice: मुख्य पाठ में ‘ग्रंथ’ और क्रिया ‘लपेटकर’ रखी गई, जिससे कुण्डली का रूप स्पष्ट होता है।
  alternative: ‘पुस्तक’ या सीधे ‘ग्रंथ-कुण्डली’
  rationale: मूल शब्द की सामान्य अर्थ-सीमा को बनाए रखते हुए क्रिया और ऐतिहासिक प्रसंग से वस्तु का कुण्डली होना व्यक्त होता है। इससे परम्परागत ‘पुस्तक’ को आधुनिक जिल्द वाली पुस्तक समझने की सम्भावना घटती है, पर मूल से अधिक संकीर्ण संज्ञा थोपने से भी बचा जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ग्रंथ’ और ‘सभा-घर’ धार्मिक प्रसंग के अनुकूल हैं, जबकि वाक्य-विन्यास सहज हिन्दी का है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न और उनकी सामग्री परस्पर उलटे दिखाई देते हैं; हिन्दी मसौदे में [a] को ग्रंथ और [b] को परिचारक के साथ अर्थानुसार लगाया गया है।
