lexical_decisions:
- source_word: κατῆλθεν
  choice: उतर गया
  rationale: यह क्रिया नीचे की ओर जाने का भाव रखती है। ‘उतर गया’ उस दिशात्मक अर्थ को सुरक्षित रखते हुए हिन्दी में स्वाभाविक है।
- source_word: Καφαρναοὺμ
  choice: कफरनहूम
  rationale: स्थान के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: πόλιν τῆς Γαλιλαίας
  choice: गलील के एक नगर
  rationale: अनिश्चित πόλιν के कारण ‘एक नगर’ रखा गया है; सम्बन्धकारक पदबंध को स्वाभाविक हिन्दी में ‘गलील के’ कहा गया है।
- source_word: ἦν διδάσκων
  choice: शिक्षा देता था
  rationale: परिधीय अपूर्णकाल निरंतर अथवा बार-बार होने वाली क्रिया दर्शाता है; ‘देता था’ इस पक्ष को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: मूल पाठ में कर्म सर्वनाम ही है और इस पद में उसका स्पष्ट संज्ञात्मक पूर्वपद नहीं दिया गया; इसलिए अतिरिक्त पहचान जोड़े बिना ‘उन्हें’ रखा गया है।
- source_word: ἐν τοῖς σάββασιν
  choice: सब्त के दिनों में
  rationale: यूनानी में ‘सब्त’ बहुवचन है। हिन्दी का यह पदबंध बहुवचन और बारंबारता की सम्भावना को बनाए रखते हुए ‘सब्तों में’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: σάββασιν के बहुवचन को एकवचन बनाकर सहज करना या उसका पुनरावृत्तिमूलक संकेत बनाए रखना
  choice: सब्त के दिनों में
  alternative: सब्त के दिन
  rationale: बहुवचन सम्भवतः अनेक सब्त अवसरों पर यीशु के शिक्षा देने को दर्शाता है और ‘शिक्षा देता था’ के निरंतर पक्ष से मेल खाता है। अतः इसे एक ही अवसर तक सीमित नहीं किया गया।
