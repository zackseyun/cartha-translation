source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: hi
  text: क्योंकि बड़ा कौन है—वह जो भोजन के समय टेक लगाए बैठा है[a], या वह जो सेवा कर रहा है? क्या वही नहीं जो भोजन के समय टेक लगाए बैठा है? पर मैं तुम्हारे बीच सेवा करनेवाले के रूप में हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय भोज में लोग प्रायः विशेष भोज-आसनों पर टेक लगाकर भोजन करते थे, जबकि सेवा करनेवाले उनकी देखभाल करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: क्योंकि बड़ा कौन है
  rationale: τίς का स्वाभाविक प्रश्नवाचक रूप ‘कौन’ है; γὰρ पिछले कथन का आधार बताता है, इसलिए ‘क्योंकि’; μείζων को ‘बड़ा’ रखा गया है ताकि पद, प्रतिष्ठा या महत्त्व की तुलनात्मक व्यापकता बनी रहे।
- source_word: ὁ ἀνακείμενος
  choice: वह जो भोजन के लिए टेक लगाकर बैठा है
  rationale: भोज के प्रसंग में ἀνάκειμαι प्राचीन रीति के अनुसार टेक लगाकर भोजन करने की मुद्रा को दर्शाता है। यह रूप केवल ‘बैठा है’ की अपेक्षा सांस्कृतिक चित्र को अधिक ठीक रखता है और ‘लेटा है’ की संभावित गलत समझ से बचाता है।
- source_word: ὁ διακονῶν
  choice: वह जो सेवा कर रहा है
  rationale: वर्तमान कृदंत भोजन पर सेवा करनेवाले व्यक्ति और भोजन करनेवाले व्यक्ति के बीच सक्रिय विरोध दिखाता है। क्रियात्मक भाषा कलीसियाई पद या दासत्व का अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: क्या वही नहीं जो भोजन के लिए टेक लगाकर बैठा है?
  rationale: οὐχί ऐसा आलंकारिक प्रश्न बनाता है जिसमें सकारात्मक उत्तर अपेक्षित है; ‘क्या वही नहीं’ हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐγὼ δὲ
  choice: लेकिन मैं
  rationale: δέ सामान्य सामाजिक मान्यता और यीशु के आचरण के बीच स्पष्ट विरोध स्थापित करता है।
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: मैं तुम्हारे बीच ... हूँ
  rationale: ‘तुम्हारे बीच’ आधुनिक हिन्दी में समूह के मध्य उपस्थित होने का स्वाभाविक और अर्थसंगत रूप है।
- source_word: ὡς ὁ διακονῶν
  choice: सेवा करनेवाले के समान
  rationale: ὡς रीति और तुलना व्यक्त करता है। यह अनुवाद यीशु की सेवकाई को बनाए रखता है, पर उन्हें यहाँ प्रयुक्त न हुए संज्ञात्मक पद ‘दास’ से नहीं पहचानता।
theological_decisions:
- issue: यीशु के आत्म-वर्णन में सेवा की भाषा
  choice: लेकिन मैं तुम्हारे बीच सेवा करनेवाले के समान हूँ।
  alternative: लेकिन मैं तुम्हारे बीच एक सेवक हूँ।
  rationale: यूनानी पाठ में संज्ञा नहीं, बल्कि διακονῶν कृदंत है। इसलिए क्रियात्मक अभिव्यक्ति तत्काल भोज-संदर्भ और यीशु के विनम्र आचरण को सुरक्षित रखती है, बिना दासत्व या किसी औपचारिक धार्मिक पद का अतिरिक्त अर्थ जोड़े।
- issue: मείζων में बड़ाई का आशय
  choice: बड़ा
  alternative: अधिक महत्त्वपूर्ण
  rationale: ‘बड़ा’ मूल तुलना की अर्थ-व्याप्ति को खुला रखता है; संदर्भ में प्रतिष्ठा या सामाजिक पद निहित हो सकता है, पर अनुवाद उसे केवल ‘महत्त्व’ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण संबोधन रखा गया है। ‘टेक लगाकर बैठा है’ प्राचीन भोज-मुद्रा को समझने योग्य ढंग से व्यक्त करता है; सांस्कृतिक विवरण पादटिप्पणी में दिया गया है। ‘सेवा करनेवाला’ तत्काल भोजन-संदर्भ को बनाए रखता है और अनावश्यक संस्थागत या दासत्व-संबंधी अर्थों से बचता है।
