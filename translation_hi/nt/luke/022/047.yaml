id: LUK.22.47
reference: Luke 22:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: hi
  text: जब वह अभी बोल ही रहा था, तभी देखो, एक भीड़ आ पहुँची। जिसे यहूदा कहा जाता था, वह बारहों में से एक था और उनके आगे-आगे चल रहा था[a]। वह यीशु के पास आया कि उसे चूमे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका नेतृत्व कर रहा था’ अथवा ‘उनसे आगे चल रहा था’।
    reason: προήρχετο αὐτούς में समूह के आगे चलने और उन्हें आगे से ले जाने—दोनों अर्थछायाएँ संभव हैं; मुख्य पाठ अधिक स्थानगत और कम व्याख्यात्मक विकल्प रखता है।
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: जब वह अभी बोल ही रहा था
  rationale: सम्बन्धकारक स्वतंत्र रचना चल रही क्रिया और उसके साथ घटनेवाली अगली घटना को व्यक्त करती है। ‘अभी बोल ही रहा था’ ἔτι और वर्तमान कृदन्त, दोनों की कालगत शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथानक में अचानक सामने आई घटना की ओर ध्यान खींचनेवाला संकेत है; ‘देखो’ उसकी सजीवता को बिना हटाए आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὄχλος
  choice: एक भीड़ आ पहुँची
  rationale: ὄχλος का अर्थ ‘भीड़’ है। यूनानी में आगमन की क्रिया स्पष्ट रूप से नहीं दी गई, पर प्रसंग में भीड़ के अचानक उपस्थित होने को हिन्दी का पूर्ण और स्वाभाविक वाक्य बनाने के लिए ‘आ पहुँची’ से व्यक्त किया गया है।
- source_word: ὁ λεγόμενος Ἰούδας
  choice: यहूदा कहलानेवाला
  rationale: यह पहचान बतानेवाली कृदन्तीय अभिव्यक्ति है। यह अनुवाद ‘तथाकथित’ जैसी अनावश्यक नकारात्मक छाया जोड़े बिना यूनानी के निकट रहता है।
- source_word: εἷς τῶν δώδεκα
  choice: जो बारहों में से एक था
  rationale: यह यहूदा की बारह शिष्यों में सदस्यता को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है और कथानक में निहित विडंबना को नहीं मिटाता।
- source_word: προήρχετο αὐτούς
  choice: उनके आगे-आगे चल रहा था
  rationale: यहाँ क्रिया समूह के आगे चलने का बोध देती है। अपूर्ण काल की जारी क्रिया को ‘चल रहा था’ बनाए रखता है; ‘आगे-आगे’ उसके स्थानगत अर्थ को व्यक्त करता है, जबकि औपचारिक नेतृत्व का अर्थ अनिवार्य नहीं बनाता।
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: वह यीशु के पास आया
  rationale: ἐγγίζω निकट आने को व्यक्त करता है। ‘पास आया’ सहज आधुनिक हिन्दी है और यीशु की ओर बढ़ने की दिशा बनाए रखता है।
- source_word: φιλῆσαι αὐτόν
  choice: कि उसे चूमे
  rationale: φιλέω यहाँ अभिवादन के रूप में चूमने को बताता है। सरल अनुवाद मूल क्रिया को रखता है और पद में ‘धोखा देने’ जैसी व्याख्यात्मक सामग्री नहीं जोड़ता।
theological_decisions:
- issue: यहूदा के निकट आने और चूमने का कथात्मक चित्रण
  choice: उसके पास आने और चूमने के उद्देश्य को सीधे वर्णित करना
  alternative: ‘चूमकर उसे पकड़वाने/धोखा देने’ जैसी व्याख्यात्मक वृद्धि
  rationale: आस-पास का प्रसंग विश्वासघात को स्पष्ट करता है, पर इस पद के यूनानी शब्द केवल निकट आने और चूमने के उद्देश्य का वर्णन करते हैं। इसलिए नैतिक या धर्मवैज्ञानिक निष्कर्ष को पद के भीतर जोड़ने के बजाय मूल का तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ कथानक की आकस्मिकता और सजीवता बचाता है। ‘कहलानेवाला’ औपचारिक पहचान देता है, जबकि ‘आगे-आगे चल रहा था’ स्वाभाविक हिन्दी में अपूर्ण क्रिया और संभावित अर्थगत अस्पष्टता दोनों को संभालता है।
