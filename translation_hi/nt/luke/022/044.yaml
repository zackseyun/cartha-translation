source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: hi
  text: और वह गहरी व्यथा में होकर[a] और अधिक उत्कटता से प्रार्थना करता रहा;[b] और उसका पसीना भूमि पर गिरती हुई लहू की बूँदों के समान हो गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कठिन संघर्ष में होकर’ अथवा ‘अत्यन्त व्याकुल होकर।’
    reason: lexical_alternative
  - marker: b
    text: कुछ हस्तलिपियाँ लूका 22:43–44 को छोड़ देती हैं, जबकि अन्य में ये पद हैं। SBLGNT इस पाठगत अनिश्चितता को दिखाने के लिए इन पदों को कोष्ठकीय चिह्नों में छापता है।
    reason: textual_variant
  - marker: c
    text: यूनानी में, ‘लहू की बूँदों/थक्कों के समान।’ यह उपमा है; पद सीधे यह नहीं कहता कि पसीना स्वयं लहू था।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: अत्यन्त व्याकुल होकर
  rationale: यह पदबंध यीशु की तीव्र मानसिक-संघर्ष और व्यथा की अवस्था बताता है। ‘अत्यन्त व्याकुल’ आधुनिक हिन्दी में स्वाभाविक है और पीड़ा की तीव्रता बनाए रखता है।
- source_word: ἐκτενέστερον
  choice: और भी अधिक एकाग्रता से
  rationale: तुलनात्मक क्रियाविशेषण प्रार्थना की बढ़ी हुई तीव्रता व्यक्त करता है। ‘और भी अधिक’ तुलनात्मक बल को स्पष्ट रखता है; ‘एकाग्रता से’ निरन्तर और गहन लगन का स्वाभाविक हिन्दी रूप है।
- source_word: προσηύχετο
  choice: प्रार्थना करता रहा
  rationale: अपूर्ण भूतकाल चलती हुई क्रिया को दर्शाता है; ‘करता रहा’ उस निरन्तर पक्ष को सुरक्षित रखता है।
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: उसका पसीना … गिर रहा था
  rationale: हिन्दी में प्राकृतिक अभिव्यक्ति के लिए परिणाम और नीचे जाने की क्रिया को एक वाक्यांश में रखा गया है। तुलना को ‘के समान’ द्वारा स्पष्ट रूप से सुरक्षित किया गया है।
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: लहू की बूँदों के समान
  rationale: ὡσεὶ उपमा सूचित करता है, पहचान नहीं। θρόμβοι भारी बूँदों या थक्कों को सूचित कर सकता है; मुख्य पाठ में स्वाभाविक ‘बूँदों’ और पादटिप्पणी में वैकल्पिक अर्थ रखा गया है।
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: भूमि पर गिर रहा था
  rationale: यह नीचे की ओर गति और भूमि तक पहुँचने का स्वाभाविक हिन्दी चित्र प्रस्तुत करता है। पसीना एकवचन सामूहिक संज्ञा होने के कारण क्रिया ‘गिर रहा था’ रखी गई है।
theological_decisions:
- issue: ‘लहू की बूँदों के समान’ में तुलना का स्वरूप
  choice: पसीने और लहू की बूँदों के बीच उपमा को स्पष्ट रखा गया है।
  alternative: पसीना वास्तव में लहू था।
  rationale: ὡσεὶ स्पष्ट तुलनात्मक चिह्न है। इसलिए अनुवाद को यह निश्चित नहीं कहना चाहिए कि पसीना स्वयं लहू था; साथ ही सजीव और तीव्र चित्र को भी कम नहीं किया गया है।
- issue: लूका 22:43–44 की पाठगत स्थिति
  choice: पद को मुख्य पाठ में रखा गया है और पाठगत अनिश्चितता पादटिप्पणी में बताई गई है।
  alternative: कुछ प्राचीन हस्तलिपियों के आधार पर पदों को मुख्य पाठ से निकाल देना।
  rationale: दिए गए SBLGNT स्रोत में पाठ को कोष्ठकीय संकेत के साथ मुद्रित किया गया है। अतः पाठ को प्रस्तुत करते हुए उसकी वास्तविक हस्तलिपीय अनिश्चितता पाठक के सामने स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘अत्यन्त व्याकुल’ तीव्र ἀγωνία को व्यक्त करता है; ‘प्रार्थना करता रहा’ अपूर्ण भूतकाल की निरन्तरता रखता है। ‘लहू’ बाइबलीय प्रसंग में परिचित और सहज है, जबकि ‘भूमि’ औपचारिक गरिमा बनाए रखती है।
