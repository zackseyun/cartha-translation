  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: hi
  text: थोड़ी देर बाद, एक और व्यक्ति ने उसे देखकर कहा, “तुम भी उन्हीं में से हो।” पर पतरस ने कहा, “आदमी, मैं नहीं हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप में, “मैं उनमें से नहीं हूँ।” यूनानी में केवल “मैं नहीं हूँ” है; बाकी बात पिछले आरोप से समझी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: थोड़ी देर बाद
  rationale: यह संक्षिप्त समय-अंतराल को स्वाभाविक और ठीक प्रकार से व्यक्त करता है।
- source_word: ἕτερος
  choice: एक और व्यक्ति
  rationale: यूनानी शब्द का अर्थ ‘एक और’ अथवा ‘दूसरा व्यक्ति’ है; ‘व्यक्ति’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से पहचान नहीं जोड़ता।
- source_word: ἰδὼν αὐτὸν
  choice: उसे देखकर
  rationale: यह एओरिस्ट कृदन्त की पृष्ठभूमिगत क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: तुम भी उन्हीं में से हो
  rationale: यह यीशु से जुड़े समूह की सदस्यता या संगति का आरोप व्यक्त करता है और हिन्दी का स्वाभाविक मुहावरा है।
- source_word: Ἄνθρωπε
  choice: भाई
  rationale: सम्बोधन में प्रयुक्त ἄνθρωπε यहाँ नाम या पदवी नहीं, बल्कि सीधे और कुछ रूखे ढंग का पुरुष-सम्बोधन है; ‘भाई’ आधुनिक हिन्दी में इस संवादात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ εἰμί
  choice: मैं नहीं हूँ
  rationale: यूनानी कथन जानबूझकर अपूर्ण है; आरोप से अपेक्षित विधेय को स्पष्ट किए बिना उसका संक्षिप्त, रक्षात्मक स्वर सुरक्षित रखा गया है।
