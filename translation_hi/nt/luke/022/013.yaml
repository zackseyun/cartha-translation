lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: इसलिए वे गए
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में क्रमिक सीमित क्रिया के रूप में व्यक्त किया गया है। δέ यहाँ प्रबल विरोध नहीं, बल्कि पिछले निर्देशों से कथा को आगे बढ़ाने वाला हल्का संयोजक है; इसलिए ‘इसलिए’ प्रसंगगत परिणाम को स्पष्ट करता है।
- source_word: εὗρον
  choice: पाया
  rationale: यूनानी में कर्म व्यक्त नहीं है। हिन्दी में भी उसे न जोड़कर मूल की संक्षिप्तता और कुछ हद तक निहित संदर्भ सुरक्षित रखा गया है।
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: जैसा उसने उनसे कहा था, वैसा ही
  rationale: καθώς पूर्व कथन और मिली हुई परिस्थिति के बीच अनुरूपता बताता है। प्लूपरफेक्ट εἰρήκει को ‘कहा था’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἡτοίμασαν
  choice: उन्होंने ... की तैयारी की
  rationale: यह अओरिस्ट क्रिया तैयारी करने को दर्शाती है; हिन्दी में ‘की तैयारी की’ सहज और स्पष्ट है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: πάσχα का आशय फसह-पर्व, उसके भोज अथवा बलि से हो सकता है। मुख्य पाठ में व्यापक शब्द ‘फसह’ रखकर मूल की अर्थगत व्यापकता सुरक्षित रखी गई है।
theological_decisions:
- issue: इस प्रसंग में πάσχα का दायरा
  choice: फसह
  alternative: फसह का भोज; फसह का मेमना
  rationale: तात्कालिक प्रसंग फसह खाने की तैयारी से जुड़ा है, फिर भी यूनानी शब्द स्वयं पर्व, भोज या उससे संबंधित बलि का बोध करा सकता है। व्यापक अनुवाद किसी एक संकीर्ण अर्थ को मुख्य पाठ में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘फसह’ हिन्दी बाइबल परंपरा में परिचित पद है और यहाँ मूल यूनानी की अर्थगत व्यापकता बनाए रखता है।
