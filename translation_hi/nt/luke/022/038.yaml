id: LUK.22.38
reference: Luke 22:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: hi
  text: उन्होंने कहा, “प्रभु, देखिए, यहाँ दो तलवारें हैं।” यीशु ने उनसे कहा, “काफ़ी है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बस, बहुत हुआ।” सम्भव है कि यीशु का आशय यह न हो कि दो तलवारें पर्याप्त थीं, बल्कि यह हो कि अब इस विषय पर बातचीत समाप्त की जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य का स्वाभाविक प्रवाह बना रहता है। बहुवचन ‘उन्होंने’ शिष्यों की ओर संकेत करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह यीशु के प्रति सीधे संबोधन और नए नियम में κύριος के स्थापित धार्मिक अर्थ, दोनों के अनुरूप है।
- source_word: ἰδοὺ
  choice: देखिए
  rationale: यह ἰδού की ध्यान खींचने वाली शक्ति को आधुनिक, आदरसूचक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: μάχαιραι
  choice: तलवारें
  rationale: μάχαιρα किसी धारदार हथियार को दर्शाता है; ‘तलवार’ प्रचलित और पर्याप्त व्यापक अनुवाद है, जबकि ‘कटार’ या ‘छोटी तलवार’ अनावश्यक रूप से अधिक विशिष्ट होंगे।
- source_word: ὧδε δύο
  choice: यहाँ दो ... हैं
  rationale: यह स्थानसूचक ὧδε और संख्या δύο को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: यीशु ने उनसे कहा
  rationale: यूनानी में कर्ता सर्वनाम-सदृश पद से व्यक्त है। हिन्दी में लगातार आने वाले आदरसूचक ‘उन्होंने’ से शिष्यों और यीशु के बीच भ्रम हो सकता था, इसलिए संदर्भ से स्पष्ट नाम ‘यीशु’ रखा गया है।
- source_word: Ἱκανόν ἐστιν
  choice: काफ़ी है
  rationale: विषयरहित हिन्दी वाक्य यूनानी कथन की संक्षिप्तता और इस अस्पष्टता को बनाए रखता है कि दो तलवारें पर्याप्त हैं या यीशु बातचीत समाप्त कर रहे हैं।
theological_decisions:
- issue: यीशु के उत्तर Ἱκανόν ἐστιν की व्याख्यात्मक अस्पष्टता
  choice: काफ़ी है
  alternative: बस, बहुत हुआ
  rationale: यूनानी को तलवारों की संख्या के बारे में ‘इतना पर्याप्त है’ या बातचीत रोकने के अर्थ में समझा जा सकता है। मुख्य पाठ जानबूझकर दोनों संभावनाएँ खुली रखता है; पादटिप्पणी दूसरी संभावना स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में आदरसूचक ‘देखिए’ और प्रतिष्ठित संबोधन ‘प्रभु’ रखा गया है। भाषा संक्षिप्त, सहज और गरिमापूर्ण है।
