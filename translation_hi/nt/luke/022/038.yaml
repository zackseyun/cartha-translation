  source_fidelity: 'The Hindi accurately represents all source elements: the disciples'' statement, the address Κύριε as “प्रभु,” the attention-getting ἰδού as “देखिए,” the two swords, and Jesus’ concise reply Ἱκανόν ἐστιν. “काफ़ी है” appropriately retains the Greek’s unresolved reference and does not decide whether the swords are sufficient or Jesus is ending the discussion.'
  naturalness: The wording is concise, fluent modern standard Hindi, and the dialogue is appropriately respectful. “देखिए” is natural in direct address to “प्रभु,” and naming “यीशु” in the second clause avoids a potentially unclear shift in the referent of “उन्होंने.”
  terminology: “प्रभु” is suitable for Κύριε in this New Testament setting, and “तलवारें” is a suitably non-over-specific rendering of μάχαιραι. “काफ़ी है” is idiomatic while preserving the terse register of the Greek.
