translation:
  language: hi
  text: और मैं तुम्हें एक राज्य सौंपता हूँ[a], जैसे मेरे पिता ने मुझे एक राज्य सौंपा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारे लिए एक राज्य की वाचा ठहराता हूँ, जैसे मेरे पिता ने मेरे लिए ठहराई।” यूनानी क्रिया में सौंपने या प्रदान करने के साथ-साथ वाचा ठहराने का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί + ἐγώ का संयोजन पिछले प्रसंग से संबंध और वक्ता पर बल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διατίθεμαι
  choice: प्रदान करता हूँ
  rationale: क्रिया यहाँ व्यवस्था करने, सौंपने अथवा वाचा बाँधने का भाव रख सकती है। राज्य को दिए जाने के संदर्भ में ‘प्रदान करता हूँ’ स्वाभाविक है और किसी एक विशिष्ट वाचागत अर्थ को मुख्य पाठ पर आरोपित नहीं करता।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह संप्रदान कारक प्राप्तकर्ताओं को दर्शाता है।
- source_word: καθὼς
  choice: जैसे
  rationale: यह यीशु के कार्य और पिता के पूर्व कार्य के बीच अनुरूपता प्रकट करता है।
- source_word: διέθετό
  choice: प्रदान किया
  rationale: पहली क्रिया के साथ शब्दगत समानता रखी गई है; भूतकाल पिता के पूर्ण कार्य को व्यक्त करता है।
- source_word: μοι
  choice: मुझे
  rationale: यह प्राप्तकर्ता को सूचित करने वाला संप्रदान कारक है।
- source_word: ὁ πατήρ μου
  choice: मेरे पिता
  rationale: यह स्वाभाविक हिन्दी में पुत्र-पिता संबंध को सुरक्षित रखता है।
- source_word: βασιλείαν
  choice: एक राज्य
  rationale: यहाँ अनिश्चित, एकवचन संज्ञा राजकीय अधिकार या राज्य के दिए जाने को सूचित करती है; अगले पद के सिंहासनों और मेज़ के प्रसंग में ‘एक राज्य’ उपयुक्त है।
theological_decisions:
- issue: क्या διατίθεμαι को स्पष्ट वाचागत भाषा में अनूदित किया जाए
  choice: प्रदान करता हूँ
  alternative: तुम्हारे साथ राज्य की वाचा बाँधता हूँ
  rationale: यूनानी क्रिया में वाचागत अर्थ संभव है, पर राज्य को सौंपने या प्रदान करने का व्यापक अर्थ भी संदर्भ के अनुकूल है। मुख्य पाठ किसी विशिष्ट धर्मवैचारिक निष्कर्ष को अनिवार्य नहीं बनाता, जबकि पादटिप्पणी संभावित वाचागत अर्थ सुरक्षित रखती है।
- issue: βασιλείαν का अर्थ राज्य-क्षेत्र है या राजकीय शासन
  choice: एक राज्य
  alternative: राजकीय शासन
  rationale: शब्द दोनों भाव व्यक्त कर सकता है। अगले पद में मेज़, सिंहासन और इस्राएल के गोत्रों का न्याय होने के कारण ‘एक राज्य’ ठोस राजकीय संदर्भ को स्वाभाविक रूप से संप्रेषित करता है, बिना शासन के भाव को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘प्रदान करना’ औपचारिकता और स्वाभाविकता के बीच संतुलन रखता है; ‘नियुक्त करना’ हिन्दी में सामान्यतः किसी व्यक्ति को पद पर रखने के लिए प्रयुक्त होता है और ‘राज्य’ के साथ अस्वाभाविक लगता।
