  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: hi
  text: पर यीशु ने उससे कहा, “यहूदा, क्या तुम चुंबन देकर मनुष्य के पुत्र को पकड़वा रहे हो[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “क्या तुम चुंबन देकर मनुष्य के पुत्र को सौंप रहे हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का संयोजक है; प्रसंग में यहूदा के चुम्बन और यीशु की प्रतिक्रिया के बीच विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: αὐτῷ को स्पष्ट रूप से व्यक्त करते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: सम्बोधन रूप में आए व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: φιλήματι
  choice: चुम्बन देकर
  rationale: साधनवाचक अर्थ को सहज हिन्दी में व्यक्त करता है और ठोस क्रिया को बनाए रखता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यीशु की स्थापित आत्म-पदवी का पारम्परिक हिन्दी रूप, जो यूनानी संरचना और दानिय्येल-संबंधी प्रतिध्वनि दोनों को सुरक्षित रखता है।
- source_word: παραδίδως
  choice: पकड़वा रहे हो
  rationale: तात्कालिक प्रसंग में यह किसी को शत्रुओं के हाथ सौंपने की क्रिया है; यह हिन्दी में चल रही क्रिया और विश्वासघाती आशय दोनों को स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव जन
  rationale: पारम्परिक पदवी यूनानी अभिव्यक्ति की संरचना तथा उसके मसीही और दानिय्येल-संबंधी अर्थ-संकेतों को बिना व्याख्यात्मक रूप से सीमित किए बनाए रखती है।
- issue: παραδίδως का प्रसंगगत अर्थ
  choice: पकड़वा रहे हो
  alternative: सौंप रहे हो / विश्वासघात कर रहे हो
  rationale: यह रूप गिरफ्तारी के लिए विरोधियों के हाथ सौंपने का ठोस प्रसंग स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रश्न की तीखी विडम्बना सुरक्षित है; ‘मनुष्य का पुत्र’ स्थापित बाइबलीय पदवी के रूप में रखा गया है।
