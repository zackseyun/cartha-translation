source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: hi
  text: ताकि तुम मेरे राज्य में मेरी मेज़ पर खा-पी सको, और सिंहासनों पर बैठकर इस्राएल के बारह गोत्रों का न्याय करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के बारह गोत्रों पर शासन करोगे” अथवा “उनका प्रशासन करोगे।”
    reason: κρίνω का मूल अर्थ ‘न्याय करना’ है, पर प्रसंग के अनुसार इसमें शासन या प्रशासन करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले कथन से जुड़े उद्देश्य या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔσθητε καὶ πίνητε
  choice: तुम…खाओ-पियो
  rationale: दोनों संभावनार्थक क्रियाएँ ἵνα के अधीन हैं; हिन्दी में संयुक्त रूप ‘खाओ-पियो’ उद्देश्य का भाव स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: मेरी मेज़ पर
  rationale: मेज़ पर साथ भोजन करने की संगति के लिए यह सहज और अर्थनिष्ठ हिन्दी है।
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: मेरे राज्य में
  rationale: βασιλεία राज्य या राजकीय शासन दोनों का बोध करा सकता है; भोज और सिंहासनों के प्रसंग में ‘राज्य’ स्थान तथा राजसत्ता, दोनों की छाया बनाए रखता है।
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: सिंहासनों पर बैठकर
  rationale: भविष्य की सिंहासनासीन भूमिका का राजकीय और न्यायिक बिंब सुरक्षित रहता है; अगली क्रिया के साथ हिन्दी में कृदन्तीय संयोजन स्वाभाविक है।
- source_word: κρίνοντες
  choice: न्याय करो
  rationale: κρίνω का सबसे सीधा अर्थ ‘न्याय करना’ है; यह शब्द में निहित न्यायिक अर्थ को बनाए रखता है, जबकि शासन करने का व्यापक भाव पादटिप्पणी में दिया गया है।
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: इस्राएल के बारह गोत्रों
  rationale: यह वाक्यांश की पारदर्शी और प्रचलित हिन्दी अभिव्यक्ति है तथा इस्राएल के बारह गोत्रों का वाचा-संबंधी संकेत सुरक्षित रखती है।
theological_decisions:
- issue: इस्राएल के बारह गोत्रों का ‘न्याय करने’ में शिष्यों की भावी भूमिका का स्वरूप
  choice: मुख्य पाठ में ‘न्याय करो’ रखा गया है।
  alternative: ‘शासन करो’ या ‘राज चलाओ’
  rationale: κρίνω में न्यायिक निर्णय और शासकीय अधिकार, दोनों के अर्थ हो सकते हैं। मुख्य पाठ सीधा न्यायिक अर्थ रखता है, पर इसे केवल दंडादेश या केवल प्रशासन तक सीमित नहीं करता; व्यापक शासकीय अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खाओ-पियो’ स्वाभाविक हिन्दी है, जबकि ‘मेज़’, ‘सिंहासन’, ‘गोत्र’ और ‘न्याय’ मूल के भोज, राजकीय और न्यायिक बिंबों को स्पष्ट रखते हैं। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिससे उसका lexical alternative संबंधित है।
