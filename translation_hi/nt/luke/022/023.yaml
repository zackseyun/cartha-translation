  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: hi
  text: और वे आपस में इस बात पर चर्चा करने लगे कि उनमें से कौन ऐसा हो सकता है जो यह करने वाला हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें से कौन हो सकता है जो यह करने वाला हो?” प्रसंग से स्पष्ट है कि “यह” पिछले पद में बताए गए विश्वासघात के कार्य की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: करने लगे
  rationale: यह आरंभसूचक प्रयोग किसी कार्य के शुरू होने को व्यक्त करता है; आधुनिक हिन्दी में ‘चर्चा करने लगे’ स्वाभाविक है।
- source_word: συζητεῖν
  choice: चर्चा करने
  rationale: यहाँ शिष्य पहचानने का प्रयास कर रहे हैं; ‘चर्चा’ पारस्परिक विचार-विमर्श दिखाता है, बिना इसे अनावश्यक रूप से विवाद या झगड़ा बनाए।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: यह समूह के भीतर परस्पर संवाद का स्वाभाविक हिन्दी रूप है।
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: कि उनमें से कौन ऐसा हो सकता है
  rationale: यह ज्ञात समूह में किसी एक व्यक्ति के विषय में अनिश्चित और विचारमूलक अप्रत्यक्ष प्रश्न को व्यक्त करता है; ‘हो सकता है’ εἴη की संभावनात्मक अनिश्चितता को बनाए रखता है।
- source_word: μέλλων πράσσειν
  choice: करने वाला था
  rationale: μέλλω आगामी या निकट कार्य की ओर संकेत करता है। प्रसंग भूतकालीन अप्रत्यक्ष विमर्श है, इसलिए ‘करने वाला था’ हिन्दी में समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦτο
  choice: यह
  rationale: सर्वनाम पिछले पद में घोषित कार्य की ओर संकेत करता है; मूल की अप्रत्यक्षता बनाए रखने के लिए इसे स्पष्ट रूप से ‘विश्वासघात’ नहीं बनाया गया।
theological_decisions:
- issue: क्या मुख्य पाठ में कार्य को स्पष्ट रूप से ‘विश्वासघात’ कहा जाए
  choice: मूल के सामान्य संकेत ‘यह करने’ को बनाए रखा गया।
  alternative: ‘उसके साथ विश्वासघात करने वाला था’
  rationale: यद्यपि प्रसंग से कार्य विश्वासघात है, इस पद में यूनानी पाठ τοῦτο (‘यह’) कहता है। इसलिए मुख्य पाठ में उससे अधिक स्पष्टता नहीं जोड़ी गई; पादटिप्पणी प्रसंग स्पष्ट करती है।
- issue: εἴη की अनिश्चितता
  choice: ‘हो सकता है’
  alternative: ‘होगा’ या केवल ‘था’
  rationale: ऑप्टेटिव रूप अप्रत्यक्ष प्रश्न की विचारमूलक अनिश्चितता को व्यक्त करता है; हिन्दी में ‘हो सकता है’ इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक संवाद के लिए स्वाभाविक अभिव्यक्ति। ‘यह’ को मुख्य पाठ में जानबूझकर सामान्य रखा गया है ताकि मूल पाठ की संकेतात्मक भाषा बनी रहे।
