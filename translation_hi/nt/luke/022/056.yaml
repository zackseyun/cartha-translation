base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: hi
  text: तब एक दासी ने उसे रोशनी के पास[a] बैठा हुआ देखा और उसे गौर से देखकर कहा, “यह भी उसके साथ था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रोशनी में।” यूनानी वाक्यांश रोशनी के स्रोत के पास होने के साथ-साथ प्रकाशित स्थान में होने का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: देखा
  rationale: अओरिस्ट कृदंत दासी द्वारा पतरस को देख लेने की क्रिया बताता है। हिन्दी में मुख्य क्रिया के साथ ‘बैठे देखा’ स्वाभाविक रूप से इस आशय को व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि कथा की अगली घटना की ओर बढ़ने का संकेत देता है।
- source_word: παιδίσκη τις
  choice: एक दासी
  rationale: παιδίσκη किसी युवती दासी या सेविका को सूचित करता है और τις अनिश्चितता व्यक्त करता है। ‘एक दासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा उसकी सामाजिक स्थिति को अनावश्यक रूप से उभारता नहीं।
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: रोशनी के पास बैठे
  rationale: καθήμενον पतरस की बैठी हुई अवस्था बताता है। πρὸς τὸ φῶς रोशनी के स्रोत के निकट स्थान या प्रकाशित क्षेत्र—दोनों का बोध करा सकता है; मुख्य पाठ में निकटता का अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀτενίσασα αὐτῷ
  choice: उस पर ध्यान से नज़र डालकर
  rationale: ἀτενίζω एकाग्र और गौरपूर्वक देखने का अर्थ देता है। यह हिन्दी अभिव्यक्ति उस तीव्रता को स्वाभाविक ढंग से बनाए रखती है।
- source_word: Καὶ οὗτος
  choice: यह भी
  rationale: καί का समावेशी अर्थ ‘भी’ से और οὗτος का संकेतात्मक बल ‘यह’ से व्यक्त होता है। प्रसंग से पुरुष का संदर्भ स्पष्ट है, इसलिए ‘यह आदमी’ जोड़ना आवश्यक नहीं।
- source_word: σὺν αὐτῷ ἦν
  choice: उसके साथ था
  rationale: यह वाक्यांश सीधे तौर पर संगति या साथ होने को व्यक्त करता है; हिन्दी रूप मूल की सरलता और संदर्भगत अस्पष्टता बनाए रखता है।
