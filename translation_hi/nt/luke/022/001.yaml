  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: hi
  text: अख़मीरी रोटी का पर्व[a], जिसे फसह कहा जाता है, निकट आ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: फसह और अख़मीरी रोटी का पर्व आपस में निकटता से जुड़े हुए उत्सव थे। यहूदी प्रयोग में दोनों का उल्लेख साथ-साथ किया जा सकता था, और उनके नामों का प्रयोग भी कुछ हद तक एक-दूसरे के लिए होता था।
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: निकट आ रहा था
  rationale: अपूर्ण भूतकाल चल रही निकटता को व्यक्त करता है; यह हिन्दी प्रयोग उस पक्ष को स्वाभाविक ढंग से बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ हल्का कथात्मक संक्रमण है; हिन्दी में वाक्य-क्रम ही संक्रमण को पर्याप्त रूप से व्यक्त करता है, इसलिए ‘अब’ जोड़ना अनावश्यक होगा।
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: अख़मीरी रोटी का पर्व
  rationale: यह यहूदी धार्मिक पर्व का प्रचलित और सामान्य पाठक के लिए बोधगम्य हिन्दी नाम है; बहुवचन नपुंसकलिंग ἄζυμα यहाँ पर्व-संज्ञा में अख़मीरी खाद्य/रोटी को सूचित करता है।
- source_word: ἡ λεγομένη
  choice: जिसे … कहा जाता है
  rationale: वर्तमान कर्मवाच्य कृदन्त की व्याख्यात्मक और नामसूचक भूमिका को सहज हिन्दी में सुरक्षित रखता है।
- source_word: Πάσχα
  choice: फसह
  rationale: यहूदी पर्व के लिए हिन्दी बाइबलीय परंपरा में परिचित नाम है और मूल के पास्का-संबंधी नाम को किसी व्याख्यात्मक धार्मिक शब्दावली से नहीं बदलता।
theological_decisions:
- issue: अख़मीरी रोटी के पर्व और फसह का संबंध
  choice: 'लूका की व्याख्यात्मक पहचान को सीधे रखा गया है: ‘अख़मीरी रोटी का पर्व, जिसे फसह कहा जाता है।’'
  alternative: दोनों को तकनीकी रूप से अलग-अलग पर्व मानकर अनुवाद में उनके कालक्रमिक भेद पर बल देना।
  rationale: यूनानी वाक्य स्वयं इन नामों को व्याख्यात्मक रूप से जोड़ता है। अनुवाद उस कथन को बनाए रखता है, जबकि पादटिप्पणी ऐतिहासिक नाम-प्रयोग स्पष्ट करती है; इस प्रकार न तो कृत्रिम सामंजस्य बैठाया गया है, न पाठ से अधिक कठोर भेद थोपा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘पर्व’ धार्मिक उत्सव के लिए स्वाभाविक है; ‘निकट आ रहा था’ यूनानी अपूर्ण भूतकाल की जारी प्रक्रिया को दर्शाता है। पादटिप्पणी का चिह्न [a] मुख्य पाठ में सम्मिलित है।
