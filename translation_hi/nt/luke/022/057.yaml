base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: hi
  text: पर उसने इस बात से इनकार किया[a] और कहा, “स्त्री[b], मैं उसे नहीं जानता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “पर उसने इनकार करते हुए कहा ...।” यूनानी में यह स्पष्ट नहीं किया गया कि उसने किस बात या किस व्यक्ति से इनकार किया; स्वाभाविक हिन्दी के लिए “इस बात से” जोड़ा गया है।'
    reason: lexical_alternative
  - marker: b
    text: “स्त्री” यूनानी सम्बोधन γύναι का अनुवाद है। यह उस महिला को सीधे संबोधित करता है; “महोदया” जैसे विकल्प मूल अभिव्यक्ति को अधिक विनम्र बनाकर प्रस्तुत करते।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: इस बात से इनकार किया
  rationale: ἀρνέομαι यहाँ पिछले कथन या आरोप को नकारने का अर्थ देता है। यूनानी में कर्म स्पष्ट नहीं है; स्वाभाविक हिन्दी के लिए ‘इस बात से’ जोड़ा गया है, बिना यह कहे कि पतरस ने सीधे यीशु को त्याग दिया।
- source_word: λέγων
  choice: और कहा
  rationale: वर्तमान कृदंत कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘और कहा’ इस संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Οὐκ οἶδα
  choice: मैं ... नहीं जानता
  rationale: यह जानने की क्रिया का सीधा निषेध है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम का संदर्भ यीशु से है; ‘उसे’ मूल की संक्षिप्तता बनाए रखता है और अनावश्यक रूप से ‘उस आदमी को’ नहीं जोड़ता।
- source_word: γύναι
  choice: स्त्री
  rationale: सम्बोधन रूप γύναι सामने बोल रही महिला को सीधे संबोधित करता है। ‘स्त्री’ मूल के निकट है; ‘महोदया’ जैसे विकल्प अभिव्यक्ति को व्याख्यात्मक रूप से अधिक विनम्र बना देते।
theological_decisions:
- issue: पतरस के इनकार का कर्म स्पष्ट करना
  choice: ‘इस बात से इनकार किया’ द्वारा तत्काल आरोप को नकारना व्यक्त किया गया।
  alternative: ‘उसने इनकार किया’ अथवा ‘उसने उसे नकार दिया’
  rationale: यूनानी ἠρνήσατο का कोई स्पष्ट कर्म नहीं देता। केवल ‘इनकार किया’ हिन्दी में अधूरा लग सकता है, जबकि ‘उसे नकार दिया’ यह आवश्यकता से अधिक निश्चित कर देगा कि व्याकरणिक कर्म स्वयं यीशु हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘स्त्री’ सामान्य बातचीत में कुछ औपचारिक लग सकता है, पर यहाँ यह यूनानी के सीधे सम्बोधन और दृश्य के तनाव को सुरक्षित रखता है।
