  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: hi
  text: और उसे ढककर[a] वे उससे बार-बार पूछते रहे, “भविष्यवाणी कर! तुझे किसने मारा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखों पर पट्टी बाँधकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: उसे ढककर
  rationale: यह कृदन्त किसी को ढकने या आवृत करने का अर्थ देता है। संदर्भ में दृष्टि रोके जाने का संकेत है, पर मुख्य पाठ में ‘आँखों पर पट्टी बाँधकर’ कहने से अधिक विशिष्टता आ जाती; इसलिए व्यापक अर्थ रखा गया है।
- source_word: ἐπηρώτων
  choice: बार-बार उससे पूछा
  rationale: अपूर्ण भूतकाल यहाँ जारी या पुनरावृत्त पूछताछ को दर्शाता है; ‘बार-बार’ उस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: पूछा
  rationale: यूनानी कृदन्त कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘यह कहते हुए पूछा’ अनावश्यक रूप से भारी होता, इसलिए प्रश्नवाचक वाक्य के साथ ‘पूछा’ में उसका भाव समाहित किया गया है।
- source_word: Προφήτευσον
  choice: भविष्यवाणी कर!
  rationale: यह उपहासपूर्ण आज्ञा है। सीधा रूप मूल की तीक्ष्णता और यीशु की भविष्यद्वक्ता-संबंधी पहचान पर किए गए व्यंग्य को बनाए रखता है।
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: तुझे किसने मारा?
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का अर्थ ‘वह कौन है जिसने तुझे मारा’ है। स्वाभाविक हिन्दी में ‘तुझे किसने मारा?’ वही आशय संक्षेप और स्पष्टता से देता है।
theological_decisions:
- issue: क्या स्पष्ट रूप से कहा जाए कि यीशु की आँखों पर पट्टी बाँधी गई थी
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति ‘उसे ढककर’ रखी गई
  alternative: ‘उसकी आँखों पर पट्टी बाँधकर’
  rationale: संदर्भ से दृष्टि रोके जाने का स्पष्ट संकेत मिलता है, पर यूनानी क्रिया स्वयं ढकने या आवृत करने को कहती है। इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और अधिक विशिष्ट, प्रचलित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘बार-बार’ से अपूर्ण भूतकाल की पुनरावृत्ति व्यक्त हुई है; उपहासपूर्ण आज्ञा को संक्षिप्त और तीखा रखा गया है।
