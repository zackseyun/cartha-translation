source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: hi
  text: 'क्योंकि मैं तुमसे कहता हूँ कि यह जो लिखा है, वह मुझमें पूरा होना आवश्यक है: “और वह अधर्मियों के साथ गिना गया।”[a] क्योंकि जो मेरे विषय में है, वह अपनी पूर्णता तक पहुँच रहा है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक रूप में, “और वह अपराधियों के साथ गिना गया” (यशायाह 53:12)।
    reason: alternative_reading
  - marker: b
    text: या, “जो मेरे विषय में है, वह पूरा हो रहा है” अथवा “अपने अंत तक पहुँच रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ से और λέγω ὑμῖν को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: τοῦτο τὸ γεγραμμένον
  choice: यह जो लिखा है
  rationale: मूल के संकेतवाचक और पूर्ण कृदन्त को ‘पवित्रशास्त्र’ जोड़कर अधिक स्पष्ट किए बिना निकट और सहज रूप में रखा गया है।
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: उसका मुझमें पूरा होना आवश्यक है
  rationale: δεῖ की आवश्यकता, τελεσθῆναι की पूर्ति/पूर्णता और ἐν ἐμοί के अपेक्षाकृत शाब्दिक ‘मुझमें’ को सुरक्षित रखा गया है।
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: और वह व्यवस्था-विहीन लोगों में गिना गया
  rationale: ἀνόμων के मूल अर्थ ‘व्यवस्था से रहित/व्यवस्था-विरोधी’ को पारंपरिक ‘अपराधियों’ में बदलने के बजाय निकटता से व्यक्त किया गया है; ἐλογίσθη के लिए स्वाभाविक ‘गिना गया’ लिया गया है।
- source_word: τὸ περὶ ἐμοῦ
  choice: जो कुछ मेरे विषय में है
  rationale: यीशु से संबंधित बातों के व्यापक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे किसी एक घटना तक सीमित किए।
- source_word: τέλος ἔχει
  choice: अपनी पूर्णता तक पहुँच रहा है
  rationale: वाक्यांश में निहित अंत, परिणति और पूर्णता के तनाव को बनाए रखता है; केवल ‘समाप्त हो रहा है’ या केवल ‘पूरा हो चुका है’ जैसी संकीर्ण व्याख्या से बचता है।
theological_decisions:
- issue: यशायाह 53:12 के उद्धरण में ἀνόμων का अनुवाद
  choice: व्यवस्था-विहीन लोगों में गिना गया
  alternative: अपराधियों में गिना गया
  rationale: मुख्य पाठ यूनानी ἀνόμων के निकट रहता है, जबकि परिचित पारंपरिक अभिव्यक्ति को पादटिप्पणी में रखा गया है।
- issue: τέλος ἔχει में अंत और पूर्णता का संबंध
  choice: अपनी पूर्णता तक पहुँच रहा है
  alternative: पूरा हो रहा है / अपने अंत तक पहुँच रहा है
  rationale: दुःखभोग के संदर्भ में परिणति का भाव प्रबल है, पर मूल वाक्यांश की अर्थगत व्यापकता और कालगत तनाव को पूरी तरह समाप्त नहीं किया गया।
- issue: ἐν ἐμοί का संबंध
  choice: मुझमें
  alternative: मेरे संबंध में / मेरे जीवन में
  rationale: मूल पूर्वसर्ग की प्रत्यक्षता को बनाए रखता है और यह तय नहीं करता कि बल केवल व्यक्ति, अनुभव या परिस्थिति पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘व्यवस्था-विहीन’ कुछ औपचारिक है, पर ἀνόμων की मूल छवि को सुरक्षित रखता है; परिचित ‘अपराधियों’ को पादटिप्पणी में दिया गया है।
