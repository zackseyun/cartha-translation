source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: hi
  text: और उसने रोटी लेकर धन्यवाद दिया, उसे तोड़ा और उन्हें दी, और कहा, “यह मेरा शरीर है[c], जो तुम्हारे लिए दिया जा रहा है[b]। मेरी याद में यह करते रहो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन हस्तलिपियों में ये शब्द नहीं हैं: “जो तुम्हारे लिए दिया जा रहा है। मेरी याद में यह करते रहो।”'
    reason: textual_variant
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “जो तुम्हारे लिए दिया जाता है।”'
    reason: lexical_alternative
  - marker: c
    text: मूल पाठ में सीधे “यह मेरा शरीर है” लिखा है। कुछ लोग इसका अर्थ “यह मेरे शरीर का प्रतीक है” समझते हैं, पर यूनानी पाठ स्वयं “है” शब्द का प्रयोग करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: रोटी लेकर
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी क्रियाविशेषणीय रचना में रखा गया है; इससे घटनाओं का यूनानी क्रम बना रहता है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद दिया
  rationale: यह रोटी तोड़ने से पहले किए गए धन्यवाद को सरल, स्वाभाविक भाषा में व्यक्त करता है और अनावश्यक धार्मिक पारिभाषिक शब्द नहीं जोड़ता।
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: उसे तोड़ा और उन्हें देते हुए
  rationale: ‘उसे’ हिन्दी में रोटी का स्पष्ट संकेत देता है। ‘देते हुए कहा’ λέγων के साथ क्रियाओं का प्रवाह स्वाभाविक बनाता है।
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: यह मेरा शरीर है
  rationale: ἐστιν का सीधा अर्थ ‘है’ सुरक्षित रखा गया है; अनुवाद इसे ‘प्रतीक है’ या ‘अर्थ है’ कहकर व्याख्यात्मक रूप से नहीं सुलझाता।
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: जो तुम्हारे लिए दिया जा रहा है
  rationale: वर्तमान कर्मवाच्य कृदंत की चल रही क्रिया को व्यक्त करता है। ‘तुम्हारे लिए’ ὑπὲρ ὑμῶν के हितार्थक तथा संभावित प्रतिनिधिक/बलिदानी आयाम को बिना अधिक व्याख्या के खुला रखता है।
- source_word: τοῦτο ποιεῖτε
  choice: यह करते रहो
  rationale: वर्तमान आज्ञार्थक का निरंतर अथवा बार-बार किए जाने वाला भाव स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: मेरी याद में
  rationale: ἀνάμνησις के स्मरण और स्मारक-अनुष्ठान के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘करते रहो’ इसके सक्रिय और आवर्ती संदर्भ को साथ लेकर चलता है।
theological_decisions:
- issue: प्रभु-भोज के संदर्भ में ‘यह मेरा शरीर है’ का अर्थ
  choice: ‘यह मेरा शरीर है’ की सीधी विधेयात्मक रचना रखी गई।
  alternative: ‘यह मेरे शरीर का प्रतीक है’ अथवा ‘इसका अर्थ मेरा शरीर है।’
  rationale: यूनानी पाठ ἐστιν, अर्थात ‘है’, कहता है। किसी एक संस्कार-संबंधी मत को अनुवाद में आरोपित करने के बजाय मूल कथन और उसकी धार्मिक व्याख्यात्मक तनावशीलता सुरक्षित रखी गई है।
- issue: लूका 22:19 के लंबे पाठ की पाठालोचनात्मक स्थिति
  choice: ‘जो तुम्हारे लिए…मेरी याद में यह करते रहो’ को मुख्य पाठ में रखा गया और पाठभेद को पादटिप्पणी में बताया गया।
  alternative: छोटा पाठ, जो ‘यह मेरा शरीर है’ पर समाप्त होता है।
  rationale: दिया गया SBLGNT पाठ इस अंश को कोष्ठक-चिह्न के साथ अपने कार्य-पाठ में सम्मिलित करता है, जिससे उसकी पाठालोचनात्मक अनिश्चितता सूचित होती है। इसलिए अंश मुख्य पाठ में है, पर छोटा पाठ भी स्पष्ट रूप से दर्ज है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन में बहुवचन ‘तुम्हारे’ मूल के ὑμῶν को स्वाभाविक ढंग से व्यक्त करता है। वाक्य की कथात्मक गति बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ धार्मिक शब्दावली से बचा गया है।
