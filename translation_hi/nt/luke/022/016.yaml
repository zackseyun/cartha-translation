id: LUK.22.16
reference: Luke 22:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ कि मैं इसे निश्चय ही तब तक नहीं खाऊँगा, जब तक परमेश्वर के राज्य में इसकी पूर्ति न हो जाए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इसे फिर कभी नहीं खाऊँगा, जब तक परमेश्वर के राज्य में इसकी पूर्ति न हो जाए।” यूनानी में भविष्य में खाने का प्रबल निषेध है। कुछ अनुवाद प्रसंग के आधार पर निहित “फिर” को स्पष्ट करते हैं, पर यूनानी पाठ में यह शब्द नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “इसे” पिछले पद में उल्लिखित फसह की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: यह स्वाभाविक हिन्दी कथन-रूप है; ‘क्योंकि’ पिछले पद में कही बात के साथ γάρ का व्याख्यात्मक संबंध बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह यीशु के कथन की विषय-वस्तु का स्पष्ट परिचय देता है और यूनानी वाक्य-संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὐ μὴ φάγω
  choice: मैं इसे निश्चय ही नहीं खाऊँगा
  rationale: οὐ μή और एओरिस्ट सब्जंक्टिव भविष्य के विषय में प्रबल निषेध व्यक्त करते हैं; ‘निश्चय ही नहीं’ उस बल को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: αὐτό
  choice: इसे
  rationale: सर्वनाम पिछले पद के फसह की ओर संकेत करता है। ‘इसे’ मूल की संक्षिप्तता बनाए रखता है और मुख्य पाठ में अनावश्यक स्पष्टता नहीं जोड़ता।
- source_word: ἕως ὅτου
  choice: जब तक ... तब तक
  rationale: यह हिन्दी में समय-सीमा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πληρωθῇ
  choice: पूरा न हो जाए
  rationale: निष्क्रिय πληρόω यहाँ पूर्णता अथवा परिपूर्ति का भाव रखता है। ‘पूरा होना’ सामान्य आधुनिक हिन्दी में बोधगम्य है और यह निर्धारित नहीं करता कि पूर्ति किस विशिष्ट रीति से होगी।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: यह βασιλεία की परिचित बाइबलीय अभिव्यक्ति को बनाए रखते हुए राज्य और शासन, दोनों संभावित भावों को खुला रखता है।
theological_decisions:
- issue: αὐτό (‘इसे’) का संदर्भ
  choice: सर्वनाम को ‘इसे’ रखा गया है; संदर्भ पिछले पद में उल्लिखित फसह है।
  alternative: मुख्य पाठ में ‘इस फसह के भोजन को’ कहना, अथवा इसे व्यापक फसह-पर्व/अनुष्ठान मानना।
  rationale: तात्कालिक संदर्भ फसह खाने का है, पर यूनानी पाठ केवल सर्वनाम देता है। इसलिए मुख्य पाठ मूल की संक्षिप्तता बनाए रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: ‘परमेश्वर के राज्य में पूरा होना’ का अर्थ
  choice: पूर्ति की रीति को अनिर्धारित रखते हुए मूल की अंतकालीन पूर्ति-संबंधी भाषा सुरक्षित रखी गई है।
  alternative: इसे विशेष रूप से परमेश्वर के राज्य के आगमन या मसीही भोज में पूर्ति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ यह नहीं बताता कि फसह ठीक किस घटना या रीति में पूरा होगा; अधिक विशिष्ट अनुवाद मूल की वास्तविक धार्मिक अस्पष्टता को अनावश्यक रूप से हल कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘निश्चय ही नहीं’ प्रबल निषेध को व्यक्त करता है; ‘पूरा’ धार्मिक अर्थ को संकीर्ण रूप से परिभाषित किए बिना πληρωθῇ की पूर्णता/पूर्ति का भाव देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
