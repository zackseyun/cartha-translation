review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains γάρ (“क्योंकि”), the content clause, the emphatic future negation, the compact pronoun referring to the Passover, the temporal limit, and God’s kingdom. However, “यह ... पूरा न हो जाए” is less idiomatic in Hindi for πληρωθῇ and can sound like mere completion rather than fulfillment. “इसकी पूर्ति न हो जाए” more naturally conveys the passive fulfillment sense while leaving its precise eschatological manner unspecified.
  naturalness: The sentence is generally clear, but placing the entire “जब तक ... तब तक” clause before the main clause is somewhat heavy. Placing the temporal clause after the main clause is smoother modern Hindi. “परमेश्वर के राज्य में इसकी पूर्ति” is standard biblical Hindi and natural in this context.
  terminology: “परमेश्वर का राज्य” is retained as the established rendering of βασιλεία τοῦ θεοῦ. “पूर्ति” is preferable here to “पूरा” because it preserves the fulfillment resonance of πληρωθῇ without imposing a particular theological explanation. The pronoun remains unspecified in the main text, with its contextual antecedent supplied only in the footnote.
  issues:
  - severity: medium
    issue: “यह ... पूरा न हो जाए” weakly renders πληρωθῇ.
    rationale: Although comprehensible, “पूरा हो जाना” can suggest ordinary completion and is syntactically less natural with an implicit antecedent of “फसह.” “इसकी पूर्ति न हो जाए” is idiomatic and better represents the passive fulfillment language.
  - severity: low
    issue: The temporal clause precedes the main clause.
    rationale: This is grammatical, but the revised order is more fluent in modern standard Hindi and keeps the emphatic denial prominent.
