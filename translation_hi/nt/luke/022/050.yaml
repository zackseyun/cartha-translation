source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: hi
  text: और उनमें से एक ने महायाजक के दास[a] पर वार किया और उसका दाहिना कान काट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। यूनानी शब्द दोउलोस (doulos) संदर्भ के अनुसार दास या सेवक को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: वार किया
  rationale: πατάσσω यहाँ बलपूर्वक प्रहार को व्यक्त करता है। ‘वार किया’ चोट पहुँचाने वाली ठोस कार्रवाई को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: εἷς τις ἐξ αὐτῶν
  choice: उनमें से एक
  rationale: εἷς τις अनिश्चित पहचान व्यक्त करता है; ‘उनमें से एक’ व्यक्ति की अनामता को सहज हिन्दी में बनाए रखता है।
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: महायाजक के दास
  rationale: δοῦλος यहाँ वास्तविक सामाजिक अधीनता की स्थिति बताता है। ‘दास’ इस अर्थ को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ἀφεῖλεν
  choice: काट दिया
  rationale: ἀφαιρέω का मूल अर्थ हटाना या अलग कर देना है; कान पर हथियार से हुए प्रहार के इस संदर्भ में ‘काट दिया’ परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: उसका दाहिना कान
  rationale: यह चयन प्रभावित अंग और उसकी दाहिनी ओर होने—दोनों विवरणों को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: इस पद में शब्द वास्तविक सामाजिक स्थिति के लिए प्रयुक्त है। ‘दास’ बंधुआ अधीनता को स्पष्ट रखता है, जबकि प्रचलित वैकल्पिक अर्थ ‘सेवक’ को पादटिप्पणी में दिया गया है ताकि मूल शब्द की अर्थ-सीमा बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, कथात्मक और गरिमापूर्ण है। ‘महायाजक’ स्थापित बाइबलीय पदनाम है और ‘वार किया’ हिंसक प्रहार को बिना पुरातन या अत्यधिक बोलचाल की भाषा के व्यक्त करता है।
