source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: hi
  text: तब उन्होंने कहा[a], “हमें अब भी गवाही की क्या आवश्यकता है? क्योंकि हमने स्वयं उसके मुँह से सुन लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन्होंने कहा”
    reason: δέ को प्रसंगानुसार ‘तब’ के बजाय हल्के संयोजक ‘और’ के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: तब उन्होंने कहा
  rationale: δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ क्रम को स्वाभाविक हिंदी में व्यक्त करता है, बिना अनावश्यक विरोध दिखाए।
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: हमें अब भी गवाही की क्या आवश्यकता है?
  rationale: τί ἔτι और χρείαν ἔχειν के आलंकारिक प्रश्न को निकटता और स्वाभाविकता से व्यक्त करता है। ‘अब भी’ ἔτι को और ‘गवाही’ न्यायिक संदर्भ में μαρτυρία को दर्शाता है।
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: क्योंकि हमने स्वयं ... सुन लिया है
  rationale: ‘स्वयं’ αὐτοὶ के बलाघात को बनाए रखता है। ‘सुन लिया है’ हाल में पूरी हुई क्रिया और उसके वर्तमान निर्णायक परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: उसके मुँह से
  rationale: यह प्रत्यक्ष रूप से उसी व्यक्ति से सुनने का मुहावरा है। हिंदी में ‘उसके मुँह से’ स्पष्ट और स्वाभाविक है; अलग से ‘अपने’ जोड़ना मूल यूनानी में उपस्थित नहीं है।
theological_decisions:
- issue: क्या सुनी गई बात को यीशु का दावा या आत्म-दोष सिद्ध करने वाली गवाही कहकर स्पष्ट किया जाए
  choice: ‘हमने स्वयं उसके मुँह से सुन लिया है’—कर्म को अनिर्दिष्ट रखा गया
  alternative: ‘हमने स्वयं उसके मुँह से यह गवाही सुन ली है’ या ‘हमने उसका दावा उसी के मुँह से सुन लिया है’
  rationale: ἠκούσαμεν के बाद यूनानी पाठ कोई स्पष्ट कर्म नहीं देता। ‘दावा’ या ‘गवाही’ जोड़ने से कथन की प्रकृति की व्याख्या हो जाती; संक्षिप्तता और न्यायिक तनाव को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। न्यायिक संदर्भ के कारण ‘गवाही’ चुना गया है और प्रश्न की आलंकारिक तीव्रता सुरक्षित रखी गई है।
