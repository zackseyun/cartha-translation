id: LUK.22.26
reference: Luke 22:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: hi
  text: पर तुम ऐसे न हो[a]। बल्कि तुममें जो बड़ा है, वह छोटे के समान बने[b], और जो अगुआई करता है, वह सेवा करनेवाले के समान बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर तुम्हारे बीच ऐसा न हो।” यूनानी वाक्य संक्षिप्त है और यीशु के शिष्यों को पिछले पद में वर्णित प्रतिष्ठा पाने की रीति से तीखे रूप में अलग करता है।
    reason: alternative_reading
  - marker: b
    text: “छोटे” का अर्थ केवल आयु में छोटा नहीं, बल्कि सामाजिक रूप से कनिष्ठ और कम प्रतिष्ठित व्यक्ति भी है।
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: पर तुम ऐसे न हो
  rationale: यह संक्षिप्त और तीखा विरोध बनाए रखता है तथा पिछले पद में वर्णित प्रभुत्व और प्रतिष्ठा की रीति की ओर संकेत करता है। यूनानी वाक्य अण्डाकार है, इसलिए हिन्दी में भी उसे अनावश्यक रूप से विस्तृत नहीं किया गया।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह निषेध के बाद आने वाले सकारात्मक निर्देश का प्रबल विरोध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: तुममें जो बड़ा है
  rationale: मείζων तुलनात्मक रूप है; ‘बड़ा’ समूह में ऊँची प्रतिष्ठा या दर्जे वाले व्यक्ति को व्यक्त करता है, न कि अनिवार्यतः आयु में बड़े या केवल ‘सबसे बड़े’ को।
- source_word: γινέσθω
  choice: बने
  rationale: γίνομαι के आज्ञार्थक रूप में भूमिका या व्यवहार अपनाने का गतिशील भाव है; ‘बने’ इसे स्थिर ‘हो’ की अपेक्षा अधिक स्पष्टता से रखता है।
- source_word: ὡς ὁ νεώτερος
  choice: छोटे के समान
  rationale: νεώτερος तुलनात्मक रूप से ‘कम आयु वाला’ कह सकता है, पर यहाँ सामाजिक रूप से कनिष्ठ और कम प्रतिष्ठित व्यक्ति का भाव प्रमुख है। ‘छोटा’ हिन्दी में दोनों संभावनाएँ खुली रखता है।
- source_word: ὁ ἡγούμενος
  choice: जो अगुआई करता है
  rationale: सहभागी क्रिया-रूप को सक्रिय हिन्दी वाक्यांश से व्यक्त किया गया है। ‘अगुआई’ सामुदायिक नेतृत्व बताता है, बिना किसी बाद की संस्थागत पदवी को पाठ में जोड़ने के।
- source_word: ὡς ὁ διακονῶν
  choice: सेवा करनेवाले के समान
  rationale: यह διακονέω के सक्रिय सेवा-भाव को बनाए रखता है और किसी औपचारिक धार्मिक पद का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: शिष्य-समुदाय में प्रतिष्ठा और नेतृत्व का स्वरूप
  choice: 'पद सामाजिक दर्जे के उलटाव को व्यक्त करता है: बड़े को छोटे जैसा और अगुआई करनेवाले को सेवा करनेवाले जैसा बनना है।'
  alternative: इसे कलीसियाई पदाधिकारियों के लिए अधिक संस्थागत आदेश के रूप में प्रस्तुत करना।
  rationale: मूल यूनानी ‘बड़े’ और ‘अगुआई करनेवाले’ की तुलना ‘छोटे’ और ‘सेवा करनेवाले’ से करता है। अनुवाद विनम्र सेवा की माँग बनाए रखता है, पर बाद की किसी विशिष्ट पद-व्यवस्था को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘बड़ा/छोटा’ मूल की तुलनात्मक तथा सामाजिक भाषा को बनाए रखते हैं; पादटिप्पणी ‘छोटे’ के सांस्कृतिक आशय को स्पष्ट करती है। ‘अगुआई करता है’ और ‘सेवा करनेवाला’ सक्रिय भूमिकाओं को दर्शाते हैं और अनावश्यक संस्थागत शब्दावली से बचते हैं।
