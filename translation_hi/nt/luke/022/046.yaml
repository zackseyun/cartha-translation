  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: hi
  text: और उसने उनसे कहा, “तुम क्यों सो रहे हो? उठो और प्रार्थना करो, ताकि तुम परीक्षा में न पड़ो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: उठो
  rationale: यहाँ कृदंत आज्ञार्थक बल रखता है और सो रहे चेलों को उठ खड़े होने का सीधा निर्देश देता है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: वर्तमान आज्ञार्थक रूप को स्वाभाविक हिन्दी में सीधे आदेश के रूप में व्यक्त किया गया है।
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: परीक्षा में न पड़ो
  rationale: शाब्दिक अर्थ ‘परीक्षा में प्रवेश करना’ है; हिन्दी का ‘परीक्षा में पड़ना’ इस मुहावरे का स्वाभाविक रूप है और πειρασμός की परीक्षा/प्रलोभन संबंधी अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: πειρασμός का अर्थ
  choice: परीक्षा
  alternative: प्रलोभन
  rationale: संदर्भ में परीक्षा और प्रलोभन दोनों की छाया संभव है। ‘परीक्षा’ व्यापक अर्थ बनाए रखता है और केवल भीतर उठने वाले प्रलोभन तक अर्थ सीमित नहीं करता।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी; मूल यूनानी के प्रश्न और दोहरे निर्देश का सीधा रूप सुरक्षित रखा गया है।
