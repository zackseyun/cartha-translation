source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: hi
  text: और उसी प्रकार उसने भोजन के बाद प्याला भी लिया और कहा, “यह प्याला मेरे लहू में नई वाचा[a] है—वह लहू, जो तुम्हारे लिए बहाया जा रहा है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नया नियम” अथवा “नया विधान।” यहाँ आशय लहू से स्थापित वाचा का है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “जो तुम्हारे लिए बहाया जा रहा है” पूरे कथन के अंत में आता है। उसका नपुंसकलिंग रूप ‘प्याला’ और ‘लहू’ दोनों से मेल खा सकता है; संदर्भ में इसका स्वाभाविक आशय यीशु के लहू से है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: कटोरा
  rationale: साधारण पीने के पात्र के लिए स्वाभाविक और परंपरागत बाइबलीय शब्द; ‘प्याला’ भी संभव है, पर ‘कटोरा’ मूल के सामान्य पात्र-सूचक अर्थ को स्पष्ट रखता है।
- source_word: ὡσαύτως
  choice: उसी प्रकार
  rationale: पिछले पद में रोटी के साथ किए गए कार्य से संबंध बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: μετὰ τὸ δειπνῆσαι
  choice: भोजन के बाद
  rationale: भोजन कर चुकने के बाद की समय-क्रमिकता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καινὴ διαθήκη
  choice: नई वाचा
  rationale: यहूदी और पुराने नियम की पृष्ठभूमि में διαθήκη किसी अंतिम वसीयत से अधिक परमेश्वर द्वारा स्थापित वाचा को सूचित करता है।
- source_word: ἐν τῷ αἵματί μου
  choice: मेरे लहू में
  rationale: ἐν की अस्पष्टता और वाचागत-बलिदानी मुहावरे को बिना ‘के द्वारा’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति थोपे सुरक्षित रखता है।
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: वह लहू, जो तुम्हारे लिए बहाया जा रहा है
  rationale: संदर्भगत अर्थ को स्पष्ट करता है कि बहाया जाने वाला यीशु का लहू है; ‘तुम्हारे लिए’ ὑπέρ की हितकारी/प्रतिनिधिक शक्ति बनाए रखता है, पर प्रायश्चित के किसी विशेष सिद्धांत को अतिरिक्त रूप से नहीं जोड़ता।
theological_decisions:
- issue: प्रभुभोज के संदर्भ में διαθήκη का अनुवाद
  choice: नई वाचा
  alternative: नया नियम / नया विधान
  rationale: लहू से स्थापित वाचा की पुराने नियम वाली पृष्ठभूमि यहाँ प्रमुख है। ‘नया नियम’ ऐतिहासिक अनुवाद है, लेकिन आधुनिक पाठक इसे बाइबल के दूसरे भाग के नाम के रूप में भी समझ सकता है।
- issue: ἐκχυννόμενον का आशय
  choice: अर्थ की दृष्टि से ‘मेरे लहू’ से संबद्ध
  alternative: कठोर व्याकरणिक रूप से ‘कटोरा’ से संबद्ध समझना
  rationale: नपुंसकलिंग कृदंत वाक्य के अंत में है और रूप की दृष्टि से ‘कटोरा’ के साथ मेल खाता है; फिर भी वाचागत और बलिदानी संदर्भ में बहाया जाने वाला पात्र नहीं, उसमें सूचित यीशु का लहू है। मुख्य पाठ स्वाभाविक आशय देता है और पादटिप्पणी वाक्यरचना की वास्तविक कठिनाई सुरक्षित रखती है।
- issue: क्रिया ‘लिया’ की आपूर्ति
  choice: पिछले पद से निहित क्रिया को हिन्दी में व्यक्त किया
  alternative: 'खंडित रूप: ‘और उसी प्रकार भोजन के बाद कटोरा भी…’'
  rationale: यूनानी में पिछले पद की क्रिया यहाँ लुप्त लेकिन स्पष्ट रूप से निहित है। हिन्दी में उसे व्यक्त करना आवश्यक है ताकि वाक्य स्वाभाविक और बोधगम्य रहे; इससे कोई नई घटना नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘लहू’ और ‘वाचा’ को उनके गहरे बाइबलीय संबंधों के कारण रखा गया है। यूनानी की दीर्घवृत्तीय रचना को स्वाभाविक बनाने के लिए पिछले पद से निहित ‘लिया’ जोड़ा गया है।
