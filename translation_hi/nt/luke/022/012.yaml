translation:
  language: hi
  text: और वह तुम्हें ऊपर की मंज़िल पर एक बड़ा, पहले से व्यवस्थित कमरा[a] दिखाएगा। वहीं तैयारी करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ऊपर की मंज़िल पर एक बड़ा कमरा, जो पहले से तैयार किया हुआ था’; अथवा, ‘ऊपर की मंज़िल पर एक बड़ा कमरा, जिसमें बिछावन या साज-सामान लगा हुआ था।’
    reason: ἐστρωμένον का अर्थ बिछा हुआ, साज-सामान सहित व्यवस्थित, या पहले से तैयार किया हुआ हो सकता है।
lexical_decisions:
- source_word: κἀκεῖνος
  choice: और वह
  rationale: καί + ἐκεῖνος पिछली बात में बताए गए घर के स्वामी की ओर संकेत करते हुए निर्देशों की कड़ी आगे बढ़ाता है; ‘और वह’ स्वाभाविक और पर्याप्त रूप से निश्चित है।
- source_word: δείξει ὑμῖν
  choice: तुम्हें ... दिखाएगा
  rationale: दείξει का भविष्यकालीन अर्थ ‘दिखाएगा’ है और ὑμῖν को हिन्दी में ‘तुम्हें’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀνάγαιον μέγα
  choice: ऊपर का एक बड़ा ... कमरा
  rationale: ἀνάγαιον ऊपरी मंज़िल के कमरे को दर्शाता है और μέγα उसके बड़े आकार को; यह वाक्यांश अर्थ को स्पष्ट रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐστρωμένον
  choice: सजा हुआ
  rationale: στρώννυμι के पूर्ण निष्क्रिय कृदन्त में बिछी या व्यवस्थित की हुई वस्तुओं से तैयार अवस्था का भाव है। ‘सजा हुआ’ उस अवस्था को संक्षेप में व्यक्त करता है, जबकि सम्भव अर्थों को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: वहीं तैयारी करना
  rationale: ἐκεῖ को बलयुक्त ‘वहीं’ और बहुवचन आदेश ἑτοιμάσατε को प्रसंगानुकूल सामान्य हिन्दी निर्देश ‘तैयारी करना’ से व्यक्त किया गया है।
