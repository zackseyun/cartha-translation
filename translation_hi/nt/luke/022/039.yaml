  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: hi
  text: और वह बाहर निकलकर अपनी प्रथा के अनुसार जैतून के पहाड़ पर गया, और चेले भी उसके पीछे चले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: बाहर निकलकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है; ‘बाहर निकलकर’ हिंदी में क्रम और प्रवाह दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπορεύθη
  choice: गया
  rationale: सामान्य कथात्मक गति के लिए सरल और स्वाभाविक हिंदी क्रिया।
- source_word: κατὰ τὸ ἔθος
  choice: अपनी रीति के अनुसार
  rationale: वाक्यांश नियमित प्रथा को दर्शाता है। हिंदी में ‘अपनी’ जोड़ने से संदर्भगत कर्ता स्पष्ट होता है और वही अर्थ स्वाभाविक ढंग से आता है, यद्यपि यूनानी में संबंधवाचक सर्वनाम स्पष्ट नहीं है।
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून पहाड़ पर
  rationale: यह मान्य भौगोलिक नाम का सरल, प्रचलित हिंदी रूप है; εἰς को गंतव्य के संदर्भ में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἠκολούθησαν
  choice: पीछे हो लिए
  rationale: यह वास्तविक साथ चलने और शिष्य द्वारा अनुसरण करने, दोनों रंगों को सहज कथात्मक हिंदी में बनाए रखता है।
- source_word: οἱ μαθηταί
  choice: चेले
  rationale: μαθηταί के लिए साधारण पाठकों में परिचित, संक्षिप्त बाइबिलीय हिंदी शब्द; यूनानी में ‘उसके’ स्पष्ट नहीं होने के कारण उसे नहीं जोड़ा गया।
- source_word: καὶ ... δὲ ... καὶ
  choice: फिर ... और ... भी
  rationale: आरंभिक καί को हिंदी कथानक में ‘फिर’, δέ को हल्की निरंतरता हेतु ‘और’, तथा अंतिम καί की योगात्मक शक्ति को ‘भी’ से व्यक्त किया गया है।
theological_decisions:
- issue: रीति का कर्ता यीशु को स्पष्ट करना
  choice: ‘अपनी रीति के अनुसार’
  alternative: ‘रीति के अनुसार’
  rationale: यूनानी κατὰ τὸ ἔθος में ‘उसकी/अपनी’ शब्दशः नहीं है, पर निकटतम कर्ता और संदर्भ स्पष्टतः यीशु है। अकेला ‘रीति के अनुसार’ आधुनिक हिंदी में अधूरा और अस्वाभाविक लगेगा; ‘अपनी’ कोई अलग धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता, बल्कि निहित संबंध को स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिंदी। ‘जैतून पहाड़’ और ‘चेले’ जैसे परिचित बाइबिलीय पद रखे गए हैं, पर वाक्य-रचना समकालीन और सामान्य पाठक के लिए स्पष्ट है।
