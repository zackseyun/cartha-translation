- from: फिर वह बाहर निकलकर अपनी रीति के अनुसार जैतून पहाड़ पर गया, और चेले भी उसके पीछे हो लिए।
  to: और वह बाहर निकलकर अपनी प्रथा के अनुसार जैतून के पहाड़ पर गया, और चेले भी उसके पीछे चले।
  rationale: The revision retains the source sequence and customary-action sense, while using idiomatic modern Hindi for the Mount of Olives and a clearer equivalent for “followed.” No footnote is needed, since the translation does not preserve a disputed or materially ambiguous alternative requiring explanation.
