review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the aorist participle, the customary visit, the destination, and the disciples’ additive participation. However, “फिर” adds a somewhat stronger sequential nuance than the initial καί requires, and “पीछे हो लिए” is less direct than ἠκολούθησαν and can sound colloquial or ambiguous.
  naturalness: “जैतून पहाड़” is not idiomatic modern Hindi for the established geographic designation. “जैतून के पहाड़” is the natural standard form. “उसके पीछे चले” is clear, contemporary narrative Hindi.
  terminology: “चेले” is an established and suitable rendering for μαθηταί in this register. “अपनी प्रथा के अनुसार” naturally conveys κατὰ τὸ ἔθος; the possessive is contextually entailed without introducing a doctrinal claim.
  issues:
  - severity: medium
    issue: Place name is rendered as “जैतून पहाड़.”
    rationale: The Greek designation Ὄρος τῶν Ἐλαιῶν is conventionally and naturally rendered in Hindi as “जैतून के पहाड़.” The draft’s noun-noun construction is awkward.
  - severity: low
    issue: “पीछे हो लिए” is used for ἠκολούθησαν.
    rationale: Although it can indicate following, it is comparatively colloquial and less precise. “उसके पीछे चले” clearly expresses physical following while retaining the narrative sense.
  - severity: low
    issue: Initial “फिर” is stronger than necessary for καί.
    rationale: A simple “और” preserves the source’s mild narrative linkage without adding an explicit ‘then/afterward’ emphasis.
  revised_text: और वह बाहर निकलकर अपनी प्रथा के अनुसार जैतून के पहाड़ पर गया, और चेले भी उसके पीछे चले।
  revised_footnotes: []
