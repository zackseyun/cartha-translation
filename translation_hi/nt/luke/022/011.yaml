source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: hi
  text: और तुम घर के मुखिया से कहो, ‘गुरु आपसे कहते हैं, “वह अतिथि-कक्ष[a] कहाँ है जहाँ मैं अपने शिष्यों के साथ फसह का भोजन करूँ?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ठहरने की जगह।’ यूनानी κατάλυμα ठहरने के स्थान या अतिथि-कक्ष को दर्शाता है। यहाँ इसका अर्थ विशेष रूप से ‘सराय’ नहीं है, और ‘ऊपरी कमरा’ अगले पद में बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: घर के मुखिया
  rationale: οἰκοδεσπότης घराने के प्रधान या अधिकारी व्यक्ति को दर्शाता है। ‘घर के मुखिया’ स्वामित्व को अनावश्यक रूप से निश्चित किए बिना इस अधिकार-सूचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ διδάσκαλος
  choice: गुरु
  rationale: διδάσκαλος यहाँ यीशु के लिए पहचाने जाने वाले संबोधन के रूप में आया है। ‘गुरु’ हिन्दी में शिक्षक और शिष्यों के संबंध को स्वाभाविक रूप से व्यक्त करता है; ‘मालिक’ मूल अर्थ से दूर होता और ‘शिक्षक’ यहाँ अत्यधिक कक्षागत लगता।
- source_word: κατάλυμα
  choice: अतिथि-कक्ष
  rationale: κατάλυμα ठहरने या अतिथियों के रहने के स्थान को सूचित कर सकता है। घरेलू प्रसंग में ‘अतिथि-कक्ष’ उपयुक्त है; यह न तो इसे सराय बनाता है और न अगले पद से ‘ऊपरी कमरा’ पहले ही जोड़ता है।
- source_word: τὸ πάσχα
  choice: फसह का भोजन
  rationale: πάσχα पर्व या उससे जुड़े भोजन को दर्शा सकता है। यहाँ φάγω (‘खाऊँ’) के कारण भोजन विशेष रूप से अभिप्रेत है; ‘फसह का भोजन’ हिन्दी पाठक के लिए अर्थ स्पष्ट करता है, जबकि यहूदी पर्व का नाम बनाए रखता है।
- source_word: μετὰ τῶν μαθητῶν μου
  choice: अपने शिष्यों के साथ
  rationale: μαθητής केवल विद्यार्थी नहीं, बल्कि किसी गुरु का अनुसरण करके उससे सीखने वाला व्यक्ति है। ‘शिष्य’ इस संबंधपरक अर्थ को बनाए रखता है।
- source_word: φάγω
  choice: भोजन करूँ
  rationale: ὅπου के साथ अओरिस्ट सब्जंक्टिव भावी या अभिप्रेत क्रिया को व्यक्त करता है। ‘जहाँ मैं … भोजन करूँ’ हिन्दी में इस अनिश्चित/अभिप्रेत भाव को स्वाभाविक रूप से रखता है।
- source_word: ἐρεῖτε
  choice: तुम … से कहना
  rationale: यूनानी भविष्यत् निर्देश के रूप में प्रयुक्त है। हिन्दी में ‘कहना’ प्रसंगानुकूल निर्देश को अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना कथन की विषयवस्तु बदले।
theological_decisions:
- issue: διδάσκαλος के द्वारा यीशु का आत्म-संदर्भ
  choice: गुरु
  alternative: शिक्षक; स्वामी
  rationale: मूल शब्द शिक्षण-संबंधी उपाधि है। ‘गुरु’ हिन्दी में उस उपाधि और गुरु-शिष्य संबंध को व्यक्त करता है; ‘स्वामी’ अधिकार का ऐसा अर्थ जोड़ सकता है जो इस शब्द में स्वयं निहित नहीं है।
- issue: πάσχα का संदर्भ
  choice: फसह का भोजन
  alternative: फसह; फसह का पर्व
  rationale: πάσχα में पर्व और भोजन दोनों का अर्थ संभव है, पर ‘खाने’ की क्रिया इस पद में भोजन को सामने लाती है। इसलिए भोजन को स्पष्ट किया गया है, पर पर्व का पारंपरिक नाम ‘फसह’ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धरणों के भीतर उद्धरण को स्पष्ट रखा गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘घर के स्वामी’ के बाद था, जबकि उसकी टिप्पणी κατάλυμα पर है; इसलिए स्रोत-संगति के लिए चिह्न ‘अतिथि-कक्ष’ के बाद रखा गया है।
