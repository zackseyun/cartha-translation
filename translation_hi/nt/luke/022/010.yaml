reference: Luke 22:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: hi
  text: उसने उनसे कहा, “देखो[a], जब तुम नगर में प्रवेश करोगे, तो पानी का घड़ा लिए हुए एक आदमी तुम्हें मिलेगा। वह जिस घर में प्रवेश करेगा, उसके पीछे उस घर में चले जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “देखो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह आधुनिक हिन्दी में ध्यान आकर्षित करने वाला स्वाभाविक शब्द है और यूनानी पद के संकेतात्मक बल को बनाए रखता है।
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: जब तुम नगर में प्रवेश करोगे
  rationale: सम्बन्धकारक निरपेक्ष रचना यहाँ कालसूचक है; हिन्दी में यह रूप प्रवेश के समय होने वाली घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συναντήσει ὑμῖν
  choice: तुम्हें मिलेगा
  rationale: भविष्यकालीन क्रिया और सम्प्रदान कारक का सरल, प्रसंगानुकूल हिन्दी अर्थ है कि वह व्यक्ति उनके सामने आएगा या उन्हें मिलेगा।
- source_word: ἄνθρωπος
  choice: एक पुरुष
  rationale: प्रसंग में एक विशिष्ट पुरुष का उल्लेख है; ‘पुरुष’ लिंग-सटीक और गरिमापूर्ण हिन्दी है।
- source_word: κεράμιον ὕδατος
  choice: पानी का घड़ा
  rationale: यह स्पष्ट और स्वाभाविक हिन्दी है। κεράμιον के मिट्टी के पात्र होने की सम्भावना को मुख्य पाठ में अनावश्यक रूप से निश्चित किए बिना पादटिप्पणी में रखा गया है।
- source_word: βαστάζων
  choice: उठाए हुए
  rationale: यह उस पुरुष की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀκολουθήσατε αὐτῷ
  choice: उसके पीछे चले जाना
  rationale: आज्ञार्थक बल को बनाए रखते हुए यह प्रसंग में किसी व्यक्ति का अनुसरण करने के लिए स्वाभाविक आधुनिक हिन्दी है।
- source_word: οἰκίαν
  choice: घर
  rationale: दिशासूचक प्रसंग में οἰκία का ठोस और सामान्य हिन्दी समतुल्य ‘घर’ है।
- source_word: εἰς ἣν εἰσπορεύεται
  choice: जिस घर में वह प्रवेश करे
  rationale: यह सम्बन्धवाचक उपवाक्य उस विशिष्ट घर की पहचान कराता है और यूनानी पाठ की दिशासूचक धारणा को बनाए रखता है।
