review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sequence and core referents accurately: Jesus directs the disciples to a man carrying a water jar and tells them to follow him into the house. The future sense of the Greek relative clause is better made explicit in Hindi.'
  naturalness: ‘एक पुरुष’ and ‘घड़ा उठाए हुए’ are understandable but somewhat stiff in modern narrative Hindi. ‘एक आदमी’ and ‘पानी का घड़ा लिए हुए’ are more natural. The wording ‘जिस घर में वह प्रवेश करे’ can sound subjunctive or non-future; an explicit future form reads more clearly.
  terminology: ‘नगर,’ ‘घर,’ and ‘प्रवेश’ fit the register. ‘आदमी’ accurately retains the specifically male referent of ἄνθρωπος without the elevated or impersonal tone of ‘पुरुष.’ The footnote should describe κεράμιον as an earthenware vessel without the awkward phrase ‘मिट्टी का पानी का घड़ा.’
  issues:
  - severity: low
    issue: The future relative clause is rendered with ‘प्रवेश करे.’
    rationale: Although this construction can occur in Hindi, it can be read as subjunctive rather than as the Greek future ‘he enters/will enter.’ ‘प्रवेश करेगा’ makes the intended future event clear.
  - severity: low
    issue: ‘एक पुरुष’ and ‘घड़ा उठाए हुए’ are less idiomatic than necessary.
    rationale: Modern standard Hindi narrative more naturally uses ‘एक आदमी’ and ‘पानी का घड़ा लिए हुए,’ while preserving the source meaning.
  - severity: low
    issue: The earthenware alternative in footnote b is awkwardly phrased.
    rationale: ‘मिट्टी का पानी का घड़ा’ is syntactically clumsy. A note can state directly that κεράμιον may specifically denote an earthenware vessel.
  revised_text: उसने उनसे कहा, “देखो[a], जब तुम नगर में प्रवेश करोगे, तो पानी का घड़ा लिए हुए एक आदमी तुम्हें मिलेगा। वह जिस घर में प्रवेश करेगा, उसके पीछे उस घर में चले जाना।”
  revised_footnotes:
