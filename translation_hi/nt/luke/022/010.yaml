    text: κεράμιον विशेष रूप से मिट्टी के पात्र को भी दर्शा सकता है; इसलिए “मिट्टी का घड़ा” भी सम्भव है।
    reason: lexical_alternative
  revision_rationale: The revision clarifies the future force of the final relative clause, improves modern Hindi idiom, and smooths the lexical footnote. It retains the source’s male referent, the water jar, the command to follow, and the directional sense of entering the house. Footnote b remains anchored to ‘घड़ा.’
