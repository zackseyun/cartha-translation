translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर’ बाइबलीय कथन-शैली के अनुकूल है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक रखा गया है।
