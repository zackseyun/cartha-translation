- from: उसने उनसे कहा, “देखो[a], जब तुम नगर में प्रवेश करोगे, तो पानी का घड़ा[b] उठाए हुए एक पुरुष तुम्हें मिलेगा। जिस घर में वह प्रवेश करे, उसमें उसके पीछे चले जाना।”
  to: उसने उनसे कहा, “देखो[a], जब तुम नगर में प्रवेश करोगे, तो पानी का घड़ा लिए हुए एक आदमी तुम्हें मिलेगा। वह जिस घर में प्रवेश करेगा, उसके पीछे उस घर में चले जाना।”
  rationale: The revision clarifies the future force of the final relative clause, improves modern Hindi idiom, and smooths the lexical footnote. It retains the source’s male referent, the water jar, the command to follow, and the directional sense of entering the house. Footnote b remains anchored to ‘घड़ा.’
