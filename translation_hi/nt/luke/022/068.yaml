  text: But if I ask[a], you will certainly not answer.
translation:
  language: hi
  text: पर यदि मैं पूछूँ, तो तुम किसी भी तरह उत्तर नहीं दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; आधुनिक और गरिमापूर्ण हिन्दी में ‘यदि’ स्वाभाविक है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन के साथ विरोध या भिन्नता दिखाता है; ‘पर’ उस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐρωτήσω
  choice: मैं पूछूँ
  rationale: ἐὰν के साथ एओरिस्ट सब्जंक्टिव संभावित भावी शर्त व्यक्त करता है। ‘पूछूँ’ बिना अनावश्यक रूप से ‘पूछताछ’ का कठोर भाव जोड़े मूल अर्थ रखता है।
- source_word: οὐ μὴ
  choice: किसी भी तरह ... नहीं
  rationale: οὐ μή सब्जंक्टिव के साथ प्रबल निषेध है। ‘किसी भी तरह ... नहीं’ इस बल को वर्तमान हिन्दी में स्पष्ट रखता है।
- source_word: ἀποκριθῆτε
  choice: तुम ... उत्तर नहीं दोगे
  rationale: यह रूप आकार में निष्क्रिय, पर अर्थ में ‘उत्तर देना’ है। द्वितीय पुरुष बहुवचन को ‘तुम’ से व्यक्त किया गया है, जो संबोधित परिषद-सदस्यों के लिए स्पष्ट और स्वाभाविक है।
