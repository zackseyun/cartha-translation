source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: hi
  text: पर यीशु ने उत्तर दिया, “बस, अब इतना ही!” फिर उसने उसका कान छूकर उसे चंगा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: बस, अब इतना ही!
  rationale: यह संक्षिप्त निषेध प्रसंग में शिष्यों की हिंसक कार्रवाई रोकता है। यूनानी वाक्यांश का शाब्दिक अर्थ संदर्भानुसार कुछ अस्पष्ट है; यह हिंदी रूप उस तीखे, रोक लगाने वाले भाव को स्वाभाविक ढंग से रखता है।
- source_word: ὠτίου
  choice: कान
  rationale: यह οὖς का लघु रूप है, पर यहाँ सामान्य हिंदी में ‘कान’ कहना स्वाभाविक है; ‘छोटा कान’ अर्थ को अनुचित रूप से उभारता।
- source_word: ἰάσατο
  choice: चंगा कर दिया
  rationale: क्रिया शारीरिक उपचार को स्पष्ट रूप से व्यक्त करती है; ‘चंगा कर दिया’ वर्तमान हिंदी बाइबलीय शैली में सहज और सटीक है।
theological_decisions:
- issue: यीशु के आदेश का अभिप्राय
  choice: बस, अब इतना ही!
  alternative: इन्हें यहाँ तक करने दो
  rationale: Ἐᾶτε ἕως τούτου व्याकरणतः एक से अधिक तरह समझा जा सकता है। निकट प्रसंग में तलवार के वार के बाद यीशु का हस्तक्षेप हिंसा रोकने के रूप में अधिक स्वाभाविक है, किंतु अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: चंगे किए गए अंग और व्यक्ति के बीच सर्वनाम-संबंध
  choice: उसका कान छूकर उसे चंगा कर दिया
  alternative: कान को चंगा कर दिया
  rationale: यूनानी αὐτόν पुल्लिंग है और स्वाभाविक रूप से व्यक्ति की ओर संकेत करता है, जबकि ὠτίου नपुंसकलिंग है। इसलिए हिंदी में व्यक्ति को चंगा करने की अभिव्यक्ति रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’ δέ का हल्का विरोध व्यक्त करता है; ‘फिर’ καί को घटनाक्रम के स्वाभाविक हिंदी संयोजक के रूप में प्रस्तुत करता है।
