  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: hi
  text: लेकिन देखो, जो मुझे पकड़वाने वाला है, उसका हाथ मेरे साथ मेज़ पर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: लेकिन
  rationale: यहाँ यह पिछले कथन से तीखा विरोध या मोड़ व्यक्त करता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और स्पष्ट है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संबोधन है; ‘देखो’ मूल बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῦ παραδιδόντος με
  choice: जो मुझे पकड़वाने वाला है
  rationale: παραδίδω का मूल भाव किसी को दूसरे के हवाले करना है और इस प्रसंग में गिरफ्तारी के लिए पकड़वाना अभिप्रेत है। यह अनुवाद केवल भावात्मक ‘विश्वासघात’ कहने के बजाय क्रिया के ठोस प्रसंग को बनाए रखता है।
- source_word: ἡ χεὶρ ... μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: उसका हाथ मेरे साथ मेज़ पर है
  rationale: मूल की सजीव ‘हाथ’ वाली छवि और साथ भोजन करने की निकटता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: παραδίδω को ‘विश्वासघात करना’ या ‘पकड़वाना’ कहना
  choice: पकड़वाने वाला
  alternative: विश्वासघात करने वाला
  rationale: प्रसंग में दोनों भाव जुड़े हैं, पर यूनानी क्रिया का प्रत्यक्ष अर्थ सौंपना या हवाले करना है। ‘पकड़वाने वाला’ गिरफ्तारी के प्रसंग और मूल क्रिया की ठोस कार्रवाई को सामने रखता है, जबकि विश्वासघात का नैतिक अर्थ प्रसंग से स्पष्ट रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक कथन के अनुरूप रखी गई है। ‘देखो’ ध्यानाकर्षण का स्वाभाविक रूप है और वाक्य की असहज किंतु जानबूझकर रखी गई ‘हाथ ... मेज़ पर’ छवि मूल पाठ के तनाव को बनाए रखती है।
