  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: hi
  text: और वह चला गया और उसने प्रधान याजकों तथा अधिकारियों से विचार-विमर्श किया कि वह यीशु को उन्हें कैसे सौंप दे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के साथ विश्वासघात करे।” यूनानी क्रिया का अर्थ “सौंपना,” “हवाले करना,” या इस प्रसंग में “विश्वासघात करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अधिकारी” संभवतः मंदिर से संबद्ध अधिकारी या मंदिर-रक्षक दल के अधिकारी थे, रोमी सैनिक नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: वहाँ से चला गया
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की गति दर्शाता है। हिंदी में संयुक्त वाक्य स्वाभाविक है; संदर्भगत ‘वहाँ से’ अलग हो जाने का भाव स्पष्ट करता है।
- source_word: συνελάλησεν
  choice: विचार-विमर्श किया
  rationale: यह क्रिया केवल बोलने के बजाय आपसी बातचीत या सलाह-मशविरा करने का भाव रखती है।
- source_word: ἀρχιερεῦσιν
  choice: प्रधान याजकों
  rationale: बहुवचन यहाँ प्रमुख याजकीय अधिकारियों को सूचित करता है, न कि एक ही समय कई महायाजकों को।
- source_word: στρατηγοῖς
  choice: अधिकारियों
  rationale: मंदिर के संदर्भ में ये संभवतः मंदिर-रक्षक दल से जुड़े अधिकारी थे; मुख्य पाठ में व्यापक पद रखा गया और सांस्कृतिक विशेषता पादटिप्पणी में दी गई है।
- source_word: τὸ πῶς
  choice: इस बारे में … कि … कैसे
  rationale: यह अभिव्यक्ति बातचीत की विषय-वस्तु प्रस्तुत करती है; हिंदी में यह संरचना स्पष्ट और स्वाभाविक है।
- source_word: παραδῷ
  choice: हाथ सौंपे
  rationale: παραδίδωμι का मूल भाव किसी को दूसरे के अधिकार में सौंपना है। प्रसंग में विश्वासघात निहित है, पर मुख्य पाठ व्यापक शाब्दिक अर्थ को सुरक्षित रखता है।
- source_word: αὐτοῖς ... αὐτόν
  choice: उनके हाथ … यीशु को
  rationale: हिंदी में अस्पष्ट सर्वनाम ‘उसे’ से बचने के लिए संदर्भित व्यक्ति का नाम ‘यीशु’ रखा गया, जबकि ‘उनके’ प्रधान याजकों और अधिकारियों की ओर संकेत करता है।
theological_decisions:
- issue: यहूदा के कार्य में παραδῷ का अनुवाद
  choice: यीशु को उनके हाथ सौंपे
  alternative: उनके साथ विश्वासघात करके यीशु को पकड़वा दे
  rationale: प्रसंग यहूदा के विश्वासघात का है, फिर भी यूनानी क्रिया का अर्थ व्यापक रूप से ‘सौंपना’ भी है। मुख्य पाठ इस अर्थगत विस्तार को बनाए रखता है और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली। ‘विचार-विमर्श’ योजनाबद्ध आपसी बातचीत को व्यक्त करता है। ‘यीशु’ का स्पष्ट उल्लेख हिंदी में सर्वनामगत अस्पष्टता घटाता है; मूल में यहाँ ‘उसे’ है।
