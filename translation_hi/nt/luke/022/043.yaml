lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: यह ὁράω का एओरिस्ट कर्मवाच्य रूप है, जो यहाँ प्रकट होने के अर्थ में प्रयुक्त हुआ है। ‘दिखाई दिया’ स्वाभाविक हिन्दी में इस प्रकट होने की घटना को व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की प्रगति को सहज रूप से व्यक्त करता है, बिना अनावश्यक विरोध दिखाए।
- source_word: αὐτῷ
  choice: उन्हें
  rationale: ὤφθη के साथ संप्रदान कारक उस व्यक्ति को बताता है जिसे स्वर्गदूत दिखाई दिया; आदरसूचक सर्वनाम यीशु की ओर संकेत करता है।
- source_word: ἄγγελος
  choice: एक स्वर्गदूत
  rationale: स्वर्गीय संदर्भ में ἄγγελος का अर्थ सामान्य ‘दूत’ नहीं, बल्कि स्वर्गदूत है। अनिश्चित संज्ञा के लिए ‘एक’ स्वाभाविक है।
- source_word: ἀπ’ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह पदबंध स्वर्गीय उद्गम बताता है; ‘स्वर्ग से’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐνισχύων
  choice: सामर्थ्य देता रहा
  rationale: वर्तमान कृदंत दिखाई देने के साथ चल रही सहगामी क्रिया व्यक्त करता है। ‘सामर्थ्य देता रहा’ बल प्रदान करने के अर्थ और क्रिया की जारी प्रकृति को स्पष्ट करता है।
- source_word: αὐτόν
  choice: उन्हें
  rationale: यह सीधा कर्म यीशु की ओर संकेत करता है; हिन्दी में आदरसूचक ‘उन्हें’ उपयुक्त है।
theological_decisions:
- issue: लूका 22:43 की पाठगत स्थिति
  choice: प्रदान किए गए SBLGNT पाठ के अनुसार पद को मुख्य पाठ में शामिल किया गया है।
  alternative: कुछ पांडुलिपियों में पद 43–44 नहीं हैं।
  rationale: दिए गए यूनानी स्रोत में यह पद उपस्थित है, इसलिए उसका अनुवाद मुख्य पाठ में रखा गया है। पांडुलिपि-परंपरा में इसके पाठगत विवाद को बिना छिपाए पादटिप्पणी में बताया गया है।
