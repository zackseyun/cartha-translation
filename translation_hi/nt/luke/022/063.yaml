  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: hi
  text: और जो पुरुष उसे पकड़े हुए थे, वे उसे पीटते हुए उसका उपहास कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो उसे हिरासत में रखे हुए थे’
    reason: συνέχοντες का एक अधिक स्पष्ट हिरासत-संबंधी अर्थ भी संभव है।
lexical_decisions:
- source_word: συνέχοντες
  choice: पकड़ रखा था
  rationale: यहाँ συνέχω का अर्थ यीशु को अपने नियंत्रण में पकड़े या रोके रखना है। यह अभिव्यक्ति ठोस शारीरिक अर्थ बनाए रखती है, पर औपचारिक हिरासत को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: ἐνέπαιζον
  choice: उपहास कर रहे थे
  rationale: ἐμπαίζω यहाँ शत्रुतापूर्ण ढंग से मज़ाक उड़ाने और अपमानित करने को व्यक्त करता है। ‘उपहास कर रहे थे’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: αὐτῷ
  choice: उसका
  rationale: यूनानी में कर्म संप्रदान कारक में है; स्वाभाविक हिन्दी में ‘उसका उपहास करना’ इस संबंध को ठीक प्रकार व्यक्त करता है।
- source_word: δέροντες
  choice: उसे पीटते हुए
  rationale: यह कृदंत उपहास के साथ चल रही शारीरिक मारपीट को दर्शाता है। ‘पीटते हुए’ निरंतर और सहवर्ती क्रिया को व्यक्त करता है, जबकि ‘कोड़े लगाते हुए’ मूल से अधिक विशिष्ट होता।
- source_word: ἄνδρες
  choice: पुरुषों
  rationale: मूल पाठ सामान्य शब्द ‘पुरुष’ कहता है, न कि विशेष रूप से ‘पहरेदार’ या ‘सैनिक’; इसलिए संदर्भ से कोई पदनाम नहीं जोड़ा गया।
- source_word: Καὶ
  choice: और
  rationale: यह साधारण कथात्मक संयोजक यूनानी वाक्य-प्रवाह को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
theological_decisions:
- issue: यीशु को सताने वालों की पहचान
  choice: जिन पुरुषों ने उसे पकड़ रखा था
  alternative: जिन पहरेदारों ने उसे पकड़ रखा था
  rationale: मूल में सामान्य संज्ञा ἄνδρες है। संदर्भ हिरासत में रखने वाले कर्मियों की ओर संकेत करता है, फिर भी अनुवाद उनकी भूमिका को मूल पाठ से अधिक संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। अपूर्णकालीन क्रिया को ‘कर रहे थे’ और साथ चल रही क्रिया को ‘पीटते हुए’ से व्यक्त किया गया है।
