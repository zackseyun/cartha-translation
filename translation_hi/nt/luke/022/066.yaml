  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: hi
  text: और जब दिन निकला[a], तो जनता के बुज़ुर्गों की परिषद्—प्रधान याजक और शास्त्री दोनों—इकट्ठी हुई, और वे यीशु को अपनी परिषद् में ले गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “जब उजाला हुआ” या “भोर के समय।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “अपनी परिषद् के सामने।” यहाँ यूनानी शब्द परिषद् स्वयं, उसकी औपचारिक बैठक, या सभा-स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: जब दिन हुआ
  rationale: यह यूनानी वाक्यांश की क्रियात्मक बनावट और समय-सूचक अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है; ‘भोर होते ही’ सम्भव है, पर वह समय को कुछ अधिक विशिष्ट करता है।
- source_word: συνήχθη
  choice: इकट्ठी हुई
  rationale: निष्क्रिय यूनानी रूप परिषद् के एकत्र होने को व्यक्त करता है। हिन्दी में परिषद् के साथ स्त्रीलिंग एकवचन स्वाभाविक है।
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: लोगों के पुरनियों की परिषद्
  rationale: πρεσβυτέριον किसी अमूर्त ‘पुरनियाई’ के बजाय पुरनियों के संगठित निकाय को दर्शाता है; ‘परिषद्’ इस संस्थागत भाव को स्पष्ट करता है।
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: प्रधान याजक और शास्त्री दोनों
  rationale: τε καί के समावेशी संबंध को ‘दोनों’ व्यक्त करता है और दोनों ऐतिहासिक समूहों के प्रचलित हिन्दी पद सुरक्षित रखता है।
- source_word: ἀπήγαγον αὐτόν
  choice: वे यीशु को ... ले गए
  rationale: ἀπάγω का दिशात्मक अर्थ ‘ले गए’ से स्वाभाविक रूप में आता है। सर्वनाम के स्थान पर ‘यीशु’ रखने से पृथक पद के रूप में पढ़े जाने पर हिन्दी पाठ स्पष्ट रहता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: अपनी महासभा में
  rationale: ‘महासभा’ औपचारिक यहूदी शासकीय परिषद्/अधिवेशन को सामान्य पाठक के लिए समझने योग्य बनाता है और पहले आए πρεσβυτέριον के लिए प्रयुक्त ‘परिषद्’ से स्रोत की शब्द-विविधता को अलग रखता है। ‘में’ εἰς की दिशात्मकता रखता है, जबकि पादटिप्पणी निकाय, बैठक और स्थान की सम्भावना बताती है।
theological_decisions:
- issue: यहूदी शासकीय निकाय के लिए संस्थागत शब्दावली
  choice: πρεσβυτέριον को ‘पुरनियों की परिषद्’ और συνέδριον को ‘महासभा’ कहना
  alternative: दोनों को ‘परिषद्’ कहना, अथवा συνέδριον का लिप्यंतरण ‘सन्हेद्रिन’ करना
  rationale: मूल पद दो संबंधित पर अलग शब्दों का प्रयोग करता है। अलग हिन्दी शब्द उस भिन्नता को बनाए रखते हैं; ‘महासभा’ किसी सम्प्रदायगत व्याख्या के बिना संस्थागत अर्थ देता है और अपरिचित लिप्यंतरण से बचता है।
- issue: εἰς τὸ συνέδριον में निकाय, अधिवेशन या स्थान
  choice: मुख्य पाठ में ‘अपनी महासभा में’ और पादटिप्पणी में सम्भव अर्थ
  alternative: केवल ‘अपनी महासभा के सामने’ या ‘सभा-कक्ष में’
  rationale: συνέδριον परिषद् स्वयं, उसका औपचारिक अधिवेशन, या सभा-स्थान सूचित कर सकता है। मुख्य पाठ और पादटिप्पणी का संयोजन वास्तविक अस्पष्टता को बिना निर्णायक रूप से सुलझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘पुरनियों’, ‘प्रधान याजक’ और ‘शास्त्री’ जैसे स्थापित बाइबलीय पद रखे गए हैं; वाक्य में डैश परिषद् और उसके घटक समूहों का संबंध स्पष्ट करता है।
