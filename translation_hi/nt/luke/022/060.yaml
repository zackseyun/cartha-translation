  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: hi
  text: पर पतरस ने कहा, “आदमी, मैं नहीं जानता कि तुम क्या कह रहे हो।” वह अभी बोल ही रहा था कि तुरन्त एक मुर्गे ने बाँग दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले आरोप और पतरस के उत्तर के बीच विरोध और कथात्मक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἄνθρωπε
  choice: भाई
  rationale: सम्बोधन में प्रयुक्त ἄνθρωπε किसी पुरुष को सीधे पुकारता है। शाब्दिक “मनुष्य” हिन्दी में अस्वाभाविक है; “भाई” सामान्य बोलचाल का सीधा सम्बोधन है और “महोदय” जैसी अतिरिक्त विनम्रता नहीं जोड़ता।
- source_word: οὐκ οἶδα
  choice: मैं नहीं जानता
  rationale: οἶδα के वर्तमान अर्थ और स्पष्ट निषेध को सीधे तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ὃ λέγεις
  choice: कि तुम क्या कह रहे हो
  rationale: यूनानी वाक्य के प्रत्यक्ष अर्थ को बनाए रखता है और “तुम्हारा मतलब” जैसी व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: बिना किसी विलम्ब के हुई घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: वह अभी बोल ही रहा था कि
  rationale: जननात्मक स्वतंत्र रचना द्वारा व्यक्त समकालिकता और ἔτι के बल—पतरस के बोलते रहने के दौरान ही—को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: एक मुर्गे ने बाँग दी
  rationale: मुर्गे की आवाज़ के लिए यह सामान्य और स्वाभाविक हिन्दी मुहावरा है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन संक्षिप्त, स्पष्ट और गरिमापूर्ण रखा गया है। पतरस के इनकार की सीधाई तथा उसके बोलते-बोलते मुर्गे की बाँग सुनाई देने की तात्कालिकता सुरक्षित है।
