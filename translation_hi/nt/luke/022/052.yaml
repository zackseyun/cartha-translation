source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: hi
  text: पर यीशु ने उन प्रधान याजकों, मन्दिर के सुरक्षा-अधिकारियों और बुज़ुर्गों से, जो उसके विरुद्ध आए थे, कहा, “क्या तुम तलवारें और लाठियाँ लेकर ऐसे निकले हो जैसे किसी डाकू[a] के विरुद्ध?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लुटेरे’ अथवा ‘बाग़ी जैसे अपराधी’। यूनानी शब्द λῃστής का अर्थ डाकू, लुटेरा, गिरोहबंद अपराधी, या विद्रोही प्रकार का अपराधी हो सकता है। यहाँ यीशु उस हथियारबंद ढंग का उल्लेख करते हैं जो किसी खतरनाक अपराधी को पकड़ने के लिए अपनाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का विरोध और कथानक में बदलाव दिखाता है; यहाँ गिरफ्तारी की कार्रवाई के प्रत्युत्तर में यीशु के कथन को स्वाभाविक रूप से जोड़ता है।
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: जो उसके विरुद्ध आए थे
  rationale: ἐπί के साथ कर्मकारक और गिरफ्तारी के प्रसंग में यह केवल पास आने के बजाय विरोधपूर्ण उद्देश्य से आने को व्यक्त करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: यह प्रमुख याजकीय अधिकारियों के समूह के लिए हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रचलित पद है।
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: मन्दिर के पहरेदारों के नायकों
  rationale: यह मन्दिर की सुरक्षा व्यवस्था के अधिकारियों को सूचित करता है; यह अनुवाद उनके नेतृत्वकारी पद और कार्य दोनों को स्पष्ट रखता है।
- source_word: πρεσβυτέρους
  choice: पुरनियों
  rationale: इस प्रसंग में इसका अर्थ केवल वृद्ध पुरुष नहीं, बल्कि मान्य यहूदी अगुवे हैं; ‘पुरनिये’ इस संस्थागत अर्थ को बनाए रखता है।
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: क्या तुम मुझे डाकू समझकर
  rationale: यूनानी मुहावरे का आशय किसी खतरनाक अपराधी के विरुद्ध निकलने जैसा व्यवहार करना है। प्रश्नात्मक हिन्दी में यह रूप स्वाभाविक है और λῃστής का मुख्य अर्थ बनाए रखता है।
- source_word: ἐξήλθατε
  choice: निकले हो
  rationale: यह अभी-अभी की गई कार्रवाई पर यीशु के प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μαχαιρῶν
  choice: तलवारें
  rationale: गिरफ्तारी के इस प्रसंग में यह सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: ξύλων
  choice: लाठियाँ
  rationale: शाब्दिक रूप से लकड़ी की वस्तुओं के लिए प्रयुक्त शब्द यहाँ हथियार के रूप में डंडों या लाठियों को दर्शाता है; ‘लाठियाँ’ सहज हिन्दी है।
