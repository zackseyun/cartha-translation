  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: hi
  text: वे कह रहे थे, “यदि तुम मसीह[a] हो, तो हमें बता दो।” पर उसने उनसे कहा, “यदि मैं तुम्हें बता दूँ, तो तुम हरगिज़ विश्वास नहीं करोगे;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।”
    reason: ὁ χριστός के वैकल्पिक पारंपरिक शीर्षक-रूप को दर्शाना।
lexical_decisions:
- source_word: λέγοντες
  choice: वे कहने लगे
  rationale: वर्तमान कृदंत को पूर्ववर्ती कथानक से जोड़ते हुए स्वाभाविक हिन्दी में सभा के बोलने का आरम्भ व्यक्त करता है।
- source_word: Εἰ σὺ εἶ
  choice: यदि तुम ... हो
  rationale: यूनानी की स्पष्ट शर्तात्मक संरचना को सीधे प्रश्न में बदले बिना सुरक्षित रखता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός यहूदी अभिषिक्त उद्धारकर्ता की उपाधि है; आधुनिक हिन्दी में ‘मसीह’ प्रचलित और बोधगम्य रूप है।
- source_word: εἰπὸν ἡμῖν
  choice: हमें बता दो
  rationale: आज्ञार्थक क्रिया और उसके संप्रदान कर्म का स्वाभाविक हिन्दी रूप, जिसमें माँग का बल बना रहता है।
- source_word: εἶπεν δὲ αὐτοῖς
  choice: पर उसने उनसे कहा
  rationale: δέ के हल्के विरोध अथवा संक्रमण को ‘पर’ व्यक्त करता है और सर्वनाम मूल पाठ के अनुरूप रखा गया है।
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: यदि मैं तुम्हें बता भी दूँ
  rationale: शर्तात्मक भाव को बनाए रखते हुए ‘भी’ उत्तर में निहित concessive बल को स्वाभाविक हिन्दी में उभारता है, बिना शर्त का परिणाम बदले।
- source_word: οὐ μὴ πιστεύσητε
  choice: तुम हरगिज़ विश्वास नहीं करोगे
  rationale: οὐ μή के प्रबल निषेध को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: पूछताछ के इस यहूदी संदर्भ में शब्द प्रतिज्ञात अभिषिक्त व्यक्ति की उपाधि है। ‘मसीह’ हिन्दी बाइबलीय प्रयोग में परिचित है; पादटिप्पणी उसका शाब्दिक अर्थ देती है और किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक किंतु गरिमापूर्ण है। ‘हरगिज़’ प्रबल निषेध व्यक्त करता है। मुख्य पाठ का [a] चिह्न ‘मसीह’ से संबद्ध पादटिप्पणी को संकेत करता है।
