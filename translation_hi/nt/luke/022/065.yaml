translation:
  language: hi
  text: और वे उसके विरुद्ध[a] बहुत-सी और निन्दा की बातें[b] कहते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी ओर’। यूनानी पद का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर इस प्रसंग में वाणी का शत्रुतापूर्ण भाव ‘उसके विरुद्ध’ से अधिक स्पष्ट होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बहुत-सी और अपमानजनक बातें’ अथवा ‘बहुत-सी और गाली-गलौज की बातें’। यूनानी शब्द व्यापक रूप से निन्दात्मक या अपमानजनक वाणी को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह साधारण संयोजक इस कथन को पिछले दुर्व्यवहार से जोड़ता है।
- source_word: ἕτερα πολλὰ
  choice: बहुत-सी और
  rationale: यह स्वाभाविक हिन्दी में पहले कही गई बातों के अतिरिक्त अनेक दूसरी बातों का भाव व्यक्त करता है।
- source_word: βλασφημοῦντες
  choice: निन्दा की ... बातें
  rationale: βλασφημέω में निन्दा, बदनामी और घोर अपमानजनक वाणी का अर्थ हो सकता है। ‘निन्दा’ इसकी गंभीरता बनाए रखती है, पर शब्द को केवल ईश्वर-निन्दा के संकुचित अर्थ में बाँधती नहीं।
- source_word: ἔλεγον
  choice: कहते रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती क्रिया को दर्शाता है; ‘कहते रहे’ इस पक्ष को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτόν
  choice: उसके विरुद्ध
  rationale: शत्रुतापूर्ण वाणी के इस प्रसंग में εἰς αὐτόν का विरोधी भाव ‘उसके विरुद्ध’ से स्पष्ट होता है, यद्यपि अधिक शाब्दिक ‘उससे’ भी सम्भव है।
theological_decisions:
- issue: βλασφημοῦντες में सामान्य अपमान और धर्मवैचारिक ‘ईशनिन्दा’ के बीच अर्थ-सीमा
  choice: ‘निन्दा की बातें’ द्वारा शब्द की गंभीरता और व्यापक अर्थ-सीमा दोनों बनाए रखना
  alternative: ‘ईशनिन्दापूर्ण बातें’ या ‘अपमानजनक बातें’
  rationale: मूल यूनानी क्रिया घोर निन्दात्मक या अपमानजनक वाणी को व्यक्त कर सकती है। ‘ईशनिन्दापूर्ण’ यीशु की पहचान के आधार पर अर्थ को पहले ही संकुचित कर सकती है, जबकि ‘अपमानजनक’ शब्द की पूरी तीव्रता को हल्का कर सकता है। ‘निन्दा’ मूल की वास्तविक अर्थगत व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहते रहे’ लगातार या बार-बार बोले जाने का भाव देता है; ‘निन्दा’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल शब्द की गंभीरता बनाए रखती है।
