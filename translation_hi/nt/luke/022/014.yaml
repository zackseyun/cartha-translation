  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: hi
  text: जब वह घड़ी आ पहुँची, तो वह भोजन के लिए मेज़ के पास टेक लगाकर बैठ गया[a], और प्रेरित भी उसके साथ बैठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, ‘टेक लगाकर बैठ गया।’ प्राचीन काल में लोग भोजन करते समय मेज़ के पास शरीर को टेक देकर अधलेटी मुद्रा में बैठते थे।
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: जब वह घड़ी आ पहुँची
  rationale: यह यूनानी मुहावरे के निश्चित और नियत क्षण के भाव को बनाए रखता है। ‘समय’ की अपेक्षा ‘घड़ी’ लूका की कथात्मक और संभावित धर्मवैचारिक विशिष्टता को अधिक निकटता से सुरक्षित रखती है।
- source_word: ἀνέπεσεν
  choice: भोजन के लिए मेज़ के पास टेक लगाकर बैठ गया
  rationale: ἀναπίπτω प्राचीन भोजन-पद्धति में मेज़ के पास शरीर को टेक देकर अधलेटी मुद्रा ग्रहण करने को दर्शाता है। यह अनुवाद केवल ‘बैठ गया’ कहने की अपेक्षा ऐतिहासिक मुद्रा को स्पष्ट करता है, जबकि शाब्दिकता से उत्पन्न होने वाली आधुनिक गलतफहमी से बचता है।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरित
  rationale: निश्चित उपपद परिचित समूह की ओर संकेत करता है। हिन्दी में इस संदर्भ में ‘प्रेरित’ बिना अतिरिक्त ‘उसके’ के स्वाभाविक और पर्याप्त है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: यह σύν द्वारा व्यक्त संगति का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Καὶ
  choice: तो … और … भी
  rationale: आरंभिक καί को हिन्दी कथात्मक प्रवाह में ‘तो’ द्वारा और अगले καί को ‘और … भी’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: फसह के भोजन के समय शारीरिक मुद्रा
  choice: मेज़ के पास टेक लगाकर बैठ गया
  alternative: बैठ गया
  rationale: चुना हुआ रूप यूनानी क्रिया में निहित ऐतिहासिक भोजन-मुद्रा को सुरक्षित रखता है; यह कोई धर्मसैद्धांतिक विस्तार नहीं, बल्कि शब्दार्थ और संस्कृति से जुड़ा स्पष्टीकरण है।
- issue: ‘घड़ी’ की कथात्मक विशिष्टता
  choice: वह घड़ी
  alternative: वह समय
  rationale: ‘घड़ी’ निश्चित उपपद और ὥρα की विशिष्टता को बनाए रखती है, पर इस पद में उसके धर्मवैचारिक अर्थ को अनावश्यक रूप से परिभाषित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्राचीन भोजन-मुद्रा को मुख्य पाठ में संक्षेप में स्पष्ट किया गया है और अधिक सांस्कृतिक विवरण पाद-टिप्पणी में दिया गया है।
