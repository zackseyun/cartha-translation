source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: hi
  text: क्योंकि मनुष्य का पुत्र तो जो ठहराया गया है उसके अनुसार जाता है; परन्तु हाय उस मनुष्य पर, जिसके द्वारा वह सौंपा जाता है![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासघात करके पकड़वाया जाता है।” यूनानी क्रिया का अर्थ “सौंपा जाना” या, संदर्भ के अनुसार, “विश्वासघात करके पकड़वाया जाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की आत्म-पदवी का प्रचलित हिन्दी रूप है और इसके शास्त्रीय अंतर्संबंध को बनाए रखता है।
- source_word: μέν
  choice: तो
  rationale: ‘तो ... फिर भी’ की रचना μέν और πλὴν के विरोध को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: κατὰ τὸ ὡρισμένον
  choice: जैसा ठहराया गया है, उसी के अनुसार
  rationale: यह पहले से किए गए निर्धारण के अनुरूप होने का भाव और यूनानी के कर्मवाच्य को सुरक्षित रखता है, बिना निर्धारण करने वाले को पाठ में जोड़े।
- source_word: πορεύεται
  choice: जाता है
  rationale: सरल वर्तमानकाल यीशु के मृत्यु की ओर बढ़ने के नियत मार्ग को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πλὴν
  choice: फिर भी
  rationale: यह ईश्वरीय निर्धारण और मानवीय उत्तरदायित्व के बीच प्रबल विरोध को स्पष्ट करता है।
- source_word: οὐαὶ
  choice: हाय ... पर
  rationale: यह भविष्यद्वाणी-सदृश शोक और अनिष्ट की घोषणा—दोनों की गंभीरता बनाए रखता है।
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: उस मनुष्य पर
  rationale: संदर्भ में एक निश्चित पुरुष, यहूदा, अभिप्रेत है; इसलिए यह रूप सटीक है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: διά के संबंधकारक के साथ प्रयुक्त होने पर व्यक्त माध्यम अथवा कर्तृत्व को निकटता से दर्शाता है।
- source_word: παραδίδοται
  choice: पकड़वाया जाता है
  rationale: संदर्भ में यहूदा द्वारा यीशु को अधिकारियों के हाथ लगवाने और उसके विश्वासघाती स्वरूप—दोनों को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘सौंपा जाता है’ शाब्दिक विकल्प के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय निर्धारण और मानवीय उत्तरदायित्व का संबंध
  choice: ‘जैसा ठहराया गया है’ के साथ विश्वासघाती मनुष्य पर ‘हाय’ की घोषणा दोनों को पूर्ण बल के साथ रखा गया है।
  alternative: या तो पूर्वनिर्धारण को नरम करना, या विश्वासघाती के उत्तरदायित्व को कम करना।
  rationale: यूनानी पाठ नियत योजना और मनुष्य की दोषिता को आमने-सामने रखता है; अनुवाद किसी विशेष धर्मवैज्ञानिक प्रणाली के अनुसार इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘मनुष्य का पुत्र’ स्थापित शास्त्रीय पदवी के रूप में रखा गया है; वाक्य का ‘तो ... फिर भी’ विन्यास मूल विरोध को स्वाभाविक ढंग से बनाए रखता है।
