base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ, अब से मैं दाख का फल[a] फिर कभी नहीं पीऊँगा, जब तक परमेश्वर का राज्य न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाखमधु।” यूनानी में शाब्दिक रूप से “दाख का फल” है—यह व्यापक अभिव्यक्ति संभवतः प्याले की सामग्री की ओर संकेत करती है, पर यहाँ दाखमधु के सामान्य शब्द का प्रयोग नहीं हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: यह प्रत्यक्ष संबोधन के स्वाभाविक हिन्दी रूप को अपनाता है और γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ से बनाए रखता है।
- source_word: οὐ μὴ πίω
  choice: मैं ... फिर कभी नहीं पीऊँगा
  rationale: οὐ μή के साथ aorist subjunctive भविष्य के विषय में प्रबल निषेध व्यक्त करता है। ‘फिर कभी नहीं’ उस बल को बनाए रखता है, जबकि आगे का ‘जब तक’ इसकी समय-सीमा स्पष्ट करता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह वर्तमान क्षण से आरम्भ होने वाली अवधि का सहज और सटीक आधुनिक हिन्दी रूप है।
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: दाख का फल
  rationale: γένημα उत्पाद या फल को दर्शाता है। ‘दाख का फल’ यूनानी की व्यापक अभिव्यक्ति को रखता है और सीधे ‘दाखमधु’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ἕως οὗ
  choice: जब तक
  rationale: यह निषेध की भविष्यकालीन समय-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह सुसमाचारों की स्थापित हिन्दी शब्दावली है और βασιλεία में निहित राजकीय शासन तथा राज्य—दोनों आयामों को खुला रखती है।
- source_word: ἔλθῃ
  choice: न आए
  rationale: ‘जब तक ... न आए’ हिन्दी की स्वाभाविक भविष्य-संबंधी रचना है और यूनानी subjunctive का अर्थ बिना अनावश्यक व्याख्या के व्यक्त करती है।
theological_decisions:
- issue: γενήματος τῆς ἀμπέλου को ‘दाखमधु’ कहना या अधिक शाब्दिक ‘दाख का फल’ रखना
  choice: दाख का फल
  alternative: दाखमधु
  rationale: मूल यूनानी सामान्यतः दाख की उपज या फल कहता है और पेय के साधारण नाम का प्रयोग नहीं करता। व्यापक अभिव्यक्ति रखने से पाठ से अधिक विशिष्ट दावा नहीं किया जाता।
- issue: परमेश्वर के राज्य के आने का स्वरूप या चरण
  choice: जब तक परमेश्वर का राज्य न आए
  alternative: जब तक परमेश्वर का राज्य पूरी तरह न आ जाए
  rationale: मूल पाठ भविष्य की एक समय-सीमा बताता है, पर राज्य के आगमन के ढंग, चरण या पूर्णता को स्पष्ट नहीं करता। अनुवाद उस धार्मिक-वैचारिक खुलापन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘दाख का फल’ मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखता है।
