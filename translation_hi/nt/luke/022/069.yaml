    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उस समय-बिंदु को दर्शाता है जिससे आगे कही गई बात प्रभावी होगी।
- source_word: δὲ
  choice: लेकिन
  rationale: यहाँ यह यीशु के उत्तर में विरोध अथवा निर्णायक मोड़ को व्यक्त करता है।
- source_word: ἔσται
  choice: होगा
  rationale: εἰμί के भविष्यत्काल को सीधे रूप में व्यक्त करता है और आने वाली महिमामय स्थिति को बनाए रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की स्थापित आत्म-पदवी का शाब्दिक रूप है; इससे दानिय्येली प्रतिध्वनि और पदवी की अर्थगत व्यापकता सुरक्षित रहती है।
- source_word: καθήμενος
  choice: विराजमान
  rationale: सिर्फ बैठने की सामान्य क्रिया के बजाय राजकीय आसन, सम्मान और अधिकार का भाव स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐκ δεξιῶν
  choice: दाहिनी ओर
  rationale: यह सर्वोच्च सम्मान और अधिकार के स्थान का बाइबलीय मुहावरा है; हिन्दी में इसका निकट और स्पष्ट रूप 'दाहिनी ओर' है।
- source_word: τῆς δυνάμεως
  choice: सामर्थ्य
  rationale: δύναμις के शक्ति/सामर्थ्य के अर्थ को बनाए रखता है; 'सामर्थ्य' इस ईश्वरीय संदर्भ में गरिमापूर्ण और सहज है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: संबंधकारक पद स्पष्ट करता है कि सामर्थ्य परमेश्वर की है और यूनानी वाक्य की स्पष्टता बनाए रखता है।
theological_decisions:
- issue: महिमा और ईश्वरीय अधिकार के सूत्र का अनुवाद
  choice: मनुष्य का पुत्र परमेश्वर की सामर्थ्य की दाहिनी ओर विराजमान होगा
  alternative: मनुष्य का पुत्र सामर्थ्यवान की दाहिनी ओर विराजमान होगा
  rationale: मुख्य पाठ यूनानी के स्पष्ट 'परमेश्वर की सामर्थ्य' को बनाए रखता है तथा 'विराजमान' के द्वारा भजन 110 और दानिय्येल 7 से जुड़ी राजकीय-अधिकार की प्रतिध्वनि को बिना अतिरिक्त व्याख्या के व्यक्त करता है। वैकल्पिक श्रद्धापूर्ण परोक्ष संकेत को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। 'विराजमान' राजकीय आसन के भाव को व्यक्त करता है, जबकि 'मनुष्य का पुत्र' पारंपरिक बाइबलीय पदवी और उसकी अंतर्पाठीय प्रतिध्वनि को सुरक्षित रखता है।
