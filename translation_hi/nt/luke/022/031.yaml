  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: hi
  text: “शमौन, शमौन, देख! शैतान ने तुम सबको गेहूँ की तरह फटकने के लिए माँग लिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: देख!
  rationale: यह ध्यान खींचने वाला उद्गार है; आधुनिक और स्वाभाविक हिन्दी में चेतावनी की तात्कालिकता बनाए रखता है।
- source_word: ἐξῃτήσατο
  choice: माँग लिया है
  rationale: क्रिया किसी को अपने अधिकार में लेने के लिए दृढ़ता से माँगने का भाव देती है; पूर्ण भूतकाल वर्तमान परिस्थिति में उस माँग के प्रभाव को व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुम सबको
  rationale: यूनानी सर्वनाम बहुवचन है; हिन्दी में ‘तुम सबको’ स्पष्ट करता है कि सम्बोधन केवल शमौन तक सीमित नहीं है।
- source_word: σινιάσαι
  choice: फटके
  rationale: अनाज को फटकने की कृषि-छवि को सीधे सुरक्षित रखता है।
- source_word: ὡς τὸν σῖτον
  choice: गेहूँ की तरह
  rationale: रूपक का स्वाभाविक हिन्दी रूप; ‘σῖτος’ यहाँ गेहूँ/अनाज के अर्थ में है और ‘गेहूँ’ प्रचलित तथा सुस्पष्ट है।
theological_decisions:
- issue: शैतान की माँग की प्रकृति
  choice: शैतान ने तुम सबको माँग लिया है
  alternative: शैतान ने तुम्हें पाने की माँग की है
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि माँग किससे की गई या अनुमति वास्तव में दी गई; अनुवाद इसी अस्पष्टता और तनाव को बनाए रखता है।
- issue: बहुवचन शिष्यों और एकवचन शमौन का संबंध
  choice: नाम एकवचन में, सर्वनाम स्पष्ट बहुवचन में
  alternative: पूरे कथन को केवल शमौन पर लागू करना
  rationale: ‘शमौन’ को सीधे सम्बोधित किया गया है, पर ὑμᾶς बहुवचन है; इसलिए ‘तुम सबको’ आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक चेतावनी जैसा प्रवाह। ‘शमौन, शमौन’ की पुनरुक्ति और कृषि-रूपक दोनों सुरक्षित रखे गए हैं।
