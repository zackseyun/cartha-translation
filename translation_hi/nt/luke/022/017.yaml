  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: hi
  text: और एक प्याला ग्रहण कर धन्यवाद देकर उसने कहा, “इसे लो और आपस में[a] बाँट लो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ यूनानी पांडुलिपियों में “आपस में” नहीं है।
    reason: textual_variant
  - marker: b
    text: “बाँट लो” का अनुवाद “आपस में वितरित कर लो” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: लिया
  rationale: अओरिस्ट मध्यवाची कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है। हिन्दी में ‘फिर उसने ... लिया’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है; ‘प्राप्त किया’ भोजन के प्रसंग में अनावश्यक रूप से औपचारिक है।
- source_word: ποτήριον
  choice: एक प्याला
  rationale: यूनानी संज्ञा के साथ उपपद नहीं है। ‘एक प्याला’ इस अनिर्दिष्ट रूप को बनाए रखता है, जबकि प्रसंग किसी विशेष प्याले की ओर संकेत कर सकता है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद देकर
  rationale: यह कृदन्त बोलने से पहले किए गए धन्यवाद को दर्शाता है। यह सहज कथात्मक भाषा है और बाद की तकनीकी धर्मविधिक शब्दावली नहीं जोड़ती।
- source_word: εἶπεν
  choice: कहा
  rationale: मूल में कर्म अथवा अप्रत्यक्ष कर्म स्पष्ट नहीं है; इसलिए ‘उनसे’ नहीं जोड़ा गया।
- source_word: Λάβετε
  choice: लो
  rationale: बहुवचन आज्ञार्थक को निकट शिष्यों के बीच सहज और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: τοῦτο
  choice: इसे
  rationale: नपुंसकलिंग एकवचन संकेतवाचक पहले बताए प्याले की ओर संकेत करता है, पर संज्ञा दोहराता नहीं; ‘इसे’ वही संक्षिप्तता रखता है।
- source_word: διαμερίσατε
  choice: बाँट लो
  rationale: क्रिया का अर्थ विभाजित करना अथवा वितरित करना है। प्याले के प्रसंग में ‘आपस में बाँट लो’ स्वाभाविक है और समूह के भीतर साझा करने का भाव देता है।
- source_word: εἰς ἑαυτούς
  choice: आपस में
  rationale: प्रसंग में वाक्यांश समूह के सदस्यों के बीच वितरण का पारस्परिक भाव व्यक्त करता है; ‘अपने लिए’ भ्रामक आत्म-अधिकार का संकेत दे सकता है।
theological_decisions:
- issue: क्या εὐχαριστήσας और ποτήριον के लिए बाद की प्रभुभोज-संबंधी धर्मविधिक भाषा अपनाई जाए
  choice: साधारण कथात्मक भाषा—‘एक प्याला’ और ‘धन्यवाद देकर’
  alternative: ‘वह प्याला’ अथवा तकनीकी धर्मविधिक शब्दावली
  rationale: मूल पाठ मेज पर यीशु की क्रिया का वर्णन करता है, पर बाद की कलीसियाई पारिभाषिक भाषा की माँग नहीं करता। यह चयन प्रसंग को बनाए रखते हुए पाठ में कोई अतिरिक्त मत-सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। निकट शिष्यों को संबोधित बहुवचन आज्ञा के लिए ‘लो’ रखा गया है। अनिर्दिष्ट ποτήριον के लिए ‘एक प्याला’ चुना गया है; मुख्य पाठ में धर्मविधिक अर्थ नहीं जोड़ा गया।
