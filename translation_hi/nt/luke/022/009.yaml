  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: hi
  text: उन्होंने उससे पूछा, “आप कहाँ चाहते हैं कि हम इसकी तैयारी करें?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “आप कहाँ चाहते हैं कि हम तैयारी करें?” यहाँ तैयारी की अनकही वस्तु पिछले संदर्भ में उल्लिखित फसह का भोज है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: उन्होंने
  rationale: संदर्भ में संज्ञा के रूप में प्रयुक्त बहुवचन लेख शिष्यों की ओर संकेत करता है। δέ यहाँ हल्का संयोजक है, जिसे स्वाभाविक हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: εἶπαν αὐτῷ
  choice: उससे पूछा
  rationale: शाब्दिक अर्थ ‘उससे कहा’ है, पर आगे प्रत्यक्ष प्रश्न होने के कारण ‘उससे पूछा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और कथन की क्रिया को ठीक व्यक्त करता है।
- source_word: Ποῦ
  choice: कहाँ
  rationale: यह प्रश्नवाचक क्रिया-विशेषण स्थान पूछता है; ‘कहाँ’ इसका स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: θέλεις
  choice: आप कहाँ चाहते हैं
  rationale: θέλω इच्छा या अभिप्राय दर्शाता है। यीशु को संबोधित करते हुए ‘आप’ सम्मानपूर्ण, सामान्य आधुनिक हिन्दी है।
- source_word: ἑτοιμάσωμεν
  choice: कि हम इसकी तैयारी करें
  rationale: θέλεις के बाद प्रथम पुरुष बहुवचन एओरिस्ट सब्जंक्टिव को हिन्दी में ‘चाहते हैं कि हम…करें’ से स्वाभाविक रूप से व्यक्त किया गया है। ‘इसकी’ का संकेत पिछले पद के फसह के भोज की ओर है।
theological_decisions: []
