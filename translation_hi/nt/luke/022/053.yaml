source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: hi
  text: प्रतिदिन जब मैं मंदिर में तुम्हारे साथ था, तब तुमने मुझ पर हाथ नहीं डाला[a]। पर अब तुम्हारी घड़ी है, और अंधकार का अधिकार भी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुमने मेरे विरुद्ध अपने हाथ नहीं बढ़ाए”; यहाँ यह पकड़ने या शत्रुतापूर्ण कार्रवाई करने का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या “अंधकार की शक्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह वितरणात्मक पद हर दिन होने वाली बात को दर्शाता है; ‘प्रतिदिन’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: जब मैं तुम्हारे साथ था
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है; ‘मन्दिर में’ सामान्य पाठक के लिए सहज है और इसे भीतरी पवित्रस्थान तक सीमित नहीं करता।
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: तुमने मुझ पर हाथ नहीं डाले
  rationale: यह हिन्दी मुहावरा यूनानी के ‘मेरे विरुद्ध हाथ बढ़ाने’ और यहाँ निहित पकड़ने या शत्रुतापूर्ण कार्रवाई करने के भाव को बनाए रखता है।
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: पर यह तुम्हारी घड़ी है
  rationale: ‘घड़ी’ केवल साठ मिनट की अवधि नहीं, बल्कि उनके लिए आए निर्णायक अवसर का गम्भीर भाव भी बनाए रखती है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: ἐξουσία अधिकार, प्रभुत्व या कार्य करने की सामर्थ्य को व्यक्त कर सकता है; ‘अधिकार’ मूल अर्थ को ‘शक्ति’ मात्र तक सीमित नहीं करता।
- source_word: τοῦ σκότους
  choice: अन्धकार का
  rationale: यह रूपक को यथावत रखता है और उसे स्पष्ट रूप से शैतान या बुराई कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: ‘अन्धकार के अधिकार’ की पहचान को स्पष्ट करना या रूपक बनाए रखना
  choice: ‘अन्धकार का अधिकार’ रूपक को बिना विस्तार के रखा गया है।
  alternative: ‘शैतान का अधिकार’ या ‘बुराई का प्रभुत्व’
  rationale: मूल पाठ ‘अन्धकार’ कहता है और उसके अभिप्राय को किसी एक स्पष्ट पहचान में नहीं बाँधता; इसलिए आध्यात्मिक तनाव और व्यापक रूपक सुरक्षित रखा गया है।
- issue: ἐξουσία को ‘अधिकार’ या ‘शक्ति’ के रूप में व्यक्त करना
  choice: अधिकार
  alternative: शक्ति
  rationale: ‘अधिकार’ वैधता का समर्थन किए बिना किसी सीमित समय में सक्रिय प्रभुत्व या छूट के भाव को बनाए रखता है; ‘शक्ति’ भी सम्भव है और पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘मन्दिर’, ‘घड़ी’ और ‘अन्धकार’ जैसे परिचित बाइबिलीय शब्द मूल पाठ के रूपक और गम्भीरता को बनाए रखते हैं; विराम-चिह्न दोनों सम्बद्ध कथनों को स्पष्ट करते हैं।
