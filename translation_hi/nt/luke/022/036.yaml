source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: hi
  text: फिर उसने उनसे कहा, “लेकिन अब, जिसके पास धन की थैली हो, वह उसे साथ ले ले, और इसी तरह सफ़र का झोला भी[a]; और जिसके पास न हो, वह अपना चोगा बेचकर एक तलवार[b] खरीद ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सफ़र का झोला’ के लिए प्रयुक्त यूनानी शब्द (πήρα) का अर्थ ‘झोला’ या ‘थैला’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तलवार’ के लिए प्रयुक्त यूनानी शब्द (μάχαιρα) किसी छोटे धारदार हथियार, जैसे कटार या छोटी तलवार, को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: लेकिन अब
  rationale: यह पिछले निर्देशों के साथ प्रबल विरोध दिखाता है और νῦν के समय-संबंधी बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ ἔχων
  choice: जिसके पास ... हो
  rationale: कर्तृवाचक कृदंत का सामान्य, प्रतिनिधिक अर्थ रखा गया है और अनावश्यक रूप से लिंग निर्दिष्ट नहीं किया गया।
- source_word: βαλλάντιον
  choice: धन की थैली
  rationale: यह पैसे रखने की थैली को दर्शाता है; आधुनिक हिन्दी में अर्थ स्पष्ट है।
- source_word: ἀράτω
  choice: उसे साथ ले ले
  rationale: यात्रा की तैयारी के संदर्भ में क्रिया का अर्थ उठाकर या साथ लेकर चलना है; ‘साथ ले ले’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁμοίως καὶ πήραν
  choice: और इसी तरह सफ़र का झोला भी
  rationale: πήρα यात्री के झोले को दर्शाता है; ‘सफ़र का झोला’ उसके काम को स्पष्ट करता है और ὁμοίως का समानांतर बल बनाए रखता है।
- source_word: ὁ μὴ ἔχων
  choice: और जिसके पास न हो
  rationale: यूनानी पाठ यहाँ कर्म को स्पष्ट नहीं करता। हिन्दी में भी उसे अनकहा रखकर मूल की संक्षिप्तता और संभावित अस्पष्टता सुरक्षित रखी गई है; आगे का आदेश स्वाभाविक रूप से तलवार की ओर संकेत करता है।
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: वह अपना चोगा बेचकर
  rationale: ἱμάτιον सामान्यतः बाहरी वस्त्र या चोगे को दर्शाता है; ‘चोगा’ संक्षिप्त और संदर्भानुकूल है।
- source_word: ἀγορασάτω μάχαιραν
  choice: एक तलवार खरीद ले
  rationale: प्रत्यक्ष आज्ञा और हथियार के स्पष्ट उल्लेख को बिना नरम किए रखा गया है; μάχαιρα के लिए ‘तलवार’ पर्याप्त व्यापक सामान्य शब्द है।
theological_decisions:
- issue: तलवार खरीदने की आज्ञा को शाब्दिक रखा जाए या व्याख्यात्मक रूप से नरम किया जाए
  choice: प्रत्यक्ष रूप से ‘एक तलवार खरीद ले’
  alternative: इसे ‘खतरे के लिए तैयार हो’ या केवल रूपकात्मक तैयारी के रूप में अनूदित करना
  rationale: यूनानी पाठ μάχαιρα शब्द और प्रत्यक्ष आज्ञार्थक क्रिया का प्रयोग करता है। अनुवाद उसके धार्मिक और नैतिक तनाव को बनाए रखता है तथा हिंसा या रूपक के विषय में निष्कर्ष पाठ में नहीं जोड़ता।
- issue: ὁ μὴ ἔχων में अनकहे कर्म की पहचान
  choice: 'मुख्य पाठ में कर्म को अनकहा रखना: ‘जिसके पास न हो’'
  alternative: 'स्पष्ट करना: ‘जिसके पास तलवार न हो’'
  rationale: मूल यूनानी में कर्म व्यक्त नहीं है। आगे ‘तलवार खरीद ले’ होने के कारण तलवार स्वाभाविक अनुमान है, पर उसे मुख्य पाठ में जोड़ना मूल की वास्तविक व्याकरणिक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप अपनाया गया है। ‘साथ ले ले’ यात्रा-संदर्भ को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
