base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: hi
  text: तब शैतान यहूदा में प्रवेश कर गया, जो इस्करियोती कहलाता था और बारह की गिनती में से था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बारह में से एक था।” शाब्दिक रूप से, “बारह की गिनती में से था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: तब ... प्रवेश कर गया
  rationale: δέ यहाँ कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। εἰσῆλθεν के साथ εἰς भीतर प्रवेश का स्पष्ट अर्थ देता है; ‘प्रवेश कर गया’ उस बल को बनाए रखता है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: नए नियम में प्रयुक्त इस नाम/उपाधि का हिन्दी में प्रचलित और स्पष्ट रूप।
- source_word: εἰς Ἰούδαν
  choice: यहूदा में
  rationale: εἰς को व्यक्त करते हुए पाठ के इस कथन को सुरक्षित रखता है कि शैतान यहूदा के भीतर गया, न कि केवल उस पर प्रभाव डाला।
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: जो इस्करियोती कहलाता था
  rationale: विशेषणात्मक कृदंत καλούμενον यहूदा की पहचान बताता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक और स्पष्ट है।
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: और बारह की गिनती में था
  rationale: यह रूप ἐκ τοῦ ἀριθμοῦ की ‘गिने हुए समूह का सदस्य’ वाली औपचारिक छटा को बनाए रखता है; अधिक सहज विकल्प ‘बारह में से एक था’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यहूदा में शैतान की क्रिया का स्वरूप
  choice: ‘शैतान यहूदा में प्रवेश कर गया’ के रूप में सीधे अनुवादित किया गया।
  alternative: ‘शैतान ने यहूदा को प्रभावित किया’ या ‘शैतान ने यहूदा को अपने वश में कर लिया।’
  rationale: यूनानी εἰσῆλθεν ... εἰς प्रवेश की सशक्त भाषा है। अनुवाद इसे केवल प्रभाव तक हल्का नहीं करता, पर दुष्टात्मा-अधिकार या यहूदा की मानवीय जिम्मेदारी के विषय में कोई अतिरिक्त निष्कर्ष भी नहीं जोड़ता।
- issue: ‘बारह’ को समूह की औपचारिक उपाधि मानना
  choice: ‘बारह’ सामान्य वर्तनी में रखा गया।
  alternative: इसे विशिष्ट प्रेरित-समूह सूचित करने के लिए किसी मुद्रणात्मक विशिष्टता के साथ प्रस्तुत करना।
  rationale: यूनानी पाठ में बड़े और छोटे अक्षरों की आधुनिक शैलीगत भिन्नता यहाँ निर्णायक नहीं है। हिन्दी में ‘बारह’ संदर्भ से पहचाना जा सकता है, इसलिए अतिरिक्त व्याख्यात्मक चिह्न नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘प्रवेश कर गया’ मूल की सशक्त क्रिया को, और ‘बारह की गिनती में था’ समूह-सदस्यता की औपचारिक अभिव्यक्ति को सुरक्षित रखता है।
