  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: hi
  text: जब वह उस स्थान पर पहुँचा, तो उसने उनसे कहा, “प्रार्थना करो कि तुम प्रलोभन[a] में न पड़ो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परीक्षा” अथवा “कसौटी।” यूनानी शब्द नैतिक प्रलोभन या अधिक व्यापक रूप से परीक्षा अथवा परखे जाने की स्थिति—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: जब वह उस स्थान पर पहुँचा
  rationale: यह कृदन्तीय वाक्यांश उस पहले से ज्ञात स्थान पर पहुँचने को दर्शाता है। ‘जब ... पहुँचा’ मुख्य क्रिया के साथ उसके कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यह λέγω का सीधा और पारदर्शी अनुवाद है; इससे मूल में निहित सामान्य कथन-क्रिया बनी रहती है।
- source_word: Προσεύχεσθε
  choice: प्रार्थना करो
  rationale: वर्तमानकालीन आज्ञार्थक रूप प्रार्थना करते रहने या प्रार्थना को अपना अभ्यास बनाने का भाव रख सकता है, पर हिन्दी में सरल आज्ञा ‘प्रार्थना करो’ स्वाभाविक है और प्रसंग में पर्याप्त है।
- source_word: μὴ εἰσελθεῖν
  choice: कि तुम ... में न पड़ो
  rationale: शाब्दिक अर्थ ‘प्रवेश न करो’ है, लेकिन प्रलोभन या परीक्षा के साथ हिन्दी में ‘में न पड़ो’ अधिक स्वाभाविक मुहावरा है और उसी प्रवेश-सदृश भाव को व्यक्त करता है।
- source_word: πειρασμόν
  choice: प्रलोभन
  rationale: निकटवर्ती प्रसंग में शिष्यों के आसन्न आत्मिक विफलता में पड़ने का खतरा प्रमुख है, इसलिए ‘प्रलोभन’ मुख्य पाठ में उपयुक्त है। यूनानी शब्द के व्यापक ‘परीक्षा’ या ‘परख’ के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: यीशु की चेतावनी में πειρασμός का अर्थ
  choice: प्रलोभन
  alternative: परीक्षा या परख
  rationale: प्रसंग नैतिक और आत्मिक रूप से बहकने के खतरे की ओर संकेत करता है, पर यूनानी शब्द कठिन परीक्षा या परखे जाने की स्थिति भी बता सकता है। इसलिए मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और व्यापक अर्थों को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उस स्थान’ पहले से उल्लिखित निश्चित स्थान को दर्शाता है। ‘में न पड़ो’ शाब्दिक ‘में प्रवेश न करो’ की अपेक्षा वर्तमान हिन्दी में अधिक स्वाभाविक है।
