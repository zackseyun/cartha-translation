  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: hi
  text: वह सहमत हो गया और ऐसा अवसर ढूँढ़ने लगा जब भीड़ न हो और वह यीशु को उनके हवाले कर सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह यीशु के साथ विश्वासघात कर सके।” यूनानी क्रिया का मूल अर्थ “हवाले करना” या “सौंप देना” है; यहूदा की भूमिका के संदर्भ में “विश्वासघात करना” भी इसका उचित भावार्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: सहमत हो गया
  rationale: इस प्रसंग में यहूदा प्रधान याजकों और अधिकारियों के प्रस्ताव पर सहमति देता है; इसलिए क्रिया का प्रसंगानुकूल अर्थ ‘सहमत हो गया’ है, न कि इसका अन्यत्र पाया जाने वाला अर्थ ‘खुले रूप से स्वीकार किया।’
- source_word: ἐζήτει
  choice: ढूँढ़ने लगा
  rationale: अपूर्ण भूतकालीन रूप जारी अथवा आरंभ हुई खोज को व्यक्त कर सकता है। सहमति के बाद कथा की प्रगति दिखाने के लिए ‘ढूँढ़ने लगा’ स्वाभाविक है।
- source_word: εὐκαιρίαν
  choice: अवसर
  rationale: यह किसी अनुकूल या उपयुक्त समय का बोध कराता है; आधुनिक हिन्दी में ‘अवसर’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: यीशु को उनके हवाले कर सके
  rationale: παραδίδωμι का मूल भाव किसी को दूसरे के अधिकार में सौंपना या हवाले करना है। सर्वनाम की जगह ‘यीशु’ रखने से हिन्दी में संदर्भ साफ रहता है, जबकि ‘हवाले करना’ यूनानी क्रिया की व्यापकता को बनाए रखता है।
- source_word: ἄτερ ὄχλου
  choice: जब भीड़ न हो
  rationale: शाब्दिक भाव ‘भीड़ के बिना/भीड़ से अलग’ है। प्रसंग में इसका आशय ऐसे अवसर से है जब भीड़ उपस्थित न हो; हिन्दी में उपवाक्य रूप अधिक सहज है।
- source_word: αὐτοῖς
  choice: उनके
  rationale: यह दत्तिव रूप पिछले पदों में उल्लिखित प्रधान याजकों और अधिकारियों को हवाले किए जाने के प्राप्तकर्ताओं के रूप में दर्शाता है।
theological_decisions:
- issue: παραδοῦναι का अनुवाद
  choice: हवाले करना
  alternative: विश्वासघात करके पकड़वा देना
  rationale: ‘विश्वासघात’ इस प्रसंग में सही निहितार्थ है, पर यूनानी क्रिया स्वयं अधिक व्यापक रूप से ‘सौंपना/हवाले करना’ कहती है। मुख्य पाठ में व्यापक अर्थ रखने और टिप्पणी में संदर्भगत विकल्प देने से मूल की शब्दार्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘उनके हवाले’ सामान्य पाठक के लिए स्वाभाविक है और मूल क्रिया की व्यापकता बनाए रखता है। मुख्य पाठ में [a] चिह्न संबंधित वाक्य के अंत में दिया गया है।
