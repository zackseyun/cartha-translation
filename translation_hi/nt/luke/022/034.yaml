id: LUK.22.34
reference: Luke 22:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: hi
  text: पर उसने कहा, “मैं तुमसे कहता हूँ, पतरस, आज मुर्गा तब तक बाँग नहीं देगा, जब तक तुम तीन बार इस बात से इनकार न कर दो कि तुम मुझे जानते हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुमसे कहता हूँ, पतरस, आज मुर्गे के बाँग देने से पहले तुम तीन बार इस बात से इनकार करोगे कि तुम मुझे जानते हो।”
    reason: ἕως के समय-संबंध को हिन्दी में ‘जब तक’ या अधिक मुहावरेदार ढंग से ‘पहले’ द्वारा व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: पर उसने कहा
  rationale: δέ यहाँ पिछले कथन के उत्तर में हल्का विरोध या संवाद का मोड़ दिखाता है; ‘पर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Λέγω σοι
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रत्यक्ष और गंभीर कथन का सामान्य सूत्र है; वर्तमान काल की शक्ति बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Πέτρε
  choice: पतरस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: φωνήσει ... ἀλέκτωρ
  choice: मुर्गा ... बाँग नहीं देगा
  rationale: ἀλέκτωρ के साथ φωνέω का प्रसंगानुकूल अर्थ मुर्गे का बाँग देना है। अनिश्चित अर्थ के लिए बिना अनावश्यक निश्चितताबोध के ‘मुर्गा’ रखा गया है।
- source_word: σήμερον
  choice: आज
  rationale: कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: ἕως
  choice: तब तक ... जब तक
  rationale: नकारात्मक मुख्य वाक्य के साथ यह रचना उस समय-सीमा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करती है जहाँ तक बाँग न देने की बात कही गई है।
- source_word: τρίς
  choice: तीन बार
  rationale: सरल और वर्तमान हिन्दी में सहज समतुल्य।
- source_word: ἀπαρνήσῃ
  choice: इनकार न कर दो
  rationale: ἕως के बाद आए aorist subjunctive को हिन्दी की ‘जब तक ... न’ रचना से स्वाभाविक रूप में व्यक्त किया गया है; यह भविष्य में पूरी होने वाली क्रिया की सीमा भी बनाए रखता है।
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: इस बात से इनकार ... कि तुम मुझे जानते हो
  rationale: εἰδέναι को छोड़ा नहीं गया; इससे स्पष्ट रहता है कि पतरस यीशु को जानने की बात से इनकार करेगा, केवल सामान्य अर्थ में उनका त्याग नहीं।
theological_decisions:
- issue: पतरस के भावी इनकार का स्वरूप
  choice: ‘इस बात से इनकार ... कि तुम मुझे जानते हो’
  alternative: ‘मेरा तीन बार इनकार करो’
  rationale: मूल यूनानी में εἰδέναι स्पष्ट रूप से उपस्थित है और इनकार की विषयवस्तु बताता है। चुना हुआ अनुवाद परिचय से इनकार करने के विशिष्ट अर्थ को सुरक्षित रखता है और व्यापक धर्मवैचारिक अर्थ नहीं जोड़ता।
- issue: मुर्गे के बाँग देने और तीन इनकारों का काल-संबंध
  choice: ‘तब तक ... जब तक’
  alternative: ‘बाँग देने से पहले’
  rationale: ἕως की मूल समय-सीमा वाली संरचना को मुख्य पाठ में रखा गया है। अधिक मुहावरेदार ‘पहले’ वाला रूप अर्थ की वैध वैकल्पिक अभिव्यक्ति है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप अपनाया गया है। ‘बाँग देना’ प्रचलित मुहावरा है। ‘पतरस’ प्रचलित हिन्दी बाइबलीय नामरूप है।
