  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: hi
  text: और उन्होंने उनसे कहा, “मैंने दुःख उठाने से पहले तुम्हारे साथ यह फसह खाने की बहुत इच्छा की थी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “इच्छा से मैंने इच्छा की”; यूनानी में एक ही मूल की संज्ञा और क्रिया साथ रखकर यीशु की तीव्र इच्छा पर बल दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: उन्होंने उनसे कहा
  rationale: यह सामान्य कथात्मक वाक्य-विन्यास है और λέγω के साथ πρός का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: मुझे बड़ी लालसा थी
  rationale: मूल यूनानी में संज्ञा और उसी मूल की क्रिया का प्रयोग इच्छा की तीव्रता बढ़ाता है। यह हिन्दी रूप उस प्रबल चाह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦτο τὸ πάσχα
  choice: यह फसह
  rationale: πάσχα पर्व या उसके भोज को सूचित कर सकता है। खाने के प्रसंग में भोज अभिप्रेत है, फिर भी मुख्य पाठ में ‘फसह’ रखने से मूल की संक्षिप्तता और अर्थ-व्याप्ति बनी रहती है।
- source_word: φαγεῖν
  choice: खाऊँ
  rationale: φαγεῖν का सीधा अर्थ ‘खाना’ है; हिन्दी वाक्य-रचना में उद्देश्यसूचक उपवाक्य के कारण ‘खाऊँ’ स्वाभाविक है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ
  rationale: यह सहभागिता का सीधा और बोलचाल में स्वाभाविक अनुवाद है।
- source_word: πρὸ τοῦ με παθεῖν
  choice: दुःख उठाने से पहले
  rationale: πρό के साथ व्यक्त संरचना पूर्वकालिकता दिखाती है, और πάσχω यहाँ यीशु के निकट आते दुःख को सूचित करता है। यह रूप घटना को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: इस प्रसंग में πάσχα का अर्थ
  choice: मुख्य पाठ में ‘फसह’ रखा गया है।
  alternative: यह फसह का भोज
  rationale: खाने का प्रसंग स्पष्ट करता है कि फसह का भोज सामने है, पर मूल शब्द पर्व और भोज दोनों से जुड़ा रह सकता है। ‘भोज’ को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में स्पष्ट करना मूल की अर्थ-व्याप्ति को सुरक्षित रखता है।
- issue: Ἐπιθυμίᾳ ἐπεθύμησα की बलाघाती शक्ति
  choice: मुझे बड़ी लालसा थी
  alternative: मैंने लालसा से लालसा की
  rationale: मूल की सममूलक रचना तीव्र इच्छा व्यक्त करती है। चुना हुआ हिन्दी रूप उस बल को बनाए रखता है, पर शाब्दिक और अस्वाभाविक पुनरुक्ति से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक कथन। ‘लालसा’ प्रबल इच्छा को व्यक्त करती है, जबकि ‘दुःख उठाना’ धार्मिक शब्दावली का अनावश्यक विस्तार किए बिना πάσχω का भाव देता है।
