lexical_decisions:
- source_word: ἐχάρησαν
  choice: आनन्दित हुए
  rationale: यह क्रिया उनकी प्रबल प्रसन्नता व्यक्त करती है। ‘आनन्दित हुए’ आधुनिक, गरिमापूर्ण हिन्दी में इस भाव को बनाए रखता है।
- source_word: συνέθεντο
  choice: सहमत हो गए
  rationale: मध्य रूप यहाँ आपसी सहमति या समझौते पर पहुँचने का अर्थ देता है। ‘सहमत हो गए’ संक्षिप्त और स्वाभाविक है; ‘वचन दिया’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: αὐτῷ
  choice: उसे
  rationale: सम्प्रदान कारक सर्वनाम धन पाने वाले व्यक्ति को सूचित करता है। हिन्दी में ‘उसे धन देना’ स्वाभाविक और स्पष्ट है।
- source_word: ἀργύριον
  choice: धन
  rationale: शब्द का शाब्दिक अर्थ ‘चाँदी’ हो सकता है, पर लेन-देन के इस प्रसंग में यह सामान्यतः धन को सूचित करता है। मुख्य पाठ में ‘धन’ अर्थ को स्पष्ट रखता है और शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: δοῦναι
  choice: देने
  rationale: अनन्त क्रिया सहमति की विषय-वस्तु बताती है। ‘देने’ इसका सीधा समतुल्य है; ‘भुगतान करने’ से वह अर्थ जुड़ सकता है जो मूल क्रिया में स्वयं स्पष्ट नहीं है।
