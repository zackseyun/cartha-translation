  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: hi
  text: तब उन सबने कहा, “तो क्या तुम परमेश्वर का पुत्र हो?” उसने उनसे कहा, “तुम ही कहते हो कि मैं हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार ढंग से: “तुम कहते हो, वैसा ही है” या “तुम ऐसा कहते हो।” यीशु का उत्तर स्वीकारात्मक है, पर यूनानी में अधिक शाब्दिक रूप से है, “तुम ही कहते हो कि मैं हूँ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: उन सबने
  rationale: यह विशेषण संज्ञा की तरह पूरे समूह को दर्शाता है; ‘उन सबने’ सामूहिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: तो क्या
  rationale: प्रश्न में यह पिछले कथन से निकले निष्कर्ष को व्यक्त करता है; हिन्दी में ‘तो क्या’ इसका स्वाभाविक रूप है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यह मसीही उपाधि है; निश्चितता संदर्भ और ‘के पुत्र’ वाली रचना से स्पष्ट रहती है।
- source_word: ἔφη
  choice: कहा
  rationale: संदर्भ में साधारण कथन-क्रिया पर्याप्त और स्वाभाविक है।
- source_word: Ὑμεῖς
  choice: तुम ही
  rationale: यूनानी में स्पष्ट सर्वनाम बलाघाती है; ‘तुम ही’ उस जोर को बिना अस्वाभाविक विस्तार के व्यक्त करता है।
- source_word: λέγετε
  choice: कहते हो
  rationale: वर्तमानकाल और बहुवचन संबोधन को सीधे रूप में सुरक्षित रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनके कथन की विषयवस्तु का परिचय देता है।
- source_word: ἐγώ εἰμι
  choice: मैं हूँ
  rationale: यूनानी की संक्षिप्त और संभावित रूप से गंभीर अभिव्यक्ति को बिना व्याख्यात्मक शब्द जोड़े सीधे रखता है।
theological_decisions:
- issue: यीशु के उत्तर को स्पष्ट स्वीकारोक्ति माना जाए या कुछ अप्रत्यक्ष उत्तर के रूप में रखा जाए
  choice: “तुम ही कहते हो कि मैं हूँ”
  alternative: “तुम कहते हो, वैसा ही है” / “हाँ, मैं हूँ”
  rationale: मूल यूनानी उत्तर संदर्भ में स्वीकारात्मक है, पर उसकी असामान्य और तनावपूर्ण शब्दावली को स्पष्ट ‘हाँ’ जोड़कर पूरी तरह नहीं सुलझाना चाहिए। मुख्य पाठ मूल संरचना को सुरक्षित रखता है और पादटिप्पणी उसका आशय बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तुम’ मूल के बहुवचन संबोधन को संदर्भानुकूल रखता है; उत्तर की वास्तविक अस्पष्टता और धार्मिक तनाव सुरक्षित हैं।
