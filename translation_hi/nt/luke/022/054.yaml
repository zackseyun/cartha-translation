  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: hi
  text: उन्होंने उसे पकड़ लिया, फिर ले जाकर महायाजक के घर के भीतर पहुँचाया; पर पतरस दूर से[a] उसके पीछे चल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ दूरी पर”; परंपरागत रूप से, “दूर ही से।”
    reason: μακρόθεν के स्थानगत अर्थ को व्यक्त करने वाले वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: Συλλαβόντες
  choice: पकड़ लिया
  rationale: यह συλλαμβάνω का एओरिस्ट कृदंत है और मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है। प्रसंग में यह गिरफ्तारी के अर्थ में है; ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक है और हिरासत में लेने का भाव भी बनाए रखता है।
- source_word: ἤγαγον
  choice: ले जाकर
  rationale: ἄγω का मूल भाव किसी को साथ लेकर चलने या ले जाने का है। ‘ले जाकर’ हिरासत में स्थानांतरण को स्वाभाविक हिन्दी में व्यक्त करता है और अगली क्रिया के साथ क्रम बनाए रखता है।
- source_word: εἰσήγαγον
  choice: घर के भीतर पहुँचाया
  rationale: εἰσάγω भीतर ले जाने का दिशात्मक भाव रखता है। ‘भीतर पहुँचाया’ उस प्रवेश को स्पष्ट करता है और ‘ले गए’ की असहज पुनरावृत्ति से बचता है।
- source_word: οἰκίαν
  choice: घर
  rationale: यहाँ οἰκία किसी भौतिक भवन को दर्शाता है। ‘घर’ सीधा, सामान्य और आधुनिक हिन्दी का स्वाभाविक शब्द है।
- source_word: ἀρχιερέως
  choice: महायाजक
  rationale: ἀρχιερεύς के लिए ‘महायाजक’ स्थापित और संदर्भानुकूल हिन्दी पद है।
- source_word: ἠκολούθει
  choice: पीछे चल रहा था
  rationale: अपूर्ण भूतकाल की क्रिया अतीत में जारी कार्रवाई को दिखाती है। ‘चल रहा था’ उस निरंतरता को सुरक्षित रखता है; ‘पीछे’ ἀκολουθέω के अनुसरण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μακρόθεν
  choice: दूर से
  rationale: यह क्रियाविशेषण स्थानगत दूरी बताता है। ‘दूर से’ संक्षिप्त, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: पर
  rationale: दूसरा δέ यीशु को भीतर ले जाए जाने और पतरस के दूरी बनाकर पीछे चलने के बीच हल्का विरोध दिखाता है। ‘पर’ उस विरोध को बिना अधिक जोर दिए व्यक्त करता है।
theological_decisions:
- issue: गिरफ्तारी के समय यीशु के साथ पतरस के संबंध का कथात्मक चित्रण
  choice: ‘पीछे चल रहा था’ और ‘दूर से’ कहकर केवल दिखाई गई कार्रवाई और स्थानगत दूरी व्यक्त की गई है।
  alternative: ‘चुपके से पीछे चल रहा था’ या ‘डरते हुए पीछे चल रहा था।’
  rationale: पद पतरस की मनःस्थिति या उद्देश्य स्पष्ट नहीं करता। अनुवाद उसके व्यवहार को कायरता, गोपनीयता या निष्ठा के किसी निश्चित मूल्यांकन से नहीं जोड़ता और कथात्मक तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में गिरफ्तारी, ले जाने और घर के भीतर पहुँचाने का क्रम स्पष्ट है; पतरस की मनोवृत्ति के बारे में कोई अतिरिक्त अर्थ नहीं जोड़ा गया।
