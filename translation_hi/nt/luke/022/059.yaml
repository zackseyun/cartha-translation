source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: hi
  text: लगभग एक घंटा बीत जाने पर, एक और आदमी[a] ज़ोर देकर कहने लगा, “सचमुच, यह आदमी भी उसके साथ था, क्योंकि यह भी गलीली है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक और व्यक्ति”; यूनानी पद अनिश्चित है, यद्यपि प्रसंग पुरुष वक्ता की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: लगभग एक घंटा बीत जाने पर
  rationale: यह संबंधवाचक निरपेक्ष रचना समय बीतने को दर्शाती है। यह अनुवाद यूनानी के कालगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄλλος τις
  choice: एक और आदमी
  rationale: इसका मूल अर्थ ‘कोई और’ या ‘एक और व्यक्ति’ है। यूनानी रूप पुल्लिंग है और प्रसंग पुरुष वक्ता की ओर संकेत करता है, इसलिए ‘आदमी’ स्वाभाविक है; मूल की अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: διϊσχυρίζετο
  choice: ज़ोर देकर कहने लगा
  rationale: अपूर्ण भूतकाल और क्रिया का बल मिलकर दृढ़ तथा कुछ हद तक जारी कथन दर्शाते हैं। यह वाक्यांश दोनों पहलुओं को सहज हिन्दी में व्यक्त करता है।
- source_word: Ἐπ’ ἀληθείας
  choice: सचमुच
  rationale: यह मुहावरा कथन की सत्यता पर प्रबल ज़ोर देता है। ‘सचमुच’ संक्षिप्त, स्वाभाविक और बलयुक्त है।
- source_word: οὗτος
  choice: यह आदमी
  rationale: संकेतवाचक सर्वनाम पतरस की ओर प्रत्यक्ष और आरोपात्मक ढंग से संकेत करता है; ‘यह आदमी’ उस भाव को केवल ‘यह’ या ‘वह’ से अधिक स्पष्ट रखता है।
- source_word: μετ’ αὐτοῦ ἦν
  choice: उसके साथ था
  rationale: यह सीधा अनुवाद साथ होने के दावे को सुरक्षित रखता है और उसे ‘शिष्य’ या ‘साथी’ कहकर आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: καὶ γὰρ
  choice: क्योंकि यह भी
  rationale: γάρ कारण प्रस्तुत करता है और καί ‘भी’ का भाव जोड़ता है। हिन्दी में यह संयोजन तर्क के संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: Γαλιλαῖός ἐστιν
  choice: गलीली है
  rationale: यह पतरस की क्षेत्रीय पहचान बताता है। ‘गलीली’ हिन्दी बाइबिलीय प्रयोग में संक्षिप्त और सुबोध जातिवाचक/क्षेत्रवाचक रूप है।
