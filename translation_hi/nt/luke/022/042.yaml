base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: hi
  text: यह कहते हुए, “हे पिता, यदि तू चाहे, तो यह प्याला[a] मुझसे हटा ले[b]। फिर भी मेरी नहीं, बल्कि तेरी इच्छा पूरी हो[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्याला’ बाइबिल में किसी को मिले हुए भाग का रूपक है, विशेषकर दुःख या न्याय का।
    reason: cross_reference
  - marker: b
    text: या, “यह प्याला मेरे पास से दूर कर दे।”
    reason: lexical_alternative
  - marker: c
    text: या, “जो मैं चाहता हूँ वह नहीं, बल्कि जो तू चाहता है वह हो।”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदन्त को पिछले कथन से जुड़ा रखते हुए प्रार्थना के शब्दों का परिचय देता है; इसे स्वतंत्र पूर्ण क्रिया में बदलने से बचाया गया है।
- source_word: Πάτερ
  choice: हे पिता
  rationale: परमेश्वर को किए गए सीधे सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εἰ βούλει
  choice: यदि तू चाहे
  rationale: βούλομαι की इच्छा अथवा तत्परता का भाव और शर्त दोनों सुरक्षित रहते हैं। एकवचन ‘तू’ मूल यूनानी के एकवचन सम्बोधन और पिता-पुत्र के निकट सम्बन्ध को दर्शाता है।
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: मुझसे हटा ले
  rationale: आज्ञार्थक निवेदन और ‘मुझसे दूर’ किए जाने का अर्थ संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τοῦτο τὸ ποτήριον
  choice: यह कटोरा
  rationale: मूल रूपक को व्याख्यात्मक रूप से ‘दुःख’ या ‘न्याय’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: πλὴν
  choice: फिर भी
  rationale: पहले निवेदन से पिता की इच्छा के प्रति समर्पण की ओर आने वाले प्रबल रियायती मोड़ को सहज आधुनिक हिन्दी में दर्शाता है।
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: मेरी नहीं, बल्कि तेरी इच्छा
  rationale: ‘इच्छा’ को दूसरी बार न दोहराकर यूनानी के संक्षिप्त विरोध को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: γινέσθω
  choice: पूरी हो
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया का आशय है कि पिता की इच्छा प्रभावी हो; ‘पूरी हो’ प्रार्थना के प्रसंग में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: यीशु की इच्छा और पिता की इच्छा का सम्बन्ध
  choice: “मेरी नहीं, बल्कि तेरी इच्छा पूरी हो” के सीधे विरोध और समर्पण को बनाए रखा गया है।
  alternative: “जो मैं चाहता हूँ वह नहीं, बल्कि जो तू चाहता है वह हो।”
  rationale: मूल पाठ यीशु की इच्छा को पिता की इच्छा से अलग बताते हुए उसके समर्पण को प्रस्तुत करता है। अनुवाद इस तनाव को किसी बाद की धर्मवैज्ञानिक व्याख्या द्वारा न तो मिटाता है, न समझाकर सीमित करता है।
- issue: ‘कटोरे’ का रूपक
  choice: मुख्य पाठ में ‘कटोरा’ रखा गया है।
  alternative: “यह दुःख” या “यह यातना”
  rationale: ‘कटोरा’ बाइबिल में मिले हुए भाग—विशेषकर दुःख या न्याय—का अर्थ धारण कर सकता है। रूपक को सीधे खोल देना उसके अन्तरपाठीय और धर्मवैज्ञानिक विस्तार को कम कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के लिए एकवचन ‘तू/तेरी’ निकट पितृ-सम्बन्ध तथा यूनानी एकवचन को बनाए रखता है; इसका प्रयोग अनादर के अर्थ में नहीं है। वाक्य का आरम्भ कृदन्तीय है क्योंकि यह पद पिछले प्रसंग से व्याकरणिक रूप से जुड़ा हुआ है।
