translation:
  language: hi
  text: और वह उनसे लगभग एक पत्थर फेंकने की दूरी तक दूर हट गया और घुटने टेककर प्रार्थना करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: अलग हो गया
  rationale: रूप निष्क्रिय है और शाब्दिक रूप से ‘अलग खींचा गया’ हो सकता है, पर इस प्रसंग में यह यीशु के शिष्यों से कुछ दूरी पर चले जाने को मुहावरेदार ढंग से व्यक्त करता है। ‘अलग हो गया’ स्वाभाविक है और अनावश्यक रूप से बलपूर्वक खींचे जाने का भाव नहीं जोड़ता।
- source_word: ὡσεὶ λίθου βολήν
  choice: लगभग एक पत्थर फेंकने जितनी दूरी पर
  rationale: यह अनुमानित दूरी बताने वाला मुहावरा है। यह चयन ὡσεὶ के ‘लगभग’ और λίθου βολήν की पत्थर फेंकने भर की दूरी—दोनों को स्पष्ट, आधुनिक हिन्दी में रखता है।
- source_word: θεὶς τὰ γόνατα
  choice: घुटने टेककर
  rationale: शाब्दिक अभिव्यक्ति ‘घुटनों को रखकर’ घुटने टेकने का यूनानी मुहावरा है। हिन्दी में ‘घुटने टेककर’ वही शारीरिक मुद्रा स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσηύχετο
  choice: प्रार्थना करता रहा
  rationale: अपूर्ण भूतकालीन रूप जारी क्रिया को दर्शाता है। ‘करता रहा’ साधारण ‘प्रार्थना की’ की अपेक्षा इस कालगत पक्ष को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: αὐτὸς
  choice: वह
  rationale: सर्वनाम में हल्का बल संभव है, पर हिन्दी में ‘वह स्वयं’ कहना यहाँ अनावश्यक रूप से जोरदार लगेगा। ‘वह’ विषय को स्पष्ट रखता है।
- source_word: καὶ
  choice: और
  rationale: यह सीधा कथात्मक संयोजक है और बिना अतिरिक्त व्याख्यात्मक अर्थ जोड़े प्रसंग का प्रवाह बनाए रखता है।
theological_decisions:
- issue: प्रार्थना की मुद्रा और मसीह का चित्रण
  choice: यीशु के अलग होने, घुटने टेकने और लगातार प्रार्थना करने का सीधा वर्णन
  alternative: इस क्रिया में अतिरिक्त भक्तिपरक या मसीह-विषयक व्याख्या जोड़ना
  rationale: पद शारीरिक क्रिया, दूरी और प्रार्थना का वर्णन करता है; अनुवाद को दृश्य की गंभीरता बनाए रखते हुए ऐसी कोई सैद्धान्तिक व्याख्या नहीं जोड़नी चाहिए जो मूल पाठ में व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। दूरी के यूनानी मुहावरे को समझने योग्य हिन्दी वाक्यांश में व्यक्त किया गया है, और अपूर्ण भूतकाल का जारी भाव ‘प्रार्थना करता रहा’ से सुरक्षित रखा गया है।
