source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: hi
  text: परन्तु मैंने तुम्हारे लिए प्रार्थना की है कि तुम्हारा विश्वास बना रहे[a]; और तुम, जब लौट आओ[b], तो अपने भाइयों को दृढ़ करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी विश्वासयोग्यता बनी रहे” अथवा “तुम्हारा भरोसा बना रहे।” यूनानी शब्द में ये परस्पर जुड़े अर्थ हो सकते हैं।
    reason: alternative_reading
  - marker: b
    text: या “जब तुम लौटो” अथवा “जब तुम फिर लौट आओ।” यह अभिव्यक्ति पतरस की आगामी विफलता के बाद उसकी बहाली का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: मैंने ... प्रार्थना की है
  rationale: यह क्रिया गंभीर विनती को व्यक्त करती है। हिन्दी में पूर्ण कार्य और उसकी वर्तमान प्रासंगिकता दिखाने के लिए यह स्वाभाविक प्रयोग है।
- source_word: περὶ σοῦ
  choice: तुम्हारे लिए
  rationale: प्रार्थना की क्रिया के साथ περί और सम्बन्धकारक मध्यस्थ प्रार्थना को व्यक्त करते हैं; ‘तुम्हारे लिए’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: कि ... चूक न जाए
  rationale: ἐκλείπω का अर्थ विफल होना, समाप्त हो जाना या साथ छोड़ देना हो सकता है। ‘चूक न जाए’ विश्वास के पूरी तरह मिट जाने का अर्थ थोपे बिना उसके परीक्षा में विफल पड़ने की आशंका व्यक्त करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ शब्द में विश्वास, भरोसे और विश्वस्त बने रहने के परस्पर जुड़े भाव हैं। ‘विश्वास’ इसकी व्यापकता बनाए रखता है।
- source_word: ποτε
  choice: जब
  rationale: यह भविष्य के एक अवसर को सूचित करता है; कृदन्त के साथ हिन्दी में ‘जब’ सहज है।
- source_word: ἐπιστρέψας
  choice: जब लौट आओ
  rationale: यह लौटने या फिरने का अर्थ देता है और पतरस की आगामी विफलता के बाद बहाली का संकेत रखता है, पर मुख्य पाठ में ‘मन फिराना’ जैसा अधिक संकीर्ण धार्मिक अर्थ नहीं थोपता।
- source_word: στήρισον
  choice: दृढ़ करना
  rationale: आज्ञार्थक क्रिया दूसरों को स्थिर और मजबूत करने की बात कहती है; ‘दृढ़ करना’ आध्यात्मिक और संबंधपरक दोनों भावों के अनुकूल है।
- source_word: ἀδελφούς
  choice: भाइयों
  rationale: तात्कालिक संदर्भ में यीशु के पुरुष शिष्यों का समूह अभिप्रेत है, इसलिए व्याकरणिक पुल्लिंग बहुवचन को बनाए रखा गया है।
theological_decisions:
- issue: πίστις में ‘विश्वास’, ‘भरोसा’ और ‘विश्वासयोग्यता’ के मिलते-जुलते अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: ‘विश्वास’ मूल शब्द की धर्मवैचारिक और संबंधपरक व्यापकता को बनाए रखता है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- issue: ἐπιστρέψας द्वारा पतरस की भावी दशा का संकेत
  choice: जब लौट आओ
  alternative: जब फिर आओ; जब फिर जाओ; जब मन फिराओ
  rationale: ‘लौट आओ’ विफलता के बाद बहाली की दिशा को व्यक्त करता है, पर पश्चात्ताप अथवा धर्म-परिवर्तन की तकनीकी व्याख्या को अनिवार्य नहीं बनाता।
- issue: ἀδελφούς का संदर्भ
  choice: भाइयों
  alternative: भाइयों और बहनों; साथी विश्वासियों
  rationale: निकट संदर्भ में संबोधन पुरुष शिष्यों की ओर है; समावेशी विस्तार इस दृश्य के तात्कालिक संदर्भ से आगे चला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संबोधन रखा गया है। एकवचन ‘तुम’ यूनानी σοῦ और σύ को स्पष्ट करता है। ‘परन्तु’ δέ के विरोधात्मक बल को और ‘तो’ कृदन्त से आज्ञा की ओर संक्रमण को स्वाभाविक बनाता है।
