  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: hi
  text: उनके बीच इस बात को लेकर विवाद भी उठा कि उनमें से कौन बड़ा माना जाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें से कौन बड़ा जान पड़ता है।” यूनानी क्रिया का अर्थ “जान पड़ता है” या “माना जाता है” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: उठा
  rationale: यहाँ क्रिया किसी स्थिति के आरम्भ होने को बताती है; ‘विवाद उठा’ स्वाभाविक हिन्दी है।
- source_word: δὲ καὶ
  choice: भी
  rationale: ‘भी’ καί की योगात्मक शक्ति को व्यक्त करता है। δέ के हल्के कथात्मक संक्रमण को हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: φιλονεικία
  choice: विवाद
  rationale: यह शब्द कलहपूर्ण मतभेद या प्रतिस्पर्धी तकरार को दर्शाता है; ‘विवाद’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: यह समूह के भीतर हुए विवाद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ τίς αὐτῶν
  choice: इस बात को लेकर … कि उनमें से कौन
  rationale: यूनानी पदबंध विवाद की विषय-वस्तु प्रस्तुत करता है; यह हिन्दी रचना उस अप्रत्यक्ष प्रश्न को स्पष्ट और सहज रखती है।
- source_word: δοκεῖ
  choice: माना जाता है
  rationale: इस सन्दर्भ में क्रिया समूह की दृष्टि में किसी के दर्जे या मूल्यांकन को सूचित कर सकती है। ‘माना जाता है’ उस सामाजिक आकलन को व्यक्त करता है, जबकि वैकल्पिक अर्थ ‘जान पड़ता है’ पाद-टिप्पणी में सुरक्षित है।
- source_word: μείζων
  choice: बड़ा
  rationale: यूनानी में तुलनात्मक रूप है, स्पष्ट अतिशयोक्ति नहीं; ‘बड़ा’ हिन्दी में तुलना को स्वाभाविक रूप से रखता है और ‘सबसे बड़ा’ जोड़कर अर्थ को तीव्र नहीं करता।
theological_decisions:
- issue: शिष्यों के बीच दर्जे की तुलना
  choice: बड़ा
  alternative: सबसे बड़ा; अधिक महत्त्वपूर्ण
  rationale: मूल यूनानी में μείζων तुलनात्मक है। इसलिए अनुवाद उसी रूप को बनाए रखता है और उसे स्पष्ट अतिशयोक्ति या व्याख्यात्मक ‘अधिक महत्त्वपूर्ण’ में नहीं बदलता।
- issue: δοκεῖ में निहित दृष्टिकोण
  choice: माना जाता है
  alternative: जान पड़ता है
  rationale: यहाँ सामाजिक प्रतिष्ठा का आकलन सन्दर्भानुकूल है, पर यूनानी क्रिया ‘जान पड़ना’ भी अर्थ दे सकती है; वास्तविक अस्पष्टता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विवाद उठा’ स्वाभाविक कथात्मक प्रयोग है, और पाद-टिप्पणी δοκεῖ की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखती है।
