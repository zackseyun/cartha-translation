source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “गैर-यहूदी लोगों[a] के राजा उन पर प्रभुता जताते हैं, और उन पर अधिकार चलाने वाले ‘उपकारी’[b] कहलाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों के।”
    reason: lexical_alternative
  - marker: b
    text: ‘उपकारी’ शासकों या शक्तिशाली संरक्षकों के लिए प्रयुक्त एक सम्मानसूचक उपाधि थी; ऐसे लोगों को सार्वजनिक भलाई करने वाला माना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: राजा
  rationale: यह संज्ञा सामान्य शासकों के बजाय विशेष रूप से राजाओं को दर्शाती है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदी जातियों के
  rationale: लूका-प्रेरितों के काम में यह पद प्रायः गैर-यहूदी लोगों के लिए आता है; ‘जातियों के’ भी शाब्दिक रूप से संभव है।
- source_word: κυριεύουσιν
  choice: प्रभुता जताते हैं
  rationale: यह प्रयोग केवल शासन करने के बजाय दूसरों पर मालिकाना प्रभुत्व जमाने की सक्रिय और नकारात्मक छाया व्यक्त करता है।
- source_word: ἐξουσιάζοντες
  choice: जो ... अधिकार चलाते हैं
  rationale: 'क्रियात्मक कृदंत का सक्रिय भाव सुरक्षित रहता है: वे केवल पद पर नहीं हैं, बल्कि अधिकार का प्रयोग करते हैं।'
- source_word: εὐεργέται
  choice: ‘उपकारी’
  rationale: यह किसी का भला करने वाले व्यक्ति का अर्थ देता है और साथ ही शासकों अथवा शक्तिशाली संरक्षकों की सम्मानसूचक उपाधि के रूप में समझा जा सकता है।
- source_word: καλοῦνται
  choice: कहलाते हैं
  rationale: मूल का कर्मवाच्य भाव और उपाधि से पुकारे जाने का अर्थ स्वाभाविक हिन्दी में बना रहता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग में चेलों के विवाद के साथ हल्का विरोध दर्शाता है।
theological_decisions:
- issue: τῶν ἐθνῶν का संदर्भगत अर्थ
  choice: गैर-यहूदी जातियों के
  alternative: राष्ट्रों के / जातियों के
  rationale: यहाँ कथन गैर-यहूदी जगत की राजनीतिक प्रभुता को उस आचरण से अलग करता है जो यीशु अपने चेलों से चाहते हैं। ‘गैर-यहूदी जातियाँ’ सामान्य नए नियमीय अर्थ को स्पष्ट करता है, पर शब्द की सामूहिकता भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रभुता जताते हैं’ और ‘अधिकार चलाते हैं’ समानार्थी होते हुए भी क्रमशः κυριεύουσιν की दमनकारी छाया और ἐξουσιάζοντες की सक्रियता को अलग-अलग व्यक्त करते हैं। उद्धरण-चिह्न ‘उपकारी’ के उपाधिगत प्रयोग का संकेत देते हैं।
