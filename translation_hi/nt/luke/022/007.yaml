  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: hi
  text: फिर अख़मीरी रोटी के पर्व का वह दिन आया, जिस दिन फ़सह[a] का बलिदान किया जाना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फ़सह का मेमना’ अथवा ‘फ़सह की बलि।’ यूनानी शब्द फ़सह के पर्व को या इस संदर्भ में विशेष रूप से उसके बलि-पशु को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: आया
  rationale: समय या दिन के आ पहुँचने के लिए ἔρχομαι का मुहावरेदार प्रयोग है; ‘आया’ हिन्दी में स्वाभाविक है और कालगत भाव बनाए रखता है।
- source_word: δὲ
  choice: फिर
  rationale: यहाँ δέ कथा की अगली घटना की ओर बढ़ाता है; ‘फिर’ क्रमिक प्रगति को सहज ढंग से व्यक्त करता है।
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: अख़मीरी रोटी के पर्व का वह दिन
  rationale: यूनानी में ‘दिन’ एकवचन है और τῶν ἀζύμων पर्व से जुड़ी अख़मीरी रोटियों को सूचित करता है। हिन्दी में पर्व का संकेत स्पष्ट करने से पद सहज और संदर्भानुकूल बनता है।
- source_word: ᾗ
  choice: जिस दिन
  rationale: सम्बन्धवाचक सर्वनाम पहले आए ‘दिन’ की ओर लौटता है; ‘जिस दिन’ हिन्दी में उसके कालगत सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔδει
  choice: किया जाना था
  rationale: अपूर्णकालिक ἔδει आवश्यक या निर्धारित होने का भाव देता है। निष्क्रिय क्रिया के साथ यह रचना पर्व-विधान से जुड़ी आवश्यकता को स्पष्ट करती है।
- source_word: θύεσθαι
  choice: बलिदान किया जाना
  rationale: θύω यहाँ उपासना-संबंधी बलि के संदर्भ में है; ‘बलिदान किया जाना’ केवल वध नहीं, बल्कि अनुष्ठानिक बलि का भाव भी व्यक्त करता है।
- source_word: τὸ πάσχα
  choice: फ़सह
  rationale: πάσχα पर्व, भोज या इस संदर्भ में बलि-पशु को सूचित कर सकता है। मुख्य पाठ में व्यापक पद ‘फ़सह’ रखने से मूल की अर्थगत व्यापकता बनी रहती है, जबकि क्रिया बलि-पशु का संदर्भ प्रकट करती है।
theological_decisions:
- issue: बलिदान-संदर्भ में τὸ πάσχα का आशय
  choice: मुख्य पाठ में ‘फ़सह’ रखा गया है और बलि का भाव ‘बलिदान किया जाना’ से व्यक्त किया गया है।
  alternative: ‘फ़सह का मेमना’ या ‘फ़सह की बलि’
  rationale: πάσχα स्वयं पर्व या उसके बलि-पशु दोनों की ओर संकेत कर सकता है। अधिक विशिष्ट अर्थ को मुख्य पाठ में अनिवार्य न बनाकर पाद-टिप्पणी में देना मूल की वास्तविक अर्थगत गुंजाइश और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘अख़मीरी रोटी’ और ‘फ़सह’ प्रचलित बाइबलीय शब्दावली हैं; साथ ही ‘पर्व’ जोड़कर सामान्य पाठक के लिए संदर्भ स्पष्ट किया गया है।
