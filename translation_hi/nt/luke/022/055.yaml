    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: उन्होंने ... आग जलाई
  rationale: यह बहुवचन एओरिस्ट कृदंत मुख्य क्रिया से पहले की घटना बताता है। हिन्दी में ‘आग जलाई’ स्वाभाविक और अर्थ-सटीक है।
- source_word: πῦρ
  choice: आग
  rationale: संदर्भ में आँगन में जलाई गई एक निश्चित आग है; हिन्दी में यहाँ बिना अनिश्चित उपपद के ‘आग’ स्वाभाविक है।
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: आँगन के बीच में
  rationale: यह ठोस स्थान-सूचक वाक्यांश है। αὐλή महायाजक के निवास के खुले आँगन को दर्शाता है।
- source_word: συγκαθισάντων
  choice: साथ बैठ गए
  rationale: एओरिस्ट कृदंत और σύν उपसर्ग मिलकर लोगों के एक साथ बैठने का भाव देते हैं।
- source_word: ἐκάθητο
  choice: बैठा हुआ था
  rationale: इम्परफेक्ट रूप चल रही पृष्ठभूमिगत अवस्था को व्यक्त करता है; ‘बैठा हुआ था’ हिन्दी में इस निरंतर दृश्य को स्पष्ट रखता है।
- source_word: μέσος αὐτῶν
  choice: उनके बीच
  rationale: यह पतरस की समूह के भीतर स्थिति बताता है; ‘उनके बीच’ सहज और सटीक हिन्दी है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है जो प्रसंग को आगे बढ़ाता है; हिन्दी कथन में ‘तब’ स्वाभाविक है।
