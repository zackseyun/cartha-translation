source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: hi
  text: और प्रधान याजक और शास्त्री यह ढूँढ़ रहे थे कि वे उसे कैसे मार डालें[a], क्योंकि वे जनता से डरते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसे किस तरह मृत्यु के घाट उतारें।”
    reason: ἀνέλωσιν के लिए एक अधिक औपचारिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἐζήτουν
  choice: इस बात की खोज में थे
  rationale: अपूर्ण भूतकाल चल रहे प्रयास को व्यक्त करता है; यह प्रयोग उस निरंतरता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह यरूशलेम के वरिष्ठ याजकीय नेतृत्व के लिए प्रचलित और अर्थ-संगत हिन्दी पद है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के संदर्भ में यह सीधा और स्थापित अनुवाद है; ‘व्यवस्था के शिक्षक’ मूल से अधिक व्याख्यात्मक होता।
- source_word: τὸ πῶς
  choice: कि वे उसे कैसे
  rationale: सव्यय पद τὸ πῶς का मुहावरेदार अर्थ ‘कैसे’ अथवा ‘किस तरह’ है; हिन्दी में यह वाक्य-विन्यास स्वाभाविक है।
- source_word: ἀνέλωσιν
  choice: मार डालें
  rationale: यहाँ क्रिया किसी को मृत्यु के द्वारा हटा देने के स्पष्ट आशय को व्यक्त करती है; ‘मार डालें’ तीव्रता को बिना न्यायिक प्रक्रिया जोड़े सुरक्षित रखता है।
- source_word: ἐφοβοῦντο
  choice: डरते थे
  rationale: अपूर्ण भूतकाल भय की जारी अवस्था दर्शाता है; ‘डरते थे’ हिन्दी में वही निरंतर भाव देता है।
- source_word: τὸν λαόν
  choice: लोगों
  rationale: λαός यहाँ सामूहिक रूप से जनता को दर्शाता है; ‘भीड़’ कहना अर्थ को किसी एकत्र समूह तक अनावश्यक रूप से सीमित कर देता।
theological_decisions:
- issue: ἀνέλωσιν में अगुवों के आशय की तीव्रता
  choice: मार डालें
  alternative: मृत्यु के घाट उतारें; प्राण ले लें
  rationale: मूल पाठ घातक आशय को स्पष्ट करता है, पर इस चरण पर औपचारिक न्यायिक मृत्युदंड की प्रक्रिया निर्दिष्ट नहीं करता।
- issue: λαός का संदर्भ
  choice: लोगों
  alternative: भीड़
  rationale: ‘लोगों’ सामूहिक जनता के व्यापक संदर्भ और जन-प्रतिक्रिया से अगुवों के भय को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। आरंभिक ‘और’ यूनानी καὶ तथा पिछले कथन से कथा-संबंध को बनाए रखता है।
