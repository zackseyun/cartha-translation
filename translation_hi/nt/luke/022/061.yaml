base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: hi
  text: 'तब प्रभु ने मुड़कर पतरस की ओर देखा[a], और पतरस को प्रभु की वह बात याद आई, जो उन्होंने उससे कही थी: “आज मुर्गे के बाँग देने से पहले तुम तीन बार मेरा इनकार करोगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पतरस की ओर ध्यान से देखा”; यूनानी क्रिया सीधे और एकटक देखने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: अओरिस्ट कृदंत प्रभु के पहले मुड़ने और फिर पतरस की ओर देखने का क्रम बताता है; ‘मुड़कर’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यहाँ यीशु के लिए प्रयुक्त उपाधि κύριος का प्रचलित और अर्थपूर्ण हिन्दी रूप ‘प्रभु’ है।
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: पतरस की ओर देखा
  rationale: ἐμβλέπω सीधे या ध्यानपूर्वक देखने का भाव दे सकता है। मुख्य पाठ में सहज ‘की ओर देखा’ रखा गया है और अधिक प्रबल सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: ὑπεμνήσθη
  choice: याद आई
  rationale: रूप का अर्थ ‘स्मरण कराया गया’ भी हो सकता है, पर प्रसंग में पतरस के स्मरण का परिणाम प्रमुख है; ‘पतरस को ... याद आई’ स्वाभाविक हिन्दी है और उस ग्रहणशील भाव को भी बनाए रखता है।
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: प्रभु की वह बात
  rationale: λόγος यहाँ यीशु के किसी विशिष्ट कथन को सूचित करता है। हिन्दी में ‘वह बात’ इस सन्दर्भ में ‘वचन’ की अपेक्षा अधिक सहज और स्पष्ट है।
- source_word: ὡς εἶπεν αὐτῷ
  choice: जो उन्होंने उससे कही थी
  rationale: ὡς यहाँ स्मरण की गई बात की विषय-वस्तु प्रस्तुत करता है। हिन्दी सम्बन्धवाचक रचना कथन को स्वाभाविक ढंग से जोड़ती है। सम्मानसूचक बहुवचन ‘उन्होंने’ यीशु के उल्लेख के लिए मानक हिन्दी प्रयोग है।
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: मुर्गे के बाँग देने से पहले
  rationale: πρίν और infinitive पूर्वकालिक सम्बन्ध व्यक्त करते हैं। हिन्दी में जातिवाचक ‘मुर्गे के बाँग देने’ स्वाभाविक है और यूनानी में अनिश्चित लेख के अभाव को अनावश्यक रूप से निर्णायक नहीं बनाता।
- source_word: σήμερον
  choice: आज
  rationale: σήμερον का सीधा, आधुनिक हिन्दी अर्थ ‘आज’ है और भविष्यवाणी की तात्कालिकता बनाए रखता है।
- source_word: ἀπαρνήσῃ με
  choice: मेरा इनकार करोगे
  rationale: ἀπαρνέομαι यहाँ यीशु से अपने सम्बन्ध या उन्हें जानने का इनकार करने को दर्शाता है। ‘मेरा इनकार करना’ सुसमाचार के इस प्रसंग में परिचित और स्पष्ट हिन्दी है।
- source_word: τρίς
  choice: तीन बार
  rationale: यह τρίς का सीधा और आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ कथात्मक प्रयोग और उपाधि के मसीही भार दोनों को सुरक्षित रखता है; ‘स्वामी’ सम्भव है, पर यहाँ अर्थ को मालिक या गुरु के संकुचित भाव की ओर ले जा सकता है।
