  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: hi
  text: जब यीशु के आस-पास के लोगों ने देखा कि क्या होने वाला था, तो उन्होंने कहा, “प्रभु, क्या हम तलवार से वार करें?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कटार से।” यूनानी शब्द μάχαιρα तलवार या छोटी तलवार/कटार के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब ... ने देखा
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया के साथ स्वाभाविक कालवाचक सम्बन्ध में प्रस्तुत करता है।
- source_word: οἱ περὶ αὐτὸν
  choice: यीशु के आस-पास के लोग
  rationale: यूनानी मुहावरा उनके निकट उपस्थित लोगों को दर्शाता है; संदर्भ स्पष्ट करने के लिए सर्वनाम के स्थान पर ‘यीशु’ रखा गया है, बिना उन्हें केवल शिष्य कहकर अर्थ सीमित किए।
- source_word: τὸ ἐσόμενον
  choice: क्या होने वाला है
  rationale: भविष्य कृदन्त आसन्न घटना को व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: εἶπαν
  choice: उन्होंने कहा
  rationale: λέγω का सामान्य अर्थ बनाए रखता है, जबकि उद्धृत प्रश्न से पूछने का भाव स्वयं स्पष्ट होता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे सम्बोधित करने में सम्मानसूचक और उपाधिगत दोनों भार सुरक्षित रखता है।
- source_word: εἰ πατάξομεν
  choice: क्या हम ... वार करें?
  rationale: यहाँ εἰ भविष्यकालीन क्रिया के साथ विचार-विमर्श वाला प्रश्न बनाता है; हिन्दी में सम्भावित कार्रवाई की अनुमति पूछने का यह स्वाभाविक रूप है।
- source_word: ἐν μαχαίρῃ
  choice: तलवार से
  rationale: ἐν को करणवाचक रूप में और μάχαιρα को संदर्भानुकूल ‘तलवार’ के रूप में प्रस्तुत करता है; यूनानी में निश्चित उपपद नहीं है, इसलिए हिन्दी किसी एक खास तलवार को अनावश्यक रूप से निश्चित नहीं करती।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सीधे सम्बोधन के सम्मान और इस उपाधि की धर्मवैज्ञानिक गूँज दोनों को बनाए रखता है; इसे केवल सामाजिक सम्मानसूचक अर्थ तक सीमित नहीं करता।
- issue: εἰ πατάξομεν में प्रश्न का बल
  choice: क्या हम तलवार से वार करें?
  alternative: क्या हम तलवार से वार करेंगे?
  rationale: संदर्भ में वक्ता भविष्यवाणी नहीं कर रहे, बल्कि आसन्न कार्रवाई के विषय में अनुमति या निर्णय पूछ रहे हैं; विध्यर्थक ‘करें’ इस विचार-विमर्श वाले प्रश्न को व्यक्त करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘वार करें’ युद्ध-संदर्भ में πατάσσω का बल बनाए रखता है। पद के भीतर अस्पष्ट सर्वनाम से बचने के लिए ‘यीशु’ स्पष्ट किया गया है।
