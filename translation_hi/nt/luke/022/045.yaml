  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: hi
  text: और वह प्रार्थना से उठकर चेलों के पास आया और उन्हें शोक के मारे सोते हुए पाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें शोक के कारण सोए हुए पाया।”
    reason: कारणसूचक वाक्यांश और सोने की अवस्था को व्यक्त करने का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: प्रार्थना से उठकर
  rationale: ἀναστὰς मुख्य क्रिया से पहले की क्रिया को दर्शाता है और ἀπό अलग होने या हटने का भाव देता है। यह अनुवाद यूनानी संरचना के निकट रहते हुए घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: चेलों के पास आया
  rationale: πρός यहाँ चेलों की ओर जाकर उनके पास पहुँचने का भाव देता है। हिन्दी में कृदन्त को पूर्ण क्रिया के रूप में रखना अधिक सहज है।
- source_word: μαθητὰς
  choice: चेलों
  rationale: सुसमाचारों में μαθητής के लिए ‘चेला’ प्रचलित, सटीक और सामान्य पाठकों के लिए सहज शब्द है।
- source_word: εὗρεν
  choice: पाया
  rationale: εὑρίσκω यहाँ किसी को एक अवस्था में पाने के अर्थ में है; ‘पाया’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: κοιμωμένους αὐτούς
  choice: उन्हें … सोते हुए
  rationale: वर्तमान कृदन्त उस समय उनकी चल रही अवस्था या क्रिया बताता है जब यीशु ने उन्हें पाया; ‘सोते हुए’ इस क्रियात्मक भाव को बनाए रखता है।
- source_word: ἀπὸ τῆς λύπης
  choice: शोक के मारे
  rationale: ἀπό यहाँ कारण व्यक्त करता है। ‘शोक के मारे’ स्वाभाविक हिन्दी में दुःख को उनकी नींद का कारण बताता है, जबकि λύπη के गंभीर भाव को भी बनाए रखता है।
theological_decisions:
- issue: चेलों की नींद और शोक के बीच संबंध
  choice: नींद को शोक के परिणाम के रूप में प्रस्तुत किया गया है।
  alternative: वे शोकाकुल अवस्था में सो रहे थे, पर कारणात्मक संबंध पर कम बल हो।
  rationale: ἀπὸ τῆς λύπης का सबसे स्वाभाविक अर्थ कारणसूचक है—‘शोक के कारण।’ अनुवाद इससे आगे कोई मनोवैज्ञानिक या धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। ‘शोक के मारे’ सामान्य पाठक के लिए स्वाभाविक है; ‘चेला’ सुसमाचारों के परिचित धार्मिक संदर्भ को स्पष्ट रखता है।
