- source_word: τὸ πάσχα
  choice: फसह
  rationale: ‘फसह’ शब्द पर्व, भोज या उससे जुड़े बलिदानी तत्व की संभावित व्यापकता को बनाए रखता है; यहाँ खाने की बात भोज की ओर संकेत करती है।
- source_word: ἵνα φάγωμεν
  choice: ताकि हम उसे खाएँ
  rationale: यह उद्देश्य को स्पष्ट करता है और हिन्दी में निहित कर्म ‘उसे’ जोड़कर वाक्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: τὸ πάσχα का आशय
  choice: मुख्य पाठ में ‘फसह’
  alternative: ‘फसह का भोज’ या ‘फसह का मेमना’
  rationale: तैयारी और खाने का संदर्भ विशेष रूप से भोज की ओर संकेत करता है, पर यूनानी पद स्वयं अधिक व्यापक हो सकता है; इसलिए मुख्य पाठ उसकी अर्थगत व्यापकता को बनाए रखता है और पादटिप्पणी संदर्भगत अर्थ बताती है।
