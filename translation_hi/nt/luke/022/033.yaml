source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “प्रभु, मैं आपके साथ जेल जाने और मृत्यु तक जाने के लिए तैयार हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: पर उसने
  rationale: यहाँ ὁ सर्वनाम के रूप में पतरस की ओर संकेत करता है, और δέ यीशु के पिछले कथन के साथ हल्का विरोध दिखाता है; इसलिए ‘पर उसने’ स्वाभाविक है।
- source_word: εἶπεν αὐτῷ
  choice: उनसे कहा
  rationale: यह λέγω और उसके अप्रत्यक्ष कर्म का सीधा अनुवाद है। आदरसूचक ‘उनसे’ यीशु के लिए स्वाभाविक आधुनिक हिन्दी है और नाम जोड़कर मूल से अधिक स्पष्टता नहीं लाता।
- source_word: Κύριε
  choice: प्रभु
  rationale: सीधे संबोधन में ‘प्रभु’ सम्मान तथा κύριος की धार्मिक-तात्त्विक प्रतिध्वनि दोनों को बनाए रखता है।
- source_word: μετὰ σοῦ
  choice: आपके साथ
  rationale: μετά के संबंधकारक रूप का अर्थ संगति है; यीशु के संबोधन में ‘आपके साथ’ स्वाभाविक और सम्मानपूर्ण है।
- source_word: ἕτοιμός εἰμι
  choice: मैं ... तैयार हूँ
  rationale: यह पदबंध तत्परता और इच्छा व्यक्त करता है; हिन्दी में ‘तैयार हूँ’ दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: καὶ ... καὶ
  choice: —दोनों के लिए
  rationale: दोहराया गया καί जेल और मृत्यु, दोनों को समानांतर और बलपूर्वक जोड़ता है; ‘दोनों’ इस संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς φυλακὴν
  choice: जेल जाने
  rationale: φυλακή यहाँ बंदीगृह अथवा कैद का बोध कराता है। ‘जेल जाने’ साधारण आधुनिक हिन्दी में स्पष्ट है और εἰς की दिशात्मकता बनाए रखता है।
- source_word: εἰς θάνατον
  choice: मृत्यु तक जाने
  rationale: यह वाक्यांश मृत्यु तक साथ देने की तत्परता व्यक्त करता है। ‘मृत्यु तक जाने’ मूल की दिशात्मक उपमा और ‘जेल जाने’ के साथ समानांतरता बनाए रखता है।
- source_word: πορεύεσθαι
  choice: जाने
  rationale: ἕτοιμός εἰμι के पूरक के रूप में यह साथ जाने या उस राह पर बढ़ने को व्यक्त करता है; ‘जाने’ यहाँ सबसे सहज हिन्दी है।
theological_decisions:
- issue: यीशु के लिए κύριος का संबोधन
  choice: प्रभु
  alternative: गुरु / स्वामी
  rationale: ‘प्रभु’ संबोधन के सम्मान और शीर्षक की मसीही प्रतिध्वनि को सुरक्षित रखता है, जबकि ‘गुरु’ अर्थ को केवल शिक्षक तक सीमित कर सकता है और ‘स्वामी’ आधुनिक पाठक को भिन्न सामाजिक अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक सर्वनामों का प्रयोग किया गया है। ‘जेल’ आम पाठकों के लिए ‘कारागार’ से अधिक सहज है, जबकि ‘मृत्यु’ पद की गंभीर और गरिमापूर्ण ध्वनि बनाए रखता है।
