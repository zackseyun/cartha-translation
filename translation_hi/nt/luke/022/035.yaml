source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: hi
  text: फिर उसने उनसे कहा, “जब मैंने तुम्हें बिना धन की थैली, बिना यात्रा की झोली[a] और बिना जूतियों के भेजा था, तो क्या तुम्हें किसी चीज़ की कमी हुई थी?” उन्होंने कहा, “किसी चीज़ की नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यात्रा का थैला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: बिना
  rationale: यह शब्द किसी वस्तु के अभाव को व्यक्त करता है; हिन्दी में ‘बिना’ सहज और सटीक है।
- source_word: βαλλαντίου
  choice: धन की थैली
  rationale: यह पैसे रखने की थैली को दर्शाता है; ‘धन की थैली’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: πήρας
  choice: यात्रा की झोली
  rationale: यह यात्रा में सामान या भोजन रखने की थैली/झोली थी; ‘यात्रा की झोली’ उसके प्रयोजन और प्राचीन परिवेश दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ὑποδημάτων
  choice: जूतियों
  rationale: ὑπόδημα पैरों में पहनी जाने वाली पादुका को दर्शाता है। ‘जूतियाँ’ यहाँ स्वाभाविक है और केवल आधुनिक बंद जूतों का बोध नहीं कराता।
- source_word: μή τινος ὑστερήσατε
  choice: क्या तुम्हें किसी चीज़ की कमी हुई थी?
  rationale: μή वाला प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है, जबकि ὑστερέω अभाव या कमी में होने का अर्थ देता है। यह अनुवाद प्रश्न को स्वाभाविक रखते हुए उस अर्थ को सुरक्षित रखता है।
- source_word: Οὐθενός
  choice: किसी चीज़ की नहीं
  rationale: यह संक्षिप्त संबंधकारक उत्तर है, जिसका आशय है कि उन्हें किसी भी चीज़ की कमी नहीं हुई; हिन्दी में यह उत्तर पिछले प्रश्न से स्वाभाविक रूप से जुड़ता है।
- source_word: ἀπέστειλα
  choice: मैंने तुम्हें ... भेजा था
  rationale: मिशन पर रवाना किए जाने का भाव संदर्भ से स्पष्ट है; हिन्दी में ‘भेजा था’ सहज है और अनावश्यक विस्तार से बचता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘उसने’ निकटवर्ती संदर्भ के पुरुषवाचक कर्ता को बनाए रखता है। प्रश्न और संक्षिप्त उत्तर की मूल संरचना सुरक्षित रखी गई है।
