  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: hi
  text: पर तुम ही वे हो जो मेरी परीक्षाओं[a] में मेरे साथ बने रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परखों” अथवा “प्रलोभनों।” यूनानी शब्द का अर्थ परीक्षा, परख या प्रलोभन हो सकता है; यहाँ सम्भवतः यीशु द्वारा सहे गए कठिन अनुभव अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम ही
  rationale: वाक्य के आरम्भ में आए बहुवचन सर्वनाम का बल व्यक्त करने के लिए ‘ही’ जोड़ा गया है।
- source_word: δέ
  choice: पर
  rationale: यह पिछले प्रसंग से विरोध दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और स्पष्ट है।
- source_word: οἱ διαμεμενηκότες
  choice: वे हो जो ... बने रहे हो
  rationale: संज्ञात्मक पूर्णकालिक कृदन्त एक निश्चित समूह और अब तक जारी रही निष्ठा को दर्शाता है; यह वाक्य-विन्यास दोनों पहलुओं को व्यक्त करता है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: μετά के संबंध और संगति के सामान्य अर्थ को सीधे व्यक्त करता है।
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: मेरी परीक्षाओं में
  rationale: πειρασμός परीक्षा, परख या प्रलोभन का अर्थ दे सकता है। प्रसंग में यीशु द्वारा सहे गए कठिन अनुभव प्रमुख हैं, जबकि ‘परीक्षाओं’ से मूल शब्द की व्यापकता भी कुछ हद तक बनी रहती है।
theological_decisions:
- issue: यीशु के संदर्भ में πειρασμοῖς का अर्थ
  choice: परीक्षाएँ—यीशु द्वारा सहे गए कठिन अनुभव और परख
  alternative: प्रलोभन
  rationale: लूका के इस प्रसंग में शिष्य यीशु की सेवकाई के विरोधों और कठिन परिस्थितियों में उनके साथ बने रहे। फिर भी मूल यूनानी शब्द प्रलोभन का अर्थ भी दे सकता है, इसलिए उस संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। भाषा सरल और गरिमापूर्ण रखी गई है, तथा ‘तुम ही’ मूल के बलाघात को व्यक्त करता है।
