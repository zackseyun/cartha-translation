  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह लूका के ध्यान आकर्षित करनेवाले कथात्मक संकेत और दृश्य की सजीवता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀνὴρ
  choice: एक आदमी
  rationale: मूल शब्द एक पुरुष व्यक्ति को सूचित करता है; ‘आदमी’ साधारण आधुनिक हिन्दी में स्वाभाविक और लिंग-सटीक है।
- source_word: ὀνόματι καλούμενος
  choice: नाम का
  rationale: यूनानी पदबंध का स्वाभाविक हिन्दी अर्थ ‘नाम का’ है; इससे शाब्दिक पुनरुक्ति के बिना नाम की पहचान स्पष्ट होती है।
- source_word: Ζακχαῖος
  choice: जक्कई
  rationale: नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: ἀρχιτελώνης
  choice: प्रधान कर-वसूलनेवाला
  rationale: ἀρχι- के पदानुक्रमिक भाव और τελώνης के कर वसूलने के कार्य, दोनों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτὸς ἦν
  choice: वह ... था
  rationale: सर्वनाम विषय को फिर से सामने लाता है; हिन्दी में ‘वह ... था’ हल्के बल को बिना बढ़ा-चढ़ाकर स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸς πλούσιος
  choice: धनी भी था
  rationale: πλούσιος का सीधा अर्थ ‘धनी’ है; ‘भी’ पुनरुक्त αὐτός के हल्के बल और दूसरे परिचयात्मक गुण को स्वाभाविक हिन्दी में दर्शाता है।
