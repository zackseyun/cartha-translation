    text: या, ‘जनता के नेता।’ यूनानी पदबंध का शाब्दिक अर्थ ‘जनता के प्रथम लोग’ है; इससे जनता के प्रतिष्ठित या प्रभावशाली पुरुष अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: शिक्षा दिया करता था
  rationale: परिभाषात्मक अपूर्ण भूतकाल बीते समय में जारी या बार-बार होने वाली क्रिया दर्शाता है; यह प्रयोग उस निरन्तर और आवर्ती भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह मुहावरा हर दिन होने वाली क्रिया बताता है; ‘प्रतिदिन’ आधुनिक मानक हिन्दी में संक्षिप्त और सहज है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν यहाँ भीतरी पवित्रस्थान मात्र नहीं, पूरे मन्दिर-परिसर को सूचित करता है; ‘मन्दिर’ प्रचलित और पर्याप्त व्यापक अनुवाद है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह बहुवचन याजकीय नेतृत्व-वर्ग को सूचित करता है; ‘प्रधान याजक’ उसका स्थापित हिन्दी प्रतिरूप है।
- source_word: οἱ γραμματεῖς
  choice: शास्त्री
  rationale: यह γραμματεῖς का सीधा और परम्परागत हिन्दी अनुवाद है तथा बिना अतिरिक्त व्याख्या जोड़े उस यहूदी धार्मिक-शास्त्रीय वर्ग को दर्शाता है।
- source_word: ἐζήτουν
  choice: उपाय ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल जारी प्रयास को व्यक्त करता है; सन्दर्भ में इसका आशय केवल खोजने से नहीं, उद्देश्य पूरा करने का अवसर या उपाय तलाशने से है।
- source_word: ἀπολέσαι
  choice: उसका नाश करने
  rationale: ἀπόλλυμι में नष्ट करने और जान से मारने दोनों की अर्थ-सीमा हो सकती है; ‘नाश करने’ शत्रुतापूर्ण तथा सम्भावित प्राणघातक आशय को रखते हुए यूनानी की व्यापकता बचाता है।
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: जनता के प्रमुख पुरुष
  rationale: πρῶτοι का शाब्दिक भाव ‘पहले’ लोगों का है, पर यहाँ वह प्रतिष्ठित या प्रभावशाली व्यक्तियों को सूचित करता है; पुल्लिंग बहुवचन को ऐतिहासिक सन्दर्भ के अनुसार बनाए रखा गया है।
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦ में पुल्लिंग और नेतृत्व का संकेत
  choice: जनता के प्रमुख पुरुष
  alternative: जनता के अगुए / जनता के नेता
  rationale: यूनानी पदबंध व्याकरणतः पुल्लिंग बहुवचन है और सम्भवतः उस समय के प्रभावशाली पुरुष नागरिकों को सूचित करता है। मुख्य पाठ में इस ऐतिहासिक संकेत को बनाए रखा गया है, जबकि पादटिप्पणी अर्थगत विकल्प स्पष्ट करती है।
- issue: ἀπολέσαι की अर्थ-व्याप्ति
  choice: उसका नाश करने
  alternative: उसे मार डालने
  rationale: सन्दर्भ में प्राण लेने का आशय सम्भावित और प्रबल है, फिर भी मूल क्रिया ‘नष्ट करना’ की कुछ व्यापकता रखती है। इसलिए पाठ ने उसे सीधे केवल ‘मार डालना’ तक सीमित नहीं किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शिक्षा दिया करता था’ और ‘ढूँढ़ रहे थे’ अपूर्ण भूतकाल की जारी या आवर्ती क्रिया को व्यक्त करते हैं। पद के अन्त का अल्पविराम अगले पद में वाक्य जारी रहने को दर्शाता है।
