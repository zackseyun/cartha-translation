id: LUK.19.21
reference: Luke 19:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: hi
  text: मैं आपसे डरता था[a], क्योंकि आप एक कठोर मनुष्य हैं। जो आपने रखा नहीं, उसे लेते हैं[b], और जो आपने बोया नहीं, उसकी फसल काटते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं आपसे भयभीत था।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जो आपने रखा नहीं, उसे लेते हैं।’ इसका अनुवाद ‘जो आपने रखा नहीं, उसे उठा लेते हैं’ भी किया जा सकता है। प्रसंग में कुछ अनुवाद इसे अधिक व्याख्यात्मक रूप से ‘जो आपने जमा नहीं किया, उसे वसूल करते हैं’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: मैं आपसे डरता था
  rationale: अपूर्ण भूतकाल सेवक के बीते समय में बने हुए भय को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और हिन्दी में स्पष्ट संबंध स्थापित करता है।
- source_word: αὐστηρὸς
  choice: कठोर
  rationale: यह शब्द सख्त, कड़े या कठोर स्वभाव का बोध देता है। ‘कठोर’ सेवक के आरोप की नकारात्मक शक्ति को बिना बढ़ाए बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: दृष्टान्त में एक विशिष्ट पुरुष के लिए प्रयुक्त है; ‘मनुष्य’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: αἴρεις
  choice: उठा लेते हैं
  rationale: αἴρω का मूल अर्थ उठाना या ले लेना है। यहाँ यह अगले वाक्यांश ‘जो आपने रखा नहीं’ के साथ मूल ठोस चित्र को बनाए रखता है।
- source_word: ὃ οὐκ ἔθηκας
  choice: जो आपने रखा नहीं
  rationale: τίθημι का सामान्य अर्थ रखना या स्थापित करना है। ‘रखा’ मूल कथन को बनाए रखता है और ‘जमा किया’ जैसी अधिक विशिष्ट आर्थिक व्याख्या नहीं जोड़ता।
- source_word: θερίζεις
  choice: काटते हैं
  rationale: खेती के प्रसंग में θερίζω फसल काटने को दर्शाता है। हिन्दी में ‘बोना—काटना’ स्वाभाविक कृषि-संबंधी समानांतर है।
- source_word: ὃ οὐκ ἔσπειρας
  choice: जो आपने बोया नहीं
  rationale: σπείρω का सीधा अर्थ ‘बोना’ है; इससे कृषि-रूपक अक्षुण्ण रहता है।
theological_decisions:
- issue: क्या स्वामी के विषय में सेवक के वर्णन को नरम किया जाए
  choice: सेवक की आरोपात्मक भाषा को बिना नरम किए रखा गया
  alternative: ‘अनुशासनप्रिय’ या केवल ‘सख्त’ जैसे अपेक्षाकृत हल्के शब्द प्रयोग करना
  rationale: यह सेवक का अपना कथन है। अनुवाद को यह तय किए बिना उसकी आरोपात्मक शक्ति बनाए रखनी चाहिए कि स्वामी के विषय में उसका आकलन वस्तुतः सही है या नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सेवक स्वामी को आदरसूचक बहुवचन ‘आप’ से संबोधित करता है। भाषा सरल किंतु गरिमापूर्ण है और मूल के समानांतर वाक्य-विन्यास तथा आरोपात्मक स्वर को सुरक्षित रखती है।
