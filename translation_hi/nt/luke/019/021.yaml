review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the servant's past fear, the accusatory description of the master, and the two parallel accusations. However, the double causal construction “क्योंकि ... इसलिए कि” is unnatural and obscures the simple explanatory flow of γάρ followed by ὅτι. “उठा लेते हैं” is possible for αἴρεις but is less suitable here than the broader and more idiomatic “लेते हैं.”
  naturalness: The address “आप” is appropriate. The opening should be recast to avoid redundant causal connectors. “भय खाता था” in footnote a is not idiomatic modern standard Hindi.
  terminology: “कठोर मनुष्य” adequately conveys αὐστηρός and retains the servant's negative characterization without adjudicating its truth. “बोया” and “काटते हैं” preserve the agricultural imagery; adding “फसल” makes the Hindi idiomatic without changing the image.
  issues:
  - severity: medium
    issue: Redundant causal wording
    rationale: “क्योंकि मैं आपसे डरता था, इसलिए कि...” uses two Hindi causal constructions where the Greek has a nested explanatory sequence. “मैं आपसे डरता था, क्योंकि...” is natural and retains the reason given by the servant.
  - severity: medium
    issue: Footnote a contains an unnatural alternative
    rationale: “आपसे भय खाता था” is not standard idiomatic Hindi for being afraid. “मैं आपसे भयभीत था” is a valid formal alternative.
  - severity: low
    issue: Rendering of αἴρεις
    rationale: “उठा लेते हैं” can suggest physically picking something up. “लेते हैं” better preserves the general sense ‘take’ in this parallel saying while avoiding an overly narrow nuance.
  revised_text: मैं आपसे डरता था[a], क्योंकि आप एक कठोर मनुष्य हैं। जो आपने रखा नहीं, उसे लेते हैं[b], और जो आपने बोया नहीं, उसकी फसल काटते हैं।
