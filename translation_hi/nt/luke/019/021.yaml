revisions:
- from: क्योंकि मैं आपसे डरता था[a], इसलिए कि आप एक कठोर मनुष्य हैं। जो आपने रखा नहीं, उसे उठा लेते हैं[b], और जो आपने बोया नहीं, उसे काटते हैं।
  to: मैं आपसे डरता था[a], क्योंकि आप एक कठोर मनुष्य हैं। जो आपने रखा नहीं, उसे लेते हैं[b], और जो आपने बोया नहीं, उसकी फसल काटते हैं।
  rationale: The revision removes the redundant causal construction, preserves the servant's accusatory speech as speech rather than narration, and uses idiomatic modern Hindi. “लेते हैं” retains the breadth of αἴρεις, while “जिसकी फसल काटते हैं” naturally expresses the sow/reap parallel in Hindi. The revised footnote replaces an unidiomatic phrase and keeps both literal and interpretive alternatives clearly distinguished.
