  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: hi
  text: उन्होंने कहा[a], “प्रभु को इसकी ज़रूरत है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मालिक को इसकी ज़रूरत है,” यदि κύριος का अर्थ यीशु की उपाधि ‘प्रभु’ के बजाय स्वामी या मालिक लिया जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: उन्होंने
  rationale: οἱ पहले बताए गए शिष्यों की ओर संकेत करता है। δέ हल्का कथात्मक संयोजक है; हिन्दी में प्रसंग का प्रवाह बिना अलग संयोजक के स्वाभाविक और स्पष्ट रहता है।
- source_word: εἶπαν
  choice: कहा
  rationale: λέγω के अओरिस्ट का सीधा अर्थ ‘कहा’ है। ‘उत्तर दिया’ प्रसंगानुकूल तो है, पर मूल क्रिया से अधिक विशिष्ट होगा।
- source_word: ὅτι
  choice: उद्धरण-चिह्नों द्वारा व्यक्त
  rationale: यहाँ ὅτι प्रत्यक्ष कथन का परिचय देता है; हिन्दी में इसका कार्य उद्धरण-चिह्न स्वाभाविक रूप से करते हैं।
- source_word: Ὁ κύριος
  choice: प्रभु
  rationale: κύριος का सामान्य शीर्षकीय अनुवाद ‘प्रभु’ है और लूका के प्रसंग में यह यीशु की ओर संकेत कर सकता है। फिर भी ‘मालिक’ का अर्थ सम्भव है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: αὐτοῦ
  choice: इसकी
  rationale: सर्वनाम का सबसे स्वाभाविक पूर्वपद पहले उल्लिखित गदहे का बच्चा है। हिन्दी में ‘इसकी’ उस संदर्भ को स्पष्ट किए बिना सहज रूप से बनाए रखता है।
- source_word: χρείαν ἔχει
  choice: को इसकी ज़रूरत है
  rationale: यूनानी मुहावरे का अर्थ ‘आवश्यकता होना’ है। आधुनिक सामान्य हिन्दी में ‘ज़रूरत है’ स्वाभाविक, स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: शिष्यों के उत्तर में κύριος का अभिप्राय
  choice: मुख्य पाठ में ‘प्रभु’, जो प्रसंग में यीशु की ओर संकेत करता है
  alternative: ‘मालिक’, अर्थात गदहे के बच्चे का स्वामी
  rationale: यीशु ने पहले से शिष्यों को यही उत्तर देने को कहा था और लूका κύριος को यीशु के लिए प्रायः प्रयोग करता है। फिर भी शब्द का सामान्य अर्थ ‘मालिक’ भी हो सकता है; इसलिए वास्तविक शब्दार्थगत अस्पष्टता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कथात्मक और सामान्य पाठक के लिए सहज। ‘ज़रूरत’ प्रचलित हिन्दुस्तानी शब्द है और यहाँ ‘आवश्यकता’ की अपेक्षा संवाद में अधिक स्वाभाविक है।
