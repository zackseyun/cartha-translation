translation:
  language: hi
  text: ये बातें कहने के बाद, वह यरूशलेम की ओर चढ़ते हुए आगे-आगे बढ़ता गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[अलग शब्द के रूप में व्यक्त नहीं]'
  rationale: यहाँ Καὶ कथा को अगले घटनाक्रम से जोड़ता है। हिन्दी में पूर्ववर्ती प्रसंग से स्वाभाविक निरंतरता बनी रहती है; आरम्भ में ‘और’ जोड़ना अनावश्यक और कुछ कृत्रिम लगता।
- source_word: εἰπὼν ταῦτα
  choice: ये बातें कहने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है। ‘ये बातें’ बहुवचन संकेतवाचक का विस्तार बनाए रखता है और इसे केवल ‘शब्दों’ तक सीमित नहीं करता।
- source_word: ἐπορεύετο
  choice: चलने लगा
  rationale: अपूर्ण भूतकाल कथा में जारी गति को दर्शाता है। संयुक्त वाक्यांश ‘आगे-आगे चलते हुए ... चढ़ने लगा’ हिन्दी में यात्रा के आगे बढ़ने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔμπροσθεν
  choice: आगे-आगे
  rationale: यह क्रियाविशेषण आगे या सामने होने का भाव देता है। ‘आगे-आगे’ स्वाभाविक हिन्दी में समूह के आगे चलने का आशय व्यक्त करता है, बिना मूल में अनुपस्थित सर्वनाम जोड़ने के।
- source_word: ἀναβαίνων
  choice: चढ़ने
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही गति बताता है। ‘चढ़ने’ से यरूशलेम की ओर आरोहण का भौगोलिक और कथात्मक बिंब सुरक्षित रहता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम को
  rationale: εἰς यहाँ गंतव्य की ओर गति बताता है, नगर में प्रवेश आवश्यक रूप से नहीं। ‘यरूशलेम को चढ़ना’ हिन्दी के प्रतिष्ठित बाइबलीय यात्रा-प्रयोग को बनाए रखता है।
theological_decisions:
- issue: यरूशलेम की ओर आरोहण की भाषा बनाए रखना
  choice: ‘यरूशलेम को चढ़ने लगा’
  alternative: ‘यरूशलेम की ओर यात्रा करने लगा’
  rationale: ἀναβαίνων को ‘चढ़ने’ से अनूदित करने पर भौगोलिक आरोहण और लूका की कथा में यरूशलेम की ओर बढ़ने की अर्थपूर्ण भाषा दोनों सुरक्षित रहते हैं; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी। ‘आगे-आगे’ सामान्य पाठक के लिए सहज है, जबकि ‘यरूशलेम को चढ़ना’ मूल की आरोहण-भाषा को सुरक्षित रखने वाला संक्षिप्त बाइबलीय प्रयोग है।
