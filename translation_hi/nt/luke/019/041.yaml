  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: hi
  text: जब वह निकट आया, तो नगर को देखकर उस पर रोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: जब वह निकट आया
  rationale: ἐγγίζω निकट आने या पास पहुँचने को व्यक्त करता है। यहाँ ‘जब’ यूनानी ὡς के समयसूचक अर्थ को स्वाभाविक हिन्दी में प्रकट करता है; किसके निकट आया, यह प्रसंग से स्पष्ट है।
- source_word: ἰδὼν τὴν πόλιν
  choice: और नगर को देखा
  rationale: ἰδών क्रिया से पहले या उसके साथ घटित देखने की क्रिया बताता है। हिन्दी में समन्वित वाक्य-विन्यास मूल घटनाक्रम को स्पष्ट और स्वाभाविक रखता है। πόλις का सीधा अर्थ ‘नगर’ है; प्रसंग से यरूशलेम स्पष्ट होने के कारण नाम नहीं जोड़ा गया।
- source_word: ἔκλαυσεν
  choice: रो पड़ा
  rationale: κλαίω रोने या आँसू बहाने को व्यक्त करता है। ‘रो पड़ा’ भावनात्मक प्रतिक्रिया के आरम्भ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘फूट-फूटकर’ जैसी अनुल्लिखित तीव्रता जोड़े।
- source_word: ἐπ’ αὐτήν
  choice: उसके लिए
  rationale: κλαίω के साथ ἐπί और कर्मकारक उस व्यक्ति या वस्तु को सूचित करते हैं जिसके कारण या विषय में कोई रोता है। ‘उसके लिए’ आधुनिक हिन्दी में नगर के प्रति शोक को स्वाभाविक रूप से व्यक्त करता है; ‘उस पर रोया’ अधिक शब्दशः, पर कम स्वाभाविक है।
theological_decisions:
- issue: क्या नगर के लिए प्रयुक्त स्त्रीलिंग यूनानी सर्वनाम को व्यक्तिकरण के रूप में दिखाया जाए
  choice: हिन्दी व्याकरण के अनुसार पुल्लिंग ‘नगर’ और ‘उसके’ का प्रयोग
  alternative: यरूशलेम को स्त्रीरूप में व्यक्त करके ‘उसके लिए’ कहना
  rationale: यूनानी αὐτήν का स्त्रीलिंग πόλις के व्याकरणिक लिंग से मेल खाता है और अपने आप में व्यक्तिकरण सिद्ध नहीं करता। हिन्दी में ‘नगर’ पुल्लिंग है; इसलिए स्वाभाविक व्याकरण अपनाया गया है, जबकि यीशु का नगर के प्रति गहरा शोक स्पष्ट बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य यूनानी घटनाक्रम—निकट आना, नगर को देखना, फिर उसके लिए रोना—को स्पष्ट रूप में बनाए रखता है।
