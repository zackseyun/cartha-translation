reference: Luke 19:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: hi
  text: परन्तु मेरे इन शत्रुओं को, जो नहीं चाहते थे कि मैं उन पर राज्य करूँ, यहाँ लाओ और मेरे सामने उनका वध कर दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यहाँ यह शब्द भाषण के अंतिम और चरम आदेश की ओर प्रबल विरोधात्मक संक्रमण दिखाता है; ‘परन्तु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: मेरे इन शत्रुओं को
  rationale: ‘इन’ यूनानी संकेतवाचक τούτους की विशिष्टता और बल को बनाए रखता है, जबकि ‘शत्रु’ ἐχθρούς का मानक आधुनिक हिन्दी रूप है।
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: जो नहीं चाहते थे कि मैं उन पर राजा होकर शासन करूँ
  rationale: सम्बन्धवाचक उपवाक्य यूनानी कृदन्तीय पदबंध को सहज हिन्दी में व्यक्त करता है। ‘राजा होकर शासन करूँ’ βασιλεῦσαι के राजत्व और शासन—दोनों भावों को स्पष्ट रखता है।
- source_word: ἀγάγετε ὧδε
  choice: यहाँ लाओ
  rationale: आदेश के इस प्रसंग में ‘लाओ’ ἄγω का सहज हिन्दी अनुवाद है और ‘यहाँ’ ὧδε के गन्तव्य को ठीक व्यक्त करता है।
- source_word: κατασφάξατε
  choice: वध कर दो
  rationale: यह सामान्य ‘मार डालो’ से अधिक गंभीर और हिंसक क्रिया को व्यक्त करता है, पर आधुनिक हिन्दी में अत्यधिक अस्वाभाविक नहीं लगता; इसमें ऐसा न्यायिक अर्थ भी नहीं जो मूल क्रिया में अनिवार्यतः नहीं है।
- source_word: ἔμπροσθέν μου
  choice: मेरे सामने
  rationale: यह स्थान और उपस्थिति दोनों का सीधा, सजीव और स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: दृष्टान्त के भीतर वक्ता का सन्दर्भ
  choice: कुलीन व्यक्ति का आदेश सीधे अनूदित किया गया है; उसकी हिंसा को नरम नहीं किया गया और न ही उसे दृष्टान्त के बाहर यीशु की प्रत्यक्ष आज्ञा के रूप में स्पष्टतः पहचाना गया है।
  alternative: वाक्य में व्याख्यात्मक शब्द जोड़कर इसे केवल दृष्टान्तात्मक चित्रण के रूप में अधिक स्पष्ट दूरी के साथ प्रस्तुत करना।
  rationale: यूनानी पाठ इसे दृष्टान्त के पात्र का सीधा कथन बनाता है। अनुवाद को वही कथात्मक बल और धर्मवैचारिक तनाव बनाए रखना चाहिए, न कि अतिरिक्त व्याख्या द्वारा उसे सुलझाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य भाषा रखी गई है। हिंसक क्रिया की तीव्रता सुरक्षित है; पुरातन ‘संहार करो’ या अत्यधिक बोलचाल के शब्दों से बचा गया है।
