review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the emphatic transition, the demonstrative force of ‘these,’ the hostile refusal to accept the speaker’s kingship, the command to bring them here, and the stark command to kill them in the speaker’s presence. The wording does not improperly identify the parabolic speaker with Jesus outside the parable.
  naturalness: ‘राजा होकर शासन करूँ’ is understandable but unnecessarily duplicates the royal/ruling sense and is less idiomatic than ‘मैं उन पर राज्य करूँ.’ The remaining sentence is clear, direct, and appropriately elevated for biblical narrative.
  terminology: '‘शत्रु,’ ‘राज्य करूँ,’ ‘वध कर दो,’ and ‘मेरे सामने’ are suitable. ‘वध कर दो’ retains a grave, forceful sense for κατασφάξατε without importing a specifically judicial interpretation. No footnotes are needed in Hindi: the English notes record optional English renderings rather than a textual variant or an ambiguity requiring an anchor in this translation.'
  issues:
