    issue: Redundant expression for βασιλεῦσαι
    rationale: ‘राजा होकर शासन करूँ’ repeats overlapping meanings (‘as king’ and ‘rule’). ‘मैं उन पर राज्य करूँ’ is more natural modern Hindi and directly represents the Greek verb’s sense of reigning.
  revised_text: परन्तु मेरे इन शत्रुओं को, जो नहीं चाहते थे कि मैं उन पर राज्य करूँ, यहाँ लाओ और मेरे सामने उनका वध कर दो।
