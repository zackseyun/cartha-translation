  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: hi
  text: वे कह रहे थे, “धन्य है वह राजा, जो प्रभु के नाम से आता है![a] स्वर्ग में शांति और सर्वोच्च स्थानों में महिमा!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ अनुवाद अधिक परिचित शब्दों का अनुसरण करते हैं: “धन्य है वह, जो प्रभु के नाम से आता है”; पर लूका के यूनानी पाठ में “राजा” स्पष्ट रूप से है।'
    reason: alternative_reading
  - marker: b
    text: 'यह लूका 2:14 की प्रतिध्वनि है, पर शांति का स्थान उलट जाता है: वहाँ “पृथ्वी पर शांति,” यहाँ “स्वर्ग में शांति।”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान कृदन्त पिछले पद की क्रिया से जुड़ा है; हिन्दी में यह रूप उस जारी सामूहिक उद्घोष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Εὐλογημένος
  choice: धन्य है
  rationale: यह आशीर्वादात्मक जयघोष के लिए प्रचलित, गरिमापूर्ण रूप है और भजन-संबंधी प्रतिध्वनि बनाए रखता है।
- source_word: ὁ ἐρχόμενος
  choice: जो ... आता है
  rationale: संज्ञार्थक कृदन्त को राजा के संबंध में स्वाभाविक हिन्दी उपवाक्य के रूप में रखा गया है और वर्तमान भाव बना रहता है।
- source_word: βασιλεὺς
  choice: वह राजा
  rationale: लूका के यूनानी पाठ में ‘राजा’ स्पष्ट रूप से उपस्थित है; ‘वह’ निश्चित और पहचाने हुए राजकीय व्यक्तित्व का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: यह स्वाभाविक हिन्दी बाइबलीय मुहावरा है, जो प्रभु के प्रतिनिधित्व और अधिकार के अंतर्गत आने का भाव खुला रखता है।
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: स्वर्ग में शांति
  rationale: क्रियारहित उद्घोष की संक्षिप्त काव्यात्मक बनावट और लूका 2:14 से स्थानगत अंतर दोनों सुरक्षित रहते हैं।
- source_word: δόξα ἐν ὑψίστοις
  choice: सर्वोच्च लोकों में महिमा
  rationale: बहुवचन ὑψίστοις के उच्चतम स्वर्गीय क्षेत्रों के भाव को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल एक स्थान-नाम तक सीमित किए।
theological_decisions:
- issue: विजयी प्रवेश में मसीही राजकीय जयघोष
  choice: βασιλεὺς को स्पष्ट रूप से ‘वह राजा’ रखा गया है।
  alternative: ‘धन्य है वह, जो प्रभु के नाम से आता है।’
  rationale: यूनानी पाठ में ‘राजा’ मौजूद है। इसे हटाना लूका के स्पष्ट राजकीय बल को कम कर देगा और पाठ को अधिक परिचित छोटे सूत्र के अनुरूप बना देगा।
- issue: लूका 2:14 से संबंध
  choice: ‘स्वर्ग में शांति’ का अनुवाद ज्यों का त्यों रखा गया है।
  alternative: ‘पृथ्वी पर शांति’
  rationale: स्रोत पाठ स्पष्टतः ‘स्वर्ग में’ कहता है। इसे जन्म-वृत्तांत के उद्घोष से मिलाना लूका की विशिष्ट शब्दावली और उसके अंतर्पाठीय तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक जयघोष के लिए सरल किंतु गरिमापूर्ण शैली। ‘धन्य,’ ‘प्रभु,’ ‘शांति’ और ‘महिमा’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। पदचिह्नों को संबंधित वाक्यांशों के बाद रखा गया है।
