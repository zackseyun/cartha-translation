  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ οἱ ἀπεσταλμένοι εὗρον καθὼς εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: hi
  text: तब जिन्हें भेजा गया था, उन्होंने जाकर वैसा ही पाया जैसा उसने उनसे कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθόντες
  choice: जाकर
  rationale: ἀπέρχομαι का अओरिस्ट कृदंत पहले घटित जाने की क्रिया बताता है। हिंदी में ‘उन्होंने जाकर ... पाया’ स्वाभाविक रूप से इस क्रम को व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ पूर्व निर्देश के बाद अगली घटना का स्वाभाविक संकेत देता है।
- source_word: οἱ ἀπεσταλμένοι
  choice: जिन्हें भेजा गया था
  rationale: आर्टिक्युलर परफेक्ट पैसिव कृदंत को संज्ञात्मक और कर्मवाच्य रूप में रखा गया है, बिना ‘दूत’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: εὗρον
  choice: पाया
  rationale: ग्रीक में εὗρον का कर्म व्यक्त नहीं है और संदर्भ से समझा जाता है। हिंदी में भी ‘पाया’ बिना व्यक्त कर्म के स्वाभाविक है और मूल की अंतर्निहितता सुरक्षित रखता है।
- source_word: καθὼς
  choice: वैसा ही ... जैसा
  rationale: καθώς कथन और प्राप्त परिस्थिति के अनुरूप होने को व्यक्त करता है; हिंदी की सहसंबंधी रचना ‘वैसा ही ... जैसा’ इसे स्पष्ट और स्वाभाविक ढंग से देती है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा था
  rationale: λέγω का सीधा अर्थ ‘कहना’ सुरक्षित रखा गया है। ‘कहा था’ खोजने से पहले हुए कथन को हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: कर्ता ‘उसने’ की पहचान
  choice: मूल पाठ की तरह सर्वनाम ‘उसने’ रखा गया
  alternative: ‘यीशु ने’
  rationale: संदर्भ में कर्ता यीशु हैं, पर इस पद के ग्रीक पाठ में केवल क्रिया का निहित तृतीय पुरुष कर्ता है; नाम जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। वाक्य-विन्यास ग्रीक की क्रियाओं का क्रम बनाए रखता है, जबकि हिंदी में स्वाभाविक पढ़ता है। मूल में εὗρον का कर्म अव्यक्त होने के कारण अनुवाद में ‘उसे’ या ‘बछेड़े को’ नहीं जोड़ा गया; इसलिए अंग्रेज़ी परामर्श-पाठ की वैकल्पिक टिप्पणी की हिंदी में आवश्यकता नहीं रही।
