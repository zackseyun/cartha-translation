  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: hi
  text: और उन्हें सूझ नहीं रहा था कि वे क्या करें, क्योंकि सारे लोग उसकी बातें सुनने में पूरी तरह मग्न थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि सारे लोग उसे सुनते हुए उससे लटके हुए थे।” यूनानी मुहावरा यीशु की बातों पर लोगों के अत्यंत उत्सुक और एकाग्र ध्यान को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: उन्हें समझ नहीं आ रहा था
  rationale: नकार के साथ अपूर्णकालीन क्रिया उनकी लगातार बनी हुई असमर्थता को व्यक्त करती है; यह हिंदी में स्वाभाविक रूप से बताता है कि उन्हें कोई कारगर उपाय नहीं सूझ रहा था।
- source_word: τὸ τί ποιήσωσιν
  choice: कि वे क्या करें
  rationale: यह विचार-विमर्श से जुड़ी अनिश्चितता को सहज हिंदी में बनाए रखता है और किसी नैतिक बाध्यता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: क्योंकि सारे लोग
  rationale: γάρ का कारणसूचक संबंध ‘क्योंकि’ से स्पष्ट होता है; ἅπας की समग्रता ‘सारे’ से व्यक्त होती है।
- source_word: ἐξεκρέματο αὐτοῦ
  choice: उसकी बातें सुनने में पूरी तरह मग्न थे
  rationale: यूनानी मुहावरा यीशु की ओर अत्यंत उत्सुक और एकाग्र ध्यान को दर्शाता है। हिंदी में शाब्दिक ‘उस पर लटके हुए थे’ भ्रामक होगा; चुना हुआ वाक्यांश सुनने के संदर्भ में उसका भाव स्वाभाविक ढंग से देता है।
- source_word: ἀκούων
  choice: सुनने में
  rationale: वर्तमान कृदंत उसी समय चल रही सुनने की क्रिया को बताता है और यह स्पष्ट करता है कि लोगों की तल्लीनता किस रूप में प्रकट हो रही थी।
