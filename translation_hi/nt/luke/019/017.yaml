base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: hi
  text: और उसने उससे कहा, “शाबाश, अच्छे सेवक[a]! क्योंकि तुम बहुत छोटी-सी बात में विश्वासयोग्य निकले, इसलिए दस नगरों पर अधिकार रखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास।” यूनानी शब्द δοῦλος का अर्थ प्रसंग के अनुसार “सेवक” या “दास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: शाबाश
  rationale: यह स्वीकृति और प्रशंसा का स्वाभाविक आधुनिक हिन्दी उद्गार है और यूनानी विस्मयादिबोधक का भाव स्पष्ट रखता है।
- source_word: ἀγαθὲ
  choice: अच्छे
  rationale: सम्बोधन में δοῦλε का सीधा विशेषण है; ‘अच्छे’ सरल और सटीक समतुल्य है।
- source_word: δοῦλε
  choice: सेवक
  rationale: दृष्टान्त के स्वामी-अधीनस्थ प्रसंग में ‘सेवक’ स्वाभाविक हिन्दी है; यूनानी शब्द दास को भी सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν ἐλαχίστῳ
  choice: बहुत छोटी-सी बात में
  rationale: यह किसी अत्यल्प दायित्व या विषय में निष्ठा को व्यक्त करता है और हिन्दी में सहज है।
- source_word: πιστὸς ἐγένου
  choice: विश्वासयोग्य निकला
  rationale: यह मूल्यांकन के प्रसंग में उसके विश्वासयोग्य सिद्ध होने का भाव व्यक्त करता है, बिना यह अर्थ जोड़े कि वह पहले विश्वासयोग्य नहीं था।
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: अधिकार रख
  rationale: यह अधिकार रखने की अवस्था के लिए प्रयुक्त आज्ञार्थक परिप्रास का संक्षिप्त और निकट हिन्दी रूप है।
- source_word: ἐπάνω δέκα πόλεων
  choice: दस नगरों पर
  rationale: शासन के प्रसंग में ἐπάνω का अर्थ ‘पर’ और πόλεων का अर्थ ‘नगरों’ स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: यहाँ मुख्य बल स्वामी के प्रति अधीन सेवा और विश्वासयोग्यता पर है। ‘सेवक’ पठनीय रहते हुए सम्बन्ध को बनाए रखता है; बंधुआ स्थिति का अधिक स्पष्ट विकल्प ‘दास’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दृष्टान्त के भीतर प्रत्यक्ष सम्बोधन होने के कारण एकवचन ‘तू’ चुना गया है; यह निकट मूल-रूप और स्वामी-अधीनस्थ सम्बन्ध दोनों को दर्शाता है।
