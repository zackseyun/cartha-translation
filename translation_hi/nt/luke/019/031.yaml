id: LUK.19.31
reference: Luke 19:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: hi
  text: और यदि कोई तुमसे पूछे, “तुम इसे क्यों खोल रहे हो?” तो इस प्रकार कहना, “प्रभु[a] को इसकी आवश्यकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मालिक को इसकी आवश्यकता है।”
    reason: यूनानी κύριος का अर्थ सन्दर्भानुसार ‘प्रभु’ या ‘मालिक’ हो सकता है।
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: पूछे
  rationale: प्रश्न पूछने की सामान्य क्रिया; शर्तवाचक वाक्य में ‘पूछे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाले इस यूनानी पदबंध का सहज और सटीक हिन्दी रूप।
- source_word: λύετε
  choice: तुम इसे क्यों खोल रहे हो
  rationale: सन्दर्भ में बँधे हुए बछेड़े की रस्सी या बन्धन खोलना अभिप्रेत है। यूनानी में कर्म निहित है; हिन्दी में स्पष्टता के लिए ‘इसे’ जोड़ा गया है।
- source_word: οὕτως ἐρεῖτε
  choice: तो इस प्रकार कहना
  rationale: भविष्यत् सूचक क्रिया यहाँ निर्देश का बल रखती है; ‘कहना’ उस निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है और ‘इस प्रकार’ उत्तर के निश्चित आशय को बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: लूका के कथानक में यह यीशु के लिए प्रयुक्त उपाधि हो सकती है और इसका धर्मवैचारिक अनुनाद भी है; ‘प्रभु’ उस अर्थ को सुरक्षित रखता है।
- source_word: αὐτοῦ
  choice: इसकी
  rationale: नपुंसकलिंगी हिन्दी सर्वनाम तत्काल सन्दर्भ के बछेड़े की ओर संकेत करता है; यूनानी सर्वनाम का सम्बन्ध उसी पशु से समझना प्रसंगानुकूल है।
- source_word: χρείαν ἔχει
  choice: को इसकी आवश्यकता है
  rationale: यूनानी मुहावरे ‘आवश्यकता होना’ को स्पष्ट, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Ὁ κύριος का आशय और सम्बोधन
  choice: ‘प्रभु’, सम्भवतः यीशु के लिए उपाधि
  alternative: ‘मालिक’, अर्थात् कोई स्वामी या अधिकारी
  rationale: लूका में κύριος प्रायः यीशु के लिए आता है और यहाँ वही सम्भावना प्रबल है। फिर भी तत्काल व्यावहारिक सन्दर्भ में ‘मालिक’ अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष वचन में स्वाभाविक बोलचाल रखी गई है, जबकि ‘प्रभु’ और ‘आवश्यकता’ मूल के औपचारिक तथा धर्मवैचारिक स्वर को बनाए रखते हैं।
