base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: hi
  text: और उनसे कहा, “लिखा है, ‘और मेरा घर[a] प्रार्थना का घर होगा,’ पर तुमने उसे लुटेरों का अड्डा[b] बना दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरा घर” से यहाँ मंदिर का आशय है; यूनानी में शब्दशः “मेरा घर” है, जो यशायाह 56:7 को प्रतिध्वनित करता है।
    reason: lexical_alternative
  - marker: b
    text: “लुटेरों का अड्डा” यिर्मयाह 7:11 को प्रतिध्वनित करता है। “लुटेरों” का अनुवाद “डाकुओं” भी किया जा सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: और उनसे कहा
  rationale: वर्तमान कृदंत को पिछले कथानक से जोड़ते हुए स्वाभाविक हिन्दी में सीमित क्रिया के रूप में व्यक्त किया गया है; ‘उनसे’ αὐτοῖς को स्पष्ट रखता है।
- source_word: Γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र उद्धृत करने का प्रचलित और अधिकारसूचक हिन्दी सूत्र है तथा यूनानी पूर्ण निष्क्रिय रूप के वर्तमान परिणाम को बनाए रखता है।
- source_word: Καὶ ἔσται
  choice: और ... होगा
  rationale: उद्धरण के आरम्भिक καί को ‘और’ से तथा भविष्यकाल को ‘होगा’ से सुरक्षित रखा गया है।
- source_word: ὁ οἶκός μου
  choice: मेरा घर
  rationale: οἶκος का सीधा अर्थ ‘घर’ है; मंदिर संदर्भित होने पर भी यह यशायाह 56:7 की शब्दावली और परमेश्वर के घर की छवि को बनाए रखता है।
- source_word: οἶκος προσευχῆς
  choice: प्रार्थना का घर
  rationale: सम्बन्धकारक रचना का स्वाभाविक हिन्दी रूप, जो परिचित शास्त्रीय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ὑμεῖς δὲ
  choice: पर तुमने
  rationale: ‘पर’ तीखे विरोध को और ‘तुम’ व्यक्त सर्वनाम के बलाघात को व्यक्त करता है।
- source_word: ἐποιήσατε
  choice: बना दिया है
  rationale: यह पूर्ण किए गए कार्य से उत्पन्न वर्तमान दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σπήλαιον
  choice: अड्डा
  rationale: यिर्मयाह 7:11 के प्रसंग में यह केवल भौतिक ‘गुफा’ नहीं, बल्कि लुटेरों के छिपने और जमा होने की जगह है; ‘अड्डा’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: λῃστῶν
  choice: लुटेरों
  rationale: λῃστής डाकू, लुटेरा या सशस्त्र गिरोह के सदस्य को सूचित कर सकता है; ‘लुटेरे’ अर्थ को पर्याप्त व्यापक रखते हुए अनावश्यक राजनीतिक विशिष्टता से बचाता है।
theological_decisions:
- issue: मंदिर के संदर्भ में οἶκος का अनुवाद
  choice: मेरा घर ... प्रार्थना का घर
  alternative: मेरा मंदिर ... प्रार्थना का घर
  rationale: यूनानी पाठ ‘घर’ कहकर यशायाह 56:7 को प्रतिध्वनित करता है। ‘मंदिर’ संदर्भ को स्पष्ट करता, पर मूल रूपक और अंतर्पाठीय शब्दावली को समतल कर देता।
- issue: λῃστῶν की अर्थ-सीमा
  choice: लुटेरों
  alternative: डाकुओं
  rationale: शब्द में साधारण लुटेरों से लेकर सशस्त्र डाकुओं तक की अर्थ-सीमा हो सकती है। ‘लुटेरों’ को मुख्य पाठ में रखकर अधिक विशिष्ट विकल्प टिप्पणी में दिया गया है, ताकि राजनीतिक या विद्रोही अर्थ आरोपित न हो।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पवित्रशास्त्रीय उद्धरण की औपचारिकता ‘लिखा है’ और ‘प्रार्थना का घर’ से बनी रहती है, जबकि ‘लुटेरों का अड्डा’ आज के सामान्य पाठक के लिए स्वाभाविक और सशक्त है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
