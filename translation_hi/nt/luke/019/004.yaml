base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: hi
  text: और वह दौड़कर आगे गया और एक सिकमोर-अंजीर के पेड़[a] पर चढ़ गया, ताकि वह यीशु को देख सके, क्योंकि यीशु उस रास्ते से होकर गुजरनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिकमोर का पेड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: आगे दौड़ा
  rationale: यह संयुक्त अभिव्यक्ति दौड़कर दूसरों से आगे निकलने और सामने के स्थान पर पहुँचने का भाव देती है; ‘आगे दौड़ा’ इसे स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ἀνέβη ἐπὶ
  choice: पर चढ़ गया
  rationale: पेड़ के संदर्भ में यह क्रिया ऊपर चढ़ने को बताती है; ‘पर चढ़ गया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: συκομορέαν
  choice: गूलर के पेड़
  rationale: यह συκομορέα अर्थात सिकमोर-अंजीर (Ficus sycomorus) को सूचित करता है। सामान्य हिंदी पाठक के लिए ‘गूलर’ परिचित शब्द है, जबकि अधिक सटीक वानस्पतिक पहचान पादटिप्पणी में दी गई है।
- source_word: ἵνα ἴδῃ αὐτόν
  choice: ताकि वह यीशु को देख सके
  rationale: ἵνα के प्रयोजनार्थक भाव को ‘ताकि’ स्पष्ट करता है। संदर्भ की स्पष्टता और हिंदी में सर्वनाम-संदेह से बचने के लिए αὐτόν को ‘यीशु’ कहा गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पेड़ पर चढ़ने का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट आधुनिक हिंदी समतुल्य है।
- source_word: ἐκείνης
  choice: उसी रास्ते से
  rationale: स्त्रीलिंग संबंधकारक रूप में ‘रास्ता/मार्ग’ जैसा शब्द लुप्त समझा जाता है। ‘उसी रास्ते से’ किसी अनावश्यक रूप से विशिष्ट सड़क का संकेत दिए बिना भाव स्पष्ट करता है।
- source_word: ἤμελλεν διέρχεσθαι
  choice: से होकर जानेवाला था
  rationale: μέλλω और धातु के अनंत रूप का मेल निकट भविष्य अथवा होनेवाली क्रिया बताता है; ‘जानेवाला था’ इसे स्वाभाविक हिंदी में रखता है, और ‘से होकर’ διέρχομαι का मार्ग से गुजरने का भाव व्यक्त करता है।
