source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: hi
  text: और वह दूसरा आया और बोला, ‘प्रभु, देखिए, यह रही आपकी मीना[a], जिसे मैंने एक कपड़े[b] में अलग रख रखा था।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मीना प्राचीन मुद्रा और भार की एक इकाई थी।
    reason: सांस्कृतिक और ऐतिहासिक स्पष्टीकरण
  - marker: b
    text: या “रूमाल।” यूनानी शब्द एक कपड़े को दर्शाता है, जो प्रायः चेहरा पोंछने या पसीना पोंछने के लिए इस्तेमाल होता था।
    reason: शब्दार्थ का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: वह दूसरा
  rationale: यह पहले आए सेवकों से भिन्न, अब आने वाले दूसरे सेवक को सूचित करता है। ‘वह दूसरा’ इस विरोध को सहज रूप से बनाए रखता है।
- source_word: ἦλθεν λέγων
  choice: आया और कहने लगा
  rationale: यूनानी कृदन्तीय रचना को स्वाभाविक हिन्दी कथन में बदला गया है; इससे आने और बोलने का क्रम बना रहता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यहाँ संबोधन दृष्टान्त के स्वामी के लिए है। ‘प्रभु’ κύριος का सामान्य समतुल्य है और दृष्टान्त में निहित व्यापक अनुगूँज को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἰδοὺ
  choice: देखिए, यह रही
  rationale: यह ध्यान आकर्षित करने और वस्तु सामने प्रस्तुत करने—दोनों भावों को आधुनिक, आदरसूचक हिन्दी में व्यक्त करता है।
- source_word: ἡ μνᾶ σου
  choice: आपकी मीना
  rationale: मीना प्राचीन मुद्रा और भार की इकाई है। लिप्यंतरण आधुनिक मुद्रा का भ्रामक समतुल्य देने से बचता है।
- source_word: ἣν εἶχον ἀποκειμένην
  choice: जिसे मैंने … रख छोड़ा था
  rationale: εἶχον के साथ ἀποκειμένην लगातार बनी हुई अवस्था बताता है—मीना अलग रखी हुई थी। ‘रख छोड़ा था’ इस स्थायी अवस्था को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἐν σουδαρίῳ
  choice: एक कपड़े में
  rationale: σουδάριον पसीना या चेहरा पोंछने में प्रयुक्त छोटे कपड़े अथवा रूमाल को कह सकता है। मुख्य पाठ में व्यापक ‘कपड़े’ रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दृष्टान्त में κύριος का प्रत्यक्ष संबोधन
  choice: प्रभु
  alternative: स्वामी / मालिक
  rationale: संदर्भ में संबोधन दृष्टान्त के स्वामी से है, फिर भी ‘प्रभु’ मूल शब्द का सामान्य धार्मिक और लौकिक विस्तार बनाए रखता है। इससे पाठ की संभावित मसीही अनुगूँज न तो थोपी जाती है, न मिटाई जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक प्रत्यक्ष भाषण रखा गया है। शैली सहज किंतु गरिमापूर्ण है; प्राचीन मुद्रा ‘मीना’ को मूल रूप में रखते हुए पादटिप्पणी से स्पष्ट किया गया है।
