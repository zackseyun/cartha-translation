  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: hi
  text: जब वह अब जैतून के पहाड़ की उतराई के निकट पहुँच रहा था, तब चेलों की पूरी भीड़ आनन्दित होकर उन सभी सामर्थ्यपूर्ण कार्यों[a] के कारण, जिन्हें उन्होंने देखा था, ऊँचे स्वर में परमेश्वर की स्तुति करने लगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चमत्कार” अथवा “सामर्थ्य के कार्य”; यूनानी शब्द उन कार्यों पर बल देता है जिनमें सामर्थ्य प्रकट हुआ।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: जब वह ... पास पहुँच रहा था
  rationale: सम्बन्धकारक निरपेक्ष रचना समय की पृष्ठभूमि देती है। ‘पहुँच रहा था’ निकट आने की गतिशील और अपूर्ण क्रिया को स्वाभाविक हिन्दी में बनाए रखता है; ἤδη का भाव प्रसंग में इस चरण तक पहुँचने से व्यक्त होता है।
- source_word: πρὸς τῇ καταβάσει
  choice: उतराई के पास
  rationale: यह वाक्यांश नीचे जाने वाले ढलान के निकट स्थान को बताता है। ‘उतराई के पास’ स्थलाकृति को अनावश्यक रूप से अधिक निश्चित किए बिना अर्थ स्पष्ट करता है।
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: जैतून पहाड़
  rationale: यह स्थान-नाम आधुनिक हिन्दी बाइबलीय प्रयोग में सुबोध और स्वाभाविक है।
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: चेलों की सारी भीड़
  rationale: πλῆθος एक बड़े समूह को दर्शाता है और ἅπαν उसकी समग्रता पर बल देता है। ‘चेलों की’ स्पष्ट करता है कि यह सामान्य जनसमूह नहीं था।
- source_word: χαίροντες
  choice: आनन्दित होकर
  rationale: कृदन्त स्तुति करने के साथ उपस्थित भाव और रीति को व्यक्त करता है।
- source_word: ἤρξαντο ... αἰνεῖν τὸν θεὸν
  choice: परमेश्वर की स्तुति करने लगी
  rationale: यह आरम्भसूचक क्रिया और अनन्तरूप को स्वाभाविक हिन्दी में सटीक रूप से व्यक्त करता है। भीड़ को व्याकरणिक रूप से स्त्रीलिंग एकवचन मानकर ‘लगी’ रखा गया है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: ग्रीक के ठोस मुहावरे का सहज और स्पष्ट हिन्दी रूप।
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: उन सभी सामर्थ्य के कामों के कारण, जिन्हें उन्होंने देखा था
  rationale: περί यहाँ स्तुति का कारण बताता है। δύναμις को ‘सामर्थ्य के काम’ कहना दैवी शक्ति के प्रकट कार्यों पर बल बनाए रखता है और इसे केवल तकनीकी अर्थ में ‘चमत्कार’ तक सीमित नहीं करता।
theological_decisions:
- issue: चमत्कारी प्रसंग में δύναμις का अनुवाद
  choice: सामर्थ्य के काम
  alternative: चमत्कार; सामर्थ्यपूर्ण कार्य
  rationale: यह यूनानी शब्द सामर्थ्य, सामर्थ्य के कार्य या चमत्कार को सूचित कर सकता है। ‘सामर्थ्य के काम’ कार्यों में प्रकट शक्ति को बनाए रखता है और मूल की अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की कथात्मक गति बनाए रखते हुए कृदन्तों और स्थान-सूचक पदों को स्वाभाविक हिन्दी क्रम में रखा गया है।
