  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: hi
  text: जब वे ये बातें सुन रहे थे, तब उसने आगे एक दृष्टान्त सुनाया, क्योंकि वह यरूशलेम के निकट था और वे सोचते थे कि परमेश्वर का राज्य तुरन्त ही प्रकट होने वाला है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुरन्त दिखाई देने वाला है।’ यहाँ प्रयुक्त क्रिया का अर्थ दिखाई देना या प्रकट होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: जब वे ये बातें सुन रहे थे
  rationale: वर्तमान कृदन्त वाला संबंधवाचक स्वतंत्र पदबंध उसी समय जारी सुनने की क्रिया बताता है; यह अनुवाद उसकी समकालिक और अपूर्ण क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: προσθεὶς εἶπεν
  choice: उसने आगे ... सुनाया
  rationale: यह मुहावरेदार रचना पहले कही गई बात को आगे बढ़ाने या उसमें कुछ जोड़ने का भाव देती है; दृष्टान्त के साथ ‘आगे ... सुनाया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παραβολὴν
  choice: एक दृष्टान्त
  rationale: सुसमाचारों में इस साहित्यिक और शिक्षात्मक रूप के लिए यह स्थापित, गरिमापूर्ण हिन्दी शब्द है।
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: क्योंकि वह यरूशलेम के निकट था
  rationale: διά के साथ संज्ञीकृत infinitive कारण व्यक्त करता है, और αὐτόν का आशय यीशु से है; इसलिए निकटता यीशु की यरूशलेम से है।
- source_word: δοκεῖν αὐτοὺς
  choice: वे समझते थे
  rationale: यह लोगों की धारणा या अपेक्षा व्यक्त करता है, न कि निश्चित तथ्य; ‘समझते थे’ इस अर्थ को सहज हिन्दी में रखता है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रियाविशेषण बिना विलंब, उसी समय घटने की अपेक्षा पर बल देता है।
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: प्रकट होने वाला है
  rationale: μέλλω निकट भविष्य की अपेक्षा व्यक्त करता है और ἀναφαίνεσθαι दृश्य या प्रत्यक्ष रूप से प्रकट होने का भाव देता है; कथित दृष्टिकोण के भीतर वर्तमान ‘है’ हिन्दी में अपेक्षित आसन्नता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह βασιλεία τοῦ θεοῦ का स्थापित और सटीक अनुवाद है तथा लूका के वृत्तान्त में पारिभाषिक निरंतरता बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के राज्य के अपेक्षित प्रकटीकरण का स्वरूप
  choice: लोग यह समझते थे कि परमेश्वर का राज्य तुरन्त ‘प्रकट होने वाला है।’
  alternative: राज्य तुरन्त राजनीतिक रूप से स्थापित होने वाला था; अथवा उसका अंतिम युगान्तकारी प्रकटीकरण होने वाला था।
  rationale: पद आसन्न प्रकटीकरण की उनकी अपेक्षा बताता है, पर उसके राजनीतिक, युगान्तकारी या आत्मिक स्वरूप को निर्दिष्ट नहीं करता; अनुवाद इस अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘दृष्टान्त,’ ‘परमेश्वर का राज्य’ और ‘यरूशलेम’ जैसे स्थापित बाइबिलीय पदों को बनाए रखते हुए वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट रखा गया है।
