  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: hi
  text: और उसने उस दूसरे से भी कहा, “तू भी पाँच नगरों पर अधिकारी हो जा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: और उसने ... कहा
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ स्वाभाविक प्रवाह बनाए रखता है, जबकि εἶπεν का सामान्य कथात्मक अर्थ ‘कहा’ है।
- source_word: καὶ τούτῳ
  choice: उस दूसरे से भी
  rationale: τούτῳ का संकेत उस अगले सेवक की ओर है और καί ‘भी’ का भाव देता है। हिन्दी में ‘उस दूसरे से भी’ प्रसंगगत वितरण को स्पष्ट और स्वाभाविक रखता है।
- source_word: Καὶ σὺ
  choice: तू भी
  rationale: καί यहाँ पिछले सेवक के समान इस सेवक को भी संबोधित किए जाने का भाव देता है। ‘तू’ स्वामी द्वारा सेवक को सीधे संबोधन के अनुरूप है।
- source_word: ἐπάνω γίνου
  choice: पर अधिकारी हो जा
  rationale: ἐπάνω के साथ γίνου किसी अधिकारपूर्ण पद पर स्थापित होने का आदेश व्यक्त करता है। ‘अधिकारी हो जा’ शाब्दिक संबंध और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: πέντε πόλεων
  choice: पाँच नगरों
  rationale: πόλις का सामान्य अर्थ ‘नगर’ है; संबंधकारक रूप ἐπάνω के साथ उन नगरों पर अधिकार का क्षेत्र बताता है।
