id: LUK.19.13
reference: Luke 19:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: hi
  text: फिर उसने अपने दस दासों[a] को बुलाकर उन्हें दस मीना[b] दिए और उनसे कहा, “जब तक मैं न आऊँ, व्यापार करो।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द doulos संदर्भ के अनुसार “दास” या “सेवक” के अर्थ में आ सकता है। यहाँ स्वामी-दास का संबंध प्रमुख है।
    reason: alternative_reading
  - marker: b
    text: मीना प्राचीन काल की एक मुद्रा-इकाई थी।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद “लेन-देन करो” या “व्यवसाय में लग जाओ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: बुलाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है; ‘बुलाकर’ हिन्दी में इस क्रम और कृदन्तीय संबंध को स्वाभाविक रूप से रखता है।
- source_word: δούλους
  choice: दासों
  rationale: δοῦλος स्वामी के अधिकाराधीन दास या सेवक को सूचित कर सकता है। यहाँ ἑαυτοῦ और दृष्टान्त का स्वामी-दास परिवेश ‘दास’ को अधिक उपयुक्त बनाता है, जबकि पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
- source_word: ἑαυτοῦ
  choice: अपने
  rationale: निजवाचक सर्वनाम स्वामी से उनके विशेष संबंध या स्वामित्व पर बल देता है; ‘अपने’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: μνᾶς
  choice: मीना
  rationale: प्राचीन मुद्रा-इकाई का लिप्यन्तरण आधुनिक भारतीय मुद्रा से भ्रामक समानता से बचता है और ऐतिहासिक विशिष्टता बनाए रखता है।
- source_word: Πραγματεύσασθε
  choice: व्यापार करो
  rationale: आज्ञार्थक क्रिया सौंपी गई धनराशि से व्यावसायिक लेन-देन करने को कहती है। ‘व्यापार करो’ निवेश की किसी एक विधि को अनावश्यक रूप से निश्चित किए बिना अर्थ व्यक्त करता है।
- source_word: ἐν ᾧ ἔρχομαι
  choice: जब तक मैं न आऊँ
  rationale: यह कालवाचक अभिव्यक्ति आगमन तक के समय को दर्शाती है। यह हिन्दी में स्वाभाविक है और मूल के ‘आने’ को ‘लौटने’ में स्पष्ट करके नहीं बदलती।
theological_decisions:
- issue: दृष्टान्त के स्वामी-दास परिवेश में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पात्रों को उस व्यक्ति के ‘अपने’ लोग कहा गया है और वह उन्हें अपनी धनराशि सौंपता है; इसलिए सामाजिक अधीनता और स्वामित्व-संबंध को ‘दास’ अधिक स्पष्टता से सुरक्षित रखता है। फिर भी शब्द की संदर्भगत अर्थ-सीमा पादटिप्पणी में दी गई है, ताकि उसे किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। वाक्य-संरचना संक्षिप्त रखी गई है; प्राचीन सामाजिक और आर्थिक शब्दों को आधुनिक समतुल्यों से बदलने के बजाय पादटिप्पणियों द्वारा स्पष्ट किया गया है।
