  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: hi
  text: इसलिए उसने कहा, “एक कुलीन व्यक्ति अपने लिए राज्य[a] प्राप्त करने और लौट आने के लिए दूर देश गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजत्व” अथवा “राजकीय सत्ता।” यूनानी शब्द βασιλεία राज्य-क्षेत्र को, या राजा के शासन और अधिकार को, सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से तार्किक और कथात्मक संबंध दिखाता है; ‘इसलिए’ यूनानी संयोजक की निष्कर्षात्मक छाया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: एक कुलीन व्यक्ति
  rationale: τις पात्र को अनिश्चित रूप से प्रस्तुत करता है और εὐγενής उसके उच्च कुल या सामाजिक प्रतिष्ठा को बताता है; ‘एक कुलीन व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: ἐπορεύθη εἰς χώραν μακράν
  choice: दूर देश गया
  rationale: यह किसी दूरवर्ती भूभाग की ओर यात्रा को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: λαβεῖν ἑαυτῷ
  choice: अपने लिए ... प्राप्त करने
  rationale: राजनीतिक संदर्भ में λαμβάνω अधिकार या राज्य को प्रदान किए जाने पर ग्रहण करने का भाव रखता है, जबकि आत्मवाचक दत्तिव ἑαυτῷ ‘अपने लिए’ को स्पष्ट करता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: βασιλεία भू-राज्य, राजत्व या राजकीय शासन-अधिकार का द्योतक हो सकता है। ‘राज्य प्राप्त करना’ प्रसंग में स्वाभाविक है, और अर्थ की अन्य संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ὑποστρέψαι
  choice: लौट आने
  rationale: यह पहले के प्रस्थान के बाद वापस आने को व्यक्त करता है और λαβεῖν के साथ उद्देश्यसूचक समन्वित क्रिया है।
theological_decisions:
- issue: राजनीतिक दृष्टान्त में βασιλείαν का अर्थ
  choice: राज्य
  alternative: राजत्व; राजकीय सत्ता
  rationale: यहाँ किसी कुलीन व्यक्ति के दूर जाकर मान्य राजकीय पद या अधिकार पाने और फिर लौटने की तस्वीर है। ‘राज्य’ परिचित और स्वाभाविक अभिव्यक्ति है, पर यूनानी शब्द केवल भूभाग नहीं बल्कि शासन या राजत्व भी बता सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कुलीन व्यक्ति’ जन्म या सामाजिक हैसियत की ऊँचाई व्यक्त करता है, और वाक्य में यूनानी मूल के दोनों उद्देश्य—प्राप्त करना और लौट आना—बिना अतिरिक्त काल-संयोजक के सुरक्षित हैं।
