- source_word: Καὶ
  choice: और
  rationale: यह कथा की अगली घटना को पिछली घटना से साधारण रीति से जोड़ता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: εἰσελθὼν
  choice: प्रवेश करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुए प्रवेश को व्यक्त करता है; ‘प्रवेश करके’ हिन्दी में स्वाभाविक रूप से इस क्रम को बनाए रखता है।
- source_word: διήρχετο
  choice: वहाँ से होकर जा रहा था
  rationale: अपूर्ण भूतकाल चल रही गति को दर्शाता है; यह रूप उस अपूर्णतापरक पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὴν Ἰεριχώ
  choice: यरीहो
  rationale: स्थानवाचक व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय वर्तनी में रखा गया है; प्रसंग में नगर के भीतर प्रवेश और उससे होकर जाने का भाव है।
