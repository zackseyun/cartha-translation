  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के अनुकूल रखी गई है। यरूशलेम को व्यक्ति मानकर सीधे संबोधित करने के कारण ‘तू/तेरी’ और स्त्रीलिंग ‘जानती’ प्रयुक्त हैं। ‘आज के इस दिन’ सामान्य पाठक के लिए स्वाभाविक है और मूल के संकेतात्मक बल को बनाए रखता है।
