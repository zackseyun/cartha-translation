source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: hi
  text: यह कहते हुए, “यदि तुम भी इस दिन उन बातों को जानतीं जो शांति से संबंधित हैं[a][b]—पर अब वे तुम्हारी आँखों से छिप गई हैं।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काश तुम भी इस दिन उन बातों को जानतीं जो शांति से संबंधित हैं।”
    reason: विलापपूर्ण शर्त का स्वाभाविक वैकल्पिक अनुवाद।
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “शांति की ओर की बातें”; अर्थात वे बातें जो शांति से संबंधित हैं या उसकी ओर ले जाती हैं।
    reason: मूल मुहावरे और उसके अर्थ-क्षेत्र को स्पष्ट करना।
  - marker: c
    text: यूनानी क्रिया एकवचन है; इसलिए भावगत रूप से इसका अनुवाद “पर अब यह तुम्हारी आँखों से छिप गया है” भी किया जा सकता है।
    reason: व्याकरण की वास्तविक अस्पष्टता और वैकल्पिक अनुवाद को दर्ज करना।
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत को पिछले वाक्य के साथ जुड़ी हुई क्रिया के रूप में बनाए रखता है और कथन के प्रवाह को अनावश्यक रूप से स्वतंत्र पूर्ण क्रिया में नहीं बदलता।
- source_word: Εἰ ἔγνως
  choice: यदि ... जानती
  rationale: विलाप में अधूरी रह गई शर्त और पूरी न हुई संभावना का भाव सुरक्षित रहता है। यरूशलेम को संबोधन होने के कारण स्त्रीलिंग एकवचन ‘जानती’ स्वाभाविक है।
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: आज के इस दिन
  rationale: समय-सूचक वाक्यांश को आधुनिक हिन्दी में स्वाभाविक रखते हुए ‘इस दिन’ का संकेत और वर्तमान दिन का बल दोनों व्यक्त करता है।
- source_word: καὶ σὺ
  choice: तू भी
  rationale: संबोधित यरूशलेम पर पड़े जोर को व्यक्त करता है। एकवचन ‘तू’ नगर से सीधे, भावपूर्ण संबोधन के अनुरूप है और अनादर सूचित करने के लिए नहीं है।
- source_word: τὰ πρὸς εἰρήνην
  choice: वे बातें जो शांति की ओर ले जाती हैं
  rationale: मूल के बहुवचन सार्थक पद और ‘शांति से संबंधित अथवा उसकी ओर ले जाने वाली बातों’ का दिशात्मक भाव स्पष्ट रहता है।
- source_word: εἰρήνην
  choice: शांति
  rationale: यह मानक और प्रसंगानुकूल शब्द है, जिसमें मेल, कुशलता और आने वाले विनाश से बचाव की व्यापक अर्थ-छाया बनी रहती है।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: जो जाना जा सकता था और वर्तमान छिपाव के बीच तीखा विरोध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκρύβη
  choice: छिपी हुई हैं
  rationale: यूनानी अओरिस्ट कर्मवाच्य के परिणामस्वरूप वर्तमान छिपी दशा को व्यक्त करता है, बिना छिपाने वाले कर्ता की पहचान जोड़े। हिन्दी में बहुवचन निकटवर्ती ‘बातों’ से स्पष्ट संबंध बनाता है।
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: तेरी आँखों से
  rationale: देखने और पहचानने की मूल बाइबिलीय उपमा को शाब्दिक किन्तु स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: शर्तसूचक विलाप का स्वरूप
  choice: मुख्य पाठ में ‘यदि ... जानती’ रखकर अधूरी शर्त को सुरक्षित रखा गया है।
  alternative: ‘काश तू ... जानती’
  rationale: प्रसंग में ‘काश’ का विलापपूर्ण भाव निहित है, पर यूनानी में उसके लिए अलग स्पष्ट अव्यय नहीं है। इसलिए मुख्य पाठ मूल की शर्तात्मक और अधूरी बनावट को बनाए रखता है तथा अधिक व्याख्यात्मक विकल्प टिप्पणी में देता है।
- issue: ἐκρύβη का निहित विषय
  choice: ‘शांति की ओर ले जाने वाली बातें’ को बहुवचन ‘वे’ से फिर ग्रहण किया गया है।
  alternative: 'भावगत एकवचन: ‘यह तेरी आँखों से छिपा हुआ है’'
  rationale: यूनानी क्रिया एकवचन है, पर उसका सबसे निकट और अर्थपूर्ण संबंध पूर्ववर्ती नपुंसकलिंग बहुवचन पद से है, जिसे यूनानी भावगत एकवचन के रूप में ग्रहण कर सकती है। हिन्दी में बहुवचन संबंध अधिक स्पष्ट और स्वाभाविक है।
- issue: कर्मवाच्य में छिपाने वाला कर्ता
  choice: ‘छिपी हुई हैं’ कहकर कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: ‘परमेश्वर ने उन्हें छिपा दिया है’
  rationale: प्रसंग में दैवी न्याय की संभावना हो सकती है, पर पद स्वयं कर्ता का नाम नहीं बताता। अनिर्दिष्ट कर्मवाच्य वास्तविक धार्मिक तनाव को बिना अतिरिक्त निष्कर्ष जोड़े सुरक्षित रखता है।
