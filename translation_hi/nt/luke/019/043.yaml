source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: hi
  text: क्योंकि वे दिन तुझ पर आएँगे, जब तेरे शत्रु तेरे विरुद्ध घेराबंदी की प्राचीर[a] खड़ी करेंगे, तुझे चारों ओर से घेर लेंगे और हर ओर से तुझे जकड़ लेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घेराबंदी का बाँध” अथवा “घेराबंदी का परकोटा।”
    reason: यूनानी शब्द χάραξ यहाँ नगर को घेरने के लिए बनाया गया सैन्य बाँध, प्राचीर, परकोटा या इसी प्रकार का घेराबंदी-निर्माण सूचित कर सकता है।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन से कारण और आगामी भविष्यवाणी की विषय-वस्तु को जोड़ता है; हिन्दी में ‘क्योंकि’ इसका स्वाभाविक कारणात्मक बल बनाए रखता है।
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: वे दिन तुझ पर आएँगे
  rationale: मूल की भविष्यसूचक समय-संबंधी अभिव्यक्ति और विपत्ति के यरूशलेम पर आ पड़ने के भाव, दोनों को सुरक्षित रखता है।
- source_word: οἱ ἐχθροί σου
  choice: तेरे शत्रु
  rationale: मूल के एकवचन संबोधन और शत्रुतापूर्ण सेनाओं के स्पष्ट अर्थ को बनाए रखता है।
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: तेरे विरुद्ध घेराबंदी का मोर्चा खड़ा करेंगे
  rationale: क्रिया और संज्ञा मिलकर नगर के विरुद्ध बनाए जाने वाले सैन्य घेराबंदी-निर्माण को दर्शाते हैं। यह हिन्दी में समझने योग्य है, जबकि संज्ञा के सटीक भौतिक रूप की अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: περικυκλώσουσίν σε
  choice: तुझे चारों ओर से घेर लेंगे
  rationale: सैन्य संदर्भ में पूर्ण घेराव को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνέξουσίν σε πάντοθεν
  choice: हर ओर से तुझे दबा देंगे
  rationale: घेराबंदी में चारों दिशाओं से कसते और सीमित करते जाने का भाव देता है, बिना परिणाम को मूल से अधिक स्पष्ट किए।
theological_decisions:
- issue: द्वितीय पुरुष एकवचन सर्वनामों का संदर्भ
  choice: ‘तुझ/तेरे/तुझे’ द्वारा यरूशलेम को एक व्यक्तित्व के रूप में संबोधित किया गया है।
  alternative: इसे नगर के निवासियों के लिए सामूहिक बहुवचन ‘तुम’ के रूप में व्यक्त किया जा सकता था।
  rationale: यूनानी पाठ में सर्वनाम एकवचन हैं और निकटवर्ती संदर्भ में यरूशलेम को व्यक्तिरूप में संबोधित किया गया है। हिन्दी का एकवचन रूप इस भविष्यसूचक और काव्यात्मक संबोधन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुझ’ का प्रयोग अनौपचारिकता के लिए नहीं, बल्कि मूल के एकवचन, व्यक्तिरूप संबोधन को सुरक्षित रखने के लिए किया गया है।
