  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: hi
  text: तो तुमने मेरा पैसा बैंक में क्यों नहीं जमा किया? तब मैं लौटकर उसे ब्याज समेत वसूल कर लेता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: क्यों
  rationale: यह कारण पूछने वाला स्वाभाविक प्रश्न है और कथन में निहित उलाहने को बनाए रखता है।
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: बैंक में ... जमा किया
  rationale: शाब्दिक रूप से यह पैसा ‘मेज़ पर’ देने की बात है, पर प्राचीन वित्तीय संदर्भ में τράπεζα साहूकार या बैंक की मेज़ और उससे जुड़ी बैंकिंग व्यवस्था को सूचित करता है। आधुनिक हिन्दी में ‘बैंक में जमा करना’ अपेक्षित आर्थिक क्रिया को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: μου τὸ ἀργύριον
  choice: मेरा पैसा
  rationale: ἀργύριον का मूल अर्थ चाँदी है, पर यहाँ वह विनिमय के धन को दर्शाता है; इसलिए ‘पैसा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κἀγὼ ἐλθὼν
  choice: तब मैं लौटकर
  rationale: आगमन को इस प्रसंग में स्वामी की वापसी के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘तब’ जमा करने के संभावित परिणाम से संबंध स्पष्ट करता है।
- source_word: σὺν τόκῳ
  choice: ब्याज समेत
  rationale: τόκος यहाँ जमा धन पर मिलने वाले ब्याज को दर्शाता है; ‘ब्याज समेत’ संक्षिप्त और प्रचलित वित्तीय अभिव्यक्ति है।
- source_word: αὐτὸ ἔπραξα
  choice: उसे ... वसूल कर लेता
  rationale: πράσσω यहाँ देय रकम प्राप्त या वसूल करने के व्यावसायिक अर्थ में है। यह अनिश्चित भूतकालीन संभावना को ‘कर लेता’ द्वारा व्यक्त करता है।
