  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: hi
  text: वह जल्दी से नीचे उतरा और आनंद से यीशु का स्वागत किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जल्दी करके नीचे उतरा और आनंदित होते हुए उसे अपने यहाँ ग्रहण किया।”
    reason: मूल के कृदन्तीय रूपों और ‘ग्रहण करने’ के अधिक शाब्दिक विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: σπεύσας
  choice: जल्दी से
  rationale: यह क्रियाविशेषणीय रूप तत्परता और शीघ्रता व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: κατέβη
  choice: नीचे उतरा
  rationale: यह दिशा और गति दोनों को स्पष्ट रूप से व्यक्त करता है और पेड़ से उतरने के प्रसंग के अनुकूल है।
- source_word: ὑπεδέξατο
  choice: स्वागत किया
  rationale: मध्यमवाच्य क्रिया यहाँ आतिथ्यपूर्वक ग्रहण करने का भाव रखती है; ‘स्वागत किया’ आधुनिक हिन्दी में इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτόν
  choice: यीशु का
  rationale: यूनानी में सर्वनाम है, पर हिन्दी में अस्पष्टता से बचने के लिए उसके स्पष्ट पूर्वपद ‘यीशु’ का प्रयोग किया गया है।
- source_word: χαίρων
  choice: आनंद से
  rationale: वर्तमान कृदन्त स्वागत के साथ चल रही आनंदपूर्ण मनःस्थिति बताता है; ‘आनंद से’ अर्थ और रीति दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: पहला καί पूर्व कथन से जोड़ता है और दूसरा कार्यों की क्रमिकता दिखाता है; हिन्दी वाक्य में आरंभिक संबंध प्रसंग से स्पष्ट होने के कारण उसे अलग शब्द से व्यक्त करना आवश्यक नहीं, जबकि दोनों कार्य ‘और’ से जुड़े हैं।
