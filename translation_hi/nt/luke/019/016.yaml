lexical_decisions:
- source_word: παρεγένετο δὲ ὁ πρῶτος λέγων
  choice: तब पहला सेवक आया और बोला
  rationale: δέ कथा में अगले क्रम को सूचित करता है, इसलिए ‘तब’ स्वाभाविक है। संदर्भ से ὁ πρῶτος पहला सेवक है; यूनानी कृदंत λέγων को सहज हिन्दी में ‘और बोला’ किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριε आदरपूर्वक किसी अधिकारी या स्वामी को संबोधित कर सकता है। ‘प्रभु’ मूल शब्द की व्यापकता और परियोजना की संगति बनाए रखता है; प्रसंगानुकूल ‘स्वामी’ को पादटिप्पणी में दिया गया है।
- source_word: ἡ μνᾶ σου
  choice: आपकी एक मीना
  rationale: μνᾶ प्राचीन मुद्रा और भार की इकाई है। ऐतिहासिक विशिष्टता बचाने के लिए इसका लिप्यंतरण ‘मीना’ रखा गया है; ‘एक’ हिन्दी में वाक्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: δέκα προσηργάσατο μνᾶς
  choice: दस मीना और कमाए हैं
  rationale: προσεργάζομαι काम करके अतिरिक्त लाभ कमाने का भाव देता है। ‘और कमाए हैं’ आरम्भिक मीना से अलग दस मीना की बढ़ोतरी स्पष्ट करता है और वर्तमान परिणाम को व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में κύριος का संबोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ संबोधन किसी उच्चाधिकारी या मालिक के लिए आदरसूचक भी हो सकता है; इसे अनिवार्य रूप से मसीही उपाधि मानना आवश्यक नहीं। मुख्य पाठ में ‘प्रभु’ रखा गया है और वास्तविक प्रसंगगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मीना’ जैसे ऐतिहासिक पद को अनूदित मुद्रा-मूल्य से बदलने के बजाय संक्षिप्त पादटिप्पणी से समझाया गया है।
