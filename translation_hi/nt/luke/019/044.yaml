revisions:
- from: और वे तुझे और तेरे भीतर के बच्चों को धरती पर पटक देंगे। वे तेरे भीतर एक पत्थर पर दूसरा पत्थर भी नहीं छोड़ेंगे, क्योंकि तू अपनी सुधि लिए जाने[a] का समय नहीं पहचान सकी।
  to: और वे तुझे और तेरे बच्चों को, जो तेरे भीतर हैं, भूमि पर गिरा देंगे। वे तेरे भीतर एक पत्थर पर दूसरा पत्थर भी नहीं छोड़ेंगे, क्योंकि तू तेरी सुधि लेने के समय को नहीं पहचान सकी।
  rationale: 'The revision improves modern-Hindi idiom and clarity while maintaining the Greek rhetoric: Jerusalem remains a feminine singular addressee, her children remain ‘within’ her, and ἐπισκοπή remains deliberately open as a visitation/inspection rather than being explicitly attributed to God or defined solely as judgment.'
  reviewer_model: gpt-5.6-terra
