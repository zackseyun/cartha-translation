id: LUK.19.44
reference: Luke 19:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: hi
  text: और वे तुझे और तेरे बच्चों को, जो तेरे भीतर हैं, भूमि पर गिरा देंगे। वे तेरे भीतर एक पत्थर पर दूसरा पत्थर भी नहीं छोड़ेंगे, क्योंकि तू तेरी सुधि लेने के समय को नहीं पहचान सकी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: धरती पर पटक देंगे
  rationale: यह क्रिया किसी को भूमि तक गिरा देने, ढहा देने या नष्ट कर देने का प्रबल भाव रखती है। यह अभिव्यक्ति नगर और उसके भीतर के लोगों—दोनों पर स्वाभाविक रूप से लागू होती है।
- source_word: σε
  choice: तुझे
  rationale: येरूशलेम को मानवीकृत करके सीधे एकवचन में संबोधित किया गया है; इसलिए इसे ‘तेरे नगर को’ कहकर स्पष्ट नहीं किया गया।
- source_word: τὰ τέκνα σου ἐν σοί
  choice: तेरे भीतर के बच्चों को
  rationale: τέκνα का शाब्दिक अर्थ ‘बच्चे’ है। प्रसंग में नगर के निवासी अभिप्रेत हैं, फिर भी येरूशलेम को माता के रूप में प्रस्तुत करने वाली छवि बनाए रखी गई है।
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: वे तेरे भीतर एक पत्थर पर दूसरा पत्थर भी नहीं छोड़ेंगे
  rationale: यह पूर्ण विनाश का चित्र है। ‘भी’ हिन्दी में इसकी व्यापकता और बल को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘तेरे भीतर’ मूल पाठ के ἐν σοί को बनाए रखता है।
- source_word: ἀνθ’ ὧν
  choice: क्योंकि
  rationale: यहाँ यह पद आने वाले न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: ἔγνως
  choice: नहीं पहचान सकी
  rationale: γινώσκω यहाँ केवल तथ्य जानने के बजाय निर्णायक समय को पहचानने का भाव देता है। येरूशलेम को संबोधित किए जाने के कारण स्त्रीलिंग क्रिया प्रयुक्त हुई है।
- source_word: καιρὸν
  choice: समय
  rationale: καιρός किसी महत्वपूर्ण या नियत अवसर को दर्शा सकता है। ‘समय’ सरल है और उसका विशेष महत्व शेष वाक्यांश से प्रकट होता है।
- source_word: τῆς ἐπισκοπῆς σου
  choice: अपनी सुधि लिए जाने का
  rationale: ἐπισκοπή में भेंट, देखरेख या जाँच का भाव हो सकता है। ‘सुधि लिए जाने’ से ईश्वरीय आगमन का संकेत मिलता है, पर यह स्पष्ट नहीं किया जाता कि उसका परिणाम कृपा है या न्याय।
theological_decisions:
- issue: न्याय के प्रसंग में ἐπισκοπή का अर्थ
  choice: ‘अपनी सुधि लिए जाने’—ईश्वरीय आगमन का संकेत निहित, पर कर्ता और परिणाम स्पष्ट नहीं किए गए
  alternative: ‘अपने निरीक्षण का’ अथवा ‘जब परमेश्वर तेरे पास आया’
  rationale: मूल संज्ञा कृपा या न्याय लाने वाली ईश्वरीय भेंट अथवा जाँच की ओर संकेत कर सकती है। अनुवाद इस धार्मिक तनाव को बनाए रखता है और परमेश्वर या यीशु को स्पष्ट कर्ता जोड़कर मूल से अधिक निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। येरूशलेम के मानवीकरण और मातृ-छवि को ‘तुझे’, ‘तेरे भीतर के बच्चों’ और स्त्रीलिंग ‘पहचान सकी’ से सुरक्षित रखा गया है।
