review_pass:
  verdict: revise
  source_fidelity: The draft preserves the personified singular address to Jerusalem, the maternal image of her children within her, the totality of destruction, the causal force of ἀνθ’ ὧν, and the nuance of failing to recognize a decisive time. However, ‘अपनी सुधि लिए जाने का समय’ is grammatically awkward and does not naturally convey ἐπισκοπή in modern Hindi.
  naturalness: ‘तेरे भीतर के बच्चों’ can sound like unborn children in contemporary Hindi, and ‘सुधि लिए जाने’ is not idiomatic in this construction. ‘तेरे बच्चों को, जो तेरे भीतर हैं’ retains the image while reading more naturally; ‘तेरी सुधि लेने के समय’ is an idiomatic, suitably open rendering of visitation.
  terminology: ‘तेरी सुधि लेने’ preserves the visitation/attention sense without specifying the visitor or deciding whether the visitation is merciful or judicial. The footnote retains ‘जाँच’ as a valid lexical alternative and explains the range without imposing an interpretation.
  issues:
  - severity: medium
    issue: The expression ‘अपनी सुधि लिए जाने का समय’ is unnatural Hindi.
    rationale: The passive infinitival phrase is cumbersome and can obscure the intended sense of ἐπισκοπή. ‘तेरी सुधि लेने के समय’ is idiomatic and keeps the agent implicit.
  - severity: low
    issue: ‘तेरे भीतर के बच्चों’ may suggest children physically inside a body.
    rationale: Although the maternal personification is intentional, ‘तेरे बच्चों को, जो तेरे भीतर हैं’ more clearly conveys children located within the personified city.
  - severity: low
    issue: ‘धरती पर पटक देंगे’ has a somewhat colloquial physical sense.
    rationale: ‘भूमि पर गिरा देंगे’ is more dignified in register while retaining the force of bringing Jerusalem and her children down to the ground.
  revised_text: और वे तुझे और तेरे बच्चों को, जो तेरे भीतर हैं, भूमि पर गिरा देंगे। वे तेरे भीतर एक पत्थर पर दूसरा पत्थर भी नहीं छोड़ेंगे, क्योंकि तू तेरी सुधि लेने के समय को नहीं पहचान सकी।
  revised_footnotes:
  - marker: a
    text: या, ‘तेरी जाँच के समय।’ यूनानी शब्द किसी से मिलने, उसकी सुधि लेने या उसकी जाँच करने को दर्शा सकता है—विशेषकर परमेश्वर के ऐसे आगमन को, जो कृपा या न्याय ला सकता है।
    reason: lexical_alternative
  revision_rationale: 'The revision improves modern-Hindi idiom and clarity while maintaining the Greek rhetoric: Jerusalem remains a feminine singular addressee, her children remain ‘within’ her, and ἐπισκοπή remains deliberately open as a visitation/inspection rather than being explicitly attributed to God or defined solely as judgment.'
