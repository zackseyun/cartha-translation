  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: hi
  text: और यीशु ने उससे कहा, “आज इस घर[a] में उद्धार आया है, क्योंकि वह भी अब्राहम का पुत्र है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस परिवार में” अथवा “इस घराने में।” यूनानी शब्द भौतिक घर और उससे जुड़े परिवार या घराने—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν
  choice: तब यीशु ने उससे कहा
  rationale: δέ एक हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग के प्रवाह को स्वाभाविक रखता है। πρὸς αὐτόν के सर्वनाम को ‘उससे’ के रूप में बनाए रखा गया है, बिना जक्कई का नाम जोड़े।
- source_word: Σήμερον
  choice: आज
  rationale: वाक्य के आरम्भ में रखकर यूनानी पाठ का कालगत बल सुरक्षित रखा गया है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: लूका में इस शब्द का अर्थ केवल तात्कालिक छुटकारा नहीं, बल्कि व्यापक धर्मवैचारिक उद्धार भी है; ‘उद्धार’ इस भार को सुरक्षित रखता है।
- source_word: τῷ οἴκῳ τούτῳ
  choice: इस घर में
  rationale: हिन्दी में उद्धार के आने के साथ ‘इस घर में’ स्वाभाविक है। οἶκος का मूल अर्थ ‘घर’ रखा गया है, जबकि परिवार या घराने का सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐγένετο
  choice: आया है
  rationale: γίνομαι का मूल भाव ‘होना/घटित होना’ है, पर σωτηρία के साथ हिन्दी में ‘उद्धार आया है’ आगमन और वर्तमान परिणाम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθότι
  choice: क्योंकि
  rationale: यह घोषणा का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में सबसे स्पष्ट समतुल्य है।
- source_word: καὶ αὐτὸς
  choice: यह भी
  rationale: καί समावेश पर बल देता है। यीशु के सामने उपस्थित व्यक्ति के लिए ‘यह भी’ उस बल को स्वाभाविक रूप से व्यक्त करता है और यूनानी के तृतीय-पुरुष रूप को बनाए रखता है।
- source_word: υἱὸς Ἀβραάμ
  choice: अब्राहम का पुत्र
  rationale: मूल एकवचन पुल्लिंग मुहावरे और उसके वाचा-संबंधी तथा पहचान-संबंधी अनुनाद को सुरक्षित रखा गया है; इसे केवल ‘वंशज’ कहने से उसका आलंकारिक बल कम हो सकता है।
theological_decisions:
- issue: ‘अब्राहम का पुत्र’ का आशय
  choice: वाक्यांश को ज्यों का त्यों पहचान और वाचा से जुड़े कथन के रूप में रखा गया है।
  alternative: इसे केवल जातीय वंशज अथवा केवल अब्राहम के विश्वास-परिवार का सच्चा सदस्य समझना।
  rationale: यह पद स्वयं इन अर्थों में से किसी एक को निर्णायक रूप से नहीं चुनता। मूल मुहावरे को बनाए रखने से जातीय वंश, विश्वासगत संबंध, अथवा दोनों की सम्भावना खुली रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उद्धार’ धर्मवैचारिक अर्थ को सुरक्षित रखता है, जबकि ‘इस घर में आया है’ साधारण हिन्दी पाठक के लिए स्वाभाविक है।
