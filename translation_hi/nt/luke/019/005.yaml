source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: hi
  text: जब यीशु उस जगह पहुँचे, तो उन्होंने ऊपर देखकर उससे कहा, “जक्कई, जल्दी नीचे उतर आओ, क्योंकि आज मुझे तुम्हारे घर ठहरना ही है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस यूनानी शब्द का अनुवाद ‘ठहरना ही है’ किया गया है, वह आवश्यकता व्यक्त करता है; लूका में यह आवश्यकता यीशु के मिशन या परमेश्वर के उद्देश्य से जुड़ी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: जब
  rationale: कथात्मक क्रम में यह पद समय-सूचक उपवाक्य आरम्भ करता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: ἐπὶ τὸν τόπον
  choice: उस जगह
  rationale: यह उस स्थान को सूचित करता है जहाँ जक्कई पेड़ पर था; ‘उस जगह’ प्रसंगानुकूल और सहज है।
- source_word: ἀναβλέψας
  choice: ऊपर देखकर
  rationale: यीशु ने पेड़ पर बैठे जक्कई की ओर ऊपर दृष्टि की; यह कृदन्त का स्वाभाविक हिन्दी रूप है।
- source_word: Ζακχαῖε
  choice: जक्कई
  rationale: यह नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: σπεύσας κατάβηθι
  choice: जल्दी नीचे उतर आओ
  rationale: कृदन्त और आज्ञार्थक क्रिया मिलकर तत्कालता व्यक्त करते हैं; यह रूप आग्रह और गति दोनों को स्पष्ट रखता है।
- source_word: σήμερον γὰρ
  choice: क्योंकि आज
  rationale: γάρ आज्ञा का कारण बताता है; ‘क्योंकि’ उसके कारणसूचक बल को स्पष्ट करता है।
- source_word: ἐν τῷ οἴκῳ σου
  choice: तुम्हारे घर
  rationale: यहाँ οἶκος जक्कई के निवास को दर्शाता है; ‘तुम्हारे घर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δεῖ με μεῖναι
  choice: मुझे ... ठहरना ही है
  rationale: ‘ही है’ आवश्यकता के प्रबल भाव को बनाए रखता है, जबकि उसके स्रोत को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता; ‘ठहरना’ μένω का प्रसंगानुकूल अर्थ है।
theological_decisions:
- issue: लूका में δεῖ द्वारा व्यक्त आवश्यकता
  choice: ‘मुझे ... ठहरना ही है’
  alternative: ‘मुझे ... ठहरना आवश्यक है’ या ‘मुझे ... ठहरना होगा’
  rationale: δεῖ प्रबल आवश्यकता दर्शाता है और लूका में प्रायः यीशु के मिशन अथवा परमेश्वर के उद्देश्य से जुड़ा हो सकता है। चुना हुआ रूप इस अर्थ-संभावना को बनाए रखता है, पर मुख्य पाठ में आवश्यकता के स्रोत की अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। जक्कई को सम्बोधन में ‘तुम’ के अनुरूप ‘उतर आओ’ और ‘तुम्हारे’ चुने गए हैं, जिससे अत्यधिक पुरातन ‘तू/तेरे’ से बचते हुए प्रत्यक्ष सम्बोधन बना रहता है।
