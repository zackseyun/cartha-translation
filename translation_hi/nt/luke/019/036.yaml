translation:
  language: hi
  text: जब वह जा रहा था, तो वे अपने वस्त्र मार्ग पर बिछाते जा रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: जब वह आगे बढ़ रहा था
  rationale: सम्बन्धकारक निरपेक्ष रचना और वर्तमान कृदन्त साथ-साथ चल रही क्रिया बताते हैं। ‘आगे बढ़ रहा था’ जुलूस के गतिशील प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δέ
  choice: तो
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे बढ़ाता है। ‘जब…तो’ की हिन्दी संरचना उस प्रवाह को स्वाभाविक रूप देती है, बिना किसी प्रबल विरोध का भाव जोड़े।
- source_word: ὑπεστρώννυον
  choice: बिछाते जा रहे थे
  rationale: अपूर्ण भूतकाल दृश्य में जारी या बार-बार हो रही क्रिया को दर्शाता है; ‘बिछाते जा रहे थे’ इस प्रगतिशीलता को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: अपने वस्त्र
  rationale: ἱμάτια सामान्यतः कपड़ों या विशेषतः बाहरी वस्त्रों का बोध करा सकता है। ‘वस्त्र’ मूल की व्यापकता बनाए रखता है और अनावश्यक रूप से किसी खास पोशाक को निश्चित नहीं करता।
- source_word: ἐν τῇ ὁδῷ
  choice: सड़क पर
  rationale: ἐν के साथ यह वाक्यांश स्थान बताता है। इस प्रसंग में ‘सड़क पर’ स्पष्ट करता है कि वस्त्र यीशु के आगे मार्ग पर बिछाए जा रहे थे।
