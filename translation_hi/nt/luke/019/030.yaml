id: LUK.19.30
reference: Luke 19:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: hi
  text: उन्होंने कहा, “सामने वाले गाँव में जाओ। उसमें प्रवेश करते ही तुम्हें एक बछेड़ा[a] बँधा हुआ मिलेगा, जिस पर आज तक कोई मनुष्य नहीं बैठा है। उसे खोलकर ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, एक जवान सवारी-पशु। यूनानी शब्द प्रजाति निर्दिष्ट नहीं करता।
    reason: πῶλον की प्रजातिगत व्यापकता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: अपने सामने के गाँव
  rationale: κατέναντι का स्थान-संबंधी अर्थ ‘सामने/दूसरी ओर’ है; हिंदी में ‘अपने सामने के गाँव’ स्वाभाविक है और अनावश्यक भौगोलिक व्याख्या नहीं जोड़ता।
- source_word: πῶλον
  choice: गधे का एक बच्चा
  rationale: πῶλος अपने आप में किसी युवा सवारी-पशु को सूचित कर सकता है; निकटवर्ती प्रसंग (लूका 19:35; जकर्याह 9:9 की पृष्ठभूमि) से गधे का बच्चा अभिप्रेत है, इसलिए सामान्य हिंदी पाठक के लिए इसे स्पष्ट किया गया है।
- source_word: δεδεμένον
  choice: बँधा हुआ
  rationale: पूर्ण कृदंत उस पशु की वर्तमान अवस्था बताता है; ‘बँधा हुआ’ इसे सहज और ठीक रूप से व्यक्त करता है।
- source_word: πώποτε
  choice: आज तक
  rationale: नकार के साथ यह ‘कभी भी अब तक नहीं’ का अर्थ देता है; ‘आज तक’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: λύσαντες ... ἀγάγετε
  choice: उसे खोलकर यहाँ ले आओ
  rationale: λύω बँधे पशु के संदर्भ में ‘खोलना’ है। ἀγάγετε का लक्ष्य संदर्भतः यीशु के पास है; हिंदी में ‘यहाँ ले आओ’ आज्ञा को स्वाभाविक बनाता है।
theological_decisions:
- issue: जिस पशु पर कभी कोई नहीं बैठा था, उसकी अप्रयुक्तता
  choice: जिस पर आज तक कोई मनुष्य नहीं बैठा
  alternative: जिस पर कभी कोई सवार नहीं हुआ
  rationale: मूल की स्पष्ट मानवीय कर्ता-संज्ञा ἀνθρώπων और बैठने की क्रिया ἐκάθισεν को बनाए रखा गया है; संभावित धार्मिक या राजकीय प्रतीकवाद की व्याख्या पाठ में नहीं जोड़ी गई।
- issue: πῶλον की पशु-प्रजाति
  choice: गधे का एक बच्चा
  alternative: एक बच्चा / एक बछेड़ा
  rationale: यद्यपि πῶλος अकेले में व्यापक हो सकता है, लूका के तत्काल प्रसंग और धर्मग्रंथीय संकेत से गधे का बच्चा अभिप्रेत है। ‘बछेड़ा’ आधुनिक हिंदी में घोड़े का बच्चा भी समझा जा सकता है, इसलिए अधिक स्पष्ट रूप चुना गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सीधी, गरिमापूर्ण और मौखिक आज्ञा के अनुरूप सहज भाषा। पद आरंभ का λέγων पिछले पद से व्याकरणिक रूप से जुड़ा है, इसलिए स्वतंत्र हिंदी पद में ‘उन्होंने कहा’ किया गया है। कोई पादटिप्पणी आवश्यक नहीं।
