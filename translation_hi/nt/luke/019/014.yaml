  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: hi
  text: परन्तु उसके नागरिक उससे घृणा करते थे और उन्होंने उसके पीछे एक प्रतिनिधिमंडल[a] भेजकर कहलवाया, ‘हम नहीं चाहते कि यह आदमी हम पर राज करे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूतमंडल।’ यूनानी शब्द आधिकारिक उद्देश्य से भेजे गए प्रतिनिधियों के समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: नागरिक
  rationale: यह शब्द किसी राजनीतिक समुदाय के सदस्यों को दर्शाता है। ‘नागरिक’ उसके नागरिक-राजनीतिक अर्थ को बनाए रखता है; ‘प्रजा’ कहने से उस राजत्व को पहले ही मान लिया जाता जिसे वे अस्वीकार कर रहे हैं।
- source_word: ἐμίσουν
  choice: घृणा करते थे
  rationale: अपूर्ण भूतकाल उनकी जारी या स्वभावगत शत्रुता दर्शाता है। यह हिंदी में स्वाभाविक रूप से उस निरंतर भाव को व्यक्त करता है।
- source_word: ἀπέστειλαν
  choice: भेजकर कहलवाया
  rationale: मुख्य क्रिया ‘भेजा’ और उसके साथ आए कृदंत λέγοντες को सहज हिंदी वाक्य में जोड़ता है, बिना संदेश के आशय में कुछ जोड़े।
- source_word: πρεσβείαν
  choice: एक प्रतिनिधिमंडल
  rationale: यह किसी आधिकारिक उद्देश्य से भेजे गए प्रतिनिधि-समूह को दर्शाता है। आधुनिक हिंदी में ‘प्रतिनिधिमंडल’ स्पष्ट और स्वाभाविक है।
- source_word: ὀπίσω αὐτοῦ
  choice: उसके पीछे
  rationale: संदर्भ में इसका अर्थ उसके चले जाने के बाद उसके पीछे प्रतिनिधिमंडल भेजना है। ‘उसके पीछे’ मूल स्थानिक अभिव्यक्ति को बनाए रखता है।
- source_word: Οὐ θέλομεν
  choice: हम नहीं चाहते
  rationale: θέλω इच्छा या चाह को व्यक्त करता है; यह आधुनिक हिंदी में सीधा और स्वाभाविक समतुल्य है।
- source_word: τοῦτον
  choice: यह आदमी
  rationale: संकेतवाचक शब्द में दूरी और कुछ तिरस्कार का भाव है। ‘यह आदमी’ उस लहजे को रखता है, पर अनावश्यक रूप से अधिक अपमानजनक नहीं बनता।
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: हम पर राज करे
  rationale: ‘राज करे’ βασιλεύω के राजकीय अर्थ को स्पष्ट रखता है और हिंदी में ‘हम पर शासन करे’ की अपेक्षा राजत्व की छवि को अधिक ठीक से बनाए रखता है।
theological_decisions:
- issue: दृष्टांत में राजनीतिक और राजकीय अर्थ
  choice: ‘हम पर राज करे’ के द्वारा राजत्व की स्पष्ट भाषा बनाए रखी गई।
  alternative: ‘हम पर शासन करे’
  rationale: दृष्टांत की छवि राजत्व पर निर्भर है। सामान्य अधिकार-सूचक भाषा चुनने से यह विशेष अर्थ मंद पड़ जाता; साथ ही अनुवाद पाठ से आगे बढ़कर कोई अलंकारिक पहचान निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘नागरिक’ राजनीतिक संदर्भ को और ‘यह आदमी’ वक्ताओं के दूरीपूर्ण, अस्वीकारात्मक लहजे को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
