  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: hi
  text: फिर दूसरा आया और कहने लगा, ‘स्वामी, आपकी मीना ने पाँच मीनाएँ कमाई हैं।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: दूसरे सेवक
  rationale: यूनानी में शाब्दिक अर्थ ‘दूसरा’ है; दृष्टांत के संदर्भ में अभिप्रेत व्यक्ति सेवक है, इसलिए स्वाभाविक हिन्दी के लिए ‘सेवक’ स्पष्ट किया गया।
- source_word: μνᾶ
  choice: मीना
  rationale: यह प्राचीन मुद्रा/भार की इकाई है; ऐतिहासिक विशिष्टता बनाए रखने के लिए लिप्यंतरण किया गया।
- source_word: κύριε
  choice: हे स्वामी
  rationale: यहाँ सेवक अपने अधिकारी को संबोधित करता है; ‘स्वामी’ प्रभुत्व और सम्मान दोनों को व्यक्त करता है, बिना इसे अनिवार्यतः दिव्य उपाधि बनाने के।
- source_word: ἐποίησεν
  choice: कमाई हैं
  rationale: शाब्दिक ‘बनाई/उत्पन्न की’ की अपेक्षा धन के बढ़ने के संदर्भ में ‘कमाई’ सहज हिन्दी है; कर्ता व्याकरणतः स्वामी की मीना ही बनी रहती है।
theological_decisions:
- issue: κύριε को दिव्य उपाधि मानना या मानवीय संबोधन
  choice: हे स्वामी
  alternative: हे प्रभु
  rationale: दृष्टांत के प्रत्यक्ष कथानक में यह सेवक द्वारा अपने अधिकारी के लिए सम्मानसूचक संबोधन है। ‘स्वामी’ इस स्तर को सुरक्षित रखता है और पाठ से परे जाकर प्रत्यक्ष दिव्य पहचान आरोपित नहीं करता।
- issue: लाभ का श्रेय सेवक को या दी गई मीना को
  choice: आपकी एक मीना ने पाँच मीनाएँ कमाई हैं
  alternative: मैंने आपकी एक मीना से पाँच मीनाएँ कमाई हैं
  rationale: मूल पाठ में ‘आपकी मीना’ कर्ता है। उसी असामान्य अभिव्यक्ति और उसके निहित धार्मिक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सहज और सम्मानपूर्ण मानक हिन्दी। संवाद में ‘आपकी’ और ‘हे स्वामी’ से सेवक का आदर व्यक्त होता है। संख्या के साथ ‘एक मीना’ मूल के एकवचन को स्पष्ट करती है; ‘पाँच मीनाएँ’ हिन्दी बहुवचन के अनुसार है।
