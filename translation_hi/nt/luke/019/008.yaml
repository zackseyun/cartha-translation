id: LUK.19.8
reference: Luke 19:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: hi
  text: तब जक्कई ने खड़े होकर प्रभु से कहा, “देखिए, प्रभु! मैं अपनी संपत्ति का आधा भाग गरीबों को देता हूँ; और यदि मैंने किसी से कुछ भी जबरन वसूला है[a], तो मैं उसका चार गुना लौटा देता हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यदि मैंने किसी को किसी बात में ठगा है।’ यूनानी क्रिया जबरन वसूली, शोषण या धोखाधड़ी का अर्थ दे सकती है; कभी-कभी इसमें झूठे आरोप का सहारा लेना भी शामिल होता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी की वर्तमानकालिक क्रियाओं को तत्काल संकल्प के अर्थ में ‘मैं दूँगा’ और ‘मैं लौटाऊँगा’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: खड़े होकर
  rationale: यह ἵστημι का अकर्तृवाच्य रूप होते हुए भी यहाँ अकर्मक अर्थ में प्रयुक्त है। ‘खड़े होकर’ कथानक की क्रिया को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: κύριον / κύριε
  choice: प्रभु
  rationale: यह संबोधन सम्मानसूचक अर्थ रख सकता है, पर यीशु के लिए प्रयुक्त उपाधि की व्यापक अर्थ-सम्भावना बनाए रखने हेतु ‘प्रभु’ उपयुक्त है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह सामने वाले का ध्यान विशेष रूप से खींचता है। आधुनिक सम्मानपूर्ण हिन्दी में ‘देखिए’ इसका स्वाभाविक रूप है।
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: अपनी संपत्ति का आधा भाग
  rationale: ὑπάρχοντα यहाँ किसी व्यक्ति की संपत्ति या माल-असबाब को सूचित करता है; हिन्दी में यह पदबंध अंशवाचक अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς πτωχοῖς
  choice: गरीबों को
  rationale: πτωχός के संज्ञात्मक बहुवचन का सीधा और प्रचलित हिन्दी रूप।
- source_word: δίδωμι
  choice: देता हूँ
  rationale: यूनानी में वर्तमानकालिक निर्देशार्थक रूप है। हिन्दी का सामान्य वर्तमान इसकी रूपगत अस्पष्टता को यथासम्भव बनाए रखता है; इसे मुख्य पाठ में केवल भविष्यकालीन संकल्प नहीं बनाया गया।
- source_word: ἐσυκοφάντησα
  choice: जबरन वसूला है
  rationale: συκοφαντέω में दबाव, पद के दुरुपयोग या झूठे आरोप के द्वारा धन ऐंठने अथवा धोखा देने का भाव हो सकता है। प्रधान कर-वसूलने वाले के प्रसंग में ‘जबरन वसूला’ सटीक है, जबकि पादटिप्पणी दूसरी सम्भावना बताती है।
- source_word: ἀποδίδωμι
  choice: लौटा देता हूँ
  rationale: क्रिया का अर्थ वापस देना या चुकाना है। ‘लौटा देता हूँ’ प्रतिपूर्ति के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τετραπλοῦν
  choice: चार गुना
  rationale: यह चौगुनी प्रतिपूर्ति को सूचित करने वाला सटीक और सहज हिन्दी रूप है।
theological_decisions:
- issue: δίδωμι और ἀποδίδωμι के वर्तमानकालिक रूपों का आशय
  choice: 'मुख्य पाठ में सामान्य वर्तमान: ‘देता हूँ ... लौटा देता हूँ’'
  alternative: 'तात्कालिक संकल्प के रूप में: ‘दूँगा ... लौटाऊँगा’'
  rationale: यूनानी में दोनों क्रियाएँ वर्तमानकालिक निर्देशार्थक हैं। सामान्य वर्तमान रखने से यह तनाव बना रहता है कि जक्कई अपने वर्तमान आचरण का वर्णन कर रहा है, तत्काल संकल्प व्यक्त कर रहा है, या दोनों। इससे उसके कथन को पूर्व धार्मिकता अथवा उसी क्षण हुए पश्चात्ताप का निर्णायक प्रमाण मानने वाला निष्कर्ष पाठ में नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रभु’ उपाधि की सम्मानसूचक और मसीही दोनों अर्थ-सम्भावनाएँ बनाए रखता है। वर्तमानकालिक क्रियाओं की व्याख्यात्मक अनिश्चितता मुख्य पाठ और पादटिप्पणी में सुरक्षित है।
