id: LUK.19.39
reference: Luke 19:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: hi
  text: और भीड़ में से कुछ फ़रीसियों ने उससे कहा, “गुरु, अपने चेलों को डाँटिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: कुछ फ़रीसियों
  rationale: τινες के साथ संबंधकारक बहुवचन एक अनिश्चित उपसमूह बताता है; ‘कुछ फ़रीसियों’ स्वाभाविक हिन्दी में उसी आंशिक संदर्भ को व्यक्त करता है।
- source_word: ἀπὸ τοῦ ὄχλου
  choice: भीड़ में से
  rationale: ἀπό यहाँ स्रोत या उस समूह के भीतर से बोलनेवालों के उभरने का भाव देता है; ‘भीड़ में से’ आधुनिक हिन्दी में स्थान और स्रोत दोनों को सहज रूप से दर्शाता है।
- source_word: εἶπαν πρὸς αὐτόν
  choice: उससे कहा
  rationale: यह सामान्य कथात्मक वाक्यांश है; ‘उससे कहा’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन में διδάσκαλος शिक्षक के लिए आदरसूचक पद है। ‘गुरु’ हिन्दी में स्वाभाविक सम्बोधन है और यहाँ अनावश्यक रूप से कोई अधिक प्रबल मसीही दावा नहीं जोड़ता।
- source_word: ἐπιτίμησον
  choice: डाँटिए
  rationale: आज्ञार्थक क्रिया सीधे मौखिक ताड़ना की माँग करती है। आदरसूचक ‘डाँटिए’ इसकी शक्ति को साधारण पाठक के लिए स्वाभाविक हिन्दी में रखता है; ‘चुप कराइए’ परिणाम को जोड़ देता।
- source_word: τοῖς μαθηταῖς σου
  choice: अपने चेलों को
  rationale: μαθητής शिक्षक से जुड़े शिष्य को दर्शाता है। यीशु के अनुयायियों के लिए ‘चेले’ प्रचलित, स्पष्ट और संबंधपरक अर्थ को सुरक्षित रखने वाला शब्द है।
theological_decisions:
- issue: Διδάσκαλε द्वारा यीशु को सम्बोधन
  choice: गुरु
  alternative: शिक्षक
  rationale: यह पद यहाँ मूलतः शिक्षा देनेवाले व्यक्ति का आदरसूचक सम्बोधन है, कोई स्पष्ट उच्च मसीही उपाधि नहीं। ‘गुरु’ हिन्दी संवाद में स्वाभाविक है और पाठ से अधिक धर्मवैचारिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सरल, गरिमापूर्ण और मौखिक संवाद में स्वाभाविक रखा गया है। यीशु के लिए आदरसूचक आज्ञार्थक ‘डाँटिए’ प्रयुक्त है।
