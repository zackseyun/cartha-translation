source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: hi
  text: उसने उससे कहा, “तेरे ही मुँह से मैं तेरा न्याय करूँगा[a], दुष्ट गुलाम[b]! तू जानता था कि मैं कठोर मनुष्य हूँ—जो मैंने नहीं रखा, उसे लेता हूँ[c], और जो मैंने नहीं बोया, उसे काटता हूँ[d]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे अपने शब्दों के आधार पर मैं तेरा न्याय करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “दुष्ट दास।” यूनानी शब्द δοῦλος स्वामी के अधीन बँधे हुए व्यक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: “रखा” का अर्थ यहाँ “जमा किया” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: कुछ अनुवादों में, “जहाँ मैंने नहीं बोया, वहाँ काटता हूँ”; यहाँ यूनानी अधिक शाब्दिक रूप से, “जो मैंने नहीं बोया, उसे काटता हूँ” है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: तेरे अपने मुँह से निकली बात के आधार पर ही
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि न्याय उसी व्यक्ति के कथन के आधार पर होगा। ‘ही’ उसके अपने कथन पर बल देता है।
- source_word: κρίνω
  choice: मैं तेरा न्याय करूँगा
  rationale: भविष्यत्काल को सुरक्षित रखता है और ‘दोषी ठहराऊँगा’ की अपेक्षा क्रिया के व्यापक अर्थ को बनाए रखता है।
- source_word: πονηρὲ
  choice: दुष्ट
  rationale: सीधे संबोधन में नैतिक निंदा को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: δοῦλε
  choice: दास
  rationale: स्वामी के अधीन बँधे हुए व्यक्ति का भाव रखता है और हिन्दी बाइबलीय कथन में स्वाभाविक है; ‘गुलाम’ अधिक स्पष्ट सामाजिक विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: ᾔδεις
  choice: तू जानता था
  rationale: οἶδα के इस भूतकालीन रूप और स्वामी द्वारा दास के अपने कथन को उसके विरुद्ध प्रयोग करने की अलंकारिकता को बनाए रखता है।
- source_word: αὐστηρός
  choice: कठोर
  rationale: यहाँ आरोपित सख्ती और कठोर व्यवहार का नकारात्मक भाव देता है; ‘सख्त’ अपेक्षाकृत बोलचाल का और कभी-कभी तटस्थ हो सकता है।
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: जो मैंने नहीं रखा, उसे उठा लेता हूँ
  rationale: ‘रखने’ और ‘उठा लेने’ की समानांतर छवि को सुरक्षित रखता है, जबकि वित्तीय संदर्भ में ‘जमा करना’ संभव अर्थ बना रहता है।
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: जो मैंने नहीं बोया, उसे काटता हूँ
  rationale: कृषि-रूपक और यूनानी के कर्मवाचक ‘जो/उसे’ को सुरक्षित रखता है; इसे स्थानवाचक ‘जहाँ’ में नहीं बदलता।
theological_decisions:
- issue: δοῦλος को स्वामी-दास संबंध वाली दृष्टांत-कथा में कैसे व्यक्त किया जाए
  choice: दास
  alternative: गुलाम
  rationale: ‘दास’ हिन्दी में स्वामी के अधीन व्यक्ति का अर्थ देता है और इस शैली में सहज है, पर आधुनिक पाठक के लिए बँधी हुई सामाजिक स्थिति स्पष्ट करने हेतु ‘गुलाम’ को पादटिप्पणी में रखा गया है।
- issue: क्या कठोर मनुष्य होने का कथन स्वामी के चरित्र की निर्विवाद पुष्टि है
  choice: यूनानी की सीधी अलंकारिक कथन-रचना को बनाए रखा गया है
  alternative: ‘तेरे कहने के अनुसार, मैं कठोर मनुष्य हूँ’ अथवा ‘यदि तू जानता था कि मैं कठोर मनुष्य हूँ’
  rationale: पाठ स्वामी को दास के अपने कथन को उसी के विरुद्ध दोहराते हुए प्रस्तुत करता है। अनुवाद न तो इस चरित्र-वर्णन को अलग से सत्य घोषित करता है, न व्याख्यात्मक शर्त जोड़ता है।
- issue: ὃ οὐκ ἔσπειρα में संबंधवाचक सर्वनाम का अर्थ
  choice: जो मैंने नहीं बोया
  alternative: जहाँ मैंने नहीं बोया
  rationale: SBLGNT में ὃ नपुंसकलिंग कर्मकारक है, इसलिए ‘जो’ मूल पाठ की व्याकरणिक समानांतरता को अधिक निकटता से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। स्वामी-दास संबंध और तीखे सीधे संबोधन के कारण ‘तू/तेरा’ रखा गया है; यह यहाँ सामाजिक अधीनता व्यक्त करता है, अनुवादक की ओर से अनादर नहीं। वाक्य के अंत का प्रश्नचिह्न मूल की अलंकारिक प्रश्न-रचना को सुरक्षित रखता है।
