  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘यीशु कौन हैं’ में हिन्दी की आदरसूचक क्रिया प्रयुक्त है, जबकि जक्कई के लिए एकवचन पुरुषवाचक रूप रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘कद छोटा था’ संदर्भगत अर्थ को स्पष्टतः व्यक्त करता है।
