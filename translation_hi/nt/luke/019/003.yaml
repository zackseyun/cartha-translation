  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: hi
  text: वह यह देखने की कोशिश कर रहा था कि यीशु कौन हैं, पर भीड़ के कारण वह उन्हें देख नहीं पा रहा था, क्योंकि उसका कद छोटा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτει
  choice: कोशिश कर रहा था
  rationale: अपूर्ण काल जारी प्रयास को व्यक्त करता है; यह केवल इच्छा नहीं, यीशु को देखने के सक्रिय प्रयत्न को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἰδεῖν
  choice: देखने
  rationale: यह प्रयास का लक्ष्य बताने वाला क्रियारूप है; ‘देखने’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: τίς ἐστιν
  choice: कि यीशु कौन हैं
  rationale: यूनानी पद पहचान अथवा व्यक्ति के स्वरूप, दोनों की ओर संकेत कर सकता है। यह अनुवाद मूल की सहज अस्पष्टता को अनावश्यक व्याख्या के बिना बनाए रखता है।
- source_word: οὐκ ἠδύνατο
  choice: देख नहीं पा रहा था
  rationale: संदर्भ में असमर्थता विशेष रूप से यीशु को देखने से जुड़ी है; हिन्दी में यह अभिव्यक्ति जारी बाधा को स्वाभाविक ढंग से बताती है।
- source_word: ἀπὸ τοῦ ὄχλου
  choice: भीड़ के कारण
  rationale: यहाँ ἀπό बाधा उत्पन्न करने वाले कारण को व्यक्त करता है। ‘भीड़ के कारण’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उसके न देख पाने का कारण प्रस्तुत करता है।
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: उसका कद छोटा था
  rationale: ἡλικία आयु या शारीरिक डील-कद का बोध करा सकता है, पर भीड़ से दृश्य रुकने का संदर्भ स्पष्टतः ऊँचाई की ओर संकेत करता है। ‘कद छोटा था’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
theological_decisions: []
