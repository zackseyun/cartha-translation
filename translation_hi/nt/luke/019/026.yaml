  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ कि जिस किसी के पास है, उसे दिया जाएगा[a]; लेकिन जिसके पास नहीं है, उससे वह भी ले लिया जाएगा जो उसके पास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अधिक दिया जाएगा।” यूनानी पाठ में “अधिक” शब्द स्पष्ट रूप से नहीं है, हालाँकि प्रसंग में बढ़ोतरी का भाव समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष कथन की भूमिका को स्वाभाविक आधुनिक हिन्दी में रखता है और कथन के बल को बनाए रखता है।
- source_word: παντὶ τῷ ἔχοντι
  choice: हर उस व्यक्ति को जिसके पास है
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त और παντί की सार्वत्रिकता को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है; वस्तु को अनिर्दिष्ट ही रहने देता है।
- source_word: δοθήσεται
  choice: और दिया जाएगा
  rationale: यूनानी भविष्यत् कर्मवाच्य में ‘अधिक’ स्पष्ट रूप से नहीं है। ‘और’ प्रसंग में निहित वृद्धि का संकेत देता है, पर ‘अधिक’ को मूल पाठ का प्रत्यक्ष शब्द बनाकर प्रस्तुत नहीं करता।
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: लेकिन जिसके पास नहीं है, उससे
  rationale: δέ के विरोधसूचक बल और ἀπό द्वारा व्यक्त वंचित किए जाने के स्रोत को सहज हिन्दी क्रम में रखता है।
- source_word: καὶ ὃ ἔχει
  choice: वह भी ... जो उसके पास है
  rationale: यहाँ καί के बलवर्धक अर्थ को ‘भी’ से व्यक्त किया गया है और संबंधवाचक उपवाक्य का अर्थ सुरक्षित रखा गया है।
- source_word: ἀρθήσεται
  choice: ले लिया जाएगा
  rationale: αἴρω के भविष्यत् कर्मवाच्य को यहाँ हटाने अथवा वंचित करने के अर्थ में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: कथन को वृद्धि और हानि के सामान्य सिद्धान्त के रूप में समझने की सीमा
  choice: कहावत को संक्षिप्त और खुला रखा गया है; उद्धार, योग्यता, पूर्वनियति अथवा किसी विशिष्ट धार्मिक तंत्र की व्याख्या नहीं जोड़ी गई।
  alternative: इसे केवल भण्डारीपन के विषय में या स्पष्ट रूप से व्यापक राज्य-सिद्धान्त के रूप में अनूदित करना।
  rationale: पद स्वयं उस धार्मिक प्रक्रिया को निर्दिष्ट नहीं करता जिसके द्वारा देना या ले लेना होता है। प्रसंग अनुप्रयोग को दिशा देता है, पर अनुवाद को तनाव और सामान्य कथन-रूप बनाए रखना चाहिए।
- issue: δοθήσεται में निहित वृद्धि
  choice: मुख्य पाठ में ‘और दिया जाएगा’ रखा गया और ‘अधिक दिया जाएगा’ को पाद-टिप्पणी में विकल्प बताया गया।
  alternative: मुख्य पाठ में ‘और अधिक दिया जाएगा’ रखना।
  rationale: यूनानी में ‘अधिक’ के लिए अलग शब्द नहीं है, यद्यपि प्रसंग में वृद्धि का भाव व्यापक रूप से समझा जाता है। यह विन्यास मूल की औपचारिक अनिश्चितता और हिन्दी की बोधगम्यता दोनों को संतुलित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘हर उस व्यक्ति’ से सामान्य और समावेशी संदर्भ रखा गया है, जबकि ‘उसके’ हिन्दी में स्वाभाविक एकवचन संदर्भ देता है।
