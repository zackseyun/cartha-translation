source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: hi
  text: उसने उत्तर में कहा, “मैं तुमसे कहता हूँ, यदि ये चुप हो जाएँ[a], तो पत्थर पुकार उठेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मौन हो जाएँ” अथवा “चुप रहें।”
    reason: σιωπάω यहाँ बोलना बंद करने या चुप रहने—दोनों निकट भावों में समझा जा सकता है।
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: उसने उत्तर में कहा
  rationale: कृदन्त ἀποκριθεὶς के प्रत्युत्तर देने के भाव और मुख्य क्रिया εἶπεν के ‘कहा’ अर्थ—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यीशु के कथन की सीधी और अधिकारपूर्ण भूमिका को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: οὗτοι
  choice: ये
  rationale: संदर्भ में उपस्थित शिष्यों अथवा जयजयकार करने वालों की ओर संकेत करता है, पर मुख्य पाठ में उनकी पहचान स्पष्ट करके अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: σιωπήσουσιν
  choice: चुप हो जाएँ
  rationale: भविष्यत् रूप को शर्तवाचक हिन्दी में स्वाभाविक ढंग से व्यक्त करते हुए वर्तमान बोलने/जयजयकार करने से मौन हो जाने का भाव देता है।
- source_word: οἱ λίθοι
  choice: पत्थर
  rationale: λίθοι का सीधा अर्थ रखता है; हिन्दी में जातिवाचक बहुवचन के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: κράξουσιν
  choice: पुकार उठेंगे
  rationale: κράζω की ऊँची, अचानक निकलने वाली पुकार को सजीव और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पत्थरों के पुकार उठने को रूपक, अतिशयोक्ति या चमत्कार के रूप में स्पष्ट करना
  choice: ‘पत्थर पुकार उठेंगे’ की प्रत्यक्ष छवि को बिना व्याख्यात्मक योग्यता के बनाए रखा गया।
  alternative: ‘सृष्टि स्वयं परमेश्वर की स्तुति करेगी’ जैसे अर्थ-स्पष्टीकरण को मुख्य पाठ में जोड़ना।
  rationale: यूनानी पाठ इस तीखी छवि की व्याख्या नहीं करता; शाब्दिक रूप बनाए रखने से उसका आलंकारिक, भविष्यसूचक अथवा चमत्कारिक आशय खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। ‘उत्तर में कहा’ यूनानी की दोहरी क्रियात्मक रचना को बिना अस्वाभाविक पुनरुक्ति के दर्शाता है।
