  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: hi
  text: और उसने पास खड़े लोगों से कहा, “इससे वह मीना ले लो और उसे उस व्यक्ति को दे दो, जिसके पास दस मीना हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: पास खड़े लोगों से
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत उन लोगों को दर्शाता है जो वहीं निकट उपस्थित थे। यह अनुवाद दृश्य की ठोसता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: इससे ... ले लो
  rationale: αἴρω के साथ ἀπό अलग कर लेने का भाव देता है। हिन्दी में ‘इससे ... ले लो’ आदेश और स्रोत—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν μνᾶν
  choice: वह मीना
  rationale: ‘मीना’ प्राचीन मुद्रा-इकाई का लिप्यंतरण है; निश्चित उपपद को ‘वह’ से व्यक्त किया गया है, क्योंकि यह पहले उल्लिखित मीना है।
- source_word: δότε
  choice: दे दो
  rationale: आज्ञार्थक बहुवचन साधारण हस्तांतरण का निर्देश देता है; ‘दे दो’ आधुनिक हिन्दी में सीधा और स्वाभाविक आदेश है।
- source_word: τῷ ... ἔχοντι
  choice: उसे ... जिसके पास
  rationale: संज्ञा के रूप में प्रयुक्त एकवचन कृदंत को बिना अनावश्यक रूप से ‘आदमी’ जोड़ने के स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τὰς δέκα μνᾶς
  choice: दस मीना
  rationale: यह पहले बताए गए दस मीना को सूचित करता है। हिन्दी में संख्या के बाद मुद्रा-इकाई का रूप अपरिवर्तित रखना सहज है।
theological_decisions:
- issue: μνᾶ को मुद्रा-इकाई के रूप में प्रस्तुत करना
  choice: मीना
  alternative: पौंड
  rationale: ‘मीना’ यूनानी प्राचीन मुद्रा-इकाई और ऐतिहासिक परिवेश को सुरक्षित रखता है; ‘पौंड’ आधुनिक ब्रिटिश मुद्रा या भार की इकाई का भ्रामक संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक-आज्ञार्थक रूप। ‘तब’ यूनानी καί को प्रसंगानुकूल कथात्मक संयोजक के रूप में व्यक्त करता है।
