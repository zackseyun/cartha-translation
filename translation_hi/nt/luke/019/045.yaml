  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। ‘वहाँ’ हिन्दी में ‘बेचनेवालों’ के स्थान को स्पष्ट और स्वाभाविक बनाता है; इसका संकेत ἱερόν के भीतर निहित है।
