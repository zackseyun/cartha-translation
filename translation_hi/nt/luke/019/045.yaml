lexical_decisions:
- source_word: εἰσελθὼν
  choice: प्रवेश करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया दिखाता है; ‘प्रवेश करके’ हिन्दी में स्वाभाविक रूप से क्रम को व्यक्त करता है, बिना अनावश्यक विस्तार के।
- source_word: ἱερὸν
  choice: मन्दिर
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में संक्षिप्त और प्रचलित ‘मन्दिर’ रखा गया है तथा स्थानगत सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: ἤρξατο
  choice: लगा
  rationale: अनन्त क्रिया के साथ ἄρχομαι किसी काम के आरम्भ को दर्शाता है; ‘निकालने लगा’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: ἐκβάλλειν
  choice: बाहर निकालने
  rationale: ἐκβάλλω दृढ़तापूर्वक हटाने का भाव रखता है। ‘बाहर निकालने’ स्पष्ट और स्वाभाविक है तथा अनावश्यक रूप से हिंसक तरीका निर्दिष्ट नहीं करता।
- source_word: πωλοῦντας
  choice: बेचनेवालों
  rationale: वर्तमान कृदन्त उन लोगों को दर्शाता है जो बेचने के काम में लगे थे। यह अनुवाद वस्तुओं का उल्लेख नहीं जोड़ता, क्योंकि इस पद में वे निर्दिष्ट नहीं हैं।
theological_decisions:
- issue: यीशु की मन्दिर-संबंधी कार्रवाई में ἱερόν का क्षेत्र
  choice: मुख्य पाठ में ‘मन्दिर’, जिसका आशय व्यापक मन्दिर-परिसर है
  alternative: ‘मन्दिर का आँगन’, ‘मन्दिर-परिसर’, या ‘पवित्रस्थान’
  rationale: यूनानी ἱερόν सामान्यतः पूरे मन्दिर-परिसर को बताता है, न कि विशेष रूप से भीतरी पवित्रस्थान (ναός) को। ‘मन्दिर’ पठनीयता बनाए रखता है और पादटिप्पणी अधिक सटीक स्थानगत अर्थ स्पष्ट करती है।
