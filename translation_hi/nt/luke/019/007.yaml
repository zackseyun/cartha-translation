  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: hi
  text: यह देखकर वे सब बड़बड़ाने लगे और कहने लगे, “वह एक पापी मनुष्य के यहाँ ठहरने[a] गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अतिथि होने”
    reason: καταλῦσαι में ठहरने के साथ किसी के यहाँ अतिथि होने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ἰδόντες
  choice: यह देखकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में कालवाचक रूप दिया गया है। ‘यह’ पिछले प्रसंग में यीशु के जक्कई के साथ जाने की ओर संकेत करता है।
- source_word: πάντες
  choice: वे सब
  rationale: भीड़ की व्यापक प्रतिक्रिया पर यूनानी पाठ के बल को बनाए रखता है।
- source_word: διεγόγγυζον
  choice: कुड़कुड़ाने लगे
  rationale: अपूर्ण काल की आरम्भिक और जारी प्रतिक्रिया को व्यक्त करता है तथा असंतोष भरी धीमी शिकायत का भाव रखता है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: कुड़कुड़ाहट की विषय-वस्तु प्रस्तुत करने वाला स्वाभाविक हिन्दी संयोजन है।
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: एक पापी मनुष्य के यहाँ
  rationale: παρά के यहाँ निवास या आतिथ्य के भाव को ‘के यहाँ’ से व्यक्त किया गया है, और विशेषण ἁμαρτωλῷ तथा स्पष्टतः पुरुषवाचक ἀνδρί दोनों को सुरक्षित रखा गया है।
- source_word: εἰσῆλθεν
  choice: गया है
  rationale: प्रत्यक्ष कथन में पूर्ण हुई और वर्तमान में प्रासंगिक क्रिया को हिन्दी के पूर्ण रूप से व्यक्त किया गया है; ‘के यहाँ’ घर में प्रवेश का प्रसंग स्पष्ट करता है।
- source_word: καταλῦσαι
  choice: ठहरने
  rationale: यहाँ क्रिया का अर्थ किसी के यहाँ अतिथि के रूप में टिकना या निवास करना है; ‘ठहरने’ सामान्य और स्पष्ट आधुनिक हिन्दी है।
theological_decisions:
- issue: भीड़ द्वारा जक्कई का चरित्रांकन
  choice: एक पापी मनुष्य
  alternative: एक पापी
  rationale: यूनानी पाठ में केवल संज्ञा रूप में प्रयुक्त विशेषण नहीं, बल्कि विशेषण और ἀνήρ (‘मनुष्य/पुरुष’) दोनों हैं। चुना हुआ रूप भीड़ के तिरस्कारपूर्ण आकलन को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कुड़कुड़ाने लगे’ भीड़ की असंतोष भरी सामूहिक प्रतिक्रिया को सामान्य पाठक के लिए स्पष्ट करता है; ‘के यहाँ’ हिन्दी में आतिथ्य और निवास दोनों का स्वाभाविक संकेत देता है।
