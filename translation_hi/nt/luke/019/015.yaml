id: LUK.19.15
reference: Luke 19:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: hi
  text: जब वह राजसत्ता पाकर लौटा, तो उसने आदेश दिया कि जिन दासों को उसने धन दिया था, उन्हें उसके पास बुलाया जाए, ताकि वह जान सके कि उन्होंने व्यापार करके क्या कमाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने क्या कारोबार किया था”; यूनानी क्रिया व्यापार या कारोबार करने और उससे निकले परिणाम—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: जब ... तो
  rationale: लूका के यूनानी आख्यान-सूत्र को हिन्दी में अलग से ‘ऐसा हुआ’ कहने के बजाय स्वाभाविक कालवाचक वाक्य-संरचना में व्यक्त किया गया है।
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: जब वह ... लौटा
  rationale: ἐν के साथ articular infinitive यहाँ कालवाचक है; यह आधुनिक हिन्दी में उसका सहज रूप है।
- source_word: λαβόντα τὴν βασιλείαν
  choice: राजसत्ता पाकर
  rationale: कृदंत मुख्य आदेश से पहले पूरी हुई क्रिया बताता है। प्रसंग में βασιλεία किसी भूभाग से अधिक राजा का पद और शासनाधिकार है।
- source_word: φωνηθῆναι αὐτῷ
  choice: उन्हें उसके पास बुलाया जाए
  rationale: कर्मवाच्य infinitive को आदेश के आशय के अनुरूप स्वाभाविक हिन्दी में रखा गया है।
- source_word: δούλους
  choice: दासों
  rationale: यह शब्द स्वामी के अधीन बंधी सामाजिक स्थिति दर्शाता है; ‘दास’ उस वास्तविकता को ‘सेवक’ से अधिक स्पष्ट रखते हुए हिन्दी बाइबलीय गद्य में समझने योग्य है।
- source_word: δεδώκει τὸ ἀργύριον
  choice: धन दिया था
  rationale: pluperfect की पूर्वकालिकता ‘दिया था’ से सुरक्षित रहती है; ἀργύριον यहाँ सामान्यतः सौंपे गए धन को सूचित करता है।
- source_word: ἵνα γνοῖ
  choice: ताकि वह जान सके
  rationale: उद्देश्यवाचक उपवाक्य का स्पष्ट और आधुनिक हिन्दी रूप।
- source_word: τί διεπραγματεύσαντο
  choice: उन्होंने व्यापार करके क्या कमाया था
  rationale: क्रिया व्यापार करने और उससे निकले परिणाम दोनों को समेट सकती है; मुख्य पाठ प्रसंगानुकूल लाभ का भाव देता है और पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: दृष्टांत के आर्थिक-सामाजिक संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: कुलीन व्यक्ति का इन लोगों पर अधिकार और अपने धन का हिसाब माँगना अधीनस्थ, बंधी स्थिति को प्रमुख बनाता है। ‘दास’ सामाजिक संबंध को बनाए रखता है, पर उससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: βασιλεία का प्रसंगगत अर्थ
  choice: राजसत्ता
  alternative: राज्य
  rationale: दृष्टांत में व्यक्ति किसी भूभाग को प्राप्त करके नहीं, राजा बनने का अधिकार लेकर लौटता है; इसलिए ‘राजसत्ता’ राजनीतिक आशय को अधिक ठीक व्यक्त करती है।
- issue: διεπραγματεύσαντο में गतिविधि और परिणाम का संबंध
  choice: व्यापार करके क्या कमाया था
  alternative: उन्होंने क्या कारोबार किया था
  rationale: आगे के हिसाब में अर्जित बढ़ोतरी प्रमुख है, फिर भी यूनानी क्रिया केवल लाभ की राशि तक सीमित नहीं है; इस व्यापकता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज आख्यान-शैली। ‘राजसत्ता’ से राजनीतिक संदर्भ स्पष्ट किया गया है; ‘दास’ मूल सामाजिक संबंध को बनाए रखता है।
