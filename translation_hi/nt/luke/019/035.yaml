  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: hi
  text: वे उसे यीशु के पास लाए और अपने वस्त्र उस बछेड़े[a] पर डालकर यीशु को उस पर बैठा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बछेड़ा’ संदर्भ के अनुसार गधे के जवान बच्चे को सूचित करता है; आसपास का संदर्भ देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ἤγαγον
  choice: लाए
  rationale: यहाँ क्रिया उस बछेड़े को यीशु के पास ले आने को व्यक्त करती है; ‘लाए’ स्वाभाविक और संदर्भानुकूल है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यूनानी सर्वनाम पुल्लिंग है और पिछले संदर्भ के बछेड़े की ओर संकेत करता है। हिन्दी ‘उसे’ सर्वनाम को बनाए रखते हुए स्वाभाविक रहता है।
- source_word: αὐτῶν τὰ ἱμάτια
  choice: अपने कपड़े
  rationale: ἱμάτια बाहरी वस्त्रों को दर्शा सकता है। सामान्य पाठक के लिए ‘अपने कपड़े’ सहज है और αὐτῶν का संबंध कर्ताओं से स्पष्ट करता है।
- source_word: πῶλον
  choice: बछेड़ा
  rationale: πῶλος किसी कम उम्र के सवारी-पशु के बच्चे को दर्शाता है; निकटवर्ती संदर्भ में यह गधी का बच्चा है। ‘बछेड़ा’ मूल शब्द की अपेक्षाकृत व्यापक अभिव्यक्ति बनाए रखता है, जबकि टिप्पणी संदर्भ स्पष्ट करती है।
- source_word: ἐπιρίψαντες
  choice: डालकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘डालकर’ हिन्दी में क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπεβίβασαν
  choice: बैठा दिया
  rationale: क्रिया का अर्थ किसी को किसी सवारी पर चढ़ाना या बैठाना है। ‘बैठा दिया’ उसका कारणवाचक भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
