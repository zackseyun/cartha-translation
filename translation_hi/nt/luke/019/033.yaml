base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: hi
  text: जब वे गदहे के बच्चे को खोल रहे थे, तो उसके मालिकों[a] ने उनसे कहा, “तुम गदहे के बच्चे को क्यों खोल रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके स्वामियों ने।” यूनानी में यहाँ κύριος (‘प्रभु/स्वामी’) का बहुवचन है, पर इस प्रसंग में उससे गदहे के मानवीय मालिक अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων ... λύετε
  choice: खोल रहे थे ... खोल रहे हो
  rationale: दोनों रूप एक ही यूनानी क्रिया λύω से हैं। पशु को बंधन से मुक्त करने के ठोस प्रसंग में ‘खोलना’ स्वाभाविक है और मूल की शब्द-पुनरावृत्ति भी बनाए रखता है।
- source_word: δὲ
  choice: तो
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। ‘तो’ समकालिक परिस्थिति और मुख्य कथन को स्वाभाविक हिन्दी में जोड़ता है, बिना अनावश्यक विरोध का भाव दिए।
- source_word: αὐτῶν
  choice: वे
  rationale: सर्वनाम पिछले प्रसंग में भेजे गए दो चेलों की ओर संकेत करता है। ‘वे’ मूल की सर्वनामिक अभिव्यक्ति को बनाए रखता है।
- source_word: πῶλον
  choice: बछेड़ा
  rationale: πῶλος किसी कम उम्र के पशु को दर्शाता है; पिछले प्रसंग से यह गदहे का बच्चा है। ‘बछेड़ा’ संक्षिप्त और स्वाभाविक है तथा मूल शब्द की अपेक्षाकृत व्यापकता को पूरी तरह समाप्त नहीं करता।
- source_word: εἶπαν
  choice: कहा
  rationale: λέγω का सीधा अर्थ ‘कहना’ है। कथन प्रश्न के रूप में है, फिर भी ‘कहा’ मूल क्रिया के निकट रहता है।
- source_word: οἱ κύριοι αὐτοῦ
  choice: उसके मालिकों
  rationale: κύριοι यहाँ किसी ईश्वरीय उपाधि के रूप में नहीं, बल्कि पशु पर अधिकार रखने वाले मनुष्यों के लिए प्रयुक्त है। बहुवचन ‘मालिकों’ अर्थ और व्याकरण दोनों को स्पष्ट रखता है।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: वाणी की दिशा बताने वाले πρὸς αὐτούς का स्वाभाविक हिन्दी रूप ‘उनसे’ है।
- source_word: Τί
  choice: क्यों
  rationale: इस प्रश्नवाचक प्रयोग में τί कार्य का कारण पूछता है; आधुनिक हिन्दी में ‘क्यों’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: गैर-धर्मवैज्ञानिक, मानवीय स्वामित्व के प्रसंग में κύριοι का अनुवाद
  choice: मालिकों
  alternative: स्वामियों
  rationale: यद्यपि κύριος अन्य प्रसंगों में ‘प्रभु’ या ‘स्वामी’ हो सकता है, यहाँ बहुवचन पद बछेड़े के मानवीय स्वामियों को दर्शाता है। ‘मालिकों’ से अनुचित धर्मवैज्ञानिक संकेत पैदा नहीं होता; विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खोलना’ की पुनरावृत्ति यूनानी मूल की पुनरावृत्ति को दर्शाती है। बहुवचन ‘मालिकों’ को स्पष्ट रखा गया है और κύριοι का शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
