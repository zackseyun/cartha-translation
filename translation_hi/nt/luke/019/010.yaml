    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: आया
  rationale: अओरिस्ट सूचक क्रिया को कथा के इस सार-वाक्य में सरल भूतकाल से व्यक्त किया गया है; इससे यीशु के आने और उनके उद्देश्य का भाव बना रहता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की आत्म-पदवी है और दानिय्येल से जुड़ी इसकी प्रतिध्वनि महत्त्वपूर्ण है; इसलिए इसे व्याख्यात्मक रूप से बदलने के बजाय पदवी के रूप में रखा गया है।
- source_word: ζητῆσαι
  choice: ढूँढ़ने
  rationale: अओरिस्ट infinitive यहाँ आने का उद्देश्य बताता है। ‘ढूँढ़ने’ जानबूझकर खोज करने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: σῶσαι
  choice: बचाने
  rationale: यह शब्द केवल शारीरिक रक्षा तक सीमित नहीं है, बल्कि लूका में उद्धार का व्यापक भाव रखता है। ‘बचाने’ साधारण पाठक के लिए स्वाभाविक है और प्रसंग में इसका उद्धार-संबंधी अर्थ खुला रखता है।
- source_word: τὸ ἀπολωλός
  choice: खोए हुओं
  rationale: यूनानी में यह सप्रत्यय पूर्ण कृदंत नपुंसकलिंग एकवचन है, पर सामान्य या समूहवाचक अर्थ दे सकता है। हिन्दी का बहुवचन ‘खोए हुओं’ यीशु के व्यापक मिशन को स्वाभाविक ढंग से व्यक्त करता है; मूल एकवचन की जानकारी पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: τὸ ἀπολωλός का दायरा और अभिप्राय
  choice: खोए हुओं
  alternative: जो खो गया था, उसे
  rationale: प्रसंग में यह बात तुरन्त जक्कई पर लागू होती है, फिर भी यीशु के व्यापक मिशन का कथन भी है। मुख्य पाठ में समूहवाचक अर्थ रखा गया है और पाद-टिप्पणी मूल यूनानी के एकवचन तथा वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और जनसुलभ शैली रखी गई है। ‘मनुष्य का पुत्र’ स्थापित पदवी के रूप में सुरक्षित है; ‘बचाने’ सामान्य भाषा में उद्धार के व्यापक भाव को व्यक्त करता है।
