lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ मूल यूनानी में निहित सरल समन्वय को बिना अतिरिक्त कालगत या विरोधात्मक भाव जोड़े बनाए रखता है।
- source_word: εἶπαν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: अओरिस्ट क्रिया को कथात्मक सामान्य भूतकाल में व्यक्त किया गया है, और αὐτῷ को प्रसंग में पुरुष पात्र के लिए स्वाभाविक हिन्दी ‘उससे’ के रूप में अनूदित किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος का यह संबोधन अधिकार और आदर दोनों व्यक्त करता है। ‘प्रभु’ उसके प्रमुख शाब्दिक मूल्य और कथा में अधिकार की प्रतिध्वनि को बनाए रखता है; ‘स्वामी’ या ‘महोदय’ भी प्रसंगानुसार संभव हैं।
- source_word: ἔχει
  choice: उसके पास … हैं
  rationale: वर्तमान काल में अधिकार या स्वामित्व का साधारण अर्थ है। हिन्दी की स्वाभाविक अधिकार-सूचक रचना अपनाई गई है और ‘पहले से’ जैसा अतिरिक्त बल नहीं जोड़ा गया।
- source_word: δέκα
  choice: दस
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: μνᾶς
  choice: मीना
  rationale: प्राचीन मुद्रा की सांस्कृतिक विशिष्टता बनाए रखने के लिए नाम का लिप्यंतरण किया गया है; आधुनिक मुद्रा-संज्ञा से बदलना भ्रामक हो सकता है।
theological_decisions:
- issue: दृष्टान्त के भीतर सीधे संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी; महोदय
  rationale: यहाँ संबोधन दृष्टान्त के अधिकारी पात्र के प्रति आदरसूचक हो सकता है और आवश्यक रूप से स्पष्ट मसीही अंगीकार नहीं है। ‘प्रभु’ मूल शब्द के अधिकार-संबंधी अर्थ और व्यापक कथात्मक प्रतिध्वनि को सुरक्षित रखता है, जबकि पाद-टिप्पणी अन्य संभव अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य के अंत का दीर्घ डैश मूल पाठ में बात के आगे बढ़ने या बाधित होने की खुली प्रकृति को बनाए रखता है। सभी पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
