  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘चेला’ सामान्य पाठकों के लिए परिचित बाइबलीय शब्द है। वाक्य-विन्यास को हिन्दी में सहज बनाया गया है, जबकि मूल के कथात्मक सूत्र और स्थान-नाम की संक्षिप्तता सुरक्षित रखी गई है।
