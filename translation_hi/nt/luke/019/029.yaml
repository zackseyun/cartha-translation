review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal approach, the two locations, the sending of two disciples, and the non-explicit possessive in ‘चेलों में से दो।’ However, ‘जो जैतून कहलाता है’ is not an adequate Hindi designation for the mountain and obscures the syntactic relation of τὸ ὄρος τὸ καλούμενον Ἐλαιῶν. The expanded place-name is required in the main text for intelligibility.
  naturalness: The present word order is understandable, but ‘तब ऐसा हुआ कि’ after the temporal clause is unnecessarily stiff. Beginning with ‘और ऐसा हुआ कि जब...’ preserves the Lukan narrative formula while reading more naturally. ‘जैतून का पहाड़’ is established, clear modern Hindi usage.
  terminology: ‘चेलों’ is appropriate in this register. ‘जैतून का पहाड़’ accurately supplies in idiomatic Hindi the noun governed by the compressed Greek genitive Ἐλαιῶν, without implying a theological interpretation. Established transliterations ‘बैतफगे’ and ‘बैतनिय्याह’ are retained.
  issues:
  - severity: medium
    issue: The phrase ‘उस पहाड़ की ओर पहुँचा जो जैतून कहलाता है’ is syntactically and semantically unnatural in Hindi.
    rationale: It can suggest that the mountain itself is called simply ‘Olives,’ whereas the Greek construction designates it as the mount called ‘Olives’; Hindi needs the expanded designation ‘जैतून का पहाड़’ for a clear and faithful rendering.
  - severity: low
    issue: The narrative formula is placed as ‘तब ऐसा हुआ कि’ following the temporal clause.
    rationale: This is not incorrect, but fronting it as ‘और ऐसा हुआ कि जब...’ better reflects Καὶ ἐγένετο ὡς and improves narrative flow.
  revised_text: और ऐसा हुआ कि जब वह बैतफगे और बैतनिय्याह के निकट, उस पहाड़ की ओर आया जिसे जैतून का पहाड़[a] कहा जाता है, तो उसने चेलों में से दो को भेजा।
