  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह बैतफगे और बैतनिय्याह के निकट, उस पहाड़ की ओर आया जिसे जैतून का पहाड़[a] कहा जाता है, तो उसने चेलों में से दो को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘जैतूनों’; अधिक मुहावरेदार रूप में, ‘जैतून का पहाड़।’
    reason: यूनानी Ἐλαιῶν संक्षिप्त जनन-बहुवचन रूप में है; हिन्दी में स्थान-नाम को स्पष्ट और स्वाभाविक बनाने के लिए ‘जैतून का पहाड़’ किया गया है।
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: तब ऐसा हुआ कि
  rationale: लूका के कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में रखा गया है; यह घटना के अगले चरण को जोड़ता है और अत्यधिक पुरातन शैली से बचता है।
- source_word: ὡς
  choice: जब
  rationale: यहाँ ὡς कालवाचक उपवाक्य आरम्भ करता है। हिन्दी में ‘जब’ निकट आने की परिस्थिति को सहज ढंग से व्यक्त करता है।
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: बैतफगे और बैतनिय्याह के निकट ... पहुँचा
  rationale: ἐγγίζω का अर्थ किसी स्थान के निकट आना है। εἰς के दिशात्मक भाव को ‘पहुँचा’ में समाहित करके स्थान-नामों के साथ स्वाभाविक हिन्दी बनाई गई है।
- source_word: πρὸς τὸ ὄρος
  choice: उस पहाड़ की ओर
  rationale: πρός का दिशात्मक/स्थान-संबंधी भाव ‘की ओर’ से व्यक्त होता है; ὄρος के लिए सामान्य आधुनिक हिन्दी ‘पहाड़’ चुना गया है।
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: जो जैतून कहलाता है
  rationale: यूनानी की संक्षिप्त अभिव्यक्ति, शाब्दिक रूप से ‘जो जैतूनों का कहलाता है’, मुख्य पाठ में यथासंभव पारदर्शी रखी गई है; प्रचलित विस्तृत नाम पादटिप्पणी में दिया गया है।
- source_word: ἀπέστειλεν
  choice: उसने ... भेजा
  rationale: सरल कथात्मक भूतकाल के लिए सामान्य और सटीक हिन्दी क्रिया।
- source_word: δύο τῶν μαθητῶν
  choice: चेलों में से दो को
  rationale: विभाजक संबंधकारक का स्वाभाविक हिन्दी रूप है। यूनानी में ‘अपने’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
