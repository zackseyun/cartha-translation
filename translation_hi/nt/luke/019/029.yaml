- from: जब वह बैतफगे और बैतनिय्याह के निकट, उस पहाड़ की ओर पहुँचा जो जैतून[a] कहलाता है, तब ऐसा हुआ कि उसने चेलों में से दो को भेजा।
  to: और ऐसा हुआ कि जब वह बैतफगे और बैतनिय्याह के निकट, उस पहाड़ की ओर आया जिसे जैतून का पहाड़[a] कहा जाता है, तो उसने चेलों में से दो को भेजा।
  rationale: संशोधन मूल यूनानी के कथात्मक सूत्र, कालवाचक संबंध, स्थानों की निकटता/दिशा, और ‘चेलों में से दो’ को बनाए रखता है। केवल स्थान-नाम की अभिव्यक्ति को आधुनिक मानक हिन्दी में व्याकरणिक और स्पष्ट बनाया गया है तथा पादटिप्पणी में संक्षिप्त यूनानी रूप का संकेत सुरक्षित रखा गया है।
