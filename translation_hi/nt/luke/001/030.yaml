  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: hi
  text: और स्वर्गदूत ने उससे कहा, “मत डरो, मरियम, क्योंकि तुमने परमेश्वर की कृपा-दृष्टि[a] पाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुग्रह।” यूनानी शब्द χάρις का अर्थ “कृपा,” “अनुग्रह” या “अनुकूलता” हो सकता है। यहाँ εὑρίσκω χάριν παρὰ τῷ θεῷ का अर्थ परमेश्वर की दृष्टि में अनुकूलता या कृपा पाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: प्रत्यक्ष कथन के परिचय में λέγω के कथात्मक एओरिस्ट का यह स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: लूका के बाल्य-वृत्तांत में यह एक स्वर्गीय प्राणी है; इसलिए सामान्य ‘दूत’ की अपेक्षा ‘स्वर्गदूत’ सन्दर्भ को अधिक स्पष्ट करता है।
- source_word: Μὴ φοβοῦ
  choice: मत डरो
  rationale: μή के साथ वर्तमान आज्ञार्थक यहाँ निषेध व्यक्त करता है। ‘मत डरो’ सहज आधुनिक हिन्दी है और एकवचन सम्बोधन को सम्मानजनक ‘तुम’ के रूप में व्यक्त करता है।
- source_word: Μαριάμ
  choice: मरियम
  rationale: यह हिन्दी बाइबल परम्परा और आधुनिक प्रयोग में प्रचलित नाम-रूप है।
- source_word: εὗρες
  choice: तुमने … पाई है
  rationale: यूनानी एओरिस्ट के परिणामस्वरूप वर्तमान स्थिति यहाँ महत्त्वपूर्ण है; हिन्दी पूर्ण वर्तमान उस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: χάριν
  choice: कृपा
  rationale: χάρις यहाँ ‘किसी की कृपा पाना’ मुहावरे में ईश्वर की अनुकूल दृष्टि या पक्ष को दर्शाता है। ‘कृपा’ सहज हिन्दी है और मूल शब्द की ‘अनुग्रह/कृपा’ अर्थ-सीमा को खुला रखता है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर की
  rationale: εὑρίσκω χάριν παρά + सम्प्रदान का अर्थ ‘परमेश्वर की दृष्टि में/परमेश्वर के यहाँ कृपा पाना’ है। हिन्दी में ‘परमेश्वर की कृपा पाना’ उसी सम्बन्ध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मरियम के सन्दर्भ में χάριν का अनुवाद
  choice: कृपा
  alternative: अनुग्रह; परमेश्वर की दृष्टि में कृपापात्र होना
  rationale: यह वाक्यांश परम्परागत रूप से किसी की कृपा या अनुकूलता पाने का अर्थ देता है। ‘कृपा’ मूल के सकारात्मक ईश्वरीय भाव को बनाए रखता है, पर पद में बाद की किसी विशिष्ट मरियम-विषयक धर्मसैद्धान्तिक धारणा को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मत डरो’ तथा ‘तुमने’ मरियम को एकवचन में सम्मानजनक और स्वाभाविक सम्बोधन देते हैं; अत्यधिक अनौपचारिक ‘तू’ से बचा गया है। आरम्भिक ‘और’ यूनानी καί तथा पिछले कथन से कथात्मक निरन्तरता को बनाए रखता है।
