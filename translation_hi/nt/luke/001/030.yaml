    issue: The phrase ‘परमेश्वर की कृपा पाई है’ may obscure the sense of ‘found favor with God.’
    rationale: In Hindi it can mean simply that Mary has received God’s grace. The Greek idiom εὗρες χάριν παρὰ τῷ θεῷ specifically expresses favorable standing in God’s sight. Adding ‘दृष्टि’ clarifies this relation without overtranslating.
