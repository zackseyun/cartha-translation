  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: hi
  text: ताकि वह अंधकार और मृत्यु की छाया[a] में बैठे लोगों पर प्रकाश डाले और हमारे पाँवों को शांति के मार्ग पर ले चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृत्यु की गहरी छाया”; कुछ विद्वान इस वाक्यांश को अधिक व्यापक अर्थ में “घोर अंधकार” समझते हैं, पर यूनानी पाठ में “मृत्यु” शब्द स्पष्ट रूप से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: प्रकाश चमके
  rationale: यह अभिव्यक्ति अंधकार में प्रकाश के प्रकट होकर चमकने का बिंब बनाए रखती है और आधुनिक हिन्दी में सहज है।
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: अंधकार ... में बैठे लोग
  rationale: καθημένοις के ‘बैठे’ होने के सजीव बिंब और यशायाह-संबंधी प्रतिध्वनि को बनाए रखा गया है; इसे ‘रहने वाले’ कहकर सपाट नहीं किया गया।
- source_word: σκότει
  choice: अंधकार
  rationale: यह मूल शब्द के प्रत्यक्ष और रूपक, दोनों संभव अर्थों को बिना अधिक व्याख्या किए सुरक्षित रखता है।
- source_word: σκιᾷ θανάτου
  choice: मृत्यु की छाया
  rationale: यूनानी में ‘मृत्यु’ स्पष्ट रूप से उपस्थित है। यह चयन पारंपरिक बाइबलीय बिंब और मूल वाक्यांश की गंभीरता को बनाए रखता है।
- source_word: τοῦ κατευθῦναι
  choice: ले चले
  rationale: पाँव और मार्ग के साथ यह स्वाभाविक हिन्दी है तथा दिशा दिखाने और आगे बढ़ाने का भाव व्यक्त करती है; ‘सीधा करे’ अनावश्यक रूप से शाब्दिक होता।
- source_word: τοὺς πόδας ἡμῶν
  choice: हमारे पाँवों
  rationale: शारीरिक और काव्यात्मक रूपक को ‘हमें’ कहकर अमूर्त करने के बजाय ज्यों का त्यों रखा गया है।
- source_word: εἰς ὁδὸν εἰρήνης
  choice: शांति के मार्ग पर
  rationale: ὁδός के मार्ग-वाले रूपक को सुरक्षित रखते हुए लक्ष्य की ओर मार्गदर्शन का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: अंधकार, मृत्यु की छाया, पाँव और मार्ग के रूपकों की व्याख्या
  choice: इन बिंबों को मुख्य पाठ में बिना खोले बनाए रखना
  alternative: इन्हें आत्मिक अज्ञान, मृत्यु के संकट या शांति लाने वाले आचरण के रूप में स्पष्ट कर देना
  rationale: पद काव्यात्मक और धर्मग्रंथीय संकेतों से युक्त है। किसी एक धर्मवैज्ञानिक अर्थ को आरोपित करने के बजाय मूल की अर्थगत व्यापकता और तनाव सुरक्षित रखा गया है।
- issue: दो उद्देश्यसूचक infinitive का संबंध
  choice: दोनों को ‘ताकि ... और ...’ के समानांतर उद्देश्य के रूप में प्रस्तुत करना
  alternative: दूसरे खंड को पहले का परिणाम मानकर ‘जिससे’ या ‘इस प्रकार’ जोड़ना
  rationale: यूनानी में ἐπιφᾶναι और τοῦ κατευθῦναι निकटवर्ती उद्देश्यसूचक संरचनाएँ हैं; हिन्दी में समानांतर रचना उनके संबंध को बिना अधिक निश्चित किए व्यक्त करती है।
