source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: hi
  text: और वह एलिय्याह की आत्मा और सामर्थ्य में उसके आगे-आगे चलेगा[c], ताकि वह पिताओं के हृदय बच्चों की ओर फेरे[a], और आज्ञा न माननेवालों को धर्मियों की समझ की ओर मोड़े[b], और प्रभु के लिए ऐसी प्रजा तैयार करे जो तत्पर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्चों के प्रति।” यह वाक्यांश मलाकी 4:6 की प्रतिध्वनि है और परिवारों में मेल-मिलाप बहाल होने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मियों की मनोवृत्ति की ओर,” अथवा “धर्मियों की विवेकशीलता में।”
    reason: lexical_alternative
  - marker: c
    text: “एलिय्याह की आत्मा और सामर्थ्य में” का आशय एलिय्याह-सदृश भविष्यद्वक्ता-सेवा और सामर्थ्य है; यह आवश्यक रूप से स्वयं एलिय्याह के शाब्दिक रूप से लौटने की बात नहीं कहता।
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: उसके आगे चलेगा
  rationale: यह अनुवाद किसी के आगे जाकर उसके आगमन या कार्य के लिए मार्ग तैयार करने का भाव देता है, साथ ही αὐτοῦ के संदर्भ को मूल पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: एलिय्याह की आत्मा और सामर्थ्य में
  rationale: यह यूनानी संरचना के निकट रहते हुए एलिय्याह-सदृश भविष्यद्वाणी की सेवकाई और सामर्थ्य का भाव व्यक्त करता है; यह यूहन्ना को स्वयं एलिय्याह नहीं ठहराता।
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: पिताओं के हृदय बच्चों की ओर फेर दे
  rationale: यह उद्देश्यसूचक क्रिया और मलाकी 4:6 की प्रतिध्वनि को बनाए रखता है। ‘की ओर’ ἐπί के दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπειθεῖς
  choice: आज्ञा न माननेवालों
  rationale: यह शब्द हठपूर्वक न मानने और उसके फलस्वरूप अवज्ञा करने, दोनों भावों को समेटता है; ‘अविश्वासियों’ की अपेक्षा यह नैतिक समानांतर के लिए अधिक उपयुक्त है।
- source_word: ἐν φρονήσει δικαίων
  choice: धर्मियों की समझ की ओर
  rationale: φρόνησις यहाँ व्यावहारिक और नैतिक समझ-बूझ का बोध देता है। ‘की ओर’ मुड़ने की दिशात्मक संरचना को हिन्दी में स्पष्ट करता है, जबकि ‘समझ’ ‘मानसिकता’ की तुलना में अधिक सहज है।
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: प्रभु के लिए ऐसी प्रजा तैयार करे जो तत्पर हो
  rationale: ‘तैयार करे’ उद्देश्यसूचक ἑτοιμάσαι को और ‘जो तत्पर हो’ पूर्ण कर्मवाच्य कृदंत κατεσκευασμένον से व्यक्त तैयारी की परिणामी अवस्था को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: एलिय्याह की आत्मा और सामर्थ्य का आशय
  choice: आनेवाला सेवक एलिय्याह की आत्मा और सामर्थ्य में कार्य करेगा।
  alternative: इसे स्वयं एलिय्याह के शाब्दिक रूप से लौट आने के रूप में पढ़ना।
  rationale: यूनानी पाठ व्यक्ति की समानता या पहचान नहीं, बल्कि ‘आत्मा और सामर्थ्य में’ सेवकाई का वर्णन करता है। इस प्रकार मलाकी की पृष्ठभूमि बनी रहती है, पर पाठ से आगे कोई सिद्धान्त नहीं जोड़ा जाता।
- issue: ‘उसके’ और ‘प्रभु’ का संदर्भ
  choice: मूल पाठ के समान ‘उसके’ और ‘प्रभु’ ही रखा गया है।
  alternative: मुख्य पाठ में ‘मसीह’, ‘यीशु’ या कोई और स्पष्ट नाम जोड़ना।
  rationale: आस-पास का प्रसंग संदर्भ समझने में सहायता करता है, पर इस पद का यूनानी पाठ सर्वनाम और उपाधि का ही प्रयोग करता है। अनुवाद उस अंतर्निहित संबंध और उसकी कुछ हद तक बनी अस्पष्टता को सुरक्षित रखता है।
- issue: ἐν φρονήσει δικαίων में संबंध
  choice: अवज्ञाकारी धर्मियों की समझ की ओर मोड़े जाते हैं।
  alternative: ‘धर्मियों की समझ में’ या ‘धर्मियों की विवेकशीलता के अनुसार’।
  rationale: ἐν का रूप स्थानीय या साधनात्मक समझा जा सकता है, किंतु ἐπιστρέψαι के साथ यहाँ दिशात्मक परिणाम स्वाभाविक है। पादटिप्पणी अन्य व्याकरण-संगत संभावनाएँ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हृदय’, ‘धर्मी’, ‘प्रजा’ और ‘प्रभु’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। मूल यूनानी के दो उद्देश्यसूचक खंडों को ‘ताकि’ के अंतर्गत समानांतर रखा गया है, और सर्वनाम का संदर्भ अनावश्यक विस्तार से नहीं सुलझाया गया।
