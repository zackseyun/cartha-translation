id: LUK.1.7
reference: Luke 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: hi
  text: उनकी कोई संतान न थी, क्योंकि इलीशिबा बाँझ थी, और उन दोनों की उम्र बहुत ढल चुकी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे अपने दिनों में आगे बढ़ चुके थे।”
    reason: मूल यूनानी के उम्र संबंधी मुहावरे को दिखाने के लिए।
lexical_decisions:
- source_word: τέκνον
  choice: संतान
  rationale: एकवचन τέκνον को सामूहिक अर्थ दिए बिना स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; यहाँ ‘बच्चा’ की तुलना में ‘संतान’ अधिक उपयुक्त है।
- source_word: καθότι
  choice: क्योंकि
  rationale: यह उनकी संतानहीनता का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक कारणसूचक शब्द है।
- source_word: στεῖρα
  choice: बाँझ
  rationale: यह शब्द केवल संतान न होने के परिणाम के बजाय गर्भधारण न कर सकने की अवस्था बताता है। ‘बाँझ’ संक्षिप्त, परिचित और मूल के विशिष्ट अर्थ के निकट है।
- source_word: ἀμφότεροι
  choice: उन दोनों
  rationale: यह स्पष्ट करता है कि उम्र के विषय में कही गई बात जकरयाह और इलीशिबा दोनों पर लागू होती है।
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: उम्र बहुत ढल चुकी थी
  rationale: यूनानी मुहावरे का अर्थ वृद्धावस्था तक पहुँच जाना है। यह हिन्दी अभिव्यक्ति सम्मानपूर्ण, सहज और मुहावरेदार है; ‘बहुत’ अवस्था की प्रगति को व्यक्त करता है।
- source_word: οὐκ ἦν αὐτοῖς
  choice: उनकी कोई ... न थी
  rationale: यूनानी में शाब्दिक रूप से ‘उनके लिए नहीं थी’ है, जिसे हिन्दी में स्वाभाविक अधिकारसूचक रचना से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘संतान’ और ‘उम्र ढल चुकी थी’ मूल अर्थ तथा कथन के सम्मानपूर्ण स्वर के बीच संतुलन रखते हैं।
