  verdict: revise
  source_fidelity: The draft accurately conveys the exclamatory question, the unexpected privilege expressed by πόθεν μοι τοῦτο, and the full phrase ‘the mother of my Lord.’ However, ‘कैसे मिला’ better reflects the Greek idiom’s sense of astonished ‘how has this come to me?’ than ‘क्यों मिला,’ which can sound like a request for a reason or cause.
  naturalness: The wording is otherwise fluent, dignified modern Hindi. ‘मेरे पास आएँ’ is natural, and the honorific plural is an acceptable Hindi register choice without changing the singular referent in Greek.
  terminology: ‘मेरे प्रभु की माता’ preserves μήτηρ and κύριος faithfully and appropriately. ‘सम्मान’ is a restrained contextual clarification of the implied privilege, consistent with the English audit trail.
  issues:
  - severity: low
    issue: ‘क्यों मिला’ can imply a causal ‘why’ more strongly than the Greek idiom.
    rationale: πόθεν (‘from where’) in this exclamation expresses wonder at how such a privilege has come to Elizabeth. ‘कैसे मिला’ is more idiomatic Hindi for that nuance while retaining the question.
