  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: hi
  text: और मुझे यह सम्मान कैसे मिला[a] कि मेरे प्रभु की माता मेरे पास आएँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और यह मुझे कहाँ से मिला...?” यह मुहावरा ऐसा सम्मान मिलने पर विस्मय प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν
  choice: क्यों
  rationale: शाब्दिक अर्थ ‘कहाँ से’ है, पर इस विस्मयपूर्ण मुहावरे में यह पूछता है कि ऐसा सम्मान मुझे कैसे या क्यों मिला। स्वाभाविक हिन्दी में ‘क्यों’ इस भाव को स्पष्ट करता है।
- source_word: μοι τοῦτο
  choice: मुझे यह सम्मान मिला
  rationale: यूनानी में शाब्दिक रूप से ‘यह मुझे कहाँ से’ है। ‘सम्मान’ प्रसंग में निहित अनुग्रह या सौभाग्य को व्यक्त करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: ἵνα ἔλθῃ
  choice: कि ... आएँ
  rationale: ἵνα यहाँ उस आश्चर्यजनक घटना की विषय-वस्तु बताता है। आदरसूचक बहुवचन ‘आएँ’ आधुनिक हिन्दी में माता के प्रति सम्मान के कारण स्वाभाविक है।
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: मेरे प्रभु की माता
  rationale: यह पदबंध सीधा अनुवादित है; ‘प्रभु’ κύριος की श्रद्धापूर्ण और मसीह-संबंधी गरिमा बनाए रखता है, बिना बाद की धर्मवैज्ञानिक व्याख्या जोड़े।
- source_word: πρὸς ἐμέ
  choice: मेरे पास
  rationale: πρός के साथ कर्मकारक यहाँ इलीशिबा की ओर आने को दर्शाता है। ‘मेरे पास’ स्वाभाविक हिन्दी है और ‘मेरे घर’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: τοῦ κυρίου μου में κυρίου का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: ‘प्रभु’ उपाधि की श्रद्धापूर्ण तथा मसीह-संबंधी शक्ति को बनाए रखता है; ‘स्वामी’ इस प्रसंग में उसे कम स्पष्ट कर सकता है।
- issue: πόθεν μοι τοῦτο मुहावरे का अनुवाद
  choice: मुझे यह सम्मान क्यों मिला
  alternative: यह मुझे कहाँ से हुआ
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी द्वारा इलीशिबा का विस्मय और अयोग्यता-बोध व्यक्त किया गया है; अधिक शाब्दिक और अस्पष्ट संरचना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, सहज और मौखिक पाठ के योग्य। ‘आएँ’ आदरसूचक प्रयोग है और यूनानी एकवचन क्रिया का अर्थ नहीं बदलता।
