source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: hi
  text: और देखो, तुम उस दिन तक मौन रहोगे और बोल नहीं सकोगे जिस दिन ये बातें घटित होंगी, क्योंकि तुमने मेरी बातों पर विश्वास नहीं किया, जो अपने नियत समय पर पूरी होंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह स्वर्गदूत की घोषणा में ध्यान खींचने वाले उद्गार की शक्ति बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: तुम चुप रहोगे और ... बोल नहीं सकोगे
  rationale: दोनों यूनानी अभिव्यक्तियों को बनाए रखकर यह स्पष्ट करता है कि यह स्वेच्छा से मौन रहना नहीं, बल्कि बोलने में असमर्थ होना है।
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: उस दिन तक ... जब ये बातें पूरी होंगी
  rationale: यह समय-सीमा को सहज हिन्दी में व्यक्त करता है; यहाँ घटनाओं के घटित होने में स्वर्गदूत की कही बातों की सिद्धि भी निहित है।
- source_word: ἀνθ’ ὧν
  choice: क्योंकि
  rationale: संदर्भ में यह जकरयाह के मौन होने का कारण बताता है।
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: तुमने मेरी बातों पर विश्वास नहीं किया
  rationale: πιστεύω के साथ λόγοι के यहाँ अर्थ बोले गए संदेश को सत्य न मानना है; 'बातों पर विश्वास' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πληρωθήσονται
  choice: पूरी होंगी
  rationale: यह कर्मवाच्य भाव और कही गई बातों के सिद्ध होने का अर्थ सुरक्षित रखता है।
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: अपने नियत समय पर
  rationale: καιρός केवल कालक्रम नहीं, बल्कि उपयुक्त या निर्धारित समय को सूचित करता है।
theological_decisions:
- issue: जकरयाह के दंड का स्वरूप
  choice: बोलने की थोपी गई असमर्थता
  alternative: स्वेच्छा से चुप रहना
  rationale: '''चुप रहोगे'' के साथ ''बोल नहीं सकोगे'' स्पष्ट करता है कि यह केवल मौन रहने की आज्ञा नहीं, बल्कि असमर्थता है।'
- issue: वचनों की पूर्ति का समय
  choice: वे अपने नियत समय पर पूरी होंगी
  alternative: वे अपने उचित समय पर पूरी होंगी
  rationale: अनुवाद καιρός में निहित उपयुक्त/निर्धारित समय का भाव रखता है, पर यह स्पष्ट नहीं करता कि समय किस प्रकार नियत किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'देखो' ध्यानाकर्षक ἰδοὺ को सुरक्षित रखता है। लम्बे यूनानी वाक्य को स्पष्ट हिन्दी के लिए दो वाक्यों में बाँटा गया है, जबकि संबंधवाचक उपवाक्य का आशय बना रहता है।
