base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: hi
  text: और देखो, तुम गर्भ धारण करोगी और एक पुत्र को जन्म दोगी, और उसका नाम यीशु रखोगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले यूनानी अव्यय की संवादगत शक्ति और घोषणा की गंभीरता बनाए रखता है; आधुनिक हिन्दी में यह स्वाभाविक भी है।
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: तुम गर्भवती होगी
  rationale: इस प्रसंग में पूरी यूनानी अभिव्यक्ति गर्भधारण करने को दर्शाती है। हिन्दी में ‘गर्भवती होगी’ स्पष्ट और स्वाभाविक है तथा ‘अपने गर्भ में गर्भधारण करोगी’ जैसी अनावश्यक पुनरुक्ति से बचती है।
- source_word: τέξῃ υἱόν
  choice: एक पुत्र को जन्म दोगी
  rationale: यह τίκτω के जन्म देने के अर्थ और υἱός के लिंग-विशिष्ट अर्थ, दोनों को सहज आधुनिक हिन्दी में ठीक-ठीक व्यक्त करता है।
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: तुम उसका नाम … रखोगी
  rationale: यूनानी नामकरण-सूत्र का अर्थ आधुनिक हिन्दी में ‘नाम रखना’ से स्वाभाविक रूप से व्यक्त होता है। भविष्यकाल को बनाए रखा गया है; इसे आज्ञार्थक ‘नाम रखना’ नहीं बनाया गया।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: नए नियम के इस नाम का यह मानक और व्यापक रूप से पहचाना जाने वाला हिन्दी लिप्यंतरण है।
theological_decisions:
- issue: καλέσεις τὸ ὄνομα αὐτοῦ के नामकरण-सूत्र का रूप
  choice: तुम उसका नाम यीशु रखोगी
  alternative: तुम उसका नाम यीशु पुकारोगी
  rationale: मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी चुनी गई है। ‘नाम पुकारोगी’ यूनानी संरचना के अधिक निकट है, पर हिन्दी में नामकरण के आशय को कम सहजता से व्यक्त करता है। किसी धर्मसैद्धांतिक अर्थ को जोड़ा या हटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। ‘और देखो’ घोषणा के ध्यानाकर्षक तथा गंभीर स्वर को बनाए रखता है। स्त्रीलिंग भविष्यकालीन क्रियाएँ मरियम से किए जा रहे सीधे संबोधन को स्पष्ट करती हैं।
