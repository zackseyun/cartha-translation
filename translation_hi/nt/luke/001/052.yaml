  text: उसने सामर्थियों को सिंहासनों से उतार दिया और दीनों को ऊँचा उठाया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शासकों को।’ यूनानी शब्द व्यापक रूप से शक्तिशाली लोगों को भी सूचित कर सकता है, यद्यपि ‘सिंहासनों से’ शासकों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नम्र लोगों को।’ यूनानी शब्द विनम्र लोगों और/या नीची सामाजिक स्थिति वाले लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: उतार दिया
  rationale: यह यूनानी क्रिया ऊँचे स्थान या पद से नीचे किए जाने को व्यक्त करती है। ‘सिंहासनों से उतार दिया’ स्वाभाविक हिन्दी में निर्णायक, पूर्ण कार्य को दिखाता है, पर हिंसक विनाश या केवल औपचारिक पदच्युति का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: δυνάστας
  choice: सामर्थियों
  rationale: शब्द शक्तिशाली व्यक्तियों अथवा शासकों को सूचित कर सकता है। ‘सिंहासनों से’ राजनीतिक शासन की ओर संकेत करता है, फिर भी ‘सामर्थियों’ मूल शब्द की व्यापकता बनाए रखता है; ‘शासकों’ वैकल्पिक अनुवाद है।
- source_word: ἀπὸ θρόνων
  choice: सिंहासनों से
  rationale: यह ठोस राजकीय बिंब को सीधे बनाए रखता है और मूल में निहित न होने वाला ‘उनके’ नहीं जोड़ता।
- source_word: ὕψωσεν
  choice: ऊँचा उठाया
  rationale: यह क्रिया ऊपर उठाने या प्रतिष्ठित करने को व्यक्त करती है। यह वर्तमान हिन्दी में स्वाभाविक है और सामाजिक तथा धर्मवैचारिक दोनों अर्थ-छायाएँ बनाए रखती है।
- source_word: ταπεινούς
  choice: दीनों
  rationale: यह विशेषण विनम्र लोगों और/या नीची सामाजिक दशा वाले लोगों को सूचित कर सकता है। ‘दीनों’ मरियम के गीत में उलटाव के सामाजिक अर्थ को स्पष्ट रखते हुए दोनों आयामों के लिए जगह छोड़ता है; ‘नम्र लोगों’ वैकल्पिक है।
theological_decisions:
- issue: मरियम के गीत में यूनानी एओरिस्ट क्रियाओं का काल और पक्ष
  choice: हिन्दी में पूर्ण निर्णायक कार्य को ‘उतार दिया ... ऊँचा उठाया’ से व्यक्त करना
  alternative: ‘उतारता है ... ऊँचा उठाता है’ जैसे सामान्य वर्तमान काल में अनुवाद करना
  rationale: मूल की एओरिस्ट क्रियाएँ परमेश्वर के निर्णायक कार्यों को स्तुति के काव्यात्मक संदर्भ में रखती हैं। हिन्दी का सामान्य भूतकाल पूर्णता को स्वाभाविक ढंग से व्यक्त करता है, जबकि यह तय नहीं करता कि कथन केवल ऐतिहासिक, भविष्यसूचक पूर्ण, या स्तुति में निश्चित माने गए कार्य के रूप में समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली। ‘सामर्थियों’ और ‘दीनों’ से मूल की व्यापकता तथा सामाजिक-आध्यात्मिक उलटाव सुरक्षित रखा गया है।
