source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: hi
  text: हमारे परमेश्वर की कोमल करुणा के कारण, इसी करुणा से ऊपर से आने वाला प्रभात[a] हमारी सुधि लेने आएगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भोर’ या ‘उदय’। यूनानी शब्द पुराने नियम के यूनानी अनुवाद में मसीही उपाधि ‘अंकुर’ की प्रतिध्वनि भी दे सकता है।
    reason: ἀνατολή के प्रकाश-सन्दर्भित वैकल्पिक अर्थ तथा यूनानी पुराने नियम में सम्भावित मसीहाई ‘अंकुर’ शब्द-प्रतिध्वनि को सुरक्षित रखना।
lexical_decisions:
- source_word: διὰ
  choice: के कारण
  rationale: यहाँ कर्मकारक के साथ διά कारण या आधार बताता है; ‘के कारण’ इस अर्थ को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: σπλάγχνα ἐλέους
  choice: कोमल करुणा
  rationale: शाब्दिक रूप से यह भीतर के अंगों से जुड़ा मुहावरा है, जो हृदय की गहरी दया व्यक्त करता है। ‘कोमल करुणा’ उस भावात्मक गहराई को बिना अस्वाभाविक शाब्दिकता के व्यक्त करती है।
- source_word: θεοῦ ἡμῶν
  choice: हमारे परमेश्वर की
  rationale: सम्बन्धकारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν οἷς
  choice: इसी करुणा से
  rationale: सम्बन्धवाचक वाक्यांश परमेश्वर की करुणा को उस माध्यम या क्षेत्र के रूप में प्रस्तुत करता है जिसमें यह कृपापूर्ण आगमन होता है। हिन्दी में संज्ञा को दोहराने से सम्बन्ध स्पष्ट और सहज रहता है।
- source_word: ἐπισκέψεται
  choice: हमारी सुधि लेने आएगा
  rationale: ἐπισκέπτομαι का मूल भाव ‘भेंट करना/देखने आना’ है और बाइबिलीय प्रयोग में प्रायः सहायता के लिए कृपापूर्वक ध्यान देने का भाव भी है। ‘सुधि लेने आएगा’ आगमन और कृपापूर्ण हस्तक्षेप दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀνατολὴ
  choice: प्रभात
  rationale: अगले पद में अन्धकार में बैठे लोगों पर प्रकाश चमकने की छवि के कारण यहाँ भोर या प्रभात का अर्थ प्रमुख है। यह शब्द मसीही ‘अंकुर’ की प्रतिध्वनि भी रख सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐξ ὕψους
  choice: ऊपर का
  rationale: यह अभिव्यक्ति ऊँचाई या स्वर्गीय लोक से आने का संकेत देती है। ‘ऊपर का प्रभात’ यूनानी की संक्षिप्त काव्यात्मक छवि बनाए रखता है और सीधे ‘स्वर्ग’ जोड़कर अर्थ को अधिक निर्धारित नहीं करता।
theological_decisions:
- issue: मसीही सन्दर्भ में ἀνατολή का अर्थ
  choice: मुख्य पाठ में ‘प्रभात’
  alternative: ‘उदय’, ‘उगनेवाला’, या ‘अंकुर’
  rationale: लूका 1:78–79 में प्रकाश और अन्धकार की निकटवर्ती छवियाँ ‘प्रभात’ के अर्थ का समर्थन करती हैं। फिर भी यूनानी पुराना नियम में यही शब्द मसीही ‘अंकुर’ की उपाधि की प्रतिध्वनि दे सकता है; इसलिए उस सम्भावना को मुख्य पाठ में निश्चित किए बिना पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद की काव्यात्मकता बनाए रखने के लिए ‘ऊपर का प्रभात’ रखा गया है; ‘हमारी सुधि लेने आएगा’ कृपापूर्ण आगमन का स्वाभाविक हिन्दी मुहावरा है।
