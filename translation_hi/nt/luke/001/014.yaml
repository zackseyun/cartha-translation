  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: hi
  text: और तुम्हें आनंद और उल्लास होगा, और उसके जन्म पर[a] बहुत-से लोग आनंदित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके जन्म के कारण।’ यूनानी वाक्यांश आनंद मनाने के अवसर या उसके कारण—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकालीन εἰμί को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और ‘आनन्द और उल्लास’ दोनों संज्ञाओं के साथ उपयुक्त है।
- source_word: χαρά
  choice: आनन्द
  rationale: χαρά के सामान्य अर्थ को सरल, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σοι
  choice: तुझे
  rationale: यह सम्प्रदान कारक उस व्यक्ति को दिखाता है जिसे आनन्द और उल्लास होगा; स्वर्गदूत द्वारा जकरयाह को एकवचन में सीधे संबोधित करने के अनुरूप ‘तुझे’ स्वाभाविक है।
- source_word: ἀγαλλίασις
  choice: उल्लास
  rationale: यह χαρά से भिन्न, अधिक प्रबल और उत्सवपूर्ण प्रसन्नता को व्यक्त करता है।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण के संज्ञावत् प्रयोग को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: उसके जन्म पर
  rationale: ἐπί के साथ सम्प्रदान कारक यहाँ आनन्द के अवसर अथवा आधार को सूचित कर सकता है; ‘जन्म पर’ अवसर के भाव को स्वाभाविक रूप से व्यक्त करते हुए मूल अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: χαρήσονται
  choice: आनन्दित होंगे
  rationale: χαίρω के भविष्यकालीन अर्थ को व्यक्त करता है और χαρά के साथ शब्दार्थ-संबंध भी बनाए रखता है।
