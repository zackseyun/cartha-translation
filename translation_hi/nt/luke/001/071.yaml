  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: hi
  text: हमारे शत्रुओं से उद्धार और उन सबके हाथ से छुटकारा जो हमसे बैर रखते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे शत्रुओं से मुक्ति और उन सबके वश से छुटकारा जो हमसे बैर रखते हैं।’
    reason: σωτηρίαν के लिए ‘मुक्ति’ और ἐκ χειρὸς के मुहावरे के लिए स्पष्टार्थक ‘वश से’ सम्भव विकल्प हैं।
lexical_decisions:
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: यह शब्द ठोस संकट से छुड़ाए जाने और व्यापक धार्मिक अर्थ—दोनों को व्यक्त कर सकता है; इस प्रकार जकरयाह की भविष्यवाणी का अर्थ केवल राजनीतिक या केवल आत्मिक नहीं बनाया गया।
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं से
  rationale: ἐξ अलग किए जाने या बचाए जाने के स्रोत को दर्शाता है; सरल हिन्दी में ‘से’ इसका स्वाभाविक अनुवाद है।
- source_word: ἐκ χειρὸς
  choice: हाथ से
  rationale: यह सामर्थ्य या अधीनता का सामी मुहावरा है। शाब्दिक रूप ‘हाथ से’ बाइबलीय बिंब को बनाए रखता है और हिन्दी में भी समझ में आता है।
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: उन सबके ... जो हमसे बैर रखते हैं
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘बैर रखते हैं’ स्थायी या चारित्रिक विरोध का भाव सुरक्षित रखता है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों पदबंधों को सीधे समान स्तर पर जोड़ता है; ‘और’ सबसे कम व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: जकरयाह की भविष्यवाणी में प्रतिज्ञात σωτηρίαν का स्वरूप
  choice: ‘उद्धार’ द्वारा शत्रुओं से वास्तविक छुटकारे और व्यापक धार्मिक मुक्ति—दोनों की संभावना सुरक्षित रखी गई।
  alternative: इसे केवल राजनीतिक-राष्ट्रीय छुटकारा या केवल पाप से आत्मिक मुक्ति मानना।
  rationale: पद स्वयं शत्रुओं और बैर रखने वालों की बात करता है, जबकि लूका 1 के व्यापक संदर्भ में उद्धार का धार्मिक और छुटकारे से जुड़ा महत्व भी है; अनुवाद इस तनाव को सीमित नहीं करता।
- issue: ἐκ χειρὸς का मुहावरा
  choice: मुख्य पाठ में ‘हाथ से’ रखकर सामर्थ्य और नियंत्रण का बिंब सुरक्षित रखा गया।
  alternative: मुख्य पाठ में स्पष्टार्थक ‘वश से’ या ‘सामर्थ्य से’।
  rationale: ‘हाथ से’ मूल बिंब और पुराने नियम की उद्धार-भाषा की प्रतिध्वनि को बनाए रखता है; पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली। ‘हाथ से’ मूल मुहावरे और उसके अंतरपाठीय बिंब को रखता है; ‘बैर रखते हैं’ सामान्य पाठक के लिए स्वाभाविक है।
