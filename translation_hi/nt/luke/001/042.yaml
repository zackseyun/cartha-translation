source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: hi
  text: और वह ऊँचे स्वर से पुकार उठी और बोली[a], “स्त्रियों में तुम धन्य हो, और तुम्हारे गर्भ का फल धन्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह ऊँची पुकार के साथ बोल उठी।”
    reason: κραυγῇ μεγάλῃ के लिए अधिक शब्दशः, पर स्वाभाविक हिन्दी विकल्प; यह मुख्य पाठ के ‘ऊँचे स्वर से’ का विकल्प है।
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: पुकार उठी
  rationale: यह क्रिया ऊँचे और स्पष्ट स्वर में अचानक बोल उठने का भाव देती है। ‘पुकार उठी’ उस प्रबल अभिव्यक्ति को रखता है, पर दुःख या विलाप का अनावश्यक संकेत नहीं देता।
- source_word: κραυγῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: करणवाचक पदबंध बोलने के ढंग और तीव्रता को व्यक्त करता है। आधुनिक हिन्दी में ‘ऊँचे स्वर से’ स्वाभाविक है और सार्वजनिक रूप से सुनाई देने वाली प्रबल आवाज़ का भाव बनाए रखता है।
- source_word: Εὐλογημένη
  choice: धन्य हो
  rationale: पूर्ण निष्क्रिय कृदन्त यहाँ विधेयात्मक और विस्मयात्मक आशीर्वचन के रूप में प्रयुक्त है। ‘धन्य हो’ बाइबिलीय आशीर्वचन की गरिमा बनाए रखता है और इसे केवल ‘कृपाप्राप्त’ के अर्थ तक सीमित नहीं करता।
- source_word: ἐν γυναιξίν
  choice: स्त्रियों में
  rationale: यूनानी पद मरियम को स्त्रियों के बीच विशिष्ट बताता है। स्रोत में ‘सब’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: εὐλογημένος
  choice: धन्य है
  rationale: पहले आशीर्वचन के समान शब्दावली रखने से मरियम और उसके गर्भ के फल के विषय में मूल पाठ का समानांतर विन्यास सुरक्षित रहता है।
- source_word: ὁ καρπὸς
  choice: फल
  rationale: यह मूल रूपक का सीधा और हिन्दी में प्रचलित बाइबिलीय रूप है। ‘सन्तान’ या ‘बालक’ अर्थ स्पष्ट करते, पर स्रोत की रूपकात्मक अभिव्यक्ति को हटा देते।
- source_word: τῆς κοιλίας σου
  choice: तुम्हारे गर्भ का
  rationale: गर्भावस्था के इस संदर्भ में κοιλία गर्भ को सूचित करता है। यह चयन मातृत्व की शारीरिक छवि और यूनानी संबंधवाचक रचना दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: मरियम को संबोधित आशीर्वचन का अनुवाद
  choice: स्त्रियों में तुम धन्य हो
  alternative: तुम स्त्रियों में धन्य ठहराई गई हो
  rationale: यह रूप आत्मा-प्रेरित आशीर्वचन को सीधे और गरिमापूर्वक व्यक्त करता है, पर पाठ से आगे बढ़कर मरियम की भूमिका को न तो घटाता है, न किसी बाद की सिद्धान्तगत व्याख्या से विस्तृत करता है। निष्क्रिय भाव हिन्दी में ‘धन्य हो’ की स्वाभाविक आशीर्वचन-शैली में निहित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण बाइबिलीय शैली अपनाई गई है। ‘धन्य’ और ‘गर्भ का फल’ जैसे परिचित पद मूल के आशीर्वचन और रूपक को सुरक्षित रखते हैं; वाक्य को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
