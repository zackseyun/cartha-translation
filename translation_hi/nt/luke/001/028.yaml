base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: hi
  text: और उसके पास प्रवेश करके उसने कहा, “नमस्कार[a], हे अनुग्रह-प्राप्त[b]; प्रभु तुम्हारे साथ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आनन्दित हो,” अथवा पारंपरिक रूप से “जय हो।” यूनानी शब्द शाब्दिक रूप से “आनन्दित हो” की आज्ञा है, पर यहाँ वह अभिवादन के मुहावरे के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “बहुत अनुग्रह-प्राप्त,” “हे कृपा-प्राप्त,” अथवा पारंपरिक रूप से “अनुग्रह से परिपूर्ण।” यूनानी शब्द ऐसे व्यक्ति को दर्शाता है जिस पर अनुग्रह या कृपा की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: उसके पास भीतर आकर
  rationale: यह पदबंध भीतर आने और मरियम के पास पहुँचने—दोनों भावों को बनाए रखता है; कृदंत को हिंदी में स्वाभाविक पूर्वकालिक क्रिया के रूप में व्यक्त किया गया है।
- source_word: Χαῖρε
  choice: नमस्कार
  rationale: यद्यपि इसका शाब्दिक रूप आज्ञार्थक ‘आनन्दित हो’ है, यहाँ यह सामान्य अभिवादन के रूप में प्रयुक्त हुआ है। ‘नमस्कार’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: κεχαριτωμένη
  choice: तुम पर अनुग्रह हुआ है
  rationale: पूर्णकालिक कर्मवाच्य कृदंत का भाव यह है कि संबोधित स्त्री अनुग्रह की प्राप्तकर्ता है। हिंदी में यह वाक्यांश उस प्रदत्त अनुग्रह को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त मानक बाइबलीय उपाधि है; ‘प्रभु’ श्रद्धा और पाठीय निरंतरता बनाए रखता है।
- source_word: μετὰ σοῦ
  choice: तुम्हारे साथ है
  rationale: μετά के संगति या उपस्थिति के अर्थ को हिंदी में स्वाभाविक बनाने के लिए ‘है’ जोड़ा गया है।
theological_decisions:
- issue: मरियम के संबोधन में κεχαριτωμένη का धर्मवैचारिक रूप से संवेदनशील अनुवाद
  choice: तुम पर अनुग्रह हुआ है
  alternative: अनुग्रह से परिपूर्ण
  rationale: यूनानी पूर्णकालिक कर्मवाच्य रूप मरियम को मिले हुए अनुग्रह पर बल देता है। चुना गया अनुवाद इस बात को सुरक्षित रखता है कि वह अनुग्रह की प्राप्तकर्ता है, जबकि बाद की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को मूल पाठ में नहीं जोड़ता। पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन में सम्मानपूर्ण किंतु सहज ‘तुम’ रखा गया है। वाक्य-रचना मूल के क्रम और भीतर आने की गति को यथासंभव बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक रखी गई है।
