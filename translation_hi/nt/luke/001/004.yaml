  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: hi
  text: ताकि आप उन बातों की निश्चितता[a] जान सकें, जिनके विषय में आपको शिक्षा दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वसनीयता”; यूनानी संज्ञा निश्चितता, सुरक्षा या विश्वसनीयता का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह लूका के उद्देश्य को व्यक्त करने वाला उपवाक्य आरंभ करता है; ‘ताकि’ स्वाभाविक हिन्दी में प्रयोजन का भाव बनाए रखता है।
- source_word: ἐπιγνῷς
  choice: आप जान लें
  rationale: प्रयोजनवाचक उपवाक्य में प्रयुक्त इस क्रिया का सहज हिन्दी रूप ‘जान लें’ है; ‘पूरी तरह जान लें’ कहना इसके संभावित बल को आवश्यकता से अधिक स्पष्ट कर सकता है।
- source_word: περὶ ὧν ... λόγων
  choice: जिन बातों की
  rationale: περί और λόγων मिलकर यहाँ उस शिक्षण की विषय-वस्तु की ओर संकेत करते हैं। ‘जिन बातों की’ आधुनिक हिन्दी में स्वाभाविक है और शाब्दिक ‘जिन वचनों के विषय में’ से अधिक स्पष्ट है।
- source_word: κατηχήθης
  choice: शिक्षा आपको दी गई है
  rationale: निष्क्रिय क्रिया औपचारिक रूप से दी गई शिक्षा को दर्शाती है। यह अभिव्यक्ति बाद की कलीसियाई पारिभाषिकता आरोपित किए बिना मौखिक अथवा व्यवस्थित शिक्षण का अर्थ पहुँचाती है।
- source_word: τὴν ἀσφάλειαν
  choice: उनकी निश्चितता
  rationale: ἀσφάλεια निश्चितता, भरोसेमंदी अथवा विश्वसनीयता का बोध करा सकता है। ‘निश्चितता’ मूल की व्यापक ज्ञान-संबंधी शक्ति बनाए रखती है, जबकि पादटिप्पणी दूसरा संभव अर्थ बताती है।
theological_decisions:
- issue: लूका के लेखन-उद्देश्य में ἀσφάλεια का स्वरूप
  choice: ‘निश्चितता’ रखा गया है, जिससे पूर्व शिक्षा के विषय में पक्का ज्ञान और उसकी वस्तुगत भरोसेमंदी—दोनों की संभावना खुली रहती है।
  alternative: केवल ‘मन का भरोसा’ अथवा केवल ‘ऐतिहासिक विश्वसनीयता’
  rationale: मूल संज्ञा आत्मगत आश्वासन और वस्तुगत भरोसेमंदी के बीच कठोर भेद नहीं करती; अनुवाद इस धर्मवैचारिक और ज्ञानमीमांसात्मक तनाव को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शिक्षा आपको दी गई है’ औपचारिक शिक्षण का संकेत देता है, पर बाद की विशिष्ट धार्मिक पारिभाषिकता नहीं जोड़ता।
