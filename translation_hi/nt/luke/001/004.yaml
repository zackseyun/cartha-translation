    issue: The phrase ‘जिन बातों की शिक्षा आपको दी गई है’ is somewhat syntactically compressed and potentially ambiguous.
    rationale: The Greek means matters ‘about which’ the reader was instructed. ‘जिनके विषय में आपको शिक्षा दी गई है’ states that relationship clearly in natural Hindi.
  - severity: low
    issue: ‘आप जान लें’ is slightly more conclusive than the Greek purpose-clause subjunctive.
    rationale: ‘आप ... जान सकें’ retains the telic and potential sense of ἵνα ἐπιγνῷς more idiomatically.
