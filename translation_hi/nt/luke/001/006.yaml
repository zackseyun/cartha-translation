revisions:
- from: वे दोनों परमेश्वर की दृष्टि में धर्मी थे और प्रभु की सभी आज्ञाओं और विधियों पर निर्दोष रूप से चलते थे।
  to: वे दोनों परमेश्वर की दृष्टि में धर्मी थे और प्रभु की सभी आज्ञाओं और विधियों का पालन करने में निर्दोष थे।
  rationale: The revision replaces the awkward literal idiom ‘आज्ञाओं ... पर चलते थे’ with the natural Hindi expression ‘आज्ञाओं ... का पालन करने में निर्दोष थे.’ It preserves the source’s comprehensive ‘all,’ the distinction between commandments and ordinances, and ἄμεμπτοι as blameless, irreproachable conduct rather than a doctrinal claim of sinless perfection.
  reviewer_model: gpt-5.6-terra
