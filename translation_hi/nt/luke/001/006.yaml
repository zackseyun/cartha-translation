id: LUK.1.6
reference: Luke 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: hi
  text: वे दोनों परमेश्वर की दृष्टि में धर्मी थे और प्रभु की सभी आज्ञाओं और विधियों का पालन करने में निर्दोष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह शब्द नैतिक और वाचा-संबंधी निष्ठा दोनों को व्यक्त करता है; केवल कानूनी न्याय या सामान्य भलमनसाहत तक अर्थ को सीमित नहीं करता।
- source_word: ἀμφότεροι
  choice: वे दोनों
  rationale: यूनानी पाठ के उस बल को स्वाभाविक हिन्दी में बनाए रखता है कि यह वर्णन जकर्याह और इलीशिबा दोनों पर समान रूप से लागू है।
- source_word: ἐναντίον τοῦ θεοῦ
  choice: परमेश्वर की दृष्टि में
  rationale: यह परमेश्वर के सामने होने और उसके मूल्यांकन में धर्मी ठहरने के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορευόμενοι
  choice: चलते थे
  rationale: मूल के चलने वाले जीवन-रूपक को बनाए रखता है और यहाँ आचरण अथवा जीवन बिताने का भाव देता है।
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: सभी आज्ञाओं ... पर
  rationale: चलना के साथ आधुनिक हिन्दी में 'पर चलना' आज्ञाओं के अनुसार जीवन बिताने का स्वाभाविक प्रयोग है और πάσαις की व्यापकता भी सुरक्षित रखता है।
- source_word: δικαιώμασιν
  choice: विधियों
  rationale: आज्ञाओं के साथ प्रयुक्त निर्धारित विधान या नियम का अर्थ देता है और दोनों यूनानी संज्ञाओं के बीच कुछ भेद बनाए रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: κύριος का प्रतिष्ठित, स्वाभाविक हिन्दी रूप है और यहाँ इस्राएल के परमेश्वर का संकेत बनाए रखता है।
- source_word: ἄμεμπτοι
  choice: निर्दोष रूप से
  rationale: यह बहुवचन विशेषण वाक्य में उनके आचरण की अप्रतिवाद्य दशा बताता है; हिन्दी में क्रियाविशेषणीय रूप से रखने पर वाक्य सहज रहता है।
- source_word: ἦσαν δὲ
  choice: थे और
  rationale: δέ के हल्के कथात्मक संयोजन को बिना अनावश्यक विरोध पैदा किए हिन्दी वाक्य-प्रवाह में व्यक्त करता है।
theological_decisions:
- issue: क्या ἄμεμπτοι पूर्ण पापहीनता बताता है
  choice: आज्ञाओं और विधियों के पालन में दोषारोपण से परे आचरण
  alternative: पूर्ण नैतिक पापहीनता
  rationale: तात्कालिक संदर्भ आज्ञाओं और विधियों के अनुरूप जीवन का वर्णन करता है। अनुवाद मूल के प्रबल शब्द को बनाए रखता है, पर पाठ में ऐसा सिद्धान्त नहीं जोड़ता कि वे सर्वथा पापरहित थे।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'परमेश्वर की दृष्टि में' और 'आज्ञाओं ... पर चलते थे' स्वाभाविक हिन्दी प्रयोग हैं, जबकि 'धर्मी', 'विधियाँ' और 'निर्दोष' बाइबलीय आशय को सुरक्षित रखते हैं।
