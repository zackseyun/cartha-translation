    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह पिछले पद के कथन के साथ अनुरूपता व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक संयोजक है।
- source_word: παρέδοσαν
  choice: हम तक पहुँचाईं
  rationale: यह प्राप्त जानकारी या परम्परा को आगे विश्वसनीय रूप से सौंपने का भाव व्यक्त करता है। ‘पहुँचाईं’ सहज हिन्दी में संप्रेषण की इस प्रक्रिया को स्पष्ट करता है।
- source_word: ἡμῖν
  choice: हम तक
  rationale: सम्प्रदान का स्वाभाविक हिन्दी रूप, जो बताता है कि जानकारी किन लोगों को प्राप्त हुई।
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: आरम्भ से ... लोगों ने
  rationale: यह उस समूह को पहचानता है जो घटनाओं के आरम्भ से उपस्थित था।
- source_word: αὐτόπται
  choice: प्रत्यक्षदर्शी
  rationale: यह उन लोगों को सटीक रूप से दर्शाता है जिन्होंने घटनाएँ स्वयं देखी थीं।
- source_word: ὑπηρέται
  choice: सेवक
  rationale: यह सेवा करने वालों का सामान्य और पारदर्शी शब्द है तथा किसी औपचारिक कलीसियाई पद का अनावश्यक संकेत नहीं देता।
- source_word: γενόμενοι
  choice: बने
  rationale: यह केवल स्थिर अवस्था नहीं, बल्कि सेवक बन जाने के भाव को सुरक्षित रखता है। वाक्य-विन्यास ‘प्रत्यक्षदर्शी रहे और ... सेवक बने’ आरम्भ से देखने और बाद में सेवा की भूमिका ग्रहण करने के बीच स्वाभाविक भेद रखता है।
- source_word: τοῦ λόγου
  choice: वचन
  rationale: ‘वचन’ λόγος की शाब्दिक व्यापकता और परिचित बाइबलीय भाषा को बनाए रखता है; सम्भावित अर्थ ‘संदेश’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: τοῦ λόγου का अभिप्राय
  choice: मुख्य पाठ में ‘वचन’
  alternative: ‘संदेश’ या ‘वृत्तान्त’
  rationale: यहाँ λόγος सम्भवतः यीशु के विषय में घोषित संदेश को सूचित करता है, न कि अनिवार्य रूप से मसीह के लिए प्रयुक्त व्यक्तिगत उपाधि को। ‘वचन’ मूल की व्यापकता बनाए रखता है, जबकि पादटिप्पणी सम्भावित अर्थ स्पष्ट करती है।
- issue: γενόμενοι का सम्बन्ध
  choice: ‘प्रत्यक्षदर्शी रहे और वचन के सेवक बने’
  alternative: ‘प्रत्यक्षदर्शी और वचन के सेवक बने’ अथवा ‘प्रत्यक्षदर्शी और सेवक थे’
  rationale: यूनानी कृदन्त दोनों संज्ञाओं के साथ व्याकरणतः जुड़ सकता है, पर प्रसंग आरम्भ से प्रत्यक्ष देखने और संदेश की सेवा करने की भूमिका के बीच अर्थगत भेद सुझाता है। चुना हुआ रूप इस भेद को व्यक्त करता है, बिना किसी औपचारिक पद की धारणा जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य का भाग है, इसलिए अन्त में अल्पविराम रखा गया है। यूनानी में कर्म प्रत्यक्ष रूप से नहीं दिया गया; पिछले पद से समझी जाने वाली बातों को हिन्दी में स्वाभाविक बनाने के लिए ‘ये बातें’ जोड़ा गया है।
