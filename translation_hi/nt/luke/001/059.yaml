  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: hi
  text: और ऐसा हुआ कि आठवें दिन वे बालक का खतना करने आए, और उसके पिता के नाम पर[b] वे उसे जकरयाह पुकारने लगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसे जकरयाह पुकार रहे थे।” यूनानी में प्रयुक्त अपूर्ण भूतकाल किसी चल रही या प्रयास की जा रही नामकरण-क्रिया का संकेत दे सकता है; अगली आयत में किया गया सुधार इसी के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे उसे उसके पिता के नाम पर जकरयाह पुकार रहे थे।” यह परिवार के किसी सदस्य के नाम पर बच्चे का नाम रखने की प्रथा को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यह लूका की सामान्य कथात्मक अभिव्यक्ति है; ‘ऐसा हुआ’ घटना का परिचय स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: आठवें दिन
  rationale: समय सूचित करने वाली यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἦλθον
  choice: वे ... आए
  rationale: मूल में कर्ता अनिर्दिष्ट बहुवचन है; ‘वे’ बिना किसी समूह की पहचान जोड़े इसे बनाए रखता है।
- source_word: περιτεμεῖν
  choice: खतना करने
  rationale: उद्देश्य सूचक क्रियार्थक रूप को सीधे व्यक्त करता है और हिन्दी पाठकों के लिए स्पष्ट है।
- source_word: τὸ παιδίον
  choice: बालक
  rationale: παιδίον का गरिमापूर्ण और प्रसंगानुकूल सामान्य हिन्दी अनुवाद।
- source_word: ἐκάλουν
  choice: नाम ... रखने लगे
  rationale: अपूर्ण भूतकाल चल रही या आरम्भ की गई, पर अभी निर्णायक रूप से पूरी न हुई नामकरण-क्रिया का संकेत दे सकता है; अगली आयत में होने वाले विरोध के साथ यह स्वाभाविक बैठता है।
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: उसके पिता के नाम पर
  rationale: यह अभिव्यक्ति पिता के नाम पर बच्चे का नाम रखने के आशय को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: Ζαχαρίαν
  choice: जकरयाह
  rationale: हिन्दी बाइबल परंपरा में प्रचलित, मूल नाम से संबद्ध रूप।
