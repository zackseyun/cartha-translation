source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: hi
  text: यहूदिया के राजा हेरोदेस के दिनों में जकरयाह नाम का एक याजक था, जो अबिय्याह के याजकीय दल[a] में से था; उसकी पत्नी हारून की बेटियों[b] में से थी, और उसका नाम इलीशिबा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अबिय्याह का याजकीय दल’ मंदिर में सेवा के लिए ठहराए गए याजकों के सेवा-दलों में से एक था।
    reason: cultural_note
  - marker: b
    text: या, ‘हारून के वंशजों में से।’ मूल यूनानी में शाब्दिक रूप से ‘हारून की बेटियों में से’ है—यह याजकीय वंश की स्त्रियों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: था
  rationale: यहाँ γίνομαι कथा के आरंभ में एक व्यक्ति का परिचय देता है। हिंदी में ‘था’ सहज रूप से अस्तित्व और परिचय, दोनों व्यक्त करता है।
- source_word: ἐν ταῖς ἡμέραις
  choice: के दिनों में
  rationale: यह मानक कालवाचक मुहावरे का स्वाभाविक और मूल के निकट हिंदी रूप है।
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: यहूदिया के राजा हेरोदेस
  rationale: यह पदबंध हेरोदेस को उसके पद और क्षेत्र से पहचानता है। ‘यहूदिया’ ऐतिहासिक भौगोलिक नाम Ἰουδαία को ठीक व्यक्त करता है।
- source_word: ἱερεύς τις
  choice: एक याजक
  rationale: τις नए पात्र का अनिश्चित परिचय कराता है; आधुनिक हिंदी में ‘एक याजक’ इसका स्वाभाविक रूप है।
- source_word: ὀνόματι Ζαχαρίας
  choice: जकरयाह नाम का
  rationale: ὀνόματι नाम बताने का मुहावरा है; यह हिंदी में संक्षिप्त और सहज है।
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: अबिय्याह के याजकीय दल में से
  rationale: ἐφημερία मंदिर-सेवा के लिए निर्धारित याजकीय सेवा-दल को दर्शाता है। ‘याजकीय दल’ मुख्य पाठ में संस्थागत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी ऐतिहासिक पृष्ठभूमि देती है।
- source_word: γυνὴ αὐτῷ
  choice: उसकी पत्नी ... थी
  rationale: αὐτῷ संबंध अथवा अधिकार का दत्तिव है। हिंदी में ‘उसकी पत्नी थी’ स्वाभाविक है और यूनानी वाक्य के आशय को बनाए रखता है।
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: हारून की बेटियों में से
  rationale: यह यूनानी की ठोस पारिवारिक अभिव्यक्ति को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यह हारून के वंश की स्त्रियों के लिए प्रयुक्त वंशावली-संबंधी मुहावरा है।
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: उसका नाम इलीशिबा था
  rationale: यह नाम बताने की मानक अभिव्यक्ति का स्वाभाविक हिंदी रूप है।
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: जकरयाह / इलीशिबा / अबिय्याह / हारून
  rationale: ये हिंदी बाइबल-पाठ में प्रचलित, मूल नामों से संबद्ध और पाठकों के लिए पहचाने जाने योग्य रूप हैं।
theological_decisions:
- issue: इलीशिबा की वंशावली का वर्णन
  choice: हारून की बेटियों में से
  alternative: हारून के वंशजों में से
  rationale: मूल यूनानी में ‘बेटियों’ की ठोस अभिव्यक्ति है। उसे मुख्य पाठ में रखना याजकीय वंश पर दिए गए बल और मूल की पारिवारिक छवि को सुरक्षित रखता है; उसका मुहावरेदार अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘याजक’ और बाइबिलीय व्यक्तिनाम जैसे परिचित पद बनाए गए हैं। यूनानी के एकल वाक्य और उसके समन्वय को अर्धविराम से यथासंभव सुरक्षित रखा गया है।
