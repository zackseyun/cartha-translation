id: LUK.1.63
reference: Luke 1:63
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: hi
  text: उसने लिखने की एक तख्ती मँगाकर लिखा, “यूहन्ना उसका नाम है।”[a] और सब अचंभित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक सहज हिंदी में, “उसका नाम यूहन्ना है।” यूनानी में अधिक शाब्दिक क्रम “यूहन्ना उसका नाम है” है, जिसमें परमेश्वर द्वारा दिए गए नाम की जकरयाह की दृढ़ पुष्टि पर बल पड़ता है।
    reason: शब्दक्रम और अधिक सहज अनुवाद का विकल्प
lexical_decisions:
- source_word: αἰτήσας
  choice: मँगाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। प्रसंग में ‘मँगाकर’ स्वाभाविक हिंदी है और यह संकेत देता है कि उसने लिखने की वस्तु लाने को कहा।
- source_word: πινακίδιον
  choice: लिखने की एक तख्ती
  rationale: यह लिखने के काम आने वाली छोटी पटिया या तख्ती को सूचित करता है। ‘लिखने की तख्ती’ आधुनिक पाठक के लिए स्पष्ट है और इलेक्ट्रॉनिक ‘टैबलेट’ का भ्रम नहीं पैदा करती।
- source_word: ἔγραψεν λέγων
  choice: लिखा
  rationale: यूनानी में शाब्दिक रूप से ‘लिखा, कहते हुए’ है, पर लिखित कथन के सीधे उद्धरण से हिंदी में λέγων का परिचयात्मक कार्य पर्याप्त रूप से व्यक्त हो जाता है; ‘लिखते हुए कहा’ अनावश्यक रूप से मौखिक कथन का आभास दे सकता है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: यह इस बाइबलीय व्यक्ति के नाम का प्रचलित और मानक हिंदी रूप है।
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: उसका नाम है
  rationale: वर्तमान काल को बनाए रखा गया है; ‘होगा’ जोड़ने से भविष्यकाल का ऐसा अर्थ आता जो यूनानी पाठ में स्पष्ट नहीं है। नाम को पहले रखकर मूल कथन का बल भी सुरक्षित रखा गया है।
- source_word: ἐθαύμασαν πάντες
  choice: सब अचंभित हुए
  rationale: θαυμάζω यहाँ विस्मय या आश्चर्य की प्रतिक्रिया व्यक्त करता है। ‘सब अचंभित हुए’ स्वाभाविक, गरिमापूर्ण हिंदी में सामूहिक बल को बनाए रखता है।
theological_decisions:
- issue: यूहन्ना के नाम की घोषणा में वर्तमान काल और बल
  choice: “यूहन्ना उसका नाम है”
  alternative: “उसका नाम यूहन्ना होगा”
  rationale: यूनानी में ἐστίν वर्तमान काल है और ‘यूहन्ना’ को पहले रखा गया है। इसलिए अनुवाद नाम की निर्णायक पुष्टि करता है, लेकिन भविष्यकाल या कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तख्ती’ ऐतिहासिक लेखन-सामग्री को सहज ढंग से व्यक्त करती है। उद्धरण में कुछ असामान्य शब्दक्रम जानबूझकर रखा गया है ताकि मूल का नाम-केंद्रित बल बना रहे; फुटनोट अधिक सहज हिंदी देता है।
