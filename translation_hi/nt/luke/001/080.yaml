id: LUK.1.80
reference: Luke 1:80
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: hi
  text: और वह बालक बढ़ता गया और आत्मा में बलवान होता गया[a]। वह इस्राएल के सामने प्रकट होने के दिन तक निर्जन प्रदेशों में रहा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा में बलवान होता गया।” यूनानी पद का अर्थ सामान्य रूप से भीतरी या आत्मिक बल हो सकता है, अथवा विशेष रूप से पवित्र आत्मा के संबंध में बल पाना।
    reason: alternative_reading
  - marker: b
    text: या, “जंगल में।” यूनानी में बहुवचन है, जिसका शाब्दिक अर्थ “निर्जन प्रदेशों में” या “उजाड़ स्थानों में” है।
    reason: lexical_alternative
  - marker: c
    text: या, “इस्राएल के सामने उसके प्रकट किए जाने के दिन तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: बालक
  rationale: यह यूहन्ना की बाल्यावस्था को सूचित करता है; आधुनिक हिन्दी में ‘बालक’ गरिमापूर्ण और आयु की दृष्टि से पर्याप्त व्यापक है।
- source_word: ηὔξανε
  choice: बढ़ता गया
  rationale: अपूर्ण भूतकाल चलती हुई वृद्धि को दर्शाता है, जिसे ‘बढ़ता गया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκραταιοῦτο
  choice: बलवान होता गया
  rationale: यह लगातार बल प्राप्त करने की प्रक्रिया व्यक्त करता है और क्रिया को अनावश्यक रूप से केवल कर्मवाच्य या आत्मवाच्य नहीं ठहराता।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: यूनानी पद बिना उपपद के है और आत्मिक/भीतरी क्षेत्र अथवा पवित्र आत्मा से संबंध—दोनों की संभावना खुली रखता है।
- source_word: ἐν ταῖς ἐρήμοις
  choice: निर्जन प्रदेशों में
  rationale: बहुवचन रूप को सुरक्षित रखते हुए यह ‘उजाड़/निर्जन स्थानों’ का व्यापक भौगोलिक अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: ἀναδείξεως
  choice: प्रकट होने
  rationale: यह सार्वजनिक रूप से सामने आने या प्रकट किए जाने का भाव देता है; हिन्दी में ‘प्रकट होना’ स्पष्ट और स्वाभाविक है।
- source_word: πρὸς τὸν Ἰσραήλ
  choice: इस्राएल के सामने
  rationale: यह इस्राएल को उस जनसमुदाय के रूप में व्यक्त करता है जिसके समक्ष यूहन्ना सार्वजनिक रूप से प्रकट हुआ।
theological_decisions:
- issue: यूहन्ना के विकास में πνεύματι का अर्थ
  choice: आत्मा में
  alternative: पवित्र आत्मा में; आत्मिक रूप से
  rationale: मूल पाठ यहाँ पवित्र आत्मा को स्पष्ट रूप से निर्दिष्ट नहीं करता। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी अधिक विशिष्ट संभावना बताती है।
- issue: ἀναδείξεως में कर्तृवाच्य और कर्मवाच्य की संभाव्यता
  choice: प्रकट होने
  alternative: प्रकट किए जाने
  rationale: संज्ञा सार्वजनिक प्रकटीकरण को दर्शाती है, पर यह स्पष्ट नहीं करती कि जोर स्वयं सामने आने पर है या परमेश्वर द्वारा प्रकट किए जाने पर; मुख्य पाठ स्वाभाविक रहते हुए इस तनाव को अधिक न बढ़ाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘बढ़ता गया’ और ‘बलवान होता गया’ दोनों अपूर्ण भूतकाल की निरंतरता व्यक्त करते हैं। पादटिप्पणी चिह्न संबंधित पदों के तुरंत बाद लगाए गए हैं।
