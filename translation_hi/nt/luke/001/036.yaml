language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: hi
  text: और देखो, तुम्हारी रिश्तेदार एलिशाबा ने भी अपने बुढ़ापे में एक पुत्र गर्भ में धारण किया है, और जिसे बाँझ कहा जाता था, उसका यह छठा महीना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला स्वाभाविक और सीधा हिन्दी संबोधन है; मूल के बल को बनाए रखता है।
- source_word: Ἐλισάβετ
  choice: एलिशाबा
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: συγγενίς
  choice: रिश्तेदार
  rationale: मूल शब्द किसी स्त्री संबंधी को सूचित करता है, पर संबंध की ठीक प्रकृति नहीं बताता; ‘रिश्तेदार’ उस अस्पष्टता को सुरक्षित रखता है।
- source_word: συνείληφεν υἱὸν
  choice: एक पुत्र गर्भ में धारण किया है
  rationale: यह गर्भधारण और पुत्र होने—दोनों बातों को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν γήρει αὐτῆς
  choice: अपने बुढ़ापे में
  rationale: मूल के अर्थ का सीधा और सामान्य आधुनिक हिन्दी रूप।
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: जिसे बाँझ कहा जाता था
  rationale: ‘कहा जाता था’ सामाजिक पहचान या प्रतिष्ठा को व्यक्त करता है और इसे वक्ता का स्वतंत्र चिकित्सकीय निर्णय नहीं बनाता।
theological_decisions:
- issue: एलिशाबा के ‘बाँझ’ कहलाने का स्वरूप
  choice: जिसे बाँझ कहा जाता था
  alternative: जो बाँझ थी
  rationale: मूल में क्रियावाचक रूप ‘कहलाने वाली’ है; चुना हुआ रूप वही दूरी और तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, मौखिक रूप से स्वाभाविक और गरिमापूर्ण। वाक्य की सूचना-संरचना मूल के निकट रखी गई है, पर अंतिम उपवाक्य को सहज हिन्दी क्रम दिया गया है।
