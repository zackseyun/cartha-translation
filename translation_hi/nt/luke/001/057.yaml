    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: जब…तो
  rationale: यह हल्का कथात्मक संयोजक है। हिन्दी में अलग से ‘अब’ जोड़ने के बजाय ‘जब…तो’ की स्वाभाविक संरचना वाक्य की प्रगति और दोनों घटनाओं का संबंध व्यक्त करती है।
- source_word: Ἐλισάβετ
  choice: एलिसाबेत
  rationale: नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἐπλήσθη ὁ χρόνος
  choice: समय पूरा हुआ
  rationale: यूनानी अभिव्यक्ति का पूर्णता-बोध सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῦ τεκεῖν αὐτήν
  choice: एलिसाबेत के प्रसव का
  rationale: संदर्भ प्रसव का है; नाम को स्पष्ट रूप से रखने से हिन्दी वाक्य सहज रहता है और αὐτήν का आशय स्पष्ट होता है।
- source_word: ἐγέννησεν
  choice: उसने…जन्म दिया
  rationale: सम्पन्न प्रसव-घटना को व्यक्त करने वाला स्वाभाविक हिन्दी रूप।
- source_word: υἱόν
  choice: एक पुत्र
  rationale: मूल शब्द विशेष रूप से पुत्र को दर्शाता है, केवल सामान्यतः संतान को नहीं।
