id: LUK.1.66
reference: Luke 1:66
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: hi
  text: जिन-जिन लोगों ने यह सब सुना, उन सबने इसे अपने मन में रख लिया[a] और कहा, “तो फिर यह बालक क्या होगा?”[b] क्योंकि प्रभु का हाथ उसके साथ था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हृदय में रख लिया”; अर्थात उन्होंने इन बातों को गंभीरता से याद रखा और उन पर विचार किया।
    reason: cultural_note
  - marker: b
    text: या, “तो फिर यह बालक क्या बनेगा?” यूनानी क्रिया का शाब्दिक अर्थ “होगा” है, पर प्रसंग में प्रश्न उसके भावी जीवन या भूमिका के विषय में है।
    reason: lexical_alternative
  - marker: c
    text: “प्रभु का हाथ” परमेश्वर की सक्रिय सामर्थ्य, कृपा या मार्गदर्शन के लिए प्रयुक्त एक बाइबलीय रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: अपने मन में रख लिया
  rationale: यूनानी मुहावरे का शाब्दिक चित्र ‘अपने हृदय में रखना’ है। आधुनिक हिन्दी में ‘अपने मन में रख लिया’ उस बात को गंभीरता से याद रखने और उस पर विचार करते रहने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντες οἱ ἀκούσαντες
  choice: जिन-जिन लोगों ने यह सब सुना, उन सबने
  rationale: यह सहभागी पद उन सभी लोगों को समेटता है जिन्होंने पूर्ववर्णित घटनाएँ सुनी थीं। ‘यह सब’ प्रसंग से पूरित है और हिन्दी में कर्म को स्पष्ट करता है।
- source_word: Τί ἄρα
  choice: तो फिर ... क्या
  rationale: ἄρα पिछली घटनाओं से निकले अनुमान या परिणाम का भाव देता है; ‘तो फिर’ आधुनिक हिन्दी में यही प्रश्नात्मक-अनुमानसूचक बल व्यक्त करता है।
- source_word: τὸ παιδίον τοῦτο
  choice: यह बालक
  rationale: παιδίον छोटे बच्चे को सूचित करता है। प्रसंग में बच्चा पुरुष है, इसलिए ‘बालक’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἔσται
  choice: क्या होगा
  rationale: क्रिया का मूल अर्थ ‘होगा’ है। हिन्दी में यह प्रश्न बालक की भावी पहचान, भूमिका या जीवन-दिशा को स्वाभाविक रूप से खुला रखता है।
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह संयोजन लोगों के प्रश्न का कारण प्रस्तुत करता है। हिन्दी में ‘क्योंकि’ संबंध को स्पष्ट और सहज रूप में व्यक्त करता है; καί का बल अलग से जोड़ने पर वाक्य अनावश्यक रूप से भारी होता।
- source_word: χεὶρ κυρίου
  choice: प्रभु का हाथ
  rationale: ‘हाथ’ का बाइबलीय रूपक परमेश्वर की सक्रिय सामर्थ्य, कृपा या मार्गदर्शन का संकेत देता है। रूपक को बनाए रखने से अर्थ को किसी एक व्याख्या तक सीमित नहीं किया गया।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ था
  rationale: μετά के साथ संबंध या संगति का सीधा भाव है। सर्वनाम प्रसंगानुसार बालक की ओर संकेत करता है।
theological_decisions:
- issue: ‘प्रभु का हाथ उसके साथ था’ मुहावरे का आशय
  choice: रूपक को ज्यों का त्यों रखते हुए परमेश्वर की सक्रिय उपस्थिति, सामर्थ्य या कृपा का संकेत खुला रखा गया।
  alternative: ‘प्रभु उसकी सहायता कर रहा था’ अथवा ‘परमेश्वर की सामर्थ्य उस पर थी।’
  rationale: मूल पाठ यह निश्चित नहीं करता कि यहाँ संरक्षण, सहायता, कृपा, सामर्थ्य या मार्गदर्शन में से कौन-सा पक्ष अकेले अभिप्रेत है। रूपक इस धर्मवैचारिक व्यापकता और तनाव को सुरक्षित रखता है।
- issue: बालक के भविष्य के विषय में प्रश्न
  choice: ‘यह बालक क्या होगा?’
  alternative: ‘यह बालक क्या बनेगा?’
  rationale: ἔσται साधारणतः ‘होगा’ है। ‘क्या होगा’ भावी पहचान और भूमिका दोनों के लिए खुला है और ‘बनेगा’ की अपेक्षा मूल क्रिया के अधिक निकट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘मन में रख लिया’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल ‘हृदय’ रूपक को दर्ज करती है। ‘प्रभु का हाथ’ जानबूझकर सुरक्षित रखा गया है ताकि बाइबलीय अंतर्पाठ और अर्थ की व्यापकता बनी रहे।
