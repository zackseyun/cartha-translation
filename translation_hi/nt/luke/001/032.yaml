id: LUK.1.32
reference: Luke 1:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: hi
  text: वह[a] महान होगा और परमप्रधान का पुत्र कहलाएगा[b], और प्रभु परमेश्वर उसे उसके पिता[c] दाऊद का सिंहासन देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यूनानी वाक्य “यह” से आरम्भ होता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमप्रधान का पुत्र नामित किया जाएगा।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ “उसके पिता” का अर्थ है कि दाऊद यीशु का राजवंशीय पूर्वज था।
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: वह
  rationale: यह संकेतवाचक सर्वनाम अभी-अभी घोषित किए गए बालक की ओर संकेत करता है। हिन्दी में इस संदर्भ में “वह” स्वाभाविक है; यूनानी का अधिक शाब्दिक रूप “यह” पादटिप्पणी में दिया गया है।
- source_word: ἔσται μέγας
  choice: महान होगा
  rationale: भविष्यकाल और μέγας के व्यापक, गरिमापूर्ण अर्थ को सरल और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: υἱὸς Ὑψίστου
  choice: परमप्रधान का पुत्र
  rationale: यह पदवीगत अभिव्यक्ति है। “परमप्रधान” Ὑψίστου की बाइबिलीय ईश्वरीय उपाधि को और “पुत्र” उसके संबंधपरक तथा मसीही बल को बनाए रखता है।
- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: καλέω के भावी कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है और नामकरण अथवा पदवी से पुकारे जाने—दोनों की अर्थ-सीमा को खुला रखता है।
- source_word: κύριος ὁ θεὸς
  choice: प्रभु परमेश्वर
  rationale: κύριος और θεός दोनों को स्पष्ट रूप से व्यक्त करता है, बिना κύριος को परमेश्वर के इब्रानी विशिष्ट नाम के रूप में अधिक निर्धारित किए।
- source_word: δώσει αὐτῷ
  choice: उसे ... देगा
  rationale: δίδωμι के सामान्य ‘देना’ अर्थ और αὐτῷ के संप्रदान कारक को सहज हिन्दी वाक्य-विन्यास में प्रस्तुत करता है।
- source_word: τὸν θρόνον Δαυὶδ
  choice: दाऊद का सिंहासन
  rationale: यूनानी संबंधकारक रचना को स्पष्ट हिन्दी में व्यक्त करते हुए दाऊदी राजकीय प्रतिज्ञा की गूँज बनाए रखता है।
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: उसके पिता
  rationale: πατήρ का सीधा अर्थ सुरक्षित रखा गया है; यहाँ इसका वंशगत अर्थ है, जिसे पादटिप्पणी स्पष्ट करती है, न कि मुख्य पाठ में व्याख्यात्मक रूप से ‘पूर्वज’ कर दिया गया है।
theological_decisions:
- issue: υἱὸς Ὑψίστου में मसीह-संबंधी उपाधि
  choice: “परमप्रधान का पुत्र”
  alternative: “परमप्रधान का एक पुत्र”
  rationale: संदर्भ में यह यीशु के लिए विशिष्ट राजकीय और ईश्वरीय पदवी है। हिन्दी में अनिश्चिततासूचक “एक” जोड़ना यूनानी से अधिक अर्थ आरोपित करता और पदवी की विशिष्टता को कमजोर करता।
- issue: κύριος का अनुवाद
  choice: “प्रभु”
  alternative: “यहोवा” अथवा “स्वामी”
  rationale: यूनानी पाठ में κύριος है, इब्रानी परमेश्वर-नाम प्रत्यक्ष रूप से नहीं; इसलिए “प्रभु परमेश्वर” निकट, गरिमापूर्ण और अनावश्यक अति-निर्धारण से मुक्त है।
- issue: दाऊद को ‘पिता’ कहना
  choice: “उसके पिता दाऊद”
  alternative: “उसके पूर्वज दाऊद”
  rationale: “पिता” मूल शब्द और दाऊदी वंश तथा राजकीय पुत्रत्व की भाषा दोनों को बनाए रखता है। वंशगत आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। “परमप्रधान,” “प्रभु परमेश्वर” और “सिंहासन” जैसे स्थापित बाइबिलीय पदों को रखा गया है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
