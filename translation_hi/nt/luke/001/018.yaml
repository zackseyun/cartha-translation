  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: hi
  text: ज़करयाह ने स्वर्गदूत से कहा, “मैं यह कैसे जानूँगा? क्योंकि मैं बूढ़ा हूँ और मेरी पत्नी की उम्र बहुत हो चुकी है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी पत्नी अपने दिनों में आगे बढ़ चुकी है”; यह यूनानी मुहावरा वृद्धावस्था को दर्शाता है।
    reason: मूल यूनानी मुहावरे के शाब्दिक बिंब को सुरक्षित रखते हुए उसके आशय को स्पष्ट करना।
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: कथात्मक प्रसंग में बोलने की क्रिया के लिए यह सामान्य और स्वाभाविक हिन्दी रूप है।
- source_word: πρὸς τὸν ἄγγελον
  choice: स्वर्गदूत से
  rationale: बोलने की क्रिया के साथ πρός संबोधित व्यक्ति को दर्शाता है। इस प्रसंग में ἄγγελος गब्रिएल के लिए है, इसलिए ‘स्वर्गदूत’ उपयुक्त है।
- source_word: Κατὰ τί γνώσομαι τοῦτο
  choice: मैं यह कैसे जानूँगा?
  rationale: यह अनुवाद जानने के आधार या साधन से संबंधित प्रश्न और γνώσομαι के भविष्यकाल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρεσβύτης
  choice: बूढ़ा
  rationale: यह शब्द आयु में वृद्ध पुरुष को दर्शाता है, किसी पदाधिकारी को नहीं। ‘मैं बूढ़ा हूँ’ सीधा और आम पाठक के लिए सहज है।
- source_word: ἡ γυνή μου
  choice: मेरी पत्नी
  rationale: संबंधसूचक प्रसंग में γυνή का अर्थ स्पष्ट रूप से ‘पत्नी’ है।
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: उम्र में बहुत आगे बढ़ चुकी है
  rationale: यह यूनानी मुहावरे के ‘आगे बढ़ने’ वाले बिंब को यथासंभव बनाए रखते हुए आधुनिक हिन्दी में वृद्धावस्था का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ἄγγελος का अर्थ
  choice: स्वर्गदूत
  alternative: दूत
  rationale: यद्यपि ἄγγελος सामान्यतः ‘दूत’ भी हो सकता है, निकटवर्ती प्रसंग में वक्ता गब्रिएल है; इसलिए यहाँ ‘स्वर्गदूत’ प्रसंगानुकूल है और पाठ में कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: ज़करयाह के प्रश्न का स्वरूप
  choice: मैं यह कैसे जानूँगा?
  alternative: मैं इसका क्या प्रमाण जानूँ?
  rationale: मूल पाठ जानने के आधार या साधन के विषय में प्रश्न करता है, पर स्पष्ट रूप से ‘चिह्न’ या ‘प्रमाण’ शब्द नहीं कहता। इसलिए अनुवाद उस निहितार्थ को खुलकर जोड़ने के बजाय मूल की गुंजाइश बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ कथानक के καί को हिन्दी में स्वाभाविक रूप से जोड़ता है। ‘उम्र में बहुत आगे बढ़ चुकी है’ स्रोत के बिंब और हिन्दी की बोधगम्यता के बीच संतुलन रखता है।
