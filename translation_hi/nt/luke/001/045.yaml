base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: hi
  text: और धन्य है वह जिसने विश्वास किया कि[a] प्रभु की ओर से उससे कही गई बातों की पूर्ति होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि प्रभु की ओर से उससे कही गई बातों की पूर्ति होगी।” यूनानी संयोजक का अर्थ कभी-कभी “क्योंकि” भी हो सकता है, यद्यपि यहाँ “कि” अधिक संभव है।
    reason: alternative_reading
  - marker: b
    text: “पूर्ति” के लिए “पूर्णता” या “सिद्धि” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: धन्य
  rationale: ‘धन्य’ इस कथन के धार्मिक और परमेश्वर-संबंधी अर्थ को बनाए रखता है; केवल भावनात्मक ‘सुखी’ या सामान्य ‘भाग्यशाली’ की अपेक्षा यह लूका के संदर्भ में अधिक उपयुक्त है।
- source_word: ἡ πιστεύσασα
  choice: वह स्त्री जिसने विश्वास किया
  rationale: स्त्रीलिंग संज्ञार्थक भूतकालिक कृदंत को स्वाभाविक हिन्दी में व्यक्त करता है और विश्वास के किए जा चुके कार्य को बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι अधिक स्वाभाविक रूप से विश्वास की विषय-वस्तु प्रस्तुत करता है—उसने विश्वास किया कि कही गई बातें पूरी होंगी। ‘क्योंकि’ का कारणवाचक अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: τελείωσις
  choice: पूरी होंगी
  rationale: यूनानी संज्ञा का भाव हिन्दी में स्वाभाविक क्रियात्मक रूप से दिया गया है। यह परमेश्वर की कही बातों के पूर्ण हो जाने का अर्थ स्पष्ट रखता है।
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: उससे कही गई बातें
  rationale: यह पूर्व में कहे गए वचनों की विषय-वस्तु को दर्शाता है और पूर्ण कर्मवाच्य रूप के परिणामकारी भाव को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: παρὰ κυρίου
  choice: प्रभु की ओर से
  rationale: παρά के संबंधकारक प्रयोग में स्रोत या उद्गम का भाव प्रमुख है; यह अनुवाद बताता है कि संदेश प्रभु की ओर से आया था, बिना यह अनावश्यक रूप से तय किए कि वचन सीधे बोले गए या दूत के माध्यम से।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος इस्राएल के परमेश्वर को प्रतिज्ञा के स्रोत के रूप में सूचित करता है; ‘प्रभु’ आधुनिक हिन्दी बाइबलीय प्रयोग में गरिमापूर्ण और परिचित है।
theological_decisions:
- issue: मरियम के धन्य होने, उसके विश्वास और प्रतिज्ञात वचन की पूर्ति का संबंध
  choice: स्त्री को धन्य कहा गया है जिसने विश्वास किया कि प्रभु की ओर से उससे कही गई बातें पूरी होंगी।
  alternative: स्त्री धन्य है क्योंकि उससे कही गई प्रभु की बातें पूरी होंगी; इस पाठ में ‘कि’ की अपेक्षा ‘क्योंकि’ पर बल होगा।
  rationale: वाक्य-विन्यास में ὅτι को πιστεύσασα के बाद विश्वास की विषय-वस्तु बताने वाला मानना अधिक स्वाभाविक है। फिर भी कारणवाचक अर्थ वास्तविक भाषिक संभावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘वह स्त्री’ से यूनानी स्त्रीलिंग रूप स्पष्ट होता है; ‘प्रभु की ओर से’ स्रोत का भाव बनाए रखता है।
