lexical_decisions:
- source_word: ἐταράχθη
  choice: घबरा गया
  rationale: यहाँ क्रिया ज़करयाह के भीतर अचानक उत्पन्न हुई व्याकुलता को व्यक्त करती है। ‘घबरा गया’ आधुनिक हिन्दी में स्वाभाविक है और अगले खंड के स्पष्ट ‘भय’ को अनावश्यक रूप से पहले ही तीव्र नहीं बनाता।
- source_word: Ζαχαρίας
  choice: ज़करयाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἰδών
  choice: जब ... ने उसे देखा
  rationale: एओरिस्ट कृदन्त का प्रसंगानुसार कालवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘उसे’ पिछले पद के स्वर्गदूत की ओर संकेत करता है, यद्यपि यूनानी में कर्म स्पष्ट रूप से नहीं लिखा है।
- source_word: φόβος
  choice: भय
  rationale: यह मूल संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप है; ‘आतंक’ जैसे विकल्प अर्थ को अधिक तीव्र कर सकते हैं।
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: उस पर ... छा गया
  rationale: मूल मुहावरे में भय के किसी व्यक्ति पर आ पड़ने की सजीव छवि है। हिन्दी में ‘उस पर भय छा गया’ उसी अचानक और प्रबल अनुभव को स्वाभाविक ढंग से व्यक्त करता है।
