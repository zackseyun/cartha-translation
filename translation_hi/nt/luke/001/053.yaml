  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: hi
  text: 'उसने भूखों को अच्छी वस्तुओं से भर दिया,

    और धनवानों को खाली हाथ भेज दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: भूखों को
  rationale: वर्तमान कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है। ‘भूखों’ से वास्तविक भूख का सीधा सामाजिक अर्थ बना रहता है और अनावश्यक रूप से ‘भूख से मरते लोगों’ जैसी तीव्रता नहीं जुड़ती।
- source_word: ἐνέπλησεν
  choice: भर दिया
  rationale: क्रिया का मूल भाव भर देने का है। हिन्दी में पूर्ण क्रिया ‘भर दिया’ गीत में वर्णित परमेश्वर के निर्णायक कार्य को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἀγαθῶν
  choice: अच्छी वस्तुओं से
  rationale: भरने की सामग्री बताने वाला संबंधकारक है। ‘अच्छी वस्तुओं से’ मूल के व्यापक अर्थ को रखता है; ‘अच्छे वरदानों’ से देने का भाव अनावश्यक रूप से जुड़ता।
- source_word: πλουτοῦντας
  choice: धनवानों को
  rationale: वर्तमान कृदन्त संज्ञार्थक है। ‘धनवानों’ से भूखों के साथ ठोस सामाजिक विरोध स्पष्ट और स्वाभाविक रहता है।
- source_word: ἐξαπέστειλεν
  choice: लौटा दिया
  rationale: संदर्भ में किसी को अपने पास से खाली अवस्था में भेज देने का भाव है। ‘लौटा दिया’ हिन्दी में स्वाभाविक है और विदा किए जाने का आशय व्यक्त करता है।
- source_word: κενούς
  choice: खाली हाथ
  rationale: मूल विशेषण का शाब्दिक अर्थ ‘खाली’ है। व्यक्तियों को भेजने के इस संदर्भ में हिन्दी का मुहावरा ‘खाली हाथ’ वही अभाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मरियम के गीत में सामाजिक-धार्मिक उलटफेर
  choice: ‘भूखों’ और ‘धनवानों’ के ठोस सामाजिक विरोध को यथावत रखना
  alternative: इन्हें क्रमशः केवल आत्मिक रूप से अभावग्रस्त और आत्मसंतुष्ट या घमंडी लोगों के रूप में प्रस्तुत करना
  rationale: यूनानी पाठ वास्तविक भूखे और धनवान लोगों का उल्लेख करता है। अनुवाद इस स्पष्ट अर्थ को आध्यात्मिक रूपक में सीमित नहीं करता और लूका में उपस्थित ईश्वरीय उलटफेर के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला वाक्य। ‘अच्छी वस्तुओं’ मूल की व्यापकता बचाता है, जबकि ‘खाली हाथ’ हिन्दी में κενούς का स्वाभाविक प्रसंगानुकूल रूप है।
