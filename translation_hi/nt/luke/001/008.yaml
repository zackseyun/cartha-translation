lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: तब ऐसा हुआ कि
  rationale: यह कथानक में आगे की घटना का परिचय देने वाला सूत्र है। हिंदी में ‘तब ऐसा हुआ कि’ स्वाभाविक रूप से संक्रमण दिखाता है और अनावश्यक प्राचीनता से बचता है।
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: जब वह ... याजक की सेवा कर रहा था
  rationale: ἐν के साथ व्यक्तिवाचक infinitive यहाँ समयसूचक है; ἱερατεύω विशेष रूप से याजकीय सेवा करना दर्शाता है।
- source_word: τάξει
  choice: बारी के अनुसार
  rationale: मंदिर-सेवा के संदर्भ में यह निर्धारित क्रम या व्यवस्था को सूचित करता है; हिंदी में ‘बारी के अनुसार’ अनुसूचित सेवा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐφημερίας
  choice: दल
  rationale: यह याजकों के उस संगठित विभाग को दर्शाता है जिसकी मंदिर-सेवा निर्धारित बारी पर होती थी; ‘दल’ आधुनिक पाठक के लिए सहज है।
- source_word: ἔναντι τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में संपन्न सेवा का मानक भाव सुरक्षित रखता है।
theological_decisions:
- issue: जकरयाह की मंदिर-संबंधी याजकीय सेवा की शब्दावली
  choice: अपने दल की बारी के अनुसार परमेश्वर के सामने याजक की सेवा
  alternative: अपने याजकीय दल के निर्धारित क्रम में परमेश्वर के सामने याजकीय सेवा
  rationale: मुख्य पाठ ऐतिहासिक मंदिर-व्यवस्था और निर्धारित सेवा-बारी को स्पष्ट करता है, पर बाद की कलीसियाई पदावली या संप्रदायगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। पद मूल यूनानी में अगले वाक्य की ओर बढ़ता है, इसलिए अंत में ‘कि’ रखकर उसकी अपूर्ण कथात्मक संरचना सुरक्षित रखी गई है।
