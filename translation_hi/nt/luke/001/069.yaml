lexical_decisions:
- source_word: ἤγειρεν
  choice: खड़ा किया है
  rationale: यूनानी एओरिस्ट को जकरयाह के स्तुतिपरक और भविष्यसूचक संदर्भ में हिन्दी पूर्ण वर्तमान से व्यक्त किया गया है। ‘खड़ा किया’ परमेश्वर द्वारा सामर्थी उद्धारकर्ता को प्रकट करने की बाइबलीय अभिव्यक्ति बनाए रखता है।
- source_word: κέρας σωτηρίας
  choice: उद्धार का एक सींग
  rationale: यह सामर्थ्य और विजयपूर्ण छुटकारे का स्थापित बाइबलीय रूपक है। ‘सींग’ को बनाए रखने से पुराने नियम की प्रतिध्वनि और मूल चित्र सुरक्षित रहते हैं; अर्थ स्पष्ट करने के लिए पाद-टिप्पणी दी गई है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: यह लाभ सूचक सम्प्रदान है और बताता है कि परमेश्वर का यह उद्धारकारी कार्य हमारे हित में है।
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: दाऊद के घराने में
  rationale: ‘घराना’ यहाँ वंश या राजवंश के अर्थ में स्वाभाविक हिन्दी है। ‘में’ यूनानी ἐν को दर्शाते हुए दाऊदी वंश के भीतर इस उद्धारकारी सामर्थ्य के प्रकट होने का भाव रखता है।
- source_word: παιδὸς αὐτοῦ
  choice: अपने सेवक
  rationale: दाऊद के लिए παῖς परमेश्वर के चुने हुए ‘सेवक’ के अर्थ में है; ‘बालक’ यहाँ भ्रामक होता।
theological_decisions:
- issue: ‘उद्धार का सींग’ रूपक को बनाए रखना या उसे ‘सामर्थी उद्धारकर्ता’ के रूप में खोलकर कहना
  choice: मुख्य पाठ में ‘उद्धार का एक सींग’ रूपक को बनाए रखा गया है।
  alternative: एक सामर्थी उद्धारकर्ता
  rationale: मूल यूनानी ठोस बाइबलीय रूपक प्रयोग करता है, जिसकी जड़ें पुराने नियम की राजकीय और विजयपूर्ण उद्धार-भाषा में हैं। इसे बनाए रखना साहित्यिक और धर्मवैज्ञानिक संबंधों को सुरक्षित रखता है, जबकि पाद-टिप्पणी सामान्य पाठक के लिए अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘घर’ के स्थान पर ‘घराना’ वंशगत अर्थ स्पष्ट करता है, जबकि ‘उद्धार का सींग’ मूल बाइबलीय रूपक को जानबूझकर सुरक्षित रखता है।
