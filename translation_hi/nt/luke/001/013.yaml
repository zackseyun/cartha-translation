id: LUK.1.13
reference: Luke 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: hi
  text: परन्तु स्वर्गदूत ने उससे कहा, “जकर्याह, मत डरो, क्योंकि तुम्हारी विनती[a] सुन ली गई है। तुम्हारी पत्नी इलीशिबा तुम्हारे लिए एक पुत्र को जन्म देगी, और तुम उसका नाम यूहन्ना रखोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी प्रार्थना।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम उसका नाम यूहन्ना पुकारोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: परन्तु ... ने कहा
  rationale: δέ यहाँ हल्का कथात्मक मोड़ दिखाता है; ‘परन्तु’ जकर्याह के भय के प्रत्युत्तर को स्पष्ट करता है, बिना प्रबल विरोध बनाए।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: इस प्रसंग में ἄγγελος एक स्वर्गीय दूत है; आधुनिक हिन्दी में ‘स्वर्गदूत’ स्वाभाविक और स्पष्ट है।
- source_word: Μὴ φοβοῦ
  choice: मत डरो
  rationale: यह निषेधात्मक आज्ञा जकर्याह की तत्काल भयभीत अवस्था को सहज आधुनिक हिन्दी में संबोधित करती है।
- source_word: ἡ δέησίς σου
  choice: तुम्हारी विनती
  rationale: δέησις विशेष रूप से प्रार्थनापूर्ण, earnest निवेदन को सूचित करता है। ‘विनती’ इस विशिष्टता को बनाए रखती है; ‘प्रार्थना’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: εἰσηκούσθη
  choice: सुन ली गई है
  rationale: अपूर्ण भूत कर्मवाच्य को वर्तमान परिणाम सहित व्यक्त किया गया है। कर्ता को मूल यूनानी की तरह अप्रकट रखा गया है।
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: तुम्हारी पत्नी इलीशिबा
  rationale: संबंधसूचक σου के साथ γυνή का अर्थ यहाँ स्पष्ट रूप से ‘पत्नी’ है। ‘इलीशिबा’ नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: γεννήσει υἱόν σοι
  choice: तुम्हारे लिए एक पुत्र को जन्म देगी
  rationale: स्त्री कर्ता के साथ γεννάω का अर्थ ‘जन्म देना’ है; σοι के संबंध अथवा हित के भाव को ‘तुम्हारे लिए’ से बनाए रखा गया है।
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: तुम उसका नाम यूहन्ना रखोगे
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप चुना गया है। भविष्यकाल मूल के रूप को बनाए रखता है, जिसमें प्रसंगानुसार निर्देश का बल भी है। शाब्दिक रचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘सुन ली गई है’ के अप्रकट कर्ता का संदर्भ
  choice: मूल की तरह कर्ता को अप्रकट रखा गया है; प्रसंग में परमेश्वर द्वारा विनती सुना जाना निहित है।
  alternative: स्पष्ट रूप से ‘परमेश्वर ने तुम्हारी विनती सुन ली है’ कहना।
  rationale: यहूदी प्रार्थना-प्रसंग में कर्मवाच्य स्वाभाविक रूप से परमेश्वर के कार्य की ओर संकेत करता है, पर यूनानी पाठ परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। अनुवाद इस निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- issue: καλέσεις का भविष्यकाल और निर्देशात्मक बल
  choice: ‘तुम ... रखोगे’
  alternative: ‘तुम ... रखना’ या ‘तुम ... रखोगे ही’
  rationale: रूपतः यह भविष्यकाल है, जबकि घोषणा के प्रसंग में इसमें निर्देश का भाव हो सकता है। भविष्यकाल रखने से दोनों पहलू खुले रहते हैं और बल अथवा आज्ञार्थ अनावश्यक रूप से नहीं बढ़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। जकर्याह के लिए ‘तुम’ का प्रयोग निकट प्रत्यक्ष संबोधन को स्वाभाविक रखता है। पारंपरिक किन्तु समझ में आने वाले हिन्दी बाइबलीय नाम-रूप ‘जकर्याह’, ‘इलीशिबा’ और ‘यूहन्ना’ रखे गए हैं।
