  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: hi
  text: जैसा उसने हमारे पितरों[a] से, अर्थात् अब्राहम और उसके वंश[b] से, सदा तक के लिए कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे पूर्वजों से।’ यूनानी में शब्दशः ‘हमारे पिताओं से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके बीज से।’ यूनानी में एकवचन सामूहिक संज्ञा है, जिसका अर्थ ‘बीज,’ ‘संतान’ या ‘वंशज’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: जैसा
  rationale: यह पिछले कथन के साथ अनुरूपता और परमेश्वर के पहले कहे वचन के अनुसार उसकी पूर्ति का संबंध व्यक्त करता है।
- source_word: ἐλάλησεν
  choice: कहा था
  rationale: भूतकाल में किए गए वचन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बोला था’ यहाँ कम सहज है।
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: हमारे पितरों से
  rationale: ‘पितरों’ यूनानी के पुल्लिंग बहुवचन को बनाए रखता है और इस्राएल के वाचा-संबंधी पूर्वजों की प्रतिध्वनि देता है।
- source_word: τῷ Ἀβραὰμ
  choice: अब्राहम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; विभक्ति ‘से’ पिछले पदबंध से लागू होती है।
- source_word: τῷ σπέρματι αὐτοῦ
  choice: उसके वंश से
  rationale: ‘वंश’ स्वाभाविक हिन्दी में एकवचन सामूहिक अर्थ बनाए रखता है और संतान/वंशजों के अर्थ की गुंजाइश देता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: यह स्थायी, अनंत काल तक बने रहने वाले अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πατέρας ἡμῶν की वाचा-संबंधी पुल्लिंग भाषा
  choice: हमारे पितरों
  alternative: हमारे पूर्वजों
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन है और यह इस्राएल के कुलपिताओं तथा वाचा के इतिहास की ओर संकेत करता है; अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
- issue: σπέρματι αὐτοῦ का सामूहिक एकवचन
  choice: उसके वंश
  alternative: उसके बीज; उसके वंशजों
  rationale: ‘वंश’ हिन्दी में सामूहिक एकवचन के रूप में स्वाभाविक है और अब्राहम की प्रतिज्ञा से जुड़ी अर्थ-प्रतिध्वनि को अनावश्यक रूप से किसी एक व्याख्या में सीमित नहीं करता; अधिक शब्दशः ‘बीज’ पादटिप्पणी में सुरक्षित है।
- issue: εἰς τὸν αἰῶνα का संबंध
  choice: मूल शब्दक्रम के निकट ‘सदा के लिए कहा था’
  alternative: उसके वंश के लिए सदा तक
  rationale: यूनानी में यह पद अंत में है और कथन/प्रतिज्ञा की चिरस्थायिता से जुड़ सकता है। हिन्दी में इसे अंत के निकट रखकर उस संबंध को खुला रखा गया है, यद्यपि वाक्यांश कुछ औपचारिक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी अपनाई गई है। ‘पितरों’ और ‘वंश’ जैसे परिचित बाइबलीय शब्द मूल की वाचा-संबंधी भाषा तथा सामूहिक एकवचन को बनाए रखते हैं; विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
