  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: hi
  text: और मेरी आत्मा परमेश्वर, मेरे उद्धारकर्ता, में मगन हो उठी है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आत्मा परमेश्वर, मेरे उद्धारकर्ता, में आनन्दित हुई है।”
    reason: ἠγαλλίασεν के लिए एक अधिक सीधा वैकल्पिक अनुवाद; “मगन हो उठी” इसके उमंगपूर्ण आनन्द को व्यक्त करता है।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद की समानांतर काव्य-पंक्ति को इस पंक्ति से जोड़ने वाला साधारण संयोजक है।
- source_word: ἠγαλλίασεν
  choice: आनन्द से भर उठी है
  rationale: यह क्रिया प्रबल और उमंगपूर्ण आनन्द व्यक्त करती है। यह हिन्दी प्रयोग उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है और यूनानी एओरिस्ट को इस स्तुति-काव्य के प्रसंग में पूर्ण भाव के साथ प्रस्तुत करता है।
- source_word: τὸ πνεῦμά μου
  choice: मेरी आत्मा
  rationale: यह मरियम के भीतरी अस्तित्व को सूचित करता है और पिछले पद के ‘मेरे प्राण’ से भिन्न मूल शब्द तथा काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: ἐπὶ τῷ θεῷ
  choice: परमेश्वर में
  rationale: ἀγαλλιάω के साथ ἐπί और सम्प्रदान कारक आनन्द के आधार या विषय को दर्शा सकते हैं। ‘परमेश्वर में’ स्वाभाविक हिन्दी है और सम्बन्धपरक केन्द्र को बनाए रखता है।
- source_word: τῷ σωτῆρί μου
  choice: मेरे उद्धारकर्ता
  rationale: σωτήρ का सीधा और नए नियम में स्थापित हिन्दी प्रतिशब्द ‘उद्धारकर्ता’ है; यह परमेश्वर के साथ समानाधिकरण सम्बन्ध को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर को ‘मेरे उद्धारकर्ता’ कहना
  choice: मेरे उद्धारकर्ता परमेश्वर
  alternative: मुझे छुड़ाने वाले परमेश्वर
  rationale: यूनानी पाठ सीधे परमेश्वर की पहचान मरियम के उद्धारकर्ता के रूप में करता है। चुना हुआ अनुवाद इस दावे को न तो हल्का करता है, न उससे आगे कोई साम्प्रदायिक निष्कर्ष जोड़ता है।
- issue: आस-पास की पंक्तियों में ‘प्राण’ और ‘आत्मा’ का सम्बन्ध
  choice: मूल के भिन्न शब्दों को भिन्न हिन्दी शब्दों में बनाए रखना
  alternative: दोनों को एक ही शब्द से अनूदित करना
  rationale: काव्यात्मक समानांतरता अर्थगत निकटता दिखाती है, पर यूनानी में अलग शब्द हैं। उन्हें अलग रखना इस साहित्यिक और धर्मवैज्ञानिक तनाव का समय से पहले समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘आनन्द से भर उठी है’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल क्रिया की प्रबलता व्यक्त करता है।
