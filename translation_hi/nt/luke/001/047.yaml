  rationale: संशोधन “आनन्द से भर उठी” के भावात्मक विस्तार को हटाकर ἠγαλλίασεν के लिए अधिक प्रत्यक्ष, उमंगपूर्ण क्रियात्मक अनुवाद देता है। “आत्मा,” “परमेश्वर,” और “उद्धारकर्ता” बनाए रखे गए हैं, और विराम-चिह्न यूनानी समानाधिकरण को हिन्दी में स्पष्ट करते हैं।
