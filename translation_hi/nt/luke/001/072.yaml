  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: hi
  text: ताकि वह हमारे पितरों पर दया दिखाए[c][a] और अपनी पवित्र वाचा को स्मरण करे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हमारे पितरों के साथ’; यूनानी अभिव्यक्ति इस्राएल के पितरों के सम्बन्ध में दया दिखाने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: बाइबिल की वाचा-सम्बन्धी भाषा में ‘स्मरण करना’ प्रायः केवल मन में याद करने के बजाय पहले की प्रतिज्ञा के अनुसार विश्वासयोग्य कार्य करना भी सूचित करता है।
    reason: cultural_note
  - marker: c
    text: ‘हमारे पितरों’ से आशय इस्राएल के पुरखों या कुलपिताओं से है; अनुवाद ‘हमारे पूर्वजों’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: दया करे
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी अर्थ ‘दया करना’ है; इससे उद्देश्यसूचक अनन्त क्रिया का भाव भी बना रहता है।
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों पर
  rationale: μετά का शाब्दिक अर्थ ‘साथ’ है, पर दया के इस मुहावरे में सम्बन्धित व्यक्तियों को हिन्दी में स्वाभाविक रूप से ‘पर’ से व्यक्त किया जाता है। πατέρες यहाँ इस्राएल के पुरखों को सूचित करता है, इसलिए आधुनिक पाठकों के लिए ‘पूर्वज’ स्पष्ट है।
- source_word: μνησθῆναι
  choice: स्मरण करे
  rationale: यह मूल क्रिया के ‘याद करने’ के अर्थ को बनाए रखता है और वाचा के सन्दर्भ में निहित विश्वासयोग्य कार्य को मुख्य पाठ में स्पष्ट करके अर्थ को सीमित नहीं करता।
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: अपनी पवित्र वाचा को
  rationale: διαθήκη के लिए इस उद्धार-ऐतिहासिक प्रसंग में ‘वाचा’ उपयुक्त है। αὐτοῦ का कर्ता परमेश्वर ही है; हिन्दी में उसी कर्ता की वस्तु होने के कारण ‘अपनी’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: परमेश्वर का वाचा को ‘स्मरण करना’
  choice: अपनी पवित्र वाचा को स्मरण करे
  alternative: अपनी पवित्र वाचा के अनुसार कार्य करे
  rationale: बाइबिलीय वाचा-भाषा में स्मरण प्रायः प्रतिज्ञा के अनुसार विश्वासयोग्य कार्य करने को भी सूचित करता है, पर मूल पाठ ‘स्मरण’ ही कहता है; अतः निहितार्थ को टिप्पणी में रखा गया है।
- issue: πατέρων ἡμῶν का संकेत
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: यह पद इस्राएल के पूर्वजों अथवा कुलपिताओं को सूचित करता है। ‘पूर्वज’ आधुनिक मानक हिन्दी में स्पष्ट और स्वाभाविक है, जबकि स्रोत का ऐतिहासिक-सामूहिक आशय सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती वाक्य पर आश्रित उद्देश्य-वाक्यांश है, इसलिए आरम्भ में ‘ताकि’ और अन्त में अल्पविराम रखा गया है।
