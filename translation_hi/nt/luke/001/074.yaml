  - marker: c
    text: परमेश्वर के लिए प्रयुक्त यह क्रिया “उपासना करना” भी दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: बिना डर के
  rationale: यह क्रियाविशेषण भय से मुक्त होकर सेवा करने का भाव व्यक्त करता है। ‘बिना डर के’ सहज आधुनिक हिन्दी है और ‘निडर होकर’ की तुलना में मूल अभिव्यक्ति की बनावट को अधिक निकटता से रखता है।
- source_word: ἐκ χειρός
  choice: हाथ से
  rationale: यह किसी के अधिकार या वश से छुटकारे का सामी मुहावरा है। ‘हाथ से’ मूल बिंब को सुरक्षित रखता है और हिन्दी में भी समझ में आता है।
- source_word: ἐχθρῶν
  choice: अपने शत्रुओं
  rationale: यूनानी में संबंधवाचक सर्वनाम स्पष्ट रूप से नहीं है, पर आस-पास के प्रथम पुरुष बहुवचन संदर्भ से शत्रुओं का संबंध ‘हम’ से निहित है। हिन्दी में ‘अपने’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ῥυσθέντας
  choice: छुड़ाए जाकर
  rationale: अओरिस्ट कर्मवाच्य कृदन्त उस छुटकारे को सेवा करने से पूर्व और उसके आधार के रूप में प्रस्तुत करता है। ‘छुड़ाए जाकर’ कर्मवाच्य और क्रियाओं के इस संबंध को बनाए रखता है।
- source_word: λατρεύειν
  choice: सेवा करें
  rationale: परमेश्वर के संबंध में यह क्रिया उपासना-भाव से की जाने वाली सेवा को दर्शा सकती है। ‘सेवा करें’ उपासना और आज्ञापालन दोनों की व्यापकता को बनाए रखता है।
- source_word: αὐτῷ
  choice: उसकी
  rationale: यह सर्वनाम पिछले संदर्भ के परमेश्वर की ओर संकेत करता है। हिन्दी में ‘उसकी सेवा करें’ स्वाभाविक रचना है।
theological_decisions:
- issue: परमेश्वर के प्रति λατρεύειν का अर्थ-क्षेत्र
  choice: उसकी सेवा करें
  alternative: उसकी उपासना करें
  rationale: क्रिया परमेश्वर को दी जाने वाली उपासना-सहित सेवा को व्यक्त करती है। ‘सेवा करें’ अर्थ को केवल आराधना के किसी धार्मिक कार्य तक सीमित नहीं करती, जबकि पादटिप्पणी उपासना का निहित भाव स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य पिछले पद से जुड़ा उद्देश्यवाचक खंड है, इसलिए आरंभ में ‘कि’ रखा गया है। ‘हाथ’ का बाइबलीय बिंब सुरक्षित है, और ‘सेवा’ के उपासना-संबंधी अर्थ को पादटिप्पणी में खुला रखा गया है।
