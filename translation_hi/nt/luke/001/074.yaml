translation:
  language: hi
  text: कि हम अपने शत्रुओं के हाथ[a] से छुड़ाए जाने के बाद, बिना भय के[b] उसकी सेवा[c] कर सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “हाथ” का अर्थ “अधिकार” या “वश” भी हो सकता है।
