id: LUK.1.35
reference: Luke 1:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: hi
  text: तब स्वर्गदूत ने उसे उत्तर दिया, “पवित्र आत्मा तुम पर आएगा, और परमप्रधान की सामर्थ्य तुम पर अपनी छाया डालेगी; इसलिए जो पवित्र जन जन्म लेने वाला है, वह परमेश्वर का पुत्र कहलाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: स्वर्गदूत ने उसे उत्तर दिया
  rationale: यूनानी कृदंत ἀποκριθείς उत्तर देने की भावभूमि रखता है; आधुनिक हिन्दी में ‘उत्तर दिया’ स्वाभाविक है। ἄγγελος का प्रसंगानुकूल अर्थ स्वर्गीय दूत है, इसलिए ‘स्वर्गदूत’ चुना गया।
- source_word: Πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: यहाँ पदबंध परमेश्वर के दिव्य आत्मा को सूचित करता है; हिन्दी में ‘पवित्र आत्मा’ स्पष्ट, प्रतिष्ठित और स्वाभाविक रूप है।
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: तुम पर आएगा
  rationale: यह चयन ἐπί के ‘पर’ संबंध और भावी सक्रिय आगमन, दोनों को निकटता से रखता है।
- source_word: δύναμις Ὑψίστου
  choice: परमप्रधान की सामर्थ्य
  rationale: Ὑψίστου को परमेश्वर की उपाधि के रूप में ‘परमप्रधान’ और δύναμις को गरिमापूर्ण, सामान्य बाइबलीय हिन्दी में ‘सामर्थ्य’ कहा गया है।
- source_word: ἐπισκιάσει σοι
  choice: तुम पर छाया करेगी
  rationale: यह छाया डालने अथवा आच्छादित करने की मूल उपमा को बनाए रखता है और दिव्य कार्य की प्रकृति के बारे में अनावश्यक जैविक या यौन विवरण नहीं जोड़ता।
- source_word: διὸ καὶ
  choice: इसलिए
  rationale: διό का परिणामसूचक बल स्पष्ट है। καί का प्रभाव पूरे अगले कथन पर पड़ सकता है; हिन्दी में ‘इसलिए’ अधिक स्वाभाविक है, जबकि कृत्रिम ‘इसलिए भी’ अर्थ को अस्पष्ट कर सकता है।
- source_word: τὸ γεννώμενον ἅγιον
  choice: जो जन्म लेगा, वह पवित्र
  rationale: नपुंसकलिंगी वर्तमान कर्मवाच्य कृदंत का शाब्दिक रूप ‘जो जन्म ले रहा है’ हो सकता है, पर घोषणा के भावी संदर्भ में ‘जो जन्म लेगा’ स्वाभाविक है। ἅγιον को विधेय विशेषण ‘पवित्र’ रखा गया है, न कि अनिवार्यतः पृथक उपाधि ‘पवित्र जन’।
- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: यह καλέω के नाम दिए जाने अथवा पहचान प्रकट होने—दोनों संभावित आयामों को बनाए रखता है।
- source_word: υἱὸς θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यूनानी में υἱός से पहले उपपद नहीं है, पर इस प्रसंग में पदबंध गुणात्मक अथवा उपाधिसूचक है, अनिश्चित ‘परमेश्वर का कोई पुत्र’ नहीं। हिन्दी में निश्चित पहचान प्रसंग से स्पष्ट होती है और अलग निश्चित उपपद की आवश्यकता नहीं।
theological_decisions:
- issue: Πνεῦμα ἅγιον में दिव्य कर्ता का संकेत
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/पवित्र वायु को किसी अवैयक्तिक शक्ति की तरह प्रस्तुत करना
  rationale: वाक्य में आत्मा आने वाला दिव्य कर्ता है और समानांतर खंड में परमप्रधान की सामर्थ्य कार्य करती है। अनुवाद पाठ से आगे बढ़े बिना दिव्य संदर्भ को स्पष्ट रखता है।
- issue: ἐπισκιάσει की दिव्य-उपस्थिति वाली उपमा
  choice: तुम पर छाया करेगी
  alternative: तुम्हें ढाँप लेगी
  rationale: ‘छाया करेगी’ मूल छाया-उपमा को अधिक प्रत्यक्ष रूप से बचाता है और गर्भधारण की प्रक्रिया के बारे में पाठ से बाहर कोई यांत्रिक या शारीरिक व्याख्या नहीं जोड़ता।
- issue: υἱὸς θεοῦ की निश्चित/उपाधिसूचक शक्ति
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का एक पुत्र
  rationale: उपपद का अभाव अपने आप अनिश्चितता सिद्ध नहीं करता। घोषणा के संदर्भ में यह बच्चे की विशिष्ट पहचान बताता है; ‘एक पुत्र’ कहना भ्रामक रूप से उसे अनेक समान पुत्रों में से एक बना सकता है।
- issue: τὸ γεννώμενον ἅγιον की वाक्यरचना
  choice: जो जन्म लेगा, वह पवित्र कहलाएगा—परमेश्वर का पुत्र
  alternative: जन्म लेनेवाला पवित्र जन परमेश्वर का पुत्र कहलाएगा
  rationale: यूनानी में ἅγιον को τὸ γεννώμενον के साथ विशेषण या κληθήσεται के साथ विधेय के रूप में समझने की कुछ वाक्यगत गुंजाइश है। चुना रूप ‘पवित्र’ और ‘परमेश्वर का पुत्र’ दोनों को कहलाने वाली पहचानों के रूप में पढ़ने देता है और अनावश्यक रूप से ‘पवित्र जन’ को स्थिर उपाधि नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘स्वर्गदूत’, ‘पवित्र आत्मा’, ‘परमप्रधान’, ‘सामर्थ्य’ और ‘परमेश्वर का पुत्र’ परिचित धार्मिक शब्दावली हैं। विरामचिह्न में दीर्घ डैश अंतिम समानाधिकरण/पहचान को स्पष्ट करता है, पर मूल की संभावित वाक्यगत तन्यता को पूरी तरह समाप्त नहीं करता। कोई पादटिप्पणी नहीं दी गई, क्योंकि उपलब्ध अंग्रेज़ी परत के पादटिप्पणी-चिह्न पाठ में उलटे जुड़े हुए प्रतीत होते हैं और हिन्दी में आवश्यक सूचनाएँ मुख्य अनुवाद तथा निर्णय-विवरण में पर्याप्त रूप से संभाली गई हैं।
