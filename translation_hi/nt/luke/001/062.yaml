translation:
  language: hi
  text: तब उन्होंने उसके पिता से इशारों में पूछा कि वह उसका नाम क्या रखना चाहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνένευον
  choice: इशारा करके पूछा
  rationale: क्रिया संकेतों या हाव-भाव से संवाद करने को दर्शाती है। हिन्दी में केवल ‘इशारा किया कि’ अस्वाभाविक है; ‘इशारा करके पूछा’ संकेत द्वारा पूछने का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है, जो घटना को आगे बढ़ाता है; प्रसंग में ‘तब’ सहज है।
- source_word: τῷ πατρὶ αὐτοῦ
  choice: उसके पिता को
  rationale: सम्प्रदान कारक उस व्यक्ति को बताता है जिसकी ओर संकेत किए गए थे।
- source_word: τὸ τί ἂν θέλοι
  choice: कि वह ... क्या ... चाहता है
  rationale: लेखयुक्त परोक्ष प्रश्न संकेत की विषयवस्तु बताता है। ἄν के साथ optative संभाव्यता या विनम्र अनिश्चितता रखता है, जिसे यहाँ स्वाभाविक हिन्दी में साधारण इच्छा के रूप में व्यक्त किया गया है।
- source_word: καλεῖσθαι αὐτό
  choice: उसका क्या नाम रखना
  rationale: यूनानी में शाब्दिक रूप से ‘उसे क्या कहलवाना/कहा जाना’ है। नामकरण के इस प्रसंग में ‘उसका क्या नाम रखना’ वर्तमान हिन्दी में स्वाभाविक है और आशय सुरक्षित रखता है।
