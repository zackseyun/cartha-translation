  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: hi
  text: उन दिनों के बाद[a] उसकी पत्नी इलीशिबा ने गर्भ धारण किया। वह पाँच महीने तक अपने को छिपाए रही[b], यह कहती हुई,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इन दिनों के बाद’ भी अनुवाद किया जा सकता है। यूनानी संकेतवाचक शब्द का यही सीधा अर्थ है, पर बीती घटना के वर्णन में हिन्दी में ‘उन दिनों’ अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने को छिपाकर रखा’ अथवा ‘एकांत में रही।’ यूनानी क्रिया का रूप पाँच महीने तक जारी रहने वाली स्थिति या क्रिया का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: उन दिनों के बाद
  rationale: μετά के साथ कर्मकारक यहाँ समयक्रम, अर्थात् ‘के बाद’, व्यक्त करता है। हिन्दी कथन-शैली में बीते हुए दिनों के लिए ‘उन दिनों’ स्वाभाविक है; ταύτας का अधिक शाब्दिक रूप ‘इन दिनों’ पाद-टिप्पणी में दिया गया है। हल्के संयोजक δέ का अलग अनुवाद आवश्यक नहीं है।
- source_word: συνέλαβεν
  choice: गर्भवती हुई
  rationale: इस प्रसंग में συλλαμβάνω का अर्थ संतान का गर्भ धारण करना है। आधुनिक हिन्दी में ‘गर्भवती हुई’ स्पष्ट और सहज है।
- source_word: Ἐλισάβετ
  choice: इलीशिबा
  rationale: यह नाम बाइबलीय हिन्दी में प्रचलित और मूल नाम के सेमिटिक रूप से निकट है।
- source_word: ἡ γυνὴ αὐτοῦ
  choice: उसकी पत्नी
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; संबंधसूचक αὐτοῦ और प्रसंग यहाँ ‘पत्नी’ को स्पष्ट करते हैं।
- source_word: περιέκρυβεν ἑαυτὴν
  choice: अपने को छिपाए रही
  rationale: आत्मवाचक ἑαυτήν को ‘अपने को’ व्यक्त करता है और अपूर्ण भूतकाल περιέκρυβεν की निरंतरता ‘छिपाए रही’ से स्वाभाविक रूप में प्रकट होती है।
- source_word: μῆνας πέντε
  choice: पाँच महीने तक
  rationale: कर्मकारक पद अवधि बताता है; हिन्दी में ‘तक’ उस अवधि को सहजता से व्यक्त करता है।
- source_word: λέγουσα
  choice: और कहती थी,
  rationale: वर्तमान कृदंत अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में ‘और कहती थी’ उसके संबंध को स्पष्ट रखते हुए निरंतर कथात्मक प्रवाह देता है।
