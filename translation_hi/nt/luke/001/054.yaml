lexical_decisions:
- source_word: ἀντελάβετο
  choice: सहायता की है
  rationale: यह क्रिया किसी को थामकर उसकी सहायता या समर्थन करने का भाव रखती है। वर्तमान प्रसंग में ‘सहायता की है’ स्वाभाविक हिन्दी में परमेश्वर के उद्धारकारी हस्तक्षेप को व्यक्त करता है।
- source_word: Ἰσραὴλ
  choice: इस्राएल
  rationale: नाम का प्रचलित हिन्दी रूप रखा गया है; यहाँ इससे सामूहिक रूप से इस्राएल की प्रजा अभिप्रेत है।
- source_word: παιδὸς
  choice: सेवक
  rationale: παῖς का अर्थ ‘सेवक’ या ‘सन्तान/बालक’ हो सकता है। यहाँ पुराने नियम में इस्राएल को परमेश्वर का सेवक कहे जाने की पृष्ठभूमि के कारण ‘सेवक’ को मुख्य पाठ में रखा गया है, जबकि वास्तविक शाब्दिक विकल्प को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: यह सम्बन्धवाचक सर्वनाम परमेश्वर की ओर संकेत करता है; हिन्दी में कर्ता के अनुसार ‘अपने’ स्वाभाविक है।
- source_word: μνησθῆναι
  choice: स्मरण करके
  rationale: अनन्त क्रिया मुख्य कार्य के साथ जुड़े कारण, उद्देश्य या सहगामी परिस्थिति का भाव दे सकती है। ‘स्मरण करके’ इस सम्बन्ध को सहज रखते हुए किसी एक व्याकरणिक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाता।
- source_word: ἐλέους
  choice: दया
  rationale: ἔλεος का सीधा अर्थ दया या करुणा है और इस प्रसंग में उसमें वाचा-संबंधी विश्वासयोग्य करुणा की प्रतिध्वनि भी हो सकती है। मुख्य पाठ में संक्षिप्त ‘दया’ रखा गया है।
theological_decisions:
- issue: इस्राएल के लिए παῖς का अर्थ
  choice: अपने सेवक इस्राएल
  alternative: अपनी सन्तान इस्राएल
  rationale: ‘सेवक’ पुराने नियम, विशेषकर यूनानी अनुवाद की सेवक-विषयक भाषा के अनुरूप है; फिर भी παῖς की पारिवारिक अर्थ-सम्भावना को पाद-टिप्पणी में बनाए रखा गया है।
- issue: μνησθῆναι ἐλέους का बल
  choice: दया का स्मरण करके
  alternative: दया को स्मरण करने के लिए
  rationale: यह पद परमेश्वर के स्मरण और उसकी सहायतापूर्ण क्रिया को जोड़ता है। कृदन्तीय हिन्दी उद्देश्य और सहगामी परिस्थिति के बीच यूनानी की सम्भावित लचीलेपन को सुरक्षित रखती है।
- issue: ἔλεος में वाचा-संबंधी आशय
  choice: मुख्य पाठ में ‘दया’
  alternative: वाचा की अटल दया
  rationale: प्रसंग में वाचा-संबंधी करुणामय विश्वासयोग्यता की ध्वनि सम्भव है, पर उसे मुख्य पाठ में स्पष्ट रूप से जोड़ना यूनानी शब्द से अधिक व्याख्यात्मक होता; इसलिए यह बात पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और आराधनात्मक गरिमा वाली रखी गई है। पंक्ति का अन्त अल्पविराम से किया गया है, क्योंकि यूनानी में वाक्य अगली आयत में आगे बढ़ता है। ‘सहायता की है’ हिन्दी के पूर्ण वर्तमान द्वारा गीत में वर्णित परमेश्वर के निर्णायक कार्य और उसके वर्तमान महत्व को व्यक्त करता है।
