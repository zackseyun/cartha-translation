  text: कि उसके लोगों को उनके पापों की क्षमा में उद्धार का ज्ञान दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके पापों की क्षमा के द्वारा’ या ‘उनके पापों की क्षमा से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: दे
  rationale: सप्रत्यय क्रियार्थक संज्ञा पूर्ववर्ती कथन के उद्देश्य को व्यक्त करती है; हिंदी में ‘कि ... दे’ इस आशय को स्वाभाविक रूप से रखता है।
- source_word: γνῶσιν
  choice: ज्ञान
  rationale: यह शब्द ज्ञान या समझ को दर्शाता है; ‘ज्ञान’ सीधा और गरिमापूर्ण समतुल्य है।
- source_word: σωτηρίας
  choice: उद्धार का
  rationale: संबंधकारक रूप को ‘ज्ञान’ के साथ ‘उद्धार का ज्ञान’ कहना स्वाभाविक है और लूका के संदर्भ में σωτηρία के धार्मिक आशय को बनाए रखता है।
- source_word: τῷ λαῷ αὐτοῦ
  choice: उसके लोगों को
  rationale: सम्प्रदान कारक ज्ञान पाने वालों को सूचित करता है। ‘उसके लोगों’ से वाचाई सामूहिकता का भाव बना रहता है।
- source_word: ἐν ἀφέσει
  choice: क्षमा में
  rationale: ἐν के क्षेत्र अथवा रीति-संबंधी खुलेपन को ‘में’ निकटता से सुरक्षित रखता है और इसे केवल साधन या कारण तक सीमित नहीं करता।
- source_word: ἁμαρτιῶν αὐτῶν
  choice: उनके पापों की
  rationale: बहुवचन ἁμαρτιῶν को ‘पापों’ और αὐτῶν को ‘उनके’ के रूप में स्पष्टतः रखा गया है।
theological_decisions:
- issue: उद्धार और पापों की क्षमा का संबंध
  choice: ‘पापों की क्षमा में’—उद्धार का ज्ञान क्षमा के संबंध और क्षेत्र में प्रस्तुत होता है।
  alternative: ‘पापों की क्षमा के द्वारा’ अथवा ‘पापों की क्षमा से’
  rationale: यूनानी ἐν ἀφέσει क्षेत्र, रीति या साधन की निकटवर्ती छटाएँ ग्रहण कर सकता है। ‘में’ मूल की अस्पष्टता और धार्मिक तनाव को बिना संकुचित किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली। पद पिछले वाक्य पर निर्भर उद्देश्य-उपवाक्य है, इसलिए आरंभ में ‘कि’ रखा गया है।
