  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “तुम्हारे रिश्तेदारों में कोई भी इस नाम से नहीं पुकारा जाता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: उन्होंने उससे कहा
  rationale: वर्णन में εἶπαν के लिए ‘कहा’ स्वाभाविक है, और बोलने की क्रिया के साथ πρὸς αὐτήν संबोधित व्यक्ति को दर्शाता है।
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: तुम्हारे रिश्तेदारों में कोई भी
  rationale: ἐκ का अंशसूचक भाव हिन्दी में ‘में कोई भी’ से स्वाभाविक रूप से व्यक्त होता है; συγγένεια यहाँ नातेदारी के लोगों, अर्थात रिश्तेदारों, को दर्शाता है।
- source_word: ὃς καλεῖται
  choice: नहीं पुकारा जाता
  rationale: वर्तमान कर्मवाच्य καλεῖται को निकटता से व्यक्त करता है और नाम से पुकारे जाने का अर्थ बनाए रखता है।
- source_word: τῷ ὀνόματι τούτῳ
  choice: इस नाम से
  rationale: हिन्दी में किसी नाम से पुकारे जाने की स्वाभाविक रचना ‘इस नाम से’ है; ‘इस’ τούτῳ के संकेत को बनाए रखता है।
theological_decisions: []
