  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: hi
  text: उन दिनों मरियम उठकर शीघ्रता से पहाड़ी प्रदेश में यहूदा के एक नगर[a] में गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के एक कस्बे में,” या “यहूदिया के एक नगर में।” यूनानी शब्द πόλις का अर्थ “नगर” या “कस्बा” हो सकता है, और Ἰούδα यहाँ यहूदा/यहूदिया के क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα δὲ
  choice: मरियम उठकर
  rationale: क्रियाविशेषणात्मक कृदन्त मुख्य क्रिया से पहले की सहायक घटना बताता है। हिंदी में ‘उठकर ... गई’ स्वाभाविक रूप से घटनाक्रम बनाए रखता है; δέ का हल्का संक्रमण अलग शब्द के बिना वाक्य-प्रवाह में व्यक्त हो जाता है।
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: उन दिनों
  rationale: यह समय-सूचक पदबंध का स्वाभाविक और निकट हिंदी रूप है।
- source_word: ἐπορεύθη
  choice: गई
  rationale: πορεύομαι की सामान्य गतिसूचक क्रिया को सरल, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἰς τὴν ὀρεινὴν
  choice: पहाड़ी प्रदेश में
  rationale: विशेषण का संज्ञात्मक प्रयोग किसी पहाड़ी अथवा ऊँचे भूभाग को दर्शाता है; ‘पहाड़ी प्रदेश’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: μετὰ σπουδῆς
  choice: शीघ्रता से
  rationale: संदर्भ में σπουδή तत्परता और जल्दी को सूचित कर सकता है। ‘शीघ्रता से’ यात्रा की तत्परता व्यक्त करता है, बिना भाव को केवल उत्सुकता तक सीमित किए।
- source_word: εἰς πόλιν Ἰούδα
  choice: यहूदा के एक नगर को
  rationale: πόλις नगर या बस्ती दोनों के लिए प्रयुक्त हो सकता है। अनिश्चित πόλιν के लिए ‘एक नगर’ उपयुक्त है, और Ἰούδα को यहाँ क्षेत्रीय/गोत्रीय नाम ‘यहूदा’ माना गया है।
theological_decisions:
- issue: Ἰούδα की पहचान
  choice: क्षेत्र अथवा गोत्र के नाम के रूप में ‘यहूदा’
  alternative: ‘यहूदिया का एक नगर’ अथवा ‘यहूदा नामक नगर’
  rationale: इस संदर्भ में Ἰούδα का क्षेत्रीय/गोत्रीय अर्थ सबसे स्वाभाविक है। ‘यहूदा’ यूनानी रूप के निकट रहता है और अनावश्यक रूप से किसी नगर का नाम निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘को गई’ लक्ष्य की ओर गति को स्पष्ट करता है, जबकि ‘पहाड़ी प्रदेश में’ उस क्षेत्र में प्रवेश का भाव रखता है।
