base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: hi
  text: उसी क्षण उसका मुँह खुल गया और उसकी जीभ भी खुल गई; और वह परमेश्वर को धन्य कहता हुआ बोलने लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, ‘वह बोल रहा था।’ यूनानी अपूर्ण भूतकाल बोलना आरम्भ करने के बजाय लगातार बोलते रहने पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: खुल गया
  rationale: यह ἀνοίγω का अओरिस्ट कर्मवाच्य रूप है। हिन्दी में ‘खुल गया’ अचानक हुई वाणी-पुनर्स्थापना को स्वाभाविक ढंग से व्यक्त करता है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; कोई स्पष्ट विरोध नहीं दर्शाता।
- source_word: στόμα
  choice: मुँह
  rationale: यह सीधा शारीरिक अर्थ है और वाणी लौटने के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: यह घटना की तात्कालिकता और अचानकपन को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: और उसकी जीभ भी
  rationale: यूनानी पाठ में जीभ का स्पष्ट उल्लेख है, पर उसके लिए ‘खुल गई’ या ‘बंधन खुल गया’ जैसा अलग क्रियापद नहीं दिया गया। यह अनुवाद उसी संक्षिप्त संरचना को बनाए रखता है।
- source_word: ἐλάλει
  choice: बोलने लगा
  rationale: λαλέω का अपूर्ण भूतकाल यहाँ बोलने की आरम्भिकता या जारी क्रिया—दोनों की गुंजाइश रखता है। पहले के गूंगेपन के प्रसंग में ‘बोलने लगा’ स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εὐλογῶν
  choice: धन्य कहते हुए
  rationale: वर्तमान कृदन्त उसके बोलने की रीति या विषय बताता है। ‘धन्य कहते हुए’ εὐλογέω का सीधा अर्थ सुरक्षित रखता है; केवल ‘स्तुति करते हुए’ कहना कुछ अधिक व्याख्यात्मक होता।
- source_word: τὸν θεόν
  choice: परमेश्वर को
  rationale: यह εὐλογῶν का कर्म है और आधुनिक मानक हिन्दी में परमेश्वर के लिए स्वाभाविक रूप है।
theological_decisions:
- issue: εὐλογῶν τὸν θεόν में परमेश्वर के प्रति प्रयुक्त ‘आशीष देना/धन्य कहना’ की भाषा
  choice: परमेश्वर को धन्य कहते हुए
  alternative: परमेश्वर की स्तुति करते हुए
  rationale: चुना हुआ रूप यूनानी ‘धन्य कहना’ को बनाए रखता है और उसे केवल सामान्य स्तुति में नहीं बदलता, जबकि हिन्दी में अर्थ भी समझ में आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘उसी क्षण’ तात्कालिकता को स्पष्ट करता है। ‘और उसकी जीभ भी’ की जानबूझकर संक्षिप्त रचना मूल यूनानी की वास्तविक दीर्घवृत्तता बनाए रखती है; पादटिप्पणी पारम्परिक विस्तृत अनुवाद को स्पष्ट करती है।
