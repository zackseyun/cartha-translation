source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: hi
  text: पर जब वह बाहर आया, तो वह उनसे बोल नहीं सका, और उन्होंने जान लिया कि उसने पवित्रस्थान[a] में एक दर्शन देखा था। वह उन्हें इशारे करता रहा और मूक[b] रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मंदिर में।” यहाँ प्रयुक्त यूनानी शब्द सामान्यतः पूरे मंदिर-परिसर के बजाय उसके पवित्रस्थान को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “बहरा” भी हो सकता है; कुछ प्रसंगों में यह बोलने और सुनने, दोनों की असमर्थता को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: जब वह बाहर आया
  rationale: कालसूचक रूप में अनूदित यह वाक्यांश मुख्य क्रिया से पहले की घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: वह उनसे बोल नहीं सका
  rationale: यह δύναμαι और क्रियार्थक रूप से व्यक्त वास्तविक असमर्थता को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἐπέγνωσαν
  choice: उन्होंने जान लिया
  rationale: सामने के प्रमाण से किसी निष्कर्ष पर पहुँचने का भाव व्यक्त होता है; ‘जान लिया’ इस प्रसंग में स्वाभाविक है।
- source_word: ὀπτασίαν
  choice: कोई दर्शन
  rationale: यहाँ शब्द अलौकिक या प्रकाशनात्मक दृश्य को सूचित करता है; ‘दर्शन’ प्रचलित और प्रसंगानुकूल है। अनिश्चितता व्यक्त करने के लिए ‘कोई’ रखा गया है।
- source_word: ἐν τῷ ναῷ
  choice: पवित्रस्थान में
  rationale: ναός पूरे मन्दिर-परिसर के बजाय विशेष रूप से उसके भीतरी पवित्रस्थान को सूचित करता है।
- source_word: ἦν διανεύων
  choice: इशारों में बात करता रहा
  rationale: परिप्रयुक्त अपूर्ण भूतकाल लगातार किए जा रहे संकेतों को दर्शाता है। यह हिन्दी अभिव्यक्ति संकेतों के संवादात्मक प्रयोजन को स्वाभाविक ढंग से स्पष्ट करती है।
- source_word: διέμενεν
  choice: बना रहा
  rationale: अपूर्ण भूतकाल में διαμένω उस अवस्था के जारी रहने को दर्शाता है।
- source_word: κωφός
  choice: मूक
  rationale: तत्काल प्रसंग बोल न सकने पर बल देता है। ‘मूक’ संक्षिप्त है और पहले कथन की अनावश्यक पुनरावृत्ति से बचता है; सम्भावित बधिरता को पाद-टिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: जकरयाह की अवस्था के सम्बन्ध में κωφός का अर्थ
  choice: मुख्य पाठ में ‘मूक’
  alternative: ‘बहरा’ अथवा ‘बहरा और मूक’
  rationale: इसी पद में बोल न सकने और इशारे करने का स्पष्ट उल्लेख है, इसलिए मुख्य पाठ वाणी की असमर्थता को सामने रखता है। फिर भी यूनानी शब्द कुछ प्रसंगों में बधिरता भी व्यक्त कर सकता है; इस सम्भावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पवित्रस्थान’ मूल के ναός और व्यापक मन्दिर-परिसर के बीच भेद बनाए रखता है। ‘इशारों में बात करता रहा’ निरन्तर क्रिया को सामान्य पाठक के लिए स्पष्ट करता है।
