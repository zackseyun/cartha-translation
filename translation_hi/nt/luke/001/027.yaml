source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: hi
  text: एक कुँवारी के पास, जिसकी मंगनी यूसुफ नाम के एक पुरुष से हुई थी, जो दाऊद के घराने का था; और उस कुँवारी का नाम मरियम था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: कुँवारी / कुँवारी
  rationale: यहाँ यूनानी शब्द का सामान्य और संदर्भानुकूल अर्थ ऐसी स्त्री है जिसने यौन-संबंध नहीं बनाया है। पद में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: ἐμνηστευμένην
  choice: जिसकी मंगनी हुई थी
  rationale: यह पूर्ण कृदंत एक स्थापित, औपचारिक विवाह-प्रतिज्ञा की अवस्था बताता है। आधुनिक हिन्दी में ‘मंगनी हुई थी’ स्वाभाविक है; पादटिप्पणी इसके तत्कालीन सामाजिक-कानूनी भार को स्पष्ट करती है।
- source_word: ἀνδρὶ
  choice: एक पुरुष से
  rationale: शब्द का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है, पर मंगनी के संदर्भ में ‘पति’ कहना विवाह की अवस्था को आवश्यकता से अधिक निश्चित कर देगा।
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: यूसुफ नाम के
  rationale: यह यूनानी नामकरण-वाक्यांश का स्वाभाविक हिन्दी रूप है।
- source_word: ἐξ οἴκου Δαυίδ
  choice: वह दाऊद के घराने का था
  rationale: ‘घराना’ वंश और राजवंश—दोनों की बाइबिलीय ध्वनि बनाए रखता है। अलग वाक्य में सर्वनाम के द्वारा इसे निकटतम पुरुष, यूसुफ, से जोड़ा गया है।
- source_word: Μαριάμ
  choice: मरियम
  rationale: ‘मरियम’ हिन्दी में इस नाम का स्थापित बाइबिलीय रूप है और यूनानी Μαριάμ के भी निकट है।
theological_decisions:
- issue: क्या παρθένος का अनुवाद ऐसा हो जो लूका के बाल्य-वृत्तांत में उसके कौमार्य-संबंधी अर्थ को बनाए रखे
  choice: कुँवारी
  alternative: युवती
  rationale: यूनानी शब्द, इसी पद में उसकी पुनरावृत्ति और निकट संदर्भ ‘कुँवारी’ का समर्थन करते हैं। ‘युवती’ यहाँ मूल के अर्थ को अनावश्यक रूप से अस्पष्ट कर देगी।
- issue: मंगनी की अवस्था में ἀνήρ को पति कहना या पुरुष
  choice: पुरुष
  alternative: पति
  rationale: मूल शब्द दोनों अर्थ रख सकता है, किंतु ἐμνηστευμένην के साथ यहाँ ‘पुरुष’ वैवाहिक अवस्था को समय से पहले पूर्ण विवाह के रूप में प्रस्तुत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य की निरंतरता है, इसलिए आरंभ ‘एक कुँवारी के पास’ से किया गया है। ‘कुँवारी’ की पुनरावृत्ति मूल पाठ के बलाघात को सुरक्षित रखती है।
