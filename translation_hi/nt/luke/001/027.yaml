  naturalness: The draft is generally clear, but ending the first clause with a full stop makes the verse unnecessarily choppy. Recasting the Davidic descriptor as a relative clause immediately after ‘पुरुष’ produces a more fluent Hindi sentence and makes its referent explicit.
  terminology: ‘कुँवारी,’ ‘मंगनी,’ ‘दाऊद के घराने,’ ‘यूसुफ,’ and ‘मरियम’ are appropriate modern Hindi biblical terminology. The footnote is accurate and maintains the distinction between formal betrothal and a merely modern informal engagement.
