  text: For no word from God will be impossible[a].
translation:
  language: hi
  text: क्योंकि परमेश्वर की ओर से कोई भी वचन असंभव नहीं होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर के लिए कुछ भी असंभव नहीं होगा।”
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद स्वर्गदूत के पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ ὅτι की व्याख्यात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἀδυνατήσει
  choice: असम्भव नहीं होगा
  rationale: ἀδυνατέω के भविष्यकाल का सीधा भाव ‘असम्भव होना’ है; नकार के साथ यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: παρὰ τοῦ θεοῦ
  choice: परमेश्वर की ओर से आया
  rationale: जननकारक के साथ παρά यहाँ स्रोत का बोध करा सकता है। ῥῆμα के साथ यह उस वचन की ओर संकेत करता है जो परमेश्वर की ओर से आता है।
- source_word: πᾶν
  choice: कोई भी
  rationale: नकारात्मक वाक्य में πᾶν की सार्वभौमिक शक्ति को हिन्दी में ‘कोई भी ... नहीं’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ῥῆμα
  choice: वचन
  rationale: ῥῆμα का अर्थ कथन, कही हुई बात या वचन हो सकता है। ‘वचन’ मूल पाठ में स्पष्ट वाचिक तत्व को बनाए रखता है और इसे केवल ‘बात’ या व्याख्यात्मक ‘प्रतिज्ञा’ तक सीमित नहीं करता।
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα का आशय
  choice: परमेश्वर की ओर से आया कोई भी वचन असम्भव नहीं होगा।
  alternative: परमेश्वर के लिए कुछ भी असम्भव नहीं होगा।
  rationale: दोनों अर्थ व्याकरण और अनुवाद-परम्परा में सम्भव हैं। मुख्य पाठ में ῥῆμα को ‘वचन’ के रूप में बनाए रखना यूनानी पाठ और मरियम को सुनाए गए दिव्य कथन के निकट है; व्यापक पारम्परिक अर्थ को पादटिप्पणी में रखा गया है, ताकि वास्तविक अर्थगत तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘परमेश्वर की ओर से आया’ स्रोत-संबंध को स्पष्ट करता है, जबकि पादटिप्पणी पारम्परिक सामर्थ्य-केंद्रित अर्थ सुरक्षित रखती है।
