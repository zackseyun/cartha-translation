  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: hi
  text: और ऐसा हुआ कि जब उसकी सेवा के दिन पूरे हो गए,[a] तब वह अपने घर चला गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सेवा’ से जकरयाह की याजक के रूप में निर्धारित मंदिर-सेवा का आशय है।
    reason: cultural_note
  - marker: b
    text: ‘घर’ का अर्थ उसका मकान या अधिक व्यापक रूप से उसका घर-परिवार हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: लूका की सामान्य कथात्मक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὡς
  choice: जब
  rationale: यहाँ यह समयसूचक उपवाक्य आरम्भ करता है; ‘जब’ संदर्भ के अनुसार सहज और सटीक है।
- source_word: ἐπλήσθησαν
  choice: पूरे हो गए
  rationale: निर्धारित दिनों की अवधि समाप्त होकर पूर्ण होने का भाव स्पष्ट करता है।
- source_word: λειτουργίας
  choice: सेवा
  rationale: मूल शब्द की उपासना-संबंधी सेवा का अर्थ संदर्भ में जकरयाह की निर्धारित याजकीय मन्दिर-सेवा है; संक्षिप्त मुख्य पाठ के साथ इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀπῆλθεν
  choice: लौट गया
  rationale: गन्तव्य उसका अपना घर है और संदर्भ बताता है कि वह सेवा पूरी करके वहाँ वापस गया; हिन्दी में यह ‘चला गया’ से अधिक स्वाभाविक है।
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: अपने घर
  rationale: οἶκος भौतिक मकान अथवा व्यापक अर्थ में घर-गृहस्थी का संकेत दे सकता है; हिन्दी ‘घर’ इस अर्थ-व्याप्ति को स्वाभाविक रूप से बनाए रखता है।
