base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: hi
  text: तब प्रभु का एक स्वर्गदूत उसे दिखाई दिया, जो धूप की वेदी की दाहिनी ओर खड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: ὁράω का यह अओरिस्ट कर्मवाच्य रूप इस कथात्मक प्रसंग में अकर्मक अर्थ ‘प्रकट हुआ/दिखाई दिया’ देता है। ‘उसे दिखाई दिया’ दर्शन के प्राप्तकर्ता को स्पष्ट रखते हुए स्वाभाविक हिन्दी है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को अगले घटनाक्रम की ओर बढ़ाता है; ‘तब’ अनावश्यक विरोध का भाव जोड़े बिना क्रम को सहज रूप से व्यक्त करता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: ὤφθη के साथ प्रयुक्त संप्रदान कारक उस व्यक्ति को बताता है जिसे स्वर्गदूत दिखाई दिया।
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: मन्दिर में हुए इस दर्शन के प्रसंग में ἄγγελος मनुष्य संदेशवाहक नहीं, स्वर्गीय दूत को सूचित करता है। आधुनिक हिन्दी में ‘स्वर्गदूत’ स्पष्ट और प्रचलित है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: सम्बन्धकारक पद ἄγγελος κυρίου को स्वाभाविक हिन्दी में ‘प्रभु का एक स्वर्गदूत’ कहा गया है।
- source_word: ἑστὼς
  choice: खड़ा था
  rationale: ἵστημι का पूर्णकालिक कृदन्त प्रकट होने के समय स्वर्गदूत की मुद्रा और स्थिति बताता है; हिन्दी की उपवाक्य रचना में ‘खड़ा था’ स्वाभाविक है।
- source_word: ἐκ δεξιῶν
  choice: दाहिनी ओर
  rationale: यह यूनानी मुहावरा किसी वस्तु के दाहिने भाग या ओर स्थित होने का बोध देता है।
- source_word: θυσιαστηρίου τοῦ θυμιάματος
  choice: धूप की वेदी
  rationale: सम्बन्धकारक पद उस वेदी की पहचान धूप चढ़ाने वाली वेदी के रूप में करता है; ‘धूप की वेदी’ संक्षिप्त, सटीक और प्रचलित हिन्दी है।
theological_decisions:
- issue: ἄγγελος κυρίου में κύριος का अनुवाद
  choice: प्रभु
  alternative: मालिक
  rationale: इस मन्दिर-दर्शन के धार्मिक प्रसंग में κύριος परमेश्वर के लिए प्रयुक्त उपाधि है। ‘प्रभु’ स्रोत की उपाधि को बनाए रखता है और कोई अतिरिक्त सम्प्रदायगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘प्रकट हुआ’ की तुलना में ‘उसे दिखाई दिया’ मूल के संप्रदान αὐτῷ को अधिक प्रत्यक्ष रूप से व्यक्त करता है।
