reference: Luke 1:58
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: hi
  text: और उसके पड़ोसियों और रिश्तेदारों ने सुना कि प्रभु ने उस पर बड़ी दया की थी, और उन्होंने उसके साथ आनंद मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: पड़ोसी
  rationale: यह शब्द आसपास रहने वालों को दर्शाता है; आधुनिक हिन्दी में ‘पड़ोसी’ स्वाभाविक और स्पष्ट है।
- source_word: συγγενεῖς
  choice: रिश्तेदार
  rationale: यह रक्त या कुल-संबंधियों के लिए सामान्य शब्द है; ‘रिश्तेदार’ सहज आधुनिक हिन्दी है।
- source_word: ἐμεγάλυνεν
  choice: बड़ी ... की
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बड़ा करना’ है, पर दया के साथ यह मुहावरा दया की महान अभिव्यक्ति को बताता है; ‘बड़ी दया की’ हिन्दी में अर्थ और बल दोनों बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: संदर्भ में यह परमेश्वर के लिए निश्चित दिव्य उपाधि है; हिन्दी बाइबलीय प्रयोग में ‘प्रभु’ स्पष्ट और प्रतिष्ठित है।
- source_word: ἔλεος
  choice: दया
  rationale: यह करुणामय कृपा को व्यक्त करता है; ‘दया’ इसका सबसे सीधा, परिचित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: μετ’ αὐτῆς
  choice: उस पर
  rationale: यद्यपि μετά का मूल अर्थ ‘साथ’ है, इस यूनानी मुहावरे में दया की प्राप्तकर्ता स्त्री है; हिन्दी में ‘उस पर बड़ी दया की’ स्वाभाविक और अर्थ-सटीक है।
- source_word: συνέχαιρον αὐτῇ
  choice: उन्होंने उसके साथ आनन्द मनाया
  rationale: संयुक्त क्रिया किसी के साथ मिलकर प्रसन्न होने का भाव देती है; यह अनुवाद सहभागिता को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς का मुहावरा
  choice: प्रभु ने उस पर बड़ी दया की है
  alternative: प्रभु ने उसके साथ अपनी दया को महान किया है
  rationale: वैकल्पिक रूप यूनानी संरचना को अधिक शाब्दिक ढंग से दर्शाता है, किंतु हिन्दी में अस्वाभाविक और अस्पष्ट है। चुना हुआ रूप दया की महानता तथा इलीशिबा को उसके प्राप्तकर्ता के रूप में स्पष्ट रखते हुए किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ता।
- issue: अंग्रेज़ी पाठ में possessive ‘his mercy’ का प्रतिनिधित्व
  choice: ‘अपनी’ को व्यक्त न करते हुए ‘बड़ी दया की’
  alternative: उस पर अपनी बड़ी दया प्रकट की
  rationale: यूनानी में αὐτοῦ दया को प्रभु की दया बताता है, पर हिन्दी वाक्य ‘प्रभु ने ... दया की’ में कर्ता-संबंध स्वतः स्पष्ट है। ‘अपनी’ जोड़ना संभव है, किंतु आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘आनन्द’ धार्मिक साहित्य में परिचित है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सीधी रखी गई है।
