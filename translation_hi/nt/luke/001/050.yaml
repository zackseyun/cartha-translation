base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: hi
  text: और उसकी दया पीढ़ी-दर-पीढ़ी उन लोगों के लिए है जो उसका भय मानते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पीढ़ियों और पीढ़ियों तक।” इसका आशय लगातार आने वाली पीढ़ियों तक उसकी दया बने रहने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: दया
  rationale: ‘दया’ जरूरतमंद पर की गई करुणा और कृपा को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करती है और मरियम के गीत के वाचा-संबंधी स्वर को अनावश्यक रूप से सीमित नहीं करती।
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: पीढ़ी से पीढ़ी तक
  rationale: यूनानी पदबंध लगातार आने वाली पीढ़ियों में दया के बने रहने को व्यक्त करता है। यह हिन्दी मुहावरा उसी विस्तार और निरंतरता को सहज रूप में रखता है; शाब्दिक रूप ‘पीढ़ियों और पीढ़ियों तक’ कम स्वाभाविक होता।
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: उन पर ... जो उसका भय मानते हैं
  rationale: संबंधित सम्प्रदान कारक दया पाने वालों को दर्शाता है। ‘भय मानना’ परमेश्वर के प्रति श्रद्धामय भय की बाइबलीय अभिव्यक्ति को बनाए रखता है, जबकि ‘उन पर’ लाभार्थी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यह संयोजक इस पंक्ति को मरियम के गीत की पिछली पंक्तियों से जोड़ता और उसके संचयी काव्य-प्रवाह को बनाए रखता है।
- source_word: αὐτοῦ / αὐτόν
  choice: उसकी / उसका
  rationale: दोनों सर्वनाम निकटवर्ती संदर्भ में परमेश्वर की ओर संकेत करते हैं; हिन्दी में सामान्य एकवचन सर्वनाम बिना व्याख्यात्मक सामग्री जोड़े संदर्भ को सुरक्षित रखते हैं।
theological_decisions:
- issue: परमेश्वर के संबंध में φοβέομαι का अर्थ
  choice: उसका भय मानते हैं
  alternative: उसका आदर करते हैं / उसके प्रति श्रद्धा रखते हैं
  rationale: यहाँ ‘भय’ केवल आतंक नहीं, बल्कि परमेश्वर के प्रति श्रद्धा, भक्ति और जवाबदेही से भरा भय है। मुख्य पाठ में ‘भय मानना’ रखने से बाइबलीय शब्दावली और उसका धार्मिक भार सुरक्षित रहता है; अधिक व्याख्यात्मक विकल्प अर्थ के तनाव को कुछ हद तक समतल कर देते।
- issue: दया की अवधि और उसके पात्रों का संबंध
  choice: दया उन पर है ... पीढ़ी से पीढ़ी तक
  alternative: पीढ़ियों और पीढ़ियों तक उसकी दया उसका भय मानने वालों के लिए है
  rationale: वाक्य विन्यास दया के पात्रों और पीढ़ियों तक उसकी निरंतरता—दोनों को स्पष्ट करता है, पर यह दावा नहीं करता कि हर पीढ़ी का प्रत्येक व्यक्ति स्वतः इसका पात्र है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। ‘भय मानते हैं’ प्रचलित बाइबलीय अभिव्यक्ति है और यहाँ श्रद्धामय भय को दर्शाती है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए अवधि-सूचक पद को अंत में रखा गया है।
