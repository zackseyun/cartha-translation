  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: hi
  text: और उनके आस-पास रहने वाले सभी लोगों पर भय[a] छा गया, और यहूदिया के पूरे पहाड़ी प्रदेश में इन सब बातों[b] की चर्चा हो रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भय’ में परमेश्वर के प्रत्यक्ष कार्य के कारण उत्पन्न विस्मय का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इन सब वचनों’ अथवा ‘इन सब घटनाओं’। यूनानी शब्द बोले गए शब्दों या उन घटनाओं—दोनों की ओर संकेत कर सकता है—जिनकी चर्चा हो रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας
  choice: सब लोगों पर ... छा गया
  rationale: यह स्वाभाविक हिन्दी मुहावरा भय के अचानक उन पर आ पड़ने को व्यक्त करता है और यूनानी पदबंध की घटनात्मक शक्ति बनाए रखता है।
- source_word: φόβος
  choice: भय
  rationale: यह मूल शब्द का सीधा अर्थ है; प्रसंग में परमेश्वर के कार्य के प्रति विस्मय का भाव भी संभव है, जिसे पादटिप्पणी में खुला रखा गया है।
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: उनके आस-पास रहने वाले सब लोग
  rationale: यह περιοικέω के निकट या चारों ओर रहने के स्थानिक अर्थ को स्पष्ट रूप से व्यक्त करता है, बिना इसे केवल ‘पड़ोसी’ तक सीमित किए।
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: यहूदिया के पूरे पहाड़ी प्रदेश में
  rationale: ‘पहाड़ी प्रदेश’ भौगोलिक अर्थ को आधुनिक और सहज हिन्दी में व्यक्त करता है; ‘पूरे’ व्यापक प्रसार दर्शाता है।
- source_word: διελαλεῖτο
  choice: चर्चा होने लगी
  rationale: अपूर्ण भूतकालीन कर्मवाच्य रूप लगातार और व्यापक रूप से बातचीत में इन बातों के फैलने का संकेत देता है।
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: इन सब बातों
  rationale: ῥήματα कथनों, बातों या बताई जा रही घटनाओं को सूचित कर सकता है; ‘बातों’ हिन्दी में इस अर्थ-विस्तार को सबसे सहज ढंग से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के प्रत्यक्ष कार्य के प्रत्युत्तर में φόβος का भाव
  choice: मुख्य पाठ में ‘भय’
  alternative: ‘विस्मय’ अथवा ‘श्रद्धामिश्रित भय’
  rationale: ‘भय’ मूल शब्द का सीधा अनुवाद है और यह तय नहीं करता कि प्रतिक्रिया केवल आतंक थी या उसमें श्रद्धापूर्ण विस्मय भी सम्मिलित था।
- issue: ῥήματα का संदर्भ
  choice: ‘बातों’
  alternative: ‘वचनों’ अथवा ‘घटनाओं’
  rationale: मूल शब्द बोले गए कथनों और जिन घटनाओं की चर्चा हो रही थी, दोनों की ओर संकेत कर सकता है; ‘बातों’ इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘छा गया’ और ‘चर्चा होने लगी’ स्वाभाविक हिन्दी हैं, जबकि मूल के भय, निरंतर चर्चा और ῥήματα की अर्थगत अस्पष्टता को सुरक्षित रखा गया है।
