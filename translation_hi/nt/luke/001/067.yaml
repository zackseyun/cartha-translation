  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: hi
  text: 'और उसका पिता ज़करयाह पवित्र आत्मा से भर गया और भविष्यवाणी की और कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: ज़करयाह
  rationale: व्यक्तिगत नाम का आधुनिक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: ὁ πατὴρ αὐτοῦ
  choice: उसका पिता
  rationale: यूनानी संबंधवाचक पदबंध का स्वाभाविक हिन्दी रूप; संदर्भ में ‘उसका’ नवजात यूहन्ना की ओर संकेत करता है।
- source_word: ἐπλήσθη
  choice: भर गया
  rationale: πίμπλημι के अओरिस्ट कर्मवाच्य का घटना-सूचक और सहज हिन्दी रूप, जिसमें किसी बाहरी कर्ता द्वारा परिपूर्ण किए जाने का भाव बना रहता है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा से
  rationale: πίμπλημι के साथ प्रयुक्त संबंधकारक को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है; लूका के प्रसंग में यह परमेश्वर के पवित्र आत्मा को सूचित करता है।
- source_word: ἐπροφήτευσεν
  choice: भविष्यवाणी करने लगा
  rationale: यहाँ क्रिया प्रेरित भविष्यसूचक वाणी के आरम्भ को बताती है; ‘करने लगा’ अगले पदों में आने वाली वाणी का स्वाभाविक परिचय देता है, यद्यपि यूनानी अओरिस्ट को केवल ‘भविष्यवाणी की’ भी कहा जा सकता है।
- source_word: λέγων
  choice: यह
  rationale: हिन्दी में ‘यह भविष्यवाणी करने लगा:’ λέγων द्वारा प्रस्तुत आगे की वाणी को बिना अस्वाभाविक ‘कहते हुए’ के स्पष्ट करता है।
- source_word: Καὶ
  choice: और
  rationale: लूका के कथात्मक प्रवाह और पूर्ववर्ती घटना से जोड़ को बनाए रखता है।
theological_decisions:
- issue: πνεύματος ἁγίου का संदर्भ
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/कोई पवित्र आत्मिक प्रभाव
  rationale: लूका-प्रेरितों में दैवी प्रेरणा के ऐसे प्रसंगों में यह पद परमेश्वर के पवित्र आत्मा को सूचित करता है; अनावश्यक सिद्धान्तात्मक विस्तार किए बिना उसी संदर्भ को रखा गया है।
- issue: ἐπροφήτευσεν का अर्थ
  choice: भविष्यवाणी करने लगा
  alternative: भविष्यवाणी की / भविष्यसूचक वाणी बोलने लगा
  rationale: ‘भविष्यवाणी’ केवल भविष्य बताने तक सीमित समझी जा सकती है, पर यहाँ आगे आने वाली परमेश्वर-प्रेरित घोषणा को प्रस्तुत करती है। प्रचलित बाइबलीय शब्द रखते हुए वाक्य को भाषिक रूप से सहज बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। पद में किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
