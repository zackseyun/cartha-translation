lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: छठे महीने में
  rationale: ἐν के साथ संप्रदान कारक काल-सूचक है। δέ हल्का कथात्मक संयोजक है, जिसे स्वाभाविक हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἀπεστάλη
  choice: भेजा गया
  rationale: अओरिस्ट कर्मवाच्य को सीधे कर्मवाच्य में रखा गया है; इससे भेजे जाने का भाव बना रहता है।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: इस प्रसंग में ἄγγελος एक स्वर्गीय दूत को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है।
- source_word: Γαβριὴλ
  choice: जिब्राईल
  rationale: व्यक्तिवाचक नाम को हिन्दी में प्रचलित बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर के पास से
  rationale: ἀπό + संबंध कारक यहाँ स्रोत को प्रमुखता देता है। ‘के पास से’ हिन्दी में इस स्रोत-भाव को ‘परमेश्वर द्वारा’ की अपेक्षा अधिक ठीक रखता है।
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: गलील के ... नगर में
  rationale: εἰς गंतव्य बताता है और τῆς Γαλιλαίας संबंध कारक है। हिन्दी में ‘गलील के ... नगर में’ निकट और स्वाभाविक है; ‘गलील प्रदेश के’ भी अर्थ की दृष्टि से सम्भव है।
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: नासरत नामक
  rationale: शाब्दिक अर्थ ‘जिसका नाम नासरत था’ है; ‘नासरत नामक’ संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ‘छठे महीने’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘छठे महीने’ रखा गया है; पादटिप्पणी में इसे इलीशिबा के गर्भ का छठा महीना बताया गया है।
  alternative: वर्ष का छठा महीना समझना, या मुख्य पाठ में ही ‘इलीशिबा के गर्भ के छठे महीने’ जोड़ना।
  rationale: निकटवर्ती संदर्भ (लूका 1:24, 36) इलीशिबा के गर्भ की ओर संकेत करता है, पर यूनानी पद इस बात को यहाँ दोहराता नहीं। इसलिए मूल की संक्षिप्तता मुख्य पाठ में सुरक्षित है।
- issue: परमेश्वर की भूमिका और ἀπὸ का बल
  choice: ‘परमेश्वर के पास से’
  alternative: ‘परमेश्वर द्वारा’
  rationale: कर्मवाच्य क्रिया में भेजने वाला परमेश्वर समझा जा सकता है, किन्तु ἀπό का प्रत्यक्ष बल स्रोत/प्रस्थान-बिंदु पर है। चुना हुआ रूप एजेंसी को अनावश्यक रूप से अग्रभूमि में नहीं लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘स्वर्गदूत’, ‘परमेश्वर’, ‘गलील’ और ‘नासरत’ जैसे प्रचलित बाइबलीय रूप रखे गए हैं। वाक्य-विन्यास यूनानी स्रोत के कर्मवाच्य और स्रोत-सूचक पदबंध को सुरक्षित रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
