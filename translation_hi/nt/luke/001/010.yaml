base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: hi
  text: और लोगों की सारी भीड़ धूप चढ़ाने के समय बाहर प्रार्थना कर रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: सारी भीड़
  rationale: πᾶν एकवचन सामूहिक संज्ञा πλῆθος के साथ उपस्थित पूरे समूह पर बल देता है; ‘सारी भीड़’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस समग्रता को बनाए रखता है।
- source_word: τοῦ λαοῦ
  choice: लोगों की
  rationale: λαός यहाँ मंदिर में एकत्र लोगों को सूचित करता है। पाठ स्पष्ट रूप से ‘इस्राएल’ नहीं कहता, इसलिए उसे जोड़ा नहीं गया।
- source_word: προσευχόμενον
  choice: प्रार्थना कर रही थी
  rationale: ἦν के साथ वर्तमान कृदन्त जारी क्रिया व्यक्त करता है। स्त्रीलिंग क्रिया हिन्दी की संज्ञा ‘भीड़’ के अनुरूप है।
- source_word: ἔξω
  choice: बाहर
  rationale: ἔξω का सीधा अर्थ ‘बाहर’ है। ‘पवित्रस्थान के बाहर’ कहना प्रसंग से संभव है, पर यूनानी पाठ से अधिक विशिष्ट होता।
- source_word: τῇ ὥρᾳ
  choice: के समय
  rationale: ὥρα यहाँ उपासना के निर्धारित अवसर को दर्शाता है। हिन्दी में ‘के समय’ स्वाभाविक है और अनिवार्यतः साठ मिनट की घड़ी का भाव नहीं देता।
- source_word: τοῦ θυμιάματος
  choice: धूप चढ़ाने
  rationale: θυμίαμα धूप को और इस मंदिर-प्रसंग में उसे विधिपूर्वक अर्पित किए जाने को सूचित करता है। ‘धूप चढ़ाने’ सामान्य हिन्दी में इस उपासना-कर्म को स्पष्ट करता है।
theological_decisions:
- issue: θυμίαμα में मंदिर-उपासना संबंधी शब्दावली
  choice: धूप चढ़ाने के समय
  alternative: धूप जलाने के समय
  rationale: मुख्य पाठ का ‘चढ़ाने’ याजकीय उपासना-कर्म को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक क्रियात्मक विकल्प सुरक्षित रखती है; इससे कोई बाद की सांप्रदायिक धारणा नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और मंदिर-उपासना के प्रसंग के अनुकूल है। ‘जनसमुदाय’ की अपेक्षा ‘लोगों की सारी भीड़’ ने πλῆθος और λαός दोनों को अलग-अलग प्रतिबिम्बित किया है।
