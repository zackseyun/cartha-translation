  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: hi
  text: पर वह उस संदेश से बहुत व्याकुल हो गई[a] और सोचती रही[b] कि यह कैसा अभिवादन हो सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस बात से’ अथवा ‘उस वचन के कारण।’ यूनानी λόγος का अर्थ ‘वचन,’ ‘कथन,’ ‘बात’ या ‘संदेश’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मन में विचार करती रही’ अथवा ‘सोच-विचार करती रही।’ यूनानी अपूर्ण भूतकाल निरंतर मनन का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले अभिवादन से मरियम की प्रतिक्रिया की ओर हल्का विरोध और कथात्मक मोड़ दिखाता है।
- source_word: ἐπὶ τῷ λόγῳ
  choice: उस संदेश से
  rationale: λόγος यहाँ स्वर्गदूत द्वारा अभी कही गई बात की विषय-वस्तु को दर्शाता है; ‘संदेश’ आधुनिक हिन्दी में स्वाभाविक है, और ‘से’ उसकी व्याकुलता के कारण को व्यक्त करता है।
- source_word: διεταράχθη
  choice: बहुत घबरा गई
  rationale: क्रिया गहराई से व्याकुल या विचलित होने का भाव रखती है; ‘बहुत’ उसके प्रबल भाव को व्यक्त करता है।
- source_word: διελογίζετο
  choice: सोचती रही
  rationale: अपूर्ण भूतकाल निरंतर भीतरी विचार-विमर्श दिखाता है; ‘रही’ इस जारी प्रक्रिया को स्पष्ट करता है।
- source_word: ποταπὸς
  choice: कैसा
  rationale: यह अभिवादन के प्रकार या स्वरूप के बारे में प्रश्न करता है; ‘कैसा’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: εἴη
  choice: हो सकता है
  rationale: परोक्ष प्रश्न में संभावनार्थक भाव की अनिश्चितता को सुरक्षित रखता है।
- source_word: ἀσπασμὸς
  choice: अभिवादन
  rationale: यह स्वर्गदूत के बोले हुए अभिवादन को दर्शाता है; ‘अभिवादन’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: οὗτος
  choice: यह
  rationale: यह अभी दिए गए विशिष्ट अभिवादन की ओर संकेत करता है।
theological_decisions:
- issue: मरियम की प्रतिक्रिया का स्वरूप
  choice: मरियम स्वर्गदूत के संदेश से बहुत घबराई और उसके अभिवादन के अर्थ पर विचार करती रही; पद उसके भीतर पापपूर्ण भय, अविश्वास या नैतिक दोष नहीं ठहराता।
  alternative: उसका घबराना स्वर्गदूत के दिखाई देने के कारण था, या उसकी प्रतिक्रिया अविश्वास प्रकट करती थी।
  rationale: यूनानी पाठ उसकी व्याकुलता को स्पष्ट रूप से कही गई बात से जोड़ता है और अविश्वास का निर्णय देने के बजाय निरंतर मनन को चित्रित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अभिवादन’ औपचारिक होते हुए भी प्रचलित है।
