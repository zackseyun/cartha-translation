  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: hi
  text: और वह याकूब के घराने पर सदा[a] राज्य करेगा, और उसके राज्य का अंत न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘युगों तक।’ यूनानी मुहावरा εἰς τοὺς αἰῶνας अनंत काल को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: राज्य करेगा
  rationale: भविष्यत् काल का यह क्रियारूप राजा के रूप में शासन करने को व्यक्त करता है। ‘राज्य करेगा’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा राजकीय अर्थ बनाए रखता है।
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: याकूब के घराने पर
  rationale: ἐπί के साथ यहाँ प्रभुत्व का अर्थ ‘पर’ है। ‘घराना’ वंश और सामूहिक समुदाय—दोनों का भाव देता है और वाचायी बाइबलीय अभिव्यक्ति को ‘इस्राएल’ या ‘परिवार’ कहकर व्याख्यायित नहीं करता।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा तक
  rationale: बहुवचन αἰῶνας वाला यह यूनानी मुहावरा अनन्त अवधि व्यक्त करता है। ‘सदा तक’ आधुनिक पाठक के लिए स्पष्ट है और साथ की पादटिप्पणी अधिक शब्दशः रूप बताती है।
- source_word: βασιλείας
  choice: राज्य
  rationale: βασιλεία का अर्थ राजकीय शासन या राज्य हो सकता है। यहाँ ‘अन्त न होगा’ के साथ ‘राज्य’ स्वाभाविक है और मूल की अर्थगत व्यापकता को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: οὐκ ἔσται τέλος
  choice: अन्त न होगा
  rationale: यह नकारात्मक भविष्यकालीन अस्तित्ववाचक कथन है। ‘अन्त न होगा’ संक्षिप्त, स्वाभाविक और मूल के बल को सुरक्षित रखता है।
theological_decisions:
- issue: ‘याकूब के घराने’ का दायरा
  choice: ‘याकूब के घराने’ को ज्यों का त्यों बनाए रखा गया है।
  alternative: ‘इस्राएल के लोग’ या ‘परमेश्वर के लोग’
  rationale: मूल वाक्यांश वाचायी और सामूहिक पहचान रखता है। उसका विस्तार या पुनर्परिभाषा करना बाद की धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में ले आएगा।
- issue: राज्य की अवधि
  choice: εἰς τοὺς αἰῶνας को ‘सदा तक’ और οὐκ ἔσται τέλος को ‘अन्त न होगा’ अनूदित किया गया है।
  alternative: ‘युगों तक’
  rationale: मुख्य पाठ अनन्त अवधि का स्पष्ट आशय बताता है, जबकि पादटिप्पणी यूनानी मुहावरे का अधिक शब्दशः विकल्प सुरक्षित रखती है।
- issue: βασιλεία की अर्थगत सम्भावना
  choice: ‘राज्य’
  alternative: ‘राज’ या ‘शासन’
  rationale: यूनानी शब्द राजकीय शासन और राज्य—दोनों को सूचित कर सकता है। प्रसंग में ‘राज्य’ सहज है, पर इसे किसी विशेष राजनीतिक या सम्प्रदायगत धारणा से नहीं भरा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण बाइबलीय शैली अपनाई गई है। ‘घराना’, ‘राज्य करेगा’ और ‘अन्त’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की वाचायी तथा राजकीय भाषा को सुरक्षित रखते हैं।
