id: LUK.1.41
reference: Luke 1:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: hi
  text: और ऐसा हुआ कि जब एलिज़ाबेथ ने मरियम का अभिवादन सुना, तो उसके गर्भ में बच्चा उछल पड़ा, और एलिज़ाबेथ पवित्र आत्मा से भर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य कथा-सूत्र अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὡς
  choice: जब
  rationale: अओरिस्ट क्रिया के साथ यह तत्काल समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀσπασμός
  choice: अभिवादन
  rationale: यह मरियम के बोले हुए अभिवादन के लिए स्पष्ट, सम्मानपूर्ण और प्रचलित हिन्दी शब्द है।
- source_word: Μαρίας
  choice: मरियम का
  rationale: सम्बन्धकारक का स्वाभाविक हिन्दी रूप; नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: ἐσκίρτησεν
  choice: उछल पड़ा
  rationale: यह अचानक और सजीव गर्भगत हलचल की क्रिया को स्पष्टता से व्यक्त करता है।
- source_word: βρέφος
  choice: बच्चा
  rationale: यहाँ गर्भस्थ यूहन्ना के लिए सहज और सटीक आधुनिक हिन्दी पद है।
- source_word: κοιλία
  choice: गर्भ
  rationale: इस प्रसंग में शब्द विशेष रूप से गर्भ को सूचित करता है; यह सटीक और गरिमापूर्ण है।
- source_word: ἐπλήσθη
  choice: भर गई
  rationale: निष्क्रिय क्रिया का स्वाभाविक हिन्दी रूप, जो कर्ता को अनावश्यक रूप से स्पष्ट किए बिना दिव्य क्रिया का संकेत बनाए रखता है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा
  rationale: लूका-प्रेरितों के प्रयोग और भविष्यद्वाणी-संबंधी प्रसंग में यह परमेश्वर के आत्मा का स्वाभाविक हिन्दी निरूपण है।
theological_decisions:
- issue: πνεύματος ἁγίου का अभिप्रेत संदर्भ
  choice: परमेश्वर के दिव्य पवित्र आत्मा के रूप में “पवित्र आत्मा”
  alternative: “किसी पवित्र आत्मा” या “पवित्र प्रेरणा”
  rationale: लूका-प्रेरितों में यह अभिव्यक्ति नियमित रूप से दिव्य पवित्र आत्मा को सूचित करती है, और यहाँ प्रसंग भविष्यद्वाणी की प्रेरणा का है। अनावश्यक सिद्धान्तात्मक विस्तार नहीं जोड़ा गया।
- issue: गर्भस्थ यूहन्ना के लिए βρέφος
  choice: बच्चा
  alternative: शिशु
  rationale: “बच्चा” मूल के ठोस और मानवीय संदर्भ को सहज आधुनिक हिन्दी में बनाए रखता है; “शिशु” भी संभव है, पर अधिक औपचारिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। “एलिज़ाबेथ” और “मरियम” प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। मूल में वास्तविक पाठगत या अर्थगत अस्पष्टता ऐसी नहीं है जिसके लिए इस पद में पादटिप्पणी आवश्यक हो।
