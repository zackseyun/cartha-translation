  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: hi
  text: याजकीय सेवा की प्रथा के अनुसार, प्रभु के मंदिर[a] में जाकर धूप जलाने के लिए चिट्ठी उसके नाम निकली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के पवित्रस्थान में।” यहाँ यूनानी शब्द ναός है, जो प्रायः पूरे मंदिर-परिसर के बजाय मंदिर-भवन या उसके पवित्रस्थान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: याजकीय सेवा की प्रथा के अनुसार
  rationale: यह पदबंध स्थापित याजकीय रीति और सेवा-व्यवस्था के अनुरूप कार्य किए जाने को व्यक्त करता है। ‘याजकीय सेवा’ ἱερατεία के पद और सेवा, दोनों पक्षों को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: ἔλαχε
  choice: चिट्ठी उसके नाम निकली
  rationale: λαγχάνω यहाँ चिट्ठी डालकर किसी दायित्व के मिलने को दर्शाता है। यह हिन्दी प्रयोग चयन की विधि और उसके परिणाम, दोनों को स्पष्ट रखता है।
- source_word: τοῦ θυμιᾶσαι
  choice: धूप जलाने के लिए
  rationale: यह सव्यय क्रियार्थक संज्ञा चिट्ठी से मिले कार्य को बताती है; θυμιάω का आशय धूप जलाने अथवा चढ़ाने से है।
- source_word: εἰσελθὼν εἰς
  choice: में जाकर
  rationale: अओरिस्ट कृदन्त मुख्य कार्य से जुड़ी प्रवेश-क्रिया व्यक्त करता है। ‘में जाकर’ स्वाभाविक हिन्दी में इस संबंध को रखता है, बिना अनावश्यक रूप से समय-क्रम पर बल दिए।
- source_word: τὸν ναὸν τοῦ κυρίου
  choice: प्रभु के मंदिर
  rationale: ναός मंदिर-भवन, और इस प्रसंग में विशेष रूप से उसके पवित्रस्थान, का बोध करा सकता है। मुख्य पाठ में सरल और परिचित ‘मंदिर’ रखा गया है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मंदिर-संबंधी प्रसंग में ναός का अनुवाद
  choice: मंदिर
  alternative: पवित्रस्थान
  rationale: ναός प्रायः व्यापक मंदिर-परिसर के बजाय मंदिर-भवन या भीतरी पवित्रस्थान को दर्शाता है। धूप चढ़ाने के प्रसंग में ‘पवित्रस्थान’ अधिक विशिष्ट हो सकता है, पर सामान्य पाठक के लिए मुख्य पाठ में ‘मंदिर’ स्वाभाविक है; विशिष्ट विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘चिट्ठी उसके नाम निकली’ सामान्य पाठक के लिए चिट्ठी डालकर चयन किए जाने की प्रथा को सहज रूप से व्यक्त करता है।
