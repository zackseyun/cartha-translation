  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: hi
  text: पर मरियम ने स्वर्गदूत से कहा, “यह कैसे होगा, क्योंकि मैं किसी पुरुष को नहीं जानती[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “मैंने किसी पुरुष के साथ यौन संबंध नहीं बनाए हैं।” यूनानी में “पुरुष को जानना” यौन संबंध के लिए प्रयुक्त एक शिष्ट अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह जिब्राईल की घोषणा के उत्तर में मरियम के प्रश्न की हल्की विरोधात्मक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘और’ भी संभव है, पर यहाँ ‘पर’ अधिक उपयुक्त है।
- source_word: Μαριὰμ
  choice: मरियम
  rationale: बाइबलीय हिन्दी में इस नाम का मानक और व्यापक रूप।
- source_word: πρὸς τὸν ἄγγελον
  choice: स्वर्गदूत से
  rationale: ἄγγελος का मूल अर्थ ‘दूत’ हो सकता है, किंतु लूका के इस प्रसंग में वह स्पष्टतः स्वर्गीय प्राणी है; ‘स्वर्गदूत’ सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: Πῶς ἔσται τοῦτο
  choice: यह कैसे होगा
  rationale: भविष्यकालीन प्रश्न को सरल, स्वाभाविक हिन्दी में व्यक्त करता है और τοῦτο को ‘यह’ के रूप में बनाए रखता है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: मरियम के प्रश्न का कारण प्रस्तुत करता है; इस वाक्य में ‘क्योंकि’ आधुनिक हिन्दी में सहज है।
- source_word: ἄνδρα
  choice: किसी पुरुष को
  rationale: ἀνήρ यहाँ ‘पुरुष’ अथवा ‘पति’ हो सकता है, किंतु γινώσκω के साथ यह यौन संबंध का शिष्ट मुहावरा है। ‘किसी पुरुष’ मूल की व्यापकता बनाए रखता है और अर्थ को केवल पति तक सीमित नहीं करता।
- source_word: οὐ γινώσκω
  choice: नहीं जानती
  rationale: ग्रीक के वर्तमानकालीन शिष्ट मुहावरे को औपचारिक रूप से सुरक्षित रखता है। प्रसंग में इसका आशय यौन संबंध न होने से है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: मरियम का कथन और यीशु का कुँवारी से गर्भधारण
  choice: मुख्य पाठ में ‘मैं किसी पुरुष को नहीं जानती’ का शिष्ट मुहावरा बनाए रखा गया।
  alternative: ‘मेरे किसी पुरुष के साथ शारीरिक संबंध नहीं हुए हैं’ अथवा ‘मैं कुँवारी हूँ।’
  rationale: ग्रीक पाठ सीधे ‘कुँवारी’ शब्द नहीं कहता, बल्कि ‘पुरुष को जानना’ मुहावरे का प्रयोग करता है। मुख्य पाठ में इसे बनाए रखने से स्रोत की अभिव्यक्ति और उसका अंतर्निहित अर्थ दोनों सुरक्षित रहते हैं; पादटिप्पणी आधुनिक पाठक के लिए यौन आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरुष को जानना’ स्रोत-पाठ के शिष्ट मुहावरे को सुरक्षित रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
