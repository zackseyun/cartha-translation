  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: hi
  text: और मरियम ने कहा, “देखिए, मैं प्रभु की दासी हूँ।[a] आपके वचन के अनुसार मेरे साथ ऐसा ही हो।”[b] और स्वर्गदूत उससे विदा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु की सेविका।” यूनानी δούλη का अर्थ स्त्री दास अथवा सेविका हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “आपके वचन के अनुसार मुझे ऐसा ही हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; हिन्दी में ‘तब’ प्रसंग के स्वाभाविक क्रम को व्यक्त करता है, बिना किसी तीव्र विरोध का भाव जोड़े।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह मरियम की गंभीर आत्म-प्रस्तुति की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक तथा सम्मानपूर्ण है।
- source_word: δούλη
  choice: दासी
  rationale: स्त्रीलिंग संज्ञा दासत्व अथवा सेविका की स्थिति बता सकती है। ‘दासी’ विनम्र अधीनता और मूल शब्द की प्रबल सामाजिक छाया, दोनों को ‘सेविका’ से अधिक निकटता से रखती है।
- source_word: κυρίου
  choice: प्रभु की
  rationale: ईश्वर के लिए प्रयुक्त उपाधि κύριος को प्रचलित बाइबलीय हिन्दी ‘प्रभु’ से व्यक्त किया गया है।
- source_word: γένοιτό μοι
  choice: मेरे साथ ऐसा ही हो
  rationale: ऑप्टेटिव रूप मरियम की इच्छापूर्ण स्वीकृति व्यक्त करता है; यह हिन्दी वाक्य न तो केवल भविष्यवाणी बनता है, न आज्ञा, बल्कि सहमतिपूर्ण कामना बनाए रखता है।
- source_word: κατὰ τὸ ῥῆμά σου
  choice: आपके वचन के अनुसार
  rationale: यह स्वर्गदूत द्वारा अभी कही गई घोषणा के अनुरूप होने का भाव रखता है; ‘वचन’ मूल ῥῆμα की परंपरागत और प्रसंगानुकूल अभिव्यक्ति है।
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: उसके पास से चला गया
  rationale: यह हिन्दी में स्वाभाविक रूप से बताता है कि स्वर्गदूत मरियम की उपस्थिति से विदा हुआ।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: इस प्रसंग में यह मानवीय संदेशवाहक नहीं, स्वर्गीय दूत है; ‘स्वर्गदूत’ सामान्य आधुनिक हिन्दी पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: मरियम के आत्म-परिचय δούλη का अनुवाद
  choice: प्रभु की दासी
  alternative: प्रभु की सेविका
  rationale: मूल शब्द स्त्री दास या सेविका दोनों अर्थ-क्षेत्र रखता है। ‘दासी’ मरियम की गहरी विनम्रता और पूर्ण अधीनता को बनाए रखता है, पर पादटिप्पणी अधिक कोमल विकल्प भी बताती है।
- issue: γένοιτό μοι की भाववाचक शक्ति
  choice: मेरे साथ ऐसा ही हो
  alternative: मेरे लिए ऐसा ही होने पाए
  rationale: मूल ऑप्टेटिव मरियम की स्वेच्छापूर्ण सहमति और कामना व्यक्त करता है। चुना हुआ पाठ इसे सरल आधुनिक हिन्दी में रखता है, बिना इसे निष्क्रिय भविष्यवाणी या आदेश बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और गरिमामय शैली। स्वर्गदूत को संबोधित करते समय ‘आपके’ रखा गया है। ‘देखिए’ मूल के ध्यानाकर्षक Ἰδοὺ को सहज हिन्दी में व्यक्त करता है; ‘दासी’ मूल शब्द की अधीनता की शक्ति को सुरक्षित रखता है।
