  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: hi
  text: क्योंकि, देखो, जब तुम्हारे अभिवादन की आवाज़ मेरे कानों में पड़ी, तो मेरे गर्भ में बच्चा आनंद से उछल पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाले जीवंत संवाद-सूचक का बल बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से व्याख्यात्मक सम्बन्ध को सहज हिन्दी में व्यक्त करता है।
- source_word: ὡς ἐγένετο
  choice: जैसे ही ... पड़ी
  rationale: सन्दर्भ में यह उस समय को सूचित करता है जब अभिवादन सुनाई दिया; ‘जैसे ही’ घटना की तत्कालता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: तुम्हारे अभिवादन की आवाज़
  rationale: यह अभिवादन के सुनाई देने वाले स्वर को ठोस और सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τὰ ὦτά μου
  choice: मेरे कानों में
  rationale: हिन्दी मुहावरे ‘कानों में पड़ना’ द्वारा दिशा और श्रवण का भाव स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: ἐσκίρτησεν
  choice: उछल पड़ा
  rationale: यह अचानक हुई जीवंत शारीरिक गति को स्पष्ट करता है।
- source_word: ἐν ἀγαλλιάσει
  choice: आनन्द से
  rationale: यह उल्लासपूर्ण आनन्द के रीति-भाव को साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण हिन्दी में देता है।
- source_word: τὸ βρέφος
  choice: बच्चा
  rationale: βρέφος यहाँ गर्भस्थ शिशु को दर्शाता है; ‘बच्चा’ स्वाभाविक और ठोस है तथा पाठ से परे कोई दावा नहीं जोड़ता।
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: मेरे गर्भ में
  rationale: इस सन्दर्भ में κοιλία का सटीक आशय गर्भ है।
theological_decisions:
- issue: गर्भस्थ यूहन्ना के लिए βρέφος का अनुवाद
  choice: बच्चा
  alternative: शिशु
  rationale: यूनानी शब्द गर्भस्थ या बहुत छोटे बच्चे के लिए प्रयुक्त हो सकता है। ‘बच्चा’ पाठ के अपने वर्णन को बनाए रखते हुए अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘क्योंकि देखो’ मूल के γὰρ और ἰδοὺ दोनों को सुरक्षित रखता है, जबकि ‘कानों में पड़ी’ स्वाभाविक हिन्दी मुहावरा है।
