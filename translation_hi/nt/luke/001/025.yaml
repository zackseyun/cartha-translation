  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: hi
  text: “क्योंकि प्रभु ने मेरे साथ ऐसा किया है; इन दिनों उसने मेरी ओर ध्यान दिया है, ताकि लोगों के बीच मेरा अपमान दूर कर दे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपमान” का अर्थ यहाँ लोगों के बीच होने वाली बदनामी या सामाजिक लज्जा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह एलिज़ाबेथ के कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और पिछले प्रसंग से स्वाभाविक रूप से जुड़ता है।
- source_word: Οὕτως μοι πεποίηκεν
  choice: मेरे लिए ऐसा ही किया है
  rationale: यह यूनानी मुहावरे के व्यक्तिगत और अनुग्रहपूर्ण दिव्य कार्य को सहज हिन्दी में व्यक्त करता है; ‘ऐसा ही’ Οὕτως के बल को बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि को उसके धार्मिक भार सहित स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν ἡμέραις αἷς
  choice: इन दिनों
  rationale: निकट वर्तमान कालावधि को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπεῖδεν
  choice: उसने मुझ पर कृपादृष्टि की
  rationale: क्रिया में केवल देखने से अधिक ध्यान और अनुकूल दृष्टि का भाव है; प्रसंग में यह हिन्दी प्रयोग उस दिव्य कृपापूर्ण ध्यान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀφελεῖν
  choice: दूर कर दे
  rationale: अपमान को हटा देने के उद्देश्य या परिणाम को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ὄνειδός μου
  choice: मेरा अपमान
  rationale: यह सामाजिक निंदा और अनादर के बाहरी आयाम को ‘लज्जा’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: ἐν ἀνθρώποις
  choice: लोगों के बीच
  rationale: यह उस सामाजिक क्षेत्र को व्यक्त करता है जिसमें अपमान अनुभव किया गया था और यूनानी के सामान्य मानवीय संदर्भ को लिंग-समावेशी हिन्दी में रखता है।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: प्रभु, अर्थात इस प्रसंग में परमेश्वर
  alternative: इस स्थान पर कोई प्रमुख वैकल्पिक संदर्भ नहीं
  rationale: एलिज़ाबेथ परमेश्वर द्वारा उसके बाँझपन और उससे जुड़े सामाजिक अपमान को दूर करने की बात कर रही है; अनावश्यक रूप से अधिक संकीर्ण मसीह-संबंधी अर्थ नहीं जोड़ा गया।
- issue: ὄνειδος का सामाजिक अर्थ
  choice: अपमान
  alternative: बदनामी; लज्जा
  rationale: प्रसंग में मुख्य बात समाज की दृष्टि में होने वाला अनादर है। ‘अपमान’ इस बाहरी, सामुदायिक आयाम को बनाए रखता है और केवल भीतरी भावनात्मक लज्जा तक अर्थ सीमित नहीं करता।
- issue: ἐπεῖδεν में दिव्य अनुकूल दृष्टि
  choice: कृपादृष्टि की
  alternative: मेरी ओर देखा; मेरा ध्यान रखा
  rationale: क्रिया ध्यानपूर्वक देखने का भाव रखती है और प्रसंग में दृष्टि अनुकूल है। ‘कृपादृष्टि’ इसे स्वाभाविक हिन्दी में व्यक्त करती है, पर उद्देश्यसूचक अगले वाक्यांश से अलग कोई नई धार्मिक धारणा नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कृपादृष्टि’ बाइबिलीय धार्मिक शैली में परिचित है, जबकि शेष वाक्य विन्यास वर्तमान और सरल रखा गया है।
