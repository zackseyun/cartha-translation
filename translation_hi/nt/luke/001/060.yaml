  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: उत्तर दिया
  rationale: अओरिस्ट कृदंत यहाँ प्रत्यक्ष कथन का परिचय देता है; आधुनिक हिन्दी में परिमित क्रिया ‘उत्तर दिया’ स्वाभाविक है और यूनानी के प्रत्युत्तर के भाव को बनाए रखती है।
- source_word: μήτηρ αὐτοῦ
  choice: उसकी माँ
  rationale: यह निश्चित संज्ञा-पदबंध का स्वाभाविक हिन्दी संबंधसूचक रूप है।
- source_word: Οὐχί
  choice: नहीं
  rationale: संवाद में यह पहले प्रस्ताव का स्पष्ट और दृढ़ निषेध है; ‘नहीं’ सीधा तथा स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले माने गए नाम को सुधारकर उसके विपरीत सही नाम प्रस्तुत करता है; ‘बल्कि’ इस सुधारात्मक विरोध को स्पष्ट रखता है।
- source_word: κληθήσεται
  choice: उसका नाम … रखा जाएगा
  rationale: καλέω के भविष्यत् कर्मवाच्य का यहाँ नामकरण-संबंधी अर्थ है। शाब्दिक ‘वह … कहलाया जाएगा’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और भावी नामकरण को ठीक व्यक्त करता है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: यह हिन्दी बाइबलीय परंपरा में इस व्यक्ति के यूनानी नाम का सुस्थापित रूप है।
