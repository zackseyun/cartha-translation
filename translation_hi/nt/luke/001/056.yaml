    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: रही
  rationale: यहाँ μένω का अर्थ किसी स्थान पर कुछ समय तक ठहरे रहना है। ‘रही’ सहज आधुनिक हिन्दी में इस निरंतर निवास को व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘और’ प्रसंग की कड़ी बनाए रखता है, बिना विरोध का अनावश्यक भाव जोड़े।
- source_word: Μαριὰμ
  choice: मरियम
  rationale: यह नाम हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘मरियम’ में दिया गया है।
- source_word: σὺν αὐτῇ
  choice: उसके साथ
  rationale: σύν के साथ संबंध-सूचक भाव है। सर्वनाम का संदर्भ पिछले प्रसंग की इलीशिबा से है, पर मूल की सर्वनामगत अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ὡς μῆνας τρεῖς
  choice: लगभग तीन महीने
  rationale: समय-माप के साथ ὡς अनुमान या निकटता दर्शाता है; ‘लगभग’ उसी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπέστρεψεν
  choice: लौट गई
  rationale: क्रिया का अर्थ पहले के स्थान पर वापस जाना है। कर्ता स्त्रीलिंग होने के कारण ‘लौट गई’ स्वाभाविक हिन्दी रूप है।
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: अपने घर
  rationale: यहाँ οἶκος स्थान के अर्थ में है। सहसंदर्भी कर्ता के कारण हिन्दी में ‘अपने घर’ अधिक स्वाभाविक है और ‘उसके घर’ की संभावित अस्पष्टता से बचाता है।
