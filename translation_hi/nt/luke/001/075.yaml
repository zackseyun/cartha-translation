  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: hi
  text: पवित्रता और धार्मिकता[a] से उसके सामने जीवन भर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायशीलता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: से
  rationale: यहाँ पूर्वसर्ग उस रीति या भाव को बताता है जिसमें पिछले पद की ‘सेवा’ की जानी है; आधुनिक हिन्दी में ‘से’ अधिक स्वाभाविक है।
- source_word: ὁσιότητι
  choice: पवित्रता
  rationale: यह शब्द विशेष रूप से परमेश्वर के प्रति पवित्र और भक्तिपूर्ण आचरण को व्यक्त करता है और δικαιοσύνη से उसका भेद बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: दोनों समानांतर गुणों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यहाँ अर्थ परमेश्वर के सामने सही और खरे आचरण का है। ‘धार्मिकता’ प्रचलित बाइबलीय शब्द है; ‘न्यायशीलता’ को संभावित विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह परमेश्वर की उपस्थिति और दृष्टि—दोनों का संक्षिप्त तथा स्वाभाविक हिन्दी रूप है।
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: जीवन भर
  rationale: यूनानी वाक्यांश का शाब्दिक अर्थ ‘हमारे सभी दिन’ है; हिन्दी में जीवन की पूरी अवधि के लिए ‘जीवन भर’ अधिक स्वाभाविक है।
theological_decisions:
- issue: गैर-पौलुसी नैतिक संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायशीलता
  rationale: ὁσιότης के साथ रखा गया यह शब्द परमेश्वर के सामने खरे और उचित आचरण को बताता है। ‘धार्मिकता’ इस व्यापक नैतिक और परमेश्वर-संबंधी अर्थ को बनाए रखती है, जबकि ‘न्यायशीलता’ एक वास्तविक परंतु यहाँ अपेक्षाकृत संकीर्ण विकल्प है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद पिछले वाक्य पर निर्भर है, इसलिए मूल की वाक्यगत निरंतरता को बनाए रखते हुए यहाँ कोई नया क्रियापद नहीं जोड़ा गया।
