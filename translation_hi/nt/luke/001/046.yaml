  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: hi
  text: और मरियम ने कहा, “मेरी आत्मा प्रभु की महिमा करती है[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की महानता का गुणगान करती है।”
    reason: μεγαλύνει के स्तुतिपरक अर्थ का अधिक स्पष्ट शाब्दिक विकल्प देना।
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल समुच्चयबोधक यूनानी कथानक के प्रवाह को बनाए रखता है और अनावश्यक कालगत अर्थ नहीं जोड़ता।
- source_word: εἶπεν
  choice: ने कहा
  rationale: λέγω के कथात्मक एओरिस्ट का स्वाभाविक आधुनिक हिन्दी रूप ‘ने कहा’ है।
- source_word: Μαριάμ
  choice: मरियम
  rationale: यह हिन्दी बाइबलीय परंपरा में प्रचलित और पहचाना जाने वाला नाम-रूप है।
- source_word: Μεγαλύνει
  choice: महिमा करती है
  rationale: μεγαλύνω यहाँ स्तुतिपरक अर्थ में प्रभु को महान ठहराने या उसकी महानता का गुणगान करने को व्यक्त करता है। ‘महिमा करती है’ हिन्दी में स्वाभाविक, गरिमापूर्ण और काव्यात्मक है; वर्तमान काल भी सुरक्षित रहता है।
- source_word: ἡ ψυχή μου
  choice: मेरी आत्मा
  rationale: यह मूल की सामी-काव्यात्मक और मानवविज्ञान-संबंधी अभिव्यक्ति को बनाए रखता है; केवल ‘मैं’ कहना इसे अनावश्यक रूप से सपाट कर देता।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर के लिए श्रद्धापूर्ण उपाधि है। ‘प्रभु’ हिन्दी में इसका स्थापित, गरिमापूर्ण और प्रसंगानुकूल रूप है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: गीतात्मक और शास्त्रीय स्तुति के इस प्रसंग में ‘प्रभु’ दैवी उपाधि का व्यापक धर्मवैचारिक भार सुरक्षित रखता है; ‘स्वामी’ अपेक्षाकृत संकीर्ण लग सकता है।
- issue: ἡ ψυχή μου की मानवविज्ञान-संबंधी अभिव्यक्ति
  choice: मेरी आत्मा
  alternative: मैं / मेरा अंतर्मन
  rationale: ‘मेरी आत्मा’ मूल की काव्यात्मक अभिव्यक्ति और उसकी संभावित धर्मवैचारिक गहराई को बिना किसी एक व्याख्या में सीमित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक बाइबलीय शैली। ‘मेरी आत्मा’ को मूल की समानांतर स्तुति-काव्य भाषा के अनुरूप रखा गया है; ‘महिमा करती है’ सामान्य पाठक के लिए ‘बड़ा करती है’ से अधिक स्वाभाविक है।
