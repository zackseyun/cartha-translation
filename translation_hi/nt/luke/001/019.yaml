source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: hi
  text: और स्वर्गदूत ने उसे उत्तर दिया, “मैं जिब्राईल हूँ; मैं परमेश्वर के सामने खड़ा हूँ। मुझे तुमसे बात करने और तुम्हें यह शुभ समाचार[a] सुनाने के लिए भेजा गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें ये बातें शुभ समाचार के रूप में सुनाने।” यूनानी में ‘ये बातें’ है, जो जिब्राईल द्वारा अभी घोषित किए गए संदेश की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर दिया
  rationale: यह कृदन्त प्रत्यक्ष कथन का परिचय देता है; आधुनिक हिन्दी में सीमित क्रिया ‘उत्तर दिया’ स्वाभाविक है।
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: संदर्भ में यह जिब्राईल नामक स्वर्गीय प्राणी है; ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: मैं जिब्राईल हूँ
  rationale: स्पष्ट सर्वनाम के बल को बनाए रखते हुए नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: ὁ παρεστηκὼς
  choice: जो ... खड़ा रहता हूँ
  rationale: पूर्णकालिक कृदन्त परमेश्वर के सामने जिब्राईल की निरंतर स्थिति या सेवा-अधिकार को सूचित करता है; ‘खड़ा रहता हूँ’ उस जारी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति और राजदरबारी सेवा, दोनों की छवि को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ἀπεστάλην
  choice: मुझे ... भेजा गया है
  rationale: मूल के कर्मवाच्य और भेजे जाने के दिव्य आदेश को सुरक्षित रखता है; हिन्दी का पूर्ण रूप वर्तमान प्रसंग में आए हुए दूत की स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λαλῆσαι πρὸς σὲ
  choice: तुमसे बात करने
  rationale: उद्देश्यसूचक क्रिया का आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी रूप।
- source_word: εὐαγγελίσασθαί σοι
  choice: तुम्हें ... शुभ समाचार सुनाने
  rationale: क्रिया का अर्थ अच्छा समाचार घोषित करना है; ‘शुभ समाचार सुनाना’ तकनीकी धार्मिक शब्दावली थोपे बिना अर्थ को रखता है।
- source_word: ταῦτα
  choice: यह शुभ समाचार
  rationale: शाब्दिक रूप ‘ये बातें’ है, पर यह संकेतवाचक शब्द जिब्राईल द्वारा घोषित संदेश की ओर इंगित करता है; संयुक्त अनुवाद हिन्दी में अधिक स्वाभाविक है और विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: εὐαγγελίζω को स्वर्गदूतीय घोषणा के संदर्भ में प्रस्तुत करना
  choice: शुभ समाचार सुनाने
  alternative: सुसमाचार सुनाने / अच्छी खबर देने
  rationale: ‘शुभ समाचार’ मूल क्रिया के सकारात्मक घोषणा-भाव और धार्मिक अनुगूँज को बनाए रखता है, पर इस प्रसंग में बाद की तकनीकी संज्ञा ‘सुसमाचार’ को अनावश्यक रूप से नहीं थोपता।
- issue: परमेश्वर के सामने खड़े होने का कालगत भाव
  choice: खड़ा रहता हूँ
  alternative: खड़ा हूँ
  rationale: पूर्ण कृदन्त जिब्राईल की केवल क्षणिक मुद्रा से अधिक, उसकी स्थायी उपस्थिति या सेवा की स्थिति का संकेत दे सकता है; ‘रहता हूँ’ इस जारी भाव को रखता है, बिना उसके स्वरूप को सिद्धान्ततः अधिक परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक किंतु गरिमापूर्ण रखा गया है। ‘तुम’ एकवचन संबोधन मूल के σέ/σοι के अनुरूप है। ‘स्वर्गदूत’ से स्वर्गीय संदर्भ स्पष्ट होता है और ‘शुभ समाचार’ मूल क्रिया का अर्थ तकनीकी शब्दावली के बिना संप्रेषित करता है।
