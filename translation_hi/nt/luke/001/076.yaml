- source_word: παιδίον
  choice: हे बालक
  rationale: यह शिशु यूहन्ना को किया गया सीधा संबोधन है; ‘बालक’ स्वाभाविक और गरिमापूर्ण है।
- source_word: προφήτης Ὑψίστου
  choice: परमप्रधान का भविष्यद्वक्ता
  rationale: ‘परमप्रधान’ प्रतिष्ठित ईश्वरीय उपाधि है और संबंधकारक रचना को स्पष्ट रूप से बनाए रखता है।
- source_word: κληθήσῃ
  choice: कहलाएगा
  rationale: भविष्यत् कर्मवाच्य यहाँ पदनाम और मान्यता, दोनों का भाव व्यक्त करता है।
- source_word: προπορεύσῃ
  choice: आगे-आगे चलेगा
  rationale: क्रिया किसी के अग्रदूत के रूप में पहले चलने को बताती है; यह हिंदी में सहज और प्रसंगानुकूल है।
- source_word: ἐνώπιον κυρίου
  choice: प्रभु के आगे-आगे
  rationale: प्रसंग में यह प्रभु से पहले अग्रदूत के रूप में जाने का भाव देता है, जबकि ‘प्रभु की उपस्थिति में’ अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἑτοιμάσαι
  choice: ताकि ... तैयार करे
  rationale: अनन्त क्रिया अग्रगमन का उद्देश्य बताती है, जिसे हिंदी में उद्देश्यवाचक उपवाक्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁδοὺς αὐτοῦ
  choice: उसके मार्ग
  rationale: यूनानी बहुवचन को बनाए रखते हुए भविष्यद्वाणी की प्रतिध्वनि सुरक्षित रहती है।
theological_decisions:
- issue: अग्रदूत की भविष्यद्वाणी में ‘प्रभु’ का संदर्भ
  choice: अनुवाद में केवल ‘प्रभु’ रखा गया है।
  alternative: पुराने नियम की पृष्ठभूमि के अनुसार परमेश्वर, अथवा लूका के कथानक में यीशु।
  rationale: शब्दावली प्रभु के लिए मार्ग तैयार करने वाली भविष्यद्वाणियों की ओर संकेत करती है, जबकि लूका यूहन्ना की सेवकाई को यीशु के आगे पूरी होते दिखाता है। अनुवाद इस धार्मिक अर्थ-तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप। पिता द्वारा शिशु को सीधे संबोधन के कारण ‘तू’ रखा गया है; ‘आगे-आगे’ अग्रदूत की भूमिका को सहज हिंदी में व्यक्त करता है।
