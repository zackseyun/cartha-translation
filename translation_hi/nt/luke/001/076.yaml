  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: hi
  text: और तू भी, हे बालक, परमप्रधान का भविष्यद्वक्ता कहलाएगा, क्योंकि तू प्रभु के आगे चलेगा[a], उसके मार्ग तैयार करने के लिए[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की उपस्थिति में चलेगा।” यह वाक्यांश किसी के आगे जाने या उसकी उपस्थिति में सेवा करने—दोनों अर्थों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह भाषा प्रभु के आगे मार्ग तैयार करने की भविष्यवाणियों की प्रतिध्वनि है (यशायाह 40:3; मलाकी 3:1 से तुलना करें)। लूका के वर्णन में यह यूहन्ना की यीशु से पहले की सेवकाई में पूरी होती है।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
