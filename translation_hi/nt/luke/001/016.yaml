  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: hi
  text: और वह इस्राएल के बहुत-से पुत्रों को उनके परमेश्वर, प्रभु, की ओर फेरेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की बहुत-सी सन्तानों को” अथवा “बहुत-से इस्राएलियों को।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्रों” लिखा है, जो पारंपरिक वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: खंड को पिछले कथन से जोड़ने वाला सामान्य संयोजक; वाक्य के आरंभ में रखकर कथात्मक प्रवाह बनाए रखा गया है।
- source_word: πολλοὺς
  choice: बहुत-से
  rationale: यह विशेषण संबंधवाचक पदबंध के साथ संज्ञा के समान प्रयुक्त है; ‘बहुत-से’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: इस्राएल के बहुत-से पुत्रों
  rationale: यूनानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है। हिन्दी में यह पारंपरिक वाचा-संबंधी अभिव्यक्ति समझ में आती है और मूल की पुल्लिंग बहुवचन संरचना तथा शास्त्रीय प्रतिध्वनि को सुरक्षित रखती है।
- source_word: ἐπιστρέψει
  choice: फेरेगा
  rationale: भविष्यत्कालीन सकर्मक क्रिया है, जिसमें यूहन्ना कई लोगों को परमेश्वर की ओर मोड़ने का माध्यम है। ‘फेरेगा’ इस कारक भाव को बनाए रखता और अधिक व्याख्यात्मक ‘धर्म-परिवर्तन कराएगा’ से बचता है।
- source_word: ἐπὶ
  choice: की ओर
  rationale: ἐπιστρέφω के साथ यह दिशा या पुनः अभिमुख होने का भाव देता है; ‘की ओर’ हिन्दी में उस गति और दिशा को स्पष्ट रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ किसी मानवीय स्वामी का नहीं, इस्राएल के परमेश्वर का उल्लेख है; ‘प्रभु’ वाचा-संबंधी और ईश्वरीय अर्थ को बनाए रखता है।
- source_word: τὸν θεὸν αὐτῶν
  choice: उनके परमेश्वर
  rationale: ‘प्रभु’ का समानाधिकरण है। हिन्दी में ‘उनके परमेश्वर प्रभु’ मूल के ‘प्रभु, उनके परमेश्वर’ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ की वाचा-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तानों; इस्राएलियों
  rationale: मूल पाठ स्पष्ट रूप से ‘पुत्रों’ कहता है और पारंपरिक बाइबलीय वाचा-अभिव्यक्ति को जगाता है। मुख्य पाठ में इसे सुरक्षित रखा गया है, जबकि अधिक सामूहिक और मुहावरेदार विकल्प पादटिप्पणी में दिए गए हैं।
- issue: κύριον τὸν θεὸν αὐτῶν का संदर्भ
  choice: उनके परमेश्वर प्रभु
  alternative: उनके स्वामी परमेश्वर
  rationale: यह पदबंध इस्राएल के परमेश्वर की पहचान करता है, किसी मानवीय स्वामी की नहीं। ‘प्रभु’ इसके धार्मिक और वाचा-संबंधी भार को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शास्त्रीय शैली अपनाई गई है। ‘इस्राएल के पुत्रों’ मूल की पारंपरिक अभिव्यक्ति बनाए रखता है; ‘की ओर फेरेगा’ सकर्मकता और दिशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
