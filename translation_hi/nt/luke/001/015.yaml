source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: hi
  text: क्योंकि वह प्रभु की दृष्टि में महान होगा। वह दाखमधु या कोई और नशीला पेय कभी नहीं पिएगा,[a][b] और अपनी माँ के गर्भ से ही पवित्र आत्मा से भर दिया जाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में नकार बहुत प्रबल है: “वह निश्चय ही कभी नहीं पिएगा।” प्रसंग में यह उसके समर्पित बुलावे से जुड़ा हुआ है।'
    reason: lexical_alternative
  - marker: b
    text: “कोई और नशीला पेय” से आशय दाखमधु के अतिरिक्त मादक पेय से है।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद “अपनी माँ के गर्भ में रहते हुए ही” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: महान
  rationale: यह मूल शब्द के महत्व और प्रतिष्ठा—दोनों भावों को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ἐνώπιον τοῦ κυρίου
  choice: प्रभु की दृष्टि में
  rationale: यह परमेश्वर के सामने मूल्यांकन और मान्यता के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἶνον καὶ σίκερα
  choice: दाखमधु या कोई और नशीला पेय
  rationale: σίκερα दाखमधु से अलग मादक पेय को सूचित करता है; ‘कोई और नशीला पेय’ इस भेद को स्पष्ट रखता है।
- source_word: οὐ μὴ πίῃ
  choice: कभी नहीं पिएगा
  rationale: οὐ μή की प्रबल नकारात्मकता को भविष्यवाणी के रूप में रखते हुए ‘कभी नहीं’ द्वारा व्यक्त किया गया है; इसे सीधे आज्ञा में नहीं बदला गया।
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: पवित्र आत्मा से भर जाएगा
  rationale: भविष्यत् कर्मवाच्य अर्थ और लूका में व्यक्तिगत दिव्य आत्मा के संदर्भ—दोनों को सुरक्षित रखता है।
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: अपनी माँ के गर्भ से ही
  rationale: ἐκ के आरंभ-बिंदु और ἔτι के बल को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है, जबकि समय-संबंधी सूक्ष्म अस्पष्टता को टिप्पणी में रखा गया है।
theological_decisions:
- issue: οὐ μὴ πίῃ को भविष्यवाणी माना जाए या निषेध
  choice: 'प्रबल भविष्यवाणी: ‘कभी नहीं पिएगा’'
  alternative: 'कर्तव्य या निषेध: ‘उसे कभी नहीं पीना चाहिए’'
  rationale: रूप भविष्यकालीन घोषणा के भीतर प्रबल निषेधात्मक भविष्यवाणी है। यूहन्ना के समर्पित बुलावे का प्रसंग निषेधात्मक अर्थछाया दे सकता है, पर मुख्य पाठ उसे स्पष्ट आज्ञा में नहीं बदलता।
- issue: πνεύματος ἁγίου का संदर्भ
  choice: 'व्यक्तिगत दिव्य संदर्भ: ‘पवित्र आत्मा’'
  alternative: एक अपौरुषेय पवित्र शक्ति या प्रभाव
  rationale: लूका के निकटवर्ती साहित्यिक और भाषिक प्रयोग में यह परमेश्वर के आत्मा का संदर्भ है; हिन्दी में प्रचलित नामरूप ‘पवित्र आत्मा’ स्वाभाविक है।
- issue: गर्भ से आत्मा से भरने का समय
  choice: ‘गर्भ से ही’ द्वारा आरंभ-बिंदु को सुरक्षित रखना
  alternative: ‘गर्भ में रहते हुए ही’ द्वारा स्पष्ट जन्मपूर्व घटना बताना
  rationale: मूल वाक्यांश अत्यंत आरंभिक समय पर बल देता है, लेकिन ‘से’ और ‘में रहते हुए’ के बीच समय-संबंधी सूक्ष्मता को पूरी तरह समाप्त नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित है, और σίκερα का भेद ‘कोई और नशीला पेय’ से स्पष्ट किया गया है।
