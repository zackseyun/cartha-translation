  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: hi
  text: और वह ज़करयाह के घर में गई और इलीशिबा का अभिवादन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: घर में गई
  rationale: अपूर्णभूत सक्रिय निर्देशार्थक क्रिया यहाँ किसी स्थान में प्रवेश करने की घटना बताती है। हिन्दी में स्त्री कर्ता मरियम के लिए ‘घर में गई’ स्वाभाविक है और ‘प्रवेश किया’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है।
- source_word: οἶκον
  choice: घर
  rationale: εἰς के साथ यहाँ भौतिक निवास-स्थान अभिप्रेत है; ‘घर’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ζαχαρίου
  choice: ज़करयाह
  rationale: यूनानी नाम का प्रचलित हिन्दी बाइबलीय रूप लिया गया है।
- source_word: ἠσπάσατο
  choice: अभिवादन किया
  rationale: ἀσπάζομαι का अर्थ मिलने पर अभिवादन करना है। यह रूप बिना अतिरिक्त आत्मीयता या औपचारिकता जोड़े अर्थ को स्पष्ट रखता है।
- source_word: Ἐλισάβετ
  choice: इलीशिबा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप लिया गया है।
- source_word: καὶ
  choice: और
  rationale: दोनों घटनाओं को जोड़ने वाले साधारण समुच्चयबोधक के रूप में ‘और’ लूका की क्रमिक कथन-शैली को बनाए रखता है।
