translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद पिछले वाक्य से जुड़ा है, इसलिए आरम्भिक καί को ‘और’ रखा गया है। यूनानी में कर्ता निहित है; हिन्दी व्याकरण के लिए पिछले संदर्भ की मरियम को दर्शाने वाला स्त्रीलिंग ‘वह … गई’ प्रयुक्त हुआ है।
