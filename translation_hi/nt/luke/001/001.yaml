  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: hi
  text: चूँकि बहुतों ने हमारे बीच पूरी हुई बातों का वृत्तांत तैयार करने का कार्य हाथ में लिया है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सम्पन्न हुई बातों का’ अथवा ‘हमारे बीच पूरी तरह प्रमाणित बातों का।’
    reason: πεπληροφορημένων के पूर्णता, सम्पन्नता अथवा पूर्ण पुष्टि से जुड़े संभव अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: चूँकि
  rationale: यह पद औपचारिक भूमिका में पृष्ठभूमि और कारणसूचक संबंध प्रस्तुत करता है। ‘चूँकि’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले वाक्य से तार्किक संबंध बनाए रखता है।
- source_word: πολλοὶ
  choice: बहुतों ने
  rationale: ग्रीक विशेषण को हिन्दी में कर्ता के रूप में स्वाभाविक ढंग से व्यक्त करता है; ‘दूसरों’ का भाव मूल में स्पष्ट नहीं है।
- source_word: ἐπεχείρησαν
  choice: कार्य हाथ में लिया है
  rationale: यहाँ क्रिया किसी परियोजना को आरम्भ करने या अपने ऊपर लेने का भाव देती है। यह अनुवाद असफल प्रयास का अनावश्यक संकेत नहीं देता।
- source_word: ἀνατάξασθαι
  choice: तैयार करने
  rationale: संदर्भ में इसका अर्थ सामग्री को व्यवस्थित करके लिखित रूप देना है। ‘तैयार करने’ सामान्य पाठक के लिए सहज है और साहित्यिक कार्य को स्पष्ट करता है।
- source_word: διήγησιν
  choice: वृत्तांत
  rationale: यह किसी घटना-क्रम के कथात्मक विवरण को दर्शाता है। ‘वृत्तांत’ गरिमापूर्ण और इतिहासपरक शैली के अनुकूल है।
- source_word: περὶ
  choice: का
  rationale: हिन्दी में ‘बातों का वृत्तांत’ स्वाभाविक संबंधसूचक रचना है और ग्रीक के ‘के विषय में’ अर्थ को संक्षेप में व्यक्त करती है।
- source_word: τῶν πεπληροφορημένων
  choice: पूरी हुई
  rationale: पूर्ण निष्पन्नता या सिद्धि के अर्थ को दर्शाता है और लूका में प्रतिज्ञाओं तथा घटनाओं की पूर्ति की व्यापक ध्वनि को बनाए रखता है। अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἐν ἡμῖν
  choice: हमारे बीच
  rationale: यह सामूहिक और जानबूझकर अनिर्धारित अभिव्यक्ति है; इसमें ‘विश्वासियों’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: πραγμάτων
  choice: बातों
  rationale: यह व्यापक शब्द घटनाओं, कार्यों और विषयों को समेट सकता है। ‘बातों’ मूल की व्यापकता को ‘घटनाओं’ की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: लूका की भूमिका में πεπληροφορημένων का अर्थ
  choice: पूरी हुई
  alternative: सम्पन्न हुई; हमारे बीच पूरी तरह प्रमाणित हुई
  rationale: πράγματα के साथ यह कृदन्त उन बातों या घटनाओं की पूर्णता अथवा सिद्धि को सबसे स्वाभाविक रूप से दर्शाता है और लूका की उद्धार-ऐतिहासिक ध्वनि के अनुकूल है। फिर भी पूर्ण पुष्टि का अर्थ शब्द की संभव अर्थ-सीमा में है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण साहित्यिक भूमिका। ‘वृत्तांत’ औपचारिकता बनाए रखता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
