source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: hi
  text: क्योंकि उसने अपनी दासी[a] की दीन दशा[b] पर दृष्टि की है। देखो, अब से सभी पीढ़ियाँ मुझे धन्य कहेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दासी” के लिए “महिला दास” या “सेविका” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दीनता” अथवा “अपमानित अवस्था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: पर दृष्टि की है
  rationale: यह पदबंध किसी की ओर ध्यान देने या उस पर अनुकूल दृष्टि डालने का भाव रखता है। हिंदी में यह चयन काव्यात्मक गरिमा और परमेश्वर के व्यक्तिगत ध्यान—दोनों को बनाए रखता है; पूर्ण पक्ष वर्तमान स्तुति में उस घटना की बनी हुई प्रासंगिकता व्यक्त करता है।
- source_word: ταπείνωσιν
  choice: दीन दशा
  rationale: यहाँ संज्ञा मरियम की केवल आंतरिक नम्रता नहीं, बल्कि उसकी नीची सामाजिक स्थिति या तुच्छ समझी जाने वाली अवस्था को भी सूचित करती है। “दीन दशा” इस बाहरी अवस्था को सहज आधुनिक हिंदी में व्यक्त करती है।
- source_word: δούλης
  choice: दासी
  rationale: स्त्रीलिंग δούλη बंधुआ स्वामित्व और सेवा, दोनों का बोध करा सकता है। “दासी” हिंदी में स्त्री दास अथवा सेविका के अर्थ-क्षेत्र को बनाए रखते हुए मरियम के परमेश्वर से पूर्ण संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। “देखो” आधुनिक पाठक के लिए स्पष्ट है और गीत के बलाघात को बनाए रखता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह आगे जारी रहने वाले समय का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: μακαριοῦσίν με
  choice: मुझे धन्य कहेंगी
  rationale: क्रिया किसी को धन्य घोषित या स्वीकार करने का अर्थ देती है। “धन्य कहेंगी” सार्वजनिक स्वीकारोक्ति और भविष्यकाल दोनों को सुरक्षित रखता है।
- source_word: πᾶσαι αἱ γενεαί
  choice: सभी पीढ़ियाँ
  rationale: यह क्रमागत मानव पीढ़ियों का स्वाभाविक सामूहिक उल्लेख है; “भविष्य की” जोड़ना अनावश्यक है, क्योंकि “अब से” वह दिशा पहले ही स्पष्ट करता है।
theological_decisions:
- issue: मरियम के आत्म-वर्णन δούλη का अनुवाद
  choice: दासी
  alternative: सेविका
  rationale: “दासी” मूल शब्द में निहित स्वामित्व और अधीनता को “सेविका” की अपेक्षा अधिक स्पष्ट रखता है, फिर भी हिंदी में स्वाभाविक है। इससे किसी बाद की मरियम-संबंधी धर्मसैद्धांतिक धारणा को पाठ में नहीं जोड़ा गया है।
- issue: ταπείνωσις का आशय
  choice: दीन दशा
  alternative: दीनता; अपमानित अवस्था
  rationale: संदर्भ मरियम की नीची और साधारण सामाजिक अवस्था पर परमेश्वर की दृष्टि को प्रमुख बनाता है, पर शब्द में संभावित अपमान या नीचता का स्वर पूर्णतः मिटाया नहीं गया; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “दृष्टि की है” गीतात्मक-बाइबलीय शैली को बनाए रखता है, जबकि “देखो” और “अब से” सामान्य आधुनिक हिंदी में सहज हैं।
