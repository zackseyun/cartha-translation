  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: hi
  text: उस शपथ को, जो उसने हमारे पिता अब्राहम से खाई थी—हमें देने के लिए—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρκον
  choice: उस शपथ को
  rationale: यह पिछले पद से चली आ रही वाक्य-रचना में कर्म है और एक निश्चित, पहले से संदर्भित शपथ की ओर संकेत करता है।
- source_word: ὃν ὤμοσεν
  choice: जो उसने ... खाई थी
  rationale: हिन्दी मुहावरे ‘शपथ खाना’ से यूनानी संबंधवाचक उपवाक्य और भूतकालीन क्रिया स्वाभाविक ढंग से व्यक्त होते हैं।
- source_word: πρὸς Ἀβραὰμ
  choice: अब्राहम से
  rationale: शपथ खाने के साथ आधुनिक हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है; अर्थ अब्राहम के प्रति की गई शपथ का है।
- source_word: τὸν πατέρα ἡμῶν
  choice: हमारे पिता
  rationale: यूनानी का शाब्दिक पारिवारिक और वाचागत संबोधन सुरक्षित रहता है; केवल जैविक वंशार्थ तक सीमित ‘पूर्वज’ की तुलना में यह मूल बाइबलीय भाषा के निकट है।
- source_word: τοῦ δοῦναι ἡμῖν
  choice: हमें यह वर देने के लिए
  rationale: आर्टिक्युलर इनफिनिटिव शपथ के उद्देश्य अथवा आशय को आगे खोलता है। ‘वर देना’ गीत की गरिमामय शैली में अनुग्रहपूर्वक प्रदान करने का भाव रखता है, जबकि ‘यह’ अगले पद में आने वाली विषय-वस्तु की ओर संकेत करता है।
theological_decisions:
- issue: अब्राहम से जुड़ी वाचा की पारिवारिक भाषा
  choice: हमारे पिता
  alternative: हमारे पूर्वज
  rationale: ‘पिता’ मूल यूनानी की वाचागत और सामुदायिक प्रतिध्वनि बनाए रखता है, बिना कोई अतिरिक्त सांप्रदायिक निष्कर्ष जोड़े।
translation_notes:
  register: जकरयाह के स्तुतिगान के अनुरूप भाषा गरिमामय किंतु आधुनिक और सुबोध रखी गई है। यह पद अगले पद में पूरा होने वाले वाक्य का अंश है, इसलिए अंत खुला रखा गया है।
