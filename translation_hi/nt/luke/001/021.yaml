- from: और लोग जकर्याह की प्रतीक्षा कर रहे थे और पवित्रस्थान[a] में उसके देर लगाने पर अचम्भा कर रहे थे।
  to: और लोग जकर्याह की प्रतीक्षा कर रहे थे, और उसके पवित्रस्थान में देर तक रहने पर उन्हें आश्चर्य हो रहा था।
  rationale: The revision improves idiomatic modern Hindi and clarifies that Zechariah’s prolonged presence, rather than a deliberate act of delaying, occasioned the people’s astonishment. It preserves the source’s ongoing past actions and the ναός/temple-precinct distinction.
