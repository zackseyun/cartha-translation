  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: hi
  text: और लोग जकर्याह की प्रतीक्षा कर रहे थे, और उसके पवित्रस्थान में देर तक रहने पर उन्हें आश्चर्य हो रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: लोग
  rationale: यह सामूहिक रूप से बाहर इकट्ठे लोगों को दर्शाता है; आधुनिक हिन्दी में ‘लोग’ स्वाभाविक और स्पष्ट है।
- source_word: προσδοκῶν
  choice: प्रतीक्षा कर रहे थे
  rationale: ἦν के साथ वर्तमान कृदन्त निरन्तर चल रही भूतकालीन क्रिया व्यक्त करता है; यह पदबंध उस अवधि को बनाए रखता है।
- source_word: Ζαχαρίαν
  choice: जकर्याह
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: ἐθαύμαζον
  choice: अचम्भा कर रहे थे
  rationale: अपूर्ण भूतकाल उनकी लगातार बनी हुई आश्चर्यभरी प्रतिक्रिया व्यक्त करता है; यह केवल सोच-विचार करने की अपेक्षा अधिक प्रबल है।
- source_word: ἐν τῷ χρονίζειν
  choice: देर लगाने पर
  rationale: यह पदबंध किसी काम में अपेक्षा से अधिक समय लगने और उसी के कारण या अवसर पर लोगों के अचम्भे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ναῷ
  choice: पवित्रस्थान
  rationale: ναός यहाँ व्यापक मन्दिर-परिसर के बजाय मन्दिर के मुख्य पवित्र भवन को सूचित करता है; इसलिए ‘पवित्रस्थान’ अधिक सटीक है।
- source_word: αὐτόν
  choice: उसके
  rationale: यूनानी में यह χρονίζειν का कर्ता है; हिन्दी में सम्बन्धसूचक रूप ‘उसके देर लगाने’ से वही व्याकरणिक सम्बन्ध व्यक्त होता है।
