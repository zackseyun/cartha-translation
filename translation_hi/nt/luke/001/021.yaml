  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’ को ‘मन्दिर’ पर वरीयता देकर ναός और व्यापक मन्दिर-परिसर के बीच का मूल भेद सुरक्षित रखा गया है।
