  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: hi
  text: क्योंकि उस सामर्थी ने मेरे लिए बड़े-बड़े काम किए हैं, और पवित्र है उसका नाम।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में मरियम द्वारा प्रभु की बड़ाई करने का कारण बताता है और यूनानी के कारणसूचक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐποίησέν μοι
  choice: मेरे लिए ... काम किए हैं
  rationale: μοι यहाँ हितसूचक है, इसलिए ‘मेरे लिए’ उपयुक्त है; पूर्ण वर्तमान ‘किए हैं’ उस पूर्ण कार्य की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: μεγάλα
  choice: बड़े-बड़े काम
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बड़े-बड़े काम’ स्वाभाविक हिन्दी में परमेश्वर के महान कार्यों का व्यापक भाव बनाए रखता है।
- source_word: ὁ δυνατός
  choice: उस सामर्थी
  rationale: सव्यंजक विशेषण लेख के साथ संज्ञा और परमेश्वर की उपाधि के रूप में आया है। ‘सामर्थी’ संक्षिप्त, गरिमापूर्ण और शीर्षकीय अर्थ को सुरक्षित रखता है; ‘उस’ पिछले संदर्भ में उल्लिखित प्रभु की ओर संकेत करता है।
- source_word: ἅγιον
  choice: पवित्र
  rationale: यह परमेश्वर के नाम का विधेय है। ‘पवित्र’ नैतिक शुद्धता और अलग ठहराए जाने के बाइबलीय अर्थ-क्षेत्र को बनाए रखने वाला मानक हिन्दी शब्द है।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उसका नाम
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है। ‘नाम’ को बनाए रखा गया है, क्योंकि मूल पाठ परमेश्वर के प्रकट चरित्र या प्रतिष्ठा को अलग शब्दों में स्पष्ट नहीं करता।
theological_decisions:
- issue: ὁ δυνατός को परमेश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: उस सामर्थी
  alternative: उसने जो सामर्थी है; उस शक्तिशाली ने
  rationale: यूनानी में लेखयुक्त विशेषण संज्ञा के रूप में परमेश्वर की आदरपूर्ण उपाधि है। ‘सामर्थी’ इस शीर्षकीय बल को बिना अतिरिक्त सिद्धान्त जोड़े संक्षेप में व्यक्त करता है।
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ में शब्दक्रम
  choice: और पवित्र है उसका नाम
  alternative: और उसका नाम पवित्र है
  rationale: यूनानी में ‘पवित्र’ पहले रखकर उस पर बल दिया गया है। चुना गया हिन्दी क्रम उस बल और स्तुतिपरक लय को बनाए रखते हुए समझने योग्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्तुतिपरक है। यूनानी के बलयुक्त शब्दक्रम को ‘पवित्र है उसका नाम’ में सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि वैकल्पिक सामान्य हिन्दी क्रम अर्थ में पर्याप्त भिन्नता नहीं लाता।
