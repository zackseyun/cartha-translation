    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: की स्तुति हो
  rationale: यह विधेय विशेषण आशीर्वाद और स्तुति की उद्घोषणा है। आधुनिक हिन्दी में परमेश्वर के लिए ‘की स्तुति हो’ स्वाभाविक, श्रद्धापूर्ण और अर्थतः स्पष्ट है।
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर प्रभु
  rationale: ‘प्रभु’ को ‘इस्राएल के परमेश्वर’ के साथ एक ही दिव्य उपाधि के रूप में रखते हुए मूल के यहूदी-शास्त्रीय स्वर को सुरक्षित किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह स्तुति का कारण प्रस्तुत करता है; ‘क्योंकि’ समकालीन हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐπεσκέψατο
  choice: अपनी प्रजा की सुधि ली
  rationale: यह यूनानी क्रिया केवल मिलने नहीं, बल्कि ध्यान देकर सहायता हेतु हस्तक्षेप करने का भाव रखती है। ‘सुधि ली’ उस बाइबलीय भाव को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि पादटिप्पणी शाब्दिक चित्र को दिखाती है।
- source_word: ἐποίησεν λύτρωσιν
  choice: छुटकारा किया है
  rationale: यूनानी मुहावरे का अर्थ छुटकारा उपलब्ध या संपन्न करना है। ‘छुटकारा किया है’ क्रिया और उसके उद्धारकारी परिणाम दोनों को संक्षेप में रखता है।
- source_word: λύτρωσιν
  choice: छुटकारा
  rationale: यह बंधन से मुक्ति और मूल्य देकर छुड़ाने की अर्थ-छाया के लिए सहज बाइबलीय हिन्दी शब्द है।
- source_word: τῷ λαῷ αὐτοῦ
  choice: उसके लिए
  rationale: यह ‘अपनी प्रजा’ को दोनों कार्यों—सुधि लेने और छुटकारा करने—का संदर्भ तथा लाभार्थी बनाए रखता है और हिन्दी में अनावश्यक पुनरुक्ति से बचता है।
theological_decisions:
- issue: परमेश्वर के आगमन/भेंट का बाइबलीय रूपक
  choice: अपनी प्रजा की सुधि ली
  alternative: अपनी प्रजा से भेंट की; अपनी प्रजा की सहायता करने आया
  rationale: ‘सुधि ली’ परमेश्वर के ध्यानपूर्ण और उद्धारकारी हस्तक्षेप को व्यक्त करता है, पर उसे केवल भावना या केवल शारीरिक आगमन तक सीमित नहीं करता। पादटिप्पणी मूल के ‘भेंट करने’ वाले रूपक को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘की स्तुति हो’ स्तुतिपरक उद्घोषणा को स्वाभाविक हिन्दी देती है; ‘सुधि ली’ साहित्यिक होते हुए भी सामान्य पाठकों के लिए बोधगम्य है।
