base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: hi
  text: उसने अपनी भुजा से बल दिखाया है; उसने अभिमानियों को उनके हृदयों की मनसा में तितर-बितर कर दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अभिमानियों को उनके हृदयों की मंशा के द्वारा तितर-बितर कर दिया है।” यूनानी पदबंध का अर्थ “उनके हृदयों के विचारों में” या “उनके हृदयों की कल्पनाओं में” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: सामर्थ्य दिखाया है
  rationale: शाब्दिक रूप से ‘सामर्थ्य किया’ यूनानी मुहावरा है, जिसका आशय शक्ति का प्रभावशाली प्रदर्शन करना है। हिन्दी में ‘सामर्थ्य दिखाया है’ स्वाभाविक है और पूर्ण हो चुके कार्य की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: ἐν βραχίονι αὐτοῦ
  choice: अपने भुजबल से
  rationale: ἐν यहाँ साधन सूचित करता है। ‘भुजबल’ परमेश्वर की सामर्थी भुजा के पुराने नियम-सदृश बिंब को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διεσκόρπισεν
  choice: तितर-बितर कर दिया है
  rationale: क्रिया का अर्थ बिखेरना या छिन्न-भिन्न करना है। यह रूप निर्णायक, पूर्ण कार्रवाई व्यक्त करता है।
- source_word: ὑπερηφάνους
  choice: घमंडियों
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है और घमंडी लोगों को सूचित करता है।
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: जो अपने हृदय के विचारों में घमंडी हैं
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘उनके हृदय के विचार/मन में’ है। सम्बन्ध को स्पष्ट करने के लिए इसे वर्णनात्मक उपवाक्य में रखा गया है, जबकि हृदय को विचार, इच्छा और भीतरी स्वभाव के केंद्र के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: मरियम के गीत में अओरिस्ट क्रियाओं का काल
  choice: हिन्दी पूर्ण वर्तमान (‘दिखाया है’, ‘कर दिया है’)
  alternative: साधारण भूतकाल (‘दिखाया’, ‘तितर-बितर किया’)
  rationale: अओरिस्ट परमेश्वर के निर्णायक कार्यों का सार और सम्भवतः भविष्यदर्शी निश्चितता व्यक्त करते हैं। पूर्ण वर्तमान पूर्ण कार्रवाई और उसकी बनी हुई प्रासंगिकता दोनों को व्यक्त करता है।
- issue: διανοίᾳ καρδίας αὐτῶν का सम्बन्ध
  choice: घमंड को उनके हृदय के विचारों/भीतरी मनोभाव से जोड़ना
  alternative: ‘उसने उन्हें उनके हृदय की योजना के द्वारा तितर-बितर किया’
  rationale: दत्तिव को क्षेत्र अथवा साधन दोनों रूपों में समझा जा सकता है। मुख्य पाठ अधिक स्वाभाविक सन्दर्भगत अर्थ देता है; वैकल्पिक व्याकरणिक सम्भावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘भुजबल’ परिचित धार्मिक-काव्यात्मक पद है, पर अर्थ सामान्य पाठक के लिए सुलभ रहता है।
