lexical_decisions:
- source_word: ἔδοξε κἀμοὶ
  choice: मुझे भी यह उचित लगा
  rationale: यह यूनानी मुहावरे के विचारपूर्वक किए गए निर्णय और पिछले वृत्तांतकारों के साथ लेखक के संबंध—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρηκολουθηκότι
  choice: छानबीन करके
  rationale: यहाँ पूर्ण कृदंत लेखक द्वारा सामग्री का ध्यानपूर्वक अनुसरण, जाँच और समझ प्राप्त करने को दर्शाता है; आधुनिक हिन्दी में ‘छानबीन’ प्रसंग का अनुसंधानात्मक भाव स्पष्ट करती है।
- source_word: ἄνωθεν
  choice: आरम्भ से
  rationale: इतिहासपरक भूमिका में इसका सर्वाधिक स्वाभाविक अर्थ घटनाओं के मूल या आरम्भ से है, न कि ‘ऊपर से’।
- source_word: πᾶσιν ἀκριβῶς
  choice: सब बातों की सावधानी से
  rationale: πᾶσιν विषयगत रूप से सभी संबंधित बातों को और ἀκριβῶς सूक्ष्म, सतर्क जाँच को व्यक्त करता है।
- source_word: καθεξῆς
  choice: क्रमबद्ध रूप में
  rationale: यह सुव्यवस्थित प्रस्तुति या अनुक्रम दोनों की संभावना बनाए रखता है और अनिवार्य रूप से कठोर कालानुक्रम का दावा नहीं करता।
- source_word: σοι γράψαι
  choice: उन्हें आपके लिए ... लिखूँ
  rationale: समझा हुआ कर्म ‘बातों’ से लिया गया है; ‘आपके लिए’ समर्पित ग्रंथ की हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: κράτιστε
  choice: परम माननीय
  rationale: यह उच्च पद या प्रतिष्ठा वाले व्यक्ति के लिए औपचारिक सम्मानसूचक संबोधन को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Θεόφιλε
  choice: थियुफिलुस
  rationale: नाम का रूप यूनानी Θεόφιλος के निकट देवनागरी लिप्यंतरण है।
theological_decisions:
- issue: καθεξῆς में ऐतिहासिक क्रम का स्वरूप
  choice: क्रमबद्ध रूप में
  alternative: कालानुक्रम से
  rationale: शब्द सुव्यवस्थित व्यवस्था या अनुक्रम सूचित कर सकता है, पर यह पद आवश्यक रूप से हर विवरण के कठोर कालानुक्रमिक होने का दावा नहीं करता।
- issue: παρηκολουθηκότι का अनुसंधानात्मक भाव
  choice: छानबीन करके
  alternative: सब बातों का निकटता से अनुसरण करके
  rationale: प्रसंग में लेखक स्रोत-सामग्री और घटनाओं को सावधानी से जानने की बात करता है। चुना हुआ रूप जाँच का भाव स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक अर्थ फुटनोट में सुरक्षित है।
translation_notes:
  register: लूका की औपचारिक साहित्यिक भूमिका के अनुरूप गरिमापूर्ण पर सहज आधुनिक मानक हिन्दी रखी गई है। सम्मानसूचक ‘आप’ और ‘परम माननीय’ समर्पण के औपचारिक स्वर को बनाए रखते हैं।
