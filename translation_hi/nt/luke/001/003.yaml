  text: इसलिए मुझे भी यह उचित लगा कि आरम्भ से सब बातों की सावधानीपूर्वक छानबीन करके[a] उन्हें आपको क्रमबद्ध रूप में[b] लिखूँ, परम माननीय थियुफिलुस।
