  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: hi
  text: तब तक लगभग छठा घंटा हो चुका था, और नौवें घंटे तक पूरे देश पर अंधकार छा गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: हो चुका था
  rationale: यह व्यक्त करता है कि कथा में लगभग छठे पहर का समय आ चुका था; हिन्दी में यह ‘पहले ही’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ὡσεὶ
  choice: लगभग
  rationale: समय की अनुमानितता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὥρα ἕκτη
  choice: छठा पहर
  rationale: मूल की प्राचीन समय-अभिव्यक्ति और कथात्मक बनावट को बनाए रखता है; आधुनिक समय-समानता पादटिप्पणी में दी गई है।
- source_word: σκότος
  choice: अंधकार
  rationale: इस प्रसंग में संज्ञा का मानक, गरिमापूर्ण और सहज हिन्दी रूप।
- source_word: ἐγένετο
  choice: छा गया
  rationale: अंधकार के साथ स्वाभाविक हिन्दी प्रयोग है और घटना के घटित होने का भाव बनाए रखता है।
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: सारे देश पर
  rationale: γῆ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। मुख्य पाठ में ‘देश’ प्रसंग के भौगोलिक विस्तार को अनावश्यक रूप से सार्वभौमिक घोषित नहीं करता; व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἕως ὥρας ἐνάτης
  choice: नौवें पहर तक
  rationale: छठे पहर के समान मूल की समय-अभिव्यक्ति को बनाए रखता है; आधुनिक घड़ी का समय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: अंधकार के कथन में γῆ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: यूनानी संज्ञा क्षेत्रीय और सार्वभौमिक, दोनों अर्थों की अनुमति देती है। मुख्य पाठ में अधिक संयत ‘देश’ और पादटिप्पणी में ‘पृथ्वी’ देकर ऐतिहासिक तथा विश्वव्यापी अर्थ के बीच का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘पहर’ मूल की क्रमांकित प्राचीन समय-गणना को बनाए रखता है; पाठकों की सुविधा के लिए आधुनिक समय पादटिप्पणी में दिया गया है।
