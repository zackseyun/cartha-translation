base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: hi
  text: सैनिकों ने भी उसके पास आकर, उसे खट्टी दाखमदिरा[a] देते हुए उसका उपहास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिरका।” यूनानी शब्द का अर्थ खट्टी दाखमदिरा है—एक सामान्य और सस्ता पेय।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: उपहास किया
  rationale: यह क्रिया शत्रुतापूर्ण ढंग से मज़ाक उड़ाने और तिरस्कार करने का बोध कराती है। ‘उपहास किया’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: δὲ … καὶ οἱ στρατιῶται
  choice: सैनिकों ने भी
  rationale: δέ कथा को आगे बढ़ाता है और καί सैनिकों को पहले से उपहास करने वालों के साथ जोड़ता है; ‘भी’ इस संयुक्त प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσερχόμενοι
  choice: उसके पास आकर
  rationale: यह कृदन्त सैनिकों के यीशु के निकट आने की क्रिया बताता है। ‘पास आकर’ सहज हिन्दी में उस गति और सहायक क्रिया-सम्बन्ध दोनों को बनाए रखता है।
- source_word: ὄξος
  choice: खट्टी दाखमदिरा
  rationale: ὄξος से आशय खट्टी हो चुकी दाखमदिरा अथवा सस्ती अम्लीय मदिरा से है, जिसे प्रायः पेय के रूप में इस्तेमाल किया जाता था। ‘खट्टी दाखमदिरा’ आधुनिक पाठक को ‘सिरका’ की तुलना में वस्तु की प्रकृति अधिक स्पष्ट रूप से बताती है।
- source_word: προσφέροντες
  choice: देते हुए
  rationale: कृदन्त उनके द्वारा पेय आगे बढ़ाकर यीशु को देने की क्रिया व्यक्त करता है। ‘देते हुए’ सरल और स्वाभाविक है तथा उपहास के साथ इसकी समकालिकता बनाए रखता है।
theological_decisions:
- issue: ὄξος देने के पीछे सैनिकों की मंशा
  choice: क्रिया को उपहास के प्रसंग में रखा गया है, पर उसे अपने आप में न दया का कार्य कहा गया है, न अतिरिक्त क्रूरता का।
  alternative: इसे दया का छोटा-सा कार्य या केवल ताने के रूप में स्पष्ट करना।
  rationale: निकटवर्ती प्रसंग सैनिकों के व्यवहार को उपहास के रूप में प्रस्तुत करता है, किन्तु यह पद पेय देने के उनके मनोवैज्ञानिक उद्देश्य की अलग से व्याख्या नहीं करता। इसलिए अनुवाद क्रिया और प्रसंग को साथ रखता है, पर मंशा को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली रखी गई है। मुख्य वाक्य यूनानी वाक्य के प्रधान कथन ‘उपहास किया’ और दोनों सहायक कृदन्तों—पास आने तथा पेय देने—का सम्बन्ध सुरक्षित रखता है।
