  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: hi
  text: और जब उसे पता चला कि वह हेरोदेस के अधिकार-क्षेत्र के अधीन था[a], तो उसने उसे हेरोदेस के पास भेज दिया, जो उन दिनों स्वयं भी यरूशलेम में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हेरोदेस के अधिकार के अधीन।” यूनानी अभिव्यक्ति हेरोदेस के शासन-क्षेत्र या कानूनी अधिकार को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: जब उसे पता चला
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई जानकारी-प्राप्ति को दर्शाता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: वह हेरोदेस के अधिकार-क्षेत्र से है
  rationale: ἐκ के साथ ἐξουσία यहाँ उस प्रशासनिक अथवा न्यायिक क्षेत्र को सूचित करता है जिसके अधीन कोई व्यक्ति आता है। ‘अधिकार-क्षेत्र से’ व्यक्ति के क्षेत्रीय संबंध और हेरोदेस की कानूनी सत्ता—दोनों को बनाए रखता है।
- source_word: ἀνέπεμψεν
  choice: उसने उसे ... भेज दिया
  rationale: न्यायिक प्रसंग में क्रिया किसी मामले को संबंधित अधिकारी के पास भेजने का भाव रख सकती है; सरल ‘भेज दिया’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: πρὸς Ἡρῴδην
  choice: हेरोदेस के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गति दर्शाता है; हिन्दी में ‘के पास’ स्वाभाविक समतुल्य है।
- source_word: ὄντα καὶ αὐτὸν
  choice: जो ... स्वयं भी ... था
  rationale: यह कृदंतीय पद हेरोदेस को विशेषित करता है, और καὶ αὐτόν इस बात पर बल देता है कि वह भी वहीं उपस्थित था।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: शाब्दिक ‘इन दिनों’ कथावाचक संदर्भ में हिन्दी में स्वाभाविक रूप से ‘उन दिनों’ कहा जाता है।
theological_decisions:
- issue: हेरोदेस के संबंध में ἐξουσία का राजनीतिक और न्यायिक अर्थ
  choice: अधिकार-क्षेत्र
  alternative: अधिकार / शासन-क्षेत्र
  rationale: प्रसंग पिलातुस द्वारा यीशु के क्षेत्रीय संबंध के आधार पर हेरोदेस की प्रशासनिक अथवा न्यायिक सत्ता पहचानने का है। ‘अधिकार-क्षेत्र’ इस राजनीतिक-कानूनी अर्थ को व्यक्त करता है और शब्द में अनावश्यक धर्मवैज्ञानिक आशय नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधिकार-क्षेत्र’ न्यायिक-प्रशासनिक प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी स्रोत अभिव्यक्ति के वैकल्पिक अर्थ को सुरक्षित रखती है।
