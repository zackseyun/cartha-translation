  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: hi
  text: तब पिलातुस ने प्रधान याजकों और भीड़ से कहा, “मुझे इस मनुष्य पर आरोप लगाने का कोई आधार[a] नहीं मिलता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे इस मनुष्य में कोई दोष नहीं मिलता।” यूनानी शब्द αἴτιον का अर्थ “दोष” हो सकता है, पर यहाँ उसका न्यायिक भाव है—आरोप लगाने का कोई वैध आधार नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; यहाँ ‘तब’ घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है, बिना अनावश्यक विरोध का भाव जोड़े।
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: εἶπεν πρὸς
  choice: से कहा
  rationale: λέγω + πρός का स्वाभाविक हिन्दी रूप, संबोधित व्यक्तियों को स्पष्ट करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन वरिष्ठ याजकीय नेतृत्व को दर्शाता है; इसे अनेक ‘महायाजक’ पदधारियों के अर्थ में नहीं लिया गया।
- source_word: ὄχλους
  choice: भीड़ों
  rationale: यूनानी बहुवचन को बनाए रखता है; ‘लोगों’ की अपेक्षा मूल शब्द के समूहवाचक अर्थ के अधिक निकट है।
- source_word: Οὐδὲν εὑρίσκω
  choice: मुझे ... कोई ... नहीं मिलता
  rationale: वर्तमान काल की न्यायिक जाँच और निष्कर्ष को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αἴτιον
  choice: आरोप लगाने का कोई आधार
  rationale: इस न्यायिक संदर्भ में शब्द दोष मात्र नहीं, बल्कि वैध अभियोग या आरोप का आधार सूचित करता है।
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: इस मनुष्य पर
  rationale: शाब्दिक ‘इस मनुष्य में’ के बजाय न्यायिक हिन्दी में स्वाभाविक ‘इस मनुष्य पर’ चुना गया है; संकेतवाचक और पुरुषवाचक एकवचन सुरक्षित हैं।
