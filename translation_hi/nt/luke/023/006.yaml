  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: hi
  text: पर पिलातुस ने यह सुनकर पूछा कि क्या वह आदमी गलीली है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिनाम का हिन्दी बाइबल-परंपरा में प्रचलित लिप्यंतरण।
- source_word: δὲ
  choice: पर
  rationale: यह कथानक में हल्का मोड़ या विरोध दर्शाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: एओरिस्ट कृदंत का स्वाभाविक हिन्दी रूप; ‘यह’ पिछले कथन की ओर संकेत करता है, यद्यपि यूनानी में कर्म निहित है।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: क्रिया का सीधा और सामान्य हिन्दी अर्थ।
- source_word: εἰ
  choice: कि क्या
  rationale: अप्रत्यक्ष प्रश्न को आधुनिक हिन्दी में स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: ὁ ἄνθρωπος
  choice: वह आदमी
  rationale: संदर्भ में उपस्थित व्यक्ति की ओर संकेत करते हुए यूनानी ‘उस मनुष्य/आदमी’ का स्वाभाविक हिन्दी रूप; सीधे ‘यीशु’ कहकर स्रोत से अधिक स्पष्टता नहीं जोड़ी गई।
- source_word: Γαλιλαῖός
  choice: गलीली
  rationale: क्षेत्रीय पहचान बताने वाले विशेषण का प्रचलित और संक्षिप्त हिन्दी रूप।
- source_word: ἐστιν
  choice: है
  rationale: यूनानी वर्तमान काल को सुरक्षित रखा गया है; हिन्दी में भूतकालीन ‘पूछा’ के बाद अप्रत्यक्ष प्रश्न में ‘है’ स्वाभाविक है और अनावश्यक काल-परिवर्तन नहीं करता।
