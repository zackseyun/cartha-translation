  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: hi
  text: पर वे लगातार चिल्लाते रहे, “उसे क्रूस पर चढ़ाओ, क्रूस पर चढ़ाओ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप में, “उसे क्रूस पर चढ़ाकर मार डालो, क्रूस पर चढ़ाकर मार डालो!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर वे
  rationale: οἱ प्रसंग में पहले उल्लिखित लोगों की ओर संकेत करता है, और δέ पिलातुस की बात के विपरीत उनकी प्रतिक्रिया दिखाता है; इसलिए ‘पर वे’ स्वाभाविक और सटीक है।
- source_word: ἐπεφώνουν
  choice: लगातार चिल्लाते रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती क्रिया को व्यक्त करता है, और ἐπιφωνέω ऊँची आवाज़ में पुकारने का भाव देता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष उद्धरण द्वारा अंतर्निहित
  rationale: यह कृदंत चिल्लाने की विषय-वस्तु प्रस्तुत करता है। हिन्दी में ‘यह कहते हुए’ जोड़ने की अपेक्षा सीधे उद्धरण पर जाना अधिक स्वाभाविक है और अर्थ पूरा बना रहता है।
- source_word: Σταύρου σταύρου
  choice: क्रूस पर चढ़ाओ, क्रूस पर चढ़ाओ
  rationale: दोहराया गया आज्ञार्थक रूप भीड़ की तीव्र और अड़ी हुई माँग को व्यक्त करता है। आधुनिक हिन्दी में ‘क्रूस पर चढ़ाओ’ क्रूस द्वारा मृत्युदंड देने का स्थापित और स्पष्ट पदबंध है।
- source_word: αὐτόν
  choice: उसे
  rationale: αὐτόν आज्ञार्थक क्रिया का सीधा कर्म है; हिन्दी वाक्य-रचना में इसे पहले आज्ञार्थक पदबंध के साथ रखना स्वाभाविक है, जबकि दोहराव का बल बना रहता है।
theological_decisions:
- issue: σταυρόω में माँगे गए मृत्युदंड का स्वरूप
  choice: क्रूस पर चढ़ाओ
  alternative: क्रूस पर मार डालो
  rationale: क्रिया विशेष रूप से क्रूस पर चढ़ाकर मृत्युदंड देने को सूचित करती है। ‘क्रूस पर चढ़ाओ’ इसका सटीक और प्रचलित हिन्दी रूप है; यह शब्द के अर्थ से आगे कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘लगातार ... रहे’ यूनानी अपूर्ण भूतकाल की निरंतरता को व्यक्त करता है। λέγοντες का अलग अनुवाद न देकर प्रत्यक्ष उद्धरण से उसकी भूमिका स्वाभाविक रूप में व्यक्त की गई है।
