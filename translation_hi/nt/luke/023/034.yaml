  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: hi
  text: पर यीशु कह रहे थे[a], “हे पिता, इन्हें क्षमा कर, क्योंकि ये नहीं जानते कि ये क्या कर रहे हैं।” और उसके वस्त्र बाँटने के लिए चिट्ठियाँ डाली गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में ये शब्द नहीं मिलते: “हे पिता, इन्हें क्षमा कर, क्योंकि ये नहीं जानते कि ये क्या कर रहे हैं।”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल ongoing या दोहराई जा रही वाणी का संकेत दे सकता है; ‘कह रहे थे’ इस पक्ष को सामान्य हिंदी में बनाए रखता है।
- source_word: Πάτερ
  choice: हे पिता
  rationale: यह प्रत्यक्ष संबोधन है। ‘हे पिता’ स्वाभाविक, गरिमापूर्ण है और यूनानी में न होने वाला ‘मेरे’ नहीं जोड़ता।
- source_word: ἄφες
  choice: क्षमा कर
  rationale: परमेश्वर से अपराधियों के विषय में की गई प्रार्थना में ἀφίημι का प्रसंगानुकूल अर्थ ‘क्षमा करना’ है।
- source_word: αὐτοῖς
  choice: इन्हें
  rationale: सर्वनाम संबंधित लोगों की ठीक-ठीक पहचान नहीं बताता; ‘इन्हें’ निकट उपस्थित समूह की ओर संकेत करते हुए इस अनिर्दिष्टता को बनाए रखता है।
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: क्योंकि ये नहीं जानते कि ये क्या कर रहे हैं
  rationale: ‘जानते’ οἴδασιν का सीधा अर्थ रखता है और ‘समझते’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: διαμεριζόμενοι
  choice: आपस में बाँटने के लिए
  rationale: कपड़ों को अलग-अलग हिस्सों में बाँटने की क्रिया को स्वाभाविक हिंदी में व्यक्त करता है; साथ की क्रिया ‘चिट्ठियाँ डालीं’ बाँटने का माध्यम बताती है।
- source_word: ἱμάτια
  choice: वस्त्र
  rationale: यह पहनावे की वस्तुओं के लिए गरिमापूर्ण और आधुनिक हिंदी में बोधगम्य शब्द है।
- source_word: ἔβαλον κλήρους
  choice: चिट्ठियाँ डालीं
  rationale: प्राचीन रीति में निर्णय या हिस्सा निर्धारित करने के लिए lots डालने का स्वाभाविक हिंदी मुहावरा है।
- source_word: δὲ
  choice: पर / फिर
  rationale: पहला δέ हल्का विरोध या संक्रमण दिखाता है, इसलिए ‘पर’; दूसरा कथा को आगे बढ़ाता है, इसलिए हिंदी में स्वाभाविक ‘फिर’।
theological_decisions:
- issue: ‘हे पिता, इन्हें क्षमा कर...’ कथन की पाठ-प्रामाणिकता
  choice: कथन को मुख्य पाठ में रखा गया
  alternative: कुछ प्राचीन पांडुलिपियों में यह कथन नहीं मिलता
  rationale: दिए गए SBLGNT पाठ में कथन को पाठकीय अनिश्चितता के चिह्नों सहित मुख्य पाठ में छापा गया है। इसलिए इसे मुख्य पाठ में रखते हुए महत्वपूर्ण पाठांतर को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। यीशु की प्रार्थना में प्रत्यक्ष संबोधन के लिए ‘हे पिता’ रखा गया है। पाठांतर का [a] चिह्न संबंधित कथन के तुरंत बाद रखा गया है।
