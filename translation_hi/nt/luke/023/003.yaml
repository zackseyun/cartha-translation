source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: hi
  text: तब पिलातुस ने उससे पूछा, “क्या तू यहूदियों का राजा है?”[a] यीशु ने उसे उत्तर दिया, “तू कहता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया-वासियों का राजा।” यूनानी शब्द प्रसंग के अनुसार यहूदियों या यहूदिया के निवासियों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “यह तू कहता है”; अथवा अर्थ, “हाँ, जैसा तू कहता है।” यूनानी उत्तर संक्षिप्त है और इसे एक योग्य स्वीकृति के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ क्रम और स्वाभाविक हिन्दी प्रवाह दोनों को व्यक्त करता है।
- source_word: ἠρώτησεν
  choice: पूछा
  rationale: ἐρωτάω का सामान्य और प्रसंगानुकूल अर्थ ‘पूछना’ है।
- source_word: λέγων
  choice: प्रत्यक्ष अलग अनुवाद नहीं
  rationale: यूनानी में यह वचन प्रस्तुत करने वाला कृदन्त है; हिन्दी में ‘पूछा’ के बाद सीधे उद्धरण से इसका कार्य स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: Σὺ εἶ
  choice: क्या तू ... है?
  rationale: प्रसंग इसे स्पष्ट प्रश्न बनाता है; हिन्दी प्रश्नरचना में ‘क्या’ स्वाभाविक है। यीशु को संबोधित एकवचन सर्वनाम के लिए ‘तू’ मूल की निकटता और सीधी अदालती पूछताछ को रखता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: βασιλεύς राजकीय पद ‘राजा’ को स्पष्ट रूप से दर्शाता है; ‘शासक’ राजनीतिक आरोप की राजसी धार को कमजोर कर देता।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: इस मुकदमे के प्रसंग में यह प्रचलित राजनीतिक-धार्मिक पदवी ‘यहूदियों का राजा’ है; ‘यहूदिया-वासियों’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: उसने उसे उत्तर दिया
  rationale: यह स्वाभाविक हिन्दी में उत्तर देने की क्रिया तथा αὐτῷ के निर्देश दोनों को व्यक्त करता है, बिना यूनानी की कृदन्तीय रचना की अनावश्यक नकल किए।
- source_word: Σὺ λέγεις
  choice: तू ही कहता है
  rationale: यह संक्षिप्त और कुछ अप्रत्यक्ष उत्तर है। ‘तू ही कहता है’ न तो इसे सपाट ‘हाँ’ बनाता है, न इनकार; साथ ही बलयुक्त Σὺ को ‘ही’ से उभारता है।
theological_decisions:
- issue: यीशु के उत्तर Σὺ λέγεις का आशय
  choice: योग्य अथवा अप्रत्यक्ष स्वीकृति के रूप में ‘तू ही कहता है’
  alternative: ‘हाँ, जैसा तू कहता है’ अथवा ‘यह तू कहता है’
  rationale: यूनानी उत्तर अत्यंत संक्षिप्त है और साधारण ‘हाँ’ से अधिक संयत हो सकता है। मुख्य पाठ में उसकी वक्तृत्वगत और मसीही-पदवी से जुड़ी अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रत्यक्ष संवाद में ‘तू’ मूल यूनानी के एकवचन संबोधन तथा न्यायिक पूछताछ की सीधाई को बनाए रखता है। मुख्य पाठ में अनावश्यक ‘कहते हुए’ हटाकर हिन्दी को स्वाभाविक रखा गया है; दोनों पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरंत बाद दिए गए हैं।
