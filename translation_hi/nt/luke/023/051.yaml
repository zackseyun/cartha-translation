source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: hi
  text: इस व्यक्ति ने उनके निर्णय और कार्य से सहमति नहीं जताई थी। वह यहूदियों के नगर अरिमतिया का रहनेवाला था और परमेश्वर के राज्य की प्रतीक्षा कर रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: सहमति नहीं जताई थी
  rationale: ἦν के साथ पूर्ण कृदंत पहले से स्थापित असहमति को व्यक्त करता है। यह प्रयोग स्वाभाविक आधुनिक हिन्दी में सहमति या अनुमोदन न देने का भाव रखता है।
- source_word: βουλῇ
  choice: निर्णय
  rationale: संदर्भ में यह परिषद संस्था से अधिक उसके ठहराए हुए निश्चय को सूचित करता है। ‘निर्णय’ हिन्दी में इस अर्थ को स्पष्ट रखता है और ‘सभा’ जैसी संस्थागत गलतफहमी से बचाता है।
- source_word: πράξει
  choice: कार्य
  rationale: βουλή के साथ युग्म में यह उनके द्वारा वास्तव में किए गए काम को दर्शाता है। ‘निर्णय और कार्य’ निश्चय तथा उसके क्रियान्वयन के बीच का भेद बनाए रखता है।
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: यहूदियों के नगर अरिमतिया का रहनेवाला
  rationale: यह यूनानी पदबंध के अरिमतिया और ‘यहूदियों के नगर’ के संबंध को बनाए रखते हुए स्वाभाविक हिन्दी देता है। ‘यहूदिया का नगर’ कहना सम्भव है, पर τῶν Ἰουδαίων को सीधे भौगोलिक विशेषण बना देना मूल की अस्पष्टता को सीमित कर सकता है।
- source_word: προσεδέχετο
  choice: प्रतीक्षा कर रहा था
  rationale: अपूर्णकालिक क्रिया लगातार और आशाभरी प्रतीक्षा की मुद्रा व्यक्त करती है। ‘प्रतीक्षा कर रहा था’ इस कालगत भाव को स्वाभाविक रूप से रखता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह लूका में प्रचलित, स्पष्ट और धर्मवैचारिक भार वाला रूप है; यह ‘राज्य’ को केवल भूभाग या केवल शासन में सीमित नहीं करता।
- source_word: οὗτος
  choice: इस व्यक्ति ने
  rationale: संकेतवाचक शब्द पिछले पद के यूसुफ की ओर बलपूर्वक लौटता है। ‘इस व्यक्ति’ उस चिह्नित संदर्भ को साधारण ‘उसने’ से अधिक स्पष्टता से बनाए रखता है।
theological_decisions:
- issue: यीशु की मृत्यु से संबंधित महासभा के निर्णय और कार्य से यूसुफ का अलग होना
  choice: यूसुफ ने उनके निर्णय और कार्य से सहमति नहीं जताई थी
  alternative: यूसुफ ने उनके निर्णय के पक्ष में मत नहीं दिया था
  rationale: यूनानी पाठ उनकी βουλή और πρᾶξις के प्रति असहमति बताता है, पर मतदान की किसी विशिष्ट प्रक्रिया का स्पष्ट उल्लेख नहीं करता। इसलिए अनुवाद ऐतिहासिक प्रक्रिया को अनावश्यक रूप से निर्धारित किए बिना उनकी असहमति स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘इस व्यक्ति’ मूल के बलयुक्त संकेत को रखता है; ‘निर्णय और कार्य’ विचार तथा क्रियान्वयन का युग्म बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि मुख्य पाठ में अर्थ स्वाभाविक और पर्याप्त रूप से व्यक्त है।
