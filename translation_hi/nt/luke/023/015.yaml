  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: hi
  text: लेकिन हेरोदेस ने भी उसमें मृत्युदण्ड के योग्य कोई दोष नहीं पाया, क्योंकि उसने उसे हमारे पास वापस भेज दिया। और देखो, उसने ऐसा कोई काम नहीं किया जो मृत्युदण्ड के योग्य हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: और हेरोदेस ने भी उसे दोषी नहीं पाया
  rationale: यूनानी में क्रिया पिछले पद से लुप्त है; हिन्दी में अर्थ स्पष्ट और स्वाभाविक करने के लिए न्यायिक संदर्भ से ‘दोषी नहीं पाया’ पूरा किया गया है। ‘भी’ बताता है कि पिलातुस के समान हेरोदेस ने भी मृत्युदण्ड योग्य अपराध नहीं पाया।
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: क्योंकि उसने उसे हमारे पास वापस भेज दिया
  rationale: ἀνέπεμψεν प्रसंग में लौटाकर भेजने को दर्शाता है; ‘वापस भेज दिया’ दिशा और पूर्ण हुई कार्रवाई दोनों को सहज हिन्दी में व्यक्त करता है। γάρ का स्पष्टीकरणात्मक बल ‘क्योंकि’ से रखा गया है।
- source_word: καὶ ἰδοὺ
  choice: और देखो
  rationale: ἰδού श्रोताओं का ध्यान निष्कर्ष की ओर खींचता है। ‘देखो’ आधुनिक, सीधा और गरिमापूर्ण है।
- source_word: οὐδὲν ἄξιον θανάτου
  choice: ऐसा कुछ नहीं ... जो मृत्यु-दण्ड के योग्य हो
  rationale: यह न्यायिक वाक्यांश किसी ऐसे काम के अभाव को बताता है जिसके लिए मृत्युदण्ड उचित हो। ‘मृत्यु-दण्ड’ केवल सामान्य मृत्यु नहीं, बल्कि दण्डात्मक संदर्भ स्पष्ट करता है।
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: इसने ... नहीं किया
  rationale: पूर्ण कृदन्त और सहायक क्रिया का आशय वर्तमान में प्रासंगिक पूर्ण कार्य है। αὐτῷ को कर्ता-संबंधी समझकर हिन्दी में सक्रिय वाक्य बनाया गया है, जिससे यह स्पष्ट रहता है कि बात अभियुक्त के किए काम की है, उसके साथ किए गए काम की नहीं।
theological_decisions:
- issue: πεπραγμένον αὐτῷ में αὐτῷ का संबंध
  choice: 'कर्ता: ‘इसने ... नहीं किया’'
  alternative: 'संदर्भ/अवस्थिति: ‘इसमें ... नहीं पाया गया’; अथवा संबंध: ‘इसके साथ ... नहीं किया गया’'
  rationale: न्यायिक प्रसंग में पिलातुस यह घोषित कर रहा है कि यीशु ने मृत्युदण्ड योग्य कोई कार्य नहीं किया। सक्रिय हिन्दी इस अर्थ को स्पष्ट करती है, जबकि ‘इसके साथ किया गया’ प्रसंग को उलट देगा।
- issue: ἀλλ’ οὐδὲ Ἡρῴδης में लुप्त क्रिया
  choice: ‘ने भी उसे दोषी नहीं पाया’
  alternative: 'अधिक शाब्दिक: ‘और न हेरोदेस ने’'
  rationale: लुप्त क्रिया पिछले कथन से समझी जाती है। हिन्दी में उसे पूरा करना आवश्यक है, पर इसे हेरोदेस की स्वतंत्र औपचारिक घोषणा से अधिक नहीं बनाया गया; उसके द्वारा वापस भेजना ही इस निष्कर्ष का आधार है।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक अर्थ के लिए ‘दोषी’ और ‘मृत्यु-दण्ड’ प्रयुक्त हैं। शैली सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘और देखो’ मूल के ध्यानाकर्षक संकेत को बनाए रखता है।
