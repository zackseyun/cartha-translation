source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: hi
  text: और इस दृश्य को देखने के लिए इकट्ठे हुए सभी लोग, जो कुछ हुआ था उसे देखकर, अपनी छातियाँ पीटते हुए लौट रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: इकट्ठी हुई थी
  rationale: यह पद घटनास्थल पर एक साथ आए लोगों को दर्शाता है। सामूहिक संज्ञा ‘भीड़’ के साथ यह सहज आधुनिक हिन्दी है और साथ आने का भाव बनाए रखता है।
- source_word: ὄχλοι
  choice: सारी भीड़
  rationale: यूनानी में बहुवचन है, पर हिन्दी में ‘भीड़’ सामान्यतः सामूहिक एकवचन के रूप में अधिक स्वाभाविक है। ‘सारी’ πάντες का व्यापक भाव व्यक्त करता है।
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: यह दृश्य देखने के लिए
  rationale: θεωρία यहाँ सार्वजनिक रूप से देखे जाने वाले दृश्य या घटना को सूचित करता है। यह अनुवाद देखने के उद्देश्य और दृश्य—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: θεωρήσαντες
  choice: देखकर
  rationale: 'अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है: जो हुआ उसे देखने के बाद वे लौटने लगे। ‘देखकर’ इस क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: τὰ γενόμενα
  choice: जो कुछ हुआ था
  rationale: यह पदबंध घटित घटनाओं को सामूहिक रूप से बताता है। यह हिन्दी रूप स्पष्ट और मुहावरेदार है।
- source_word: τύπτοντες τὰ στήθη
  choice: अपनी छाती पीटती हुई
  rationale: यह शोक, विलाप या सदमे से जुड़ी शारीरिक मुद्रा को सीधे व्यक्त करता है, पर भीड़ की भीतरी आध्यात्मिक अवस्था का निर्णय नहीं करता।
- source_word: ὑπέστρεφον
  choice: लौट रही थी
  rationale: अपूर्णकाल चल रही या क्रमशः घट रही क्रिया दिखाता है। सामूहिक ‘भीड़’ के साथ एकवचन रूप स्वाभाविक है और यूनानी क्रिया के अपूर्ण पक्ष को बनाए रखता है।
theological_decisions:
- issue: भीड़ की प्रतिक्रिया का भावार्थ
  choice: केवल शारीरिक क्रिया—‘अपनी छाती पीटती हुई’—बताई गई है।
  alternative: इसे स्पष्ट रूप से पश्चाताप, अपराध-बोध, शोक या सदमा कहना।
  rationale: यूनानी पाठ बाहरी क्रिया का वर्णन करता है, लेकिन लोगों की आंतरिक आध्यात्मिक दशा स्पष्ट नहीं करता। इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। यूनानी बहुवचन ὄχλοι को हिन्दी की स्वाभाविक सामूहिक संज्ञा ‘भीड़’ से व्यक्त किया गया है; इसी कारण संबंधित क्रियाएँ स्त्रीलिंग एकवचन में हैं।
