  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: hi
  text: पर पिलातुस ने यीशु को रिहा करना चाहते हुए उन्हें फिर संबोधित किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें फिर पुकारा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया-विशेषण पहले किए गए संबोधन की पुनरावृत्ति दर्शाता है; ‘फिर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: δὲ
  choice: पर
  rationale: 'यहाँ कथा में हल्का विरोध उभरता है: भीड़ की माँग के विपरीत पिलातुस यीशु को छोड़ना चाहता था। ‘पर’ इस संबंध को सहज ढंग से व्यक्त करता है।'
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: यूनानी नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: προσεφώνησεν
  choice: पुकारकर कहा
  rationale: προσφωνέω किसी को संबोधित करने या पुकारकर बोलने का अर्थ दे सकता है। सार्वजनिक दृश्य में ‘पुकारकर कहा’ इसकी श्रव्यता और संबोधन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θέλων
  choice: इच्छा से
  rationale: वर्तमान कृदंत मुख्य क्रिया के समय पिलातुस की मंशा बताता है। ‘इच्छा से’ इस आशय को संक्षेप में सुरक्षित रखता है।
- source_word: ἀπολῦσαι
  choice: रिहा करने
  rationale: हिरासत और मुकदमे के संदर्भ में ‘रिहा करना’ सटीक तथा वर्तमान हिन्दी में स्वाभाविक कानूनी अभिव्यक्ति है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु को
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप; यूनानी कर्मकारक को हिन्दी के ‘को’ से व्यक्त किया गया है।
theological_decisions: []
