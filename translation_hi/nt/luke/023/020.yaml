  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पुकारकर कहा’ सार्वजनिक संबोधन को स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया के अपेक्षाकृत तटस्थ अर्थ को सुरक्षित रखती है।
