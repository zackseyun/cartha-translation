translation:
  language: hi
  text: सूरज का प्रकाश लुप्त हो गया[a], और मंदिर का परदा[b] बीच से फट गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूरज का प्रकाश मंद पड़ गया।” कुछ लोग अधिक विशिष्ट रूप से “सूर्यग्रहण हुआ” अनुवाद करते हैं, पर यूनानी शब्द किसी खगोलीय प्रक्रिया को अनिवार्य रूप से नहीं बताता।
    reason: alternative_reading
  - marker: b
    text: या, “मंदिर का आवरण।”
    reason: lexical_alternative
  - marker: c
    text: या, “बीचों-बीच फट गया” अथवा “फटकर दो भाग हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: सूरज का प्रकाश जाता रहा
  rationale: ἐκλείπω का मूल भाव चूक जाने, समाप्त होने या प्रकाश न देने का है। यह अनुवाद घटना को गैर-तकनीकी ढंग से व्यक्त करता है और किसी खगोलीय ग्रहण को अनिवार्य नहीं ठहराता। हिन्दी में ‘सूरज चूक गया’ अस्वाभाविक होता, इसलिए निहित प्रकाश को स्पष्ट किया गया है।
- source_word: ἐσχίσθη
  choice: फट गया
  rationale: कपड़े या परदे के लिए σχίζω के कर्मवाच्य का स्वाभाविक और सीधा हिन्दी रूप ‘फट गया’ है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है; ‘और’ दोनों घटनाओं को स्वाभाविक रूप से जोड़ता है, बिना अनावश्यक विरोध का भाव दिए।
- source_word: τὸ καταπέτασμα
  choice: परदा
  rationale: καταπέτασμα मन्दिर में लटके विभाजक परदे को दर्शाता है। ‘परदा’ आधुनिक हिन्दी में स्पष्ट है; पारम्परिक ‘पर्दा/आवरण’ की अपेक्षा यही सबसे सहज है।
- source_word: τοῦ ναοῦ
  choice: मन्दिर का
  rationale: ναός विशेष रूप से मन्दिर के पवित्रस्थान को सूचित कर सकता है, पर ‘मन्दिर का परदा’ हिन्दी में स्वाभाविक और परिचित है। पवित्रस्थान की अधिक विशिष्ट सम्भावना पादटिप्पणी में दी गई है।
- source_word: μέσον
  choice: बीच से
  rationale: μέσον फटने के स्थान या ढंग को बताता है। ‘बीच से’ सीधा और स्वाभाविक है; ‘दो टुकड़ों में’ सम्भावित परिणाम को अधिक स्पष्ट करता, पर यूनानी से कुछ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: सूरज के सम्बन्ध में ἐκλιπόντος का अर्थ
  choice: इसे गैर-तकनीकी रूप में ‘सूरज का प्रकाश जाता रहा’ अनूदित किया गया है।
  alternative: ‘सूरज अँधेरा हो गया’ या अधिक विशिष्ट रूप से ‘सूर्यग्रहण हुआ’।
  rationale: पद यीशु की मृत्यु के समय के ब्रह्माण्डीय अन्धकार का वर्णन करता है, पर क्रिया किसी तकनीकी खगोलीय कारण को आवश्यक नहीं बनाती। मुख्य पाठ घटना को व्यक्त करता है, उसकी वैज्ञानिक प्रक्रिया निर्धारित नहीं करता।
- issue: καταπέτασμα और ναός का निरूपण
  choice: ‘मन्दिर का परदा’
  alternative: ‘मन्दिर के पवित्रस्थान का परदा’ या ‘मन्दिर का आवरण’।
  rationale: सरल आधुनिक भाषा में ‘परदा’ वस्तु को ठीक से बताता है। ‘पवित्रस्थान’ अधिक विशिष्ट हो सकता है, पर यूनानी सम्बन्धवाचक पद को मुख्य पाठ में उससे अनिवार्य रूप से सीमित करना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की संक्षिप्तता यूनानी के संकुचित विन्यास को कुछ हद तक बनाए रखती है। ‘सूर्यग्रहण’ को मुख्य पाठ में न रखकर मूल की वास्तविक अर्थगत खुलावट सुरक्षित की गई है।
