lexical_decisions:
- source_word: παιδεύσας
  choice: दण्ड दिलवाकर
  rationale: न्यायिक प्रसंग में यह कृदन्त दण्डात्मक कार्रवाई को व्यक्त करता है और मुख्य क्रिया से पहले की कार्रवाई बताता है। ‘दण्ड दिलवाकर’ पिलातुस की शासकीय भूमिका के अनुरूप है तथा यूनानी शब्द की अपेक्षा दण्ड की विधि को अधिक विशिष्ट नहीं बनाता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिलातुस के कथन में निष्कर्ष अथवा परिणाम का संबंध स्पष्ट करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह कर्मकारक सर्वनाम यीशु की ओर संकेत करता है।
- source_word: ἀπολύσω
  choice: छोड़ दूँगा
  rationale: हिरासत और मुकदमे के प्रसंग में इसका अर्थ रिहा करना है; ‘छोड़ दूँगा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: पिलातुस के प्रस्ताव में παιδεύω का आशय
  choice: इसे न्यायिक-दण्डात्मक अर्थ में ‘दण्ड दिलवाकर’ अनूदित किया गया है।
  alternative: ‘अनुशासित करवाकर’, ‘ताड़ना दिलवाकर’, या अधिक विशिष्ट रूप से ‘कोड़े लगवाकर’।
  rationale: मुकदमे का निकट प्रसंग शिक्षा या सामान्य अनुशासन नहीं, दण्ड की मांग करता है। फिर भी यूनानी क्रिया स्वयं दण्ड की निश्चित विधि नहीं बताती, इसलिए मुख्य पाठ में ‘कोड़े लगवाकर’ जैसा अधिक विशिष्ट अर्थ नहीं रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज न्यायिक भाषा। ‘दण्ड दिलवाकर’ से पिलातुस द्वारा स्वयं दण्ड देने के बजाय उसे करवाने का भाव स्वाभाविक रूप से व्यक्त होता है।
