id: LUK.23.5
reference: Luke 23:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: hi
  text: पर वे ज़ोर देकर कहते रहे, “वह सारे यहूदिया[b] में शिक्षा देते हुए लोगों को भड़काता है[a]—गलील से आरम्भ करके यहाँ तक[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों को उकसाता है।” यूनानी क्रिया में लोगों को अशान्ति फैलाने के ढंग से उत्तेजित करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “यहूदिया” से विशेष रूप से यहूदिया प्रदेश या, कुछ सन्दर्भों में, अधिक व्यापक यहूदी भूभाग अभिप्रेत हो सकता है। यहाँ आरोप यीशु की गतिविधि के व्यापक फैलाव पर बल देता है।
    reason: cultural_note
  - marker: c
    text: अर्थात “इस स्थान तक।” यह वाक्यांश गलील से उस वर्तमान स्थान तक की ओर संकेत करता है जहाँ यीशु पिलातुस के सामने था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: ज़ोर देकर कहते रहे
  rationale: अपूर्णकालिक क्रिया आरोप लगाने वालों के लगातार और प्रबल आग्रह को व्यक्त करती है; यह हिन्दी में निरन्तरता और दबाव दोनों को स्वाभाविक रूप से सामने लाता है।
- source_word: Ἀνασείει
  choice: भड़काता है
  rationale: यह क्रिया लोगों को उकसाने या अशान्त करने के लिए उत्तेजित करने का आरोप व्यक्त करती है। ‘भड़काता है’ आरोप की विघटनकारी छाया को रखता है, पर किसी निश्चित तकनीकी राजनीतिक अपराध को नहीं जोड़ता।
- source_word: τὸν λαὸν
  choice: लोगों को
  rationale: यहाँ λαός किसी एक उपस्थित भीड़ के बजाय सामान्य जनसमुदाय को सूचित करता है।
- source_word: διδάσκων
  choice: शिक्षा देते हुए
  rationale: वर्तमान कृदन्त को बनाए रखते हुए यह भड़काने के आरोप और शिक्षा देने के बीच सम्बन्ध को खुला रखता है—शिक्षा उसका ढंग, साथ चलने वाली गतिविधि, या आरोप का आधार हो सकती है।
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: सारे यहूदिया में
  rationale: κατά के स्थान-विस्तार वाले अर्थ और ὅλης की व्यापकता को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: गलील से आरम्भ करके
  rationale: ἀπό आरम्भ-बिन्दु को दिखाता है और कृदन्त यीशु की गतिविधि के गलील से शुरू होने का संकेत देता है।
- source_word: ἕως ὧδε
  choice: यहाँ तक
  rationale: यह वाक्यांश गलील से पिलातुस के सामने वर्तमान स्थान तक पहुँचने वाले भौगोलिक विस्तार को संकेत करता है।
theological_decisions:
- issue: यीशु के विरुद्ध आरोप का स्वरूप
  choice: ‘लोगों को भड़काता है’
  alternative: ‘लोगों को विद्रोह के लिए उकसाता है’
  rationale: मूल क्रिया अशान्ति उत्पन्न करने वाले उकसावे का आरोप लगा सकती है, लेकिन अपने आप में किसी विधिक रूप से निश्चित राजद्रोह या सशस्त्र विद्रोह का आरोप अनिवार्य नहीं करती।
- issue: शिक्षा देने और भड़काने के आरोप का सम्बन्ध
  choice: ‘शिक्षा देते हुए लोगों को भड़काता है’
  alternative: ‘अपनी शिक्षा से लोगों को भड़काता है’
  rationale: मूल कृदन्त सम्बन्ध को पूर्णतः स्पष्ट नहीं करता। चुनी हुई अभिव्यक्ति यह तय नहीं करती कि शिक्षा ही भड़काने का साधन थी या दोनों बातें साथ-साथ लगाए गए आरोप थे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ज़ोर देकर कहते रहे’ आरोप लगाने वालों की लगातार तीव्रता दिखाता है; डैश गलील से वर्तमान स्थान तक के विस्तार को स्पष्ट करता है, बिना मूल कथन की भौगोलिक अस्पष्टता मिटाए।
