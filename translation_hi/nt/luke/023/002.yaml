source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: hi
  text: और वे उस पर आरोप लगाने लगे। उन्होंने कहा, “हमने इस आदमी को हमारे राष्ट्र को गुमराह करते, हमें कैसर को कर देने से रोकते, और अपने आपको मसीह, एक राजा, कहते पाया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: और वे उस पर आरोप लगाने लगे
  rationale: आरम्भसूचक क्रिया और न्यायिक प्रसंग में प्रयुक्त κατηγορεῖν, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Τοῦτον εὕραμεν
  choice: हमने इस आदमी को ... पाया है
  rationale: संकेतवाचक Τοῦτον की आरोपात्मक और कुछ हद तक तिरस्कारपूर्ण ध्वनि को ‘इस आदमी’ बनाए रखता है; हिन्दी में आरोप को वर्तमान रूप से प्रस्तुत करने के लिए पूर्ण पक्ष ‘पाया है’ स्वाभाविक है।
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: हमारे राष्ट्र को भटकाते हुए
  rationale: διαστρέφω यहाँ पथभ्रष्ट करने अथवा बिगाड़ने का आरोप व्यक्त करता है। ‘भटकाना’ राजनीतिक विद्रोह को आवश्यकता से अधिक निश्चित किए बिना व्यापक अर्थ बनाए रखता है।
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: हमें कैसर को कर देने से रोकते हुए
  rationale: κωλύω की रोकने वाली शक्ति, διδόναι का निहित कर्ता ‘हमें’, φόρους का कर/राजस्व अर्थ, और Καίσαρι का प्राप्तकर्ता-संबंध स्पष्ट रखे गए हैं।
- source_word: αὑτὸν χριστὸν βασιλέα εἶναι
  choice: अपने आपको मसीह—एक राजा—बताते हुए
  rationale: αὑτόν के आत्म-संदर्भ पर बल को ‘अपने आपको’ से, χριστός के पदवीगत अर्थ को ‘मसीह’ से, और βασιλεύς को अलग किंतु संबद्ध विधेय ‘एक राजा’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: राजनीतिक आरोप में χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ χριστός नाम के समान नहीं बल्कि राजकीय-अभिषिक्त पदवी के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में परिचित है और यहूदी अपेक्षा की पृष्ठभूमि बनाए रखता है।
- issue: χριστόν और βασιλέα का पारस्परिक संबंध
  choice: मसीह—एक राजा—
  alternative: राजा मसीह / मसीह राजा
  rationale: यूनानी में दोनों कर्मकारकीय पद यीशु के विषय में कहे गए हैं, पर उनका सटीक व्याकरणिक संबंध कुछ खुला है। डैश दोनों को निकट रखता है, फिर भी उन्हें एक स्थिर संयुक्त उपाधि में नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और न्यायिक आरोप के अनुकूल रखी गई है। ‘राष्ट्र’ राजनीतिक प्रसंग में ἔθνος को दर्शाता है; ‘कैसर’ रोमी शासकीय उपाधि का पारंपरिक हिन्दी रूप है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
