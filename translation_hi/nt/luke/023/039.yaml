  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: hi
  text: वहाँ लटके हुए अपराधियों में से एक यीशु को अपमानित करते हुए कह रहा था, “क्या तू मसीह[a] नहीं है? अपने आप को और हमें बचा!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “ख्रीस्त।” यूनानी: हो ख्रिस्तोस।'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: उनमें से एक
  rationale: δέ के हल्के कथात्मक विकास या विरोध को हिन्दी वाक्य-प्रवाह में स्वाभाविक रूप से निहित रखा गया है; अलग से ‘परन्तु’ जोड़ने पर अनावश्यक बल पड़ सकता था।
- source_word: τῶν κρεμασθέντων κακούργων
  choice: जो अपराधी वहाँ लटकाए गए थे
  rationale: κακούργων के लिए आधुनिक और स्पष्ट ‘अपराधी’ तथा κρεμασθέντων के लिए उसके अपेक्षाकृत सामान्य अर्थ ‘लटकाए गए थे’ को रखा गया है, बिना यूनानी से अधिक विशिष्ट क्रिया जोड़ने के।
- source_word: ἐβλασφήμει αὐτόν
  choice: यीशु की निन्दा करता हुआ
  rationale: सन्दर्भ में क्रिया यीशु के विरुद्ध अपमानजनक और निन्दापूर्ण वाणी बताती है। अपूर्ण काल की जारी क्रिया को ‘करता हुआ’ व्यक्त करता है; स्पष्टता के लिए सर्वनाम का संदर्भ ‘यीशु’ किया गया है।
- source_word: λέγων
  choice: कह रहा था
  rationale: वर्तमान कृदन्त को मुख्य अपूर्ण क्रिया के साथ स्वाभाविक हिन्दी कथन-रचना में प्रस्तुत किया गया है।
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: क्या तू मसीह नहीं है?
  rationale: οὐχί के अपेक्षित सकारात्मक उत्तर और व्यंग्यात्मक चुनौती दोनों को ‘क्या ... नहीं’ सुरक्षित रखता है। यहाँ χριστός एक उपाधि है, इसलिए ‘मसीह’ चुना गया है।
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: अपने आप को और हमें बचा!
  rationale: आज्ञार्थक चुनौती, तत्काल मृत्यु से छुटकारे का अर्थ और व्यापक ‘बचाने’ की शब्दगत प्रतिध्वनि सुरक्षित रहती है।
theological_decisions:
- issue: ὁ χριστός का उपाधि के रूप में अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस व्यंग्यात्मक प्रश्न में Χριστός नाम-सदृश प्रयोग नहीं, बल्कि अभिषिक्त उद्धारकर्ता की उपाधि है। ‘मसीह’ हिन्दी में इसके यहूदी मसीहाई संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- issue: ἐβλασφήμει की अर्थ-सीमा
  choice: निन्दा करता हुआ
  alternative: अपमान करता हुआ
  rationale: क्रिया में अपमानजनक वाणी का भाव है, पर ‘निन्दा’ उसके अधिक प्रबल धार्मिक और नैतिक स्वर को भी बनाए रखती है, बिना यह तय किए कि वक्ता यीशु को परमेश्वर मानकर तकनीकी अर्थ में ईशनिन्दा कर रहा था।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। अपराधी के व्यंग्य और उद्धत चुनौती को दिखाने के लिए उसके संबोधन में ‘तू’ रखा गया है। मूल पाठ में पृथक समय-सूचक ‘अब’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
