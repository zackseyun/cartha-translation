  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: hi
  text: पर वे ऊँची आवाज़ों में यह माँग करते हुए लगातार दबाव डालते रहे[a] कि उसे क्रूस पर चढ़ाया जाए, और उनकी आवाज़ें हावी होती गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे ऊँची पुकारों के साथ लगातार ज़ोर देते रहे।” यूनानी में दोनों उपवाक्यों में “आवाज़” शब्द दोहराया गया है; इस संदर्भ में उसका अनुवाद “पुकार” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: लगातार दबाव डालते रहे
  rationale: अपूर्णकाल का जारी रहने वाला पक्ष और क्रियापद में निहित आग्रहपूर्ण दबाव—दोनों इस स्वाभाविक हिन्दी अभिव्यक्ति में बने रहते हैं।
- source_word: φωναῖς μεγάλαις
  choice: ऊँची आवाज़ों से
  rationale: यह रीति/साधन बताने वाले दत्तिव का सहज हिन्दी रूप है और φωνή को पहले तथा अंतिम उपवाक्य में समान रूप से ‘आवाज़’ रखकर यूनानी पुनरावृत्ति बचाता है।
- source_word: αἰτούμενοι
  choice: माँग करते रहे
  rationale: मूल अर्थ माँगना/अनुरोध करना है; न्यायिक और आक्रामक प्रसंग में ‘माँग करते रहे’ उचित है, जबकि इसे केवल विनम्र ‘निवेदन’ कहना संदर्भ की तीव्रता घटा देता।
- source_word: αὐτὸν σταυρωθῆναι
  choice: कि उसे क्रूस पर चढ़ाया जाए
  rationale: यह कर्मकारक-सहित क्रियार्थक संज्ञा का स्वाभाविक हिन्दी आशय-वाक्य है और σταυρωθῆναι का कर्मवाच्य सुरक्षित रखता है।
- source_word: κατίσχυον
  choice: प्रबल होती गईं
  rationale: 'अपूर्णकाल चलती हुई प्रक्रिया दिखाता है: उनकी आवाज़ें कार्यवाही में अधिक प्रभावी होकर हावी हो रही थीं। ‘होती गईं’ उस प्रगतिशील भाव को व्यक्त करता है।'
- source_word: αἱ φωναὶ αὐτῶν
  choice: उनकी आवाज़ें
  rationale: φωναί की पुनरावृत्ति बनाए रखने से कथा का जोर उन्हीं की मुखर पुकार के प्रभाव पर रहता है; ‘पुकारें’ भी संदर्भानुकूल विकल्प है।
