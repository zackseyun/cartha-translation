    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: ले जाया जा रहा था
  rationale: अपूर्ण भूतकाल और कर्मवाच्य को बनाए रखते हुए यह चल रही भूतकालीन क्रिया व्यक्त करता है। हिन्दी में संयुक्त कर्ता के बजाय ‘दो ... व्यक्तियों को’ के कारण क्रिया एकवचन रूप में स्वाभाविक है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध का भाव जोड़े बिना इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: καί यीशु के अतिरिक्त इन दो व्यक्तियों के भी साथ ले जाए जाने का समावेशी भाव देता है।
- source_word: ἕτεροι
  choice: अन्य व्यक्तियों
  rationale: यह यीशु के अतिरिक्त दूसरे लोगों को सूचित करता है। ‘व्यक्तियों’ जोड़ने से हिन्दी वाक्य स्पष्ट और स्वाभाविक बनता है तथा उन्हें यीशु के साथ ‘अन्य अपराधी’ कहने की अनचाही ध्वनि से बचाता है।
- source_word: κακοῦργοι
  choice: अपराधी
  rationale: यह शब्द गंभीर गलत काम करने वाले, यहाँ दंडित अपराधियों, को दर्शाता है। ‘अपराधी’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: δύο
  choice: दो
  rationale: मूल संख्या का सीधा अनुवाद है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: σύν सहित होने या साथ जाने का भाव देता है; ‘उसके साथ’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀναιρεθῆναι
  choice: मार डालने
  rationale: यहाँ क्रिया का अर्थ मृत्यु के द्वारा समाप्त करना है। ‘मार डालने’ मूल क्रिया का व्यापक अर्थ बनाए रखता है और इसी पद में विधि को ‘क्रूस पर चढ़ाना’ कहकर अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: क्या ἀναιρεθῆναι का अनुवाद स्पष्ट रूप से ‘क्रूस पर चढ़ाने’ के रूप में किया जाए
  choice: व्यापक अभिव्यक्ति ‘मार डालने’ रखी गई।
  alternative: क्रूस पर चढ़ाने; मृत्युदंड देने
  rationale: आगे-पीछे का प्रसंग क्रूस पर चढ़ाए जाने को स्पष्ट करता है, पर इस पद की क्रिया स्वयं मृत्यु देने की विधि निर्दिष्ट नहीं करती। इसलिए मूल की शब्दार्थ-सीमा बनाए रखी गई।
- issue: क्या ‘दो अन्य अपराधी’ कहा जाए
  choice: ‘दो अन्य व्यक्तियों ... जो अपराधी थे’ कहा गया।
  alternative: दो अन्य अपराधियों
  rationale: ग्रीक में ἕτεροι उन दो लोगों को यीशु के अतिरिक्त बताता है और κακοῦργοι उन्हीं का वर्णन करता है। हिन्दी में ‘दो अन्य अपराधी’ से अनचाहे रूप में यीशु को भी अपराधियों की श्रेणी में रखने की ध्वनि निकल सकती है; संबंधवाचक उपवाक्य मूल आशय को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘ले जाया जा रहा था’ प्रक्रिया में चल रही क्रिया को सुरक्षित रखता है। संबंधवाचक रचना सामान्य पाठक के लिए स्पष्ट है और मूल में बताए गए व्यक्तियों तथा उनके अपराधी होने के वर्णन के बीच उचित संबंध बनाए रखती है।
