    text: या ‘कुकर्मी’ अथवा ‘बुरे काम करने वाले।’ यूनानी शब्द ऐसे गलत काम करने वालों के लिए प्रयुक्त होता है जो न्यायिक दंड के अधीन अपराधी थे।
    reason: lexical_alternative
