  text: प्रधान याजक और शास्त्री वहाँ खड़े थे और उस पर ज़ोरदार ढंग से आरोप लगा रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: वहाँ खड़े होकर
  rationale: यह रूप बीते समय में उपस्थित होकर खड़े रहने की स्थिति बताता है। हिन्दी में कृदन्तीय विन्यास आगे की जारी क्रिया के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में प्रसंग की निरंतरता बिना आरम्भिक ‘और’ के अधिक स्वाभाविक रहती है और कोई अर्थगत विरोध नहीं खोता।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह बहुवचन पद प्रमुख याजकीय अधिकारियों को सूचित करता है; स्थापित हिन्दी बाइबलीय पदावली ‘प्रधान याजक’ इस सामूहिक अर्थ को व्यक्त करती है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह सीधा और प्रचलित हिन्दी समतुल्य है; ‘व्यवस्था के शिक्षक’ जैसे विकल्प मूल से अधिक व्याख्यात्मक होंगे।
- source_word: εὐτόνως
  choice: बड़े ज़ोर से
  rationale: क्रियाविशेषण आरोपों की तीव्रता और प्रबलता व्यक्त करता है। यह वाक्यांश सामान्य आधुनिक हिन्दी में सहज है और केवल ऊँची आवाज़ के बजाय जोरदार ढंग का भाव देता है।
- source_word: κατηγοροῦντες
  choice: आरोप लगा रहे थे
  rationale: वर्तमान कृदन्त मुख्य स्थिति के साथ चल रही निरंतर क्रिया दिखाता है। हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक और स्पष्ट बनाता है।
- source_word: αὐτοῦ
  choice: उस पर
  rationale: κατηγορέω के साथ संबंधवाचक रूप आरोप के लक्ष्य को बताता है; हिन्दी में ‘उस पर आरोप लगाना’ इसका स्वाभाविक मुहावरा है।
