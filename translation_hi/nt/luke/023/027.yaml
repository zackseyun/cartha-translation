  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: hi
  text: लोगों की एक बड़ी भीड़ उसके पीछे चल रही थी, जिसमें स्त्रियाँ भी थीं जो उसके लिए छाती पीट रही थीं और विलाप कर रही थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: पीछे चल रही थी
  rationale: अपूर्ण काल चल रही निरंतर क्रिया को व्यक्त करता है; हिंदी में ‘पीछे चल रही थी’ स्वाभाविक है और ἀκολουθέω के दत्तिवाचक प्रयोग को स्पष्ट करता है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यह कथा की निरंतरता दर्शाता है; हिंदी में यहाँ आरंभिक संयोजक आवश्यक नहीं है।
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: लोगों की एक बड़ी भीड़
  rationale: यह यूनानी पदबंध का स्वाभाविक आधुनिक हिंदी रूप है और सामूहिक संज्ञा का भाव बनाए रखता है।
- source_word: καὶ γυναικῶν αἳ
  choice: उसमें ऐसी स्त्रियाँ भी थीं जो
  rationale: यह स्त्रियों को भीड़ में सम्मिलित बताता है और स्त्रीलिंग बहुवचन संबंधवाचक सर्वनाम का संबंध स्पष्ट रूप से उन्हीं से रखता है।
- source_word: ἐκόπτοντο
  choice: छाती पीट रही थीं
  rationale: शोक के प्रसंग में यह क्रिया स्वयं को, विशेषतः छाती को, पीटने की प्रचलित शोक-क्रिया दर्शाती है; स्पष्ट हिंदी में सांस्कृतिक संकेत व्यक्त किया गया है।
- source_word: ἐθρήνουν
  choice: विलाप कर रही थीं
  rationale: यह सुनाई देने वाले शोक या मातम का अर्थ देता है; ‘विलाप’ गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है।
- source_word: αὐτόν
  choice: उसके लिए
  rationale: हिंदी में ‘उसके लिए विलाप करना’ शोक के व्यक्ति-विषय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
