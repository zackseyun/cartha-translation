  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण कथात्मक शैली। स्त्रियों से संबंधित दोनों अपूर्णकालीन क्रियाओं की निरंतरता ‘रही थीं’ द्वारा सुरक्षित रखी गई है।
