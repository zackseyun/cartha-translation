- from: लोगों की एक बड़ी भीड़ उसके पीछे चल रही थी। उसमें ऐसी स्त्रियाँ भी थीं जो उसके लिए छाती पीट रही थीं और विलाप कर रही थीं।
  to: लोगों की एक बड़ी भीड़ उसके पीछे चल रही थी, जिसमें स्त्रियाँ भी थीं जो उसके लिए छाती पीट रही थीं और विलाप कर रही थीं।
