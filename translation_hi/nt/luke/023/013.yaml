  text: पर पिलातुस ने प्रधान याजकों, शासकों और लोगों को एक साथ बुलाकर
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: δὲ
  choice: पर
  rationale: यह हल्के विरोध अथवा कथानक में परिवर्तन का संकेत देता है; पिछले प्रसंग से पिलातुस की कार्रवाई की ओर लौटते समय ‘पर’ स्वाभाविक है।
- source_word: συγκαλεσάμενος
  choice: एक साथ बुलाकर
  rationale: अओरिस्ट मध्यवाच्य कृदंत सभा के लिए लोगों को एकत्र बुलाने और मुख्य क्रिया से पहले हुई कार्रवाई, दोनों को व्यक्त करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन यहाँ यहूदी समाज के प्रमुख याजकीय अधिकारियों को दर्शाता है, न कि एक ही समय में कई महायाजकों को।
- source_word: ἄρχοντας
  choice: शासकों
  rationale: यह पद शासन या अधिकार रखने वाले अगुओं के लिए है; ‘शासकों’ से उसका आधिकारिक भाव बना रहता है।
- source_word: λαὸν
  choice: लोगों
  rationale: यह सामूहिक रूप से उपस्थित जनसमुदाय को सूचित करता है; ‘लोगों’ से अर्थ को केवल भीड़ तक सीमित नहीं किया गया।
