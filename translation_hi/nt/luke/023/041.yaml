source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: hi
  text: और हम तो न्याय के अनुसार दण्ड पा रहे हैं[a], क्योंकि हमने जो किया था, उसी का उचित फल हमें मिल रहा है; पर इस मनुष्य ने कुछ भी अनुचित नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम तो उचित ही दण्ड पा रहे हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: न्याय के अनुसार
  rationale: यह क्रियाविशेषण दण्ड को उनके कर्मों के अनुरूप और न्यायोचित बताता है। यह अभिव्यक्ति न्यायिक भाव बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἄξια
  choice: उसी का उचित फल
  rationale: ἀπολαμβάνομεν के साथ यह उनके किए हुए कामों के अनुरूप परिणाम पाने का भाव देता है। ‘उचित फल’ स्वाभाविक हिन्दी में उस अनुपात और पात्रता को व्यक्त करता है।
- source_word: ὧν ἐπράξαμεν
  choice: हमने जो किया था
  rationale: यह सापेक्ष उपवाक्य प्राप्त दण्ड का आधार बताता है और यूनानी की पूर्ण हो चुकी क्रिया को सीधे तथा सहज रूप में रखता है।
- source_word: ἀπολαμβάνομεν
  choice: हमें मिल रहा है
  rationale: वर्तमान काल उस समय जारी परिणाम-प्राप्ति को दिखाता है। ‘मिल रहा है’ हिन्दी में इस सतत पहलू को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὗτος
  choice: इस मनुष्य
  rationale: संकेतवाचक शब्द यीशु को दोनों अपराधियों से अलग करके सामने रखता है। ‘इस मनुष्य’ उस संकेतात्मक बल को बनाए रखता है।
- source_word: οὐδὲν ἄτοπον
  choice: कुछ भी अनुचित नहीं
  rationale: ἄτοπον का अर्थ यहाँ ऐसा काम है जो अनुचित, गलत या न्यायिक दृष्टि से आपत्तिजनक हो। ‘अनुचित’ मूल की व्यापकता को बचाता है और इसे केवल किसी विशिष्ट अपराध तक सीमित नहीं करता।
- source_word: ἔπραξεν
  choice: किया
  rationale: सरल भूतकाल यीशु के किए कार्यों के बारे में वक्ता के निषेध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अपराधी द्वारा यीशु की निर्दोषता का कथन
  choice: पर इस मनुष्य ने कुछ भी अनुचित नहीं किया
  alternative: पर इस मनुष्य ने कुछ भी गलत नहीं किया
  rationale: यह अनुवाद तत्कालीन दण्ड और न्याय के संदर्भ में यीशु के विरुद्ध किसी अनुचित काम के अभाव की गवाही को स्पष्ट रखता है, पर पद से परे कोई व्यापक सिद्धान्त इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘दण्ड पा रहे हैं’ संदर्भ में निहित दण्ड को व्यक्त करता है, जबकि अगले वाक्यांश में कर्मानुरूप परिणाम का भाव सुरक्षित रखा गया है।
