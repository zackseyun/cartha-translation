  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: hi
  text: यह तैयारी का दिन था, और सब्त आरम्भ हो रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “सब्त की भोर हो रही थी।” यूनानी क्रिया का अर्थ “भोर होना” या “आरम्भ होना” हो सकता है; यहाँ इसका संकेत संध्या के समय सब्त के आरम्भ की ओर है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: तैयारी का दिन
  rationale: यहूदी-यूनानी प्रयोग में παρασκευή सब्त से पहले की तैयारी के दिन का प्रचलित नाम है। ‘तैयारी का दिन’ मूल शब्द का अर्थ बनाए रखता है और उसे सीधे ‘शुक्रवार’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: σάββατον
  choice: सब्त
  rationale: संदर्भ में निश्चित रूप से साप्ताहिक सब्त अभिप्रेत है; हिन्दी में ‘सब्त’ स्वाभाविक और पारंपरिक पद है।
- source_word: ἐπέφωσκεν
  choice: आरम्भ हो रहा था
  rationale: क्रिया का शाब्दिक अर्थ ‘भोर होना’ हो सकता है, पर यहाँ संध्या के समय सब्त के आरम्भ का वर्णन है। यह अनुवाद कालगत अर्थ स्पष्ट करता है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: यह तैयारी का दिन था
  rationale: यह रूप यूनानी संबंधवाचक रचना का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है और दिन के मान्य नाम को बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: दोनों कथनों के समन्वय को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: सब्त के आरम्भ के संबंध में ἐπέφωσκεν का अर्थ
  choice: यहाँ सब्त के संध्या में आरम्भ होने का भाव मुख्य पाठ में ‘आरम्भ हो रहा था’ से व्यक्त किया गया है।
  alternative: ‘सब्त की भोर हो रही थी’ अथवा ‘सब्त उदित हो रहा था’
  rationale: यहूदी दिन-गणना में सब्त संध्या से आरम्भ होता था। मुख्य पाठ का चयन पाठक को सुबह का भ्रामक संकेत देने से बचाता है, जबकि यूनानी क्रिया की शाब्दिक छवि पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तैयारी का दिन’ ऐतिहासिक यहूदी दिन-नाम को स्पष्ट रखते हुए मूल की शब्दावली सुरक्षित करता है; ‘आरम्भ हो रहा था’ संदर्भगत समय को स्वाभाविक हिन्दी में व्यक्त करता है।
