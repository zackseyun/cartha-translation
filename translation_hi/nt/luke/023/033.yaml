  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: hi
  text: जब वे ‘खोपड़ी’ कहलाने वाली जगह पर पहुँचे[a], तो वहाँ उन्होंने उसे और उन अपराधियों को क्रूस पर चढ़ाया—एक को दाईं ओर और दूसरे को बाईं ओर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी स्थान-संज्ञा Κρανίον का शाब्दिक अर्थ ‘खोपड़ी’ है; इसका अनुवाद ‘खोपड़ी कहलाने वाली जगह’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश का ढाँचा है, ‘एक दाहिनी ओर और एक बाईं ओर।’ यूनानी में ‘उसके’ स्पष्ट रूप से नहीं लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: जगह पर पहुँचे
  rationale: गति सूचक क्रिया के साथ ἐπί और कर्मकारक यहाँ उस स्थान तक पहुँचने का भाव देते हैं। हिन्दी कथा-शैली में ‘जगह पर पहुँचे’ स्वाभाविक और सटीक है।
- source_word: τὸν καλούμενον Κρανίον
  choice: ‘खोपड़ी’ कहलाने वाली
  rationale: Κρανίον का शाब्दिक अर्थ ‘खोपड़ी’ है। अर्थ का अनुवाद करना लिप्यंतरण से अधिक स्पष्ट है और समानांतर सुसमाचारों की किसी बाद की पारंपरिक संज्ञा को नहीं लाता।
- source_word: ἐσταύρωσαν
  choice: क्रूस पर चढ़ाया
  rationale: यह σταυρόω का मानक, संक्षिप्त और सटीक हिन्दी अनुवाद है; ‘कीलों से ठोंका’ जैसी अभिव्यक्ति क्रिया में स्पष्ट न किए गए विवरण जोड़ देती।
- source_word: κακούργους
  choice: अपराधियों
  rationale: κακοῦργος अपराध करने वालों या दुष्कर्मियों को दर्शाता है। ‘अपराधी’ आधुनिक, स्पष्ट और व्यापक है तथा इसे ‘डाकू’ या ‘विद्रोही’ कहकर दूसरे वर्णनों के साथ सामंजस्य नहीं बैठाता।
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: एक को दाईं ओर और दूसरे को बाईं ओर
  rationale: यह सहसंबंधी रचना दोनों अपराधियों की अलग-अलग स्थिति बताती है। हिन्दी में ‘एक को…दूसरे को…’ स्वाभाविक है; यूनानी में जिसका दायाँ-बायाँ है, उसके लिए कोई स्पष्ट संबंधसूचक सर्वनाम नहीं है।
theological_decisions:
- issue: Κρανίον को स्थान-संज्ञा के रूप में प्रस्तुत करना
  choice: ‘खोपड़ी’
  alternative: ‘कपाल’ या यूनानी शब्द का लिप्यंतरण
  rationale: यह नाम एक सामान्य संज्ञा से बना है और उसका अर्थ प्रसंग में महत्त्वपूर्ण है। ‘खोपड़ी’ सामान्य आधुनिक हिन्दी में स्पष्ट है तथा मूल अर्थ सुरक्षित रखता है।
- issue: यीशु के साथ क्रूस पर चढ़ाए गए पुरुषों का वर्णन
  choice: अपराधी
  alternative: दुष्कर्मी, डाकू या विद्रोही
  rationale: लूका का κακοῦργοι व्यापक शब्द है। ‘अपराधी’ उसी व्यापकता को रखता है और अन्य सुसमाचारों की शब्दावली को यहाँ आरोपित नहीं करता।
- issue: दाईं और बाईं ओर का संबंध
  choice: मुख्य पाठ में ‘उसके’ न जोड़ना
  alternative: ‘उसके दाईं ओर और उसके बाईं ओर’
  rationale: प्रसंग से यीशु के दोनों ओर होना स्वाभाविक रूप से समझ आता है, पर यूनानी वाक्यांश में ‘उसके’ स्पष्ट नहीं है। इसलिए मुख्य पाठ मूल की अभिव्यक्ति बनाए रखता है और पादटिप्पणी इस बात को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रूस पर चढ़ाया’ बाइबलीय संदर्भ में प्रचलित तथा सामान्य पाठक के लिए स्पष्ट है। उद्धरण-चिह्न ‘खोपड़ी’ को स्थान की संज्ञा के रूप में पहचानने में सहायता देते हैं।
