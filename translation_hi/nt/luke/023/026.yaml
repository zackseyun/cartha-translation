  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: hi
  text: जब वे यीशु को ले जा रहे थे, तो उन्होंने कुरेने के शमौन नाम के एक व्यक्ति को पकड़ लिया, जो देहात से आ रहा था।[a] उन्होंने उसके ऊपर क्रूस[b] रख दिया कि वह उसे यीशु के पीछे ले जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खेत से आ रहा था।’ यूनानी शब्द किसी विशेष खेत या अधिक व्यापक रूप से नगर के बाहर के देहात, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ लोग यहाँ ‘क्रूस’ को अधिक विशिष्ट अर्थ में ‘क्रूस की आड़ी बल्ली’ समझते हैं, पर यूनानी पाठ में केवल ‘क्रूस’ लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: वे यीशु को ले जा रहे थे
  rationale: ἀπάγω का अर्थ किसी को वहाँ से ले जाना या पहरे में आगे ले चलना है। हिंदी में यह रूप स्वाभाविक है; सर्वनाम की पहचान इसी पद में बाद में आए ‘यीशु’ से स्पष्ट की गई है।
- source_word: ἐπιλαβόμενοι
  choice: पकड़ लिया
  rationale: यह क्रिया किसी व्यक्ति को शारीरिक रूप से थाम लेने को व्यक्त करती है। प्रसंग में ‘पकड़ लिया’ कार्रवाई की बलपूर्वक प्रकृति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: कुरेन निवासी शमौन नाम के एक व्यक्ति
  rationale: τινα एक अनपहचाने व्यक्ति का परिचय देता है, और Κυρηναῖον उसका कुरेन से संबंध बताता है। यह हिंदी अभिव्यक्ति ‘एक निश्चित शमौन’ जैसे अस्वाभाविक शाब्दिक रूप से बचती है।
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: जो देहात से आ रहा था
  rationale: ἀγρός किसी खेत विशेष अथवा नगर से बाहर के ग्रामीण क्षेत्र को सूचित कर सकता है। मुख्य पाठ में ‘देहात’ व्यापक संभावित अर्थ को सहज रूप से व्यक्त करता है; ‘खेत’ को पादटिप्पणी में रखा गया है।
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: उन्होंने क्रूस उस पर रख दिया
  rationale: ἐπιτίθημι यहाँ किसी पर भार रखने को बताता है। ‘उस पर रख दिया’ क्रिया और थोपी गई जिम्मेदारी दोनों को स्पष्ट रखता है।
- source_word: τὸν σταυρὸν
  choice: क्रूस
  rationale: σταυρός का सीधा अर्थ ‘क्रूस’ है। ‘आड़ी बल्ली’ कहना इस पद में व्यक्त न किए गए ऐतिहासिक पुनर्निर्माण को पाठ में जोड़ देता।
- source_word: φέρειν ὄπισθεν τοῦ Ἰησοῦ
  choice: उसे यीशु के पीछे-पीछे उठाकर ले चले
  rationale: φέρειν भौतिक रूप से उठाकर ले जाने और ὄπισθεν स्थान की दृष्टि से पीछे होने को व्यक्त करता है। ‘पीछे-पीछे’ जुलूस की गति को स्वाभाविक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: क्या σταυρός को क्रूस के बजाय अधिक विशिष्ट रूप से ‘क्रूस की आड़ी बल्ली’ कहा जाए
  choice: क्रूस
  alternative: क्रूस की आड़ी बल्ली
  rationale: यूनानी पाठ में सामान्य शब्द σταυρός है, किसी विशिष्ट बल्ली का शब्द नहीं। इसलिए मुख्य पाठ स्रोत की शब्दगत व्यापकता बनाए रखता है और अधिक विशिष्ट ऐतिहासिक समझ को पादटिप्पणी तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘कुरेन निवासी’ स्थान-संबंध को संक्षेप में स्पष्ट करता है; ‘पीछे-पीछे उठाकर ले चले’ दृश्य की गति को बनाए रखता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के तुरंत बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
