base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: hi
  text: तब उनका सारा जनसमूह उठा और यीशु को पिलातुस के पास ले गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी पूरी भीड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: यह संयोजक अगले घटनाक्रम को क्रम में आगे बढ़ाता है; हिन्दी कथा-प्रवाह में ‘तब’ स्वाभाविक है और कोई अतिरिक्त कारणात्मक अर्थ नहीं जोड़ता।
- source_word: ἀναστὰν
  choice: उठी
  rationale: ἀνίστημι का अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई बताता है। संयुक्त वाक्य में ‘उठी और... ले गई’ स्वाभाविक हिन्दी है।
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: उन सबकी पूरी सभा
  rationale: πλῆθος किसी समूह या बहुसंख्या को सूचित करता है। न्यायिक संदर्भ में ‘सभा’ एकत्र निकाय को व्यक्त करती है, पर उसे किसी विशिष्ट औपचारिक संस्था के रूप में सीमित नहीं करती; ἅπαν की समग्रता ‘पूरी’ और αὐτῶν का संबंध ‘उन सबकी’ से व्यक्त होता है।
- source_word: ἤγαγον
  choice: ले गई
  rationale: ἄγω का अर्थ यहाँ किसी को गंतव्य तक ले जाना है। सामूहिक स्त्रीलिंग संज्ञा ‘सभा’ के अनुसार क्रिया ‘ले गई’ रखी गई है।
- source_word: αὐτὸν
  choice: यीशु को
  rationale: यूनानी में सर्वनाम यीशु की ओर संकेत करता है। हिन्दी में नए प्रसंग और स्पष्टता के लिए संदर्भित नाम देना स्वाभाविक है तथा अर्थ नहीं बदलता।
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: पिलातुस के पास
  rationale: गति-सूचक क्रिया के साथ ἐπί और कर्मकारक किसी व्यक्ति की ओर ले जाने को दर्शाते हैं। ‘के पास’ इस दिशा और गंतव्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘सामने’ द्वारा न्यायिक उपस्थिति को अधिक स्पष्ट किए।
- source_word: Πιλᾶτον
  choice: पिलातुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: न्यायिक संदर्भ में सामूहिक कर्ता का रूप
  choice: उन सबकी पूरी सभा
  alternative: उनकी पूरी भीड़
  rationale: ‘सभा’ पिछले न्यायिक घटनाक्रम से जुड़े एकत्र समूह को स्वाभाविक रूप से व्यक्त करती है, जबकि ‘भीड़’ आकस्मिक जनसमूह का आभास दे सकती है। फिर भी यूनानी πλῆθος में ‘भीड़/जनसमूह’ का अर्थ संभव है, इसलिए विकल्प पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘उन सबकी पूरी सभा’ मूल की समग्रता और संबंध दोनों बनाए रखता है; पाद-टिप्पणी πλῆθος की वास्तविक अर्थ-संभावना को सुरक्षित रखती है।
