- issue: βασιλεὺς τῶν Ἰουδαίων में उपहासपूर्ण राजकीय उपाधि
  choice: यहूदियों का राजा
  alternative: यहूदिया-निवासियों का राजा
  rationale: यह वाक्यांश यीशु पर लगाए गए राजनीतिक आरोप और उसके राजत्व की विडंबना दोनों से जुड़ा है। मुख्य पाठ में प्रचलित जातीय अर्थ रखा गया है, जबकि यूनानी शब्द की सम्भव क्षेत्रीय बारीकी पादटिप्पणी में सुरक्षित है।
