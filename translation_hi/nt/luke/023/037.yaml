- source_word: καὶ λέγοντες
  choice: और वे कह रहे थे
  rationale: समुच्चयबोधक और वर्तमान कृदंत को स्वाभाविक हिन्दी कथन में व्यक्त करता है तथा उपहास का भाव क्रिया में जोड़ने के बजाय प्रसंग पर छोड़ता है।
- source_word: Εἰ σὺ εἶ
  choice: यदि तू ... है
  rationale: शर्त के रूप में दी गई चुनौती और स्पष्ट सर्वनाम का जोर सुरक्षित रहता है; ‘क्योंकि’ कथन को स्वीकार किया हुआ मान लेता।
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों का राजा
  rationale: क्रूसारोपण के प्रसंग में प्रयुक्त विशिष्ट राजकीय-मसीही उपाधि को स्वाभाविक और परिचित हिन्दी में व्यक्त करता है।
- source_word: σῶσον σεαυτόν
  choice: अपने आप को बचा
  rationale: आज्ञार्थक क्रिया और उसके आत्मवाचक कर्म का सीधा अनुवाद है तथा लूका में σῴζω के व्यापक अर्थ-संबंध को बनाए रखता है।
