id: LUK.23.35
reference: Luke 23:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: hi
  text: और लोग खड़े होकर देख रहे थे। शासक भी उसका उपहास उड़ा रहे थे और कह रहे थे, “इसने दूसरों को बचाया; यदि यह परमेश्वर का मसीह, चुना हुआ है, तो अपने आप को बचा ले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: खड़े हुए थे
  rationale: यह रूप यहाँ दृश्य की स्थिर और जारी अवस्था बताता है; हिंदी में ‘खड़े हुए थे’ स्वाभाविक रूप से वही स्थिति व्यक्त करता है।
- source_word: θεωρῶν
  choice: देख रहे थे
  rationale: वर्तमान कृदंत लोगों के लगातार देखते रहने को व्यक्त करता है; ‘देख रहे थे’ सरल और स्वाभाविक हिंदी है।
- source_word: ἐξεμυκτήριζον
  choice: उपहास करते हुए
  rationale: क्रिया तिरस्कारपूर्ण हँसी और ठट्ठे का बोध देती है। ‘उपहास’ गरिमापूर्ण किंतु सर्वसुलभ शब्द है; कर्म ‘उसका’ संदर्भ से स्पष्ट किया गया है।
- source_word: ἄρχοντες
  choice: शासक
  rationale: यह शब्द संदर्भ में अधिकार रखने वाले अगुओं के लिए है। ‘शासक’ मूल अर्थ को सुरक्षित रखता है और उन्हें अनावश्यक रूप से किसी अधिक संकीर्ण समूह तक सीमित नहीं करता।
- source_word: Ἄλλους ἔσωσεν
  choice: इसने दूसरों को बचाया
  rationale: ‘बचाया’ σῴζω के उद्धार/रक्षा संबंधी अर्थ-क्षेत्र को बनाए रखता है और अगली आज्ञा में उसी क्रिया की पुनरावृत्ति संभव करता है। οὗτος के आगे आने वाले तिरस्कारपूर्ण संकेत के अनुरूप प्रत्यक्ष कथन में ‘इसने’ स्वाभाविक है।
- source_word: σωσάτω ἑαυτόν
  choice: अपने आप को बचा ले
  rationale: यह आज्ञार्थक चुनौती को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है और ‘बचाया/बचा ले’ की मूल पुनरावृत्ति सुरक्षित रखता है।
- source_word: εἰ οὗτός ἐστιν
  choice: यदि यह ... है
  rationale: ‘यह’ संकेतवाचक सर्वनाम की शक्ति और प्रसंग में निहित तिरस्कार को ‘वह’ या केवल ‘अगर मसीह है’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: परमेश्वर का मसीह
  rationale: Χριστός यहाँ उपाधि है; हिंदी में स्थापित ‘मसीह’ उसका मसीही/अभिषिक्त अर्थ वहन करता है। संबंधकारक को ‘परमेश्वर का’ के रूप में सीधा रखा गया है।
- source_word: ὁ ἐκλεκτός
  choice: चुना हुआ जन
  rationale: यह विशिष्ट उपाधि का भाव बनाए रखता है और आधुनिक हिंदी में ‘निर्वाचित’ की राजनीतिक छाया से बचते हुए समझने योग्य रहता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: यहाँ शब्द व्यक्ति के नाम की तरह नहीं, परमेश्वर से संबंधित मसीही उपाधि के रूप में प्रयुक्त है। ‘मसीह’ हिंदी बाइबलीय भाषा में परिचित है और मूल की उपाधिगत शक्ति बनाए रखता है।
- issue: ὁ ἐκλεκτός की उपाधिगत शक्ति
  choice: चुना हुआ जन
  alternative: चुना हुआ; निर्वाचित जन
  rationale: निश्चित लेख सहित यह पद विशिष्ट मसीही उपाधि है। ‘चुना हुआ जन’ उसकी विशिष्टता बनाए रखता है, पर यह नहीं बताता कि चुने जाने का अर्थ किस विशेष धर्मवैज्ञानिक प्रणाली के अनुसार समझा जाए।
- issue: शासकों के कथन का विडंबनापूर्ण तनाव
  choice: कथन को बिना व्याख्यात्मक विस्तार के प्रत्यक्ष चुनौती के रूप में रखना
  alternative: यह स्पष्ट जोड़ना कि वे यीशु के दावे को झुठला रहे थे
  rationale: मूल पाठ उनके उपहास और चुनौती को दिखाता है, लेकिन कथाकार की ओर से यहाँ उसकी धर्मवैज्ञानिक व्याख्या नहीं जोड़ता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। वाक्य में मूल की दृश्य-रचना, शासकों का तिरस्कार, ‘बचाया/बचा ले’ की पुनरावृत्ति और ‘यह’ की संकेतात्मक धार सुरक्षित रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि उपलब्ध पाठ-भेद का आशय हिंदी मुख्य पाठ में बिना कठिनाई सीधे व्यक्त होता है।
