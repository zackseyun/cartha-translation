- from: और लोग खड़े हुए देख रहे थे। पर शासक भी उसका उपहास करते हुए कह रहे थे, “इसने दूसरों को बचाया; यदि यह परमेश्वर का मसीह, चुना हुआ जन है, तो अपने आप को बचा ले।”
  to: और लोग खड़े होकर देख रहे थे। शासक भी उसका उपहास उड़ा रहे थे और कह रहे थे, “इसने दूसरों को बचाया; यदि यह परमेश्वर का मसीह, चुना हुआ है, तो अपने आप को बचा ले।”
  rationale: 'The revision corrects the Hindi expression for simultaneous standing and watching, renders the rulers’ continuing mockery directly, and replaces the collectively sounding “चुना हुआ जन” with the singular titular “चुना हुआ.” It retains the source’s irony, the demonstrative “यह,” and the verbal repetition “बचाया/बचा ले.” No footnote is necessary: the Greek wording is represented directly without a material ambiguity requiring an alternative Hindi rendering.'
