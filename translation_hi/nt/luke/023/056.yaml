id: LUK.23.56
reference: Luke 23:56
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: hi
  text: तब लौटकर[a] उन्होंने सुगन्धित मसाले और सुगन्धित तेल[b] तैयार किए। और सब्त के दिन उन्होंने आज्ञा के अनुसार विश्राम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लौट आने के बाद।” यूनानी कृदन्त मुख्य क्रिया से पहले हुई क्रिया को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “सुगन्धित तेल” का अनुवाद “इत्र” या “सुगन्धित लेप” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: लौटकर
  rationale: स्त्रीलिंग बहुवचन एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है; ‘लौटकर’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ उसके हल्के क्रमसूचक भाव को दर्शाता है।
- source_word: ἡτοίμασαν
  choice: उन्होंने ... तैयार किए
  rationale: ἑτοιμάζω का सीधा और स्वाभाविक कथात्मक अनुवाद।
- source_word: ἀρώματα
  choice: सुगन्धित मसाले
  rationale: दफ़न की पृष्ठभूमि में यह शव पर लगाने के लिए प्रयुक्त सुगन्धित पदार्थों को सूचित करता है; ‘मसाले’ के साथ ‘सुगन्धित’ अर्थ स्पष्ट करता है।
- source_word: μύρα
  choice: सुगन्धित तेल
  rationale: μύρον सुगन्धित तेल या लेप को दर्शाता है। ‘सुगन्धित तेल’ आधुनिक हिन्दी में स्पष्ट है और ἀρώματα से भेद बनाए रखता है।
- source_word: τὸ μὲν σάββατον
  choice: सब्त के दिन
  rationale: यह स्वाभाविक कालवाचक अभिव्यक्ति है; μέν का हल्का संक्रमण अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἡσύχασαν
  choice: उन्होंने ... विश्राम किया
  rationale: सब्त के संदर्भ में क्रिया काम रोकने या विश्राम करने को दर्शाती है।
- source_word: κατὰ τὴν ἐντολήν
  choice: आज्ञा के अनुसार
  rationale: यह एकवचन ἐντολήν और आज्ञा के अनुरूप आचरण—दोनों को बिना विस्तार किए सुरक्षित रखता है।
theological_decisions:
- issue: ‘आज्ञा’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘आज्ञा’ रखा गया, जिसका संदर्भ सब्त के पालन की मूसा की व्यवस्था की आज्ञा है।
  alternative: इसे ‘सब्त की आज्ञा’ या सामान्य ईश्वरीय आदेश के रूप में स्पष्ट करना।
  rationale: निकट संदर्भ सब्त की आज्ञा की ओर संकेत करता है, पर यूनानी पाठ केवल ‘आज्ञा’ कहता है; इसलिए मुख्य पाठ में व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘सब्त’ बाइबलीय पद के रूप में रखा गया है। ‘सुगन्धित मसाले’ और ‘सुगन्धित तेल’ मूल के दो भिन्न शब्दों का अंतर स्पष्ट रखते हैं।
