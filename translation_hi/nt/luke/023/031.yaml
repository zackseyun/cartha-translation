source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: hi
  text: क्योंकि यदि वे हरी लकड़ी के मामले में ये सब करते हैं,[a][b] तो सूखी लकड़ी के मामले में क्या होगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हरी लकड़ी में ... सूखी में।” यूनानी में चित्र इस अधिक संक्षिप्त रूप में है।'
    reason: lexical_alternative
  - marker: b
    text: 'यह चित्र संभवतः कम से अधिक की ओर बढ़ता है: यदि हरी लकड़ी के मामले में ऐसा होता है, तो सूखी लकड़ी के मामले में क्या होगा? ‘हरी’ और ‘सूखी’ लकड़ी के ठीक-ठीक संकेतार्थ मुख्य पाठ में निर्धारित नहीं किए गए हैं।'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ यूनानी के कारणसूचक बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: हरी लकड़ी के साथ
  rationale: ‘हरी लकड़ी’ नम या ताज़ी, आसानी से न जलने वाली लकड़ी का स्वाभाविक हिंदी वर्णन है। ‘के साथ’ यूनानी चित्र को समझने योग्य रखते हुए उसके सटीक संकेत को खुला छोड़ता है।
- source_word: ὑγρῷ
  choice: हरी
  rationale: यद्यपि शब्द का मूल अर्थ ‘नम’ या ‘गीला’ हो सकता है, ξηρός के साथ विरोध में ‘हरी’ बिना सुखाई लकड़ी के लिए स्वाभाविक शब्द है।
- source_word: ξύλῳ
  choice: लकड़ी
  rationale: ξύλον का अर्थ लकड़ी, काष्ठ या पेड़ हो सकता है। यहाँ हरी और सूखी जलने योग्य सामग्री का विरोध होने के कारण ‘लकड़ी’ उपयुक्त है और अनावश्यक रूप से ‘पेड़’ निर्धारित नहीं करता।
- source_word: ταῦτα
  choice: ये सब
  rationale: बहुवचन संकेतवाचक का बल रखा गया है; यह यीशु के साथ हो रही बातों और आसपास की घटनाओं को व्यापक रूप से सूचित कर सकता है।
- source_word: ποιοῦσιν
  choice: वे ... करते हैं
  rationale: वर्तमानकाल और यूनानी के अनिश्चित कर्ता को ‘वे’ से स्वाभाविक रूप में रखा गया है, बिना कर्ता की पहचान तय किए।
- source_word: ἐν τῷ ξηρῷ
  choice: सूखी लकड़ी के साथ
  rationale: पहले वाक्यांश की संरचना दोहराकर हरी और सूखी लकड़ी का विरोध स्पष्ट रखा गया है। ‘लकड़ी’ की पुनरावृत्ति हिंदी में अस्पष्टता से बचाती है।
- source_word: τί γένηται
  choice: क्या होगा
  rationale: प्रश्न अपेक्षित परिणाम की ओर संकेत करता है; ‘क्या होगा’ समकालीन हिंदी में इसके भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: हरी और सूखी लकड़ी का रूपक
  choice: मुख्य पाठ में रूपक को बिना उसके संकेतों की पहचान तय किए बनाए रखा गया है।
  alternative: ‘हरी लकड़ी’ को यीशु और ‘सूखी लकड़ी’ को यरूशलेम या उसके लोगों के रूप में स्पष्ट करना; अथवा इसे सीधे छोटे से बड़े न्याय का कथन बनाना।
  rationale: यह कथन संभवतः यीशु की वर्तमान पीड़ा से आने वाले अधिक बड़े संकट या न्याय की ओर बढ़ता है, पर दोनों प्रकार की लकड़ी के निश्चित संकेतार्थ विवादित हैं। अनुवाद किसी एक व्याख्या को मुख्य पाठ में नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ये सब’ यूनानी बहुवचन को व्यक्त करता है, जबकि ‘क्या होगा?’ संक्षिप्त आलंकारिक प्रश्न का बल बनाए रखता है।
