- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: वे सभी लोग जो उसे जानते थे
  rationale: γνωστοί की व्यापकता बनाए रखता है और इसे केवल घनिष्ठ मित्रों तक सीमित नहीं करता।
- source_word: μακρόθεν
  choice: दूर
  rationale: स्थानिक दूरी का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: γυναῖκες
  choice: वे स्त्रियाँ
  rationale: निश्चित पदबंध उस पहचाने हुए स्त्री-समूह की ओर संकेत करता है जिसका वर्णन आगे के कृदन्त से होता है।
- source_word: συνακολουθοῦσαι αὐτῷ
  choice: उसके साथ आई थीं
  rationale: συνακολουθέω में साथ चलते हुए अनुसरण करने का भाव है; यहाँ गलील से पहले आरम्भ हुई संगति को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: गलील से
  rationale: साथ आने के आरम्भिक स्थान अथवा स्रोत को सीधे व्यक्त करता है।
- source_word: ὁρῶσαι ταῦτα
  choice: ये सब बातें देख रहे थे
  rationale: ὁρῶσαι की जारी प्रत्यक्ष-दृष्टि और ταῦτα के बहुवचन को बनाए रखता है; मिश्रित समूह के कारण ‘देख रहे थे’ व्याकरणतः उपयुक्त है।
