source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: hi
  text: पर उसने उनसे तीसरी बार कहा, “क्यों?[a] इस मनुष्य ने क्या बुरा किया है? मैंने उसमें मृत्युदंड योग्य कोई दोष नहीं पाया।[b] इसलिए, उसे दंड देने के बाद[c] मैं उसे रिहा कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आखिर इस मनुष्य ने क्या बुरा किया है?” आरम्भिक यूनानी Τί को संक्षिप्त आपत्ति—“क्यों?”—के रूप में या अगले प्रश्न के अंग के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मृत्यु का कोई कारण नहीं,” “मृत्यु के योग्य कोई दोष नहीं,” अथवा “मृत्युदंड देने का कोई आधार नहीं।”
    reason: lexical_alternative
  - marker: c
    text: या, “अनुशासनात्मक दंड देने के बाद”; संभवतः अधिक विशेष रूप से, “कोड़े लगवाने के बाद।” यूनानी शब्द दंडात्मक कार्रवाई दर्शाता है, पर अपने आप में दंड का ठीक-ठीक रूप निर्दिष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: तीसरी बार
  rationale: यह क्रिया की पुनरावृत्ति बताने वाला क्रियाविशेषणीय प्रयोग है। ‘तीसरी बार’ स्वाभाविक हिन्दी है और कथा के जोर को बनाए रखता है।
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: क्यों? इस मनुष्य ने क्या बुरा किया है?
  rationale: आरम्भिक Τί को संक्षिप्त आपत्तिसूचक प्रश्न के रूप में लिया गया है, जिसके बाद पूरा प्रश्न आता है। ‘बुरा’ κακόν की नैतिक गंभीरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐδὲν αἴτιον θανάτου
  choice: मृत्यु-दंड का कोई आधार नहीं
  rationale: न्यायिक संदर्भ में αἴτιον कारण, दोष या दंड का आधार सूचित कर सकता है। यह अनुवाद मृत्यु की सामान्य घटना के बजाय मृत्युदंड के न्यायिक संदर्भ को स्पष्ट करता है, बिना किसी विशेष आरोप को जोड़ने के।
- source_word: εὗρον ἐν αὐτῷ
  choice: मैंने इसमें ... नहीं पाया
  rationale: अओरिस्ट क्रिया को वर्तमान निर्णय से संबंधित पूर्ण कार्य के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘इसमें’ यूनानी ἐν αὐτῷ के निकट रहता है।
- source_word: παιδεύσας
  choice: दंड देकर
  rationale: इस प्रसंग में क्रिया शिक्षण नहीं, दंडात्मक कार्रवाई सूचित करती है। ‘दंड देकर’ उसके सामान्य दंडात्मक अर्थ को रखता है, पर दंड का कोई ऐसा निश्चित रूप नहीं बताता जो इस शब्द में स्वयं निर्दिष्ट नहीं है।
- source_word: ἀπολύσω
  choice: छोड़ दूँगा
  rationale: न्यायिक प्रसंग में इसका अर्थ हिरासत से मुक्त करना है। ‘छोड़ दूँगा’ साधारण पाठकों के लिए स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: पिलातुस द्वारा प्रस्तावित παιδεύσας कार्रवाई का स्वरूप
  choice: मुख्य पाठ में सामान्य दंडात्मक अर्थ ‘दंड देकर’ रखा गया है।
  alternative: ‘अनुशासनात्मक दंड देकर’ या, अधिक विशिष्ट रूप में, ‘कोड़े लगवाकर’।
  rationale: पद में पिलातुस यीशु को मृत्युदंड के योग्य न पाते हुए भी कमतर दंड देने का प्रस्ताव रखता है। यूनानी क्रिया दंड का निश्चित रूप नहीं बताती; इसलिए निर्दोषता की घोषणा और दंड के प्रस्ताव के बीच का तनाव बनाए रखा गया है तथा अधिक विशिष्ट संभावना पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट न्यायिक कथन। ‘मृत्यु-दंड’ कानूनी संदर्भ खोलता है; ‘दंड देकर’ मूल की अनिश्चितता और कथानक के नैतिक तनाव दोनों को बनाए रखता है।
