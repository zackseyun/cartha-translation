source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: hi
  text: उसने उनसे कहा, “तुम इस मनुष्य को मेरे पास यह कहकर लाए कि यह लोगों को भटका रहा है[a]। देखो, तुम्हारे सामने इसकी जाँच करने के बाद, मुझे इस मनुष्य में ऐसा कोई दोष नहीं मिला जिसके कारण तुम इस पर आरोप लगा रहे हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह लोगों को विमुख कर रहा है।” यूनानी क्रिया का अर्थ किसी को फेर देना या भटका देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम जिन बातों का इस पर आरोप लगाते हो, उनके संबंध में मुझे इस मनुष्य में कोई दोष नहीं मिला।”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: मेरे पास ... लाए
  rationale: यह पूर्ण हो चुके कार्य को स्वाभाविक हिन्दी में व्यक्त करता है और पिलातुस के सामने लाए जाने के न्यायिक प्रसंग को बनाए रखता है।
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: इस मनुष्य को
  rationale: यहाँ ἄνθρωπος एक विशिष्ट पुरुष के लिए है; ‘इस मनुष्य’ गरिमापूर्ण और सटीक है।
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: यह कहकर ... लोगों को भटका रहा है
  rationale: ἀποστρέφω यहाँ लोगों को सही मार्ग से हटाने या बहकाने के आरोप को व्यक्त करता है। ‘भटका रहा है’ सामान्य आधुनिक हिन्दी में अर्थ को रखता है, जबकि ‘भड़का रहा है’ मूल से अधिक प्रबल राजनीतिक अर्थ जोड़ सकता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगे कही जाने वाली न्यायिक जाँच और निष्कर्ष की ओर खींचने वाला स्वाभाविक आधुनिक हिन्दी संकेतक है।
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: मैंने तुम्हारे सामने इसकी जाँच की
  rationale: ‘तुम्हारे सामने’ जाँच के खुले रूप से उनकी उपस्थिति में होने पर बल देता है; ‘जाँच’ न्यायिक अर्थ को बिना अनावश्यक विस्तार के व्यक्त करती है।
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: कोई आधार नहीं मिला
  rationale: न्यायिक संदर्भ में αἴτιον आरोप का कारण, आधार या दोष दर्शा सकता है। ‘आरोपों का कोई आधार नहीं मिला’ पिलातुस के कथन को कानूनी निष्कर्ष के रूप में स्पष्ट रखता है।
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: तुम्हारे लगाए आरोपों का
  rationale: यह κατηγορέω के न्यायिक ‘आरोप लगाना’ अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पिलातुस की घोषणा का स्वरूप
  choice: इसे लगाए गए आरोपों के लिए कोई आधार न मिलने के न्यायिक निष्कर्ष के रूप में प्रस्तुत किया गया है।
  alternative: मुझे इस मनुष्य में कोई दोष नहीं मिला।
  rationale: ἀνακρίνω, αἴτιον और κατηγορέω न्यायिक भाषा हैं। मुख्य अनुवाद तत्कालीन मुकदमे के दायरे को बनाए रखता है और इसे प्रसंग से अलग कोई व्यापक नैतिक या धर्मवैज्ञानिक निर्णय नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और न्यायिक प्रसंग के अनुकूल रूप अपनाया गया है। संबोधन में बहुवचन ‘तुम’ मूल के प्रत्यक्ष संबोधन को स्वाभाविक ढंग से रखता है। ‘देखो’ ἰδού की ध्यानाकर्षक शक्ति को पुरातन शब्दावली के बिना व्यक्त करता है।
