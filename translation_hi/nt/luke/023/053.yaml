source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: hi
  text: और उसे नीचे उतारकर उसने लिनन के कपड़े में लपेटा और उसे चट्टान को काटकर बनाई गई एक कब्र में रखा[a], जिसमें अब तक किसी को नहीं रखा गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तराशी हुई कब्र में” या “चट्टान में काटी गई कब्र में।”
    reason: lexical_alternative
  - marker: b
    text: या, “जहाँ अब तक कोई नहीं लेटा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: नीचे उतारकर
  rationale: यह क्रूस से यीशु के शरीर को उतारने की पहले हुई क्रिया बताता है; हिंदी का संयुक्त क्रिया-रूप क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐνετύλιξεν
  choice: लपेटा
  rationale: क्रिया का सीधा अर्थ कपड़े में लपेटना है; इसमें स्रोत से अधिक दफ़न-संबंधी विवरण नहीं जोड़ा गया।
- source_word: σινδόνι
  choice: मलमल के कपड़े में
  rationale: σινδών महीन सन से बने कपड़े को सूचित करता है। 'मलमल का कपड़ा' आधुनिक हिंदी में समझने योग्य है और 'कफ़न' की अपेक्षा कम व्याख्यात्मक है।
- source_word: ἔθηκεν
  choice: रखा
  rationale: τίθημι यहाँ शरीर को कब्र में रखने के अर्थ में है; सरल हिंदी में 'रखा' स्वाभाविक और सटीक है।
- source_word: μνήματι
  choice: एक कब्र में
  rationale: μνῆμα दफ़नाने के स्थान को दर्शाता है; 'कब्र' सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: λαξευτῷ
  choice: चट्टान में काटी गई
  rationale: विशेषण तराशी या काटी हुई कब्र बताता है; यह अनुवाद चट्टानी दफ़न-स्थान को स्पष्ट करता है, पर समानांतर वृत्तांतों से अतिरिक्त विवरण नहीं जोड़ता।
- source_word: οὐδεὶς οὔπω κείμενος
  choice: जहाँ अब तक किसी को नहीं रखा गया था
  rationale: वाक्यांश कब्र के पहले कभी उपयोग न किए जाने को बताता है। हिंदी में कर्मवाच्य प्रयोग दफ़न के संदर्भ में स्वाभाविक है और κείμενος के अर्थ को प्रसंगानुकूल व्यक्त करता है।
theological_decisions:
- issue: कब्र का प्रकार और उसका पहले उपयोग न होना
  choice: यीशु को चट्टान में काटी गई ऐसी कब्र में रखा गया जहाँ अब तक किसी को नहीं रखा गया था।
  alternative: यीशु को तराशी हुई ऐसी कब्र में रखा गया जहाँ कोई कभी नहीं लेटा था।
  rationale: पाठ ऐतिहासिक दफ़न-विवरण देता है। अनुवाद इस बात को बनाए रखता है कि कब्र काटकर बनाई गई थी और पहले उपयोग में नहीं आई थी, बिना समानांतर वृत्तांतों से सामंजस्यकारी सामग्री जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। 'मलमल के कपड़े' को 'कफ़न' पर प्राथमिकता दी गई है ताकि वस्त्र के कार्य की अतिरिक्त व्याख्या न जोड़ी जाए। मुख्य पाठ का [a] सही वैकल्पिक शब्दांकन से जुड़ा है।
