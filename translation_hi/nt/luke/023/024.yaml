translation:
  language: hi
  text: और पिलातुस ने निर्णय दिया कि उनकी माँग पूरी की जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: तब
  rationale: यह संयोजक पिछले घटनाक्रम से पिलातुस के निर्णय को जोड़ता है। हिन्दी कथा-प्रवाह में ‘तब’ स्वाभाविक है और यहाँ प्रसंगगत क्रम को स्पष्ट करता है।
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: ἐπέκρινεν
  choice: निर्णय दिया
  rationale: यह क्रिया न्यायिक निर्णय सुनाने या आदेश देने का भाव रखती है। ‘निर्णय दिया’ आधुनिक, सहज हिन्दी में उसके औपचारिक न्यायिक आशय को बनाए रखता है।
- source_word: γενέσθαι
  choice: पूरी की जाए
  rationale: ἐπέκρινεν के पूरक रूप में यह माँग के कार्यान्वित होने को व्यक्त करता है। हिन्दी में ‘माँग पूरी की जाए’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: τὸ αἴτημα
  choice: माँग
  rationale: αἴτημα का अर्थ निवेदन, अनुरोध या माँग हो सकता है। निकटवर्ती प्रसंग में लोगों के दबाव और आग्रह की तीव्रता के कारण ‘माँग’ उपयुक्त है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: बहुवचन संबंधकारक सर्वनाम, जो पिलातुस पर दबाव डाल रहे लोगों की माँग की ओर संकेत करता है।
theological_decisions:
- issue: पिलातुस की कार्रवाई का न्यायिक स्वरूप
  choice: पिलातुस ने निर्णय दिया कि उनकी माँग पूरी की जाए
  alternative: पिलातुस ने फैसला सुनाया कि उनका अनुरोध कार्यान्वित किया जाए
  rationale: चुना हुआ रूप पिलातुस के औपचारिक न्यायिक निर्णय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘दण्डादेश’ जैसी अधिक विशिष्ट धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। न्यायिक भाव के लिए ‘निर्णय दिया’ तथा प्रसंगगत दबाव के लिए ‘माँग’ चुना गया है।
