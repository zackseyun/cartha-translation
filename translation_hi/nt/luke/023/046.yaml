source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: hi
  text: और यीशु ने ऊँचे स्वर से पुकारकर कहा, “पिता, मैं अपनी आत्मा तेरे हाथों में सौंपता हूँ।”[a][b] इतना कहकर उसने अंतिम साँस ली।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपनी आत्मा तेरे भरोसे रखता हूँ।” इस क्रिया का अर्थ किसी वस्तु को दूसरे की देखभाल में रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह कथन भजन 31:5 के यूनानी अनुवाद की प्रतिध्वनि है: “मैं अपनी आत्मा तेरे हाथों में सौंपता हूँ।”'
    reason: cross_reference
  - marker: c
    text: या, “उसने साँस छोड़ दी,” अर्थात उसकी मृत्यु हो गई। यूनानी क्रिया का शाब्दिक संबंध साँस बाहर छोड़ने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकारकर
  rationale: यह अभिव्यक्ति क्रिया और उसके ढंग—पुकारने तथा ऊँचे स्वर—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: Πάτερ
  choice: पिता
  rationale: यूनानी में सीधा संबोधन है और ‘मेरे’ जैसा कोई संबंधसूचक शब्द नहीं है; हिन्दी में ‘पिता’ इसे सरल और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: εἰς χεῖράς σου
  choice: तेरे हाथों में
  rationale: बहुवचन ‘हाथों’ मूल पाठ के रूप और भजन 31:5 की शास्त्रीय प्रतिध्वनि को बनाए रखता है। परमेश्वर से सीधे संबोधन में ‘तेरे’ निकटता और प्रचलित बाइबलीय शैली दोनों को व्यक्त करता है।
- source_word: παρατίθεμαι
  choice: सौंपता हूँ
  rationale: मध्यवाच्य क्रिया किसी वस्तु को दूसरे की देखभाल या भरोसे में रखने का भाव देती है। ‘सौंपता हूँ’ वर्तमानकालीन, संकल्पपूर्ण कथन के रूप में स्वाभाविक है।
- source_word: τὸ πνεῦμά μου
  choice: अपनी आत्मा
  rationale: प्रार्थनापूर्ण संदर्भ में πνεῦμα के लिए ‘आत्मा’ उसके केवल शारीरिक साँस से व्यापक अर्थ को सुरक्षित रखता है; हिन्दी वाक्य में कर्ता-सापेक्ष ‘अपनी’ स्वाभाविक है।
- source_word: τοῦτο δὲ εἰπών
  choice: इतना कहकर
  rationale: यह पूर्वकालिक कृदन्त का संक्षिप्त और स्वाभाविक हिन्दी रूप है, जो बताता है कि अगली घटना इस कथन के बाद हुई।
- source_word: ἐξέπνευσεν
  choice: उसने अंतिम साँस ली
  rationale: यह मृत्यु का स्पष्ट हिन्दी मुहावरा है और मूल क्रिया में निहित साँस के बिंब को भी बनाए रखता है।
theological_decisions:
- issue: πνεῦμά μου का अर्थ
  choice: अपनी आत्मा
  alternative: अपनी साँस
  rationale: यीशु पिता को सचेत रूप से संबोधित करके स्वयं को उसके भरोसे सौंप रहा है; इसलिए ‘आत्मा’ उपयुक्त है, जबकि शब्द की अर्थ-सीमा को पादटिप्पणी या अतिरिक्त सिद्धान्त से अनावश्यक रूप से संकुचित नहीं किया गया।
- issue: παρατίθεμαι की क्रियात्मक शक्ति
  choice: सौंपता हूँ
  alternative: भरोसे में रखता हूँ
  rationale: सरल वर्तमानकाल इसे इसी क्षण किया गया संकल्पपूर्ण समर्पण बताता है। इससे यीशु की इच्छा और भरोसे का भाव बना रहता है, पर पाठ से आगे कोई विशिष्ट धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ा जाता।
- issue: ἐξέπνευσεν में मृत्यु और साँस का संबंध
  choice: उसने अंतिम साँस ली
  alternative: वह मर गया
  rationale: चुना हुआ रूप मृत्यु को स्पष्ट करता है और यूनानी क्रिया के साँस छोड़ने वाले बिंब को भी सुरक्षित रखता है; यह मृत्यु की प्रक्रिया के बारे में अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग पिता से सीधे और निकट संबोधन के लिए किया गया है। वाक्य की गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है; पादटिप्पणी-चिह्न उन्हीं पदों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
