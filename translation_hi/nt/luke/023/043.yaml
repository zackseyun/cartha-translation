source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: hi
  text: और उसने उससे कहा, “मैं तुमसे सच कहता हूँ, आज तुम मेरे साथ स्वर्गलोक में होगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कम सम्भावित विराम-विन्यास के अनुसार: “मैं आज तुमसे सच कहता हूँ, तुम मेरे साथ स्वर्गलोक में होगे।” मूल यूनानी पाठ में आधुनिक विराम-चिह्न नहीं थे; इस विकल्प में “आज” का संबंध “मैं तुमसे कहता हूँ” से माना गया है, न कि “तुम होगे” से।'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: सच
  rationale: यीशु के कथनों के आरम्भ में ἀμήν एक गंभीर और अधिकारपूर्ण पुष्टि है। “मैं तुमसे सच कहता हूँ” आधुनिक हिन्दी में स्वाभाविक है और इसके बल को बनाए रखता है।
- source_word: σοι λέγω
  choice: मैं तुमसे ... कहता हूँ
  rationale: यह यूनानी वाक्यांश का निकट और आधुनिक हिन्दी में सहज रूप है।
- source_word: σήμερον
  choice: आज
  rationale: मुख्य पाठ में इसे ἔσῃ (“होगे”) के साथ जोड़ा गया है, जो वाक्य का अधिक स्वाभाविक अर्थ है। मूल यूनानी में आधुनिक विराम-चिह्न न होने के कारण दूसरे सम्भव संबंध को पादटिप्पणी में रखा गया है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: यह सीधा और स्पष्ट अनुवाद है, जो यीशु के साथ व्यक्तिगत संगति के भाव को बनाए रखता है।
- source_word: ἔσῃ
  choice: तुम ... होगे
  rationale: εἰμί के भविष्यकाल का मानक और स्वाभाविक आधुनिक हिन्दी अनुवाद।
- source_word: παραδείσῳ
  choice: स्वर्गलोक
  rationale: इस युगांत-संबंधी प्रसंग में παράδεισος धन्य निवास-स्थान को दर्शाता है। “स्वर्गलोक” साधारण आधुनिक हिन्दी में बोधगम्य है और केवल “बगीचा” कहने से उत्पन्न संभावित भ्रम से बचाता है।
theological_decisions:
- issue: σήμερον (“आज”) का संबंध—यह कथन की क्रिया से जुड़ता है या स्वर्गलोक में होने की प्रतिज्ञा से
  choice: “आज” को “तुम मेरे साथ स्वर्गलोक में होगे” से जोड़ा गया है।
  alternative: '“आज” को “मैं तुमसे कहता हूँ” से जोड़ना: “मैं आज तुमसे सच कहता हूँ, तुम मेरे साथ स्वर्गलोक में होगे।”'
  rationale: प्राचीन यूनानी पाठ में आधुनिक विराम-चिह्न नहीं थे। शब्दक्रम और कथन का प्रवाह अधिक स्वाभाविक रूप से “आज” को भविष्य की प्रतिज्ञा से जोड़ते हैं; फिर भी दूसरा विराम-विन्यास व्याकरणतः सम्भव है और उसके धर्मवैज्ञानिक प्रभाव हैं, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। “स्वर्गलोक” परिचित धार्मिक शब्द है; विराम-विन्यास से जुड़ी वास्तविक अस्पष्टता को मुख्य पाठ में अनावश्यक बोझ बनाए बिना पादटिप्पणी में स्पष्ट किया गया है।
