lexical_decisions:
- source_word: ἐπιγραφή
  choice: अभिलेख
  rationale: यह शब्द क्रूस पर यीशु के ऊपर लगाए गए लिखित कथन को दर्शाता है। ‘अभिलेख’ लिखित और औपचारिक स्वरूप बनाए रखता है; ‘चिह्न’ अधिक व्यापक और ‘लिखित आरोप’ मुख्य पाठ के लिए अधिक व्याख्यात्मक होता।
- source_word: ἐπ’ αὐτῷ
  choice: उसके ऊपर
  rationale: क्रूस के प्रसंग में ἐπί के साथ दत्तिवाचक रूप यीशु के सापेक्ष अभिलेख का स्थान बताता है। ‘उसके ऊपर’ स्वाभाविक है और स्थानगत अर्थ को सुरक्षित रखता है।
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: यह यहूदियों का राजा है
  rationale: यूनानी वाक्य में क्रिया नहीं है और οὗτος संकेतात्मक बल देता है। हिन्दी में स्पष्ट और स्वाभाविक वाक्य के लिए ‘है’ जोड़ा गया है, जबकि ‘यह’ उस संकेतात्मक बल को बनाए रखता है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: क्रूस पर लगाए गए इस निश्चित पदनाम में ‘यहूदियों का राजा’ पारंपरिक और प्रसंगानुकूल जातीय-राजनीतिक अर्थ देता है। कुछ अन्य प्रसंगों में ‘यहूदिया के लोग’ संभव हो सकता है, पर यहाँ वह कम उपयुक्त है।
- source_word: δὲ καὶ
  choice: और ... भी
  rationale: यह संयोजन कथा में एक और विवरण जोड़ता है। हिन्दी की स्वाभाविक शब्द-व्यवस्था में ‘और ... भी’ उसके संयोजक तथा योगात्मक दोनों बल व्यक्त करता है।
theological_decisions:
- issue: क्रूस पर लगाए गए लेख का स्वरूप
  choice: लेख को सीधे यीशु की पहचान बताने वाले अभिलेख के रूप में प्रस्तुत किया गया है, बिना यह जोड़े कि वह विडंबना, आरोप या मसीही अंगीकार था।
  alternative: इसे स्पष्ट रूप से कानूनी आरोप कहना, या इसके विडंबनापूर्ण अथवा राजनीतिक आशय को मुख्य पाठ में खोलकर बताना।
  rationale: पद स्वयं अभिलेख के अस्तित्व और शब्दों की सूचना देता है। अनुवाद को यूनानी पाठ से आगे बढ़कर उसका आशय निर्णायक रूप से नहीं ठहराना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘अभिलेख’ औपचारिक लिखित सूचना का भाव देता है; वाक्य-रचना हिन्दी में स्वाभाविक रखी गई है और यूनानी की संकेतात्मक अस्पष्टता को पाद-टिप्पणी में सुरक्षित किया गया है।
