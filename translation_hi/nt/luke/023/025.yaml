  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: hi
  text: तब उसने उस व्यक्ति को रिहा कर दिया, जिसे विद्रोह और हत्या के कारण जेल में डाल दिया गया था[a] और जिसे वे माँग रहे थे; पर उसने यीशु को उनकी इच्छा पर छोड़ दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘जेल में फेंक दिया गया था।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनकी इच्छा के अनुसार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: छोड़ दिया
  rationale: कैदी को रिहा करने के अर्थ में यह स्वाभाविक और सटीक आधुनिक हिन्दी है।
- source_word: διὰ στάσιν καὶ φόνον
  choice: विद्रोह और हत्या के कारण
  rationale: διά के कारणसूचक अर्थ को स्पष्ट करता है; इस राजनीतिक संदर्भ में στάσις के लिए ‘विद्रोह’ उपयुक्त है।
- source_word: βεβλημένον εἰς φυλακήν
  choice: जेल में डाल दिया गया था
  rationale: पूर्ण निष्क्रिय कृदन्त उस पहले से घट चुकी कैद और वर्तमान दशा को व्यक्त करता है। ‘डाल दिया गया’ βάλλω की जीवंतता को सहज हिन्दी में बनाए रखता है।
- source_word: ὃν ᾐτοῦντο
  choice: जिसे वे माँग रहे थे
  rationale: अपूर्णकाल चल रही माँग को दिखाता है और ‘दबाव डालकर माँगना’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: न्यायिक नियंत्रण दूसरे पक्ष को सौंपने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ θελήματι αὐτῶν
  choice: उनकी इच्छा के हवाले
  rationale: θέλημα के इच्छा/चाह के भाव और यूनानी की संक्षिप्त, गंभीर अभिव्यक्ति को बनाए रखता है।
- source_word: δὲ ... δὲ
  choice: इसलिए ... पर
  rationale: पहला δέ पिछले घटनाक्रम का परिणामसूचक प्रवाह देता है, जबकि दूसरा छोड़े गए व्यक्ति और यीशु के साथ किए गए व्यवहार का विरोध दिखाता है।
theological_decisions:
- issue: छोड़े गए विद्रोही और यीशु के बीच विरोध को बिना प्रायश्चित-संबंधी व्याख्या जोड़े व्यक्त करना
  choice: वाक्य के विरोध को स्पष्ट रखा, पर ‘यीशु के बदले’ जैसी व्याख्यात्मक भाषा नहीं जोड़ी।
  alternative: ‘यीशु के बदले उस व्यक्ति को छोड़ दिया’ जैसी विस्तारित अभिव्यक्ति।
  rationale: पद पिलातुस के निर्णय और लोगों की इच्छा का वर्णन करता है; प्रतिस्थापन का धर्मवैज्ञानिक निष्कर्ष यहाँ प्रत्यक्ष रूप से नहीं कहा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘जेल’ प्रचलित है, ‘विद्रोह’ राजनीतिक संदर्भ को स्पष्ट रखता है, और ‘हवाले कर दिया’ न्यायिक हस्तांतरण तथा उनकी इच्छा के अधीन किए जाने—दोनों भावों को स्वाभाविक रूप से जोड़ता है।
