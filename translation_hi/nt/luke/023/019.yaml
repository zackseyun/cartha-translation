lexical_decisions:
- source_word: ὅστις
  choice: जो
  rationale: यह सम्बन्धवाचक सर्वनाम पिछले पद में आए बरअब्बा की ओर संकेत करता है; हिन्दी में ‘जो’ स्वाभाविक और स्पष्ट है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διὰ यहाँ कारण बताता है; ‘के कारण’ विद्रोह और हत्या—दोनों को उसके कारावास का आधार बताता है।
- source_word: στάσιν τινὰ
  choice: किसी विद्रोह
  rationale: στάσις नागरिक अशान्ति, बगावत या राजनीतिक विद्रोह का बोध करा सकता है, और τινά घटना को अनिश्चित रखता है। ‘किसी विद्रोह’ इस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γενομένην ἐν τῇ πόλει
  choice: नगर में हुए
  rationale: यह कृदन्त पद विद्रोह को विशेषित करता है। ‘नगर’ मूल पाठ की अनिर्दिष्टता बनाए रखता है और उसे यरूशलेम कहकर स्पष्ट नहीं करता।
- source_word: φόνον
  choice: हत्या
  rationale: φόνος न्यायिक प्रसंग में सामान्य रूप से मार डालने के बजाय आपराधिक हत्या का अर्थ देता है।
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: जेल में डाल दिया गया था
  rationale: यह वाक्यांश मूल के निष्क्रिय भाव और पूर्व में हुए कारावास को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘डाल दिया गया’ βάλλω की अपेक्षाकृत सशक्त अभिव्यक्ति भी बनाए रखता है।
