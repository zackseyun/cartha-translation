source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: hi
  text: जब हेरोदेस ने यीशु को देखा, तो वह बहुत आनन्दित हुआ, क्योंकि वह उनके विषय में सुनता आ रहा था और बहुत समय से उन्हें देखने की इच्छा रखता था; और वह आशा कर रहा था कि उन्हें कोई चिह्न करते हुए देख सके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “कोई चमत्कार।” यूनानी में “कोई चिह्न” (σημεῖον) है, जिसका अर्थ ऐसा चमत्कारी कार्य हो सकता है जो किसी महत्त्वपूर्ण बात की ओर संकेत करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: बहुत आनन्दित हुआ
  rationale: क्रिया χαίρω के आनन्दित होने के अर्थ और λίαν की तीव्रता को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐξ ἱκανῶν χρόνων
  choice: बहुत समय से
  rationale: यह अवधि की पर्याप्त लम्बाई बताने वाला मुहावरा है; हिन्दी में यह सहज है और अनावश्यक रूप से ‘कई वर्ष’ नहीं कहता।
- source_word: θέλων ἰδεῖν αὐτόν
  choice: उन्हें देखना चाहता था
  rationale: ἦν के साथ वर्तमान कृदन्त θέλων जारी इच्छा दर्शाता है; ‘चाहता था’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: वह उनके विषय में सुनता आ रहा था
  rationale: διά के साथ articular infinitive कारण बताता है और वर्तमान infinitive बार-बार या लगातार सुनने का संकेत दे सकता है। अलग वाक्य में इसे रखना हिन्दी की स्पष्टता बनाए रखते हुए कारण-संबंध को संदर्भ से स्पष्ट रखता है।
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: आशा कर रहा था कि ... कोई चिह्न ... देखेगा
  rationale: अपूर्णकालीन ἤλπιζεν जारी आशा या अपेक्षा व्यक्त करता है; σημεῖον को ‘चिह्न’ कहना उसके संकेतात्मक धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: उन्हें कोई चिह्न करते देखेगा
  rationale: ὑπό यीशु की कर्तृता बताता है। सक्रिय हिन्दी रचना मूल अर्थ को स्वाभाविक ढंग से देती है और असहज ‘उनके द्वारा किया जाता हुआ’ से बचती है।
- source_word: ὁ δὲ Ἡρῴδης
  choice: हेरोदेस
  rationale: δέ कथा को आगे बढ़ाता है; हिन्दी वाक्य-संयोजन में इसे अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: जब हेरोदेस ने यीशु को देखा
  rationale: aorist participle का मुख्य क्रिया से पूर्ववर्ती कालगत संबंध ‘जब’ वाली उपवाक्य-रचना से स्पष्ट और स्वाभाविक बनता है।
theological_decisions:
- issue: σημεῖον का अर्थ
  choice: चिह्न
  alternative: चमत्कार
  rationale: संदर्भ में चमत्कारी कार्य अभिप्रेत हो सकता है, पर ‘चिह्न’ यूनानी शब्द के व्यापक और धर्मवैचारिक संकेत को बिना संकुचित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज और गरिमापूर्ण। यीशु के लिए आदरसूचक बहुवचन सर्वनाम रखा गया है। यूनानी की जारी इच्छा, सुनते रहने और आशा करने की क्रियात्मक बारीकियों को जहाँ सम्भव है, स्वाभाविक हिन्दी में बनाए रखा गया है।
