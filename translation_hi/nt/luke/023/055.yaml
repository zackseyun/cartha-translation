source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: hi
  text: और जो स्त्रियाँ गलील से उसके साथ आई थीं[a], वे पीछे-पीछे गईं और उन्होंने कब्र को और यह भी देखा कि उसका शरीर किस प्रकार रखा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गलील से उसके साथ चली आई थीं।”
    reason: संयुक्त पूर्ण कृदंत συνεληλυθυῖαι में उसके साथ आने अथवा साथ यात्रा करके पहुँचने का भाव सम्भव है।
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: पीछे-पीछे गईं
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले या उसके साथ क्रम में हुई क्रिया बताता है। हिन्दी में समन्वित क्रिया स्वाभाविक है और अनुसरण करने का भाव स्पष्ट रखती है।
- source_word: δέ
  choice: और
  rationale: यह हल्के कथात्मक संक्रमण को चिह्नित करता है। ‘और’ प्रसंग की निरन्तरता रखता है, बिना स्पष्ट कालगत ‘तब’ जोड़ने के।
- source_word: αἱ γυναῖκες, αἵτινες
  choice: जो स्त्रियाँ … वे
  rationale: निश्चित, पहले से ज्ञात स्त्रियों के समूह को हिन्दी के स्वाभाविक सम्बन्धवाचक ढाँचे में पहचाना गया है।
- source_word: ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: गलील से उसके साथ आई थीं
  rationale: यह पूर्वकालिक साथ आने की क्रिया, गलील से आरम्भ होने का स्थान और यीशु के साथ होने का सम्बन्ध—तीनों सुरक्षित रखता है।
- source_word: ἐθεάσαντο
  choice: देखा
  rationale: क्रिया ध्यानपूर्वक देखने का भाव रख सकती है; आगे के कर्म और रीति-वाचक उपवाक्य से यह अर्थ पर्याप्त रूप से स्पष्ट होता है।
- source_word: τὸ μνημεῖον
  choice: कब्र
  rationale: दफ़नाने के प्रसंग में यह सामान्य, स्पष्ट और सटीक आधुनिक हिन्दी शब्द है।
- source_word: ὡς ἐτέθη
  choice: किस प्रकार रखा गया था
  rationale: ὡς यहाँ रीति बताता है और निष्क्रिय ἐτέθη शव को रखे जाने का वर्णन करता है। यह अनुवाद उस रीति-वाचक और निष्क्रिय अर्थ को बनाए रखता है।
- source_word: τὸ σῶμα αὐτοῦ
  choice: उसका शरीर
  rationale: सम्बन्धवाचक सर्वनाम को स्वाभाविक हिन्दी अधिकार-सूचक रूप में दिया गया है; ‘शरीर’ σῶμα का सीधा और गरिमापूर्ण अनुवाद है।
theological_decisions:
- issue: κατακολουθήσασαι और ἐθεάσαντο के बीच कथात्मक क्रम
  choice: 'समन्वित भूतकालीन क्रियाएँ: ‘पीछे-पीछे गईं और … देखा’'
  alternative: 'अधिक रूपात्मक अनुवाद: ‘पीछे-पीछे जाकर उन्होंने देखा’'
  rationale: यह मुख्यतः शैलीगत निर्णय है। समन्वित रचना हिन्दी में सहज रहते हुए स्त्रियों के अनुसरण करने और फिर देखने के कथात्मक क्रम को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘उसके’ का संकेत निकटवर्ती प्रसंग में यीशु की ओर है।
