lexical_decisions:
- source_word: Ἰδὼν
  choice: जब ... देखा
  rationale: अओरिस्ट कृदंत को मुख्य क्रिया से स्वाभाविक कालगत संबंध में रखते हुए आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: δὲ
