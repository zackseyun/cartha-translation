- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के पद के लिए हिन्दी बाइबलीय प्रयोग में परिचित और सामान्य पाठक के लिए सुबोध शब्द।
- source_word: τὸ γενόμενον
  choice: वह ... जो हुआ था
  rationale: संज्ञीकृत कृदंत निकटवर्ती घटित घटना या घटनाओं की ओर संकेत करता है; यह हिन्दी में सहज रूप से उसे व्यक्त करता है।
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: उसने परमेश्वर की महिमा की
  rationale: δοξάζω का धार्मिक भार सुरक्षित रहता है। अपूर्ण भूतकाल को यहाँ सहज हिन्दी में सामान्य भूतकाल से व्यक्त किया गया है, बिना अनिश्चित रूप से आरंभिक या निरंतर अर्थ जोड़ने के।
- source_word: λέγων
  choice: और कहा
  rationale: वर्तमान कृदंत कथन की विषयवस्तु प्रस्तुत करता है; हिन्दी में समन्वित क्रिया अधिक स्वाभाविक है।
- source_word: Ὄντως
  choice: निश्चय ही
  rationale: वक्ता की दृढ़ पुष्टि को गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἄνθρωπος οὗτος
  choice: यह मनुष्य
  rationale: यीशु के लिए प्रयुक्त विशिष्ट पुरुष व्यक्ति-संदर्भ को सीधे बनाए रखता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: शब्द के नैतिक और धर्मवैज्ञानिक भार को बनाए रखता है; प्रसंगानुसार ‘निर्दोष’ और ‘न्यायी’ भी संभव हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
- source_word: ἦν
  choice: था
  rationale: εἰμί के अपूर्ण भूतकाल का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: सूबेदार के कथन में δίκαιος का अर्थ
  choice: धर्मी
  alternative: निर्दोष; न्यायी
  rationale: ‘धर्मी’ मूल शब्द के नैतिक और धर्मवैज्ञानिक अर्थ को सुरक्षित रखता है, जबकि लूका के मुकदमे और अन्यायपूर्ण दंड के प्रसंग में ‘निर्दोष’ भी वास्तविक संभावना है। मुख्य पाठ और पादटिप्पणी मिलकर इस तनाव को बिना एकतरफा समाधान के बनाए रखते हैं।
