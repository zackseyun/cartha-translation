reference: Luke 23:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: hi
  text: पर हेरोदेस ने भी अपने सैनिकों के साथ मिलकर उसका तिरस्कार और उपहास किया। फिर उसे शानदार वस्त्र[a] पहनाकर पिलातुस के पास वापस भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चमकीला वस्त्र”; λαμπράν का अर्थ ‘चमकीला’ भी हो सकता है। संभवतः यह वस्त्र यीशु को झूठा सम्मान देने का दिखावा करके हेरोदेस के उपहास को प्रकट करता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: उसका तिरस्कार किया
  rationale: यह क्रिया किसी को तुच्छ समझने और उसके साथ अपमानपूर्वक व्यवहार करने का भाव रखती है। ‘तिरस्कार किया’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सार्वजनिक अपमान के प्रसंग के अनुकूल है।
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: अपने सैनिकों के साथ मिलकर
  rationale: στράτευμα यहाँ सैन्य दल के लोगों को सूचित करता है। ‘सैनिकों’ स्पष्ट और सहज है, तथा ‘साथ मिलकर’ सहभागिता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμπαίξας
  choice: उपहास किया
  rationale: यह क्रिया हँसी उड़ाने या उपहास करने को दर्शाती है। ‘उपहास किया’ दुःखभोग-वृत्तांत के अनुरूप गरिमापूर्ण और प्रचलित अभिव्यक्ति है।
- source_word: περιβαλὼν
  choice: पहनाकर
  rationale: किसी के शरीर पर वस्त्र डालने के भाव को ‘पहनाकर’ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσθῆτα λαμπρὰν
  choice: शानदार वस्त्र
  rationale: ἐσθής वस्त्र को और λαμπρός चमकीले, भव्य या शानदार स्वरूप को सूचित कर सकता है। ‘शानदार वस्त्र’ किसी विशिष्ट प्रकार के राजकीय चोगे को मान लिए बिना भव्यता और उपहासपूर्ण सम्मान, दोनों की संभावना बनाए रखता है।
- source_word: ἀνέπεμψεν
  choice: वापस भेज दिया
  rationale: इस न्यायिक प्रसंग में क्रिया पहले वाले अधिकारी के पास लौटाकर भेजने को सूचित करती है; ‘वापस भेज दिया’ इसका सहज हिन्दी रूप है।
- source_word: τῷ Πιλάτῳ
  choice: पिलातुस के पास
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित लिप्यंतरण रखा गया है; ‘के पास’ गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ ... καὶ ὁ Ἡρῴδης
  choice: पर हेरोदेस ने भी
  rationale: ‘पर’ कथन के अगले घटनाक्रम की ओर बढ़ाता है, जबकि ‘भी’ καὶ को दर्शाकर हेरोदेस की भूमिका पर अतिरिक्त बल सुरक्षित रखता है।
theological_decisions:
- issue: वस्त्र द्वारा किए गए उपहास का स्वरूप
  choice: वस्त्र को ‘शानदार’ कहा गया है, जिससे उपहासपूर्ण सम्मान की विडंबना संभव रहती है, पर उसे स्पष्टतः राजकीय चोगा नहीं बताया गया।
  alternative: इसे विशेष रूप से राजकीय चोगा या पागलपन/मसखरी का संकेत मानना।
  rationale: पद में तिरस्कार और उपहास स्पष्ट हैं, और शानदार वस्त्र संभवतः उसी उपहास का अंग है; फिर भी यूनानी पाठ केवल चमकीले या शानदार वस्त्र की बात करता है। इसलिए अनुवाद प्रतीक का विस्तृत अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘तिरस्कार और उपहास’ निकटार्थी होते हुए भी मूल की दो अलग क्रियाओं—तुच्छ ठहराने और हँसी उड़ाने—को सुरक्षित रखते हैं। सर्वनाम ‘उसका/उसे’ पूर्ववर्ती संदर्भ में यीशु की ओर संकेत करता है और मूल पाठ की सर्वनामात्मक अभिव्यक्ति बनाए रखता है।
