source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: hi
  text: और देखो, यूसुफ नाम का एक व्यक्ति था, जो परिषद का सदस्य था, एक भला और धर्मी[a] व्यक्ति—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: और देखो
  rationale: लूका के ध्यान खींचने वाले कथात्मक संकेत को बनाए रखता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀνὴρ
  choice: एक पुरुष
  rationale: यहाँ शब्द किसी वयस्क पुरुष व्यक्ति को दर्शाता है; ‘पुरुष’ लिंग और अपेक्षाकृत गरिमापूर्ण शैली दोनों को बनाए रखता है।
- source_word: ὀνόματι Ἰωσὴφ
  choice: यूसुफ नाम का
  rationale: यूनानी दत्तिवाचक अभिव्यक्ति का सहज हिन्दी रूप और व्यक्ति के परिचय की संरचना को सुरक्षित रखता है।
- source_word: βουλευτὴς ὑπάρχων
  choice: जो महासभा का सदस्य था
  rationale: प्रसंग में βουλευτής यहूदी शासकीय परिषद के सदस्य को दर्शाता है; ‘महासभा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला, स्पष्ट संदर्भगत पद है।
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: एक भला और धर्मी पुरुष
  rationale: यूनानी में ἀνήρ की पुनरावृत्ति को बल के लिए बनाए रखा गया है। ‘भला’ ἀγαθός का सहज रूप है और ‘धर्मी’ δίκαιος के नैतिक तथा परमेश्वर-संबंधी आयाम को सुरक्षित रखता है।
theological_decisions:
- issue: चरित्र-वर्णन में δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी / न्यायप्रिय
  rationale: यहाँ δίκαιος यूसुफ की नैतिक सीधाई और परमेश्वर के सम्मुख उचित आचरण का वर्णन कर सकता है। ‘धर्मी’ इस व्यापक बाइबलीय अर्थ को रखता है, जबकि केवल न्यायिक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद की अधूरी आगे-चलती वाक्य-संरचना दिखाने के लिए अंत में पूर्णविराम के बजाय अगले पद से जुड़ाव का संकेत मूलतः अपेक्षित है; प्रस्तुत पाठ में डैश से विशेषणात्मक पुनर्वर्णन जोड़ा गया है।
