  text: इस व्यक्ति ने पिलातुस के पास जाकर यीशु का शरीर माँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: इस व्यक्ति ने
  rationale: यह संकेतवाचक शब्द पिछले पद में बताए अरिमथिया के यूसुफ की ओर लौटकर संकेत करता है। ‘इस व्यक्ति ने’ उस बल को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: προσελθὼν
  choice: के पास जाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की सहायक घटना बताता है। हिन्दी में ‘के पास जाकर’ क्रम और पिलातुस से प्रत्यक्ष भेंट, दोनों को सहज ढंग से व्यक्त करता है।
- source_word: τῷ Πιλάτῳ
  choice: पिलातुस के पास
  rationale: सम्प्रदान कारक यहाँ उस व्यक्ति को सूचित करता है जिसके पास यूसुफ गया। केवल ‘पिलातुस’ कहना स्रोत के अनुरूप है; ‘पुन्तियुस’ जोड़ना इस पद से बाहर की सूचना होती।
- source_word: ᾐτήσατο
  choice: माँगा
  rationale: αἰτέω का मध्यरूप यहाँ किसी वस्तु को माँगने या उसका अनुरोध करने के अर्थ में है। ‘शव माँगा’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है; ‘देने का अनुरोध किया’ अनावश्यक रूप से विस्तृत और औपचारिक होता।
- source_word: τὸ σῶμα
  choice: शव
  rationale: σῶμα का मूल अर्थ ‘शरीर’ है, पर इस दफ़न-प्रसंग में मृत शरीर अभिप्रेत है। आधुनिक हिन्दी में ‘यीशु का शव माँगा’ स्पष्ट और स्वाभाविक है; केवल ‘शरीर’ जीवित देह का भ्रम उत्पन्न कर सकता है।
- source_word: τοῦ Ἰησοῦ
  choice: यीशु का
  rationale: सम्बन्धकारक रूप यीशु के शरीर को सूचित करता है। हिन्दी का ‘यीशु का शव’ इस सरल सम्बन्ध को सीधे और स्वाभाविक रूप में व्यक्त करता है।
