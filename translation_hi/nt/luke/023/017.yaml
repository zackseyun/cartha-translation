lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: आवश्यक था
  rationale: यह यूनानी मुहावरा किसी आवश्यकता या बाध्यता के अधीन होने को व्यक्त करता है। ‘आवश्यक था’ हिन्दी में स्वाभाविक है और यह तय किए बिना मूल का तनाव बनाए रखता है कि बाध्यता कानूनी थी या प्रथा से उत्पन्न।
- source_word: ἀπολύειν
  choice: रिहा करना
  rationale: दंड और हिरासत के संदर्भ में यह क्रिया किसी बंदी को छोड़ देने को दर्शाती है; ‘रिहा करना’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: κατὰ ἑορτήν
  choice: पर्व के अवसर पर
  rationale: यह वाक्यांश पर्व के अनुसार या उसके अवसर पर होने वाली प्रथा को बताता है। ‘पर्व’ धार्मिक और सार्वजनिक उत्सव के अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἕνα
  choice: एक व्यक्ति
  rationale: यूनानी शब्द का अर्थ ‘एक’ है और संदर्भ में एक बंदी अभिप्रेत है। ‘एक व्यक्ति’ मूल पाठ से अधिक विशिष्ट ‘एक पुरुष’ कहने से बचता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: सम्प्रदान कारक उन लोगों के हित या अनुरोध के अनुसार रिहाई को दर्शाता है; ‘उनके लिए’ इस संबंध को सीधे व्यक्त करता है।
