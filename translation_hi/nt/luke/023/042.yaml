  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: hi
  text: और उसने कहा, “यीशु, जब आप अपने राज्य में[a] आएँ, तो मुझे याद कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “अपने राज्य में” के स्थान पर “अपने राज्य में प्रवेश करते समय” के अर्थ वाला अधिक स्पष्ट दिशात्मक पाठ है। SBLGNT के पाठ में “अपने राज्य में” है; इसे “अपना राज्य लेकर” भी समझा गया है।
    reason: पाठांतर और मूल वाक्यांश की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ बिना अतिरिक्त व्याख्यात्मक बल जोड़े वाक्य को पिछले प्रसंग से जोड़ता है।
- source_word: ἔλεγεν
  choice: उसने कहा
  rationale: अपूर्ण भूतकाल का रूप निरंतरता भी व्यक्त कर सकता है, पर इस कथात्मक संदर्भ में हिन्दी का सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: यह व्यक्तिगत नाम का संबोधन-रूप है; हिन्दी में नाम को सीधे संबोधन के रूप में रखा गया है।
- source_word: μνήσθητί μου
  choice: मुझे याद कीजिए
  rationale: यह विनती का स्वाभाविक हिन्दी रूप है। संदर्भ में अनुकूल कार्रवाई का भाव निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट जोड़कर अर्थ का विस्तार नहीं किया गया।
- source_word: ὅταν ἔλθῃς
  choice: जब आप … आएँ
  rationale: ὅταν के साथ संभावनार्थक क्रिया भविष्य की घटना की ओर संकेत करती है; ‘जब … आएँ’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। आदरसूचक ‘आप’ अनुरोध की गरिमा के अनुरूप है।
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: अपने राज्य में
  rationale: SBLGNT के ἐν का सामान्य अर्थ ‘में’ है। ‘राज्य’ βασιλεία के राज्य, राजत्व और शासन-संबंधी अर्थों को खुला रखता है; पाठ में प्रवेश या राज्य को साथ लाने का अर्थ स्पष्ट रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: यीशु के भावी आगमन और राज्य का युगान्त-संबंधी आशय
  choice: वक्ता यीशु से उनके राज्य में आने पर उसे याद करने की विनती करता है।
  alternative: इसे यीशु के राजा के रूप में सामर्थ्य सहित आने, अपना राज्य लेकर आने, या राज्य में प्रवेश करने के रूप में समझा जा सकता है।
  rationale: पद यीशु के भावी राज्य की अपेक्षा व्यक्त करता है, पर उसके समयक्रम या पूर्ण धर्मवैज्ञानिक रूपरेखा को परिभाषित नहीं करता; इसलिए अनिश्चितता को बनाए रखा गया है।
- issue: ἐν τῇ βασιλείᾳ में संबंध या दिशा
  choice: अपने राज्य में
  alternative: अपने राज्य में प्रवेश करते समय; अपना राज्य लेकर
  rationale: मुख्य पाठ SBLGNT के ἐν को निकटता से दर्शाता है। दिशात्मक पांडुलिपि-पाठ और संदर्भगत संभावनाएँ पादटिप्पणी में रखी गई हैं, मुख्य पाठ में निर्णीत नहीं की गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘हे यीशु’ की अपेक्षा सीधा ‘यीशु’ अधिक स्वाभाविक है। ‘मुझे याद कीजिए’ सामान्य पाठक के लिए स्पष्ट है और मूल विनती को अनावश्यक धर्मवैज्ञानिक विस्तार से बचाता है।
