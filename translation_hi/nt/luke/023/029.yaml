base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: hi
  text: क्योंकि देखो, वे दिन आ रहे हैं जब लोग कहेंगे, ‘धन्य हैं बाँझ स्त्रियाँ, वे कोखें जिन्होंने कभी जन्म नहीं दिया, और वे स्तन जिन्होंने कभी दूध नहीं पिलाया।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आनेवाली विपत्ति की ओर ध्यान खींचने वाला स्वाभाविक और सीधा संबोधन है।
- source_word: στεῖραι
  choice: वे स्त्रियाँ जो बाँझ हैं
  rationale: स्त्रीलिंग बहुवचन संज्ञात्मक विशेषण को स्पष्ट, सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: वे गर्भ जिन्होंने कभी जन्म नहीं दिया
  rationale: मूल के काव्यात्मक अंग-सूचक प्रयोग को बनाए रखता है; ‘कभी’ नकार के पूर्ण आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: वे स्तन जिन्होंने कभी दूध नहीं पिलाया
  rationale: संदर्भ में ἔθρεψαν का आशय शिशु को स्तनपान कराना है; यह मूल बिंब को सुरक्षित रखते हुए स्पष्ट हिन्दी देता है।
theological_decisions:
- issue: निःसंतान स्त्रियों को ‘धन्य’ कहना
  choice: विरोधाभासी कथन को यथावत रखा गया है
  alternative: इसे केवल सामान्य सुख या सौभाग्य के रूप में समझाकर नरम करना
  rationale: यीशु आनेवाली ऐसी भीषण विपत्ति की बात कर रहे हैं जिसमें सामान्यतः दुख मानी जाने वाली निःसंतानता भी धन्य कही जाएगी; अनुवाद इस तनाव को स्वयं स्पष्ट होने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, मौखिक और भविष्यसूचक लहजा। मूल के समानांतर काव्यात्मक विन्यास और प्रत्यक्ष उद्धरण को बनाए रखा गया है।
