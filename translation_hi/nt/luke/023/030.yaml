base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: hi
  text: तब वे पहाड़ों[a] से कहने लगेंगे, ‘हम पर गिर पड़ो,’ और पहाड़ियों से, ‘हमें ढक लो।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह भाषा भविष्यद्वक्ताओं द्वारा कही गई न्याय की भाषा की प्रतिध्वनि है, विशेषकर होशे 10:8 की।
    reason: cross_reference
  - marker: b
    text: या ‘हमें छिपा लो।’ मूल क्रिया का शाब्दिक अर्थ ‘ढकना’ है, पर यहाँ आने वाले न्याय से छिपाने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रिया-विशेषण पिछले संदर्भ से आगे होने वाली घटना का क्रम बताता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἄρξονται λέγειν
  choice: कहने लगेंगे
  rationale: भविष्यकालीन ἄρξονται और पूरक infinitive λέγειν की आरंभसूचक शक्ति को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς ὄρεσιν
  choice: पहाड़ों से
  rationale: ὄρος को ‘पहाड़’ और बाद के βουνός को ‘पहाड़ी’ कहना दोनों यूनानी शब्दों का भेद बनाए रखता है। हिन्दी में किसी से कहना के साथ ‘से’ स्वाभाविक है।
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: हम पर गिर पड़ो
  rationale: बहुवचन आज्ञार्थ और ἐπί के ऊपर की ओर गति/पतन के भाव को स्पष्ट करता है; ‘गिर पड़ो’ तीव्र विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς βουνοῖς
  choice: पहाड़ियों से
  rationale: βουνός सामान्यतः अपेक्षाकृत छोटी ऊँचाई या पहाड़ी को दर्शाता है, इसलिए ὄρεσιν से शब्दगत भेद सुरक्षित रहता है।
- source_word: Καλύψατε ἡμᾶς
  choice: हमें ढक लो
  rationale: καλύπτω का सीधा अर्थ ‘ढकना’ है; यह मूल ठोस बिंब को बनाए रखता है, जबकि संदर्भ में छिपाने का आशय भी संभव है।
theological_decisions:
- issue: भविष्यद्वाणी-संबंधी न्याय का बिंब
  choice: पहाड़ों और पहाड़ियों से की गई शाब्दिक पुकार को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: मुख्य पाठ में इसे ‘आने वाले न्याय से हमें छिपा लो’ के रूप में स्पष्ट करना।
  rationale: यह होशे 10:8 की न्याय-संबंधी भाषा की प्रतिध्वनि है। ठोस बिंब को बनाए रखने से अंतर्पाठीय संबंध और धर्मवैचारिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक पाठ। ‘पहाड़ों’ और ‘पहाड़ियों’ से यूनानी संज्ञाओं का भेद रखा गया है; ‘ढक लो’ मूल बिंब को सुरक्षित रखता है।
