  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: hi
  text: परन्तु दूसरे ने उसे डाँटते हुए उत्तर दिया, “क्या तुम्हें परमेश्वर का भय भी नहीं है, क्योंकि तुम भी उसी दण्डादेश[a] के अधीन हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसी न्याय” अथवा “उसी निर्णय” के अधीन। यूनानी शब्द κρίμα का अर्थ न्याय, निर्णय या दण्डादेश हो सकता है; यहाँ दोनों की समान दण्डात्मक स्थिति प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: परन्तु दूसरे ने ... उत्तर दिया
  rationale: δέ यहाँ पहले अपराधी के व्यवहार से हल्का विरोध दिखाता है; ἀποκριθείς प्रत्यक्ष कथन का स्वाभाविक परिचय है और ὁ ἕτερος दूसरे अपराधी को सूचित करता है।
- source_word: ἐπιτιμῶν αὐτῷ
  choice: उसे डाँटते हुए
  rationale: वर्तमान कृदन्त बोलने के साथ-साथ होने वाली क्रिया और कड़ी फटकार का भाव बनाए रखता है।
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: क्या तू परमेश्वर से भी नहीं डरता
  rationale: οὐδέ का जोर ‘भी नहीं’ से व्यक्त होता है। φοβέομαι का सीधा धार्मिक-नैतिक अर्थ ‘परमेश्वर से डरना’ रखा गया है; इसे केवल ‘आदर करना’ बनाकर नरम नहीं किया गया। स्पष्ट σὺ का बल सहज हिंदी में एकवचन ‘तू’ से उभरता है।
- source_word: ὅτι
  choice: जबकि
  rationale: 'यह आगे कही परिस्थिति को प्रश्न के आधार के रूप में प्रस्तुत करता है। हिंदी में ‘जबकि’ उस तीखे विरोध को स्वाभाविक रूप से दिखाता है: वही दण्ड झेलते हुए भी वह परमेश्वर से नहीं डरता।'
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: तू भी उसी दण्डादेश के अधीन है
  rationale: κρίμα न्याय, निर्णय, दोषदण्ड या दण्डादेश का बोध करा सकता है। क्रूस-दण्ड के प्रसंग में ‘दण्डादेश के अधीन’ साझा कानूनी और दण्डात्मक स्थिति को स्पष्ट करता है। मूल के αὐτῷ (‘उसी’) के साथ हिंदी में आवश्यक निहित तुलना ‘भी’ से स्वाभाविक होती है।
theological_decisions:
- issue: परमेश्वर के भय का अर्थ
  choice: परमेश्वर से डरना
  alternative: परमेश्वर का आदर करना
  rationale: मूल पद नैतिक उत्तरदायित्व से जुड़ा हुआ ‘भय’ कहता है। सीधा बाइबलीय मुहावरा धार्मिक गंभीरता और संभावित श्रद्धामय भय दोनों को खुला रखता है।
- issue: κρίμα की न्यायिक सीमा
  choice: दण्डादेश
  alternative: न्याय / दोषदण्ड
  rationale: तात्कालिक प्रसंग में दोनों अपराधी एक ही प्रकार के दण्ड के अधीन हैं। फिर भी शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में रखा गया है, ताकि इसे केवल दण्ड की क्रिया या अंतिम ईश्वरीय न्याय तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिंदी। दो अपराधियों के बीच प्रत्यक्ष संबोधन होने के कारण एकवचन ‘तू’ स्वाभाविक है और यूनानी के स्पष्ट σὺ का बल भी बनाए रखता है। ‘दण्डादेश’ कानूनी प्रसंग को स्पष्ट करता है; अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
