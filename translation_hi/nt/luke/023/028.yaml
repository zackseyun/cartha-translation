id: LUK.23.28
reference: Luke 23:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: hi
  text: पर यीशु ने उनकी ओर मुड़कर कहा, “यरूशलेम की बेटियों, मेरे लिए मत रोओ; बल्कि अपने लिए और अपने बच्चों के लिए रोओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: अओरिस्ट कृदन्त यीशु के उन स्त्रियों की ओर शारीरिक रूप से मुड़ने को मुख्य क्रिया ‘कहा’ से जोड़ता है; ‘मुड़कर’ हिन्दी में इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ हल्के संक्रमण अथवा विरोध को दर्शाता है। ‘पर’ स्त्रियों के विलाप और यीशु के उत्तर के बीच का विरोध संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: πρὸς αὐτὰς
  choice: उनकी ओर
  rationale: πρός के साथ कर्मकारक दिशा का बोध कराता है; ‘उनकी ओर’ मुड़ने की शारीरिक दिशा को सुरक्षित रखता है।
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: यरूशलेम की बेटियो
  rationale: सम्बोधन का शाब्दिक पारिवारिक रूप और उसका नबूवत-सदृश शास्त्रीय स्वर बनाए रखा गया है। आधुनिक हिन्दी में ‘की बेटियो’ स्वाभाविक सम्बोधन है।
- source_word: μὴ κλαίετε
  choice: मत रोओ
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। ‘मत रोओ’ सहज हिन्दी है और यह अनावश्यक रूप से तय नहीं करता कि अर्थ केवल ‘रोना बन्द करो’ है।
- source_word: ἐπ’ ἐμέ
  choice: मेरे लिए
  rationale: κλαίω के बाद ἐπί यहाँ रोने के विषय अथवा कारण को दर्शाता है; ‘मेरे लिए’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: πλὴν
  choice: बल्कि
  rationale: यह पहले निषेध को सुधारात्मक विरोध के साथ अगले आदेश से जोड़ता है—मेरे लिए नहीं, बल्कि अपने लिए।
- source_word: ἐφ’ ἑαυτὰς
  choice: अपने लिए
  rationale: आत्मवाचक सर्वनाम पहले आए ‘मेरे लिए’ के समानान्तर है; ‘अपने लिए’ उस समानता को बनाए रखता है।
- source_word: τὰ τέκνα ὑμῶν
  choice: अपने बच्चों के लिए
  rationale: τέκνα पारिवारिक अर्थ में सन्तान को दर्शाता है। संयुक्त हिन्दी वाक्य में ‘अपने’ का सम्बन्ध सम्बोधित स्त्रियों से स्पष्ट रहता है।
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμ सम्बोधन का अनुवाद
  choice: यरूशलेम की बेटियो
  alternative: यरूशलेम की स्त्रियो
  rationale: ‘बेटियो’ मूल के पारिवारिक और सामूहिक मुहावरे के साथ उसके नबूवत-सदृश शास्त्रीय अनुनाद को सुरक्षित रखता है; इसे केवल जनसांख्यिक पहचान ‘स्त्रियो’ में समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’, ‘मुड़कर’, ‘मत रोओ’ और ‘बल्कि’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘यरूशलेम की बेटियो’ मूल की शास्त्रीय प्रतिध्वनि को बनाए रखता है।
