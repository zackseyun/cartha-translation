id: LUK.23.12
reference: Luke 23:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: hi
  text: और उसी दिन हेरोदेस और पिलातुस आपस में मित्र हो गए[a], क्योंकि इससे पहले वे एक-दूसरे के शत्रु थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक-दूसरे के प्रति मैत्रीपूर्ण हो गए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे एक-दूसरे के प्रति वैर की स्थिति में थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: हो गए
  rationale: यह क्रिया संबंध की स्थिति में आए परिवर्तन को व्यक्त करती है; ‘हो गए’ स्वाभाविक हिन्दी में इस परिवर्तन को स्पष्ट रखता है।
- source_word: φίλοι
  choice: मित्र
  rationale: बहुवचन विधेय संज्ञा वास्तविक मित्रता या मैत्रीपूर्ण गठबंधन का संकेत दे सकती है; ‘मित्र’ सीधा और गरिमापूर्ण अनुवाद है।
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: हेरोदेस और पिलातुस
  rationale: यूनानी रचना दोनों व्यक्तियों को साथ रखती है; हिन्दी में साधारण ‘और’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: उसी दिन
  rationale: ‘उसी’ मूल पाठ के बलाघात को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: μετ’ ἀλλήλων
  choice: आपस में
  rationale: यह पारस्परिक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προϋπῆρχον
  choice: इससे पहले ... थे
  rationale: अपूर्ण भूतकाल के साथ उपसर्ग पूर्ववर्ती और जारी अवस्था को दर्शाते हैं; हिन्दी में यह वाक्य-विन्यास वर्तमान घटना से उसका समयगत विरोध स्पष्ट करता है।
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: वे एक-दूसरे के शत्रु थे
  rationale: संज्ञात्मक यूनानी मुहावरा पारस्परिक वैर की अवस्था बताता है; यह हिन्दी रूप अर्थ को स्पष्ट और स्वाभाविक रखता है, बिना वैर के कारण या स्वरूप को बढ़ाए।
theological_decisions:
- issue: हेरोदेस और पिलातुस के संबंध में आए परिवर्तन का स्वरूप
  choice: वे ‘मित्र हो गए’
  alternative: वे ‘एक-दूसरे के प्रति मैत्रीपूर्ण हो गए’ अथवा राजनीतिक सहयोगी बन गए
  rationale: φίλοι मित्रता या मैत्रीपूर्ण गठबंधन दोनों की गुंजाइश रख सकता है। मुख्य पाठ सीधा अर्थ देता है और पादटिप्पणी अपेक्षाकृत कमजोर अर्थ को सुरक्षित रखती है; उनके उद्देश्यों या इस घटना के गहरे धर्मवैज्ञानिक अर्थ का अनुमान नहीं लगाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘हेरोदेस’ और ‘पिलातुस’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
