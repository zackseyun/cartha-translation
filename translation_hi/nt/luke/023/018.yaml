  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: hi
  text: लेकिन वे सब एक साथ चिल्ला उठे, “इसे ले जाओ[a], और हमारे लिए बरअब्बा को रिहा कर दो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसे हटा दो।” यूनानी आज्ञा का अर्थ किसी को सामने से दूर करना या ले जाना है; इस प्रसंग में आगे होने वाली मृत्यु की ओर संकेत हो सकता है, पर क्रिया स्वयं उसे स्पष्ट रूप से नहीं कहती।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: चिल्ला उठे
  rationale: यह क्रिया ऊँची आवाज़ में अचानक और तीव्र पुकारने का भाव व्यक्त करती है; ‘चिल्ला उठे’ आधुनिक हिन्दी में स्वाभाविक रूप से वही तीव्रता रखता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यहाँ पहला δέ पिछली बातचीत के विपरीत भीड़ की प्रतिक्रिया को सामने लाता है; ‘लेकिन’ इस कथात्मक विरोध को स्पष्ट करता है।
- source_word: παμπληθεὶ
  choice: सब एक साथ
  rationale: यह क्रियाविशेषण पूरी भीड़ की सामूहिक कार्रवाई बताता है; ‘सब एक साथ’ सर्वसम्मति का अनावश्यक विस्तार किए बिना इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष कथन के रूप में निहित
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ना यहाँ भारी लगता; चिल्लाने की क्रिया के तुरंत बाद उद्धरण स्वाभाविक रूप से कथन का परिचय देता है।
- source_word: Αἶρε
  choice: ले जाओ
  rationale: आज्ञार्थक क्रिया यहाँ यीशु को उनके सामने से हटाने की माँग करती है। ‘ले जाओ’ हिन्दी में स्वाभाविक है और मृत्यु-दंड को मूल शब्द से अधिक स्पष्ट नहीं करता।
- source_word: τοῦτον
  choice: इसे
  rationale: पुल्लिंग एकवचन संकेतवाचक सर्वनाम सीधे यीशु की ओर संकेत करता है; हिन्दी में ‘इसे’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: ἀπόλυσον
  choice: रिहा कर दो
  rationale: यह हिरासत से छोड़ने की न्यायिक कार्रवाई है; ‘रिहा कर दो’ इस प्रसंग में ‘छोड़ दो’ से अधिक स्पष्ट है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: सम्प्रदान कारक माँगी गई रिहाई के लाभार्थी को दर्शाता है; ‘हमारे लिए’ इस संबंध को सीधे बनाए रखता है।
- source_word: τὸν Βαραββᾶν
  choice: बरअब्बा
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
