id: JHN.1.1
reference: John 1:1
language:
  code: ha
  name: Hausa
  native_name: Hausa
  variant: Standard Hausa in Latin script
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ha
  text: Tun farko akwai Kalma[b], Kalmar nan kuwa tana tare da Allah, Kalmar nan kuma Allah ce.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Ko kuma, “Kalmar tana da halin Allah,” ko “abin da Allah yake, haka Kalmar take.” A tsarin Helenanci, “Allah” a sashe na ƙarshe ba shi da takamaiman ɗafi, kuma an kawo shi kafin aikatau; wannan na iya jaddada halin ko ainihin Kalmar, alhali Kalmar ta bambanta da Allah da aka ambata a sashen da ya gabata.
    reason: alternative_reading
  - marker: b
    text: Furucin “Tun farko” yana kawo a zuciya Farawa 1:1, yana danganta Kalmar da farkon halitta.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: A farko
  rationale: Wannan ya riƙe ma’anar farkon lokaci kuma yana nuna alaƙar lafazin da Farawa 1:1, ba tare da ƙara wani bayani da babu a Helenanci ba.
- source_word: ἦν
  choice: tana nan
  rationale: Imperfect na εἰμί yana nuna cewa Kalmar ta riga ta kasance a farkon. “Tana nan” lafazi ne na Hausa mai sauƙin ganewa, kuma bai sa a ɗauka cewa a lokacin ne aka halicce ta ba.
- source_word: ὁ λόγος
  choice: Kalmar
  rationale: “Kalmar” tana riƙe fannin magana da bayyana Allah da λόγος yake ɗauke da shi, tare da aiki a matsayin laƙabi na musamman a wannan mahallin. An yi amfani da babban baƙi domin nuna wannan amfani na musamman.
- source_word: πρὸς τὸν θεόν
  choice: tana tare da Allah
  rationale: “Tare da Allah” ita ce Hausa ta halitta da ke bayyana kasancewa cikin dangantaka da Allah, tana kuma barin bambanci tsakanin Kalmar da Allah da aka ambata a wannan sashe.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Kalmar kuwa Allah ce
  rationale: Tsarin ya furta cikakkiyar halin Allahntakar Kalmar cikin Hausa mai ƙarfi da ta halitta. “Kuwa” yana bayyana ci gaban jimlar, yayin da tsarin nahawun Hausa bai tilasta haɗa Kalmar da mutum ɗaya tak da “Allah” na sashen da ya gabata ba.
theological_decisions:
- issue: Fassarar θεός marar takamaiman ɗafa a matsayin sunan bayan aikatau a sashe na ƙarshe
  choice: Kalmar kuwa Allah ce
  alternative: Kalmar kuwa tana da hali irin na Allah; ko, yadda Allah yake, haka Kalmar take
  rationale: 'Helenancin yana mai da hankali ga ainihi ko halin Kalmar: yana tabbatar da cikakkiyar Allahntakarta, amma yana ci gaba da bambanta Kalmar da Allah da take tare da shi a sashen da ya gabata. Babban rubutu ya riƙe furuci kai tsaye; bayanin ƙasa ya adana yanayin ma’anar ba tare da rage ta zuwa cewa Kalmar kawai tana da wani hali na allahntaka ba.'
translation_notes:
  register: An yi amfani da daidaitacciyar Hausa mai sauƙi, mai daraja. An bi jinsi na nahawun Hausa na “Kalma” da “tana/ce”; wannan daidaiton nahawu ba furuci ba ne game da jinsin wanda laƙabin yake nufi. An sa alamun bayanin ƙasa a wuraren da bayanansu suka shafa, saboda haka [b] ya zo kafin [a].
