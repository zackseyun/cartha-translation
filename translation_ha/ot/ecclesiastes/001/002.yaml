  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ha
  text: '“Numfashin numfashai[a],” in ji Kohelet[b]. “Numfashin numfashai; kome numfashi ne kawai.”


    [a] Kalmar Ibrananci הֶבֶל (hevel) a zahiri tana nufin “numfashi” ko “tururi.” A cikin wannan littafi, tana ɗauke da ma’anoni masu alaƙa a lokaci guda: abin da yake wucewa da sauri, abin da ba ya yiwuwa a damƙa ko a fahimta sarai, da kuma yanayin da abin da ya faru ya saɓa da abin da ake tsammani. Babu kalmar Hausa guda da ta ƙunshi dukan waɗannan ma’anoni. Saboda haka, an bar hoton “numfashi,” domin mahallin littafin ya bayyana faɗin ma’anoninsa. Furucin “numfashin numfashai” salon Ibrananci ne na nuna matsayi mafi ƙololuwa, kamar “waƙar waƙoƙi” ko “mafi tsarkin wurare.”


    [b] “Kohelet” laƙabi ne ko suna na Ibrananci. A al’ada ana fassara shi da “Malam” ko “Mai Wa’azi,” amma kowanne daga cikinsu yana taƙaita yiwuwar ma’anar kalmar. Saboda haka, an rubuta sunan yadda yake a Ibrananci.'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Kalmar Ibrananci הֶבֶל (hevel) a zahiri tana nufin “numfashi” ko “tururi.” A cikin wannan littafi, tana ɗauke da ma’anoni masu alaƙa a lokaci guda: abin da yake wucewa da sauri, abin da ba ya yiwuwa a damƙa ko a fahimta sarai, da kuma yanayin da abin da ya faru ya saɓa da abin da ake tsammani. Babu kalmar Hausa guda da ta ƙunshi dukan waɗannan ma’anoni. Saboda haka, an bar hoton “numfashi,” domin mahallin littafin ya bayyana faɗin ma’anoninsa. Furucin “numfashin numfashai” salon Ibrananci ne na nuna matsayi mafi ƙololuwa, kamar “waƙar waƙoƙi” ko “mafi tsarkin wurare.”'
    reason: Gyaran salo da daidaiton nahawu kawai; ma’anar bayanin asali ta kasance yadda take.
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: numfashi / numfashi ne kawai
  rationale: הֶבֶל a zahiri yana nufin numfashi ko tururi, kuma hoton yana iya ɗaukar ma’anar ɗan lokaci, rashin yiwuwar damƙewa, da saɓanin tsammani. “Numfashi” yana kiyaye hoton tushen; “kawai” a jimlar hukunci yana kawo yanayin rage daraja ba tare da mai da kalmar “rashin ma’ana” ko “banza” kaɗai ba.
- source_word: הֲבֵל הֲבָלִים
  choice: numfashin numfashai
  rationale: An kiyaye tsarin ƙarfafawa na Ibrananci, X na Xs, ta hanyar tsarin mallaka na Hausa, kamar “waƙar waƙoƙi.”
- source_word: אָמַר
  choice: in ji
  rationale: “In ji” shi ne salon Hausa na gabatar da maganar da wani yake furtawa ko sanarwa, kuma ya dace da tsarin adabin hikima.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: An rubuta laƙabin Ibrananci da haruffan Hausa domin kada a takaita ma’anarsa zuwa “Malam” ko “Mai Wa’azi.”
- source_word: הַכֹּל
  choice: kome
  rationale: “Kome” yana isar da faɗin ma’anar jimlar, wato dukan abin da ake magana a kansa.
theological_decisions:
- issue: Yadda za a fassara babban jigon הֶבֶל
  choice: An kiyaye hoton “numfashi,” tare da “kawai” a jimlar ƙarshe.
  alternative: banza; rashin amfani; rashin ma’ana; abin wucewa
  rationale: Zaɓen kalma mai ma’ana guda zai warware da wuri irin sarƙaƙiyar da marubucin ya bari. “Numfashi” yana barin ma’anonin ɗan lokaci, rashin damƙuwa, da saɓanin tsammani su kasance tare, kuma ba ya shigar da ra’ayin cewa dukan rayuwa ba ta da wata ma’ana kwata-kwata.
- issue: Ma’anar קֹהֶלֶת
  choice: Kohelet
  alternative: Malam; Mai Wa’azi; Mai Taro
  rationale: Asalin kalmar da aikinta a matsayin suna ko laƙabi suna da ɗan rashin tabbas. Rubuta ta kai tsaye yana kiyaye wannan buɗaɗɗiyar ma’ana.
translation_notes:
  register: An yi amfani da daidaitacciyar Hausa mai sauƙi amma mai daraja. Tsarin “numfashin numfashai” yana da ɗan nauyin salon waƙa da hikima, yana kuma kiyaye tsarin ƙarfafawa na Ibrananci. “In ji” ya fi naƙaltar Hausa ta yau fiye da kwaikwayon tsarin fi’ili na Ibrananci kai tsaye.
