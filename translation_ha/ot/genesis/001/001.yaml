base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ha
  text: Da farko, sa’ad da Allah ya halicci sammai da ƙasa[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'A al’adance ana fassara wannan a matsayin cikakkiyar jimla: “Da farko Allah ya halicci sammai da ƙasa.” Amma a Ibrananci, בְּרֵאשִׁית ba ta da harafin tantancewa, sannan aikatau בָּרָא ya biyo ta nan take; saboda haka, ya fi dacewa a karanta ta a matsayin jimlar lokaci mai dogaro, kamar Farawa 2:4b. Babban jimlar tana cikin aya ta 3: “Allah ya ce, ‘Bari haske ya kasance.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Da farko, sa’ad da … ya halicci
  rationale: Wannan ya kiyaye ma’anar רֵאשִׁית ta “farko,” kuma ya nuna cewa jimlar lokaci ce mai dogaro da abin da zai biyo baya, maimakon cikakkiyar jimla mai zaman kanta.
- source_word: בָּרָא
  choice: ya halicci
  rationale: “Halitta” ita ce kalmar Hausa ta yau da kullum da ta dace da aikin Allah na samar da abin halitta, ba tare da ƙara bayanin yadda ya yi hakan ba.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Ko da yake siffar kalmar Ibranancin jam’i ce, aikatau ɗin da ke tare da ita tilo ne; saboda haka tana nufin Allah guda ɗaya.
- source_word: אֵת
  choice: ba a fassara ta da wata kalma dabam ba
  rationale: Alama ce ta abin da aikatau ya shafa kai tsaye a Ibrananci; tsarin jimlar Hausa ya riga ya bayyana wannan.
- source_word: הַשָּׁמַיִם
  choice: sammai
  rationale: Jam’in Hausa “sammai” ya nuna siffar jam’in Ibrananci kuma ya dace da haɗin “sammai da ƙasa,” wanda ke nufin dukan halitta.
- source_word: הָאָרֶץ
  choice: ƙasa
  rationale: A nan אָרֶץ tana nufin ƙasa a matsayin kishiyar sammai cikin jimlar da ta ƙunshi dukan halitta, ba wata takamaiman ƙasa ko yanki ba.
theological_decisions:
- issue: Tsarin nahawun jimlar buɗewa
  choice: 'An fassara aya ta 1 a matsayin jimlar lokaci mai dogaro: “Da farko, sa’ad da Allah ya halicci sammai da ƙasa—”'
  alternative: 'Cikakkiyar jimla mai zaman kanta: “Da farko Allah ya halicci sammai da ƙasa.”'
  rationale: Rashin takamaiman mahaɗin suna a בְּרֵאשִׁית, sannan zuwan aikatau בָּרָא nan take, sun fi nuna jimlar lokaci da ke kaiwa ga babban batu a aya ta 3. Duk da haka, saboda fassarar cikakkiyar jimla tsohuwa ce kuma mai yiwuwa, an kiyaye ta a bayanin ƙasa maimakon a kawar da ruɗanin nahawun.
translation_notes:
  register: An yi amfani da daidaitacciyar Hausa mai sauƙi da daraja. “Da farko” ya fi zama na halitta a Hausa fiye da kwaikwayon tsarin Ibrananci kai tsaye, yayin da “sa’ad da” da alamar dogon layi suka nuna cewa tunanin ayar bai ƙare ba. An rubuta “sammai” a jam’i domin bin siffar tushen Ibrananci.
