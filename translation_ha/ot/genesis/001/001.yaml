review_pass:
  verdict: revise
  source_fidelity: 'Rubutun ayar, “Da farko, sa’ad da Allah ya halicci sammai da ƙasa[a]—”, yana wakiltar karatun jimlar lokaci mai dogaro da aka zaɓa a POB, yayin da yake kiyaye ma’anar kalmomin Ibrananci: Allah shi ne mai aikatawa, ya halicci, kuma “sammai da ƙasa” suna nuna cikakken halittar duniya. Alamar bayanin ƙasa tana daidai da inda take a rubutun Ingilishi.'
  naturalness: Babban rubutun Hausa ne mai sauƙi, na zamani, kuma alamar dogon layi tana nuna cewa tsarin magana yana ci gaba zuwa aya ta 3. Ana buƙatar gyara kaɗan a bayanin ƙasa kawai domin bayani ya zama daidai a nahawun Ibrananci kuma Hausa ta fi santsi.
  terminology: “Allah,” “ya halicci,” “sammai,” da “ƙasa” kalmomi ne masu dacewa da Daidaitacciyar Hausa da rajistar Littafi Mai Tsarki. A bayanin ƙasa, “harafin tantancewa” ya fi “takamaiman mahaɗin suna” dacewa wajen bayyana rashin definite article.
  issues:
  - severity: medium
    issue: An bayyana rashin definite article a בְּרֵאשִׁית da “rashin takamaiman mahaɗin suna.”
    rationale: Wannan ba daidai yake bayyana batun nahawun Ibrananci ba. Kalmar ba ta da harafin tantancewa; ba batun mahaɗin suna ba ne. Haka kuma, ya fi kyau a ce babban jimlar tana “cikin aya ta 3.”
  revised_text: Da farko, sa’ad da Allah ya halicci sammai da ƙasa[a]—
  revised_footnotes: *id001
  revision_rationale: An bar ayar yadda take, domin tana da aminci ga rubutun Ibrananci da kuma karatun POB mai barin jimlar a buɗe zuwa aya ta 3. An gyara bayanin ƙasa kawai domin a bayyana hujjar nahawu daidai, cikin Hausa mai fahimta, tare da kiyaye madadin fassarar gargajiya ba tare da yanke hukunci a kan muhawarar ba.
