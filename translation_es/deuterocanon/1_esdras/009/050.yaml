  glossary_alignment: «Yahvé», «santo», «ley» y «lloraban» se ajustan a las preferencias del proyecto y a los valores léxicos del griego. La decisión contextual de usar «Yahvé» para κύριος está documentada y no requiere adjudicación adicional.
