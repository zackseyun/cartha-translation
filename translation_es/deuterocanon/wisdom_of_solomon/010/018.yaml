    issue: Marcador de nota al pie anclado a la frase equivocada
    rationale: La nota explica διʼ ὕδατος πολλοῦ, no θάλασσαν ἐρυθράν. Debe colocarse junto a «mucha agua».
  - severity: low
    issue: Texto de nota duplicado e impreciso
