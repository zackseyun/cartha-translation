review_pass:
  verdict: revise
  source_alignment_summary: El texto conserva el futuro ζήσονται («vivirán»), ἐν αὐτῷ («en él»), εἰς τὸν αἰῶνα («para siempre»), παράδεισος («paraíso») y el plural τὰ ξύλα («los árboles»). También mantiene correctamente la identificación poética de la segunda cláusula mediante «son». La decisión final del audit trail respalda «en él»; la revisión anterior que proponía «por ella» es metadato contradictorio posteriormente revertido, no una razón para modificar el texto publicado.
  spanish_quality_summary: 'La redacción es natural, digna y clara en español. Requiere una reparación editorial menor: la nota [a], que trata de ὅσιοι, está anclada incorrectamente a «para siempre» y además ofrece «los santos» como supuesta alternativa de la misma palabra ya traducida «santos». Debe anclarse a «santos» y expresar alternativas genuinas.'
  glossary_alignment: «Santos» es una opción contextual aceptable para ὅσιοι y se usa coherentemente en ambas apariciones; la nota preserva «piadosos» y «devotos». «Señor» corresponde al κύριος griego de esta fuente, no exige aplicar la convención de Yahvé para el tetragrámaton. «Paraíso», «árboles de la vida» y «en él» siguen las decisiones auditadas.
  issues:
  - severity: low
    issue: La nota léxica [a] está anclada a «para siempre» en lugar de a «santos».
    rationale: La nota explica ὅσιοι, no εἰς τὸν αἰῶνα. El anclaje debe aparecer junto al término al que se refiere y la formulación debe evitar repetir como alternativa la traducción ya elegida.
  revised_spanish_text: Los santos[a] del Señor vivirán en él para siempre; el paraíso del Señor, los árboles de la vida[b], son sus santos.
  revised_footnotes:
  - marker: a
    text: O «los piadosos» o «los devotos» para ὅσιοι.
    reason: lexical_alternative
  - marker: b
    text: El griego dice «los árboles» en plural.
    reason: lexical_alternative
  revision_rationale: Se corrige únicamente el anclaje y la formulación de la nota léxica sobre ὅσιοι. No se modifica el sentido ni la estructura poética de la traducción.
