translation:
  language: es
  text: y en tu justicia visitas a los hijos de los hombres[a][b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «los seres humanos» / «la humanidad».
    reason: lexical_alternative
  - marker: b
    text: O «velas por los hijos de los hombres»; en este contexto también puede sugerir examen o inspección judicial.
