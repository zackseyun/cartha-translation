  source_alignment_summary: El texto conserva adecuadamente la única cláusula con αἰσχύνη como sujeto y los dos dativos paralelos («sobre nosotros y sobre nuestros rostros»), y «por causa de todo esto» expresa de modo natural el valor causal contextual de περὶ ἁπάντων, conforme a la revisión inglesa final.
  spanish_quality_summary: 'La redacción es clara, digna y mantiene la imagen pública y visible de la vergüenza. Requiere una corrección editorial menor: iniciar el versículo con mayúscula. La nota [a] es redundante, pues repite exactamente la expresión ya impresa y no ofrece una alternativa significativa.'
  glossary_alignment: «Vergüenza» es una traducción directa y apropiada de αἰσχύνη. No intervienen los términos sujetos a las convenciones terminológicas especiales del proyecto.
  issues:
  - severity: low
    issue: Capitalización inicial y nota redundante.
    rationale: Como inicio del texto del versículo, «porque» debe escribirse «Porque». La nota [a] define como literal exactamente el mismo texto que aparece en el cuerpo («sobre nuestros rostros»); por ello no aclara una alternativa léxica ni una ambigüedad y debe eliminarse.
  revised_spanish_text: Porque la vergüenza está sobre nosotros y sobre nuestros rostros, por causa de todo esto.
  revision_rationale: Se aplica la mayúscula inicial propia de un versículo independiente y se elimina una nota que no aporta información adicional ni alternativa de traducción. No se altera el sentido ni la estructura paralela del griego.
