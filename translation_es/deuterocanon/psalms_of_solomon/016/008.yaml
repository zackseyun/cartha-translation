review_pass:
  verdict: revise
  source_alignment_summary: La primera cláusula reproduce correctamente el ruego negativo μὴ ἀπατησάτω με y κάλλος. Sin embargo, παντὸς ὑποκειμένου está en genitivo y depende elípticamente de κάλλος; el español debe conservar esa dependencia mediante «la de», no dejar «ni de nada» como fragmento. «Transgresora» comunica con mayor precisión el valor de παρανόμου (contraria a la ley) que «impía», que puede referirse solo a falta de piedad.
  spanish_quality_summary: La redacción actual resulta sintácticamente incompleta en la segunda coordinación («ni de nada...»). La revisión la hace clara y natural sin repetir innecesariamente «belleza».
  glossary_alignment: No intervienen los términos predeterminados del glosario. Se conserva «engaño», «belleza», «pecado» e «inútil» para ἀπατάω, κάλλος, ἁμαρτία y ἀνωφελής. «Mujer transgresora» preserva la fuerza moral-legal de παρανόμου mejor que «mujer impía».
  issues:
  - severity: medium
    issue: La segunda cláusula carece del pronombre elíptico que haga depender παντὸς ὑποκειμένου de κάλλος.
    rationale: «Ni de nada puesto delante de mí» no funciona como coordinación plena con «la belleza de una mujer...». El griego coordina dos genitivos bajo κάλλος; «ni la de nada...» expresa en español «ni la belleza de nada...» y conserva la elipsis significativa.
  - severity: medium
    issue: «Impía» atenúa o desplaza el sentido de παρανόμου.
    rationale: παράνομος significa propiamente contrario a la ley, transgresor o sin ley. «Impía» puede ser una consecuencia religiosa posible, pero no expresa necesariamente la infracción de la ley indicada por el adjetivo griego.
  revised_spanish_text: Y no permitas que me engañe la belleza de una mujer transgresora[a], ni la de nada puesto delante de mí por un pecado inútil.
  revised_footnotes:
  - marker: a
    text: 'O: «ni nada puesto delante de mí».'
    reason: La nota conserva la alternativa de lectura heredada del inglés POB para el segundo miembro, donde el griego es sintácticamente comprimido; el texto principal mantiene la dependencia elíptica de «belleza» indicada por el genitivo.
  revision_rationale: Se corrige la sintaxis española para reflejar que el segundo genitivo depende de «belleza» y se sustituye «impía» por «transgresora» para preservar el sentido legal-moral de παρανόμου. La nota se reancla correctamente y conserva la alternativa auditada.
