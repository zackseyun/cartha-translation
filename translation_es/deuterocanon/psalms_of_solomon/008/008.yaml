  glossary_alignment: «Dios» corresponde a θεός; «pecados» conserva la fuerza de ἁμαρτίας; y «juicios justos» mantiene el valor judicial de κρίματα y la rectitud de δίκαια. La nota «O «rectos»» preserva una alternativa española significativa para el adjetivo sin introducir ambigüedad nueva.
