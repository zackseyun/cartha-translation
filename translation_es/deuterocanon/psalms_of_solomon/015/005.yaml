review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva adecuadamente las imágenes y los términos principales del griego: «salmo nuevo», «canto», «gozo del corazón», «fruto de los labios», «instrumento bien afinado de la lengua» y «primicias». Sin embargo, en el último miembro «de un corazón santo y justo» queda sintácticamente próximo a «los labios» y no expresa con suficiente claridad el ἀπό («procedente de»).'
  spanish_quality_summary: 'El español es digno, natural y de registro bíblico. Se requiere una reparación menor de claridad sintáctica en el último sintagma y una reubicación de las llamadas de nota: en el borrador, [a] está anclada en «canto» aunque su contenido trata de la frase del instrumento, y [b] está anclada en el instrumento aunque explica «fruto/primicias de los labios».'
  glossary_alignment: «Salmo», «canto», «gozo», «fruto», «primicias», «santo» y «justo» son elecciones fieles y legibles. «Instrumento bien afinado de la lengua» preserva la construcción poética con genitivo y concuerda con la revisión inglesa documentada.
  issues:
  - severity: medium
    issue: Relación de procedencia en el último miembro
    rationale: ἀπὸ καρδίας modifica «primicias de los labios» y significa procedencia. «Las primicias de los labios de un corazón» puede leerse como si los labios pertenecieran al corazón; «procedentes de un corazón» comunica inequívocamente la relación fuente-origen.
  - severity: low
    issue: Anclajes de notas desalineados
    rationale: Las llamadas deben aparecer en la palabra o frase pertinente. La nota cultural sobre «fruto» y «primicias» debe anclarse en «fruto de los labios», mientras que las alternativas sobre el instrumento deben anclarse en esa frase.
  revised_spanish_text: un salmo nuevo con canto, en el gozo del corazón; el fruto de los labios[a] con el instrumento bien afinado de la lengua[b][c]; las primicias de los labios, procedentes de un corazón santo y justo.
  revised_footnotes:
  - marker: a
    text: Las expresiones «fruto de los labios» y «primicias de los labios» conservan la imagen de ofrenda del poema, en vez de reducirla a mero habla o alabanza.
    reason: cultural_note
  - marker: b
    text: O, más formalmente, «el fruto de los labios con un instrumento ajustado a la lengua». El griego es compacto y algo difícil, así que el texto principal expresa su sentido más natural en español.
    reason: lexical_alternative
  - marker: c
    text: O «con la lengua como instrumento bien afinado».
    reason: lexical_alternative
  revision_rationale: Se explicita la procedencia indicada por ἀπό mediante «procedentes de», sin perder la concisión poética ni la imaginería de ofrenda. Las notas se conservan en contenido, pero sus marcadores se reubican y ordenan para que cada una esté anclada en la expresión que explica.
