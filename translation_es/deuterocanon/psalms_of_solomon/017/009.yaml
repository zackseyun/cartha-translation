review_pass:
  verdict: revise
  source_fidelity: La cláusula temporal «cuando» y «se levantó contra ellos» reflejan correctamente ἐν τῷ ἐπαναστῆναι αὐτοῖς. «Ajeno a nuestro linaje» transmite con precisión ἀλλότριον γένους ἡμῶν y conserva la referencia de pertenencia étnico-genealógica sin añadir identificación histórica alguna.
  naturalness: «Extranjero a nuestra raza» resulta poco idiomático en español latinoamericano actual y «raza» tiene connotaciones modernas que no son necesarias para reproducir γένος. «Ajeno a nuestro linaje» es sobrio, natural en registro bíblico y semánticamente más exacto.
  terminology: «Linaje» corresponde bien al campo semántico de γένος en este contexto. Se conserva «hombre» para el singular masculino explícito de ἄνθρωπον. La nota original era idéntica al texto principal, por lo que no ofrecía una alternativa real; se reemplaza por una alternativa léxica legítima con «pueblo».
  issues:
  - severity: medium
    issue: «extranjero a nuestra raza» es una formulación poco natural y semánticamente menos adecuada.
    rationale: En español, «extranjero» normalmente se construye con «de» o se usa de modo absoluto; además, «raza» arrastra connotaciones contemporáneas que pueden distraer del sentido de γένος como linaje o grupo de pertenencia.
  - severity: medium
    issue: La nota al pie repite exactamente el texto principal.
    rationale: Una nota de alternativa léxica debe presentar una lectura distinta y útil; la actual no cumple esa función.
  revised_text: cuando un hombre ajeno a nuestro linaje se levantó contra ellos[a].
  revised_footnotes:
  - marker: a
    text: 'También puede traducirse: «cuando un hombre ajeno a nuestro pueblo se levantó contra ellos».'
    reason: lexical_alternative
  revision_rationale: Se sustituye la construcción poco idiomática «extranjero a nuestra raza» por «ajeno a nuestro linaje», que reproduce de forma natural y fiel la relación expresada por ἀλλότριον γένους ἡμῶν. Se corrige además la nota para que aporte una alternativa de traducción genuina, sin alterar el sentido del pasaje.
