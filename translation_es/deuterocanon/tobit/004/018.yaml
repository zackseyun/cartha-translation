review_pass:
  verdict: revise
  source_alignment_summary: El texto reproduce fielmente el imperativo de buscar consejo procedente de toda persona sabia y la prohibición de despreciar consejo útil. «De toda persona sabia» expresa correctamente la procedencia de παρά con genitivo y el sentido de φρόνιμος; no requiere adoptar el masculino representativo de la decisión inglesa final para ser fiel en español.
  spanish_quality_summary: La redacción es clara, natural y digna. Sin embargo, la nota está anclada al primer «consejo», aunque trata de la repetición del sustantivo en la frase final; además, incluye innecesariamente el inglés «advice» y formula la alternativa de manera incompleta.
  glossary_alignment: «Consejo», «persona sabia», «busca» y «no desprecies» son elecciones adecuadas y mantienen la fuerza léxica del griego. La discrepancia entre la metainformación inglesa heredada («wise person») y su revisión final («wise man») no afecta la fidelidad de «persona sabia»; es una inconsistencia de auditoría, no una razón para alterar el texto.
  issues:
  - severity: low
    issue: Anclaje y formulación de la nota léxica
    rationale: La nota sobre la alternativa «todo consejo útil» debe ir en «ningún consejo útil», que corresponde a ἐπὶ πάσης συμβουλίας χρησίμης, no en la primera aparición de «consejo» (συμβουλίαν). Debe también expresarse enteramente en español y presentar la alternativa como una lectura de la cláusula.
  revised_spanish_text: Busca consejo de toda persona sabia, y no desprecies ningún consejo útil[a].
  revised_footnotes:
  - marker: a
    text: 'O: «no desprecies todo consejo útil». El griego repite el mismo sustantivo, «consejo», usado antes en el versículo.'
    reason: lexical_alternative
