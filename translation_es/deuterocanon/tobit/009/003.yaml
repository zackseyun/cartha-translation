review_pass:
  verdict: revise
  source_alignment_summary: 'El texto «Porque Ragüel ha jurado no dejarme salir[a]» transmite fielmente διότι, el perfecto ὠμόμοκεν y el sentido contextual de μὴ ἐξελθεῖν με: Ragüel ha hecho un juramento que impide la partida del hablante. «Salir» conserva además el verbo griego, cuyo sentido contextual es partir de la casa de Ragüel.'
  spanish_quality_summary: 'La redacción es natural, clara y digna en español. La nota, sin embargo, necesita corrección: «no hacer que salga» invierte la relación de control expresada por «no dejarme salir» y no es una alternativa formal adecuada para el contenido del juramento.'
  glossary_alignment: «Ragüel» es una transliteración española legible y establecida; «ha jurado» refleja apropiadamente el perfecto con relevancia presente. No intervienen términos teológicos del glosario del proyecto.
  issues:
  - severity: medium
    issue: La alternativa de la nota dice «no hacer que salga».
    rationale: «No hacer que salga» significa no causarle la salida, mientras que el griego y el texto principal expresan que Ragüel juró que el hablante no saldría o no sería dejado salir. La alternativa formal debe ser «que yo no salga» (o equivalente), no una formulación causativa inversa.
  revised_spanish_text: Porque Ragüel ha jurado no dejarme salir[a].
  revised_footnotes:
  - marker: a
    text: 'O, más formalmente: «que yo no salga». El griego dice «salir», que en este contexto se refiere a partir de la casa de Ragüel.'
    reason: lexical_alternative
  revision_rationale: Se conserva el texto principal, que es fiel y natural, y se corrige la nota para que su alternativa formal represente correctamente el contenido del juramento y el sentido contextual de «salir».
