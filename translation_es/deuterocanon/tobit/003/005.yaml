review_pass:
  verdict: revise
  source_alignment_summary: La traducción conserva adecuadamente κρίσεις («juicios»), ἀληθιναί («verdaderos»), los pecados propios y de los padres, «mandamientos» y el modismo «andar en la verdad». Sin embargo, «en lo que has hecho conmigo» es una formulación poco natural y menos directa que el sentido de la acción o trato divino expresado por ἐξ ἐμοῦ ποιῆσαι. «Al tratar conmigo» preserva el sentido sin insinuar hostilidad.
  spanish_quality_summary: 'El registro es claro, digno y apropiado para una Biblia en español. Se requiere una pequeña mejora de fluidez en la cláusula sobre el trato de Dios. Además, las dos llamadas de nota deben anclarse en las expresiones que explican: la alternativa «justos» en «verdaderos» y el modismo en «verdad», no en «padres» y «mandamientos».'
  glossary_alignment: «Juicios», «verdaderos», «mandamientos», «andar en la verdad» y «delante de ti» concuerdan con las decisiones léxicas auditadas y con un español bíblico natural. No hay terminología teológica del proyecto que requiera otra normalización.
  issues:
  - severity: medium
    issue: La frase «en lo que has hecho conmigo» es torpe y atenúa el sentido de trato/acción de Dios hacia Tobit.
    rationale: La construcción griega ἐξ ἐμοῦ ποιῆσαι se vierte mejor en español mediante «al tratar conmigo», que refleja la relación personal de la acción divina sin convertirla en una acción hostil ni añadir contenido.
  - severity: low
    issue: Los marcadores de las notas están colocados en palabras que las notas no explican.
    rationale: La nota a trata de «verdaderos/justos», por lo que debe seguir «verdaderos»; la nota b explica «andar en la verdad», por lo que debe seguir «verdad». Esto satisface la exigencia de anclaje relevante y mejora la legibilidad editorial.
  revised_spanish_text: Y ahora tus juicios son muchos y verdaderos[a] al tratar conmigo por causa de mis pecados y de los pecados de mis padres, porque no guardamos tus mandamientos; pues no anduvimos en la verdad[b] delante de ti.
  revised_footnotes:
  - marker: a
    text: O «justos». El griego dice «verdaderos», y en contexto esa verdad implica la rectitud de los juicios de Dios.
    reason: lexical_alternative
  - marker: b
    text: «Andar en la verdad» es un modismo bíblico para vivir con fidelidad y sinceridad delante de Dios.
    reason: lexical_alternative
  revision_rationale: Se reemplaza la formulación poco idiomática «en lo que has hecho conmigo» por «al tratar conmigo», y se reubican los marcadores de nota en las expresiones que cada nota explica. No se altera el contenido confesional ni la decisión de conservar «verdaderos» en vez de interpretar el adjetivo como «justos».
