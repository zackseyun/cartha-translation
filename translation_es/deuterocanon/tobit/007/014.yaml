  verdict: revise
  source_alignment_summary: 'El texto griego dice ἐσφραγίσαντο, tercera persona plural: «y lo sellaron», no «y lo selló». Además, συγγραφήν designa un acuerdo o contrato escrito; en el contexto inmediato de la boda, «contrato matrimonial» es una explicitación contextual respaldada por la decisión inglesa vigente, siempre que se conserve en nota la alternativa más general.'
  spanish_quality_summary: La redacción es clara y natural. Se requiere corregir el número verbal final y añadir la nota léxica correspondiente a «contrato matrimonial».
  glossary_alignment: «Edna», «esposa», «documento», «escribió» y «sellaron» son adecuados. No intervienen los términos teológicos del glosario del proyecto.
  issues:
  - severity: high
    issue: «lo selló» traduce ἐσφραγίσαντο en singular.
    rationale: ἐσφραγίσαντο es tercera persona plural; el texto debe decir «lo sellaron». La decisión léxica española que afirma que el griego presenta una acción singular contradice la morfología y el texto fuente.
  - severity: low
    issue: Falta la nota sobre el alcance de συγγραφήν.
    rationale: La traducción contextual «contrato matrimonial» debe conservar la alternativa léxica «acuerdo escrito» o «contrato», como hace la auditoría inglesa, para no presentar la especificación contextual como el único sentido del término griego.
  revised_spanish_text: Y llamó a Edna, su esposa; y, tomando un documento, escribió un contrato matrimonial[a] y lo sellaron.
  revised_footnotes:
  - marker: a
    text: O «un acuerdo escrito» o simplemente «un contrato». El término griego se refiere a un documento legal formal; «contrato matrimonial» se elige por el contexto inmediato del arreglo matrimonial.
    reason: alternativa_léxica
  revision_rationale: Se corrige el verbo final al plural exigido por ἐσφραγίσαντο. Se adopta «contrato matrimonial» conforme a la decisión inglesa vigente y se preservan mediante nota las alternativas generales del término griego.
