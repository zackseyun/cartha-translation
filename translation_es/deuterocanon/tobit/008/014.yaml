  naturalness: «Halló a los dos dormidos» es natural en registro bíblico literario y resulta más fluido en español que «halló a los dos durmiendo», sin cambiar el aspecto relevante del griego en este contexto.
  terminology: No hay nombres propios, términos teológicos ni vocabulario técnico que requieran ajuste. «Los dos» mantiene la referencia definida del griego sin identificar indebidamente a las personas.
