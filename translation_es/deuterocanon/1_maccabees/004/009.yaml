review_pass:
  verdict: revise
  source_alignment_summary: 'El texto principal refleja fielmente el griego: μνήσθητε se expresa con el imperativo exhortativo «Recuerden»; ἐσώθησαν conserva el lenguaje de salvación en «fueron salvados»; οἱ πατέρες ἡμῶν mantiene el masculino explícito en «nuestros padres»; y «en el mar Rojo» corresponde a ἐν θαλάσσῃ ἐρυθρᾷ. «Los persiguió con fuerza» comunica adecuadamente ἐδίωξεν ... ἐν δυνάμει sin añadir el detalle de un ejército.'
  spanish_quality_summary: La redacción es natural, digna y clara en español. Sin embargo, la nota presenta como alternativa «en el mar Rojo», que repite exactamente la lectura del texto principal y por ello no transmite la alternativa inglesa «at the Red Sea». Debe decir «junto al mar Rojo» (o equivalente).
  glossary_alignment: No intervienen los términos de glosario con una excepción relevante. «Fueron salvados» preserva apropiadamente σῴζω conforme al razonamiento documentado; «mar Rojo» sigue el sentido directo del testimonio griego, y «mar de los Juncos» queda correctamente como alternativa vinculada al trasfondo hebreo.
  issues:
  - severity: low
    issue: La primera alternativa de la nota repite el texto principal.
    rationale: El texto publicado dice «en el mar Rojo», pero la nota también dice «O “en el mar Rojo”». La alternativa auditada es «at the Red Sea», que en español debe expresarse como «junto al mar Rojo» para que la nota tenga contenido real.
  revised_spanish_text: Recuerden cómo nuestros padres fueron salvados en el mar Rojo, cuando Faraón los persiguió con fuerza[a].
  revised_footnotes:
  - marker: a
    text: O «junto al mar Rojo»; alternativamente, algunos prefieren «en el mar de los Juncos» para reflejar el trasfondo hebreo de la tradición del Éxodo.
    reason: lexical_alternative
  revision_rationale: Se corrige únicamente la nota para distinguir la alternativa locativa «junto al mar Rojo» de la lectura principal «en el mar Rojo» y para formular de manera idiomática la alternativa «mar de los Juncos». El texto principal no requiere cambios.
