review_pass:
  verdict: revise
  source_alignment_summary: 'El texto conserva adecuadamente el sentido del griego: «la tierra» para ἡ γῆ, «tembló» para ἐσείσθη, la relación con quienes la habitaban expresada de manera natural mediante «por», la expresión colectiva «toda la casa de Jacob» y la metáfora media «se vistió de vergüenza». La documentación inglesa contiene una inconsistencia heredada entre «over» y «for», pero no exige cambiar el español: «por los que habitaban en ella» es una solución contextual viable para ἐπὶ con acusativo.'
  spanish_quality_summary: 'La redacción es clara, digna y natural en español bíblico moderno. Solo la nota requiere corrección: presenta «la tierra» como alternativa idéntica al texto principal, por lo que no comunica la alternativa léxica real de γῆ.'
  glossary_alignment: No se activan términos del glosario con una traducción problemática. «Casa de Jacob» preserva la expresión bíblica, y «vergüenza» conserva apropiadamente αἰσχύνη y la imagen de ἐνεδύσατο.
  issues:
  - severity: low
    issue: La nota [a] repite el texto principal como supuesta alternativa.
    rationale: El texto ya dice «la tierra», de modo que «O “la tierra”» es tautológico. La alternativa pertinente para γῆ es un sentido más restringido, como «el país» o «el territorio».
  revised_spanish_text: Y la tierra tembló[a] por los que habitaban en ella, y toda la casa de Jacob se vistió de vergüenza.
  revised_footnotes:
  - marker: a
    text: O «el país» o «el territorio». El griego γῆ puede significar «tierra» o una región o territorio.
    reason: lexical_alternative
  revision_rationale: Se corrige únicamente la nota léxica para que señale una alternativa real al sentido amplio de «la tierra» y no repita la lectura principal.
