review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva correctamente la secuencia y fuerza general del hebreo y del paralelo griego: la remoción violenta (וְסִחָם), el desarraigo (וַיִּתְּשֵׁם) y la eliminación de la memoria de la tierra (וַיַּשְׁבֵּת ... זִכְרָם). Sin embargo, la nota sobre וְסִחָם está anclada por error en «arrancó», que traduce el verbo siguiente, וַיִּתְּשֵׁם.'
  spanish_quality_summary: «Él los barrió de la tierra» y «los arrancó» son claros y fieles. «Hizo cesar de la tierra su memoria» reproduce demasiado literalmente el orden hebreo y resulta rígido en español. «Hizo desaparecer su memoria de la tierra» conserva la causatividad y el resultado de cesación, con una sintaxis más natural.
  glossary_alignment: No intervienen los términos teológicos regulados por el proyecto. «Tierra», «barrió», «arrancó» y «memoria» reflejan adecuadamente las decisiones léxicas documentadas. La nota alternativa se conserva y se coloca en el término correspondiente.
  issues:
  - severity: medium
    issue: El marcador [a] está colocado en «arrancó» en vez de «barrió».
    rationale: La nota explica la dificultad de וְסִחָם, traducido «los barrió»; «los arrancó» traduce וַיִּתְּשֵׁם. El anclaje debe corresponder exactamente a la palabra explicada.
  - severity: low
    issue: La expresión «hizo cesar de la tierra su memoria» es sintácticamente poco natural.
    rationale: Aunque es semánticamente comprensible, calca el orden de la fuente. «Hizo desaparecer su memoria de la tierra» expresa de manera idiomática que causó el cese de su memoria, sin reducir el sentido a una destrucción inespecífica.
  revised_spanish_text: Él los barrió[a] de la tierra y los arrancó, e hizo desaparecer su memoria de la tierra.
  revised_footnotes:
  - marker: a
    text: 'El hebreo וְסִחָם es difícil; el paralelo griego apoya el sentido de remover o borrar. Una traducción alternativa es: «los borró de la tierra».'
    reason: lexical_alternative
