review_pass:
  verdict: revise
  source_alignment_summary: 'La redacción principal sigue fielmente el hebreo: «enfermedad leve» refleja שֶׁמֶץ מַחֲלָה; «se ponga pálido» comunica de modo idiomático el cambio de color de יַצְהִיב; y «mañana caerá» conserva la amplitud de יִפּוֹל sin reducirla a muerte, mientras la nota registra la lectura griega más específica. Sin embargo, la nota [a] caracteriza erróneamente el paralelo griego: σκώπτει ἰατρός presenta al médico como sujeto que se burla o se mofa, no como alguien que queda desconcertado o burlado.'
  spanish_quality_summary: El español es claro, sobrio y adecuado para literatura sapiencial. La sintaxis breve de «un rey hoy, y mañana caerá» preserva eficazmente el contraste proverbial. Se requiere únicamente corregir la formulación de la nota [a] y precisar en [b] que el griego «dice», no que «añade», esa interpretación.
  glossary_alignment: «Médico», «rey», «leve», «pálido» y «caerá» son elecciones naturales y fieles. No intervienen los términos teológicos predeterminados del proyecto. Aunque el metadato léxico que vincula שֶׁמֶץ con μακρόν es inconsistente —μακρόν significa «prolongada/larga», no «leve»—, ello no exige cambiar el texto publicado ni las notas propuestas, que distinguen correctamente el hebreo primario del paralelo griego.
  issues:
  - severity: medium
    issue: La nota [a] invierte o confunde la acción del médico en el paralelo griego.
    rationale: 'El griego «μακρὸν ἀρρώστημα, σκώπτει ἰατρός» contiene σκώπτει con ἰατρός como sujeto: el médico se burla/se mofa de la enfermedad prolongada. No describe al médico como desconcertado ni como objeto de burla. La nota debe informar la variante sin atribuirle un sentido que el griego no expresa.'
  - severity: low
    issue: La nota [b] dice que el griego «añade» la frase sobre el fin del rey.
    rationale: El griego no añade un elemento ausente, sino que ofrece una formulación paralela que interpreta más específicamente el hebreo «caerá» mediante «llegará a su fin/morirá». «Dice» o «lee» expresa la relación textual con mayor precisión.
  revised_spanish_text: Una enfermedad leve hace que el médico se ponga pálido[a]; un rey hoy[b], y mañana caerá.
  revised_footnotes:
  - marker: a
    text: 'El hebreo describe literalmente un cambio de color asociado con la enfermedad. El paralelo griego, en cambio, dice: «Una enfermedad prolongada; un médico se burla [de ella]»; la traducción principal sigue la imagen corporal visible del hebreo.'
    reason: lexical_alternative
  - marker: b
    text: 'El griego dice: «y mañana llegará a su fin», interpretando el hebreo «caerá» de manera más específica como muerte o fin definitivo.'
    reason: alternative_reading
  revision_rationale: Se conserva íntegramente la traducción principal, que es fiel y natural. Se corrigen las notas para representar con exactitud el sujeto y sentido de σκώπτει ἰατρός en el paralelo griego y para describir con precisión su relación interpretativa con el hebreo.
