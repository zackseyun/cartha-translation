review_pass:
  verdict: revise
  source_alignment_summary: El texto principal sigue correctamente el griego, conforme a la decisión documentada ante la discrepancia mayor con el hebreo. «No te jactes en tiempo de angustia» reproduce adecuadamente μὴ δοξάζου ἐν καιρῷ στενοχωρίας σου. La nota conserva de forma apropiada el testimonio hebreo divergente y la incertidumbre semántica del verbo final.
  spanish_quality_summary: «No te hagas sabio» puede entenderse en español como una prohibición de llegar a ser sabio, no como la advertencia griega contra mostrarse o hacerse pasar por sabio. Una formulación que exprese la pretensión de sabiduría es más clara y fiel. El resto es natural, digno y legible.
  glossary_alignment: No intervienen los términos de terminología teológica predeterminada en el texto principal. En la nota, «esclavo» corresponde correctamente a עֶבֶד y conserva la fuerza léxica del testimonio hebreo; «prudente» y «necio» son adecuados para מַשְׂכּיל y סָכָל.
  issues:
  - severity: medium
    issue: Ambigüedad de «No te hagas sabio»
    rationale: Aunque pretende reflejar el valor medio de σοφίζου, en español normalmente puede leerse como «no llegues a ser sabio». El contexto y las alternativas léxicas documentadas requieren comunicar la exhibición o pretensión de sabiduría, no desalentar la sabiduría misma.
  revised_spanish_text: No presumas de sabio[a] al realizar tu trabajo, y no te jactes en tiempo de angustia.
  revised_footnotes:
  - marker: a
    text: 'Testimonio alternativo importante: «Un esclavo prudente es exaltado, y un esclavo necio no se quejará»; el verbo final también puede llevar un matiz como «murmurar» o «buscar pretexto».'
    reason: textual_variant
  revision_rationale: Se sustituye «No te hagas sabio» por «No presumas de sabio» para expresar con claridad la advertencia de σοφίζου contra la autoexhibición o pretensión de sabiduría. Se mantiene la nota textual, anclada con el mismo marcador, porque documenta la lectura hebrea sustancialmente divergente.
