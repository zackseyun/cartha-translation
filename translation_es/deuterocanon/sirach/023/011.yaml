review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva la estructura y las principales relaciones de responsabilidad y juicio del griego, pero «peca inadvertidamente» introduce una falta no deliberada que πλημμελήσῃ no exige y que el audit trail inglés final explícitamente descartó. También «maldad» atenúa la fuerza de ἀνομία como iniquidad o quebrantamiento del orden moral.
  spanish_quality_summary: La redacción es en general clara y digna, pero la nota [a] está anclada indebidamente a «maldad» aunque trata de μάστιξ, y su alternativa propuesta («la azotará un flagelo») no corresponde a la sintaxis ni al sentido del texto. Se reordenan los marcadores de notas para que sean únicos, consecutivos y estén junto a los términos pertinentes.
  glossary_alignment: Se conserva «azote» para μάστιξ, «justificado» para δικαιωθήσεται y «calamidades» para el difícil ἐπαγωγῶν. Se cambia ἀνομία a «iniquidad» para reflejar mejor su carga moral-jurídica, y πλημμελήσῃ a «tropieza», conforme a la decisión léxica inglesa final y sin añadir involuntariedad.
  issues:
  - severity: high
    issue: «Si peca inadvertidamente» añade involuntariedad a πλημμελήσῃ.
    rationale: El verbo expresa fallar, incurrir en falta o tropezar; no especifica que el acto sea inadvertido. La revisión inglesa final restauró «if he stumbles» y rechazó «sins unintentionally» por sobreespecificación.
  - severity: medium
    issue: La nota [a] está anclada a «maldad» pero comenta μάστιξ, y su texto no ofrece una alternativa válida para la cláusula.
    rationale: Cada nota debe anclarse al término que explica. μάστιξ significa «látigo/azote» y puede usarse figuradamente como castigo; no significa que un flagelo azote al hombre en esta construcción.
  - severity: medium
    issue: «Maldad» es demasiado general para ἀνομία.
    rationale: Aunque puede comunicar mal moral, «iniquidad» preserva mejor el matiz de perversidad y quebrantamiento del orden o ley que documenta el análisis léxico.
  revised_spanish_text: El hombre que hace muchos juramentos se llenará de iniquidad, y el azote[a] no se apartará de su casa. Si tropieza, su pecado recae sobre él; y si lo menosprecia, ha pecado doblemente. Y si juró en vano[b], no será justificado[c], porque su casa se llenará de calamidades[d].
  revised_footnotes:
  - marker: a
    text: 'O: «látigo». El griego μάστιξ puede denotar un látigo literal o, figuradamente, un azote de castigo.'
    reason: lexical_alternative
  - marker: b
    text: 'O: «juró falsamente» / «hizo un juramento vacío». La expresión griega literalmente habla de jurar «por vaciedad».'
    reason: lexical_alternative
  - marker: c
    text: 'O: «no será absuelto» / «no será declarado justo». El verbo tiene matiz forense y aquí expresa vindicación o absolución negada.'
    reason: lexical_alternative
  - marker: d
    text: El término final es difícil; probablemente alude a males o penas impuestas que vendrán sobre la casa.
    reason: textual_variant
  revision_rationale: La revisión elimina la involuntariedad añadida a πλημμελήσῃ, recupera el sentido de ἀνομία, y corrige el anclaje, contenido y orden de las notas. «Hace muchos juramentos» es una formulación española más natural para el adjetivo πολύορκος sin reducir su sentido habitual.
