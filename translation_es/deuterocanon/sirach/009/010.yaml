review_pass:
  verdict: revise
  source_alignment_summary: El hebreo suministrado no corresponde al contenido de Sirácida 9:10; el paralelo griego sí ofrece el dicho sobre el amigo de larga data y el vino nuevo. La traducción debe seguir el griego y conservar una nota que documente esta discrepancia textual.
  spanish_quality_summary: La redacción es en general clara y fiel, pero «amigo antiguo» suena poco idiomático en español actual y la secuencia «vino nuevo, amigo nuevo» deja demasiado implícita la comparación que el griego formula en estilo aforístico. Una explicitación breve mantiene el sentido y mejora la legibilidad.
  glossary_alignment: No intervienen los términos teológicos preferentes del proyecto. «Abandones», «nuevo», «igual», «vino», «añeja/envejece» y «alegría» representan adecuadamente el griego. Se prefiere «viejo amigo» como modismo natural para φίλον ἀρχαῖον en el sentido de una amistad de larga data.
  issues:
  - severity: low
    issue: «amigo antiguo» es una formulación poco natural para una amistad de larga data.
    rationale: Aunque puede entenderse, en español moderno «viejo amigo» es el modismo normal y conserva la oposición proverbial con «amigo nuevo».
  - severity: low
    issue: La comparación en «vino nuevo, amigo nuevo» queda excesivamente elíptica en español.
    rationale: El griego puede sostener la yuxtaposición sentenciosa, pero «Un amigo nuevo es como vino nuevo» comunica de modo inequívoco la relación comparativa sin añadir contenido.
  revised_spanish_text: 'No abandones a un viejo amigo[a], porque uno nuevo no es igual a él; un amigo nuevo es como vino nuevo: cuando este envejece, lo beberás con alegría.'
  revised_footnotes:
  - marker: a
    text: La línea hebrea suministrada para esta unidad parece pertenecer a otro dicho y no coincide con Sirácida 9:10; por eso la traducción sigue el testimonio griego.
    reason: textual_variant
  revision_rationale: Se sustituye «amigo antiguo» por el modismo español «viejo amigo» y se hace explícita la comparación proverbial entre el amigo nuevo y el vino nuevo. «Este» aclara que el envejecimiento y la acción de beber se refieren al vino. La nota textual se conserva sin cambios y permanece correctamente anclada.
