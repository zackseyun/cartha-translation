    rationale: El griego καρδία σκληρὰ βαρυνθήσεται ἐπ᾽ ἐσχάτων contiene el verbo pasivo «será cargado/agravado/agobiado», no el adjetivo «pesado». «Será agobiado al final» conserva la acción y comunica idiomáticamente el sentido.
  revised_spanish_text: El corazón pesado multiplica sus dolores[a], y el que actúa con desenfreno añade pecado sobre pecado[b].
  revised_footnotes:
