review_pass:
  verdict: revise
  source_alignment_summary: 'El texto reproduce fielmente las dos cláusulas nominales griegas: «Toda sabiduría» conserva el alcance de Πᾶσα σοφία; «temor del Señor» preserva φόβος Κυρίου sin reducirlo a simple respeto; y «la práctica de la ley» expresa adecuadamente ποίησις νόμου como observancia activa. La sintaxis «en toda sabiduría está» es una forma española natural de representar la segunda cláusula.'
  spanish_quality_summary: 'El texto principal es claro, digno y publicable. Las dos notas requieren una leve corrección de redacción y de régimen preposicional: «reverencia del Señor» puede entenderse como la reverencia que siente el Señor, y «El griego puede expresarse» no describe con precisión una alternativa de traducción.'
  glossary_alignment: «Sabiduría», «temor», «ley» y «práctica» se ajustan a las decisiones léxicas documentadas. «Señor» refleja el κύριος del texto griego y la decisión explícita de la auditoría inglesa; la decisión española documenta esa excepción contextual frente al valor predeterminado de «Yahvé» para el nombre hebreo.
  issues:
  - severity: low
    issue: Redacción de la nota a
    rationale: La alternativa debe decir «reverencia al Señor» para expresar inequívocamente el objeto de la reverencia. También conviene identificar como «expresión griega» lo que se traduce tradicionalmente.
  - severity: low
    issue: Redacción de la nota b
    rationale: No es el griego el que «puede expresarse» de otra forma; la expresión griega puede traducirse de otra manera. La revisión conserva todas las alternativas sustantivas documentadas.
  revised_spanish_text: Toda sabiduría es temor del Señor[a], y en toda sabiduría está la práctica de la ley[b].
  revised_footnotes:
  - marker: a
    text: O «reverencia al Señor». La expresión griega, tradicionalmente traducida «temor del Señor», incluye asombro reverente, pero el texto principal mantiene la expresión más fuerte del original.
    reason: lexical_alternative
  - marker: b
    text: O «observancia de la ley». La expresión griega también puede traducirse más formalmente con «hacer» u «observancia» en lugar de «práctica».
    reason: alternative_reading
  revision_rationale: Se conservan intactos el texto principal, el sentido de las alternativas y los marcadores. Solo se corrige la redacción de las notas para que sean idiomáticas, precisas y libres de ambigüedad en español.
