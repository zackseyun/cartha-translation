review_pass:
  verdict: revise
  source_alignment_summary: El texto principal conserva adecuadamente αἰσχύνη («vergüenza»), el genitivo proverbial «de un padre», el hijo varón implícito en ἀπαιδεύτου, el contraste explícito con «una hija» y el sentido comprimido de ἐπʼ ἐλαττώσει («para pérdida»). «Nace» es una contextualización natural y fiel de γίνεται en un dicho sobre descendencia. Sin embargo, la nota a atribuye al griego una formulación literalmente explícita con «un hijo», cuando «hijo» se suple a partir del masculino de ἀπαιδεύτου.
  spanish_quality_summary: La redacción es clara, sobria y conserva la aspereza proverbial y la asimetría social del original sin suavizarlas. «Para pérdida» es conciso y deliberadamente amplio; aunque algo marcado en español corriente, funciona en el registro sentencioso y queda aclarado por la nota b.
  glossary_alignment: No intervienen los términos de glosario con equivalencias obligatorias. «Indisciplinado» refleja bien el sentido moral-sapiencial de ἀπαίδευτος, y se mantienen las designaciones sexuadas «padre», «hijo» e «hija» conforme a la evidencia griega y a la decisión documentada.
  issues:
  - severity: low
    issue: La nota a presenta «un hijo» como parte de una cita literal del griego.
    rationale: El sustantivo «hijo» no aparece en el texto griego; es una inferencia justificable por el adjetivo masculino ἀπαιδεύτου y el paralelismo con θυγάτηρ, pero la nota debe distinguir con precisión entre lo literal y lo suplido.
  revised_spanish_text: La vergüenza de un padre es el nacimiento de un hijo indisciplinado[a], y una hija nace para pérdida[b].
  revised_footnotes:
  - marker: a
    text: 'Griego, literalmente: «La vergüenza de un padre es el nacimiento de un [hijo] indisciplinado». «Hijo» se suple porque el adjetivo es masculino.'
    reason: lexical_alternative
  - marker: b
    text: O «para disminución», «para menoscabo» o «para pérdida de su padre»; la expresión griega apunta a reducción o pérdida, pero su matiz exacto es comprimido.
    reason: alternative_reading
  revision_rationale: 'Se corrige únicamente la precisión de la nota a: los corchetes muestran que «hijo» está implícito, no expresado de manera léxica en el griego. El texto de publicación y la nota b no requieren cambio.'
