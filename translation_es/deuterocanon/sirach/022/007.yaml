review_pass:
  verdict: revise
  source_alignment_summary: La estructura comparativa de «Enseñar a un necio es como..., como...» comunica adecuadamente los dos participios griegos y conserva «necio» para μωρόν y «sueño profundo» para ἐκ βαθέος ὕπνου. Sin embargo, «tiesto» puede entenderse predominantemente como una maceta en buena parte de América Latina, en lugar de un fragmento de cerámica, y la nota actual está anclada incorrectamente en «necio» pese a tratar de la construcción participial de toda la comparación.
  spanish_quality_summary: El texto es conciso, natural y de registro sapiencial apropiado. Se recomienda «fragmento de cerámica» para eliminar la ambigüedad regional de «tiesto». La nota se reformula y se ancla en «Enseñar» para que su alternativa formal corresponda a la sintaxis del versículo.
  glossary_alignment: «Necio» conserva la fuerza sapiencial moral e intelectual de μωρόν. «Pegar» refleja bien συγκολλῶν; «fragmento de cerámica» expresa con claridad ὄστρακον en español latinoamericano. «Despertar» y «sueño profundo» corresponden fielmente a ἐξεγείρων y ἐκ βαθέος ὕπνου.
  issues:
  - severity: medium
    issue: «Tiesto» es regionalmente ambiguo.
    rationale: Aunque puede significar un fragmento de vasija, en gran parte del español latinoamericano se entiende primero como una maceta. «Fragmento de cerámica» comunica inequívocamente el sentido de ὄστρακον.
  - severity: low
    issue: La nota estructural está anclada en «necio» y su formulación no presenta una alternativa más formal.
    rationale: La nota explica los participios y la comparación de la oración completa, no μωρόν. Debe anclarse en la construcción inicial y ofrecer una formulación que refleje la parataxis participial griega.
  revised_spanish_text: Enseñar[a] a un necio es como pegar un fragmento de cerámica, como despertar a uno de un sueño profundo.
  revised_footnotes:
  - marker: a
    text: 'O, más formalmente: «Quien enseña a un necio pega un fragmento de cerámica; despierta a alguien de un sueño profundo». El griego emplea participios en paralelo, en vez de expresar de manera explícita «es como».'
    reason: lexical_alternative
  revision_rationale: Se sustituye «tiesto» por «fragmento de cerámica» para preservar sin ambigüedad la imagen de un ὄστρακον en el español meta. Se mueve y corrige la nota para que su ancla y su alternativa formal correspondan a la sintaxis participial griega.
