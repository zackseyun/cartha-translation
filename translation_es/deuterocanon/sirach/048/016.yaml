review_pass:
  verdict: revise
  source_alignment_summary: 'El texto principal refleja fielmente el hebreo: וישאר ליהודה מזער se transmite como «Un resto quedó para Judá»; לבית דוד קצין como «para la casa de David un gobernante»; עשו יושר como «hicieron lo recto»; y הפליאו מעל conserva la intensificación y la fuerza de infidelidad pactal en «aumentaron mucho la apostasía». El paralelo griego solo atestigua el segundo miembro y lee «multiplicaron pecados», por lo que la nota alternativa es pertinente.'
  spanish_quality_summary: 'La redacción principal es clara, digna y natural en español. La nota necesita corrección: «dice más con fuerza» no es idiomático, «apostasia» requiere tilde, y debe expresar la intensificación hebrea que justifica la diferencia con el griego. El marcador debe anclarse en la expresión a la que se refiere la variante, no en «resto».'
  glossary_alignment: «Judá», «casa de David», «gobernante», «recto» y «apostasía» concuerdan con las decisiones léxicas documentadas. «Apostasía» preserva adecuadamente מעל frente al griego más general «pecados».
  issues:
  - severity: low
    issue: Nota alternativa imprecisa y con redacción/acentuación defectuosas; marcador mal situado.
    rationale: La nota actual omite la intensificación de הפליאו, dice «más con fuerza» de forma poco natural y escribe «apostasia» sin tilde. Puesto que la nota explica el último hemistiquio, [a] debe acompañar «apostasía».
  revised_spanish_text: Un resto quedó para Judá, y para la casa de David un gobernante. Algunos de ellos hicieron lo recto, pero algunos aumentaron mucho la apostasía[a].
  revised_footnotes:
  - marker: a
    text: 'Paralelo griego: «algunos de ellos multiplicaron pecados». El hebreo expresa con mayor fuerza: «aumentaron mucho la apostasía/traición».'
    reason: alternative_reading
  revision_rationale: Se conserva sin cambios el sentido de la traducción principal. Se corrige y precisa la nota para distinguir adecuadamente la lectura griega general («pecados») de la lectura hebrea más fuerte de infidelidad, y se traslada su marcador al sintagma pertinente.
