review_pass:
  verdict: revise
  source_alignment_summary: La comparación «como una espada de dos filos» y la afirmación de que para la herida no hay curación reflejan fielmente ὡς ῥομφαία δίστομος y τῇ πληγῇ αὐτῆς οὐκ ἔστιν ἴασις. Sin embargo, «injusticia» no conserva adecuadamente el sentido específico de ἀνομία como iniquidad o conducta que viola la ley/orden moral; puede referirse más específicamente a un acto injusto contra otra persona.
  spanish_quality_summary: La redacción es clara, digna y natural. «Espada de dos filos» y «no hay curación» son expresiones idiomáticas. El ajuste de «injusticia» a «iniquidad» mejora la precisión sin sacrificar legibilidad; la nota explica el matiz de ley/orden que «iniquidad» por sí sola puede dejar implícito.
  glossary_alignment: No se activan los términos predeterminados principales. Para ἀνομία, «iniquidad» es una alternativa española bíblica, clara y más fiel que «injusticia» al campo semántico de «lawlessness» documentado en la auditoría inglesa. La nota preserva explícitamente la fuerza de violación de ley u orden moral.
  issues:
  - severity: medium
    issue: «Toda injusticia» para πᾶσα ἀνομία
    rationale: ἀνομία designa ante todo falta de ley, transgresión o iniquidad, no meramente «injusticia». Aunque ambos términos comparten una dimensión moral, «injusticia» desplaza el referente hacia lo inequitativo y no preserva suficientemente el énfasis documentado de violación de la ley/orden.
  revised_spanish_text: Toda iniquidad[a] es como una espada de dos filos; para su herida no hay curación.
  revised_footnotes:
  - marker: a
    text: «Iniquidad» traduce ἀνομία, es decir, conducta que viola la ley o el orden moral; también puede expresarse como «maldad» o «transgresión».
    reason: Preserva y explica en español el matiz de transgresión de ley/orden moral que tiene ἀνομία.
  revision_rationale: Se sustituye «injusticia» por «iniquidad» y se revisa la nota para conservar el sentido de ἀνομία establecido por la evidencia griega y la decisión léxica inglesa. No se requieren otros cambios.
