  glossary_alignment: «Yahvé», «misericordia», «expiación» y «volverse a él» se ajustan a los criterios terminológicos del proyecto y al contexto. La alternativa «propiciación» debe mantenerse como posibilidad técnica para ἐξιλασμός, sin duplicar la lectura principal.
