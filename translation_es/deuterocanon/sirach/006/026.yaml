review_pass:
  verdict: revise
  source_fidelity: La cláusula inicial («Acércate a ella con toda tu alma») refleja bien ἐν πάσῃ ψυχῇ σου πρόσελθε αὐτῇ y conserva la personificación femenina. En la segunda cláusula, συντήρησον τὰς ὁδοὺς αὐτῆς expresa la adhesión cuidadosa a los caminos de la sabiduría; «sigue sus caminos» comunica este valor exhortativo de forma más clara en español actual.
  naturalness: «Guarda sus caminos» es posible en registro bíblico, pero puede sugerir que se protegen o custodian los caminos. «Sigue sus caminos» expresa naturalmente la conducta requerida. La coma tras «alma» y antes de «con toda tu fuerza» mejora la lectura del paralelismo.
  terminology: Se mantienen «alma», «fuerza», «caminos» y el femenino «ella/sus», sin introducir una interpretación doctrinal. Se elimina una nota que no ofrece una alternativa concreta y cuyo anclaje en «alma» no corresponde específicamente a la dificultad verbal indicada.
  issues:
  - severity: low
    issue: «guarda sus caminos» es semánticamente menos claro en español moderno.
    rationale: Aunque puede entenderse como obedecer u observar, también puede leerse como custodiar físicamente los caminos. «Sigue sus caminos» preserva el sentido de adherirse a ellos, coherente con el griego y con el inglés «keep to her ways».
  - severity: low
    issue: La nota a no aporta una variante textual o léxica definida y está anclada de manera imprecisa.
    rationale: La nota cita prácticamente toda la oración y afirma un «matiz más formal» sin explicar una alternativa verificable; por ello no ayuda al lector y conviene retirarla.
  revised_text: Acércate a ella con toda tu alma y, con toda tu fuerza, sigue sus caminos.
  revised_footnotes: []
  revision_rationale: Se conserva la estructura, el paralelismo y la personificación femenina del griego. Se sustituye «guarda» por «sigue» para expresar idiomáticamente la observancia o adhesión a los caminos de la sabiduría, y se retira la nota no sustantiva.
