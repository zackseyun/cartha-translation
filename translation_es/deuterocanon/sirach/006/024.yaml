review_pass:
  verdict: revise
  source_fidelity: El texto hebreo conservado presenta un dicho sapiencial sobre el fruto y el cultivo de un árbol, en paralelo con el razonamiento/cálculo y la inclinación de una persona. «Como..., así...» y «fruto», «cultivo», «razonamiento» e «inclinación» son una representación viable de esa línea hebrea. La construcción hebrea es muy condensada; «depende de» explicita de modo razonable la relación comparativa indicada por על, sin introducir una conclusión doctrinal. No obstante, el paralelo griego ofrece un texto enteramente distinto (pies en grilletes y cuello en collar), por lo que la divergencia debe describirse con precisión.
  naturalness: La redacción es clara, actual y natural para español latinoamericano neutral. «El fruto de un árbol depende de su cultivo» funciona idiomáticamente; el segundo miembro conserva el carácter proverbial. La coma tras «cultivo» ayuda a separar los dos miembros sin alterar el paralelismo.
  terminology: «Cultivo» conserva la imagen agrícola sin la rareza de «cultivación». «Razonamiento» es una opción interpretativa natural para חשבון, aunque «cálculo/cuenta» también son posibles según el matiz. «Inclinación» reproduce adecuadamente יצר y mantiene su amplitud semántica.
  issues:
  - severity: medium
    issue: La nota al pie atribuye al «hebreo recibido en la última decisión de revisión» una opción que no coincide con el actual rastro de auditoría inglés.
    rationale: El texto inglés vigente sigue el paralelo griego («fetters/collar»), mientras que el texto español sigue el hebreo de Kahana. La nota debe informar la divergencia textual sin afirmar que una supuesta última decisión editorial favorece el hebreo.
  revised_text: Como el fruto de un árbol depende de su cultivo[a], así el razonamiento de una persona depende de su inclinación.
  revised_footnotes:
  - marker: a
    text: El hebreo conservado contiene un proverbio sobre el fruto, el cultivo, el razonamiento y la inclinación. El paralelo griego de este versículo transmite en cambio una imagen de grilletes y collar; esta traducción sigue el texto hebreo.
    reason: textual_variant
  revision_rationale: Se conserva el texto principal, que refleja de manera natural y suficientemente fiel el hebreo disponible. Se reemplaza la nota porque su referencia a una «última decisión de revisión» es inexacta frente al expediente inglés actual y puede ocultar la marcada diferencia entre las tradiciones hebrea y griega.
