review_pass:
  verdict: revise
  source_fidelity: 'El hebreo anuncia que el חלל, es decir, personas muertas por la violencia, caerá en medio del destinatario plural, seguido por la fórmula de reconocimiento: «sabrán que yo soy Yahvé». La formulación revisada conserva el sentido futuro y resultativo sin introducir agentes ni circunstancias ausentes del texto.'
  naturalness: «Los muertos caerán» resulta poco natural en español, pues «muertos» puede entenderse como personas ya fallecidas que vuelven a caer. «Caerán muertos» expresa de manera idiomática el resultado mortal implícito en חלל y mantiene el tono sobrio profético. «En medio de ustedes» y «sabrán» son naturales en español latinoamericano neutral.
  terminology: «Yahvé» es una forma española asentada para יהוה y hace visible el nombre divino, conforme a la decisión del proyecto. La nota léxica se mantiene, ahora correctamente anclada en «muertos».
  issues:
  - severity: medium
    issue: La nota [a] no está anclada en el texto.
    rationale: El error de validación exige colocar el marcador junto al término al que explica.
  - severity: low
    issue: «Los muertos caerán» puede sonar semánticamente extraño en español.
    rationale: Puede sugerir que quienes ya están muertos caen. Reordenar como «Caerán muertos» conserva el contenido y mejora la naturalidad.
  revised_text: Caerán muertos[a] en medio de ustedes, y sabrán que yo soy Yahvé.
  revised_footnotes:
  - marker: a
    text: 'Hebreo: חָלָל, término que puede designar a alguien muerto por violencia; aquí se traduce de forma general como «muertos».'
    reason: lexical_alternative
  revision_rationale: Se corrige el anclaje obligatorio de la nota [a] y se ajusta el orden de «muertos» para una expresión española natural que conserva el sentido de personas abatidas que caen en medio de ustedes. No se modifica la referencia al nombre divino ni la fórmula de reconocimiento.
