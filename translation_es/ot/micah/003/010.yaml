review_pass:
  verdict: revise
  source_alignment_summary: El participio בֹּנֶה se comunica adecuadamente mediante «El que edifica», y se conservan la coordinación, los topónimos y la acusación de עַוְלָה como «injusticia». Sin embargo, בְּדָמִים es plural idiomático y, según la evidencia fuente y la decisión auditada, debe expresarse en el texto como derramamiento de sangre/sangre derramada, no dejar «con sangre» como lectura principal mientras la nota presenta la traducción idiomática como alternativa. Asimismo, «edificar Sion/Jerusalén» lleva complemento directo sin la preposición «a».
  spanish_quality_summary: La redacción revisada es natural, clara y digna en español bíblico moderno. «Derramamiento de sangre» evita la imagen equívoca de construir materialmente con sangre, y la omisión de «a» ante los nombres de ciudades corrige el régimen verbal.
  glossary_alignment: «Sion», «Jerusalén» e «injusticia» son adecuados. «Derramamiento de sangre» preserva la fuerza idiomática del plural hebreo דָּמִים; la nota conserva «con sangre» como alternativa más literal.
  issues:
  - severity: medium
    issue: La traducción principal de בְּדָמִים como «con sangre» no expresa el sentido idiomático elegido en la auditoría inglesa.
    rationale: El plural hebreo suele denotar derramamiento de sangre o culpa de sangre en este contexto. La propia nota y la decisión teológica del borrador reconocen ese sentido, pero lo relegan indebidamente a una alternativa.
  - severity: low
    issue: «Edifica a Sion ... y a Jerusalén» usa una preposición que no corresponde al complemento directo de «edificar» en esta construcción.
    rationale: Las ciudades son lo edificado; «edifica Sion ... y Jerusalén» mantiene el paralelismo hebreo y es el uso español natural.
  revised_spanish_text: El que edifica Sion con derramamiento de sangre[a] y Jerusalén con injusticia.
