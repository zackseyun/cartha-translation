review_pass:
  verdict: revise
  source_alignment_summary: El borrador refleja correctamente el nombre divino, el modismo hebreo de restaurar la condición de Job, el vínculo temporal con su oración intercesora y la duplicación final. Sin embargo, debe conservar mediante notas las alternativas léxicas significativas que el expediente inglés documenta, en particular para el modismo de restauración, בעד y למשנה.
  spanish_quality_summary: La redacción es clara y natural. Se propone «la situación de Job» en vez de «la suerte de Job» para evitar que «suerte» se entienda principalmente como azar en español actual, sin perder el sentido abarcador del modismo hebreo.
  glossary_alignment: «Yahvé» aplica el término establecido para יהוה. «Oró por sus amigos» conserva el sentido intercesor de בעד. «El doble de todo lo que había tenido antes» comunica adecuadamente למשנה en el contexto de la restauración.
  issues:
  - severity: medium
    issue: Faltan las notas léxicas significativas preservadas en el expediente inglés.
    rationale: El modismo שב את שבית no implica necesariamente liberación de un cautiverio literal; בעד también puede expresarse «en favor de»; y la cláusula final admite una formulación más literal. Estas alternativas deben quedar disponibles en notas españolas ancladas de manera inequívoca.
  revised_spanish_text: Yahvé restauró la situación de Job[a] cuando oró por sus amigos[b], y Yahvé le dio a Job el doble de todo lo que había tenido antes[c].
  revised_footnotes: *id001
  revision_rationale: Se conserva el sentido del texto publicado y se añaden las notas léxicas necesarias. «La situación de Job» expresa con claridad moderna el alcance no literal del modismo hebreo y evita una posible lectura de «suerte» como azar.
