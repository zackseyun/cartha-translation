  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: es
  text: Yahvé restauró la situación de Job[a] cuando oró por sus amigos[b], y Yahvé le dio a Job el doble de todo lo que había tenido antes[c].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «cambió la suerte de Job» o «restauró la fortuna de Job». El modismo hebreo se refiere a restaurar la condición de una persona; no exige que se trate de una liberación de cautiverio literal.
    reason: lexical_alternative
  - marker: b
    text: O «en favor de sus amigos».
    reason: lexical_alternative
  - marker: c
    text: Más literalmente, «Yahvé añadió a Job, en doble medida, todo lo que le había pertenecido».
    reason: lexical_alternative
