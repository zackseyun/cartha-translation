  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: es
  text: Entonces se levantará en su lugar uno que enviará a un recaudador[a] a través del esplendor del reino[b]; pero dentro de unos pocos días será quebrantado, aunque no por ira[c] ni en batalla.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «un cobrador de tributos» o «un opresor». El término hebreo designa a quien exige tributo o pago.
    reason: lexical_alternative
  - marker: b
    text: O «la gloria del reino». La expresión puede referirse a la parte más espléndida del dominio o, en un sentido más amplio, a la majestad del reino.
    reason: lexical_alternative
  - marker: c
    text: También puede entenderse «no en ira» o «no por causa de la ira». La expresión hebrea es concisa y admite matiz adverbial o instrumental.
    reason: lexical_alternative
