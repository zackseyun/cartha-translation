review_pass:
  verdict: revise
  source_alignment_summary: 'El hebreo ordena recordar la palabra/mandato que Moisés, siervo de Yahvé, les dio, y presenta a Yahvé como quien les está dando descanso y les ha dado la tierra. El qatal וְנָתַן admite una lectura de futuro asegurado, pero, en el marco narrativo de las tribus orientales cuya heredad ya había sido otorgada, «les ha dado» expresa mejor el valor completivo documentado en las decisiones léxicas y teológicas. La pista de auditoría inglesa es internamente inconsistente: su texto actual dice «will give», mientras sus decisiones y explicación contextual favorecen «has given»; esto no exige trasladar esa inconsistencia al texto español.'
  spanish_quality_summary: La redacción es clara y digna, y usa correctamente «Yahvé» y «siervo». Sin embargo, «les dará» elimina el valor completivo preferido y la alternativa significativa sobre el aspecto verbal. La revisión conserva un español natural y añade una nota anclada donde corresponde.
  glossary_alignment: יְהוָה se traduce «Yahvé», conforme al proyecto. עֶבֶד funciona como título honorífico para Moisés y se traduce «siervo», excepción contextual justificada a «esclavo». מֵנִיחַ se vierte «les está dando descanso», preservando el participio causativo y su sentido de conceder reposo. וְנָתַן se traduce «les ha dado», con nota para la alternativa futura asegurada.
  issues:
  - severity: medium
    issue: Aspecto de וְנָתַן
    rationale: El borrador dice «les dará», pero el qatal puede ser completivo y el contexto inmediato de la heredad ya concedida favorece «les ha dado», tal como lo documentan las decisiones léxicas y teológicas. Debe conservarse en nota la alternativa futura.
  - severity: low
    issue: Falta de nota sobre la alternativa aspectual
    rationale: La auditoría inglesa preserva una alternativa para el verbo de dar. La traducción española debe mantener esa alternativa mediante una nota anclada a la frase pertinente.
  revised_spanish_text: 'Recuerden la palabra que Moisés, siervo de Yahvé, les mandó, diciendo: «Yahvé, su Dios, les está dando descanso y les ha dado esta tierra[a]».'
  revised_footnotes: *id001
  revision_rationale: Se cambia «les dará» por «les ha dado» para reflejar la lectura completiva contextual del perfecto hebreo y se añade la alternativa futura documentada. También se ajusta la puntuación de «Yahvé, su Dios» para una lectura española más clara.
