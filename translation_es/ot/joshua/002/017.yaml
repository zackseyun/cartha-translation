  source_alignment_summary: 'El texto reproduce fielmente la secuencia y el sentido del hebreo: «los hombres» conserva הָאֲנָשִׁים sin importar «espías»; «le dijeron» corresponde a אֵלֶיהָ; «Nosotros quedaremos libres» expresa el pronombre enfático אֲנַחְנוּ y el sentido prospectivo exigido por el contexto; y «que nos hiciste jurar» preserva el causativo hifil de הִשְׁבַּעְתָּנוּ. «Este juramento tuyo» conserva tanto el demostrativo como el sufijo femenino de segunda persona.'
