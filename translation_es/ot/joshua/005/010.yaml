    issue: Falta la nota léxica para «hijos de Israel».
    rationale: La traducción principal es correcta, pero el rastro inglés conserva una nota significativa que señala «los israelitas» como alternativa y explica que el hebreo dice literalmente «los hijos de Israel». Las instrucciones requieren preservar en notas españolas las alternativas significativas que el inglés POB preservó.
