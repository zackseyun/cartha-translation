  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: es
  text: Y consagraron a la destrucción[a] todo lo que había en la ciudad, desde el hombre hasta la mujer, desde el joven hasta el anciano, y aun el buey, la oveja y el asno, al filo de la espada.
  philosophy: optimal-equivalence
  footnotes: &id001
