- from: 'Y Dios llamó a la luz Día, y a la oscuridad la llamó Noche. Y hubo tarde, y hubo mañana: el primer día[a].'
  to: 'Y Dios llamó Día a la luz, y llamó Noche a la oscuridad. Y hubo tarde, y hubo mañana: el primer día[a].'
  rationale: Se restituye «Dios» para traducir fielmente אֱלֹהִים, sin importar al versículo el nombre Yahvé, que no figura en el hebreo. Se adopta «el primer día» conforme a la decisión inglesa auditada y se mantiene «día uno» en una nota anclada. También se ordena la construcción española de nombramiento sin perder la repetición de קרא.
