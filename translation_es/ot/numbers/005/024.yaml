review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva adecuadamente el causativo hebreo de וְהִשְׁקָה («hará beber»), la entrada del agua en la mujer y la función resultativa de לְמָרִים. «Que trae maldición» refleja apropiadamente los participios de ארר como efecto mediador de maldición, no como una cualidad meramente intrínseca del agua. Sin embargo, «con amargura» puede leerse como la manera en que el agua entra, en vez del resultado que expresa לְמָרִים; «para causarle amargura» comunica con claridad dicho resultado.
  spanish_quality_summary: El español es claro, moderno y apropiado para el registro bíblico. Se propone una precisión menor en la cláusula final y la incorporación de notas que preserven las alternativas significativas y el plural hebreo documentados en la auditoría inglesa.
  glossary_alignment: No intervienen los términos preferentes del proyecto como Yahvé, Mesías, espíritu o esclavo. «Maldición» para ארר y «amargura/amarga» para מָרִים son elecciones adecuadas. «Har á beber» preserva el valor causativo sin calco innecesario.
  issues:
  - severity: medium
    issue: La frase final «entrará en ella con amargura» es ambigua respecto de la función resultativa de לְמָרִים.
    rationale: 'El prefijo ל expresa resultado o efecto: el agua entra en ella para producir amargura. «Con amargura» puede describir adverbialmente la entrada o simplemente reiterar que el agua es amarga, y por ello atenúa la relación de resultado.'
  - severity: low
    issue: Faltan las notas léxicas y de lectura alternativa preservadas por la auditoría inglesa.
    rationale: La singularización de «agua» es natural en español, pero la nota debe informar el plural hebreo; también debe conservarse la alternativa que puede llamar «maldita» al agua, aunque el texto principal correctamente prefiera su efecto de traer maldición.
  revised_spanish_text: Entonces hará beber a la mujer el agua amarga que trae maldición[a][b], y el agua que trae maldición entrará en ella para causarle amargura.
  revised_footnotes: *id001
  revision_rationale: Se aclara el valor resultativo de לְמָרִים mediante «para causarle amargura» y se restauran las dos notas sustantivas de la auditoría inglesa, con marcadores españoles únicos y anclados en el texto. La redacción principal sigue tratando el agua como vehículo de la maldición en el rito, no como un objeto inherentemente mágico o supersticioso.
