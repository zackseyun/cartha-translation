    text: 'Hebreo: «pan/alimento de una ofrenda presentada por fuego»; aquí «alimento» se refiere a la provisión sacrificial y no necesariamente solo a pan literal.'
    reason: cultural_note
  - marker: c
    text: 'O: «junto con el holocausto continuo y su libación».'
