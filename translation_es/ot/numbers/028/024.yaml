  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: es
  text: 'Así[a] ofrecerán cada día durante siete días: alimento[b] de una ofrenda presentada por fuego, aroma agradable para Yahvé. Esto se ofrecerá además[c] del holocausto continuo y de su libación.'
