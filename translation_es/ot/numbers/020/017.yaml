  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: es
  text: Te rogamos que nos dejes pasar por tu tierra. No pasaremos por campo ni por viña, ni beberemos agua de un pozo. Iremos por el camino del rey[a]; no nos desviaremos a la derecha ni a la izquierda hasta haber pasado tu frontera[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «camino real».
    reason: lexical_alternative
  - marker: b
    text: Hebreo «tu frontera»; la expresión se refiere a pasar más allá del límite de tu territorio.
    reason: lexical_alternative
