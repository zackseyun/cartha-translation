    rationale: La alternativa para «camino del rey» y la aclaración de «frontera» deben preservarse para reflejar las opciones semánticas documentadas. Los marcadores ingleses están asociados de forma invertida en el material de auditoría, por lo que se corrigen y se anclan al sintagma español pertinente.
