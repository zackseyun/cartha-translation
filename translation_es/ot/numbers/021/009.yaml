  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: es
  text: Moisés hizo una serpiente de bronce[a] y la puso sobre un poste[b]. Y sucedía que, si la serpiente mordía a un hombre[c], este miraba la serpiente de bronce[d] y vivía.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «serpiente de cobre». El término hebreo para el metal puede referirse al cobre o al bronce.
    reason: lexical_alternative
  - marker: b
    text: O «estandarte» o «bandera» para «poste».
    reason: lexical_alternative
  - marker: c
    text: Hebreo «un hombre», usado aquí en sentido representativo para cualquier persona mordida.
    reason: lexical_alternative
  - marker: d
    text: Este acontecimiento tiene un eco tipológico posterior en Juan 3:14–15.
    reason: cross_reference
