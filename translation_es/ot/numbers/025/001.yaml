  source_alignment_summary: El hebreo presenta a Israel permaneciendo en Sitim y al pueblo comenzando (וַיָּחֶל) a realizar זנה con las hijas de Moab. «Mientras Israel estaba en Sitim» transmite adecuadamente el marco narrativo y la residencia/estancia sin afirmar un asentamiento permanente; «el pueblo comenzó» conserva el sujeto colectivo y el inicio de la acción. «Prostituirse con» refleja la fuerza sexual y figurativamente intensa de לִזְנוֹת אֶל, y «las hijas de Moab» mantiene la expresión hebrea.
  spanish_quality_summary: La redacción es clara, natural y digna en español latinoamericano. Requiere una nota anclada en «prostituirse» para conservar la alternativa léxica significativa documentada en el expediente inglés; la omisión no exige cambiar el texto principal.
  glossary_alignment: «Sitim» es una transliteración española reconocible del topónimo שִׁטִּים. No intervienen los términos teológicos predeterminados del proyecto. «Prostituirse» conserva la elección léxica fuerte para זנה, en vez de suavizarla como «inmoralidad sexual».
  issues:
