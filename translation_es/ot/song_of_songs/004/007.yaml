  verdict: revise
  source_alignment_summary: El borrador transmite correctamente la afirmación totalizadora de כֻּלָּךְ, la belleza de יָפָה, el vocativo afectuoso femenino רַעְיָתִי y la negación existencial de «defecto» (מוּם) «en ti». Sin embargo, omite las alternativas léxicas significativas que el expediente inglés conserva para los tres términos principales.
  spanish_quality_summary: «Eres toda hermosa, mi amada» es comprensible, pero «Toda tú eres hermosa, amada mía» resulta más natural y poético en español, conserva el énfasis sobre la totalidad de la mujer y mantiene claramente el vocativo afectuoso.
  glossary_alignment: No intervienen los términos teológicos fijados por el proyecto. «Amada mía» expresa adecuadamente el vocativo íntimo femenino; «defecto» conserva el sentido de מוּם como imperfección o defecto, sin reducirlo indebidamente a una simple mancha.
  issues:
  - severity: low
    issue: Faltan notas de alternativas léxicas.
    rationale: El rastro de auditoría inglés preserva alternativas relevantes para כֻּלָּךְ, רַעְיָתִי y מוּם. Deben conservarse en español con marcadores únicos y anclados en el texto.
  - severity: low
    issue: La colocación de «toda» puede hacerse más idiomática y enfática.
    rationale: «Toda tú eres hermosa» refleja de forma más clara la fuerza comprehensiva del hebreo y suena más fluido en registro poético español que «Eres toda hermosa».
