  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: es
  text: Así que fui a Perat[a], y cavé, y saqué el cinturón[b] del lugar donde lo había escondido. Y he aquí que el cinturón estaba arruinado; no servía para nada.
  philosophy: optimal-equivalence
