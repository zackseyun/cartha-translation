review_pass:
  verdict: revise
  source_alignment_summary: El texto refleja la secuencia narrativa hebrea («fui... cavé... saqué»), la ocultación previa, el estado deteriorado de la prenda y su total inutilidad. Sin embargo, omite las dos notas léxicas/identificativas sustantivas preservadas por la auditoría inglesa.
  spanish_quality_summary: La redacción es clara y digna en español. «Perat», «cinturón», «he aquí», «arruinado» y «no servía para nada» son comprensibles y fieles; no se requiere cambiar la prosa salvo añadir los anclajes de las notas.
  glossary_alignment: No intervienen los términos teológicos predeterminados del proyecto. «Perat» conserva la transliteración del topónimo hebreo en vez de identificarlo sin más como el Éufrates. «Cinturón» es una opción española legítima para אֵזוֹר, pero debe conservarse la gama de alternativas mediante nota.
  issues:
  - severity: medium
    issue: Falta la nota sobre Perat y su posible identificación con el Éufrates.
    rationale: פְּרָתָה es el topónimo «Perat» en el texto hebreo; la posible identificación tradicional con el Éufrates debe quedar disponible en nota, tal como documenta la auditoría inglesa.
  - severity: medium
    issue: Falta la nota léxica para «cinturón».
    rationale: אֵזוֹר designa una prenda llevada alrededor de la cintura y admite alternativas relevantes; la nota evita que «cinturón» se entienda como una especificación exclusiva.
  revised_spanish_text: Así que fui a Perat[a], y cavé, y saqué el cinturón[b] del lugar donde lo había escondido. Y he aquí que el cinturón estaba arruinado; no servía para nada.
  revised_footnotes: *id001
  revision_rationale: Se añaden los anclajes y las notas requeridas para preservar la incertidumbre identificativa de Perat y las alternativas léxicas de אֵזוֹר, sin alterar una traducción principal ya fiel y natural.
