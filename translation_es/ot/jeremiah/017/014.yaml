  text: Sáname, Yahvé, y seré sanado; sálvame[a], y seré salvado, porque tú eres mi alabanza[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «líbrame ... y seré librado». El verbo hebreo también puede referirse al rescate o la liberación, además de la salvación en un sentido más amplio.
    reason: Alternativa léxica de הוֹשִׁיעֵנִי / וְאִוָּשֵׁעָה.
  - marker: b
    text: O «porque tú eres a quien alabo». El hebreo dice literalmente «porque tú eres mi alabanza».
    reason: Alternativa idiomática para la expresión literal תְהִלָּתִי אָתָּה.
