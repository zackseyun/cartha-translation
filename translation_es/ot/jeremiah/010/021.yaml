  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: es
  text: Porque los pastores[b] se han embrutecido[a], y no han buscado a Yahvé; por eso no han actuado con sabiduría[c], y todo su rebaño se ha dispersado.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «se han vuelto brutales» o «se han vuelto insensatos».
    reason: lexical_alternative
  - marker: b
    text: Probablemente «pastores» se refiere metafóricamente a los dirigentes del pueblo.
    reason: cultural_note
  - marker: c
    text: O «no han obrado sabiamente» o «no han prosperado». El verbo hebreo puede incluir tanto el sentido de sabiduría como el del éxito resultante.
    reason: lexical_alternative
