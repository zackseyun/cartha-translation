base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: es
  text: Y tú, devastada[a], ¿qué harás? Aunque te vistas de escarlata, aunque te adornes con adornos de oro, aunque te agrandes los ojos con pintura[b], en vano te embelleces. Tus amantes te desprecian; buscan tu vida.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «saqueada» o «destruida». El hebreo se dirige a una figura femenina singular, probablemente Jerusalén/Sion personificada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «aunque rasgues tus ojos con púkh». El púkh era un cosmético oscuro para los ojos, a menudo llamado «kohl» o «antimonio».
    reason: cultural_note
