  source_alignment_summary: 'El texto principal refleja fielmente el hebreo: mantiene la apelación femenina singular a la figura devastada, las tres cláusulas concesivas, la imagen cosmética idiomática de פּוּךְ, la inutilidad del embellecimiento y el desenlace de que sus amantes buscan su vida. Sin embargo, omite las dos notas que preservan alternativas léxicas y el trasfondo cultural documentados en la auditoría inglesa.'
  spanish_quality_summary: La redacción es clara, natural y digna en español latinoamericano. «Devastada», «escarlata», «adornos de oro», «te agrandes los ojos con pintura» y «buscan tu vida» son elecciones legibles y precisas. Se añaden marcadores de nota en los puntos semánticamente pertinentes.
  glossary_alignment: No intervienen términos con una equivalencia obligatoria del glosario general. «Amantes» conserva adecuadamente el valor metafórico de עֹגְבִים; «vida» reproduce la expresión נפשׁ con בקש; y «pintura» comunica el sentido cosmético de פּוּךְ, con «kohl» y «antimonio» aclarados en nota.
  issues:
  - severity: medium
    issue: Faltan las notas de alternativas y de trasfondo cultural conservadas en la auditoría inglesa.
    rationale: La nota sobre שָׁדוּד conserva alternativas significativas y explicita la destinataria femenina personificada; la de פּוּךְ explica que la pintura es un cosmético ocular específico. Ambas deben anclarse en el texto español para cumplir la política de notas.
  revised_spanish_text: Y tú, devastada[a], ¿qué harás? Aunque te vistas de escarlata, aunque te adornes con adornos de oro, aunque te agrandes los ojos con pintura[b], en vano te embelleces. Tus amantes te desprecian; buscan tu vida.
