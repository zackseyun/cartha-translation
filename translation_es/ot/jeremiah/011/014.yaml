  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: es
  text: Pero en cuanto a ti, no ores por este pueblo, ni eleves por ellos clamor ni oración, porque no escucho en el tiempo en que claman a mí por causa de su calamidad[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «desastre». La palabra hebrea también puede significar «mal» en otros contextos, pero aquí se refiere a la calamidad que les ha sobrevenido.
    reason: Alternativa léxica significativa para רָעָה; aclara que el sentido contextual es calamidad y no maldad moral.
