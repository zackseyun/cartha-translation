  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: es
  text: Y Yahvé de los Ejércitos, que te plantó, ha anunciado calamidad contra ti por la maldad de la casa de Israel y de la casa de Judá, que hicieron para sí mismos, provocándome a ira al quemar incienso a Baal[a].
