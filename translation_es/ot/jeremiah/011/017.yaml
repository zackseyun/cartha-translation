review_pass:
  verdict: revise
  source_alignment_summary: El borrador refleja correctamente Yahvé, «de los Ejércitos», la metáfora de plantar, la distinción entre la calamidad anunciada y la maldad humana, y el sentido cultual de קטר. Sin embargo, omite לָהֶם en «que hicieron para provocarme»; debe conservarse la referencia reflexiva/benefactiva que el expediente inglés documenta como «to themselves».
  spanish_quality_summary: La redacción es clara y digna. «Ha anunciado calamidad contra ti» comunica bien el juicio anunciado. La corrección propuesta incorpora el elemento omitido sin alterar la sintaxis ni el registro. El expediente español carece de decisiones léxicas y teológicas propias; esa carencia de metadatos no requeriría por sí misma una revisión, pero aquí hay además una omisión textual real.
  glossary_alignment: «Yahvé» sigue la convención del proyecto para יהוה; «Ejércitos» traduce צבאות sin el arcaísmo «huestes». «Calamidad» y «maldad» mantienen los dos sentidos de רע/רעה. «Quemar incienso» expresa con precisión el sentido ritual de קטר; la nota conserva la alternativa más amplia del rastro inglés.
  issues:
  - severity: medium
    issue: Omisión de לָהֶם
    rationale: «que hicieron para provocarme» no representa el pronombre plural con לְ de אֲשֶׁר עָשׂוּ לָהֶם. Conforme a la decisión léxica auditada, debe expresarse que lo hicieron «para sí mismos», aunque la formulación española sea necesariamente algo más explícita.
  - severity: low
    issue: Falta la nota léxica sobre קטר
    rationale: El rastro inglés preserva como alternativa significativa «making offerings». Al escoger el sentido específico «quemar incienso», corresponde conservar en nota la alternativa cultual más amplia.
  revised_spanish_text: Y Yahvé de los Ejércitos, que te plantó, ha anunciado calamidad contra ti por la maldad de la casa de Israel y de la casa de Judá, que hicieron para sí mismos, provocándome a ira al quemar incienso a Baal[a].
  revised_footnotes: *id001
  revision_rationale: Se restaura לָהֶם mediante «para sí mismos» y se añade una nota que conserva la alternativa cultual más amplia documentada en la auditoría inglesa, mientras que el texto principal mantiene el sentido específico y natural de «quemar incienso».
