review_pass:
  verdict: revise
  source_alignment_summary: El hebreo atribuye la declaración a Yahvé y da como motivo que ellos abandonaron su torá, la cual él puso delante de ellos; בנוסף, no «escucharon a su voz» (שׁמע בְּקוֹל) ni anduvieron en ella. «Han abandonado», «mi ley», «puse delante de ellos» y «han andado en ella» reflejan adecuadamente esos elementos. La redacción propuesta cambia «han obedecido mi voz» por «han escuchado mi voz», preservando la imagen hebrea sin eliminar la implicación de obediencia, que se conserva en nota.
  spanish_quality_summary: El borrador es claro y digno, pero «han obedecido mi voz» interpreta explícitamente una expresión que el rastro léxico inglés decidió mantener como «listened to my voice». La revisión ofrece un español natural («han escuchado mi voz») y añade las alternativas léxicas necesarias. Se conserva la coma antes de la cláusula final coordinada y las comillas españolas.
  glossary_alignment: YHWH se traduce «Yahvé», conforme al estándar del proyecto. תּוֹרָה se traduce «ley» por su fuerza jurídico-pactual en este contexto, con «instrucción» en nota como alternativa. שׁמע בְּקוֹל se traduce «escuchar mi voz»; «obedecer mi voz» se mantiene como sentido contextual alternativo. הלך ב se conserva como la metáfora bíblica «andar en ella».
  issues:
  - severity: medium
    issue: «han obedecido mi voz» hace explícita una interpretación que el texto hebreo expresa literalmente como «escucharon a mi voz».
    rationale: Aunque שׁמע con בְּקוֹל implica obediencia en este contexto, la decisión léxica y teológica auditada privilegia conservar la imagen de escuchar y dejar la obediencia como alternativa. La publicación española debe hacer lo mismo.
  - severity: low
    issue: Faltan notas para las alternativas significativas de תּוֹרָה y שׁמע בְּקוֹל.
    rationale: «Instrucción» y «obedecer mi voz» son alternativas documentadas que deben preservarse en notas españolas. El expediente inglés contiene además una inconsistencia heredada entre los anclajes de sus notas y su contenido; ello no impide corregir los anclajes españoles de modo coherente.
  revised_spanish_text: 'Y Yahvé dijo: «Porque han abandonado mi ley[a], que puse delante de ellos, y no han escuchado mi voz[b] ni han andado en ella».'
  revised_footnotes: *id001
  revision_rationale: Se ajusta «obedecido» a «escuchado» para preservar la formulación hebrea y la decisión de traducción auditada, y se incorporan notas ancladas de forma correcta para las alternativas léxicas significativas.
