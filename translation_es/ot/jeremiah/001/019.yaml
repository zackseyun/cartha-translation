  source_alignment_summary: 'El texto español reproduce fielmente la secuencia y el sentido del hebreo: oposición hostil («pelearán contra ti»), incapacidad de imponerse («no prevalecerán contra ti»), la presencia aseguradora de Dios («yo estoy contigo»), la fórmula profética נאם יהוה y el propósito de rescate. «Yahvé» aplica correctamente la política del proyecto para יהוה.'
  spanish_quality_summary: La redacción es clara, natural y digna en español latinoamericano. No requiere cambios en la redacción principal; la revisión añade las notas significativas conservadas por la auditoría inglesa, con anclajes españoles colocados en las expresiones a las que realmente corresponden.
  glossary_alignment: יהוה se vierte «Yahvé», conforme al valor de nombre divino y al glosario del proyecto. נלחמו se expresa con «pelearán», que conserva el conflicto sin sobredimensionarlo como guerra formal. יכל + ל se expresa con «no prevalecerán contra ti», preservando el fracaso frente a Jeremías. הציל se vierte «librarte», una opción profética natural para el rescate de peligro.
  issues:
