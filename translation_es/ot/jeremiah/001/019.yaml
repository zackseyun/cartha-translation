    rationale: Aunque el texto publicado es fiel, la tarea requiere conservar alternativas significativas en notas españolas. Se añaden notas para «prevalecerán», «Yahvé» y «librarte»; los marcadores se ordenan y se anclan a los términos pertinentes.
  revised_spanish_text: Pelearán contra ti, pero no prevalecerán contra ti[a], porque yo estoy contigo, declara Yahvé[b], para librarte[c].
