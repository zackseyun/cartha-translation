review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva la secuencia de acciones divinas en primera persona y comunica correctamente el desbaratamiento del plan, la caída por la espada ante los enemigos, la agencia de quienes buscan la vida de Judá y Jerusalén, y la entrega de los cadáveres a animales carroñeros. Se recomienda «por la espada» para reflejar con mayor claridad el valor instrumental de בַּחֶרֶב, y «cielos» para conservar el plural elevado de הַשָּׁמַיִם.
  spanish_quality_summary: El español es claro, digno y natural. La revisión propuesta mantiene «desbarataré», una expresión idiomática y fiel para el causativo de בקק, y ajusta levemente la construcción instrumental. Se añaden las notas léxicas significativas preservadas por la auditoría inglesa, con marcadores únicos y ordenados.
  glossary_alignment: «Judá», «Jerusalén», «cadáveres», «bestias de la tierra» y la referencia no enmascarada a la acción divina se ajustan a los criterios del proyecto. No hay terminología teológica especializada que requiera una excepción de glosario.
  issues:
  - severity: medium
    issue: Faltan las notas léxicas significativas conservadas en la auditoría inglesa.
    rationale: La alternativa de עֲצָה («consejo»), la explicación del modismo «buscan su vida» y la alternativa para «aves de los cielos» deben conservarse en español; cada una requiere un anclaje explícito en el texto.
  - severity: low
    issue: «A espada» puede leerse como una locución de modo y hace menos explícito el instrumental hebreo.
    rationale: «Por la espada» refleja más directamente בַּחֶרֶב y se integra con naturalidad en la oración.
  revised_spanish_text: Y desbarataré el plan[a] de Judá y Jerusalén en este lugar, y haré que caigan por la espada delante de sus enemigos y por mano de quienes buscan su vida[b]; y daré sus cadáveres como alimento para las aves de los cielos[c] y para las bestias de la tierra.
  revised_footnotes: *id001
  revision_rationale: La revisión conserva el sentido del hebreo y la buena redacción del borrador, pero incorpora las alternativas y la explicación idiomática requeridas por el rastro de auditoría inglés. También cambia «a espada» por «por la espada» y «cielo» por «cielos» para una correspondencia fuente más transparente.
