  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: es
  text: Y desbarataré el plan[a] de Judá y Jerusalén en este lugar, y haré que caigan por la espada delante de sus enemigos y por mano de quienes buscan su vida[b]; y daré sus cadáveres como alimento para las aves de los cielos[c] y para las bestias de la tierra.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «el consejo de Judá y Jerusalén».
    reason: lexical_alternative
  - marker: b
    text: Hebreo «quienes buscan su vida», es decir, quienes procuran matarlos.
    reason: lexical_alternative
  - marker: c
    text: O «las aves del cielo».
    reason: lexical_alternative
