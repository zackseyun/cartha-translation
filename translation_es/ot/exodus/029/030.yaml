  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: es
  text: Durante siete días, el sacerdote de entre sus hijos que lo suceda[b] se las pondrá[a], cuando entre en la tienda de reunión para ministrar en el lugar santo[c].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «las llevará» o «las vestirá». El verbo hebreo puede significar «ponerse» o «llevar/vestir», según el contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «el sacerdote en su lugar, de entre sus hijos»; es decir, el sacerdote que lo sucede.
    reason: lexical_alternative
  - marker: c
    text: O «en el santuario».
    reason: lexical_alternative
