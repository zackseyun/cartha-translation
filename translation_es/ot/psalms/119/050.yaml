  glossary_alignment: «Promesa» para אִמְרָה concuerda con la decisión léxica inglesa y mantiene la distinción frente a «palabra». «Consuelo», «aflicción» y «vida» son elecciones adecuadas y no plantean conflicto con la terminología del proyecto.
