  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת / נֶחָמָתִי
  english_pob_choice: This is my comfort
  chosen_spanish: Esto es mi consuelo
  alternatives_spanish:
  - Esta es mi consolación
  - Esto es mi alivio
  lexicon: HALOT
  rationale: זֹאת introduce una referencia enfática retomada por el predicado nominal; en español, «Esto es» mantiene la deixis natural. נֶחָמָה expresa consuelo/consolación; «consuelo» es la opción más idiomática y fiel en español moderno, sin perder el valor de alivio afectivo.
- source_word: בְעָנְיִי
  english_pob_choice: in my affliction
  chosen_spanish: en mi aflicción
  alternatives_spanish:
  - en mi angustia
  - en mi sufrimiento
  lexicon: HALOT
  rationale: עָנִי/עָנְיִי puede abarcar aflicción, humillación o pobreza de opresión; «aflicción» preserva el sentido amplio y solemne del salmo, y encaja con el paralelismo del versículo.
- source_word: אִמְרָתְךָ
  english_pob_choice: your promise
  chosen_spanish: tu promesa
  alternatives_spanish:
  - tu palabra
  - tu decir
  - tu dicha
  lexicon: HALOT
  rationale: La POB inglesa ya documenta la elección «promise» para distinguir אִמְרָה de דָּבָר. En español, «promesa» conserva esa distinción y expresa mejor el compromiso divino implícito en el contexto del salmo que «palabra» o «dicho».
- source_word: חִיָּתְנִי
  english_pob_choice: gives me life
  chosen_spanish: me da vida
  alternatives_spanish:
  - me vivifica
  - me vivió
  - me da vida y me sostiene
  lexicon: HALOT
  rationale: El verbo חיה en forma causativa comunica dar vida, revivir o preservar con vida. «Me da vida» es natural en español, fiel al valor causativo y suficientemente amplio para abarcar revivificación y preservación.
theological_decisions:
- issue: Sentido de אִמְרָה como compromiso divino, no mera información
  english_pob_reading: your promise
  chosen_spanish_reading: tu promesa
  alternative_spanish_readings:
  - tu palabra
  - tu dicho
  rationale: Seguir «promesa» evita reducir el término a una simple unidad verbal. El verso afirma que la vida del salmista depende del compromiso fiel de Dios expresado en su palabra.
  doctrine_reference: Fidelidad de Dios a su palabra; dependencia vital del creyente de la revelación divina.
translation_notes:
  revision_awareness: La POB inglesa se traduce directamente del hebreo y ya resolvió אִמְרָתְךָ como 'promise'; la versión española conserva esa decisión, ajustando solo la naturalidad sintáctica del español sin añadir contenido ajeno al hebreo.
  spanish_consistency_notes:
  - Se mantiene el paralelismo breve del hebreo con dos miembros principales.
  - «Consuelo» y «aflicción» guardan un registro elevado y bíblico sin caer en arcaísmo innecesario.
  - No se usa «SEÑOR» ni «Cristo» porque el versículo no contiene esos términos.
  - «Promesa» se reserva para אִמְרָה conforme al criterio auditado de la POB inglesa, evitando mezclarlo con דָּבָר («palabra»).
