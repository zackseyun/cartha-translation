  text: Con mis labios recito todos los decretos de tu boca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׂפָתַ֥/י
  english_pob_choice: With my lips
  chosen_spanish: Con mis labios
  alternatives_spanish:
  - Con mis labios
  - Con mis boca
  lexicon: BDB 973; HALOT s.v. שָׂפָה
  rationale: El hebreo usa el plural 'labios' como parte corporal concreta para la expresión verbal; 'con mis labios' mantiene la imagen sin sonar forzado en español.
- source_word: סִפַּ֑רְתִּי
  english_pob_choice: I recount
  chosen_spanish: recito
  alternatives_spanish:
  - cuento
  - narro
  - refiero
  lexicon: HALOT s.v. ספר
  rationale: En este contexto poético, el verbo comunica una proclamación repetida o declarativa de los estatutos divinos. 'Recito' conserva el acto verbal deliberado y solemne mejor que un simple 'cuento'.
- source_word: כֹּ֝֗ל
  english_pob_choice: all
  chosen_spanish: todos
  alternatives_spanish:
  - todo
  lexicon: BDB 363; HALOT s.v. כֹּל
  rationale: El plural 'todos' concuerda naturalmente con 'los decretos' en español y transmite la totalidad sin pérdida de sentido.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_spanish: decretos
  alternatives_spanish:
  - ordenanzas
  - sentencias
  - juicios
  lexicon: HALOT s.v. מִשְׁפָּט
  rationale: POB inglés eligió 'ordinances' para evitar el matiz punitivo de 'judgments' y distinguirlo de otros términos legales. En español, 'decretos' expresa con claridad decisiones normativas y justas; 'ordenanzas' quedó como alternativa válida, pero puede sonar demasiado técnico o eclesiástico.
- source_word: פִי/ךָ
  english_pob_choice: of your mouth
  chosen_spanish: de tu boca
  alternatives_spanish:
  - de tu boca
  - de tu boca misma
  lexicon: BDB 804; HALOT s.v. פֶּה
  rationale: '''De tu boca'' preserva la imagen antropomórfica de la revelación divina y sigue de cerca el hebreo y el inglés POB, sin suavizarla con una abstracción.'
translation_notes:
  revision_awareness: No hay revisiones registradas en el paquete; la redacción sigue de cerca el hebreo WLC y refleja la decisión inglesa de 'ordinances' como término legal-normativo no punitivo.
  spanish_consistency_notes:
  - Se mantuvo el antropomorfismo 'boca' para פֶּה, coherente con el original y con el audit trail inglés.
  - '''Decretos'' se eligió como equivalente idiomático de ''ordinances'' dentro de un registro bíblico claro y público.'
  - No se introdujeron notas textuales ni variantes porque el paquete no documenta ninguna diferencia relevante.
