translation:
  language: es
  text: He visto a los traidores y he sentido repulsión[a], porque no guardan tu palabra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «me he indignado». El verbo hebreo es difícil y puede expresar una reacción de fuerte rechazo, repulsión o agitación.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I look on
  chosen_spanish: He visto
  alternatives_spanish:
  - Miro
  - Contemplo
  lexicon: HALOT
  rationale: El hebreo expresa una percepción/observación completa; en español, el perfecto compuesto comunica bien la experiencia del salmista sin endurecerla en una observación estática.
- source_word: בֹגְדִים
  english_pob_choice: the faithless
  chosen_spanish: los traidores
  alternatives_spanish:
  - los infieles
  - los desleales
  lexicon: HALOT
  rationale: El término hebreo apunta a quienes actúan con traición o infidelidad de pacto. 'Traidores' conserva mejor esa carga relacional y moral que una mera etiqueta general de incredulidad.
- source_word: וָאֶתְקוֹטָטָה
  english_pob_choice: with disgust
  chosen_spanish: me ha dado disgusto
  alternatives_spanish:
  - me he indignado
  - siento repugnancia
  lexicon: BDB/HALOT
  rationale: La forma verbal es difícil y admite matices de agitación, rechazo o repulsión. 'Me ha dado disgusto' conserva la reacción afectiva fuerte sin imponer un matiz más específico de los que el texto no exige.
- source_word: אִמְרָתְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu promesa
  - tu dicho
  lexicon: HALOT
  rationale: 'Sigo el criterio auditado de la POB en inglés: aquí ''word'' traduce mejor אִמְרָה que ''promise'', porque el versículo contrasta la conducta de los traidores con la obediencia a lo dicho por Dios, no solo con una promesa aislada.'
theological_decisions:
- issue: Cómo rendir בֹגְדִים en un contexto de fidelidad al pacto
  english_pob_reading: the faithless
  chosen_spanish_reading: los traidores
  alternative_spanish_readings:
  - los infieles
  - los desleales
  rationale: En este salmo, la infidelidad no es solo una falta interior, sino una ruptura práctica de lealtad a Dios. 'Traidores' transmite mejor esa dimensión de ruptura de fidelidad que una traducción más abstracta.
  doctrine_reference: Fidelidad de pacto / obediencia a la palabra de Dios
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de audit trail; la redacción española sigue directamente el texto hebreo y la decisión léxica auditada del inglés POB para אִמְרָתְךָ ('word').
  spanish_consistency_notes:
  - Se mantiene 'tu palabra' para אִמְרָתְךָ, en continuidad con la decisión inglesa auditada.
  - Se evita 'SEÑOR' porque el versículo usa segunda persona directa ('tu').
  - '''Disgusto'' se eligió para preservar la ambigüedad del hebreo sin sobreinterpretar el verbo oscuro.'
