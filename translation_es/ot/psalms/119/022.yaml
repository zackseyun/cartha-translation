translation:
  language: es
  text: Quita de sobre mí el oprobio y el desprecio, porque he guardado tus testimonios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּ֣ל / גלה
  english_pob_choice: Take ... away from me
  chosen_spanish: Quita de sobre mí
  alternatives_spanish:
  - Aparta de mí
  - Haz desaparecer de mí
  lexicon: HALOT
  rationale: El hebreo usa un imperativo con sentido de remover algo que pesa sobre la persona. «Quita de sobre mí» conserva esa imagen de traslado/remoción en español natural y fiel al tono imperativo del verso.
- source_word: חֶרְפָּ֣ה
  english_pob_choice: reproach
  chosen_spanish: oprobio
  alternatives_spanish:
  - afrenta
  - reproche
  - vergüenza
  lexicon: HALOT
  rationale: «Oprobio» comunica con precisión el deshonor o descrédito social que expresa חֶרְפָּה, sin suavizarlo como un simple «reproche».
- source_word: ב֑וּז
  english_pob_choice: contempt
  chosen_spanish: desprecio
  alternatives_spanish:
  - menosprecio
  - desecho
  - burla
  lexicon: HALOT
  rationale: «Desprecio» es el equivalente directo y claro para בּוּז en español bíblico actual, conservando el paralelo con «oprobio».
- source_word: עֵדֹתֶ֣י/ךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - mandatos del pacto
  - testimonios del pacto
  lexicon: HALOT
  rationale: Se conserva «testimonios» para mantener la coherencia con la decisión léxica inglesa de la POB y con el uso consistente del salmo para עֵדוֹת / עֵדוּת. En español, «testimonios» es inteligible y mantiene el sentido de declaraciones/divinos testimonios.
- source_word: נָצָֽרְתִּי
  english_pob_choice: I have kept
  chosen_spanish: he guardado
  alternatives_spanish:
  - he observado
  - he preservado
  - he obedecido
  lexicon: HALOT
  rationale: «He guardado» reproduce bien el sentido de custodiar, observar y mantener fielmente los mandamientos/testimonios, sin reducirlo solo a «obedecer».
theological_decisions:
- issue: Naturaleza del pedido inicial como remoción de deshonra pública
  english_pob_reading: Take reproach and contempt away from me
  chosen_spanish_reading: Quita de sobre mí el oprobio y el desprecio
  alternative_spanish_readings:
  - Aparta de mí el oprobio y el desprecio
  - Quita de mí la afrenta y el desprecio
  rationale: El verso expresa una petición de liberación de deshonra y humillación. «De sobre mí» conserva la carga de algo que pesa encima del salmista y no solo una distancia abstracta.
  doctrine_reference: Salmo 119:22; cf. Salmo 25:2-3
- issue: Relación causal entre obediencia y apelación a Yahvé
  english_pob_reading: for I have kept your testimonies
  chosen_spanish_reading: porque he guardado tus testimonios
  alternative_spanish_readings:
  - pues he guardado tus testimonios
  - porque he observado tus testimonios
  rationale: La cláusula causal se mantiene de forma directa. No se añade mérito explícito; la frase funciona como fundamento argumentativo del ruego, tal como en el hebreo y en la POB inglesa.
  doctrine_reference: Salmo 119:22; Salmo 119:55-56
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente; la traducción sigue de cerca el hebreo, con la POB inglesa como control de consistencia léxica para עֵדֹתֶיךָ -> testimonios.
  spanish_consistency_notes:
  - Se mantiene «tus testimonios» en coherencia con la serie de עֵדֹות/עֵדוּת en el Salmo 119.
  - Se evita «SEÑOR»; el versículo no contiene el Tetragrámaton ni κύριος.
  - La sintaxis española conserva el paralelismo del verso sin añadir matices interpretativos ajenos al texto.
