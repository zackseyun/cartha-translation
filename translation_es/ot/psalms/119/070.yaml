translation:
  language: es
  text: Se ha embotado su corazón como grasa; pero yo me deleito en tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָפַשׁ כַּחֵלֶב לִבָּם
  english_pob_choice: Their heart is unfeeling like fat
  chosen_spanish: Se ha embotado su corazón como grasa
  alternatives_spanish:
  - Su corazón está insensible como grasa
  - Su corazón se ha vuelto torpe como grasa
  lexicon: HALOT
  rationale: טָפַשׁ expresa la idea de volverse torpe, insensible o embotado; el POB inglés opta por 'unfeeling'. En español, 'embotado' comunica mejor esa pérdida de sensibilidad sin añadir una imagen ajena. 'Grasa' conserva el símil de כַּחֵלֶב, y es más natural que 'sebo' en registro general.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se mantiene 'ley' porque el POB inglés conservó esa traducción estable para תּוֹרָה dentro del salmo, y en español sigue siendo clara y reverente. 'Instrucción' y 'enseñanza' quedan como alternativas válidas para la gama semántica de תּוֹרָה, pero 'ley' conserva la correspondencia auditada y el paralelismo poético.
- source_word: שִׁעֲשָׁעְתִּי
  english_pob_choice: I delight
  chosen_spanish: me deleito
  alternatives_spanish:
  - me recreo
  - encuentro mi deleite
  lexicon: HALOT
  rationale: El verbo expresa gozo, deleite o complacencia intensa. 'Me deleito' reproduce bien el valor afectivo del hebreo y la decisión inglesa, con un nivel de dignidad adecuado al texto poético.
theological_decisions:
- issue: Contraste moral entre un corazón insensible y la respuesta del salmista a la ley de Dios
  english_pob_reading: Their heart is unfeeling like fat, but I delight in your law.
  chosen_spanish_reading: Se ha embotado su corazón como grasa; pero yo me deleito en tu ley.
  alternative_spanish_readings:
  - Su corazón está insensible como grasa; pero yo me deleito en tu ley.
  - Se ha endurecido su corazón como grasa; pero yo me deleito en tu ley.
  rationale: 'El verso presenta un contraste ético y espiritual: la torpeza del corazón ajeno frente al deleite del salmista en la revelación divina. ''Embotado'' evita afirmar más de lo que el verbo hebreo exige; ''endurecido'' es posible, pero podría desplazar el matiz hacia dureza moral más que insensibilidad.'
  doctrine_reference: Salmo 119; cf. la imaginería bíblica del corazón insensible frente a la obediencia gozosa a la palabra de Dios.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; se sigue la lectura hebrea directa y la decisión léxica auditada del inglés POB, ajustada a español natural.
  spanish_consistency_notes:
  - Se mantiene 'ley' para תּוֹרָה en coherencia con el POB inglés y con el uso del Salmo 119.
  - No se introduce 'SEÑOR' ni otras convenciones de ocultamiento del Nombre porque el verso no contiene el tetragrámaton.
  - '''Grasa'' conserva el símil corporal del hebreo sin suavizarlo en exceso.'
