translation:
  language: es
  text: Inclina mi corazón hacia tus testimonios, y no hacia la ganancia egoísta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַט / incline
  english_pob_choice: Incline
  chosen_spanish: Inclina
  alternatives_spanish:
  - Doblega
  - Inclina hacia
  lexicon: BDB/HALOT
  rationale: El imperativo hebreo pide una acción divina sobre el interior del orante; «Inclina» conserva la imagen física y la apelación directa sin sobreparafrasear.
- source_word: לִבִּי / my heart
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi mente
  - mi interior
  lexicon: BDB/HALOT
  rationale: «Corazón» mantiene el centro personal-volitivo y afectivo del hebreo bíblico, más preciso aquí que una simplificación a «mente».
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones del pacto
  lexicon: HALOT
  rationale: Se conserva el término POB «testimonios» para reflejar la categoría técnico-poética hebrea de עֵדוֹת/עֵדוּת y distinguirla de otros sinónimos legales del Salterio.
- source_word: בָּצַע
  english_pob_choice: selfish gain
  chosen_spanish: ganancia egoísta
  alternatives_spanish:
  - lucro deshonesto
  - provecho injusto
  - ganancia ilícita
  lexicon: HALOT/BDB
  rationale: בָּצַע puede implicar codicia, lucro o ganancia obtenida indebidamente; «ganancia egoísta» reproduce la orientación del POB sin restringir innecesariamente el matiz a una sola práctica concreta.
theological_decisions:
- issue: La súplica pide orientación interior hacia la obediencia y alejamiento del deseo de provecho indebido.
  english_pob_reading: Incline my heart to your testimonies, and not to selfish gain.
  chosen_spanish_reading: Inclina mi corazón hacia tus testimonios, y no hacia la ganancia egoísta.
  alternative_spanish_readings:
  - Inclina mi corazón a tus testimonios, y no al lucro injusto.
  - Inclina mi corazón hacia tus testimonios, y no hacia la codicia.
  rationale: La frase mantiene la tensión ética del salmo entre la fidelidad a la palabra de Dios y el impulso hacia el provecho personal, sin redefinirla como un vicio más específico que el hebreo no exige.
  doctrine_reference: Salmo 119:36; cf. sabiduría bíblica sobre integridad y codicia
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el expediente inglés; la traducción española sigue directamente el texto hebreo y la decisión léxica auditada de 'testimonies'.
  spanish_consistency_notes:
  - Se conserva la terminología POB «testimonios» por coherencia con la serie de sinónimos del Salmo 119.
  - «Corazón» se usa como sede integral de voluntad y afecto, conforme al uso bíblico y al español eclesial actual.
  - «Ganancia egoísta» evita una paráfrasis excesiva y conserva la amplitud semántica de בָּצַע.
