  source_alignment_summary: 'El hebreo presenta dos cláusulas yuxtapuestas: «la angustia/aprieto y la aflicción me han hallado; tus mandamientos [son] mis deleites». El borrador conserva adecuadamente los dos términos de adversidad, el verbo «me han hallado», «mandamientos» para מִצְוֺתֶיךָ y el sentido de deleite. Sin embargo, «pero» no está expresado en el texto hebreo; procede de la traducción inglesa auditada y convierte una yuxtaposición contrastiva en una oposición explícita.'
