lexical_decisions:
- source_word: צַר
  english_pob_choice: trouble
  chosen_spanish: angustia
  alternatives_spanish:
  - aflicción
  - tribulación
  - apuro
  lexicon: HALOT
  rationale: El hebreo expresa estrechez, aprieto o aflicción. «Angustia» comunica bien la presión y el padecimiento del contexto, y funciona de manera natural junto con el segundo sustantivo.
- source_word: וּמָצ֥וֹק
  english_pob_choice: anguish
  chosen_spanish: aflicción
  alternatives_spanish:
  - angustia
  - opresión
  - tribulación
  lexicon: HALOT
  rationale: Para evitar una repetición rígida, se distingue el segundo término con «aflicción», manteniendo el paralelismo semántico de dos términos de dificultad intensa sin sobreinterpretarlos.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato
  - preceptos
  - órdenes
  lexicon: HALOT
  rationale: El sustantivo plural se refiere a los mandamientos autoritativos de Dios. «Mandamientos» conserva el valor normativo y sigue de cerca la decisión auditada del inglés POB.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_spanish: mi deleite
  alternatives_spanish:
  - mi gozo
  - mi placer
  - mi regocijo
  lexicon: HALOT
  rationale: El término expresa aquello en lo que uno se deleita o se complace. «Mi deleite» es natural en español y mantiene el contraste entre la aflicción presente y la alegría en la ley divina.
theological_decisions:
- issue: Contraste entre la aflicción humana y la bondad normativa de la ley divina
  english_pob_reading: Trouble and anguish have found me, but your commandments are my delight.
  chosen_spanish_reading: La angustia y la aflicción me han hallado, pero tus mandamientos son mi deleite.
  alternative_spanish_readings:
  - La angustia y la opresión me han hallado, pero tus mandamientos son mi deleite.
  - La tribulación y la angustia me han hallado, pero tus mandamientos son mi deleite.
  rationale: Se conserva el paralelismo del hebreo y el giro antropomórfico «me han hallado», sin suavizar la tensión entre la experiencia adversa y la obediencia gozosa.
  doctrine_reference: Salmos 119:143; cf. Salmos 119 en su énfasis sobre la Torah como objeto de amor y deleite.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; se traduce directamente desde el texto hebreo con apoyo en la decisión léxica auditada del inglés POB.
  spanish_consistency_notes:
  - Se mantiene un registro bíblico moderno y digno, evitando calcos innecesarios.
  - «Mandamientos» se conserva como término técnico coherente con la serie de Salmo 119.
  - La duplicación semántica de los dos primeros miembros se resuelve con dos sustantivos cercanos pero no idénticos para reflejar el paralelismo hebreo sin rigidizar el español.
