translation:
  language: es
  text: Tus testimonios son justos para siempre; dame entendimiento[a], para que yo viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «dame entendimiento» traduce el causativo hebreo de manera natural; también puede entenderse como «hazme entender».
    reason: alternative_reading
lexical_decisions:
- source_word: צֶ֖דֶק
  english_pob_choice: righteous / righteous forever
  chosen_spanish: justos
  alternatives_spanish:
  - rectos
  - justos y rectos
  lexicon: HALOT
  rationale: צֶדֶק expresa cualidad de justicia/rectitud. En español, «justos» comunica bien la cualidad moral y jurídica que el POB inglés condensa en righteous, sin perder naturalidad en una frase predicativa breve.
- source_word: עֵדְוֺתֶ֥י/ךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - mandatos
  - testimonios del pacto
  lexicon: HALOT
  rationale: Se mantiene el término distintivo «testimonios» para conservar la serie léxica de los sinónimos de la Torá y reflejar la decisión auditada del POB inglés.
- source_word: לְעוֹלָ֗ם
  english_pob_choice: forever
  chosen_spanish: para siempre
  alternatives_spanish:
  - eternamente
  - por siempre
  lexicon: BDB
  rationale: La expresión temporal idiomática en español más directa y fiel es «para siempre», que preserva el alcance durativo sin sobreactuar el matiz filosófico de eternidad.
- source_word: הֲבִינֵ֥נִי
  english_pob_choice: give me understanding
  chosen_spanish: dame entendimiento
  alternatives_spanish:
  - hazme entender
  - concédeme entendimiento
  lexicon: BDB
  rationale: El verbo causativo pide una petición de comprensión; «dame entendimiento» es natural en español bíblico contemporáneo y conserva la súplica directa del hebreo.
- source_word: וְאֶחְיֶֽה
  english_pob_choice: that I may live
  chosen_spanish: para que yo viva
  alternatives_spanish:
  - y viviré
  - y vivir pueda
  lexicon: BDB
  rationale: La cláusula final expresa resultado o propósito. «Para que yo viva» reproduce el valor final del hebreo y mantiene el vínculo entre entendimiento y vida.
theological_decisions:
- issue: La relación entre la justicia de los testimonios de Dios y la vida del orante
  english_pob_reading: Your testimonies are righteous forever; give me understanding, that I may live.
  chosen_spanish_reading: Tus testimonios son justos para siempre; dame entendimiento, para que yo viva.
  alternative_spanish_readings:
  - Tus testimonios son rectos para siempre; dame entendimiento, para que yo viva.
  - Tus testimonios son justicia para siempre; dame entendimiento, para que yo viva.
  rationale: El versículo une el carácter permanente de los testimonios divinos con la petición de discernimiento que conduce a la vida. «Justos» conserva la afirmación ética sobre los testimonios sin convertirla en una abstracción demasiado general como «justicia».
  doctrine_reference: Salmo 119:144; sabiduría/vida en relación con la instrucción divina
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el contexto inglés; se ha seguido directamente el texto hebreo con la decisión léxica auditada para עֵדְוֹתֶיךָ como «testimonios».
  spanish_consistency_notes:
  - Se conserva «testimonios» para עֵדְוֺתֶיךָ, en línea con el POB inglés.
  - Se usa «Yahvé» no porque aparezca aquí, sino como política general del proyecto; este versículo no contiene el nombre divino explícito.
  - Se evitó «SEÑOR» y también «Cristo», ya que no corresponden al texto.
  - La puntuación refleja el paralelismo y el valor final de la última cláusula.
