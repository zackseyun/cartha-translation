translation:
  language: es
  text: Aborrezco a los de doble ánimo[a], pero amo tu ley.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 113–120 comienzan con samekh (ס), la decimoquinta letra del alfabeto; continúa el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: סֵעֲפִים
  english_pob_choice: the double-minded
  chosen_spanish: los de doble ánimo
  alternatives_spanish:
  - los inconstantes
  - los divididos de corazón
  lexicon: HALOT
  rationale: El hebreo alude a personas divididas, torcidas o vacilantes en su lealtad. «De doble ánimo» comunica bien esa inestabilidad interior en español bíblico contemporáneo sin forzar un término técnico ajeno al registro del salmo. Se conserva la tensión moral y relacional del original.
- source_word: תוֹרָה
  english_pob_choice: law
  chosen_spanish: ley
  alternatives_spanish:
  - instrucción
  - enseñanza
  lexicon: HALOT
  rationale: La POB inglesa mantiene «law» como glosa estable de תּוֹרָה en este salmo. En español, «ley» es el equivalente más asentado y reproduce esa consistencia terminológica. «Instrucción» y «enseñanza» quedan como alternativas semánticamente válidas, pero menos uniformes para esta serie de términos.
theological_decisions:
- issue: Tensión entre repudio moral y amor pactual en el paralelismo
  english_pob_reading: I hate the double-minded, but I love your law.
  chosen_spanish_reading: Aborrezco a los de doble ánimo, pero amo tu ley.
  alternative_spanish_readings:
  - Odio a los de doble ánimo, pero amo tu ley.
  - Aborrezco a los inconstantes, pero amo tu ley.
  rationale: 'Se conserva el contraste fuerte del paralelismo hebreo: rechazo de la doblez interior frente a amor por la revelación de Dios. «Aborrezco» refleja bien la fuerza de שָׂנֵאתִי sin aplanarla a simple disgusto, mientras «amo» mantiene el vínculo positivo y obediencial con la ley divina.'
  doctrine_reference: Salmo 119:113; cf. Salmo 1:1; Santiago 1:8
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; esta versión sigue la lectura inglesa auditada y el hebreo directamente, sin variantes textuales relevantes en el dossier.
  spanish_consistency_notes:
  - Se mantiene «ley» para תּוֹרָה, en continuidad con la terminología del salmo.
  - Se usa «Yahvé» en el proyecto, pero en este versículo no aparece el tetragrámaton; el posesivo «tu» conserva la referencia divina implícita del hebreo.
  - «De doble ánimo» traduce la idea de duplicidad/interior dividido sin introducir un tecnicismo ajeno al español bíblico lector-friendly.
