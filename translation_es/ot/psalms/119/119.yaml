translation:
  language: es
  text: Tú apartas como escoria a todos los malvados de la tierra; por eso amo tus testimonios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סִגִים
  english_pob_choice: dross
  chosen_spanish: escoria
  alternatives_spanish:
  - desecho
  - residuo
  - impureza
  lexicon: BDB / HALOT
  rationale: El término hebreo designa material metálico impuro o residuo separado por refinación. "Escoria" comunica bien esa imagen en español y mantiene el tono figurado del hebreo y del POB inglés.
- source_word: הִשְׁבַּתָּ
  english_pob_choice: You discard
  chosen_spanish: apartas
  alternatives_spanish:
  - eliminas
  - haces cesar
  - rechazas
  lexicon: BDB / HALOT
  rationale: La forma verbal puede expresar hacer cesar o quitar de en medio. "Apartas" preserva la acción de remover/separar sin forzar un sentido más técnico que el hebreo no exige aquí, y encaja con la comparación metalúrgica del verso.
- source_word: כָל רִשְׁעֵי אָרֶץ
  english_pob_choice: all the wicked of the earth
  chosen_spanish: a todos los malvados de la tierra
  alternatives_spanish:
  - a todos los impíos de la tierra
  - a todos los perversos de la tierra
  lexicon: BDB / HALOT
  rationale: '"Malvados" comunica la fuerza moral de רִשְׁעֵי sin introducir un matiz excesivamente técnico. "De la tierra" mantiene el alcance universal del hebreo.'
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - testimonios del pacto
  - mandatos
  lexicon: HALOT
  rationale: Se conserva "testimonios" siguiendo la decisión auditada del POB inglés y la consistencia con עֵדוּת en el salmo. En español suena natural y no requiere sustitución tradicional por "leyes" o "estatutos".
theological_decisions:
- issue: La imagen de juicio/refinamiento en relación con los malvados
  english_pob_reading: You discard all the wicked of the earth like dross
  chosen_spanish_reading: Tú apartas como escoria a todos los malvados de la tierra
  alternative_spanish_readings:
  - Tú eliminas como escoria a todos los malvados de la tierra
  - Tú haces cesar como escoria a todos los malvados de la tierra
  rationale: El verso presenta a Dios actuando sobre los malvados con una imagen de refinación y descarte. "Apartas como escoria" conserva tanto la acción divina como la metáfora sin suavizar el juicio implícito ni precisar más de lo que el hebreo dice.
  doctrine_reference: Juicio divino y santidad de Dios en el marco sapiencial-salomónico del Salmo 119
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés; esta propuesta sigue de cerca la lectura auditada del POB y conserva la metáfora de 'dross/escoria' y la elección estable de 'testimonios'.
  spanish_consistency_notes:
  - Se mantiene el tratamiento en segunda persona singular para Yahvé, coherente con el hebreo.
  - '"Testimonios" se conserva como término técnico consistente con el POB inglés en el Salmo 119.'
  - No se introduce 'SEÑOR' ni otra máscara para el nombre divino, porque este versículo no contiene el Tetragrámaton explícito pero sí habla directamente de Dios en segunda persona.
