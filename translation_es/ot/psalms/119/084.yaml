  glossary_alignment: «Siervo» sigue la terminología establecida para עַבְדֶּךָ. «Juicio» es una buena
    opción contextual para מִשְׁפָּט como acto judicial, frente a «justicia», que podría resultar más
    abstracto.
  issues:
