translation:
  language: es
  text: ¿Cuántos son los días de tu siervo?[a] ¿Cuándo ejecutarás juicio sobre los que me persiguen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «¿Cuántos son los días de tu siervo?». La pregunta puede oírse como una expresión de urgencia ante la brevedad de la vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה / יְמֵי
  english_pob_choice: How many are the days
  chosen_spanish: ¿Cuántos son los días
  alternatives_spanish:
  - ¿Cuántos días son
  - ¿Cuántos son los días de
  lexicon: HALOT
  rationale: La pregunta hebrea expresa asombro ante la duración limitada de la vida; en español, «¿Cuántos son los días?» conserva la estructura interrogativa y la idea de cantidad temporal sin forzar un calco rígido.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: HALOT
  rationale: «Siervo» es la mejor equivalencia reverente y natural en español para el sujeto de dependencia fiel ante Dios. «Esclavo» preservaría una dureza de estatus, pero no es el término lector-público preferido en la línea terminológica del proyecto.
- source_word: מִשְׁפָּט
  english_pob_choice: judgment
  chosen_spanish: juicio
  alternatives_spanish:
  - justicia
  - sentencia
  - veredicto
  lexicon: HALOT
  rationale: 'El contexto es judicial y punitivo: el salmista pide a Dios un acto de juicio contra sus perseguidores. «Juicio» comunica mejor esa acción que «justicia», que en español puede sonar más abstracta o general. La frase «ejecutarás juicio» conserva el carácter forense del hebreo.'
- source_word: בְּרֹדְפַי
  english_pob_choice: on those who persecute me
  chosen_spanish: sobre los que me persiguen
  alternatives_spanish:
  - contra los que me persiguen
  - sobre mis perseguidores
  lexicon: HALOT
  rationale: El participio hebreo describe a los que persiguen activamente al hablante. «Los que me persiguen» mantiene la relación verbal y evita introducir una nominalización más dura o menos directa.
theological_decisions:
- issue: Petición de juicio divino contra enemigos
  english_pob_reading: When will you bring judgment on those who persecute me?
  chosen_spanish_reading: ¿Cuándo ejecutarás juicio sobre los que me persiguen?
  alternative_spanish_readings:
  - ¿Cuándo harás justicia contra los que me persiguen?
  - ¿Cuándo pronunciarás sentencia sobre los que me persiguen?
  rationale: La línea no pide venganza privada, sino la intervención judicial de Dios. «Ejecutarás juicio» mantiene la tensión bíblica entre súplica por vindicación y apelación al justo gobierno divino, sin suavizar el peso punitivo del texto.
  doctrine_reference: Salmo 119:84; cf. la temática de vindicación judicial divina en los Salmos
- issue: Referencia a la vida breve del siervo
  english_pob_reading: How many are the days of your servant?
  chosen_spanish_reading: ¿Cuántos son los días de tu siervo?
  alternative_spanish_readings:
  - ¿Cuántos días le quedan a tu siervo?
  - ¿Cuántos son los días del siervo tuyo?
  rationale: La pregunta hebrea es retórica y lamentativa; la traducción evita precisar más de lo que el texto dice sobre la expectativa de vida o la urgencia temporal. «Tu siervo» conserva la relación de pertenencia y dependencia ante Dios.
  doctrine_reference: Salmo 119:84; cf. el lamento por la brevedad de la vida en la literatura sapiencial y salmódica
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de auditoría inglés; la versión española sigue de cerca el hebreo y la lectura inglesa auditada, conservando el paralelismo interrogativo y el tono judicial del segundo hemistiquio.
  spanish_consistency_notes:
  - Se ha mantenido «siervo» como término estándar del proyecto para עַבְדֶּךָ.
  - Se ha usado «juicio» para מִשְׁפָּט en sentido forense, coherente con la decisión inglesa auditada.
  - La puntuación reproduce el paralelismo interrogativo del hebreo con dos preguntas consecutivas.
