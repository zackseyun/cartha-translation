translation:
  language: es
  text: ¿Cómo podrá el joven limpiar su camino? Guardándolo conforme a tu palabra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 9–16 comienzan con beth (ב), la segunda letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: נַּעַר
  english_pob_choice: young man
  chosen_spanish: joven
  alternatives_spanish:
  - muchacho
  - joven hombre
  lexicon: HALOT
  rationale: El hebreo נַעַר puede abarcar un varón joven, un muchacho o un servidor según el contexto. Aquí la pregunta es general y sapiencial; 'joven' comunica el rango etario sin cargar el texto con una precisión social que el hebreo no obliga.
- source_word: יְזַכֶּה
  english_pob_choice: keep pure
  chosen_spanish: limpiar
  alternatives_spanish:
  - purificar
  - mantener puro
  lexicon: HALOT
  rationale: El verbo hiphil de זכה puede expresar hacer limpio o puro. En español, 'limpiar' conserva la imagen verbal concreta del hebreo y permite que el complemento 'su camino' conserve la metáfora ética del andar. 'Purificar' es posible, pero suena más abstracto y menos transparente en este contexto.
- source_word: אֶת אָרְחוֹ
  english_pob_choice: his way
  chosen_spanish: su camino
  alternatives_spanish:
  - su senda
  - su andar
  lexicon: HALOT
  rationale: אָרַח/אֹרַח designa camino, senda o manera de vivir. 'Camino' es la equivalencia más natural y ampliamente comprensible en español, manteniendo el sentido moral y conductual del verso.
- source_word: לִשְׁמֹר
  english_pob_choice: by guarding it
  chosen_spanish: Guardándolo
  alternatives_spanish:
  - guardándolo
  - custodiándolo
  lexicon: BDB/HALOT
  rationale: El infinitivo לִשְׁמֹר expresa el medio por el cual se preserva limpio el camino. 'Guardándolo' reproduce bien el valor instrumental y evita una paráfrasis excesiva.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: דָּבָר se entiende aquí como la palabra hablada/revelada de Dios. 'Conforme a tu palabra' es una forma natural en español bíblico moderno y mantiene la norma externa implícita en el hebreo.
theological_decisions:
- issue: Sentido moral de 'purificar/limpiar su camino'
  english_pob_reading: keep his way pure
  chosen_spanish_reading: limpiar su camino
  alternative_spanish_readings:
  - purificar su camino
  - mantener puro su camino
  rationale: No hay necesidad de introducir una lectura doctrinal más específica; el verso pregunta cómo puede un joven vivir de manera limpia o irreprochable. 'Limpiar' conserva la imagen y deja abierta la aplicación moral y espiritual del texto.
  doctrine_reference: Santificación práctica / vida íntegra
- issue: Función normativa de la palabra divina
  english_pob_reading: according to your word
  chosen_spanish_reading: conforme a tu palabra
  alternative_spanish_readings:
  - según tu palabra
  - por tu palabra
  rationale: El hebreo presenta la palabra divina como norma reguladora del camino. 'Conforme a' expresa adecuadamente esa relación normativa sin convertirla en una explicación teológica añadida.
  doctrine_reference: Autoridad de la revelación divina
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; esta propuesta sigue directamente el hebreo masorético y la decisión léxica inglesa ya auditada.
  spanish_consistency_notes:
  - Se conserva el estilo de pregunta sapiencial breve y directo.
  - '''Palabra'' se mantiene para דָּבָר, en coherencia con la decisión inglesa auditada.'
  - Se evita 'SEÑOR' porque el verso hebreo usa un sufijo de segunda persona ('tu'), no el nombre divino explícito.
