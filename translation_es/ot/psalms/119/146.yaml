lexical_decisions:
- source_word: קְרָאתִי/ךָ
  english_pob_choice: I call to you
  chosen_spanish: Te invoco
  alternatives_spanish:
  - Te llamo
  - Clamo a ti
  lexicon: HALOT
  rationale: El hebreo expresa una llamada dirigida a Yahvé; en español, «invoco» conserva mejor el matiz de apelación reverente y dirigida a Dios que un simple «llamo». «Clamo a ti» sería posible, pero añade una nota más emotiva no obligatoria en el hebreo.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_spanish: sálvame
  alternatives_spanish:
  - líbrame
  - rescátame
  lexicon: HALOT
  rationale: El verbo hiphil de יָשַׁע pide una acción salvadora directa. «Sálvame» es la correspondencia natural y fiel en español; «líbrame» o «rescátame» serían alternativas contextuales, pero menos directas aquí.
- source_word: וְאֶשְׁמְרָה
  english_pob_choice: that I may keep
  chosen_spanish: para que guarde
  alternatives_spanish:
  - y guardaré
  - y así guardar
  - a fin de que guarde
  lexicon: HALOT
  rationale: La forma cohortativa expresa propósito o resolución. En español, «para que guarde» comunica bien la finalidad sin forzar un futuro simple o una promesa independiente.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus mandatos del pacto
  lexicon: HALOT
  rationale: Se mantiene la decisión auditada del POB inglés de traducir עֵדוֹת/עֵדֹת como «testimonios». En español, «testimonios» conserva la terminología del salmo y el sentido de las declaraciones testimoniales de Yahvé.
theological_decisions:
- issue: La dirección de la súplica se dirige a Dios con el nombre divino
  english_pob_reading: I call to you
  chosen_spanish_reading: Te invoco
  alternative_spanish_readings:
  - Te llamo
  - Clamo a ti
  rationale: Aunque el versículo no contiene el Tetragrámaton explícito, el interlocutor implícito es Yahvé en el contexto del Salmo 119. «Te invoco» mantiene el registro devocional apropiado sin introducir una fórmula más interpretativa.
  doctrine_reference: Salmo 119:146; invocación dirigida a Yahvé en el contexto del salterio
- issue: La relación entre salvación y obediencia
  english_pob_reading: save me, that I may keep your testimonies
  chosen_spanish_reading: sálvame, para que guarde tus testimonios
  alternative_spanish_readings:
  - sálvame, y guardaré tus testimonios
  - sálvame, a fin de que guarde tus testimonios
  rationale: El hebreo une la petición de salvación con el propósito de obedecer. La traducción conserva esa relación sin convertirla en mérito humano; la salvación solicitada conduce a la fidelidad al pacto.
  doctrine_reference: Relación entre gracia salvadora y obediencia en el Salterio
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción sigue directamente el texto hebreo con la decisión lexical inglesa ya auditada para עֵדֹתֶיךָ = testimonies.
  spanish_consistency_notes:
  - Se mantuvo «testimonios» para עֵדֹתֶיךָ, coherente con la decisión inglesa auditada para עֵדוֹת/עֵדוּת en el Salmo 119.
  - 'Se usó un registro reverente pero natural en español: «Te invoco; sálvame».'
  - No se añadió nombre divino explícito porque el verso hebreo no lo expresa de manera directa; el contexto del salmo ya lo presupone.
