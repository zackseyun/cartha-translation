translation:
  language: es
  text: Vuélvete a mí y ten misericordia de mí, como es tu manera con los que aman tu nombre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  english_pob_choice: Turn to me
  chosen_spanish: Vuélvete a mí
  alternatives_spanish:
  - Vuélvete hacia mí
  - Mírame
  lexicon: פּנה
  rationale: El hebreo pide una acción de orientación favorable hacia el hablante. «Vuélvete a mí» conserva esa dirección personal sin introducir una imagen demasiado literal de giro físico ni perder el matiz relacional.
- source_word: וְחָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_spanish: ten misericordia de mí
  alternatives_spanish:
  - sé gracioso conmigo
  - muéstrame gracia
  lexicon: חנן
  rationale: Aunque «gracia» es posible, en español bíblico «ten misericordia de mí» comunica con claridad la petición de favor inmerecido. Mantiene un registro digno y devocional sin sonar mecánico.
- source_word: כְּמִשְׁפָּט
  english_pob_choice: as is your way
  chosen_spanish: como es tu manera
  alternatives_spanish:
  - como es tu justicia
  - como es tu costumbre
  lexicon: מִשְׁפָּט
  rationale: 'Se sigue la lectura auditada de sentido judicial-customario: no «ordenanzas», sino la manera habitual y recta de actuar de Yahvé. «Manera» preserva esa idea en español natural; se evita «justicia» aquí porque podría estrechar indebidamente el matiz a una sola noción abstracta.'
- source_word: לְאֹהֲבֵי שְׁמֶךָ
  english_pob_choice: with those who love your name
  chosen_spanish: con los que aman tu nombre
  alternatives_spanish:
  - para los que aman tu nombre
  - a favor de los que aman tu nombre
  lexicon: אהב / שם
  rationale: La frase se conserva de forma directa porque el hebreo expresa la relación de Yahvé con quienes lo aman. «Tu nombre» mantiene el valor reverente del nombre divino sin sustituirlo por un título.
theological_decisions:
- issue: Relación entre “gracia” y “misericordia” en la súplica
  english_pob_reading: be gracious to me
  chosen_spanish_reading: ten misericordia de mí
  alternative_spanish_readings:
  - sé benigno conmigo
  - muéstrame gracia
  rationale: No hay una tensión doctrinal que resolver, pero sí una decisión de estilo teológico. En español, «misericordia» comunica con mayor fuerza la petición de favor inmerecido y evita una expresión menos idiomática. No se pierde el contenido de gracia, que queda implicado en la petición.
  doctrine_reference: Salmo 119:132; uso devocional del lenguaje de gracia en el AT
- issue: Sentido de כְּמִשְׁפָּט
  english_pob_reading: as is your way
  chosen_spanish_reading: como es tu manera
  alternative_spanish_readings:
  - como es tu justicia
  - como es tu costumbre
  rationale: El POB inglés documenta la opción de sentido ‘way’ a partir de מִשְׁפָּט en su valor de práctica habitual o patrón justo. En español, «manera» conserva esa ambigüedad saludable entre norma y costumbre sin convertir el versículo en una declaración técnica sobre decretos.
  doctrine_reference: HALOT sobre מִשְׁפָּט; Salmo 119:132
translation_notes:
  revision_awareness: Se siguió el dato hebreo y la decisión auditada del POB inglés para כְּמִשְׁפָּט, evitando una traducción más rígida de ‘ordainances’ o ‘juicios’. No hubo revisiones previas aplicadas en el paquete. Se optó por un español natural y reverente con equivalencia óptima.
  spanish_consistency_notes:
  - Se mantiene «tu nombre» como referencia reverente al nombre divino, sin explicitar Yahvé en este versículo porque el hebreo no lo contiene.
  - Se usa «ten misericordia de mí» como equivalencia devocional estable para la petición de חנן en español.
  - «Manera» busca preservar el matiz de acción habitual/recta de כְּמִשְׁפָּט sin cargar el verso con terminología legal excesiva.
