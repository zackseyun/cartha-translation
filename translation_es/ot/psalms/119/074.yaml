translation:
  language: es
  text: Los que te temen me verán y se alegrarán, porque he esperado en tu palabra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרֵאֶיךָ
  english_pob_choice: Those who fear you
  chosen_spanish: Los que te temen
  alternatives_spanish:
  - Los que te reverencian
  - Tus temerosos
  lexicon: HALOT
  rationale: El hebreo expresa un grupo caracterizado por temor reverente hacia Dios. 'Los que te temen' conserva el paralelismo y la fórmula bíblica natural en español sin volverlo mecánico ni demasiado interpretativo.
- source_word: יִרְאוּ־נִי
  english_pob_choice: shall see me
  chosen_spanish: me verán
  alternatives_spanish:
  - verán me
  - me mirarán
  lexicon: HALOT
  rationale: El verbo es una observación visual simple. 'Me verán' reproduce el sentido directo y mantiene el paralelismo con 'se alegrarán'.
- source_word: וְיִשְׂמָחוּ
  english_pob_choice: and rejoice
  chosen_spanish: y se alegrarán
  alternatives_spanish:
  - y se gozarán
  - y gozarán
  lexicon: HALOT
  rationale: El verbo comunica alegría expresada; 'se alegrarán' es idiomático y fiel al valor del hebreo, preservando un registro sobrio y claro.
- source_word: כִּי
  english_pob_choice: because
  chosen_spanish: porque
  alternatives_spanish:
  - pues
  - ya que
  lexicon: HALOT
  rationale: Aquí introduce la razón de la alegría de quienes temen a Dios. 'Porque' es la equivalencia más natural y transparente en español.
- source_word: לִדְבָרְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu palabra dicha
  - tu dicho
  lexicon: HALOT
  rationale: La decisión inglesa ya documenta דָּבָר como 'word'. En español, 'tu palabra' conserva el contraste con otras posibles traducciones de דָּבָר ('cosa', 'asunto') y encaja con el uso bíblico de la promesa divina.
- source_word: יִחָלְתִּי
  english_pob_choice: I have hoped
  chosen_spanish: he esperado
  alternatives_spanish:
  - he aguardado
  - he puesto mi esperanza
  lexicon: BDB
  rationale: El verbo puede expresar esperar con esperanza confiada. 'He esperado' mantiene la ambigüedad productiva entre espera y esperanza, sin imponer una paráfrasis teológica más fuerte que el hebreo inmediato.
theological_decisions:
- issue: Relación entre temor de Dios y gozo al ver al salmista
  english_pob_reading: Those who fear you shall see me and rejoice
  chosen_spanish_reading: Los que te temen me verán y se alegrarán
  alternative_spanish_readings:
  - Tus reverentes me verán y se alegrarán
  - Los que te reverencian me verán y se alegrarán
  rationale: El versículo presenta una afirmación poética de que los fieles reconocerán al salmista y hallarán alegría. No se amplía hacia una lectura cristológica o eclesial que el texto no exige en este contexto.
  doctrine_reference: Salmo 119:74; tema bíblico de comunión entre los que temen a Yahvé y se alegran en su obra
- issue: Alcance de דָּבָר como palabra prometida o declaración divina
  english_pob_reading: your word
  chosen_spanish_reading: tu palabra
  alternative_spanish_readings:
  - tu promesa
  - tu dicho
  rationale: El contexto inmediato no obliga a restringir דָּבָר a 'promesa'. 'Tu palabra' conserva la amplitud del término y evita cerrar el sentido donde el hebreo permite una referencia general a la palabra de Dios.
  doctrine_reference: Salmo 119:74; vocabulario de la revelación divina en el Antiguo Testamento
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete de origen; la redacción sigue de cerca el hebreo y la decisión inglesa auditada, manteniendo el paralelismo poético sin introducir variantes textuales.
  spanish_consistency_notes:
  - Se usa 'te temen' para יְרֵאֶיךָ conforme al lenguaje bíblico reverente habitual en español.
  - Se conserva 'tu palabra' como traducción principal de לִדְבָרְךָ, en coherencia con la decisión inglesa auditada.
  - Se mantiene un registro poético sobrio y natural para un salmo, evitando arcaísmos innecesarios.
