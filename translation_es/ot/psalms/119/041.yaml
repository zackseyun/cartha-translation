translation:
  language: es
  text: Que[a] tu misericordia venga a mí, Yahvé; tu salvación, conforme a tu promesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 41–48 comienzan todos con ו (waw), la sexta letra del alfabeto, continuando el acróstico que comenzó en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: חֲסָדֶךָ
  english_pob_choice: your steadfast love
  chosen_spanish: tu misericordia
  alternatives_spanish:
  - tu amor constante
  - tu amor fiel
  - tu lealtad amorosa
  lexicon: HALOT
  rationale: חֶסֶד en los Salmos suele abarcar misericordia, fidelidad de pacto y amor leal. En español, 'misericordia' comunica bien el favor activo que viene de Dios sin sonar forzado, aunque no agota toda la riqueza del término.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se conserva el nombre divino como nombre propio, conforme al criterio del proyecto, en vez de enmascararlo con un título. 'Yahvé' es la forma española adoptada para el Tetragrámaton.
- source_word: תְּשׁוּעָתְךָ
  english_pob_choice: your salvation
  chosen_spanish: tu salvación
  alternatives_spanish:
  - tu rescate
  - tu liberación
  lexicon: HALOT
  rationale: La forma nominal indica la acción salvífica de Dios. 'Salvación' mantiene la amplitud del hebreo y funciona de manera natural en español bíblico.
- source_word: כְּאִמְרָתֶךָ
  english_pob_choice: according to your promise
  chosen_spanish: conforme a tu promesa
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu dicho
  lexicon: HALOT
  rationale: Siguiendo la decisión auditada del inglés POB, אִמְרָה se entiende aquí como la declaración comprometida de Dios. 'Promesa' expresa esa fuerza comprometida mejor que 'palabra' o 'dicho' en este contexto.
theological_decisions:
- issue: Cómo renderizar חֶסֶד en un contexto de pacto y apelación a Dios
  english_pob_reading: steadfast love
  chosen_spanish_reading: misericordia
  alternative_spanish_readings:
  - amor constante
  - amor fiel
  - lealtad amorosa
  rationale: No se reduce el término a una sola dimensión. 'Misericordia' preserva el favor divino implícito en la petición y evita introducir una formulación más interpretativa que pudiera sonar demasiado técnica o poco idiomática.
  doctrine_reference: Salmos 136; Éxodo 34:6-7
translation_notes:
  revision_awareness: 'Se siguió la lectura del inglés POB: ''steadfast love'' -> ''misericordia'' y ''according to your promise'' -> ''conforme a tu promesa'', manteniendo el nombre divino como Yahvé/Yahvé. No se detectaron revisiones aplicadas en el paquete fuente.'
  spanish_consistency_notes:
  - Se mantuvo 'Yahvé' para el Tetragrámaton de forma consistente con el proyecto.
  - '''Promesa'' se reservó para אִמְרָה en este versículo, en línea con la decisión auditada del POB inglés.'
  - La puntuación refleja una invocación directa con pausa fuerte antes de la segunda cláusula.
