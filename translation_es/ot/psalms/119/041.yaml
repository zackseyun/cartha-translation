    issue: La nota acróstica omite que los versículos 41–48, no solo este versículo, comienzan con waw.
    rationale: La nota inglesa auditada especifica el alcance de toda la estrofa. Además, dado que la nota explica la waw inicial, el marcador debe situarse junto a «Que», que representa esa partícula de apertura.
  revised_spanish_text: Que[a] tu misericordia venga a mí, Yahvé; tu salvación, conforme a tu promesa.
