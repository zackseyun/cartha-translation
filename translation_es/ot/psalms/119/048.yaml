translation:
  language: es
  text: Alzo mis manos hacia tus mandamientos, que amo, y medito en tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato(s)
  - preceptos
  - órdenes
  lexicon: HALOT
  rationale: מִצְוָה / מִצְוֺת designa mandatos autoritativos de Dios. En español, «mandamientos» conserva bien la fuerza normativa y mantiene la consistencia con el uso del salmo, sin volverlo demasiado técnico.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: חֹק / חֻקִּים refiere disposiciones fijadas o prescritas. «Estatutos» reproduce esa idea de norma establecida y resulta natural en español bíblico contemporáneo.
- source_word: אֶשָּׂא כַפַּי
  english_pob_choice: I lift up my hands
  chosen_spanish: Alzo mis manos
  alternatives_spanish:
  - Levanto mis manos
  - Elevo mis manos
  lexicon: BDB
  rationale: El hebreo expresa un gesto corporal de elevación de las manos. «Alzo mis manos» es idiomático en español y conserva el sentido físico y devocional sin añadir matices no presentes en el texto.
- source_word: אָשִׂיחָה
  english_pob_choice: I meditate
  chosen_spanish: medito
  alternatives_spanish:
  - reflexiono
  - considero
  - medito en voz baja
  lexicon: HALOT
  rationale: El verbo puede abarcar meditar, conversar interiormente o musitar. Dado el paralelismo con la Torá y el contexto del salmo, «medito» comunica bien la actividad contemplativa sin perder la posible densidad del término.
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente. La versión española sigue de cerca el texto hebreo y el inglés POB, manteniendo el paralelismo poético y la terminología normativa.
  spanish_consistency_notes:
  - Se mantuvo el tuteo reverente («tus») coherente con el hebreo de segunda persona singular.
  - Se evitó «SEÑOR» porque el versículo no contiene el nombre divino explícito.
  - «Mandamientos» y «estatutos» se conservaron para reflejar la terminología estable del salmo.
