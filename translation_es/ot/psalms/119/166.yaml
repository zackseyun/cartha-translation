  text: Espero tu salvación, Yahvé, y cumplo tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂבַּ֣רְתִּי
  english_pob_choice: I hope for
  chosen_spanish: Espero
  alternatives_spanish:
  - aguardo
  - anhelo
  - espero con confianza
  lexicon: HALOT
  rationale: El verbo hebreo expresa esperar con expectativa/confianza. En español, «espero» comunica de forma natural esa espera activa sin añadir matices no sustentados por el texto.
- source_word: לִֽ/ישׁוּעָתְ/ךָ֣
  english_pob_choice: your salvation
  chosen_spanish: tu salvación
  alternatives_spanish:
  - tu liberación
  - tu rescate
  lexicon: HALOT
  rationale: ישועה puede referirse a salvación, rescate o liberación. «Salvación» conserva la amplitud del término y coincide con la decisión inglesa auditada.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino
  rationale: Se conserva el nombre propio del pacto en español como «Yahvé», siguiendo la pauta del proyecto de no ocultar el Tetragrámaton bajo una convención de título.
- source_word: וּֽ/מִצְוֺתֶ֥י/ךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato
  - preceptos
  - ordenanzas
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת designa mandamientos autoritativos de Dios. «Mandamientos» es la forma más clara y natural en español para este plural, manteniendo la consistencia terminológica del salmo.
- source_word: עָשִֽׂיתִי
  english_pob_choice: I do
  chosen_spanish: cumplo
  alternatives_spanish:
  - hago
  - obedezco
  - practico
  lexicon: HALOT
  rationale: En el paralelismo del versículo, el verbo no busca sólo indicar ejecución mecánica sino obediencia práctica a los mandamientos. «Cumplo» expresa bien esa obediencia sostenida en español.
theological_decisions:
- issue: Relación entre espera y obediencia en un solo versículo
  english_pob_reading: I hope for your salvation, Yahweh, and I do your commandments.
  chosen_spanish_reading: Espero tu salvación, Yahvé, y cumplo tus mandamientos.
  alternative_spanish_readings:
  - Espero tu salvación, Yahvé, y hago tus mandamientos.
  - Aguardo tu salvación, Yahvé, y obedezco tus mandamientos.
  rationale: La segunda cola hebrea enfatiza una respuesta obediente al esperar la intervención salvadora de Yahvé. «Cumplo» mantiene la acción obediente sin introducir una rigidez excesiva ni restringir indebidamente el sentido del verbo.
  doctrine_reference: Salmo 119:166; obediencia pactual como fruto de la esperanza en Yahvé.
translation_notes:
  revision_awareness: La traducción sigue el texto masorético de WLC y coincide con la lectura auditada en inglés; no se documentan revisiones textuales ni notas variantes en el expediente fuente.
  spanish_consistency_notes:
  - Se mantiene «Yahvé» para יְהוָה conforme a la terminología del proyecto.
  - Se conserva «mandamientos» para מִצְוֺת en coherencia con el tratamiento del Salmo 119.
  - El español evita calcos como «hago tus mandamientos» cuando «cumplo» comunica mejor la obediencia implícita en el paralelismo.
