  glossary_alignment: «Yahvé» aplica correctamente la convención del proyecto para יהוה. «Salvación» preserva la amplitud de יְשׁוּעָה, y «mandamientos» representa adecuadamente מִצְוֺת como los mandatos autoritativos de Dios. «Cumplo» es una traducción española idiomática y fiel de עשיתי en relación con mandamientos.
