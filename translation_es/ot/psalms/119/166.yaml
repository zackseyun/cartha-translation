  source_alignment_summary: 'El texto conserva las dos afirmaciones del hebreo: la esperanza en la salvación de Yahvé y la observancia de sus mandamientos. «Espero» y «cumplo» siguen la resolución aspectual presente adoptada explícitamente por la POB inglesa («I hope» / «I do») y expresan con naturalidad el valor confesional del versículo.'
