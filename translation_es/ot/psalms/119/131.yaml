translation:
  language: es
  text: Abro mi boca y respiro agitadamente, porque anhelo tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָעַרְתִּי
  english_pob_choice: I open my mouth
  chosen_spanish: Abro mi boca
  alternatives_spanish:
  - abro la boca
  - abro mi boca ampliamente
  lexicon: HALOT
  rationale: El hebreo פָעַר expresa abrir ampliamente; el inglés POB lo resuelve con 'open my mouth'. En español, 'abro mi boca' conserva la imagen corporal sin añadir una paráfrasis excesiva.
- source_word: וָאֶשְׁאָפָה
  english_pob_choice: pant
  chosen_spanish: respiro agitadamente
  alternatives_spanish:
  - jadeo
  - ansío con aliento fatigado
  lexicon: HALOT
  rationale: El verbo puede expresar jadear o respirar con intensidad. 'Respiro agitadamente' comunica el acto físico de forma clara en español y evita una posible lectura excesivamente coloquial de 'jadeo'.
- source_word: לְמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus mandamientos
  - tus preceptos
  - tus órdenes
  lexicon: HALOT
  rationale: La base léxica מִצְוָה designa los mandamientos autoritativos de Dios. 'Mandamientos' coincide con la decisión auditada del POB en inglés y mantiene la terminología del salmo.
theological_decisions:
- issue: El matiz de deseo intenso expresado por el paralelismo hebreo
  english_pob_reading: open my mouth and pant, longing for your commandments
  chosen_spanish_reading: Abro mi boca y respiro agitadamente, porque anhelo tus mandamientos.
  alternative_spanish_readings:
  - abro mi boca y jadeo, anhelando tus mandamientos
  - abro mi boca y respiro con ansiedad por tus mandamientos
  rationale: El versículo combina una imagen corporal de apertura de la boca con una respuesta de deseo intenso. 'Porque anhelo' mantiene la motivación explícita y conserva el vínculo entre el gesto físico y la orientación del corazón hacia los mandamientos.
  doctrine_reference: Salmo 119:131; paralelismo poético hebreo
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente ni en el contexto inglés; la redacción española sigue la lectura auditada del POB sin añadir variantes textuales.
  spanish_consistency_notes:
  - Se mantiene 'mandamientos' para לְמִצְוֺתֶיךָ en coherencia con la decisión inglesa auditada.
  - Se evita 'SEÑOR' porque aquí no aparece el Tetragrámaton ni una cita explícita de κύριος.
  - La imagen corporal se conserva sin convertir el verso en una paráfrasis devocional.
