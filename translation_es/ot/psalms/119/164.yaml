lexical_decisions:
- source_word: שֶׁ֣בַע
  english_pob_choice: Seven
  chosen_spanish: Siete
  alternatives_spanish:
  - Siete veces
  lexicon: HALOT
  rationale: El hebreo expresa una cantidad exacta; en español se mantiene de forma directa como «Siete». La palabra «veces» se añade por el contexto adverbial del versículo, no como parte del numeral.
- source_word: בַּיּוֹם
  english_pob_choice: a day
  chosen_spanish: al día
  alternatives_spanish:
  - cada día
  - por día
  lexicon: HALOT
  rationale: La construcción idiomática en español más natural para una frecuencia es «al día». Conserva el valor distributivo del hebreo sin volverse más explícita de lo que el texto exige.
- source_word: הִלַּלְתִּי/ךָ
  english_pob_choice: I praise you
  chosen_spanish: te alabo
  alternatives_spanish:
  - te alabo a ti
  - te doy alabanza
  lexicon: HALOT
  rationale: El verbo hebreo significa alabar; «te alabo» es la forma más directa y natural en español. Se mantiene la segunda persona singular como en el hebreo.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_spanish: decretos
  alternatives_spanish:
  - ordenanzas
  - juicios
  - mandamientos
  lexicon: HALOT
  rationale: La POB inglesa eligió «ordinances» para מִשְׁפָּט en sentido de disposiciones reveladas de Dios. En español, «decretos» comunica mejor la idea de disposiciones normativas sin el matiz punitivo que tendría «juicios», y sin volverla mecánicamente arcaica.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_spanish: justos
  alternatives_spanish:
  - rectos
  - justos y rectos
  - de justicia
  lexicon: HALOT
  rationale: El sustantivo abstracto «tu justicia» en español sonaría menos fluido junto a «decretos». «Justos decretos» conserva el sentido de conformidad con la justicia de Dios y mantiene la relación adjetival implícita del hebreo.
theological_decisions:
- issue: Relación entre מִשְׁפְּטֵי צִדְקֶךָ y la justicia divina
  english_pob_reading: your righteous ordinances
  chosen_spanish_reading: tus justos decretos
  alternative_spanish_readings:
  - tus decretos de justicia
  - tus justas ordenanzas
  rationale: El hebreo une «mishpat» con «tu justicia», destacando que las disposiciones de Dios son conformes a su justicia. La traducción conserva esa idea sin introducir un término doctrinal más fuerte que el texto no requiere.
  doctrine_reference: Salmo 119:164; la justicia de Dios como norma de su revelación.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de auditoría; se ha seguido el hebreo masorético tal como está presentado y la decisión inglesa «ordinances» como guía contextual para el valor normativo de מִשְׁפְּטֵי.
  spanish_consistency_notes:
  - Se conserva el pronombre de objeto directo de segunda persona singular («te»), coherente con el hebreo.
  - «Al día» expresa frecuencia continua y mantiene el paralelismo del verso sin sobreinterpretar.
  - «Decretos» se usa de manera consistente con la función normativa de מִשְׁפְּטֵי en el corpus de salmos, evitando «juicios» salvo que el contexto lo exija.
