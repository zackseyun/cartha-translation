translation:
  language: es
  text: Recuerdo tus ordenanzas desde antiguo, Yahvé, y me consuelo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: ordenanzas
  alternatives_spanish:
  - sentencias
  - decretos
  - juicios
  lexicon: HALOT
  rationale: El término hebreo puede referirse a disposiciones o decisiones legales divinas. 'Ordenanzas' comunica bien el valor de normas establecidas por Dios sin cargar el verso con el matiz punitivo que 'juicios' puede tener en español. Mantiene además una diferencia útil frente a otros términos legales del Salmo.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino
  rationale: Se conserva el nombre propio divino en español como 'Yahvé', conforme a la política del proyecto de no ocultar el Tetragrámaton tras un equivalente funcional. 'Yahvé' es la forma más transparente y ampliamente reconocible en español bíblico.
- source_word: וָאֶתְנֶחָם
  english_pob_choice: I take comfort
  chosen_spanish: me consuelo
  alternatives_spanish:
  - me conforta
  - encuentro consuelo
  - me aliento
  lexicon: HALOT
  rationale: El verbo expresa consuelo o alivio interior ante el recuerdo de la fidelidad normativa de Dios. 'Me consuelo' refleja el valor reflexivo natural del español y mantiene la cercanía semántica con el inglés POB sin añadir interpretación excesiva.
theological_decisions:
- issue: Cómo renderizar el nombre divino יְהוָה en un texto público en español
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: La lectura del texto fuente y la decisión auditada del POB favorecen un nombre propio explícito. 'Yahvé' preserva la identificación del tetragrámaton como nombre, no como título, y evita la máscara litúrgica de 'SEÑOR'.
  doctrine_reference: 'DOCTRINE.md: el nombre divino debe tratarse como nombre propio en la traducción principal.'
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete de auditoría; la redacción sigue de cerca el hebreo y el inglés POB, sin cambios textuales adicionales.
  spanish_consistency_notes:
  - Se mantuvo un tono sobrio y bíblico, pero con sintaxis natural para el español moderno.
  - '''Ordenanzas'' preserva coherencia con el uso técnico del Salmo y evita variar innecesariamente a ''juicios''.'
  - No se añadieron notas al pie porque el verso no muestra una ambigüedad que requiera comentario textual o alternativo en esta unidad.
