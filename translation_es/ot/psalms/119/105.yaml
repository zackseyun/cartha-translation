translation:
  language: es
  text: Lámpara es tu palabra a mis pies, y luz para mi senda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 105–112 comienzan con nun (נ), la decimocuarta letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  english_pob_choice: lamp
  chosen_spanish: Lámpara
  alternatives_spanish:
  - Luz
  - Antorcha
  lexicon: HALOT
  rationale: נֵר designa una lámpara o fuente de luz portátil; en español, «lámpara» conserva mejor la imagen concreta que «luz» y mantiene el paralelismo con «luz» en la segunda cola.
- source_word: דְבָרֶךָ
  english_pob_choice: word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu palabra dicha
  - tu dicho
  - tu asunto
  lexicon: HALOT
  rationale: דָּבָר en este contexto poético se refiere a la palabra hablada de Dios; «tu palabra» sigue la decisión auditada del POB en inglés y mantiene la distinción de este término respecto de otros vocablos como אִמְרָה.
- source_word: רַגְלִי
  english_pob_choice: my feet
  chosen_spanish: mis pies
  alternatives_spanish:
  - mis pasos
  - mis plantas
  lexicon: morfología del texto hebreo
  rationale: 'El posesivo singular de primera persona exige un plural natural en español: «mis pies». Conserva la imagen corporal directa del hebreo.'
- source_word: נְתִיבָתִי
  english_pob_choice: my path
  chosen_spanish: mi senda
  alternatives_spanish:
  - mi camino
  - mi vereda
  lexicon: BDB/HALOT
  rationale: נְתִיבָה puede ser camino, senda o vereda. «Senda» mantiene el paralelismo poético con los pies y evita la repetición más plana de «camino»; «mi senda» suena natural y solemne en español.
theological_decisions:
- issue: Imagen de guía divina mediante la palabra de Yahvé
  english_pob_reading: Your word is a lamp to my feet and a light to my path.
  chosen_spanish_reading: Tu palabra es una lámpara para guiar mis pasos y una luz para mi senda.
  alternative_spanish_readings:
  - Tu palabra es una lámpara a mis pies y una luz para mi camino.
  - Tu palabra ilumina mis pies y mi senda.
  rationale: El versículo usa metáfora de iluminación para la dirección de la vida. La redacción principal conserva la imagen literal del hebreo sin endurecerla con una paráfrasis explicativa, pero el sentido direccional se entiende naturalmente en español.
  doctrine_reference: Salmo 119:105; cf. Salmo 119:130
translation_notes:
  revision_awareness: No hubo revisiones previas aplicadas en el paquete auditado; la decisión principal fue conservar el paralelismo imagen-con-imagen del hebreo y la equivalencia léxica de דָּבָר como «palabra».
  spanish_consistency_notes:
  - Se mantiene «palabra» para דָּבָר, en coherencia con la decisión auditada en inglés.
  - Se traduce יהוה como «Yahvé» solo cuando aparezca explícitamente en el texto fuente; aquí el versículo usa el sufijo posesivo de segunda persona, por lo que no se introduce el nombre divino.
  - «Senda» se usa por su valor poético y su adecuación al paralelismo con «pies».
