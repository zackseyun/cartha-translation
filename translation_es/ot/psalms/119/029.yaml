translation:
  language: es
  text: Aparta de mí el camino de falsedad, y por tu ley ten misericordia de mí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שֶׁקֶר
  english_pob_choice: the way of falsehood
  chosen_spanish: el camino de falsedad
  alternatives_spanish:
  - el camino de mentira
  - la senda de falsedad
  lexicon: HALOT / uso poético del paralelo camino-senda
  rationale: דֶּרֶךְ indica una vía, rumbo o conducta; en español 'camino' conserva bien la imagen. שֶׁקֶר aquí expresa falsedad/engaño, no solo una mentira aislada, por eso 'falsedad' mantiene mejor el alcance moral del hebreo y armoniza con el paralelismo poético.
- source_word: הָסֵר
  english_pob_choice: Keep me from
  chosen_spanish: Aparta de mí
  alternatives_spanish:
  - Quita de mí
  - Aleja de mí
  - Haz que me aparte de
  lexicon: BDB / HALOT
  rationale: El imperativo causativo pide remover o apartar algo de la persona. 'Aparta de mí' reproduce con naturalidad la petición directa sin perder el matiz de separación efectiva.
- source_word: וְתוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  - tu torá
  lexicon: HALOT
  rationale: תּוֹרָה denota la instrucción revelada de Dios; en español, 'ley' es el equivalente consagrado en este contexto y mantiene la coherencia con el salterio. 'Instrucción' y 'enseñanza' quedan como alternativas semánticas, pero 'ley' conserva mejor la forma breve y litúrgicamente reconocible del verso.
- source_word: חָנֵּנִי
  english_pob_choice: graciously grant me
  chosen_spanish: ten misericordia de mí
  alternatives_spanish:
  - muéstrame favor
  - concédeme por gracia
  - sé bondadoso conmigo
  lexicon: HALOT / uso bíblico de חנן
  rationale: חנן expresa mostrar gracia o favor. En español, 'ten misericordia de mí' comunica una petición de gracia divina de manera idiomática y bíblica, aunque la noción de favor inmerecido también está presente. Se evita 'graciosamente' por ser poco natural en español contemporáneo.
theological_decisions:
- issue: Cómo traducir תּוֹרָה sin borrar su carga revelacional
  english_pob_reading: your law
  chosen_spanish_reading: tu ley
  alternative_spanish_readings:
  - tu instrucción
  - tu enseñanza
  rationale: En este salmo, תּוֹרָה no se refiere solo a norma legal, sino a la revelación instruida por Dios. 'Ley' mantiene la tradición bíblica española y la cohesión del poema; en nota se reconocen 'instrucción' y 'enseñanza' como matices legítimos.
  doctrine_reference: Salmo 119; uso amplio de תּוֹרָה en el AT
- issue: Relación entre gracia y misericordia en חָנֵּנִי
  english_pob_reading: graciously grant me
  chosen_spanish_reading: ten misericordia de mí
  alternative_spanish_readings:
  - muéstrame favor
  - concédeme por gracia
  rationale: La petición no implica merecimiento sino dependencia de la benevolencia divina. 'Misericordia' es una forma bíblica natural en español y preserva el carácter implorante del verbo hebreo; también deja ver la dimensión de gracia/favor.
  doctrine_reference: Éxodo 33:19; Salmo 51:1; Salmo 86:16
translation_notes:
  revision_awareness: 'Se revisó el hebreo consonántico y la morfología: el verso contiene un imperativo de apartar/remover (הָסֵר), un sintagma nominal de ''camino de falsedad'' (דֶּרֶךְ שֶׁקֶר) y una petición final de favor/gracia (חָנֵּנִי). La redacción española procura conservar el paralelismo de dos miembros y la concisión poética del original, sin suavizar la fuerza del imperativo ni la ambigüedad entre gracia y misericordia.'
  spanish_consistency_notes:
  - Se mantiene 'ley' para תּוֹרָה en coherencia con el audit trail inglés y con el patrón de Salmo 119.
  - Se usa 'camino' para דֶּרֶךְ como imagen conductual, no como simple desplazamiento físico.
  - No se introduce 'SEÑOR'; el verso no contiene el nombre divino.
