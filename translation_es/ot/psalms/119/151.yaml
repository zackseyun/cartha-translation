translation:
  language: es
  text: Pero tú estás cerca, Yahvé, y todos tus mandamientos son verdad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב / קָר֣וֹב
  english_pob_choice: near
  chosen_spanish: estás cerca
  alternatives_spanish:
  - estás próximo
  - estás cercano
  lexicon: HALOT
  rationale: El adjetivo hebreo expresa proximidad. En español, «estás cerca» comunica de forma natural la cercanía relacional y espacial sin añadir un matiz más técnico que el texto no exige.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / HALOT
  rationale: Se conserva el nombre divino como nombre propio, siguiendo la decisión editorial del proyecto. «Yahvé» mantiene la identificación explícita del tetragrámaton sin la sustitución devocional tradicional.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato(s)
  - preceptos
  lexicon: HALOT
  rationale: «Mandamientos» reproduce bien el valor de normas autoritativas de Dios y es un equivalente claro y estable en español bíblico contemporáneo. «Preceptos» es posible, pero menos directo aquí.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_spanish: verdad
  alternatives_spanish:
  - verdaderos
  - fiables
  - fieles
  lexicon: HALOT
  rationale: 'El hebreo aquí funciona como predicado nominal: los mandamientos son «verdad». En español, «son verdad» conserva esa fuerza sin reducirlo solo a una cualidad adjetival. «Fieles» o «verdaderos» desplazan ligeramente el énfasis.'
theological_decisions:
- issue: El nombre divino en el texto
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: La lectura del POB inglés trata יְהוָה como nombre propio divino. En español se mantiene esa transparencia con «Yahvé», evitando la sustitución litúrgica por un título.
  doctrine_reference: 'DOCTRINE.md: el nombre divino debe tratarse como nombre propio.'
- issue: La afirmación sobre los mandamientos de Dios
  english_pob_reading: all your commandments are true
  chosen_spanish_reading: todos tus mandamientos son verdad
  alternative_spanish_readings:
  - todos tus mandamientos son verdaderos
  - todos tus mandamientos son fieles
  rationale: El hebreo afirma la veracidad plena de los mandamientos. «Son verdad» preserva la formulación fuerte y admite tanto la confiabilidad como la conformidad con la realidad divina, sin suavizarla a una mera descripción moral.
  doctrine_reference: Salmo 119:151 en su énfasis sobre la fiabilidad y verdad de la instrucción divina.
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el contexto inglés; por eso el español sigue de cerca la lectura base sin introducir variantes textuales ni notas de aparato.
  spanish_consistency_notes:
  - Se conserva «Yahvé» de manera consistente con la política del proyecto para יְהוָה.
  - Se usa «mandamientos» para מִצְוֺת en coherencia con el vocabulario legal-covenantal del Salmo 119.
  - La estructura breve y paralela del versículo se mantiene en español sin añadir conectores explicativos innecesarios.
