translation:
  language: es
  text: En tus preceptos meditaré[a] y fijaré mis ojos en tus caminos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Meditaré» recoge el valor contemplativo del hebreo; también puede implicar «hablaré / consideraré» de manera reflexiva.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - encargos
  lexicon: HALOT
  rationale: El hebreo פִּקּוּדִים apunta a encargos o disposiciones específicas que Dios ha establecido. «Preceptos» conserva ese valor distintivo en español y mantiene la diferencia frente a «mandamientos» o «estatutos».
- source_word: אָשִׂיחָה
  english_pob_choice: meditate
  chosen_spanish: meditaré
  alternatives_spanish:
  - hablaré
  - reflexionaré
  - consideraré
  lexicon: BDB
  rationale: El verbo puede incluir el acto de hablar o pensar detenidamente. En este contexto, «meditaré» comunica bien la contemplación reflexiva sin perder el sentido de atención sostenida que el hebreo sugiere.
- source_word: אֹרְחֹתֶיךָ
  english_pob_choice: your ways
  chosen_spanish: tus caminos
  alternatives_spanish:
  - tus sendas
  - tus rutas
  - tus veredas
  lexicon: BDB
  rationale: אֹרְחוֹת denota caminos o sendas recorridas. «Caminos» es natural en español y conserva la imagen bíblica de conducta, dirección y proceder.
translation_notes:
  revision_awareness: No hay revisiones previas registradas en el paquete base; la redacción sigue de cerca el hebreo y el glosado auditado en inglés («precepts» / «meditate» / «ways»).
  spanish_consistency_notes:
  - Se mantiene «preceptos» para פִּקּוּדִים, en coherencia con la decisión léxica inglesa auditada.
  - Se usa primera persona singular futura («meditaré», «fijaré») para reflejar el imperfecto cohortativo hebreo con intención decidida.
  - «Tus caminos» conserva el plural hebreo y la imagen de conducta/andadura sin explicitarla más allá del texto.
