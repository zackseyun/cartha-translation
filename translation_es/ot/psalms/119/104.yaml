  text: Con tus preceptos[a] obtengo entendimiento; por eso aborrezco todo camino de mentira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Preceptos» traduce פִּקּוּדִים con un término técnico que distingue estas disposiciones de «mandamientos» o «estatutos».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandamientos
  - estatutos
  - órdenes
  lexicon: HALOT
  rationale: La frase hebrea designa cargos o disposiciones concretas que Dios prescribe. «Preceptos» conserva la distinción que la POB inglesa mantiene frente a otros términos legales como «estatutos» o «mandamientos».
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I gain understanding
  chosen_spanish: obtengo entendimiento
  alternatives_spanish:
  - entiendo
  - adquiero entendimiento
  - discierno
  lexicon: BDB
  rationale: El verbo en primera persona expresa llegar a tener discernimiento por medio de algo; «obtengo entendimiento» refleja ese resultado sin reducirlo solo a un acto momentáneo de comprensión.
- source_word: אֹרַח שָׁקֶר
  english_pob_choice: false way
  chosen_spanish: camino de mentira
  alternatives_spanish:
  - sendero falso
  - camino falso
  - sendero de engaño
  lexicon: HALOT
  rationale: אֹרַח significa un camino o senda concreta; שָׁקֶר aporta la idea de falsedad/engaño. «Camino de mentira» conserva el paralelo poético y la amplitud moral de la expresión.
theological_decisions:
- issue: Relación causal entre comprensión y rechazo moral
  english_pob_reading: Through your precepts I gain understanding; therefore I hate every false way.
  chosen_spanish_reading: Con tus preceptos obtengo entendimiento; por eso aborrezco todo camino de mentira.
  alternative_spanish_readings:
  - Tus preceptos me dan entendimiento; por eso odio todo camino falso.
  - Con tus preceptos entiendo; por eso aborrezco todo camino de mentira.
  rationale: 'Se conserva la lógica del versículo: la instrucción divina produce discernimiento, y ese discernimiento lleva a rechazar la falsedad. «Aborrezco» mantiene la fuerza afectiva del hebreo y de la versión inglesa.'
  doctrine_reference: Sabiduría/ética de la Torá en Salmo 119; discernimiento moral generado por la instrucción divina.
