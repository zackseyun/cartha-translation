lexical_decisions:
- source_word: חָבֵר / חָבֵר אָ֭נִי
  english_pob_choice: I am a companion
  chosen_spanish: Soy compañero
  alternatives_spanish:
  - Soy un amigo
  - Mantengo amistad
  - Soy compañero y amigo
  lexicon: BDB/HALOT (חבר)
  rationale: El hebreo expresa relación de asociación o compañía. 'Compañero' conserva la idea de vínculo cercano sin añadir matices afectivos más fuertes que 'amigo'.
- source_word: יְרֵא֑וּ/ךָ
  english_pob_choice: who fear you
  chosen_spanish: los que te temen
  alternatives_spanish:
  - los que te reverencian
  - los que te respetan
  lexicon: BDB/HALOT (ירא)
  rationale: En este contexto sapiencial y devocional, 'temer' comunica reverencia obediente de manera fiel y reconocible en español bíblico contemporáneo.
- source_word: פִּקּוּדֶֽי/ךָ
  english_pob_choice: your precepts
  chosen_spanish: tus preceptos
  alternatives_spanish:
  - tus mandatos
  - tus órdenes
  - tus encargos
  lexicon: HALOT
  rationale: POB elige 'precepts' para mantener distinto este término de estatutos y mandamientos. 'Preceptos' preserva esa distinción en español y suena natural en registro bíblico.
translation_notes:
  revision_awareness: No se aplicaron revisiones previas. El texto sigue de cerca la lectura hebrea y coincide con la elección léxica auditada del POB inglés para פִּקּוּדִים como 'precepts'.
  spanish_consistency_notes:
  - Se mantiene el trato directo singular con 'te' para reflejar el sufijo hebreo de segunda persona singular.
  - '''Soy compañero'' evita endurecer el hebreo con una equivalencia social más específica que la evidencia no exige.'
  - '''Preceptos'' conserva la terminología técnica del POB para פִּקּוּדִים.'
