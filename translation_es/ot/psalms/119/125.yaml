lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: HALOT / uso consistente de POB para δοῦλος
  rationale: El hebreo expresa relación de pertenencia y servicio. 'Siervo' preserva la categoría relacional sin introducir 'esclavo' como término principal, que sería más fuerte en español y menos congruente con el uso lector de POB.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_spanish: dame entendimiento
  alternatives_spanish:
  - hazme entender
  - haz que comprenda
  lexicon: HALOT
  rationale: La forma causativa pide que Dios conceda capacidad de entender. 'Dame entendimiento' comunica la petición de manera natural y mantiene el valor causal sin añadir explicación excesiva.
- source_word: וְאֵדְעָה
  english_pob_choice: that I may know
  chosen_spanish: para que conozca
  alternatives_spanish:
  - y conoceré
  - y así conocer
  lexicon: HALOT
  rationale: La cláusula final expresa propósito/resultadο. 'Para que conozca' conserva la finalidad y suena idiomático en español bíblico contemporáneo.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus mandatos del pacto
  lexicon: HALOT
  rationale: 'Se mantiene la decisión auditada de POB: ''testimonios''. En español, ''testimonios'' preserva el campo semántico de declaraciones divinas atestiguadas, sin sustituirlo por equivalentes más interpretativos.'
theological_decisions:
- issue: Relación del hablante con Dios en 'siervo'
  english_pob_reading: I am your servant
  chosen_spanish_reading: Soy tu siervo
  alternative_spanish_readings:
  - Soy tu servidor
  - Soy tu esclavo
  rationale: La lectura mantiene la autodesignación de dependencia y obediencia. 'Siervo' evita cargar el verso con una dureza social que el hebreo aquí no exige como foco principal.
  doctrine_reference: Salmo 119; relación de pacto y obediencia del creyente a Yahvé
- issue: Contenido de 'testimonies'
  english_pob_reading: your testimonies
  chosen_spanish_reading: tus testimonios
  alternative_spanish_readings:
  - tus decretos
  - tus estipulaciones del pacto
  rationale: POB documenta 'testimonies' para עֵדוֹת como término consistente en el salmo. La traducción conserva esa tensión terminológica sin reemplazarla por una glosa legalista que estreche el alcance del término.
  doctrine_reference: Salmo 119; autoridad y testimonio de la revelación divina
translation_notes:
