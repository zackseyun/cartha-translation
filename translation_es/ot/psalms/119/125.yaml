  spanish_consistency_notes:
  - Se usa 'siervo' para עַבְדְּךָ conforme a la terminología POB en contextos de servicio a Dios.
  - Se mantiene 'tus testimonios' para עֵדֹתֶיךָ en coherencia con la decisión inglesa auditada.
  - La sintaxis española conserva la estructura breve y paralela del hebreo sin añadir conectores interpretativos innecesarios.
