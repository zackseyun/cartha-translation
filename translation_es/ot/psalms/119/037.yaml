lexical_decisions:
- source_word: הַעֲבֵר עֵינַי
  english_pob_choice: Turn my eyes away
  chosen_spanish: Aparta mis ojos
  alternatives_spanish:
  - Aleja mis ojos
  - Vuelve mis ojos aparte
  lexicon: WLC; contextual imperative of causative verb
  rationale: 'El hebreo pide una acción causativa: que Dios desvíe los ojos del salmista. «Aparta mis ojos» conserva la fuerza directa de la súplica y suena natural en español.'
- source_word: מֵרְאוֹת
  english_pob_choice: from looking at
  chosen_spanish: de ver
  alternatives_spanish:
  - de mirar
  - para no ver
  lexicon: WLC; verb of perception
  rationale: La construcción hebrea expresa alejamiento de la acción de ver. «De ver» mantiene la relación verbal sin sobrecargar la frase; «de mirar» es posible, pero «ver» refleja mejor el campo semántico general.
- source_word: שָׁוְא
  english_pob_choice: worthless things
  chosen_spanish: cosas vanas
  alternatives_spanish:
  - cosas inútiles
  - cosas vacías
  - cosas sin valor
  lexicon: HALOT; POB English lexical decision
  rationale: שָׁוְא denota vaciedad, inutilidad o carencia de valor. «Cosas vanas» preserva bien esa amplitud semántica en español bíblico y mantiene la tensión entre lo vacío y lo sin provecho; «vanidad» sería más abstracto y menos transparente en este contexto.
- source_word: בִּדְרָכֶךָ
  english_pob_choice: in your ways
  chosen_spanish: en tus caminos
  alternatives_spanish:
  - por tus caminos
  - según tus caminos
  lexicon: WLC; דרך as path/way/manner of life
  rationale: «Caminos» traduce la metáfora bíblica de דרך como el andar y la conducta guiada por Dios. «En tus caminos» conserva la imagen y es idiomático en español.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - vivifícame
  - revíveme
  lexicon: WLC; causative of חיים
  rationale: El hebreo pide que Dios haga vivir o vivifique. «Dame vida» es natural y fiel; «vivifícame» es más literal pero menos transparente para lectura pública.
theological_decisions:
- issue: La petición de ser apartado de la vanidad y vivificado en los caminos de Dios
  english_pob_reading: Turn my eyes away from looking at worthless things; give me life in your ways.
  chosen_spanish_reading: Aparta mis ojos de ver cosas vanas; dame vida en tus caminos.
  alternative_spanish_readings:
  - Aparta mis ojos de ver cosas inútiles; vivifícame en tus caminos.
  - Vuelve mis ojos de mirar lo vano; dame vida en tus caminos.
  rationale: 'No hay una carga doctrinal especial más allá de la oración ética del salmista: pedir protección contra lo vacío y renovación dentro de la obediencia. La formulación española mantiene ese equilibrio sin intensificar ni suavizar el mandato implícito.'
  doctrine_reference: Ética de la santidad / oración de renovación
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; la redacción española sigue el sentido del hebreo y el audit trail inglés sin depender de una tradición confesional específica.
  spanish_consistency_notes:
  - 'Se mantuvo el tuteo reverencial implícito en los Salmos con posesivos de segunda persona: «tus caminos».'
  - «Cosas vanas» se eligió como equivalente general de שָׁוְא para conservar la amplitud semántica sin perder claridad.
  - Se evitó «SEÑOR» para יהוה porque este versículo no contiene el Tetragrámaton explícito; el verso usa lenguaje directo de segunda persona.
