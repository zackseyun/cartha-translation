  source_alignment_summary: «Guardaré tus estatutos; no me abandones del todo» reproduce fielmente el imperfecto/forma yiqtol de primera persona אֶשְׁמֹר, el objeto «tus estatutos» (חֻקֶּיךָ), la súplica negativa אַל־תַּעַזְבֵנִי y la intensificación עַד־מְאֹד. El «Yo» inicial del borrador es admisible en español y no altera el sentido, aunque no es necesario para representar el sujeto ya contenido en el verbo hebreo.
