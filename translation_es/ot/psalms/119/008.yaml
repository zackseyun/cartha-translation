translation:
  language: es
  text: Yo guardaré tus estatutos; no me abandones del todo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - preceptos
  - prescripciones
  lexicon: HALOT
  rationale: חֹק/חֻקִּים designa normas fijadas o prescritas; 'estatutos' conserva bien la idea de disposición establecida y mantiene la consistencia con la decisión inglesa 'statutes'.
- source_word: אֶשְׁמֹר
  english_pob_choice: I will keep
  chosen_spanish: yo guardaré
  alternatives_spanish:
  - yo observaré
  - yo conservaré
  lexicon: BDB
  rationale: El verbo expresa guardar, observar o preservar una norma. 'Guardaré' funciona de forma natural en español bíblico y comunica fidelidad práctica sin alejarse del valor del hebreo.
- source_word: אַֽל תַּעַזְבֵ֥נִי
  english_pob_choice: do not utterly forsake me
  chosen_spanish: no me abandones del todo
  alternatives_spanish:
  - no me dejes por completo
  - no me desampares del todo
  lexicon: HALOT
  rationale: El verbo עזב significa abandonar, dejar o desamparar. El inglés POB añadió 'utterly' para intensificar la petición; en español, 'del todo' reproduce esa intensidad de manera natural.
- source_word: עַד מְאֹד
  english_pob_choice: utterly
  chosen_spanish: del todo
  alternatives_spanish:
  - por completo
  - en gran manera
  lexicon: BDB
  rationale: '''מְאֹד'' intensifica aquí la idea de totalidad o extremo. ''Del todo'' expresa esa fuerza adverbial sin introducir un matiz distinto.'
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca el texto hebreo y la decisión inglesa auditada, conservando la intensificación de la súplica final sin sobreexplicarla.
  spanish_consistency_notes:
  - Se mantuvo 'estatutos' para חֻקִּים conforme al criterio POB ya documentado.
  - Se evitó 'SEÑOR' porque el versículo no contiene el Tetragrámaton ni una cita explícita del nombre divino.
  - La primera persona futura 'guardaré' refleja compromiso voluntario continuo, acorde con el hebreo imperfecto en este contexto.
  - '''No me abandones del todo'' conserva la súplica intensificada del cierre hebreo sin usar una paráfrasis más expansiva.'
