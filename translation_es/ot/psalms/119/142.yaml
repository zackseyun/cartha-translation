translation:
  language: es
  text: Tu justicia es justicia para siempre, y tu ley es verdad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִדְקָתְךָ
  english_pob_choice: Your righteousness
  chosen_spanish: tu justicia
  alternatives_spanish:
  - tu rectitud
  - tu justicia recta
  lexicon: 6666 (צדקה)
  rationale: En este contexto poético, צדקה expresa la cualidad justa/recta de Dios. 'Justicia' es el equivalente natural y teológicamente transparente en español; 'rectitud' sería posible, pero 'justicia' conserva mejor la fuerza del hebreo y la coherencia bíblica.
- source_word: צֶדֶק
  english_pob_choice: righteous
  chosen_spanish: justicia
  alternatives_spanish:
  - rectitud
  - justo
  lexicon: 6664 (צדק)
  rationale: El sustantivo intensivo del hebreo queda mejor como 'justicia' en español dentro de la repetición enfática ('justicia... justicia'). 'Rectitud' suaviza la repetición pero pierde parte de la equivalencia formal; 'justo' cambiaría la categoría gramatical.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_spanish: para siempre
  alternatives_spanish:
  - eternamente
  - por siempre
  lexicon: 5769 (עולם)
  rationale: '''Para siempre'' reproduce de forma natural la duración indefinida y solemne del hebreo, sin elevar artificialmente el registro. ''Eternamente'' es válido, pero algo más abstracto; ''por siempre'' también sería posible.'
- source_word: וְתוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: 8451 (תורה)
  rationale: Se mantiene 'ley' por continuidad con la tradición de traducción del salmo y por coherencia con el audit trail en inglés. Aunque תורה puede significar instrucción/enseñanza, aquí el término funciona como designación estable del contenido revelado de Dios.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_spanish: verdad
  alternatives_spanish:
  - fiel
  - veraz
  lexicon: 571 (אמת)
  rationale: En español, 'verdad' comunica de manera más natural el valor nominal del hebreo. 'Fiel' o 'veraz' podrían expresar la idea relacional, pero desplazan el sustantivo a un adjetivo y pierden el paralelismo con 'justicia'.
theological_decisions:
- issue: La repetición hebrea 'צִדְקָתְךָ צֶדֶק' puede sonar redundante en español.
  english_pob_reading: Your righteousness is righteous forever
  chosen_spanish_reading: Tu justicia es justicia para siempre
  alternative_spanish_readings:
  - Tu rectitud es rectitud para siempre
  - Tu justicia es recta para siempre
  rationale: Se preserva la repetición enfática del hebreo y del inglés POB, porque el punto del verso es subrayar la cualidad plenamente justa de Yahvé. Aunque la estructura suena intensa, la redundancia es intencional y no debe suavizarse demasiado.
  doctrine_reference: Salmo 119:142; justicia/rectitud divina en la Escritura
- issue: La palabra תורה en español puede renderizarse como 'ley', 'instrucción' o 'enseñanza'.
  english_pob_reading: your law
  chosen_spanish_reading: tu ley
  alternative_spanish_readings:
  - tu instrucción
  - tu enseñanza
  rationale: Se opta por 'ley' porque es la opción establecida en la tradición bíblica y la que mejor coincide con el audit trail en inglés. Las alternativas son válidas, pero podrían diluir la referencia al cuerpo normativo-revelado de Dios en este salmo.
  doctrine_reference: Salmo 119; תורה como revelación normativa de Yahvé
translation_notes:
  revision_awareness: No se registran revisiones posteriores en el paquete fuente; la redacción sigue de cerca el texto hebreo y la traducción POB en inglés, preservando la repetición enfática y el paralelismo.
  spanish_consistency_notes:
  - Se usa 'Yahvé' para el nombre divino solo cuando aparezca explícitamente en el texto base; aquí no aparece.
  - Se mantiene 'ley' para תורה según el audit trail en inglés, sin sustituirlo por 'instrucción' o 'enseñanza'.
  - Se conserva la repetición semántica de 'justicia' para reflejar el hebreo enfático.
