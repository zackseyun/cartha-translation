    issue: «Tenga en cuenta» atenúa el sentido atencional de וְאֶשְׁעָה.
    rationale: El verbo שׁעה denota mirar hacia, atender o prestar consideración dirigida. «Preste atención a» reproduce mejor esa orientación hacia los estatutos sin introducir una paráfrasis.
  revised_spanish_text: Sosténme, para que esté a salvo y preste atención continuamente a tus estatutos[a].
