translation:
  language: es
  text: Sosténme, para que esté a salvo y preste atención continuamente a tus estatutos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «estatutos» traduce חֻקִּים; también puede entenderse como «decretos» o «prescripciones».
