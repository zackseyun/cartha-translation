review_pass:
  verdict: revise
  source_alignment_summary: La súplica «Sosténme» refleja bien סְעָדֵנִי, y «para que esté a salvo» comunica adecuadamente el resultado expresado por וְאִוָּשֵׁעָה. «Tus estatutos» conserva la decisión léxica documentada para חֻקֶּיךָ y la nota mantiene las alternativas relevantes. Sin embargo, וְאֶשְׁעָה expresa dirigir la mirada o atención hacia los estatutos; «tener en cuenta» puede sugerir solamente consideración mental o tomar algo como factor, y atenúa esa atención dirigida.
  spanish_quality_summary: El texto es claro, digno y natural. Se recomienda «preste atención a» para expresar con mayor precisión el verbo hebreo y conservar una formulación española fluida. La colocación de «continuamente» junto a «preste atención» deja inequívoco que modifica esa atención perseverante.
  glossary_alignment: No intervienen los términos teológicos principales del proyecto. «Estatutos» concuerda con la decisión inglesa auditada para חֻקִּים; la nota conserva «decretos» y «prescripciones» como alternativas léxicas.
  issues:
