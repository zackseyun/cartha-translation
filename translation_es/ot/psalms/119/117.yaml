lexical_decisions:
- source_word: סְעָדֵנִי
  english_pob_choice: Hold me up
  chosen_spanish: Sosténme
  alternatives_spanish:
  - Susténtame
  - Apóyame
  lexicon: BDB/HALOT
  rationale: El verbo pide la idea de sostener o apoyar para evitar la caída; «Sosténme» conserva la imagen y funciona de manera natural en español. «Susténtame» es posible, pero suena un poco más abstracto.
- source_word: וְאִוָּשֵׁעָה
  english_pob_choice: that I may be safe
  chosen_spanish: para que esté a salvo
  alternatives_spanish:
  - para que sea salvo
  - para que me vea salvado
  lexicon: BDB/HALOT
  rationale: 'La forma verbal expresa resultado o finalidad: ser librado/preservado. «Esté a salvo» comunica bien la seguridad obtenida sin imponer una formulación demasiado técnica.'
- source_word: וְאֶשְׁעָה
  english_pob_choice: have regard for
  chosen_spanish: tenga en cuenta
  alternatives_spanish:
  - mire con atención
  - considere
  lexicon: BDB/HALOT
  rationale: El verbo indica inclinar la atención hacia algo. «Tenga en cuenta» preserva el sentido de atención continua y es idiomático en español moderno.
- source_word: בְחֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: Se sigue la decisión auditada de traducir חֻקִּים como «estatutos». «Decretos» y «prescripciones» quedan como alternativas, pero «estatutos» mantiene la consistencia POB y la fuerza de norma establecida.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_spanish: continuamente
  alternatives_spanish:
  - siempre
  - sin cesar
  lexicon: BDB/HALOT
  rationale: El adverbio señala continuidad prolongada. «Continuamente» es claro y formal; conserva la constancia del compromiso del salmista.
theological_decisions:
- issue: Petición de preservación divina antes de la obediencia continua
  english_pob_reading: Hold me up, that I may be safe and have regard for your statutes continually.
  chosen_spanish_reading: Sosténme, para que esté a salvo y tenga en cuenta tus estatutos continuamente.
  alternative_spanish_readings:
  - Susténtame, para que sea salvo y considere tus estatutos continuamente.
  - Apóyame, para que me mantenga seguro y atienda a tus estatutos continuamente.
  rationale: El verso une dependencia de Dios con la atención persistente a su ley. La traducción mantiene ambas dimensiones sin convertir «estar a salvo» en una formulación doctrinal más fuerte de lo que el hebreo exige en este contexto.
  doctrine_reference: Salmo 119:117; dependencia divina y obediencia perseverante
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue directamente el texto hebreo con apoyo del auditable inglés POB para decisiones léxicas consistentes.
  spanish_consistency_notes:
  - Se mantiene «estatutos» para חֻקִּים conforme a la decisión lexical auditada.
  - Se evita el uso de «SEÑOR» porque el verso no contiene el nombre divino; el poseedor está expresado por el sufijo de segunda persona («tus»).
  - «Sosténme» conserva la imagen de soporte físico/preservación y encaja con el paralelismo del verso.
