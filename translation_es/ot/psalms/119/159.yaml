translation:
  language: es
  text: ¡Mira[a] cómo amo tus preceptos! Dame vida, Yahvé, conforme a tu amor constante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Mira» refleja el imperativo hebreo de atención; también podría entenderse como «Considera».
    reason: lexical_alternative
  - marker: b
    text: «Amor constante» traduce חֶסֶד en el sentido de amor leal y persistente; otras posibilidades son «misericordia constante» o «bondad leal».
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Consider
  chosen_spanish: Mira
  alternatives_spanish:
  - Considera
  - Mira bien
  lexicon: HALOT
  rationale: El imperativo llama a fijar la atención sobre un hecho; en español, 'Mira' comunica con naturalidad la apelación directa sin endurecer el tono.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - estatutos
  lexicon: HALOT
  rationale: '''Preceptos'' mantiene la distinción léxica que la POB inglesa preserva y evita confundir este término con otros vocablos legales del salterio.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se conserva el nombre divino como nombre propio, conforme al criterio POB y a la directriz del proyecto para יהוה.
- source_word: חֶסֶד / חַסְדְּךָ
  english_pob_choice: steadfast love
  chosen_spanish: amor constante
  alternatives_spanish:
  - amor fiel
  - misericordia constante
  - bondad leal
  lexicon: HALOT
  rationale: '''Amor constante'' comunica en español la lealtad pactal y la permanencia que la POB expresa con ''steadfast love'', sin reducirlo solo a ''misericordia''.'
theological_decisions:
- issue: Cómo renderizar el valor pactal de חֶסֶד en un contexto de petición de vida
  english_pob_reading: according to your steadfast love
  chosen_spanish_reading: conforme a tu amor constante
  alternative_spanish_readings:
  - según tu misericordia constante
  - de acuerdo con tu bondad leal
  rationale: La petición de ser vivificado se fundamenta en la fidelidad benevolente de Dios; 'amor constante' preserva ese trasfondo relacional y de pacto sin apagar la idea de continuidad.
  doctrine_reference: Salmos 136; Éxodo 34:6-7
translation_notes:
  revision_awareness: No se detectaron revisiones aplicadas en el paquete inglés; se ha seguido la lectura estable de la POB inglesa y del texto hebreo masorético sin introducir variantes textuales.
  spanish_consistency_notes:
  - Se mantuvo Yahvé para יְהוָה según la convención del proyecto.
  - Se preservó la distinción entre פִקּוּדִים ('preceptos') y otros términos legales de la Torá.
  - '''Amor constante'' se usa como equivalente consistente de חֶסֶד cuando el contexto destaca fidelidad leal.'
