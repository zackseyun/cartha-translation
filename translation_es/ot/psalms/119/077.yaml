translation:
  language: es
  text: Llegue hasta mí tu misericordia, para que viva, porque tu ley es mi deleite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְבֹא֣וּ/נִי
  english_pob_choice: Let ... come to me
  chosen_spanish: Llegue hasta mí
  alternatives_spanish:
  - Venga a mí
  - Que venga a mí
  lexicon: BDB/HALOT
  rationale: El hebreo usa un verbo de venir con objeto pronominal; en español, 'llegar hasta mí' conserva la idea de acceso o arribo de algo personificado (la misericordia) sin forzar un calco poco natural. Mantiene el tono de súplica del hebreo y del inglés POB.
- source_word: רַחֲמֶ֣י/ךָ
  english_pob_choice: your mercy
  chosen_spanish: tu misericordia
  alternatives_spanish:
  - tus misericordias
  - tu compasión
  lexicon: BDB/HALOT
  rationale: '''רַחֲמִים/רַחֲמֶיךָ'' puede expresar misericordia entrañable o compasión. ''Misericordia'' es el equivalente más estable en español bíblico y conserva el valor relacional y pactual del término; el plural ''misericordias'' es posible, pero en esta línea suena menos natural.'
- source_word: וְאֶֽחְיֶה
  english_pob_choice: that I may live
  chosen_spanish: para que viva
  alternatives_spanish:
  - y viva
  - y yo viva
  lexicon: BDB/HALOT
  rationale: El imperfecto cohortativo expresa finalidad o resultado deseado. 'Para que viva' comunica bien el propósito en español actual y mantiene la dependencia de la vida respecto de la misericordia divina.
- source_word: תֽוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se mantiene 'ley' siguiendo la decisión auditada del POB inglés y la consistencia del salmo, donde תּוֹרָה funciona como el término estándar para la revelación normativa de Dios. 'Instrucción/enseñanza' son alternativas semánticamente válidas, pero alterarían la terminología estable del pasaje.
- source_word: שַֽׁעֲשֻׁעָֽי
  english_pob_choice: my delight
  chosen_spanish: mi deleite
  alternatives_spanish:
  - mi gusto
  - mi placer
  lexicon: BDB/HALOT
  rationale: '''שַׁעֲשׁוּעִים'' expresa deleite, gozo o placer apreciativo. ''Mi deleite'' es la formulación más natural y reverente en español bíblico contemporáneo, y preserva el juicio afectivo del hablante sobre la ley.'
theological_decisions:
- issue: Relación entre misericordia y vida
  english_pob_reading: Let your mercy come to me, that I may live
  chosen_spanish_reading: Llegue hasta mí tu misericordia, para que viva
  alternative_spanish_readings:
  - Que tu misericordia venga a mí y viva
  - Tu misericordia llegue a mí, y viviré
  rationale: El versículo presenta la vida como dependiente de la misericordia divina. La redacción española mantiene esa dependencia sin convertirla en una simple afirmación autónoma de vida; el sentido peticional y confesional permanece intacto.
  doctrine_reference: Dependencia humana de la gracia/misericordia divina; vida como don de Dios.
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente; la draft se alinea con la traducción inglesa POB y con el hebreo masorético transmitido.
  spanish_consistency_notes:
  - '''Misericordia'' se usa para רַחֲמִים en armonía con el registro bíblico habitual.'
  - '''Ley'' se conserva para תּוֹרָה según la consistencia terminológica del salmo y el audit trail inglés.'
  - Se evita 'SEÑOR' porque el versículo no contiene el tetragrámaton ni una cita explícita del nombre divino.
  - 'El paralelismo queda preservado en una sola frase con dos miembros: petición de misericordia y confesión del deleite en la ley.'
