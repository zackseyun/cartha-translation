  source_alignment_summary: 'El texto reproduce fielmente la estructura y el sentido del hebreo: el imperativo הָקֵם se expresa como «Afirma»; לְעַבְדְּךָ como «a tu siervo»; אִמְרָתֶךָ como «tu promesa»; y la cláusula אֲשֶׁר לְיִרְאָתֶךָ como «la cual es para los que te temen». La traducción conserva también la lectura documentada por el POB inglés de que la promesa está destinada u orientada a quienes temen a Dios.'
  spanish_quality_summary: «Afirma a tu siervo tu promesa, la cual es para los que te temen» es claro, digno y natural en español bíblico contemporáneo. El orden de los complementos mantiene el énfasis peticionario del original sin producir una construcción forzada. No requiere notas para ser inteligible ni para preservar una alternativa que el texto inglés haya elevado a nota editorial.
  glossary_alignment: «Siervo» concuerda con la terminología POB para lenguaje de dependencia reverente. «Promesa» sigue la decisión léxica auditada para אִמְרָה en este salmo y conserva su contraste conceptual con una simple «palabra». «Los que te temen» mantiene directamente el sentido de יִרְאָה sin reducirlo a una paráfrasis interpretativa como «reverencian».
