translation:
  language: es
  text: Afirma a tu siervo tu promesa, la cual es para los que te temen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָקֵם
  english_pob_choice: Confirm
  chosen_spanish: Afirma
  alternatives_spanish:
  - Confirma
  - Establece
  lexicon: HALOT
  rationale: El imperativo pide que Dios haga firme o estable algo ya dicho. En español, «afirma» comunica bien esa idea de dar solidez/confirmación sin sonar demasiado técnico; «confirma» y «establece» son alternativas viables, pero «afirma» fluye con naturalidad y conserva el sentido volitivo.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: HALOT
  rationale: POB usa «siervo» para δοῦλος y lenguaje de servidumbre reverente. Aquí el hebreo expresa relación de dependencia y lealtad ante Dios; «siervo» es el registro bíblico y natural en español, mientras que «esclavo» sería demasiado áspero para el texto principal.
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_spanish: promesa
  alternatives_spanish:
  - palabra
  - dicho
  - declaración
  lexicon: HALOT
  rationale: La nota auditada de POB indica que en este salmo אִמְרָה no funciona como simple «palabra», sino como el dicho comprometido de Dios en el que el salmista pone su vida. «Promesa» refleja bien ese valor comprometedor en español y mantiene la distinción frente a דָּבָר.
- source_word: יִרְאָתֶךָ
  english_pob_choice: those who fear you
  chosen_spanish: los que te temen
  alternatives_spanish:
  - los que reverencian tu nombre
  - los que te honran con temor
  lexicon: HALOT
  rationale: 'El sustantivo verbal con לְ indica finalidad o referencia: la promesa está orientada a quienes temen a Dios. «Los que te temen» es la forma más directa y fiel; «reverencian» aclara el matiz, pero añade interpretación no necesaria en el texto base.'
theological_decisions:
- issue: Relación entre la promesa y los que temen a Dios
  english_pob_reading: which is for those who fear you
  chosen_spanish_reading: la cual es para los que te temen
  alternative_spanish_readings:
  - la cual pertenece a los que te temen
  - la cual está destinada a los que te temen
  rationale: 'El hebreo con לְ puede expresar dirección, referencia o beneficio. La formulación española conserva esa amplitud sin cerrar indebidamente el alcance: la promesa se presenta como orientada a, o destinada a, los que temen a Yahvé.'
  doctrine_reference: Sal 119:38; cf. la temática del pacto y de las promesas divinas en la Torá y los Salmos.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete auditado; la presente redacción sigue de cerca la lectura inglesa aprobada y los matices del hebreo sin necesidad de variantes textuales.
  spanish_consistency_notes:
  - Se mantiene «Yahvé» como forma estándar del proyecto para el Tetragrámaton, pero en este versículo el texto hebreo usa sufijo pronominal de segunda persona y no aparece el nombre explícito.
  - «Siervo» se conserva como término de relación con Dios, en línea con la terminología POB.
  - «Promesa» se usa de forma consistente con la decisión auditada en inglés para אִמְרָה en este salmo.
