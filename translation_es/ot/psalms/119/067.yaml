lexical_decisions:
- source_word: טֶ֣רֶם אֶ֭עֱנֶה אֲנִ֣י שֹׁגֵ֑ג
  english_pob_choice: Before I was afflicted I went astray
  chosen_spanish: Antes de ser afligido, yo me desviaba
  alternatives_spanish:
  - Antes de que yo fuera afligido, me extraviaba
  - Antes de ser humillado, yo andaba errante
  lexicon: BDB / HALOT / English POB audit trail
  rationale: 'טֶרֶם marca prioridad temporal: «antes de». אֶעֱנֶה es una forma verbal pasiva/causativa en contexto de aflicción; «ser afligido» conserva la relación del hebreo con el sufrimiento sin forzar una interpretación moral. שֹׁגֵג expresa extravío o error; «me desviaba» comunica bien la idea de apartarse del camino, en paralelo con la obediencia final del versículo.'
- source_word: אִמְרָתְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu dicho
  - tu promesa
  lexicon: HALOT
  rationale: La auditoría inglesa ya justificó «word» frente a «promise» porque aquí אִמְרָה es lo que se guarda en obediencia. En español, «tu palabra» es la forma más natural y fiel para ese valor de mandato/expresión divina, sin convertirla en una promesa específica.
- source_word: שָׁמָֽרְתִּי
  english_pob_choice: I keep
  chosen_spanish: he guardado
  alternatives_spanish:
  - he observado
  - he cumplido
  lexicon: BDB / HALOT
  rationale: שׁמר en este contexto implica observar o guardar fielmente. «He guardado» mantiene el sentido de custodia obediente y encaja con el uso bíblico de guardar la palabra de Dios.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; el borrador sigue la lectura base del hebreo y la decisión inglesa de renderizar אִמְרָה como «word/word of God» en este contexto.
  spanish_consistency_notes:
  - 'Se mantiene el paralelismo temporal adversativo: «Antes... pero ahora...».'
  - Se evita «palabra» con sentido meramente abstracto; aquí funciona como contenido obedecido.
  - «Afligido» preserva la dimensión de sufrimiento sin añadir una causa que el hebreo no explicita.
  - El registro es sobrio y apto para lectura pública, sin arcaísmos innecesarios.
