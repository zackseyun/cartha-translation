translation:
  language: es
  text: Los príncipes[a] me persiguen sin causa, pero mi corazón tiembla ante tus palabras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 161–168 comienzan con shin (ש), la vigesimoprimera letra del alfabeto; continúa el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרִים
  english_pob_choice: Princes
  chosen_spanish: Los príncipes
  alternatives_spanish:
  - Los gobernantes
  - Los jefes
  lexicon: BDB/HALOT
  rationale: שָׂרִים designa a autoridades de alto rango; «príncipes» conserva dignidad y rango, y coincide con la elección de la POB inglesa.
- source_word: רְדָפ֣וּ/נִי
  english_pob_choice: persecute me
  chosen_spanish: me persiguen
  alternatives_spanish:
  - me acosan
  - me persiguen de cerca
  lexicon: BDB/HALOT
  rationale: El verbo expresa persecución hostil; «persiguen» es claro, natural y fiel al valor verbal sin intensificar más allá del hebreo.
- source_word: חִנָּ֑ם
  english_pob_choice: without cause
  chosen_spanish: sin causa
  alternatives_spanish:
  - gratuitamente
  - sin motivo
  lexicon: BDB/HALOT
  rationale: La idea es ausencia de razón o base; «sin causa» reproduce bien la tensión jurídica y moral del término.
- source_word: ו/מ/דברי/ך
  english_pob_choice: your words
  chosen_spanish: tus palabras
  alternatives_spanish:
  - tu palabra
  - tus dichos
  lexicon: HALOT
  rationale: דְּבָרִים en plural con sufijo expresa los dichos/expresiones de Dios; «palabras» mantiene el plural y la conexión con el habla divina, como en la decisión inglesa.
- source_word: פָּחַ֥ד
  english_pob_choice: stands in awe
  chosen_spanish: tiembla ante
  alternatives_spanish:
  - está en awe de
  - siente temor reverente ante
  lexicon: BDB/HALOT
  rationale: El verbo puede abarcar temor, estremecimiento o reverencia. En español, «tiembla ante» preserva la reacción afectiva y el matiz de temor reverente sin usar una expresión híbrida o poco natural.
- source_word: לִבִּֽי
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi interior
  - mi ser
  lexicon: BDB/HALOT
  rationale: «Corazón» es el equivalente idiomático normal para el centro interior de percepción y respuesta en español bíblico contemporáneo.
theological_decisions:
- issue: Temor reverente ante la palabra de Dios
  english_pob_reading: my heart stands in awe of your words
  chosen_spanish_reading: mi corazón tiembla ante tus palabras
  alternative_spanish_readings:
  - mi corazón está sobrecogido ante tus palabras
  - mi corazón reverencia tus palabras
  rationale: El hebreo פָּחַד no describe solo admiración, sino una respuesta de temor ante la palabra divina. «Tiembla ante» conserva la tensión entre reverencia y temor sin suavizarla demasiado.
  doctrine_reference: Proverbios 1:7; Isaías 66:2
translation_notes:
  revision_awareness: Se siguió el sentido del texto hebreo y la decisión inglesa ya auditada para דָּבָר como «word/palabras». No se registran revisiones posteriores en el expediente disponible.
  spanish_consistency_notes:
  - Se preservó el paralelismo semántico entre persecución injusta y reverencia ante la palabra divina.
  - Se evitó «SEÑOR» o «Cristo» porque el versículo no contiene esos términos.
  - La nota acróstica se ancla en el sustantivo inicial para mantener la convención de la POB inglesa.
