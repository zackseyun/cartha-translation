translation:
  language: es
  text: Tu fidelidad permanece de generación en generación; tú afirmaste la tierra, y permanece firme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמוּנָה
  english_pob_choice: faithfulness
  chosen_spanish: fidelidad
  alternatives_spanish:
  - fiabilidad
  - constancia
  lexicon: HALOT
  rationale: El POB inglés eligió 'faithfulness' para expresar la cualidad relacional y confiable de Yahvé. En español, 'fidelidad' comunica de manera natural esa lealtad constante mejor que un término más técnico como 'fiabilidad', y evita reducir la idea a mera exactitud.
- source_word: כּוֹנַנְתָּ
  english_pob_choice: you established
  chosen_spanish: afirmaste
  alternatives_spanish:
  - estableciste
  - fundaste
  lexicon: HALOT
  rationale: El verbo hebreo indica poner firmemente, asentar o establecer. 'Afirmaste' conserva la idea de dar firmeza y estabilidad a la tierra con un español fluido; 'estableciste' y 'fundaste' siguen siendo alternativas válidas, pero 'afirmaste' resalta mejor el matiz de firmeza del contexto inmediato con 'permanece firme'.
- source_word: וַתַּעֲמֹד
  english_pob_choice: and it stands fast
  chosen_spanish: y permanece firme
  alternatives_spanish:
  - y se mantiene
  - y está firme
  lexicon: HALOT
  rationale: La forma verbal comunica que la tierra quedó en estado de permanencia/estabilidad. 'Permanece firme' transmite bien ese resultado duradero en español actual, conservando el matiz de estabilidad continua que el POB inglés expresó con 'stands fast'.
theological_decisions:
- issue: La fidelidad divina abarca toda la historia humana
  english_pob_reading: Your faithfulness endures to all generations
  chosen_spanish_reading: Tu fidelidad permanece de generación en generación
  alternative_spanish_readings:
  - Tu fidelidad dura por todas las generaciones
  - Tu fidelidad se extiende a todas las generaciones
  rationale: La línea hebrea afirma la continuidad de la fidelidad de Yahvé a través de generaciones sucesivas. 'Permanece de generación en generación' preserva tanto la duración como la transmisión histórica, sin debilitar el alcance universal del enunciado.
  doctrine_reference: Salmo 119:90; constancia y fidelidad de Dios en la historia de su pueblo
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente; la redacción sigue de cerca el sentido hebreo y la decisión léxica auditada en inglés, sin introducir notas textuales adicionales.
  spanish_consistency_notes:
  - Se mantiene 'fidelidad' para אֱמוּנָה, en línea con la decisión inglesa auditada.
  - Se usa un paralelismo claro entre la fidelidad de Yahvé y la estabilidad de la tierra, evitando ampliar el texto con ideas no presentes en el hebreo.
  - La puntuación reproduce una sola cola poética con dos miembros coordinados por punto y coma, apropiada para el hebreo paralelo.
