  language: es
  text: ¡Ojalá mis caminos fueran firmes para guardar tus estatutos!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַ֭חֲלַי
  english_pob_choice: Oh that
  chosen_spanish: ¡Ojalá!
  alternatives_spanish:
  - ¡Ah, si!
  - ¡Quisiera que!
  lexicon: Hebrew particle of wish/longing; contextual equivalent
  rationale: La partícula expresa deseo vehemente o anhelo; en español, «¡Ojalá!» comunica de forma natural ese matiz desiderativo sin volver la frase pesada ni interpretarla como mera exclamación.
- source_word: יִכֹּ֥נוּ
  english_pob_choice: were steadfast
  chosen_spanish: fueran firmes
  alternatives_spanish:
  - estuvieran firmes
  - se mantuvieran firmes
  lexicon: HALOT / contextual verbal force
  rationale: El verbo connota estar establecido, preparado o firme. «Fueran firmes» conserva la idea de estabilidad deseada para los caminos y suena natural en español bíblico contemporáneo.
- source_word: דְרָכָ֗י
  english_pob_choice: my ways
  chosen_spanish: mis caminos
  alternatives_spanish:
  - mis sendas
  - mis conductas
  lexicon: standard biblical metaphor
  rationale: «Caminos» mantiene la metáfora moral y conductual del hebreo sin introducir una paráfrasis explicativa.
- source_word: לִשְׁמֹר
  english_pob_choice: in keeping
  chosen_spanish: para guardar
  alternatives_spanish:
  - al guardar
  - a fin de guardar
  lexicon: common biblical infinitive construction
  rationale: 'La construcción final expresa propósito: que los caminos se afirmen con miras a obedecer. «Para guardar» es claro y fiel al vínculo con el infinitivo hebreo.'
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  lexicon: HALOT
  rationale: Se conserva «estatutos» siguiendo la decisión auditada del POB inglés. En español, «estatutos» transmite bien el carácter prescrito y normativo de חֻקִּים sin sustituirlo por una etiqueta más tradicional pero menos precisa.
theological_decisions:
- issue: Naturaleza del deseo del salmista en una oración optativa
  english_pob_reading: Oh that my ways were steadfast in keeping your statutes!
  chosen_spanish_reading: ¡Ojalá mis caminos fueran firmes para guardar tus estatutos!
  alternative_spanish_readings:
  - ¡Quisiera que mis caminos fueran firmes para guardar tus estatutos!
  - ¡Ah, si mis caminos fueran firmes para guardar tus estatutos!
  rationale: El verso expresa un anhelo devoto, no una declaración factual ni una orden. «Ojalá» preserva la fuerza espiritual y peticionaria del hebreo sin convertirlo en exhortación dirigida a otro sujeto.
  doctrine_reference: Poetry/prayer; psalmic lament/wish language
translation_notes:
  revision_awareness: No applied revisions are listed for this verse; the draft follows the supplied WLC Hebrew text and the English POB audit choices, especially the established rendering of חֻקֶּיךָ as «statutos».
  spanish_consistency_notes:
  - Se mantiene el tuteo reverente («tus») acorde con el registro bíblico contemporáneo usado en este proyecto.
  - «Estatutos» se conserva como término técnico consistente con el POB inglés y con el valor jurídico-normativo del hebreo.
  - No se introducen notas al pie porque el verso no presenta una alternativa textual obligatoria ni una ambigüedad que deba destacarse en este registro.
