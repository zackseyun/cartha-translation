  text: ¡Muchas son tus misericordias, Yahvé; dame vida conforme a tus ordenanzas!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַחֲמֶיךָ
  english_pob_choice: your mercy
  chosen_spanish: tus misericordias
  alternatives_spanish:
  - tu misericordia
  - tu compasión
  lexicon: HALOT
  rationale: El hebreo plural intensivo de רַחֲמִים comunica la abundancia de la compasión divina. En español, el plural 'misericordias' conserva mejor esa plenitud que un singular abstracto; 'compasión' es posible, pero 'misericordias' mantiene la resonancia bíblica sin perder claridad.
- source_word: רַבִּים
  english_pob_choice: Great
  chosen_spanish: Grandes
  alternatives_spanish:
  - abundantes
  - muchas
  lexicon: HALOT
  rationale: El adjetivo concuerda con el plural 'misericordias' y expresa magnitud/cantidad. 'Grandes' reproduce con naturalidad el énfasis del hebreo sin añadir una interpretación distinta.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / Hebrew divine-name policy
  rationale: Se preserva el nombre divino como nombre propio, según la política del proyecto. 'Yahvé' es la forma española establecida aquí y evita el reemplazo litúrgico por 'SEÑOR'.
- source_word: כְּמִשְׁפָּטֶיךָ
  english_pob_choice: your ordinances
  chosen_spanish: tus ordenanzas
  alternatives_spanish:
  - tus juicios
  - tus reglas
  - tus decretos justos
  lexicon: HALOT
  rationale: מִשְׁפָּט puede referirse a las disposiciones justas de Dios. 'Ordenanzas' comunica bien el sentido de normas reveladas y mantiene la distinción frente a otros términos legales como 'estatutos' o 'mandamientos'.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - revíveme
  - hazme vivir
  lexicon: HALOT
  rationale: El verbo causativo expresa la petición de ser vivificado. 'Dame vida' es natural en español y conserva el valor de pedir restauración o animación divina sin sobreinterpretar.
theological_decisions:
- issue: Nombre divino en el texto poético
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: La versión inglesa del POB trata יְהוָה como nombre propio, no como título. El español mantiene esa decisión para conservar la transparencia del texto y la consistencia con el proyecto.
  doctrine_reference: 'DOCTRINE.md: el nombre divino se traduce como nombre propio, no se enmascara con un título.'
- issue: Sentido de מִשְׁפָּט como norma divina
  english_pob_reading: ordinances
  chosen_spanish_reading: ordenanzas
  alternative_spanish_readings:
  - juicios
  - decretos
  - reglas
  rationale: En este contexto poético, el término no enfatiza castigo sino las disposiciones justas y reveladas de Dios. 'Ordenanzas' comunica adecuadamente ese alcance legal y covenantal sin cargar la línea con un matiz punitivo.
  doctrine_reference: HALOT; POB lexical distinction between divine law terms
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca el hebreo y la decisión inglesa auditada, preservando la paralelía poética y el nombre divino como nombre propio.
  spanish_consistency_notes:
  - Se mantiene el tratamiento de YHWH como 'Yahvé' en mayúscula inicial.
  - Se usa el imperativo singular 'dame vida' para reflejar el sufijo pronominal de 1cs.
  - Se conserva un registro bíblico sobrio y no arcaizante, con puntuación exclamativa acorde al paralelismo.
  - '''Misericordias'' en plural refleja la intensidad semántica del hebreo y armoniza con ''Grandes''.'
