translation:
  language: es
  text: Te llamo[a] con todo mi corazón; respóndeme, Yahvé. Guardaré tus estatutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En los versículos 145–152, cada versículo comienza con la letra qof (ק), la decimonovena letra del alfabeto hebreo; continúa así el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: קָרָ֣אתִי
  english_pob_choice: I call
  chosen_spanish: Te llamo
  alternatives_spanish:
  - clamo
  - invoco
  lexicon: HALOT
  rationale: El verbo expresa una llamada dirigida a Dios en oración; en español, 'te llamo' conserva la acción directa del hablante, mientras 'clamo' o 'invoco' son alternativas válidas pero algo más marcadas o litúrgicas.
- source_word: בְכָל לֵב
  english_pob_choice: with my whole heart
  chosen_spanish: con todo mi corazón
  alternatives_spanish:
  - de todo corazón
  - con mi corazón entero
  lexicon: HALOT
  rationale: La expresión idiomática hebrea comunica totalidad interior y devoción íntegra; 'con todo mi corazón' es natural en español y mantiene la fuerza semítica sin volverla explicativa en exceso.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino
  rationale: Se preserva el nombre divino como nombre propio en español, conforme a la política del proyecto, evitando el reemplazo por un título. 'Yahvé' es la forma estándar del proyecto; 'Jehová' queda como alternativa histórica, no preferida.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: '''Estatutos'' refleja bien la idea de disposiciones prescritas e inscriptas en la ley; además es el equivalente ya auditado en el inglés POB. ''Decretos'' y ''prescripciones'' son posibles, pero ''estatutos'' conserva el campo semántico legal sin sonar más técnico de lo necesario.'
- source_word: אֶצֹּרָה
  english_pob_choice: I will keep
  chosen_spanish: Guardaré
  alternatives_spanish:
  - observaré
  - cumpliré
  lexicon: HALOT
  rationale: '''Guardaré'' reproduce la idea de custodiar, observar y mantener fielmente los mandamientos. En español bíblico contemporáneo es claro y fiel; ''observaré'' o ''cumpliré'' pueden funcionar, pero ''guardar'' conserva la continuidad terminológica del salterio.'
theological_decisions:
- issue: Nombre divino en la oración del salmista
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: El hebreo tiene el tetragrámaton, no un título genérico. Mantener 'Yahvé' evita ocultar la forma del texto fuente y preserva la decisión auditada del POB en inglés.
  doctrine_reference: 'DOCTRINE.md: el nombre divino debe tratarse como nombre propio, no como mera sustitución litúrgica.'
translation_notes:
  revision_awareness: No se registran revisiones aplicadas ni variantes textuales en el paquete fuente; la redacción española sigue directamente el texto hebreo masorético auditado y la decisión inglesa ya documentada para el nombre divino y 'statutes'.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' para יְהוָה conforme a la política del proyecto.
  - '''Estatutos'' conserva la terminología jurídica del salmo y la correspondencia con el inglés POB.'
  - Se usa la primera persona singular con futuro de intención ('Guardaré') para אֶצֹּרָה, acorde al valor exhortativo/promisorio del contexto.
  - 'La puntuación sigue el orden y la pausa natural del hebreo: súplica breve tras la dirección a Dios, luego la promesa final.'
