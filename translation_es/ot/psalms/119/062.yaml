translation:
  language: es
  text: A medianoche me levantaré para darte gracias por tus justos decretos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲצֽוֹת לַ֗יְלָה
  english_pob_choice: At midnight
  chosen_spanish: A medianoche
  alternatives_spanish:
  - A la medianoche
  - A mitad de la noche
  lexicon: HALOT
  rationale: חֲצֹות לַיְלָה señala el punto medio de la noche; en español, «A medianoche» comunica de forma natural el momento exacto sin añadir más contenido que el hebreo.
- source_word: אָ֭קוּם
  english_pob_choice: I rise
  chosen_spanish: me levantaré
  alternatives_spanish:
  - me levantaré de nuevo
  - me pondré en pie
  lexicon: BDB
  rationale: El verbo expresa levantarse físicamente; «me levantaré» conserva la acción concreta y el tono voluntario del texto sin sobreinterpretar.
- source_word: לְהוֹדוֹת
  english_pob_choice: to praise you
  chosen_spanish: para darte gracias
  alternatives_spanish:
  - para alabarte
  - para darte alabanza
  lexicon: HALOT
  rationale: הוֹדָה aquí puede tener el matiz de acción de gracias además de alabanza. Dado que el complemento es a Dios y el contexto es devocional, «dar gracias» preserva bien el sentido de reconocimiento y gratitud; «alabar» queda como alternativa válida, pero más general.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_spanish: justos decretos
  alternatives_spanish:
  - ordenanzas
  - juicios
  - mandatos
  lexicon: HALOT
  rationale: La POB inglesa eligió «ordinances» para מִשְׁפְּטֵי como término de la ley revelada de Dios. En español, «decretos» mantiene la idea de disposiciones autoritativas, y «justos» refleja el calificativo צִדְקֶךָ. Se evita «juicios» por su posible tono punitivo y «ordenanzas» porque en español puede sonar demasiado técnico o eclesiástico según el contexto.
- source_word: צִדְקֶֽךָ
  english_pob_choice: your righteous
  chosen_spanish: justos
  alternatives_spanish:
  - de justicia
  - rectos
  lexicon: HALOT
  rationale: צֶדֶק/צִדְקָה comunica justicia/rectitud. Aquí modifica a «decretos», por lo que «justos» es la forma más natural y fiel en español; mantiene la relación semántica sin forzar una construcción más pesada.
theological_decisions:
- issue: Cómo reflejar מִשְׁפָּטֵי צִדְקֶךָ sin perder la relación entre la autoridad divina y su rectitud
  english_pob_reading: your righteous ordinances
  chosen_spanish_reading: tus justos decretos
  alternative_spanish_readings:
  - tus ordenanzas justas
  - tus justos juicios
  rationale: La frase hebrea une la noción de disposiciones judiciales/divinas con el atributo de rectitud. «Tus justos decretos» conserva ambos elementos de manera clara para el lector español, sin cargar el verso con un tecnicismo innecesario.
  doctrine_reference: Salmos 119; cf. la coherencia interna del Salterio sobre la justicia de los mandamientos de Yahvé.
translation_notes:
  revision_awareness: No hay revisiones previas ni notas textuales en el paquete de origen; la decisión española sigue directamente el hebreo masorético y el rastro auditado en inglés.
  spanish_consistency_notes:
  - Se mantiene «Yahvé» según la terminología POB para el nombre divino cuando aparezca; en este versículo el texto no contiene el Tetragrámaton explícito en la forma castellana.
  - Se usa una construcción natural en español («A medianoche me levantaré») para preservar el sentido aspectual y devocional del hebreo.
  - Se evita «esclavo» u այլ vocabulario no pertinente; el verso no contiene términos de siervo/esclavitud.
