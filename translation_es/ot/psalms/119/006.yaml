lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_spanish: Entonces
  alternatives_spanish:
  - Así
  - Luego
  lexicon: HALOT
  rationale: אָז introduce una consecuencia temporal o lógica; 'Entonces' conserva esa relación de manera natural en español sin añadir énfasis extra.
- source_word: לֹא אֵבוֹשׁ
  english_pob_choice: I would not be put to shame
  chosen_spanish: no me avergonzaré
  alternatives_spanish:
  - no seré avergonzado
  - no quedaré en vergüenza
  lexicon: HALOT
  rationale: El hebreo expresa el estado de quedar en vergüenza o deshonra. En español, 'no me avergonzaré' comunica bien ese resultado en primera persona y mantiene la fuerza afectiva del verbo sin forzar una pasiva poco natural.
- source_word: בְּהַבִּיטִי
  english_pob_choice: when I fix my eyes on
  chosen_spanish: cuando fije mis ojos en
  alternatives_spanish:
  - al mirar
  - cuando mire
  lexicon: HALOT
  rationale: El infinitivo constructo con sufijo indica la acción del sujeto al mirar atentamente. 'Fije mis ojos en' preserva la imagen de atención deliberada del original y del inglés POB.
- source_word: כָּל מִצְוֹתֶיךָ
  english_pob_choice: all your commandments
  chosen_spanish: todos tus mandamientos
  alternatives_spanish:
  - todas tus órdenes
  - todos tus preceptos
  lexicon: HALOT
  rationale: La serie léxica del Salmo 119 usa מִצְוָה para los mandamientos de Dios; 'mandamientos' mantiene la consistencia terminológica y el carácter autoritativo del término.
translation_notes:
  revision_awareness: No se registran revisiones posteriores ni variantes textuales en el paquete fuente; la redacción sigue de cerca el hebreo consonántico vocalizado de WLC y la decisión léxica inglesa ya auditada.
  spanish_consistency_notes:
  - Se mantiene 'mandamientos' para מִצְוֺתֶיךָ, en línea con la consistencia terminológica del Salmo 119.
  - Se evita la pasiva impersonal 'ser avergonzado' por claridad y naturalidad en español, sin perder el sentido de deshonra del hebreo.
