translation:
  language: es
  text: Has tratado bien a tu siervo, Yahvé, conforme a tu palabra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 65–72 comienzan con teth (ט), la novena letra del alfabeto, continuando el acróstico introducido en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹב עָשִׂיתָ עִם
  english_pob_choice: have dealt well with
  chosen_spanish: has hecho bien con
  alternatives_spanish:
  - has obrado bien con
  - has tratado bien a
  lexicon: HALOT / uso contextual del verbo עשה
  rationale: El hebreo expresa una acción benéfica o favorable de Yahvé hacia su siervo. En español, 'has hecho bien con' conserva la idea de trato favorable sin forzar una construcción demasiado literal.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: HALOT
  rationale: '''Siervo'' conserva el registro bíblico y la relación de pertenencia/servicio sin introducir la dureza de ''esclavo'' como voz principal. ''Servidor'' es posible, pero menos marcado en el lenguaje bíblico.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT / convención POB
  rationale: Se mantiene el nombre divino como nombre propio, según la política del proyecto, y no se mascara con un título.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: '''Conforme a'' reproduce bien la relación normativa del hebreo כְּ- con דָּבָר, y mantiene un español natural y reverente.'
theological_decisions:
- issue: Nombre divino en el texto poético
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: El texto hebreo contiene el tetragrámaton. La traducción conserva el nombre propio para mantener transparencia textual y coherencia con la política del POB.
  doctrine_reference: DOCTRINE.md / política del nombre divino
- issue: Relación entre la benevolencia divina y la obediencia del siervo
  english_pob_reading: have dealt well with your servant
  chosen_spanish_reading: has hecho bien con tu siervo
  alternative_spanish_readings:
  - has tratado bien a tu siervo
  - has obrado favorablemente con tu siervo
  rationale: La frase debe expresar el favor efectivo de Yahvé sobre su siervo sin convertirlo en una generalización doctrinal ajena al verso.
  doctrine_reference: Salmo 119:65; lectura literal-poética
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de origen; la redacción española sigue de cerca el texto hebreo y la decisión lexical auditada en inglés.
  spanish_consistency_notes:
  - Se usa 'Yahvé' de manera consistente para יְהוָה.
  - '''Siervo'' mantiene la terminología POB para עבד.'
  - '''Palabra'' conserva la distinción frente a otros términos de utterance cuando aparezcan en el salterio.'
  - La puntuación conserva el paralelismo breve y la cadencia poética del original.
