translation:
  language: es
  text: Sé, Yahvé, que tus ordenanzas son justas y que, en tu fidelidad, me afligiste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_spanish: Sé
  alternatives_spanish:
  - Conozco
  - He sabido
  lexicon: HALOT
  rationale: El hebreo expresa un conocimiento asentado y seguro; en español, «sé» comunica de forma natural esa certeza personal sin añadir matices temporales que el verso no exige.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se conserva el nombre divino como nombre propio, conforme al criterio del proyecto para יהוה, en lugar de sustituirlo por un título genérico.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: mandamientos
  alternatives_spanish:
  - ordenanzas
  - juicios
  - reglas
  - decretos justos
  lexicon: HALOT
  rationale: La expresión designa las disposiciones normativas de Dios; en este verso, «mandamientos» comunica bien el sentido legal/normativo y suena natural en español. «Ordenanzas» preserva más de cerca el audit trail inglés, pero en español puede sonar más técnico o menos inmediato; se deja constancia como alternativa.
- source_word: צֶדֶק
  english_pob_choice: righteous
  chosen_spanish: justos
  alternatives_spanish:
  - rectos
  - justicia
  lexicon: HALOT
  rationale: 'El sustantivo se verbaliza en español como predicado adjetival: «son justos». Esto conserva la afirmación evaluativa del hebreo sin forzar un sustantivo abstracto menos natural en esta estructura.'
- source_word: אֱמוּנָה
  english_pob_choice: faithfulness
  chosen_spanish: fidelidad
  alternatives_spanish:
  - lealtad
  - verdad
  - constancia
  lexicon: HALOT
  rationale: En contexto relacional y covenantal, «fidelidad» es la equivalencia más clara en español para la firmeza confiable de Dios; evita reducir el término a «fe» humana.
- source_word: עִנִּיתָנִי
  english_pob_choice: you have afflicted me
  chosen_spanish: me afligiste
  alternatives_spanish:
  - me humillaste
  - me causaste aflicción
  - me castigaste
  lexicon: HALOT
  rationale: Se mantiene el valor de aflicción/sufrimiento causado por Dios sin cargar el verso con una interpretación más específica (como castigo) que el hebreo no impone por sí mismo.
theological_decisions:
- issue: Relación entre justicia divina y aflicción recibida
  english_pob_reading: your ordinances are righteous, and that in faithfulness you have afflicted me
  chosen_spanish_reading: tus mandamientos son justos, y que con fidelidad me afligiste
  alternative_spanish_readings:
  - tus ordenanzas son justas, y que con fidelidad me humillaste
  - tus decretos son rectos, y que por fidelidad me afligiste
  rationale: 'El verso une dos afirmaciones: la rectitud de las disposiciones divinas y la lectura creyente de la aflicción como acto no caprichoso sino fiel. «Con fidelidad» conserva esa tensión teológica sin explicitar de más la finalidad de la aflicción.'
  doctrine_reference: Providencia divina; disciplina y sufrimiento en el marco del pacto
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de auditoría inglesa; esta versión española sigue directamente el hebreo con apoyo del trazado léxico inglés, manteniendo la tensión entre justicia normativa y aflicción fiel sin añadir glosas interpretativas.
  spanish_consistency_notes:
  - Se usa «Yahvé» para יְהוָה conforme al estándar del proyecto.
  - Se prefiere «mandamientos» en vez de «ordenanzas» por fluidez natural en español, aunque la alternativa queda documentada para transparencia.
  - «Fidelidad» se usa en sentido de lealtad confiable de Dios, no como simple «fe».
  - No se introduce una nota al pie porque el verso no requiere una variante textual o ambigüedad adicional en la redacción española.
