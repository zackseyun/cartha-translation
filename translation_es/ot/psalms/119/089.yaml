translation:
  language: es
  text: Para siempre[a], Yahvé, tu palabra permanece firme en los cielos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 89–96 comienzan con la letra lamed (ל), la duodécima letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: לְעוֹלָם
  english_pob_choice: Forever
  chosen_spanish: Para siempre
  alternatives_spanish:
  - Siempre
  - Por la eternidad
  lexicon: HALOT
  rationale: El hebreo לְעוֹלָם expresa duración indefinida/continuada; 'Para siempre' conserva el valor temporal y funciona con naturalidad en español bíblico contemporáneo.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: 'Se sigue el criterio del proyecto para el nombre divino: el tetragrámaton se vierte como ''Yahvé'' en el texto principal, manteniendo que se trata de un nombre propio y no de un título encubierto.'
- source_word: דְּבָרְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu dicho
  - tu promesa
  lexicon: HALOT
  rationale: דָּבָר denota aquí la palabra pronunciada por Dios; 'tu palabra' conserva la referencia al habla divina y mantiene la distinción frente a otros términos como אִמְרָה.
- source_word: נִצָּב
  english_pob_choice: stands firm
  chosen_spanish: permanece firme
  alternatives_spanish:
  - está firme
  - se mantiene
  lexicon: HALOT
  rationale: El participio comunica estabilidad/persistencia más que simple ubicación; 'permanece firme' reproduce esa fuerza con un español natural y solemne.
- source_word: בַּשָּׁמָיִם
  english_pob_choice: in the heavens
  chosen_spanish: en los cielos
  alternatives_spanish:
  - en el cielo
  - en los cielos
  lexicon: HALOT
  rationale: '''Cielos'' conserva el plural hebreo y el matiz cósmico/poético del original mejor que un singular meramente físico.'
translation_notes:
  revision_awareness: 'Se tuvo en cuenta la auditoría inglesa: ''Forever'' se traduce como duración indefinida, ''Yahweh'' como nombre divino propio, y ''word'' para דָּבָר para mantener la consistencia léxica con otras palabras de revelación.'
  spanish_consistency_notes:
  - Se conserva 'Yahvé' según la convención del proyecto para el nombre divino.
  - '''Palabra'' se mantiene como traducción principal de דָּבָר por consistencia bíblico-teológica.'
  - La nota al pie se ancla en 'Para siempre' porque corresponde al elemento poético/estructural señalado en la auditoría inglesa.
