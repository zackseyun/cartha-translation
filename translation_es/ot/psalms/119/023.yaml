translation:
  language: es
  text: Aunque los príncipes se sienten y conspiren contra mí, tu siervo medita en tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם / Though
  english_pob_choice: Though
  chosen_spanish: Aunque
  alternatives_spanish:
  - Si bien
  - Aun cuando
  lexicon: WLC + English POB audit trail
  rationale: El hebreo abre con גַּם, que aquí funciona de modo concesivo/contrastivo; 'Aunque' comunica bien la oposición entre la acción de los príncipes y la respuesta del siervo.
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_spanish: príncipes
  alternatives_spanish:
  - gobernantes
  - soberanos
  - oficiales
  lexicon: HALOT
  rationale: El término designa personas de alto rango o autoridad. 'Príncipes' sigue de cerca la opción inglesa y mantiene una referencia amplia a la élite gobernante sin precisar más de lo que permite el hebreo.
- source_word: יָשְׁבוּ
  english_pob_choice: sit
  chosen_spanish: se sienten
  alternatives_spanish:
  - se sientan
  - están sentados
  lexicon: WLC
  rationale: El verbo describe sentarse como postura estable; en español 'se sienten' conserva la imagen y encaja con la construcción concesiva del verso.
- source_word: נִדְבָּרוּ
  english_pob_choice: plot
  chosen_spanish: conspiren
  alternatives_spanish:
  - conversen
  - deliberen
  - se confabulen
  lexicon: HALOT
  rationale: El verbo puede sugerir hablar entre sí, pero en este contexto la reunión de príncipes contra el salmista apunta a una conspiración. 'Conspiren' preserva esa carga hostil que la POB inglesa también hace explícita con 'plot'.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: Standard biblical Hebrew
  rationale: Se mantiene 'siervo' como terminología bíblica de dependencia leal y disponibilidad ante Dios. 'Esclavo' introduciría una dureza no requerida en el registro lector, y 'servidor' suena más doméstico y menos teológico.
- source_word: יָשִׂיחַ
  english_pob_choice: meditates
  chosen_spanish: medita
  alternatives_spanish:
  - reflexiona
  - murmura
  - habla
  lexicon: HALOT
  rationale: El verbo puede abarcar meditación, conversación consigo mismo o hablar. En este contexto devocional, 'medita' transmite la atención continua a la ley de Dios y sigue la lectura de la POB inglesa.
- source_word: בְּחֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  - tus prescripciones
  lexicon: HALOT
  rationale: חֻקִּים alude a mandatos fijados, prescritos. 'Estatutos' reproduce la decisión auditada de la POB en un español bíblico claro y estable.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete auditado; la versión española sigue de cerca la lectura inglesa POB y el hebreo masorético sin introducir variantes textuales ni notas de crítica textual.
  spanish_consistency_notes:
  - Se conserva 'Yahvé' solo cuando el texto fuente lo exige; este versículo no lo contiene explícitamente.
  - '''Siervo'' se mantiene como traducción consistente de עבד en el registro lector.'
  - '''Estatutos'' se usa para חֻקִּים en continuidad con la decisión inglesa auditada.'
