lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_spanish: los malvados
  alternatives_spanish:
  - los impíos
  - los injustos
  lexicon: HALOT
  rationale: Rְשָׁעִים designa a personas culpables de maldad; en español, 'malvados' comunica bien el carácter moral del grupo sin introducir un tecnicismo eclesiástico más marcado que el hebreo.
- source_word: לְאַבְּדֵנִי
  english_pob_choice: to destroy me
  chosen_spanish: para destruirme
  alternatives_spanish:
  - para perderme
  - para arruinarme
  lexicon: HALOT
  rationale: El infinitivo con ל expresa intención o propósito hostil. 'Destruirme' conserva la fuerza directa del hebreo y coincide con la lectura inglesa auditada.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus mandatos del pacto
  lexicon: HALOT
  rationale: Se mantiene 'testimonios' por coherencia con la decisión inglesa y por la transparencia del término hebreo plural, que en este salmo se usa de manera consistente para las declaraciones normativas de Dios.
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I ponder
  chosen_spanish: medito
  alternatives_spanish:
  - considero
  - reflexiono
  lexicon: HALOT
  rationale: El verbo denota atención deliberada, discernimiento y contemplación mental. 'Medito' es natural en español bíblico y conserva el matiz reflexivo mejor que una simple 'pienso'.
theological_decisions:
- issue: Contraste entre la hostilidad de los malvados y la respuesta del salmista
  english_pob_reading: The wicked lie in wait to destroy me, but I ponder your testimonies.
  chosen_spanish_reading: Los malvados me acechan para destruirme, pero yo medito en tus testimonios.
  alternative_spanish_readings:
  - Los impíos me tienden una emboscada para destruirme, pero yo medito en tus testimonios.
  - Los malvados acechan para destruirme; yo, en cambio, medito en tus testimonios.
  rationale: El hebreo presenta un contraste claro entre la intención destructiva de los malvados y la concentración del hablante en la instrucción divina. La puntuación con coma y 'pero' preserva ese contraste sin añadir interpretación extra.
  doctrine_reference: Psalm 119:95
- issue: Valor teológico de 'testimonios' dentro del Salmo 119
  english_pob_reading: your testimonies
  chosen_spanish_reading: tus testimonios
  alternative_spanish_readings:
  - tus decretos
  - tus mandatos
  rationale: En el Salmo 119, 'testimonios' traduce de modo consistente עֵדוֹת/עֵדֹתֶיךָ y mantiene la red de términos del salmo sin sustituirla por vocabulario más general.
  doctrine_reference: Psalm 119 lexical coherence
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de auditoría; la redacción española sigue de cerca la lectura inglesa auditada y se apoya directamente en el hebreo masorético para 'acechan', 'destruirme' y 'testimonios'.
  spanish_consistency_notes:
  - Se conserva el tono bíblico moderno y digno, sin arcaísmos innecesarios.
  - '''Testimonios'' se mantiene para coherencia interna con el Salmo 119.'
  - No se introducen notas al pie porque el verso no presenta una variante textual o ambigüedad que el español requiera marcar aquí.
