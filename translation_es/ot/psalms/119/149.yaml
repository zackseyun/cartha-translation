lexical_decisions:
- source_word: קֹלִי / "my voice"
  english_pob_choice: Hear my voice
  chosen_spanish: mi voz
  alternatives_spanish:
  - mi clamor
  - mi grito
  lexicon: HALOT / uso contextual
  rationale: קול aquí denota la voz o el sonido de la voz que pide audiencia; "mi voz" conserva la concreción del hebreo y funciona naturalmente en español. "Clamor" o "grito" intensifican sin necesidad el término y no están exigidos por el texto.
- source_word: שִׁמְעָה / "hear"
  english_pob_choice: Hear
  chosen_spanish: Oye
  alternatives_spanish:
  - Escucha
  - Oye, por favor
  lexicon: HALOT
  rationale: El imperativo pide atención a la voz del salmista. "Oye" es directo, breve y adecuado en un ruego poético; "escucha" es posible, pero aquí "oye" reproduce mejor la súplica concisa del hebreo.
- source_word: כְּחַסְדֶּךָ / "according to your steadfast love"
  english_pob_choice: according to your steadfast love
  chosen_spanish: conforme a tu misericordia
  alternatives_spanish:
  - según tu amor leal
  - conforme a tu amor constante
  - según tu misericordiosa fidelidad
  lexicon: HALOT
  rationale: חסד incluye la idea de lealtad pactal, benevolencia y misericordia. En español, "misericordia" es la opción más natural y reverente para una súplica, aunque se reconoce que el término bíblico es más amplio que la sola compasión emocional.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / tradición de la POB
  rationale: Se mantiene el nombre divino como nombre propio en la línea de la POB y del texto fuente, evitando la sustitución por un título. "Yahvé" es la forma española establecida en el proyecto.
- source_word: כְּמִשְׁפָּטֶךָ / "according to your ordinances"
  english_pob_choice: according to your ordinances
  chosen_spanish: conforme a tus ordenanzas
  alternatives_spanish:
  - según tus decretos
  - según tus juicios
  - conforme a tus justos mandatos
  lexicon: HALOT
  rationale: מִשְׁפָּט en este contexto se refiere a las disposiciones/reglas divinas, no a un acto de condena. "Ordenanzas" preserva el sentido normativo y sigue la decisión auditada del POB inglés para evitar el tono punitivo de "juicios".
- source_word: חַיֵּנִי / "give me life"
  english_pob_choice: give me life
  chosen_spanish: vivifícame
  alternatives_spanish:
  - dame vida
  - reavívame
  - hazme vivir
  lexicon: HALOT
  rationale: El verbo pide impartir vida o renovar vitalidad. "Vivifícame" es una solución reverente y bíblica en español, más compacta que "dame vida" y alineada con el estilo poético del salmo.
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente; la redacción española se elaboró directamente desde el hebreo con apoyo del trazo auditado en inglés POB para mantener consistencia terminológica y evitar sobreinterpretación.
  spanish_consistency_notes:
  - Se conserva "Yahvé" como nombre divino propio, en continuidad con la política del proyecto.
  - '"Misericordia" se usa como equivalente funcional de חֶסֶד en una súplica; no se añadió una glosa para no sobrecargar el verso.'
  - '"Ordenanzas" mantiene la distinción con otros términos legales del salterio y evita un matiz punitivo.'
  - El tono es poético y devocional, sin arcaísmos innecesarios ni paráfrasis expansivas.
