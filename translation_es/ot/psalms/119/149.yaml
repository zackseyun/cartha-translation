  to: Oye mi voz conforme a tu amor leal, Yahvé; vivifícame conforme a tus ordenanzas.
  rationale: Se sustituye únicamente «misericordia» por «amor leal» para reflejar de manera más completa el sentido de חֶסֶד y la decisión léxica auditada «steadfast love». No se requieren notas, pues la alternativa no introduce una ambigüedad nueva ni la auditoría inglesa conserva una nota de publicación.
