review_pass:
  verdict: revise
  source_alignment_summary: 'La sintaxis y los referentes del borrador corresponden al hebreo: el salmista pide a Yahvé que oiga su voz y que le dé vida conforme a sus mishpatim. «Yahvé», «ordenanzas» y «vivifícame» conservan adecuadamente el nombre divino, el sentido normativo de מִשְׁפָּט y el imperativo causativo חַיֵּנִי.'
  spanish_quality_summary: 'El texto es claro, digno y natural para un salmo. Se recomienda un ajuste puntual de «misericordia»: aunque puede expresar חֶסֶד en una súplica, no conserva suficientemente el matiz central de amor fiel o leal que documenta la decisión inglesa «steadfast love». «Amor leal» comunica mejor esa fidelidad comprometida sin sacrificar legibilidad.'
  glossary_alignment: «Yahvé» sigue la terminología obligatoria del proyecto para יְהוָה. «Ordenanzas» sigue la distinción documentada para מִשְׁפָּט en el contexto de la ley divina. «Vivifícame» es una traducción apropiada y poética de חַיֵּנִי. Para חֶסֶד, «amor leal» preserva mejor el componente de fidelidad pactal que «misericordia» por sí sola.
  issues:
  - severity: medium
    issue: «Misericordia» reduce el alcance de חֶסֶד.
    rationale: El contexto permite misericordia, pero la evidencia léxica y la auditoría inglesa destacan el amor firme/fiel. «Amor leal» mantiene tanto la benevolencia como la lealtad duradera, mientras que «misericordia» puede enfocarse solamente en compasión o clemencia.
  revised_spanish_text: Oye mi voz conforme a tu amor leal, Yahvé; vivifícame conforme a tus ordenanzas.
  revision_rationale: Se sustituye únicamente «misericordia» por «amor leal» para reflejar de manera más completa el sentido de חֶסֶד y la decisión léxica auditada «steadfast love». No se requieren notas, pues la alternativa no introduce una ambigüedad nueva ni la auditoría inglesa conserva una nota de publicación.
