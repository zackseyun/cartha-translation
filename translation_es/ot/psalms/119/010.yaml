translation:
  language: es
  text: Con todo mi corazón te busco; no permitas que me desvíe de tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל לִבִּי
  english_pob_choice: With all my heart
  chosen_spanish: Con todo mi corazón
  alternatives_spanish:
  - Con todo el corazón
  - De todo corazón
  lexicon: HALOT / uso idiomático español
  rationale: La expresión hebrea indica totalidad e intensidad de la búsqueda. En español, «con todo mi corazón» reproduce de forma natural esa fuerza afectiva y volitiva sin perder la idea de plenitud.
- source_word: דְרַשְׁתִּיךָ
  english_pob_choice: I seek you
  chosen_spanish: te busco
  alternatives_spanish:
  - te busco con diligencia
  - te consulto
  lexicon: HALOT
  rationale: דָּרַשׁ en este contexto expresa buscar con empeño y dirigirse a Dios. «Te busco» es la forma española más directa y fiel; «consulto» sería demasiado estrecho y no refleja bien el paralelismo del salmo.
- source_word: תַּשְׁגֵּנִי
  english_pob_choice: do not let me stray
  chosen_spanish: no permitas que me desvíe
  alternatives_spanish:
  - no me hagas errar
  - no me apartes
  lexicon: HALOT
  rationale: El verbo puede expresar extravío o desvío. La POB inglesa evita una formulación más literal como «hazme errar» y capta el resultado. En español, «no permitas que me desvíe» mantiene la súplica y el sentido de apartarse del camino de los mandamientos.
- source_word: מִמִּצְוֺתֶיךָ
  english_pob_choice: from your commandments
  chosen_spanish: de tus mandamientos
  alternatives_spanish:
  - de tus órdenes
  - de tus preceptos
  lexicon: HALOT
  rationale: «Mandamientos» corresponde al valor normativo de מִצְוֹת y conserva la terminología usada en la poesía de la Torá. «Preceptos» es posible, pero aquí «mandamientos» coincide con la decisión auditada en inglés.
translation_notes:
  revision_awareness: No se documentan revisiones aplicadas en el paquete fuente. La traducción sigue directamente el texto hebreo con apoyo del criterio léxico ya auditado en la POB inglesa.
  spanish_consistency_notes:
  - Se mantiene el tratamiento directo de la segunda persona singular a Dios («te», «tus»), conforme al hebreo.
  - «Mandamientos» se conserva como término técnico estable para מִצְוֹת.
  - La primera cláusula se formula como búsqueda total del corazón, sin añadir matices no presentes en el hebreo.
