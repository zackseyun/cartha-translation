translation:
  language: es
  text: Me regocijo en tu promesa, como quien halla gran botín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂשׂ / אָ֭נֹכִי
  english_pob_choice: I rejoice
  chosen_spanish: Me regocijo
  alternatives_spanish:
  - Me alegro
  - Estoy gozoso
  lexicon: HALOT
  rationale: El hebreo expresa una alegría intensiva y personal. «Me regocijo» conserva ese matiz más enfático y solemne que «me alegro», en línea con el tono poético del salmo.
- source_word: עַל אִמְרָתֶךָ
  english_pob_choice: at your promise
  chosen_spanish: en tu promesa
  alternatives_spanish:
  - por tu promesa
  - ante tu promesa
  - en tu palabra
  lexicon: HALOT
  rationale: La decisión inglesa de POB toma אִמְרָה como una declaración comprometida de Dios; en español, «promesa» comunica bien ese valor y evita confundirla con el término más general «palabra».
- source_word: כְּמוֹצֵא
  english_pob_choice: like one who finds
  chosen_spanish: como quien halla
  alternatives_spanish:
  - como el que encuentra
  - como quien encuentra
  lexicon: HALOT
  rationale: «Como quien halla» mantiene la imagen participial de encontrar y suena natural en español poético, sin perder el paralelo comparativo del hebreo.
- source_word: שָׁלָל רָב
  english_pob_choice: great spoil
  chosen_spanish: gran botín
  alternatives_spanish:
  - mucho botín
  - un gran despojo
  lexicon: HALOT
  rationale: «Botín» preserva la imagen militar de riqueza capturada. «Gran» recoge רָב y mantiene la intensidad sin añadir interpretación adicional.
translation_notes:
  revision_awareness: No se registran revisiones previas aplicadas; la redacción sigue directamente el texto hebreo y la decisión léxica inglesa documentada para אִמְרָתֶךָ como «promise».
  spanish_consistency_notes:
  - Se usa «promesa» para אִמְרָה en coherencia con el criterio auditado del POB inglés.
  - Se mantiene un registro poético claro y moderno, evitando arcaísmos innecesarios.
  - No se introduce mayúscula en «promesa» ni en «botín» porque el verso no exige capitalización devocional.
