translation:
  language: es
  text: Tus[a] testimonios son maravillosos; por eso mi alma los guarda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 129–136 comienzan con la letra pe (פ), la decimoséptima del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: פְּלָא֥וֹת
  english_pob_choice: wonderful
  chosen_spanish: maravillosos
  alternatives_spanish:
  - admirables
  - asombrosos
  lexicon: HALOT
  rationale: El hebreo expresa algo extraordinario, digno de admiración. 'Maravillosos' mantiene la fuerza de asombro del inglés POB sin volverlo demasiado arcaico en español.
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - estipulaciones del pacto
  lexicon: HALOT
  rationale: Se conserva la decisión auditada del POB de distinguir עֵדוּת/עֵדֹת como 'testimonios', evitando sustituirla por un término más general o por una formulación excesivamente interpretativa.
- source_word: נְצָרָתַם
  english_pob_choice: keeps them
  chosen_spanish: los guarda
  alternatives_spanish:
  - los observa
  - los preserva
  lexicon: HALOT
  rationale: El verbo implica custodiar, guardar con cuidado. 'Los guarda' es una equivalencia natural en español y conserva la imagen de vigilancia activa del sujeto.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_spanish: mi alma
  alternatives_spanish:
  - mi vida
  - yo
  lexicon: HALOT
  rationale: '''Alma'' refleja el término hebreo en el registro poético y preserva la voz interna del salmista sin reducirlo a un simple pronombre.'
translation_notes:
  revision_awareness: 'No se registran revisiones aplicadas en el paquete inglés; la redacción española sigue de cerca la lectura auditada: ''testimonios'' para עֵדְוֺתֶיךָ, ''maravillosos'' para פְּלָא֥וֹת y ''guarda'' para נְצָרָתַם, sin añadir matices no sustentados por el texto fuente.'
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' como forma predeterminada para el nombre divino cuando aparezca, aunque este versículo usa la segunda persona posesiva 'tus'.
  - Se conserva 'testimonios' como término técnico poético para עֵדֹת/עֵדוּת, coherente con la decisión inglesa auditada.
  - 'La puntuación sigue el orden sintáctico del hebreo y del POB: primera cláusula nominal, luego conclusión causal con ''por eso''.'
