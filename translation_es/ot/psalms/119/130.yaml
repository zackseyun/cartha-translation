translation:
  language: es
  text: La apertura de tus palabras da luz; da entendimiento a los simples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֵּתַח
  english_pob_choice: unfolding
  chosen_spanish: apertura
  alternatives_spanish:
  - despliegue
  - explicación
  - desentrañamiento
  lexicon: HALOT
  rationale: El sustantivo puede expresar la idea de apertura o desdoblamiento de algo que estaba cerrado. «Apertura» conserva la imagen sin sonar artificial en español y encaja bien con el efecto iluminador del versículo.
- source_word: דְּבָרֶיךָ
  english_pob_choice: words
  chosen_spanish: palabras
  alternatives_spanish:
  - palabra
  - dichos
  - declaraciones
  lexicon: HALOT
  rationale: En español, el plural «palabras» comunica con naturalidad el plural hebreo y mantiene el valor de dichos divinos, sin perder la conexión con el uso consistente de דָּבָר como palabra de Dios.
- source_word: יָאִיר
  english_pob_choice: gives light
  chosen_spanish: da luz
  alternatives_spanish:
  - alumbra
  - ilumina
  - brilla
  lexicon: HALOT
  rationale: El hiphil expresa causar luz/iluminación. «Da luz» es claro, bíblico y mantiene el paralelismo con la segunda cola del versículo.
- source_word: מֵבִין
  english_pob_choice: gives understanding
  chosen_spanish: da entendimiento
  alternatives_spanish:
  - hace entender
  - da comprensión
  - instruye
  lexicon: HALOT
  rationale: La forma causativa indica impartir entendimiento. «Da entendimiento» conserva la causalidad y el tono sapiencial del hebreo.
- source_word: פְּתָיִים
  english_pob_choice: the simple
  chosen_spanish: los simples
  alternatives_spanish:
  - los inexpertos
  - los ingenuos
  - los sencillos
  lexicon: HALOT
  rationale: «Simples» es una opción tradicional y fiel para פְּתָיִים, manteniendo la referencia a quienes carecen de prudencia o experiencia, sin añadir una carga peyorativa excesiva.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la propuesta sigue de cerca la lectura hebrea y el sentido auditado de la versión inglesa POB, preservando el paralelismo y la metáfora de iluminación.
  spanish_consistency_notes:
  - Se mantiene el paralelismo verbal con dos miembros coordinados por punto y coma, como en la estructura hebrea.
  - Se usa un registro bíblico claro y contemporáneo, evitando calcos innecesarios.
  - No se introduce «Cristo», «SEÑOR» ni otras convenciones no presentes en el versículo.
