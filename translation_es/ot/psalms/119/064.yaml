translation:
  language: es
  text: La tierra está llena de tu amor leal, Yahvé; enséñame tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ / steadfast love
  english_pob_choice: steadfast love
  chosen_spanish: amor leal
  alternatives_spanish:
  - amor constante
  - misericordia
  - bondad leal
  lexicon: HALOT; uso semántico de חֶסֶד en contexto poético-covenantal
  rationale: En español, "amor leal" preserva la fuerza relacional y de pacto de חֶסֶד mejor que "misericordia", que puede estrechar indebidamente el sentido a compasión. "Amor constante" comunica continuidad, pero "leal" captura mejor la fidelidad vinculante implícita en el salmo.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: HALOT; convención POB para el nombre divino
  rationale: Se mantiene el nombre divino como nombre propio, no como máscara litúrgica. "Yahvé" es la forma establecida en el proyecto para יְהוָה y corresponde al criterio del POB en inglés.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: '"Estatutos" reproduce bien la idea de disposiciones fijadas o promulgadas. Se conserva la consistencia con el audit trail en inglés, donde "statutes" fue la elección principal y "decrees" la alternativa.'
- source_word: לַמְּדֵנִי
  english_pob_choice: teach me
  chosen_spanish: enséñame
  alternatives_spanish:
  - instrúyeme
  - hazme aprender
  lexicon: BDB/HALOT para למד en piel causativo
  rationale: El imperativo pedido al destinatario se expresa naturalmente en español con "enséñame". "Instrúyeme" sería posible, pero "enséñame" es más directo y fiel al tono de súplica del verso.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_spanish: la tierra
  alternatives_spanish:
  - el mundo
  - la tierra habitada
  lexicon: uso poético bíblico de ארץ
  rationale: '"La tierra" conserva la amplitud poética de ארץ sin imponer una precisión cosmológica que el hebreo no exige aquí. En español suena natural y mantiene el paralelismo del verso.'
theological_decisions:
- issue: Cómo traducir חֶסֶד sin perder el matiz de pacto y fidelidad
  english_pob_reading: steadfast love
  chosen_spanish_reading: amor leal
  alternative_spanish_readings:
  - misericordia
  - amor constante
  rationale: El verso afirma una plenitud universal del חֶסֶד de Yahvé. "Amor leal" comunica tanto afecto como fidelidad comprometida, manteniendo la tensión entre amor y lealtad que el término hebreo porta en contextos del pacto.
  doctrine_reference: Éxodo 34:6-7; Salmo 136
- issue: Mantener el nombre divino como nombre propio
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - SEÑOR
  - Jehová
  rationale: La línea de la POB trata יְהוָה como nombre divino auditado y no como mero título. "Yahvé" preserva esa decisión y evita ocultar el nombre bajo una convención de sustitución.
  doctrine_reference: Éxodo 3:15; DOCTRINE.md (divine name as a name)
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el contexto inglés; la traducción española sigue directamente el texto hebreo con apoyo del audit trail inglés para los términos clave. Se evitó introducir notas innecesarias porque no hay variantes textuales ni ambigüedades adicionales documentadas en el paquete.
  spanish_consistency_notes:
  - Se mantiene "Yahvé" como forma uniforme para יְהוָה.
  - '"Estatutos" se usa para חֻקִּים/חֻקֶּיךָ de manera consistente con el proyecto.'
  - '"Amor leal" se reserva para חֶסֶד cuando el contexto es de pacto y fidelidad.'
  - El verso conserva un orden natural en español sin perder la estructura de dos miembros poéticos.
