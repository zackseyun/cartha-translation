  text: Andaré en libertad, porque he buscado tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶתְהַלְּכָה
  english_pob_choice: I will walk about
  chosen_spanish: Andaré
  alternatives_spanish:
  - Caminaré
  - Iré andando
  lexicon: BDB / HALOT
  rationale: El verbo hithpael expresa un andar continuado o una conducta de vida. En español, «andaré» conserva mejor el matiz de movimiento sostenido y de conducta que una forma demasiado literal o forzada.
- source_word: בָרְחָבָה
  english_pob_choice: in freedom
  chosen_spanish: en libertad
  alternatives_spanish:
  - en espacio amplio
  - en lo ancho
  lexicon: BDB / HALOT
  rationale: La raíz רָחָב puede expresar amplitud física y, por extensión, amplitud como libertad o desahogo. El contexto del verso favorece una lectura de libertad, como reflejó la traducción inglesa auditada.
- source_word: פִקֻּדֶיךָ
  english_pob_choice: your precepts
  chosen_spanish: tus preceptos
  alternatives_spanish:
  - tus mandatos
  - tus órdenes
  lexicon: HALOT
  rationale: Se mantiene «preceptos» para conservar la distinción poética y léxica que el POB documenta para פִקּוּדִים, evitando mezclarlo con otros términos legales bíblicos como mandamientos o estatutos.
theological_decisions:
- issue: Relación entre libertad y obediencia
  english_pob_reading: walk about in freedom, for I have sought your precepts
  chosen_spanish_reading: Andaré en libertad, porque he buscado tus preceptos.
  alternative_spanish_readings:
  - Iré andando libremente, porque he buscado tus preceptos.
  - Andaré en amplitud, porque he buscado tus preceptos.
  rationale: 'El verso une libertad con búsqueda diligente de la voluntad divina. No se atenúa esa tensión: la libertad no aparece como independencia de Dios, sino como el espacio de vida que resulta de buscar sus preceptos.'
  doctrine_reference: Salmo 119:45; relación bíblica entre obediencia y libertad
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete actual; se sigue la lectura inglesa auditada «in freedom» para בָרְחָבָה y «precepts» para פִקֻּדֶיךָ.
  spanish_consistency_notes:
  - Se usa «preceptos» de forma consistente para פִקֻּדִים, conforme al criterio POB auditado.
  - «en libertad» conserva la lectura semántica ya establecida por la traducción inglesa, sin introducir paráfrasis adicionales.
  - El verbo en futuro («Andaré») refleja el imperfecto cohortativo hebreo y su valor volitivo/predictivo en el verso.
