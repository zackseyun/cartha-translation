translation:
  language: es
  text: La ley de tu boca es mejor para mí que miles de piezas de oro y plata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֽוֹרַת
  english_pob_choice: law
  chosen_spanish: ley
  alternatives_spanish:
  - instrucción
  - enseñanza
  lexicon: HALOT
  rationale: La POB en inglés mantiene 'law' para conservar la terminología estable del salmo respecto a la revelación divina. En español, 'ley' es la equivalencia más natural y tradicional para esta línea, y preserva la fuerza normativa de תּוֹרָה sin perder inteligibilidad. 'Instrucción' y 'enseñanza' siguen siendo alternativas válidas, pero atenúan el matiz jurídico/normativo que el texto y la tradición auditada sostienen aquí.
- source_word: פִּ֑י/ךָ
  english_pob_choice: your mouth
  chosen_spanish: tu boca
  alternatives_spanish:
  - tu decir
  - tu palabra
  lexicon: HALOT
  rationale: פֶּה/פִּי con sufijo posesivo se refiere literalmente a la boca, no simplemente al mensaje abstracto. 'Tu boca' conserva la concreción del hebreo y mantiene la imagen de palabra pronunciada por Dios. 'Tu palabra' sería interpretativo y más fluido, pero desplaza la metáfora original.
- source_word: טֽוֹב
  english_pob_choice: is better
  chosen_spanish: me es mejor
  alternatives_spanish:
  - es mejor para mí
  - mejor es para mí
  lexicon: HALOT
  rationale: El hebreo expresa valor comparativo con לִי ('para mí / a mí'). 'Me es mejor' conserva la relación dativa y la comparación personal, mientras sigue siendo idiomático en español. Otras opciones son posibles, pero esta mantiene la tensión entre valor objetivo y beneficio personal.
- source_word: מֵ֝/אַלְפֵ֗י
  english_pob_choice: than thousands of
  chosen_spanish: que miles de
  alternatives_spanish:
  - más que miles de
  - que muchos miles de
  lexicon: HALOT
  rationale: La construcción comparativa hebrea se traduce naturalmente con 'que'. 'Miles de' refleja el plural intensivo del hebreo sin introducir una precisión cuantitativa ajena al texto. 'Más que miles de' sería redundante en español y 'muchos miles de' añade interpretación.
- source_word: זָהָ֥ב וָ/כָֽסֶף
  english_pob_choice: gold and silver
  chosen_spanish: oro y plata
  alternatives_spanish:
  - oro y plata fina
  - oro y dinero
  lexicon: HALOT
  rationale: '''Oro y plata'' es la equivalencia más directa y clara de los metales preciosos del hebreo. La adición de ''de'' antes de cada sustantivo (''de oro y de plata'') sirve a la fluidez del español sin alterar el contenido.'
theological_decisions:
- issue: ¿Cómo rendir תּוֹרָה en un salmo que exalta la revelación divina?
  english_pob_reading: law
  chosen_spanish_reading: ley
  alternative_spanish_readings:
  - instrucción
  - enseñanza
  rationale: La decisión conserva el término normativo recibido en la POB inglesa y mantiene la serie conceptual del Salmo 119 sobre la palabra revelada de Dios. 'Ley' no reduce aquí el sentido a mero legalismo; en el contexto del salmo, abarca la instrucción divina dada por Yahvé.
  doctrine_reference: Salmo 119; Deuteronomio 4:8; 6:1-2
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la línea inglesa auditada fue 'The law of your mouth is better to me than thousands of pieces of gold and silver.' sin notas de pie ni variantes textuales relevantes para este versículo.
  spanish_consistency_notes:
  - Se mantuvo 'ley' para תּוֹרָה en coherencia con la serie del Salmo 119 y con la opción auditada en inglés.
  - Se conservó la imagen concreta 'tu boca' para פִּי/ךָ en lugar de una paráfrasis como 'tu palabra'.
  - La comparación se hizo idiomática en español con 'me es mejor que', sin perder el dativo personal de לִי.
