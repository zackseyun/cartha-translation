translation:
  language: es
  text: Recibe, Yahvé, las ofrendas voluntarias de mi boca, y enséñame tus decretos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִדְבוֹת פִּי
  english_pob_choice: the freewill offerings of my mouth
  chosen_spanish: las ofrendas voluntarias de mi boca
  alternatives_spanish:
  - los sacrificios voluntarios de mi boca
  - las ofrendas libres de mi boca
  lexicon: HALOT
  rationale: נִדְבוֹת expresa dones/ofrendas voluntarias; en español, 'ofrendas voluntarias' comunica con claridad el carácter espontáneo del ofrecimiento sin añadir la idea de sacrificio si el contexto no la exige. 'De mi boca' se mantiene literalmente para conservar la metáfora de la alabanza o súplica verbal.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino
  rationale: El nombre propio del pacto se vierte como 'Yahvé' según la norma del proyecto. Se evita 'SEÑOR' porque aquí el texto hebreo usa el nombre divino y el encubrimiento no es necesario.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: tus decretos
  alternatives_spanish:
  - tus ordenanzas
  - tus juicios
  - tus reglas justas
  lexicon: HALOT
  rationale: מִשְׁפָּט designa aquí las disposiciones o decisiones normativas de Dios. 'Decretos' mantiene el valor jurídico/normativo en un español claro y solemne, evitando tanto 'juicios' por su posible carga penal como 'ordenanzas' si sonara demasiado eclesiástico en este contexto.
theological_decisions:
- issue: Naturaleza de las 'ofrendas' en un salmo de alabanza/petición
  english_pob_reading: Accept the freewill offerings of my mouth
  chosen_spanish_reading: Recibe, Yahvé, las ofrendas voluntarias de mi boca
  alternative_spanish_readings:
  - Acepta las ofrendas voluntarias de mi boca
  - Recibe los sacrificios voluntarios de mi boca
  rationale: Se conserva la imagen de la lengua/oración como ofrenda presentada a Dios. 'Recibe' mantiene el matiz de acogida favorable del hebreo, equivalente al 'Accept' inglés; 'ofrendas voluntarias' deja abierta la lectura de expresión verbal devocional sin imponer un lenguaje sacrificial más fuerte que el texto.
  doctrine_reference: Salmos 141:2; Hebreos 13:15
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el audit trail; la redacción española sigue directamente el texto hebreo y la decisión inglesa auditada, manteniendo la metáfora de la boca como ofrenda y el par verbal 'recibe/enséñame' de forma natural en español.
  spanish_consistency_notes:
  - Se usa 'Yahvé' para el nombre divino, conforme al estándar del proyecto.
  - '''Decretos'' se eligió para מִשְׁפָּט en este versículo por su fuerza normativa y su claridad en español.'
  - '''Ofrendas voluntarias de mi boca'' preserva la metáfora poética sin introducir elementos ajenos al hebreo.'
