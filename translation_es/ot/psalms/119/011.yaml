translation:
  language: es
  text: He atesorado tu promesa en mi corazón, para no pecar contra ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_spanish: promesa
  alternatives_spanish:
  - palabra
  - dicho
  - declaración
  lexicon: HALOT; English POB audit trail
  rationale: El texto inglés de POB ya decidió 'promise' para distinguir אִמְרָה de דָּבָר ('word'). En español, 'promesa' conserva mejor la idea de una palabra divina comprometida y responde de forma natural al valor teológico del versículo sin reducirlo a un mero 'dicho'.
- source_word: צָפַנְתִּי
  english_pob_choice: I have treasured
  chosen_spanish: he atesorado
  alternatives_spanish:
  - he guardado
  - he escondido
  - he conservado
  lexicon: HALOT
  rationale: El verbo hebreo expresa guardar algo cuidadosamente, incluso reservarlo con valor. 'He atesorado' transmite bien la acumulación de valor y la intención de preservación; 'he guardado' sería posible, pero menos explícito sobre el aprecio del contenido.
- source_word: בְּלִבִּי
  english_pob_choice: in my heart
  chosen_spanish: en mi corazón
  alternatives_spanish:
  - dentro de mí
  - en lo profundo de mi ser
  lexicon: BDB; uso idiomático español
  rationale: La expresión conserva su equivalencia idiomática y su fuerza interior. 'En mi corazón' es la forma más transparente y fiel en español, sin forzar una reinterpretación psicológica moderna.
- source_word: לְמַעַן לֹא אֶחֱטָא
  english_pob_choice: that I might not sin
  chosen_spanish: para no pecar
  alternatives_spanish:
  - a fin de no pecar
  - para que no peque
  lexicon: HALOT; español bíblico contemporáneo
  rationale: La construcción final expresa propósito. 'Para no pecar' es natural y fiel al hebreo; evita una perífrasis innecesaria y mantiene el valor teleológico del versículo.
- source_word: לָךְ
  english_pob_choice: against you
  chosen_spanish: contra ti
  alternatives_spanish:
  - ante ti
  - hacia ti
  lexicon: HALOT; español semántico
  rationale: Aunque el hebreo usa la preposición 'a/para' con el objeto de la falta, el sentido aquí es relacional y oposicional. 'Contra ti' reproduce mejor el sentido que el inglés POB ya explicitó como 'against you'.
theological_decisions:
- issue: Naturaleza de אִמְרָה como 'promesa' divina frente a 'palabra/dicho'
  english_pob_reading: your promise
  chosen_spanish_reading: tu promesa
  alternative_spanish_readings:
  - tu palabra
  - tu dicho
  rationale: 'Seguir ''promesa'' mantiene la decisión exegética del POB inglés: no se trata solo de una emisión verbal, sino de una declaración comprometida de Yahvé que el salmista internaliza. En español, esto preserva mejor la carga de confianza y obligación implícita.'
  doctrine_reference: Salmo 119:11; coherencia léxica con la tradición auditada del POB
- issue: Dirección moral del pecado expresado con לָךְ
  english_pob_reading: sin against you
  chosen_spanish_reading: pecar contra ti
  alternative_spanish_readings:
  - pecar ante ti
  - pecar hacia ti
  rationale: La relación personal con Dios requiere una formulación que exprese ofensa dirigida a él. 'Contra ti' es la opción más clara y bíblicamente inteligible en español, en concordancia con la lectura inglesa auditada.
  doctrine_reference: Salmo 119:11; lenguaje bíblico de culpa relacional
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete inglés. La redacción española sigue directamente la lectura auditada de POB ('promise', 'I have treasured', 'against you') sin introducir variantes textuales no atestiguadas.
  spanish_consistency_notes:
  - Se mantiene 'promesa' para אִמְרָה en coherencia con la decisión inglesa auditada.
  - Se conserva un español claro y publicable, evitando el calco 'he escondido' cuando el valor semántico principal es tesoros/valor guardado.
  - No se usa 'SEÑOR' como máscara del nombre divino, aunque en este versículo no aparece el Tetragrámaton.
