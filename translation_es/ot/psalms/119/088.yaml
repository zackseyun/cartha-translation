translation:
  language: es
  text: Con tu amor fiel, dame vida,[a] y guardaré el testimonio de tu boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amor fiel traduce aquí חֶסֶד como amor leal y constante dentro del pacto; no solo afecto ni solo 'gracia'.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחַסְדְּךָ
  english_pob_choice: In your steadfast love
  chosen_spanish: Con tu amor fiel
  alternatives_spanish:
  - En tu misericordia
  - Con tu gracia constante
  - Por tu amor leal
  lexicon: חֶסֶד / חסד
  rationale: La idea central es el amor leal y firme de Yahvé dentro del pacto. 'Amor fiel' comunica bien en español la constancia y lealtad inherentes a חֶסֶד sin reducirlo solo a emoción ('amor') ni solo a favor inmerecido ('gracia').
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - vivifícame
  - hazme vivir
  - reavívame
  lexicon: חיה
  rationale: El verbo pide una acción vivificante directa. 'Dame vida' es natural en español y conserva la petición de ser restaurado o sostenido por Dios.
- source_word: וְאֶשְׁמְרָה
  english_pob_choice: that I may keep
  chosen_spanish: y guardaré
  alternatives_spanish:
  - para que guarde
  - y así guardaré
  - para obedecer
  lexicon: שׁמר
  rationale: La forma cohortativa expresa intención o resultado deseado. 'Y guardaré' refleja bien la consecuencia esperada en español, manteniendo el vínculo entre la vivificación divina y la obediencia humana.
- source_word: עֵדוּת
  english_pob_choice: the testimony
  chosen_spanish: el testimonio
  alternatives_spanish:
  - los testimonios
  - el pacto-testimonio
  - la advertencia
  lexicon: עדות
  rationale: El contexto inmediato usa singular y el sentido de un testimonio solemne procedente de Dios. 'Testimonio' preserva esa fuerza y funciona de modo claro en singular en español.
- source_word: פִּיךָ
  english_pob_choice: your mouth
  chosen_spanish: tu boca
  alternatives_spanish:
  - tu palabra
  - de tu boca
  - tu decir
  lexicon: פה
  rationale: La imagen literal de la 'boca' de Dios debe mantenerse porque el verso enfatiza la procedencia directa del testimonio divino. 'Tu boca' conserva la metáfora sin sustituirla por una abstracción.
theological_decisions:
- issue: Relación entre חֶסֶד y la acción vivificadora de Dios
  english_pob_reading: In your steadfast love give me life
  chosen_spanish_reading: Con tu amor fiel, dame vida
  alternative_spanish_readings:
  - Por tu misericordia, dame vida
  - En tu gracia, dame vida
  rationale: '''Amor fiel'' mantiene el valor relacional y pactal del hebreo, evitando reducir la petición a mera compasión o favor. El verso pide vida desde la lealtad covenantal de Dios.'
  doctrine_reference: Pacto, misericordia y fidelidad divina
- issue: Naturaleza de 'el testimonio de tu boca'
  english_pob_reading: the testimony of your mouth
  chosen_spanish_reading: el testimonio de tu boca
  alternative_spanish_readings:
  - los testimonios de tu boca
  - tu palabra
  rationale: 'La formulación conserva la personificación bíblica: Dios habla y su boca es la fuente del testimonio. No se diluye la imagen en ''palabra'' porque el hebreo es más concreto.'
  doctrine_reference: Revelación divina y autoridad de la palabra de Dios
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de origen; la redacción sigue directamente el hebreo masorético y la decisión léxica inglesa de mantener 'testimony' para עֵדוּת.
  spanish_consistency_notes:
  - Se conservó el singular 'testimonio' para reflejar el singular hebreo עֵדוּת y el audit trail inglés, aunque en otros contextos el POB puede usar 'testimonios' para el mismo lexema.
  - Se mantuvo la imagen concreta 'tu boca' siguiendo la fuente, en lugar de una equivalencia más abstracta como 'tu palabra'.
  - El tono es reverente pero contemporáneo, con puntuación y sintaxis naturales en español.
