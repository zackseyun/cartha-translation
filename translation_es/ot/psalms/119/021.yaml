translation:
  language: es
  text: Reprendes a los soberbios, a los malditos, que se desvían de tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּ֭עַרְתָּ
  english_pob_choice: rebuke
  chosen_spanish: reprendes
  alternatives_spanish:
  - repruebas
  - reprendes con reprensión
  lexicon: HALOT
  rationale: El verbo hebreo expresa reprensión o amonestación severa. En español, «reprendes» transmite esa acción con naturalidad y mantiene el tono judicial/moral del contexto.
- source_word: זֵדִ֣ים
  english_pob_choice: the arrogant
  chosen_spanish: los soberbios
  alternatives_spanish:
  - los arrogantes
  - los presuntuosos
  lexicon: HALOT
  rationale: זֵדִים nombra a los insolentes o presumidos que actúan con altivez. «Soberbios» comunica bien ese rasgo moral en español bíblico sin perder claridad.
- source_word: אֲרוּרִ֑ים
  english_pob_choice: the accursed
  chosen_spanish: los malditos
  alternatives_spanish:
  - los maldecidos
  - los bajo maldición
  lexicon: HALOT
  rationale: La forma pasiva adjetival indica quienes están bajo maldición. «Malditos» refleja la fuerza del término de manera directa y idiomática en español; «maldecidos» sería más literal pero menos natural.
- source_word: הַשֹּׁגִים
  english_pob_choice: who stray
  chosen_spanish: que se desvían
  alternatives_spanish:
  - que yerra[n]
  - que se apartan
  lexicon: HALOT
  rationale: שׁגה puede significar desviarse, errar o extraviarse. Dado el paralelo con los mandamientos, «se desvían» conserva la imagen de apartarse del camino debido.
- source_word: מִמִּצְוֺתֶיךָ
  english_pob_choice: from your commandments
  chosen_spanish: de tus mandamientos
  alternatives_spanish:
  - de tus preceptos
  - de tus órdenes
  lexicon: HALOT
  rationale: Se mantiene «mandamientos» porque el audit trail inglés ya documenta esa decisión para מִצְוָה/מִצְוֺת, y porque en español expresa con fidelidad la autoridad normativa divina.
theological_decisions:
- issue: El alcance de זֵדִים y אֲרוּרִים en un contexto de juicio divino
  english_pob_reading: the arrogant, the accursed
  chosen_spanish_reading: los soberbios, los malditos
  alternative_spanish_readings:
  - los arrogantes, los malditos
  - los insolentes, los maldecidos
  rationale: 'No se suaviza el juicio del versículo: el texto describe a quienes, por su soberbia y desobediencia, quedan bajo maldición. «Malditos» conserva la dureza del juicio sin convertirlo en una paráfrasis interpretativa más débil.'
  doctrine_reference: Salmo 119:21; cf. Deuteronomio 27–28 sobre maldición y obediencia
- issue: La relación entre desviarse y desobedecer los mandamientos
  english_pob_reading: who stray from your commandments
  chosen_spanish_reading: que se desvían de tus mandamientos
  alternative_spanish_readings:
  - que se apartan de tus mandamientos
  - que yerra[n] respecto de tus mandamientos
  rationale: «Desviarse» conserva la dimensión relacional y ética del apartamiento, sin reducirlo solo a un error intelectual. El vínculo con los mandamientos queda claro como norma del pacto.
  doctrine_reference: Salmo 119; cf. Salmo 1:1-2
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de fuente; la redacción española sigue de cerca el texto hebreo y la solución inglesa auditada, sin introducir notas textuales adicionales.
  spanish_consistency_notes:
  - Se mantiene «mandamientos» para מִצְוֺת, en coherencia con el patrón terminológico del salmo y con la decisión inglesa auditada.
  - Se usa «Yahvé» solo cuando aparezca el tetragrámaton; este versículo no lo contiene.
  - No se introduce «Cristo» ni terminología eclesiástica ajena al verso.
