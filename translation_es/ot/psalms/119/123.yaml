  text: Mis ojos desfallecen esperando tu salvación y tu promesa justa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַי
  english_pob_choice: My eyes
  chosen_spanish: Mis ojos
  alternatives_spanish:
  - Mis ojos mismos
  - La vista de mis ojos
  lexicon: BDB 744; HALOT 789
  rationale: El hebreo usa el sustantivo plural con sufijo de primera persona; 'Mis ojos' conserva la imagen corporal directa y es el equivalente natural en español.
- source_word: כָּלוּ
  english_pob_choice: fail
  chosen_spanish: desfallecen
  alternatives_spanish:
  - se consumen
  - se agotan
  - fallan
  lexicon: BDB 477; HALOT 483
  rationale: El verbo expresa agotamiento o consumirse por la espera; 'desfallecen' comunica bien la pérdida de fuerza visual sin reducirlo a una mera falla mecánica.
- source_word: לִישׁוּעָתֶךָ
  english_pob_choice: your salvation
  chosen_spanish: tu salvación
  alternatives_spanish:
  - tu rescate
  - tu liberación
  lexicon: BDB 447; HALOT 448
  rationale: ישועה denota salvación, rescate o liberación; 'salvación' sigue de cerca el uso bíblico general y el auditorio de la POB.
- source_word: וּלְאִמְרַת
  english_pob_choice: promise
  chosen_spanish: promesa
  alternatives_spanish:
  - palabra
  - dicho
  - declaración
  lexicon: HALOT 67
  rationale: La POB inglesa entendió אִמְרָה como una promesa comprometida de Dios. En español, 'promesa' preserva esa fuerza relacional y evita confundirla con el término más general 'palabra'.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous promise
  chosen_spanish: tu promesa justa
  alternatives_spanish:
  - tu promesa recta
  - tu palabra justa
  - tu justicia
  lexicon: BDB 842; HALOT 854
  rationale: צֶדֶק/צְדָקָה puede expresar justicia o rectitud. Aquí modifica la 'promesa' y no introduce otro sustantivo independiente; por eso 'justa' mantiene el vínculo semántico sin forzar una expresión poco natural en español.
theological_decisions:
- issue: Cómo expresar צִדְקֶךָ en relación con אִמְרַת
  english_pob_reading: your righteous promise
  chosen_spanish_reading: tu promesa justa
  alternative_spanish_readings:
  - tu promesa recta
  - tu palabra justa
  rationale: La lectura inglesa une 'righteous' con 'promise'. En español, 'justa' conserva la dimensión moral/covenantal de צֶדֶק sin convertir el versículo en una afirmación abstracta de la justicia divina desligada de la promesa concreta.
  doctrine_reference: La fidelidad justa de Yahvé a su palabra/pacto en los Salmos.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de fuente. La redacción española sigue directamente el texto hebreo y la decisión lexical auditada de la POB en inglés para אִמְרָה como 'promise'.
  spanish_consistency_notes:
  - Se mantuvo 'tu' para el sufijo de segunda persona masculina singular en el hebreo.
  - Se eligió 'salvación' en lugar de 'rescate' para mantener coherencia con el lenguaje bíblico común y con el contexto poético del Salterio.
  - '''Promesa justa'' conserva el paralelismo hebreo sin añadir notas ni desplazamientos interpretativos innecesarios.'
