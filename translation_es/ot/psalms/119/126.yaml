translation:
  language: es
  text: Es tiempo de que Yahvé actúe, porque tu ley ha sido quebrantada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַ/יהוָ֑ה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: El tetragrámaton YHWH se conserva como nombre propio divino en español con «Yahvé», siguiendo la política del proyecto de no enmascararlo como título. Se evita «el SEÑOR» por ser una convención tradicional que oculta el nombre; «Jehová» queda como alternativa histórica en español, pero no como forma preferida.
- source_word: תּוֹרָתֶֽךָ
  english_pob_choice: law
  chosen_spanish: ley
  alternatives_spanish:
  - instrucción
  - enseñanza
  lexicon: HALOT
  rationale: La POB inglesa eligió «law» para תּוֹרָה, manteniendo la equivalencia estable de uno de los términos del Salmo 119 para la palabra revelada de Dios. En español, «ley» comunica con claridad esa referencia estable; «instrucción» y «enseñanza» se conservan como alternativas semánticas, pero «ley» mantiene mejor la continuidad literaria del salmo.
- source_word: הֵפֵרוּ
  english_pob_choice: has been broken
  chosen_spanish: ha sido quebrantada
  alternatives_spanish:
  - ha sido violada
  - han transgredido
  lexicon: HALOT
  rationale: El verbo hiphil transmite la idea de deshacer, quebrantar o invalidar. «Ha sido quebrantada» preserva bien la pasiva resultativa del inglés POB y el carácter jurídico/moral del daño a la ley. «Violar» o «transgredir» pueden ser posibles, pero su tono en español puede ser más interpretativo o menos natural en una cláusula pasiva.
theological_decisions:
- issue: Urgencia de intervención divina ante la profanación de la ley
  english_pob_reading: It is time for Yahweh to act, for your law has been broken.
  chosen_spanish_reading: Es tiempo de que Yahvé actúe, porque tu ley ha sido quebrantada.
  alternative_spanish_readings:
  - Ha llegado el tiempo para que Yahvé actúe, porque tu ley ha sido quebrantada.
  - Es hora de que Yahvé obre, porque tu ley ha sido quebrantada.
  rationale: El hebreo abre con עֵת, que expresa un momento oportuno o decisivo. «Es tiempo de que Yahvé actúe» conserva la fuerza exhortativa/urgente sin añadir más de lo que el texto dice. «Obre» sería posible, pero «actúe» representa mejor la iniciativa concreta pedida en el contexto del versículo.
  doctrine_reference: Salmo 119:126; doctrina del nombre divino (YHWH como nombre propio)
translation_notes:
  revision_awareness: No se identificaron revisiones aplicadas en el paquete de auditoría; la redacción sigue de cerca el sentido del hebreo y la elección léxica documentada en la POB inglesa.
  spanish_consistency_notes:
  - Se mantiene «Yahvé» para YHWH, en coherencia con el estándar del proyecto.
  - Se usa «ley» para תּוֹרָה, consistente con la serie terminológica del Salmo 119.
  - Se conserva el tono solemne y directo, con una estructura breve y paratáctica acorde al hebreo.
