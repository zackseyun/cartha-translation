lexical_decisions:
- source_word: דָּלְפָ֣ה נַ֭פְשִׁי
  english_pob_choice: My soul melts away
  chosen_spanish: Mi alma se derrite
  alternatives_spanish:
  - Mi alma se deshace
  - Mi alma se consume
  lexicon: HALOT / contexto poético
  rationale: El hebreo expresa un vaciamiento o derretimiento interior figurado; «se derrite» conserva la imagen corporal y la intensidad afectiva del inglés POB sin volverlo demasiado explicativo. «Alma» mantiene נֶפֶשׁ como la vida/persona interior en registro bíblico.
- source_word: מִתּוּגָה
  english_pob_choice: for sorrow
  chosen_spanish: por la tristeza
  alternatives_spanish:
  - por la aflicción
  - a causa del dolor
  lexicon: HALOT
  rationale: תּוּגָה denota tristeza, pena o aflicción. «Tristeza» es natural en español y preserva el tono afectivo general del verso; «aflicción» sería más fuerte pero menos directo.
- source_word: קַיְּמֵנִי
  english_pob_choice: strengthen me
  chosen_spanish: fortaléceme
  alternatives_spanish:
  - susténtame
  - confírmame
  lexicon: BDB / uso poético bíblico
  rationale: El verbo pide acción de sostener, afirmar o fortalecer. «Fortaléceme» es el equivalente más claro y lector-friendly en español, y mantiene la súplica directa del hebreo.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: דָּבָר se mantiene como «palabra» siguiendo la decisión auditada del POB en inglés. «Conforme a» reproduce bien la norma o medida implícita del hebreo.
theological_decisions:
- issue: Alma como sede de aflicción interior
  english_pob_reading: My soul melts away for sorrow
  chosen_spanish_reading: Mi alma se derrite por la tristeza
  alternative_spanish_readings:
  - Mi alma se consume por la tristeza
  - Mi alma se deshace por la tristeza
  rationale: No se neutraliza נֶפֶשׁ como mera emoción; se conserva el lenguaje bíblico de la interioridad/persona que sufre. La imagen de derretirse comunica la intensidad sin añadir contenido doctrinal ajeno.
  doctrine_reference: Antropología bíblica poética
- issue: La palabra como medida de fortalecimiento
  english_pob_reading: strengthen me according to your word
  chosen_spanish_reading: fortaléceme conforme a tu palabra
  alternative_spanish_readings:
  - susténtame conforme a tu palabra
  - afírmame conforme a tu palabra
  rationale: Se preserva la dependencia de la intervención divina medida por la palabra de Yahvé. «Conforme a tu palabra» mantiene la relación normativa y promesa-cumplimiento sin doctrinalizarla de más.
  doctrine_reference: Fiabilidad de la palabra de Yahvé
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés; la versión española sigue de cerca el sentido auditado de la POB inglés y el hebreo WLC, sin introducir notas textuales adicionales.
  spanish_consistency_notes:
  - Se mantiene «palabra» para דָּבָר, coherente con el criterio auditado del POB.
  - Se usa un registro bíblico natural en español, evitando arcaísmos innecesarios.
  - No se introduce «SEÑOR»; el verso hebreo contiene una referencia a la palabra de Dios, no el Tetragrámaton explícito.
