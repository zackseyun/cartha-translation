  source_alignment_summary: 'El texto español conserva fielmente la secuencia y el sentido del hebreo: נַפְשִׁי se expresa como «Mi alma», la imagen poética de desgaste interior en דָּלְפָה se transmite de modo inteligible con «se derrite», מִתּוּגָה como causa se refleja en «por la tristeza», y el imperativo קַיְּמֵנִי se mantiene como súplica directa: «fortaléceme». «Conforme a tu palabra» reproduce adecuadamente כִּדְבָרֶךָ y preserva la decisión auditada de distinguir דָּבָר como «palabra».'
