translation:
  language: es
  text: Mi alma se consume de anhelo por tus ordenanzas[a] en todo tiempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ordenanzas» traduce מִשְׁפָּטֶיךָ como disposiciones normativas de Dios; alternativas posibles son «juicios» o «decretos».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרְסָה נַפְשִׁי
  english_pob_choice: My soul is consumed
  chosen_spanish: Mi alma se consume
  alternatives_spanish:
  - Mi alma está consumida
  - Mi alma desfallece
  lexicon: WLC/HALOT
  rationale: גָּרְסָה expresa una idea de desgaste o agotamiento intenso; en español, «se consume» comunica bien la imagen de consumirse por dentro sin añadir más de lo que el hebreo warrants. «Mi alma» mantiene נַפְשִׁי como centro de deseo y vida interior.
- source_word: לְתַאֲבָה
  english_pob_choice: with longing
  chosen_spanish: de anhelo
  alternatives_spanish:
  - con anhelo
  - por deseo intenso
  lexicon: WLC/HALOT
  rationale: La forma nominal comunica deseo vehemente. «De anhelo» suena natural en español y conserva la fuerza afectiva de la expresión sin volverla explicativa de más.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: tus ordenanzas
  alternatives_spanish:
  - tus juicios
  - tus decretos justos
  - tus normas
  lexicon: HALOT
  rationale: La elección inglesa «ordinances» busca reflejar מִשְׁפָּט como disposiciones normativas de Dios, no como simple castigo. En español, «ordenanzas» preserva ese matiz legal/normativo mejor que «juicios», que puede sonar más penal, y mejor que «normas», que puede ser demasiado genérico.
- source_word: בְכָל עֵת
  english_pob_choice: at all times
  chosen_spanish: en todo tiempo
  alternatives_spanish:
  - siempre
  - en cada momento
  lexicon: WLC
  rationale: La expresión adverbial hebrea indica continuidad. «En todo tiempo» es una fórmula bíblica clara y fiel, y conserva el alcance total sin exagerar el estilo.
theological_decisions:
- issue: Rendering of מִשְׁפָּטֶיךָ as a covenantal/legal term
  english_pob_reading: ordinances
  chosen_spanish_reading: ordenanzas
  alternative_spanish_readings:
  - juicios
  - decretos
  - normas
  rationale: El término no se reduce a sentencias judiciales; en el contexto de la Torá expresa decisiones y disposiciones justas de Yahvé. «Ordenanzas» mantiene la fuerza normativa y el tono de instrucción divina sin borrar la dimensión de justicia.
  doctrine_reference: Salmo 119; uso toráico de מִשְׁפָּט
- issue: Anthropological sense of נַפְשִׁי
  english_pob_reading: My soul
  chosen_spanish_reading: Mi alma
  alternative_spanish_readings:
  - mi vida
  - mi ser interior
  rationale: «Mi alma» es la equivalencia más estable en español bíblico y comunica el sujeto de deseo profundo sin convertir el verso en una mera emoción psicológica.
  doctrine_reference: Antropología bíblica del alma/vida interior
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el contexto inglés; se ha seguido la lectura auditada de 'ordinances' para מִשְׁפָּטֶיךָ y se ha procurado conservar en español la misma distinción semántica frente a 'juicios' o 'normas'.
  spanish_consistency_notes:
  - Se ha mantenido «Yahvé» como norma de proyecto para el nombre divino, pero este versículo no contiene el Tetragrámaton ni una cita explícita donde deba aparecer.
  - «Mi alma» conserva el paralelismo bíblico usual para נַפְשִׁי.
  - «En todo tiempo» preserva la continuidad adverbial sin añadir intensidad no expresada.
