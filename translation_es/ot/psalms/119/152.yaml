- from: Desde antiguo he conocido tus testimonios, porque para siempre los has establecido.
  to: Desde antiguo aprendí de tus testimonios que los has establecido para siempre.
  rationale: Se corrige la relación sintáctica de כִּי y se hace explícito que el conocimiento procede de los testimonios. La revisión preserva el sentido perfectivo y la terminología consistente del salmo, sin requerir notas adicionales.
