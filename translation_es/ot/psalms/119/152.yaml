  text: Desde antiguo he conocido tus testimonios, porque para siempre los has establecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֶ֣דֶם
  english_pob_choice: Long ago
  chosen_spanish: Desde antiguo
  alternatives_spanish:
  - Hace mucho
  - Antiguamente
  - Desde tiempos antiguos
  lexicon: HALOT
  rationale: קֶדֶם expresa anterioridad temporal; 'Desde antiguo' conserva el sentido de tiempo remoto sin añadir una precisión excesiva ni sonar arcaico.
- source_word: יָ֭דַעְתִּי
  english_pob_choice: I learned
  chosen_spanish: he conocido
  alternatives_spanish:
  - supe
  - aprendí
  - he aprendido
  lexicon: HALOT
  rationale: El verbo ידע puede abarcar conocer por experiencia o reconocimiento. 'He conocido' refleja una adquisición asentada de conocimiento, compatible con el valor perfectivo del hebreo y con el POB inglés 'I learned'.
- source_word: מֵעֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones del pacto
  lexicon: HALOT
  rationale: Se mantiene 'testimonios' para conservar la decisión léxica auditada del POB inglés y la serie terminológica del salmo para עֵדוֹת/עֵדוּת.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_spanish: para siempre
  alternatives_spanish:
  - por siempre
  - eternamente
  lexicon: HALOT
  rationale: La expresión española común 'para siempre' comunica de forma natural la duración ilimitada del adverbio hebreo.
- source_word: יְסַדְתָּם
  english_pob_choice: you have founded them
  chosen_spanish: los has establecido
  alternatives_spanish:
  - los has fundado
  - los has cimentado
  lexicon: HALOT
  rationale: יסד tiene la idea de poner fundamento/establecer. 'Has establecido' es más natural en español y preserva la imagen de firmeza sin sobrecargar la metáfora de construcción.
theological_decisions:
- issue: Naturaleza de los 'testimonios'
  english_pob_reading: testimonies
  chosen_spanish_reading: testimonios
  alternative_spanish_readings:
  - decretos
  - mandatos
  rationale: Se conserva 'testimonios' porque el salmo usa una serie técnica de términos para la revelación y los estatutos divinos. Mantener la palabra evita borrar la tensión semántica entre testimonio, precepto y mandamiento.
  doctrine_reference: Teología bíblica de la revelación y la ley en Salmo 119
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de auditorio; la versión española sigue directamente el hebreo con apoyo del encuadre léxico ya fijado en el POB inglés.
  spanish_consistency_notes:
  - Se conserva la terminología relacional 'tus testimonios' para armonía con el campo léxico de Salmo 119.
  - '''Desde antiguo'' mantiene el valor temporal inicial de קֶדֶם sin introducir una lectura interpretativa adicional.'
  - '''Has establecido'' preserva el fundamento duradero expresado por יְסַדְתָּם sin cambiar el sentido a una mera creación.'
