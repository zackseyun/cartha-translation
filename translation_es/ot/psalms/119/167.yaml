translation:
  language: es
  text: Mi alma guarda tus testimonios; los amo muchísimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרָה / שָׁמַר
  english_pob_choice: keeps
  chosen_spanish: guarda
  alternatives_spanish:
  - cumple
  - observa
  - conserva
  lexicon: HALOT
  rationale: El verbo שָׁמַר en este contexto de la Torá/los testimonios combina la idea de guardar con atender fielmente. «Guarda» conserva esa fuerza de custodia obediente en español natural, sin volverlo demasiado técnico ni perder la continuidad con el salmista.
- source_word: נַפְשִׁי
  english_pob_choice: My soul
  chosen_spanish: mi alma
  alternatives_spanish:
  - mi vida
  - mi ser
  lexicon: HALOT
  rationale: נֶפֶשׁ puede abarcar vida, ser o alma. Aquí, siguiendo la tradición poética del salmo y la claridad en español, «mi alma» comunica bien al sujeto interior sin reducir innecesariamente el alcance semántico.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  - tus mandatos
  lexicon: HALOT
  rationale: Se conserva «testimonios» por coherencia con la decisión auditada en inglés y porque en este salmo el término señala el testimonio pactal de Dios. «Testimonios» es más fiel al campo semántico que opciones más explicativas como «mandatos» o «preceptos».
- source_word: וָאֹהֲבֵם
  english_pob_choice: I love them
  chosen_spanish: los amo
  alternatives_spanish:
  - los quiero
  - los he amado
  lexicon: HALOT
  rationale: El perfecto/wayyiqtol con valor coordinado expresa la respuesta afectiva del salmista. «Los amo» mantiene la declaración directa y presente del amor, adecuada al tono poético y devocional.
- source_word: מְאֹד
  english_pob_choice: exceedingly
  chosen_spanish: muchísimo
  alternatives_spanish:
  - en gran manera
  - mucho
  - sobremanera
  lexicon: HALOT
  rationale: מְאֹד intensifica de forma absoluta. «Muchísimo» comunica bien la intensidad en español moderno y suena natural sin debilitar el énfasis.
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente. La versión española se alinea directamente con el texto masorético y con la lectura auditada en inglés, manteniendo la imagen poética y la fuerza intensiva final.
  spanish_consistency_notes:
  - Se mantiene «testimonios» para עֵדֹתֶיךָ conforme a la decisión POB en inglés.
  - Se evita «SEÑOR» porque el versículo usa el pronombre de segunda persona para dirigirse a Dios; no aparece el Tetragrámaton ni κύριος.
  - El tono es poético y claro, con español bíblico natural sin arcaísmos innecesarios.
