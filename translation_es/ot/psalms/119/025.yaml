translation:
  language: es
  text: Mi alma se pega al polvo; dame vida conforme a tu palabra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 25–32 comienzan con dalet (ד), la cuarta letra del alfabeto; continúan el acróstico introducido en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: דָּבְקָה
  english_pob_choice: clings
  chosen_spanish: se pega
  alternatives_spanish:
  - se adhiere
  - se aferra
  lexicon: HALOT / BDB
  rationale: El verbo expresa adhesión intensa y persistente. En español, 'se pega' comunica cercanía física y dependencia continua sin elevar el registro ni imponer una metáfora más interpretativa que el hebreo.
- source_word: לֶעָפָר
  english_pob_choice: the dust
  chosen_spanish: al polvo
  alternatives_spanish:
  - al polvo de la tierra
  - al polvo
  lexicon: HALOT
  rationale: '''Polvo'' preserva la imagen hebrea de humillación, abatimiento y cercanía a la muerte. ''Al polvo'' mantiene la concisión del original y la fuerza poética del paralelismo implícito.'
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_spanish: mi alma
  alternatives_spanish:
  - mi vida
  - yo
  lexicon: HALOT
  rationale: '''Alma'' conserva el alcance de נֶפֶשׁ como la persona viviente, interior y vulnerable. ''Mi vida'' sería posible, pero ''alma'' mantiene mejor la textura poética tradicional sin perder inteligibilidad.'
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - avívame
  - restáurame la vida
  lexicon: HALOT
  rationale: El piel causativo pide una acción vivificadora. 'Dame vida' reproduce la sencillez del hebreo y evita sobreinterpretar si la petición apunta a restauración física, anímica o ambas.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: '''Conforme a'' expresa adecuación normativa y fidelidad a la promesa divina. Se mantiene ''palabra'' siguiendo la decisión inglesa de distinguir דָּבָר como acto verbal de Dios, no como ''cosa'' o ''asunto''.'
theological_decisions:
- issue: Sentido de נֶפֶשׁ en un contexto de abatimiento
  english_pob_reading: My soul
  chosen_spanish_reading: Mi alma
  alternative_spanish_readings:
  - mi vida
  - mi ser
  rationale: No se reduce a 'alma' en un sentido platónico; aquí designa al yo vivo, exhausto y necesitado. 'Mi alma' es la forma española más asentada y poéticamente fiel, mientras las alternativas aclaran matices pero pierden resonancia bíblica.
  doctrine_reference: 'Antropología bíblica: נֶפֶשׁ como vida/persona integral.'
- issue: Relación entre la petición de vida y la norma divina
  english_pob_reading: give me life according to your word
  chosen_spanish_reading: dame vida conforme a tu palabra
  alternative_spanish_readings:
  - avívame conforme a tu palabra
  - dame vida según tu palabra
  rationale: La frase une dependencia vital con la confiabilidad de la promesa divina. 'Conforme a' conserva tanto la base normativa como la expectativa de cumplimiento sin introducir un matiz doctrinal ajeno.
  doctrine_reference: Fidelidad de Dios a su palabra/pacto.
translation_notes:
  revision_awareness: Sin revisiones aplicadas en el paquete auditado. La redacción española sigue el texto hebreo masorético y la decisión inglesa de conservar 'word' para כִּדְבָרֶךָ, manteniendo el paralelismo breve y directo del verso.
  spanish_consistency_notes:
  - Se conserva 'Yahvé' para el nombre divino cuando aparece; aquí el verso no lo contiene.
  - '''Palabra'' se usa de manera consistente para דָּבָר cuando refiere el habla divina, en línea con el audit trail en inglés.'
  - Se evita 'esclavo' para δοῦλος según la política general del proyecto; no aplica en este verso.
