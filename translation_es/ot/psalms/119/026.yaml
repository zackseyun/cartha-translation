  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרָכַי
  english_pob_choice: my ways
  chosen_spanish: mis caminos
  alternatives_spanish:
  - mis sendas
  - mis maneras
  lexicon: HALOT / uso bíblico de דֶּרֶךְ
  rationale: דֶּרֶךְ puede referirse a camino literal o a conducta/curso de vida. ‘Mis caminos’ conserva la imagen y comunica de forma natural el sentido de la conducta o trayectoria personal.
- source_word: סִפַּרְתִּי
  english_pob_choice: I told of
  chosen_spanish: he contado
  alternatives_spanish:
  - he relatado
  - he narrado
  lexicon: BDB / uso verbal de ספר
  rationale: El verbo expresa declarar, contar o narrar. ‘He contado’ refleja bien la confesión abierta implícita en el contexto y suena natural en español.
- source_word: וַתַּעֲנֵנִי
  english_pob_choice: you answered me
  chosen_spanish: tú me has respondido
  alternatives_spanish:
  - me respondiste
  - tú me respondiste
  lexicon: BDB / uso verbal de ענה
  rationale: El hebreo indica respuesta divina a lo dicho por el salmista. El pretérito perfecto compuesto en español mantiene la vigencia de la respuesta en la experiencia del orante.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: POB ya documenta ‘statutes’ como ‘estatutos’. En español, ‘estatutos’ conserva el carácter de mandatos fijados o prescritos sin perder inteligibilidad.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de control; la línea sigue de cerca la lectura inglesa auditada y el hebreo masorético, con ajuste natural de tiempo verbal en español.
  spanish_consistency_notes:
  - Se mantiene ‘estatutos’ para חֻקִּים/חֻקֶּיךָ conforme al criterio de la serie POB.
  - ‘Caminos’ traduce דְּרָכַי sin forzar una lectura moralizante adicional; el contexto del salmo permite la referencia a la conducta de vida.
  - Se usa tratamiento reverente de segunda persona singular (‘tú’, ‘tus’) en continuidad con el texto poético.
