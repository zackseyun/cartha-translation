  text: Me he extraviado como oveja perdida; busca a tu siervo, porque no he olvidado tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעִיתִי
  english_pob_choice: I have gone astray
  chosen_spanish: Ando extraviado
  alternatives_spanish:
  - Me he desviado
  - He andado errante
  lexicon: BDB 652; HALOT 1675
  rationale: El hebreo expresa el estado de haberse apartado del camino. 'Ando extraviado' comunica bien la condición resultante en español sin forzar una imagen más específica que la del texto.
- source_word: כְּשֶׂה אֹבֵד
  english_pob_choice: like a lost sheep
  chosen_spanish: como oveja perdida
  alternatives_spanish:
  - como una oveja perdida
  - como oveja que se ha perdido
  lexicon: BDB 286; HALOT 80
  rationale: La comparación con una oveja perdida es directa y natural en español bíblico contemporáneo. Se conserva la imagen pastoral sin suavizarla ni ampliarla.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu siervo humilde
  lexicon: BDB 714; HALOT 771
  rationale: Se mantiene 'siervo' como término lector-respetuoso y fiel al valor relacional de עבד. 'Servidor' debilita la carga bíblica del vínculo; 'siervo humilde' añade información no presente.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus mandamientos ordenados
  - tus preceptos
  lexicon: BDB 846; HALOT 558
  rationale: '''Mandamientos'' es la equivalencia más estable y precisa para מִצְוֹת en este salmo. Se preserva la serie terminológica del poema sin sustituirla por un término más técnico o más débil.'
- source_word: לֹא שָׁכָחְתִּי
  english_pob_choice: I do not forget
  chosen_spanish: no he olvidado
  alternatives_spanish:
  - no olvido
  - no he dejado de recordar
  lexicon: BDB 1013; HALOT 1461
  rationale: El perfecto hebreo se refleja bien con 'no he olvidado', que conserva el sentido de memoria persistente y encaja con el paralelismo del verso.
theological_decisions:
- issue: La petición 'busca a tu siervo' en un contexto de extravío espiritual
  english_pob_reading: seek your servant
  chosen_spanish_reading: busca a tu siervo
  alternative_spanish_readings:
  - busca a tu siervo perdido
  - busca a este tu siervo
  rationale: Se conserva la súplica directa al Señor sin añadir palabras que intensifiquen o expliquen más de lo que el hebreo dice. La imagen teológica es la de la iniciativa misericordiosa de Dios en favor del creyente extraviado.
  doctrine_reference: Salmo 119:176; cf. Salmo 119:176 en su contexto de petición y fidelidad a la ley
- issue: El equilibrio entre extravío humano y fidelidad a los mandamientos
  english_pob_reading: for I do not forget your commandments
  chosen_spanish_reading: porque no he olvidado tus mandamientos
  alternative_spanish_readings:
  - pues no olvido tus mandamientos
  - porque no olvido tus mandamientos
  rationale: 'Se mantiene la tensión del verso: el hablante reconoce su extravío, pero apela a su continuidad en la memoria de la ley. ''No he olvidado'' respeta el perfectivo hebreo y no diluye la afirmación.'
  doctrine_reference: Salmo 119:176; tema de memoria obediente en el Salmo 119
translation_notes:
  revision_awareness: No se aplicaron revisiones previas en el paquete de fuente. La traducción sigue de cerca el hebreo WLC y armoniza con la decisión inglesa de preservar 'commandments' para מִצְוֺתֶיךָ.
  spanish_consistency_notes:
  - Se mantiene 'tu siervo' para עבד y 'mandamientos' para מִצְוֺת, en coherencia con el léxico habitual del Salmo 119.
  - Se evita 'SEÑOR' o sustitutos litúrgicos porque aquí el texto se dirige directamente a Dios con segunda persona; el inglés POB tampoco introduce una máscara nominal.
