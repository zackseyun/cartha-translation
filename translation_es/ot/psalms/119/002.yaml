translation:
  language: es
  text: ¡Dichosos los que guardan sus testimonios y lo buscan[a] de todo corazón!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “lo buscan con todo su corazón”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַ֭שְׁרֵי
  english_pob_choice: Blessed
  chosen_spanish: Dichosos
  alternatives_spanish:
  - Bienaventurados
  - Felices
  lexicon: HALOT
  rationale: אַשְׁרֵי expresa una declaración de dicha o bienaventuranza. 'Dichosos' comunica bien esa idea en español moderno y mantiene un tono reverente sin sonar mecánico.
- source_word: נֹצְרֵי
  english_pob_choice: those who keep
  chosen_spanish: los que guardan
  alternatives_spanish:
  - los que observan
  - los que preservan
  lexicon: HALOT
  rationale: El participio denota cuidado fiel y observancia continua. 'Guardar' es la opción más natural en español bíblico para ese compromiso activo con los mandamientos o testimonios.
- source_word: עֵדֹתָיו
  english_pob_choice: his testimonies
  chosen_spanish: sus testimonios
  alternatives_spanish:
  - sus decretos
  - sus estipulaciones del pacto
  lexicon: HALOT
  rationale: Se conserva la elección auditada de la POB inglesa 'testimonies'. En español, 'testimonios' mantiene la referencia al contenido atestiguado por Dios y evita sustituirlo por un término más interpretativo.
- source_word: בְּכָל לֵב
  english_pob_choice: with all their heart
  chosen_spanish: de todo corazón
  alternatives_spanish:
  - con todo su corazón
  - con el corazón entero
  lexicon: HALOT
  rationale: La expresión hebrea es idiomática. 'De todo corazón' reproduce con naturalidad la totalidad de la entrega en español y corresponde al sentido del hebreo y de la traducción inglesa auditada.
- source_word: יִדְרְשׁוּהוּ
  english_pob_choice: seek him
  chosen_spanish: lo buscan
  alternatives_spanish:
  - lo buscan con diligencia
  - lo procuran
  lexicon: HALOT
  rationale: El verbo puede abarcar buscar, consultar o procurar. En este contexto, 'buscar' es la equivalencia más directa y fiel; el pronombre 'lo' refleja la referencia a Dios sin añadir el nombre divino en el verso.
theological_decisions:
- issue: Referencia implícita a Dios en el pronombre final
  english_pob_reading: seek him
  chosen_spanish_reading: lo buscan
  alternative_spanish_readings:
  - lo buscan a él
  - buscan a Yahvé
  rationale: El hebreo usa un sufijo pronominal masculino singular que remite a Dios. En español, el pronombre clítico 'lo' conserva esa referencia de manera natural. No se explicita 'Yahvé' en el texto porque el verso hebreo no lo contiene de forma abierta; la referencia queda implícita como en la fuente.
  doctrine_reference: Uso pronominal referencial sin expansión del referente; fidelidad al texto poético
- issue: Tono de dicha inicial
  english_pob_reading: Blessed are
  chosen_spanish_reading: ¡Dichosos los...!
  alternative_spanish_readings:
  - ¡Bienaventurados los...!
  - ¡Felices los...!
  rationale: No hay una diferencia doctrinal, sino de registro. 'Dichosos' ofrece un equilibrio entre solemnidad bíblica y español claro, sin cargar el verso con una fórmula litúrgica fija que el hebreo no exige.
  doctrine_reference: Beatitud/estado de dicha en lenguaje sapiencial-poético
translation_notes:
  revision_awareness: Se siguió la lectura base del texto hebreo WLC y la elección inglesa auditada 'testimonies' para עֵדֹתָיו. No hay revisiones aplicadas ni variantes textuales relevantes en el paquete proporcionado.
  spanish_consistency_notes:
  - Se mantuvo 'testimonios' para עֵדֹתָיו conforme al patrón auditado en la serie del Salmo 119.
  - Se evitó 'SEÑOR' o 'Cristo' porque no aparecen en el verso y no corresponden al hebreo de este pasaje.
  - El pronombre 'lo' conserva la referencia a Dios de manera sobria y gramatical en español.
