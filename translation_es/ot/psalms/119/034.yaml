  text: Dame entendimiento, para que yo guarde tu ley y la observe con todo mi corazón.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲבִינֵנִי
  english_pob_choice: Give me understanding
  chosen_spanish: Dame entendimiento
  alternatives_spanish:
  - Hazme entender
  - Concédeme entendimiento
  lexicon: BDB/HALOT
  rationale: El verbo pide comprensión concedida por Dios. «Dame entendimiento» conserva la súplica directa y es natural en español; «hazme entender» enfatiza el efecto, y «concédeme entendimiento» explicita el ruego de don.
- source_word: תּוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La POB en inglés mantiene «law» para conservar la equivalencia consistente en el salmo. En español, «ley» reproduce esa tradición auditada y la serie léxica del Salmo 119; «instrucción» y «enseñanza» reflejan el campo semántico amplio de תּוֹרָה.
- source_word: אֶשְׁמְרֶנָּה
  english_pob_choice: observe it
  chosen_spanish: la observe
  alternatives_spanish:
  - la guarde
  - la cumpla
  lexicon: BDB/HALOT
  rationale: El verbo implica guardar con fidelidad obediente. «La observe» sigue el paralelo de la POB inglesa y suena natural en español bíblico contemporáneo; «la guarde» resalta conservación/fidelidad, y «la cumpla» subraya obediencia activa.
- source_word: בְכָל לֵב
  english_pob_choice: with all my heart
  chosen_spanish: con todo mi corazón
  alternatives_spanish:
  - de todo corazón
  - con todo mi ser
  lexicon: BDB/HALOT
  rationale: «Con todo mi corazón» es la correspondencia más directa y transparente para בְכָל לֵב. Mantiene el sentido de integridad interior sin introducir una paráfrasis antropológica.
theological_decisions:
- issue: Relación entre תּוֹרָה y la forma de traducirla en español
  english_pob_reading: your law
  chosen_spanish_reading: tu ley
  alternative_spanish_readings:
  - tu instrucción
  - tu enseñanza
  rationale: La decisión preserva la terminología estable del Salmo 119 en la POB inglesa. Aunque תּוֹרָה puede abarcar instrucción o enseñanza, «ley» mantiene la fuerza normativa y la coherencia literaria del conjunto.
  doctrine_reference: Salmo 119; uso bíblico de תּוֹרָה
- issue: Alcance de «con todo mi corazón»
  english_pob_reading: with all my heart
  chosen_spanish_reading: con todo mi corazón
  alternative_spanish_readings:
  - de todo corazón
  - con toda mi alma
  rationale: El hebreo habla de la totalidad interior y no de un órgano aislado. «Corazón» en español bíblico comunica bien la sede de voluntad, pensamiento y afecto, sin diluir la intensidad del hebreo.
  doctrine_reference: Deuteronomio 6:5; Salmo 119:34
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete; la redacción española sigue de cerca el texto hebreo y la solución inglesa auditada, manteniendo la equivalencia funcional de las dos peticiones finales y la consistencia terminológica de תּוֹרָה.
  spanish_consistency_notes:
  - Se mantiene el tuteo reverente («tu») conforme al texto dirigido a Dios.
  - «Ley» se conserva por coherencia con el Salmo 119 y con la decisión inglesa documentada.
  - No se introduce puntuación explicativa adicional ni división de cláusulas que altere el paralelismo hebreo.
