  text: Me fue bueno haber sido afligido, para que aprenda tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_spanish: fue bueno
  alternatives_spanish:
  - era bueno
  - me hizo bien
  lexicon: WLC / contextual Hebrew usage
  rationale: El hebreo presenta una valoración general de beneficio; en español, «me fue bueno» comunica ese efecto favorable de manera natural y mantiene el juicio del hablante sin exagerar la causalidad.
- source_word: עֻנֵּיתִי
  english_pob_choice: I was afflicted
  chosen_spanish: haber sido afligido
  alternatives_spanish:
  - ser humillado
  - haber sido humillado
  - haber sido oprimido
  lexicon: WLC / ענה
  rationale: «Afligido» conserva el sentido amplio de sufrimiento o humillación que admite ענה en este contexto, sin forzar una interpretación más específica que el hebreo no exige.
- source_word: לְמַעַן
  english_pob_choice: that I might
  chosen_spanish: para que
  alternatives_spanish:
  - a fin de que
  - con el fin de que
  lexicon: WLC / purposive construction
  rationale: La construcción final expresa propósito. «Para que» es la forma más clara y directa en español contemporáneo.
- source_word: אֶלְמַד
  english_pob_choice: I might learn
  chosen_spanish: aprenda
  alternatives_spanish:
  - llegue a aprender
  - conozca
  lexicon: WLC / למד
  rationale: El verbo denota aprendizaje real adquirido por experiencia. «Aprenda» conserva bien el matiz didáctico y la relación causal con la aflicción.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  lexicon: HALOT
  rationale: Se conserva la elección auditada de la POB inglesa «statutes» como «estatutos», un término jurídico-normativo que refleja bien חֹק/חֻקִּים y evita debilitar su fuerza normativa.
theological_decisions:
- issue: Valor positivo de la aflicción como medio pedagógico
  english_pob_reading: It was good for me that I was afflicted, that I might learn your statutes.
  chosen_spanish_reading: Me fue bueno haber sido afligido, para que aprenda tus estatutos.
  alternative_spanish_readings:
  - Fue bueno para mí haber sido afligido
  - Me hizo bien ser afligido
  rationale: 'El texto afirma que la aflicción produjo un bien instrumental: el aprendizaje de los estatutos de Dios. La redacción española mantiene esa relación sin convertirla en una aprobación abstracta del sufrimiento.'
  doctrine_reference: Salmo 119:71; cf. Hebreos 12:11
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; la traducción sigue de cerca la lectura hebrea y la decisión léxica inglesa auditada para חֻקֶּיךָ = 'statutes'.
  spanish_consistency_notes:
  - Se mantuvo «estatutos» para חֻקֶּיךָ conforme a la decisión léxica inglesa auditada.
  - Se usó «afligido» para conservar el sentido amplio de la pasiva hebrea de ענה sin añadir especificaciones no presentes en el verso.
  - La puntuación reproduce una relación de propósito clara en español y conserva el paralelismo del versículo.
