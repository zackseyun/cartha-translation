translation:
  language: es
  text: Porque he llegado a ser como un odre en el humo[a], pero no he olvidado tus estatutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un odre dejado colgado en el humo se reseca, se ennegrece y puede agrietarse; la imagen expresa cansancio extremo y sensación de inutilidad, pero sin abandonar la fidelidad a los estatutos de Dios.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הָיִיתִי
  english_pob_choice: For I have become
  chosen_spanish: Porque he llegado a ser
  alternatives_spanish:
  - Pues he llegado a ser
  - Porque me he vuelto
  lexicon: BDB/HALOT
  rationale: El hebreo introduce la razón con כִּי y usa un perfecto de estado/resultó; en español, «he llegado a ser» comunica el resultado presente sin forzar un calco. «Porque» mantiene la conexión explicativa del verso.
- source_word: כְּנֹאד
  english_pob_choice: like a wineskin
  chosen_spanish: como un odre
  alternatives_spanish:
  - como una bota de cuero
  - como un pellejo
  lexicon: HALOT
  rationale: נֹאד es un recipiente de cuero para líquidos; «odre» es preciso y natural en español bíblico, y evita la confusión de «vino» que no está en el hebreo.
- source_word: בְּקִיטוֹר
  english_pob_choice: in the smoke
  chosen_spanish: en el humo
  alternatives_spanish:
  - en el hollín
  - por el humo
  lexicon: HALOT
  rationale: קִיטוֹר se refiere al humo o vapor; «humo» refleja el campo semántico directo y conserva la imagen de resequedad y ennegrecimiento sin sobreinterpretar.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: 'Se sigue la decisión auditada del inglés POB: חֹק/חֻקִּים como normas prescritas o grabadas. «Estatutos» es el equivalente más estable y reconocido en español para esta colección léxica.'
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca el texto hebreo y la elección léxica auditada del inglés POB, manteniendo la imagen cultural del odre en el humo.
  spanish_consistency_notes:
  - Se conserva el paralelismo adversativo con «pero» para reflejar לֹא y el contraste del verso.
  - «Tus estatutos» mantiene la segunda persona singular del hebreo.
  - La imagen se deja concreta y no se sustituye por una paráfrasis interpretativa más abstracta.
