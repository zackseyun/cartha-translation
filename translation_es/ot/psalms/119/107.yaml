lexical_decisions:
- source_word: נַעֲנֵיתִי עַד מְאֹד
  english_pob_choice: I am severely afflicted
  chosen_spanish: Estoy muy afligido en gran manera
  alternatives_spanish:
  - Estoy profundamente afligido
  - Estoy oprimido sobremanera
  lexicon: WLC / HALOT
  rationale: El hebreo expresa una aflicción intensa mediante un participio/pasivo verbal con el intensificador עַד מְאֹד. En español, 'muy afligido en gran manera' conserva la fuerza sin volverlo demasiado literario o mecánico.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se mantiene el nombre divino como nombre propio, siguiendo la pauta del proyecto para יְהוָה. 'Yahvé' es la forma española preferida aquí por ser transparente y no enmascarar el nombre.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - reavívame
  - restáurame a la vida
  lexicon: HALOT
  rationale: El verbo חיה en esta forma pide una petición de dar/traer vida. 'Dame vida' es breve, natural y conserva la ambigüedad entre reanimar, sostener y vivificar según el contexto.
- source_word: כִדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: דָּבָר se toma como 'palabra' en continuidad con la decisión inglesa, y la preposición כִּ- se expresa bien con 'conforme a', que mantiene la norma o medida implícita sin añadir paráfrasis.
theological_decisions:
- issue: Uso del nombre divino en el texto principal
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - SEÑOR
  - Jehová
  rationale: Se preserva el nombre del pacto como nombre propio, en lugar de sustituirlo por un título litúrgico. Esto sigue la transparencia del proyecto y evita ocultar la forma hebrea subyacente.
  doctrine_reference: 'DOCTRINE.md: el nombre divino debe tratarse como nombre propio'
- issue: Valor de חַיֵּנִי en un salmo de súplica
  english_pob_reading: give me life
  chosen_spanish_reading: dame vida
  alternative_spanish_readings:
  - restáurame
  - vivifícame
  rationale: La petición puede implicar más que mera supervivencia física; sin embargo, el español 'dame vida' conserva la amplitud semántica sin imponer una interpretación más específica de la que el hebreo garantiza.
  doctrine_reference: Lectura contextual del verbo חיה en súplica poética
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente. La redacción española sigue de cerca la lectura inglesa auditada, pero ajusta el orden y la idiomaticidad al español sin perder la intensidad del hebreo.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' como forma consistente para יְהוָה.
  - '''Palabra'' se usa para דָּבָר en coherencia con otros pasajes del proyecto.'
  - La construcción 'conforme a' conserva la relación normativa de כִּ- sin convertirla en una paráfrasis amplia.
