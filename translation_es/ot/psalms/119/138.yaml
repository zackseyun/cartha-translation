translation:
  language: es
  text: Tú has ordenado tus testimonios en justicia y en toda fidelidad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִוִּיתָ
  english_pob_choice: You have commanded
  chosen_spanish: has ordenado
  alternatives_spanish:
  - has mandado
  - has decretado
  lexicon: BDB/HALOT
  rationale: El verbo hebreo expresa dar una orden o disponer con autoridad. ‘Ordenado’ conserva ese acto de establecer/mandar sin sonar tan rígido como una orden militar en español; además encaja con el objeto plural ‘tus testimonios’.
- source_word: צֶדֶק
  english_pob_choice: in righteousness
  chosen_spanish: en justicia
  alternatives_spanish:
  - en rectitud
  - con justicia
  lexicon: BDB/HALOT
  rationale: צֶדֶק designa justicia/rectitud en sentido ético y judicial. ‘Justicia’ es la equivalencia más directa y mantiene el peso normativo del término en español bíblico contemporáneo.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones de pacto
  lexicon: HALOT
  rationale: Se mantiene el término auditado del POB en inglés. ‘Testimonios’ conserva la idea de declaraciones divinas atestiguadas, sin sustituirla por un lenguaje más interpretativo como ‘decretos’.
- source_word: וֶאֱמוּנָה
  english_pob_choice: in all faithfulness
  chosen_spanish: en toda fidelidad
  alternatives_spanish:
  - y en toda fidelidad
  - en completa fidelidad
  lexicon: BDB/HALOT
  rationale: אֱמוּנָה suele expresar firmeza, confiabilidad y fidelidad. ‘Fidelidad’ transmite bien la constancia fiel de Dios; ‘toda’ refleja el adverbio מְאֹד intensificando la idea.
- source_word: מְאֹד
  english_pob_choice: all
  chosen_spanish: toda
  alternatives_spanish:
  - completa
  - plena
  lexicon: BDB/HALOT
  rationale: El hebreo intensifica ‘fidelidad’ con מְאֹד (‘mucho’, ‘en gran manera’). En español, ‘toda fidelidad’ reproduce natural y fielmente esa intensificación en una fórmula clara y publicable.
theological_decisions:
- issue: Relación entre justicia y fidelidad en la acción divina
  english_pob_reading: You have commanded your testimonies in righteousness and in all faithfulness.
  chosen_spanish_reading: Tú has ordenado tus testimonios en justicia y en toda fidelidad.
  alternative_spanish_readings:
  - Tú has mandado tus testimonios con justicia y con toda fidelidad
  - Has dispuesto tus testimonios en justicia y total fidelidad
  rationale: 'La línea hebrea presenta dos cualidades de la acción divina: justicia y fidelidad. ‘En justicia y en toda fidelidad’ preserva la construcción preposicional del texto y evita suavizar la afirmación de que los testimonios de Yahvé se caracterizan por su rectitud y confiabilidad completas.'
  doctrine_reference: Salmo 119:138; cf. Salmo 19:7-9; Deuteronomio 32:4
translation_notes:
  revision_awareness: 'No se registran revisiones aplicadas en el paquete inglés; se conserva la lectura de base del POB: ‘testimonies’ -> ‘testimonios’, y se mantiene la intensificación total de מְאֹד con ‘toda’.'
  spanish_consistency_notes:
  - 'Se mantiene la terminología poética y judicial: ‘testimonios’, ‘justicia’, ‘fidelidad’.'
  - Se evita ‘SEÑOR’ porque el versículo no contiene el Tetragrámaton; el sujeto es la segunda persona singular implícita del hebreo.
  - La preposición ‘en’ sigue de cerca la relación semántica del hebreo sin forzar una paráfrasis.
  - La traducción busca ser publicable y transparente, con vocabulario bíblico comprensible para lectores hispanohablantes amplios.
