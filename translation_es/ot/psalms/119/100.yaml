translation:
  language: es
  text: Entiendo más que los ancianos, porque he guardado tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְּקֵנִים
  english_pob_choice: the aged
  chosen_spanish: los ancianos
  alternatives_spanish:
  - los viejos
  - las personas mayores
  lexicon: BDB 278; HALOT זקן
  rationale: El hebreo compara al hablante con personas de edad avanzada. En español, «los ancianos» conserva la comparación de edad y mantiene el tono proverbial sin sonar coloquial.
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I understand
  chosen_spanish: Entiendo
  alternatives_spanish:
  - discierno
  - comprendo
  lexicon: BDB 106; HALOT בִּין
  rationale: El verbo expresa entendimiento/discernimiento. «Entiendo» es natural en español y mantiene el sentido cognitivo general sin introducir una matización más fuerte de juicio o prudencia que el contexto no exige.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandamientos
  - órdenes
  - encargos
  lexicon: HALOT פקוד
  rationale: Se conserva «preceptos» para seguir la decisión auditada del inglés y distinguir este término de otros vocablos de la Torá. En español, «preceptos» mantiene la idea de mandatos específicos confiados por Dios.
- source_word: נָצָרְתִּי
  english_pob_choice: I keep
  chosen_spanish: he guardado
  alternatives_spanish:
  - guardo
  - he observado
  - he preservado
  lexicon: BDB 665; HALOT נצר
  rationale: El verbo tiene el sentido de guardar, observar o vigilar cuidadosamente. «He guardado» comunica bien la acción obediente y refleja el valor continuo/perfectivo del hebreo en un español fluido.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas ni variantes textuales en el paquete fuente; la redacción sigue directamente el texto hebreo masorético y la solución léxica auditada del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene «preceptos» como término técnico consistente con la decisión inglesa auditada.
  - Se usa «ancianos» para el comparativo de edad, sin añadir una connotación de autoridad que el hebreo no exige aquí.
  - 'El orden oracional sigue el hebreo de manera natural en español: comparación de entendimiento, seguida de la causalidad con «porque».'
