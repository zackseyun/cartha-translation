lexical_decisions:
- source_word: סָמַר
  english_pob_choice: trembles
  chosen_spanish: se estremece
  alternatives_spanish:
  - tiembla
  - se eriza
  lexicon: HALOT
  rationale: El verbo expresa una reacción física de estremecimiento o erizamiento por miedo; 'se estremece' conserva bien la respuesta corporal sin sonar forzado en español.
- source_word: בְשָׂרִי
  english_pob_choice: my flesh
  chosen_spanish: mi carne
  alternatives_spanish:
  - mi cuerpo
  - mi ser
  lexicon: HALOT
  rationale: '''Carne'' reproduce la imagen corporal concreta del hebreo y coincide con la lectura inglesa ''my flesh''.'
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: judgments
  chosen_spanish: juicios
  alternatives_spanish:
  - sentencias
  - ordenanzas
  - fallos
  lexicon: HALOT
  rationale: El contexto de temor y reverencia favorece el matiz judicial de מִשְׁפָּט como 'juicios'; en español 'juicios' mantiene esa fuerza más directamente que 'ordenanzas'.
theological_decisions:
- issue: Respuesta apropiada ante los juicios divinos
  english_pob_reading: I stand in awe of your judgments.
  chosen_spanish_reading: y reverencio tus juicios.
  alternative_spanish_readings:
  - y temo tus juicios
  - y me asombro ante tus juicios
  rationale: '''Reverencio'' comunica mejor la combinación de temor y honra implícita en el verso, sin diluir el sentido judicial de ''juicios''.'
  doctrine_reference: Temor reverente ante la justicia de Dios
translation_notes:
  revision_awareness: Se siguió la lectura inglesa auditada, pero se ajustó la segunda cola para expresar en español el matiz de reverencia de יָרֵאתִי sin perder la relación con 'juicios'. No hay notas textuales o variantes en este versículo que requieran aparato adicional.
  spanish_consistency_notes:
  - Se conservó 'carne' para בְשָׂרִי, conforme al uso poético-bíblico estándar.
  - Se eligió 'juicios' para מִשְׁפָּטֶיךָ por el valor judicial documentado en el contexto, en línea con la decisión inglesa auditada.
  - No se usó 'SEÑOR' ni sustitutos, porque el verso no contiene el nombre divino explícito.
