translation:
  language: es
  text: Los arrogantes me han cavado hoyos en contra de tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּרוּ
  english_pob_choice: have dug
  chosen_spanish: han cavado
  alternatives_spanish:
  - han abierto
  - han excavado
  lexicon: HALOT
  rationale: El verbo hebreo expresa cavar o excavar una fosa; en español, «cavado» comunica con naturalidad la acción deliberada de preparar una trampa o fosa. Mantiene el matiz concreto del hebreo sin volverlo abstracto.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_spanish: los arrogantes
  alternatives_spanish:
  - los soberbios
  - los insolentes
  lexicon: HALOT
  rationale: El término describe a personas presumidas, altivas y desafiantes. «Arrogantes» conserva bien ese tono moral y coincide con el registro bíblico en español sin endurecerlo hacia una sola matización psicológica.
- source_word: שִׁיחוֹת
  english_pob_choice: pits
  chosen_spanish: hoyos
  alternatives_spanish:
  - fosas
  - zanjas
  lexicon: HALOT
  rationale: La palabra apunta a cavidades o fosos cavados como trampa. «Hoyos» es claro y natural en español; «fosas» sería más formal y «zanjas» podría sugerir una obra de otro tipo.
- source_word: כְתוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La POB inglesa conserva «law» como equivalencia estable de תּוֹרָה en este salmo. En español, «ley» preserva esa consistencia y la fuerza normativa del término, mientras «instrucción» o «enseñanza» quedan como alternativas legítimas pero menos directas aquí.
theological_decisions:
- issue: Traducción de תּוֹרָה en el salmo
  english_pob_reading: law
  chosen_spanish_reading: ley
  alternative_spanish_readings:
  - instrucción
  - enseñanza
  rationale: En este verso la referencia es a la norma revelada de Dios, y la POB ya fijó «law» para mantener coherencia con el conjunto del salmo. «Ley» conserva mejor la dimensión normativa y litigiosa del contexto de oposición de los arrogantes.
  doctrine_reference: Doctrina de la revelación divina y de la guía normativa de la palabra de Dios
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción sigue directamente el hebreo masorético con el apoyo de la decisión léxica inglesa de la POB para תּוֹרָה.
  spanish_consistency_notes:
  - Se mantuvo un tono sobrio y bíblico sin recurrir a un calco excesivo del inglés.
  - «Los arrogantes» conserva el sujeto plural con valor moral negativo del hebreo.
  - «Han cavado hoyos» transmite la imagen concreta de una trampa excavada.
  - «Tu ley» sigue la convención auditada de la POB para תּוֹרָה en este salmo.
