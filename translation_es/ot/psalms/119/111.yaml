translation:
  language: es
  text: Tus testimonios son mi herencia para siempre; sí, ellos son el gozo de mi corazón.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - estipulaciones del pacto
  lexicon: HALOT
  rationale: Sigo la decisión auditada de la POB de distinguir este término de los otros sinónimos salmódicos. «Testimonios» conserva la idea de declaraciones solemnes y da buen paralelo con el inglés POB, sin desplazar el matiz de testimonio pactual.
- source_word: נָחַלְתִּי
  english_pob_choice: my heritage
  chosen_spanish: mi herencia
  alternatives_spanish:
  - mi patrimonio
  - mi posesión
  - mi heredad
  lexicon: HALOT
  rationale: El verbo comunica recibir o poseer como heredad. «Herencia» es natural en español y mantiene la imagen de posesión recibida y permanente que el inglés POB expresa con «heritage».
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_spanish: para siempre
  alternatives_spanish:
  - eternamente
  - por siempre
  lexicon: HALOT
  rationale: La expresión adverbial temporal pide una fórmula idiomática clara en español. «Para siempre» transmite duración continua sin volverla técnica o arcaizante.
- source_word: שְׂשׂוֹן
  english_pob_choice: joy
  chosen_spanish: gozo
  alternatives_spanish:
  - alegría
  - regocijo
  lexicon: HALOT
  rationale: «Gozo» preserva un registro bíblico digno y corresponde bien al valor afectivo de la palabra hebrea. También evita reducirlo a una emoción pasajera.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi interior
  - mi ser
  lexicon: BDB
  rationale: Se mantiene el antropologismo directo del hebreo. «Corazón» en español bíblico conserva la sede interior de afecto, voluntad y pensamiento.
- source_word: הֵמָּה
  english_pob_choice: they are
  chosen_spanish: ellos son
  alternatives_spanish:
  - son ellos
  - estos son
  lexicon: HALOT
  rationale: El pronombre enfático plural se refleja con una construcción explícita en español. «Ellos son» mantiene la referencia y el énfasis sin forzar el orden.
theological_decisions:
- issue: Naturaleza del vínculo con los testimonios divinos
  english_pob_reading: Your testimonies are my heritage forever
  chosen_spanish_reading: Tus testimonios son mi herencia para siempre
  alternative_spanish_readings:
  - Tus testimonios son mi posesión para siempre
  - Tus testimonios son mi heredad para siempre
  rationale: La frase conserva la idea de posesión heredada y permanente sin espiritualizarla ni convertirla en mera experiencia interior. Se mantiene el valor pactual y de pertenencia del texto.
  doctrine_reference: Salmo 119; herencia del pueblo del pacto
translation_notes:
  revision_awareness: No se aplicaron revisiones textuales adicionales; la redacción sigue el hebreo masorético recibido y la decisión léxica auditada de la POB en inglés.
  spanish_consistency_notes:
  - Se evitó «mandamientos» o «decretos» porque el contexto auditado distingue deliberadamente עֵדְוֺתֶיךָ de otros sinónimos de la Torá.
  - Se usó «gozo» y no «alegría» para mantener consistencia con un registro bíblico más estable en los Salmos.
  - La estructura semicolonada refleja la paralelización del hebreo sin añadir contenido interpretativo.
