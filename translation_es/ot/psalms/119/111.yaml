    rationale: El hebreo incluye el pronombre plural הֵמָּה para retomar enfáticamente «tus testimonios», pero el español no necesita el pronombre sujeto explícito. «Ellos son» después de «sí» suena forzado; una fórmula confirmatoria seguida de «son» conserva el sentido sin calcar la sintaxis hebrea.
  revised_spanish_text: Tus testimonios son mi herencia para siempre; en verdad, son el gozo de mi corazón.
  revision_rationale: Se sustituye la construcción explícita «sí, ellos son» por «en verdad, son» para mejorar la naturalidad del español, conservando el valor confirmatorio de כִּי y la afirmación enfática de que los testimonios son el gozo del corazón del salmista.
