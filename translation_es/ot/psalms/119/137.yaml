translation:
  language: es
  text: '[a] Justo eres tú, Yahvé, e íntegros son tus decretos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 137–144 comienzan con tsade (צ), la decimoctava letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: Righteous
  chosen_spanish: Justo
  alternatives_spanish:
  - Recto
  - Justo/recto
  lexicon: HALOT
  rationale: En este paralelismo con 'íntegros', 'justo' comunica adecuadamente la cualidad moral y judicial del sujeto divino sin forzar una formulación más técnica. 'Recto' es posible, pero en español bíblico actual 'justo' es más natural y conserva la idea de rectitud.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se mantiene el nombre divino como nombre propio, según la política del proyecto, evitando el reemplazo por un título. 'Yahvé' es la forma establecida para el texto principal en español.
- source_word: יָשָׁר
  english_pob_choice: upright
  chosen_spanish: íntegros
  alternatives_spanish:
  - rectos
  - justos
  lexicon: HALOT
  rationale: '''Íntegros'' expresa bien la cualidad de lo recto, firme y sin torcedura, y en español suena natural aplicado a decretos. También preserva el paralelismo con ''justo'' sin repetir exactamente el mismo adjetivo.'
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: decretos
  alternatives_spanish:
  - ordenanzas
  - juicios
  - reglas
  lexicon: HALOT
  rationale: '''Decretos'' comunica la idea de decisiones normativas de Yahvé y funciona bien en español para un término de ley divina. Se evita ''juicios'' por su posible carga punitiva y ''ordenanzas'' por sonar más técnico o menos directo en este contexto.'
theological_decisions:
- issue: Cómo verter el Tetragrámaton en el texto principal
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: El texto fuente nombra directamente a Dios; en español del POB se conserva el nombre propio, no un sustituto reverencial. Esto mantiene la transparencia y la correspondencia con el hebreo.
  doctrine_reference: DOCTRINE.md / nombre divino
- issue: Sentido de מִשְׁפָּטִים como disposiciones normativas de Dios
  english_pob_reading: ordinances
  chosen_spanish_reading: decretos
  alternative_spanish_readings:
  - ordenanzas
  - juicios
  - sentencias
  rationale: En este versículo el término se refiere a las decisiones normativas de Yahvé, no a juicios punitivos humanos. 'Decretos' preserva ese valor legal y revelacional en español.
  doctrine_reference: Lexical theology of divine law in Psalms
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el audit trail inglés. La redacción española sigue directamente el hebreo con apoyo del criterio léxico auditado en la POB inglesa.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' para יְהוָה, conforme al estándar del proyecto.
  - '''Justo'' e ''íntegros'' conservan el paralelismo hebreo sin introducir matices ajenos.'
  - '''Decretos'' se usa de manera consistente para מִשְׁפָּטִים cuando el contexto enfatiza disposiciones normativas divinas.'
