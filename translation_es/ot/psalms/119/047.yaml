  - Disfruto
  lexicon: HALOT; BDB
  rationale: El verbo hebreo expresa placer gozoso o deleite continuo. "Me deleito" conserva bien el matiz afectivo y voluntario que refleja la elección inglesa "I delight", sin volverse demasiado interpretativo.
- source_word: בְּמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus órdenes
  - tus preceptos
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֹת designa mandamientos autoritativos de Dios. "Mandamientos" mantiene la forma establecida en español y conserva la correspondencia con la decisión inglesa de POB.
- source_word: אָהָבְתִּי
  english_pob_choice: I love
  chosen_spanish: amo
  alternatives_spanish:
  - amo mucho
  - he amado
  lexicon: BDB
  rationale: 'El perfecto hebreo aquí expresa una realidad personal y vigente: el salmista ama esos mandamientos. "Amo" es natural en español y refleja el valor simple y directo del verbo.'
