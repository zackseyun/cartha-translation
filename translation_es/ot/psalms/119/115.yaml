lexical_decisions:
- source_word: סֽוּרוּ מִמֶּ֥נִּי
  english_pob_choice: Depart from me
  chosen_spanish: Apártense de mí
  alternatives_spanish:
  - Aléjense de mí
  - Retírense de mí
  lexicon: HALOT / BDB (סור); POB source audit
  rationale: El hebreo imperativo plural pide que se aparten o se retiren. 'Apártense de mí' conserva la fuerza directa y es natural en español bíblico actual. 'Depart' en inglés POB no exige un calco rígido; la noción central es separación física/relacional.
- source_word: מְרֵעִים
  english_pob_choice: evildoers
  chosen_spanish: malhechores
  alternatives_spanish:
  - malvados
  - los que hacen el mal
  lexicon: HALOT / BDB (רעע, participio plural sustantivado); POB source audit
  rationale: El participio describe a quienes hacen el mal. 'Malhechores' es un sustantivo español claro, bíblico y preciso; evita la abstracción de 'malvados' y mantiene el valor agentivo del original.
- source_word: מִצְוֺת
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandatos
  - preceptos
  lexicon: HALOT; English POB lexical note
  rationale: POB fijó 'commandments' para מִצְוָה/מִצְוֺת en este salmo. En español, 'mandamientos' comunica bien la fuerza autoritativa de las disposiciones divinas y mantiene la consistencia terminológica del pasaje.
- source_word: אֱלֹהָי
  english_pob_choice: my God
  chosen_spanish: mi Dios
  alternatives_spanish:
  - mi Diosito
  - el Dios mío
  lexicon: BHS/WLC; POB source audit
  rationale: La forma posesiva hebrea requiere 'mi Dios'. Se preserva la relación personal del salmista sin introducir solemnidad artificial o inversión enfática no necesaria.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; esta versión sigue el texto hebreo masorético WLC y la decisión léxica inglesa auditada para מִצְוֺת como 'commandments'.
  spanish_consistency_notes:
  - Se mantuvo el imperativo plural con tratamiento de segunda persona plural formal de cortesía ('ustedes') para reflejar el hebreo plural sin regionalismo excesivo.
  - '''Dios'' se conserva con minúscula posesiva (''mi Dios'') según uso normal del español; no se usa ''Señor'' porque el hebreo aquí dice אֱלֹהָי.'
  - No se añadieron notas textuales ni teológicas porque el verso no presenta una variante relevante en el paquete fuente.
