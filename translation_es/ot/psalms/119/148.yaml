  text: Mis ojos se adelantan a las vigilias de la noche, para meditar en tu promesa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ עֵינַי
  english_pob_choice: My eyes stay open
  chosen_spanish: Mis ojos se adelantan
  alternatives_spanish:
  - Mis ojos permanecen despiertos
  - Mis ojos se adelantan antes
  lexicon: HALOT / contexto poético
  rationale: 'El hebreo expresa antecedencia: los ojos ‘se adelantan’ a las vigilias, es decir, llegan antes que el tiempo habitual de dormir. En español, ‘se adelantan’ conserva la idea de anticipación mejor que un simple ‘permanecen abiertos’, que suaviza el matiz del verbo.'
- source_word: אַשְׁמֻרוֹת
  english_pob_choice: the watches of the night
  chosen_spanish: las vigilias de la noche
  alternatives_spanish:
  - las guardias de la noche
  - las horas de la noche
  lexicon: BDB / uso bíblico
  rationale: ‘Vigilias’ reproduce el lenguaje de turnos nocturnos y mantiene el registro bíblico-poético. ‘Guardias’ sería posible, pero en español suena más a centinelas que a división del tiempo; ‘horas’ pierde la imagen original.
- source_word: לָשִׂיחַ
  english_pob_choice: to meditate
  chosen_spanish: para meditar
  alternatives_spanish:
  - para reflexionar
  - para conversar conmigo
  lexicon: HALOT / uso poético de שׂיח
  rationale: El verbo puede abarcar meditar, reflexionar o hablar consigo mismo. En este contexto, la POB inglesa eligió ‘meditate’, y ‘meditar’ comunica bien la actividad interior sin añadir elementos no presentes.
- source_word: בְּאִמְרָתֶךָ
  english_pob_choice: your promise
  chosen_spanish: tu promesa
  alternatives_spanish:
  - tu palabra
  - tu dicho
  - tu decir
  lexicon: HALOT
  rationale: 'Como en la base inglesa, ‘promesa’ sigue el valor contextual de אִמְרָה en este salmo: una palabra divina comprometida y confiable. ‘Palabra’ sería más general y podría borrar la distinción ya establecida en el aparato inglés.'
theological_decisions:
- issue: Cómo rendir la imagen temporal de la vigilancia nocturna sin perder el tono devocional
  english_pob_reading: My eyes stay open through the watches of the night, to meditate on your promise.
  chosen_spanish_reading: Mis ojos se adelantan a las vigilias de la noche, para meditar en tu promesa.
  alternative_spanish_readings:
  - Mis ojos permanecen despiertos durante las vigilias de la noche, para meditar en tu promesa.
  - Mis ojos velan en la noche, para meditar en tu promesa.
  rationale: La elección conserva la tensión entre insomnio/vigilia y propósito espiritual. ‘Se adelantan’ refleja la precedencia temporal del hebreo sin imponer una causa psicológica no explícita. Esto mantiene la oración poética como testimonio de anhelo por la palabra de Yahvé.
  doctrine_reference: Salmo 119:148; cf. Salmo 63:6
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; se sigue la lectura inglesa auditada ‘promise’ para אִמְרָה y se privilegia la antecedencia verbal del hebreo en קִדְּמוּ.
  spanish_consistency_notes:
  - Se mantiene ‘Yahvé’ como forma estándar del proyecto, aunque este versículo usa una alusión implícita en ‘tu promesa’.
  - Se conserva el paralelismo poético con una sola cláusula principal y un infinitivo final.
  - No se usa ‘SEÑOR’ como máscara; la referencia divina queda en el posesivo de segunda persona.
