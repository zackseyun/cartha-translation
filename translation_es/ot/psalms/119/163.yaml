  text: Odio y desprecio la falsedad; pero amo tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_spanish: falsedad
  alternatives_spanish:
  - mentira
  - engaño
  lexicon: HALOT
  rationale: שֶׁקֶר denota falsedad, mentira o engaño. 'Falsedad' comunica bien el contraste moral general del verso y conserva un registro digno y amplio; 'mentira' sería más concreto, pero algo más estrecho.
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_spanish: odio
  alternatives_spanish:
  - aborrezco
  - detesto
  lexicon: HALOT
  rationale: El verbo expresa odio real e intenso. 'Odio' es directo y natural en español; 'aborrezco' o 'detesto' son posibles, pero 'odio' refleja mejor la fuerza semántica sin añadir matiz extra.
- source_word: וַאֲתַעֵבָה
  english_pob_choice: despise
  chosen_spanish: desprecio
  alternatives_spanish:
  - aborrezco profundamente
  - tengo por abominable
  lexicon: HALOT
  rationale: El paralelo intensifica el rechazo a la falsedad. 'Desprecio' conserva la idea de menosprecio/rechazo fuerte y funciona bien como segundo término en la pareja verbal.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se conserva la decisión auditada del POB inglés de traducir תּוֹרָה como 'law'. En español, 'ley' es el equivalente más natural y estable dentro del Salmo 119, donde el término forma parte del conjunto de designaciones para la palabra revelada de Dios.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de fuente. La versión española sigue de cerca la lectura hebrea y la solución inglesa auditada, manteniendo el paralelismo antitético entre el rechazo a la falsedad y el amor por la ley de Dios.
  spanish_consistency_notes:
  - Se usa 'ley' para תּוֹרָה en continuidad con la decisión inglesa auditada del POB.
  - Se mantiene un registro claro y sobrio, apto para lectura pública e ինտelligible en español general.
  - La puntuación reproduce el contraste del hebreo con 'pero' para marcar el giro adversativo.
