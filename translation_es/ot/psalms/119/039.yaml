translation:
  language: es
  text: Aparta el oprobio que temo, porque tus ordenanzas son buenas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֲבֵר / Turn away
  english_pob_choice: Turn away
  chosen_spanish: Aparta
  alternatives_spanish:
  - Aleja
  - Quita
  - Desvía
  lexicon: BDB/uso contextual
  rationale: El hebreo es un imperativo causativo con sentido de apartar o retirar. «Aparta» conserva la fuerza directiva y suena natural en español sin perder el matiz de remoción.
- source_word: חֶרְפָּתִי
  english_pob_choice: reproach
  chosen_spanish: el oprobio
  alternatives_spanish:
  - la afrenta
  - el reproche
  - la vergüenza
  lexicon: HALOT
  rationale: חֶרְפָּה expresa deshonra, afrenta o oprobio. «Oprobio» mantiene el peso de deshonra pública mejor que «reproche», que en español puede sonar más leve o meramente verbal.
- source_word: יָגֹרְתִּי
  english_pob_choice: that I dread
  chosen_spanish: que temo
  alternatives_spanish:
  - que me da miedo
  - que he temido
  - que me aterra
  lexicon: BDB
  rationale: El verbo indica temer, estar atemorizado o sentir pavor. «Temo» es la forma más sobria y fiel en español; conserva la referencia a una amenaza temida sin intensificarla indebidamente.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: tus ordenanzas
  alternatives_spanish:
  - tus juicios
  - tus decretos
  - tus reglas
  lexicon: HALOT
  rationale: Siguiendo la decisión auditada del inglés POB, «ordenanzas» refleja מִשְׁפָּט como disposiciones o normas reveladas de Dios, evitando el matiz punitivo de «juicios» y manteniendo la distinción con otros términos legales del Salmo.
- source_word: טוֹבִים
  english_pob_choice: good
  chosen_spanish: son buenas
  alternatives_spanish:
  - son justas
  - son benignas
  - son rectas
  lexicon: BDB/HALOT
  rationale: El adjetivo plural concuerda con «ordenanzas» y expresa la valoración ética positiva del texto. «Buenas» es directo y suficientemente amplio para abarcar bondad, rectitud y benevolencia.
theological_decisions:
- issue: Renderización de מִשְׁפָּטֶיךָ como término legal divino
  english_pob_reading: ordinances
  chosen_spanish_reading: ordenanzas
  alternative_spanish_readings:
  - juicios
  - decretos
  - reglas
  rationale: La lectura POB distingue este término de otros vocablos legales del Salmo. «Ordenanzas» preserva el sentido de normas justas establecidas por Dios y evita una carga condenatoria que «juicios» podría sugerir en español.
  doctrine_reference: Salmo 119; ley/instrucción divina como expresión de la bondad de Yahvé
- issue: Relación entre el temor humano y la bondad de los mandatos divinos
  english_pob_reading: for your ordinances are good
  chosen_spanish_reading: porque tus ordenanzas son buenas
  alternative_spanish_readings:
  - pues tus ordenanzas son buenas
  - porque tus decretos son buenos
  rationale: 'La cláusula causal debe mantener la lógica del versículo: la petición de alivio se apoya en el carácter bueno de la norma divina. «Son buenas» conserva la evaluación moral del texto sin reinterpretarla.'
  doctrine_reference: Salmo 119:38–40; bondad de la revelación de Yahvé
translation_notes:
  revision_awareness: Este borrador sigue de cerca el hebreo masorético y la decisión auditada del inglés POB de ver מִשְׁפָּטֶיךָ como 'ordinances'. No se documentan revisiones textuales adicionales en el paquete fuente.
  spanish_consistency_notes:
  - Se usa «Yahvé» según la terminología del proyecto para el nombre divino cuando aparezca; en este versículo no se explicita.
  - Se mantiene un registro sobrio y bíblico, evitando calcos innecesarios como «reproche» si debilitan la fuerza de חֶרְפָּה.
  - «Ordenanzas» se conserva para alinear este versículo con la terminología del POB y distinguirlo de otros términos legales del Salterio.
