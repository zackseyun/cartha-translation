translation:
  language: es
  text: Mi alma desfallece por tu salvación; en tu palabra espero.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 81–88 comienzan con kaf (כ), la undécima letra del alfabeto; continúa así el acróstico introducido en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלְתָה ... נַפְשִׁי
  english_pob_choice: My soul faints
  chosen_spanish: Mi alma desfallece
  alternatives_spanish:
  - Mi alma se consume
  - Mi alma se agota
  lexicon: BDB / HALOT
  rationale: כָּלָה expresa quedar consumido, agotado o desfallecer; en español, 'desfallece' comunica bien la intensidad poética sin introducir una idea más física de 'consumirse' que podría sonar menos natural aquí.
- source_word: תְשׁוּעָה
  english_pob_choice: salvation
  chosen_spanish: salvación
  alternatives_spanish:
  - liberación
  - rescate
  lexicon: HALOT
  rationale: El sustantivo designa rescate, liberación o salvación; 'salvación' es la forma más amplia y digna en español y mantiene el alcance teológico del texto.
- source_word: לִדְבָרְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu palabra dicha
  - tu dicho
  lexicon: HALOT
  rationale: דָּבָר, según el contexto y el audit trail inglés, se refiere a la palabra pronunciada de Dios. 'Tu palabra' preserva esa distinción frente a otros posibles valores como 'cosa' o 'asunto'.
- source_word: יִחָלְתִּי
  english_pob_choice: I hope
  chosen_spanish: espero
  alternatives_spanish:
  - anhelo
  - aguardo con esperanza
  lexicon: HALOT
  rationale: El verbo puede expresar esperar con confianza y anhelar. 'Espero' es breve y fiel; en español conserva la tensión de confianza activa sin sobrecargar el verso.
theological_decisions:
- issue: Relación entre 'salvación' y la esperanza en la palabra de Yahvé
  english_pob_reading: My soul faints for your salvation; I hope in your word.
  chosen_spanish_reading: Mi alma desfallece por tu salvación; en tu palabra espero.
  alternative_spanish_readings:
  - Mi alma desfallece por tu liberación; en tu palabra espero.
  - Mi alma desfallece por tu rescate; en tu palabra espero.
  rationale: No hay indicio de un sentido restringido solo a una liberación temporal; 'salvación' mantiene la amplitud del hebreo y la resonancia bíblica del clamor por intervención divina.
  doctrine_reference: Sal 119:81; cf. Sal 119:41, 49, 114
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés. La versión española sigue la lectura base del hebreo WLC y conserva el paralelismo entre el clamor por la salvación y la confianza en la palabra de Yahvé.
  spanish_consistency_notes:
  - Se usó 'Yahvé' en el marco editorial del proyecto, pero este versículo no contiene el tetragrámaton ni una forma explícita del nombre divino.
  - '''palabra'' se mantuvo para דָּבָר conforme al criterio auditado del inglés POB.'
  - '''espero'' conserva el valor de espera confiada sin convertir el verbo en una paráfrasis devocional más libre.'
