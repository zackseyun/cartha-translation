  text: Todos tus mandamientos son fieles; me persiguen con mentira; ¡ayúdame!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato(s)
  - preceptos
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת denota los mandatos autoritativos de Dios. En español, 'mandamientos' comunica bien ese valor normativo y mantiene la consistencia con la tradición de vocabulario bíblico, sin desplazar el matiz de autoridad que trae el hebreo.
- source_word: אֱמוּנָה
  english_pob_choice: faithful
  chosen_spanish: fieles
  alternatives_spanish:
  - verdaderos
  - firmes
  lexicon: HALOT
  rationale: Aquí el término califica a 'todos tus mandamientos' y no describe una cualidad abstracta de fe humana. 'Fieles' conserva la idea de confiabilidad/solidez del hebreo y sigue de cerca la lectura inglesa 'faithful'.
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_spanish: mentira
  alternatives_spanish:
  - falsedad
  - engaño
  lexicon: HALOT
  rationale: El hebreo presenta la oposición con verdad/falsedad en el ámbito de la persecución. 'Mentira' funciona de forma natural en español como sustantivo de modo y conserva el contraste con la fidelidad de los mandamientos.
- source_word: רְדָפוּנִי
  english_pob_choice: persecute me
  chosen_spanish: me persiguen
  alternatives_spanish:
  - me acosan
  - me hostigan
  lexicon: HALOT
  rationale: El verbo expresa persecución activa e ինտensa. 'Me persiguen' es una equivalencia directa y clara en español, sin perder el peso hostil del verbo hebreo.
- source_word: עָזְרֵנִי
  english_pob_choice: help me
  chosen_spanish: ¡ayúdame!
  alternatives_spanish:
  - socórreme
  - ven en mi ayuda
  lexicon: HALOT
  rationale: El imperativo pide auxilio urgente. '¡Ayúdame!' es idiomático, directo y fiel; conserva la súplica breve y enfática del final del versículo.
theological_decisions:
- issue: Cómo rendir la afirmación sobre los mandamientos de Yahvé
  english_pob_reading: All your commandments are faithful
  chosen_spanish_reading: Todos tus mandamientos son fieles
  alternative_spanish_readings:
  - Todos tus mandamientos son verdaderos
  - Todos tus mandamientos son dignos de confianza
  rationale: El hebreo atribuye a los mandamientos una cualidad de confiabilidad/fiabilidad. 'Fieles' mantiene esa cualidad sin añadir una abstracción doctrinal ajena al verso. No se usa 'verdaderos' porque podría desplazar el énfasis desde la confiabilidad hacia la verdad proposicional.
  doctrine_reference: Salmo 119; fidelidad de la palabra y los mandamientos de Dios
- issue: Cómo reproducir la tensión entre la fidelidad divina y la persecución injusta
  english_pob_reading: they persecute me with falsehood
  chosen_spanish_reading: me persiguen con mentira
  alternative_spanish_readings:
  - me persiguen con falsedad
  - me persiguen falsamente
  rationale: 'La forma hebrea une la persecución con ''mentira/falsedad''. ''Con mentira'' preserva la expresión concisa y la ambigüedad relacional: la persecución está caracterizada por la falsedad y quizá instrumentada por ella. Se evita suavizarla a un mero adverbio (''falsamente'') para no perder la textura del hebreo.'
  doctrine_reference: Salmo 119; sufrimiento del justo ante acusadores falsos
translation_notes:
  revision_awareness: No se registran revisiones textuales en el paquete provisto; la redacción sigue de cerca el hebreo masorético y la decisión léxica inglesa auditada.
  spanish_consistency_notes:
  - Se mantiene 'mandamientos' para מִצְוֺת en coherencia con el campo normativo establecido en el audit trail inglés.
  - '''Fieles'' se usa como predicativo de ''mandamientos'' en sentido de confiables/firmes, no como referencia a fe humana.'
  - La súplica final se conserva breve y exclamativa para reflejar el cierre urgente del hebreo.
