    rationale: Aunque no altera gravemente el sentido, el singular «mentira» suele referirse en español a una afirmación falsa concreta. «Con falsedad» expresa mejor el valor abstracto de שֶׁקֶר y conserva la concisión del original.
  revised_spanish_text: Todos tus mandamientos son fieles; me persiguen con falsedad; ¡ayúdame!
