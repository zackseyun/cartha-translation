review_pass:
  verdict: revise
  source_alignment_summary: 'La estructura y el sentido general se conservan: el salmista pide que los זֵדִים sean avergonzados, da como motivo su acción engañosa contra él y contrapone su propia meditación en los preceptos divinos. Sin embargo, «me tuercen» no comunica idiomáticamente en español el piel de עוה, que aquí expresa tratar torcidamente, obrar perversamente o agraviar a alguien.'
  spanish_quality_summary: «Sean avergonzados los insolentes» es una formulación clara y digna; «insolentes» representa adecuadamente a los orgullosos y desafiantes. «Tus preceptos» es natural y consistente. Debe reemplazarse únicamente «con falsedad me tuercen», construcción poco natural y semánticamente imprecisa, por una expresión española que preserve tanto el agravio como la falsedad.
  glossary_alignment: «Preceptos» corresponde correctamente a פִּקּוּדִים y mantiene la distinción POB frente a mandamientos y estatutos. No intervienen en el versículo los términos teológicos sujetos a una convención especial del proyecto.
  issues:
  - severity: medium
    issue: «con falsedad me tuercen» es un calco no idiomático de עִוְּתוּנִי.
    rationale: Aunque עוה posee la imagen de torcer/pervertir, el objeto pronominal se refiere a la persona perjudicada, no a algo que en español se pueda decir naturalmente que «tuercen». «Me han agraviado con falsedad» expresa el trato injusto o perverso y conserva explícitamente שֶׁקֶר.
  revised_spanish_text: Sean avergonzados los insolentes, porque me han agraviado con falsedad; pero yo meditaré en tus preceptos.
  revision_rationale: Se sustituye el calco «me tuercen» por «me han agraviado con falsedad». La revisión conserva el sentido de la acción perversa o torcida de עוה contra el salmista, hace explícita la falsedad de שקר y produce español natural. No se requiere nota, pues no se pierde una alternativa significativa que la traducción deba preservar en este versículo.
