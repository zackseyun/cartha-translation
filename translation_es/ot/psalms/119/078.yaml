translation:
  language: es
  text: Sean avergonzados los insolentes, porque me han agraviado con falsedad; pero yo meditaré en tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ / יֵבֹשׁוּ זֵדִים
  english_pob_choice: Let the arrogant be put to shame
  chosen_spanish: Sean avergonzados los insolentes
  alternatives_spanish:
  - Sean avergonzados los arrogantes
  - Queden avergonzados los soberbios
  lexicon: BDB 954; HALOT 954
  rationale: El verbo en hebreo expresa vergüenza/avergonzamiento; en español bíblico natural, "sean avergonzados" conserva esa fuerza. זֵדִים describe a los altivos/insolentes; "insolentes" comunica mejor el tono provocador y desafiante que "arrogantes" en este contexto, aunque ambas opciones son posibles.
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_spanish: falsedad
  alternatives_spanish:
  - mentira
  - engaño
  lexicon: BDB 833; HALOT 8267
  rationale: '"Falsedad" mantiene el sustantivo abstracto del hebreo y permite que el contraste con la conducta de los enemigos sea amplio, sin reducirlo solo a una mentira puntual.'
- source_word: עִוְּת֑וּ/נִי
  english_pob_choice: they wrong me
  chosen_spanish: me tuercen
  alternatives_spanish:
  - me hacen daño
  - me pervierten
  - me tratan injustamente
  lexicon: BDB 7862/5791; HALOT 5791
  rationale: El hebreo sugiere torcer o pervertir algo recto; "me tuercen" conserva esa imagen verbal y la relación con la falsedad. Es más literal y auditable que una paráfrasis como "me hacen daño".
- source_word: בְּפִקּוּדֶֽיךָ
  english_pob_choice: precepts
  chosen_spanish: tus preceptos
  alternatives_spanish:
  - tus mandamientos
  - tus órdenes
  lexicon: HALOT 6490
  rationale: Se conserva "preceptos" para mantener la distinción terminológica ya documentada en la tradición POB; en español es claro y suficientemente formal, y evita mezclar este término con "mandamientos" o "estatutos".
translation_notes:
  revision_awareness: Se siguió el sentido del texto hebreo y la decisión auditada de POB para פִקּוּדִים = "precepts". No se añadieron notas porque la redacción española conserva las tensiones semánticas principales sin requerir alternativas textuales explícitas.
  spanish_consistency_notes:
  - 'Se mantuvo el paralelismo adversativos: primera cola sobre la vergüenza de los insolentes, segunda cola sobre la respuesta fiel del salmista.'
  - '"Preceptos" se usa de forma consistente con la terminología POB para פִקּוּדִים.'
  - La puntuación con punto y coma refleja adecuadamente la pausa del hebreo y el contraste final.
