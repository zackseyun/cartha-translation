  rationale: Se sustituye el calco «me tuercen» por «me han agraviado con falsedad». La revisión conserva el sentido de la acción perversa o torcida de עוה contra el salmista, hace explícita la falsedad de שקר y produce español natural. No se requiere nota, pues no se pierde una alternativa significativa que la traducción deba preservar en este versículo.
