translation:
  language: es
  text: He guardado tus preceptos y tus testimonios, porque todos mis caminos están delante de ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַרְתִּי
  english_pob_choice: I keep
  chosen_spanish: He guardado
  alternatives_spanish:
  - Guardo
  - He observado
  lexicon: HALOT
  rationale: El hebreo perfecto expresa una acción asumida como verdadera y completa en la confesión del salmista. «He guardado» conserva ese valor sin volverlo mecánico, y encaja bien con el paralelismo del versículo.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - órdenes
  - mandatos
  lexicon: HALOT
  rationale: «Preceptos» mantiene la distinción léxica que el POB documenta para פִּקּוּדִים y suena natural en español bíblico contemporáneo, sin confundirlo con otros términos de la ley divina.
- source_word: וְעֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones del pacto
  lexicon: HALOT
  rationale: «Testimonios» sigue el audit trail del POB para עֵדוֹת y preserva la terminología distintiva del salmo. «Tus testimonios» suena idiomático y mantiene la relación de pertenencia del sufijo.
- source_word: כִּי
  english_pob_choice: for
  chosen_spanish: porque
  alternatives_spanish:
  - pues
  - ya que
  lexicon: BDB
  rationale: En este contexto causal, «porque» transmite la razón de la confesión anterior con claridad natural en español.
- source_word: כָל דְּרָכַי
  english_pob_choice: all my ways
  chosen_spanish: todos mis caminos
  alternatives_spanish:
  - todas mis sendas
  - todas mis acciones
  lexicon: BDB
  rationale: «Caminos» es la metáfora habitual para la conducta total de una persona y reproduce bien el hebreo דְּרָכַי sin explicitar de más.
- source_word: נֶגְדֶּךָ
  english_pob_choice: before you
  chosen_spanish: delante de ti
  alternatives_spanish:
  - ante ti
  - en tu presencia
  lexicon: BDB
  rationale: «Delante de ti» conserva la imagen espacial del hebreo y coincide con el sentido auditivo del POB, sin imponer una paráfrasis más interpretativa.
translation_notes:
  revision_awareness: No se registran revisiones previas ni variantes textuales en el paquete fuente; la redacción española sigue directamente el hebreo consonante/masorético tal como fue auditado en la traducción inglesa POB.
  spanish_consistency_notes:
  - Se mantuvo la terminología técnica del POB para פִקּוּדִים = «preceptos» y עֵדוֹת = «testimonios».
  - Se evitó «SEÑOR» porque el versículo no contiene el tetragrámaton ni una cita directa del nombre divino.
  - El orden sintáctico se ajustó a una frase española natural sin añadir elementos ausentes en el hebreo.
