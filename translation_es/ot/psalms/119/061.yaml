  text: Aunque me rodeen las cuerdas de los impíos, no he olvidado tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבְלֵי רְשָׁעִים
  english_pob_choice: the cords of the wicked
  chosen_spanish: las cuerdas de los impíos
  alternatives_spanish:
  - los lazos de los malvados
  - las cuerdas de los malvados
  lexicon: HALOT
  rationale: חֶבְלֵי puede referirse a cuerdas, lazos o ataduras; en este contexto poético, 'cuerdas' conserva la imagen concreta del texto hebreo y permite mantener la metáfora de captura/atadura. רְשָׁעִים se rinde con 'impíos' para reflejar el valor moral-jurídico de 'wicked' y la terminología bíblica habitual en español.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se conserva 'ley' porque el audit trail inglés ya fijó esa elección por consistencia con el Salterio. En español, 'ley' mantiene la referencia a la התורה como instrucción revelada de Dios sin perder la familiaridad bíblica; 'instrucción' y 'enseñanza' quedan como alternativas legítimas, pero menos estables para el lector.
- source_word: שָׁכָחְתִּי
  english_pob_choice: I do not forget
  chosen_spanish: no he olvidado
  alternatives_spanish:
  - no olvido
  - no he dejado de recordar
  lexicon: BDB
  rationale: 'El perfecto hebreo se expresa con un perfecto compuesto natural en español: ''no he olvidado''. Esta forma comunica un estado persistente derivado de una acción negativa completada, en línea con el sentido confesional del verso.'
theological_decisions:
- issue: Imagen de captura frente a resistencia fiel
  english_pob_reading: Though the cords of the wicked ensnare me, I do not forget your law.
  chosen_spanish_reading: Aunque me rodeen las cuerdas de los impíos, no he olvidado tu ley.
  alternative_spanish_readings:
  - Aunque las cuerdas de los impíos me aten, no he olvidado tu ley.
  - Aunque me enreden las cuerdas de los impíos, no he olvidado tu ley.
  rationale: 'El hebreo presenta una imagen de opresión/atadura más que una explicación abstracta. ''Me rodeen'' conserva la presión envolvente de la imagen sin añadir el matiz interpretativo fuerte de ''aten'' o ''enreden''. La afirmación central permanece: la fidelidad a la ley de Yahvé no cede bajo presión.'
  doctrine_reference: Salmo 119; fidelidad perseverante a la palabra de Dios bajo aflicción
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; se sigue la lectura estándar del texto hebreo y la decisión inglesa de mantener 'law' para תּוֹרָה.
  spanish_consistency_notes:
  - Se mantiene 'ley' para תּוֹרָה en consonancia con el audit trail inglés y con la consistencia interna del Salmo 119.
  - Se preserva la distinción poética entre la opresión de los impíos y la memoria obediente del salmista, sin suavizar la tensión del hebreo.
  - No se introduce 'Yahvé' porque el versículo usa la segunda persona pronominal 'tu'; la referencia al nombre divino es implícita en el contexto inmediato.
