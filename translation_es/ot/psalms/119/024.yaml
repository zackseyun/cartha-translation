translation:
  language: es
  text: También tus testimonios son mi delicia; ellos son mis consejeros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - estatutos del pacto
  lexicon: HALOT
  rationale: Se conserva el valor de ‘testimonies’ del POB inglés para reflejar el plural jurídico-testimonial de עֵדוֹת/עֵדֹת en el salmo. ‘Testimonios’ es natural en español y mantiene la idea de testimonio divino más que una simple ordenanza.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_spanish: mi delicia
  alternatives_spanish:
  - mi gozo
  - mi deleite
  lexicon: HALOT
  rationale: El término expresa placer/apego gozoso; ‘mi delicia’ reproduce bien el sustantivo abstracto y la fuerza afectiva sin exagerar. ‘Mi deleite’ es posible, pero ‘delicia’ suena más natural y bíblico en español contemporáneo.
- source_word: אַנְשֵׁי עֲצָתִי
  english_pob_choice: they are my counselors
  chosen_spanish: mis consejeros
  alternatives_spanish:
  - mis consejeros son ellos
  - los hombres de mi consejo
  lexicon: HALOT
  rationale: אנשי עצתי apunta a personas que dan consejo; ‘mis consejeros’ preserva el sentido relacional y evita una literalidad torpe. Se mantiene el paralelismo con la frase anterior, como en el POB inglés.
theological_decisions:
- issue: Cómo reflejar la función de los testimonios divinos en la segunda cola
  english_pob_reading: they are my counselors
  chosen_spanish_reading: ellos son mis consejeros
  alternative_spanish_readings:
  - son mis consejeros
  - ellos me aconsejan
  rationale: 'Se conserva la personificación del hebreo y del POB inglés: los testimonios no solo orientan, sino que ‘son’ consejeros para el salmista. ‘Ellos me aconsejan’ suaviza esa personificación y pierde el paralelismo nominal.'
  doctrine_reference: Sabiduría de la Torá como guía suficiente para la vida fiel (Sal 119; cf. Dt 17:18-19).
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la redacción sigue de cerca el texto hebreo y coincide con la decisión lexical auditada del POB inglés para עֵדֹתֶיךָ.
  spanish_consistency_notes:
  - Se mantiene el plural ‘testimonios’ para עֵדֹתֶיךָ, en continuidad con el criterio auditado del POB inglés.
  - 'Se conserva la estructura paralela de dos miembros del versículo: afirmación de deleite y afirmación de consejería.'
  - ‘También’ refleja el גַּם inicial, añadiendo continuidad/enfasis sin sobretraducción.
