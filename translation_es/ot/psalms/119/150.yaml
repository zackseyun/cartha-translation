lexical_decisions:
- source_word: רֹדְפֵי
  english_pob_choice: pursue
  chosen_spanish: persiguen
  alternatives_spanish:
  - siguen tras
  - andan tras
  - acosan
  lexicon: HALOT
  rationale: El participio expresa persecución persistente; «persiguen» conserva la idea de búsqueda activa sin introducir una carga más específica que el hebreo no exige aquí.
- source_word: זִמָּה
  english_pob_choice: evil schemes
  chosen_spanish: planes perversos
  alternatives_spanish:
  - maquinaciones perversas
  - malas intenciones
  - designios perversos
  lexicon: HALOT
  rationale: זִמָּה puede denotar plan o intención con carga moral negativa. «Planes perversos» mantiene el sustantivo concreto y la valoración moral del contexto poético.
- source_word: מִתּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: POB mantiene «law» por coherencia en el salmo; en español «ley» conserva esa consistencia y refleja la opción auditada, aunque «instrucción/enseñanza» siguen como matices posibles de תּוֹרָה.
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_spanish: ley
  alternatives_spanish:
  - instrucción
  - enseñanza
  lexicon: HALOT
  rationale: La traducción base del POB en este versículo es «law»; en español, «ley» es la correspondencia más establecida y mantiene la tensión entre norma revelada e instrucción divina sin diluirla.
theological_decisions:
- issue: Relación entre la cercanía de los impíos y la distancia respecto de la Torá
  english_pob_reading: Those who pursue evil schemes draw near; they are far from your law.
  chosen_spanish_reading: Los que persiguen planes perversos se acercan; están lejos de tu ley.
  alternative_spanish_readings:
  - Se acercan los que persiguen el mal; están lejos de tu ley.
  - Los que siguen maquinaciones perversas se acercan; están lejos de tu ley.
  rationale: 'El hebreo contrapone dos movimientos: cercanía física/activa de los perseguidores y lejanía moral respecto de la Torá. La versión española conserva esa antítesis sin suavizarla ni reinterpretarla.'
  doctrine_reference: Salmos 119:150; fidelidad a la Torá como criterio de cercanía o alejamiento moral
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de origen; la redacción española sigue directamente el texto hebreo y la decisión auditada del POB inglés para תּוֹרָה.
  spanish_consistency_notes:
  - Se conserva «ley» para תּוֹרָה en coherencia con la decisión inglesa auditada.
  - «Perversos» traduce la valoración negativa de זִמָּה sin exagerarla.
  - La sintaxis busca ser natural en español y mantener el paralelismo del versículo.
