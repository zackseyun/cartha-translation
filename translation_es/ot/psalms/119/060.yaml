  text: Me apresuré y no me demoré en guardar tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַ֭שְׁתִּי
  english_pob_choice: I hurry
  chosen_spanish: Me apresuré
  alternatives_spanish:
  - me doy prisa
  - me precipité
  lexicon: BDB/HALOT
  rationale: El hebreo expresa prontitud/intención de rapidez. «Me apresuré» comunica bien el valor perfectivo y resulta natural en español bíblico contemporáneo.
- source_word: וְלֹא הִתְמַהְמָהְתִּי
  english_pob_choice: and do not delay
  chosen_spanish: no me demoré
  alternatives_spanish:
  - no tardé
  - no me detuve
  lexicon: BDB/HALOT
  rationale: La idea es de no hacerse esperar ni quedarse atrás. «Demoré» conserva la noción de retraso de forma clara y fluida en español.
- source_word: לִשְׁמֹר
  english_pob_choice: to keep
  chosen_spanish: en guardar
  alternatives_spanish:
  - para guardar
  - para obedecer
  lexicon: HALOT
  rationale: «Guardar» es el equivalente bíblico natural para שׁמר cuando significa observar/cumplir mandamientos. La preposición «en» da una construcción idiomática con el verbo precedente.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus mandatos
  - tus órdenes
  lexicon: HALOT
  rationale: Se conserva el término técnico y coherente con la decisión inglesa de «commandments». «Mandamientos» es la forma más estable y comprensible en español para el campo semántico de מִצְוָה.
translation_notes:
  revision_awareness: No se registran revisiones en el paquete fuente; la propuesta sigue de cerca el hebreo y la elección inglesa auditada, sin añadir notas textuales o variantes.
  spanish_consistency_notes:
  - Se mantiene la terminología «mandamientos» para מִצְוֺתֶיךָ, en línea con la consistencia de la serie de términos de la ley en el Salmo 119.
  - Se evita «Cristo»/«Señor» porque no aparecen en el versículo.
  - «Guardar» se usa en sentido de obedecer/observar, no de solo preservar.
