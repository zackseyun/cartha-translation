  text: Grande paz tienen los que aman tu ley; nada los hará tropezar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלוֹם רָב
  english_pob_choice: Great peace
  chosen_spanish: Grande paz
  alternatives_spanish:
  - Mucha paz
  - Paz abundante
  lexicon: HALOT
  rationale: שָׁלוֹם expresa plenitud de bienestar, y רָב intensifica la idea de abundancia. 'Grande paz' conserva la fuerza superlativa sin volverla parafrástica; 'paz abundante' es posible, pero 'grande' mantiene mejor la concisión poética del hebreo y la fluidez en español.
- source_word: אֹהֲבֵי
  english_pob_choice: those who love
  chosen_spanish: los que aman
  alternatives_spanish:
  - los amantes de
  - quienes aman
  lexicon: HALOT
  rationale: El participio plural de אוהב se expresa naturalmente en español con una relativa sustantivada. 'Los que aman' evita un giro demasiado abstracto y reproduce bien la cualidad durativa del hebreo.
- source_word: תוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La POB inglesa escogió 'law' para תּוֹרָה por coherencia en el salmo y por su valor establecido en el conjunto de las expresiones de la palabra de Dios. En español, 'ley' es el equivalente más directo y reconocido; 'instrucción' y 'enseñanza' conservan matices válidos, pero se apartan de la decisión auditada.
- source_word: מִכְשׁוֹל
  english_pob_choice: stumble
  chosen_spanish: tropezar
  alternatives_spanish:
  - hacerlos caer
  - ser tropiezo para ellos
  lexicon: HALOT
  rationale: מִכְשׁוֹל designa obstáculo o tropiezo. La POB inglesa lo verbaliza como 'stumble'; en español 'tropezar' conserva la imagen concreta sin añadir una causa externa explícita. 'Hacerlos caer' intensifica demasiado; 'ser tropiezo para ellos' cambia la estructura semántica.
theological_decisions:
- issue: La relación entre 'ley' y la vida de paz del justo
  english_pob_reading: Great peace have those who love your law
  chosen_spanish_reading: Grande paz tienen los que aman tu ley
  alternative_spanish_readings:
  - Grande paz tienen los que aman tu instrucción
  - Paz abundante tienen los que aman tu enseñanza
  rationale: Se mantiene la conexión tradicional del salmo entre amar la torá divina y experimentar shalom. 'Ley' no debe oírse aquí en sentido meramente legalista, sino como designación del don revelado de Dios, en continuidad con la decisión auditada de la POB.
  doctrine_reference: Salmo 119; sabiduría de la obediencia a la revelación divina
- issue: El alcance de 'nada puede hacerlos tropezar'
  english_pob_reading: nothing can make them stumble
  chosen_spanish_reading: nada los hará tropezar
  alternative_spanish_readings:
  - nada puede hacerlos tropezar
  - ningún obstáculo los hará caer
  rationale: El hebreo usa una afirmación absoluta de ausencia de tropiezo; la forma española elegida preserva la contundencia sin introducir un sujeto agente añadido. 'Nada puede hacerlos tropezar' es igualmente válido, pero 'los hará tropezar' suena más natural y mantiene la negación total.
  doctrine_reference: Providencia y firmeza del justo en la vía de la obediencia
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca la decisión auditada de la POB en inglés, respetando el paralelismo poético y la fuerza absoluta del cierre.
  spanish_consistency_notes:
  - Se conservó 'ley' para תּוֹרָה por consistencia con la decisión auditada en inglés y por su lectura estable en el Salmo 119.
  - '''Grande paz'' mantiene el paralelismo breve del hebreo y evita una ampliación interpretativa innecesaria.'
  - '''Tropezar'' reproduce la imagen de מִכְשׁוֹל con naturalidad en español bíblico contemporáneo.'
