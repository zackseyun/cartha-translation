translation:
  language: es
  text: He jurado y lo he confirmado, para guardar tus ordenanzas justas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁבַּעְתִּי
  english_pob_choice: I have sworn an oath
  chosen_spanish: He jurado
  alternatives_spanish:
  - He hecho juramento
  - He jurado un juramento
  lexicon: HALOT
  rationale: El perfecto hebreo expresa una acción ya asumida; en español, «He jurado» comunica con naturalidad el acto vinculante sin redundancia. «Hacer juramento» sería posible, pero menos directo.
- source_word: וָאֲקַיֵּמָה
  english_pob_choice: and confirmed it
  chosen_spanish: y lo he confirmado
  alternatives_spanish:
  - y lo he ratificado
  - y lo he cumplido
  lexicon: HALOT
  rationale: El verbo denota poner en firme o llevar a efecto el compromiso jurado. «Confirmarlo» conserva esa idea de ratificación del voto; «cumplirlo» es viable, pero puede sonar más general que el matiz de afianzar la promesa.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_spanish: ordenanzas
  alternatives_spanish:
  - juicios
  - reglas
  - decretos justos
  lexicon: HALOT
  rationale: La POB inglesa eligió «ordinances» para מִשְׁפָּט en su sentido de disposiciones normativas divinas. «Ordenanzas» mantiene ese valor jurídico-normativo en español y evita el matiz punitivo de «juicios».
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_spanish: justas
  alternatives_spanish:
  - rectas
  - de justicia
  lexicon: HALOT
  rationale: El sustantivo con sufijo posesivo califica las ordenanzas como pertenecientes a la justicia de Dios. «Justas» funciona de modo natural en español y preserva el rasgo ético-jurídico; «rectas» sería una alternativa válida pero menos explícita respecto a justicia.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de origen; la redacción española sigue directamente el texto hebreo con apoyo en la decisión léxica ya auditada por la POB inglesa para מִשְׁפְּטֵי = 'ordinances'.
  spanish_consistency_notes:
  - 'Se mantiene el paralelismo verbal del hebreo con dos perfectos en primera persona: «He jurado» / «lo he confirmado».'
  - 'Se conservó un término jurídico-normativo coherente con la terminología bíblica del proyecto: «ordenanzas».'
  - No se usó puntuación fuerte interna que altere la unidad poética del versículo.
