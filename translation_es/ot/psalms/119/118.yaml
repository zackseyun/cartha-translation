translation:
  language: es
  text: Tú rechazas a todos los que se desvían de tus estatutos, porque su astucia es en vano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סָלִיתָ
  english_pob_choice: You reject
  chosen_spanish: Tú rechazas
  alternatives_spanish:
  - Tú apartas
  - Tú desechas
  - Tú aborreces
  lexicon: HALOT
  rationale: El verbo hebreo expresa rechazo/repudio. «Rechazas» mantiene bien la fuerza del POB inglés sin agregar una carga más emocional de la que exige el hebreo.
- source_word: כָּל שׁוֹגִים
  english_pob_choice: all who stray
  chosen_spanish: a todos los que se desvían
  alternatives_spanish:
  - a todos los que se extravían
  - a todos los que andan errados
  - a todos los que se apartan
  lexicon: HALOT
  rationale: שׁוֹגִים describe a quienes se desvían o se extravían. «Se desvían» conserva el movimiento moral respecto de la norma sin endurecer el sentido a una sola formulación idiomática.
- source_word: מֵחֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: de tus estatutos
  alternatives_spanish:
  - de tus decretos
  - de tus prescripciones
  lexicon: HALOT
  rationale: Se conserva «estatutos» como decisión léxica ya auditada en el POB inglés para חֹק/חֻקִּים. Es transparente, estable y fiel al matiz de norma establecida.
- source_word: תַּרְמִיתָם
  english_pob_choice: their cunning
  chosen_spanish: su astucia
  alternatives_spanish:
  - su engaño
  - su fraude
  - su artificio
  lexicon: HALOT
  rationale: תַּרְמִיתָם apunta a engaño, fraude o astucia engañosa. «Astucia» mantiene la idea de habilidad engañosa y funciona bien con el juicio final del verso.
- source_word: שֶׁקֶר
  english_pob_choice: in vain
  chosen_spanish: en vano
  alternatives_spanish:
  - es mentira
  - es falso
  - sin efecto
  lexicon: HALOT
  rationale: 'El hebreo literalmente es «mentira/falsedad», pero en esta cláusula funciona como evaluación del resultado: lo engañoso resulta sin provecho, vano. «En vano» sigue la lectura POB y evita una construcción española demasiado rígida o una paráfrasis excesiva.'
theological_decisions:
- issue: Relación entre el rechazo divino y la ley divina
  english_pob_reading: You reject all who stray from your statutes
  chosen_spanish_reading: Tú rechazas a todos los que se desvían de tus estatutos
  alternative_spanish_readings:
  - Tú apartas a todos los que se desvían de tus estatutos
  - Tú desechas a todos los que se apartan de tus estatutos
  rationale: 'Se mantiene la tensión del verso: la desviación de los estatutos de Yahvé trae rechazo divino. No se suaviza el juicio ni se sustituye por una mera consecuencia impersonal.'
  doctrine_reference: Salmo 119:1-8; Deuteronomio 28:15
- issue: 'Sentido de la segunda cola: la conducta engañosa no prospera'
  english_pob_reading: for their cunning is in vain
  chosen_spanish_reading: porque su astucia es en vano
  alternative_spanish_readings:
  - porque su engaño es en vano
  - porque su artificio no tiene efecto
  - pues su astucia resulta falsa
  rationale: 'Se conserva el veredicto del hebreo/POB: la estrategia de quienes se apartan no alcanza el fin esperado. «En vano» expresa fracaso, no solo falsedad abstracta.'
  doctrine_reference: Salmo 2:1-4; Proverbios 21:30
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete de fuente. La redacción española sigue la lectura base del WLC y la decisión léxica auditada del POB inglés, sin introducir variantes textuales no atestiguadas.
  spanish_consistency_notes:
  - Se usa «estatutos» de manera consistente con la decisión inglesa auditada para חֻקֶּיךָ.
  - Se prefirió un español directo y publicable, sin calcos innecesarios ni términos eclesiásticos no motivados por la fuente.
  - «En vano» conserva el juicio de inutilidad/fracaso del final del verso, en armonía con la traducción inglesa recibida.
