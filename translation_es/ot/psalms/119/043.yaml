translation:
  language: es
  text: No quites de mi boca la palabra de verdad del todo, porque espero en tus ordenanzas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר אֱמֶת
  english_pob_choice: word of truth
  chosen_spanish: palabra de verdad
  alternatives_spanish:
  - palabra verdadera
  - palabra de la verdad
  - mensaje de verdad
  lexicon: HALOT
  rationale: Mantengo דָּבָר como 'palabra' para conservar la referencia al habla divina, y אֱמֶת como 'verdad' sin añadir matices ajenos. 'Palabra de verdad' reproduce bien la fuerza idiomática del hebreo y encaja con el uso bíblico de la expresión.
- source_word: מִפִּי
  english_pob_choice: out of my mouth
  chosen_spanish: de mi boca
  alternatives_spanish:
  - fuera de mi boca
  - de entre mis labios
  lexicon: HALOT
  rationale: La imagen idiomática hebrea se expresa naturalmente en español con 'de mi boca'. 'Fuera de mi boca' sería más literal pero menos natural; 'de entre mis labios' sería interpretativo.
- source_word: תַּצֵּל ... עַד מְאֹד
  english_pob_choice: take ... utterly out
  chosen_spanish: quites ... del todo
  alternatives_spanish:
  - saques ... completamente
  - arranques ... por completo
  - retiras ... totalmente
  lexicon: HALOT
  rationale: El hebreo intensifica la negación con עַד מְאֹד, por lo que 'del todo' comunica la fuerza total sin sonar mecánico. 'Quites' mantiene el verbo de remoción sin sobrecargar la metáfora.
- source_word: לְמִשְׁפָּטֶךָ
  english_pob_choice: ordinances
  chosen_spanish: ordenanzas
  alternatives_spanish:
  - justos decretos
  - juicios
  - estatutos
  lexicon: HALOT
  rationale: '''Ordenanzas'' conserva el valor jurídico-normativo que el POB inglés resuelve con ''ordinances'' y distingue מִשְׁפָּט de otros términos legales como חֻקִּים. ''Juicios'' en español puede sonar punitivo y ''estatutos'' puede desplazar el matiz de decisiones/requerimientos justos.'
theological_decisions:
- issue: Alcance de la negación intensificada
  english_pob_reading: Do not ... utterly
  chosen_spanish_reading: No ... del todo
  alternative_spanish_readings:
  - No ... completamente
  - No ... por entero
  rationale: El hebreo pide una negación enfática; 'del todo' reproduce esa intensificación de modo claro y idiomático en español sin introducir una paráfrasis excesiva.
  doctrine_reference: Salmo 119:43; fidelidad del creyente a la palabra revelada
- issue: Naturaleza de לְמִשְׁפָּטֶךָ
  english_pob_reading: your ordinances
  chosen_spanish_reading: tus ordenanzas
  alternative_spanish_readings:
  - tus juicios
  - tus reglas
  rationale: Se preserva el valor de revelación normativa de מִשְׁפָּט, evitando un sentido meramente condenatorio de 'juicios'. 'Ordenanzas' refleja bien la autoridad justa de los decretos divinos.
  doctrine_reference: Salmo 119:43; ley/mandatos de Yahvé
translation_notes:
  revision_awareness: Se corrigió el problema de validación anterior eliminando cualquier nota al pie no anclada en el texto. La redacción final mantiene un solo período y conserva el énfasis del hebreo sin depender de marcas de nota.
  spanish_consistency_notes:
  - Se usó 'Yahvé' solo cuando aparezca el nombre divino explícito; en este versículo no aparece.
  - Se mantuvo 'ordenanzas' para מִשְׁפָּט, coherente con la decisión inglesa auditada.
  - Se evitó 'SEÑOR' como sustituto del nombre divino porque no corresponde al hebreo de este versículo.
