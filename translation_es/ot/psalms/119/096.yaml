lexical_decisions:
- source_word: לְכָל תִּכְלָה
  english_pob_choice: all perfection
  chosen_spanish: todo tiene límite
  alternatives_spanish:
  - toda perfección
  - todo lo consumado
  - toda consumación
  lexicon: BDB / HALOT
  rationale: תִּכְלָה expresa terminación, consumación o perfección en el sentido de algo llegado a su fin. En español, 'todo tiene límite' conserva la idea de totalidad con un final o frontera, sin forzar 'perfección' como si fuera solo excelencia moral o estética.
- source_word: רָאִיתִי קֵץ
  english_pob_choice: I have seen a limit
  chosen_spanish: he visto que ... tiene límite
  alternatives_spanish:
  - he visto un fin
  - he visto un término
  - he visto un límite
  lexicon: BDB / HALOT
  rationale: קֵץ significa fin, término o límite. 'He visto que ... tiene límite' comunica el valor verbal de 'have seen a limit' y mantiene una construcción natural en español.
- source_word: מִצְוָתְךָ
  english_pob_choice: your commandment
  chosen_spanish: tu mandamiento
  alternatives_spanish:
  - tu mandamiento
  - tu mandato
  - tus mandamientos
  lexicon: HALOT
  rationale: מִצְוָה se refiere a un mandamiento autoritativo de Dios. 'Mandamiento' es la forma más natural y fiel en español para un singular colectivo como aquí.
- source_word: רְחָבָה מְאֹד
  english_pob_choice: exceedingly broad
  chosen_spanish: muy amplio
  alternatives_spanish:
  - sumamente amplio
  - extremadamente amplio
  - ancho en gran manera
  lexicon: BDB / HALOT
  rationale: רְחָבָה describe amplitud o extensión. 'Muy amplio' conserva el sentido espacial/metafórico de vastedad y es idiomático; 'exceedingly' se expresa con 'muy' en una construcción sobria y natural.
theological_decisions:
- issue: Contraste entre lo limitado de todo lo humano y la amplitud del mandamiento divino
  english_pob_reading: I have seen a limit to all perfection, but your commandment is exceedingly broad.
  chosen_spanish_reading: He visto que todo tiene límite, pero tu mandamiento es muy amplio.
  alternative_spanish_readings:
  - He visto que toda perfección tiene límite, pero tu mandamiento es sumamente amplio.
  - He visto un límite para toda perfección, pero tu mandamiento es muy amplio.
  rationale: El versículo establece una comparación teológica entre la finitud de toda consumación humana y la amplitud sin límites del mandamiento de Yahvé. La formulación elegida preserva el contraste sin introducir una interpretación más elaborada que el hebreo.
  doctrine_reference: Psalm 119:96; sabiduría bíblica sobre la finitud humana y la plenitud de la instrucción divina
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; la propuesta sigue de cerca el hebreo y la lectura auditada en inglés, ajustando solo la idiomaticidad del español.
  spanish_consistency_notes:
  - '''Mandamiento'' se mantiene como término técnico para מִצְוָה en esta línea, en coherencia con el uso del salmo.'
  - Se evitó 'SEÑOR' porque el hebreo usa un sustantivo abstracto en segunda persona ('tu'); no hay sustitución del nombre divino en este versículo.
  - '''Muy amplio'' conserva la metáfora espacial y la hace natural en español, sin debilitar la fuerza de רְחָבָה.'
