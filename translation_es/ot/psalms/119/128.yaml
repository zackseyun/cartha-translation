lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_spanish: Por eso
  alternatives_spanish:
  - Por tanto
  - Así que
  lexicon: según el valor inferencial de עַל כֵּן en contexto poético
  rationale: Expresa la consecuencia lógica del verso anterior sin sonar excesivamente formal. Mantiene el enlace inferencial que el inglés POB marcó con 'Therefore'.
- source_word: פִּקּוּדֵי
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - encargos
  lexicon: HALOT
  rationale: Sigue la decisión del POB en inglés para distinguir este término de otros vocablos legales de la Torá. 'Preceptos' comunica bien la idea de disposiciones específicas confiadas por Dios.
- source_word: יִשָּׁרְתִּי
  english_pob_choice: I hold ... to be right
  chosen_spanish: considero rectos
  alternatives_spanish:
  - tengo por rectos
  - juzgo rectos
  - declaro rectos
  lexicon: lexical sense of יָשָׁר
  rationale: El verbo y la forma verbal expresan la valoración de rectitud; en español, 'considero rectos' evita una calca poco natural y conserva el juicio personal del salmista.
- source_word: כָּל
  english_pob_choice: all / everything
  chosen_spanish: todos ... en todo
  alternatives_spanish:
  - todos ... en cada cosa
  - cada uno ... en todo
  lexicon: distributive force of כָּל
  rationale: 'Reproduce la doble generalidad del hebreo: ''todos'' para los preceptos y ''en todo'' para el alcance de su rectitud. La repetición mantiene el énfasis universal del verso.'
- source_word: אֹרַח שֶׁקֶר
  english_pob_choice: false way
  chosen_spanish: camino de falsedad
  alternatives_spanish:
  - sendero de mentira
  - ruta falsa
  lexicon: HALOT
  rationale: '''Camino'' preserva la metáfora del sendero de conducta; ''falsedad'' refleja שֶׁקֶר de manera amplia y sobria. Se evita ''mentira'' porque en español puede sonar más estrechamente verbal que ética.'
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_spanish: aborrezco
  alternatives_spanish:
  - odio
  - detesto
  lexicon: common biblical Spanish usage; semantic range of שָׂנֵא
  rationale: '''Aborrezco'' mantiene la fuerza afectiva y moral de שָׂנֵא sin la dureza moderna de ''odio'', y suena más adecuado en registro bíblico contemporáneo.'
translation_notes:
  revision_awareness: No se registran revisiones posteriores en el paquete; el draft sigue directamente el texto hebreo WLC y la solución léxica auditada del POB en inglés.
  spanish_consistency_notes:
  - Se conservó el paralelismo sintáctico del hebreo con dos miembros breves separados por punto y coma.
  - Se evitó 'SEÑOR' porque el verso no contiene el nombre divino ni un pronombre que requiera esa convención.
  - '''Preceptos'' se mantiene consistente con la decisión inglesa auditada para פִּקּוּדִים.'
