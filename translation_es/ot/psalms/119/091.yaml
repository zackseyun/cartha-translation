translation:
  language: es
  text: Por tus ordenanzas se mantienen en pie hoy, pues todas las cosas son siervas tuyas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: ordenanzas
  alternatives_spanish:
  - juicios
  - decretos justos
  - reglas
  lexicon: HALOT
  rationale: מִשְׁפָּט puede referirse a decisiones legales o a disposiciones normativas de Dios. «Ordenanzas» conserva el sentido de mandatos establecidos y sigue la elección auditada en inglés, sin imponer el matiz punitivo de «juicios».
- source_word: עָמְדוּ
  english_pob_choice: they stand
  chosen_spanish: permanecen
  alternatives_spanish:
  - se mantienen
  - están en pie
  - subsisten
  lexicon: BDB / uso contextual
  rationale: El verbo expresa firmeza o permanencia continua. En español, «permanecen» comunica mejor esa estabilidad que una imagen demasiado literal de estar físicamente de pie.
- source_word: הַיּוֹם
  english_pob_choice: this day
  chosen_spanish: hasta hoy
  alternatives_spanish:
  - este día
  - en este día
  lexicon: uso contextual
  rationale: La secuencia hebrea apunta al tiempo presente vigente; «hasta hoy» suena natural en español y mantiene la referencia temporal actual sin forzar una cronología artificial.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_spanish: tus siervos
  alternatives_spanish:
  - tus servidores
  - tus sujetos
  lexicon: HALOT
  rationale: El término designa dependencia y servicio bajo autoridad. «Siervos» preserva esa relación mejor que «servidores», y sigue el término POB para δοῦλος cuando corresponde.
theological_decisions:
- issue: La relación entre las criaturas y el gobierno de Yahvé en la última línea
  english_pob_reading: all things are your servants
  chosen_spanish_reading: todas las cosas son tus siervos
  alternative_spanish_readings:
  - todo es tu siervo
  - todas las criaturas te sirven
  rationale: 'El hebreo usa un colectivo amplio: «el todo / todo lo existente». Mantener «todas las cosas» conserva el alcance total, y «son tus siervos» refleja la imagen de subordinación universal sin explicitar más de lo que dice el texto.'
  doctrine_reference: Providencia y soberanía de Yahvé sobre toda la creación
translation_notes:
  revision_awareness: Se tuvo en cuenta la auditoría inglesa que eligió «ordinances» para מִשְׁפָּטִים, evitando el tono punitivo de «judgments». No hubo revisiones textuales registradas ni variantes que exijan nota aparte.
  spanish_consistency_notes:
  - Se mantuvo «ordenanzas» para מִשְׁפָּטֶיךָ conforme al patrón POB auditado.
  - Se usó «siervos» y no «esclavos» para עֲבָדֶיךָ, siguiendo la terminología estándar del proyecto.
  - La cláusula temporal se hizo natural en español con «hasta hoy», sin alterar el sentido de actualidad del hebreo.
