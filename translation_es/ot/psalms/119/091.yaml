revisions:
- from: Por tus ordenanzas permanecen hasta hoy, pues todas las cosas son tus siervos.
  to: Por tus ordenanzas se mantienen en pie hoy, pues todas las cosas son siervas tuyas.
  rationale: Se reemplaza «hasta hoy» por «hoy» para reproducir el valor temporal de הַיּוֹם, y se ajusta la concordancia de «siervas» con «todas las cosas». «Se mantienen en pie» conserva de forma clara la imagen de firmeza de עָמְדוּ.
  reviewer_model: gpt-5.6-terra
