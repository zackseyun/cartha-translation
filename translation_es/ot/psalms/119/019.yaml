  source_alignment_summary: 'El borrador refleja fielmente el hebreo: גֵּר אָנֹכִי se expresa adecuadamente como «Soy forastero», בָאָרֶץ como «en la tierra», y la súplica אַל תַּסְתֵּר מִמֶּנִּי מִצְוֺתֶיךָ conserva tanto la negación exhortativa como «tus mandamientos».'
