translation:
  language: es
  text: Soy forastero[a] en la tierra; no me ocultes tus mandamientos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'forastero: literalmente, alguien que vive como residente no permanente en una tierra ajena; aquí conserva la idea de condición de extrañeza o falta de arraigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר / sojourner
  english_pob_choice: sojourner
  chosen_spanish: forastero
  alternatives_spanish:
  - peregrino
  - extranjero
  - huésped
  lexicon: HALOT
  rationale: גֵּר designa a alguien que vive en tierra ajena sin pertenencia estable. 'Forastero' comunica bien esa condición en español sin introducir de forma principal la imagen devocional de 'peregrino' ni el matiz legal más fuerte de 'extranjero'.
- source_word: בָאָרֶץ
  english_pob_choice: on the earth
  chosen_spanish: en la tierra
  alternatives_spanish:
  - sobre la tierra
  - en el mundo
  lexicon: WLC / contexto poético
  rationale: La frase expresa ubicación general de vida en el ámbito terrenal. 'En la tierra' es la manera más natural y fiel en español, y mantiene el contraste implícito entre la condición del hablante y el ámbito donde habita.
- source_word: אַל תַּסְתֵּר
  english_pob_choice: do not hide
  chosen_spanish: no ocultes
  alternatives_spanish:
  - no escondas
  - no encubras
  lexicon: HALOT
  rationale: El verbo hebreo pide no retirar de la vista o del acceso. 'No ocultes' reproduce bien el sentido directo en español y conserva el tono de súplica.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus órdenes
  - tus preceptos
  lexicon: HALOT
  rationale: La opción inglesa 'commandments' se mantiene como 'mandamientos', que en español es el equivalente más claro y reverente para מִצְוָה / מִצְוֺת en este contexto salmódico. 'Preceptos' es posible, pero menos directo; 'órdenes' suena más abrupto.
translation_notes:
  revision_awareness: No se registran revisiones textuales en el paquete fuente; la línea sigue el hebreo masorético tal como está reflejado en la traducción inglesa auditada.
  spanish_consistency_notes:
  - Se mantiene el registro sobrio y bíblico del texto sin recurrir a formulaciones litúrgicas innecesarias.
  - '''Mandamientos'' conserva la terminología del salmo y la consistencia con la decisión inglesa auditada.'
  - La nota al pie se usa solo para aclarar el matiz semántico de גֵּר sin desplazar el término principal del texto.
