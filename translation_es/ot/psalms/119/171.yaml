  text: Mis labios derramarán alabanza, porque tú me enseñas tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּבַּ֣עְנָה שְׂפָתַ֣י
  english_pob_choice: My lips will pour out
  chosen_spanish: Mis labios derramarán
  alternatives_spanish:
  - Mis labios rebosarán
  - Mis labios verterán
  lexicon: BDB/HALOT
  rationale: El verbo hebreo expresa una salida abundante, no solo hablar; por eso 'derramarán' conserva la imagen de fluidez y desborde mejor que una paráfrasis neutra. 'Mis labios' mantiene el sujeto corporal concreto del hebreo y del inglés POB.
- source_word: תְּהִלָּה
  english_pob_choice: praise
  chosen_spanish: alabanza
  alternatives_spanish:
  - elogio
  - loor
  lexicon: HALOT
  rationale: '''Alabanza'' es el equivalente natural y reverente en español para תְּהִלָּה en este contexto de adoración. ''Loor'' sería más arcaico; ''elogio'' suena menos litúrgico.'
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: Se conserva 'estatutos' para reflejar la decisión auditada de la POB inglesa y el valor de חֹק como norma prescrita. 'Decretos' y 'prescripciones' son alternativas válidas, pero 'estatutos' mantiene continuidad terminológica.
theological_decisions:
- issue: Segunda persona divina en el paralelismo final
  english_pob_reading: for you teach me your statutes
  chosen_spanish_reading: porque tú me enseñas tus estatutos
  alternative_spanish_readings:
  - pues tú me enseñas tus estatutos
  - porque me enseñas tus estatutos
  rationale: Se conserva el 'tú' explícito para mantener la relación personal del salmo y evitar ambigüedad en español. El posesivo 'tus' refleja de forma directa la pertenencia covenantal del mandato a Dios.
  doctrine_reference: Salmo 119:171; enseñanza divina en la Torá
translation_notes:
  revision_awareness: No constan revisiones aplicadas en el paquete fuente; se sigue la lectura del texto hebreo masorético y la opción inglesa POB ya auditada.
