translation:
  language: es
  text: Llegue mi súplica[a] delante de ti; líbrame conforme a tu promesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Súplica traduce el hebreo תְּחִנָּה, una petición humilde y urgente dirigida a Dios.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנָּתִי
  english_pob_choice: my plea
  chosen_spanish: mi súplica
  alternatives_spanish:
  - mi ruego
  - mi petición
  lexicon: HALOT; BDB
  rationale: תְּחִנָּה expresa una súplica o petición humilde; 'súplica' comunica bien ese matiz en español y conserva el tono orante del verso mejor que una simple 'petición'.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_spanish: delante de ti
  alternatives_spanish:
  - ante ti
  - en tu presencia
  lexicon: HALOT
  rationale: '''Delante de ti'' mantiene la imagen espacial de comparecer ante Dios con una súplica, sin volverla demasiado abstracta. ''Ante ti'' sería igualmente viable; aquí se elige una forma más natural y solemne en español.'
- source_word: כְּאִמְרָתְךָ
  english_pob_choice: according to your promise
  chosen_spanish: conforme a tu promesa
  alternatives_spanish:
  - según tu promesa
  - conforme a tu palabra
  - según tu dicho
  lexicon: HALOT
  rationale: La tradición auditada del POB entiende אִמְרָה aquí como la palabra comprometida de Dios; en español, 'promesa' comunica ese compromiso divino mejor que 'palabra' o 'dicho', y 'conforme a' refleja bien el valor normativo del hebreo כְּ.
- source_word: הַצִּילֵנִי
  english_pob_choice: deliver me
  chosen_spanish: líbrame
  alternatives_spanish:
  - sálvame
  - rescátame
  lexicon: HALOT; BDB
  rationale: הציל pide librar o rescatar de un peligro. 'Líbrame' es un imperativo español claro y reverente, y corresponde al matiz de ser sacado de una situación amenazante.
translation_notes:
  revision_awareness: No se registran revisiones previas en el paquete fuente ni cambios textuales respecto del hebreo WLC. La lectura inglesa auditada 'my plea... according to your promise' fue usada solo como contexto para confirmar que אִמְרָה se entiende aquí como una palabra/promesa comprometida de Dios, no como 'palabra' en sentido genérico.
  spanish_consistency_notes:
  - Se mantuvo 'Yahvé' fuera del texto porque el versículo usa un pronombre de segunda persona y no el tetragrama.
  - '''Promesa'' se eligió para אִמְרָה en armonía con el audit trail inglés del POB y con el uso del salmo, donde la palabra divina aparece como compromiso fiable.'
  - Se evitó 'esclavo' u otros términos no pertinentes; el verso es una súplica litúrgica breve y la dicción española se mantuvo sobria y publicable.
