lexical_decisions:
- source_word: קִדַּמְתִּי
  english_pob_choice: I rise before dawn
  chosen_spanish: Me adelanto a la aurora
  alternatives_spanish:
  - Me levanto antes del alba
  - Salgo al encuentro de la aurora
  lexicon: BDB/HALOT
  rationale: El verbo expresa ir delante o adelantarse temporalmente. En español, 'me adelanto a la aurora' conserva la idea de anticipación sin volverla demasiado mecánica; 'me levanto antes del alba' explica la acción con naturalidad, pero pierde el matiz de ir delante del momento mismo.
- source_word: בַּנֶּשֶׁף
  english_pob_choice: before dawn
  chosen_spanish: la aurora
  alternatives_spanish:
  - el alba
  - la madrugada
  lexicon: BDB/HALOT
  rationale: El sustantivo puede referirse al crepúsculo o a la oscuridad/penumbra previa al amanecer según contexto; aquí, por el paralelo con 'before dawn', 'la aurora' comunica de forma clara el tiempo previo al amanecer y mantiene la referencia temporal del hebreo.
- source_word: וָאֲשַׁוֵּעָה
  english_pob_choice: cry for help
  chosen_spanish: clamo por ayuda
  alternatives_spanish:
  - grito pidiendo socorro
  - suplíco con clamor
  lexicon: BDB/HALOT
  rationale: El verbo denota un clamor o pedido urgente. 'Clamo por ayuda' preserva la intensidad y la función de súplica, evitando una paráfrasis más larga que diluiría el paralelismo poético.
- source_word: לְדְבָרֶיךָ
  english_pob_choice: your words
  chosen_spanish: tus palabras
  alternatives_spanish:
  - tu palabra
  - tus dichos
  lexicon: HALOT
  rationale: El plural posesivo en hebreo favorece 'tus palabras'. Aunque el audit trail inglés usó 'words' y el lema דָּבָר puede abarcar 'word', 'matter' o 'thing', aquí el plural español refleja mejor la forma del texto y mantiene el vínculo con la palabra divina como expresión fiable.
- source_word: יִחָלְתִּי
  english_pob_choice: I hope
  chosen_spanish: espero
  alternatives_spanish:
  - aguardo
  - he esperado
  lexicon: BDB/HALOT
  rationale: El verbo expresa esperar con confianza. 'Espero' es natural en español y puede abarcar la confianza implícita del hebreo; 'aguardo' suena más formal y menos idiomático en este contexto poético.
theological_decisions:
- issue: Si 'word' debe singularizarse o mantenerse en plural
  english_pob_reading: I hope in your words
  chosen_spanish_reading: espero en tus palabras
  alternative_spanish_readings:
  - espero en tu palabra
  - confío en tus palabras
  rationale: El hebreo usa un plural ('tus palabras'). Mantener el plural evita borrar la forma del texto y la amplitud poética de la referencia a la comunicación divina. 'Tu palabra' sería una normalización posible, pero menos estricta respecto al hebreo.
  doctrine_reference: Inspiración y autoridad de la palabra divina en su expresión concreta; fidelidad formal al número del texto fuente.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés; la propuesta sigue directamente el hebreo y la decisión léxica inglesa de mantener 'words' para דבריך.
  spanish_consistency_notes:
  - 'Se conserva el paralelismo de dos miembros: anticipación + clamor, luego confianza esperada.'
  - Se mantiene el plural 'palabras' para reflejar el hebreo y la auditoría inglesa.
  - El registro es reverente y sobrio, sin introducir vocabulario eclesiástico ajeno al texto.
