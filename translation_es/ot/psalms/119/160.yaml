translation:
  language: es
  text: La suma de tu palabra es verdad, y cada uno de tus justos decretos permanece para siempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאשׁ / דְּבָרְךָ
  english_pob_choice: The sum of your word
  chosen_spanish: La suma de tu palabra
  alternatives_spanish:
  - El principio de tu palabra
  - La totalidad de tu palabra
  - La esencia de tu palabra
  lexicon: HALOT
  rationale: רֹאשׁ aquí expresa la idea de cabeza, suma o totalidad; en español, 'la suma' comunica bien el sentido de totalidad resumida sin forzar una paráfrasis. דְּבָרְךָ se mantiene como 'tu palabra' para conservar el término divino de habla revelada, coherente con el audit trail inglés.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_spanish: verdad
  alternatives_spanish:
  - fidelidad
  - veracidad
  lexicon: HALOT
  rationale: אֱמֶת puede abarcar verdad y fidelidad; 'verdad' es la opción más directa y transparente en español, manteniendo la afirmación del verso sin introducir una expansión interpretativa.
- source_word: מִשְׁפַּט
  english_pob_choice: ordinances
  chosen_spanish: decretos
  alternatives_spanish:
  - ordenanzas
  - juicios
  - reglas
  lexicon: HALOT
  rationale: Se eligió 'decretos' para reflejar el valor normativo de מִשְׁפָּט como disposición judicial o normativa de Dios. 'Ordenanzas' queda como alternativa cercana al inglés POB, pero 'decretos' fluye con naturalidad en español y mantiene el peso autoritativo del término.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_spanish: justos
  alternatives_spanish:
  - rectos
  - de justicia
  lexicon: HALOT
  rationale: צֶדֶק/צִדְקָה en contexto de mandatos divinos puede expresar justicia, rectitud o conformidad al derecho. 'Justos' permite caracterizar los decretos como conformes a la justicia de Yahvé sin añadir una perífrasis innecesaria.
theological_decisions:
- issue: Relación entre 'verdad' y el carácter normativo de la palabra divina
  english_pob_reading: The sum of your word is truth
  chosen_spanish_reading: La suma de tu palabra es verdad
  alternative_spanish_readings:
  - La totalidad de tu palabra es verdad
  - La esencia de tu palabra es verdad
  rationale: El hebreo afirma que la palabra divina, considerada en su conjunto, es verdadera. 'Suma' conserva la idea de totalidad resumida, evitando reducir el sentido a un simple 'principio' o a una abstracción filosófica que el texto no exige.
  doctrine_reference: Salmo 119:160; cf. Juan 17:17
- issue: Naturaleza de מִשְׁפָּט en la ley divina
  english_pob_reading: every one of your righteous ordinances
  chosen_spanish_reading: cada uno de tus justos decretos
  alternative_spanish_readings:
  - cada una de tus justas ordenanzas
  - cada uno de tus justos juicios
  rationale: Se preserva el matiz de disposiciones normativas de Yahvé, evitando el tono punitivo que 'juicios' puede tener en español. 'Decretos' comunica autoridad legal y permanencia, y 'justos' mantiene la cualidad ética del término.
  doctrine_reference: Salmo 19:9; Salmo 119:7, 137
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés; el español sigue de cerca el sentido hebreo confirmado por la traducción auditada en inglés, preservando la paralelía poética y la fuerza normativa de los términos clave.
  spanish_consistency_notes:
  - Se mantuvo 'tu' en singular para reflejar el sufijo pronominal hebreo de segunda persona masculina singular.
  - Se conservó la estructura paralela del verso con dos miembros equilibrados.
  - '''Verdad'' y ''justos'' se eligieron para sostener la relación entre la palabra divina verdadera y sus disposiciones rectas sin sobrecargar el verso con explicaciones.'
  - No se usó 'SEÑOR' ni otra máscara del nombre divino porque este versículo no contiene el Tetragrámaton explícito en la forma dada, aunque sí habla de la palabra y los decretos divinos.
