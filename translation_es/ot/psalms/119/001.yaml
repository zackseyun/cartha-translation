translation:
  language: es
  text: ¡Bienaventurados[a] los de camino íntegro, los que andan en la ley de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El Salmo 119 es un acróstico alfabético: sus 176 versículos forman 22 estrofas de ocho versículos, y dentro de cada estrofa cada línea comienza con la misma letra sucesiva del alfabeto hebreo. Los versículos 1–8 empiezan con ʾálef (א), la primera letra.'
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵ֥י
  english_pob_choice: Blessed
  chosen_spanish: Bienaventurados
  alternatives_spanish:
  - Dichosos
  - Felices
  lexicon: BDB/HALOT
  rationale: אַשְׁרֵי expresa una declaración de dicha/felicitación, no una mera emoción. 'Bienaventurados' conserva el tono bíblico y la fuerza declarativa sin reducirlo a un sentimiento subjetivo.
- source_word: תְמִֽימֵי דָ֑רֶךְ
  english_pob_choice: those whose way is blameless
  chosen_spanish: los de camino íntegro
  alternatives_spanish:
  - los de conducta intachable
  - los de camino irreprochable
  lexicon: HALOT
  rationale: El hebreo describe personas cuya 'vía' o 'camino' es completo/íntegro. 'Íntegro' mantiene la idea de integridad moral y de totalidad, y 'camino' preserva la metáfora de conducta de vida.
- source_word: הֹלְכִ֗ים
  english_pob_choice: walk
  chosen_spanish: andan
  alternatives_spanish:
  - caminan
  - andan conforme a
  lexicon: HALOT
  rationale: הלך en este contexto es un modo idiomático de vivir o comportarse. 'Andan' suena natural en español bíblico contemporáneo y conserva la imagen de vida en marcha.
- source_word: בְּתוֹרַ֥ת
  english_pob_choice: law
  chosen_spanish: en la ley
  alternatives_spanish:
  - en la instrucción
  - en la enseñanza
  lexicon: HALOT
  rationale: POB documenta 'law' como decisión establecida para תּוֹרָה, y en español 'ley' conserva esa equivalencia tradicional y la consistencia terminológica del salmo. Se evita 'instrucción' aquí para no debilitar la correspondencia con el audit trail en esta unidad.
- source_word: יְהוָֽה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: El nombre divino יְהוָה se vierte como 'Yahvé' según el estándar del proyecto. Se mantiene como nombre propio, no como título sustitutivo.
theological_decisions:
- issue: Tratamiento del nombre divino יהוה
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: Se conserva el carácter onomástico del tetragrámaton. 'Yahvé' es el equivalente español elegido para mostrar que el texto nombra a Dios directamente, no mediante un reemplazo litúrgico.
  doctrine_reference: DOCTRINE.md / divine name policy
- issue: Valor de אַשְׁרֵי como bienaventuranza
  english_pob_reading: Blessed
  chosen_spanish_reading: Bienaventurados
  alternative_spanish_readings:
  - Dichosos
  - Felices
  rationale: La fórmula introduce una declaración de estado favorable ante Dios; 'Bienaventurados' mantiene el registro sapiencial y evita una lectura meramente psicológica.
  doctrine_reference: Uso sapiencial de אַשְׁרֵי en el AT
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente inglés. La presente redacción sigue de cerca el texto hebreo y conserva las decisiones auditadas del inglés (bienaventuranza, camino íntegro, ley, Yahvé) adaptándolas a un español natural y publicable.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' para יהוה en coherencia con la política del proyecto.
  - Se conserva 'ley' para תּוֹרָה siguiendo el audit trail inglés, aunque 'instrucción' quede como alternativa semántica válida.
  - '''Bienaventurados'' se usa en plural masculino genérico, como fórmula inclusiva y proverbial del salmo.'
