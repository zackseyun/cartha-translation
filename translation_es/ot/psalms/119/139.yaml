translation:
  language: es
  text: Mi celo me consume, porque mis enemigos olvidan tus palabras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִמְּתַ֥תְנִי
  english_pob_choice: consumes me
  chosen_spanish: me consume
  alternatives_spanish:
  - me destruye
  - me aniquila
  - me devora
  lexicon: BDB/HALOT
  rationale: El hebreo expresa una acción intensa y causativa sobre el hablante; 'me consume' conserva la fuerza figurada de agotamiento/abrasamiento sin introducir un matiz más extremo de destrucción total que el contexto no exige.
- source_word: קִנְאָתִי
  english_pob_choice: My zeal
  chosen_spanish: Mi celo
  alternatives_spanish:
  - Mi ardor
  - Mi pasión
  - Mi indignación
  lexicon: BDB/HALOT
  rationale: '''Celo'' es el equivalente español más estable para קִנְאָה en este contexto de fervor por el honor de Yahvé y su palabra; evita reducirlo a simple emoción o enojo.'
- source_word: שָׁכְחוּ
  english_pob_choice: forget
  chosen_spanish: olvidan
  alternatives_spanish:
  - se olvidan de
  - han olvidado
  - desatienden
  lexicon: HALOT
  rationale: El verbo se traduce de forma directa por 'olvidan', manteniendo el valor de omisión de memoria/fidelidad que requiere el paralelo con 'tus palabras'.
- source_word: דְבָרֶיךָ
  english_pob_choice: your words
  chosen_spanish: tus palabras
  alternatives_spanish:
  - tu palabra
  - tus dichos
  - tus promesas
  lexicon: HALOT
  rationale: Se conserva el plural 'palabras' porque el hebreo usa דְבָרֶיךָ en plural; esto evita uniformar indebidamente el término a 'tu palabra' cuando el texto habla de las expresiones concretas de Yahvé.
- source_word: צָרָי
  english_pob_choice: my foes
  chosen_spanish: mis enemigos
  alternatives_spanish:
  - mis adversarios
  - los que me oprimen
  - mis contrarios
  lexicon: HALOT
  rationale: La forma plural con sufijo de 1cs designa opositores personales; 'enemigos' es claro y natural en español, y cubre el campo semántico de adversarios hostiles sin añadir violencia específica.
theological_decisions:
- issue: How to render the divine speech term in the line 'your words'
  english_pob_reading: your words
  chosen_spanish_reading: tus palabras
  alternative_spanish_readings:
  - tu palabra
  - tus dichos
  rationale: El contexto y la auditoría inglesa sostienen el plural; en español, 'tus palabras' preserva esa pluralidad y la referencia a las declaraciones concretas de Yahvé sin borrar la distinción con otros términos como 'promesa'.
  doctrine_reference: Sola Scriptura / doctrina de la revelación verbal
- issue: Whether to intensify the first colon as destruction rather than consumption
  english_pob_reading: My zeal consumes me
  chosen_spanish_reading: Mi celo me consume
  alternative_spanish_readings:
  - Mi celo me destruye
  - Mi celo me devora
  rationale: '''Consume'' mantiene la imagen poética de desgaste interior y el balance del paralelismo; ''destruye'' o ''devora'' sonarían más absolutos que el hebreo y menos naturales en español bíblico contemporáneo.'
  doctrine_reference: Antropología bíblica / poesía sapiencial y salmódica
translation_notes:
  revision_awareness: No applied revisions are listed in the audit trail, and the English POB rendering is already concise and aligned with the Hebrew. The Spanish draft therefore follows the audited sense closely without introducing additional interpretive expansion.
  spanish_consistency_notes:
  - Se mantiene 'celo' para קִנְאָה y 'palabras' para דְבָרֶיךָ, en coherencia con el tratamiento léxico de la colección.
  - Se usa 'enemigos' para צָרָי como término amplio y idiomático, sin sobreespecificar el tipo de hostilidad.
  - La puntuación reproduce una pausa principal entre las dos mitades del versículo, acorde con la estructura poética del hebreo.
