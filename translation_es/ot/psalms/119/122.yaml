translation:
  language: es
  text: Garantiza el bienestar de tu siervo; no permitas que los arrogantes me opriman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲרֹב
  english_pob_choice: guarantee
  chosen_spanish: Garantiza
  alternatives_spanish:
  - sé fiador de
  - respalda
  - hazte garante de
  lexicon: HALOT
  rationale: El verbo עָרַב expresa la idea de salir como fiador o dar garantía. «Garantiza» comunica bien esa función en español sin volver mecánica la imagen jurídica del hebreo.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: uso bíblico del hebreo עֶבֶד
  rationale: Se conserva el término relacional y reverente «siervo», preferido en el proyecto para δοῦλος/עֶבֶד cuando el contexto es de dependencia fiel ante Dios.
- source_word: לְטוֹב
  english_pob_choice: well-being
  chosen_spanish: el bienestar
  alternatives_spanish:
  - el bien
  - para bien
  - la prosperidad
  lexicon: BDB/HALOT טוב
  rationale: לְטוֹב apunta a lo que es bueno o benéfico para el salmista; «bienestar» mantiene el sentido amplio de beneficio sin restringirlo a prosperidad material.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_spanish: los arrogantes
  alternatives_spanish:
  - los soberbios
  - los insolentes
  - los presuntuosos
  lexicon: BDB/HALOT זֵד
  rationale: El sustantivo designa a quienes actúan con presunción y altivez; «arrogantes» es claro y natural en español, y conserva el matiz moral del hebreo.
- source_word: יַעַשְׁקֻנִי
  english_pob_choice: oppress me
  chosen_spanish: me opriman
  alternatives_spanish:
  - me exploten
  - me hagan violencia
  - me traten injustamente
  lexicon: HALOT עָשַׁק
  rationale: עָשַׁק implica oprimir, defraudar o explotar. «Opriman» es amplio y fiel, sin estrechar indebidamente el tipo de abuso.
translation_notes:
  revision_awareness: Se corrigió el problema de validación eliminando toda nota al pie no anclada. La redacción española mantiene la petición de garantía y la amenaza de opresión sin añadir explicaciones ajenas al versículo.
  spanish_consistency_notes:
  - Se usó «siervo» según la terminología POB para עֶבֶד.
  - Se evitó «SEÑOR» como sustituto del nombre divino porque este verso no contiene el Tetragrámaton; la referencia queda implícita por el vocativo del salmista.
  - Se mantuvo un tono de súplica poético y sobrio, acorde con el hebreo y con la equivalencia óptima del POB.
