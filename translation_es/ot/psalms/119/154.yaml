lexical_decisions:
- source_word: רִיבָה רִיבִי
  english_pob_choice: Plead my cause
  chosen_spanish: Defiende mi causa
  alternatives_spanish:
  - Aboga por mi causa
  - Litiga mi causa
  lexicon: HALOT / BDB
  rationale: ריב expresa disputar, sostener una causa o pleitear en un contexto judicial. En español, «defiende mi causa» comunica bien la imagen forense sin sonar artificial; «aboga por mi causa» y «litiga mi causa» son posibles, pero la primera es menos directa y la segunda más técnica.
- source_word: וּגְאָלֵנִי
  english_pob_choice: redeem me
  chosen_spanish: redímeme
  alternatives_spanish:
  - rescátame
  - reivindícame
  lexicon: HALOT / BDB
  rationale: גאל en los Salmos suele mantener el sentido de rescatar por derecho de redención. «Redímeme» conserva esa carga teológica y relacional mejor que «rescátame», que puede sonar más genérico. «Reivindícame» no expresa bien el rescate.
- source_word: לְאִמְרָתְךָ
  english_pob_choice: according to your promise
  chosen_spanish: conforme a tu promesa
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu dicho
  lexicon: HALOT
  rationale: אִמְרָה, en este salmo, designa la palabra comprometida de Dios, y el audit trail inglés la interpreta como «promise». En español, «promesa» comunica mejor esa idea que «palabra», que sería demasiado general y podría confundirse con דָּבָר. «Conforme a» preserva la dependencia normativa del ruego.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dámeles vida
  alternatives_spanish:
  - dame vida
  - revíveme
  lexicon: HALOT / BDB
  rationale: חיה aquí pide vivificación, no solo existencia biológica. Sin embargo, el hebreo lleva sufijo de objeto singular; por tanto, la forma correcta es «dame vida», no «dámeles vida». «Revíveme» añade una idea de restauración que no está explícita en el hebreo.
theological_decisions:
- issue: Valor de אִמְרָה como palabra comprometida de Dios
  english_pob_reading: according to your promise
  chosen_spanish_reading: conforme a tu promesa
  alternative_spanish_readings:
  - según tu palabra
  - conforme a tu palabra
  rationale: El inglés POB ya opta por «promise» para distinguir אִמְרָה de otros términos para «palabra». En español, «promesa» mantiene esa distinción y evita diluir la confianza pactada que el salmista invoca.
  doctrine_reference: Fidelidad de Dios a su palabra dada; no se requiere una doctrina específica más allá del compromiso divino expresado en el texto.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete de revisión más reciente; la redacción sigue directamente el texto hebreo y el criterio auditado del POB inglés.
  spanish_consistency_notes:
  - Se preserva el registro poético y forense del versículo.
  - Se mantiene «redímeme» para conservar el campo semántico de גאל.
  - Se evitó «SEÑOR» porque el verso contiene un sufijo de segunda persona y no una instancia del nombre divino.
  - La corrección morfológica exige «dame vida»; la forma enviada en el borrador se ajusta al hebreo singular.
  - El español final usa puntuación y ritmo compatibles con lectura litúrgica.
