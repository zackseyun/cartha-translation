  text: Si tu ley no hubiera sido mi delicia, entonces habría perecido en mi aflicción.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹרָתְךָ
  english_pob_choice: law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La POB en inglés conserva «law» por consistencia en el salmo, aunque reconoce «instruction/teaching» como alternativas. En español, «tu ley» mantiene esa consistencia y resulta natural y reconocible en un contexto bíblico, sin ocultar que תּוֹרָה puede abarcar instrucción revelada.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_spanish: mi delicia
  alternatives_spanish:
  - mi deleite
  - mi placer
  lexicon: HALOT
  rationale: El sustantivo expresa aquello en lo que el salmista encuentra deleite intenso. «Mi delicia» sigue de cerca la imagen del texto hebreo y conserva la fuerza afectiva mejor que una paráfrasis más explicativa.
- source_word: אָבַדְתִּי
  english_pob_choice: I would have perished
  chosen_spanish: habría perecido
  alternatives_spanish:
  - me habría perdido
  - habría desaparecido
  lexicon: HALOT
  rationale: El verbo indica ruina o destrucción, y la POB lo vierte como «would have perished». «Habría perecido» conserva bien ese sentido en español y evita suavizar la intensidad del verbo.
- source_word: בְעָנְיִי
  english_pob_choice: in my affliction
  chosen_spanish: en mi aflicción
  alternatives_spanish:
  - en mi angustia
  - en mi miseria
  lexicon: HALOT
  rationale: עָנִי/עָנְיָה puede expresar aflicción, miseria o humillación. «Aflicción» es un equivalente amplio y sobrio que encaja bien con el tono sapiencial-salmódico, sin estrechar demasiado el matiz.
theological_decisions:
- issue: מִשְׁמָר del vínculo entre la ley divina y la preservación del creyente
  english_pob_reading: If your law had not been my delight, I would have perished in my affliction.
  chosen_spanish_reading: Si tu ley no hubiera sido mi delicia, entonces habría perecido en mi aflicción.
  alternative_spanish_readings:
  - Si tu ley no hubiera sido mi deleite, entonces habría perecido en mi aflicción.
  - Si tu enseñanza no hubiera sido mi delicia, entonces habría perecido en mi aflicción.
  rationale: La cláusula presenta la ley de Yahvé no solo como norma, sino como sostén vital. «Mi delicia» conserva la idea de una adhesión gozosa que preserva al salmista en la aflicción, sin convertir el versículo en una explicación doctrinal ajena al texto.
  doctrine_reference: Salmo 119:92; cf. Salmo 119:24, 77, 143
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de fuente; la redacción española sigue directamente el texto hebreo y la decisión léxica inglesa auditada, sin incorporar variantes textuales ni ajustes editoriales adicionales.
  spanish_consistency_notes:
  - Se mantiene «tu ley» para תוֹרָתְךָ en coherencia con el tratamiento de תּוֹרָה en el salmo, siguiendo la decisión inglesa auditada.
  - Se conserva el paralelismo condicional-consecuente del hebreo con «Si... habría...», que refleja bien לוּלֵי ... אָז ...
  - «Aflicción» traduce el campo semántico de עָנְיִי sin añadir una concreción no atestiguada por el contexto.
