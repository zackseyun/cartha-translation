translation:
  language: es
  text: Rescátame de la opresión del hombre, para que guarde tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּדֵנִי
  english_pob_choice: Redeem me
  chosen_spanish: Rescátame
  alternatives_spanish:
  - Redímeme
  - Sácame librando
  lexicon: BDB 664; HALOT 1005
  rationale: El verbo pide liberación efectiva de una situación de aflicción. En español, "rescatar" comunica bien la acción de sacar a alguien de un poder opresivo sin forzar un matiz monetario que aquí no está explícito en el contexto inmediato.
- source_word: מֵעֹשֶׁק
  english_pob_choice: from the oppression
  chosen_spanish: de la opresión
  alternatives_spanish:
  - de la violencia
  - de la injusticia opresiva
  lexicon: BDB 799; HALOT 854
  rationale: עֹשֶׁק denota opresión, abuso o trato injusto. "Opresión" conserva el sustantivo abstracto y la fuerza social/moral del término.
- source_word: אָדָם
  english_pob_choice: man
  chosen_spanish: del hombre
  alternatives_spanish:
  - de la gente
  - de los hombres
  lexicon: BDB 9; HALOT 15
  rationale: Aquí אָדָם funciona de manera genérica y colectiva, no como un individuo específico. "El hombre" mantiene el genérico singular del hebreo y la oposición entre la ayuda divina y la presión humana.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - estatutos
  - órdenes
  lexicon: HALOT 959
  rationale: La elección "preceptos" preserva el término técnico que el POB inglés usa para פִּקּוּדִים, diferenciándolo de mandamientos o estatutos y manteniendo la distinción léxica del salterio.
theological_decisions:
- issue: Relación entre liberación y obediencia
  english_pob_reading: Redeem me from the oppression of man, that I may keep your precepts.
  chosen_spanish_reading: Rescátame de la opresión del hombre, para que guarde tus preceptos.
  alternative_spanish_readings:
  - Rescátame de la opresión del hombre, y guardaré tus preceptos.
  - Redímeme de la opresión del hombre, para que obedezca tus preceptos.
  rationale: El hebreo usa una petición de liberación seguida por un propósito volitivo/resultado. "Para que guarde" conserva la finalidad explícita sin convertirla en una promesa autónoma ni suavizar el vínculo entre ser librado y vivir en obediencia.
  doctrine_reference: Salmo 119:134; relación entre liberación divina y obediencia a la ley de Yahvé
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas ni variantes textuales en el paquete fuente; la redacción sigue el WLC y el rastro auditivo inglés sin añadir notas textuales.
  spanish_consistency_notes:
  - Se mantiene "Yahvé" como terminología estándar del proyecto cuando el versículo no contiene el Tetragrámaton explícito, por lo que no se introduce aquí.
  - '"Preceptos" se conserva como término técnico consistente con el uso del Salmo 119 en el proyecto.'
  - '"Hombre" se deja en singular genérico para reflejar אָדָם sin pluralizar innecesariamente.'
