translation:
  language: es
  text: Afirma mis pasos según tu promesa, y que ninguna iniquidad domine sobre mí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּעָמַי
  english_pob_choice: steps
  chosen_spanish: pasos
  alternatives_spanish:
  - pisadas
  - andanzas
  lexicon: HALOT
  rationale: El hebreo se refiere a las ‘pisadas/pasos’ del caminar del salmista. ‘Pasos’ conserva la imagen concreta y es natural en español; ‘pisadas’ es posible pero menos idiomático aquí.
- source_word: הָכֵן
  english_pob_choice: Keep ... steady
  chosen_spanish: Afirma
  alternatives_spanish:
  - Sostén
  - Haz firmes
  - Establece
  lexicon: HALOT
  rationale: El imperativo pide firmeza/estabilidad para el caminar. ‘Afirma’ transmite bien la idea de hacer firmes los pasos sin sonar excesivamente técnico.
- source_word: בְּאִמְרָתֶךָ
  english_pob_choice: according to your promise
  chosen_spanish: con tu promesa
  alternatives_spanish:
  - según tu promesa
  - por tu promesa
  - conforme a tu promesa
  lexicon: HALOT
  rationale: La audit trail inglesa ya documenta ‘promise’ como lectura preferida para אִמְרָה en este salmo. En español, ‘con tu promesa’ conserva la base instrumental/normativa y suena natural; ‘según tu promesa’ también sería válido.
- source_word: תַּשְׁלֶט
  english_pob_choice: gain dominion
  chosen_spanish: domine
  alternatives_spanish:
  - se enseñoree
  - tenga dominio
  - se imponga
  lexicon: BDB
  rationale: El verbo expresa ejercer dominio/soberanía. ‘Domine’ es breve, bíblico y comunica el sentido sin necesidad de un giro más pesado.
- source_word: כָל אָוֶן
  english_pob_choice: iniquity
  chosen_spanish: toda iniquidad
  alternatives_spanish:
  - todo mal
  - toda maldad
  - toda perversidad
  lexicon: HALOT
  rationale: אָוֶן suele abarcar maldad/iniquidad/vanidad, con fuerza moral negativa. ‘Iniquidad’ es el equivalente tradicional y preciso en registro bíblico.
theological_decisions:
- issue: Relación entre la petición y la autoridad de la promesa divina
  english_pob_reading: according to your promise
  chosen_spanish_reading: con tu promesa
  alternative_spanish_readings:
  - según tu promesa
  - por tu promesa
  - conforme a tu promesa
  rationale: La oración no solo pide estabilidad, sino que la ancla en la palabra comprometida de Dios. ‘Con tu promesa’ mantiene esa dependencia y evita sugerir una simple comparación externa.
  doctrine_reference: Salmo 119:133; fidelidad de Dios a su palabra
translation_notes:
  revision_awareness: Se siguió la lectura inglesa auditada de אִמְרָה como ‘promise’, evitando retroceder a ‘word/saying’ sin motivo textual adicional. No hubo revisiones previas aplicadas en el paquete fuente.
  spanish_consistency_notes:
  - Se mantuvo ‘promesa’ para אִמְרָה conforme a la decisión léxica ya documentada en inglés POB para este salmo.
  - Se evitó ‘SEÑOR’ y se tradujo directamente el contenido del verso sin máscara litúrgica, en línea con el proyecto.
  - ‘Iniquidad’ conserva el registro bíblico y la fuerza moral del hebreo אָוֶן.
  - 'El sujeto implícito de la segunda cláusula se mantuvo impersonal: ‘no dejes que domine en mí...’, reflejando bien el hebreo.'
