translation:
  language: es
  text: He[a] hecho justicia y rectitud; no me abandones a mis opresores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 121–128 empiezan con la letra ʿayin (ע), la decimosexta del alfabeto; continúa así el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: עָשִׂיתִי
  english_pob_choice: I have done
  chosen_spanish: He hecho
  alternatives_spanish:
  - He practicado
  - He obrado
  lexicon: עשה
  rationale: El hebreo expresa una acción realizada por el salmista; «he hecho» mantiene el perfecto y la afirmación de una conducta ya cumplida.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_spanish: justicia
  alternatives_spanish:
  - lo justo
  - rectitud judicial
  lexicon: מִשְׁפָּט
  rationale: 'Sigo la decisión auditada de la POB inglesa: aquí no funciona como término técnico de «ley/ordenanza», sino como una acción justa practicada por el hablante.'
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_spanish: rectitud
  alternatives_spanish:
  - justicia
  - justeza
  lexicon: צֶדֶק
  rationale: «Rectitud» distingue este término del primero sin perder el campo moral de conducta correcta ante Dios y los hombres.
- source_word: עֹשְׁקָי
  english_pob_choice: my oppressors
  chosen_spanish: mis opresores
  alternatives_spanish:
  - los que me oprimen
  - mis explotadores
  lexicon: עָשַׁק
  rationale: «Opresores» conserva el sentido personal e injusto del participio plural, y se ajusta al registro bíblico sin sobrecargarlo con matices modernos ajenos al texto.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de auditoría. La redacción española sigue directamente el hebreo masorético recibido, en línea con la traducción inglesa auditada, sin añadir o suprimir elementos de sentido.
  spanish_consistency_notes:
  - Mantengo «justicia» y «rectitud» como par de términos diferenciados, siguiendo la decisión auditada de la POB inglesa.
  - Uso «opresores» para לְעֹשְׁקַי y no un término más técnico o interpretativo, para conservar la violencia relacional del hebreo.
  - La nota al pie reproduce la observación acrostica de la edición inglesa y se ancla en el primer hemistiquio mediante [a].
