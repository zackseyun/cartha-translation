translation:
  language: es
  text: Tus estatutos han sido mis cantos en la casa de mi peregrinación.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְמִרוֹת
  english_pob_choice: songs
  chosen_spanish: cantos
  alternatives_spanish:
  - canciones
  - salmos
  lexicon: HALOT
  rationale: El hebreo puede expresar cantos o melodías; en español, «cantos» conserva el sentido poético y devocional sin sonar tan moderno ni tan técnico como «canciones». Mantiene bien la imagen de algo que acompaña la vida del salmista.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: 'Sigo la decisión auditada del POB en inglés: חֹק/חֻקִּים se refiere a disposiciones prescritas, y «estatutos» en español conserva ese matiz jurídico-normativo de forma natural y bíblica.'
- source_word: בְּבֵית מְגוּרָי
  english_pob_choice: in the house of my sojourning
  chosen_spanish: en la casa de mi peregrinación
  alternatives_spanish:
  - en la casa de mi morar como extranjero
  - en la casa de mi estancia
  - en la casa de mi destierro
  lexicon: HALOT
  rationale: «מְגוּרָי» denota residencia temporal o condición de forastero/sojourner. «Peregrinación» comunica bien esa vida transitoria en español bíblico sin reducirla a un simple viaje ni endurecerla con «destierro», que sería demasiado específico.
theological_decisions:
- issue: La imagen de la vida como condición temporal/extranjera
  english_pob_reading: in the house of my sojourning
  chosen_spanish_reading: en la casa de mi peregrinación
  alternative_spanish_readings:
  - en la casa de mi estancia
  - en la casa de mi morar como extranjero
  rationale: El versículo no habla solo de un lugar físico, sino de una existencia marcada por la temporalidad. «Peregrinación» preserva esa tensión teológica y poética, y es inteligible para lectores de iglesia en español.
  doctrine_reference: Hebreos 11:13; 1 Pedro 2:11
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción sigue de cerca el hebreo con apoyo del criterio óptimo del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene el tratamiento reverente de la segunda persona singular posesiva con «tus».
  - «Estatutos» conserva la terminología legal-covenantal preferida para חֻקִּים en este proyecto.
  - «Peregrinación» se usa como equivalente de la condición de forastero/sojourner, coherente con el registro bíblico en español.
