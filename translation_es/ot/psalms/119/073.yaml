translation:
  language: es
  text: Tus[a] manos me hicieron y me formaron; dame entendimiento, para que aprenda tus mandamientos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hebreo, los versículos 73–80 comienzan con la letra yod (י), la décima del alfabeto; continúan el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: יָדֶיךָ / Your hands
  english_pob_choice: Your hands
  chosen_spanish: Tus manos
  alternatives_spanish:
  - Tus manos
  - Tus brazos
  lexicon: LEX-OT-HAND
  rationale: '"Manos" es la equivalencia natural y directa para יָד en este contexto de creación y formación. Mantiene la imagen corporal sin añadir interpretación.'
- source_word: עָשׂוּנִי
  english_pob_choice: made me
  chosen_spanish: me hicieron
  alternatives_spanish:
  - me hicieron
  - me crearon
  lexicon: LEX-OT-MAKE
  rationale: '"Hicieron" refleja la acción de hacer/producir de עָשָׂה sin forzar una especificación teológica extra. "Crearon" sería posible, pero aquí el paralelismo con "me formaron" favorece conservar dos verbos distintos.'
- source_word: וַיְכוֹנְנ֑וּנִי
  english_pob_choice: fashioned me
  chosen_spanish: me formaron
  alternatives_spanish:
  - me formaron
  - me establecieron
  lexicon: LEX-OT-ESTABLISH
  rationale: El verbo כון tiene la idea de fijar, establecer, preparar o formar. "Me formaron" comunica bien la segunda acción y preserva el paralelismo con "me hicieron".
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_spanish: dame entendimiento
  alternatives_spanish:
  - hazme entender
  - concédeme entendimiento
  lexicon: LEX-OT-UNDERSTAND
  rationale: La petición causativa hebrea se vierte de forma natural en español con "dame entendimiento", que conserva el sentido de impartir comprensión sin sobrecargar la sintaxis.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus mandamientos
  - tus mandatos
  - tus preceptos
  lexicon: LEX-OT-COMMANDMENT
  rationale: '"Mandamientos" sigue la decisión léxica del POB inglés para מִצְוָה/מִצְוֺת y es la opción más estable en español bíblico moderno. "Preceptos" o "mandatos" cambiarían el término recurrente del salmo.'
theological_decisions:
- issue: Petición de entendimiento como base para la obediencia
  english_pob_reading: give me understanding, that I may learn your commandments
  chosen_spanish_reading: dame entendimiento, para que aprenda tus mandamientos
  alternative_spanish_readings:
  - dame entendimiento para aprender tus mandamientos
  - hazme entender, para que aprenda tus mandamientos
  rationale: Se conserva la relación final entre recibir entendimiento y aprender/obedecer los mandamientos. No se convierte en una idea meramente intelectual; la comprensión se orienta a la observancia.
  doctrine_reference: Salmo 119; sabiduría/obediencia en la Torá
- issue: Paralelismo creador entre hacer y formar
  english_pob_reading: made me and fashioned me
  chosen_spanish_reading: me hicieron y me formaron
  alternative_spanish_readings:
  - me hicieron y me establecieron
  - me crearon y me formaron
  rationale: El hebreo presenta dos verbos en paralelo. En español se preservan como dos acciones distinguibles para no borrar la intensidad poética ni el matiz de modelado/establecimiento.
  doctrine_reference: Creación divina del ser humano; lenguaje poético de la formación
- issue: Sin ocultar el segundo miembro del paralelo hebreo
  english_pob_reading: fashioned me
  chosen_spanish_reading: me formaron
  alternative_spanish_readings:
  - me hicieron
  - me modelaron
  rationale: '"Formaron" conserva el doblete y evita neutralizar la tensión del original, donde el segundo verbo aporta una imagen complementaria al primero.'
  doctrine_reference: Poética hebrea; paralelismo sinonímico
translation_notes:
  revision_awareness: Sin revisiones aplicadas en el paquete más reciente; la redacción sigue de cerca el hebreo con apoyo del criterio léxico auditado del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene "mandamientos" para מִצְוֺת en coherencia con la serie léxica del Salmo 119.
  - Se evita "SEÑOR" porque el texto hebreo de este versículo no contiene el nombre divino; el poseedor se expresa con el sufijo de segunda persona.
  - '"Dame entendimiento" conserva el sentido causativo del hebreo en un español natural y reverente.'
