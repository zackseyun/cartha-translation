translation:
  language: es
  text: Enséñame buen discernimiento y conocimiento, porque he confiado en tus mandamientos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוּב טַעַם
  english_pob_choice: good judgment
  chosen_spanish: buen discernimiento
  alternatives_spanish:
  - buen juicio
  - buen criterio
  lexicon: sentido contextual de טַעַם como discernimiento/sabor aplicado a juicio
  rationale: El hebreo combina טוּב con טַעַם, una expresión que apunta a capacidad de discernir con buen juicio; 'discernimiento' comunica mejor esa facultad en español que una traducción demasiado literal o culinaria.
- source_word: וָדַעַת
  english_pob_choice: knowledge
  chosen_spanish: conocimiento
  alternatives_spanish:
  - sabiduría
  - entendimiento
  lexicon: conocimiento/ידע
  rationale: La pareja con טַעַם favorece una segunda cualidad cognitiva. 'Conocimiento' mantiene la amplitud del hebreo sin cargar el verso con un matiz no explicitado por el texto.
- source_word: לַמְּדֵנִי
  english_pob_choice: Teach me
  chosen_spanish: Enséñame
  alternatives_spanish:
  - Instrúyeme
  - Enséñame tú
  lexicon: piel/hiphil de למד en forma causativa
  rationale: El ruego es directo y natural en español; 'Enséñame' expresa adecuadamente la petición de instrucción sin añadir intensidad innecesaria.
- source_word: בְמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus mandatos
  - tus preceptos
  lexicon: מִצְוָה/מִצְוֹת según HALOT
  rationale: '''Mandamientos'' sigue la decisión auditada en inglés POB y preserva el valor de orden autoritativa divina. ''Preceptos'' o ''mandatos'' son posibles, pero menos consistentes con la serie terminológica del salmo.'
- source_word: הֶאֱמָנְתִּי
  english_pob_choice: I believe
  chosen_spanish: he confiado
  alternatives_spanish:
  - creo
  - he creído
  lexicon: אָמַן en sentido de confiar/ser fiel
  rationale: En este contexto, el verbo expresa adhesión confiada a los mandamientos, no solo asentimiento intelectual. 'He confiado' conserva esa fuerza relacional y obediencial; 'creo' sonaría demasiado estrecho.
theological_decisions:
- issue: Sentido de הֶאֱמָנְתִּי entre creer y confiar
  english_pob_reading: I believe in your commandments.
  chosen_spanish_reading: he confiado en tus mandamientos.
  alternative_spanish_readings:
  - creo en tus mandamientos
  - he creído en tus mandamientos
  rationale: El hebreo admite una idea de confiar con fidelidad. En español, 'confiado' evita reducir el verso a mera aceptación mental y mantiene la relación activa de dependencia obediente implícita en el salmo.
  doctrine_reference: Fe y obediencia en la piedad del pacto; cf. el uso amplio de אָמַן en contextos de confianza.
translation_notes:
  revision_awareness: No se registran revisiones previas aplicadas para este versículo; la presente redacción ajusta el hebreo directo con el audit trail inglés de forma coherente y publicable.
  spanish_consistency_notes:
  - Se mantuvo el tono de ruego directo en segunda persona singular.
  - Se conservó la correspondencia semántica entre 'commandments' y 'mandamientos' para continuidad terminológica.
  - No se introdujeron notas al pie porque no hay variantes textuales o ambigüedades que el audit trail exija explicitar aquí.
