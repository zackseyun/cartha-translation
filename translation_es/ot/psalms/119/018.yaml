translation:
  language: es
  text: Abre mis ojos, para que vea maravillas de tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּל ... עֵינַי
  english_pob_choice: Open my eyes
  chosen_spanish: Abre mis ojos
  alternatives_spanish:
  - Ábreme los ojos
  - Desvela mis ojos
  lexicon: HALOT (גָּלָה), uso idiomático español
  rationale: El hebreo pide una acción causativa sobre los ojos como metáfora de entendimiento espiritual. «Abre mis ojos» reproduce con naturalidad la petición directa del salmista; «ábreme los ojos» es posible, pero suena menos concentrado en la imagen textual. «Desvela» sería más interpretativo.
- source_word: וְאַבִּיטָה
  english_pob_choice: that I may behold
  chosen_spanish: para que vea
  alternatives_spanish:
  - y contemple
  - para que yo contemple
  lexicon: HALOT (נבט), equivalencia funcional
  rationale: El verbo expresa mirar con atención. En español, «vea» conserva la idea de percepción resultante en una construcción breve y natural; «contemple» añade solemnidad pero puede sonar más elaborado que el hebreo.
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrous things
  chosen_spanish: maravillas
  alternatives_spanish:
  - cosas maravillosas
  - portentos
  lexicon: HALOT (פָּלָא), sustantivo abstracto plural
  rationale: «Maravillas» transmite bien lo admirable y extraordinario del término hebreo sin forzar una especificación ausente. «Cosas maravillosas» es más explicativa; «portentos» sugiere un matiz más técnico o extraordinario.
- source_word: מִתּוֹרָתֶךָ
  english_pob_choice: out of your law
  chosen_spanish: de tu ley
  alternatives_spanish:
  - de tu enseñanza
  - de tu instrucción
  lexicon: HALOT (תּוֹרָה), continuidad terminológica del salmo
  rationale: Se mantiene «ley» porque así lo fijó la traducción inglesa POB y porque el salmo usa la serie estable de términos para la palabra revelada de Dios. «Enseñanza» o «instrucción» expresan bien el campo semántico, pero rompen la consistencia terminológica documentada.
theological_decisions:
- issue: La metáfora de «abrir los ojos» como petición de iluminación espiritual y no solo de visión física
  english_pob_reading: Open my eyes, that I may behold...
  chosen_spanish_reading: Abre mis ojos, para que vea...
  alternative_spanish_readings:
  - Ábreme los ojos, para que contemple...
  - Despierta mi entendimiento, para que vea...
  rationale: El texto hebreo presenta una súplica para recibir percepción de las realidades contenidas en la ley de Yahvé. Se conserva la metáfora ocular sin convertirla en una paráfrasis explicativa que atenúe la imagen original.
  doctrine_reference: Salmo 119:18; cf. la imagen bíblica de iluminación espiritual
- issue: El valor de תּוֹרָה como revelación normativa de Dios
  english_pob_reading: your law
  chosen_spanish_reading: tu ley
  alternative_spanish_readings:
  - tu enseñanza
  - tu instrucción
  rationale: Se retiene «ley» por coherencia con la decisión inglesa documentada y con el uso establecido dentro del salmo. Aunque el hebreo puede abarcar instrucción o enseñanza, aquí la traducción conserva la tensión entre norma y revelación sin suavizarla.
  doctrine_reference: Salmo 119; HALOT תּוֹרָה
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; el español sigue de cerca la lectura inglesa auditada y el hebreo masorético sin introducir variantes textuales ni notas de crítica textual.
  spanish_consistency_notes:
  - Se usa «ley» para תּוֹרָה en consonancia con la decisión auditada del inglés POB.
  - Se conserva un estilo breve y oracional, adecuado para el paralelismo del versículo.
  - No se introduce «Señor» ni otras sustituciones devocionales; el verso no contiene el nombre divino explícito en esta forma hebrea.
