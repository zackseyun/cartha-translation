lexical_decisions:
- source_word: מִצְוֺתֶךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato
  - ordenanzas
  - preceptos
  lexicon: HALOT
  rationale: El hebreo מִצְוָה/מִצְוֺת denota mandamientos o preceptos autoritativos de Dios. "Mandamientos" conserva bien la fuerza normativa y mantiene la correspondencia con la decisión inglesa auditada, sin perder naturalidad en español.
- source_word: תְּחַכְּמֵנִי
  english_pob_choice: makes me wiser
  chosen_spanish: me hacen más sabio
  alternatives_spanish:
  - me da sabiduría
  - me vuelve más sabio
  - me hace sabio
  lexicon: HALOT / BDB
  rationale: La forma causativa expresa que los mandamientos producen sabiduría en el hablante. En español, "me hacen más sabio" conserva el sentido causal y comparativo del original sin forzar una paráfrasis.
- source_word: מֵאֹיְבַי
  english_pob_choice: than my enemies
  chosen_spanish: que mis enemigos
  alternatives_spanish:
  - que mis adversarios
  - más que mis enemigos
  lexicon: HALOT
  rationale: La preposición y el comparativo del hebreo se reflejan de manera natural con "que mis enemigos". "Enemigos" respeta el valor léxico básico y la relación comparativa del verso.
- source_word: לְעוֹלָם הִיא לִי
  english_pob_choice: for it is ever with me
  chosen_spanish: porque para siempre me pertenecen
  alternatives_spanish:
  - porque siempre están conmigo
  - pues son para siempre míos
  - porque están conmigo para siempre
  lexicon: HALOT
  rationale: El hebreo dice literalmente que "para siempre es para mí"; la lectura inglesa entendió la frase como presencia continua. En español, "me pertenecen" intenta recoger el vínculo permanente implícito entre el hablante y los mandamientos, aunque la expresión admite una alternativa de presencia continua.
theological_decisions:
- issue: Relación entre la permanencia del mandamiento y su presencia continua en el hablante
  english_pob_reading: for it is ever with me
  chosen_spanish_reading: porque para siempre me pertenecen
  alternative_spanish_readings:
  - porque siempre están conmigo
  - porque están conmigo para siempre
  rationale: El hebreo לְעוֹלָם הִיא לִי es breve y algo elíptico; puede expresar posesión duradera o presencia constante. Se eligió una formulación española que subraya la permanencia del vínculo, manteniendo abierta la tensión semántica entre posesión y compañía continua.
  doctrine_reference: Psalms 119 theme of enduring Torah fidelity
translation_notes:
  revision_awareness: No se registran revisiones previas; la redacción sigue el texto masorético (WLC) y la decisión inglesa auditada de leer la cláusula final como presencia/permanencia continua, expresada aquí con una formulación española equivalente y no excesivamente interpretativa.
  spanish_consistency_notes:
  - Se mantiene "mandamientos" para מִצְוֺתֶךָ, en línea con la terminología POB auditada.
  - Se usa "sabio" como adjetivo personal, coherente con la estructura comparativa del verso.
  - La nota alternativa preserva la tensión entre un efecto causal directo y una formulación más explícitamente comparativa en español.
