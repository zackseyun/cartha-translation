translation:
  language: es
  text: Tus mandamientos me hacen más sabio[a] que mis enemigos, porque para siempre me pertenecen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «me vuelven más sabio».'
