translation:
  language: es
  text: Un ardor de indignación me ha tomado por causa de los impíos, los que abandonan tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַלְעָפָה
  english_pob_choice: Hot indignation
  chosen_spanish: un ardor de indignación
  alternatives_spanish:
  - una intensa indignación
  - un fuego de indignación
  lexicon: BDB/HALOT
  rationale: El hebreo expresa una reacción interna intensa, casi abrasadora; en español, 'ardor de indignación' conserva la fuerza emotiva y la imagen metafórica sin sonar artificial. 'Indignación' sola sería más débil, y 'fuego' puede sonar demasiado interpretativo.
- source_word: אֲחָזַתְנִי
  english_pob_choice: seizes me
  chosen_spanish: me ha tomado
  alternatives_spanish:
  - me ha alcanzado
  - me ha asido
  lexicon: HALOT
  rationale: El verbo comunica que la emoción se apodera del hablante. 'Me ha tomado' reproduce bien esa acción de captura o posesión en español natural; 'ha asido' es más literal pero menos idiomático.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_spanish: los impíos
  alternatives_spanish:
  - los malvados
  - los perversos
  lexicon: HALOT
  rationale: '''Impíos'' mantiene el tono bíblico y el matiz de oposición moral y religiosa del término hebreo. ''Malvados'' comunica el sentido general, pero pierde algo de la carga teológica.'
- source_word: עֹזְבֵי
  english_pob_choice: who forsake
  chosen_spanish: los que abandonan
  alternatives_spanish:
  - los que dejan
  - los que desamparan
  lexicon: HALOT
  rationale: '''Abandonan'' expresa bien la acción voluntaria y continua de dejar algo que se debía guardar. ''Desamparan'' es posible, pero en español puede sugerir abandono de una persona más que de una norma.'
- source_word: תּוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se conserva 'ley' para seguir la decisión auditada del POB inglés y mantener la coherencia con el término técnico de la serie de salmos sobre la תורה. Aunque 'instrucción' o 'enseñanza' son alternativas legítimas, 'ley' es la equivalencia pública más estable en español bíblico.
theological_decisions:
- issue: Término para la תורה divina en un salmo de meditación normativa
  english_pob_reading: your law
  chosen_spanish_reading: tu ley
  alternative_spanish_readings:
  - tu instrucción
  - tu enseñanza
  rationale: El texto contrasta a los impíos que abandonan aquello que pertenece a Yahvé. 'Ley' preserva la función normativa y la consistencia terminológica dentro del salmo, sin borrar el trasfondo más amplio de instrucción divina.
  doctrine_reference: Salmo 119; uso bíblico de תורה como instrucción/mandato divino
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el contexto auditado; la redacción sigue de cerca el hebreo y mantiene la decisión inglesa de 'law' como base terminológica.
  spanish_consistency_notes:
  - Se evitó 'SEÑOR' para el nombre divino porque este versículo usa sufijo posesivo sobre תּוֹרָה, no el Tetragrámaton.
  - '''Impíos'' y ''ley'' mantienen un registro bíblico coherente con el resto del Salmo 119.'
  - La sintaxis española coloca la causa al inicio con 'por causa de', reproduciendo fielmente la relación causal del hebreo sin sobrecargar la frase.
