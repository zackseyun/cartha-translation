translation:
  language: es
  text: 'Mis ojos desfallecen por esperar tu promesa; pregunto: «¿Cuándo me consolarás?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּלוּ / כָּל֣וּ
  english_pob_choice: fail
  chosen_spanish: desfallecen
  alternatives_spanish:
  - se consumen
  - se agotan
  lexicon: HALOT
  rationale: El verbo expresa consumirse, agotarse o desfallecer. En español, 'desfallecen' transmite bien el desgaste de la espera sin añadir una imagen extra que el hebreo no exige.
- source_word: עֵינַי
  english_pob_choice: My eyes
  chosen_spanish: Mis ojos
  alternatives_spanish:
  - mis ojos
  lexicon: WLC
  rationale: Se conserva el sujeto literal del hebreo. 'Mis ojos' es la correspondencia natural en español y mantiene el paralelismo poético.
- source_word: לְאִמְרָתֶךָ
  english_pob_choice: your promise
  chosen_spanish: tu promesa
  alternatives_spanish:
  - tu palabra
  - tu dicho
  - tu decir
  lexicon: HALOT
  rationale: 'Se sigue la decisión auditada del POB en inglés: אִמְרָה aquí no se traduce mecánicamente como ''palabra'', sino como la promesa comprometida de Dios. ''Promesa'' comunica esa fuerza de manera más clara en español.'
- source_word: לֵאמֹר
  english_pob_choice: I ask
  chosen_spanish: pregunto
  alternatives_spanish:
  - diciendo
  - al decir
  lexicon: WLC
  rationale: El hebreo introduce una pregunta directa. En español, 'pregunto' refleja mejor la función discursiva que una traducción literal de la partícula verbalizada 'diciendo'.
- source_word: מָתַי
  english_pob_choice: When
  chosen_spanish: ¿Cuándo?
  alternatives_spanish:
  - cuándo
  lexicon: WLC
  rationale: Interrogativo temporal directo, conservado en forma natural y enfática en la cita.
- source_word: תְּנַחֲמֵנִי
  english_pob_choice: will you comfort me
  chosen_spanish: me consolarás
  alternatives_spanish:
  - me confortarás
  - me aliviarás
  lexicon: HALOT
  rationale: El verbo puede abarcar consolar, confortar o aliviar. 'Consolarás' preserva el valor afectivo y pastoral del término en español bíblico sin recaer en un calco rígido.
theological_decisions:
- issue: Rendición de אִמְרָה como 'promesa' en lugar de 'palabra'
  english_pob_reading: your promise
  chosen_spanish_reading: tu promesa
  alternative_spanish_readings:
  - tu palabra
  - tu dicho
  rationale: Se mantiene la lectura del POB de que el salmista se aferra a una declaración divina comprometida. 'Promesa' hace explícita esa dimensión de fidelidad divina, sin borrar la base lexical hebrea.
  doctrine_reference: Fidelidad de Dios en su palabra/promesa
- issue: Verbo de consuelo
  english_pob_reading: comfort me
  chosen_spanish_reading: me consolarás
  alternative_spanish_readings:
  - me confortarás
  - me aliviarás
  rationale: '''Consolar'' comunica tanto la dimensión afectiva como la respuesta divina esperada por el salmista, y evita reducir el verbo a alivio físico solamente.'
  doctrine_reference: Dios como consolador del creyente
translation_notes:
  revision_awareness: 'No hay revisiones aplicadas en el paquete inglés. La redacción española sigue la lectura auditada del POB: ''promise'' para לְאִמְרָתֶךָ y una pregunta directa para מָתַי תְּנַחֲמֵנִי.'
  spanish_consistency_notes:
  - Se mantiene 'promesa' como término clave para אִמְרָה en este contexto.
  - Se evita 'SEÑOR' porque el versículo no contiene el tetragrámaton ni una sustitución explícita en la fuente.
  - La sintaxis española conserva el paralelismo y la intensidad afectiva del hebreo.
