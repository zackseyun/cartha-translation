lexical_decisions:
- source_word: צָעִיר
  english_pob_choice: small
  chosen_spanish: pequeño
  alternatives_spanish:
  - joven
  - menor
  - insignificante
  lexicon: HALOT
  rationale: El hebreo describe a alguien de poca condición o poca importancia en contexto; "pequeño" transmite humildad y bajeza social sin forzar el sentido a edad biológica.
- source_word: נִבְזֶה
  english_pob_choice: despised
  chosen_spanish: despreciado
  alternatives_spanish:
  - menospreciado
  - vilipendiado
  - desestimado
  lexicon: HALOT
  rationale: El término apunta a alguien tratado con desdén o desprecio; "despreciado" conserva bien esa carga y mantiene el paralelismo con "pequeño".
- source_word: פִּקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - estatutos
  lexicon: HALOT
  rationale: POB distingue este término de otros vocablos legales. "Preceptos" reproduce esa distinción en español con un registro claro y bíblico.
- source_word: לֹא שָׁכָחְתִּי
  english_pob_choice: I do not forget
  chosen_spanish: no olvido
  alternatives_spanish:
  - no he olvidado
  - no me olvido
  - no olvidé
  lexicon: BHS/WLC syntax
  rationale: El perfecto hebreo con negación expresa una acción completa con vigencia presente; en español, "no olvido" comunica continuidad y fidelidad de forma natural en un verso poético.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca el texto hebreo y la decisión inglesa POB de mantener 'precepts' como término distintivo.
  spanish_consistency_notes:
  - Se conservó el contraste del hebreo entre la condición humilde del hablante y su fidelidad a los mandatos divinos.
  - Se evitó 'mandamientos' para mantener la distinción léxica documentada por POB entre פִּקּוּדִים y otros términos legales.
  - La primera persona en español se expresó con verbo explícito ('Soy') para una cadencia natural y clara en poesía breve.
