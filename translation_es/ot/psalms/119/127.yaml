translation:
  language: es
  text: Por eso amo tus mandamientos más que el oro, sí, más que el oro fino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandatos
  - preceptos
  - órdenes
  lexicon: HALOT
  rationale: El hebreo מִצְוָה/מִצְוֺת designa mandamientos autoritativos de Dios. «Mandamientos» conserva esa fuerza normativa y coincide con la decisión auditada del POB en inglés.
- source_word: מִזָּהָב
  english_pob_choice: above gold
  chosen_spanish: más que el oro
  alternatives_spanish:
  - por encima del oro
  - sobre el oro
  lexicon: WLC
  rationale: La preposición comparativa aquí expresa preferencia o valoración superior, no ubicación física. En español, «más que» comunica la comparación con naturalidad y fidelidad.
- source_word: וּמִפָּז
  english_pob_choice: above fine gold
  chosen_spanish: más que el oro fino
  alternatives_spanish:
  - más que el oro puro
  - más que el oro refinado
  lexicon: WLC
  rationale: פָז nombra oro refinado o fino. «Oro fino» conserva la distinción semántica del paralelo y evita sobretraducir con un término técnico ajeno al poema.
theological_decisions:
- issue: Comparación de valor de la ley divina frente a metales preciosos
  english_pob_reading: I love your commandments above gold, above fine gold.
  chosen_spanish_reading: Amo tus mandamientos más que el oro, sí, más que el oro fino.
  alternative_spanish_readings:
  - Amo tus mandamientos por encima del oro, por encima del oro fino.
  - Amo tus mandamientos más que el oro, más que el oro puro.
  rationale: El versículo no introduce una doctrina nueva, sino una afirmación poética de preferencia absoluta por los mandamientos de Dios. La duplicación comparativa se preserva en español para mantener el énfasis retórico del hebreo y del inglés POB.
  doctrine_reference: Salmo 119:127; cf. Salmo 19:10
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; se sigue la lectura auditada del WLC y la traducción inglesa POB sin cambios textuales relevantes.
  spanish_consistency_notes:
  - Se mantiene «mandamientos» para מִצְוֺתֶיךָ, coherente con el criterio POB auditado.
  - Se evita «SEÑOR» u այլ masking porque el versículo no contiene el nombre divino explícito.
  - La repetición comparativa «más que... más que...» refleja el paralelismo hebreo y la intensidad retórica del original.
