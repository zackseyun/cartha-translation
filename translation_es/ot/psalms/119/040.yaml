translation:
  language: es
  text: Mira, anhelo tus preceptos; en tu justicia, dame vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_spanish: Mira
  alternatives_spanish:
  - He aquí
  - Mira, pues
  lexicon: HALOT
  rationale: En español, 'Mira' conserva el valor de llamada enfática/atencional del hebreo הִנֵּה sin sonar tan arcaico como 'He aquí'. Mantiene el tono de súplica personal del versículo.
- source_word: תָּאַבְתִּי
  english_pob_choice: I long
  chosen_spanish: anhelo
  alternatives_spanish:
  - deseo con ansia
  - ansío
  lexicon: HALOT
  rationale: '''Anhelo'' expresa un deseo intenso y sostenido, equivalente al valor afectivo de תָּאַבְתִּי, y suena natural en español bíblico contemporáneo.'
- source_word: לְפִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: tus preceptos
  alternatives_spanish:
  - tus mandatos
  - tus ordenanzas
  lexicon: HALOT
  rationale: Se conserva 'preceptos' para reflejar la decisión auditada de la POB y distinguir פִּקּוּדִים de otros términos legales como 'mandamientos' o 'estatutos'.
- source_word: בְּצִדְקָתְךָ
  english_pob_choice: in your righteousness
  chosen_spanish: en tu justicia
  alternatives_spanish:
  - por tu justicia
  - según tu justicia
  lexicon: HALOT
  rationale: '''Justicia'' reproduce el sustantivo צִדְקָה. La preposición בְּ admite aquí una lectura instrumental/esférica; ''en tu justicia'' mantiene la forma breve y fiel del original.'
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_spanish: dame vida
  alternatives_spanish:
  - revivifícame
  - hazme vivir
  lexicon: HALOT
  rationale: '''Dame vida'' traduce el verbo causativo de manera natural en español y conserva la petición de restauración vital sin sobrerreligiosizarla.'
theological_decisions:
- issue: Sentido de 'tu justicia' como base de vivificación
  english_pob_reading: in your righteousness
  chosen_spanish_reading: en tu justicia, dame vida
  alternative_spanish_readings:
  - por tu justicia, dame vida
  - según tu justicia, dame vida
  rationale: El hebreo vincula la petición de vida con la justicia de Yahvé. 'En tu justicia' conserva la relación estrecha sin introducir una causalidad no explicitada por el texto.
  doctrine_reference: Salmo 119:40; cf. la fidelidad recta de Yahvé como fundamento de vida para el salmista.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue directamente el texto hebreo WLC y la decisión lexical auditada en inglés ('precepts').
  spanish_consistency_notes:
  - Se mantiene 'preceptos' para לְפִקֻּדֶיךָ conforme al patrón terminológico de la serie de Salmo 119.
  - Se usa 'Yahvé' en el texto base del proyecto cuando aparezca el tetragrámaton; en este versículo no aparece de forma explícita.
  - La puntuación y el orden sintáctico buscan naturalidad en español sin perder el paralelismo súplica-anhelo-petición del hebreo.
