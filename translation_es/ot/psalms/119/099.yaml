lexical_decisions:
- source_word: מִכָּל מְלַמְּדַי
  english_pob_choice: more insight than all my teachers
  chosen_spanish: más entendimiento que todos mis maestros
  alternatives_spanish:
  - más perspicacia que todos mis maestros
  - más inteligencia que todos los que me enseñan
  lexicon: HALOT; BDB
  rationale: הִשְׂכַּלְתִּי expresa haber adquirido entendimiento o perspicacia. En español, 'entendimiento' conserva bien la idea de sagacidad adquirida sin sonar demasiado técnico. 'Maestros' sigue de cerca 'teachers' y mantiene el sentido de instructores reconocidos.
- source_word: הִשְׂכַּלְתִּי
  english_pob_choice: I have more insight
  chosen_spanish: he tenido más entendimiento
  alternatives_spanish:
  - he sido más perspicaz
  - he adquirido más entendimiento
  lexicon: HALOT 7919
  rationale: La forma verbal comunica una capacidad o resultado presente desde una experiencia previa. 'He tenido' reproduce bien el valor perfecto en español y evita forzar una lectura exclusivamente momentánea.
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - declaraciones testimoniales
  - estipulaciones del pacto
  - decretos
  lexicon: HALOT 5715
  rationale: Se mantiene 'testimonios' como en la tradición auditada de POB, porque conserva la noción de lo que Dios ha atestiguado solemnemente sin colapsarlo en 'mandamientos' o 'decretos'. En español, 'testimonios' es transparente y permite distinguir este término de los otros sinónimos del salmo.
- source_word: שִׂיחָה
  english_pob_choice: meditation
  chosen_spanish: meditación
  alternatives_spanish:
  - reflexión
  - mi conversación interior
  - mi pensar
  lexicon: HALOT 7881
  rationale: El sustantivo puede referirse a meditación, reflexión o charla. Dado el contexto de Salmo 119 y la decisión inglesa, 'meditación' comunica la idea de una ocupación constante de la mente con la palabra de Dios.
theological_decisions:
- issue: Relación entre 'testimonios' y la palabra de Dios como objeto de meditación
  english_pob_reading: your testimonies are my meditation
  chosen_spanish_reading: tus testimonios son mi meditación
  alternative_spanish_readings:
  - medito en tus testimonios
  - tus testimonios ocupan mi meditación
  rationale: La construcción mantiene la identificación fuerte del objeto de la meditación con los testimonios divinos, sin añadir un verbo que el hebreo no expresa explícitamente. Así se conserva la densidad poética del hebreo y la lectura auditada en inglés.
  doctrine_reference: Salmo 119; instrucción divina como fuente de sabiduría
- issue: Comparación de sabiduría respecto de los maestros
  english_pob_reading: I have more insight than all my teachers
  chosen_spanish_reading: He tenido más entendimiento que todos mis maestros
  alternative_spanish_readings:
  - Soy más perspicaz que todos mis maestros
  - He adquirido más entendimiento que todos mis maestros
  rationale: El hebreo presenta una afirmación de superioridad en entendimiento adquirida mediante la relación con los testimonios de Yahvé. 'He tenido más entendimiento' conserva la comparación sin exagerar el matiz de superioridad intelectual más allá de lo que el poema afirma.
  doctrine_reference: Sabiduría bíblica; autoridad de la revelación divina sobre la instrucción humana
translation_notes:
  revision_awareness: No se documentaron revisiones ni variantes textuales en el paquete de origen; se siguió la lectura masorética (WLC) y la elección inglesa auditada sin cambios.
  spanish_consistency_notes:
  - Se usó 'Yahvé' según el estándar del proyecto, aunque este versículo no contiene el tetragrámaton explícito.
  - '''Testimonios'' se mantiene de forma consistente con la decisión inglesa auditada para עֵדְוֹת / עֵדֻת.'
  - Se prefirió una sintaxis española natural con orden directo, manteniendo la relación causal introducida por 'porque'.
