translation:
  language: es
  text: Viva mi alma y te alabe; y tus ordenanzas me ayuden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּחִי נַפְשִׁי
  english_pob_choice: Let my soul live
  chosen_spanish: Viva mi alma
  alternatives_spanish:
  - Que viva mi alma
  - Mi alma viva
  lexicon: HALOT 2421; 5315
  rationale: The Hebrew is a jussive/volitive request for life addressed to the speaker's נֶפֶשׁ. Spanish reads most naturally with 'Viva mi alma' while preserving the prayer-like force and the soul/life nuance. 'Alma' keeps the established biblical referent; 'viva' avoids a stiff future or imperative paraphrase.
- source_word: וּתְהַלְלֶךָּ
  english_pob_choice: and praise you
  chosen_spanish: te alabe
  alternatives_spanish:
  - y te alabe
  - y alabarte
  lexicon: HALOT 1984
  rationale: The verb is a third feminine singular jussive with 'mi alma' as subject. 'Te alabe' preserves the volitive sense and the worship context. 'Alabar' is the most direct Spanish equivalent for praising God here.
- source_word: וּמִשְׁפָּטֶךָ
  english_pob_choice: your ordinances
  chosen_spanish: tus ordenanzas
  alternatives_spanish:
  - tus juicios
  - tus decretos justos
  - tus reglas
  lexicon: HALOT 4941
  rationale: Following the English POB's 'ordinances,' 'ordenanzas' best renders מִשְׁפָּט as God's revealed judicial directions without importing a punitive sense. 'Juicios' is possible but can sound like condemnatory verdicts in Spanish; 'decretos justos' is more interpretive, and 'reglas' is too flattened.
theological_decisions:
- issue: Rendering of מִשְׁפָּטֶךָ as a divine-law term
  english_pob_reading: your ordinances
  chosen_spanish_reading: tus ordenanzas
  alternative_spanish_readings:
  - tus juicios
  - tus decretos
  rationale: The verse asks that God's משפטים help the psalmist, so the term functions as a positive guide within covenant instruction, not merely as punishment or courtroom verdict. 'Ordenanzas' preserves that legal-covenantal force while remaining readable in Spanish.
  doctrine_reference: Psalm 119 as a celebration of divine instruction and covenant fidelity
translation_notes:
  revision_awareness: No later English revisions or textual variants were supplied in the audit packet. The Spanish draft follows the WLC wording and the existing English POB choice for מִשְׁפָּטֶךָ as 'ordinances.'
  spanish_consistency_notes:
  - Used 'alma' for נֶפֶשׁ in continuity with common biblical Spanish, without flattening its life/self sense.
  - Preserved the two volitive clauses with Spanish subjunctives ('viva', 'alabe') to reflect the Hebrew jussive force.
  - Rendered the final petition with 'me ayuden' to match the plural Hebrew verb and the collective force of 'tus ordenanzas'.
