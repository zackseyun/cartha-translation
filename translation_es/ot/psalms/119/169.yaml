translation:
  language: es
  text: Llegue[a] mi clamor delante de ti, Yahvé; dame entendimiento conforme a tu palabra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 169–176 comienzan con taw (ת), la vigésima segunda letra del alfabeto; esto continúa el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרַב / רִנָּתִי
  english_pob_choice: Let my cry come
  chosen_spanish: Llegue mi clamor
  alternatives_spanish:
  - Que mi clamor llegue
  - Venga mi clamor
  lexicon: HALOT
  rationale: El hebreo usa el verbo קָרַב en forma jussiva/imperfectiva con el sustantivo רִנָּה, que aquí expresa un clamor o súplica audible. En español, 'llegue' conserva el valor desiderativo sin añadir elementos ajenos, y 'clamor' comunica mejor el registro orante que 'grito'.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_spanish: delante de ti
  alternatives_spanish:
  - ante ti
  - en tu presencia
  lexicon: HALOT
  rationale: La locución preposicional indica presencia inmediata o acceso ante alguien. 'Delante de ti' es natural en español bíblico contemporáneo y mantiene la imagen espacial sin sobreteologizarla.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / uso consistente POB
  rationale: Se conserva el nombre divino como nombre propio en español, siguiendo la decisión del POB de no ocultar el tetragrámaton con una sustitución litúrgica.
- source_word: כִּדְבָרְךָ
  english_pob_choice: according to your word
  chosen_spanish: conforme a tu palabra
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu palabra
  lexicon: HALOT
  rationale: דָּבָר se entiende aquí como la palabra dicha por Dios. 'Conforme a' preserva la relación normativa/ajustada del hebreo כְּ- sin sonar mecánico, y mantiene la distinción con otros términos de promesa o dicho.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_spanish: dame entendimiento
  alternatives_spanish:
  - hazme entender
  - instrúyeme
  lexicon: HALOT
  rationale: El verbo הָבִין en esta forma causativa expresa pedir que Dios conceda discernimiento. 'Dame entendimiento' es fiel, claro y mantiene el tono de súplica directa.
theological_decisions:
- issue: Nombre divino explícito en el salmo
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: Se preserva el nombre propio de Dios en vez de una sustitución funcional, porque el texto hebreo contiene יְהוָה y la política del POB documenta su transliteración como nombre.
  doctrine_reference: 'DOCTRINE.md: divine name as a name, not a masking convention'
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el audit trail proporcionado. La redacción española sigue directamente el hebreo masorético y la decisión auditada del POB para el nombre divino y דָּבָר.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' para יְהוָה, conforme al estándar del proyecto.
  - '''Palabra'' se usa para דָּבָר en coherencia con otros contextos de habla divina, sin introducir ''mensaje'' o ''promesa'' aquí.'
  - 'La estructura sintáctica conserva el paralelismo petitorio del original: súplica de acceso + petición de entendimiento.'
