  rationale: El hebreo usa דֶּרֶךְ en sentido figurado de trayectoria o modo de vida. «Camino» comunica con naturalidad esa imagen en español sin perder el valor metafórico.
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus preceptos solemnes
  lexicon: HALOT
  rationale: Se conserva «testimonios» siguiendo la decisión auditada en inglés para עֵדוּת/עֵדֹת, manteniendo la serie técnica de los salmos y la referencia al testimonio pactual de Dios.
- source_word: שַׂשְׂתִּי
  english_pob_choice: I rejoice
  chosen_spanish: me deleito
  alternatives_spanish:
  - me regocijo
  - me alegro
  lexicon: BDB
  rationale: El verbo expresa alegría intensa. «Me deleito» transmite gozo apreciativo y encaja bien con la comparación del hemistiquio paralelo.
- source_word: הוֹן
  english_pob_choice: riches
  chosen_spanish: riquezas
  alternatives_spanish:
  - bienes
  - caudal
  lexicon: HALOT
  rationale: «Riquezas» es la equivalencia más directa y transparente para הוֹן en este contexto de valor material comparativo.
theological_decisions:
- issue: Comparación de gozo espiritual con bienes materiales
  english_pob_reading: as much as in all riches
  chosen_spanish_reading: tanto como en todas las riquezas
  alternative_spanish_readings:
  - más que todas las riquezas
  - como en toda riqueza
  rationale: La construcción mantiene la comparación explícita sin intensificarla más allá del hebreo. «Tanto como» conserva la equivalencia de gozo entre el camino de los testimonios de Dios y la posesión de riquezas.
  doctrine_reference: Ps 119:14; cf. Ps 119:72
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente. La redacción española sigue directamente el texto hebreo y la decisión inglesa auditada, sin introducir notas textuales ni variantes adicionales.
  spanish_consistency_notes:
  - Se mantiene «testimonios» para עֵדְוֺתֶיךָ, coherente con la serie técnica de Salmos 119.
  - Se evita «SEÑOR» porque el versículo no contiene el nombre divino; el pronombre posesivo «tus» refleja el hebreo de segunda persona.
  - «Me deleito» preserva un tono digno y comprensible en español actual.
