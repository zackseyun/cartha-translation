translation:
  language: es
  text: Recuerda[a] tu palabra a tu siervo, en la cual me has hecho esperar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 49–56 comienzan con zayin (ז), la séptima letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_spanish: Recuerda
  alternatives_spanish:
  - Acuérdate
  - Ten presente
  lexicon: BDB/HALOT
  rationale: El imperativo pide que Dios traiga a la mente su palabra; 'Recuerda' conserva la apelación directa y natural en español. 'Acuérdate' sería posible, pero 'Recuerda' mantiene mejor el tono solemne sin volverse arcaico.
- source_word: דָּבָר
  english_pob_choice: word
  chosen_spanish: palabra
  alternatives_spanish:
  - asunto
  - cosa
  lexicon: HALOT
  rationale: La auditoría inglesa fija 'word' para distinguirlo de otros términos de habla/promesa. 'Palabra' es el equivalente más fiel y transparente en español para la palabra divina pronunciada o prometida.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: BDB/HALOT
  rationale: '''Siervo'' sigue el criterio POB para δοῦλος y evita ''esclavo'' como forma principal, aunque conserva la relación de dependencia y servicio al pacto. ''Servidor'' suena más débil en este contexto devocional.'
- source_word: יִחַלְתָּנִי
  english_pob_choice: you have made me hope
  chosen_spanish: me has hecho esperar
  alternatives_spanish:
  - me has dado esperanza
  - he esperado en ti
  lexicon: HALOT
  rationale: El verbo hebreo expresa esperar con esperanza confiada. 'Me has hecho esperar' reproduce con fidelidad la construcción causativa y mantiene la tensión entre espera y esperanza sin interpretar más allá del texto.
theological_decisions:
- issue: La apelación a Dios como receptor del imperativo
  english_pob_reading: Remember your word to your servant
  chosen_spanish_reading: Recuerda tu palabra a tu siervo
  alternative_spanish_readings:
  - Acuérdate de tu palabra para tu siervo
  - Ten presente tu palabra a tu siervo
  rationale: El hebreo usa un imperativo dirigido a Dios dentro de la oración. En español, 'Recuerda' transmite la súplica sin suavizarla ni convertirla en mera meditación humana.
  doctrine_reference: Salmo 119:49; antropopatismo reverente en la oración bíblica
- issue: Relación entre esperar y esperanza
  english_pob_reading: in which you have made me hope
  chosen_spanish_reading: en la cual me has hecho esperar
  alternative_spanish_readings:
  - en la cual me has dado esperanza
  - en la cual he esperado
  rationale: 'La forma elegida preserva la ambigüedad productiva del hebreo: el acto divino produce la espera confiada del siervo. No se explicita ''esperanza'' en el texto principal para no cerrar el alcance semántico del verbo.'
  doctrine_reference: Salmo 119:49; confianza esperanzada en la promesa divina
translation_notes:
  revision_awareness: No hay revisiones previas aplicadas en el paquete fuente; se tradujo directamente desde el hebreo WLC con control frente a la auditoría inglesa POB.
  spanish_consistency_notes:
  - Se mantiene 'siervo' como término principal para עבד, en coherencia con la terminología POB.
  - Se usa 'palabra' para דָּבָר según la decisión inglesa auditada, reservando otros matices para contextos distintos.
  - La puntuación y el orden sintáctico buscan una lectura natural en español sin perder la estructura de súplica del hebreo.
