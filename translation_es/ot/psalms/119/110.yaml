  text: Los impíos me han tendido una trampa, pero no me desvío de tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_spanish: los impíos
  alternatives_spanish:
  - los malvados
  - los perversos
  lexicon: HALOT
  rationale: רְשָׁעִים denota a los culpables o injustos en oposición al justo. "Impíos" conserva el matiz moral y bíblico sin reducirlo solo a maldad genérica.
- source_word: פַּח
  english_pob_choice: a snare
  chosen_spanish: una trampa
  alternatives_spanish:
  - un lazo
  - una red
  lexicon: HALOT
  rationale: פַּח designa un dispositivo de captura, usado figuradamente para una emboscada. "Trampa" es natural en español y mantiene la imagen de captura sin sobreactuar el tipo exacto del artefacto.
- source_word: וּמִפִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: tus preceptos
  alternatives_spanish:
  - tus mandatos
  - tus órdenes
  lexicon: HALOT
  rationale: Se conserva "preceptos" para reflejar la decisión auditada de la POB inglesa y para distinguir פִּקּוּדִים de otros términos legales como mandamientos o estatutos. El posesivo "tus" mantiene la relación directa con Dios.
- source_word: תָעִיתִי
  english_pob_choice: I do not stray
  chosen_spanish: no me desvío
  alternatives_spanish:
  - no me aparto
  - no me descarrío
  lexicon: HALOT
  rationale: תָעָה puede expresar desviarse, extraviarse o andar errante. "No me desvío" comunica bien la idea de apartarse del camino correcto y armoniza con el paralelismo del versículo.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca la lectura hebrea y la elección auditada de la POB inglesa, sin introducir variantes textuales ni notas adicionales.
  spanish_consistency_notes:
  - Se mantiene "preceptos" como término técnico para פִּקּוּדִים.
  - Se usa "impíos" como equivalente reverente y bíblico de "the wicked".
  - La construcción "no me desvío" conserva el presente gnómico/poético del hebreo y del inglés POB.
