translation:
  language: es
  text: He inclinado mi corazón para cumplir tus estatutos para siempre, hasta el fin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Hasta el fin" conserva el valor intensificador o terminal de עֵקֶב, que la POB inglesa vertió como "to the very end".'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתִי
  english_pob_choice: I incline
  chosen_spanish: He inclinado
  alternatives_spanish:
  - Incliné
  - Inclino
  lexicon: BDB/HALOT
  rationale: El hebreo expresa una acción deliberada ya asumida por el hablante; el perfecto español con valor resultativo comunica bien esa decisión adoptada. "He inclinado" conserva la imagen de orientar el corazón sin añadir paráfrasis.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi mente
  - mi ser interior
  lexicon: BDB/HALOT
  rationale: '"Corazón" mantiene el centro volitivo y afectivo del hebreo mejor que una abstracción como "mente" o "ser interior". Es el equivalente natural y bíblicamente reconocible en español.'
- source_word: לַעֲשׂוֹת
  english_pob_choice: to perform
  chosen_spanish: para cumplir
  alternatives_spanish:
  - para hacer
  - para practicar
  lexicon: BDB/HALOT
  rationale: El infinitivo expresa finalidad; en español, "cumplir" comunica de forma idiomática la obediencia efectiva a preceptos, sin perder la noción de ejecución concreta de lo mandado.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  lexicon: HALOT
  rationale: Se conserva la decisión auditada de la POB inglesa, "statutes", con "estatutos", que en español mantiene la idea de disposiciones establecidas y vinculantes. "Decretos" o "preceptos" son posibles, pero alteran el perfil léxico fijado.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_spanish: para siempre
  alternatives_spanish:
  - eternamente
  - por siempre
  lexicon: BDB/HALOT
  rationale: La expresión estándar "para siempre" reproduce bien la duración indefinida y es plenamente natural en español bíblico contemporáneo.
- source_word: עֵקֶב
  english_pob_choice: to the very end
  chosen_spanish: hasta el fin
  alternatives_spanish:
  - hasta el extremo
  - hasta el final
  lexicon: BDB/HALOT
  rationale: El sustantivo adverbial עֵקֶב puede marcar resultado, consecuencia o remate. La POB inglesa lo entendió como clausura temporal/intensificadora; "hasta el fin" preserva esa idea de consumación sin sobreexplicar.
theological_decisions:
- issue: Relación entre "para siempre" y "hasta el fin"
  english_pob_reading: to perform your statutes forever, to the very end
  chosen_spanish_reading: para cumplir tus estatutos para siempre, hasta el fin
  alternative_spanish_readings:
  - para cumplir tus estatutos para siempre y hasta el fin
  - para cumplir tus estatutos para siempre, plenamente
  rationale: Se mantienen ambas expresiones porque el hebreo y la POB inglesa conservan dos marcadores de duración/intensidad. No se fusionan para no perder el énfasis poético en perseverancia total.
  doctrine_reference: Perseverancia en obediencia / fidelidad continua
- issue: Naturaleza del compromiso del salmista
  english_pob_reading: I incline my heart
  chosen_spanish_reading: He inclinado mi corazón
  alternative_spanish_readings:
  - Inclinó mi corazón
  - Inclino mi corazón
  rationale: El texto presenta una resolución personal de obediencia; el español en primera persona mantiene la agencia del orante. No se añade una lectura causal divina ni se suaviza la responsabilidad humana.
  doctrine_reference: Responsabilidad humana en la obediencia
- issue: Sentido de חֻקִּים como mandatos vinculantes
  english_pob_reading: statutes
  chosen_spanish_reading: estatutos
  alternative_spanish_readings:
  - preceptos
  - decretos
  rationale: '"Estatutos" conserva el carácter de normas establecidas y reconocibles, alineado con la decisión auditada de la POB y sin desplazar el término hacia un registro excesivamente legalista o eclesiástico.'
  doctrine_reference: Ley divina / instrucción normativa
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el expediente inglés; esta propuesta sigue la lectura base sin introducir variantes textuales ni enmiendas no atestiguadas.
  spanish_consistency_notes:
  - Se evita "SEÑOR" porque el versículo hebreo no contiene el nombre divino ni una sustitución del Tetragrámaton.
  - '"Corazón" se mantiene literalmente para conservar el centro volitivo-afectivo del hebreo.'
  - '"Estatutos" sigue la terminología consistente de la POB inglesa para חֻקִּים.'
  - La puntuación con coma refleja la doble clausura del verso sin fragmentarlo en exceso.
