lexical_decisions:
- source_word: אַתָּה
  english_pob_choice: You
  chosen_spanish: Tú
  alternatives_spanish:
  - Usted
  lexicon: —
  rationale: El hebreo enfatiza la segunda persona singular; en español, 'Tú' conserva esa cercanía y el tono de oración del salmo.
- source_word: צִוִּיתָה
  english_pob_choice: have laid down
  chosen_spanish: has ordenado
  alternatives_spanish:
  - has establecido
  - has dado
  lexicon: —
  rationale: El verbo comunica la acción de establecer o mandar disposiciones. 'Has ordenado' expresa bien el acto autoritativo sin perder naturalidad en español.
- source_word: פִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandamientos
  - estatutos
  - órdenes
  lexicon: HALOT
  rationale: POB ya distingue este término como una clase específica de disposiciones divinas. 'Preceptos' mantiene esa distinción y evita fusionarlo con vocabulario más general o litúrgicamente cargado.
- source_word: לִשְׁמֹר
  english_pob_choice: that they should be kept
  chosen_spanish: para que se guarden
  alternatives_spanish:
  - para que sean observados
  - para que se cumplan
  lexicon: —
  rationale: El infinitivo con ל expresa finalidad; 'se guarden' conserva el sentido de observar o guardar mandatos en un español fluido.
- source_word: מְאֹד
  english_pob_choice: diligently
  chosen_spanish: con diligencia
  alternatives_spanish:
  - con sumo cuidado
  - mucho
  lexicon: —
  rationale: El adverbio intensifica la manera de guardar los preceptos. 'Con diligencia' refleja la idea de cuidado atento y perseverante que el inglés POB interpretó como 'diligently'.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente. La versión española sigue de cerca la lectura inglesa auditada, pero vuelve al hebreo para mantener la relación entre 'preceptos' y la finalidad de ser guardados cuidadosamente.
  spanish_consistency_notes:
  - Se mantiene 'preceptos' como término técnico consistente con la decisión lexical documentada para פִקֻּדִים.
  - Se evita 'SEÑOR' porque el versículo no contiene el nombre divino.
  - La estructura 'para que se guarden con diligencia' conserva la finalidad del hebreo sin añadir contenido doctrinal extra.
