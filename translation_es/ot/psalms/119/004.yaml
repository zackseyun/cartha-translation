review_pass:
  verdict: revise
  source_alignment_summary: El hebreo afirma que Dios ha mandado sus preceptos con el propósito de que sean guardados cuidadosamente. «Preceptos», «se guarden» y «con diligencia» preservan adecuadamente פִּקּוּדֶיךָ, לִשְׁמֹר y מְאֹד.
  spanish_quality_summary: La redacción propuesta es clara y digna, pero «has ordenado tus preceptos» puede entenderse en español moderno como que Dios ha organizado o dispuesto los preceptos, en vez de que ha ordenado que se los guarde. Conviene explicitar la subordinada completiva para comunicar sin ambigüedad la sintaxis y el sentido del hebreo.
  glossary_alignment: «Preceptos» mantiene la distinción documentada de פִּקּוּדִים frente a otros términos legales; no se requieren notas ni excepciones terminológicas.
  issues:
  - severity: medium
    issue: Ambigüedad de «has ordenado tus preceptos».
    rationale: Aunque puede admitir el sentido de emitir o imponer preceptos, la construcción española puede leerse más naturalmente como «has puesto en orden tus preceptos». El verbo hebreo צִוִּיתָ requiere expresar que Dios mandó que los preceptos fueran guardados.
  revised_spanish_text: Tú has ordenado que tus preceptos se guarden con diligencia.
  revision_rationale: La subordinada «que tus preceptos se guarden» hace explícito el contenido y la finalidad del mandato, conserva la voz pasiva/impersonal apropiada para לִשְׁמֹר y elimina una ambigüedad idiomática sin añadir interpretación.
