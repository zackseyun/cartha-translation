translation:
  language: es
  text: Guíame por la senda de tus mandamientos, porque en ella me deleito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  english_pob_choice: Lead me
  chosen_spanish: Guíame
  alternatives_spanish:
  - Llévame
  - Dirígeme
  lexicon: הלך / דרך (forma causativa de dirigir/poner en camino)
  rationale: El hebreo pide una acción directiva hacia un camino; 'guíame' comunica bien la petición personal y preserva el matiz de conducción sin sonar artificial en español.
- source_word: בִּנְתִיב
  english_pob_choice: in the path
  chosen_spanish: por la senda
  alternatives_spanish:
  - en el camino
  - en la senda
  lexicon: נתיב
  rationale: '''Senda'' mantiene la imagen poética del camino trazado; ''por'' ayuda a expresar el movimiento o acompañamiento implícito en la guía.'
- source_word: מִצְוֹתֶיךָ
  english_pob_choice: your commandments
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus órdenes
  - tus preceptos
  lexicon: מצוה
  rationale: Se conserva la terminología bíblica estable 'mandamientos', coherente con el lenguaje del salmo y con la fuerza normativa del término hebreo.
- source_word: בּוֹ
  english_pob_choice: in it
  chosen_spanish: en ella
  alternatives_spanish:
  - en eso
  - en él
  lexicon: pronombre de 3.ª persona singular
  rationale: Aunque el hebreo puede referirse de manera resumida al 'camino/senda', en español 'ella' concuerda naturalmente con 'senda' y mantiene la referencia poética sin perder claridad.
- source_word: חָפָצְתִּי
  english_pob_choice: I delight
  chosen_spanish: me deleito
  alternatives_spanish:
  - me complazco
  - lo deseo
  lexicon: חפץ
  rationale: El verbo expresa deleite, agrado o complacencia. 'Me deleito' reproduce bien el gozo afirmado por el hablante y la lectura del English POB.
theological_decisions:
- issue: La petición dirige al orante a vivir conforme a la voluntad revelada de Dios.
  english_pob_reading: Lead me in the path of your commandments, for I delight in it.
  chosen_spanish_reading: Guíame por la senda de tus mandamientos, porque en ella me deleito.
  alternative_spanish_readings:
  - Guíame en el camino de tus mandamientos, porque en él me deleito.
  rationale: No hay tensión doctrinal especial en el versículo; la traducción mantiene la obediencia como respuesta gozosa a los mandamientos divinos.
  doctrine_reference: Salmo 119:35; obediencia a la ley de Dios como deleite del justo
translation_notes:
  revision_awareness: No se aplicaron revisiones textuales en el paquete disponible; la traducción se apoya directamente en el WLC y en la decisión léxica auditada del English POB para מִצְוֹתֶיךָ como 'commandments'.
  spanish_consistency_notes:
  - Se mantiene 'mandamientos' para מִצְוֹתֶיךָ, conforme a la terminología del salmo y a la decisión inglesa auditada.
  - Se eligió 'senda' para conservar el tono poético sin oscurecer el sentido.
  - El pronombre femenino 'ella' sigue a 'senda' y evita la ambigüedad de 'it' en español.
