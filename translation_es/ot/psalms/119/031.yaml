translation:
  language: es
  text: Me apego a tus testimonios, Yahvé; no permitas que sea avergonzado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «no me avergüences». El hebreo admite tanto una petición directa como una formulación pasiva de la misma idea.'
    reason: alternative_reading
lexical_decisions:
- source_word: דָּבַקְתִּי
  english_pob_choice: I cling
  chosen_spanish: Me apego
  alternatives_spanish:
  - Me adhiero
  - Me uno estrechamente
  - Me aferro
  lexicon: HALOT
  rationale: El verbo hebreo expresa adherencia fuerte, no solo cercanía física. 'Me apego' conserva la idea de unión persistente y suena natural en español bíblico contemporáneo sin perder intensidad.
- source_word: בְעֵדְוֺתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones del pacto
  lexicon: HALOT
  rationale: Se mantiene la elección auditada de 'testimonios' para distinguir este término de otros sinónimos legales del Salterio y preservar la consistencia terminológica de POB.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / HALOT
  rationale: El nombre divino se vierte como 'Yahvé' según la directriz del proyecto para reflejar que se trata de un nombre propio y no de un título.
- source_word: תְּבִישֵׁנִי
  english_pob_choice: let me not be put to shame
  chosen_spanish: no permitas que sea avergonzado
  alternatives_spanish:
  - no me avergüences
  - no dejes que quede avergonzado
  - no permitas que me avergüencen
  lexicon: HALOT
  rationale: 'La forma jussiva con negación expresa petición: evitar la vergüenza/afrenta. ''No permitas que sea avergonzado'' conserva el matiz pasivo del hebreo y su tono de súplica.'
theological_decisions:
- issue: Nombre divino en el texto poético
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - SEÑOR
  - Jehová
  rationale: Se conserva el nombre personal de Dios de manera transparente, coherente con la práctica editorial del proyecto y sin sustituirlo por un título litúrgico.
  doctrine_reference: DOCTRINE.md (divine name as name)
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés. La redacción española sigue de cerca el hebreo y la decisión auditada del inglés para 'testimonies' y el nombre divino.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' como forma uniforme del nombre divino.
  - Se conserva 'testimonios' para la serie terminológica del Salmo 119.
  - Se evita 'espero' o 'confío' porque el verbo hebreo דבק expresa adhesión, no mera confianza.
