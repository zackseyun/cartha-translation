review_pass:
  verdict: revise
  source_alignment_summary: 'El texto conserva correctamente el perfecto de adhesión («Me apego»), «tus
    testimonios» para עֵדֹתֶיךָ y el nombre divino «Yahvé». Sin embargo, אַל תְּבִישֵׁנִי es una súplica
    negativa con Yahvé como agente causativo directo: «no me avergüences». «No permitas que sea avergonzado»
    desplaza la agencia hacia una अनुमति/permiso y añade una pasiva que el hebreo no expresa.'
  spanish_quality_summary: «Me apego a tus testimonios, Yahvé» es claro, digno y natural. La reparación
    propuesta mejora la precisión verbal y mantiene la concisión poética del versículo.
  glossary_alignment: «Testimonios» preserva la distinción terminológica documentada para עֵדוּת/עֵדוֹת;
    «Yahvé» sigue la norma editorial para יהוה. «Me apego» comunica adecuadamente la adhesión intensa
    de דבק.
  issues:
  - severity: medium
    issue: La cláusula final atenúa y altera la agencia del verbo hebreo.
    rationale: La forma hiphil yusiva תְּבִישֵׁנִי significa «no me hagas avergonzar / no me avergüences».
      «No permitas que sea avergonzado» presenta a Yahvé principalmente como quien permite una acción
      pasiva de otro agente. La nota actual, además, caracteriza esa pasiva como una alternativa admitida
      por el hebreo, cuando la forma fuente es causativa activa con sufijo de primera persona.
  revised_spanish_text: Me apego a tus testimonios, Yahvé; no me avergüences.
  revision_rationale: Se reemplaza la perífrasis permisiva-pasiva por la súplica causativa directa exigida
    por el hebreo. Se elimina la nota porque la alternativa que documentaba ya no corresponde a una ambigüedad
    que deba preservarse en la publicación y el inglés auditado tampoco requiere nota.
