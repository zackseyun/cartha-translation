lexical_decisions:
- source_word: בְּחֻקֹּתֶיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: חֻקָּה / חֹק se entiende aquí como normas fijadas por Dios. «Estatutos» conserva el valor legal-normativo y mantiene la consistencia terminológica con el inglés POB, sin cargar el texto con una paráfrasis.
- source_word: אֶשְׁתַּעֲשָׁע
  english_pob_choice: delight
  chosen_spanish: me deleitaré
  alternatives_spanish:
  - me regocijaré
  - hallaré placer
  lexicon: BDB / uso contextual
  rationale: El verbo expresa placer gozoso, no solo aprobación intelectual. «Me deleitaré» comunica bien la alegría activa y encaja con el tono poético del versículo.
- source_word: דְּבָרֶיךָ
  english_pob_choice: word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu dicho
  - tu mensaje
  lexicon: HALOT
  rationale: דָּבָר, aplicado a Dios, remite a su palabra hablada y efectiva. «Palabra» conserva la distinción frente a otros términos hebreos cercanos y suena natural en español bíblico contemporáneo.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente. La redacción española sigue de cerca la solución inglesa auditada, ajustando solo la sintaxis para un español natural.
  spanish_consistency_notes:
  - Se conserva el paralelismo simple del hebreo con dos miembros coordinados por punto y coma.
  - Se mantiene la segunda persona singular posesiva («tus», «tu») para reflejar el sufijo pronominal de la fuente.
  - «Estatutos» y «palabra» quedan diferenciados, como en el audit trail inglés, para evitar fusionar dos términos hebreos distintos.
