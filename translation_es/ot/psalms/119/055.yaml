translation:
  language: es
  text: Me acordé de tu nombre en la noche, Yahvé, y guardo tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכַרְתִּי
  english_pob_choice: I remember
  chosen_spanish: Me acordé
  alternatives_spanish:
  - Recuerdo
  - Tengo presente
  lexicon: BDB/HALOT
  rationale: El hebreo expresa un recordar real en primera persona. En español, «me acordé» reproduce de manera natural el acto de traer a la memoria, aunque el contexto poético también puede admitir «recuerdo». Se evita una paráfrasis más libre.
- source_word: בַּלַּיְלָה
  english_pob_choice: in the night
  chosen_spanish: en la noche
  alternatives_spanish:
  - de noche
  - por la noche
  lexicon: BDB/HALOT
  rationale: La preposición con «noche» puede sonar más natural en español como «en la noche» o «por la noche». Se mantiene la referencia temporal sin añadir matices no presentes en el hebreo.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_spanish: tu nombre
  alternatives_spanish:
  - tu nombre personal
  - tu nombre propio
  lexicon: BDB/HALOT
  rationale: Se conserva el posesivo directo y el sustantivo simple. No se explicita más porque el texto hebreo no lo hace.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino
  rationale: Se sigue la decisión del POB en inglés de usar el nombre divino como nombre propio. En español, «Yahvé» es la forma de uso extendido y transparente para el Tetragrámaton, en lugar de la sustitución tradicional «SEÑOR».
- source_word: תּוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La elección inglesa del POB es «law», y en español «ley» mantiene esa correspondencia y el valor establecido en el salterio. Aunque תּוֹרָה puede incluir «instrucción» o «enseñanza», aquí se conserva la equivalencia jurídica/tradicional del término según el contexto poético y el audit trail en inglés.
theological_decisions:
- issue: Tratamiento del nombre divino יְהוָה
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: El texto hebreo contiene el nombre propio de Dios, no un mero título. La traducción española conserva esa lectura nombrándolo explícitamente como nombre divino.
  doctrine_reference: Divine Name / Tetragrammaton
- issue: Valor de תּוֹרָה en el contexto del salmo
  english_pob_reading: law
  chosen_spanish_reading: ley
  alternative_spanish_readings:
  - instrucción
  - enseñanza
  rationale: En este versículo la tradición poética del salmo y el audit trail inglés favorecen «ley». No se borra la amplitud semántica de תּוֹרָה, pero tampoco se la amplía indebidamente en el texto principal.
  doctrine_reference: Lexical theology of Torah
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; esta propuesta sigue el texto hebreo masorético y la decisión auditada del inglés POB para el nombre divino y תּוֹרָה.
  spanish_consistency_notes:
  - Se mantiene «Yahvé» en lugar de «SEÑOR» para el Tetragrámaton, en coherencia con la política del proyecto.
  - Se usa «ley» para תּוֹרָה conforme al inglés auditado y al paralelismo interno del salmo.
  - El tono es poético y sobrio, con vocabulario común en español eclesial sin arcaísmo innecesario.
