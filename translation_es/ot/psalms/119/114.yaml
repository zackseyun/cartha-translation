translation:
  language: es
  text: Tú eres mi refugio y mi escudo; en tu palabra he esperado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סִתְרִי
  english_pob_choice: my hiding place
  chosen_spanish: mi refugio
  alternatives_spanish:
  - mi escondite
  - mi escondrijo
  lexicon: HALOT
  rationale: סֵתֶר/סִתְרִי expresa lugar de ocultamiento o protección. En español, "refugio" comunica mejor la función protectora y devocional del verso que un calco como "escondite", manteniendo la imagen sin volverla extraña.
- source_word: וּמָגִנִּי
  english_pob_choice: my shield
  chosen_spanish: mi escudo
  alternatives_spanish:
  - mi defensa
  - mi protector
  lexicon: HALOT
  rationale: מָגֵן es el sustantivo común para "escudo". Se conserva la metáfora bélica de protección directa, coherente con el hebreo y con la lectura inglesa auditada.
- source_word: לִדְבָרְךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu dicho
  - tu promesa
  lexicon: HALOT
  rationale: דָּבָר aquí se entiende como la palabra pronunciada por Dios; "palabra" mantiene la distinción del término respecto a otras voces como אִמְרָה y es la opción más clara y fiel en español.
- source_word: יִחָלְתִּי
  english_pob_choice: I hope
  chosen_spanish: he esperado
  alternatives_spanish:
  - he puesto mi esperanza
  - he aguardado
  lexicon: HALOT
  rationale: La raíz יחל puede abarcar esperar con esperanza. En español, "he esperado" conserva tanto la espera confiada como la actitud de dependencia, sin sobrecargar el verso con una abstracción moderna.
theological_decisions:
- issue: Esperar con esperanza en la palabra de Dios
  english_pob_reading: I hope in your word
  chosen_spanish_reading: en tu palabra he esperado
  alternative_spanish_readings:
  - en tu palabra espero
  - en tu palabra he puesto mi esperanza
  rationale: La forma elegida conserva la tensión hebrea entre espera y confianza. "He esperado" evita reducir el verbo a mero sentimiento y mantiene la orientación activa hacia la promesa divina.
  doctrine_reference: Confianza perseverante en la palabra revelada de Dios
translation_notes:
  revision_awareness: No se documentan revisiones aplicadas en el paquete; la draft sigue de cerca el hebreo masorético y el sentido auditado de la versión inglesa POB.
  spanish_consistency_notes:
  - Se mantiene el pronombre de segunda persona singular con mayúsculas implícitas por respeto reverencial en la dirección a Dios, sin introducir formas de tratamiento ajenas al registro bíblico.
  - '"Palabra" se usa de forma consistente para לִדְבָרְךָ, respetando la decisión auditada en inglés y la distinción terminológica frente a otros sustantivos de habla divina.'
