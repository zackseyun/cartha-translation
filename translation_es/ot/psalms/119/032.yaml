  text: Correré por el camino de tus mandamientos, porque ensanchas mi corazón.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_spanish: camino
  alternatives_spanish:
  - vía
  - sendero
  lexicon: HALOT
  rationale: דֶּרֶךְ designa una ruta o modo de andar; en español, «camino» conserva la imagen concreta y funciona bien con el paralelismo del verso.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato(s)
  - preceptos
  - órdenes
  lexicon: HALOT
  rationale: La serie de términos de la Torá en el Salmo 119 suele mantenerse con equivalencia consistente. «Mandamientos» expresa autoridad normativa y es natural en español bíblico contemporáneo.
- source_word: אָרוּץ
  english_pob_choice: I will run
  chosen_spanish: Correré
  alternatives_spanish:
  - Iré corriendo
  - me apresuraré
  lexicon: BDB
  rationale: El verbo imperfecto con primera persona expresa acción voluntaria futura o modal. «Correré» mantiene la imagen de movimiento rápido sin añadir matices no presentes en el hebreo.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi interior
  - mi mente
  - mi ser
  lexicon: HALOT
  rationale: לֵב en hebreo incluye centro interior de pensamiento, voluntad y afecto. «Corazón» es la equivalencia más directa y comprensible en español.
- source_word: תַרְחִיב
  english_pob_choice: you set ... free
  chosen_spanish: ensanchas
  alternatives_spanish:
  - haces ancho
  - amplías
  - das amplitud a
  lexicon: HALOT
  rationale: El hiphil de רָחַב literalmente significa hacer ancho o ampliar. El inglés POB opta por una equivalencia dinámica («set my heart free») que interpreta la amplitud como liberación interior; en español, «ensanchas mi corazón» preserva mejor la metáfora hebrea sin perder su efecto de apertura.
theological_decisions:
- issue: Interpretación de תַרְחִיב לִבִּי
  english_pob_reading: you set my heart free
  chosen_spanish_reading: ensanchas mi corazón
  alternative_spanish_readings:
  - liberas mi corazón
  - das libertad a mi corazón
  rationale: La lectura inglesa entiende la ampliación del corazón como una liberación interior. En español se conserva la imagen original de amplitud, dejando que la implicación de libertad surja del contexto en vez de explicitarla con una paráfrasis más interpretativa.
  doctrine_reference: Salmo 119:32; metáfora poética de amplitud interior sin doctrina añadida
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el expediente inglés; el hebreo masorético presenta un texto estable para esta línea poética.
  spanish_consistency_notes:
  - Se mantuvo «mandamientos» para מִצְוֺת en línea con la terminología repetida del Salmo 119.
  - Se prefirió una imagen hebrea transparente («ensanchas mi corazón») en vez de una interpretación explicativa, para no borrar la tensión entre metáfora de amplitud y efecto de liberación que aparece en el audit trail inglés.
