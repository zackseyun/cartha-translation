translation:
  language: es
  text: entonces tendré una respuesta para el que me afrenta, porque he confiado en tu palabra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶעֱנֶה
  english_pob_choice: then I will have an answer
  chosen_spanish: entonces tendré una respuesta
  alternatives_spanish:
  - y responderé
  - entonces responderé
  lexicon: HALOT
  rationale: El hebreo expresa aquí la idea de tener una respuesta preparada frente al afrente. En español, 'tendré una respuesta' conserva esa disponibilidad de contestar sin forzar un objeto explícito inexistente en el hebreo.
- source_word: חֹרְפִי
  english_pob_choice: the one who taunts me
  chosen_spanish: el que me afrenta
  alternatives_spanish:
  - el que me insulta
  - el que me injuria
  - el que me escarnece
  lexicon: HALOT
  rationale: El participio designa a alguien que reprocha o injuria. 'Afrontar' en español bíblico y culto puede transmitir bien la idea de afrenta verbal; se evita 'taunta' por ser menos natural en español y se preserva el tono adversativo.
- source_word: דָבָר
  english_pob_choice: word
  chosen_spanish: respuesta
  alternatives_spanish:
  - palabra
  - asunto
  - cosa
  lexicon: HALOT
  rationale: Aunque el sustantivo básico es 'palabra', en esta cláusula concreta el sentido pragmático es contar con una respuesta verbal frente al burlador. Se conserva el vínculo con la palabra divina en el cierre del versículo mediante 'tu palabra'.
- source_word: בִּדְבָרֶךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - en tu palabra
  - por tu palabra
  lexicon: HALOT
  rationale: La preposición con דָּבָר expresa confianza apoyada en el contenido dicho por Dios. 'Confiado en tu palabra' reproduce adecuadamente la dependencia verbal y promesa implícita que el contexto sugiere.
theological_decisions:
- issue: Relación entre 'respuesta' y 'palabra' en el primer hemistiquio
  english_pob_reading: then I will have an answer for the one who taunts me
  chosen_spanish_reading: entonces tendré una respuesta para el que me afrenta
  alternative_spanish_readings:
  - entonces responderé al que me afrenta
  - entonces tendré qué responder al que me afrenta
  rationale: El hebreo permite entender que el salmista no solo responde, sino que posee una contestación preparada. La redacción española mantiene esa tensión sin exagerarla ni convertirla en explicación devocional.
  doctrine_reference: Salmo 119:42; cf. el uso sapiencial de la palabra confiable frente a la oposición.
translation_notes:
  revision_awareness: No se documentan revisiones aplicadas en el paquete fuente; la redacción sigue el texto hebreo WLC y el audit trail inglés sin variantes textuales registradas.
  spanish_consistency_notes:
  - Se mantiene 'palabra' para דָּבָר en el cierre del versículo, en coherencia con el criterio inglés auditado.
  - Se usa 'afrenta' para conservar un registro bíblico y digno, evitando un coloquialismo excesivo.
  - La estructura 'porque he confiado en tu palabra' preserva la causalidad del כִּי sin añadir matices interpretativos no atestiguados.
