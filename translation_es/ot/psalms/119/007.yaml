    rationale: El análisis inglés establece deliberadamente «ordinances» para מִשְׁפָּט y lo distingue de «statutes». En español, «ordenanzas» es una equivalencia clara y eclesialmente legible que conserva esa diferenciación; «estatutos» sería más apropiado como término consistente para חוק/חקים.
  revised_spanish_text: Te alabaré con corazón íntegro, al aprender tus justas ordenanzas.
