  text: Te alabaré con corazón íntegro, al aprender tus justos estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹודְךָ
  english_pob_choice: I will praise you
  chosen_spanish: Te alabaré
  alternatives_spanish:
  - te daré gracias
  - te confesaré
  lexicon: HALOT
  rationale: El hebreo 3034 puede expresar alabanza o acción de gracias; aquí el paralelismo con una vida obediente favorece el sentido de alabanza dirigida a Yahvé. En español, 'alabar' comunica mejor ese acto culto sin reducirlo a mera gratitud.
- source_word: בְּיֹשֶׁר לֵבָב
  english_pob_choice: with an upright heart
  chosen_spanish: con corazón íntegro
  alternatives_spanish:
  - con corazón recto
  - con un corazón recto
  lexicon: HALOT
  rationale: יֹשֶׁר denota rectitud/integidad moral. 'Corazón íntegro' mantiene la idea de sinceridad y rectitud interior en español natural, conservando el paralelismo con una vida guiada por la ley divina.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_spanish: estatutos
  alternatives_spanish:
  - ordenanzas
  - decretos justos
  - mandatos
  lexicon: HALOT
  rationale: Aunque el inglés POB eligió 'ordinances' para מִשְׁפָּט en este contexto, en español 'estatutos' es una forma bíblica clara y sobria que conserva el valor de disposiciones legales/reveladas de Dios sin el matiz penal de 'juicios'.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous ordinances
  chosen_spanish: tus justos estatutos
  alternatives_spanish:
  - tus estatutos de justicia
  - tus estatutos rectos
  lexicon: HALOT
  rationale: צֶדֶק/צִדְקָה comunica justicia/rectitud; 'justos' concuerda con 'estatutos' y preserva el vínculo entre el contenido normativo y el carácter recto de Dios.
theological_decisions:
- issue: Cómo reflejar el valor relacional y obediencial del versículo sin debilitar el contenido legal de מִשְׁפְּטֵי צִדְקֶךָ
  english_pob_reading: I will praise you with an upright heart, as I learn your righteous ordinances.
  chosen_spanish_reading: Te alabaré con corazón íntegro, al aprender tus justos estatutos.
  alternative_spanish_readings:
  - Te alabaré con corazón recto, cuando aprenda tus justos decretos
  - Te alabaré con integridad de corazón, mientras aprendo tus ordenanzas justas
  rationale: La línea mantiene tanto la respuesta de adoración como el proceso de instrucción bajo la ley de Dios. 'Aprender' conserva el aspecto formativo del paralelismo hebreo sin convertir el verbo en mera adquisición intelectual.
  doctrine_reference: Salmo 119; enseñanza de la Torá como formación del pueblo de Dios
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; la redacción española sigue el texto hebreo y la elección lexical auditada del inglés POB, ajustada a una formulación natural en español.
  spanish_consistency_notes:
  - Se mantiene 'tú/tus' para la segunda persona singular dirigida a Dios.
  - Se evita 'SEÑOR' como sustituto del nombre divino porque este versículo usa un posesivo de segunda persona en la forma hebrea dada.
  - '''Justos estatutos'' conserva la relación entre משפטים y צדק sin cargar el texto con un tecnicismo jurídico excesivo.'
