translation:
  language: es
  text: He escogido el camino de la fidelidad; he puesto tus mandamientos[a] delante de mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «ordenanzas»; el hebreo מִשְׁפָּטֶיךָ puede referirse a las disposiciones justas de Dios, sus decretos o sus juicios normativos.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ אֱמוּנָה
  english_pob_choice: the way of faithfulness
  chosen_spanish: el camino de la fidelidad
  alternatives_spanish:
  - el camino de la fe
  - la senda de la fidelidad
  - el camino fiel
  lexicon: HALOT
  rationale: דֶּרֶךְ pide una imagen de camino/senda; אֱמוּנָה en este contexto expresa firmeza, constancia y fidelidad más que solo 'fe' como creencia. 'Fidelidad' conserva mejor esa cualidad relacional y ética.
- source_word: בָחַרְתִּי
  english_pob_choice: I have chosen
  chosen_spanish: he escogido
  alternatives_spanish:
  - he elegido
  - he seleccionado
  lexicon: BDB
  rationale: '''Escogido'' comunica la acción personal y voluntaria del perfecto hebreo sin sonar técnico; ''elegido'' es posible, pero ''escogido'' mantiene un tono más natural y bíblico en español.'
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: tus mandamientos
  alternatives_spanish:
  - tus ordenanzas
  - tus estatutos
  - tus juicios
  lexicon: HALOT
  rationale: El POB inglés opta por 'ordinances' para מִשְׁפָּטֶיךָ, entendidos como disposiciones normativas de Dios. En español, 'mandamientos' resulta más claro y plenamente reconocible para lectores de iglesia, aunque no reproduce de forma exacta la distinción técnica de 'ordenanzas'; por eso se conserva la nota para la alternativa 'ordenanzas'.
- source_word: שִׁוִּיתִי
  english_pob_choice: I have set ... before me
  chosen_spanish: he puesto ... delante de mí
  alternatives_spanish:
  - he dispuesto ... ante mí
  - he colocado ... delante de mí
  lexicon: BDB
  rationale: שִׁוִּיתִי expresa poner/colocar en una posición determinada. 'He puesto ... delante de mí' sigue de cerca el valor espacial y meditativo del hebreo y suena natural en español.
theological_decisions:
- issue: Relación entre מִשְׁפָּטֶיךָ y el lenguaje legal divino
  english_pob_reading: ordinances
  chosen_spanish_reading: mandamientos
  alternative_spanish_readings:
  - ordenanzas
  - estatutos
  - juicios
  rationale: El término hebreo puede abarcar decisiones, normas y disposiciones judiciales de Yahvé. 'Mandamientos' hace visible su carácter vinculante sin cargarlo con un matiz punitivo; se mantiene la tensión semántica mediante alternativas en la nota lexical.
  doctrine_reference: Salmo 119:24, 119:27, 119:33; cf. Deuteronomio 4:1-2
- issue: אֱמוּנָה como fidelidad práctica o fe interior
  english_pob_reading: faithfulness
  chosen_spanish_reading: fidelidad
  alternative_spanish_readings:
  - fe
  - lealtad
  - constancia
  rationale: En el paralelismo del salmo, אֱמוּנָה describe una manera de andar estable y obediente. 'Fidelidad' conserva mejor la dimensión ética y relacional que 'fe' sola en español moderno.
  doctrine_reference: Salmo 25:10; 33:4; 119:86
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el expediente inglés. La versión española sigue el texto masorético de WLC y conserva la estructura paralela del verso sin introducir interpretaciones adicionales.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' como término reservado para el Tetragrámaton cuando aparezca; este versículo no lo contiene.
  - '''Fidelidad'' se usa para אֱמוּנָה de manera consistente con otros salmos donde el contexto es ético-covenantal.'
  - Se evitó 'SEÑOR' y se mantuvo una formulación directa y pública, apta para lectura litúrgica y estudio.
  - '''Mandamientos'' se eligió por claridad pastoral en español, pero la nota preserva la alternativa fuente-cercana ''ordenanzas''.'
