lexical_decisions:
- source_word: זֹאת הָיְתָה לִּי
  english_pob_choice: This has been my practice
  chosen_spanish: Esto ha sido mi costumbre
  alternatives_spanish:
  - Así he actuado
  - Esto ha sido para mí
  lexicon: Hebreo bíblico / uso contextual
  rationale: El hebreo expresa una realidad habitual o característica personal. 'Costumbre' comunica bien la idea de práctica sostenida sin añadir más de lo que dice el texto. 'Esto ha sido' preserva el énfasis en el pronombre demostrativo.
- source_word: נָצָרְתִּי
  english_pob_choice: I keep
  chosen_spanish: guardo
  alternatives_spanish:
  - observo
  - mantengo
  lexicon: HALOT / uso contextual
  rationale: נצר puede significar guardar, vigilar o preservar. En este contexto de obediencia a la ley, 'guardo' es natural en español y conserva la idea de custodiar cuidadosamente los mandamientos.
- source_word: פִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - encargos
  lexicon: HALOT
  rationale: Se mantiene 'preceptos' como equivalente de POB para פִקֻּדִים, distinguiéndolo de 'mandamientos' y 'estatutos'. En español es un término formal, claro y compatible con el uso bíblico del libro.
translation_notes:
  revision_awareness: No se registran revisiones en el paquete fuente; se conservó la opción léxica de la POB inglesa para פִקֻּדֶיךָ ('precepts') mediante 'preceptos', y se ajustó la sintaxis al español natural sin ampliar el contenido del verso.
  spanish_consistency_notes:
  - Se evitó 'mandamientos' para פִקֻּדִים a fin de mantener la distinción terminológica del proyecto.
  - '''Guardar'' se eligió por ser el verbo bíblico español más natural para נצר en este contexto.'
  - El tono es sobrio y de uso litúrgico/lectura pública, sin arcaísmos innecesarios.
