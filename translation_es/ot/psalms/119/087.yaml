translation:
  language: es
  text: Casi me aniquilaron en la tierra, pero yo no abandoné tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּ֭/מְעַט
  english_pob_choice: almost
  chosen_spanish: Casi
  alternatives_spanish:
  - Por poco
  - A punto de
  lexicon: BDB מעט
  rationale: Expresa proximidad temporal o de grado con naturalidad en español, manteniendo la idea de que la destrucción estuvo muy cerca sin añadir más de lo que dice el hebreo.
- source_word: כִּלּ֣וּ/נִי
  english_pob_choice: wiped me
  chosen_spanish: me aniquilaron
  alternatives_spanish:
  - me borraron
  - me destruyeron
  - me acabaron
  lexicon: HALOT 3615
  rationale: El verbo señala una destrucción completa o llevar algo a su fin. 'Aniquilaron' comunica la intensidad del verbo sin forzar una imagen idiomática ajena al español bíblico actual.
- source_word: בָ/אָ֑רֶץ
  english_pob_choice: from the earth
  chosen_spanish: en la tierra
  alternatives_spanish:
  - de la tierra
  - sobre la tierra
  lexicon: HALOT 776
  rationale: La frase hebrea indica el ámbito de la acción, y el español fluye mejor con 'en la tierra' para la escena de aniquilación, sin perder el referente terrestre.
- source_word: פִקֻּודֶֽיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  - instrucciones
  lexicon: HALOT 6490
  rationale: Se mantiene el término distinguible que el POB inglés ya fijó como 'precepts', preservando la categoría específica de normas divinas sin confundirla con otros términos legales.
theological_decisions:
- issue: Fidelidad a los mandamientos divinos frente a la persecución
  english_pob_reading: but I did not forsake your precepts
  chosen_spanish_reading: pero yo no abandoné tus preceptos
  alternative_spanish_readings:
  - pero no abandoné tus mandatos
  - pero no dejé tus preceptos
  rationale: El hebreo contrapone la cercanía de la destrucción con la perseverancia del salmista. 'No abandoné' conserva la lealtad continuada implícita en עָזַבְתִּי y mantiene la terminología de POB para פִקּוּדִים.
  doctrine_reference: Salmos 119:87; perseverancia en la obediencia bajo aflicción
translation_notes:
  revision_awareness: Sin revisiones aplicadas en el paquete actual; se sigue el texto hebreo masorético y la solución lexical inglesa de POB para פִקּוּדִים.
  spanish_consistency_notes:
  - Se usa 'preceptos' para פִקּוּדִים, coherente con el criterio lexical ya documentado en inglés.
  - '''Casi'' reproduce la idea de כִּמְעַט con un adverbio breve y natural en español.'
  - Se evita 'SEÑOR' porque el versículo no contiene el Tetragrámaton.
  - La cláusula final conserva la primera persona enfática con 'yo' como apoyo estilístico, sin añadir énfasis doctrinal extra.
