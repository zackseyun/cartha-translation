translation:
  language: es
  text: Nunca olvidaré tus preceptos, porque por medio de ellos me has dado vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעוֹלָם / לֹא אֶשְׁכַּח
  english_pob_choice: I will never forget
  chosen_spanish: Nunca olvidaré
  alternatives_spanish:
  - No olvidaré jamás
  - Nunca me olvidaré
  lexicon: BDB/HALOT
  rationale: לְעוֹלָם + לֹא expresa una negación enfática y duradera. En español, «Nunca olvidaré» comunica de forma natural la continuidad absoluta sin sobrecargar el verso con una doble negación artificial.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - órdenes
  - mandatos
  lexicon: HALOT
  rationale: POB ya distingue פִּקּוּדִים como un término específico de instrucciones divinas. «Preceptos» conserva esa especificidad mejor que opciones más generales como «mandatos» u «órdenes».
- source_word: חִיִּיתָנִי
  english_pob_choice: you have given me life
  chosen_spanish: me has dado vida
  alternatives_spanish:
  - me has vivificado
  - me has hecho vivir
  lexicon: BDB/HALOT
  rationale: La forma piel de חיה aquí denota dar vida o vivificar. «Me has dado vida» es una expresión clara y fiel en español; «vivificado» puede sonar más técnico o litúrgico.
theological_decisions:
- issue: Relación causal entre los preceptos y la vida recibida
  english_pob_reading: for by them you have given me life
  chosen_spanish_reading: porque por medio de ellos me has dado vida
  alternative_spanish_readings:
  - pues por ellos me has dado vida
  - porque en ellos me has dado vida
  rationale: «Por medio de ellos» mantiene la causalidad instrumental del hebreo בָם y del inglés POB «by them». Evita reducir el vínculo a una mera coincidencia o a una referencia espacial.
  doctrine_reference: Providencia y vivificación divina mediante la palabra de Dios; Sal 119:93 en su propio contexto poético.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la redacción sigue directamente el hebreo WLC y la solución léxica inglesa auditada.
  spanish_consistency_notes:
  - Se mantiene «preceptos» como término técnico consistente con el audit trail inglés.
  - 'Se conserva el paralelismo sintáctico del verso: negación enfática + motivo causal.'
  - No se usa «SEÑOR» ni «Cristo» porque el versículo no contiene esos términos.
