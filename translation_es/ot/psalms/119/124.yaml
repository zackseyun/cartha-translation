translation:
  language: es
  text: Trata con tu siervo conforme a tu amor constante, y enséñame tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה עִם
  english_pob_choice: Deal with
  chosen_spanish: Trata con
  alternatives_spanish:
  - Haz con
  - Ocúpate de
  lexicon: HALOT
  rationale: El hebreo pide una acción hacia la persona del salmista; en español, "trata con" reproduce con naturalidad la idea relacional sin añadir matices de castigo o mera gestión que "deal with" podría sugerir en otros contextos.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: HALOT
  rationale: '"Siervo" mantiene el estatus de dependencia fiel y la terminología bíblica habitual sin borrar la relación de pertenencia. "Esclavo" sería demasiado fuerte como texto principal en español receptor, aunque puede reconocerse la dependencia servil en el trasfondo.'
- source_word: כְחַסְדֶּךָ
  english_pob_choice: according to your steadfast love
  chosen_spanish: conforme a tu amor constante
  alternatives_spanish:
  - según tu misericordia
  - de acuerdo con tu lealtad amorosa
  lexicon: HALOT
  rationale: חֶסֶד combina lealtad pactal, bondad y amor fiel. "Amor constante" preserva la constancia y la dimensión relacional sin reducir el término a una sola faceta como "misericordia".
- source_word: וְחֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: '"Estatutos" sigue la decisión auditada del POB en inglés y comunica bien la idea de disposiciones establecidas. Se conserva el plural y el carácter normativo del hebreo חֻקִּים.'
translation_notes:
  revision_awareness: No se registran revisiones previas ni notas textuales en el paquete fuente; la redacción española sigue de cerca el hebreo y la decisión léxica auditada del POB en inglés, sin introducir variantes no sustentadas.
  spanish_consistency_notes:
  - Se mantuvo el singular relacional "tu siervo" para עַבְדְּךָ, coherente con el registro bíblico y con la preferencia POB por "servant/siervo".
  - '"Amor constante" se eligió para reflejar חסד sin oscurecer su fuerza pactal; evita tanto una simplificación sentimental como una traducción demasiado técnica.'
  - '"Estatutos" conserva la terminología jurídica/normativa estable en Salmos 119 y se ajusta a la lectura inglesa auditada.'
