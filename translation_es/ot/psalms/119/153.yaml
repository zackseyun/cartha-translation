translation:
  language: es
  text: Mira[a] mi aflicción y líbrame, porque no he olvidado tu ley.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 153–160 comienzan con resh (ר), la vigésima letra del alfabeto, continuando el acróstico introducido en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Look
  chosen_spanish: Mira
  alternatives_spanish:
  - Mira con atención
  - Contempla
  lexicon: HALOT
  rationale: El imperativo pide atención dirigida a la situación del salmista. «Mira» transmite la petición directa en español natural sin añadir una carga interpretativa que no está en el hebreo.
- source_word: עָנְיִי
  english_pob_choice: my affliction
  chosen_spanish: mi aflicción
  alternatives_spanish:
  - mi angustia
  - mi sufrimiento
  lexicon: HALOT
  rationale: El término cubre opresión, miseria o aflicción. «Aflicción» mantiene amplitud semántica y es fiel al tono de lamentación del versículo.
- source_word: וְחַלְּצֵנִי
  english_pob_choice: deliver me
  chosen_spanish: líbrame
  alternatives_spanish:
  - rescátame
  - sálvame
  lexicon: HALOT
  rationale: El verbo expresa liberación de una situación de presión o peligro. «Líbrame» conserva el sentido de sacar de esa condición sin forzar un matiz más específico que el hebreo no exige.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se mantiene «ley» conforme a la decisión auditada del POB en inglés. En español, «ley» es la equivalencia más estable y reconocible para תּוֹרָה en este salmo, sin borrar que también puede implicar instrucción o enseñanza.
theological_decisions:
- issue: Acrostic marker in the English POB footnote
  english_pob_reading: Verses 153–160 begin with resh (ר), the twentieth letter of the alphabet, continuing the acrostic.
  chosen_spanish_reading: Versículos 153–160 comienzan con resh (ר), la vigésima letra del alfabeto, continuando el acróstico.
  alternative_spanish_readings:
  - No incluir la nota acrostica
  - Mencionar solo que es una sección alfabética
  rationale: Se conserva la observación literaria del POB porque ayuda al lector a ver la estructura poética del salmo y no afecta el sentido del versículo, pero sí su forma.
  doctrine_reference: Salmo 119:153–160; recurso poético del acróstico alfabético
translation_notes:
  revision_awareness: No se registran revisiones previas ni variantes textuales en el paquete de auditoría; la redacción sigue directamente el WLC y la decisión léxica auditada del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene «ley» para תּוֹרָה, coherente con la tradición auditada del POB en inglés y con el uso estable del término en el salmo.
  - «Líbrame» conserva un registro bíblico natural en español y evita especificar el tipo de rescate más allá del hebreo.
  - La nota a pie de página se ancla en «Mira[a]» para reproducir la observación formal del acróstico sin interrumpir la lectura principal.
