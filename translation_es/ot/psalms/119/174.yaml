lexical_decisions:
- source_word: תָּאַ֣בְתִּי
  english_pob_choice: I long for
  chosen_spanish: Anhelo
  alternatives_spanish:
  - Deseo intensamente
  - Tengo anhelo de
  lexicon: HALOT
  rationale: El verbo expresa un fuerte deseo/ansia. «Anhelo» conserva esa carga afectiva sin volverse demasiado coloquial, y suena natural en español bíblico moderno.
- source_word: לִֽישׁוּעָתְךָ
  english_pob_choice: your salvation
  chosen_spanish: tu salvación
  alternatives_spanish:
  - tu rescate
  - tu liberación
  lexicon: HALOT
  rationale: יׁשועה remite a salvación en sentido amplio, no solo a una liberación puntual. «Salvación» mantiene esa amplitud y coincide con la lectura inglesa auditada.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / uso POB del Nombre divino
  rationale: Se conserva el nombre propio del pacto como nombre, no como sustituto reverencial. «Yahvé» es el equivalente español establecido en el proyecto para יְהוָה.
- source_word: וְתֽוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Aunque תּוֹרָה puede significar instrucción o enseñanza, aquí se mantiene «ley» por coherencia con la decisión auditada en inglés y por ser una opción estable y reconocible en el contexto del salmo.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_spanish: mi delicia
  alternatives_spanish:
  - mi deleite
  - mi gozo
  lexicon: HALOT
  rationale: El sustantivo expresa placer, deleite o gozo. «Mi delicia» preserva la imagen y la relación afectiva con la ley divina, con buena naturalidad en español.
theological_decisions:
- issue: El nombre divino en la invocación final
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: Se evita la sustitución litúrgica por «SEÑOR» para no ocultar el tetragrámaton. La línea reconoce directamente a Dios por su nombre propio, en continuidad con la política del POB.
  doctrine_reference: 'DOCTRINE.md: el nombre divino es un nombre propio y debe ser visible en la traducción.'
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente. La redacción española sigue la lectura inglesa auditada y el hebreo base, sin introducir variantes textuales no atestiguadas.
  spanish_consistency_notes:
  - Se mantiene la tercera persona singular implícita del hebreo con un español directo y equilibrado.
  - «Yahvé» se usa de forma consistente para יְהוָה.
  - «Ley» conserva la terminología estable del salmo para תּוֹרָה, sin forzar «instrucción» en este verso.
  - 'El paralelismo hebreo se refleja con dos miembros breves y simétricos: deseo/salvación y ley/delicia.'
