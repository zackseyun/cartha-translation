translation:
  language: es
  text: Mi vida está continuamente en mi mano, y no he olvidado tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_spanish: mi vida
  alternatives_spanish:
  - mi alma
  - mi ser
  - mi persona
  lexicon: HALOT
  rationale: En este contexto poético, נֶפֶשׁ expresa la vida o la propia existencia expuesta al peligro. ‘Mi vida’ conserva bien el sentido del inglés POB y evita cargar el verso con una lectura exclusivamente interior (‘alma’) que no es exigida por el hebreo aquí.
- source_word: בְכַפִּי
  english_pob_choice: in my hand
  chosen_spanish: en mi mano
  alternatives_spanish:
  - en la palma de mi mano
  - a mi alcance
  lexicon: HALOT
  rationale: La imagen hebrea de la palma o mano expresa posesión, exposición y vulnerabilidad. ‘En mi mano’ es la forma natural y fiel en español; ‘en la palma de mi mano’ sería más explícita pero menos directa.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_spanish: continuamente
  alternatives_spanish:
  - siempre
  - sin cesar
  lexicon: HALOT
  rationale: El adverbio indica continuidad constante. ‘Continuamente’ reproduce bien el matiz temporal sin sonar demasiado idiomático o excesivamente interpretativo.
- source_word: וְתֽוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: POB mantiene ‘law’ para תּוֹרָה en este salmo por consistencia con el conjunto de vocablos para la palabra de Dios. En español, ‘ley’ conserva esa consistencia y el valor normativo del término; ‘instrucción’ o ‘enseñanza’ son posibles, pero desplazan el tono legal/covenantal del verso.
theological_decisions:
- issue: El sentido de נֶפֶשׁ en una expresión de peligro y dependencia
  english_pob_reading: my life
  chosen_spanish_reading: mi vida
  alternative_spanish_readings:
  - mi alma
  - mi ser
  rationale: La lectura de POB entiende que el hablante describe su vida expuesta en riesgo. En español, ‘mi vida’ comunica esa vulnerabilidad de forma clara y evita una espiritualización innecesaria del término.
  doctrine_reference: Antropología bíblica; poesía sapiencial y salmódica
- issue: Consistencia para תּוֹרָה como parte del vocabulario de la revelación divina
  english_pob_reading: law
  chosen_spanish_reading: ley
  alternative_spanish_readings:
  - instrucción
  - enseñanza
  rationale: Dado que POB conserva ‘law’ por consistencia terminológica, ‘ley’ mantiene la misma red conceptual en español. No se reemplaza por un término más general porque el verso contrasta la fragilidad humana con la permanencia de la norma revelada de Yahvé.
  doctrine_reference: Revelación divina; pacto y obediencia
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el expediente inglés; este borrador sigue la lectura base del WLC y la decisión léxica de POB para תּוֹרָה.
  spanish_consistency_notes:
  - Se mantiene el registro poético y sobrio del salmo.
  - Se usa ‘ley’ para תּוֹרָה en coherencia con la terminología POB del Salterio.
  - No se añadió puntuación explicativa ni glosas, porque el hebreo y el inglés POB no requieren una ambigüedad adicional en este versículo.
