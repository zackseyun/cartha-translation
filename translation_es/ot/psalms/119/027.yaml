translation:
  language: es
  text: Hazme entender el camino de tus preceptos, para que medite en tus obras maravillosas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_spanish: camino
  alternatives_spanish:
  - vía
  - sendero
  lexicon: HALOT
  rationale: דֶּרֶךְ puede expresar un camino literal o una manera de proceder. Aquí, junto con "tus preceptos", funciona bien como "camino" en español, manteniendo la imagen y la fluidez sin forzar un tecnicismo.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  lexicon: HALOT
  rationale: 'Sigo la decisión auditada del POB en inglés: "precepts" conserva el valor de disposiciones concretas y asignadas por Dios, sin diluirse en un término más general como "mandamientos".'
- source_word: הֲבִינֵנִי
  english_pob_choice: Make me understand
  chosen_spanish: Hazme entender
  alternatives_spanish:
  - Dame entendimiento
  - Instrúyeme
  lexicon: BDB
  rationale: El causativo pide una acción divina que produzca entendimiento; "Hazme entender" comunica bien esa petición en español y conserva el tono orante directo.
- source_word: וְאָשִׂיחָה
  english_pob_choice: that I may meditate
  chosen_spanish: y meditaré
  alternatives_spanish:
  - para que medite
  - y hablaré
  lexicon: HALOT
  rationale: אָשִׂיחָה puede abarcar meditar, reflexionar o conversar en voz baja. Dado el paralelismo con las obras maravillosas y la tradición del salmo, "meditaré" comunica la reflexión contemplativa sin perder la posible amplitud del verbo.
- source_word: בְּנִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous works
  chosen_spanish: en tus obras maravillosas
  alternatives_spanish:
  - en tus maravillas
  - en tus obras portentosas
  lexicon: HALOT
  rationale: נִפְלָאוֹת son hechos maravillosos o portentosos de Dios. "Obras maravillosas" conserva el sentido de acciones realizadas por Yahvé y mantiene la conexión bíblica de "maravillas" como actos divinos.
theological_decisions:
- issue: Nombre divino implícito en el salmo y posesivo de segunda persona
  english_pob_reading: your precepts / your wondrous works
  chosen_spanish_reading: tus preceptos / tus obras maravillosas
  alternative_spanish_readings:
  - tus preceptos / tus maravillas
  rationale: El verso hebreo usa segunda persona singular masculina, no el nombre divino explícito. Por eso no corresponde introducir "Yahvé" en el texto; se conserva el posesivo "tus" y se deja la referencia implícita al destinatario divino del salmo.
  doctrine_reference: Salmos 119:27; uso pronominal de segunda persona en poesía hebrea
- issue: Valor de אָשִׂיחָה entre meditación y conversación
  english_pob_reading: meditate
  chosen_spanish_reading: meditaré
  alternative_spanish_readings:
  - conversaré
  - reflexionaré
  rationale: La decisión sigue la lectura devocional del POB en inglés y la coherencia del paralelismo. En español, "meditaré" comunica la contemplación interior mejor que una traducción más literal que sonaría ambigua o menos natural en este contexto.
  doctrine_reference: Salmos 119:15, 23, 48; meditación en la ley de Dios
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete fuente; la redacción sigue directamente el texto hebreo y la decisión léxica auditada del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene "preceptos" para פִּקּוּדִים, en coherencia con la terminología auditada del POB.
  - '"Obras maravillosas" preserva el tono bíblico sin sustituir indebidamente el campo semántico de נִפְלָאוֹת por una paráfrasis general.'
  - No se introduce "Yahvé" en este versículo porque el hebreo no lo expresa de forma abierta; el referente divino queda claro por el contexto del salmo.
