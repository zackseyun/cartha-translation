translation:
  language: es
  text: Enséñame[a], Yahvé, el camino de tus estatutos, y la guardaré hasta el fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hebreo, los versículos 33–40 empiezan todos con he (ה), la quinta letra del alfabeto; continúa así el acróstico introducido en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרֵנִי
  english_pob_choice: Teach me
  chosen_spanish: Enséñame
  alternatives_spanish:
  - Instrúyeme
  - Muéstrame
  lexicon: HALOT
  rationale: El verbo hôrâ puede expresar enseñar, instruir o mostrar. En este contexto de oración sapiencial y peticional, 'Enséñame' comunica con naturalidad la petición de guía para vivir según la ley sin añadir matices no presentes en el hebreo.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se conserva el nombre divino como nombre propio, siguiendo la directriz del proyecto. 'Yahvé' mantiene la transparencia del original frente a la sustitución por un título.
- source_word: דֶּרֶךְ
  english_pob_choice: the way
  chosen_spanish: el camino
  alternatives_spanish:
  - la senda
  - la ruta
  lexicon: HALOT
  rationale: '''Camino'' es la equivalencia más natural y fiel para דֶּרֶךְ en español bíblico contemporáneo, manteniendo la imagen de conducta o modo de andar.'
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus preceptos
  lexicon: HALOT
  rationale: '''Estatutos'' reproduce bien el sentido de disposiciones prescritas o fijadas; conserva la terminología establecida para חֹק/חֻקִּים en la auditoría inglesa, sin perder inteligibilidad en español.'
- source_word: וְאֶצְּרֶנָּה
  english_pob_choice: and I will keep it
  chosen_spanish: y lo guardaré
  alternatives_spanish:
  - y la guardaré
  - y la observaré
  lexicon: HALOT
  rationale: El verbo נצר comunica guardar, custodiar, observar con fidelidad. 'Lo guardaré' sigue el uso bíblico en español y respeta el compromiso voluntario de la respuesta del salmista.
- source_word: עֵקֶב
  english_pob_choice: to the end
  chosen_spanish: hasta el fin
  alternatives_spanish:
  - por completo
  - para siempre
  lexicon: HALOT
  rationale: עֵקֶב aquí marca resultado/firmeza o perseverancia. 'Hasta el fin' refleja la idea de persistencia o totalidad que la traducción inglesa resolvió como 'to the end', sin forzar una glosa más interpretativa.
translation_notes:
  revision_awareness: Se siguió el texto hebreo consonante/vocalizado dado y la auditoría inglesa existente. No se registran revisiones textuales adicionales en el expediente; por eso la versión española se mantiene cercana al hebreo y preserva la estructura peticional y el paralelismo del verso.
  spanish_consistency_notes:
  - Se mantiene 'Yahvé' para el nombre divino, conforme al estándar del proyecto.
  - '''Estatutos'' se usa de manera consistente para חֻקֶּיךָ, alineado con la decisión léxica inglesa.'
  - Se conserva el singular implícito de 'lo guardaré' para referirse al 'camino' (masculino singular en español).
  - El tono es litúrgico y sobrio, pero con sintaxis española natural.
