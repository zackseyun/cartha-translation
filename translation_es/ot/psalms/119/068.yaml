lexical_decisions:
- source_word: טוֹב / good
  english_pob_choice: good
  chosen_spanish: bueno
  alternatives_spanish:
  - bondadoso
  - bueno
  lexicon: HALOT
  rationale: El hebreo טוֹב expresa bondad y calidad moral; en español, «bueno» conserva la afirmación directa y natural del texto sin introducir una paráfrasis más explicativa.
- source_word: וּמֵטִיב / do good
  english_pob_choice: you do good
  chosen_spanish: haces el bien
  alternatives_spanish:
  - haces bien
  - obras el bien
  lexicon: HALOT
  rationale: El participio הפעיל sugiere acción benéfica continuada. «Haces el bien» mantiene el paralelismo con «eres bueno» y suena idiomático en español bíblico contemporáneo.
- source_word: לַמְּדֵנִי / teach me
  english_pob_choice: teach me
  chosen_spanish: enséñame
  alternatives_spanish:
  - instrúyeme
  - enséñame
  lexicon: BDB
  rationale: El verbo למד en piel pide una petición directa de instrucción. «Enséñame» es claro, reverente y equivalente al mandato súplica del hebreo.
- source_word: חֻקֶּיךָ / statutes
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: Se conserva la terminología jurídica/covenantal de חֹק/חֻקִּים. «Estatutos» es el equivalente más asentado en español y comunica la idea de mandatos prescritos.
theological_decisions:
- issue: Afirmación doble de la bondad divina
  english_pob_reading: You are good and you do good
  chosen_spanish_reading: Bueno eres tú y haces el bien
  alternative_spanish_readings:
  - Tú eres bueno y haces el bien
  - Bueno eres tú y haces el bien
  rationale: Se mantiene la duplicación hebrea entre ser y obrar, sin suavizarla. El orden invertido («Bueno eres tú») preserva el ritmo poético y la intensidad enfática del original.
  doctrine_reference: Bondad divina; coherencia entre el ser de Dios y sus obras
translation_notes:
  revision_awareness: No se aplicaron revisiones textuales adicionales; el punto clave del hebreo es el paralelismo entre טוֹב/מֵטִיב y la súplica final por instrucción en חֻקֶּיךָ.
  spanish_consistency_notes:
  - Se mantuvo «estatutos» para חֻקִּים/חֹק en continuidad con la decisión lexical auditada.
  - Se evitó «SEÑOR» porque el versículo no contiene el Tetragrámaton ni un sustituto explícito.
  - La formulación conserva un tono de oración breve y poética, apto para lectura litúrgica y estudio.
