lexical_decisions:
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_spanish: los arrogantes
  alternatives_spanish:
  - los soberbios
  - los insolentes
  - los altivos
  lexicon: HALOT
  rationale: זֵדִים denota a personas orgullosas, insolentes o presuntuosas. 'Los arrogantes' conserva bien ese campo semántico en español y mantiene el tono moral del salmo sin añadir matices no presentes en el hebreo.
- source_word: הֱלִיצֻנִי
  english_pob_choice: deride me
  chosen_spanish: me desprecian
  alternatives_spanish:
  - se burlan de mí
  - se mofan de mí
  - me ridiculizan
  lexicon: HALOT
  rationale: El verbo expresa burla, escarnio o desprecio. 'Me desprecian' es una opción amplia y natural en español; 'se burlan de mí' o 'me ridiculizan' serían alternativas posibles, pero 'desprecian' recoge bien la hostilidad del contexto.
- source_word: עַד מְאֹד
  english_pob_choice: utterly
  chosen_spanish: en gran manera
  alternatives_spanish:
  - muchísimo
  - sumamente
  - del todo
  lexicon: HALOT
  rationale: La combinación intensifica la acción. 'En gran manera' preserva el énfasis sin sonar excesivamente idiomático o forzado en español bíblico contemporáneo.
- source_word: מִתּוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: POB mantiene 'law' en inglés por consistencia con la serie de términos de la palabra divina en el salmo. En español, 'ley' es la correspondencia estable y clara para תּוֹרָה en este contexto; 'instrucción' y 'enseñanza' quedan como alternativas legítimas, pero no se adoptan aquí para mantener consistencia terminológica.
translation_notes:
  revision_awareness: No se adoptaron revisiones previas ni variantes textuales adicionales; el texto sigue directamente el hebreo masorético y la lectura auditada del English POB sin notas de variante.
  spanish_consistency_notes:
  - Se conserva el paralelismo antitético del verso con 'pero'.
  - '''Ley'' se usa para תּוֹרָה conforme a la decisión lexical auditada, sin sustituirla por formulaciones eclesiásticas más interpretativas.'
  - '''Arrogantes'' y ''desprecian'' mantienen el registro moral y relacional del hebreo sin intensificar más allá del original.'
