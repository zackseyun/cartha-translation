  source_alignment_summary: El hebreo presenta a «los arrogantes» (זֵדִים) como sujeto y usa הֱלִיצֻנִי, un verbo de burla, mofa o escarnio, intensificado por עַד מְאֹד. La segunda cláusula, «no me aparto de tu ley», representa fielmente לֹא נָטִיתִי מִתּוֹרָתְךָ; «ley» conserva adecuadamente תּוֹרָה y la consistencia terminológica del salmo.
  spanish_quality_summary: «Los arrogantes» y «tu ley» son claros, naturales y adecuados. Sin embargo, «me desprecian» atenúa y desplaza el sentido verbal específico de burla/escarnio; «se burlan de mí» lo expresa directamente. «Muchísimo» comunica con naturalidad contemporánea la intensificación «hasta/excesivamente».
  glossary_alignment: Se mantiene «ley» para תּוֹרָה, con «instrucción» y «enseñanza» como alternativas léxicas legítimas no necesarias en nota. No intervienen términos del glosario teológico que requieran tratamiento adicional. La decisión española para הֱלִיצֻנִי debe ser «se burlan de mí», no el más amplio «me desprecian», para conservar el valor de escarnio documentado por la fuente.
  issues:
