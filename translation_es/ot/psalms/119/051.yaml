    rationale: El verbo hebreo denota burlarse, mofarse o escarnecer. Aunque el desprecio puede acompañar la burla, no transmite por sí mismo la acción expresada en el texto fuente. La revisión a «se burlan de mí» restaura ese sentido sin añadir interpretación.
  revised_spanish_text: Los arrogantes se burlan muchísimo de mí, pero no me aparto de tu ley.
  revision_rationale: Se sustituye «me desprecian en gran manera» por «se burlan muchísimo de mí» para reflejar explícitamente la burla intensificada del hebreo y mejorar la naturalidad del español. No hace falta nota, pues la traducción principal comunica el sentido fuente sin una ambigüedad nueva relevante.
