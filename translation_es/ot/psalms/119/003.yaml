translation:
  language: es
  text: Ellos tampoco hacen mal, sino que andan en sus caminos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַוְלָה
  english_pob_choice: wrong
  chosen_spanish: mal
  alternatives_spanish:
  - injusticia
  - iniquidad
  lexicon: HALOT
  rationale: El hebreo עַוְלָה denota un proceder torcido o moralmente incorrecto. Aunque el POB inglés opta por 'wrong', en español 'mal' comunica con naturalidad esa negación moral sin cargar más de lo que el paralelo inmediato exige. Se preserva así la idea de conducta recta frente a desviación.
- source_word: פָעֲלוּ
  english_pob_choice: do
  chosen_spanish: han hecho
  alternatives_spanish:
  - obran
  - cometen
  - han actuado
  lexicon: WLC
  rationale: El verbo expresa acción realizada; 'han hecho' mantiene el sentido general sin introducir un término más técnico que pudiera endurecer innecesariamente el verso.
- source_word: הָלָכוּ
  english_pob_choice: walk
  chosen_spanish: andan
  alternatives_spanish:
  - caminan
  - han caminado
  - siguen
  lexicon: WLC
  rationale: El hebreo 'caminar' funciona como imagen de conducta de vida. 'Andan en sus caminos' conserva la metáfora bíblica y suena natural en español.
- source_word: דְרָכָיו
  english_pob_choice: his ways
  chosen_spanish: sus caminos
  alternatives_spanish:
  - sus sendas
  - sus sendas de vida
  lexicon: WLC
  rationale: La expresión posesiva plural se traduce de forma directa para conservar la referencia a los caminos pertenecientes a él, sin perder el valor figurado de modo de vida.
theological_decisions:
- issue: Relación entre conducta moral negativa y caminar en los caminos divinos
  english_pob_reading: who also do no wrong, but walk in his ways
  chosen_spanish_reading: Sí, no han hecho mal, sino que andan en sus caminos.
  alternative_spanish_readings:
  - y no han hecho mal, sino que andan en sus caminos
  - que también no hacen mal, sino que andan en sus caminos
  rationale: 'No hay una tensión doctrinal especial en el verso, pero el paralelismo presenta dos rasgos inseparables: ausencia de mal y conformidad con los caminos de Yahvé. El español mantiene ambas ideas sin suavizarlas ni convertirlas en una mera afirmación genérica de rectitud.'
  doctrine_reference: Salmo 119:1-3; tema bíblico de integridad y obediencia a la ley de Yahvé
translation_notes:
  revision_awareness: No se registran revisiones posteriores en el paquete fuente; la redacción sigue de cerca el WLC y el sentido auditado del POB inglés, manteniendo la metáfora de caminar y la negación moral de עַוְלָה.
  spanish_consistency_notes:
  - Se conserva 'Yahvé' en línea con la norma del proyecto cuando el texto hebreo subyacente alude al nombre divino en el contexto inmediato.
  - Se eligió 'mal' para עַוְלָה por naturalidad y porque el POB inglés ya documenta el valor moral general de 'wrong'.
  - '''Andan en sus caminos'' mantiene la imagen verbal bíblica sin imponer una formulación más eclesiástica que el hebreo no exige.'
