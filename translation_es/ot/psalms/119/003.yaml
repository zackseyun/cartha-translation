  rationale: Se reemplaza «Sí» por «Ellos tampoco» para reflejar el enlace aditivo de אַף y se emplea el presente habitual «hacen» en paralelo con «andan». Se conserva «mal» como equivalente legible de עַוְלָה y «sus caminos» para la metáfora de conducta obediente.
