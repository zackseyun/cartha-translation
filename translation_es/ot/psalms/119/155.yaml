translation:
  language: es
  text: Lejos de los impíos está la salvación, porque no buscan tus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָח֣וֹק
  english_pob_choice: far from
  chosen_spanish: Lejos de
  alternatives_spanish:
  - Está lejos de
  - Distante de
  lexicon: HALOT
  rationale: El hebreo expresa distancia real; en español, la construcción idiomática más natural y fiel al valor adverbial es «Lejos de». Mantiene el orden enfático sin sonar artificial.
- source_word: מֵרְשָׁעִים
  english_pob_choice: the wicked
  chosen_spanish: los impíos
  alternatives_spanish:
  - los malvados
  - los malhechores
  lexicon: HALOT
  rationale: רְשָׁעִים designa a los culpables/impíos en sentido moral y judicial. «Impíos» conserva el registro bíblico y la carga ética del término sin reemplazarlo por una expresión más débil.
- source_word: יְשׁוּעָה
  english_pob_choice: salvation
  chosen_spanish: la salvación
  alternatives_spanish:
  - rescate
  - liberación
  lexicon: HALOT
  rationale: El sustantivo denota salvación, auxilio liberador o rescate. Aquí el contexto sapiencial/poético permite «salvación» como la opción más amplia y tradicionalmente fiel; las alternativas quedan como matices posibles.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: 'Se mantiene la decisión auditada del inglés POB: חֹק/חֻקִּים son normas prescritas, grabadas u ordenadas. «Estatutos» es una equivalencia estable y precisa en español bíblico, sin perder la fuerza normativa.'
- source_word: דָרָשׁוּ
  english_pob_choice: seek
  chosen_spanish: buscan
  alternatives_spanish:
  - buscan con diligencia
  - indagan
  lexicon: HALOT
  rationale: Aunque דָרַשׁ puede abarcar ‘buscar’, ‘inquirir’ o ‘consultar’, en esta cláusula negativa el sentido principal es no procurar las normas de Yahvé. «Buscan» comunica claramente la idea básica en español actual; la forma más intensa se conserva como alternativa.
theological_decisions:
- issue: Relación entre «salvación» y la condición moral de los impíos
  english_pob_reading: Salvation is far from the wicked, for they do not seek your statutes.
  chosen_spanish_reading: Lejos de los impíos está la salvación, porque no buscan tus estatutos.
  alternative_spanish_readings:
  - La salvación está lejos de los impíos, porque no buscan tus estatutos.
  - Lejos de los impíos se halla la salvación, porque no buscan tus estatutos.
  rationale: El hebreo coloca primero la distancia, subrayando el contraste. La versión española conserva ese énfasis sin añadir explicación doctrinal; el juicio moral y la distancia respecto de la salvación quedan ambos visibles en el texto.
  doctrine_reference: Salmos 119:155; contraste bíblico entre obediencia a la ley de Yahvé y cercanía a la salvación.
translation_notes:
  revision_awareness: No hay revisiones previas aplicadas en el paquete; se sigue directamente el texto masorético y la decisión léxica auditada del inglés POB para חֻקֶּיךָ como «statutes», reflejada en español como «estatutos».
  spanish_consistency_notes:
  - Se mantiene «Yahvé» fuera de este versículo porque no aparece el tetragrámaton en el texto fuente.
  - «Impíos» se usa de forma consistente para רְשָׁעִים, preservando el registro bíblico.
  - «Estatutos» se usa de forma consistente para חֻקִּים/חֻקֶּיךָ según el criterio auditado del POB en inglés.
  - No se introduce mayúscula teológica innecesaria en «salvación» ni en «estatutos», conforme al español moderno de registro bíblico.
