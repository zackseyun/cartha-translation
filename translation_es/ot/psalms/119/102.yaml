translation:
  language: es
  text: No me he apartado de tus ordenanzas[a], porque tú mismo me has enseñado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ordenanzas» traduce el hebreo מִשְׁפָּטֶיךָ con un matiz de disposiciones normativas; también puede entenderse como «juicios», «reglas» o «decretos justos».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_spanish: ordenanzas
  alternatives_spanish:
  - juicios
  - reglas
  - justos decretos
  lexicon: HALOT
  rationale: En este contexto, מִשְׁפָּטֶיךָ designa las disposiciones normativas de Dios. 'Ordenanzas' preserva el sentido de mandatos establecidos y mantiene la distinción frente a otros términos legales como 'estatutos'. 'Juicios' se evita en el texto principal por su posible matiz forense en español; se conserva como alternativa.
- source_word: לֹא סָרְתִּי
  english_pob_choice: I do not turn aside
  chosen_spanish: No me aparto
  alternatives_spanish:
  - No me desvío
  - No me aparté
  lexicon: BDB / contexto verbal aspectual
  rationale: El hebreo expresa la idea de no desviarse de los mandamientos divinos. En español, 'apartarse' comunica de forma natural la imagen de desviación respecto de una norma, sin sobrecargar el texto. Se usa presente en línea con el español bíblico literario y la formulación inglesa de la POB.
- source_word: הוֹרֵתָנִי
  english_pob_choice: you yourself have taught me
  chosen_spanish: tú mismo me has enseñado
  alternatives_spanish:
  - tú me has instruido
  - tú mismo me instruiste
  lexicon: HALOT
  rationale: El verbo הוֹרָה/ירה en esta forma expresa enseñar o instruir. 'Me has enseñado' conserva la relación personal del original y el énfasis de 'tú mismo' refleja el אַתָּה enfático del hebreo y el 'you yourself' de la POB.
theological_decisions:
- issue: Identidad y función de la ley divina
  english_pob_reading: your ordinances
  chosen_spanish_reading: tus ordenanzas
  alternative_spanish_readings:
  - tus juicios
  - tus reglas
  rationale: La POB inglesa eligió 'ordinances' para מִשְׁפָּטֶיךָ, destacando el carácter normativo y justo de la instrucción divina. 'Ordenanzas' mantiene ese valor sin imponer un vocabulario eclesiástico más cargado ni borrar la dimensión jurídica del término.
  doctrine_reference: Salmo 119:102; Ley/torá divina como instrucción normativa de Dios
- issue: Énfasis enfático en la acción divina
  english_pob_reading: you yourself have taught me
  chosen_spanish_reading: tú mismo me has enseñado
  alternative_spanish_readings:
  - tú me has enseñado
  - tú mismo me instruiste
  rationale: El hebreo subraya al sujeto con אַתָּה. Traducir 'tú mismo' conserva el énfasis personal y relacional, evitando que el texto suene neutral o impersonal en español.
  doctrine_reference: Salmo 119:102; enseñanza divina personal
translation_notes:
  revision_awareness: Se revisó la opción inglesa 'ordinances' a un equivalente español que conserve el valor normativo-jurídico sin caer en un calco. No hubo revisiones textuales registradas en el paquete fuente, así que se mantuvo una sola línea de traducción con énfasis en naturalidad formal y fidelidad al hebreo.
  spanish_consistency_notes:
  - Se mantuvo 'tú mismo' para reflejar el énfasis del hebreo אַתָּה y la decisión inglesa 'you yourself'.
  - Se usó 'ordenanzas' en lugar de 'mandamientos' para respetar la distinción terminológica del Salmo 119 entre vocablos legales afines.
  - Se evitó 'me aparté' para no convertir innecesariamente el verbo a pasado, ya que el español puede reproducir el valor gnómico/habitual del original con presente.
