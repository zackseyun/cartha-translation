  text: Los arrogantes me cubren de mentiras; pero yo, con todo mi corazón, guardo tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָפְלוּ עָלַי שֶׁקֶר זֵדִים
  english_pob_choice: The arrogant smear me with lies
  chosen_spanish: Los arrogantes me cubren de mentiras
  alternatives_spanish:
  - Los soberbios me difaman con mentiras
  - Los insolentes me calumnian con mentiras
  lexicon: BDB / HALOT
  rationale: El hebreo expresa la idea de atribuir o pegar falsamente algo al hablante, con sujetos “presumidos/arrogantes” (זֵדִים) y objeto “mentira” (שֶׁקֶר). En español, «cubren de mentiras» conserva la fuerza figurada de difamar/falsificar sin añadir una metáfora más fuerte que la del hebreo. «Arrogantes» sigue la opción del POB inglés para זֵדִים y mantiene el tono moral del término.
- source_word: אֲנִי בְּכָל לֵב
  english_pob_choice: but with all my heart
  chosen_spanish: pero yo, con todo mi corazón
  alternatives_spanish:
  - pero yo, de todo corazón
  - pero yo, con todo el corazón
  lexicon: BDB
  rationale: La expresión idiomática hebrea marca integridad y totalidad interior. «Con todo mi corazón» es natural en español y conserva el sentido de entrega completa del hablante, sin reducirlo a emoción.
- source_word: אֱצֹּר
  english_pob_choice: I keep
  chosen_spanish: guardo
  alternatives_spanish:
  - conservo
  - observo
  lexicon: HALOT
  rationale: El verbo en primera persona expresa retener cuidadosamente, observar y custodiar. «Guardo» comunica bien el sentido práctico de observar fielmente los mandatos y encaja con el registro bíblico en español.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandamientos
  - ordenanzas
  - encargos
  lexicon: HALOT
  rationale: Se mantiene «preceptos» para conservar la distinción léxica que el POB inglés documenta frente a otros términos de la ley divina. En español, «preceptos» es preciso, legible y suficientemente técnico sin perder claridad.
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la redacción española sigue de cerca la lectura hebrea y el criterio óptimo-equivalente del POB inglés, preservando la imagen de difamación y la respuesta de obediencia total.
  spanish_consistency_notes:
  - Se mantiene «preceptos» para פִּקּוּדִים, en continuidad con el POB inglés.
  - Se traduce זֵדִים por «arrogantes» para conservar el valor moral del término sin sobreinterpretarlo.
  - La puntuación con punto y coma refleja el contraste adversativo fuerte del hebreo y del inglés POB.
