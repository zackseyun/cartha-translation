translation:
  language: es
  text: Sea tu amor leal el que me consuele, conforme a tu promesa para tu siervo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  english_pob_choice: steadfast love
  chosen_spanish: amor leal
  alternatives_spanish:
  - misericordia
  - bondad fiel
  - amor constante
  lexicon: HALOT
  rationale: El hebreo חֶסֶד en este contexto expresa amor pactal fiel y leal, no solo afecto ni compasión general. 'Amor leal' conserva la fuerza relacional y covenantal mejor que una palabra más abstracta como 'misericordia'.
- source_word: לְנַחֲמֵנִי
  english_pob_choice: comfort me
  chosen_spanish: me consuele
  alternatives_spanish:
  - me consuele y fortalezca
  - me alivie
  - me reconforte
  lexicon: HALOT
  rationale: El verbo נָחַם aquí tiene el sentido de consolar/traer alivio al afligido. 'Me consuele' es natural en español y mantiene el tono orante del hebreo.
- source_word: כְּאִמְרָתְךָ
  english_pob_choice: promise
  chosen_spanish: tu promesa
  alternatives_spanish:
  - tu palabra
  - tu dicho
  - tu declaración
  lexicon: HALOT
  rationale: Siguiendo la decisión inglesa de distinguir אִמְרָה de דָּבָר, 'promesa' comunica mejor que no se trata de cualquier palabra, sino de una palabra comprometida y esperada por el salmista.
- source_word: לְעַבְדֶּךָ
  english_pob_choice: to your servant
  chosen_spanish: para tu siervo
  alternatives_spanish:
  - a tu siervo
  - de tu siervo
  lexicon: HALOT
  rationale: '''Siervo'' sigue la terminología POB para δοῦλος/עֶבֶד y preserva la relación de pertenencia y servicio sin introducir ''esclavo'' como término principal. La preposición ''para'' fluye bien en español con ''promesa'' y mantiene el destinatario implícito.'
theological_decisions:
- issue: חֶסֶד como amor pactal o misericordia general
  english_pob_reading: steadfast love
  chosen_spanish_reading: amor leal
  alternative_spanish_readings:
  - misericordia
  - bondad fiel
  rationale: La lectura inglesa no reduce חֶסֶד a benevolencia genérica; por eso 'amor leal' conserva el trasfondo de fidelidad de pacto. Esto evita diluir el contenido teológico del término.
  doctrine_reference: Pacto y fidelidad divina en el Salterio
- issue: אִמְרָה como palabra/promesa específica de Dios
  english_pob_reading: promise
  chosen_spanish_reading: promesa
  alternative_spanish_readings:
  - palabra
  - dicho
  rationale: 'La opción ''promesa'' mantiene la tensión documentada: no es simplemente logos o discurso, sino una palabra divina que obliga y sostiene la esperanza del salmista.'
  doctrine_reference: Fiabilidad de la palabra de Dios
translation_notes:
  revision_awareness: No se aplicaron revisiones posteriores en el paquete; la decisión sigue de cerca el hebreo y la lectura auditada del POB en inglés, especialmente la distinción de אִמְרָה como 'promise'.
  spanish_consistency_notes:
  - Se mantuvo 'siervo' como término consistente con el vocabulario POB para עֶבֶד.
  - Se evitó 'SEÑOR' porque el texto hebreo usa un sufijo posesivo dirigido a Dios y no el Tetragrámaton explícito.
  - '''Amor leal'' se usa como equivalente sobrio y comprensible de חֶסֶד en poesía bíblica.'
