review_pass:
  verdict: revise
  source_alignment_summary: El hebreo pide que el amor leal de Dios consuele al salmista, conforme a la אמרה/promesa dirigida a su siervo. «Amor leal», «me consuele» y «promesa» reflejan bien חֶסֶד, לְנַחֲמֵנִי y כְּאִמְרָתְךָ. Sin embargo, «para tu siervo» expresa más naturalmente beneficio o finalidad, mientras que el למד de לְעַבְדֶּךָ identifica al siervo como destinatario de la promesa; «a tu siervo» conserva mejor esa relación.
  spanish_quality_summary: La redacción es clara y digna. Se recomienda además la forma exhortativa directa «Que tu amor leal me consuele», que reproduce con naturalidad el yusivo hebreo sin la construcción más pesada «Sea ... el que».
  glossary_alignment: «Amor leal» mantiene acertadamente la fidelidad relacional de חֶסֶד; «promesa» sigue la decisión auditada para אִמְרָה en este salmo; y «siervo» concuerda con la terminología POB para עֶבֶד. No se requiere nota, pues las alternativas constan en la auditoría léxica inglesa pero no se preservaron como nota de publicación.
  issues:
  - severity: low
    issue: «para tu siervo»
    rationale: La preposición puede sugerir que la promesa es meramente para beneficio del siervo. «A tu siervo» expresa con mayor precisión que la promesa fue dirigida al siervo, como en el hebreo y en el inglés auditado («to your servant»).
  revised_spanish_text: Que tu amor leal me consuele, conforme a tu promesa a tu siervo.
  revision_rationale: Se ajusta la preposición para reflejar el destinatario de la promesa y se simplifica la sintaxis para conservar la fuerza desiderativa del hebreo en español natural.
