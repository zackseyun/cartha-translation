translation:
  language: es
  text: ¡Cuánto[a] amo tu ley! Es mi meditación todo el día.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el hebreo, los versículos 97–104 empiezan con mem (מ), la decimotercera letra del alfabeto; esto continúa el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: תוֹרָתֶךָ
  english_pob_choice: law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: La POB en inglés mantuvo 'law' por consistencia en el salmo. En español, 'ley' conserva esa correspondencia estable y sigue siendo natural y reverente; 'instrucción' o 'enseñanza' son alternativas válidas, pero aquí se preserva el valor convencional de la serie de términos para la palabra de Dios.
- source_word: שִׂיחָתִי
  english_pob_choice: meditation
  chosen_spanish: mi meditación
  alternatives_spanish:
  - mi reflexión
  - mi conversación interior
  lexicon: HALOT
  rationale: El término hebreo puede abarcar la ocupación mental y la meditación reflexiva. 'Meditación' transmite bien esa idea en español bíblico actual sin reducirla a una práctica técnica moderna; 'reflexión' o 'conversación interior' explicitan matices posibles, pero son menos directos.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_spanish: Todo el día
  alternatives_spanish:
  - todo el tiempo
  - durante todo el día
  lexicon: BDB
  rationale: La expresión hebrea indica continuidad a lo largo del día. 'Todo el día' es la forma natural y fiel en español; 'durante todo el día' es más explícita pero menos concisa.
theological_decisions:
- issue: How to render תוֹרָה as a divine norming word without flattening its scope
  english_pob_reading: law
  chosen_spanish_reading: ley
  alternative_spanish_readings:
  - instrucción
  - enseñanza
  rationale: En este versículo, el contexto poético celebra la palabra revelada de Dios. 'Ley' conserva la fuerza normativa que la POB quiso mantener con 'law' y encaja con el registro del salmo, sin negar que la palabra hebrea también puede incluir instrucción y enseñanza.
  doctrine_reference: Salmo 119; uso bíblico de תּוֹרָה como revelación normativa de Yahvé
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el audit trail inglés; por eso la redacción española sigue de cerca el texto hebreo y la decisión léxica inglesa sin introducir variantes textuales ni notas de corrección.
  spanish_consistency_notes:
  - Se usó 'Yahvé' para el nombre divino según el estándar del proyecto; aquí no aparece en el texto base.
  - Se mantuvo el registro poético con exclamación inicial y orden natural del español.
  - '''Meditación'' se dejó en singular, como en el hebreo y la versión inglesa, para preservar el paralelismo sintético del verso.'
