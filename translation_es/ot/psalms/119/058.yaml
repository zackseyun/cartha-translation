translation:
  language: es
  text: Te ruego tu favor con todo mi corazón; sé benigno conmigo conforme a tu promesa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִלִּיתִי פָנֶיךָ
  english_pob_choice: I entreat your favor
  chosen_spanish: Te ruego tu favor
  alternatives_spanish:
  - Imploro tu favor
  - Suplico tu favor
  lexicon: HALOT
  rationale: El hebreo expresa una súplica intensa dirigida al rostro/presencia de Dios; el inglés POB tomó el sentido resultante de pedir favor. En español, 'te ruego' comunica bien la entreaty sin añadir dureza ni arcaísmo, y 'tu favor' preserva la idea relacional de gracia buscada ante Dios.
- source_word: בְכָל לֵב
  english_pob_choice: with all my heart
  chosen_spanish: con todo mi corazón
  alternatives_spanish:
  - de todo corazón
  - con mi corazón entero
  lexicon: HALOT
  rationale: La expresión idiomática se naturaliza en español con 'con todo mi corazón', que mantiene intensidad total sin perder claridad.
- source_word: חָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_spanish: sé benigno conmigo
  alternatives_spanish:
  - ten gracia de mí
  - ten misericordia de mí
  - sé gracioso conmigo
  lexicon: HALOT
  rationale: El imperativo de חנן pide un acto de gracia. 'Sé benigno conmigo' evita un giro demasiado litúrgico o ambiguo, conserva la petición de favor inmerecido y mantiene una forma reverente y comprensible en español.
- source_word: כְּאִמְרָתֶךָ
  english_pob_choice: according to your promise
  chosen_spanish: conforme a tu promesa
  alternatives_spanish:
  - según tu palabra
  - de acuerdo con tu promesa
  lexicon: HALOT
  rationale: La auditoría inglesa ya fija 'promise' por la fuerza de אִמְרָה en este salmo. En español, 'conforme a tu promesa' conserva esa lectura y distingue esta voz de אִמְרָה de otros términos como 'palabra' o 'dicho'.
translation_notes:
  revision_awareness: Sin revisiones previas aplicadas en el paquete; la redacción española sigue de cerca la lectura auditada en inglés y el hebreo, manteniendo la súplica por favor divino y la cláusula final en clave de promesa.
  spanish_consistency_notes:
  - Se mantuvo el paralelismo de dos peticiones separadas por punto y coma, como en el hebreo y el inglés auditado.
  - Se evitó 'misericordia' como término principal en la segunda cola para no desplazar la lectura auditada de 'favor/gracia' ni diluir la correspondencia con חנן.
  - '''Promesa'' se usa de forma consistente para כְּאִמְרָתֶךָ según la decisión léxica auditada del POB en inglés.'
