translation:
  language: es
  text: Hablaré de tus testimonios delante de reyes, y no me avergonzaré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְעֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: testimonios
  alternatives_spanish:
  - decretos
  - estipulaciones del pacto
  lexicon: HALOT
  rationale: 'Sigo la decisión auditada del POB en inglés: עֵדוֹת se entiende como «testimonios» dentro del salterio, manteniendo la consistencia terminológica y el matiz de testimonio autoritativo de Yahvé. «Testimonios» es natural en español y conserva mejor esa relación que «decretos», que suena más jurídico, o «estipulaciones del pacto», que explicita más de lo que el hebreo aquí requiere.'
- source_word: אֲדַבְּרָה
  english_pob_choice: I will speak
  chosen_spanish: Hablaré
  alternatives_spanish:
  - diré
  - hablaré acerca de
  lexicon: BDB / uso verbal en contexto
  rationale: El verbo hebreo expresa hablar o declarar en general. «Hablaré» reproduce bien el valor directo y solemne del enunciado. «Diré» sería posible, pero pierde un poco el carácter de proclamar en público; «hablaré acerca de» introduce una preposición interpretativa que no está explícita en el hebreo.
- source_word: נֶגֶד מְלָכִים
  english_pob_choice: before kings
  chosen_spanish: delante de reyes
  alternatives_spanish:
  - ante reyes
  - en presencia de reyes
  lexicon: BDB / uso idiomático
  rationale: La expresión indica presencia pública frente a autoridades. «Delante de reyes» comunica adecuadamente la escena y mantiene la sencillez del hebreo. «Ante reyes» también sería válido, pero «delante de» suena más natural en este contexto poético. «En presencia de» es correcto, aunque más largo.
- source_word: אֵבֽוֹשׁ
  english_pob_choice: will not be put to shame
  chosen_spanish: no me avergonzaré
  alternatives_spanish:
  - no seré avergonzado
  - no quedaré avergonzado
  lexicon: BDB
  rationale: El hebreo tiene el sentido de experimentar vergüenza o deshonra. El POB inglés opta por una pasiva de resultado; en español, «no me avergonzaré» expresa con naturalidad el mismo resultado sin perder la noción de deshonra pública. «No seré avergonzado» es más literal, pero menos idiomático; «no quedaré avergonzado» también es posible, aunque algo más perifrástico.
theological_decisions:
- issue: Lavergüenza como deshonra pública ante reyes
  english_pob_reading: will not be put to shame
  chosen_spanish_reading: no me avergonzaré
  alternative_spanish_readings:
  - no seré avergonzado
  - no quedaré avergonzado
  rationale: No hay una afirmación doctrinal compleja aquí, pero sí un matiz de honor/vergüenza público. Conservo el sentido de confianza del salmista al confesar los testimonios de Yahvé sin temor a la deshonra frente a los poderosos. La forma elegida suena natural en español y preserva la tensión de exposición pública.
  doctrine_reference: Sabiduría/poesía bíblica; tema de honor y vergüenza
translation_notes:
  revision_awareness: No se registran revisiones en el paquete de fuente ni en el resumen de cruce. La traducción sigue de cerca la lectura inglesa auditada, ajustada a una sintaxis natural en español y fiel al hebreo base.
  spanish_consistency_notes:
  - «Testimonios» se mantiene para עֵדֹת como término técnico poético consistente con el resto del salmo.
  - Se evita «SEÑOR» porque el versículo no contiene el Tetragrámaton ni un reemplazo explícito del nombre divino.
  - La primera persona singular futura en español («Hablaré», «no me avergonzaré») refleja adecuadamente el imperfectivo cohortativo del hebreo en un contexto de determinación.
