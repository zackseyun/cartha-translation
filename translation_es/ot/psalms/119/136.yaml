  text: Corrientes de lágrimas descienden de mis ojos, porque no guardan tu ley.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  english_pob_choice: Streams of tears
  chosen_spanish: Corrientes de lágrimas
  alternatives_spanish:
  - Arroyos de lágrimas
  - Torrentes de lágrimas
  lexicon: BDB/HALOT
  rationale: פַּלְגֵי מַיִם es una imagen de flujos abundantes de agua. El POB inglés opta por 'Streams of tears' para captar la metáfora sin volverla demasiado literal. 'Corrientes de lágrimas' mantiene la imagen poética en español natural; 'arroyos' o 'torrentes' son posibles, pero 'corrientes' evita una especificidad hidráulica ajena al hebreo.
- source_word: יָרְדוּ
  english_pob_choice: flow down
  chosen_spanish: descienden
  alternatives_spanish:
  - bajan
  - se derraman
  lexicon: HALOT/BDB
  rationale: El verbo expresa movimiento descendente. 'Descienden' reproduce bien la idea de caer hacia abajo y suena más sobrio que 'se derraman', que añade una imagen más libre.
- source_word: עֵינַי
  english_pob_choice: my eyes
  chosen_spanish: de mis ojos
  alternatives_spanish:
  - mis ojos
  - de mis ojos
  lexicon: BDB/HALOT
  rationale: La forma hebrea es primera persona singular. En español, 'de mis ojos' integra de modo natural el complemento dentro de la metáfora verbal.
- source_word: תוֹרָתֶךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se conserva la elección auditada del POB inglés 'law' como 'ley', que es el equivalente más establecido en español para esta serie del Salmo 119. 'Instrucción' y 'enseñanza' quedan como alternativas semánticas legítimas, pero 'ley' mantiene la consistencia del pasaje.
theological_decisions:
- issue: 'Objeto del lamento: desobediencia humana a la Torá divina'
  english_pob_reading: because people do not keep your law
  chosen_spanish_reading: porque no guardan tu ley
  alternative_spanish_readings:
  - porque no guardan tu instrucción
  - porque no obedecen tu ley
  rationale: El hebreo usa una negación con שָׁמַר ('guardar, observar, cumplir'). 'No guardan' refleja el vínculo entre obediencia y preservación fiel. Se evita expandir 'people' explícitamente para no introducir una especificación no presente en el hebreo breve del verso.
  doctrine_reference: Psalm 119:136; covenant obedience to Yahvé's revealed word
translation_notes:
  revision_awareness: El borrador anterior falló porque incluía un marcador de nota no anclado en el texto. Esta versión elimina todas las notas para cumplir la validación y conserva la lectura poética y auditada del POB inglés.
  spanish_consistency_notes:
  - Se mantiene 'ley' para תּוֹרָה en coherencia con la práctica del POB inglés y con el resto del salmo cuando el término funciona como designación resumida de la revelación divina.
  - Se conserva un registro poético sobrio, evitando modernizaciones excesivas o explicaciones intrusas.
  - La puntuación reproduce una sola cláusula causal clara, acorde con la sintaxis del verso.
