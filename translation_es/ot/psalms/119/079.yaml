translation:
  language: es
  text: Vuelvan a mí los que te temen, para que conozcan tus testimonios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ לִי
  english_pob_choice: Let ... turn to me
  chosen_spanish: Vuelvan a mí
  alternatives_spanish:
  - Que se vuelvan a mí
  - Retornen a mí
  lexicon: H7725 + preposición ל + pronombre 1cs
  rationale: El verbo hebreo indica volver/retornar; en español, "vuelvan a mí" conserva bien el valor direccional y exhortativo sin añadir un objeto ausente. "Retornen" es posible, pero suena más formal y menos natural para lectura pública.
- source_word: יְרֵאֶיךָ
  english_pob_choice: those who fear you
  chosen_spanish: los que te temen
  alternatives_spanish:
  - los que te reverencian
  - los que temen de ti
  lexicon: H3373
  rationale: La raíz ירא en este contexto expresa reverencia/temor piadoso. "Temen" mantiene la correspondencia más directa y la fuerza relacional del hebreo. "Reverencian" explicita la dimensión devocional, pero debilita el vínculo lexical con el texto.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus mandatos del pacto
  lexicon: H5713b
  rationale: 'Se preserva la terminología auditada del POB en inglés: "testimonios". En español, esta opción mantiene la coherencia interna con otros salmos y evita sustituir la categoría textual por una paráfrasis interpretativa como "mandatos".'
theological_decisions:
- issue: Valor de "temer" aplicado a los fieles
  english_pob_reading: those who fear you
  chosen_spanish_reading: los que te temen
  alternative_spanish_readings:
  - los que te reverencian
  - los piadosos
  rationale: No se suaviza el temor reverente a mera admiración, porque el hebreo sostiene una postura de piedad y sumisión ante Dios. "Te temen" conserva la tensión bíblica entre reverencia y obediencia.
  doctrine_reference: Sabiduría bíblica / reverencia a Dios
translation_notes:
  revision_awareness: No se registran revisiones textuales en el paquete de fuente. La traducción sigue el texto masorético recibido y el valor lexical auditado de "testimonies" en la tradición del POB en inglés.
  spanish_consistency_notes:
  - Se mantiene el tuteo reverente coherente con el hebreo y con la voz orante del salmo.
  - '"Testimonios" se conserva como término técnico estable para עֵדוֹת.'
  - 'La estructura exhortativa del hebreo se refleja con un imperativo plural español natural: "Vuelvan".'
