lexical_decisions:
- source_word: בָּרוּךְ / Blessed
  english_pob_choice: Blessed
  chosen_spanish: Bendito
  alternatives_spanish:
  - Alabado
  - Bendecido
  lexicon: HALOT
  rationale: El hebreo expresa una proclamación de bendición/presentación de honor a Dios; en español, «Bendito eres tú» reproduce con naturalidad el valor doxológico sin introducir una paráfrasis más amplia.
- source_word: יְהוָה / Yahweh
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: DOCTRINE.md / nombre divino auditado
  rationale: Se conserva el nombre divino como nombre propio, siguiendo la política del proyecto de no ocultar יהוה bajo una mayúscula reverencial. «Yahvé» es la forma española establecida para el nombre divino.
- source_word: לַמְּדֵנִי / teach me
  english_pob_choice: teach me
  chosen_spanish: enséñame
  alternatives_spanish:
  - instrúyeme
  - muéstrame cómo
  lexicon: HALOT
  rationale: El causativo implora enseñanza directa. «Enséñame» es la forma española más natural y precisa; mantiene el ruego personal del salmista sin suavizarlo.
- source_word: חֻקֶּיךָ / your statutes
  english_pob_choice: statutes
  chosen_spanish: tus estatutos
  alternatives_spanish:
  - tus decretos
  - tus prescripciones
  lexicon: HALOT
  rationale: Se preserva la terminología auditada del POB inglés. «Estatutos» comunica bien la idea de disposiciones fijadas y mantiene coherencia terminológica con otras ocurrencias de חֹק/חֻקִּים.
theological_decisions:
- issue: Uso del nombre divino en lugar de una sustitución litúrgica
  english_pob_reading: Yahweh
  chosen_spanish_reading: Yahvé
  alternative_spanish_readings:
  - el SEÑOR
  - Jehová
  rationale: La lectura auditable del POB trata יְהוָה como nombre propio y no como título. En español se refleja con «Yahvé», evitando el enmascaramiento devocional y preservando la tensión entre reverencia y nominación explícita.
  doctrine_reference: DOCTRINE.md / tratamiento del nombre divino
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la versión española sigue de cerca la lectura hebrea y la decisión auditada del inglés POB.
  spanish_consistency_notes:
  - Se usa «Yahvé» para יְהוָה de manera consistente con la política del proyecto.
  - «Estatutos» mantiene la equivalencia terminológica con la serie legal de חֹק/חֻקִּים.
  - La construcción «Bendito eres tú» conserva el orden y tono de alabanza del hebreo sin añadir elementos interpretativos.
