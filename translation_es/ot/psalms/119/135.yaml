lexical_decisions:
- source_word: פָּנֶי/ךָ הָאֵ֣ר
  english_pob_choice: Make your face shine
  chosen_spanish: Haz resplandecer tu rostro
  alternatives_spanish:
  - Haz brillar tu rostro
  - Haz que tu rostro resplandezca
  lexicon: HALOT
  rationale: El hebreo usa el verbo הָאֵר, de la raíz de ‘hacer brillar / iluminar’, con ‘tu rostro’ como sujeto de la imagen. ‘Haz resplandecer tu rostro’ mantiene la metáfora sin volverla más interpretativa de lo que permite el texto. ‘Rostro’ conserva el antropomorfismo reverente del original y coincide con el valor literal del inglés auditado.
- source_word: בְּעַבְדֶּךָ
  english_pob_choice: upon your servant
  chosen_spanish: sobre tu siervo
  alternatives_spanish:
  - sobre tu siervo fiel
  - sobre tu siervo
  lexicon: HALOT
  rationale: ‘Siervo’ sigue el valor proyectado por el audit trail y mantiene el matiz de pertenencia y dependencia sin adoptar ‘esclavo’ como forma principal. ‘Sobre’ reproduce la preposición relacional del hebreo en un español natural y digno.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_spanish: estatutos
  alternatives_spanish:
  - decretos
  - prescripciones
  lexicon: HALOT
  rationale: Se conserva ‘estatutos’ porque el audit trail inglés lo fijó así y porque en español comunica bien la idea de normas establecidas y prescritas. Se mantienen como alternativas ‘decretos’ y ‘prescripciones’, pero ‘estatutos’ resulta la opción más estable y reconocible para esta serie.
translation_notes:
  revision_awareness: No se registran revisiones previas ni variantes textuales aplicadas en el paquete fuente; la redacción sigue de cerca el hebreo masorético y el rastro auditado en inglés.
  spanish_consistency_notes:
  - Se mantiene el paralelismo imperativo de dos miembros.
  - Se conserva el tratamiento directo de segunda persona singular.
  - No se añadió una nota textual porque el paquete no documenta variantes ni tensiones léxicas adicionales.
