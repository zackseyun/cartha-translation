translation:
  language: es
  text: Tuyo soy yo; sálvame, porque he buscado tus preceptos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ / אֲנִי
  english_pob_choice: I am yours
  chosen_spanish: Tuyo soy yo
  alternatives_spanish:
  - Soy tuyo
  - Te pertenezco
  lexicon: WLC + POB audit trail
  rationale: El hebreo expresa pertenencia/pacto de modo enfático. 'Tuyo soy yo' conserva la relación directa y el tono confesional del original sin introducir una formulación más interpretativa que 'te pertenezco'.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_spanish: sálvame
  alternatives_spanish:
  - líbrame
  - rescátame
  lexicon: BDB/HALOT
  rationale: El verbo הוֹשִׁיעַ tiene el sentido de salvar/liberar de peligro. 'Sálvame' es el equivalente más directo y natural en español, y mantiene la petición breve del verso.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - órdenes
  - mandatos
  - encargos
  lexicon: HALOT
  rationale: La POB inglesa distinguió פִקּוּדִים con 'precepts' para no mezclarlo con 'statutes' o 'commandments'. 'Preceptos' conserva esa distinción en español y suena bíblico sin volverse arcaico.
- source_word: דָרַשְׁתִּי
  english_pob_choice: I have sought
  chosen_spanish: he buscado
  alternatives_spanish:
  - he procurado
  - he indagado
  lexicon: BDB/HALOT
  rationale: דרשׁ puede implicar buscar con diligencia, inquirir o acudir en búsqueda. Aquí, con 'preceptos' como objeto, 'he buscado' comunica bien la acción perseverante y evita sobretraducir a un matiz puramente intelectual.
translation_notes:
  revision_awareness: No se registran revisiones previas ni notas textuales en el paquete fuente; la traducción sigue directamente el hebreo masorético apoyada por la decisión léxica inglesa ya auditada.
  spanish_consistency_notes:
  - Se mantuvo 'preceptos' para פִקּוּדִים a fin de preservar coherencia terminológica con otros salmos y evitar mezclarlo con 'mandamientos' o 'estatutos'.
  - Se evitó 'SEÑOR' porque este versículo no contiene el Tetragrámaton ni una cita explícita que requiera esa convención.
  - El español conserva un orden natural sin añadir elementos ausentes del hebreo.
