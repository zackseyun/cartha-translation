translation:
  language: es
  text: Tu promesa es totalmente probada, y tu siervo la ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְרוּפָה
  english_pob_choice: well tried
  chosen_spanish: totalmente probada
  alternatives_spanish:
  - bien probada
  - refinada
  - purificada
  lexicon: BDB/HALOT
  rationale: La forma pasiva de צָרַף expresa el sentido de haber sido examinada por fuego o prueba; en español, 'totalmente probada' comunica la intensidad de 'well tried' sin perder la idea de prueba/refinamiento. 'Purificada' sería posible, pero desplaza el énfasis hacia pureza más que hacia verificación por prueba.
- source_word: אִמְרָתְךָ
  english_pob_choice: promise
  chosen_spanish: promesa
  alternatives_spanish:
  - palabra
  - dicho
  - decir
  lexicon: HALOT
  rationale: La POB inglesa ya documenta que אִמְרָה en este salmo funciona como la palabra comprometida de Yahvé; 'promesa' preserva ese valor pactal y evita confundirla con דָּבָר ('palabra').
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: BDB
  rationale: '''Siervo'' conserva el vínculo de servicio y dependencia reverente que la POB prefiere para δοῦλος/עֶבֶד, sin introducir ''esclavo'' como término principal.'
- source_word: אֲהֵבָהּ
  english_pob_choice: loves it
  chosen_spanish: la ama
  alternatives_spanish:
  - la ama profundamente
  - la quiere
  lexicon: HALOT
  rationale: El verbo אהב aquí expresa amor/afección hacia la promesa; en español 'la ama' es natural y mantiene el objeto femenino singular implícito en 'promesa'.
theological_decisions:
- issue: Naturaleza de la 'promesa' divina en un salmo de la Torá
  english_pob_reading: Your promise is well tried
  chosen_spanish_reading: Tu promesa es totalmente probada
  alternative_spanish_readings:
  - Tu palabra es totalmente probada
  - Tu dicho es totalmente probado
  rationale: La lectura de la POB entiende אִמְרָה como una promesa comprometida de Yahvé, no como mera información. 'Promesa' permite conservar esa carga teológica y relacional para el lector español.
  doctrine_reference: Fidelidad de Dios a su palabra/promesa (cf. Sal 119:140)
translation_notes:
  revision_awareness: Se ha seguido el audit trail inglés de POB, conservando la distinción de אִמְרָה como 'promise' y evitando la neutralización hacia 'palabra' salvo como alternativa documentada. No hay revisiones aplicadas en el paquete fuente.
  spanish_consistency_notes:
  - Se mantiene 'siervo' como término POB para עֶבֶד.
  - No se introduce 'SEÑOR' como máscara; el verso no contiene el nombre divino explícito.
  - 'La traducción conserva la simplicidad sintáctica del hebreo: una cláusula nominal seguida de una segunda cláusula coordinada.'
