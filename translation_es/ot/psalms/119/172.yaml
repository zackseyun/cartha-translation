translation:
  language: es
  text: Mi lengua cantará de tu promesa, porque todos tus mandamientos son rectos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_spanish: promesa
  alternatives_spanish:
  - palabra
  - dicho
  - decir
  lexicon: HALOT
  rationale: La POB inglesa entiende אִמְרָה aquí como una palabra comprometida de Dios, no como דָּבָר en sentido general. En español, «promesa» comunica mejor ese valor de palabra empeñada que «palabra», que sería demasiado amplio y podría diluir la fuerza del término en este salmo.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_spanish: mandamientos
  alternatives_spanish:
  - mandato
  - órdenes
  - preceptos
  lexicon: HALOT
  rationale: Para mantener la serie habitual del salmo y conservar el carácter autoritativo del término, se usa «mandamientos». «Preceptos» y «mandatos» son posibles, pero «mandamientos» coincide mejor con el registro bíblico y con la decisión auditada en inglés.
- source_word: צֶּדֶק
  english_pob_choice: righteous
  chosen_spanish: rectos
  alternatives_spanish:
  - justos
  - rectitud
  lexicon: HALOT
  rationale: El predicado hebreo describe la cualidad de las leyes de Dios. En español, «rectos» funciona de modo natural y preserva la idea de conformidad correcta sin introducir una formulación más abstracta como «justicia» o más interpretativa como «justos».
- source_word: לְשׁוֹנִי
  english_pob_choice: My tongue
  chosen_spanish: Mi lengua
  alternatives_spanish:
  - mi boca
  - mi labios
  lexicon: BDB/HALOT
  rationale: Se mantiene la imagen corporal concreta del hebreo. «Lengua» es el equivalente directo y conserva el paralelismo poético con el acto de cantar o declarar.
translation_notes:
  revision_awareness: La redacción sigue la lectura auditada del POB en inglés para אִמְרָה como «promise» y מִצְוֹת como «commandments», sin añadir notas textuales porque no hay variantes ni tensiones documentadas en este versículo.
  spanish_consistency_notes:
  - 'Se conserva la primera persona singular del hebreo: «Mi lengua».'
  - Se mantiene el paralelismo causal con «porque».
  - No se introduce lenguaje eclesiástico ajeno al texto; la frase final queda en estilo sobrio y bíblico.
  - «Rectos» traduce el predicado final sin forzar una abstracción doctrinal.
