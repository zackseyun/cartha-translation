review_pass:
  verdict: revise
  source_alignment_summary: 'La primera cláusula refleja adecuadamente el desiderativo יְהִי, לִבִּי («mi corazón»), תָמִים («íntegro») y בְּחֻקֶּיךָ («en tus estatutos»). Sin embargo, אֵבוֹשׁ es un imperfecto qal de primera persona singular: «yo no me avergonzaré / no quedaré avergonzado». La redacción actual deja el sujeto de «sea avergonzado» ambiguamente ligado a «mi corazón» y lo presenta como pasivo.'
  spanish_quality_summary: «Sea mi corazón íntegro» es una formulación digna y comprensible, aunque «Que mi corazón sea íntegro» expresa más claramente la súplica en español actual. La revisión explicita el sujeto de la cláusula final y emplea «quede avergonzado», una expresión natural que comunica el desenlace de vergüenza sin atribuir erróneamente la acción a un agente externo.
  glossary_alignment: '«Corazón», «íntegro» y «estatutos» concuerdan con las decisiones léxicas documentadas y con el registro bíblico en español. No se requieren notas al pie: el inglés no conserva una alternativa mediante nota y la revisión no introduce una ambigüedad nueva.'
  issues:
  - severity: medium
    issue: La cláusula final no expresa claramente la primera persona de אֵבוֹשׁ.
    rationale: «Para que no sea avergonzado» puede tomar «mi corazón» como su sujeto gramatical y usa una pasiva que no corresponde directamente al qal de primera persona. «Para que yo no quede avergonzado» conserva la referencia del hablante y el sentido de no sufrir vergüenza.
  revised_spanish_text: Que mi corazón sea íntegro en tus estatutos, para que yo no quede avergonzado.
  revision_rationale: Se explicita el sujeto de primera persona en la cláusula de propósito y se reemplaza la pasiva ambigua por «quede avergonzado», que representa con naturalidad el valor intransitivo/resultativo de בושׁ. También se adopta «Que» para hacer transparente el matiz desiderativo de יְהִי.
