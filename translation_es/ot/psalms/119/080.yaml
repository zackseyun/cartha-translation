translation:
  language: es
  text: Sea mi corazón íntegro en tus estatutos, para que no sea avergonzado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_spanish: mi corazón
  alternatives_spanish:
  - mi interior
  - mi ser
  lexicon: BDB 3820 / HALOT לֵב
  rationale: «Corazón» conserva el centro interior de pensamiento, voluntad y afecto que el hebreo לֵב puede abarcar. «Mi interior» sería posible, pero menos directo y menos consistente con el registro bíblico-poético.
- source_word: תָמִים
  english_pob_choice: blameless
  chosen_spanish: íntegro
  alternatives_spanish:
  - irreprensible
  - sin culpa
  - perfecto
  lexicon: BDB 8549 / HALOT תָּמִים
  rationale: «Íntegro» comunica integridad, totalidad y rectitud moral sin sugerir una perfección abstracta o sin matiz. «Irreprensible» y «sin culpa» son viables, pero desplazan el énfasis hacia juicio externo; «perfecto» puede sonar excesivo en español contemporáneo.
- source_word: בְּחֻקֶּיךָ
  english_pob_choice: in your statutes
  chosen_spanish: en tus estatutos
  alternatives_spanish:
  - en tus decretos
  - según tus estatutos
  - en tus prescripciones
  lexicon: HALOT חֹק / חֻקִּים
  rationale: Se mantiene «estatutos» como en el POB inglés, porque el campo semántico de חֹק apunta a disposiciones fijadas o prescritas. «Decretos» y «prescripciones» son alternativas posibles, pero «estatutos» suena más estable y bíblicamente reconocible en español.
- source_word: אֵבֹושׁ
  english_pob_choice: be put to shame
  chosen_spanish: sea avergonzado
  alternatives_spanish:
  - quede avergonzado
  - no tenga vergüenza
  - sea confundido
  lexicon: BDB 954 / HALOT בּוֹשׁ
  rationale: La forma pasiva «sea avergonzado» refleja bien el resultado social y moral del verbo בושׁ. «Quede avergonzado» también es posible, pero «sea avergonzado» conserva mejor la pasividad implícita en la oración.
theological_decisions:
- issue: Relación entre integridad interior y obediencia pactual
  english_pob_reading: May my heart be blameless in your statutes, that I may not be put to shame.
  chosen_spanish_reading: Sea mi corazón íntegro en tus estatutos, para que no sea avergonzado.
  alternative_spanish_readings:
  - Que mi corazón sea irreprensible en tus estatutos
  - Que mi interior sea íntegro conforme a tus estatutos
  rationale: El versículo une una petición de integridad interior con la consecuencia pactual de no ser avergonzado. La traducción mantiene esa relación sin intensificarla ni moralizarla más allá del hebreo.
  doctrine_reference: Salmo 119; integridad delante de Dios y resultado de no quedar en vergüenza
- issue: Modo exhortativo/suplicatorio del verbo inicial
  english_pob_reading: May my heart...
  chosen_spanish_reading: Sea mi corazón...
  alternative_spanish_readings:
  - Que mi corazón sea...
  - Ojalá mi corazón sea...
  rationale: El hebreo יְהִי expresa un deseo/súplica. En español, «Sea mi corazón...» conserva el tono desiderativo con brevedad poética; «Que mi corazón sea...» también sería posible, pero un poco más perifrástico.
  doctrine_reference: Salmo 119:80; forma optativa de súplica
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; la propuesta sigue el texto WLC y la lectura auditada del POB inglés sin cambios textuales adicionales.
  spanish_consistency_notes:
  - Se mantiene «estatutos» para בְּחֻקֶּיךָ, coherente con la decisión lexical inglesa documentada.
  - Se usa «Yahvé» solo cuando aparezca el Tetragrámaton; este versículo no lo contiene.
  - No se introduce terminología doctrinal ajena al poema hebreo; el verbo final se traduce en pasiva impersonal para respetar la relación con אֵבֹושׁ.
