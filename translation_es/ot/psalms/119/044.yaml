  text: Guardaré tu ley continuamente, por siempre y para siempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶשְׁמְרָה
  english_pob_choice: I will keep
  chosen_spanish: Guardaré
  alternatives_spanish:
  - guardaré
  - observaré
  - cumpliré
  lexicon: HALOT
  rationale: El verbo expresa guardar/observar con fidelidad. «Guardaré» comunica bien la intención de conservar y cumplir la ley en español natural y mantiene el valor voluntativo del imperfecto cohortativo.
- source_word: תוֹרָתְךָ
  english_pob_choice: your law
  chosen_spanish: tu ley
  alternatives_spanish:
  - tu instrucción
  - tu enseñanza
  lexicon: HALOT
  rationale: Se conserva «ley» por la decisión auditada en inglés y por su consistencia en el salmo, aunque תורה también puede ser «instrucción» o «enseñanza». En español, «tu ley» es claro, bíblico y fiel al término del pacto.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_spanish: continuamente
  alternatives_spanish:
  - siempre
  - sin cesar
  lexicon: HALOT
  rationale: El adverbio indica continuidad habitual. «Continuamente» refleja esa duración sostenida sin añadir una intensidad no explícita.
- source_word: לְעוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_spanish: por siempre y para siempre
  alternatives_spanish:
  - para siempre y por siempre
  - eternamente
  lexicon: HALOT
  rationale: La duplicación hebrea intensifica la permanencia. La pareja «por siempre y para siempre» conserva el paralelismo enfático del original con español natural y reverente.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete fuente; esta redacción sigue directamente el texto hebreo y la decisión léxica auditada del inglés, manteniendo la intensificación final del hebreo con una duplicación equivalente en español.
  spanish_consistency_notes:
  - Se mantiene «ley» para תּוֹרָה conforme al criterio auditado del Salmo 119.
  - Se evita el calco rígido de la sintaxis hebrea para producir una línea natural en español sin perder el énfasis temporal del versículo.
