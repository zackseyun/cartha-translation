lexical_decisions:
- source_word: יָדְךָ
  english_pob_choice: your hand
  chosen_spanish: tu mano
  alternatives_spanish:
  - tu mano derecha
  - tu poder
  lexicon: BDB 388; HALOT 388
  rationale: מָנוֹ de Dios se expresa de forma natural como 'mano' en español; se evita añadir 'derecha' o 'poder' porque el hebreo no lo dice explícitamente. La imagen conserva el antropomorfismo bíblico sin exagerarlo.
- source_word: לְעָזְרֵנִי
  english_pob_choice: be ready to help me
  chosen_spanish: esté lista para ayudarme
  alternatives_spanish:
  - venga en mi ayuda
  - me ayude
  lexicon: BDB 740; HALOT 741
  rationale: El infinitivo con לְ expresa finalidad/función de ayuda. 'Esté lista para ayudarme' refleja la disponibilidad implícita en el hebreo y sigue el sentido dinámico del inglés POB sin perder la petición directa.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_spanish: preceptos
  alternatives_spanish:
  - mandatos
  - órdenes
  lexicon: HALOT 949
  rationale: '''Preceptos'' mantiene la distinción léxica documentada por el POB entre este término y otros vocablos legales como mandamientos o estatutos. En español es claro y conserva el registro bíblico.'
- source_word: בָחָרְתִּי
  english_pob_choice: I have chosen
  chosen_spanish: he escogido
  alternatives_spanish:
  - he elegido
  - elegí
  lexicon: BDB 103; HALOT 116
  rationale: El perfecto hebreo comunica una decisión vigente con efecto presente; 'he escogido' reproduce bien esa continuidad. 'Escogido' es natural en español bíblico y comunica una elección deliberada.
theological_decisions:
- issue: Anthropomorphic 'hand' of Yahvé
  english_pob_reading: Let your hand be ready to help me
  chosen_spanish_reading: Que tu mano esté lista para ayudarme
  alternative_spanish_readings:
  - Que tu poder me ayude
  - Que tu mano me socorra
  rationale: Se conserva la imagen concreta de la 'mano' como figura de acción y favor divinos. No se abstrae a 'poder' porque el hebreo mantiene la imagen corporal; 'ayudarme' recoge la intención salvífica sin añadir contenido doctrinal nuevo.
  doctrine_reference: Anthropomorphism in biblical language; providence and divine aid
- issue: Covenantal obedience expressed by 'precepts'
  english_pob_reading: for I have chosen your precepts
  chosen_spanish_reading: porque he escogido tus preceptos
  alternative_spanish_readings:
  - porque he elegido tus mandatos
  - pues he preferido tus órdenes
  rationale: '''Preceptos'' preserva la terminología especial del salterio y evita nivelar el vocabulario de la ley bíblica. La razón dada por el salmista es una elección obediente y deliberada, no mera preferencia estética.'
  doctrine_reference: Torah obedience; covenant fidelity
