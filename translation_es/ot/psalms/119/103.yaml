translation:
  language: es
  text: ¡Cuán dulces son tus palabras a mi paladar, más dulces que la miel a mi boca!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִּמְלְצוּ
  english_pob_choice: sweet
  chosen_spanish: dulces
  alternatives_spanish:
  - sabrosas
  - deliciosas
  - gratas
  lexicon: BDB/HALOT
  rationale: El verbo expresa un sabor agradable y exquisito; en español, 'dulces' comunica de manera
    natural el valor gustativo del hebreo sin volverse mecánico. 'Sabrosas' puede sonar más coloquial
    y 'gratas' pierde la metáfora de sabor.
- source_word: לְחִכִּי / לְפִי
  english_pob_choice: to my taste / to my mouth
  chosen_spanish: a mi paladar / a mi boca
  alternatives_spanish:
  - a mi gusto / a mi boca
  - a mi paladar / a mi lengua
  lexicon: BDB/HALOT
  rationale: 'El hebreo presenta dos imágenes sensoriales paralelas: ''paladar'' y ''boca''. ''Paladar''
    conserva bien la idea de gusto; ''boca'' mantiene la segunda imagen sin forzar un giro idiomático
    ajeno al texto.'
- source_word: אִמְרָתֶךָ
  english_pob_choice: words
  chosen_spanish: palabras
  alternatives_spanish:
  - dichos
  - promesas
  - expresiones
  lexicon: HALOT
  rationale: Como en la traducción inglesa, el contexto de sabor favorece el sentido general de 'palabras'
    o 'dichos', no específicamente 'promesas'. 'Palabras' es el término más claro y fiel para el lector
    español.
- source_word: דְּבַשׁ
  english_pob_choice: honey
  chosen_spanish: miel
  alternatives_spanish:
  - panal
  - miel silvestre
  lexicon: BDB/HALOT
  rationale: '''Miel'' es el equivalente natural y directo en español para el sustantivo hebreo; mantiene
    el contraste gustativo con ''dulces'' y es plenamente idiomático.'
theological_decisions:
- issue: La palabra divina se presenta como deleite gustativo, no solo como contenido informativo.
  english_pob_reading: How sweet are your words to my taste, sweeter than honey to my mouth!
  chosen_spanish_reading: ¡Cuán dulces son tus palabras a mi paladar, más dulces que la miel a mi boca!
  alternative_spanish_readings:
  - ¡Qué dulces son tus palabras para mi gusto, más dulces que la miel para mi boca!
  - ¡Cuán agradables son tus palabras a mi paladar, más que la miel a mi boca!
  rationale: La frase debe conservar la metáfora de placer y apetito que estructura el versículo. 'Dulces'
    y 'paladar' hacen visible que la palabra de Yahvé se experimenta como alimento deleitoso, no solo
    como enseñanza correcta.
  doctrine_reference: Salmos 19:10; Ezequiel 3:3; Jeremías 15:16
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete inglés. La redacción española
    sigue de cerca el paralelismo hebreo y mantiene la equivalencia óptima del inglés auditado sin introducir
    notas textuales adicionales.
  spanish_consistency_notes:
  - Se mantiene 'palabras' en lugar de 'promesas' por coherencia con el audit trail inglés y por el contexto
    de metáfora gustativa.
  - Se usa puntuación exclamativa para reflejar el tono admirativo del hebreo y de la versión inglesa.
  - No se introduce 'SEÑOR'; el versículo no contiene el Tetragrámaton en el texto fuente.
