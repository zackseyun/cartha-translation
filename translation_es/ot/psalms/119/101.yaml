  text: Retengo mis pies de todo camino malo, para guardar tu palabra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכָּל אֹרַח רָע
  english_pob_choice: every evil way
  chosen_spanish: todo camino malo
  alternatives_spanish:
  - todo sendero malo
  - toda senda mala
  lexicon: HALOT / BDB
  rationale: אֹרַח es una vía o camino; en español, "camino" comunica bien la imagen y mantiene naturalidad. רָע se conserva como "malo" para la cualidad moral del camino, sin introducir una paraphrase más fuerte que la del hebreo.
- source_word: כָּלִיתִי רַגְלַי
  english_pob_choice: I hold back my feet
  chosen_spanish: Retengo mis pies
  alternatives_spanish:
  - Reprimo mis pies
  - Aparto mis pies
  lexicon: HALOT
  rationale: כָּלִיתִי expresa contención o restricción; "retengo" reproduce la acción de frenar/contener de manera idiomática en español. "Mis pies" conserva la metonimia hebrea para la conducta o el andar.
- source_word: לְמַעַן
  english_pob_choice: in order to
  chosen_spanish: para
  alternatives_spanish:
  - a fin de
  - con el propósito de
  lexicon: HALOT
  rationale: La finalidad queda clara y natural con "para"; mantiene el valor de propósito sin sobrecargar el verso.
- source_word: דְּבָרֶךָ
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu palabra dicha
  - tu dicho
  lexicon: HALOT
  rationale: Se mantiene "palabra" como renderización consistente de דָּבָר cuando refiere al dicho divino. En español, "tu palabra" es transparente y conserva el vínculo con la obediencia del salmista.
