translation:
  language: es
  text: Trata[a] generosamente a tu siervo, para que yo viva y guarde tu palabra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hebreo, los versículos 17–24 comienzan con gimel (ג), la tercera letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: גְּמֹל / Deal bountifully
  english_pob_choice: Deal bountifully
  chosen_spanish: Trata con bondad
  alternatives_spanish:
  - Haz bien
  - Muestra favor abundantemente
  - Trata generosamente
  lexicon: HALOT / uso contextual del verbo גמל
  rationale: El hebreo pide una acción benévola o favorable hacia el siervo. En español, 'trata con bondad' comunica esa disposición benevolente sin volverlo demasiado idiomático ni introducir una lectura técnica que el contexto no exige. 'Haz bien' sería posible, pero puede sonar más genérico; 'trata con bondad' mantiene mejor la relación personal del ruego.
- source_word: עַבְדְּךָ / your servant
  english_pob_choice: your servant
  chosen_spanish: tu siervo
  alternatives_spanish:
  - tu servidor
  - tu esclavo
  lexicon: uso bíblico de עבד
  rationale: POB mantiene 'servant' y el español bíblico natural es 'siervo'. 'Servidor' suena más moderno pero menos reverente en este registro; 'esclavo' preservaría una tensión semántica, pero no es la forma principal solicitada para el texto lector y endurecería innecesariamente el verso.
- source_word: דְבָרֶךָ / your word
  english_pob_choice: your word
  chosen_spanish: tu palabra
  alternatives_spanish:
  - tu dicho
  - tu promesa
  - tu mensaje
  lexicon: HALOT
  rationale: El léxico hebreo דָּבָר se conserva como 'palabra' en la POB inglesa; en español, 'palabra' es la equivalencia más directa y permite mantener la distinción con otros términos de promesa o dicho. No se prefiere 'promesa' porque aquí el término auditado es general y el contexto inmediato habla de obedecer lo pronunciado por Dios.
theological_decisions:
- issue: Relación entre vida y obediencia
  english_pob_reading: that I may live and keep your word
  chosen_spanish_reading: para que yo viva y guarde tu palabra
  alternative_spanish_readings:
  - para que viva y guarde tu palabra
  - para vivir y guardar tu palabra
  rationale: 'Se conserva la finalidad explícita del hebreo y de la POB: la petición de vida está orientada a la obediencia. ''Para que yo viva'' mantiene el matiz de súplica personal; ''guarde'' conserva el lenguaje de observancia, no solo de recuerdo o respeto.'
  doctrine_reference: Salmo 119:17; cf. el vínculo bíblico entre vida y caminar en obediencia
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el contexto inglés; se mantiene la misma lectura auditada sin cambios textuales relevantes.
  spanish_consistency_notes:
  - Se conserva 'palabra' para דָּבָר, en continuidad con la decisión inglesa auditada.
  - '''Siervo'' se usa como término bíblico lector, evitando ''esclavo'' en el texto principal.'
  - La nota del acróstico se ancla en el marcador [a] siguiendo la convención del POB y la instrucción de marcadores únicos.
