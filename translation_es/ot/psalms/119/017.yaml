review_pass:
  verdict: revise
  source_alignment_summary: El hebreo pide que Dios actúe favorablemente hacia su siervo (גמל על), con la finalidad expresada por los cohortativos de que el salmista viva y guarde la palabra divina. «Tu siervo», «viva», «guarde» y «tu palabra» reflejan adecuadamente עבדך, אחיה, ואשמרה y דברך. Sin embargo, «trata con bondad» atenúa el matiz de generosidad o abundancia presente en גמל y en la traducción inglesa auditada («Deal bountifully»).
  spanish_quality_summary: El español es claro, digno y natural. La nota del acróstico está bien traducida y correctamente anclada. Se recomienda un ajuste breve en el verbo inicial para expresar con mayor precisión la generosidad solicitada, sin perder fluidez.
  glossary_alignment: «Siervo» concuerda con la terminología POB para עבד; «palabra» conserva la decisión auditada para דבר y mantiene su distinción de términos como «promesa». No hay cuestión teológica ni terminológica adicional.
  issues:
  - severity: medium
    issue: Atenuación de גמל en «Trata con bondad».
    rationale: Aunque la frase es posible, puede significar simplemente trato amable. En este contexto, גמל על comunica tratar generosamente o hacer bien de manera abundante; «Trata generosamente» preserva mejor ese alcance y la elección inglesa «Deal bountifully».
  revised_spanish_text: Trata[a] generosamente a tu siervo, para que yo viva y guarde tu palabra.
