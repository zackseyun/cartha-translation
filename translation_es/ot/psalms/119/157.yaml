  text: Muchos son mis perseguidores y mis enemigos; pero no me he apartado de tus testimonios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_spanish: Muchos
  alternatives_spanish:
  - Numerosos
  - Son muchos
  lexicon: WLC/HALOT
  rationale: El hebreo destaca cantidad abundante; «Muchos» reproduce de forma natural y fiel el énfasis cuantitativo sin añadir matices no presentes.
- source_word: רֹדְפַי
  english_pob_choice: my persecutors
  chosen_spanish: mis perseguidores
  alternatives_spanish:
  - los que me persiguen
  - mis opresores
  lexicon: HALOT
  rationale: El participio de רָדַף expresa persecución activa; «perseguidores» mantiene el sentido relacional y la fuerza hostil con buena naturalidad en español.
- source_word: וְצָרָי
  english_pob_choice: my foes
  chosen_spanish: mis enemigos
  alternatives_spanish:
  - mis adversarios
  - mis contrarios
  lexicon: HALOT
  rationale: צַר / צָרִים designa enemigos o adversarios. «Enemigos» es la opción más clara y directa en español, coherente con el paralelismo poético.
- source_word: מֵעֵדְוֺתֶיךָ
  english_pob_choice: your testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus estipulaciones del pacto
  lexicon: HALOT
  rationale: Se conserva la decisión auditada del POB de traducir עֵדוֹת/עֵדְוֹת como «testimonios» para mantener la distinción con los demás sinónimos de la Torá en Salmo 119 y reflejar el sentido de testimonio solemne de Dios.
- source_word: לֹא נָטִיתִי
  english_pob_choice: I do not turn away
  chosen_spanish: no me aparto
  alternatives_spanish:
  - no me desvío
  - no me he desviado
  lexicon: WLC/HALOT
  rationale: נָטָה puede significar inclinarse, apartarse o desviarse. En este contexto, «no me aparto» comunica de manera idiomática la persistencia fiel del hablante sin forzar una temporalidad no explicitada.
theological_decisions:
- issue: Fidelidad perseverante frente a oposición
  english_pob_reading: but I do not turn away from your testimonies
  chosen_spanish_reading: pero no me aparto de tus testimonios
  alternative_spanish_readings:
  - pero no me desvío de tus testimonios
  - pero sigo fiel a tus testimonios
  rationale: La línea final expresa perseverancia obediente pese a persecución. «No me aparto» preserva el contraste del verso y la idea de fidelidad continuada sin sobreexplicar la dimensión moral.
  doctrine_reference: Perseverancia en la obediencia y fidelidad a la revelación divina
- issue: Lenguaje del pacto en עֵדוֹת
  english_pob_reading: testimonies
  chosen_spanish_reading: testimonios
  alternative_spanish_readings:
  - decretos
  - estipulaciones
  rationale: Se mantiene «testimonios» porque el audit trail del POB lo usa de forma consistente para esta serie de vocablos del Salmo 119 y porque el término conserva el matiz de palabra-testimonio divina sin fusionarlo con otros términos legales.
  doctrine_reference: Revelación pactal y autoridad del testimonio divino
translation_notes:
  revision_awareness: No hay revisiones aplicadas en el paquete fuente; la traducción sigue el texto masorético provisto y la decisión léxica auditada del POB para עֵדוֹת.
  spanish_consistency_notes:
  - Se mantuvo «testimonios» para עֵדוֹת siguiendo el criterio auditado del POB.
  - Se evitó «SEÑOR» porque el verso no contiene el nombre divino explícito.
  - La sintaxis española conserva el paralelismo hebreo con una única cláusula adversativa final.
