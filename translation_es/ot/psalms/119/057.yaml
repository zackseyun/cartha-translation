translation:
  language: es
  text: Yahvé[a] es mi porción; he prometido guardar tus palabras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hebreo, los versículos 57–64 comienzan con heth (ח), la octava letra del alfabeto, continuando el acróstico iniciado en el versículo 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_spanish: Yahvé
  alternatives_spanish:
  - el SEÑOR
  - Jehová
  lexicon: HALOT
  rationale: Se preserva el nombre divino como nombre propio, no como sustituto reverencial. 'Yahvé' es el equivalente español más extendido en registros bíblicos y mantiene la decisión auditable del POB de no ocultar el tetragrámaton.
- source_word: חֶלְקִי
  english_pob_choice: my portion
  chosen_spanish: mi porción
  alternatives_spanish:
  - mi herencia
  - mi parte
  lexicon: HALOT
  rationale: '''Porción'' conserva la metáfora de asignación/lotación hereditaria que el hebreo permite, sin desplazarse a una interpretación más explicativa que el texto no exige.'
- source_word: אָמַרְתִּי
  english_pob_choice: I have promised
  chosen_spanish: he prometido
  alternatives_spanish:
  - he dicho
  - dije
  lexicon: HALOT
  rationale: El contexto no es solo hablar, sino una declaración vinculante ante Dios. 'He prometido' reproduce el valor comprometedor que el POB expresa con 'promised'.
- source_word: לִשְׁמֹר
  english_pob_choice: to keep
  chosen_spanish: guardar
  alternatives_spanish:
  - obedecer
  - cumplir
  lexicon: HALOT
  rationale: '''Guardar'' es el correlato bíblico natural para שׁמר cuando significa observar fielmente mandamientos/palabras; evita reducirlo a mera conservación intelectual.'
- source_word: דְּבָרֶיךָ
  english_pob_choice: your words
  chosen_spanish: tus palabras
  alternatives_spanish:
  - tus palabras dichas
  - tu palabra
  lexicon: HALOT
  rationale: Se mantiene el plural del hebreo ('palabras') en lugar de singularizar a 'tu palabra'. El POB distingue este término de otras palabras de promesa; en español conviene conservar esa distinción.
theological_decisions:
- issue: Nombre divino y registro reverencial
  english_pob_reading: Yahweh[a] ...
  chosen_spanish_reading: Yahvé[a] ...
  alternative_spanish_readings:
  - el SEÑOR ...
  - Jehová ...
  rationale: Se sigue la política del POB de traducir el nombre divino como nombre propio. 'Yahvé' evita la sustitución litúrgica de 'SEÑOR' y refleja mejor la intención del texto fuente.
  doctrine_reference: DOCTRINE.md / tetragrámaton como nombre propio
- issue: Relación entre 'he prometido' y 'guardar tus palabras'
  english_pob_reading: I have promised to keep your words.
  chosen_spanish_reading: he prometido guardar tus palabras.
  alternative_spanish_readings:
  - he dicho que guardaré tus palabras.
  - me comprometí a guardar tus palabras.
  rationale: El hebreo admite una simple locución de decir, pero en este contexto sapiencial/devocional se entiende como compromiso. 'He prometido' preserva ese peso sin añadir contenido doctrinal extra.
  doctrine_reference: Sentido pragmático del verbo אָמַר en contexto de voto/compromiso
- issue: Plural de 'palabras'
  english_pob_reading: your words
  chosen_spanish_reading: tus palabras
  alternative_spanish_readings:
  - tu palabra
  rationale: Conservar el plural evita homogeneizar el término con otros pasajes donde aparece singular y mantiene la textura del hebreo, que aquí usa דְּבָרִים en forma plural poseída.
  doctrine_reference: Distinción léxica bíblica entre דָּבָר y otras formas de 'palabra'
translation_notes:
  revision_awareness: No se reportan revisiones aplicadas en el paquete de origen; esta versión mantiene la lectura base del POB inglés y ajusta la expresión al español conservando el nombre divino, la metáfora de 'porción' y el plural 'palabras'.
  spanish_consistency_notes:
  - Se usa 'Yahvé' consistentemente para יְהוָה.
  - Se conserva la metáfora 'mi porción' en vez de interpretaciones explicativas.
  - '''Guardar'' se emplea como equivalente bíblico estable de שׁמר.'
  - Se mantiene el plural 'tus palabras' para reflejar el hebreo y la distinción léxica del POB.
