translation:
  language: es
  text: Cuando considero mis caminos, vuelvo mis pies hacia tus testimonios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  english_pob_choice: think on
  chosen_spanish: considero
  alternatives_spanish:
  - pienso en
  - reflexiono sobre
  - medito en
  lexicon: HALOT
  rationale: El verbo hebreo expresa evaluar, calcular o considerar; «considero» reproduce bien esa idea de examen mental sin sonar mecánico en español.
- source_word: דְרָכָי
  english_pob_choice: ways
  chosen_spanish: mis caminos
  alternatives_spanish:
  - mis sendas
  - mis caminos de vida
  - mis acciones
  lexicon: HALOT
  rationale: «Caminos» conserva la metáfora moral y conductual del hebreo, con el posesivo explícito para naturalidad en español.
- source_word: וָאָשִׁיבָה
  english_pob_choice: I turn
  chosen_spanish: vuelvo
  alternatives_spanish:
  - dirijo de nuevo
  - hago volver
  - giro
  lexicon: HALOT
  rationale: La forma verbal con valor de movimiento de regreso o retorno se expresa de modo natural con «vuelvo», que mantiene la imagen de reorientación.
- source_word: רַגְלַי
  english_pob_choice: my feet
  chosen_spanish: mis pies
  alternatives_spanish:
  - mis pasos
  - mis piernas
  lexicon: HALOT
  rationale: «Pies» sigue de cerca el hebreo y mantiene la imagen concreta de dirección y conducta.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_spanish: tus testimonios
  alternatives_spanish:
  - tus decretos
  - tus mandamientos del pacto
  - tu testimonio
  lexicon: HALOT
  rationale: Se conserva el término tradicional de la auditoría inglesa («testimonies») para reflejar la fuerza de עֵדֹת como designación de las declaraciones normativas y recordatorias de Yahvé.
theological_decisions:
- issue: Alcance de עֵדֹתֶיךָ
  english_pob_reading: testimonies
  chosen_spanish_reading: testimonios
  alternative_spanish_readings:
  - decretos
  - mandamientos del pacto
  rationale: La lectura inglesa ya fija «testimonies» y evita una reducción jurídica; en español, «testimonios» mantiene la referencia a las declaraciones de Yahvé sin borrar la carga de pacto y advertencia presente en el plural hebreo.
  doctrine_reference: Torá como testimonio del pacto en Salmos 119; cf. Sal 119:2, 24, 88, 99, 111, 129, 144, 157, 168.
translation_notes:
  revision_awareness: No se registran revisiones aplicadas en el paquete de audición; la redacción española sigue de cerca la decisión inglesa actual sin introducir variantes textuales.
  spanish_consistency_notes:
  - Se mantuvo el verbo de orientación física/ética («vuelvo mis pies») para conservar la imagen poética del hebreo.
  - Se usó «tus testimonios» de manera consistente con la terminología auditada para עֵדֹתֶיךָ en el Salmo 119.
  - El verso quedó en un español moderno y natural, sin reemplazar la metáfora de caminos por una paráfrasis abstracta.
