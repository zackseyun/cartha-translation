  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: es
  text: Pero[a] Yahvé lanzó un gran viento sobre el mar, y hubo una gran tormenta en el mar, de modo que la nave parecía a punto de quebrarse.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «Y Yahvé lanzó un gran viento sobre el mar». La waw hebrea puede traducirse sencillamente «y»; se usa «pero» para reflejar el contraste narrativo después de la huida de Jonás.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «la nave pensó quebrarse». Es una personificación hebrea que expresa que la nave parecía estar a punto de hacerse pedazos.
    reason: lexical_alternative
