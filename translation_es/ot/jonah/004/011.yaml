  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: es
  text: ¿Y no habré de compadecerme[a] de Nínive, la gran ciudad, en la que hay más de ciento veinte mil personas que no saben distinguir entre su derecha y su izquierda[b], y muchos animales?
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O bien, «¿no habré de perdonar a Nínive?»
    reason: 'Alternativa léxica: el verbo hebreo puede expresar perdonar o preservar, además de compadecerse.'
  - marker: b
    text: La expresión «no saben distinguir entre su derecha y su izquierda» puede referirse específicamente a niños pequeños o, más en general, a personas carentes de discernimiento.
    reason: 'Lectura alternativa: el hebreo conserva ambiguo el referente de la expresión.'
