    rationale: El error de validación exige insertar el marcador en la expresión «año tras año», que es precisamente la frase explicada por la nota.
  - severity: low
    issue: La construcción «establecer entre ellos que observaran» es poco idiomática en español.
    rationale: La nominalización «establecer entre ellos la observancia de...» comunica de modo natural el establecimiento de la práctica comunitaria expresada en hebreo.
  - severity: low
    issue: «El día quince de él» resulta forzado en español moderno.
    rationale: «El día quince de ese mes» mantiene la referencia anafórica a Adar con claridad y registro formal natural.
