  source_alignment_summary: 'El texto español reproduce fielmente la secuencia hebrea: el sol y la luna entran en oscuridad (קָדָרוּ), y las estrellas retienen/retiran su propio resplandor (אָסְפוּ נָגְהָם). «Se oscurecen» comunica adecuadamente el sentido inceptivo de «se vuelven oscuras». La imagen cósmica de juicio se conserva sin imponer una interpretación literal o simbólica.'
  spanish_quality_summary: La redacción es clara, natural y digna en español. «Retiran su resplandor» conserva el sentido idiomático de la traducción principal inglesa y expresa con claridad que las estrellas dejan de brillar. Se requiere una nota para preservar la alternativa léxica significativa documentada en la auditoría inglesa.
  glossary_alignment: No intervienen los términos teológicos fijos del proyecto. «Sol», «luna», «estrellas» y «resplandor» reflejan adecuadamente שמש, ירח, כוכבים y נגהם; «resplandor» mantiene el matiz de brillo/radiancia, más específico que la mera «luz».
  issues:
  - severity: low
    issue: Falta la nota léxica sobre אָסְפוּ («recogen/reúnen»).
    rationale: La nota inglesa conserva la lectura más literal «gather in their shining» y explica su sentido contextual de retener la luz. El español debe preservar esa alternativa significativa con un marcador anclado en «resplandor».
  revised_spanish_text: El sol y la luna se oscurecen, y las estrellas retiran su resplandor[a].
  revised_footnotes: *id001
  revision_rationale: Se añade la nota léxica heredada y se ancla correctamente en el texto. La traducción principal se mantiene en sustancia, con «resplandor» como equivalente natural de נָגְהָם y con «retiran» para el sentido contextual de אָסְפוּ.
