review_pass:
  verdict: revise
  source_alignment_summary: El texto español reproduce fielmente la transición narrativa, el tratamiento «Maestro», la acción de expulsar demonios «en tu nombre», el matiz imperfectivo de «tratamos de impedírselo» y, de manera importante, «no sigue con nosotros», que refleja μεθ’ ἡμῶν como pertenencia a la compañía de los discípulos y no necesariamente como falta de seguimiento de Jesús.
  spanish_quality_summary: La redacción es natural, clara y digna en español latinoamericano. «Impedírselo» es una forma idiomática adecuada para «tratar de detenerlo». Se requiere únicamente conservar en nota la alternativa significativa documentada por la auditoría inglesa.
  glossary_alignment: «Maestro» comunica bien Ἐπιστάτα en este vocativo lucano; «demonios» corresponde a δαιμόνια; y «en tu nombre» preserva la expresión de autoridad ἐν τῷ ὀνόματί σου. No intervienen aquí los términos de Yahvé, Mesías, esclavo, arrepentimiento, carne, justicia o gracia.
  issues:
  - severity: low
    issue: Falta la nota sobre la alternativa de «no sigue con nosotros».
    rationale: La traducción principal ya conserva correctamente el valor de μεθ’ ἡμῶν, pero la auditoría inglesa preserva como alternativa significativa «no nos sigue» y explica que el griego dice más literalmente «con nosotros». La nota española debe mantener esa alternativa y su alcance narrativo-teológico.
  revised_spanish_text: 'Entonces Juan respondió: «Maestro, vimos a alguien que expulsaba demonios en tu nombre, y tratamos de impedírselo porque no sigue con nosotros[a]».'
  revised_footnotes: *id001
  revision_rationale: Se añade una nota anclada que conserva la alternativa y la explicación del valor de «con nosotros» documentadas en la auditoría inglesa. No se modifica la traducción principal, pues ya es fiel al griego y plenamente idiomática.
