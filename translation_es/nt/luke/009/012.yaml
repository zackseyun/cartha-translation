  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: es
  text: 'El día comenzó a declinar, y los doce se acercaron y le dijeron: «Despide a la multitud para que vayan a las aldeas y a los campos de alrededor, hallen alojamiento y consigan provisiones[a], porque estamos aquí en un lugar desolado[b]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «encuentren alimento». El griego ἐπισιτισμός se refiere a provisiones o suministros de comida.
    reason: lexical_alternative
  - marker: b
    text: O «un lugar desierto». El griego ἔρημος puede referirse a una zona deshabitada o escasamente habitada.
    reason: lexical_alternative
