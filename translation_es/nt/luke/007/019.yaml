  source_alignment_summary: 'El borrador reproduce el sentido de ἔπεμψεν πρὸς τὸν κύριον y de la pregunta deliberativa introducida por ἢ: se envía una consulta al Señor acerca de si él es ὁ ἐρχόμενος o si deben esperar a otro. «El que ha de venir» comunica adecuadamente la designación mesiánica, y «debemos esperar» expresa bien προσδοκῶμεν en esta pregunta.'
  spanish_quality_summary: «Envió al Señor, diciendo» resulta algo elíptico y poco natural en español moderno, pues deja sin expresar qué o a quién se envió. «Envió a preguntar al Señor» hace explícita de manera idiomática la acción implícita, sin añadir un dato material ajeno al contexto. Se debe conservar mediante nota la alternativa descriptiva que el expediente inglés documenta para ὁ ἐρχόμενος.
  glossary_alignment: κύριον se mantiene como «Señor», título cristológicamente significativo para Jesús en este contexto. ὁ ἐρχόμενος se vierte «el que ha de venir», formulación española natural que conserva su fuerza de designación mesiánica; la nota registra «el que viene» como alternativa más estrictamente descriptiva.
  issues:
  - severity: low
    issue: Construcción elíptica «Envió al Señor, diciendo»
    rationale: Aunque refleja de cerca el griego, la omisión del objeto de «envió» suena forzada en español contemporáneo. «Envió a preguntar al Señor» comunica el envío y el contenido interrogativo sin alterar el sentido.
  - severity: low
    issue: Falta la nota de alternativa para ὁ ἐρχόμενος
    rationale: El rastro de auditoría inglés conserva una alternativa relevante entre lectura titular y descriptiva. La nota española la preserva y explica la función mesiánica contextual.
