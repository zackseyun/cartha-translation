  source_alignment_summary: El griego dice que él le habló a ella y emplea el perfecto pasivo Ἀφέωνταί, que presenta el perdón como un acto cumplido con resultado vigente. «Entonces le dijo» refleja εἶπεν δὲ αὐτῇ de forma natural; «Tus pecados han sido perdonados» expresa mejor en español el perfecto pasivo que el presente simple del borrador.
  spanish_quality_summary: La redacción revisada es clara, digna y natural para el español latinoamericano. Se conserva el discurso directo y se añade una nota anclada correctamente para documentar el matiz aspectual significativo.
  glossary_alignment: «Pecados» traduce adecuadamente ἁμαρτίαι en su sentido de faltas morales. No intervienen los términos preferentes del proyecto relativos al nombre divino, Mesías, espíritu, esclavo, arrepentimiento, carne, justicia o gracia.
  issues:
