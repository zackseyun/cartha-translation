    issue: El presente simple «son perdonados» atenúa el perfecto pasivo griego y omite la alternativa aspectual preservada en la auditoría inglesa.
    rationale: 'Ἀφέωνταί es perfecto pasivo: el perdón ha sido efectuado y su resultado permanece. «Han sido perdonados» expresa directamente ese valor en español, y la nota conserva la posible formulación enfocada en el estado actual.'
  revised_spanish_text: 'Entonces le dijo: «Tus pecados han sido perdonados[a]».'
