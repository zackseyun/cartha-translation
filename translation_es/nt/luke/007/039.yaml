review_pass:
  verdict: revise
  source_alignment_summary: 'El texto reproduce adecuadamente la secuencia y el sentido griegos: el fariseo que había invitado a Jesús ve lo ocurrido, habla interiormente y formula una condición contraria a su supuesto («si ... fuera ... sabría»). «Quién y qué clase de mujer» conserva el doble énfasis de τίς καὶ ποταπή, y «lo está tocando» expresa apropiadamente el presente de ἅπτεται.'
  spanish_quality_summary: La redacción es natural, clara y digna en español. «Entonces» es una opción admisible para δέ como avance narrativo, aunque no debe entenderse como la traducción de un «ahora» temporal explícito. Se requiere añadir notas para preservar las alternativas interpretativas significativas documentadas.
  glossary_alignment: No intervienen los términos del glosario que exigen una equivalencia especializada. «Profeta», «pecadora», «fariseo» y «Jesús» (referido por pronombre) son adecuados. «Este hombre» mantiene el matiz distanciador de Οὗτος.
  issues:
  - severity: medium
    issue: Faltan las notas léxicas/interpretativas conservadas en el registro inglés.
    rationale: La distinción «quién y qué clase de» merece una nota que explicite identidad y reputación/caracterización; asimismo, ὅτι puede entenderse como contenido de lo que el fariseo sabría o como base de su juicio. Estas alternativas deben preservarse para el lector español.
  - severity: low
    issue: Los anclajes de las notas en el rastro inglés parecen invertidos respecto de su contenido.
    rationale: La nota marcada [a] en inglés trata τίς καὶ ποταπή, pero está anclada en «this»; la [b] trata ὅτι, pero está anclada en «touching him». Esto es una inconsistencia de metadatos heredados, no una razón para alterar el sentido del texto español. En la revisión española se colocan los anclajes junto a las expresiones pertinentes.
  revised_spanish_text: 'Entonces, al ver esto, el fariseo que lo había invitado se dijo a sí mismo: «Si este hombre fuera profeta, sabría quién y qué clase de mujer[a] es esta que lo está tocando, porque es pecadora[b]».'
  revised_footnotes: *id001
  revision_rationale: Se añaden y se anclan correctamente en español las dos notas necesarias para conservar las alternativas significativas del griego y del expediente inglés. El texto se ajusta mínimamente para que el relativo fluya sin coma innecesaria y para situar cada marcador en la frase que la nota explica.
