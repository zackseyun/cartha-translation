  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: es
  text: 'Entonces, al ver esto, el fariseo que lo había invitado se dijo a sí mismo: «Si este hombre fuera profeta, sabría quién y qué clase de mujer[a] es esta que lo está tocando, porque es pecadora[b]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «quién es esta mujer y qué clase de mujer es». El griego enfatiza tanto su identidad como su carácter o reputación.
    reason: lexical_alternative
  - marker: b
    text: O «que es pecadora». La cláusula puede entenderse como el contenido de lo que él sabría o como la razón de su juicio acerca de la mujer.
    reason: lexical_alternative
