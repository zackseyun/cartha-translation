  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: es
  text: 'Y le preguntaron, diciendo: «Maestro, sabemos que hablas y enseñas correctamente, y no muestras parcialidad[a], sino que verdaderamente[b] enseñas el camino de Dios».'
