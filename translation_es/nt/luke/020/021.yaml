  source_alignment_summary: 'El texto conserva la secuencia y el sentido del griego: ἐπηρώτησαν se expresa adecuadamente como «le preguntaron»; «Maestro» traduce Διδάσκαλε; se mantienen los dos verbos, λέγεις y διδάσκεις; «no muestras parcialidad» comunica con claridad el modismo οὐ λαμβάνεις πρόσωπον; y «el camino de Dios» preserva τὴν ὁδὸν τοῦ θεοῦ. Sin embargo, faltan las notas que conservan las alternativas significativas documentadas en la auditoría inglesa.'
  spanish_quality_summary: La redacción es natural, digna y comprensible. Se propone «correctamente» en lugar de «con rectitud» para reflejar de modo directo el adverbio ὀρθῶς aplicado coordinadamente a «hablas y enseñas», sin introducir una matización ética que en español puede sonar más marcada. La puntuación y el registro son apropiados.
  glossary_alignment: «Dios» corresponde a θεοῦ. No aparecen términos cubiertos por los demás valores terminológicos predeterminados. «Maestro» es la equivalencia española clara de Διδάσκαλε; «parcialidad» traduce el sentido idiomático de οὐ λαμβάνεις πρόσωπον.
  issues:
  - severity: medium
    issue: Se omitieron las notas de alternativa léxica para el modismo de imparcialidad y para ἐπ’ ἀληθείας.
    rationale: La auditoría inglesa preserva tanto el trasfondo literal de «recibir un rostro» como la alternativa «en verdad». Conforme a la disciplina del proyecto, estas alternativas significativas deben conservarse en notas españolas con anclas únicas.
  revised_spanish_text: 'Y le preguntaron, diciendo: «Maestro, sabemos que hablas y enseñas correctamente, y no muestras parcialidad[a], sino que verdaderamente[b] enseñas el camino de Dios».'
  revised_footnotes: *id001
  revision_rationale: Se añaden las dos notas de alternativa conservadas en la auditoría inglesa y se cambia «con rectitud» por «correctamente» para una representación española más directa y natural de ὀρθῶς. No se altera el sentido del versículo.
