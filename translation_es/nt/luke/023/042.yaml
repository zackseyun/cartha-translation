review_pass:
  verdict: revise
  source_alignment_summary: 'El texto principal «Y él dijo: “Jesús, acuérdate de mí cuando vengas en tu reino”» refleja fielmente el griego SBLGNT: ἔλεγεν funciona idiomáticamente como pasado narrativo, μνήσθητί μου se expresa naturalmente con «acuérdate de mí», y ἐν τῇ βασιλείᾳ σου se conserva como «en tu reino», sin introducir la direccionalidad de «a/en tu reino». Sin embargo, falta la nota textual significativa conservada en la auditoría inglesa sobre la variante con εἰς.'
  spanish_quality_summary: La redacción es clara, digna y natural en español latinoamericano. «Acuérdate de mí» comunica adecuadamente la petición sin explicitar en exceso la posible implicación de recordar favorablemente. Se añade una nota anclada a la frase pertinente y no al verbo introductorio.
  glossary_alignment: «Jesús» sigue el nombre Ἰησοῦς; «reino» es la equivalencia española normal de βασιλεία en este contexto escatológico y real. No se activan terminologías especiales del proyecto como Yahvé, Mesías o esclavo.
  issues:
  - severity: medium
    issue: Ausencia de la nota sobre la variante textual «a tu reino».
    rationale: El texto SBLGNT lee ἐν («en»), que el borrador traduce correctamente. La auditoría inglesa preserva la variante manuscrita εἰς («a/entrando en») y la alternativa interpretativa; para conservar esa información significativa, el español debe incluir una nota anclada en «en tu reino».
  revised_spanish_text: 'Y él dijo: «Jesús, acuérdate de mí cuando vengas en tu reino[a]».'
  revised_footnotes: *id001
  revision_rationale: Se mantiene el texto principal conforme a ἐν τῇ βασιλείᾳ σου y se añade la nota de variante manuscrita ya preservada en la auditoría inglesa, con un ancla en la frase afectada.
