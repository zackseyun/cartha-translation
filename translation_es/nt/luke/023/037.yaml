  source_alignment_summary: El borrador transmite fielmente la cláusula participial («y diciendo»), el desafío condicional, el título definido «el Rey de los judíos» y el imperativo reflexivo «sálvate». Sin embargo, omite la alternativa léxica significativa de Ἰουδαίων conservada en la auditoría inglesa.
  spanish_quality_summary: La redacción es natural, clara y digna en español. «Sálvate» reproduce bien el imperativo aoristo σῶσον y «tú» conserva de manera idiomática el énfasis del pronombre explícito σὺ. Se requiere únicamente anclar una nota en «judíos».
  glossary_alignment: No intervienen los términos predeterminados Yahvé, Mesías, esclavo, arrepentimiento, carne, justicia o gracia. «Rey» conserva apropiadamente el título concreto y cargado de βασιλεὺς; «judíos» es la opción contextual principal para Ἰουδαίων, con «judeanos» preservado como alternativa.
  issues:
  - severity: medium
    issue: Falta la nota léxica sobre Ἰουδαίων.
    rationale: La traducción inglesa auditada conserva «Judeans» como alternativa relevante a «Jews», debido al posible matiz regional/étnico del griego. La política exige preservar en español las alternativas significativas que se conservaron en inglés; la nota debe estar anclada en el texto.
  revised_spanish_text: 'y diciendo: «Si tú eres el Rey de los judíos[a], sálvate».'
  revised_footnotes: *id001
  revision_rationale: Se añade la nota alternativa requerida para Ἰουδαίων, sin modificar la traducción principal, que ya refleja fielmente el griego y mantiene un español natural.
