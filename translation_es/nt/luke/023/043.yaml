  source_alignment_summary: 'El texto principal traduce fielmente καὶ εἶπεν αὐτῷ, Ἀμήν σοι λέγω, σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ: «En verdad te digo: hoy estarás conmigo en el paraíso». Sin embargo, omite la nota necesaria sobre la posible, aunque menos probable, vinculación de «hoy» con «te digo».'
  spanish_quality_summary: La redacción es clara, natural y digna en español latinoamericano. «En verdad te digo» conserva adecuadamente la fórmula enfática Ἀμήν σοι λέγω; «hoy estarás conmigo» expresa de forma directa la lectura principal.
  glossary_alignment: No intervienen términos sujetos a las convenciones principales de Yahvé/Mesías/esclavo. «Paraíso» es la equivalencia establecida y contextual de παραδείσῳ; se conserva en minúscula como sustantivo común, conforme al razonamiento inglés. «Hoy» traduce σήμερον y requiere nota por la ambigüedad de puntuación del griego antiguo.
  issues:
