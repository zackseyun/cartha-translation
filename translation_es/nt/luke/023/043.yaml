    issue: Falta la nota textual-interpretativa sobre «hoy».
    rationale: El expediente inglés conserva explícitamente la alternativa históricamente discutida de entender σήμερον con «te digo», dado que el griego original no tenía puntuación moderna. La omisión elimina una alternativa significativa que el proyecto ha decidido documentar, aunque el texto principal sea correcto.
