  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: es
  text: 'Él les dijo: «Ustedes me trajeron a este hombre como uno que estaba desviando al pueblo[a], y he aquí, después de examinarlo delante de ustedes, no hallé en este hombre ningún fundamento para los cargos que ustedes presentan contra él[b]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'O: «como uno que estaba apartando al pueblo». El verbo griego puede significar apartar o desviar/extraviar.'
    reason: alternativa_léxica
  - marker: b
    text: 'O: «No hallé en este hombre ninguna culpa respecto de las cosas de las que lo acusan».'
    reason: lectura_alternativa
