review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva fielmente la estructura y el sentido del griego: ἵνα δὲ εἰδῆτε se expresa como «Pero para que sepan»; «el Hijo del Hombre» mantiene el título ὁ υἱὸς τοῦ ἀνθρώπου; ἐξουσίαν ἔχει es correctamente «tiene autoridad»; y el mandato final comunica adecuadamente ἔγειρε, ἄρας y πορεύου. La revisión propuesta solo normaliza la puntuación parentética y conserva en español las alternativas significativas documentadas en la auditoría inglesa.'
  spanish_quality_summary: El español es natural, digno y ampliamente comprensible. «Paralítico», «levántate», «estera» y «vete a tu casa» son idiomáticos en este contexto. Se requieren notas ancladas para no perder la resonancia titular de «Hijo del Hombre» ni la amplitud léxica de κλινίδιον, ambas preservadas en la edición inglesa.
  glossary_alignment: «Hijo del Hombre» conserva el título cristológico y su posible eco de Daniel 7, sin reducirlo interpretativamente. «Autoridad» refleja el derecho o prerrogativa de ἐξουσία, no solo poder. «Perdonar pecados» corresponde a ἀφιέναι ἁμαρτίας. «Estera» representa κλινίδιον como lecho pequeño; la nota conserva «camilla» y «cama» como alternativas.
  issues:
  - severity: medium
    issue: Faltan las dos notas léxicas/teológicas significativas conservadas por la auditoría inglesa.
    rationale: La política exige preservar en notas españolas las alternativas significativas que la English POB conserva. Deben anclarse de forma única en «Hijo del Hombre» y «estera».
