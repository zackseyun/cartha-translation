  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: es
  text: 'Pero para que sepan que el Hijo del Hombre[a] tiene autoridad en la tierra para perdonar pecados—dijo al paralítico—: «Te digo: levántate, toma tu estera[b] y vete a tu casa».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «el Humano». Se conserva «el Hijo del Hombre» porque es la autodesignación de Jesús y tiene importantes resonancias bíblicas, especialmente con Daniel 7.
    reason: alternative_reading
  - marker: b
    text: O «tu camilla» o «tu cama». El griego κλινίδιον se refiere a una cama pequeña, un jergón o una estera.
    reason: lexical_alternative
