review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva el sentido de τίς ὁ ἁψάμενός μου («¿Quién es el que me tocó?»), el carácter durativo de ἀρνουμένων πάντων («mientras todos lo negaban») y el tratamiento respetuoso Ἐπιστάτα («Maestro»). Sin embargo, «te rodean» es menos preciso para συνέχουσιν, que expresa que las multitudes lo cercan o lo tienen encerrado, y falta la alternativa léxica que el rastro inglés conserva para el par συνέχουσιν / ἀποθλίβουσιν.
  spanish_quality_summary: Se recomienda «te cercan y te presionan» para distinguir con claridad el cerco de la presión física y mantener un español natural. También se elimina el punto indebido tras el signo de interrogación dentro de la cita. El expediente español no documenta decisiones léxicas o teológicas; esa carencia de metadatos no afecta por sí misma la fidelidad del texto revisado.
  glossary_alignment: «Jesús» sigue la terminología del proyecto. «Maestro» reproduce Ἐπιστάτα sin elevarlo a «Señor», y «tocó» comunica apropiadamente el contacto físico de ἅπτω. «Multitudes» mantiene el plural de ὄχλοι.
  issues:
  - severity: medium
    issue: La pareja συνέχουσιν / ἀποθλίβουσιν se neutraliza parcialmente en «te rodean y te aprietan», y se omite la alternativa léxica preservada en el inglés.
    rationale: συνέχω comunica cerco o confinamiento por la multitud, mientras que ἀποθλίβω comunica presión. «Te cercan y te presionan» conserva la distinción; la nota conserva la alternativa española correspondiente al audit trail inglés.
  - severity: low
    issue: Puntuación final de la pregunta dentro de comillas angulares.
    rationale: No corresponde añadir punto después del signo de cierre de interrogación; el signo ya cierra el enunciado interrogativo.
  revised_spanish_text: 'Y Jesús dijo: «¿Quién es el que me tocó?». Y, mientras todos lo negaban, Pedro dijo: «Maestro, las multitudes te cercan y te presionan[a]».'
  revised_footnotes: *id001
  revision_rationale: Se precisa la distinción entre el cerco de συνέχω y la presión de ἀποθλίβω, se restituye en español la alternativa léxica conservada por el audit trail inglés y se corrige la puntuación de la pregunta. No se requiere adjudicación adicional.
