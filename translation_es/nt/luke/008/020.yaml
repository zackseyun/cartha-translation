  source_alignment_summary: El borrador transmite correctamente el informe pasivo, la madre, los hermanos, su ubicación afuera y el propósito de ver a Jesús. Sin embargo, omite la alternativa léxica documentada para ἀδελφοί, que debe conservarse en nota sin resolver debates sobre la relación familiar de Jesús.
  spanish_quality_summary: '«Y se le informó» es natural y digno. Se mantiene «están afuera y desean verte»: la coordinación española expresa con fluidez el participio θέλοντες y su sentido concomitante, sin introducir información adicional.'
  glossary_alignment: No aparecen términos sujetos a los valores terminológicos especiales del proyecto. «Hermanos» conserva el sentido ordinario, masculino plural y no interpretativo de ἀδελφοί; «madre», «afuera» y «ver» reflejan directamente μήτηρ, ἔξω e ἰδεῖν.
