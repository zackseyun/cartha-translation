review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva correctamente la secuencia narrativa, «Esto es mi cuerpo» y la cláusula incluida entre corchetes en SBLGNT. Sin embargo, «Hagan esto» deja menos explícita la fuerza continuativa del imperativo presente ποιεῖτε que la decisión inglesa auditada («Keep doing this»), y faltan las notas textuales, léxicas y de lectura teológica que preservan alternativas significativas del original y del expediente POB.
  spanish_quality_summary: El español es claro y digno. Se recomienda «Sigan haciendo esto» para expresar de manera natural la práctica continuada, y se añaden notas ancladas y ordenadas sin alterar la lectura principal.
  glossary_alignment: No intervienen los términos predeterminados de Yahvé, Mesías, esclavo, etc. «Cuerpo», «dar gracias», «memoria» y «por ustedes» son traducciones adecuadas de σῶμα, εὐχαριστήσας, ἀνάμνησις y ὑπὲρ ὑμῶν. «Se da» conserva el participio presente pasivo διδόμενον; la alternativa aspectual se conserva en nota.
  issues:
  - severity: medium
    issue: Faltan las notas sobre la variante textual, la lectura de «es» y la alternativa aspectual de διδόμενον.
    rationale: El texto fuente presenta la cláusula larga entre corchetes y el expediente inglés documenta estas alternativas. Deben preservarse para auditabilidad y para no resolver por traducción una cuestión sacramental debatida.
  - severity: low
    issue: «Hagan esto» no hace visible la fuerza continuativa del imperativo presente ποιεῖτε.
    rationale: Aunque puede admitir un sentido repetido según el contexto, «Sigan haciendo esto» expresa en español la decisión léxica aprobada de mantener la práctica en curso.
  revised_spanish_text: 'Y tomando pan[a], después de dar gracias, lo partió y se lo dio a ellos, diciendo: «Esto es mi cuerpo[b], que se da por ustedes[c]. Sigan haciendo esto en memoria de mí».'
  revised_footnotes: *id001
  revision_rationale: Se conserva la traducción directa del griego, se hace explícito el valor continuativo de ποιεῖτε mediante «Sigan haciendo», y se restauran las tres notas significativas del expediente inglés con marcadores únicos en orden y anclados en el texto español.
