review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva correctamente la secuencia y el sentido básico del griego: el dicho introductorio, la circunstancia temporal de entrar en la ciudad, el hombre que lleva agua, el futuro «los encontrará» y el mandato de seguirlo. Sin embargo, «Mira» se dirige formalmente a una sola persona, mientras que Ἰδού introduce una instrucción a un grupo; «Miren» preserva mejor la apelación y la concordancia. También deben conservarse las dos alternativas léxicas documentadas en el rastro inglés.'
  spanish_quality_summary: «Miren» es un llamamiento de atención moderno y digno, más natural que el singular «Mira» ante «les dijo» y «entren». «Síganlo a la casa en la que entra» es claro en español y expresa el destino y la cláusula relativa direccional sin el giro menos fluido «a la casa a la que entra».
  glossary_alignment: No intervienen los términos teológicos o de glosario principales del proyecto. Ἰδού se traduce «Miren», con «He aquí» como alternativa más formal; κεράμιον se traduce «cántaro», y se conserva en nota la posible especificación de barro/cerámica. ἄνθρωπος sigue siendo «un hombre», y ἀκολουθήσατε conserva el imperativo plural «Síganlo».
  issues:
  - severity: medium
    issue: Faltan las notas léxicas preservadas por el registro inglés.
    rationale: La alternativa formal de Ἰδού y el matiz de recipiente de barro de κεράμιον son alternativas significativas ya documentadas; deben aparecer con marcadores únicos anclados en el texto español.
  - severity: low
    issue: «Mira» no concuerda naturalmente con el auditorio plural.
    rationale: Aunque puede funcionar coloquialmente como marcador discursivo, «Miren» refleja con mayor claridad la exhortación dirigida a los discípulos y mantiene un registro digno.
  revised_spanish_text: 'Y les dijo: «Miren[a], cuando entren en la ciudad, un hombre que lleva un cántaro[b] de agua los encontrará. Síganlo a la casa en la que entra».'
  revised_footnotes: *id001
  revision_rationale: Se ajusta el llamamiento introductorio al plural y se incorporan las alternativas léxicas que el rastro inglés documenta, sin cambiar el sentido narrativo ni añadir interpretación.
