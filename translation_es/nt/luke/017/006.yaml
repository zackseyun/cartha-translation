review_pass:
  verdict: revise
  source_alignment_summary: El borrador conserva correctamente la condición hipotética («Si tuvieran... le dirían... les obedecería»), el símil sin reducirlo explícitamente al tamaño, los imperativos pasivos y el plural de «les». «El Señor» es adecuado para ὁ κύριος como título narrativo; no se trata aquí de una cita griega del nombre divino que exija «Yahvé». Sin embargo, omite la alternativa léxica significativa que el registro inglés conserva para συκάμινος.
  spanish_quality_summary: La redacción es clara, digna y natural en español latinoamericano. «Sé desarraigada y sé plantada» comunica de manera fiel los dos imperativos pasivos, aunque es una formulación deliberadamente vívida al dirigirse al árbol. Se añade una nota breve y anclada para la alternativa tradicional.
  glossary_alignment: πίστις se traduce «fe», conforme al sentido de confianza en este dicho. κύριος se traduce «el Señor» como título cristológico/narrativo. συκάμινος se traduce «morera»; la alternativa tradicional «árbol sicamino» se conserva en nota. ἐκριζώθητι y φυτεύθητι se reflejan mediante «Sé desarraigada y sé plantada», y ὑπήκουσεν mediante «les obedecería».
  issues:
  - severity: low
    issue: Falta la nota léxica para «morera».
    rationale: El inglés auditado preserva «sycamine tree» como alternativa tradicional de συκάμινος. La política requiere conservar en nota las alternativas significativas preservadas por el POB inglés; en español, «árbol sicamino» expresa esa alternativa sin confundirla con el sicómoro/higuera sicómoro.
  revised_spanish_text: 'Y el Señor dijo: «Si tuvieran fe como un grano de mostaza, le dirían a esta morera[a]: “Sé desarraigada y sé plantada en el mar”, y les obedecería».'
  revised_footnotes: *id001
  revision_rationale: Se incorpora la alternativa léxica documentada para συκάμινος, con un marcador único en «morera». No se requieren cambios en la traducción principal.
