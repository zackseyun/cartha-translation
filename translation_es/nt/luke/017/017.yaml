review_pass:
  verdict: revise
  source_alignment_summary: El griego pregunta retóricamente, con expectativa de respuesta afirmativa, si los diez fueron καθαρίζω en voz pasiva, y contrasta a los nueve ausentes. «Fueron limpiados» conserva de manera más directa la voz pasiva y el campo semántico de καθαρίζω que «quedaron limpios», mientras que «Pero ¿dónde están los nueve?» expresa claramente el contraste de δέ.
  spanish_quality_summary: La redacción revisada es natural, digna y clara en español latinoamericano. Evita una formulación resultativa que puede sonar algo menos vinculada al lenguaje bíblico de purificación, sin caer en un calco poco idiomático.
  glossary_alignment: Jesús se conserva conforme al término griego Ἰησοῦς. «Limpiados» refleja καθαρίζω y mantiene sus matices físicos y de pureza ritual, en lugar de reducirlo a «sanados». La nota conserva en español la alternativa significativa registrada en la auditoría inglesa.
  issues:
  - severity: medium
    issue: «Quedaron limpios» atenúa la voz pasiva y el vínculo léxico con καθαρίζω.
    rationale: Aunque es una expresión española comprensible en este contexto, presenta principalmente el estado resultante. «Fueron limpiados» reproduce mejor el pasivo griego y preserva el lenguaje de purificación física y ritual documentado por la auditoría.
  - severity: low
    issue: Falta la alternativa léxica conservada en la nota inglesa.
    rationale: La nota española propuesta conserva una alternativa idiomática que explicita el resultado de la limpieza, sin añadir contenido al texto principal.
  revised_spanish_text: 'Entonces Jesús respondió: «¿No fueron limpiados[a] los diez? Pero ¿dónde están los nueve?»'
  revised_footnotes: *id001
  revision_rationale: Se cambia la expresión resultativa «quedaron limpios» por «fueron limpiados» para reflejar la voz pasiva de ἐκαθαρίσθησαν y mantener el matiz de purificación de καθαρίζω. Se hace explícito el contraste de δέ con «Pero» y se añade una nota con la alternativa española idiomática.
