  source_alignment_summary: El texto español conserva la fórmula narrativa Καὶ ἐγένετο («Y sucedió que»), la circunstancia simultánea de la oración («mientras él oraba»), la indefinición de ἐν τόπῳ τινὶ («en cierto lugar»), el cese de la oración («cuando se detuvo»), la construcción partitiva («uno de sus discípulos») y la comparación final con Juan. «Enséñanos a orar» reproduce directamente δίδαξον ἡμᾶς προσεύχεσθαι sin añadir «cómo».
  spanish_quality_summary: La redacción es clara, natural y digna para un registro bíblico hispanoamericano. La puntuación y el diálogo con comillas angulares son apropiados. «Cuando se detuvo» mantiene prudentemente la formulación no expandida del griego y del audit trail, aunque el contexto haga evidente que dejó de orar.
  glossary_alignment: «Señor» es la traducción española establecida y contextual de Κύριε como tratamiento dirigido a Jesús; no se trata aquí de la representación del tetragrámaton, por lo que no corresponde «Yahvé». No aparecen otros términos sujetos a los valores terminológicos predeterminados del proyecto.
