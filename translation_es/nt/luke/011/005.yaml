review_pass:
  verdict: revise
  source_alignment_summary: El borrador comunica correctamente la pregunta retórica, la ida a medianoche, el trato repetido «Amigo», el préstamo y los tres panes. Sin embargo, «que tiene un amigo» cambia el futuro indicativo ἕξει por un presente en una posición donde el griego coordina dos futuros (ἕξει ... πορεύσεται). Se recomienda conservar el futuro en español; la alternativa idiomática con presente puede quedar en nota, como en la auditoría inglesa.
  spanish_quality_summary: La redacción actual es comprensible, pero «¿Quién de ustedes que tiene un amigo irá...?» resulta algo trabada en español. «¿Quién de ustedes tendrá un amigo e irá a verlo...?» es clara, digna y conserva la construcción retórica y los futuros del griego. Se añade una nota para conservar la alternativa presente documentada.
  glossary_alignment: No intervienen los términos teológicos controlados por el glosario. «Amigo» traduce coherentemente φίλον / Φίλε, «préstame» traduce adecuadamente χρῆσόν μοι, y «panes» expresa ἄρτους en este contexto.
  issues:
  - severity: low
    issue: El primer futuro griego ἕξει se vierte como presente («tiene»).
    rationale: Aunque el presente puede ser una adaptación idiomática admisible y aparece como alternativa en la auditoría inglesa, el texto principal español puede conservar naturalmente los dos futuros del original. La formulación actual además queda menos fluida.
  revised_spanish_text: 'Y les dijo[a]: «¿Quién de ustedes tendrá un amigo e irá a verlo a medianoche y le dirá: “Amigo, préstame tres panes”?»'
  revised_footnotes: *id001
  revision_rationale: Se restituye el futuro de ἕξει junto con el de πορεύσεται y se conserva en una nota la alternativa con presente que documenta la auditoría inglesa. También se mejora la fluidez de la pregunta retórica española.
