  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: es
  text: 'En aquella misma hora se regocijó en el Espíritu Santo y dijo[a]: «Te alabo, Padre, Señor del cielo y de la tierra, porque escondiste estas cosas de los sabios y entendidos, y las revelaste a los niños pequeños[b]. Sí, Padre, porque así fue de tu agrado[c]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «Te doy gracias». El verbo griego puede expresar acción de gracias además de alabanza en una oración.
    reason: lexical_alternative
  - marker: b
    text: O «infantes». Probablemente es una expresión metafórica para quienes son humildes o socialmente insignificantes, no solo para niños de corta edad.
    reason: lexical_alternative
  - marker: c
    text: O «porque tal fue tu buena voluntad» o «porque esto fue agradable ante tus ojos».
    reason: alternative_reading
