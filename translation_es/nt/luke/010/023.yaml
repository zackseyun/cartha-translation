review_pass:
  verdict: revise
  source_alignment_summary: La redacción conserva la secuencia participial de στραφεὶς («volviéndose»), el destinatario («los discípulos»), el carácter privado de κατ’ ἰδίαν, y la bienaventuranza dirigida a «los ojos que ven lo que ustedes ven». «Bienaventurados» comunica adecuadamente el peso declarativo de μακάριοι, no una mera felicidad subjetiva.
  spanish_quality_summary: El español es claro, digno y apropiado para un registro bíblico latinoamericano. Se recomienda una leve reubicación de «en privado» para que modifique sin ambigüedad el acto de decir, y una nota que preserve la alternativa significativa documentada para κατ’ ἰδίαν.
  glossary_alignment: No intervienen términos con una equivalencia obligatoria del glosario del proyecto. «Discípulos» corresponde a μαθητάς; «Bienaventurados» conserva el valor de beatitud de μακάριοι; «ojos» mantiene la imagen metonímica explícita de ὀφθαλμοὶ.
  issues:
  - severity: low
    issue: Falta la nota de alternativa para κατ’ ἰδίαν.
    rationale: El registro inglés conserva una alternativa léxica para esta expresión («in private»). En español, «en privado» es una buena opción principal, y «aparte» preserva de forma natural la posibilidad de entender la acción como separada de los demás.
  revised_spanish_text: 'Y, volviéndose hacia los discípulos, dijo en privado[a]: «Bienaventurados los ojos que ven lo que ustedes ven».'
  revised_footnotes: *id001
  revision_rationale: Se añade la alternativa léxica significativa y se desplaza «en privado» junto a «dijo» para reflejar con mayor claridad que Jesús habló a los discípulos separadamente de los demás.
