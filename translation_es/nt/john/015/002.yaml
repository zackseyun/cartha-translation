  source_alignment_summary: El texto principal traduce fielmente la estructura distributiva de πᾶν κλῆμα, la unión «en mí», la falta o presencia de fruto, el contraste entre αἴρει y καθαίρει, y la cláusula de propósito con el comparativo «más fruto». «La quita» refleja adecuadamente αἴρει y «la poda» el sentido vitícola de καθαίρει.
  spanish_quality_summary: 'La redacción es natural, clara y digna en español: «Toda rama en mí que no da fruto, la quita; y toda rama que da fruto, la poda para que dé más fruto». Sin embargo, omite las dos notas léxicas significativas que el audit trail inglés conserva y que deben mantenerse también en español.'
  glossary_alignment: «Rama», «fruto», «quita» y «poda» son equivalentes idiomáticos y contextualmente precisos. No intervienen los términos terminológicos globales Yahvé/Mesías/espíritu/esclavo. Para αἴρει se mantiene «quita» como lectura principal (remueve), con «levanta» en nota; para καθαίρει se mantiene «poda», con su posible sentido de «limpia» en nota.
