review_pass:
  verdict: revise
  source_alignment_summary: El borrador comunica correctamente la remoción de Saúl, la elevación de David como rey para Israel, el testimonio divino acerca de David y la caracterización «conforme a mi corazón». Sin embargo, «toda mi voluntad» neutraliza el plural griego τὰ θελήματά μου, que se refiere a los diversos propósitos o designios de Dios.
  spanish_quality_summary: El español es claro, digno y natural. «Les levantó a David como rey» conserva bien el modismo bíblico de ἤγειρεν y el dativo de beneficio. Se añade puntuación de nota en los dos lugares donde la tradición o la forma plural requieren aclaración.
  glossary_alignment: No intervienen términos sujetos a los valores terminológicos principales del proyecto. «Conforme a mi corazón» refleja adecuadamente κατὰ τὴν καρδίαν μου sin adoptar innecesariamente el giro tradicional «según mi propio corazón». «Todos mis propósitos» expresa de modo idiomático el plural θελήματα.
  issues:
  - severity: medium
    issue: El singular «toda mi voluntad» no conserva el plural de τὰ θελήματά μου.
    rationale: El griego usa θελήματα en plural. En español, «todos mis propósitos» mantiene la pluralidad y el sentido de las intenciones o voluntades divinas sin la aspereza de «todas mis voluntades».
  - severity: low
    issue: Faltan notas para la alternativa tradicional de «conforme a mi corazón» y para el plural de θελήματα.
    rationale: El rastro inglés preserva ambas observaciones léxicas. Deben quedar ancladas en el texto español con marcadores únicos y consecutivos.
  revised_spanish_text: 'Y después de quitarlo, les levantó a David como rey; y de él también dio testimonio y dijo: «He hallado a David, hijo de Isaí, un hombre conforme a mi corazón[a], que hará todos mis propósitos[b]».'
  revised_footnotes: *id001
  revision_rationale: Se reemplaza el singular «toda mi voluntad» por «todos mis propósitos» para conservar la pluralidad de θελήματα y se incorporan las notas léxicas pertinentes. La documentación inglesa contiene una inconsistencia heredada entre una revisión que afirma erróneamente que el griego es singular y las decisiones léxicas/notas que reconocen correctamente el plural; la revisión española sigue el texto griego y no requiere nueva adjudicación.
