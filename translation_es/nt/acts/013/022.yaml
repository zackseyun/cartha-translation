  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: es
  text: 'Y después de quitarlo, les levantó a David como rey; y de él también dio testimonio y dijo: «He hallado a David, hijo de Isaí, un hombre conforme a mi corazón[a], que hará todos mis propósitos[b]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O, más tradicionalmente, «un hombre según mi propio corazón». El griego dice más literalmente «conforme a mi corazón».
    reason: lexical_alternative
  - marker: b
    text: El griego dice «todas mis voluntades» o «todos mis designios», en plural; «todos mis propósitos» expresa ese plural de manera natural en español.
    reason: lexical_alternative
