review_pass:
  verdict: revise
  source_alignment_summary: παραδεδωκόσι τὰς ψυχὰς αὐτῶν is a perfect participial expression meaning literally «habiendo entregado sus vidas», an idiom for exposing oneself to deadly danger rather than a statement that they had already died. «Por el nombre de nuestro Señor Jesús el Mesías» preserves ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, including the titular force of Χριστός.
  spanish_quality_summary: '«Hombres que han entregado sus vidas» can be read in Spanish as having actually died or surrendered their lives. «Han arriesgado sus vidas» clearly conveys the contextual idiom. The title needs the idiomatic definite article: «Jesús el Mesías», not the unnatural bare apposition «Jesús Mesías».'
  glossary_alignment: «Señor» appropriately renders κύριος in this christological title. «Mesías» follows the project default for Χριστός; «Jesús el Mesías» naturally carries the title in Spanish. The footnote preserves «Cristo» as the conventional alternative and explains the titular translation.
  issues:
  - severity: medium
    issue: The draft says «Jesús Mesías».
    rationale: Spanish normally expresses this title as «Jesús el Mesías». The missing article makes the phrase awkward and weakens the clear titular sense documented for Χριστός.
  - severity: medium
    issue: «Han entregado sus vidas» may imply actual death or total self-sacrifice without clarifying the idiom.
    rationale: The Greek expression is literally «having handed over their lives» but contextually denotes exposure to mortal danger. «Han arriesgado sus vidas», with a lexical note, communicates that sense naturally and avoids overstatement.
  - severity: low
    issue: The draft omits the audit trail's meaningful lexical and title alternatives.
    rationale: Notes should preserve the literal alternative for παραδίδωμι and explain why Χριστός is translated «Mesías» rather than retained as «Cristo».
  revised_spanish_text: hombres que han arriesgado sus vidas[a] por el nombre de nuestro Señor Jesús el Mesías[b].
  revised_footnotes: *id001
  revision_rationale: Se reemplaza una formulación que puede sugerir muerte ya consumada por «han arriesgado sus vidas», que expresa el sentido idiomático contextual de παραδεδωκόσι τὰς ψυχὰς αὐτῶν. Se restaura el artículo español en «Jesús el Mesías» y se añaden las notas que conservan las alternativas léxicas y titulares significativas del registro inglés.
