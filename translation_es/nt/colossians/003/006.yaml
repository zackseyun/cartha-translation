    issue: Falta la nota para «hijos de la desobediencia».
    rationale: El inglés auditado preserva una nota léxica que ofrece «hijos»/«niños» como alternativa y explica que se trata de personas caracterizadas por la desobediencia. La expresión española puede conservarse literalmente, pero requiere esa aclaración para preservar la alternativa significativa y evitar que se entienda como filiación literal.
