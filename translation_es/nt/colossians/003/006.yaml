  source_alignment_summary: 'El texto refleja el griego: «Por causa de estas cosas» conserva el valor causal de δι’ ἃ y su referencia plural a los vicios precedentes; «viene» mantiene el presente de ἔρχεται con su fuerza de juicio en curso o inminente; «la ira de Dios» traduce ἡ ὀργὴ τοῦ θεοῦ; y «sobre» expresa el destinatario/dirección de ἐπί con acusativo. «Los hijos de la desobediencia» conserva el plural masculino υἱούς y la construcción idiomática genitival.'
  spanish_quality_summary: La redacción es clara, digna y natural en español. Se requiere únicamente añadir la nota que conserva la alternativa y explica el modismo, tal como lo hace el expediente inglés. También se documentan las decisiones léxicas españolas en esta revisión; la falta de tales metadatos en el borrador no exige otro cambio en el texto publicado.
  glossary_alignment: «Dios» concuerda con el término establecido para θεός. «Ira» expresa adecuadamente ὀργή en su sentido judicial-divino. Se mantiene «hijos», no una neutralización como «personas», porque reproduce el masculino υἱούς y la textura del modismo; la nota aclara su sentido caracterizador.
  issues:
