  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: es
  text: Y cuando esta carta haya sido leída entre ustedes, procuren que también sea leída en la iglesia de los laodicenses, y que ustedes también lean la de Laodicea[a][b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Más explícitamente: «la carta que procede de Laodicea». El griego deja implícito «carta».'
    reason: lexical_alternative
  - marker: b
    text: La identidad de «la de Laodicea» es incierta; puede referirse a una carta que estaba en Laodicea, no necesariamente a una dirigida originalmente allí.
    reason: cultural_note
