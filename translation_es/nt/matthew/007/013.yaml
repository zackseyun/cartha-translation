  source_alignment_summary: La traducción reproduce el imperativo plural («Entren»), el sentido instrumental/locativo de διά («por»), el contraste entre la puerta estrecha y la puerta ancha, y la ruta espaciosa que conduce a ἀπώλεια. «Ella» concuerda en femenino y se refiere con claridad a «la puerta», no a «el camino».
  spanish_quality_summary: El español es claro, digno y natural. «Angosta» y «espacioso» conservan adecuadamente el contraste espacial griego; la inversión «ancha es la puerta» es aceptable y conserva el énfasis del original. Sin embargo, faltan las notas léxicas significativas que el expediente inglés preserva para εὐρύχωρος y ἀπώλεια.
  glossary_alignment: No se activan términos de glosario teológico fijo. «Destrucción» traduce apropiadamente ἀπώλεια sin imponer una especificación doctrinal adicional. «Puerta», «camino», «angosta/ancha» y «espacioso» reflejan los términos griegos y sus contrastes.
