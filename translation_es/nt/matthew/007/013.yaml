  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: es
  text: Entren por la puerta angosta. Porque ancha es la puerta y espacioso[a] el camino que lleva a la destrucción[b], y muchos son los que entran por ella.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «amplio». El adjetivo griego εὐρύχωρος puede significar «espacioso» o «amplio».
    reason: lexical_alternative
  - marker: b
    text: O «ruina» o «perdición». El griego ἀπώλεια puede denotar destrucción, ruina o perdición.
    reason: lexical_alternative
