  source_alignment_summary: El borrador comunica correctamente el lamento («οὐαί»), la condición de embarazo (ἐν γαστρὶ ἐχούσαις), la lactancia (θηλαζούσαις) y el marco temporal («en aquellos días»). Se recomienda expresar el leve enlace discursivo de δέ con «Pero» y conservar en español la alternativa léxica que la auditoría inglesa documenta.
  spanish_quality_summary: «¡Ay de las que están encinta y de las que amamantan en aquellos días!» es claro y digno. «Pero ¡ay» refleja mejor la transición del griego sin volver el español artificioso. La nota propuesta conserva la explicitación alternativa de «mujeres» y «a sus bebés», mientras el texto principal mantiene la formulación participial concisa del original.
  glossary_alignment: No intervienen términos del glosario con una equivalencia técnica obligatoria. «Embarazadas» traduce idiomáticamente el modismo ἐν γαστρὶ ἔχω, y «amamantan» representa θηλάζω, cuyo objeto está implícito en griego.
  issues:
