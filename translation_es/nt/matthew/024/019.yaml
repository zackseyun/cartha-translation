    rationale: La alternativa «mujeres embarazadas y mujeres que amamantan a sus bebés» explicita el referente femenino y el objeto implícito de θηλάζω; debe preservarse como nota anclada.
  revised_spanish_text: Pero ¡ay de las que están embarazadas[a] y de las que amamantan en aquellos días!
