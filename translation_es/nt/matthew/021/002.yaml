translation:
  language: es
  text: 'diciéndoles: «Vayan a la aldea que está enfrente[a] de ustedes, y enseguida encontrarán una asna atada y un pollino[b] con ella. Desátenlos[c] y tráiganmelos».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «al otro lado de ustedes», en referencia a la ubicación de la aldea.
    reason: lexical_alternative
  - marker: b
    text: «Pollino» aquí se refiere a un asno joven, como deja claro el contexto.
    reason: lexical_alternative
  - marker: c
    text: El griego tiene literalmente un participio, «habiéndolos desatado», seguido de un imperativo, «tráiganmelos»; en español es natural expresarlo como dos mandatos coordinados.
    reason: lexical_alternative
