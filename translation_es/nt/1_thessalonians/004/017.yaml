  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: es
  text: Entonces nosotros, los que vivimos, los que quedamos, seremos arrebatados[a] juntamente con ellos en las nubes para encontrarnos con el Señor[b] en el aire; y así estaremos siempre con el Señor.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «seremos llevados súbitamente». El verbo griego enfatiza una acción repentina y poderosa.
    reason: lexical_alternative
  - marker: b
    text: O «para un encuentro con el Señor». La expresión puede denotar salir al encuentro de alguien, pero el versículo mismo no especifica la secuencia más amplia más allá de este encuentro.
    reason: alternative_reading
