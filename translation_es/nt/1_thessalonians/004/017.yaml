review_pass:
  verdict: revise
  source_alignment_summary: El texto español refleja fielmente la secuencia de ἔπειτα, la doble identificación «los que vivimos, los que quedamos», la simultaneidad y compañía de ἅμα σὺν αὐτοῖς, el futuro pasivo ἁρπαγησόμεθα, las nubes, el encuentro con el Señor en el aire y la permanencia futura con él. «Seremos arrebatados» comunica adecuadamente la acción repentina y poderosa sin imponer un esquema escatológico posterior.
  spanish_quality_summary: La redacción es clara, digna y natural en español eclesial ampliamente legible. «Juntamente con ellos» es algo formal, pero es plenamente idiomático y conserva el énfasis de simultaneidad. La publicación requiere revisión únicamente para trasladar al español las dos alternativas interpretativas/lexicales preservadas en la auditoría inglesa.
  glossary_alignment: «Señor» es apropiado para κύριος en este contexto cristológico, donde el título se refiere a Jesús y no funciona como sustitución del tetragrámaton. «Arrebatados» corresponde bien a ἁρπαγησόμεθα; «nubes», «aire» y «siempre» mantienen el sentido concreto y léxico del griego.
  issues:
  - severity: medium
    issue: Faltan las notas que preservan alternativas significativas de ἁρπαγησόμεθα y εἰς ἀπάντησιν τοῦ κυρίου.
    rationale: La auditoría inglesa documenta explícitamente una alternativa léxica para el verbo y una alternativa de lectura para la expresión de encuentro. Deben conservarse en español, con marcadores únicos anclados en los lugares pertinentes.
