  source_alignment_summary: 'El texto reproduce fielmente la secuencia y el sentido básico del griego: καὶ se conserva como «Y»; ἐπηρώτησεν como «preguntó»; αὐτούς como el pronombre no especificado «les»; τί como «Qué»; συζητεῖτε como «están discutiendo»; y πρὸς ἑαυτούς como el recíproco «entre ustedes». Sin embargo, falta la alternativa léxica para συζητεῖτε que el registro inglés conserva y que sigue siendo pertinente en español.'
  spanish_quality_summary: '«Y les preguntó: «¿Qué están discutiendo entre ustedes?»» es natural, claro y apropiado para un registro bíblico moderno. La puntuación y las comillas son correctas. Se añade un marcador de nota al verbo para documentar que el término puede tener un matiz más confrontativo.'
  glossary_alignment: No intervienen términos del glosario teológico principal. «Preguntó» refleja adecuadamente ἐπηρώτησεν sin añadir intensidad; «les» conserva la referencia plural no especificada de αὐτούς; y «entre ustedes» expresa el valor recíproco de πρὸς ἑαυτούς. «Discutiendo» es una traducción viable de συζητεῖτε, con nota para su posible sentido de debate o disputa.
  issues:
