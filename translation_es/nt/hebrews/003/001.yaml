  source_alignment_summary: El texto principal transmite fielmente Ὅθεν («Por tanto»), el vocativo ἀδελφοὶ ἅγιοι («hermanos santos»), la participación en un llamamiento celestial, el imperativo κατανοήσατε («consideren») y los títulos «apóstol» y «sumo sacerdote» aplicados a Jesús. «Nuestra confesión» conserva adecuadamente τῆς ὁμολογίας ἡμῶν.
  spanish_quality_summary: La redacción es clara, natural y digna para un registro bíblico latinoamericano. No requiere cambio léxico en el texto corrido; sí requiere las notas que preservan la inclusión comunitaria y las alternativas significativas documentadas en la auditoría inglesa.
  glossary_alignment: «Jesús» sigue el término fijo del proyecto. «Apóstol» conserva deliberadamente ἀπόστολος como título, y «sumo sacerdote» es la equivalencia establecida y comprensible de ἀρχιερεύς. «Llamamiento celestial» conserva la fuerza de κλῆσις ἐπουράνιος sin reducirla a una mera invitación.
