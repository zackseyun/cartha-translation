  source_alignment_summary: El texto conserva πρὸς ὃν («a quien»), el pasivo impersonal ἐλαλήθη («se dijo»), la cita con Ἐν Ἰσαὰκ («En Isaac»), κληθήσεται («será llamada») y el sentido posesivo de σοι («tu»). «Descendencia» comunica bien el singular colectivo σπέρμα. Debe conservarse, no obstante, la alternativa léxica «simiente» que el expediente inglés documenta para σπέρμα, y la coma final refleja que la oración continúa en el versículo siguiente.
  spanish_quality_summary: La redacción es natural, digna y claramente legible en español. Se mantiene el orden idiomático español en «tu descendencia será llamada». Se añade el marcador de nota y la coma final; no se requiere una modificación de sentido.
  glossary_alignment: No intervienen los términos de nomenclatura divina ni cristológica del glosario. «Descendencia» es una buena equivalencia contextual de σπέρμα; la nota conserva «simiente» como alternativa más literal.
  issues:
  - severity: low
    issue: Falta la nota léxica para σπέρμα.
    rationale: El registro inglés conserva expresamente «seed» como alternativa más literal. En español, «simiente» es la alternativa correspondiente y debe preservarse con un marcador anclado en «descendencia».
  - severity: low
    issue: Falta la coma final de continuidad.
    rationale: El texto griego y la traducción inglesa terminan la cita con coma, pues la construcción prosigue en Hebreos 11:19. La puntuación española debe mantener esa continuidad.
  revised_spanish_text: 'a quien se dijo: «En Isaac tu descendencia[a] será llamada»,'
