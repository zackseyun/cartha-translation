review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador inicia con una traducción sustancialmente fiel de 1 Clemente 24:1, incluyendo la distinción δεσπότης («Dueño») y κύριος («Señor»), y la traducción titular «Jesús Mesías». Sin embargo, añade material que no pertenece al texto fuente suministrado para 24:1: desde «Veamos, amados, la resurrección...» hasta el final corresponde a versículos posteriores y no puede publicarse en este registro.'
  spanish_quality_summary: La primera oración es clara y digna, aunque «hizo primicias al Señor Jesús Mesías» requiere una pequeña mejora sintáctica en español. «Hizo del Señor Jesús Mesías las primicias» expresa claramente que Jesús es las primicias de la resurrección. La supresión del material añadido también elimina una nota cuyo ancla y contenido pertenecen a la sección posterior.
  glossary_alignment: «Dueño» para δεσπότης mantiene la distinción frente a «Señor» para κύριος. «Mesías» para Χριστός sigue el criterio terminológico del proyecto. «Primicias» conserva el sentido de ἀπαρχή. «Resurrección futura tendrá lugar» comunica naturalmente τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι sin reproducir un pleonasmo artificial.
  issues:
  - severity: high
    issue: El texto publicado contiene material ajeno a 1 Clemente 24:1.
    rationale: La evidencia griega de este registro termina en «ἐκ νεκρῶν ἀναστήσας». Todo el pasaje posterior sobre día, noche y semilla carece de respaldo en el source_payload de 24:1 y debe retirarse, junto con su nota.
  - severity: low
    issue: La construcción «hizo primicias al Señor Jesús Mesías» es poco natural en español.
    rationale: El griego presenta a «el Señor Jesús Mesías» como aquel a quien Dios hizo las primicias. «Hizo del Señor Jesús Mesías las primicias» conserva esa relación con sintaxis española clara.
  revised_spanish_text: Consideremos, amados, cómo el Dueño nos muestra continuamente que la resurrección futura tendrá lugar, de la cual hizo del Señor Jesús Mesías las primicias, al resucitarlo de entre los muertos.
  revision_rationale: 'Se limita el registro estrictamente al versículo atestiguado por la fuente griega y se ajusta levemente la sintaxis de «primicias». No se requiere nota: la alternativa inglesa conservada procede de una redacción anterior hiperliteral y no representa una ambigüedad significativa que deba trasladarse al texto español.'
