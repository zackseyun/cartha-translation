revisions:
- from: 'Consideremos, amados, cómo el Dueño nos muestra continuamente que la resurrección venidera ha de acontecer, de la cual hizo primicias al Señor Jesús Mesías al resucitarlo de entre los muertos. Veamos, amados, la resurrección que acontece en su tiempo señalado. El día y la noche nos lo muestran: la noche se duerme, y el día se levanta; el día se va, y la noche llega. Tomemos las primicias[a] como ejemplo: ¿cómo y de qué manera llega a ser la semilla? El sembrador salió y echó cada una de las semillas en la tierra, y cuando caen en la tierra, secas y desnudas, se deshacen; entonces, de ese deshacerse, la grandeza de la providencia del Dueño las levanta, y de una brotan muchas y dan fruto.'
  to: Consideremos, amados, cómo el Soberano nos muestra continuamente que habrá una resurrección futura, de la cual constituyó en primicias al Señor Jesús Mesías al resucitarlo de entre los muertos.
