review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador reproduce correctamente la cita: καὶ πάλιν αὐτὸς φησίν se expresa de modo natural como «Y otra vez él mismo dice», y «gusano», «no un hombre», «objeto de oprobio» y «desprecio del pueblo» mantienen la humillación y los dos sustantivos predicativos paralelos (ὄνειδος / ἐξουθένημα).'
  spanish_quality_summary: El español es claro, digno y de registro bíblico. Sin embargo, la única nota está anclada en «oprobio», aunque su contenido («objeto de desprecio») corresponde al segundo miembro griego, ἐξουθένημα. Debe trasladarse el marcador al sintagma final y formularse allí la alternativa.
  glossary_alignment: No hay términos sujetos a los valores terminológicos especiales del proyecto. «Gusano» para σκώληξ, «hombre» para ἄνθρωπος y «pueblo» para λαός son adecuados. «Objeto de oprobio» y «desprecio del pueblo» conservan el paralelismo nominal que la evidencia griega requiere.
  issues:
  - severity: low
    issue: Nota alternativa anclada en el miembro equivocado.
    rationale: La nota actual sigue a «oprobio», pero «objeto de desprecio» es una alternativa explicativa para ἐξουθένημα / «desprecio del pueblo», no para ὄνειδος / «oprobio». El marcador debe aparecer en el segundo miembro, preservando además la alternativa significativa del historial inglés («despised by the people») en forma española compatible con el sustantivo griego.
  revised_spanish_text: 'Y otra vez él mismo dice:


    «Pero yo soy un gusano y no un hombre,


    objeto de oprobio para los hombres y desprecio del pueblo[a].»'
  revised_footnotes:
  - marker: a
    text: O «objeto de desprecio para el pueblo».
    reason: alternative_reading
  revision_rationale: 'Se conserva el texto de la traducción y se corrige exclusivamente la ubicación y el alcance de la nota: la alternativa se refiere a «desprecio del pueblo», que traduce el sustantivo ἐξουθένημα y puede explicitarse como «objeto de desprecio para el pueblo».'
