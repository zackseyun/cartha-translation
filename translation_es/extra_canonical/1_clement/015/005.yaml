    text: «Enmudezcan» expresa el imperativo de que los labios engañosos queden sin habla.
    reason: lexical_alternative
  revision_rationale: Se conserva el sentido y el registro de la fuente, mientras se corrigen la colocación de la nota y dos detalles de idiomaticidad española. No se resuelve ninguna ambigüedad textual ni se introduce una interpretación doctrinal.
