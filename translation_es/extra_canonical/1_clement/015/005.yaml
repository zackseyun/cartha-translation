review_pass:
  verdict: revise
  source_alignment_summary: El texto conserva bien la estructura de las dos citas, el imperativo de ἄλαλα γενηθήτω, la fuerza moral de ἀνομία, la autoexaltación de μεγαλοῤῥήμονα/μεγαλυνοῦμεν y el sentido posesivo de παρ᾽ ἡμῖν. Sin embargo, κύριος en «Ἐξολεθρευθῆσαν κύριος», cita de Salmo 12:3 LXX que representa el hebreo יהוה, debe verterse «Yahvé» conforme a la convención del proyecto; el hecho de que la fuente inmediata sea una cita griega exige explicar el tratamiento, no conservar automáticamente la convención enmascaradora «el Señor».
  spanish_quality_summary: «Enmudezcan», «lengua jactanciosa» y «Magnificaremos nuestra lengua» son claros y de registro digno. «Hablan iniquidad» es un calco sintáctico menos idiomático en español actual; «profieren iniquidad» conserva el objeto moral y ofrece una formulación más natural y solemne. La nota [a] no aporta una alternativa textual necesaria y se apoya impropiamente en la redacción inglesa en vez de describir directamente el griego; debe eliminarse.
  glossary_alignment: Se adopta «Yahvé» para el nombre divino subyacente a κύριος en la cita del Salmo. «Señor» permanece en minúscula y con valor genérico en «¿quién es señor sobre nosotros?», donde no representa el nombre divino. Se mantienen «iniquidad», «justo», «lengua» y «labios» por su correspondencia contextual con ἀνομία, δίκαιος, γλῶσσα y χείλη.
  issues:
  - severity: medium
    issue: «el Señor» en la cita del salmo
    rationale: La cita griega usa κύριος para el tetragrámaton del texto hebreo subyacente (Salmo 12:3). La política española del proyecto establece «Yahvé» para יהוה; no hay un carve-out inglés documentado que justifique conservar el enmascaramiento tradicional.
  - severity: low
    issue: «hablan iniquidad» y la nota [a]
    rationale: «Hablan iniquidad» resulta calcado y menos fluido que «profieren iniquidad». La nota no preserva una variante relevante, formula su justificación a partir de la frase inglesa y no es necesaria para la lectura española.
  revised_spanish_text: 'Por esto, enmudezcan los labios engañosos que profieren iniquidad contra el justo. Y otra vez: «Destruya Yahvé a todos los labios engañosos, a la lengua jactanciosa, a los que dicen: “Magnificaremos nuestra lengua; nuestros labios son nuestros; ¿quién es señor sobre nosotros?”»'
  revision_rationale: Se reemplaza «el Señor» por «Yahvé» porque κύριος reproduce el nombre divino en la cita del Salmo 12. Se mejora el giro calcado «hablan iniquidad» a «profieren iniquidad» y se elimina la nota no necesaria; por tanto, no quedan marcadores de nota en el texto.
