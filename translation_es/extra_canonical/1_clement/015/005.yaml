review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el griego. «Enmudezcan», «iniquidad», «lengua jactanciosa» y «Magnificaremos nuestra lengua» representan adecuadamente las expresiones fuente y conservan el registro elevado de la cita. La pregunta final se expresa mejor en español mediante «nuestro señor», que comunica con naturalidad el genitivo ἡμῶν y el sentido de autoridad sobre ellos.
  naturalness: Se corrige la serie de complementos de «Destruya» para evitar la «a» ante referentes inanimados («labios», «lengua»), conservándola ante «los que dicen». También se sustituye «¿quién es señor sobre nosotros?» por la formulación idiomática y fiel «¿quién es nuestro señor?».
  terminology: «El Señor» es apropiado para κύριος en esta cita bíblica griega. «Iniquidad» conserva el peso moral de ἀνομία, y se mantienen consistentemente «labios» para χείλη y «lengua» para γλῶσσα.
  issues:
  - severity: low
    issue: La nota [a] está anclada en «labios engañosos», pero comenta «Enmudezcan».
    rationale: El ancla debe colocarse junto al término o expresión que explica, para que la nota sea estructural y semánticamente transparente.
  - severity: low
    issue: Uso repetido de «a» con objetos directos inanimados y formulación poco natural de la pregunta final.
    rationale: En español neutral resulta más natural enumerar «todos los labios engañosos, la lengua jactanciosa y a los que dicen»; «¿quién es nuestro señor?» expresa naturalmente el dominio implicado por κύριος ἡμῶν.
  revised_text: 'Por esto, enmudezcan[a] los labios engañosos que hablan iniquidad contra el justo. Y otra vez: «Destruya el Señor todos los labios engañosos, la lengua jactanciosa y a los que dicen: “Magnificaremos nuestra lengua; nuestros labios son nuestros; ¿quién es nuestro señor?”»'
  revised_footnotes:
