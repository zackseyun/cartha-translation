  verdict: revise
  source_alignment_summary: 'El texto principal «A causa de los celos y la contienda, Pablo mostró el premio de la perseverancia» traduce fielmente διὰ ζῆλον καὶ ἔριν Παῦλος ὑπομονῆς βραβεῖον ἔδειξεν: conserva la relación causal, el conflicto expresado por ζῆλος/ἔρις, el nombre natural Pablo, y la construcción «premio de la perseverancia». «Mostró» refleja directamente ἔδειξεν.'
  spanish_quality_summary: La redacción es clara, natural y digna en español latinoamericano. La puntuación y las elecciones «celos», «contienda», «perseverancia» y «premio» son adecuadas. Solo debe corregirse la nota para que preserve la alternativa semántica documentada en el audit trail inglés, no una mera sustitución léxica de «mostró».
  glossary_alignment: No intervienen los términos de terminología obligatoria del proyecto. «Pablo» es la forma española establecida; «perseverancia» comunica apropiadamente ὑπομονή; «premio» es un equivalente claro de βραβεῖον.
  issues:
  - severity: low
    issue: La nota [a] no reproduce la alternativa interpretativa conservada por la POB inglesa.
    rationale: La nota inglesa dice «Or 'showed what is the prize of endurance'», que explicita una posible comprensión de la construcción. La nota española actual, «O ‘indicó el premio de la perseverancia’», solo ofrece un sinónimo de «mostró» y omite ese matiz. Debe traducirse la alternativa documentada.
  revised_spanish_text: A causa de los celos y la contienda, Pablo mostró el premio de la perseverancia[a].
  revised_footnotes:
  - marker: a
    text: O «mostró cuál es el premio de la perseverancia».
    reason: Preserva en español la alternativa de lectura registrada en la nota de la POB inglesa.
  revision_rationale: Se mantiene íntegramente el texto de publicación y se reemplaza la nota por una traducción fiel de la alternativa preservada en el audit trail inglés.
