    issue: La nota [a] dice «O ‘era dada’».
    rationale: «Era dada» es imperfecto y presenta una acción en curso, mientras que ἐδέδοτο es pluscuamperfecto y la alternativa inglesa registrada es «was given». «Fue dada» es la alternativa española correspondiente, aunque el texto principal conserva correctamente el pluscuamperfecto «había sido dada».
  revised_spanish_text: Así, una paz profunda y abundante había sido dada a todos[a], y un deseo insaciable de hacer el bien, y una plena efusión del Espíritu Santo venía sobre todos;
  revised_footnotes:
