  source_alignment_summary: 'El texto reproduce fielmente la secuencia y los valores principales del griego: ἐδέδοτο se expresa con pluscuamperfecto («había sido dada»), ἀκόρεστος πόθος εἰς ἀγαθοποιΐαν como «un deseo insaciable de hacer el bien», y ἐγίνετο con el imperfecto «venía sobre todos». La documentación léxica y teológica es en general consistente con el texto fuente y con la auditoría inglesa.'
