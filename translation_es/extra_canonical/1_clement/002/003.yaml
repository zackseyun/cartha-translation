review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador transmite fielmente la secuencia griega: plenitud de propósito santo, celo y confianza devota, el gesto de extender las manos a Dios Todopoderoso, la súplica de que sea propicio y el pecado no intencional. «Involuntariamente» representa adecuadamente ἀκόντες en el sentido precisado por la revisión inglesa, no en el de coacción.'
  spanish_quality_summary: La redacción es digna y clara, pero «extendisteis vuestras manos» emplea el plural de vosotros, ajeno al registro latinoamericano neutral indicado para el proyecto. Debe usarse la forma formal plural no marcada («extendieron sus manos»). La única nota actual está anclada a una mera inversión estilística sin diferencia de sentido; en cambio, la alternativa inglesa documentada para ἀκόντες debe conservarse junto a «involuntariamente».
  glossary_alignment: «Dios Todopoderoso» refleja παντοκράτορα θεόν; «celo», «devota confianza», «propicio» e «involuntariamente» son elecciones apropiadas para προθυμία, εὐσεβὴς πεποίθησις, ἵλεων γενέσθαι y ἀκόντες, respectivamente. No interviene el nombre divino Yahvé ni otra terminología predeterminada que requiera excepción.
  issues:
  - severity: medium
    issue: Uso de «extendisteis vuestras manos».
    rationale: Aunque corresponde gramaticalmente al δεύτερο plural griego, el voseo peninsular de «extendisteis/vuestras» no cumple el objetivo de español neutral latinoamericano. «Extendieron sus manos» conserva el tratamiento plural formal y el sentido del original.
  - severity: medium
    issue: La nota [a] está anclada a «propósito santo» y no conserva la alternativa inglesa documentada para ἀκόντες.
    rationale: «Llenos de propósito santo» y «llenos de santo propósito» no constituyen una alternativa semántica relevante. La nota debe anclarse a «involuntariamente» y presentar una alternativa española como «sin querer», que corresponde al histórico inglés «unwillingly» sin alterar el texto principal, cuya precisión es correcta.
  revised_spanish_text: Y estando llenos de propósito santo, con buen celo y devota confianza extendieron sus manos hacia Dios Todopoderoso, suplicándole que fuera propicio, si en algo habían pecado involuntariamente[a].
  revised_footnotes:
  - marker: a
    text: 'O: «sin querer».'
    reason: Conserva la alternativa documentada en el POB inglés para ἀκόντες; el texto principal «involuntariamente» mantiene con mayor precisión el sentido de pecado no intencional.
  revision_rationale: Se adapta el plural verbal al español latinoamericano neutral y se traslada la única nota al término griego para el que el expediente inglés conserva una alternativa significativa. No se modifica el sentido de la traducción principal.
