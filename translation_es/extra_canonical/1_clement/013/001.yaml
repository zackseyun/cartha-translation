review_pass:
  verdict: revise
  source_alignment_summary: El texto griego de 1 Clemente 13:1 termina con la referencia a las palabras del Señor Jesús, pronunciadas al enseñar gentileza y paciencia. El borrador añade material que pertenece a versículos posteriores («Porque así dijo...» hasta la cita final), por lo que excede el alcance del registro. La cita escrituraria debe conservar dentro de las comillas «para buscarlo y practicar el juicio y la justicia». Dado que κύριος en esa cita alude al nombre divino de la Escritura, «Yahvé» sigue la convención del proyecto; «el Señor Jesús» traduce la fórmula cristológica explícita del pasaje.
  spanish_quality_summary: La parte correspondiente al versículo es en general legible, pero «hacer justicia y rectitud» resulta poco natural y no expresa con claridad el par κρίμα καὶ δικαιοσύνη. Se ha empleado una formulación española idiomática que mantiene el par conceptual. También se elimina la puntuación que convierte indebidamente la continuación en una oración independiente.
  glossary_alignment: Se usa «Yahvé» para κύριος en la cita que evoca el nombre divino, y «Señor» en «el Señor Jesús». Ταπεινοφρονήσωμεν se vierte «Seamos humildes»; ὀργάς, «arrebatos de ira»; ἐπιείκεια, «gentileza»; y μακροθυμία, «paciencia». Para κρίμα καὶ δικαιοσύνη se emplea «el juicio y la justicia», conservando la distinción léxica y el registro ético-jurídico.
  issues:
  - severity: high
    issue: El borrador contiene texto ajeno a 1 Clemente 13:1.
    rationale: Después de «paciencia» incorpora material de los versículos siguientes, junto con dos notas y decisiones léxicas que no pertenecen a este registro. La publicación de 13:1 debe terminar donde termina el texto fuente proporcionado.
  - severity: medium
    issue: La cita llama «Señor» al referente divino.
    rationale: El κύριος de la cita escrituraria representa una alusión al nombre divino; la política del proyecto prefiere «Yahvé» en el texto español en este contexto. Esto no afecta «el Señor Jesús», donde κύριος forma parte de la designación de Jesús.
  - severity: low
    issue: «Hacer justicia y rectitud» es una combinación española forzada.
    rationale: «Practicar el juicio y la justicia» comunica naturalmente ποιεῖν κρίμα καὶ δικαιοσύνην, sin borrar la distinción entre ambos sustantivos.
  revised_spanish_text: 'Seamos humildes, pues, hermanos, dejando de lado toda arrogancia, presunción, necedad y arrebatos de ira, y hagamos lo que está escrito, pues el Espíritu Santo dice: «No se gloríe el sabio en su sabiduría, ni el fuerte en su fuerza, ni el rico en sus riquezas; más bien, el que se gloría, gloríese en Yahvé, para buscarlo y practicar el juicio y la justicia»[a], recordando especialmente las palabras del Señor Jesús, que pronunció al enseñar gentileza y paciencia.'
  revised_footnotes:
  - marker: a
    text: 'También puede puntuarse: «...gloríese en Yahvé», para buscarlo y practicar el juicio y la justicia. El griego, sin embargo, permite y favorece entender esta última frase como parte de lo que dice el Espíritu Santo.'
    reason: Se conserva la alternativa de puntuación documentada en la auditoría inglesa, anclada al final de la cita.
  revision_rationale: Se limita el texto al contenido de 13:1, se eliminan las notas que pertenecían al material añadido y se conserva, mediante una sola nota correctamente anclada, la alternativa de puntuación transmitida por la auditoría inglesa. Las demás modificaciones mejoran la fidelidad terminológica y la naturalidad del español sin ampliar el sentido del griego.
