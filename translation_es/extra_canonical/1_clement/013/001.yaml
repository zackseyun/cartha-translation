revisions:
- from: 'Humillémonos, pues, hermanos, desechando toda arrogancia, presunción, necedad e ira, y hagamos lo que está escrito, porque el Espíritu Santo dice: “No se gloríe el sabio en su sabiduría, ni el fuerte en su fuerza, ni el rico en sus riquezas; sino el que se gloría, gloríese en el Señor, para buscarlo y hacer justicia y rectitud”. Y especialmente recordemos las palabras del Señor Jesús, las cuales habló enseñando mansedumbre y paciencia. Porque así dijo: “Misericordia[a] tengan, para que reciban misericordia; perdonen, para que les sea perdonado; como hacen, así se les hará; como dan, así se les dará; como juzgan, así serán juzgados; como muestran bondad, así se les mostrará bondad; con la medida con que miden, se les medirá”. Con este mandamiento y estos preceptos[b] fortalezcámonos para andar como quienes obedecen sus palabras, en forma digna de santidad, siendo humildes de mente. Porque la santa palabra dice: “¿Sobre quién fijaré mi mirada, sino sobre el manso y tranquilo, y sobre
    el que tiembla ante mis palabras?”'
  to: 'Seamos humildes, pues, hermanos, dejando de lado toda arrogancia, presunción, necedad y arrebatos de ira, y hagamos lo que está escrito, pues el Espíritu Santo dice: «No se gloríe el sabio en su sabiduría, ni el fuerte en su fuerza, ni el rico en sus riquezas; más bien, el que se gloría, gloríese en Yahvé, para buscarlo y practicar el juicio y la justicia»[a], recordando especialmente las palabras del Señor Jesús, que pronunció al enseñar gentileza y paciencia.'
