    issue: La nota al pie presenta como alternativa una lectura que divide las descripciones entre dos referentes.
    rationale: El único artículo τὸν rige πρᾶον, ἡσύχιον y τρέμοντα, de modo que el griego describe a una sola persona. Aunque la nota explica después esta unidad, la alternativa propuesta («el manso y tranquilo y el que tiembla») contradice la sintaxis que la propia nota identifica y puede inducir a error. No hay una ambigüedad textual que exija conservarla.
  revised_text: ¿Sobre quién fijaré mi mirada, sino sobre el que es manso y tranquilo y tiembla ante mis palabras?
