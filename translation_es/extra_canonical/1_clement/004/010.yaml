review_pass:
  verdict: revise
  source_alignment_summary: 'El texto español refleja fielmente el griego: ζῆλος se comunica adecuadamente como «envidia» en este contexto hostil; «obligó ... a huir», «de la presencia de», «compatriota», y la pregunta con los dos términos jurídicos κριτής y δικαστής conservan el sentido. En particular, «juez o magistrado» respeta la redacción propia de Clemente y no la armoniza con la forma más conocida de Éxodo.'
  spanish_quality_summary: La redacción es clara, natural y digna para el español latinoamericano. Sin embargo, la nota actual está anclada indebidamente después de «Egipto» aunque trata de «presencia», y su alternativa «delante de» no equivale por sí sola a «de la presencia de» en esta construcción. Conviene reemplazarla por una nota léxica útil, anclada en los términos jurídicos.
  glossary_alignment: No se activan terminología teológica ni nombres divinos del glosario. «Moisés», «Faraón», «Egipto», «envidia», «juez» y «magistrado» son apropiados. «Juez o magistrado» preserva la distinción jurídica que documenta la revisión inglesa.
  issues:
  - severity: low
    issue: La nota [a] está colocada tras «Egipto» y ofrece una alternativa sintácticamente incompleta e inadecuada para «de la presencia de».
    rationale: El griego ἀπὸ προσώπου significa aquí «de la presencia de»; «delante de» sin «de» cambiaría la construcción y no es una alternativa equivalente. La única nota inglesa heredada, aunque está mal anclada en el registro inglés, concierne a los términos jurídicos. Una nota española anclada en «magistrado» puede conservar una alternativa semánticamente válida sin reproducir esa inconsistencia de metadatos.
  revised_spanish_text: 'La envidia obligó a Moisés a huir de la presencia de Faraón, rey de Egipto, al oír de su compatriota: «¿Quién te ha puesto como juez o magistrado[a] sobre nosotros? ¿Quieres matarme, como mataste ayer al egipcio?»'
  revised_footnotes:
  - marker: a
    text: O «juez o árbitro».
    reason: lexical_alternative
  revision_rationale: Se elimina la nota impropia sobre «presencia» y se reubica el único marcador en la doble designación jurídica, donde una alternativa española válida para δικαστής («árbitro») informa al lector sin oscurecer la traducción principal ni reintroducir la armonización «gobernante o juez» que el audit trail rechazó.
