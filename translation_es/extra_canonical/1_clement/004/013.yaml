review_pass:
  verdict: revise
  source_alignment_summary: El texto principal refleja correctamente la construcción διὰ ζῆλος («Por causa de los celos») y el modismo φθόνον ἔσχεν ὑπό τινος como que David fue el objeto de la envidia de los extranjeros. También conserva adecuadamente el paralelismo de agencia con ἐδιώχθη ὑπὸ Σαούλ y la aposición «Saúl, rey de Israel».
  spanish_quality_summary: La redacción principal es clara, natural y digna en español. Sin embargo, la nota actual propone «incurrió en envidia», expresión que en español normalmente atribuye a David la acción o culpa de envidiar; por tanto, invierte la relación semántica del griego. Debe sustituirse por una alternativa española que mantenga a David como objeto de la envidia.
  glossary_alignment: No se plantean términos del glosario institucional que requieran ajuste. «Celos» y «envidia» preservan la distinción léxica entre ζῆλος y φθόνος, y «extranjeros» es una traducción apropiada de ἀλλόφυλοι en este contexto.
  issues:
  - severity: medium
    issue: 'La nota [a] contiene una alternativa semánticamente engañosa: «incurrió en envidia».'
    rationale: Aunque reproduce de cerca la formulación inglesa heredada «incurred envy», «incurrir en envidia» no es un giro español adecuado para «ser envidiado» y puede entenderse como que David sintió o cometió envidia. φθόνον ἔσχεν ὑπὸ τῶν ἀλλοφύλων presenta a los extranjeros como quienes envidian a David.
  revised_spanish_text: Por causa de los celos, David fue objeto de envidia no solo por parte de los extranjeros[a], sino que también fue perseguido por Saúl, rey de Israel.
  revised_footnotes:
  - marker: a
    text: 'O: «David fue envidiado no solo por los extranjeros».'
    reason: Alternativa española directa para φθόνον ἔσχεν ὑπὸ τῶν ἀλλοφύλων; conserva a David como objeto de la envidia y a los extranjeros como agentes.
  revision_rationale: Se conserva íntegramente el texto principal y se corrige únicamente la nota para eliminar una alternativa que, en español, puede invertir el sentido del original. La nueva nota mantiene una variante natural y fiel al valor del modismo griego.
