    issue: La nota alternativa usa «atendiente».
    rationale: Aunque pretende conservar la alternativa inglesa «attendant», «atendiente» resulta poco natural en el español meta. «Asistente» expresa de manera clara la alternativa funcional sin reemplazar en el texto principal el título honorífico «siervo de Dios».
  revised_spanish_text: La envidia hizo bajar vivos a Datán y Abirón al Hades, porque se rebelaron contra Moisés[a], el siervo de Dios.
