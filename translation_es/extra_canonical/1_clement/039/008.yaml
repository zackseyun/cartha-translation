revisions:
- from: Pero yo he visto que los necios echaban raíces, y enseguida fue consumida su morada.
  to: Pero yo he visto a necios echando raíces, pero inmediatamente su morada fue consumida.
  rationale: 'Se corrige la conjunción adversativa ἀλλʼ y se ajusta la construcción «he visto a necios echando raíces» al objeto acusativo acompañado por participio presente. No se requiere nota: la traducción «morada» sigue la lectura ya establecida en el audit trail inglés y no se preservó allí una alternativa en nota.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-12T20:21:28Z'
review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva adecuadamente el contraste inicial, el perfecto de experiencia («he visto»), la imagen idiomática de «echar raíces» y la lectura auditada de δίαιτα como «morada». Sin embargo, no refleja el δεύτερο contraste explícito de ἀλλʼ: «y enseguida» debe ser «pero inmediatamente». Además, el participio presente βάλλοντας se representa con mayor precisión como «echando raíces», y ἄφρονας funciona como objeto directo personal de «he visto».'
  spanish_quality_summary: La redacción es clara y digna, pero la coordinación con «y» debilita un contraste importante, y «que los necios echaban» transforma la construcción de objeto con participio en una subordinada con imperfecto. La revisión propuesta resulta más directa, natural y cercana al griego.
  glossary_alignment: «Necios» corresponde bien a ἄφρονας; «echar raíces» conserva naturalmente la metáfora de ῥίζας βάλλοντας; y «morada» sigue la decisión inglesa documentada para δίαιτα. «Consumida» preserva la voz pasiva y el sentido de ἐβρώθη.
  issues:
  - severity: medium
    issue: ἀλλʼ se traduce como «y» en vez de expresar contraste.
    rationale: Después de la primera oposición marcada por δὲ, el griego introduce ἀλλʼ («pero/sino»). «Y enseguida» omite esa relación adversativa; «pero inmediatamente» la preserva.
  - severity: low
    issue: «que los necios echaban raíces» no reproduce con precisión el participio βάλλοντας.
    rationale: ἄφρονας es el objeto de ἑώρακα y βάλλοντας es un participio presente que lo describe. «He visto a necios echando raíces» conserva esa estructura y aspecto mejor que una subordinada con imperfecto.
  revised_spanish_text: Pero yo he visto a necios echando raíces, pero inmediatamente su morada fue consumida.
  revision_rationale: 'Se corrige la conjunción adversativa ἀλλʼ y se ajusta la construcción «he visto a necios echando raíces» al objeto acusativo acompañado por participio presente. No se requiere nota: la traducción «morada» sigue la lectura ya establecida en el audit trail inglés y no se preservó allí una alternativa en nota.'
