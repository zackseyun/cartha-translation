review_pass:
  verdict: revise
  source_fidelity: 'La traducción refleja fielmente la estructura y el sentido del griego: la confirmación futura («Así será»), la condición temporal («cuando sepas que venimos»), la reunión de «todos los tuyos», la preservación de quienes estén bajo el techo y la ruina de quienes se encuentren fuera de la casa. «Preservados» reproduce adecuadamente διασωθήσονται sin imponer un sentido doctrinal específico.'
  naturalness: La redacción es en general clara y natural para el español latinoamericano. Sin embargo, «Y dijeron a ella» es un calco poco idiomático del dativo griego; en español corriente corresponde «Y le dijeron».
  terminology: «Los tuyos», «techo», «preservados» y «perecerán» son elecciones apropiadas y mantienen la amplitud semántica del original. La nota sobre στέγος es pertinente y está correctamente anclada.
  issues:
  - severity: low
    issue: Calco sintáctico en «Y dijeron a ella».
    rationale: Aunque comprensible, esta construcción no es la forma natural de expresar el destinatario indirecto en español. «Y le dijeron» conserva plenamente el sentido de καὶ εἶπαν αὐτῇ.
  revised_text: 'Y le dijeron: «Así será, como nos has dicho. Pero cuando sepas que venimos, reunirás a todos los tuyos bajo tu techo[a], y serán preservados; porque todos los que sean hallados fuera de la casa perecerán».'
  revised_footnotes:
  - marker: a
    text: «Techo» traduce el valor doméstico de στέγος; puede entenderse también como «cubierta» o «techo de la casa».
    reason: lexical_alternative
  revision_rationale: Se reemplaza únicamente «a ella» por «le» para lograr una formulación idiomática en español, sin alterar el sentido ni el registro del texto. Se conserva la nota léxica y su ancla.
