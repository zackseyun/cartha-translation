review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva fielmente la secuencia y el sentido del griego: la confirmación futura («Así será»), la condición temporal de saber que ellos vienen, la reunión de «todos los tuyos» bajo el techo, la preservación pasiva de quienes estén dentro y la destrucción de quienes se encuentren fuera de la casa. «Venimos», «preservados» y «perecerán» son elecciones adecuadas para παραγινομένους, διασωθήσονται y ἀπολοῦνται, respectivamente.'
  spanish_quality_summary: 'La única reparación necesaria en el texto publicable es sustituir «Y dijeron a ella» por el español idiomático «Y le dijeron». El dativo αὐτῇ queda plenamente expresado por el pronombre átono «le»; «a ella» no aporta una distinción enfática presente en el griego y resulta poco natural. La nota sobre «techo» no es necesaria: «techo» es claro en español y las alternativas ofrecidas son redundantes, sin preservar una ambigüedad significativa del original.'
  glossary_alignment: No intervienen los términos teológicos principales del glosario. «Preservados» mantiene apropiadamente el valor contextual y pasivo de διασωθήσονται, sin imponer «salvados». «Los tuyos» conserva el alcance colectivo de πάντας τοὺς σοὺς mejor que limitarlo a «familia».
  issues:
  - severity: low
    issue: Construcción poco idiomática «Y dijeron a ella».
    rationale: Aunque es comprensible y formalmente refleja el dativo griego, el español natural emplea «Y le dijeron». No hay énfasis explícito en αὐτῇ que justifique la construcción perifrástica.
  - severity: low
    issue: Nota léxica innecesaria en «techo».
    rationale: La nota no transmite una alternativa de traducción materialmente relevante y repite «techo» como alternativa. Su supresión mejora la presentación sin pérdida de información necesaria.
  revised_spanish_text: 'Y le dijeron: «Así será, como nos has dicho. Pero cuando sepas que venimos, reunirás a todos los tuyos bajo tu techo, y serán preservados; porque todos los que sean hallados fuera de la casa perecerán».'
  revision_rationale: Se adopta la construcción española natural «le dijeron» y se elimina una nota que no conserva una ambigüedad significativa ni aporta una alternativa útil para el lector.
