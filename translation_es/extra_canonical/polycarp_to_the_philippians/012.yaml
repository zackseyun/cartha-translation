  revision_rationale: Se corrige el referente singular de la petición de arrepentimiento y se mejora una construcción española poco natural. Se mantienen la estructura, los términos históricos, la nota sobre «sus cartas» y las ambigüedades del testimonio de base. La forma femenina plural «enemigas/restáurenlas» concuerda con el antecedente inmediato «Valente y su esposa» y con el plural de «such people»; si la edición de destino prefiere evitar esa concordancia contextual, puede emplear «No consideren enemigas a tales personas; más bien, restáurenlas».
