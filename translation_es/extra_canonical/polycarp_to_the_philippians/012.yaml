review_pass:
  verdict: revise
  source_fidelity: 'Se requiere una corrección de fidelidad importante en la súplica final: el testimonio dice «for him and for his wife, unto whom may the Lord grant true repentance»; el relativo «whom» se refiere en singular a la esposa. El plural «les conceda» extiende sin base explícita la petición a Valente. También se ajusta la formulación sobre las iglesias para conservar que ellas, no los filipenses, son las que «conocían a Dios» entonces.'
  naturalness: El español es generalmente claro, digno y natural para América Latina. Se mejora «¿cómo puede exigírselas a otro?» por una construcción con sujeto y objeto más claros, y se aligera la repetición y la sintaxis del pasaje de las «cartas», manteniendo su rareza mediante nota.
  terminology: «Presbítero», «avaricia», «gentiles», «juicio del Señor», «santos», «arrepentimiento» y «edificar» son elecciones adecuadas. «Sensatos» comunica razonablemente la exhortación a la sobriedad o dominio propio sin limitarla a la abstinencia de alcohol.
  issues:
  - severity: high
    issue: La petición de arrepentimiento se traduce en plural («les conceda»).
    rationale: El antecedente inmediato de «a quien» en el testimonio es «su esposa» y el relativo es singular. El plural cambia el alcance explícito de la petición.
  - severity: medium
    issue: «Todas aquellas iglesias que por entonces eran las únicas que conocían a Dios» puede leerse con un antecedente impreciso.
    rationale: El texto debe dejar claro que la cláusula caracteriza a las iglesias y que el contraste posterior es «nosotros todavía no lo conocíamos».
  - severity: low
    issue: «¿Cómo puede exigírselas a otro?» deja menos explícita la relación entre el autocontrol y la orden dada a otra persona.
    rationale: Una formulación como «¿cómo puede ordenárselo a otro?» conserva mejor la pregunta retórica y su referente.
  revised_text: 'Me entristeció profundamente Valente, quien antes fue presbítero entre ustedes, porque comprende muy poco el cargo que se le confió. Por eso les advierto que se mantengan alejados de la avaricia y sean puros y veraces. Apártense de todo mal.


    Pero quien no puede dominarse en estas cosas, ¿cómo puede ordenárselo a otro? Si alguien no se aparta de la avaricia, quedará contaminado por la idolatría y será juzgado como uno de los gentiles que no conocen el juicio del Señor. Más aún, ¿acaso no sabemos que los santos juzgarán al mundo, como enseña Pablo?


    Pero no he encontrado ni oído hablar de nada semejante entre ustedes, entre quienes trabajó el bienaventurado Pablo y que al principio eran sus cartas.[a] Porque él se gloría de ustedes en todas aquellas iglesias que, en aquel tiempo, eran las únicas que conocían a Dios; pues nosotros todavía no lo conocíamos.


    Por eso estoy profundamente entristecido por él y por su esposa. Que el Señor le conceda a ella un arrepentimiento verdadero. También ustedes deben mantenerse sensatos en este asunto. No los consideren enemigos; más bien, restáurenlos como miembros débiles y extraviados, para que salven a todo el cuerpo. Al actuar así, se edifican unos a otros.'
  revised_footnotes:
  - marker: a
    text: 'La expresión transmitida por el testimonio inglés es inusual: «que al principio eran sus cartas». Puede aludir figuradamente a los filipenses como «cartas» de Pablo; hace falta revisar directamente la tradición griega y latina para precisar la lectura.'
    reason: Se conserva la construcción difícil sin resolverla interpretativamente, dado que el cotejo directo de la tradición antigua sigue pendiente.
  revision_rationale: La revisión corrige el cambio de número en la petición dirigida a la esposa de Valente y hace más transparente la sintaxis de dos frases difíciles. Mantiene la imagen inusual de que los destinatarios eran las «cartas» de Pablo, con una nota prudente, y no introduce explicaciones doctrinales ni una identificación denominacional del presbiterado.
