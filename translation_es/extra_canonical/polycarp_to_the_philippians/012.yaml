base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: es
  text: 'Me entristeció profundamente lo de Valente, quien antes fue presbítero entre ustedes, porque comprende muy poco el cargo que se le confió. Por eso les advierto que se mantengan alejados de la avaricia y sean puros y veraces. Apártense de todo mal.


    Pero quien no puede dominarse en estas cosas, ¿cómo puede exigírselas a otro? Si alguien no se aparta de la avaricia, quedará contaminado por la idolatría y será juzgado como uno de los gentiles que no conocen el juicio del Señor. Es más, ¿acaso no sabemos que los santos juzgarán al mundo, como enseña Pablo?


    Sin embargo, no he encontrado ni oído hablar de nada semejante entre ustedes, en medio de quienes trabajó el bienaventurado Pablo y quienes al principio eran sus cartas.[a] Él se gloría de ustedes en todas aquellas iglesias que por entonces eran las únicas que conocían a Dios, pues nosotros todavía no lo conocíamos.


    Por eso estoy profundamente entristecido por él y por su esposa. Que el Señor les conceda un arrepentimiento verdadero. También ustedes deben mantenerse sensatos en este asunto. No los consideren enemigos; más bien, restáurenlos como miembros débiles y extraviados, para que salven todo el cuerpo que ustedes forman. Al actuar así, se edifican unos a otros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión transmitida por el testimonio inglés es inusual: «quienes al principio eran sus cartas». También puede entenderse como una referencia a los filipenses al comienzo de una carta de Pablo. Hace falta revisar directamente la tradición griega y latina para precisar la lectura.'
    reason: El testimonio inglés suministrado conserva una construcción difícil, y la revisión de las fuentes antiguas está pendiente; la nota preserva la ambigüedad sin imponer una enmienda.
lexical_decisions:
- source_word: presbyter
  choice: presbítero
  rationale: Conserva el título eclesial antiguo sin identificarlo de manera automática con un cargo denominacional moderno.
- source_word: covetousness
  choice: avaricia
  rationale: Expresa el deseo desordenado de poseer y mantiene la conexión tradicional entre avaricia e idolatría.
- source_word: office
  choice: cargo
  rationale: Comunica una responsabilidad encomendada sin precisar más de lo que permite el testimonio suministrado.
- source_word: Gentiles
  choice: gentiles
  rationale: Mantiene la categoría religiosa del texto antiguo y evita sustituirla interpretativamente por «paganos».
- source_word: sober
  choice: mantenerse sensatos
  rationale: En este contexto exhortativo expresa dominio propio y buen juicio, no mera abstinencia de bebidas.
- source_word: restore
  choice: restáurenlos
  rationale: Conserva la metáfora corporal de reincorporar y sanar a miembros débiles y extraviados.
theological_decisions:
- issue: Relación entre avaricia e idolatría
  choice: «quedará contaminado por la idolatría»
  alternative: «se convertirá en idólatra»
  rationale: La formulación elegida conserva la imagen de contaminación del testimonio y evita definir de forma más tajante la naturaleza exacta de esa relación.
- issue: Los santos juzgarán al mundo
  choice: Afirmación directa en futuro
  alternative: Paráfrasis que limite o explique el modo de juzgar
  rationale: Se conserva la tensión teológica y la alusión paulina sin resolver quiénes son los santos ni cómo ejercerán ese juicio.
- issue: Salvar el cuerpo entero
  choice: «para que salven todo el cuerpo que ustedes forman»
  alternative: «para que mantengan sano a todo el cuerpo»
  rationale: Se preserva el verbo fuerte «salvar», sin reducirlo silenciosamente a bienestar comunitario ni definir su alcance soteriológico.
- issue: Arrepentimiento de Valente y su esposa
  choice: «Que el Señor les conceda un arrepentimiento verdadero»
  alternative: «Que el Señor le conceda a ella un arrepentimiento verdadero»
  rationale: El contexto expresa dolor por ambos y la forma plural evita restringir la petición a la esposa; no obstante, el alcance pronominal depende de la tradición textual que aún requiere revisión directa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conservan términos históricos como «presbítero» y «gentiles». El borrador se basa de manera provisional en el testimonio inglés de dominio público y en la capa de consulta auditada proporcionada; requiere cotejo directo con la tradición manuscrita griega y latina.
