base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: es
  text: 'Porque todo el que no confiesa que Jesucristo ha venido en carne es anticristo; y quien no confiesa el testimonio de la cruz procede del diablo. Asimismo, quien tergiversa las palabras del Señor para acomodarlas a sus propios deseos y afirma que no hay resurrección ni juicio, ese es el primogénito de Satanás.


    Por tanto, abandonemos las prácticas vanas de la mayoría y sus falsas enseñanzas, y volvamos a la palabra que nos fue transmitida desde el principio. Mantengámonos sobrios para la oración y perseverantes en los ayunos, suplicando con ruegos al Dios que todo lo ve que no nos lleve a la tentación, tal como dijo el Señor: «El espíritu está dispuesto, pero la carne es débil».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confess
  choice: confiesa
  rationale: Conserva el sentido público de reconocer y declarar, así como la repetición retórica del testimonio.
- source_word: is come in the flesh
  choice: ha venido en carne
  rationale: Mantiene la formulación cristológica concreta y su eco tradicional sin parafrasear ni resolver sus implicaciones.
- source_word: testimony of the Cross
  choice: testimonio de la cruz
  rationale: Traducción formal que preserva la ambigüedad entre el testimonio acerca de la cruz y el testimonio que ella representa.
- source_word: oracles of the Lord
  choice: palabras del Señor
  rationale: Expresión natural y digna en español; evita que «oráculos» sugiera prácticas adivinatorias modernas.
- source_word: firstborn of Satan
  choice: primogénito de Satanás
  rationale: Retiene intacta la fuerte metáfora jerárquica y polémica del testimonio.
- source_word: vain doing of the many
  choice: prácticas vanas de la mayoría
  rationale: Refleja la conducta colectiva, no solo ideas abstractas, con una expresión comprensible en español actual.
- source_word: being sober unto prayer
  choice: Mantengámonos sobrios para la oración
  rationale: Conserva la sobriedad vigilante orientada a la oración, sin reducirla meramente a abstinencia de alcohol.
- source_word: constant in fastings
  choice: perseverantes en los ayunos
  rationale: Mantiene tanto la continuidad como el plural de la práctica ascética.
- source_word: all-seeing God
  choice: Dios que todo lo ve
  rationale: Equivalencia natural que conserva la afirmación de la percepción divina universal.
theological_decisions:
- issue: Identidad de quien niega la encarnación
  choice: «es anticristo»
  alternative: «es el anticristo»
  rationale: Se evita introducir el artículo definido y convertir necesariamente la expresión en referencia a una única figura escatológica.
- issue: Relación con el diablo
  choice: «procede del diablo»
  alternative: «es del diablo»
  rationale: Expresa en español natural pertenencia u origen moral sin identificar ontológicamente a la persona con el diablo.
- issue: Petición sobre la tentación
  choice: «que no nos lleve a la tentación»
  alternative: «que no permita que caigamos en tentación»
  rationale: Conserva la formulación difícil y la tensión teológica de la tradición evangélica, sin suavizarla mediante una explicación interpretativa.
- issue: Disposición del espíritu
  choice: «El espíritu está dispuesto»
  alternative: «El Espíritu está dispuesto»
  rationale: La minúscula preserva la referencia probable al espíritu humano en contraste con la carne, sin imponer explícitamente una lectura pneumatológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la repetición, las afirmaciones polémicas y los ecos bíblicos. Dado que la revisión directa del griego y del latín sigue pendiente, esta versión se basa provisionalmente en el testimonio inglés público suministrado y debe cotejarse con la tradición manuscrita antes de su publicación definitiva.
