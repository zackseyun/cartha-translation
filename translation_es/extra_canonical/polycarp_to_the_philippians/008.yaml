review_pass:
  verdict: revise
  source_fidelity: 'La estructura, las repeticiones y las expresiones cristológicas principales se conservan bien. Sin embargo, «prácticas vanas de la mayoría» interpreta y estrecha «la vanidad de muchos» (τὴν ματαιότητα τῶν πολλῶν): «mayoría» sugiere un bloque mayoritario y «prácticas» no está expresado de modo específico. «Procede del diablo» también atenúa e interpreta «es del diablo».'
  naturalness: El texto es claro y de registro digno. «Suplicando con ruegos» resulta redundante en español; «pidiendo en súplicas» reproduce mejor la construcción sin esa repetición. «La vana conducta de muchos» es natural, aunque conserva el carácter colectivo y moral de la frase.
  terminology: «Ha venido en carne», «anticristo», «testimonio de la cruz», «primogénito de Satanás», «Dios que todo lo ve» y «el espíritu ... la carne» son adecuados. «Dichos del Señor» refleja con más precisión λόγια que el término más genérico «palabras», sin introducir el sentido adivinatorio moderno de «oráculos».
  issues:
  - severity: medium
    issue: «prácticas vanas de la mayoría» por «vain doing of the many»
    rationale: El trasfondo griego τὴν ματαιότητα τῶν πολλῶν se refiere a la vanidad/futilidad de muchos; no exige «prácticas» ni significa específicamente «la mayoría». La revisión evita ambas restricciones interpretativas.
  - severity: low
    issue: «procede del diablo» por «is of the devil»
    rationale: La expresión de pertenencia «es del diablo» es más directa y conserva la formulación polémica del texto; «procede» añade una explicación de origen.
  - severity: low
    issue: «suplicando con ruegos»
    rationale: La combinación es pleonástica en español. «Pidiendo en súplicas» mantiene el énfasis de δεήσεσιν αἰτούμενοι con fluidez.
  - severity: low
    issue: «palabras del Señor»
    rationale: «Dichos del Señor» representa mejor λόγια/oracles como declaraciones o enseñanzas transmitidas, y mantiene la precisión sin recurrir a «oráculos».
  revised_text: 'Porque todo el que no confiesa que Jesucristo ha venido en carne es anticristo; y quien no confiesa el testimonio de la cruz es del diablo. Asimismo, quien tergiversa los dichos del Señor para acomodarlos a sus propios deseos y afirma que no hay resurrección ni juicio, ese es el primogénito de Satanás.


    Por tanto, abandonemos la vana conducta de muchos y sus falsas enseñanzas, y volvamos a la palabra que nos fue transmitida desde el principio. Mantengámonos sobrios para la oración y perseverantes en los ayunos, pidiendo en súplicas al Dios que todo lo ve que no nos lleve a la tentación, tal como dijo el Señor: «El espíritu está dispuesto, pero la carne es débil».'
  revised_footnotes: []
  revision_rationale: Se hacen correcciones puntuales para reflejar con mayor exactitud las expresiones transmitidas, especialmente la referencia a «muchos», la pertenencia «del diablo» y los «dichos» del Señor. Se preservan las afirmaciones polémicas, la ambigüedad de «en carne», la formulación difícil sobre la tentación y el eco evangélico final. No se requieren notas nuevas, pues no hay anclas de nota en el borrador y las correcciones no dependen de una aclaración doctrinal.
