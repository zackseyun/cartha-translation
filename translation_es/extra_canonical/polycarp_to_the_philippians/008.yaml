review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés proporcionado y conserva las repeticiones, las imágenes polémicas y la formulación deliberadamente difícil sobre la tentación. Sin embargo, «la mayoría» estrecha indebidamente «the many» a una mayoría numérica, y «procede del diablo» interpreta como origen lo que el testimonio expresa más escuetamente como pertenencia («is of the devil»). La revisión directa de las tradiciones griega y latina continúa pendiente.
  naturalness: El español es claro, actual y de registro digno. «Los ayunos» y «Dios que todo lo ve» son naturales en este contexto. Se ha evitado la redundancia algo pesada de «suplicando con ruegos» mediante una formulación fluida que conserva la súplica.
  terminology: Se mantienen «anticristo», «en carne», «testimonio de la cruz», «resurrección», «juicio» y «primogénito de Satanás». «Palabras del Señor» representa naturalmente «oracles/sayings» sin las connotaciones modernas de «oráculos».
  issues:
  - severity: medium
    issue: «la mayoría» por «the many»
    rationale: «La mayoría» afirma que se trata de más de la mitad de un grupo, mientras que «the many»/la expresión subyacente se refiere de manera no cuantificada a muchos. «Muchos» preserva el alcance.
  - severity: low
    issue: «procede del diablo» por «is of the devil»
    rationale: «Procede de» explicita una relación de origen. «Es del diablo» conserva la predicación breve y la ambigüedad de pertenencia/origen moral del testimonio.
  - severity: low
    issue: «suplicando con ruegos»
    rationale: La combinación resulta redundante en español actual. «Rogando ... con súplicas» mantiene la intensidad y el matiz formal sin duplicación léxica.
  revised_text: 'Porque todo el que no confiesa que Jesucristo ha venido en carne es anticristo; y quien no confiesa el testimonio de la cruz es del diablo. Asimismo, quien tergiversa las palabras del Señor para acomodarlas a sus propios deseos y afirma que no hay resurrección ni juicio, ese es el primogénito de Satanás.


    Por tanto, abandonemos las prácticas vanas de muchos y sus falsas enseñanzas, y volvamos a la palabra que nos fue transmitida desde el principio. Mantengámonos sobrios para la oración y perseverantes en los ayunos, rogando con súplicas al Dios que todo lo ve que no nos lleve a la tentación, tal como dijo el Señor: «El espíritu está dispuesto, pero la carne es débil».'
  revised_footnotes: []
  revision_rationale: 'Se corrigen dos matices que afectan el alcance y la fuerza de las afirmaciones: «muchos» no presupone una mayoría, y «es del diablo» no convierte una predicación de pertenencia en una declaración explícita de procedencia. También se aligera una redundancia estilística sin alterar el sentido. No se añaden notas, pues no hay anclas de notas en el pasaje ni una variante textual concreta documentada en los materiales suministrados.'
