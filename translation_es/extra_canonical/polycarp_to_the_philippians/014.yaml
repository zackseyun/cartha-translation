base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: es
  text: 'Ustedes mismos e Ignacio me escribieron para pedir que, si alguien fuera a Siria, llevara allá las cartas de ustedes. Así lo haré si se presenta una oportunidad adecuada: iré yo mismo o enviaré a alguien como representante también de parte de ustedes.


    Conforme a lo que nos encargaron, les enviamos adjuntas a esta carta las cartas de Ignacio que él nos hizo llegar, junto con todas las demás que teníamos en nuestro poder. De ellas podrán sacar mucho provecho, pues contienen fe, perseverancia y toda clase de edificación relacionada con nuestro Señor. Además, si tienen noticias confiables acerca de Ignacio y de quienes estaban con él, háganoslas saber.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega y latina.
    reason: La fuente proporcionada identifica expresamente la base de trabajo como un testimonio inglés y señala que la revisión en las lenguas antiguas aún está pendiente.
lexical_decisions:
- source_word: fit opportunity
  choice: oportunidad adecuada
  rationale: Expresa de manera natural la idea de una ocasión propicia sin añadir condiciones no presentes en el testimonio.
- source_word: ambassador
  choice: representante
  rationale: En este contexto epistolar, «representante» comunica con claridad una persona enviada en nombre de otros; «embajador» podría sugerir innecesariamente un cargo diplomático formal.
- source_word: endurance
  choice: perseverancia
  rationale: Conserva la idea de constancia bajo dificultad y resulta idiomático en español cristiano contemporáneo.
- source_word: edification
  choice: edificación
  rationale: Mantiene la metáfora tradicional de fortalecimiento o formación espiritual, ampliamente comprensible en este registro.
- source_word: sure tidings
  choice: noticias confiables
  rationale: Refleja el énfasis en información cierta o digna de confianza.
theological_decisions:
- issue: Relación de la edificación con el Señor
  choice: «toda clase de edificación relacionada con nuestro Señor»
  alternative: «toda clase de edificación que corresponde a nuestro Señor»
  rationale: La base inglesa permite más de una relación sintáctica; «relacionada con» evita precisar indebidamente si la fe, la perseverancia y la edificación en conjunto, o solo la edificación, son las que pertenecen o se refieren al Señor.
- issue: Naturaleza de la misión del enviado
  choice: «representante también de parte de ustedes»
  alternative: «embajador también en favor de ustedes»
  rationale: No se introduce una función eclesiástica técnica ni un oficio formal que el testimonio disponible no exige.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se evita tanto el arcaísmo como la terminología administrativa excesivamente formal. La traducción procura seguir de cerca la estructura y el contenido del testimonio disponible, sin ocultar el carácter provisional de la revisión textual.
