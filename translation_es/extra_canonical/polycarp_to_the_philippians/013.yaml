base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: es
  text: 'Porque estoy convencido de que ustedes conocen bien las Sagradas Escrituras y de que nada se les oculta. Pero a mí no me ha sido concedido eso. Solo recuerden lo que se dice en estas Escrituras: «Enójense, pero no pequen», y: «No permitan que el sol se ponga mientras aún están enojados». Dichoso quien se acuerda de esto; y confío en que así sucede entre ustedes.


    Que el Dios y Padre de nuestro Señor Jesucristo, y el mismo Sumo Sacerdote eterno, Jesucristo, el Hijo de Dios,[a] los edifique en la fe y la verdad, en toda mansedumbre, en la ausencia de ira, en la tolerancia, en la paciencia prolongada, en la perseverancia y en la pureza. Que él les conceda herencia y participación entre sus santos, tanto a ustedes como a nosotros junto con ustedes, y a todos los que están bajo el cielo y han de creer en nuestro Señor y Dios Jesucristo y en su Padre, quien lo resucitó de entre los muertos.


    Oren por todos los santos. Oren también por los reyes, las autoridades y los gobernantes; por quienes los persiguen y los odian, y por los enemigos de la cruz. Así el fruto de ustedes será evidente para todos, y ustedes serán perfectos en él.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado coloca una señal editorial de apertura antes de «Hijo de Dios Jesucristo», probablemente para indicar restauración o incertidumbre textual. La revisión directa de la tradición manuscrita griega y latina está pendiente.
    reason: Hacer visible la incertidumbre textual indicada por el testimonio sin insertar un corchete incompleto en el texto principal.
lexical_decisions:
- source_word: sacred writings / scriptures
  choice: Sagradas Escrituras / Escrituras
  rationale: Conserva la referencia explícita a escritos sagrados reconocidos y mantiene la relación entre la afirmación inicial y las dos citas.
- source_word: Be ye angry and sin not
  choice: Enójense, pero no pequen
  rationale: Reproduce el imperativo y su tensión, sin convertirlo en una prohibición absoluta de toda ira.
- source_word: wrath
  choice: enojados / ira
  rationale: En la cita se usa una expresión natural en español; en la lista de virtudes se conserva el término más formal «ira».
- source_word: lot and portion
  choice: herencia y participación
  rationale: Expresa la doble imagen de recibir una parte asignada entre los santos sin reducirla a una sola idea.
- source_word: long suffering / patient endurance
  choice: paciencia prolongada / perseverancia
  rationale: 'Mantiene diferenciados los dos términos cercanos: soportar por largo tiempo y permanecer firmes.'
- source_word: perfect
  choice: perfectos
  rationale: Conserva la fuerza y posible amplitud moral o espiritual del término, sin resolverlo como mera madurez.
theological_decisions:
- issue: Título cristológico «our Lord and God Jesus Christ»
  choice: nuestro Señor y Dios Jesucristo
  alternative: nuestro Señor Jesucristo y Dios
  rationale: La sintaxis del testimonio suministrado aplica ambos títulos a Jesucristo; se conserva esa lectura sin redistribuir los títulos.
- issue: Sujeto de «que él les conceda»
  choice: Pronombre singular «él», sin explicitar el referente
  alternative: «Que Jesucristo les conceda» o «Que Dios les conceda»
  rationale: La oración tiene referentes divinos próximos y el testimonio usa un pronombre singular; no se elimina esa posible ambigüedad.
- issue: «su Padre, quien lo resucitó»
  choice: Se conserva a Jesucristo como objeto de la resurrección
  alternative: Reestructurar toda la frase para evitar pronombres
  rationale: La relación entre el Padre y el Hijo está gramaticalmente clara en español y corresponde al testimonio suministrado.
- issue: «sean perfectos en él»
  choice: perfectos en él
  alternative: maduros en él / íntegros en él
  rationale: Se mantiene la expresión teológicamente densa y no se restringe su alcance a una interpretación específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y formas verbales correspondientes. Las citas bíblicas se presentan con formulación natural, pero se conserva su carácter imperativo. Dado que la revisión directa del griego y el latín está pendiente, el borrador se mantiene deliberadamente cerca del testimonio público suministrado y señala su principal indicio de incertidumbre textual.
