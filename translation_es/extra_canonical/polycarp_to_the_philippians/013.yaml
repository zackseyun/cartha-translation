review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones. «Solo recuerden» añade un imperativo que no está en el testimonio («Only, as it is said...»). «Herencia y participación» no conserva bien el doblete «lot and portion». La señal editorial de apertura de corchete debe conservarse en el texto y anclarse donde aparece: antes de «Hijo de Dios Jesucristo». La oración de bendición presenta dos referentes explícitos; en español, «los edifiquen» evita atribuir sin base ambos títulos a un único referente, mientras que el singular de la petición siguiente conserva la ambigüedad del testimonio.'
  naturalness: El registro es en general claro y adecuado. Se mejora «ausencia de ira», que suena abstracto y poco idiomático en esta enumeración, y se ajustan las citas y la conclusión para seguir más de cerca la sintaxis del original sin perder naturalidad latinoamericana.
  terminology: Se conservan «Escrituras sagradas», «Sumo Sacerdote», «santos» y «perfectos». «Longanimidad» y «paciencia perseverante» distinguen mejor long-suffering de patient endurance. «Herencia y porción» mantiene la imaginería de una parte asignada.
  issues:
  - severity: medium
    issue: Imperativo añadido en «Solo recuerden lo que se dice».
    rationale: El testimonio no ordena recordar en este punto; introduce dos citas con «como se dice en estas Escrituras».
  - severity: medium
    issue: La señal textual editorial se desplazó y se eliminó del texto principal.
    rationale: El corchete de apertura del testimonio está antes de «Son of God Jesus Christ». La nota por sí sola no preserva plenamente el indicio de incertidumbre o restauración.
  - severity: medium
    issue: «Herencia y participación» para «lot and portion».
    rationale: «Participación» expresa tomar parte, no una porción recibida o asignada. «Herencia y porción» conserva mejor el doblete.
  - severity: low
    issue: «Así el fruto...» reformula la subordinación final.
    rationale: «Para que» reproduce la relación de propósito expresada por «that» sin convertirla en una consecuencia explicativa.
  revised_text: 'Porque estoy convencido de que ustedes están bien instruidos en las Escrituras sagradas y de que nada se les oculta. Pero a mí no me ha sido concedido esto. Solo, como se dice en estas Escrituras: «Enójense y no pequen», y: «No dejen que el sol se ponga sobre su enojo». Dichoso quien se acuerda de esto; y confío en que esto está en ustedes.



    Que Dios, el Padre de nuestro Señor Jesucristo, y él mismo, el Sumo Sacerdote eterno, el [Hijo de Dios Jesucristo,[a] los edifiquen en la fe y la verdad, en toda mansedumbre, en todo evitar la ira, en la tolerancia, en la longanimidad, en la paciencia perseverante y en la pureza. Que él les conceda una herencia y una porción entre sus santos, a ustedes, a nosotros junto con ustedes y a todos los que están bajo el cielo, que creerán en nuestro Señor y Dios Jesucristo y en su Padre, quien lo resucitó de entre los muertos.



    Oren por todos los santos. Oren también por los reyes, las autoridades y los gobernantes, por quienes los persiguen y los odian, y por los enemigos de la cruz, para que el fruto de ustedes se haga evidente ante todos y para que ustedes sean perfectos en él.'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés suministrado conserva un corchete de apertura antes de «Hijo de Dios Jesucristo», sin un corchete de cierre correspondiente. Probablemente señala una restauración o incertidumbre textual. La revisión directa de la tradición manuscrita griega y latina está pendiente.
    reason: Conserva en el texto principal la señal editorial en su posición original y explica su carácter provisional sin resolver la incertidumbre.
  revision_rationale: La revisión elimina una adición interpretativa, preserva el marcador editorial textual, mejora la correspondencia de varios términos de la lista de virtudes y restituye la estructura final de propósito. La construcción de la bendición se hace gramatical en español sin decidir de manera doctrinal el referente singular de «Que él les conceda».
