review_pass:
  verdict: revise
  source_fidelity: Se requiere una revisión puntual. «Conocen bien» debilita «well trained», y «Solo recuerden» introduce un imperativo que no aparece en el testimonio. «Herencia y participación» interpreta y atenúa la doble expresión «lot and portion». Se conserva la señal de incertidumbre editorial mediante nota, sin presentar un corchete de apertura aislado en el texto español.
  naturalness: El registro es generalmente natural y digno para el español latinoamericano. Se ajustan algunas formulaciones para conservar la sintaxis exhortativa y la precisión del original sin perder fluidez.
  terminology: Se mantienen «Sagradas Escrituras», «Sumo Sacerdote», «santos», «Señor y Dios» y «perfectos». «Longanimidad» y «constancia paciente» distinguen mejor los dos términos consecutivos que «paciencia prolongada» y «perseverancia».
  issues:
  - severity: medium
    issue: Imperativo añadido en la introducción de las citas
    rationale: «Solo recuerden lo que se dice» no corresponde a «Only, as it is said in these Scriptures»; el testimonio introduce una apelación a la Escritura, no un nuevo mandato de recordar.
  - severity: medium
    issue: Atenuación de «well trained»
    rationale: «Conocen bien» expresa conocimiento, pero no la idea de estar bien instruidos o formados en los escritos sagrados.
  - severity: medium
    issue: Interpretación de «lot and portion»
    rationale: «Herencia y participación» transforma la imagen doble de una parte asignada y una porción. «Parte y porción» conserva mejor la repetición enfática sin imponer una interpretación.
  - severity: low
    issue: Distinción insuficiente entre long-suffering y patient endurance
    rationale: «Paciencia prolongada» y «perseverancia» son comprensibles, pero «longanimidad» y «constancia paciente» reflejan más claramente la pareja de virtudes del testimonio.
  revised_text: 'Porque estoy convencido de que ustedes están bien instruidos en las Sagradas Escrituras y de que nada se les oculta. Pero a mí no me ha sido concedido esto. Solamente, como se dice en estas Escrituras: «Enójense y no pequen», y: «No permitan que el sol se ponga sobre su ira». Dichoso quien recuerda esto; y confío en que esto está en ustedes.


    Que el Dios y Padre de nuestro Señor Jesucristo, y el mismo Sumo Sacerdote eterno, Jesucristo, el Hijo de Dios,[a] los edifique en la fe y la verdad, en toda mansedumbre, en toda abstención de ira, en la moderación, en la longanimidad, en la constancia paciente y en la pureza. Que él les conceda una parte y una porción entre sus santos, a ustedes y a nosotros junto con ustedes, y a todos los que están bajo el cielo, que creerán en nuestro Señor y Dios Jesucristo y en su Padre, quien lo resucitó de entre los muertos.


    Oren por todos los santos. Oren también por los reyes, las autoridades y los gobernantes, por quienes los persiguen y los odian, y por los enemigos de la cruz, para que el fruto de ustedes sea manifiesto ante todos y para que ustedes sean perfectos en él.'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés suministrado coloca una señal editorial de apertura antes de «Hijo de Dios Jesucristo», probablemente para indicar restauración o incertidumbre textual. La revisión directa de la tradición manuscrita griega y latina está pendiente.
    reason: Hace visible la señal editorial anómala del testimonio suministrado sin introducir en el texto español un corchete de apertura sin cierre.
  revision_rationale: La revisión elimina una exhortación no atestiguada, recupera la noción de formación en los escritos sagrados y conserva con mayor literalidad las parejas léxicas y la imaginería de la bendición. No resuelve la ambigüedad textual señalada en el testimonio inglés ni asigna de manera doctrinal el referente del pronombre «él».
