review_pass:
  verdict: revise
  source_fidelity: La traducción reproduce fielmente el argumento, la metáfora de correr, la referencia a la fe y la justicia, la presencia del Señor y la agencia divina en la resurrección. Sin embargo, «salieron de entre ustedes» puede sugerir que esas personas abandonaron la comunidad, mientras que el testimonio dice que procedían de ella.
  naturalness: El texto es claro y de registro apropiado. Conviene integrar «convencidos de que» en la exhortación, en vez de usar el imperativo independiente «Estén convencidos», que cambia levemente la construcción discursiva. «La vieron» tiene un antecedente posible, pero «esa perseverancia» resulta más claro.
  terminology: «Palabra de justicia», «perseverancia», «bienaventurados», «corrió en vano» y «mundo presente» son opciones adecuadas. Se conservan sin imponer interpretaciones doctrinales.
  issues:
  - severity: medium
    issue: «otros que salieron de entre ustedes»
    rationale: «Came from among yourselves» describe procedencia desde la propia comunidad; «salieron» puede comunicar una salida o ruptura que el testimonio no afirma.
  - severity: low
    issue: «Estén convencidos de que» como oración independiente
    rationale: El participio del testimonio caracteriza a los destinatarios dentro de la exhortación. «Convencidos de que» conserva mejor esa relación y fluye de modo natural en español.
  - severity: low
    issue: Antecedente de «la» en «Ustedes la vieron»
    rationale: Aunque gramaticalmente posible, «esa perseverancia» evita una referencia pronominal algo distante y hace explícita la relación con «toda perseverancia».
  revised_text: 'Por tanto, los exhorto a todos a obedecer la palabra de justicia y a practicar toda perseverancia, esa perseverancia que ustedes vieron con sus propios ojos en los bienaventurados Ignacio, Zósimo y Rufo, así como también en otros que procedían de entre ustedes, y en el mismo Pablo y en los demás apóstoles.


    Convencidos de que ninguno de ellos corrió en vano, sino con fe y justicia, y de que están en el lugar que les corresponde en la presencia del Señor, con quien también padecieron. Porque no amaron el mundo presente, sino a aquel que murió por nosotros y a quien Dios resucitó para nosotros.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado. Aún está pendiente la revisión directa de la tradición manuscrita griega y latina.
    reason: La fuente suministrada indica expresamente que la revisión en las lenguas antiguas sigue pendiente; la nota hace transparente esta limitación textual.
  revision_rationale: La revisión elimina una posible implicación de abandono comunitario en «salieron», mejora la vinculación sintáctica de la convicción con la exhortación y aclara el antecedente de la perseverancia. Mantiene la ambigüedad de «con quien también padecieron», la formulación sobre el lugar ante el Señor y la acción de Dios al resucitar a quien murió por nosotros.
