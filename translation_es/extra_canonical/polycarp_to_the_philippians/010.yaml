base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: es
  text: 'Por tanto, los exhorto a todos a obedecer la palabra de justicia y a practicar toda perseverancia. Ustedes la vieron con sus propios ojos en los bienaventurados Ignacio, Zósimo y Rufo, así como en otros que salieron de entre ustedes, y también en el mismo Pablo y en los demás apóstoles.


    Estén convencidos de que ninguno de ellos corrió en vano, sino con fe y justicia, y de que están en el lugar que les corresponde en la presencia del Señor, con quien también padecieron. Porque no amaron este mundo presente, sino al que murió por nosotros y a quien Dios resucitó para nosotros.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado. Aún está pendiente la revisión directa de la tradición manuscrita griega y latina.
    reason: La fuente suministrada indica expresamente que la revisión en las lenguas antiguas sigue pendiente; la nota hace transparente esta limitación textual.
lexical_decisions:
- source_word: word of righteousness
  choice: palabra de justicia
  rationale: 'Conserva la formulación tradicional y su posible amplitud semántica: mensaje, enseñanza o palabra caracterizada por la justicia.'
- source_word: all endurance
  choice: toda perseverancia
  rationale: «Perseverancia» expresa resistencia fiel y sostenida de manera natural en español latinoamericano.
- source_word: blessed
  choice: bienaventurados
  rationale: Mantiene el sentido honorífico y religioso sin sugerir necesariamente una canonización formal posterior.
- source_word: ran not in vain
  choice: ninguno de ellos corrió en vano
  rationale: Preserva la metáfora atlética paulina presente en el testimonio, en vez de explicarla en términos abstractos.
- source_word: present world
  choice: este mundo presente
  rationale: Reproduce el contraste temporal y moral sin identificar «mundo» exclusivamente con la creación material.
theological_decisions:
- issue: El referente de «con quien también padecieron»
  choice: con quien también padecieron
  alternative: por quien también padecieron
  rationale: Se conserva la asociación del padecimiento con el Señor y la ambigüedad del testimonio, sin convertirla silenciosamente en una afirmación causal.
- issue: Estado de los fieles fallecidos
  choice: están en el lugar que les corresponde en la presencia del Señor
  alternative: han recibido el lugar que les correspondía junto al Señor
  rationale: Mantiene la afirmación de cercanía al Señor sin añadir una doctrina más precisa sobre el estado intermedio o la recompensa.
- issue: Agencia en la resurrección
  choice: a quien Dios resucitó
  alternative: que resucitó
  rationale: Conserva explícitamente la acción de Dios tal como aparece en el testimonio suministrado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conservan las metáforas y tensiones del testimonio. La puntuación divide la extensa oración inglesa para facilitar la lectura sin alterar su progresión argumental.
