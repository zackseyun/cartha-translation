base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: es
  text: 'También los ancianos deben ser compasivos y misericordiosos con todos: hacer volver a las ovejas extraviadas, visitar a todos los enfermos y no desatender a ninguna viuda, huérfano o pobre. Más bien, deben procurar siempre lo que es honorable ante Dios y ante la gente; abstenerse de toda ira, favoritismo y juicio injusto; mantenerse lejos de todo amor al dinero; no apresurarse a creer ninguna acusación contra nadie ni a emitir juicio, sabiendo que todos somos deudores del pecado.[a]


    Por tanto, si rogamos al Señor que nos perdone, también nosotros debemos perdonar, pues estamos ante los ojos de nuestro Señor y Dios. Todos tendremos que comparecer ante el tribunal de Cristo, y cada uno dará cuenta de sí mismo.


    Sirvámosle, entonces, con temor y con toda reverencia, como él mismo mandó, y como proclamaron los apóstoles que nos anunciaron la buena noticia y los profetas que anunciaron de antemano la venida de nuestro Señor. Seamos fervientes por lo bueno y mantengámonos apartados de los tropiezos,[b] de los falsos hermanos y de quienes llevan hipócritamente el nombre del Señor y desvían a la gente insensata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Deudores del pecado» reproduce una expresión difícil y conserva abierta la naturaleza exacta de esa deuda.
    reason: Evitar resolver silenciosamente una ambigüedad teológica reconocida por la capa de consulta inglesa.
  - marker: b
    text: También podría traducirse «ocasiones de caer» u «ofensas».
    reason: El testimonio inglés permite más de un matiz y la revisión directa del griego y del latín sigue pendiente.
lexical_decisions:
- source_word: presbyters (English witness; underlying ancient-language form pending review)
  choice: ancianos
  rationale: Es la designación eclesial más transparente y natural en español general; evita el matiz sacerdotal que «presbíteros» puede sugerir en algunas tradiciones.
- source_word: respect of persons
  choice: favoritismo
  rationale: Expresa con claridad el trato parcial basado en la condición o identidad de una persona.
- source_word: debtors of sin
  choice: deudores del pecado
  rationale: Conserva la metáfora y su tensión interpretativa sin explicar si se refiere a culpa, obligación o deuda causada por el pecado.
- source_word: judgment-seat of Christ
  choice: tribunal de Cristo
  rationale: Mantiene la imagen judicial de comparecer y rendir cuentas.
- source_word: offenses
  choice: tropiezos
  rationale: Conserva una posible imagen de obstáculos que hacen caer, sin reducirla simplemente a faltas morales.
- source_word: foolish men
  choice: gente insensata
  rationale: Comunica falta de discernimiento, no de capacidad intelectual, y funciona de manera inclusiva en español natural.
theological_decisions:
- issue: Sentido de «deudores del pecado»
  choice: Se conserva literalmente la metáfora.
  alternative: «Culpables de pecado» o «en deuda por nuestros pecados».
  rationale: El testimonio suministrado deja abierta la relación precisa entre deuda y pecado; resolverla impondría una interpretación.
- issue: Identificación de «nuestro Señor y Dios» y «Cristo»
  choice: Se mantienen las expresiones en la secuencia del testimonio, sin añadir una explicación identificadora.
  alternative: Reformular para identificar explícitamente ambos títulos con Jesucristo.
  rationale: La traducción no debe introducir una aclaración doctrinal que el pasaje no formula de manera explícita.
- issue: Mandato, apóstoles y profetas en la última exhortación
  choice: «como él mismo mandó, y como proclamaron los apóstoles… y los profetas…»
  alternative: Hacer que solo el Señor sea sujeto de «mandó» y presentar a apóstoles y profetas sin coordinación sintáctica.
  rationale: La puntuación y coordinación del testimonio inglés son compactas; esta formulación conserva a los tres como autoridades convergentes sin atribuirles exactamente la misma función.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefieren oraciones directas y vocabulario comprensible sin perder la cadencia exhortativa. Este borrador es necesariamente provisional porque el material proporcionado identifica el testimonio inglés de dominio público como base inmediata y señala que la revisión directa de la tradición manuscrita griega y latina sigue pendiente.
