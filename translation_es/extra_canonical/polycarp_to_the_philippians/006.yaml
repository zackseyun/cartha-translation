review_pass:
  verdict: revise
  source_fidelity: La revisión se limita provisionalmente al testimonio inglés suministrado, pues no se ha proporcionado aún una edición griega o latina para cotejo directo. El borrador conserva la secuencia argumental y las exhortaciones principales, pero «como servidores de Dios y de Cristo» borra el título «diáconos» en una cláusula donde el testimonio lo repite expresamente, y «guiados por la verdad» debilita la imagen ética de «caminar conforme a la verdad». La formulación de la tercera expresión de la lista sexual requiere mayor cautela, ya que su alcance preciso es discutido.
  naturalness: El español es mayormente claro, actual y adecuado para un texto exhortativo. Se mejora la repetición léxica entre «diáconos» y «servidor (diácono)», se restituye «andando conforme a», y se usa «deseos mundanos» para una expresión natural que conserva el contraste moral del contexto sin introducir una categoría más específica de la necesaria.
  terminology: «Diáconos», «presbíteros», «reino de Dios» y «vírgenes» son apropiados y preservan el registro eclesial antiguo. Se mantiene «afeminados» como traducción tradicional y literal aproximada, con una nota que advierte su dificultad semántica. Para ἀρσενοκοῖται se adopta una expresión deliberadamente literal y se revisa la nota para no presentar como indiscutida una interpretación que sigue siendo objeto de debate.
  issues:
  - severity: medium
    issue: El cargo de los diáconos se traduce como «servidores» en la primera mención.
    rationale: El testimonio dice «as deacons of God and Christ» y seguidamente explota el vínculo entre «deacon» y el servicio del Señor. «Como diáconos de Dios y de Cristo» preserva tanto el título como el juego léxico.
  - severity: low
    issue: «Guiados por la verdad del Señor» sustituye la metáfora de caminar.
    rationale: El testimonio dice «walking according to the truth». «Andando conforme a la verdad del Señor» mantiene la metáfora ética y no convierte la verdad en un agente que guía.
  - severity: medium
    issue: La nota c afirma sin suficiente reserva que la expresión siguiente se refiere a varones que mantienen relaciones sexuales con varones.
    rationale: El compuesto antiguo es literalmente transparente en esa dirección, pero su referente y alcance técnico exactos son disputados. La traducción y la nota deben conservar esa dificultad sin decidirla de manera exhaustiva.
  revised_text: 'Sabiendo, pues, que de Dios nadie se burla, debemos andar de una manera digna de su mandamiento y de su gloria.


    Asimismo, los diáconos deben ser irreprochables ante su justicia, como diáconos de Dios y de Cristo, y no de los seres humanos. No deben ser calumniadores, ni de doble palabra, ni amantes del dinero, sino moderados en todo, compasivos, diligentes y andando conforme a la verdad del Señor, quien se hizo servidor[a] de todos. Porque, si le agradamos en este mundo presente, también recibiremos el mundo venidero, tal como él prometió resucitarnos de entre los muertos. Y, si vivimos de una manera digna de él, también reinaremos con él, si en verdad tenemos fe.


    Asimismo, los jóvenes deben ser irreprochables en todo, velando ante todo por la pureza y refrenándose de todo mal. Porque es bueno abstenerse de los deseos mundanos, pues todo deseo combate contra el Espíritu.[b] Ni los sexualmente inmorales, ni los afeminados, ni los varones que se acuestan con varones[c] heredarán el reino de Dios; tampoco los que hacen cosas indebidas. Por tanto, es justo abstenerse de todas estas cosas y someterse a los presbíteros y a los diáconos como a Dios y a Cristo.[d] Las vírgenes deben andar con una conciencia irreprochable y pura.'
