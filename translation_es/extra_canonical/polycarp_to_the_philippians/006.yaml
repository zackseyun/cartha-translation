review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones puntuales. «Guiados por la verdad» atenúa y altera la metáfora ética de «caminar ըստ/según la verdad»; debe conservarse «andando/caminando conforme a la verdad». La mayúscula en «Espíritu» resuelve indebidamente una ambigüedad que la nota reconoce. «Malos deseos» añade una calificación que el término fuente no expresa de modo léxico, aunque el contexto sea exhortativo. El ancla [a] está colocada dentro de «servidor[a]», lo que produce una forma gráfica errónea.
  naturalness: El texto es en general claro, sobrio y natural para el español latinoamericano. «De doble palabra» es comprensible, aunque «de doble lengua» conserva mejor la imagen y suena suficientemente natural en este registro. «Quienes hacen lo impropio» mejora levemente «los que hacen cosas indebidas».
  terminology: «Diáconos», «presbíteros», «reino de Dios» y «vírgenes» son adecuados. Debe conservarse el juego léxico entre diáconos y el Señor como «servidor/diácono». En la lista sexual, «afeminados» mantiene una traducción tradicional y literal de un término difícil, pero requiere nota; «quienes se acuestan con varones» evita especificar más de lo que permite el término antiguo y no fusiona las expresiones en una categoría moderna.
  issues:
  - severity: medium
    issue: «guiados por la verdad del Señor»
    rationale: 'El testimonio dice «walking according to the truth». «Guiados» cambia la construcción: presenta la verdad como agente rector, en vez de describir la conducta como un caminar conforme a ella.'
  - severity: medium
    issue: «Espíritu» con mayúscula
    rationale: La propia nota admite que el referente puede ser el espíritu humano. La mayúscula impone una lectura teológica que el texto transmitido no obliga a adoptar.
  - severity: low
    issue: «malos deseos» / «todo mal deseo»
    rationale: La calificación «malos» es una inferencia contextual. «Deseos» preserva el alcance léxico y deja que la exhortación inmediata comunique su valoración.
  - severity: medium
    issue: Ancla «servidor[a]»
    rationale: La colocación del marcador dentro de la palabra parece una flexión o una errata. Debe ir después de «todos» o inmediatamente después de «servidor» sin alterar el texto.
  - severity: low
    issue: Interpretación demasiado específica de ἀρσενοκοῖται
    rationale: «Los hombres que tienen relaciones sexuales con hombres» es posible, pero perfila la acción más de lo que hace el sustantivo antiguo y suprime la forma abierta de la expresión. Una formulación más cercana conserva mejor la dificultad.
  revised_text: 'Sabiendo, pues, que Dios no es objeto de burla, debemos andar de una manera digna de su mandamiento y de su gloria.


    Asimismo, los diáconos deben ser irreprochables ante su justicia, como diáconos de Dios y de Cristo, y no de seres humanos. No deben ser calumniadores, ni de doble lengua, ni amantes del dinero, sino dueños de sí mismos en todo, compasivos, diligentes y andando conforme a la verdad del Señor, quien se hizo servidor de todos[a]. Porque, si le agradamos en este mundo presente, también recibiremos el mundo venidero, tal como él prometió resucitarnos de entre los muertos. Y, si vivimos de una manera digna de él, también reinaremos con él, si en verdad tenemos fe.


    Asimismo, los jóvenes deben ser irreprochables en todo, velando ante todo por la pureza y refrenándose de todo mal. Porque es bueno abstenerse de los deseos del mundo, pues todo deseo combate contra el espíritu[b]. Ni los sexualmente inmorales, ni los afeminados, ni quienes se acuestan con varones[c] heredarán el reino de Dios; tampoco quienes hacen lo impropio. Por tanto, es justo abstenerse de todas estas cosas y someterse a los presbíteros y a los diáconos como a Dios y a Cristo[d]. Las vírgenes deben andar con una conciencia irreprochable y pura.'
  revised_footnotes:
  - marker: a
    text: 'El término traducido «servidor» pertenece a la misma familia léxica que «diácono» y crea un juego de palabras: el Señor se hizo servidor —o «diácono»— de todos.'
    reason: Preserva explícitamente el vínculo léxico entre el cargo de los diáconos y el servicio del Señor, sin forzar «diácono» como único sentido en el texto principal.
  - marker: b
    text: «Espíritu» también puede entenderse aquí como el espíritu humano; la forma transmitida no permite eliminar por completo esa ambigüedad.
    reason: La minúscula en el texto principal evita imponer una identificación con el Espíritu de Dios, mientras que la nota conserva ambas posibilidades.
  - marker: c
    text: La lista reproduce tres expresiones antiguas distintas. «Afeminados» traduce de forma literal un término discutido; la expresión siguiente se refiere literalmente a quienes se acuestan con varones. No se han fusionado ambas expresiones en una categoría moderna.
    reason: Señala la dificultad semántica e histórica sin anacronismo ni armonización doctrinal.
  - marker: d
    text: La comparación «como a Dios y a Cristo» expresa la seriedad de la obediencia exhortada; no afirma necesariamente que los presbíteros y diáconos sean divinos.
    reason: Conserva la comparación fuerte del texto sin imponer una conclusión ontológica.
  revision_rationale: La revisión conserva el tono exhortativo, la terminología eclesial y la estructura condicional del pasaje. Corrige cambios de sentido introducidos por «guiados», elimina una inferencia léxica innecesaria en «malos deseos», deja sin resolver la referencia de «espíritu» y mejora la ubicación del marcador de nota. Dado que el encargo proporciona un testimonio inglés y señala que la revisión directa de las tradiciones griega y latina está pendiente, se mantienen las ambigüedades sensibles y las notas explicativas.
