base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: es
  text: 'Sabiendo, pues, que de Dios nadie se burla, debemos andar de una manera digna de su mandamiento y de su gloria.


    Asimismo, los diáconos deben ser irreprochables ante su justicia, como servidores de Dios y de Cristo, y no de los seres humanos. No deben ser calumniadores, ni de doble palabra, ni amantes del dinero, sino moderados en todo, compasivos, diligentes y guiados por la verdad del Señor, quien se hizo servidor[a] de todos. Porque, si le agradamos en este mundo presente, también recibiremos el mundo venidero, tal como él prometió resucitarnos de entre los muertos. Y, si vivimos de una manera digna de él, también reinaremos con él, si en verdad tenemos fe.


    Asimismo, los jóvenes deben ser irreprochables en todo, velando ante todo por la pureza y refrenándose de todo mal. Porque es bueno abstenerse de los malos deseos que hay en el mundo, pues todo mal deseo combate contra el Espíritu.[b] Ni los sexualmente inmorales, ni los afeminados, ni los hombres que tienen relaciones sexuales con hombres[c] heredarán el reino de Dios; tampoco los que hacen cosas indebidas. Por tanto, es justo abstenerse de todas estas cosas y someterse a los presbíteros y a los diáconos como a Dios y a Cristo.[d] Las vírgenes deben andar con una conciencia irreprochable y pura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El término traducido «servidor» pertenece a la misma familia verbal que «diácono» y crea un juego de palabras: el Señor se hizo servidor —o «diácono»— de todos.'
    reason: Preservar el vínculo léxico señalado por el testimonio sin forzar «diácono» en el texto principal.
  - marker: b
    text: «Espíritu» también puede entenderse aquí como «espíritu» humano; la forma transmitida no permite eliminar por completo esa ambigüedad.
    reason: Conservar una ambigüedad teológica genuina.
  - marker: c
    text: La lista reproduce tres expresiones antiguas distintas. «Afeminados» es una traducción literal de un término discutido; la frase siguiente se refiere a varones que mantienen relaciones sexuales con varones. No se han fusionado ambas expresiones en una categoría moderna.
    reason: Advertir la dificultad histórica y semántica sin armonización denominacional ni anacronismo.
  - marker: d
    text: La comparación «como a Dios y a Cristo» expresa la seriedad de la obediencia exhortada; no afirma necesariamente que los presbíteros y diáconos sean divinos.
    reason: Preservar el lenguaje fuerte y prevenir una lectura ontológica no exigida por el texto.
lexical_decisions:
- source_word: διακον- (reflejado por “minister/deacon” en el testimonio)
  choice: servidores / servidor, con nota «diácono»
  rationale: Conserva el vínculo léxico entre el cargo de los diáconos y el servicio del Señor sin emplear «diácono» de manera antinatural para Cristo.
- source_word: walk
  choice: andar / vivir / guiados
  rationale: Se mantiene «andar» donde funciona como metáfora ética reconocible, pero se emplean formulaciones naturales cuando la repetición literal resultaría rígida.
- source_word: double-tongued
  choice: de doble palabra
  rationale: Expresa la duplicidad verbal y mantiene la imagen antigua mejor que una paráfrasis demasiado específica.
- source_word: lusts / every lust
  choice: malos deseos / todo mal deseo
  rationale: En el contexto se trata de deseos censurados, no de todo deseo humano sin distinción; «malos» hace explícita esa fuerza contextual.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva el término eclesial antiguo sin identificarlo de forma exclusiva con un cargo denominacional moderno.
- source_word: virgins
  choice: vírgenes
  rationale: Traducción directa que preserva el grupo específico al que se dirige la exhortación.
theological_decisions:
- issue: «Every desire wages war against the Spirit»
  choice: «todo mal deseo combate contra el Espíritu»
  alternative: «todo deseo combate contra el espíritu»
  rationale: Se mantiene «Espíritu» con mayúscula según el testimonio, pero una nota reconoce que la expresión puede entenderse como referencia al Espíritu de Dios o al espíritu humano.
- issue: Terminología sexual de la lista de vicios
  choice: «los sexualmente inmorales, los afeminados y los hombres que tienen relaciones sexuales con hombres»
  alternative: Formulaciones más generales o la adopción de una categoría moderna única
  rationale: Se conservan como tres expresiones distintas, sin fusionarlas bajo una identidad sexual moderna ni borrar el término históricamente difícil «afeminados».
- issue: Sumisión «como a Dios y a Cristo»
  choice: Traducción directa con nota aclaratoria
  alternative: «como corresponde ante Dios y Cristo»
  rationale: La comparación es teológicamente fuerte y debe preservarse; la nota evita resolverla como equivalencia ontológica entre ministros y Dios.
- issue: Promesa de resurrección y reinado condicionada por la fe
  choice: Se conserva la secuencia y la condición «si en verdad tenemos fe»
  alternative: Reformular la condición como mera perseverancia o certeza
  rationale: Preserva la tensión exhortativa del pasaje sin imponer un sistema doctrinal posterior.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono exhortativo y eclesial antiguo. Dado que la revisión directa del griego y del latín está pendiente y el material suministrado es un testimonio inglés de dominio público, esta redacción debe considerarse provisional; las decisiones especialmente sensibles se señalan en notas.
