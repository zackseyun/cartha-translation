review_pass:
  verdict: revise
  source_fidelity: Se requiere corrección. El borrador sigue una expansión de la POB inglesa («Enseñemos... a nuestras esposas») que no aparece en el testimonio fuente suministrado, el cual coordina a «nuestras esposas» como quienes también han de andar. Además, «toda clase de males» atenúa «all troubles», y «fidelidad» interpreta «in all truth» de manera más estrecha que el testimonio permite.
  naturalness: El español es generalmente claro y de registro digno. La revisión propuesta conserva esa naturalidad, pero recupera el paralelismo exhortativo y emplea «maledicencia» para distinguir la segunda falta de «calumnia».
  terminology: Se conservan «amor al dinero», «armadura de la justicia», «andar», «temor de Dios» y «altar de Dios». «En toda verdad» mantiene la amplitud de la expresión recibida; «instruir» conserva el doble uso de «training/disciplina» sin reducirlo a la mera crianza.
  issues:
  - severity: high
    issue: «Enseñemos también a nuestras esposas» introduce una acción que el testimonio fuente no expresa.
    rationale: 'La construcción suministrada dice «and then our wives also, to walk...»: tras la exhortación a que nosotros aprendamos a andar, incluye a las esposas como sujeto de «andar», no como objeto de una nueva orden de enseñar.'
  - severity: medium
    issue: «Toda clase de males» modifica y atenúa «all troubles».
    rationale: El testimonio dice «all troubles». La fórmula «toda clase de» fue elegida para evitar una lectura absoluta, pero esa limitación no está expresada en el texto recibido.
  - severity: medium
    issue: «Con toda fidelidad» restringe «in all truth».
    rationale: La fidelidad matrimonial puede estar incluida contextualmente, pero «truth» no se limita necesariamente a ella. «En toda verdad» conserva la formulación amplia.
  - severity: medium
    issue: «Criar a sus hijos» no reproduce plenamente «to train their children in the training of the fear of God».
    rationale: «Criar» puede referirse al cuidado y la educación general; la repetición de «train/training» enfatiza instrucción o formación en el temor de Dios.
  revised_text: 'Pero el amor al dinero es el comienzo de todos los males. Por tanto, sabiendo que nada trajimos al mundo y que tampoco podemos sacar nada de él, armémonos con la armadura de la justicia y aprendamos primero nosotros mismos a andar conforme al mandamiento del Señor;


    luego, que también nuestras esposas anden en la fe que les ha sido dada, en amor y pureza; que amen a sus propios maridos en toda verdad, que amen a todos por igual con toda castidad y que instruyan a sus hijos en la disciplina del temor de Dios.


    Nuestras viudas deben ser sensatas en lo que respecta a la fe del Señor; deben interceder sin cesar por todos y abstenerse de toda calumnia, maledicencia, falso testimonio, amor al dinero y toda cosa mala. Deben saber que son el altar de Dios, que todos los sacrificios son examinados cuidadosamente y que nada se le escapa: ni sus pensamientos, ni sus intenciones ni ninguno de los secretos del corazón.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega y latina.
    reason: La fuente suministrada identifica el inglés como base de redacción y declara pendiente la revisión directa de las lenguas antiguas. La nota comunica esa limitación textual sin interpretar el pasaje.
  revision_rationale: La revisión da prioridad al testimonio fuente proporcionado y corrige la expansión presente en la auditoría inglesa. También preserva cuantificadores y términos amplios sin resolverlos doctrinalmente ni suavizarlos. Se mantiene la nota de transparencia textual y su ancla al final del pasaje.
