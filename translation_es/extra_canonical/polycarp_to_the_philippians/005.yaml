source:
  text: 'But the love of money is the beginning of all troubles. Knowing therefore that we brought nothing into the world neither can we carry anything out, let us arm ourselves with the armor of righteousness, and let us teach ourselves first to walk in the commandment of the Lord;


    and then our wives also, to walk in the faith that hath been given unto them and in love and purity, cherishing their own husbands in all truth and loving all men equally in all chastity, and to train their children in the training of the fear of God.


    Our widows must be sober-minded as touching the faith of the Lord, making intercession without ceasing for all men, abstaining from all calumny, evil speaking, false witness, love of money, and every evil thing, knowing that they are God''s altar, and that all sacrifices are carefully inspected, and nothing escapeth Him either of their thoughts or intents or any of the secret things of the heart.'
