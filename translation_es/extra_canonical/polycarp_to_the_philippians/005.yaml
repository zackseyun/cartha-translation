base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: es
  text: 'Pero el amor al dinero es el principio de toda clase de males. Por tanto, sabiendo que nada trajimos al mundo y que tampoco podemos llevarnos nada de él, armémonos con la armadura de la justicia y aprendamos primero nosotros mismos a andar conforme al mandamiento del Señor.


    Enseñemos también a nuestras esposas a andar en la fe que les ha sido dada, en amor y pureza; a amar a sus propios maridos con toda fidelidad, a amar a todos por igual con absoluta castidad y a criar a sus hijos en la disciplina del temor de Dios.


    Nuestras viudas deben ser sensatas en lo que respecta a la fe del Señor; deben interceder sin cesar por todos y abstenerse de toda calumnia, de hablar mal, de dar falso testimonio, del amor al dinero y de todo mal. Han de saber que son altar de Dios, que todos los sacrificios son examinados cuidadosamente y que nada se le escapa: ni sus pensamientos, ni sus intenciones, ni ninguno de los secretos del corazón.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega y latina.
    reason: La fuente proporcionada identifica expresamente el texto inglés como base de redacción y señala que aún no se ha realizado la revisión directa de las lenguas antiguas; la nota hace transparente esa limitación textual.
lexical_decisions:
- source_word: love of money
  choice: amor al dinero
  rationale: Expresa de manera clara y directa la codicia monetaria sin restringirla al simple acto de poseer riquezas.
- source_word: all troubles
  choice: toda clase de males
  rationale: Conserva el alcance general de la expresión transmitida y produce una formulación natural en español; «toda clase» evita forzar la afirmación como si cada mal individual tuviera necesariamente una sola causa.
- source_word: armor of righteousness
  choice: armadura de la justicia
  rationale: Mantiene la imagen militar y la amplitud ética y teológica de «justicia».
- source_word: walk
  choice: andar
  rationale: Conserva la metáfora bíblica de la conducta habitual, comprensible en español actual.
- source_word: in all truth
  choice: con toda fidelidad
  rationale: En este contexto matrimonial, «fidelidad» comunica naturalmente una conducta sincera, leal y verdadera sin reducirla a una mera afirmación verbal de verdad.
- source_word: sober-minded
  choice: sensatas
  rationale: Comunica dominio propio, sobriedad de juicio y buen criterio en un registro natural.
- source_word: God's altar
  choice: altar de Dios
  rationale: Preserva sin explicación añadida la metáfora cultual aplicada colectivamente a las viudas.
- source_word: intents
  choice: intenciones
  rationale: Distingue los propósitos internos de los pensamientos, conforme a la enumeración del testimonio.
theological_decisions:
- issue: Alcance de la máxima sobre el amor al dinero
  choice: «el principio de toda clase de males»
  alternative: «el principio de todos los males»
  rationale: La opción elegida conserva la fuerza proverbial sin resolverla como una afirmación causal absoluta; además refleja de manera idiomática la amplitud de la expresión recibida.
- issue: Metáfora de las viudas como altar
  choice: Conservar «son altar de Dios» sin interpretación
  alternative: Explicarla como referencia exclusiva a sus oraciones u ofrendas
  rationale: La imagen puede abarcar su intercesión, consagración y servicio, pero el texto no define de forma explícita un único referente; se preserva así su tensión teológica.
- issue: Sujeto que examina los sacrificios y conoce el corazón
  choice: «nada se le escapa»
  alternative: Nombrar explícitamente a Dios en cada cláusula
  rationale: El antecedente divino está claro por «altar de Dios»; el pronombre mantiene la cohesión del testimonio sin añadir una repetición ausente.
- issue: Responsabilidad de enseñar a las esposas
  choice: «Enseñemos también a nuestras esposas»
  alternative: «y luego nuestras esposas también deben andar»
  rationale: Se mantiene el enlace exhortativo y pedagógico del testimonio suministrado, sin convertir la frase en una orden independiente ni borrar la responsabilidad de los destinatarios.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las metáforas bíblicas y cultuales («andar», «armadura», «altar») sin paráfrasis doctrinales. Las exhortaciones se presentan con sintaxis clara y paralela, evitando arcaísmos como «sobrias de mente» o formulaciones regionales.
