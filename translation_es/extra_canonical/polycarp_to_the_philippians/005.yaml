    Nuestras viudas deben ser sensatas en lo que respecta a la fe del Señor; deben interceder sin cesar por todos y abstenerse de toda calumnia, de hablar mal, de dar falso testimonio, del amor al dinero y de todo mal. Han de saber que son el altar de Dios, que todos los sacrificios son examinados cuidadosamente y que nada se le escapa: ni sus pensamientos, ni sus intenciones, ni ninguno de los secretos del corazón.[a]'
