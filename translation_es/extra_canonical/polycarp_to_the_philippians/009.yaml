review_pass:
  verdict: revise
  source_fidelity: 'El borrador refleja fielmente el testimonio inglés disponible: conserva la esperanza, la «garantía» de la justicia identificada con Jesucristo, el «madero», la ausencia de pecado y engaño, el sufrimiento vicario y la vida «en él». Sin embargo, «él mismo nos dio este ejemplo» no expresa plenamente «in His own person», y «en esto hemos creído» cambia sin necesidad el pasado simple del testimonio y vuelve menos claro el objeto de creer.'
  naturalness: El español es natural, actual y apropiado para un texto exhortativo de registro digno. «Madero», «engaño» y «perseverancia» funcionan bien en español latinoamericano neutral. «En su propia persona» es algo más formal, pero resulta claro y conserva un énfasis presente en el testimonio.
  terminology: «Garantía» es una opción válida para «earnest», y la nota explica adecuadamente los matices de «prenda» y «anticipo». «Madero» conserva la imagen recibida sin reemplazarla interpretativamente por «cruz». «Perseverancia» comunica adecuadamente «endurance».
  issues:
  - severity: medium
    issue: Se omite «en su propia persona» al describir el ejemplo dado por Cristo.
    rationale: «Él mismo nos dio este ejemplo» enfatiza al sujeto, pero no reproduce la expresión del testimonio «He gave this example to us in His own person». Conviene conservar explícitamente el matiz personal o encarnado sin desarrollarlo doctrinalmente.
  - severity: low
    issue: «En esto hemos creído» modifica el tiempo y hace menos directo el objeto de «believed this».
    rationale: El testimonio inglés usa pasado simple («we believed this»). «Y creímos esto» mantiene el objeto abierto y el tiempo narrativo sin imponer una interpretación de su referente.
  revised_text: 'Por tanto, aferrémonos sin cesar a nuestra esperanza y a la garantía[a] de nuestra justicia, que es Jesucristo. Él llevó nuestros pecados en su propio cuerpo sobre el madero. No cometió pecado ni se halló engaño en su boca; pero por nosotros lo soportó todo, para que viviéramos en él.


    Por tanto, imitemos su perseverancia. Y si llegáramos a sufrir por causa de su nombre, glorifiquémoslo, pues nos dio este ejemplo en su propia persona, y creímos esto.'
  revised_footnotes:
  - marker: a
    text: 'También puede traducirse «prenda» o «anticipo»: algo dado como garantía de lo que ha de cumplirse.'
    reason: Aclara el sentido antiguo de «earnest» reflejado por el testimonio inglés y conserva su doble matiz de garantía y anticipo.
  revision_rationale: La revisión es limitada y se atiene al testimonio inglés, dado que la revisión directa de las tradiciones griega y latina sigue pendiente. Restituye «en su propia persona» y conserva el pasado de «creímos», sin resolver de manera interpretativa el referente de «esto».
