base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: es
  text: 'Por tanto, aferrémonos sin cesar a nuestra esperanza y a la garantía[a] de nuestra justicia, que es Jesucristo. Él llevó nuestros pecados en su propio cuerpo sobre el madero. No cometió pecado ni se halló engaño en su boca; pero por nosotros lo soportó todo, para que viviéramos en él.


    Por tanto, imitemos su perseverancia. Y si llegáramos a sufrir por causa de su nombre, glorifiquémoslo, pues él mismo nos dio este ejemplo, y en esto hemos creído.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse «prenda» o «anticipo»: algo dado como garantía de lo que ha de cumplirse.'
    reason: Aclara el sentido antiguo de «earnest» reflejado por el testimonio inglés y conserva su doble matiz de garantía y anticipo.
lexical_decisions:
- source_word: earnest
  choice: garantía
  rationale: En el testimonio inglés, “earnest” designa una prenda o primer anticipo que garantiza el cumplimiento futuro. «Garantía» comunica con claridad esa función en español latinoamericano actual, mientras la nota conserva el matiz de «prenda/anticipo».
- source_word: tree
  choice: madero
  rationale: Conserva la formulación bíblica tradicional que alude a la cruz sin sustituirla directamente por «cruz».
- source_word: endurance
  choice: perseverancia
  rationale: 'Expresa la constancia de Cristo al soportar el sufrimiento y permite una exhortación natural: «imitemos su perseverancia».'
- source_word: guile
  choice: engaño
  rationale: Es una expresión actual y digna para la ausencia de falsedad o dolo en su boca.
- source_word: live in Him
  choice: viviéramos en él
  rationale: Mantiene la frase relacional «en él» y su posible densidad teológica, sin explicarla como mera vida recibida por medio de Cristo.
theological_decisions:
- issue: «La garantía de nuestra justicia» identificada con Jesucristo
  choice: Se conserva «nuestra justicia» y el relativo singular «que es Jesucristo».
  alternative: «La garantía de que seremos justificados, es decir, Jesucristo».
  rationale: La alternativa resolvería interpretativamente la relación entre Cristo, la garantía y la justicia. El texto mantiene esa relación de forma compacta, por lo que la traducción preserva su tensión.
- issue: La finalidad «para que viviéramos en él»
  choice: Se mantiene «en él».
  alternative: «Para que recibiéramos vida por medio de él».
  rationale: «En él» puede expresar unión, esfera de vida o relación con Cristo; para no reducir esa amplitud, se conserva la formulación.
- issue: Confesión final de fe
  choice: «Y en esto hemos creído».
  alternative: «Y creímos en él» o «y creímos este mensaje».
  rationale: El testimonio disponible admite una referencia relativamente abierta de «esto». La traducción evita fijarla exclusivamente en la persona de Cristo o en una proposición concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean exhortaciones inclusivas en primera persona plural y vocabulario bíblico comprensible. Dado que la ficha indica que la revisión directa del griego y el latín sigue pendiente, este borrador se basa de manera provisional en el testimonio público inglés suministrado y evita afirmar como definitivas cuestiones que requieren cotejo con la tradición manuscrita.
