base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/001.yaml
  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: es
  text: 'Policarpo y los presbíteros que están con él, a la iglesia de Dios que reside como extranjera en Filipos: Que la misericordia y la paz de Dios Todopoderoso y de Jesucristo, nuestro Salvador, les sean multiplicadas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Polycarp
  choice: Policarpo
  rationale: Forma tradicional y ampliamente reconocida del nombre en español.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva el término eclesial antiguo y evita identificarlo sin más con una estructura moderna; «ancianos» también sería posible.
- source_word: sojourneth
  choice: reside como extranjera
  rationale: Mantiene la idea de residencia temporal o condición peregrina presente en el lenguaje del testimonio, en vez de reducirla a «estar» o «vivir».
- source_word: be multiplied
  choice: les sean multiplicadas
  rationale: Reproduce la forma intensificadora de la salutación antigua sin sustituirla por un simple deseo de abundancia.
theological_decisions:
- issue: Fuente de la misericordia y la paz
  choice: «de Dios Todopoderoso y de Jesucristo, nuestro Salvador»
  alternative: «de Dios Todopoderoso, y Jesucristo nuestro Salvador»
  rationale: La redacción conserva a ambos como vinculados con la bendición sin desarrollar una interpretación doctrinal que el saludo no explicita.
- issue: Identidad peregrina de la iglesia
  choice: «la iglesia de Dios que reside como extranjera»
  alternative: «la iglesia de Dios que reside»
  rationale: Se preserva el matiz teológico y social de peregrinación o extranjería sugerido por el verbo tradicional, aunque la revisión directa del griego y del latín está pendiente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la forma epistolar antigua y se usa «ustedes/les» de manera implícita. El borrador es necesariamente provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega y latina está pendiente.
