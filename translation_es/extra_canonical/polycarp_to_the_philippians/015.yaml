base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: es
  text: Les escribo estas cosas por medio de Crescente, a quien les recomendé hace poco y ahora vuelvo a recomendarles, pues se ha conducido irreprochablemente entre nosotros; y creo que también se conducirá de la misma manera entre ustedes. Asimismo, reciban como recomendada a su hermana cuando vaya a visitarlos. Que estén bien en la gracia del Señor Jesucristo, ustedes y todos los suyos. Amén.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Aún está pendiente el cotejo directo con la tradición manuscrita griega y latina; en particular, debe verificarse si la frase acerca de la conducta de Crescente entre los destinatarios tiene sentido futuro o presente/perfecto.
    reason: La fuente proporcionada advierte que la revisión en las lenguas antiguas está pendiente, y la forma inglesa presenta una ambigüedad relevante.
lexical_decisions:
- source_word: by/through Crescens
  choice: por medio de Crescente
  rationale: Expresa que Crescente lleva o entrega la carta, sin sugerir que sea su autor; se usa la forma española tradicional del nombre.
- source_word: commended
  choice: recomendé / vuelvo a recomendarles / reciban como recomendada
  rationale: Mantiene el sentido epistolar de acreditar a una persona ante la comunidad y reproduce la repetición del testimonio.
- source_word: walked blamelessly
  choice: se ha conducido irreprochablemente
  rationale: Traslada el modismo moral «andar» a una expresión natural en español, conservando la valoración ética sin afirmar perfección absoluta.
- source_word: Fare ye well
  choice: Que estén bien
  rationale: Funciona como despedida epistolar digna y actual, evitando el arcaísmo «pasen bien».
- source_word: in grace
  choice: en la gracia
  rationale: Conserva la formulación teológica y su vínculo con el Señor Jesucristo, sin reducirla a un simple saludo cortés.
theological_decisions:
- issue: Alcance de «en la gracia» en la despedida
  choice: Que estén bien en la gracia del Señor Jesucristo
  alternative: Que la gracia del Señor Jesucristo esté con ustedes
  rationale: La opción elegida conserva más de cerca la construcción atestiguada y no convierte la frase en una fórmula paulina distinta.
- issue: Referencia temporal de la conducta de Crescente entre los filipenses
  choice: también se conducirá de la misma manera entre ustedes
  alternative: también se ha conducido de la misma manera entre ustedes
  rationale: El testimonio inglés principal permite cierta vacilación, mientras que la POB inglesa entiende una expectativa futura; se mantiene esa lectura de forma provisional y se señala la necesidad de cotejo directo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se evitan arcaísmos. La redacción conserva el carácter de recomendación personal y despedida cristiana de la carta.
