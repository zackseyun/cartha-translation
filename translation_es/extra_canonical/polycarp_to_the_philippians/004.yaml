base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: es
  text: 'Hermanos, les escribo estas cosas acerca de la justicia, no porque yo mismo me haya impuesto esta tarea, sino porque ustedes me lo pidieron.


    Pues ni yo ni ningún otro como yo somos capaces de seguir la sabiduría del bienaventurado y glorioso Pablo. Cuando estuvo entre ustedes, enseñó cuidadosamente y con certeza, cara a cara con los hombres de aquel tiempo, la palabra acerca de la verdad. Y cuando estuvo ausente, también les escribió una carta. Si la examinan con atención, podrán ser edificados en la fe que les fue dada,


    la cual es la madre de todos nosotros, mientras la esperanza la sigue y el amor va delante: el amor a Dios y a Cristo, y a nuestro prójimo. Porque, si alguien se ocupa de estas cosas, ha cumplido el mandamiento de la justicia; pues quien tiene amor está lejos de todo pecado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Esta traducción es provisional: se basa en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega y latina; por ello, ciertos detalles sintácticos y léxicos podrían requerir ajuste.'
    reason: La fuente aportada identifica expresamente el texto inglés como base de redacción y señala que la revisión en las lenguas antiguas está pendiente.
lexical_decisions:
- source_word: brethren
  choice: Hermanos
  rationale: Conserva el tratamiento fraternal comunitario del testimonio sin añadir una formulación ajena a la base disponible.
- source_word: righteousness
  choice: justicia
  rationale: Mantiene el campo semántico ético y teológico tradicional, tanto al comienzo como en «el mandamiento de la justicia».
- source_word: laid this charge upon myself
  choice: me haya impuesto esta tarea
  rationale: Expresa en español natural que Policarpo no asumió la responsabilidad por iniciativa propia.
- source_word: blessed and glorious
  choice: bienaventurado y glorioso
  rationale: Conserva los dos calificativos honoríficos y su tono solemne.
- source_word: word which concerneth truth
  choice: la palabra de la verdad
  rationale: Representa de forma idiomática la relación entre «palabra» y «verdad», sin desarrollar su referente más allá del testimonio.
- source_word: built up unto the faith
  choice: edificados en la fe
  rationale: Retiene la metáfora de edificación y evita reducirla a mera instrucción intelectual.
- source_word: occupied with these
  choice: se ocupa de estas cosas
  rationale: Mantiene deliberadamente abierto el referente plural, que puede abarcar la fe, la esperanza y el amor.
- source_word: far from all sin
  choice: lejos de todo pecado
  rationale: Conserva la imagen espacial y la fuerza general de la afirmación.
theological_decisions:
- issue: La fe como «madre de todos nosotros»
  choice: «la cual es la madre de todos nosotros»
  alternative: Reformular la fe como origen, fundamento o madre de todas las virtudes
  rationale: Se preserva la metáfora y su posible tensión teológica sin explicarla ni armonizarla.
- issue: Orden y relación entre fe, esperanza y amor
  choice: «mientras la esperanza la sigue y el amor va delante»
  alternative: Presentar las tres virtudes en el orden convencional «fe, esperanza y amor» sin relaciones espaciales
  rationale: Mantiene las imágenes de seguimiento y precedencia transmitidas por el testimonio, sin resolver exactamente cómo se relacionan.
- issue: Cumplimiento del mandamiento de la justicia por medio del amor
  choice: «ha cumplido el mandamiento de la justicia»
  alternative: «cumple toda justicia» o «cumple la ley»
  rationale: Evita identificar «mandamiento» con «ley» o ampliar la afirmación más allá de la evidencia suministrada.
- issue: Amor y ausencia de pecado
  choice: «quien tiene amor está lejos de todo pecado»
  alternative: «quien ama no peca»
  rationale: Conserva la formulación metafórica y evita convertirla en una afirmación absoluta distinta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usó «ustedes» para el plural y se conservaron las metáforas de edificación, maternidad, seguimiento, precedencia y distancia del pecado. La puntuación divide períodos ingleses muy extensos para facilitar la lectura sin cambiar la secuencia argumental.
