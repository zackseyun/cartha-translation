base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: es
  text: 'Me alegré muchísimo con ustedes en nuestro Señor Jesucristo, porque recibieron a quienes son ejemplos del amor verdadero[a] y los ayudaron a continuar su viaje, como correspondía que hicieran. Ellos estaban rodeados de cadenas santas, las cuales son las coronas de quienes han sido verdaderamente escogidos por Dios y por nuestro Señor.


    También me alegré porque la raíz firme de la fe de ustedes, reconocida desde tiempos antiguos, permanece hasta hoy y da fruto para nuestro Señor Jesucristo. Él soportó incluso la muerte por nuestros pecados, pero Dios lo resucitó y desató los dolores del Hades.[b] Aunque ustedes no lo vieron, creen en él con una alegría inexpresable y llena de gloria. Muchos desean entrar en esa alegría, pues ustedes saben que han sido salvados por gracia, no por obras, sino por la voluntad de Dios mediante Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión también puede traducirse «a quienes representan el amor verdadero» o «a quienes imitan el amor verdadero».
    reason: «μιμήματα» admite matices de ejemplo, representación e imitación; la nota preserva esa amplitud.
  - marker: b
    text: 'Hades: el mundo o morada de los muertos; aquí no designa necesariamente el lugar de castigo final.'
    reason: Aclara un término antiguo que suele confundirse en español con «infierno».
lexical_decisions:
- source_word: τὰ μιμήματα τῆς ἀληθοῦς ἀγάπης
  choice: a quienes son ejemplos del amor verdadero
  rationale: «μιμήματα» comunica ejemplos, representaciones o imitaciones. «Ejemplos» resulta natural en español y evita reducir la expresión a simples «seguidores». No se conserva la mayúscula de «Love» del testimonio inglés, pues esa distinción tipográfica no pertenece al griego antiguo.
- source_word: τοῖς ἁγιοπρεπέσιν δεσμοῖς
  choice: cadenas santas
  rationale: Expresa de manera concisa la dignidad religiosa atribuida a las cadenas de los prisioneros; el sentido más literal puede ser «cadenas dignas de los santos» o «venerables».
- source_word: διαδήματα
  choice: coronas
  rationale: El término designa diademas o coronas como señal de honor. «Coronas» es claro y conserva la imagen sin sonar innecesariamente técnico.
- source_word: τὴν βεβαίαν τῆς πίστεως ὑμῶν ῥίζαν
  choice: la raíz firme de la fe de ustedes
  rationale: Mantiene la metáfora agrícola y traduce la estabilidad expresada por «βεβαίαν».
- source_word: τὰς ὠδῖνας τοῦ ᾅδου
  choice: los dolores del Hades
  rationale: Conserva la formulación tradicional y su eco de Hechos 2:24, sin identificar interpretativamente el Hades con el infierno de castigo final.
- source_word: χάριτί ἐστε σεσῳσμένοι
  choice: han sido salvados por gracia
  rationale: El perfecto perifrástico presenta una salvación realizada cuyos efectos permanecen. La formulación también conserva el eco de Efesios 2:8.
theological_decisions:
- issue: Relación entre «Dios» y «nuestro Señor» en la elección
  choice: escogidos por Dios y por nuestro Señor
  alternative: escogidos por nuestro Dios y Señor
  rationale: Se conserva la coordinación de los referentes sin fusionarlos en un solo título cristológico ni determinar de manera más precisa una sintaxis que puede suscitar discusión.
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: lugar de los muertos / infierno
  rationale: «Hades» mantiene el término del texto y evita imponer la idea posterior y más específica del lugar de castigo final.
- issue: Gracia, obras y voluntad divina
  choice: han sido salvados por gracia, no por obras, sino por la voluntad de Dios
  alternative: Dios los salva por su bondad y no por lo que hacen
  rationale: La traducción conserva la tensión y el vocabulario teológico del pasaje, sin ampliar la afirmación hacia controversias doctrinales posteriores.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se mantienen las imágenes de raíz, fruto, cadenas y coronas. La puntuación divide el largo período antiguo para facilitar la lectura sin alterar sus relaciones principales. Dado que el expediente indica que la revisión directa de toda la tradición manuscrita griega y latina sigue pendiente, las decisiones se apoyan en el testimonio suministrado y en las formas griegas identificables del pasaje; deberán verificarse en la auditoría textual final.
