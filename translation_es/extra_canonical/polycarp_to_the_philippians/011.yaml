base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: es
  text: 'Por tanto, manténganse firmes en estas cosas y sigan el ejemplo del Señor: firmes en la fe e inconmovibles; con amor fraternal, afectuosos unos con otros; participantes de la verdad; anticipándose unos a otros en la mansedumbre del Señor, sin despreciar a nadie.


    Cuando puedan hacer el bien, no lo pospongan, porque la ayuda al necesitado libra de la muerte.[a] Sométanse todos unos a otros, manteniendo una conducta irreprochable entre los gentiles, para que por sus buenas obras reciban elogio y el Señor no sea blasfemado en ustedes.[b]


    Pero ¡ay de aquel por quien sea blasfemado el nombre del Señor! Por tanto, enseñen a todos la sobriedad, en la cual ustedes mismos también viven.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «La ayuda al necesitado» traduce un término que también puede verterse «limosna» o «misericordia». El texto no precisa si «la muerte» se refiere a la muerte física, espiritual o final.
    reason: Explicita el carácter activo de la misericordia sin imponer una interpretación sobre la clase de muerte ni sobre el alcance teológico de la afirmación.
  - marker: b
    text: 'Lit.: «el Señor no sea blasfemado en ustedes».'
    reason: Conserva el anclaje literal y deja abierta la relación que la formulación original expresa.
  - marker: c
    text: «Sobriedad» también puede traducirse «sensatez» o «dominio propio». El término abarca juicio sobrio y autodisciplina, no solo abstinencia de bebidas alcohólicas.
    reason: Aclara el rango semántico de la exhortación.
lexical_decisions:
- source_word: kindly affectioned one to another / love of the brotherhood
  choice: amándose unos a otros con afecto fraternal
  rationale: Expresa de manera natural tanto el afecto mutuo como el amor propio de la comunidad de hermanos, sin limitarlo al parentesco biológico.
- source_word: partners with the truth
  choice: unidos a la verdad
  rationale: Conserva la idea de participación o comunión con la verdad en un español claro; «socios de la verdad» resultaría poco natural.
- source_word: forestalling one another
  choice: adelantándose unos a otros
  rationale: Mantiene la imagen de tomar la iniciativa respecto de los demás, sin determinar en exceso si significa precederlos u honrarlos.
- source_word: gentleness
  choice: bondad
  rationale: El testimonio inglés refleja una cualidad amable y benigna del Señor; «bondad» es natural, aunque el término también puede entenderse como amabilidad o mansedumbre.
- source_word: Pitifulness
  choice: compasión
  rationale: Aquí se refiere a la misericordia activa hacia quien padece necesidad, no a un sentimiento peyorativo de lástima.
- source_word: conversation
  choice: conducta
  rationale: El uso antiguo significa modo de vivir, no conversación verbal.
- source_word: soberness
  choice: sensatez
  rationale: Comunica dominio propio y juicio sobrio en lenguaje contemporáneo, sin reducirlo únicamente a la abstinencia de alcohol.
theological_decisions:
- issue: La afirmación «la compasión libra de la muerte»
  choice: Se conserva literalmente la relación entre compasión y liberación de la muerte.
  alternative: Interpretarla como una afirmación explícita sobre obtener salvación eterna por obras o limitarla a librar de la muerte física.
  rationale: El texto disponible no define la clase de muerte ni explica el mecanismo; se preserva la tensión sin imponer una doctrina soteriológica.
- issue: El Señor blasfemado «en ustedes»
  choice: «por causa de ustedes»
  alternative: «en ustedes»
  rationale: Aclara en español la relación causal probable entre una conducta reprochable y la blasfemia, manteniendo que el descrédito recae sobre el Señor debido a ellos.
- issue: Sujeción mutua
  choice: «Sométanse todos unos a otros»
  alternative: Suavizarlo como «respétense» o restringirlo a una jerarquía eclesial.
  rationale: Conserva la reciprocidad y la fuerza del mandato sin introducir una estructura denominacional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para la segunda persona plural. Debido a que la revisión directa del griego y del latín está pendiente, la redacción sigue de manera cautelosa el testimonio inglés de dominio público y señala las ambigüedades relevantes.
