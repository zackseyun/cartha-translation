    issue: «Compasión» para «Pitifulness»
    rationale: El trasfondo léxico es ἐλεημοσύνη, que denota misericordia expresada en ayuda o limosna, no solo un sentimiento de compasión. La afirmación sobre librar de la muerte se conserva sin especificar qué clase de muerte es.
  - severity: medium
    issue: «Bondad» para «gentleness»
    rationale: 'La cualidad expresada es πραΰτης: mansedumbre, apacibilidad o gentileza. «Bondad» desplaza el sentido hacia benevolencia moral.'
  - severity: low
    issue: «Por causa de ustedes» sustituye «en ustedes»
    rationale: Aunque la paráfrasis causal es plausible, el testimonio dice «in you». Debe mantenerse la formulación más abierta y literal para no resolver su relación semántica.
  - severity: low
    issue: «Unidos a la verdad»
    rationale: Atenúa la idea de participación o comunión indicada por «partners with the truth».
