base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: es
  text: 'Por tanto, cíñanse la cintura[a] y sirvan a Dios con temor y verdad. Abandonen la palabrería vana y vacía y el error de la mayoría, pues ustedes han creído en aquel que resucitó de entre los muertos a nuestro Señor Jesucristo, le dio gloria y le concedió un trono a su derecha. A él fueron sometidas todas las cosas que están en el cielo y en la tierra; a él sirve todo ser que respira. Él viene como juez de vivos y muertos, y Dios pedirá cuentas por su sangre a quienes lo desobedecen.[b]


    El que lo resucitó de entre los muertos también nos resucitará a nosotros, si hacemos su voluntad, vivimos conforme a sus mandamientos y amamos lo que él amó. Abstengámonos de toda injusticia, codicia, amor al dinero, difamación y falso testimonio. No devolvamos mal por mal, insulto por insulto, golpe por golpe ni maldición por maldición.


    Más bien, recordemos las palabras que pronunció el Señor cuando enseñó: «No juzguen, para que no sean juzgados. Perdonen, y serán perdonados. Tengan misericordia, para que reciban misericordia. Con la medida con que ustedes midan, se les volverá a medir». Y también: «Dichosos los pobres y los perseguidos por causa de la justicia, porque de ellos es el reino de Dios».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «cíñanse la cintura» significa prepararse y disponerse para actuar.
    reason: Aclara un modismo antiguo conservando su imagen en el texto principal.
  - marker: b
    text: «Pedirá cuentas por su sangre» expresa que Dios hará responsables a los desobedientes por la sangre derramada. El referente exacto de «lo» no se explicita más en la formulación conservada.
    reason: Explica la expresión judicial y señala una ambigüedad pronominal sin resolverla de manera dogmática.
  - marker: c
    text: Aquí el texto dice «los pobres», sin añadir «en espíritu».
    reason: Evita armonizar silenciosamente esta cita con una forma distinta transmitida en los Evangelios.
lexical_decisions:
- source_word: gird up your loins
  choice: cíñanse la cintura
  rationale: Conserva la imagen bíblica de disponerse para actuar; la nota aclara el sentido idiomático para lectores actuales.
- source_word: vain and empty talking
  choice: palabrería vana y vacía
  rationale: Mantiene la doble caracterización del discurso inútil sin recurrir a un giro arcaico.
- source_word: the error of the many
  choice: el error de la mayoría
  rationale: Conserva la referencia colectiva sin identificarla con un grupo doctrinal específico.
- source_word: walk in his commandments
  choice: vivimos conforme a sus mandamientos
  rationale: Expresa de manera natural la metáfora semítica de andar como conducta habitual.
- source_word: covetousness, love of money
  choice: codicia, amor al dinero
  rationale: Retiene los dos vicios relacionados, pero no idénticos, presentes en el testimonio.
- source_word: evil speaking
  choice: difamación
  rationale: Comunica el habla perjudicial contra otros en español contemporáneo y digno.
- source_word: quick and dead
  choice: vivos y muertos
  rationale: Traduce el sentido histórico de quick, no su forma inglesa actualmente ambigua.
theological_decisions:
- issue: Referente de aquel que resucitó a Jesús
  choice: Dios queda identificado por la estructura de la oración, sin insertar una explicación doctrinal dentro del texto.
  alternative: Nombrar explícitamente a «Dios Padre».
  rationale: El testimonio identifica al agente como Dios más adelante, pero no añade aquí el título «Padre».
- issue: Responsabilidad por la sangre de Cristo
  choice: Dios pedirá cuentas por su sangre a quienes lo desobedecen.
  alternative: Dios exigirá la sangre de Cristo de quienes desobedecen a Cristo.
  rationale: La formulación conserva el lenguaje judicial y la tensión del pronombre, sin precisar más de lo que permite el testimonio disponible.
- issue: Condición vinculada con la resurrección
  choice: Se conserva «si hacemos su voluntad».
  alternative: Reformular la condición como mera evidencia de fe o como causa meritoria.
  rationale: El texto presenta explícitamente una condición; explicarla según un sistema soteriológico particular resolvería indebidamente su tensión.
- issue: Los pobres en la bienaventuranza
  choice: los pobres
  alternative: los pobres en espíritu
  rationale: El testimonio suministrado dice simplemente «the poor»; no se armoniza con otra forma canónica de la bienaventuranza.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se conservan las cadencias exhortativas y las alusiones bíblicas. Dado que la revisión directa del griego y del latín está pendiente y el material suministrado es un testimonio inglés de dominio público, el borrador evita decisiones excesivamente específicas y señala las principales ambigüedades.
