review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones puntuales. «The error of the many» corresponde a «el error de muchos», no necesariamente a «el error de la mayoría». Además, la ubicación del trono se vincula con la diestra de Dios, según el testimonio inglés («at God’s right hand»); «a su derecha» deja en español un antecedente equívoco. En el segundo párrafo, los imperativos «Abstengámonos / No devolvamos» alteran la subordinación condicional del texto, que presenta esas conductas como participios dependientes de «si hacemos su voluntad». La revisión directa de las tradiciones griega y latina sigue pendiente, por lo que esta valoración se limita al testimonio suministrado y a su audit trail inglés.
  naturalness: «Prepárense para actuar» expresa de forma moderna y natural el modismo de ceñirse los lomos, sin conservar un calco corporal poco idiomático como «cíñanse la cintura». «Hablar mal de otros» cubre con naturalidad el sentido amplio de «evil speaking», sin restringirlo indebidamente a la difamación o la calumnia.
  terminology: Se conserva «Dios», «nuestro Señor Jesucristo», «resucitó», «vivos y muertos», «mandamientos», «misericordia» y «reino de Dios». Se mantiene «los pobres», sin armonizar la cita con «pobres en espíritu».
  issues:
  - severity: medium
    issue: «el error de la mayoría» traduce «the error of the many».
    rationale: «La mayoría» presupone más de la mitad o un grupo mayoritario; «muchos» no contiene necesariamente esa precisión.
  - severity: medium
    issue: «le concedió un trono a su derecha» es ambiguo.
    rationale: En español puede entenderse como un trono a la derecha de Jesucristo. El audit trail especifica que el trono está a la derecha de Dios.
  - severity: medium
    issue: Los imperativos «Abstengámonos» y «No devolvamos» rompen la sintaxis condicional.
    rationale: El texto vincula abstenerse y no devolver mal con la cláusula «si hacemos su voluntad...», no los formula como nuevas exhortaciones independientes.
  - severity: low
    issue: La nota b afirma una ambigüedad pronominal que el texto revisado puede evitar.
    rationale: El antecedente de «le» es el Señor/Juez mencionado inmediatamente antes; mantener la nota podría crear una incertidumbre no exigida por el testimonio.
  revised_text: 'Por tanto, prepárense para actuar y sirvan a Dios con temor y verdad. Abandonen la palabrería vana y vacía y el error de muchos, pues han creído en aquel que resucitó de entre los muertos a nuestro Señor Jesucristo, le dio gloria y le concedió un trono a la derecha de Dios. A él fueron sometidas todas las cosas que están en el cielo y en la tierra; a él sirve todo ser que respira. Él viene como juez de vivos y muertos, y Dios pedirá cuentas por su sangre a quienes le desobedecen.


    El que lo resucitó de entre los muertos también nos resucitará a nosotros, si hacemos su voluntad, vivimos conforme a sus mandamientos y amamos lo que él amó, absteniéndonos de toda injusticia, codicia, amor al dinero, hablar mal de otros y falso testimonio, sin devolver mal por mal, insulto por insulto, golpe por golpe ni maldición por maldición.


    Más bien, recordemos las palabras que pronunció el Señor cuando enseñó: «No juzguen, para que no sean juzgados. Perdonen, y serán perdonados. Tengan misericordia, para que reciban misericordia. Con la medida con que ustedes midan, se les volverá a medir». Y también: «Dichosos los pobres y los perseguidos por causa de la justicia, porque de ellos es el reino de Dios».[c]'
  revised_footnotes:
  - marker: c
    text: Aquí el texto dice «los pobres», sin añadir «en espíritu».
    reason: Evita armonizar silenciosamente esta cita con una forma distinta transmitida en los Evangelios.
  revision_rationale: La revisión corrige tres desviaciones de sentido y sintaxis, elimina una ambigüedad española evitable sobre la diestra de Dios y reemplaza un calco poco natural por una formulación moderna equivalente. Se conserva la condición relativa a la resurrección sin imponer una explicación doctrinal, así como la forma no armonizada de la bienaventuranza.
