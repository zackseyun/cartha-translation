base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: es
  text: Pero un hombre llamado Quinto, un frigio recién llegado de Frigia, perdió el valor al ver las fieras. Él había obligado a sí mismo y a algunos otros a presentarse voluntariamente. Después de insistirle mucho, el procónsul lo persuadió a prestar juramento y a ofrecer incienso. Por eso, hermanos, no elogiamos a quienes se entregan, pues el evangelio no nos enseña a actuar así.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta traducción es provisional y se basa en un antiguo testimonio inglés de dominio público; queda pendiente la revisión directa del texto griego.
    reason: La información suministrada indica que todavía no se ha realizado la revisión de la fuente en griego, por lo que debe transparentarse la base textual indirecta.
lexical_decisions:
- source_word: turned coward
  choice: perdió el valor
  rationale: Expresa en español natural el desfallecimiento ante las fieras sin añadir un juicio más fuerte que el del testimonio disponible.
- source_word: come forward of their own free will
  choice: presentarse voluntariamente
  rationale: Conserva la idea de comparecer por iniciativa propia ante las autoridades.
- source_word: swear the oath
  choice: prestar juramento
  rationale: Fórmula idiomática y digna que mantiene la referencia al juramento exigido por la autoridad.
- source_word: offer incense
  choice: ofrecer incienso
  rationale: Mantiene de forma directa el acto cultual mencionado en el testimonio.
- source_word: deliver themselves up
  choice: se entregan
  rationale: Conserva la acción reflexiva de ponerse voluntariamente en manos de las autoridades.
- source_word: Gospel
  choice: evangelio
  rationale: Se traduce como nombre común de la enseñanza evangélica, sin decidir si alude a un escrito concreto.
theological_decisions:
- issue: Valoración de quienes buscan voluntariamente el martirio
  choice: no elogiamos a quienes se entregan
  alternative: condenamos a quienes se entregan
  rationale: El testimonio dice que no se los alaba; evita intensificarlo hasta una condena explícita.
- issue: Sentido de «evangelio»
  choice: el evangelio no nos enseña a actuar así
  alternative: el Evangelio no nos manda hacer esto
  rationale: Mantiene la afirmación sobre lo que el evangelio enseña sin convertirla en una referencia inequívoca a un libro ni restringirla al lenguaje de mandato.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la repetición de «frigio» y «Frigia» propia del testimonio. «Hermanos» reproduce la forma tradicional inclusiva del grupo destinatario sin introducir una expansión interpretativa.
