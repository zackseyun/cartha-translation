review_pass:
  verdict: revise
  source_fidelity: El borrador refleja fielmente la estructura, el contraste entre Cristo y los mártires, y la formulación difícil sobre «el mundo ... de los que se salvan». No obstante, «quienes también vigilaban» pierde el objeto expresado por el testimonio («nos vigilaban / nos mantenían bajo vigilancia»), y «jamás podremos» puede ajustarse mejor al futuro de imposibilidad de la declaración narrativa.
  naturalness: El español es en general moderno, digno y natural. «Recoger su pobre cuerpo» es posible, pero «llevarnos su pobre cuerpo» expresa con mayor precisión que se impedía a la comunidad retirarlo. «El mundo entero de los que son salvados» conserva la dificultad, aunque requiere la nota ya provista.
  terminology: «El Maligno», «martirio», «corona de la inmortalidad», «Crucificado», «Hijo de Dios», «adoramos» y «mártires» son elecciones adecuadas. «Amamos» mantiene correctamente la distinción textual frente a la adoración debida al Hijo de Dios. Se conservan Nicetes, Herodes y Alce conforme al testimonio inglés suministrado.
  issues:
  - severity: medium
    issue: El objeto de «vigilaban» no está expresado.
    rationale: El testimonio inglés dice que los judíos «also kept watch when we were about to take it from the fire»; la construcción subyacente se entiende como vigilancia sobre la comunidad que intentaba retirar el cuerpo. «Nos vigilaban» conserva esa relación y evita presentar una vigilancia inespecífica.
  - severity: low
    issue: «Jamás podremos abandonar» suaviza la formulación de imposibilidad futura.
    rationale: «Nos será imposible ... abandonar» reproduce más de cerca la afirmación de que no será posible renunciar a Cristo ni adorar a otro, sin alterar su fuerza retórica.
  - severity: low
    issue: «Recoger su pobre cuerpo» puede sugerir meramente levantarlo o recoger restos.
    rationale: «Llevarnos su pobre cuerpo» comunica con claridad el impedimento de retirar el cuerpo, en correspondencia con «should be taken away by us».
  revised_text: 'Pero el Maligno, celoso y envidioso, adversario de la familia de los justos, había visto la grandeza de su martirio, su vida intachable desde el principio, cómo había sido coronado con la corona de la inmortalidad y cómo había obtenido una recompensa que nadie podía refutar. Por eso se las arregló para que ni siquiera pudiéramos llevarnos su pobre cuerpo, aunque muchos deseaban hacerlo y tocar su santa carne.


    Así que se valió de Nicetes, padre de Herodes y hermano de Alce, para que rogara al magistrado que no entregara su cuerpo, «no sea —según se decía— que abandonen al Crucificado y comiencen a adorar a este hombre». Esto ocurrió por instigación y súplica insistente de los judíos, quienes también nos vigilaban cuando estábamos a punto de sacarlo del fuego. No comprendían que nos será imposible abandonar alguna vez a Cristo, quien sufrió por la salvación del mundo entero de los que son salvados[a] —él, irreprochable, sufrió por los pecadores—, ni adorar a ningún otro.


    Porque a él lo adoramos por ser el Hijo de Dios; pero a los mártires, como discípulos e imitadores del Señor, los amamos como merecen por su incomparable afecto hacia su propio Rey y Maestro. Que también a nosotros nos sea concedido ser hallados partícipes y condiscípulos con ellos.'
  revised_footnotes:
  - marker: a
    text: 'La expresión «el mundo entero de los que son salvados» reproduce la formulación difícil del testimonio disponible. También podría entenderse: «todos los que en el mundo son salvados». La revisión directa del texto griego está pendiente.'
    reason: Se conserva la nota y su ancla, pues la construcción presenta una dificultad de alcance que no debe resolverse sin cotejar directamente la tradición manuscrita griega.
  revision_rationale: 'La revisión es limitada y segura: restituye que la vigilancia recaía sobre «nosotros», expresa con mayor cercanía la imposibilidad futura de abandonar a Cristo y aclara la retirada del cuerpo. Se conserva la ambigüedad soteriológica señalada en la nota, así como el lenguaje del pasaje que distingue la adoración del Hijo de Dios del afecto debido a los mártires. Dado que el material aportado es un testimonio inglés provisional y no una transcripción griega, no se introducen decisiones textuales más allá de las respaldadas por ese testimonio.'
