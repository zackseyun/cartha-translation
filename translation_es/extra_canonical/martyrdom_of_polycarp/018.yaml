review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva fielmente la secuencia argumentativa y los contrastes principales del pasaje: la oposición del Maligno, la negativa de entregar el cuerpo, la acusación de abandonar al Crucificado, y la distinción entre adorar al Hijo de Dios y amar a los mártires. Se ajustan dos puntos para mayor precisión: una recompensa no se «refuta», sino que se cuestiona o impugna; y la imposibilidad de abandonar a Cristo está expresada como una afirmación prospectiva, no simplemente como una resolución presente. La construcción difícil relativa a «el mundo entero de los que son salvados» se conserva sin resolverla interpretativamente.'
  naturalness: El registro es digno, actual y adecuado para español latinoamericano neutral. «Se las arregló» y «se valió de» son naturales, pero «dispuso que» y «presentó a» reflejan con más sobriedad el tono narrativo del texto. «Nos será imposible ... abandonar jamás» comunica claramente el futuro del original y suena más idiomático que «jamás podremos».
  terminology: Se mantienen «el Maligno», «martirio», «corona de inmortalidad», «Crucificado», «Hijo de Dios», «mártires», «Rey y Maestro» y «condiscípulos». «Adoramos» para el Hijo de Dios y «amamos» para los mártires preserva el contraste explícito del pasaje sin introducir categorías doctrinales ajenas.
  issues:
  - severity: medium
    issue: «una recompensa que nadie podía refutar»
    rationale: «Refutar» no se combina naturalmente con «recompensa» en este contexto. El sentido del testimonio es una recompensa que nadie podía negar o impugnar; «cuestionar» conserva el alcance sin forzar la colocación léxica.
  - severity: medium
    issue: «No comprendían que jamás podremos abandonar...»
    rationale: El texto afirma que será imposible abandonar a Cristo en cualquier momento. «No comprendían que nos será imposible ... abandonar jamás» preserva mejor el valor prospectivo y la relación sintáctica.
  - severity: low
    issue: «recoger su pobre cuerpo»
    rationale: «Recoger» puede sugerir simplemente levantar o recolectar. «Llevarnos su pobre cuerpo» representa con mayor claridad que se les impedía retirar el cuerpo.
  revised_text: 'Pero el Maligno, celoso y envidioso, adversario de la familia de los justos, había visto la grandeza de su martirio, su vida intachable desde el principio, cómo había sido coronado con la corona de la inmortalidad y cómo había obtenido una recompensa que nadie podía cuestionar. Por eso dispuso que ni siquiera pudiéramos llevarnos su pobre cuerpo, aunque muchos deseaban hacerlo y tocar su santa carne.


    Así que presentó a Nicetes, padre de Herodes y hermano de Alce, para que rogara al magistrado que no entregara su cuerpo, «no sea —según se decía— que abandonen al Crucificado y comiencen a adorar a este hombre». Esto ocurrió por instigación y súplica insistente de los judíos, quienes también vigilaban cuando estábamos a punto de sacar el cuerpo del fuego. No comprendían que nos será imposible abandonar jamás a Cristo, quien sufrió por la salvación del mundo entero de los que son salvados[a] —él, irreprochable, sufrió por los pecadores—, ni adorar a ningún otro.


    Porque a él lo adoramos por ser el Hijo de Dios; pero a los mártires, como discípulos e imitadores del Señor, los amamos como merecen por su incomparable afecto hacia su propio Rey y Maestro. Que también a nosotros nos sea concedido ser hallados partícipes y condiscípulos con ellos.'
  revised_footnotes:
  - marker: a
    text: 'La expresión «el mundo entero de los que son salvados» reproduce la formulación difícil del testimonio disponible. También podría entenderse: «todos los que en el mundo son salvados». La revisión directa del texto griego está pendiente.'
    reason: Señalar una ambigüedad de alcance que no debe resolverse sin cotejar la tradición manuscrita griega.
  revision_rationale: La revisión es limitada y no altera el significado. Mejora colocaciones léxicas, aclara que el cuerpo no podía ser retirado por la comunidad y restituye en español el carácter futuro de la imposibilidad de abandonar a Cristo. Se preserva la ambigüedad de la frase relativa al mundo y a quienes son salvados, con su nota correspondiente.
