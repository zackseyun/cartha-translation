base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: es
  text: 'Pero el Maligno, celoso y envidioso, adversario de la familia de los justos, había visto la grandeza de su martirio, su vida intachable desde el principio, cómo había sido coronado con la corona de la inmortalidad y cómo había obtenido una recompensa que nadie podía refutar. Por eso se las arregló para que ni siquiera nosotros pudiéramos recoger su pobre cuerpo, aunque muchos deseaban hacerlo y tocar su santa carne.


    Así que se valió de Nicetes, padre de Herodes y hermano de Alce, para que rogara al magistrado que no entregara el cuerpo, «no sea —según decían— que abandonen al Crucificado y comiencen a adorar a este hombre». Esto ocurrió por instigación y súplica insistente de los judíos, quienes también vigilaban cuando estábamos a punto de sacar el cuerpo del fuego. No comprendían que jamás podremos abandonar a Cristo, quien sufrió por la salvación del mundo entero de los que son salvados[a] —él, irreprochable, sufrió por los pecadores—, ni adorar a ningún otro.


    Porque a él lo adoramos por ser el Hijo de Dios; pero a los mártires, como discípulos e imitadores del Señor, los amamos como merecen por su incomparable afecto hacia su propio Rey y Maestro. Que también a nosotros nos sea concedido ser hallados partícipes y condiscípulos con ellos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión «el mundo entero de los que son salvados» reproduce la formulación difícil del testimonio disponible. También podría entenderse: «todos los que en el mundo son salvados». La revisión directa del texto griego está pendiente.'
    reason: Señalar una ambigüedad de alcance que no debe resolverse sin cotejar la tradición manuscrita griega.
lexical_decisions:
- source_word: Evil One
  choice: el Maligno
  rationale: Conserva la personificación y el sentido moral del título, con una expresión bíblica natural en español.
- source_word: martyrdom
  choice: martirio
  rationale: Mantiene el término técnico cristiano y su referencia tanto al testimonio como a la muerte sufrida.
- source_word: poor body
  choice: su pobre cuerpo
  rationale: Preserva el matiz afectivo y compasivo del testimonio sin rebajarlo a un sentido económico.
- source_word: holy flesh
  choice: su santa carne
  rationale: Reproduce la concreción corporal y el lenguaje reverencial del pasaje, evitando diluirlo como simple «cuerpo».
- source_word: cherish
  choice: amamos
  rationale: Expresa afecto y honra sin sugerir que se rinde a los mártires la adoración reservada al Hijo de Dios.
- source_word: partakers and fellow-disciples
  choice: partícipes y condiscípulos
  rationale: Conserva los dos conceptos diferenciados y el tono exhortativo de la conclusión.
theological_decisions:
- issue: Distinción entre la adoración a Cristo y el afecto hacia los mártires
  choice: «a él lo adoramos… pero a los mártires… los amamos»
  alternative: «a él lo veneramos… y honramos a los mártires»
  rationale: La formulación conserva el contraste explícito del texto y evita equiparar la devoción dada al Hijo de Dios con el amor y reconocimiento concedidos a sus discípulos.
- issue: Alcance de la salvación
  choice: «por la salvación del mundo entero de los que son salvados»
  alternative: «por la salvación de todos los que en el mundo son salvados»
  rationale: Se mantiene la construcción difícil y su tensión interna, pues la revisión directa del griego está pendiente y no conviene resolver de manera silenciosa su alcance.
- issue: Impecabilidad o inocencia de Cristo
  choice: «él, irreprochable, sufrió por los pecadores»
  alternative: «siendo inocente, sufrió por los pecadores»
  rationale: «Irreprochable» conserva la oposición moral entre Cristo y los pecadores sin desarrollar una formulación doctrinal más extensa que la atestiguada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el tono polémico del relato, su reverencia corporal y la distinción explícita entre adorar a Cristo y amar a los mártires. Borrador fundamentado provisionalmente en el testimonio inglés de dominio público suministrado; requiere revisión directa del griego.
