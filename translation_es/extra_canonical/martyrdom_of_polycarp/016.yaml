base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: es
  text: 'Cuando hubo pronunciado el «Amén» y terminado su oración, los encargados encendieron el fuego. Una gran llamarada resplandeció, y nosotros, a quienes se nos concedió verlo, contemplamos una maravilla; y fuimos preservados para poder contar a los demás lo sucedido.


    El fuego tomó la forma de una bóveda, como la vela de una nave henchida por el viento, y rodeó como un muro el cuerpo del mártir. Él permanecía allí en medio, no como carne que se quema, sino como [un pan en el horno o como] oro y plata refinados en un horno. Pues percibimos una fragancia tan agradable como si el aire trajera el aroma del incienso o de alguna otra especia preciosa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un antiguo testimonio inglés de dominio público. Aún está pendiente la revisión directa de la tradición manuscrita griega. Los corchetes en «[un pan en el horno o como]» reproducen una señal editorial de restauración textual o posible daño del manuscrito.
    reason: La fuente proporcionada declara pendiente la revisión del griego y exige preservar los corchetes como indicio de incertidumbre textual.
lexical_decisions:
- source_word: offered up the Amen
  choice: pronunciado el «Amén»
  rationale: Expresa de manera natural el acto de concluir solemnemente la oración con el Amén, sin trasladar mecánicamente la metáfora inglesa «ofrecer».
- source_word: firemen / those tending the fire
  choice: los encargados
  rationale: En este contexto se refiere a quienes tenían la tarea de prender la hoguera, no a bomberos en el sentido moderno.
- source_word: vault
  choice: bóveda
  rationale: Conserva la imagen arquitectónica de una forma arqueada creada por las llamas.
- source_word: made a wall round about
  choice: rodeó como un muro
  rationale: Mantiene la imagen del fuego formando una barrera alrededor del mártir con sintaxis española fluida.
- source_word: frankincense
  choice: incienso
  rationale: Es el término común y comprensible en español para la resina aromática mencionada; evita el menos natural «olíbano» en el cuerpo del texto.
- source_word: precious spice
  choice: especia preciosa
  rationale: Conserva la amplitud del testimonio inglés, que puede aludir a otra sustancia aromática valiosa.
theological_decisions:
- issue: Carácter milagroso del fuego
  choice: 'Se conserva como testimonio en primera persona de los narradores: «contemplamos una maravilla».'
  alternative: Presentarlo como una afirmación objetiva explicada o atenuarlo como mera impresión.
  rationale: La traducción debe mantener la perspectiva testimonial y la tensión del relato sin confirmar ni racionalizar adicionalmente el fenómeno.
- issue: Sentido providencial de «fuimos preservados»
  choice: «fuimos preservados para poder contar»
  alternative: «sobrevivimos» o «Dios nos preservó».
  rationale: La forma pasiva conserva la posible implicación providencial sin introducir explícitamente un agente que el texto suministrado no nombra.
- issue: Descripción del cuerpo del mártir
  choice: «Él permanecía allí en medio»
  alternative: «el cuerpo estaba allí en medio».
  rationale: Mantiene la dignidad personal del mártir y la continuidad referencial, sin añadir una afirmación doctrinal sobre su condición.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan las imágenes vívidas del relato, la voz testimonial en primera persona y la incertidumbre textual marcada por corchetes. Se evita «bomberos», que produciría un anacronismo semántico.
