revisions:
- from: 'Hermanos, les escribimos acerca de lo que les sucedió a quienes sufrieron el martirio, y en especial al bienaventurado Policarpo, quien puso fin a la persecución, por así decirlo, al sellarla con su propio martirio. Pues casi todos los acontecimientos anteriores ocurrieron para que el Señor nos mostrara una vez más un ejemplo de martirio conforme al evangelio.


    Policarpo esperó para ser entregado[a], tal como lo hizo el Señor, a fin de que también nosotros lo imitemos y no busquemos solamente nuestro propio bien, sino también el de nuestros prójimos. Porque el amor verdadero y firme no procura únicamente la salvación de uno mismo, sino también la de todos los hermanos.'
  to: 'Hermanos, les escribimos acerca de lo que les sucedió a quienes sufrieron el martirio, y en especial al bienaventurado Policarpo, quien puso fin a la persecución al sellarla, por así decirlo, con su propio martirio. Pues casi todos los acontecimientos anteriores ocurrieron para que el Señor nos mostrara una vez más un ejemplo de martirio conforme al evangelio.


    Porque se quedó esperando para ser entregado[a], tal como lo hizo el Señor, a fin de que también nosotros lo imitemos, atendiendo no solo a lo nuestro, sino también a lo de nuestros prójimos. Porque el amor verdadero y firme no procura únicamente la salvación de uno mismo, sino también la de todos los hermanos.'
  rationale: Se corrige de manera mínima la expresión que restringía ‘lo propio’ a ‘el propio bien’ y se hace explícito el aspecto de permanencia en el verbo referido a Policarpo. Se conserva la ambigüedad contextual de «lo imitemos», cuyo antecedente inmediato es Policarpo, presentado explícitamente en correspondencia con el Señor. La nota conserva un ancla adecuada y no requiere ampliación.
