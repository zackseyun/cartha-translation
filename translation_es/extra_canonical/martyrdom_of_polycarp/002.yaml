base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: es
  text: 'Hermanos, les escribimos acerca de lo que les sucedió a quienes sufrieron el martirio, y en especial al bienaventurado Policarpo, quien puso fin a la persecución al sellarla, por así decirlo, con su propio martirio. Pues casi todos los acontecimientos anteriores ocurrieron para que el Señor nos mostrara una vez más un ejemplo de martirio conforme al evangelio.


    Porque se quedó esperando para ser entregado[a], tal como lo hizo el Señor, a fin de que también nosotros lo imitemos, atendiendo no solo a lo nuestro, sino también a lo de nuestros prójimos. Porque el amor verdadero y firme no procura únicamente la salvación de uno mismo, sino también la de todos los hermanos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ser entregado» también puede incluir el matiz de ser traicionado o puesto en manos de las autoridades, como ocurrió con el Señor.
    reason: La expresión griega conserva una amplitud semántica que «arrestado» o «traicionado» por sí solas reducirían.
lexical_decisions:
- source_word: brethren / Greek ἀδελφοί (pending direct verification)
  choice: Hermanos
  rationale: Conserva el tratamiento comunitario antiguo con una forma natural y digna en español; en este contexto funciona como plural inclusivo de la comunidad.
- source_word: suffered martyrdom / Greek μαρτυρέω-related wording (pending direct verification)
  choice: sufrieron el martirio
  rationale: Mantiene el sentido técnico cristiano del testimonio llevado hasta la muerte, sin reducirlo simplemente a «murieron».
- source_word: stayed the persecution / Greek κατέπαυσεν τὸν διωγμόν (pending direct verification)
  choice: puso fin a la persecución
  rationale: Expresa de manera clara el valor causativo del testimonio inglés y de la lectura griega conocida, sin sugerir meramente que Policarpo la retrasó.
- source_word: set his seal upon it
  choice: al sellarla con su propio martirio
  rationale: Conserva la metáfora del sello y explicita de forma natural en español que el martirio de Policarpo marcó la culminación de la persecución narrada.
- source_word: conformable to the Gospel
  choice: conforme al evangelio
  rationale: Preserva la relación normativa y ejemplar con el evangelio sin decidir si se alude principalmente al mensaje evangélico o al modelo narrativo de la pasión de Jesús.
- source_word: linger / waited
  choice: esperó
  rationale: Evita la connotación moderna negativa de «demorarse» y comunica que Policarpo no precipitó su entrega.
- source_word: neighbors
  choice: prójimos
  rationale: Recoge el sentido ético y bíblico de las otras personas por cuyo bien debe velarse, no solo el de quienes viven cerca.
- source_word: saved
  choice: la salvación
  rationale: Conserva el contenido soteriológico del pasivo «ser salvado» en una construcción española fluida y paralela.
theological_decisions:
- issue: Imitación de Policarpo y del Señor
  choice: «a fin de que también nosotros lo imitemos» mantiene como antecedente inmediato a Policarpo, cuyo comportamiento reproduce el del Señor
  alternative: Hacer de «el Señor» el referente directo de «lo imitemos»
  rationale: La secuencia del testimonio presenta a Policarpo como ejemplo inmediato sin separar su conducta del paradigma de Jesús; se conserva la tensión referencial en lugar de añadir una explicación doctrinal.
- issue: Sentido de «evangelio»
  choice: Se conserva «evangelio» sin glosa
  alternative: Traducir «conforme al relato de la pasión del Evangelio» o «conforme al mensaje del evangelio»
  rationale: El texto permite una resonancia tanto narrativa como normativa. La versión no restringe esa amplitud.
- issue: Alcance de la salvación de «todos los hermanos»
  choice: Se reproduce la afirmación exhortativa sin explicar el mecanismo de esa salvación
  alternative: Añadir que se trata de desear, procurar o garantizar la salvación ajena
  rationale: El pasaje habla de la orientación del amor, pero no desarrolla aquí una doctrina sobre la agencia humana en la salvación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «les escribimos» en lugar de una fórmula arcaizante. La redacción conserva el tono epistolar y exhortativo, así como las metáforas y alusiones bíblicas. Dado que la ficha indica que la revisión directa del griego está pendiente, las decisiones se apoyan provisionalmente en el testimonio inglés público y en las formas griegas comúnmente atestiguadas, que deben cotejarse antes de la publicación definitiva.
