base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: es
  text: 'Así que se llevaron consigo al muchacho y, el viernes, cerca de la hora de la cena, los guardias y los jinetes salieron con sus armas habituales, apresurándose como si fueran tras un ladrón. Llegaron todos juntos ya avanzada la tarde y encontraron al propio Policarpo acostado en una habitación del piso alto de una casa de campo. Aunque habría podido marcharse de allí a otro lugar, no quiso hacerlo, sino que dijo: «Que se haga la voluntad de Dios».


    Cuando oyó que habían llegado, bajó y conversó con ellos. Los presentes se maravillaban de su edad y de su firmeza, y se preguntaban por qué había tanto empeño en arrestar a un anciano como él. Enseguida ordenó que les sirvieran una mesa para que comieran y bebieran a esa hora cuanto quisieran. Luego los convenció de que le concedieran una hora para orar sin que nadie lo molestara.


    Cuando ellos accedieron, se puso de pie y oró. Estaba tan lleno de la gracia de Dios que durante dos horas no pudo dejar de hablar. Quienes lo escuchaban estaban asombrados, y muchos lamentaron haber ido a arrestar a un anciano tan venerable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: muchacho
  rationale: Conserva la referencia indefinida a un varón joven sin precisar una edad que el testimonio inglés no especifica.
- source_word: gendarmes
  choice: guardias
  rationale: Expresa en español actual la función de agentes armados encargados del arresto, sin el matiz moderno y regional de «gendarmes».
- source_word: constancy
  choice: firmeza
  rationale: Comunica perseverancia y entereza ante el arresto con un término natural y digno.
- source_word: cottage
  choice: casa de campo
  rationale: Refleja una vivienda rural modesta sin introducir el posible matiz vacacional moderno de «cabaña».
- source_word: repented
  choice: lamentaron
  rationale: En este contexto indica pesar por haber participado en el arresto; evita imponer el sentido técnico de conversión religiosa.
- source_word: venerable
  choice: venerable
  rationale: Conserva el respeto suscitado por la edad y el carácter de Policarpo.
theological_decisions:
- issue: La expresión «The will of God be done»
  choice: «Que se haga la voluntad de Dios»
  alternative: «Hágase la voluntad de Dios»
  rationale: Mantiene la resignación piadosa y la resonancia bíblica sin volver el español innecesariamente arcaico.
- issue: Estar «lleno de la gracia de Dios»
  choice: «Estaba tan lleno de la gracia de Dios»
  alternative: «La gracia de Dios lo llenaba de tal manera»
  rationale: Conserva la formulación teológica del testimonio sin explicar la naturaleza o el modo de esa gracia.
- issue: Duración de la oración
  choice: «durante dos horas no pudo dejar de hablar»
  alternative: «no pudo guardar silencio durante dos horas»
  rationale: Preserva el carácter extraordinario y espontáneo de la oración sin sugerir incapacidad física literal más allá de la expresión narrativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el tono martirial sobrio. Dado que la revisión directa del griego está pendiente, el borrador sigue de cerca el testimonio inglés público suministrado y evita decisiones que dependan de reconstrucciones no verificadas.
