review_pass:
  verdict: revise
  source_fidelity: Se requiere una revisión menor pero necesaria. «Ya avanzada la tarde» debilita «late in the evening»; «casa de campo» añade un matiz rural que no está garantizado por «cottage»/οἰκίδιον; y «lamentaron» reduce «repented» a pesar, cuando el original y el testimonio inglés permiten —y favorecen— «se arrepintieron». También conviene no añadir el nombre «Policarpo» donde el pasaje presentado dice simplemente «él/el hombre mismo».
  naturalness: El borrador es en general fluido y de registro sobrio. «Habitación del piso superior de cierta casita», «a última hora de la noche» y «no pudo guardar silencio» son formulaciones naturales y más cercanas al sentido narrativo.
  terminology: «Muchacho», «guardias», «jinetes», «constancia», «gracia de Dios» y «venerable» son adecuados. «Cierta casita» conserva mejor la modestia de οἰκίδιον/cottage que «casa de campo». «Se arrepintieron» mantiene la amplitud semántica del verbo sin imponer una explicación doctrinal de su arrepentimiento.
  issues:
  - severity: medium
    issue: «Llegaron todos juntos ya avanzada la tarde»
    rationale: El testimonio dice que llegaron en grupo «late in the evening». «Ya avanzada la tarde» normalmente remite a la tarde, no a la noche. Debe reflejarse la referencia nocturna.
  - severity: medium
    issue: «casa de campo» para «cottage»
    rationale: La expresión española puede comunicar una vivienda rural o de recreo; el pasaje solo describe una pequeña vivienda. «Cierta casita» evita añadir un escenario rural no expresado.
  - severity: medium
    issue: «muchos lamentaron» para «many repented»
    rationale: «Lamentaron» restringe el sentido a remordimiento o pesar. «Se arrepintieron» conserva la formulación del original/testimonio y deja abierto el alcance concreto del cambio de actitud.
  - severity: low
    issue: Adición de «Policarpo»
    rationale: Aunque el referente es claro por el contexto de la obra, el texto de base suministrado dice «the man himself» y no nombra aquí a Policarpo. Es preferible no incorporar información contextual en el cuerpo de la traducción.
  - severity: low
    issue: «no pudo dejar de hablar»
    rationale: Es posible, pero «no pudo guardar silencio» reproduce más directamente la expresión narrativa «could not hold his peace», sin especificar de qué modo habló.
  revised_text: 'Así que se llevaron consigo al muchacho y, el viernes, aproximadamente a la hora de cenar, los guardias y los jinetes salieron con sus armas acostumbradas, apresurándose como si fueran tras un ladrón. Al llegar todos juntos a última hora de la noche, lo encontraron acostado en una habitación del piso superior de cierta casita. Aunque podía haberse ido de allí a otro lugar, no quiso hacerlo, sino que dijo: «Que se haga la voluntad de Dios».


    Cuando oyó que habían venido, bajó y conversó con ellos. Los presentes se asombraron de su edad y de su constancia, y se preguntaban por qué había tanto empeño en arrestar a un anciano como él. Enseguida ordenó que prepararan una mesa para que comieran y bebieran a esa hora cuanto quisieran. Y los persuadió de que le concedieran una hora para orar sin ser molestado.


    Cuando accedieron, se puso de pie y oró. Estaba tan lleno de la gracia de Dios que durante dos horas no pudo guardar silencio. Quienes lo oían estaban asombrados, y muchos se arrepintieron de haber ido contra un anciano tan venerable.'
  revised_footnotes: []
  revision_rationale: La revisión conserva el orden, la sobriedad y las afirmaciones del pasaje, a la vez que corrige matices temporales y léxicos que alteraban o estrechaban el sentido. No se añade una interpretación del arrepentimiento ni de la «gracia de Dios». La traducción sigue siendo provisional, pues el contexto indica que la comprobación directa y completa frente a la tradición manuscrita griega sigue pendiente.
