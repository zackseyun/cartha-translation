- from: 'Pero, como él insistía y volvía a decir: «Jura por el genio del César», Policarpo respondió: «Si supones en vano que voy a jurar por el genio del César, como dices, y finges no saber quién soy, escúchalo claramente: soy cristiano. Pero, si deseas conocer la enseñanza del cristianismo, fija un día y concédeme una audiencia».


