  to: 'Pero, como él insistía y volvía a decir: «Jura por la fortuna del César[a]», Policarpo respondió: «Si vanamente supones que juraré por la fortuna del César, como dices, y finges no saber quién soy, escucha con claridad: soy cristiano. Pero, si deseas conocer la enseñanza del cristianismo, fija un día y concédeme una audiencia».


    El procónsul dijo: «Convence al pueblo». Pero Policarpo respondió: «En cuanto a ti, te habría considerado digno de dialogar, pues se nos ha enseñado a dar a los gobernantes y a las autoridades designados por Dios el honor debido, siempre que no nos perjudique. Pero no considero que estas personas sean dignas de que me defienda ante ellas».'
