base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: es
  text: 'Pero, como él insistía y volvía a decir: «Jura por la fortuna del César[a]», Policarpo respondió: «Si vanamente supones que juraré por la fortuna del César, como dices, y finges no saber quién soy, escucha con claridad: soy cristiano. Pero, si deseas conocer la enseñanza del cristianismo, fija un día y concédeme una audiencia».


    El procónsul dijo: «Convence al pueblo». Pero Policarpo respondió: «En cuanto a ti, te habría considerado digno de dialogar, pues se nos ha enseñado a dar a los gobernantes y a las autoridades designados por Dios el honor debido, siempre que no nos perjudique. Pero no considero que estas personas sean dignas de que me defienda ante ellas».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Fortuna del César» traduce el griego τύχη (tychē). En este contexto alude a la fortuna o poder tutelar atribuido al emperador y forma parte de una fórmula de juramento romano; no equivale estrictamente a «genio» o espíritu tutelar.
    reason: El testigo inglés usa «genius of Caesar», pero el término griego conservado es τύχη. La nota explica el referente histórico sin reemplazar la traducción textual por una interpretación.
lexical_decisions:
- source_word: genius of Caesar (Greek witness review pending)
  choice: genio del César
  rationale: Conserva el término técnico de la religión romana para el espíritu tutelar del emperador, sin sustituirlo por una interpretación como «divinidad» o «espíritu».
- source_word: doctrine of Christianity
  choice: enseñanza del cristianismo
  rationale: «Enseñanza» es natural y accesible, y evita que «doctrina» sugiera aquí un sistema confesional posterior.
- source_word: Prevail upon the people
  choice: Convence al pueblo
  rationale: Reproduce de forma directa la orden de persuadir a la multitud, manteniendo abierta la forma exacta en que debía hacerlo.
- source_word: princes and authorities
  choice: gobernantes y autoridades
  rationale: Expresa las funciones civiles en español actual y digno, sin introducir títulos políticos más específicos que el testimonio suministrado.
- source_word: defend myself before them
  choice: me defienda ante ellos
  rationale: Mantiene el sentido forense y público de presentar una defensa ante la multitud.
theological_decisions:
- issue: Autoridades establecidas por Dios
  choice: «gobernantes y autoridades establecidas por Dios»
  alternative: «gobernantes y autoridades designadas por Dios»
  rationale: Se conserva la afirmación teológica del testimonio sin explicar si el establecimiento es providencial, institucional o una aprobación moral de cada gobernante.
- issue: Límite del honor debido a las autoridades
  choice: «siempre que no nos perjudique»
  alternative: «en la medida en que no nos haga daño»
  rationale: 'Mantiene la tensión del pasaje: se debe el honor apropiado, pero no a costa de un daño; no se especifica si este es físico, moral o espiritual.'
- issue: Confesión de identidad cristiana
  choice: «soy cristiano»
  alternative: «yo soy cristiano»
  rationale: La formulación breve conserva la declaración pública y enfática sin añadir contenido doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preserva «genio del César» como término histórico; podría requerir una nota explicativa en una edición anotada. Debido a que la revisión directa del griego está pendiente, las decisiones se basan en el testimonio inglés público suministrado y se evita precisar más de lo que este permite.
