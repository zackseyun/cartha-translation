base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: es
  text: 'Así que no lo clavaron, sino que lo ataron. Entonces él, con las manos puestas detrás de la espalda y atado al madero, como un carnero escogido de un gran rebaño para ser ofrecido, un holocausto preparado y aceptable para Dios, alzó la mirada al cielo y dijo:


    «Señor Dios todopoderoso, Padre de tu amado y bendito Hijo Jesucristo, por medio de quien hemos recibido el conocimiento de ti; Dios de los ángeles, de las potestades, de toda la creación y de todo el linaje de los justos que viven en tu presencia: te bendigo porque me has concedido este día y esta hora, para que tenga parte entre el número de los mártires, en la copa de [tu] Cristo, para la resurrección a la vida eterna, tanto del alma como del cuerpo, en la incorruptibilidad del Espíritu Santo. Que hoy sea yo recibido entre ellos en tu presencia como un sacrificio abundante y aceptable, tal como tú, Dios fiel y verdadero, lo preparaste y revelaste de antemano, y lo has llevado a cabo. Por esta razón, y por todas las cosas, te alabo, te bendigo y te glorifico por medio del eterno y celestial Sumo Sacerdote, Jesucristo, tu Hijo amado. Por medio de él, a ti, junto con él y con el Espíritu Santo, sea la gloria ahora [y siempre] y por los siglos venideros. Amén».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tied / bound to the stake
  choice: ataron / atado al madero
  rationale: Distingue la acción inicial y el estado posterior; «madero» mantiene la imagen del poste de ejecución sin identificarlo necesariamente con una cruz.
- source_word: noble ram
  choice: carnero escogido
  rationale: «Escogido» expresa calidad y aptitud sacrificial con mayor naturalidad que «noble» aplicado a un animal.
- source_word: burnt sacrifice
  choice: holocausto
  rationale: Es el término sacrificial tradicional y preciso para una ofrenda consumida por el fuego.
- source_word: powers
  choice: potestades
  rationale: Conserva la posible referencia a seres o poderes celestiales y evita reducirla a autoridades humanas.
- source_word: race of the righteous
  choice: linaje de los justos
  rationale: Mantiene el sentido colectivo de una estirpe o comunidad sin la connotación biológica moderna de «raza».
- source_word: martyrs
  choice: mártires
  rationale: Preserva el término técnico cristiano, cuyo sentido en el contexto incluye a quienes dan testimonio mediante la muerte.
- source_word: rich sacrifice
  choice: sacrificio abundante
  rationale: Conserva la fuerza positiva de la ofrenda sin sugerir riqueza monetaria.
- source_word: High-priest
  choice: Sumo Sacerdote
  rationale: Equivalente bíblico y cristológico establecido en español.
theological_decisions:
- issue: Participación en «la copa de Cristo»
  choice: «en la copa de [tu] Cristo»
  alternative: «al beber la copa de [tu] Cristo»
  rationale: La formulación elegida conserva la metáfora y su tensión participativa sin añadir explícitamente la acción de beber.
- issue: Resurrección del alma y del cuerpo
  choice: «para la resurrección a la vida eterna, tanto del alma como del cuerpo»
  alternative: «para la resurrección de alma y cuerpo a la vida eterna»
  rationale: Mantiene la afirmación del testimonio sin armonizarla con un esquema antropológico denominacional.
- issue: Doxología final y referentes pronominales
  choice: «Por medio de él, a ti, junto con él y con el Espíritu Santo, sea la gloria»
  alternative: «por medio de quien, con él y el Espíritu Santo, sea la gloria»
  rationale: Explicita mínimamente la sintaxis para que sea comprensible en español, conservando que la gloria se dirige al Padre por medio del Hijo, junto con el Hijo y el Espíritu.
- issue: Incorruptibilidad del Espíritu Santo
  choice: «en la incorruptibilidad del Espíritu Santo»
  alternative: «por la incorrupción que procede del Espíritu Santo»
  rationale: Se conserva la relación gramatical ambigua y la formulación teológicamente densa, sin decidir si el genitivo indica fuente, esfera o cualidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la estructura solemne de la oración sin usar formas arcaicas de segunda persona. Los corchetes del testimonio inglés se mantienen como señales de restauración o variación manuscrita. El borrador es necesariamente provisional porque el material suministrado indica que la revisión directa del griego sigue pendiente.
