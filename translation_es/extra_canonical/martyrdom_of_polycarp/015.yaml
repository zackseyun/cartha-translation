review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés suministrado y conserva sus señales textuales entre corchetes. No obstante, la doxología final introduce de forma explícita «a ti» como destinatario de la gloria, elemento que no está expresado en el texto de control y que resuelve una construcción deliberadamente condensada. Se corrige para conservar su ambigüedad sintáctica.
  naturalness: El registro es solemne, claro y apropiado para español latinoamericano neutral. Se ajustan «madero» a «poste», más preciso para «stake», y algunas conexiones sintácticas para una lectura más fluida sin rebajar el tono litúrgico.
  terminology: Se mantienen «holocausto», «potestades», «mártires», «incorruptibilidad del Espíritu Santo» y «Sumo Sacerdote». «Poste» evita identificar de manera innecesaria el instrumento de ejecución con una cruz.
  issues:
  - severity: medium
    issue: La doxología final explicita «a ti» como destinatario de la gloria.
    rationale: El testimonio dice «through whom with Him and the Holy Spirit be glory», sin expresar «a ti». La adición interpreta y fija los referentes de una fórmula sintácticamente condensada; corresponde conservar la ambigüedad del texto de control.
  - severity: low
    issue: «Madero» es menos preciso que «poste» para «stake».
    rationale: «Poste» reproduce mejor el objeto de suplicio indicado por el testimonio, sin añadir una identificación con la cruz.
  revised_text: 'Así que no lo clavaron, sino que lo ataron. Entonces él, con las manos puestas detrás de la espalda y atado al poste, como un carnero escogido de un gran rebaño para una ofrenda, un holocausto preparado y aceptable para Dios, alzó la mirada al cielo y dijo:


    «Señor Dios todopoderoso, Padre de tu amado y bendito Hijo Jesucristo, por medio de quien hemos recibido el conocimiento de ti; Dios de los ángeles, de las potestades, de toda la creación y de todo el linaje de los justos que viven en tu presencia: te bendigo porque me has concedido este día y esta hora, para que reciba una parte entre el número de los mártires, en la copa de [tu] Cristo, para la resurrección a la vida eterna, tanto del alma como del cuerpo, en la incorruptibilidad del Espíritu Santo. Que hoy sea yo recibido entre ellos en tu presencia como un sacrificio abundante y aceptable, tal como tú lo preparaste y revelaste de antemano, y lo has llevado a cabo, tú que eres el Dios fiel y verdadero. Por esta razón, y por todas las cosas, te alabo, te bendigo y te glorifico por medio del eterno y celestial Sumo Sacerdote, Jesucristo, tu Hijo amado, por medio de quien, con él y con el Espíritu Santo, sea la gloria ahora [y siempre] y por los siglos venideros. Amén».'
  revised_footnotes: []
  revision_rationale: La revisión elimina una explicitación interpretativa en la doxología final, conserva los corchetes heredados del testimonio y mejora la precisión de «stake» con «poste». No se añaden notas, pues el material recibido no proporciona una base manuscrita específica para explicar los corchetes más allá de mantenerlos como señal editorial.
