review_pass:
  verdict: revise
  source_fidelity: El borrador conserva con fidelidad el contenido y el tono de la oración según el testimonio ინგლის inglés suministrado, incluidos los corchetes textuales. Sin embargo, «sacrificio abundante» desplaza «rich sacrifice» hacia cantidad, y la construcción «para que tenga parte entre el número» no comunica con suficiente claridad la petición de recibir una porción entre los mártires.
  naturalness: El español es en general claro, solemne y apropiado para un texto martirial antiguo. Se mejora la secuencia sacrificial mediante una puntuación y una formulación más naturales, y se evita la expresión poco idiomática «entre el número».
  terminology: Se mantienen acertadamente «madero», «holocausto», «potestades», «mártires», «incorruptibilidad», «Espíritu Santo» y «Sumo Sacerdote». «Sacrificio valioso» representa mejor el valor positivo de «rich sacrifice» que «sacrificio abundante», sin introducir una lectura económica.
  issues:
  - severity: medium
    issue: «sacrificio abundante» para «a rich ... sacrifice»
    rationale: «Abundante» se refiere principalmente a cantidad. En este contexto sacrificial, «valioso» conserva mejor la cualidad encomiable de la ofrenda, sin convertirla en riqueza monetaria.
  - severity: low
    issue: «para que tenga parte entre el número de los mártires»
    rationale: La frase resulta poco natural y atenúa «might receive a portion». «Para que pueda recibir una porción entre los mártires» es más clara y conserva la imagen de participación.
  - severity: low
    issue: Articulación de la imagen del carnero y el holocausto
    rationale: 'La aposición del original puede conservarse en español con una pausa más nítida: el carnero es presentado como destinado a la ofrenda y como holocausto preparado para Dios.'
  revised_text: 'Así que no lo clavaron, sino que lo ataron. Entonces él, con las manos puestas detrás de la espalda y atado al madero, como un carnero escogido de un gran rebaño, destinado a la ofrenda, un holocausto preparado y aceptable para Dios, alzó la mirada al cielo y dijo:


    «Señor Dios todopoderoso, Padre de tu amado y bendito Hijo Jesucristo, por medio de quien hemos recibido el conocimiento de ti; Dios de los ángeles, de las potestades, de toda la creación y de todo el linaje de los justos que viven en tu presencia: te bendigo porque me has concedido este día y esta hora, para que pueda recibir una porción entre los mártires, en la copa de [tu] Cristo, para la resurrección a la vida eterna, tanto del alma como del cuerpo, en la incorruptibilidad del Espíritu Santo. Que hoy sea yo recibido entre ellos en tu presencia como un sacrificio valioso y aceptable, tal como tú, Dios fiel y verdadero, lo preparaste y revelaste de antemano, y lo has llevado a cabo. Por esta razón, y por todas las cosas, te alabo, te bendigo y te glorifico por medio del eterno y celestial Sumo Sacerdote, Jesucristo, tu Hijo amado. Por medio de él, a ti, junto con él y con el Espíritu Santo, sea la gloria ahora [y siempre] y por los siglos venideros. Amén».'
  revised_footnotes: []
  revision_rationale: La revisión es limitada y no resuelve cuestiones que requieren cotejo directo con la tradición griega. Conserva las señales entre corchetes y la ambigüedad de «en la incorruptibilidad del Espíritu Santo». La explicitación «a ti» en la doxología se mantiene porque refleja la sintaxis transmitida por el testimonio inglés («through whom ... be glory») y hace posible una oración española natural; no añade una formulación doctrinal ajena al pasaje.
