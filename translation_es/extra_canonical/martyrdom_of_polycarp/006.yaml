review_pass:
  verdict: revise
  source_fidelity: 'La traducción refleja fielmente el testimonio inglés suministrado: Policarpo no se desalienta, se retira a una finca cercana, persevera en oración, entra en trance y anuncia que será quemado vivo. Dado que la revisión directa del griego sigue pendiente, se conserva la nota de provisionalidad. Se ajusta «se enteró, al principio», cuya colocación puede sugerir que primero se enteró y luego reaccionó, para expresar con mayor claridad «cuando lo oyó por primera vez».'
  naturalness: El registro es claro, sobrio y natural para el español latinoamericano. «Propiedad rural» es adecuado, aunque «finca» resulta más fluido y conserva la falta de especificidad sobre el uso agrícola. «Lo arrestaran» comunica con precisión «apprehension» en lenguaje actual.
  terminology: Se mantienen «Policarpo», «trance», «iglesias» y «quemado vivo». La formulación «Es necesario que me quemen vivo» conserva la necesidad anunciada sin introducir una explicación doctrinal. La nota [a] sigue anclada correctamente al pasaje traducido bajo revisión provisional.
  issues:
  - severity: low
    issue: Orden poco natural en «se enteró, al principio».
    rationale: Aunque comprensible, no reproduce con la misma claridad el valor temporal de «when he first heard it» y puede leerse como una secuencia narrativa distinta. «Cuando ... oyó la noticia por primera vez» es más directo.
  - severity: low
    issue: «Propiedad rural» es algo administrativo y menos narrativo que el contexto requiere.
    rationale: «Finca» es un equivalente latinoamericano natural para un retiro rural, sin afirmar que fuera una explotación agrícola moderna.
  revised_text: 'Cuando el glorioso Policarpo oyó la noticia por primera vez, no se atemorizó en absoluto, sino que quería quedarse en la ciudad. Pero la mayoría lo convenció de retirarse. Así que se retiró a una finca no muy lejos de la ciudad. Allí permaneció con unos pocos compañeros, sin hacer otra cosa noche y día que orar por todos y por las iglesias de todo el mundo, pues esa era su costumbre constante.


    Y mientras oraba, tres días antes de que lo arrestaran, cayó en trance y vio que su almohada ardía en llamas. Entonces se volvió hacia quienes estaban con él y les dijo: «Es necesario que me quemen vivo».[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del texto griego.
    reason: La fuente suministrada indica que aún no se ha realizado la revisión del idioma original, por lo que debe hacerse explícita la base provisional de la traducción.
  revision_rationale: Se hacen ajustes menores de claridad, idiomaticidad y precisión narrativa, sin alterar el sentido ni resolver de manera interpretativa la experiencia extática o la necesidad anunciada. Se conserva la advertencia metodológica exigida mientras esté pendiente la revisión directa del griego.
