base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: es
  text: 'Cuando el glorioso Policarpo se enteró, al principio no se atemorizó en absoluto, sino que quería quedarse en la ciudad. Pero la mayoría lo convenció de retirarse. Así que se retiró a una propiedad rural no muy lejos de la ciudad. Allí permaneció con unos pocos compañeros, sin hacer otra cosa noche y día que orar por todos y por las iglesias de todo el mundo, pues esa era su costumbre constante.


    Y mientras oraba, tres días antes de que lo apresaran, cayó en trance y vio que su almohada ardía en llamas. Entonces se volvió hacia quienes estaban con él y les dijo: «Es necesario que me quemen vivo».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del texto griego.
    reason: La fuente suministrada indica que aún no se ha realizado la revisión del idioma original, por lo que debe hacerse explícita la base provisional de la traducción.
lexical_decisions:
- source_word: farm
  choice: propiedad rural
  rationale: Expresa un lugar de retiro en el campo sin imponer la idea moderna y más específica de una explotación agrícola.
- source_word: all men
  choice: todos
  rationale: Comunica de manera natural el sentido inclusivo de todas las personas.
- source_word: falleth into a trance
  choice: cayó en trance
  rationale: Conserva el carácter extraordinario de la experiencia sin definir con mayor precisión su naturaleza.
- source_word: It must needs be
  choice: Es necesario
  rationale: Mantiene la fuerza de necesidad o destino expresada por el testimonio inglés.
theological_decisions:
- issue: Carácter de la experiencia de Policarpo
  choice: cayó en trance
  alternative: tuvo una visión
  rationale: Se preserva la descripción del testimonio sin identificar el trance exclusivamente con una visión ni explicar su origen.
- issue: Necesidad anunciada de morir quemado
  choice: Es necesario que me quemen vivo
  alternative: Sin duda seré quemado vivo
  rationale: La formulación conserva la tensión entre necesidad, predicción y providencia sin resolverla doctrinalmente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitó el arcaísmo y se conservaron el tono narrativo sobrio, la amplitud de «todos» y la ambigüedad de la experiencia extática y de la necesidad anunciada.
