review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue en lo esencial el testimonio inglés suministrado, pero introduce algunas imprecisiones: «la multitud recogió» reduce el plural y el aspecto de «the crowds ... collecting»; «materiales» neutraliza indebidamente «instruments»; y «Quien me concede» pierde el perfecto de «He that hath granted». La revisión directa de la tradición griega sigue pendiente según el contexto proporcionado.'
  naturalness: El español es generalmente claro y de registro adecuado. Se mejora la sintaxis de la acción inicial, se evita la explicación interpretativa «él mismo» respecto del calzado y se hace más natural la competencia de los fieles.
  terminology: Se conserva «pira» para la estructura combustible de la ejecución y «poste» para stake, sin identificarlo con una cruz. «Instrumentos» reproduce el término del testimonio sin decidir qué objetos eran. «Toda honra» conserva el registro del relato sin añadir lenguaje cultual.
  issues:
  - severity: medium
    issue: «la multitud recogió»
    rationale: 'El testimonio dice «the crowds ... collecting»: se refiere a grupos de gente y presenta una acción en desarrollo. «Las multitudes reunían» lo reproduce mejor.'
  - severity: medium
    issue: «los materiales preparados para la hoguera»
    rationale: «Materials» no corresponde a «instruments» y puede confundirse con la leña ya mencionada. «Los instrumentos preparados para la pira» conserva la referencia sin especificar su naturaleza.
  - severity: low
    issue: «Quien me concede soportar el fuego»
    rationale: «Hath granted» expresa una concesión ya otorgada; «me ha concedido» mantiene ese matiz.
  - severity: low
    issue: Nota b especulativa
    rationale: La explicación propuesta es plausible, pero no es necesaria para entender la traducción y se formula como una reconstrucción pendiente. La relación puede expresarse directamente sin convertir una conjetura en nota.
  revised_text: 'Todo esto sucedió con tal rapidez, más rápido de lo que las palabras pueden contar: enseguida las multitudes reunían, de los talleres y los baños, madera y haces de leña. Los judíos, especialmente, colaboraban con entusiasmo en ello, como es su costumbre.[a]


    Cuando la pira estuvo preparada, se quitó todas sus prendas exteriores y se desató el cinturón. También intentó quitarse los zapatos, cosa que antes no acostumbraba hacer, pues todos los fieles competían siempre por ver quién tocaba antes su cuerpo. Porque, aun antes de que le salieran canas, había sido tratado con toda honra por su vida santa.


    Enseguida colocaron a su alrededor los instrumentos preparados para la pira; y cuando también iban a clavarlo al poste, dijo:


    —Déjenme como estoy, pues el que me ha concedido soportar el fuego también me concederá permanecer inmóvil en la pira, aun sin la protección que ustedes procuran mediante los clavos.'
  revised_footnotes:
  - marker: a
    text: La afirmación «como es su costumbre» pertenece al relato antiguo y refleja su caracterización polémica de los judíos presentes; no debe entenderse como una descripción de todos los judíos.
    reason: Conserva la afirmación del relato, a la vez que impide extender su generalización a todo el pueblo judío.
  revision_rationale: La revisión conserva el contenido, el orden y la ambigüedad del testimonio inglés, corrige reducciones de sentido y evita identificar de manera no justificada los «instrumentos» o el «poste». Se mantiene una nota contextual en el punto donde el relato formula una generalización polémica. Dado que el propio expediente declara pendiente la revisión directa del griego, las elecciones que podrían depender de matices de esa fuente deben considerarse provisionales.
