translation:
  language: es
  text: 'Todo sucedió con tanta rapidez que sería imposible contarlo: de inmediato, la multitud recogió madera y haces de leña de los talleres y los baños. Los judíos, en particular, colaboraron con entusiasmo en esta tarea, como acostumbran hacerlo.[a]


    Cuando la hoguera estuvo preparada, Policarpo se quitó toda la ropa exterior y se desató el cinturón. También intentó quitarse el calzado, aunque antes no solía hacerlo él mismo, porque todos los fieles siempre competían por ser los primeros en tocar su cuerpo. Pues, aun antes de que le salieran canas, ya se le trataba con toda honra a causa de su vida santa.[b]


    Enseguida colocaron a su alrededor los materiales preparados para la hoguera. Cuando estaban a punto de clavarlo también al madero, él dijo:


    —Déjenme como estoy. Quien me concede soportar el fuego también me concederá permanecer inmóvil en la hoguera, aun sin la seguridad que ustedes procuran con los clavos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La afirmación «como acostumbran hacerlo» pertenece al relato antiguo y refleja su caracterización polémica de los judíos presentes; no debe entenderse como una descripción de todos los judíos.
    reason: Aporta contexto necesario para evitar que una generalización hostil del narrador sea aplicada indiscriminadamente a un pueblo entero.
  - marker: b
    text: El sentido parece ser que otros fieles solían ayudar a Policarpo a quitarse el calzado, pues consideraban un honor tocarlo; la redacción exacta deberá comprobarse directamente en el griego.
    reason: El testimonio inglés permite reconstruir el sentido general, pero la relación entre su costumbre y la competencia de los fieles requiere revisión de la fuente griega.
lexical_decisions:
- source_word: timber and faggots
  choice: madera y haces de leña
  rationale: Distingue la madera de los manojos combustibles con una expresión clara y digna en español actual.
- source_word: pile
  choice: hoguera
  rationale: En este contexto de ejecución por fuego, «hoguera» comunica con naturalidad la estructura combustible, aunque el término también podría traducirse más literalmente como «pira».
- source_word: upper garments
  choice: ropa exterior
  rationale: Expresa la capa externa de la vestimenta sin introducir prendas específicas no indicadas por el testimonio disponible.
- source_word: flesh
  choice: cuerpo
  rationale: En el contexto de contacto reverente con Policarpo, «cuerpo» resulta natural y evita la connotación reductiva que «carne» puede tener en español moderno.
- source_word: stake
  choice: madero
  rationale: Conserva la referencia a la pieza de madera de la hoguera sin identificarla indebidamente con una cruz.
- source_word: instruments that were prepared for the pile
  choice: los materiales preparados para la hoguera
  rationale: El testimonio inglés es impreciso; «materiales» preserva esa amplitud mejor que una identificación específica de objetos o instrumentos.
theological_decisions:
- issue: Identidad de quien concede perseverar
  choice: «Quien me concede»
  alternative: «Dios, quien me concede»
  rationale: El texto citado emplea una referencia implícita; no se añade un nombre divino que el testimonio suministrado no expresa de manera explícita.
- issue: Honra tributada a Policarpo
  choice: «se le trataba con toda honra a causa de su vida santa»
  alternative: «era venerado por su santidad»
  rationale: Mantiene el reconocimiento de su conducta santa sin introducir lenguaje cultual ni una doctrina posterior acerca de la veneración de los santos.
- issue: Capacidad de permanecer inmóvil en el fuego
  choice: Se conserva como don concedido, no como autosuficiencia de Policarpo
  alternative: «podré mantenerme inmóvil»
  rationale: Respeta la dependencia explícita de quien le concede soportar el fuego y evita convertirla en mera fuerza de voluntad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evita el arcaísmo, se mantienen el ritmo narrativo y la solemnidad del discurso directo. Este borrador es provisional porque el material proporcionado identifica como pendiente la revisión directa de la tradición manuscrita griega; por ello, no se presentan como seguras decisiones que dependen de matices del original no suministrado.
