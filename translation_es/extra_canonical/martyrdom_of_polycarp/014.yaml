review_pass:
  verdict: revise
  source_fidelity: 'La traducción transmite fielmente el desarrollo narrativo y conserva la referencia implícita a Dios en las palabras de Policarpo. Sin embargo, conviene ajustar algunas expresiones para reflejar con mayor precisión el plural de los grupos reunidos, la comparación «más rápido de lo que las palabras pueden contar», el sentido de «antes de llegar a la edad de las canas» y los «instrumentos» preparados para la pira. La nota sobre el pasaje referido al calzado no es necesaria: el sentido general es suficientemente claro y la nota presenta como incierto un detalle que el texto puede expresar sin añadir interpretación.'
  naturalness: El registro es claro, moderno y apropiadamente sobrio. «Pira» es más preciso que «hoguera» para la estructura funeraria o de ejecución por fuego descrita; «baños públicos» y «manojos de leña» resultan naturales en español latinoamericano neutral. «Edad de las canas» evita la formulación coloquial «le salieran canas» y conserva el carácter temporal del original.
  terminology: Se mantiene «madero», sin identificarlo con una cruz; «carne» reproduce de forma más directa el término corporal del relato, sin imponer una lectura teológica; y «honra» conserva el reconocimiento narrativo sin introducir terminología cultual. La caracterización hostil del narrador acerca de los judíos presentes se conserva como parte del documento, con una nota delimitadora.
  issues:
  - severity: medium
    issue: «sería imposible contarlo»
    rationale: 'Esta formulación intensifica el original: el texto dice que ocurrió más rápido de lo que las palabras podían contar, no que fuera imposible contarlo en sentido absoluto.'
  - severity: low
    issue: «la multitud recogió»
    rationale: El original describe a grupos o multitudes que se reunían y recogían materiales. El plural «las multitudes» conserva mejor el cuadro narrativo.
  - severity: medium
    issue: «antes de que le salieran canas»
    rationale: El original se refiere a un período anterior a alcanzar la edad canosa o vejez, no meramente a la aparición física de canas.
  - severity: low
    issue: «materiales preparados para la hoguera»
    rationale: El término de origen se refiere a instrumentos o implementos preparados para la pira. «Instrumentos» conserva mejor la amplitud sin convertirlos en combustible.
  - severity: low
    issue: Nota b especulativa
    rationale: La nota formula una reconstrucción provisional innecesaria y desplaza la atención desde el sentido expresado por el texto. Puede eliminarse sin pérdida de fidelidad.
  revised_text: 'Todo esto sucedió con tanta rapidez, más rápido de lo que las palabras pueden contar. Enseguida, las multitudes reunieron de los talleres y los baños públicos madera y manojos de leña; y los judíos, especialmente, colaboraron con entusiasmo en ello, como suelen hacerlo.[a]


    Cuando la pira estuvo preparada, se quitó todas sus prendas exteriores y se desató el cinturón. También intentó quitarse el calzado, cosa que antes no acostumbraba hacer, porque los fieles siempre se apresuraban a ser los primeros en tocar su carne. Pues, aun antes de llegar a la edad de las canas, había sido tratado con toda honra por su vida santa.


    Enseguida pusieron a su alrededor los instrumentos preparados para la pira. Y cuando también iban a clavarlo al madero, dijo:


    —Déjenme como estoy, porque quien me ha concedido soportar el fuego me concederá también permanecer inmóvil en la pira, aun sin la seguridad que ustedes buscan con los clavos.'
  revised_footnotes:
  - marker: a
    text: La frase «como suelen hacerlo» forma parte del relato antiguo y refleja la caracterización polémica del narrador sobre los judíos presentes; no debe entenderse como una descripción de todos los judíos.
    reason: Conserva una afirmación presente en el texto a la vez que delimita su alcance y evita extender una generalización hostil a un pueblo entero.
  revision_rationale: Se revisa el texto completo para mejorar la correspondencia con el testimonio de origen y su audit trail inglés, sin resolver doctrinalmente la referencia implícita a quien concede perseverancia ni identificar el madero con una cruz. Se conserva la ambigüedad del relato respecto de la costumbre de quitarse el calzado, pero se elimina una nota que especulaba sobre ella. La revisión directa de la tradición griega sigue siendo deseable para una validación filológica final, aunque los cambios propuestos son seguros frente al testimonio proporcionado.
