    Gayo copió este relato de los escritos de Ireneo. Gayo convivió con Ireneo, quien había sido discípulo del santo Policarpo. Este Ireneo se encontraba en Roma cuando el obispo Policarpo sufrió el martirio e instruyó a muchos. Circulan además muchos tratados suyos, excelentes y ortodoxos. En ellos menciona a Policarpo y dice que fue instruido por él. Refutó hábilmente toda herejía y transmitió la regla católica de la Iglesia tal como la había recibido del santo.[b] También relata que, en cierta ocasión, Marción, de quien toman su nombre los marcionitas, se encontró con el santo Policarpo y le dijo:



