    Y yo, Sócrates, lo transcribí en Corinto de la copia de Gayo. Que la gracia sea con todos.



    Y yo, Pionio, lo transcribí de nuevo de la copia antes mencionada, después de haberla buscado —pues el bienaventurado Policarpo se me mostró en una revelación, como explicaré más adelante—, y reuní el texto cuando ya estaba casi desgastado por su antigüedad, para que el Señor Jesucristo también me reúna con sus elegidos en su reino celestial. A él sea la gloria con el Padre y el Espíritu Santo por los siglos de los siglos. Amén.



