translation:
  language: es
  text: 'Les deseamos el bien de parte de Dios, hermanos, mientras caminan conforme a la palabra de Jesucristo que concuerda con el evangelio. Por medio de él sea dada gloria a Dios por la salvación de sus santos elegidos. Así como el bienaventurado Policarpo sufrió el martirio, que también a nosotros se nos conceda seguir sus huellas y ser hallados en el reino de Jesucristo.


    Gayo copió este relato de los escritos de Ireneo, discípulo de Policarpo. Gayo también convivió con Ireneo.


    Y yo, Sócrates, lo transcribí en Corinto de la copia de Gayo. Que la gracia sea con todos.


    Y yo, Pionio, lo transcribí de nuevo de la copia antes mencionada, después de haberla buscado —pues el bienaventurado Policarpo se me mostró en una revelación, como explicaré más adelante—. Reuní el texto cuando ya estaba casi destruido por el paso del tiempo, para que el Señor Jesucristo también me reúna con sus elegidos en su reino celestial. A él sea la gloria con el Padre y el Espíritu Santo por los siglos de los siglos. Amén.


    Los tres párrafos anteriores, según se leen en el manuscrito de Moscú:[a]


    Gayo copió este relato de los escritos de Ireneo. Gayo convivió con Ireneo, quien había sido discípulo del santo Policarpo. Este Ireneo se encontraba en Roma cuando el obispo Policarpo sufrió el martirio e instruyó a muchos. Circulan además muchos tratados suyos, excelentes y ortodoxos. En ellos menciona a Policarpo y dice que fue instruido por él. Refutó hábilmente toda herejía y transmitió la regla católica de la Iglesia tal como la había recibido del santo.[b] También relata que, en cierta ocasión, Marción, de quien toman su nombre los marcionitas, se encontró con el santo Policarpo y le dijo:


    —Reconócenos, Policarpo.


    Policarpo le respondió:


    —Sí, te reconozco: eres el primogénito de Satanás.


    En los escritos de Ireneo se afirma también que, el mismo día y a la misma hora en que Policarpo sufrió el martirio en Esmirna, Ireneo, que estaba en la ciudad de los romanos, oyó una voz como de trompeta que decía: «Policarpo ha sufrido el martirio».


    Así pues, como ya se ha dicho, Gayo hizo una copia de estos escritos de Ireneo, e Isócrates hizo otra en Corinto a partir de la copia de Gayo.[c]


    Y yo, Pionio, lo transcribí de nuevo de la copia de Isócrates. La había buscado en obediencia a una revelación del santo Policarpo, y reuní el texto cuando ya estaba casi destruido por el paso del tiempo, para que el Señor Jesucristo también me reúna con sus elegidos en su reino celestial. A él sea la gloria con el Padre, el Hijo y el Espíritu Santo por los siglos de los siglos. Amén.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los párrafos que siguen conservan una forma alternativa transmitida por el manuscrito de Moscú. Repiten y amplían la información de los párrafos anteriores.
    reason: Distinguir claramente la variante manuscrita del cuerpo previo y explicar la repetición.
  - marker: b
    text: Aquí «católica» tiene su sentido antiguo de «universal» y forma parte de una expresión histórica sobre la regla de fe de la Iglesia; no designa necesariamente una denominación moderna.
    reason: Evitar un anacronismo denominacional sin borrar el término del testimonio.
  - marker: c
    text: La primera forma llama «Sócrates» al copista de Corinto; la lectura del manuscrito de Moscú lo llama «Isócrates». Se conserva la diferencia entre los testimonios.
    reason: Señalar una variante onomástica genuina que no debe armonizarse.
lexical_decisions:
- source_word: God speed
  choice: Les deseamos el bien de parte de Dios
  rationale: Expresa la fórmula de despedida y bendición sin recurrir al arcaísmo español «Dios os guarde» ni reducirla a un saludo secular.
- source_word: walk by the word
  choice: caminan conforme a la palabra
  rationale: Conserva la metáfora bíblica de caminar y expresa de manera natural la idea normativa de vivir de acuerdo con la palabra.
- source_word: martyrdom / was martyred
  choice: martirio / sufrió el martirio
  rationale: Mantiene el vocabulario histórico cristiano y evita el poco natural «fue martirizado» en varios contextos.
- source_word: papers
  choice: escritos
  rationale: En este contexto de transmisión textual, «escritos» es más preciso y natural que «papeles».
- source_word: catholic rule of the Church
  choice: regla católica de la Iglesia
  rationale: Preserva el sentido histórico de «católica» como universal y la formulación técnica «regla», sin sustituirla por una denominación moderna.
- source_word: gathering it together
  choice: reuní el texto
  rationale: Comunica la labor de recopilar o reconstruir un ejemplar deteriorado sin afirmar más de lo que permite el testimonio.
theological_decisions:
- issue: Referente de «with whom» en la doxología inicial
  choice: Por medio de él sea dada gloria a Dios
  alternative: Con él sea la gloria a Dios
  rationale: El antecedente más cercano es Jesucristo; la formulación conserva su papel mediador y evita hacer que Dios sea el referente de una frase reflexiva incoherente.
- issue: «Catholic rule»
  choice: regla católica de la Iglesia
  alternative: regla universal de la Iglesia
  rationale: Se conserva el término histórico y su posible carga técnica; una nota aclara que no debe identificarse automáticamente con una denominación posterior.
- issue: Variantes trinitarias de las doxologías
  choice: Conservar «con el Padre y el Espíritu Santo» en la primera forma y «con el Padre, el Hijo y el Espíritu Santo» en la lectura de Moscú
  alternative: Armonizar ambas fórmulas
  rationale: Las diferencias del testimonio forman parte de la historia textual y no deben resolverse ni uniformarse silenciosamente.
- issue: Revelación de Policarpo a Pionio
  choice: Mantener la afirmación como testimonio del copista
  alternative: Atenuarla como sueño o tradición
  rationale: El texto presenta explícitamente una revelación; traducirla no implica pronunciarse sobre su naturaleza o autoridad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las fórmulas eclesiales e históricas necesarias, pero se evitaron arcaísmos como «vosotros», «os» y «sea nuestra suerte». El borrador depende del testimonio inglés público suministrado, pues la revisión directa del griego sigue pendiente; por ello, las decisiones sintácticas más delicadas son provisionales.
