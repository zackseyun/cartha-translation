review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado. «Hagan circular la carta», «escoge de entre sus propios siervos» y «Hijo unigénito» conservan adecuadamente los sentidos relevantes. Se ajusta el nombre propio al uso español establecido («Evaristo») y se precisa levemente la secuencia temporal de «when then ye have informed yourselves».
  naturalness: El español es claro, actual y de registro digno. «Cuando se hayan informado de estas cosas» expresa con mayor naturalidad y precisión la acción reflexiva ya completada antes de distribuir la carta. La puntuación de la doxología ayuda a delimitar los complementos sin alterar el sentido.
  terminology: «Señor», «siervos», «reino eterno», «Hijo unigénito» y «santos» son apropiados y conservadores. «Evaristo» es la forma española normal del nombre, preferible a «Evaresto».
  issues:
  - severity: low
    issue: 'Forma del nombre propio: «Evaresto»'
    rationale: El testimonio inglés presenta «Euarestus»; en español, la forma tradicional y reconocible correspondiente es «Evaristo». «Evaresto» no es la adaptación española habitual.
  - severity: low
    issue: «Después de enterarse de estas cosas»
    rationale: Aunque comprensible, «Cuando se hayan informado de estas cosas» conserva mejor la construcción reflexiva del testimonio («have informed yourselves») y la relación temporal con la orden siguiente.
  revised_text: 'Ustedes pidieron que se les contaran con más detalle los acontecimientos. Pero por ahora se los hemos dado a conocer de manera resumida por medio de nuestro hermano Marciano. Cuando se hayan informado de estas cosas, hagan circular la carta también entre los hermanos que están más lejos, para que ellos también glorifiquen al Señor, quien escoge de entre sus propios siervos.


    Ahora, a aquel que, por su gracia y generosidad, puede llevarnos a todos a su reino eterno por medio de su Hijo unigénito, Jesucristo, sean la gloria, el honor, el poder y la grandeza por siempre. Saluden a todos los santos. Los que están con nosotros los saludan. También los saludan Evaristo, quien escribió la carta, y toda su casa.'
  revised_footnotes: []
  revision_rationale: 'Se hacen únicamente correcciones seguras de forma y fluidez: se normaliza el nombre propio en español y se refleja más estrechamente el carácter reflexivo y perfectivo de la instrucción previa a la circulación de la carta. No se introducen interpretaciones sobre la elección, la mediación del Hijo ni el alcance de «casa».'
