review_pass:
  verdict: revise
  source_fidelity: 'El borrador transmite fielmente el contenido del testimonio inglés disponible: la petición de un relato más amplio, el informe resumido por medio de Marciano, la circulación de la carta, la elección de entre los siervos, la doxología y los saludos. Dado que no se suministra el texto griego, no se afirman precisiones que requieran cotejo directo con la tradición griega.'
  naturalness: El español es en general claro, actual y de registro digno. Conviene ajustar la transición temporal a una formulación más natural y hacer concordar en singular el verbo de la doxología, cuyo sujeto pospuesto se presenta como una atribución unitaria a Dios.
  terminology: «Señor», «siervos», «Hijo unigénito», «santos» y «casa» son opciones apropiadas y conservadoras del alcance del testimonio. Se adopta «hermanos y hermanas» para reflejar la capa inglesa auditada sin alterar el sentido comunitario de «brethren».
  issues:
  - severity: low
    issue: 'Concordancia en la doxología: «sean la gloria, el honor...»'
    rationale: En la fórmula doxológica española es más natural y sintácticamente preferible «sea la gloria, el honor, el poder y la grandeza», con un verbo singular que introduce la atribución conjunta.
  - severity: low
    issue: «Después de enterarse de estas cosas»
    rationale: Aunque comprensible, «Cuando se hayan informado de estas cosas» reproduce con mayor precisión la relación temporal de la exhortación y evita una construcción algo abrupta antes del imperativo.
  - severity: low
    issue: «hermanos» frente a la capa inglesa auditada «brothers and sisters»
    rationale: «Hermanos» puede funcionar genéricamente, pero «hermanos y hermanas» hace explícita en español la inclusión expresada en el English POB, sin requerir una decisión doctrinal.
  revised_text: 'Ustedes pidieron que se les contaran con más detalle los acontecimientos. Pero por ahora se los hemos dado a conocer de manera resumida por medio de nuestro hermano Marciano. Cuando se hayan informado de estas cosas, hagan circular la carta también entre los hermanos y hermanas que están más lejos, para que ellos también glorifiquen al Señor, quien escoge de entre sus propios siervos.


    Ahora, a aquel que por su gracia y generosidad puede llevarnos a todos a su reino eterno, por medio de su Hijo unigénito Jesucristo, sea la gloria, el honor, el poder y la grandeza por siempre. Saluden a todos los santos. Los que están con nosotros los saludan. También los saludan Evaresto, quien escribió la carta, y toda su casa.'
  revised_footnotes: []
  revision_rationale: Se realizan únicamente ajustes seguros de sintaxis, fluidez y correspondencia con la capa inglesa auditada. Se conserva la ambigüedad de la elección «de entre sus propios siervos», la fórmula «Hijo unigénito» y el alcance doméstico de «toda su casa».
