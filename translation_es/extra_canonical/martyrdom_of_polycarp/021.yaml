base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: es
  text: 'Ustedes pidieron que se les contaran con más detalle los acontecimientos. Pero por ahora se los hemos dado a conocer de manera resumida por medio de nuestro hermano Marciano. Después de enterarse de estas cosas, hagan circular la carta también entre los hermanos que están más lejos, para que ellos también glorifiquen al Señor, quien escoge de entre sus propios siervos.


    Ahora, a aquel que por su gracia y generosidad puede llevarnos a todos a su reino eterno, por medio de su Hijo unigénito Jesucristo, sean la gloria, el honor, el poder y la grandeza por siempre. Saluden a todos los santos. Los que están con nosotros los saludan. También los saludan Evaresto, quien escribió la carta, y toda su casa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: shown unto you
  choice: se les contaran
  rationale: En este contexto se refiere a exponer o relatar los acontecimientos; «contaran» es natural y conserva el sentido comunicativo del testimonio inglés disponible.
- source_word: certified you
  choice: se los hemos dado a conocer
  rationale: Evita el matiz jurídico moderno de «certificar» y expresa con claridad que los destinatarios fueron informados.
- source_word: send the letter about
  choice: hagan circular la carta
  rationale: Expresa naturalmente la instrucción de remitir la carta a comunidades más lejanas.
- source_word: maketh election from His own servants
  choice: escoge de entre sus propios siervos
  rationale: Conserva tanto la acción de escoger como la construcción «de entre», sin añadir una interpretación doctrinal específica.
- source_word: bounty
  choice: generosidad
  rationale: Comunica la bondad dadivosa del término del testimonio, en lenguaje actual y digno.
- source_word: only-begotten Son
  choice: Hijo unigénito
  rationale: Mantiene la formulación cristológica tradicional y formal del testimonio, sin parafrasear su alcance teológico.
- source_word: saints
  choice: santos
  rationale: Conserva el término comunitario cristiano antiguo sin sustituirlo por una explicación interpretativa.
- source_word: house
  choice: casa
  rationale: Preserva la posible amplitud antigua del grupo doméstico, en vez de limitarla necesariamente a la familia biológica.
theological_decisions:
- issue: Elección divina entre los siervos del Señor
  choice: «quien escoge de entre sus propios siervos»
  alternative: «quien elige a sus propios siervos»
  rationale: La opción elegida conserva la relación «de entre» del testimonio y evita resolver si la frase alude específicamente a mártires, ministros u otro grupo.
- issue: Mediación del Hijo unigénito
  choice: «por medio de su Hijo unigénito Jesucristo»
  alternative: «mediante Jesucristo, su único Hijo»
  rationale: Se retiene «unigénito» para conservar la formulación teológica recibida y la estructura mediadora, sin reducirla simplemente a «único».
- issue: Capacidad divina y gracia
  choice: «a aquel que por su gracia y generosidad puede llevarnos»
  alternative: «a aquel que puede llevarnos, por su gracia y bondad»
  rationale: La colocación escogida vincula los medios divinos con la acción de llevar al reino, a la vez que mantiene la tensión entre poder, gracia y generosidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se evitan arcaísmos. El borrador se basa necesariamente en el testimonio inglés de dominio público y en la capa inglesa auditada suministrada; queda pendiente la revisión directa del griego. Por esa limitación no se añaden notas textuales ni se afirman matices griegos no comprobados.
