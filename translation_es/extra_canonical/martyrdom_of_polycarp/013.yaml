  naturalness: El español es claro, actual y de registro apropiado. «Se pusieron de acuerdo para gritar a una voz» comunica con más naturalidad y precisión la acción colectiva que «todos gritaron a una voz que». «Espectáculos de caza» evita la generalidad moderna de «juegos» sin volver el texto técnico.
  terminology: «Procónsul», «gentiles», «asiarca», «gracia», «rendir culto», «fieles» y «proféticamente» son elecciones adecuadas. La nota de «asiarca» debe evitar presentar como función única lo que fue un cargo provincial de perfil cívico-religioso, asociado también a la presidencia de espectáculos.
