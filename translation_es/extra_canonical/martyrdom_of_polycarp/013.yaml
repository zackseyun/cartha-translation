    issue: «juegos» para los espectáculos ya concluidos
    rationale: El contexto y el término antiguo se refieren específicamente a espectáculos de caza/animales en la arena, no a juegos en sentido amplio. «Espectáculos de caza» conserva la referencia histórica con claridad.
  - severity: low
    issue: «Entonces todos gritaron a una voz que...»
    rationale: La formulación atenúa el matiz de decisión o acuerdo previo de la multitud. «Todos se pusieron de acuerdo para gritar a una voz...» lo preserva.
  - severity: low
    issue: Alcance de la nota sobre «asiarca»
    rationale: El cargo no debe definirse de manera demasiado rígida como simple supervisor de celebraciones y cultos. Una formulación que indique su vínculo con el culto provincial y los espectáculos públicos es más cauta.
