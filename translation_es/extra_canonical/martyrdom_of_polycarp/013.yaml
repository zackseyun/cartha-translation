base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: es
  text: 'Mientras decía estas cosas y muchas más, se llenó de valor y alegría, y su rostro se llenó de gracia. Lejos de abatirse por lo que le decían, dejó asombrado al procónsul. Entonces el procónsul envió a su propio heraldo para que proclamara tres veces en medio del estadio: «Policarpo ha confesado que es cristiano».


    Cuando el heraldo hizo esta proclamación, toda la multitud de gentiles y judíos que vivían en Esmirna gritó con furia incontenible y a gran voz: «Este es el maestro de Asia, el padre de los cristianos, el destructor de nuestros dioses, el que enseña a muchos a no ofrecer sacrificios ni rendir culto». Mientras gritaban estas cosas, pidieron a Felipe el asiarca[a] que soltara un león contra Policarpo. Pero él dijo que no le estaba permitido hacerlo, pues ya había dado por terminados los espectáculos de caza.


    Entonces todos se pusieron de acuerdo para gritar a una voz que Policarpo debía ser quemado vivo. Era necesario que se cumpliera la visión que había tenido acerca de su almohada: mientras oraba, la vio ardiendo y, volviéndose hacia los fieles que estaban con él, dijo proféticamente: «Es necesario que sea quemado vivo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Asiarca: título de un funcionario provincial de Asia vinculado al culto público y a la presidencia de espectáculos.'
    reason: Aclara el título histórico sin reducir indebidamente sus funciones a una sola actividad.
lexical_decisions:
- source_word: countenance was filled with grace
  choice: su rostro se llenó de gracia
  rationale: Conserva la formulación teológicamente sugerente del testimonio sin reducir «gracia» a serenidad o belleza.
- source_word: Gentiles
  choice: gentiles
  rationale: Término histórico y religioso comprensible en español bíblico; aquí distingue a los no judíos de los judíos de Esmirna.
- source_word: the father of the Christians
  choice: el padre de los cristianos
  rationale: Mantiene la acusación honorífica o comunitaria de la multitud sin interpretarla como un cargo eclesiástico técnico.
- source_word: Asiarch
  choice: asiarca
  rationale: Se conserva el título cívico-religioso antiguo y se aclara mediante nota.
- source_word: worship
  choice: rendir culto
  rationale: Expresa con naturalidad la acción religiosa y evita la ambigüedad moderna de «adorar» en algunos contextos.
- source_word: must needs
  choice: era necesario / es necesario
  rationale: Reproduce el lenguaje de necesidad narrativa y profética sin decidir expresamente si se trata de necesidad divina, profética o literaria.
theological_decisions:
- issue: El sentido de «lleno de gracia» aplicado al rostro de Policarpo
  choice: se llenó de gracia
  alternative: mostraba una expresión serena
  rationale: Se conserva la dimensión religiosa y la ambigüedad del testimonio en vez de convertirla únicamente en un estado psicológico.
- issue: La necesidad del cumplimiento de la visión
  choice: Era necesario que se cumpliera la visión
  alternative: Así se cumplió la visión
  rationale: Mantiene la afirmación fuerte de necesidad presente en el testimonio, sin especificar una doctrina de providencia o predestinación.
- issue: Carácter profético de las palabras de Policarpo
  choice: dijo proféticamente
  alternative: predijo
  rationale: Conserva la caracterización explícita del narrador y no la reduce a una simple conjetura.
translation_notes:
  register: Español latinoamericano neutral, narración digna y clara. Se conservaron los títulos históricos, el lenguaje de gracia, profecía y cumplimiento, y la intensidad retórica de la multitud. Dado que la revisión directa del griego está pendiente, el borrador sigue de cerca el testimonio inglés público suministrado y evita decisiones que eliminen ambigüedades potenciales.
