base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: es
  text: 'Por tanto, cuando el centurión vio la oposición de los judíos, puso a Policarpo en medio y lo quemó según la costumbre de ellos.[a]


    Después recogimos sus huesos, más valiosos que piedras preciosas y más estimados que oro refinado, y los depositamos en un lugar apropiado.


    Allí el Señor nos permitirá reunirnos, según nos sea posible, con alegría y gozo, y celebrar el día de su nacimiento como mártir,[b] para recordar a quienes ya han luchado en el combate y para entrenar y preparar a quienes habrán de hacerlo en el futuro.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «según la costumbre de ellos» conserva la referencia pronominal del testimonio disponible; la identificación exacta de «ellos» deberá comprobarse mediante revisión directa del griego.
    reason: Evitar resolver prematuramente una posible ambigüedad del referente.
  - marker: b
    text: Lit. «el día de nacimiento de su martirio». La expresión designa la conmemoración del día de su martirio y conserva la imagen de un nacimiento asociado a él.
    reason: Explicar una metáfora antigua que podría resultar poco familiar sin reemplazarla por completo.
  - marker: c
    text: El «combate» es una imagen de la prueba y el martirio; quienes lo harán en el futuro son quienes afrontarán un testimonio semejante.
    reason: Aclarar la metáfora agonística y el referente del verbo final.
lexical_decisions:
- source_word: burnt him
  choice: lo quemó
  rationale: Conserva de manera directa la acción del testimonio disponible, sin introducir la explicación interpretativa «quemó su cuerpo».
- source_word: bones
  choice: huesos
  rationale: Traducción concreta y natural que preserva la referencia a los restos recogidos por la comunidad.
- source_word: finer than refined gold
  choice: más estimados que oro refinado
  rationale: En este contexto, el comparativo expresa aprecio o excelencia, no finura física; «más estimados» comunica ese valor sin confundir al lector.
- source_word: birth-day of his martyrdom
  choice: día de su nacimiento como mártir
  rationale: Mantiene la metáfora antigua del nacimiento vinculada al martirio, mientras la nota aclara su función conmemorativa.
- source_word: contest
  choice: combate
  rationale: Preserva la metáfora agonística de quienes han padecido el martirio y resulta natural en español contemporáneo.
theological_decisions:
- issue: Sentido del «día de nacimiento» asociado al martirio
  choice: día de su nacimiento como mártir
  alternative: aniversario de su martirio
  rationale: La opción elegida conserva la imagen teológica e histórica del texto sin añadir explícitamente «nacimiento al cielo», formulación que resolvería más de lo que permite el testimonio proporcionado.
- issue: Referente de «según la costumbre de ellos»
  choice: Se conserva el pronombre sin identificar expresamente a su referente
  alternative: según la costumbre de los judíos
  rationale: El testimonio inglés permite asociarlo con los judíos, pero la formulación pronominal conserva la posible ambigüedad hasta que se complete la revisión directa del griego.
- issue: Finalidad de la conmemoración de los mártires
  choice: recordar a los anteriores y preparar a los futuros
  alternative: formular una doctrina posterior sobre veneración o intercesión
  rationale: Se reproduce únicamente la doble finalidad declarada en el pasaje, sin importar desarrollos confesionales posteriores.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las imágenes de valor, nacimiento y combate, con aclaraciones breves. Este borrador es necesariamente provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega está pendiente.
