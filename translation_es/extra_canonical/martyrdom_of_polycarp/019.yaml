review_pass:
  verdict: revise
  source_fidelity: Se conserva el contenido central, incluida la violencia histórica, la valoración de los restos, la reunión comunitaria y la doble finalidad de la conmemoración. Sin embargo, «día de su nacimiento como mártir» desplaza el genitivo de «su martirio» hacia Policarpo y no reproduce con precisión la imagen del original/testimonio («birth-day of his martyrdom»). Además, «para entrenar y preparar a quienes...» convierte los sustantivos de finalidad («training and preparation») en verbos transitivos y añade una relación sintáctica más fuerte con las personas futuras.
  naturalness: El español es generalmente claro y de registro digno. «Según la costumbre de ellos» es algo rígido, pero es aceptable aquí porque conserva de manera deliberada el referente plural no resuelto. «El día del nacimiento de su martirio» es una formulación marcada, pero la nota permite conservar la imagen antigua sin recurrir a una interpretación doctrinal posterior.
  terminology: «Combate» reproduce adecuadamente la imagen agonística. «Más estimados que oro refinado» puede expresar valoración, pero «más puros que el oro refinado» sigue más de cerca «finer than refined gold» y mantiene el paralelismo comparativo. La nota sobre el «día de nacimiento» debe corregirse para que explique la construcción realmente traducida, no una paráfrasis distinta.
  issues:
  - severity: medium
    issue: La expresión «día de su nacimiento como mártir» altera la relación entre «nacimiento» y «martirio».
    rationale: El testimonio dice «the birth-day of his martyrdom»; el nacimiento se predica metafóricamente del martirio, no se formula directamente como el nacimiento de Policarpo «como mártir». Conviene preservar esa construcción y explicarla en nota.
  - severity: medium
    issue: «Para entrenar y preparar a quienes habrán de hacerlo» cambia la forma y estrecha la sintaxis de la finalidad final.
    rationale: El texto habla de «training and preparation of those that shall do so hereafter». «Para la formación y preparación de quienes lo harán en el futuro» conserva los sustantivos y deja que «lo» remita al combate sin añadir una acción de entrenar a esas personas como objeto directo.
  - severity: low
    issue: «Más estimados que oro refinado» se aparta de «finer than refined gold».
    rationale: Aunque el griego puede connotar calidad comprobada, «más puros que el oro refinado» comunica mejor la excelencia comparativa expresada por el testimonio inglés y resulta natural en español.
  revised_text: 'Por tanto, cuando el centurión vio la oposición suscitada por los judíos, puso a Policarpo en medio y lo quemó según la costumbre de ellos.[a]


    Después recogimos sus huesos, más valiosos que piedras preciosas y más puros que el oro refinado, y los depositamos en un lugar apropiado.


    Allí el Señor nos permitirá reunirnos, en la medida en que podamos, con alegría y gozo, y celebrar el día del nacimiento de su martirio,[b] para recordar a quienes ya han luchado en el combate y para la formación y preparación de quienes lo harán en el futuro.[c]'
  revised_footnotes:
  - marker: a
    text: La expresión «según la costumbre de ellos» conserva la referencia pronominal del testimonio disponible; la identificación exacta de «ellos» deberá comprobarse mediante revisión directa del griego.
    reason: Evitar resolver prematuramente una posible ambigüedad del referente.
  - marker: b
    text: Lit. «el día del nacimiento de su martirio». La expresión designa la conmemoración del día de su martirio y conserva la imagen antigua de un nacimiento asociado a él.
    reason: Explicar una metáfora antigua que podría resultar poco familiar sin reemplazarla por completo.
  - marker: c
    text: El «combate» es una imagen de la prueba y el martirio; «lo harán» retoma esa imagen para quienes la afrontarán en el futuro.
    reason: Aclarar la metáfora agonística y el referente del verbo final.
  revision_rationale: 'La revisión corrige dos desplazamientos semántico-sintácticos: restituye la relación metafórica entre «nacimiento» y «martirio», y conserva la finalidad nominal de «formación y preparación». También ajusta el segundo comparativo para reflejar mejor la excelencia del oro refinado. Se mantienen la ambigüedad prudente de «ellos», el registro latinoamericano neutral y las tres anclas de nota.'
