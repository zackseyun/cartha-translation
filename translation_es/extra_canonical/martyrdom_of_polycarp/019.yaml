review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés disponible. Sin embargo, «más estimados que oro refinado» cambia la comparación de cualidad («finer than») por una de valoración subjetiva. Además, «día de su nacimiento como mártir» es una paráfrasis aceptable, pero la nota lo presenta de manera imprecisa como si fuera la formulación literal.
  naturalness: El español es claro, actual y de registro adecuado. «Puso a Policarpo en medio» y «según nos sea posible» son naturales en este contexto. «Más puros que el oro refinado» comunica mejor la comparación antigua sin sonar excesivamente literal.
  terminology: Se mantienen correctamente Policarpo, Señor, huesos, martirio y combate. Se conserva prudentemente la ambigüedad de «según la costumbre de ellos», dado que la revisión directa del griego está pendiente.
  issues:
  - severity: medium
    issue: «más estimados que oro refinado»
    rationale: El testimonio inglés dice «finer than refined gold», no «más apreciados/estimados». La versión propuesta introduce un matiz de estima que no está expresado en el testimonio de base.
  - severity: low
    issue: 'Nota b: formulación de la literalidad'
    rationale: «Día de nacimiento de su martirio» no equivale exactamente a «día de su nacimiento como mártir», que es la redacción del texto. Conviene describir la expresión como imagen de nacimiento vinculada al martirio, sin atribuir una literalidad inexacta.
  revised_text: 'Por tanto, cuando el centurión vio la oposición de los judíos, puso a Policarpo en medio y lo quemó según la costumbre de ellos.[a]


    Después recogimos sus huesos, más valiosos que piedras preciosas y más puros que el oro refinado, y los depositamos en un lugar apropiado.


    Allí el Señor nos permitirá reunirnos, según nos sea posible, con alegría y gozo, y celebrar el día de su nacimiento como mártir,[b] para recordar a quienes ya han luchado en el combate y para entrenar y preparar a quienes habrán de hacerlo en el futuro.[c]'
  revised_footnotes:
  - marker: a
    text: La expresión «según la costumbre de ellos» conserva la referencia pronominal del testimonio disponible; la identificación exacta de «ellos» deberá comprobarse mediante revisión directa del griego.
    reason: Evitar resolver prematuramente una posible ambigüedad del referente.
  - marker: b
    text: La expresión vincula el nacimiento con el martirio y designa su conmemoración anual. Conserva una imagen antigua sin explicitar interpretaciones posteriores.
    reason: Aclarar una formulación histórica que puede resultar poco familiar, sin sustituirla por una formulación doctrinal.
  - marker: c
    text: El «combate» es una imagen de la prueba y el martirio; quienes lo harán en el futuro son quienes afrontarán un testimonio semejante.
    reason: Aclarar la metáfora agonística y el referente del verbo final.
  revision_rationale: Se corrige la comparación con el oro para reflejar una cualidad de pureza o finura, en vez de una valoración de estima. También se ajusta la nota sobre el nacimiento y el martirio para que explique la imagen sin afirmar una literalidad que no corresponde exactamente a la redacción española. La revisión sigue siendo provisional hasta cotejar directamente la tradición griega.
