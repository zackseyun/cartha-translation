base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: es
  text: 'Cuando Policarpo entraba en el estadio, le llegó una voz del cielo: «Sé fuerte, Policarpo, y compórtate con valentía». Nadie vio al que hablaba, pero los nuestros que estaban presentes oyeron la voz. Finalmente, cuando lo presentaron, se produjo un gran alboroto, pues habían oído que Policarpo había sido arrestado.


    Cuando lo llevaron ante el procónsul, este le preguntó si él era Policarpo. Al confesar que sí, trató de persuadirlo a renegar, diciéndole: «Ten consideración de tu edad», y otras cosas semejantes que acostumbran decir: «Jura por la Fortuna del César[a]; arrepiéntete y di: “¡Fuera los ateos!”». Entonces Policarpo, con expresión solemne, miró a toda la multitud de paganos sin ley que estaba en el estadio, les hizo una seña con la mano y, gimiendo y alzando la mirada al cielo, dijo: «¡Fuera los ateos!»


    Pero cuando el procónsul siguió presionándolo y le dijo: «Presta juramento y te dejaré en libertad; insulta a Cristo», Policarpo respondió: «Desde hace ochenta y seis años le sirvo, y él no me ha hecho ningún mal. ¿Cómo podría entonces blasfemar contra mi Rey, que me salvó?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Fortuna del César» traduce una expresión cultual romana: la Fortuna, entendida como poder o divinidad tutelar asociada al emperador. No se refiere simplemente a la buena suerte.'
    reason: Aclara el sentido histórico-religioso de Καίσαρος τύχην sin reemplazar en el texto el término del original por una interpretación.
lexical_decisions:
- source_word: ἀνδρίζου
  choice: compórtate con valentía
  rationale: Conserva el sentido idiomático de mostrarse valiente sin reproducir literalmente la expresión marcada por género «hazte hombre».
- source_word: Καίσαρος τύχην
  choice: el espíritu protector del César
  rationale: Expresa la noción cultual grecorromana asociada a la fortuna o poder tutelar del emperador; evita que «genio» se entienda en su sentido moderno de gran inteligencia.
- source_word: ἀθέους
  choice: los ateos
  rationale: Mantiene la acusación histórica aplicada a los cristianos por rechazar a los dioses públicos y conserva la inversión irónica de Policarpo al dirigirla contra la multitud.
- source_word: λοιδορήσον τὸν Χριστόν
  choice: insulta a Cristo
  rationale: Traduce de manera natural la exigencia de hablar injuriosamente contra Cristo, sin elevarla de antemano al término teológico «blasfemar» usado en la respuesta.
- source_word: δεσπότην
  choice: Rey
  rationale: Sigue el testimonio suministrado y expresa soberanía personal; la revisión directa del griego deberá confirmar si la lectura subyacente corresponde a «Rey» o «Señor/Amo».
theological_decisions:
- issue: Objeto de la negación solicitada por el procónsul
  choice: «trató de persuadirlo a renegar», sin complemento explícito
  alternative: «trató de persuadirlo a negar a Cristo»
  rationale: El testimonio fuente deja implícito el objeto; no se añade «a Cristo» aunque el contexto lo haga evidente.
- issue: Sentido de los ochenta y seis años
  choice: «Durante ochenta y seis años le he servido»
  alternative: «Tengo ochenta y seis años y siempre le he servido»
  rationale: Se conserva la ambigüedad histórica entre la edad total de Policarpo y la duración de su servicio cristiano.
- issue: Salvación expresada por Policarpo
  choice: «mi Rey, que me salvó»
  alternative: «mi Rey y Salvador»
  rationale: Mantiene la forma verbal y su relación directa con Policarpo, sin convertirla en un título compuesto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono narrativo martirial y la repetición deliberada de «¡Fuera los ateos!». La redacción es provisional porque el expediente indica que todavía está pendiente la revisión directa de la tradición manuscrita griega.
