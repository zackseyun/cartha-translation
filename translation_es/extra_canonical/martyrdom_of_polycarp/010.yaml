  revision_rationale: 'La revisión corrige tres desplazamientos de sentido y mantiene las decisiones acertadas del borrador: no explicita el objeto de «renegar»; conserva la inversión irónica de «¡Fuera los ateos!»; y no resuelve indebidamente si los ochenta y seis años indican la edad de Policarpo o la duración de su servicio a Cristo. Se añade una nota anclada únicamente donde el referente cultual de «Fortuna» necesita aclaración histórica.'
