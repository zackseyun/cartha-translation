review_pass:
  verdict: revise
  source_fidelity: La traducción conserva adecuadamente la secuencia narrativa, la ironía de «¡Fuera los ateos!», la ambigüedad de los ochenta y seis años y la distinción entre la orden de injuriar a Cristo y la respuesta de Policarpo, que usa «blasfemar». Sin embargo, «espíritu protector del César» interpreta en exceso Καίσαρος τύχην, que se refiere más directamente a la fortuna/divinidad tutelar imperial. «Si él era Policarpo» también especifica un nombre donde el testigo dice simplemente «si era él/el hombre».
  naturalness: El registro es claro, actual y apropiadamente sobrio. «Lo hicieron comparecer», «extendió la mano hacia ellos» y «Presta juramento» son comprensibles, pero «lo llevaron ante el procónsul», «hizo un gesto con la mano hacia ellos» y «Jura» resultan más directos y naturales en este contexto.
  terminology: «Compórtate con valentía» comunica bien el imperativo ἀνδρίζου sin calcar una expresión marcada por género. Debe sustituirse «espíritu protector» por «la fortuna del César», con nota explicativa, para no convertir una fórmula de juramento cultual en una afirmación demasiado definida sobre un espíritu personal. «Paganos sin ley» refleja mejor la caracterización de la multitud que «paganos impíos», que desplaza el sentido hacia la impiedad.
  issues:
  - severity: medium
    issue: «Espíritu protector del César» para Καίσαρος τύχην
    rationale: La expresión griega se refiere a la τύχη, la fortuna o poder tutelar personificado asociado con el César. «Espíritu protector» es una interpretación más estrecha y no es la equivalencia más directa; una nota puede explicar el trasfondo cultual.
  - severity: low
    issue: «Si él era Policarpo»
    rationale: El texto base pregunta si «era él/el hombre», sin repetir el nombre. La reformulación propuesta evita añadir esa identificación explícita.
  - severity: low
    issue: «Paganos impíos»
    rationale: «Impíos» no reproduce con precisión el matiz de ἀνόμων («sin ley», «transgresores»). «Paganos sin ley» conserva mejor la formulación, aun reconociendo su carácter polémico dentro del relato.
  revised_text: 'Cuando Policarpo entraba en el estadio, le llegó una voz del cielo: «Sé fuerte, Policarpo, y compórtate con valentía». Nadie vio a quien hablaba, pero los nuestros que estaban presentes oyeron la voz. Finalmente, cuando lo hicieron pasar, hubo un gran alboroto, pues habían oído que Policarpo había sido arrestado.


    Cuando lo llevaron ante el procónsul, este le preguntó si era él. Al confesar que sí, trató de persuadirlo para que se retractara, diciéndole: «Ten consideración de tu edad», y otras cosas semejantes que suelen decir: «Jura por la fortuna del César[a]; arrepiéntete y di: “¡Fuera los ateos!”». Entonces Policarpo, con expresión solemne, miró a toda la multitud de paganos sin ley que estaba en el estadio e hizo un gesto con la mano hacia ellos; y, gimiendo y alzando la mirada al cielo, dijo: «¡Fuera los ateos!»


    Pero cuando el magistrado siguió presionándolo y le dijo: «Jura, y te dejaré en libertad; insulta a Cristo», Policarpo respondió: «Durante ochenta y seis años le he servido, y él no me ha hecho ningún mal. ¿Cómo podría entonces blasfemar contra mi Rey, que me salvó?»'
  revised_footnotes:
  - marker: a
    text: «La fortuna del César» traduce una fórmula de juramento vinculada al culto imperial. «Fortuna» puede referirse al poder tutelar o a la buena suerte personificada del emperador; no significa aquí simplemente riqueza o suerte casual.
    reason: Aclara el trasfondo histórico-religioso de τύχη sin imponer la interpretación específica «espíritu protector».
  revision_rationale: Se realizan correcciones limitadas para reflejar más de cerca el griego indicado en las decisiones léxicas y para evitar expansiones interpretativas. Se conserva la ambigüedad sobre el objeto de la retractación y sobre los ochenta y seis años, así como la terminología diferenciada entre «insulta» y «blasfemar».
