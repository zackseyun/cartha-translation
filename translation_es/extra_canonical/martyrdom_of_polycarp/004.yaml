base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: es
  text: 'Pero gracias a Dios, porque verdaderamente venció a todos. El muy noble Germánico infundió ánimo a los que tenían miedo mediante la firmeza que había en él, y luchó de manera extraordinaria contra las fieras. Cuando el procónsul trató de persuadirlo y le ordenó que tuviera compasión de su juventud, Germánico recurrió a la fuerza y arrastró hacia sí a la fiera, pues deseaba librarse cuanto antes de la vida injusta y sin ley de ellos.


    Después de esto, toda la multitud, maravillada ante la valentía del pueblo de los cristianos, amado por Dios y temeroso de Dios, gritó:


    —¡Fuera los ateos![a] ¡Que se busque a Policarpo!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La multitud llama «ateos» a los cristianos porque estos rechazaban el culto a los dioses reconocidos por la sociedad pagana; el término no significa aquí que los cristianos negaran toda existencia divina.
    reason: Aclara el sentido histórico de una acusación que para el lector moderno puede parecer contradictoria.
lexical_decisions:
- source_word: ἐκράτησεν (reflejado por “prevailed” en el testimonio inglés)
  choice: venció
  rationale: Expresa de manera natural la idea de imponerse o prevalecer. Se omite el pronombre sujeto para conservar la ambigüedad de la forma verbal implícita en el testimonio.
- source_word: Germanicus
  choice: Germánico
  rationale: Se emplea la forma española tradicional del nombre propio latino.
- source_word: constancy
  choice: firmeza
  rationale: Comunica perseverancia y entereza sin usar un giro arcaico.
- source_word: wild beasts / wild beast
  choice: fieras / la fiera
  rationale: Es la expresión natural en español para los animales usados en el espectáculo y conserva el cambio de plural a singular del testimonio.
- source_word: God-beloved and God-fearing
  choice: amado por Dios y temeroso de Dios
  rationale: Mantiene ambos calificativos y su referencia explícita a Dios, evitando fusionarlos o reinterpretarlos.
- source_word: atheists
  choice: ateos
  rationale: Conserva la acusación histórica y la ironía del grito de la multitud.
theological_decisions:
- issue: Sujeto de «venció a todos»
  choice: 'Se deja implícito: «porque verdaderamente venció a todos»'
  alternative: «porque él verdaderamente venció a todos» o «porque Dios verdaderamente venció a todos»
  rationale: El testimonio suministrado permite relacionar el sujeto con Dios, pero la revisión directa del griego está pendiente. La omisión natural del pronombre en español evita resolver indebidamente la referencia.
- issue: Descripción colectiva de los cristianos
  choice: «el pueblo de los cristianos, amado por Dios y temeroso de Dios»
  alternative: «la raza de los cristianos» o «los cristianos, amados por Dios y temerosos de Dios»
  rationale: «Pueblo» conserva el carácter colectivo del testimonio sin introducir connotaciones raciales modernas; los dos calificativos teológicos permanecen distintos.
- issue: Sentido de la liberación deseada por Germánico
  choice: «librarse cuanto antes de la vida injusta y sin ley de ellos»
  alternative: «obtener cuanto antes la liberación de esta vida injusta y sin ley»
  rationale: Se conserva la referencia pronominal del testimonio disponible, aunque resulte difícil, en vez de identificar explícitamente la liberación con la muerte, el martirio o el mundo presente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen el tono narrativo y la fuerza del clamor público. El borrador es necesariamente provisional porque el material suministrado indica que aún está pendiente la revisión directa de la tradición manuscrita griega; por ello se han evitado correcciones conjeturales de los giros difíciles del testimonio inglés.
