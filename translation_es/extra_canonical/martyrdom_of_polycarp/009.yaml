base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: es
  text: 'Pero cuando por fin terminó su oración, después de recordar a todos los que alguna vez se habían cruzado en su camino —pequeños y grandes, distinguidos y humildes— y a toda la Iglesia universal en el mundo entero, llegó la hora de partir. Lo montaron en un asno y lo llevaron a la ciudad, pues era un sábado solemne.[a]


    Herodes, el jefe de la policía, y su padre Nicetes salieron a su encuentro. Lo hicieron subir a su carruaje, se sentaron a su lado y trataron de persuadirlo. Le decían:


    —¿Qué mal hay en decir: «César es Señor», ofrecer incienso —y otras cosas por el estilo— y así salvarte?


    Al principio él no les respondió. Pero, como insistían, les dijo:


    —No voy a hacer lo que me aconsejan.


    Entonces, al no poder persuadirlo, le dirigieron amenazas y lo hicieron bajar con tanta prisa que, al descender del carruaje, se lastimó la espinilla. Sin siquiera volverse, siguió adelante con paso decidido y rápido, como si nada le hubiera sucedido, mientras lo conducían al estadio. Había allí tal tumulto que no se alcanzaba a oír la voz de nadie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «un gran sábado» o «un sábado grande». La referencia exacta de la expresión no es segura en la evidencia suministrada.
    reason: Señala una expresión históricamente ambigua sin imponer una identificación litúrgica.
lexical_decisions:
- source_word: all who at any time had come in his way
  choice: todos los que alguna vez se habían cruzado en su camino
  rationale: Conserva la amplitud de la expresión sin limitarla a amigos, visitantes o conocidos.
- source_word: small and great, high and low
  choice: pequeños y grandes, distinguidos y humildes
  rationale: Mantiene los dos pares inclusivos; «distinguidos y humildes» expresa de manera natural una diferencia de posición social sin identificarla estrictamente con riqueza.
- source_word: universal Church
  choice: Iglesia universal
  rationale: Reproduce el alcance universal del testimonio y evita sustituirlo por una denominación eclesiástica posterior.
- source_word: captain of police
  choice: jefe de la policía
  rationale: Comunica con claridad la función oficial indicada por el testimonio, sin precisar un rango antiguo no verificable desde la evidencia suministrada.
- source_word: Caesar is Lord
  choice: César es Señor
  rationale: Preserva la formulación confesional y su tensión política y religiosa, sin parafrasearla.
- source_word: departure
  choice: partir
  rationale: Conserva el posible matiz eufemístico de la partida sin explicitar muerte o ejecución.
theological_decisions:
- issue: La afirmación «César es Señor» frente a la lealtad cristiana
  choice: Se conserva literalmente «César es Señor».
  alternative: Parafrasear «César es nuestro soberano» o explicar que se trataba de adoración imperial.
  rationale: La expresión contiene una tensión política y religiosa genuina que el texto deja implícita; explicarla dentro del cuerpo resolvería más de lo que dice el testimonio.
- issue: Sentido de «la hora de partir»
  choice: Se mantiene como «llegó la hora de partir».
  alternative: Traducir «llegó la hora de su muerte».
  rationale: La expresión puede funcionar como eufemismo de muerte, pero conviene conservar su forma abierta y sobria.
- issue: Identidad del «sábado solemne»
  choice: Se conserva la expresión con una nota de cautela.
  alternative: Identificarlo con una festividad judía concreta o con una interpretación cristiana posterior.
  rationale: La evidencia proporcionada no permite fijar con seguridad su referencia histórica o litúrgica.
translation_notes:
  register: Español latinoamericano neutral, narración digna y clara. Se emplea «ustedes» implícito en «me aconsejan» y se evita vocabulario confesional añadido. El borrador se basa de manera provisional en el testimonio inglés público suministrado; queda pendiente la revisión directa del griego.
