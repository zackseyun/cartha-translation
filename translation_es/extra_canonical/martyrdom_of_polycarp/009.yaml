review_pass:
  verdict: revise
  source_fidelity: El borrador conserva fielmente la secuencia narrativa, los destinatarios de la oración, la fórmula «César es Señor», la negativa de Policarpo y el tumulto final. Sin embargo, «sábado solemne» interpreta la expresión griega μεγάλη σαββάτῳ / el inglés «high Sabbath»; conviene mantener «gran sábado» y dejar la incertidumbre histórica en nota. «Lo sentaron sobre un asno» refleja con mayor precisión la acción narrada que «Lo montaron».
  naturalness: El español es claro, moderno y de registro narrativo digno. Se ajusta levemente la formulación del traslado y se integra con más fluidez la frase sobre ofrecer incienso y salvarse.
  terminology: «Iglesia universal», «César es Señor», «asno», «carruaje» y «estadio» son adecuados. Se conserva «Nicetes», conforme al testimonio inglés suministrado, sin imponer una normalización onomástica no necesaria.
  issues:
  - severity: medium
    issue: «sábado solemne» para «high Sabbath» / μεγάλη σαββάτῳ
    rationale: «Solemne» añade una caracterización litúrgica que no está expresada de modo equivalente en la formulación transmitida. «Gran sábado» conserva el calificativo y la nota puede señalar que la referencia exacta es incierta.
  - severity: low
    issue: «Lo montaron en un asno»
    rationale: Puede entenderse naturalmente, pero «lo sentaron sobre un asno» reproduce mejor el sentido de hacerlo sentar sobre el animal.
  - severity: low
    issue: Sintaxis de la propuesta de Herodes y Nicetes
    rationale: La puntuación original puede hacer que «y otras cosas por el estilo» parezca parte de la acción de ofrecer incienso. Una redacción ligeramente reorganizada mantiene el contenido y hace más clara la apelación a salvarse.
  revised_text: 'Pero cuando por fin terminó su oración, después de recordar a todos los que alguna vez se habían cruzado en su camino —pequeños y grandes, distinguidos y humildes— y a toda la Iglesia universal en el mundo entero, llegó la hora de partir. Lo sentaron sobre un asno y lo llevaron a la ciudad, pues era un gran sábado.[a]


    Herodes, el jefe de la policía, y su padre Nicetes salieron a su encuentro. Lo hicieron subir a su carruaje, se sentaron a su lado y trataron de persuadirlo. Le decían:


    —¿Qué mal hay en decir: «César es Señor», y en ofrecer incienso, y así salvarte? —además de otras cosas por el estilo.


    Al principio él no les respondió. Pero, como insistían, les dijo:


    —No voy a hacer lo que me aconsejan.


    Entonces, al no poder persuadirlo, le dirigieron amenazas y lo hicieron bajar con tanta prisa que, al descender del carruaje, se lastimó la espinilla. Sin siquiera volverse, siguió adelante con paso decidido y rápido, como si nada le hubiera sucedido, mientras lo conducían al estadio. Había allí tal tumulto que no se alcanzaba a oír la voz de nadie.'
  revised_footnotes:
  - marker: a
    text: Lit. «un gran sábado». La referencia histórica o litúrgica exacta de la expresión no es segura en la evidencia suministrada.
    reason: Conserva el calificativo de la expresión fuente sin identificarla con una festividad concreta.
  revision_rationale: La revisión elimina la interpretación añadida en «sábado solemne», mejora la correspondencia de la acción de sentar a Policarpo sobre el asno y aclara la sintaxis de la exhortación sin alterar su ambigüedad histórica o teológica. La revisión directa del griego sigue siendo deseable, pues el material de partida declara que está pendiente.
