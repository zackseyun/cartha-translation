base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: es
  text: 'Entonces el procónsul dijo:


    —Tengo aquí fieras y te arrojaré a ellas si no te arrepientes.


    Pero él respondió:


    —Hazlas venir, porque no se nos permite cambiar de lo mejor a lo peor. En cambio, es noble pasar de la maldad a la justicia.


    Entonces volvió a decirle:


    —Haré que el fuego te consuma si desprecias a las fieras y no te arrepientes.


    Pero Policarpo respondió:


    —Me amenazas con un fuego que arde por un tiempo y poco después se apaga, porque desconoces el fuego del juicio futuro y del castigo eterno, reservado para los impíos. Pero ¿por qué tardas? Ven, haz lo que quieras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repent
  choice: arrepentirse / cambiar
  rationale: En las amenazas del procónsul se conserva «arrepentirse», mientras que la respuesta de Policarpo explicita el sentido de cambio moral y direccional mediante «cambiar» y «pasar»; así se mantiene el juego conceptual del pasaje sin forzar una repetición poco natural.
- source_word: wild beasts
  choice: fieras
  rationale: Término natural y digno en español para animales destinados a ejecutar al condenado en el espectáculo público.
- source_word: untowardness
  choice: maldad
  rationale: Expresa con claridad el polo moral opuesto a la justicia sin introducir una categoría doctrinal más específica que la del testimonio suministrado.
- source_word: righteousness
  choice: justicia
  rationale: Conserva la categoría moral y teológica amplia del texto, en contraste con la maldad.
- source_word: ungodly
  choice: impíos
  rationale: Equivalente tradicional, conciso y comprensible para quienes viven sin reverencia hacia Dios.
theological_decisions:
- issue: La posibilidad y dirección del arrepentimiento
  choice: «no se nos permite cambiar de lo mejor a lo peor... pasar de la maldad a la justicia»
  alternative: «el arrepentimiento de lo mejor a lo peor no nos está permitido»
  rationale: 'La formulación elegida conserva la tensión retórica: Policarpo rechaza llamar arrepentimiento a la apostasía y afirma como noble el cambio moral hacia la justicia.'
- issue: Juicio futuro y castigo eterno
  choice: «el fuego del juicio futuro y del castigo eterno»
  alternative: «el fuego del juicio venidero y del tormento eterno»
  rationale: Se preservan de manera directa tanto el carácter futuro del juicio como la duración eterna del castigo, sin explicar su naturaleza más allá del testimonio.
- issue: Destinatarios del castigo
  choice: «reservado para los impíos»
  alternative: «preparado para quienes no temen a Dios»
  rationale: «Impíos» mantiene la amplitud teológica y la concisión del término, sin identificarlo con un grupo particular.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya para facilitar la lectura. Dado que la revisión directa del griego está pendiente, el borrador sigue de cerca el testimonio inglés de dominio público y evita añadir precisiones no sustentadas.
