base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: es
  text: 'La iglesia de Dios que reside como extranjera en Esmirna, a la iglesia de Dios que reside como extranjera en Filomelio y a todas las comunidades de hermanos y hermanas de la santa Iglesia universal que reside como extranjera en todo lugar: Que la misericordia, la paz y el amor de Dios Padre y de nuestro Señor Jesucristo se multipliquen entre ustedes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Queda pendiente la revisión directa de la tradición manuscrita griega.
    reason: La fuente proporcionada identifica expresamente el inglés como base provisional y señala que aún no se ha realizado la revisión del griego.
lexical_decisions:
- source_word: sojourneth / sojourning
  choice: reside como extranjera
  rationale: Conserva la imagen de una residencia temporal y extranjera, importante en el lenguaje cristiano antiguo, sin recurrir al arcaísmo «peregrina» como verbo.
- source_word: brotherhoods
  choice: comunidades de hermanos y hermanas
  rationale: Expresa en español actual el sentido colectivo de las fraternidades cristianas e incluye explícitamente a ambos sexos sin reducir el término a una asociación masculina.
- source_word: holy and universal Church
  choice: santa Iglesia universal
  rationale: «Universal» reproduce el sentido ordinario de katholikos en este contexto y evita que «católica» se interprete anacrónicamente como una denominación específica.
- source_word: be multiplied
  choice: se multipliquen entre ustedes
  rationale: Mantiene la fórmula epistolar intensiva y aclara de manera natural a quién alcanza la bendición.
theological_decisions:
- issue: Sentido eclesial de «universal»
  choice: Iglesia universal
  alternative: Iglesia católica
  rationale: La elección conserva la amplitud geográfica y comunitaria del término sin importar una identidad confesional posterior.
- issue: Condición de extranjería de la Iglesia
  choice: Mantener «reside como extranjera» en las tres referencias
  alternative: vive / se encuentra
  rationale: La repetición preserva el énfasis teológico y retórico del encabezamiento en la condición transitoria de las comunidades cristianas.
- issue: Origen de misericordia, paz y amor
  choice: «de Dios Padre y de nuestro Señor Jesucristo»
  alternative: «de Dios, el Padre, y de nuestro Señor Jesucristo»
  rationale: Se mantiene la coordinación del testimonio suministrado sin desarrollar ni resolver más allá del texto la relación entre ambas personas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la cadencia formal de un saludo eclesial antiguo, con construcciones comprensibles para lectores modernos. «Ustedes» evita regionalismos; «Esmirna» y «Filomelio» siguen las formas tradicionales en español.
