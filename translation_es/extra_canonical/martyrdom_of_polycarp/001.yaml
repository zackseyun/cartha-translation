review_pass:
  verdict: revise
  source_fidelity: La estructura destinataria y la triple fórmula «misericordia, paz y amor» se conservan. Sin embargo, en el último miembro el borrador hace que «la santa Iglesia universal» sea la que «reside como extranjera en todo lugar», cuando el testimonio inglés vincula esa condición inmediatamente con «todas las comunidades» destinatarias. La revisión mantiene la ambigüedad institucional sin desplazar el modificador.
  naturalness: «Reside como extranjera» es comprensible, pero resulta forzado en español actual, especialmente repetido tres veces. «Vive como extranjera» conserva la metáfora de extranjería y produce un saludo más natural y solemne. También se mejora la concordancia y claridad del último destinatario con un relativo plural.
  terminology: «Iglesia universal» es una opción prudente para holy and universal Church y no impone una identidad denominacional posterior. «Comunidades de hermanos y hermanas» sigue la expansión inclusiva ya adoptada por el puente inglés; se conserva sin afirmar que el término de la lengua fuente haya sido revisado directamente. «Dios el Padre» refleja con naturalidad la fórmula epistolar.
  issues:
  - severity: medium
    issue: Alcance sintáctico de «que reside como extranjera en todo lugar»
    rationale: Tal como está redactado, el relativo femenino singular concuerda con «Iglesia» y no con «comunidades». El testimonio proporcionado presenta a las comunidades/fraternidades como las que viven como extranjeras en cada lugar. Un relativo plural elimina ese desplazamiento.
  - severity: low
    issue: Registro poco idiomático de «reside como extranjera»
    rationale: «Vive como extranjera» comunica la condición de residencia foránea o transitoria con mayor naturalidad en español latinoamericano contemporáneo y mantiene la repetición retórica.
  - severity: low
    issue: Relación de procedencia en la bendición
    rationale: «De parte de Dios el Padre» hace explícito y natural que misericordia, paz y amor proceden de Dios el Padre y del Señor Jesucristo, sin añadir contenido teológico.
  revised_text: 'La iglesia de Dios que vive como extranjera en Esmirna, a la iglesia de Dios que vive como extranjera en Filomelio y a todas las comunidades de hermanos y hermanas de la santa Iglesia universal que viven como extranjeras en todo lugar: Que la misericordia, la paz y el amor de parte de Dios el Padre y de nuestro Señor Jesucristo se multipliquen para ustedes.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Queda pendiente la revisión directa de la tradición manuscrita griega.
    reason: La fuente proporcionada identifica expresamente el inglés como base provisional y señala que aún no se ha realizado la revisión del griego.
  revision_rationale: Se corrige el referente de la cláusula «que viven como extranjeras en todo lugar», se sustituye una expresión algo rígida por una formulación idiomática equivalente y se aclara la procedencia de la bendición. Se conserva «Iglesia universal», la forma de los nombres y la nota de provisionalidad, pues la revisión directa del griego sigue pendiente.
