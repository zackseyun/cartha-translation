base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: es
  text: 'Por tanto, benditos y nobles son todos los martirios que han sucedido conforme a la voluntad de Dios[a], pues debemos ser aún más temerosos de Dios y atribuirle autoridad sobre todas las cosas.


    ¿Quién podría dejar de admirar su nobleza, su perseverancia y su amor al Señor? Cuando los azotaron hasta desgarrarlos de tal manera que quedó al descubierto la estructura de su carne, incluso las venas y arterias interiores, ellos soportaron con paciencia, hasta el punto de que los mismos espectadores se compadecían y lloraban. Los mártires, en cambio, mostraron tal valentía que ninguno lanzó un grito ni un gemido. Así nos demostraron a todos que, en aquella hora, mientras eran torturados, los mártires de Cristo estaban ausentes de la carne[b]; o más bien, que el Señor estaba a su lado y conversaba con ellos.


    Atentos a la gracia de Cristo, despreciaron los tormentos de este mundo y, al precio de una sola hora, adquirieron la liberación del castigo eterno[c]. El fuego de sus inhumanos torturadores les resultaba frío, porque tenían ante los ojos la liberación del fuego eterno que nunca se apaga. Con los ojos del corazón contemplaban los bienes reservados para quienes perseveran: cosas que ningún oído oyó ni ojo vio, y que jamás entraron en el corazón humano, pero que el Señor les mostró a ellos, pues ya no eran seres humanos, sino que ya eran ángeles[d].


    De igual manera, los condenados a las fieras soportaron terribles suplicios. Los tendieron sobre conchas afiladas[e] y los sometieron a muchas otras clases de tormento, para que, de ser posible, el diablo lograra hacerlos renegar mediante la prolongación del castigo, pues empleó muchas artimañas contra ellos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Martirios» se refiere aquí a los sufrimientos y muertes de quienes dieron testimonio de Cristo. «Conforme a la voluntad de Dios» afirma la relación de lo sucedido con la voluntad divina; el autor añade que debemos ser «más temerosos de Dios» y atribuirle autoridad sobre todas las cosas, sin explicar de qué manera Dios actuó o lo permitió.
    reason: Conserva el comparativo del texto y evita resolver la relación causal más allá de lo que el pasaje dice.
  - marker: b
    text: Lit. «ausentes de la carne». La expresión puede describir figuradamente que los mártires parecían estar más allá de la sensación corporal; el autor enseguida la corrige o precisa con «o más bien», destacando la presencia del Señor.
    reason: Evita imponer una antropología técnica a una imagen retórica y conserva la tensión interna.
  - marker: c
    text: 'El texto emplea el lenguaje de adquirir o rescatar: «al precio de una sola hora» contrapone ese breve lapso al castigo eterno. La traducción conserva la metáfora sin definir aquí una doctrina completa sobre mérito o salvación.'
    reason: Restituye la imagen económica y no añade «sufrimiento» donde la frase no lo expresa.
  - marker: d
    text: La afirmación «ya eran ángeles» es una exaltación retórica de su estado durante el martirio; el texto no explica que su naturaleza humana se hubiera transformado literalmente.
    reason: Conserva la forma fuerte del original al tiempo que previene una lectura ontológica no exigida por el contexto.
  - marker: e
    text: El término griego parece referirse a conchas o caparazones duros y cortantes sobre los cuales tendían a los condenados; la identificación exacta del objeto no es completamente segura.
    reason: Señala una incertidumbre léxica material sin ocultarla.
lexical_decisions:
- source_word: μαρτύρια
  choice: martirios
  rationale: En este contexto designa las muertes sufridas por confesar a Cristo; «martirios» conserva el término histórico y su sentido técnico.
- source_word: θεοσεβεῖς
  choice: personas temerosas de Dios
  rationale: Expresa reverencia y devoción hacia Dios; evita seguir el inglés arcaico «scrupulous», que no refleja con precisión el término griego.
- source_word: ἐξουσίαν
  choice: autoridad
  rationale: El término señala potestad o dominio, no solo capacidad o fuerza; «autoridad sobre todas las cosas» preserva ese matiz.
- source_word: φιλοδέσποτον
  choice: amor al Señor
  rationale: El compuesto expresa afecto o devoción hacia el amo/señor. «Amor al Señor» es natural y mantiene el componente afectivo mejor que «lealtad» sola.
- source_word: ὑπομονή / ὑπομονητικόν
  choice: perseverancia / soportaron con paciencia
  rationale: Se varía la expresión según la sintaxis para comunicar constancia bajo sufrimiento sin perder el sentido central.
- source_word: ἀποδημοῦντας ἐκ τῆς σαρκός
  choice: estaban como ausentes del cuerpo
  rationale: Conserva la imagen de hallarse lejos de la existencia corporal durante el tormento, sin convertirla en una afirmación técnica sobre la separación del alma.
- source_word: ἐξαγοραζόμενοι
  choice: a cambio del sufrimiento de una sola hora, quedaban libres
  rationale: Reproduce la metáfora de obtener liberación mediante un costo, pero en español corriente evita sugerir una transacción monetaria literal.
- source_word: κήρυκας ὀξεῖς
  choice: conchas afiladas
  rationale: El sustantivo se refiere probablemente a conchas o caparazones duros y cortantes empleados como superficie de tortura; se mantiene la concreción de la imagen.
theological_decisions:
- issue: Voluntad y autoridad de Dios respecto de los martirios
  choice: «conforme a la voluntad de Dios» y «él tiene autoridad sobre todas las cosas»
  alternative: «permitidos por Dios» o «Dios causó todos estos martirios»
  rationale: El texto afirma tanto la conformidad con la voluntad divina como la soberanía de Dios, pero no especifica aquí el modo causal. La traducción conserva esa tensión sin resolverla.
- issue: Experiencia de los mártires durante la tortura
  choice: «estaban como ausentes del cuerpo; o más bien, que el Señor estaba a su lado»
  alternative: Interpretarlo como una salida literal del alma del cuerpo o solo como insensibilidad psicológica
  rationale: 'Se conserva la autocorrección retórica del autor: primero ofrece una imagen de ausencia corporal y luego enfatiza la presencia acompañante del Señor.'
- issue: Liberación del castigo eterno a cambio de una hora
  choice: Conservar explícitamente la metáfora de intercambio
  alternative: Reformularla como prueba de una salvación ya obtenida o como mérito que compra la salvación
  rationale: El pasaje usa una metáfora económica fuerte. La versión no la elimina ni la convierte en una formulación dogmática más precisa de lo que el texto afirma.
- issue: «Ya eran ángeles»
  choice: Traducción directa de la afirmación retórica
  alternative: «eran como ángeles»
  rationale: Añadir «como» suavizaría una expresión deliberadamente elevada. La nota aclara su carácter retórico sin modificar el cuerpo del texto.
- issue: Acción del diablo y posibilidad de renegar
  choice: «para que, de ser posible, el diablo lograra hacerlos renegar»
  alternative: Presentar el resultado como inevitable o negar toda posibilidad real
  rationale: La frase condicional se conserva y no se usa para resolver debates posteriores sobre apostasía o perseverancia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la intensidad física del relato, sus contrastes retóricos y sus afirmaciones teológicamente tensas. Se prefirió «ustedes/ellos» implícito y vocabulario ampliamente comprensible; «Señor» traduce el título de relación y autoridad en un registro cristiano natural. Dado que la ficha indica que la revisión directa del griego está pendiente, las decisiones se apoyan en la tradición griega conocida del pasaje y se marcan las incertidumbres relevantes, en especial la del instrumento de tortura.
