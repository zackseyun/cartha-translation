review_pass:
  verdict: revise
  source_fidelity: 'El borrador transmite fielmente la secuencia y las imágenes del testimonio inglés: el martirio con los procedentes de Filadelfia, el contraste con el gobernante injusto, la corona de inmortalidad y la triple caracterización de Cristo. Sin el texto griego efectivamente cotejado, corresponde mantener la advertencia de provisionalidad. La construcción «Todos lo recuerdan especialmente, más que a los demás» reproduce de modo algo mecánico el énfasis comparativo y puede precisarse sin cambiar el sentido.'
  naturalness: El registro es digno, moderno y apropiado para español latinoamericano neutral. «Es recordado por todos de manera más destacada que los demás» es más natural que «Todos lo recuerdan especialmente, más que a los demás». También conviene conservar «doce en total» integrado entre rayas sin espacios innecesarios alrededor de estas.
  terminology: «Bienaventurado», «martirio», «paganos», «perseverancia», «corona de la inmortalidad», «timonel» e «Iglesia universal» son opciones adecuadas. «Dios y Padre todopoderoso» conserva la coordinación del testimonio y evita convertir «Padre» en un mero modificador de «Dios».
  issues:
  - severity: low
    issue: Redundancia y orden poco natural en «Todos lo recuerdan especialmente, más que a los demás».
    rationale: La frase puede entenderse, pero «especialmente» y «más que a los demás» duplican el mismo énfasis en una disposición poco idiomática. Reordenarla conserva el comparativo enfático del testimonio inglés y mejora la fluidez.
  - severity: low
    issue: Espaciado de rayas en el inciso «—doce en total—».
    rationale: En la ortotipografía española, cuando el inciso va entre rayas unido a la oración, se escribe sin espacios interiores junto al contenido del inciso; mantener espacios exteriores depende de su inserción en la oración. Se normaliza como «—doce en total—».
  revised_text: 'Así sucedió con el bienaventurado Policarpo, quien sufrió el martirio en Esmirna junto con los de Filadelfia—doce en total—. Es recordado por todos de manera más destacada que los demás, de modo que hasta los paganos hablan de él por todas partes. Porque demostró ser no solo un maestro notable, sino también un mártir distinguido, cuyo martirio todos desean imitar, pues siguió el modelo del evangelio de Cristo.


    Por su perseverancia venció en el combate al gobernante injusto y recibió así la corona de la inmortalidad. Se alegra en compañía de los apóstoles y de todos los justos, glorifica al Dios y Padre todopoderoso, y bendice a nuestro Señor Jesucristo, Salvador de nuestras almas, timonel de nuestros cuerpos y pastor de la Iglesia universal extendida por todo el mundo.[a]'
  revised_footnotes: []
  revision_rationale: La revisión se limita a mejorar la fluidez del énfasis comparativo sobre la memoria de Policarpo y a normalizar la puntuación del inciso numérico. Se mantienen las decisiones terminológicas y las ambigüedades del testimonio. La nota de transparencia textual sigue siendo necesaria, pues el material proporcionado declara pendiente la revisión directa de la tradición griega.
