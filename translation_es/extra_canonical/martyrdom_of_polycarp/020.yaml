  witness_license: Public domain witness
  english_witness: 'So it befell the blessed Polycarp, who having with those from Philadelphia suffered martyrdom in Smyrna--twelve in all--is especially remembered more than the others by all men, so that he is talked of even by the heathen in every place: for he showed himself not only a notable teacher, but also a distinguished martyr, whose martyrdom all desire to imitate, seeing that it was after the pattern of the Gospel of Christ.


    Having by his endurance overcome the unrighteous ruler in the conflict and so received the crown of immortality, he rejoiceth in company with the Apostles and all righteous men, and glorifieth the Almighty God and Father, and blesseth our Lord Jesus Christ, the savior of our souls and helmsman of our bodies and shepherd of the universal Church which is throughout the world.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: es
  text: 'Así sucedió con el bienaventurado Policarpo, quien sufrió el martirio en Esmirna junto con los de Filadelfia —doce en total—. Todos lo recuerdan especialmente, más que a los demás, de modo que hasta los paganos hablan de él por todas partes. Porque demostró ser no solo un maestro notable, sino también un mártir distinguido. Todos desean imitar su martirio, pues siguió el modelo del evangelio de Cristo.


    Por su perseverancia venció en el combate al gobernante injusto y recibió así la corona de la inmortalidad. Se alegra en compañía de los apóstoles y de todos los justos, glorifica al Dios y Padre todopoderoso, y bendice a nuestro Señor Jesucristo, Salvador de nuestras almas, timonel de nuestros cuerpos y pastor de la Iglesia universal extendida por todo el mundo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Está pendiente la revisión directa de la tradición manuscrita griega.
    reason: El material suministrado identifica el griego como idioma antiguo, pero aclara que la revisión en la lengua fuente sigue pendiente; la nota hace transparente la base textual y evita presentar decisiones provisionales como definitivas.
lexical_decisions:
- source_word: blessed
  choice: bienaventurado
  rationale: Conserva el tono religioso y honorífico del testimonio antiguo sin reducirlo al sentido moderno de «feliz».
- source_word: suffered martyrdom
  choice: sufrió el martirio
  rationale: Expresa de manera natural la muerte sufrida por causa de la fe y mantiene la terminología histórica cristiana.
- source_word: heathen
  choice: paganos
  rationale: Es una forma actual y comprensible para referirse a quienes estaban fuera de la comunidad cristiana, sin el matiz despectivo más fuerte de otras opciones.
- source_word: endurance
  choice: perseverancia
  rationale: Comunica la constancia de Policarpo bajo la prueba; «resistencia» resultaría más física y menos idiomática aquí.
- source_word: crown of immortality
  choice: corona de la inmortalidad
  rationale: Mantiene la imagen metafórica y escatológica del testimonio.
- source_word: helmsman
  choice: timonel
  rationale: Conserva la metáfora náutica aplicada a Cristo y resulta comprensible en español contemporáneo.
- source_word: universal Church
  choice: Iglesia universal
  rationale: Traduce el sentido descriptivo de totalidad y evita reemplazarlo por una designación confesional posterior.
theological_decisions:
- issue: Relación entre el martirio de Policarpo y el evangelio de Cristo
  choice: «siguió el modelo del evangelio de Cristo»
  alternative: «fue conforme al evangelio de Cristo»
  rationale: La formulación elegida conserva la idea de patrón o ejemplo sin afirmar que el martirio sea idéntico al evangelio ni especificar más de lo que permite el testimonio.
- issue: Estado presente de Policarpo junto a los apóstoles y los justos
  choice: Se mantienen los presentes «se alegra», «glorifica» y «bendice»
  alternative: Usar tiempos pasados o introducir una fórmula explícita sobre el cielo
  rationale: El testimonio presenta estas acciones en presente; se preserva esa afirmación sin añadir una localización o doctrina más detallada.
- issue: Cristo como «timonel de nuestros cuerpos»
  choice: Se conserva literalmente la metáfora
  alternative: Interpretarla como «guía de nuestras vidas»
  rationale: La expresión es teológicamente llamativa y potencialmente ambigua; no debe resolverse ni espiritualizarse sin revisión directa del griego.
- issue: Alcance de la Iglesia
  choice: «Iglesia universal extendida por todo el mundo»
  alternative: «Iglesia católica en todo el mundo»
  rationale: «Universal» comunica el alcance del término sin importar asociaciones denominacionales modernas; «extendida» hace explícita la relación espacial del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el tono encomiástico, las imágenes de combate, corona, navegación y pastoreo, y la estructura cristológica final. Se dividieron algunas oraciones extensas para facilitar la lectura sin alterar la progresión argumental. Debido a que no se proporcionó el texto griego, el borrador depende del testimonio inglés auditado y debe cotejarse con la fuente griega antes de su publicación definitiva.
