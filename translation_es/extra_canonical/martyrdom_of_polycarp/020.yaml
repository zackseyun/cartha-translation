  revision_rationale: Se efectúan únicamente correcciones seguras de fluidez y claridad sintáctica. No se modifica el sentido, la secuencia argumental, el registro honorífico ni las expresiones teológicamente relevantes. Dado que no se suministró el texto griego, se mantiene la nota de provisionalidad y no se resuelve ninguna ambigüedad textual más allá de lo que permite el testimonio inglés auditado.
