source:
  text: 'So it befell the blessed Polycarp, who having with those from Philadelphia suffered martyrdom in Smyrna--twelve in all--is especially remembered more than the others by all men, so that he is talked of even by the heathen in every place: for he showed himself not only a notable teacher, but also a distinguished martyr, whose martyrdom all desire to imitate, seeing that it was after the pattern of the Gospel of Christ.


    Having by his endurance overcome the unrighteous ruler in the conflict and so received the crown of immortality, he rejoiceth in company with the Apostles and all righteous men, and glorifieth the Almighty God and Father, and blesseth our Lord Jesus Christ, the savior of our souls and helmsman of our bodies and shepherd of the universal Church which is throughout the world.'
