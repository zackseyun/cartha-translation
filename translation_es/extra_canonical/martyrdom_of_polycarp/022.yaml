base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: es
  text: El bienaventurado Policarpo sufrió el martirio el segundo día de la primera octava del mes de Xántico, siete días antes de las calendas de marzo, en un gran sábado, a la hora octava.[a] Fue arrestado por Herodes cuando Felipe de Trales era sumo sacerdote, durante el proconsulado de Estacio Cuadrato, pero bajo el reinado del Rey eterno, Jesucristo. A él sean la gloria, el honor, la grandeza y el trono eterno, de generación en generación. Amén.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xántico era el nombre de un mes antiguo; «la primera octava» designa un período inicial de ocho días. Las calendas eran el primer día del mes romano. La expresión «un gran sábado» y estas indicaciones cronológicas se conservan sin armonizarlas ni resolver su posible ambigüedad. La «hora octava» corresponde aproximadamente a las dos de la tarde si se cuenta desde el amanecer.
    reason: Aclara los términos calendáricos y horarios poco familiares, conserva la referencia técnica a la primera octava y no impone una reconstrucción cronológica o litúrgica.
lexical_decisions:
- source_word: blessed
  choice: bienaventurado
  rationale: Conserva el tono honorífico y religioso del testimonio antiguo en un español digno y comprensible.
- source_word: was martyred
  choice: sufrió el martirio
  rationale: Expresa con naturalidad que Policarpo murió como mártir, sin reducir el sentido a una mera ejecución.
- source_word: Xanthicus
  choice: Xántico
  rationale: Transliteración hispanizada del nombre antiguo del mes, sin sustituirlo por una equivalencia cronológica incierta.
- source_word: Kalends
  choice: calendas
  rationale: Mantiene el término técnico del calendario romano en su forma tradicional española.
- source_word: great Sabbath
  choice: un gran sábado
  rationale: Conserva literalmente la expresión antigua y su posible ambigüedad, sin identificarla de manera conjetural con una festividad concreta.
- source_word: high priest
  choice: sumo sacerdote
  rationale: Equivalente formal del título, preservando el contraste retórico entre autoridades temporales y el reinado de Cristo.
- source_word: during the reign
  choice: bajo el reinado
  rationale: Suena natural en español y mantiene la afirmación de que el marco soberano último es el reinado de Cristo.
theological_decisions:
- issue: Contraste entre el proconsulado romano y el reinado de Jesucristo
  choice: «durante el proconsulado de Estacio Cuadrato, pero bajo el reinado del Rey eterno, Jesucristo»
  alternative: «siendo procónsul Estacio Cuadrato, y reinando eternamente Jesucristo»
  rationale: Se conserva el «pero» del testimonio, que subraya el contraste teológico entre la autoridad política temporal y la soberanía eterna de Cristo.
- issue: Doxología final y referente pronominal
  choice: «A él sean la gloria, el honor, la grandeza y el trono eterno»
  alternative: «A quien sean la gloria, el honor, la majestad y el dominio eterno»
  rationale: Se mantiene el referente explícito en Jesucristo y la lista concreta del testimonio, incluido «trono», sin reemplazarla por una fórmula doxológica más familiar.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres y términos calendáricos antiguos. Este borrador es necesariamente provisional porque se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del griego.
