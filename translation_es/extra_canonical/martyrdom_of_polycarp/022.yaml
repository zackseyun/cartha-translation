review_pass:
  verdict: revise
  source_fidelity: 'El borrador refleja fielmente el testimonio inglés disponible: conserva las dataciones antiguas, los nombres propios, el contraste entre el proconsulado y el reinado de Cristo, y los elementos inusuales de la doxología. Conviene traducir de modo más literal «on the seventh day before» como «el séptimo día antes de», en vez de «siete días antes de», para no perder la formulación calendárica ordinal.'
  naturalness: El registro es digno, claro y adecuado para español latinoamericano neutral. «Sufrió el martirio», «sumo sacerdote», «proconsulado» y «a la hora octava» son naturales en un texto antiguo o eclesiástico. «Un gran sábado» conserva deliberadamente una expresión extraña y ambigua del testimonio.
  terminology: «Xántico», «calendas», «Herodes», «Felipe de Trales» y «Estacio Cuadrato» son formas españolas apropiadas. «Rey eterno, Jesucristo» conserva tanto el título como la aposición del texto base. La nota debe evitar presentar como dato fijo una conversión horaria que depende del sistema de cómputo; puede formularse condicionalmente.
  issues:
  - severity: low
    issue: «siete días antes» en lugar de «el séptimo día antes»
    rationale: El testimonio inglés dice «on the seventh day before the Kalends». La construcción ordinal reproduce con mayor exactitud la fórmula de datación antigua sin resolver cómo debe computarse.
  - severity: low
    issue: La explicación de la hora octava afirma una equivalencia demasiado definida
    rationale: La aproximación a las dos de la tarde es válida solo bajo el cómputo diurno desde el amanecer y puede variar según la estación. Una redacción condicional preserva mejor la cautela histórica.
  revised_text: El bienaventurado Policarpo sufrió el martirio el segundo día de la primera parte del mes de Xántico, el séptimo día antes de las calendas de marzo, en un gran sábado, a la hora octava.[a] Fue arrestado por Herodes cuando Felipe de Trales era sumo sacerdote, durante el proconsulado de Estacio Cuadrato, pero bajo el reinado del Rey eterno, Jesucristo. A él sean la gloria, el honor, la grandeza y el trono eterno, de generación en generación. Amén.
  revised_footnotes:
  - marker: a
    text: Xántico era el nombre de un mes antiguo; las calendas eran el primer día del mes romano. La expresión «un gran sábado» y estas indicaciones cronológicas se conservan tal como aparecen en el testimonio disponible. Si la «hora octava» se cuenta desde el amanecer, corresponde aproximadamente a las dos de la tarde.
    reason: Aclara los términos calendáricos y la referencia horaria sin armonizar la cronología ni resolver la expresión ambigua «gran sábado».
  revision_rationale: La única modificación del texto ajusta la datación al ordinal del testimonio inglés. Se conserva la ambigüedad de «un gran sábado», la datación romana y la doxología con «trono eterno», sin introducir interpretaciones doctrinales ni históricas adicionales. La revisión directa del griego sigue pendiente.
