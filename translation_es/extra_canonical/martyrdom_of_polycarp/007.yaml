base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young slaves, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: es
  text: 'Como los que lo buscaban no desistían, él se fue a otra finca. Enseguida llegaron sus perseguidores y, al no encontrarlo, apresaron a dos jóvenes esclavos. Uno de ellos confesó bajo tortura.


    Pues era imposible que permaneciera oculto, ya que quienes lo traicionaron eran de su propia casa. El jefe de la policía, que precisamente se llamaba Herodes, estaba ansioso por llevarlo al estadio, para que él cumpliera la suerte que le había sido asignada, llegando a participar con Cristo, mientras que ellos —sus traidores— recibieran el castigo del propio Judas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado. Está pendiente la revisión directa del texto griego y de sus variantes manuscritas.
    reason: La información de origen indica expresamente que aún no se ha realizado la revisión de la lengua fuente; la nota hace transparente esa limitación editorial.
lexical_decisions:
- source_word: farm (Greek review pending)
  choice: finca
  rationale: Expresa con naturalidad latinoamericana una propiedad rural sin añadir detalles no presentes en el testimonio.
- source_word: slave lads (Greek review pending)
  choice: jóvenes esclavos
  rationale: Conserva tanto la condición servil como la juventud indicada por el testimonio, sin suavizar la realidad histórica.
- source_word: captain of the police (Greek review pending)
  choice: jefe de la policía
  rationale: Es una equivalencia funcional clara y digna; evita atribuir un rango moderno demasiado específico.
- source_word: appointed lot (Greek review pending)
  choice: la suerte que le había sido asignada
  rationale: Mantiene la imagen de una porción o destino asignado, sin precisar de forma indebida quién lo asignó.
- source_word: partaker with Christ (Greek review pending)
  choice: participar con Cristo
  rationale: Preserva la formulación teológicamente abierta del testimonio, sin convertirla en una explicación doctrinal más específica.
theological_decisions:
- issue: La relación entre el martirio de Policarpo y Cristo
  choice: «llegando a participar con Cristo»
  alternative: «haciéndose copartícipe de Cristo»
  rationale: La opción elegida es más natural en español actual y conserva la idea de participación conjunta sin explicar en qué sentido preciso ocurre.
- issue: La suerte asignada a Policarpo
  choice: No identificar explícitamente al agente que la asigna
  alternative: «la suerte que Dios le había asignado»
  rationale: El testimonio suministrado no nombra aquí al agente; añadir «Dios» resolvería una ambigüedad que debe conservarse.
- issue: El castigo de Judas aplicado a los traidores
  choice: «recibieran el castigo del propio Judas»
  alternative: «sufrieran el mismo castigo que Judas»
  rationale: Conserva la expresión enfática del testimonio y su asociación tipológica, sin definir la naturaleza del castigo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean oraciones claras y vocabulario accesible, manteniendo el tono narrativo solemne. «Herodes» sigue la forma española tradicional del nombre. Se conserva el contraste entre Policarpo, que participa con Cristo, y los miembros de su casa que lo traicionan y quedan asociados con Judas.
