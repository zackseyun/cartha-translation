review_pass:
  verdict: revise
  source_fidelity: 'La revisión se basa necesariamente en el testimonio inglés suministrado, pues la revisión directa del griego está indicada como pendiente. El borrador conserva en general la cadena de referentes, la retórica cósmica y las señales textuales de corchetes y laguna. Sin embargo, «A él los envió» invierte el complemento de la cláusula enfática «Him he sent unto them»: el enviado es singular («él») y el destinatario es plural («ellos»). También falta el verbo que exige el paralelismo «no... enviando..., sino enviando...».'
  naturalness: El registro es mayormente natural y digno para español latinoamericano. Se mejora la sintaxis de la gran oración central y se emplean «plantó» y «abundan» para reflejar con mayor cercanía las imágenes y el énfasis del testimonio, sin volver el español arcaizante. «Con amor, no para juzgar» expresa idiomáticamente el contraste sin negar el juicio futuro anunciado enseguida.
  terminology: «Hacedor y Creador», «misterios», «Salvador», «mansedumbre» y «juicio» son elecciones adecuadas y no imponen una lectura confesional. Se mantienen «como Dios» y «como [hombre]» por conservar la formulación cristológica y la restauración entre corchetes del testimonio.
  issues:
  - severity: high
    issue: Inversión del enviado y de los destinatarios en «A él los envió».
    rationale: La fuente dice que Dios envió «a él» «a ellos». «Los envió» hace que los destinatarios plurales sean quienes fueron enviados y contradice la sintaxis y el sentido del pasaje.
  - severity: medium
    issue: 'Construcción incompleta: «No lo hizo... enviando..., sino al propio Hacedor».'
    rationale: Después de «sino» se requiere recuperar «enviando» para mantener la oposición entre los mensajeros descartados y el Hacedor enviado.
  - severity: low
    issue: «Estableció» y «surgen» atenúan imágenes léxicas del testimonio.
    rationale: «Plantó» corresponde mejor a «planted», y «abundan» conserva el valor de «abound» sin añadir una especificación sobre nuevos creyentes.
  revised_text: 'Porque no fue ningún descubrimiento terrenal, como ya dije, lo que se les confió. Tampoco se preocupan por custodiar con tanto cuidado una invención mortal, ni se les ha confiado la administración de misterios humanos.


    Pero el mismo Dios invisible, Creador todopoderoso del universo, plantó desde el cielo entre los seres humanos la verdad y la enseñanza santa que supera el entendimiento humano, y las fijó firmemente en sus corazones. No lo hizo, como alguien podría imaginar, enviando a la humanidad a un subordinado, a un ángel, a un gobernante, a uno de los que dirigen los asuntos de la tierra o a uno de aquellos a quienes se ha confiado la administración en el cielo, sino enviando al propio Hacedor y Creador del universo. Por medio de él hizo los cielos; por medio de él encerró el mar dentro de sus límites; todos los elementos observan fielmente sus misterios; de él recibió [el sol] incluso la medida de los recorridos del día que debe guardar; la luna lo obedece cuando le ordena brillar de noche; las estrellas lo obedecen mientras siguen el curso de la luna. Por medio de él todas las cosas son ordenadas, delimitadas y sometidas: los cielos y lo que hay en ellos, la tierra y lo que hay en ella, el mar
    y lo que hay en él, el fuego, el aire, el abismo, lo que está en las alturas, lo que está en las profundidades y lo que está entre ambos. A él lo envió a ellos.


    ¿Acaso fue enviado, como alguien podría suponer, para establecer un dominio e infundir miedo y terror?


    De ningún modo. Lo envió con bondad [y] mansedumbre, como un rey enviaría a su hijo, que también es rey. Lo envió como Dios; lo envió como [hombre] a los seres humanos; lo envió como Salvador, valiéndose de la persuasión y no de la fuerza, pues la fuerza no es propia de Dios.


    Lo envió para llamar, no para perseguir; lo envió con amor, no para juzgar.


    Porque lo enviará para juzgar, y ¿quién soportará su presencia?


    …[¿No ves] que los arrojan a las fieras para que nieguen al Señor y que, aun así, no son vencidos?


    ¿No ves que cuantos más son castigados, tantos más abundan?


    Estas no parecen obras humanas; son el poder de Dios, pruebas de su presencia.'
  revised_footnotes: []
  revision_rationale: Se corrige una inversión sintáctica y semántica importante en la identificación del enviado y los destinatarios, y se restaura el verbo elidido necesario tras «sino». Las demás revisiones son estilísticas y léxicas, orientadas a una equivalencia más estrecha con el testimonio inglés. Se preservan sin nota añadida los corchetes y la elipsis, ya que son señales textuales heredadas del testimonio y no deben presentarse como certezas reconstruidas mientras falte la revisión directa del griego.
