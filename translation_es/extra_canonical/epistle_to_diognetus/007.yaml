base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: es
  text: 'Porque no fue ningún descubrimiento terrenal, como ya dije, lo que se les confió. Tampoco se preocupan por custodiar con tanto cuidado una invención mortal, ni se les ha confiado la administración de misterios humanos.


    Más bien, el mismo Dios invisible, Creador todopoderoso del universo, estableció desde el cielo entre los seres humanos la verdad y la enseñanza santa que supera el entendimiento humano, y las fijó firmemente en sus corazones. No lo hizo, como alguien podría imaginar, enviando a la humanidad a un subordinado, a un ángel, a un gobernante, a uno de los que dirigen los asuntos de la tierra o a uno de aquellos a quienes se ha confiado la administración en el cielo, sino al propio Hacedor y Creador del universo. Por medio de él hizo los cielos; por medio de él encerró el mar dentro de sus límites; todos los elementos observan fielmente sus misterios; de él recibió [el sol] incluso la medida de los recorridos del día que debe guardar; la luna lo obedece cuando le ordena brillar de noche; las estrellas lo obedecen mientras siguen el curso de la luna. Por medio de él todas las cosas son ordenadas, delimitadas y sometidas: los cielos y lo que hay en ellos, la tierra y lo que hay en ella, el mar
    y lo que hay en él, el fuego, el aire, el abismo, lo que está en las alturas, lo que está en las profundidades y lo que está entre ambos. A él los envió.


    ¿Acaso fue enviado, como alguien podría suponer, para establecer un dominio e infundir miedo y terror?


    De ningún modo. Lo envió con bondad [y] mansedumbre, como un rey enviaría a su hijo, que también es rey. Lo envió como Dios; lo envió como [hombre] a los seres humanos; lo envió como Salvador, valiéndose de la persuasión y no de la fuerza, pues la fuerza no es propia de Dios.


    Lo envió para llamar, no para perseguir; lo envió amando, no juzgando.


    Porque lo enviará para juzgar, y ¿quién soportará su presencia?


    …[¿No ves] que los arrojan a las fieras para que nieguen al Señor y que, aun así, no son vencidos?


    ¿No ves que cuantos más son castigados, tantos más surgen?


    Estas no parecen obras humanas; son el poder de Dios, pruebas de su presencia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earthly discovery
  choice: descubrimiento terrenal
  rationale: Conserva el contraste entre procedencia terrenal y revelación divina sin ampliar el sentido a una filosofía o doctrina específica.
- source_word: dispensation / administration
  choice: administración
  rationale: Expresa una responsabilidad confiada o una gestión, evitando el tecnicismo denominacional «dispensación».
- source_word: Artificer and Creator
  choice: Hacedor y Creador
  rationale: Mantiene la doble designación del testimonio y distingue el matiz de artífice del de creador.
- source_word: mysteries
  choice: misterios
  rationale: Preserva la formulación antigua y su amplitud semántica, sin reducirla a leyes naturales ni a ritos secretos.
- source_word: summoning
  choice: llamar
  rationale: Comunica invitación o convocatoria con naturalidad y mantiene el contraste con perseguir.
- source_word: abound
  choice: surgen
  rationale: En este contexto expresa el aumento de nuevos creyentes sin introducir una metáfora biológica demasiado marcada.
theological_decisions:
- issue: Identidad y envío del Hacedor y Creador
  choice: Se conservaron diferenciados «Dios… lo envió» y «por medio de él», manteniendo a la vez la afirmación «Lo envió como Dios».
  alternative: Explicitar al Padre como remitente y al Hijo como enviado.
  rationale: El pasaje implica esa relación, pero el testimonio suministrado no emplea aquí esos títulos; explicitarlos resolvería más de lo que dice el texto.
- issue: «as sending God»
  choice: «Lo envió como Dios».
  alternative: «Lo envió, siendo Dios» o «envió a Dios».
  rationale: La opción escogida preserva la formulación tensa y potencialmente ambigua del testimonio sin debilitar ni sistematizar su afirmación cristológica.
- issue: «as loving, not as judging»
  choice: «lo envió amando, no juzgando».
  alternative: «lo envió por amor, no para juzgar».
  rationale: Mantiene el paralelismo verbal y evita convertir la frase en una negación absoluta de todo juicio, dado que la oración siguiente anuncia un envío para juzgar.
- issue: Juicio futuro
  choice: «lo enviará para juzgar».
  alternative: «lo enviará en juicio».
  rationale: Es español natural y conserva claramente el contraste entre la misión presente descrita y el juicio futuro.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y la elipsis como señales de restauración o laguna textual. La traducción es provisional porque el material proporcionado declara pendiente la revisión directa del griego; por ello no se presentan reconstrucciones griegas como seguras ni se eliminan ambigüedades pronominales y cristológicas del testimonio.
