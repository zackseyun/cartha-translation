base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: es
  text: 'Muy estimado Diógneto: veo el gran empeño que tienes en conocer la religión de los cristianos y la claridad y el cuidado con que preguntas acerca de ellos: en qué Dios han puesto su confianza y cómo lo adoran; cómo todos ellos menosprecian el mundo y desprecian la muerte; cómo no toman en cuenta a los que los griegos consideran dioses ni observan la superstición de los judíos; qué clase de afecto se tienen unos a otros; y por qué esta nueva clase de gente o modo de vida[a] apareció ahora en la vida humana y no antes. Recibo con gusto este interés tuyo y le pido a Dios, quien nos concede tanto el hablar como el oír, que me permita hablar de tal manera que tú llegues a ser mejor al escuchar, y que a ti te permita escuchar de tal manera que yo, el que habla, no quede defraudado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «esta nueva clase de gente o práctica». La expresión griega reúne una identidad colectiva y una manera de vivir.'
    reason: Preservar la ambigüedad semántica de γένος ἢ ἐπιτήδευμα, que el testimonio inglés vierte de manera menos precisa como «new development or interest».
lexical_decisions:
- source_word: θεοσέβεια
  choice: religión
  rationale: En este contexto introductorio designa la devoción o práctica religiosa de los cristianos en conjunto; «religión» es natural y conserva la amplitud del término.
- source_word: θρησκεύοντες
  choice: adoran
  rationale: Expresa el ejercicio del culto religioso. «Adoran» resulta claro en español actual sin especificar ritos que el texto no detalla.
- source_word: καταφρονοῦσι
  choice: menosprecian / desprecian
  rationale: 'Se conserva la fuerza retórica del verbo con dos equivalentes naturales según sus objetos: el mundo y la muerte.'
- source_word: φιλοστοργία
  choice: afecto
  rationale: El término evoca un cariño estrecho, incluso familiar. «Afecto» conserva ese sentido sin añadir una caracterización doctrinal.
- source_word: γένος ἢ ἐπιτήδευμα
  choice: pueblo o modo de vida
  rationale: La expresión contrapone o coordina una identidad colectiva y una práctica o forma de conducta. La traducción mantiene ambas posibilidades en vez de reducirlas a una sola.
theological_decisions:
- issue: Designación del Dios en quien confían los cristianos
  choice: en qué Dios han puesto su confianza
  alternative: en cuál dios confían
  rationale: La formulación mantiene abierta la pregunta del autor y evita introducir aquí una identificación teológica que el capítulo todavía no desarrolla.
- issue: Valoración polémica de las prácticas judías
  choice: la superstición de los judíos
  alternative: las prácticas religiosas de los judíos
  rationale: Se conserva la expresión crítica del autor antiguo, sin suavizarla ni ampliarla. Se presenta como la valoración histórica de la epístola, no como una afirmación editorial.
- issue: Efecto esperado en Diógneto
  choice: llegues a ser mejor al escuchar
  alternative: seas edificado al oír
  rationale: «Mejor» conserva la amplitud moral del texto y evita imponer el matiz eclesiástico más específico de «edificado».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tratamiento singular cercano («tú»), apropiado para una carta dirigida personalmente a Diógneto, y la estructura acumulativa de sus preguntas, pero con puntuación moderna para facilitar la lectura. El borrador se apoya en el testimonio inglés suministrado y en la evidencia léxica griega indicada; conviene cotejarlo con una edición crítica del texto griego antes de la publicación definitiva.
