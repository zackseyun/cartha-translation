  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: es
  text: 'Después de haber dispuesto de antemano todas las cosas en su mente junto con su Hijo, Dios permitió que, durante el tiempo anterior, nos dejáramos arrastrar a nuestro antojo por impulsos desordenados, extraviados por placeres y malos deseos. No lo hizo porque se complaciera en nuestros pecados, sino porque nos soportaba; no porque aprobara aquel tiempo de injusticia, sino porque estaba preparando el tiempo presente de justicia. Así, después de que nuestras propias obras demostraran que éramos indignos de la vida, ahora llegaríamos a ser dignos por la bondad de Dios; y, una vez puesta de manifiesto nuestra incapacidad para entrar por nosotros mismos en el reino de Dios, seríamos capacitados por el poder de Dios.


    Cuando nuestra injusticia llegó a su colmo y quedó completamente claro que su paga sería el castigo y la muerte, llegó el tiempo que Dios había establecido para manifestar desde entonces su bondad y su poder. ¡Qué inmensa bondad y amor de Dios! No nos odió ni nos rechazó ni guardó rencor contra nosotros, sino que fue paciente y tolerante. Compadecido de nosotros, él mismo cargó con nuestros pecados y entregó a su propio Hijo como rescate por nosotros: el Santo por los que quebrantan la ley, el inocente por los malvados, el justo por los injustos, el incorruptible por los corruptibles, el inmortal por los mortales.


    Pues ¿qué otra cosa, sino su justicia, habría podido cubrir nuestros pecados?


    ¿En quién habría sido posible que nosotros, transgresores e impíos, fuéramos justificados, sino únicamente en el Hijo de Dios?


    ¡Oh dulce intercambio! ¡Oh obra inescrutable[a]! ¡Oh beneficios inesperados! La injusticia de muchos quedó oculta en un solo Justo, y la justicia de uno justificó a muchos injustos.


    Así pues, después de haber demostrado en el tiempo anterior que nuestra naturaleza era incapaz de alcanzar la vida, y de haber revelado ahora a un Salvador capaz de salvar incluso a quienes nada pueden, Dios quiso que por ambas razones creyéramos en su bondad y lo reconociéramos como quien nos alimenta, Padre, maestro, consejero, médico, mente, luz, honor, gloria, fuerza y vida.


    [a] También puede traducirse «creación inescrutable». El término del testimonio consultado admite aquí la idea de una obra realizada o concebida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: También puede traducirse «creación inescrutable». El término del testimonio consultado admite aquí la idea de una obra realizada o concebida.
    reason: La lectura «creation» del testimonio inglés es poco natural en español y puede referirse a una obra o disposición; la nota preserva la alternativa literal mientras siga pendiente la revisión directa del griego.
lexical_decisions:
- source_word: disorderly impulses
  choice: impulsos desordenados
  rationale: Conserva el carácter moralmente desordenado de los impulsos sin añadir una categoría doctrinal más específica.
- source_word: lusts
  choice: malos deseos
  rationale: En español latinoamericano actual comunica deseos moralmente desviados con mayor naturalidad que «concupiscencias», sin limitar el sentido exclusivamente a lo sexual.
- source_word: ransom
  choice: rescate
  rationale: Mantiene la metáfora de liberación mediante un precio, sin desarrollar una teoría particular de la expiación.
- source_word: lawless
  choice: los que quebrantan la ley / transgresores
  rationale: Expresa la oposición a la ley en lenguaje corriente y permite variación natural según el contexto.
- source_word: guileless
  choice: inocente
  rationale: Comunica ausencia de maldad o engaño de manera clara; «sin engaño» sería más literal, pero menos paralelo con los demás títulos.
- source_word: inscrutable creation
  choice: obra inescrutable
  rationale: «Obra» resulta natural en la exclamación y conserva la idea de algo realizado o dispuesto; una nota mantiene la alternativa literal «creación».
- source_word: nurse
  choice: quien nos alimenta
  rationale: Retiene la imagen de cuidado y sustento evitando «nodriza», que en este contexto sonaría arcaico o innecesariamente marcado por género.
- source_word: mind
  choice: mente
  rationale: Se conserva la imagen abrupta y conceptualmente abierta del testimonio, sin explicarla como «sabiduría» o «razón».
theological_decisions:
- issue: La relación entre la bondad divina y que los seres humanos lleguen a ser dignos
  choice: «llegaríamos a ser dignos por la bondad de Dios»
  alternative: «seríamos considerados dignos por la bondad de Dios»
  rationale: La formulación preserva la tensión entre transformación y reconocimiento, en vez de resolverla mediante una lectura exclusivamente declarativa.
- issue: Dios carga con los pecados y entrega a su Hijo
  choice: Se conserva la secuencia y el sujeto divino del testimonio
  alternative: Explicitar que Cristo cargó con los pecados
  rationale: El pasaje presenta una formulación teológicamente tensa. No se cambia silenciosamente el referente para armonizarlo con una formulación doctrinal posterior.
- issue: Justificación de transgresores e impíos
  choice: «fuéramos justificados» y «justificó»
  alternative: «fuéramos declarados justos» / «hizo justos»
  rationale: «Justificar» mantiene abierta la amplitud semántica y evita decidir entre una interpretación exclusivamente forense o transformadora.
- issue: El intercambio entre uno y muchos
  choice: «La injusticia de muchos quedó oculta en un solo Justo, y la justicia de uno justificó a muchos injustos»
  alternative: Explicar la imputación o transferencia en términos sistemáticos
  rationale: Se preservan las imágenes de cubrir, ocultar y justificar sin importar una teoría denominacional específica.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se evitaron arcaísmos como «concupiscencias» y «nodriza», pero se conservaron la cadencia retórica, las exclamaciones y los paralelismos. Borrador necesariamente provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa del griego está pendiente y el Codex Argentoratensis se perdió y solo se conoce por copias.'
