  register: Español latinoamericano neutral, actual y digno. Se conservan la argumentación polémica, la primera persona del autor y el paralelismo retórico. Dado que no se suministró el texto griego y la revisión directa de la lengua antigua está pendiente, este borrador se basa de manera provisional en el testimonio inglés de dominio público, consultando la versión inglesa POB solo como capa de control.
