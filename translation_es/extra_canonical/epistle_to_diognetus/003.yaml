source:
  text: 'In the next place, I fancy that thou art chiefly anxious to hear about their not practicing their religion in the same way as the Jews.


    The Jews then, so far as they abstain from the mode of worship described above, do well in claiming to reverence one God of the universe and to regard Him as Master; but so far as they offer Him this worship in methods similar to those already mentioned, they are altogether at fault.


    For whereas the Greeks, by offering these things to senseless and deaf images, make an exhibition of stupidity, the Jews considering that they are presenting them to God, as if He were in need of them, ought in all reason to count it folly and not religious worship.


    For He that made the heaven and the earth and all things that are therein, and furnisheth us all with what we need, cannot Himself need any of these things which He Himself supplieth to them that imagine they are giving them to Him.


    But those who think to perform sacrifices to Him with blood and fat and whole burnt offerings, and to honor Him with such honors, seem to me in no way different from those who show the same respect towards deaf images; for the one class think fit to make offerings to things unable to participate in the honor, the other class to One Who is in need of nothing.'
