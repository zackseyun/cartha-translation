base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: es
  text: 'A continuación, creo que deseas especialmente saber por qué no practican su religión de la misma manera que los judíos.


    Los judíos, por una parte, hacen bien al apartarse de la forma de culto descrita anteriormente y al afirmar que veneran al único Dios del universo y lo reconocen como Señor. Pero, por otra parte, se equivocan por completo cuando le rinden culto mediante prácticas semejantes a las ya mencionadas.


    Los griegos ponen de manifiesto su insensatez al ofrecer estas cosas a imágenes insensibles y sordas. Los judíos, en cambio, creen presentárselas a Dios como si él las necesitara; con toda razón deberían considerar esto una insensatez y no un acto de culto.


    Porque quien hizo el cielo, la tierra y todo lo que hay en ellos, y nos proporciona a todos cuanto necesitamos, no puede necesitar ninguna de las cosas que él mismo da a quienes se imaginan que se las están dando.


    Los que piensan ofrecerle sacrificios de sangre, grasa y ofrendas quemadas por completo, y honrarlo de ese modo, no me parecen en nada diferentes de quienes muestran la misma veneración por imágenes sordas. Unos consideran apropiado hacer ofrendas a seres incapaces de recibir tal honor; los otros, a quien no necesita nada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: practicing their religion / religious worship
  choice: practican su religión / acto de culto
  rationale: Se distingue entre la práctica religiosa en sentido general y el acto concreto de adoración, con lenguaje natural y digno.
- source_word: one God of the universe
  choice: único Dios del universo
  rationale: Conserva tanto la afirmación de unicidad como el alcance universal de la expresión.
- source_word: Master
  choice: Señor
  rationale: Es la equivalencia religiosa más natural en español y evita el matiz moderno predominantemente laboral de «amo».
- source_word: senseless and deaf images
  choice: imágenes insensibles y sordas
  rationale: «Insensibles» expresa la carencia de percepción o sensación; «sordas» conserva la imagen retórica del testimonio.
- source_word: blood and fat and whole burnt offerings
  choice: sangre, grasa y ofrendas quemadas por completo
  rationale: Mantiene los tres elementos sacrificiales y expresa de manera transparente el sentido de las ofrendas consumidas enteramente por el fuego.
- source_word: unable to participate in the honor
  choice: incapaces de recibir tal honor
  rationale: Comunica en español corriente que las imágenes no pueden ser partícipes ni receptoras reales del honor ofrecido.
theological_decisions:
- issue: Crítica del autor al culto sacrificial judío
  choice: Conservar la crítica categórica como argumento propio del autor antiguo
  alternative: Suavizarla o armonizarla con una teología posterior del sacrificio
  rationale: La traducción debe preservar la tensión histórica y teológica del pasaje sin introducir una defensa ni una condena confesional adicional.
- issue: Autosuficiencia divina
  choice: «quien no necesita nada»
  alternative: «el Dios impasible» u otra formulación doctrinal técnica
  rationale: La formulación sigue el argumento explícito del texto acerca de que Dios no tiene necesidad, sin importar categorías teológicas ajenas al pasaje.
- issue: Paralelo entre ofrendas a imágenes y ofrendas a Dios
  choice: Mantener la comparación y su distinción interna
  alternative: Presentar ambos cultos como idénticos en todos los sentidos
  rationale: El autor los compara por la impropiedad de las ofrendas, pero distingue entre imágenes incapaces de recibir honor y Dios, que nada necesita.
