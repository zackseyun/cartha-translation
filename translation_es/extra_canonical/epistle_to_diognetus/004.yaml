review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue fielmente el testimonio inglés disponible y conserva la secuencia argumentativa y las preguntas retóricas. Sin embargo, la negación marcada entre corchetes en el testimonio («do [not] suppose») debe reflejarse de manera visible y en una posición sintácticamente equivalente: «Creo que [no] necesitas...», no «No creo que necesites...». Dado que la revisión directa del griego sigue pendiente, no es seguro resolver la variante en el texto sin corchetes.'
  naturalness: 'El español es en general natural, actual y de registro digno. Se recomiendan ajustes menores para una formulación más idiomática y precisa: «fingimiento respecto de sus ayunos y novilunios», «mentir contra Dios», «escrupulosidad excesiva» y «hacer de unos fiestas».'
  terminology: «Alimentos», «sábado», «circuncisión», «elección», «disposiciones de Dios» y «piedad» son elecciones adecuadas. «Novilunios» es más exacto y convencional que «lunas nuevas» en este registro religioso-antiguo. «Religión propia de los cristianos» preserva correctamente el referente de «their own religion».
  issues:
  - severity: medium
    issue: La variante textual [not] no se conserva de forma transparente en el texto principal.
    rationale: El borrador traduce «No creo que necesites», mientras que el testimonio conserva la negación como restauración entre corchetes. «Creo que [no] necesitas» permite al lector ver tanto la incertidumbre como el alcance de la variante, sin resolverla indebidamente.
  - severity: low
    issue: «Apariencia engañosa de sus ayunos y lunas nuevas» resulta algo perifrástico.
    rationale: «Dissimulation» se expresa con mayor precisión y fluidez como «fingimiento respecto de sus ayunos y novilunios»; no atenúa la acusación polémica del autor.
  - severity: low
    issue: Algunas expresiones pueden aproximarse más al registro y sentido del testimonio.
    rationale: «Mentir contra Dios» conserva la construcción acusatoria; «escrupulosidad excesiva» comunica mejor «excessive fussiness» que «minuciosidad»; y «hacer de unos fiestas» refleja la clasificación de tiempos en celebraciones o duelo.
  revised_text: 'Por otra parte, creo que [no] necesitas que yo te explique que sus escrúpulos respecto a los alimentos, su superstición acerca del sábado, la vanidad de su circuncisión y el fingimiento respecto de sus ayunos y novilunios son cosas ridículas e indignas de toda consideración.[a]


    Pues, de las cosas creadas por Dios para uso del ser humano, aceptar unas como bien creadas, pero rechazar otras como inútiles y superfluas, ¿no es impío?


    Y también, mentir contra Dios, como si él prohibiera hacer cualquier obra buena en sábado, ¿no es irreverente?


    Asimismo, jactarse de la mutilación de la carne como señal de elección, como si por eso fueran especialmente amados por Dios, ¿no es ridículo?


    Y observar los astros y la luna, guardar la observancia de meses y días, y distinguir las disposiciones de Dios y los cambios de las estaciones conforme a sus propios impulsos, haciendo de unos fiestas y de otros tiempos de duelo, ¿quién consideraría esto una demostración de piedad y no, más bien, de insensatez?


    Considero, pues, que ya has sido instruido suficientemente acerca de cuánta razón tienen los cristianos al mantenerse alejados de la necedad y el error comunes de los judíos, así como de su escrupulosidad excesiva y orgullo.[b] Pero, en cuanto al misterio de la religión propia de los cristianos, no esperes poder ser instruido por un ser humano.'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés conservado marca «[no]» como una restauración textual en esta oración. La revisión directa del griego sigue pendiente.
    reason: Conservar de forma explícita la incertidumbre textual transmitida por la fuente de trabajo, sin decidir la variante antes de revisar el griego.
  - marker: b
    text: Este párrafo refleja la retórica polémica de un autor cristiano antiguo contra ciertas prácticas e interpretaciones judías; no constituye una descripción neutral de todas las corrientes del judaísmo.
    reason: Dar contexto histórico a una generalización hostil sin alterar ni ocultar el contenido del documento.
  revision_rationale: La revisión conserva la crítica histórica directa del escrito y su léxico teológico, pero corrige el tratamiento de la variante textual señalada por corchetes y pule varias expresiones para el español latinoamericano neutral. No se introducen interpretaciones doctrinales ni se resuelve una lectura disputada sin acceso aún a la fuente griega.
