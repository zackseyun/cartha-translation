base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: es
  text: 'Por otra parte, no creo que necesites que yo te explique que sus escrúpulos respecto a los alimentos, su superstición acerca del sábado, la vanidad de su circuncisión y la apariencia engañosa de sus ayunos y lunas nuevas son prácticas ridículas e indignas de consideración.[a]


    Pues, de las cosas creadas por Dios para uso del ser humano, aceptar unas como bien creadas pero rechazar otras como inútiles y superfluas, ¿no es impío?


    Y también, hablar falsamente contra Dios, como si él prohibiera hacer cualquier obra buena en sábado, ¿no es irreverente?


    Asimismo, jactarse de la mutilación de la carne como señal de elección, como si por eso fueran especialmente amados por Dios, ¿no es ridículo?


    Y observar los astros y la luna, guardar meses y días, y clasificar las disposiciones de Dios y los cambios de las estaciones conforme a sus propios impulsos, convirtiendo unos en fiestas y otros en tiempos de duelo, ¿quién consideraría esto una demostración de piedad y no, más bien, de insensatez?


    Considero, pues, que ya has sido instruido suficientemente acerca de cuánta razón tienen los cristianos al mantenerse alejados de la necedad y el error comunes de los judíos, así como de su excesiva minuciosidad y orgullo.[b] Pero, en cuanto al misterio de la religión propia de los cristianos, no esperes poder ser instruido por un ser humano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés conservado incluye una restauración textual equivalente a «no» en la expresión «no creo». La revisión directa del griego sigue pendiente.
    reason: Señalar una incertidumbre textual transmitida por la fuente de trabajo sin recargar el texto principal con corchetes poco naturales.
  - marker: b
    text: Este párrafo refleja la retórica polémica de un autor cristiano antiguo contra ciertas prácticas e interpretaciones judías; no constituye una descripción neutral de todas las corrientes del judaísmo.
    reason: Dar contexto histórico a una generalización hostil sin alterar ni ocultar el contenido del documento.
lexical_decisions:
- source_word: meats
  choice: alimentos
  rationale: En este contexto se refiere a distinciones alimentarias en general, no exclusivamente a carnes.
- source_word: dissimulation
  choice: apariencia engañosa
  rationale: Conserva la acusación de falta de autenticidad sin reducirla simplemente a «pretensión» ni modernizarla en exceso.
- source_word: profane
  choice: irreverente
  rationale: Expresa una conducta ofensiva contra lo sagrado en español natural; «profano» sería menos idiomático como predicado aquí.
- source_word: token of election
  choice: señal de elección
  rationale: Mantiene el lenguaje teológico de elección sin precisar indebidamente su alcance.
- source_word: arrangements of God
  choice: disposiciones de Dios
  rationale: Preserva la idea de un orden establecido por Dios sin identificarla únicamente con leyes o mandamientos.
- source_word: religion
  choice: religión
  rationale: Refleja el sentido amplio de la práctica o devoción cristiana en el testimonio disponible.
theological_decisions:
- issue: Valoración polémica de prácticas judías
  choice: Conservar la crítica histórica directa del autor, con una nota contextual
  alternative: Suavizar o generalizar las referencias a los judíos
  rationale: La fidelidad exige mantener la postura del escrito antiguo, mientras la nota evita presentar su retórica polémica como una descripción neutral de todo el judaísmo.
- issue: Prohibición sabática de hacer el bien
  choice: «como si él prohibiera hacer cualquier obra buena»
  alternative: «como si prohibiera toda acción en sábado»
  rationale: Mantiene la formulación específica y polémica del testimonio sin ampliar la acusación.
- issue: Elección y amor divino
  choice: «como si por eso fueran especialmente amados por Dios»
  alternative: «como si la circuncisión garantizara la salvación»
  rationale: No importa una doctrina de salvación que el pasaje no formula.
- issue: Fuente de la instrucción sobre el misterio cristiano
  choice: «no esperes poder ser instruido por un ser humano»
  alternative: «ningún ser humano puede enseñártelo»
  rationale: La primera conserva la exhortación y cierta apertura retórica, sin convertirla en una afirmación sistemática absoluta.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea tuteo singular porque el escrito se dirige personalmente a Diogneto. Se mantienen las preguntas retóricas y la fuerza polémica del original disponible, pero con sintaxis natural. Borrador necesariamente provisional: el material suministrado es un testimonio inglés de dominio público y la revisión directa del griego está pendiente.'
