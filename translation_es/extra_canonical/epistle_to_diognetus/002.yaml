lexical_decisions:
- source_word: prepossessions
  choice: prejuicios
  rationale: Expresa ideas previas que condicionan el juicio; es natural y comprensible en español actual.
- source_word: intellect
  choice: entendimiento
  rationale: Conserva el contraste entre la percepción visual y la reflexión racional sin usar un tecnicismo.
- source_word: substance
  choice: materia
  rationale: En el contexto de ídolos hechos de piedra, metal, madera y barro, se refiere al material del que están hechos.
- source_word: earthenware
  choice: barro
  rationale: Designa de manera natural tanto el material como el objeto modelado por el alfarero.
- source_word: forged by iron and fire
  choice: trabajados con herramientas de hierro y con fuego
  rationale: Evita sugerir que todos los materiales fueron literalmente forjados; conserva los medios de fabricación indicados por el testimonio.
- source_word: soul-less, senseless, motionless
  choice: sin alma, sin sensibilidad e inmóviles
  rationale: Mantiene la enumeración antropológica y física del texto sin fusionar sus elementos.
- source_word: victims
  choice: víctimas sacrificadas
  rationale: Aclara el sentido cultual de animales ofrecidos en sacrificio.
- source_word: slaves
  choice: sirven como esclavos
  rationale: Retiene la fuerza polémica de la esclavitud en vez de reducirla a servicio religioso genérico.
theological_decisions:
- issue: Estatus de los objetos llamados dioses
  choice: «esos a quienes ustedes llaman y consideran dioses» y luego «estas cosas»
  alternative: Llamarlos simplemente «dioses» sin calificación
  rationale: 'Preserva la perspectiva polémica del autor: se informa cómo los destinatarios los consideran, sin conceder que sean verdaderamente divinos.'
- issue: Lenguaje sacrificial
  choice: «intentar aplacarlas con la sangre y la grasa de las víctimas sacrificadas»
  alternative: «propiciarlas»
  rationale: «Aplacar» comunica el acto cultual en lenguaje corriente sin introducir una formulación doctrinal más específica que el testimonio.
- issue: Frase final sobre la sensibilidad de la piedra
  choice: Conservar literalmente la conclusión paradójica en el texto y explicarla en nota
  alternative: Enmendarla a «demuestran que carece de sensibilidad»
  rationale: El testimonio suministrado dice que así se prueba o condena su sensibilidad, aunque contradice aparentemente la oración anterior. Como la revisión griega está pendiente, no se resuelve silenciosamente la tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «tú» al dirigirse inicialmente a Diogneto y «ustedes» en los pasajes donde la exhortación se amplía al grupo que venera los ídolos. La traducción es provisional porque el material proporcionado es un testimonio inglés de dominio público y la revisión directa del griego está pendiente.
