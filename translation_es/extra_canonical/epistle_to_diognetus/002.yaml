base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are slaves; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: es
  text: 'Así pues, libera tu mente de todos los prejuicios que la ocupan, abandona la costumbre que te extravía y hazte, por así decirlo, una persona nueva desde el principio, dispuesta a escuchar un relato nuevo, tal como tú mismo reconociste. Mira no solo con los ojos, sino también con el entendimiento, de qué materia y qué forma son esos a quienes ustedes llaman y consideran dioses.


    ¿No es uno de piedra, como la que pisamos; otro de bronce, en nada superior a los utensilios fabricados para nuestro uso; otro de madera, que ya se ha podrido; otro de plata, que necesita que alguien lo vigile para que no sea robado; otro de hierro, corroído por el óxido; y otro de barro, no más decoroso que el destinado al uso más indigno?


    ¿No están hechos todos de materia perecedera? ¿No fueron trabajados con herramientas de hierro y con fuego? ¿No hizo uno el escultor, otro el fundidor de bronce, otro el platero y otro el alfarero? Antes de que el oficio de esos diversos artesanos les diera estas formas, ¿no podía cada uno haber recibido otra forma y haber sido hecho semejante a cualquiera de aquellos utensilios? Y los utensilios que ahora se hacen del mismo material, si cayeran en manos de esos mismos artesanos, ¿no podrían llegar a ser semejantes a esos dioses?


    ¿No podrían estas cosas que ustedes ahora adoran volver a ser convertidas por manos humanas en utensilios como los demás? ¿No son todas sordas y ciegas, sin alma, sin sensibilidad e inmóviles? ¿No se pudren y se deterioran todas?


    A estas cosas las llaman dioses; a ellas sirven como esclavos; a ellas adoran; y terminan haciéndose enteramente semejantes a ellas.


    Por eso odian a los cristianos: porque no consideran dioses a estas cosas.


    Pero ustedes mismos, que ahora las consideran dioses y las adoran, ¿no las desprecian aún más? ¿No se burlan de ellas y las insultan al dejar sin vigilancia a las de piedra y barro, mientras encierran bajo llave por la noche a las de plata y oro y les ponen guardias durante el día para impedir que sean robadas?


    En cuanto a los honores que creen rendirles, si ellas pueden percibirlos, más bien las castigan con esos honores; pero, si no pueden percibirlos, las ofenden al intentar aplacarlas con la sangre y la grasa de las víctimas sacrificadas.


    Que uno de ustedes reciba ese trato; que consienta en que le hagan tales cosas. No: ni una sola persona se sometería voluntariamente a semejante castigo, porque tiene sensibilidad y razón. Una piedra, en cambio, lo soporta porque carece de sensibilidad. Por tanto, ustedes demuestran que tiene sensibilidad.[a]


    Podría decir muchas otras cosas acerca de que los cristianos no son esclavos de dioses como estos. Pero si alguien considera insuficiente lo dicho, juzgo innecesario decir más.'
