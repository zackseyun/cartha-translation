review_pass:
  verdict: revise
  source_fidelity: 'El borrador reproduce de manera muy fiel el sentido y la estructura del pasaje. Son necesarias correcciones puntuales: «los más débiles» conserva el comparativo del original; «en los cielos» refleja el plural griego; y el cierre debe decir «veas aquel fuego», no «comprendas aquel fuego», pues el verbo se refiere a percibir/ver. La reposición de «a los seres humanos» tras «Dios amó» está respaldada por el griego transmitido (τοὺς ἀνθρώπους), aunque falta cotejo crítico directo integral.'
  naturalness: El registro es digno, claro y apto para español latinoamericano. Se mejora «contemplarás que» por «verás que» y «proclamar los misterios» por «hablar de los misterios», formulaciones más naturales sin rebajar el tono. «Recibe ... el conocimiento» se reemplaza por «capta primero el pleno conocimiento», más próximo al imperativo cognitivo del pasaje.
  terminology: «Padre», «Hijo unigénito», «Dios», «justicia» y «fuego eterno» son adecuados. Se conserva deliberadamente «un dios» en minúscula para la metáfora de la generosidad, sin explicarla doctrinalmente. «Prójimo» mantiene el término relacional del texto.
  issues:
  - severity: medium
    issue: El cierre dice «cuando comprendas aquel fuego».
    rationale: El texto y el testimonio inglés indican percepción/visión de «aquel fuego», no comprensión intelectual. «Cuando veas aquel fuego» conserva el sentido y la imagen.
  - severity: low
    issue: «Los débiles» omite el valor comparativo.
    rationale: El pasaje contrasta con quienes son más débiles; «los más débiles» conserva esa comparación.
  - severity: low
    issue: «El reino que está en el cielo» singulariza la expresión.
    rationale: El griego dice literalmente «el reino en los cielos». La forma plural es natural en traducción bíblica y más fiel.
  - severity: low
    issue: Algunas elecciones son algo literales o menos naturales.
    rationale: «Capta primero», «verás que» y «hablar de los misterios» expresan con mayor naturalidad el sentido cognitivo, visual y declarativo sin modificar el registro.
  revised_text: 'Si tú también deseas esta fe, capta primero el pleno conocimiento del Padre.


    Porque Dios amó a los seres humanos[a], por quienes hizo el mundo, a quienes sometió todo lo que hay en la tierra, a quienes dio razón y entendimiento, a quienes únicamente permitió alzar la mirada al cielo, a quienes creó a su propia imagen, a quienes envió a su Hijo unigénito, a quienes prometió el reino en los cielos y se lo dará: a los que lo han amado.


    Y cuando hayas alcanzado este pleno conocimiento, ¿de cuánta alegría crees que quedarás lleno? ¿Cómo amarás al que te amó primero?


    Al amarlo, imitarás su bondad. No te asombres de que un ser humano pueda imitar a Dios. Puede hacerlo, si Dios así lo quiere.


    Porque la felicidad no consiste en dominar a los demás, ni en querer tener más que los más débiles, ni en poseer riquezas y emplear la fuerza contra los inferiores. Nadie puede imitar a Dios en estas cosas; más bien, no forman parte de su grandeza.


    Pero quien toma sobre sí la carga de su prójimo, quien desea beneficiar al que está en desventaja en aquello en que él mismo se encuentra en mejor condición, y quien provee a los necesitados los bienes que recibió de Dios, llegando así a ser un dios para quienes los reciben de él, ese imita a Dios.


    Entonces, aunque estés en la tierra, verás que Dios vive en el cielo. Entonces comenzarás a hablar de los misterios de Dios. Entonces amarás y admirarás a quienes son castigados porque se niegan a renegar de Dios. Entonces condenarás el engaño y el error del mundo, cuando reconozcas la vida verdadera que está en el cielo, cuando desprecies la muerte aparente que está aquí en la tierra y cuando temas la muerte real, reservada para quienes serán condenados al fuego eterno, el cual castigará hasta el fin a los que sean entregados a él.


    Entonces admirarás a quienes soportan, por causa de la justicia, el fuego que dura solo un tiempo, y los considerarás dichosos cuando veas aquel fuego…[b]'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés suministrado omite aquí el complemento de «amó». Se traduce «a los seres humanos», lectura atestiguada en el texto griego transmitido; conviene verificarla nuevamente en una revisión crítica integral de la fuente.
    reason: Explica transparentemente la reposición exigida por el sentido y respaldada por la tradición griega, sin ocultar la necesidad de cotejo crítico.
  - marker: b
    text: El texto se interrumpe en este punto; los puntos suspensivos indican que la continuación no se ha conservado.
    reason: Preserva y explica la señal de pérdida textual, sin completar el pasaje por conjetura.
  revision_rationale: La revisión conserva las anáforas y el tuteo del borrador, y efectúa únicamente ajustes seguros de fidelidad y fluidez. No se resuelve doctrinalmente la metáfora «un dios», el contraste entre las dos muertes ni la relación entre «fuego eterno» y «hasta el fin».
