base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: es
  text: 'Si tú también deseas esta fe, recibe primero el pleno conocimiento del Padre.


    Porque Dios amó a los seres humanos[a], por quienes hizo el mundo, a quienes sometió todo lo que hay en la tierra, a quienes dio razón y entendimiento, a quienes únicamente permitió alzar la mirada al cielo, a quienes creó a su propia imagen, a quienes envió a su Hijo unigénito, a quienes prometió el reino que está en el cielo y se lo dará: a los que lo hayan amado.


    Y cuando hayas alcanzado este pleno conocimiento, ¿de qué alegría crees que quedarás lleno? ¡Cuánto amarás al que te amó primero!


    Al amarlo, imitarás su bondad. No te asombres de que un ser humano pueda imitar a Dios. Puede hacerlo, si Dios así lo quiere.


    Porque la felicidad no consiste en dominar a los demás, ni en querer tener más que los débiles, ni en poseer riquezas y emplear la fuerza contra los inferiores. Nadie puede imitar a Dios en estas cosas; al contrario, están fuera de su grandeza.


    Pero quien toma sobre sí la carga de su prójimo, quien desea beneficiar al que está en desventaja en aquello en que él mismo se encuentra en mejor condición, quien da a los necesitados los bienes que recibió de Dios y así llega a ser un dios para quienes los reciben, ese imita a Dios.


    Entonces, aunque estés en la tierra, contemplarás que Dios vive en el cielo. Entonces comenzarás a proclamar los misterios de Dios. Entonces amarás y admirarás a quienes son castigados porque se niegan a renegar de Dios. Entonces condenarás el engaño y el error del mundo: cuando reconozcas la vida verdadera que está en el cielo, cuando desprecies la muerte aparente que está aquí en la tierra y cuando temas la muerte real, reservada para quienes serán condenados al fuego eterno, el cual castigará hasta el fin a los que sean entregados a él.


    Entonces admirarás a quienes soportan por causa de la justicia el fuego que dura solo un tiempo, y los considerarás dichosos cuando comprendas aquel fuego…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado omite aquí el complemento de «amó». Se traduce «a los seres humanos», lectura atestiguada en el texto griego transmitido; conviene verificarla nuevamente en la revisión crítica de la fuente.
    reason: Señalar con transparencia una omisión del testimonio de consulta y la reposición necesaria para el sentido.
  - marker: b
    text: El texto se interrumpe en este punto; los puntos suspensivos indican que la continuación no se ha conservado.
    reason: Preservar y explicar la señal de pérdida textual, sin completar con una conjetura.
lexical_decisions:
- source_word: full knowledge / ἐπίγνωσις
  choice: pleno conocimiento
  rationale: Conserva la intensidad del término y su énfasis en conocer al Padre, sin convertirlo en una fórmula técnica ajena al pasaje.
- source_word: reason and mind
  choice: razón y entendimiento
  rationale: Mantiene los dos aspectos de la capacidad humana en un español natural y evita la posible lectura de «mente» como simple órgano o facultad genérica.
- source_word: only begotten Son
  choice: Hijo unigénito
  rationale: Es una formulación breve y digna que preserva la singularidad filial expresada por el testimonio.
- source_word: happiness
  choice: felicidad
  rationale: Reproduce el sentido ético del pasaje sin introducir el término técnico «bienaventuranza», que podría añadir asociaciones no exigidas aquí.
- source_word: becomes a God
  choice: llega a ser un dios
  rationale: Se conserva la expresión audaz y analógica del texto, con minúscula para distinguirla del referente único «Dios», sin suavizar su tensión retórica.
- source_word: until the end
  choice: hasta el fin
  rationale: Mantiene la formulación temporal abierta del testimonio y evita decidir si el énfasis recae en la consumación, la duración o el resultado.
- source_word: for righteousness’ sake
  choice: por causa de la justicia
  rationale: Conserva el valor causal y el campo semántico de justicia sin restringirlo a una interpretación doctrinal específica.
theological_decisions:
- issue: La posibilidad de que el ser humano imite a Dios
  choice: «Puede hacerlo, si Dios así lo quiere»
  alternative: «Le es posible, cuando Dios lo quiere»
  rationale: Se conserva tanto la afirmación de la imitación como su dependencia de la voluntad divina, sin explicar el mecanismo teológico.
- issue: La persona generosa «llega a ser un dios» para quienes reciben
  choice: Conservar literalmente la metáfora, distinguiendo «un dios» de «Dios» mediante mayúsculas
  alternative: «se convierte en representante de Dios»
  rationale: La alternativa resolvería e interpretaría una expresión deliberadamente fuerte. La versión elegida preserva la tensión sin afirmar identidad ontológica con Dios.
- issue: Contraste entre muerte aparente y muerte real
  choice: Mantener el contraste tal como aparece
  alternative: Identificar expresamente la primera con la muerte física y la segunda con la condenación espiritual
  rationale: El contexto orienta la lectura, pero el texto mismo emplea categorías retóricas; explicitarlas eliminaría parte de su fuerza y ambigüedad.
- issue: Duración del castigo del fuego
  choice: «castigará hasta el fin»
  alternative: «castigará eternamente»
  rationale: Aunque el fuego es llamado eterno, la cláusula temporal se conserva sin armonizarla ni ampliarla, respetando la tensión del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea tuteo singular porque el discurso se dirige personalmente a Diogneto. Se conservan las repeticiones anafóricas («a quienes», «entonces», «cuando») por su función retórica. El borrador prioriza el testimonio disponible y datos griegos seguros, pero sigue requiriendo cotejo directo integral con una edición crítica griega, dado que el manuscrito base se perdió y se conoce por copias.
