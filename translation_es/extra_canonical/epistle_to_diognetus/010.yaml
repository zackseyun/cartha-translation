review_pass:
  verdict: revise
  source_fidelity: 'El borrador reproduce fielmente la secuencia argumentativa y las imágenes centrales del testimonio, incluida la reposición necesaria de «los seres humanos» tras «Dios amó». Se ajustan algunos giros para reflejar con mayor precisión las relaciones sintácticas y temporales del pasaje: «a quienes lo han amado», la interrogación retórica sobre cómo se amará a Dios y la provisión de bienes a los necesitados.'
  naturalness: El español es generalmente claro y digno. Las revisiones reducen algunas formulaciones algo rígidas («contemplarás que», «se encuentra en mejor condición») y conservan la anáfora deliberada del original.
  terminology: Se mantienen «Padre», «Hijo unigénito», «misterios», «justicia» y la metáfora «llega a ser un dios», sin resolverla doctrinalmente. «Prójimos» conserva mejor que «los demás» el referente interpersonal de «neighbors».
  issues:
  - severity: low
    issue: '«se lo dará: a los que lo hayan amado»'
    rationale: El futuro perfecto puede sugerir una anterioridad más marcada de la que expresa el participio perfecto del testimonio. «Se lo dará a quienes lo han amado» conserva mejor la construcción y resulta natural.
  - severity: low
    issue: «¡Cuánto amarás al que te amó primero!»
    rationale: 'Aunque comunica intensidad, transforma una pregunta retórica en exclamación. Conviene preservar la forma interrogativa: «¿Cómo amarás al que te amó primero?».'
  - severity: low
    issue: «dominar a los demás»
    rationale: «Los demás» generaliza el «neighbors» del testimonio. «Ejercer dominio sobre los propios prójimos» conserva el matiz relacional sin recurrir al poco natural «vecinos».
  - severity: low
    issue: «quien da a los necesitados los bienes...»
    rationale: El original presenta específicamente la acción de proveer o suministrar bienes a quienes carecen de ellos. «Provee a los necesitados de los bienes...» hace explícita esa relación sin añadir interpretación.
  - severity: low
    issue: «comenzarás a proclamar los misterios»
    rationale: «Proclamar» puede añadir un matiz de anuncio público solemne. «Comenzarás a hablar de los misterios de Dios» corresponde más estrechamente a «declare» y mantiene un registro natural.
  revised_text: 'Si tú también deseas esta fe, adquiere primero el pleno conocimiento del Padre.


    Porque Dios amó a los seres humanos[a], por quienes hizo el mundo, a quienes sometió todo lo que hay en la tierra, a quienes dio razón y entendimiento, a quienes únicamente permitió alzar la mirada al cielo, a quienes creó a su propia imagen, a quienes envió a su Hijo unigénito, a quienes prometió el reino que está en el cielo y se lo dará a quienes lo han amado.


    Y cuando hayas alcanzado este pleno conocimiento, ¿de qué alegría crees que quedarás lleno? ¿Cómo amarás al que te amó primero?


    Al amarlo, imitarás su bondad. No te asombres de que un ser humano pueda imitar a Dios. Puede hacerlo, si Dios así lo quiere.


    Porque la felicidad no consiste en ejercer dominio sobre los propios prójimos, ni en querer tener más que los débiles, ni en poseer riquezas y emplear la fuerza contra los inferiores. Nadie puede imitar a Dios en estas cosas; al contrario, están fuera de su grandeza.


    Pero quien toma sobre sí la carga de su prójimo, quien desea beneficiar al que está en desventaja en aquello en que él mismo es superior, quien provee a los necesitados de los bienes que recibió de Dios y así llega a ser un dios para quienes los reciben, ese imita a Dios.


    Entonces, aunque estés en la tierra, verás que Dios vive en el cielo. Entonces comenzarás a hablar de los misterios de Dios. Entonces amarás y admirarás a quienes son castigados porque se niegan a renegar de Dios. Entonces condenarás el engaño y el error del mundo, cuando percibas la vida verdadera que está en el cielo, cuando desprecies la muerte aparente que está aquí en la tierra y cuando temas la muerte real, reservada para quienes serán condenados al fuego eterno, el cual castigará hasta el fin a los que sean entregados a él.


    Entonces admirarás a quienes soportan, por causa de la justicia, el fuego que dura solo un tiempo, y los considerarás dichosos cuando comprendas aquel fuego…[b]'
