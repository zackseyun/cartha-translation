base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: es
  text: 'Ante estas verdades, si las escuchan con atención, sabrán cuánto concede Dios a quienes lo aman como es debido. Ellos se convierten en un paraíso de delicias, en un árbol floreciente que crece dentro de ellos, produce toda clase de fruto y está adornado con frutos diversos.


    Porque en este jardín fueron plantados un árbol del conocimiento y un árbol de la vida. Sin embargo, el árbol del conocimiento no mata; lo que mata es la desobediencia.


    En efecto, las Escrituras declaran con claridad que, desde el principio, Dios plantó en medio del Paraíso un árbol [del conocimiento y un árbol] de la vida[a], y reveló la vida por medio del conocimiento. Pero, como nuestros primeros padres no hicieron un uso genuino de él, quedaron desnudos por el engaño de la serpiente.


    Porque no hay vida sin conocimiento ni conocimiento sano sin vida verdadera. Por eso, un árbol está plantado cerca del otro.


    El apóstol comprendió la fuerza de esto y censuró el conocimiento que se practica apartado de la verdad del mandato que conduce a la vida. Por eso dice: «El conocimiento envanece, pero el amor edifica».


    Quien supone que sabe algo sin el conocimiento verdadero del que da testimonio la vida es ignorante. Ha sido engañado por la serpiente porque no amó la vida. En cambio, quien con temor reconoce y desea la vida planta con esperanza, aguardando el fruto.


    Que tu corazón sea conocimiento, y tu vida, razón verdadera debidamente comprendida.


    Si llevas en ti ese árbol y recoges su fruto, cosecharás siempre lo que Dios busca: una cosecha que la serpiente no toca ni el engaño contamina. Eva no es corrompida, sino que se cree en ella como virgen[b];


    la salvación es presentada; los apóstoles son llenos de entendimiento; la Pascua del Señor sigue adelante; las congregaciones se reúnen; [todas las cosas] son dispuestas en orden; y, mientras enseña a los santos, el Verbo se alegra. Por medio de él es glorificado el Padre. A él sea la gloria por los siglos de los siglos. Amén.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Las palabras entre corchetes reflejan una restitución del texto en el testimonio disponible; la revisión directa del griego sigue pendiente.
    reason: Preservar de manera visible la señal de daño o restitución textual transmitida por la fuente.
  - marker: b
    text: La afirmación sobre Eva es inusual y su sentido es incierto en el testimonio disponible. Se ha traducido sin identificar a Eva con otra figura ni armonizar la expresión.
    reason: Advertir una dificultad textual e interpretativa genuina sin resolverla de manera doctrinal.
lexical_decisions:
- source_word: knowledge
  choice: conocimiento
  rationale: Mantiene el término repetido que articula el contraste entre el árbol, la desobediencia, la vida y la cita apostólica.
- source_word: charity
  choice: amor
  rationale: En la cita de 1 Corintios 8:1, «amor» comunica en español actual el sentido de la virtud cristiana sin la asociación moderna de «caridad» con la ayuda material.
- source_word: Paradise
  choice: Paraíso
  rationale: Conserva la referencia al jardín de Génesis y la personificación espiritual desarrollada por el autor.
- source_word: true reason
  choice: razón verdadera
  rationale: Retiene la formulación conceptual del testimonio disponible sin identificarla automáticamente con «el Verbo», pues esa equivalencia no está asegurada por la evidencia suministrada.
- source_word: congregations
  choice: congregaciones
  rationale: Evita imponer «iglesias» cuando el testimonio inglés permite el sentido más general de asambleas reunidas.
- source_word: the Word
  choice: el Verbo
  rationale: Usa la designación cristológica tradicional y comprensible en español, distinguiéndola de una palabra ordinaria.
- source_word: Passover
  choice: Pascua
  rationale: Conserva la amplitud del término, que puede evocar tanto la Pascua bíblica como su recepción cristiana.
theological_decisions:
- issue: Relación entre conocimiento, vida y desobediencia
  choice: Se conserva la afirmación de que no mata el árbol del conocimiento, sino la desobediencia.
  alternative: Explicar que el conocimiento es bueno únicamente cuando está subordinado a la obediencia.
  rationale: La explicación alternativa resolvería más de lo que dice el texto y reduciría su tensión retórica.
- issue: Frase acerca de Eva como virgen
  choice: «Eva no es corrompida, sino que se cree en ella como virgen».
  alternative: Interpretar a Eva como figura de la Iglesia o sustituirla directamente por la Iglesia.
  rationale: El testimonio disponible presenta una formulación inusual y difícil; se conserva sin armonizarla ni introducir una interpretación eclesiológica no explícita.
- issue: Referente final de «A él sea la gloria»
  choice: Se mantiene el pronombre «él» sin reemplazarlo por «Dios», «el Padre» o «el Verbo».
  alternative: Hacer explícito uno de esos referentes.
  rationale: La cadena de referentes permite cierta ambigüedad; explicitar uno impondría una decisión que el testimonio no asegura.
- issue: Agente de la enseñanza a los santos
  choice: «mientras enseña a los santos, el Verbo se alegra».
  alternative: «mientras él enseña a los santos, el Verbo es alegrado».
  rationale: La puntuación y la voz del testimonio inglés son difíciles. La versión elegida produce español inteligible y mantiene al Verbo como sujeto cercano, sin desarrollar una doctrina adicional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se alterna el plural «ustedes» implícito al comienzo con el singular exhortativo «tú» en la sección correspondiente, siguiendo el cambio del testimonio. El borrador se apoya en el testimonio inglés de dominio público proporcionado, pues la revisión directa del griego está pendiente. Se conservaron los paralelismos, las imágenes arbóreas, los corchetes editoriales y las ambigüedades teológicas relevantes.
