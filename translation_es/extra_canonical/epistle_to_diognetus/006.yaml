base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: es
  text: 'En una palabra: lo que el alma es en un cuerpo, eso son los cristianos en el mundo.


    El alma está esparcida por todos los miembros del cuerpo, y los cristianos por las diversas ciudades del mundo.


    El alma habita en el cuerpo y, sin embargo, no es del cuerpo. Del mismo modo, los cristianos habitan en el mundo y, sin embargo, no son del mundo.


    El alma, que es invisible, está resguardada en el cuerpo visible. Del mismo modo, se reconoce que los cristianos están en el mundo y, sin embargo, su religión permanece invisible.


    La carne odia al alma y lucha contra ella, aunque no ha recibido ningún daño, porque se le impide entregarse a los placeres. Del mismo modo, el mundo odia a los cristianos, aunque no ha recibido ningún daño de ellos, porque se oponen a sus placeres.


    El alma ama a la carne que la odia, y también a los miembros. Del mismo modo, los cristianos aman a quienes los odian.


    El alma está encerrada en el cuerpo y, sin embargo, ella misma mantiene unido el cuerpo. Del mismo modo, los cristianos son retenidos en el mundo como en una prisión y, sin embargo, ellos mismos mantienen unido el mundo.


    El alma, aunque es inmortal, habita en un tabernáculo mortal. Del mismo modo, los cristianos viven como extranjeros entre cosas perecederas, mientras esperan la incorruptibilidad que está en los cielos.


    El alma mejora cuando se la trata con dureza en cuanto a comidas y bebidas. Del mismo modo, cuando los cristianos son castigados, se multiplican más y más cada día.


    Tan grande es la función para la que Dios los ha designado, y no les es lícito rehusarla.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: religion (English witness; underlying Greek review pending)
  choice: manera de honrar a Dios
  rationale: Evita que «religión» sugiera ante todo una institución visible y expresa naturalmente una práctica o devoción que, según la comparación, permanece invisible.
- source_word: mortal tabernacle (English witness; underlying Greek review pending)
  choice: morada mortal
  rationale: Conserva la imagen de una residencia temporal sin introducir innecesariamente el sentido técnico bíblico que «tabernáculo» puede tener en español.
- source_word: sojourn
  choice: viven como extranjeros
  rationale: Comunica residencia provisional y falta de pertenencia permanente en español latinoamericano natural.
- source_word: imperishability
  choice: condición incorruptible
  rationale: Mantiene el sustantivo abstracto y la tensión entre lo perecedero y lo que no se corrompe, sin precisar si se refiere a vida, cuerpo o herencia.
- source_word: increase
  choice: se multiplican
  rationale: En este contexto de castigo contra los cristianos, expresa con claridad el crecimiento numérico de la comunidad, aunque el testimonio inglés aislado permite una formulación más general.
- source_word: office
  choice: misión
  rationale: Expresa una función encomendada por Dios sin las connotaciones burocráticas de «cargo» ni las clericales de «oficio».
theological_decisions:
- issue: «No son del mundo»
  choice: Conservar la fórmula sin explicarla
  alternative: «No pertenecen al mundo»
  rationale: La expresión mantiene la tensión teológica y la resonancia tradicional sin definir de manera reductiva la relación de los cristianos con el mundo.
- issue: Función cósmica de los cristianos
  choice: «ellos mismos mantienen unido el mundo»
  alternative: «sostienen el mundo»
  rationale: Preserva la afirmación fuerte de la analogía alma-cuerpo sin convertirla en una explicación doctrinal acerca de providencia, juicio o intercesión.
- issue: Inmortalidad del alma
  choice: Traducir la afirmación tal como aparece en la analogía
  alternative: Atenuarla como mera expectativa futura
  rationale: El pasaje afirma explícitamente que el alma es inmortal; no corresponde armonizar ni corregir aquí su antropología.
- issue: Expectativa celestial
  choice: «la condición incorruptible que está en los cielos»
  alternative: «la inmortalidad del cielo»
  rationale: Conserva el lenguaje abstracto y evita identificar sin base suficiente la incorruptibilidad con un solo referente teológico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron el orden de los párrafos, el paralelismo repetido entre alma/cuerpo y cristianos/mundo, y las afirmaciones teológicas tensas. Como el material proporcionado es un testimonio inglés de dominio público y la revisión del griego está pendiente, las notas señalan los puntos donde una verificación de la fuente antigua podría modificar la elección léxica.
