revisions:
- from: 'En pocas palabras: lo que el alma es en el cuerpo, eso son los cristianos en el mundo.


    El alma está extendida por todos los miembros del cuerpo, y los cristianos, por las diversas ciudades del mundo.


    El alma habita en el cuerpo, pero no procede del cuerpo. Del mismo modo, los cristianos habitan en el mundo, pero no son del mundo.


    El alma, que es invisible, está resguardada en el cuerpo visible. Del mismo modo, se reconoce que los cristianos están en el mundo, pero su manera de honrar a Dios permanece invisible.[a]


    La carne odia al alma y lucha contra ella, aunque no ha recibido ningún daño, porque el alma le impide entregarse a los placeres. Del mismo modo, el mundo odia a los cristianos, aunque no ha recibido ningún daño de ellos, porque se oponen a sus placeres.


    El alma ama a la carne que la odia, y también a sus miembros. Del mismo modo, los cristianos aman a quienes los odian.


    El alma está encerrada en el cuerpo y, sin embargo, ella misma mantiene unido el cuerpo. Del mismo modo, los cristianos son retenidos en el mundo como en una prisión y, sin embargo, ellos mismos mantienen unido el mundo.


    El alma, aunque es inmortal, habita en una morada mortal.[b] Del mismo modo, los cristianos viven como extranjeros entre cosas perecederas, mientras esperan la condición incorruptible que está en los cielos.[c]


    El alma mejora cuando se la trata con dureza en cuanto a comidas y bebidas. Del mismo modo, cuando los cristianos son castigados, se multiplican cada día más.


    Tan grande es la misión que Dios les ha asignado, y no les está permitido abandonarla.'
