review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones seguras frente al testimonio inglés suministrado. «No procede del cuerpo» cambia «no es del cuerpo» de pertenencia/identidad a una afirmación de origen. «Manera de honrar a Dios» interpreta y estrecha «religion», mientras que «religión» conserva el término del testimonio. «Morada mortal» atenúa la imagen explícita de «tabernáculo/tienda», y «condición incorruptible» añade «condición», ausente del sustantivo abstracto «imperishability».
  naturalness: El borrador tiene un registro generalmente claro y digno. Las sustituciones por «no es del cuerpo», «religión», «tabernáculo mortal» e «incorruptibilidad» resultan naturales en prosa religiosa y mejor alineadas con el paralelismo del pasaje. «No les es lícito rehusarla» reproduce con mayor precisión y naturalidad el cierre que «no les está permitido abandonarla».
  terminology: Se conserva «alma», «carne», «mundo», «cristianos» e «incorruptibilidad» sin imponer explicaciones doctrinales. «Religión» debe mantenerse como término deliberadamente amplio. «Tabernáculo» preserva la metáfora de habitación temporal; no se le atribuye aquí un sentido técnico adicional.
  issues:
  - severity: medium
    issue: «no procede del cuerpo» por «it is not of the body»
    rationale: La formulación española afirma que el alma no tiene su origen en el cuerpo; el testimonio expresa más directamente que, aunque habita en él, no pertenece a su orden o naturaleza. «No es del cuerpo» preserva la formulación y su paralelismo posterior.
  - severity: medium
    issue: «su manera de honrar a Dios» por «their religion»
    rationale: La paráfrasis introduce explícitamente a Dios y restringe el alcance del término. «Su religión» conserva la ambigüedad de práctica, culto o piedad sin ampliarla interpretativamente.
  - severity: low
    issue: Atenuación de «mortal tabernacle» e inserción de «condición»
    rationale: «Morada» pierde la imagen de tienda/tabernáculo, y «condición incorruptible» agrega un referente conceptual no expresado. «Tabernáculo mortal» e «incorruptibilidad» son más fieles.
  - severity: low
    issue: «abandonarla» por «decline»
    rationale: «Declinar/rehusar» expresa no aceptar o rechazar el encargo; «abandonar» puede implicar haberlo asumido primero.
