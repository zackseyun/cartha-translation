base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: es
  text: 'Mis enseñanzas no son extrañas, ni planteo cuestiones insensatas. Al contrario, después de haber sido discípulo de los apóstoles, me presento como maestro de los gentiles y transmito dignamente las enseñanzas recibidas a quienes se hacen discípulos de la verdad.


    Pues ¿quién, después de haber recibido la debida enseñanza y de haberse hecho amigo de la Palabra, no procura conocer con claridad lo que la Palabra reveló abiertamente a los discípulos? A ellos se manifestó y se lo dio a conocer hablando con franqueza. Los incrédulos no la reconocieron; pero ella comunicó estas cosas a los discípulos, a quienes consideró fieles y enseñó los misterios del Padre.


    Por esta razón envió a la Palabra, para que se manifestara al mundo. Aunque su pueblo la deshonró, los apóstoles la proclamaron y los gentiles creyeron en ella.


    Esta Palabra existía desde el principio; apareció como nueva y, sin embargo, demostró ser antigua; y siempre nace joven en el corazón de los santos.


    Ella, afirmo, es eterna; hoy fue reconocida como Hijo.[a] Por medio de ella la Iglesia se enriquece, y la gracia se despliega y se multiplica entre los santos: gracia que concede entendimiento, revela misterios, anuncia los tiempos, se alegra por los fieles y es otorgada a quienes la buscan, es decir, a quienes no quebrantan las garantías de la fe ni traspasan los límites establecidos por los padres.[b]


    Así se canta el temor de la ley, se reconoce la gracia de los profetas, se afianza la fe de los Evangelios, se conserva la tradición de los apóstoles y se desborda la alegría de la Iglesia.


    Si no entristeces a esta gracia, comprenderás las enseñanzas que la Palabra comunica por boca de quienes ella quiere, cuando quiere.


    Movidos por la voluntad de la Palabra que manda, nos esforzamos mucho por expresar todas estas cosas; y, por amor a lo que nos fue revelado, las compartimos con ustedes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «hoy fue reconocida como Hijo» es difícil. También podría entenderse «hoy fue considerada Hijo». Se conserva su formulación sin decidir si «hoy» alude al nacimiento, a la resurrección, a la entronización o a otra realidad.
    reason: Preservar una ambigüedad cristológica y temporal del testimonio en vez de imponer una lectura confesional específica.
  - marker: b
    text: «Los padres» puede referirse de manera amplia a antecesores o maestros recibidos como autoridades; el contexto disponible no permite identificar con certeza un grupo más preciso.
    reason: Evitar identificar anacrónica o indebidamente a los referentes como una categoría eclesiástica técnica.
lexical_decisions:
- source_word: λόγος (reconstructed from the known Greek text; direct manuscript review pending)
  choice: la Palabra
  rationale: Conserva la designación cristológica y también su resonancia de palabra, discurso o razón. La personificación se mantiene sin sustituirla por una interpretación doctrinal más específica.
- source_word: ἔθνη / Gentiles (as reflected in the supplied witness)
  choice: los gentiles
  rationale: Mantiene la categoría histórica del escrito y evita reducirla sin más a «naciones» o «no judíos», aunque esas ideas forman parte del campo semántico.
- source_word: παραδοθέντα / handed down
  choice: las enseñanzas recibidas
  rationale: Expresa algo transmitido y recibido sin cargar prematuramente el término con un sentido técnico institucional.
- source_word: μυστήρια / mysteries
  choice: misterios
  rationale: Preserva el lenguaje del autor acerca de las realidades reveladas del Padre, sin explicarlas ni restringirlas.
- source_word: χάρις / grace
  choice: gracia
  rationale: Es la equivalencia natural y tradicional; se conserva además su personificación gramatical en el pasaje.
- source_word: καιροί / seasons (as reflected in the supplied witness)
  choice: los tiempos
  rationale: «Los tiempos» comunica épocas o momentos señalados con mayor naturalidad en español que «las estaciones», sin precisar indebidamente de qué tiempos se trata.
theological_decisions:
- issue: La Palabra como referente personal
  choice: Mantener «la Palabra» y sus formas pronominales femeninas conforme a la gramática española, conservando «Hijo» en masculino donde aparece el título.
  alternative: Usar sistemáticamente pronombres masculinos referidos a Cristo o traducir «el Verbo».
  rationale: La forma elegida deja visible la tensión entre el sustantivo español femenino y el título personal masculino, sin insertar en cada oración una identificación explicativa que el pasaje no formula de manera uniforme.
- issue: «Hoy fue reconocida como Hijo»
  choice: Conservar la formulación temporal y el verbo de reconocimiento, acompañados de nota.
  alternative: Interpretar «hoy» como una referencia explícita al nacimiento, la resurrección, la entronización o la generación eterna.
  rationale: El testimonio suministrado no determina cuál de esos marcos teológicos pretende el autor; resolverlo en el texto borraría una ambigüedad genuina.
- issue: «Su pueblo la deshonró»
  choice: Traducir el referente colectivo como «su pueblo».
  alternative: «El pueblo» o una identificación étnica explícita.
  rationale: La frase conserva el contraste histórico del testimonio sin convertirlo en una generalización polémica contra un grupo étnico.
- issue: «Los límites establecidos por los padres»
  choice: Retener «los padres» con una nota de amplitud semántica.
  alternative: Precisar «los Padres de la Iglesia», «los antepasados» o «los maestros anteriores».
  rationale: La evidencia proporcionada no permite fijar con seguridad cuál de esos grupos concretos está a la vista.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitaron arcaísmos como «tú has de» y tecnicismos innecesarios. La cadencia retórica y las repeticiones de «la Palabra» y «gracia» se conservaron porque estructuran el argumento. Este borrador se apoya en el testimonio inglés público suministrado y en correspondencias griegas conocidas solo de manera provisional; el Códice Argentoratensis está perdido y la revisión directa y completa del texto griego transmitido por copias sigue pendiente.
