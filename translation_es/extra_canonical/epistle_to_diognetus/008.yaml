base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: es
  text: 'Pues ¿qué ser humano llegó jamás a conocer qué era Dios antes de que él viniera?[a]


    ¿O aceptas las afirmaciones vacías y absurdas de aquellos filósofos pretenciosos? Algunos dijeron que Dios era fuego —llaman «Dios» a aquello adonde ellos mismos irán—; otros, que era agua; y otros, que era alguno de los demás elementos creados por Dios.


    Sin embargo, si alguna de estas afirmaciones merece ser aceptada, con igual razón podría sostenerse que cualquier otra cosa creada es Dios.


    No; todo esto no es más que charlatanería y engaño de magos.


    Nadie lo ha visto ni conocido; más bien, él mismo se reveló.[b]


    Y se reveló mediante la fe, pues solo por ella se concede ver a Dios.


    Porque Dios, el Señor y Creador del universo, quien hizo todas las cosas y las dispuso en orden, mostró ser no solo amigo de los seres humanos, sino también paciente.


    En verdad, así fue siempre, así es y así será: bondadoso, bueno, libre de pasiones[c] y veraz. Solo él es bueno.


    Después de concebir un plan grandioso e inexpresable, se lo comunicó únicamente a su Hijo.


    Mientras mantuvo su sabio propósito reservado y lo guardó como misterio, parecía desentenderse de nosotros y no preocuparse por nosotros.


    Pero cuando lo reveló por medio de su Hijo amado y manifestó el propósito que había preparado desde el principio, nos concedió todo a la vez: participar de sus beneficios, ver y comprender cosas que ninguno de nosotros habría esperado jamás.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El referente de «él» no es completamente explícito en el testimonio disponible; puede aludir a Dios en su autorrevelación o, en el contexto posterior, a la venida de su Hijo.
    reason: Preservar una ambigüedad relevante mientras está pendiente la revisión directa del texto griego.
  - marker: b
    text: 'También podría entenderse: «sino que él lo reveló», si el objeto implícito es el conocimiento de Dios y no Dios mismo.'
    reason: La forma reflexiva está suplida en el testimonio inglés y admite otra construcción.
  - marker: c
    text: «Libre de pasiones» traduce una expresión antigua sobre la impasibilidad divina; aquí no significa necesariamente carente de amor, bondad o interés.
    reason: Evitar una lectura moderna equívoca sin borrar el lenguaje teológico antiguo.
  - marker: d
    text: 'El testimonio inglés suple «misterios» en este punto; el sentido literal disponible es más general: «lo que ninguno de nosotros habría esperado».'
    reason: Informar al lector sobre una suplencia editorial presente en el testimonio base.
lexical_decisions:
- source_word: what God was
  choice: cómo era Dios
  rationale: Expresa la naturaleza o carácter de Dios sin reducir la frase a su identidad; conserva el matiz del testimonio disponible.
- source_word: pretentious philosophers
  choice: filósofos pretenciosos
  rationale: Mantiene el tono polémico y despectivo del pasaje con lenguaje actual.
- source_word: quackery
  choice: charlatanería
  rationale: Comunica la acusación de impostura y fraude sin sugerir meramente una técnica ilusoria.
- source_word: Master and Creator
  choice: Señor y Creador
  rationale: «Señor» resulta natural y dignificado en español, aunque el término también puede tener el sentido de soberano o dueño.
- source_word: friendly to men
  choice: amigo de la humanidad
  rationale: Conserva la afirmación relacional y universal, evitando el masculino genérico ambiguo en español contemporáneo.
- source_word: long-suffering
  choice: paciente
  rationale: Expresa la tolerancia perseverante del original de forma clara y natural.
- source_word: dispassionate
  choice: libre de pasiones
  rationale: Retiene la formulación filosófico-teológica antigua sin reinterpretarla como frialdad o indiferencia.
- source_word: scheme / design / purpose
  choice: plan / propósito / propósito
  rationale: La variación evita una repetición rígida, a la vez que mantiene la continuidad conceptual del designio divino.
- source_word: participation in His benefits
  choice: participar de sus beneficios
  rationale: Conserva la idea de participación, no solo la de recibir dones externos.
theological_decisions:
- issue: Referente de «antes de que él viniera»
  choice: Se conserva el pronombre «él» y se añade una nota sobre la posible referencia.
  alternative: Explicitar «antes de que Dios viniera» o «antes de que el Hijo viniera».
  rationale: El testimonio inglés no identifica de manera inequívoca al referente, y la revisión directa del griego está pendiente.
- issue: Medio de la revelación y visión de Dios
  choice: «se reveló mediante la fe, pues solo por ella se concede ver a Dios»
  alternative: «se revela a la fe» o «fue revelado por medio de la fe».
  rationale: Preserva la tensión entre la autorrevelación divina y la fe como único medio concedido para verlo.
- issue: Impasibilidad divina
  choice: «libre de pasiones»
  alternative: «impasible», «sereno» o «sin emociones».
  rationale: Evita identificar la antigua noción de impasibilidad con ausencia total de afecto, especialmente después de llamar a Dios bondadoso y amigo de la humanidad.
- issue: Contenido final visto y comprendido
  choice: «cosas» en el texto, con nota que registra la suplencia de «misterios».
  alternative: Incluir «misterios» directamente en el texto.
  rationale: El testimonio marca «mysteries» entre paréntesis como palabra suplida; «cosas» mantiene una lectura fluida sin presentar la suplencia como segura.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean oraciones claras, tono retórico firme y vocabulario accesible. Dado que la revisión del griego está pendiente y el material suministrado es un testimonio inglés de dominio público, las ambigüedades señaladas se conservaron o documentaron en notas en vez de resolverse de manera doctrinal.
