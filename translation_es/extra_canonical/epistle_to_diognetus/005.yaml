base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: es
  text: 'Los cristianos no se distinguen del resto de la humanidad ni por el lugar donde viven, ni por su idioma, ni por sus costumbres.


    No habitan en ciudades propias, ni emplean una lengua diferente, ni llevan una vida fuera de lo común.


    Tampoco siguen una enseñanza inventada por la inteligencia o el estudio de personas ingeniosas, ni defienden, como algunos, una doctrina meramente humana.


    Viven en ciudades griegas y bárbaras,[a] según le haya correspondido a cada uno, y siguen las costumbres locales en cuanto a la ropa, la comida y los demás aspectos de la vida. Sin embargo, la manera en que viven su ciudadanía es admirable y, como todos reconocen, contraria a lo esperado.


    Habitan en sus propios países, pero como residentes temporales. Participan en todo como ciudadanos, pero soportan toda clase de adversidades como extranjeros. Para ellos, toda tierra extranjera es patria, y toda patria es tierra extranjera.


    Se casan como todos y tienen hijos, pero no abandonan a los recién nacidos.[b]


    Comparten la mesa, pero no el lecho matrimonial.[c]


    Viven en la carne, pero no viven según la carne.[d]


    Pasan su vida en la tierra, pero su ciudadanía está en el cielo.


    Obedecen las leyes establecidas, pero con su propia vida van más allá de lo que las leyes exigen.


    Aman a todos, y todos los persiguen.


    No se los conoce, y aun así se los condena. Se les da muerte, y aun así reciben vida.


    Son pobres, pero enriquecen a muchos. Carecen de todo, pero tienen todo en abundancia.


    Son deshonrados, pero en medio de su deshonra reciben gloria. Se habla mal de ellos, pero queda demostrada su rectitud.


    Los maldicen, y ellos bendicen; los insultan, y ellos tratan a los demás con respeto.


    Hacen el bien, pero son castigados como malhechores. Cuando los castigan, se alegran como si con ello recibieran vida.


    Los judíos les hacen guerra como a extranjeros, y los griegos los persiguen;[e] sin embargo, quienes los odian no pueden explicar la razón de su hostilidad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En el uso grecorromano, «bárbaros» designaba a quienes no eran griegos por lengua y cultura; aquí funciona como categoría histórica, no como valoración moderna de inferioridad.
    reason: Evitar una lectura anacrónica y peyorativa del término.
  - marker: b
    text: La expresión alude a la práctica antigua de abandonar o exponer a niños recién nacidos, a menudo para que murieran.
    reason: Hacer explícito el referente histórico de una frase que podría parecer vaga.
  - marker: c
    text: Literalmente, el contraste es entre compartir la «mesa» y no compartir el «lecho».
    reason: Conservar el juego antitético y explicar la formulación matrimonial elegida.
  - marker: d
    text: '«Carne» tiene dos matices en la misma frase: primero, la existencia corporal; después, una manera de vivir moral o espiritualmente contrapuesta a ella. El texto no desarrolla aquí esa distinción.'
    reason: Preservar la ambigüedad teológica y evitar una paráfrasis denominacional.
  - marker: e
    text: «Judíos» y «griegos» son categorías polémicas propias del contexto antiguo del escrito. No deben aplicarse como acusación colectiva contra los judíos ni contra los griegos de épocas posteriores.
    reason: Situar históricamente la afirmación y prevenir su uso antijudío o étnico.
lexical_decisions:
- source_word: πολιτεία (reflejado en el testimonio como “constitution/citizenship”)
  choice: manera en que viven su ciudadanía
  rationale: Conserva la relación entre conducta comunitaria, condición cívica y pertenencia, sin reducir el término a una constitución política formal.
- source_word: βάρβαροι (reflejado como “barbarians”)
  choice: bárbaras
  rationale: Mantiene la categoría cultural antigua en contraste con “griegas”; la nota evita que se entienda como un juicio moderno sobre pueblos incivilizados.
- source_word: ῥίπτειν / “cast away”
  choice: abandonan a los recién nacidos
  rationale: Expresa en lenguaje natural la práctica antigua de exponer o desechar niños, sin suavizarla ni limitarla a un solo método.
- source_word: σάρξ / “flesh”
  choice: carne
  rationale: Conserva la repetición y la tensión teológica tradicional entre existir corporalmente y vivir “según la carne”.
- source_word: κοινὴ τράπεζα … οὐ κοίτη / “meals in common, but not wives”
  choice: Comparten la mesa, pero no el lecho matrimonial
  rationale: Reproduce el contraste conciso y aclara que se contrapone la hospitalidad o comida compartida a la promiscuidad sexual.
- source_word: ζωοποιεῖσθαι / “endued with life; quickened by life”
  choice: reciben vida
  rationale: Preserva la paradoja deliberada sin especificar si se refiere a vida espiritual, resurrección o vindicación.
theological_decisions:
- issue: Ciudadanía celestial y terrenal
  choice: “su ciudadanía está en el cielo”
  alternative: “son ciudadanos del cielo”
  rationale: La formulación elegida conserva el sustantivo abstracto y su paralelo con la ciudadanía visible, sin negar la existencia terrenal.
- issue: Vivir en la carne pero no según la carne
  choice: Mantener “carne” en ambas cláusulas
  alternative: Parafrasear la segunda como “no se dejan dominar por los deseos humanos”
  rationale: La paráfrasis resolvería una ambigüedad teológica que el texto deja abierta; la repetición conserva su tensión retórica.
- issue: Vida recibida en medio de la muerte y el castigo
  choice: “reciben vida” sin explicación doctrinal adicional
  alternative: “recibirán la vida eterna” o “resucitan”
  rationale: El pasaje no precisa el mecanismo ni el momento; no se importa una interpretación escatológica específica.
- issue: Afirmación universal “todos los persiguen”
  choice: Conservar la hipérbole universal
  alternative: “muchos los persiguen”
  rationale: La fuerza retórica del original testimoniado depende del paralelismo entre amar a todos y ser perseguidos por todos.
- issue: Judíos y griegos como perseguidores
  choice: Traducir las categorías históricas y añadir una nota contextual
  alternative: Sustituirlas por “no cristianos” o “paganos”
  rationale: Se preserva el lenguaje antiguo sin convertir una afirmación polémica situada en una acusación general contra comunidades actuales.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las frases breves, los paralelismos y las paradojas que estructuran el capítulo. Dado que el testimonio griego directo no fue aportado y la revisión de la lengua antigua sigue pendiente, el borrador se apoya de manera provisional en el testimonio inglés de dominio público y en correspondencias griegas conocidas del pasaje; requiere cotejo crítico posterior con las copias y ediciones del perdido Codex Argentoratensis.
