review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones puntuales para evitar añadidos interpretativos y reflejar con mayor precisión las antítesis del pasaje: en particular, «lecho matrimonial» especifica indebidamente el «lecho común», y «meramente humana» añade un matiz restrictivo ausente de «doctrina humana». La revisión conserva las paradojas, la hipérbole y las categorías históricas del testimonio.'
  naturalness: 'El español del borrador es mayormente claro, actual y apropiado. Se han ajustado algunas formulaciones para conservar el paralelismo sin perder naturalidad: «están en la carne» evita que la primera cláusula se confunda con el sentido ético de la segunda; «comparten la mesa, pero no el lecho» reproduce la concisión antitética.'
  terminology: Se mantiene «ciudadanía», «carne», «griegas y bárbaras», «doctrina humana» y «reciben vida». Las notas se han adaptado para que expliquen el trasfondo histórico o la ambigüedad sin afirmar más de lo que el texto dice.
  issues:
  - severity: medium
    issue: «lecho matrimonial» añade una calificación que no figura en el contraste textual.
    rationale: El texto contrapone una mesa común a un lecho común; «matrimonial» restringe e interpreta el referente. «Lecho» preserva la elipsis y la fuerza retórica.
  - severity: medium
    issue: «doctrina meramente humana» introduce «meramente».
    rationale: La fuente habla de una doctrina humana; el adverbio puede sugerir una valoración teológica adicional no expresada.
  - severity: low
    issue: «Viven en la carne» debilita el contraste semántico interno de «carne».
    rationale: La primera expresión se refiere a la condición corporal y la segunda a vivir «según la carne». «Están en la carne» distingue mejor ambos usos sin resolver la ambigüedad.
  - severity: low
    issue: La nota sobre mesa y lecho denomina «matrimonial» a lo que el texto no especifica.
    rationale: Debe explicar el contraste sin presentar como literal una precisión interpretativa.
