review_pass:
  verdict: revise
  source_fidelity: 'La estructura, los paralelismos y la mayor parte de las antítesis siguen fielmente el testimonio inglés y los términos griegos indicados. Sin embargo, algunas expansiones interpretativas reducen la precisión: «enseñanza inventada» sustituye la imagen de una invención o hallazgo; «meramente humana» añade un juicio no expresado; «lecho matrimonial» y «a los recién nacidos» restringen formulaciones más amplias del texto. «Reciben gloria» y «reciben vida» también atenúan pasivos que expresan ser glorificados/vivificados.'
  naturalness: El español es claro, actual y de registro digno. Se recomienda conservar una sintaxis más paralela y concisa en varias antítesis («en la carne», «en la tierra», «son vivificados») y evitar «según le haya correspondido», que resulta algo forzado en este contexto.
  terminology: «Ciudadanía», «carne», «griegos» y «bárbaros» están bien encaminados. Conviene traducir κοινὴ τράπεζα / κοίτη mediante el contraste formal «mesa en común / lecho en común», sin explicitar «matrimonial», y mantener «hijos» u «offspring» sin limitarlo en el cuerpo a recién nacidos. La nota histórica puede explicar la exposición infantil.
  issues:
  - severity: medium
    issue: Se añade «meramente» en «una doctrina meramente humana».
    rationale: El testimonio dice «any human dogma»; «meramente» intensifica y valora la oposición más allá de lo expresado.
  - severity: medium
    issue: «No abandonan a los recién nacidos» restringe «no cast away their offspring».
    rationale: La referencia histórica probablemente incluye la exposición de infantes, pero el texto conserva un término más general para descendencia/hijos; la precisión histórica debe quedar en nota.
  - severity: medium
    issue: «Comparten la mesa, pero no el lecho matrimonial» altera el contraste de lo común y añade «matrimonial».
    rationale: El contraste fuente es entre mesa/comida en común y lecho no común; «matrimonial» no está señalado por el testimonio y puede orientar indebidamente la lectura.
  - severity: low
    issue: «La manera en que viven su ciudadanía» es más explicativa que «la constitución/forma de su ciudadanía».
    rationale: La formulación propuesta es natural, pero pierde parcialmente el carácter de orden o régimen de vida que comunica πολιτεία.
  - severity: low
    issue: «Reciben gloria» y «reciben vida» debilitan los pasivos paradójicos.
    rationale: «Son glorificados» y «son vivificados» reproducen mejor la forma y el vigor retórico, sin definir el alcance teológico.
  revised_text: 'Los cristianos no se distinguen del resto de la humanidad ni por el lugar donde viven, ni por su lengua, ni por sus costumbres.


    No viven en ciudades propias, ni usan una lengua diferente, ni practican un modo de vida extraordinario.


    Tampoco poseen algún invento descubierto por la inteligencia o el estudio de personas ingeniosas, ni son maestros de alguna doctrina humana, como algunos lo son.


    Más bien, viven en ciudades de griegos y bárbaros,[a] según la suerte que a cada uno le haya correspondido, y siguen las costumbres locales en la ropa, la comida y los demás aspectos de la vida. Sin embargo, la forma de su ciudadanía que manifiestan es admirable y, como se reconoce, contraria a lo esperado.


    Viven en sus propios países, pero solo como residentes temporales; participan de todo como ciudadanos y soportan toda adversidad como extranjeros. Para ellos, toda tierra extranjera es patria, y toda patria es tierra extranjera.


    Se casan como todos y tienen hijos, pero no abandonan a sus hijos.[b]


    Tienen la mesa en común, pero no el lecho en común.[c]


    Están en la carne, pero no viven según la carne.[d]


    Su existencia está en la tierra, pero su ciudadanía está en el cielo.


    Obedecen las leyes establecidas, pero con su propia vida superan las leyes.


    Aman a todos, y todos los persiguen.


    No se los conoce, y aun así se los condena. Se les da muerte, y aun así son vivificados.


    Son pobres, pero enriquecen a muchos. Carecen de todo, pero abundan en todo.


    Son deshonrados, y aun en su deshonra son glorificados. Se habla mal de ellos, pero son vindicados.


    Los insultan, y ellos bendicen; los ultrajan, y ellos muestran respeto.


    Al hacer el bien, son castigados como malhechores; cuando son castigados, se alegran como si por ello fueran vivificados.


    Los judíos les hacen guerra como a extranjeros, y los griegos los persiguen;[e] sin embargo, quienes los odian no pueden explicar la razón de su hostilidad.'
  revised_footnotes:
  - marker: a
    text: En el uso grecorromano, «bárbaros» designaba en general a quienes no eran griegos por lengua y cultura. Aquí es una categoría histórica, no una valoración moderna de inferioridad.
    reason: Conserva el término histórico y previene una lectura anacrónica.
  - marker: b
    text: La frase alude probablemente a la exposición o abandono de hijos, especialmente de recién nacidos, una práctica conocida en la antigüedad.
    reason: Explica el trasfondo histórico sin restringir la expresión del texto.
  - marker: c
    text: El texto contrapone una «mesa en común» a un «lecho en común». La expresión rechaza la comunidad sexual, no la comida compartida.
    reason: Aclara el contraste sin añadir la calificación «matrimonial» al texto.
  - marker: d
    text: '«Carne» se repite con dos matices: primero, la existencia corporal; después, una manera de vivir contrapuesta a ella. El pasaje no precisa más esta distinción.'
    reason: Preserva la ambigüedad retórica y teológica sin imponer una interpretación denominacional.
  - marker: e
    text: «Judíos» y «griegos» son categorías polémicas propias del contexto antiguo del escrito. No deben usarse como acusación colectiva contra judíos o griegos de épocas posteriores.
    reason: Sitúa históricamente la afirmación y previene una aplicación antijudía o étnica.
  revision_rationale: La revisión restaura formulaciones más cercanas al testimonio y a las correspondencias griegas señaladas, especialmente en invención/doctrina, descendencia, mesa y lecho, pasivos de glorificación y vivificación, y el alcance de «superar las leyes». Mantiene un español latinoamericano neutral, el ritmo de las antítesis y las notas históricas necesarias. Dado que el contexto suministra un testimonio inglés y declara pendiente el cotejo directo con el griego y sus copias, la revisión sigue siendo provisional en el plano crítico-textual.
