  footnotes:
  - marker: a
    text: El testimonio señalado presenta aquí un espacio vacío o una laguna después de esta oración. Las palabras entre corchetes en el pasaje indican restauraciones editoriales o texto incierto.
    reason: Hace visible la señal «[]» del testimonio de una manera legible y explica también la función de los corchetes conservados.
lexical_decisions:
- source_word: knew
  choice: conoció / [conocer]
  rationale: Conserva el eufemismo sexual bíblico y la repetición del testimonio, sin reemplazarlo por una explicación interpretativa.
- source_word: fleshly
  choice: carnal
  rationale: Mantiene la caracterización explícita de Caín y su posible carga antropológica, sin reducirla simplemente a «humano» o «corporal».
- source_word: keeper
  choice: guardián
  rationale: Es natural en español latinoamericano y conserva la idea de custodia y responsabilidad.
- source_word: female counterpart
  choice: contraparte femenina
  rationale: Preserva la formulación distintiva del testimonio en vez de normalizarla como «mujer» o «esposa».
- source_word: forces
  choice: potestades
  rationale: En este contexto cosmológico designa poderes personales o supramundanos; «potestades» conserva esa resonancia mejor que el genérico «fuerzas».
- source_word: defile
  choice: profanaron
  rationale: Conserva la dimensión de violación de pureza sin especificar de manera indebida si se trata exclusivamente de contaminación sexual.
- source_word: progress
  choice: progresar
  rationale: Mantiene la afirmación del testimonio sin interpretarla más estrechamente como crecimiento numérico, civilización o maduración espiritual.
theological_decisions:
- issue: Identidad del referente llamado «Dios»
  choice: Dios
  alternative: el dios / una designación cosmológica interpretada
  rationale: El pasaje suministrado usa «God»; se mantiene la designación sin resolver su identidad dentro de la cosmología más amplia de la obra.
- issue: Carácter de la sanción séptuple
  choice: «desatará siete venganzas»
  alternative: «será vengado siete veces»
  rationale: La sintaxis del testimonio hace que quien mate a Caín desencadene las venganzas. Se conserva esa formulación inusual sin armonizarla automáticamente con Génesis.
- issue: Medio del nacimiento atribuido a Dios
  choice: «Por medio de Dios»
  alternative: «con la ayuda de Dios» o «de parte de Dios»
  rationale: «Por medio de» mantiene abierta la relación instrumental o mediadora expresada por el testimonio.
- issue: Naturaleza de las «potestades»
  choice: No se identifica ni explica en el cuerpo del texto
  alternative: arcontes, demonios o gobernantes
  rationale: La equivalencia exacta requiere revisión del copto y del contexto; no se importa una identificación doctrinal más específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron las repeticiones, los giros deliberadamente extraños y todos los segmentos restaurados entre corchetes. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi II,4.
