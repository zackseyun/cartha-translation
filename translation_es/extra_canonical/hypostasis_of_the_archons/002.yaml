translation:
  language: es
  text: 'Su jefe es ciego. [A causa de su] poder, ignorancia y orgullo, declaró con su [poder]: «Yo soy Dios; no hay ningún otro [fuera de mí]».[a]


    Cuando dijo esto, pecó contra [el Todo]. Esta jactancia ascendió hasta la Incorruptibilidad, [][b] y desde la Incorruptibilidad respondió una voz que dijo: «Estás equivocado, Samael» —nombre que significa «dios ciego»—, pues sus pensamientos eran ciegos. Descargó su poder, es decir, la blasfemia que había pronunciado, y la siguió hacia abajo, hasta el Caos y hasta su madre, el Abismo, impulsado por Pistis Sophia. Ella estableció a cada uno de sus descendientes de acuerdo con su poder, conforme a la semejanza de los elevados eones eternos, porque lo visible tuvo su origen en lo invisible.


    La Incorruptibilidad miró hacia abajo, al lugar de las aguas. Su imagen apareció reflejada sobre las aguas, y las autoridades de la oscuridad se enamoraron de ella. Sin embargo, no pudieron aferrarse a la imagen que se les había aparecido sobre las aguas, porque eran débiles. Lo que pertenece meramente al alma no puede aferrarse a lo espiritual, pues las autoridades tuvieron su origen abajo, mientras que la imagen de la Incorruptibilidad tuvo su origen arriba.[c]


    Por eso, la Incorruptibilidad miró hacia abajo, hacia aquel lugar, a fin de que, por la voluntad del Padre, pudiera unirlos a todos con la luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes dentro del pasaje señalan palabras suplidas o reconstruidas en el testimonio de traducción utilizado.
    reason: Distingue las reconstrucciones editoriales del texto transmitido sin borrarlas.
  - marker: b
    text: Los corchetes vacíos señalan una laguna del manuscrito o un punto donde el texto no puede recuperarse en el testimonio utilizado.
    reason: Preserva de manera visible la discontinuidad textual indicada por la fuente.
  - marker: c
    text: «Lo que pertenece meramente al alma» traduce una categoría intermedia que el pasaje contrapone a «lo espiritual»; no significa simplemente «lo emocional» o «lo psicológico» en el sentido moderno.
    reason: Aclara un término antropológico y cosmológico susceptible de malentenderse en español actual.
lexical_decisions:
- source_word: indestructability
  choice: la Incorruptibilidad
  rationale: Se emplea como realidad personificada y femenina. «Incorruptibilidad» expresa mejor la cualidad trascendente que «indestructibilidad» y corresponde al uso habitual del término en este contexto antiguo, aunque la revisión directa del copto sigue pendiente.
- source_word: the All
  choice: el Todo
  rationale: Conserva el sentido técnico y totalizante, así como la personificación implícita, sin identificarlo con una formulación doctrinal posterior.
- source_word: authorities
  choice: autoridades
  rationale: Mantiene el título cosmológico de los poderes gobernantes sin sustituirlo sistemáticamente por «arcontes», término más especializado que no aparece en este pasaje del testimonio suministrado.
- source_word: merely soulish
  choice: lo que pertenece meramente al alma
  rationale: Evita el moderno sentido psicológico de «psíquico» y conserva el contraste antiguo entre lo anímico y lo espiritual.
- source_word: aeons
  choice: eones
  rationale: Retiene el término cosmológico técnico en una forma asentada y comprensible en español.
- source_word: Pistis Sophia
  choice: Pistis Sophia
  rationale: Se conserva como nombre propio técnico, sin resolverlo interpretativamente como «Fe Sabiduría» o «Sabiduría fiel».
- source_word: vented his power
  choice: descargó su poder
  rationale: Reproduce el movimiento expresado por el testimonio inglés sin precisar más de lo que permite la base provisional.
theological_decisions:
- issue: La afirmación de exclusividad divina pronunciada por el jefe ciego
  choice: Se presenta como jactancia y blasfemia dentro de la cosmología propia del escrito.
  alternative: Armonizarla explícitamente con declaraciones bíblicas monoteístas o identificar al personaje con una figura doctrinal posterior.
  rationale: La traducción debe conservar la tensión polémica del texto sin importar interpretaciones confesionales externas.
- issue: Relación entre lo anímico y lo espiritual
  choice: Se mantiene la incapacidad de lo meramente anímico para aferrarse a lo espiritual.
  alternative: Reformularla como una oposición moral entre personas carnales y personas espirituales.
  rationale: El pasaje formula una distinción cosmológica y ontológica; una aplicación moral resolvería indebidamente su sentido.
- issue: Acción final de la Incorruptibilidad
  choice: «unirlos a todos con la luz»
  alternative: «llevarlos a todos a la luz» o «reconciliarlos con la luz».
  rationale: La opción elegida conserva el verbo relacional del testimonio y no especifica si se trata de iluminación, salvación o restauración.
- issue: Referente de «su poder» en la organización de los descendientes
  choice: 'Se conserva el posesivo ambiguo: «de acuerdo con su poder».'
  alternative: Precisar «de acuerdo con el poder de cada uno» o «de acuerdo con el poder de ella».
  rationale: La base suministrada no permite fijar con seguridad el referente; explicitarlo eliminaría una ambigüedad genuina.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres y términos cosmológicos técnicos indispensables —Samael, Pistis Sophia, Caos, Abismo y eones—, con mayúsculas para las realidades personificadas. La redacción sigue provisionalmente el testimonio inglés de dominio público proporcionado; hace falta cotejo directo con el copto del Códice II,4 de Nag Hammadi. Se mantuvieron las reconstrucciones entre corchetes y la laguna vacía.
