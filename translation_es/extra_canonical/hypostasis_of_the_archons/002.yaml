id: HARCH.002
reference: Hypostasis of the Archons — Samael, the “Blind God”
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'Their leader is blind. [On account of his] power, ignorance, and pride, he declared in his [power]: “I am God; there is no other [except me].”


    When he uttered this, he sinned against [the All]. This bragging ascended to indestructability, [] and a voice responded from indestructability, and said: “You are in error, Samael,” which means “blind god,” his thoughts being blind. He vented his power, namely, the blasphemy he had uttered, and he followed it down into Chaos and to his mother, the Abyss, prompted by Pistis Sophia. She set up each one of his offspring in agreement with its power, according to the likeness of the lofty eternal aeons, because what is seen originated from what is unseen.


    Indestructability peered downward into the place of the waters. Her image appeared as a reflection on the waters, and the authorities of darkness grew enamored with her. They, however, were unable to hold onto the image that had appeared to them on the waters, because they were feeble. And what is merely soulish is unable to hold onto what is spiritual, because the authorities originated from below, while the image of indestructability originated from above.


    Consequently, indestructability peered downward into that place, in order that by the will of the Father she could unite all of them with the light.'
