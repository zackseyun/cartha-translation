base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: es
  text: 'Los arcontes conspiraron entre sí y dijeron: «Vengan, provoquemos con nuestras propias manos un diluvio y exterminemos a todo ser de carne, tanto a los seres humanos como a las bestias».


    Cuando el arconte de las fuerzas se enteró de su plan, dijo a Noé: «Hazte un arca de madera que no se pudra y escóndete en ella, tú junto con tus hijos, las bestias y las aves del cielo, tanto pequeñas como grandes; asiéntala sobre el monte Sir».


    Entonces Orea[a] se acercó a Noé, deseosa de subir al arca. Cuando él se negó, ella sopló sobre el arca, y esta fue consumida por el fuego. Así que él hizo un arca por segunda vez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado presenta el nombre «Orea» seguido de la señal editorial «[3]». Aquí se conserva el nombre y se adapta esa señal al sistema de notas de esta edición. La revisión directa del copto está pendiente.
    reason: Documentar la señal editorial del testimonio y la condición provisional de la forma del nombre sin insertar un número inexplicado en el texto.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Conserva el término técnico tradicional para estas figuras del escrito, en vez de reducirlo al sentido político más general de «gobernantes».
- source_word: all flesh
  choice: todo ser de carne
  rationale: Mantiene la expresión colectiva y su resonancia con el relato antiguo del diluvio, mientras la aclaración siguiente especifica seres humanos y bestias.
- source_word: wood that does not rot
  choice: madera que no se pudra
  rationale: Traducción natural que conserva la cualidad práctica expresada por el testimonio, sin convertirla en la noción teológica más amplia de incorruptibilidad.
- source_word: forces
  choice: fuerzas
  rationale: Sigue de cerca el testimonio disponible y evita precisar «potestades» u otra categoría jerárquica sin una revisión directa del copto.
- source_word: devoured by fire
  choice: consumida por el fuego
  rationale: Expresa de manera idiomática la destrucción completa del arca por el fuego sin atenuar la imagen.
theological_decisions:
- issue: La relación entre el arconte de las fuerzas y los demás arcontes
  choice: Se conserva que conoce el plan y advierte a Noé, sin explicar sus motivos ni presentarlo explícitamente como aliado o adversario de los demás.
  alternative: Identificarlo como una figura benévola, como el jefe de los arcontes o como uno de los conspiradores.
  rationale: El pasaje suministrado deja sin resolver su identidad precisa, su posición y sus motivos; la traducción preserva esa tensión.
- issue: La negativa de Noé a Orea
  choice: «Cuando él se negó»
  alternative: «Cuando él se negó a dejarla entrar» o «cuando la rechazó».
  rationale: La formulación conserva la indeterminación del testimonio acerca de la forma y el alcance exactos de la negativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «arcontes» como término técnico propio de la obra, y se mantiene una sintaxis narrativa clara. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi II,4.
