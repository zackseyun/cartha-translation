  source_fidelity: 'El borrador sigue fielmente el testimonio inglés disponible: conserva la conspiración de los arcontes, el diluvio, la advertencia a Noé, la madera que no se pudre, el monte Sir, la llegada de Orea y la destrucción del arca por fuego. No obstante, «todo ser de carne» convierte la expresión colectiva «all flesh» en una formulación menos directa y menos natural que «toda carne». Dado que la revisión directa del copto sigue pendiente, la valoración de lengua fuente es necesariamente provisional y se limita al testimonio inglés suministrado.'
  naturalness: El español es en general claro, moderno y adecuado para un registro narrativo digno. «Toda carne» es a la vez una expresión establecida y comprensible en español, y preserva mejor la concisión del original que «todo ser de carne». El resto de la redacción, incluido «arcontes», «arca», «se negó» y «fue consumida por el fuego», resulta natural en el contexto.
  terminology: «Arcontes» conserva apropiadamente el término técnico. «Arconte de las fuerzas» reproduce sin sobreinterpretar la designación disponible. «Toda carne» mantiene el giro tradicional y colectivo sin imponer una lectura doctrinal. Se conservan «Orea» y «Sir» tal como aparecen en el testimonio, con nota que identifica el carácter provisional de la señal editorial asociada al nombre.
