review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés disponible y conserva correctamente las ambigüedades narrativas principales. Sin embargo, «todo ser de carne» desplaza la fórmula colectiva «all flesh»; «toda carne» es más fiel y natural en este registro. Además, «Cuando él se negó» queda sintácticamente incompleto en español, aunque el original no explicita el objeto preciso de la negativa.
  naturalness: El registro es claro, moderno y adecuado para español latinoamericano. «Colócala sobre el monte Sir» resulta más idiomático y transparente que «asiéntala», sin cambiar el sentido provisional de «settling it».
  terminology: «Arcontes», «arca», «fuerzas», «Noé», «Orea» y «monte Sir» son elecciones apropiadas y prudentes. Se conserva «toda carne» como fórmula tradicional y colectiva, seguida por la especificación de seres humanos y bestias.
  issues:
  - severity: medium
    issue: «todo ser de carne» para “all flesh”
    rationale: 'La expresión inglesa, y la fórmula tradicional subyacente, es colectiva: «toda carne». «Todo ser de carne» individualiza y modifica levemente el alcance estilístico de la fórmula.'
  - severity: medium
    issue: «Cuando él se negó»
    rationale: En español, «negarse» normalmente requiere complemento («a ello», «a dejarla entrar»). Añadir «a ello» resuelve la construcción sin precisar aquello a lo que Noé se negó.
  - severity: low
    issue: «asiéntala sobre el monte Sir»
    rationale: Aunque comprensible, «asentar» suena menos natural aquí. «Colócala» comunica con claridad la acción de situar el arca, conforme al testimonio inglés provisional.
  revised_text: 'Los arcontes conspiraron entre sí y dijeron: «Vengan, provoquemos con nuestras propias manos un diluvio y exterminemos a toda carne, seres humanos y bestias».


    Cuando el arconte de las fuerzas se enteró de su plan, dijo a Noé: «Hazte un arca de madera que no se pudra y escóndete en ella, tú junto con tus hijos, las bestias y las aves del cielo, tanto pequeñas como grandes; colócala sobre el monte Sir».


    Entonces Orea[a] se acercó a Noé, deseosa de subir al arca. Cuando él se negó a ello, ella sopló sobre el arca, y esta fue consumida por el fuego. Así que él hizo un arca por segunda vez.'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés suministrado presenta el nombre «Orea» seguido de la señal editorial «[3]». Aquí se conserva el nombre y se adapta esa señal al sistema de notas de esta edición. La revisión directa del copto está pendiente.
    reason: Documentar la señal editorial del testimonio y la condición provisional de la forma del nombre sin insertar un número inexplicado en el texto.
  revision_rationale: 'Se realizan correcciones limitadas de fidelidad y gramática: «toda carne» conserva la fórmula colectiva del testimonio; «a ello» mantiene indeterminado el contenido de la negativa de Noé; y «colócala» mejora la naturalidad sin resolver de manera interpretativa el pasaje. La nota conserva y explica la señal editorial [3] del testimonio inglés.'
