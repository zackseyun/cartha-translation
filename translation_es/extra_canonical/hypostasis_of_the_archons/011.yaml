review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés suministrado (la revisión directa del copto sigue pendiente). Sin embargo, «[a]» introduce una restitución inexistente donde el testimonio conserva una laguna vacía, y «había repudiado» altera el aspecto de «whom he reviled».
  naturalness: El español es en general claro y de registro adecuado. Se mejoran algunas construcciones calcadas o menos naturales, como «condenó a juicio», «lo pusieron sobre» y la alternancia no justificada entre el destinatario plural («ustedes») y singular («te»).
  terminology: 'Se mantienen las formas técnicas y nombres elegidos: Sabaot, Yaldabaot, Sofía, Zoé, Materia, arcontes y «Dios de los ejércitos». «Autócrata» se normaliza a minúscula, conforme al uso no capitalizado del testimonio, sin prejuzgar si funciona como título o nombre.'
  issues:
  - severity: high
    issue: La laguna textual vacía [] fue sustituida por la inserción [a].
    rationale: Los corchetes vacíos del testimonio representan texto perdido; [a] parece una restitución de una letra, pero no está respaldada por la fuente y debe retirarse. La nota debe anclarse a la laguna misma.
  - severity: medium
    issue: «a quien había repudiado» no reproduce con precisión «whom he reviled».
    rationale: «Reviled» expresa injuriar, insultar o denigrar; el pluscuamperfecto y «repudiar» añaden una acción y una relación temporal no presentes en el testimonio.
  - severity: low
    issue: Inconsistencia de persona en «Antes de que ustedes existieran» / «te he instruido».
    rationale: El testimonio se dirige a un «you» singular en el cierre; conviene mantener el singular en todo el pasaje.
  revised_text: 'Cuando Sabaot, hijo de Yaldabaot, presenció el poder de aquel ángel, se arrepintió y sentenció a juicio a su padre y a la Materia, su madre, a quien injuriaba.


    Y entonó cantos de alabanza a Sofía de arriba y a su hija Zoé. Sofía y Zoé lo elevaron y lo nombraron sobre el séptimo cielo, debajo del velo que divide las regiones superiores de las inferiores. Se le llama «Dios de los ejércitos, Sabaot» porque está sobre los ejércitos del caos, pues Sofía lo nombró.


    Después de que estos acontecimientos tuvieron lugar, Sabaot se hizo un enorme carro de querubines con cuatro rostros, una infinidad de ángeles para que fueran sus servidores, así como arpas y liras.


    Sofía trajo a su hija Zoé y la hizo sentarse a su derecha para que lo instruyera acerca de las cosas del octavo cielo. Y colocó al ángel de la ira a su izquierda.


    [Desde] aquel día en adelante, [su derecha] fue llamada «vida», [] mientras que la izquierda llegó a simbolizar la injusticia de la región superior del autócrata. Antes de que existieras, estos acontecimientos habían tenido lugar.


    Cuando Yaldabaot vio a Sabaot en tan gran majestad y tan altamente exaltado, sintió envidia de él, y su envidia se convirtió en una entidad andrógina. Así se originó la Envidia, que dio a luz a la Muerte. La Muerte dio a luz descendientes y puso a cada uno a cargo de su propio cielo. Todos los cielos del caos se llenaron de sus multitudes.


    Sin embargo, todos estos acontecimientos tuvieron lugar por voluntad del Padre del Todo, conforme al modelo de todo cuanto está arriba, a fin de que se lograra la consumación del caos.


    He aquí, te he instruido acerca del molde de los arcontes, de la materia en la que se manifestó, así como de su progenitor y de su mundo.'
  revised_footnotes:
  - marker: '[]'
    text: El manuscrito presenta aquí una laguna después de «vida»; no puede determinarse con seguridad qué decía el texto perdido.
