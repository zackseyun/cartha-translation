  revision_rationale: La revisión conserva la estructura, cosmología y ambigüedades del testimonio inglés provisional. Corrige la representación de la laguna, evita ampliaciones semánticas en «reviled», mantiene el tratamiento singular del destinatario y pule construcciones para un español latinoamericano natural sin imponer interpretación doctrinal. Los marcadores de página [7] y [8] permanecen omitidos, pues no son notas textuales.
