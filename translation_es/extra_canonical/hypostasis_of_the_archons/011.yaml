base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: es
  text: 'Cuando Sabaot, hijo de Yaldabaot, presenció el poder de aquel ángel, se arrepintió y condenó a juicio a su padre y a la Materia, su madre, a quien había repudiado.


    Y entonó cantos de alabanza a Sofía, la de arriba, y a su hija Zoé. Sofía y Zoé lo elevaron y lo pusieron sobre el séptimo cielo, debajo del velo que divide las regiones superiores de las inferiores. Se le llama «Dios de los ejércitos, Sabaot» porque está sobre los ejércitos del caos, pues Sofía lo puso allí.


    Después de estos acontecimientos, Sabaot se hizo un enorme carro de querubines con cuatro rostros, una infinidad de ángeles para que fueran sus servidores, y también arpas y liras.


    Sofía trajo a su hija Zoé, la hizo sentarse a la derecha de él y le encargó instruirlo acerca de las realidades del octavo cielo. Y colocó al ángel de la ira a su izquierda.


    [Desde] aquel día, [su derecha] fue llamada «vida»; [a] mientras que la izquierda llegó a representar la injusticia de la región superior del Autócrata. Antes de que ustedes existieran, ya habían sucedido estos acontecimientos.


    Cuando Yaldabaot vio a Sabaot revestido de tan gran majestad y elevado a tal altura, sintió envidia de él, y su envidia se convirtió en una entidad andrógina. Así se originó la Envidia, que dio a luz a la Muerte. La Muerte dio a luz descendientes y puso a cada uno al frente de su propio cielo. Y todos los cielos del caos se llenaron con sus multitudes.


    Sin embargo, todos estos acontecimientos sucedieron por voluntad del Padre del Todo, conforme al modelo de todo cuanto está arriba, a fin de que se alcanzara la consumación del caos.


    Mira, te he instruido acerca del molde de los arcontes, de la materia en la que se manifestó, así como de su progenitor y de su mundo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito presenta aquí una laguna después de «vida»; no puede determinarse con seguridad qué decía el texto perdido.
    reason: Se conserva de manera visible el daño textual indicado por los corchetes vacíos del testimonio, pero se expresa mediante una nota comprensible para el lector.
lexical_decisions:
- source_word: Sabaoth / Yaldabaoth
  choice: Sabaot / Yaldabaot
  rationale: Se transliteran los nombres en una forma natural y reconocible en español, sin identificarlos ni armonizarlos más allá del testimonio suministrado.
- source_word: Sophia / Zoe
  choice: Sofía / Zoé
  rationale: Se conservan como nombres propios con las formas españolas habituales; su sentido etimológico no sustituye al nombre.
- source_word: God of hosts
  choice: Dios de los ejércitos
  rationale: Expresa el sentido tradicional de «hosts» y mantiene el juego explicativo con los ejércitos del caos.
- source_word: Matter
  choice: la Materia
  rationale: La mayúscula preserva su carácter personificado y materno en el pasaje.
- source_word: archons
  choice: arcontes
  rationale: Término técnico asentado para las potestades gobernantes de este texto; evita imponer la equivalencia más general «gobernantes».
- source_word: autocrat
  choice: Autócrata
  rationale: Conserva el título técnico y peyorativo de la figura soberana del ámbito inferior.
- source_word: mold
  choice: molde
  rationale: Mantiene la imagen material del testimonio sin interpretarla como mera «forma» o «naturaleza».
- source_word: summation
  choice: consumación
  rationale: Comunica una culminación o cumplimiento total, aunque el sentido preciso del término subyacente requiere revisión del copto.
theological_decisions:
- issue: El arrepentimiento de Sabaot y el juicio de sus progenitores
  choice: 'Se conserva literalmente la tensión narrativa: Sabaot se arrepiente y condena a juicio a su padre y a la Materia, su madre.'
  alternative: Explicar el arrepentimiento como conversión o presentar a la Materia como principio metafísico impersonal.
  rationale: El testimonio personifica a la Materia y no define aquí la naturaleza exacta del arrepentimiento.
- issue: Jerarquía de los cielos y función de Sofía
  choice: Se presenta a Sofía como quien eleva y designa a Sabaot, sin sistematizar la cosmología.
  alternative: Identificar explícitamente el séptimo u octavo cielo con categorías de otra tradición.
  rationale: Así se preserva la cosmología propia y la ambigüedad del fragmento.
- issue: Voluntad del Padre del Todo y consumación del caos
  choice: Se mantiene que todos los acontecimientos suceden por su voluntad y conforme al modelo superior.
  alternative: Atenuar «voluntad» a permiso o interpretar la consumación como destrucción definitiva.
  rationale: El pasaje afirma una relación fuerte con la voluntad del Padre, pero no explica su mecanismo ni define aquí el resultado de la consumación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice II,4 de Nag Hammadi. Se conservaron las restauraciones entre corchetes y la laguna se señaló con nota; se omitieron los números [7] y [8], que son marcadores de página y no notas del texto.
