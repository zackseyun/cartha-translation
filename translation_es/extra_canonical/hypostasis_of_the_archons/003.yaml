  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: es
  text: 'Los arcontes[a] conspiraron y dijeron: «Vengan, creemos un hombre que sea suelo de la tierra».


    Modelaron su creación como un ser enteramente terrenal.


    Los arcontes tienen cuerpos que son tanto femeninos [como masculinos], y sus rostros son rostros de bestias. Tomaron [suelo] de la tierra y modelaron [a su hombre] conforme a sus propios cuerpos y [conforme a la imagen] de Dios que se les había aparecido sobre el agua.


    Dijeron: «[Vengan], apoderémonos de la imagen por medio de la forma que hemos modelado, [para que] la imagen contemple a su contraparte masculina [y se enamore de ella], [], y para que podamos atraparla en la forma que hemos modelado». Como carecían de poder, no comprendieron el poder de Dios.


    Él sopló en el rostro del hombre, y el hombre llegó a tener alma; sin embargo, permaneció en el suelo durante varios días. Como carecían de poder, los arcontes no pudieron hacer que se levantara. Siguieron soplando como vientos tempestuosos, tratando de apoderarse de la imagen que se les había aparecido sobre las aguas, pero no conocían su poder.


    Todos estos acontecimientos sucedieron por voluntad del Padre del Todo.[b]


    Después, el Espíritu contempló al hombre anímico[c] que estaba en el suelo. El Espíritu salió de la Tierra Adámica.[d] Descendió y fijó su morada dentro de él; entonces aquel hombre se convirtió en alma viviente. El Espíritu lo llamó Adán porque fue hallado moviéndose sobre el suelo.


    Una voz procedente de lo indestructible[e] salió para ayudar a Adán. Los arcontes reunieron a todos los animales de la tierra y a todas las aves del cielo, y los llevaron ante Adán para saber cómo los llamaría, a fin de que pusiera nombre a todas las aves y a todos los animales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Arcontes» significa literalmente «gobernantes» y aquí designa a las potestades que modelan al ser humano.
    reason: Aclara un término técnico poco común sin sustituirlo por una interpretación.
  - marker: b
    text: «El Todo» es una expresión cosmológica del escrito; el texto no explica aquí cómo la voluntad del Padre se relaciona con las acciones de los arcontes.
    reason: Preserva una tensión teológica genuina y evita resolverla en la traducción.
  - marker: c
    text: «Anímico» traduce una expresión que caracteriza al hombre por el alma, antes de que el Espíritu haga morada en él.
    reason: El término es inusual en español corriente, pero necesario para mantener la secuencia antropológica del pasaje.
  - marker: d
    text: «Tierra Adámica» parece ser una designación propia o técnica. Su sentido exacto requiere revisión directa del copto.
    reason: Advierte sobre una expresión incierta dada la base documental disponible.
  - marker: e
    text: También podría traducirse «la indestructibilidad». El texto presenta de manera abstracta el ámbito o realidad de donde procede la voz.
    reason: Señala una alternativa legítima sin personalizar indebidamente la expresión.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término tradicional para las potestades gobernantes de este escrito; «gobernantes» perdería parte de su valor técnico en el contexto cosmológico.
- source_word: soil of the earth / ground
  choice: suelo de la tierra / suelo
  rationale: Mantiene la insistente relación entre el ser humano, la tierra y el nombre Adán, sin uniformar todas las expresiones más allá de la evidencia disponible.
- source_word: soulish man
  choice: hombre anímico
  rationale: Conserva la distinción conceptual entre el hombre que ya posee alma y la posterior entrada del Espíritu; «hombre con alma» sería más natural, pero debilitaría ese contraste.
- source_word: Adamic Land
  choice: Tierra Adámica
  rationale: Traducción formal de una designación cosmológica posiblemente técnica, sin identificarla de manera interpretativa con la tierra ordinaria.
- source_word: indestructibility
  choice: lo indestructible
  rationale: Conserva la abstracción sustantivada y evita convertirla sin apoyo suficiente en un lugar, ser o título personal específico.
- source_word: Father of the All
  choice: Padre del Todo
  rationale: Retiene la fórmula cosmológica como título y no la normaliza a expresiones bíblicas más habituales.
theological_decisions:
- issue: Identidad del sujeto que sopla en el rostro del hombre
  choice: «Él sopló», sin identificar al sujeto
  alternative: «Uno de ellos sopló» o «el gobernante sopló»
  rationale: El testimonio proporcionado cambia abruptamente al singular y no identifica expresamente al agente; la traducción conserva esa ambigüedad.
- issue: Relación entre alma y Espíritu
  choice: Se diferencia entre «llegó a tener alma», «hombre anímico» y la morada posterior del Espíritu
  alternative: Usar «espiritual» o tratar alma y Espíritu como equivalentes
  rationale: El pasaje establece una secuencia y un contraste propios; no deben armonizarse con una antropología doctrinal externa.
- issue: Voluntad del Padre del Todo y acciones de los arcontes
  choice: Se afirma sin explicación que todo sucedió por voluntad del Padre del Todo
  alternative: Interpretar la voluntad como permiso, decreto o causalidad directa
  rationale: El texto deja sin resolver la tensión entre la impotencia de los arcontes y la voluntad del Padre.
- issue: Lenguaje sexual de la imagen y la contraparte masculina
  choice: Se conserva literalmente «contraparte masculina» y «se enamore de ella»
  alternative: Neutralizarlo como simple semejanza o atracción
  rationale: La imaginería sexual y el referente ambiguo de los pronombres forman parte del argumento del pasaje y no deben suavizarse.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron los corchetes del testimonio: indican restauraciones editoriales, y el par vacío «[]» señala una laguna o texto perdido. La redacción se basa provisionalmente en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,4. Se mantuvieron deliberadamente el singular ambiguo «Él», la terminología cosmológica y la tensión entre alma y Espíritu.'
