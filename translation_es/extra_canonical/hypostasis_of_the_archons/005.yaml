translation:
  language: es
  text: 'Entonces la naturaleza espiritual femenina llegó bajo la apariencia de la serpiente, la instructora. La serpiente instruyó a Adán y Eva y les dijo: «¿Qué les [dijo] Samael? ¿Acaso les dijo: “Pueden comer de todos los árboles del jardín, pero no coman del [árbol] del conocimiento del bien y del mal”?»


    [a] La mujer carnal dijo: «No solo dijo: “No coman”, sino también: “No lo toquen, porque el día en que coman de él, ciertamente morirán”».


    La serpiente, la instructora, dijo: «Ciertamente no morirán, pues les dijo esto movido por los celos. Al contrario, se les abrirán los ojos y llegarán a ser como dioses,[b] conociendo el bien y el mal». Entonces la naturaleza femenina instructora se apartó de la serpiente y la abandonó como si fuera algo terrenal.


    La mujer carnal tomó del árbol y comió. También dio a su esposo, y así comieron aquellos seres que eran meramente anímicos.[c] Su deficiencia quedó al descubierto por su falta de conocimiento. Se dieron cuenta de que habían sido despojados de lo espiritual, así que tomaron hojas de higuera y se las sujetaron alrededor de sus lomos desnudos.


    Como ignoraba lo que había sucedido, el jefe de los arcontes llegó y dijo: «Adán, ¿dónde estás?».


    Adán respondió: «Oí tu voz y tuve miedo porque estaba desnudo; por eso me escondí».


    El arconte dijo: «¿Por qué te escondiste, si no es porque comiste del único árbol del que te prohibí comer? ¡Comiste de él!».


    Adán respondió: «La mujer que me diste me [entregó] el fruto, y yo comí».


    Entonces el [arconte] arrogante maldijo a la mujer.


    La mujer dijo: «La serpiente me engañó, y por eso comí».


    [Los arcontes se volvieron] hacia la serpiente y maldijeron su sombra, [haciendo que] se debilitara.


    No sabían que aquella era la misma figura que ellos habían modelado. Desde entonces, la serpiente quedó bajo la maldición de las autoridades, que duraría [d] hasta que viniera el Hombre Perfecto.[e]


    Luego se volvieron hacia el Adán que les pertenecía y lo expulsaron del jardín junto con su esposa. No poseían bendición alguna, porque ellos también estaban bajo la maldición.


    Arrojaron a la humanidad en una enorme confusión y en una vida de trabajo, para que la humanidad que les pertenecía estuviera preocupada por los asuntos del mundo y no tuviera tiempo de ocuparse del Espíritu santo.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio señala aquí una laguna o daño del manuscrito antes de las palabras de la mujer.
    reason: Preservar la señal textual representada por corchetes vacíos sin dejar un signo incomprensible dentro del cuerpo.
  - marker: b
    text: También podría entenderse «como seres divinos»; el testimonio traducido presenta una forma plural.
    reason: Conservar una ambigüedad teológicamente relevante sin reemplazar el plural por «Dios».
  - marker: c
    text: «Anímicos» traduce una categoría que contrasta aquí con «espiritual» y «carnal».
    reason: Aclarar un término técnico poco común necesario para preservar la antropología del pasaje.
  - marker: d
    text: Hay una laguna o daño en el manuscrito después de «que duraría»; se desconoce el texto perdido.
    reason: Representar el vacío indicado en el testimonio fuente.
  - marker: e
    text: «Hombre Perfecto» funciona como título; el fragmento no identifica expresamente aquí a esta figura.
    reason: Evitar una identificación doctrinal añadida.
  - marker: f
    text: La expresión también puede verterse «espíritu santo» si se entiende de manera cualitativa; el contexto inmediato no resuelve por completo la cuestión.
    reason: Preservar la ambigüedad entre título o nombre personal y cualidad espiritual.
lexical_decisions:
- source_word: female spiritual nature
  choice: naturaleza espiritual femenina
  rationale: Conserva la personificación femenina y la categoría ontológica del testimonio sin identificarla con Eva.
- source_word: teacher / teaching nature
  choice: la instructora / naturaleza femenina instructora
  rationale: «Instructora» expresa la función de impartir conocimiento y permite mantener la relación léxica entre ambas frases con naturalidad.
- source_word: fleshly woman
  choice: mujer carnal
  rationale: Preserva el contraste explícito entre lo carnal y lo espiritual propio del pasaje.
- source_word: merely soulish
  choice: meramente anímicos
  rationale: «Anímicos» mantiene la categoría antropológica intermedia del texto; «naturales» borraría el contraste técnico.
- source_word: archon(s)
  choice: arconte(s)
  rationale: Se conserva el término técnico tradicional para los gobernantes cósmicos de este escrito, en vez de reducirlo genéricamente a «gobernantes».
- source_word: authorities
  choice: autoridades
  rationale: Distingue este término de «arcontes» y conserva la formulación del testimonio.
- source_word: Perfect Man
  choice: Hombre Perfecto
  rationale: Mantiene el carácter titular y la posible dimensión escatológica sin identificar explícitamente la figura.
- source_word: holy Spirit
  choice: Espíritu santo
  rationale: Traducción formal que conserva la posible referencia personal o cualitativa; se evita imponer la capitalización confesional completa.
theological_decisions:
- issue: Identidad de la naturaleza espiritual femenina
  choice: Se mantiene como figura diferenciada que adopta la apariencia de la serpiente y luego se aparta de ella.
  alternative: Identificarla directamente con Eva, con Sofía o con una entidad doctrinal concreta.
  rationale: El pasaje no explicita aquí esa identificación; resolverla importaría una interpretación externa.
- issue: «como dioses»
  choice: Se conserva el plural «dioses».
  alternative: «como Dios» o «como seres divinos».
  rationale: El testimonio suministrado presenta plural y el contexto de múltiples poderes hace teológicamente significativa esa lectura.
- issue: La humanidad como posesión de los arcontes
  choice: «la humanidad que les pertenecía».
  alternative: «su humanidad» sin aclaración o «la humanidad creada por ellos».
  rationale: Expresa la relación posesiva del texto sin afirmar más de lo que este fragmento dice sobre su creación.
- issue: El Espíritu santo
  choice: Se mantiene la expresión sin explicar su identidad.
  alternative: Identificarlo explícitamente con el Espíritu Santo de una formulación trinitaria posterior o con una entidad gnóstica específica.
  rationale: La traducción debe preservar la apertura conceptual del escrito.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usan «ustedes» y formas verbales correspondientes. La redacción conserva los contrastes técnicos espiritual/carnal/anímico, los términos «arconte» y «autoridades», y las restauraciones manuscritas mediante corchetes. Las lagunas vacías se trasladan a notas marcadas en el texto para mejorar la legibilidad sin ocultar el estado textual. Borrador necesariamente provisional: la ficha indica que la revisión directa del copto del Códice de Nag Hammadi II,4 aún está pendiente y que la base disponible es un testimonio inglés de dominio público.'
