    [] La mujer carnal dijo: «No solo dijo: “No coman”, sino incluso: “No lo toquen, porque el día en que coman de él, ciertamente morirán”».


    La serpiente, la instructora, dijo: «Ciertamente no morirán, porque les dijo esto movido por los celos. Al contrario, se les abrirán los ojos y llegarán a ser como dioses, conociendo el bien y el mal». Entonces la naturaleza femenina que enseñaba se apartó de la serpiente y la abandonó como si fuera algo terrenal.


