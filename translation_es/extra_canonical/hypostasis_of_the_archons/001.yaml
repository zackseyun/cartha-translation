review_pass:
  verdict: revise
  source_fidelity: 'El texto reproduce fielmente el testimonio inglés disponible: conserva la laguna inicial «[]», la restauración «[sangre]», la repetición de «autoridades» y la formulación no identificadora «el gran apóstol». «Por el espíritu del Padre de la verdad» mantiene la ambigüedad del original de base. La revisión directa del copto sigue pendiente, por lo que no se deben hacer afirmaciones léxicas más específicas.'
  naturalness: La redacción es clara, actual y de registro adecuado para español latinoamericano neutral. «De qué fueron hechas» es natural en este contexto y conserva la orientación interrogativa-explicativa de la glosa parentética.
  terminology: «Sustancia», «autoridades cósmicas» y «espíritus del mal» son opciones defendibles y coherentes. Sin embargo, la nota b afirma que las autoridades son poderes «del ámbito cósmico» y sugiere que son sobrehumanas; tales precisiones exceden lo expresado por «authorities» fuera de la frase posterior y conviene formularlas con mayor cautela. La nota a también debe evitar referencias editoriales internas o la caracterización no sustentada de «título tradicional».
  issues:
  - severity: low
    issue: La nota a incluye una observación editorial sobre una revisión directa del copto pendiente y llama «tradicional» al título.
    rationale: Una nota de traducción debe aclarar el texto al lector, no describir el estado interno de la revisión. Además, el testimonio aportado no fundamenta la etiqueta «tradicional».
  - severity: medium
    issue: La nota b presenta «autoridades» como poderes o gobernantes del ámbito cósmico y sugiere una lectura sobrehumana de manera demasiado categórica.
    rationale: El contexto sí habla después de «autoridades cósmicas», pero el término repetido por sí mismo debe permanecer abierto. La nota puede mencionar alternativas de traducción sin imponer una clasificación o naturaleza precisa.
  revised_text: '[] Acerca de la sustancia[a] de las autoridades[b] (de qué fueron hechas). Por el espíritu del Padre de la verdad, el gran apóstol mencionó a las autoridades de las tinieblas y nos dio a conocer que «nuestra lucha no es contra carne y [sangre],[c] sino contra las autoridades cósmicas y los espíritus del mal». Te he enviado este escrito porque preguntaste acerca de la sustancia de las autoridades (de qué fueron hechas).'
  revised_footnotes:
