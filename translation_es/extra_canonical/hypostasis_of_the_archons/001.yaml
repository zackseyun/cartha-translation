translation:
  language: es
  text: '[] Acerca de la sustancia[a] de las autoridades[b] (de qué fueron hechas). Por el espíritu del Padre de la verdad, el gran apóstol mencionó a las autoridades de las tinieblas y nos dio a conocer que «nuestra lucha no es contra carne y [sangre],[c] sino contra las autoridades cósmicas y los espíritus del mal». Te he enviado este escrito porque preguntaste acerca de la sustancia de las autoridades (de qué fueron hechas).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Sustancia» también puede entenderse como «naturaleza», «realidad» o «constitución». La explicación entre paréntesis orienta aquí hacia aquello de lo que fueron hechas.
    reason: Preservar la amplitud semántica del título tradicional y advertir que la revisión directa del copto está pendiente.
  - marker: b
    text: «Autoridades» traduce una designación de poderes o gobernantes del ámbito cósmico; también suele verterse como «potestades» o «arcontes».
    reason: Aclarar el sentido sobrehumano del término sin imponer una equivalencia técnica única.
  - marker: c
    text: La palabra «sangre» aparece entre corchetes porque ha sido restaurada donde el manuscrito está dañado o incompleto.
    reason: Conservar de manera visible la incertidumbre textual indicada por el testimonio de base.
lexical_decisions:
- source_word: substance
  choice: sustancia
  rationale: Conserva la pregunta ontológica y material del testimonio —aclarada por «de qué fueron hechas»— sin reducirla únicamente a «naturaleza» o «esencia».
- source_word: authorities
  choice: autoridades
  rationale: Mantiene la designación reiterada de potestades cósmicas personales y evita identificar explícitamente a estos seres con una jerarquía doctrinal posterior.
- source_word: cosmic authorities
  choice: autoridades cósmicas
  rationale: Reproduce el alcance cósmico del testimonio y la relación léxica con «autoridades».
- source_word: spirits of evil
  choice: espíritus del mal
  rationale: Traducción natural que conserva la posible ambigüedad entre espíritus malignos y espíritus pertenecientes al ámbito del mal.
- source_word: battle
  choice: lucha
  rationale: Expresa el conflicto espiritual en español actual y concuerda con la formulación bíblica reconocible sin imponer una imagen militar más específica.
theological_decisions:
- issue: Identidad del «gran apóstol»
  choice: Conservar «el gran apóstol» sin nombrarlo
  alternative: Identificarlo como Pablo
  rationale: Aunque la alusión corresponde a Efesios 6:12 y probablemente apunta a Pablo, el testimonio no lo nombra en este pasaje.
- issue: Naturaleza del espíritu del Padre de la verdad
  choice: Usar «espíritu» en minúscula
  alternative: «Espíritu» con mayúscula como nombre del Espíritu Santo
  rationale: El testimonio permite una lectura reverencial, pero la mayúscula resolvería una identificación teológica que el texto citado no hace explícita.
- issue: Seres descritos como autoridades
  choice: Mantener el término general y personal «autoridades»
  alternative: Traducir «potestades», «gobernantes» o «arcontes»
  rationale: La opción elegida conserva la repetición conceptual y no introduce una clasificación técnica o confesional ajena al testimonio disponible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes iniciales que señalan una laguna y los de «[sangre]», que indican restauración textual; se omitió el número de página manuscrita. El borrador se basa provisionalmente en el testimonio inglés de dominio público, pues la revisión directa del copto del Códice de Nag Hammadi II,4 está pendiente.
