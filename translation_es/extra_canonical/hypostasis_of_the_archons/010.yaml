lexical_decisions:
- source_word: authorities / archon
  choice: autoridades / arconte
  rationale: Se conserva «autoridades» en la pregunta inicial y el término técnico «arconte» cuando el relato identifica al gobernante particular; así se mantiene la variación del testimonio sin confundir ambos usos.
- source_word: Indestructibility
  choice: la Indestructibilidad
  rationale: Se trata como una realidad personificada o ámbito trascendente, y no meramente como la cualidad abstracta de ser indestructible.
- source_word: aeons
  choice: eones
  rationale: Se conserva el término técnico cosmológico, asentado en español para los textos gnósticos, en vez de reducirlo a «edades» o «siglos».
- source_word: Sophia / Pistis / Zoe
  choice: Sofía / Pistis / Zoé
  rationale: Sofía y Zoé se adaptan a la forma española habitual; Pistis se translitera porque funciona como nombre y su traducción como «Fe» podría resolver indebidamente su papel conceptual.
- source_word: the All
  choice: el Todo
  rationale: Mantiene el sentido técnico de la totalidad divina o cósmica sin identificarla explícitamente con una doctrina posterior.
- source_word: androgynous
  choice: andrógino/a
  rationale: Reproduce de manera directa la caracterización dual del ser y de su descendencia, sin eufemismo ni interpretación adicional.
- source_word: Tartaros
  choice: el Tártaro
  rationale: Se usa la forma española tradicional del lugar de castigo del imaginario griego, distinguiéndolo del abismo mencionado a continuación.
- source_word: blind god
  choice: dios ciego
  rationale: Traduce el significado dado expresamente para Samael y conserva la minúscula descriptiva del testimonio.
theological_decisions:
- issue: Relación entre Sofía y su compañero
  choice: «por sí sola, sin su compañero»
  alternative: «independientemente, aparte de su consorte»
  rationale: La formulación preserva la separación afirmada por el texto sin definir la naturaleza de la pareja ni introducir el término más especializado «consorte».
- issue: Origen de lo producido por Sofía
  choice: «tuvo su origen en lo alto»
  alternative: «procedía de arriba»
  rationale: Conserva la afirmación espacial y cosmológica sin explicar de qué modo una producción independiente sigue teniendo origen superior.
- issue: Afirmación divina del arconte
  choice: «Yo soy Dios, y nada existe fuera de mí»
  alternative: «Yo soy Dios, y no existe nada aparte de mí»
  rationale: Mantiene intacta la pretensión exclusiva y su tensión con la realidad superior revelada por la voz.
- issue: Pecado contra el Todo
  choice: «pecó contra el Todo»
  alternative: «ofendió a la totalidad»
  rationale: Se conserva el lenguaje moral y el término cosmológico del testimonio, sin reinterpretar el acto como simple ignorancia.
- issue: Identidad de Elelet
  choice: «Elelet, que es Sabiduría»
  alternative: «Elelet, de la Sabiduría»
  rationale: Se sigue la identificación explícita del testimonio, aunque su relación exacta con Sofía permanezca teológicamente tensa.
- issue: Acción de la luz en el caos
  choice: «La hizo descender»
  alternative: «la persiguió hacia abajo»
  rationale: El antecedente más natural es la luz. Dado que el testimonio inglés admite dificultad, la traducción evita atribuir con certeza a Sofía un descenso personal, pero no expande la escena doctrinalmente.
translation_notes:
  register: Español latinoamericano neutral, de tono narrativo solemne pero actual. Se conservaron términos cosmológicos técnicos —«eones», «arconte», «el Todo»— y nombres propios tradicionales. El borrador es necesariamente provisional porque la evidencia suministrada es un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente.
