translation:
  language: es
  text: 'Yo dije: «Señor mío, instrúyeme acerca del [poder de] estas autoridades. [¿Cómo] llegaron a existir, de qué clase de sustancia y de qué [] materia proceden, y quién las creó y les dio su poder?»[a]


    El gran ángel Elelet, que es Sabiduría, me dijo: «La Indestructibilidad habita en eones infinitos. Sofía, llamada Pistis, deseó crear algo por sí sola, sin su compañero, y lo que produjo tuvo su origen en lo alto.


    »Hay un velo entre el mundo superior y los eones de abajo. Bajo el velo surgió una sombra; la sombra se convirtió en materia y cayó en un lugar separado.


    »Lo que ella había producido se desarrolló hasta convertirse en algo material, semejante a un feto abortado. Su forma fue moldeada a partir de la sombra, y se convirtió en una bestia arrogante parecida a un león. Era andrógina, como ya mencioné, porque se había originado de la materia.


    »Abrió los ojos y contempló una cantidad inmensa e ilimitada de materia. Se llenó de arrogancia y dijo: “Yo soy Dios, y nada existe fuera de mí”.


    »Al decir esto, pecó contra el Todo. Entonces una voz salió de lo alto, por encima del lugar del dominio supremo, y dijo: “Estás equivocado, Samael”, nombre que significa “dios ciego”.


    »Él respondió: “Si existe algo antes que yo, muéstramelo”.


    »Sofía extendió de inmediato su dedo e introdujo luz en la materia. La hizo descender hasta el lugar del caos y luego volvió a subir hacia su luz, mientras la oscuridad caía de nuevo [sobre] la materia.


    »Este arconte, que era andrógino, se hizo un vasto reino, una extensión ilimitada.


    »[] Pensó en crear descendencia para sí y creó siete descendientes, andróginos como su progenitor.


    »Dijo a sus descendientes: “Yo soy el Dios del Todo”.


    »Zoé, hija de Pistis Sofía, clamó y le dijo: “Estás equivocado, Sakla”, cuyo otro nombre es Yaldabaot. Zoé sopló en su rostro; su aliento se convirtió para ella en un ángel de fuego. Ese ángel ató a Yaldabaot y lo arrojó al Tártaro, debajo del abismo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes señalan palabras restauradas o lugares dañados en el manuscrito; «[]» indica una laguna cuyo contenido no puede recuperarse aquí. Los números de página del códice se omiten.
