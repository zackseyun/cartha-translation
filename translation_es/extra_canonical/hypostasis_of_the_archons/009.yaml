base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: es
  text: 'El ángel dijo: «Yo soy Elelet, el gran ángel Sabiduría, el que está ante el Espíritu santo. He sido enviado para hablar contigo, salvarte de manos de los que no tienen ley e instruirte acerca de tu raíz».


    En cuanto a aquel ángel, no soy capaz de describir su poder. Su apariencia es semejante al oro fino, y su vestidura, a la nieve. En verdad, mi boca no es capaz de describir su poder ni la apariencia de su rostro.


    El gran ángel Elelet me habló y dijo: «Yo soy Sabiduría, uno de los Cuatro Luminares[a] que están ante el gran Espíritu invisible. ¿De verdad piensas que estos arcontes[b] pueden ejercer algún poder sobre ti? Ninguno de ellos podrá vencer la raíz de la verdad, porque él[c] ha aparecido en los últimos días por causa de la raíz de la verdad, y estas autoridades serán confinadas. Tampoco podrán estas autoridades contaminarte a ti ni a aquella generación, porque tu morada está en la indestructibilidad[d], donde habita el Espíritu virgen, que está por encima de las autoridades del caos y de su mundo».


    [a] O «Cuatro Luces».

    [b] Es decir, gobernantes o potestades.

    [c] El referente del pronombre es incierto en el testimonio disponible.

    [d] O «incorruptibilidad».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Cuatro Luces».
    reason: Registra la traducción más literal del título técnico.
  - marker: b
    text: Es decir, gobernantes o potestades.
    reason: Aclara para lectores generales el término técnico «arcontes».
  - marker: c
    text: El referente del pronombre es incierto en el testimonio disponible.
    reason: Preserva una ambigüedad real en vez de identificar de manera conjetural al sujeto de «ha aparecido».
  - marker: d
    text: O «incorruptibilidad».
    reason: Documenta una alternativa semántica importante para el estado o ámbito imperecedero descrito.
lexical_decisions:
- source_word: Eleleth
  choice: Elelet
  rationale: Transliteración simplificada y pronunciable en español del nombre propio transmitido por el testimonio.
- source_word: Wisdom
  choice: Sabiduría
  rationale: Conserva su función como título o identidad personificada, por lo que se escribe con mayúscula.
- source_word: Four Lights
  choice: Cuatro Luminares
  rationale: Expresa seres celestiales denominados «Luces» sin confundirlos con luces ordinarias; la alternativa literal se conserva en nota.
- source_word: archons
  choice: arcontes
  rationale: Mantiene el término técnico habitual para estas potestades en la literatura gnóstica; una glosa aclara su sentido.
- source_word: root
  choice: raíz
  rationale: Conserva la imagen técnica y deliberadamente enigmática sin interpretarla como origen, linaje o naturaleza.
- source_word: indestructibility
  choice: indestructibilidad
  rationale: Reproduce el sustantivo abstracto y su dimensión espacial en el pasaje; se ofrece «incorruptibilidad» como alternativa.
- source_word: virgin Spirit
  choice: Espíritu virgen
  rationale: Preserva el orden conceptual y la posible función titular sin imponer género ni una identificación doctrinal adicional.
theological_decisions:
- issue: Identidad de Elelet con la Sabiduría
  choice: «Yo soy Sabiduría»
  alternative: «Yo soy la Sabiduría»
  rationale: La ausencia de artículo mantiene el carácter de nombre o identidad personificada reflejado en el testimonio, sin definir más su relación ontológica.
- issue: Referente de «he has appeared»
  choice: «él ha aparecido», con nota de incertidumbre
  alternative: Sustituir el pronombre por «la raíz de la verdad» u otro referente explícito
  rationale: El antecedente no resulta seguro en el testimonio proporcionado; conservar el pronombre evita resolver una ambigüedad teológica y gramatical.
- issue: Alcance del poder de los arcontes
  choice: Pregunta retórica con «algún poder»
  alternative: «ningún poder» dentro de la pregunta
  rationale: Conserva la forma interrogativa y el énfasis del testimonio sin convertirla directamente en una afirmación absoluta.
- issue: «you and that generation»
  choice: «a ti ni a aquella generación»
  alternative: «a ti ni a esa generación»
  rationale: Mantiene la distinción entre la destinataria individual y un grupo señalado, sin identificar doctrinalmente a la generación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen términos técnicos indispensables, acompañados de notas breves. El borrador es provisional porque se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto del Códice II,4 de Nag Hammadi.
