lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Conserva el término técnico tradicional para los gobernantes cósmicos del escrito, en vez de reducirlo al sentido genérico de «gobernantes».
- source_word: female counterpart
  choice: contraparte femenina
  rationale: Mantiene la relación técnica y deliberadamente imprecisa del testimonio sin introducir «esposa», «consorte» u otra identificación doctrinal.
- source_word: world above
  choice: mundo de arriba
  rationale: Expresa con naturalidad el contraste cosmológico vertical sin convertirlo interpretativamente en «cielo».
- source_word: sexual services
  choice: servicios sexuales
  rationale: Hace explícita la coerción sexual expresada por el testimonio y evita un eufemismo que podría ocultarla.
- source_word: God of the All
  choice: Dios del Todo
  rationale: Conserva «el Todo» como denominación cosmológica del escrito, sin normalizarla como «Dios de todos».
- source_word: holy Spirit
  choice: Espíritu santo
  rationale: Traducción formal que no impone por capitalización una identificación trinitaria inequívoca; se conserva «Espíritu» como título y «santo» como calificativo.
theological_decisions:
- issue: Identidad de la madre de Norea y la afirmación de que los arcontes no la conocieron
  choice: Conservar literalmente la negación y el contraste con la «contraparte femenina» de los arcontes
  alternative: Armonizar la declaración con el relato previo o identificar a la contraparte como Eva
  rationale: El pasaje sostiene deliberadamente una polémica cosmológica; resolverla borraría su tensión interna.
- issue: Procedencia de Norea
  choice: «vengo del mundo de arriba»
  alternative: «vengo del cielo» o «pertenezco al reino superior»
  rationale: La formulación preserva la cosmología del texto sin añadir categorías posteriores.
- issue: Reprensión del ángel acerca del Espíritu santo
  choice: Mantener la pregunta como reprensión ambigua
  alternative: Reformularla como elogio de la audacia de Norea o como condena inequívoca
  rationale: El testimonio dice que ella es «presuntuosa/atrevida» respecto al Espíritu, pero el valor pragmático exacto resulta incierto y no debe resolverse doctrinalmente.
- issue: Restauraciones y lagunas manuscritas
  choice: Conservar corchetes y puntos suspensivos, acompañados de notas
  alternative: Completar el texto por conjetura o eliminar las señales críticas
  rationale: Las señales permiten al lector distinguir el texto continuo de las restauraciones y pérdidas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y un estilo narrativo claro. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice II,4 de Nag Hammadi. Se conservaron las señales de daño o restauración, pero se omitió el número de página manuscrita aislado «[4]», por no pertenecer al discurso.
