    En su poder, el arrogante arconte se volvió, y su semblante se volvió como un [infierno] en llamas.[a] Se mostró insolente hacia ella y [dijo]: «Tienes que prestarnos servicios sexuales, como lo hizo tu madre Eva, porque [...] me ha sido delegado».[b]



    Pero Norea, con el poder de [Dios],[c] se volvió y clamó a gran voz al Santo, el Dios del Todo: [] «¡Líbrame de los arcontes de la injusticia y sálvame de inmediato de sus manos!»



    Un ángel descendió del cielo y le dijo: «¿Por qué invocas a Dios? ¿Por qué te muestras tan atrevida ante el Espíritu santo?»[d]



