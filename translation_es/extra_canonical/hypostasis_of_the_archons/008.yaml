base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: es
  text: 'Los arcontes fueron a su encuentro, tramando engañarla. Su jefe le dijo: «Tu madre, Eva, vino a nosotros». Pero Norea se volvió hacia ellos y dijo: «Ustedes son los arcontes de las tinieblas. ¡Malditos sean! No conocieron a mi madre, sino a su propia contraparte femenina, porque yo no soy descendiente de ustedes; vengo del mundo de arriba».


    Con todo su poder, el arrogante arconte se volvió, y su rostro se puso como un [infierno] en llamas.[a] Se comportó con insolencia hacia ella y [dijo]: «Tienes que prestarnos servicios sexuales, como lo hizo tu madre Eva, porque [...] me ha sido delegado».[b]


    Pero Norea, fortalecida por el poder de [Dios],[c] se volvió y clamó a gran voz al Santo, el Dios del Todo: [] «¡Líbrame de los arcontes de la injusticia y sálvame de inmediato de sus manos!»


    Un ángel descendió del cielo y le dijo: «¿Por qué invocas a Dios? ¿Por qué te muestras tan atrevida ante el Espíritu santo?»[d]


    Norea preguntó: «¿Quién eres?»


    Mientras tanto, los arcontes de la injusticia se habían apartado de ella.


    [a] «Infierno» aparece entre corchetes porque representa una restauración editorial en un pasaje dañado.

    [b] La laguna impide saber qué es lo que, según el arconte, le había sido delegado.

    [c] «Dios» aparece entre corchetes porque representa una restauración editorial.

    [d] También puede entenderse: «¿Por qué actúas con tanta presunción respecto al Espíritu santo?». El sentido exacto de la reprensión es incierto.'
  philosophy: optimal-equivalence
