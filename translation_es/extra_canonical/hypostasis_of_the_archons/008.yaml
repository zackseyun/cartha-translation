    Pero Norea, con el poder de [Dios],[c] se volvió y clamó a gran voz al Santo, el Dios del Todo: [] «¡Líbrame de los arcontes de la injusticia y sálvame de inmediato de sus manos!»



    Un ángel descendió del cielo y le dijo: «¿Por qué invocas a Dios? ¿Por qué te muestras tan presuntuosa ante el Espíritu santo?»



