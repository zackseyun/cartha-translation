  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: es
  text: 'Yo dije:


    —Señor mío, ¿también yo procedo de la materia de ellos?


    —Tú y tu descendencia proceden del Padre, que existía desde el principio.


    »Las almas proceden de lo alto, de la luz indestructible. Por eso, las autoridades no pueden acercarse a ellas, pues el espíritu de la verdad está dentro de ellas. Todo el que conoce este camino de la verdad será inmortal entre los seres humanos mortales.


    »Sin embargo, esa semilla todavía no será conocida. Será conocida después de tres edades, y entonces los liberará de la esclavitud del error de las autoridades.


    Yo pregunté:


    —Señor mío, ¿cuánto falta para que esto suceda?


    Él me respondió:


    —Hasta el momento en que el Hombre Verdadero, en una sustancia moldeable,[a] revele [el espíritu de] la verdad que el Padre ha enviado.[b]


    »Entonces les enseñará acerca de todas las cosas y los ungirá con el aceite de la vida eterna que le fue concedido por la generación sin rey.


    »Entonces serán liberados del pensamiento ciego. Pisotearán la muerte, que procede de las autoridades, y ascenderán a la luz infinita donde habita esa semilla.


    »Entonces las autoridades renunciarán a sus tiempos. Sus ángeles llorarán por su destrucción, y sus demonios se lamentarán por su muerte.


    »Entonces todos los hijos de la luz conocerán verdaderamente la verdad, su raíz, al Padre del Todo y al Espíritu Santo. Todos ellos proclamarán a una sola voz: “La verdad del Padre es justa. El Hijo reina sobre el Todo”. Y cada uno proclamará: “¡Por los siglos de los siglos, santo, santo, santo! Amén”.


    La sustancia de los arcontes[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Sustancia moldeable» traduce el préstamo griego plasma, que designa una materia capaz de recibir forma.
    reason: Aclara un término técnico y una imagen material importante para el argumento del escrito.
  - marker: b
    text: Las palabras «el espíritu de» son una restauración editorial y por eso aparecen entre corchetes.
    reason: Hace explícito que el texto conservado es incierto en este punto.
  - marker: c
    text: El título emplea «sustancia» para hypostasis en el sentido de materia, constitución o sustrato de los arcontes. «Arcontes» es la forma tradicional del griego archontes, es decir, «gobernantes» o «autoridades».
    reason: Explica dos términos técnicos del título y evita que «hipóstasis» se entienda exclusivamente en un sentido ontológico posterior.
lexical_decisions:
- source_word: authorities / Coptic witness behind Greek archōn terminology
  choice: autoridades
  rationale: Conserva en el cuerpo la función de poderes gobernantes y sigue el testimonio suministrado; «arcontes» se reserva para el título tradicional, aclarado en nota.
- source_word: plasma
  choice: sustancia moldeable
  rationale: Mantiene tanto la materialidad como la capacidad de recibir forma, sin reducir el término a «cuerpo» ni a «molde».
- source_word: seed
  choice: semilla
  rationale: Preserva la imagen concreta y la posible dimensión colectiva o espiritual sin interpretarla como simple «descendencia».
- source_word: kingless generation
  choice: generación sin rey
  rationale: Traducción formal que conserva la expresión cosmológica inusual y evita sustituirla por una explicación doctrinal.
- source_word: the All
  choice: el Todo
  rationale: Se usa como designación sustantivada de la totalidad cósmica, conservando la terminología característica del escrito.
- source_word: deathless
  choice: inmortal
  rationale: Es la expresión natural en español para la oposición explícita con los seres humanos mortales.
- source_word: True Man
  choice: Hombre Verdadero
  rationale: Mantiene el carácter titular y la ambigüedad de la figura, señalados mediante mayúsculas.
- source_word: hypostasis
  choice: sustancia
  rationale: En el título, refleja la interpretación material indicada por las notas del testimonio, en vez del sentido ontológico moderno de «hipóstasis».
theological_decisions:
- issue: Naturaleza de la procedencia de Norea y su descendencia
  choice: «proceden del Padre»
  alternative: «fueron creados por el Padre»
  rationale: «Proceden» conserva la ambigüedad del origen y evita imponer una teoría particular de creación o emanación.
- issue: Identidad del Hombre Verdadero
  choice: Se conserva como título sin identificarlo
  alternative: Identificarlo explícitamente con Cristo u otra figura
  rationale: El pasaje no hace explícita esa identificación; la traducción no debe resolverla doctrinalmente.
- issue: Restauración textual en «[el espíritu de] verdad»
  choice: Se conservan los corchetes
  alternative: Integrar «el espíritu de» como texto seguro u omitirlo
  rationale: Los corchetes indican una restauración o incertidumbre del testimonio y deben seguir siendo visibles.
- issue: Relación sintáctica de la raíz, el Padre del Todo y el Espíritu Santo
  choice: Se presentan como objetos coordinados del conocimiento
  alternative: Identificar la raíz con el Padre o con el Espíritu
  rationale: La puntuación conserva la enumeración sin fundir estas expresiones ni decidir su relación metafísica.
- issue: «La verdad del Padre es justa»
  choice: Se mantiene la predicación literal
  alternative: «La justicia del Padre es verdadera»
  rationale: Aunque la frase es inusual, la inversión cambiaría el sujeto y resolvería una tensión genuina del texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya y párrafos claros. Se mantienen las fórmulas cosmológicas distintivas («generación sin rey», «el Todo») y las mayúsculas titulares sin normalizarlas según una tradición confesional. El borrador es necesariamente provisional porque la revisión directa del copto sigue pendiente; se fundamenta en el testimonio inglés público suministrado y en sus notas léxicas sobre los préstamos griegos.
