  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: es
  text: 'Los arcontes llevaron a Adán y lo pusieron en el jardín para que lo cultivara y lo protegiera. Le dieron esta orden: «Puedes comer de [todos] los árboles del jardín, pero no comas del árbol del conocimiento del bien y del mal. No lo [toques], porque el día que comas de él, ciertamente morirás».


    [Esto] le [dijeron], aunque no entendían lo que le [habían dicho]. Más bien, fue conforme a la voluntad del Padre [] que hablaron de esa manera, para que Adán en efecto comiera y para que Adán <no> pensara en ellos como lo haría un hombre completamente material.


    Los arcontes conspiraron entre sí y dijeron: «Vamos, hagamos caer un sueño profundo sobre Adán»; y Adán se durmió. El sueño profundo que hicieron caer sobre él, y que él durmió, es la ignorancia. Le abrieron el costado, como una mujer viviente. Luego cerraron su costado poniendo carne en su lugar, y Adán quedó reducido a ser meramente anímico.[a]


    La mujer espiritual se acercó a él y le habló diciendo: «Levántate, Adán».


    Cuando él la contempló, dijo: «Tú me has dado vida. Serás llamada la Madre de los vivientes, porque ella es mi madre. Ella es la médica, la mujer, la que ha dado a luz».[b]


    Las autoridades se acercaron al Adán de ellas. Cuando vieron que su contraparte femenina hablaba con él, se excitaron y la desearon. Se dijeron unos a otros: «Vamos, sembremos nuestro semen en ella», y la persiguieron. Ella, sin embargo, se rio de ellos por su estupidez y ceguera. Cuando la agarraron, se convirtió en un árbol y puso ante ellos una semejanza sombría de sí misma. Ellos la profanaron de la manera más vil, profanando el sello de su voz.[c] Así hicieron recaer el juicio sobre sí mismos mediante la figura que habían modelado a su propia imagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Anímico» traduce una categoría antropológica que aquí contrasta tanto con lo material como con lo espiritual; no significa simplemente «vivo» o «con alma».
    reason: La palabra es técnica y poco común en español, pero necesaria para no borrar la antropología tripartita del pasaje.
  - marker: b
    text: El texto cambia de «tú» a «ella» y acumula varios títulos femeninos. Se conserva esa formulación sin uniformarla.
    reason: El referente y la sintaxis son inciertos, y una corrección estilística podría imponer una interpretación.
  - marker: c
    text: «El sello de su voz» es una expresión oscura del testimonio conservado; puede aludir a una impronta, señal o representación vinculada con la voz de la mujer.
    reason: Se señala la dificultad sin resolver especulativamente la imagen.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Conserva el término técnico tradicional para las potestades gobernantes de esta obra; traducirlo solo como «gobernantes» borraría su carga cosmológica.
- source_word: tend it and guard it
  choice: lo cultivara y lo protegiera
  rationale: Expresa con naturalidad las dos acciones agrícolas y custodiales sin fundirlas en una sola.
- source_word: deep sleep
  choice: sueño profundo
  rationale: Mantiene el eco del relato de Génesis y permite que el propio texto lo identifique después con la ignorancia.
- source_word: soulish
  choice: meramente anímico
  rationale: «Anímico» conserva la categoría antropológica intermedia y el contraste explícito con la mujer «espiritual»; «dotado de alma» podría sugerir una afirmación más neutral.
- source_word: spiritual woman
  choice: mujer espiritual
  rationale: Traducción directa que preserva su función antropológica y teológica sin identificarla con una figura doctrinal externa.
- source_word: female counterpart
  choice: contraparte femenina
  rationale: Conserva la relación correlativa sin imponer «esposa», «compañera» o «doble», opciones más interpretativas.
- source_word: signet
  choice: sello
  rationale: Mantiene la imagen de una impronta o marca de autenticidad, aun cuando la frase completa permanece oscura.
theological_decisions:
- issue: La voluntad del Padre y la orden ignorante de los arcontes
  choice: 'Mantener ambas afirmaciones en tensión: los arcontes no comprenden, pero hablan conforme a la voluntad del Padre.'
  alternative: Explicar que el Padre engaña o domina directamente a los arcontes.
  rationale: El pasaje afirma simultáneamente ignorancia de los arcontes y conformidad con una voluntad superior, sin explicar el mecanismo.
- issue: Finalidad de la orden dada a Adán
  choice: Conservar «para que Adán en efecto comiera» y el <no> señalado por el testimonio.
  alternative: Armonizar el mandato con Génesis haciendo que la finalidad sea impedir que Adán coma.
  rationale: La inversión paradójica es central en el texto y los signos críticos no deben desaparecer.
- issue: Estado de Adán después de cerrarse su costado
  choice: «quedó reducido a ser meramente anímico»
  alternative: «se convirtió en un ser con alma» o «se volvió carnal».
  rationale: La primera alternativa neutraliza el matiz restrictivo; la segunda confunde las categorías material y anímica.
- issue: Referentes femeninos en el discurso de Adán
  choice: 'Preservar el cambio de segunda a tercera persona: «Tú… Serás… porque ella…».'
  alternative: Uniformar todos los pronombres en segunda persona.
  rationale: El desplazamiento puede reflejar una distinción o una irregularidad textual; normalizarlo resolvería una ambigüedad genuina.
- issue: Violencia sexual contra la semejanza
  choice: Usar «profanaron» sin descripción gráfica adicional.
  alternative: Traducir con un verbo sexual más explícito.
  rationale: «Profanar» conserva tanto la violencia como el lenguaje ritual del pasaje y concuerda con la repetición vinculada al «sello».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen «arcontes» y «anímico» como términos técnicos, con apoyo en notas. Los corchetes, los corchetes vacíos y los signos angulares reproducen las señales textuales del testimonio inglés provisional, pues sigue pendiente la revisión directa del copto. Se evita suavizar la violencia del episodio o convertir sus imágenes oscuras en afirmaciones doctrinales más precisas de lo que permite la fuente.
