  naturalness: El español es claro, actual y apropiado para un registro narrativo digno. «Debatir» es igualmente natural y refleja mejor el intercambio indicado por el testimonio.
  terminology: «El Bien», «Salvador», «Señor», «mente», «alma» y «espíritu» están bien conservados. «Seres humanos» transmite prudentemente «Humans» sin imponer una interpretación técnica.
