translation:
  language: es
  text: 'Entonces María se levantó y saludó a todos. Dijo a sus hermanos y hermanas:[a] «No lloren ni se aflijan, ni permitan que sus corazones se dividan, porque su gracia estará con todos ustedes y los protegerá. Más bien, alabemos su grandeza, porque él nos ha preparado y nos ha hecho seres humanos».


    Cuando María dijo esto, orientó sus corazones [hacia] el Bien, y ellos [comenzaron] a dialogar sobre las palabras del [Salvador].


    Pedro le dijo a María: «Hermana, sabemos que el Salvador te amó más que a todas las demás mujeres. Cuéntanos las palabras del Salvador que recuerdas: las cosas que tú sabes y nosotros no, y que tampoco hemos oído».


    María respondió: «Les contaré lo que está oculto para ustedes». Entonces comenzó a relatarles estas palabras: «Yo —dijo— vi al Señor en una visión y le dije: “Señor, hoy te vi en una visión”.


    »Él me respondió: “Dichosa tú, porque no vacilaste al verme. Pues donde está la mente, allí está el tesoro”.


    »Yo le dije: “Señor, quien ve la visión, ¿la ve en el alma o en el espíritu?”.


    »El Salvador respondió: “No la ve en el alma ni en el espíritu, sino que la mente, que [existe] entre ambos, es la que ve la visión, y es ella la que […]”».[b]


    [Faltan las páginas 11 a 14 del manuscrito].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés explicita «hermanos (y hermanas)»; la traducción inclusiva representa a todo el grupo al que María se dirige.
    reason: Aclarar la base textual de la formulación inclusiva.
  - marker: b
    text: La oración se interrumpe en el manuscrito. Los corchetes dentro del discurso señalan palabras suplidas o restauradas en el testimonio disponible.
    reason: Preservar de forma visible la fragmentación y las restauraciones textuales.
  - marker: c
    text: En el códice faltan cuatro páginas, de la 11 a la 14, por lo que se ha perdido la continuación inmediata de la respuesta.
    reason: Distinguir la laguna material del contenido narrativo.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: hermanos y hermanas
  rationale: Expresa de manera natural en español el grupo inclusivo indicado explícitamente por el testimonio inglés, sin relegar la aclaración a un paréntesis.
- source_word: the Good
  choice: el Bien
  rationale: La mayúscula conserva la posible fuerza sustantivada o trascendente de la expresión sin definirla doctrinalmente.
- source_word: Humans
  choice: seres humanos
  rationale: Conserva la llamativa afirmación antropológica del testimonio sin convertir «Humanos» en un título técnico no confirmado; la revisión copta/griega sigue pendiente.
- source_word: mind
  choice: mente
  rationale: Distingue este término de «alma» y «espíritu» y preserva la estructura tripartita explícita del pasaje.
- source_word: didn’t waver
  choice: no vacilaste
  rationale: Mantiene la idea de no titubear ante la visión sin especificar si se trata de duda, miedo o perturbación.
- source_word: debate
  choice: dialogar
  rationale: Refleja un intercambio sobre las palabras del Salvador sin imponer necesariamente un tono hostil; el matiz exacto deberá comprobarse en la fuente copta/griega.
theological_decisions:
- issue: La relación entre mente, alma y espíritu
  choice: Conservar la mente como aquello que está «entre ambos» y ve la visión
  alternative: Armonizar mente con alma o espíritu, o explicar una antropología sistemática
  rationale: El texto presenta una tensión conceptual propia y queda truncado; resolverla añadiría una doctrina que el fragmento no desarrolla.
- issue: Identidad del referente de «su gracia»
  choice: Mantener el posesivo «su» sin sustituirlo por un nombre
  alternative: Especificar «la gracia del Salvador» o «la gracia de Jesús»
  rationale: El testimonio suministrado usa un referente pronominal; conservarlo evita imponer una identificación más explícita que el texto disponible.
- issue: «Nos ha hecho seres humanos»
  choice: Traducir literalmente la afirmación básica sin explicación doctrinal
  alternative: Interpretarla como humanidad perfecta, salvación, iluminación o creación
  rationale: La formulación puede tener una carga antropológica o soteriológica, pero el fragmento no basta para decidirla.
- issue: «El Bien»
  choice: Conservarlo como expresión sustantivada y con mayúscula
  alternative: Identificarlo expresamente con Dios, la bondad moral o un ámbito metafísico
  rationale: Así se preserva la posible dimensión teológica del término sin cerrar su referencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y comillas angulares con comillas dobles en el discurso interior. El borrador es provisional porque la revisión directa del copto y de los fragmentos griegos está pendiente; por ello se conservan los corchetes, la interrupción y las ambigüedades del testimonio público suministrado.
