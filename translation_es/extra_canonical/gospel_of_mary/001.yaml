translation:
  language: es
  text: '«Entonces, ¿la [materia] será [destruida] o no?»[a]


    El Salvador dijo: «Toda naturaleza, toda forma y toda criatura existen unas en otras y unas con otras, pero volverán a disolverse en sus propias raíces, porque la naturaleza de la materia se disuelve únicamente en su propia naturaleza. ¡Quien tenga oídos para oír, que oiga!»


    Pedro le dijo: «Ya que nos has explicado todas las cosas, dinos una más: ¿cuál es el pecado del mundo?»


    El Salvador dijo: «El pecado no existe; son ustedes quienes producen el pecado cuando actúan conforme a la naturaleza del adulterio, a la cual se llama “pecado”. Por eso el Bien vino entre ustedes, hasta las realidades de toda naturaleza, a fin de restaurarla en su raíz».[b]


    Luego continuó diciendo: «Por eso enferman y mueren: porque [aman lo que los engaña. Quien pueda] entender, que entienda.


    »La materia [dio origen a] una pasión que no tiene imagen, porque procede de lo que es contrario a la naturaleza. Entonces surge confusión en todo el cuerpo. Por eso les dije que estén satisfechos de corazón. Si están insatisfechos, hallen satisfacción ante las diversas imágenes de la naturaleza. ¡Quien tenga oídos para oír, que oiga!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes señalan palabras suplidas o restauradas donde el manuscrito está dañado o el texto es incierto. Esta versión es provisional, pues se basa en el testimonio inglés suministrado y queda pendiente la revisión directa del copto y de los fragmentos griegos.
    reason: Hace visible tanto la incertidumbre textual como la limitación de la base de trabajo.
  - marker: b
    text: El referente de «restaurarla» no es completamente seguro; podría referirse a la naturaleza o, de manera más amplia, a cada realidad mencionada.
    reason: Evita resolver silenciosamente la ambigüedad del pronombre en el testimonio.
lexical_decisions:
- source_word: matter
  choice: materia
  rationale: Conserva el término cosmológico del testimonio y evita interpretarlo como “mundo material” o “cuerpo”.
- source_word: roots
  choice: raíces
  rationale: Mantiene la imagen plural del testimonio, aun cuando su sentido cosmológico no se explica en el pasaje.
- source_word: the Good
  choice: el Bien
  rationale: La mayúscula y el artículo preservan su posible uso como realidad personificada o título, sin identificarlo doctrinalmente.
- source_word: adultery
  choice: adulterio
  rationale: Se conserva la expresión concreta y teológicamente tensa en vez de reemplazarla por una generalización como “infidelidad” o “corrupción”.
- source_word: passion
  choice: pasión
  rationale: Reproduce el término amplio, que puede aludir a deseo, afección o impulso, sin escoger una interpretación más estrecha.
- source_word: content at heart
  choice: estén satisfechos de corazón
  rationale: Expresa de manera natural el estado interior indicado por el testimonio sin convertirlo en una virtud técnica específica.
theological_decisions:
- issue: La afirmación «Sin doesn’t exist»
  choice: «El pecado no existe»
  alternative: «No hay pecado por naturaleza»
  rationale: Se preserva la formulación radical y su tensión con la frase siguiente; añadir “por naturaleza” resolvería una ambigüedad que el testimonio no resuelve explícitamente.
- issue: La llegada del Bien y el alcance de su acción
  choice: «el Bien vino entre ustedes, hasta las realidades de toda naturaleza»
  alternative: «el Bien vino entre ustedes y penetró en cada naturaleza»
  rationale: La opción elegida conserva la construcción difícil del testimonio y evita introducir la idea interpretativa de penetración.
- issue: Referente de «restore it»
  choice: «restaurarla en su raíz»
  alternative: «restaurar cada cosa en su raíz»
  rationale: El pronombre femenino remite de manera más inmediata a “naturaleza”, pero una nota reconoce que el referente del testimonio es incierto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conservan las repeticiones, imágenes cosmológicas y afirmaciones difíciles del testimonio. La redacción evita explicar el pasaje mediante categorías confesionales posteriores.
