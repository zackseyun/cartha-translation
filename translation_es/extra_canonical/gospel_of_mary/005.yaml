    »Más bien, deberíamos avergonzarnos, revestirnos de la Humanidad perfecta[c], hacerla nuestra, tal como él nos indicó, y anunciar el evangelio, sin establecer ninguna otra regla ni ley más allá de lo que dijo el Salvador».


    Cuando [Leví dijo estas cosas][d], comenzaron a salir para enseñar y predicar.


