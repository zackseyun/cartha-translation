  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: es
  text: 'Andrés respondió a los hermanos y las hermanas[a]: «Digan lo que quieran acerca de lo que ella ha dicho. Yo, por mi parte, no creo que el Salvador haya dicho estas cosas, porque estas enseñanzas parecen ideas diferentes».


    Pedro expresó las mismas inquietudes. Les preguntó acerca del Salvador: «Él no habló con una mujer sin que nosotros lo supiéramos ni abiertamente con nosotros, ¿verdad? ¿Ahora vamos a cambiar de parecer y escucharla todos? ¿Acaso la prefirió a nosotros?».


    Entonces María lloró y le dijo a Pedro: «Hermano mío, Pedro, ¿qué estás pensando? ¿De verdad crees que yo misma inventé esto en mi corazón, o que miento acerca del Salvador?».


    Leví respondió a Pedro: «Pedro, siempre has sido iracundo. Ahora veo que discutes con esta mujer como lo hacen los adversarios[b]. Pero, si el Salvador la hizo digna, ¿quién eres tú para rechazarla? Sin duda el Salvador la conoce muy bien. Por eso la amó más que a nosotros.


    »Más bien, deberíamos avergonzarnos, revestirnos de la humanidad perfecta[c], hacerla nuestra, tal como él nos indicó, y anunciar el evangelio, sin imponer ninguna otra norma ni otra ley fuera de lo que dijo el Salvador».


    Cuando [Leví dijo estas cosas][d], comenzaron a salir para enseñar y anunciar el evangelio.


    El Evangelio


    según


    María'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés explicita «hermanos y hermanas»; la revisión directa del copto y de los fragmentos griegos está pendiente.
    reason: Señalar el carácter provisional de la inclusión explícita según la base suministrada.
  - marker: b
    text: «Los adversarios» también puede entenderse de manera general como «los opositores».
    reason: Preservar la amplitud de la expresión sin identificar a un grupo concreto.
  - marker: c
    text: El testimonio inglés escribe «Humanity» con mayúscula, quizá para indicar un concepto técnico. Aquí se traduce «humanidad perfecta» sin decidir entre sus posibles sentidos.
    reason: Conservar una ambigüedad conceptual y teológica relevante.
  - marker: d
    text: Las palabras entre corchetes representan una restauración editorial de texto no conservado o incierto en el manuscrito.
    reason: Mantener visible la señal de reconstrucción textual presente en el testimonio.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: los hermanos y las hermanas
  rationale: Hace explícito el sentido inclusivo indicado por el testimonio inglés, con lenguaje natural en español actual.
- source_word: different ideas
  choice: ideas diferentes
  rationale: Conserva la formulación abierta del testimonio y evita precisar si Andrés las juzga extrañas, divergentes o heréticas.
- source_word: adversaries
  choice: los adversarios
  rationale: 'Mantiene la referencia plural y su ambigüedad: puede designar opositores en general o adversarios identificables dentro del marco de la obra.'
- source_word: made her worthy
  choice: la hizo digna
  rationale: Reproduce la agencia del Salvador y evita sustituirla por «la consideró digna», que modificaría el matiz.
- source_word: perfect Humanity
  choice: la humanidad perfecta
  rationale: Conserva el concepto abstracto y la posible carga técnica; en español no se requiere mayúscula para señalarla, por lo que se añade una nota.
- source_word: preach the gospel
  choice: anunciar el evangelio
  rationale: Expresión clara, digna y corriente en español latinoamericano, adecuada para la proclamación pública.
theological_decisions:
- issue: La preferencia y el amor del Salvador por María
  choice: «la amó más que a nosotros»
  alternative: «la amaba más que a nosotros» o «la amó de manera especial»
  rationale: Se conserva sin atenuación la comparación explícita del testimonio, sin explicar su naturaleza ni resolver la tensión sobre autoridad.
- issue: La dignidad de María otorgada por el Salvador
  choice: «si el Salvador la hizo digna»
  alternative: «si el Salvador la consideró digna»
  rationale: La formulación elegida preserva la acción atribuida al Salvador y no la reduce a una mera valoración.
- issue: Humanidad perfecta
  choice: «revestirnos de la humanidad perfecta, hacerla nuestra»
  alternative: «revestirnos del ser humano perfecto»
  rationale: Se mantiene la lectura abstracta del testimonio disponible y su posible sentido antropológico o espiritual, sin identificarla con una doctrina específica.
- issue: Norma y ley adicionales
  choice: «sin imponer ninguna otra norma ni otra ley fuera de lo que dijo el Salvador»
  alternative: «sin establecer ningún otro precepto o ley»
  rationale: Conserva el rechazo de requisitos adicionales sin inferir a qué reglas concretas se refiere el pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes/nosotros» implícito, se evitan regionalismos y se conserva el tono directo del conflicto. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto y de los fragmentos griegos.
