base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: es
  text: 'Deseo dijo: «No te vi cuando bajabas, pero ahora te veo subir. Entonces, ¿por qué mientes, si me perteneces?»


    El alma respondió: «Yo te vi, pero tú no me viste ni me conociste. Para ti yo era tan solo una vestidura, y no me reconociste». Después de decir esto, se marchó con gran alegría.


    Luego llegó al tercer poder, llamado «Ignorancia». [Este] interrogó al alma y [dijo]: «¿Adónde vas? Estás atada en la maldad. Puesto que estás atada, ¡no juzgues!»


    [Y] el alma dijo: «¿Por qué me juzgas, si yo no he juzgado? Estuve atada, aunque no he atado. No me reconocieron, pero yo he reconocido que todo se disolverá: tanto lo que está en la [tierra] como lo que está en el [cielo]».


    Cuando el alma venció al tercer poder, ascendió y vio al cuarto poder, que adoptaba siete formas:


    La primera forma es Oscuridad;

    la segunda, Deseo;

    la tercera, Ignorancia;

    la cuarta, Celo por la Muerte;

    la quinta, el Reino de la Carne;

    la sexta, la necia «Sabiduría» de la Carne;

    la séptima, la «Sabiduría» de la Ira.


    Estos son los siete poderes de la Ira.


    Ellos preguntan al alma: «¿De dónde vienes, asesina, y adónde vas, vencedora del espacio?»[a]


    El alma respondió: «Lo que me ata ha sido matado; lo que me rodea ha sido vencido; mi deseo ha desaparecido, y la ignorancia ha muerto. En un [mundo] fui liberada de un mundo, [y] en una figura, de una figura que está arriba, y de la cadena del olvido, que existe solo por un tiempo. Desde ahora recibiré en silencio el descanso del tiempo, de la estación, de la era».[b]


    Cuando María terminó de decir estas cosas, guardó silencio, porque hasta ese punto había hablado con ella el Salvador.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «vencedora del espacio» es incierta y puede aludir a quien supera una región, ámbito o extensión; se conserva «espacio» para no resolver la imagen.
    reason: La base proporcionada depende de un testimonio inglés y la revisión directa del copto y los fragmentos griegos está pendiente.
  - marker: b
    text: La frase final es especialmente difícil. También podría entenderse con otras relaciones entre «descanso», «tiempo», «estación» y «era». La traducción conserva su secuencia sin convertirla en una afirmación explícita sobre el descanso eterno.
    reason: Preservar la ambigüedad textual y teológica del pasaje mientras continúa pendiente la revisión de las fuentes antiguas.
lexical_decisions:
- source_word: Desire
  choice: Deseo
  rationale: Se conserva como nombre personificado del poder, con mayúscula, sin especificar si se trata de deseo sexual, apetito o deseo en sentido amplio.
- source_word: power
  choice: poder
  rationale: Mantiene la designación cosmológica general del testimonio sin sustituirla por «potestad», término con resonancias bíblicas más específicas.
- source_word: garment
  choice: vestidura
  rationale: Expresa con dignidad la metáfora corporal y conserva su posible sentido simbólico sin explicarlo.
- source_word: Zeal for Death
  choice: Celo por la Muerte
  rationale: Traducción deliberadamente literal que preserva la extrañeza y la ambigüedad de «zeal».
- source_word: type
  choice: figura
  rationale: «Figura» comunica una forma o modelo representativo mejor que el tecnicismo moderno «tipo», aunque el pasaje sigue siendo oscuro.
- source_word: rest
  choice: descanso
  rationale: Conserva el posible sentido espiritual o escatológico sin imponer «reposo eterno».
- source_word: space
  choice: espacio
  rationale: Se mantiene la formulación del testimonio disponible y no se interpreta como «mundo», «región» o «cosmos».
theological_decisions:
- issue: Naturaleza de los poderes
  choice: Conservar «poder» y personificar sus nombres mediante mayúsculas
  alternative: Identificarlos explícitamente como demonios, arcontes o pasiones internas
  rationale: El texto los presenta como poderes, pero no resuelve por sí solo su ontología; la traducción no debe imponer una cosmología específica.
- issue: Lenguaje sobre la disolución universal
  choice: «todo se disolverá»
  alternative: «todo será destruido» o «todo pasará»
  rationale: «Disolverse» conserva la imagen y su tensión cosmológica sin definir el modo ni el alcance de esa disolución.
- issue: Liberación de mundos y figuras
  choice: Mantener la sintaxis repetitiva y oscura, con restauraciones entre corchetes
  alternative: Parafrasear como liberación del mundo material y del cuerpo
  rationale: Una paráfrasis doctrinal resolvería indebidamente un pasaje textual y conceptualmente incierto.
- issue: Declaración final sobre tiempo, estación y era
  choice: Conservar los tres términos coordinados
  alternative: Reducirlos a «el descanso eterno»
  rationale: La reducción produciría una lectura teológica más clara que el testimonio y eliminaría su formulación temporal enigmática.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se mantienen los corchetes de las restauraciones transmitidas por el testimonio base. Los nombres personificados llevan mayúscula. El femenino de «alma» determina «atada», «asesina» y «vencedora» en las intervenciones dirigidas al alma. Borrador necesariamente provisional: la evidencia suministrada declara pendiente la revisión directa del copto y de los fragmentos griegos.'
