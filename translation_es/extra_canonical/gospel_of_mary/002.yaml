base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: es
  text: 'Cuando el Bendito terminó de decir estas cosas, los saludó a todos y dijo: «¡La paz sea con ustedes! Hagan suya mi paz. Cuídense de que nadie los engañe diciendo: “¡Miren aquí!” o “¡Miren allá!”. Porque el Hijo de la Humanidad está dentro de ustedes. ¡Síganlo! Quienes lo buscan lo encontrarán.


    »Vayan, pues, y anuncien la buena noticia acerca del reino. No impongan ninguna regla aparte de lo que les he dado, ni establezcan una ley como el legislador, para que no queden atados por ella».[a] Después de decir estas cosas, se fue.


    Pero ellos se entristecieron y lloraron amargamente. Decían: «¿Cómo podremos ir a los gentiles a anunciar la buena noticia acerca del reino del Hijo de la Humanidad?[b] Si no lo perdonaron a él, ¿por qué habrían de perdonarnos a nosotros?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La traducción de esta advertencia es provisional. También podría expresarse: «no dicten una ley como el legislador, no sea que queden sujetos a ella».'
    reason: Preserva la posible amplitud jurídica y espiritual de «make a law» y «be bound» mientras esté pendiente la revisión directa del copto y del griego.
  - marker: b
    text: La expresión «Hijo de la Humanidad» reproduce de manera provisional el testimonio inglés «Son of Humanity». La revisión directa del copto y de los fragmentos griegos podría favorecer otra formulación, como la tradicional «Hijo del Hombre».
    reason: La base proporcionada es un testimonio inglés y señala expresamente que la revisión de las lenguas antiguas aún está pendiente.
lexical_decisions:
- source_word: the Blessed One
  choice: el Bendito
  rationale: Conserva el título reverencial del testimonio sin identificarlo mediante un título doctrinal más específico.
- source_word: Acquire my peace
  choice: Hagan suya mi paz
  rationale: Expresa en español natural la idea de adquirir o apropiarse de esa paz, sin reducirla simplemente a recibirla.
- source_word: Son of Humanity
  choice: Hijo de la Humanidad
  rationale: Mantiene la formulación distintiva del testimonio inglés y evita sustituirla sin revisión copta y griega por la expresión tradicional «Hijo del Hombre».
- source_word: gospel
  choice: buena noticia
  rationale: Comunica el sentido básico de proclamación favorable en lenguaje actual y digno.
- source_word: Gentiles
  choice: gentiles
  rationale: Conserva el término histórico-religioso usual; aquí designa a las naciones o pueblos no judíos.
- source_word: lawgiver
  choice: legislador
  rationale: Es la correspondencia directa y neutral, sin identificar de manera explícita a una figura no nombrada en el testimonio.
theological_decisions:
- issue: Ubicación del Hijo de la Humanidad
  choice: «está dentro de ustedes»
  alternative: «está entre ustedes»
  rationale: El testimonio suministrado dice «within you». Se conserva esa lectura teológicamente significativa, aunque la revisión directa de las fuentes antiguas sigue pendiente.
- issue: Relación entre reglas, ley y sujeción
  choice: «para que no queden atados por ella»
  alternative: «no sea que ella los ate»
  rationale: Mantiene la advertencia y su posible sentido jurídico o espiritual sin precisar indebidamente la naturaleza de esa atadura.
- issue: Alcance de «reino del Hijo de la Humanidad»
  choice: Se conserva la frase completa en la pregunta de los discípulos
  alternative: Entender «del Hijo de la Humanidad» como modificación secundaria o como referencia independiente
  rationale: El testimonio disponible vincula gramaticalmente el reino con el Hijo de la Humanidad; la nota advierte que la revisión de los manuscritos está pendiente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y formas verbales correspondientes. La redacción es provisional porque el encargo aporta como base efectiva un testimonio inglés de dominio público y no el texto copto o griego transcrito; por eso se evitan afirmaciones de certeza filológica donde la revisión de las fuentes antiguas sigue pendiente.
