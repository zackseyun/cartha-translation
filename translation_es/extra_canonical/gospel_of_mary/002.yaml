    text: 'La traducción de esta advertencia es provisional. También podría expresarse: «no dicten una ley como el legislador, no sea que queden sujetos a ella».'
    reason: Preserva la posible amplitud jurídica y espiritual de «make a law» y «be bound» mientras esté pendiente la revisión directa del copto y del griego.
  - marker: b
    text: La expresión «Hijo de la Humanidad» reproduce de manera provisional el testimonio inglés «Son of Humanity». La revisión directa del copto y de los fragmentos griegos podría favorecer otra formulación, como la tradicional «Hijo del Hombre».
    reason: La base proporcionada es un testimonio inglés y señala expresamente que la revisión de las lenguas antiguas aún está pendiente.
