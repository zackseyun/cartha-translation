  naturalness: El español es moderno, neutro y generalmente fluido. Se corrige el punto indebido después de interrogaciones entre comillas y se suaviza una repetición sintáctica sin alterar el contenido.
  terminology: Se mantienen de forma consistente «autoridades», «Padre Primordial», «eón», «Pistis», «Sofía Zoé», «Sabaot», «andrógino», «Bestia» y «Maestro». «Entidades creadas» conserva deliberadamente la literalidad y la ambigüedad del testimonio.
  issues:
  - severity: low
    issue: Puntuación de interrogaciones en discurso directo
    rationale: El borrador coloca un punto después de comillas que cierran una pregunta («...?».). En español, el signo de cierre de interrogación ya cumple la función de cierre oracional; el punto debe suprimirse.
  - severity: low
    issue: Presentación de la laguna tras «semejanza»
    rationale: La ubicación de [a] entre «semejanza» y «de este ser» puede conservarse, pero conviene que la nota indique expresamente que la relación sintáctica posterior se mantiene sin reconstruir el texto perdido.
