translation:
  language: es
  text: 'Antes de que Adán de Luz se retirara al interior del Caos, las autoridades lo vieron y se burlaron del Padre Primordial, porque les había mentido al decir: «Yo soy el que es Dios. Nadie existió antes que yo».


    Cuando se acercaron a él, preguntaron: «¿No es este el dios que echó a perder nuestra obra?».


    Él respondió: «Sí. Si quieren impedir que eche a perder nuestra obra, vengan, hagamos un ser humano de tierra para que nos sirva, conforme a la imagen de nuestro cuerpo y conforme a la semejanza [a] de este ser. Así, cuando contemple su propia semejanza, se enamorará de ella y ya no echará a perder nuestra obra. En cambio, haremos siervos para nosotros de quienes nacen de la luz durante todo el tiempo de este eón».[b]


    Todo esto sucedió conforme a la previsión de Pistis,[c] para que el ser humano apareciera según la semejanza de aquel, los denunciara por causa de la forma que habían modelado, y esa forma modelada se convirtiera en un lugar que encerrara la luz.


    Entonces las autoridades obtuvieron el conocimiento necesario para crear al ser humano. Sofía Zoé,[d] la que habita con Sabaot, había previsto lo que harían y se burló de su decisión, porque son ciegos. En contra de sus propios intereses, lo crearon en su ignorancia, sin comprender lo que estaban a punto de emprender.


    Ella se les adelantó e hizo primero su propio ser humano, para que este pudiera enseñar a la forma que ellos habían modelado a odiarlos y, de este modo, a escapar de ellos.


    El maestro fue producido de la siguiente manera: cuando Sofía dejó descender una gota de luz, esta fluyó sobre el agua, e inmediatamente apareció un ser humano andrógino.[e] Primero, ella dio a aquella gota la forma de un cuerpo femenino. Después, valiéndose de ese cuerpo, le dio la semejanza de la madre que había aparecido anteriormente, y lo completó en el transcurso de doce meses.


    Había sido producido un ser humano andrógino, al que los griegos llaman Hermafrodita, y a cuya madre los hebreos llaman Eva de Zoé, es decir, la maestra de la vida. Su hijo es la entidad creada que es señor. Después, las autoridades [f] lo llamaron «la Bestia», para que pudiera extraviar a las entidades creadas que habían modelado.[g] «La Bestia» se interpreta como «el Maestro», porque resultó ser el más astuto de todos los seres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquí el manuscrito o el testimonio presenta una laguna después de «semejanza»; no se completa con una conjetura.
    reason: Preservar la señal de pérdida textual indicada por los corchetes de la fuente.
  - marker: b
    text: «Eón» es un término cosmológico que puede designar una edad o ámbito del orden del mundo.
    reason: Aclarar un tecnicismo antiguo sin reemplazarlo por una interpretación única.
  - marker: c
    text: Pistis es un nombre griego que significa «Fe».
    reason: Dar el sentido del nombre conservando su función como figura personificada.
  - marker: d
    text: Los nombres griegos Sofía y Zoé significan «Sabiduría» y «Vida», respectivamente.
    reason: Hacer accesible el juego conceptual de los nombres propios.
  - marker: e
    text: «Andrógino» indica aquí un ser que reúne rasgos masculinos y femeninos.
    reason: Aclarar el sentido histórico del término en lenguaje comprensible.
  - marker: f
    text: En este punto el testimonio señala una laguna textual después de «las autoridades».
    reason: Conservar la indicación de texto perdido y advertir que la continuidad sintáctica es incierta.
  - marker: g
    text: 'La construcción de esta frase es incierta: no queda claro quién modeló a las entidades creadas, y el texto puede estar dañado.'
    reason: Preservar la ambigüedad explícitamente reconocida en el testimonio en lugar de resolverla por conjetura.
lexical_decisions:
- source_word: authorities
  choice: las autoridades
  rationale: Conserva el término cosmológico del testimonio sin identificarlo interpretativamente con gobernantes humanos, arcontes u otra categoría doctrinal.
- source_word: Primal Parent
  choice: Padre Primordial
  rationale: Expresa la anterioridad y la función parental del título; se opta por el masculino porque el referente inmediato recibe pronombres masculinos en el testimonio.
- source_word: man / human
  choice: ser humano
  rationale: En la mayor parte del pasaje representa mejor el valor genérico y evita confundir al personaje creado con un varón específicamente sexuado; se conserva «Adán» como nombre propio.
- source_word: aeon
  choice: eón
  rationale: Mantiene el tecnicismo cosmológico antiguo y evita reducirlo sin más a «mundo» o «época».
- source_word: Pistis
  choice: Pistis
  rationale: Se conserva como nombre o hipóstasis; una nota ofrece su sentido léxico sin convertirlo silenciosamente en el sustantivo común «fe».
- source_word: Sophia Zoe
  choice: Sofía Zoé
  rationale: Se transliteran los nombres propios con acentuación natural en español; la nota explica sus sentidos léxicos.
- source_word: androgynous human
  choice: ser humano andrógino
  rationale: Mantiene la descripción dual del texto y su tensión con la formación inicial como cuerpo femenino.
- source_word: teacher
  choice: maestro / maestra
  rationale: Se conserva la designación pedagógica, ajustando el género gramatical cuando el texto identifica a la madre como maestra de la vida.
- source_word: cleverest
  choice: el más astuto
  rationale: «Astuto» conserva la posible valoración ambivalente del personaje y la resonancia de sagacidad sin imponer que sea sabiduría moral.
- source_word: shaped form
  choice: forma modelada
  rationale: Reproduce la repetición conceptual entre formar/modelar y forma, importante en la antropología del pasaje.
theological_decisions:
- issue: Identidad del hablante que propone crear al ser humano
  choice: Mantener los referentes pronominales y el diálogo sin identificarlo por nombre.
  alternative: Identificar explícitamente al Padre Primordial, al dios mencionado o a una autoridad concreta como hablante.
  rationale: El testimonio suministrado deja una cadena referencial susceptible de más de una lectura; nombrar al hablante resolvería una ambigüedad real sin revisión copta directa.
- issue: Referente de «su semejanza» en la previsión de Pistis
  choice: Traducir «según la semejanza de aquel» sin fijar la identidad del antecedente.
  alternative: Precisar «según la semejanza de Adán de Luz», «de Dios» o «del ser celestial».
  rationale: El inglés testigo conserva un pronombre masculino ambiguo; se mantiene la tensión hasta efectuar la revisión de la fuente copta.
- issue: Función salvadora de la creación de Sofía
  choice: Presentarla como instrucción para odiar a las autoridades y escapar de ellas.
  alternative: Reformular «odiar» como rechazo, resistencia o liberación espiritual.
  rationale: La formulación fuerte pertenece al argumento del texto y no debe suavizarse por preferencias teológicas posteriores.
- issue: Identidad de la Bestia y del Maestro
  choice: Conservar la identificación paradójica «la Bestia» / «el Maestro».
  alternative: Armonizarla con la serpiente de Génesis, el diablo u otra figura conocida.
  rationale: El escrito ofrece su propia interpretación y no debe subsumirse bajo una lectura confesional externa.
- issue: Oración ambigua sobre las entidades creadas que habían modelado
  choice: Traducirla de manera formal y añadir una nota que advierta la incertidumbre.
  alternative: Enmendarla para decir que la Bestia extravía a las criaturas modeladas por las autoridades, o que guía a quienes modelaron las entidades.
  rationale: El testimonio reconoce que la frase final no debe armonizarse; la traducción conserva su sintaxis difícil mientras señala la posibilidad de corrupción o laguna textual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean oraciones claras, pero se conservan los tecnicismos cosmológicos, las repeticiones significativas y las ambigüedades del testimonio. El borrador es necesariamente provisional porque la revisión directa del copto está pendiente; se funda en el testimonio inglés público suministrado y no introduce identificaciones doctrinales externas.
