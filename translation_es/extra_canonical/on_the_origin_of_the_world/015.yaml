    Todo esto sucedió conforme a la previsión de Pistis,[b] para que el ser humano apareciera a su semejanza, los denunciara a causa de su forma modelada, y su forma modelada se convirtiera en un lugar que encerrara la luz.


    Entonces las autoridades obtuvieron el conocimiento necesario para crear al ser humano. Sofía Zoé,[c] la que habita con Sabaot, había previsto lo que harían y se burló de su decisión, porque son ciegos. En contra de sus propios intereses, lo crearon en su ignorancia, sin comprender lo que estaban a punto de emprender.


    Ella se les adelantó e hizo primero su propio ser humano, para que este pudiera enseñar a la forma que ellos habían modelado a odiarlos y, de este modo, a escapar de ellos.


