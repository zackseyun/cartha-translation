base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: es
  text: 'Cuando Sofía Zoe vio que los arcontes de la oscuridad maldecían a sus compañeros, se llenó de furia. Salió del primer cielo con pleno poder, persiguió a aquellos arcontes, los expulsó de [sus] cielos y los arrojó al mundo de la transgresión, para hacerlos habitar allí como demonios malvados sobre la tierra.


    [Envió un ave][a] […] [b] que, en el mundo de ellos, pasaría sus mil años en el Paraíso: una criatura viviente dotada de alma, llamada «fénix». Esta se da muerte y vuelve a la vida para dar testimonio del juicio decretado contra ellos, porque maltrataron a Adán y a su linaje, hasta la consumación de la era.


    Hay tres clases de seres humanos, así como sus descendientes, hasta la consumación del mundo: los dotados de espíritu, los dotados de alma y los terrenales. De igual manera, hay tres fénix <dentro> del Paraíso[c]: el primero no muere; el segundo vive mil años. Acerca del tercero está escrito en la Sagrada Escritura que es consumido. Asimismo, hay tres bautismos: el primero es espiritual; el segundo, con fuego; y el tercero, con agua.


    Así como el fénix simboliza a los ángeles, también la hidria de agua de Egipto[d] simboliza a quienes descienden al bautismo de un hombre verdadero.


    Los dos toros de Egipto tienen un significado simbólico, a saber, el sol y la luna. Esto es un símbolo de Sabaot, porque Sofía obtuvo el universo desde el día en que formó el sol y la luna y puso un sello sobre su cielo, hasta que termine la era.


    También el gusano nacido del fénix simboliza a un ser humano, acerca del cual está escrito: «El justo florecerá como un fénix»[e]. El fénix aparece primero vivo, luego muere y vuelve a levantarse, y así sirve como símbolo de lo que sucederá en la consumación de la era.


    Estos poderosos símbolos aparecieron únicamente en Egipto y no en ningún otro lugar, para indicar […] [f] que este se asemeja al Paraíso de Dios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Las palabras «Envió un ave» son una restitución editorial de una porción dañada del manuscrito.
    reason: Distinguir el texto reconstruido del texto conservado.
  - marker: b
    text: Hay una laguna en el manuscrito después de la referencia al ave.
    reason: Señalar material ausente sin conjeturar su contenido.
  - marker: c
    text: «Dentro» es una inserción editorial destinada a completar la construcción del texto.
    reason: Conservar la señal editorial indicada mediante corchetes angulares en el testimonio.
  - marker: d
    text: El término vertido «hidria» es incierto. El testimonio inglés lo conserva como water hydri, sin identificar con seguridad si designa un animal, un recipiente u otra realidad simbólica.
    reason: Evitar una identificación especulativa mientras está pendiente la revisión directa del copto.
  - marker: e
    text: Alusión al Salmo 92:12 (91:13 en la numeración griega). La palabra subyacente en la tradición griega, phoinix, puede entenderse como «palmera» y también evoca «fénix»; el tratado explota la lectura «fénix».
    reason: Explicar por qué la cita difiere de la traducción bíblica habitual y preservar el juego simbólico del tratado.
  - marker: f
    text: Hay una laguna antes de la afirmación final.
    reason: Indicar la discontinuidad textual y la incertidumbre del vínculo sintáctico.
lexical_decisions:
- source_word: Sophia Zoe
  choice: Sofía Zoe
  rationale: Se transliteran ambos elementos como nombre compuesto, sin traducirlos como «Sabiduría Vida», para no imponer una interpretación sobre su función nominal en el tratado.
- source_word: archons
  choice: arcontes
  rationale: Término técnico habitual en traducciones de literatura gnóstica; «gobernantes» sería más transparente, pero perdería parte de su carácter cosmológico específico.
- source_word: plenary power
  choice: pleno poder
  rationale: Conserva la afirmación enfática de autoridad completa sin ampliar su sentido.
- source_word: race
  choice: linaje
  rationale: En «Adán y su linaje», expresa descendencia de manera natural y evita las connotaciones modernas de «raza».
- source_word: men
  choice: clases de seres humanos
  rationale: El contexto presenta tres categorías y luego incluye a sus descendientes; esta formulación comunica el valor genérico sin limitarlo explícitamente a varones.
- source_word: imbued with spirit / imbued with soul / earthly
  choice: dotados de espíritu / dotados de alma / terrenales
  rationale: Mantiene la clasificación tripartita y su paralelismo sin identificarla con categorías doctrinales posteriores.
- source_word: consummation of the age
  choice: consumación de la era
  rationale: Conserva el lenguaje escatológico y la distinción respecto de «consumación del mundo» presente en el párrafo siguiente.
- source_word: water hydri
  choice: hidria de agua
  rationale: Se conserva mediante transliteración aproximada el término incierto del testimonio inglés, sin identificarlo especulativamente con un objeto o animal concreto.
- source_word: true man
  choice: hombre verdadero
  rationale: Traducción formal que mantiene abierta la posibilidad de que se trate de una figura específica o de una cualidad humana.
- source_word: Sabaoth
  choice: Sabaot
  rationale: Forma española tradicional del nombre, sin explicar ni reinterpretar su identidad dentro de la cosmología del tratado.
- source_word: worm
  choice: gusano
  rationale: Mantiene la imagen concreta y la secuencia de nacimiento desde el fénix.
- source_word: phoenix
  choice: fénix
  rationale: Es indispensable para la red simbólica del pasaje; en la cita escritural se conserva aun cuando la tradición bíblica suele verter el término relacionado como «palmera».
theological_decisions:
- issue: Clasificación tripartita de la humanidad
  choice: 'Se presenta como tres clases: dotados de espíritu, dotados de alma y terrenales.'
  alternative: Interpretarlas con etiquetas técnicas como «pneumáticos, psíquicos e hílicos».
  rationale: La traducción mantiene las categorías expresadas por el texto sin importar terminología doctrinal especializada ni desarrollar un sistema teológico implícito.
- issue: Naturaleza del fénix y su retorno a la vida
  choice: «Se da muerte y vuelve a la vida».
  alternative: «Se suicida y se resucita a sí mismo».
  rationale: La opción elegida conserva la agencia reflexiva y el retorno a la vida, pero evita que «resucitar» determine de forma innecesaria el mecanismo o su equivalencia exacta con la resurrección teológica.
- issue: Relación simbólica con Sabaot
  choice: «Esto es un símbolo de Sabaot».
  alternative: Precisar que el símbolo es exclusivamente el sol y la luna, los dos toros o el conjunto de ambos.
  rationale: El antecedente es incierto en el testimonio disponible; se conserva la ambigüedad en vez de resolverla.
- issue: Sofía y el universo
  choice: «Sofía obtuvo el universo».
  alternative: «Sofía tomó posesión del universo» o «recibió el universo».
  rationale: «Obtuvo» conserva la formulación del testimonio sin decidir si la adquisición fue recepción, conquista o posesión legítima.
- issue: Referente final de «este»
  choice: «que este se asemeja al Paraíso de Dios».
  alternative: Explicitar «que Egipto se asemeja al Paraíso de Dios».
  rationale: Aunque Egipto parece el referente más probable, el texto está dañado; el pronombre preserva cierta incertidumbre.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen «arcontes», «Sofía Zoe», «Sabaot» y «fénix» como vocabulario propio de la cosmología del tratado. Los corchetes, los puntos suspensivos entre corchetes y los corchetes angulares distinguen respectivamente restituciones, lagunas e inserciones editoriales. El borrador es necesariamente provisional porque la evidencia proporcionada se limita a un testimonio inglés de dominio público y la revisión directa de la fuente copta está pendiente.
