review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado y conserva apropiadamente las lagunas ([. . .], []), la restauración <dentro> y las grafías variables del nombre. Se requiere una corrección menor: en la primera descripción de los celos, el testimonio dice «an abortion», no específicamente «an aborted fetus»; «un aborto» conserva mejor la imagen y evita anticipar una precisión presente solo en el pasaje posterior.'
  naturalness: El español es claro, moderno y apropiado para un registro mítico-cosmológico. Se ajustaron algunas formulaciones para conservar la impersonalidad del referente («se trataba de un aborto») y la recurrencia de «semejanza» sin perder fluidez.
  terminology: «Eón», «arconte», «hueste», «Pistis», «Sophia» y las variantes de Yaldabaoth están bien manejados. Se conserva «habla articulada» y no se resuelve doctrinalmente la relación entre Pistis y Sophia. La nota sobre Ariael se limita al vínculo que el propio pasaje establece, sin añadir una etimología comparativa que no es necesaria para traducir el testimonio.
  issues:
  - severity: low
    issue: «Feto abortado» en la primera aparición de los celos
    rationale: El testimonio distingue entre «an abortion» en este lugar y «like an aborted fetus» más adelante. «Un aborto» reproduce de forma más precisa el primer término; el segundo pasaje conserva «como un feto abortado».
  - severity: low
    issue: Nota g añade una comparación etimológica externa con «Ariel»
    rationale: El pasaje solo explica «Ariael» por la semejanza con un león. Limitar la nota a esa relación explícita evita presentar una comparación externa como si fuera parte del texto.
