  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: es
  text: 'Después que la forma natural de los seres inmortales terminó de desarrollarse a partir de la infinitud, emanó de Pistis una imagen llamada Sophia.[a] Ella ejerció su voluntad y llegó a ser un ser creado semejante a la luz primordial. Enseguida, su voluntad se manifestó con la semejanza del cielo y con una extensión incomprensible, situada entre los seres inmortales y los seres que llegaron a existir después, semejante a [. . .]. Actuó como un velo que separaba a la humanidad de los seres de arriba.


    Ahora bien, el eón de la Verdad no tiene sombra exterior, porque la luz infinita habita por todas partes dentro de él.[b] Sin embargo, fuera de él hay una sombra llamada «Oscuridad». De ella surgió una hueste que gobernó sobre la oscuridad, y las huestes que llegaron a existir después llamaron a la sombra «Caos Infinito». De ella brotó hacia arriba toda clase de divinidad [. . .], junto con todo el lugar. El resultado adicional fue que la sombra vino después del primer ser creado []. Apareció <dentro> del Abismo y tuvo su origen en la Pistis antes mencionada.[c]


    Entonces la sombra comprendió que existía algo más poderoso que ella y sintió envidia. Al quedar embarazada por su propia voluntad, dio a luz inmediatamente a los celos. Desde aquel día se ha hecho evidente la ley de los celos que impera entre todos los eones y sus mundos. En cuanto a esos celos, se descubrió que eran un feto abortado, sin espíritu alguno en su interior. Llegaron a existir como una sombra dentro de una inmensa sustancia acuosa. Después, la bilis que había surgido de la sombra fue arrojada a una región del Caos.


    Desde aquel día se ha hecho evidente una sustancia acuosa, y lo que se hundió dentro de ella se derramó mientras permanecía visible en el Caos. Así como, cuando una mujer da a luz a un hijo, toda la materia acumulada en ella se derrama, así también la materia llegó a existir a partir de una sombra y fue expulsada de ella, pero no salió del Caos.


    La manifestación de Yaldabaoth


    La materia, por el contrario, permaneció dentro del Caos, en una de sus regiones. Después de que sucedieron estas cosas, Pistis llegó y se manifestó sobre la materia del Caos, que había sido expulsada como un feto abortado, pues ningún espíritu habitaba en ella: era por completo oscuridad infinita y agua sin fondo. Cuando Pistis vio lo que había resultado de su defecto, se turbó. Su turbación se manifestó como un ser creado aterrador que se precipitó hacia ella en el Caos. Ella se volvió hacia él y sopló en su rostro dentro del Abismo, que se encuentra debajo de [] todos los cielos. Entonces Pistis Sophia quiso que el ser sin espíritu recibiera una forma semejante y gobernara sobre la materia y sobre todas sus huestes. Por primera vez se manifestó desde las aguas un arconte andrógino semejante a un león, que poseía en sí mismo gran autoridad y no sabía de dónde había llegado a existir.[d]


    Mientras Pistis Sophia lo observaba moverse en las profundidades acuosas, le dijo:


    —Hijo, pasa acá.


    Esto equivale a yalda-baoth.[e] Desde aquel día se manifestó la ley del habla articulada, que se extendió a los dioses, a los ángeles y a la humanidad. Y lo que había llegado a existir por medio del habla articulada fue llevado a término por los dioses, los ángeles y la humanidad.


    Ahora bien, el arconte Yaltabaoth desconocía el poder de Pistis. No veía su rostro, sino la imagen que hablaba con él en el agua. A causa de aquella voz se llamó a sí mismo «Yald<ab>aoth».[f] Sin embargo, los perfectos lo llaman «Ariael», porque se parecía a un león.[g]


    Cuando obtuvo autoridad sobre la materia, Pistis Sophia se retiró hacia arriba, a su luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Pistis» y «Sophia» son formas griegas que significan «Fe» y «Sabiduría», respectivamente. Aquí funcionan como nombres propios de figuras del relato.
    reason: Aclara nombres semánticamente significativos sin sustituirlos ni resolver su relación.
  - marker: b
    text: Un «eón» puede designar una realidad, ámbito o era de carácter eterno; en este texto forma parte del vocabulario cosmológico.
    reason: Hace accesible un término técnico poco común.
  - marker: c
    text: Los corchetes vacíos señalan una laguna del manuscrito; los puntos entre corchetes indican texto perdido, y los ángulos marcan una restauración editorial.
    reason: Explica las señales textuales conservadas en el cuerpo principal.
  - marker: d
    text: «Arconte» significa «gobernante» o «autoridad»; en este relato designa a un gobernante cósmico.
    reason: Aclara el sentido del préstamo técnico.
  - marker: e
    text: El texto relaciona la expresión dirigida al arconte con la forma «yalda-baoth». La etimología exacta y la segmentación del nombre son inciertas.
    reason: Preserva el juego etimológico del testimonio sin presentarlo como lingüísticamente seguro.
  - marker: f
    text: Se conservan las grafías variables «Yaldabaoth», «Yaltabaoth», «yalda-baoth» y «Yald<ab>aoth». En la última, las letras entre ángulos representan una restauración editorial.
    reason: Da cuenta de variantes y restauraciones presentes en el testimonio.
  - marker: g
    text: «Ariael» se relaciona aquí con la semejanza de un león; compárese la forma «Ariel», que puede entenderse como «león de Dios».
    reason: Aclara el juego nominal explícito sin imponer una equivalencia textual absoluta.
lexical_decisions:
- source_word: Pistis / Sophia
  choice: Pistis / Sophia
  rationale: Se conservan como nombres propios técnicos del relato; traducirlos como «Fe» y «Sabiduría» podría borrar su función como figuras personificadas, aunque sus sentidos se aclaran en nota.
- source_word: aeon
  choice: eón
  rationale: El préstamo «eón» conserva el valor cosmológico técnico y evita reducirlo sin fundamento a «época» o «mundo».
- source_word: archon
  choice: arconte
  rationale: «Arconte» es el término técnico habitual para una autoridad o gobernante cósmico en estos escritos; «gobernante» sería más transparente, pero menos preciso en este contexto.
- source_word: host
  choice: hueste
  rationale: «Hueste» mantiene el sentido colectivo de un conjunto organizado de seres y el tono cosmológico, sin identificarlo necesariamente como ejército.
- source_word: likeness
  choice: imagen / semejanza / forma semejante
  rationale: Se traduce según la sintaxis inmediata para mantener un español natural, conservando la idea recurrente de representación o configuración semejante sin imponer una ontología más precisa.
- source_word: articulate speech
  choice: habla articulada
  rationale: Expresa la aparición del lenguaje verbal inteligible, sin reducirla meramente a pronunciación o a una palabra creadora técnicamente definida.
- source_word: bile
  choice: bilis
  rationale: Se mantiene la imaginería corporal literal y extraña del testimonio, en vez de suavizarla como «amargura».
- source_word: defect
  choice: defecto
  rationale: Conserva la valoración del pasaje sin especificar si se trata de falta moral, error o deficiencia ontológica.
- source_word: androgynous
  choice: andrógino
  rationale: Reproduce directamente la caracterización dual del arconte sin explicarla o armonizarla.
theological_decisions:
- issue: Condición de Pistis Sophia y relación entre Pistis y Sophia
  choice: Mantener ambos nombres y la afirmación de que Sophia emana de Pistis, sin identificarlas plenamente ni separarlas mediante explicación doctrinal.
  alternative: Traducir «Pistis» como Fe y «Sophia» como Sabiduría, o tratarlas como una sola entidad desde el inicio.
  rationale: El relato alterna «Pistis» y «Pistis Sophia» y presenta inicialmente a Sophia como emanada de Pistis; la traducción preserva esa tensión interna.
- issue: Origen de la sombra y del Caos
  choice: Conservar la secuencia ambigua que vincula la sombra exterior, Pistis y el Abismo.
  alternative: Explicar la sombra como creación deliberada de Pistis o como realidad completamente independiente.
  rationale: El texto fragmentario no permite resolver con seguridad la relación causal exacta.
- issue: Naturaleza de los celos abortados
  choice: Presentarlos con la metáfora literal de un feto abortado carente de espíritu.
  alternative: Parafrasearlos como una creación imperfecta o espiritualmente muerta.
  rationale: La imagen gestacional estructura todo el episodio y no debe diluirse en una interpretación teológica.
- issue: Insuflación de Pistis Sophia y formación del arconte
  choice: Narrar que sopla en el rostro del ser y luego quiere que reciba forma y dominio, sin afirmar explícitamente que le comunica espíritu.
  alternative: Interpretar el soplo como impartición de alma o espíritu divino.
  rationale: El pasaje llama al ser «sin espíritu» y no declara de manera inequívoca que el soplo elimine esa condición.
- issue: Autoridad de Yaldabaoth
  choice: Conservar que posee y obtiene autoridad sobre la materia, sin calificarla como legítima, usurpada o delegada.
  alternative: Describir su gobierno como ilícito o como comisión directa de Sophia.
  rationale: El relato vincula su aparición con la voluntad de Pistis Sophia, pero también destaca su ignorancia; la tensión debe permanecer.
- issue: «Los perfectos»
  choice: Mantener la designación interna sin definir quiénes son.
  alternative: Identificarlos con una iglesia, grupo gnóstico o clase de iniciados específica.
  rationale: La fuente no ofrece aquí suficiente base para una identificación confesional o histórica precisa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvo el tono mítico-cosmológico y la repetición deliberada del original, al tiempo que se aligeraron algunas cadenas sintácticas para facilitar la lectura. Se preservaron lagunas, puntos suspensivos editoriales, restauraciones entre ángulos y grafías nominales variables. Dado que la revisión directa del copto está pendiente y la base suministrada es un testimonio inglés de dominio público, las decisiones deben considerarse provisionales y sujetas a cotejo con Nag Hammadi Codex II,5 y testigos relacionados.
