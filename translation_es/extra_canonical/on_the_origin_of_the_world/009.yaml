base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: es
  text: 'Después de contemplar en las aguas la imagen de Pistis[a], el Progenitor Primordial se entristeció profundamente, sobre todo al oír la voz de ella, que se parecía a la primera voz que lo había llamado desde las aguas. Gimió al darse cuenta de que ella era quien le había dado un nombre. Se avergonzó de su pecado y, cuando supo con certeza que antes que él había existido un hombre de luz inmortal, quedó profundamente perturbado, pues anteriormente había proclamado a todos los dioses y a sus ángeles: «Yo soy el que es Dios. Fuera de mí no existe nada más». Lo había dicho porque temía que descubrieran que alguien había existido antes que él y lo denunciaran.


    Sin embargo, falto de discernimiento, se rio ante la posibilidad de que lo denunciaran y actuó con temeridad. Dijo: «Si […] algo existía antes que yo, que se presente para que contemplemos su luz»[b]. Y de inmediato, ¡miren!: una luz salió de lo alto, del octavo cielo, y atravesó todos los cielos de la tierra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pistis es un nombre griego que significa «fe» o «fidelidad».
    reason: Aclara el significado del nombre propio sin traducirlo dentro del relato.
  - marker: b
    text: El texto presenta aquí una laguna; no se sabe qué palabra o palabras faltan.
    reason: Representa en español la señal de daño o restauración manuscrita indicada por los corchetes vacíos del testimonio.
lexical_decisions:
- source_word: Pistis
  choice: Pistis
  rationale: Se conserva el nombre griego transliterado, pues aquí funciona como nombre propio; una nota informa su sentido léxico sin sustituirlo por una interpretación.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Expresa la función parental y la prioridad del personaje con lenguaje digno y natural, sin imponer género más allá de lo que refleja el testimonio disponible.
- source_word: deathless man of light
  choice: hombre de luz inmortal
  rationale: Mantiene los componentes de la expresión del testimonio —ser humano masculino, luz e inmortalidad— sin explicarlos teológicamente.
- source_word: denounce
  choice: denunciar
  rationale: Conserva la idea de acusación o exposición pública y evita concretar una autoridad o castigo no especificados.
- source_word: eighth heaven
  choice: octavo cielo
  rationale: Traducción directa que preserva la cosmología propia del escrito.
- source_word: all the heavens of the earth
  choice: todos los cielos de la tierra
  rationale: Se conserva la formulación extraña y posiblemente técnica, en vez de normalizarla como «cielos inferiores».
theological_decisions:
- issue: La afirmación de exclusividad divina del Progenitor Primordial
  choice: «Yo soy el que es Dios. Fuera de mí no existe nada más»
  alternative: «Yo soy Dios y no hay otro fuera de mí»
  rationale: La versión elegida conserva el énfasis y la formulación singular del testimonio sin armonizarla con fórmulas bíblicas conocidas.
- issue: Identidad y naturaleza del ser anterior
  choice: «un hombre de luz inmortal»
  alternative: «el Hombre inmortal de luz»
  rationale: Se mantiene el artículo indefinido del testimonio y no se convierte la expresión en título técnico sin confirmación del copto.
- issue: Respuesta ante la posible denuncia
  choice: «se rio ante la posibilidad de que lo denunciaran»
  alternative: «se burló de la denuncia»
  rationale: Hace explícito solo lo que los paréntesis editoriales del testimonio sugieren y preserva la ambigüedad sobre si se ríe de la posibilidad, la amenaza o el acto mismo.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se favorece una equivalencia óptima: sintaxis natural con conservación de términos cosmológicos, repeticiones significativas y tensiones teológicas. Dado que la revisión directa del copto está pendiente, las decisiones se basan provisionalmente en el testimonio inglés público suministrado; la laguna se marca como […] y no se reconstruye.'
