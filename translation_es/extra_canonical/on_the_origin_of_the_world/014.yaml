base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: es
  text: '[][a] Tal como lo deseaba, Sofía, que habitaba en el cielo inferior, recibió autoridad de Pistis. Formó grandes cuerpos luminosos y todas las estrellas, y los colocó en el cielo para que alumbraran la tierra y determinaran los signos del tiempo, las estaciones, los años, los meses, los días, las noches, los minutos y lo demás. Así quedó adornada toda la extensión del cielo.


    Ahora bien, cuando Adán de Luz sintió el deseo de entrar en su luz, es decir, en el octavo cielo, no pudo hacerlo debido a la pobreza que se había mezclado con su luz. Entonces creó para sí un eón[b] inmenso, y dentro de aquel eón creó seis eones con sus ornamentos, seis en total, que eran siete veces superiores a los cielos del Caos y sus ornamentos.


    Todos estos eones y sus ornamentos existen dentro de la infinitud que se extiende entre el octavo cielo y el Caos que está debajo de él. Se cuentan junto con el universo que pertenece a la pobreza.


    Si deseas conocer su estructura, la encontrarás descrita en el Séptimo Mundo del profeta Hieralias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes señalan una laguna o un tramo no conservado al comienzo del pasaje.
    reason: Conservar de manera visible la señal de daño o restauración transmitida por el testimonio de consulta.
  - marker: b
    text: «Eón» es un término cosmológico que puede referirse a una era, un ámbito o una realidad supramundana.
    reason: Ayudar al lector moderno sin imponer una sola definición en el cuerpo del texto.
lexical_decisions:
- source_word: Sophia
  choice: Sofía
  rationale: Se conserva como nombre propio de la figura personificada, usando la forma española tradicional en vez de traducirla aquí como «Sabiduría».
- source_word: Pistis
  choice: Pistis
  rationale: Se mantiene la transliteración porque funciona como nombre propio; traducirlo como «Fe» podría borrar esa función y resolver indebidamente su identidad.
- source_word: aeon
  choice: eón
  rationale: El término técnico preserva la amplitud cosmológica del concepto, que puede designar una realidad, ámbito o era supramundana.
- source_word: adornments
  choice: ornamentos
  rationale: Mantiene la reiteración y el carácter cosmológico del testimonio sin reducir el término a habitantes, astros u otra interpretación específica.
- source_word: poverty
  choice: pobreza
  rationale: Se traduce literalmente y en minúscula, conservando la posible tensión entre cualidad, condición y entidad personificada.
- source_word: infinity
  choice: infinitud
  rationale: Reproduce la noción espacial y cosmológica del pasaje sin sustituirla por una explicación interpretativa como «espacio infinito».
theological_decisions:
- issue: La identidad de la «pobreza»
  choice: Mantener «la pobreza» sin personificación explícita
  alternative: «la Pobreza» como nombre propio o «la deficiencia»
  rationale: El testimonio suministrado no obliga a decidir si se trata de una entidad personificada, una sustancia o una condición; la traducción preserva esa ambigüedad.
- issue: La relación entre la luz de Adán y el octavo cielo
  choice: «su luz, es decir, en el octavo cielo»
  alternative: Identificar o explicar el octavo cielo como morada propia de Adán
  rationale: Se conserva la aposición extraña del texto sin desarrollar una cosmología que el pasaje no explica.
- issue: Superioridad séptuple de los eones
  choice: «siete veces superiores»
  alternative: «siete veces mayores»
  rationale: «Superiores» conserva la ambigüedad entre tamaño, rango, esplendor o excelencia presente en el testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el vocabulario cosmológico técnico cuando una paráfrasis eliminaría ambigüedades. El borrador se basa provisionalmente en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto y de los testigos relacionados.
