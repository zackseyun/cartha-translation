  footnotes:
  - marker: a
    text: El texto está dañado o incompleto después de «y a su madre»; se conserva entre corchetes la restauración transmitida por el testimonio disponible.
    reason: Señalar incertidumbre manuscrita sin introducir en el cuerpo un corchete vacío poco informativo.
  - marker: b
    text: Hay una laguna en el manuscrito después de «delante de»; el sentido general de la frase permanece claro.
    reason: Preservar la señal de daño textual en el punto correspondiente.
  - marker: c
    text: El texto primero cuenta sesenta y cuatro figuras y después afirma que el total es setenta y dos, al parecer al incluir a los siete arcángeles y a Sabaot; la formulación exacta sigue siendo difícil.
    reason: Mantener una tensión numérica genuina y explicar la posible lógica sin corregir el texto.
lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: Pistis / Pistis Sofía
  rationale: Se conservan los nombres propios tradicionales, distinguiendo la forma breve de la compuesta; no se traducen como «Fe» y «Fe Sabiduría», pues funcionan aquí como nombres de entidades.
- source_word: Sabaoth / Yaldabaoth
  choice: Sabaot / Yaldabaot
  rationale: Transliteración simplificada y natural en español, sin añadir una h muda ajena al uso corriente.
- source_word: deathless man
  choice: hombre inmortal
  rationale: Expresa con naturalidad la ausencia de muerte sin identificar a la figura con una doctrina posterior.
- source_word: hosts of Chaos
  choice: ejércitos del Caos
  rationale: «Ejércitos» conserva el sentido de huestes y permite mantener la correspondencia deliberada con el título «Señor de los Ejércitos».
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Mantiene el carácter parental sin imponer género y reproduce el sentido de prioridad originaria.
- source_word: dwelling-place of rest
  choice: morada de reposo
  rationale: Conserva la imagen espacial y la noción solemne de descanso.
- source_word: repentance
  choice: arrepentimiento
  rationale: Equivalente directo que mantiene la dimensión moral y el cambio de lealtad narrado.
- source_word: Cherubin / Seraphin
  choice: Querubín / Serafín
  rationale: Se adaptan a la ortografía española, pero se conserva el singular colectivo del testimonio («llamado»), sin normalizarlo automáticamente a los plurales bíblicos habituales.
- source_word: authorities
  choice: autoridades
  rationale: Término transparente que conserva la posible condición de poderes cósmicos personificados.
theological_decisions:
- issue: Relación de la luz con la autoridad de Sabaot
  choice: «recibió gran autoridad contra todos los ejércitos del Caos»
  alternative: «recibió gran autoridad sobre todos los ejércitos del Caos»
  rationale: El testimonio fuente dice «against», por lo que se mantiene la orientación conflictiva y no se convierte silenciosamente en dominio administrativo.
- issue: Posición del reino y de Sabaot respecto de los dioses del Caos
  choice: «el reino que está por encima de todos» y «habitara por encima de los doce dioses»
  alternative: «reino sobre todos» y «gobernara a los doce dioses»
  rationale: Se conserva la ambigüedad espacial y jerárquica de «over/above» sin explicitar un gobierno que el pasaje no formula de manera inequívoca.
- issue: Naturaleza de Zoé
  choice: Se conserva «Zoé» como nombre propio
  alternative: Traducirlo como «Vida»
  rationale: El pasaje la presenta como hija personificada de Pistis; la transliteración evita resolver si debe leerse además como abstracción teológica.
- issue: Título «Lord of Hosts»
  choice: «Señor de los Ejércitos»
  alternative: «Señor de las Huestes»
  rationale: La elección hace visible para lectores actuales el juego con los ejércitos del Caos, sin identificar el título de manera confesional con otro personaje.
- issue: Cómputo de sesenta y cuatro y setenta y dos figuras
  choice: Se conserva la secuencia textual y se señala su dificultad
  alternative: Corregir o reinterpretar el cálculo
  rationale: La aritmética del pasaje no es transparente; no se armoniza mediante conjetura.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se privilegiaron oraciones claras sin borrar el tono cosmológico del tratado. Los nombres técnicos se transliteraron de forma legible; «Caos», «Oscuridad» y «Abismo» llevan mayúscula por su función personificada. Este borrador se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,5 y de los testigos relacionados.
