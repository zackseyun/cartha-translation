translation:
  language: es
  text: 'De este modo, cuando el Padre Primordial del Caos vio a su hijo Sabaot y la gloria en la que habitaba, y comprendió que era el más grande de todas las autoridades del Caos, sintió celos de él. Enfurecido, engendró a la Muerte de su propia muerte. La Muerte fue puesta sobre el sexto cielo, porque Sabaot había sido elevado desde allí. Así se completó el número de las seis autoridades del Caos.


    Entonces la Muerte, que era andrógina, se unió con su propia naturaleza y engendró siete hijos andróginos. Estos son los nombres masculinos:


    Celos,

    Furia,

    Lágrimas,

    Gemido,

    Sufrimiento,

    Llanto,

    Lamentación amarga.


    Y estos son los nombres femeninos:


    Furia,

    Dolor,

    Deseo,

    Gemido,

    Maldición,

    Amargura,

    Disputa.


    Se unieron sexualmente entre sí, y cada uno engendró siete hijos. Así llegaron a ser [] cuarenta y nueve demonios andróginos.[a]


    Encontrarás sus nombres y sus influencias en el Libro de Salomón.


    Frente a ellos, Zoe, que habitaba con Sabaot, creó siete fuerzas buenas y andróginas. Estos son los nombres masculinos: El que no tiene celos, el Bendito, el Alegre, el Verdadero, el que no siente envidia, el Amado y el Fiel. Y estos son los nombres femeninos: Paz, Gozo, Alegría, Bienaventuranza, Verdad, Amor y Pistis.[b] De estas fuerzas proceden muchos espíritus buenos y puros.


    Encontrarás sus influencias y sus efectos en el libro Estructuras del Destino del Cielo bajo los Doce.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes vacíos reproducen una señal de laguna o daño textual en el testimonio disponible.
    reason: Informa al lector de que la anomalía pertenece a la transmisión textual y no al sentido normal de la oración.
  - marker: b
    text: «Pistis» es una transliteración de la palabra griega que puede significar «fe» o «fidelidad»; aquí se conserva como nombre.
    reason: Aclara un nombre técnico sin resolver si debe entenderse también como abstracción personificada.
  - marker: c
    text: El título de esta obra y la expresión «bajo los Doce» son inciertos; la traducción sigue provisionalmente el testimonio inglés suministrado.
    reason: La revisión directa del copto está pendiente y el título puede admitir otras reconstrucciones.
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: Padre Primordial del Caos
  rationale: Conserva la personificación y la relación paterna indicada por el testimonio, con una expresión digna y comprensible.
- source_word: authorities
  choice: autoridades
  rationale: Mantiene el sentido técnico de potestades o seres gobernantes sin identificarlo con una jerarquía doctrinal posterior.
- source_word: androgynous
  choice: andrógino/a
  rationale: Reproduce de forma directa la caracterización doble, masculina y femenina, de estas entidades.
- source_word: Lust
  choice: Deseo
  rationale: Evita restringir innecesariamente el término a una formulación moralizante; el contexto sexual permanece explícito en el párrafo siguiente.
- source_word: Argumentativeness
  choice: Disputa
  rationale: Como nombre personificado, resulta más natural y conciso que una abstracción como «propensión a discutir».
- source_word: impacts / effects
  choice: influencias / efectos
  rationale: Distingue los dos términos del testimonio sin introducir una precisión técnica no comprobada en copto.
- source_word: Pistis
  choice: Pistis
  rationale: Se conserva el nombre propio transliterado en vez de traducirlo silenciosamente como «Fe».
theological_decisions:
- issue: Origen de la Muerte
  choice: «engendró a la Muerte de su propia muerte»
  alternative: «produjo la Muerte a partir de la muerte»
  rationale: Se conserva la reiteración paradójica y la personificación presentes en el testimonio, sin armonizarlas con otra cosmología.
- issue: Pronombre posterior al nacimiento de la Muerte
  choice: «La Muerte fue puesta sobre el sexto cielo»
  alternative: «él fue puesto sobre el sexto cielo»
  rationale: El pronombre del testimonio inglés es ambiguo; el contexto inmediato favorece a la Muerte como referente, pero se evita asignarle género gramatical masculino en español.
- issue: Unión de la Muerte con su naturaleza
  choice: «se unió con su propia naturaleza»
  alternative: «se mezcló consigo misma»
  rationale: Mantiene la extraña formulación cosmológica sin convertirla de manera inequívoca en autofecundación, aunque el contexto la sugiera.
- issue: Zoe y Pistis
  choice: Conservar «Zoe» y «Pistis» como nombres
  alternative: Traducirlos como «Vida» y «Fe»
  rationale: La transliteración preserva su función como personajes o nombres técnicos y evita fundirlos con las abstracciones enumeradas.
- issue: Título cosmológico final
  choice: «Estructuras del Destino del Cielo bajo los Doce»
  alternative: «Configuraciones del destino del cielo que está debajo de los doce»
  rationale: Se presenta como título de obra, conservando la ambigüedad de «los Doce» y sin especificar su identidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones, personificaciones y tensiones cosmológicas. El borrador es provisional porque la evidencia suministrada consiste en un testimonio inglés de dominio público y la revisión directa del copto del Códice II de Nag Hammadi está pendiente.
