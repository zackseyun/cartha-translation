id: ORIGW.008
reference: On the Origin of the World — Yaldabaoth Begets Death
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'In this way, when the Primal Parent of Chaos witnessed his son Sabaoth and the glory he dwelt inside, and realized he was greatest of every authority of Chaos, he grew envious of him, and having grown furious, he begot Death from out of his (own) death, and he [6] was appointed over the sixth heaven, <because> Sabaoth had been borne upwards from that place, and in this way the number of the six authorities of Chaos was reached.


    Death, an androgynous entity, then mixed himself together with his (own) nature, and begot seven androgynous children. Here are the names of the male children:


    Jealousy,

    Fury,

    Tears,

    Moaning,

    Suffering,

    Weeping,

    Bitter Lamentation.


    And here are the names of the female children:


    Fury,

    Pain,

    Lust,

    Moaning,

    Curse,

    Bitterness,

    Argumentativeness.


    They had sex with each other, and each begot seven children, which resulted in the sum of [] forty-nine androgynous demons.


    You will discover their names and their impacts in the Book of Solomon.


    And in front of these, Zoe, who dwelt with Sabaoth, created seven good androgynous forces. Here are the names of the males: the Non-Jealous One, the Blessed One, the Joyful One, the True One, the Non-Envying One, the Beloved One, the Faithful One. Additionally, regarding the females, here are their names: Peace, Gladness, Joyfulness, Blessedness, Truth, Love, Pistis, and from these powers originate many good and pure spirits.


    You will discover their impacts and their effects in the (Book of the) Structures of the Fate of Heaven Beneath the Twelve.'
