  source_fidelity: La traducción conserva la secuencia cosmológica, las personificaciones, la ambigüedad del referente de «él» tras el nacimiento de la Muerte y la señal de laguna «[]». Sin embargo, «Deseo» atenúa indebidamente «Lust» en una lista de entidades negativas vinculada de inmediato a la unión sexual; «Lujuria» es el equivalente normal y más fiel sin añadir interpretación doctrinal.
  naturalness: El español es claro, actual y de registro digno. Las listas y las repeticiones deliberadas se leen con naturalidad. «Disputa» resulta aceptable como abstracción personificada, aunque es algo más breve que el matiz disposicional de «Argumentativeness».
  terminology: «Padre Primordial», «autoridades», «andrógino/a», «Zoe» y «Pistis» mantienen adecuadamente el carácter técnico o personificado del testimonio. Se conserva prudentemente el título final como provisional y se explica su incertidumbre.
  issues:
