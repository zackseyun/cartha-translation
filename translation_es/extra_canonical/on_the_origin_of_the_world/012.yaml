review_pass:
  verdict: revise
  source_fidelity: La revisión se limita al testimonio inglés público proporcionado, pues no se suministra el texto copto para una comprobación directa. La traducción sigue en general el testimonio, pero la inserción «[a]» dentro de la cita restaura indebidamente una laguna que el testimonio deja vacía. También «causado por los demonios» estrecha la relación ambigua de «the lethargy of the demons», y «despertarlas» añade un efecto no expresado de manera independiente.
  naturalness: El español es mayormente claro, actual y apropiado para un texto religioso antiguo. Se mejoran algunas formulaciones algo literales o menos naturales, como «formas humildemente modeladas» y «dátil bueno y deleitable», sin suprimir las repeticiones descriptivas del pasaje.
  terminology: Se mantienen «la Justicia», «Paraíso», «Tierra del Deleite», «árbol del conocimiento», «autoridades», «sumos sacerdotes de justicia» y «unción». «Gloria» conserva el término del testimonio mejor que «resplandor». «Primer hombre» refleja más estrechamente el inglés «first man», sin identificarlo de forma explícita con Adán dentro de la cita.
  issues:
  - severity: high
    issue: 'La laguna textual se convirtió en una restauración parcial: «denunció [a] las…».'
    rationale: El testimonio inglés presenta «denounced [] the other…». La «a» entre corchetes no está atestiguada y altera la visibilidad y el alcance de la laguna. Debe conservarse «[]» sin contenido.
  - severity: medium
    issue: «El letargo causado por los demonios» interpreta un genitivo ambiguo.
    rationale: «The lethargy of the demons» puede referirse a un letargo vinculado con los demonios de más de una manera. «El letargo de los demonios» preserva mejor la ambigüedad del testimonio.
  - severity: medium
    issue: «Y despertarlas» añade una explicación al verbo «sacudir».
    rationale: El original inglés dice que el árbol podría «shake souls from the lethargy»; no expresa separadamente que las despierte. La traducción debe evitar ampliar el efecto.
  - severity: low
    issue: «Resplandor» reduce el alcance de «glory».
    rationale: «Gloria» conserva la posible carga honorífica, luminosa o teológica de «glory», mientras que «resplandor» la limita a luz visible.
  revised_text: 'Luego, la Justicia creó el Paraíso. Era hermoso y estaba fuera de la órbita de la luna y de la órbita del sol, dentro de la Tierra del Deleite, al oriente, entre las piedras. El deseo habita entre los árboles hermosos y deleitables. Conforme a la voluntad de Dios, el árbol de la vida eterna apareció al norte del Paraíso, para que las almas de los santos que saldrán de las formas de baja condición en la consumación de la era pudieran llegar a ser inmortales.


    El color del árbol de la vida se asemeja al sol, y sus ramas son hermosas. Sus hojas se parecen a las del ciprés. Su fruto se parece a un racimo de uvas blancas. Su altura llega hasta el cielo, y junto a él está el árbol del conocimiento, que posee la fuerza de Dios. Su gloria se asemeja a la de la luna cuando está llena, y sus ramas son hermosas. Sus hojas se parecen a las de la higuera. Su fruto se parece a un dátil bueno y agradable. Este árbol está al norte del Paraíso para sacudir a las almas y librarlas del letargo de los demonios, a fin de que se acerquen al árbol de la vida, coman de su fruto y, de este modo, denuncien a las autoridades y a sus ángeles.


    El efecto de este árbol se expone en la Escritura sagrada, que dice: «Tú eres el árbol del conocimiento que está en el Paraíso, del cual comió el primer hombre y que abrió su mente; él amó a su compañera y denunció [] las otras semejanzas extrañas, hasta despreciarlas».


    Después de esto brotó el olivo para santificar a los reyes y a los sumos sacerdotes de justicia que aparecerían en los últimos días, pues el olivo surgió de la luz del primer Adán para proveer la unción que habrían de recibir.'
