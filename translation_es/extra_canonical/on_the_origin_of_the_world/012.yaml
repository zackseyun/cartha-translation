translation:
  language: es
  text: 'Luego, la Justicia creó el Paraíso. Era hermoso y estaba más allá de la órbita de la luna y de la órbita del sol, dentro de la Tierra del Deleite, al oriente, entre las piedras. El deseo habita entre los árboles hermosos y deleitables. Y, conforme a la voluntad de Dios, el árbol de la vida eterna apareció al norte del Paraíso, para que pudieran volverse inmortales las almas de los santos que saldrán de las formas humildemente modeladas en la consumación de la era.


    El color del árbol de la vida se asemeja al sol, y sus ramas son hermosas. Sus hojas se parecen a las del ciprés. Su fruto se parece a un racimo de uvas blancas. Su altura llega hasta el cielo, y junto a él está el árbol del conocimiento, que posee la fuerza de Dios. Su resplandor se asemeja al de la luna cuando está llena, y sus ramas son hermosas. Sus hojas se parecen a las de la higuera. Su fruto se parece a un dátil bueno y deleitable. Este árbol está al norte del Paraíso para sacudir a las almas y despertarlas del letargo causado por los demonios, a fin de que se acerquen al árbol de la vida, coman de su fruto y, de este modo, denuncien a las autoridades y a sus ángeles.


    El efecto de este árbol se expone en la Sagrada Escritura, que dice: «Tú eres el árbol del conocimiento que está en el Paraíso, del cual comió el primer ser humano, y que abrió su mente; él amó a su compañera y denunció [a] las otras semejanzas extrañas, hasta despreciarlas».


    Después de esto brotó el olivo, destinado a santificar a los reyes y a los sumos sacerdotes de justicia que aparecerían en los últimos días, pues el olivo surgió de la luz del primer Adán para proporcionarles la unción que habrían de recibir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto presenta aquí una laguna o una lectura incierta después de «denunció».
    reason: El testimonio inglés señala una pérdida textual mediante corchetes vacíos; el marcador conserva de forma visible esa incertidumbre sin proponer una restauración.
lexical_decisions:
- source_word: Justice
  choice: la Justicia
  rationale: Se conserva la personificación y el carácter definido de la figura, sin reducirla a una cualidad abstracta.
- source_word: Paradise
  choice: Paraíso
  rationale: Equivalente tradicional, claro y digno; la mayúscula refleja su uso como lugar definido en el relato.
- source_word: Land of Delight
  choice: Tierra del Deleite
  rationale: Mantiene el posible nombre propio y el campo semántico de placer o deleite sin identificarlo automáticamente con Edén.
- source_word: satisfying
  choice: deleitables
  rationale: En el contexto de árboles y fruto, expresa aquello que agrada y satisface sin la rigidez de una traducción mecánica.
- source_word: consummation of the age
  choice: consumación de la era
  rationale: Conserva la formulación escatológica y evita reemplazarla interpretativamente por «fin del mundo».
- source_word: knowledge
  choice: conocimiento
  rationale: Mantiene la designación tradicional del árbol sin añadir «del bien y del mal», frase ausente del testimonio.
- source_word: authorities
  choice: autoridades
  rationale: Traducción formal que conserva la ambigüedad entre gobernantes y poderes cósmicos.
- source_word: female companion
  choice: compañera
  rationale: Español natural que conserva la relación expresada sin introducir nombres o categorías ausentes.
- source_word: high priests of righteousness
  choice: sumos sacerdotes de justicia
  rationale: Conserva la construcción genitiva y su posible sentido cualitativo o identitario.
- source_word: anointing
  choice: unción
  rationale: Retiene el sentido ritual y teológico relacionado con el olivo, los reyes y los sacerdotes.
theological_decisions:
- issue: La función del árbol del conocimiento
  choice: Presentarlo como medio para despertar a las almas y conducirlas al árbol de la vida
  alternative: Armonizarlo con una lectura exclusivamente negativa del árbol en Génesis
  rationale: El pasaje atribuye explícitamente al árbol una función liberadora; se conserva esa tensión teológica sin corregirla mediante otra tradición.
- issue: Identidad de las «autoridades»
  choice: Mantener el término general «autoridades»
  alternative: Traducir «arcontes» o explicar que son poderes demoníacos
  rationale: El testimonio suministrado no exige una identificación más específica; la opción elegida preserva la ambigüedad.
- issue: Naturaleza de la Justicia
  choice: Conservar «la Justicia» como agente personificado
  alternative: Reformular como «Dios, en su justicia, creó»
  rationale: La reformulación importaría una identificación teológica no expresada por el texto.
- issue: Origen y propósito del olivo
  choice: Conservar que surgió de la luz del primer Adán y proporcionó la unción futura
  alternative: Interpretarlo explícitamente como símbolo del Espíritu o de una institución particular
  rationale: La traducción reproduce las afirmaciones del pasaje sin añadir una doctrina sacramental o pneumatológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron la imaginería cosmológica, las repeticiones descriptivas y las tensiones teológicas del pasaje. Los números de página manuscrita [11] y [12] no se incluyeron. Debido a que la revisión directa del copto está pendiente, esta versión es provisional y se basa en el testimonio inglés público suministrado.
