base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: es
  text: '**Los siete arcontes y sus ángeles demoníacos**


    Volvamos a los arcontes[a] de los que hablamos antes, para que podamos explicar quiénes son.


    Cuando los siete arcontes fueron arrojados desde sus cielos a la tierra, crearon para sí numerosos ángeles demoníacos que los sirvieran. Estos enseñaron a la humanidad diversas clases de error, magia, brebajes, adoración de ídolos, derramamiento de sangre, altares, templos, sacrificios y ofrendas de bebida para todos los demonios terrenales. Colaboraban con el Destino, que llegó a existir por el acuerdo entre los dioses de la injusticia y de la justicia. De este modo, una vez que el mundo llegó a existir, se extravió y permaneció continuamente sumido en confusión, porque todos los seres humanos de la tierra adoraban a demonios desde la creación hasta la consumación de la era, tanto los ángeles de justicia como los seres humanos de injusticia.[b]


    Así llegó el mundo a existir en confusión, ignorancia y estupor. Todos se habían extraviado hasta la aparición del hombre verdadero.


    Baste esto en cuanto al tema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Arcontes» significa literalmente «gobernantes» o «potestades»; aquí designa a gobernantes cósmicos.
    reason: Aclara un término técnico necesario sin reemplazarlo por una equivalencia que diluya su sentido cosmológico.
  - marker: b
    text: La relación gramatical de esta última frase es incierta. El testimonio disponible coordina «los ángeles de justicia» y «los seres humanos de injusticia», aunque la oración acaba de hablar de todos los seres humanos que adoraban a demonios. Se conserva la dificultad a la espera de una revisión directa del copto.
    reason: Documenta una ambigüedad real del testimonio y evita corregir o armonizar silenciosamente el pasaje.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico tradicional, comprensible mediante una nota, en vez de sustituirlo por «gobernantes» y perder su función cosmológica específica en el escrito.
- source_word: potions
  choice: brebajes
  rationale: «Brebajes» expresa preparados líquidos vinculados aquí con prácticas mágicas sin implicar necesariamente una medicina legítima, como podría sugerir «pociones» en ciertos contextos modernos.
- source_word: drink offerings / libations
  choice: ofrendas de bebida
  rationale: Es una expresión clara en español latinoamericano y comunica la acción ritual mejor que el término más técnico «libaciones».
- source_word: fate
  choice: el Destino
  rationale: La mayúscula y el artículo reflejan que el pasaje presenta al Destino como una realidad personificada que llegó a existir.
- source_word: consummation (of the age)
  choice: consumación de la era
  rationale: Mantiene el matiz escatológico y evita introducir «fin del mundo», formulación más interpretativa.
- source_word: true man
  choice: hombre verdadero
  rationale: Conserva la formulación antropológica y posiblemente titular del testimonio, sin identificar de manera explícita a esta figura ni resolver su sentido teológico.
theological_decisions:
- issue: Identidad del «hombre verdadero»
  choice: Se mantiene «el hombre verdadero» sin identificación adicional.
  alternative: Traducir o explicar la expresión como una referencia explícita a Cristo, al ser humano primordial o a otra figura determinada.
  rationale: El fragmento suministrado no identifica inequívocamente a la figura; explicitar una identidad importaría una interpretación teológica ajena al texto.
- issue: Relación entre los «ángeles de justicia» y los «seres humanos de injusticia» en la cláusula final
  choice: Se conserva la coordinación literal y se señala su dificultad en una nota.
  alternative: Reordenar la frase para hacer de uno de los grupos objeto de adoración, excluir a los ángeles del alcance de «todos» o corregir la aparente tensión.
  rationale: El testimonio disponible presenta una construcción gramaticalmente ambigua que incluso parece entrar en tensión con la referencia previa a todos los seres humanos; la traducción no debe resolverla sin revisión del copto.
- issue: Condición del Destino
  choice: Se presenta como entidad personificada nacida del acuerdo entre dioses de injusticia y justicia.
  alternative: Traducir «destino» como una fuerza impersonal o como simple fatalidad.
  rationale: El relativo «que llegó a existir» del testimonio favorece una entidad personificada dentro de la cosmología narrativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se favorecen oraciones claras sin simplificar la cosmología propia del escrito. «Arcontes», «consumación de la era» y «hombre verdadero» mantienen el registro técnico o solemne donde el contenido lo requiere. El borrador se basa de manera provisional en el testimonio inglés público suministrado; la revisión directa del copto del Códice de Nag Hammadi II,5 y de los testigos relacionados sigue pendiente, por lo que no se atribuyen al copto formas léxicas no verificadas.
