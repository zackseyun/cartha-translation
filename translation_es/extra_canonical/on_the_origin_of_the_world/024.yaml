review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado, incluido su pasaje final sintácticamente difícil. Sin embargo, «explicar quiénes son» añade una precisión no expresada por «offer an explanation of them», y la construcción española con «tanto ... como» presenta como coordinación fluida una relación que el testimonio reconoce como incierta. Se ajusta la redacción para conservar la yuxtaposición problemática sin resolverla interpretativamente.
  naturalness: El español es en general claro y de registro apropiado. Se mejora «Colaboraban», cuyo imperfecto resulta menos congruente con la secuencia narrativa, y se reformula la cláusula ambigua para que sea legible sin aparentar una solución gramatical definitiva.
  terminology: «Arcontes», «ángeles demoníacos», «brebajes», «ofrendas de bebida», «consumación de la era» y «hombre verdadero» son elecciones adecuadas para español latinoamericano neutral y conservan los términos técnico-cosmológicos del testimonio. Se mantiene «Destino» como entidad personificada, conforme al relativo que le atribuye un origen.
  issues:
  - severity: medium
    issue: «para que podamos explicar quiénes son»
    rationale: El testimonio dice que se ofrecerá una explicación de los arcontes; «quiénes son» estrecha esa explicación a su identidad. «Explicar acerca de ellos» conserva un alcance más amplio.
  - severity: medium
    issue: «tanto los ángeles de justicia como los seres humanos de injusticia»
    rationale: La fórmula española resuelve como coordinación inequívoca una cláusula que el propio testimonio inglés y la nota identifican como gramaticalmente incierta y tensionada con «todos los seres humanos». Se conserva la lista yuxtapuesta y se mantiene la nota.
  - severity: low
    issue: «Colaboraban con el Destino»
    rationale: El imperfecto sugiere una acción durativa no requerida por la secuencia. «Trabajaron junto con» reproduce con mayor neutralidad el «collaborating together» del testimonio.
  revised_text: '**Los siete arcontes y sus ángeles demoníacos**


    Volvamos a los arcontes[a] de los que hablamos antes, para que podamos explicar acerca de ellos.


    Cuando los siete arcontes habían sido arrojados de sus cielos a la tierra, hicieron para sí numerosos ángeles demoníacos para que los sirvieran. Estos últimos enseñaron a la humanidad diversas clases de error, magia, brebajes, adoración de ídolos, derramamiento de sangre, altares, templos, sacrificios y ofrendas de bebida a todos los demonios terrenales. Trabajaron junto con el Destino, que llegó a existir por el acuerdo entre los dioses de la injusticia y de la justicia. De este modo, cuando el mundo había llegado a existir, se extravió y permaneció continuamente sumido en confusión, porque todos los seres humanos de la tierra adoraban a demonios desde la creación hasta la consumación de la era: los ángeles de justicia y los seres humanos de injusticia.[b]


    De este modo, el mundo llegó a existir en confusión, ignorancia y estupor. Todos se habían extraviado hasta la aparición del hombre verdadero.


    Baste esto en cuanto al tema.'
  revised_footnotes:
  - marker: a
    text: «Arcontes» significa literalmente «gobernantes» o «potestades»; aquí designa a gobernantes cósmicos.
    reason: Aclara un término técnico necesario sin reemplazarlo por una equivalencia que diluya su sentido cosmológico.
  - marker: b
    text: La relación gramatical de esta última frase es incierta. El testimonio disponible yuxtapone «los ángeles de justicia» y «los seres humanos de injusticia», aunque la oración acaba de hablar de todos los seres humanos que adoraban a demonios. Se conserva la dificultad a la espera de una revisión directa del copto.
    reason: Documenta una ambigüedad real del testimonio y evita corregir o armonizar silenciosamente el pasaje.
  revision_rationale: La revisión es prudencial y se limita a retirar una leve ampliación de sentido, mejorar la secuencia verbal y, especialmente, preservar en español la dificultad sintáctica final que transmite el testimonio inglés. No se identifica al «hombre verdadero» ni se armoniza la relación entre los ángeles de justicia y los seres humanos de injusticia. Dado que la revisión directa del copto sigue pendiente, no se introducen decisiones dependientes de una reconstrucción de la fuente copta.
