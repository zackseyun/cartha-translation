  footnotes:
  - marker: a
    text: El testimonio proporcionado señala aquí una laguna en el texto.
    reason: Hacer visible la discontinuidad manuscrita indicada mediante corchetes vacíos en el testimonio base.
  - marker: b
    text: El testimonio inglés dice literalmente que Adán «se recuperaba de cada prueba»; el sentido exacto debe comprobarse mediante revisión directa del copto.
    reason: La expresión del testimonio es inusual y la revisión de la lengua antigua sigue pendiente.
  - marker: c
    text: El testimonio proporcionado señala aquí otra laguna en el texto.
    reason: Conservar la indicación de pérdida textual sin inventar contenido para completarla.
  - marker: d
    text: El cambio del singular «Adán» al plural «sus vidas» se conserva según el testimonio y puede abarcar a Adán y a otros seres humanos.
    reason: Evitar resolver silenciosamente una variación referencial presente en la fuente disponible.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico tradicional para las potestades gobernantes del relato, en vez de reducirlo simplemente a «gobernantes».
- source_word: Paradise
  choice: Paraíso
  rationale: Equivalente natural y tradicional; la mayúscula refleja que funciona como nombre del lugar.
- source_word: teacher
  choice: maestro
  rationale: Mantiene la identidad funcional del personaje sin identificarlo interpretativamente con la serpiente u otra figura.
- source_word: deathless
  choice: inmortal
  rationale: Expresa en español actual la ausencia de muerte; evita la forma poco natural «sin muerte».
- source_word: authorities
  choice: autoridades
  rationale: Distingue este término de «arcontes» sin imponer una jerarquía doctrinal no explícita.
- source_word: radiant bodies
  choice: cuerpos luminosos
  rationale: Conserva la referencia cosmológica general sin precisar de manera no justificada que sean astros concretos.
- source_word: consummation of the age
  choice: consumación de la era
  rationale: Mantiene el matiz escatológico y la formulación solemne sin convertirlo sencillamente en «fin del mundo».
theological_decisions:
- issue: Naturaleza del maestro
  choice: Se lo denomina únicamente «el maestro».
  alternative: Identificarlo como la serpiente, un revelador o una figura salvífica.
  rationale: El pasaje proporcionado no hace explícita esa identificación; preservarla evita resolver una ambigüedad teológica genuina.
- issue: Capacidad de bendecir de los arcontes
  choice: «Ellos no poseen bendición alguna. El bien no puede ser consecuencia del mal».
  alternative: Parafrasear que los arcontes son esencialmente incapaces de hacer el bien.
  rationale: La traducción conserva las dos afirmaciones tajantes del testimonio sin desarrollar una doctrina ontológica adicional.
- issue: Conocimiento superior de Adán
  choice: Se conserva la oposición entre luz y oscuridad y el temor de los arcontes a que Adán llegue a ser señor.
  alternative: Interpretar explícitamente el conocimiento como conocimiento salvífico o gnosis.
  rationale: El texto tiene una orientación teológica marcada, pero no conviene insertar terminología doctrinal ausente en este fragmento.
- issue: Destino y duración de la vida
  choice: Se mantiene que el destino fue establecido desde el principio y limitó lo que podían hacer los arcontes.
  alternative: Armonizar la afirmación con una doctrina posterior de providencia o predestinación.
  rationale: Se preserva la tensión cosmológica interna del escrito sin equiparar su «destino» con categorías confesionales posteriores.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean diálogos con raya y formulaciones accesibles, manteniendo términos técnicos necesarios como «arcontes». Los paréntesis editoriales del testimonio se conservan. Este borrador se basa en el testimonio inglés público suministrado; requiere cotejo directo con el copto de Nag Hammadi Codex II,5 y los testigos relacionados antes de considerarse definitivo.
