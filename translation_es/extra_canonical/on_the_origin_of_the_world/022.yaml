  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: es
  text: 'Cuando los arcontes se dieron cuenta de que (Adán y Eva) habían quebrantado los mandamientos que ellos les habían impuesto, entraron en el Paraíso y se acercaron a Adán y Eva en medio de un terremoto y de grandes amenazas, para ver el resultado de la ayuda que habían recibido. Adán y Eva se estremecieron violentamente y se escondieron entre los árboles del Paraíso. Los arcontes no sabían dónde estaban y dijeron:


    —Adán, ¿dónde estás?


    Él respondió:


    —Aquí estoy. Me escondí porque tuve miedo de ustedes y sentí vergüenza.


    En su ignorancia, le dijeron:


    —¿Quién te hizo saber de la vergüenza con la que te has vestido, a menos que hayas comido de aquel árbol?


    Él respondió:


    —La mujer que me diste fue quien me dio, y yo comí.


    Entonces le dijeron a la mujer: [a]


    —¿Qué has hecho?


    Ella respondió:


    —El maestro fue quien me incitó, y yo comí.


    Entonces los arcontes se acercaron al maestro. Por causa de él, se les nublaron los ojos y no pudieron hacer nada contra él. Como eran impotentes, lo maldijeron.


    Después se acercaron a la mujer y la maldijeron tanto a ella como a sus descendientes.


    Después de la mujer, maldijeron a Adán y, por causa de él, también a la tierra y a los cultivos. Maldijeron todo lo que habían creado. Ellos no poseen bendición alguna. El bien no puede ser consecuencia del mal.


    Desde aquel día, las autoridades comprendieron de verdad que había algo más poderoso que ellas.


    Solo sabían que sus mandamientos no habían sido obedecidos. Una enorme envidia entró en el mundo únicamente por causa del hombre inmortal.


    Cuando los arcontes se dieron cuenta de que su Adán había adquirido una clase distinta de conocimiento, quisieron ponerlo a prueba. Reunieron todos los animales domésticos, las bestias salvajes de la tierra y las aves del cielo, y los llevaron ante Adán para saber cómo los llamaría. Cuando los vio, puso nombre a las criaturas de ellos.


    Se inquietaron porque Adán salía bien de cada prueba.[b] Se reunieron, tramaron planes y dijeron:


    —¡Miren a Adán! Se ha vuelto como uno de nosotros, pues conoce la diferencia entre la luz y la oscuridad. Tal vez ahora sea engañado, como sucedió con el árbol del conocimiento, y hasta se acerque al árbol de la vida, coma de él, se vuelva inmortal y llegue a ser señor. Entonces nos aborrecerá y despreciará, tanto a nosotros como a toda nuestra gloria, y nos condenará junto con nuestro universo. Vamos, expulsemos a Adán [c] del Paraíso y enviémoslo abajo, a la tierra de la que fue tomado, para que de ahora en adelante no pueda conocer nada superior a lo que nosotros somos capaces de conocer.


    Así expulsaron a Adán del Paraíso junto con su esposa. Pero no les bastó con lo que habían hecho; al contrario, sintieron miedo.


    Entraron (en el Paraíso y se acercaron) al árbol de la vida. Lo cercaron con seres enormes y temibles, criaturas vivientes de fuego llamadas «querubines», y pusieron entre ellas una espada llameante que giraba sin cesar de manera aterradora, para impedir que cualquier ser terrenal entrara jamás en aquel lugar.


    Como los arcontes sentían envidia de Adán, quisieron acortar la duración de sus vidas.[d] No pudieron hacerlo a causa del destino, establecido desde el principio, porque a cada uno se le había asignado una vida de mil años, conforme a la órbita de los cuerpos luminosos. Sin embargo, aunque los arcontes no pudieron lograrlo, cada uno de los autores del mal restó diez años, y la duración total de la vida quedó en novecientos treinta años. Estos transcurren entre sufrimiento, debilidad y perturbación maligna. Así ha sido la vida desde aquel día hasta la consumación de la era.'
