base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: es
  text: 'La Psique primordial amó a Eros, quien habitaba con ella, y derramó su sangre sobre él y también sobre la tierra. De aquella sangre brotó de la tierra la primera rosa, que salió del arbusto espinoso como fuente de alegría para la luz que habría de aparecer desde dentro del arbusto.


    Además, después de esto, brotaron de la tierra hermosas flores de agradable aroma, de diversas clases, procedentes de cada una de las hijas vírgenes de Pronoia. Cuando ellas se enamoraron de Eros, derramaron su sangre sobre él y sobre la tierra.


    Después de estas, brotaron de la tierra todas las plantas, de diversas clases, llevando dentro de sí la semilla de las autoridades y de sus ángeles.


    Después de estas, las autoridades crearon de las aguas diversas clases de animales, entre ellos reptiles y aves, que llevaban dentro de sí la semilla de las autoridades y de sus ángeles.


    Sin embargo, antes de todo esto, cuando él apareció el primer día, permaneció en la tierra unos dos días. Luego se apartó de la Pronoia inferior que estaba en el cielo y ascendió hacia su luz. De inmediato, la oscuridad cubrió todo el cosmos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El referente de «él» no es explícito en el testimonio disponible. Esta traducción es provisional, pues aún está pendiente la revisión directa del texto copto.
    reason: Advertir una ambigüedad genuina y la limitación documental de la base de traducción.
lexical_decisions:
- source_word: Psyche
  choice: Psique
  rationale: Se conserva el nombre personificado en su forma española tradicional, en vez de traducirlo como «alma», para mantener su función como figura del relato.
- source_word: Eros
  choice: Eros
  rationale: Se conserva el nombre griego reconocido en español y su carácter personificado.
- source_word: Pronoia
  choice: Pronoia
  rationale: Se retiene el término como nombre personificado; traducirlo como «Providencia» resolvería de manera prematura su alcance conceptual.
- source_word: authorities
  choice: autoridades
  rationale: Traducción formal que conserva la designación cosmológica del testimonio sin sustituirla por un término doctrinal más específico, como «arcontes» o «potestades».
- source_word: cosmos
  choice: cosmos
  rationale: Mantiene el alcance cosmológico y el registro del pasaje; «mundo» podría estrechar o volver más cotidiano el sentido.
- source_word: thorn bush
  choice: arbusto espinoso
  rationale: Expresa con naturalidad la planta provista de espinas sin identificar una especie que el testimonio no especifica.
theological_decisions:
- issue: Referente del pronombre masculino en el último párrafo
  choice: Se conserva «él» sin identificarlo.
  alternative: Sustituir el pronombre por «Eros» u otra figura mencionada en el contexto.
  rationale: El testimonio inglés suministrado deja ambiguo el referente, y no corresponde resolver esa tensión sin revisión directa del copto.
- issue: Naturaleza de Psique, Eros y Pronoia
  choice: Se presentan como nombres personificados sin explicación doctrinal dentro del texto.
  alternative: Traducirlos como «Alma», «Amor» y «Providencia».
  rationale: La transliteración evita imponer equivalencias teológicas que podrían reducir el campo semántico de estas figuras.
- issue: Procedencia de la semilla en plantas y animales
  choice: «la semilla de las autoridades y de sus ángeles»
  alternative: Parafrasear como descendencia, esencia o poder de las autoridades.
  rationale: Se conserva la imagen concreta y su posible tensión cosmológica sin interpretarla.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres Psique, Eros y Pronoia; se evitó vocabulario confesional especializado. La redacción sigue de cerca el testimonio público en inglés porque la revisión del copto está pendiente.
