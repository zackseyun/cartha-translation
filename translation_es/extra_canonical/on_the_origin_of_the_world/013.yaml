review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés disponible y preserva correctamente los nombres personificados, la imaginería de la sangre y la semilla, y la ambigüedad del pronombre «él». No obstante, «la Pronoia inferior que estaba en el cielo» desplaza sintácticamente «en el cielo» hacia Pronoia, cuando el testimonio dice que él partió de la Pronoia inferior «en el cielo». Además, «cubrió» atenúa el sentido de «obscured».
  naturalness: El español es claro, natural y de registro apropiado. «Derramó su sangre sobre él» es una formulación admisible para la imagen ritual o mítica del pasaje. Se propone un ajuste mínimo en la última oración para reflejar mejor la acción de oscurecer.
  terminology: «Psique», «Eros», «Pronoia», «autoridades» y «cosmos» son elecciones prudentes y coherentes con el carácter provisional de la base inglesa. «Arbusto espinoso» conserva adecuadamente la falta de especificación botánica.
  issues:
  - severity: medium
    issue: Alcance sintáctico de «en el cielo»
    rationale: La redacción «se apartó de la Pronoia inferior que estaba en el cielo» presenta a Pronoia como localizada en el cielo. El testimonio suministrado dice «departed from the lower Pronoia in heaven», en una secuencia donde «en el cielo» modifica de manera más inmediata la partida o el ámbito desde el que parte él. Conviene conservar esa relación sin añadir una relativa interpretativa.
  - severity: low
    issue: «La oscuridad cubrió» por «darkness obscured»
    rationale: «Cubrió» es posible, pero «oscureció» refleja más directamente el verbo del testimonio y evita sustituir la acción de privar de luz por la imagen algo distinta de cubrir.
  revised_text: 'La Psique primordial amó a Eros, quien habitaba con ella, y derramó su sangre sobre él y también sobre la tierra. De aquella sangre brotó de la tierra la primera rosa, que salió del arbusto espinoso como fuente de alegría para la luz que habría de aparecer desde dentro del arbusto.


    Además, después de esto, brotaron de la tierra hermosas flores de agradable aroma, de diversas clases, procedentes de cada una de las hijas vírgenes de Pronoia. Cuando ellas se enamoraron de Eros, derramaron su sangre sobre él y sobre la tierra.


    Después de estas, brotaron de la tierra todas las plantas, de diversas clases, llevando dentro de sí la semilla de las autoridades y de sus ángeles.


    Después de estas, las autoridades crearon de las aguas diversas clases de animales, entre ellos reptiles y aves, que llevaban dentro de sí la semilla de las autoridades y de sus ángeles.


    Sin embargo, antes de todo esto, cuando él apareció el primer día, permaneció en la tierra unos dos días. Luego, desde la Pronoia inferior en el cielo, partió y ascendió hacia su luz. De inmediato, la oscuridad oscureció todo el cosmos.[a]'
  revised_footnotes:
  - marker: a
    text: El referente de «él» no es explícito en el testimonio disponible. Esta traducción es provisional, pues aún está pendiente la revisión directa del texto copto.
    reason: Advertir una ambigüedad genuina y la limitación documental de la base de traducción.
  revision_rationale: 'Se realizan únicamente dos ajustes seguros: se reordena la cláusula relativa a la Pronoia inferior para no atribuirle indebidamente la localización «en el cielo», y se traduce «obscured» mediante «oscureció». Se mantiene sin resolver el referente de «él» y se conserva la nota correspondiente.'
