base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: es
  text: 'Como ser andrógino, Eros apareció de aquella sangre primordial. Su elemento masculino es Himireris,[a] que es fuego procedente de la luz. Su elemento femenino, que habita con él, es un alma compuesta de sangre y procede de la sustancia de Pronoia.[b] Es sumamente hermoso y posee un encanto superior al de todos los seres creados del Caos.


    Entonces, cuando todos los dioses y sus ángeles contemplaron a Eros, se enamoraron de él. Al manifestarse dentro de todos ellos, los encendió. Así como varias lámparas se encienden con una sola lámpara y en todas está presente una misma luz sin que aquella lámpara disminuya, así Eros se difundió dentro de todos los seres creados del Caos sin disminuir. Así como Eros apareció en medio de la luz y la oscuridad, y así como la unión sexual de Eros se consumó en medio de los ángeles y la humanidad, así también brotó de la tierra el placer primordial. A la Tierra siguió la Mujer; a la Mujer, el matrimonio; al matrimonio, el nacimiento; al nacimiento, la decadencia.


    Después de Eros, la vid brotó de aquella sangre derramada sobre la tierra. Por eso, quienes beben de ella conciben el deseo de unirse sexualmente.


    Después de la vid, brotaron de la tierra una higuera y un granado, junto con los demás árboles de toda especie, que poseen su semilla de la semilla [] de las autoridades y de sus ángeles.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Himireris es el nombre dado aquí al elemento masculino de Eros. La forma se conserva por transliteración, pues su identificación y grafía exactas requieren revisión directa del copto.
    reason: Nombre técnico incierto en una traducción provisional basada en un testimonio inglés.
  - marker: b
    text: Pronoia puede relacionarse con la idea de «previsión» o «providencia», pero aquí parece funcionar como nombre de una realidad personificada; por eso se conserva la forma Pronoia.
    reason: Preservar la ambigüedad entre significado léxico y nombre cosmológico.
  - marker: c
    text: Los corchetes vacíos señalan una laguna o texto faltante en el testimonio manuscrito; no se ha intentado reconstruirlo.
    reason: Hacer visible la incertidumbre textual preservada en la fuente suministrada.
lexical_decisions:
- source_word: androgynous entity
  choice: ser andrógino
  rationale: Expresa de manera natural y digna la coexistencia de elementos masculino y femenino sin convertirla en una explicación interpretativa.
- source_word: Himireris
  choice: Himireris
  rationale: Se conserva como nombre técnico propio, dado que la revisión directa del copto está pendiente y no conviene conjeturar una equivalencia.
- source_word: Pronoia
  choice: Pronoia
  rationale: Se translitera el término personificado en vez de traducirlo como «Providencia», para no borrar su función como entidad dentro del relato cosmológico.
- source_word: Chaos
  choice: Caos
  rationale: Se escribe con mayúscula porque funciona como ámbito o realidad cosmológica personificada, no meramente como desorden.
- source_word: set them ablaze
  choice: los encendió
  rationale: Mantiene la imagen del fuego y su vínculo inmediato con la comparación de las lámparas.
- source_word: dispersed himself inside
  choice: se difundió dentro de
  rationale: Comunica la extensión de Eros en todos los seres sin sugerir que se fragmentó o disminuyó.
- source_word: authorities
  choice: autoridades
  rationale: Conserva el sentido técnico cosmológico del testimonio sin identificarlo de manera no demostrada con otro orden específico de seres.
theological_decisions:
- issue: Naturaleza de Eros
  choice: Se conservan tanto su androginia como sus elementos masculino y femenino.
  alternative: Armonizar estos rasgos como mero simbolismo o traducirlos en términos psicológicos.
  rationale: El pasaje presenta una tensión cosmológica real que la traducción no debe resolver ni reinterpretar.
- issue: Presencia de Eros sin disminución
  choice: Se mantiene la analogía de una sola lámpara que comunica la misma luz sin disminuir.
  alternative: Parafrasearla como omnipresencia, emanación o participación.
  rationale: Esas formulaciones impondrían categorías teológicas más definidas que las del texto.
- issue: Secuencia Tierra–Mujer–matrimonio–nacimiento–decadencia
  choice: Se conserva la sucesión breve y paralela, con mayúsculas en Tierra y Mujer.
  alternative: Explicar causalmente cada etapa o normalizar «mujer» como sustantivo común.
  rationale: La forma sentenciosa y la posible personificación son significativas, pero permanecen ambiguas.
- issue: Deseo producido por el vino
  choice: «conciben el deseo de unirse sexualmente»
  alternative: «se vuelven lujuriosos» o «procrean».
  rationale: Evita una valoración moral añadida y preserva la referencia explícita a la unión sexual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el ritmo cosmológico, las repeticiones deliberadas y las imágenes de luz, fuego y generación. Se eliminaron los números de página que interrumpían las oraciones, pero se preservó la laguna manuscrita. El borrador es provisional porque la evidencia suministrada depende de un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente.
