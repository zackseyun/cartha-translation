  revision_rationale: La revisión es limitada y no altera el contenido cosmológico ni la ambigüedad del pasaje. Corrige dos expresiones españolas para mayor precisión y naturalidad, mejora levemente la construcción final y elimina una nota sin ancla textual en el testimonio proporcionado. Dado que la base disponible es un testimonio inglés y no una colación directa del copto, se mantienen las transliteraciones y no se reconstruye la laguna.
