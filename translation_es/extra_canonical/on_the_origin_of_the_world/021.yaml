base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: es
  text: 'Permítanme decir a continuación que, cuando los arcontes vieron que él y el ser femenino que vivía con él se extraviaban sin darse cuenta, como animales, se alegraron muchísimo.


    Cuando supieron que el hombre inmortal no los pasaría por alto, se inquietaron, pues ahora tendrían que temer al ser femenino que se había convertido en árbol. Dijeron: «Quizá este sea el verdadero hombre, este ser que nos envolvió en una niebla y nos enseñó que aquella que fue profanada se le parece. Entonces seremos derrotados».


    Después, los siete tramaron planes en conjunto. Se acercaron con nerviosismo a Adán y Eva, y le dijeron a él: «Pueden comer del fruto de cualquiera de los árboles creados para ustedes en el Paraíso. Pero, en cuanto al árbol del conocimiento, contrólate y no comas de él. Si comes, morirás». Después de causarles una profunda angustia, se retiraron adonde estaban sus autoridades.


    Entonces se acercó la más astuta de todas las criaturas, llamada «Bestia». Al contemplar la semejanza de Eva, madre de ellos, le dijo: «¿Qué les ha dicho Dios? ¿Acaso fue: “No coman del árbol del conocimiento”?»


    Ella respondió: «No solo dijo: “No coman de él”, sino también: “No lo toquen, o morirán”».


    Él le dijo: «No temas. De muerte no morirán,[a] porque él sabe que, cuando coman […] de él,[b] su entendimiento recobrará la lucidez y llegarán a ser como dioses, conociendo la diferencia entre los seres humanos malos y los buenos.[c] En realidad, les dijo esto por celos, para impedir que comieran de él».


    Eva cobró entonces confianza en las palabras del maestro. Observó el árbol y reconoció que era hermoso y agradable, y lo deseó. Tomó de su fruto y comió; también dio a su esposo, y él igualmente comió. Entonces se les abrió la mente, porque, cuando comieron, la luz del conocimiento resplandeció sobre ellos. Cuando se cubrieron de vergüenza, comprendieron que estaban desnudos, sin conocimiento.[d] Cuando recobraron la lucidez, comprendieron que estaban desnudos y se enamoraron el uno del otro. Cuando comprendieron que quienes los habían formado tenían apariencia de animales, los odiaron. Habían adquirido una conciencia aguda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión «de muerte no morirán» reproduce una negación enfática de forma deliberadamente literal; también podría traducirse: «ciertamente no morirán».'
    reason: La construcción resulta extraña en español, pero refleja un giro enfático importante y su eco de Génesis.
  - marker: b
    text: Los corchetes señalan una laguna o una restauración incierta en la tradición manuscrita.
    reason: Debe hacerse visible la incertidumbre textual indicada en el testimonio de base.
  - marker: c
    text: El testimonio suministrado dice literalmente «conociendo la diferencia entre seres humanos malos y buenos». La construcción podría depender de una lectura o restauración que requiere cotejo directo con el copto.
    reason: La frase difiere del conocido «bien y mal» de Génesis y no debe normalizarse silenciosamente.
  - marker: d
    text: La expresión «desnudos, sin conocimiento» es difícil y se conserva sin resolver. Podría admitir otra segmentación o interpretación tras revisar los testigos coptos.
    reason: Se preserva una tensión textual y conceptual que el testimonio inglés no permite zanjar.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico habitual para las potestades gobernantes de este escrito, en vez de reducirlo al sentido genérico de «gobernantes».
- source_word: deathless man
  choice: hombre inmortal
  rationale: Expresa de manera natural la ausencia de muerte sin identificar al personaje mediante una interpretación añadida.
- source_word: female being
  choice: ser femenino
  rationale: Mantiene la formulación ontológica y algo inusual del testimonio, sin sustituirla simplemente por «mujer».
- source_word: real man
  choice: verdadero hombre
  rationale: Conserva la tensión antropológica del pasaje y evita decidir si «hombre» significa individuo, humanidad o arquetipo.
- source_word: exercise self-constraint
  choice: contrólate
  rationale: Comunica la exhortación a contenerse en español actual y concuerda con el mandato singular dirigido a Adán.
- source_word: Beast
  choice: Bestia
  rationale: La mayúscula y las comillas reflejan que funciona como nombre o designación, no solo como descripción.
- source_word: reasoning
  choice: entendimiento
  rationale: «Entendimiento» resulta claro y digno, y abarca la facultad de razonar que pasa de la confusión a la lucidez.
- source_word: grow sober / sobered up
  choice: recobrará la lucidez / recobraron la lucidez
  rationale: Preserva la metáfora de salir de un estado de embotamiento, evitando la lectura exclusivamente relacionada con el alcohol.
- source_word: shaped
  choice: formado
  rationale: Conserva la imagen de dar forma propia de la antropogonía, sin imponer «creado».
- source_word: acutely aware
  choice: habían adquirido una conciencia aguda
  rationale: Retiene la conclusión enfática sobre el despertar de la percepción sin especificar indebidamente su objeto.
theological_decisions:
- issue: Identidad del que impone la prohibición
  choice: Se conserva «Dios» únicamente en la pregunta de la Bestia y se mantienen los pronombres en su explicación.
  alternative: Identificar explícitamente al hablante con un arconte, el demiurgo o el Dios supremo.
  rationale: El pasaje presenta voces y niveles de autoridad en tensión; añadir una identificación resolvería una cuestión que el texto suministrado deja abierta.
- issue: Sentido de «como dioses»
  choice: «como dioses»
  alternative: «como Dios» o «como seres divinos»
  rationale: Mantiene el plural del testimonio y su ambigüedad sobre los seres divinos comparados.
- issue: Valor del árbol y del conocimiento
  choice: Se conserva la presentación positiva del conocimiento dentro de este relato.
  alternative: Armonizar el episodio con una lectura en la que la ingestión sea exclusivamente caída y engaño.
  rationale: La obra reelabora deliberadamente la tradición de Génesis; la traducción no debe neutralizar su inversión teológica.
- issue: «Aquella que fue profanada»
  choice: Se mantiene la voz pasiva y no se identifica a la mujer ni al agente de la profanación.
  alternative: Nombrarla como Eva o explicar quién la profanó.
  rationale: El referente y el agente no quedan inequívocamente determinados en el fragmento.
- issue: Desnudez «sin conocimiento»
  choice: Se conserva la frase paradójica «desnudos, sin conocimiento».
  alternative: Reformular como «comprendieron por conocimiento que estaban desnudos».
  rationale: La secuencia presenta una tensión conceptual genuina que no debe allanarse sin revisión copta.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplean «ustedes» y formas verbales correspondientes en el diálogo plural. El borrador es necesariamente provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa del copto de Nag Hammadi II,5 y de los testigos relacionados está pendiente. Se conservaron términos técnicos, anomalías y ambigüedades relevantes en lugar de armonizarlos con Génesis.'
