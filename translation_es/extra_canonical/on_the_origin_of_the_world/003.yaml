base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: es
  text: 'Cuando el arconte contempló su propia grandeza —aunque no veía a nadie fuera de sí mismo, pues más allá solo veía agua y oscuridad—, imaginó que era el único ser existente. Su […] se completó mediante la articulación de palabras, que [] se manifestó como un espíritu que iba y venía sobre las aguas. Cuando aquel espíritu se manifestó, el arconte separó la sustancia acuosa, y lo seco quedó apartado en otro lugar. Con la materia se formó una morada y la llamó «Cielo». También con la materia, el arconte formó un estrado para sus pies y lo llamó «Tierra».


    Entonces le sobrevino al arconte un pensamiento acorde con su naturaleza y, mediante la articulación de palabras, creó un ser andrógino.[a] Abrió la boca y emitió hacia él un arrullo. Cuando se le abrieron los ojos, miró a su padre y emitió el sonido «¡iii!». Su padre entonces lo llamó «Iii-a-o».[b]


    Después creó al segundo hijo y emitió hacia él un arrullo. Cuando este abrió los ojos, emitió ante su padre el sonido «¡e!». Su padre lo llamó «Eloai».


    Después creó al tercer hijo y emitió hacia él un arrullo. Cuando este abrió los ojos, emitió ante su padre el sonido «¡asss!». Su padre lo llamó «Astafaios».


    Estos tres son los hijos de su padre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Andrógino» designa aquí a un ser que reúne rasgos masculinos y femeninos; el texto no explica con más precisión su naturaleza.
    reason: Aclara un término poco común sin eliminar su ambigüedad.
  - marker: b
    text: El nombre reproduce los sonidos que el hijo acaba de emitir. En el testimonio consultado aparece un marcador de referencia «[1]», pero no se proporcionó el contenido de esa nota.
    reason: Explica el juego fonético y da cuenta de manera transparente del marcador presente en el testimonio.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Se conserva el término técnico habitual en estudios de estos textos, en vez de reducirlo a «gobernante» o «jefe», que podría borrar su función cosmológica específica.
- source_word: size
  choice: propia grandeza
  rationale: «Tamaño» resultaría demasiado físico y poco natural aquí; «grandeza» mantiene abierta la posibilidad de magnitud, extensión o autoimportancia sin resolverla por completo.
- source_word: verbal articulation
  choice: articulación de palabras
  rationale: Expresa la producción articulada del habla y evita identificarla sin apoyo suficiente con una doctrina específica de la Palabra o el Logos.
- source_word: spirit
  choice: espíritu
  rationale: Mantiene la resonancia cosmológica del pasaje y la posible alusión escritural sin explicar de manera doctrinal la identidad del espíritu.
- source_word: aqueous substance
  choice: sustancia acuosa
  rationale: Conserva el lenguaje material y cosmológico del testimonio.
- source_word: footstool
  choice: estrado para sus pies
  rationale: Es comprensible en español actual y conserva la imagen regia o cosmológica del original.
- source_word: androgyne
  choice: ser andrógino
  rationale: «Ser» aporta naturalidad y «andrógino» conserva la ambigüedad sexual o genérica propia del término.
- source_word: cooing sound
  choice: arrullo
  rationale: Comunica una vocalización suave y no verbal; «emitió» evita atribuirle necesariamente afecto maternal.
- source_word: Eee-a-o / Eloai / Astaphaios
  choice: Iii-a-o / Eloai / Astafaios
  rationale: Se adaptan prudentemente los valores fonéticos y la grafía al español, manteniendo reconocibles los nombres transmitidos.
theological_decisions:
- issue: Posible eco de Génesis 1 en «espíritu… sobre las aguas»
  choice: Conservar la formulación sin identificar al espíritu con el Espíritu de Dios
  alternative: Escribir «el Espíritu de Dios» o explicar explícitamente el paralelismo
  rationale: El pasaje evoca lenguaje de Génesis, pero el testimonio suministrado solo dice «un espíritu»; precisar su identidad resolvería indebidamente la tensión.
- issue: Creación mediante habla articulada
  choice: Traducir literalmente la mediación verbal sin usar «la Palabra»
  alternative: Interpretarlo como creación mediante el Logos
  rationale: «La Palabra» introduciría una categoría teológica más definida de la que permite la evidencia suministrada.
- issue: Naturaleza del primer hijo
  choice: «un ser andrógino»
  alternative: «un hombre y mujer» o una definición biológica más concreta
  rationale: La formulación preserva la ambigüedad antropológica y mitológica del término.
- issue: Valoración moral del arconte
  choice: No añadir calificativos como «ciego», «malvado» o «ignorante»
  alternative: Explicitar la evaluación negativa común en lecturas gnósticas
  rationale: Aunque el contexto puede sugerir ignorancia, este fragmento solo narra su inferencia y sus actos; la traducción no debe importar una caracterización denominacional o interpretativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los dos indicadores de laguna manuscrita («[…]» y «[]») tal como aparecen en el testimonio suministrado, a la espera de revisión directa del copto. Se evita un estilo excesivamente bíblico o confesional, aunque se mantienen las resonancias cosmológicas del pasaje. Dado que la revisión del copto está pendiente, las decisiones son provisionales y se basan en el testimonio inglés público proporcionado.
