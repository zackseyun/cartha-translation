  revision_rationale: Se preservan las lagunas manuscritas, la posible resonancia de Génesis sin identificación doctrinal del espíritu, y la ambigüedad de «andrógino». Las correcciones restituyen la agencia del arconte y «para sí», conservan las formas fónicas y onomásticas del testimonio inglés, y restauran el único marcador de nota efectivamente transmitido.
