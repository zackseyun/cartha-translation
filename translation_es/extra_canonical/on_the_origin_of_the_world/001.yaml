    text: El comienzo del manuscrito presenta una laguna; no se conserva aquí una reconstrucción segura.
    reason: Señalar la pérdida textual indicada por los corchetes iniciales del testimonio.
  - marker: b
    text: Hay una laguna en este punto del manuscrito; la continuidad exacta de la frase es incierta.
    reason: Conservar la señal de daño o restauración presente en el testimonio suministrado.
