translation:
  language: es
  text: '[a] Puesto que todos —tanto los dioses cósmicos como los seres humanos— afirman que nada existía antes del Caos, demostraré, en contra de ellos, que todos están equivocados, pues desconocen tanto el origen del Caos como su raíz. La prueba es la siguiente:


    En cuanto al Caos, ¡cómo les agrada [b] a todos afirmar que es una especie de oscuridad!, cuando en realidad procede de una sombra llamada «Oscuridad»; y esa sombra procede de un ser creado que existe desde el principio. Es evidente, además, que este existía antes de que surgiera el Caos, y que el Caos llegó a existir después de aquel primer ser creado.


    Por consiguiente, ocupémonos de los hechos y, además, del primer ser creado, del cual fue expulsado el Caos. Así quedará claramente demostrada la verdad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El comienzo del manuscrito presenta una laguna; no se conserva aquí una reconstrucción segura.
    reason: Señalar la pérdida textual indicada por los corchetes iniciales del testimonio.
  - marker: b
    text: Hay una laguna en este punto del manuscrito; la continuidad exacta de la frase es incierta.
    reason: Conservar la señal de daño o restauración presente en el testimonio suministrado.
lexical_decisions:
- source_word: Chaos
  choice: Caos
  rationale: Se conserva como nombre conceptual personificado, con mayúscula, siguiendo el testimonio suministrado.
- source_word: cosmic gods
  choice: dioses cósmicos
  rationale: Traducción formal que mantiene el alcance cosmológico sin introducir categorías doctrinales ajenas.
- source_word: Darkness
  choice: Oscuridad
  rationale: La mayúscula preserva su función de nombre en la expresión «llamada por el nombre Oscuridad».
- source_word: created entity
  choice: ser creado
  rationale: Expresión natural en español que conserva la condición creada sin precisar indebidamente la naturaleza de la entidad.
- source_word: was propelled
  choice: fue expulsado
  rationale: Refleja el movimiento de salida expresado por el testimonio, aunque el matiz exacto permanece sujeto a revisión del copto.
theological_decisions:
- issue: Relación temporal entre el primer ser creado, la sombra y el Caos
  choice: Mantener explícitamente que el ser creado precede al Caos y que de él procede la sombra
  alternative: Armonizar la secuencia con una cosmología teológica posterior
  rationale: El pasaje formula su propia secuencia cosmológica; no corresponde resolverla mediante doctrinas externas.
- issue: Naturaleza del «primer ser creado»
  choice: Dejarla sin identificar
  alternative: Identificarlo con una figura divina, espiritual o demiúrgica concreta
  rationale: La introducción no ofrece aquí una identificación inequívoca y debe preservarse la indeterminación.
- issue: Estatus de Caos y Oscuridad
  choice: Usar mayúsculas sin afirmar explícitamente que sean personas
  alternative: Tratarlos como meros nombres comunes o como seres personales definidos
  rationale: La forma nominal del testimonio sugiere conceptos individualizados, pero no basta para zanjar su grado de personificación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el tono polémico y demostrativo del prólogo. Este borrador es provisional porque se basa en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto y de los testigos relacionados.
