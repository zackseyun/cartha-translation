review_pass:
  verdict: revise
  source_fidelity: El borrador conserva adecuadamente la secuencia cosmológica y las lagunas del testimonio inglés provisional. Sin embargo, «fue expulsado» intensifica indebidamente «was propelled», que describe impulso o proyección y no exige una expulsión. «En contra de ellos» también es algo más confrontativo que «in contrast to them». La referencia de «este» puede resultar ambigua en español; conviene explicitar que se refiere a la entidad creada.
  naturalness: El español es en general natural y de registro apropiado. Se mejora la fluidez con «a diferencia de ellos», «Esta es la prueba» y una formulación no ambigua para la entidad creada. Se mantiene la exclamación polémica, compatible con el tono del testimonio.
  terminology: «Caos», «Oscuridad», «dioses cósmicos» y «entidad creada» preservan los términos y su función conceptual sin imponer identificaciones doctrinales. «Impulsado» reproduce con mayor cautela el movimiento de «propelled».
  issues:
  - severity: medium
    issue: «fue expulsado» para «was propelled»
    rationale: «Expulsado» presupone una expulsión y puede sugerir un agente expulsor o una exclusión espacial. «Fue impulsado» mantiene el sentido básico de movimiento causado sin añadir esos matices.
  - severity: low
    issue: «en contra de ellos» para «in contrast to them»
    rationale: La expresión española puede comunicar oposición activa; «a diferencia de ellos» conserva mejor el contraste argumentativo del testimonio.
  - severity: low
    issue: Antecedente potencialmente ambiguo de «este existía»
    rationale: Tras «sombra» y «ser creado», el demostrativo masculino probablemente se entiende como referido al ser, pero explicitar «esta entidad creada» evita ambigüedad sin alterar la secuencia.
  revised_text: '[a] Puesto que todos —tanto los dioses cósmicos como los seres humanos— afirman que nada existía antes del Caos, a diferencia de ellos demostraré que todos están equivocados, pues desconocen tanto el origen del Caos como su raíz. Esta es la prueba:


    En cuanto al Caos, ¡cómo les agrada [b] a todos afirmar que es una especie de oscuridad!, cuando en realidad procede de una sombra llamada «Oscuridad»; y la sombra procede de una entidad creada que ha existido desde el principio. Además, es evidente que esta entidad creada existía antes de que llegara a ser el Caos, y que este llegó a existir después de aquella entidad creada.


    Por consiguiente, ocupémonos de la realidad de este asunto y, además, de la primera entidad creada, de la cual fue impulsado el Caos. Así quedará claramente demostrada la verdad.'
  revised_footnotes:
  - marker: a
    text: El comienzo del manuscrito presenta una laguna; no se conserva aquí una reconstrucción segura.
    reason: Señala la pérdida textual indicada por los corchetes iniciales del testimonio.
  - marker: b
    text: Hay una laguna en este punto del manuscrito; la continuidad exacta de la frase es incierta.
    reason: Conserva la señal de daño o restauración presente en el testimonio suministrado.
  revision_rationale: 'La revisión se limita a correcciones seguras basadas en el testimonio inglés suministrado: atenúa una oposición no exigida, aclara referentes y evita que «propelled» se convierta en una expulsión. Se preservan las mayúsculas conceptuales, la indeterminación de la entidad creada y las dos lagunas textuales. Dado que la revisión directa del copto sigue pendiente, no se intenta resolver matices que dependan de los testigos coptos.'
