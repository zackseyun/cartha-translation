translation:
  language: es
  text: 'Antes de la consumación de la era, todo aquel lugar temblará con fuertes truenos. Entonces los arcontes se llenarán de tristeza por [temor a] su [] muerte inminente.[a] Los ángeles se lamentarán por su humanidad; los demonios llorarán por sus tiempos, y su humanidad gemirá y gritará ante su muerte inminente.


    Entonces comenzará la era, y ellos quedarán desconcertados. Sus reyes se embriagarán con la espada de fuego y harán guerra unos contra otros, haciendo que la tierra se embriague de sangre derramada; y los mares se agitarán a causa de esas guerras. Entonces el sol se oscurecerá y la luna ocultará su luz. Las estrellas del cielo dejarán de seguir sus órbitas, y un fuerte estampido de trueno surgirá de una gran hueste que está por encima de todas las huestes del Caos, donde se encuentra el firmamento de la mujer.


    Después de haber producido la primera creación, ella dejará a un lado el fuego sabio del razonamiento y se revestirá de ira irracional.


    Luego perseguirá a los dioses del Caos, a quienes creó junto con el Progenitor Primordial. Los arrojará al Abismo. Serán aniquilados por su maldad, pues llegarán a ser como volcanes y se devorarán unos a otros hasta ser destruidos por el poder del Progenitor Primordial.


    Después de destruirlos, él se volverá contra sí mismo y se destruirá hasta dejar de existir. Los cielos de ellos caerán unos sobre otros, y sus huestes serán devoradas por el fuego. Sus eones también serán derribados; el cielo de él se desplomará y se partirá en dos. Sus [estrellas…] caerán sobre la tierra, [y la tierra no podrá] soportarlas. Caerán en el Abismo, y el Abismo será trastornado. La luz [vencerá] a la oscuridad y la aniquilará. Esta llegará a ser como [] algo que nunca existió; el origen de la oscuridad se disipará y la deficiencia será arrancada de raíz y arrojada a la oscuridad. La luz se retirará hacia arriba, a su raíz, y aparecerá la gloria del Ingénito. Esta llenará todos los eones cuando las profecías y los escritos de los reyes sean revelados y cumplidos por aquellos a quienes llaman perfectos.


    Sin embargo, quienes no hayan llegado a ser perfectos en el Padre Ingénito recibirán su gloria en sus propios eones y en los reinos de los inmortales, pero nunca entrarán en el eón sin rey, porque cada cual debe ir al lugar de donde vino. Por sus obras y su conocimiento, cada cual revelará su propia naturaleza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes señalan palabras restituidas o lagunas del manuscrito. Aquí el texto conserva una laguna antes de «muerte»; otras restituciones y lagunas se mantienen del mismo modo a lo largo del pasaje.
    reason: Aclara la convención editorial sin ocultar el estado fragmentario del testimonio.
lexical_decisions:
- source_word: consummation of the age
  choice: consumación de la era
  rationale: Conserva el sentido escatológico de culminación y evita confundir «age» con el mundo físico.
- source_word: archons
  choice: arcontes
  rationale: Mantiene el término técnico del ámbito gnóstico, en vez de reducirlo genéricamente a «gobernantes».
- source_word: aeons
  choice: eones
  rationale: Preserva el vocabulario cosmológico técnico y su posible polisemia temporal y espacial.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Expresa prioridad originaria sin imponer género donde el título inglés es inclusivo.
- source_word: Abyss
  choice: Abismo
  rationale: Retiene su carácter de ámbito cosmológico mediante mayúscula.
- source_word: unbegotten one / unbegotten Father
  choice: Ingénito / Padre Ingénito
  rationale: «Ingénito» comunica que no fue engendrado y mantiene la relación terminológica entre ambos títulos.
- source_word: kingless aeon
  choice: eón sin rey
  rationale: Traducción transparente que conserva la expresión inusual sin interpretarla doctrinalmente.
- source_word: their humanity
  choice: su humanidad
  rationale: Se conserva la formulación extraña del testimonio, pues puede ser un término antropológico técnico y no simplemente «los seres humanos».
theological_decisions:
- issue: Identidad y cambios de referente en los pronombres
  choice: Conservar los cambios entre «ella», «él» y «ellos» sin identificar explícitamente a los referentes
  alternative: Sustituir los pronombres por nombres cosmológicos inferidos
  rationale: El pasaje suministrado presenta referentes ambiguos; explicitarlos resolvería una tensión que el testimonio no resuelve.
- issue: Destino de quienes no llegan a ser perfectos
  choice: Traducir literalmente que reciben gloria pero no entran en el eón sin rey
  alternative: Armonizarlo con un esquema de salvación o condenación determinado
  rationale: Se preserva la gradación cosmológica propia del texto sin importar categorías confesionales posteriores.
- issue: Cumplimiento de profecías y escritos
  choice: «revelados y cumplidos por aquellos a quienes llaman perfectos»
  alternative: Interpretar que las profecías se cumplen acerca de los perfectos o en ellos
  rationale: La relación sintáctica admite tensión; se mantiene la agencia expresada en el testimonio inglés provisional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron términos cosmológicos técnicos como «arcontes» y «eones». La traducción es provisional porque no se proporcionó el texto copto y la revisión directa de la lengua fuente está pendiente; por ello se siguió críticamente el testimonio inglés de dominio público, preservando corchetes, elipsis, ambigüedades pronominales e imágenes inusuales. Se omitió el número de página intrusivo [17].
