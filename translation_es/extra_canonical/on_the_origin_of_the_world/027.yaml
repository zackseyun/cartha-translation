    Entonces comenzará la era, y ellos se angustiarán. Sus reyes se embriagarán con la espada de fuego y harán guerra unos contra otros, haciendo que la tierra se embriague de derramamiento de sangre; y los mares se agitarán a causa de esas guerras. Entonces el sol se oscurecerá y la luna eclipsará su luz. Las estrellas del cielo dejarán de seguir sus órbitas, y un fuerte estruendo de trueno surgirá de una gran hueste que está sobre toda hueste del Caos, donde se encuentra el firmamento de la mujer.


    Después de haber producido la primera creación, ella dejará a un lado el fuego sabio del razonamiento y se revestirá de ira sin razón.


    Luego acosará a los dioses del Caos, a quienes creó junto con el Progenitor Primordial. Los arrojará al Abismo. Serán aniquilados por su maldad, pues se volverán como volcanes y se devorarán unos a otros hasta que sean destruidos por el poder del Progenitor Primordial.


    Después de destruirlos, él se volverá contra sí mismo y se destruirá hasta dejar de existir. Los cielos de ellos caerán unos sobre otros, y sus huestes serán devoradas por el fuego. Sus eones también serán derribados; el cielo de él se desplomará y se partirá en dos. Sus [estrellas…] caerán sobre la tierra, [y la tierra no podrá] soportarlas. Caerán en el Abismo, y el Abismo será trastornado. La luz [vencerá] a la oscuridad y la aniquilará. La oscuridad llegará a ser como [] algo que nunca existió; el origen de la oscuridad se disipará, y la deficiencia será arrancada de raíz y arrojada a la oscuridad. La luz se retirará hacia lo alto, a su raíz, y aparecerá la gloria del Ingénito, y llenará todos los eones cuando las profecías y los escritos de los reyes sean revelados y cumplidos por los que son llamados perfectos.


    Sin embargo, quienes no hayan llegado a ser perfectos en el Padre Ingénito recibirán su gloria en sus eones y en los reinos de los inmortales, pero nunca entrarán en el eón sin rey, porque cada cual debe ir al lugar de donde vino. Por sus obras y su conocimiento, cada cual revelará su propia naturaleza.'
