review_pass:
  verdict: revise
  source_fidelity: La traducción conserva los nombres, la condición de Adán «que no tenía alma», la función de Zoé/Eva y la imagen de los «recipientes de luz». Sin embargo, «tendido en el suelo» atenúa «lying prostrate» y omite el matiz explícito de «male companion». Asimismo, «sobre la tierra» no es una formulación natural para el mandato de ponerse de pie.
  naturalness: El español es en general claro y digno. Se mejora la formulación del mandato a «Ponte de pie en la tierra» y se evita la puntuación final redundante tras la exclamación citada.
  terminology: «Sofía», «Zoé», «Eva», «alma», «recipientes de luz» y «Madre de los Vivientes» son elecciones adecuadas y no imponen una interpretación doctrinal. «Compañero varón» recupera la precisión del testimonio sin introducir categorías ajenas.
  issues:
  - severity: medium
    issue: Se atenúa y se incompleta la descripción de Eva al encontrar a Adán.
    rationale: El testimonio dice «her male companion lying prostrate». «Su compañero tendido en el suelo» omite «male» y es menos preciso que «postrado» para «prostrate».
  - severity: medium
    issue: La señal textual de laguna no se preserva literalmente en el cuerpo.
    rationale: El testimonio presenta «[When] [] Eve». Sustituir el segundo par de corchetes por «[a]» puede confundirse con una restauración textual. Conviene conservar «[]» y colocar la llamada de nota aparte.
  - severity: low
    issue: «Levántate sobre la tierra» es poco idiomático en español.
    rationale: Para el imperativo de ponerse de pie, «Ponte de pie en la tierra» expresa naturalmente el sentido del testimonio sin modificarlo.
  revised_text: 'Después del día de descanso, Sofía envió a su hija Zoé, llamada Eva, como maestra, para que hiciera levantarse a Adán, que no tenía alma, a fin de que aquellos que él engendrara pudieran convertirse en recipientes de luz.


    [Cuando] [] Eva[a] vio a su compañero varón postrado, se compadeció de él y dijo: «¡Adán, vive! ¡Ponte de pie en la tierra!»


    Lo que ella dijo se cumplió de inmediato en los hechos, pues Adán, al ponerse de pie, abrió rápidamente los ojos. Cuando la vio, dijo: «Serás llamada “Madre de los Vivientes”, porque tú eres quien me ha dado vida».'
  revised_footnotes:
  - marker: a
    text: El testimonio utilizado presenta aquí una laguna o señal de texto dañado después de «[Cuando]».
    reason: Se conserva en el cuerpo la señal «[]» del testimonio, y la nota explica su función sin convertirla en una supuesta restauración textual.
  revision_rationale: Se preservan de forma explícita las dos señales entre corchetes del testimonio y se ancla la explicación de la laguna con una llamada independiente. Se recuperan «compañero varón» y «postrado» para reflejar el texto de partida con mayor precisión, y se ajusta el imperativo a un español latinoamericano natural. Dado que la revisión directa del copto sigue pendiente, no se resuelven ni amplían las ambigüedades del testimonio inglés.
