base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: es
  text: 'Después del día de descanso, Sofía envió a su hija Zoé, llamada Eva, como maestra, para que hiciera levantarse a Adán, que no tenía alma, a fin de que aquellos que él engendrara pudieran convertirse en recipientes de luz.


    [Cuando] [a] Eva vio a su compañero tendido en el suelo, se compadeció de él y dijo: «¡Adán, vive! ¡Levántate sobre la tierra!».


    Sus palabras se cumplieron de inmediato en los hechos, pues Adán se levantó y rápidamente abrió los ojos. Cuando la vio, dijo: «Serás llamada “Madre de los Vivientes”, porque tú eres quien me ha dado vida».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio utilizado presenta aquí una laguna o señal de texto dañado después de «Cuando».
    reason: Se preserva mediante una nota la señal manuscrita/restaurativa indicada por los corchetes del testimonio inglés, evitando dejar un par de corchetes vacío y opaco en el cuerpo.
lexical_decisions:
- source_word: Sophia
  choice: Sofía
  rationale: Se conserva como nombre propio en su forma tradicional española, manteniendo además su asociación transparente con la Sabiduría sin sustituir el nombre por una interpretación.
- source_word: Zoe
  choice: Zoé
  rationale: Se translitera como nombre propio y no se traduce como «Vida», para conservar la distinción narrativa entre Zoé y el título posterior «Madre de los Vivientes».
- source_word: soulless Adam
  choice: Adán, que no tenía alma
  rationale: Reproduce de manera directa la afirmación antropológica del testimonio disponible, sin suavizarla ni armonizarla con otros relatos de Adán.
- source_word: vessels of light
  choice: recipientes de luz
  rationale: Mantiene la metáfora concreta y la posible carga cosmológica del original, sin explicarla como una doctrina específica.
- source_word: lying prostrate
  choice: tendido en el suelo
  rationale: Expresa una postura abatida u horizontal de forma natural, sin precisar «boca abajo», detalle que el testimonio no exige inequívocamente.
- source_word: Mother of the Living
  choice: Madre de los Vivientes
  rationale: Conserva el título solemne y su juego conceptual con Eva como dadora de vida.
theological_decisions:
- issue: La condición inicial de Adán
  choice: «que no tenía alma»
  alternative: «sin vida» o «inanimado»
  rationale: El testimonio dice «soulless»; se mantiene la tensión teológica propia del escrito y no se reemplaza por una formulación armonizadora.
- issue: La función de Eva/Zoé
  choice: «como maestra» y agente que da vida a Adán
  alternative: «para instruirlo» o una formulación que atribuya la vida a otro agente
  rationale: Se preserva la función explícita que el pasaje asigna al personaje femenino, sin reducirla ni ampliarla doctrinalmente.
- issue: Cumplimiento performativo de las palabras
  choice: «Sus palabras se cumplieron de inmediato en los hechos»
  alternative: «Su orden surtió efecto»
  rationale: Mantiene el vínculo entre expresión y acto sin definir metafísicamente el mecanismo causal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto. Se mantienen los nombres Sofía y Zoé, las imágenes cosmológicas y la tensión antropológica del pasaje.
