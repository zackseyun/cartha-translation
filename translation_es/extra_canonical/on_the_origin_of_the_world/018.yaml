review_pass:
  verdict: revise
  source_fidelity: 'La versión reproduce fielmente el testimonio inglés disponible en sus elementos principales: Sofía envía a Zoé/Eva como maestra; Adán carece de alma; sus descendientes pueden llegar a ser recipientes de luz; Eva le da vida y recibe el título «Madre de los Vivientes». Sin embargo, la señal textual «[When] []» debe conservarse sin convertir el segundo par de corchetes en un ancla de nota no presente en el testimonio. «Tendido en el suelo» atenúa «lying prostrate»; «yacía postrado» conserva mejor la postura sin imponer el detalle «boca abajo».'
  naturalness: El registro es en general natural y digno. «Para que hiciera levantarse a Adán» resulta algo forzado; «para que levantara a Adán» es más idiomático y conserva el sentido causativo. «¡Ponte de pie sobre la tierra!» expresa con claridad el imperativo y la localización del testimonio.
  terminology: Sofía, Zoé y Eva están bien tratados como nombres propios. «Que no tenía alma», «recipientes de luz» y «Madre de los Vivientes» preservan adecuadamente la terminología y las tensiones del pasaje, sin armonización doctrinal.
  issues:
  - severity: medium
    issue: La laguna/señal editorial «[]» se transformó en el marcador de nota «[a]».
    rationale: El testimonio inglés presenta literalmente «[When] [] Eve». Sustituir los corchetes vacíos por una letra introduce una convención editorial ajena y ya no preserva exactamente la señal de daño o restauración indicada. Deben mantenerse «[Cuando] []» en el texto.
  - severity: low
    issue: «Tendido en el suelo» no expresa plenamente «lying prostrate».
    rationale: La formulación española indica que Adán está horizontal, pero omite la connotación de postración. «Yacía postrado» mantiene la ambigüedad sobre la orientación corporal y es más cercano al testimonio.
  - severity: low
    issue: «Hiciera levantarse a Adán» es poco idiomático.
    rationale: «Levantara a Adán» comunica naturalmente que Eva hace que Adán se ponga de pie, sin pérdida de la relación causal.
  revised_text: 'Después del día de descanso, Sofía envió a su hija Zoé, llamada Eva, como maestra, para que levantara a Adán, que no tenía alma, a fin de que aquellos que él engendrara pudieran convertirse en recipientes de luz.


    [Cuando] [] Eva vio a su compañero que yacía postrado, se compadeció de él y dijo: «¡Adán, vive! ¡Ponte de pie sobre la tierra!».


    Sus palabras se cumplieron de inmediato en los hechos, pues Adán se levantó y rápidamente abrió los ojos. Cuando la vio, dijo: «Serás llamada “Madre de los Vivientes”, porque tú eres quien me ha dado vida».'
  revised_footnotes: []
  revision_rationale: La revisión conserva de forma visible las dos señales entre corchetes del testimonio suministrado, sin crear un marcador editorial adicional. También ajusta dos expresiones para mejorar la fidelidad semántica y la fluidez del español. Dado que la base proporcionada es un testimonio inglés y la revisión directa del copto sigue pendiente, no se introducen precisiones que excedan esa evidencia.
