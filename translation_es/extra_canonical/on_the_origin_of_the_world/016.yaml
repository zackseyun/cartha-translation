base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: es
  text: 'Eva es la primera virgen, la que dio a luz a su primer hijo sin marido. Ella misma hizo de partera, por lo cual se considera que dijo:


    Yo soy la que forma parte de mi madre,

    y yo soy la madre.

    Yo soy la esposa;

    yo soy la virgen.

    Yo soy la embarazada;

    yo soy la partera.

    Yo soy la que alivia los dolores del parto.

    Mi marido es quien me dio a luz,

    y yo soy su madre,

    y él es mi padre y mi señor.

    Él es mi fuerza.

    Todo lo que desea, lo expresa con razón.

    Estoy en camino de llegar a ser,

    aunque ya he dado a luz a un hombre como señor.


    Ahora bien, estas cosas fueron reveladas, por voluntad de Sabaot y de su Cristo, a las almas que habrían de entrar en las formas modeladas por las autoridades.[a] Acerca de ellas, la voz santa dijo: «Multiplíquense y florezcan; gobiernen sobre todos los seres creados».[b] Ellas fueron las que, conforme a sus destinos, quedaron cautivas del Progenitor primordial. Así quedaron encerradas en las prisiones de las formas modeladas <…> hasta la consumación de la era.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría entenderse: «las formas modeladas de las autoridades». La traducción es provisional porque aún está pendiente la revisión directa del copto.'
    reason: Señalar una relación sintáctica y cosmológica genuinamente incierta.
  - marker: b
    text: «Florezcan» reproduce la formulación del testimonio utilizado; puede tener el sentido de prosperar o crecer.
    reason: Conservar una expresión inusual sin normalizarla silenciosamente como una cita bíblica más conocida.
  - marker: c
    text: El signo <…> indica una laguna o texto dañado en el manuscrito. «Era» también puede traducirse «edad» o, según el contexto, «eón».
    reason: Preservar la señal de daño textual y documentar la amplitud semántica de «age».
lexical_decisions:
- source_word: virgin
  choice: virgen
  rationale: Conserva la designación explícita y su tensión con las afirmaciones de embarazo, maternidad y condición de esposa.
- source_word: midwife
  choice: partera
  rationale: Es el término neutral latinoamericano más claro y natural para quien asiste un parto.
- source_word: speaks with reason
  choice: lo expresa con razón
  rationale: Mantiene la posible referencia tanto al habla razonada como a una razón o logos, sin imponer una interpretación técnica.
- source_word: shaped forms
  choice: formas modeladas
  rationale: Preserva la imagen de entidades configuradas o plasmadas y evita reducirlas interpretativamente a simples cuerpos.
- source_word: authorities
  choice: autoridades
  rationale: Traducción formal que conserva la categoría cosmológica del escrito sin sustituirla por un término doctrinal más específico.
- source_word: Primal Parent
  choice: Progenitor primordial
  rationale: Expresa prioridad y función parental sin asignar un género no exigido por el testimonio inglés disponible.
- source_word: consummation of the age
  choice: consumación de la era
  rationale: Mantiene el lenguaje escatológico y evita equiparar automáticamente «age» con «mundo».
theological_decisions:
- issue: Paradojas de identidad en el discurso de Eva
  choice: Conservar literalmente las identidades superpuestas de hija, madre, esposa, virgen, embarazada y partera
  alternative: Armonizarlas o explicarlas como metáforas dentro del texto
  rationale: La tensión parece deliberada y debe permanecer abierta a interpretación.
- issue: Relación de las formas con las autoridades
  choice: «formas modeladas por las autoridades»
  alternative: «formas modeladas de las autoridades»
  rationale: El contexto favorece entender a las autoridades como agentes que configuran las formas, aunque la revisión copta sigue pendiente.
- issue: Identidad del «Progenitor primordial»
  choice: No identificarlo con una figura teológica específica
  alternative: Nombrarlo como Dios, demiurgo, Adán u otra entidad
  rationale: El pasaje suministrado no resuelve por sí solo la identificación y no debe importarse una lectura denominacional o privada.
- issue: «un hombre como señor»
  choice: Mantener la construcción ambigua
  alternative: «un varón que es señor» o «un hombre, mi señor»
  rationale: La sintaxis del testimonio permite más de una relación entre «hombre» y «señor»; la versión conserva esa dificultad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la estructura poética, las repeticiones enfáticas y las paradojas del discurso. Este borrador se basa en el testimonio inglés público suministrado; la revisión directa de los testigos coptos sigue pendiente.
