    Ahora bien, estas cosas fueron reveladas, por voluntad de Sabaot y de su Cristo, a las almas que habrían de entrar en las formas modeladas de las autoridades.[a] Acerca de ellas, la voz santa dijo: «Multiplíquense y florezcan; gobiernen sobre todos los seres creados».[b] Ellas fueron las que, conforme a sus destinos, fueron tomadas cautivas por el Progenitor primordial. De este modo quedaron encerradas dentro de las prisiones de las formas modeladas <. . .> hasta la consumación de la era.[c]'
