review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue fielmente el testimonio inglés suministrado y conserva las distinciones narrativas centrales: Eva, su imagen, las autoridades y los ángeles. Se preservan prudentemente los términos oscuros («fuerza», «imagen», «sello de su voz») y la laguna []. Conviene corregir «hizo que una neblina les cubriera los ojos», que transforma la acción concreta de hacer entrar niebla en sus ojos, y aclarar la sintaxis final, donde la imagen se identifica con el cuerpo que ellos han profanado. La revisión directa del copto sigue pendiente, por lo que no puede hacerse una validación filológica definitiva más allá del testimonio proporcionado.'
  naturalness: El español es en general natural, moderno y de registro apropiadamente solemne. «Enseñémosle que ella se originó» es menos preciso y fluido que «enseñémosle cómo se originó». En el cierre, «era la imagen lo que...» resulta gramaticalmente forzado; una construcción con dos puntos conserva la relación explicativa sin añadir interpretación. «Por todos los medios» refleja mejor «with every means» que «de todas las maneras posibles».
  terminology: «Autoridades», «arcángeles», «semilla», «fuerza», «imagen», «sello», «consumación de la era» y «Hombre verdadero» son elecciones defendibles y coherentes con el testimonio. La mayúscula en «Hombre verdadero» puede mantenerse como señal editorial de posible designación técnica, siempre sin identificar el referente. Las notas preservan correctamente la incertidumbre de la laguna y de las expresiones simbólicas; el [13] del testimonio es un número de página desnudo y no debe reproducirse como si fuera un ancla textual.
  issues:
  - severity: medium
    issue: 'La última oración presenta una construcción sintáctica deficiente: «pues era la imagen lo que las autoridades... profanaron».'
    rationale: El relativo neutro «lo que» no concuerda naturalmente con «la imagen» y oscurece que la imagen es el propio cuerpo que las autoridades y sus ángeles profanaron. Una aposición explicativa mediante dos puntos mantiene el sentido del testimonio.
  - severity: low
    issue: «Hizo que una neblina les cubriera los ojos» reexpresa la imagen de que Eva hizo entrar niebla en sus ojos.
    rationale: No es una desviación grave, pero «hizo que entrara niebla en sus ojos» conserva más de cerca la acción y la imaginería del testimonio.
  - severity: low
    issue: «Enseñémosle que ella se originó de su costilla» atenúa el elemento explicativo de «how she originated».
    rationale: «Enseñémosle cómo se originó de su costilla» reproduce el contenido de la instrucción proyectada y suena más idiomático.
  - severity: low
    issue: «De todas las maneras posibles» es una paráfrasis más amplia de «with every means».
    rationale: «Por todos los medios» conserva mejor el matiz instrumental del testimonio.
  revised_text: 'Entonces se informó a las autoridades que la forma que habían modelado estaba viva y se había puesto de pie, y quedaron profundamente perturbadas. Enviaron a siete arcángeles para averiguar qué había sucedido.


    Se acercaron a Adán. Cuando vieron a Eva hablando con él, se dijeron unos a otros: «¿Qué clase de ser es esta mujer radiante? Se parece a aquella imagen que se nos manifestó dentro de la luz. Vengan, apoderémonos de ella y depositemos nuestra semilla en ella, para que, una vez profanada, no pueda ascender a su luz. En cambio, los que ella dé a luz quedarán bajo nuestro dominio. Pero no se lo digamos a Adán, porque él no es uno de nosotros. Más bien, hagamos caer sobre él un sueño profundo y, mientras duerme, enseñémosle cómo ella se originó de su costilla, para que su esposa lo obedezca y él sea señor sobre ella».


    Como era una fuerza, Eva se rio de la decisión de ellos. Hizo que entrara niebla en sus ojos y, en secreto, dejó su imagen junto a Adán.


    Entró en el árbol del conocimiento y permaneció allí. Ellos la persiguieron, y ella les reveló que había entrado en el árbol y se había convertido en árbol. Entonces aquellos seres ciegos sintieron un gran temor y huyeron.


    Después de recobrarse del aturdimiento, se acercaron a Adán. Al ver junto a él la imagen de esta mujer [a], quedaron profundamente perturbados. Creyeron que era la verdadera Eva y actuaron impulsivamente. Se acercaron a ella, la sujetaron y derramaron su semilla sobre ella.


    Lo hicieron con maldad, profanándola por medios naturales y obscenos. Primero profanaron el sello de su voz,[b] la cual les había hablado diciendo: «¿Qué existía antes que ustedes?». De este modo pretendían profanar, en la consumación de la era,[c] a quienes pudieran declarar mediante la expresión verbal que habían nacido del Hombre verdadero.[d] Pero se extraviaron, sin saber que habían profanado su propio cuerpo: era la imagen que las autoridades y sus ángeles habían profanado por todos los medios.'
