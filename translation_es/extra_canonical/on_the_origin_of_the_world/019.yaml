base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: es
  text: 'Entonces se informó a las autoridades que la forma que habían modelado estaba viva y se había puesto de pie, y quedaron profundamente perturbadas. Enviaron a siete arcángeles para averiguar qué había sucedido.


    Se acercaron a Adán. Cuando vieron a Eva hablando con él, se dijeron unos a otros: «¿Qué clase de ser es esta mujer radiante? Se parece a aquella imagen que se nos manifestó dentro de la luz. Vengan, apoderémonos de ella y depositemos nuestra semilla en ella, para que, una vez profanada, no pueda ascender a su luz. En cambio, los que ella dé a luz quedarán bajo nuestro dominio. Pero no se lo digamos a Adán, porque él no es uno de nosotros. Más bien, hagamos caer sobre él un sueño profundo y, mientras duerme, enseñémosle que ella se originó de su costilla, para que su esposa lo obedezca y él sea señor sobre ella».


    Como era una fuerza, Eva se rio de la decisión de ellos. Hizo que una neblina les cubriera los ojos y, en secreto, dejó su imagen junto a Adán.


    Entró en el árbol del conocimiento y permaneció allí. Ellos la persiguieron, y ella les reveló que había entrado en el árbol y se había convertido en árbol. Entonces aquellos seres ciegos sintieron un gran temor y huyeron.


    Después de recobrarse del aturdimiento, se acercaron a Adán. Al ver junto a él la imagen de esta mujer [a], quedaron profundamente perturbados. Creyeron que era la verdadera Eva y actuaron impulsivamente. Se acercaron a ella, la sujetaron y derramaron su semilla sobre ella.


    Lo hicieron con maldad, profanándola por medios naturales y obscenos. Primero profanaron el sello de su voz,[b] la cual les había hablado diciendo: «¿Qué existía antes que ustedes?». De este modo pretendían profanar, en la consumación de la era,[c] a quienes pudieran declarar mediante la expresión verbal que habían nacido del Hombre verdadero.[d] Pero se extraviaron, sin saber que habían profanado su propio cuerpo, pues era la imagen lo que las autoridades y sus ángeles profanaron de todas las maneras posibles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio señala aquí una laguna o un punto de restauración incierta. La traducción no añade las palabras que pudieran faltar.
    reason: Preservar la señal de daño o incertidumbre manuscrita representada por los corchetes vacíos del testimonio.
  - marker: b
    text: «El sello de su voz» es una expresión simbólica oscura. Puede aludir a aquello que autentica, marca o resguarda su palabra, pero el sentido exacto es incierto.
    reason: Advertir al lector de una ambigüedad genuina sin resolverla en el texto principal.
  - marker: c
    text: También podría traducirse «en la consumación del eón». Aquí «era» representa un término de alcance temporal y cosmológico.
    reason: Conservar el posible matiz técnico de la expresión escatológica.
  - marker: d
    text: «Hombre verdadero» parece funcionar como un título o designación técnica. El pasaje por sí solo no identifica de manera inequívoca a su referente.
    reason: Evitar importar una identificación doctrinal no demostrada por el fragmento.
lexical_decisions:
- source_word: authorities
  choice: autoridades
  rationale: Conserva el término técnico del testimonio para las potestades gobernantes sin identificarlo con una doctrina denominacional específica.
- source_word: shaped form
  choice: la forma que habían modelado
  rationale: Expresa tanto el resultado material como la acción de darle forma, sin reducirlo simplemente a «cuerpo».
- source_word: likeness
  choice: imagen
  rationale: «Imagen» es natural en español y mantiene la distinción narrativa entre Eva y su representación; «semejanza» sería posible, pero resulta menos fluida como entidad dejada junto a Adán.
- source_word: force
  choice: fuerza
  rationale: Mantiene el lenguaje ontológico inusual y evita interpretarlo como mera fortaleza personal o como una potestad definida.
- source_word: cast our seed into her / onto her
  choice: depositemos nuestra semilla en ella / derramaron su semilla sobre ella
  rationale: Preserva la variación espacial del testimonio y su sentido sexual sin recurrir a un eufemismo que atenúe la violencia.
- source_word: seal of her voice
  choice: sello de su voz
  rationale: Traducción deliberadamente formal de una expresión simbólica oscura cuya ambigüedad debe conservarse.
- source_word: true man
  choice: Hombre verdadero
  rationale: La mayúscula señala que funciona como designación trascendente o técnica en el contexto, no como referencia genérica a un varón veraz.
theological_decisions:
- issue: Relación entre Eva y la imagen dejada con Adán
  choice: Distinguir claramente a Eva de «su imagen» sin explicar la naturaleza de esta última
  alternative: Identificar la imagen como cuerpo material, doble o sustituta
  rationale: El pasaje establece una distinción narrativa, pero el testimonio suministrado no justifica imponer una ontología más precisa.
- issue: Origen de Eva de la costilla de Adán
  choice: Presentarlo como enseñanza que las autoridades planean inculcarle durante el sueño
  alternative: Narrarlo como afirmación directa del autor sobre el origen de Eva
  rationale: La sintaxis lo incluye dentro del plan engañoso de las autoridades; la traducción conserva esa tensión intertextual.
- issue: Violencia sexual contra la imagen
  choice: 'Mantener lenguaje explícito pero no gráfico: «la sujetaron», «derramaron su semilla», «profanaron»'
  alternative: Suavizarlo como unión sexual o intensificarlo con terminología no explícita en el testimonio
  rationale: Comunica fielmente la agresión y profanación sin añadir detalles ajenos a la fuente disponible.
- issue: Alcance escatológico de «consummation»
  choice: «consumación de la era»
  alternative: «fin del mundo» o «plenitud de los tiempos»
  rationale: Conserva el carácter técnico y la referencia a una era, sin resolverla como destrucción cósmica ni armonizarla con otra fórmula teológica.
- issue: Identidad del «Hombre verdadero»
  choice: Conservar el título sin identificar a su referente
  alternative: Explicitarlo como Adán celestial, Cristo u otra figura
  rationale: La identidad precisa no queda resuelta por el fragmento ni por la evidencia fuente suministrada.
