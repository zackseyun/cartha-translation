base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: es
  text: 'Después de esto, creó una asamblea de ángeles —millares incontables y miríadas— semejante a la asamblea del octavo cielo. Creó también a un primogénito llamado «Israel», es decir, «el Hombre que ve a Dios», y a otro ser llamado «Jesucristo», semejante al salvador que habita arriba, en el octavo cielo, y que está sentado a su derecha, en un trono santo. A su izquierda, la Virgen del Espíritu santo está sentada en un trono y lo glorifica. Delante de ella están de pie las siete vírgenes, con treinta arpas, liras y [] trompetas[a], y lo glorifican. Todos los ejércitos de ángeles lo glorifican y lo alaban.



    Está sentado en un trono de luz, <en una> gran nube que lo cubre.[b] Nadie habitaba con él dentro de la nube excepto Sofía, <la hija de> Pistis, quien le enseñó acerca de todas las realidades que existen dentro del octavo cielo, para que pudiera crear imágenes de ellas y su reino perdurara hasta la consumación de los cielos del Caos y de sus ejércitos.



    Ahora bien, Pistis Sofía lo separó de la oscuridad y lo llamó a su derecha, mientras que puso al Progenitor primordial a su izquierda. Desde aquel día, la derecha ha sido llamada «justicia», y la izquierda, «mal». Por esta razón, todos ellos recibieron un eón en la asamblea de la justicia, y el mal domina sobre todo ser creado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio presenta una laguna antes de «trompetas»; se desconoce qué palabra o palabras faltan.
    reason: Conserva los corchetes vacíos que señalan el material perdido y explica su significado mediante una llamada de nota externa.
  - marker: b
    text: Las palabras entre signos angulares son suplementos editoriales destinados a completar un texto defectuoso o incompleto.
    reason: Explica el valor textual de «<en una>» y, por extensión, de «<la hija de>», conservados en el cuerpo de la traducción.
lexical_decisions:
- source_word: assembly
  choice: asamblea
  rationale: Conserva la imagen de una agrupación celestial organizada sin imponer el matiz institucional de «iglesia».
- source_word: countless thousands and myriads
  choice: millares incontables y miríadas
  rationale: Mantiene los dos términos cuantitativos y el tono elevado del testimonio, sin reducir «myriads» simplemente a «decenas de miles».
- source_word: entity / entities
  choice: ser / realidades
  rationale: «Ser» resulta natural para la figura personal llamada Jesucristo; «realidades» mantiene mayor amplitud ontológica para cuanto existe en el octavo cielo.
- source_word: likenesses
  choice: imágenes
  rationale: Expresa copias o representaciones derivadas de los modelos celestiales, sin afirmar identidad sustancial con ellos.
- source_word: Primal Parent
  choice: Progenitor primordial
  rationale: Conserva tanto la prioridad originaria como la función parental y evita asignarle género no explícito mediante «Padre» o «Madre».
- source_word: aeon
  choice: eón
  rationale: Mantiene el término técnico de la cosmología del escrito, cuya referencia puede abarcar ámbito, era o entidad y no debe reducirse a una sola acepción.
- source_word: stands over
  choice: domina sobre
  rationale: En este contexto de polaridad entre justicia y mal, comunica una posición de autoridad o poder sobre la creación; se evita el literal poco natural «está sobre».
theological_decisions:
- issue: Relación entre el Jesucristo creado y el salvador del octavo cielo
  choice: «otro ser llamado “Jesucristo”, semejante al salvador»
  alternative: Identificarlos como una sola persona
  rationale: El pasaje presenta una semejanza entre una figura creada y el salvador superior; la traducción conserva esa distinción cosmológica sin armonizarla con formulaciones cristológicas posteriores.
- issue: Referentes de los pronombres posesivos en «a su derecha» y «a su izquierda»
  choice: Conservar los posesivos sin reemplazarlos por nombres propios
  alternative: Precisar de quién es cada derecha e izquierda
  rationale: La cadena de referentes del testimonio permite incertidumbre. Explicitar un nombre resolvería una ambigüedad que el texto suministrado no resuelve con seguridad.
- issue: «Pistis Sophia» como designación conjunta
  choice: «Pistis Sofía» en la tercera sección, pero «Sofía, <la hija de> Pistis» donde así lo marca el testimonio
  alternative: Uniformar todas las apariciones como un único nombre compuesto
  rationale: Respeta la variación interna y los suplementos editoriales del testimonio en vez de imponer una identificación uniforme.
- issue: Simbolismo de derecha e izquierda
  choice: Traducir literalmente «justicia» y «mal»
  alternative: Suavizarlo como «bien» y «desorden»
  rationale: El contraste teológico y moral forma parte explícita del pasaje y no debe reinterpretarse ni atenuarse.
- issue: Alcance de «consummation»
  choice: «consumación»
  alternative: «destrucción» o «fin»
  rationale: «Consumación» conserva la posibilidad de cumplimiento, conclusión o término cósmico sin escoger una interpretación más restrictiva.
translation_notes:
  register: 'Español latinoamericano neutro, actual y digno. Se mantienen los nombres y términos cosmológicos propios del escrito, así como sus repeticiones y ambigüedades de referente. Las mayúsculas en «Espíritu santo» y «Caos» reflejan su función en este contexto sin normalizar el pasaje conforme a terminología confesional posterior. Borrador necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto está pendiente.'
