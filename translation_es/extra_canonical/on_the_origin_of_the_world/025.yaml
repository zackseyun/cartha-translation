review_pass:
  verdict: revise
  source_fidelity: La revisión se basa prioritariamente en el testimonio inglés público suministrado, pues la revisión directa del copto sigue pendiente. El borrador sigue bien el pasaje en general, pero «your likenesses» debe traducirse como «las semejanzas de ustedes», no como «sus semejanzas», ya que el testimonio expresa un posesivo de segunda persona. También conviene conservar las lagunas vacías como «[]» y reflejar más fielmente la reconstrucción «[(as) one]».
  naturalness: El español es mayormente claro, moderno y de registro apropiado. Se ajustaron algunas formulaciones para que la aposición de «los pequeños espíritus...» identifique a las semejanzas enviadas, no al destino al que son enviadas; asimismo, se mejoró la sintaxis de algunas enumeraciones sin resolver ambigüedades textuales.
  terminology: Se mantienen coherentemente los tecnicismos «eón» y «arcontes», así como «incorruptibilidad», «iglesia», «Lugar Santo» y «Caos». «Razas» conserva la clasificación cosmológica del testimonio y requiere la nota aclaratoria no anacrónica.
  issues:
  - severity: medium
    issue: El posesivo de «your likenesses» se tradujo como «sus semejanzas».
    rationale: El testimonio base dice explícitamente «your», por lo que «las semejanzas de ustedes» conserva la segunda persona. La incertidumbre puede afectar al referente de «ustedes», pero no autoriza sustituir el posesivo por uno de tercera persona.
  - severity: medium
    issue: Las lagunas textuales vacías «[]» se sustituyeron por puntos suspensivos tipográficos «[…]/[…]».
    rationale: El testimonio distingue corchetes vacíos de otras señales editoriales. Deben conservarse «[]» para no añadir contenido ni alterar el aparato de incertidumbre.
  - severity: medium
    issue: La reconstrucción «[(as) one]» se redujo a «[(uno)]».
    rationale: 'La traducción debe preservar tanto la señal editorial como el elemento comparativo/restaurado: «[(como) uno]».'
  - severity: low
    issue: La construcción «envió ... al mundo de perdición, es decir, a los pequeños espíritus...» hace que los espíritus parezcan ser el destino.
    rationale: En el testimonio, «the blessed small spirits» identifica las semejanzas enviadas. Se reordenó la aposición para mantener esa relación.
  revised_text: 'Ahora pasaremos a considerar nuestro mundo, para completar con precisión la descripción de su estructura y gobierno. Entonces quedará claro cómo se halló la fidelidad al eón invisible, la cual se ha manifestado desde la creación hasta la consumación de la era.


    Paso, por tanto, a los temas principales acerca del hombre inmortal. Hablaré de los seres que le pertenecen y mostraré cómo llegaron a estar aquí.


    Cuando una multitud de seres humanos llegó a existir por descendencia del [Adán que] [] había sido hecho, incluso de la materia, y cuando el mundo ya estaba completamente poblado, los arcontes eran sus amos; es decir, lo mantenían esclavizado mediante la ignorancia. ¿Por qué? Por la siguiente razón: el padre inmortal sabe que surgió una deficiencia en la verdad entre los eones y su universo. Cuando quiso reducir a nada a los arcontes de la perdición mediante las criaturas que ellos habían modelado, envió al mundo de la perdición las semejanzas de ustedes, es decir, los pequeños espíritus benditos de la inocencia. El conocimiento no les es ajeno, porque todo el conocimiento reside en un solo ángel que se les apareció. A este no le falta poder ante el padre, ni siquiera para que <él>[a] les dé conocimiento. Cuando aparecen en el mundo de la perdición, revelan de inmediato la estructura de la incorruptibilidad como censura de los arcontes y sus ejércitos.


    Así, cuando los seres benditos aparecieron en formas modeladas por las autoridades, fueron objeto de envidia. Movidas por la envidia, las autoridades unieron su semilla con la de ellos, con la intención de contaminarlos; pero no pudieron hacerlo.


    Luego, cuando los seres benditos aparecieron en una forma radiante, se manifestaron de diversas maneras. Procedían de diferentes eones y revelaban su conocimiento a la iglesia hecha visible mediante las formas modeladas de la perdición. Se descubrió que ella contenía toda clase de semilla, porque la semilla de las autoridades había sido unida [con ella].


    Entonces el Salvador los creó a todos [(como) uno][b]. Sus espíritus son manifiestamente superiores: son benditos [] y escogidos de diversas maneras. Hay también varios otros seres que no tienen rey y son superiores a todos los que existieron antes que ellos.


    Existen, por tanto, cuatro razas[c]. Tres pertenecen a los reyes del octavo cielo, pero la cuarta raza no tiene rey: es perfecta y la más elevada de todas. Estos son los que entrarán en el Lugar Santo de su padre y obtendrán descanso junto con reposo, gloria eterna e inefable y alegría infinita.


    Además, son reyes dentro del dominio de la muerte, pues son inmortales. Ellos censurarán a los dioses del Caos y a sus ejércitos.'
