  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: es
  text: 'Ahora pasaremos a considerar nuestro mundo, para completar con precisión la descripción de su estructura y gobierno. Entonces quedará claro cómo se halló la fidelidad al eón invisible, la cual se ha manifestado desde la creación hasta la consumación de la era.


    Paso, por tanto, a los temas principales acerca del hombre inmortal. Hablaré de los seres que le pertenecen y mostraré cómo llegaron a estar aquí.


    Cuando una multitud de seres humanos llegó a existir por descendencia de [el Adán que] […] había sido hecho incluso de la materia, y cuando el mundo ya estaba completamente poblado, los arcontes eran sus amos; es decir, lo mantenían esclavizado mediante la ignorancia. ¿Por qué? Por la siguiente razón: el Padre inmortal sabe que surgió una deficiencia en la verdad entre los eones y su universo. Cuando quiso reducir a nada a los arcontes de la perdición mediante las criaturas que ellos habían modelado, envió sus semejanzas[a] al mundo de la perdición, es decir, a los pequeños espíritus benditos de la inocencia. El conocimiento no les es ajeno, porque todo el conocimiento reside en un solo ángel que se les apareció. A este no le falta poder ante el Padre, ni siquiera para que <él>[b] les dé conocimiento. Cuando aparecen en el mundo de la perdición, revelan de inmediato la estructura de la incorruptibilidad, como censura contra los arcontes y sus ejércitos.


    Así, cuando los seres benditos aparecieron en formas modeladas por las autoridades, fueron objeto de envidia. Movidas por la envidia, las autoridades unieron su semilla con la de ellos, con la intención de contaminarlos; pero no pudieron hacerlo.


    Luego, cuando los seres benditos aparecieron en una forma radiante, se manifestaron de diversas maneras. Procedían de diferentes eones y revelaban su conocimiento a la iglesia hecha visible mediante las formas modeladas de la perdición. Se descubrió que ella contenía toda clase de semilla, porque la semilla de las autoridades había sido unida [con ella].


    Entonces el Salvador hizo de todos ellos [(uno)][c]. Sus espíritus son claramente superiores: son benditos […] y han sido escogidos de diversas maneras. Hay también varios otros seres que no tienen rey y son superiores a todos los que existieron antes que ellos.


    Existen, por tanto, cuatro razas[d]. Tres pertenecen a los reyes del octavo cielo, pero la cuarta raza no tiene rey: es perfecta y la más elevada de todas. Estos son los que entrarán en el Lugar Santo de su Padre y obtendrán descanso y reposo, gloria eterna e indescriptible y alegría infinita.


    Además, son reyes dentro del dominio de la muerte, pues son inmortales. Ellos censurarán a los dioses del Caos y a sus ejércitos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio permite entender la expresión como «sus semejanzas» —las del Padre— o como «las semejanzas de ustedes». El referente exacto es incierto.
    reason: Preservar una ambigüedad pronominal con posible importancia antropológica y teológica.
  - marker: b
    text: El pronombre «<él>» representa una restauración editorial; su referente podría ser el ángel o el Padre.
    reason: Hacer visible la incertidumbre textual y sintáctica.
  - marker: c
    text: «(Uno)» es una reconstrucción incierta del texto; puede expresar que el Salvador hizo de todos una unidad.
    reason: Conservar la señal de restauración y explicar su posible sentido.
  - marker: d
    text: Aquí «razas» designa grupos o clases de seres dentro de la cosmología del escrito, no categorías raciales modernas.
    reason: Evitar una lectura anacrónica del término.
lexical_decisions:
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico cosmológico, de uso reconocible en traducciones de textos gnósticos, sin reducirlo a «era» cuando designa una entidad o ámbito trascendente.
- source_word: archons
  choice: arcontes
  rationale: La transliteración mantiene el carácter técnico de los gobernantes cósmicos del escrito y evita imponer una interpretación mediante «potestades» o «gobernantes».
- source_word: deathless
  choice: inmortal
  rationale: Es natural y digno en español; expresa la ausencia de muerte sin introducir el matiz más técnico de «incorruptible», reservado aquí para indestructibility.
- source_word: indestructibility
  choice: incorruptibilidad
  rationale: En este contexto cosmológico, «incorruptibilidad» comunica un orden imperecedero y contrasta naturalmente con el mundo de perdición.
- source_word: hosts
  choice: ejércitos
  rationale: Expresa la idea de huestes subordinadas de manera clara para lectores actuales.
- source_word: church
  choice: iglesia
  rationale: Mantiene la designación colectiva del testimonio sin sustituirla interpretativamente por «asamblea»; la minúscula evita identificarla sin más con una institución posterior.
- source_word: races
  choice: razas
  rationale: Conserva la clasificación cosmológica del testimonio. Aunque «linajes» sería más fluido, podría estrechar el sentido hacia la descendencia genealógica.
- source_word: Holy Place
  choice: Lugar Santo
  rationale: Se conservan las mayúsculas por tratarse de un ámbito trascendente específico.
theological_decisions:
- issue: Referente de «your likenesses»
  choice: «sus semejanzas», con nota sobre la posible lectura «las semejanzas de ustedes»
  alternative: «las semejanzas de ustedes»
  rationale: El testimonio suministrado presenta una tensión pronominal. El contexto inmediato favorece la pertenencia al Padre inmortal, pero no permite eliminar la ambigüedad con seguridad.
- issue: Agente que da conocimiento
  choice: Se conserva «<él>» y se señala la incertidumbre del referente
  alternative: Identificar expresamente al ángel o al Padre como agente
  rationale: La restauración y la sintaxis transmitida no permiten decidir con certeza a quién se refiere el pronombre.
- issue: Unidad creada por el Salvador
  choice: «hizo de todos ellos [(uno)]»
  alternative: «los creó a todos como uno»
  rationale: Se retiene la señal de restauración y la posible idea de unificación sin presentar como segura una lectura textual incierta.
- issue: Función de la revelación frente a los arcontes
  choice: «como censura contra»
  alternative: «como condenación de»
  rationale: «Censura» preserva la posibilidad de denuncia, reprensión o prueba acusatoria sin anticipar necesariamente una sentencia judicial definitiva.
- issue: Estatus de la cuarta raza
  choice: «no tiene rey»
  alternative: «es soberana» o «es ingobernada»
  rationale: 'La formulación conserva la paradoja del texto: el grupo carece de rey y, más adelante, sus integrantes son llamados reyes en el dominio de la muerte.'
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos técnicos «eón» y «arcontes». Los corchetes y ángulos señalan lagunas o restauraciones del testimonio; se omitió el número de página manuscrita [16] porque no forma parte del discurso. Dado que la revisión directa del copto está pendiente, el borrador sigue cautelosamente el testimonio inglés público suministrado y evita resolver sus incertidumbres.
