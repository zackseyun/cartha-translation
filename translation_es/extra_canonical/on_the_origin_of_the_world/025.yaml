review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones seguras para conservar las señales críticas del testimonio: los corchetes vacíos «[]» fueron sustituidos indebidamente por puntos suspensivos, y «[(as) one]» quedó reducido a «[(uno)]», con pérdida de «as». «Sus semejanzas» no reproduce de forma segura el posesivo «your» del testimonio inglés; «tus semejanzas» lo refleja sin añadir una ambigüedad no señalada por el testimonio proporcionado. La revisión directa del copto sigue pendiente.'
  naturalness: El español es en general claro, actual y de registro apropiado. Se ajustan algunos giros para mayor precisión y fluidez, particularmente «descanso junto con reposo», «gloria eterna e inefable» y la coordinación de la frase sobre los otros seres sin rey.
  terminology: «Eón», «arcontes», «incorruptibilidad», «iglesia», «Lugar Santo» y «Caos» son elecciones adecuadas y consistentes con el carácter técnico del escrito. «Razas» puede mantenerse si se conserva una nota que descarte el sentido racial moderno. «Censurarán» reproduce prudentemente censure sin imponer «condenarán».
  issues:
  - severity: high
    issue: Las lagunas «[]» se transformaron en «[…]».
    rationale: El testimonio dado distingue corchetes vacíos de otras señales editoriales. Los puntos suspensivos introducen contenido visual y una convención crítica que no está en la base.
  - severity: medium
    issue: «[(as) one]» se vertió como «[(uno)]».
    rationale: La versión pierde el elemento «as» y altera el alcance de la restauración. «[(como) uno]» conserva mejor tanto el sentido como la señal editorial.
  - severity: medium
    issue: «your likenesses» se tradujo «sus semejanzas» y se añadió una nota que propone referentes no establecidos por el testimonio suministrado.
    rationale: El posesivo de segunda persona debe conservarse como «tus». La nota convierte una traducción explícita del testimonio inglés en una ambigüedad editorial no atestiguada en los datos proporcionados.
  - severity: low
    issue: «han sido escogidos» añade un matiz perfectivo.
    rationale: El participio «chosen» puede expresarse sencillamente como «escogidos», sin introducir una acción pasada completada.
  revised_text: 'Ahora pasaremos a considerar nuestro mundo, para completar con precisión la descripción de su estructura y gobierno. Entonces quedará claro cómo se halló la fidelidad al eón invisible, la cual se ha manifestado desde la creación hasta la consumación de la era.


    Por consiguiente, llego a los temas principales acerca del hombre inmortal. Hablaré de los seres que le pertenecen y mostraré cómo llegaron a estar aquí.


    Cuando una multitud de seres humanos llegó a existir por descendencia de [el Adán que] [] había sido hecho, incluso de la materia, y cuando el mundo ya estaba completamente poblado, los arcontes eran sus amos; es decir, lo mantenían esclavizado mediante la ignorancia. ¿Y por qué? Por la siguiente razón: el Padre inmortal sabe que llegó a existir una deficiencia de verdad entre los eones y su universo. Cuando quiso reducir a nada a los arcontes de la perdición por medio de las criaturas que ellos habían modelado, envió tus semejanzas al mundo de la perdición, es decir, los pequeños espíritus benditos de inocencia. El conocimiento no les es ajeno, porque todo conocimiento reside en un solo ángel que se les apareció. Este no carece de poder ante el Padre, ni siquiera para que <él>[a] les dé conocimiento. Cuando aparecen en el mundo de la perdición, revelan de inmediato la estructura de la incorruptibilidad como censura contra los arcontes y sus ejércitos.


    Así, cuando los seres benditos aparecieron en formas modeladas por las autoridades, fueron envidiados. Movidas por la envidia, las autoridades unieron su semilla con la de los seres benditos, con el deseo de contaminarlos; pero no pudieron hacerlo.


    Entonces, cuando los seres benditos aparecieron en una forma radiante, aparecieron de diversas maneras. Procedían de diferentes eones y revelaban su conocimiento a la iglesia que se hizo visible por medio de las formas modeladas de la perdición. Se descubrió que ella contenía toda clase de semilla, porque la semilla de las autoridades había sido unida [con ella].


    Entonces el Salvador hizo a todos ellos [(como) uno][b], y sus espíritus son claramente superiores, pues son benditos [] y escogidos de diversas maneras. Hay también varios otros seres que no tienen rey y son superiores a todos los que existieron antes que ellos.


    Por tanto, existen cuatro razas[c]. Tres pertenecen a los reyes del octavo cielo, pero la cuarta raza no tiene rey y es perfecta; es la más elevada de todas. Pues estos son los que entrarán en el Lugar Santo de su Padre y obtendrán descanso junto con reposo, gloria eterna e inefable, y alegría infinita.


    Además, son reyes dentro del reino de la muerte, pues son inmortales. Ellos censurarán a los dioses del Caos y a sus ejércitos.'
