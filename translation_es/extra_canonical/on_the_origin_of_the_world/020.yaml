base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: es
  text: 'Primero concibió a Abel del primer arconte; de las siete autoridades y sus ángeles tuvo a los demás hijos. Todo sucedió conforme a la previsión del Progenitor primordial, para que la Madre primordial llevara dentro de sí toda semilla, mezclada y unida al destino del universo y a sus estructuras. Así se puso en marcha respecto de Eva un plan concebido de antemano por la Justicia: las formas moldeadas de las autoridades se convertirían en recintos para encerrar la luz, y la luz las censuraría por medio de sus propias formas moldeadas.[a]


    El Adán primordial, el de la Luz, está dotado de espíritu y apareció el primer día. El segundo Adán está dotado de alma y apareció el sexto día, llamado «Afrodita». El tercer Adán es un ser creado de la tierra, es decir, el hombre de la Ley; apareció el octavo día, llamado «Día del Sol», [después de] […] el humilde «Día de Reposo».[b] Los descendientes del Adán terrenal se multiplicaron y llenaron la tierra; de su propio interior produjeron toda clase de destrezas técnicas que poseía el Adán dotado de alma.[c] Sin embargo, todos vivían en la ignorancia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La sintaxis del testimonio disponible es difícil. Esta traducción entiende que la luz censura a las autoridades por medio de las formas que ellas mismas moldearon; también es posible una construcción impersonal o un antecedente distinto. La revisión directa del copto sigue pendiente.
    reason: Preservar una ambigüedad real acerca del agente de la censura.
  - marker: b
    text: Los corchetes y los puntos suspensivos señalan una restauración y una laguna o lectura incierta en el testimonio. La relación sintáctica exacta entre el «Día del Sol» y el «Día de Reposo» no es segura.
    reason: Dar cuenta del daño o incertidumbre textual representado en la fuente proporcionada.
  - marker: c
    text: La frase traducida «de su propio interior produjeron» y la relación de esas destrezas con el Adán dotado de alma son oscuras en el testimonio disponible.
    reason: Evitar aclarar artificialmente una construcción cuyo sentido exacto requiere cotejo con el copto.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Conserva el término técnico habitual en textos gnósticos; «gobernante» perdería su función cosmológica específica.
- source_word: authorities
  choice: autoridades
  rationale: Mantiene la designación diferenciada de los poderes subordinados sin identificarla innecesariamente con un orden angélico posterior.
- source_word: Primal Parent
  choice: Progenitor primordial
  rationale: Expresa prioridad originaria y función parental sin imponer género donde el testimonio inglés usa un término amplio.
- source_word: forethought
  choice: previsión
  rationale: Comunica un designio anticipado; se evita identificar automáticamente el término con una figura personificada cuando el pasaje no lo exige con claridad.
- source_word: shaped forms
  choice: formas moldeadas
  rationale: Retiene tanto la idea de forma como la de haber sido configuradas o modeladas.
- source_word: imbued with spirit / soul
  choice: dotado de espíritu / dotado de alma
  rationale: Preserva el contraste antropológico entre espíritu y alma con una formulación natural en español.
- source_word: technological skills
  choice: destrezas técnicas
  rationale: Evita el sentido exclusivamente moderno de «tecnología» y abarca artes, oficios y conocimientos prácticos.
- source_word: Rest-Day
  choice: Día de Reposo
  rationale: Conserva el juego denominativo del texto sin sustituirlo directamente por un nombre confesional específico.
theological_decisions:
- issue: Agente de la censura o condena
  choice: «la luz las censuraría»
  alternative: «allí serían censuradas» o «él/ella las censuraría»
  rationale: El testimonio suministrado parece señalar a la luz como sujeto, pero su sintaxis es difícil; se hace explícita la lectura del testimonio auditado y se documenta la incertidumbre en nota.
- issue: Relación entre los tres Adanes
  choice: Mantener «dotado de espíritu», «dotado de alma» y «terrenal» como categorías distintas
  alternative: Armonizarlos como etapas o aspectos de un solo Adán
  rationale: El pasaje presenta tres figuras diferenciadas y no debe resolverse doctrinalmente la tensión entre ellas.
- issue: Designación «Afrodita» para el sexto día
  choice: Conservar el nombre propio «Afrodita»
  alternative: Explicarlo o reemplazarlo por «Venus»
  rationale: La equivalencia cosmológica exacta requiere revisión copta; preservar el nombre del testimonio evita una identificación interpretativa no demostrada.
- issue: Octavo día y Día del Sol
  choice: Traducir literalmente las designaciones y preservar la laguna
  alternative: Normalizar «Día del Sol» como «domingo» y «Día de Reposo» como «sábado»
  rationale: La traducción literal conserva la simbología calendárica y evita borrar la secuencia textual dañada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron términos técnicos como «arconte» y las personificaciones con mayúscula cuando el contexto las presenta como entidades. El borrador se basa provisionalmente en el testimonio inglés de dominio público suministrado; aún requiere revisión directa del copto y cotejo de los manuscritos relacionados.
