base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/004.yaml
  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: es
  text: 'Siete seres andróginos se manifestaron en el Caos. Poseen tanto nombres masculinos como femeninos:


    El nombre femenino es Pronoia, Sambathas, que significa «semana»;

    y su hijo se llama Yao, cuyo nombre femenino es Dominio.

    Sabaoth, cuyo nombre femenino es Divinidad.

    Adonaios, cuyo nombre femenino es Realeza.

    Elaios, cuyo nombre femenino es Celos.

    Oraios, cuyo nombre femenino es Riqueza;

    y Astaphaios, cuyo nombre [femenino] es […] Sophia.[a]


    Estas son las siete potencias correspondientes a los siete cielos del Caos. Nacieron como seres andróginos, conforme a la estructura inmortal que existía antes que ellos, de acuerdo con el deseo de Pistis: que la semejanza de lo que había existido desde el principio gobernara hasta el fin.


    Descubrirás el poder que ejercen estos nombres, así como la fuerza de los seres masculinos, en el libro La naturaleza arcangélica del profeta Moisés; y el poder de los nombres de los seres femeninos, en el Primer libro de Noraia.[b]


    Ahora bien, Yaldabaoth, el Progenitor Primordial, puesto que poseía grandes autoridades, creó cielos para cada uno de sus descendientes mediante la palabra. Los hizo buenos como lugares donde habitar, y en cada cielo creó grandes glorias, siete veces más excelentes: tronos, palacios, templos, carros y espíritus virginales, hasta uno invisible, junto con sus glorias. Cada uno poseía estas cosas en su cielo respectivo: poderosos ejércitos de dioses, señores, ángeles y arcángeles, incontables miríadas, para que sirvieran.


    Encontrarás el relato de estos acontecimientos descrito con exactitud en la Primera narración de Oraia.[c]


    Y quedaron terminados desde este cielo hasta el sexto cielo, que es el de Sophia.


    Este cielo y esta tierra fueron atacados por el causante de desgracias que habitaba debajo de todos ellos. Los seis cielos temblaron violentamente, porque los ejércitos del Caos sabían quién había atacado el cielo situado debajo de ellos. Cuando Pistis se enteró de la fractura causada por aquel, envió su espíritu, lo ató y lo arrojó al Tártaros.


    [Desde aquel día], el cielo, junto con […] su tierra, quedó establecido por medio de Sophia, hija de Yaldabaoth, la que habita debajo de todos ellos.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lista y su sintaxis presentan dificultades textuales. Los corchetes y los puntos suspensivos señalan material incierto o perdido en el testimonio; no se ha reconstruido la laguna.
    reason: Preservar la incertidumbre manuscrita y advertir que la aparente irregularidad de la lista no debe armonizarse.
  - marker: b
    text: La naturaleza arcangélica del profeta Moisés y el Primer libro de Noraia son obras citadas aquí; sus títulos también pueden reconstruirse o traducirse de otras maneras.
    reason: Identificar las referencias literarias sin afirmar una forma titular absolutamente segura.
  - marker: c
    text: La Primera narración de Oraia es otra obra mencionada por el texto; «Oraia» aparece también con otras grafías en la bibliografía moderna.
    reason: Dar cuenta de la variación de transliteración del nombre propio.
  - marker: d
    text: Las expresiones entre corchetes y la elipsis reflejan una restauración y una laguna del testimonio. La relación exacta entre «el cielo», «su tierra» y Sophia permanece parcialmente incierta.
    reason: Conservar la ambigüedad textual del cierre.
lexical_decisions:
- source_word: androgynous entities
  choice: seres andróginos
  rationale: Conserva la doble caracterización sexual del texto y emplea un sustantivo natural en español sin reducirlos a personas humanas.
- source_word: Rulership
  choice: Dominio
  rationale: Expresa autoridad o ejercicio de gobierno sin identificarla necesariamente con un reino territorial.
- source_word: Kingship
  choice: Realeza
  rationale: Mantiene la distinción respecto de «Dominio» y nombra la condición o dignidad regia.
- source_word: powers
  choice: potencias
  rationale: En este marco cosmológico designa fuerzas o entidades dotadas de poder; «potencias» preserva ambos matices.
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Evita imponer género donde el título destaca principalmente prioridad y función generadora.
- source_word: verbal articulation
  choice: mediante la palabra
  rationale: Comunica de manera natural que la creación se efectúa por expresión verbal, sin añadir una fórmula creativa ausente.
- source_word: mischief-maker
  choice: causante de desgracias
  rationale: Representa una figura que provoca daño o perturbación sin identificarla con un personaje teológico específico.
- source_word: Tartaros
  choice: Tártaros
  rationale: Transliteración tradicional del nombre cosmológico griego, conservado como lugar propio.
theological_decisions:
- issue: Relación entre nombres masculinos y femeninos
  choice: Se conserva la presentación andrógina y la secuencia de nombres sin armonizar su gramática.
  alternative: Reformular cada par como una pareja masculina y femenina independiente.
  rationale: El pasaje atribuye ambos nombres a los mismos seres y contiene cambios de referente o género que no deben resolverse doctrinalmente.
- issue: La «estructura inmortal» anterior
  choice: Se mantiene la expresión abierta «estructura inmortal».
  alternative: Interpretarla como un mundo celestial, pléroma o arquetipo divino concreto.
  rationale: El testimonio suministrado no exige una identificación técnica única.
- issue: Función de Pistis
  choice: Se translitera Pistis como nombre propio.
  alternative: Traducirlo como «Fe».
  rationale: En el relato funciona como figura personificada; la transliteración evita convertir silenciosamente el nombre en una virtud abstracta.
- issue: Sophia
  choice: Se conserva Sophia como nombre propio.
  alternative: Traducirlo como «Sabiduría».
  rationale: La forma funciona como nombre de una entidad cosmológica, aunque su significado sea «sabiduría».
- issue: Dioses, señores y seres celestiales
  choice: Se traducen literalmente las categorías plurales.
  alternative: Atenuar «dioses» como «seres divinos».
  rationale: La cosmología del texto distingue expresamente estas clases; suavizar «dioses» reduciría su tensión teológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres cosmológicos transliterados y las irregularidades significativas del pasaje. El borrador depende del testimonio inglés público proporcionado porque la revisión directa del copto sigue pendiente; por ello evita afirmaciones filológicas que excedan esa evidencia. Se omitieron los números de página manuscrita [2] y [3], pero se mantuvieron mediante notas las restauraciones y lagunas relevantes.
