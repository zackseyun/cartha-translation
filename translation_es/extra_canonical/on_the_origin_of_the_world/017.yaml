translation:
  language: es
  text: 'Entonces el Progenitor primordial expuso a quienes habitaban con él su parecer acerca del hombre. Luego, cada uno de ellos arrojó su semen en el centro del ombligo de la tierra.


    Desde aquel día, los siete arcontes formaron al hombre junto con su cuerpo, para que se pareciera al cuerpo de ellos; sin embargo, su apariencia se asemejaba a la del hombre que se les había manifestado. Lo fueron formando parte por parte, y su jefe formó el cerebro y el sistema nervioso.


    Después apareció semejante al que había existido antes que él. Llegó a ser […] [a] un hombre dotado de alma, y fue llamado Adán, es decir, «Padre», conforme al nombre del que había existido antes que él. Cuando terminaron de formar a Adán, él lo abandonó como si fuera una vasija sin vida, pues había adquirido una forma semejante a la de un feto abortado, sin espíritu dentro de sí.


    Cuando el arconte principal recordó las palabras de Pistis, temió que el hombre verdadero entrara en la figura que él había moldeado y se convirtiera en su señor. Por eso se apartó durante cuarenta días de la figura que había moldeado, la cual quedó entonces sin alma; se retiró y la abandonó.


    El día cuarenta, Sofía Zoe[b] envió su aliento a Adán, que estaba sin alma. Él comenzó a moverse por el suelo, pero no podía ponerse de pie.


    Después llegaron los siete arcontes. Al verlo, se turbaron profundamente. Se acercaron, lo sujetaron, y él le habló al aliento que estaba dentro de Adán: «¿Quién eres y de dónde has venido hasta aquí?»


    Este respondió: «He venido de la fuerza del hombre para arruinar la obra de ustedes». Al oírlo, ellos lo glorificaron, porque él les concedió alivio del miedo y la angustia en que se encontraban.


    Entonces llamaron a aquel día «Descanso», porque habían descansado de su trabajo. Cuando vieron que Adán podía ponerse de pie, se alegraron, lo tomaron, lo pusieron dentro del Paraíso y se retiraron a sus cielos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los puntos suspensivos entre corchetes señalan una laguna o una restauración incierta en la tradición manuscrita.
    reason: Hace visible la incertidumbre textual indicada por el testimonio sin suplir palabras conjeturales.
  - marker: b
