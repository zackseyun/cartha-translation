lexical_decisions:
- source_word: Primal Parent
  choice: Progenitor primordial
  rationale: Conserva la idea de una figura originaria que engendra sin imponer género ni identificarla con el Dios bíblico mediante «Padre».
- source_word: archons
  choice: arcontes
  rationale: Es el término técnico habitual en español para los gobernantes cósmicos de esta literatura y evita reducirlo a «gobernantes» en sentido político ordinario.
- source_word: sperm
  choice: semen
  rationale: Reproduce de manera directa y digna la imagen corporal del testimonio.
- source_word: shaped form / shaping
  choice: figura que había moldeado / formar
  rationale: Expresa la fabricación corporal sin convertir la figura en una creación plena ni borrar la variedad verbal del pasaje.
- source_word: soul / spirit / breath
  choice: alma / espíritu / aliento
  rationale: Mantiene separados los tres vocablos y la tensión antropológica del texto, sin armonizarlos.
- source_word: Pistis
  choice: Pistis
  rationale: Se conserva el nombre griego transliterado, pues funciona como nombre propio en el tratado.
- source_word: Sophia Zoe
  choice: Sofía Zoe
  rationale: Se adapta «Sophia» a la forma española reconocible y se conserva «Zoe» como parte del nombre compuesto; una nota aclara su sentido.
- source_word: Rest
  choice: Descanso
  rationale: Mantiene el juego explícito con descansar del trabajo y evita identificarlo automáticamente con el término bíblico «sábado».
- source_word: Paradise
  choice: Paraíso
  rationale: Equivalente tradicional y natural que conserva el carácter de lugar nombrado en el relato.
theological_decisions:
- issue: Distinción entre el hombre formado y el «hombre verdadero»
  choice: Conservar «hombre» y «hombre verdadero» como expresiones distintas
  alternative: Identificar o explicar al hombre verdadero como una entidad espiritual específica
  rationale: El pasaje establece la distinción, pero no la desarrolla aquí; explicarla en el texto impondría una interpretación externa.
- issue: Relación entre alma, espíritu y aliento
  choice: Traducir cada término de manera diferenciada y conservar las aparentes tensiones
  alternative: Unificar los tres como «espíritu» o armonizar la secuencia narrativa
  rationale: El testimonio afirma primero que Adán posee alma, luego lo describe sin espíritu y más tarde sin alma; la traducción no debe resolver silenciosamente esa tensión.
- issue: Antecedentes ambiguos de los pronombres en la escena de los arcontes
  choice: Conservar «él» y «lo» donde el referente no es seguro
  alternative: Nombrar al arconte principal, a Adán o al aliento en cada caso
  rationale: La formulación recibida permite más de un antecedente; explicitar uno eliminaría una ambigüedad genuina.
- issue: Sentido de «Adán, es decir, Padre»
  choice: Reproducir la glosa tal como aparece
  alternative: Corregirla según una etimología hebrea de Adán
  rationale: La explicación pertenece a la teología o etimología propia del tratado y no debe reemplazarse por otra tradición lingüística.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos técnicos propios del tratado («arcontes», «Pistis») y la imaginería corporal directa. La redacción evita armonizar las tensiones entre alma, espíritu y aliento, y mantiene los pronombres ambiguos cuando el testimonio inglés no permite identificar con seguridad su referente. Dado que la revisión directa del copto está pendiente, este borrador se basa provisionalmente en el testimonio inglés público suministrado.
