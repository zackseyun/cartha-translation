review_pass:
  verdict: revise
  source_fidelity: La traducción conserva de manera sólida la secuencia narrativa, los términos técnicos («arcontes», «Pistis»), la distinción entre alma, espíritu y aliento, y la imaginería corporal del testimonio inglés. Sin embargo, la laguna manuscrita se ha reproducido con un añadido indebido («[a]»), y algunos giros resuelven o atenúan elementos que el testimonio deja más directos o ambiguos.
  naturalness: El español es mayormente natural, actual y apropiado para un texto religioso antiguo. Se recomiendan ajustes puntuales para evitar «feto abortado», que es más específico que el testimonio, y para expresar «stand erect» con «erguirse».
  terminology: «Progenitor primordial», «arcontes», «semen», «alma», «espíritu», «aliento», «Pistis», «Sofía Zoe», «Descanso» y «Paraíso» son elecciones adecuadas. La glosa interna «Adán, es decir, “Padre”» debe conservarse sin corrección etimológica externa.
  issues:
  - severity: medium
    issue: La laguna textual se marca como «[…] [a]».
    rationale: El testimonio inglés presenta únicamente «[]»; la letra «a» no pertenece al texto y se confunde con el ancla de nota. Debe mantenerse una sola marca visible de laguna y situar el ancla de nota fuera de ella.
  - severity: medium
    issue: «feto abortado» especifica indebidamente «abortion».
    rationale: El testimonio dice «like an abortion», no «como un feto abortado». «Aborto» conserva la imagen dura y ambigua sin añadir una precisión biológica no expresada.
  - severity: low
    issue: «no podía ponerse de pie» no expresa plenamente «was unable to stand erect».
    rationale: «No podía erguirse» conserva la incapacidad de adoptar una postura erguida.
  - severity: low
    issue: «el aliento que estaba dentro de Adán» identifica un antecedente donde el testimonio usa «inside him».
    rationale: Aunque Adán es un referente posible, el inglés conserva un pronombre ambiguo. «Dentro de él» preserva esa ambigüedad.
  revised_text: 'Entonces el Progenitor primordial expuso a quienes habitaban con él su parecer acerca del hombre. Luego, cada uno de ellos arrojó su semen en el centro del ombligo de la tierra.


    Desde aquel día, los siete arcontes formaron al hombre junto con su cuerpo, para que se pareciera al cuerpo de ellos; sin embargo, su apariencia se asemejaba a la del hombre que se les había manifestado. Lo fueron formando parte por parte, y su jefe formó el cerebro y el sistema nervioso.


    Después apareció semejante al que había existido antes que él. Se convirtió en […] [a]un hombre dotado de alma, y fue llamado Adán, es decir, «Padre», conforme al nombre del que había existido antes que él. Cuando terminaron de formar a Adán, él lo abandonó como una vasija sin vida, pues había tomado la forma de un aborto, sin espíritu dentro de sí.


    Cuando el arconte principal recordó las palabras de Pistis, temió que el hombre verdadero entrara en la figura que él había moldeado y se convirtiera en su señor. Por eso se apartó de la figura que había moldeado durante cuarenta días; esta entonces carecía de alma. Se retiró y la abandonó.


    El día cuarenta, Sofía Zoe[b] envió su aliento a Adán, que estaba sin alma. Él comenzó a moverse por el suelo, pero no podía erguirse.


    Después llegaron los siete arcontes. Al verlo, se turbaron profundamente. Se acercaron, lo sujetaron, y él le habló al aliento que estaba dentro de él: «¿Quién eres y de dónde has venido hasta aquí?»


    Este respondió: «He venido de la fuerza del hombre para arruinar la obra de ustedes». Al oírlo, ellos lo glorificaron, porque él les concedió alivio del miedo y la angustia en que se encontraban.


    Entonces llamaron a aquel día «Descanso», porque habían descansado de su trabajo. Cuando vieron que Adán podía erguirse, se alegraron, lo tomaron, lo pusieron dentro del Paraíso y se retiraron a sus cielos.'
  revised_footnotes:
  - marker: a
    text: Los puntos suspensivos entre corchetes señalan una laguna o una restauración incierta en la tradición manuscrita.
    reason: La nota conserva la incertidumbre textual señalada por el testimonio. El ancla se coloca fuera de la marca de laguna para no introducir letras en el texto.
  - marker: b
    text: «Sofía Zoe» combina los nombres griegos correspondientes a «Sabiduría» y «Vida».
    reason: Aclara el sentido de los nombres sin reemplazarlos por una interpretación dentro del texto.
  revision_rationale: La revisión conserva la equivalencia provisional con el testimonio inglés, sin resolver ambigüedades narrativas ni imponer una lectura doctrinal. Corrige la presentación de la laguna, elimina una especificación no atestiguada en «aborto», recupera el matiz de postura erguida y restaura la ambigüedad pronominal de la escena del aliento.
