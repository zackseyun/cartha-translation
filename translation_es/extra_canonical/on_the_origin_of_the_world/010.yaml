review_pass:
  verdict: revise
  source_fidelity: La versión sigue fielmente el testimonio inglés suministrado, cuya revisión directa frente al copto permanece pendiente. Sin embargo, la cita «(it appeared) through the waters» conserva una formulación parentética; el borrador la convirtió en una oración aseverativa sin paréntesis, con lo que se pierde una señal textual relevante. También conviene mantener «semejanza» en las dos ocurrencias de likeness.
  naturalness: El español es en general claro, moderno y de registro adecuado. «Huestes de los cielos» conserva mejor el matiz cosmológico-literario que «ejércitos de los cielos», y «calmar su amor» resulta más idiomático aquí que «apagar su amor», sin precisar el sentido de esa pasión.
  terminology: Se conservan prudentemente Prónoia, Pistis Sofía, Adán de Luz y Adamán. «Lo Adamantino» permite reproducir sin sobredeterminar la glosa interna y deliberadamente extraña del escrito. Se conserva «autoridad» como término cosmológico no interpretado.
  issues:
  - severity: medium
    issue: Se eliminaron los paréntesis de la cita relativa a las aguas.
    rationale: 'El testimonio presenta «(it appeared) through the waters». La traducción debe conservar el paréntesis: «(apareció) por medio de las aguas», sin convertir la inserción textual en una afirmación independiente.'
  - severity: low
    issue: La nota b atribuye la ambigüedad a los paréntesis.
    rationale: La falta de sujeto expreso produce la ambigüedad; los paréntesis señalan que la formulación transmitida es parentética. La nota debe distinguir ambos aspectos.
  - severity: low
    issue: La traducción de likeness no es consistente.
    rationale: «Figura humana» y «figura de Pistis Sofía» son posibles, pero «semejanza» reproduce de forma más constante el término del testimonio y evita sugerir una figura material definida.
  revised_text: 'Cuando el Progenitor Primordial vio que la luz era hermosa mientras resplandecía, quedó asombrado y se sintió profundamente avergonzado. Al salir aquella luz, se manifestó dentro de ella una semejanza humana verdaderamente maravillosa. Nadie la vio, salvo el Progenitor Primordial y Prónoia, que habitaba con él. Sin embargo, su luz se manifestó a todas las huestes de los cielos, y por eso todas quedaron perturbadas.


    Cuando Prónoia vio entonces a aquel mensajero, se enamoró de él. Pero él la aborrecía porque ella habitaba en la oscuridad. Ella quiso abrazarlo, pero no pudo. Como no podía calmar su amor, derramó su luz sobre la tierra. Desde aquel día, ese mensajero ha sido llamado «Adán de Luz», que traducido significa «el radiante hombre de sangre». Y sobre él fue extendida la tierra, el santo Adamán,[a] que traducido significa «la Tierra Santa de lo Adamantino».


    Desde aquel día, toda autoridad ha honrado la sangre de la virgen, y la tierra fue purificada a causa de la sangre de la virgen. Además, el agua fue purificada por medio de la semejanza de Pistis Sofía, que se había aparecido al Progenitor Primordial dentro de las aguas. Por eso se ha dicho con razón: «(apareció) por medio de las aguas».[b] Puesto que da vida a todo, […] el agua santa lo purifica todo.[c]'
