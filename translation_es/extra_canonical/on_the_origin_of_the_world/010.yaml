base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: es
  text: 'Cuando el Progenitor Primordial vio la belleza de la luz mientras resplandecía, quedó asombrado y sintió una profunda vergüenza. Al brotar aquella luz, se manifestó dentro de ella una figura humana verdaderamente maravillosa. Nadie la vio, salvo el Progenitor Primordial y Prónoia, que habitaba con él. Sin embargo, su luz se manifestó a todos los ejércitos de los cielos, y por eso todos quedaron perturbados.


    Cuando Prónoia vio entonces a aquel mensajero, se enamoró de él. Pero él la aborrecía porque ella habitaba en la oscuridad. Ella quiso abrazarlo, pero no pudo. Como no podía apagar su amor, derramó su luz sobre la tierra. Desde aquel día, ese mensajero ha sido llamado «Adán de Luz», que traducido significa «el radiante hombre de sangre». Y sobre él fue extendida la tierra, el santo Adamán,[a] que traducido significa «la Tierra Santa de lo Adamantino».


    Desde aquel día, toda autoridad ha honrado la sangre de la virgen, y la tierra fue purificada a causa de la sangre de la virgen. Además, el agua fue purificada por medio de la figura de Pistis Sofía, que se había aparecido al Progenitor Primordial dentro de las aguas. Por eso se ha dicho con razón: «Apareció por medio de las aguas».[b] Puesto que da vida a todo, […] el agua santa lo purifica todo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio conserva aquí un juego de palabras entre Adán, Adamán y «adamantino». La etimología expresada por el propio texto es simbólica y no debe entenderse necesariamente como una derivación lingüística moderna.
    reason: Aclara un juego verbal difícil de reproducir en español sin corregir la explicación interna del escrito.
  - marker: b
    text: El sujeto de «apareció» no está expresado con claridad; podría referirse a la figura de Pistis Sofía o a otra realidad mencionada en el contexto.
    reason: Preserva la ambigüedad señalada por los paréntesis del testimonio inglés.
  - marker: c
    text: Los corchetes indican una laguna o un punto de restauración incierta en el testimonio manuscrito.
    reason: Explica la señal de daño o pérdida textual conservada en el pasaje.
lexical_decisions:
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Conserva la idea de origen y ascendencia sin imponer género más allá del masculino gramatical que exige el contexto posterior.
- source_word: Pronoia
  choice: Prónoia
  rationale: Se translitera como nombre propio y se añade tilde para orientar la pronunciación en español; no se traduce como «Providencia» para preservar su función personificada y la ambigüedad del término.
- source_word: human likeness
  choice: figura humana
  rationale: Expresa una manifestación con forma o semejanza humana sin afirmar que se trate simplemente de un ser humano.
- source_word: hosts of the heavens
  choice: ejércitos de los cielos
  rationale: Mantiene la imagen cosmológica colectiva y el plural «cielos» del testimonio suministrado.
- source_word: Adam of Light
  choice: Adán de Luz
  rationale: Traducción transparente del título, conservando «Adán» como nombre y como elemento del juego etimológico posterior.
- source_word: Adaman
  choice: Adamán
  rationale: Transliteración con acento gráfico para facilitar la lectura y conservar el juego verbal entre Adán, Adamán y adamantino.
- source_word: Adamantine
  choice: lo Adamantino
  rationale: La forma sustantivada evita precisar indebidamente si se alude a una sustancia, cualidad, región o entidad adamantina.
- source_word: Pistis Sophia
  choice: Pistis Sofía
  rationale: Conserva «Pistis» como nombre técnico y adapta «Sophia» a la forma española «Sofía», sin traducirlas como «Fe» y «Sabiduría».
- source_word: authority
  choice: autoridad
  rationale: Mantiene el vocabulario cosmológico del pasaje sin identificar estas autoridades con una jerarquía doctrinal específica.
- source_word: holy water
  choice: agua santa
  rationale: Versión natural y formalmente cercana, sin introducir una referencia sacramental explícita.
theological_decisions:
- issue: Identidad y naturaleza de la figura luminosa
  choice: «una figura humana» y luego «aquel mensajero»
  alternative: «un ser humano» o «un ángel»
  rationale: Preserva la tensión entre semejanza humana y función de mensajero sin fijar su ontología.
- issue: Sentido de Prónoia
  choice: Mantener el nombre propio sin traducir
  alternative: «Providencia» o «Previsión»
  rationale: La traducción conceptual podría imponer una lectura teológica particular; la transliteración conserva la personificación y la polisemia.
- issue: Juego etimológico de Adán, sangre y Adamán
  choice: Reproducir literalmente las glosas del testimonio y añadir una nota de cautela
  alternative: Corregir o racionalizar la etimología
  rationale: El pasaje propone sus propias equivalencias simbólicas; no corresponde armonizarlas con etimologías modernas.
- issue: Sujeto de «apareció» en la cita
  choice: Conservar el sujeto implícito
  alternative: Identificarlo expresamente como Pistis Sofía, su figura o la luz
  rationale: El contexto permite varias referencias y el testimonio marca incertidumbre; explicitar una resolvería indebidamente la ambigüedad.
- issue: Alcance de la purificación por el agua santa
  choice: «lo purifica todo»
  alternative: «purifica todas las cosas»
  rationale: Mantiene la afirmación universal del pasaje sin añadir una explicación ritual, moral o sacramental.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen como nombres técnicos Prónoia y Pistis Sofía, y se evita explicar doctrinalmente la cosmología. El borrador es provisional porque la revisión directa del copto sigue pendiente. Se eliminó el número de página manuscrita «[7]» que interrumpía la oración, pero la laguna textual final se conserva como «[…]» y se explica en nota.
