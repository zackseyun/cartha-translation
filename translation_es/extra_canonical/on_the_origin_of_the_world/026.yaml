    text: El referente de «estos» no está claro en el testimonio disponible.
    reason: Preservar una ambigüedad real del texto base sin introducir un antecedente conjetural.
  - marker: b
    text: También podría traducirse «pensamiento anticipado», «designio» o, si se trata de un término técnico, «providencia».
    reason: Advertir el campo semántico de «forethought» mientras esté pendiente la revisión directa del copto.
  revision_rationale: La revisión necesaria corrige el falso matiz jurídico de «condena» para «censure» y mejora una formulación verbal menor. Se conserva la ambigüedad de los plurales, la terminología técnica y todas las demás decisiones del borrador. Dado que la revisión directa del copto sigue pendiente, no se resuelven ni reinterpretan ambigüedades del testimonio inglés.
