  english_witness: 'The all-superior Logos was dispatched solely for this reason: that he could announce the unknown. He said, “Nothing that is hidden is not revealed, and what is unknown will be known,” and these were dispatched to make known what is hidden, even the seven authorities of Chaos as well as their impiety, and in this way they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: es
  text: 'El Logos, superior a todo, fue enviado únicamente con este propósito: dar a conocer lo desconocido. Él dijo: «No hay nada oculto que no sea revelado, y lo desconocido llegará a conocerse». Y estos fueron enviados[a] para dar a conocer lo que está oculto, incluidas las siete autoridades del Caos y su impiedad. De este modo, fueron condenados a muerte.


    Cuando todos los perfectos aparecieron en las formas moldeadas por los arcontes y revelaron la verdad incomparable, humillaron toda la sabiduría de los dioses. Se descubrió que su destino era una condena, y su ejército se marchitó. Su dominio se desvaneció. Su previsión[b] quedó reducida a nada, junto con su gloria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El referente de «estos» no está claro en el testimonio disponible.
    reason: Preservar una ambigüedad real del texto base sin introducir un antecedente conjetural.
  - marker: b
    text: También podría traducirse «pensamiento anticipado», «designio» o, si se trata de un término técnico, «providencia».
    reason: Advertir el campo semántico de «forethought» mientras esté pendiente la revisión directa del copto.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Se conserva el término técnico y personificado, ampliamente reconocible en textos filosóficos y religiosos; traducirlo solo como «Palabra» o «Razón» reduciría su campo semántico.
- source_word: all-superior
  choice: superior a todo
  rationale: Expresa de manera natural la supremacía absoluta sin añadir una identificación teológica no explícita.
- source_word: announce the unknown
  choice: dar a conocer lo desconocido
  rationale: En este contexto, «dar a conocer» comunica mejor la revelación de lo desconocido que el más estrecho «anunciar».
- source_word: authorities of Chaos
  choice: autoridades del Caos
  rationale: Mantiene la designación de potestades cósmicas y trata «Caos» como nombre del ámbito personificado o primordial.
- source_word: archons
  choice: arcontes
  rationale: Conserva el término técnico habitual para los gobernantes cósmicos de este escrito.
- source_word: host
  choice: ejército
  rationale: Comunica con claridad el sentido colectivo y militar de la comitiva o fuerza bajo su mando.
- source_word: lordship
  choice: dominio
  rationale: Expresa el poder gobernante ejercido, sin confundirlo con un título honorífico.
- source_word: forethought
  choice: previsión
  rationale: Mantiene el sentido básico de pensamiento anticipado; se señala en nota la posible densidad técnica del término.
theological_decisions:
- issue: Identidad del referente plural en «these were dispatched»
  choice: «estos fueron enviados», sin identificar el antecedente
  alternative: Explicitar «estos seres», «estas palabras» o «los perfectos»
  rationale: El testimonio inglés suministrado deja incierto el referente. La traducción conserva esa ambigüedad en vez de resolverla doctrinalmente.
- issue: Descripción de «todos los perfectos»
  choice: «todos los perfectos»
  alternative: «todos los seres perfectos» o «todos los perfectos seres humanos»
  rationale: No se especifica qué clase de seres son; el sustantivo adjetival conserva la apertura del texto.
- issue: Sentencia de muerte
  choice: «fueron condenados a muerte»
  alternative: «recibieron sentencia de muerte»
  rationale: La formulación conserva la pasiva y no identifica al juez ni determina si la muerte es literal, cósmica o simbólica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron «Logos» y «arcontes» como términos técnicos. El borrador se basa provisionalmente en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa de los testigos coptos.
