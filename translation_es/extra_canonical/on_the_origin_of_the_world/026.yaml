  revised_footnotes:
  - marker: a
    text: El referente de «estos» no está claro en el testimonio disponible.
    reason: Preserva la ambigüedad real del texto base sin introducir un antecedente conjetural.
  - marker: b
    text: También podría traducirse «pensamiento anticipado», «designio» o, si se trata de un término técnico, «providencia».
    reason: Advierte el campo semántico de «forethought» mientras esté pendiente la revisión directa del copto.
