review_pass:
  verdict: revise
  source_fidelity: El borrador conserva bien la estructura, los referentes ambiguos y los términos técnicos del testimonio inglés disponible. Sin embargo, «condena» para «censure» desplaza el sentido hacia una sentencia o pena, mientras que el pasaje ya habla inmediatamente antes de que «fueron condenados a muerte». «Censura» preserva la distinción y el carácter de reproche o descalificación.
  naturalness: El español es en general natural, sobrio y adecuado para un texto religioso-filosófico. Se ajusta levemente la formulación de «lo desconocido llegará a conocerse» a «lo desconocido será conocido», una pasiva más directa y natural que conserva el sentido prospectivo.
  terminology: «Logos», «arcontes», «Caos», «autoridades», «dominio» y «previsión» están bien escogidos. Se mantienen las notas sobre el plural sin antecedente claro y sobre el alcance de «previsión».
  issues:
  - severity: medium
    issue: «su destino era una condena» traduce «their fate was found to be a censure».
    rationale: «Censure» significa censura, reproche o desaprobación, no necesariamente una condena judicial. Además, traducirlo como «condena» borra la distinción con la posterior sentencia a muerte del mismo pasaje.
  - severity: low
    issue: «lo desconocido llegará a conocerse» es una construcción menos directa.
    rationale: «Lo desconocido será conocido» expresa naturalmente la pasiva futura del testimonio («will be known») sin alterar su sentido.
  revised_text: 'El Logos, superior a todo, fue enviado únicamente con este propósito: dar a conocer lo desconocido. Él dijo: «No hay nada oculto que no sea revelado, y lo desconocido será conocido». Y estos fueron enviados[a] para dar a conocer lo que está oculto, incluidas las siete autoridades del Caos y su impiedad. De este modo, fueron condenados a muerte.


    Cuando todos los perfectos aparecieron en las formas moldeadas por los arcontes y revelaron la verdad incomparable, humillaron toda la sabiduría de los dioses. Se halló que su destino era una censura, y su ejército se marchitó. Su dominio se desvaneció. Su previsión[b] quedó reducida a nada, junto con su gloria.'
  revised_footnotes:
