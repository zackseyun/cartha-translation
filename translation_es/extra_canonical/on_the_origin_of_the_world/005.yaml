base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: es
  text: 'Cuando los cielos se establecieron junto con sus ejércitos y toda su organización, el Progenitor Primordial se llenó de arrogancia. Todo el ejército de ángeles lo adoraba, y todos los dioses y sus ángeles le ofrecían alabanza y adoración. Él se enalteció y se jactaba una y otra vez ante ellos: «Yo me basto a mí mismo».


    Dijo: «Yo soy el que es Dios, y fuera de mí no existe nada más». Al decir esto, transgredió contra todos los inmortales que hablan con palabras, y ellos lo acusaron por ello.


    Cuando Pistis vio la impiedad del arconte principal[a], se enfureció. Aunque era invisible, dijo: «Estás equivocado, Samael» —es decir, «Dios ciego»[b]—. «Existe un hombre inmortal de luz que existía antes que tú y que se manifestará entre las formas que has modelado. Te pisoteará con desprecio, como se pisotea una vasija de alfarero, y te precipitarás hasta tu madre, el Abismo, junto con los que te pertenecen. Porque, cuando se completen todas tus obras, será abolida toda la deficiencia que la verdad ha dejado al descubierto. Su existencia llegará a su fin y será como si nunca hubiera existido».


    Después de decir esto, Pistis manifestó en las aguas la imagen de su grandeza. Hecho esto, volvió a subir y se retiró a su luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Arconte» significa gobernante o autoridad. En este escrito designa a un gobernante del orden cósmico.
    reason: Aclara un tecnicismo poco común sin identificar la figura con una doctrina denominacional.
  - marker: b
    text: El texto interpreta el nombre «Samael» como «Dios ciego».
    reason: Conserva explícitamente la glosa etimológica transmitida por el testimonio.
lexical_decisions:
- source_word: Primal Parent
  choice: Progenitor Primordial
  rationale: Conserva la idea de una figura parental originaria sin especificar sexo ni introducir el término teológico más definido «Padre».
- source_word: hosts
  choice: ejércitos
  rationale: «Ejércitos» reproduce el sentido cosmológico de huestes organizadas y resulta comprensible en español actual.
- source_word: government
  choice: organización
  rationale: En este contexto cósmico, expresa el orden o estructura gobernante sin sugerir exclusivamente un gobierno político moderno.
- source_word: self-sufficient
  choice: me basto a mí mismo
  rationale: Expresa de manera natural la afirmación de autosuficiencia y conserva el tono arrogante del discurso.
- source_word: deathless ones
  choice: inmortales
  rationale: Es una formulación natural y directa que mantiene la distinción entre seres no sujetos a la muerte y el «hombre inmortal de luz».
- source_word: chief archon
  choice: arconte principal
  rationale: Retiene el tecnicismo «arconte», habitual para esta figura en textos gnósticos, y traduce su rango sin identificarlo con una categoría doctrinal posterior.
- source_word: forms you have shaped
  choice: formas que has modelado
  rationale: «Modelado» conserva la imaginería artesanal que prepara la comparación con la vasija del alfarero.
- source_word: deficiency
  choice: deficiencia
  rationale: Mantiene el término conceptual deliberadamente abstracto sin interpretarlo como pecado, mal o creación material.
- source_word: likeness of her greatness
  choice: imagen de su grandeza
  rationale: «Imagen» comunica una manifestación representativa sin afirmar que se reveló la esencia misma de Pistis.
theological_decisions:
- issue: Alcance de la afirmación divina del Progenitor Primordial
  choice: «Yo soy el que es Dios, y fuera de mí no existe nada más»
  alternative: «Yo soy Dios y no hay otro fuera de mí»
  rationale: La formulación elegida conserva el énfasis y la afirmación ontológica del testimonio sin armonizarla con fórmulas bíblicas conocidas.
- issue: Identidad y naturaleza del «hombre inmortal de luz»
  choice: Se mantiene literalmente como «un hombre inmortal de luz»
  alternative: Interpretarlo como una figura divina, celestial o mesiánica específica
  rationale: El pasaje no identifica explícitamente a la figura; la traducción preserva esa ambigüedad y evita imponer una cristología o antropología determinada.
- issue: Sentido de la desaparición de la deficiencia
  choice: «será abolida... será como si nunca hubiera existido»
  alternative: Explicarlo como destrucción del mal, restauración universal o aniquilación de seres
  rationale: Se conserva la tensión escatológica del texto sin definir qué abarca ontológicamente la «deficiencia» ni convertirla en una doctrina sistemática.
- issue: Estatus de Pistis
  choice: Se conserva el nombre «Pistis» y la referencia femenina
  alternative: Traducir el nombre como «Fe»
  rationale: Como figura personificada y nombre propio, «Pistis» evita reducir el personaje a la virtud abstracta de la fe; la forma femenina sigue el testimonio.
- issue: La invisibilidad de Pistis
  choice: «Aunque era invisible, dijo»
  alternative: «La Invisible dijo»
  rationale: La elección conserva la circunstancia narrativa sin convertir necesariamente «Invisible» en un título técnico, posibilidad que sigue abierta en el original mediado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron Pistis, Samael y «arconte» como términos propios o técnicos. La sintaxis se hizo fluida sin eliminar las repeticiones enfáticas ni resolver las ambigüedades cosmológicas. Este borrador se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,5 y de los testigos relacionados.
