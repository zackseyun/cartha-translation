review_pass:
  verdict: revise
  source_fidelity: El borrador sigue de cerca el testimonio inglés suministrado, que es la base disponible mientras se espera la revisión directa del copto. Sin embargo, «organización» atenúa indebidamente «government», y «Aunque era invisible» convierte una caracterización narrativa en una concesión no expresada por el testimonio. Se corrigen esos puntos sin resolver ambigüedades cosmológicas o doctrinales.
  naturalness: El español es en general fluido y de registro digno. «Huestes» resulta más natural y más preciso que «ejércitos» para los colectivos celestes en este contexto; «Ella, que era invisible» conserva mejor la estructura del pasaje. Se ajustan algunas formulaciones para una lectura más idiomática sin perder el tono solemne.
  terminology: Se conservan «Pistis», «Samael», «arconte», «Abismo», «inmortales» y «deficiencia». «Progenitor Primordial» mantiene la designación no doctrinalmente especificada. La nota de «arconte» y la glosa textual de Samael siguen siendo pertinentes.
  issues:
  - severity: medium
    issue: «Toda su organización» para «all of their government»
    rationale: «Organización» puede designar solo estructura o disposición; «gobierno» preserva la idea de autoridad o dominio presente en el testimonio sin modernizarla en exceso.
  - severity: medium
    issue: «Aunque era invisible» para «She who was unseen»
    rationale: «Aunque» introduce una relación concesiva ausente. La redacción revisada presenta la invisibilidad como descripción de Pistis, tal como lo hace el testimonio.
  - severity: low
    issue: «Ejércitos» para «hosts»
    rationale: Aunque es posible, «huestes» es el equivalente más usual para colectivos celestes y evita una asociación militar demasiado concreta.
  - severity: low
    issue: «se manifestará» para «will become manifest»
    rationale: «Se hará manifiesto» reproduce con mayor precisión el carácter intransitivo de la manifestación de la figura.
  revised_text: 'Cuando los cielos se establecieron junto con sus huestes y todo su gobierno, el Progenitor Primordial se llenó de arrogancia. Toda la hueste de ángeles lo adoraba, y todos los dioses y sus ángeles le ofrecían alabanza y adoración. Él se enalteció y se jactaba repetidamente ante ellos: «Yo me basto a mí mismo».


    Dijo: «Yo soy el que es Dios, y fuera de mí no existe nada más». Al decir esto, transgredió contra todos los inmortales que hablan con palabras, y ellos lo acusaron por ello.


    Cuando Pistis vio la impiedad del arconte principal[a], se enfureció. Ella, que era invisible, dijo: «Estás equivocado, Samael», es decir, «Dios ciego»[b]. «Existe un hombre inmortal de luz que existía antes que tú y que se hará manifiesto entre las formas que has modelado. Te pisoteará con desprecio, como se pisotea una vasija de alfarero, y te precipitarás hasta tu madre, el Abismo, junto con los que son tuyos. Porque, cuando se completen todas tus obras, será abolida toda la deficiencia que la verdad ha dejado al descubierto. Su existencia llegará a su fin y será como si nunca hubiera existido».


    Después de decir esto, Pistis manifestó en las aguas la semejanza de su grandeza. Hecho esto, volvió a subir y se retiró a su luz.'
  revised_footnotes:
  - marker: a
    text: «Arconte» significa gobernante o autoridad. En este escrito designa a un gobernante del orden cósmico.
    reason: Aclara un tecnicismo poco común sin identificar la figura con una doctrina denominacional.
  - marker: b
    text: El texto interpreta el nombre «Samael» como «Dios ciego».
    reason: Conserva explícitamente la glosa etimológica transmitida por el testimonio.
  revision_rationale: 'La revisión se limita a mejoras seguras de fidelidad y de expresión: «huestes» y «gobierno» reflejan mejor el vocabulario del testimonio, la invisibilidad de Pistis se formula sin concesión añadida y «se hará manifiesto» mantiene el valor intransitivo. También se usa «semejanza» para reflejar más estrechamente «likeness». No se identifica al hombre de luz, no se sistematiza la deficiencia y no se armoniza el discurso con fórmulas religiosas externas.'
