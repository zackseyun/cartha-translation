review_pass:
  verdict: revise
  source_fidelity: La revisión directa del copto sigue pendiente; por ello se contrasta de manera provisional con el testimonio inglés suministrado. El borrador conserva en general la secuencia, las imágenes y las ambigüedades del testimonio, pero «organización» atenúa «government», y «se enalteció» no expresa con precisión que el personaje quedó eufórico/complacido.
  naturalness: El español es claro y de registro apropiado. Se mejora la fluidez con «huestes», «gobierno» y una formulación más natural para la reacción de orgullo satisfecho. También se regulariza la puntuación del discurso citado.
  terminology: Se conservan «Progenitor primordial», Pistis, Samael, «arconte», «Abismo» y «deficiencia». «Huestes» resulta más adecuado que «ejércitos» en este marco cosmológico y evita una connotación militar demasiado estricta. La glosa «Dios ciego» se mantiene como interpretación interna del texto, no como etimología afirmada por el revisor.
  issues:
  - severity: medium
    issue: «toda su organización» para «all of their government»
    rationale: «Organización» puede designar una estructura genérica y omite el matiz de gobierno, dominio o administración presente en el testimonio. «Todo su gobierno» conserva mejor el sentido sin resolver su alcance cosmológico.
  - severity: low
    issue: «Él se enalteció» para «he was elated»
    rationale: La expresión española sugiere principalmente autoexaltación, mientras que el testimonio describe que quedó exultante o complacido tras recibir culto. «Quedó complacido» conserva la reacción sin añadir una acción distinta.
  - severity: low
    issue: «ejércitos» para «hosts»
    rationale: Aunque es posible, «huestes» es el equivalente tradicional y más amplio en un contexto celeste; no restringe innecesariamente el referente a fuerzas militares.
  - severity: low
    issue: La nota b puede leerse como una etimología histórica establecida
    rationale: La equivalencia debe presentarse como la interpretación que ofrece este pasaje, ya que la revisión del copto y la cuestión etimológica directa no se han completado.
  revised_text: 'Cuando los cielos se establecieron junto con sus huestes y todo su gobierno, el Progenitor primordial se llenó de arrogancia. Toda la hueste de los ángeles lo adoraba, y todos los dioses y sus ángeles le ofrecían alabanza y adoración. Quedó complacido y una y otra vez se jactaba ante ellos: «Yo me basto a mí mismo».


    Dijo: «Yo soy el que es Dios, y fuera de mí no existe nada más». Después de decir esto, transgredió contra todos los inmortales que hablan con palabras, y ellos lo acusaron por ello.


    Cuando Pistis vio la impiedad del arconte principal[a], se enfureció. Aunque era invisible, dijo: «Estás equivocado, Samael», es decir, «Dios ciego»[b]. «Existe un hombre inmortal de luz que existía antes que tú y que se manifestará entre las formas que has modelado. Te pisoteará con desprecio, como se pisotea una vasija de alfarero, y te precipitarás hasta tu madre, el Abismo, junto con los que te pertenecen. Porque, cuando se completen todas tus obras, será abolida toda la deficiencia que la verdad ha dejado al descubierto. Su existencia llegará a su fin y será como si nunca hubiera existido».


    Después de decir esto, Pistis manifestó la imagen de su grandeza en las aguas. Hecho esto, se retiró de nuevo a lo alto, a su luz.'
  revised_footnotes:
  - marker: a
    text: «Arconte» significa gobernante o autoridad. En este escrito designa a un gobernante del orden cósmico.
    reason: La nota es sobria, aclara el tecnicismo y no identifica la figura con una doctrina posterior.
  - marker: b
    text: El pasaje interpreta el nombre «Samael» como «Dios ciego».
    reason: Aclara que se está reproduciendo la glosa interna del testimonio, sin presentar una conclusión etimológica independiente.
  revision_rationale: 'Se realizan correcciones acotadas de equivalencia y estilo: «todo su gobierno» reproduce mejor el término inglés mediador; «huestes» conserva el alcance celeste de hosts; y «quedó complacido» refleja la reacción descrita sin intensificarla como autoexaltación. Se preservan el carácter no identificado del hombre de luz, la abstracción de «deficiencia» y la posible ambigüedad de que Pistis sea invisible. Dado que solo se proporcionó un testimonio inglés y la revisión del copto está expresamente pendiente, estas decisiones son provisionales.'
