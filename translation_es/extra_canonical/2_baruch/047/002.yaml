  rationale: Traducción directa del sustantivo siríaco definido.
- source_word: ܐܬܡܠܠ ܥܡܝ
  choice: él había hablado conmigo
  rationale: Conserva la construcción pasiva/reflexiva idiomática del siríaco en español natural y mantiene sin identificar al referente implícito del verbo.
- source_word: ܨܡܬ
  choice: ayuné
  rationale: Traducción directa del verbo en primera persona singular.
