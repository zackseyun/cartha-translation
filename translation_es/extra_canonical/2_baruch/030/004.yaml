translation:
  language: es
  text: Pero las almas de los malvados se consumirán aún más cuando vean todas estas cosas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦ̈ܫܬܗܘܢ ܕܪ̈ܫܝܥܐ
  choice: las almas de los malvados
  rationale: Conserva la referencia antropológica a las «almas» y expresa la valoración moral con una formulación natural y no denominacional.
- source_word: ܢܬܡܣܝ̈ܢ / lectura textual equivalente
  choice: se consumirán
  rationale: Comunica un proceso de desfallecimiento o deterioro intenso sin añadir una explicación sobre su naturaleza.
- source_word: ܟܕ ܢܚܙܘܢ ܗܠܝܢ ܟܠܗܝܢ / lectura textual equivalente
  choice: cuando vean todas estas cosas
  rationale: Mantiene la relación temporal y el alcance total de lo contemplado.
theological_decisions:
- issue: Naturaleza del estado de las almas malvadas
  choice: se consumirán
  alternative: serán destruidas
  rationale: La expresión describe su deterioro o angustia, pero no exige resolver aquí si implica aniquilación; se preserva así la tensión escatológica del pasaje.
translation_notes:
  register: Español latinoamericano neutro, claro y solemne. Se conserva «almas» por su relevancia en el contexto inmediato y «malvados» como término moral corriente. La ubicación exacta del versículo presenta dificultades en el testimonio suministrado, cuyo texto está desordenado o deteriorado, por lo que la redacción se apoya en la lectura recuperable del pasaje y en la capa inglesa auditada.
