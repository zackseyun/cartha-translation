  text: For they know that their torment has come, and that their destruction has arrived.
translation:
  language: es
  text: Porque saben que ha llegado su tormento y que ha llegado su destrucción.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ
  choice: saben
  rationale: Conserva el sentido cognitivo del verbo siríaco y concuerda con el sujeto plural exigido por el contexto del versículo.
- source_word: ܬܫܡܫܬܗܘܢ
  choice: su tormento
  rationale: En este contexto escatológico se entiende como la aflicción o pena que les corresponde; «tormento» mantiene la fuerza del enunciado sin ampliarlo.
- source_word: ܡܛܐ
  choice: ha llegado / ha sobrevenido
  rationale: El verbo expresa que algo ha alcanzado su momento o ha llegado hasta los afectados; la variación en español evita una repetición rígida sin alterar el paralelismo.
- source_word: ܐܒ̈ܗܝ
  choice: la destrucción
  rationale: La lectura del testimonio suministrado es textualmente difícil, pero el contexto y la tradición textual respaldan aquí la idea de ruina o destrucción.
theological_decisions:
- issue: Carácter del castigo anunciado
  choice: «tormento» y «destrucción» como términos paralelos, sin explicar su duración ni naturaleza
  alternative: Interpretarlos explícitamente como castigo eterno, aniquilación o mera calamidad histórica
  rationale: El versículo anuncia juicio, pero no resuelve por sí solo esas cuestiones teológicas; la traducción conserva esa tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y solemne. Se conserva la estructura causal y el paralelismo de las dos cláusulas. El pasaje fuente presenta dificultades de segmentación y reconocimiento, por lo que la formulación se apoya en el sentido recuperable del siríaco y usa la versión inglesa auditada solo como control.
