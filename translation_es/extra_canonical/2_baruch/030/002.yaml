base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: es
  text: Y sucederá en aquel tiempo que se abrirán los depósitos donde está guardado el número de las almas de los justos, y ellas saldrán. Se verán juntas las multitudes de almas en una sola asamblea, de un mismo sentir. La primera se alegrará, y la última no se entristecerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ
  choice: depósitos
  rationale: Expresa el lugar donde algo se conserva, sin sugerir necesariamente riquezas materiales como podría hacerlo «tesoros».
- source_word: ܢܦܫ̈ܬܐ
  choice: almas
  rationale: Es la correspondencia natural en este contexto escatológico, donde las almas de los justos están guardadas y luego salen.
- source_word: ܟܢܘܫܝܐ
  choice: asamblea
  rationale: Conserva la idea de una congregación reunida, no solo de una agrupación accidental.
- source_word: ܚܕ ܪܥܝܢܐ
  choice: con un mismo sentir
  rationale: Comunica unidad interior o de disposición sin reducir la expresión a una identidad puramente intelectual.
theological_decisions:
- issue: La condición de las almas antes de salir
  choice: «donde está guardado el número de las almas de los justos»
  alternative: «donde se guardan las almas de los justos»
  rationale: Se conserva la referencia formal al «número» de las almas, evitando sustituirla por una afirmación más directa acerca de cómo existen o son almacenadas.
- issue: Identidad de «las primeras» y «las últimas»
  choice: Se mantienen como expresiones sustantivadas femeninas, referidas naturalmente a las almas.
  alternative: Interpretarlas como generaciones anteriores y posteriores.
  rationale: El texto no explica de manera explícita el criterio temporal; la traducción preserva esa indeterminación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las imágenes escatológicas y la distinción entre las primeras y las últimas sin añadir una explicación doctrinal.
