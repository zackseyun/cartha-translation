  revised_text: 'La materia, cuya forma es fluida, es causa de la ceguera que prevalece por medio de las potencias [. . .] en ellas, todo ello [. . .], mientras juntas engendran y son [destruidas]. El pensamiento situado entre los de la [derecha y] los de la izquierda es una potencia de [imitación]. Todos los que los primeros desean hacer son, por así decirlo, la proyección de una sombra que sigue a un cuerpo; esto <constituye> las raíces de las criaturas visibles.



    Toda la preparación del ordenamiento de las imágenes, representaciones y semejanzas llegó a existir por causa de quienes necesitan educación, instrucción y formación proporcionadas mediante un espejo, para que lo pequeño pudiera crecer paso a paso. La razón de esto fue que creó al ser humano al final, después de preparar y proveer primero para él las cosas que había creado por causa suya.



    La creación del ser humano ocurrió como la de todas las demás cosas. De manera invisible, la Palabra espiritual los puso en movimiento, llevándolos a su plenitud por medio del Demiurgo [] y de sus servidores angélicos, quienes, junto con la Presunción y sus arcontes, participaron en la obra de formación. Los seres humanos se parecen a una sombra de tierra, para que fueran como [aquellos] separados de las Totalidades. Son criaturas hechas por todos ellos, tanto los de la derecha como los de la izquierda; cada uno de los órdenes dio forma al [ser humano tal como] la propia (Totalidad) había sido (formada).



    La [forma] producida por la Palabra era deficiente, como una [afección] de debilidad, porque la condujo al [olvido], a la ignorancia, a la [deficiencia] y a toda otra debilidad. La Palabra impartió solo la primera forma, <algo que le dio> en ignorancia por medio del Demiurgo, para que llegara a saber que existe algo excelso y que tiene necesidad de [ello]. Esto es lo que el profeta llamó «el Espíritu viviente», «el aliento de los eones excelsos» y «el invisible». Esta es el alma viviente que dio vida al cuerpo que al principio carecía de vida; pero lo que carece de vida es la ignorancia.



    Por consiguiente, es apropiado sostener que el alma del primer ser humano se originó en la Palabra espiritual, mientras que el Creador supuso que él la había hecho. Lo que fue soplado pasó a través de él como por una boca.



    El Creador también envió almas hacia abajo desde su sustancia, porque [él] también posee la capacidad de procrear, [] <siendo> producido a partir de la representación del Padre. Asimismo, los de la izquierda produjeron cierta clase de ser humano propia, porque ellos también poseen la semejanza del <ser>.



    La sustancia espiritual es una realidad unitaria y una sola representación, [y] su debilidad es una condición [de muchas] formas. En cuanto a la sustancia de los seres anímicos, su condición es dual, porque posee conocimiento y alaba al Excelso, aunque <también> se inclina al mal a causa de la inclinación de la Presunción. En cuanto a la sustancia de los seres materiales, su modo difiere, incluso en varias formas, y era una debilidad que prevalecía en varias clases de inclinación.



    Así pues, el primer ser humano es una formación diversa, una creación diversa, un depósito para los de la izquierda y los de la derecha, y una Palabra espiritual cuyos intereses están divididos entre cada una de las dos sustancias de las que deriva su ser.



    Por eso se dice que se plantó para él un paraíso, a fin de que comiera el alimento de tres clases de árboles, pues es un jardín de tres órdenes y proporciona deleite. La sustancia noble y escogida que había en él era más excelsa que <la> creación, y esto <era> un agravio para ellos. Por eso dieron una orden, amenazando con que le sobrevendría un grave peligro, [] a saber, la muerte. Solo se le permitió probar y disfrutar de los árboles malos; del otro árbol, el de la dualidad, no le permitió [a él] comer, y mucho menos del árbol de la vida. Esto fue para impedir que obtuviera un honor [igual al] de ellos y para impedir [que él . . .] a ellos.



    Por medio de la potencia maligna llamada «la serpiente», incluso la más astuta de todas las potencias malignas, el ser humano <fue> extraviado conforme al plan de quienes pertenecen a la memoria y a los deseos. Esta hizo que desobedeciera el mandamiento para que muriera. Y fue expulsado de aquel lugar, de todos sus deleites.



    Esta es la expulsión con la que lo castigaron, cuando fue expulsado de los deleites de quienes pertenecen a la semejanza y de quienes pertenecen a la representación. Esto fue, en realidad, un acto de providencia, para que los seres humanos llegaran a comprender que los placeres solo duran poco tiempo, en contraste con el lugar eterno de reposo. El Espíritu había dispuesto este acto cuando planeó de antemano que el ser humano experimentara el gran mal, a saber, la muerte, que es la ignorancia completa de la Totalidad; y también que probara todos los males que proceden de ella, y que, después de las pasiones, las angustias y cuanto surge de estas, obtuviera el mayor [] bien, a saber, la vida eterna, que es el conocimiento completo de las Totalidades y la obtención de todo bien.



    A causa de la desobediencia del primer ser humano, reinó la muerte. Solía dar muerte a todo ser humano mientras poseía [dominio] y prevalecía; recibió [como] reino ese dominio debido al plan de salvación antes mencionado, por voluntad del Padre.'
