translation:
  language: es
  text: 'La materia, cuya forma es fluida, es causa de la ceguera que prevalece por medio de las potencias [. . .] en ellas, todo ello [. . .], mientras engendran juntas y son [destruidas]. El pensamiento situado entre los de la [derecha y] los de la izquierda es una potencia de [imitación]. Todos aquellos que los primeros desean hacer son, por así decirlo, la proyección de una sombra que sigue a un cuerpo; esto <constituye> las raíces de las criaturas visibles.


    Toda la preparación del ordenamiento de las imágenes, representaciones y semejanzas llegó a existir por causa de quienes necesitan educación, instrucción y formación, proporcionadas mediante un espejo, para que lo pequeño pudiera crecer paso a paso. Por esta razón creó al ser humano al final, después de preparar y proveer primero para él las cosas que había creado por causa suya.


    La creación del ser humano ocurrió como la de todas las demás cosas. De manera invisible, la Palabra espiritual los impulsó y los llevó a término por medio del Demiurgo [a] y de sus servidores angélicos, quienes, junto con la Presunción y sus arcontes,[b] participaron en la obra de formación. Los seres humanos se parecen a una sombra de la tierra, para que fueran como [aquellos] separados de las Totalidades.[c] Son criaturas hechas por todos ellos, tanto los de la derecha como los de la izquierda; cada uno de los órdenes dio forma al [ser humano tal como] la propia (Totalidad) había sido (formada).


    La [forma] producida por la Palabra era deficiente, como una [afección] de debilidad, porque la condujo al [olvido], a la ignorancia, a la [deficiencia] y a toda otra debilidad. La Palabra solo impartió la primera forma, <algo que le dio> en ignorancia por medio del Demiurgo, para que llegara a saber que existe algo excelso y que tiene necesidad de [ello]. Esto es lo que el profeta llamó «el Espíritu viviente», «el aliento de los eones excelsos»[d] y «el invisible». Esta es el alma viviente que dio vida al cuerpo que al principio carecía de vida; pero lo que carece de vida es la ignorancia.


    Por consiguiente, es apropiado sostener que el alma del primer ser humano se originó en la Palabra espiritual, aunque el Creador supuso que él la había hecho. Lo que fue soplado pasó a través de él como por una boca.


    El Creador también envió almas hacia abajo desde su propia sustancia, porque [él] también posee la capacidad de procrear, [] <pues fue> producido a partir de la representación del Padre. Asimismo, los de la izquierda produjeron cierta clase de ser humano propia, porque ellos también poseen la semejanza del <ser>.


    La sustancia espiritual es una realidad unitaria y una sola representación, [pero] su debilidad es una condición [de muchas] formas. En cuanto a la sustancia de los seres anímicos,[e] su condición es dual, porque posee conocimiento y alaba al Excelso, aunque <también> se inclina al mal a causa de la inclinación de la Presunción. En cuanto a la sustancia de los seres materiales, su condición varía, incluso en varias formas; era una debilidad que prevalecía en varias clases de inclinación.


    Así pues, el primer ser humano es una formación diversa, una creación diversa, un depósito para los de la izquierda y los de la derecha, y una Palabra espiritual cuyos intereses están divididos entre cada una de las dos sustancias de las que deriva su ser.


    Por eso se dice que se plantó para él un paraíso, a fin de que comiera el alimento de tres clases de árboles, pues es un jardín de tres órdenes y proporciona deleite. La sustancia noble y escogida que había en él era más excelsa que <la> creación, y esto <era> un agravio para ellos. Por eso dieron una orden y lo amenazaron con que le sobrevendría un grave peligro, [] es decir, la muerte. Solo se le permitió probar y disfrutar de los árboles malos; en cuanto al otro árbol, el de la dualidad, no le permitió [comer], y mucho menos del árbol de la vida. Esto fue para impedir que obtuviera un honor [igual al] de ellos y para impedir [que él . . .] a ellos.


    Por medio de la potencia maligna llamada «la serpiente», la más astuta de todas las potencias malignas, el ser humano <fue> extraviado conforme al plan de quienes pertenecen a la memoria y a los deseos. Esta hizo que desobedeciera el mandamiento para que muriera. Y fue expulsado de aquel lugar, de todos sus deleites.


    Esta es la expulsión con la que lo castigaron, cuando fue echado de los deleites de quienes pertenecen a la semejanza y de quienes pertenecen a la representación. En realidad, esto fue un acto de providencia, para que los seres humanos llegaran a comprender que los placeres solo duran poco tiempo, en contraste con el lugar eterno de reposo. El Espíritu había dispuesto este acto cuando determinó de antemano que el ser humano experimentara el gran mal —es decir, la muerte, que es la ignorancia completa de la Totalidad— y que también probara todos los males que proceden de ella; y que, después de las pasiones, las angustias y cuanto surge de estas, obtuviera el mayor [] bien: la vida eterna, que consiste en el conocimiento completo de las Totalidades y en la obtención de todo bien.


    A causa de la desobediencia del primer ser humano, reinó la muerte. Solía dar muerte a todo ser humano mientras poseía [dominio] y prevalecía, dominio que recibió [como] reino debido al <plan de salvación> antes mencionado, por voluntad del Padre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Demiurgo» es un término técnico para el artífice o agente creador dentro de la cosmología del tratado; aquí se distingue de la Palabra espiritual y del Padre.
    reason: Aclarar un término especializado sin resolver doctrinalmente la relación entre los agentes.
  - marker: b
    text: «Arcontes» significa gobernantes o potestades y designa poderes del orden cósmico en este tratado.
    reason: Hacer comprensible un tecnicismo conservado en la traducción.
  - marker: c
    text: «Totalidades» y «Totalidad» son términos técnicos del tratado para la plenitud superior; se conserva la variación entre plural y singular.
    reason: Evitar reducir el término a «universo» o imponer una normalización interpretativa.
  - marker: d
    text: Los «eones» son realidades u órdenes del ámbito eterno en la cosmología del escrito.
    reason: Explicar un término cosmológico poco común.
  - marker: e
    text: «Anímicos» traduce la categoría relacionada con el alma y la distingue de las categorías espiritual y material.
    reason: Preservar la clasificación tripartita sin confundirla con el uso cotidiano de «psíquico».
lexical_decisions:
- source_word: Word
  choice: Palabra
  rationale: Conserva el título personificado del testimonio y su posible trasfondo de Logos sin reducirlo a habla o discurso.
- source_word: Demiurge
  choice: Demiurgo
  rationale: Mantiene el término técnico cosmológico y evita identificarlo interpretativamente sin más con Dios o con el Padre.
- source_word: archons
  choice: arcontes
  rationale: Usa el término técnico habitual para las potestades gobernantes del marco cosmológico del tratado.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidad
  rationale: Preserva la terminología técnica y la alternancia singular-plural del testimonio, sin normalizarla.
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico del sistema cosmológico antiguo.
- source_word: soulish ones
  choice: seres anímicos
  rationale: Distingue esta categoría de los seres espirituales y materiales; «anímicos» conserva la referencia a alma sin añadir una valoración confesional.
- source_word: presumption
  choice: Presunción
  rationale: La mayúscula refleja que funciona como potencia personificada, aunque el sentido abstracto permanece perceptible.
- source_word: representation
  choice: representación
  rationale: Se distingue sistemáticamente de «imagen» y «semejanza», preservando la tríada conceptual.
- source_word: infirmity
  choice: debilidad
  rationale: Expresa una condición de insuficiencia o fragilidad sin imponer necesariamente enfermedad física.
- source_word: place of repose
  choice: lugar de reposo
  rationale: Mantiene la imagen escatológica del descanso estable frente a los placeres pasajeros.
theological_decisions:
- issue: Origen del alma del primer ser humano
  choice: Se afirma que procede de la Palabra espiritual, mientras el Creador solo supone haberla hecho.
  alternative: Armonizar la Palabra espiritual y el Creador como un único agente.
  rationale: El pasaje establece deliberadamente una diferencia de agencia y conocimiento que debe conservarse.
- issue: Función de la expulsión y de la muerte
  choice: La expulsión se presenta a la vez como castigo y acto providencial dentro de un plan de salvación.
  alternative: Resolverla exclusivamente como castigo maligno o exclusivamente como beneficio divino.
  rationale: El texto mantiene una tensión explícita entre la acción de las potencias y la disposición previa del Espíritu y del Padre.
- issue: Tres sustancias o clases antropológicas
  choice: Se conservan las categorías espiritual, anímica y material.
  alternative: Reformularlas como cuerpo, alma y espíritu dentro de una antropología posterior.
  rationale: El tratado habla de sustancias y órdenes con rasgos propios; una armonización posterior alteraría su cosmología.
- issue: Identidad del Demiurgo
  choice: Se mantiene «Demiurgo» y, donde el testimonio dice Creator, «Creador».
  alternative: Traducir ambos siempre como «Dios» o identificarlos expresamente con el Padre.
  rationale: El pasaje distingue al Padre, la Palabra espiritual y el agente creador; no corresponde resolver esa relación doctrinalmente.
- issue: La serpiente y el plan de otros poderes
  choice: Se presenta como potencia maligna que actúa conforme al plan de los vinculados con la memoria y los deseos.
  alternative: Identificarla explícitamente con Satanás.
  rationale: Esa identificación no aparece en el testimonio suministrado y añadirla importaría una interpretación externa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la densidad conceptual del tratado, pero se aligeran construcciones inglesas poco naturales. Los corchetes, las elipsis entre corchetes, los corchetes vacíos, los paréntesis y los signos angulares reproducen las señales textuales y editoriales del testimonio suministrado. Dado que la revisión directa del copto está pendiente, esta versión es provisional y se basa en el testimonio inglés público proporcionado.
