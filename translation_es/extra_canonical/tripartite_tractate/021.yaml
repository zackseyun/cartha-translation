review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado y conserva en general sus distinciones cosmológicas. Sin embargo, sustituye indebidamente dos señales editoriales del testimonio: el corchete vacío tras «Demiurgo» se convierte en «[a]», y «[and]» se interpreta como «[pero]». La revisión restituye esas señales sin resolver las lagunas.'
  naturalness: El español es mayormente natural, sobrio y adecuado para un tratado especulativo antiguo. Se han efectuado ajustes leves de sintaxis y puntuación para mejorar la fluidez sin simplificar las ambigüedades del pasaje.
  terminology: «Palabra», «Demiurgo», «arcontes», «Totalidad/Totalidades», «eones», «anímicos» y «Presunción» son decisiones apropiadas y consistentes. Las notas explicativas son prudentes y no imponen identificaciones doctrinales.
  issues:
  - severity: medium
    issue: El corchete vacío del testimonio tras «Demiurge []» fue reemplazado por «[a]».
    rationale: Un corchete vacío es una señal textual/editorial del testimonio y no debe convertirse en un marcador de nota. Se conserva como «[]» y el ancla de la nota se coloca separadamente.
  - severity: medium
    issue: «[and]» fue traducido como «[pero]».
    rationale: El testimonio conserva «and» entre corchetes; traducirlo como adversativo altera la coordinación y añade un contraste no indicado.
  - severity: low
    issue: La cláusula sobre el árbol de la dualidad desplazaba el contenido editorialmente restaurado de «[him]».
    rationale: «No le permitió [comer]» no refleja la laguna referida a la persona. Se restituye como «no le permitió [a él] comer», conservando tanto la ambigüedad del sujeto como la señal editorial.
  revised_text: 'La materia, cuya forma es fluida, es causa de la ceguera que prevalece por medio de las potencias [. . .] en ellas, todo ello [. . .], mientras engendran juntas y son [destruidas]. El pensamiento situado entre los de la [derecha y] los de la izquierda es una potencia de [imitación]. Todos aquellos que los primeros desean hacer son, por así decirlo, la proyección de una sombra que sigue a un cuerpo; esto <constituye> las raíces de las criaturas visibles.



    Toda la preparación del ordenamiento de las imágenes, representaciones y semejanzas llegó a existir por causa de quienes necesitan educación, instrucción y formación proporcionadas mediante un espejo, para que lo pequeño pudiera crecer paso a paso. La razón de ello fue que creó al ser humano al final, después de preparar y proveer primero para él las cosas que había creado por causa suya.



    La creación del ser humano ocurrió como la de todas las demás cosas. De manera invisible, la Palabra espiritual los impulsó y los llevó a término por medio del Demiurgo[a] [] y de sus servidores angélicos, quienes, junto con la Presunción y sus arcontes,[b] participaron en la obra de formación. Los seres humanos se parecen a una sombra de tierra, para que fueran como [aquellos] separados de las Totalidades.[c] Son criaturas hechas por todos ellos, tanto los de la derecha como los de la izquierda; cada uno de los órdenes dio forma al [ser humano tal como] la propia (Totalidad) había sido (formada).



    La [forma] producida por la Palabra era deficiente, como una [afección] de debilidad, porque la condujo al [olvido], a la ignorancia, a la [deficiencia] y a toda otra debilidad. La Palabra solo impartió la primera forma, <algo que le dio> en ignorancia por medio del Demiurgo, para que llegara a saber que existe algo excelso y que tiene necesidad de [ello]. Esto es lo que el profeta llamó «el Espíritu viviente», «el aliento de los eones excelsos»[d] y «el invisible». Esta es el alma viviente que dio vida al cuerpo que al principio carecía de vida; pero lo que carece de vida es la ignorancia.



    Por consiguiente, es apropiado sostener que el alma del primer ser humano se originó en la Palabra espiritual, aunque el Creador supuso que él la había hecho. Lo que fue soplado pasó a través de él como por una boca.



    El Creador también envió almas hacia abajo desde su propia sustancia, porque [él] también posee la capacidad de procrear, [] <pues fue> producido a partir de la representación del Padre. Asimismo, los de la izquierda produjeron cierta clase de ser humano propia, porque ellos también poseen la semejanza del <ser>.



    La sustancia espiritual es una realidad unitaria y una sola representación, [y] su debilidad es una condición [de muchas] formas. En cuanto a la sustancia de los seres anímicos,[e] su condición es dual, porque posee conocimiento y alaba al Excelso, aunque <también> se inclina al mal a causa de la inclinación de la Presunción. En cuanto a la sustancia de los seres materiales, su condición varía, incluso en varias formas; era una debilidad que prevalecía en varias clases de inclinación.



    Así pues, el primer ser humano es una formación diversa, una creación diversa, un depósito para los de la izquierda y los de la derecha, y una Palabra espiritual cuyos intereses están divididos entre cada una de las dos sustancias de las que deriva su ser.



    Por eso se dice que se plantó para él un paraíso, a fin de que comiera el alimento de tres clases de árboles, pues es un jardín de tres órdenes y proporciona deleite. La sustancia noble y escogida que había en él era más excelsa que <la> creación, y esto <era> un agravio para ellos. Por eso dieron una orden y lo amenazaron con que le sobrevendría un grave peligro, [] es decir, la muerte. Solo se le permitió probar y disfrutar de los árboles malos; del otro árbol, el de la dualidad, no le permitió [a él] comer, y mucho menos del árbol de la vida. Esto fue para impedir que obtuviera un honor [igual al] de ellos y para impedir [que él . . .] a ellos.



    Por medio de la potencia maligna llamada «la serpiente», la más astuta de todas las potencias malignas, el ser humano <fue> extraviado conforme al plan de quienes pertenecen a la memoria y a los deseos. Esta hizo que desobedeciera el mandamiento para que muriera. Y fue expulsado de aquel lugar, de todos sus deleites.



    Esta es la expulsión con la que lo castigaron, cuando fue echado de los deleites de quienes pertenecen a la semejanza y de quienes pertenecen a la representación. En realidad, esto fue un acto de providencia, para que los seres humanos llegaran a comprender que los placeres solo duran poco tiempo, en contraste con el lugar eterno de reposo. El Espíritu había dispuesto este acto cuando determinó de antemano que el ser humano experimentara el gran mal —es decir, la muerte, que es la ignorancia completa de la Totalidad— y que también probara todos los males que proceden de ella; y que, después de las pasiones, las angustias y cuanto surge de estas, obtuviera el mayor [] bien: la vida eterna, que consiste en el conocimiento completo de las Totalidades y en la obtención de todo bien.



    A causa de la desobediencia del primer ser humano, reinó la muerte. Solía dar muerte a todo ser humano mientras poseía [dominio] y prevalecía, dominio que recibió [como] reino debido al <plan de salvación> antes mencionado, por voluntad del Padre.'
