  - marker: b
    text: Antes de este título hay una laguna en el manuscrito; quizá se haya perdido parte de la expresión o de la lista.
    reason: Se conserva la segunda señal de daño textual indicada por el testimonio.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Totalidades / Totalidad
  rationale: Conserva la terminología cosmológica técnica del tratado y su alternancia entre plural y singular, sin sustituirla por una interpretación explicativa.
- source_word: redemption
  choice: redención
  rationale: Equivalente teológico directo y natural en español, conservando la relación del bautismo con la liberación o recuperación sin precisarla más de lo que permite el testimonio.
- source_word: profession of faith
  choice: se profesa la fe / ha profesado en la fe
  rationale: Expresa el acto confesional con lenguaje claro y digno, sin convertirlo necesariamente en una fórmula litúrgica específica.
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Mantiene la imagen técnica y simbólica del escrito; «cámara» refleja mejor un recinto que «lecho» y evita reducir la expresión al acto conyugal.
- source_word: deathlessness
  choice: no morir
  rationale: Comunica de manera natural la cualidad de estar libre de la muerte, preservando su función explicativa de «vida eterna» sin imponer el término doctrinal más técnico «inmortalidad».
- source_word: garment
  choice: vestidura
  rationale: Conserva la metáfora de revestirse y ofrece un registro digno y comprensible.
- source_word: face
  choice: rostro
  rationale: Mantiene la imagen antropomórfica y la tensión apofática de algo imposible de expresar o comprender.
theological_decisions:
- issue: Relación entre los nombres trinitarios y el único nombre del evangelio
  choice: «esos nombres, [que] son el único nombre del evangelio»
  alternative: «esos nombres, que forman un solo nombre evangélico»
  rationale: Se conserva la tensión entre plural y singular y la señal editorial de texto incierto, sin armonizarla mediante una explicación doctrinal.
- issue: Unidad del creyente con el Padre
  choice: «el Padre pudiera hacerse uno con ella» y «ser hecha una con él»
  alternative: «estar unido al Padre»
  rationale: Mantiene la reciprocidad y la formulación fuerte del testimonio, sin rebajarla a una unión genérica ni definir su naturaleza metafísica.
- issue: Identificación «el Padre (y) Dios»
  choice: Se conserva «(y)» entre paréntesis
  alternative: «el Padre Dios» o «el Padre, que es Dios»
  rationale: Los paréntesis señalan una incertidumbre o peculiaridad textual que no debe resolverse silenciosamente.
- issue: Bautismo como realidad con múltiples nombres
  choice: Se conserva la cadena de títulos metafóricos como predicaciones del bautismo
  alternative: Interpretarlos como ritos o etapas separados
  rationale: El pasaje los presenta como nombres de una misma realidad; no se importan sistemas sacramentales posteriores.
- issue: Género de las referencias a la persona creyente
  choice: Se emplea «esa persona» y concordancia femenina gramatical
  alternative: Mantener exclusivamente «él»
  rationale: El español permite una referencia inclusiva natural sin alterar el contenido; los pronombres masculinos relativos a Dios se conservan donde el texto los requiere.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. La traducción sigue provisionalmente el testimonio público en inglés, pues la revisión directa del copto está pendiente. Se preservan los corchetes para texto incierto, los paréntesis del testimonio, los ángulos para restauraciones editoriales y la elipsis angular para una laguna. Se privilegia claridad sintáctica sin normalizar la terminología cosmológica ni resolver las ambigüedades teológicas del pasaje.
