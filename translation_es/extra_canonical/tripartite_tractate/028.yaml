base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: es
  text: 'En cuanto a cuál es el verdadero bautismo, en el que descienden las Totalidades y en el que llegan a existir, no hay otro bautismo aparte de este: la redención en Dios Padre, el Hijo y el Espíritu Santo, cuando se profesa la fe en esos nombres, [que] son el único nombre del evangelio, [a] cuando alguien ha creído que las cosas que se le han dicho son reales.


    Para quien cree que ellos existen, esto significa recibir de manera invisible al Padre, al Hijo y al Espíritu Santo, dando testimonio con una fe firme y comprendiéndolos con una esperanza firme. Sobre esta base, alcanzar aquello que alguien ha creído podría llegar a ser para esa persona un retorno, de modo que el Padre pudiera hacerse uno con ella: el Padre (y) Dios a quien ha profesado en la fe y quien le concedió ser hecha una con él en el conocimiento.


    El bautismo que mencionamos antes se llama «la vestidura <que> quienes la llevan no se quitan», porque se la ponen quienes han recibido la redención. También se llama «la confirmación de la verdad que no falla», pues es inmóvil e inconmovible: sujeta firmemente a quienes han recibido <restauración>, mientras ellos la sujetan con firmeza. Se llama «silencio» por su quietud y su inmovilidad. También se llama «cámara nupcial» por la condición armoniosa e inseparable de aquellos [a quienes] <él ha> conocido <y que> lo han conocido. También se llama [b] «la luz que no se pone y que no tiene llama», no porque deje de alumbrar, sino porque quienes se la ponen y aquellos a quienes ella reviste son transformados en luz. También se llama «vida eterna», que es no morir.


    Así pues, todo nombre que recibe, incluidos los nombres <omitidos> aquí, concuerda con todas las cosas hermosas que contiene, de una manera sencilla, agradable, inseparable, compleja, perfecta e inconmovible. ¿Cómo, entonces, se la puede nombrar sino como la Totalidad? Aunque se le asignaran incontables nombres, estos se pronunciarían simplemente como una manera de referirse a ella, cuando en realidad trasciende toda palabra, toda voz y todo pensamiento; trasciende todas las cosas y trasciende todo silencio. Así es <…> con quienes son lo que ella es. Esto es, en efecto, lo que ella es: posee un rostro que no puede expresarse ni comprenderse, y es glorificada por quienes poseen conocimiento mediante aquello que han comprendido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito presenta aquí una laguna; no se puede determinar con seguridad qué palabras faltan.
