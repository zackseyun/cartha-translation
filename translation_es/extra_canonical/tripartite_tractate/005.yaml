  yaml_path: translation/extra_canonical/tripartite_tractate/005.yaml
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: es
  text: 'El Padre produjo al Todo como a un niño pequeño, como una gota de un manantial, como un brote de [una vid], como [una flor], como una <planta> [. . .], de modo que necesitaba recibir [alimento], crecimiento y perfección. Lo retuvo por un tiempo. Aquel que lo concibió desde el primer instante del principio lo poseyó y lo contempló desde el primer instante del principio, pero lo <ocultó> de quienes fueron los primeros en proceder de él. No lo hizo por envidia, sino para que los eones no recibieran su perfección (prematuramente) desde el primer instante del principio, ni se elevaran a la gloria (que pertenece únicamente) al Padre, ni pensaran que poseían todo esto por sí mismos. Más bien, así como quiso permitirles llegar a existir, para que también llegaran a existir como entidades perfectas, en el momento que él eligió les concedió la idea perfecta de su generosidad hacia ellos.


    Aquel a quien levantó para que fuera una luz para quienes procedieron de él mismo, aquel de quien ellos reciben su nombre, es el Hijo pleno, completo y perfecto. Lo produjo mezclado con lo que surgió de él, [] [. . .] participando de la gloria [. . .] la Totalidad, en correspondencia con [. . .], por medio de la cual cada uno [puede] recibirla para [sí mismo], aunque ninguno tenía esta grandeza antes de que fueran recibidos por ella. Ellos, en cambio, existen solo parcialmente conforme al modo, la forma y la grandeza que le son propios. [Ellos] pueden verlo y hablar de [lo que] saben acerca de él, porque se revisten unos de otros, porque pueden comprenderlo. En cambio, [su] modo de ser no admite comparación, para que el Padre recibiera honor de cada uno y pudiera revelarse a sí mismo a pesar de su incomparabilidad. Oculto e invisible, ellos se maravillan de él en su mente. Por consiguiente, la grandeza de su excelsitud se manifiesta cuando hablan de él y lo contemplan, entonándole himnos
    por las riquezas de su dulzura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the All
  choice: el Todo
  rationale: Conserva el término cosmológico colectivo del testimonio y evita interpretarlo como «todas las cosas» o «universo».
- source_word: aeons
  choice: eones
  rationale: Mantiene el tecnicismo del contexto valentiniano en vez de reducirlo a «edades» o identificarlo con una categoría doctrinal distinta.
- source_word: produced / brought forth
  choice: produjo
  rationale: Refleja el testimonio «produced» sin precisar de manera indebida si se trata de creación, generación o emanación.
- source_word: planting
  choice: planta
  rationale: La forma entre ángulos señala una restitución editorial; «planta» concuerda naturalmente con la serie de imágenes orgánicas, aunque la revisión copta sigue pendiente.
- source_word: concealed
  choice: ocultó
  rationale: Conserva el sentido del testimonio y la señal editorial mediante ángulos.
- source_word: full, complete and perfect Son
  choice: Hijo pleno, completo y perfecto
  rationale: Retiene los tres calificativos, aunque se solapen parcialmente en español, porque su acumulación es significativa.
- source_word: the Totality
  choice: la Totalidad
  rationale: La mayúscula preserva la posibilidad de que funcione como término técnico y lo distingue de «el Todo».
- source_word: wear each other
  choice: se revisten unos de otros
  rationale: Conserva la imagen inusual y potencialmente técnica sin normalizarla silenciosamente como simple unión o conocimiento.
- source_word: sweetness
  choice: dulzura
  rationale: Mantiene la metáfora sensorial y afectiva del testimonio sin sustituirla por «bondad» o «gracia».
theological_decisions:
- issue: Motivo por el que el Padre demora la perfección de los eones
  choice: Se conserva que no actúa por envidia, sino para impedir una perfección prematura y una apropiación indebida de la gloria.
  alternative: Reformularlo como una pedagogía providencial o como protección contra el orgullo.
  rationale: El texto presenta una tensión propia entre demora, perfección y gloria; no se debe resolver mediante categorías teológicas posteriores.
- issue: Relación del Hijo con lo que procede del Padre
  choice: «Lo produjo mezclado con lo que surgió de él».
  alternative: «Lo engendró unido a su emanación» o una formulación trinitaria explícita.
  rationale: La frase es fragmentaria y teológicamente ambigua; se conserva su lenguaje sin imponer una ontología denominacional.
- issue: Incomparabilidad y revelación del Padre
  choice: Se afirma simultáneamente que el Padre no admite comparación y que puede revelarse.
  alternative: Explicar que solo se revela indirectamente o que permanece absolutamente incognoscible.
  rationale: El pasaje sostiene ambos aspectos y no especifica cómo se relacionan.
- issue: Referentes pronominales en el segundo párrafo
  choice: Se mantienen en lo posible los pronombres ambiguos «él», «ella» y «ellos».
  alternative: Identificar cada referente como el Hijo, la Totalidad, la gloria o los eones.
  rationale: Las lagunas y la sintaxis del testimonio no permiten resolverlos con seguridad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los corchetes, los corchetes vacíos, las elipsis, los paréntesis y los ángulos como señales textuales y editoriales del testimonio suministrado. El borrador es necesariamente provisional porque la revisión directa del copto está pendiente; no se añadieron notas al pie, por lo que no hay marcadores en el texto principal.
