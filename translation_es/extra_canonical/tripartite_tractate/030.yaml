translation:
  language: es
  text: 'Esta es la naturaleza completa de la generación, causada por lo que [Cristo] soportó cuando resplandeció sobre ellos [con] una [luz] que reveló [. . .] como la suya [. . .] que será [. . .] como la suya [. . .], mientras que la única diferencia [que] existe en aquellos que fueron


    (Se han perdido 5 líneas)


    [] [. . .] los que existen [. . .] por medio de [. . .], como [he] dicho antes; mientras que los materiales serán abandonados hasta el fin para ser destruidos, porque no darán sus [nombres], si regresan una vez más a lo que [no existirá]. Tal como eran [. . .], no eran [. . .], pero fueron útiles [durante] el tiempo que habitaron entre ellos, aunque no eran [. . .] al principio. Entonces [. . .] actuar de manera diferente mediante el dominio que poseían en la preparación, [para] resistirlos.


    Aunque continuamente hago uso [de] estas palabras, [no he logrado captar] los pensamientos. Algunos ancianos [. . .] a él grandeza.


    (Se han perdido 5 o 6 líneas)


    [] [. . .] todo [. . .] ángel [. . .] palabras [y] un [sonido] de trompeta, que proclama la gran restauración completa desde el oriente radiante, en la cámara nupcial, que es el amor de Dios el [Padre], conforme al poder que [. . .] de la grandeza [. . .], la dulzura de [. . .] suyo, porque él se revela a las grandezas [. . .] su bondad [. . .] la alabanza, el reino y la [gloria] por medio de [Jesucristo], el Señor, el Salvador, el Redentor de todos los que están incluidos en aquel que está lleno de misericordia amorosa, por medio de [su] Espíritu Santo, desde ahora y por todas las generaciones, por los siglos de los siglos. Amén.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begetting
  choice: generación
  rationale: Conserva el sentido abstracto de engendramiento u origen sin imponer una interpretación biológica más precisa de la que permite el testimonio disponible.
- source_word: material ones
  choice: los materiales
  rationale: Mantiene la categoría técnica antropológica del tratado y evita explicarla doctrinalmente dentro del texto.
- source_word: complete restoration
  choice: restauración completa
  rationale: Reproduce los dos componentes del testimonio sin sustituirlos por un término teológico más específico como «apocatástasis».
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Es una expresión natural y a la vez conserva el posible carácter técnico o simbólico del original.
- source_word: loving mercy
  choice: misericordia amorosa
  rationale: Retiene tanto el elemento de misericordia como el de amor presentes en el testimonio, pese a lo inusual de la construcción.
theological_decisions:
- issue: Destino de «los materiales»
  choice: Traducir literalmente que serán abandonados y destruidos
  alternative: Atenuarlo o interpretarlo como una condición temporal o simbólica
  rationale: El pasaje expresa una afirmación teológicamente tensa; la traducción no debe armonizarla ni resolverla.
- issue: «Lo que no existirá»
  choice: Conservar la referencia futura y ambigua
  alternative: Traducir «la inexistencia» o «lo que no existe»
  rationale: La reconstrucción está entre corchetes y el testimonio dice «will not be»; se preservan tanto el tiempo verbal como la incertidumbre editorial.
- issue: Alcance de la redención
  choice: «el Redentor de todos los que están incluidos...»
  alternative: «el Redentor universal» o «el Redentor de todos»
  rationale: Se conserva la delimitación sintáctica del testimonio sin convertirla en una tesis explícita sobre salvación universal.
- issue: Identidad de «aquel que está lleno de misericordia amorosa»
  choice: Mantener el referente pronominal ambiguo
  alternative: Identificarlo expresamente con Dios Padre o con Cristo
  rationale: El texto fragmentario no permite fijar con seguridad el antecedente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Borrador necesariamente provisional porque no se proporcionó evidencia copta directa y la revisión de la lengua fuente está pendiente. Se conservaron los corchetes, las elipsis, el signo [] y los avisos de líneas perdidas para reflejar el daño manuscrito y las restituciones editoriales. Se omitieron los elementos ajenos al tratado (preguntas frecuentes, datos de contacto y publicidad).
