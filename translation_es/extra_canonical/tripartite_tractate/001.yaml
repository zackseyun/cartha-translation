  yaml_path: translation/extra_canonical/tripartite_tractate/001.yaml
  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: es
  text: '[] Al tratar asuntos elevados, conviene que comencemos por el Padre, la raíz de la Totalidad, de quien hemos recibido el don de hablar acerca de él. Antes de que llegara a existir cualquier cosa aparte de él, él ya existía.


    Como un número, el Padre es uno, porque es el primero y está solo en sí mismo. Sin embargo, no se parece a alguien que simplemente es uno. Si así fuera, ¿cómo podría ser padre? Pues siempre que existe un padre, le sigue el nombre «hijo». Pero el Uno, que es el Padre solo, se parece a la raíz de un árbol con ramas y fruto. En sentido estricto, se dice de él que es padre porque es incomparable e inmutable. Por eso, en sentido estricto, es uno y es dios,[a] ya que nadie está en relación con él como dios, pues nadie es su padre. Él es ingénito:[b] nadie lo engendró ni lo creó. Porque cualquiera que sea padre o creador de otro también tiene padre y creador. Ciertamente, puede ser padre y creador de alguien que llegó a existir de él y a quien él creó. Pero ese, en sentido estricto, no es padre ni es dios, porque hubo [] alguien que [lo engendró y] lo creó. Por lo tanto, en sentido estricto, solo es Padre y Dios aquel a quien nadie engendró. En cuanto a las Totalidades,[c] él es quien las engendró
    y creó.


    No tiene principio ni fin; pero no se trata solamente de que no tenga fin. Por ser ingénito, no está sujeto a la muerte. Además, es inmutable en su ser eterno, en su identidad consigo mismo, en aquello que lo estableció y en aquello que lo hace grande. Nunca será separado de lo que le da el ser, y nadie lo obligará a producir intención alguna que él nunca haya querido. Nadie dio origen a la existencia del Padre; por eso es inmutable. Nadie puede separarlo de su propio ser ni de su identidad consigo mismo, en los cuales existe, ni tampoco de su grandeza; por eso nadie puede comprenderlo. Es imposible que alguien transforme su forma en otra distinta, que lo rebaje, lo cambie o lo disminuya. Así es <como>, en la plenitud de la verdad, él es el inmutable, el que no varía, revestido de inmutabilidad. No es solamente que se lo llame «Sin principio» y «Sin fin»; tampoco nació ni morirá. Así como carece de principio y de fin en su modo de existir, también [] en su grandeza es inalcanzable: incomprensible
    en su sabiduría, insondable en su poder e incognoscible en su dulzura.


    En sentido estricto, solo él, que es el bueno, el Padre ingénito y el enteramente perfecto, está lleno de su descendencia, de toda virtud y de todo cuanto tiene valor. Y posee aún más, incluso la ausencia de toda malicia, de modo que se pueda reconocer que todos los que poseen algo se lo deben a él, porque él lo concede. Aunque es inalcanzable, nunca se cansa de dar: es rico en los dones que otorga y reposa en los favores que prodiga.


    Su condición, su forma y la magnitud de su grandeza son tales que nadie ha estado con él desde el principio. No hay lugar alguno donde habite, del cual proceda o en el cual entre. Tampoco existe una forma primordial que use como modelo al obrar; ninguna dificultad lo acompaña en nada de lo que hace, ni dispone de materia alguna para crear lo que <él> crea. No hay en él sustancia alguna de la que se valga para engendrar cuanto engendra, ni colaborador alguno que lo acompañe en su obra. Afirmar cualquiera de estas cosas es ignorancia. Más bien, se debe afirmar que él es bueno, sin defecto, perfecto, [] íntegro, pues él es la Totalidad.


    Ninguno de los nombres pensados o pronunciados, vistos o entendidos se aplica a él, por inmensamente majestuosos, gloriosos y reverentes que sean. Sin embargo, tales nombres pueden pronunciarse para su gloria y honra, conforme a la capacidad de quienes lo glorifican. En cuanto a lo que pertenece a su existencia, ser y forma, la mente no puede concebirlo, las palabras no pueden expresarlo, los ojos no pueden contemplarlo y nadie puede comprenderlo. Esto se debe a su grandeza inescrutable, su profundidad inaprensible, su altura ilimitada y su <extensión> sin límites.


    Este es el carácter de lo ingénito: no se extiende ni se une a nada como lo hace algo limitado. Más bien, él posee un carácter sin tener rostro ni forma, cosas que pueden comprenderse mediante la percepción. Por eso es incomprensible.


    [a] O «un dios». El testimonio distingue aquí entre la expresión indefinida y el título «Dios» que aparece después; se conserva la tensión del pasaje sin identificar automáticamente ambos usos.

    [b] «Ingénito» significa aquí «no engendrado»; no se refiere simplemente a no haber nacido.

    [c] «Las Totalidades» traduce el plural del testimonio y designa el conjunto de cuanto procede del Padre; se conserva el plural técnico en vez de armonizarlo con «la Totalidad».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «un dios». El testimonio distingue aquí entre la expresión indefinida y el título «Dios» que aparece después; se conserva la tensión del pasaje sin identificar automáticamente ambos usos.
    reason: Aclara una ambigüedad gramatical y teológica significativa sin resolverla en el cuerpo.
  - marker: b
    text: «Ingénito» significa aquí «no engendrado»; no se refiere simplemente a no haber nacido.
    reason: Hace accesible un término técnico necesario para preservar la distinción del pasaje.
  - marker: c
    text: «Las Totalidades» traduce el plural del testimonio y designa el conjunto de cuanto procede del Padre; se conserva el plural técnico en vez de armonizarlo con «la Totalidad».
    reason: Explica una alternancia terminológica importante que podría parecer un error al lector.
lexical_decisions:
- source_word: Totality / Totalities (Coptic review pending)
  choice: la Totalidad / las Totalidades
  rationale: Conserva la alternancia singular-plural y el probable carácter técnico del vocabulario cosmológico, sin reducirlo simplemente a «todo».
- source_word: unbegotten
  choice: ingénito
  rationale: Término teológico preciso para «no engendrado»; una nota evita que el lector lo confunda con «no nacido» en sentido corriente.
- source_word: single / one
  choice: uno / el Uno
  rationale: Mantiene el juego argumental entre unidad numérica, singularidad y paternidad. Se usa «el Uno» cuando la expresión funciona como designación sustantivada.
- source_word: self-identity
  choice: identidad consigo mismo
  rationale: Expresa de modo inteligible la permanencia del Padre idéntico a sí mismo sin introducir terminología doctrinal posterior.
- source_word: deathless
  choice: no está sujeto a la muerte
  rationale: Suena natural en español actual y evita la posible connotación mitológica de «inmortal», conservando la afirmación ontológica.
- source_word: sweetness
  choice: dulzura
  rationale: Retiene la imagen llamativa y posiblemente técnica del testimonio, sin interpretarla como bondad, gracia o benevolencia.
- source_word: extension
  choice: <extensión>
  rationale: Conserva tanto la elección léxica del testimonio como su señal de restauración editorial.
- source_word: category
  choice: condición
  rationale: «Categoría» resultaría rígido y potencialmente anacrónico; «condición» conserva la referencia al modo o rango de ser sin definirlo en exceso.
theological_decisions:
- issue: Distinción entre «es dios» y «Padre y Dios»
  choice: Traducir primero «es dios» y después «Padre y Dios», con nota sobre la posible lectura «un dios».
  alternative: Uniformar todos los casos como «Dios» o traducir «un dios» en el cuerpo.
  rationale: El pasaje presenta una tensión gramatical y conceptual genuina. La traducción no debe resolverla mediante una identificación o subordinación doctrinal importada.
- issue: Lenguaje de engendrar y crear
  choice: Mantener ambos verbos y su paralelismo.
  alternative: Fusionarlos como «dar existencia» o reservar «crear» para una doctrina específica de creación.
  rationale: El texto usa ambas relaciones y después niega materia, modelo y colaborador; conservarlas deja intacta su argumentación propia.
- issue: Afirmaciones aparentemente causales sobre «aquello que lo estableció» y «lo que le da el ser»
  choice: Conservarlas literalmente dentro de la afirmación de que nadie originó al Padre.
  alternative: Reformularlas como atributos internos o eliminarlas para evitar una aparente causa superior.
  rationale: La formulación contiene una tensión metafísica real del testimonio. Resolverla silenciosamente impondría una lectura teológica ajena.
- issue: «Él es la Totalidad»
  choice: Conservar la identificación directa.
  alternative: Parafrasear «él contiene la totalidad» o «es plenitud».
  rationale: La identificación es explícita y debe mantenerse aunque su relación con «la Totalidad» y «las Totalidades» permanezca compleja.
- issue: Apofatismo y uso de nombres
  choice: Mantener tanto la inaplicabilidad de los nombres como su uso legítimo para gloria y honra.
  alternative: Resolver la tensión diciendo que los nombres son analógicos, simbólicos o meramente humanos.
  rationale: El texto yuxtapone ambas afirmaciones sin ofrecer esa explicación sistemática; la traducción conserva la tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el tono especulativo y litúrgico del tratado, con sintaxis aligerada donde es posible sin borrar repeticiones argumentales. Los corchetes [] y los ángulos <> reproducen las señales de daño y restauración del testimonio suministrado. Dado que la revisión directa del copto está pendiente, el borrador es necesariamente provisional y se apoya de manera transparente en el testimonio inglés público y en la capa inglesa auditada.
