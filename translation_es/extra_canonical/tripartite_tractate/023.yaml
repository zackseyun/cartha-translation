lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Conserva el título soteriológico recurrente y su función técnica en el tratado.
- source_word: Word
  choice: Verbo
  rationale: Distingue el referente personal o cosmológico del tratado de la «palabra prometida» posterior; mantiene la terminología tradicional sin resolver su identidad doctrinal.
- source_word: unbegotten
  choice: no engendrado
  rationale: Reproduce la distinción ontológica del texto sin sustituirla por una explicación confesional.
- source_word: impassible
  choice: incapaz de sufrir
  rationale: Expresa en lenguaje moderno el sentido literal de impasibilidad y conserva la tensión con la afirmación previa de que sufriría.
- source_word: grasped / ungraspable
  choice: alcanzado / inalcanzable
  rationale: Mantiene el contraste verbal del pasaje y permite un sentido tanto cognitivo como relacional sin reducirlo a comprensión intelectual.
- source_word: favor
  choice: favor
  rationale: Conserva la amplitud del término y evita identificarlo necesariamente con una doctrina técnica de la gracia.
theological_decisions:
- issue: Preexistencia, nacimiento y sufrimiento del Salvador
  choice: Conservar juntas las afirmaciones de nacimiento, sufrimiento, preexistencia, eternidad, no generación e incapacidad de sufrir.
  alternative: Armonizarlas mediante una distinción explícita entre naturaleza divina y carne.
  rationale: El pasaje contiene deliberadamente esa tensión, y el traductor no debe introducir una solución cristológica ausente del testimonio.
- issue: Identidad del progenitor carnal
  choice: Traducir de manera indefinida «Aquel de quien el Salvador recibió su carne».
  alternative: Identificarlo expresamente como padre humano, madre o entidad espiritual.
  rationale: El testimonio suministrado no identifica al referente y su ambigüedad debe conservarse.
- issue: Referente final de «pudiera ser visto, conocido y alcanzado»
  choice: Mantener el pronombre implícito singular sin añadir un nombre.
  alternative: Explicitar que se refiere al Padre o al Salvador.
  rationale: La sintaxis permite incertidumbre referencial; explicitarla resolvería una ambigüedad teológica que el texto no resuelve con claridad.
- issue: El Verbo espiritual como causa
  choice: Mantener «causa de las cosas que han llegado a existir».
  alternative: Reformularlo como Creador de todas las cosas.
  rationale: «Creador» añadiría una identificación doctrinal más definida que la formulación causal del testimonio.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva la repetición propia del discurso teológico y se usan «él/esta» cuando ayudan a distinguir al Salvador de su venida. Los corchetes, los ángulos y la elipsis preservan las señales editoriales del testimonio. Borrador necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto sigue pendiente.'
