base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: es
  text: 'Los profetas, sin embargo, no hablaron por voluntad propia, sino que cada uno habló de lo que vio y oyó acerca de la proclamación del Salvador. Lo que él proclamó —y el tema central de la proclamación de ellos— fue lo que cada uno dijo acerca de la venida del Salvador: que esta llegaría. A veces los profetas hablan de ella como si él aún estuviera por nacer; otras veces, como si el Salvador hablara por boca de ellos, diciendo que el Salvador llegará y concederá su favor a quienes no lo conocían. Por eso, no todos dijeron todo de la misma manera. Más bien, mediante el poder que se le dio a cada uno para hablar acerca de él y del lugar que vio, cada cual pensó que el Salvador nacería de aquel lugar y que de allí vendría. Por consiguiente, ninguno de ellos sabía de dónde vendría ni quién lo engendraría. Solo fueron considerados dignos de hablar de esto: que nacería y sufriría. En cuanto a su preexistencia y su existencia eterna como no engendrado e incapaz de sufrir, <…> no del Verbo,
    que llegó a existir en carne, [a] jamás se les ocurrió.


    Este es el mensaje que fueron inspirados a comunicar acerca de la carne de él que aparecería. Se dice que su nacimiento fue como el de todos ellos, pero que, por encima de todo, procedía del Verbo espiritual, causa de las cosas que han llegado a existir. Aquel de quien el Salvador recibió su carne ciertamente lo engendró en forma de semilla, cuando se reveló la luz, de acuerdo con la palabra prometida acerca de su revelación, <siendo> en verdad el estado de <una> semilla de <lo que era>, aunque fue engendrado al final. Sin embargo, aquel por medio de quien el Padre dispuso manifestar la salvación, el cual es el cumplimiento de la promesa, cuando descendió a la vida recibió todos los medios necesarios para su descenso. Su Padre es uno solo, el único que es verdaderamente padre para él: el invisible, el incognoscible, inalcanzable por naturaleza, el único que es Dios y que, por su voluntad y por su don, ha concedido que pudiera ser visto, conocido y alcanzado.


    [a] Los signos <…> y [ ] reflejan una laguna o texto dañado en el testimonio disponible; por eso, la relación sintáctica de «no del Verbo» con lo anterior permanece incierta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los signos <…> y [ ] reflejan una laguna o texto dañado en el testimonio disponible; por eso, la relación sintáctica de «no del Verbo» con lo anterior permanece incierta.
