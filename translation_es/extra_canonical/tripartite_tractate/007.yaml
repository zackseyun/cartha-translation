lexical_decisions:
- source_word: Totalities
  choice: las Totalidades
  rationale: Se conserva como término técnico, con mayúscula, en vez de normalizarlo como «la totalidad» o «todas las cosas».
- source_word: mixing with them
  choice: su unión con ellos
  rationale: «Unión» comunica la participación íntima del pasaje en español natural sin imponer una explicación ontológica; la imagen de mezcla reaparece al final con una formulación igualmente relacional.
- source_word: the human from the Father
  choice: el ser humano procedente del Padre
  rationale: Se conserva el referente humano y la procedencia, evitando convertirlo interpretativamente en un título cristológico tradicional.
- source_word: unspeakable word
  choice: la palabra indecible
  rationale: Mantiene la paradoja entre palabra y aquello que no puede expresarse, con lenguaje digno y comprensible.
- source_word: providence
  choice: la providencia
  rationale: Conserva el sustantivo teológico-filosófico del testimonio; la frase siguiente mantiene su relación verbal mediante «guía providencialmente».
- source_word: subsist
  choice: subsisten
  rationale: Se retiene el vocabulario ontológico técnico del texto, en lugar de reducirlo a «existen».
- source_word: single one
  choice: el único
  rationale: Expresa la singularidad personal o unitaria sin identificarla automáticamente con una formulación doctrinal posterior.
- source_word: self-knowledge
  choice: conocimiento de sí mismo
  rationale: Refleja la reflexividad del original mediado por el testimonio inglés y evita el matiz moderno de «autoconocimiento» psicológico.
theological_decisions:
- issue: Relación entre el Hijo, el Padre y las Totalidades
  choice: Se conservaron literalmente las afirmaciones «es el Hijo», «existe como Padre» y «es las Totalidades».
  alternative: Armonizarlas mediante explicaciones trinitarias, modales o emanacionistas.
  rationale: El pasaje mantiene una tensión metafísica propia; la traducción no debe resolverla según una doctrina externa.
- issue: «El primero que llegó a existir» frente a la preexistencia
  choice: Se mantuvieron ambas formulaciones sin conciliarlas.
  alternative: Traducir «se manifestó» o reformular la preexistencia para eliminar la aparente tensión.
  rationale: La evidencia suministrada distingue expresiones difíciles que deben permanecer abiertas a interpretación.
- issue: «the human from the Father»
  choice: «el ser humano procedente del Padre»
  alternative: «el Hombre del Padre», «el Hijo del Hombre» o «el hombre celestial».
  rationale: Las alternativas introducen títulos o marcos doctrinales no explícitos en el testimonio.
- issue: «the god of those who are»
  choice: «el dios de los que existen»
  alternative: Capitalizar «Dios» o explicarlo como deidad subordinada.
  rationale: La minúscula sigue la función descriptiva de la lista y evita decidir una jerarquía teológica que el fragmento no explicita.
- issue: Unidad y pluralidad
  choice: Se preservó la formulación paradójica «ellas son por igual el único y las Totalidades».
  alternative: Suavizarla como «forman una sola totalidad».
  rationale: La paráfrasis alternativa eliminaría la tensión entre identidad unitaria y multiplicidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,5. Los corchetes y las elipsis preservan lagunas o restauraciones, y los signos angulares conservan suplementos editoriales. Se evitó la fluidez excesiva cuando habría borrado repeticiones, paradojas o relaciones técnicas del pasaje.
