translation:
  language: es
  text: 'Este es quien les fue dado para satisfacción, alimento y alegría, y como riqueza de iluminación, la cual abarca su labor conjunta, su conocimiento y su unión con ellos. Este es, en efecto, quien es llamado Hijo y quien es el Hijo, porque él es las Totalidades; y ellos saben quién es y que los cubre con vestiduras. Este es el llamado «Hijo», aquel cuya existencia comprenden y a quien buscaban. Este es quien existe como Padre, aquel de quien no pueden hablar y a quien no logran captar. Este es el primero que llegó a existir. Nadie puede captarlo ni comprenderlo. ¿O acaso puede alguien acercarse al Exaltado, a aquel que, hablando con propiedad, preexiste? Sin embargo, todos los nombres pensados [a] o pronunciados acerca de él se emplean para honrarlo, como una alusión a él, según la capacidad de cada uno para glorificarlo.


    Aquel que surgió de él cuando este se extendió para engendrar y producir conocimiento para las Totalidades, él […] todo nombre sin falsedad y, hablando con propiedad, es el único primero, el ser humano procedente del Padre, aquel a quien yo [llamo]:


    la forma sin forma,


    el cuerpo sin cuerpo,


    el rostro invisible,


    la palabra indecible,


    la mente inaprensible,


    la fuente que fluye de él,


    la raíz de los plantados


    y el dios de los que existen;


    la luz de aquellos a quienes ilumina,


    el amor de aquellos a quienes ama,


    la providencia de aquellos a quienes guía providencialmente,


    la sabiduría de aquellos a quienes hizo sabios,


    el poder de aquellos a quienes dio poder,


    la asamblea <de> aquellos a quienes reúne consigo,


    la revelación de las cosas buscadas,


    el ojo de quienes ven,


    el aliento de quienes respiran,


    la vida de quienes viven,


    la unidad de quienes están unidos con las Totalidades.


    Todas estas cosas subsisten en el único, pues él se reviste por completo de ellas y, sin embargo, nunca es llamado por su único nombre. Y de este modo singular, ellas son por igual el único y las Totalidades. Él no puede separarse como un cuerpo, ni queda dividido por los nombres que ha recibido, como si fuera una cosa de un modo y [b] algo [diferente] de otro modo. Tampoco cambia en […], ni se transforma en los nombres que concibe, llegando a ser ahora esto y luego aquello, siendo una cosa ahora y convirtiéndose en algo distinto en otro momento. Al contrario, permanece enteramente él mismo hasta el final. [Él es], simultánea y eternamente, todas las Totalidades sin excepción. Él es quien las abarca a todas. Presentó al Padre ante las Totalidades. Es más, él es las Totalidades, porque es su propio conocimiento de sí mismo y es toda cualidad y todo poder. Y [él] mismo [es] el ojo mediante el cual posee conocimiento, al contemplarse plenamente dentro de sí mismo y al poseer un Hijo y una
    forma.


    Por tanto, sus poderes y cualidades son incontables e inauditos, debido al modo <en que> los engendra. Incontables e inseparables son aquellos a quienes engendran sus palabras, y también lo son sus enseñanzas y sus Totalidades. Él los conoce: ellos son lo que él mismo es, porque subsisten en el único nombre y todos hablan por medio de él. Y él los hace surgir para que descubran que existen, conforme a sus cualidades individuales, de un modo unificado.'
