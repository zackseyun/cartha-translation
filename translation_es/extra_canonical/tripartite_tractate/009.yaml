base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: es
  text: 'Todo el conjunto de los eones posee amor y anhelo por descubrir al Padre de manera perfecta y completa, y en esto consiste su unidad sin restricciones. Aunque el Padre se revela eternamente, no quiso que ellos lo conocieran de manera automática; más bien, permite que lleguen a comprenderlo mediante la búsqueda, mientras reserva para sí su esencia primordial, que no puede ser investigada. El Padre concedió a los eones deseos fundamentales, porque estos constituyen etapas en el camino que conduce hacia él, como una escuela que forma la conducta. Les ha dado:


    fe en él y oración al que no ven,


    una esperanza firme en aquel a quien no pueden comprender,


    un amor fecundo que dirige la mirada hacia lo que no ve,


    una comprensión digna de la mente eterna,


    la bendición de la riqueza y la libertad,


    y una comprensión que anhela glorificar al Padre por <su> pensamiento.[a]


    [...][b] Por su voluntad, el Padre exaltado es conocido mediante el Espíritu que respira dentro de las Totalidades. Incluso les comunica la idea de buscar al desconocido, como cuando un aroma agradable impulsa a alguien a buscar de dónde procede, pues el aroma del Padre supera los aromas naturales. Su dulzura causa en los eones un placer indescriptible y despierta en ellos el deseo de unirse a él, quien quiere que lo conozcan de manera unificada, y de ayudarse unos a otros en el Espíritu plantado dentro de ellos. Aunque un gran peso los oprime, son renovados de una manera indescriptible, porque no pueden ser separados de aquello en lo que han sido colocados de un modo que no pueden comprender. No hablarán, sino que guardarán silencio acerca de la gloria del Padre, acerca de aquel que puede hablar; sin embargo, de él recibirán una forma.


    Aunque las palabras no pueden describirlo, él se reveló [a sí mismo].[c] Ellos lo poseen <a él>, oculto dentro de un pensamiento.[d] Por eso los eones guardan silencio acerca de cómo el Padre existe en su forma, su esencia y su grandeza. [...][e] Sin embargo, los eones son considerados dignos de saber, mediante su Espíritu, que él no puede ser nombrado ni comprendido. Por medio de su espíritu —la huella de la búsqueda de él— les da la capacidad de comprenderlo y hablar de él. Cada eón es un nombre, <es decir>, cada uno es una cualidad y un poder del Padre, porque él existe en muchos nombres, los cuales están entrelazados y en armonía unos con otros. Se puede hablar de él gracias a la riqueza del lenguaje. Del mismo modo, aunque el Padre es un solo nombre por razón de su unidad, posee innumerables cualidades y nombres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los signos angulares indican palabras suplidas o inciertas en el testimonio utilizado; aquí, «su».
    reason: Preservar la señal textual transmitida y advertir al lector que el pronombre no tiene la misma seguridad que el resto de la frase.
  - marker: b
    text: En este punto el testimonio señala una laguna o porción ilegible del manuscrito.
    reason: Representar en el texto español el corchete vacío del testimonio de base sin simular continuidad segura.
  - marker: c
    text: «A sí mismo» es una restauración indicada por corchetes en el testimonio.
    reason: Mantener visible la reconstrucción editorial de una parte dañada o ausente.
  - marker: d
    text: Los signos angulares indican que «a él» ha sido suplido en el testimonio.
    reason: Conservar la incertidumbre textual asociada con el objeto de «poseen».
  - marker: e
    text: En este punto el testimonio señala otra laguna o porción ilegible del manuscrito.
    reason: Evitar ocultar una discontinuidad material que puede afectar la relación entre las cláusulas.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico de la cosmología del tratado, ya asentado en español, sin reducirlo a «edades» ni reinterpretarlo como seres de una categoría doctrinal posterior.
- source_word: whole system
  choice: todo el conjunto
  rationale: Expresa una totalidad organizada en español natural sin imponer el matiz moderno y técnico de «sistema».
- source_word: unrestrained unity
  choice: unidad sin restricciones
  rationale: Mantiene el sentido inusual y la posible tensión conceptual del testimonio en vez de explicarlo como unanimidad o libertad.
- source_word: grasped
  choice: lleguen a comprenderlo / comprender
  rationale: «Comprender» comunica la aprehensión intelectual o espiritual; la variación sintáctica evita un giro forzado sin eliminar la repetición conceptual.
- source_word: unsearchable primal essence
  choice: esencia primordial, que no puede ser investigada
  rationale: Conserva tanto la anterioridad de la esencia como su inaccesibilidad a la búsqueda; no la convierte simplemente en «incomprensible».
- source_word: places on the path
  choice: etapas en el camino
  rationale: Produce una imagen inteligible en español, aunque el testimonio inglés literalmente dice «lugares»; «etapas» recoge su función formativa dentro del recorrido.
- source_word: Totalities
  choice: Totalidades
  rationale: Se conserva como término técnico con mayúscula, pues puede designar realidades colectivas específicas y no solo «todas las cosas».
- source_word: mixing with him
  choice: unirse a él
  rationale: Comunica la aspiración a una unión participativa en español natural, sin sugerir una mezcla material; no se emplea «fundirse» para evitar resolver la naturaleza de esa unión.
- source_word: form
  choice: forma
  rationale: Mantiene el término metafísico abierto, sin sustituirlo por «naturaleza», «identidad» o «imagen».
- source_word: trace
  choice: huella
  rationale: Conserva la imagen de una señal o vestigio de la búsqueda, sin explicarla como simple impulso.
- source_word: riches of speech
  choice: riqueza del lenguaje
  rationale: Expresa la abundancia de posibilidades para nombrar y hablar sin limitar «speech» al acto oral.
theological_decisions:
- issue: Revelación eterna del Padre y conocimiento no automático
  choice: 'Se mantienen juntas ambas afirmaciones: el Padre se revela eternamente, pero quiere ser comprendido mediante la búsqueda.'
  alternative: Explicar que la revelación es parcial o que el Padre oculta deliberadamente todo conocimiento.
  rationale: El pasaje sostiene una tensión entre revelación, búsqueda y reserva de la esencia primordial; la traducción no debe armonizarla.
- issue: Conocimiento de quien no puede ser nombrado ni comprendido
  choice: Se afirma que los eones saben por el Espíritu que el Padre no puede ser nombrado ni comprendido, y que aun así reciben capacidad para comprenderlo y hablar de él.
  alternative: Distinguir explícitamente entre esencia incognoscible y atributos cognoscibles.
  rationale: Aunque esa distinción podría explicar el texto, no está formulada de manera explícita en el testimonio y resolvería su paradoja.
- issue: El Espíritu y «su espíritu»
  choice: Se conserva «Espíritu» con mayúscula cuando el testimonio lo presenta así y «su espíritu» con minúscula en la frase posterior.
  alternative: Uniformar todas las apariciones como una referencia al Espíritu personal.
  rationale: La variación preserva la ambigüedad del testimonio acerca de si ambas expresiones tienen exactamente el mismo referente o función.
- issue: Los eones como nombres, cualidades y poderes del Padre
  choice: Se conserva la formulación predicativa sin convertir a los eones en meros atributos ni en personas completamente independientes.
  alternative: Explicar que son hipóstasis, emanaciones o atributos personificados.
  rationale: Tales categorías podrían pertenecer a sistemas interpretativos, pero el fragmento permite una relación más ambigua entre nombre, cualidad, poder y eón.
- issue: Unidad con el Padre
  choice: «unirse a él»
  alternative: «mezclarse con él» o «fundirse con él»
  rationale: «Unirse» conserva la orientación hacia la comunión sin imponer una mezcla de esencias; la nota léxica reconoce el sentido más literal del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron términos técnicos indispensables como «eones» y «Totalidades», pero se evitó una prosa innecesariamente arcaica. La sintaxis se hizo legible sin eliminar las repeticiones, paradojas y transiciones difíciles del fragmento. Dado que la revisión directa del copto está pendiente y la base disponible es un testimonio inglés de dominio público, las decisiones más sensibles permanecen deliberadamente cautelosas y las señales editoriales se conservan mediante notas.
