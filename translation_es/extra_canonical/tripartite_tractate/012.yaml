translation:
  language: es
  text: 'Sin embargo, él fue <auxiliador> y redentor que los libró de su manera de pensar y de su rebelión, porque de él [proviene] la conversión llamada «arrepentimiento».[a] Esto sucedió [cuando] la Palabra [cambió] su parecer y su pensamiento. Apartándose del mal, se volvió hacia lo bueno. Después de la conversión, recordó a los que existen y la oración por aquel que se convirtió a sí mismo mediante el bien.[b] Primero oró al que habita en la Plenitud y lo recordó; después recordó a sus hermanos, a cada uno por separado y, al mismo tiempo, a todos juntos; pero antes que a todos ellos, al Padre.


    […] La oración en común lo ayudó en [su] propio retorno <a> sí mismo y a la Totalidad, porque llegó a recordar a los que habían existido desde el principio debido a que él mismo había sido recordado. Este era el pensamiento distante que llama desde lejos y lo hace regresar.[c]


    Toda su oración y su acto de recordar comprendían varias potencias que concordaban con el límite antes mencionado, pues nada de lo que hay en su pensamiento es estéril. Las potencias eran buenas y superiores a las de la semejanza, porque las de la semejanza también pertenecen a una naturaleza [oscura].[d] Aquello en lo que se convirtieron tuvo su origen en una ilusión de semejanza y en un [pensamiento vano] de orgullo; también se originaron en [un pensamiento] que las conoció primero. ¿A qué se parecen los primeros seres? Son como el <olvido> y el sueño profundo. Se parecen a quienes tienen sueños inquietantes, a quienes, mientras sueñan, <alguien> persigue y atormenta. Para él, los otros se parecen a seres iluminados que aguardan la salida del sol, porque contemplaron en él sueños que en verdad son dulces.[e]


    De inmediato […] las emanaciones del pensamiento <cesaron>; ya no tenían sustancia ni honor, [pues] <ellas> no son iguales a los seres preexistentes. Si eran superiores [a] las semejanzas, la única razón por la que fueron elevadas por encima de ellas era que actuaban con buena intención, pues no se habían originado en la debilidad que llegó a existir. Esa buena intención era <la de aquel que> buscó al Preexistente después de orar y elevarse hacia el bien.[f] Él sembró en ellas la inclinación a buscar y a orar al glorioso Preexistente. También sembró en ellas la capacidad de pensar en [él] y de comprender que había algo mayor que ellas mismas, algo que existía antes que ellas, aunque no sabían qué era. Al engendrar armonía y amor mutuo, a partir de aquel pensamiento actuaron con unidad y unanimidad, ya que de la unidad y la unanimidad habían recibido su existencia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La traducción distingue «conversión» de «arrepentimiento», tal como lo hace el testimonio. Los corchetes dentro del texto señalan palabras suplidas o reconstruidas, y los signos < > señalan restituciones editoriales del testimonio consultado.
    reason: Explicar la terminología principal y diferenciar las señales textuales de los marcadores de nota.
  - marker: b
    text: La sintaxis de «recordó… la oración por aquel que se convirtió a sí mismo» es incierta. También podría entenderse que recordó a los que existen y luego oró en favor del convertido.
    reason: Preservar una ambigüedad sintáctica y referencial del testimonio inglés, pendiente de revisión directa del copto.
  - marker: c
    text: No se identifica quién lo había recordado. «El pensamiento distante» también puede entenderse como un pensamiento que llama desde lejos.
    reason: Evitar añadir un agente teológico y señalar una construcción metafórica abierta.
  - marker: d
    text: «Límite», «potencias» y «semejanza» parecen funcionar como términos técnicos. Se traducen de manera uniforme sin definir aquí su lugar exacto en la cosmología del tratado.
    reason: Mantener la terminología sin imponer una reconstrucción doctrinal.
  - marker: e
    text: La distinción entre «los primeros seres» y «los otros» no es completamente clara en el testimonio disponible; por eso se conservan las referencias generales.
    reason: Advertir sobre antecedentes pronominales inciertos.
  - marker: f
    text: El pasaje que comienza «De inmediato» contiene una laguna y varias restituciones. La relación entre las emanaciones, las semejanzas, la debilidad y la buena intención sigue siendo sintácticamente difícil.
    reason: Hacer visible el estado fragmentario del texto y evitar presentar una lectura incierta como segura.
lexical_decisions:
- source_word: conversion called “repentance”
  choice: la conversión llamada «arrepentimiento»
  rationale: Conserva juntos los dos conceptos del testimonio, sin reducir la conversión a mero remordimiento ni borrar el nombre técnico «arrepentimiento».
- source_word: the Word
  choice: la Palabra
  rationale: Mantiene la personificación y el valor técnico del término, con mayúscula para señalar que designa una entidad.
- source_word: Fullness
  choice: la Plenitud
  rationale: Equivalente tradicional y comprensible para el concepto técnico del tratado; la mayúscula evita tomarlo como una simple cualidad.
- source_word: Totality
  choice: la Totalidad
  rationale: Distingue este referente conceptual de una expresión ordinaria como «todo», sin identificarlo automáticamente con la Plenitud.
- source_word: powers
  choice: potencias
  rationale: «Potencias» conserva la posibilidad de seres o realidades activas; «poderes» podría sugerir solo capacidades abstractas.
- source_word: likeness
  choice: semejanza
  rationale: Traducción formal que preserva la terminología repetida y su contraste con las potencias, sin explicar de más su referente incierto.
- source_word: pre-existent
  choice: el Preexistente
  rationale: El sustantivo con mayúscula refleja que el pasaje parece usarlo como designación de una realidad personal o suprema.
- source_word: unity and unanimity
  choice: unidad y unanimidad
  rationale: Retiene la pareja conceptual y la repetición causal del original, importante para el argumento sobre el origen de estos seres.
theological_decisions:
- issue: Relación entre conversión y arrepentimiento
  choice: 'Se preservan ambos términos: «la conversión llamada “arrepentimiento”».'
  alternative: Traducir ambos con una sola palabra, «arrepentimiento».
  rationale: El testimonio distingue la acción de volverse o convertirse de su denominación; unificarlas eliminaría una tensión conceptual genuina.
- issue: Identidad de la Palabra
  choice: Se traduce «la Palabra» sin identificarla explícitamente con Cristo ni con otra figura.
  alternative: Usar «el Logos» o añadir una identificación cristológica.
  rationale: El pasaje personifica a la Palabra, pero no justifica aquí una identificación interpretativa más específica.
- issue: Plenitud y Totalidad
  choice: Se mantienen como términos distintos y con mayúscula.
  alternative: Uniformarlos como «Plenitud» o «universo».
  rationale: El testimonio emplea expresiones diferentes; fusionarlas resolvería indebidamente su posible relación teológica.
- issue: Voz pasiva «había sido recordado»
  choice: Se conserva la pasiva sin identificar al agente.
  alternative: Explicitar que el Padre o los seres preexistentes lo recordaron.
  rationale: El agente no aparece en el testimonio suministrado, y nombrarlo introduciría una conclusión doctrinal no expresada.
- issue: Referente de «los primeros seres» y «los otros»
  choice: Se conserva el contraste con referentes parcialmente abiertos.
  alternative: Identificarlos expresamente como seres malos y seres buenos.
  rationale: El pasaje ofrece imágenes y comparaciones, pero su sintaxis no permite fijar todos los referentes con plena certeza.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplean «oró», «recordó», «se volvió» y «buena intención» para lograr claridad sin rebajar el registro. Se conservan mayúsculas en Palabra, Plenitud, Totalidad y Preexistente por su función técnica. La redacción es necesariamente provisional: se basa en el testimonio inglés de dominio público suministrado, ya que la revisión directa del manuscrito copto está pendiente. Las lagunas aparecen como […] y las restituciones editoriales entre < >; las palabras reconstruidas que ya figuraban entre corchetes en el testimonio se conservan entre corchetes.'
