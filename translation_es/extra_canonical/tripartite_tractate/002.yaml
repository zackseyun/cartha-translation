translation:
  language: es
  text: 'Si, entonces, él es incomprensible, por consiguiente no puede ser conocido; ningún pensamiento puede captarlo, es invisible para todo, ninguna palabra puede expresarlo y ninguna mano puede tocarlo. Solo él se conoce a sí mismo tal como él [] es, y conoce su forma, su grandeza y su medida tal como son. Y puesto que puede concebirse, verse, nombrarse y comprenderse a sí mismo, él es el único cuya mente, cuyo ojo, cuya boca y cuya forma equivalen a su propio ser. Así, él es lo que concibe, lo que ve, lo que dice y lo que comprende: es inconcebible, inexpresable, inaprensible e inmutable. En cambio, aquello que él concibe, ve y expresa, aquello que ha pensado, es sustento, gozo, verdad, agrado y reposo. Él supera toda sabiduría y está por encima de toda mente, toda gloria, toda belleza, toda dulzura, toda grandeza, toda profundidad y toda altura.


    El que es incognoscible por naturaleza y posee todos los grandes atributos que he mencionado puede, si desde la riqueza de su dulzura quiere conceder el conocimiento por el cual se lo conozca, hacerlo. Su poder para hacerlo es su voluntad. Sin embargo, el Grande se contiene en silencio, él que hace que las Totalidades[a] surjan a su existencia eterna.


    [] Hablando con propiedad, él se engendra a sí mismo de un modo inexpresable, porque solo él es autoengendrado, porque fue concebido a partir de sí mismo y porque se conoce tal como es. De su grandeza infinita, de su sabiduría inescrutable, de su poder inconmensurable y de su dulzura que supera todo sabor, hace cuanto es digno de su respeto, gloria, honor y alabanza. Se proyecta a sí mismo a modo de generación y recibe gloria y alabanza, honor y amor; él mismo se glorifica y se alaba, y se da honor y amor. De este modo tiene un Hijo que subsiste en él; guarda silencio acerca de él: es inexpresable en el Inexpresable, invisible en el Invisible, inaprensible en el Inaprensible e incomprensible en el Incomprensible.


    De este modo, el Hijo existe en el Padre para siempre. Como explicamos anteriormente, el Padre se conoce a sí mismo en sí mismo de un modo no engendrado: él se engendró a sí mismo mediante el pensamiento, el pensamiento acerca de él, que es la percepción [] de sí mismo, el [...] de su naturaleza eterna. Sin embargo, hablando con propiedad, eso es el silencio, la sabiduría y el don, si es correcto llamarlo así. Así como el Padre existe, hablando con propiedad —antes de él no [existió nadie más] y aparte de [él] no hay otro que sea no engendrado—, así también [el Hijo] existe, hablando con propiedad: antes de él no existió nadie más y después de él no existirá ningún otro hijo. Por tanto, él es Primogénito e Hijo único. Es el Primogénito porque nadie existe antes de él, y es Hijo único porque nadie vendrá después de él. Además, tiene su fruto, el cual no puede conocerse debido a su grandeza trascendente. Sin embargo, por la riqueza de su dulzura quiso que su fruto fuera conocido. Entonces
    reveló un poder inexplicable y lo mezcló con la gran riqueza de su generosidad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Las Totalidades» traduce un término técnico del tratado que designa colectivamente el conjunto de realidades procedentes del principio supremo. Se conserva la mayúscula para señalar este uso especial.
    reason: El término puede sonar inusual en español y no debe confundirse con una simple referencia a «todas las cosas».
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: incomprensible / inaprensible
  rationale: Se conserva la distinción conceptual del testimonio entre aquello que no puede comprenderse y aquello que no puede captarse o asirse mentalmente.
- source_word: unspeakable
  choice: inexpresable
  rationale: En este contexto indica lo que no puede ponerse en palabras; «inexpresable» resulta natural y mantiene la reiteración retórica.
- source_word: scale
  choice: medida
  rationale: «Medida» expresa extensión o magnitud sin imponer una interpretación más específica que la evidencia disponible.
- source_word: sustenance, joyful, true, pleasing, and restful
  choice: sustento, gozo, verdad, agrado y reposo
  rationale: Se reproduce la serie nominal/adjetival de manera digna y comprensible, sin forzar una sintaxis uniforme donde el testimonio es áspero.
- source_word: the Totalities
  choice: las Totalidades
  rationale: Se retiene como término técnico distintivo del tratado y se explica mediante nota.
- source_word: self-begotten
  choice: autoengendrado
  rationale: Mantiene la afirmación técnica y paradójica del texto sin sustituirla por terminología doctrinal posterior.
- source_word: projects himself
  choice: se proyecta a sí mismo
  rationale: Se conserva el lenguaje emanativo del testimonio, evitando explicarlo o normalizarlo teológicamente.
- source_word: subsisting in him
  choice: que subsiste en él
  rationale: «Subsiste» preserva el matiz ontológico y la relación interna afirmada por el texto.
- source_word: Firstborn and only Son
  choice: Primogénito e Hijo único
  rationale: La elección conserva ambos títulos y la explicación particular que el propio pasaje ofrece.
- source_word: fruit
  choice: fruto
  rationale: Se mantiene la metáfora y su referente ambiguo, sin identificarlo editorialmente.
theological_decisions:
- issue: La autoengendración del Padre y la generación del Hijo
  choice: Conservar literalmente ambas formulaciones paradójicas
  alternative: Armonizarlas con categorías trinitarias posteriores o reformular «autoengendrado»
  rationale: El tratado presenta su propia tensión metafísica; resolverla introduciría una doctrina externa y borraría la voz del documento.
- issue: Relación eterna del Hijo con el Padre
  choice: «el Hijo existe en el Padre para siempre»
  alternative: Explicitar una coigualdad, subordinación o procesión definida
  rationale: La traducción refleja la afirmación relacional y temporal del testimonio sin añadir una clasificación confesional.
- issue: Sentido de «Primogénito» e «Hijo único»
  choice: 'Mantener los títulos y la explicación interna: nadie antes y nadie después'
  alternative: Importar sentidos técnicos derivados de textos canónicos o credos
  rationale: El propio tratado define aquí los términos; esa definición debe gobernar la traducción.
- issue: Referente de «su fruto»
  choice: Preservar el posesivo y la ambigüedad
  alternative: Identificar el fruto con una entidad o emanación concreta
  rationale: El fragmento suministrado no permite fijar con seguridad el referente.
- issue: Género gramatical de la figura suprema
  choice: Usar «él» y títulos masculinos conforme al testimonio
  alternative: Neutralizar sistemáticamente el género
  rationale: La referencia al Padre y la cadena pronominal forman parte de la presentación literaria del documento.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los corchetes y puntos suspensivos del testimonio para indicar lagunas o restauraciones editoriales; no se reconstruye el texto perdido. La redacción sigue provisionalmente el testimonio inglés de dominio público porque la revisión directa del copto está pendiente. Se mantienen las repeticiones, paradojas y términos metafísicos característicos, con ajustes sintácticos moderados para lograr claridad oral y lectura natural.
