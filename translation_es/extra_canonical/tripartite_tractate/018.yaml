    La Palabra se estableció primero cuando ordenó las Totalidades, como principio fundamental, causa y gobernante de las cosas que llegaron a existir, del mismo modo que el Padre, causa del establecimiento, fue el primero en existir después de él. Creó las imágenes preexistentes, que produjo con acción de gracias y glorificación.


