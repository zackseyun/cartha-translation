  footnotes:
  - marker: a
    text: El testimonio presenta aquí una laguna en el manuscrito; falta una porción indeterminada del texto.
    reason: Señalar una pérdida textual que afecta la sintaxis inicial.
  - marker: b
    text: La preposición «de» ha sido suplida por los editores para completar el sentido del texto dañado o incompleto.
    reason: Explicar los corchetes angulares conservados en el texto principal.
  - marker: c
    text: Hay una laguna en el testimonio después de «colmada»; no se sabe cuánto texto falta.
    reason: Advertir que la enumeración puede estar incompleta.
  - marker: d
    text: Las palabras entre paréntesis representan elementos reconstruidos o implícitos en el testimonio utilizado.
    reason: Distinguir la reconstrucción editorial de las lagunas manuscritas.
  - marker: e
    text: «La Palabra» aparece entre corchetes porque el sujeto fue suplido en el testimonio para aclarar la referencia.
    reason: Evitar presentar como plenamente conservado un sujeto reconstruido.
  - marker: f
    text: La frase entre corchetes angulares fue suplida editorialmente; su redacción exacta debe verificarse con el texto copto.
    reason: Preservar la incertidumbre textual en una oración cosmológica especialmente difícil.
lexical_decisions:
- source_word: the Word
  choice: la Palabra
  rationale: Conserva el título personificado y su género gramatical natural en español, sin identificarlo explícitamente con una figura no nombrada en este pasaje.
- source_word: the Totalities
  choice: las Totalidades
  rationale: Mantiene el término cosmológico colectivo y su mayúscula, evitando reducirlo a «todo» o «el universo».
- source_word: the Fullness
  choice: la Plenitud
  rationale: Reproduce el término técnico cosmológico y mantiene su distinción respecto de las Totalidades.
- source_word: adorned
  choice: ordenó
  rationale: En este contexto cosmológico expresa disponer, organizar y embellecer; «ordenó» resulta natural y conserva la idea estructuradora de la serie.
- source_word: beings of the memory
  choice: seres del recuerdo
  rationale: Traducción deliberadamente literal de una expresión técnica oscura; evita interpretarla como recuerdos, memorias o seres con memoria.
- source_word: aeons
  choice: eones
  rationale: Mantiene el tecnicismo cosmológico antiguo, comprensible en este tipo de literatura y distinto de una mera referencia a períodos cronológicos.
- source_word: conversion
  choice: conversión
  rationale: Conserva el sentido amplio de cambio o vuelta sin especificar arrepentimiento, retorno ni conversión religiosa mientras esté pendiente la revisión copta.
theological_decisions:
- issue: Identidad de «la Palabra»
  choice: Conservar el título «la Palabra» sin añadir una identificación explícita
  alternative: Traducir o glosar «el Logos» e identificarlo con Cristo
  rationale: El pasaje personifica a la Palabra, pero la traducción no debe introducir una identificación doctrinal más explícita que la del testimonio suministrado.
- issue: Relación expresada en «fue el primero en existir después de él»
  choice: Mantener el pronombre «él» y el orden relacional del testimonio
  alternative: Resolver el referente del pronombre nombrando al Padre o a la Palabra
  rationale: La sintaxis y los referentes son difíciles; resolverlos eliminaría una ambigüedad real antes de revisar el copto.
- issue: Separación entre la Plenitud y la Palabra
  choice: Traducir directamente «separa la Plenitud de la Palabra»
  alternative: Reformular para suavizar o explicar la separación
  rationale: La afirmación contiene una tensión cosmológica propia del tratado y no debe armonizarse con formulaciones teológicas externas.
- issue: «Iglesia» como realidad celeste y local
  choice: Conservar la mayúscula y la repetición de «Iglesia»
  alternative: Usar «asamblea» o distinguir entre iglesia terrenal y celestial
  rationale: La repetición parece deliberada y vincula las dos realidades sin explicar de manera denominacional su relación.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron las mayúsculas de los términos cosmológicos personificados o técnicos: Palabra, Totalidades, Plenitud e Iglesia. Se evitó modernizar en exceso las formulaciones deliberadamente abstractas del tratado. Los paréntesis, corchetes cuadrados y corchetes angulares reflejan señales textuales del testimonio inglés público; la revisión directa del copto sigue pendiente.'
