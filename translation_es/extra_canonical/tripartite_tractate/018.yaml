translation:
  language: es
  text: 'Es apropiado, [a] en vista de la oración que ofreció y de la conversión que resultó de ella, que algunos perecieran, otros sacaran provecho y otros, además, fueran puestos aparte. Primero preparó el castigo de los desobedientes, valiéndose de un poder procedente de aquel que había aparecido, de quien recibió autoridad sobre todas las cosas, a fin de quedar separado de él. Él es quien está abajo y permanece apartado del Exaltado, hasta que prepara exteriormente el plan de salvación para todas las cosas y da a cada una el lugar que le fue asignado.


    La Palabra se estableció primero cuando ordenó las Totalidades, como principio fundamental, causa y gobernante de las cosas que llegaron a existir, así como el Padre, causa del establecimiento, fue el primero en existir después de él. Creó las imágenes preexistentes, que produjo con acción de gracias y glorificación.


    Luego ordenó el lugar destinado a aquellos que había producido en gloria, el cual recibe los nombres de «Paraíso», «Deleite», «Gozo lleno de alimento» y «Gozo <de> los Preexistentes».[b] Este lugar conserva la imagen de todas las cosas buenas que habitan en la Plenitud.


    Después ordenó el reino como una ciudad llena de toda cosa agradable, es decir, de amor fraternal y de abundante generosidad, colmada [c] de espíritus santos y de los poderes fuertes que los gobiernan, a los cuales la Palabra produjo y estableció con poder.


    A continuación, (como parte del ordenamiento, estaba) el lugar de la Iglesia que se reúne en este lugar y posee la forma de la Iglesia que habita en los eones, para la glorificación del Padre.[d]


    Después de estas cosas, (ordenó) el lugar destinado a la fe y a la obediencia (que procede) de la esperanza. [La Palabra] recibió estas cosas cuando apareció la luz.[e]


    Luego (ordenó el lugar de) la inclinación a la oración y a la súplica. A esto le siguieron el perdón y la palabra acerca del que había de aparecer.


    Todo lugar espiritual subsiste en un poder espiritual. Estos lugares son distintos de los seres del recuerdo, porque su poder está fundado en una imagen, la cual separa la Plenitud de la Palabra. En cambio, el poder —que actúa en la profecía acerca del futuro— guía a los seres del recuerdo <que llegaron a existir por causa de> lo preexistente.[f] Así se evita que se mezclen con las cosas que alcanzan la existencia mediante una visión de las cosas que permanecen con él.'
