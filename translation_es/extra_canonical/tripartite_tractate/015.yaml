lexical_decisions:
- source_word: word
  choice: palabra
  rationale: Conserva el término conceptual del testimonio sin identificarlo explícitamente con el Logos ni imponer una interpretación teológica.
- source_word: beings of memory
  choice: seres del recuerdo
  rationale: Traducción formal que conserva la terminología técnica y su posible extrañeza; «memoria» también sería posible, pero «recuerdo» suena más natural en esta construcción.
- source_word: Little One
  choice: el Pequeño
  rationale: Se mantiene como designación titulada, con mayúscula, sin aclarar su referente incierto.
- source_word: Exalted One
  choice: el Excelso
  rationale: Expresa rango elevado y funciona naturalmente como título, sin añadir una identificación doctrinal.
- source_word: those of the likeness
  choice: los de la semejanza
  rationale: Mantiene la expresión de grupo y evita precisar una ontología que el testimonio no explica aquí.
- source_word: repose
  choice: reposo
  rationale: Conserva el posible valor técnico del término, en vez de reducirlo a alivio o descanso físico.
- source_word: plan of salvation
  choice: plan de salvación
  rationale: Reproduce de manera clara y no confesional el sentido soteriológico del testimonio.
- source_word: orders
  choice: órdenes
  rationale: Conserva la clasificación jerárquica del texto sin sustituirla por «grupos» o «rangos».
theological_decisions:
- issue: Identidad del sujeto reconstruido <he>
  choice: Conservar <él> donde el testimonio marca una restauración
  alternative: Identificarlo como «el Hijo» a partir del encabezado contextual
  rationale: El pasaje suministrado deja el pronombre restaurado y no explicita el nombre en estas frases; conservar la señal evita resolver la referencia.
- issue: Relación entre la revelación interior y quien sufre
  choice: Mantener la cadena pronominal y «comparte su sufrimiento»
  alternative: Explicitar qué figura comparte el sufrimiento de cuál otra
  rationale: La ambigüedad referencial forma parte del testimonio y puede tener importancia teológica.
- issue: Función de los seres asociados con la oscuridad
  choice: Traducir que también serían útiles en el plan de salvación
  alternative: Suavizarlo como permiso pasivo o excluirlos del propósito salvífico
  rationale: El texto atribuye una función dentro del plan aun cuando ellos la desconocen; debe preservarse esa tensión.
- issue: «Fueron considerados dignos» de gobernar la oscuridad
  choice: Conservar el lenguaje paradójico de dignidad
  alternative: Traducir «fueron destinados» o «condenados»
  rationale: No debe eliminarse la tensión entre valoración, dominio y asignación a la oscuridad.
