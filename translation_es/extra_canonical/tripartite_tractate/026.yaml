  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose slaves and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: es
  text: 'La Elección participa de la naturaleza y del cuerpo del Salvador. Es como una cámara nupcial por su unidad y su unión con él, pues fue ante todo por causa de ella por lo que vino Cristo. En cambio, el Llamamiento está destinado a quienes se alegran en la cámara nupcial y sienten gozo y felicidad por la unión del novio y la novia. De este modo, el lugar que obtendrá el Llamamiento es el eón de las imágenes, donde la Palabra todavía ha de unirse con la Plenitud. Por esta razón, el Humano de la Iglesia estaba gozoso y alegre, y espera en ella. Está compuesto de espíritu, alma y cuerpo, en correspondencia con aquel que trazó el plan de salvación.


    Dentro del Humano había un humano que era una unidad, porque era la Totalidad y era todos ellos. Poseía lo que procedía del [Padre], que [] los lugares podían recibir. Poseía también los miembros que mencionamos antes. Cuando se proclamó la redención, el Humano Perfecto obtuvo de inmediato el conocimiento de cómo regresar rápidamente a su unidad, al lugar del cual se había originado. Regresó con alegría al lugar del cual se había originado, al lugar del cual había salido.


    Sin embargo, sus miembros necesitaban un lugar de instrucción, como el que hay en los lugares preparados para proporcionarles las imágenes y los arquetipos a manera de espejo, hasta que todos los miembros del cuerpo de la Iglesia <sean unidos> en el mismo lugar y reciban al mismo tiempo la restauración, mediante la manifestación del cuerpo entero, <…> la restauración a la Plenitud.


    Esto posee una armonía y una unión primordiales y compartidas: la armonía que pertenece al Padre, hasta que las Totalidades alcancen un rostro semejante al suyo. Sin embargo, la restauración final <ocurrirá> después de que la Totalidad sea revelada en aquel que es el Hijo, quien es la redención —es decir, el camino hacia el Padre incomprensible, esto es, el regreso a lo preexistente—, y después de que las Totalidades se revelen en ese, de la manera debida, quien es el camino hacia aquel que es inasible, indecible, [] invisible e incomprensible, para que alcance la redención.


    Será una liberación no solo del dominio de los <de> la izquierda, ni solo una huida del poder de los de la derecha, de quienes creíamos ser esclavos e hijos, y de quienes nadie escapa sin que ellos vuelvan a atraparlo enseguida. La redención es también, más bien, un ascenso <a> los grados de la Plenitud y a quienes recibieron nombres y los comprendieron conforme a la capacidad de cada eón. Es también una entrada en lo que es silencioso, donde no hay necesidad de voz, conocimiento, conceptualización ni iluminación, sino donde todas las cosas son luz y todas resplandecen sin necesidad de iluminación.


    Tanto los ángeles como los seres humanos necesitan redención, al igual que la imagen, las Plenitudes de los eones y las potestades de resplandor maravilloso. Incluso el Hijo mismo, que es el modelo de la redención de la Totalidad, [necesitó] también redención, [] porque se hizo humano y se sometió a todo lo que nos es necesario en la carne, a nosotros, que somos su Iglesia. Cuando él fue el primero en alcanzar la redención por medio de la Palabra que había descendido sobre él, todos los demás alcanzaron de él la redención al acogerlo para sí. Esto se debe a que quienes recibieron al que ya había recibido, recibieron naturalmente lo que había en él.


    Entre los seres humanos carnales, la redención comenzó a [ser] concedida cuando su Primogénito, su Amor, el Hijo carnal, y los ángeles celestiales fueron considerados dignos de formar una comunión con él en la tierra. Por eso se le llama «la redención angélica del Padre», pues consuela a quienes se habían afligido a causa del conocimiento de la Totalidad, ya que él fue el primero en recibir este don, antes que cualquier otro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Election
  choice: Elección
  rationale: Se conserva como término técnico personificado y con mayúscula, distinguiéndolo del Llamamiento.
- source_word: Calling
  choice: Llamamiento
  rationale: Expresa una convocatoria o vocación y mantiene el paralelismo técnico con «Elección».
- source_word: aeon
  choice: eón
  rationale: Es el término técnico habitual en español para este concepto cosmológico; evita reducirlo meramente a una época temporal.
- source_word: Fullness
  choice: Plenitud
  rationale: Mantiene el sentido técnico del ámbito o totalidad pleromática y la mayúscula del testimonio.
- source_word: Totality / Totalities
  choice: Totalidad / Totalidades
  rationale: Conserva la distinción léxica respecto de «Plenitud» y evita identificar silenciosamente ambos conceptos.
- source_word: Human / Perfect Human
  choice: Humano / Humano Perfecto
  rationale: La sustantivación y las mayúsculas preservan su función de figura técnica, sin sustituirla por una interpretación como «hombre» o «humanidad».
- source_word: Word
  choice: Palabra
  rationale: Traducción transparente que conserva la personificación y evita imponer el préstamo «Logos» donde el testimonio dice «Word».
- source_word: restoration
  choice: restauración
  rationale: Recoge la idea de restitución o retorno sin especificar una doctrina posterior.
- source_word: conceptualization
  choice: conceptualización
  rationale: Conserva la secuencia epistemológica del pasaje, aunque el término sea abstracto, sin reducirlo a «pensamiento».
- source_word: powers
  choice: potestades
  rationale: En este contexto designa seres o poderes celestiales; «potestades» conserva ese matiz técnico mejor que «poderes».
theological_decisions:
- issue: La afirmación de que el Hijo necesitó redención
  choice: «el Hijo mismo… [necesitó] también redención»
  alternative: Atenuarlo como «participó de la redención» o atribuir la necesidad solo a su humanidad
  rationale: El testimonio formula una tensión teológica explícita y además marca «needed» como restauración editorial; se conserva sin armonizarla con doctrinas posteriores.
- issue: Relación entre Elección, Llamamiento, cámara nupcial y Cristo
  choice: Se mantienen como entidades diferenciadas y personificadas
  alternative: Interpretarlas como grupos eclesiales concretos o etapas definidas de salvación
  rationale: El texto no resuelve plenamente su estatuto; la traducción evita imponer una taxonomía denominacional.
- issue: Referente femenino en «he hopes for her»
  choice: «espera en ella»
  alternative: Explicitar «espera a la Iglesia», «espera al Llamamiento» o «tiene esperanza por ella»
  rationale: El antecedente es incierto en el testimonio. La formulación conserva el pronombre femenino sin identificarlo de manera conjetural.
- issue: Identidad de los de la izquierda y los de la derecha
  choice: Se conservan las designaciones espaciales sin explicación añadida
  alternative: Identificarlos con poderes malignos y benignos, o con categorías psíquicas y materiales
  rationale: El pasaje describe el escape de ambos grupos, pero no ofrece aquí una identificación suficiente para resolverla.
- issue: Enumeración «su Primogénito, su Amor, el Hijo carnal, y los ángeles»
  choice: Se conserva la puntuación enumerativa del testimonio
  alternative: Tratar «Primogénito», «Amor» e «Hijo carnal» inequívocamente como títulos de una sola figura
  rationale: La relación sintáctica entre estas expresiones es incierta; mantener la enumeración preserva la ambigüedad.
- issue: «the angelic redemption of the Father»
  choice: «la redención angélica del Padre»
  alternative: «el ángel de la redención del Padre»
  rationale: La alternativa podría ser idiomática, pero alteraría la relación nominal presente en el testimonio y resolvería una expresión difícil.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron las mayúsculas de los términos técnicos y las señales editoriales del testimonio: corchetes para restauraciones o lagunas, corchetes vacíos para texto perdido, paréntesis angulares para suplementos y <…> para una laguna. El borrador depende del testimonio inglés público suministrado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,5.'
