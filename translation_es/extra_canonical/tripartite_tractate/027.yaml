translation:
  language: es
  text: 'El Padre lo conocía de antemano, porque, antes de que existiera cualquier otra cosa, él habitaba en sus pensamientos, donde también tenía a aquellos por cuya causa lo reveló. Puso la deficiencia sobre aquello que perdura durante períodos pasajeros, para gloria de su Plenitud. El hecho de que fuera desconocido hizo que mostrara su bondad [dando conocimiento de sí mismo].[a]


    [Hay una laguna en el manuscrito.] De este modo, obtuvo conocimiento acerca de él como manifestación de su benevolencia y revelación de la riqueza de su dulzura, que es la segunda gloria. Así, también se ha manifestado como causa de la ignorancia, aunque produce conocimiento: una sabiduría oculta e inalcanzable en la que conserva el conocimiento hasta el fin, cuando las Totalidades hayan agotado sus esfuerzos en la búsqueda de Dios, el Padre, a quien nadie ha descubierto por su propia sabiduría o poder. Él se digna concederles el conocimiento del gran don del pensamiento excelente mediante una acción de gracias incesante dirigida a él. Desde su consejo inconmovible, se revela eternamente a quienes, por su voluntad, fueron considerados dignos del conocimiento del Padre, quien por naturaleza no puede ser conocido y quien, en su conocimiento previo, dispuso que pudieran alcanzar el conocimiento y todo bien que lo acompaña, junto con la experiencia de la ignorancia y sus sufrimientos.


    De este modo, llegarían a experimentar cosas malas y podrían ejercitarse por medio de ellas [...][b] durante un tiempo, a fin de alcanzar el [disfrute de las cosas buenas][c] por la eternidad. [Hay una laguna en el manuscrito.] Se exponen y sus enemigos los rechazan y difaman constantemente, pero ellos consideran esto un adorno y una señal maravillosa de realidades excelsas. Esto tenía como fin dejar claro que la ignorancia de quienes desconocían al Padre era obra de ellos mismos, en contraste con el poder de él, que hacía posible que llegaran a conocerlo.


    A este conocimiento se lo llama apropiadamente «el conocimiento de todo pensamiento posible» y «el tesoro». Y, para aumentar aún más el conocimiento, es la revelación de quienes fueron conocidos desde el principio, y es el camino hacia la unión y hacia el que preexiste.[d] El resultado es que quienes crecen en grandeza son aquellos que han renunciado a la grandeza que se les había asignado en el plan de salvación conforme a la voluntad divina, para que el fin pudiera ser como el principio.'
