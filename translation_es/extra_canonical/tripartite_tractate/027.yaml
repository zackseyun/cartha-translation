lexical_decisions:
- source_word: Fullness
  choice: Plenitud
  rationale: Conserva el término técnico cosmológico del escrito y su posible sentido colectivo, sin sustituirlo por una explicación doctrinal.
- source_word: the Totalities
  choice: las Totalidades
  rationale: Mantiene la forma plural y el carácter técnico del testimonio, evitando reducirlo a «todas las cosas».
- source_word: deficiency
  choice: deficiencia
  rationale: Reproduce el contraste conceptual con la Plenitud sin interpretarlo como pecado, carencia moral o creación material.
- source_word: excellent thought
  choice: pensamiento excelente
  rationale: Traducción formal que preserva la expresión inusual y evita identificarla sin evidencia con una entidad o facultad específica.
- source_word: train themselves
  choice: ejercitarse
  rationale: Expresa formación mediante la experiencia sin introducir el matiz institucional de «disciplinarse».
- source_word: union
  choice: unión
  rationale: Mantiene abierta la naturaleza de la unión, que el pasaje no define.
theological_decisions:
- issue: Dios como causa de la ignorancia
  choice: «se ha manifestado como causa de la ignorancia, aunque produce conocimiento»
  alternative: Atenuarlo como «permitió la ignorancia»
  rationale: Se conserva la tensión explícita del testimonio y no se armoniza con una teodicea posterior.
- issue: Incapacidad natural de conocer al Padre
  choice: «por naturaleza no puede ser conocido»
  alternative: «es difícil de conocer»
  rationale: Mantiene la afirmación fuerte sobre la incognoscibilidad del Padre y su contraste con la revelación concedida.
- issue: Responsabilidad por la ignorancia
  choice: «era obra de ellos mismos»
  alternative: «era culpa de ellos»
  rationale: Preserva la atribución de origen o responsabilidad sin intensificarla necesariamente hasta una formulación jurídica o moral.
- issue: Plan de salvación y renuncia a la grandeza
  choice: Se conserva que los que crecen «han renunciado a la grandeza» asignada
  alternative: Corregir el aparente contrasentido a «han alcanzado» o «han recibido»
  rationale: La formulación es difícil, pero debe mantenerse sin resolver silenciosamente su tensión conceptual.
- issue: Referentes pronominales masculinos
  choice: Se conservan «lo», «él» y «acerca de él» donde el testimonio no identifica con certeza al referente
  alternative: Sustituirlos por «el Hijo», «el Padre» u otra figura
  rationale: No se importa una identificación teológica que la evidencia suministrada no establece de manera inequívoca.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los tecnicismos «Plenitud» y «Totalidades», las ambigüedades pronominales y las tensiones teológicas. Las lagunas vacías del testimonio se hicieron visibles como avisos entre corchetes. Borrador provisional basado en el testimonio inglés de dominio público; queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,5.
