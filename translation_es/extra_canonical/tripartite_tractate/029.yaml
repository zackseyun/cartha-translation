review_pass:
  verdict: revise
  source_fidelity: 'Revisión provisional frente al testimonio inglés suministrado (la revisión directa del copto sigue pendiente). El borrador reproduce en general el contenido y conserva prudentemente los referentes difíciles. Sin embargo, colapsa dos señales críticas distintas del testimonio: los corchetes vacíos [] y las lagunas extensas [. . .]. También «singularidad» debe conservarse, en vez de interpretarse como «unidad».'
  naturalness: El español es mayormente natural, actual y de registro adecuado. Se ajustan levemente algunas construcciones para mantener legibilidad sin resolver ambigüedades del pasaje.
  terminology: Se mantienen los términos técnicos Elección, Llamada, Palabra, reposo, eones, Plenitud y Totalidad. Se restituye «singularidad» para no sustituir un término cosmológico potencialmente técnico por una interpretación.
  issues:
  - severity: high
    issue: Señalización de lagunas manuscritas no preservada de forma distinguible
    rationale: El testimonio diferencia [] de [. . .], pero el borrador representa ambos normalmente como […]. Dado que estas marcas transmiten estados textuales distintos, deben conservarse tal como se reciben.
  - severity: medium
    issue: «Singularity» se interpreta como «unidad»
    rationale: Aunque «unidad» puede sonar más idiomático en contexto, «singularidad» es la correspondencia directa y evita fijar por anticipado el alcance conceptual de la afirmación.
  - severity: low
    issue: «Dieron testimonio de que había aparecido»
    rationale: El antecedente de «it» es la luz revelada; «se había manifestado» retiene mejor la conexión verbal con «revelación» y evita una leve ambigüedad temporal.
  revised_text: 'Aunque podríamos decir muchas más cosas sobre el tema de la Elección, [] y sería apropiado hablar de ellas, debemos, sin embargo, <hablar> más acerca de los de la Llamada, como se denomina a los de la derecha, pues no nos sería provechoso olvidarlos. Ya hemos hablado extensamente de ellos, como si eso hubiera bastado. Entonces, ¿por qué hablamos de ellos solo en parte?


    Dije que todos los que tuvieron su origen en la Palabra —ya fuera a partir del juicio contra los malvados, de la furia que lucha contra ellos, de la conversión que se aparta de ellos, que es el regreso a los exaltados, de la oración y el recuerdo de los preexistentes, o de la esperanza y la fe en que su salvación podía [obtenerse] mediante buenas obras—, todos ellos han sido considerados dignos, porque proceden de las buenas inclinaciones y tienen como causa de su generación un pensamiento de Aquel que Es.


    También dije que, antes de que la Palabra se relacionara voluntariamente con ellos de manera invisible, el Exaltado les concedió el pensamiento antes mencionado, porque ellos [le prestaron atención], [] el pensamiento que llegó a ser la causa de su existencia. Cuando <fueron> salvados, no se enaltecieron con arrogancia, como si nada hubiera existido antes que ellos. Por el contrario, reconocieron que su existencia tuvo un origen y que deseaban conocer a quien existía antes que ellos.


    También dije que se postraron cuando la luz se reveló con apariencia de relámpago, y que dieron testimonio de que se había manifestado para salvarlos.


    Dije que no solo obtendrán el bien quienes tuvieron su origen en la Palabra, sino que incluso aquellos a quienes estos produjeron conforme a las buenas inclinaciones disfrutarán del reposo gracias a la abundancia del don. Aun quienes fueron producidos por el deseo de dominar, y en quienes está la semilla de ese deseo, recibirán la recompensa de las buenas obras si han cooperado con los de buena inclinación y si deliberadamente desean abandonar el amor vacío por una gloria pasajera, a fin de guardar el mandamiento del Señor [] de la gloria. Así, en vez de un honor mezquino y transitorio, heredarán el reino eterno.


    Fue necesario retomar nuestro discurso anterior; pero ahora, para formular un argumento coherente, debemos relacionar las causas, los efectos y la <evidencia> acerca de si los de la derecha, sean puros o mezclados, pueden recibir el don de la salvación y el reposo. Por consiguiente, debemos demostrarlo mediante una exposición convincente basada en la forma de su fe.


    Si confesamos el reino en Cristo, <eliminamos> toda diversidad de formas, toda desigualdad y todo cambio. Porque al final volverá a haber singularidad, así como hubo singularidad al principio: el lugar donde no hay varón ni mujer, esclavo ni libre, circuncisión ni incircuncisión, ángel ni ser humano, sino que Cristo es todo en todos. ¿Cómo puede hallarse en la existencia quien no existía al principio? ¿Y cuál es la condición de quien no era esclavo, dado que ocupará un lugar junto con [] alguien libre? Incluso recibirán una visión sin intermediarios, sin necesidad de creer que las cosas son así basándose únicamente en una breve palabra pronunciada por una voz.


    Esto se debe a que la restauración de lo que existió una vez es singularidad. Aunque algunos sean exaltados a causa del plan de salvación, encargados de las causas de las cosas existentes, poniendo en acción una multitud de fuerzas naturales y deleitándose en ellas —sean ángeles o seres humanos—, alcanzarán el reino, la confirmación y la salvación.


    Estas son las causas: los que aparecieron en carne creyeron sin vacilar que él es el Hijo del Dios desconocido, inefable desde la antigüedad y a quien nadie había podido ver. Renunciaron a sus dioses, ante los cuales antes se habían postrado, y a los señores del cielo y de la tierra. Antes de que <él> fuera elevado, cuando todavía era niño, dieron testimonio de que ya predicaba. Y cuando estaba en la tumba [como] un muerto, los ángeles creyeron que estaba vivo, [recibiendo incluso] vida [] de aquel que había muerto.


    La multitud de sus ritos sagrados y de las maravillas que habían realizado en los templos paganos se transformó entonces en devoción a otro, es decir, a Cristo. Su confesión de Cristo fue lo que les dio poder para efectuar ese cambio en su devoción, al apresurarse a acercarse a él. Habían recibido aquella preparación pagana únicamente para rechazarla después en favor de aquel a quien no se <rendía honor> en este lugar inferior, es decir, el mundo. Pero, al rechazar a los dioses paganos, [obtuvieron] a Cristo, de quien comprendieron que procedía del [lugar exaltado], [del cual] ellos habían venido junto con él, un lugar de dominio divino. Los nombres de aquellos a quienes habían adorado, atendido y servido los habían recibido en préstamo; ahora los transfirieron a aquel a quien propiamente corresponden.


    Sin embargo, solo después de su elevación reconocieron que él era su Señor, sobre quien no hay señor alguno. Le entregaron sus reinos; se levantaron [de sus] tronos, dejándolos vacíos, y depusieron sus coronas. Él se les reveló por las causas que ya expusimos: para sanarlos y para que [se volvieran al] buen pensamiento acerca de [. . .] [] compañero y los ángeles [. . .], y por la abundancia del bien que hicieron por ello. De este modo, se les asignaron servicios que benefician a los elegidos: llevar la iniquidad de estos al cielo para un juicio eterno, con un [veredicto] irrefutable e infalible. Continúan actuando en favor de ellos hasta que todos entran en la vida terrenal y salen de ella, mientras sus cuerpos [permanecen] en la tierra. Sirven a todos sus [. . .], haciéndose partícipes de sus sufrimientos, persecuciones y peligros, los cuales sobrevinieron a los santos más que a los demás.


    En cuanto a los servidores del maligno, puesto que el mal merece la destrucción <…>, firmemente a causa de la [vida en común] que está por encima de todos los mundos, la cual es su buen pensamiento y su fraternidad.


    Y la Iglesia los recordará como amigos verdaderos y servidores fieles cuando haya recibido la redención de aquel que [les da] la recompensa, la cual consiste en la alegría que prevalece en la cámara nupcial y en el [. . . que] habita en su casa [. . .], que habita en el pensamiento [. . .] y aquello que se le debe [. . .] [] Cristo, que habita con ella, [y] la espera confiada del Padre [de] la Totalidad, porque ella les proporcionará ángeles para guiarlos y servirlos.


    Los eones recordarán los gratos pensamientos de servir a la Iglesia <y> les concederán su recompensa [por] todas sus meditaciones. Esta es una emanación procedente de ellos: así como Cristo [cumplió su] voluntad, la cual produjo las grandes [realidades] exaltadas de la Iglesia y se las concedió, <así también> esta emanación será un pensamiento para estos y les proporcionará las moradas donde habitarán eternamente. [Después de que] rechacen la atracción descendente de la deficiencia, el poder de la Plenitud los impulsará hacia arriba mediante la grandeza de su generosidad y la dulzura del eón preexistente.'
