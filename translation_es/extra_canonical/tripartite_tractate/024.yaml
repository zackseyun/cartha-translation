review_pass:
  verdict: revise
  source_fidelity: 'La versión conserva de manera sólida la terminología técnica y las ambigüedades principales del testimonio inglés provisional. Sin embargo, omite «invisibly» en la cláusula lacunosa inicial («[as] invisible and invisibly») y regulariza en exceso una construcción sintácticamente incompleta en el segundo párrafo: el testimonio dice que «those who ... assumed body and soul, and an establishment and stability and wisdom», no que «recibieron» esas cualidades.'
  naturalness: El español es en general claro, digno y apropiado para un tratado antiguo de sintaxis difícil. Se mantienen de forma justificable ciertas asperezas donde el testimonio es fragmentario o técnicamente denso. «Impasibilidad» es más conciso y reconocible como término técnico que «imposibilidad de padecer»; la nota puede explicarlo sin estrechar su alcance.
  terminology: Se sostienen adecuadamente Salvador, Palabra, Totalidad, plan de salvación, redención, carne y alma. Se conserva «plantación» sin interpretación eclesiológica. Se recomienda «impasibilidad» en el texto y una nota explicativa, y se debe preservar «invisibles e invisiblemente» pese a la laguna.
  issues:
  - severity: medium
    issue: Se omite «invisibly» en la cláusula con lagunas del primer párrafo.
    rationale: El testimonio distingue «[as] invisible and invisibly». La traducción «[como] invisibles» solo conserva uno de los dos elementos y reduce la formulación atestiguada.
  - severity: medium
    issue: «Recibieron también fundamento, estabilidad y sabiduría» cambia el verbo y resuelve una sintaxis fragmentaria.
    rationale: 'El testimonio vincula, aunque de modo gramaticalmente defectuoso, «assumed» tanto con «body and soul» como con «an establishment and stability and wisdom». «Recibieron» introduce una relación no expresada. Conviene conservar la construcción áspera: «asumieron cuerpo y alma, y fundamento, estabilidad y sabiduría».'
  - severity: low
    issue: «Imposibilidad de padecer» es explicativo, pero menos preciso como etiqueta técnica que «impasibilidad».
    rationale: «Impassability» admite una correspondencia técnica directa en español. La explicación sobre pasiones y sufrimiento debe permanecer en nota para no imponer una delimitación doctrinal.
  revised_text: '**La encarnación**[a]




    Movido por su inclinación a la misericordia, nuestro Salvador llegó a ser igual a aquello en lo que se habían convertido, por una pasión instintiva, aquellos por quienes se manifestó: carne y alma, las cuales los dominan constantemente, de modo que perecen y mueren. Sin embargo, a quienes [llegaron a existir] […] [como] invisibles e invisiblemente, les enseñó invisiblemente acerca de sí mismo. No solo tomó sobre <sí> la muerte de aquellos a quienes se proponía salvar, sino que también asumió la pequeñez en la que habían caído al <nacer> con cuerpo y alma, pues se dignó nacer como un niño con cuerpo y alma. Participó en todas las demás condiciones que compartían los que habían caído, aunque ellos poseían la luz y él estaba por encima de ellos, pues se dignó ser concebido sin pecado, impureza ni corrupción. Fue engendrado para la vida física mientras habitaba en la vida, porque se había determinado que ambos llegaran por igual a ser cuerpo y alma a causa de la pasión y de la inclinación
    cambiante procedente de la Palabra, que se había puesto en movimiento al volverse.




    Pero, conforme al plan de salvación, fue él <quien> tomó sobre sí los resultados de lo que antes mencionamos, es decir, lo que llegó a existir a partir de la visión iluminadora y del pensamiento firme de la Palabra después de volverse sobre sí misma, después de ponerse en movimiento. Así fue como aquellos que, al igual que él, asumieron cuerpo y alma, y fundamento, estabilidad y sabiduría. Se había determinado de antemano que vendrían junto con la venida del Salvador, también determinada de antemano. Solo cuando el Salvador tomó la decisión vinieron ellos también. Así pues, vinieron, superando con mucho, en su emanación carnal, a quienes habían sido producidos a partir de la deficiencia […], porque también ellos experimentaron de este modo una emanación corporal, como el Salvador, mediante la revelación de su unión con él.




    Estos son los que pertenecen a una sola sustancia, la espiritual. Sin embargo, el plan de salvación es diverso: una cosa es esta y otra, aquella. Unos surgen de la pasión y de la división, y necesitan sanidad. Otros proceden de la oración que sana a los enfermos y son designados para atender a los caídos. Estos son los apóstoles y los proclamadores del mensaje. Son discípulos del Salvador y maestros de quienes necesitan enseñanza.




    Entonces, ¿por qué participan también ellos de las mismas pasiones que aquellos que fueron producidos a partir de la pasión, si, conforme al plan de salvación, fueron producidos en un solo cuerpo con <el> Salvador, quien no participó de tales pasiones? El Salvador era imagen de una entidad única, pues era la Totalidad en forma corporal. Por eso conservó el modelo de la inseparabilidad, del cual procede la impasibilidad.[b] Ellos, en cambio, son imágenes de cada uno de los que fueron revelados. Por eso aceptan la separación de su modelo, ya que asumieron forma para la plantación que existe debajo del cielo y que también […] participa del mal que domina en los lugares adonde han llegado. Pues la voluntad mantuvo cautiva bajo el pecado a la Totalidad, para que por voluntad él pudiera tener misericordia de la Totalidad y ellos pudieran ser salvados, ya que el que es único es escogido para dar vida, mientras que todos los demás necesitan salvación.




    Por esta razón, él fue el primero entre quienes recibieron la gracia de impartir los dones proclamados por aquellos a quienes consideró dignos de predicar a otros. Porque fue establecida <la> semilla de la promesa de Jesucristo, cuya revelación y unión hemos servido. La promesa hizo posible la enseñanza, incluso el regreso a lo que ellos habían sido al principio. Poseen una gota que los inclina a regresar allí. A esto lo llaman «redención»: la liberación del cautiverio y la obtención de la libertad.




    El cautiverio es el de quienes fueron esclavizados por la ignorancia. La libertad, en cambio, es el conocimiento de la verdad que existía antes de la ignorancia y prevalece eternamente, sin principio ni fin. Ella es el bien, un remedio para todo y la liberación de la naturaleza esclavizante que hizo sufrir a quienes habían sido producidos en un pensamiento vil de vaciedad: la naturaleza de la mala inclinación […], mediante el pensamiento que los rebaja hasta el ansia de dominio. De la riqueza de la gracia que contempló a los hijos recibieron el tesoro de la libertad. La libertad derriba la pasión y destruye aquellas cosas que antes había arrojado fuera de sí, cuando la Palabra las separó de sí misma. Las destinó a la destrucción hasta que termine <el> plan de salvación, y permitió que siguieran existiendo porque también ellas eran útiles para las cosas determinadas de antemano.'
