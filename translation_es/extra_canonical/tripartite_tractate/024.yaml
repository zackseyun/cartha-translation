  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: es
  text: '**La encarnación**[a]


    Movido por su inclinación a la misericordia, nuestro Salvador llegó a ser igual a aquello en lo que se habían convertido, por una pasión instintiva, aquellos por quienes se manifestó: carne y alma, las cuales los dominan constantemente, de modo que perecen y mueren. Sin embargo, a quienes [llegaron a existir] […] [como] invisibles, les enseñó invisiblemente acerca de sí mismo. No solo tomó sobre <sí> la muerte de aquellos a quienes se proponía salvar, sino que también asumió la pequeñez en la que habían caído al <nacer> con cuerpo y alma, pues se dignó nacer como un niño con cuerpo y alma. Participó en todas las demás condiciones que compartían los que habían caído, aunque ellos poseían la luz y él estaba por encima de ellos, pues se dignó ser concebido sin pecado, impureza ni corrupción. Fue engendrado para la vida física mientras habitaba en la vida, porque se había determinado que ambos llegaran por igual a ser cuerpo y alma a causa de la pasión y de la inclinación cambiante procedente
    de la Palabra, que se había puesto en movimiento al volverse.


    Pero, conforme al plan de salvación, fue él <quien> tomó sobre sí los resultados de lo que antes mencionamos, es decir, lo que llegó a existir a partir de la visión iluminadora y del pensamiento firme de la Palabra después de volverse sobre sí misma, después de ponerse en movimiento. Así fue como aquellos que, al igual que él, asumieron cuerpo y alma, recibieron también fundamento, estabilidad y sabiduría. Se había determinado de antemano que vendrían junto con la venida del Salvador, también determinada de antemano. Solo cuando el Salvador tomó la decisión vinieron ellos también. Así pues, vinieron, superando con mucho, en su emanación carnal, a quienes habían sido producidos a partir de la deficiencia […], porque también ellos experimentaron de este modo una emanación corporal, como el Salvador, mediante la revelación de su unión con él.


    Estos son los que pertenecen a una sola sustancia, la espiritual. Sin embargo, el plan de salvación es diverso: una cosa es esta y otra, aquella. Unos surgen de la pasión y de la división, y necesitan sanidad. Otros proceden de la oración que sana a los enfermos y son designados para atender a los caídos. Estos son los apóstoles y los proclamadores del mensaje. Son discípulos del Salvador y maestros de quienes necesitan enseñanza.


    Entonces, ¿por qué participan también ellos de las mismas pasiones que aquellos que fueron producidos a partir de la pasión, si, conforme al plan de salvación, fueron producidos en un solo cuerpo con <el> Salvador, quien no participó de tales pasiones? El Salvador era imagen de una entidad única, pues era la Totalidad en forma corporal. Por eso conservó el modelo de la inseparabilidad, del cual procede la imposibilidad de padecer.[b] Ellos, en cambio, son imágenes de cada uno de los que fueron revelados. Por eso admiten la separación de su modelo, ya que asumieron forma para la plantación que existe debajo del cielo y que también […] participa del mal que domina en los lugares adonde han llegado. Pues la voluntad mantuvo cautiva bajo el pecado a la Totalidad, para que por voluntad él pudiera tener misericordia de la Totalidad y ellos pudieran ser salvados, ya que el que es único es escogido para dar vida, mientras que todos los demás necesitan salvación.


    Por esta razón, él fue el primero entre quienes recibieron la gracia de impartir los dones proclamados por aquellos a quienes consideró dignos de predicar a otros. Porque fue establecida <la> semilla de la promesa de Jesucristo, cuya revelación y unión hemos servido. La promesa hizo posible la enseñanza, incluso el regreso a lo que ellos habían sido al principio. Poseen una gota que los inclina a regresar allí. A esto lo llaman «redención»: la liberación del cautiverio y la obtención de la libertad.


    El cautiverio es el de quienes fueron esclavizados por la ignorancia. La libertad, en cambio, es el conocimiento de la verdad que existía antes de la ignorancia y prevalece eternamente, sin principio ni fin. Ella es el bien, un remedio para todo y la liberación de la naturaleza esclavizante que hizo sufrir a quienes habían sido producidos en un pensamiento vil de vaciedad: la naturaleza de la mala inclinación […], mediante el pensamiento que los rebaja hasta el ansia de dominio. De la riqueza de la gracia que contempló a los hijos recibieron el tesoro de la libertad. La libertad derriba la pasión y destruye aquellas cosas que antes había arrojado fuera de sí, cuando la Palabra las separó de sí misma. Las destinó a la destrucción hasta que termine <el> plan de salvación, y permitió que siguieran existiendo porque también ellas eran útiles para las cosas determinadas de antemano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés público suministrado del *Códice de Nag Hammadi* I,5; queda pendiente la revisión directa del copto. Los corchetes con puntos suspensivos señalan lagunas, y los signos < >, restituciones editoriales del testimonio.
    reason: Informa con transparencia la base documental y explica las señales textuales visibles.
  - marker: b
    text: '«Imposibilidad de padecer» traduce una idea que también puede expresarse como «impasibilidad»: incapacidad de ser afectado por las pasiones o el sufrimiento.'
    reason: Aclara un concepto técnico sin resolver si el énfasis recae en las pasiones, el sufrimiento o ambos.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Conserva el título soteriológico del testimonio sin añadir una identificación no expresada en cada aparición.
- source_word: flesh and soul
  choice: carne y alma
  rationale: Mantiene la pareja antropológica y la tensión conceptual del tratado, sin sustituir «carne» por el término más general «cuerpo».
- source_word: plan of salvation
  choice: plan de salvación
  rationale: Expresa con naturalidad el sentido económico-soteriológico sin importar el tecnicismo confesional «dispensación».
- source_word: Word
  choice: Palabra
  rationale: Traduce el título conceptual y personal con género gramatical femenino en español; las referencias pronominales se ajustan a ese género.
- source_word: Totality
  choice: Totalidad
  rationale: La mayúscula señala su uso técnico en la cosmología del tratado y evita reducirlo a «todos».
- source_word: impassability
  choice: imposibilidad de padecer
  rationale: Hace comprensible el concepto sin imponer el tecnicismo menos accesible «impasibilidad»; la nota conserva la amplitud semántica.
- source_word: planting
  choice: plantación
  rationale: Conserva la metáfora colectiva del testimonio, aunque resulte inusual, en vez de interpretarla como «descendencia» o «Iglesia».
- source_word: redemption
  choice: redención
  rationale: Mantiene el término que el propio pasaje define como liberación del cautiverio y obtención de libertad.
theological_decisions:
- issue: Modo de participación del Salvador en la condición humana
  choice: «llegó a ser igual a aquello en lo que se habían convertido» y «participó en… condiciones»
  alternative: «se hizo plenamente humano» o «solo pareció humano»
  rationale: Conserva la formulación y la tensión del tratado sin resolverla en favor de una cristología posterior determinada.
- issue: Concepción «sin pecado, impureza ni corrupción»
  choice: Traducción directa de la triple negación
  alternative: Interpretarla como una doctrina mariana o como mera incorruptibilidad física
  rationale: El texto se refiere al Salvador; no se añade un sujeto, mecanismo o desarrollo doctrinal ausente.
- issue: La voluntad que mantiene cautiva a la Totalidad
  choice: Se conserva la referencia ambigua de «la voluntad» y el posterior «él»
  alternative: Identificar explícitamente la voluntad con Dios, el Salvador o la Palabra
  rationale: El testimonio no permite resolver con seguridad el referente, por lo que se preserva la ambigüedad teológica.
- issue: Unidad de sustancia de los seres espirituales
  choice: «pertenecen a una sola sustancia, la espiritual»
  alternative: «son consustanciales con el Salvador»
  rationale: Evita introducir lenguaje conciliar o precisar una relación ontológica más allá de lo afirmado por el pasaje.
- issue: Libertad como conocimiento de la verdad
  choice: Se mantiene la definición epistemológica del tratado
  alternative: Reformularla como justificación, santificación o liberación política
  rationale: Respeta el marco propio del texto sin asimilarlo a una doctrina confesional ajena.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones argumentativas, los términos cosmológicos con mayúscula y las ambigüedades de referente. Se suavizó la sintaxis del testimonio solo cuando era necesario para la comprensión, sin completar las lagunas ni armonizar la teología del tratado con formulaciones confesionales posteriores.
