id: TRIP.022
reference: Tripartite Tractate — Different Opinions
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'When the two orders, [those] of the right and those of the left, are united with each other by the (mediating) thought that is between them, which gives them their shared plan of salvation, the result is that they both operate with the same passion, those of the right imitating those of the left, and those of the left imitating those of the right. At times, when the evil order, out of foolishness, starts committing evil, the <wise> order copies them, in the form of a male, also committing evil, as though it, too, were a power of evil. At other times, when the wise order starts performing good deeds, the <foolish> order tries to do good as well, copying it.


    Thus are things established by these kinds [] of acts, coming into being so that what is similar and what is dissimilar (resemble each other). Those, then, who are untaught cannot come to know the cause of existent things. And so, they have advanced various kinds of explanations. Some say that existent things derive their being from providence. These are those who see order and pattern in the movements of creation. Others say that (existence derives from) something alien. These are those who see <diversity> and the evil of the lawlessness of the powers. Others say that existent things occur because of fate. These are those who were preoccupied with this question. Others say that it is a matter of nature. Others say that it is a matter of chance. Most, though, of all of those who have grasped only as far as the visible elements, know of nothing beyond them.


    The Greek sages and the barbarians have grasped as far as the powers that attained being through imagination and vacuous thought, <and also> those who have stemmed from these through conflict and the rebellious behavior operative among them. As a consequence, when they spoke concerning the things they considered wisdom, they were fooled by a <simulacrum>. They believed they had attained to the truth, [] whereas they had attained to an error. This (error) pertained not just to minor appellations, but the powers themselves prevented them by convincing them that they had <understood> the Totality.


    Consequently, the order fell into fighting itself, because of the prideful enmity of [an offspring] of the archon who is [superior], who pre-existed him. This is why there was total disagreement about everything by everybody, about philosophy, kinds of medicine, categories of rhetoric, kinds of music, and orders of logic, all being opinions and theories. And so <loquaciousness> prevailed, and <they> were in confusion, because of their inability to explain <those> who possess power and who gave them their theories.


    Regarding the things that sprang up among the <nation> of the Hebrews, the writings by the material ones <whose> example the Greeks copy, all they thought of in order to articulate it, the powers of the right <…>, who inspired all of them to reason <with> words and a self-representation. Thus they began their journey to attain the truth, using the mixed (variety of) powers operative in them.


    Thereafter they attained to the order of the unmixed powers, <before> they attained the one established according to the likeness of the Father. He is not invisible [] <because of his> nature, but because a wisdom conceals him, in order to preserve the form of what is truly invisible. Many angels, therefore, have been unable to reach a vision of him. The people of the Hebrew nation, whom we mentioned earlier, namely, the righteous and the prophets, neither thought nor spoke anything from imagination or through an illusory image or from abstruse thought. Instead, each one by the power operative in him, paying attention to what he saw and heard, each spoke accurately, in harmony with each other and in agreement like those (powers) who were operative in them, because they preserved their <unity> and mutual harmony. This was the case above all because they praised the one who was more exalted than themselves, and the one who was greater than themselves, who existed and was appointed because
    they stood in need of him. This the spiritual Word produced among them as with one who needs the Exalted One, with hope and expectant waiting according to the thought that is the seed of salvation and an illuminating word that is the memory, with his offspring and his emanations, who are the righteous ones and the prophets we mentioned before. They preserve their fathers’ praise and their witness concerning what is great. These came into being [] with an expectation of hope and attention, in whom was sown <the> seed of prayer and searching, which is sown in the many who have sought to be strengthened. It reveals itself and moves them to love the Exalted One, to proclaim that these things pertain to the One and Only.


    Something singular was operative in them when they spoke. Their vision and their words, however, were diverse, because of the diversity of those who communicated to them their visions and words. Therefore, those who have paid heed to what they have spoken do not refuse any of it, but have accepted the scriptures with a diversity of interpretations. This led to the establishment of diverse groups that exist to this day among the Jews. Some say God is one, who has spoken in the ancient scriptures. Others say that he is manifold, yet some say that God is simple and in nature a single mind. Others say that his acts are related to the origins of good and evil. Yet others say that he himself is the creator of what has come into being, while others say that [] he created through the angels. The diversity of ideas of this type reflects the diversity of forms and the wealth of types of scripture, which produced their teacher<s> of the Law.'
