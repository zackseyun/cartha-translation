review_pass:
  verdict: revise
  source_fidelity: La revisión directa del copto sigue pendiente; frente al testimonio inglés suministrado, el borrador es en general fiel y conserva correctamente corchetes, suplementos entre < >, lagunas [] y la elipsis <…>. No obstante, hay un cambio de sentido en «en la forma de un varón», y algunos ajustes evitan inferencias no expresadas o mejoran concordancias sin resolver ambigüedades textuales.
  naturalness: El español es mayormente natural, moderno y de registro adecuado. La revisión mejora varias formulaciones excesivamente interpretativas o poco fluidas («quedan unidos», «llegado a percibir», «forma masculina») y corrige una concordancia final.
  terminology: Se mantienen «órdenes», «poderes», «arconte», «Totalidad», «Palabra espiritual», «Exaltado», «Uno y Único» y «materiales» como equivalentes prudentes. Se conserva «simulacro» y las señales editoriales del testimonio. «Forma de varón» traduce con mayor precisión el marcador de género masculino sin sugerir una transformación corporal específica.
  issues:
  - severity: medium
    issue: «adopta forma masculina» para «in the form of a male»
    rationale: La redacción española puede implicar que el orden se transforma o adopta activamente una forma. El testimonio expresa más escuetamente que imita «en forma de un varón»; conviene preservar esa formulación ambigua.
  - severity: low
    issue: «los escritos de los materiales» para «the writings by the material ones»
    rationale: «De los materiales» puede leerse como pertenencia. «Los escritos hechos por los materiales» refleja mejor la agencia, sin definir quiénes son los «materiales».
  - severity: low
    issue: «la mayoría de quienes solo han llegado a percibir»
    rationale: «Have grasped only as far as» se refiere al alcance de su comprensión, no específicamente a percepción. «Solo han comprendido hasta los elementos visibles» es más fiel y natural.
  - severity: low
    issue: «que produjeron a sus maestro<s> de la Ley»
    rationale: La construcción es poco natural y oscurece que la diversidad de escrituras produjo maestros. «De la cual surgieron sus maestro<s> de la Ley» conserva la relación y mejora la sintaxis.
  revised_text: 'Cuando los dos órdenes —[los] de la derecha y los de la izquierda— están unidos entre sí por el pensamiento (mediador) que está entre ellos y les da su plan común de salvación, ambos actúan con la misma pasión: los de la derecha imitan a los de la izquierda, y los de la izquierda, a los de la derecha. A veces, cuando el orden malo comienza a hacer el mal por insensatez, el orden <sabio> lo imita, en forma de un varón, y también hace el mal, como si él también fuera un poder maligno. Otras veces, cuando el orden sabio comienza a hacer buenas obras, el orden <insensato> procura hacer el bien también, imitándolo.



    Así quedan establecidas las cosas mediante esta clase [] de acciones, y llegan a existir de tal manera que lo semejante y lo diferente se parecen entre sí. Por eso, quienes carecen de enseñanza no pueden conocer la causa de las cosas existentes, y han propuesto explicaciones de distintas clases. Algunos dicen que las cosas existentes reciben su ser de la providencia; estos son quienes ven orden y estructura en los movimientos de la creación. Otros dicen que la existencia procede de algo ajeno; estos son quienes ven la <diversidad> y el mal de la conducta sin ley de los poderes. Otros dicen que las cosas existentes suceden por el destino; estos son quienes se ocuparon intensamente de esta cuestión. Otros dicen que se deben a la naturaleza, y otros, al azar. Sin embargo, la mayoría de quienes solo han comprendido hasta los elementos visibles no conocen nada más allá de ellos.



    Los sabios griegos y los bárbaros solo llegaron a comprender los poderes que recibieron el ser mediante la imaginación y el pensamiento vacío, <así como> los que procedieron de ellos mediante el conflicto y la conducta rebelde que actuaba entre ellos. Por consiguiente, cuando hablaron acerca de aquello que consideraban sabiduría, fueron engañados por un <simulacro>. Creyeron haber alcanzado la verdad, [] pero habían caído en el error. Este error no se limitaba a nombres de poca importancia; los poderes mismos les impedían avanzar al convencerlos de que habían <comprendido> la Totalidad.



    En consecuencia, el orden comenzó a luchar contra sí mismo por la enemistad orgullosa de [un descendiente] del arconte [superior], quien existía antes que él. Por eso hubo entre todos un desacuerdo absoluto acerca de todo: sobre la filosofía, las clases de medicina, las categorías de la retórica, las clases de música y los órdenes de la lógica. Todo eran opiniones y teorías. Así prevaleció la <palabrería>, y <ellos> quedaron confundidos porque eran incapaces de explicar <a aquellos> que poseen poder y que les dieron sus teorías.



    En cuanto a las cosas que surgieron entre la <nación> de los hebreos —los escritos hechos por los materiales, <cuyo> ejemplo imitan los griegos, y todo lo que concibieron para expresarlo—, los poderes de la derecha <…>, que inspiraron a todos ellos a razonar <con> palabras y mediante una representación de sí mismos. Así emprendieron el camino para alcanzar la verdad valiéndose de la variedad mezclada de poderes que actuaba en ellos.



    Después alcanzaron el orden de los poderes sin mezcla, <antes de> alcanzar al que fue establecido conforme a la semejanza del Padre. Él no es invisible [] <por su> naturaleza, sino porque una sabiduría lo oculta a fin de preservar la forma de lo que es verdaderamente invisible. Por eso, muchos ángeles no han podido llegar a contemplarlo. Los miembros de la nación hebrea que mencionamos antes, es decir, los justos y los profetas, no pensaron ni dijeron nada nacido de la imaginación, de una imagen ilusoria o de un pensamiento abstruso. Por el contrario, cada uno, mediante el poder que actuaba en él y atento a lo que veía y oía, habló con precisión. Hablaron en armonía unos con otros y de común acuerdo, como los poderes que actuaban en ellos, porque conservaron su <unidad> y su armonía mutua. Esto fue así, sobre todo, porque alababan al que era más elevado que ellos y al que era mayor que ellos, quien existía y había sido establecido porque lo necesitaban.



    Esto lo produjo entre ellos la Palabra espiritual, como en alguien que necesita al Exaltado: con esperanza y espera confiada, conforme al pensamiento que es la semilla de salvación, y con una palabra iluminadora que es la memoria, junto con su descendencia y sus emanaciones, que son los justos y los profetas antes mencionados. Ellos conservan la alabanza de sus padres y su testimonio acerca de lo que es grande. Estos llegaron a existir [] con esperanza expectante y atención; en ellos fue sembrada <la> semilla de la oración y de la búsqueda, la cual también es sembrada en los muchos que han procurado ser fortalecidos. Ella se manifiesta y los mueve a amar al Exaltado y a proclamar que estas cosas pertenecen al Uno y Único.



    Algo singular actuaba en ellos cuando hablaban. Sin embargo, sus visiones y sus palabras eran diversas debido a la diversidad de quienes les comunicaban esas visiones y palabras. Por eso, quienes han prestado atención a lo que dijeron no rechazan ninguna parte, sino que han aceptado las Escrituras con diversas interpretaciones. Esto condujo al establecimiento de distintos grupos que existen hasta hoy entre los judíos. Algunos dicen que Dios es uno, el que habló en las antiguas Escrituras. Otros dicen que es múltiple; algunos, en cambio, afirman que Dios es simple y que por naturaleza es una sola mente. Otros dicen que sus obras están relacionadas con los orígenes del bien y del mal. Otros afirman que él mismo es el creador de cuanto llegó a existir, mientras que otros dicen que [] creó por medio de los ángeles. Esta diversidad de ideas refleja la diversidad de formas y la riqueza de tipos de Escritura, de la cual surgieron sus maestro<s> de la Ley.'
