translation:
  language: es
  text: 'Cuando los dos órdenes —[los] de la derecha y los de la izquierda— quedan unidos entre sí por el pensamiento mediador que está entre ellos y les da su plan común de salvación, ambos terminan actuando con la misma pasión: los de la derecha imitan a los de la izquierda, y los de la izquierda, a los de la derecha. A veces, cuando el orden malo comienza a hacer el mal por insensatez, el orden <sabio> lo imita: adopta forma masculina y también hace el mal, como si él también fuera un poder maligno. Otras veces, cuando el orden sabio comienza a hacer buenas obras, el orden <insensato> procura hacer el bien también, imitándolo.


    Así quedan establecidas las cosas mediante esta clase [] de acciones, y llegan a existir de tal manera que lo semejante y lo diferente se parecen entre sí. Por eso, quienes carecen de enseñanza no pueden conocer la causa de las cosas existentes, y han propuesto explicaciones de distintas clases. Algunos dicen que las cosas existentes reciben su ser de la providencia; estos son quienes ven orden y estructura en los movimientos de la creación. Otros dicen que la existencia procede de algo ajeno; estos son quienes ven la <diversidad> y el mal de la conducta sin ley de los poderes. Otros dicen que las cosas existentes suceden por el destino; estos son quienes se ocuparon intensamente de esta cuestión. Otros dicen que se deben a la naturaleza, y otros, al azar. Sin embargo, la mayoría de quienes solo han llegado a percibir los elementos visibles no conocen nada más allá de ellos.


    Los sabios griegos y los bárbaros solo llegaron a comprender los poderes que recibieron el ser mediante la imaginación y el pensamiento vacío, <así como> los que procedieron de ellos mediante el conflicto y la conducta rebelde que actuaba entre ellos. Por consiguiente, cuando hablaron acerca de aquello que consideraban sabiduría, fueron engañados por un <simulacro>. Creyeron haber alcanzado la verdad, [] pero habían caído en el error. Este error no se limitaba a nombres de poca importancia; los poderes mismos les impedían avanzar al convencerlos de que habían <comprendido> la Totalidad.


    En consecuencia, el orden comenzó a luchar contra sí mismo por la enemistad orgullosa de [un descendiente] del arconte [superior], quien existía antes que él. Por eso hubo entre todos un desacuerdo absoluto acerca de todo: sobre la filosofía, las clases de medicina, las categorías de la retórica, las clases de música y los órdenes de la lógica. Todo eran opiniones y teorías. Así prevaleció la <palabrería>, y <ellos> quedaron confundidos porque eran incapaces de explicar <a aquellos> que poseen poder y que les dieron sus teorías.


    En cuanto a las cosas que surgieron entre la <nación> de los hebreos —los escritos de los materiales, <cuyo> ejemplo imitan los griegos, y todo lo que concibieron para expresarlo—, los poderes de la derecha <…>, que inspiraron a todos ellos a razonar <con> palabras y mediante una representación de sí mismos. Así emprendieron el camino para alcanzar la verdad valiéndose de la variedad mezclada de poderes que actuaba en ellos.


    Después alcanzaron el orden de los poderes sin mezcla, <antes de> alcanzar al que fue establecido conforme a la semejanza del Padre. Él no es invisible [] <por su> naturaleza, sino porque una sabiduría lo oculta a fin de preservar la forma de lo que es verdaderamente invisible. Por eso, muchos ángeles no han podido llegar a contemplarlo. Los miembros de la nación hebrea que mencionamos antes, es decir, los justos y los profetas, no pensaron ni dijeron nada nacido de la imaginación, de una imagen ilusoria o de un pensamiento abstruso. Por el contrario, cada uno, mediante el poder que actuaba en él y atento a lo que veía y oía, habló con precisión. Hablaron en armonía unos con otros y de común acuerdo, como los poderes que actuaban en ellos, porque conservaron su <unidad> y su armonía mutua. Esto fue así, sobre todo, porque alababan al que era más elevado que ellos y al que era mayor que ellos, quien existía y había sido establecido porque lo necesitaban.


    Esto lo produjo entre ellos la Palabra espiritual, como en alguien que necesita al Exaltado: con esperanza y espera confiada, conforme al pensamiento que es la semilla de salvación, y con una palabra iluminadora que es la memoria, junto con su descendencia y sus emanaciones, que son los justos y los profetas antes mencionados. Ellos conservan la alabanza de sus padres y su testimonio acerca de lo que es grande. Estos llegaron a existir [] con esperanza expectante y atención; en ellos fue sembrada <la> semilla de la oración y de la búsqueda, la cual también es sembrada en los muchos que han procurado ser fortalecidos. Ella se manifiesta y los mueve a amar al Exaltado y a proclamar que estas cosas pertenecen al Uno y Único.


    Algo singular actuaba en ellos cuando hablaban. Sin embargo, sus visiones y sus palabras eran diversas debido a la diversidad de quienes les comunicaban esas visiones y palabras. Por eso, quienes han prestado atención a lo que dijeron no rechazan ninguna parte, sino que han aceptado las Escrituras con diversas interpretaciones. Esto condujo al establecimiento de distintos grupos que existen hasta hoy entre los judíos. Algunos dicen que Dios es uno, el que habló en las antiguas Escrituras. Otros dicen que es múltiple; algunos, en cambio, afirman que Dios es simple y que por naturaleza es una sola mente. Otros dicen que sus obras están relacionadas con los orígenes del bien y del mal. Otros afirman que él mismo es el creador de cuanto llegó a existir, mientras que otros dicen que [] creó por medio de los ángeles. Esta diversidad de ideas refleja la diversidad de formas y la riqueza de tipos de Escritura, que produjeron a sus maestro<s> de la Ley.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: orders
  choice: órdenes
  rationale: Conserva el vocabulario cosmológico y jerárquico del testimonio sin reducirlo a grupos meramente humanos.
- source_word: powers
  choice: poderes
  rationale: Mantiene la posible referencia a entidades o fuerzas y evita precisar su naturaleza más allá del testimonio.
- source_word: passion
  choice: pasión
  rationale: Preserva la amplitud del término, que puede indicar impulso, afección o comportamiento compartido.
- source_word: providence
  choice: providencia
  rationale: Es el equivalente filosófico y religioso tradicional, comprensible en español actual.
- source_word: fate
  choice: destino
  rationale: Expresa la causalidad determinada indicada por el testimonio sin introducir terminología técnica no confirmada.
- source_word: simulacrum
  choice: simulacro
  rationale: Retiene la noción de apariencia o copia engañosa y el tono filosófico del pasaje.
- source_word: archon
  choice: arconte
  rationale: Se translitera el término técnico para no equipararlo sin certeza con gobernante, príncipe u otra figura.
- source_word: Totality
  choice: Totalidad
  rationale: La mayúscula señala su uso como concepto cosmológico global, conforme al testimonio.
- source_word: spiritual Word
  choice: Palabra espiritual
  rationale: Conserva la personificación y evita decidir si debe entenderse técnicamente como Logos.
- source_word: the Exalted One
  choice: el Exaltado
  rationale: Mantiene el título relacional sin identificarlo de manera denominacional.
- source_word: the One and Only
  choice: el Uno y Único
  rationale: Preserva la fuerza titular y la tensión entre unidad divina y las posteriores opiniones diversas.
- source_word: material ones
  choice: los materiales
  rationale: Mantiene la categoría antropológica o cosmológica del escrito, aunque resulte técnica, sin reinterpretarla como materialistas.
theological_decisions:
- issue: Relación entre los órdenes de la derecha y de la izquierda
  choice: Conservar la imitación mutua y la mezcla moral descritas
  alternative: Presentar a la derecha como invariablemente buena y a la izquierda como invariablemente mala
  rationale: El pasaje atribuye conductas imitativas a ambos órdenes y no permite resolver la tensión mediante categorías doctrinales posteriores.
- issue: Naturaleza del ser establecido conforme a la semejanza del Padre
  choice: Mantener referentes pronominales y descripción sin identificarlo
  alternative: Identificarlo explícitamente con Cristo, el Demiurgo u otra figura
  rationale: El testimonio suministrado no fija inequívocamente esa identidad.
- issue: Invisibilidad y ocultamiento
  choice: Traducir que no es invisible por naturaleza, sino porque una sabiduría lo oculta
  alternative: Armonizar la frase con una doctrina de invisibilidad esencial
  rationale: Se conserva la afirmación paradójica y la distinción explícita del texto.
- issue: Inspiración de los justos y profetas
  choice: Conservar tanto su precisión y armonía como la diversidad de visiones y palabras
  alternative: Uniformar toda revelación profética o considerarla enteramente contradictoria
  rationale: El pasaje sostiene simultáneamente unidad operativa y diversidad expresiva.
- issue: Opiniones judías acerca de Dios y la creación
  choice: Presentarlas como opiniones diversas sin adjudicarles corrección
  alternative: Señalar una como ortodoxa o reinterpretar las demás
  rationale: La sección cataloga desacuerdos y no autoriza una resolución confesional añadida.
- issue: Creación por medio de ángeles
  choice: Preservar la formulación como una opinión atribuida a algunos
  alternative: Afirmarla o negarla editorialmente
  rationale: Evita importar una posición teológica externa.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron los corchetes, los paréntesis angulares y la elipsis como señales de laguna, suplemento o restauración del testimonio. No se añadieron marcadores de nota porque no se incorporaron notas al texto. Borrador necesariamente provisional: la evidencia suministrada es un testimonio inglés de dominio público y la revisión directa del copto del Códice de Nag Hammadi I,5 sigue pendiente.'
