lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico habitual para las entidades o realidades emanadas en la cosmología del tratado, sin sustituirlo por una interpretación explicativa.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidad
  rationale: Mantiene la distinción numérica y el carácter técnico de la terminología del testimonio, aun cuando su referente exacto sea ambiguo.
- source_word: deficiency / deficient one
  choice: deficiencia / el deficiente
  rationale: Reproduce el campo léxico recurrente y evita identificar de manera no explícita al personaje o estado aludido.
- source_word: Fullness
  choice: Plenitud
  rationale: Equivalente técnico claro y tradicional, sin insertar el término griego Pleroma, no presente en el testimonio suministrado.
- source_word: Paraclete
  choice: Paráclito
  rationale: La transliteración asentada conserva el carácter titular y la amplitud semántica del término.
- source_word: the Well-Pleasing One
  choice: el Complaciente
  rationale: Expresa que esta figura es objeto de complacencia o agrado, manteniendo el título sustantivado sin confundirlo con alguien que busca complacer.
- source_word: Appointed Ones
  choice: Escogidos
  rationale: Ofrece una expresión natural para quienes han sido designados, sin desarrollar una doctrina específica de elección.
- source_word: without sight
  choice: aquel que carece de vista
  rationale: Conserva la imagen de ceguera o falta de visión sin decidir si debe entenderse física, intelectual o espiritualmente.
theological_decisions:
- issue: La caída de los eones y la disposición del Padre
  choice: «ocurrió solo como si fuera una experiencia propia, dispuesta por el Padre»
  alternative: «fue una caída real causada directamente por el Padre»
  rationale: Preserva la formulación paradójica del testimonio y no convierte la providencia o planificación en causalidad doctrinal más precisa de lo que permite el texto.
- issue: Origen del Hijo como fruto de la armonía de los eones
  choice: Mantener que las Totalidades «produjeron el fruto» y que este es el Hijo amado
  alternative: Reformularlo según categorías trinitarias posteriores
  rationale: El pasaje articula su propia teología emanacionista; la traducción no debe armonizarla con credos o sistemas posteriores.
- issue: Relación entre el Hijo, el Padre y las Totalidades
  choice: Conservar las afirmaciones de que el Padre y las Totalidades habitan en él y fueron colocados dentro de él
  alternative: Explicarlas como mera representación simbólica
  rationale: La ontología exacta permanece abierta en el texto; no se resuelve si se trata de presencia, inclusión, representación o manifestación.
- issue: Perfeccionamiento del deficiente
  choice: «alcanzara la perfección» y «perfeccionó»
  alternative: «fuera moralmente santificado»
  rationale: Evita reducir la perfección cosmológica o cognitiva del tratado a una categoría moral o confesional concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos cosmológicos técnicos y las ambigüedades de referente. Los corchetes y puntos suspensivos reproducen lagunas del testimonio; los ángulos señalan texto suplido por sus editores. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,5.
