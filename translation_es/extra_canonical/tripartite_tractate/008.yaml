translation:
  language: es
  text: 'Él no reveló de una sola vez las diversas cualidades a las Totalidades, ni reveló su igualdad consigo mismo a quienes procedieron de él. Todos los que procedieron de él, <que> son los eones de los eones, [a] puesto que [son] emanaciones y descendencia de <su> naturaleza procreadora, también <procrean>, conforme a su propia naturaleza procreadora, para gloria del Padre, quien es la causa que los estableció. Como ya dijimos, él crea los eones como raíces, fuentes y padres; y es a él a quien glorifican, porque posee conocimiento y sabiduría, y porque las Totalidades reconocieron que procedieron del conocimiento y la sabiduría de la Totalidad.


    Si los de la Totalidad hubieran dado gloria conforme a las <capacidades> propias de cada eón, lo que habrían producido no habría sido más que un tenue reflejo del Padre, quien es la Totalidad. Por eso, en el canto de gloria y en el poder de la unidad de él, de la cual procedieron, fueron llevados a una unión, una mezcla y una unidad entre sí. Desde la asamblea de la Plenitud ofrecieron al Padre una glorificación digna: una imagen única y, a la vez, múltiple, porque fue producida para gloria del Único y porque ellos se acercaron a aquel que es él mismo las Totalidades.


    Fue una alabanza [de los eones] a quien produjo las Totalidades, como primicia de los inmortales y como uno eterno.[b] Esto se debía a que, habiendo surgido de los eones vivientes, perfectos y plenos gracias al Perfecto y Pleno, el estado pleno y perfecto de quienes glorificaron de manera perfecta quedó intacto por causa de la comunión, al igual que el Padre perfecto, quien, al ser glorificado, oye también la glorificación que [lo] glorifica, para manifestar que ellos también son lo que él es.


    La razón del segundo honor que se les concedió fue lo que el Padre les devolvió cuando ellos conocieron el don que les permitía dar fruto unos con otros para el Padre. El resultado fue que, así como <fueron> engendrados gloriosamente para el Padre, también se manifestaron de manera perfecta en el acto de glorificar.


    Ellos fueron padres de la tercera glorificación, acorde con la libertad y el poder engendrados junto con ellos, que les otorgaban la capacidad de glorificar juntos y de glorificar individualmente por voluntad propia. Ellos eran la primera y la segunda glorificaciones, de modo que ambas son perfectas y plenas, pues son manifestaciones del Padre perfecto y pleno y de aquellas realidades perfectas que surgieron de la glorificación del Perfecto. Sin embargo, el fruto de la tercera glorificación comprende la voluntad de cada eón y cada una de las cualidades y potestades del Padre. El fruto existe completo y perfecto en la medida en que la gloria que los eones desean y pueden dar al Padre surge tanto de su común acuerdo como de cada uno individualmente. Esto es lo que él ama y aquello sobre lo cual ejerce poder, pues por medio de esto el Padre es glorificado. Por eso son mentes de mentes, que resultan ser palabras de palabras, ancianos de ancianos y grados de grados, exaltados unos sobre otros.


    Cada uno que da gloria tiene su lugar, su exaltación, su morada y su reposo, que constituyen la gloria que ofrece. Todos los que glorifican al Padre tienen una generación eterna: engendran ayudándose mutuamente, porque las emanaciones son infinitas e inconmensurables y porque no hay rastro de envidia en el Padre hacia quienes procedieron de él en cuanto a que engendren algo igual o semejante a él, ya que él existe en las Totalidades, engendrando y revelándose. A quien quiere lo hace padre, y él es verdaderamente su Padre; a quien quiere lo hace dios, y él es verdaderamente su Dios; y los hace las Totalidades, <para quienes> él es la Totalidad.[c] En sentido estricto, todos los grandes nombres están reservados allí: los nombres que comparten los ángeles, quienes llegaron a existir en el mundo junto con los arcontes, aunque no tienen semejanza alguna con los seres eternos.'
