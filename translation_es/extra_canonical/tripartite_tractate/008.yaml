    reason: Preserva una ambigüedad real del testimonio inglés, pendiente de revisión directa del copto.
  - marker: c
    text: Después de esta frase hay otra laguna en el manuscrito.
    reason: Señala una discontinuidad textual que puede afectar la conexión con la oración siguiente.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico de la cosmología del tratado sin reducirlo simplemente a «edades» o «seres eternos».
- source_word: Totalities / Totality
  choice: las Totalidades / la Totalidad
  rationale: Mantiene la distinción numérica y el carácter técnico de las expresiones del testimonio, aun cuando su referente permanezca parcialmente ambiguo.
- source_word: Fullness
  choice: la Plenitud
  rationale: Traducción tradicional y transparente del concepto técnico, diferenciada de «Totalidad».
- source_word: procreative nature
  choice: naturaleza procreadora
  rationale: Preserva el énfasis del pasaje en la capacidad generativa; «fecunda» sería más idiomático, pero menos explícito.
- source_word: emanations and offspring
  choice: emanaciones y descendencia
  rationale: Distingue el proceso de procedencia de su resultado personal o colectivo.
- source_word: archons
  choice: arcontes
  rationale: Retiene el término técnico histórico para las potestades gobernantes de esta cosmología.
- source_word: words of words
  choice: palabras de palabras
  rationale: No se cambia a «logos» ni a «verbos», pues la evidencia suministrada no permite precisar ese matiz y conviene preservar la formulación enigmática.
theological_decisions:
- issue: La relación de los eones con el Padre
  choice: Se conservan afirmaciones como «ellos también son lo que él es» y «algo igual o semejante a él».
  alternative: Atenuar estas expresiones como mera participación o parecido subordinado.
  rationale: El texto presenta deliberadamente una fuerte tensión entre procedencia, semejanza e identidad; explicarla doctrinalmente excedería la evidencia disponible.
- issue: Uso de «dios» para quienes el Padre constituye como tales
  choice: «A quien quiere lo hace dios».
  alternative: «lo hace divino» o «lo convierte en un dios».
  rationale: La traducción directa conserva la ambigüedad ontológica y evita tanto diluirla como imponer una lectura politeísta más explícita.
- issue: Primera, segunda y tercera glorificaciones
  choice: Se mantiene la secuencia sin identificar de manera especulativa cada glorificación.
  alternative: Añadir sujetos o etapas cosmológicas no expresados en el testimonio.
  rationale: La sintaxis y los referentes son difíciles; una aclaración doctrinal podría resolver indebidamente una ambigüedad genuina.
- issue: El Padre como Totalidad y las plural «Totalidades»
  choice: Se conserva la alternancia entre singular y plural.
  alternative: Uniformar todo como «el Todo».
  rationale: La alternancia parece significativa en la argumentación y no debe eliminarse sin revisión directa del copto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los tecnicismos cosmológicos «eones», «Plenitud» y «arcontes». Se mejoró la fluidez sintáctica sin ocultar repeticiones conceptuales, referentes difíciles ni tensiones teológicas. Borrador provisional basado en el testimonio inglés de dominio público; queda pendiente la revisión directa de la fuente copta del Códice I,5 de Nag Hammadi.
