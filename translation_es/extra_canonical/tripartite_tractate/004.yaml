translation:
  language: es
  text: '[. . .] la Iglesia existe en las cualidades y los atributos en los que existen el Padre y el Hijo, como he dicho desde el principio. Por tanto, subsiste en los nacimientos de incontables eones.[a] Conforme a las cualidades y los atributos en los que [existe] la Iglesia, los eones también engendran de manera incalculable. Esto se debe a que estos eones [constituyen] la unidad de la Iglesia, la cual [forman] unos con otros, [con aquellos] que han procedido de [ellos y] con el Hijo, para cuya gloria existen.


    Por tanto, es imposible que la mente los conciba, aunque él sea la perfección de aquel lugar.[b] Tampoco puede el habla describirlos, pues son indecibles, innombrables e inasibles. Solo ellos pueden darse nombre y concebirse a sí mismos, porque no están arraigados en estos lugares. Los que están en aquel lugar son indecibles e incontables dentro del orden [que es] tanto [el modo] como la dimensión, el regocijo y la alegría de aquel que no fue engendrado, que carece de nombre, es innombrable, inasible, invisible e inconcebible. Esta es la plenitud de la paternidad, de modo que sus riquezas son un nacimiento.


    [] [. . .] de los eones habitaban eternamente en el pensamiento, porque el Padre era para ellos como pensamiento y lugar. Una vez establecidas sus generaciones, aquel que tiene el dominio total quiso apoderarse de lo que faltaba en el [. . .] y hacerlo salir, y produjo a quienes [estaban dentro de] él. Sin embargo, por ser [como] es, [él es] un manantial que no mengua por el agua que fluye abundantemente de él.


    Mientras habitaban en el pensamiento del Padre, es decir, en la profundidad oculta, la profundidad los conocía, pero ellos no podían conocer la profundidad en la que habitaban. Les era imposible conocerse a sí mismos o conocer cualquier otra cosa. En otras palabras, habitaban con el Padre, pero su existencia no era para sí mismos. Más bien, existían solo como existe una semilla, y así resultó que existían como un feto. Los engendró como por medio de una palabra, mientras subsistían en forma seminal, y aquellos a quienes iba a engendrar todavía no habían llegado a existir procedentes de él.


    [] El Padre fue quien primero pensó en ellos. Sembró un pensamiento como si fuera una semilla, no solo para que existieran por causa de él, sino también para que existieran por causa de sí mismos; para que entonces existieran en su pensamiento como seres capaces de conocer y existieran también por causa de sí mismos. A fin de que pudieran conocer lo que existe por causa de ellos, generosamente [les concedió] la forma inicial; y para que [pudieran] conocer [quién es el Padre], el que existe por causa de ellos, les concedió el nombre de Padre mediante una voz que les declaró que todo cuanto existe, existe por aquel nombre, el cual les pertenece. Esto se debe a que alcanzaron el ser por la exaltación que habita en el nombre, una exaltación que no llegaron a reconocer. Mientras es un feto, un niño tiene lo suficiente para sí mismo, aunque todavía no ve a quien lo sembró. Por tanto, su única tarea era buscarlo, reconociendo que existe y deseando constantemente descubrir lo que existe.


    Sin embargo, como el Padre perfecto es bueno, no se <cerró> a ellos para hacerlos existir eternamente solo en su pensamiento, sino que les concedió alcanzar también una existencia por causa de sí mismos. Del mismo modo, les dio el don de conocer lo que es, es decir, a aquel que se conoce eternamente a sí mismo. [] [. . .] recibir forma [para conocer] que existe El Que Es,[c] tal como las personas que, al nacer en este lugar, entran en la luz para poder ver a quienes las engendraron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eones» es un término técnico del tratado para realidades o seres eternos emanados; aquí no significa simplemente períodos de tiempo.
    reason: Aclara un tecnicismo indispensable sin incorporarle al cuerpo una interpretación doctrinal extensa.
  - marker: b
    text: El referente de «él» y la relación sintáctica de esta cláusula son inciertos en el testimonio disponible; también podría entenderse que la mente misma es «la perfección de aquel lugar».
    reason: Preserva una ambigüedad genuina de la formulación y evita presentar como segura una identificación dudosa.
  - marker: c
    text: «El Que Es» funciona aquí como título. La expresión conserva el énfasis del pasaje en el ser o la existencia sin identificarlo de manera más específica.
    reason: Señala la función titular y evita una armonización teológica no exigida por el texto.
lexical_decisions:
- source_word: Church
  choice: Iglesia
  rationale: Conserva el término técnico y colectivo del testimonio, con mayúscula por su función como realidad trascendente personificada en el pasaje.
- source_word: aeons
  choice: eones
  rationale: Mantiene el tecnicismo cosmológico del tratado en vez de reducirlo a «edades» o «eras», que ocultaría su referencia a entidades emanadas.
- source_word: births / give birth / begot
  choice: nacimientos / engendran / engendró
  rationale: Reproduce la imaginería generativa sostenida en el texto sin uniformar mecánicamente formas verbales y sustantivas distintas.
- source_word: depth
  choice: profundidad
  rationale: Preserva tanto el sentido espacial como la posible personificación, incluida la frase «la profundidad los conocía».
- source_word: spermatic form / spermatic seed
  choice: forma seminal / semilla
  rationale: «Seminal» conserva el sentido técnico de existencia en potencia; «semilla» ofrece una expresión natural donde el contexto ya explicita la comparación.
- source_word: He Who Is
  choice: El Que Es
  rationale: Mantiene el título ontológico sin sustituirlo por una identificación confesional más específica.
theological_decisions:
- issue: Naturaleza de los eones
  choice: Se conserva «eones» como designación de seres o realidades engendradas.
  alternative: Traducir «edades», «eras» o explicar que son emanaciones.
  rationale: El pasaje atribuye a los eones acciones personales y una función constitutiva respecto de la Iglesia; una paráfrasis doctrinal resolvería más de lo que permite el testimonio.
- issue: Relación de la Iglesia con el Padre, el Hijo y los eones
  choice: Se mantiene el lenguaje de existencia, nacimientos y unidad sin sistematizarlo.
  alternative: Explicarlo en términos de una eclesiología posterior o de una cosmología gnóstica definida.
  rationale: La sintaxis transmite una relación metafísica compleja y parcialmente dañada que no debe armonizarse con sistemas posteriores.
- issue: «El que existe por causa de ellos»
  choice: Se conserva la afirmación tal como aparece en el testimonio.
  alternative: Cambiarla a «aquel por cuya causa existen» para evitar tensión teológica.
  rationale: Aunque la formulación resulta inesperada, invertirla resolvería silenciosamente una dificultad real del texto transmitido.
- issue: Conocimiento de «lo que es» y «El Que Es»
  choice: Se preservan ambas formulaciones y su tensión entre objeto impersonal y título personal.
  alternative: Uniformarlas como «Dios» o «el Ser».
  rationale: La variación puede ser significativa y no debe eliminarse sin revisión directa del copto.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se preservan los corchetes, las elipsis y los signos editoriales del testimonio: los corchetes marcan restauraciones o lagunas, y los ángulos una corrección o adición editorial. Dado que la revisión directa del copto está pendiente, la redacción sigue de cerca el testimonio inglés público, pero procura una sintaxis española natural. Se mantienen deliberadamente términos técnicos como «eones», «forma seminal» y «El Que Es», así como las tensiones metafísicas del pasaje.'
