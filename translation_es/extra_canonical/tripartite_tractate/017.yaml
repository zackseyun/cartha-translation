translation:
  language: es
  text: 'El pensamiento del Verbo, que había recuperado su estabilidad y había llegado a gobernar sobre quienes llegaron a existir por medio de él, fue llamado «Eón»[a] y «Lugar» para todos los que había producido de acuerdo con la decisión; también fue llamado «Sinagoga de la Salvación»[b], porque se sanó de la dispersión propia del pensamiento múltiple y volvió al pensamiento único. De igual manera, se lo llama «Depósito», por el reposo que alcanzó y que se concedió a sí mismo solamente. […] También se lo llama «Novia», por la alegría de aquel que se entregó a él con la esperanza de obtener fruto de la unión, es decir, de aquel que se le apareció. Asimismo, se lo llama «Reino», por la firmeza que alcanzó mientras se alegraba de ejercer dominio sobre quienes habían combatido contra él. Y se lo llama «Alegría del Señor», por el gozo con el que se revistió. La luz permanece con él y le da recompensa por los bienes que le pertenecen, es decir, los pensamientos de libertad.


    El eón que mencionamos antes está por encima de los dos órdenes que combaten entre sí. No es compañero de quienes ejercen dominio ni pertenece a las dolencias y debilidades, cosas relacionadas con el recuerdo y la semejanza. Aquello en lo que el Verbo se estableció era un eón lleno de alegría, que poseía la forma de la materia y, a la vez, la naturaleza de su causa, la cual fue revelada, pues era una imagen de quienes habitan en la Plenitud[c] y llegaron a existir a partir de las riquezas del deleite de Aquel que Es.


    Además, al alegrarse ante el rostro de quien se reveló, en su <deleite>, su expectativa y la promesa de lo que había pedido, poseyó el nombre del Hijo, así como su esencia, su poder y su forma. Él es aquel a quien amó y en quien se deleitó, […] aquel por quien se habían ofrecido oraciones con amor. Este eón era una luz, un deseo de alcanzar firmeza, una disposición para aprender y un ojo para ver; estas cualidades las recibió de los seres exaltados. Además, era sabiduría para su pensamiento frente a quienes estaban situados más abajo en el plan de salvación, palabra para hablar y perfección de otras cosas semejantes.


    Los que tomaron forma junto con él conforme a la imagen de la Plenitud tienen como padres a quienes se revelaron, pues cada uno es copia de una de las figuras. Como son formas de masculinidad y no proceden de la debilidad que es la feminidad,[d] se originan en aquel que ya había huido de la debilidad. <Ellos> llevan el nombre de «Iglesia», porque reproducen armoniosamente la armonía de la asamblea de quienes han llegado a manifestarse. Lo que llegó a existir a imagen de la luz también es perfecto, pues es imagen de la única luz existente, que es las Totalidades.[e] Aunque era inferior a aquel cuya imagen es, conserva su inseparabilidad, porque es un rostro de la luz inseparable.


    Sin embargo, los que llegaron a existir a imagen de cada uno de los eones son, en esencia, lo que mencionamos antes; pero en su energía no son iguales, porque esta reside de manera diferente en cada uno de ellos. En su unión mutua son iguales, […] pero cada <eón> ha conservado las diferencias que le son propias. Por eso tienen pasiones —y la pasión es una debilidad—, pues no fueron producidos a partir de la unidad de la Plenitud, sino prematuramente, a partir de uno solo antes de que este la recibiera del Padre, o antes de la unión con su Totalidad y su voluntad.


    A pesar de esto, aquello fue beneficioso para el futuro plan de salvación. Se les permitió pasar por los lugares inferiores, porque esos lugares no pueden recibir su llegada repentina, sino solo uno a la vez. Su llegada es necesaria, pues por medio de ellos todo será llevado a su culminación.


    En resumen, el Verbo recibió la visión de todo: de lo que fue, de lo que ahora es y de lo que será, porque se le ha confiado el plan de salvación de todo cuanto existe. Algunas cosas ya alcanzaron la existencia porque había un propósito para ello. En cambio, las semillas que todavía no existen las conservó dentro de sí, debido a la promesa relacionada con lo que había concebido, una promesa acerca de semillas que aún habrían de existir. Y produjo su descendencia, es decir, la revelación de lo que había concebido. Sin embargo, durante un tiempo se impidió que las semillas prometidas llegaran a existir, porque han sido destinadas a una misión para cuando venga el Salvador junto con sus compañeros, los primeros en el conocimiento y la gloria del Padre.


    [a] «Eón» translitera un término técnico que aquí puede designar tanto una realidad eterna como un ámbito del orden divino.

    [b] «Sinagoga» conserva el sentido básico de reunión o congregación; el pasaje emplea después «Iglesia» y «asamblea» dentro de la misma red de imágenes comunitarias.

    [c] «Plenitud» traduce el término técnico conocido también como «Pleroma», referido aquí al ámbito de la totalidad divina.

    [d] «Masculinidad» y «feminidad» reproducen las categorías simbólicas del tratado; no constituyen una afirmación general sobre hombres y mujeres.

    [e] «Las Totalidades» conserva una expresión técnica y deliberadamente inusual del tratado para el conjunto pleno de las realidades divinas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eón» translitera un término técnico que aquí puede designar tanto una realidad eterna como un ámbito del orden divino.
    reason: El término no tiene un equivalente español único y «era» sería insuficiente en este contexto.
  - marker: b
    text: «Sinagoga» conserva el sentido básico de reunión o congregación; el pasaje emplea después «Iglesia» y «asamblea» dentro de la misma red de imágenes comunitarias.
    reason: Aclara la relación léxica sin borrar los distintos nombres empleados por el tratado.
  - marker: c
    text: «Plenitud» traduce el término técnico conocido también como «Pleroma», referido aquí al ámbito de la totalidad divina.
    reason: Ayuda al lector a reconocer un concepto cosmológico especializado.
  - marker: d
    text: «Masculinidad» y «feminidad» reproducen las categorías simbólicas del tratado; no constituyen una afirmación general sobre hombres y mujeres.
    reason: Evita que el lenguaje cosmológico antiguo se lea como una generalización antropológica añadida por la traducción.
  - marker: e
    text: «Las Totalidades» conserva una expresión técnica y deliberadamente inusual del tratado para el conjunto pleno de las realidades divinas.
    reason: Explica una construcción española extraña que reproduce un tecnicismo del testimonio.
lexical_decisions:
- source_word: Word
  choice: Verbo
  rationale: En este contexto cosmológico, «Verbo» conserva el valor personal y técnico de Logos mejor que el sustantivo común «palabra»; se reserva «palabra» para la facultad de hablar más adelante.
- source_word: Aeon
  choice: Eón
  rationale: Se mantiene el tecnicismo de la literatura gnóstica, ya que «era» o «edad» reducirían indebidamente su sentido como entidad o ámbito divino.
- source_word: Place
  choice: Lugar
  rationale: La traducción literal conserva su función de nombre o título cosmológico sin interpretarla como un espacio meramente físico.
- source_word: Synagogue of Salvation
  choice: Sinagoga de la Salvación
  rationale: «Sinagoga» preserva la designación distintiva y su vínculo etimológico con reunión, aclarado en nota.
- source_word: Storehouse
  choice: Depósito
  rationale: «Depósito» expresa un lugar donde algo se guarda sin introducir la connotación comercial moderna de «almacén».
- source_word: Fullness
  choice: Plenitud
  rationale: Es una traducción española natural del término técnico Pleroma y evita imponer una transliteración sin explicación.
- source_word: He Who Is
  choice: Aquel que Es
  rationale: Conserva el título ontológico y su solemnidad sin identificarlo explícitamente con una formulación doctrinal posterior.
- source_word: Church
  choice: Iglesia
  rationale: Retiene el título comunitario tradicional, mientras que «asamblea» traduce su explicación conceptual en la misma oración.
- source_word: Totalities
  choice: las Totalidades
  rationale: Se conserva el plural técnico e inusual, en vez de normalizarlo como «el Todo» y borrar una distinción posible.
- source_word: energy
  choice: energía
  rationale: Mantiene la contraposición técnica entre esencia y operación activa, sin reducirla a mera capacidad o fuerza.
- source_word: passions
  choice: pasiones
  rationale: Conserva la categoría antropológica y cosmológica del testimonio, aquí definida expresamente como debilidad.
- source_word: plan of salvation
  choice: plan de salvación
  rationale: Es claro y natural en español y no especifica más de lo que afirma el texto sobre la administración salvífica.
theological_decisions:
- issue: El Verbo parece sanarse a sí mismo de la dispersión
  choice: «se sanó de la dispersión»
  alternative: «fue sanado de la dispersión»
  rationale: El testimonio suministrado presenta una forma reflexiva. Se conserva la tensión de que el Verbo sea agente y beneficiario de su restauración.
- issue: Identidad de quien se entrega, se aparece, ama y se deleita
  choice: Se conservan los pronombres y la secuencia relacional con mínima aclaración sintáctica
  alternative: Identificar expresamente al revelador como Padre, Hijo o Salvador
  rationale: Los referentes son ambiguos en el testimonio; identificarlos añadiría una interpretación teológica no asegurada.
- issue: Forma de la materia y naturaleza de su causa
  choice: Se mantiene la afirmación paradójica de ambas propiedades
  alternative: Entender «materia» como mera apariencia o como sustancia material ordinaria
  rationale: El texto contrapone y relaciona ambas expresiones; resolver la tensión alteraría su cosmología.
- issue: Masculinidad, feminidad y debilidad
  choice: Se traduce formalmente y se añade una nota contextual
  alternative: Neutralizar las categorías de género o convertirlas en una enseñanza antropológica general
  rationale: Las categorías forman parte del simbolismo cosmológico del tratado, pero no deben universalizarse como juicio sobre sexos humanos.
- issue: Origen prematuro fuera de la unidad de la Plenitud
  choice: Se conserva la alternativa introducida por «o»
  alternative: Fundir ambas cláusulas como una sola explicación causal
  rationale: La sintaxis del testimonio permite más de una relación y debe preservarse la ambigüedad.
- issue: Consumación por medio de seres plurales
  choice: «por medio de ellos todo será llevado a su culminación»
  alternative: Atribuir la consumación exclusivamente al Salvador
  rationale: El pasaje asigna una función necesaria a este grupo plural; no se corrige conforme a una sistematización doctrinal externa.
- issue: Semillas reservadas y misión futura
  choice: Se conserva el lenguaje de semillas, promesa y misión
  alternative: Identificar las semillas con un grupo eclesial o espiritual específico
  rationale: El fragmento no define inequívocamente su identidad, por lo que se evita una identificación denominacional o sectaria.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los títulos cosmológicos con mayúscula cuando funcionan como nombres. Los corchetes con puntos suspensivos señalan lagunas del manuscrito reflejadas por el testimonio; los ángulos conservan restauraciones editoriales. El borrador es necesariamente provisional porque la evidencia suministrada es un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente.
