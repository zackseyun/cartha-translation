base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: es
  text: '<…> Así como los actos maravillosos de los silencios son generaciones eternas y descendencia intelectual, también las cualidades de la Palabra son emanaciones espirituales. Puesto que pertenecen al habla, [—][a] tanto [los actos maravillosos] como las cualidades son semillas y pensamientos de su descendencia, raíces vivas y eternas que aparecen como descendencia originada por sí misma y existen como mentes y descendencia espiritual para gloria del Padre.


    [Como son] espíritus y mentes, no necesitan sonido ni habla, ni necesitan realizar [acto alguno] para conseguir lo que desean [que se haga]. Más bien, siguiendo el modelo de la propia existencia [del Padre], [los] que proceden de él engendran cuanto desean. Y él tiene hijo<s>[b]: aquel en quien ellos piensan, de quien hablan, hacia quien se dirigen, en quien subsisten y a quien cantan himnos para glorificarlo. Esta es, en efecto, su capacidad de procrear: se asemejan a aquellos de quienes procedieron y actúan de acuerdo con la ayuda que comparten, pues se ayudan unos a otros como lo hacen los no engendrados.


    El Padre, conforme a su posición exaltada por encima de las Totalidades, es desconocido e incomprensible. Posee tal grandeza y magnitud que, si estas se revelaran de repente y de inmediato, destruirían a todos los seres elevados de entre los eones que procedieron de él. Por eso contuvo su fuerza y sus recursos infinitos, los cuales constituyen su [—] ser,[c] y [permaneció] inefable e innombrable, exaltado por encima de toda mente y de toda habla.


    Sin embargo, este es quien se extendió a sí mismo, y lo que extendió formó un fundamento, un lugar y una morada para el universo. Uno de sus nombres es «Aquel por quien», porque es el Padre de Todo. Mediante su labor en favor de los seres existentes, sembró en ellos el pensamiento de buscarlo. La riqueza de su […] [d] consiste en que comprenden que él existe e investigan lo que existía.'
