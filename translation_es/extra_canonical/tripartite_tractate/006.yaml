lexical_decisions:
- source_word: the silences
  choice: los silencios
  rationale: Conserva el plural personificado y la terminología técnica del testimonio sin reducirla a simple ausencia de sonido.
- source_word: the Word
  choice: la Palabra
  rationale: Mantiene la personificación y la mayúscula del término, con un español claro y menos confesionalmente marcado que «el Verbo».
- source_word: intellectual offspring
  choice: descendencia intelectual
  rationale: Preserva la relación explícita con la mente o el intelecto y evita interpretar la expresión como ideas meramente abstractas.
- source_word: self-originating offspring
  choice: descendencia originada por sí misma
  rationale: Reproduce la afirmación paradójica del testimonio sin resolver cómo se relaciona con la procedencia desde el Padre.
- source_word: subsist
  choice: subsisten
  rationale: Retiene el sentido ontológico y técnico, distinto de simplemente vivir o permanecer.
- source_word: unbegotten
  choice: no engendrados
  rationale: Traducción formal que conserva la categoría cosmológica sin sustituirla por una explicación doctrinal.
- source_word: Totalities
  choice: Totalidades
  rationale: La mayúscula y el plural señalan un posible término técnico del tratado y preservan su amplitud semántica.
- source_word: aeons
  choice: eones
  rationale: Emplea la transliteración habitual para las entidades o ámbitos de la cosmología gnóstica, sin identificarlos con simples épocas.
- source_word: unspeakable and unnameable
  choice: inefable e innombrable
  rationale: 'Mantiene la doble negación conceptual: no puede expresarse ni recibir nombre.'
- source_word: the One by Whom
  choice: Aquel por quien
  rationale: Conserva la forma titular y la relación instrumental deliberadamente incompleta del original mediado.
theological_decisions:
- issue: La relación entre el Padre y la descendencia que aparece como originada por sí misma
  choice: Conservar ambas afirmaciones sin armonizarlas
  alternative: Explicar que la descendencia solo parece autooriginada o que en realidad es engendrada directamente por el Padre
  rationale: El pasaje sostiene una tensión entre procedencia, generación y autoorigen; resolverla introduciría una interpretación no exigida por el testimonio.
- issue: La identidad de «aquel» en quien piensan, hablan y subsisten
  choice: Mantener el referente en singular sin identificarlo explícitamente con el Padre, la Palabra u otra entidad
  alternative: Reemplazar «aquel» por «el Padre» o «la Palabra»
  rationale: La sintaxis del testimonio permite una referencia teológica, pero no autoriza una identificación inequívoca.
- issue: La capacidad destructiva de la revelación de la grandeza del Padre
  choice: Traducirla como una afirmación real dentro de la cosmología del texto
  alternative: Atenuarla como metáfora de incomprensibilidad
  rationale: El testimonio afirma que la revelación repentina destruiría a los seres elevados; no corresponde espiritualizar la declaración.
- issue: El título «Aquel por quien»
  choice: Preservar su formulación relacional abierta
  alternative: Completarlo como «Aquel por quien existen todas las cosas»
  rationale: Completar el título añadiría contenido plausible pero ausente del testimonio conservado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron mayúsculas en términos personificados o técnicos («Padre», «Palabra», «Totalidades») y se mantuvieron corchetes, ángulos y elipsis como señales editoriales. El borrador es necesariamente provisional porque se basa en el testimonio inglés público suministrado y queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,5.
