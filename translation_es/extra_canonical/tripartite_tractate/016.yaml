  footnotes:
  - marker: a
    text: Los signos angulares indican una palabra suplida editorialmente en el testimonio de traducción consultado.
    reason: Conservar de manera visible la señal de reconstrucción textual.
  - marker: b
    text: El manuscrito presenta una laguna en este punto; no es posible determinar aquí las palabras perdidas.
    reason: Representar la señal de daño manuscrito indicada por los corchetes vacíos del testimonio.
  - marker: c
    text: El testimonio consultado suple editorialmente el elemento correspondiente a «quienes»; en español se expresa mediante «se» dentro de la construcción «se le habían aparecido».
    reason: Preservar la indicación de suplemento sin producir una frase antinatural.
  - marker: d
    text: Hay una laguna manuscrita después de «alabó». La relación exacta entre las cláusulas, así como algunos referentes pronominales, permanece incierta.
    reason: Advertir que la sintaxis y la identificación de los participantes no pueden establecerse con plena seguridad.
  - marker: e
    text: El referente de «esta/ella» no es inequívoco en el testimonio disponible.
    reason: Preservar la ambigüedad genuina de la frase final.
lexical_decisions:
- source_word: Word
  choice: Palabra
  rationale: Conserva la personificación y evita imponer «Verbo» cuando la revisión directa del copto aún está pendiente.
- source_word: Fullness
  choice: Plenitud
  rationale: Mantiene el término técnico del tratado y su relación conceptual con la totalidad perfecta.
- source_word: Repose
  choice: Reposo
  rationale: Se conserva como entidad o realidad personificada mediante mayúscula inicial.
- source_word: aeons
  choice: eones
  rationale: Transliteración técnica asentada en español para las realidades supramundanas del marco conceptual del tratado.
- source_word: Totalities
  choice: Totalidades
  rationale: Retiene el carácter colectivo y técnico del original inglés sin reducirlo a «todas las cosas».
- source_word: He Who Is
  choice: El Que Es
  rationale: Conserva el título ontológico y su énfasis, sin identificarlo explícitamente con una formulación doctrinal posterior.
- source_word: living images of the living figures
  choice: imágenes vivientes de las figuras vivientes
  rationale: Preserva la repetición conceptual y la distinción entre imágenes y figuras.
- source_word: those of the likeness / those of the memory
  choice: los de la semejanza / los de la memoria
  rationale: Mantiene las categorías enigmáticas sin interpretarlas ni sustituirlas por grupos doctrinalmente definidos.
theological_decisions:
- issue: Género gramatical de «Palabra» frente a los pronombres masculinos del testimonio
  choice: Se usa «la Palabra» como sustantivo femenino, pero se mantiene el masculino cuando el discurso se refiere personalmente al protagonista.
  alternative: Feminizar todos los pronombres y participios conforme al género gramatical español de «Palabra».
  rationale: Evita borrar una tensión real del testimonio, donde «Word» funciona como título de un agente masculino; la traducción no fuerza una identificación doctrinal.
- issue: Naturaleza de la unión con el Reposo
  choice: «se unió al Reposo»
  alternative: «se mezcló con el Reposo»
  rationale: Expresa la incorporación íntima con español natural sin definir metafísicamente el modo de unión.
- issue: «plan of salvation»
  choice: «plan de salvación»
  alternative: «designio salvífico»
  rationale: Es comprensible para lectores actuales y conserva el sentido soteriológico sin añadir contenido confesional.
- issue: Referente femenino en la frase final
  choice: «Esta se le revela… antes de que él se una a ella»
  alternative: Resolver el referente como la fe, la esperanza, la Plenitud o la luz.
  rationale: Se conserva la ambigüedad referencial del testimonio en vez de fijar una interpretación no garantizada.
- issue: Entidades capitalizadas
  choice: Mayúsculas en Plenitud, Reposo, Grandeza, Palabra y Totalidades
  alternative: Usar minúsculas como nombres comunes.
  rationale: Las mayúsculas señalan su función técnica o personificada en el tratado sin afirmar una ontología denominacional concreta.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se favoreció una equivalencia óptima: sintaxis legible sin normalizar las categorías técnicas ni resolver ambigüedades teológicas y pronominales. El borrador es necesariamente provisional porque la evidencia suministrada es un testimonio inglés de dominio público y la revisión directa del copto del Códice de Nag Hammadi I,5 sigue pendiente. Las lagunas se representan con […] y los suplementos editoriales mediante notas marcadas en el texto.'
