    La Palabra aumentó su ayuda mutua y la esperanza de la promesa, porque poseen alegría, abundancia de reposo y deleites sin mancha. Al otorgar perfección con la visión como meta, engendró a aquellos a quienes recordó al principio, cuando todavía no estaban con él. Él permanece en la esperanza y la fe en el Padre perfecto, al igual que las Totalidades. Esto se le revela antes de que él se mezcle con ello,[e] para que quienes han llegado a existir no perezcan al contemplar la luz, pues no pueden soportar la grande y elevada estatura.'
