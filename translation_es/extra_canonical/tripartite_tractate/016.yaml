  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: es
  text: 'Cuando la Palabra deficiente fue iluminada, su Plenitud llegó a existir. Escapó de quienes al principio lo habían perturbado y se desligó de ellos. Se despojó de aquel pensamiento orgulloso. Cuando quienes al principio lo habían desobedecido se postraron y se humillaron ante él, se unió al Reposo.


    Y <él>[a] se alegró por la visita de sus hermanos que venían a visitarlo. Glorificó y alabó a quienes habían demostrado serle de ayuda. Dio gracias por haber escapado de quienes se habían rebelado contra él, y estimó y honró a la Grandeza y a quienes estaban resueltos a revelársele. Engendró imágenes vivientes de las figuras vivientes. Son agradables y buenas porque proceden de seres vivientes y se les parecen en belleza; sin embargo, no son iguales a ellas en verdad, porque no proceden de una unión entre quien las produjo […] y quien se le reveló.[b] Aun así, él obra con sabiduría y conocimiento, uniendo por completo consigo mismo a la Palabra. Por eso, los que fueron producidos de él son grandes, así como El Que Es es verdaderamente grande.


    Después de maravillarse ante la belleza de quienes <se>[c] le habían aparecido, expresó su gratitud por esta visita. La Palabra llevó a cabo esta obra con la ayuda de quienes lo auxiliaron, a causa de la firmeza de los que habían llegado a existir por medio de él, para que pudieran obtener algo bueno. Pues recordó orar por el plan de salvación de todos aquellos a quienes había producido, plan que fue afianzado para darles estabilidad.


    Por tanto, aquellos a quienes produjo deliberadamente están en carros, como los que llegaron a existir, los que aparecieron para poder pasar por todo lugar de lo que está abajo, de modo que a cada uno se le concediera el lugar apropiado para su naturaleza.


    Esto es destructivo para los de la semejanza, pero beneficioso para los de la memoria: una revelación de los que proceden de la decisión de los eones, la cual era unidad y misericordia, mientras que ellos no son más que semillas que todavía no han alcanzado la existencia plena.


    El que apareció era un rostro del Padre y de la armonía. Era una vestidura de todas las gracias y alimento para aquellos a quienes la Palabra produjo mientras oraba, glorificaba y alababa. Este es aquel a quien glorificó y alabó […] mientras contemplaba a aquellos por quienes suplicaba, a fin de perfeccionarlos mediante las imágenes que había producido.[d]


    La Palabra aumentó la ayuda mutua entre ellos y su esperanza en la promesa, porque poseen alegría, abundancia de reposo y deleites sin mancha. Al otorgarles perfección con la visión como meta, engendró a aquellos de quienes se había acordado al principio, cuando todavía no estaban con él. Él permanece en la esperanza y la fe en el Padre perfecto, al igual que las Totalidades. Esta se le revela antes de que él se una a ella,[e] para que quienes han llegado a existir no perezcan al contemplar la luz, pues no pueden soportar la grande y elevada estatura.'
