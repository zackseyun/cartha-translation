review_pass:
  verdict: revise
  source_fidelity: La versión sigue de cerca el testimonio inglés suministrado y conserva de manera adecuada sus señales de laguna ([]), restauración (< >) y daño (<…>). No se dispone aquí de una base copta directa para confirmar decisiones más allá de ese testimonio; por ello, se mantienen las ambigüedades. Se requiere una corrección puntual pero sustancial en «separación <de> lo que es bueno», pues el testimonio dice «escape <from> what is good», no una separación estática.
  naturalness: El español es en general natural, digno y apto para un texto antiguo de registro técnico. Se ajustan algunas construcciones para reflejar mejor relaciones verbales y temporales del testimonio sin volverlas innecesariamente interpretativas.
  terminology: «Anímico», «Verbo», «Totalidad», «los de la derecha/izquierda» y «reposo» son elecciones apropiadas y coherentes. Se conserva «garantía» para pledge y no se armoniza la terminología con sistemas doctrinales posteriores.
  issues:
  - severity: medium
    issue: «su completa separación <de> lo que es bueno»
    rationale: «Separación» no comunica el movimiento o la idea de escape del testimonio («its full escape <from> what is good»). «Su completa huida <de> lo que es bueno» conserva mejor la imagen sin resolver la sintaxis dañada.
  - severity: low
    issue: «por el golpe de sus adversarios»
    rationale: La formulación omite que el golpe es asestado por los adversarios. «Por el golpe asestado por sus adversarios» refleja con mayor precisión «from the strike by his opponents».
  - severity: low
    issue: Cambio de aspecto verbal en la descripción de los arrogantes
    rationale: El testimonio describe a quienes son, aman, olvidan y no confesaron/renunciaron, antes de anunciar su retribución. Mantener indicativos y pretéritos en español refleja mejor esa caracterización que una serie de subjuntivos prospectivos.
  revised_text: 'Los seres humanos llegaron a dividirse en tres categorías según su naturaleza: los espirituales, los anímicos[a] y los materiales. Estas corresponden a la triple inclinación del Verbo, de la cual fueron producidos los materiales, los anímicos y los espirituales. Cada una de las tres categorías según su naturaleza se conoce por su fruto. Sin embargo, no fueron conocidas desde el principio, sino solo cuando vino el Salvador, resplandeció sobre los santos y reveló a qué categoría pertenecía cada uno.


    La categoría espiritual es como luz de luz y espíritu de espíritu. Cuando apareció su cabeza, de inmediato se apresuró hacia su categoría correspondiente. De pronto formó un cuerpo para su cabeza y recibió inmediatamente el conocimiento mediante la revelación.


    La categoría anímica, en cambio, es como luz procedente del fuego. Vaciló en reconocer [] al que se le apareció, y vaciló aún más en apresurarse hacia él por medio de la fe. Más bien, aunque una voz la instruyó, <quedó> satisfecha, porque no estaba lejos de la esperanza de la promesa: recibió, por así decirlo, la certeza de las cosas venideras en forma de garantía.


    La categoría material, en cambio, es extraña en todo sentido, porque se parece a la oscuridad y rechaza la luz que resplandece, pues su manifestación la extingue. Y como no acogió su <venida>, es <desmesurada> y está llena de rencor contra la revelación del Señor.


    La categoría espiritual recibirá una salvación completa en todo sentido. La categoría material será destruida por completo, como sucede con un adversario. La categoría anímica, debido a su posición intermedia tanto por la manera en que fue producida como por su naturaleza, es dual y corresponde a su inclinación tanto hacia el bien como hacia el mal. Lo que se ha determinado para ella es ambiguo <…>, así como su completa huida <de> lo que es bueno.[b]


    Aquellos a quienes el Verbo produjo conforme al modelo preexistente en su pensamiento, cuando recordó al Exaltado y oró por la salvación, recibieron la salvación de inmediato. [Debido] al pensamiento salvador, fueron salvados por completo mediante lo que este produjo. Lo mismo se aplica a [aquellos] que estos, a su vez, produjeron, [] ya fueran ángeles o seres humanos. Puesto que reconocen que existe uno más exaltado que ellos, y puesto que oran y lo buscan, también recibirán la misma salvación que reciben los que fueron producidos, porque proceden de la buena inclinación. Se les asignó el servicio de anunciar la futura venida del Salvador y su revelación después de que hubiera venido. Ya fueran ángeles o seres humanos, cuando él los designó para este servicio, recibieron verdaderamente la naturaleza de su ser.


    En cambio, los que procedieron del pensamiento del afán de dominio, los que llegaron a existir por el golpe asestado por sus adversarios, fueron producidos por ese pensamiento. Puesto que son una mezcla, recibirán un desenlace ambiguo. Quienes abandonen el afán de dominio que se les concedió solo por un tiempo y durante períodos determinados, glorifiquen al Señor de la gloria y renuncien a su ira, recibirán la recompensa por su humildad: una existencia sin fin.


    En cambio, quienes son arrogantes por su afán de grandeza, aman la gloria pasajera y olvidan que la autoridad les fue delegada solo durante períodos y tiempos determinados —y que, por tanto, no confesaron que el Hijo de Dios [] es el Señor de todo y el Salvador, ni renunciaron a su ira ni dejaron de imitar a los malvados— sufrirán el castigo por su ignorancia y su pasión insensata, junto con quienes se extraviaron y anduvieron errantes.


    Aún peores son quienes cometieron actos indebidos contra el Señor, como hicieron contra él las potestades de la izquierda, hasta darle muerte. Pensaron: «Nos convertiremos en señores de la Totalidad[c] si matamos al que ha sido proclamado rey de la Totalidad». Y trabajaron con ese fin: los seres humanos y los ángeles que no pertenecen a la buena inclinación de los de la derecha, sino que proceden de la mezcla. Eligieron la gloria propia, aunque no es más que una gloria pasajera y un deseo; en cambio, el camino hacia el reposo eterno pasa por la humildad, <que conduce a> la salvación, y pertenece a quienes han de ser salvados, los de la derecha.[d]


    Después de alabar al Señor, considerar lo que agrada a la Iglesia y cantar junto con ella, tan plenamente como sea posible, el himno de los humildes, haciendo lo que le agrada, compartirán sus sufrimientos y sus angustias, como quienes tienen en cuenta lo que es bueno para la Iglesia. Tendrán parte en su esperanza. Esto se refiere [] a seres humanos y ángeles.


    El camino de quienes pertenecen al orden de la izquierda conduce a la perdición, porque no solo rechazaron al Señor y tramaron un plan malvado contra él, sino que también dirigieron contra la Iglesia su odio, envidia y celos. Esta es la causa de la condenación de quienes han perturbado a la Iglesia, llegando incluso a incitarse para crearle <pruebas>.'
