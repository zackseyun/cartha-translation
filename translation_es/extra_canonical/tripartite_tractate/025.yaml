  text: 'Humans came to be divided into three natural categories: the spiritual, the soulish, and the material. These correspond to the Word’s threefold inclination, from which the material, the soulish, and the spiritual were produced. Each of the three natural categories is known by its fruit. They were not known at first, however, but only when the Savior came, shone upon the saints, and revealed which category each one belonged to.


    The spiritual category is like light from light and spirit from spirit. When its head appeared, it immediately hurried toward its proper category. Suddenly it grew a body for its head and immediately received knowledge through the revelation.


    The soulish category, by contrast, is like light from fire. It was hesitant to recognize [] the one who appeared to it and even more hesitant to hurry toward him through faith. Instead, although a voice instructed it, <it> was satisfied, because it was not far from the hope of the promise. It received, as it were, assurance of the things to come in the form of a pledge.


    The material category, by contrast, is alien in every way, because it resembles darkness and rejects the light that shines, since its manifestation extinguishes it. Because it did not welcome his <coming>, it is <immoderate> and full of spite toward the revelation of the Lord.


    The spiritual category will receive complete salvation in every respect. The material category will be destroyed in every respect, as happens to an adversary. Because of its middle position, both in the way it was produced and in its nature, the soulish category is duality, corresponding to its inclination toward both good and evil. What has been determined for it is ambiguous <…> and its complete escape <from> what is good.


    Those whom the Word produced according to the preexistent pattern in his thought, when he remembered the Exalted One and prayed for salvation, received salvation immediately. [Because] of the saving thought, they were saved completely by what it produced. The same applies to [the ones] whom these produced in their turn, [] whether angels or humans. Because they acknowledge that one exists who is more exalted than they are, and because they pray and seek after him, they too will receive the same salvation received by those who were produced, since they come from the good inclination. They were assigned the service of proclaiming the Savior’s future coming and his revelation after he had come. Whether angels or humans, when he appointed them to this service, they truly received the nature of their being.


    By contrast, those who came from the thought of lust for control, who came into being through the blow struck by his opponents, were produced by that thought. Since they are mixed, they will receive an ambiguous end. Those who cast off the lust for control that was granted to them only for a time and for particular periods, who glorify the Lord of glory, and who renounce their anger, will receive the reward for their humility, which is unending existence.


    By contrast, those who are arrogant because of their lust for ambition, who love passing glory, and who forget that authority was delegated to them only for particular periods and times—and who therefore did not confess that the Son of God [] is the Lord of all and Savior, and did not renounce their anger or stop imitating the evil ones—will suffer retribution for their ignorance and foolish passion, together with those who have gone astray and wandered away.


    Even more evil are those who committed improper acts against the Lord, as the powers of the left did against him, even putting him to death. They said to themselves, “We will become masters of the Totality if the one proclaimed king of the Totality is killed.” They worked toward this end—the humans and angels who do not belong to the good inclination of those on the right, but come from the mixture. They chose self-glory, even though it is only passing glory and lust, while the way to eternal repose is through humility (that results in) salvation, being of those who are to be saved, those on the right.


    After they praise the Lord, consider what is pleasing to the Church, and sing the hymn of the humble together with her as fully as possible, doing what pleases her, they will share in her sufferings and anguish like those who consider what is good for the Church. They will receive a share in her hope. This applies [] to humans and angels.


    The path of those belonging to the order of the left leads to destruction, because they not only rejected the Lord and devised an evil plot against him, but also directed their hatred, envy, and jealousy against the Church. This is the reason for the condemnation of those who have troubled the Church, even inciting themselves to create <trials> for the Church.'
translation:
  language: es
  text: 'Los seres humanos llegaron a dividirse en tres categorías según su naturaleza: los espirituales, los anímicos[a] y los materiales. Estas corresponden a la triple inclinación del Verbo, de la cual fueron producidos los materiales, los anímicos y los espirituales. Cada una de las tres categorías según su naturaleza se conoce por su fruto. Sin embargo, no fueron conocidas desde el principio, sino solo cuando vino el Salvador, resplandeció sobre los santos y reveló a qué categoría pertenecía cada uno.


    La categoría espiritual es como luz de luz y espíritu de espíritu. Cuando apareció su cabeza, de inmediato se apresuró hacia su categoría correspondiente. De pronto formó un cuerpo para su cabeza y recibió inmediatamente el conocimiento mediante la revelación.


    La categoría anímica, en cambio, es como luz procedente del fuego. Vaciló en reconocer [] al que se le apareció, y vaciló aún más en apresurarse hacia él por medio de la fe. Más bien, aunque una voz la instruyó, <quedó> satisfecha, porque no estaba lejos de la esperanza de la promesa: recibió, por así decirlo, la certeza de las cosas venideras en forma de garantía.


    La categoría material, en cambio, es extraña en todo sentido, porque se parece a la oscuridad y rechaza la luz que resplandece, pues su manifestación la extingue. Y como no acogió su <venida>, es <desmesurada> y está llena de rencor contra la revelación del Señor.


    La categoría espiritual recibirá una salvación completa en todo sentido. La categoría material será destruida por completo, como sucede con un adversario. La categoría anímica, debido a su posición intermedia tanto por la manera en que fue producida como por su naturaleza, es dual y corresponde a su inclinación tanto hacia el bien como hacia el mal. Lo que se ha determinado para ella es ambiguo <…>, así como su completa separación <de> lo que es bueno.[b]


    Aquellos a quienes el Verbo produjo conforme al modelo preexistente en su pensamiento, cuando recordó al Exaltado y oró por la salvación, recibieron la salvación de inmediato. [Debido] al pensamiento salvador, fueron salvados por completo mediante lo que este produjo. Lo mismo se aplica a [aquellos] que estos, a su vez, produjeron, [] ya fueran ángeles o seres humanos. Puesto que reconocen que existe uno más exaltado que ellos, y puesto que oran y lo buscan, también recibirán la misma salvación que reciben los que fueron producidos, porque proceden de la buena inclinación. Se les asignó el servicio de anunciar la futura venida del Salvador y su revelación después de que hubiera venido. Ya fueran ángeles o seres humanos, cuando él los designó para este servicio, recibieron verdaderamente la naturaleza de su ser.


    En cambio, los que procedieron del pensamiento del afán de dominio, los que llegaron a existir por el golpe de sus adversarios, fueron producidos por ese pensamiento. Puesto que son una mezcla, recibirán un desenlace ambiguo. Quienes abandonen el afán de dominio que se les concedió solo por un tiempo y durante períodos determinados, glorifiquen al Señor de la gloria y renuncien a su ira, recibirán la recompensa por su humildad: una existencia sin fin.


    En cambio, quienes se vuelvan arrogantes por su afán de grandeza, amen la gloria pasajera y olviden que la autoridad les fue delegada solo durante períodos y tiempos determinados —y que, por tanto, no confiesen que el Hijo de Dios [] es el Señor de todo y el Salvador, ni renuncien a su ira ni dejen de imitar a los malvados— sufrirán el castigo por su ignorancia y su pasión insensata, junto con quienes se extraviaron y anduvieron errantes.


    Aún peores son quienes cometieron actos indebidos contra el Señor, como hicieron contra él las potestades de la izquierda, hasta darle muerte. Pensaron: «Nos convertiremos en señores de la Totalidad[c] si matamos al que ha sido proclamado rey de la Totalidad». Y trabajaron con ese fin: los seres humanos y los ángeles que no pertenecen a la buena inclinación de los de la derecha, sino que proceden de la mezcla. Eligieron la gloria propia, aunque no es más que una gloria pasajera y un deseo; en cambio, el camino hacia el reposo eterno pasa por la humildad, <que conduce a> la salvación, y pertenece a quienes han de ser salvados, los de la derecha.[d]


    Después de alabar al Señor, considerar lo que agrada a la Iglesia y cantar junto con ella, tan plenamente como sea posible, el himno de los humildes, haciendo lo que le agrada, compartirán sus sufrimientos y sus angustias, como quienes tienen en cuenta lo que es bueno para la Iglesia. Tendrán parte en su esperanza. Esto se refiere [] a seres humanos y ángeles.


    El camino de quienes pertenecen al orden de la izquierda conduce a la perdición, porque no solo rechazaron al Señor y tramaron un plan malvado contra él, sino que también dirigieron contra la Iglesia su odio, envidia y celos. Esta es la causa de la condenación de quienes han perturbado a la Iglesia, llegando incluso a incitarse para crearle <pruebas>.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Anímicos» traduce una categoría técnica relacionada con el alma, distinta aquí tanto de los «espirituales» como de los «materiales».
    reason: El término no es común en el habla cotidiana y puede confundirse con «espiritual».
  - marker: b
    text: El texto está dañado en este punto. La formulación conservada acerca de la categoría anímica y «lo que es bueno» es incierta y no permite aclarar con seguridad su desenlace.
    reason: Señala una incertidumbre textual y evita presentar como segura una lectura difícil.
  - marker: c
    text: «Totalidad» es un término cosmológico del tratado y se refiere al conjunto pleno de la realidad, no meramente a una suma indefinida de cosas.
    reason: Aclara el uso técnico de una palabra capitalizada poco usual.
  - marker: d
    text: La redacción del testimonio en la frase sobre humildad, salvación y «los de la derecha» es difícil; la traducción conserva su asociación sin intentar reconstruir una sintaxis plenamente segura.
    reason: Advierte que la relación gramatical y conceptual no es completamente clara.
lexical_decisions:
- source_word: soulish
  choice: anímico
  rationale: Conserva la categoría técnica vinculada con el alma sin confundirla con «espiritual»; es más natural en español que una paráfrasis extensa.
- source_word: the Word
  choice: el Verbo
  rationale: Mantiene el uso sustantivado y personificado de Logos en registro religioso y distingue esta figura de una simple «palabra».
- source_word: material
  choice: material
  rationale: Conserva la tercera categoría antropológica sin sustituirla por «carnal», que introduciría resonancias teológicas ajenas al testimonio.
- source_word: inclination
  choice: inclinación
  rationale: Retiene la noción repetida de orientación o tendencia y permite seguir la estructura conceptual del pasaje.
- source_word: Totality
  choice: Totalidad
  rationale: Se conserva como término cosmológico técnico, con mayúscula, en vez de reducirlo a «universo» o «todas las cosas».
- source_word: pledge
  choice: garantía
  rationale: Expresa una seguridad anticipada de lo venidero; evita imponer el vocabulario paulino más específico de «arras».
- source_word: repose
  choice: reposo
  rationale: Mantiene el término religioso y escatológico sin interpretarlo simplemente como descanso físico.
theological_decisions:
- issue: Estatus de las tres categorías humanas
  choice: Presentarlas como categorías según su naturaleza, sin explicarlas ni armonizarlas con otra antropología.
  alternative: Interpretarlas como clases morales, estados psicológicos o destinos predeterminados.
  rationale: El pasaje formula una antropología tripartita propia y mantiene tensión entre origen, inclinación, respuesta y desenlace.
- issue: Destino de la categoría anímica
  choice: Conservar como ambiguos tanto su desenlace como la oración dañada sobre su separación de lo bueno.
  alternative: Resolver su destino como salvación condicional o condenación segura.
  rationale: El testimonio es explícitamente ambiguo y está textualmente dañado; una resolución excedería la evidencia.
- issue: Derecha e izquierda
  choice: Retener las designaciones «los de la derecha» y «los de la izquierda» como categorías internas del tratado.
  alternative: Sustituirlas por «buenos» y «malos».
  rationale: La sustitución borraría la cosmología y las asociaciones propias del texto.
- issue: Humildad y salvación
  choice: Preservar la relación expresada entre humildad, reposo y salvación sin definir un mecanismo doctrinal.
  alternative: Convertirla en una afirmación sistemática sobre mérito, gracia u obras.
  rationale: La sintaxis del testimonio es difícil y no autoriza una precisión confesional.
- issue: Agencia del pensamiento salvador
  choice: Mantener la formulación «mediante lo que este produjo», con el referente cercano «pensamiento salvador».
  alternative: Atribuir inequívocamente toda la acción al Verbo o al Exaltado.
  rationale: La cadena de referentes es compleja y debe conservarse sin imponer una solución.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes, los signos angulares y la elipsis como señales de laguna, restauración o daño presentes en el testimonio. La revisión directa del copto sigue pendiente; por ello, el borrador se apoya de manera provisional en el testimonio inglés de dominio público suministrado. Se evitó armonizar la terminología del tratado con sistemas doctrinales posteriores.
