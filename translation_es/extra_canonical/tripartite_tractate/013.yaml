base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: es
  text: 'Los otros tenían un deseo más fuerte de dominar, porque eran más honorables [] que los anteriores, que se habían alzado contra ellos. Estos se negaron a humillarse, pues pensaban que se habían originado a sí mismos y que no tenían principio; y, en cuanto a engendrar, pensaban que habían sido los primeros en engendrar a otros. Los dos órdenes guerreaban entre sí y luchaban por el dominio debido a su manera de ser. Como resultado, quedaron inundados de poderes y naturalezas propios de una situación de combate mutuo, llenos del deseo de dominar y de todo lo semejante. A partir de estas cosas, el amor vacío por la gloria los impulsó a desear el dominio, aunque ninguno de ellos poseía el pensamiento elevado ni lo reconocía.


    Las fuerzas de este pensamiento fueron preparadas con los <nombres> de los <seres> preexistentes, cuyas representaciones son. El orden de los que eran de esta clase mantenía armonía entre sus miembros. Sin embargo, estos combatían contra el orden de los que pertenecían a la semejanza, mientras que el orden de los que pertenecían a la semejanza hacía la guerra contra las semejanzas y, lleno de furia, actuaba contra ellas. [] A partir de esto [sucedió... lo suyo] unos [contra] otros, muchos [...] la necesidad los dispuso [...] para que pudieran prevalecer [...] él no cesó [...] y su envidia, [su] furia, su violencia, su deseo y su ignorancia triunfaron, produciendo diversas clases de materia y poderes de distintas clases, entremezclados en gran número. Mientras tanto, la Palabra, que había hecho que fueran engendrados, aguardaba en su mente una revelación de la [esperanza] que habría de llegarle desde lo alto.


    Al ponerse en movimiento, la Palabra recibió esperanza y expectación respecto al Excelso. En cuanto a los que pertenecían a la sombra, se apartó por completo de ellos, porque guerreaban contra él y no se humillaban en lo más mínimo ante él. Pero halló reposo en los que pertenecían a la memoria. En cuanto a los que llegaron a existir por medio de la memoria, la Palabra produjo, de manera invisible y conforme a la naturaleza de ellos, al que ascendió a lo alto, mientras recordaba al que había sido deficiente, hasta que la luz resplandeció sobre él desde lo alto y le dio vida, engendrada por el pensamiento del amor fraternal entre las Plenitudes preexistentes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lust for control
  choice: deseo de dominar / deseo de dominio
  rationale: Expresa de manera natural tanto el impulso desordenado como la pugna por ejercer control, sin introducir terminología política moderna.
- source_word: orders
  choice: órdenes
  rationale: Conserva la idea de agrupaciones o rangos estructurados y mantiene la terminología conceptual del pasaje.
- source_word: the Word
  choice: la Palabra
  rationale: Es una traducción accesible y tradicional del título; se escribe con mayúscula para señalar su uso como entidad personificada.
- source_word: memory
  choice: memoria
  rationale: Mantiene el sustantivo abstracto y su posible sentido técnico sin explicarlo ni convertirlo en una facultad psicológica específica.
- source_word: Fullnesses
  choice: Plenitudes
  rationale: Conserva el plural y el carácter técnico de las realidades preexistentes, sin sustituirlo por una interpretación doctrinal.
- source_word: the Exalted One
  choice: el Excelso
  rationale: Comunica el título personal elevado de manera digna y evita precisar una identidad que el fragmento no explicita.
- source_word: likeness
  choice: semejanza
  rationale: Preserva la repetición conceptual entre quienes pertenecen a la semejanza y las semejanzas contra las que combaten.
theological_decisions:
- issue: La afirmación de que ciertos seres se originaron a sí mismos y no tenían principio
  choice: Se presenta explícitamente como lo que ellos pensaban.
  alternative: Redactarlo como una afirmación objetiva del narrador.
  rationale: El texto atribuye esta idea a la percepción arrogante de esos seres; la traducción no debe validarla ni refutarla por cuenta propia.
- issue: Identidad de «la Palabra»
  choice: Se conserva como título personificado sin identificarlo con una figura nombrada.
  alternative: Traducir o glosar el término como Cristo, Logos u otra entidad específica.
  rationale: El pasaje no hace aquí esa identificación de forma explícita; mantener la tensión evita importar una conclusión doctrinal.
- issue: Relación sintáctica de «engendrada» al final
  choice: Se hace concordar «engendrada» con «vida».
  alternative: Entender que la luz, la Palabra u otra entidad fue engendrada.
  rationale: Es la relación más inmediata en el testimonio inglés, pero la sintaxis permanece difícil; no se añade una explicación doctrinal.
- issue: Referentes de «al que ascendió» y «al que había sido deficiente»
  choice: Se mantienen como referentes distintos y no identificados.
  alternative: Identificarlos entre sí o asignarles nombres teológicos.
  rationale: La formulación transmitida no permite resolver con seguridad sus identidades.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes vacíos, las elipsis, los segmentos entre corchetes y las restituciones entre ángulos como señales del estado textual. Debido a que la revisión directa del copto está pendiente, esta redacción es provisional y se apoya en el testimonio inglés público suministrado; no se normalizaron los pasajes fragmentarios ni se resolvieron sus referentes inciertos.
