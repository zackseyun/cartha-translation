id: TRIP.013
reference: Tripartite Tractate — The Battle Between the Emanations
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'The others were stronger in the lust for control, because they were more honorable [] than the former ones, who had risen up against them. Those refused to humble themselves, thinking that they had originated from themselves, being without a beginning, and as to giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control, owing to their manner of being, the result being that they were inundated by powers and natures that typify the situation of mutual combat, possessing lust for control and everything else like it. From these the vacuous love for glory pushed them to desire the lust for control, whereas not one among them possessed the exalted thought, nor recognized it.


    The forces of this thought were made ready with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind possessed mutual harmony. They, however, battled against the order of those of the likeness, whereas the order of those of the likeness waged war against the likenesses and acted against them out of its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he ceased not [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse types of matter and powers of different kinds, intermixed in great numbers, whereas the Word, who caused their begetting, in his mind was awaiting a revelation of the [hope] that was to come to him from above.


    While bestirring (himself), the Word obtained hope and expectation for the Exalted One. Regarding those of the shadow, he distanced himself from them completely, because they warred against him and did not in the least humble themselves before him, but he found repose in those who belonged to memory. Regarding those who came to be through memory, the Word produced, in an unseen manner, in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
