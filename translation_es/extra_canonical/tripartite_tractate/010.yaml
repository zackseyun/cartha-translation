base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: es
  text: 'La emanación de las Totalidades, que existen a partir del Existente, no ocurrió mediante una separación entre ellas, como [algo] desechado por quien las engendra. Más bien, su generación se asemeja a un acto de extensión: el Padre se extiende hacia aquellos a quienes ama, para que [quienes] se originaron de él también lleguen a ser él.


    Aunque la era presente constituye una unidad, está dividida en unidades de tiempo; estas se dividen en años; los años, a su vez, en estaciones; luego, las estaciones en meses; los meses en días; los días en horas, y las horas en minutos. Del mismo modo, [a] la era de la verdad, por ser una y muchas, recibe honra mediante nombres tanto insignificantes como importantes, según lo que cada cual puede comprender. A modo de comparación, es como un manantial que, sin dejar de ser lo que es, fluye y se expande en arroyos, lagos, canales y ramificaciones. O es como una raíz que se extiende bajo los árboles y se ramifica junto con sus frutos; o como un cuerpo humano, dividido de manera inseparable en diversos miembros que se ramifican: principales y secundarios, grandes y pequeños.


    Los eones se engendraron a sí mismos de acuerdo con el tercer fruto, por libre voluntad y mediante el entendimiento que él les dio para pensar. No desean dar gloria [junto con] [b] lo que las Plenitudes separadas produjeron al unísono como palabras de [alabanza]. [c] Tampoco desean dar gloria junto con la Totalidad entera, ni glorificar junto con ningún eón individual que haya alcanzado un lugar o estado superior al suyo, a menos que este obtenga <lo que> [d] se deseaba del que posee un nombre más exaltado y un lugar más elevado.


    [aquí falta texto] [e] Se reciben unos a otros en el lugar más elevado, y quien deseaba ascender más se engendra a sí mismo, por así decirlo: se engendra junto con el otro y con lo que él es. Es renovado junto con quien vino a él de parte de su hermano, mientras lo contempla y le ruega acerca del asunto.


    Para que esto suceda de esta manera, quien deseaba dar gloria no le dice nada al respecto, salvo esto, porque en la Plenitud se ha establecido un límite para el habla. Así, guardan silencio acerca de lo inabarcable que es el Padre, aunque se les permite hablar de su deseo de comprenderlo.'
  philosophy: optimal-equivalence
  footnotes:
