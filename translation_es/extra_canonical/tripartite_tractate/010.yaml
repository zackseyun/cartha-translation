    reason: Mantener visible que la frase depende de palabras no transmitidas con certeza.
  - marker: e
    text: El testimonio señala otra laguna antes de «Se reciben unos a otros».
    reason: Advertir que la transición y sus referentes pueden depender de material perdido.
lexical_decisions:
- source_word: Totalities
  choice: Totalidades
  rationale: Conserva el término técnico colectivo del tratado y lo distingue de «Totalidad» en singular.
- source_word: existent one
  choice: el Existente
  rationale: Mantiene la expresión como designación sustantivada sin identificarla explícitamente con otro personaje del sistema.
- source_word: emanation
  choice: emanación
  rationale: Es el término técnico tradicional y expresa procedencia sin introducir por sí solo la idea de creación o separación material.
- source_word: age / aeons
  choice: era / eones
  rationale: Distingue el ejemplo temporal de la «era presente» de los seres o realidades técnicas llamados «eones», aunque ambos términos estén emparentados conceptualmente.
- source_word: Fullness / Fullnesses
  choice: Plenitud / Plenitudes
  rationale: Preserva el uso técnico y la alternancia entre singular y plural del testimonio.
- source_word: extension
  choice: extensión
  rationale: Retiene la metáfora central de una generación por despliegue, en contraste explícito con una separación.
- source_word: ungraspability
  choice: lo inabarcable que es
  rationale: Expresa la imposibilidad de abarcar al Padre sin convertir la frase en una afirmación más abstracta o doctrinal de «incomprensibilidad».
- source_word: grasp
  choice: comprender
  rationale: Es natural en español para la comprensión intelectual, aunque conserva en contexto el contraste con aquello que no puede abarcarse.
theological_decisions:
- issue: Relación entre el Padre y quienes proceden de él
  choice: «para que […] también lleguen a ser él»
  alternative: «para que lleguen a ser como él»
  rationale: El testimonio dice «become him», no «become like him». Se conserva la formulación fuerte y su tensión ontológica sin suavizarla.
- issue: Modo de la emanación
  choice: Generación por extensión y no por separación
  alternative: Creación de seres independientes
  rationale: La oposición estructura el pasaje; no se introduce vocabulario de creación que resolvería la metafísica del texto.
- issue: Autogeneración de los eones
  choice: «se engendraron a sí mismos»
  alternative: «fueron engendrados»
  rationale: Se mantiene la reflexividad explícita, aunque resulte conceptualmente difícil, y se conserva su relación con la libre voluntad y el entendimiento recibido.
- issue: Identidad del referente masculino en la sección sobre el eón superior
  choice: Se conservan pronombres sin identificar al referente
  alternative: Nombrar al eón superior o al tercer fruto
  rationale: El pasaje es ambiguo y el testimonio disponible no permite resolver con seguridad los antecedentes.
- issue: Silencio y conocimiento del Padre
  choice: Silencio sobre lo inabarcable del Padre, pero permiso para expresar el deseo de comprenderlo
  alternative: Prohibición absoluta de hablar del Padre
  rationale: Conserva la tensión final entre el límite impuesto al habla y el permiso parcial.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los tecnicismos «emanación», «eones», «Plenitud» y «Totalidades», con mayúscula cuando funcionan como nombres técnicos. La sintaxis se hizo legible sin eliminar las repeticiones, las reflexividades ni las ambigüedades del pasaje. Dado que la revisión directa del copto sigue pendiente, las señales críticas del testimonio inglés público se conservaron explícitamente.
