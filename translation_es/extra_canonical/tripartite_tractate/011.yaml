translation:
  language: es
  text: '**Tratado tripartito — El error del último eón, el Verbo**


    A uno de los eones se le ocurrió intentar comprender lo incomprensible y darle gloria, en especial a la inefabilidad del Padre. Puesto que él es un Verbo procedente de la unidad, es uno, [pero] no procede de la unidad de las Totalidades ni de quien las produjo, es decir, de quien produjo la Totalidad: el Padre. Este eón era uno de aquellos a quienes se les había dado sabiduría, aquellos cuyo pensamiento preexistía y mediante el cual producían lo que querían. Por tanto, recibió una sabiduría innata para examinar el fundamento oculto, pues es fruto de la sabiduría. La libre voluntad, engendrada junto con las Totalidades, fue la razón por la que este hizo [] lo que deseaba, sin que nadie se lo impidiera.


    La intención de este, que es el Verbo, era buena. Una vez producido, se apresuró a glorificar al Padre, aunque <él> deseaba algo imposible: quería producir un ser perfecto a partir de una unión de la que no formaba parte y sin haber recibido mandato alguno. Este eón fue el último en ser <producido> mediante la cooperación mutua, y era de pequeña medida. Antes de engendrar algo para glorificación de la voluntad y en unión con las Totalidades, avanzó generosamente, movido por un amor abundante, y se dirigió hacia lo que rodea la gloria perfecta. En efecto, el Verbo no fue producido al margen de la voluntad del Padre; es decir, no avanzó sin ella.


    Sin embargo, el Padre lo había producido para aquellos que él sabía que era apropiado producir. El Padre y las Totalidades se apartaron de él para que quedara establecido el límite fijado por el Padre, pues esto no ocurre por comprender lo incomprensible, sino por la voluntad [] del Padre. Además, esto sucedió para que las cosas que habían llegado a existir pudieran convertirse en un plan de salvación que habría de desarrollarse y que <no> podía dejar de desarrollarse, a fin de revelar la Plenitud.[a] Por tanto, no es apropiado hablar negativamente de esta acción del Verbo, aunque sí lo es decir que esta acción del Verbo es causa de un plan de salvación destinado a desarrollarse.


    El Verbo se engendró a sí mismo perfecto y único, y se conformó con esto por la gloria del Padre que deseaba. Sin embargo, a aquellos de quienes quería apoderarse firmemente los engendró como sombras, imágenes y semejanzas. No pudo contemplar la luz; en cambio, miró hacia las profundidades y dudó. De ahí surgieron una separación que lo perturbó mucho y un alejamiento ocasionado por su duda de sí mismo y su separación, por el olvido y el desconocimiento de sí mismo y <de lo que> existe.


    Su autoexaltación y su convicción de que podía comprender lo incomprensible se endurecieron y echaron raíces en él. Sin embargo, estas debilidades permanecieron con él mientras estaba fuera de sí, ocasionadas por la duda de sí mismo, porque <no logró alcanzar> las glorias del Padre, cuya grandeza no puede imitarse. No logró alcanzarlas porque no pudo comprenderlas.


    Aquel que produjo por sí mismo [] como un solo eón se apresuró a subir hacia lo que le pertenecía. Este pariente suyo que estaba en la Plenitud abandonó al que había llegado a existir en la deficiencia, junto con aquellos que este había producido de manera imaginaria, porque no le pertenecen. Después que se produjo a sí mismo de manera perfecta —él, que en verdad se había producido a sí mismo—, se debilitó como una naturaleza femenina que abandona a su contraparte masculina. De lo que en él era deficiente surgieron las cosas que brotaron de su pensamiento y de su orgullo; pero, en cuanto a lo que en él era perfecto, se apartó de aquello y [se elevó] hacia los que le pertenecían. Habitó en la Plenitud como recordatorio para él, porque [había sido] salvado de [su orgullo].


    El que se apresuró a subir y el que lo atrajo hacia sí no fueron estériles, sino que, al producir un fruto en la Plenitud, depusieron lo que había surgido en la deficiencia. Las cosas que llegaron a existir a partir del pensamiento orgulloso son semejantes a las Plenitudes: son semejanzas, imágenes, sombras e ilusiones de estas. Carecen de razón y de iluminación y pertenecen al pensamiento vacío, porque nada las produjo. [] Por consiguiente, su final concordará con su principio, pues lo que nunca existió volverá a lo que nunca existirá. No obstante, ellas se consideran mayores, más fuertes y más [honorables] que los nombres [que las embellecen], cuyas sombras son. Son como un hermoso reflejo [que alguien contempla], pues, por regla general, el rostro de una imagen recibe su belleza de aquello que refleja.


    Pensaron que existían por sí mismas y que no tenían origen, porque no vieron ninguna otra cosa que existiera antes que ellas. Por eso vivieron en desafío y con actos de rebeldía, sin humillarse ante aquel por cuya causa habían llegado a existir. Deseaban darse órdenes unas a otras y gobernarse unas a otras [en] su ambición de gloria, mientras que la gloria que poseían contenía la causa [del] orden que habría de existir. Puesto que [son] semejanzas de las realidades de arriba, <se> exaltaron por afán de dominio, cada una según la medida del gran nombre cuya sombra es, y cada una se consideraba superior a sus compañeras.


    El pensamiento de estas otras tampoco fue estéril. Tal como sucede con <aquellos> cuyas sombras son, entre quienes cada pensamiento se convierte en un hijo, [], así también aquello que estas piensan se convierte en su descendencia. Sucedió, por tanto, que de ellas surgió una multitud de descendientes: combatientes, guerreros, alborotadores, rebeldes desobedientes, amantes del dominio y todo otro ser de esta clase.


    El Verbo fue la causa de que esta multitud llegara a existir, y cada vez estaba más perplejo y se asombraba. En vez de perfección contempló deficiencia; en vez de unidad, separación; en vez de firmeza, [contempló] debilidades; en vez de [reposo], agitaciones. [No podía] hacer que dejaran de [amar] la agitación, ni [podía] destruirla. Estaba [completamente] impotente; su Totalidad y su [perfección] lo habían abandonado.


    Los que llegaron a existir sin conocerse a sí mismos no conocían las Plenitudes de las que procedían ni la causa de su existencia. En esta situación inestable, el Verbo no logró producir nada más que se asemejara a las emanaciones, las cuales habitan en la Plenitud y son las glorias que existen para gloria del Padre. En cambio, produjo [] seres pequeños y débiles, limitados por las debilidades [que] también lo constreñían.


    La semejanza que se encontraba sola en esta situación había sido la causa de aquellas cosas que desde el principio no causaron su propia existencia. El que se hallaba en esta situación deficiente continuó produciendo seres deficientes hasta que dictó sentencia y condenó a los seres irracionales que había producido. Luchó contra ellos hasta que fueron destruidos, es decir, contra los que habían luchado contra la condenación, [mientras] la ira los perseguía.


    [a] «Plenitud» traduce el término técnico que suele designar la totalidad plena del ámbito divino. La referencia puede abarcar tanto esa realidad colectiva como su estado de perfección.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Plenitud» traduce el término técnico que suele designar la totalidad plena del ámbito divino. La referencia puede abarcar tanto esa realidad colectiva como su estado de perfección.
    reason: Aclara un término cosmológico esencial sin sustituirlo por una interpretación doctrinal.
lexical_decisions:
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico cosmológico, ya asentado en español, en vez de reducirlo a «era» o «ser», sentidos que no expresan todo su valor en el tratado.
- source_word: Word
  choice: Verbo
  rationale: «Verbo» mantiene la identidad personal y el trasfondo técnico de Logos, además de distinguir al personaje de una simple palabra pronunciada.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidad
  rationale: Se preserva la alternancia entre plural y singular del testimonio, sin armonizar referentes que el pasaje deja tensos o ambiguos.
- source_word: Fullness / Fullnesses
  choice: Plenitud / Plenitudes
  rationale: Traducción transparente del concepto técnico asociado al pléroma; se mantiene también el plural inusual donde aparece.
- source_word: free will
  choice: libre voluntad
  rationale: Expresa la capacidad volitiva sin convertirla en el término doctrinal más cargado «libre albedrío».
- source_word: plan of salvation
  choice: plan de salvación
  rationale: Mantiene el sentido soteriológico del testimonio sin precisar indebidamente su mecanismo o alcance.
- source_word: emanations
  choice: emanaciones
  rationale: Conserva la terminología cosmológica del tratado y evita sustituirla por «creaciones», que resolvería una distinción importante.
- source_word: deficiency
  choice: deficiencia
  rationale: Mantiene el contraste repetido con perfección y Plenitud, y permite tanto una condición como un ámbito sin decidir entre ambos.
theological_decisions:
- issue: Valoración moral de la acción inicial del Verbo
  choice: Se conserva que su intención era buena y que su acción llegó a ser causa de un plan de salvación.
  alternative: Presentar la acción sencillamente como pecado, caída o rebelión.
  rationale: El pasaje mantiene una tensión explícita entre el deseo imposible, la autoexaltación y la función providencial de lo sucedido; la traducción no debe resolverla denominacionalmente.
- issue: Relación entre la voluntad del Padre y el error del Verbo
  choice: Se conserva que el Verbo no avanzó al margen de la voluntad del Padre, junto con el límite y el posterior alejamiento.
  alternative: Afirmar autorización directa del Padre o independencia absoluta del Verbo.
  rationale: El testimonio yuxtapone ambas ideas sin ofrecer una sistematización completa.
- issue: Autogeneración y referente de pronombres
  choice: Se mantienen las formulaciones reflexivas y los referentes ambiguos cuando el testimonio no los aclara.
  alternative: Identificar de manera uniforme al que se produce, sube, abandona o salva con una figura determinada.
  rationale: La construcción es difícil y una identificación tajante importaría una interpretación no asegurada por la evidencia suministrada.
- issue: Lenguaje femenino y masculino
  choice: Se traduce literalmente «naturaleza femenina» y «contraparte masculina».
  alternative: Explicarlo como una doctrina concreta de sicigias o parejas eónicas.
  rationale: El texto usa la comparación, pero el pasaje suministrado no justifica desarrollar en el cuerpo una explicación doctrinal.
- issue: Destino de las realidades deficientes
