review_pass:
  verdict: revise
  source_fidelity: 'Fiel al testimonio inglés suministrado y conserva de forma general las ambigüedades de agencia, las repeticiones y la terminología técnica. No obstante, una restauración entre corchetes en la sección sobre las «imágenes visibles» no se conservó plenamente en español: el testimonio marca tanto el artículo como «places» como texto suplementado. Se corrige sin pretender resolver el copto, cuya revisión directa sigue pendiente.'
  naturalness: El español es en general natural, moderno y de registro digno. Se ajustan dos formulaciones localmente rígidas («lugar ... guardar» y «(entidades) de enfermedades») manteniendo la sintaxis fragmentaria y las marcas críticas del testimonio.
  terminology: «Arcontes», «Verbo», «Demiurgo», «eón», «reposo» y «potestades» son elecciones adecuadas y coherentes para un texto cosmológico técnico. Se mantienen las mayúsculas y la serie de títulos sin reinterpretación confesional.
  issues:
  - severity: medium
    issue: Se perdió parcialmente la marcación crítica en «[the] (invisible) spiritual [places]».
    rationale: El borrador dice «y [los] lugares espirituales (invisibles)», pero el testimonio también encierra «places» entre corchetes. La traducción debe conservar que «lugares» es una restauración propuesta, no texto seguro.
  - severity: low
    issue: «El lugar [que se les dio para] guardar» resulta sintácticamente forzado.
    rationale: «Mantener» expresa aquí de modo natural el sentido de keep, conserva el segmento restaurado y no añade una interpretación.
  - severity: low
    issue: «(entidades) de enfermedades» desplaza la marca parentética respecto de «(entities of) illnesses».
    rationale: «(Entidades de) enfermedades» reproduce mejor que la calificación «entidades de» afecta al grupo completo y preserva el carácter aclaratorio incierto.
  revised_text: 'Por encima de todos los arcontes[a], designó a un arconte a quien nadie manda. Él es el señor de todos ellos, es decir, el rostro que el Verbo produjo mediante su pensamiento para que fuera una representación del Padre de las Totalidades. Por eso está adornado con todo <nombre> que sea una semejanza de él, pues posee toda cualidad y atributo glorioso. En consecuencia, incluso se le llama «Padre», «Dios», «Demiurgo»[b], «Rey», «Juez», «Lugar», «Morada» y «Ley». El Verbo lo emplea como una mano para ordenar la obra de las cosas de abajo, y lo emplea como una boca para decir lo que ha de profetizarse. Él habló y puso orden; y cuando vio que (sus obras) eran grandes, buenas y maravillosas, se deleitó y se alegró, como [] si en sus propios pensamientos él las hubiera dicho y hecho, sin saber que el movimiento dentro de él procedía del Espíritu, que lo mueve de una manera predestinada para que haga todo cuanto llega a desear.


    En cuanto a las cosas que llegaron a existir a partir de él, habló acerca de ellas, y llegaron a existir como una semejanza de los lugares espirituales a los que nos referimos antes al tratar el tema de las imágenes. Él <hizo> más que simplemente trabajar, pues, al ser designado padre de su plan de salvación, engendró no solo por medio de sí mismo y de las semillas, sino también [por medio del] Espíritu escogido que descenderá [a través de él] a los lugares de abajo. Él hace [más] que limitarse a pronunciar sus propias palabras espirituales, <pues> lo hace de manera oculta por medio del Espíritu que clama y da a luz cosas que superan su propia naturaleza. Puesto que, según su naturaleza, él es Dios y Padre, y todos los demás títulos de honor, supuso que estos correspondían a su propia naturaleza.


