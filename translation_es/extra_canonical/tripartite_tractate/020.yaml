translation:
  language: es
  text: 'Por encima de todos los arcontes[a], designó a un arconte a quien nadie manda. Él es el señor de todos ellos, es decir, el rostro que el Verbo produjo mediante su pensamiento para que fuera una representación del Padre de las Totalidades. Por eso está adornado con todo <nombre> que sea una semejanza de él, pues posee toda cualidad y atributo glorioso. En consecuencia, incluso se le llama «Padre», «Dios», «Demiurgo»[b], «Rey», «Juez», «Lugar», «Morada» y «Ley». El Verbo lo emplea como una mano para ordenar la obra de las cosas de abajo, y lo emplea como una boca para decir lo que ha de profetizarse. Él habló y puso orden; y cuando vio que (sus obras) eran grandes, buenas y maravillosas, se deleitó y se alegró, como [] si en sus propios pensamientos él las hubiera dicho y hecho, sin saber que el movimiento dentro de él procedía del Espíritu, que lo mueve de una manera predestinada para que haga todo cuanto llega a desear.


    En cuanto a las cosas que llegaron a existir a partir de él, habló acerca de ellas, y llegaron a existir como una semejanza de los lugares espirituales a los que nos referimos antes al tratar el tema de las imágenes. Él <hizo> más que simplemente trabajar, pues, al ser designado padre de su plan de salvación, engendró no solo por medio de sí mismo y de las semillas, sino también [por medio del] Espíritu escogido que descenderá [a través de él] a los lugares de abajo. Él hace [más] que limitarse a pronunciar sus propias palabras espirituales, <pues> lo hace de manera oculta por medio del Espíritu que clama y da a luz cosas que superan su propia naturaleza. Puesto que, según su naturaleza, él es Dios y Padre, y todos los demás títulos de honor, supuso que estos correspondían a su propia naturaleza.


    Estableció un reposo para quienes le obedecen; para quienes le desobedecen, <también> <instituyó> castigos. Con él habitan un paraíso y un reino, además de todas las otras cosas que habitan en el eón[c] que existía antes que él. Estas tienen más valor que las copias debido a su relación con el pensamiento. (Esta relación) es, por así decirlo, comparable a [] una sombra y una vestidura, porque él no puede ver cómo existe realmente todo cuanto existe.


    Instituyó trabajadores y servidores para que lo ayudaran en lo que haría y diría, porque dondequiera que actuaba dejaba su rostro con su hermoso nombre, produciendo y pronunciando cuanto contempla. A partir de su propia esencia, [él] estableció en su lugar imágenes visibles de la luz y [los] lugares espirituales (invisibles). De esta manera, todo lugar en todas partes fue embellecido por él al reflejar la imagen de quien los colocó, y así quedaron establecidos. Aunque los paraísos, los reinos, los reposos, las promesas y las multitudes de servidores que cumplen su voluntad son señores gobernantes, están puestos por debajo del señor que los designó.


    Después de escucharlo de esta manera, colocó las luces que <constituyen> la fuente <del> sistema sobre el ordenamiento de las cosas de abajo. Así fue como el Espíritu invisible lo movió, para que [] se inclinara a gobernar por medio de su propio servidor, al cual también empleó como mano, como <boca> y hasta como rostro. Produjo orden, amenazas y temor, para que quienes actuaban desde la ignorancia […] pudieran conservar el lugar [que se les dio para] guardar, pues están atados a sus lugares por [las cadenas de] los arcontes que están sobre ellos.


    La naturaleza entera de la materia [está] dividida en tres categorías: el Verbo espiritual produjo las [primeras] potestades a partir de la imaginación y el orgullo, y las colocó en primer lugar según el rango espiritual. A aquellas (potestades) que estas produjeron por afán de dominio, él las colocó en el rango intermedio, porque, [en consecuencia], <eran> potestades ávidas de dominio, para que pudieran gobernar e impartir por la fuerza órdenes obligatorias al orden establecido debajo de ellas. A las que llegaron a existir por la envidia y los celos, así como a todo otro fruto de esas inclinaciones, las colocó en un orden de esclavitud para que controlaran los límites más externos y mandaran sobre todo lo que existe y sobre toda generación. De estas proceden (entidades) de enfermedades que matan repentinamente y que están ansiosas por engendrar, aunque no eran nada en el lugar donde se habían originado y al cual volverán de nuevo. Por tanto, puso sobre ellas potestades con autoridad
    que trabajan sin cesar en la materia, para que [] la descendencia de los existentes pudiera existir igualmente sin cesar, porque esta es su gloria.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Arcontes» es un término técnico que significa gobernantes o potestades dentro del orden cósmico descrito por el tratado.
    reason: Ayuda al lector general sin reemplazar el vocabulario especializado del texto.
  - marker: b
    text: «Demiurgo» designa aquí al artífice y ordenador de las realidades inferiores; el pasaje lo presenta subordinado al Verbo y movido sin saberlo por el Espíritu.
    reason: Aclara el sentido contextual del título sin identificarlo con una doctrina denominacional posterior.
  - marker: c
    text: «Eón» es un término técnico que puede referirse a una realidad, ámbito o entidad del orden eterno, y no solo a un período de tiempo.
    reason: Evita que el lector entienda el término únicamente en sentido cronológico.
  - marker: d
    text: Los corchetes señalan texto suplido o una laguna; los paréntesis, aclaraciones del testimonio; y los signos angulares, restauraciones propuestas. Se conservaron porque la revisión directa del copto está pendiente.
    reason: Hace transparente el carácter provisional y documental de la traducción y explica la notación crítica presente en el texto.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico tradicional del entorno cosmológico del tratado; «gobernantes» perdería su función como designación de una clase específica de potestades.
- source_word: Word
  choice: Verbo
  rationale: «Verbo» mantiene la personificación y el trasfondo técnico de Logos, con mayúscula para distinguirlo del habla ordinaria.
- source_word: Demiurge
  choice: Demiurgo
  rationale: Se translitera el título cosmológico sin sustituirlo por «Creador», lo cual podría borrar la distinción que el texto establece entre este personaje y las realidades superiores.
- source_word: aeon
  choice: eón
  rationale: Se conserva el tecnicismo cosmológico, pues aquí no significa simplemente una época o un período cronológico.
- source_word: repose
  choice: reposo
  rationale: Mantiene la cualidad sustantiva y posiblemente escatológica del término sin interpretarlo de manera más específica como cielo, descanso eterno o salvación.
- source_word: Place / Abode
  choice: Lugar / Morada
  rationale: Se distinguen ambos títulos, en vez de fundirlos, para conservar la serie honorífica del testimonio.
- source_word: lust for control
  choice: afán de dominio
  rationale: Expresa el deseo desordenado de ejercer control de modo natural y digno, y enlaza con «ávidas de dominio» sin imponer una categoría doctrinal posterior.
theological_decisions:
- issue: Los títulos divinos atribuidos al demiurgo
  choice: Conservar «Padre», «Dios» y los demás títulos tal como aparecen, junto con la afirmación posterior de que él supone que le pertenecen por naturaleza.
  alternative: Rebajar los títulos con comillas distanciadoras adicionales o explicarlos como falsos.
  rationale: El pasaje sostiene deliberadamente la tensión entre la dignidad funcional del personaje, su ignorancia y el origen superior del movimiento que actúa en él; la traducción no debe resolver esa tensión.
- issue: Agencia del Espíritu y del demiurgo
  choice: Mantener los pronombres y las construcciones de agencia sin identificar de manera explícita a cada agente donde el testimonio es ambiguo.
  alternative: Añadir nombres como «el demiurgo», «el Verbo» o «el Espíritu» en cada cláusula.
  rationale: La expansión aclaratoria podría imponer una lectura de la jerarquía y de la causalidad que el testimonio suministrado no fija con certeza.
- issue: «Plan de salvación»
  choice: Conservar la expresión sin definir su alcance ni beneficiarios.
  alternative: Traducirla o glosarla como redención universal, restauración o salvación de un grupo específico.
  rationale: El fragmento no resuelve aquí esas cuestiones, y una formulación más específica importaría una interpretación teológica.
- issue: Predestinación del movimiento interior
  choice: Traducir «de una manera predestinada» sin armonizarla con la voluntad o ignorancia del personaje.
  alternative: Reformularla como simple providencia, permiso o determinación absoluta.
  rationale: Se preserva la tensión del texto entre impulso predestinado y el hecho de que el personaje hace cuanto llega a desear.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron los términos cosmológicos técnicos cuando una paráfrasis borraría distinciones importantes. La redacción busca fluidez sin eliminar repeticiones, cambios de agente ni tensiones del testimonio. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del manuscrito copto del Códice de Nag Hammadi I,5.
