translation:
  language: es
  text: 'No solo el Hijo existía desde el principio, sino que también la Iglesia existía desde el principio. Si alguien piensa que reconocer que el Hijo es hijo único contradice esta afirmación —debido al carácter enigmático del asunto—, no es así. Así como […] [a] el Padre es una unidad y no se ha revelado como Padre a nadie sino a sí mismo, también el Hijo fue hallado como hermano de nadie sino de sí mismo, pues es ingénito y no tiene principio. El Padre se maravilla de sí mismo [como] Padre, y se da [gloria], honor y [amor].[b] Además, también se concibe a sí mismo como Hijo, de acuerdo con los atributos de no tener principio ni fin. De este modo queda confirmado el asunto.


    Sus incontables e ilimitados descendientes son inseparables. Los que existen procedieron del Hijo y del Padre como los besos de quienes se besan con un pensamiento bueno e insaciable: el abrazo es uno, aunque comprende muchos besos. Esto significa que la Iglesia está compuesta por muchos individuos que existían antes de los eones; a esto, en sentido estricto, se lo llama «los eones de los eones». Este es el carácter de los espíritus santos e imperecederos, en quienes reposa el Hijo, porque tal es su naturaleza, así como el Padre también reposa […] [c] sobre el Hijo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay una laguna en el testimonio en este punto; no se completa el texto faltante.
    reason: Señalar daño o ausencia textual sin conjeturar su contenido.
  - marker: b
    text: Las palabras «como», «gloria» y «amor» aparecen como restauraciones editoriales en el testimonio inglés utilizado para este borrador.
    reason: Distinguir las restauraciones editoriales del texto conservado, ya que aún está pendiente la revisión directa del copto.
  - marker: c
    text: Hay una laguna antes de «sobre el Hijo»; la relación sintáctica exacta debe confirmarse mediante revisión del manuscrito copto.
    reason: Preservar la señal de texto faltante y advertir que la lectura es provisional.
lexical_decisions:
- source_word: Church
  choice: Iglesia
  rationale: Se conserva el término colectivo tradicional y reconocible, con mayúscula por tratarse de una realidad primordial personificada en el pasaje.
- source_word: only son
  choice: hijo único
  rationale: Expresa la singularidad filial sin introducir terminología doctrinal más técnica que la del testimonio disponible.
- source_word: unbegotten
  choice: ingénito
  rationale: Mantiene la distinción entre no haber sido engendrado y simplemente no tener comienzo; es un término teológico preciso, aunque menos cotidiano.
- source_word: aeons
  choice: eones
  rationale: Conserva el término cosmológico técnico del escrito y evita identificarlo reductivamente con simples períodos temporales.
- source_word: offspring
  choice: descendientes
  rationale: Es una expresión comprensible que conserva la imagen de procedencia; no se sustituye por «emanaciones», que impondría una interpretación técnica.
- source_word: reposes
  choice: reposa
  rationale: Retiene la imagen de descanso o permanencia sin resolver si debe entenderse espacial, relacional u ontológicamente.
theological_decisions:
- issue: Coexistencia primordial del Hijo y la Iglesia
  choice: Se afirma que ambos existían desde el principio.
  alternative: Explicar la Iglesia como una idea o propósito divino preexistente.
  rationale: El testimonio afirma directamente la existencia primordial de la Iglesia; explicarla como mero plan resolvería una tensión que el texto deja abierta.
- issue: El Hijo como «hijo único» y a la vez «hermano»
  choice: Se conservan ambas designaciones y la formulación paradójica «hermano de nadie sino de sí mismo».
  alternative: Armonizar el pasaje entendiendo «hermano» solo en sentido figurado o referido a la Iglesia.
  rationale: El argumento es deliberadamente enigmático y no identifica de manera explícita a otro hermano; la traducción no debe suplirlo.
- issue: El Padre se concibe a sí mismo como Hijo
  choice: Se traduce la afirmación de manera directa.
  alternative: Reformularla como que el Padre concibe o engendra al Hijo como alguien distinto.
  rationale: La alternativa introduciría una aclaración ontológica ausente del testimonio y eliminaría la tensión interna del pasaje.
- issue: Relación de procedencia desde el Hijo y el Padre
  choice: «procedieron del Hijo y del Padre».
  alternative: «fueron creados por el Hijo y el Padre» o «emanaron».
  rationale: «Procedieron» preserva la relación de origen sin decidir entre creación, generación o emanación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron «Iglesia», «Hijo» y «Padre» con mayúscula por su función personificada; «eones» e «ingénito» se conservaron como vocabulario técnico necesario. Las repeticiones y paradojas principales no se suavizaron. Borrador provisional basado en el testimonio inglés público suministrado; queda pendiente la revisión directa de la fuente copta del Códice de Nag Hammadi I,5.
