review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva adecuadamente la secuencia argumentativa y las paradojas del testimonio inglés provisional: la coexistencia primordial del Hijo y la Iglesia, «hijo único», «hermano de nadie sino de sí mismo», el carácter ingénito y sin comienzo, y la procedencia de los muchos desde el Hijo y el Padre. Se mantienen de forma visible las lagunas y restauraciones entre corchetes. La revisión directa del copto sigue pendiente, por lo que no se puede confirmar la extensión ni la sintaxis de las lagunas.'
  naturalness: 'Se requieren ajustes menores para un español latinoamericano más fluido y preciso: «Así como […] el Padre» evita un anclaje de nota incrustado que se confunde con el texto; «se descubrió que el Hijo era...» expresa naturalmente la construcción pasiva del testimonio; «se otorga» y «Tal es la naturaleza...» resultan más idiomáticos que «se da» y «Este es el carácter».'
  terminology: Se conservan correctamente «Iglesia», «Hijo», «Padre», «hijo único», «ingénito» y «eones». «Ingénito» es técnico pero apropiado para distinguir “unbegotten” de «sin principio». Se conserva «descendientes», sin imponer «emanaciones», y «proceden», sin imponer creación o una teoría específica de origen.
  issues:
  - severity: medium
    issue: El anclaje «[a]» aparece inmediatamente tras «[…]» y da la impresión de formar parte del texto dañado.
    rationale: Los corchetes ya señalan la laguna; el marcador de nota debe distinguirse tipográficamente de la señal editorial para no añadir una letra espuria al pasaje.
  - severity: low
    issue: «también el Hijo fue hallado como hermano de nadie sino de sí mismo» es sintácticamente poco natural en español.
    rationale: «También se descubrió que el Hijo era hermano de nadie sino de sí mismo» conserva la pasiva y la paradoja sin alterar su referente.
  - severity: low
    issue: 'Algunas formulaciones son demasiado literales o poco naturales: «se da gloria», «Este es el carácter» y «De este modo queda confirmado el asunto».'
    rationale: «Se otorga», «Tal es la naturaleza» y «Así queda confirmada la cuestión» mantienen el sentido del testimonio con mejor idiomaticidad.
  revised_text: 'No solo el Hijo existía desde el principio, sino que también la Iglesia existía desde el principio. Si alguien piensa que el reconocimiento de que el Hijo es hijo único contradice esta afirmación, debido al carácter enigmático de la cuestión, no es así. Así como […] el Padre es una unidad y no se ha revelado como Padre a nadie sino a sí mismo, también se descubrió que el Hijo era hermano de nadie sino de sí mismo, puesto que es ingénito y no tiene principio. El Padre se admira a sí mismo [como] Padre, y se otorga [gloria], honor y [amor]. Además, se concibe a sí mismo como Hijo, de acuerdo con los atributos de no tener principio ni fin. Así queda confirmada la cuestión.


    Sus incontables e ilimitados descendientes son inseparables. Los que existen proceden del Hijo y del Padre como los besos de quienes se besan con un pensamiento bueno e insaciable; el abrazo es uno, aunque comprende muchos besos. El sentido es que la Iglesia comprende a muchos individuos que existían antes de los eones, lo que, en sentido estricto, se llama «los eones de los eones». Tal es la naturaleza de los espíritus santos e imperecederos, sobre quienes reposa el Hijo, porque tal es su naturaleza, así como el Padre también reposa […] sobre el Hijo.'
  revised_footnotes:
  - marker: a
    text: La laguna indicada por «[…]» no se completa; la sintaxis y el contenido faltantes deben confirmarse mediante revisión directa del copto.
    reason: Distingue el daño textual de cualquier reconstrucción editorial y evita que el marcador de nota parezca una letra del texto.
  - marker: b
    text: Las palabras entre corchetes «[como]», «[gloria]» y «[amor]» representan restauraciones editoriales en el testimonio inglés utilizado para este borrador.
    reason: Preserva la distinción entre texto conservado y restauraciones provisionales.
  - marker: c
    text: Hay una laguna antes de «sobre el Hijo». La relación sintáctica exacta debe confirmarse mediante revisión del manuscrito copto.
    reason: Mantiene visible la incertidumbre textual sin resolverla interpretativamente.
  revision_rationale: Se corrigen problemas de fluidez y de presentación de los anclajes, sin armonizar ni explicar las afirmaciones paradójicas del pasaje. Se preservan todas las lagunas y restauraciones editoriales del testimonio suministrado. El texto sigue siendo una traducción provisional basada en la versión inglesa pública, pendiente de cotejo directo con el copto.
