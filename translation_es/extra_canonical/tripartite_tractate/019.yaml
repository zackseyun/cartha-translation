  footnotes:
  - marker: a
    text: Los signos < > señalan palabras suplidas por los editores; los corchetes y puntos suspensivos indican una laguna o texto perdido en el manuscrito. La revisión directa del copto está pendiente.
    reason: Informa al lector sobre restauraciones y daños textuales, especialmente en una oración de sintaxis incierta.
  - marker: b
    text: «Anímicos» traduce una designación relacionada con el alma. Aquí funciona como nombre de uno de los dos órdenes y no equivale sencillamente a «espirituales».
    reason: Aclara un término técnico poco habitual sin resolver la cosmología del tratado.
lexical_decisions:
- source_word: Fullness
  choice: Plenitud
  rationale: Conserva el sentido técnico de la totalidad trascendente sin sustituirlo por el préstamo «pleroma», menos accesible para el lector común.
- source_word: conversion
  choice: conversión
  rationale: Mantiene el giro o retorno espiritual que expresa el testimonio, sin precisarlo como arrepentimiento cuando la fuente no lo hace.
- source_word: Word
  choice: Verbo
  rationale: Se usa como título personal y principio agente; «Verbo» conserva la resonancia del Logos y distingue el título de la «palabra de belleza».
- source_word: Soulish
  choice: anímicos
  rationale: Reproduce una categoría antropológica intermedia vinculada al alma; evita «espirituales», que borraría la distinción propia del pasaje.
- source_word: aeon
  choice: eón
  rationale: Conserva el término cosmológico técnico del tratado, ya asentado en español para este tipo de literatura.
- source_word: archons
  choice: arcontes
  rationale: Mantiene el término técnico para las potestades gobernantes y evita identificarlas sin más con gobernantes humanos.
- source_word: lust for control
  choice: afán de dominio
  rationale: Expresa de forma natural el deseo desordenado de mandar, sin limitarlo al mero ejercicio neutral de autoridad.
- source_word: likeness
  choice: semejanza
  rationale: La distingue coherentemente de «imagen» y «representación», preservando la tríada terminológica del texto.
theological_decisions:
- issue: Naturaleza de los dos órdenes
  choice: Conservar las designaciones técnicas y paralelas sin explicar su sistema doctrinal dentro del texto
  alternative: Interpretarlas explícitamente como clases fijas de seres humanos o potestades cósmicas
  rationale: El pasaje mezcla categorías cosmológicas, morales y gubernativas; una identificación más precisa resolvería una ambigüedad que el testimonio no resuelve.
- issue: Función de las potestades dominadoras en el plan de salvación
  choice: Mantener que son útiles y reciben gobierno dentro del plan de salvación
  alternative: Presentarlas únicamente como poderes malignos opuestos a la salvación
  rationale: La tensión entre su afán de dominio y su utilidad providencial pertenece al texto y no debe eliminarse.
- issue: Identidad del Verbo
  choice: Traducir el título de manera personal, sin añadir una identificación cristológica explícita
  alternative: Añadir «Cristo» o explicar que se trata necesariamente de Jesucristo
  rationale: El tratado atribuye acciones personales al Verbo, pero este fragmento no formula por sí solo una identificación explícita que deba insertarse.
- issue: Kingship over them
  choice: «potestad regia sobre ellos»
  alternative: «un rey por encima de ellos»
  rationale: El antecedente y la construcción son difíciles en el testimonio; se conserva la lectura abstracta del testimonio inglés sin imponer una jerarquía adicional.
translation_notes:
  register: Español latinoamericano neutral, digno y actual. Se preservan términos cosmológicos necesarios —«eón», «arcontes», «Verbo»— y las señales editoriales del testimonio. El borrador es necesariamente provisional porque se proporcionó un testimonio inglés de dominio público y la revisión directa de la fuente copta sigue pendiente.
