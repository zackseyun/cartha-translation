  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: es
  text: 'Los seres de la memoria que están afuera son humildes y conservan la representación de la Plenitud, sobre todo porque participan unos con otros de los nombres que los adornan. La conversión produce humildad ante los seres de la memoria; y la humildad ante ellos es también la ley del juicio, que consiste en condenación e ira.


    La humildad ante ellos es también el poder que aparta a quienes caen por debajo de ellos y los arroja lejos. Les impide […] extenderse sobre los seres de la memoria y sobre la conversión. Este poder comprende el temor, la confusión, el olvido, el desconcierto, la ignorancia y las cosas que llegaron a existir por medio de la imaginación, como lo hace una semejanza. Además, se conceden nombres elevados a estas cosas que en realidad eran bajas. <Les falta el conocimiento a quienes> fueron producidos por ellas mediante el orgullo, el afán de dominio, la desobediencia y la falsedad.[a]


    A cada <uno de> ellos le concedió un nombre, porque los dos órdenes subsisten en un nombre. A quienes pertenecen a la memoria y a la representación se los llama «los de la Derecha», «los anímicos», «los de Fuego» y «los del Medio». A quienes pertenecen al pensamiento orgulloso y a la semejanza se los llama «los de la Izquierda», «los materiales», «los Oscuros» y «los Últimos».[b]


    Después de establecer el Verbo a cada uno en su propio orden —es decir, las imágenes, las representaciones y las semejanzas—, mantuvo puro el eón de las imágenes frente a todos los que luchan contra él, porque es un lugar de alegría. Sin embargo, a los de la memoria les reveló el pensamiento del que se había despojado. Quería conducirlos a una unión material y proporcionarles un orden y una morada, para que también pudieran producir un deseo que debilitara en ellos la atracción del mal. Así dejarían de deleitarse excesivamente en la gloria de cuanto los rodeaba y de permanecer por ello en el exilio; en cambio, reconocerían la debilidad que padecían. […] De este modo podrían engendrar amor y una búsqueda incesante de aquel que puede sanarlos de esa debilidad. Para hacer que adoptaran una forma, puso la palabra de belleza sobre quienes pertenecen a la semejanza, y puso también sobre ellos la ley del juicio. Además, puso sobre ellos los poderes que las raíces habían producido [en] su afán
    de dominio. El Verbo se complació en ellos porque son útiles en el plan de salvación; por eso los [escogió] para que gobernaran sobre ellos. Así, mediante la ayuda de la palabra bella, la amenaza de la [ley] o el influjo del afán de dominio, el orden quedaría protegido de quienes lo rebajarían hasta el mal.


    El Verbo conoce el afán de dominio que comparten los dos órdenes. A ellos y a todos los demás les concedió bondadosamente lo que deseaban, dando a cada uno el rango de mando que le correspondía. Así, cada uno gobernaría sobre un lugar y una actividad, subordinándose a los de orden superior y dirigiendo la actividad de los lugares inferiores, mientras ejercía el dominio conforme a su modo de ser. Como resultado, entre los ángeles […] y los arcángeles hay jefes y subordinados en posiciones de gobierno y sujeción, mientras que las actividades son diversas y de distintas clases.


    Cada uno de los arcontes, junto con su estirpe y sus privilegios, disfruta de aquello a lo que le da derecho la porción que le tocó. Conforme al modo en que aparecieron, cada uno ocupó su puesto, encargado del plan de salvación. Y ninguno carece de potestad regia sobre ellos, desde un extremo de los cielos hasta el extremo de la [tierra], en toda región de la [tierra] y entre quienes están debajo de la tierra. Hay reyes y señores, y también quienes reciben órdenes: unos supervisan el castigo; otros, la justicia; otros conceden descanso y sanidad; otros imparten instrucción; y otros vigilan.'
