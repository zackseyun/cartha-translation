review_pass:
  verdict: revise
  source_fidelity: La revisión directa del griego y de las versiones antiguas sigue pendiente; por tanto, el cotejo se limita al testimonio inglés suministrado. El borrador reproduce en general el contenido, los nombres y los corchetes editoriales. Sin embargo, 10:2 convierte una construcción ambigua y problemática en una afirmación de autobautismo mediante «me ayudó a bautizarme», y 10:15 sustituye explícitamente «vida monástica» por una paráfrasis interpretativa que atenúa el léxico del testimonio.
  naturalness: El español es mayormente natural, actual y adecuado para un registro narrativo religioso. Se recomiendan ajustes menores para reflejar con mayor precisión «floor», el referente de «all who heard» y «no one regarded them».
  terminology: «Señor», «Dios», «Cristo», «mártir», «espíritus impuros», «oráculos de Dios» y «virgen» son adecuados. «Vida monástica» debe conservarse en el texto, sin resolver mediante paráfrasis el posible anacronismo histórico-literario. Se preservan las alternativas toponímicas y los corchetes.
  issues:
  - severity: high
    issue: '10:2: «me ayudó a bautizarme» introduce autobautismo.'
    rationale: El testimonio dice literalmente que quien asiste a Pablo en la predicación «has assisted me to baptize». Aunque la frase es difícil en el contexto de «he sido bautizada», el reflexivo español especifica que Tecla se bautizó a sí misma. Debe conservarse la dificultad sin imponer esa lectura.
  - severity: medium
    issue: '10:15: «vida de retiro y disciplina» reemplaza «led a monastic life».'
    rationale: La paráfrasis elimina un término afirmado por el testimonio inglés y la nota justifica una modificación interpretativa por anacronismo. La fidelidad exige traducir «vida monástica»; una nota puede señalar que el alcance histórico del término requiere cautela.
  - severity: low
    issue: '10:3: «todos los que la oyeron» restringe el objeto de la audición a Tecla.'
    rationale: El testimonio dice «all who heard», probablemente referido al relato o a lo sucedido. «Todos los que oyeron esto» evita esa restricción no expresada.
  - severity: low
    issue: '10:6: «en el lugar» atenúa «upon the floor».'
    rationale: «En el suelo donde Pablo se había sentado y predicado» conserva el gesto y el referente espacial del testimonio.
  - severity: low
    issue: '10:18: «nadie recurría a ellos» es más específico que «no one regarded them».'
    rationale: «Nadie les hacía caso» conserva la falta general de consideración, sin limitarla a la consulta médica.
  revised_text: '10:1 Pero Pablo se sorprendió mucho al verla acompañada de la gente que estaba con ella, pues pensó que se les venía encima una nueva prueba.


    10:2 Al darse cuenta de esto, Tecla le dijo: «He sido bautizada, Pablo, porque quien te asiste en la predicación me asistió en el bautismo».[a]


    10:3 Entonces Pablo la tomó consigo y la llevó a casa de Hermes. Tecla le contó a Pablo todo lo que le había sucedido en Antioquía, de modo que Pablo quedó sumamente asombrado; y todos los que oyeron esto fueron fortalecidos en la fe y oraron por el bienestar de Trifena.


    10:4 Luego Tecla se levantó y le dijo a Pablo: «Voy a Iconio». Pablo le respondió: «Ve y enseña la palabra del Señor».


    10:5 Pero Trifena había enviado a Pablo, por medio de Tecla, grandes sumas de dinero y también ropa para socorrer a los pobres.


    10:6 Tecla fue, pues, a Iconio. Al llegar a casa de Onesíforo, se postró en el suelo donde Pablo se había sentado y predicado. Mezclando sus lágrimas con sus oraciones, alabó y glorificó a Dios con estas palabras:


    10:7 «Señor, Dios de esta casa, en la cual tú me iluminaste por primera vez; Jesús, Hijo del Dios viviente, tú fuiste mi ayudante ante el gobernador, mi ayudante en el fuego y mi ayudante entre las fieras. Solo tú eres Dios por los siglos de los siglos. Amén».


    10:8 A su regreso, Tecla encontró muerto a Tamiris, pero a su madre aún con vida. Entonces llamó a su madre y le dijo: «Teoclia, madre mía, ¿será posible que llegues a creer que hay un solo Señor Dios, que habita en los cielos? Si deseas grandes riquezas, Dios te las dará por medio de mí; si quieres recuperar a tu hija, aquí estoy».


    10:9 Con estas y muchas otras palabras procuraba persuadir a su madre. Pero su madre, Teoclia, no creyó lo que le decía la mártir Tecla.[b]


    10:10 Cuando Tecla comprendió que hablaba en vano, trazó la señal [de la cruz] sobre todo su cuerpo,[c] salió de la casa y se dirigió a Dafne. Al llegar allí, fue a la cueva donde había encontrado a Pablo con Onesíforo, se postró en tierra y lloró ante Dios.


    10:11 Después de salir de allí, fue a Seleucia e iluminó a muchos en el conocimiento de Cristo.


    10:12 Y una nube resplandeciente la guio en su viaje.


    10:13 Después de llegar a Seleucia, fue a un lugar fuera de la ciudad, aproximadamente a un estadio de distancia,[d] porque temía a sus habitantes, ya que adoraban ídolos.


    10:14 Y fue conducida [por la nube] a un monte llamado Calamón, o Rodeón.[e] Allí permaneció muchos años y soportó numerosas y dolorosas tentaciones del diablo. Con la ayuda que recibía de Cristo, las sobrellevó dignamente.


    10:15 Finalmente, algunas mujeres de buena posición oyeron hablar de la virgen Tecla y acudieron a ella. Fueron instruidas por ella en los oráculos de Dios, y muchas abandonaron este mundo y llevaron con ella una vida monástica.[f]


    10:16 De este modo se difundió por todas partes la buena fama de Tecla, y ella realizó varias curaciones [milagrosas]. Por eso, gente de toda la ciudad y de las regiones vecinas llevaba a sus enfermos a aquel monte. Antes de que llegaran siquiera a la entrada de la cueva, quedaban curados al instante de cualquier enfermedad que padecieran.


    10:17 Los espíritus impuros eran expulsados dando gritos; todos recibían sanos a sus enfermos y glorificaban a Dios, quien había concedido tal poder a la virgen Tecla.


