  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: es
  text: '10:1 Pero Pablo se sorprendió mucho al verla acompañada de aquella gente, pues pensó que se les venía encima una nueva prueba.


    10:2 Al darse cuenta de esto, Tecla le dijo: «He sido bautizada, Pablo, porque el que te ayuda a predicar también me ayudó a bautizarme».[a]


    10:3 Entonces Pablo la tomó consigo y la llevó a casa de Hermes. Tecla le contó todo lo que le había sucedido en Antioquía. Pablo quedó sumamente asombrado, y todos los que la oyeron fueron fortalecidos en la fe y oraron por el bienestar de Trifena.


    10:4 Luego Tecla se levantó y le dijo a Pablo: «Voy a Iconio». Pablo le respondió: «Ve y enseña la palabra del Señor».


    10:5 Trifena había enviado a Pablo, por medio de Tecla, grandes sumas de dinero y también ropa para socorrer a los pobres.


    10:6 Tecla fue, pues, a Iconio. Al llegar a casa de Onesíforo, se postró en el lugar donde Pablo se había sentado a predicar. Entre lágrimas y oraciones, alabó y glorificó a Dios con estas palabras:


    10:7 «Señor, Dios de esta casa, en la cual tú me iluminaste por primera vez; Jesús, Hijo del Dios viviente, tú me ayudaste ante el gobernador, me ayudaste en el fuego y me ayudaste entre las fieras. Solo tú eres Dios por los siglos de los siglos. Amén».


    10:8 A su regreso, Tecla encontró muerto a Tamiris, pero a su madre aún con vida. Entonces llamó a su madre y le dijo: «Teoclia, madre mía, ¿será posible que llegues a creer que hay un solo Señor Dios, que habita en los cielos? Si deseas grandes riquezas, Dios te las dará por medio de mí; si quieres recuperar a tu hija, aquí estoy».


    10:9 Con estas y muchas otras palabras procuraba persuadir a su madre. Pero Teoclia no creyó lo que le decía la mártir Tecla.[b]


    10:10 Cuando Tecla comprendió que hablaba en vano, trazó la señal [de la cruz] sobre todo su cuerpo,[c] salió de la casa y se dirigió a Dafne. Al llegar allí, fue a la cueva donde había encontrado a Pablo con Onesíforo, se postró en tierra y lloró ante Dios.


    10:11 Después de salir de allí, fue a Seleucia e iluminó a muchos con el conocimiento de Cristo.


    10:12 Una nube resplandeciente la guio durante el viaje.


    10:13 Después de llegar a Seleucia, se retiró a un lugar fuera de la ciudad, aproximadamente a un estadio de distancia,[d] porque temía a sus habitantes, ya que adoraban ídolos.


    10:14 Y fue conducida [por la nube] a un monte llamado Calamón, o Rodeón.[e] Allí permaneció muchos años y soportó numerosas y dolorosas tentaciones del diablo. Con la ayuda que recibía de Cristo, las sobrellevó dignamente.


    10:15 Con el tiempo, algunas mujeres de buena posición oyeron hablar de la virgen Tecla y acudieron a ella. Tecla las instruyó en los oráculos de Dios, y muchas renunciaron al mundo y llevaron con ella una vida de retiro y disciplina.[f]


    10:16 Así se difundió por todas partes la buena fama de Tecla, y ella realizó varias curaciones [milagrosas]. Por eso, gente de toda la ciudad y de las regiones vecinas llevaba a sus enfermos a aquel monte. Antes de que alcanzaran la entrada de la cueva, quedaban curados al instante de cualquier enfermedad que padecieran.


    10:17 Los espíritus impuros salían dando gritos; todos recibían sanos a sus enfermos y glorificaban a Dios, quien había concedido tal poder a la virgen Tecla.


    10:18 Como consecuencia, los médicos de Seleucia dejaron de ser estimados y perdieron todas las ganancias de su oficio, porque nadie recurría a ellos. Entonces se llenaron de envidia y comenzaron a tramar qué hacer contra esta sierva de Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La frase también puede entenderse: «el que colabora contigo en la predicación colaboró conmigo en el bautismo». El agente no se identifica expresamente en el testimonio utilizado.'
    reason: Preserva una ambigüedad relevante acerca del agente y la forma del bautismo.
  - marker: b
    text: Aquí «mártir» puede tener el sentido antiguo de «testigo» o funcionar como título honorífico anticipado.
    reason: Evita que el lector suponga necesariamente que el texto afirma que Tecla ya había muerto.
  - marker: c
    text: Las palabras «de la cruz» aparecen entre corchetes en el testimonio inglés y podrían representar una aclaración o restauración textual.
    reason: Conserva la señal editorial suministrada y transparenta su carácter incierto.
  - marker: d
    text: Un estadio equivalía aproximadamente a 185 metros, aunque su longitud variaba en la antigüedad.
    reason: Aclara una medida antigua poco familiar.
  - marker: e
    text: 'El testimonio conserva dos nombres alternativos para el monte: Calamón y Rodeón; no se han armonizado.'
    reason: Mantiene la variante toponímica recibida.
  - marker: f
    text: El testimonio inglés dice literalmente «llevaron una vida monástica». La traducción evita imponer al relato la forma institucional que el monacato adquirió en épocas posteriores.
    reason: Reduce el anacronismo sin borrar el carácter ascético del pasaje.
lexical_decisions:
- source_word: assists ... to baptize
  choice: me ayudó a bautizarme
  rationale: Mantiene la forma reflexiva del testimonio inglés sin convertirla en una afirmación más específica acerca de quién administró el bautismo.
- source_word: enlightened
  choice: iluminaste / iluminó
  rationale: Conserva la metáfora religiosa del testimonio en 10:7 y 10:11, sin reducirla simplemente a «enseñar».
- source_word: oracles of God
  choice: oráculos de Dios
  rationale: Preserva la expresión solemne y su amplitud semántica, que puede aludir a palabras o revelaciones divinas.
- source_word: furlong
  choice: estadio
  rationale: Emplea la medida antigua correspondiente, más apropiada al contexto que la unidad inglesa del testimonio.
- source_word: gentlewomen
  choice: mujeres de buena posición
  rationale: Comunica la probable condición social sin usar un arcaísmo poco natural como «damas gentiles».
- source_word: led a monastic life
  choice: llevaron ... una vida de retiro y disciplina
  rationale: Evita proyectar sobre el relato una institución monástica plenamente desarrollada, aunque conserva el sentido ascético del testimonio.
theological_decisions:
- issue: Identidad del ayudante en el bautismo de Tecla
  choice: «el que te ayuda a predicar también me ayudó a bautizarme»
  alternative: «el que obra contigo en la predicación obró también conmigo en el bautismo»
  rationale: La redacción conserva la ambigüedad sobre si se alude a Cristo, a Dios o a otro agente y no impone una explicación sacramental.
- issue: Afirmación «solo tú eres Dios» dirigida a Jesús
  choice: Se conserva literalmente dentro de la oración
  alternative: Reformular como «tú eres Dios» o referirla al Señor de la primera invocación
  rationale: El pasaje contiene una tensión cristológica genuina que no debe armonizarse ni explicarse dentro del texto.
- issue: Título «mártir» aplicado a Tecla
  choice: la mártir Tecla
  alternative: la testigo Tecla
  rationale: Se conserva el título transmitido por el testimonio, aunque Tecla continúa viva en la narración; la nota advierte su posible sentido honorífico o testimonial.
- issue: Poder de curación atribuido a Tecla
  choice: Dios «había concedido tal poder» a Tecla
  alternative: Dios sanaba por medio de Tecla
  rationale: Respeta la formulación del testimonio sin resolver cómo debe entenderse la agencia divina y humana.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la numeración, los nombres propios y las señales de incertidumbre del testimonio. Dado que la revisión directa del griego está pendiente y solo se proporcionó un testimonio inglés de dominio público, este borrador debe considerarse provisional y sujeto a cotejo con la tradición manuscrita griega y versional.
