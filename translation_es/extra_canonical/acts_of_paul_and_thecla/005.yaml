  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: es
  text: '5:1 Por fin notaron la ausencia de Tecla, y su familia y Tamiris la buscaron por todas las calles, como si se hubiera perdido. Pero uno de los compañeros de servicio del portero les dijo que ella había salido durante la noche.


    5:2 Entonces interrogaron al portero, y él les dijo que había ido a la cárcel para ver al extranjero.


    5:3 Así que siguieron sus indicaciones y la encontraron allí. Al salir, reunieron a una multitud y fueron a contarle al gobernador todo lo sucedido.


    5:4 Al enterarse, el gobernador ordenó que llevaran a Pablo ante su tribunal.


    5:5 Mientras tanto, Tecla permanecía tendida en el suelo de la cárcel, justo en el lugar donde Pablo se había sentado para enseñarle. Por eso, el gobernador ordenó también que la llevaran ante su tribunal. Ella recibió la orden con alegría y fue.


    5:6 Cuando llevaron allí a Pablo, la multitud gritó con más vehemencia:


    —¡Es un hechicero! ¡Que muera!


    5:7 Sin embargo, el gobernador escuchaba con agrado los discursos de Pablo acerca de las obras santas de Cristo. Después de convocar al consejo, hizo comparecer a Tecla y le preguntó:


    —¿Por qué no te casas con Tamiris, conforme a la ley de los habitantes de Iconio?[a]


    5:8 Ella permaneció en silencio, con los ojos fijos en Pablo. Al ver que no respondía, su madre, Teoclia, gritó:


    —¡Que quemen a esa malvada! ¡Que la quemen en medio del teatro por rechazar a Tamiris, para que todas las mujeres aprendan de ella a no comportarse así!


    5:9 El gobernador se afligió profundamente y ordenó que expulsaran a Pablo de la ciudad a latigazos y que quemaran a Tecla.


    5:10 Luego el gobernador se levantó y fue de inmediato al teatro. Todo el pueblo salió para contemplar el terrible espectáculo.


    5:11 Pero Tecla buscaba a Pablo con la mirada, como un cordero en el desierto mira en todas direcciones buscando a su pastor.


    5:12 Mientras observaba a la multitud, vio al Señor Jesús con la apariencia de Pablo y se dijo: «Pablo ha venido a verme en mi aflicción». Fijó los ojos en él, pero, mientras lo miraba, él subió de inmediato al cielo.


    5:13 Entonces los jóvenes y las jóvenes llevaron madera y paja para quemar a Tecla. Cuando la llevaron desnuda hasta la hoguera, el gobernador contempló asombrado su gran belleza y se conmovió hasta las lágrimas.


    5:14 Una vez dispuesta la madera, la gente le ordenó que subiera a ella. Tecla lo hizo después de trazar la señal de la cruz.[b]


    5:15 Entonces prendieron fuego a la pira. Aunque la llama era enorme, no la tocó, porque Dios tuvo compasión de ella e hizo que la tierra se abriera violentamente desde abajo, mientras una nube derramaba desde arriba gran cantidad de lluvia y granizo.


    5:16 A causa de la ruptura de la tierra, muchísimas personas estuvieron en grave peligro y algunas murieron. El fuego se apagó, y Tecla quedó a salvo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «ley de los habitantes de Iconio» puede referirse a una ley local o, en sentido más amplio, a la costumbre social de la ciudad.
    reason: Preservar la indeterminación jurídica del testimonio disponible.
  - marker: b
    text: Literalmente, «haciendo primero la señal de la cruz». El relato no describe el gesto con más detalle.
    reason: Evitar proyectar sobre el texto una forma ritual posterior específica.
lexical_decisions:
- source_word: porter / gatekeeper
  choice: portero
  rationale: Mantiene el sentido de quien custodia la entrada sin especificar una estructura arquitectónica no confirmada por el testimonio disponible.
- source_word: strange man
  choice: extranjero
  rationale: Expresa que Pablo era un forastero o desconocido para la comunidad; evita el posible matiz peyorativo moderno de «hombre extraño».
- source_word: judgement seat
  choice: tribunal
  rationale: Comunica naturalmente el lugar y la función judicial del gobernador en español latinoamericano actual.
- source_word: lay wallowing
  choice: permanecía tendida
  rationale: Conserva la postura de Tecla en el suelo sin introducir la connotación degradante que «revolcarse» suele tener en español moderno.
- source_word: magician
  choice: hechicero
  rationale: Representa una acusación hostil de práctica mágica; «mago» puede sonar hoy a artista de entretenimiento.
- source_word: law of the Iconians
  choice: ley de los habitantes de Iconio
  rationale: Hace transparente el gentilicio y conserva la referencia a una norma local sin precisar si era una ley formal o una costumbre.
- source_word: unjust creature
  choice: esa malvada
  rationale: Reproduce el insulto moral de la madre en un español natural y enérgico sin la rigidez de «criatura injusta».
- source_word: whipt out of the city
  choice: expulsaran a Pablo de la ciudad a latigazos
  rationale: Conserva tanto el castigo corporal como la expulsión.
- source_word: eruption / rupture of the earth
  choice: la tierra se abriera violentamente / ruptura de la tierra
  rationale: Evita sugerir una erupción volcánica y conserva la idea de una fractura súbita del suelo.
- source_word: preserved
  choice: quedó a salvo
  rationale: Expresa el rescate físico de Tecla de manera directa y natural.
theological_decisions:
- issue: Las «obras santas de Cristo»
  choice: obras santas de Cristo
  alternative: obras santas acerca de Cristo / obras santas realizadas por Cristo
  rationale: Se conserva la ambigüedad del genitivo transmitido por el testimonio inglés, que podría referirse a obras de Cristo o relacionadas con él.
- issue: Jesús con la apariencia de Pablo
  choice: vio al Señor Jesús con la apariencia de Pablo
  alternative: vio una visión de Pablo que representaba al Señor Jesús
  rationale: Mantiene la identificación narrativa explícita y su tensión cristológica sin reinterpretarla como una mera visión psicológica.
- issue: La señal de la cruz
  choice: trazar la señal de la cruz
  alternative: hacer una señal en forma de cruz
  rationale: Conserva la acción devocional descrita por la tradición textual sin añadir una explicación denominacional posterior.
- issue: Intervención divina y muertes
  choice: Dios tuvo compasión de ella... algunas murieron
  alternative: atribuir todas las consecuencias directamente a un acto punitivo de Dios
  rationale: El texto atribuye a Dios el rescate de Tecla, pero no formula explícitamente una interpretación teológica de las muertes; la traducción preserva esa tensión.
translation_notes:
  register: Español latinoamericano neutral, narrativo y digno, con diálogo directo natural. Se modernizó la sintaxis sin suavizar la violencia ni resolver las ambigüedades teológicas. Este borrador sigue siendo provisional porque el material suministrado identifica como pendiente la revisión directa del griego y de las versiones antiguas.
