review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones seguras frente al testimonio inglés suministrado. En 5:5, «permanecía tendida» atenúa «lay wallowing»; en 5:13, «hoguera» omite la referencia explícita a la estaca; y en 5:14 la secuencia de hacer primero la señal de la cruz debe expresarse con mayor precisión. La revisión directa del griego y de las versiones antiguas sigue pendiente, por lo que se conserva la ambigüedad donde el testimonio puente no permite mayor precisión.
  naturalness: El texto es en general claro, moderno y apropiado para español latinoamericano neutral. Se ajustan algunas formulaciones para conservar mejor los detalles narrativos sin caer en literalismos innecesariamente rígidos.
  terminology: Se conserva «hechicero», «tribunal», «extranjero», «Señor Jesús» y «señal de la cruz». Se prefiere «iconios» como gentilicio conciso y natural, sin resolver si «ley» designa legislación formal o costumbre local.
  issues:
  - severity: medium
    issue: Atenuación de «lay wallowing» en 5:5
    rationale: «Permanecía tendida» solo comunica estar acostada; el testimonio especifica que Tecla se revolcaba o se agitaba en el suelo. Se debe conservar ese detalle, aunque resulte aflictivo.
  - severity: medium
    issue: Omisión de «stake» en 5:13
    rationale: «Hoguera» traduce el contexto de combustión, pero no el elemento explícito al que Tecla es conducida. «Estaca» conserva el referente sin sobreinterpretarlo.
  - severity: low
    issue: Secuencia imprecisa en 5:14
    rationale: El texto indica que Tecla hizo primero la señal de la cruz y después subió a la madera. La redacción revisada hace explícito ese orden.
  - severity: low
    issue: «Por eso» en 5:5 introduce una relación causal más marcada
    rationale: El testimonio enlaza los hechos narrativamente, no necesariamente por causalidad. «Entonces» es más neutral.
