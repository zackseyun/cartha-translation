translation:
  language: es
  text: '2:1 Mientras Pablo predicaba este mensaje en la iglesia que se reunía en casa de Onesíforo, una joven virgen llamada Tecla —cuya madre se llamaba Teoclia y que estaba comprometida con un hombre llamado Tamiris— permanecía sentada junto a una ventana de su casa.


    2:2 Desde allí, gracias a una ventana de la casa donde estaba Pablo, oía día y noche sus enseñanzas acerca de Dios, del amor, de la fe en Cristo y de la oración.


    2:3 No se apartaba de la ventana, pues, llena de inmensa alegría, había sido conquistada por las enseñanzas de la fe.


    2:4 Cuando vio que muchas mujeres y vírgenes entraban para escuchar a Pablo, deseó fervientemente ser considerada digna de presentarse ante él y oír la palabra de Cristo. Todavía no había visto a Pablo en persona; tan solo había oído sus enseñanzas.


    2:5 Como nadie lograba convencerla de que se apartara de la ventana, su madre mandó llamar a Tamiris. Él acudió muy contento, con la esperanza de casarse ya con ella, y le preguntó a Teoclia:


    —¿Dónde está mi Tecla?


    2:6 Teoclia respondió:


    —Tamiris, tengo algo muy extraño que contarte. Desde hace tres días Tecla no se mueve de la ventana, ni siquiera para comer o beber. Está tan absorta escuchando los hábiles y engañosos discursos de cierto extranjero que me causa enorme asombro, Tamiris, que una joven de reconocida modestia se deje dominar así.


    2:7 »Ese hombre ha trastornado toda la ciudad de Iconio y, entre otros, también a tu Tecla. Todas las mujeres y los jóvenes acuden en masa a él para recibir su enseñanza. Entre otras cosas, les dice que hay un solo Dios, a quien únicamente se debe adorar, y que debemos vivir en castidad.


    2:8 »A pesar de todo, mi hija Tecla está como una telaraña sujeta a la ventana: cautivada por los discursos de Pablo, los escucha con extraordinario fervor e inmenso deleite. Así, por prestar atención a lo que él dice, la joven se deja seducir. Ve, pues, y habla con ella, porque está comprometida contigo.


    2:9 Tamiris fue hasta ella, la saludó y, procurando no sobresaltarla, le dijo:


    —Tecla, esposa mía, ¿por qué estás sentada con esa expresión tan triste? ¿Qué extraña influencia se ha apoderado de ti? Vuélvete hacia Tamiris y sonrójate.


    2:10 Su madre le habló de igual manera:


    —Hija, ¿por qué estás sentada tan triste y no respondes, como si estuvieras fuera de ti?


    2:11 Entonces todos lloraron amargamente: Tamiris, porque había perdido a su esposa; Teoclia, porque había perdido a su hija; y las sirvientas, porque habían perdido a su señora. Toda la casa se llenó de duelo.


    2:12 Pero nada de esto conmovió a Tecla ni logró que se volviera para prestarles atención, pues ella seguía pendiente de las enseñanzas de Pablo.


    2:13 Entonces Tamiris salió corriendo a la calle para observar quiénes entraban a ver a Pablo y salían de allí. Vio a dos hombres enzarzados en una acalorada discusión y les preguntó:


    2:14 —Señores, ¿qué hacen aquí? ¿Quién es ese hombre que está adentro con ustedes, el que engaña las mentes de los hombres, tanto de los jóvenes como de las vírgenes, y los persuade de que no deben casarse, sino permanecer como están?


    2:15 »Les prometo una suma considerable si me dan información veraz acerca de él, pues soy el hombre principal de esta ciudad.


    2:16 Demas y Hermógenes respondieron:


    —No podemos decirte con exactitud quién es. Pero sí sabemos que priva a los jóvenes de las mujeres con quienes iban a casarse, y a las vírgenes de los hombres con quienes iban a casarse, pues enseña: “No puede haber resurrección futura a menos que permanezcan en castidad y no manchen su carne”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Se requiere una revisión directa de la tradición manuscrita griega y de las versiones antiguas. En particular, debe verificarse la forma exacta de la afirmación sobre la resurrección y la castidad.
    reason: La fuente proporcionada declara pendiente la revisión en la lengua antigua; la nota evita presentar como definitivamente establecido un texto mediado por una traducción inglesa de 1820.
lexical_decisions:
- source_word: charity (English witness; Greek review pending)
  choice: amor
  rationale: En español latinoamericano actual, «amor» comunica con naturalidad la virtud cristiana; «caridad» podría entenderse principalmente como ayuda material.
- source_word: virgin
  choice: virgen
  rationale: Conserva la categoría repetida y relevante para el énfasis ascético del relato, sin sustituirla sistemáticamente por «joven».
- source_word: chastity
  choice: castidad
  rationale: Mantiene el término ascético amplio del testimonio, sin reducirlo necesariamente a celibato o abstinencia sexual permanente.
- source_word: subdued
  choice: conquistada
  rationale: Expresa que la enseñanza llegó a dominar o ganar a Tecla, pero evita el matiz coercitivo excesivo de «sometida».
- source_word: defile your flesh
  choice: manchen su carne
  rationale: Conserva la imaginería corporal y moral del testimonio sin explicarla doctrinalmente.
- source_word: chief person of this city
  choice: el hombre principal de esta ciudad
  rationale: Preserva la afirmación ambigua de rango o prominencia social, sin convertirla en un cargo municipal específico no atestiguado.
theological_decisions:
- issue: La afirmación de que la resurrección futura depende de permanecer en castidad
  choice: Se conserva como discurso atribuido por Demas y Hermógenes a Pablo.
  alternative: Reformularla como enseñanza normativa inequívoca del narrador o armonizarla con textos canónicos.
  rationale: El pasaje presenta la afirmación dentro del discurso de personajes cuya descripción de Pablo puede ser polémica. La traducción no debe resolver esa tensión ni respaldar automáticamente la exactitud de su acusación.
- issue: «Un solo Dios» y adoración exclusiva
  choice: «hay un solo Dios, a quien únicamente se debe adorar»
  alternative: Añadir una formulación trinitaria o identificar explícitamente al Dios mencionado.
  rationale: Se conserva la formulación monoteísta del testimonio sin importar desarrollos doctrinales ausentes del pasaje.
- issue: Castidad y matrimonio
  choice: Se mantiene la distinción narrativa entre vivir en castidad y no casarse.
  alternative: Equiparar explícitamente castidad con celibato perpetuo.
  rationale: Aunque el contexto vincula ambas ideas, el testimonio no exige resolver todos sus alcances semánticos con una sola definición.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se actualizaron la sintaxis y los diálogos sin borrar el tono narrativo antiguo. Se conservaron términos estructurales como «virgen», «castidad», «carne» y «resurrección». Los nombres siguen formas hispanizadas habituales: Onesíforo, Tecla, Teoclia, Tamiris, Iconio, Demas y Hermógenes. El borrador es necesariamente provisional porque no se suministró el texto griego y la revisión de la fuente antigua está pendiente.'
