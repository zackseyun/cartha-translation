    11:15 Así padeció Tecla, aquella primera mártir, apóstol de Dios y virgen.[c] Había llegado de Iconio a los dieciocho años. Después vivió setenta y dos años, en parte viajando de un lugar a otro y en parte llevando vida monástica en la cueva. Tenía, por tanto, noventa años cuando el Señor la trasladó.[d]


    11:16 Así termina su vida.


    11:17 El día consagrado a su memoria es el veinticuatro de septiembre, para gloria del Padre, del Hijo y del Espíritu Santo, ahora y por siempre. Amén.'
