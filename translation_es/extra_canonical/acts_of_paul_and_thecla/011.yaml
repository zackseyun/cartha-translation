  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: es
  text: '11:1 Entonces el diablo puso un mal consejo en sus mentes. Cierto día se reunieron para deliberar y razonaron entre ellos: «La virgen es sacerdotisa de la gran diosa Diana, y todo lo que le pide se le concede, porque es virgen y, por eso, todos los dioses la aman.


    11:2 Así que consigamos a unos jóvenes libertinos. Después de emborracharlos bien y darles una buena suma de dinero, ordenémosles que vayan y violen a esta virgen, prometiéndoles una recompensa aún mayor si lo hacen».


    11:3 Pues habían llegado a la conclusión de que, si lograban violarla, los dioses dejarían de favorecerla y Diana ya no sanaría a los enfermos por medio de ella.


    11:4 Llevaron a cabo su plan. Los jóvenes subieron al monte y llegaron a la cueva, feroces como leones, y llamaron a la puerta.


    11:5 La santa mártir Tecla, confiando en el Dios en quien creía, abrió la puerta, aunque ya estaba enterada de su plan, y les preguntó:


    —Jóvenes, ¿qué buscan?


    11:6 Ellos respondieron:


    —¿Está aquí una mujer llamada Tecla?


    Ella preguntó:


    —¿Qué quieren de ella?


    Ellos dijeron:


    —Queremos acostarnos con ella.


    11:7 La bendita Tecla respondió:


    —Aunque soy una anciana humilde, soy sierva de mi Señor Jesucristo. Y aunque tienen perversas intenciones contra mí, no podrán llevarlas a cabo.


    Ellos replicaron:


    —Nada podrá impedir que hagamos contigo lo que queramos.


    11:8 Mientras decían esto, la sujetaron por la fuerza con intención de violarla. Entonces ella les dijo con la mayor mansedumbre:


    —Jóvenes, esperen y vean la gloria del Señor.


    11:9 Mientras la retenían, ella alzó los ojos al cielo y dijo:


    —Oh Dios, digno de toda reverencia, con quien nadie puede compararse; tú que manifiestas tu gloria sobre tus enemigos; tú que me libraste del fuego y no me entregaste a Tamiris ni a Alejandro; tú que me libraste de las fieras, me preservaste en las aguas profundas, me has ayudado en todas partes y has glorificado tu nombre en mí:


    11:10 líbrame también ahora de las manos de estos hombres malvados e insensatos. No permitas que violen la castidad que hasta hoy he conservado para honrarte, porque te amo, te anhelo y te adoro, oh Padre, Hijo y Espíritu Santo, por los siglos. Amén.


    11:11 Entonces vino una voz del cielo que dijo:


    —No temas, Tecla, mi sierva fiel, porque yo estoy contigo. Mira el lugar que se ha abierto para ti. Allí estará tu morada eterna; allí recibirás la visión bienaventurada.[a]


    11:12 La bendita Tecla miró y vio que la roca se había abierto lo suficiente para que entrara una persona. Hizo lo que se le había mandado, escapó valerosamente de aquel grupo perverso y entró en la roca. Esta se cerró de inmediato y por completo, de modo que no quedó visible ni una grieta donde se había abierto.


    11:13 Los hombres quedaron totalmente asombrados ante un milagro tan extraordinario y no pudieron retener a la sierva de Dios. Solo alcanzaron a sujetar su velo o capucha y le arrancaron un pedazo.[b]


    11:14 Incluso esto sucedió con el permiso de Dios, para confirmar la fe de quienes fueran a ver aquel lugar venerable y para transmitir bendiciones a las personas de generaciones posteriores que creyeran de corazón puro en nuestro Señor Jesucristo.


    11:15 Así padeció Tecla, aquella primera mártir, apóstol de Dios y virgen.[c] Había llegado de Iconio a los dieciocho años. Después vivió setenta y dos años, en parte viajando de un lugar a otro y en parte llevando vida monástica en la cueva. Tenía, por tanto, noventa años cuando el Señor se la llevó.[d]


    11:16 Así termina su vida.


    11:17 El día consagrado a su memoria es el veinticuatro de septiembre, para gloria del Padre, del Hijo y del Espíritu Santo, ahora y por siempre. Amén.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Visión bienaventurada» reproduce la expresión del testimonio inglés. El sentido exacto debe confirmarse mediante revisión directa de la tradición griega y de las versiones antiguas.
    reason: La expresión puede reflejar terminología teológica posterior o una interpretación del traductor inglés.
  - marker: b
    text: El testimonio ofrece «velo o capucha», señal de incertidumbre acerca de la prenda designada.
    reason: Se preserva la alternativa léxica del testimonio en vez de elegir una opción sin cotejo del original.
  - marker: c
    text: Los títulos «primera mártir», «apóstol de Dios» y «virgen» se conservan tal como aparecen en el testimonio, sin precisar ni limitar su alcance.
    reason: Evita imponer una armonización histórica o denominacional.
  - marker: d
    text: El testimonio dice literalmente que «el Señor la trasladó», una expresión antigua que aquí se vierte «el Señor se la llevó» y que puede aludir a su muerte o partida.
    reason: La formulación admite una connotación religiosa que no conviene reducir a una descripción clínica de la muerte.
lexical_decisions:
- source_word: Diana
  choice: Diana
  rationale: Se conserva la forma tradicional latina del nombre presente en el testimonio inglés; en la tradición griega cabría esperar Artemisa, cuestión que requiere cotejo directo.
- source_word: debauch / violate
  choice: violar
  rationale: El contexto describe una agresión sexual planeada y forzada; «violar» comunica con claridad la gravedad del acto sin eufemismo.
- source_word: mean old woman
  choice: anciana humilde
  rationale: «Mean» en este testimonio tiene sentido de condición baja o modesta, no de maldad; «humilde» evita una lectura falsa.
- source_word: unreasonable men
  choice: hombres malvados e insensatos
  rationale: «Insensatos» conserva el juicio moral e intelectual del testimonio sin adoptar una expresión anticuada.
- source_word: beatific vision
  choice: visión bienaventurada
  rationale: Mantiene la expresión teológica del testimonio sin explicarla ni identificarla más allá de lo que este afirma.
- source_word: translated her
  choice: se la llevó
  rationale: Expresa de manera natural la acción divina y evita que «trasladó» se entienda como un simple cambio de lugar, aunque la formulación antigua queda señalada en nota.
theological_decisions:
- issue: Invocación trinitaria de Tecla
  choice: «te adoro, oh Padre, Hijo y Espíritu Santo»
  alternative: Reformular como una invocación dirigida separadamente a las tres personas
  rationale: Se conserva la tensión gramatical y teológica del testimonio, que pasa del singular «te» a la fórmula trinitaria sin resolverla.
- issue: Título de Tecla como «apóstol de Dios»
  choice: Conservar literalmente el título
  alternative: Traducirlo como «mensajera de Dios» o suavizarlo
  rationale: El título pertenece a la caracterización teológica propia de la obra y no debe armonizarse con usos confesionales posteriores.
- issue: Primera mártir
  choice: «aquella primera mártir»
  alternative: Precisar «primera mártir entre las mujeres»
  rationale: El testimonio suministrado no contiene esa precisión; añadirla resolvería una posible tensión histórica sin apoyo textual inmediato.
- issue: Permiso divino y reliquia del velo
  choice: Conservar la afirmación narrativa
  alternative: Presentarla solo como opinión del narrador
  rationale: El pasaje atribuye explícitamente el hecho al permiso de Dios y le asigna una función para la fe y la bendición; la traducción no debe borrar esa teología.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» implícito en el diálogo y se evitan arcaísmos. La violencia sexual se nombra con claridad, sin lenguaje gráfico añadido. Este borrador se basa necesariamente en el testimonio inglés de dominio público suministrado; la revisión directa del griego y de la tradición versional sigue pendiente, por lo que las notas señalan los puntos de mayor incertidumbre.
