  register: 'Español latinoamericano neutral, actual y digno, con narración clara y diálogo directo. Se evitan arcaísmos como «tú eres» en fórmulas rígidas y tecnicismos innecesarios. Los nombres se presentan en sus formas españolas habituales: Tecla, Trifena, Alejandro, Mira y Licia. Este borrador sigue de manera crítica el testimonio inglés de dominio público suministrado y consulta la capa POB inglesa como apoyo; dado que la revisión directa del griego y de las versiones antiguas está pendiente, las identificaciones zoológicas y botánicas y algunas formulaciones deben considerarse provisionales.'
