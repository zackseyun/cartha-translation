  text: '9:1 Then Thecla was taken from Trifina, stripped naked, fitted with a belt, and thrown into the place appointed for fighting wild beasts. The lions and bears were released against her.


    9:2 But the fiercest of them all, a lioness, ran to Thecla and lay down at her feet. At this, the crowd of women shouted loudly.


    9:3 Then a female bear charged fiercely toward her, but the lioness met the bear and tore it to pieces.


    9:4 Again, a male lion that was accustomed to devouring people, and that belonged to Alexander, ran toward her. But the lioness confronted the male lion, and they killed each other.


    9:5 Then the women became even more distressed because the lioness that had helped Thecla was dead.


    9:6 Afterward, they brought out many other wild beasts. But Thecla stood with her hands stretched toward heaven and prayed. When she had finished praying, she turned around, saw a pool of water, and said, “Now is the right time for me to be baptized.”


    9:7 So she threw herself into the water and said, “In your name, O my Lord Jesus Christ, I am baptized on this last day.” When the women and the people saw this, they cried out, “Do not throw yourself into the water!” The governor himself also cried out at the thought that the fish (sea-calves) were likely to devour so much beauty.


    9:8 Despite all this, Thecla threw herself into the water in the name of our Lord Jesus Christ.


    9:9 But when the fish (sea-calves) saw the lighting and fire, they were killed and floated dead on the surface of the water. A cloud of fire surrounded Thecla, so that just as the beasts could not come near her, the people could not see her nakedness.


    9:10 Yet they released other wild beasts against her. At this, the women raised a deeply mournful cry. Some of them scattered spikenard, others cassia, others amomus [a kind of spikenard, or the herb of Jerusalem, or ladies’ rose], and others ointment. The amount of ointment was great, in proportion to the number of people. Then all the beasts lay down as though they were fast asleep and did not touch Thecla.


    9:11 Then Alexander said to the governor, “I have some very terrifying bulls. Let us bind her to them.” The governor replied with concern, “You may do what you think is appropriate.”


    9:12 Then they put a cord around Thecla’s waist that also bound her feet, and with it they tied her to the bulls. They applied red-hot irons to the bulls’ genitals so that, being tormented even more, they might drag Thecla around more violently until they had killed her.


    9:13 The bulls tore around, making a horrifying noise. But the flame surrounding Thecla burned through the cords fastened to the bulls’ members, and she stood in the middle of the arena as calmly as if she had not been bound.


    9:14 Meanwhile, Trifina, who was sitting on one of the benches, fainted and died. At this, the whole city became greatly distressed.


    9:15 Alexander himself was afraid and pleaded with the governor, saying, “I beg you, have compassion on me and on the city, and release this woman who has fought with the beasts, lest you, I, and the whole city be destroyed.


    9:16 For if Caesar receives any report of what has just happened, he will certainly destroy the city at once, because Trifina, a woman of royal descent and his relative, has died in her seat.”


    9:17 Then the governor called Thecla to him from among the beasts and said to her, “Who are you, and what is your condition, that not one of the beasts will touch you?”


    9:18 Thecla answered him, “I am a servant of the living God. As for my condition, I am a believer in Jesus Christ, his Son, in whom God is well pleased. For that reason, none of the beasts could touch me.


    9:19 He alone is the way to eternal salvation and the foundation of eternal life. He is a refuge for those in distress, a support for the afflicted, and hope and defense for the hopeless. In short, all who do not believe in him will not live but will suffer eternal death.”


    9:20 When the governor heard these things, he ordered her clothes to be brought and said to her, “Put on your clothes.”


    9:21 Thecla replied, “May the God who clothed me when I was naked among the beasts clothe your soul with the robe of salvation on the day of judgment.” Then she took her clothes and put them on. The governor immediately issued an order in these words: “I release to you Thecla, the servant of God.”


    9:22 At this, the women cried out together in a loud voice and, with one accord, praised God, saying, “There is only one God, who is the God of Thecla—the one God who has delivered Thecla.”


    9:23 Their voices were so loud that the whole city seemed to be shaken. Trifina herself heard the good news, rose again, and ran with the crowd to meet Thecla. Embracing her, she said, “Now I believe that there will be a resurrection of the dead. Now I am convinced that my daughter is alive. Therefore, come home with me, my daughter Thecla, and I will transfer to you everything I have.”


    9:24 So Thecla went with Trifina and stayed there for a few days, teaching her the word of the Lord. Through this, many young women were converted, and there was great joy in Trifina’s household.


    9:25 But Thecla longed to see Paul. She made inquiries and sent people everywhere to find him. At last, when she was told that he was at Myra in Lycia, she took many young men and women with her. She put on a belt, dressed herself in men’s clothing, and went to him at Myra in Lycia. There she found Paul preaching the word of God, and she stood beside him among the crowd.'
translation:
  language: es
  text: '**Hechos de Pablo y Tecla — Capítulo IX**


    **9:1** Entonces Tecla fue apartada de Trifena, desnudada, ceñida con un cinturón y arrojada al lugar destinado al combate con las fieras. Allí soltaron contra ella leones y osos.


    **9:2** Pero una leona, la más feroz de todas, corrió hacia Tecla y se tendió a sus pies. Al verla, la multitud de mujeres lanzó un fuerte grito.


    **9:3** Luego una osa se abalanzó ferozmente contra ella, pero la leona le salió al encuentro y la despedazó.


    **9:4** Después corrió hacia ella un león que pertenecía a Alejandro y estaba acostumbrado a devorar personas. Pero la leona se enfrentó con él, y ambos se mataron.


    **9:5** Las mujeres se angustiaron aún más porque había muerto la leona que había defendido a Tecla.


    **9:6** Después sacaron muchas otras fieras. Tecla, sin embargo, permaneció de pie con las manos extendidas hacia el cielo y oró. Cuando terminó de orar, se volvió, vio un estanque y dijo:


    —Ahora es el momento apropiado para que yo sea bautizada.


    **9:7** Entonces se arrojó al agua y dijo:


    —En tu nombre, mi Señor Jesucristo, soy bautizada en este último día.[a]


    Al verlo, las mujeres y el resto del pueblo gritaron:


    —¡No te arrojes al agua!


    Hasta el gobernador gritó al pensar que las fieras marinas[b] estaban a punto de devorar tanta belleza.


    **9:8** A pesar de todo, Tecla se arrojó al agua en el nombre de nuestro Señor Jesucristo.


    **9:9** Pero cuando las fieras marinas vieron el relámpago y el fuego, murieron y quedaron flotando sobre el agua. Una nube de fuego rodeó a Tecla, de modo que las fieras no podían acercársele y el pueblo tampoco podía verla desnuda.


    **9:10** Aun así, soltaron otras fieras contra ella. Las mujeres lanzaron entonces un grito lleno de dolor. Unas esparcieron nardo; otras, casia; otras, ámomo;[c] y otras, ungüento. La cantidad de perfumes fue tan grande como numerosa era la multitud. Entonces todas las fieras se tendieron como si estuvieran profundamente dormidas y no tocaron a Tecla.


    **9:11** Alejandro dijo al gobernador:


    —Tengo unos toros sumamente temibles. Atémosla a ellos.


    El gobernador, preocupado, respondió:


    —Haz lo que te parezca conveniente.


    **9:12** Entonces rodearon la cintura de Tecla con una cuerda que también le sujetaba los pies, y con ella la ataron a los toros. Aplicaron hierros al rojo vivo a los genitales de los animales para que, atormentados todavía más, arrastraran a Tecla con mayor violencia hasta matarla.


    **9:13** Los toros se lanzaron de un lado a otro con un estruendo espantoso. Pero la llama que rodeaba a Tecla quemó las cuerdas sujetas a los miembros de los toros, y ella permaneció en medio de la arena tan serena como si nunca hubiera estado atada.


    **9:14** Mientras tanto, Trifena, que estaba sentada en una de las gradas, se desmayó y murió. Toda la ciudad quedó profundamente consternada.


    **9:15** El propio Alejandro sintió miedo y suplicó al gobernador:


    —Te ruego que tengas compasión de mí y de la ciudad, y que pongas en libertad a esta mujer que ha combatido con las fieras. De lo contrario, tú, yo y la ciudad entera seremos destruidos.


    **9:16** Porque si César recibe noticia de lo que acaba de suceder, sin duda destruirá de inmediato la ciudad, pues Trifena, mujer de linaje real y pariente suya, ha muerto en su asiento.


    **9:17** Entonces el gobernador hizo salir a Tecla de entre las fieras, la llamó y le preguntó:


    —¿Quién eres, y qué hay en ti para que ninguna de las fieras te toque?


    **9:18** Tecla le respondió:


    —Soy sierva del Dios viviente. En cuanto a lo que hay en mí, he creído en Jesucristo, su Hijo, en quien Dios se complace. Por eso ninguna de las fieras pudo tocarme.


    **9:19** Solo él es el camino de la salvación eterna y el fundamento de la vida eterna. Él es refugio de quienes están angustiados, sostén de los afligidos, esperanza y defensa de quienes no tienen esperanza. En una palabra, todos los que no crean en él no vivirán, sino que sufrirán la muerte eterna.


    **9:20** Cuando el gobernador oyó estas palabras, ordenó que le llevaran su ropa y le dijo:


    —Ponte tu ropa.


    **9:21** Tecla respondió:


    —Que el Dios que me vistió cuando estaba desnuda entre las fieras vista tu alma con la vestidura de salvación en el día del juicio.


    Luego tomó su ropa y se vistió. Inmediatamente el gobernador proclamó:


    —Les entrego libre a Tecla, la sierva de Dios.[d]


    **9:22** Entonces las mujeres gritaron juntas a gran voz y, unánimes, alabaron a Dios diciendo:


    —¡Uno solo es Dios, el Dios de Tecla! ¡Uno solo es el Dios que ha librado a Tecla!


    **9:23** Sus voces eran tan fuertes que toda la ciudad parecía estremecerse. La misma Trifena oyó la buena noticia, volvió a levantarse[e] y corrió con la multitud al encuentro de Tecla. La abrazó y le dijo:


    —Ahora creo que habrá resurrección de los muertos; ahora estoy convencida de que mi hija vive. Ven, pues, a mi casa, hija mía Tecla, y pondré a tu nombre todo lo que poseo.


    **9:24** Tecla fue con Trifena y permaneció allí unos días, enseñándole la palabra del Señor. Por medio de esta enseñanza muchas jóvenes se convirtieron, y hubo gran alegría en la casa de Trifena.


    **9:25** Pero Tecla anhelaba ver a Pablo. Preguntó por él y envió gente por todas partes para buscarlo. Finalmente le informaron que estaba en Mira de Licia. Entonces llevó consigo a muchos jóvenes, hombres y mujeres; se ciñó con un cinturón, se vistió con ropa de hombre y fue a encontrarlo a Mira de Licia. Allí halló a Pablo predicando la palabra de Dios y se quedó junto a él entre la multitud.


    **Notas**


    [a] **en este último día**: La expresión puede referirse al día que Tecla espera que sea el último de su vida, no necesariamente al último día de la historia.


    [b] **fieras marinas**: El testimonio inglés suministrado ofrece «peces (terneros marinos)». La identificación exacta de estos animales acuáticos —posiblemente focas— es incierta.


    [c] **ámomo**: Planta aromática de identificación incierta en las fuentes antiguas. El testimonio inglés la explica como una clase de nardo u otra hierba aromática.


    [d] **Les entrego libre a Tecla**: La forma de la proclamación conserva la idea de que el gobernador presenta ante el pueblo a Tecla ya liberada.


    [e] **volvió a levantarse**: El relato había dicho que Trifena «murió» (9:14); aquí narra que se levantó de nuevo. Se conserva la tensión narrativa sin decidir si describe una resurrección, una reanimación o la recuperación de un desmayo tenido por muerte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '**en este último día**: La expresión puede referirse al día que Tecla espera que sea el último de su vida, no necesariamente al último día de la historia.'
    reason: Preservar y aclarar una ambigüedad temporal con posible carga escatológica.
  - marker: b
    text: '**fieras marinas**: El testimonio inglés suministrado ofrece «peces (terneros marinos)». La identificación exacta de estos animales acuáticos —posiblemente focas— es incierta.'
    reason: Evitar una identificación zoológica falsa y documentar la lectura del testimonio base.
  - marker: c
    text: '**ámomo**: Planta aromática de identificación incierta en las fuentes antiguas. El testimonio inglés la explica como una clase de nardo u otra hierba aromática.'
    reason: Explicar un término botánico antiguo que no resulta transparente para lectores modernos.
  - marker: d
    text: '**Les entrego libre a Tecla**: La forma de la proclamación conserva la idea de que el gobernador presenta ante el pueblo a Tecla ya liberada.'
    reason: Aclarar una fórmula de liberación cuya construcción literal resulta poco natural en español.
  - marker: e
    text: '**volvió a levantarse**: El relato había dicho que Trifena «murió» (9:14); aquí narra que se levantó de nuevo. Se conserva la tensión narrativa sin decidir si describe una resurrección, una reanimación o la recuperación de un desmayo tenido por muerte.'
    reason: Señalar la tensión narrativa y teológica sin armonizarla.
lexical_decisions:
- source_word: she-lion / lioness
  choice: leona
  rationale: Distingue con claridad el sexo del animal, elemento narrativamente importante porque la leona protege a Tecla y luego combate con el león.
- source_word: pit/pool of water
  choice: estanque
  rationale: Expresa un depósito de agua suficientemente grande para que Tecla se arroje dentro, sin imponer una instalación bautismal específica.
- source_word: fish (sea-calves)
  choice: fieras marinas
  rationale: Evita identificar de manera injustificadamente precisa los animales; una nota conserva las opciones del testimonio, incluida la posible referencia a focas.
- source_word: amomus
  choice: ámomo
  rationale: Translitera el nombre antiguo de la sustancia aromática y deja su identificación incierta en nota.
- source_word: members
  choice: miembros
  rationale: Conserva el eufemismo del testimonio en 9:13, mientras 9:12 usa el referente anatómico explícito necesario para comprender la acción.
- source_word: condition/circumstances
  choice: qué hay en ti
  rationale: En el intercambio de 9:17-18 produce una pregunta natural y permite que Tecla responda acerca de su fe sin convertir el giro en una categoría doctrinal técnica.
- source_word: robe of salvation
  choice: vestidura de salvación
  rationale: Mantiene la imagen textil y su resonancia religiosa en un español digno y comprensible.
- source_word: rose again
  choice: volvió a levantarse
  rationale: Conserva el sentido básico del movimiento y la relación deliberada con el lenguaje de resurrección, sin resolver por traducción cómo debe entenderse el episodio.
theological_decisions:
- issue: El bautismo de Tecla pronunciado por ella misma
  choice: «soy bautizada»
  alternative: «me bautizo»
  rationale: La formulación pasiva preserva la expresión del testimonio y evita convertir el pasaje en una afirmación normativa explícita sobre el autobautismo, aunque la acción narrativa de Tecla permanece intacta.
- issue: «este último día» en la declaración bautismal
