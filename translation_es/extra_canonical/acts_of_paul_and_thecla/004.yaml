base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/004.yaml
  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: es
  text: '4:1 Entonces Tamiris se presentó ante el tribunal del gobernador y habló en voz alta de esta manera:


    4:2 —Gobernador, no sé de dónde viene este hombre, pero enseña que el matrimonio es ilícito. Ordénale, pues, que explique ante ti por qué proclama tales enseñanzas.


    4:3 Mientras él hablaba así, Demas y Hermógenes (le susurraron a Tamiris y) dijeron:


    —Di que es cristiano, y enseguida lo condenarán a muerte.[a]


    4:4 Pero el gobernador procedió con más cautela. Llamó a Pablo y le dijo:


    —¿Quién eres? ¿Qué enseñas? Al parecer, te acusan de delitos graves.


    4:5 Entonces Pablo habló en voz alta:


    —Ya que ahora se me pide que rinda cuentas de mis enseñanzas, gobernador, te ruego que me escuches.


    4:6 Dios, que es un Dios de retribución y no necesita nada sino la salvación de sus criaturas, me ha enviado para apartarlas de su maldad y corrupción, de todos los placeres pecaminosos[b] y de la muerte, y para persuadirlas de que no pequen más.


    4:7 Por esta razón Dios envió a su Hijo Jesucristo, a quien yo proclamo y en quien enseño a la gente a poner su esperanza. Solo él tuvo tal compasión del mundo extraviado que este no fuera condenado, gobernador, sino que tuviera fe, temor de Dios, conocimiento de la verdadera devoción[c] y amor a la verdad.


    4:8 Así que, si solo enseño lo que recibí por revelación de Dios, ¿cuál es mi delito?


    4:9 Cuando el gobernador oyó esto, ordenó que ataran a Pablo y lo metieran en la cárcel hasta que tuviera más tiempo para escucharlo con detenimiento.


    4:10 Pero durante la noche, Tecla se quitó los aretes y se los dio al guardia de la prisión, quien le abrió las puertas y la dejó entrar.


    4:11 Después le regaló al carcelero un espejo de plata, y este le permitió entrar en el aposento donde estaba Pablo. Entonces ella se sentó a sus pies y lo oyó hablar de las grandezas de Dios.


    4:12 Al ver que Pablo no tenía miedo de sufrir, sino que, con la ayuda de Dios, actuaba con valor, su fe creció tanto que besó sus cadenas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El paréntesis reproduce una irregularidad del testimonio disponible en la frase «(le susurraron a Tamiris y) dijeron».
    reason: La redacción es textualmente incómoda y la revisión directa de las fuentes griegas y versionales aún está pendiente.
  - marker: b
    text: «Pecaminosos» está implícito en el testimonio inglés y aparece allí entre paréntesis; podría entenderse sencillamente «de todos los placeres».
    reason: Evita ocultar que el calificativo interpretativo no está firmemente asegurado por la evidencia suministrada.
  - marker: c
    text: También podría traducirse «conocimiento de la religión» o «conocimiento de la piedad».
    reason: La revisión del término griego subyacente está pendiente, y el testimonio inglés «religion» admite más de un matiz.
lexical_decisions:
- source_word: matrimony is unlawful
  choice: el matrimonio es ilícito
  rationale: Conserva la formulación jurídica de la acusación sin convertirla en una afirmación del narrador.
- source_word: God of vengeance
  choice: Dios de retribución
  rationale: Mantiene la dimensión de justicia punitiva y evita que «venganza» sugiera mero resentimiento personal.
- source_word: reclaim them
  choice: apartarlas
  rationale: Expresa el movimiento de conversión respecto de los males enumerados con lenguaje natural en español.
- source_word: deluded world
  choice: mundo extraviado
  rationale: Conserva la idea de error o engaño sin adoptar el matiz peyorativo moderno de «engañado» o «iluso».
- source_word: knowledge of religion
  choice: conocimiento de la verdadera devoción
  rationale: «Religión» en este testimonio puede aludir a piedad o devoción; la nota reconoce la incertidumbre debida a la falta de revisión griega.
- source_word: great things of God
  choice: las grandezas de Dios
  rationale: Reproduce el sentido elevado de la expresión y resulta idiomático en español.
- source_word: turnkey / jailer
  choice: guardia de la prisión / carcelero
  rationale: Mantiene la variación del testimonio inglés sin asegurar que se trate de dos personas distintas.
theological_decisions:
- issue: La acusación acerca del matrimonio
  choice: 'Presentarla como palabras de Tamiris: «enseña que el matrimonio es ilícito»'
  alternative: Parafrasear que Pablo aconsejaba la continencia
  rationale: El pasaje formula una acusación polémica; suavizarla resolvería de manera indebida la tensión narrativa y teológica.
- issue: Dios como «Dios de venganza»
  choice: «Dios de retribución»
  alternative: «Dios vengador» o «Dios de venganza»
  rationale: Retiene la afirmación sobre el juicio divino, pero evita una connotación de vindicta caprichosa no exigida por el testimonio disponible.
- issue: «No necesita nada sino la salvación de sus criaturas»
  choice: 'Conservar literalmente la tensión: «no necesita nada sino la salvación de sus criaturas»'
  alternative: «No desea otra cosa que la salvación...»
  rationale: Cambiar «necesita» por «desea» armonizaría teológicamente una expresión difícil que el testimonio realmente contiene.
- issue: La compasión exclusiva de Jesucristo
  choice: «Solo él tuvo tal compasión...»
  alternative: «Él tuvo una compasión tan grande...»
  rationale: Se conserva la exclusividad explícita del testimonio en lugar de atenuarla.
- issue: Fe creciente de Tecla y beso de las cadenas
  choice: Mantener la secuencia causal sin comentario
  alternative: Interpretar el gesto como veneración, conversión plena o afecto romántico
  rationale: El texto relaciona el valor de Pablo con el crecimiento de la fe de Tecla, pero no define de forma inequívoca el significado del beso.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean «gobernador», «tribunal», «carcelero», «aretes» y tratamiento de «tú» coherente con el discurso directo antiguo en una versión popular. El borrador es necesariamente provisional porque solo se proporcionó un testimonio inglés de dominio público y se indica que la revisión directa del griego y de las versiones antiguas está pendiente. Se preservaron las tensiones del texto y la anomalía parentética de 4:3, con notas explícitas donde la base suministrada no permite mayor seguridad.
