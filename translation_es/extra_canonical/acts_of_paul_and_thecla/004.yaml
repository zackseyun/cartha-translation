  revision_rationale: 'Se aplican correcciones seguras respecto del testimonio inglés: se evita añadir un agente o una etapa judicial en 4:3; se conserva «venganza» en 4:6; se mantiene el paréntesis editorial de «(pecaminosos)»; y se elimina la ampliación doctrinal «verdadera» en 4:7. Las demás decisiones mantienen un español latinoamericano natural y un registro digno, sin resolver mediante interpretación las dificultades del pasaje.'
