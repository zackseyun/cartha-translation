  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
translation:
  language: es
  text: '3:1 Entonces Tamiris dijo: «Vengan conmigo a mi casa y repongan fuerzas». Así que fueron a un banquete muy espléndido, donde había vino en abundancia y alimentos exquisitos.


    3:2 Los llevaron ante una mesa servida con gran abundancia, y Tamiris les dio mucho de beber por el amor que sentía por Tecla y porque deseaba casarse con ella.


    3:3 Entonces Tamiris dijo: «Quiero que me expliquen cuáles son las enseñanzas de ese Pablo, para que yo pueda entenderlas. Estoy muy preocupado por Tecla, pues se deleita tanto en las palabras de ese extranjero que corro el peligro de perder a la mujer con quien pienso casarme».


    3:4 Demas y Hermógenes respondieron juntos: «Haz que lo lleven ante el gobernador Castilio, acusándolo de intentar persuadir al pueblo para que adopte la nueva religión de los cristianos. Él, conforme al decreto del César, le dará muerte, y así tú obtendrás a tu esposa.


    3:5 »Mientras tanto, nosotros le enseñaremos a ella que la resurrección de la que él habla ya ha sucedido, que consiste en tener hijos y que resucitamos cuando llegamos al conocimiento de Dios».


    3:6 Cuando Tamiris oyó lo que le dijeron, se llenó de ardiente indignación.


    3:7 A la mañana siguiente se levantó temprano y fue a la casa de Onesíforo, acompañado por los magistrados, el carcelero y una gran multitud de personas armadas con palos. Allí le dijo a Pablo:


    3:8 «Has descarriado a la ciudad de Iconio, y también a Tecla, que está comprometida conmigo, de modo que ahora no quiere casarse conmigo. Por tanto, vendrás con nosotros ante el gobernador Castilio».


    3:9 Toda la multitud gritó: «¡Fuera con este impostor, este hechicero![a] Ha descarriado la mente de nuestras mujeres, y todo el pueblo lo escucha».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado presenta «impostor» y, entre paréntesis, «magician» («hechicero» o «mago»). La traducción conserva ambas caracterizaciones. La lectura debe verificarse directamente en la tradición manuscrita griega y en las versiones antiguas.
    reason: Preservar una alternativa textual o explicativa del testimonio sin presentarla silenciosamente como una sola lectura segura.
lexical_decisions:
- source_word: refresh yourselves
  choice: repongan fuerzas
  rationale: Expresa de manera natural la idea de recibir alimento y descanso sin limitarla únicamente a comer o beber.
- source_word: very rich provision
  choice: alimentos exquisitos
  rationale: Comunica la abundancia y calidad de las provisiones del banquete en español latinoamericano actual.
- source_word: doctrines
  choice: enseñanzas
  rationale: Es claro y natural en este contexto, sin añadir una connotación confesional técnica.
- source_word: perverted / led astray
  choice: descarriado
  rationale: Conserva el sentido acusatorio de apartar o extraviar a personas y a la ciudad.
- source_word: imposter (magician)
  choice: impostor, este hechicero
  rationale: Mantiene las dos caracterizaciones transmitidas por el testimonio inglés sin esconder la variación.
theological_decisions:
- issue: Naturaleza de la resurrección afirmada por Demas y Hermógenes
  choice: «ya ha sucedido», «consiste en tener hijos» y «resucitamos cuando llegamos al conocimiento de Dios»
  alternative: Armonizar estas expresiones con una doctrina posterior o tratarlas como una sola definición coherente
  rationale: Se preservan las afirmaciones yuxtapuestas y su tensión teológica, sin corregir ni respaldar la doctrina de los personajes.
- issue: «Nueva religión de los cristianos»
  choice: Conservar la formulación como parte de la acusación
  alternative: Sustituirla por «el Camino» u otra terminología históricamente armonizada
  rationale: La frase pertenece al testimonio suministrado y refleja la caracterización polémica dentro del relato.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se modernizaron los diálogos y se conservaron los nombres tradicionales Tamiris, Tecla, Demas, Hermógenes, Onesíforo, Iconio y Castilio. Este borrador es provisional porque el material proporcionado indica que la revisión directa del griego sigue pendiente; por ello no se atribuyen con certeza lexemas griegos específicos.
