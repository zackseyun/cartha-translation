lexical_decisions:
- source_word: chastity
  choice: castidad
  rationale: Conserva el concepto moral y corporal del testimonio, mientras que «no se atentara contra» comunica naturalmente la amenaza de violencia sin introducir detalles ausentes.
- source_word: she-lion
  choice: leona
  rationale: Es la equivalencia española directa y natural.
- source_word: title written
  choice: letrero
  rationale: Expresa con claridad el aviso público donde figuraba la acusación, sin imponer una forma documental más específica.
- source_word: Sacrilege
  choice: Sacrilegio
  rationale: Mantiene la acusación religiosa y jurídica del testimonio.
- source_word: criminal
  choice: condenada
  rationale: En este contexto designa a la mujer entregada al castigo. «Condenada» evita que la voz narrativa afirme por sí misma que Tecla era moralmente culpable.
- source_word: royal family
  choice: familia real
  rationale: Conserva la afirmación social y política del testimonio sin especificar un cargo o parentesco no indicado.
theological_decisions:
- issue: Oración de Tecla por Falconila, ya fallecida
  choice: Se conserva la petición tal como aparece, incluida la referencia a la vida eterna.
  alternative: Reformularla para ajustarla a una doctrina posterior sobre el estado de los muertos.
  rationale: El relato presenta una tensión teológica genuina que la traducción no debe resolver ni armonizar denominacionalmente.
- issue: Identificación del Señor Dios con Jesucristo en 8:7
  choice: 'Se mantiene la secuencia vocativa: «Oh Señor, Dios del cielo y de la tierra, Jesucristo, Hijo del Altísimo».'
  alternative: Añadir puntuación o explicaciones que separen o identifiquen explícitamente los títulos.
  rationale: La formulación transmitida es teológicamente densa y potencialmente ambigua; conviene no imponer una interpretación sintáctica definitiva sin revisión griega.
- issue: Preservación de la castidad
  choice: Se traduce como protección frente a un atentado contra la castidad de Tecla.
  alternative: Interpretarla exclusivamente como virginidad perpetua o como mera protección física general.
  rationale: La elección conserva el alcance sexual y moral del pasaje sin añadir una doctrina ascética específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea narración clara y diálogo solemne sin arcaísmos pronominales. Este borrador es necesariamente provisional porque el material suministrado identifica como base inmediata un testimonio inglés de dominio público y señala que la revisión directa del griego y de las versiones antiguas está pendiente.
