  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: es
  text: 'CAPÍTULO VIII


    8:1 Cuando el pueblo vio esto, dijo: «Las sentencias dictadas en esta ciudad son injustas». Pero Tecla pidió al gobernador que le concediera que no se atentara contra su castidad, sino que fuera preservada hasta el momento de ser arrojada a las fieras.


    8:2 Entonces el gobernador preguntó quién la recibiría. Una viuda muy rica llamada Trifina, cuya hija había muerto hacía poco, pidió que la dejaran bajo su cuidado, y comenzó a tratarla en su casa como a su propia hija.


    8:3 Por fin llegó el día en que se exhibirían las fieras. Tecla fue llevada al anfiteatro y metida en un foso donde había una leona sumamente feroz, ante una multitud de espectadores.


    8:4 Trifina acompañó a Tecla sin mostrar temor alguno, y la leona lamió los pies de Tecla. El letrero que indicaba su delito decía: «Sacrilegio». Entonces la mujer exclamó: «¡Oh Dios, las sentencias de esta ciudad son injustas!».


    8:5 Después de la exhibición de las fieras, Trifina llevó a Tecla a su casa, y ambas se acostaron. Entonces la hija difunta de Trifina se apareció a su madre y le dijo: «Madre, considera a la joven Tecla como hija tuya en mi lugar, y pídele que ore por mí, para que yo sea trasladada a un estado de felicidad[a]».


    8:6 Trifina dijo entonces con tristeza: «Mi hija Falconila se me ha aparecido y me ha pedido que te reciba en su lugar. Por eso, Tecla, te ruego que ores por mi hija, para que sea trasladada a un estado de felicidad y a la vida eterna».


    8:7 Al oír esto, Tecla oró de inmediato al Señor: «Oh Señor, Dios del cielo y de la tierra, Jesucristo, Hijo del Altísimo, concede que Falconila, la hija de Trifina, viva para siempre». Al oírla, Trifina volvió a gemir y dijo: «¡Oh sentencias injustas! ¡Oh maldad insensata, que una persona como ella tenga que ser arrojada otra vez[b] a las fieras!».


    8:8 A la mañana siguiente, al amanecer, Alejandro llegó a casa de Trifina y dijo: «El gobernador y el pueblo están esperando. Haz salir a la condenada».


    8:9 Pero Trifina se abalanzó sobre él con tal violencia que Alejandro se asustó y huyó. Trifina pertenecía a la familia real. Entonces expresó así su dolor: «¡Ay de mí! Dos desgracias afligen mi casa, y no hay nadie que me consuele por la pérdida de mi hija ni que me ayude a salvar a Tecla. Pero ahora, oh Señor Dios, ayuda a tu sierva Tecla».


    8:10 Mientras decía esto, el gobernador envió a uno de sus propios oficiales a buscar a Tecla. Trifina la tomó de la mano y fue con ella, diciendo: «Acompañé a Falconila hasta su sepulcro, y ahora debo acompañar a Tecla hasta las fieras».


    8:11 Al oír esto, Tecla oró entre lágrimas: «Oh Señor Dios, en quien he puesto mi confianza y hallado refugio, recompensa a Trifina por la compasión que me ha mostrado y por haber preservado mi castidad».


    8:12 Entonces se levantó un gran estruendo en el anfiteatro. Las fieras rugían y el pueblo gritaba: «¡Que entre la condenada!».


    8:13 Pero la mujer gritó: «¡Que toda la ciudad sufra por semejantes crímenes! ¡Gobernador, ordena que todos nosotros recibamos el mismo castigo! ¡Qué sentencia tan injusta! ¡Qué espectáculo tan cruel!».


    8:14 Otros decían: «¡Que toda la ciudad sea destruida por esta acción infame! ¡Mátanos a todos, gobernador! ¡Qué espectáculo tan cruel! ¡Qué sentencia tan injusta!».


    [a] La expresión «estado de felicidad» reproduce de manera provisional el sentido del testimonio inglés. También podría entenderse como «bienaventuranza»; se requiere cotejarla con la tradición griega y las versiones antiguas.


    [b] El testimonio inglés presenta «otra vez» entre paréntesis. Su presencia y su posible apoyo textual deben verificarse mediante el cotejo directo con los manuscritos y las versiones antiguas.'
