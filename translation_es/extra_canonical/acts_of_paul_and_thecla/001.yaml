  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: es
  text: 'Hechos de Pablo y Tecla — Capítulo I


    1:1 Cuando Pablo subió a Iconio después de huir de Antioquía, Demas y Hermógenes se hicieron sus compañeros, aunque por entonces estaban llenos de hipocresía.


    1:2 Pero Pablo, atento únicamente a la bondad de Dios, no les hizo ningún daño, sino que los amó profundamente.


    1:3 Así pues, procuraba presentarles de manera agradable todos los oráculos y las enseñanzas de Cristo, así como el propósito del evangelio del Hijo amado de Dios, instruyéndolos en el conocimiento de Cristo tal como le había sido revelado.


    1:4 Un hombre llamado Onesíforo oyó que Pablo había llegado a Iconio y salió enseguida a recibirlo, junto con su esposa Lectra y sus hijos Simia y Zenón, para invitarlo a su casa.


    1:5 Tito les había descrito el aspecto de Pablo. Todavía no lo conocían en persona, sino solo por su carácter.


    1:6 Fueron por el camino real en dirección a Listra y se quedaron allí esperándolo, comparando a cada viajero que pasaba con la descripción que Tito les había dado.


    1:7 Por fin vieron acercarse a un hombre: era Pablo. Era de baja estatura, calvo —o con la cabeza rapada—, de muslos encorvados, piernas bien formadas, ojos hundidos y nariz curva. Estaba lleno de gracia, pues unas veces parecía un hombre y otras tenía rostro de ángel. Pablo vio a Onesíforo y se alegró.


    1:8 Onesíforo dijo:


    —¡Saludos, siervo del Dios bendito!


    Pablo respondió:


    —Que la gracia de Dios esté contigo y con tu familia.


    1:9 Pero Demas y Hermógenes sintieron envidia y, aparentando gran devoción, Demas dijo:


    —¿Acaso nosotros no somos también siervos del Dios bendito? ¿Por qué no nos saludaste?


    1:10 Onesíforo respondió:


    —Porque no he visto en ustedes los frutos de la justicia. Sin embargo, si son de esa clase, también serán bienvenidos en mi casa.


    1:11 Entonces Pablo entró en casa de Onesíforo, y por ello hubo gran alegría entre los de la casa. Se dedicaron a la oración, a partir el pan y a escuchar a Pablo proclamar la palabra de Dios acerca del dominio propio[a] y la resurrección, de la siguiente manera:


    1:12 «Dichosos los de corazón puro, porque ellos verán a Dios.


    1:13 »Dichosos quienes mantienen su carne sin mancha, porque ellos serán templo de Dios.


    1:14 »Dichosos quienes ejercen dominio propio[b], porque Dios se les revelará.


    1:15 »Dichosos quienes renuncian a los placeres del mundo, porque Dios los aceptará.


    1:16 »Dichosos quienes tienen esposa como si no la tuvieran, porque serán hechos ángeles de Dios.


    1:17 »Dichosos quienes tiemblan ante la palabra de Dios, porque serán consolados.


    1:18 »Dichosos quienes mantienen puro su bautismo, porque hallarán paz con el Padre, el Hijo y el Espíritu Santo.


    1:19 »Dichosos quienes buscan la sabiduría[c] de Jesucristo, porque serán llamados hijos del Altísimo.


    1:20 »Dichosos quienes guardan las enseñanzas de Jesucristo, porque habitarán en la luz eterna.


    1:21 »Dichosos quienes, por amor a Cristo, renuncian a las glorias del mundo, porque juzgarán a los ángeles, serán puestos a la derecha de Cristo y no sufrirán la amargura del juicio final.


    1:22 »Dichosos los cuerpos y las almas de quienes permanecen vírgenes, porque son agradables a Dios y no perderán la recompensa de su virginidad. La palabra de su Padre celestial[d] actuará eficazmente para su salvación en el día de su Hijo, y disfrutarán del descanso para siempre».


    [a] 1:11 El término también puede referirse a la continencia o castidad.

    [b] 1:14 O bien: «quienes viven en continencia»; también puede entenderse «quienes son castos».

    [c] 1:19 O bien: «la enseñanza».

    [d] 1:22 «Celestial» es una aclaración transmitida entre paréntesis por el testimonio inglés usado para este borrador.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1:11 El término también puede referirse a la continencia o castidad.
    reason: Preserva el campo semántico ascético del término sin restringir la traducción principal.
  - marker: b
    text: '1:14 O bien: «quienes viven en continencia»; también puede entenderse «quienes son castos».'
    reason: Conserva las alternativas explícitas del testimonio y la ambigüedad contextual.
  - marker: c
    text: '1:19 O bien: «la enseñanza».'
    reason: Mantiene la alternativa «doctrine» ofrecida por el testimonio.
  - marker: d
    text: 1:22 «Celestial» es una aclaración transmitida entre paréntesis por el testimonio inglés usado para este borrador.
    reason: Distingue una aclaración parentética del texto continuo y hace transparente la base provisional.
lexical_decisions:
- source_word: temperance
  choice: dominio propio
  rationale: Comunica en español actual la idea amplia de autocontrol, sin reducir de manera automática el pasaje a la castidad; una nota conserva la posible acepción ascética o sexual.
- source_word: oracles
  choice: oráculos
  rationale: Conserva el carácter solemne de las declaraciones divinas y evita diluirlo simplemente como «palabras».
- source_word: king's highway
  choice: camino real
  rationale: Es el equivalente histórico y natural para una vía pública principal bajo autoridad regia.
- source_word: handsome legs
  choice: piernas bien formadas
  rationale: Describe el aspecto corporal con naturalidad y evita que «hermosas piernas» produzca un tono impropio en español moderno.
- source_word: wisdom (or doctrine)
  choice: sabiduría
  rationale: Mantiene la lectura principal del testimonio y registra «enseñanza» como alternativa en nota.
- source_word: breaking of bread
  choice: partir el pan
  rationale: Conserva la formulación tradicional y su posible amplitud entre comida comunitaria y práctica ritual, sin resolverla denominacionalmente.
theological_decisions:
- issue: Alcance de temperance en 1:11 y 1:14
  choice: dominio propio, con nota sobre continencia o castidad
  alternative: castidad
  rationale: El contexto ascético favorece la continencia, pero el testimonio permite un sentido más amplio; se preserva la tensión sin imponer una lectura exclusivamente sexual.
- issue: Sentido de mantener puro el bautismo en 1:18
  choice: mantienen puro su bautismo
  alternative: permanecen puros desde su bautismo
  rationale: Se conserva la formulación difícil del testimonio en vez de explicar qué conducta o teología bautismal presupone.
- issue: Ser hechos ángeles de Dios en 1:16
  choice: serán hechos ángeles de Dios
  alternative: serán como ángeles de Dios
  rationale: El testimonio afirma transformación o incorporación, no mera semejanza; no se atenúa la afirmación teológica.
- issue: La palabra del Padre en 1:22
  choice: actuará eficazmente para su salvación
  alternative: garantizará su salvación
  rationale: Expresa eficacia sin convertir la frase en una garantía doctrinal más absoluta de lo que permite el testimonio.
- issue: Género de los vírgenes en 1:22
  choice: quienes permanecen vírgenes
  alternative: las vírgenes
  rationale: El plural del testimonio puede ser genérico; esta formulación evita limitarlo innecesariamente a mujeres, a la vez que mantiene la virginidad como estado corporal y espiritual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» en el diálogo plural y puntuación moderna. El borrador sigue de manera provisional el testimonio inglés de dominio público suministrado, pues la revisión directa del griego y de las versiones antiguas está pendiente; por ello se evitan reconstrucciones no respaldadas y se conservan mediante notas las alternativas explícitas del testimonio.
