base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: es
  text: '7:1 Entonces Pablo hizo volver a Onesíforo y a su familia a su casa. Luego tomó consigo a Tecla y partió hacia Antioquía.


    7:2 Apenas entraron en la ciudad, un sirio llamado Alejandro, magistrado de la ciudad que durante su mandato había prestado muchos servicios importantes a la ciudad, vio a Tecla y se enamoró de ella. Con muchos regalos costosos intentó ganarse el favor de Pablo.


    7:3 Pero Pablo le dijo: «No conozco a la mujer de quien hablas, ni me pertenece».


    7:4 Sin embargo, Alejandro, que tenía gran poder en Antioquía, la agarró en plena calle y la besó. Tecla no toleró aquello. Mientras buscaba a Pablo con la mirada, gritó angustiada: «¡No me fuerces, pues soy extranjera! ¡No me fuerces, pues soy sierva de Dios! Soy una de las personas prominentes de Iconio, y tuve que abandonar esa ciudad porque no quise casarme con Tamiris».


    7:5 Entonces agarró a Alejandro, le rasgó el manto, le quitó la corona de la cabeza y lo puso en ridículo ante todo el pueblo.


    7:6 Pero Alejandro, en parte porque la amaba y en parte porque se sentía avergonzado por lo ocurrido, la llevó ante el gobernador. Cuando ella reconoció lo que había hecho, el gobernador la condenó a ser arrojada a las fieras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magistrate
  choice: magistrado
  rationale: Conserva el carácter de cargo cívico sin precisar una función que el testimonio suministrado no identifica.
- source_word: engage Paul in his interest
  choice: ganarse el favor de Pablo
  rationale: Expresa de manera natural el intento de obtener la cooperación de Pablo mediante regalos, sin añadir un acuerdo explícito.
- source_word: does she belong to me
  choice: ni me pertenece
  rationale: Mantiene la formulación posesiva y su tensión narrativa, sin reinterpretarla como parentesco, tutela o matrimonio.
- source_word: force me
  choice: no me fuerces
  rationale: Preserva la amplitud y urgencia de la expresión, sin limitarla a una clase específica de agresión.
- source_word: crown
  choice: corona
  rationale: Retiene el objeto mencionado sin especificar su forma, material o función oficial.
- source_word: beasts
  choice: fieras
  rationale: Es la expresión idiomática tradicional y clara para animales destinados al castigo público.
theological_decisions:
- issue: Designación de Tecla como servant of God
  choice: sierva de Dios
  alternative: servidora de Dios
  rationale: «Sierva de Dios» es digna, comprensible y conserva el matiz religioso de entrega o pertenencia sin imponer una condición eclesiástica formal.
- issue: Negación de Pablo respecto de Tecla
  choice: «No conozco a la mujer de quien hablas, ni me pertenece»
  alternative: «No sé quién es esa mujer ni está bajo mi autoridad»
  rationale: La versión elegida conserva la brusquedad y ambigüedad teológica y narrativa del testimonio, sin explicar las intenciones de Pablo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron los nombres tradicionales Onesíforo, Tecla, Antioquía, Iconio y Tamiris. El borrador es necesariamente provisional porque el expediente indica que la revisión directa del griego y de las versiones antiguas aún está pendiente; por ello no se añadieron precisiones que dependan de resolver variantes del texto fuente.
