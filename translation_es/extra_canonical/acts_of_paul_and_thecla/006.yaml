  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: es
  text: '6:1 Mientras tanto, Pablo, junto con Onesíforo, su esposa y sus hijos, ayunaba en una cueva situada en el camino de Iconio a Dafne.


    6:2 Después de ayunar varios días, los niños le dijeron a Pablo:


    —Padre, tenemos hambre y no tenemos con qué comprar pan.


    Esto se debía a que Onesíforo había dejado todos sus bienes para seguir a Pablo con su familia.


    6:3 Entonces Pablo se quitó el manto y le dijo al muchacho:


    —Ve, hijo, compra pan y tráelo acá.


    6:4 Mientras el muchacho compraba el pan, vio a Tecla, su vecina. Sorprendido, le preguntó:


    —Tecla, ¿adónde vas?


    6:5 Ella respondió:


    —Voy en busca de Pablo, pues he sido librada de las llamas.


    6:6 El muchacho le dijo:


    —Yo te llevaré hasta él, porque está muy preocupado por ti y lleva seis días orando y ayunando.


    6:7 Cuando Tecla llegó a la cueva, encontró a Pablo de rodillas, orando así:


    —Oh Padre santo, oh Señor Jesucristo, concede que el fuego no toque a Tecla; más bien, ayúdala, porque ella es tu sierva.


    6:8 Entonces Tecla, de pie detrás de él, exclamó:


    —Oh Señor soberano, Creador del cielo y de la tierra, Padre de tu Hijo amado y santo, te alabo porque me has preservado del fuego para volver a ver a Pablo.


    6:9 Pablo se levantó y, al verla, dijo:


    —Oh Dios, que examinas el corazón, Padre de mi Señor Jesucristo, te alabo porque has respondido a mi oración.


    6:10 En la cueva reinaba entre ellos un profundo afecto, y Pablo, Onesíforo y todos los que los acompañaban estaban llenos de alegría.


    6:11 Tenían cinco panes, algunas hierbas y agua, y se reconfortaban unos a otros reflexionando sobre las obras santas de Cristo.


    6:12 Entonces Tecla le dijo a Pablo:


    —Si te parece bien, te seguiré adondequiera que vayas.


    6:13 Él le respondió:


    —En estos tiempos la gente se entrega mucho a la inmoralidad sexual. Como eres hermosa, temo que afrontes una tentación mayor que la anterior y que no resistas, sino que seas vencida por ella.


    6:14 Tecla respondió:


    —Concédeme tan solo el sello de Cristo[a], y ninguna tentación me afectará.


    6:15 Pablo contestó:


    —Tecla, espera con paciencia y recibirás el don de Cristo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «El sello de Cristo» es una imagen antigua cuyo sentido preciso no se explica aquí. Puede tener una dimensión ritual, pero el texto no la identifica expresamente.
    reason: Preserva la ambigüedad teológica y ritual sin imponer una identificación denominacional.
  - marker: b
    text: «El don de Cristo» también puede traducirse «el regalo de Cristo». El pasaje no especifica en qué consiste ni afirma de forma explícita que sea idéntico al «sello» del versículo anterior.
    reason: Evita fusionar dos expresiones distintas y deja visible la indeterminación del testimonio.
lexical_decisions:
- source_word: coat
  choice: manto
  rationale: En el contexto antiguo se refiere probablemente a una prenda exterior con valor suficiente para intercambiarse o venderse; «manto» resulta más natural y contextual que «abrigo» o «chaqueta».
- source_word: Father
  choice: Padre
  rationale: Se conserva como tratamiento respetuoso y espiritual dirigido a Pablo, sin convertirlo en una afirmación biológica.
- source_word: fornication
  choice: inmoralidad sexual
  rationale: Expresa en español actual el sentido amplio del término transmitido por el testimonio, evitando el uso estrecho o arcaizante de «fornicación».
- source_word: seal of Christ
  choice: sello de Cristo
  rationale: Se retiene literalmente la imagen antigua y su ambigüedad ritual o teológica, sin identificarla explícitamente con el bautismo u otro rito.
- source_word: gift of Christ
  choice: don de Cristo
  rationale: «Don» conserva la amplitud de la expresión, que podría referirse a una gracia, un rito o un beneficio concedido por Cristo.
- source_word: holy works of Christ
  choice: obras santas de Cristo
  rationale: Se mantiene la formulación del testimonio sin precisar si se trata de obras realizadas por Cristo o vinculadas con él.
theological_decisions:
- issue: Identidad del «sello de Cristo»
  choice: Conservar «sello de Cristo» sin explicación en el texto principal
  alternative: Traducir o glosar como «bautismo»
  rationale: El testimonio suministrado no resuelve explícitamente la referencia. Identificar el sello con un rito concreto eliminaría una ambigüedad antigua e introduciría interpretación doctrinal.
- issue: Relación entre el «sello» de 6:14 y el «don» de 6:15
  choice: Mantener términos distintos
  alternative: Uniformarlos como una misma realidad ritual
  rationale: El pasaje usa dos expresiones y no declara de manera inequívoca que sean idénticas; la traducción preserva esa tensión.
- issue: Invocación de 6:7
  choice: Conservar «Padre santo» y «Señor Jesucristo» como dos vocativos sucesivos
  alternative: Reformularlos como una sola identificación directa
  rationale: La sintaxis transmitida permite tensión en la estructura de la invocación; no corresponde resolverla mediante una paráfrasis trinitaria o antitrinitaria.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya y sintaxis clara. Como la revisión directa del griego está pendiente y el material fuente inmediato es un testimonio inglés de dominio público, se evita formular certezas filológicas que ese testimonio no permite. Se modernizan giros arcaicos sin borrar imágenes clave ni tensiones teológicas.
