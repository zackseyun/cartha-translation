base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: es
  text: 'Y cuanto más alguien vea que su obispo guarda silencio, tanto más debe temerle.[a] Porque a todo aquel a quien el Señor de la casa envía para administrar su propia casa, debemos recibirlo como a quien lo envió. Por tanto, es evidente que debemos considerar al obispo como al Señor mismo.[b]


    Ahora bien, Onésimo, por iniciativa propia, elogia mucho el buen orden que ustedes tienen en Dios, pues todos ustedes viven conforme a la verdad y ninguna herejía encuentra lugar entre ustedes. Es más, ni siquiera escuchan a nadie si no habla de Jesucristo en verdad.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El verbo también puede expresar reverencia o profundo respeto; literalmente, «téngale más temor» o «témalo más».
    reason: Conserva el rango semántico de φοβείσθω sin atenuar el término en el texto principal.
  - marker: b
    text: La comparación reproduce la formulación enfática del texto; no identifica ni distingue explícitamente aquí la función del obispo y la persona del Señor.
    reason: Señala la fuerza de la comparación sin resolverla doctrinalmente.
  - marker: c
    text: 'La frase final puede entenderse también como: «si no habla verdaderamente acerca de Jesucristo».'
    reason: Hace visible la ambigüedad del alcance de «en verdad».
lexical_decisions:
- source_word: σιωπῶντα
  choice: guarda silencio
  rationale: Conserva la imagen del obispo silencioso sin precisar si se refiere a reserva personal, mansedumbre o falta de elocuencia.
- source_word: φοβείσθω
  choice: debe respetarlo
  rationale: En este contexto de recepción y consideración de la autoridad, expresa el sentido reverencial posible del verbo sin sugerir necesariamente terror; la nota conserva la traducción más literal.
- source_word: οἰκοδεσπότης / οἰκονομίαν
  choice: Señor de la casa / administrar
  rationale: Mantiene la metáfora doméstica y la relación entre quien gobierna la casa y quien recibe su administración.
- source_word: ὑποτυπώσεως
  choice: conducta ordenada
  rationale: Comunica el orden o buen modelo comunitario elogiado por Onésimo sin imponer un tecnicismo poco natural.
- source_word: αἵρεσις
  choice: herejía
  rationale: Retiene el término histórico-teológico habitual, cuyo sentido aquí abarca una enseñanza o facción desviada.
- source_word: περὶ Ἰησοῦ Χριστοῦ ἐν ἀληθείᾳ
  choice: Jesucristo en verdad
  rationale: 'Preserva la formulación compacta y su ambigüedad: puede referirse tanto a hablar verdaderamente acerca de Jesucristo como a Jesucristo conocido o confesado en la verdad.'
theological_decisions:
- issue: Comparación entre el obispo y el Señor
  choice: considerar al obispo como al Señor mismo
  alternative: considerar al obispo como representante del Señor
  rationale: Se conserva la fuerza explícita de la comparación del texto, sin añadir la explicación interpretativa «representante», que suavizaría o resolvería su tensión teológica.
- issue: Sentido de «temer» al obispo silencioso
  choice: respetarlo, con nota sobre «temerlo»
  alternative: temerlo
  rationale: El cuerpo usa un español natural que expresa reverencia, mientras la nota deja visible el sentido formal más fuerte y la ambigüedad del término.
- issue: Alcance de la expresión final sobre Jesucristo y la verdad
  choice: Jesucristo en verdad
  alternative: la verdad acerca de Jesucristo
  rationale: No se restringe la frase a contenido doctrinal solamente; se mantiene abierta su relación sintáctica y teológica con «Jesucristo» y «verdad».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conserva la metáfora de la casa. Dado que la revisión directa del griego está indicada como pendiente en los datos suministrados, el borrador sigue de cerca el testimonio inglés público y evita decisiones que dependan de una reconstrucción griega no verificada.
