source:
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is--the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from Him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot to be always a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the Apostles in the power of Jesus Christ.'
