translation:
  language: es
  text: 'Estos son los últimos tiempos. De ahora en adelante, tengamos reverencia y temamos la paciencia de Dios, no sea que llegue a ser juicio contra nosotros. Una de dos: temamos la ira que ha de venir o amemos la gracia que está presente; pero, ante todo, seamos encontrados en Cristo Jesús para vida verdadera.


    Que nada se les presente aparte de Jesucristo, en quien llevo mis cadenas, mis perlas espirituales; en ellas espero resucitar por medio de la oración de ustedes, de la cual deseo participar siempre, para ser encontrado entre los cristianos de Éfeso, quienes además siempre estuvieron de acuerdo con los apóstoles en el poder de Jesucristo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: last times
  choice: últimos tiempos
  rationale: Conserva el lenguaje escatológico del testimonio sin especificar una cronología que el texto no ofrece.
- source_word: long-suffering of God
  choice: paciencia de Dios
  rationale: Expresa en español natural la idea de tolerancia prolongada y misericordiosa, sin debilitar la advertencia sobre el juicio.
- source_word: grace which now is
  choice: gracia que está presente
  rationale: Mantiene el contraste temporal con la ira futura y evita reducir «gracia» a una emoción o favor meramente humano.
- source_word: glitter in your eyes
  choice: les parezca atractivo
  rationale: La expresión inglesa representa la idea de que nada fuera de Cristo debe resultar prominente, apropiado o cautivador; esta formulación es natural y no introduce una imagen óptica excesivamente literal.
- source_word: spiritual pearls
  choice: perlas espirituales
  rationale: Conserva intacta la metáfora con la que Ignacio valora sus cadenas.
- source_word: in the company of
  choice: entre
  rationale: Comunica pertenencia al grupo o suerte compartida sin imponer una noción técnica de comunión eclesial.
- source_word: were ever of one mind with
  choice: siempre han estado de acuerdo con
  rationale: Reproduce la concordia sostenida con los apóstoles sin afirmar una identidad absoluta de pensamiento más allá del texto.
theological_decisions:
- issue: Relación entre temor de la ira y amor de la gracia
  choice: 'Una de dos: temamos… o amemos…; con tal de que seamos hallados en Cristo Jesús'
  alternative: Presentar el amor de la gracia como sustitución o etapa superior al temor
  rationale: Se conserva la alternativa retórica y la tensión exhortativa del testimonio, sin construir una jerarquía doctrinal no expresada.
- issue: Finalidad de ser hallados en Cristo
  choice: para alcanzar la vida verdadera
  alternative: para vivir verdaderamente
  rationale: La formulación conserva la orientación hacia la vida verdadera y evita decidir si se alude exclusivamente a la vida presente, la resurrección o la vida eterna.
- issue: Medio asociado con la resurrección de Ignacio
  choice: por medio de la oración de ustedes, resucite llevando estas perlas
  alternative: que la oración de ustedes cause su resurrección
  rationale: Mantiene la estrecha asociación del texto entre la oración, las cadenas y la esperanza de resurrección, sin definir una causalidad sacramental o meritoria.
- issue: Acuerdo de los efesios con los apóstoles
  choice: por el poder de Jesucristo
  alternative: en el poder de Jesucristo
  rationale: El español elegido expresa la esfera o agencia del poder de Cristo sin atribuir la concordia a una capacidad meramente humana.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y construcciones exhortativas claras. Se conservan las metáforas de las cadenas como perlas y el lenguaje escatológico. Por estar pendiente la consulta directa del griego, el borrador no pretende resolver definitivamente las ambigüedades sintácticas del segundo párrafo.
