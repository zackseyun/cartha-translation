base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: es
  text: 'Cuando supe del muy buen orden de su amor conforme a Dios, me alegré y decidí dirigirme a ustedes en la fe de Jesucristo.



    Pues, considerado digno de llevar un nombre sumamente digno de Dios[a] en estas cadenas que llevo conmigo, canto las alabanzas de las iglesias; y pido que haya en ellas unidad de carne y de espíritu, propios de Jesucristo, nuestra vida incesante; unidad de fe y de amor, al cual nada se antepone; y, por encima de todo, unidad con Jesucristo y con el Padre. En quien, si soportamos pacientemente toda la hostilidad del gobernante de esta era y escapamos de ella, alcanzaremos a Dios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión también puede significar «un nombre sumamente apropiado para Dios» o «un nombre que conviene a Dios». El texto no identifica explícitamente cuál es ese nombre.
    reason: Conserva la ambigüedad léxica y referencial de ὄνομα θεοπρεπέστατον, sin identificar el nombre con «cristiano», con el nombre de Cristo ni con un título determinado.
lexical_decisions:
- source_word: πολυεύτακτον
  choice: extraordinario orden
  rationale: Conserva la intensidad y la idea de una comunidad amorosa bien ordenada, sin reducirla simplemente a «buena conducta».
- source_word: κατὰ θεὸν ἀγάπης
  choice: el amor que ustedes viven conforme a Dios
  rationale: Expresa de manera natural la orientación del amor según Dios, sin convertir la frase en una afirmación más específica sobre su origen.
- source_word: ὀνόματος θεοπρεπεστάτου
  choice: un nombre sumamente digno de Dios
  rationale: Mantiene la referencia deliberadamente no especificada al «nombre» y el sentido superlativo de que corresponde o conviene a Dios.
- source_word: ἕνωσιν
  choice: unidad
  rationale: «Unidad» comunica el vínculo corporativo y espiritual; evita el matiz institucional moderno que podría sugerir «unión» en este contexto.
- source_word: τοῦ διαπαντὸς ἡμῶν ζῆν
  choice: él es nuestra vida permanente
  rationale: Representa la idea de vida continua o incesante en español natural y aplica la frase a Jesucristo sin exagerarla como una fórmula metafísica.
- source_word: ἄρχοντος τοῦ αἰῶνος τούτου
  choice: gobernante de este mundo
  rationale: Conserva el título personal y adversario; «mundo» resulta idiomático aquí para αἰών, aunque literalmente puede aludir a la era presente.
- source_word: θεοῦ τευξόμεθα
  choice: llegaremos a Dios
  rationale: Refleja el sentido de alcanzar o llegar a Dios sin añadir una descripción doctrinal del estado final.
theological_decisions:
- issue: Relación de «carne y espíritu» con Jesucristo
  choice: de la carne y del espíritu de Jesucristo
  alternative: de la carne y del espíritu, los cuales pertenecen a Jesucristo
  rationale: 'La construcción conserva el genitivo griego y su tensión: puede referirse estrechamente a la carne y el espíritu de Cristo o caracterizar la unidad de la comunidad como perteneciente a Cristo.'
- issue: Antecedente de «en él»
  choice: en él
  alternative: en quienes / por medio de quien
  rationale: Se mantiene el singular del testimonio griego y su posible referencia inmediata al Padre, sin resolver de forma explícita una relación sintáctica y teológica que el pasaje deja comprimida.
- issue: Identidad del «gobernante de este mundo»
  choice: se conserva el título sin identificarlo en el texto
  alternative: el diablo / Satanás
  rationale: Aunque tradicionalmente se entiende como una figura satánica, el texto usa un título y la traducción no debe sustituirlo por una identificación interpretativa.
- issue: 'Objeto preferente: fe y amor o solo amor'
  choice: «el amor, al cual nada se antepone»
  alternative: «la fe y el amor, que se prefieren a todo»
  rationale: El relativo griego es singular y femenino, por lo que gramaticalmente apunta al amor; esta lectura corrige la generalización del testimonio inglés.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conservan las imágenes de las cadenas, la unidad y el camino hacia Dios. La redacción sigue prioritariamente la evidencia griega reconstruible de la recensión media; dado que la ficha advierte que la revisión directa de la lengua fuente está pendiente, las decisiones que se apartan del testimonio inglés se limitan a rasgos gramaticales claros, especialmente el relativo singular referido al amor.
