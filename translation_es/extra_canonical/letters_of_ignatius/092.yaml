review_pass:
  verdict: revise
  source_fidelity: 'El borrador refleja en líneas generales la exhortación pastoral y conserva las imágenes principales, pero varias elecciones se apartan del griego de la recensión media: καταπλάσματα son «cataplasmas», no meramente «compresas»; σωματικὸς καὶ πνευματικός requiere «corporal y espiritual»; la comparación presenta a los vientos como quienes exigen pilotos; y ἀντίψυχον expresa una entrega o sustitución de vida, no solo afecto o devoción. La nota a atribuye una ambigüedad al griego que la formulación ἵνα θεοῦ τύχῃς no exige.'
  naturalness: La prosa es generalmente natural en español latinoamericano. «Sin malicia» comunica mejor ἀκέραιος que «sencillo», y «sé sobrio» conserva de manera más directa la exhortación νῆφε. «Los que están más enfermos» mantiene la metáfora terapéutica deliberada del pasaje y prepara naturalmente las imágenes de heridas, ungüento y cataplasmas.
  terminology: Se conservan adecuadamente «discípulos», «mansedumbre», «incorruptibilidad», «vida eterna» y «dones espirituales». «Cataplasmas» es el término médico preciso, aunque histórico, y es comprensible en este contexto. Para ἀντίψυχον se adopta una expresión española explícita, con nota que explica su carácter idiomático sin convertirlo en una afirmación doctrinal técnica.
  issues:
  - severity: medium
    issue: «Compresas» por καταπλάσματα
    rationale: El término designa cataplasmas o emplastos aplicados externamente. «Compresas» es menos preciso y borra la continuidad léxica con el tratamiento médico del contexto.
  - severity: medium
    issue: «Eres de carne y espíritu» por σωματικὸς καὶ πνευματικός
    rationale: La expresión griega dice «corporal y espiritual»; no equivale sin más a «de carne y espíritu».
  - severity: medium
    issue: Inversión de los agentes en la comparación náutica
    rationale: El griego compara la exigencia del momento con los vientos que requieren pilotos, no con pilotos que necesitan vientos.
  - severity: high
    issue: «Una entrega de mi propia vida» y su nota para ἀντίψυχον
    rationale: La expresión indica dar la propia vida en lugar de la de otro, ser rescate o sustituto por su vida. La redacción y la nota actuales la reducen indebidamente a afecto y devoción.
  - severity: medium
    issue: Nota a sobre «para alcanzar a Dios»
    rationale: 'La nota preserva una ambigüedad creada por el testimonio inglés; el griego se dirige a Policarpo mediante segunda persona: «para que alcances a Dios».'
  - severity: low
    issue: «Sencillo» por ἀκέραιος
    rationale: «Sin malicia» expresa con mayor precisión integridad, pureza de intención y ausencia de engaño en la comparación con la paloma.
  revised_text: 'Si amas a los buenos discípulos, eso no es mérito tuyo. Más bien, somete con mansedumbre a los que están más enfermos. No toda herida se cura con el mismo ungüento. Aplica cataplasmas a todo dolor agudo.


    Sé prudente como la serpiente en todo y siempre sin malicia como la paloma. Por esto eres corporal y espiritual: para que trates con tacto las cosas que se presentan ante tus ojos; pero, en cuanto a las invisibles, pídele a Dios que te las revele, para que no carezcas de nada y abundes en todo don espiritual.


    La ocasión te exige, como los vientos exigen pilotos y el navegante azotado por la tormenta exige un puerto, para que alcances a Dios. Sé sobrio, como atleta de Dios. El premio es la incorruptibilidad y la vida eterna, acerca de la cual tú también estás convencido. En todo, doy mi vida por la tuya: yo y mis cadenas, que amaste.[a]'
  revised_footnotes:
  - marker: a
    text: 'Lit. «soy un sustituto por tu vida». Es una expresión intensa de entrega personal: Ignacio se ofrece a dar su vida en lugar de la de Policarpo.'
    reason: Aclara el modismo ἀντίψυχον sin reducirlo a afecto general ni imponer un sentido doctrinal técnico.
  revision_rationale: La revisión sigue el griego de la recensión media donde este permite precisar el puente inglés y corrige los lugares en que el borrador alteraba imágenes, relaciones gramaticales o el sentido del modismo final. Se elimina la nota a porque la segunda persona de «para que alcances a Dios» es suficientemente explícita y no requiere conservar una ambigüedad del testimonio inglés. Se mantiene un registro contemporáneo y digno, así como la ambigüedad del antecedente singular en «acerca de la cual».
