review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones puntuales. El borrador conserva en general las exhortaciones, las imágenes médicas, náuticas y atléticas, y la meta de llegar a Dios. Sin embargo, «sino que abundarás» altera la coordinación final: el texto expresa que no le falte nada y que abunde en todo don espiritual. Asimismo, «una entrega de mi propia vida» desarrolla en exceso la fórmula de devoción del cierre y la nota b le atribuye un alcance interpretativo que no es necesario para la traducción.'
  naturalness: El español es mayormente natural y de registro adecuado, pero «La ocasión te reclama» resulta menos idiomático que «El momento te exige», y «trates con tacto las cosas visibles» es algo impreciso porque presenta «las cosas» como objeto personal de trato. Se ajusta a «atiendas con consideración las cosas visibles».
  terminology: «Discípulos», «mansedumbre», «ungüento», «incorruptibilidad» y «atleta de Dios» son elecciones apropiadas. Para ἀκέραιος, «sin malicia» comunica con más precisión la integridad no engañosa evocada por la paloma que «sencillo». Se mantiene «don espiritual» sin imponer una lectura confesional posterior.
  issues:
  - severity: medium
    issue: «Así no te faltará nada, sino que abundarás en todo don espiritual»
    rationale: 'La construcción adversativa «sino» no corresponde al sentido acumulativo: se pide que no falte nada y que abunde en todo don espiritual.'
  - severity: medium
    issue: «una entrega de mi propia vida» y la nota b
    rationale: La traducción añade «propia vida» y la nota define la fórmula como disposición vicaria a dar la vida. El testimonio inglés solo dice «I am devoted to you», y la expresión antigua es intensiva e idiomática; conviene una formulación de entrega sin expandirla doctrinal o explicativamente.
  - severity: low
    issue: «La ocasión te reclama»
    rationale: Aunque «ocasión» puede representar καιρός, «te reclama» es poco natural en este contexto exhortativo. «El momento te exige» comunica mejor la urgencia de las circunstancias.
  - severity: low
    issue: «trates con tacto las cosas visibles»
    rationale: La colocación es poco idiomática y puede sugerir diplomacia interpersonal. «Atiendas con consideración» conserva la idea de acomodarse prudentemente a lo visible.
  revised_text: 'Si amas a los buenos discípulos, eso no tiene mérito. Más bien, somete con mansedumbre a los más problemáticos. No toda herida se cura con el mismo ungüento. Calma los dolores agudos con compresas.


    Sé prudente como la serpiente en todo y siempre sin malicia como la paloma. Por eso eres de carne y espíritu: para que atiendas con consideración las cosas visibles que tienes delante; en cuanto a las invisibles, pide que te sean reveladas. Así no te faltará nada y abundarás en todo don espiritual.


    El momento te exige, como los pilotos necesitan los vientos y el navegante azotado por la tormenta necesita un puerto, para que alcances a Dios.[a] Mantente alerta, como atleta de Dios. El premio es la incorruptibilidad y la vida eterna, de las cuales tú también estás convencido. En todo, yo y mis cadenas, que amaste, estamos entregados por ti.'
  revised_footnotes:
  - marker: a
    text: 'También puede entenderse: «para llegar a Dios». La frase expresa la meta a la que debe orientarse Policarpo en las circunstancias presentes.'
    reason: Aclara de forma limitada la construcción final sin crear una ambigüedad artificial ni afirmar más de lo que permite el testimonio de trabajo.
  revision_rationale: La revisión corrige la coordinación sintáctica final del segundo párrafo, mejora algunas expresiones para el español latinoamericano contemporáneo y elimina una expansión interpretativa innecesaria del modismo de cierre. Se conserva la referencia personal a Policarpo en «para que alcances a Dios», que concuerda con la exhortación dirigida en segunda persona y con el sentido del testimonio inglés, sin introducir doctrina adicional.
