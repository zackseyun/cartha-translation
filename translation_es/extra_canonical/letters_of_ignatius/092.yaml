base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: es
  text: 'Si amas a los buenos discípulos, eso no tiene mérito. Más bien, somete con mansedumbre a los más problemáticos. No toda herida se cura con el mismo ungüento. Calma los dolores agudos con compresas.


    Sé prudente como la serpiente en todo y siempre sencillo como la paloma. Por eso eres de carne y espíritu: para que trates con tacto las cosas visibles que tienes delante; en cuanto a las invisibles, pide que te sean reveladas. Así no te faltará nada, sino que abundarás en todo don espiritual.


    La ocasión te reclama, como los pilotos necesitan los vientos y el navegante azotado por la tormenta necesita un puerto, para que alcances a Dios.[a] Mantente alerta, como atleta de Dios. El premio es la incorruptibilidad y la vida eterna, de las cuales tú también estás convencido. En todo soy para ti una entrega de mi propia vida: yo y mis cadenas, a las que mostraste amor.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede entenderse: «para alcanzar a Dios». La expresión indica la meta a la que debe orientarse Policarpo en las circunstancias presentes.'
    reason: Aclara una construcción compacta cuyo sujeto queda implícito, sin reproducir la ambigüedad artificial del pronombre del testimonio inglés.
  - marker: b
    text: La expresión griega traducida «entrega de mi propia vida» es una fórmula intensa de afecto y devoción, con el sentido de estar dispuesto a dar la vida por otra persona.
    reason: Explica un modismo antiguo que no cuenta con un equivalente español breve y exacto.
lexical_decisions:
- source_word: μαθητάς
  choice: discípulos
  rationale: Conserva el sentido de aprendices o seguidores y encaja mejor que «estudiantes» en el contexto pastoral antiguo.
- source_word: λοιμοτέρους
  choice: los más problemáticos
  rationale: El comparativo describe a quienes resultan especialmente dañinos o difíciles; «problemáticos» comunica el sentido sin el tono médico arcaico de «pestilentes».
- source_word: ἐν πραΰτητι ὑπότασσε
  choice: somete con mansedumbre
  rationale: Mantiene tanto la fuerza de la exhortación a poner bajo disciplina como el modo apacible de hacerlo.
- source_word: ἀκέραιος
  choice: sencillo
  rationale: Expresa integridad sin mezcla de malicia; además, armoniza con la conocida imagen de la paloma sin reducirla meramente a ingenuidad.
- source_word: κολακεύῃς
  choice: trates con tacto
  rationale: El verbo puede sugerir acomodar, halagar o manejar con deferencia. En este contexto, «tratar con tacto» conserva la orientación práctica sin recomendar adulación engañosa.
- source_word: καιρός
  choice: ocasión
  rationale: Indica el momento oportuno o exigencia particular de las circunstancias, no solo tiempo cronológico.
- source_word: νῆφε
  choice: mantente alerta
  rationale: Recoge la idea de sobriedad y vigilancia mental en lenguaje natural contemporáneo.
- source_word: ἀφθαρσία
  choice: incorruptibilidad
  rationale: Mantiene el término teológico y escatológico tradicional, que se refiere a una condición no sujeta a corrupción o decadencia.
- source_word: ἀντίψυχον
  choice: una entrega de mi propia vida
  rationale: La expresión idiomática comunica devoción vicaria o disposición a dar la vida por alguien; la formulación evita presentarla como una equivalencia doctrinal técnica.
theological_decisions:
- issue: Sujeto de «alcanzar a Dios»
  choice: «para que alcances a Dios», referido a Policarpo
  alternative: «para que [la ocasión] alcance a Dios»
  rationale: La construcción griega con infinitivo depende naturalmente de la exigencia dirigida a «ti» y expresa la meta de Policarpo. El pronombre «it» del testimonio inglés introduce una ambigüedad que no es necesario reproducir en español.
- issue: Composición humana
  choice: «eres de carne y espíritu»
  alternative: «estás hecho de carne y espíritu»
  rationale: Conserva la tensión antropológica del pasaje sin convertirla en una definición dogmática exhaustiva de la constitución humana.
- issue: Premio escatológico
  choice: «El premio es la incorruptibilidad y la vida eterna»
  alternative: «Lo que está en juego es la incorruptibilidad y la vida eterna»
  rationale: La metáfora del atleta favorece «premio», pero no se añade ninguna explicación sobre mérito o mecanismo de salvación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las imágenes médicas, náuticas y atléticas. Se prefirió «discípulos» frente a «estudiantes» y se evitó el arcaísmo «pestilentes». Dado que el expediente indica que la revisión directa del griego está pendiente, el borrador toma en cuenta el testimonio inglés suministrado y las lecturas léxicas de la tradición griega de recensión media, preservando las tensiones reales del pasaje.
