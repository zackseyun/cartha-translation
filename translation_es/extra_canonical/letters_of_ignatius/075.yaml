base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: es
  text: 'Ahora bien, en cuanto a Filón, el diácono de Cilicia, hombre de buen testimonio, que también ahora me sirve en la palabra de Dios junto con Reo Agatópodo,[a] hombre escogido que me acompaña desde Siria después de haber renunciado a esta vida presente:[b] ellos también dan testimonio de ustedes. Yo, por mi parte, doy gracias a Dios por ustedes, porque los recibieron, así como confío en que el Señor los recibirá a ustedes. Y que quienes los trataron con deshonra sean redimidos por la gracia de Jesucristo.


    El amor de los hermanos que están en Troas los saluda. Desde allí también les escribo por medio de Burrus,[c] a quien los efesios y los esmirneos enviaron conmigo como muestra de honor. El Señor Jesucristo honrará a estos, quienes han puesto su esperanza en él en carne, alma y espíritu, mediante la fe, el amor y la concordia. Que estén bien en Cristo Jesús, nuestra esperanza común.


    [a] Las formas de estos nombres propios varían entre transliteraciones; aquí se reproducen como «Reo Agatópodo».

    [b] También puede traducirse: «después de despedirse de esta vida presente». La expresión puede indicar una renuncia radical al modo de vida presente, sin afirmar necesariamente que ya hubiera muerto.

    [c] Nombre propio que también se translitera «Burro» o «Burrhos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Las formas de estos nombres propios varían entre transliteraciones; aquí se reproducen como «Reo Agatópodo».
    reason: Advierte de la inestabilidad de las formas latinizadas de los nombres sin entorpecer el texto.
  - marker: b
    text: 'También puede traducirse: «después de despedirse de esta vida presente». La expresión puede indicar una renuncia radical al modo de vida presente, sin afirmar necesariamente que ya hubiera muerto.'
    reason: Preserva una ambigüedad relevante del giro antiguo que el testimonio inglés podría hacer sonar como muerte literal.
  - marker: c
    text: Nombre propio que también se translitera «Burro» o «Burrhos».
    reason: Explica la elección «Burrus», que evita en español la asociación inmediata con el sustantivo común «burro».
lexical_decisions:
- source_word: διάκονος (diakonos)
  choice: diácono
  rationale: Conserva el título ministerial que el testimonio atribuye a Filón y es plenamente comprensible en español.
- source_word: μεμαρτυρημένος (memartyrēmenos)
  choice: hombre de buen testimonio
  rationale: Expresa que Filón contaba con una reputación acreditada, sin convertir el término en el sentido posterior y técnico de «mártir».
- source_word: ὑπηρετεῖ μοι (hypēretei moi)
  choice: me sirve
  rationale: Mantiene la relación explícita de servicio a Ignacio sin sobreespecificar las tareas concretas.
- source_word: ἀποταξάμενος τῷ βίῳ (apotaxamenos tō biō)
  choice: después de haber renunciado a esta vida presente
  rationale: Conserva la imagen de despedirse o renunciar a la vida presente y evita afirmar inequívocamente una muerte ya ocurrida.
- source_word: λύτρωθεν / λυτρωθείησαν (lytrōthen / lytrōtheiēsan)
  choice: sean redimidos
  rationale: Retiene el lenguaje de liberación o rescate y la forma de deseo u oración, sin reducirlo a una mera reconciliación social.
- source_word: ὁμόνοια (homonoia)
  choice: concordia
  rationale: Comunica unidad de ánimo y acuerdo comunitario en un registro digno y natural.
theological_decisions:
- issue: Alcance de la renuncia de Reo Agatópodo a «esta vida»
  choice: renunciado a esta vida presente
  alternative: despedido de esta vida presente
  rationale: La expresión admite una renuncia radical a la vida ordinaria y no exige entender que la persona hubiera muerto; la nota conserva la imagen alternativa.
- issue: Deseo respecto de quienes deshonraron a los enviados
  choice: que sean redimidos por la gracia de Jesucristo
  alternative: que sean rescatados en la gracia de Jesucristo
  rationale: Se preserva la tensión entre su conducta deshonrosa y el deseo de gracia para ellos, sin convertir la frase en condena.
- issue: Relación entre Jesucristo y «el Señor» en la promesa de honor
  choice: El Señor Jesucristo honrará a estos
  alternative: El Señor los honrará, es decir, Jesucristo
  rationale: La formulación identifica con naturalidad a Jesucristo como el Señor, conforme al sentido del testimonio, sin introducir una explicación doctrinal adicional.
- issue: Carne, alma y espíritu
  choice: en carne, alma y espíritu
  alternative: con cuerpo, alma y espíritu
  rationale: Se mantiene la tríada y su posible tensión antropológica sin imponer una teoría sobre la constitución humana.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evita el voseo y se emplea «ustedes». El borrador prioriza una sintaxis clara, pero conserva expresiones teológicamente densas como «carne, alma y espíritu» y «nuestra esperanza común». Debido a que el expediente indica que la revisión directa de la tradición griega de recensión media aún está pendiente, las decisiones se han contrastado con la evidencia griega comúnmente atestiguada cuando ha sido posible, sin presentar como segura ninguna lectura textual no verificada.
