  - marker: c
    text: Nombre propio que también se translitera «Burro» o «Burrhos».
    reason: Explica la forma «Burrus» y otras transliteraciones posibles.
lexical_decisions:
- source_word: διάκονος (diakonos)
  choice: diácono
  rationale: Conserva el título ministerial que el testimonio atribuye a Filón y es plenamente comprensible en español.
- source_word: μεμαρτυρημένος (memartyrēmenos)
  choice: hombre de buen testimonio
  rationale: Expresa que Filón contaba con una reputación acreditada, sin convertir el término en el sentido posterior y técnico de «mártir».
- source_word: ὑπηρετεῖ μοι (hypēretei moi)
  choice: me sirve
  rationale: Mantiene la relación explícita de servicio a Ignacio sin sobreespecificar las tareas concretas.
- source_word: ἀποταξάμενος τῷ βίῳ (apotaxamenos tō biō)
  choice: después de haber renunciado a esta vida presente
  rationale: Conserva la imagen de despedirse o renunciar a la vida presente y evita afirmar inequívocamente una muerte ya ocurrida.
- source_word: λύτρωθεν / λυτρωθείησαν (lytrōthen / lytrōtheiēsan)
  choice: sean redimidos
  rationale: Retiene el lenguaje de liberación o rescate y la forma de deseo u oración, sin reducirlo a una mera reconciliación social.
- source_word: ὁμόνοια (homonoia)
  choice: concordia
  rationale: Comunica unidad de ánimo y acuerdo comunitario en un registro digno y natural.
theological_decisions:
- issue: Alcance de la renuncia de Reo Agatópodo a «esta vida»
  choice: renunciado a esta vida presente
  alternative: despedido de esta vida presente
  rationale: La expresión admite una renuncia radical a la vida ordinaria y no exige entender que la persona hubiera muerto; la nota conserva la imagen alternativa.
- issue: Deseo respecto de quienes deshonraron a los enviados
  choice: que sean redimidos por la gracia de Jesucristo
  alternative: que sean rescatados en la gracia de Jesucristo
  rationale: Se preserva la tensión entre su conducta deshonrosa y el deseo de gracia para ellos, sin convertir la frase en condena.
- issue: Relación entre Jesucristo y «el Señor» en la promesa de honor
  choice: El Señor Jesucristo honrará a estos
  alternative: El Señor los honrará, es decir, Jesucristo
  rationale: La formulación identifica con naturalidad a Jesucristo como el Señor, conforme al sentido del testimonio, sin introducir una explicación doctrinal adicional.
- issue: Carne, alma y espíritu
  choice: en carne, alma y espíritu
  alternative: con cuerpo, alma y espíritu
  rationale: Se mantiene la tríada y su posible tensión antropológica sin imponer una teoría sobre la constitución humana.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evita el voseo y se emplea «ustedes». El borrador prioriza una sintaxis clara, pero conserva expresiones teológicamente densas como «carne, alma y espíritu» y «nuestra esperanza común». Debido a que el expediente indica que la revisión directa de la tradición griega de recensión media aún está pendiente, las decisiones se han contrastado con la evidencia griega comúnmente atestiguada cuando ha sido posible, sin presentar como segura ninguna lectura textual no verificada.
