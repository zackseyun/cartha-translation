base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: es
  text: 'Ahora bien, en cuanto a Filón, el diácono de Cilicia, hombre de buena reputación, que también ahora me sirve en la palabra de Dios junto con Reo Agatópodo,[a] un elegido que me acompaña desde Siria después de haber renunciado a esta vida presente:[b] ellos también dan testimonio de ustedes. Yo, por mi parte, doy gracias a Dios por ustedes, porque los recibieron, así como confío en que el Señor los recibirá a ustedes. Y que quienes los trataron con deshonra sean redimidos por la gracia de Jesucristo.


    El amor de los hermanos que están en Troas los saluda. Desde allí también les escribo por medio de Burrus,[c] a quien los efesios y los esmirneos enviaron conmigo como muestra de honor. El Señor Jesucristo honrará a todos ellos, que han puesto su esperanza en él en carne, alma y espíritu, mediante la fe, el amor y la concordia. Que estén bien en Cristo Jesús, nuestra esperanza común.


    [a] Las formas de estos nombres propios varían entre transliteraciones; aquí se reproducen como «Reo Agatópodo».


    [b] También puede traducirse: «después de despedirse de esta vida presente». La expresión puede indicar una renuncia radical al modo de vida presente, sin afirmar que ya hubiera muerto.


    [c] Nombre propio que también se translitera «Burro» o «Burrhos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Las formas de estos nombres propios varían entre transliteraciones; aquí se reproducen como «Reo Agatópodo».
    reason: Advierte de la variación en las transliteraciones de los nombres sin recargar el texto principal.
  - marker: b
