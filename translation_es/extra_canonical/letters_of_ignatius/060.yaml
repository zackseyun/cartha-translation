base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: es
  text: 'El príncipe de este mundo quiere despedazarme y corromper mi manera de pensar con respecto a Dios. Por tanto, que ninguno de ustedes que están cerca lo ayude. Pónganse más bien de mi lado, es decir, del lado de Dios. No hablen de Jesucristo mientras desean el mundo. No permitan que la envidia halle morada en ustedes.


    Aunque yo mismo, cuando esté con ustedes, les suplicara, no me obedezcan; crean más bien lo que les escribo. [Pues] les escribo estando aún con vida, pero anhelando la muerte. Mi deseo ha sido crucificado, y no hay en mí fuego alguno de anhelo material, sino solo agua viva que habla dentro de mí y me dice: «Ven al Padre».


    No encuentro placer en el alimento corruptible ni en los deleites de esta vida. Deseo el pan de Dios, que es la carne de Cristo, quien era del linaje de David; y como bebida deseo su sangre, que es amor incorruptible.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince of this world
  choice: príncipe de este mundo
  rationale: Conserva la designación tradicional y su posible eco joánico sin reinterpretarla como una referencia meramente política.
- source_word: mind to Godward
  choice: manera de pensar con respecto a Dios
  rationale: Expresa en español natural la orientación de la mente hacia Dios sin precisar de más una construcción difícil del testimonio inglés.
- source_word: lust / desire
  choice: deseo
  rationale: En este contexto ascético, «deseo» mantiene la amplitud del término y evita reducirlo exclusivamente al deseo sexual.
- source_word: water living
  choice: agua viva
  rationale: 'Mantiene la expresión bíblica reconocible y la personificación posterior: el agua habla dentro del autor.'
- source_word: food of corruption
  choice: alimento corruptible
  rationale: Comunica aquello sujeto a corrupción o descomposición, en contraste con el amor incorruptible.
- source_word: seed of David
  choice: linaje de David
  rationale: Es una formulación natural en español y conserva el sentido genealógico de la expresión semítica.
theological_decisions:
- issue: La aparente identificación del lado de Ignacio con el lado de Dios
  choice: «de mi lado, es decir, del lado de Dios»
  alternative: «apóyenme, o más bien, apoyen a Dios»
  rationale: Se conserva la tensión retórica del texto sin suavizar la afirmación ni convertirla en una equivalencia doctrinal general.
- issue: El deseo de muerte de Ignacio
  choice: «anhelando la muerte»
  alternative: «deseando morir»
  rationale: Mantiene la intensidad del testimonio en su contexto de martirio sin añadir una valoración psicológica moderna.
- issue: «Mi deseo ha sido crucificado»
  choice: Se conserva literalmente
  alternative: Interpretarlo como «mis pasiones han sido crucificadas» o identificar «mi deseo» con una entidad específica
  rationale: La expresión admite más de una lectura; se preserva su ambigüedad ascética y teológica.
- issue: La sangre de Cristo como amor incorruptible
  choice: «su sangre, que es amor incorruptible»
  alternative: «su sangre, en la cual está el amor incorruptible»
  rationale: Conserva la fuerza predicativa y sacramental del testimonio sin explicar ni restringir su sentido.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y un imperativo claro. Se preservan las imágenes abruptas, la tensión martirial y el marcador editorial «[Pues]», dado que el testimonio suministrado señala esa restauración. Como la revisión directa del griego está pendiente, las decisiones se mantienen deliberadamente cautelosas y se basan en el testimonio público proporcionado, consultado junto con la capa inglesa POB.
