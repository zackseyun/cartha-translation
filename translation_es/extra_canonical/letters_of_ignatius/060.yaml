review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés y conserva las principales imágenes y ambigüedades. Se ajustan «los que están presentes» para el sentido contextual de quienes acompañan al autor, «mente orientada hacia Dios» para la direccionalidad de la frase, y la invitación final en plural («Vengan al Padre»), que refleja la forma exhortativa tradicionalmente atestiguada.
  naturalness: El registro es claro y digno. Los cambios eliminan la construcción algo forzada «ninguno de ustedes que están cerca» y hacen más idiomática la primera oración sin rebajar el tono.
  terminology: Se mantienen «príncipe de este mundo», «agua viva», «linaje de David», «carne de Cristo» y «amor incorruptible». «Alimento corruptible» se conserva como formulación natural que expresa el contraste de corrupción/incorrupción, sin convertirlo en una explicación doctrinal.
  issues:
  - severity: medium
    issue: «ninguno de ustedes que están cerca»
    rationale: La expresión resulta gramaticalmente discordante y puede sugerir proximidad física accidental. En el contexto epistolar, «ninguno de los que están presentes» comunica mejor a los destinatarios que pudieran asistirlo.
  - severity: low
    issue: «mi manera de pensar con respecto a Dios»
    rationale: Es una paráfrasis algo débil de una mente dirigida u orientada hacia Dios. «Mi mente orientada hacia Dios» preserva mejor la direccionalidad y es natural en español.
  - severity: medium
    issue: «Ven al Padre»
    rationale: La tradición griega de esta frase presenta una invitación exhortativa plural; «Vengan al Padre» conserva esa forma, aunque la voz habla dentro del autor. No se debe armonizar el plural con una interpretación psicológica.
  - severity: low
    issue: «mientras desean el mundo»
    rationale: '«Y a la vez» reproduce con mayor precisión la yuxtaposición retórica: profesar a Jesucristo al mismo tiempo que se desea el mundo.'
  revised_text: 'El príncipe de este mundo quiere despedazarme y corromper mi mente orientada hacia Dios. Por tanto, que ninguno de los que están presentes lo ayude. Pónganse más bien de mi lado, es decir, del lado de Dios. No hablen de Jesucristo y a la vez deseen el mundo. No permitan que la envidia halle morada en ustedes.


    Aunque yo mismo, cuando esté con ustedes, les suplicara, no me obedezcan; crean más bien lo que les escribo. [Pues] les escribo estando aún con vida, pero anhelando la muerte. Mi deseo ha sido crucificado, y no hay en mí fuego alguno de anhelo material, sino solo agua viva que habla dentro de mí y me dice: «Vengan al Padre».


    No encuentro placer en el alimento corruptible ni en los deleites de esta vida. Deseo el pan de Dios, que es la carne de Cristo, quien era del linaje de David; y como bebida deseo su sangre, que es amor incorruptible.'
  revised_footnotes: []
  revision_rationale: La revisión conserva la equivalencia óptima y la aspereza ascética del pasaje. No se explican ni se resuelven doctrinalmente «mi deseo ha sido crucificado», la identificación retórica del lado del autor con el de Dios, ni «su sangre, que es amor incorruptible». El marcador editorial [Pues] se retiene, pues corresponde al [For] señalado en el testimonio. La revisión directa del griego sigue siendo deseable para documentar formalmente las decisiones textuales, especialmente la forma plural de la invitación.
