revisions:
- from: 'Pero les advierto de estas cosas, amados, porque sé de antemano que ustedes piensan así. No obstante, me adelanto a protegerlos de las fieras con forma humana: personas a quienes no solo deben negarse a recibir, sino, si es posible, ni siquiera encontrarse con ellas. Solo oren por ellas, por si de algún modo llegan a arrepentirse. Esto ciertamente es difícil, pero Jesucristo, nuestra verdadera vida, tiene poder para hacerlo.


    Porque, si nuestro Señor hizo estas cosas solo en apariencia,[a] entonces yo también estoy preso solo en apariencia. Y, en ese caso, ¿por qué me he entregado a la muerte, al fuego, a la espada y a las fieras? Pero cerca de la espada, cerca de Dios; entre las fieras, entre Dios. Que sea solamente en el nombre de Jesucristo, para que suframos junto con él.[b] Todo lo soporto porque él mismo me fortalece: el hombre perfecto.[c]'
  to: 'Pero les advierto estas cosas, amados, pues sé que ustedes también piensan así. Sin embargo, los prevengo de antemano contra las fieras con forma humana: personas a quienes no solo no deben recibir, sino, si es posible, ni siquiera encontrarse con ellas. Solo oren por ellas, por si acaso llegan a arrepentirse. Esto es ciertamente difícil, pero Jesucristo, nuestra verdadera vida, tiene poder para ello.


    Porque, si nuestro Señor hizo estas cosas solo en apariencia, también yo soy prisionero solo en apariencia. Entonces, ¿por qué me entregué a la muerte, al fuego, a la espada y a las fieras? Cerca de la espada, cerca de Dios; en medio de las fieras, en medio de Dios. Con tal que sea en el nombre de Jesucristo, soporto todo para padecer con él, pues él mismo, el hombre perfecto, me fortalece.'
  rationale: La revisión sigue el texto griego de la recensión media y el testigo inglés suministrado, corrigiendo los desplazamientos de persona, número y sintaxis. Se preserva la oposición entre realidad y mera apariencia sin etiquetarla doctrinalmente, así como el paralelismo enfático de las frases sobre espada, fieras y Dios. Se eliminan notas no imprescindibles, incluida una que dependía de un plural que el original no tiene.
