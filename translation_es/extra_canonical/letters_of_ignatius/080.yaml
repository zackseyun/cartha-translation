    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: es
  text: 'Pero les advierto estas cosas, amados, pues sé que ustedes también piensan así. Sin embargo, los prevengo de antemano contra las fieras con forma humana: personas a quienes no solo no deben recibir, sino, si es posible, ni siquiera encontrarse con ellas. Solo oren por ellas, por si acaso llegan a arrepentirse. Esto es ciertamente difícil, pero Jesucristo, nuestra verdadera vida, tiene poder para ello.


    Porque, si nuestro Señor hizo estas cosas solo en apariencia, también yo soy prisionero solo en apariencia. Entonces, ¿por qué me entregué a la muerte, al fuego, a la espada y a las fieras? Cerca de la espada, cerca de Dios; en medio de las fieras, en medio de Dios. Con tal que sea en el nombre de Jesucristo, soporto todo para padecer con él, pues él mismo, el hombre perfecto, me fortalece.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'wild beasts in human form (Greek tradition: θηρία ... ἀνθρωπόμορφα)'
  choice: fieras con forma humana
  rationale: Conserva la metáfora áspera y la referencia a la apariencia humana sin reducirla a una simple caracterización moral.
- source_word: 'in semblance / only in appearance (Greek tradition: τὸ δοκεῖν)'
  choice: solo en apariencia
  rationale: Expresa la oposición entre realidad y mera apariencia que estructura el argumento, sin añadir una etiqueta doctrinal posterior.
- source_word: 'in company with / among (Greek tradition: μεταξύ)'
  choice: entre
  rationale: 'Mantiene el paralelismo conciso: «entre las fieras, entre Dios», aunque la segunda frase resulte deliberadamente llamativa.'
- source_word: 'enableth / strengthens (Greek tradition: ἐνδυναμοῦντος)'
  choice: me fortalece
  rationale: Es una formulación natural y directa que conserva la acción capacitadora de Cristo.
- source_word: 'perfect Man (Greek tradition: τελείου ἀνθρώπου)'
  choice: el hombre perfecto
  rationale: Retiene la formulación cristológica concreta y la posible fuerza de «hombre» en este contexto, en vez de diluirla de manera silenciosa.
theological_decisions:
- issue: Realidad o mera apariencia de los sufrimientos del Señor
  choice: «hizo estas cosas solo en apariencia»
  alternative: «estas cosas le sucedieron aparentemente»
  rationale: La redacción escogida sigue el testimonio suministrado y conserva el razonamiento antiaparentista sin especificar más de lo que dice el pasaje.
- issue: Participación del autor en el sufrimiento de Cristo
  choice: «para que suframos junto con él»
  alternative: «para compartir su sufrimiento»
  rationale: Conserva el plural inclusivo del testimonio consultado y la idea de sufrimiento compartido, sin definir una teoría de esa participación.
- issue: Descripción de Cristo como «hombre perfecto»
  choice: «el hombre perfecto»
  alternative: «el ser humano perfecto»
  rationale: Se conserva la formulación tradicional y su tensión cristológica; la alternativa inclusiva se registra en nota sin imponerla en el cuerpo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se conserva la retórica breve y paralela del pasaje. El borrador se ha contrastado con las formas griegas de la tradición media identificables para este pasaje, pero, dado que el expediente suministrado declara pendiente la revisión directa de la fuente griega, las decisiones se mantienen deliberadamente cautelosas.
