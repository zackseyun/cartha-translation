  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: es
  text: Ignacio, llamado también Teóforo,[a] a la iglesia de Dios Padre y del Señor Jesucristo que está en Filadelfia de Asia, iglesia que ha recibido misericordia, está firmemente establecida en la concordia de Dios, se alegra sin vacilar en la pasión de nuestro Señor y está plenamente convencida de su resurrección, en toda misericordia. La saludo en la sangre de Jesucristo. Ella es gozo eterno y duradero, sobre todo si sus miembros permanecen unidos con el obispo, con los presbíteros que están con él y con los diáconos designados conforme al sentir de Jesucristo. A estos, según su propia voluntad, él los confirmó y afianzó por medio de su Espíritu Santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Teóforo» puede entenderse como «portador de Dios» o «llevado por Dios».
    reason: Aclara el sobrenombre griego sin imponer en el texto principal una sola interpretación.
  - marker: b
    text: La traducción de este prólogo se ha cotejado con la evidencia griega accesible de la recensión media, pero la ficha de la fuente indica que la revisión formal directa del griego aún está pendiente.
    reason: Hace transparente el carácter provisional de algunos detalles sintácticos y léxicos.
lexical_decisions:
- source_word: 'Theophorus (Greek: Θεοφόρος, reflected in the supplied witness)'
  choice: Teóforo
  rationale: Se conserva como sobrenombre tradicional de Ignacio, en vez de incorporar al texto una sola interpretación de su sentido.
- source_word: 'concord (Greek tradition: ὁμόνοια)'
  choice: concordia
  rationale: Mantiene la idea de armonía y unidad de propósito con un registro digno y comprensible.
- source_word: 'passion (Greek tradition: πάθος)'
  choice: pasión
  rationale: Es el término cristiano tradicional para los padecimientos y la muerte de Jesús; evita reducirlo solamente a la muerte.
- source_word: 'presbyters (Greek tradition: πρεσβύτεροι)'
  choice: presbíteros
  rationale: Conserva el término histórico del orden eclesial sin sustituirlo por una denominación moderna potencialmente sectaria.
- source_word: 'mind (Greek tradition: γνώμη)'
  choice: sentir
  rationale: Expresa orientación, intención o parecer, sin limitar el término a la facultad intelectual.
- source_word: confirmed and established
  choice: confirmó y afianzó
  rationale: Reproduce la pareja verbal y su énfasis en estabilidad sin sonar mecánico en español.
theological_decisions:
- issue: Referente de «Ella es gozo eterno y duradero»
  choice: Se refiere explícitamente a la iglesia.
  alternative: Entender que la sangre de Jesucristo es el gozo eterno y duradero.
  rationale: En la tradición griega, el pronombre relativo correspondiente es femenino y concuerda naturalmente con «iglesia», mientras que «sangre» es neutro en griego. La formulación evita trasladar al español la ambigüedad creada por el testimonio inglés.
- issue: Alcance de «a estos»
  choice: Se mantiene un referente colectivo que puede abarcar a los ministros eclesiales recién mencionados.
  alternative: Restringirlo solo a los diáconos o explicitar que incluye al obispo, los presbíteros y los diáconos.
  rationale: El plural masculino permite una referencia colectiva, pero la información suministrada no justifica resolver de manera más estrecha el alcance preciso.
- issue: Agente de «confirmó y afianzó»
  choice: El pronombre «él» queda sin nombre expreso, como en la construcción recibida.
  alternative: Explicitar «Jesucristo» o «Dios».
  rationale: La proximidad favorece a Jesucristo, pero explicitar el nombre eliminaría una posible tensión sintáctica antes de completar la revisión directa del griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos históricos «obispo», «presbíteros» y «diáconos». La larga salutación se dividió en varias oraciones para facilitar la lectura sin borrar sus relaciones lógicas. Se evitó modernizar «pasión» como mera «muerte» y se hizo explícito el referente gramatical de la iglesia donde la evidencia griega lo permite.
