review_pass:
  verdict: revise
  source_fidelity: Se requiere corrección. El borrador desplaza «sin vacilar» para que califique solo «la pasión» y convierte «plenamente asegurada en toda misericordia» en una convicción específicamente «de su resurrección». El testigo inglés, y la sintaxis griega tradicional indicada, mantienen la pasión y la resurrección como ámbitos coordinados del gozo y conservan separada la afirmación de plena seguridad «en toda misericordia». Además, el relativo plural final se refiere de manera inmediata a los diáconos designados, no de forma segura a todos los ministros mencionados.
  naturalness: El español es generalmente natural y de registro apropiado. La revisión propone una sintaxis más transparente para la salutación extensa sin añadir «sus miembros» ni resolver indebidamente referentes que el texto no desarrolla.
  terminology: Se mantienen «Teóforo», «concordia», «pasión», «obispo», «presbíteros» y «diáconos». Se elimina «Señor» de «Dios Padre y del Señor Jesucristo», pues el texto de la dirección solo nombra «Dios Padre y Jesucristo»; «nuestro Señor» se conserva donde sí aparece en la cláusula posterior.
  issues:
  - severity: high
    issue: Reordenación y restricción del alcance de «sin vacilar» y de «plenamente convencida».
    rationale: '«Se alegra sin vacilar en la pasión ... y está plenamente convencida de su resurrección» no reproduce adecuadamente la coordinación del original/testigo: el gozo se relaciona con la pasión y la resurrección, mientras que la plena seguridad se expresa en relación con «toda misericordia».'
  - severity: high
    issue: Referente ampliado de «A estos».
    rationale: Tras «los diáconos designados», el relativo plural del original y el «whom» del testigo inglés se refieren naturalmente a los diáconos. Presentarlo como colectivo de obispo, presbíteros y diáconos añade una ambigüedad que no está justificada.
  - severity: medium
    issue: Adición de «Señor» en la dirección inicial.
    rationale: La fuente dice «God the Father and ... Jesus Christ»; el título «Lord» aparece después, en «the passion of our Lord». Conviene no armonizar ambas expresiones.
  - severity: low
    issue: Nota b afirma un cotejo griego formal incompatible con los metadatos de la fuente.
    rationale: La ficha dice que la revisión directa del griego está pendiente. La nota además no aclara un punto textual concreto para el lector; debe suprimirse.
  revised_text: Ignacio, llamado también Teóforo,[a] a la iglesia de Dios Padre y de Jesucristo, que está en Filadelfia de Asia, que ha recibido misericordia y está firmemente establecida en la concordia de Dios, que se alegra en la pasión de nuestro Señor y en su resurrección sin vacilar, plenamente asegurada en toda misericordia. Saludo a esta iglesia en la sangre de Jesucristo, que es gozo eterno y perdurable, especialmente si están unidos con el obispo, con los presbíteros que están con él y con los diáconos designados conforme al sentir de Jesucristo, a quienes él confirmó y estableció firmemente, según su propia voluntad, por medio de su Espíritu Santo.
  revised_footnotes:
  - marker: a
    text: «Teóforo» puede entenderse como «portador de Dios» o «llevado por Dios».
    reason: Aclara el sobrenombre griego sin imponer una sola interpretación en el texto principal.
  revision_rationale: La versión revisada conserva la estructura encomiástica y los términos eclesiales históricos, pero restituye la coordinación de pasión y resurrección, evita convertir «toda misericordia» en un modificador de la resurrección y hace que el relativo final tenga como antecedente inmediato a los diáconos. «Esta iglesia» explicita de modo natural el antecedente femenino de la cláusula sobre el gozo, sin atribuir ese gozo a la sangre. Se suprime la nota metodológica provisional por ser inexacta según la propia ficha de fuente.
