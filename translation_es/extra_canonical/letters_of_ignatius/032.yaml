revisions:
- from: 'Así pues, si los que habían vivido conforme a las antiguas prácticas alcanzaron una esperanza nueva y ya no guardaban los sábados, sino que vivían conforme al día del Señor —día en que también surgió nuestra vida por medio de él y de su muerte, aunque algunos la niegan—, misterio por el cual llegamos a creer y por el cual soportamos todo con paciencia, a fin de ser hallados discípulos de Jesucristo, nuestro único maestro,


    si esto es así, ¿cómo podremos vivir separados de él? Pues aun los profetas, por ser discípulos suyos, lo esperaban como maestro mediante el Espíritu. Por eso, aquel a quien esperaban con razón, cuando vino, los levantó de entre los muertos.[a]'
  to: 'Así pues, si los que habían vivido conforme a las antiguas prácticas llegaron a una esperanza nueva, ya no guardando los sábados, sino viviendo conforme al día del Señor —día en que también nuestra vida surgió por medio de él y de su muerte, lo cual algunos niegan—, misterio por medio del cual llegamos a creer, y por esta razón soportamos pacientemente, a fin de ser hallados discípulos de Jesucristo, nuestro único maestro,


    si esto es así, ¿cómo podremos vivir separados de él? Pues incluso los profetas, siendo discípulos suyos, lo esperaban como a su maestro mediante el Espíritu. Por eso, aquel a quien esperaban con razón, cuando llegó, los levantó de entre los muertos.'
  rationale: Se conserva la estructura argumentativa, el contraste entre la práctica sabática y vivir conforme al día del Señor, y la densidad teológica del pasaje. Se corrige el valor causal de la frase sobre soportar pacientemente, se elimina una nota ya innecesaria tras cotejar la cláusula final con el griego de la recensión media, y se evita limitar artificialmente el alcance de «lo cual algunos niegan».
