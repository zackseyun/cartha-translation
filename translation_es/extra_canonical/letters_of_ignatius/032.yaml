base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: es
  text: 'Así pues, si los que habían vivido conforme a las antiguas prácticas llegaron a una esperanza nueva, ya no guardando los sábados, sino viviendo conforme al día del Señor —día en que también nuestra vida surgió por medio de él y de su muerte, lo cual algunos niegan—, misterio por medio del cual llegamos a creer, y por esta razón soportamos pacientemente, a fin de ser hallados discípulos de Jesucristo, nuestro único maestro,


    si esto es así, ¿cómo podremos vivir separados de él? Pues incluso los profetas, siendo discípulos suyos, lo esperaban como a su maestro mediante el Espíritu. Por eso, aquel a quien esperaban con razón, cuando llegó, los levantó de entre los muertos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ancient practices
  choice: las antiguas prácticas
  rationale: Conserva la amplitud del testimonio disponible sin reducir la expresión a una sola costumbre o sistema religioso.
- source_word: observing Sabbaths
  choice: guardaban los sábados
  rationale: «Guardar el sábado» es una expresión natural y reconocible en español bíblico; el plural refleja el testimonio inglés y puede aludir a la observancia sabática habitual.
- source_word: fashioning their lives after the Lord's day
  choice: vivían conforme al día del Señor
  rationale: Comunica orientación de vida, no una mera observancia calendárica, y conserva «día del Señor» sin imponer una interpretación adicional.
- source_word: newness of hope
  choice: una esperanza nueva
  rationale: Expresa en español natural la renovación de la esperanza sin convertirla en una doctrina técnica.
- source_word: teacher
  choice: maestro
  rationale: Es el equivalente claro y digno en este contexto de discipulado.
- source_word: raised them from the dead
  choice: los levantó de entre los muertos
  rationale: Mantiene la imagen de levantar y deja visible la afirmación sobre los profetas fallecidos.
theological_decisions:
- issue: Relación entre el sábado y el día del Señor
  choice: Se conserva el contraste explícito entre dejar de guardar los sábados y vivir conforme al día del Señor.
  alternative: Interpretar el pasaje como una sustitución litúrgica formal del sábado por el domingo.
  rationale: El testimonio afirma un contraste, pero la traducción no debe añadir una formulación eclesiológica o denominacional más precisa de la que ofrece el texto.
- issue: Referencia de «nuestra vida también surgió»
  choice: Se vincula al día del Señor y a la acción de Cristo y su muerte, manteniendo la compleja sintaxis.
  alternative: Explicitar que se trata exclusivamente de la resurrección de Cristo ocurrida el domingo.
  rationale: Aunque esa lectura es probable, el testimonio disponible presenta una formulación densa; conviene no resolver por paráfrasis todos sus nexos teológicos.
- issue: Cláusula final corrupta o poco clara
  choice: «cuando vino, los levantó de entre los muertos», con nota textual.
  alternative: Conservar literalmente el ininteligible «cuando él uno» del testimonio inglés.
  rationale: La lectura «cuando vino» corresponde a una reconstrucción ampliamente atestiguada del sentido de la frase, pero debe marcarse como provisional porque la revisión directa del griego está pendiente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen la oración extensa, la argumentación exhortativa y la tensión teológica del pasaje, pero con puntuación que facilita la lectura. Debido a que la revisión directa del griego está pendiente, el borrador depende críticamente del testimonio público de Lightfoot y señala la principal corrupción o errata aparente.
