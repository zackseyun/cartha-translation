revisions:
- from: 'No dejes que te desconcierten quienes parecen convincentes, pero enseñan doctrinas extrañas. Mantente firme, como el yunque cuando lo golpean. Al gran atleta le corresponde recibir golpes y vencer. Pero, sobre todo, debemos soportarlo todo por causa de Dios, para que él también nos soporte a nosotros.[a]


    Sé aún más diligente de lo que eres. Discierne los tiempos.[b] Espera al que está por encima de todo tiempo: el Eterno, el Invisible que se hizo visible por nosotros; el Intangible, incapaz de sufrir, que sufrió por nosotros; el que todo lo soportó por nosotros.'
  to: 'No dejes que te desconcierten quienes parecen convincentes, pero enseñan doctrinas extrañas. Mantente firme, como el yunque cuando lo golpean. Es propio de un gran atleta recibir golpes y vencer. Sobre todo, debemos soportarlo todo por causa de Dios, para que él también nos soporte a nosotros.[a]



    Sé aún más diligente de lo que eres. Discierne los tiempos.[b] Espera al que está por encima de todo tiempo: el Eterno, el Invisible que se hizo visible por nosotros; el Intangible, incapaz de sufrir, que sufrió por nosotros; el que soportó de todas las maneras por nosotros.'
  rationale: Se aplican correcciones limitadas para evitar un contraste añadido, mantener el carácter genérico de la comparación atlética y conservar el alcance de «en todas las maneras». Se mantienen tanto la repetición de «por nosotros» como la formulación paradójica relativa al que no puede sufrir y sufrió, sin explicación doctrinal añadida.
