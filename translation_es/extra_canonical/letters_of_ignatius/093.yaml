base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: es
  text: 'No dejes que te desconcierten quienes parecen convincentes, pero enseñan doctrinas extrañas. Mantente firme, como el yunque cuando lo golpean. Es propio de un gran atleta recibir golpes y vencer. Sobre todo, debemos soportarlo todo por causa de Dios, para que él también nos soporte a nosotros.[a]



    Sé aún más diligente de lo que eres. Discierne los tiempos.[b] Espera al que está por encima de todo tiempo: el Eterno, el Invisible que se hizo visible por nosotros; el Intangible, incapaz de sufrir, que sufrió por nosotros; el que soportó de todas las maneras por nosotros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «para que él también nos soporte a nosotros» reproduce una formulación difícil del testimonio, que también podría entenderse como «para que él también tenga paciencia con nosotros».
    reason: Preserva la ambigüedad y la tensión del enunciado sin normalizarlo silenciosamente.
  - marker: b
    text: 'También podría traducirse: «Presta atención a los tiempos» o «Observa las circunstancias».'
    reason: La expresión admite un matiz de observación, reconocimiento o discernimiento de los tiempos.
lexical_decisions:
- source_word: seem to be plausible
  choice: parecen convincentes
  rationale: Conserva el contraste entre una apariencia persuasiva y la enseñanza extraña sin afirmar que realmente tengan razón.
- source_word: strange doctrine
  choice: doctrinas extrañas
  rationale: Mantiene el sentido de enseñanzas ajenas o impropias sin añadir una clasificación doctrinal posterior.
- source_word: anvil
  choice: yunque
  rationale: Retiene la imagen concreta de resistencia bajo los golpes.
- source_word: Mark the seasons
  choice: Discierne los tiempos
  rationale: Expresa atención cuidadosa y comprensión de las circunstancias; «tiempos» conserva la amplitud del término transmitido.
- source_word: Impalpable
  choice: Intangible
  rationale: Es natural en español actual y conserva la afirmación de que no puede ser tocado o percibido físicamente.
- source_word: Impassible
  choice: incapaz de sufrir
  rationale: Comunica en lenguaje accesible el sentido clásico sin depender del tecnicismo ambiguo «impasible».
- source_word: endured in all ways
  choice: todo lo soportó
  rationale: Produce una frase natural sin restringir el alcance general de la expresión.
theological_decisions:
- issue: «that He also may endure us»
  choice: para que él también nos soporte a nosotros
  alternative: para que él también tenga paciencia con nosotros
  rationale: Se conserva la formulación difícil y la repetición de «soportar», sin suavizar la aparente tensión teológica.
- issue: La paradoja del que es incapaz de sufrir y, sin embargo, sufrió
  choice: el Intangible, incapaz de sufrir, que sufrió por nosotros
  alternative: el que no está sujeto al sufrimiento, pero sufrió por nosotros
  rationale: Mantiene deliberadamente la paradoja cristológica del testimonio en vez de explicarla o resolverla.
- issue: Identidad del esperado
  choice: Espera al que está por encima de todo tiempo
  alternative: Espera a Aquel que está por encima de todos los tiempos
  rationale: No se añade un nombre ni una identificación explícita ausente del testimonio, aunque el contexto cristológico sea evidente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa tuteo singular porque la exhortación está dirigida personalmente a Policarpo. La redacción conserva las imágenes atléticas, la repetición de «por nosotros» y las paradojas teológicas. Dado que la revisión directa del griego está pendiente, las decisiones se basan provisionalmente en el testimonio inglés público suministrado y se señalan los lugares de especial incertidumbre.
