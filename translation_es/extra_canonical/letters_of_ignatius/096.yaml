review_pass:
  verdict: revise
  source_fidelity: La estructura y las imágenes se siguen fielmente conforme al testimonio inglés suministrado. Sin embargo, «Me entrego por» no expresa «I am devoted to» (gr. ἀντίψυχον εἰμί, fórmula intensa de entrega/garantía personal), y «descansen» atenúa indebidamente «lie down» dentro de la secuencia militar de morir y resucitar. «Asesores» es posible, pero en esta tríada el sentido es más cercano a «asistentes» o «colaboradores». La revisión directa del griego sigue pendiente según el contexto.
  naturalness: El español es generalmente claro y de registro digno. «Compartir con ellos mi porción» es algo forzado; «tener parte con ellos» conserva mejor el giro. «Sean pacientes unos con otros con mansedumbre» duplica de modo poco natural el complemento; «Ténganse paciencia unos a otros con mansedumbre» es más idiomático. «Capitán» puede conservarse como título metafórico, pero «jefe militar» no sería necesario.
  terminology: Se mantienen correctamente «obispo», «presbíteros» y «diáconos». «Casco» y «armadura» son adecuados. Para μακροθυμία en la exhortación final, «tengan paciencia» comunica mejor el sentido relacional que «sean pacientes». Se preserva la metáfora financiera en «depósitos» y «lo que les corresponde», sin convertirla en una tesis doctrinal.
  issues:
  - severity: medium
    issue: «Me entrego por aquellos»
    rationale: El inglés auditado dice «I am devoted to those», no «me entrego por». Aunque el griego probablemente contiene una fórmula más vigorosa, con la evidencia disponible la redacción introduce una relación vicaria que el testimonio inglés no formula. «Estoy dispuesto a dar mi vida por...» expresa la intensidad tradicionalmente asociada al griego, pero requiere cotejo griego; «Estoy dedicado a...» es seguro respecto del puente inglés.
  - severity: medium
    issue: «descansen juntos» por «lie down together»
    rationale: «Descansar» puede sugerir reposo ordinario y pierde el contraste retórico con «levántense juntos». «Acuéstense juntos» conserva la imagen literal y permite percibir la posible alusión a muerte y resurrección sin imponerla.
  - severity: low
    issue: «asesores» por «assessors»
    rationale: En español actual, «asesores» suele evocar consejo profesional. «Asistentes» es más amplio y se ajusta mejor a la función subordinada indicada por la tríada, aunque el matiz técnico debe confirmarse en griego.
  - severity: low
    issue: «compartir con ellos mi porción»
    rationale: Es comprensible, pero menos natural que «tener parte con ellos», que también reproduce la imagen de participación o porción.
  - severity: low
    issue: Exhortación final sobre long-suffering
    rationale: «Ténganse paciencia unos a otros con mansedumbre» expresa con mayor naturalidad la paciencia mutua y la actitud apacible del texto.
  revised_text: 'Presten atención al obispo, para que Dios también les preste atención a ustedes. Estoy dedicado a quienes están sujetos al obispo, a los presbíteros y a los diáconos. Que se me conceda tener parte con ellos en la presencia de Dios. Trabajen juntos, luchen juntos, corran juntos, sufran juntos, acuéstense juntos y levántense juntos, como administradores, asistentes y servidores de Dios.


    Agradad al Capitán bajo cuyas órdenes sirven y de quien también recibirán su paga. Que ninguno de ustedes sea hallado desertor. Que su bautismo permanezca con ustedes como escudo; su fe, como casco; su amor, como lanza; su perseverancia, como armadura. Que sus obras sean sus depósitos, para que reciban lo que les corresponde. Ténganse paciencia unos a otros con mansedumbre, como Dios la tiene con ustedes. Que siempre pueda alegrarme por ustedes.'
  revised_footnotes: []
  revision_rationale: Se corrigen giros que introducían sentidos no respaldados con seguridad por el testimonio inglés o que debilitaban imágenes retóricas importantes. La revisión conserva los términos ministeriales históricos, la metáfora militar y la financiera, y no resuelve doctrinalmente las alusiones a obediencia, mérito o muerte y resurrección. Dado que el propio expediente declara pendiente la revisión griega, «Estoy dedicado a» se prefiere como equivalente seguro del puente inglés; una posible nota futura podrá registrar y evaluar la mayor intensidad de la fórmula griega una vez cotejada la tradición textual.
