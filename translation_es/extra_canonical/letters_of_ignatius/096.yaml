review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones para reflejar mejor el griego de la recensión media: ἀντίψυχον expresa una garantía personal extrema («respondo con mi vida»); τὸ βάπτισμα... ὡς ὅπλα habla de armas en plural; y la imagen de τὰ δεπόσιτα y τὰ ἀξιώματα debe conservarse sin introducir el comparativo «como». También se conserva la referencia no explicitada al superior militar, en vez de convertirla en un título interpretativo.'
  naturalness: El texto revisado mantiene un español latinoamericano actual, sobrio y público. «Militan» y «paga» sostienen naturalmente la metáfora militar; «armadura completa» comunica con claridad πανoπλία. La serie de imperativos conserva su cadencia.
  terminology: Se mantienen «obispo», «presbíteros» y «diáconos» como designaciones históricas diferenciadas. «Administradores, asistentes y servidores» reproduce de manera accesible οἰκονόμοι, πάρεδροι y ὑπηρέται sin imponer una estructura eclesial posterior. «Perseverancia» es apropiado para ὑπομονή, mientras que «tengan paciencia» traduce el posterior μακροθυμεῖτε.
  issues:
  - severity: high
    issue: «Me entrego por aquellos» atenúa ἀντίψυχον.
    rationale: El término expresa responder o ponerse como garantía con la propia vida por alguien; no es una entrega genérica.
  - severity: medium
    issue: «como su escudo» no refleja el plural ὅπλα.
    rationale: El griego presenta el bautismo como «armas», antes de especificar casco, lanza y armadura.
  - severity: medium
    issue: «Que sus obras sean como depósitos» añade una comparación ausente.
    rationale: El texto identifica las obras con los depósitos; la formulación revisada conserva directamente la metáfora financiera.
  - severity: low
    issue: «Capitán» convierte en título explícito lo que el griego deja como pronombre relativo.
    rationale: «Aquel bajo cuyo mando sirven como soldados» preserva la imagen y evita precisar de más el referente.
  revised_text: 'Presten atención al obispo, para que también Dios les preste atención a ustedes. Yo respondo con mi vida por quienes están sujetos al obispo, a los presbíteros y a los diáconos. Que se me conceda tener parte con ellos ante Dios. Trabajen juntos, combatan juntos, corran juntos, sufran juntos, descansen juntos y levántense juntos, como administradores, asistentes y servidores de Dios.



    Procuren agradar a aquel bajo cuyo mando sirven como soldados, de quien también recibirán su paga. Que ninguno de ustedes sea hallado desertor. Que su bautismo les sirva de armas; su fe, de casco; su amor, de lanza; y su perseverancia, de armadura completa. Que sus obras sean sus depósitos, para que reciban las cantidades que les corresponden. Tengan, pues, paciencia unos con otros, con mansedumbre, como también Dios la tiene con ustedes. Que siempre pueda alegrarme por ustedes.'
  revised_footnotes: []
  revision_rationale: La revisión sigue el texto griego disponible de IgnPol. 6 y verifica a la vez los principales elementos del testimonio inglés. Se ajustaron las imágenes de garantía personal, armamento y depósito/retribución; no se añadieron explicaciones doctrinales ni se determinó el referente del superior militar. No se requieren notas para que el pasaje sea inteligible en esta traducción.
