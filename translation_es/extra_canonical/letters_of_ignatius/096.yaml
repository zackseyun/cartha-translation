  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: es
  text: 'Presten atención al obispo, para que también Dios les preste atención a ustedes. Yo respondo con mi vida por quienes están sujetos al obispo, a los presbíteros y a los diáconos. Que se me conceda tener parte con ellos ante Dios. Trabajen juntos, combatan juntos, corran juntos, sufran juntos, descansen juntos y levántense juntos, como administradores, asistentes y servidores de Dios.



    Procuren agradar a aquel bajo cuyo mando sirven como soldados, de quien también recibirán su paga. Que ninguno de ustedes sea hallado desertor. Que su bautismo les sirva de armas; su fe, de casco; su amor, de lanza; y su perseverancia, de armadura completa. Que sus obras sean sus depósitos, para que reciban las cantidades que les corresponden. Tengan, pues, paciencia unos con otros, con mansedumbre, como también Dios la tiene con ustedes. Que siempre pueda alegrarme por ustedes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bishop
  choice: obispo
  rationale: Es el equivalente histórico y eclesial directo, comprensible en español actual.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva la distinción del testimonio entre el obispo, los presbíteros y los diáconos sin sustituirla por un término denominacional moderno.
- source_word: assessors
  choice: asesores
  rationale: Mantiene la idea de colaboradores que asisten en la deliberación o administración, aunque la revisión directa del griego sigue pendiente.
- source_word: Captain
  choice: Capitán
  rationale: Conserva la metáfora militar y la personificación del superior bajo cuyas órdenes sirven.
- source_word: patience
  choice: perseverancia
  rationale: Dentro de la imagen de la armadura, expresa resistencia firme y sostenida mejor que la mera espera pasiva.
- source_word: deposits
  choice: depósitos
  rationale: Preserva la metáfora financiera que enlaza las obras presentes con lo que se recibirá después.
- source_word: long-suffering
  choice: pacientes
  rationale: Comunica en español natural la disposición a soportarse mutuamente sin represalias.
theological_decisions:
- issue: Relación entre atender al obispo y la atención de Dios
  choice: «para que Dios también les preste atención»
  alternative: «para que Dios también los atienda»
  rationale: Se conserva el paralelismo exhortativo y su tensión teológica sin explicarlo como mérito, condición sacramental o garantía automática.
- issue: Lenguaje de recompensa por las obras
  choice: «Que sus obras sean como depósitos, para que reciban lo que se les debe»
  alternative: «Depositen sus obras para recibir el capital correspondiente»
  rationale: Mantiene la imagen retributiva del testimonio sin convertirla en una formulación doctrinal más precisa de lo que permite la fuente disponible.
- issue: Entrega personal del autor por los subordinados al ministerio ordenado
  choice: «Me entrego por aquellos»
  alternative: «Soy rescate por aquellos»
  rationale: La traducción evita afirmar técnicamente una expiación vicaria, pero conserva el tono intenso de devoción personal; la lectura deberá verificarse directamente en griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las series retóricas, las metáforas militar y financiera, y los títulos ministeriales históricos. Borrador necesariamente provisional porque el material suministrado identifica el testimonio inglés de J. B. Lightfoot como base de redacción y señala que la revisión directa de la tradición griega de recensión media sigue pendiente.
