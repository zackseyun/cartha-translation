base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: es
  text: 'Por tanto, manténganse en guardia contra tales personas. Y esto será ciertamente así si no se llenan de orgullo y permanecen inseparables de [Dios] Jesucristo, del obispo y de las ordenanzas de los apóstoles.[a]


    El que está dentro del santuario es puro; pero el que está fuera del santuario no es puro. Es decir, el que hace algo sin el obispo, el presbiterio y los diáconos no tiene limpia la conciencia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La palabra «[Dios]» se mantiene entre corchetes porque así aparece señalada en el testimonio utilizado; la revisión directa de la tradición manuscrita griega está pendiente.
    reason: Advertir con transparencia la incertidumbre textual y la base provisional de la traducción.
  - marker: b
    text: «Presbiterio» se refiere aquí al conjunto de los presbíteros o ancianos, no a un edificio.
    reason: Evitar una posible confusión léxica en el español moderno.
lexical_decisions:
- source_word: be ye on your guard
  choice: manténganse en guardia
  rationale: Conserva la exhortación imperativa en plural con una expresión natural y digna en español latinoamericano.
- source_word: puffed up
  choice: se llenan de orgullo
  rationale: Comunica con claridad la imagen de engreimiento sin recurrir al menos natural «se inflan».
- source_word: ordinances
  choice: ordenanzas
  rationale: Mantiene el carácter normativo del término del testimonio, sin precisar indebidamente si se trata de mandatos, disposiciones o prácticas establecidas.
- source_word: sanctuary
  choice: santuario
  rationale: Preserva la metáfora cultual y su contraste entre estar dentro y fuera.
- source_word: clean
  choice: puro / limpia
  rationale: «Puro» conserva el sentido cultual en la metáfora; «limpia la conciencia» resulta idiomático y mantiene la aplicación moral.
- source_word: presbytery
  choice: presbiterio
  rationale: Designa aquí al cuerpo de presbíteros, no al edificio; se conserva el término histórico e institucional.
theological_decisions:
- issue: Lectura entre corchetes «[God] Jesus Christ»
  choice: '[Dios] Jesucristo'
  alternative: Jesucristo
  rationale: Se preserva la señal textual del testimonio suministrado y no se resuelve una variante cuya revisión directa del griego está pendiente.
- issue: Alcance de «sin el obispo, el presbiterio y los diáconos»
  choice: Traducción directa sin explicación doctrinal adicional
  alternative: Interpretarlo como una prohibición absoluta de toda acción privada o como referencia exclusiva al culto
  rationale: El pasaje no especifica aquí el alcance exacto; la traducción conserva la tensión eclesial sin importar una interpretación denominacional.
- issue: Metáfora de pureza cultual
  choice: Conservar «santuario» y «puro»
  alternative: Parafrasear como pertenecer o no pertenecer legítimamente a la comunidad
  rationale: La formulación figurada es teológicamente significativa y no debe reemplazarse por una interpretación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa el plural «ustedes» implícito en las formas verbales. El borrador es necesariamente provisional porque el material proporcionado es un testimonio inglés de dominio público y la revisión directa del griego de la recensión media está pendiente.
