base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: es
  text: 'Estoy entregado por ustedes y por aquellos a quienes enviaron a Esmirna para honra de Dios. Desde allí también les escribo, dando gracias al Señor y amando a Policarpo como también los amo a ustedes. Acuérdense de mí, así como deseo que Jesucristo también se acuerde de ustedes.


    Oren por la iglesia que está en Siria, desde donde soy llevado preso a Roma, yo, que soy el último de los fieles de allí, pues fui considerado digno de ser hallado para honra de Dios.[a] Que estén bien en Dios Padre y en Jesucristo, nuestra esperanza común.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La redacción de esta frase es provisional. También podría entenderse: «según fui considerado digno de ser hallado para honra de Dios». La revisión directa del texto griego aún está pendiente.'
    reason: La fuente suministrada es un testimonio inglés de dominio público y la sintaxis de la cláusula final admite más de una relación precisa.
lexical_decisions:
- source_word: I am devoted to you
  choice: Estoy entregado por ustedes
  rationale: Expresa dedicación personal intensa en español actual sin introducir una formulación confesional específica; la base disponible es el testimonio inglés, pues la revisión directa del griego está pendiente.
- source_word: Remember me
  choice: Acuérdense de mí
  rationale: Conserva el sentido directo de recordar o tener presente, sin reinterpretarlo como una petición litúrgica más específica.
- source_word: the very last of the faithful there
  choice: el último de los fieles de allí
  rationale: Mantiene la autohumillación y el posible sentido de rango o indignidad sin ampliarlo.
- source_word: our common hope
  choice: nuestra esperanza común
  rationale: Conserva la afirmación cristológica y el carácter compartido de la esperanza.
theological_decisions:
- issue: Jesucristo como quien recuerda al creyente
  choice: que Jesucristo también se acuerde de ustedes
  alternative: que Jesucristo también los tenga presentes
  rationale: La formulación conserva el paralelismo y la tensión teológica del testimonio, sin explicar de qué manera Cristo «recuerda».
- issue: Ser considerado digno para honra de Dios
  choice: fui considerado digno de ser hallado para honra de Dios
  alternative: fui tenido por digno de alcanzar la honra de Dios
  rationale: Se evita convertir ambiguamente «para honra de Dios» en una honra recibida por Ignacio; se preserva la orientación hacia la honra divina.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conserva el tono epistolar. Borrador provisional basado en el testimonio inglés de J. B. Lightfoot; hace falta cotejo directo con la tradición manuscrita griega de la recensión media.
