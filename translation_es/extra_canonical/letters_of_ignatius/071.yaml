base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: es
  text: 'Porque, aunque algunos quisieron engañarme según la carne, el Espíritu no puede ser engañado, pues procede de Dios. Él sabe de dónde viene y adónde va, y pone al descubierto las cosas ocultas. Cuando estaba entre ustedes, grité y hablé en voz alta, con voz de Dios: «Presten atención al obispo, al consejo de ancianos[a] y a los diáconos».


    Sin embargo, algunos sospecharon que dije esto porque conocía de antemano la división de ciertas personas. Pero aquel en quien estoy encadenado es mi testigo de que no lo supe por medio de carne humana. Fue el Espíritu quien proclamó lo siguiente: «No hagan nada sin el obispo. Conserven su carne como templo de Dios. Amen la unidad. Huyan de las divisiones. Sean imitadores de Jesucristo, así como él mismo lo es de su Padre».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «al presbiterio», es decir, al cuerpo o consejo de ancianos.
    reason: Aclara el término institucional griego y conserva su forma tradicional para consulta.
lexical_decisions:
- source_word: πνεῦμα (reflejado por “spirit” en el testimonio inglés)
  choice: el Espíritu
  rationale: El contexto atribuye origen divino, conocimiento y proclamación al Espíritu; la mayúscula comunica esa referencia probable sin añadir una identificación trinitaria más específica.
- source_word: πρεσβυτέριον
  choice: consejo de ancianos
  rationale: Expresa naturalmente el sentido colectivo del cuerpo de presbíteros y evita que «presbiterio» se entienda solo como un lugar físico.
- source_word: ἐλέγχει
  choice: pone al descubierto
  rationale: Conserva la idea de exponer o revelar lo oculto sin restringir el verbo a «investigar» ni añadir necesariamente el matiz de condenar.
- source_word: τηρεῖτε
  choice: conserven
  rationale: Representa la exhortación a guardar o cuidar la carne; evita que «mantengan pura» introduzca una especificación moral no expresa.
- source_word: ἕνωσις
  choice: unidad
  rationale: Es la forma natural en español para la unión comunitaria exhortada en contraste con las divisiones.
theological_decisions:
- issue: La afirmación «aquel en quien estoy encadenado»
  choice: aquel en quien estoy encadenado
  alternative: Cristo, por quien estoy encadenado
  rationale: Se conserva la referencia implícita del texto en vez de identificar expresamente a quien no se nombra en esta frase.
- issue: Relación entre Jesucristo y el Padre en la imitación
  choice: así como él mismo lo es de su Padre
  alternative: así como él mismo imitó a su Padre
  rationale: La formulación conserva la afirmación paralela y su tensión teológica, sin explicar en qué sentido Cristo es imitador del Padre.
- issue: «Con voz de Dios»
  choice: con voz de Dios
  alternative: como portavoz de Dios
  rationale: Mantiene la expresión fuerte y ambigua del testimonio, sin convertirla en una explicación interpretativa de inspiración.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» en las exhortaciones plurales. La puntuación distingue la narración de las palabras proclamadas. Aunque el expediente indica que la revisión directa del griego sigue pendiente, el borrador toma en cuenta las formas griegas comúnmente atestiguadas en la recensión media; deberá cotejarse formalmente con una edición crítica antes de publicación.
