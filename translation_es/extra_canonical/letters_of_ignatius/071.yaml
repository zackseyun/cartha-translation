review_pass:
  verdict: revise
  source_fidelity: 'El borrador refleja bien la estructura y el sentido del pasaje: el Espíritu conoce, revela lo oculto y proclama las exhortaciones; se conservan los tres ministerios y las órdenes comunitarias. Sin embargo, «no puede ser engañado» intensifica indebidamente el presente pasivo («no es/se deja engañar»), y «así como él mismo lo es de su Padre» cambia la comparación de imitación, que es elíptica pero retrospectiva en el testimonio y debe expresarse como «lo fue».'
  naturalness: El español es mayormente claro, moderno y de registro digno. «No lo supe por medio de carne humana» resulta poco natural y debilita el verbo de aprendizaje/conocimiento; «no lo aprendí de carne humana» conserva deliberadamente el contraste retórico con el Espíritu y es más directo.
  terminology: «Obispo», «diáconos», «consejo de ancianos» y la nota sobre «presbiterio» son adecuados. La mayúscula en «Espíritu» es defendible por el contexto y se mantiene sin ampliar la identificación teológica. «Con voz de Dios» preserva la formulación enfática sin explicarla.
  issues:
  - severity: medium
    issue: «El Espíritu no puede ser engañado»
    rationale: La formulación modal «no puede» expresa imposibilidad, mientras que el texto transmite que el Espíritu no es engañado/no se deja engañar. Se ajusta para no intensificar la afirmación.
  - severity: medium
    issue: «Así como él mismo lo es de su Padre»
    rationale: La elipsis griega se refiere a Jesucristo como modelo de imitación respecto de su Padre. El presente «lo es» puede sugerir una afirmación distinta; «lo fue» conserva la comparación tal como la entiende el testimonio inglés sin desarrollar doctrina.
  - severity: low
    issue: «No lo supe por medio de carne humana»
    rationale: «ἔγνων» puede expresar conocer o aprender, pero en este contexto niega que la información procediera de una fuente humana. «No lo aprendí de carne humana» conserva el contraste textual y mejora la fluidez.
  revised_text: 'Porque, aunque algunos quisieron engañarme según la carne, el Espíritu no se deja engañar, pues procede de Dios. Él sabe de dónde viene y adónde va, y pone al descubierto las cosas ocultas. Cuando estaba entre ustedes, grité y hablé en voz alta, con voz de Dios: «Presten atención al obispo, al consejo de ancianos[a] y a los diáconos».


    Sin embargo, algunos sospecharon que dije esto porque conocía de antemano la división de ciertas personas. Pero aquel en quien estoy encadenado es mi testigo de que no lo aprendí de carne humana. Fue el Espíritu quien proclamó lo siguiente: «No hagan nada sin el obispo. Conserven su carne como templo de Dios. Amen la unidad. Huyan de las divisiones. Sean imitadores de Jesucristo, tal como él mismo lo fue de su Padre».'
  revised_footnotes:
  - marker: a
    text: Lit. «al presbiterio», es decir, al cuerpo o consejo de ancianos.
    reason: Aclara el término institucional griego y conserva su forma tradicional para consulta.
  revision_rationale: Se corrigen tres puntos puntuales para conservar el aspecto verbal y la comparación de imitación del texto, sin modificar la estructura, los términos institucionales ni la ambigüedad de «aquel en quien estoy encadenado». La nota conserva un ancla válida y continúa explicando «presbiterio».
