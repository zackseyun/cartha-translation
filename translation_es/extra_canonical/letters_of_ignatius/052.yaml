review_pass:
  verdict: revise
  source_fidelity: El borrador sigue de cerca el testimonio inglés. Conserva adecuadamente las expresiones deliberadamente tensas «como al mandamiento», «mi espíritu se ofrece» y «en Jesucristo». La restitución editorial [también] se mantiene visible. No obstante, «consejo de ancianos» interpreta el término técnico corporativo presbytery; «presbiterio» ofrece una correspondencia más directa y deja que el contexto determine su alcance.
  naturalness: El español es en general claro, actual y apto para un registro epistolar digno. «Que estén bien» es natural, pero «Despedíos» sería peninsular; por ello se conserva «Que estén bien». Se mejora «a los demás» por «unos a otros», que refleja de modo más preciso la reciprocidad del original sin perder naturalidad.
  terminology: Se conserva «obispo» para bishop y se revisa presbytery a «presbiterio», término histórico-eclesial establecido que designa aquí al cuerpo de presbíteros/ancianos, no un edificio. «Irreprochables» es adecuado para unblamable.
  issues:
  - severity: medium
    issue: «Consejo de ancianos» para «presbytery»
    rationale: Aunque comunica una posible función del grupo, explicita e interpreta un término técnico eclesial. «Presbiterio» es más formalmente equivalente y mantiene abierta la amplitud institucional exacta del referente antiguo.
  - severity: low
    issue: «A los demás» para «one another»
    rationale: La frase española puede abarcar a otras personas en general, mientras que el testimonio expresa reciprocidad mutua. «Unos a otros» conserva ese matiz.
  revised_text: 'El amor de los esmirniotas y de los efesios los saluda. Recuerden en sus oraciones a la iglesia que está en Siria, de la cual [también][a] yo no soy digno de ser llamado miembro, pues soy el último de ellos.


    Que estén bien en Jesucristo, sometiéndose al obispo como al mandamiento, y asimismo al presbiterio. Y que cada uno de ustedes ame a los otros con un corazón indiviso.


    Mi espíritu se ofrece por ustedes, no solo ahora, sino también cuando llegue a Dios. Porque todavía estoy en peligro; pero el Padre es fiel en Jesucristo para cumplir mi petición y la de ustedes. Que seamos hallados irreprochables en él.'
  revised_footnotes:
  - marker: a
    text: «También» aparece entre corchetes en el testimonio inglés utilizado, como señal de una restitución editorial; la revisión directa del griego está pendiente.
    reason: Preserva de forma transparente la incertidumbre textual indicada por el testimonio suministrado.
  revision_rationale: 'La revisión es limitada: sustituye una paráfrasis interpretativa del término técnico «presbytery» por «presbiterio» y hace explícita la reciprocidad de «each of you severally love one another». Se conserva el orden y la ambigüedad de las formulaciones teológicamente o textualmente sensibles, incluida la restauración editorial entre corchetes.'
