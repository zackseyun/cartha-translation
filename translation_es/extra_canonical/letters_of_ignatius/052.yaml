review_pass:
  verdict: revise
  source_fidelity: 'La traducción refleja fielmente el testimonio inglés y, en lo principal, el griego de la recensión media: conserva la restauración editorial de «[también]», la referencia a la iglesia en Siria, la sumisión al obispo y al presbiterio, y la formulación «en Jesucristo». Sin embargo, «Mi espíritu se ofrece por ustedes» presenta el giro como una acción reflexiva del autor. La expresión transmitida se formula como una entrega u ofrenda sacrificial por ellos; el pasivo «es ofrecido» reproduce mejor tanto el testimonio inglés («is offered up») como esa construcción, sin resolver de más su alcance metafórico.'
  naturalness: El español es claro, digno y apropiado para un registro epistolar antiguo en variante latinoamericana neutral. «Consejo de ancianos», «corazón indiviso» e «irreprochables» son comprensibles y conservan el tono. Se mantiene «Que estén bien» como despedida formal no arcaizante.
  terminology: «Esmirniotas», «efesios», «obispo», «consejo de ancianos», «Jesucristo» e «irreprochables» son elecciones adecuadas. «Consejo de ancianos» comunica el carácter colectivo de πρεσβυτέριον sin aplicar una estructura denominacional contemporánea. Se conserva «mandamiento» para no especificar indebidamente la comparación del original.
  issues:
  - severity: medium
    issue: Voz de «Mi espíritu se ofrece por ustedes»
    rationale: El reflexivo español puede sugerir que el autor realiza activamente la ofrenda de sí mismo. El testimonio de base dice «My spirit is offered up for you», y la expresión griega subyacente tiene formulación nominal/sacrificial. «Mi espíritu es ofrecido por ustedes» conserva con mayor precisión la voz y la ambigüedad de la imagen.
  revised_text: 'El amor de los esmirniotas y de los efesios los saluda. Recuerden en sus oraciones a la iglesia que está en Siria, de la cual [también][a] yo no soy digno de ser llamado miembro, pues soy el último de ellos.



    Que estén bien en Jesucristo, sometiéndose al obispo como al mandamiento, y asimismo al consejo de ancianos. Y que cada uno de ustedes ame a los demás con un corazón indiviso.



    Mi espíritu es ofrecido por ustedes, no solo ahora, sino también cuando llegue a Dios. Porque todavía estoy en peligro; pero el Padre es fiel en Jesucristo para cumplir mi petición y la de ustedes. Que seamos hallados irreprochables en él.'
  revised_footnotes:
  - marker: a
    text: «También» aparece entre corchetes en el testimonio inglés utilizado, como señal de una restitución editorial; la revisión directa del griego está pendiente.
    reason: Preservar de forma transparente la incertidumbre textual señalada en la fuente suministrada.
  revision_rationale: 'Se realiza una única corrección segura: se cambia el reflexivo «se ofrece» por el pasivo «es ofrecido» para reflejar la formulación sacrificial del testimonio y preservar su ambigüedad. Se mantienen la puntuación, el ancla de nota y el resto de las decisiones léxicas, pues son fieles, naturales y no imponen una lectura doctrinal.'
