base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: es
  text: 'El amor de los esmirniotas y de los efesios los saluda. Recuerden en sus oraciones a la iglesia que está en Siria, de la cual [también][a] yo no soy digno de ser llamado miembro, pues soy el último de ellos.


    Que estén bien en Jesucristo, sometiéndose al obispo como al mandamiento, y asimismo al consejo de ancianos. Y que cada uno de ustedes ame a los demás con un corazón indiviso.


    Mi espíritu se ofrece por ustedes, no solo ahora, sino también cuando llegue a Dios. Porque todavía estoy en peligro; pero el Padre es fiel en Jesucristo para cumplir mi petición y la de ustedes. Que seamos hallados irreprochables en él.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «También» aparece entre corchetes en el testimonio inglés utilizado, como señal de una restitución editorial; la revisión directa del griego está pendiente.
    reason: Preservar de forma transparente la incertidumbre textual señalada en la fuente suministrada.
lexical_decisions:
- source_word: Smyrnaens and Ephesians
  choice: los esmirniotas y los efesios
  rationale: Se emplean los gentilicios españoles actuales y comprensibles.
- source_word: presbytery
  choice: consejo de ancianos
  rationale: Expresa el sentido corporativo del término griego que subyace al testimonio, sin confundirlo con un edificio ni imponer una denominación moderna.
- source_word: undivided heart
  choice: un corazón indiviso
  rationale: Conserva la imagen y el énfasis ético del testimonio antiguo en un registro digno.
- source_word: attain unto God
  choice: llegue a Dios
  rationale: Mantiene la formulación de Ignacio vinculada a su martirio esperado sin explicitar más de lo que dice el texto.
- source_word: unblamable
  choice: irreprochables
  rationale: Equivalente natural que conserva el sentido moral y judicial de ser hallados sin reproche.
theological_decisions:
- issue: Sumisión al obispo «como al mandamiento»
  choice: sometiéndose al obispo como al mandamiento
  alternative: sometiéndose al obispo como a un mandato
  rationale: Se conserva la comparación inusual y su posible tensión, sin identificar expresamente al obispo con el mandamiento ni añadir una fuente no indicada.
- issue: Ofrenda del espíritu del autor
  choice: Mi espíritu se ofrece por ustedes
  alternative: Entrego mi vida por ustedes
  rationale: La versión elegida preserva la expresión sacrificial y su ambigüedad, evitando reducirla a una paráfrasis física o doctrinal.
- issue: La fidelidad del Padre «en Jesucristo»
  choice: el Padre es fiel en Jesucristo
  alternative: el Padre, por medio de Jesucristo, es fiel
  rationale: Se mantiene la relación expresada por «en» sin convertirla en una afirmación instrumental más específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se evitan arcaísmos. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; la revisión directa de la tradición manuscrita griega de la recensión media sigue pendiente.
