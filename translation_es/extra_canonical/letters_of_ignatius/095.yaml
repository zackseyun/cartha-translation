review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés suministrado. Sin embargo, «por alguien aparte del obispo» introduce un agente («alguien») que no está expresado y estrecha de forma innecesaria la ambigüedad de «known beyond the bishop». Asimismo, «deseo desordenado» interpreta de modo más específico el término tradicional «concupiscencia»; conviene conservar este último en el texto y explicarlo en nota.
  naturalness: El registro es claro, digno y adecuado para el español latinoamericano neutral. «Estén contentas con sus esposos» y «para honra de la carne del Señor» son naturales dentro del registro exhortativo antiguo. Se ajusta la construcción relativa al obispo para que sea más idiomática sin resolver la dificultad textual.
  terminology: Se mantienen «carne», «castidad», «Iglesia», «obispo» y «concupiscencia», términos que conservan las resonancias cristológicas y éticas del testimonio sin imponer una lectura confesional posterior. La nota de «concupiscencia» ofrece una aclaración moderna sin identificarla automáticamente con toda forma de deseo.
  issues:
  - severity: medium
    issue: Interpretación excesiva de la cláusula sobre el obispo
    rationale: «Si llega a ser conocido por alguien aparte del obispo» añade «alguien» y favorece una interpretación concreta de una frase que el propio testimonio disponible presenta de manera oscura. «Si llega a ser conocido más allá del obispo» conserva mejor su ambigüedad.
  - severity: low
    issue: «Deseo desordenado» especifica más que el testimonio
    rationale: Aunque «concupiscence» posee una carga moral negativa, «deseo desordenado» incorpora una formulación explicativa particular. «Concupiscencia», acompañada de nota, preserva el término y su amplitud.
  revised_text: 'Huye de las malas artes; o, mejor dicho, habla acerca de ellas. Di a mis hermanas que amen al Señor y estén contentas con sus esposos en la carne y en el espíritu. Del mismo modo, exhorta también a mis hermanos, en el nombre de Jesucristo, a amar a sus esposas como el Señor amó a la Iglesia.



    Si alguien puede permanecer en castidad para honra de la carne del Señor, que permanezca así, pero sin jactarse. Si se jacta, está perdido; y si llega a ser conocido más allá del obispo,[a] queda contaminado. Conviene que los hombres y las mujeres, cuando se casen, se unan con el consentimiento del obispo, para que el matrimonio sea conforme al Señor y no conforme a la concupiscencia.[b] Que todo se haga para honra de Dios.'
  revised_footnotes:
  - marker: a
    text: 'La expresión del testimonio disponible es difícil: literalmente, «si llega a ser conocido más allá del obispo». También podría entenderse como «si se da a conocer a alguien aparte del obispo».'
    reason: Preservar la ambigüedad textual y evitar presentar como segura una sola interpretación antes de la revisión directa del griego.
  - marker: b
    text: El término tradicional «concupiscencia» también puede traducirse como «pasión» o «deseo». En este contexto tiene una connotación moral negativa, sin que ello defina con precisión técnica su alcance.
    reason: Aclarar el término tradicional sin sustituirlo por una interpretación más específica ni borrar su matiz ético.
  revision_rationale: 'Se corrigen dos puntos de precisión: la cláusula relativa al conocimiento fuera del obispo conserva la ambigüedad del testimonio inglés, y «concupiscencia» reemplaza la explicación interpretativa «deseo desordenado» en el texto. Las notas mantienen las alternativas pertinentes y señalan que la revisión directa del griego sigue pendiente.'
