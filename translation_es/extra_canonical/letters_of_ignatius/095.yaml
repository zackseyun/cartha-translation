base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: es
  text: 'Huye de las malas artes; o, mejor dicho, habla acerca de ellas. Di a mis hermanas que amen al Señor y estén contentas con sus esposos en la carne y en el espíritu. Del mismo modo, exhorta también a mis hermanos, en el nombre de Jesucristo, a amar a sus esposas como el Señor amó a la Iglesia.


    Si alguien puede permanecer en castidad para honra de la carne del Señor, que permanezca así, pero sin jactarse. Si se jacta, está perdido; y si llega a ser conocido por alguien aparte del obispo,[a] queda contaminado. Conviene que los hombres y las mujeres, cuando se casen, se unan con el consentimiento del obispo, para que el matrimonio sea conforme al Señor y no conforme al deseo desordenado.[b] Que todo se haga para honra de Dios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión del testimonio disponible es difícil: literalmente, «si llega a ser conocido más allá del obispo». También podría entenderse como «si se da a conocer a alguien aparte del obispo».'
    reason: Preservar la ambigüedad textual y evitar presentar como segura una sola interpretación antes de la revisión directa del griego.
  - marker: b
    text: El término tradicional «concupiscencia» también puede traducirse como «pasión» o «deseo». Aquí indica un deseo desordenado, no el deseo en general.
    reason: Aclarar la elección de una expresión moderna sin borrar el matiz moral del término.
lexical_decisions:
- source_word: evil arts
  choice: malas artes
  rationale: Conserva el sentido amplio y algo ambiguo del testimonio disponible, sin reducirlo con certeza a magia, engaños u otras prácticas específicas.
- source_word: be content with
  choice: estén contentas con
  rationale: Reproduce de manera natural la exhortación del testimonio inglés sin intensificarla como obediencia o sumisión.
- source_word: in flesh and in spirit
  choice: en la carne y en el espíritu
  rationale: Mantiene la formulación dual y su posible tensión teológica en vez de explicarla.
- source_word: chastity
  choice: castidad
  rationale: Término tradicional, amplio y adecuado al contexto; no decide si se trata específicamente de celibato, continencia o virginidad.
- source_word: concupiscence
  choice: deseo desordenado
  rationale: Expresa en español actual la fuerza moral negativa del término sin depender de vocabulario técnico poco transparente.
- source_word: polluted
  choice: queda contaminado
  rationale: Conserva la imagen fuerte de impureza del testimonio sin convertirla en una categoría canónica más precisa de lo que permite la base.
theological_decisions:
- issue: El honor debido a «la carne del Señor» en relación con la castidad
  choice: para honra de la carne del Señor
  alternative: en honor al cuerpo del Señor
  rationale: Se conserva «carne» por su resonancia cristológica y porque «cuerpo» podría suavizar una formulación deliberadamente concreta.
- issue: Conocimiento de la decisión de castidad y autoridad episcopal
  choice: si llega a ser conocido por alguien aparte del obispo
  alternative: si es conocido más allá del obispo
  rationale: La redacción del testimonio es difícil; esta opción mantiene que la notoriedad se extiende fuera del ámbito del obispo, sin explicar por qué ello contamina.
- issue: Consentimiento episcopal para el matrimonio
  choice: se unan con el consentimiento del obispo
  alternative: contraigan matrimonio con la aprobación del obispo
  rationale: Mantiene la afirmación eclesial del pasaje sin convertir «unirse» exclusivamente en una fórmula jurídica posterior.
- issue: Matrimonio «after the Lord»
  choice: conforme al Señor
  alternative: según el Señor
  rationale: Comunica orientación y correspondencia con la voluntad del Señor sin añadir una definición doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron expresiones teológicamente cargadas como «carne del Señor» y «en la carne y en el espíritu». Este borrador es provisional porque la evidencia suministrada consiste en un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega está pendiente.
