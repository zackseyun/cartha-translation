review_pass:
  verdict: revise
  source_fidelity: La traducción reproduce en general el contenido del testimonio inglés y conserva formulaciones importantes como «la carne del Señor», «en la carne y en el espíritu» y el consentimiento del obispo. Sin embargo, «por alguien aparte del obispo» resuelve de manera demasiado específica la frase difícil «known beyond the bishop», cuya ambigüedad debe mantenerse en el texto, no solo en nota. «Deseo desordenado» explicita un juicio que el testimonio expresa mediante «concupiscence»; «deseo» preserva mejor el término y el contraste contextual.
  naturalness: El español es claro, sobrio y apto para un registro epistolar antiguo. «Habla acerca de ellas» puede simplificarse naturalmente a «habla de ellas». «Si esto llega a saberse más allá del obispo» conserva la extrañeza controlada de la fuente y requiere una nota breve.
  terminology: «Malas artes», «castidad», «carne del Señor», «contaminado», «conforme al Señor» e «Iglesia» son opciones adecuadas. Se conserva «carne» en vez de «cuerpo» por fidelidad al testimonio. Para concupiscence, «deseo» evita definir de antemano el alcance técnico o moral preciso del término, que el contexto ya contrasta con lo que es «conforme al Señor».
  issues:
  - severity: medium
    issue: La cláusula «por alguien aparte del obispo» fija una interpretación de «beyond the bishop».
    rationale: La expresión del testimonio inglés es sintáctica y semánticamente difícil. La redacción propuesta puede significar que una persona distinta del obispo llega a conocer el asunto, mientras que «beyond» también puede referirse a que el asunto se divulga fuera del obispo. Conviene mantener la ambigüedad en la traducción y explicarla en nota.
  - severity: low
    issue: «Deseo desordenado» interpreta «concupiscence» con una paráfrasis moral más delimitada.
    rationale: Aunque el contexto presenta un contraste negativo, «deseo» permite que el lector perciba el contraste sin que la traducción establezca una definición técnica adicional. La nota puede registrar «concupiscencia» y «pasión» como alternativas.
  revised_text: 'Huye de las malas artes; o, mejor dicho, habla de ellas. Di a mis hermanas que amen al Señor y estén contentas con sus esposos en la carne y en el espíritu. Del mismo modo, exhorta también a mis hermanos, en el nombre de Jesucristo, a amar a sus esposas como el Señor amó a la Iglesia.


    Si alguien puede permanecer en castidad para honra de la carne del Señor, que permanezca así, sin jactarse. Si se jacta, está perdido; y si esto llega a saberse más allá del obispo,[a] queda contaminado. Conviene también que los hombres y las mujeres, cuando se casen, se unan con el consentimiento del obispo, para que el matrimonio sea conforme al Señor y no conforme al deseo.[b] Que todo se haga para honra de Dios.'
  revised_footnotes:
  - marker: a
    text: 'La expresión del testimonio disponible es difícil: literalmente, «si llega a ser conocido más allá del obispo». También puede entenderse como que el asunto llega a conocimiento de alguien aparte del obispo. La revisión directa del griego es necesaria para precisar el sentido.'
    reason: Mantener en el texto la ambigüedad del testimonio y registrar una posible interpretación sin presentarla como segura.
  - marker: b
    text: El término tradicional «concupiscencia» también puede traducirse como «pasión» o «deseo». En este contexto se contrasta con un matrimonio «conforme al Señor».
    reason: Explicar la opción moderna sin imponer una definición técnica o denominacional del término.
  revision_rationale: Se realizan correcciones limitadas para que la traducción no resuelva una ambigüedad destacada por el propio testimonio inglés ni intensifique innecesariamente «concupiscence». El resto del texto se conserva por su fidelidad, claridad y registro adecuado. Dado que el material proporcionado declara pendiente la revisión directa de la tradición griega, la nota de la cláusula relativa al obispo debe mantenerse.
