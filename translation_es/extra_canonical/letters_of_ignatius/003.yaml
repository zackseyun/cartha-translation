base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: es
  text: 'En cuanto a mi compañero de servicio, Burro, quien por la voluntad de Dios es el diácono de ustedes, bendecido en todo, ruego que permanezca conmigo, para honra de ustedes y de su obispo. También Croco, digno de Dios y de ustedes, a quien recibí como muestra del amor que me tienen, me ha reconfortado en todo. Que del mismo modo el Padre de Jesucristo lo reconforte a él, junto con Onésimo, Burro, Euplo y Frontón. En ellos los vi a todos ustedes con los ojos del amor.


    Que siempre pueda alegrarme en ustedes, si en verdad soy digno de ello. Por tanto, conviene que glorifiquen en todo sentido a Jesucristo, quien los glorificó, para que, perfectamente unidos en una misma obediencia y sometidos a su obispo y al presbiterio,[a] sean santificados en todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Presbiterio» se refiere aquí al cuerpo de presbíteros o ancianos de la comunidad.
    reason: Aclara el sentido colectivo del término sin reemplazar en el texto el término eclesial tradicional.
lexical_decisions:
- source_word: fellow servant
  choice: compañero de servicio
  rationale: Conserva la idea de servicio compartido sin introducir una categoría eclesiástica adicional.
- source_word: deacon
  choice: diácono
  rationale: Emplea el término eclesial tradicional y ampliamente comprensible.
- source_word: refresh / relieved
  choice: reconfortar / ha reconfortado
  rationale: Mantiene en español la correspondencia verbal del testimonio inglés y expresa alivio y ánimo integral.
- source_word: presbytery
  choice: consejo de ancianos
  rationale: Expresa el sentido corporativo del término y evita que «presbiterio» se entienda principalmente como una parte del edificio.
- source_word: one submission
  choice: una misma obediencia
  rationale: Da una expresión natural a la unidad bajo autoridad, sin borrar la repetición posterior de «sometidos».
- source_word: with the eyes of love
  choice: con los ojos del amor
  rationale: Conserva la imagen afectiva y retórica del texto.
theological_decisions:
- issue: Relación entre obispo y presbiterio
  choice: «su obispo y el consejo de ancianos» como dos referentes coordinados
  alternative: «su obispo y presbiterio»
  rationale: Preserva la estructura eclesial explícita del pasaje sin definir más allá del texto las funciones o la autoridad relativa de cada grupo.
- issue: Finalidad o resultado de la unidad y sumisión
  choice: «para que... sean santificados»
  alternative: «de modo que... queden santificados»
  rationale: Mantiene abierta la relación de propósito o resultado expresada por la cláusula, sin añadir una explicación doctrinal del modo de santificación.
- issue: El Padre de Jesucristo
  choice: Conservar literalmente «el Padre de Jesucristo»
  alternative: Parafrasear como «Dios Padre»
  rationale: Respeta la formulación cristológica y relacional concreta del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conservan los nombres propios en formas hispanizadas reconocibles. Dado que la revisión directa del griego de la recensión media está pendiente, el borrador sigue con cautela el testimonio inglés suministrado y evita afirmar matices no verificables en la evidencia disponible.
