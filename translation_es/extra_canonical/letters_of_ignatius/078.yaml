base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: es
  text: 'Porque él sufrió todas estas cosas por nosotros [para que fuéramos salvados].[a] Y sufrió de verdad, así como también se resucitó a sí mismo de verdad.[b] No fue como dicen ciertos incrédulos: que sufrió solo en apariencia, siendo ellos mismos mera apariencia. Según lo que piensan, eso les sucederá, pues carecen de cuerpo y son semejantes a los demonios.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes conservan la señal de restauración o suplemento presente en el testimonio inglés utilizado para este borrador.
    reason: Distinguir las palabras transmitidas como restauración editorial en la fuente de trabajo.
  - marker: b
    text: Traducción provisional basada en el testimonio inglés suministrado, que dice «se resucitó a sí mismo»; queda pendiente la revisión directa del griego.
    reason: Advertir que una decisión teológicamente significativa depende por ahora de un testimonio indirecto.
  - marker: c
    text: 'La expresión conserva la comparación del testimonio: «semejantes a los demonios», no necesariamente «demonios».'
    reason: Evitar resolver la comparación como una identificación absoluta.
lexical_decisions:
- source_word: for our sakes
  choice: por nosotros
  rationale: Expresa de manera natural y directa el sentido de beneficio o propósito en favor de otros.
- source_word: salved
  choice: salvados
  rationale: El testimonio inglés presenta una forma arcaica equivalente a «saved»; se conserva el contenido soteriológico sin reproducir el arcaísmo.
- source_word: truly
  choice: de verdad
  rationale: Subraya la realidad histórica del sufrimiento y de la resurrección frente a la idea de mera apariencia.
- source_word: in semblance
  choice: solo en apariencia
  rationale: Comunica con claridad la oposición entre realidad y apariencia sin introducir terminología doctrinal técnica ausente del testimonio.
- source_word: without body
  choice: carecen de cuerpo
  rationale: Mantiene la afirmación paradójica del pasaje con una expresión natural en español.
- source_word: demon-like
  choice: semejantes a los demonios
  rationale: Reproduce la comparación sin convertirla en una identificación absoluta.
theological_decisions:
- issue: Agencia en la resurrección
  choice: se resucitó a sí mismo
  alternative: fue resucitado
  rationale: El testimonio suministrado dice explícitamente «He raised Himself»; se conserva esa agencia reflexiva, aunque la revisión directa del griego está pendiente.
- issue: Polémica contra el sufrimiento meramente aparente
  choice: sufrió solo en apariencia
  alternative: pareció sufrir
  rationale: La formulación mantiene el contraste entre sufrimiento real y aparente sin añadir la etiqueta histórica «docetismo».
- issue: Destino correspondiente a la creencia de los adversarios
  choice: según sus opiniones, así también les sucederá
  alternative: lo que creen también les ocurrirá
  rationale: Se conserva la relación retributiva y la formulación abierta del testimonio, sin precisar más de lo que este afirma.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la repetición enfática de «de verdad», el tono polémico y la paradoja de que quienes reducen a Cristo a una apariencia terminan descritos como mera apariencia. Este borrador es necesariamente provisional porque la revisión del texto griego de la recensión media sigue pendiente.
