revisions:
- from: 'Puesto que en las personas antes mencionadas vi y abracé en la fe a todo el pueblo de ustedes, los exhorto a que procuren hacerlo todo en una concordia que agrade a Dios: que el obispo presida a semejanza de Dios[a], los presbíteros a semejanza del consejo de los apóstoles, y también los diáconos —muy queridos para mí—, a quienes se les ha confiado el servicio de Jesucristo[b], el cual estaba con el Padre antes de los siglos y se manifestó al final de los tiempos.


    Por lo tanto, procuren todos conformarse al carácter de Dios[c] y trátense unos a otros con respeto. Que nadie juzgue a su prójimo según la carne, sino que ámense siempre unos a otros en Jesucristo. Que no haya entre ustedes nada capaz de dividirlos; más bien, permanezcan unidos al obispo y a quienes los presiden, como ejemplo y enseñanza de incorruptibilidad[d].'
  to: 'Puesto que, en las personas antes mencionadas, vi y abracé con fe a toda su comunidad, los exhorto a que se esfuercen por hacerlo todo en la concordia de Dios: que el obispo presida en el lugar de Dios[a], los presbíteros en el lugar del consejo de los apóstoles, y también los diáconos, que me son muy queridos y a quienes se les ha confiado el diaconado de Jesucristo[b], quien estaba con el Padre antes de los siglos y se manifestó al final de los tiempos.


    Por lo tanto, lleguen todos a ser semejantes a Dios[c] y muéstrense respeto unos a otros. Que nadie considere a su prójimo según la carne, sino que ámense siempre unos a otros en Jesucristo. Que no haya entre ustedes nada que pueda dividirlos; más bien, únanse al obispo y a quienes los presiden, como ejemplo y enseñanza de incorruptibilidad[d].'
  rationale: 'La revisión sigue el griego de la recensión media allí donde el testimonio inglés suministrado es impreciso: εἰς τόπον θεοῦ y εἰς τόπον συνεδρίου ἀποστόλων requieren «en el lugar de», no «a semejanza de». También se ajustan ὁμοιόθεοι, βλεπέτω y διακονία para conservar el alcance léxico del original, manteniendo un español latinoamericano claro y sin resolver doctrinalmente las imágenes eclesiales del pasaje.'
