base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: es
  text: 'Puesto que, en las personas antes mencionadas, vi y abracé con fe a toda su comunidad, los exhorto a que se esfuercen por hacerlo todo en la concordia de Dios: que el obispo presida en el lugar de Dios[a], los presbíteros en el lugar del consejo de los apóstoles, y también los diáconos, que me son muy queridos y a quienes se les ha confiado el diaconado de Jesucristo[b], quien estaba con el Padre antes de los siglos y se manifestó al final de los tiempos.


    Por lo tanto, lleguen todos a ser semejantes a Dios[c] y muéstrense respeto unos a otros. Que nadie considere a su prójimo según la carne, sino que ámense siempre unos a otros en Jesucristo. Que no haya entre ustedes nada que pueda dividirlos; más bien, únanse al obispo y a quienes los presiden, como ejemplo y enseñanza de incorruptibilidad[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «en el lugar de Dios». La expresión describe una función o posición dentro de la comparación del autor; el pasaje no explica por sí mismo todos sus alcances.
    reason: Restituye el sentido espacial-representativo de εἰς τόπον θεοῦ sin imponer una formulación doctrinal posterior.
  - marker: b
    text: «Diaconado» también puede entenderse como «servicio» o «ministerio» de Jesucristo.
    reason: Conserva la relación con «diáconos» y señala la amplitud de διακονία.
  - marker: c
    text: La expresión puede traducirse también «sean como Dios» o «sean semejantes a Dios».
    reason: Ὁμοιόθεοι es una formulación poco común y expresiva; la nota preserva su amplitud sin reducirla a una cualidad específica.
  - marker: d
    text: «Incorruptibilidad» puede aludir tanto a integridad libre de corrupción como a condición imperecedera.
    reason: Conserva la amplitud de ἀφθαρσία.
lexical_decisions:
- source_word: godly concord
  choice: una concordia que agrade a Dios
  rationale: Expresa en español natural una concordia determinada por la voluntad de Dios, sin reducirla a mera armonía institucional.
- source_word: bishop / presbyters / deacons
  choice: obispo / presbíteros / diáconos
  rationale: Conserva los títulos eclesiales históricos del testimonio y evita sustituirlos por equivalentes denominacionales modernos.
- source_word: after the likeness
  choice: a semejanza de
  rationale: Mantiene la relación analógica del testimonio sin afirmar identidad ni equivalencia ontológica.
- source_word: diaconate
  choice: servicio
  rationale: Comunica el sentido funcional del término al lector común; la nota conserva la posible referencia al ministerio diaconal.
- source_word: before the worlds
  choice: antes de los siglos
  rationale: Conserva la expresión temporal y cosmológica tradicional, que puede aludir a las edades o eras, sin modernizarla indebidamente como una fecha concreta.
- source_word: after the flesh
  choice: según la carne
  rationale: Preserva el lenguaje antropológico y moral antiguo y su amplitud interpretativa.
- source_word: incorruptibility
  choice: incorruptibilidad
  rationale: Conserva un concepto teológico amplio que puede abarcar integridad, ausencia de corrupción e imperecibilidad.
theological_decisions:
- issue: La presidencia del obispo «a semejanza de Dios»
  choice: Conservar la comparación explícita y añadir una nota aclaratoria
  alternative: Interpretarla como representación directa de Dios o reemplazarla por «en nombre de Dios»
  rationale: El texto formula una analogía, pero no define su alcance; la traducción no debe convertirla en una doctrina más precisa de autoridad eclesial.
- issue: La preexistencia de Jesucristo
  choice: «estaba con el Padre antes de los siglos»
  alternative: «existía junto al Padre antes de la creación»
  rationale: La formulación elegida mantiene la afirmación cristológica y la expresión temporal antigua sin resolver si «siglos» se refiere específicamente a eras, al mundo creado o a toda la creación.
- issue: «Conformidad con Dios»
  choice: «conformarse al carácter de Dios»
  alternative: «alcanzar la semejanza de Dios» o «adoptar las costumbres de Dios»
  rationale: Evita sugerir igualdad ontológica con Dios y expresa una orientación ética, aunque la nota reconoce la dificultad de la expresión.
- issue: Unidad con los dirigentes
  choice: «permanezcan unidos al obispo y a quienes los presiden»
  alternative: «sométanse al obispo y a sus superiores»
  rationale: El testimonio habla de unión y presidencia; traducirlo como sumisión introduciría una especificación jerárquica no expresada aquí.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usan «ustedes» y formas exhortativas naturales, con terminología histórica comprensible. El borrador se basa en el testimonio inglés público suministrado y en las indicaciones disponibles sobre la tradición griega; requiere cotejo directo final con el griego de la recensión media.
