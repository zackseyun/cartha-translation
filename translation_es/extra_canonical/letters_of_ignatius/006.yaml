review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones para reflejar con mayor precisión el testimonio base: «congratulate» expresa «felicito», no «considero dichosos»; «one and another» es «uno y otro», no «una o dos personas»; y la cláusula final habla de entregarse/darse a Dios mediante la sumisión, no simplemente de vivir sometidos a Dios. Se conservan «en el Espíritu», el paralelismo de unión y las imágenes del altar y del pan. La revisión directa del griego sigue pendiente según el contexto proporcionado.'
  naturalness: La redacción revisada mantiene un registro actual, sobrio y neutral latinoamericano. «Trato» es más idiomático que «relación tan estrecha» para el encuentro breve referido; «asamblea» comunica naturalmente la reunión comunitaria sin hacer de «congregación» un título institucional.
  terminology: Se mantiene «obispo», «Iglesia», «Jesucristo», «Padre», «altar» y «pan [de Dios]». Los corchetes se restituyen porque están presentes en el testimonio inglés base y no deben convertirse silenciosamente en parte segura del texto. «Someternos» y «entregarnos a Dios» preservan la relación sintáctica de la exhortación final.
  issues:
  - severity: medium
    issue: «cuánto más dichosos considero a ustedes»
    rationale: El inglés «how much more do I congratulate you» requiere «cuánto más los felicito», no una valoración de que sean dichosos.
  - severity: medium
    issue: «la oración de una o dos personas»
    rationale: El testimonio dice «the prayer of one and another»; «una o dos» introduce una alternativa numérica ausente del texto.
  - severity: high
    issue: «para que vivamos sometidos a Dios»
    rationale: La fuente dice «that by our submission we may give ourselves to God». La versión propuesta omite la idea de darse o entregarse a Dios y altera la relación instrumental expresada por «by our submission».
  - severity: medium
    issue: «pan de Dios» sin corchetes
    rationale: El testimonio base presenta «bread [of God]». Deben conservarse los corchetes para no tratar como indiscutida una adición o suplencia señalada por la edición.
  revised_text: 'Pues si, en tan poco tiempo, tuve tal trato con el obispo de ustedes —no según la manera humana, sino en el Espíritu—, ¡cuánto más los felicito a ustedes, que están estrechamente unidos a él, así como la Iglesia está unida a Jesucristo y Jesucristo al Padre, a fin de que todo esté en armonía en la unidad!


    Que nadie se engañe. Si alguien no está dentro del ámbito del altar, carece del pan [de Dios].[a] Pues, si la oración de uno y de otro tiene tanta fuerza, ¡cuánto más la del obispo y la de toda la Iglesia!


    Por tanto, quien no acude a la asamblea demuestra con ello su orgullo y se ha separado, pues está escrito: «Dios se opone a los orgullosos».[b] Procuremos, entonces, no oponernos al obispo, para que, al someternos, nos entreguemos a Dios.'
  revised_footnotes:
  - marker: a
    text: La imagen de estar «dentro del ámbito del altar» probablemente alude a permanecer en la comunión reunida de la Iglesia; «pan [de Dios]» puede tener una resonancia eucarística. Los corchetes reproducen la señalización del testimonio base, y la formulación metafórica se conserva sin restringirla a una sola interpretación.
    reason: Preservar tanto la ambigüedad histórica y teológica de las imágenes cultuales como la suplencia editorial indicada en el testimonio.
  - marker: b
    text: Cita de Proverbios 3:34 según la forma griega, retomada también en Santiago 4:6 y 1 Pedro 5:5.
    reason: Identificar la alusión bíblica y su tradición textual.
  revision_rationale: La revisión corrige desviaciones semánticas concretas respecto del testimonio inglés suministrado, sin resolver de forma doctrinal las metáforas de altar, pan, asamblea y unidad. Se ha conservado la formulación «en el Espíritu» del testimonio proporcionado. Dado que el propio expediente indica que el cotejo directo con la tradición griega de la recensión media está pendiente, se recomienda esa verificación editorial antes de fijar el texto definitivo.
