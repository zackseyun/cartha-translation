base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: es
  text: 'Pues si en tan poco tiempo tuve una relación tan estrecha con el obispo de ustedes —una relación no meramente humana, sino espiritual—, cuánto más dichosos considero a ustedes, que están íntimamente unidos a él, así como la Iglesia está unida a Jesucristo y Jesucristo al Padre, para que todo esté en armonía dentro de la unidad.


    Que nadie se engañe. Si alguien no está dentro del ámbito del altar, carece del pan de Dios.[a] Pues, si la oración de una o dos personas tiene tanta fuerza, ¡cuánto más la del obispo y la de toda la Iglesia!


    Por tanto, quien no acude a la reunión demuestra con ello su orgullo y se ha apartado a sí mismo, pues está escrito: «Dios se opone a los orgullosos».[b] Procuremos, entonces, no oponernos al obispo, para que vivamos sometidos a Dios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La imagen de estar «dentro del ámbito del altar» probablemente alude a permanecer en la comunión reunida de la Iglesia; «el pan de Dios» puede tener una resonancia eucarística. La formulación metafórica se conserva sin restringirla a una sola interpretación.
    reason: Preservar la ambigüedad histórica y teológica de las imágenes cultuales.
  - marker: b
    text: Cita de Proverbios 3:34 según la forma griega, retomada también en Santiago 4:6 y 1 Pedro 5:5.
    reason: Identificar la alusión bíblica y su tradición textual.
lexical_decisions:
- source_word: converse / fellowship (Greek review pending; witness reflects συνήθεια)
  choice: una relación tan estrecha
  rationale: Comunica trato, vínculo y comunión sin reducir la expresión a una simple conversación ni cargarla de un sentido técnico.
- source_word: closely joined (witness; likely ἐγκεκραμένους)
  choice: íntimamente unidos
  rationale: Conserva la imagen de integración estrecha con el obispo en un español natural.
- source_word: precinct of the altar (witness; likely ἐντὸς τοῦ θυσιαστηρίου)
  choice: dentro del ámbito del altar
  rationale: Mantiene la metáfora cultual y su amplitud, sin identificarla de manera exclusiva con un edificio, rito o institución posterior.
- source_word: bread [of God]
  choice: pan de Dios
  rationale: Incluye la expresión completa transmitida por el testimonio y conserva su posible alcance eucarístico y comunitario sin explicitarlo en el cuerpo del texto.
- source_word: congregation (witness; likely ἐπὶ τὸ αὐτό)
  choice: la reunión
  rationale: Expresa el acto de reunirse en un mismo lugar sin imponer el término moderno «congregación» como nombre institucional.
- source_word: submission / submitting
  choice: vivamos sometidos
  rationale: Refleja una condición continua de sujeción a Dios y evita convertir la frase en la idea distinta de «entregarnos» a Dios.
theological_decisions:
- issue: Relación entre la Iglesia, el obispo, Cristo y el Padre
  choice: Conservar los paralelos de unión sin añadir una teoría eclesiológica
  alternative: Explicar que la unión con el obispo equivale institucionalmente a la unión con Cristo
  rationale: El pasaje presenta analogías orientadas a la armonía y la unidad, pero no desarrolla aquí todas sus posibles implicaciones doctrinales.
- issue: Sentido de «estar dentro del ámbito del altar» y «pan de Dios»
  choice: Mantener las imágenes y señalar su posible trasfondo en nota
  alternative: Traducir directamente como participación eucarística bajo autoridad episcopal
  rationale: La formulación puede tener resonancias eucarísticas y comunitarias, pero una paráfrasis doctrinal resolvería una tensión que el texto deja en forma metafórica.
- issue: Alcance de la sumisión al obispo
  choice: Traducir la exhortación de manera directa y vincularla con la sumisión a Dios
  alternative: Añadir límites, condiciones o una doctrina posterior de autoridad eclesial
  rationale: La traducción debe preservar la afirmación del autor sin importar precisiones confesionales ajenas a este pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se evitan arcaísmos. Dado que el material proporcionado identifica como base inmediata un testimonio inglés de dominio público y señala que la revisión directa del griego está pendiente, las decisiones se mantienen prudentes y conservan las metáforas y tensiones del pasaje; se recomienda cotejo editorial final con la tradición griega de la recensión media.
