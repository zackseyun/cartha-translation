base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: es
  text: 'Puesto que, en respuesta a mi oración a Dios, se me ha concedido ver sus rostros piadosos, he recibido aun más de lo que pedí. Pues, llevando cadenas en Cristo Jesús, espero saludarlos, si es la voluntad divina que yo sea considerado digno de llegar hasta el fin.


    En verdad, el comienzo está bien encaminado, con tal de que alcance la meta y reciba mi herencia sin impedimento. Temo que el amor mismo que ustedes me tienen llegue a perjudicarme. A ustedes les resulta fácil hacer lo que desean; pero a mí me resulta difícil llegar a Dios, a menos que me dejen seguir mi camino.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «a menos que me perdonen» o «me dejen en paz». En el contexto, Ignacio pide que no intervengan para impedir que complete el camino que tiene por delante.
    reason: La expresión «unless ye shall spare me» admite más de un matiz. La nota conserva la alternativa literal y aclara el probable sentido contextual sin incorporarlo como certeza al texto.
lexical_decisions:
- source_word: godly countenances
  choice: rostros piadosos
  rationale: Conserva el sentido religioso de la expresión sin recurrir al arcaísmo «semblantes»; «piadosos» describe la devoción de los destinatarios.
- source_word: wearing bonds in Christ Jesus
  choice: llevando cadenas en Cristo Jesús
  rationale: Mantiene la imagen concreta del encarcelamiento y su relación confesional con Cristo, en vez de diluirla en «estar preso».
- source_word: reach unto the end / attain unto the goal
  choice: llegar hasta el fin / alcance la meta
  rationale: 'Preserva la doble formulación del testimonio: primero el fin y luego la imagen de una meta, alusivas a completar su camino hasta el martirio sin explicitar más de lo que dice el texto.'
- source_word: receive mine inheritance
  choice: reciba mi herencia
  rationale: Retiene la metáfora bíblica de la herencia y su posible resonancia escatológica.
- source_word: attain unto God
  choice: llegar a Dios
  rationale: Traducción deliberadamente directa que conserva la fuerza y la tensión teológica de la expresión, sin sustituirla por una paráfrasis como «morir como mártir».
theological_decisions:
- issue: La relación entre «llegar hasta el fin», «alcanzar la meta» y el martirio
  choice: Conservar las metáforas del fin y la meta
  alternative: Explicitar «sufrir el martirio» o «morir por Cristo»
  rationale: El contexto apunta al martirio, pero el pasaje se expresa mediante imágenes de consumación y llegada; explicitarlas como muerte resolvería una alusión que el texto mantiene indirecta.
- issue: El sentido de «llegar a Dios»
  choice: Traducir literalmente «llegar a Dios»
  alternative: «Ir a la presencia de Dios» o «unirme con Dios»
  rationale: Las alternativas introducen precisiones doctrinales que no están expresadas en el testimonio suministrado.
- issue: La amenaza representada por el amor de los romanos
  choice: Mantener que su amor podría perjudicar a Ignacio
  alternative: Precisar que podrían intervenir para impedir su ejecución
  rationale: La intervención es la probable referencia contextual, pero el texto conserva una formulación paradójica y general que conviene no cerrar en el cuerpo principal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las metáforas de cadenas, meta, herencia y llegada a Dios. La división en dos párrafos sigue el testimonio proporcionado. Este borrador es necesariamente provisional porque el material identifica la fuente inmediata como un testimonio inglés de dominio público y señala que aún está pendiente la revisión directa del griego de la recensión media.
