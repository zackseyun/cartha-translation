base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: es
  text: 'Puesto que, según me han informado, la iglesia que está en Antioquía de Siria goza de paz gracias a las oraciones de ustedes, yo también he recibido mayor consuelo, pues Dios ha disipado mi preocupación, con tal de que mediante el sufrimiento logre llegar a Dios y, gracias a la intercesión de ustedes, sea hallado discípulo.


    Te corresponde, muy bendecido Policarpo, convocar un consejo conforme a Dios y elegir de entre ustedes a alguien que les sea muy querido y que también sea fervoroso, alguien digno de llevar el nombre de «mensajero de Dios». Desígnalo para que vaya a Siria y, para gloria de Dios, ponga de manifiesto el fervor de su amor.


    El cristiano no tiene potestad sobre sí mismo, sino que dedica su tiempo a Dios. Esta obra es de Dios y también de ustedes, cuando la lleven a término; pues confío en la gracia divina que están dispuestos a realizar una buena obra digna de Dios. Como conozco el fervor de la sinceridad de ustedes, los he exhortado en una carta breve.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Esta traducción es provisional: se basa en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa del texto griego de la recensión media.'
    reason: La información de la fuente declara expresamente que aún no se ha realizado la revisión en la lengua original; la nota transparenta esa limitación textual.
lexical_decisions:
- source_word: peace
  choice: goza de paz
  rationale: Expresa de manera natural que la comunidad de Antioquía ha alcanzado una situación de paz, sin precisar una causa política o eclesial no indicada por el testimonio.
- source_word: godly council
  choice: un consejo conforme a Dios
  rationale: Evita que «consejo piadoso» se entienda solo como una recomendación; aquí se trata de una reunión o asamblea convocada con orientación divina.
- source_word: God's courier
  choice: «mensajero de Dios»
  rationale: Conserva el título funcional y religioso sin el matiz moderno y administrativo de «correo» o «mensajero especial».
- source_word: giveth his time to God
  choice: dedica su tiempo a Dios
  rationale: Comunica en español actual la entrega de la propia disponibilidad y actividad, respetando la formulación del testimonio disponible.
- source_word: authority over himself
  choice: potestad sobre sí mismo
  rationale: Mantiene la afirmación fuerte acerca de no disponer autónomamente de uno mismo, con un registro digno.
- source_word: fervor of your sincerity
  choice: el fervor de la sinceridad de ustedes
  rationale: Conserva la combinación conceptual poco habitual del testimonio en vez de reemplazarla por una interpretación más específica.
theological_decisions:
- issue: Llegar a Dios mediante el sufrimiento
  choice: con tal de que mediante el sufrimiento logre llegar a Dios
  alternative: si en verdad, mediante el martirio, alcanzo a Dios
  rationale: Se preservan tanto la condición como el término amplio «sufrimiento» del testimonio; no se explicita «martirio» aunque el contexto ignaciano pueda sugerirlo.
- issue: Ser hallado discípulo por la intercesión de la iglesia
  choice: gracias a la intercesión de ustedes, sea hallado discípulo
  alternative: por sus oraciones demuestre ser un verdadero discípulo
  rationale: No se añade «verdadero» ni se reduce la intercesión a un efecto psicológico; se conserva la tensión teológica de la expresión.
- issue: La obra como divina y humana
  choice: Esta obra es de Dios y también de ustedes
  alternative: Esta es la obra de Dios que ustedes deben realizar
  rationale: Mantiene la coordinación entre la agencia divina y la humana sin subordinarlas mediante una explicación doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y «tú» implícito en las formas dirigidas personalmente a Policarpo. Se evitan arcaísmos y tecnicismos denominacionales. La redacción sigue provisionalmente el testimonio inglés proporcionado, pues no se suministró el texto griego para cotejo directo.
