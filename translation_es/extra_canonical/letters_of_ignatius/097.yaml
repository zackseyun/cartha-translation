review_pass:
  verdict: revise
  source_fidelity: La revisión directa del griego no puede completarse porque no se suministra el texto griego, aunque se identifica la tradición manuscrita. Frente al testimonio inglés disponible, el borrador conserva en general el sentido y la incertidumbre de «if so be». Sin embargo, «con tal de que» introduce una condición más fuerte que la posibilidad expresada por el original inglés; además, la referencia posesiva en «el fervor de su amor» resulta ambigua y puede atribuir el amor al mensajero en vez de a la comunidad.
  naturalness: 'El español es mayormente natural y de registro digno. Se mejora la fluidez de algunas formulaciones sin rebajar el tono epistolar: «si es que» refleja mejor la modalidad condicional; «asamblea digna de Dios» expresa con mayor claridad una reunión convocada; y «el amor fervoroso de ustedes» elimina una ambigüedad pronominal.'
  terminology: Se mantienen «Antioquía», «Policarpo», «intercesión», «gracia divina» y «mensajero de Dios». «Asamblea digna de Dios» conserva el carácter religioso de godly council sin convertirlo en un tecnicismo eclesiástico. «Glorifique ... para gloria de Dios» retiene deliberadamente la repetición conceptual del testimonio.
  issues:
  - severity: medium
    issue: «con tal de que» por «if so be / if indeed»
    rationale: «Con tal de que» suele expresar una condición exigida o estipulada. El testimonio presenta una esperanza condicional o eventual; «si es que» la conserva sin añadir ese matiz.
  - severity: medium
    issue: Ambigüedad en «el fervor de su amor»
    rationale: Tras «Desígnalo», «su amor» puede entenderse como el amor del enviado. El inglés dice «your zealous love» y se refiere a la comunidad; debe explicitarse «de ustedes».
  - severity: low
    issue: «ponga de manifiesto» atenúa «glorify»
    rationale: La expresión española comunica publicidad, pero no la acción de dar gloria o realce que conserva el testimonio. «Glorifique» es adecuado en este registro y preserva la repetición con «para gloria de Dios».
  - severity: low
    issue: «consejo conforme a Dios» puede leerse como consejo o recomendación
    rationale: Aunque es defendible, «asamblea digna de Dios» identifica con más claridad la reunión que Policarpo debe convocar y mantiene el carácter reverente de godly council.
  revised_text: 'Puesto que, según me han informado, la iglesia que está en Antioquía de Siria goza de paz gracias a las oraciones de ustedes, yo también he recibido mayor consuelo, pues Dios ha disipado mi preocupación, si es que mediante el sufrimiento logro alcanzar a Dios, para que, gracias a la intercesión de ustedes, sea hallado discípulo.


    Te corresponde, muy bendecido Policarpo, convocar una asamblea digna de Dios y elegir de entre ustedes a alguien que les sea muy querido y que también sea fervoroso, alguien digno de llevar el nombre de «mensajero de Dios». Desígnalo, digo, para que vaya a Siria y glorifique el amor fervoroso de ustedes para gloria de Dios.


    El cristiano no tiene potestad sobre sí mismo, sino que dedica su tiempo a Dios. Esta obra es de Dios y también de ustedes, cuando la lleven a término; pues confío en la gracia divina que están dispuestos a realizar una buena obra digna de Dios. Como conozco el fervor de la sinceridad de ustedes, los he exhortado en una carta breve.[a]'
  revised_footnotes:
  - marker: a
    text: 'Esta traducción es provisional: se basa en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa del texto griego de la recensión media.'
    reason: La información de la fuente declara expresamente que aún no se ha realizado la revisión en la lengua original; la nota transparenta esa limitación textual.
  revision_rationale: 'Se corrigen únicamente matices seguros contra el testimonio inglés: la modalidad de la esperanza de Ignacio, la referencia comunitaria de «your zealous love», el valor de «glorify» y la identificación de la reunión convocada. Se conserva «sufrimiento», sin imponer «martirio», y no se resuelve mediante doctrina la relación entre la obra de Dios y la de la comunidad. La nota provisional y su ancla se conservan.'
