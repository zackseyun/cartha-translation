review_pass:
  verdict: revise
  source_fidelity: La traducción sigue en general el testimonio inglés, pero «con tal de que» vuelve más restrictiva la condición dubitativa «if so be / if indeed», y «su amor» cambia el posesivo plural de «your zealous love» por uno ambiguo que puede referirse al mensajero. «Consejo conforme a Dios» también puede conservarse, pero «asamblea piadosa» refleja con mayor naturalidad una reunión convocada.
  naturalness: El registro es claro y latinoamericano. «Muy bendecido Policarpo» resulta algo literal; «Policarpo, muy bendito» es más natural y mantiene el tono honorífico. «Sea hallado discípulo» es fiel, aunque marcado; se conserva por su proximidad al testimonio.
  terminology: Se mantienen «iglesia», «gracia divina», «intercesión» y «mensajero de Dios» sin imponer interpretaciones doctrinales. «No tiene autoridad sobre sí mismo» es más idiomático que «no tiene potestad sobre sí mismo» y conserva la fuerza de la expresión.
  issues:
  - severity: medium
    issue: La condición «con tal de que»
    rationale: Puede sugerir una condición exigida o una reserva distinta de la fórmula dubitativa del testimonio («if so be / if indeed»). «Si es que» conserva mejor la modalidad.
  - severity: medium
    issue: «el fervor de su amor»
    rationale: 'El original inglés dice «your zealous love»: el amor pertenece a la comunidad destinataria. El singular «su» es ambiguo y puede atribuirse al delegado.'
  - severity: low
    issue: «muy bendecido Policarpo»
    rationale: Es comprensible, pero el orden es poco natural en español actual. «Policarpo, muy bendito» conserva el vocativo honorífico.
  - severity: low
    issue: «potestad sobre sí mismo»
    rationale: «Autoridad sobre sí mismo» corresponde directamente al testimonio y es más natural en registro moderno.
  revised_text: 'Puesto que, según me han informado, la iglesia que está en Antioquía de Siria goza de paz gracias a las oraciones de ustedes, yo también he recibido mayor consuelo, pues Dios ha disipado mi preocupación, si es que mediante el sufrimiento logro llegar a Dios, para que, por la intercesión de ustedes, sea hallado discípulo.



    Te corresponde, Policarpo, muy bendito, convocar una asamblea piadosa y elegir de entre ustedes a alguien que les sea muy querido y también fervoroso, que sea apto para llevar el nombre de «mensajero de Dios». Desígnalo, digo, para que vaya a Siria y, para gloria de Dios, dé a conocer el amor fervoroso de ustedes.



    El cristiano no tiene autoridad sobre sí mismo, sino que dedica su tiempo a Dios. Esta es obra de Dios y también de ustedes, cuando la lleven a término; pues confío en la gracia divina que están dispuestos a realizar una obra buena digna de Dios. Como conozco el fervor de la sinceridad de ustedes, los he exhortado en una carta breve.[a]'
  revised_footnotes:
  - marker: a
    text: 'Esta traducción es provisional: se basa en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa del texto griego de la recensión media.'
    reason: La fuente indica expresamente que la revisión directa de la tradición manuscrita griega aún está pendiente; la nota comunica esa limitación sin hacer afirmaciones textuales adicionales.
  revision_rationale: 'Se corrigen dos desajustes claros con el testimonio inglés: la modalidad condicional y el posesivo plural referido al amor de la comunidad. Se realizan además ajustes menores de idiomaticidad y precisión léxica, sin resolver mediante interpretación la posible carga martirial de «sufrimiento» ni la formulación teológica sobre llegar a Dios y ser hallado discípulo. Dado que no se aportó el griego, se conserva y explicita la nota de provisionalidad.'
