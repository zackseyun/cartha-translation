source:
  text: 'For when ye are obedient to the bishop as to Jesus Christ, it is evident to me that ye are living not after men but after Jesus Christ, who died for us, that believing on His death ye might escape death.


    It is therefore necessary, even as your wont is, that ye should do nothing without the bishop; but be ye obedient also to the presbytery, as to the Apostles of Jesus Christ our hope; for if we live in Him, we shall also be found in Him.


    And those likewise who are deacons of the mysteries of Jesus Christ must please all men in all ways. For they are not deacons of meats and drinks but servants of the Church of God. It is right therefore that they should beware of blame as of fire.'
