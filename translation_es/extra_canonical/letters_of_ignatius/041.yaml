base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: es
  text: 'Pues, cuando obedecen al obispo como a Jesucristo, me resulta evidente que no viven según los seres humanos, sino según Jesucristo, quien murió por nosotros para que, creyendo en su muerte, escaparan de la muerte.


    Por tanto, es necesario que, como ya acostumbran, no hagan nada sin el obispo. Sean también obedientes al cuerpo de presbíteros[a] como a los apóstoles de Jesucristo, nuestra esperanza; pues, si vivimos en él, también seremos hallados en él.


    Asimismo, quienes son diáconos de los misterios de Jesucristo deben procurar agradar a todos en todo. Porque no son servidores de comidas y bebidas, sino servidores de la iglesia de Dios. Por tanto, es justo que se cuiden de toda acusación[b] como del fuego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «al presbiterio», es decir, al cuerpo colectivo de presbíteros.'
    reason: Conserva la alternativa eclesial tradicional y aclara que el término se refiere a un colectivo, no a un espacio arquitectónico.
  - marker: b
    text: 'También puede traducirse: «reproche» o «motivo de censura».'
    reason: La expresión admite la idea de una acusación, un reproche o una censura; la nota preserva esa amplitud.
lexical_decisions:
- source_word: 'bishop (Greek: episkopos, pending direct review)'
  choice: obispo
  rationale: Es el equivalente histórico y eclesial convencional, comprensible en español y adecuado al contexto de Ignacio.
- source_word: 'presbytery (Greek: presbyterion, pending direct review)'
  choice: consejo de ancianos
  rationale: Expresa el carácter colectivo del término y evita confundirlo con un edificio o con el presbiterio arquitectónico; se conserva «presbiterio» como alternativa en nota.
- source_word: deacons / servants
  choice: diáconos / servidores
  rationale: Distingue el cargo eclesial de los diáconos del sentido general de servicio presente en la contraposición posterior.
- source_word: mysteries
  choice: misterios
  rationale: Mantiene el término religioso sin reducirlo anticipadamente a sacramentos, enseñanzas o ritos específicos.
- source_word: after
  choice: según
  rationale: En «vivir según» comunica de forma natural la idea de regirse por un modelo o principio.
- source_word: blame
  choice: acusación
  rationale: Conserva la posible dimensión de reproche o cargo contra ellos sin afirmar necesariamente culpabilidad.
theological_decisions:
- issue: Comparación de la obediencia al obispo con la obediencia a Jesucristo
  choice: «al obispo como a Jesucristo»
  alternative: «al obispo como obedecen a Jesucristo»
  rationale: Se conserva la formulación fuerte y su tensión eclesiológica, sin convertir la comparación en identidad ni atenuarla.
- issue: Relación entre creer en la muerte de Cristo y escapar de la muerte
  choice: «para que, creyendo en su muerte, escaparan de la muerte»
  alternative: «para que por creer en su muerte pudieran escapar de la muerte»
  rationale: Mantiene la relación final expresada por el testimonio disponible sin explicar qué clase de muerte está en vista.
- issue: «Ser hallados en él»
  choice: «también seremos hallados en él»
  alternative: «también nos encontraremos en él»
  rationale: La formulación pasiva conserva el tono escatológico y la ambigüedad del enunciado.
- issue: Naturaleza de los «misterios de Jesucristo»
  choice: No especificarlos
  alternative: Interpretarlos como sacramentos o enseñanzas
  rationale: El testimonio no permite resolver con seguridad el alcance técnico del término.
- issue: Agradar a todos en todo
  choice: «deben procurar agradar a todos en todo»
  alternative: «deben complacer a todos de todas las maneras»
  rationale: «Procurar agradar» evita la connotación servil moderna de «complacer», pero conserva la amplitud retórica de la exhortación.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usa el plural «ustedes» implícito en las formas verbales. Borrador necesariamente provisional: el material suministrado identifica una tradición manuscrita griega, pero no aporta el texto griego; por ello, las decisiones se basan en el testimonio público de Lightfoot, consultado junto con la capa inglesa POB, y requieren revisión directa de la fuente griega.'
