source:
  text: 'And hidden from the prince of this world were the virginity of Mary and her child-bearing and likewise also the death of the Lord--three mysteries to be cried aloud--the which were wrought in the silence of God. How then were they made manifest to the ages?


    A star shone forth in the heaven above all the stars; and its light was unutterable, and its strangeness caused amazement; and all the rest of the constellations with the sun and moon formed themselves into a chorus about the star; but the star itself far outshone them all; and there was perplexity to know whence came this strange appearance which was so unlike them.


    From that time forward every sorcery and every spell was dissolved, the ignorance of wickedness vanished away, the ancient kingdom was pulled down, when God appeared in the likeness of man unto newness of everlasting life; and that which had been perfected in the counsels of God began to take effect. Thence all things were perturbed, because the abolishing of death was taken in hand.'
