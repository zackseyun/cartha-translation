base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: es
  text: 'Al gobernante de este mundo le quedaron ocultos la virginidad de María, el parto de ella y también la muerte del Señor: tres misterios que debían proclamarse en voz alta, pero que se realizaron en el silencio de Dios. ¿Cómo, entonces, fueron manifestados a las edades?[a]


    Una estrella brilló en el cielo más que todas las estrellas. Su luz era indescriptible, y su aparición extraordinaria causaba asombro. Todos los demás astros, junto con el sol y la luna, formaron un coro alrededor de la estrella; pero ella superaba ampliamente a todos con su resplandor. Y había desconcierto: ¿de dónde venía aquella aparición tan extraordinaria y tan distinta de los demás astros?


    Desde entonces quedó deshecha toda hechicería y roto todo encantamiento; desapareció la ignorancia propia de la maldad y fue derribado el antiguo reino, cuando Dios se manifestó como ser humano para traer la novedad de la vida eterna. Lo que había sido dispuesto por Dios comenzó a realizarse. Desde entonces todo entró en conmoción, porque se había emprendido la destrucción de la muerte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «¿Cómo, entonces, fueron manifestados a los siglos?». La expresión puede referirse a las edades del mundo o, por extensión, a sus habitantes.'
    reason: Preserva la amplitud semántica de αἰῶσιν, que una sola formulación española no reproduce por completo.
lexical_decisions:
- source_word: ἄρχων τοῦ αἰῶνος τούτου
  choice: gobernante de este mundo
  rationale: Conserva el título cósmico sin identificar de forma interpretativa a su referente; «mundo» comunica aquí el sentido temporal-cósmico de αἰών en español natural.
- source_word: ὁ τοκετὸς αὐτῆς
  choice: el parto de ella
  rationale: Mantiene la referencia concreta al acto de dar a luz y el paralelismo con «la virginidad de María», sin convertirla simplemente en «su hijo».
- source_word: τρία μυστήρια κραυγῆς
  choice: tres misterios que debían proclamarse en voz alta
  rationale: Expresa el giro griego condensado y su contraste deliberado con «el silencio de Dios».
- source_word: παραδόξου
  choice: extraordinaria
  rationale: Comunica la cualidad sorprendente y fuera de lo común sin sugerir necesariamente una contradicción lógica, como podría hacerlo «paradójica».
- source_word: πᾶσα μαγεία ... καὶ πᾶς δεσμός
  choice: toda hechicería ... todo encantamiento
  rationale: Distingue las dos expresiones mágicas; «encantamiento» resulta más comprensible que el literal «atadura» en este contexto.
- source_word: θεοῦ ἀνθρωπίνως φανερουμένου
  choice: cuando Dios se manifestó como ser humano
  rationale: Conserva la afirmación elevada y directa acerca de Dios, expresando naturalmente el adverbio «humanamente» sin ampliar su alcance doctrinal.
- source_word: μελέτη θανάτου καταλύσεως
  choice: se había emprendido la destrucción de la muerte
  rationale: Retiene la idea de que la abolición de la muerte estaba siendo puesta en marcha, sin afirmar que ya hubiera quedado plenamente consumada.
theological_decisions:
- issue: Identidad del «gobernante de este mundo»
  choice: Se conserva el título sin identificar al personaje.
  alternative: Traducir o glosar «Satanás».
  rationale: El texto no nombra explícitamente a Satanás; mantener el título preserva su formulación y evita cerrar una referencia implícita.
- issue: Relación entre proclamación y silencio
  choice: 'Se mantiene la tensión: los misterios debían proclamarse, aunque fueron realizados en el silencio de Dios.'
  alternative: Entender «misterios de clamor» solo como hechos asombrosos.
  rationale: La formulación preserva el contraste retórico del pasaje sin resolverlo mediante una paráfrasis explicativa.
- issue: Manifestación de Dios
  choice: «Dios se manifestó como ser humano».
  alternative: «Dios apareció en semejanza humana».
  rationale: La elección refleja el carácter adverbial de ἀνθρωπίνως y no debilita la identificación del sujeto como Dios; tampoco añade terminología cristológica posterior.
- issue: Estado de la destrucción de la muerte
  choice: Se presenta como una obra emprendida.
  alternative: «La muerte fue abolida».
  rationale: El cierre parece destacar el inicio o puesta en marcha de esa destrucción, no simplemente declararla ya concluida.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el tono cósmico, las repeticiones y las tensiones del pasaje, evitando vocabulario confesional añadido. Debido a que el expediente indica que la revisión directa de la tradición griega de recensión media sigue pendiente, las decisiones se cotejaron con la forma griega comúnmente atestiguada del pasaje, pero deben auditarse contra el testimonio manuscrito seleccionado antes de publicación definitiva.
