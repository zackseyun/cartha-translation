base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: es
  text: 'Ya no deseo vivir a la manera de los seres humanos, y esto sucederá si ustedes lo desean. Deséenlo, para que también ustedes sean objeto de deseo.[a] En esta breve carta se lo ruego: créanme.


    Jesucristo les hará ver claramente que digo la verdad: Jesucristo, la boca que no yerra, por medio de quien el Padre ha hablado [verdaderamente].[b]


    Rueguen por mí, para que llegue a la meta [por medio del Espíritu Santo].[c] No les escribo según la carne, sino según el pensamiento de Dios. Si sufro, fue porque ustedes lo desearon; si soy rechazado, fue porque ustedes me odiaron.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión «sean objeto de deseo» conserva una construcción ambigua del testimonio: no se especifica quién los desearía ni en qué sentido.'
    reason: Preservar una ambigüedad genuina y el juego repetido con el verbo «desear».
  - marker: b
    text: La palabra «verdaderamente» aparece entre corchetes en el testimonio utilizado, lo que indica incertidumbre textual o editorial. La revisión directa del griego sigue pendiente.
    reason: Señalar con transparencia el carácter provisional del término entre corchetes.
  - marker: c
    text: La frase «por medio del Espíritu Santo» aparece entre corchetes en el testimonio utilizado. Además, el texto no expresa aquí qué meta espera alcanzar Ignacio.
    reason: Conservar tanto la incertidumbre editorial como el objeto implícito del verbo.
  - marker: d
    text: Estas frases finales vinculan retóricamente el sufrimiento de Ignacio con el deseo de sus lectores, y su rechazo con el odio de ellos; no se aclara aquí el sentido preciso de «rechazado».
    reason: Evitar resolver una tensión contextual con una paráfrasis interpretativa.
lexical_decisions:
- source_word: after the manner of men
  choice: a la manera de los seres humanos
  rationale: Conserva el contraste del testimonio sin usar «hombres» en sentido genérico, y mantiene un registro natural y digno.
- source_word: may be desired
  choice: sean objeto de deseo
  rationale: Preserva la voz pasiva y la deliberada repetición de «desear», sin identificar de manera especulativa quién los desearía.
- source_word: unerring mouth
  choice: la boca que no yerra
  rationale: Mantiene la metáfora cristológica y expresa la ausencia de error con lenguaje claro, sin convertirla en una formulación doctrinal más técnica.
- source_word: attain
  choice: llegue a la meta
  rationale: Expresa la idea de alcanzar el fin buscado sin precisar en el texto aquello que el testimonio deja implícito.
- source_word: after the flesh
  choice: según la carne
  rationale: Conserva el lenguaje teológico tradicional y el contraste explícito con el pensamiento de Dios.
- source_word: mind of God
  choice: pensamiento de Dios
  rationale: Es una expresión comprensible que conserva la referencia a la intención o manera de pensar divina sin introducir «voluntad» como resolución interpretativa.
theological_decisions:
- issue: Sentido de «para que también ustedes sean objeto de deseo»
  choice: Mantener la formulación pasiva y ambigua
  alternative: «para que Dios también los desee» o «para que también ustedes alcancen lo que desean»
  rationale: El testimonio suministrado no identifica al agente ni elimina el juego verbal; explicitarlo importaría una interpretación no demostrada.
- issue: Jesucristo como «boca» por medio de quien habla el Padre
  choice: Conservar la metáfora y traducir «in whom» como «por medio de quien»
  alternative: «en quien el Padre ha hablado»
  rationale: «Por medio de quien» comunica en español natural la función mediadora del Hijo sin borrar la imagen de Jesús como boca infalible del Padre.
- issue: Objeto implícito de «llegue a la meta»
  choice: Dejar la meta sin especificar
  alternative: «alcance el martirio» o «alcance a Dios»
  rationale: Aunque el contexto amplio puede orientar la interpretación, el segmento citado no nombra expresamente la meta; se conserva esa apertura.
- issue: Condicionales finales y responsabilidad de los destinatarios
  choice: «Si sufro, fue porque ustedes lo desearon; si soy rechazado, fue porque ustedes me odiaron»
  alternative: «Si llego a padecer, será por voluntad de ustedes; si no lo logro, será por odio de ustedes»
  rationale: La formulación mantiene la tensión retórica del testimonio entre deseo y odio sin suavizar la acusación ni precisar indebidamente qué significa ser rechazado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y «seres humanos» para el genérico. El borrador es necesariamente provisional porque la base proporcionada es un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega de recensión media está pendiente. Los corchetes del testimonio se conservan y se explican mediante notas.
