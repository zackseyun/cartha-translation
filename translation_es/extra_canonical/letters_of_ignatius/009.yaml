base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: es
  text: 'Por tanto, que nadie los engañe; y, en efecto, ustedes no se dejan engañar, pues pertenecen por completo a Dios. Cuando no se arraiga en ustedes ningún deseo capaz de atormentarlos, entonces viven verdaderamente conforme a Dios. Me entrego por ustedes y me consagro como ofrenda por la iglesia de ustedes, los efesios, cuya fama perdura por todos los siglos.[a]


    Los que son de la carne no pueden hacer las cosas del Espíritu, ni los que son del Espíritu pueden hacer las cosas de la carne. Del mismo modo, la fe no puede hacer las cosas propias de la incredulidad, ni la incredulidad las propias de la fe. Más aún, incluso lo que hacen conforme a la carne es espiritual, porque todo lo hacen en Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulación de la entrega sacrificial de Ignacio y la expresión «por todos los siglos» son provisionales; requieren cotejo directo con la tradición manuscrita griega de la recensión media.
    reason: El material suministrado identifica expresamente el testimonio inglés de dominio público como base provisional y señala que la revisión del griego está pendiente.
lexical_decisions:
- source_word: lust / desire (English witness)
  choice: deseo
  rationale: «Deseo» conserva la amplitud del testimonio inglés sin añadir necesariamente una connotación sexual, que «lujuria» impondría.
- source_word: after God
  choice: conforme a Dios
  rationale: Expresa de manera natural la idea de vivir de acuerdo con Dios, sin convertirla en una afirmación más específica.
- source_word: of the flesh / things of the flesh
  choice: de la carne / cosas de la carne
  rationale: Mantiene el contraste teológico tradicional con el Espíritu y evita reducir «carne» simplemente al cuerpo físico.
- source_word: unfaithfulness
  choice: incredulidad
  rationale: En el paralelismo con «fe», «incredulidad» comunica mejor el polo contrario que «infidelidad», la cual podría entenderse ante todo en sentido conyugal.
- source_word: in Jesus Christ
  choice: en Jesucristo
  rationale: Conserva la formulación participativa y teológica, sin explicarla como mera imitación o autoridad.
theological_decisions:
- issue: Contraste entre carne y Espíritu
  choice: Conservar literalmente «carne» y «Espíritu»
  alternative: Interpretar «carne» como «naturaleza pecaminosa» o como «acciones físicas»
  rationale: 'El pasaje mantiene una tensión deliberada: aun lo hecho «conforme a la carne» puede ser espiritual cuando se hace en Jesucristo. Una paráfrasis doctrinal eliminaría esa tensión.'
- issue: Sentido sacrificial de la entrega de Ignacio
  choice: «Me entrego por ustedes y me consagro como ofrenda»
  alternative: «Soy su rescate» o «soy la escoria de ustedes»
  rationale: Sigue el testimonio inglés suministrado y comunica el lenguaje de entrega sacrificial sin fijar una imagen cuya forma griega requiere revisión directa.
- issue: Pertenencia total a Dios
  choice: «pertenecen por completo a Dios»
  alternative: «son enteramente de Dios»
  rationale: La opción elegida es natural en español y conserva la afirmación de pertenencia sin desarrollar una doctrina específica de posesión o santificación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conserva el vocabulario teológico «carne», «Espíritu», «fe» e «incredulidad». La redacción es provisional porque el material proporcionado no incluye el texto griego y declara pendiente su revisión directa.
