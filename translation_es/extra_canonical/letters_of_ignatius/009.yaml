review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés suministrado y conserva adecuadamente los contrastes deliberados entre carne/Espíritu y fe/incredulidad. Conviene, sin embargo, evitar convertir «ye are not deceived» en el sentido habitual o reflexivo de «no se dejan engañar»; el testimonio expresa más directamente el estado pasivo «no están engañados». También se ajusta la relación de Ignacio con la iglesia para reflejar «for ... the church» sin introducir un posesivo ambiguo.
  naturalness: El español es generalmente claro, digno y natural para América Latina. «La iglesia de ustedes, los efesios» resulta algo forzado; «la iglesia de ustedes, efesios» es más fluido y conserva el destinatario vocativo. Se mantiene «se arraiga» por su naturalidad, aunque es una leve explicitación metafórica de «is established».
  terminology: «Deseo», «conforme a Dios», «carne», «Espíritu», «fe», «incredulidad» y «en Jesucristo» son elecciones apropiadas y no imponen una interpretación doctrinal. «Ofrenda» conserva prudentemente el lenguaje sacrificial del testimonio puente.
  issues:
  - severity: medium
    issue: «Ustedes no se dejan engañar»
    rationale: El inglés dice «you are not deceived», una afirmación pasiva de estado. «No se dejan engañar» puede sugerir que resisten activamente intentos de engaño o que se trata de un hábito. «No están engañados» conserva mejor la formulación.
  - severity: low
    issue: «La iglesia de ustedes, los efesios»
    rationale: La construcción con «los efesios» es menos natural después del posesivo y puede leerse como una identificación explicativa innecesaria. El vocativo «efesios» permite conservar el vínculo con los destinatarios sin alterar el alcance de «church».
  revised_text: 'Por tanto, que nadie los engañe; en efecto, ustedes no están engañados, pues pertenecen por completo a Dios. Cuando no se arraiga en ustedes ningún deseo capaz de atormentarlos, entonces viven verdaderamente conforme a Dios. Me entrego por ustedes y me consagro como ofrenda por la iglesia de ustedes, efesios, cuya fama perdura por todos los siglos.[a]


    Los que son de la carne no pueden hacer las cosas del Espíritu, ni los que son del Espíritu pueden hacer las cosas de la carne. Del mismo modo, la fe no puede hacer las cosas propias de la incredulidad, ni la incredulidad las propias de la fe. Más aún, incluso lo que hacen conforme a la carne es espiritual, porque todo lo hacen en Jesucristo.'
  revised_footnotes:
  - marker: a
    text: La formulación de la entrega sacrificial de Ignacio y la expresión «por todos los siglos» son provisionales; requieren cotejo directo con la tradición manuscrita griega de la recensión media.
    reason: El material suministrado identifica expresamente el testimonio inglés de dominio público como base provisional y señala que la revisión del griego está pendiente.
  revision_rationale: Se hacen dos correcciones seguras de fidelidad y fluidez basadas en el testimonio inglés disponible. No se resuelven cuestiones que dependan del cotejo directo con el griego de la recensión media, y se preserva la nota de provisionalidad correspondiente.
