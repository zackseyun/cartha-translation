review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva el argumento, los contrastes «carne/Espíritu» y «fe/incredulidad», así como la cláusula final «en Jesucristo». Sin embargo, «no se dejan engañar» desplaza la afirmación del texto («no son engañados») hacia una disposición voluntaria, y «las cosas propias de» añade un matiz que no está expresado en el testimonio base. La formulación de la autodedicación se mantiene necesariamente provisional: el propio expediente solo aporta el testimonio inglés y señala que falta el cotejo directo de la recensión griega media.'
  naturalness: El registro es claro y apropiado para español latinoamericano neutral. Se mejora la sintaxis de la primera frase y la designación de la iglesia destinataria para que suenen naturales sin perder la relación posesiva y apelativa del texto.
  terminology: Se mantienen «deseo», «carne», «Espíritu», «fe», «incredulidad» y «Jesucristo». «Conforme a Dios» y «conforme a la carne» reflejan adecuadamente el lenguaje relacional del testimonio inglés. «Consagro como ofrenda» conserva, de forma prudente, la imagen sacrificial transmitida por la base inglesa.
  issues:
  - severity: medium
    issue: «ustedes no se dejan engañar»
    rationale: El giro reflexivo puede significar que los destinatarios rechazan activamente el engaño. El testimonio dice «you are not deceived», una afirmación de estado que se refleja mejor con «no son engañados».
  - severity: low
    issue: «las cosas propias de la incredulidad/la fe»
    rationale: «Propias de» introduce una caracterización adicional. «Las cosas de» conserva el paralelismo deliberadamente escueto del testimonio.
  - severity: low
    issue: «cuya fama perdura por todos los siglos»
    rationale: «Perdura» explicita continuidad temporal; «es célebre en todas las edades» conserva más directamente el predicado de fama del testimonio inglés.
  revised_text: 'Por tanto, que nadie los engañe, así como de hecho ustedes no son engañados, pues pertenecen por completo a Dios. Porque, cuando ningún deseo capaz de atormentarlos se establece en ustedes, entonces viven verdaderamente conforme a Dios. Me entrego por ustedes y me consagro como ofrenda por la iglesia de ustedes, los efesios, que es célebre en todas las edades.[a]



    Los que son de la carne no pueden hacer las cosas del Espíritu, ni los que son del Espíritu pueden hacer las cosas de la carne; así como la fe no puede hacer las cosas de la incredulidad, ni la incredulidad las cosas de la fe. Es más, incluso las cosas que hacen conforme a la carne son espirituales, porque todo lo hacen en Jesucristo.'
  revised_footnotes:
  - marker: a
    text: La formulación de la entrega sacrificial de Ignacio y la expresión «en todas las edades» son provisionales; requieren cotejo directo con la tradición manuscrita griega de la recensión media.
    reason: El material suministrado identifica expresamente el testimonio inglés de dominio público como base provisional y señala que la revisión del griego está pendiente.
  revision_rationale: Se corrigen pequeños desplazamientos semánticos y se hace más uniforme el paralelismo retórico del pasaje, sin resolver de manera especulativa los detalles de la frase de autodedicación mientras no se aporte el texto griego para su cotejo directo. Se conserva el ancla de nota existente y se ajusta su redacción a la formulación revisada.
