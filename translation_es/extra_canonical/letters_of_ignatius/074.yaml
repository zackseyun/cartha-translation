    Dichoso en Jesucristo es el que sea considerado digno de tal servicio; y ustedes mismos también serán glorificados. Si desean hacerlo, no les es imposible llevarlo a cabo por el nombre de Dios, así como las iglesias más cercanas han enviado obispos, y otras, presbíteros y diáconos.[b]'
