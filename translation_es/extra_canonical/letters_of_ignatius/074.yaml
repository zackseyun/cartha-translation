base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: es
  text: 'Puesto que, en respuesta a la oración de ustedes y al tierno afecto que tienen en Cristo Jesús, se me ha informado que la iglesia que está en Antioquía de Siria vive en paz, conviene que ustedes, como iglesia de Dios, designen a un diácono para que vaya allá como embajador de Dios, a fin de que, cuando ellos estén reunidos, los felicite y glorifique el Nombre.[a]


    Dichoso en Jesucristo el que sea considerado digno de tal servicio; y ustedes mismos también serán glorificados. Si desean hacerlo, no les es imposible llevarlo a cabo por el nombre de Dios, así como las iglesias más cercanas han enviado obispos, y otras, presbíteros y diáconos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «El Nombre» reproduce la expresión reverente del testimonio, que no identifica aquí de manera explícita su referente.
    reason: Preservar la elipsis y la ambigüedad teológica del texto.
  - marker: b
    text: Este borrador se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: Transparentar la base documental provisional y el límite de la evidencia disponible.
lexical_decisions:
- source_word: tender sympathy (Greek review pending)
  choice: tierno afecto
  rationale: Comunica una compasión entrañable y activa en español natural, sin reducirla a mera lástima.
- source_word: hath peace (Greek review pending)
  choice: vive en paz
  rationale: Expresa de manera idiomática la condición pacificada de la iglesia, probablemente tras una perturbación.
- source_word: God's ambassador (Greek review pending)
  choice: embajador de Dios
  rationale: Conserva la imagen representativa y solemne del testimonio inglés.
- source_word: ministration (Greek review pending)
  choice: servicio
  rationale: Es comprensible para lectores actuales y mantiene el sentido de una tarea ministerial sin imponer una tecnicidad posterior.
- source_word: presbyters
  choice: presbíteros
  rationale: Mantiene el título eclesial antiguo y evita identificarlo sin más con desarrollos denominacionales posteriores.
- source_word: the Name
  choice: el Nombre
  rationale: La mayúscula conserva la referencia reverente e implícita a Dios o a Cristo sin explicitar lo que el texto deja elíptico.
theological_decisions:
- issue: Referente de «el Nombre»
  choice: Conservar «el Nombre» sin complemento explicativo
  alternative: «el nombre de Dios» o «el nombre de Jesucristo»
  rationale: El testimonio distingue «the Name» de la frase posterior «the name of God»; explicitar el referente eliminaría una ambigüedad significativa.
- issue: Naturaleza de la paz de la iglesia de Antioquía
  choice: «vive en paz»
  alternative: «ha alcanzado la paz»
  rationale: No se precisa la causa ni el proceso de pacificación, por lo que se conserva el énfasis en el estado presente.
- issue: Títulos ministeriales antiguos
  choice: «diácono», «obispos», «presbíteros y diáconos»
  alternative: Sustituirlos por equivalentes funcionales modernos
  rationale: Se preservan las denominaciones históricas sin definir sus funciones según una tradición eclesial posterior.
- issue: Glorificación de los destinatarios
  choice: «ustedes mismos también serán glorificados»
  alternative: «recibirán honor»
  rationale: La formulación más fuerte conserva la tensión teológica del testimonio y evita rebajarla a simple reconocimiento humano.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y sintaxis clara, conservando el tono exhortativo y eclesial. La traducción es provisional porque la revisión directa del griego está pendiente; no se introducen precisiones denominacionales ajenas al testimonio suministrado.
