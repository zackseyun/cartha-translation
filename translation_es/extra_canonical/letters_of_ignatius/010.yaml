base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: es
  text: 'Pero me he enterado de que ciertas personas pasaron por entre ustedes desde allá, llevando una enseñanza perversa. Ustedes no les permitieron sembrar en ustedes, sino que se taparon los oídos para no recibir lo sembrado por ellos. Pues son piedras del templo del Padre, preparadas de antemano para la edificación de Dios Padre; son elevadas hasta las alturas por el mecanismo de elevación de Jesucristo, que es la cruz, y usan como cuerda al Espíritu Santo. Su fe es su torno, y el amor es el camino que conduce hacia Dios.


    Así pues, todos ustedes son compañeros de camino, portadores de Dios, de templo, de Cristo y de cosas santas, adornados por completo con los mandamientos de Jesucristo. También yo, al participar en la celebración, tengo permitido acompañarlos por carta y alegrarme con ustedes, para que no amen nada conforme a la vida humana, sino solo a Dios.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evil doctrine
  choice: enseñanza perversa
  rationale: Comunica una doctrina moral y espiritualmente dañina sin recurrir a terminología confesional posterior.
- source_word: stones of a temple
  choice: piedras de un templo
  rationale: Conserva literalmente la imagen arquitectónica que estructura todo el pasaje.
- source_word: engine
  choice: máquina
  rationale: Mantiene la metáfora de un mecanismo antiguo de elevación; «instrumento» sería más fluido, pero debilitaría la imagen mecánica desarrollada con cuerda y torno.
- source_word: windlass
  choice: torno
  rationale: Designa de manera comprensible el mecanismo que enrolla una cuerda para levantar peso y encaja con la metáfora constructiva.
- source_word: companions in the way
  choice: compañeros de camino
  rationale: Expresión natural que conserva tanto la marcha compartida como la posible resonancia del camino de vida cristiano.
- source_word: shrine
  choice: santuario
  rationale: Preserva la referencia cultual sin identificarla necesariamente con un edificio completo o con una denominación posterior.
- source_word: holy things
  choice: cosas santas
  rationale: Conserva la amplitud y la extrañeza de la enumeración, sin precisar referentes que el testimonio suministrado no define.
theological_decisions:
- issue: Relación entre la cruz, el Espíritu, la fe y el amor dentro de la alegoría de construcción
  choice: Conservar cada elemento como parte distinta del mecanismo y del ascenso
  alternative: Reformular la alegoría como una explicación doctrinal unificada
  rationale: El pasaje yuxtapone imágenes tensas —máquina, cuerda, torno y camino—; armonizarlas borraría la forma retórica y podría imponer una interpretación teológica.
- issue: La comunidad «lleva» a Dios, el santuario, Cristo y las cosas santas
  choice: Mantener la afirmación concreta «llevan consigo»
  alternative: Interpretarla como «llevan en su interior» o «representan»
  rationale: El lenguaje es deliberadamente denso y cultual; añadir una localización o explicación resolvería una ambigüedad genuina.
- issue: Contraste final entre la vida humana común y Dios
  choice: Traducir «no ponen su amor en nada propio de la vida común de los seres humanos»
  alternative: Traducir «no aman nada conforme a la vida humana ordinaria»
  rationale: La formulación elegida conserva el contraste sin sugerir que toda vida humana ordinaria sea en sí misma mala.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la extensa alegoría arquitectónica y mecánica, aunque resulte inusual. Dado que la revisión directa del griego de la recensión media está pendiente y solo se proporcionó un testimonio inglés, este borrador debe considerarse provisional y sujeto a cotejo con el texto griego.
