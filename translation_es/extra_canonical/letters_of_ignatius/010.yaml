revisions:
- from: 'Pero me he enterado de que ciertas personas, procedentes de allá, pasaron entre ustedes llevando una enseñanza perversa. Ustedes no les permitieron sembrar en su interior, sino que se taparon los oídos para no recibir la semilla que ellos sembraban. Porque ustedes son piedras de un templo, preparadas de antemano para la edificación de Dios Padre. Son elevados hasta lo alto por la máquina de Jesucristo, que es la cruz, y emplean como cuerda al Espíritu Santo. Su fe es el torno, y el amor es el camino que conduce hacia Dios.


    Así pues, todos ustedes son compañeros de camino: llevan consigo a su Dios y su santuario, a su Cristo y sus cosas santas, y están revestidos de pies a cabeza con los mandamientos de Jesucristo. También a mí, que participo de la celebración, se me permite acompañarlos por medio de esta carta y alegrarme con ustedes, porque no ponen su amor en nada propio de la vida común de los seres humanos, sino únicamente en Dios.'
