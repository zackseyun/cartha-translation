source:
  text: 'But I have learned that certain persons passed through you from yonder, bringing evil doctrine; whom ye suffered not to sow seed in you, for ye stopped your ears, so that ye might not receive the seed sown by them; forasmuch as ye are stones of a temple, which were prepared beforehand for a building of God the Father, being hoisted up to the heights through the engine of Jesus Christ, which is the Cross, and using for a rope the Holy Spirit; while your faith is your windlass, and love is the way that leadeth up to God.


    So then ye are all companions in the way, carrying your God and your shrine, your Christ and your holy things, being arrayed from head to foot in the commandments of Jesus Christ. And I too, taking part in the festivity, am permitted by letter to bear you company and to rejoice with you, that ye set not your love on anything after the common life of men, but only on God.'
