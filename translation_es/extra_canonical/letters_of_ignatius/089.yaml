revisions:
- from: 'Saludo a las familias de mis hermanos, junto con sus esposas e hijos, y a las vírgenes llamadas viudas.[a] Les deseo que estén bien en el poder del Padre. Filón, que está conmigo, los saluda.


    Saludo a la familia de Tavia, y ruego que ella permanezca firmemente arraigada en la fe y en el amor, tanto en la carne como en el espíritu.[b] Saludo a Alce, nombre que me es muy querido; al incomparable Dafno; a Eutecno, y a todos, uno por uno. Que estén bien en la gracia de Dios.'
  to: 'Saludo a las familias de mis hermanos, junto con sus esposas e hijos, y a las vírgenes llamadas viudas.[a] Que estén bien en el poder del Padre. Filón, que está conmigo, los saluda.


    Saludo a la familia de Tavia, y ruego que ella permanezca firmemente arraigada en la fe y el amor —carnales y espirituales—. Saludo a Alce, nombre que me es muy querido; al incomparable Dafno; a Eutecno y a todos por nombre. Que estén bien en la gracia de Dios.'
  rationale: Se ajusta la sintaxis de la oración sobre Tavia para reflejar que «carnales y espirituales» califica «fe y amor». Se elimina la nota b, pues la versión revisada ya expresa esa relación sin necesidad de proponer una ambigüedad no exigida por el testimonio inglés. También se sustituye «uno por uno» por «por nombre» para una equivalencia más directa.
