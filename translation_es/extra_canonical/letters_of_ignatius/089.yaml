base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: es
  text: 'Saludo a las familias de mis hermanos, junto con sus esposas e hijos, y a las vírgenes llamadas viudas.[a] Que estén bien en el poder del Padre. Filón, que está conmigo, los saluda.


    Saludo a la familia de Tavia, y ruego que ella permanezca firmemente arraigada en la fe y el amor —carnales y espirituales—. Saludo a Alce, nombre que me es muy querido; al incomparable Dafno; a Eutecno y a todos por nombre. Que estén bien en la gracia de Dios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «vírgenes llamadas viudas» quizá designe una categoría reconocida dentro de la comunidad, pero su sentido exacto no es seguro.
    reason: Preserva y señala una expresión históricamente ambigua sin imponer una identificación institucional.
lexical_decisions:
- source_word: households
  choice: familias
  rationale: En español latinoamericano actual, «familias» comunica con naturalidad el grupo doméstico sin reducirlo al edificio de la casa.
- source_word: brethren
  choice: hermanos
  rationale: Conserva el lenguaje comunitario y afectivo del testimonio, sin añadir una interpretación denominacional.
- source_word: virgins who are called widows
  choice: vírgenes llamadas viudas
  rationale: Mantiene literalmente la expresión inusual y su posible referencia a una categoría eclesial, sin resolverla en el texto.
- source_word: grounded
  choice: permanezca firmemente arraigada
  rationale: Expresa la imagen de estabilidad y fundamento de manera idiomática y digna.
- source_word: both of flesh and of spirit
  choice: tanto en la carne como en el espíritu
  rationale: Preserva la tensión y el paralelismo antropológico del testimonio, evitando explicar de más.
- source_word: all by name
  choice: a todos, uno por uno
  rationale: Comunica que el saludo se dirige personalmente a cada integrante, con naturalidad en español.
- source_word: Fare ye well
  choice: Que estén bien
  rationale: Refleja la fórmula de despedida sin recurrir al arcaico «adiós» ni añadir contenido ausente.
theological_decisions:
- issue: Identidad de las «vírgenes llamadas viudas»
  choice: Conservar la formulación y añadir una nota de ambigüedad
  alternative: Interpretarlas explícitamente como integrantes de una orden eclesial de viudas
  rationale: La evidencia proporcionada no permite determinar si «viudas» era un título comunitario o una descripción de estado civil.
- issue: Relación entre carne y espíritu
  choice: Mantener «tanto en la carne como en el espíritu»
  alternative: Parafrasear como amor material y espiritual o como fe y amor corporales y espirituales
  rationale: La construcción admite más de una relación sintáctica y conceptual; la traducción no debe resolverla silenciosamente.
- issue: «Poder del Padre»
  choice: Conservar «en el poder del Padre»
  alternative: Parafrasear como «fortalecidos por el Padre»
  rationale: La expresión teológica del testimonio es clara y no requiere expansión interpretativa.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron los nombres propios en formas hispanizadas transparentes: Filón, Dafno y Eutecno; Tavia y Alce se mantuvieron. Dado que la revisión directa del griego está pendiente, las decisiones se basan provisionalmente en el testimonio público de Lightfoot y en la capa de consulta inglesa, y las ambigüedades relevantes se señalan mediante notas.'
