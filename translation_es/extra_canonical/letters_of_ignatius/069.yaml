base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: es
  text: 'Hermanos míos, mi corazón se desborda por completo de amor hacia ustedes y, lleno de una alegría indescriptible, velo por su seguridad; pero no soy yo, sino Jesucristo. Al llevar sus cadenas, siento aún más temor, porque todavía no he alcanzado la perfección. Pero la oración de ustedes me hará perfecto para Dios[a], a fin de que alcance la herencia en la que he recibido misericordia, refugiándome en el evangelio como en la carne de Jesús, y en los apóstoles como en el consejo de ancianos de la iglesia.


    También amamos a los profetas, porque ellos igualmente anunciaron el evangelio con su predicación, pusieron su esperanza en Cristo y lo esperaron. Por haber creído en él, también fueron salvados en la unidad de Jesucristo. Eran santos dignos de todo amor y admiración, aprobados por Jesucristo e incluidos en el evangelio de nuestra esperanza común.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Para Dios» aparece como una restauración señalada entre corchetes en el testimonio inglés utilizado; la revisión directa del griego está pendiente.
    reason: Preservar de forma transparente la señal textual del testimonio disponible y no presentar una restauración como lectura segura.
lexical_decisions:
- source_word: safety (Greek source review pending)
  choice: seguridad
  rationale: Conserva el sentido amplio del testimonio inglés sin reducirlo necesariamente a salvación espiritual ni limitarlo a protección física.
- source_word: bonds
  choice: cadenas
  rationale: Expresa de manera natural el encarcelamiento de Ignacio y conserva la imagen concreta de estar encadenado por Cristo.
- source_word: Gospel
  choice: evangelio
  rationale: Se mantiene en minúscula porque aquí puede referirse al mensaje proclamado, no necesariamente a un libro específico.
- source_word: presbytery
  choice: consejo de ancianos
  rationale: Comunica la idea corporativa de un cuerpo o consejo de ancianos, evitando convertir el término en un título denominacional moderno.
- source_word: numbered together in the Gospel
  choice: incluidos en el evangelio
  rationale: Conserva la incorporación de los profetas al ámbito del evangelio y de la esperanza común sin imponer una explicación más específica.
theological_decisions:
- issue: El evangelio como carne de Jesús
  choice: el evangelio como en la carne de Jesús
  alternative: el evangelio, que es la carne de Jesús
  rationale: La formulación comparativa conserva la imagen intensa de Ignacio sin convertirla en una identificación doctrinal más categórica de lo que permite el testimonio.
- issue: La salvación de los profetas
  choice: Por haber creído en él, también fueron salvados en la unidad de Jesucristo
  alternative: Al creer en él, se salvaron mediante la unidad de Jesucristo
  rationale: Mantiene juntas la fe en Cristo, la salvación y la unidad con él, sin precisar indebidamente la relación causal entre estas expresiones.
- issue: Perfección para Dios
  choice: me hará perfecto para Dios[a]
  alternative: me perfeccionará ante Dios
  rationale: Conserva la restauración señalada entre corchetes por el testimonio y evita ocultar su condición textual.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y una sintaxis clara, procurando conservar las imágenes y tensiones del pasaje. Este borrador es necesariamente provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa de la tradición manuscrita griega de la recensión media sigue pendiente.'
