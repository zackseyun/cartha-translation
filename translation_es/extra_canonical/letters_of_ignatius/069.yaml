review_pass:
  verdict: revise
  source_fidelity: La revisión se limita al testimonio inglés suministrado, ya que la revisión directa del griego de la recensión media sigue pendiente. El borrador conserva en general la secuencia argumental y las imágenes del pasaje, pero «alegría indescriptible» intensifica indebidamente «rejoicing above measure». También conviene conservar más de cerca la expresión inclusiva «numbered together» y explicitar «holy men» sin añadir interpretación doctrinal.
  naturalness: 'El español es claro y adecuado para un registro epistolar digno y latinoamericano neutral. Se ajustan algunas formulaciones para que sean naturales sin perder las comparaciones abruptas y características del texto: «como en la carne de Jesús» y «como en el consejo de ancianos de la iglesia».'
  terminology: Se mantienen «evangelio», «apóstoles», «consejo de ancianos» y «Jesucristo». «Consejo de ancianos» sigue siendo una equivalencia funcional y no denominacional de «presbytery». La frase restaurada se presenta entre corchetes en el texto, tal como la señala el testimonio inglés.
  issues:
  - severity: medium
    issue: «Lleno de una alegría indescriptible» traduce «rejoicing above measure».
    rationale: «Indescriptible» significa que la alegría no puede expresarse, mientras que el testimonio dice que el gozo excede la medida. «Con un gozo sin medida» conserva el sentido sin intensificarlo de otro modo.
  - severity: low
    issue: La restauración textual [unto God] no se conserva visualmente entre corchetes en el texto español.
    rationale: La nota explica la señal, pero reproducir los corchetes en «[para Dios]» hace transparente que se trata de una restauración del testimonio y no de una lectura presentada como segura.
  - severity: low
    issue: «Incluidos en el evangelio» atenúa «numbered together in the Gospel».
    rationale: «Contados juntamente» preserva mejor la imagen de ser incorporados o enumerados en conjunto, aunque resulte algo más formal; se mantiene una redacción española legible.
  - severity: low
    issue: «Eran santos» omite «as holy men».
    rationale: «Como hombres santos» conserva la caracterización personal presente en el testimonio, sin introducir una categoría eclesial posterior.
  revised_text: 'Hermanos míos, mi corazón se desborda por completo de amor hacia ustedes y, con un gozo sin medida, velo por su seguridad; pero no yo, sino Jesucristo. Al llevar sus cadenas, temo aún más, porque todavía no he sido perfeccionado. Pero la oración de ustedes me perfeccionará [para Dios][a], a fin de que alcance la herencia en la que he recibido misericordia, refugiándome en el evangelio como en la carne de Jesús, y en los apóstoles como en el consejo de ancianos de la iglesia.


    También amamos a los profetas, porque ellos también señalaron al evangelio en su predicación, pusieron su esperanza en él y lo esperaron. Al tener fe en él, también fueron salvados en la unidad de Jesucristo, como hombres santos dignos de todo amor y admiración, aprobados por Jesucristo y contados juntamente en el evangelio de nuestra esperanza común.'
  revised_footnotes:
  - marker: a
    text: «Para Dios» aparece como una restauración señalada entre corchetes en el testimonio inglés utilizado; la revisión directa del griego está pendiente.
    reason: Preserva de forma transparente la señal textual del testimonio disponible y no presenta la restauración como una lectura segura.
  revision_rationale: Se corrige una intensificación semántica clara («indescriptible»), se reproduce en el cuerpo del texto la señal de restauración del testimonio y se ajustan «hombres santos» y «contados juntamente» para reflejar más plenamente el inglés de control. Las expresiones difíciles sobre el evangelio, la carne de Jesús y el consejo de ancianos se conservan sin armonización doctrinal.
