review_pass:
  verdict: revise
  source_fidelity: Se requiere una revisión puntual. «Al llevar sus cadenas» deja impreciso que las cadenas son las de Jesucristo; «incluidos en el evangelio» atenúa el matiz colectivo de «numbered together». La restitución entre corchetes debe mantenerse visiblemente en el texto, no solo explicarse en la nota.
  naturalness: El registro general es claro y apropiado. Se mejora la construcción paralela «al evangelio como a la carne... y a los apóstoles como al consejo...» y se evita una formulación menos natural en torno a las cadenas.
  terminology: Se conservan «evangelio», «apóstoles» y «consejo de ancianos». «Para Dios» queda entre corchetes para reflejar con transparencia la restauración del testimonio inglés, sin afirmar una lectura griega definitiva.
  issues:
  - severity: medium
    issue: La restauración textual no aparece entre corchetes en el texto traducido.
    rationale: La nota indica que «para Dios» corresponde a material restaurado entre corchetes en el testimonio de partida. El texto debe conservar esa señal, no únicamente remitir a ella mediante una nota.
  - severity: medium
    issue: «Al llevar sus cadenas» puede entenderse como si Ignacio llevara las cadenas de otra persona no identificada.
    rationale: El antecedente es Jesucristo; «cuyas cadenas llevo» expresa con claridad la relación sin añadir interpretación.
  - severity: low
    issue: «Incluidos en el evangelio» no comunica plenamente «numbered together».
    rationale: La expresión de partida conserva un aspecto de ser contados conjuntamente; «contados entre quienes pertenecen al evangelio» lo refleja mejor en español natural.
  revised_text: 'Hermanos míos, mi corazón se desborda por completo de amor hacia ustedes y, lleno de una alegría indescriptible, velo por su seguridad; pero no yo, sino Jesucristo. Al llevar sus cadenas, siento aún más temor, porque todavía no he alcanzado la perfección. Pero la oración de ustedes me perfeccionará [para Dios][a], a fin de que alcance la herencia en la que he recibido misericordia, acudiendo al evangelio como a la carne de Jesús y a los apóstoles como al consejo de ancianos de la iglesia.


    También amamos a los profetas, porque ellos también señalaron al evangelio en su predicación, pusieron su esperanza en él y lo esperaron. Al creer en él, también fueron salvados en la unidad de Jesucristo. Como hombres santos, dignos de todo amor y admiración, aprobados por Jesucristo, fueron contados entre quienes pertenecen al evangelio de nuestra esperanza común.'
  revised_footnotes:
  - marker: a
    text: «Para Dios» aparece como una restauración señalada entre corchetes en el testimonio inglés utilizado; la revisión directa del griego está pendiente.
    reason: Preservar de forma transparente la señal textual del testimonio disponible y no presentar una restauración como lectura segura.
  revision_rationale: Se conserva el sentido del testimonio inglés suministrado, con una sintaxis española más directa para las comparaciones «como a la carne» y «como al consejo». Se hace visible la restauración entre corchetes y se recupera el matiz colectivo de «numbered together» sin precisar indebidamente su alcance. La frase sobre las cadenas conserva la referencia a Jesucristo según el contexto inmediato.
