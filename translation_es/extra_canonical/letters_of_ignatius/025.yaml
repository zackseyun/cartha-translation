base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: es
  text: Así pues, se me permitió verlos representados en Dámas, su piadoso obispo; en sus dignos presbíteros Baso y Apolonio; y en mi compañero de servicio, el diácono Zoción, en quien quisiera alegrarme, pues está sujeto al obispo como a la gracia de Dios, y al presbiterio como a la ley de Jesucristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La fuente suministrada indica expresamente que aún no se ha realizado la revisión de la lengua original; la nota hace transparente esa limitación textual.
lexical_decisions:
- source_word: in the person of
  choice: representados en
  rationale: Expresa de manera natural que Ignacio veía a la comunidad por medio de sus representantes, sin sugerir una identificación literal.
- source_word: godly
  choice: piadoso
  rationale: Conserva el sentido religioso y elogioso con un término digno y comprensible en español actual.
- source_word: presbyters / presbytery
  choice: presbíteros / presbiterio
  rationale: Mantiene la terminología eclesial histórica y la distinción entre los miembros y el cuerpo colegiado.
- source_word: fellow-servant
  choice: compañero de servicio
  rationale: Conserva la idea de servicio compartido sin introducir de manera innecesaria la connotación moderna de esclavitud.
- source_word: be subject
  choice: está sujeto
  rationale: Reproduce la relación de subordinación expresada por el testimonio, sin intensificarla ni suavizarla.
- source_word: as unto
  choice: como a
  rationale: Preserva la comparación explícita y su tensión teológica, sin convertirla en identidad.
theological_decisions:
- issue: Relación del obispo con la gracia de Dios y del presbiterio con la ley de Jesucristo
  choice: «como a la gracia de Dios» y «como a la ley de Jesucristo»
  alternative: «como si fueran la gracia de Dios» y «la ley de Jesucristo»
  rationale: La formulación elegida conserva las comparaciones paralelas del testimonio y evita afirmar que los dirigentes sean idénticos a la gracia o a la ley.
- issue: Sentido de la obediencia eclesial
  choice: «está sujeto»
  alternative: «obedece»
  rationale: «Está sujeto» refleja mejor el lenguaje relacional y jerárquico del pasaje, sin añadir una teoría denominacional del cargo.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva la estructura acumulativa y el paralelismo retórico del pasaje, con puntuación adaptada para facilitar la lectura. Los nombres se presentan en formas hispanizadas habituales: Dámas, Baso, Apolonio y Zoción.'
