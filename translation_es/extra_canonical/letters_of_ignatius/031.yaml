base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: es
  text: 'No se dejen engañar por enseñanzas extrañas ni por fábulas antiguas, que no sirven de nada. Porque, si hasta el día de hoy seguimos viviendo conforme al judaísmo, reconocemos que no hemos recibido la gracia.


    Pues los santos profetas vivieron conforme a Cristo Jesús.[a] Por esta razón también fueron perseguidos, inspirados por su gracia, a fin de que los desobedientes quedaran plenamente persuadidos de que hay un solo Dios, quien se manifestó por medio de Jesucristo, su Hijo. Él es su Palabra eterna, que procedió del silencio,[b] y que en todo agradó a quien lo envió.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede entenderse: «vivieron según Cristo Jesús». La expresión no indica que los profetas vivieran cronológicamente después de él.'
    reason: Aclara el contraste con la traducción inglesa suministrada sin resolver de manera excesiva el sentido de κατὰ Χριστὸν Ἰησοῦν.
  - marker: b
    text: «Procedió del silencio» reproduce una expresión densa del texto antiguo; aquí no se especifica si el silencio se entiende en sentido eterno, revelador o figurado.
    reason: Preserva la ambigüedad teológica de ἀπὸ σιγῆς προελθών, sin imponer una explicación doctrinal posterior.
lexical_decisions:
- source_word: ἑτεροδοξίαις
  choice: enseñanzas extrañas
  rationale: Expresa doctrinas ajenas o divergentes sin introducir el tecnicismo confesional «heterodoxias».
- source_word: παλαιοίς μύθοις
  choice: fábulas antiguas
  rationale: Conserva el carácter tradicional y ficticio de los relatos, así como el contraste con la gracia.
- source_word: κατὰ Ἰουδαϊσμόν
  choice: conforme al judaísmo
  rationale: Mantiene la referencia explícita al modo de vida judío del testimonio, sin ampliarla ni suavizarla.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: conforme a Cristo Jesús
  rationale: Conserva la formulación densa y potencialmente ambigua, en vez de resolverla como una afirmación meramente cronológica.
- source_word: Λόγος
  choice: Palabra
  rationale: Traduce el título teológico con una forma natural en español y evita dejarlo sin traducir como «Logos».
- source_word: ἀπὸ σιγῆς προελθών
  choice: que procedió del silencio
  rationale: Preserva la imagen singular del texto sin explicarla mediante una interpretación doctrinal añadida.
- source_word: εὐηρέστησεν
  choice: agradó
  rationale: Reproduce de manera clara la idea de resultar plenamente grato al que lo envió.
theological_decisions:
- issue: Relación de los profetas con Cristo
  choice: «vivieron conforme a Cristo Jesús»
  alternative: «vivieron después de Cristo Jesús»
  rationale: La lectura «conforme a» refleja el sentido reconocido del griego κατὰ y el argumento de que los profetas fueron orientados por la gracia de Cristo; la alternativa cronológica produciría una afirmación problemática y depende demasiado del testimonio inglés.
- issue: Manifestación de Dios por medio del Hijo
  choice: «Dios, quien se manifestó por medio de Jesucristo, su Hijo»
  alternative: «Jesucristo, su Hijo, quien se manifestó»
  rationale: Se conserva como antecedente a «un solo Dios», tal como presenta la sintaxis transmitida, sin identificar ni separar indebidamente a Dios y al Hijo.
- issue: La Palabra procedente del silencio
  choice: Mantener literalmente la expresión
  alternative: Explicarla como generación eterna, revelación histórica o aparición audible
  rationale: La frase admite distintas lecturas teológicas; la traducción no debe decidir entre ellas.
- issue: Agente de la inspiración profética
  choice: «su gracia los inspiraba»
  alternative: «inspirados por la gracia de Cristo»
  rationale: El posesivo conserva la referencia del texto y su vínculo inmediato con Cristo Jesús, sin agregar una identificación explicativa dentro del cuerpo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa el plural «ustedes» implícito en «no se dejen», con sintaxis clara y sin vocabulario confesional innecesario. Dado que el material aportado señala que la revisión directa del griego está pendiente, se adoptan decisiones prudentes apoyadas en la tradición griega conocida y se anotan las dos expresiones de mayor dificultad.
