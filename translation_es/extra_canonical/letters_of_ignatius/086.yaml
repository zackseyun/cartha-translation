base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: es
  text: 'Hicieron bien en recibir a Filón y a Reo Agatópodo, quienes me acompañaron por causa de Dios, como servidores de [Cristo] Dios.[a] Ellos también dan gracias al Señor por ustedes, porque los reconfortaron de todas las maneras. Nada de esto quedará sin recompensa para ustedes.


    Mi espíritu está entregado por ustedes, al igual que mis cadenas, que no despreciaron ni les avergonzaron. Tampoco se avergonzará de ustedes aquel que es la fidelidad perfecta: Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El nombre «Cristo» aparece entre corchetes porque el testimonio utilizado lo presenta como una restauración textual; la revisión directa del griego sigue pendiente.
    reason: Señalar con transparencia la incertidumbre textual preservada en la fuente suministrada.
lexical_decisions:
- source_word: Philo and Rhaius Agathopus
  choice: Filón y Reo Agatópodo
  rationale: Se adaptan los nombres a formas españolas reconocibles, manteniendo la distinción de dos personas indicada por el testimonio.
- source_word: followed me in the cause of God
  choice: me acompañaron por causa de Dios
  rationale: Expresa seguimiento y solidaridad con la misión o situación de Ignacio sin precisar más de lo que permite el testimonio inglés.
- source_word: ministers
  choice: servidores
  rationale: Término natural y amplio que evita imponer un oficio eclesiástico específico donde el testimonio no lo exige.
- source_word: refreshed them
  choice: los reconfortaron
  rationale: Comunica atención, alivio y ánimo de manera idiomática en español actual.
- source_word: Nothing shall be lost to you
  choice: Nada de esto quedará sin recompensa para ustedes
  rationale: Hace explícito el sentido idiomático de que su servicio no se perderá, sin especificar la naturaleza de la recompensa.
- source_word: My spirit is devoted for you
  choice: Mi espíritu está entregado por ustedes
  rationale: Conserva el lenguaje intenso de entrega personal sin convertirlo en una fórmula doctrinal más precisa.
- source_word: perfect faithfulness
  choice: la fidelidad perfecta
  rationale: Preserva la formulación abstracta y enfática del testimonio en vez de reducirla a 'perfectamente fiel'.
theological_decisions:
- issue: Lectura «[Christ] God»
  choice: '[Cristo] Dios'
  alternative: Dios / Cristo Dios
  rationale: Se conserva entre corchetes la restauración señalada por el testimonio, sin ocultar su carácter textual incierto ni normalizar la expresión cristológica.
- issue: Sentido de la promesa «Nothing shall be lost to you»
  choice: Nada de esto quedará sin recompensa para ustedes
  alternative: Nada se perderá para ustedes
  rationale: La versión elegida comunica el probable sentido de reconocimiento divino, pero evita definir cuándo o cómo se dará.
- issue: Identidad de «aquel que es la fidelidad perfecta»
  choice: Jesucristo
  alternative: el Señor / Dios
  rationale: Se mantiene la identificación explícita ofrecida por el testimonio, con una puntuación que conserva la fuerza de la aposición.
translation_notes:
  register: Español latinoamericano neutral, actual y digno; se usa «ustedes». Borrador provisional basado en el testimonio inglés de dominio público suministrado, pues la revisión directa de la tradición manuscrita griega de la recensión media está pendiente.
