review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado. Hay una corrección necesaria: «hasta nuestros secretos están cerca de él» traduce de modo impreciso «even our secrets are nigh unto Him», que afirma proximidad a Dios, no una mera cercanía espacial. «Nuestros secretos están a su alcance» comunica con naturalidad que nada de ellos le es inaccesible, sin añadir especificación doctrinal. La revisión directa del griego sigue pendiente, como indica el contexto.'
  naturalness: El registro es claro y digno en español latinoamericano. «Es mejor guardar silencio y ser que hablar y no ser» suena más fluido sin coma antes de «que». «Por el amor que justamente le tenemos» es comprensible, pero «por el amor que rectamente le tenemos» resulta algo rígido; «por el amor que debidamente le tenemos» conserva mejor el matiz de amor debido y es más natural en este registro.
  terminology: «Maestro», «palabra», «silencio», «Señor», «templos» y «Dios» preservan los términos y las ambigüedades del testimonio. Se conserva la capitalización titular de «Maestro» sin insertar un nombre. La nota de transparencia textual está bien anclada y debe mantenerse.
  issues:
  - severity: medium
    issue: «hasta nuestros secretos están cerca de él»
    rationale: 'La formulación española debilita o desvía el sentido de «our secrets are nigh unto Him»: el énfasis es que los secretos no quedan fuera de la presencia, conocimiento o alcance del Señor. «Están a su alcance» expresa esa relación de manera idiomática sin sobreinterpretar el mecanismo.'
  - severity: low
    issue: Coma en «ser, que hablar»
    rationale: No corresponde separar con coma los dos términos comparados; quitarla mejora la puntuación sin afectar el sentido.
  - severity: low
    issue: «por el amor que justamente le tenemos»
    rationale: «Justamente» puede leerse como ‘con razón’ o ‘de manera justa’; «debidamente» conserva el sentido de amor recto o debido y suena más idiomático en este contexto.
  revised_text: 'Es mejor guardar silencio y ser que hablar y no ser. Enseñar es algo excelente, si quien habla practica lo que enseña. Ahora bien, hay un solo Maestro que habló, y sucedió; y aun lo que ha hecho en silencio es digno del Padre.


    Quien posee verdaderamente la palabra de Jesús también puede escuchar su silencio, a fin de llegar a ser perfecto: para que actúe mediante lo que dice y sea reconocido mediante su silencio.


    Nada está oculto al Señor; aun nuestros secretos están a su alcance. Hagámoslo todo, pues, sabiendo que él habita en nosotros, para que seamos sus templos y él mismo esté en nosotros como nuestro Dios. Esto es así, y también se hará evidente ante nuestros ojos por el amor que debidamente le tenemos.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La fuente suministrada identifica expresamente el inglés como base de redacción y señala que la revisión del griego está pendiente; la nota transparenta esa limitación textual.
  revision_rationale: Se corrige la relación expresada por «nigh unto Him» para no representar los secretos como simplemente cercanos a Dios, sino como plenamente a su alcance. También se ajustan puntuación y una expresión de estilo. Se preservan las paradojas, los referentes implícitos y las ambigüedades teológicas del testimonio inglés, sin imponer una lectura confesional. Dado que el insumo es un testimonio inglés y no el griego, la revisión debe conservar carácter provisional.
