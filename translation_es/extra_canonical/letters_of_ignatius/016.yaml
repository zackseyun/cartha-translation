review_pass:
  verdict: revise
  source_fidelity: La versión conserva bien las paradojas centrales y la progresión del pasaje. Sin embargo, «a fin de llegar a ser perfecto» introduce un matiz de proceso que no está expresado en el texto («para que sea perfecto»), y «mediante su silencio» atenúa la construcción paralela «por lo que dice / por lo que calla».
  naturalness: El español es moderno, digno y en general natural. «Por lo que dice, actúe; y por lo que calla, sea conocido» conserva mejor el paralelismo retórico sin perder fluidez.
  terminology: «Guardar silencio», «ser», «palabra de Jesús», «templos» y «nuestro Dios» son elecciones adecuadas. Se conserva «maestro» en minúscula, pues el original presenta la designación sin requerir una capitalización titular interpretativa.
  issues:
  - severity: medium
    issue: Matiz aspectual añadido en «llegar a ser perfecto»
    rationale: La formulación fuente expresa finalidad con «sea perfecto», sin marcar explícitamente un proceso de llegar a serlo. Conviene no añadir ese desarrollo.
  - severity: medium
    issue: Paralelismo de «por lo que dice / por lo que calla» parcialmente reducido
    rationale: El original contrapone dos expresiones relativas paralelas. «Mediante su silencio» comunica la idea general, pero «por lo que calla» refleja más exactamente la estructura y mantiene la repetición verbal.
  - severity: low
    issue: Mayúscula interpretativa en «Maestro»
    rationale: Aunque el referente contextual es Jesús, «un solo maestro» basta para transmitir el texto y evita añadir una señal editorial de título donde la fuente solo emplea el sustantivo.
  revised_text: 'Es mejor guardar silencio y ser que hablar y no ser. Enseñar es algo excelente, si quien habla practica lo que enseña. Hay un solo maestro que habló, y sucedió; aun las cosas que ha hecho en silencio son dignas del Padre.


    Quien posee verdaderamente la palabra de Jesús también puede escuchar su silencio, para que sea perfecto: por lo que dice, actúe; y por lo que calla, sea conocido.


    Nada está oculto al Señor; aun nuestros secretos están cerca de él. Hagámoslo todo, pues, sabiendo que él habita en nosotros, para que seamos sus templos y él mismo esté en nosotros como nuestro Dios. Esto es así, y también se hará evidente ante nuestros ojos por el amor que justamente le tenemos.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La fuente suministrada identifica expresamente el inglés como base de redacción y señala que la revisión del griego está pendiente; la nota transparenta esa limitación textual.
  revision_rationale: Se ajustó la finalidad de la segunda sección para no añadir un proceso ausente en la fuente y se restituyó en español el paralelismo entre hablar y callar. También se eliminó la mayúscula titular no requerida. No se resolvieron de manera doctrinal las ambigüedades sobre el maestro, sus obras silenciosas, ni la manifestación final vinculada al amor.
