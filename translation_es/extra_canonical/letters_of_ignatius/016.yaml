base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: es
  text: 'Es mejor guardar silencio y ser, que hablar y no ser. Enseñar es algo excelente, si quien habla practica lo que enseña. Ahora bien, hay un solo Maestro que habló, y sucedió; y aun lo que ha hecho en silencio es digno del Padre.


    Quien posee verdaderamente la palabra de Jesús también puede escuchar su silencio, a fin de llegar a ser perfecto: para que actúe mediante lo que dice y sea reconocido mediante su silencio.


    Nada está oculto al Señor; hasta nuestros secretos están cerca de él. Hagámoslo todo, pues, sabiendo que él habita en nosotros, para que seamos sus templos y él mismo esté en nosotros como nuestro Dios. Esto es así, y también se hará evidente ante nuestros ojos por el amor que justamente le tenemos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La fuente suministrada identifica expresamente el inglés como base de redacción y señala que la revisión del griego está pendiente; la nota transparenta esa limitación textual.
lexical_decisions:
- source_word: keep silence / silence (Greek review pending)
  choice: guardar silencio / silencio
  rationale: Conserva el motivo repetido y su contraste deliberado con hablar, sin explicarlo ni reducirlo a mera discreción.
- source_word: to be
  choice: ser
  rationale: Mantiene la formulación ontológica, breve y paradójica del testimonio, en vez de interpretarla como parecer, existir auténticamente o actuar.
- source_word: one teacher
  choice: un solo Maestro
  rationale: «Maestro» es natural para Jesús y conserva la afirmación exclusiva del pasaje; la mayúscula identifica el uso titular sin añadir un nombre ausente.
- source_word: possesseth the word of Jesus
  choice: posee verdaderamente la palabra de Jesús
  rationale: Reproduce la relación fuerte expresada por «poseer» y mantiene «palabra» en singular, sin precisar indebidamente si significa enseñanza, mensaje o Logos.
- source_word: hearken unto His silence
  choice: escuchar su silencio
  rationale: Preserva la paradoja teológica y retórica, evitando sustituirla por una explicación interpretativa.
- source_word: temples
  choice: templos
  rationale: Conserva el plural y la imagen cultual aplicada a la comunidad o a sus integrantes, sin resolver esa amplitud.
- source_word: rightly bear towards Him
  choice: justamente le tenemos
  rationale: Expresa la cualidad recta o debida del amor en español actual y digno, sin convertirla en una afirmación de mérito.
theological_decisions:
- issue: Identidad del «único Maestro» y referente de los pronombres
  choice: Mantener la referencia implícita a Jesús mediante «Maestro» y los pronombres, sin insertar su nombre
  alternative: Añadir «Jesús» o «Cristo» después de «Maestro»
  rationale: El contexto inmediato apunta a Jesús, pero la redacción suministrada no repite explícitamente el nombre; conservar la implicación evita ampliar el texto.
- issue: Sentido de «lo que ha hecho en silencio»
  choice: Conservar la expresión sin identificar hechos concretos
  alternative: Interpretarla como las obras ocultas, la encarnación, la pasión o los misterios divinos
  rationale: El testimonio permite varias lecturas patrísticas y teológicas; especificar una eliminaría una ambigüedad genuina.
- issue: Finalidad de palabra y silencio
  choice: Traducir «para que actúe mediante lo que dice y sea reconocido mediante su silencio»
  alternative: Hacer que ambos miembros describan exclusivamente al Maestro o exclusivamente al creyente
  rationale: La sintaxis del testimonio vincula ambos miembros con quien posee la palabra de Jesús, aunque el lenguaje evoca al Maestro; se conserva esa tensión.
- issue: Habitación divina y condición de templos
  choice: «él habita en nosotros... seamos sus templos... esté en nosotros como nuestro Dios»
  alternative: Precisar que se trata del Espíritu Santo, de Cristo o del Padre
  rationale: El pasaje dice «el Señor» y «nuestro Dios» sin precisar aquí una persona divina; no se importa una identificación confesional adicional.
- issue: Afirmación final y amor a Dios
  choice: Conservar que la realidad «se hará evidente... por el amor»
  alternative: Explicarla como prueba de salvación, mérito humano o visión escatológica
  rationale: La frase puede expresar manifestación presente o futura y no define un esquema doctrinal; la traducción deja abierta esa tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las paradojas «guardar silencio y ser» y «escuchar su silencio», así como la repetición temática de hablar, palabra y silencio. Se evitó lenguaje arcaizante y también explicaciones doctrinales no presentes en el testimonio. La redacción es provisional por falta de cotejo directo con el griego.
