base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: es
  text: 'Porque no quiero que busquen agradar a la gente, sino a Dios, como de hecho ya le agradan. Yo nunca volveré a tener una oportunidad como esta para alcanzar a Dios; y ustedes, si guardan silencio, no podrán lograr que se les reconozca por una obra más noble. Porque, si guardan silencio respecto de mí, yo seré palabra de Dios; pero, si se encariñan con mi carne, volveré a ser tan solo una voz.


    No me concedan nada más que ser derramado como libación para Dios mientras el altar aún está preparado. Así, formando en el amor un coro, podrán cantar al Padre en Jesucristo, porque Dios tuvo por digno al obispo de Siria de ser hallado en Occidente, después de llamarlo desde Oriente. Es bueno que me ponga, alejándome del mundo hacia Dios, para que en él vuelva a salir como el sol.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El griego enlaza «Occidente» y «Oriente» con los verbos usados para la puesta y la salida del sol: Ignacio desea ponerse o desaparecer respecto del mundo para volver a salir en Dios.'
    reason: La traducción procura conservar un juego verbal griego que no puede reproducirse por completo en español sin explicación.
lexical_decisions:
- source_word: ἀνθρωπαρεσκῆσαι
  choice: buscar agradar a la gente
  rationale: Expresa con naturalidad la idea de actuar para complacer a seres humanos, en contraste explícito con agradar a Dios.
- source_word: θεοῦ ἐπιτυχεῖν
  choice: alcanzar a Dios
  rationale: Conserva la formulación intensa y teológicamente abierta de Ignacio sin reducirla a morir, llegar al cielo ni obtener salvación.
- source_word: λόγος θεοῦ / φωνή
  choice: palabra de Dios / voz
  rationale: Mantiene el contraste deliberado entre una palabra dotada de contenido o significado y una voz que puede quedar en mero sonido.
- source_word: σπονδισθῆναι
  choice: ser derramado como libación
  rationale: Retiene la imagen sacrificial de una ofrenda líquida vertida ante Dios, importante para la lógica del altar en la frase siguiente.
- source_word: τὸν ἐπίσκοπον Συρίας
  choice: al obispo de Siria
  rationale: El genitivo indica de manera más directa su relación episcopal con Siria, no meramente su procedencia geográfica.
- source_word: δῦναι / ἀνατείλω
  choice: que me ponga / vuelva a salir como el sol
  rationale: Reproduce en lo posible la metáfora solar y su relación con Occidente y Oriente en las oraciones anteriores.
theological_decisions:
- issue: La aspiración de Ignacio a «alcanzar a Dios» mediante su inminente martirio
  choice: alcanzar a Dios
  alternative: morir para ir con Dios
  rationale: La alternativa explicaría y estrecharía una expresión que el texto deja cargada de tensión espiritual y martirial.
- issue: La afirmación «yo seré palabra de Dios»
  choice: Conservarla de forma directa
  alternative: mi martirio comunicará la palabra de Dios
  rationale: La paráfrasis resolvería la metáfora y eliminaría el contraste conciso entre λόγος y φωνή.
- issue: La participación de los destinatarios mediante su silencio
  choice: si guardan silencio respecto de mí
  alternative: si no intervienen para salvarme
  rationale: El contexto sugiere que no deben impedir el martirio, pero el texto formula la petición como silencio; se conserva esa figura sin hacer explícita una acción concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron las imágenes abruptas de palabra y voz, libación y altar, coro, Occidente y Oriente, y puesta y salida del sol. La redacción se apoyó prioritariamente en la forma griega conocida de la recensión media y se cotejó con el testimonio inglés suministrado; conviene una revisión filológica final contra una edición crítica griega.
