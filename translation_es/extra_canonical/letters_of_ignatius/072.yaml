    rationale: El testimonio dice «my charter is Jesus Christ, the inviolable charter is His cross...» y la tradición griega subyacente emplea ἀρχεῖα en esta formulación. «Pero para mí, el documento es Jesucristo; los documentos...» altera la construcción y debilita su paralelismo retórico.
  - severity: low
    issue: «Toda atadura que los oprima» incorpora un matiz no expreso.
    rationale: «Every fetter from you» pide que se quite o rompa toda atadura; que esta oprima es plausible, pero añadido interpretativo.
  - severity: low
    issue: La nota c presenta alternativas interpretativas para una réplica muy concisa.
    rationale: Es útil conservar la nota, pero la traducción principal debe permanecer moderada y no hacer de «precisamente» un énfasis obligatorio.
