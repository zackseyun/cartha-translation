  to: 'Por tanto, hice lo que me correspondía, como hombre dispuesto a la unidad. Pero donde hay división e ira, Dios no habita. Ahora bien, el Señor perdona a todos cuando se arrepienten, si, al arrepentirse, vuelven a la unidad de Dios y al consejo del obispo.[a] Confío en la gracia de Jesucristo, quien romperá toda atadura que tengan; y les ruego:


