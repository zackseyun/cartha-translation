base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: es
  text: 'Por tanto, hice lo que me correspondía, como hombre dispuesto a la unidad. Pero donde hay división e ira, Dios no habita. Ahora bien, el Señor perdona a todos cuando se arrepienten, si, al arrepentirse, vuelven a la unidad de Dios y al consejo del obispo.[a] Confío en la gracia de Jesucristo, quien romperá toda atadura que tengan; y les ruego:


    No hagan nada con espíritu partidista, sino conforme a la enseñanza de Cristo. Porque oí a algunos decir: «Si no lo encuentro en los documentos,[b] no lo creo en el evangelio». Cuando les dije: «Está escrito», me respondieron: «Eso es lo que está en discusión».[c] Pero para mí, mis documentos son Jesucristo; mis documentos inviolables son su cruz, su muerte, su resurrección y la fe que viene por medio de él.[d] En todo esto deseo ser justificado mediante las oraciones de ustedes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Consejo del obispo» también puede entenderse como la asamblea o cuerpo reunido en torno al obispo.
    reason: La expresión antigua admite más de una caracterización institucional y no debe equipararse sin más con una estructura posterior.
  - marker: b
    text: El término traducido «documentos» puede significar archivos, registros o escritos autorizados. Algunos entienden que aquí se refiere a las Escrituras antiguas.
    reason: La identificación exacta de los «documentos» es discutida; la nota preserva la ambigüedad histórica.
  - marker: c
    text: 'La respuesta también puede entenderse como: «Eso es lo que hay que demostrar» o «Eso es precisamente lo discutido».'
    reason: El sentido conciso de la réplica admite varias formulaciones cercanas.
  - marker: d
    text: 'Otra posible puntuación es: «mis documentos inviolables son su cruz, su muerte y su resurrección, y la fe que viene por medio de él».'
    reason: La relación de «la fe» con la serie precedente y el alcance exacto de la metáfora documental no son completamente seguros.
lexical_decisions:
- source_word: κατηρτισμένος εἰς ἕνωσιν
  choice: dispuesto a la unidad
  rationale: Expresa la orientación o preparación hacia la unidad sin convertirla en una formulación doctrinal más específica.
- source_word: συνέδριον τοῦ ἐπισκόπου
  choice: consejo del obispo
  rationale: Conserva la imagen de un consejo o cuerpo reunido en torno al obispo; evita sustituirla por un término eclesiástico posterior.
- source_word: ἀρχεῖα
  choice: documentos
  rationale: El término puede aludir a archivos, documentos oficiales o escritos autorizados. «Documentos» resulta natural y permite mantener la repetición retórica del pasaje.
- source_word: προσκείμενα
  choice: lo que está en discusión
  rationale: 'Comunica la réplica polémica: la existencia o pertinencia de lo escrito era precisamente el asunto debatido.'
- source_word: ἄλυτα ἀρχεῖα
  choice: documentos inviolables
  rationale: Mantiene la metáfora documental y el sentido de algo que no puede invalidarse, deshacerse o anularse.
- source_word: πίστις ἡ δι’ αὐτοῦ
  choice: la fe que viene por medio de él
  rationale: Preserva la mediación expresada por «por medio de él» sin precisar indebidamente si se trata de fe en Cristo o fidelidad obrada mediante Cristo.
theological_decisions:
- issue: Relación entre arrepentimiento, perdón y unidad eclesial
  choice: «perdona a todos los que se arrepienten, si al arrepentirse vuelven a la unidad de Dios y al consejo del obispo»
  alternative: «perdona a todos los arrepentidos que vuelven a la unidad de Dios y al presbiterio del obispo»
  rationale: Se conserva la condición y tensión del texto sin formular una doctrina sacramental o jurisdiccional que vaya más allá de la evidencia suministrada.
- issue: Sentido de «ser justificado»
  choice: «deseo ser justificado mediante las oraciones de ustedes»
  alternative: «deseo recibir aprobación gracias a las oraciones de ustedes»
  rationale: Se mantiene el lenguaje teológicamente cargado del testimonio, sin decidir si aquí significa vindicación, aprobación o justificación en un sentido técnico.
- issue: Alcance de «la fe por medio de él»
  choice: «la fe que viene por medio de él»
  alternative: «la fe en él»
  rationale: La alternativa resolvería la construcción como objeto de la fe; la traducción elegida conserva la mediación y la ambigüedad del giro.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conserva la repetición de la metáfora documental. La traducción es provisional porque el expediente indica que aún está pendiente una revisión directa completa del griego; las decisiones se apoyan en la tradición griega de recensión media conocida y en el testimonio público suministrado.
