base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: es
  text: 'Les escribo estas cosas desde Esmirna por medio de los efesios, quienes son dignos de toda felicitación. También está conmigo Croco, un nombre muy querido para mí, además de muchos otros.


    En cuanto a los que se adelantaron desde Siria hasta Roma para la gloria de Dios, creo que ustedes ya han recibido instrucciones. Háganles saber también que estoy cerca, pues todos ellos son dignos de Dios y de ustedes, y conviene que ustedes los reconforten en todo.


    Les escribo estas cosas el noveno día antes de las calendas de septiembre.[a] Manténganse firmes hasta el fin mientras esperan con paciencia a Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Según el cómputo romano, esta fecha corresponde al 24 de agosto.
    reason: Se conserva en el texto el sistema romano original y se ofrece al lector moderno su equivalencia habitual.
lexical_decisions:
- source_word: by the hand of
  choice: por medio de
  rationale: Expresa de manera natural que los efesios llevaron o transmitieron la carta, sin imponer que uno de ellos actuara físicamente como escriba.
- source_word: worthy of all felicitation
  choice: dignos de toda felicitación
  rationale: Conserva la formulación enfática del testimonio y evita reducirla a una simple alabanza.
- source_word: refresh them
  choice: los reconforten
  rationale: Comunica la idea de brindar alivio, ánimo y atención, sin limitarla exclusivamente a ayuda material.
- source_word: Fare ye well unto the end
  choice: Manténganse firmes hasta el fin
  rationale: La despedida parece incluir una exhortación a perseverar; esta formulación resulta natural y enlaza con la espera paciente, aunque el sentido exacto depende de la revisión griega pendiente.
theological_decisions:
- issue: La expresión «para la gloria de Dios» puede indicar propósito o resultado.
  choice: para la gloria de Dios
  alternative: hasta la gloria de Dios
  rationale: Se mantiene la lectura de propósito del testimonio inglés sin desarrollar una interpretación teológica adicional.
- issue: La relación entre la despedida final y la espera de Cristo.
  choice: Manténganse firmes hasta el fin mientras esperan con paciencia a Jesucristo.
  alternative: Que estén bien hasta el fin en la espera paciente de Jesucristo.
  rationale: Se conserva la perseverancia escatológica sin precisar indebidamente la naturaleza o el momento de la espera.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se preservan los nombres y la datación antigua. Debido a que la revisión directa del griego está pendiente y el material suministrado es un testimonio inglés de dominio público, se evitan reconstrucciones léxicas griegas no verificables.
