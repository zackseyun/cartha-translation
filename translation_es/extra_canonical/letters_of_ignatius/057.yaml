base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a slave even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: es
  text: 'Escribo a todas las iglesias y hago saber a todos que muero por Dios por mi propia voluntad, a menos que ustedes me lo impidan. Les ruego: no me muestren una bondad inoportuna. Déjenme ser alimento de las fieras, pues por medio de ellas puedo alcanzar a Dios. Soy trigo de Dios, y los dientes de las fieras me muelen para que sea hallado pan puro [de Cristo][a].


    Más bien, halaguen a las fieras, para que se conviertan en mi sepulcro y no dejen nada de mi cuerpo; así, cuando me haya dormido, no seré una carga para nadie. Entonces seré verdaderamente discípulo de Jesucristo, cuando el mundo ya ni siquiera vea mi cuerpo. Rueguen al Señor por mí, para que por medio de estos instrumentos sea hallado como sacrificio para Dios.


    No les doy órdenes como lo hicieron Pedro y Pablo. Ellos eran apóstoles; yo soy un condenado. Ellos eran libres; yo sigo siendo esclavo hasta esta misma hora. Pero, si padezco, seré un liberto de Jesucristo y resucitaré libre en él. Ahora, en medio de mis cadenas, estoy aprendiendo a desprenderme de todo deseo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado coloca «de Cristo» entre corchetes, señal de que esas palabras presentan incertidumbre textual o fueron restauradas editorialmente. La revisión directa del griego está pendiente.
    reason: Preserva en el texto y explica en nota la señal de incertidumbre textual del testimonio suministrado.
lexical_decisions:
- source_word: of my own free will
  choice: por mi propia voluntad
  rationale: Conserva el énfasis explícito en la voluntariedad de la muerte sin convertirlo en una afirmación sobre sus circunstancias exactas.
- source_word: unseasonable kindness
  choice: una bondad inoportuna
  rationale: 'Mantiene la tensión retórica: una acción normalmente bondadosa sería impropia en ese momento desde la perspectiva del autor.'
- source_word: attain unto God
  choice: alcanzar a Dios
  rationale: Reproduce la orientación hacia Dios sin precisar de manera indebida el mecanismo o la naturaleza de ese encuentro.
- source_word: entice the wild beasts
  choice: atraigan a las fieras
  rationale: Expresa la petición de hacer que las fieras se acerquen o actúen, evitando una formulación demasiado técnica o grotesca.
- source_word: convict
  choice: un condenado
  rationale: Comunica la condición judicial y penitenciaria del autor con mayor precisión que «convicto» en el español latinoamericano corriente.
- source_word: freed-man
  choice: liberto
  rationale: Conserva el contraste histórico y metafórico entre esclavo y persona puesta en libertad.
- source_word: put away every desire
  choice: desprenderme de todo deseo
  rationale: Mantiene la amplitud de «todo deseo» y evita añadir una calificación moral que el testimonio suministrado no expresa.
theological_decisions:
- issue: La relación entre martirio y llegada a Dios
  choice: «por medio de ellas puedo alcanzar a Dios»
  alternative: «gracias a ellas puedo llegar a Dios»
  rationale: La formulación conserva la afirmación intensa de Ignacio sin explicar si se refiere a mérito, medio providencial, muerte o entrada en la presencia divina.
- issue: El lenguaje de sacrificio
  choice: «sea hallado como sacrificio para Dios»
  alternative: «llegue a ser un sacrificio para Dios»
  rationale: «Sea hallado» conserva el matiz de reconocimiento o comprobación presente en el testimonio y no afirma que el sufrimiento produzca automáticamente tal condición.
- issue: Libertad en Cristo después del padecimiento
  choice: «seré un liberto de Jesucristo y resucitaré libre en él»
  alternative: «seré liberado por Jesucristo y resucitaré libre en él»
  rationale: Se mantiene el paralelismo esclavo/liberto y la pertenencia expresada por «de Jesucristo», sin resolverla como una descripción general de salvación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se conserva la imaginería fuerte del trigo, las fieras, el sepulcro, la esclavitud y el sacrificio. El borrador es provisional porque la evidencia proporcionada consiste en un testimonio inglés de dominio público y la revisión directa de la tradición griega de recensión media sigue pendiente.
