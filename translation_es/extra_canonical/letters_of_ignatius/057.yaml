revisions:
- from: 'Escribo a todas las iglesias y hago saber a todos que muero por Dios por mi propia voluntad, a menos que ustedes me lo impidan. Les ruego: no me muestren una bondad inoportuna. Dejen que sea entregado a las fieras, pues por medio de ellas puedo alcanzar a Dios. Soy trigo de Dios, y los dientes de las fieras me muelen para que sea hallado pan puro de Cristo[a].


    Más bien, atraigan a las fieras, para que se conviertan en mi sepulcro y no dejen atrás ninguna parte de mi cuerpo; así, cuando me haya dormido, no seré una carga para nadie. Entonces seré verdaderamente discípulo de Jesucristo, cuando el mundo ya ni siquiera vea mi cuerpo. Rueguen al Señor por mí, para que por medio de estos instrumentos sea hallado como sacrificio para Dios.


    No les doy órdenes como lo hicieron Pedro y Pablo. Ellos eran apóstoles; yo soy un condenado. Ellos eran libres; yo sigo siendo esclavo hasta esta misma hora. Pero, si padezco, seré un liberto de Jesucristo y resucitaré libre en él. Ahora, en medio de mis cadenas, estoy aprendiendo a desprenderme de todo deseo.'
  to: 'Escribo a todas las iglesias y hago saber a todos que muero por Dios por mi propia voluntad, a menos que ustedes me lo impidan. Les ruego: no me muestren una bondad inoportuna. Déjenme ser alimento de las fieras, pues por medio de ellas puedo alcanzar a Dios. Soy trigo de Dios, y los dientes de las fieras me muelen para que sea hallado pan puro [de Cristo][a].


    Más bien, halaguen a las fieras, para que se conviertan en mi sepulcro y no dejen nada de mi cuerpo; así, cuando me haya dormido, no seré una carga para nadie. Entonces seré verdaderamente discípulo de Jesucristo, cuando el mundo ya ni siquiera vea mi cuerpo. Rueguen al Señor por mí, para que por medio de estos instrumentos sea hallado como sacrificio para Dios.


    No les doy órdenes como lo hicieron Pedro y Pablo. Ellos eran apóstoles; yo soy un condenado. Ellos eran libres; yo sigo siendo esclavo hasta esta misma hora. Pero, si padezco, seré un liberto de Jesucristo y resucitaré libre en él. Ahora, en medio de mis cadenas, estoy aprendiendo a desprenderme de todo deseo.'
  rationale: La revisión restituye la imagen de Ignacio como alimento de las fieras, ajusta «halaguen» al verbo griego tradicionalmente entendido como ‘halagar/engatusar’, mejora levemente la fluidez y conserva explícitamente la marca textual [de Cristo]. No se altera la ambigüedad de las expresiones sobre alcanzar a Dios, ser sacrificio para Dios o resucitar libre en él.
