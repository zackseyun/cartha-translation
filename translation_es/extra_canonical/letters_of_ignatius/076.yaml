base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: es
  text: 'Ignacio, llamado también Teóforo, a la iglesia de Dios Padre y de Jesucristo, el Amado, que por misericordia ha recibido toda gracia, llena de fe y amor y sin carecer de ningún don de gracia, digna de la más alta honra y portadora de tesoros santos; a la iglesia que está en Esmirna de Asia: abundantes saludos en un espíritu irreprochable y en la palabra de Dios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construcción de la frase final es incierta: «en un espíritu irreprochable y en la palabra de Dios» también puede describir a la iglesia, con el sentido de «irreprochable en espíritu y abundante en la palabra de Dios». «Teóforo» puede entenderse como «portador de Dios» o «llevado por Dios».'
    reason: Preserva dos ambigüedades que no deben resolverse sin una revisión directa del griego.
lexical_decisions:
- source_word: Ignatius, who is also Theophorus
  choice: Ignacio, llamado también Teóforo
  rationale: Conserva el nombre tradicional en español y translitera el sobrenombre sin interpretarlo dentro del texto.
- source_word: mercifully endowed with every grace
  choice: por misericordia ha recibido toda gracia
  rationale: Expresa tanto la misericordia como la concesión de gracia en un español natural, sin identificar de manera indebida «gracia» con capacidades concretas.
- source_word: lacking in no grace
  choice: sin carecer de ningún don de gracia
  rationale: Evita una repetición poco clara de «gracia» y conserva la posible referencia a una dádiva o favor recibido.
- source_word: most reverend
  choice: digna de la más alta honra
  rationale: Comunica elevada veneración o dignidad sin usar un título eclesiástico moderno.
- source_word: bearing holy treasures
  choice: portadora de tesoros santos
  rationale: Mantiene la imagen concreta y su amplitud interpretativa.
- source_word: abundant greeting
  choice: abundantes saludos
  rationale: Reproduce la fórmula epistolar intensificada en lenguaje actual y digno.
theological_decisions:
- issue: Relación de la iglesia con Dios Padre y Jesucristo
  choice: a la iglesia de Dios Padre y de Jesucristo, el Amado
  alternative: a la iglesia de Dios Padre y del amado Jesucristo
  rationale: Conserva la coordinación y deja claro que «el Amado» designa a Jesucristo, sin agregar una explicación doctrinal.
- issue: Sentido de «Teóforo»
  choice: Conservar «Teóforo» en el texto y explicar su posible sentido en nota
  alternative: Traducirlo como «Portador de Dios»
  rationale: El término puede funcionar como sobrenombre y admite más de un matiz; transliterarlo preserva esa ambigüedad.
- issue: Vínculo de la frase final con la iglesia o con el saludo
  choice: abundantes saludos en un espíritu irreprochable y en la palabra de Dios
  alternative: 'a la iglesia... irreprochable en espíritu y abundante en la palabra de Dios: saludos'
  rationale: El testimonio inglés permite incertidumbre sintáctica. La redacción principal sigue su puntuación, mientras la nota registra la otra relación posible.
translation_notes:
  register: Español latinoamericano neutral, actual y solemne. Se evitaron arcaísmos y títulos eclesiásticos modernos. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
