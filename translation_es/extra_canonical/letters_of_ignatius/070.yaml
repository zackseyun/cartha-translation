review_pass:
  verdict: revise
  source_fidelity: La traducción conserva en general la secuencia argumentativa y las imágenes del testimonio inglés. Sin embargo, «limpia la conciencia» interpreta «a good conscience», que corresponde más directamente a «buena conciencia», y «mis palabras» introduce un antecedente que el «it» del testimonio no especifica. También conviene mantener el singular inclusivo de «either ... or» sin convertirlo en «ni uno ni otro hablan».
  naturalness: El registro es mayormente natural y digno para el español latinoamericano. «Con un corazón indiviso» es comprensible, pero «con un corazón no dividido» resulta más idiomático sin perder la metáfora. «Escuchar el cristianismo de un circuncidado» se entiende, aunque «oír hablar del cristianismo de boca de...» expresa con mayor naturalidad la mediación personal del original.
  terminology: «Judaísmo», «cristianismo», «circuncidado/incircunciso», «príncipe de este mundo» y «testimonio contra sí mismos» son opciones adecuadas. No se debe explicitar la identidad del príncipe ni convertir el referente final indeterminado en «mis palabras».
  issues:
  - severity: medium
    issue: «Limpia la conciencia» por «a good conscience»
    rationale: «Limpia» puede sugerir pureza o inocencia moral; «buena conciencia» reproduce de manera más directa la expresión del testimonio y preserva su alcance.
  - severity: medium
    issue: Adición de «mis palabras» en el cierre
    rationale: El testimonio dice únicamente «turn it into a testimony against themselves». Aunque el antecedente contextual pueda inferirse, añadirlo en el texto elimina una indeterminación que debe conservarse.
  - severity: low
    issue: «Ni uno ni otro hablan» pluraliza la formulación singular
    rationale: «If either the one or the other speak not» se refleja mejor con «si cualquiera de los dos no habla», sin afectar la aplicación a ambos posibles casos.
  - severity: low
    issue: «Corazón indiviso» es algo menos idiomático
    rationale: «Corazón no dividido» conserva la imagen de unidad interior y suena más natural en el registro actual.
  revised_text: 'Pero si alguien les expone el judaísmo, no lo escuchen, որովհետև es mejor oír hablar del cristianismo de boca de un circuncidado que del judaísmo de boca de un incircunciso. Pero si cualquiera de los dos no habla acerca de Jesucristo, los considero lápidas y sepulcros de muertos, en los que solo están inscritos nombres de hombres.


    Por tanto, rehúyan las malas artes y las intrigas del príncipe de este mundo, no sea que sus maquinaciones los aplasten y se debiliten en su amor. Pero reúnanse todos con un corazón no dividido. Y[a]


    Doy gracias a mi Dios porque tengo buena conciencia en mi trato con ustedes. Nadie puede jactarse, ni en secreto ni abiertamente, de que fui una carga para alguien, ya fuera en cosas pequeñas o grandes. Sí, y por todos aquellos entre quienes hablé, ruego que no lo conviertan en un testimonio contra sí mismos.'
  revised_footnotes:
  - marker: a
    text: El «Y» queda abruptamente al final de la oración en el testimonio disponible, probablemente porque enlaza con material siguiente o refleja una discontinuidad textual.
    reason: Señala una ruptura sintáctica del testimonio sin suprimirla ni reconstruir conjeturalmente el texto antes de la revisión directa del griego.
  revision_rationale: Se corrigen dos expansiones o matices no exigidos por el testimonio («limpia» y «mis palabras»), se ajusta la concordancia de la alternativa singular y se mejora la naturalidad de algunas expresiones. Se conserva la conjunción final abrupta con su nota, así como las ambigüedades históricas y teológicas del pasaje.
