base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: es
  text: 'Pero si alguien les enseña el judaísmo, no lo escuchen; porque es mejor oír el cristianismo de un circuncidado que el judaísmo de un incircunciso. Pero si ni uno ni otro hablan acerca de Jesucristo, para mí son como lápidas y sepulcros de muertos, en los que solo están inscritos nombres de hombres.


    Rehúyan, por tanto, las malas artes y las intrigas del príncipe de este mundo, no sea que sus maquinaciones los aplasten y se debiliten en su amor. Más bien, reúnanse todos con un corazón indiviso. Y[a]


    Doy gracias a mi Dios porque tengo limpia la conciencia en mi trato con ustedes. Nadie puede jactarse, ni en secreto ni en público, de que yo haya sido una carga para alguien, ni en cosas pequeñas ni en grandes. Es más, respecto de todos aquellos entre quienes hablé, ruego que no conviertan mis palabras en un testimonio contra ellos mismos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El «Y» queda abruptamente al final de la oración en el testimonio disponible, probablemente porque enlaza con material siguiente o refleja una discontinuidad textual.
    reason: Señalar una ruptura sintáctica real sin eliminarla ni reconstruir de manera conjetural el texto pendiente de revisión directa del griego.
lexical_decisions:
- source_word: Judaism
  choice: el judaísmo
  rationale: Conserva la contraposición histórica y religiosa explícita del testimonio, sin ampliarla ni suavizarla.
- source_word: Christianity
  choice: el cristianismo
  rationale: Mantiene el sustantivo abstracto paralelo a «judaísmo» y la formulación del testimonio disponible.
- source_word: tombstones and graves of the dead
  choice: lápidas y sepulcros de muertos
  rationale: Preserva las dos imágenes funerarias y su fuerza retórica sin identificar indebidamente a las personas con los muertos mismos.
- source_word: prince of this world
  choice: príncipe de este mundo
  rationale: Es una formulación tradicional, clara y formal que deja intacta la referencia teológica del texto.
- source_word: undivided heart
  choice: un corazón indiviso
  rationale: Reproduce la imagen de unidad interior y comunitaria con lenguaje digno y comprensible.
- source_word: was burdensome
  choice: haya sido una carga
  rationale: Expresa naturalmente en español la afirmación de no haber gravado a nadie, sin especificar una carga económica que el testimonio no hace explícita.
theological_decisions:
- issue: Relación entre circuncisión, judaísmo, cristianismo y confesión de Cristo
  choice: Conservar literalmente el contraste y hacer de hablar acerca de Jesucristo el criterio común aplicado a ambos grupos.
  alternative: Reformular el pasaje como una condena general de un pueblo o como una oposición entre Antiguo y Nuevo Testamento.
  rationale: El texto critica una enseñanza desvinculada de Jesucristo y aplica la misma prueba al circuncidado y al incircunciso; no autoriza una ampliación étnica ni doctrinal.
- issue: Identidad del «príncipe de este mundo»
  choice: Mantener el título sin glosa identificadora en el cuerpo del texto.
  alternative: Traducir directamente «Satanás» o «el diablo».
  rationale: La expresión figurada debe conservarse para no resolver en la traducción una identificación teológica implícita.
- issue: Referencia de «testimonio contra ellos mismos»
  choice: Traducir «mis palabras» como referente contextual de aquello que podrían convertir en testimonio contra sí mismos.
  alternative: Dejar un pronombre neutro sin antecedente claro o identificar el testimonio con la conducta de Ignacio.
  rationale: El cierre vincula naturalmente la advertencia con lo que Ignacio dijo entre ellos, pero la formulación evita desarrollar una explicación doctrinal adicional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y formas verbales correspondientes. El borrador se basa en el testimonio inglés público suministrado porque la revisión directa de la tradición griega de recensión media sigue pendiente; por ello se preservan las ambigüedades y la abrupta conjunción final en vez de proponer retroversiones seguras.
