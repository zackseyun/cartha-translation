base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: es
  text: 'Nada de esto se les oculta, si son maduros en su fe y amor hacia Jesucristo, pues estos son el principio y el fin de la vida: la fe es el principio y el amor es el fin. Y los dos, hallados en unidad, son Dios[a], mientras que todo lo demás los sigue hacia la verdadera nobleza.


    Nadie que profesa la fe peca, y nadie que posee amor odia[b]. El árbol se da a conocer por su fruto; del mismo modo, quienes profesan pertenecer a Cristo serán reconocidos por sus obras. Porque la Obra[c] no consiste ahora en profesarla, sino que se hace patente cuando alguien persevera en el poder de la fe hasta el fin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «los dos, hallados en unidad, son Dios» reproduce de manera provisional la formulación del testimonio inglés. Su sentido exacto debe confirmarse mediante revisión directa del griego.
    reason: Preservar una formulación teológicamente difícil sin armonización y declarar la limitación de la base documental.
  - marker: b
    text: Las afirmaciones sobre no pecar y no odiar se conservan en su forma absoluta, como aparecen en el testimonio, sin añadir calificativos como «habitualmente».
    reason: Evitar resolver silenciosamente la tensión ética y teológica del texto.
  - marker: c
    text: Se conserva «Obra» con mayúscula siguiendo el testimonio suministrado; la revisión del griego deberá determinar si esta distinción editorial resulta justificable.
    reason: Transparentar una decisión editorial heredada de la fuente provisional.
lexical_decisions:
- source_word: perfect (Greek review pending)
  choice: maduros
  rationale: En este contexto, comunica plenitud o madurez en la fe y el amor sin sugerir necesariamente impecabilidad absoluta.
- source_word: true nobility
  choice: verdadera nobleza
  rationale: Conserva la formulación ética y elevada del testimonio, sin sustituirla por una interpretación más específica.
- source_word: professing / profession
  choice: profesa / profesarla
  rationale: Mantiene la repetición conceptual entre la declaración de fe y la conducta observable.
- source_word: Work
  choice: Obra
  rationale: Se conserva la mayúscula del testimonio suministrado y su posible peso conceptual, señalando la incertidumbre en nota.
- source_word: found in the power of faith unto the end
  choice: persevera en el poder de la fe hasta el fin
  rationale: Expresa naturalmente la idea de ser hallado permaneciendo bajo la eficacia de la fe, sin perder el énfasis en la constancia final.
theological_decisions:
- issue: La afirmación «los dos... son Dios»
  choice: Se conserva literalmente con nota de cautela textual
  alternative: Interpretar «conducen a Dios», «son de Dios» o «Dios está donde ambos se unen»
  rationale: El testimonio inglés presenta una afirmación teológicamente tensa. No debe armonizarse sin revisión directa del griego.
- issue: Las afirmaciones absolutas sobre pecado y odio
  choice: Se mantienen como máximas sin calificarlas en el cuerpo
  alternative: Añadir «habitualmente» o «deliberadamente»
  rationale: Introducir esos adverbios resolvería una tensión que el testimonio no resuelve.
- issue: Relación entre profesión y obras
  choice: Se preserva el contraste retórico entre profesar y hacerse patente por las obras
  alternative: Reformular como una doctrina explícita sobre justificación o salvación
  rationale: El pasaje enfatiza la autenticidad visible de la fe, pero no autoriza importar un sistema doctrinal denominacional.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» de manera implícita y vocabulario accesible. Borrador necesariamente provisional: la fuente proporcionada es un testimonio inglés de dominio público y la revisión directa de la tradición griega de recensión media sigue pendiente.'
