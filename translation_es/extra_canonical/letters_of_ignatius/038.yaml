base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: es
  text: Los efesios de Esmirna los saludan, desde donde también les escribo. Ellos están aquí conmigo para la gloria de Dios, como también ustedes, y, junto con Policarpo, obispo de los esmirniotas, me han reconfortado en cada aspecto. Sí, todas las demás iglesias también los saludan en honor de Jesucristo. Que estén bien en armonía conforme a Dios y tengan un espíritu inseparable, que es Jesucristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: salute
  choice: saludan
  rationale: Equivalente epistolar natural y digno en español latinoamericano actual.
- source_word: comforted
  choice: han reconfortado
  rationale: Conserva la idea de ánimo y consuelo brindados a Ignacio sin restringirla a una sola forma de ayuda.
- source_word: in the honor of Jesus Christ
  choice: en el honor de Jesucristo
  rationale: Se mantiene de cerca la formulación del testimonio disponible, aunque resulte menos idiomática, para no sustituir prematuramente la relación semántica antes de revisar el griego.
- source_word: godly concord
  choice: la concordia que agrada a Dios
  rationale: Expresa en lenguaje claro el sentido religioso del adjetivo inglés sin usar el potencialmente ambiguo «divina».
- source_word: possess ye a steadfast spirit
  choice: mantengan un espíritu firme
  rationale: «Mantengan» comunica de forma natural la exhortación a conservar una disposición estable.
theological_decisions:
- issue: Identificación del «espíritu firme» con Jesucristo
  choice: «un espíritu firme, que es Jesucristo»
  alternative: «un espíritu firme, es decir, Jesucristo» o «en espíritu firme, en Jesucristo»
  rationale: Se conserva la identificación explícita y llamativa del testimonio inglés, sin reinterpretarla como mera actitud humana ni armonizarla teológicamente.
- issue: Condición eclesial de Policarpo
  choice: «obispo de los esmirniotas»
  alternative: «obispo de Esmirna»
  rationale: La formulación personal/colectiva del testimonio distingue a la comunidad de sus miembros y evita modernizar innecesariamente el título territorial.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con tratamiento plural «ustedes». Borrador provisional basado en el testimonio inglés público suministrado; la revisión directa de la tradición griega de recensión media sigue pendiente.
