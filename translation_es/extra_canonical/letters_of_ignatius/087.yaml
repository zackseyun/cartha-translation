base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: es
  text: 'La oración de ustedes llegó hasta la iglesia que está en Antioquía de Siria. Procedente de allí, aunque prisionero con cadenas muy gratas a Dios, saludo a todos. No soy digno de pertenecer a esa iglesia, pues soy el último de sus miembros. Por voluntad divina se me concedió esto, no porque yo lo mereciera, sino por la gracia de Dios. Pido recibir esa gracia en plenitud para que, por medio de las oraciones de ustedes, pueda llegar a Dios.[a]


    Por tanto, para que la obra de ustedes alcance su plenitud tanto en la tierra como en el cielo, conviene que su iglesia designe, para honra de Dios, a un enviado de Dios que vaya hasta Siria y felicite a los hermanos, porque ya están en paz, han recobrado su debida estatura y les ha sido restaurada su plenitud.[b]


    Por eso me pareció conveniente que enviaran a uno de los suyos con una carta, para que se uniera a ellos en dar gloria por la calma que, por voluntad de Dios, les había sobrevenido, y porque, gracias a las oraciones de ustedes, ya estaban llegando a puerto seguro.[c] Puesto que ustedes son perfectos, sean también perfectas sus decisiones; porque, si desean hacer el bien, Dios está dispuesto a proporcionarles los medios.


    [a] «Llegar a Dios» conserva la expresión de Ignacio, que en el contexto de su cautiverio puede incluir la esperanza de alcanzar a Dios mediante el martirio, sin limitarse necesariamente a esa interpretación.

    [b] «Estatura» y «plenitud» mantienen las imágenes corporales usadas para describir la recuperación de la iglesia de Antioquía.

    [c] Lit. «a un puerto»; imagen de haber salido de la agitación y estar alcanzando seguridad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Llegar a Dios» conserva la expresión de Ignacio, que en el contexto de su cautiverio puede incluir la esperanza de alcanzar a Dios mediante el martirio, sin limitarse necesariamente a esa interpretación.
    reason: Preservar la ambigüedad y la tensión teológica de una fórmula ignaciana característica.
  - marker: b
    text: «Estatura» y «plenitud» mantienen las imágenes corporales usadas para describir la recuperación de la iglesia de Antioquía.
    reason: Aclarar metáforas que podrían parecer extrañas en español moderno sin eliminarlas del texto.
  - marker: c
    text: Lit. «a un puerto»; imagen de haber salido de la agitación y estar alcanzando seguridad.
    reason: Explicar la imagen náutica detrás de la formulación idiomática «puerto seguro».
lexical_decisions:
- source_word: θεοδεστάτοις δεσμοῖς (reconstrucción probable según la tradición griega; revisión directa pendiente)
  choice: con cadenas muy gratas a Dios
  rationale: Conserva el valor positivo y devocional del adjetivo sin convertirlo en la idea distinta de que las cadenas simplemente fueron impuestas por Dios.
- source_word: θεοδρόμος (término griego probable; revisión directa pendiente)
  choice: enviado de Dios
  rationale: Expresa una persona comisionada para viajar al servicio de Dios; evita el anacronismo político más marcado de «embajador».
- source_word: ἀπαρτισθῇ / ἀπηρτίσθη (formas probables del campo semántico de completar/restaurar)
  choice: alcance su plenitud / les ha sido restaurada su plenitud
  rationale: Mantiene la repetición conceptual y el sentido de una comunidad restablecida en su condición íntegra.
- source_word: εἰς θεὸν ἐπιτυχεῖν
  choice: llegar a Dios
  rationale: Conserva una fórmula característica de Ignacio y su posible resonancia martirial sin explicitar más de lo que dice el texto.
- source_word: λιμήν
  choice: puerto seguro
  rationale: Hace natural en español la metáfora náutica de llegar a un lugar de calma y resguardo.
theological_decisions:
- issue: El sentido de «llegar a Dios» en el contexto del cautiverio de Ignacio
  choice: Conservar «llegar a Dios» y explicar su posible resonancia martirial en nota
  alternative: Traducir explícitamente «alcanzar a Dios mediante el martirio»
  rationale: El texto admite una lectura vinculada al martirio, pero no expresa aquí de manera explícita el medio; la traducción no debe cerrar esa tensión.
- issue: La «perfección» de la iglesia y de sus decisiones
  choice: Mantener «perfectos» y «perfectas»
  alternative: Suavizar como «maduros» o «completos»
  rationale: La repetición retórica es teológicamente significativa y no afirma necesariamente impecabilidad moral; conservarla permite que el lector perciba la exhortación en sus propios términos.
- issue: La restauración de la iglesia de Antioquía
  choice: Presentarla como recuperación de paz, estatura y plenitud
  alternative: Interpretarla expresamente como restauración de un obispo o de una estructura eclesiástica concreta
  rationale: El pasaje alude a una recuperación comunitaria, pero el testimonio suministrado no identifica de forma inequívoca su mecanismo institucional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno; tratamiento plural con «ustedes». Se conservaron las metáforas de estatura, plenitud y puerto, y la fórmula ignaciana «llegar a Dios». Debido a que el expediente indica que la revisión directa de la tradición griega está pendiente y solo proporciona un testimonio inglés de dominio público, las identificaciones griegas consignadas en las decisiones léxicas son provisionales y deben cotejarse antes de la publicación crítica.
