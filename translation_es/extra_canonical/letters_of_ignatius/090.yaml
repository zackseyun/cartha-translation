base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: es
  text: 'Ignacio, llamado también Teóforo, a Policarpo, obispo de la iglesia de los esmirneos —o, más bien, que está bajo el cuidado de Dios Padre y de Jesucristo—: muchísimos saludos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: Teóforo
  rationale: Se conserva como sobrenombre tradicional transliterado, pues puede entenderse de más de una manera («portador de Dios» o «llevado por Dios») y traducirlo resolvería prematuramente esa ambigüedad.
- source_word: Smyrnaeans (Σμυρναίων)
  choice: los esmirneos
  rationale: Es el gentilicio español natural para los habitantes de Esmirna y mantiene la referencia local de la iglesia.
- source_word: bishop (ἐπίσκοπος)
  choice: obispo
  rationale: Es el equivalente histórico y eclesial establecido en español; se mantiene también en la expresión retórica aplicada a Dios Padre y a Jesucristo.
- source_word: abundant greeting (πλεῖστα χαίρειν)
  choice: abundantes saludos
  rationale: Reproduce la intensidad de la fórmula epistolar sin convertirla en una bendición más específica de lo que permite el testimonio disponible.
theological_decisions:
- issue: Dios Padre y Jesucristo como «obispo» de Policarpo
  choice: «uno que tiene por obispo a Dios Padre y a Jesucristo»
  alternative: «cuya verdadera autoridad pastoral es Dios Padre y Jesucristo»
  rationale: Se conserva la metáfora audaz y la tensión del texto, sin explicarla ni reemplazarla por una formulación doctrinal interpretativa.
- issue: Relación entre Policarpo y la iglesia de Esmirna
  choice: Se mantiene la corrección retórica «o, mejor dicho»
  alternative: Suprimirla y decir solamente que Policarpo es obispo de la iglesia
  rationale: La reformulación es parte significativa del saludo y desplaza deliberadamente la atención desde el cargo de Policarpo hacia su sujeción a Dios Padre y a Jesucristo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el carácter formal del encabezamiento epistolar y su juego retórico. Dado que la revisión directa del griego está pendiente y el material proporcionado es un testimonio inglés de dominio público, las decisiones se mantienen deliberadamente prudentes y cercanas a la evidencia disponible.
