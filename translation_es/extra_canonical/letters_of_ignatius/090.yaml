revisions:
- from: 'Ignacio, llamado también Teóforo, a Policarpo, obispo de la iglesia de los esmirneos —o, mejor dicho, uno que tiene por obispo a Dios Padre y a Jesucristo—: abundantes saludos.'
  to: 'Ignacio, llamado también Teóforo, a Policarpo, obispo de la iglesia de los esmirneos —o, más bien, que está bajo el cuidado de Dios Padre y de Jesucristo—: muchísimos saludos.'
  rationale: 'Se hacen dos correcciones seguras: se expresa la relación de Policarpo con Dios Padre y Jesucristo como cuidado o supervisión, preservando el contraste retórico del original sin una lectura doctrinalmente más fuerte, y se sustituye un calco epistolar por una fórmula española natural. No se añade el título «Señor» a Jesucristo, ya que no figura en el testimonio inglés suministrado y la revisión directa del griego está señalada como pendiente.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:00:14Z'
review_pass:
  verdict: revise
  source_fidelity: La corrección «o, más bien» y el saludo intensivo se mantienen. Sin embargo, la formulación «tiene por obispo a Dios Padre y a Jesucristo» convierte la construcción de supervisión/cuidado en una identificación predicativa que el texto no exige y que resulta menos precisa. La redacción revisada conserva el contraste retórico sin añadir esa afirmación.
  naturalness: «Muchísimos saludos» es una fórmula epistolar más idiomática en español actual que «abundantes saludos», a la vez que conserva la fuerza de la fórmula griega tradicionalmente vertida «abundant greeting». «Está bajo el cuidado de» es claro y digno en registro formal.
  terminology: Se conserva «Teóforo» sin desambiguar su sentido, «obispo» para el cargo de Policarpo y «esmirneos» como gentilicio admisible. Para la segunda cláusula se evita llamar literalmente «obispo» a Dios Padre y a Jesucristo, pues la construcción subyacente es mejor representada como supervisión o cuidado, aunque el original probablemente juega con el término episcopal.
  issues:
  - severity: medium
    issue: «uno que tiene por obispo a Dios Padre y a Jesucristo»
    rationale: La frase española presenta a Dios Padre y a Jesucristo como el complemento de «tener por obispo». El giro de la fuente es más fielmente expresado como que Policarpo es objeto de la supervisión o cuidado divinos; la revisión evita una reificación innecesaria de la metáfora.
  - severity: low
    issue: «abundantes saludos»
    rationale: Es comprensible, pero suena a calco poco usual en un encabezamiento epistolar. «Muchísimos saludos» conserva el énfasis con mayor naturalidad.
  revised_text: 'Ignacio, llamado también Teóforo, a Policarpo, obispo de la iglesia de los esmirneos —o, más bien, que está bajo el cuidado de Dios Padre y de Jesucristo—: muchísimos saludos.'
