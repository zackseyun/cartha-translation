review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva el argumento y las imágenes principales. No obstante, «son condenados a muerte» introduce un matiz judicial que no es necesario para «son ejecutados / son muertos», y la nota actual presenta como incierta una relación sintáctica que el griego establece: «por la cual» remite a «la fe».'
  naturalness: El registro es mayormente natural y digno. «Quien le haga caso» es algo coloquial en este contexto; «quien lo escucha» conserva el sentido básico de ἀκούω y mantiene un tono más adecuado. La pregunta retórica se formula de manera explícita para evitar una elipsis poco natural en español.
  terminology: Se mantienen «reino de Dios», «según la carne», «fe de Dios» y «fuego inextinguible». «Fe de Dios» conserva la ambigüedad posible del genitivo; la nota debe limitarse a esa ambigüedad, sin cuestionar indebidamente el antecedente de «por la cual».
  issues:
  - severity: medium
    issue: La nota afirma que debe confirmarse la relación de «por la cual» con la fe y la crucifixión.
    rationale: En el texto griego, el relativo femenino ἧς tiene como antecedente πίστιν («fe»). Puede mantenerse una nota sobre el valor del genitivo θεοῦ, pero no corresponde presentar como ambigua la referencia sintáctica del relativo.
  - severity: low
    issue: «Son condenados a muerte» añade un marco judicial explícito.
    rationale: El pasaje dice literalmente que tales personas «mueren una muerte»; el testimonio inglés lo vierte «are put to death». «Son ejecutados» expresa mejor esa consecuencia sin introducir el acto previo de una condena.
  - severity: low
    issue: «Quien le haga caso» baja levemente el registro y puede sugerir seguimiento más allá de «escuchar».
    rationale: ἀκούων αὐτοῦ significa literalmente «quien lo escucha»; esta formulación es natural, sobria y no restringe ni amplía el verbo.
  revised_text: 'No se engañen, hermanos míos. Los que corrompen hogares no heredarán el reino de Dios.


    Si quienes hacen tales cosas según la carne son ejecutados, ¿cuánto mayor será el castigo para quien, mediante una enseñanza perversa, corrompe la fe de Dios[a], por la cual Jesucristo fue crucificado? Tal persona, habiéndose contaminado, irá al fuego inextinguible; y lo mismo le sucederá a quien lo escucha.'
  revised_footnotes:
  - marker: a
    text: La expresión «la fe de Dios» puede entenderse como la fe que pertenece o procede de Dios, o como «la fe en Dios». El griego vincula «por la cual» con «la fe».
    reason: Conserva la posible ambigüedad del genitivo sin presentar como incierta la referencia gramatical del relativo.
  revision_rationale: Se ajusta la formulación de la pena de muerte al sentido del texto, se hace natural en español la pregunta retórica implícita y se sustituye una expresión coloquial por una equivalente más sobria. La nota se corrige para reflejar la ambigüedad que permanece y la sintaxis que sí está determinada por el griego.
