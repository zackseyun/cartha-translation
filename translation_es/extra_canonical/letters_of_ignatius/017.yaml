base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: es
  text: 'No se engañen, hermanos míos. Los que corrompen hogares no heredarán el reino de Dios.


    Si quienes hacen tales cosas según la carne son condenados a muerte, ¡cuánto más el que, mediante una enseñanza perversa, corrompe la fe de Dios, por la cual Jesucristo fue crucificado![a] Tal persona, habiéndose contaminado, irá al fuego inextinguible; y lo mismo le sucederá a quien le haga caso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «la fe de Dios» también puede entenderse como «la fe en Dios». La relación exacta de «por la cual» con la fe y la crucifixión debe confirmarse mediante revisión directa del griego.
    reason: El material proporcionado es un testimonio inglés y señala que la revisión de la fuente griega sigue pendiente; conviene preservar la ambigüedad teológica y sintáctica.
lexical_decisions:
- source_word: corrupters of houses
  choice: los que corrompen hogares
  rationale: Conserva la formulación amplia del testimonio disponible sin precisar una clase de conducta que la revisión griega pendiente podría matizar.
- source_word: after the flesh
  choice: según la carne
  rationale: Mantiene la expresión conceptual antigua y su contraste retórico, evitando reducirla a una explicación interpretativa.
- source_word: evil doctrine
  choice: enseñanza perversa
  rationale: Expresa doctrina dañina o moralmente mala en español actual y digno.
- source_word: hearkeneth unto him
  choice: le haga caso
  rationale: Comunica no solo oír, sino prestar atención y seguir la enseñanza, con naturalidad en español latinoamericano.
- source_word: unquenchable fire
  choice: fuego inextinguible
  rationale: Reproduce de manera concisa la imagen de un fuego que no puede apagarse.
theological_decisions:
- issue: El sentido de «la fe de Dios» y su relación con la crucifixión
  choice: la fe de Dios, por la cual Jesucristo fue crucificado
  alternative: la fe en Dios, por la cual Jesucristo fue crucificado
  rationale: Se conserva el genitivo ambiguo del testimonio y la conexión sintáctica, sin decidir si se trata de la fe que procede de Dios, le pertenece o tiene a Dios por objeto.
- issue: Consecuencia para quien escucha al corruptor
  choice: lo mismo le sucederá a quien le haga caso
  alternative: también irá al fuego quien lo escuche
  rationale: Mantiene que la misma consecuencia alcanza al oyente, pero evita entender «escuchar» como mera percepción auditiva.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa el plural «ustedes» implícito en «no se engañen». El borrador es necesariamente provisional porque el material suministrado no incluye el texto griego de la recensión media; se traduce con cautela desde el testimonio inglés público y se señala la principal incertidumbre en nota.
