review_pass:
  verdict: revise
  source_fidelity: El borrador conserva bien el argumento y la imaginería del testimonio inglés. Sin embargo, «son condenados a muerte» expresa una sentencia, mientras que «are put to death» expresa la ejecución; conviene reflejar esta última. La formulación «le haga caso» añade la idea de seguir o aceptar activamente, donde el testimonio dice simplemente «hearken/listens».
  naturalness: El español es claro y de registro digno. «No se dejen engañar» comunica más naturalmente la exhortación pasiva que «No se engañen». «Hogares» conserva prudentemente la amplitud de «houses/households».
  terminology: «Según la carne», «enseñanza perversa», «la fe de Dios» y «fuego inextinguible» son opciones adecuadas y no imponen una lectura doctrinal. Se mantiene la ambigüedad del genitivo en «la fe de Dios».
  issues:
  - severity: medium
    issue: «son condenados a muerte»
    rationale: El inglés de control dice «are put to death», no meramente que reciben una condena. «Son ejecutados» conserva la acción descrita.
  - severity: medium
    issue: «quien le haga caso»
    rationale: «Hacer caso» implica obedecer o aceptar el mensaje. «Hearkeneth/listens to him» debe mantenerse como escuchar o prestar oído, sin añadir esa inferencia.
  - severity: low
    issue: «No se engañen»
    rationale: Puede leerse como que ellos mismos se engañan. «No se dejen engañar» reproduce con mayor claridad la advertencia de no ser engañados.
  revised_text: 'No se dejen engañar, hermanos míos. Los que corrompen hogares no heredarán el reino de Dios.


    Si quienes hacen tales cosas según la carne son ejecutados, ¡cuánto más quien, mediante una enseñanza perversa, corrompe la fe de Dios, por la cual Jesucristo fue crucificado![a] Tal persona, habiéndose contaminado, irá al fuego inextinguible; y lo mismo sucederá con quien lo escuche.'
  revised_footnotes:
  - marker: a
    text: La expresión «la fe de Dios» también puede entenderse como «la fe en Dios». La redacción conserva la ambigüedad del testimonio disponible respecto del sentido de esta expresión.
    reason: El genitivo en «la fe de Dios» admite más de una comprensión; no debe resolverse doctrinalmente sin confirmación directa de la fuente griega.
  revision_rationale: Se corrigen dos cambios de sentido introducidos por el borrador —la condena en vez de la ejecución y el hacer caso en vez de escuchar— y se mejora la claridad de la exhortación inicial. Se conserva la terminología teológica y la ambigüedad señalada, dado que el expediente proporciona un testimonio inglés y documenta que la revisión directa del griego sigue pendiente.
