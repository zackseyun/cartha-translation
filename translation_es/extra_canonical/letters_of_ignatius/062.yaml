base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: es
  text: 'Recuerden en sus oraciones a la iglesia que está en Siria, la cual tiene a Dios como pastor en mi lugar. Jesucristo mismo velará por ella, junto con el amor de ustedes.[a]


    Pero yo me avergüenzo de ser llamado uno de ellos, porque no soy digno: soy el último de todos y como uno nacido fuera de tiempo. Sin embargo, he recibido misericordia para llegar a ser alguien, si en verdad llego hasta Dios.[b]


    Mi espíritu los saluda, y también el amor de las iglesias que me recibieron en el nombre de Jesucristo, no como a un simple viajero. Incluso las iglesias que no estaban en mi ruta según la carne[c] se adelantaban para recibirme de ciudad en ciudad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La frase coordina a «Jesucristo mismo» con «el amor de ustedes» de manera abrupta: ambos se asocian con la acción de velar por la iglesia en Siria. El verbo griego está emparentado con el término «obispo».'
    reason: Reflejar la sintaxis y el juego terminológico del texto sin introducir la afirmación de que Cristo es «el único obispo».
  - marker: b
    text: «Llegar hasta Dios» probablemente alude aquí a culminar fielmente el camino que Ignacio espera recorrer, incluido su martirio, pero el texto no lo dice de manera explícita.
    reason: Dar el contexto probable manteniendo abierta la formulación del autor.
  - marker: c
    text: Aquí «según la carne» se refiere probablemente a su recorrido físico o geográfico, en contraste con las iglesias que no se encontraban directamente en ese trayecto.
    reason: Aclarar un modismo antiguo que una traducción literal puede hacer poco transparente.
lexical_decisions:
- source_word: ποιμήν / shepherd (witness)
  choice: pastor
  rationale: Conserva la imagen de quien cuida y guía a la comunidad; en español eclesial actual resulta natural sin perder la metáfora pastoral.
- source_word: ἐπίσκοπος / bishop (witness)
  choice: obispo
  rationale: Mantiene el término histórico del ministerio eclesial y el contraste con la función anterior de Ignacio.
- source_word: ἔκτρωμα / untimely birth (witness)
  choice: como uno nacido fuera de tiempo
  rationale: Reproduce la imagen fuerte de un nacimiento anómalo o prematuro sin imponer una precisión médica no segura en esta etapa de revisión.
- source_word: κατὰ σάρκα / according to the flesh (witness)
  choice: según la carne
  rationale: Conserva literalmente una expresión antigua potencialmente significativa y deja que una nota aclare su sentido contextual.
- source_word: τυχεῖν θεοῦ / attain unto God (witness)
  choice: llego hasta Dios
  rationale: Expresa la meta de alcanzar a Dios sin sustituirla por una interpretación explícita como muerte, martirio o salvación.
theological_decisions:
- issue: La relación sintáctica entre Jesucristo y el amor de los destinatarios como cuidado episcopal de la iglesia siria
  choice: '«Jesucristo solo será su obispo: él y el amor de ustedes»'
  alternative: «Solo Jesucristo, junto con el amor de ustedes, ejercerá como su obispo»
  rationale: 'Se conserva la tensión retórica del testimonio disponible: Cristo es presentado como el único obispo, mientras el amor de los romanos aparece coordinado con él sin explicar de manera doctrinal cómo se relacionan ambos.'
- issue: El sentido de «llegar hasta Dios»
  choice: Mantener la formulación abierta
  alternative: Traducir «si alcanzo el martirio» o «si muero y voy a Dios»
  rationale: El contexto puede apuntar al martirio, pero el texto expresa la meta como llegar a Dios; explicitar el martirio resolvería una implicación que conviene preservar.
- issue: La autodescripción como «nacido fuera de tiempo»
  choice: Conservar la imagen
  alternative: «un aborto» o «un nacido prematuro»
  rationale: La imagen expresa indignidad y aparición tardía o anómala; una equivalencia más específica podría estrechar indebidamente su alcance.
translation_notes:
  register: Español latinoamericano neutral, digno y accesible. Se usa «ustedes» y se mantiene el vocabulario histórico «iglesia», «pastor» y «obispo». Debido a que la revisión directa del griego está pendiente y el material proporcionado es un testimonio inglés de dominio público, el borrador evita decisiones excesivamente específicas y señala las principales ambigüedades.
