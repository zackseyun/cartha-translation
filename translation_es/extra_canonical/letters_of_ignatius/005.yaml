revisions:
- from: 'Así pues, conviene que ustedes marchen en armonía con el sentir del obispo, como en efecto ya lo hacen. Porque su honorable consejo de ancianos, digno de Dios, está afinado con el obispo como las cuerdas con una lira. De este modo, en la concordia y el amor armonioso de ustedes se entona a Jesucristo.


    Que cada uno de ustedes se una al coro, para que, armonizados en la concordia y tomando de Dios la nota inicial, canten al unísono y con una sola voz al Padre por medio de Jesucristo. Así él los escuchará y, por las buenas obras de ustedes, reconocerá que son miembros de su Hijo. Por tanto, les conviene permanecer en una unidad irreprochable, para que participen siempre de Dios.[a]'
  to: 'Así pues, les conviene correr juntos en armonía con el parecer del obispo, como en efecto lo hacen. Pues su honorable consejo de ancianos, digno de Dios, está armonizado con el obispo como las cuerdas con una lira. Por eso, en la concordia de ustedes y en su amor armonioso, se canta a Jesucristo.


    Formen todos un coro, para que, estando armonizados en concordia y recibiendo el tono de Dios, canten al unísono, con una sola voz, al Padre por medio de Jesucristo, para que él los escuche y, por las buenas obras que hacen, reconozca que son miembros de su Hijo. Por tanto, les conviene estar en una unidad irreprochable, para que siempre participen de Dios.[a]'
  rationale: 'La revisión restituye imágenes y relaciones sintácticas del griego: el correr conjuntamente, el tono recibido de Dios y la cláusula final dirigida al Padre. Mantiene las decisiones acertadas del borrador respecto de la metáfora musical, el cuerpo de ancianos, la pertenencia al Hijo y la participación en Dios, sin imponer interpretaciones eclesiológicas o soteriológicas posteriores.'
