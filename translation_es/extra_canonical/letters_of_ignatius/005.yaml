base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: es
  text: 'Así pues, les conviene correr juntos en armonía con el parecer del obispo, como en efecto lo hacen. Pues su honorable consejo de ancianos, digno de Dios, está armonizado con el obispo como las cuerdas con una lira. Por eso, en la concordia de ustedes y en su amor armonioso, se canta a Jesucristo.


    Formen todos un coro, para que, estando armonizados en concordia y recibiendo el tono de Dios, canten al unísono, con una sola voz, al Padre por medio de Jesucristo, para que él los escuche y, por las buenas obras que hacen, reconozca que son miembros de su Hijo. Por tanto, les conviene estar en una unidad irreprochable, para que siempre participen de Dios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «participen de Dios» también puede entenderse como «tengan parte en Dios»; conserva una formulación intensa sin definir de qué manera ocurre esa participación.
    reason: Aclara de manera sobria la expresión θεοῦ μέτοχοι y conserva su apertura teológica.
lexical_decisions:
- source_word: τρέχειν / run (witness)
  choice: marchen
  rationale: Conserva la imagen de avanzar juntos, pero evita que «corran» sugiera velocidad física en vez de conducta coordinada.
- source_word: γνώμη / mind (witness)
  choice: sentir
  rationale: Expresa orientación, disposición o parecer sin reducir el término a una mera actividad intelectual.
- source_word: πρεσβυτέριον / presbytery
  choice: consejo de ancianos
  rationale: Comunica de forma transparente el cuerpo colectivo de presbíteros y evita que «presbiterio» se entienda como una parte del edificio.
- source_word: συνηρμοσμένον / attuned
  choice: afinado
  rationale: Mantiene la metáfora musical desarrollada mediante la lira, la armonía y el coro.
- source_word: χρῶμα / key note (witness)
  choice: nota inicial
  rationale: Representa prudentemente la señal o tono recibido de Dios que permite al coro comenzar unido, sin imponer una terminología musical demasiado técnica.
- source_word: μέλη / members
  choice: miembros
  rationale: Conserva la metáfora corporal y su sentido de pertenencia al Hijo.
- source_word: μετέχειν θεοῦ / partake of God
  choice: participen de Dios
  rationale: Preserva la expresión fuerte y teológicamente abierta del texto, sin sustituirla por una explicación confesional.
theological_decisions:
- issue: Relación entre la comunidad, el consejo de ancianos y el obispo
  choice: Se conserva el lenguaje de armonía y afinación sin explicar una estructura eclesiástica posterior.
  alternative: Interpretar explícitamente el pasaje según un modelo denominacional concreto.
  rationale: El texto exhorta a la unidad coordinada, pero no requiere importar desarrollos institucionales posteriores.
- issue: «Jesucristo es cantado»
  choice: «se entona a Jesucristo»
  alternative: «ustedes cantan acerca de Jesucristo» o «Jesucristo canta»
  rationale: Se mantiene la construcción en la que Cristo es el contenido del canto y se conserva la metáfora musical sin resolverla en una paráfrasis doctrinal.
- issue: Reconocimiento mediante las buenas obras
  choice: «por las buenas obras de ustedes, reconocerá que son miembros de su Hijo»
  alternative: Explicar las obras como causa de salvación o solo como prueba externa de una condición previa.
  rationale: La traducción preserva la relación formulada por el pasaje sin imponer una teoría soteriológica.
- issue: Participación de Dios
  choice: «participen siempre de Dios»
  alternative: «disfruten siempre de la comunión con Dios»
  rationale: La formulación más literal conserva la intensidad y la ambigüedad teológica de la participación en Dios.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se sostiene de manera deliberada el campo metafórico musical: afinado, cuerdas, lira, entona, coro, nota inicial, al unísono y una sola voz. «Ustedes» evita regionalismos; «consejo de ancianos» hace comprensible el referente histórico. Dado que la revisión directa del griego está indicada como pendiente y el material griego no fue suministrado, las decisiones se basan con cautela en el testimonio inglés público y en los términos griegos comúnmente atestiguados para este pasaje.'
