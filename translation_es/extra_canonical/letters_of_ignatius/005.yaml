    reason: Aclara de manera sobria la expresión θεοῦ μέτοχοι y conserva su apertura teológica.
  revision_rationale: 'La revisión restituye imágenes y relaciones sintácticas del griego: el correr conjuntamente, el tono recibido de Dios y la cláusula final dirigida al Padre. Mantiene las decisiones acertadas del borrador respecto de la metáfora musical, el cuerpo de ancianos, la pertenencia al Hijo y la participación en Dios, sin imponer interpretaciones eclesiológicas o soteriológicas posteriores.'
