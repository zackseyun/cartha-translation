base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: es
  text: '¿Acaso no soy capaz de escribirles acerca de las cosas celestiales? Pero temo hacerles daño, pues todavía son niños. Así que ténganme paciencia, no sea que, por no poder asimilarlas, se ahoguen.


    Porque aun yo, aunque estoy encadenado y puedo comprender las cosas celestiales, las formaciones de los ángeles y las concentraciones de los principados, las cosas visibles y las invisibles, ni siquiera por eso soy ya discípulo. Pues nos faltan muchas cosas, para que Dios no nos falte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly things
  choice: las cosas celestiales
  rationale: Conserva la amplitud de la expresión del testimonio y evita precisar indebidamente si se trata de misterios, doctrinas o realidades celestes.
- source_word: babes
  choice: niños
  rationale: Expresa inmadurez y capacidad limitada en español natural, sin el matiz excesivamente literal de «bebés» en este contexto exhortativo.
- source_word: take them in
  choice: asimilarlas
  rationale: Comunica la idea de recibir y comprender enseñanzas difíciles, a la vez que mantiene la metáfora alimentaria que culmina en «se ahoguen».
- source_word: arrays
  choice: formaciones
  rationale: Mantiene la imagen de seres angélicos dispuestos en orden, con posible matiz militar, sin convertirla en una jerarquía técnica.
- source_word: musterings
  choice: concentraciones
  rationale: Representa la reunión o movilización de los principados y conserva su distinción respecto de las «formaciones» angélicas.
- source_word: principalities
  choice: principados
  rationale: Es el equivalente tradicional y reconocible para una categoría de potestades espirituales, sin explicar de más su naturaleza.
- source_word: disciple
  choice: discípulo
  rationale: Preserva el término teológico y formativo, así como la afirmación paradójica de que el conocimiento no basta para constituir al discípulo.
theological_decisions:
- issue: Relación entre conocimiento celestial y discipulado
  choice: «ni siquiera por eso soy ya discípulo»
  alternative: «eso todavía no me hace discípulo»
  rationale: 'La formulación elegida conserva el énfasis y la tensión del testimonio: comprender realidades celestiales no constituye por sí solo el discipulado.'
- issue: Sentido de la frase final sobre la carencia humana y Dios
  choice: «nos faltan muchas cosas, para que Dios no nos falte»
  alternative: «carecemos de muchas cosas, a fin de no carecer de Dios»
  rationale: Se preserva la paradoja deliberada sin resolver si expresa dependencia, disciplina espiritual o prioridad de Dios sobre otros bienes.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la imaginería de alimento y ahogo, el lenguaje cósmico y la paradoja final. El borrador es necesariamente provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa del griego de la recensión media está pendiente.
