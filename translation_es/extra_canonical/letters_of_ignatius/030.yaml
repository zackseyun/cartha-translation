base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: es
  text: 'Por tanto, así como el Señor no hizo nada sin el Padre, [estando unido a él],[a] ni por sí mismo ni por medio de los apóstoles, tampoco ustedes hagan nada sin el obispo y los presbíteros. No intenten considerar correcto lo que piensen por su propia cuenta, separados de los demás; más bien, haya una sola oración en común, una sola súplica, un solo sentir y una sola esperanza, en amor y en una alegría irreprochable: Jesucristo, mejor que quien no hay nada.


    Apresúrense todos a reunirse como en un solo templo: Dios; como ante un solo altar: Jesucristo, quien procedió del único Padre, estaba con el Uno y volvió al Uno.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «estando unido a él» aparece entre corchetes en el testimonio utilizado, señal de que su presencia o forma textual es incierta.
    reason: Preservar de forma visible la señal editorial de restauración del testimonio inglés provisional.
  - marker: b
    text: 'También podría traducirse más literalmente: «salió de un solo Padre, estaba con uno y partió hacia uno». La formulación griega requiere revisión directa.'
    reason: Advertir la repetición y ambigüedad de «uno» en un borrador basado provisionalmente en un testimonio inglés.
lexical_decisions:
- source_word: 'bishop (Greek: episkopos)'
  choice: obispo
  rationale: Es el equivalente histórico y natural en español para el cargo eclesial mencionado, sin ampliar sus funciones.
- source_word: 'presbyters (Greek: presbyteroi)'
  choice: presbíteros
  rationale: Conserva la designación antigua y evita sustituirla interpretativamente por «sacerdotes» o «ancianos».
- source_word: one mind
  choice: un solo sentir
  rationale: Expresa unidad de disposición y pensamiento en español natural, sin sugerir identidad mental literal.
- source_word: altar
  choice: altar
  rationale: Mantiene la imagen cultual del testimonio sin explicar de manera denominacional su referente.
- source_word: came forth ... departed unto
  choice: procedió ... volvió
  rationale: Reproduce el movimiento de origen y retorno del pasaje en lenguaje actual; «procedió» conserva la formulación teológicamente densa.
theological_decisions:
- issue: La unión del Señor con el Padre
  choice: Conservar «[estando unido a él]» entre corchetes
  alternative: Integrarlo sin corchetes u omitirlo
  rationale: Los corchetes del testimonio señalan una restauración o incertidumbre textual; conservarlos evita presentar la frase como indiscutida.
- issue: Relación entre la oración, esperanza, amor, alegría y Jesucristo
  choice: Usar dos puntos antes de «Jesucristo»
  alternative: Traducir «la cual es Jesucristo» haciendo concordar el relativo con un antecedente concreto
  rationale: La construcción permite más de una relación sintáctica. Los dos puntos conservan la identificación culminante sin decidir que solo «esperanza» o «alegría» sea el antecedente.
- issue: El único Padre y «el Uno»
  choice: Distinguir «el único Padre» de «el Uno»
  alternative: Repetir «un Padre... uno... uno» o explicitar «el Padre» en las tres cláusulas
  rationale: Conserva la repetición enfática y su tensión teológica sin borrar la diferencia de formulación ni imponer una explicación.
- issue: La autoridad del obispo y los presbíteros
  choice: Traducir la exhortación directamente sin glosa
  alternative: Definir el alcance sacramental, jurídico o congregacional de la obediencia
  rationale: El texto exhorta a actuar comunitariamente con estos dirigentes, pero no especifica aquí un sistema eclesiológico completo.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se conserva el tono exhortativo. Este es un borrador provisional: la fuente suministrada es un testimonio inglés de dominio público y la revisión directa del griego de la recensión media está pendiente.'
