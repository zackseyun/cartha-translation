review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones seguras. «Como en un solo templo: Dios» y «como ante un solo altar» no reproducen adecuadamente el movimiento de «come together as to ... God / ... Jesus Christ»; además, «estaba con el Uno» contradice el «is with One» del testimonio auditado. La construcción final conserva una repetición deliberada de «uno» que no debe explicarse doctrinalmente.'
  naturalness: El registro general es adecuado, pero «Jesucristo, mejor que quien no hay nada» no es español natural ni expresa bien «than whom there is nothing better». La colocación de la llamada [a] después de una coma también es defectuosa.
  terminology: «Obispo», «presbíteros», «altar» y «un solo sentir» son elecciones apropiadas. Se conserva «Uno» como designación repetida y ambigua, sin identificarla mediante una glosa doctrinal.
  issues:
  - severity: high
    issue: Dirección e imágenes de templo y altar
    rationale: El borrador cambia «reunirse ... como hacia/a un templo, hacia Dios; ... hacia un altar, hacia Jesucristo» por «como en ... Dios» y «como ante ... Jesucristo». Conviene mantener la dirección de la exhortación y el paralelismo.
  - severity: high
    issue: «Estaba con el Uno»
    rationale: El testimonio inglés dice «is with One»; el pasado del borrador no está justificado por la base suministrada.
  - severity: medium
    issue: Cláusula «mejor que quien no hay nada»
    rationale: Es una construcción antinatural. «Fuera de quien no hay nada mejor» reproduce de manera clara el sentido comparativo sin resolver la relación sintáctica previa.
  - severity: low
    issue: Anclaje de nota a
    rationale: La llamada debe ir inmediatamente tras el cierre del corchete, antes de la coma.
  - severity: medium
    issue: Nota b presenta «estaba» como alternativa literal
    rationale: La nota debe reflejar el presente «está» del testimonio inglés y no llamar «más literal» a una formulación que altera ese tiempo.
  revised_text: 'Por tanto, así como el Señor no hizo nada sin el Padre, [estando unido a él][a], ni por sí mismo ni por medio de los apóstoles, tampoco ustedes hagan nada sin el obispo y los presbíteros. No intenten considerar correcto nada por su propia cuenta, separados de los demás; más bien, haya una sola oración en común, una sola súplica, un solo sentir y una sola esperanza, en amor y en alegría irreprochable, lo cual es Jesucristo, fuera de quien no hay nada mejor.


    Apresúrense todos a reunirse como hacia un solo templo, hacia Dios; como hacia un solo altar, hacia un solo Jesucristo, quien salió de un solo Padre, está con el Uno y volvió al Uno.[b]'
  revised_footnotes:
  - marker: a
    text: La frase «estando unido a él» aparece entre corchetes en el testimonio utilizado, señal de que su presencia o forma textual es incierta.
    reason: Preserva la señal editorial de restauración del testimonio inglés provisional.
  - marker: b
    text: 'También podría traducirse más literalmente: «salió de un solo Padre, está con uno y partió hacia uno». La repetición de «uno» y su referencia requieren revisión directa del griego.'
    reason: Conserva el presente del testimonio auditado y advierte la ambigüedad sin interpretarla doctrinalmente.
  revision_rationale: Se corrigen el movimiento direccional de las metáforas de templo y altar, el tiempo verbal de «está con el Uno», la formulación comparativa final y el anclaje de la nota. «Lo cual es Jesucristo» mantiene, en la medida que permite el español, la referencia abarcadora y sintácticamente difícil de la cláusula sin seleccionar un único antecedente. La traducción sigue siendo provisional hasta la revisión directa del griego de la recensión media.
