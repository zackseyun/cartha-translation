review_pass:
  verdict: revise
  source_fidelity: 'La estructura exhortativa, los cargos «obispo» y «presbíteros», y las imágenes de templo y altar se conservan. Sin embargo, el borrador altera o oscurece varias relaciones: «ni por sí mismo...» queda sintácticamente mal coordinado; «lo que piensen» añade un objeto que el texto no especifica; y la segunda comparación convierte las aposiciones («Dios», «un solo Jesucristo») en puntuación explicativa poco fiel. La formulación final debe mantener la repetición deliberada de «uno» y el movimiento de salida, estar en/con uno, y llegada a uno, sin decidir su explicación teológica.'
  naturalness: 'Se requiere revisión por expresiones poco naturales o incorrectas: «Jesucristo, mejor que quien no hay nada» es agramatical; «como en un solo templo: Dios» y «como ante un solo altar» no comunican bien la construcción; y «estaba con el Uno» cambia el presente del testimonio. La revisión conserva un español latinoamericano actual y solemne.'
  terminology: «Obispo», «presbíteros», «oración», «súplica» y «altar» son adecuados. Se conserva «un solo sentir» para νοῦς en este contexto. «Gozo irreprochable» refleja con más precisión el sustantivo y el calificativo del pasaje. «El Uno» se preserva como designación repetida y no se sustituye interpretativamente por «el Padre».
  issues:
  - severity: high
    issue: Construcción defectuosa en «ni por sí mismo ni por medio de los apóstoles»
    rationale: Tras «no hizo nada sin el Padre», la coordinación española apropiada es «ni por sí mismo ni por medio de los apóstoles», sin la coma y con una conexión clara al verbo principal.
  - severity: medium
    issue: «Lo que piensen» restringe indebidamente «pensar nada correcto»
    rationale: El texto prohíbe juzgar o tener por recto algo de manera aislada; no se refiere específicamente al contenido de sus pensamientos. Se revisa como «no consideren correcto nada por cuenta propia, separados de los demás».
  - severity: high
    issue: Final agramatical y puntuación interpretativa en la identificación con Jesucristo
    rationale: «Mejor que quien no hay nada» no es español idiomático. Se expresa la superioridad absoluta como «por encima de quien no hay nada mejor» y se mantiene la identificación mediante una relativa que conserva la tensión sintáctica del original.
  - severity: high
    issue: Las comparaciones de templo y altar no reproducen las aposiciones del texto
    rationale: '«Como en un templo: Dios» y «como ante un altar» cambian las comparaciones. «Como a un solo templo, que es Dios; como a un solo altar, que es un solo Jesucristo» conserva la orientación y la identificación.'
  - severity: medium
    issue: «Estaba con el Uno y volvió al Uno» modifica tiempo y fuerza verbal
    rationale: El testimonio dado dice «is with One and departed unto One». La traducción debe conservar el presente y no convertir «departed unto» en un retorno explícito. Se usa «está con el Uno y se dirigió al Uno», con nota que advierte la provisionalidad y ambigüedad de la base.
  revised_text: 'Por tanto, así como el Señor no hizo nada sin el Padre, [estando unido a él], ni por sí mismo ni por medio de los apóstoles, tampoco ustedes hagan nada sin el obispo y los presbíteros. No intenten considerar correcto nada por cuenta propia, separados de los demás; más bien, haya una sola oración en común, una sola súplica, un solo sentir, una sola esperanza, en amor y en gozo irreprochable, que es Jesucristo, por encima de quien no hay nada mejor.


    Apresúrense todos a reunirse como a un solo templo, que es Dios; como a un solo altar, que es un solo Jesucristo, quien salió de un solo Padre, está con el Uno y se dirigió al Uno.'
  revised_footnotes:
  - marker: a
    text: La frase «estando unido a él» aparece entre corchetes en el testimonio utilizado, señal de que su presencia o forma textual es incierta.
    reason: Preservar visiblemente la señal editorial de restauración del testimonio inglés provisional.
  - marker: b
    text: La repetición de «uno» («un solo Padre», «el Uno», «el Uno») reproduce una formulación densa y posiblemente ambigua. La traducción es provisional, pues requiere cotejo directo con el griego de la recensión media.
    reason: Conservar la repetición sin explicitar una interpretación teológica ni presentar como resuelta una cuestión que requiere revisión de la fuente griega.
  revision_rationale: Se corrigen los problemas sintácticos y de puntuación, y se ajusta el texto a la secuencia y a las aposiciones del testimonio. Se preservan los corchetes editoriales y la ambigüedad de las referencias a «uno». Se reemplaza «volvió» por «se dirigió» para no introducir un retorno que la formulación suministrada no expresa. La nota b se mantiene anclada al final de la cláusula pertinente.
