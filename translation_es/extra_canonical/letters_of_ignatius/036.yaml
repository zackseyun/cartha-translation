review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue fielmente el testimonio inglés suministrado y conserva los elementos deliberadamente densos de la exhortación: «carne y espíritu», la triple formulación «en el Hijo...», la imagen corporativa del presbiterio y los corchetes de «[según la carne]». El imperativo griego subyacente probablemente es pasivo («ser afirmados»); «quedar firmemente establecidos» comunica el resultado, pero puede expresarse con mayor cercanía formal.'
  naturalness: El registro es claro y digno. «Esfuércense por quedar firmemente establecidos» resulta algo pesado en español actual; «pongan todo empeño en ser firmemente afianzados» es más fluido sin perder la voz pasiva. «Caminan conforme a Dios» es comprensible, pero «viven conforme a Dios» evita un calco de «walk» que puede sonar menos natural en este contexto ético.
  terminology: Se conservan adecuadamente «ordenanzas», «presbiterio», «diáconos», «carne» y «espíritu». «Corona espiritual, armoniosamente entrelazada» comunica de manera aceptable la metáfora de la guirnalda/círculo del presbiterio sin convertirla en una categoría eclesiástica contemporánea.
  issues:
  - severity: low
    issue: Construcción inicial algo forzada
    rationale: «Esfuércense por quedar firmemente establecidos» puede mejorarse estilísticamente y reflejar más de cerca el matiz pasivo de «be confirmed» mediante «pongan todo empeño en ser firmemente afianzados».
  - severity: low
    issue: Calco potencial en «caminan conforme a Dios»
    rationale: La imagen ética de «walk after God» se transmite más naturalmente como «viven conforme a Dios», sin alterar su sentido de conducta conforme a Dios.
  revised_text: 'Por tanto, pongan todo empeño en ser firmemente afianzados en las ordenanzas del Señor y de los apóstoles, para que prosperen en todo lo que hagan, en la carne y en el espíritu, por medio de la fe y del amor, en el Hijo y en el Padre y en el Espíritu, al principio y al final, junto con su respetado obispo, con la corona espiritual, armoniosamente entrelazada, de su presbiterio, y con los diáconos que viven conforme a Dios.


    Obedezcan al obispo y unos a otros, así como Jesucristo obedeció al Padre [según la carne][a], y como los apóstoles obedecieron a Cristo y al Padre, para que haya unión tanto de la carne como del espíritu.'
  revised_footnotes:
  - marker: a
    text: La expresión «según la carne» aparece entre corchetes en el testimonio utilizado, lo cual señala incertidumbre o variación textual. La revisión directa del griego aún está pendiente.
    reason: Preservar de manera visible la señal textual transmitida por el testimonio inglés y declarar la limitación de la base de traducción.
  revision_rationale: 'Se realizan únicamente ajustes seguros de fluidez y de correspondencia formal: se hace explícito el matiz pasivo de «be confirmed» y se reemplaza un calco verbal menos idiomático. Se conservan la ambigüedad cristológica marcada por corchetes, las expresiones teológicas y la estructura acumulativa del testimonio.'
