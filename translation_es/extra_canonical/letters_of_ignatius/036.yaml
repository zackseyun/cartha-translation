review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés y conserva adecuadamente los elementos difíciles: «ordenanzas», la secuencia «en el Hijo y en el Padre y en el Espíritu», la metáfora de la corona/guirnalda del presbiterio y los corchetes de «[según la carne]». La formulación de la segunda exhortación puede reflejar mejor la construcción comparativa sin introducir un tiempo verbal que el testimonio no especifica.'
  naturalness: El primer párrafo es claro y de registro apropiado. En el segundo, «Obedezcan al obispo y unos a otros» es comprensible, pero resulta algo abrupto en español; «Sean obedientes al obispo y unos a otros» expresa con mayor naturalidad la exhortación recíproca y permite que la comparación posterior comparta el mismo predicado.
  terminology: «Ordenanzas», «presbiterio», «diáconos», «carne» y «espíritu» son elecciones adecuadas y no imponen una lectura confesional. «Corona espiritual, armoniosamente entrelazada» conserva la imagen del testimonio, aunque una puntuación más integrada la hace menos pesada.
  issues:
  - severity: low
    issue: Construcción de la exhortación a la obediencia
    rationale: «Obedezcan al obispo y unos a otros» deja el segundo complemento algo elíptico. «Sean obedientes al obispo y unos a otros» es más idiomático y conserva la obediencia mutua del texto.
  - severity: low
    issue: Tiempo verbal añadido en la comparación cristológica
    rationale: «Jesucristo obedeció» presenta la comparación como una acción pasada. La construcción compartida «como Jesucristo al Padre» mantiene la elipsis del testimonio y evita precisar innecesariamente el aspecto temporal.
  - severity: low
    issue: Puntuación de la metáfora del presbiterio
    rationale: Suprimir las comas que aíslan «armoniosamente entrelazada» integra mejor el modificador con «corona espiritual» sin cambiar la imagen.
  revised_text: 'Por tanto, esfuércense por quedar firmemente establecidos en las ordenanzas del Señor y de los apóstoles, para que prosperen en todo lo que hagan, en la carne y en el espíritu, por medio de la fe y del amor, en el Hijo y en el Padre y en el Espíritu, al principio y al final, junto con su respetado obispo, con la corona espiritual armoniosamente entrelazada de su presbiterio, y con los diáconos que caminan conforme a Dios.


    Sean obedientes al obispo y unos a otros, así como Jesucristo al Padre [según la carne][a], y como los apóstoles a Cristo y al Padre, para que haya unión tanto de la carne como del espíritu.'
  revised_footnotes:
  - marker: a
    text: La expresión «según la carne» aparece entre corchetes en el testimonio utilizado, lo cual señala incertidumbre o variación textual. La revisión directa del griego aún está pendiente.
    reason: Se conserva la señal textual del testimonio inglés y se declara la limitación de la base disponible.
  revision_rationale: Se hacen ajustes limitados de sintaxis y puntuación. La revisión evita convertir la comparación sobre Jesucristo en una afirmación temporal más específica que la que transmite la base inglesa, y mantiene la ambigüedad señalada por los corchetes.
