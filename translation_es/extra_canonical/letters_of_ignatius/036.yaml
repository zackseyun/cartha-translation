base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: es
  text: 'Por tanto, esfuércense por quedar firmemente establecidos en las ordenanzas del Señor y de los apóstoles, para que prosperen en todo lo que hagan, en la carne y en el espíritu, por medio de la fe y del amor, en el Hijo y en el Padre y en el Espíritu, al principio y al final, junto con su respetado obispo, con la corona espiritual, armoniosamente entrelazada, de su presbiterio, y con los diáconos que caminan conforme a Dios.


    Obedezcan al obispo y unos a otros, así como Jesucristo obedeció al Padre [según la carne][a], y como los apóstoles obedecieron a Cristo y al Padre, para que haya unión tanto de la carne como del espíritu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «según la carne» aparece entre corchetes en el testimonio utilizado, lo cual señala incertidumbre o variación textual. La revisión directa del griego aún está pendiente.
    reason: Preservar de manera visible la señal textual transmitida por el testimonio inglés y declarar la limitación de la base de traducción.
lexical_decisions:
- source_word: ordinances
  choice: ordenanzas
  rationale: Conserva el sentido normativo amplio del testimonio disponible sin reducirlo a mandamientos, doctrinas o prácticas concretas.
- source_word: fitly wreathed spiritual circlet
  choice: la corona espiritual, armoniosamente entrelazada
  rationale: Mantiene la metáfora de una guirnalda o corona compuesta de elementos bien unidos, pero con una formulación comprensible en español actual.
- source_word: presbytery
  choice: presbiterio
  rationale: Designa colectivamente al cuerpo de presbíteros y evita sustituirlo por una estructura denominacional moderna.
- source_word: walk after God
  choice: caminan conforme a Dios
  rationale: Preserva el modismo ético de caminar de acuerdo con Dios sin sugerir una ubicación física detrás de él.
- source_word: flesh and spirit
  choice: carne y espíritu
  rationale: Retiene la pareja conceptual y su posible tensión antropológica y comunitaria, sin interpretarla como meramente cuerpo y alma.
theological_decisions:
- issue: La obediencia de Jesucristo al Padre
  choice: así como Jesucristo obedeció al Padre [según la carne]
  alternative: así como Jesucristo estaba sujeto al Padre según su humanidad
  rationale: La redacción elegida conserva la comparación explícita y el indicador textual entre corchetes, sin convertirla en una afirmación ontológica general ni resolver su alcance cristológico.
- issue: Relación entre el Hijo, el Padre y el Espíritu
  choice: en el Hijo y en el Padre y en el Espíritu
  alternative: en el Hijo, el Padre y el Espíritu
  rationale: Se mantienen las preposiciones y conjunciones repetidas del testimonio para no suavizar la estructura trinitaria particular de la frase.
- issue: Unión de carne y espíritu
  choice: unión tanto de la carne como del espíritu
  alternative: unidad corporal y espiritual
  rationale: La opción formal conserva la terminología y la ambigüedad acerca de si se refiere a dimensiones personales, comunitarias o ambas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea el plural «ustedes» implícito en las formas verbales. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
