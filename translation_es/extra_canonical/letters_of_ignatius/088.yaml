review_pass:
  verdict: revise
  source_fidelity: 'El borrador sigue fielmente el testimonio inglés disponible y conserva sus ambigüedades principales. Sin embargo, la restitución textual señalada con corchetes se ha trasladado de forma incorrecta: el elemento restaurado es la conjunción «y», no la letra «a». La revisión directa del griego de la recensión media continúa pendiente.'
  naturalness: El español es generalmente claro, actual y apropiadamente epistolar. Se corrige la colocación de la nota y la puntuación para que el pasaje restaurado sea legible y la aposición «los diáconos, mis compañeros de servicio» conserve la relación del testimonio.
  terminology: «Obispo», «consejo de ancianos», «diáconos», «pasión» y «resurrección» son opciones adecuadas. «Corporales y espirituales» conserva, sin moralizar «carnales», la afirmación doble del texto y concuerda naturalmente con «pasión y resurrección».
  issues:
  - severity: medium
    issue: El texto dice «consejo de ancianos [a]y a los diáconos».
    rationale: La marca de nota «a» se ha confundido con el contenido restaurado. El testimonio inglés señala [and]; en español debe aparecer «[y]», con la llamada de nota separada y anclada a esa restitución.
  - severity: low
    issue: «tanto corporal como espiritual» queda con concordancia y alcance poco claros después de «pasión y resurrección».
    rationale: «Pasión y resurrección» es un referente coordinado plural. «corporales y espirituales» preserva la doble calificación del testimonio y resulta más natural.
  revised_text: 'El amor de los hermanos que están en Troas los saluda. Desde allí también les escribo por medio de Burro, a quien ustedes enviaron conmigo junto con sus hermanos, los efesios. Él me ha reconfortado en todo sentido. Quisiera que todos lo imitaran, pues es un ejemplo del servicio de Dios. La gracia divina lo recompensará en todo.


    Saludo a su piadoso obispo, a su venerable consejo de ancianos [y]ᵃ a los diáconos, mis compañeros de servicio, así como a todos ustedes, a cada uno en particular y a todos en conjunto, en el nombre de Jesucristo, y en su carne y sangre, en su pasión y resurrección, corporales y espirituales, en la unidad de Dios y de ustedes. Que la gracia, la misericordia, la paz y la paciencia estén siempre con ustedes.'
  revised_footnotes:
  - marker: a
    text: La conjunción «y» antes de «a los diáconos» es una restauración señalada por el testimonio inglés consultado; la revisión directa de la tradición manuscrita griega sigue pendiente.
    reason: Preserva visiblemente la señal de restauración textual ([and]) presente en el testimonio suministrado.
  revision_rationale: Se corrige de manera necesaria la restitución entre corchetes y su ancla de nota, sin alterar el sentido. También se ajusta la concordancia de «corporales y espirituales» con «pasión y resurrección». Las demás decisiones del borrador se mantienen provisionalmente, sujetas a cotejo con el griego.
