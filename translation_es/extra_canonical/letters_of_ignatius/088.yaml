base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: es
  text: 'El amor de los hermanos que están en Troas los saluda. Desde allí también les escribo por medio de Burro, a quien ustedes enviaron conmigo junto con sus hermanos, los efesios. Él me ha reconfortado en todo sentido. Quisiera que todos lo imitaran, pues es un ejemplo del servicio de Dios. La gracia divina lo recompensará en todo.


    Saludo a su piadoso obispo, a su venerable consejo de ancianos [a]y a los diáconos, mis compañeros de servicio, así como a todos ustedes, a cada uno en particular y a todos en conjunto, en el nombre de Jesucristo, y en su carne y sangre, en su pasión y resurrección, tanto corporal como espiritual, en la unidad de Dios y de ustedes. Que la gracia, la misericordia, la paz y la paciencia estén siempre con ustedes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El «y» antes de «los diáconos» es una restauración señalada por el testimonio inglés consultado; la revisión directa de la tradición manuscrita griega sigue pendiente.
    reason: Preservar de manera visible la señal de restauración textual que aparece entre corchetes en el testimonio suministrado.
lexical_decisions:
- source_word: ἀγάπη (reflejado por “love” en el testimonio)
  choice: amor
  rationale: Conserva el saludo personificado y colectivo sin reducirlo a una mera expresión de afecto.
- source_word: ἀδελφοί / “brethren”
  choice: hermanos
  rationale: Es la forma colectiva tradicional y natural en español; dentro de esta referencia comunitaria puede abarcar al conjunto de creyentes sin añadir una explicitación ausente del testimonio antiguo.
- source_word: Burrhus
  choice: Burro
  rationale: Se emplea la forma española tradicional del nombre latino Burrhus, pese a la posible asociación moderna del sustantivo común.
- source_word: presbytery / πρεσβυτέριον
  choice: consejo de ancianos
  rationale: Comunica la naturaleza colegiada del grupo y evita que «presbiterio» se entienda principalmente como un espacio arquitectónico.
- source_word: passion / πάθος
  choice: pasión
  rationale: En contexto cristológico designa los padecimientos y la muerte de Jesús; mantiene el término histórico y solemne.
- source_word: carnal / σαρκικός
  choice: corporal
  rationale: Evita la connotación moral negativa que «carnal» suele tener en español moderno, y expresa aquí la dimensión física o encarnada.
- source_word: patience / μακροθυμία
  choice: paciencia
  rationale: Mantiene la virtud de perseverancia y longanimidad expresada por el saludo final.
theological_decisions:
- issue: «servicio de Dios» puede indicar servicio prestado a Dios o ministerio que procede de él.
  choice: servicio de Dios
  alternative: servicio a Dios
  rationale: Se conserva la relación genitiva ambigua del testimonio en vez de decidir silenciosamente entre origen, pertenencia u objeto.
- issue: Relación entre lo corporal y lo espiritual en la pasión y resurrección.
  choice: «en su pasión y resurrección, tanto corporal como espiritual»
  alternative: «en su pasión y resurrección, que fueron carnales y espirituales»
  rationale: Conserva juntas ambas dimensiones, sin espiritualizar la realidad corporal ni explicar de manera doctrinal cómo se distribuyen los adjetivos.
- issue: «unidad de Dios y de ustedes» admite más de una relación sintáctica o teológica.
  choice: en la unidad de Dios y de ustedes
  alternative: en la unidad con Dios y entre ustedes
  rationale: La formulación elegida retiene la tensión y la posible ambigüedad del genitivo, sin convertirla explícitamente en unión con Dios y unidad comunitaria.
- issue: Títulos ministeriales de obispo, ancianos y diáconos.
  choice: obispo, consejo de ancianos y diáconos
  alternative: supervisor, presbiterio y servidores
  rationale: Se mantienen los títulos históricos reconocibles, pero se traduce el colectivo de ancianos de modo comprensible, sin imponer una estructura denominacional contemporánea.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el tono epistolar, las fórmulas eclesiales antiguas y las ambigüedades teológicas relevantes. Dado que no se proporcionó el texto griego y la revisión de la lengua fuente está pendiente, este borrador se apoya provisionalmente en el testimonio público de Lightfoot y en la capa inglesa auditada; requiere cotejo posterior con la recensión media griega.
