source:
  text: 'The love of the brethren which are in Troas saluteth you; from whence also I write to you by the hand of Burrhus, whom ye sent with me jointly with the Ephesians your brethren. He hath refreshed me in all ways. And I would that all imitated him, for he is an ensample of the ministry of God. The Divine grace shall requite him in all things.


    I salute your godly bishop and your venerable presbytery [and] my fellow-servants the deacons, and all of you severally and in a body, in the name of Jesus Christ, and in His flesh and blood, in His passion and resurrection, which was both carnal and spiritual, in the unity of God and of yourselves. Grace to you, mercy, peace, patience, always.'
