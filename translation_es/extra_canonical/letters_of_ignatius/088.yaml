review_pass:
  verdict: revise
  source_fidelity: El borrador sigue de cerca el testimonio inglés suministrado. Sin embargo, la restauración entre corchetes se ha trasladado de forma errónea como «[a]y», cuando lo señalado en el testimonio es la conjunción «[and]»; en español debe reflejarse como «[y]». Además, «y de ustedes mismos» representa mejor el reflexivo «and of yourselves» que «y de ustedes». La revisión directa del griego de la recensión media continúa pendiente.
  naturalness: El español es generalmente natural, actual y de registro epistolar digno. «Consejo de ancianos» comunica bien el colectivo. Se corrige la colocación de la señal textual y se hace explícito el valor reflexivo de «ustedes mismos» sin resolver la ambigüedad de la construcción.
  terminology: «Obispo», «consejo de ancianos», «diáconos», «carne y sangre», «pasión», «resurrección» y «gracia» son elecciones adecuadas. «Burro» corresponde a la forma española tradicional de Burrhus, aunque puede sonar inusual para lectores modernos; no hay motivo suficiente para sustituir el nombre propio.
  issues:
  - severity: medium
    issue: La restauración textual está mal representada como «[a]y».
    rationale: El corchete del testimonio inglés encierra la conjunción restaurada («[and]»), no un marcador de nota. La traducción debe mostrar «[y]» y conservar el ancla de la nota de manera separada.
  - severity: low
    issue: «en la unidad de Dios y de ustedes» omite el matiz reflexivo de «of yourselves».
    rationale: «Ustedes mismos» conserva más fielmente el referente reflexivo sin interpretar la relación teológica o sintáctica de los genitivos.
  revised_text: 'El amor de los hermanos que están en Troas los saluda. Desde allí también les escribo por medio de Burro, a quien ustedes enviaron conmigo junto con sus hermanos, los efesios. Él me ha reconfortado en todo sentido. Quisiera que todos lo imitaran, pues es un ejemplo del servicio de Dios. La gracia divina lo recompensará en todo.


    Saludo a su piadoso obispo, a su venerable consejo de ancianos [y]ᵃ a los diáconos, mis compañeros de servicio, así como a todos ustedes, a cada uno en particular y a todos en conjunto, en el nombre de Jesucristo, y en su carne y sangre, en su pasión y resurrección, tanto corporal como espiritual, en la unidad de Dios y de ustedes mismos. Que la gracia, la misericordia, la paz y la paciencia estén siempre con ustedes.'
  revised_footnotes:
  - marker: a
    text: El «y» entre corchetes es una restauración señalada por el testimonio inglés consultado; la revisión directa de la tradición manuscrita griega sigue pendiente.
    reason: Conserva de forma visible tanto la señal de restauración textual («[y]») como su ancla de nota, sin confundir el marcador con el texto restaurado.
  revision_rationale: 'Se realizan únicamente correcciones seguras derivadas del testimonio inglés auditado: se reubica y traduce correctamente la conjunción restaurada entre corchetes, y se restituye el valor reflexivo de «y de ustedes mismos». Se mantienen las ambigüedades de «servicio de Dios», de la caracterización corporal y espiritual, y de «la unidad de Dios y de ustedes mismos».'
