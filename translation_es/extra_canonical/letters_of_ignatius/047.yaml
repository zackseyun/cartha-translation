review_pass:
  verdict: revise
  source_fidelity: La traducción conserva bien el sentido general y las identificaciones deliberadamente densas entre fe/carne y amor/sangre. Sin embargo, «revístanse de mansedumbre» atenúa el imperativo marcadamente bélico («ármense»), «para hablar mal» añade una finalidad que no está en «den ocasión», y «Porque está escrito» no aparece en el testimonio suministrado. La nota tampoco debe afirmar un cotejo griego ya realizado, pues el contexto declara que esa revisión sigue pendiente.
  naturalness: El español es generalmente claro y de registro apropiado. «No porque haya sabido» y «los vigilo anticipadamente» reproducen con mayor fluidez el contraste inicial. «Reconstrúyanse» hace más transparente la imagen de restauración que «edifíquense de nuevo».
  terminology: «Mansedumbre», «gentiles», «prójimo» y «blasfemado» son adecuados. «La multitud que está en Dios» conserva, aunque algo inusual, la formulación colectiva sin sustituirla por «iglesia» ni volverla confesional. Se conserva «mi nombre» en la cita.
  issues:
  - severity: medium
    issue: Se atenúa la metáfora de armarse.
    rationale: El testimonio inglés dice «arm yourselves with gentleness». «Revístanse» es una metáfora posible en español, pero deja de expresar la paradoja retórica y el matiz de preparación o armamento del original.
  - severity: medium
    issue: Se añade «para hablar mal» después de «No den ... motivo».
    rationale: El texto pide no dar ocasión a los gentiles; el resultado de blasfemar contra la multitud se expresa en la cláusula siguiente. La explicitación altera esa progresión y limita indebidamente «ocasión».
  - severity: medium
    issue: Se inserta «Porque está escrito».
    rationale: El testimonio fuente introduce el ay mediante dos puntos, no mediante una fórmula de cita. Aunque la frase alude probablemente a Isaías 52:5, la traducción no debe añadir una atribución editorial al cuerpo del texto.
  - severity: low
    issue: La nota afirma un cotejo con evidencia griega accesible.
    rationale: El contexto del encargo especifica que la revisión directa de la tradición griega está pendiente. La nota debe limitarse a describir la alusión probable y el carácter provisional.
  - severity: low
    issue: Ubicación de la llamada de nota.
    rationale: La llamada debe seguir inmediatamente a la cita, antes del punto final de la oración según una puntuación editorial española consistente.
  revised_text: 'No porque haya sabido de algo semejante entre ustedes; más bien, los vigilo anticipadamente, como a mis amados, pues preveo las trampas del diablo. Por tanto, ármense de mansedumbre y reconstrúyanse en la fe, que es la carne del Señor, y en el amor, que es la sangre de Jesucristo.


    Que ninguno de ustedes tenga algo contra su prójimo. No den ocasión alguna a los gentiles, no sea que, por causa de unos pocos insensatos, sea blasfemada la multitud que está en Dios; porque: «¡Ay de aquel por medio de quien mi nombre es blasfemado en vano ante algunos!»[a]'
  revised_footnotes:
  - marker: a
    text: La frase parece aludir a Isaías 52:5, pero conserva una forma distinta de la de las traducciones bíblicas modernas. Esta redacción se basa provisionalmente en el testimonio inglés suministrado; la revisión directa de la tradición manuscrita griega sigue pendiente.
    reason: Indica la probable alusión sin presentar como realizado el cotejo directo del griego ni normalizar la formulación de la cita.
  revision_rationale: La revisión restituye la imagen de «armarse», evita ampliaciones interpretativas y elimina una fórmula de cita no atestiguada en el texto de control. También ajusta la nota para que refleje con precisión el estado provisional de la revisión de la fuente griega. Se mantienen la ambigüedad teológica y la referencia colectiva no institucionalizada.
