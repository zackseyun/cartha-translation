base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: es
  text: 'No es que yo haya sabido de algo semejante entre ustedes; más bien, velo por ustedes de antemano, como por mis amados, pues veo venir las trampas del diablo. Por tanto, revístanse de mansedumbre y edifíquense de nuevo en la fe, que es la carne del Señor, y en el amor, que es la sangre de Jesucristo.


    Que ninguno de ustedes guarde nada contra su prójimo. No den a los gentiles motivo alguno para hablar mal, no sea que, por culpa de unos pocos insensatos, se blasfeme contra la multitud que pertenece a Dios. Porque está escrito: «¡Ay de aquel por cuya causa mi nombre es blasfemado en vano entre algunos!».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase parece adaptar Isaías 52:5 y conserva una forma distinta de las traducciones bíblicas modernas. La revisión directa de la tradición manuscrita griega de este pasaje sigue pendiente.
    reason: Advierte sobre la probable alusión bíblica y sobre el carácter provisional de una traducción preparada a partir del testimonio inglés suministrado, aunque cotejada con evidencia griega accesible.
lexical_decisions:
- source_word: προφυλάσσω
  choice: velo por ustedes de antemano
  rationale: Conserva tanto la idea de vigilancia protectora como su carácter preventivo.
- source_word: προορῶν
  choice: veo venir
  rationale: Expresa previsión de manera natural sin afirmar conocimiento absoluto del futuro.
- source_word: ἀναλαβόντες τὴν πραΰτητα
  choice: revístanse de mansedumbre
  rationale: La imagen verbal admite la idea de tomar o asumir algo; «revístanse» conserva la metáfora exhortativa sin introducir armamento de forma demasiado explícita.
- source_word: ἀνακτίσασθε ἑαυτούς
  choice: edifíquense de nuevo
  rationale: Refleja el sentido de reconstruirse o renovarse y mantiene la metáfora de edificación.
- source_word: ἐν πίστει, ὅ ἐστιν σὰρξ τοῦ κυρίου
  choice: en la fe, que es la carne del Señor
  rationale: Mantiene la identificación sorprendente del texto sin explicarla ni suavizarla.
- source_word: κατὰ τοῦ πλησίον ἐχέτω τι
  choice: guarde nada contra su prójimo
  rationale: Comunica la idea amplia de tener algo contra otra persona; no la limita solamente al rencor.
- source_word: ἀφορμάς
  choice: motivo alguno para hablar mal
  rationale: En contexto denota ocasión o pretexto; se explicita su resultado inmediato para que la advertencia sea clara en español.
- source_word: τὸ ἐν θεῷ πλῆθος
  choice: la multitud que pertenece a Dios
  rationale: «En Dios» podría resultar opaco; esta formulación expresa la relación sin convertirla en una designación denominacional.
- source_word: ἐπὶ ματαιότητι
  choice: en vano
  rationale: Conserva la noción de vanidad, vaciedad o falta de fundamento presente en la expresión.
theological_decisions:
- issue: Identificación de la fe y el amor con la carne y la sangre de Cristo
  choice: 'Mantener las equivalencias literalmente: «la fe, que es la carne… el amor, que es la sangre…»'
  alternative: Interpretarlas como referencias explicativas a la encarnación o a la eucaristía
  rationale: El enunciado admite resonancias teológicas diversas; la traducción no debe imponer una lectura sacramental, metafórica o doctrinal exclusiva.
- issue: Sentido de «la multitud que pertenece a Dios»
  choice: Conservar una referencia colectiva general al pueblo fiel
  alternative: Traducir «la iglesia» o identificarla con una institución concreta
  rationale: El término fuente significa «multitud» y no justifica reemplazarlo por una categoría eclesiológica más específica.
- issue: Primera persona en la cita final
  choice: Conservar «mi nombre» dentro de una cita atribuida implícitamente a Dios
  alternative: Cambiarlo por «el nombre de Dios»
  rationale: La primera persona forma parte de la formulación recibida y mantiene la fuerza profética del dicho.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y «prójimo», «gentiles», «mansedumbre» y «blasfemar» por su precisión en un escrito cristiano antiguo. La redacción procura ser comprensible sin borrar las metáforas densas ni las tensiones teológicas del pasaje.
