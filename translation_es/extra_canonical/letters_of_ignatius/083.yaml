base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: es
  text: 'Por tanto, los que contradicen el buen don de Dios perecen por sus razonamientos. Les convendría amar, para que también resuciten.


    Por tanto, es apropiado que ustedes se abstengan de tales personas y que no hablen de ellas ni en privado ni en público. Más bien, presten atención a los Profetas y, sobre todo, al Evangelio, en el cual se nos muestra la pasión y se ha realizado la resurrección.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: contradicen
  rationale: Conserva la idea de oponerse o disputar contra el don de Dios sin ampliar el sentido a una negación absoluta.
- source_word: good gift of God
  choice: el buen don de Dios
  rationale: Reproduce de forma directa y natural la expresión del testimonio disponible.
- source_word: questionings
  choice: discusiones
  rationale: Expresa controversias o disputas argumentativas; evita el sentido moderno más inocuo de «preguntas».
- source_word: love
  choice: amor
  rationale: Mantiene el término teológico y ético amplio sin especificar una clase de amor no indicada por el testimonio.
- source_word: passion
  choice: pasión
  rationale: En contexto cristiano antiguo designa el padecimiento y la muerte de Jesús; se conserva el término tradicional y digno.
- source_word: is accomplished
  choice: se cumple
  rationale: Mantiene el matiz de realización o cumplimiento, sin reducirlo simplemente a una narración del acontecimiento.
theological_decisions:
- issue: Relación entre el amor y la resurrección
  choice: «para que también resuciten»
  alternative: «para que ellos también puedan resucitar»
  rationale: Se conserva la relación final expresada por el testimonio sin explicar si se trata de condición, fruto o esperanza.
- issue: Sentido de «la resurrección se cumple»
  choice: «se cumple la resurrección»
  alternative: «se lleva a cabo la resurrección»
  rationale: La formulación conserva la tensión entre el anuncio evangélico y el acontecimiento realizado, sin resolverla mediante una paráfrasis doctrinal.
- issue: Identidad de quienes contradicen
  choice: «tales personas»
  alternative: especificar un grupo doctrinal
  rationale: El fragmento presentado no nombra aquí al grupo; no se importa una identificación confesional o histórica no explícita en el pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para la segunda persona plural y se mantienen «Profetas», «Evangelio» y «pasión» como términos propios del registro cristiano antiguo. Dado que la revisión directa del griego está pendiente, las decisiones se apoyan prudentemente en el testimonio inglés de dominio público y en la capa de consulta auditada.
