revisions:
- from: 'Por tanto, los que contradicen el buen don de Dios perecen a causa de sus discusiones. Más les convendría tener amor, para que también resuciten.


    Es apropiado, pues, que ustedes se mantengan alejados de tales personas y que no hablen de ellas ni en privado ni en público. Más bien, presten atención a los Profetas y, sobre todo, al Evangelio, donde se nos muestra la pasión y se cumple la resurrección.'
  to: 'Por tanto, los que contradicen el buen don de Dios perecen por sus razonamientos. Les convendría amar, para que también resuciten.


