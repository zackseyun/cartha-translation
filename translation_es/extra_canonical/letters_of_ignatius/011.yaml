base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: es
  text: 'Oren también sin cesar por el resto de la humanidad, pues hay en ellos esperanza de arrepentimiento, para que encuentren a Dios. Permítanles, por tanto, aprender al menos de las obras de ustedes.


    Ante sus arrebatos de ira, sean mansos; ante sus palabras arrogantes, sean humildes; ante sus insultos, respondan con sus oraciones; ante sus errores, manténganse firmes en la fe; ante su ferocidad, sean amables. No se empeñen en imitarlos, pagándoles con la misma moneda.


    Mostrémonos hermanos suyos por medio de nuestra paciencia; pero empeñémonos en imitar al Señor, procurando superarnos unos a otros en quién soportará la mayor injusticia, quién se dejará defraudar y quién se dejará tener en nada, para que no se encuentre entre ustedes ninguna hierba del diablo. Más bien, permanezcan en Cristo Jesús con toda pureza y dominio propio, tanto en la carne como en el espíritu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta traducción es provisional y se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La ficha de la fuente indica expresamente que todavía no se ha realizado la revisión en la lengua original; la nota transparenta esa limitación editorial.
lexical_decisions:
- source_word: without ceasing
  choice: sin cesar
  rationale: Conserva la fuerza continua de la exhortación y emplea una expresión bíblica natural en español.
- source_word: the rest of mankind
  choice: el resto de la humanidad
  rationale: Traducción inclusiva y natural que mantiene la referencia a quienes están fuera de la comunidad destinataria.
- source_word: take lessons ... from your works
  choice: aprender ... de las obras de ustedes
  rationale: Expresa con claridad que la conducta visible de los creyentes debe servirles de enseñanza.
- source_word: set ye your prayers
  choice: respondan con sus oraciones
  rationale: Reproduce el contraste retórico con una formulación idiomática, sin convertir la oración en represalia.
- source_word: by requital
  choice: pagándoles con la misma moneda
  rationale: Comunica de manera corriente la idea de imitar su conducta mediante la retribución equivalente.
- source_word: forbearance
  choice: paciencia
  rationale: En este contexto designa la capacidad de soportar agravios sin represalia; «paciencia» es clara y digna en español latinoamericano.
- source_word: temperance
  choice: dominio propio
  rationale: Expresa mejor la disciplina o continencia personal que el término moderno «templanza», potencialmente menos transparente.
- source_word: abide
  choice: permanezcan
  rationale: Mantiene la imagen de continuidad y residencia espiritual en Cristo.
theological_decisions:
- issue: Esperanza de arrepentimiento en los demás
  choice: hay en ellos esperanza de arrepentimiento
  alternative: ellos todavía pueden arrepentirse
  rationale: Se preserva la formulación que vincula esperanza y arrepentimiento, sin definir de modo adicional su mecanismo teológico.
- issue: Competencia por sufrir agravios
  choice: procurando superarnos unos a otros en quién soportará la mayor injusticia
  alternative: compitiendo unos con otros por ver quién sufrirá el mayor agravio
  rationale: Mantiene la paradoja exhortativa sin presentar el sufrimiento como meritorio en sí mismo.
- issue: Relación de carne y espíritu con la permanencia en Cristo
  choice: tanto en la carne como en el espíritu
  alternative: con su carne y con su espíritu
  rationale: Conserva la totalidad corporal y espiritual de la exhortación, evitando una lectura que desprecie el cuerpo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para la segunda persona plural y un tono exhortativo claro. Se conserva el paralelismo del pasaje y su tensión entre mansedumbre, resistencia firme y disposición a padecer agravios.
