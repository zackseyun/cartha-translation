review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue fielmente el testimonio inglés suministrado y conserva la estructura parenética. Sin embargo, en la sección final «se dejará defraudar» y «se dejará tener en nada» introducen una idea volitiva («dejarse») que no está expresada en el texto: la secuencia describe a quien es defraudado o despreciado. Dado que la revisión directa del griego sigue pendiente según la ficha, se mantiene la nota de provisionalidad.'
  naturalness: 'El español es claro, actual y de registro apropiadamente exhortativo. Se mejoran algunos giros para conservar el paralelismo sin añadir matices: «opongan sus oraciones» reproduce mejor la imagen de poner la oración frente a los insultos, y «ser instruidos por sus obras» expresa naturalmente el aprendizaje derivado del ejemplo.'
  terminology: «Arrepentimiento», «fe», «Señor», «Cristo Jesús», «pureza» y «dominio propio» son elecciones adecuadas y no imponen una lectura doctrinal. «Paciencia» comunica aceptablemente forbearance. Se conserva «hierba del diablo», imagen extraña pero deliberada del testimonio, sin interpretarla ni suavizarla.
  issues:
  - severity: medium
    issue: «se dejará defraudar» y «se dejará tener en nada»
    rationale: Estas expresiones añaden que la persona consiente o permite el agravio. El testimonio dice «who shall be defrauded, who shall be set at nought», esto es, quién será defraudado y quién será despreciado o tenido en nada.
  - severity: low
    issue: «pagándoles con la misma moneda»
    rationale: Es un modismo natural, pero especifica una reciprocidad dirigida a ellos y puede sonar coloquial frente al registro del pasaje. «devolviéndoles lo mismo» conserva mejor el sentido de imitación por represalia.
  - severity: low
    issue: «respondan con sus oraciones»
    rationale: Es comprensible, pero «opongan sus oraciones» refleja más de cerca el paralelismo retórico de colocar la oración frente a los insultos, sin sugerir una mera réplica verbal.
  revised_text: 'Oren también sin cesar por el resto de la humanidad, pues hay en ellos esperanza de arrepentimiento, para que encuentren a Dios. Permítanles, por tanto, ser instruidos al menos por las obras de ustedes.


    Ante sus arrebatos de ira, sean mansos; ante sus palabras arrogantes, sean humildes; ante sus insultos, opongan sus oraciones; ante sus errores, manténganse firmes en la fe; ante su ferocidad, sean amables. No se empeñen en imitarlos devolviéndoles lo mismo.


    Mostrémonos hermanos suyos por medio de nuestra paciencia; pero empeñémonos en imitar al Señor, compitiendo unos con otros por ver quién sufrirá el mayor agravio, quién será defraudado y quién será despreciado, para que no se encuentre en ustedes ninguna hierba del diablo. Más bien, permanezcan en Cristo Jesús con toda pureza y dominio propio, tanto en la carne como en el espíritu.[a]'
  revised_footnotes:
  - marker: a
    text: Esta traducción es provisional y se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La ficha de la fuente indica expresamente que todavía no se ha realizado la revisión en la lengua original; la nota transparenta esa limitación editorial.
  revision_rationale: La revisión elimina adiciones de voluntariedad en la enumeración de agravios sufridos, ajusta dos formulaciones para reflejar mejor el paralelismo del testimonio y conserva las elecciones terminológicas y la nota editorial justificadas. No se resuelven cuestiones textuales o semánticas que requieran cotejo directo con el griego.
