base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: es
  text: 'Por tanto, no seamos insensibles a su bondad. Porque, si él nos tratara conforme a nuestras obras, estaríamos perdidos. Por eso, puesto que hemos llegado a ser sus discípulos, aprendamos a vivir como corresponde al cristianismo. Pues quien recibe un nombre distinto de este no pertenece a Dios.


    Desechen, por tanto, la levadura ruin que se ha vuelto vieja y agria, y acudan a la levadura nueva, que es Jesucristo. Sean salados en él, para que ninguno de ustedes se corrompa, pues por su sabor serán puestos a prueba.


    Es absurdo hablar de Jesucristo y practicar el judaísmo. Porque el cristianismo no creyó en el judaísmo, sino el judaísmo en el cristianismo, en el cual toda lengua creyó y fue congregada para Dios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Está pendiente la revisión directa del texto griego de la recensión media; en particular, deberá comprobarse la sintaxis de la frase final y sus posibles alusiones bíblicas.
    reason: La evidencia suministrada identifica el inglés como base de redacción y señala que la revisión de la lengua fuente aún está pendiente.
lexical_decisions:
- source_word: insensible
  choice: insensibles
  rationale: Conserva la imagen moral del testimonio sin recurrir a una expresión arcaica; significa no percibir ni responder debidamente a la bondad.
- source_word: imitate us according to our deeds
  choice: nos tratara conforme a nuestras obras
  rationale: En español, una traducción literal con «imitara» resultaría oscura. La formulación comunica que Dios correspondería al comportamiento humano.
- source_word: Christianity
  choice: cristianismo
  rationale: Mantiene el término identitario abstracto del testimonio, importante para el contraste posterior con «judaísmo».
- source_word: vile leaven
  choice: levadura ruin
  rationale: Preserva la metáfora peyorativa y evita «vil», que puede sonar rígido en este contexto.
- source_word: betake yourselves
  choice: acudan
  rationale: Expresa orientación y adhesión hacia la levadura nueva con lenguaje actual y digno.
- source_word: Be ye salted in Him
  choice: Sean salados en él
  rationale: Retiene deliberadamente la metáfora llamativa de la sal, vinculada con la corrupción y el sabor en las cláusulas siguientes.
- source_word: putrid
  choice: se corrompa
  rationale: Comunica la descomposición figurada de modo natural, sin perder el campo semántico alimentario.
- source_word: monstrous
  choice: absurdo
  rationale: Expresa la incompatibilidad radical denunciada por el autor sin sugerir literalmente una criatura monstruosa.
- source_word: every tongue
  choice: toda lengua
  rationale: Conserva la expresión bíblica y su posible alcance tanto lingüístico como universal.
theological_decisions:
- issue: La pertenencia expresada por «is not of God»
  choice: no pertenece a Dios
  alternative: no es de Dios
  rationale: Aclara la relación de pertenencia sin añadir una definición doctrinal de salvación o afiliación eclesial.
- issue: La relación histórica y teológica entre cristianismo y judaísmo
  choice: el cristianismo no creyó en el judaísmo, sino el judaísmo en el cristianismo
  alternative: el cristianismo no llegó a creer en el judaísmo, sino que el judaísmo llegó a creer en el cristianismo
  rationale: Se preserva la formulación paradójica y tensa del testimonio, sin suavizarla ni convertirla en una afirmación más específica sobre todos los judíos.
- issue: Sentido de «wherein» en la cláusula final
  choice: en el cual
  alternative: en el que
  rationale: Mantiene como antecedente inmediato «el cristianismo», aunque la sintaxis y el alcance conceptual deben verificarse directamente en griego.
- issue: Destino de la congregación
  choice: fue congregada para Dios
  alternative: fue congregada en Dios
  rationale: El testimonio inglés dice «unto God», que puede expresar dirección o destino. «Para Dios» preserva esa orientación sin identificarla inequívocamente con unión mística.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las metáforas encadenadas de levadura, sal, corrupción y sabor, así como la tensión polémica del último párrafo. Se evitó lenguaje confesional añadido. Debido a que no se proporcionó el texto griego, el borrador se presenta explícitamente como provisional y fundamentado en el testimonio inglés disponible.
