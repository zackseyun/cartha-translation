source:
  text: 'Therefore let us not be insensible to His goodness. For if He should imitate us according to our deeds, we are lost. For this cause, seeing that we are become His disciples, let us learn to live as beseemeth Christianity. For whoso is called by another name besides this, is not of God.


    Therefore put away the vile leaven which hath waxed stale and sour, and betake yourselves to the new leaven, which is Jesus Christ. Be ye salted in Him, that none among you grow putrid, seeing that by your savor ye shall be proved.


    It is monstrous to talk of Jesus Christ and to practice Judaism. For Christianity did not believe in Judaism, but Judaism in Christianity, wherein every tongue believed and was gathered together unto God.'
