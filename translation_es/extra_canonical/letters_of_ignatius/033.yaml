review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés suministrado en casi todo el pasaje y conserva sus imágenes y su contraste entre «cristianismo» y «judaísmo». Sin embargo, «por su sabor» es poco preciso para la imagen de «savor» y, a la luz de la formulación griega tradicionalmente transmitida (ὀσμή), debe expresarse como «por su aroma». También conviene hacer explícito el verbo en el contraste final para evitar una elipsis que en español resulta ambigua. La nota debe mantenerse, pues el expediente identifica la revisión directa del griego como pendiente.
  naturalness: «Levadura ruin» y «se ha vuelto vieja y agria» resultan rígidos en español latinoamericano actual. «Mala levadura» y «se ha puesto rancia y agria» conservan la metáfora sin arcaísmo innecesario. «Vuelvan a la levadura nueva» es más idiomático que «acudan a la levadura nueva». «Sean salados» mantiene deliberadamente la formulación metafórica y extraña del original; «llegue a pudrirse» hace más visible el campo alimentario sin rebajar el registro.
  terminology: Se conservan «cristianismo», «judaísmo», «Jesucristo», «Dios», «levadura», «salados» y «toda lengua». «No es de Dios» refleja más estrechamente la expresión del testimonio que «no pertenece a Dios», sin imponer una definición doctrinal adicional. No se añade interpretación doctrinal ni una generalización sobre personas judías más allá de la polémica histórica del texto.
  issues:
  - severity: medium
    issue: «Por su sabor»
    rationale: La frase es posible como calco del inglés, pero es poco natural y no representa bien la imagen de «savor»; la lectura griega conocida emplea ὀσμή, ‘olor/aroma’. «Por su aroma» conserva la metáfora y es más preciso.
  - severity: low
    issue: Expresiones poco naturales en la metáfora de la levadura
    rationale: «Levadura ruin», «se ha vuelto vieja» y «acudan a la levadura nueva» suenan forzadas. Se sustituyen por opciones actuales que no alteran la imagen ni el sentido.
  - severity: low
    issue: Elipsis verbal en «sino el judaísmo en el cristianismo»
    rationale: Aunque reproduce la elipsis del inglés, en español puede leerse de forma confusa. Repetir «creyó» aclara el paralelismo sin añadir contenido.
  revised_text: 'Por tanto, no seamos insensibles a su bondad. Porque, si él nos tratara conforme a nuestras obras, estaríamos perdidos. Por eso, puesto que hemos llegado a ser sus discípulos, aprendamos a vivir de acuerdo con el cristianismo. Pues quien sea llamado con un nombre distinto de este no es de Dios.



    Por tanto, desechen la mala levadura que se ha puesto rancia y agria, y vuélvanse a la levadura nueva, que es Jesucristo. Sean salados en él, para que ninguno de ustedes llegue a pudrirse, pues por su aroma serán puestos a prueba.



    Es absurdo hablar de Jesucristo y practicar el judaísmo. Porque el cristianismo no creyó en el judaísmo, sino que el judaísmo creyó en el cristianismo, en el cual toda lengua creyó y fue congregada para Dios.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Está pendiente la revisión directa del texto griego de la recensión media; en particular, deberá comprobarse la sintaxis de la frase final y sus posibles alusiones bíblicas.
    reason: La evidencia suministrada identifica el inglés como base de redacción y señala que la revisión de la lengua fuente aún está pendiente.
  revision_rationale: Se revisó el texto para mejorar precisión léxica y naturalidad sin alterar la estructura argumentativa ni suavizar su polémica. Se mantiene la nota de provisionalidad porque el propio expediente no presenta una revisión de la tradición griega como completada. La oración final conserva la ambigüedad de antecedente y de dirección presente en el testimonio inglés, a la espera de la verificación indicada en la nota.
