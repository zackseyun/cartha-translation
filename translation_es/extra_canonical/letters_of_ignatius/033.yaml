review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado, pero «nos tratara conforme a nuestras obras» atenúa indebidamente «imitate us according to our deeds»: el sentido es que Dios actuara como nosotros actuamos. La cláusula final se conserva como construcción deliberadamente difícil, con nota provisional justificada por la ausencia del griego directo.'
  naturalness: El español es en general claro y de registro digno. «Acudan a la levadura nueva» suena poco idiomático en esta metáfora; «adopten la levadura nueva» comunica mejor el giro exhortativo. «Sean salados en él» mantiene una imagen extraña pero es fiel; «sazonados con él» sería más natural, aunque interpretaría la preposición. Se prefiere conservar la literalidad figurativa.
  terminology: «Cristianismo», «judaísmo», «Jesucristo», «levadura», «salados» y «toda lengua» son elecciones adecuadas. «No es de Dios» refleja más directamente la expresión transmitida que «no pertenece a Dios», sin precisar doctrinalmente el tipo de relación. «Horrendo» reproduce con mayor fuerza el carácter de «monstrous» que «absurdo».
  issues:
  - severity: medium
    issue: «si él nos tratara conforme a nuestras obras» no expresa plenamente «if He should imitate us according to our deeds».
    rationale: 'El testimonio contrapone el obrar divino al obrar humano: si Dios nos imitara, es decir, si respondiera como nosotros respondemos, estaríamos perdidos. «Tratar conforme a» puede sugerir retribución proporcional, una formulación más interpretativa y menos exacta.'
  - severity: low
    issue: «acudan a la levadura nueva» es una colocación poco natural.
    rationale: El imperativo exhorta a adoptar o acudir a Cristo bajo la metáfora de la levadura. «Adopten la levadura nueva» conserva la imagen y resulta más idiomático.
  - severity: low
    issue: «absurdo» debilita «monstrous».
    rationale: El original inglés expresa una incompatibilidad escandalosa o horrenda, no solo una falta de lógica. «Es horrendo» conserva mejor la intensidad retórica sin literalizar «monstruoso» de modo torpe.
  - severity: low
    issue: La nota debe mantenerse anclada a la incertidumbre de la fuente griega, especialmente en la última oración.
    rationale: La evidencia proporcionada es un testimonio inglés y declara pendiente la revisión directa del griego. La nota actual está bien anclada, pero puede formularse con mayor precisión y concisión.
  revised_text: 'Por tanto, no seamos insensibles a su bondad. Porque, si él nos imitara conforme a nuestras obras, estaríamos perdidos. Por eso, puesto que hemos llegado a ser sus discípulos, aprendamos a vivir como corresponde al cristianismo. Pues quien recibe un nombre distinto de este no es de Dios.


    Por tanto, desechen la levadura ruin que se ha vuelto vieja y agria, y adopten la levadura nueva, que es Jesucristo. Sean salados en él, para que ninguno de ustedes se corrompa, pues por su sabor serán puestos a prueba.


    Es horrendo hablar de Jesucristo y practicar el judaísmo. Porque el cristianismo no creyó en el judaísmo, sino el judaísmo en el cristianismo, en el cual toda lengua creyó y fue congregada para Dios.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Está pendiente la revisión directa del texto griego de la recensión media; deberá comprobarse especialmente la sintaxis y el alcance de la frase final, incluidas sus posibles alusiones bíblicas.
    reason: La base suministrada es un testimonio inglés y la revisión directa del griego sigue pendiente; la ambigüedad de la cláusula final no debe resolverse sin esa comprobación.
  revision_rationale: Se corrige la primera comparación para reflejar que Dios «imitaría» el obrar humano, no meramente que juzgaría de manera proporcional. Se mejora la naturalidad de la exhortación sobre la levadura y se restituye la fuerza retórica de «monstrous». Se conserva la imaginería extraña de «ser salados en él» y la sintaxis tensa de la declaración final, sin suavizar la polémica histórica ni imponer una interpretación doctrinal. La nota permanece porque el material proporcionado no incluye el texto griego.
