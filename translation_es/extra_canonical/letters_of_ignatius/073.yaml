base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: es
  text: 'También los sacerdotes eran buenos, pero mejor es el Sumo Sacerdote, a quien se le ha confiado el lugar santísimo; pues solo a él se le han confiado las cosas ocultas de Dios. Él mismo es la puerta del Padre, por la cual entran Abraham, Isaac y Jacob, los Profetas, los Apóstoles y toda la Iglesia. Todas estas cosas convergen en la unidad de Dios.


    Pero el evangelio tiene una preeminencia singular en la venida del Salvador, nuestro Señor Jesucristo, y en su pasión y resurrección. Pues los amados Profetas lo señalaron en su predicación; pero el evangelio es la consumación de la inmortalidad. Todas estas cosas juntas son buenas, si ustedes creen por medio del amor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de J. B. Lightfoot; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media. En especial, las expresiones «lugar santísimo», «consumación de la inmortalidad» y «por medio del amor» deberán cotejarse con el griego.
    reason: La fuente proporcionada indica expresamente que la revisión del idioma original está pendiente; la nota transparenta la base documental y señala los puntos de mayor incertidumbre.
lexical_decisions:
- source_word: High-priest
  choice: Sumo Sacerdote
  rationale: Es la expresión bíblica tradicional y clara en español para el sacerdote principal; conserva la comparación explícita con los sacerdotes.
- source_word: holy of holies
  choice: lugar santísimo
  rationale: Comunica de manera natural el espacio sagrado supremo sin confundirlo con el sacerdocio; refleja el sentido del testimonio inglés provisional.
- source_word: hidden things of God
  choice: cosas ocultas de Dios
  rationale: Mantiene la metáfora de realidades divinas escondidas sin interpretarlas como doctrinas secretas específicas.
- source_word: door of the Father
  choice: puerta del Padre
  rationale: Conserva literalmente la imagen cristológica y su vínculo con el acceso al Padre.
- source_word: combine
  choice: convergen
  rationale: Expresa que las personas y realidades mencionadas se reúnen orientadas hacia la unidad de Dios, sin imponer una explicación institucional.
- source_word: Gospel
  choice: evangelio
  rationale: El contexto parece referirse al mensaje centrado en la venida, pasión y resurrección de Cristo; la minúscula evita resolver si designa además un texto escrito o un corpus.
- source_word: passion
  choice: pasión
  rationale: Término cristiano asentado que abarca los padecimientos y la muerte de Jesús.
- source_word: completion of immortality
  choice: consumación de la inmortalidad
  rationale: Preserva una formulación difícil y teológicamente densa, sin reducirla a mera promesa, anuncio o cumplimiento.
- source_word: believe through love
  choice: creen por medio del amor
  rationale: Conserva la relación instrumental o mediadora expresada por «through», en vez de reemplazarla por «creen con amor».
theological_decisions:
- issue: Relación entre Cristo, el Sumo Sacerdote y el lugar santísimo
  choice: «a quien se le ha confiado el lugar santísimo»
  alternative: «a quien se le han confiado las cosas santísimas»
  rationale: El testimonio suministrado entiende la frase como referencia al santuario. Dado que la revisión directa del griego está pendiente, se sigue esa lectura sin añadir una identificación doctrinal.
- issue: Quiénes entran por la puerta del Padre
  choice: 'Se conserva una sola serie: patriarcas, Profetas, Apóstoles y toda la Iglesia'
  alternative: Separar o jerarquizar los grupos según distintas etapas de la salvación
  rationale: El pasaje los reúne en una misma imagen de acceso y unidad; no se añade una cronología o teoría eclesiológica ausente.
- issue: Preeminencia del evangelio
  choice: «en la venida... y en su pasión y resurrección»
  alternative: «por la venida... pasión y resurrección»
  rationale: La construcción transmitida permite cierta ambigüedad sobre si esos acontecimientos constituyen el contenido o la base de la preeminencia; «en» conserva mejor esa tensión.
- issue: Consumación de la inmortalidad
  choice: Se conserva la formulación metafórica
  alternative: «el cumplimiento de la promesa de inmortalidad»
  rationale: La alternativa explicaría más de lo que dice el testimonio y resolvería una expresión genuinamente difícil.
- issue: Fe y amor
  choice: «si ustedes creen por medio del amor»
  alternative: «si creen con amor»
  rationale: La elección conserva la posible afirmación de que el amor es el medio o ámbito de la fe, sin convertirla simplemente en una cualidad emocional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural de segunda persona. Se mantienen mayúsculas en títulos y colectivos («Sumo Sacerdote», «Profetas», «Apóstoles», «Iglesia») conforme al tono patrístico del pasaje; «evangelio» se deja en minúscula para no decidir indebidamente entre mensaje y texto. La redacción procura claridad sin suavizar las imágenes ni resolver sus tensiones teológicas.
