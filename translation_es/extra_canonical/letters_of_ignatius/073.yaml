source:
  text: 'The priests likewise were good, but better is the High-priest to whom is committed the holy of holies; for to Him alone are committed the hidden things of God; He Himself being the door of the Father, through which Abraham and Isaac and Jacob enter in, and the Prophets and the Apostles and the whole Church; all these things combine in the unity of God.


    But the Gospel hath a singular preeminence in the advent of the Savior, even our Lord Jesus Christ, and His passion and resurrection. For the beloved Prophets in their preaching pointed to Him; but the Gospel is the completion of immortality. All things together are good, if ye believe through love.'
