    Dedícate a orar sin cesar. Pide una sabiduría mayor que la que tienes. Mantente alerta y no dejes que tu espíritu se duerma. Habla con cada persona en particular, conforme a Dios.[b] Carga con las enfermedades de todos, como un atleta perfecto. Donde mayor es el esfuerzo, mucha es la ganancia.'
