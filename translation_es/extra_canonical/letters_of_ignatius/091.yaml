base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: es
  text: 'Recibo con agrado tu disposición de ánimo en Dios, afirmada como sobre una roca inconmovible, y me alegro sobremanera de haber sido considerado digno de ver tu rostro irreprochable,



    en el cual deseo alegrarme en Dios.[a] Te exhorto, por la gracia de la que estás revestido, a seguir avanzando en tu carrera y a exhortar a todos para que sean salvos. Haz valer tu cargo con toda diligencia de carne y espíritu. Preocúpate por la unidad, pues nada hay mejor que ella. Sobrelleva a todos, así como el Señor también te sobrelleva a ti. Soporta a todos con amor, como ya lo haces.



    Dedícate a orar sin cesar. Pide una sabiduría mayor que la que tienes. Mantente alerta y no dejes que tu espíritu se duerma. Habla con cada persona en particular, conforme a Dios.[b] Carga con las enfermedades de todos, como un atleta perfecto. Donde mayor es el esfuerzo, mucha es la ganancia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construcción también puede entenderse: «de cuyo rostro deseo alegrarme en Dios».'
    reason: El relativo se refiere al «rostro», pero la relación sintáctica exacta permanece algo abierta; la nota conserva esa alternativa sin introducir «presencia».
  - marker: b
    text: 'También puede traducirse: «a la manera de Dios» o «según el modo de Dios».'
    reason: «Conforme a Dios» reproduce de forma sobria una expresión amplia; la nota registra alternativas legítimas sin imponer una interpretación.
lexical_decisions:
- source_word: godly mind
  choice: manera piadosa de pensar
  rationale: Expresa con naturalidad una disposición mental orientada a Dios sin reducirla a mero intelecto.
- source_word: immovable rock
  choice: roca inconmovible
  rationale: Conserva la imagen firme y elevada del testimonio antiguo.
- source_word: Vindicate thine office
  choice: Cumple plenamente tu ministerio
  rationale: La expresión parece exhortar a acreditar o hacer justicia al cargo mediante su desempeño diligente; esta formulación evita el poco natural «vindica tu oficio».
- source_word: diligence of flesh and of spirit
  choice: diligencia de cuerpo y espíritu
  rationale: «Cuerpo» comunica aquí el sentido humano de «carne» con mayor claridad, manteniendo el contraste integral con el espíritu.
- source_word: union
  choice: unidad
  rationale: Es la forma natural en español para la concordia y cohesión de la comunidad.
- source_word: Bear
  choice: Sobrelleva
  rationale: Conserva la idea de cargar pacientemente con las personas, en paralelo con la paciencia del Señor.
- source_word: after the manner of God
  choice: conforme a Dios
  rationale: 'Mantiene abierta la amplitud de la expresión: hablar de una manera acorde con Dios o con su voluntad.'
- source_word: perfect athlete
  choice: atleta perfecto
  rationale: Retiene literalmente la metáfora atlética y su ideal de madurez o preparación completa.
theological_decisions:
- issue: Objeto de la gloria en «I give exceeding glory»
  choice: doy muchísima gloria a Dios
  alternative: me glorío en gran manera
  rationale: El marco devocional favorece entender que la gloria se dirige a Dios, pero la formulación del testimonio inglés no explicita el objeto; se adopta la lectura contextual más natural sin desarrollar una doctrina adicional.
- issue: Finalidad de la exhortación a todos
  choice: para que sean salvos
  alternative: para que puedan salvarse
  rationale: Conserva la voz pasiva y no especifica aquí ni el agente ni el mecanismo de la salvación.
- issue: «Conforme a Dios»
  choice: conforme a Dios
  alternative: como Dios lo haría
  rationale: Se evita identificar sin base suficiente la frase con una imitación directa de la acción divina; queda preservada su ambigüedad ética y teológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con tratamiento de «tú» por tratarse de una exhortación personal. Se conservaron las imágenes de la roca, el revestimiento, la carrera y el atleta. Se mantuvo el salto de párrafo tras «rostro» conforme al testimonio suministrado. Dado que la revisión directa de la tradición griega está pendiente, el borrador se apoya cautelosamente en el testimonio público de Lightfoot y en la capa inglesa auditada, señalando en notas las principales incertidumbres.
