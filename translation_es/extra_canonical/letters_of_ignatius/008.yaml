  to: 'Pues algunos, con engaño malicioso, van difundiendo el Nombre mientras hacen otras cosas indignas de Dios. Deben evitar a esas personas como a fieras, porque son perros rabiosos que muerden a escondidas. Manténganse alerta ante ellos, pues son difíciles de sanar.


    Tenemos un solo médico: de carne y de espíritu, engendrado y no engendrado, Dios en carne,[a] vida verdadera en la muerte, Hijo de María e Hijo de Dios, primero capaz de sufrir y luego incapaz de sufrir: Jesucristo nuestro Señor.'
  rationale: La revisión sigue la formulación de la recensión media griega donde esta difiere de la paráfrasis del testimonio inglés, especialmente en la cláusula cristológica «ἐν σαρκὶ γενόμενον θεόν». Conserva las paradojas textuales «engendrado y no engendrado» y «capaz de sufrir… incapaz de sufrir», sin explicarlas ni armonizarlas. Se moderniza levemente la primera exhortación para obtener un español latinoamericano fluido sin rebajar su tono.
