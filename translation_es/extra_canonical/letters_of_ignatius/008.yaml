revisions:
- from: 'Pues algunos acostumbran, con engaño malicioso, a pregonar el Nombre mientras hacen otras cosas indignas de Dios. Deben evitar a esas personas como a fieras, porque son perros rabiosos que muerden a escondidas. Manténganse alerta ante ellos, pues son difíciles de sanar.


