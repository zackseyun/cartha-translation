base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: es
  text: 'Pues algunos, con engaño malicioso, van difundiendo el Nombre mientras hacen otras cosas indignas de Dios. Deben evitar a esas personas como a fieras, porque son perros rabiosos que muerden a escondidas. Manténganse alerta ante ellos, pues son difíciles de sanar.


    Tenemos un solo médico: de carne y de espíritu, engendrado y no engendrado, Dios en carne,[a] vida verdadera en la muerte, Hijo de María e Hijo de Dios, primero capaz de sufrir y luego incapaz de sufrir: Jesucristo nuestro Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «Dios que llegó a ser en carne» o «Dios que vino a ser en carne». La expresión griega conserva una formulación condensada; no debe sustituirse aquí por una explicación doctrinal.
    reason: Restituye «en carne» y el participio griego γενόμενον, a la vez que señala de forma no doctrinal la dificultad sintáctica de la frase.
lexical_decisions:
- source_word: hawk about / peddle
  choice: pregonar
  rationale: Expresa la difusión ostentosa o interesada del Nombre sin imponer el matiz estrictamente comercial de «vender».
- source_word: the Name
  choice: el Nombre
  rationale: La mayúscula conserva su carácter reverencial y su referencia implícita a Cristo.
- source_word: wild-beasts
  choice: fieras
  rationale: Es una expresión natural y enérgica en español contemporáneo.
- source_word: biting by stealth
  choice: muerden a escondidas
  rationale: Conserva la imagen de ataques ocultos o traicioneros.
- source_word: physician
  choice: médico
  rationale: Término común, actual y digno que mantiene la metáfora sanadora.
- source_word: generate and ingenerate
  choice: engendrado y no engendrado
  rationale: Reproduce deliberadamente la antítesis teológica del testimonio sin explicarla ni armonizarla.
- source_word: passible and impassible
  choice: sujeto al sufrimiento y ... libre de sufrimiento
  rationale: Comunica la capacidad de padecer y la posterior condición de no padecer con mayor claridad que los tecnicismos «pasible/impasible».
theological_decisions:
- issue: La expresión «God in man»
  choice: Dios en el ser humano
  alternative: Dios en hombre / Dios hecho hombre
  rationale: Se conserva la formulación relacional y ambigua del testimonio; «hecho hombre» introduciría una interpretación no expresada de manera explícita aquí.
- issue: La oposición «engendrado y no engendrado»
  choice: Mantener ambos términos sin armonización
  alternative: Nacido y eterno
  rationale: La formulación paradójica es teológicamente significativa y debe conservarse, especialmente mientras esté pendiente la revisión directa del griego.
- issue: La oposición «primero pasible y luego impasible»
  choice: primero sujeto al sufrimiento y después libre de sufrimiento
  alternative: primero capaz de sufrir y después incapaz de sufrir
  rationale: Mantiene la secuencia y la tensión cristológica, pero evita que «incapaz» sugiera limitación o impotencia.
- issue: «Son of Mary and Son of God»
  choice: hijo de María e Hijo de Dios
  alternative: Hijo de María e Hijo de Dios
  rationale: La distinción tipográfica refleja el uso reverencial habitual para el título divino sin negar la filiación respecto de María.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono exhortativo y la serie de antítesis cristológicas. Dado que la revisión directa del griego está pendiente, la redacción evita sobreprecisar los pares teológicos discutidos y se apoya de manera transparente en el testimonio público proporcionado.
