base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: es
  text: 'Nada me aprovecharán los confines del mundo ni los reinos de esta era. Más vale para mí morir para Cristo Jesús que reinar sobre los confines de la tierra. Busco a aquel que murió por nosotros; deseo a aquel que resucitó por nosotros.


    Los dolores del parto ya están sobre mí. Tengan paciencia conmigo, hermanos. No me impidan vivir ni quieran que muera. No entreguen al mundo a quien desea pertenecer a Dios, ni lo seduzcan con cosas materiales. Déjenme recibir la luz pura. Cuando llegue allá, entonces seré un hombre.[a]


    Permítanme imitar la pasión de mi Dios.[b] Si alguien lo tiene dentro de sí, que comprenda lo que deseo y se compadezca de mí, pues conoce lo que me oprime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: «entonces seré un hombre». La frase expresa de manera enfática la meta que Ignacio espera alcanzar al llegar allá.'
    reason: Mantiene la formulación breve y potencialmente extraña del griego, sin añadir «verdaderamente» ni fijar una explicación antropológica o doctrinal.
  - marker: b
    text: Aquí «pasión» significa el sufrimiento y la muerte de Cristo.
    reason: Aclara el uso cristiano histórico de «pasión» sin sustituir el término tradicional del texto.
lexical_decisions:
- source_word: τὰ τέρματα τοῦ κόσμου
  choice: los confines del mundo
  rationale: Conserva la imagen espacial de los límites extremos del κόσμος sin la expansión interpretativa «universo».
- source_word: αἱ βασιλεῖαι τοῦ αἰῶνος τούτου
  choice: los reinos de esta era
  rationale: Distingue αἰών («era», «edad») de κόσμος («mundo») y mantiene su posible matiz escatológico sin explicarlo en el texto.
- source_word: ἀποθανεῖν εἰς Χριστὸν Ἰησοῦν
  choice: morir para Cristo Jesús
  rationale: La preposición εἰς expresa orientación o destino; «para» resulta natural y conserva esa dirección, aunque «ir hacia Cristo mediante la muerte» sería una explicitación posible.
- source_word: ὁ τοκετός
  choice: los dolores del parto
  rationale: En el contexto, el sustantivo alude al trance del alumbramiento; esta formulación conserva la metáfora de un nacimiento inminente.
- source_word: ὕλῃ
  choice: cosas materiales
  rationale: El término puede significar «materia» o «realidad material»; la expresión comunica el contraste con pertenecer a Dios sin imponer un tecnicismo filosófico.
- source_word: συμπαθείτω μοι
  choice: comparta mi dolor
  rationale: Expresa participar afectivamente en lo que Ignacio padece; es más natural en español actual que un calco como «simpatice conmigo».
- source_word: τὰ συνέχοντά με
  choice: lo que me oprime
  rationale: συνέχω puede indicar apremiar, constreñir o angustiar; «oprime» preserva la presión interna sin precisar en exceso su causa.
theological_decisions:
- issue: Sentido paradójico de vivir y morir
  choice: «No me impidan vivir ni quieran que muera»
  alternative: «No me impidan alcanzar la vida ni deseen mi muerte»
  rationale: 'Se conserva la paradoja deliberada: para Ignacio, impedir su martirio equivale a impedirle vivir, mientras devolverlo al mundo equivale a desear su muerte. No se resuelve la tensión mediante una paráfrasis doctrinal.'
- issue: «Entonces seré un ser humano»
  choice: Se conserva la afirmación con una nota explicativa mínima
  alternative: «Entonces llegaré a ser plenamente humano»
  rationale: El griego ἄνθρωπος ἔσομαι es breve y enfático. «Verdaderamente» comunica el énfasis contextual, pero la nota deja visible la forma más literal y evita fijar una antropología particular.
- issue: «La pasión de mi Dios»
  choice: Se traduce literalmente y se aclara el sentido histórico de «pasión»
  alternative: «los padecimientos de mi Dios»
  rationale: La expresión vincula explícitamente el sufrimiento de Cristo con «mi Dios». Mantenerla preserva su fuerza cristológica; la nota evita que «pasión» se entienda como emoción intensa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea el plural «ustedes» implícito en las formas verbales y «hermanos» conforme al vocativo del texto. La redacción se contrastó con el texto griego comúnmente atestiguado de la recensión media, pero, dado que el expediente suministrado señala que la revisión formal de la fuente griega sigue pendiente, las decisiones deben considerarse publicables solo de manera provisional hasta una colación crítica del manuscrito o edición base. No se conserva el corchete del testimonio inglés en «[por nosotros]», porque δι’ ἡμᾶς aparece en el texto griego corriente; una futura colación deberá confirmar si el corchete reflejaba una variante de la edición consultada.
