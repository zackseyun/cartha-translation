base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: es
  text: 'He sabido que ustedes tienen una disposición irreprochable y que permanecen firmes en la paciencia, no por costumbre, sino por naturaleza, tal como me informó Polibio, su obispo. Por voluntad de Dios y de Jesucristo, él me visitó en Esmirna y compartió con tanta alegría mi gozo en las cadenas en Cristo Jesús que, en él, vi a toda la comunidad de ustedes.


    Así pues, al recibir por medio de él la benevolencia de ustedes, digna de Dios, di gloria a Dios, porque descubrí que ustedes eran imitadores de Dios, tal como había sabido.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind (English witness; Greek review pending)
  choice: disposición
  rationale: Expresa una actitud o condición interior de forma natural en español; «mente irreprochable» resultaría rígido y podría reducir indebidamente el sentido moral del término subyacente.
- source_word: steadfast in patience
  choice: permanecen firmes en la paciencia
  rationale: Conserva tanto la constancia como la perseverancia paciente sin convertirlas en una virtud meramente pasiva.
- source_word: not from habit, but by nature
  choice: no por costumbre, sino por naturaleza
  rationale: Mantiene la contraposición enfática del testimonio sin explicar ni resolver su posible alcance antropológico o retórico.
- source_word: bonds
  choice: cadenas
  rationale: Es una imagen concreta, tradicional y comprensible del encarcelamiento de Ignacio.
- source_word: whole multitude
  choice: toda la comunidad
  rationale: En este contexto epistolar se refiere al conjunto de los destinatarios; «comunidad» comunica naturalmente esa totalidad sin sugerir una muchedumbre circunstancial.
- source_word: godly benevolence
  choice: benevolencia de ustedes, digna de Dios
  rationale: Evita el poco natural «benevolencia divina», que podría atribuir la acción directamente a Dios, y conserva la cualidad religiosa expresada por el testimonio.
- source_word: imitators of God
  choice: imitadores de Dios
  rationale: Preserva literalmente la formulación teológica fuerte y su posible eco de la tradición apostólica.
theological_decisions:
- issue: La voluntad de Dios y de Jesucristo
  choice: Por voluntad de Dios y de Jesucristo
  alternative: Por la voluntad de Dios, es decir, de Jesucristo
  rationale: Se conserva la coordinación del testimonio y no se impone una identificación explicativa que el texto no expresa de manera inequívoca.
- issue: Objeto de «di gloria»
  choice: di gloria a Dios
  alternative: di gloria
  rationale: En español, la expresión absoluta resulta poco natural; se hace explícito el destinatario implícito más probable, sin añadir contenido doctrinal ajeno al contexto.
- issue: Participación de Polibio en el gozo de Ignacio
  choice: compartió con tanta alegría mi gozo
  alternative: se alegró tanto conmigo
  rationale: La opción elegida refleja que Polibio se alegró juntamente con Ignacio, no necesariamente que celebrara las cadenas mismas; se mantiene la relación de ese gozo con el encarcelamiento en Cristo.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conservan el tono pastoral, las imágenes de las cadenas y la tensión de «por naturaleza». Borrador necesariamente provisional: el material suministrado identifica la tradición griega, pero no incluye el texto griego; por ello, las decisiones se apoyan en el testimonio inglés público y deben cotejarse directamente con el griego antes de publicación definitiva.'
