revisions:
- from: '[Pero] eviten las divisiones, pues son el principio de los males. Sigan todos al obispo, como Jesucristo siguió al Padre; sigan al consejo de ancianos[a] como a los apóstoles, y respeten a los diáconos como al mandamiento de Dios. Que nadie haga nada relacionado con la iglesia al margen del obispo. Téngase por válida la eucaristía que se celebre bajo la autoridad del obispo o de aquel a quien él la haya encomendado.


    Dondequiera que aparezca el obispo, allí esté la comunidad; así como donde esté Jesucristo, allí está la Iglesia universal[b]. No es lícito bautizar ni celebrar la comida de amor fraternal[c] al margen del obispo. Pero todo lo que él apruebe también agrada a Dios, a fin de que todo lo que ustedes hagan sea firme y válido.'
  to: '[Pero] eviten las divisiones, pues son el principio de los males. Todos sigan al obispo, como Jesucristo al Padre; sigan también al presbiterio[a], como a los apóstoles, y respeten a los diáconos como al mandamiento de Dios. Que nadie haga nada de lo que corresponde a la iglesia sin el obispo. Téngase por segura y válida aquella eucaristía que esté bajo la responsabilidad del obispo o de aquel a quien él se la haya encomendado.


    Dondequiera que aparezca el obispo, allí esté la congregación; así como donde está Jesucristo, allí está la Iglesia universal[b]. No es lícito, sin el obispo, ni bautizar ni celebrar un banquete de amor fraternal[c]. Pero todo lo que él apruebe también agrada a Dios, para que todo lo que ustedes hagan sea seguro y válido.'
  rationale: La revisión conserva el sentido del testimonio inglés y el texto griego conocido, pero reduce explicitaciones interpretativas, recupera «presbiterio» como término técnico con explicación, y mejora la claridad sintáctica y la naturalidad del español. Se mantiene el corchete inicial porque el enlace aparece señalado como editorial en el testimonio suministrado.
  reviewer_model: gpt-5.6-terra
