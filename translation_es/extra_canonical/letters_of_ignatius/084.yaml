base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: es
  text: '[Pero] eviten las divisiones, pues son el principio de los males. Todos sigan al obispo, como Jesucristo al Padre; sigan también al presbiterio[a], como a los apóstoles, y respeten a los diáconos como al mandamiento de Dios. Que nadie haga nada de lo que corresponde a la iglesia sin el obispo. Téngase por segura y válida aquella eucaristía que esté bajo la responsabilidad del obispo o de aquel a quien él se la haya encomendado.


    Dondequiera que aparezca el obispo, allí esté la congregación; así como donde está Jesucristo, allí está la Iglesia universal[b]. No es lícito, sin el obispo, ni bautizar ni celebrar un banquete de amor fraternal[c]. Pero todo lo que él apruebe también agrada a Dios, para que todo lo que ustedes hagan sea seguro y válido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Presbiterio» traduce un término para el cuerpo de presbíteros o ancianos de la comunidad.
    reason: Conserva el término histórico y explica su sentido colectivo.
  - marker: b
    text: «Universal» traduce el término del que procede «católica»; aquí expresa la Iglesia en su totalidad.
    reason: Conserva el sentido histórico del término sin imponer una lectura confesional posterior.
  - marker: c
    text: 'También llamado «ágape»: comida comunitaria de amor fraternal entre los cristianos.'
    reason: Explica una práctica antigua y conserva su nombre histórico.
lexical_decisions:
- source_word: presbytery (Greek presbyterion, source review pending)
  choice: consejo de ancianos
  rationale: Expresa de manera comprensible el carácter colectivo del término y evita confundirlo con un edificio o con el sentido denominacional moderno de «presbiterio»; una nota conserva el término tradicional.
- source_word: valid eucharist
  choice: eucaristía ... válida
  rationale: Conserva la terminología eclesial y jurídica del testimonio, sin sustituirla por una interpretación denominacional.
- source_word: universal Church (Greek katholike ekklesia, source review pending)
  choice: Iglesia universal
  rationale: Traduce el sentido básico de «universal» sin convertir aquí el adjetivo en un nombre confesional posterior.
- source_word: love-feast (Greek agape, source review pending)
  choice: comida de amor fraternal
  rationale: Hace comprensible la referencia a una comida comunitaria cristiana y mantiene «ágape» en la nota.
- source_word: people
  choice: comunidad
  rationale: En este contexto designa a la congregación reunida, no a la población en general.
theological_decisions:
- issue: Autoridad episcopal en los actos eclesiales
  choice: «bajo la autoridad del obispo» y «al margen del obispo»
  alternative: «presidida por el obispo» / «sin la presencia del obispo»
  rationale: El testimonio habla de dependencia o autorización, no necesariamente de presidencia personal ni de presencia física en cada acto.
- issue: Comparación del respeto a los diáconos con el mandamiento de Dios
  choice: «respeten a los diáconos como al mandamiento de Dios»
  alternative: «respeten a los diáconos conforme al mandamiento de Dios»
  rationale: Se conserva la comparación fuerte y potencialmente difícil del testimonio, sin suavizarla mediante una relación interpretativa.
- issue: Identidad de la Iglesia universal
  choice: «donde esté Jesucristo, allí está la Iglesia universal»
  alternative: «donde está Jesucristo, allí está la Iglesia católica»
  rationale: «Universal» refleja el valor antiguo del adjetivo y evita importar una identificación institucional posterior que el pasaje, por sí solo, no precisa.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno; tratamiento plural «ustedes». Se mantiene «obispo», «diáconos» y «eucaristía» por su precisión histórica. Los corchetes en «[Pero]» reflejan que el enlace inicial aparece como editorial o incierto en el testimonio suministrado. Borrador necesariamente provisional: la ficha indica que aún está pendiente la revisión directa del griego de la recensión media.'
