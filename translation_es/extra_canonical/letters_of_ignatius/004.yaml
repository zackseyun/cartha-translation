base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: es
  text: 'No les doy órdenes como si yo fuera alguien importante. Pues, aunque estoy encadenado por causa del Nombre, todavía no he sido perfeccionado en Jesucristo. [Pues][a] apenas ahora comienzo a ser discípulo, y les hablo como a compañeros de estudio. Pues debo ser entrenado por ustedes en la fe, la amonestación, la constancia y la paciencia.



    Pero, puesto que el amor no me permite guardar silencio acerca de ustedes, me adelanté a exhortarlos a que corran en armonía con el pensamiento de Dios. Pues también Jesucristo, nuestra vida inseparable, es el pensamiento del Padre, así como los obispos establecidos en las partes más lejanas de la tierra están en el pensamiento de Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El término «Pues» aparece entre corchetes porque el testimonio base lo presenta como una restauración textual.
    reason: Conservar de manera visible la señal de restauración transmitida por el testimonio inglés suministrado.
lexical_decisions:
- source_word: the Name
  choice: el Nombre
  rationale: Se conserva la expresión reverencial y alusiva del testimonio, sin reemplazarla por un referente explícito que el texto no nombra.
- source_word: school-fellows
  choice: compañeros de escuela
  rationale: Mantiene la imagen formativa ligada a comenzar a ser discípulo, con lenguaje comprensible y sin convertirla en una relación jerárquica.
- source_word: contest
  choice: combate
  rationale: Comunica la metáfora de preparación y esfuerzo; armoniza naturalmente con «entrenen» y evita reducir la imagen a una competencia deportiva moderna.
- source_word: admonition
  choice: exhortación
  rationale: Expresa instrucción y llamado moral sin el matiz exclusivamente reprensivo que «amonestación» suele tener en el español actual.
- source_word: endurance / long-suffering
  choice: perseverancia / paciencia
  rationale: Conserva la distinción entre mantenerse firme bajo la prueba y soportar con paciencia durante largo tiempo.
- source_word: mind
  choice: pensamiento
  rationale: La repetición enlaza a Dios, al Padre y a Jesucristo. «Pensamiento» conserva esa cohesión sin resolver el término únicamente como «voluntad» o «propósito».
- source_word: run in harmony
  choice: correr en armonía
  rationale: Preserva conjuntamente la metáfora dinámica de correr y la idea de concordancia.
theological_decisions:
- issue: La imperfección presente de Ignacio en relación con Jesucristo
  choice: todavía no he alcanzado la perfección en Jesucristo
  alternative: todavía no soy perfecto en Jesucristo
  rationale: Presenta la perfección como una meta aún no alcanzada y mantiene la tensión entre su encarcelamiento por el Nombre y su afirmación de que apenas comienza a ser discípulo.
- issue: Jesucristo como «pensamiento» del Padre
  choice: Jesucristo... es el pensamiento del Padre
  alternative: Jesucristo... es la voluntad del Padre
  rationale: Se conserva la formulación fuerte y su paralelismo interno, sin reducirla a obediencia ni imponer una explicación metafísica adicional.
- issue: Los obispos en el pensamiento de Jesucristo
  choice: están en el pensamiento de Jesucristo
  alternative: actúan conforme a la voluntad de Jesucristo
  rationale: La traducción mantiene la expresión relacional y su posible amplitud, en vez de convertirla exclusivamente en una afirmación sobre conducta o autoridad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se conservan las metáforas de escuela, entrenamiento, combate y carrera. Este borrador se basa necesariamente en el testimonio inglés público suministrado; la revisión directa del griego de la recensión media sigue pendiente, por lo que se evita afirmar más precisión léxica de la que permite la evidencia disponible.
