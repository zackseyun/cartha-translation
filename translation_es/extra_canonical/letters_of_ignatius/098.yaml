base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: es
  text: 'Como no he podido escribir a todas las iglesias, pues zarpé repentinamente de Troas hacia Neápolis, según lo dispone la voluntad divina, tú escribirás a las iglesias que están más adelante, como quien posee el pensamiento de Dios, para que ellas también hagan lo mismo: quienes puedan, que envíen mensajeros; y los demás, cartas por medio de las personas que tú envíes. Así ustedes serán honrados por una obra de recuerdo perdurable, pues esto es digno de ti.


    Saludo a todos por nombre, especialmente a la esposa de Epítropo, junto con toda su casa y las casas de sus hijos.[a] Saludo a mi amado Átalo. Saludo a quien sea designado para ir a Siria. La gracia estará siempre con él y con Policarpo, quien lo envía.


    Me despido siempre de ustedes en nuestro Dios Jesucristo. Permanezcan en él, en la unidad y bajo la supervisión de Dios.[b] Saludo a Alce, nombre muy querido para mí. Que estén bien en el Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión transmitida puede entenderse como «las casas de sus hijos» o, de manera más general, «los suyos».
    reason: El testimonio inglés («her children's») es sintácticamente difícil y la revisión directa del griego aún está pendiente.
  - marker: b
    text: También podría traducirse «en la unidad y el episcopado de Dios»; aquí se conserva el sentido más general de supervisión.
    reason: Se preserva la ambigüedad institucional y teológica del término sin imponer un desarrollo eclesiástico específico.
lexical_decisions:
- source_word: the Divine will enjoineth
  choice: según lo dispone la voluntad divina
  rationale: Reproduce el carácter normativo de la voluntad divina sin añadir una identificación más específica que la del testimonio disponible.
- source_word: churches in front
  choice: las iglesias que están más adelante
  rationale: Conserva el probable sentido geográfico de comunidades situadas por delante en la ruta, sin convertirlo en una expresión jerárquica.
- source_word: mind of God
  choice: el pensamiento de Dios
  rationale: Mantiene la formulación fuerte y antigua, evitando parafrasearla como mera sabiduría o intención.
- source_word: ever memorable deed
  choice: una obra de recuerdo perdurable
  rationale: Expresa de manera natural una acción digna de memoria permanente.
- source_word: supervision of God
  choice: la supervisión de Dios
  rationale: Retiene el sentido administrativo o pastoral del término transmitido, sin armonizarlo con un cargo eclesiástico específico.
- source_word: Fare ye well
  choice: Que estén bien
  rationale: Fórmula epistolar natural y digna en español actual, distinta del saludo final más abrupto «Adiós».
theological_decisions:
- issue: Referencia a Jesucristo como «nuestro Dios»
  choice: nuestro Dios Jesucristo
  alternative: Dios y Jesucristo
  rationale: Se conserva la relación gramatical del testimonio, donde «Dios» califica directamente a Jesucristo, sin diluir ni ampliar la afirmación.
- issue: Unidad y supervisión de Dios
  choice: en la unidad y bajo la supervisión de Dios
  alternative: en la unidad y el episcopado de Dios
  rationale: La traducción evita imponer una interpretación denominacional o identificar «supervisión» con una institución posterior, aunque hace explícita mediante «bajo» la relación natural en español.
- issue: Promesa de gracia al enviado y a Policarpo
  choice: La gracia estará siempre con él y con Policarpo
  alternative: Que la gracia esté siempre con él y con Policarpo
  rationale: Se mantiene el valor declarativo futuro del testimonio inglés, aunque el contexto epistolar también podría admitir un deseo o bendición.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la alternancia entre el singular dirigido a Policarpo («tú», «ti») y el plural dirigido a la comunidad («ustedes»). Los nombres propios se adaptan a sus formas españolas habituales. Borrador provisional basado en el testimonio inglés de dominio público; requiere cotejo directo con la tradición manuscrita griega de la recensión media.
