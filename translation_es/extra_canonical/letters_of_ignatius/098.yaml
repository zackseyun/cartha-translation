review_pass:
  verdict: revise
  source_fidelity: 'Se requiere corrección segura en el saludo a la esposa de Epítropo: la secuencia transmitida corresponde a «toda su casa y sus hijos», no a «las casas de sus hijos». También conviene reflejar con mayor precisión el matiz de αἰώνιος en «obra eterna/perdurable», sin reducirlo a la idea de recuerdo. «Las iglesias que están más adelante» conserva adecuadamente el sentido direccional de las iglesias situadas delante en la ruta. «Nuestro Dios Jesucristo» mantiene la construcción cristológica transmitida.'
  naturalness: 'El español es en general claro y de registro epistolar digno. «Obra de recuerdo perdurable» resulta algo forzado; «obra memorable para siempre» es más idiomático y sigue de cerca el testimonio inglés. «Me despido siempre de ustedes» puede expresar el saludo de despedida, pero «Les digo siempre: adiós» es una fórmula más directa y natural para el imperativo epistolar plural. Se conserva deliberadamente la alternancia tú/ustedes.'
  terminology: «Voluntad divina», «mensajeros», «gracia», «nuestro Dios Jesucristo» y «unidad» son adecuados. «Supervisión de Dios» puede conservarse como traducción no institucionalizante de la formulación transmitida; la nota debe indicar que la alternativa «episcopado» depende de la revisión del griego, no presentarla como equivalente establecida. Para θεοῦ γνώμην, «el designio de Dios» comunica mejor que «el pensamiento de Dios» una posesión de consejo o propósito divino, sin imponer una lectura doctrinal.
  issues:
  - severity: high
    issue: «las casas de sus hijos»
    rationale: El texto transmitido y la probable sintaxis griega se refieren a la esposa de Epítropo «con toda su casa y sus hijos». La versión actual introduce «casas» y desplaza indebidamente la pertenencia hacia los hijos.
  - severity: medium
    issue: «una obra de recuerdo perdurable»
    rationale: La expresión es poco natural y atenúa el componente temporal enfático de «ever-memorable» y de αἰώνιος. «Una obra memorable para siempre» conserva la amplitud sin fijar una interpretación técnica de αἰώνιος.
  - severity: low
    issue: «el pensamiento de Dios»
    rationale: Es posible, pero «el designio de Dios» representa más naturalmente la idea de γνώμη como consejo, intención o propósito, y evita una formulación española rígida.
  - severity: low
    issue: Redacción de la nota b
    rationale: La alternativa «episcopado» debe quedar expresamente condicionada a la futura comprobación directa del griego, dado que el expediente declara esa revisión pendiente.
  revised_text: 'Como no he podido escribir a todas las iglesias, pues zarpé repentinamente de Troas hacia Neápolis, según lo dispone la voluntad divina, tú escribirás a las iglesias que están más adelante, como quien posee el designio de Dios, para que ellas también hagan lo mismo: quienes puedan, que envíen mensajeros; y los demás, cartas por medio de las personas que tú envíes. Así ustedes serán glorificados por una obra memorable para siempre, pues esto es digno de ti.


    Saludo a todos por nombre, especialmente a la esposa de Epítropo, junto con toda su casa y sus hijos. Saludo a mi amado Átalo. Saludo a quien sea designado para ir a Siria. La gracia estará siempre con él y con Policarpo, quien lo envía.


    Les digo siempre: adiós en nuestro Dios Jesucristo. Permanezcan en él, en la unidad y bajo la supervisión de Dios.[a] Saludo a Alce, nombre muy querido para mí. Que estén bien en el Señor.'
  revised_footnotes:
  - marker: a
    text: La expresión también puede entenderse como «en la unidad y el episcopado de Dios»; se traduce de manera general como «bajo la supervisión de Dios». La revisión directa del griego permitirá precisar el alcance institucional del término.
    reason: Conserva la ambigüedad terminológica sin anticipar una conclusión eclesiológica ni presentar como resuelta una cuestión pendiente de cotejo directo.
  revision_rationale: 'Se corrige una alteración material en la referencia a la casa e hijos de la esposa de Epítropo. Se mejora la naturalidad de dos expresiones sin abandonar la equivalencia formal moderada: «designio» para el consejo o propósito divino y «obra memorable para siempre» para el énfasis temporal. La formulación sobre la supervisión de Dios se mantiene cautelosamente, con una nota menos concluyente hasta que se haga el cotejo directo con el texto griego de la recensión media.'
