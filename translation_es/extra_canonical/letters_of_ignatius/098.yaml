    I salute all by name, and especially the wife of Epitropus with her whole household and her children''s. I salute Attalus my beloved. I salute him that shall be appointed to go to Syria. Grace shall be with him always, and with Polycarp who sendeth him.


    I bid you farewell always in our God Jesus Christ, in whom abide ye in the unity and supervision of God. I salute Alce, a name very dear to me. Fare ye well in the Lord.'
