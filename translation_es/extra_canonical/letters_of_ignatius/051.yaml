review_pass:
  verdict: revise
  source_fidelity: 'Se requiere corrección segura en la primera oración: el testimonio distingue «las iglesias de Dios» de «hombres/personas que me reconfortaron»; el relativo «las cuales» atribuye indebidamente la acción a las iglesias. También conviene no convertir «en oración unos con otros» en oración intercesora («oren unos por otros»), pues el original conserva una formulación más amplia de comunión en la oración. Se preservan los corchetes del testimonio de base y la ambigüedad de «suerte» y «reprobado».'
  naturalness: El español es generalmente claro y de registro digno. «Manténganse en concordia y en oración unos con otros» es natural y más fiel que «Permanezcan en armonía y oren unos por otros». «Fortalezcan el ánimo de su obispo» expresa idiomáticamente el sentido de animar su vida interior sin sustituirla por «corazón».
  terminology: «Esmirna», «presbíteros», «cadenas», «suerte» y «reprobado» son elecciones adecuadas. Se conserva «llegar a Dios» sin desarrollar doctrinalmente la probable referencia al martirio. «Personas» traduce de manera inclusiva y neutral el referente humano del testimonio inglés («men») sin confundirlo con las iglesias.
  issues:
  - severity: high
    issue: El relativo «las cuales me han reconfortado» tiene como antecedente «las iglesias de Dios».
    rationale: 'El testimonio dice «together with the churches ...; men who refreshed me»: las personas presentes, no las iglesias como tales, son quienes reconfortaron al autor.'
  - severity: medium
    issue: «Oren unos por otros» estrecha «in prayer one with another».
    rationale: La expresión de base puede referirse a perseverar en oración mutua o compartida, no específicamente a interceder unos por otros.
  - severity: low
    issue: «Anime el corazón de su obispo» interpreta «alma» como «corazón».
    rationale: Aunque idiomático, «fortalezcan el ánimo de su obispo» conserva mejor la referencia a su vida interior y la función exhortativa.
  revised_text: 'Los saludo desde Esmirna, junto con las iglesias de Dios que están aquí conmigo y con las personas que me han reconfortado en todo sentido, tanto en cuerpo como en espíritu.


    Mis cadenas, que llevo por causa de Jesucristo, los exhortan mientras suplico que se me permita llegar a Dios. Manténganse en concordia y en oración unos con otros. Pues conviene que cada uno de ustedes, y especialmente los presbíteros, fortalezca el ánimo de su obispo, para honra del Padre [y para honra] de Jesucristo y de los apóstoles.[a]


    Les ruego que me escuchen con amor, para que, al haberles escrito así, no resulte yo un testimonio contra ustedes. Oren también por mí, pues necesito su amor en la misericordia de Dios, a fin de que se me conceda la suerte que anhelo alcanzar y no sea hallado reprobado.'
  revised_footnotes:
  - marker: a
    text: Las palabras «y para honra» aparecen entre corchetes porque el testimonio utilizado las presenta como una restauración textual. La revisión directa de la tradición griega de la recensión media sigue pendiente.
    reason: Preservar transparentemente la señal crítica del testimonio de base y la limitación de la evidencia disponible.
  revision_rationale: La revisión corrige la atribución errónea del alivio recibido, restituye la amplitud de la exhortación a la concordia y la oración mutuas, y ajusta una expresión de ánimo al obispo. No resuelve más allá de la evidencia disponible las ambigüedades relativas a llegar a Dios, la suerte anhelada ni ser hallado reprobado.
