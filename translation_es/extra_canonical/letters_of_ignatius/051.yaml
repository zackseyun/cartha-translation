base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: es
  text: 'Los saludo desde Esmirna, junto con las iglesias de Dios que están aquí conmigo, las cuales me han reconfortado en todo sentido, tanto en cuerpo como en espíritu.


    Mis cadenas, que llevo por causa de Jesucristo, los exhortan mientras suplico que se me permita llegar a Dios. Permanezcan en armonía y oren unos por otros. Pues conviene que cada uno de ustedes, y especialmente los presbíteros, anime el corazón de su obispo, para honra del Padre [y para honra] de Jesucristo y de los apóstoles.[a]


    Les ruego que me escuchen con amor, para que, por haberles escrito esto, no llegue yo a ser un testimonio contra ustedes. Oren también por mí, pues necesito su amor en la misericordia de Dios, a fin de que se me conceda alcanzar la suerte que anhelo y no sea hallado reprobado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Las palabras «y para honra» aparecen entre corchetes porque el testimonio utilizado las presenta como una restauración textual. La revisión directa de la tradición griega de la recensión media sigue pendiente.
    reason: Preservar con transparencia la señal crítica presente en el testimonio de base y declarar la limitación de la evidencia disponible.
lexical_decisions:
- source_word: refresh / ἀναπαύω (source review pending)
  choice: reconfortado
  rationale: Comunica alivio y renovación sin reducir la expresión únicamente al descanso físico.
- source_word: flesh / σάρξ (source review pending)
  choice: cuerpo
  rationale: En el paralelismo «cuerpo... espíritu», «cuerpo» resulta natural en español actual y expresa aquí la dimensión física sin sugerir necesariamente una connotación moral negativa.
- source_word: bonds / δεσμά (source review pending)
  choice: cadenas
  rationale: Conserva la imagen concreta del encarcelamiento de Ignacio y su fuerza retórica.
- source_word: presbyters / πρεσβύτεροι (source review pending)
  choice: presbíteros
  rationale: Mantiene el título eclesial antiguo sin identificarlo de manera exclusiva con una estructura denominacional posterior.
- source_word: soul / ψυχή (source review pending)
  choice: corazón
  rationale: En la exhortación a dar ánimo, «corazón» comunica de modo natural la vida interior de la persona; evita la expresión poco idiomática «animar el alma».
- source_word: lot / κλῆρος (source review pending)
  choice: suerte
  rationale: Conserva la imagen de una porción o destino asignado, sin precisar más de lo que permite el testimonio disponible.
- source_word: reprobate / ἀδόκιμος (source review pending)
  choice: reprobado
  rationale: Preserva la idea de no superar la prueba o no recibir aprobación, así como su tensión escatológica, sin explicarla doctrinalmente.
theological_decisions:
- issue: «llegar a Dios» en el contexto del martirio esperado
  choice: llegar a Dios
  alternative: alcanzar la presencia de Dios
  rationale: Se conserva la formulación breve y teológicamente tensa del testimonio, sin convertirla en una explicación explícita de la muerte o del estado posterior.
- issue: Honra del Padre, Jesucristo y los apóstoles
  choice: para honra del Padre [y para honra] de Jesucristo y de los apóstoles
  alternative: para honra del Padre, de Jesucristo y de los apóstoles
  rationale: Los corchetes preservan la señal de restauración textual del testimonio suministrado; la nota advierte que está pendiente la revisión directa del griego.
- issue: La suerte que Ignacio anhela
  choice: la suerte que anhelo
  alternative: el destino que deseo alcanzar
  rationale: «Suerte» retiene la posible imagen de una porción asignada y no define de antemano si la referencia es exclusivamente al martirio, a la salvación final o a ambos.
- issue: Testimonio contra los destinatarios
  choice: no llegue yo a ser un testimonio contra ustedes
  alternative: no tenga que testificar contra ustedes
  rationale: Mantiene la ambigüedad entre la carta, el autor y su advertencia como testimonio acusador, en vez de convertirla en una acción judicial inequívoca.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conservan términos históricos como «presbíteros». El borrador se apoya provisionalmente en el testimonio inglés público suministrado y en las indicaciones de posible léxico griego; requiere cotejo directo con los manuscritos griegos de la recensión media antes de considerarse definitivo.
