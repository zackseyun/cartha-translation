review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones seguras en las metáforas agrícolas: el testimonio dice que las hierbas «no son el cultivo/la labranza de Jesucristo» y «no son plantación del Padre», no que Cristo no las cultive ni que no fueron plantadas en el pasado. También conviene no hacer explícito «de Cristo» en «la pasión» dentro del texto principal, pues el referente queda implícito en el original y el testimonio inglés.'
  naturalness: El español es generalmente claro y de registro apropiado. «Filtración» suele significar fuga o escape de un líquido/información, por lo que no comunica naturalmente la imagen de tamizado; «filtrado» conserva mejor la rareza y la imagen sin resolver su sentido. «Enseñanza ajena» resulta algo más natural y amplio que «doctrina ajena» para «strange doctrine/opinion».
  terminology: «Obispo», «unidad de la iglesia», «reino de Dios» y «pasión» preservan adecuadamente los términos eclesiales y teológicos. Se conserva «la pasión» en el cuerpo textual y se identifica su probable referente cristológico solo en nota. «Plantación del Padre» mantiene el sustantivo y el paralelismo de la imagen.
  issues:
  - severity: medium
    issue: Las dos imágenes agrícolas se han convertido en acciones y se ha alterado el tiempo verbal.
    rationale: «Que Jesucristo no cultiva» y «no fueron plantadas por el Padre» van más allá de «no son el cultivo de Jesucristo» y «no son plantación del Padre». La revisión restituye los predicados nominales y evita introducir un pasado inexistente.
  - severity: medium
    issue: «Filtración» no es el equivalente español más natural de una imagen de filtrado o tamizado.
    rationale: En español contemporáneo suele denotar una fuga. «Filtrado» retiene la formulación inusual del testimonio, su carácter de proceso y la ambigüedad que exige verificación griega.
  - severity: medium
    issue: El texto principal explicita «de Cristo» donde el testimonio conserva «la pasión».
    rationale: Aunque el referente probablemente es Cristo, hacerlo explícito reduce una elipsis del texto. La nota puede ofrecer esa orientación contextual sin convertirla en parte de la traducción.
  revised_text: 'Manténganse alejados de las plantas dañinas, que no son el cultivo de Jesucristo, porque no son plantación del Padre. No porque haya encontrado división entre ustedes, sino filtrado.[a]


    Porque todos los que son de Dios y de Jesucristo están con el obispo; y todos los que se arrepientan y entren en la unidad de la iglesia también serán de Dios, para que vivan conforme a Jesucristo. No se engañen, hermanos míos.


    Si alguien sigue a quien causa una división, no heredará el reino de Dios. Si alguien vive conforme a una enseñanza ajena, no tiene comunión con la pasión.[b]'
  revised_footnotes:
  - marker: a
    text: «Filtrado» traduce una imagen poco común. También puede entenderse como tamizado, depuración o separación; el sentido exacto requiere revisión directa del texto griego.
    reason: Conserva la rareza y ambigüedad de «filtering», pero evita el sentido habitual de fuga asociado con «filtración».
  - marker: b
    text: Lit. «la pasión» o «el sufrimiento». En este contexto, probablemente se refiere a la pasión o al sufrimiento de Cristo.
    reason: Aclara el referente contextual probable sin incorporarlo de manera interpretativa al texto principal.
  revision_rationale: La revisión restituye el paralelismo nominal de las metáforas agrícolas, conserva el tiempo y la elipsis del testimonio, y emplea un español latinoamericano natural sin resolver de forma indebida el término inusual «filtering». Dado que la revisión directa del griego sigue pendiente, «filtrado» y su nota mantienen la ambigüedad textual.
