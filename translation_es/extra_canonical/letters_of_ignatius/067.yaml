review_pass:
  verdict: revise
  source_fidelity: Se requiere una corrección segura en la última cláusula. El probable griego τῷ πάθει οὐ συγκατατίθεται expresa asentimiento o adhesión a «la pasión», no meramente participación en el sufrimiento. La traducción propuesta por el borrador («no participa») y el testimonio inglés («has no fellowship») comunican una relación general, pero atenúan el verbo griego. Se conserva deliberadamente la imagen extraña de ἀποδιϋλισμός sin resolverla interpretativamente.
  naturalness: El español es en general claro, actual y de registro digno. «No porque haya encontrado división..., sino filtración» conserva una elipsis abrupta presente en el pasaje; la nota permite que el lector entienda que se trata de una imagen o término inusual. «No da su asentimiento a la pasión» es preciso y natural en un registro literario-teológico, sin imponer una interpretación sacramental o denominacional.
  terminology: «Cultivo de Jesucristo», «plantación del Padre», «obispo», «unidad de la iglesia», «reino de Dios» y «pasión» preservan las imágenes y términos centrales. Se mantiene «la pasión» en el texto, con nota que identifica prudentemente el referente cristológico contextual, en vez de sustituirla por una paráfrasis interpretativa como «el sufrimiento de Cristo».
  issues:
  - severity: medium
    issue: «No participa en el sufrimiento de Cristo» no reproduce con suficiente precisión el verbo de la cláusula final.
    rationale: La probable expresión griega τῷ πάθει οὐ συγκατατίθεται significa «no da su asentimiento a la pasión» / «no se adhiere a la pasión». «Participa» desplaza el sentido hacia comunión o participación y «de Cristo» explicita en el cuerpo textual un referente que el original deja implícito.
  - severity: low
    issue: «Que Jesucristo no cultiva» vuelve verbal un predicado nominal agrícola.
    rationale: No es una alteración grave, pero «no son cultivo de Jesucristo» refleja de forma más directa la imagen de γεώργιον y conserva mejor el paralelismo con «plantación del Padre».
  revised_text: 'Manténganse alejados de las plantas dañinas, que no son cultivo de Jesucristo, porque no son plantación del Padre. No porque haya encontrado división entre ustedes, sino filtración.[a]


    Porque todos los que pertenecen a Dios y a Jesucristo están con el obispo; y todos los que se arrepientan y entren en la unidad de la iglesia también pertenecerán a Dios, para que vivan conforme a Jesucristo. No se engañen, hermanos míos.


    Si alguien sigue a quien provoca una división, no heredará el reino de Dios. Si alguien vive conforme a una doctrina ajena, no da su asentimiento a la pasión.[b]'
  revised_footnotes:
  - marker: a
    text: «Filtración» traduce literalmente una imagen poco común. También puede entenderse como tamizado, depuración o separación; el sentido exacto requiere revisión directa del texto griego.
    reason: El testimonio inglés conserva deliberadamente «filtering», y la base proporcionada indica que la revisión de la lengua fuente sigue pendiente.
  - marker: b
    text: Lit. «la pasión». El verbo puede expresar dar asentimiento o adherirse a ella; en este contexto, «la pasión» se refiere a la de Cristo.
    reason: Conserva el término y el referente implícito del original, y aclara que la cláusula no habla meramente de participación en un sufrimiento.
  revision_rationale: 'La revisión ajusta dos puntos de manera segura: restituye la formulación nominal de la metáfora agrícola y, principalmente, traduce el verbo final como asentimiento/adhesión. No resuelve el enigmático término «filtración», ni amplía las afirmaciones sobre el obispo, la unidad de la iglesia o la pasión con doctrinas posteriores. Las notas conservan la cautela requerida mientras la revisión directa del griego permanece pendiente.'
