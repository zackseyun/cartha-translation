base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: es
  text: 'Manténganse alejados de las plantas dañinas, que Jesucristo no cultiva, porque no fueron plantadas por el Padre. No digo esto porque haya encontrado división entre ustedes, sino filtración.[a]


    Porque todos los que pertenecen a Dios y a Jesucristo están con el obispo; y todos los que se arrepientan y entren en la unidad de la iglesia también pertenecerán a Dios, para que vivan conforme a Jesucristo. No se engañen, hermanos míos.


    Si alguien sigue a quien provoca una división, no heredará el reino de Dios. Si alguien vive conforme a una doctrina ajena, no participa en el sufrimiento de Cristo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Filtración» traduce literalmente una imagen poco común. También puede entenderse como tamizado, depuración o separación; el sentido exacto requiere revisión directa del texto griego.
    reason: El testimonio inglés conserva deliberadamente «filtering», y la base proporcionada indica que la revisión de la lengua fuente sigue pendiente.
  - marker: b
    text: Lit. «el sufrimiento» o «la pasión»; en este contexto se refiere al sufrimiento de Cristo.
    reason: Aclara para el lector moderno el referente implícito sin reducir el alcance teológico de la expresión.
lexical_decisions:
- source_word: noxious herbs / Greek witness likely κακαὶ βοτάναι
  choice: plantas dañinas
  rationale: Conserva la metáfora agrícola y expresa en español actual el carácter perjudicial de esas enseñanzas o personas sin convertir la imagen en una explicación.
- source_word: husbandry / Greek witness likely γεωργεῖ
  choice: que Jesucristo no cultiva
  rationale: Transforma el sustantivo inglés arcaico en un verbo natural y mantiene la imagen de cultivo.
- source_word: planting of the Father / Greek witness likely φυτεία πατρός
  choice: no fueron plantadas por el Padre
  rationale: Mantiene el paralelismo agrícola en una formulación clara y natural.
- source_word: filtering / Greek witness likely ἀποδιϋλισμός
  choice: filtración
  rationale: Retiene la imagen inusual y la ambigüedad del término, en vez de resolverla como discernimiento, purificación o separación.
- source_word: are of God and of Jesus Christ
  choice: pertenecen a Dios y a Jesucristo
  rationale: En español comunica pertenencia de manera más natural que el calco «son de», sin precisar indebidamente la naturaleza de esa relación.
- source_word: walketh in strange doctrine / Greek witness likely ἐν ἀλλοτρίᾳ γνώμῃ περιπατεῖ
  choice: vive conforme a una doctrina ajena
  rationale: «Vive» reproduce el valor idiomático de «andar»; «doctrina ajena» conserva la idea de una enseñanza extraña o impropia sin añadir una etiqueta confesional.
- source_word: passion / Greek witness likely πάθος
  choice: sufrimiento de Cristo
  rationale: Es comprensible para lectores actuales y hace explícito el referente cristológico implícito en el contexto, sin limitarlo únicamente a la muerte.
theological_decisions:
- issue: Relación entre pertenecer a Dios, el obispo y la unidad de la iglesia
  choice: Conservar las afirmaciones directas del pasaje sin suavizarlas ni ampliarlas
  alternative: Explicarlas como una definición universal y exhaustiva de la salvación o, a la inversa, reducirlas a simple consejo administrativo
  rationale: El texto vincula fuertemente la comunión con el obispo y la unidad eclesial con pertenecer a Dios, pero no corresponde importar un sistema eclesiológico posterior.
- issue: Participación en el sufrimiento de Cristo
  choice: «no participa en el sufrimiento de Cristo»
  alternative: «no está de acuerdo con la pasión» o «no tiene comunión con la pasión»
  rationale: La formulación preserva el sentido relacional del testimonio inglés y la probable construcción griega, evitando definir si la participación es sacramental, ética, doctrinal o martirial.
- issue: Arrepentimiento y entrada en la unidad eclesial
  choice: Mantener la secuencia «se arrepientan y entren» y el futuro «pertenecerán»
  alternative: Convertirla en una fórmula técnica de reincorporación o declarar condiciones adicionales
  rationale: Respeta la tensión y la progresión del pasaje sin añadir requisitos denominacionales.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la metáfora agrícola y la inusual imagen de la filtración. Se usa «iglesia» en minúscula como nombre común de la comunidad, «ustedes» para la segunda persona plural y lenguaje inclusivo solo cuando surge naturalmente del sentido. Dado que el expediente declara pendiente la revisión del griego, las decisiones se presentan como provisionales y se evita fingir una certeza filológica no disponible en la evidencia suministrada.
