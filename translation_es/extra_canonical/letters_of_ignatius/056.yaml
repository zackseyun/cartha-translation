base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: es
  text: 'Nunca le negaron nada a nadie; ustedes han enseñado a otros. Y deseo que permanezcan vigentes las enseñanzas que imparten como maestros.


    Solo oren para que yo tenga poder por dentro y por fuera, a fin de que no solo lo diga, sino que también lo desee; que no solo me llamen cristiano, sino que también demuestre serlo. Porque, si demuestro serlo, entonces también podré ser llamado cristiano y ser fiel cuando ya no sea visible para el mundo.


    Nada visible es bueno. Pues nuestro Dios Jesucristo, al estar en el Padre, se hace tanto más claramente visible. La obra no consiste en persuasión, sino que el cristianismo es poder cuando el mundo lo odia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un testimonio inglés de dominio público. Falta revisar directamente el texto griego de la recensión media; por ello, algunos matices léxicos y sintácticos pueden requerir ajuste.
    reason: La fuente proporcionada indica expresamente que la revisión del griego está pendiente; la nota hace transparente la base textual sin presentar con falsa certeza decisiones aún provisionales.
lexical_decisions:
- source_word: ἐφθονήσατε (presumed Greek behind “grudged”)
  choice: le negaron nada
  rationale: Comunica de manera natural la idea contextual de no haber impedido ni escatimado el bien a nadie, sin limitarla a la emoción moderna de la envidia.
- source_word: δύναμις / δύνασθαι (reflected by “power”)
  choice: poder
  rationale: Conserva la repetición conceptual y el contraste entre mera expresión verbal y capacidad o eficacia real.
- source_word: Χριστιανός
  choice: cristiano
  rationale: Equivalente histórico y directo del nombre confesional.
- source_word: ἔργον
  choice: obra
  rationale: Mantiene la oposición entre una realidad demostrada en hechos y la simple persuasión verbal.
- source_word: πεισμονή
  choice: persuasión
  rationale: Preserva el término abstracto y el contraste retórico con poder, sin añadir una valoración denominacional.
theological_decisions:
- issue: Designación de Jesucristo como Dios
  choice: nuestro Dios Jesucristo
  alternative: Jesucristo, nuestro Dios
  rationale: Se conserva sin atenuación la afirmación cristológica del testimonio y su relación sintáctica inmediata.
- issue: Relación de Jesucristo con el Padre
  choice: al estar en el Padre
  alternative: estando con el Padre
  rationale: Se mantiene la formulación de inhabitación o relación expresada por el testimonio, sin explicarla mediante una categoría teológica posterior.
- issue: “Nada visible es bueno”
  choice: Nada visible es bueno
  alternative: Nada de lo que se ve es bueno
  rationale: Se conserva la tensión y el carácter absoluto de la formulación, evitando suavizarla o armonizarla en el texto principal.
- issue: El cristianismo como poder cuando es odiado
  choice: el cristianismo es poder cuando el mundo lo odia
  alternative: el cristianismo es una realidad poderosa siempre que el mundo lo odia
  rationale: Mantiene la formulación paradójica y evita convertirla en una regla doctrinal más explícita de lo que permite el testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea “ustedes” para el plural y una sintaxis clara, manteniendo las repeticiones, contrastes y paradojas del pasaje. Dado que no se suministró el texto griego y la revisión de la lengua fuente está pendiente, el borrador sigue críticamente el testimonio inglés auditado y señala su carácter provisional.
