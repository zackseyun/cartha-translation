review_pass:
  verdict: revise
  source_fidelity: La versión reproduce fielmente la progresión exhortativa, el contraste entre el nombre cristiano y la realidad, la referencia al obispo, la conciencia y la reunión conforme al mandamiento. Sin embargo, «nos llamemos cristianos» vuelve activa una construcción pasiva del testimonio («be called Christians»; griego subyacente pendiente de revisión directa).
  naturalness: El español es claro, sobrio y natural para un texto patrístico. «Ser llamados cristianos» conserva la voz pasiva sin resultar forzado. «Actúan al margen de él» y «se reúnen legítimamente» son formulaciones neutrales y comprensibles en español latinoamericano.
  terminology: «Cristianos», «obispo», «buena conciencia» y «el mandamiento» son adecuados. Se mantiene prudentemente la indeterminación de «el mandamiento», sin identificarlo con una norma eclesiástica concreta ni añadir implicaciones doctrinales posteriores.
  issues:
  - severity: medium
    issue: Cambio de voz en «nos llamemos cristianos»
    rationale: El testimonio inglés dice «be called Christians», no «call ourselves Christians». El borrador puede sugerir una autodenominación voluntaria, mientras que el contraste original recae en recibir/llevar el nombre frente a ser realmente aquello que se llama.
  revised_text: Por lo tanto, conviene no solo ser llamados cristianos, sino también serlo. Algunos tienen el nombre del obispo en los labios, pero en todo actúan al margen de él. Me parece que tales personas no conservan una buena conciencia, pues no se reúnen legítimamente conforme al mandamiento.[a]
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada declara que la revisión de la lengua fuente aún está pendiente; la nota hace transparente la base documental y el grado de provisionalidad.
  revision_rationale: Se corrige únicamente la voz de la primera cláusula para reflejar el contraste del testimonio entre «ser llamados» y «ser». El resto del texto conserva adecuadamente el sentido, el registro y las ambigüedades del testimonio proporcionado. La nota [a] permanece anclada al final de la unidad y sigue siendo pertinente para toda la traducción provisional.
