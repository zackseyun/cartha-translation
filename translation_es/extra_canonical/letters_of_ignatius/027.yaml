base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: es
  text: Por lo tanto, conviene que no solo nos llamemos cristianos, sino que también lo seamos. Algunos tienen el nombre del obispo en los labios, pero en todo actúan al margen de él. Me parece que tales personas no conservan una buena conciencia, pues no se reúnen legítimamente conforme al mandamiento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada declara que la revisión de la lengua fuente aún está pendiente; la nota hace transparente la base documental y el grado de provisionalidad.
lexical_decisions:
- source_word: meet
  choice: conviene
  rationale: Expresa de manera natural y digna la idea de lo apropiado o debido, sin exagerarla como una obligación absoluta.
- source_word: be called Christians ... be such
  choice: nos llamemos cristianos ... lo seamos
  rationale: Conserva el contraste retórico entre llevar el nombre y vivir realmente como cristianos.
- source_word: have the bishop's name on their lips
  choice: tienen el nombre del obispo en los labios
  rationale: Mantiene la imagen concreta del testimonio inglés, que señala reconocimiento verbal sin obediencia práctica.
- source_word: act apart from him
  choice: actúan al margen de él
  rationale: Comunica independencia práctica respecto del obispo sin añadir una acusación más específica.
- source_word: keep a good conscience
  choice: conservan una buena conciencia
  rationale: Reproduce el sentido moral de mantener una conciencia recta.
- source_word: assemble themselves together lawfully
  choice: se reúnen legítimamente
  rationale: Preserva tanto el acto de reunirse como la valoración de que la reunión debe realizarse de manera válida u ordenada.
- source_word: according to commandment
  choice: conforme al mandamiento
  rationale: Mantiene el singular y evita identificar el mandamiento de forma no explícita en el testimonio disponible.
theological_decisions:
- issue: Relación de la comunidad con el obispo
  choice: al margen de él
  alternative: sin contar con él / separados de él
  rationale: La formulación conserva la crítica a actuar independientemente del obispo sin convertir el pasaje en una definición posterior de autoridad eclesiástica.
- issue: Identidad cristiana nominal y real
  choice: no solo nos llamemos cristianos, sino que también lo seamos
  alternative: no solo llevemos el nombre de cristianos, sino que vivamos como tales
  rationale: La opción elegida retiene la concisión y la tensión ontológica del testimonio, mientras que la alternativa interpretaría explícitamente el ser como conducta.
- issue: Naturaleza del mandamiento
  choice: el mandamiento
  alternative: lo mandado
  rationale: Se conserva la referencia definida pero no identificada, evitando decidir si se trata de un mandato concreto, apostólico o comunitario.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la repetición retórica, la imagen «en los labios» y la ambigüedad de «el mandamiento». Se evita introducir terminología confesional posterior.
