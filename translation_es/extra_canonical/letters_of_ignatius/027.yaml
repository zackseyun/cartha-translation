review_pass:
  verdict: revise
  source_fidelity: La traducción refleja bien el testimonio inglés suministrado, pero «nos llamemos» puede sugerir que los propios creyentes se atribuyen el nombre, mientras que «be called Christians» es pasivo. Además, falta el enlace comparativo («even as» / «In the same way») antes del caso de quienes mencionan al obispo. Se conserva la cautela epistémica de «appear to me» mediante «me parece que».
  naturalness: El registro es natural, sobrio y apto para español latinoamericano neutral. «Seamos llamados cristianos» conserva la formulación retórica sin resultar forzada; «en todo actúan al margen de él» expresa con claridad la independencia práctica criticada.
  terminology: «Obispo», «buena conciencia», «mandamiento» y «al margen de él» son opciones apropiadas y no imponen desarrollos doctrinales posteriores. «Conforme al mandamiento» mantiene la referencia singular y no identificada del testimonio de base.
  issues:
  - severity: medium
    issue: «nos llamemos cristianos» traduce de forma activa una expresión pasiva.
    rationale: El contraste del testimonio es entre ser llamados cristianos y serlo realmente. «Nos llamemos» puede entenderse como autodenominación; «seamos llamados» conserva la voz y la tensión retórica.
  - severity: low
    issue: Se omite el conector comparativo antes de la referencia a quienes tienen el nombre del obispo en los labios.
    rationale: «Even as» establece el segundo caso como ilustración paralela. «De igual manera» restituye esa relación discursiva sin sobreinterpretarla.
  - severity: low
    issue: «No conservan» hace más categórica la formulación que «Such people do not seem to me to maintain».
    rationale: La expresión «me parece que no mantienen» conserva tanto la valoración negativa como la reserva personal presente en el testimonio.
  revised_text: Por lo tanto, conviene que no solo seamos llamados cristianos, sino que también lo seamos. De igual manera, algunos tienen el nombre del obispo en los labios, pero en todo actúan al margen de él. Me parece que tales personas no mantienen una buena conciencia, pues no se reúnen legítimamente conforme al mandamiento.[a]
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada declara que la revisión de la lengua fuente aún está pendiente; la nota hace transparente la base documental y el grado de provisionalidad.
  revision_rationale: Se corrigen la voz pasiva de «be called Christians», el vínculo comparativo que introduce el ejemplo del obispo y el matiz de valoración personal en «appear to me». Se mantienen la ambigüedad de «el mandamiento», la crítica sin especificarla como una doctrina posterior de autoridad y la nota de provisionalidad exigida por la base documental.
