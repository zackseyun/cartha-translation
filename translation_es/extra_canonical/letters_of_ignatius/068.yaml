review_pass:
  verdict: revise
  source_fidelity: 'El sentido general se conserva bien: la exhortación a la unidad eucarística y su correlación con un solo altar, obispo, presbiterio y diáconos están presentes. Sin embargo, «celebrar» hace más específico el verbo transmitido («usar/participar de») y puede sugerir exclusivamente la acción de presidir o realizar el rito. «Participar de» conserva mejor la exhortación dirigida a toda la comunidad. «Presbiterio» es el término histórico directo para el cuerpo colegiado mencionado; una nota puede desambiguarlo sin reemplazarlo en el texto.'
  naturalness: La redacción es clara y de registro digno. «Participar de una sola eucaristía» y «presbiterio» con nota son naturales en un contexto histórico cristiano. Se ajusta la puntuación final para reproducir de modo más fluido la construcción enfática «hagan lo que hagan».
  terminology: Se conserva «eucaristía», término histórico y teológicamente no reductivo. Se restituye «presbiterio» como equivalente terminológico de presbytery, aclarando que se trata del grupo de presbíteros o ancianos. «Compañeros de servicio» mantiene adecuadamente el valor de συνεργοί/«fellow-servants» según el testimonio inglés, sin imponer una categoría laboral moderna.
  issues:
  - severity: medium
    issue: «celebrar una sola eucaristía» restringe el alcance de la exhortación.
    rationale: El testimonio dice «observe one eucharist» y la formulación griega tradicionalmente asociada expresa usar o participar de una sola eucaristía. «Celebrar» es posible en español eclesial, pero puede focalizar indebidamente la acción ritual en vez de la participación comunitaria.
  - severity: low
    issue: «consejo de ancianos» sustituye el término histórico «presbiterio».
    rationale: Aunque la nota explica la equivalencia, el reemplazo pierde la terminología institucional del pasaje. «Presbiterio» es claro con una breve nota que descarte el sentido arquitectónico.
  revised_text: Por tanto, procuren participar de una sola eucaristía[a] (pues una sola es la carne de nuestro Señor Jesucristo y una sola es la copa para la unión en su sangre; hay un solo altar, así como hay un solo obispo, junto con el presbiterio[b] y los diáconos, mis compañeros de servicio), para que, hagan lo que hagan, lo hagan conforme a Dios.[c]
  revised_footnotes:
  - marker: a
    text: «Eucaristía» significa literalmente «acción de gracias» y aquí designa la celebración o comida eucarística de la comunidad.
    reason: Aclara un término histórico sin sustituirlo por una expresión denominacional.
  - marker: b
    text: «Presbiterio» corresponde al término tradicional para el cuerpo de presbíteros o ancianos; aquí no se refiere a una parte del edificio.
    reason: Conserva el término histórico y evita su ambigüedad arquitectónica en español.
  - marker: c
    text: Literalmente, «según Dios» o «de acuerdo con Dios».
    reason: Hace visible la concisión y amplitud de la expresión, sin añadir «voluntad» u otro complemento interpretativo.
  revision_rationale: 'La revisión conserva la estructura, las repeticiones de unidad y la ambigüedad de «la unión en su sangre». Corrige dos decisiones que estrechaban o sustituían innecesariamente el sentido histórico: se usa «participar de» para la exhortación comunitaria y «presbiterio» para el término colegiado. No se introduce una lectura sacramental o eclesiológica posterior.'
