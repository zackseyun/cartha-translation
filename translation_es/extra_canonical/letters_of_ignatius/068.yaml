review_pass:
  verdict: revise
  source_fidelity: La traducción conserva adecuadamente la secuencia enfática de unidad y el sentido general del testimonio inglés. Sin embargo, «celebrar» restringe «observe/use one eucharist» a la acción de presidir o realizar la celebración; «participar de una sola eucaristía» refleja más ampliamente la exhortación dirigida a toda la comunidad. «Presbiterio», con nota aclaratoria, es el equivalente histórico más directo de *presbytery* y evita introducir «consejo», que no está expresado en el texto.
  naturalness: El registro es claro y latinoamericano. «Procuren participar de una sola eucaristía» y «de acuerdo con Dios» resultan naturales sin expandir el sentido. Se ajusta también la puntuación del marcador final.
  terminology: Se conserva «eucaristía» como término histórico. «Presbiterio» se mantiene como denominación del cuerpo de presbíteros, con una nota que excluye el sentido arquitectónico. «Compañeros de servicio» comunica de manera actual «fellow-servants» sin cargar el texto con una fórmula arcaica.
  issues:
  - severity: medium
    issue: «Celebrar una sola eucaristía» es más estrecho que la exhortación a usar o participar de una sola eucaristía.
    rationale: El destinatario plural abarca a la comunidad, no solo a quien oficia. «Participar» conserva mejor el alcance sin determinar cuestiones litúrgicas no desarrolladas aquí.
  - severity: low
    issue: «Consejo de ancianos» es una paráfrasis institucional de «presbiterio».
    rationale: Aunque la nota explica la elección, «presbiterio» corresponde más directamente al término histórico y puede aclararse sin sustituirlo por una expresión que no aparece en el original.
  - severity: low
    issue: «Conforme a Dios» es comprensible, pero algo menos idiomático en español actual.
    rationale: «De acuerdo con Dios» mantiene la amplitud de «after God/según Dios» sin añadir «la voluntad de Dios».
  revised_text: Por tanto, procuren participar de una sola eucaristía[a] (pues una sola es la carne de nuestro Señor Jesucristo y una sola es la copa para la unión en su sangre; hay un solo altar, así como hay un solo obispo, junto con el presbiterio[b] y los diáconos, mis compañeros de servicio), para que todo lo que hagan, lo hagan de acuerdo con Dios[c].
  revised_footnotes:
  - marker: a
    text: «Eucaristía» significa literalmente «acción de gracias» y aquí designa la celebración o comida eucarística de la comunidad.
    reason: Aclara un término histórico sin sustituirlo por una expresión denominacional.
  - marker: b
    text: «Presbiterio» designa aquí el cuerpo de presbíteros o ancianos; no se refiere a una parte del edificio.
    reason: Conserva el término histórico y evita su acepción arquitectónica moderna.
  - marker: c
    text: Literalmente, «según Dios» o «de acuerdo con Dios».
    reason: Hace visible la concisión y amplitud de la expresión subyacente al testimonio inglés, dado que la revisión directa del griego está pendiente.
  revision_rationale: La revisión mejora la correspondencia con el alcance comunitario de la exhortación, conserva el término histórico «presbiterio» y emplea una formulación final más idiomática que no añade una interpretación doctrinal. La traducción sigue siendo provisional, pues el expediente suministra un testimonio inglés y señala que la revisión directa del griego está pendiente.
