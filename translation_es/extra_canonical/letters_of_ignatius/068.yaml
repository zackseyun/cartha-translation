base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: es
  text: Por tanto, procuren celebrar una sola eucaristía[a] (pues una sola es la carne de nuestro Señor Jesucristo y una sola es la copa para la unión en su sangre; hay un solo altar, así como hay un solo obispo, junto con el consejo de ancianos[b] y los diáconos, mis compañeros de servicio), para que todo lo que hagan lo hagan conforme a Dios.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eucaristía» significa literalmente «acción de gracias» y aquí designa la celebración o comida eucarística de la comunidad.
    reason: Aclara un término histórico que algunos lectores modernos podrían no conocer sin sustituirlo por una expresión denominacional.
  - marker: b
    text: La expresión traducida «consejo de ancianos» corresponde al término tradicional «presbiterio», entendido aquí como el cuerpo de presbíteros o ancianos, no como una parte del edificio.
    reason: Evita una ambigüedad frecuente en español y conserva la referencia colegiada.
  - marker: c
    text: Literalmente, «según Dios» o «de acuerdo con Dios».
    reason: Hace visible la concisión y amplitud de la expresión subyacente al testimonio inglés, dado que la revisión directa del griego está pendiente.
lexical_decisions:
- source_word: one eucharist
  choice: una sola eucaristía
  rationale: Conserva el término histórico y el énfasis reiterado en la unidad; «una sola» expresa mejor que «una» el contraste numérico del pasaje.
- source_word: observe
  choice: celebrar
  rationale: En español actual, «celebrar la eucaristía» expresa naturalmente la práctica comunitaria, mientras que «observar» resultaría poco idiomático en este contexto.
- source_word: presbytery
  choice: consejo de ancianos
  rationale: Comunica que se trata de un cuerpo colegiado y evita confundirlo con el espacio arquitectónico llamado «presbiterio»; se documenta en nota el término tradicional.
- source_word: my fellow-servants
  choice: mis compañeros de servicio
  rationale: Mantiene la idea de servicio compartido sin introducir la connotación moderna de empleo que puede tener «consiervos» para algunos lectores.
- source_word: after God
  choice: conforme a Dios
  rationale: 'Preserva la formulación abierta del testimonio suministrado: actuar de una manera concordante con Dios, sin añadir «voluntad» u otro complemento interpretativo.'
theological_decisions:
- issue: Unidad eucarística y ministerial
  choice: Se conserva la sucesión enfática de «una sola/un solo» y la relación entre eucaristía, carne, copa, altar, obispo, ancianos y diáconos.
  alternative: Reformular la unidad como uniformidad institucional o definir de manera posterior los cargos y el rito.
  rationale: El texto vincula estos elementos, pero no desarrolla aquí una teoría sacramental o eclesiológica completa; la traducción no debe importar definiciones denominacionales posteriores.
- issue: La copa y la unión en la sangre
  choice: «la copa para la unión en su sangre»
  alternative: «la copa que nos une mediante su sangre» o «la copa de su sangre»
  rationale: La formulación conserva la posible ambigüedad respecto de cómo se relacionan la copa, la unión y la sangre, en vez de precisar una interpretación no explícita en el testimonio disponible.
- issue: Norma divina de la acción comunitaria
  choice: «conforme a Dios»
  alternative: «conforme a la voluntad de Dios»
  rationale: No se añade «voluntad», pues el testimonio dice literalmente algo equivalente a «según Dios» y admite una expresión más amplia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa el plural «ustedes» implícito en las formas verbales. El borrador es provisional porque se basa en el testimonio inglés de J. B. Lightfoot; la revisión directa de la tradición griega de la recensión media sigue pendiente.
