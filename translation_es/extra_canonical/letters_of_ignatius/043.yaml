review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado y conserva sus principales ambigüedades. Sin embargo, «reconozco mis propios límites» expresa principalmente conciencia de los límites, mientras que «I take the measure of myself» describe una acción de moderarse o mantenerse contenido. La revisión recupera ese matiz sin añadir interpretación doctrinal. La revisión directa del griego sigue pendiente, tal como advierte la nota.
  naturalness: El español es claro, actual y de registro digno. Se conserva «mansedumbre» por su valor ético y su adecuada resonancia en este género cristiano antiguo. La puntuación y la cohesión de ambos párrafos son naturales para el español latinoamericano neutral.
  terminology: Se mantienen «jactancia», «azote», «envidia del diablo», «mansedumbre» y «gobernante de este mundo». «Gobernante» conserva el sentido funcional de «prince/ruler» sin imponer un título moderno ni una lectura doctrinal específica.
  issues:
  - severity: low
    issue: «reconozco mis propios límites» debilita el sentido activo de autolimitación.
    rationale: El testimonio dice «I take the measure of myself» y el audit trail inglés lo entiende como mantenerse dentro de límites apropiados. «Me mantengo dentro de mis límites» comunica mejor esa moderación activa.
  revised_text: 'Tengo muchos pensamientos profundos en Dios, pero me mantengo dentro de mis límites, para no perecer por causa de mi jactancia. Porque ahora debo temer aún más y no prestar atención a quienes quieren llenarme de orgullo, pues los que me dicen esas cosas son un azote para mí.


    Aunque deseo sufrir, no sé si soy digno de ello. Muchos no perciben la envidia del diablo, pero contra mí libra una guerra aún más feroz. Por eso anhelo la mansedumbre, mediante la cual el gobernante de este mundo queda reducido a nada.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en un antiguo testimonio inglés de la recensión media; queda pendiente la revisión directa del texto griego.
    reason: La información suministrada indica expresamente que aún no se ha realizado la revisión de la lengua fuente, por lo que debe transparentarse el carácter provisional del borrador.
  revision_rationale: 'Se realiza una única corrección semántica segura: se cambia una formulación de autoconocimiento por otra de autolimitación activa. Se conservan el resto del texto, la ambigüedad del conflicto atribuido a la envidia del diablo, el registro y el ancla de la nota provisional.'
