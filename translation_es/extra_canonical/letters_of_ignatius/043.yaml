review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés proporcionado. Sin embargo, «Muchos no perciben la envidia del diablo» convierte «is unseen by many» en una afirmación de percepción activa y puede sonar como si la envidia fuera algo que otros deberían detectar. «permanece oculta para muchos» conserva mejor la formulación y ambigüedad del testimonio. No se proporcionó el texto griego, por lo que la fidelidad directa a la lengua fuente no puede confirmarse todavía.
  naturalness: El español es natural, sobrio y adecuado para un registro cristiano antiguo en variante latinoamericana neutral. La revisión propuesta mejora la fluidez y mantiene el referente de «la envidia» como sujeto de «libra».
  terminology: «Jactancia», «azote», «mansedumbre» y «gobernante de este mundo» son elecciones apropiadas. «Mansedumbre» conserva el registro ético tradicional sin imponer una interpretación doctrinal. «Digno de ello» traduce adecuadamente «worthy».
  issues:
  - severity: low
    issue: «Muchos no perciben la envidia del diablo»
    rationale: El testimonio dice que la envidia del diablo es «unseen by many». «Permanece oculta para muchos» refleja más directamente esa cualidad de estar oculta y evita sugerir un acto específico de percepción que el texto no detalla.
  revised_text: 'Tengo muchos pensamientos profundos en Dios, pero reconozco mis propios límites, para no perecer por causa de mi jactancia. Porque ahora debo temer aún más y no prestar atención a quienes quieren llenarme de orgullo, pues los que me dicen esas cosas son un azote para mí.


    Aunque deseo sufrir, no sé si soy digno de ello. La envidia del diablo permanece oculta para muchos, pero contra mí libra una guerra aún más feroz. Por eso anhelo la mansedumbre, mediante la cual el gobernante de este mundo queda reducido a nada.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en un antiguo testimonio inglés de la recensión media; queda pendiente la revisión directa del texto griego.
    reason: La información suministrada indica expresamente que aún no se ha realizado la revisión de la lengua fuente, por lo que debe transparentarse el carácter provisional del borrador.
  revision_rationale: Se hace una corrección puntual para reproducir con mayor precisión «is unseen by many», sin alterar las restantes decisiones léxicas ni resolver de manera doctrinal las metáforas del pasaje. La nota y su ancla se conservan, pues la revisión directa del griego sigue pendiente.
