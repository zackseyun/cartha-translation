base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: es
  text: 'Tengo muchos pensamientos profundos en Dios, pero reconozco mis propios límites, para no perecer por causa de mi jactancia. Porque ahora debo temer aún más y no prestar atención a quienes quieren llenarme de orgullo, pues los que me dicen esas cosas son un azote para mí.


    Aunque deseo sufrir, no sé si soy digno de ello. Muchos no perciben la envidia del diablo, pero contra mí libra una guerra aún más feroz. Por eso anhelo la mansedumbre, mediante la cual el gobernante de este mundo queda reducido a nada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un antiguo testimonio inglés de la recensión media; queda pendiente la revisión directa del texto griego.
    reason: La información suministrada indica expresamente que aún no se ha realizado la revisión de la lengua fuente, por lo que debe transparentarse el carácter provisional del borrador.
lexical_decisions:
- source_word: deep thoughts in God
  choice: pensamientos profundos en Dios
  rationale: Conserva la formulación espiritual y su posible ambigüedad sin convertirla en una afirmación más específica como «revelaciones» o «conocimiento».
- source_word: I take the measure of myself
  choice: reconozco mis propios límites
  rationale: Expresa de manera natural la idea de medirse o moderarse a sí mismo en vista del peligro de la jactancia.
- source_word: puff me up
  choice: llenarme de orgullo
  rationale: Comunica en español actual la imagen idiomática de inflar el ego, sin una expresión artificiosa.
- source_word: scourge
  choice: azote
  rationale: Mantiene la fuerza de la metáfora de algo que hiere o disciplina.
- source_word: gentleness
  choice: mansedumbre
  rationale: Retiene el sentido ético de una disposición humilde y no agresiva; «mansedumbre» posee el registro cristiano antiguo apropiado sin ser exclusivamente técnico.
- source_word: prince of this world
  choice: gobernante de este mundo
  rationale: «Gobernante» es claro y conserva la designación funcional, mientras evita que «príncipe» se entienda solo como título nobiliario moderno.
- source_word: brought to nought
  choice: queda reducido a nada
  rationale: Preserva la intensidad de la expresión sin resolver si se refiere a derrota, pérdida de poder o anulación.
theological_decisions:
- issue: La dignidad de Ignacio para sufrir
  choice: «no sé si soy digno de ello»
  alternative: «no sé si estoy preparado»
  rationale: El testimonio dice «worthy»; se mantiene el lenguaje de dignidad sin explicarlo como preparación espiritual o mérito salvífico.
- issue: Agente y alcance de la envidia
  choice: «la envidia del diablo»
  alternative: «los celos del diablo»
  rationale: «Envidia» sigue de cerca el testimonio y deja intacta la personificación del conflicto espiritual.
- issue: Efecto de la mansedumbre sobre el gobernante de este mundo
  choice: «mediante la cual ... queda reducido a nada»
  alternative: «con la cual ... es derrotado»
  rationale: No se restringe la expresión a una teoría particular de derrota espiritual ni se precisa indebidamente su mecanismo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las metáforas fuertes («azote», «guerra», «reducido a nada») y la tensión entre el deseo de sufrir y la incertidumbre sobre ser digno. Debido a que el texto griego no fue proporcionado y la revisión de la lengua fuente está pendiente, el borrador sigue cautelosamente el testimonio público inglés y evita afirmaciones filológicas no verificables.
