review_pass:
  verdict: revise
  source_fidelity: La versión conserva la estructura, las preguntas retóricas y las afirmaciones cristológicas del testimonio. Sin embargo, «por causa de la cruz» reexpresa el genitivo de la imagen «offscouring for/of the Cross» como causalidad y «como desecho» atenúa la identificación metafórica. Se corrige a una formulación más directa, sin pretender resolver el matiz exacto hasta contar con revisión griega directa. «Conforme a un plan» comunica provisionalmente el sentido de οἰκονομία sin introducir explícitamente «dispuesto por Dios», elemento que no figura de modo expreso en la frase del testimonio.
  naturalness: El español revisado mantiene un registro actual, sobrio y neutral. «Desecho de la cruz» conserva una aspereza deliberada del original; la nota explica la imagen. «Polemista», «piedra de tropiezo», «descendencia de David» y «pasión» son naturales y adecuados al registro.
  terminology: Se mantiene «nuestro Dios, Jesucristo», sin mitigar ni ampliar la afirmación textual. «Espíritu Santo», «pasión» y «piedra de tropiezo» son términos establecidos. «Plan» para οἰκονομία se conserva con nota que registra el abanico semántico y evita imponer un sistema teológico posterior.
  issues:
  - severity: medium
    issue: «como desecho por causa de la cruz»
    rationale: «Como» vuelve comparativa una predicación que el testimonio presenta de manera directa, y «por causa de» especifica una relación causal que no es necesaria. «Desecho de la cruz» conserva mejor la imagen compacta y su relación no explicada con la cruz.
  - severity: low
    issue: «un plan dispuesto por Dios»
    rationale: La expresión hace explícito a Dios como agente ordenador, aunque el sustantivo «dispensación»/οἰκονομία ya puede sugerir un orden o designio. «Conforme a un plan» es más sobrio y conserva la aclaración en nota.
  revised_text: 'Mi espíritu es un desecho de la cruz, que es piedra de tropiezo para los que no creen, pero para nosotros es salvación y vida eterna. ¿Dónde está el sabio? ¿Dónde está el polemista? ¿Dónde está la jactancia de los que son llamados prudentes?


    Pues nuestro Dios, Jesucristo, fue concebido en el vientre de María conforme a un plan[a]: de la descendencia de David, pero también del Espíritu Santo. Nació y fue bautizado para que, mediante su pasión, purificara el agua.[b]'
  revised_footnotes:
  - marker: a
    text: La expresión también puede traducirse «conforme a una disposición», «conforme a una administración» o «conforme al plan divino».
    reason: El término tradicionalmente vertido «dispensación» puede referirse a un orden, una administración o un plan; la traducción no fija un sentido técnico posterior.
  - marker: b
    text: «Pasión» se refiere aquí al sufrimiento y la muerte de Jesucristo. La afirmación de que así «purificara el agua» se conserva sin desarrollar su posible sentido bautismal.
    reason: Aclara una acepción histórica que puede no ser evidente y evita resolver una formulación teológica deliberadamente densa.
  revision_rationale: 'Se hacen dos ajustes seguros para reproducir con mayor fidelidad el carácter directo y denso del testimonio: se elimina la comparación y la causalidad añadidas en la primera imagen, y se reduce la explicitación interpretativa en «plan dispuesto por Dios». El resto del pasaje se conserva. Dado que el insumo es un testimonio inglés y la revisión directa del griego sigue pendiente, no se resuelven matices textuales o semánticos discutibles más allá de lo respaldado por el testimonio provisto.'
