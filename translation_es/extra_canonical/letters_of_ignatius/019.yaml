review_pass:
  verdict: revise
  source_fidelity: La versión conserva adecuadamente la secuencia, las preguntas retóricas, la afirmación cristológica y la formulación densa sobre el agua. Sin embargo, «como desecho por causa de la cruz» debilita y vuelve causal una expresión nominal más directa («offscouring for/of the Cross»). Además, «Jesucristo» no deja tan visible la formulación enfática «Jesús el Cristo» del testimonio base. «Plan dispuesto por Dios» explicita más de lo necesario el alcance de οἰκονομία.
  naturalness: El registro es claro, actual y apto para español latinoamericano. «Polemista», «piedra de tropiezo», «jactancia» y «pasión» son naturales en este contexto. «Escoria de la cruz» es una imagen deliberadamente áspera, pero reproduce mejor el carácter lapidario y despectivo del original que la comparación «como desecho».
  terminology: Se mantienen correctamente «cruz», «salvación», «vida eterna», «Espíritu Santo» y «pasión». Se recomienda «Jesús el Cristo» para reflejar la designación del testimonio sin convertirla automáticamente en el nombre propio fusionado «Jesucristo». Para οἰκονομία, «designio» conserva una amplitud prudente sin imponer una lectura técnica o una explicación adicional.
  issues:
  - severity: medium
    issue: «Mi espíritu es como desecho por causa de la cruz»
    rationale: La comparación «como» y la locución causal «por causa de» no están exigidas por el testimonio y suavizan/desplazan la imagen nominal de περίψημα vinculada a la cruz. «Mi espíritu es escoria de la cruz» conserva mejor la expresión abrupta, aunque inusual.
  - severity: low
    issue: «Jesucristo» en lugar de «Jesús el Cristo»
    rationale: El testimonio inglés distingue expresamente «Jesus the Christ». «Jesús el Cristo» permite conservar ese énfasis identificador; no altera la confesión cristológica.
  - severity: low
    issue: «un plan dispuesto por Dios» para οἰκονομία
    rationale: La paráfrasis añade de forma explícita «por Dios» y estrecha un término que puede aludir a disposición, orden o designio. «Según un designio» resulta natural y conserva mayor apertura semántica.
  revised_text: 'Mi espíritu es escoria de la cruz, que es piedra de tropiezo para los que no creen, pero para nosotros es salvación y vida eterna. ¿Dónde está el sabio? ¿Dónde está el polemista? ¿Dónde está la jactancia de los que son llamados prudentes?


    Pues nuestro Dios, Jesús el Cristo, fue concebido en el vientre de María según un designio[a]: de la descendencia de David, pero también del Espíritu Santo. Nació y fue bautizado para que, mediante su pasión, purificara el agua.[b]'
  revised_footnotes:
  - marker: a
    text: La expresión también puede traducirse «conforme a una disposición» o «conforme al plan divino».
    reason: «Designio» evita explicitar indebidamente el agente y conserva la amplitud de οἰκονομία; la nota mantiene alternativas legítimas.
  - marker: b
    text: «Pasión» se refiere aquí al sufrimiento y la muerte de Jesucristo. La afirmación de que así «purificara el agua» se conserva sin desarrollar su posible sentido bautismal.
    reason: Aclara el uso histórico de «pasión» sin resolver la expresión teológica condensada del texto.
  revision_rationale: 'La revisión corrige únicamente tres puntos seguros: devuelve a la primera frase su carácter nominal e intensamente figurado, hace visible «Jesús el Cristo» y reduce la explicitación interpretativa de οἰκονομία. Se preservan la ambigüedad de la relación entre David y el Espíritu Santo, así como la finalidad expresada respecto del agua. Dado que la revisión directa del griego sigue pendiente, no se introducen reconstrucciones sintácticas adicionales.'
