base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: es
  text: 'Mi espíritu es como desecho por causa de la cruz, que es piedra de tropiezo para los que no creen, pero para nosotros es salvación y vida eterna. ¿Dónde está el sabio? ¿Dónde está el polemista? ¿Dónde está la jactancia de los que son llamados prudentes?


    Pues nuestro Dios, Jesucristo, fue concebido en el vientre de María conforme a un plan dispuesto por Dios[a]: de la descendencia de David, pero también del Espíritu Santo. Nació y fue bautizado para que, mediante su pasión, purificara el agua.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión también puede traducirse «conforme a una disposición» o «conforme al plan divino».
    reason: El término subyacente, tradicionalmente vertido «dispensación», puede referirse a un orden, administración o plan dispuesto.
  - marker: b
    text: «Pasión» se refiere aquí al sufrimiento y la muerte de Jesucristo. La afirmación de que así «purificara el agua» se conserva sin desarrollar su posible sentido bautismal.
    reason: Aclara una acepción histórica que puede no ser evidente y evita resolver una formulación teológica deliberadamente densa.
lexical_decisions:
- source_word: περίψημα (reflected in “offscouring”)
  choice: como desecho
  rationale: Conserva la fuerte imagen de algo despreciado o eliminado, pero en español corriente; «mi espíritu es desecho» resultaría menos natural.
- source_word: σκάνδαλον (reflected in “stumbling-block”)
  choice: piedra de tropiezo
  rationale: Mantiene la imagen bíblica tradicional y es comprensible en español latinoamericano.
- source_word: συζητητής (reflected in “disputer”)
  choice: polemista
  rationale: Expresa a quien debate o disputa argumentos sin recurrir al menos natural «disputador».
- source_word: οἰκονομία (reflected in “dispensation”)
  choice: plan dispuesto por Dios
  rationale: Comunica la idea de orden, administración o designio divino sin cargar «dispensación» con sentidos teológicos posteriores.
- source_word: σπέρμα Δαυίδ (reflected in “seed of David”)
  choice: descendencia de David
  rationale: Reproduce el sentido genealógico en lenguaje natural actual.
- source_word: πάθος (reflected in “passion”)
  choice: pasión
  rationale: Conserva el término cristiano histórico referido al sufrimiento y muerte de Jesús; la nota aclara el sentido.
theological_decisions:
- issue: La designación de Jesucristo como «nuestro Dios»
  choice: nuestro Dios, Jesucristo
  alternative: Jesucristo, nuestro Dios
  rationale: Mantiene explícita la afirmación cristológica del testimonio sin atenuarla ni ampliarla.
- issue: Relación entre la descendencia de David y el Espíritu Santo en la concepción
  choice: de la descendencia de David, pero también del Espíritu Santo
  alternative: de la descendencia de David y del Espíritu Santo
  rationale: Conserva la tensión y la coordinación contrastiva del testimonio suministrado, sin explicar de qué modo se relacionan ambas afirmaciones.
- issue: Finalidad del bautismo y la pasión respecto del agua
  choice: Nació y fue bautizado para que, mediante su pasión, purificara el agua
  alternative: Fue bautizado para purificar el agua mediante su pasión
  rationale: Preserva la formulación compacta y teológicamente inusual del texto, sin sustituirla por una explicación sacramental denominacional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las preguntas retóricas y las alusiones paulinas. Dado que la revisión directa del griego está pendiente y el material suministrado es un testimonio inglés, las decisiones se presentan como provisionales y procuran no sobreinterpretar.
