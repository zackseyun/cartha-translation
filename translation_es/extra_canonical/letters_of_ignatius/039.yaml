review_pass:
  verdict: revise
  source_fidelity: La versión sigue de cerca el testimonio inglés suministrado. Sin embargo, la doble introducción («a la iglesia...; a la santa iglesia») debe tratarse como una misma destinataria en aposición, no como dos complementos coordinados por punto y coma. La formulación inglesa de la resurrección es difícil y la revisión directa del griego sigue pendiente; no conviene normalizarla a una expresión doctrinal más familiar.
  naturalness: El registro es digno y en general natural. «Nuestra resurrección hacia él» resulta poco idiomático y oscuro en español; «nuestra resurrección hacia él» puede conservarse con una construcción más fluida («por nuestra resurrección, dirigida hacia él»), aunque sigue requiriendo cotejo griego. «Abundantes saludos» es natural como fórmula epistolar.
  terminology: «Teóforo», «pasión», «plenitud divina» y «al modo apostólico» son elecciones prudentes. «Carne y espíritu» refleja más estrictamente el par tradicional y evita que «cuerpo» reduzca σάρξ a lo meramente corporal; por ello se prefiere aquí, sin imponer un contraste moral.
  issues:
  - severity: medium
    issue: Sintaxis duplicada del destinatario
    rationale: El punto y coma entre «amada por Dios...» y «a la santa iglesia...» hace que la oración suene como si hubiera dos destinatarias. En el original/testimonio, ambas expresiones describen a la misma iglesia.
  - severity: medium
    issue: «cuerpo y espíritu» por «flesh and spirit»
    rationale: Aunque «cuerpo» es comprensible, «carne y espíritu» es el equivalente más fiel del binomio transmitido y conserva su formulación antigua sin explicarla teológicamente.
  - severity: low
    issue: Construcción de «nuestra resurrección hacia él»
    rationale: La literalidad direccional es poco natural en español. Se ajusta la sintaxis sin resolver la dificultad textual; el alcance exacto deberá confirmarse frente al griego.
  revised_text: 'Ignacio, llamado también Teóforo, a la iglesia amada por Dios, el Padre de Jesucristo: a la santa iglesia que está en Trales de Asia, elegida y digna de Dios, que tiene paz en carne y espíritu por medio de la pasión de Jesucristo, quien es nuestra esperanza, por nuestra resurrección dirigida hacia él. Saludo también a esta iglesia en la plenitud divina, al modo apostólico, y le deseo abundantes saludos.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La fuente proporcionada advierte que aún no se ha realizado la revisión de la lengua original, por lo que debe transparentarse la base secundaria de esta versión.
  revision_rationale: Se unifican las dos descripciones del único destinatario mediante dos puntos, se restituye «carne y espíritu» para mayor cercanía al testimonio, y se mejora la fluidez de la frase sobre la resurrección sin sustituir su orientación por «en él» ni otra interpretación doctrinal. La nota de transparencia se conserva.
