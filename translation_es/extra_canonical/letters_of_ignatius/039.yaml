base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: es
  text: Ignacio, llamado también Teóforo, a la iglesia amada por Dios, el Padre de Jesucristo; a la santa iglesia que está en Trales de Asia, elegida y digna de Dios, que tiene paz en cuerpo y espíritu por medio de la pasión de Jesucristo, quien es nuestra esperanza mediante nuestra resurrección hacia él. Saludo también a esta iglesia en la plenitud divina, al modo apostólico, y le deseo abundantes saludos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La fuente proporcionada advierte que aún no se ha realizado la revisión de la lengua original, por lo que debe transparentarse la base secundaria de esta versión.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Se conserva como sobrenombre transliterado, pues puede significar «portador de Dios» o «llevado por Dios»; traducirlo en el texto resolvería una ambigüedad antigua.
- source_word: passion
  choice: pasión
  rationale: En contexto cristiano antiguo designa los padecimientos y la muerte de Jesús; «pasión» mantiene el término histórico y su densidad teológica.
- source_word: flesh and spirit
  choice: cuerpo y espíritu
  rationale: «Cuerpo» comunica con naturalidad el ámbito corporal o material implicado por «carne», sin convertir la expresión en un contraste moral ajeno al contexto.
- source_word: Divine plenitude
  choice: plenitud divina
  rationale: Reproduce la expresión elevada del testimonio sin precisar de manera especulativa en qué consiste esa plenitud.
- source_word: after the apostolic fashion
  choice: al modo apostólico
  rationale: Mantiene la referencia al estilo o práctica apostólica sin ampliar su sentido.
theological_decisions:
- issue: Relación expresada en «Dios el Padre de Jesucristo»
  choice: Dios, el Padre de Jesucristo
  alternative: Dios Padre y Jesucristo
  rationale: La puntuación conserva que «Padre de Jesucristo» identifica a Dios, sin transformar la frase en una coordinación distinta.
- issue: Dirección de la resurrección «unto Him»
  choice: nuestra resurrección hacia él
  alternative: nuestra resurrección en él
  rationale: «Hacia él» conserva la orientación del testimonio inglés y evita sustituirla por una fórmula teológica más habitual pero diferente.
- issue: Paz en el ámbito físico y espiritual
  choice: paz en cuerpo y espíritu
  alternative: paz en carne y espíritu
  rationale: Se preservan ambos ámbitos sin sugerir necesariamente oposición ética entre una «carne» pecaminosa y el espíritu.
translation_notes:
  register: Español latinoamericano neutro, actual y digno. Se mantuvo el carácter epistolar solemne del prólogo, pero se dividió ligeramente su larga sintaxis para facilitar la lectura. «Trales» sigue la forma española usual del topónimo; «Teóforo» se conserva sin glosa dentro del texto para no eliminar su ambigüedad.
