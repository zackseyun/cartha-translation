revisions:
- from: 'Porque sé y creo que él estaba en la carne aun después de la resurrección.


    Cuando fue a Pedro y a sus compañeros, les dijo: «Tóquenme y palpen mi cuerpo, y vean que no soy un espíritu incorpóreo».[a] Enseguida ellos lo tocaron y creyeron, al quedar unidos a su carne y a su sangre. Por eso también despreciaron la muerte; más aún, demostraron ser superiores a la muerte. Después de su resurrección, él [comió y bebió con ellos como alguien que estaba en la carne, aunque espiritualmente estaba unido al Padre.[b]'
  to: 'Porque sé y creo que él estaba en la carne aun después de la resurrección.


    Cuando vino a Pedro y a los que estaban con él, les dijo: «Agárrenme y tóquenme, y vean que no soy un demonio incorpóreo».[a] Enseguida lo tocaron y creyeron, unidos a su carne y a su espíritu. Por eso también despreciaron la muerte; es más, resultaron estar por encima de la muerte. Después de su resurrección, él [comió con ellos y bebió con ellos como alguien en la carne, aunque espiritualmente estaba unido al Padre.[b]'
  rationale: 'Se corrigen las tres divergencias principales respecto del griego: «demonio» en lugar de «espíritu», «carne y espíritu» en lugar de «carne y sangre», y la omisión del añadido «mi cuerpo». También se hace explícito que Jesús comió y bebió «con ellos», como indica el dativo griego. Se conserva el corchete sin pareja por fidelidad al testimonio proporcionado y se evita resolver su función editorial de manera especulativa.'
