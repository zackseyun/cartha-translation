base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: es
  text: 'Porque sé y creo que él estaba en la carne aun después de la resurrección.


    Cuando vino a Pedro y a los que estaban con él, les dijo: «Agárrenme y tóquenme, y vean que no soy un demonio incorpóreo».[a] Enseguida lo tocaron y creyeron, unidos a su carne y a su espíritu. Por eso también despreciaron la muerte; es más, resultaron estar por encima de la muerte. Después de su resurrección, él [comió con ellos y bebió con ellos como alguien en la carne, aunque espiritualmente estaba unido al Padre.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «un demonio incorpóreo». La expresión niega que el Resucitado sea un ser sin cuerpo.
    reason: Aclara una expresión antigua potencialmente extraña sin sustituir el término δαιμόνιον del original.
  - marker: b
    text: El corchete de apertura no tiene corchete de cierre correspondiente en el testimonio editorial suministrado; se conserva sin intentar reconstruir su alcance.
    reason: Documenta la anomalía editorial con cautela y sin afirmar una laguna textual determinada.
lexical_decisions:
- source_word: ἐν σαρκί
  choice: en la carne
  rationale: Conserva la expresión cristológica concreta y reiterada del pasaje, sin reducirla a «en un cuerpo» ni interpretarla de forma abstracta.
- source_word: ψηλαφήσατέ με
  choice: palpen mi cuerpo
  rationale: Expresa el examen mediante el tacto. Se añade «mi cuerpo» como complemento natural en español, de acuerdo con el sentido contextual del verbo y la oposición a lo incorpóreo.
- source_word: δαιμόνιον ἀσώματον
  choice: espíritu incorpóreo
  rationale: La tradición griega suele atestiguar una expresión equivalente a «demonio incorpóreo»; «espíritu» comunica aquí la idea de una aparición sin cuerpo en español actual, mientras la nota conserva la opción más literal.
- source_word: συγκραθέντες τῇ σαρκὶ αὐτοῦ καὶ τῷ πνεύματι
  choice: al quedar unidos a su carne y a su sangre
  rationale: Se sigue el testimonio inglés suministrado, que dice «flesh and blood», debido a que la revisión directa del griego está pendiente; la posible lectura «carne y espíritu» se señala en nota.
- source_word: ὑπεράνω θανάτου
  choice: superiores a la muerte
  rationale: Mantiene la imagen enfática de trascender o vencer la muerte sin convertirla en una explicación doctrinal.
- source_word: σαρκικός
  choice: como alguien que estaba en la carne
  rationale: Evita el español poco natural «como carnal», que podría sugerir pecaminosidad, y conserva el contraste entre existencia corporal y unión espiritual con el Padre.
theological_decisions:
- issue: Realidad corporal de Cristo después de la resurrección
  choice: «estaba en la carne» y «lo tocaron»
  alternative: «tenía un cuerpo físico»
  rationale: La formulación conserva el lenguaje histórico y la insistencia del pasaje en una resurrección corporal sin imponer una definición metafísica posterior.
- issue: Identidad del ser incorpóreo negado por Jesús
  choice: «espíritu incorpóreo» con nota sobre «demonio incorpóreo»
  alternative: «demonio sin cuerpo»
  rationale: La traducción principal resulta comprensible en español moderno; la nota preserva la fuerza y la extrañeza de la formulación literal del testimonio.
- issue: Relación espiritual del Resucitado con el Padre
  choice: «aunque espiritualmente estaba unido al Padre»
  alternative: «aunque en espíritu estaba unido al Padre»
  rationale: Se mantiene la tensión del texto entre corporalidad resucitada y unión espiritual, sin explicar la naturaleza de esa unión.
- issue: Lectura «sangre» frente a «espíritu»
  choice: «su carne y su sangre», siguiendo el testimonio suministrado
  alternative: «su carne y su espíritu»
  rationale: La base declarada es un testimonio inglés pendiente de cotejo directo; por transparencia, no se sustituye silenciosamente su lectura, pero se registra la probable divergencia griega en nota.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» implícito y vocabulario accesible. La repetición de «carne» se conserva por su función cristológica. Dado que la fuente proporcionada es un testimonio inglés de dominio público y la revisión del griego está expresamente pendiente, este borrador debe considerarse provisional; las notas hacen visibles las principales incertidumbres textuales.
