base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: es
  text: 'Por tanto, esfuércense por reunirse con mayor frecuencia para dar gracias a Dios y darle gloria. Porque, cuando se reúnen con frecuencia, los poderes de Satanás son derribados y, por la concordia de la fe de ustedes, sus obras destructoras quedan reducidas a nada.


    No hay nada mejor que la paz, mediante la cual queda abolida toda guerra entre los seres celestiales y los terrenales.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «toda guerra de las cosas celestiales y terrenales». La revisión directa del texto griego sigue pendiente.'
    reason: El testimonio inglés conserva una formulación amplia y algo ambigua sobre «things in heaven and things on earth»; la nota evita fijar prematuramente si se refiere a seres, realidades o ámbitos.
lexical_decisions:
- source_word: meet together
  choice: reunirse
  rationale: Expresa de manera natural la reunión comunitaria reiterada, sin añadir una especificación litúrgica que el testimonio suministrado no exige.
- source_word: thanksgiving
  choice: dar gracias
  rationale: Conserva el sentido explícito de acción de gracias y resulta claro en español contemporáneo; no se traduce como «eucaristía» mientras siga pendiente la revisión directa del griego.
- source_word: powers of Satan
  choice: los poderes de Satanás
  rationale: Mantiene la formulación y la tensión espiritual del testimonio sin reducirla a una mera influencia psicológica.
- source_word: mischief
  choice: obras destructoras
  rationale: Comunica el daño o la actividad perniciosa atribuida a Satanás con mayor naturalidad que «maldad» o «travesura», sin precisar indebidamente su forma.
- source_word: concord
  choice: concordia
  rationale: Retiene la idea de armonía y unidad compartida, en un registro digno y comprensible.
- source_word: things in heaven and things on earth
  choice: los seres celestiales y los terrenales
  rationale: Refleja la posible referencia a las realidades o seres de ambos ámbitos, pero se señala la ambigüedad en nota debido a que la revisión griega está pendiente.
theological_decisions:
- issue: Relación entre la reunión frecuente y la derrota de los poderes de Satanás
  choice: Conservar la afirmación causal tal como aparece en el testimonio
  alternative: Atenuarla como simple ánimo comunitario o efecto simbólico
  rationale: El pasaje presenta la reunión concorde de la comunidad como aquello ante lo cual las fuerzas satánicas caen; suavizarlo eliminaría su tensión teológica.
- issue: Sentido sacramental de «thanksgiving»
  choice: Traducir «dar gracias»
  alternative: Traducir «celebrar la Eucaristía»
  rationale: Aunque el término griego subyacente podría tener asociaciones eucarísticas, el material suministrado no permite fijar aquí ese sentido técnico sin revisión directa de la fuente.
- issue: Alcance de la paz que abole la guerra
  choice: Mantener una formulación cósmica amplia
  alternative: Limitarla a los conflictos dentro de la iglesia
  rationale: El contraste entre lo celestial y lo terrenal rebasa expresamente el ámbito de una comunidad local.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se conserva la exhortación comunitaria. El borrador es necesariamente provisional porque el material proporcionado identifica como base inmediata un testimonio inglés de dominio público y señala que la revisión del griego de la recensión media está pendiente.
