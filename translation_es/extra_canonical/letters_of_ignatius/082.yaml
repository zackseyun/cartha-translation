base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: es
  text: 'Que nadie se engañe. Aun los seres celestiales, la gloria de los ángeles y los gobernantes visibles e invisibles, si no creen en la sangre de Cristo [que es Dios],[a] también tendrán que afrontar el juicio. Quien pueda recibir esto, que lo reciba. Que nadie se enorgullezca por su cargo, pues la fe y el amor lo son todo, y nada tiene prioridad sobre ellos.


    Observen a quienes sostienen doctrinas extrañas acerca de la gracia de Jesucristo que vino a nosotros, y vean cuán contrarios son al pensamiento de Dios. No se preocupan por el amor, ni por la viuda, ni por el huérfano, ni por el afligido, ni por el encarcelado, ni por quien tiene hambre o sed. Se abstienen de la eucaristía[b] y de la oración porque no reconocen que la eucaristía es la carne de nuestro Salvador Jesucristo, la cual sufrió por nuestros pecados y el Padre, por su bondad, resucitó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «que es Dios» se conserva entre corchetes porque así aparece señalada en el testimonio suministrado; puede representar una restauración o una cuestión de transmisión textual. Se requiere revisión directa de la tradición manuscrita griega.
    reason: Preservar la señal textual y no ocultar la incertidumbre de la base disponible.
  - marker: b
    text: «Eucaristía» procede del griego y significa «acción de gracias». Aquí designa la celebración cristiana mencionada por Ignacio.
    reason: Conservar el término histórico y explicar su sentido para lectores modernos.
lexical_decisions:
- source_word: office
  choice: cargo
  rationale: Expresa una posición o función de autoridad sin limitarla a un oficio eclesiástico específico.
- source_word: faith and love are all in all
  choice: la fe y el amor lo son todo
  rationale: Conserva la fuerza totalizadora del testimonio inglés en un español natural, sin añadir una interpretación doctrinal.
- source_word: mind of God
  choice: pensamiento de Dios
  rationale: Mantiene el sentido de disposición o manera de pensar sin confundirlo con una referencia anatómica.
- source_word: eucharist (thanksgiving)
  choice: eucaristía
  rationale: Conserva el término histórico; su sentido etimológico de acción de gracias se aclara en nota.
- source_word: allow not / acknowledge
  choice: no reconocen
  rationale: Comunica que los aludidos no admiten la afirmación sobre la eucaristía, sin sugerir mera ignorancia.
theological_decisions:
- issue: La frase «who is God» aparece entre corchetes en el testimonio suministrado.
  choice: Conservar «[que es Dios]» y añadir una nota cautelar.
  alternative: Integrarla sin corchetes u omitirla.
  rationale: Los corchetes señalan incertidumbre o restauración textual; conservarlos evita presentar como indisputada una lectura cuya revisión griega está pendiente.
- issue: Sentido de «He that receiveth let him receive».
  choice: «Quien pueda recibir esto, que lo reciba».
  alternative: «El que recibe, que reciba».
  rationale: La formulación elegida resulta comprensible y conserva el carácter exhortativo, aunque la base inglesa no permite resolver plenamente la alusión.
- issue: Identificación de la eucaristía con la carne sufriente y resucitada de Cristo.
  choice: Traducir la afirmación de forma directa, sin parafrasearla ni armonizarla con una tradición posterior.
  alternative: Explicarla como símbolo, presencia sacramental u otra formulación confesional.
  rationale: El pasaje formula explícitamente la afirmación; añadir una teoría posterior resolvería indebidamente su tensión teológica.
- issue: Agente de la resurrección.
  choice: «el Padre, por su bondad, resucitó» la carne.
  alternative: «la carne resucitó» o «fue resucitada».
  rationale: Mantiene al Padre como agente y su bondad como motivación, conforme al testimonio suministrado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitan arcaísmos como «ningún hombre» y tecnicismos innecesarios. Debido a que la revisión directa del griego está pendiente, el borrador sigue cautelosamente el testimonio público inglés proporcionado y no pretende zanjar ambigüedades textuales o sintácticas que ese testimonio no permite resolver.
