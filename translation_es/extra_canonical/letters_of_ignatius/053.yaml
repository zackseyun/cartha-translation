review_pass:
  verdict: revise
  source_fidelity: Se requiere corrección. El borrador conserva bien la estructura acumulativa, la repetición de la presidencia y las dos referencias a «Jesucristo, nuestro Dios». Sin embargo, «digna en pureza» no representa adecuadamente el participio de purificación de la tradición griega media; «purificada» sí. Además, el cierre debe ser un saludo singular, y la imagen de la eliminación de todo «color» o matiz ajeno conviene conservarla en vez de reducirla a una «mancha».
  naturalness: El español es generalmente digno y comprensible, pero «en irreprochabilidad» es una abstracción poco idiomática y «digna en pureza» resulta antinatural. «De manera irreprochable» conserva prudentemente la función adverbial del cierre. Se ajustan también algunas expresiones para que el largo saludo se lea con fluidez sin deshacer su sintaxis retórica.
  terminology: Se mantienen «Teóforo», «Jesucristo, nuestro Dios», «preside en el amor», «ley de Cristo» y el posesivo ambiguo en «sus mandamientos». «Purificada» refleja la terminología de pureza del texto; «coloración extraña» retiene la imagen cromática y figurada, sin identificar qué clase de influencia externa se pretende indicar.
  issues:
  - severity: medium
    issue: «digna en pureza»
    rationale: La formulación no es español natural y trata como otro miembro de la serie de «digna de» lo que en la tradición griega corresponde a una caracterización de haber sido purificada. «Purificada» es más fiel y claro.
  - severity: medium
    issue: «mancha ajena»
    rationale: La fuente griega emplea la imagen de un color o matiz ajeno; «mancha» generaliza esa imagen. «Coloración extraña» conserva la metáfora sin explicarla doctrinalmente.
  - severity: low
    issue: «abundantes saludos» e «en irreprochabilidad»
    rationale: El testimonio tiene saludo en singular y el sustantivo español «irreprochabilidad» es innecesariamente forzado. Se usa «abundante saludo» y «de manera irreprochable».
  - severity: low
    issue: «quiso que existiera todo cuanto existe»
    rationale: La construcción causativa añade un matiz que no es necesario. «Quiso todas las cosas que existen» sigue más de cerca la formulación transmitida.
  revised_text: 'Ignacio, llamado también Teóforo, a la iglesia que ha recibido misericordia en la generosidad del Padre Altísimo y de Jesucristo, su único Hijo; a la iglesia amada e iluminada por la voluntad de aquel que quiso todas las cosas que existen, por medio de la fe y el amor hacia Jesucristo, nuestro Dios; a la iglesia que preside en el territorio de los romanos, digna de Dios, digna de honor, digna de felicitación, digna de alabanza, digna de éxito, purificada y que preside en el amor; que camina conforme a la ley de Cristo y lleva el nombre del Padre. A esta iglesia saludo también en el nombre de Jesucristo, el Hijo del Padre. A quienes, en carne y espíritu, están unidos a todos sus mandamientos, llenos de la gracia de Dios sin vacilar y depurados de toda coloración extraña: abundante saludo en Jesucristo, nuestro Dios, de manera irreprochable.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente el cotejo directo integral con la tradición manuscrita griega de la recensión media. Se han conservado deliberadamente la repetición de «preside» y la imagen de ser depurados de toda «coloración extraña».
    reason: La nota comunica el carácter provisional indicado por la ficha de la fuente y advierte al lector de dos expresiones deliberadamente no interpretadas.
  revision_rationale: La revisión corrige puntos de fidelidad y de español idiomático sin resolver cuestiones históricas o eclesiológicas debatidas. Mantiene la ambigüedad del referente de «sus mandamientos», la doble designación cristológica y la repetición de la presidencia. La sustitución de «mancha» por «coloración» recupera una imagen significativa de la fuente, y «purificada» corrige la caracterización que el borrador había convertido impropiamente en «digna en pureza».
