review_pass:
  verdict: revise
  source_fidelity: La versión conserva adecuadamente la estructura encomiástica, las dos referencias explícitas a «Jesucristo, nuestro Dios», la repetición de «preside» y la indeterminación de «sus mandamientos». Sin embargo, «abundantes saludos» cambia el saludo singular del testimonio («abundant greeting»), y «que quiso que existiera todo cuanto existe» introduce una relación verbal algo más explicativa que «quiso todas las cosas que existen».
  naturalness: 'El período es comprensible y mantiene un registro epistolar digno. Se mejora la naturalidad sin modernizar ni resolver expresiones deliberadamente difíciles: «todo lo que existe» evita la perífrasis añadida; «un saludo abundante» conserva el singular; «sin reproche» resulta más idiomático que «en irreprochabilidad» y mantiene el sentido abstracto sin especificar una cualidad doctrinal.'
  terminology: «Teóforo», «preside», «felicitación», «éxito», «ley de Cristo», «nombre del Padre» y «mancha ajena» son opciones defendibles y prudentes en una traducción provisional. Se conserva «Jesucristo, nuestro Dios» sin atenuación. «Sin reproche» reemplaza el neologismo poco natural «en irreprochabilidad», sin imponer una interpretación confesional.
  issues:
  - severity: medium
    issue: 'El saludo final se vuelve plural: «abundantes saludos».'
    rationale: El testimonio inglés tiene «abundant greeting», en singular. «Un saludo abundante» conserva tanto el número como la fórmula epistolar.
  - severity: low
    issue: «Que quiso que existiera todo cuanto existe» explicita la construcción de manera innecesaria.
    rationale: «Him who willed all things that are» puede reproducirse con mayor cercanía como «quien quiso todas las cosas que existen» o «quien quiso todo lo que existe», sin añadir la subordinación de existencia.
  - severity: low
    issue: «En irreprochabilidad» es un calco abstracto poco natural en español actual.
    rationale: «Sin reproche» mantiene la amplitud de «in blamelessness» y ofrece una formulación española clara, sin decidir si la expresión califica al saludo, a los destinatarios o a su condición.
  revised_text: 'Ignacio, llamado también Teóforo, a la iglesia que ha alcanzado misericordia en la generosidad del Padre Altísimo y de Jesucristo, su único Hijo; a la iglesia amada e iluminada por la voluntad de quien quiso todo lo que existe, mediante la fe y el amor a Jesucristo, nuestro Dios; a la iglesia que preside en el territorio de la región de los romanos, digna de Dios, digna de honor, digna de felicitación, digna de alabanza, digna de éxito, digna en pureza y que preside en el amor; que vive conforme a la ley de Cristo y lleva el nombre del Padre. A esta iglesia saludo también en el nombre de Jesucristo, el Hijo del Padre. A quienes, en carne y espíritu, están unidos a cada uno de sus mandamientos, llenos de la gracia de Dios sin vacilar y depurados de toda mancha ajena: un saludo abundante en Jesucristo, nuestro Dios, sin reproche.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente el cotejo directo con la tradición manuscrita griega de la recensión media. Se han conservado deliberadamente la repetición de «preside» y la imagen de quedar «depurados» de toda mancha ajena.
    reason: La ficha de la fuente indica que aún no se ha realizado la revisión directa del griego; la nota informa al lector y señala dos formulaciones cuya extrañeza es significativa.
  revision_rationale: 'Se realizan solo correcciones seguras frente al testimonio suministrado: se restituye el singular del saludo, se evita una expansión verbal en la cláusula sobre la voluntad creadora y se sustituye un abstracto español forzado por una expresión natural de alcance semántico comparable. Se mantienen las formulaciones históricamente o textualmente discutibles sin interpretarlas. Dado que el cotejo directo con el griego de la recensión media sigue pendiente, la revisión permanece provisional.'
