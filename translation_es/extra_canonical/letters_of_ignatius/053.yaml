base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: es
  text: 'Ignacio, llamado también Teóforo, a la iglesia que ha alcanzado misericordia en la generosidad del Padre Altísimo y de Jesucristo, su único Hijo; a la iglesia amada e iluminada por la voluntad de aquel que quiso que existiera todo cuanto existe, mediante la fe y el amor a Jesucristo, nuestro Dios; a la iglesia que preside en el territorio de la región de los romanos, digna de Dios, digna de honor, digna de felicitación, digna de alabanza, digna de éxito, digna en pureza y que preside en el amor; que vive conforme a la ley de Cristo y lleva el nombre del Padre. A esta iglesia saludo también en el nombre de Jesucristo, el Hijo del Padre. A quienes, en carne y espíritu, están unidos a cada uno de sus mandamientos, llenos de la gracia de Dios sin vacilar y depurados de toda mancha ajena: abundantes saludos en Jesucristo, nuestro Dios, en irreprochabilidad.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente el cotejo directo con la tradición manuscrita griega de la recensión media. Se han conservado deliberadamente la repetición de «preside» y la imagen de quedar «depurados» de toda mancha ajena.
    reason: La ficha de la fuente indica que aún no se ha realizado la revisión directa del griego; la nota informa al lector y señala dos formulaciones cuya extrañeza es significativa.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Se translitera el sobrenombre tradicional sin explicarlo, pues puede entenderse de más de una manera y la evidencia griega aún está pendiente de revisión directa.
- source_word: hath the presidency / having the presidency
  choice: preside / preside
  rationale: Se conserva la repetición y la amplitud de la expresión, sin reducirla a una estructura eclesiástica concreta.
- source_word: filtered clear
  choice: depurados
  rationale: Expresa la imagen de quedar limpios de elementos extraños de manera natural en español, sin añadir una interpretación doctrinal.
- source_word: foreign stain
  choice: mancha ajena
  rationale: Mantiene el carácter figurado y la idea de algo extraño o externo, en vez de especificar qué contaminación se contempla.
- source_word: felicitation
  choice: felicitación
  rationale: Conserva la serie retórica de cualidades y evita confundir este término con felicidad o bienaventuranza.
- source_word: success
  choice: éxito
  rationale: Traducción provisional cercana al testimonio inglés; la precisión del término requiere cotejo directo con el griego.
- source_word: in blamelessness
  choice: en irreprochabilidad
  rationale: Mantiene la construcción abstracta y su posible vínculo con el saludo o con la condición de los destinatarios.
theological_decisions:
- issue: La expresión «Jesucristo, nuestro Dios»
  choice: Se conserva explícitamente en sus dos apariciones.
  alternative: Atenuarla como «nuestro Señor Jesucristo» o vincular «Dios» solo con el Padre.
  rationale: El testimonio suministrado atribuye de forma directa este título a Jesucristo; modificarlo resolvería indebidamente la formulación cristológica.
- issue: El alcance de «preside en el amor»
  choice: Se traduce literalmente, sin explicar el tipo ni la extensión de esa presidencia.
  alternative: Interpretarlo como primacía jurídica, precedencia honorífica o liderazgo caritativo.
  rationale: La frase admite discusión histórica y eclesiológica; la traducción no debe incorporar una postura denominacional.
- issue: El referente de «sus mandamientos»
  choice: Se mantiene el pronombre posesivo sin sustituirlo por un nombre.
  alternative: Explicitar «los mandamientos de Cristo» o «los mandamientos de Dios».
  rationale: El período tiene varios antecedentes posibles y conviene preservar la referencia pronominal del testimonio mientras esté pendiente la revisión del griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el largo período epistolar y su acumulación retórica, pero se divide con punto para facilitar la lectura. «Iglesia» se escribe con minúscula como comunidad local. No se interpreta «Teóforo» ni se asigna contenido institucional específico a «preside». Dado que solo se suministró un testimonio inglés y la revisión griega está pendiente, varias decisiones léxicas se consideran provisionales.
