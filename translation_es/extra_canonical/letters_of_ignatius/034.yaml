base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: es
  text: Digo estas cosas, mis muy amados, no porque me haya enterado de que alguno de ustedes piense así. Más bien, puesto que soy inferior a cualquiera de ustedes, quiero que estén alerta desde ahora, para que no caigan en las trampas de una enseñanza vacía. Al contrario, estén plenamente convencidos del nacimiento, el padecimiento y la resurrección que tuvieron lugar durante el gobierno de Poncio Pilato. Pues estas cosas fueron realizadas verdadera y ciertamente por Jesucristo, nuestra esperanza. Que ninguno de ustedes se aparte de esta esperanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente el cotejo directo con la tradición manuscrita griega de la recensión media.
    reason: La fuente suministrada indica expresamente que la revisión del griego está pendiente; la nota hace transparente la base textual y evita presentar como definitiva una traducción indirecta.
lexical_decisions:
- source_word: my dearly beloved
  choice: mis muy amados
  rationale: Conserva el afecto intenso y el tono epistolar con una expresión digna y natural en español.
- source_word: being less than any of you
  choice: puesto que soy inferior a cualquiera de ustedes
  rationale: Mantiene la autohumillación comparativa del testimonio sin reinterpretarla como edad, rango o mérito específico.
- source_word: be on your guard betimes
  choice: estén alerta desde ahora
  rationale: Comunica tanto la vigilancia como su carácter oportuno o preventivo en lenguaje actual.
- source_word: snares of vain doctrine
  choice: las trampas de una enseñanza vacía
  rationale: «Trampas» preserva la imagen de peligro; «enseñanza vacía» expresa falta de verdad o sustancia sin añadir una etiqueta confesional.
- source_word: the passion
  choice: el padecimiento
  rationale: Conserva la referencia tradicional a los sufrimientos de Jesús, pero con una palabra comprensible en el español latinoamericano actual.
- source_word: were truly and certainly done by Jesus Christ
  choice: fueron realizadas verdadera y ciertamente por Jesucristo
  rationale: Retiene la doble afirmación enfática y la atribución explícita a Jesucristo, aunque el giro depende por ahora del testimonio inglés.
- source_word: our hope
  choice: nuestra esperanza
  rationale: Mantiene la identificación directa de Jesucristo como esperanza de la comunidad.
theological_decisions:
- issue: Historicidad del nacimiento, padecimiento y resurrección
  choice: Presentarlos como acontecimientos que tuvieron lugar durante el gobierno de Poncio Pilato y que fueron realizados verdadera y ciertamente por Jesucristo.
  alternative: Entender que solo el padecimiento y la resurrección quedan situados cronológicamente bajo Poncio Pilato.
  rationale: La sintaxis del testimonio inglés vincula el relativo con la serie completa. No se corrige silenciosamente la posible tensión cronológica; se deja constancia de que falta cotejo directo con el griego.
- issue: Referente de la esperanza final
  choice: «esta esperanza», referida a Jesucristo, nuestra esperanza.
  alternative: Referirla al conjunto de convicciones sobre el nacimiento, el padecimiento y la resurrección.
  rationale: El antecedente inmediato es «Jesucristo, nuestra esperanza», pero la construcción también evoca la confesión precedente; la traducción conserva esa amplitud contextual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y se conserva el tono afectuoso, exhortativo y preventivo. La formulación procura seguir de cerca el testimonio disponible sin suavizar su énfasis histórico ni resolver ambigüedades antes del cotejo griego.
