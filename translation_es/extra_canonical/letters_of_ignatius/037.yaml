base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: es
  text: Sabiendo que están llenos de Dios, los he exhortado brevemente. Recuérdenme en sus oraciones, para que llegue hasta Dios. Recuerden también a la iglesia que está en Siria, de la cual no soy digno de ser llamado miembro. Porque necesito su oración unida y su amor en Dios, a fin de que se le conceda a la iglesia que está en Siria ser reconfortada por el rocío de su ferviente súplica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La ficha de la fuente indica que aún no se ha realizado la revisión en la lengua original, por lo que debe transparentarse la base textual limitada.
lexical_decisions:
- source_word: full of God
  choice: llenos de Dios
  rationale: Conserva de manera directa la imagen teológica del testimonio sin explicarla ni reducirla a una cualidad más genérica.
- source_word: exhorted
  choice: exhortado
  rationale: Mantiene el matiz de llamado y ánimo pastoral, con un término digno y comprensible.
- source_word: attain unto God
  choice: llegue hasta Dios
  rationale: Preserva la formulación direccional y su tensión martirial sin explicitar una interpretación ausente del testimonio.
- source_word: united prayer
  choice: oración unida
  rationale: Expresa la oración común o concorde de los destinatarios sin añadir vocabulario eclesiástico técnico.
- source_word: refreshed by the dew
  choice: ser reconfortada por el rocío
  rationale: Retiene la metáfora del rocío y comunica su efecto vivificante de forma natural en español.
- source_word: fervent supplication
  choice: ferviente súplica
  rationale: Distingue la petición intensa de la referencia más general a la oración y conserva el tono elevado.
theological_decisions:
- issue: Sentido de «llegar hasta Dios»
  choice: Mantener «para que llegue hasta Dios»
  alternative: «para que alcance a Dios» o explicitar «mediante el martirio»
  rationale: El testimonio suministrado no explicita aquí el martirio. La versión conserva la ambigüedad y evita imponer una interpretación.
- issue: Imagen de estar «llenos de Dios»
  choice: Traducir literalmente la imagen
  alternative: «colmados de la presencia de Dios»
  rationale: La expansión interpretativa podría resolver indebidamente qué significa estar llenos de Dios.
- issue: Relación del autor con la iglesia de Siria
  choice: «de la cual no soy digno de ser llamado miembro»
  alternative: «a la que no soy digno de pertenecer»
  rationale: La opción elegida conserva la forma declarativa y la autodescripción de indignidad del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» implícito en las formas verbales y posesivas. Se conservan las imágenes «llenos de Dios» y «rocío», así como la ambigüedad de «llegar hasta Dios». Dado que la revisión del griego está pendiente, el texto evita decisiones que dependan de matices no verificables en el testimonio inglés.
