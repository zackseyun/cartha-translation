    reason: La ficha de la fuente indica que aún no se ha realizado la revisión en la lengua original, por lo que debe transparentarse la base textual limitada.
  revision_rationale: 'Se hacen únicamente dos ajustes estilísticos seguros: «llegue a Dios» y «ser refrescada por el rocío». Ambos mejoran la naturalidad y la correspondencia verbal con el testimonio inglés, sin resolver ambigüedades textuales ni añadir interpretación teológica.'
