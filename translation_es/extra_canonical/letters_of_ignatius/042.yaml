base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: es
  text: 'Del mismo modo, que todos respeten a los diáconos como a Jesucristo; al obispo, como figura del Padre; y a los presbíteros, como al consejo de Dios y vínculo de los apóstoles. Sin ellos, no se da el nombre de iglesia.


    Estoy convencido de que ustedes también piensan así acerca de estas cosas, pues he recibido el ejemplo del amor de ustedes y lo tengo conmigo en la persona de su obispo. Su porte mismo es una gran lección, y su mansedumbre es poder. Considero que hasta los que no creen en Dios lo respetan.


    Como los amo, los trato con consideración, aunque podría escribir con mayor severidad acerca de esto.[a] Pero no me consideré competente para hacerlo: siendo un condenado, no debía darles órdenes como si fuera un apóstol.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «con mayor severidad en favor de él». El referente puede ser el asunto tratado o el obispo.'
    reason: Conserva la ambigüedad de τούτου, mientras que la tradición inglesa suministrada lo entiende como una referencia al obispo.
lexical_decisions:
- source_word: διάκονοι
  choice: diáconos
  rationale: Conserva el término ministerial histórico y es comprensible en el español cristiano actual.
- source_word: τύπον τοῦ πατρός
  choice: figura del Padre
  rationale: «Figura» mantiene la idea representativa de τύπος sin identificar al obispo con el Padre.
- source_word: συνέδριον θεοῦ
  choice: consejo de Dios
  rationale: Refleja una asamblea deliberativa o consejo, de acuerdo con el sentido institucional de συνέδριον.
- source_word: σύνδεσμον ἀποστόλων
  choice: corporación de los apóstoles
  rationale: Expresa un cuerpo unido o colegiado sin reducir σύνδεσμος a un mero lugar de reunión; el giro admite matices como «colegio» o «cuerpo».
- source_word: ἐκκλησία οὐ καλεῖται
  choice: nada recibe el nombre de iglesia
  rationale: Conserva la formulación enfática sobre ser llamado «iglesia», sin convertirla innecesariamente en una definición ontológica más absoluta.
- source_word: κατάστημα
  choice: conducta
  rationale: En este contexto alude al porte, comportamiento o manera de vivir del obispo; «conducta» es natural y digna.
- source_word: πραότης
  choice: mansedumbre
  rationale: Mantiene el valor ético de una fuerza gobernada y apacible; «amabilidad» sería más débil.
- source_word: κατάκριτος
  choice: condenado
  rationale: Describe la condición de Ignacio bajo sentencia; evita el posible sentido moderno de «convicto» como preso declarado culpable de un delito común.
theological_decisions:
- issue: Comparación del respeto debido a diáconos, obispo y presbíteros
  choice: 'Mantener literalmente las comparaciones: «como a Jesucristo», «figura del Padre» y «consejo de Dios»'
  alternative: Atenuar con expresiones como «representantes de» o «en nombre de»
  rationale: El texto presenta comparaciones eclesiológicas fuertes. Atenuarlas resolvería una tensión teológica que el original deja al lector.
- issue: Condición para recibir el nombre de iglesia
  choice: «Sin ellos, nada recibe el nombre de iglesia»
  alternative: «Sin ellos no hay iglesia»
  rationale: La opción elegida conserva el énfasis del verbo «llamar» y evita ampliar la afirmación más allá de su forma textual.
- issue: Autoridad de Ignacio frente a la apostólica
  choice: «no iba a darles órdenes como si fuera apóstol»
  alternative: «no soy competente para mandarles como un apóstol»
  rationale: Mantiene la autolimitación explícita de Ignacio y no le atribuye rango apostólico.
- issue: Referente de τούτου en la frase sobre escribir con severidad
  choice: «acerca de esto»
  alternative: «en favor de él» o «por causa de él»
  rationale: El pronombre griego puede remitir al asunto tratado o al obispo; la traducción no fija de manera indebida un referente personal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean «ustedes» y formas verbales correspondientes. El borrador se ha cotejado con la formulación griega conocida de la recensión media, aunque los metadatos del encargo indican que la revisión formal directa de la fuente griega sigue pendiente; por ello se evitan decisiones excesivamente estrechas donde existe ambigüedad.
