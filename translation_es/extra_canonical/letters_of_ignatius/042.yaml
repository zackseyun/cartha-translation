source:
  text: 'In like manner let all men respect the deacons as Jesus Christ, even as they should respect the bishop as being a type of the Father and the presbyters as the council of God and as the college of Apostles. Apart from these there is not even the name of a church.


    And I am persuaded that ye are so minded as touching these matters: for I received the ensample of your love, and I have it with me, in the person of your bishop, whose very demeanor is a great lesson, while his gentleness is power--a man to whom I think even the godless pay reverence.


    Seeing that I love you I thus spare you, though I might write more sharply on his behalf: but I did not think myself competent for this, that being a convict I should order you as though I were an Apostle.'
