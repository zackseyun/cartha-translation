base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: es
  text: 'Ignacio, llamado también Teóforo, a la que ha sido grandemente bendecida por la plenitud de Dios Padre; destinada de antemano, antes de los siglos, a permanecer para siempre en una gloria duradera e inmutable; unida y elegida en una pasión verdadera por la voluntad del Padre y de Jesucristo, nuestro Dios; es decir, a la iglesia que está en Éfeso [de Asia], digna de toda felicitación: abundantes saludos en Cristo Jesús y en una alegría irreprochable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Se conserva como nombre o título transliterado, sin imponer una interpretación como «portador de Dios» o «llevado por Dios».
- source_word: plentitude / πλήρωμα
  choice: plenitud
  rationale: Mantiene la amplitud y posible resonancia teológica del término sin reducirlo a «abundancia».
- source_word: foreordained
  choice: destinada de antemano
  rationale: Expresa la anterioridad de la determinación sin introducir terminología confesional más técnica.
- source_word: true passion
  choice: una pasión verdadera
  rationale: Conserva la referencia probable a la pasión de Cristo y su énfasis en que fue real, sin explicitar más de lo que permite el testimonio suministrado.
- source_word: church
  choice: iglesia
  rationale: Es la equivalencia natural y ampliamente comprensible para la comunidad cristiana destinataria.
- source_word: felicitation
  choice: felicitación
  rationale: Conserva el sentido laudatorio del saludo, aunque la construcción es poco común, en espera de cotejo directo con el griego.
- source_word: blameless joy
  choice: alegría irreprochable
  rationale: Reproduce el matiz moral del adjetivo sin parafrasearlo como alegría «pura».
theological_decisions:
- issue: La designación «Jesucristo, nuestro Dios»
  choice: Jesucristo, nuestro Dios
  alternative: Jesucristo nuestro Dios / Dios, Jesucristo nuestro
  rationale: Se conserva de manera directa la alta afirmación cristológica presente en el testimonio, sin atenuarla ni ampliarla.
- issue: La unión y elección «en una pasión verdadera»
  choice: unida y elegida en una pasión verdadera
  alternative: unida y escogida por la verdadera pasión
  rationale: Se mantiene la relación preposicional y su ambigüedad, sin decidir si la pasión es esfera, fundamento o medio de la unión y elección.
- issue: Predestinación de la iglesia
  choice: destinada de antemano, antes de los siglos
  alternative: predestinada desde antes de los siglos
  rationale: Transmite la afirmación temporal y teológica evitando cargarla con asociaciones doctrinales posteriores que el contexto no desarrolla.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la estructura solemne y extensa del saludo, pero se organiza con punto y coma para facilitar la lectura. Los corchetes en «[de Asia]» preservan la señal editorial del testimonio inglés. Este borrador es necesariamente provisional porque no se proporcionó el texto griego y la revisión directa de la lengua fuente está pendiente.
