review_pass:
  verdict: revise
  source_fidelity: La traducción conserva adecuadamente el destinatario eclesial, la designación «Jesucristo nuestro Dios», la anterioridad «antes de los siglos», y los corchetes editoriales en «[de Asia]». Sin embargo, «a permanecer para siempre en una gloria» vuelve más interpretativa la secuencia «to be forever and unto abiding and unchangeable glory»; conviene preservar la idea de existencia/permanencia eterna y la gloria como destino o condición. «Abundantes saludos» pluraliza el singular epistolar «abundant greeting».
  naturalness: El registro es mayormente digno y comprensible. «Digna de toda felicitación» es posible, aunque deliberadamente elevado y algo poco frecuente; es preferible mantenerlo por su proximidad al testimonio. «Pasión verdadera» puede leerse en español moderno como fervor o entusiasmo, pero en este contexto cristiano solemne puede conservarse; la mayúscula en «Pasión» ayuda a señalar, sin explicarla, su probable referencia cristológica.
  terminology: «Teóforo», «plenitud», «iglesia», «Jesucristo nuestro Dios» y «alegría irreprochable» son opciones apropiadas. Se conserva «destinada de antemano» como formulación no confesionalmente cargada. Se ajusta «pasión» a «Pasión» solo para evitar una lectura contemporánea impropia, sin resolver la ambigüedad sintáctica o teológica del original.
  issues:
  - severity: medium
    issue: «a permanecer para siempre en una gloria duradera e inmutable»
    rationale: La redacción transforma «to be forever and unto abiding and unchangeable glory» en una sola idea de permanencia dentro de la gloria. «Ser para siempre, para gloria permanente e inmutable» refleja más de cerca la doble construcción, sin pretender resolver su sintaxis.
  - severity: low
    issue: «abundantes saludos»
    rationale: El testimonio inglés emplea singular («abundant greeting»). «Un saludo abundante» conserva el número y sigue siendo natural en una salutación antigua.
  - severity: low
    issue: «pasión verdadera» en minúscula
    rationale: En español actual, «pasión» puede sugerir principalmente entusiasmo. La mayúscula permite la lectura técnica cristiana probable sin añadir una glosa doctrinal.
  revised_text: 'Ignacio, llamado también Teóforo, a la que ha sido grandemente bendecida por la plenitud de Dios Padre; destinada de antemano, antes de los siglos, a ser para siempre, para gloria permanente e inmutable; unida y elegida en una Pasión verdadera, por la voluntad del Padre y de Jesucristo nuestro Dios; es decir, a la iglesia que está en Éfeso [de Asia], digna de toda felicitación: un saludo abundante en Cristo Jesús y en una alegría irreprochable.'
  revised_footnotes: []
  revision_rationale: Se efectúan correcciones limitadas para reflejar con mayor precisión la estructura temporal y final de la salutación, mantener el singular de «greeting» y evitar una lectura moderna inadecuada de «pasión». Dado que solo se suministra un testimonio inglés y el cotejo griego está pendiente, se mantienen las ambigüedades de «unida y elegida en una Pasión verdadera» y no se introducen interpretaciones doctrinales.
