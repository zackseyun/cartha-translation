base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: es
  text: 'Por esta razón el Señor recibió ungüento sobre la cabeza: para infundir incorrupción en la Iglesia. No se dejen ungir con el mal olor de la enseñanza del príncipe de este mundo, no sea que los lleve cautivos y los prive de la vida que tienen por delante.


    ¿Por qué no vivimos todos con sabiduría, recibiendo el conocimiento de Dios, que es Jesucristo? ¿Por qué perecemos en nuestra necedad, sin reconocer el don de la gracia que el Señor verdaderamente ha enviado?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La fuente proporcionada señala expresamente que aún no se ha realizado la revisión del griego; la nota hace transparente el fundamento textual de este borrador.
lexical_decisions:
- source_word: ointment (Greek review pending)
  choice: ungüento
  rationale: Conserva la imagen concreta de la unción y su contraste con el mal olor de la enseñanza.
- source_word: breathe ... upon (Greek review pending)
  choice: infundir
  rationale: Expresa en español natural la acción de comunicar o soplar sobre la Iglesia, sin reducir la imagen a una explicación doctrinal.
- source_word: incorruption (Greek review pending)
  choice: incorrupción
  rationale: Mantiene el término teológicamente amplio, que puede abarcar ausencia de corrupción, imperecibilidad e inmortalidad.
- source_word: walk prudently (Greek review pending)
  choice: vivimos ... con sabiduría
  rationale: Traduce el modismo de caminar como conducta vital en lenguaje actual y conserva la idea de proceder sabiamente.
- source_word: knowledge of God (Greek review pending)
  choice: conocimiento de Dios
  rationale: Preserva tanto el contenido del conocimiento como la posible identificación posterior con Jesucristo.
- source_word: not knowing (Greek review pending)
  choice: sin reconocer
  rationale: En este contexto, comunica la falta de comprensión o aprecio del don, evitando sugerir únicamente ignorancia informativa.
theological_decisions:
- issue: La relación entre «el conocimiento de Dios» y «Jesucristo»
  choice: «el conocimiento de Dios, que es Jesucristo»
  alternative: «el conocimiento de Dios que viene por medio de Jesucristo»
  rationale: Se conserva la identificación directa del testimonio suministrado, sin convertirla en una relación instrumental.
- issue: Sentido de «incorrupción»
  choice: Mantener «incorrupción» sin glosa en el texto
  alternative: «inmortalidad» o «vida imperecedera»
  rationale: El término conserva una amplitud teológica que una equivalencia más específica resolvería prematuramente.
- issue: Agente implícito de «ha enviado»
  choice: Conservar como sujeto a «el Señor» sin precisar el referente del don
  alternative: Explicitar que el don enviado es Jesucristo
  rationale: La sintaxis del testimonio permite relacionar el don con Jesucristo, pero no conviene imponer esa identificación sin revisión directa del griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» implícito en las formas verbales plurales. Se conserva la imaginería de unción, olor, cautiverio e incorrupción, evitando arcaísmos y desarrollos confesionales.
