revisions:
- from: 'Si Jesucristo, por medio de la oración de ustedes, me considera digno, y si esa es la voluntad de Dios, en el segundo escrito que pienso dirigirles les expondré con más detalle el plan[a] que he comenzado a explicar acerca del nuevo hombre, Jesucristo: la fe en él y el amor a él, su pasión y su resurrección, especialmente si el Señor me revela algo.


    Reúnanse todos en común, cada uno de ustedes, persona por persona, en la gracia, en una sola fe y en un solo Jesucristo, quien, según la carne, era del linaje de David; él es Hijo del Hombre e Hijo de Dios. Así podrán obedecer al obispo y al presbiterio sin una mente dividida, mientras parten un solo pan, que es medicina de inmortalidad y antídoto para no morir, sino vivir para siempre en Jesucristo.'
  to: 'Si Jesucristo me considera digno por medio de la oración de ustedes, y si es la voluntad de Dios, en el segundo escrito que pienso dirigirles les expondré con más detalle el plan[a] del que he comenzado a hablar, acerca del nuevo hombre, Jesucristo: su fe y su amor, su pasión y su resurrección; sobre todo, si el Señor me revela algo.


    Reúnanse todos en común, cada uno personalmente, en la gracia, en una sola fe y en un solo Jesucristo, que según la carne procede del linaje de David, Hijo del Hombre e Hijo de Dios, para que obedezcan al obispo y al presbiterio sin distracción de mente, al partir un solo pan, que es medicina de inmortalidad y antídoto para no morir, sino vivir para siempre en Jesucristo.'
  rationale: La revisión se acerca al texto griego de la recensión media y mantiene el tono exhortativo del testimonio inglés. Corrige la finalidad de la obediencia, preserva la ambigüedad sintáctica relevante en «fe» y «amor», y actualiza la nota para que describa el término griego. No se añade interpretación sacramental ni eclesiológica más allá de las afirmaciones del pasaje.
