    especially if the Lord should reveal aught to me. Assemble yourselves together in common, every one of you severally, man by man, in grace, in one faith and one Jesus Christ, who after the flesh was of David''s race, who is Son of Man and Son of God, to the end that ye may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live for ever in Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: es
  text: 'Si Jesucristo me considera digno por medio de la oración de ustedes, y si es la voluntad de Dios, en el segundo escrito que pienso dirigirles les expondré con más detalle el plan[a] del que he comenzado a hablar, acerca del nuevo hombre, Jesucristo: su fe y su amor, su pasión y su resurrección; sobre todo, si el Señor me revela algo.


    Reúnanse todos en común, cada uno personalmente, en la gracia, en una sola fe y en un solo Jesucristo, que según la carne procede del linaje de David, Hijo del Hombre e Hijo de Dios, para que obedezcan al obispo y al presbiterio sin distracción de mente, al partir un solo pan, que es medicina de inmortalidad y antídoto para no morir, sino vivir para siempre en Jesucristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Plan» traduce el griego οἰκονομία, término que puede referirse a un plan, ordenamiento o administración. En «su fe y su amor», los genitivos griegos pueden entenderse como fe y amor hacia Jesucristo o como fe y amor relacionados con él; la traducción conserva esa ambigüedad.
    reason: Documenta el margen semántico de οἰκονομία y evita resolver de manera unilateral la ambigüedad de los genitivos αὐτοῦ.
lexical_decisions:
- source_word: dispensation (Greek source review pending)
  choice: plan
  rationale: Comunica en español actual la idea de una disposición o plan divino sin usar el tecnicismo potencialmente confesional «dispensación». Se añade nota porque la revisión directa del griego está pendiente.
- source_word: passion
  choice: pasión
  rationale: Término cristiano histórico y ampliamente comprensible para los padecimientos y la muerte de Jesús; conserva el paralelismo con «resurrección».
- source_word: presbytery
  choice: presbiterio
  rationale: Conserva la referencia al cuerpo de presbíteros y evita sustituirla por una estructura eclesiástica moderna más específica.
- source_word: medicine of immortality
  choice: medicina de inmortalidad
  rationale: Mantiene intacta la metáfora fuerte del testimonio antiguo.
- source_word: antidote
  choice: antídoto
  rationale: Preserva la imagen medicinal y su vínculo con «medicina de inmortalidad».
theological_decisions:
- issue: Relación entre partir un solo pan y la vida eterna
  choice: Conservar la afirmación metafórica sin explicarla ni delimitar su mecanismo
  alternative: Interpretarla explícitamente como sacramental, simbólica o como garantía automática de inmortalidad
  rationale: El pasaje relaciona estrechamente el pan, la inmortalidad y la vida en Cristo, pero la traducción no debe imponer una explicación confesional que el texto aquí no desarrolla.
- issue: 'Cristología: linaje davídico, Hijo del Hombre e Hijo de Dios'
  choice: Mantener juntas y sin armonización explicativa las tres afirmaciones
  alternative: Reformularlas para definir técnicamente las naturalezas de Cristo
  rationale: La formulación conserva la tensión y plenitud cristológica del testimonio sin importar categorías doctrinales posteriores.
- issue: Obediencia al obispo y al presbiterio
  choice: Traducir directamente la exhortación institucional
  alternative: Generalizarla como obediencia a «los líderes»
  rationale: La especificidad histórica del texto es relevante y no debe diluirse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono exhortativo y la imaginería medicinal. «Sin una mente dividida» expresa de manera natural la ausencia de distracción o división interior. Dado que la revisión del griego está pendiente, el borrador se mantiene cercano al testimonio inglés público y señala la principal incertidumbre léxica.
