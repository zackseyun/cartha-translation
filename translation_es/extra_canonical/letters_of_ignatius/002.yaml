review_pass:
  verdict: revise
  source_fidelity: 'La versión conserva bien el sentido central del testimonio: la acogida del nombre de los efesios, la fe y el amor en Cristo, la imagen intensa de «la sangre de Dios», el traslado de Ignacio desde Siria en cadenas, su expectativa de luchar con las fieras en Roma, y la recepción de la comunidad en Onésimo. Sin embargo, «con el corazón encendido» cambia indebidamente el plural del texto («your hearts»), y «el Nombre que compartimos y de nuestra esperanza» distribuye de manera desigual el calificativo «common», que abarca tanto el Nombre como la esperanza.'
  naturalness: El español es claro, actual y de registro apropiado. «La obra que les es propia», «combatir contra las fieras» y «hombre de amor indescriptible» son formulaciones naturales. Se conserva la sintaxis elevada de la apertura sin volverla innecesariamente opaca.
  terminology: Se mantienen adecuadamente «Cristo Jesús», «Salvador», «discípulo», «obispo», «en la carne» y «la sangre de Dios». La nota sobre «la sangre de Dios» es sobria y no impone una resolución doctrinal. «Comunidad» es una contextualización razonable de «whole multitude» en esta carta, sin alterar el referente colectivo.
  issues:
  - severity: medium
    issue: Número gramatical en «con el corazón encendido».
    rationale: 'El testimonio dice «having your hearts kindled»; debe mantenerse el plural: «con sus corazones encendidos».'
  - severity: low
    issue: Alcance de «common» en «the common Name and hope».
    rationale: «El Nombre que compartimos y de nuestra esperanza» hace explícito «compartimos» solo para el Nombre y transforma la segunda coordinación en posesivo. «El Nombre y la esperanza comunes» conserva mejor la construcción y su amplitud.
  revised_text: 'Al recibir en Dios el nombre de ustedes, tan amado, que llevan por derecho natural, [con una mente recta y virtuosa], mediante la fe y el amor en Cristo Jesús, nuestro Salvador —como imitadores de Dios y con sus corazones encendidos en la sangre de Dios[a]—, cumplieron plenamente la obra que les es propia.


    Pues, cuando oyeron que yo venía desde Siria encadenado por causa del Nombre y la esperanza comunes, y que esperaba, gracias a las oraciones de ustedes, lograr combatir contra las fieras en Roma, para que, al lograrlo, pudiera ser discípulo, se apresuraron a visitarme.


    Así pues, en el nombre de Dios, he recibido a toda la comunidad de ustedes en la persona de Onésimo, hombre de amor indescriptible y, además, obispo de ustedes [en la carne]. Ruego que lo amen conforme a Jesucristo y que todos ustedes sean semejantes a él. Pues bendito es aquel que les concedió, como ustedes merecían, tener un obispo así.'
  revised_footnotes:
  - marker: a
    text: «La sangre de Dios» reproduce la expresión llamativa del testimonio antiguo. No se cambia por «la sangre de Cristo», a fin de conservar su fuerza y su tensión cristológica.
    reason: La frase puede sorprender al lector moderno y es teológicamente significativa; requiere aclaración sin alteración del texto.
  revision_rationale: Se corrige el plural exigido por el testimonio («corazones») y se restituye el alcance coordinado de «común» para el Nombre y la esperanza. No se resuelven los pasajes entre corchetes ni se sustituye la formulación cristológicamente intensa «la sangre de Dios».
