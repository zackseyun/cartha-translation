  text: 'While I welcomed in God [your] well beloved name, which ye bear by natural right, [in an upright and virtuous mind], by faith and love in Christ Jesus our Savior—being imitators of God, and having your hearts kindled in the blood of God, ye have perfectly fulfilled your congenial work—


