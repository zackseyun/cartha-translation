translation:
  language: es
  text: 'Al recibir en Dios el nombre de ustedes, tan amado, que llevan por derecho natural, [con una mente recta y virtuosa], mediante la fe y el amor en Cristo Jesús, nuestro Salvador —como imitadores de Dios y con el corazón encendido en la sangre de Dios[a]—, cumplieron plenamente la obra que les es propia.


    Pues, cuando oyeron que yo venía desde Siria encadenado por causa del Nombre que compartimos y de nuestra esperanza, y que esperaba, gracias a las oraciones de ustedes, lograr combatir contra las fieras en Roma, para que, al lograrlo, pudiera ser discípulo, se apresuraron a visitarme.


    Así pues, en el nombre de Dios, he recibido a toda la comunidad de ustedes en la persona de Onésimo, hombre de amor indescriptible y, además, obispo de ustedes [en la carne]. Ruego que lo amen conforme a Jesucristo y que todos ustedes sean semejantes a él. Pues bendito es aquel que les concedió, como ustedes merecían, tener un obispo así.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «La sangre de Dios» reproduce la expresión llamativa del testimonio antiguo. No se cambia por «la sangre de Cristo», a fin de conservar su fuerza y su tensión cristológica.
    reason: La frase puede sorprender al lector moderno y es teológicamente significativa; requiere aclaración sin alteración del texto.
lexical_decisions:
- source_word: ὄνομα (reflejado por “name” en el testimonio)
  choice: nombre / Nombre
  rationale: Se usa minúscula para el nombre bien amado de la comunidad y mayúscula en «el Nombre que compartimos», donde funciona como designación reverente de la confesión cristiana común; se conserva la amplitud de la expresión.
- source_word: συγγενικόν (reflejado por “congenial”)
  choice: la obra que les es propia
  rationale: Expresa una acción acorde con el carácter o parentesco espiritual de los destinatarios sin recurrir al poco natural «obra congénita».
- source_word: θηριομαχῆσαι (reflejado por “fighting the wild beasts”)
  choice: combatir contra las fieras
  rationale: Mantiene la referencia concreta al enfrentamiento con animales en Roma y evita suavizar la expectativa de martirio.
- source_word: μαθητής (reflejado por “disciple”)
  choice: discípulo
  rationale: 'Conserva la afirmación teológicamente tensa de Ignacio: espera llegar a ser discípulo mediante su fidelidad hasta la muerte, sin explicarla como mera prueba de un discipulado ya consumado.'
- source_word: ἐν σαρκί (reflejado por “[in the flesh]”)
  choice: '[en la carne]'
  rationale: Preserva tanto la formulación corporal característica como los corchetes del testimonio provisional, que señalan incertidumbre textual o restauración.
theological_decisions:
- issue: «la sangre de Dios»
  choice: con el corazón encendido en la sangre de Dios
  alternative: inflamados por la sangre de Cristo
  rationale: Se conserva la formulación sorprendente y cristológicamente densa transmitida por el testimonio, sin sustituir «Dios» por «Cristo» ni resolver su tensión teológica.
- issue: Llegar a ser discípulo mediante el martirio
  choice: para que, al lograrlo, pudiera ser discípulo
  alternative: para demostrar que soy discípulo
  rationale: La alternativa interpretaría y suavizaría la expresión. La traducción mantiene abierta la concepción ignaciana del discipulado como algo que alcanza su plenitud en la fidelidad final.
- issue: Amar al obispo «conforme a Jesucristo»
  choice: Ruego que lo amen conforme a Jesucristo
  alternative: con el amor de Jesucristo
  rationale: «Conforme a» conserva la posible idea de norma, voluntad o manera cristológica sin elegir una sola interpretación.
- issue: Mérito de la comunidad
  choice: como ustedes merecían
  alternative: como correspondía a la dignidad de ustedes
  rationale: Se mantiene la fuerza del testimonio («according to your deserving») sin convertirla en una afirmación sistemática acerca del mérito salvífico.
- issue: Referente de «bendito»
  choice: bendito es aquel que les concedió
  alternative: bendito sea Dios, que les concedió
  rationale: Se evita insertar explícitamente «Dios» donde el testimonio ofrece un pronombre, aunque el contexto hace probable ese referente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se reorganiza la extensa oración del testimonio en tres párrafos para hacerla comprensible sin borrar sus conexiones lógicas. Los corchetes heredados del testimonio se conservan literalmente porque la revisión directa del griego está pendiente; por ello, esta versión debe considerarse provisional y basada principalmente en el testimonio inglés público de Lightfoot.
