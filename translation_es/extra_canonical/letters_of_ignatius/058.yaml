base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: es
  text: 'Desde Siria hasta Roma lucho con fieras, por tierra y por mar, de noche y de día, atado en medio de diez leopardos, es decir, una compañía de soldados, que se vuelven peores cuanto mejor se los trata. Sin embargo, por sus malos tratos llego a ser más plenamente discípulo; pero no por eso quedo justificado.


    ¡Que me causen alegría las fieras preparadas para mí! Ruego encontrarlas dispuestas; más aún, las provocaré para que me devoren pronto, y no hagan como con algunos, a quienes por miedo se negaron a tocar. Incluso si no quisieran hacerlo, aunque yo esté dispuesto, yo mismo las obligaré.


    Ténganme paciencia. Sé lo que me conviene. Ahora comienzo a ser discípulo. Que nada de lo visible ni de lo invisible me tenga envidia, para que pueda alcanzar a Jesucristo. Que vengan fuego y cruz, luchas cuerpo a cuerpo con fieras, [cortes y mutilaciones,] dislocación de huesos, amputación de miembros, trituración de todo mi cuerpo; que caigan sobre mí los crueles tormentos del diablo. Con tal de que alcance a Jesucristo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fight with wild beasts
  choice: lucho con fieras
  rationale: Conserva la metáfora de combate aplicada tanto al traslado bajo custodia como al esperado martirio, sin reducirla a «sufro».
- source_word: ten leopards
  choice: diez leopardos
  rationale: Mantiene la imagen animal explícita, que el propio texto identifica de inmediato con la compañía de soldados.
- source_word: justified
  choice: quedo justificado
  rationale: Preserva el lenguaje forense y teológico del testimonio sin reemplazarlo por «resulto inocente» ni atribuir una doctrina específica de la justificación.
- source_word: attain unto Jesus Christ
  choice: alcanzar a Jesucristo
  rationale: Reproduce la orientación hacia la unión o llegada a Cristo sin explicitar de manera reductora si se refiere a presencia, comunión o encuentro mediante el martirio.
- source_word: grapplings with wild beasts
  choice: luchas cuerpo a cuerpo con fieras
  rationale: Expresa el contacto violento y directo implicado por «grapplings» en español natural.
theological_decisions:
- issue: Relación entre el sufrimiento, el discipulado y la justificación
  choice: «por sus malos tratos llego a ser más plenamente discípulo; pero no por eso quedo justificado»
  alternative: «sus injusticias me hacen un discípulo perfecto, aunque eso no me declara justo»
  rationale: 'La redacción conserva la tensión: el sufrimiento puede completar su discipulado, pero no constituye por sí mismo su justificación.'
- issue: Sentido de «alcanzar a Jesucristo»
  choice: Se conserva la formulación abierta «alcanzar a Jesucristo»
  alternative: «llegar a estar con Jesucristo»
  rationale: 'No se explicita más de lo que permite el testimonio: la expresión puede abarcar llegada, encuentro y comunión con Cristo.'
- issue: «Tormentos del diablo»
  choice: «los crueles tormentos del diablo»
  alternative: «los crueles tormentos causados por el diablo»
  rationale: Se preserva la ambigüedad del genitivo reflejado en el testimonio, sin decidir si señala origen, agencia o pertenencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con tratamiento plural «ustedes» implícito en «Ténganme». Se conserva entre corchetes «[cortes y mutilaciones,]» como señal editorial de incertidumbre o restauración textual presente en el testimonio suministrado; no se convierte en nota al pie. Borrador provisional basado en el testimonio inglés de dominio público proporcionado y consultado junto con la capa inglesa POB; la revisión directa del griego de la recensión media sigue pendiente.
