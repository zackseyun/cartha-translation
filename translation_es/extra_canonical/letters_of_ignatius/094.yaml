review_pass:
  verdict: revise
  source_fidelity: Se requieren ajustes menores frente al griego de la recensión media. «No menosprecies» reduce el matiz de ὑπερηφάνει, que se refiere más precisamente a comportarse con arrogancia hacia alguien. Asimismo, ἀπὸ τοῦ κοινοῦ alude al fondo o los recursos comunes, no necesariamente a la comunidad en sentido personal. La traducción conserva adecuadamente el destinatario singular, el paralelismo de las instrucciones y la ambigüedad de ἐπιθυμία («deseo»).
  naturalness: El texto es claro, sobrio y natural en español latinoamericano. «Del fondo común» resulta más idiomático y específico que «a costa de la comunidad» en este contexto. «No se engrían» es actual y conserva bien el contraste con la arrogancia prohibida al destinatario.
  terminology: «Viudas», «protector», «reuniones», «esclavos», «libertad mejor» y «deseo» son elecciones adecuadas. Se conserva «esclavos» por fidelidad a la condición jurídica y social expresada en el texto antiguo. «Fondo común» evita una lectura estatal moderna de «a costa pública» y representa el κοινον de modo más preciso.
  issues:
  - severity: medium
    issue: «No menosprecies a los esclavos»
    rationale: El verbo griego ὑπερηφανέω no expresa primariamente desprecio, sino altivez o trato arrogante. «No trates con arrogancia» conserva mejor el sentido sin suavizar la relación social antigua.
  - severity: medium
    issue: «a costa de la comunidad»
    rationale: La expresión ἀπὸ τοῦ κοινοῦ se refiere a recursos compartidos o un fondo común. La redacción propuesta puede sonar a perjuicio infligido a la comunidad, mientras que el texto trata de financiar la manumisión con recursos comunes.
  - severity: low
    issue: «con mayor fidelidad»
    rationale: El griego expresa que sirvan «más/aún más» (πλέον), sin explicitar «fidelidad». «Sirvan aún más» reproduce el comparativo sin añadir un modo de servicio.
  revised_text: 'No descuides a las viudas. Después del Señor, sé tú su protector. Que nada se haga sin tu consentimiento, y no hagas tú nada sin el consentimiento de Dios, como en efecto no lo haces. Mantente firme.


    Que las reuniones se celebren con mayor frecuencia. Busca a todos por nombre.


    No trates con arrogancia a los esclavos, sean hombres o mujeres. Pero que ellos tampoco se engrían; más bien, que sirvan aún más para la gloria de Dios, a fin de que obtengan de Dios una libertad mejor. Que no deseen ser liberados con recursos del fondo común, no sea que sean hallados esclavos del deseo.'
  revised_footnotes: []
  revision_rationale: 'La revisión afina dos expresiones conforme al griego transmitido: el trato arrogante hacia las personas esclavizadas y la liberación financiada con recursos comunes. También elimina la adición interpretativa «con fidelidad» para mantener el comparativo abierto del original. No se añaden notas, pues el pasaje no exige resolver mediante nota una ambigüedad textual o doctrinal en esta traducción.'
