revisions:
- from: 'No descuides a las viudas. Después del Señor, sé tú su protector. Que nada se haga sin tu consentimiento; y tampoco hagas nada sin el consentimiento de Dios, como en efecto no lo haces. Mantente firme.


    Que las reuniones se celebren con mayor frecuencia. Busca a cada persona por su nombre.


    No menosprecies a los esclavos, sean hombres o mujeres. Pero tampoco permitas que se llenen de orgullo; más bien, que sirvan con mayor fidelidad para la gloria de Dios, a fin de que obtengan de Dios una libertad mejor. Que no procuren ser liberados a costa de la comunidad, no sea que resulten ser esclavos del deseo.'
  to: 'No descuides a las viudas. Después del Señor, sé tú su protector. Que nada se haga sin tu consentimiento, y no hagas tú nada sin el consentimiento de Dios, como en efecto no lo haces. Mantente firme.


    Que las reuniones se celebren con mayor frecuencia. Busca a todos por nombre.


    No trates con arrogancia a los esclavos, sean hombres o mujeres. Pero que ellos tampoco se engrían; más bien, que sirvan aún más para la gloria de Dios, a fin de que obtengan de Dios una libertad mejor. Que no deseen ser liberados con recursos del fondo común, no sea que sean hallados esclavos del deseo.'
  rationale: 'La revisión afina dos expresiones conforme al griego transmitido: el trato arrogante hacia las personas esclavizadas y la liberación financiada con recursos comunes. También elimina la adición interpretativa «con fidelidad» para mantener el comparativo abierto del original. No se añaden notas, pues el pasaje no exige resolver mediante nota una ambigüedad textual o doctrinal en esta traducción.'
