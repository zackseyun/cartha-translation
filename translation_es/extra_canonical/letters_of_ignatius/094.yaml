base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be slaves of lust.'
translation:
  language: es
  text: 'No descuides a las viudas. Después del Señor, sé tú su protector. Que nada se haga sin tu consentimiento, y no hagas tú nada sin el consentimiento de Dios, como en efecto no lo haces. Mantente firme.


    Que las reuniones se celebren con mayor frecuencia. Busca a todos por nombre.


    No trates con arrogancia a los esclavos, sean hombres o mujeres. Pero que ellos tampoco se engrían; más bien, que sirvan aún más para la gloria de Dios, a fin de que obtengan de Dios una libertad mejor. Que no deseen ser liberados con recursos del fondo común, no sea que sean hallados esclavos del deseo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: widows
  choice: viudas
  rationale: Conserva de manera directa la categoría social y eclesial del testimonio antiguo.
- source_word: protector
  choice: protector
  rationale: Expresa la responsabilidad personal de cuidado encomendada al destinatario sin añadir una función técnica.
- source_word: meetings
  choice: reuniones
  rationale: Mantiene abierto el carácter de los encuentros; el testimonio disponible no exige especificar 'cultos' o 'asambleas'.
- source_word: slaves, whether men or women
  choice: esclavos, sean hombres o mujeres
  rationale: Refleja claramente la condición jurídica y social antigua, y hace explícita la inclusión de ambos sexos sin recurrir a una perífrasis que atenúe el texto.
- source_word: public cost
  choice: a costa de la comunidad
  rationale: En contexto eclesial, comunica que el costo recaería sobre los recursos comunes, evitando el sentido moderno de financiamiento estatal que podría sugerir 'gasto público'.
- source_word: lust
  choice: deseo
  rationale: Preserva la amplitud posible del término transmitido y evita limitarlo sin base suficiente al deseo sexual.
theological_decisions:
- issue: La relación entre la autoridad del destinatario y la voluntad de Dios
  choice: «Que nada se haga sin tu consentimiento; y tampoco hagas nada sin el consentimiento de Dios»
  alternative: «Que nada se haga sin ti; y tú no hagas nada sin Dios»
  rationale: La formulación conserva el paralelismo y la subordinación de la autoridad humana a Dios, sin identificar de manera absoluta ambas voluntades.
- issue: La «libertad mejor» prometida por Dios
  choice: «obtengan de Dios una libertad mejor»
  alternative: «alcancen la verdadera libertad que Dios da»
  rationale: Se conserva la expresión comparativa y su tensión teológica, sin decidir si alude principalmente a libertad espiritual, escatológica o social.
- issue: La esclavitud del deseo
  choice: «esclavos del deseo»
  alternative: «esclavos de la concupiscencia»
  rationale: La opción elegida es comprensible en español actual y no restringe innecesariamente la advertencia al ámbito sexual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el trato singular con «tú», pues el pasaje se dirige personalmente a Policarpo. La traducción es provisional porque el expediente indica que aún está pendiente la revisión directa del griego; por ello se evitan precisiones léxicas o doctrinales que excedan el testimonio inglés suministrado.
