base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: es
  text: 'Por tanto, como hijos [de la luz] de la verdad, eviten la división y las doctrinas erróneas. Donde esté el pastor, síganlo como ovejas.


    Pues muchos lobos convincentes, valiéndose de placeres dañinos, llevan cautivos a quienes corren en la carrera de Dios. Pero donde ustedes estén unidos, no encontrarán lugar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: hijos [de la luz] de la verdad
  rationale: Conserva la expresión filial y los corchetes del testimonio suministrado, que señalan la incertidumbre textual o editorial, sin decidirla en silencio.
- source_word: shun division
  choice: eviten las divisiones
  rationale: Expresa en español actual la exhortación a apartarse de las rupturas dentro de la comunidad.
- source_word: wrong doctrines
  choice: doctrinas erróneas
  rationale: Mantiene el sentido de enseñanzas equivocadas sin añadir una clasificación doctrinal posterior.
- source_word: specious wolves
  choice: lobos de apariencia persuasiva
  rationale: Comunica que parecen atractivos o convincentes, no que sean meramente visibles o imaginarios.
- source_word: with baneful delights
  choice: valiéndose de placeres dañinos
  rationale: Hace explícita la función instrumental indicada por el testimonio y conserva la valoración nociva de esos placeres.
- source_word: the runners in God's race
  choice: quienes corren en la carrera de Dios
  rationale: Preserva la metáfora atlética y la relación con Dios sin sustituirla por una explicación interpretativa.
- source_word: where ye are at one
  choice: donde ustedes permanecen unidos
  rationale: Representa la unidad comunitaria en lenguaje natural y neutral latinoamericano.
theological_decisions:
- issue: Identidad y función del pastor
  choice: «Donde esté el pastor, síganlo como ovejas»
  alternative: Identificar explícitamente al pastor con un obispo o con Cristo
  rationale: El pasaje suministrado dice solamente «el pastor»; se conserva la referencia abierta y no se introduce una identificación denominacional o cristológica no expresada aquí.
- issue: Alcance de «de la luz»
  choice: Conservar «[de la luz]» entre corchetes
  alternative: Incluirlo sin señal o eliminarlo
  rationale: Los corchetes pertenecen al testimonio de base y reflejan una cuestión textual o editorial que no debe resolverse sin revisión directa del griego.
- issue: «La carrera de Dios»
  choice: Mantener el genitivo como «la carrera de Dios»
  alternative: «la carrera hacia Dios» o «la carrera que Dios les ha señalado»
  rationale: La relación exacta del genitivo admite más de una interpretación; la traducción conserva esa tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con tratamiento plural «ustedes». Borrador provisional basado en el testimonio inglés de dominio público y cotejado con la capa inglesa auditada; la revisión directa de la tradición griega de la recensión media sigue pendiente. No se añadieron notas al pie porque la incertidumbre de «[de la luz]» ya queda visible mediante los corchetes en el texto principal.
