base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: es
  text: 'Por tanto, los exhorto —aunque no soy yo, sino el amor de Jesucristo—: aliméntense únicamente del alimento cristiano y absténganse de la vegetación extraña, que es la herejía.


    Pues esas personas mezclan incluso veneno con Jesucristo y engañan a otros con una apariencia de honradez. Son como quienes administran una droga mortal en vino endulzado con miel, de modo que el que no lo sabe la bebe sin temor y, con un placer funesto, bebe la muerte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Está pendiente la revisión directa del texto griego de la recensión media.
    reason: La ficha de fuente indica que aún no se ha realizado la revisión en la lengua original; la nota hace transparente esa limitación textual.
lexical_decisions:
- source_word: Christian food
  choice: alimento cristiano
  rationale: Conserva la metáfora alimentaria central y su contraste con la vegetación extraña, sin convertirla en una explicación doctrinal.
- source_word: strange herbage
  choice: vegetación extraña
  rationale: Mantiene la imagen agrícola inusual del testimonio y evita reducirla simplemente a «enseñanza ajena».
- source_word: heresy
  choice: herejía
  rationale: Reproduce el término eclesial histórico usado por el testimonio, donde identifica explícitamente la vegetación extraña.
- source_word: show of honesty
  choice: apariencia de honradez
  rationale: Expresa una presentación externa respetable que sirve para engañar, sin atribuir una virtud real.
- source_word: honeyed wine
  choice: vino endulzado con miel
  rationale: Comunica de manera clara la mezcla antigua y conserva el contraste entre dulzura y veneno.
- source_word: drinketh in death
  choice: bebe la muerte
  rationale: Preserva la personificación y la fuerza retórica de la imagen, en lugar de parafrasearla como «muere».
theological_decisions:
- issue: Relación entre Jesucristo y el veneno
  choice: «mezclan incluso veneno con Jesucristo»
  alternative: «mezclan el veneno de su doctrina con la enseñanza acerca de Jesucristo»
  rationale: Se conserva la formulación deliberadamente fuerte y metafórica del testimonio, sin añadir una interpretación explicativa ausente del texto suministrado.
- issue: Identificación de la vegetación extraña
  choice: «que es la herejía»
  alternative: «es decir, la herejía»
  rationale: Mantiene la identificación directa y no especifica el contenido de la herejía más allá de lo que afirma el pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen las metáforas encadenadas de alimento, vegetación, veneno, vino con miel y beber la muerte. Se usa «ustedes» implícito en las formas verbales y se evita vocabulario confesional añadido.
