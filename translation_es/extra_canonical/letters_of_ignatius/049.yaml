base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: es
  text: Pero si, como dicen algunos impíos —es decir, incrédulos—, él sufrió solo en apariencia —siendo ellos mismos mera apariencia—, ¿por qué estoy encadenado? ¿Y por qué deseo también luchar contra las fieras? En ese caso, muero en vano. Por tanto, miento contra el Señor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless
  choice: impíos
  rationale: Conserva el sentido religioso y moral del testimonio, mientras la aclaración inmediata «es decir, incrédulos» mantiene la explicación del autor.
- source_word: suffered only in semblance
  choice: sufrió solo en apariencia
  rationale: Expresa con claridad la afirmación docética sin añadir terminología doctrinal ajena al pasaje.
- source_word: being themselves mere semblance
  choice: siendo ellos mismos mera apariencia
  rationale: Mantiene el juego polémico basado en «apariencia» y la concisión deliberada del original atestiguado.
- source_word: in bonds
  choice: encadenado
  rationale: Es natural en español y comunica la prisión física de Ignacio sin restringirse a un tipo específico de atadura.
- source_word: fight with wild beasts
  choice: luchar contra las fieras
  rationale: Conserva la imagen concreta y violenta del testimonio sin suavizarla.
- source_word: in vain
  choice: en vano
  rationale: Reproduce el sentido de inutilidad o falta de propósito sin ampliarlo interpretativamente.
- source_word: lie against the Lord
  choice: doy falso testimonio contra el Señor
  rationale: En español, esta formulación comunica de manera natural que su afirmación acerca del Señor sería falsa, y conserva la fuerza forense y teológica de «contra».
theological_decisions:
- issue: Realidad del sufrimiento de Cristo
  choice: «sufrió solo en apariencia» como afirmación atribuida a los oponentes
  alternative: «pareció sufrir»
  rationale: La redacción conserva la distinción entre sufrimiento real y aparente sin identificar a los oponentes mediante una etiqueta doctrinal posterior.
- issue: Descripción polémica de los oponentes
  choice: Conservar «siendo ellos mismos mera apariencia»
  alternative: Explicitar que carecen de realidad o verdad
  rationale: Se preserva la paradoja y su posible ambigüedad retórica, sin resolverla mediante una paráfrasis interpretativa.
- issue: Consecuencia para el testimonio de Ignacio
  choice: «doy falso testimonio contra el Señor»
  alternative: «miento acerca del Señor»
  rationale: La opción elegida retiene la dirección adversativa de la frase y expresa que negar el sufrimiento real convertiría su testimonio en falso.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la argumentación condicional, las preguntas retóricas y el juego repetido con «apariencia». Debido a que la revisión directa del griego está pendiente, el borrador se mantiene cercano al testimonio público de Lightfoot y evita decisiones filológicas demasiado específicas.
