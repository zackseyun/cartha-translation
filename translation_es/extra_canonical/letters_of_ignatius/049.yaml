revisions:
- from: Pero si, como dicen algunos impíos, es decir, incrédulos, él sufrió solo en apariencia —siendo ellos mismos mera apariencia—, ¿por qué estoy encadenado? ¿Y por qué deseo también luchar contra las fieras? En ese caso, muero en vano. Entonces, en verdad, doy falso testimonio contra el Señor.
  to: Pero si, como dicen algunos impíos —es decir, incrédulos—, él sufrió solo en apariencia —siendo ellos mismos mera apariencia—, ¿por qué estoy encadenado? ¿Y por qué deseo también luchar contra las fieras? En ese caso, muero en vano. Por tanto, miento contra el Señor.
  rationale: 'Se realiza una corrección limitada en la cláusula final para no convertir «mentir» en «dar falso testimonio». También se ajusta el conector conclusivo para reflejar la inferencia sin añadir un énfasis innecesario. No se requieren notas: el texto conserva la ambigüedad y la ironía polémica de «mera apariencia».'
