base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: es
  text: 'Eviten, por tanto, esos retoños viles que producen fruto mortal. Si alguien lo prueba, muere de inmediato. Pues esas personas no son plantación del Padre. Si lo fueran, se vería que son ramas de la cruz y que su fruto es imperecedero: la cruz por medio de la cual él, mediante su pasión, nos invita, siendo nosotros miembros suyos. Ahora bien, no puede haber una cabeza sin miembros, puesto que Dios promete la unión, y esta unión es él mismo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vile offshoots
  choice: retoños viles
  rationale: Conserva la metáfora vegetal y el juicio negativo del testimonio, sin sustituirlos por una explicación doctrinal.
- source_word: gender a deadly fruit
  choice: producen fruto mortal
  rationale: Expresa en español natural la imagen de dar fruto cuyo efecto es la muerte.
- source_word: the Father’s planting
  choice: plantación del Padre
  rationale: Mantiene la metáfora agrícola y la referencia explícita al Padre.
- source_word: branches of the Cross
  choice: ramas de la cruz
  rationale: Preserva la imagen deliberadamente llamativa que vincula la plantación, las ramas y la cruz.
- source_word: passion
  choice: pasión
  rationale: Es el término tradicional y comprensible para los sufrimientos y la muerte de Cristo en este contexto.
- source_word: union
  choice: unión
  rationale: Conserva la formulación abstracta del testimonio sin precisar indebidamente la naturaleza de esa unión.
theological_decisions:
- issue: La relación entre Cristo como cabeza, sus miembros y la unión prometida por Dios
  choice: Se mantiene que no puede haber una cabeza sin miembros y que la unión prometida es Dios mismo.
  alternative: Explicar la unión específicamente como unión eclesial, sacramental o mística.
  rationale: El testimonio relaciona estas imágenes, pero no define aquí la modalidad de la unión; explicitarla impondría una interpretación confesional.
- issue: El referente del pronombre en «él nos invita»
  choice: Se conserva el pronombre «él» sin añadir el nombre de Cristo.
  alternative: Traducir «Cristo nos invita» para hacer explícito el referente.
  rationale: El testimonio suministrado usa un pronombre y el referente se deduce del contexto; mantenerlo evita introducir una explicitación no verificada todavía en el griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la cadena de metáforas agrícolas y corporales, así como la tensión de la afirmación final. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
