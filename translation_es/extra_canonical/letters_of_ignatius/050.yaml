review_pass:
  verdict: revise
  source_fidelity: El borrador conserva adecuadamente la secuencia metafórica (brotes/plantación/ramas/fruto), la consecuencia mortal, la cruz, los miembros y la unión. Se mantiene la sintaxis deliberadamente densa de la cláusula sobre la cruz sin resolverla doctrinalmente. La revisión directa del griego de la recensión media sigue pendiente, por lo que la evaluación se basa en el testimonio inglés proporcionado.
  naturalness: «Plantación del Padre» resulta algo rígido en español corriente; «plantío del Padre» mantiene la metáfora agrícola con mayor idiomaticidad. También conviene hacer más fluida la formulación condicional y la relación entre la cabeza y sus miembros.
  terminology: «Pasión», «cruz», «miembros» y «unión» son apropiados y no introducen una interpretación confesional. Se conserva «Padre» y no se explicita el referente cristológico del pronombre más allá de lo que permite el testimonio.
  issues:
  - severity: low
    issue: «plantación del Padre» suena poco idiomático.
    rationale: «Plantío del Padre» expresa de manera más natural la imagen de aquello que el Padre ha plantado, sin cambiar el sentido.
  - severity: low
    issue: La oración «Si lo fueran, se vería que son...» puede pulirse.
    rationale: «Si lo fueran, se vería que serían...» refleja con más claridad el carácter contrafactual del original inglés.
  - severity: low
    issue: «retoños viles» es comprensible, pero algo menos natural como caracterización moral.
    rationale: «Brotes perversos» mantiene la metáfora vegetal y comunica con naturalidad el juicio negativo de «vile».
  revised_text: 'Eviten, por tanto, esos brotes perversos que dan un fruto mortal. Si alguien lo prueba, muere de inmediato. Pues esas personas no son plantío del Padre. Porque, si lo fueran, se vería que serían ramas de la cruz y que su fruto sería imperecedero: la cruz por medio de la cual él, mediante su pasión, nos invita, siendo nosotros miembros suyos. Ahora bien, no puede haber una cabeza sin miembros, puesto que Dios promete unión, y esta unión es él mismo.'
  revised_footnotes: []
  revision_rationale: 'Se efectúan únicamente ajustes estilísticos seguros para un español latinoamericano neutral: se mejora la naturalidad de la metáfora agrícola, se expresa de modo más claro el condicional contrafactual y se conserva la construcción compleja y la ambigüedad relacional de la frase sobre la cruz y los miembros. No se añaden notas, pues el pasaje entregado no contiene anclas de nota y no corresponde suplirlas.'
