review_pass:
  verdict: revise
  source_fidelity: 'El borrador conserva adecuadamente la secuencia de imágenes del testimonio: vástagos/fruto, plantío, ramas de la Cruz, cabeza y miembros. Sin embargo, «se vería que son» atenúa y desajusta el valor contrafáctico de «if they had been ... they would have been seen», y la relación sintáctica de «siendo nosotros miembros suyos» necesita expresarse con mayor claridad. La revisión directa del griego sigue pendiente, según el contexto proporcionado.'
  naturalness: El español es en general claro y de registro digno. «Plantío del Padre» conserva la metáfora y resulta más idiomático en registro bíblico que «plantación del Padre». La puntuación y la reordenación en la cláusula relativa a la Cruz hacen más legible la frase sin explicarla doctrinalmente.
  terminology: Se mantienen «Padre», «Cruz», «pasión», «miembros» y «unión». Se usa «Cruz» con mayúscula por su referencia al instrumento de la pasión en esta formulación cristológica. «Nos llama» representa de forma natural el sentido de convocatoria del inglés auditado, sin identificar de manera añadida al referente pronominal.
  issues:
  - severity: medium
    issue: Valor contrafáctico en la frase sobre las ramas de la Cruz
    rationale: «Si lo fueran, se vería que son» no refleja con precisión «if they had been, they would have been seen to be». Se requiere una formulación condicional consecuente que mantenga la afirmación hipotética.
  - severity: low
    issue: Construcción ambigua de «nos invita, siendo nosotros miembros suyos»
    rationale: El participio queda sintácticamente pesado en español. «Pues somos miembros suyos» conserva el contenido sin imponer una explicación de la unión.
  - severity: low
    issue: «Plantación del Padre» es poco natural en este registro
    rationale: «Plantío del Padre» mantiene la metáfora agrícola y es una formulación española más estable en lenguaje religioso.
  revised_text: 'Eviten, por tanto, esos retoños viles que producen fruto mortal. Si alguien lo prueba, muere de inmediato. Pues esas personas no son plantío del Padre; porque, si lo fueran, se mostrarían como ramas de la Cruz, y su fruto sería imperecedero: la Cruz por medio de la cual él, mediante su pasión, nos llama, pues somos miembros suyos. Ahora bien, no puede haber una cabeza sin miembros, puesto que Dios promete la unión, y esta unión es él mismo.'
  revised_footnotes: []
  revision_rationale: Se corrigen de forma limitada el condicional, la sintaxis de la cláusula sobre la Cruz y una elección léxica menos natural. Se preservan las metáforas, la ambigüedad acerca de la naturaleza de la unión y el referente pronominal no explicitado. No se añaden notas porque el texto suministrado no contiene anclas ni variantes textuales concretas que deban documentarse.
