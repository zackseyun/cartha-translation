id: IGN.077
reference: Letters of Ignatius — IgnSmyrn. 1
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: es
  text: 'Doy gloria a Jesucristo, el Dios que les concedió tal sabiduría, porque he visto que están afianzados en una fe inquebrantable, como si estuvieran clavados en la cruz del Señor Jesucristo en carne y espíritu, y firmemente arraigados en el amor por medio de la sangre de Cristo. Están plenamente convencidos acerca de nuestro Señor: que verdaderamente procede del linaje de David según la carne, pero es Hijo de Dios por voluntad y poder divinos; que verdaderamente nació de una virgen y fue bautizado por Juan, para que él cumpliera toda justicia;


    que verdaderamente fue clavado en la cruz en la carne por nosotros, bajo Poncio Pilato y el tetrarca Herodes —de lo cual nosotros somos fruto, es decir, de su benditísima pasión—; y que, mediante su resurrección, levantara una bandera para todos los tiempos, destinada a sus santos y fieles, tanto de entre los judíos como de entre los gentiles, en el único cuerpo de su Iglesia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media. Aquí «pasión» significa el sufrimiento de Cristo.
    reason: La fuente proporcionada identifica expresamente el inglés como base provisional y señala que la revisión del griego está pendiente; además, «pasión» puede ser malentendido por lectores actuales.
lexical_decisions:
- source_word: δοξάζω
  choice: Doy gloria a
  rationale: Conserva el sentido doxológico sin sugerir que el autor añade gloria intrínseca a Cristo; es natural y digno en español.
- source_word: ἀκίνητοι
  choice: inquebrantable
  rationale: Expresa una fe firme e inconmovible con lenguaje actual; la idea de estar afianzados conserva además la imagen de estabilidad.
- source_word: καθηλωμένοι
  choice: clavados
  rationale: Mantiene la fuerte metáfora de unión con la cruz, que después se corresponde con la afirmación histórica de que Cristo fue clavado.
- source_word: ἐρριζωμένοι
  choice: arraigados
  rationale: Preserva la metáfora vegetal de estar firmemente enraizados en el amor.
- source_word: ἐν αἵματι Χριστοῦ
  choice: por medio de la sangre de Cristo
  rationale: El testimonio inglés permite una relación instrumental o de esfera. Esta formulación resulta comprensible, aunque la nota reconoce la provisionalidad sin revisión directa del griego.
- source_word: ἐκ γένους Δαυίδ
  choice: procede del linaje de David
  rationale: Comunica descendencia davídica sin reducir la expresión a una genealogía moderna estricta.
- source_word: κατὰ σάρκα
  choice: según la carne
  rationale: Retiene la formulación cristológica antigua y su contraste deliberado con la filiación divina.
- source_word: πάθος
  choice: pasión
  rationale: En este contexto cristiano antiguo significa el sufrimiento de Cristo. Se mantiene el término tradicional, acompañado por una nota aclaratoria.
- source_word: σύσσημον
  choice: bandera
  rationale: Representa una señal visible levantada para convocar o identificar; evita una explicación interpretativa excesiva.
- source_word: ἓν σῶμα τῆς ἐκκλησίας
  choice: el único cuerpo de su Iglesia
  rationale: Conserva tanto la unidad como la metáfora corporal eclesial.
theological_decisions:
- issue: Designación de Jesucristo como Dios
  choice: Jesucristo, el Dios
  alternative: Jesucristo, Dios
  rationale: Se mantiene explícita la elevada afirmación cristológica del testimonio, sin atenuarla ni reformularla doctrinalmente.
- issue: Relación entre humanidad y filiación divina
  choice: según la carne, pero es Hijo de Dios por voluntad y poder divinos
  alternative: en cuanto a su humanidad, y declarado Hijo de Dios
  rationale: La traducción conserva la tensión y la coordinación del texto recibido, sin introducir la idea interpretativa de una declaración o adopción.
- issue: Agente del cumplimiento de toda justicia
  choice: para que él cumpliera toda justicia
  alternative: para que toda justicia se cumpliera en él
  rationale: El testimonio inglés dice “by Him”, que favorece la agencia de Cristo, pero la redacción se marca como provisional debido a la revisión griega pendiente.
- issue: Participación de los creyentes como fruto de la pasión
  choice: de lo cual nosotros somos fruto
  alternative: de quien nosotros somos fruto
  rationale: Se conserva la referencia algo ambigua del testimonio, explicada inmediatamente como la pasión de Cristo, sin imponer una precisión ajena.
- issue: Judíos y gentiles en la Iglesia
  choice: tanto de entre los judíos como de entre los gentiles, en el único cuerpo de su Iglesia
  alternative: sean judíos o gentiles, unidos en el cuerpo de la Iglesia
  rationale: Mantiene los dos grupos y su pertenencia común a un solo cuerpo sin sugerir la desaparición de sus identidades.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones enfáticas de «verdaderamente», las imágenes de estar clavados y arraigados, y la tensión cristológica del pasaje. Se evitó vocabulario confesional añadido. Debido a que no se suministró el texto griego y la revisión de la lengua fuente está pendiente, las decisiones finas de sintaxis y preposiciones deben considerarse provisionales.
