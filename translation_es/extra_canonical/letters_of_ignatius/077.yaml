review_pass:
  verdict: revise
  source_fidelity: 'La revisión del griego de la recensión media confirma en general la secuencia y los énfasis del borrador: la identificación de Jesucristo como «el Dios», la descendencia davídica «según la carne», la filiación divina, los repetidos «verdaderamente», la crucifixión bajo Pilato y Herodes, y la unidad de judíos y gentiles en un solo cuerpo. Sin embargo, ἵνα πληρωθῇ πᾶσα δικαιοσύνη ὑπ’ αὐτοῦ es una construcción pasiva: «para que toda justicia fuera cumplida por él», no «para que él cumpliera toda justicia».'
  naturalness: La redacción revisada conserva un registro actual, digno y neutral latinoamericano. Reordena «en carne y espíritu» para que modifique sin ambigüedad a quienes están metafóricamente clavados a la cruz, y sustituye formulaciones algo forzadas como «el único cuerpo» y «destinada a» por expresiones más naturales y cercanas al griego.
  terminology: Se mantienen «Doy gloria», «Hijo de Dios», «según la carne», «pasión», «santos», «gentiles» e «Iglesia». «Estandarte» comunica mejor σύσσημον como señal o emblema levantado; no presupone una interpretación adicional. La nota conserva la aclaración moderna de «pasión» y la condición provisional de la base editorial.
  issues:
  - severity: high
    issue: La cláusula sobre el cumplimiento de toda justicia cambia la voz verbal.
    rationale: 'El griego πληρωθῇ es pasivo, seguido de ὑπ’ αὐτοῦ («por él»). El borrador convierte la cláusula en activa: «para que él cumpliera toda justicia». Debe decir que toda justicia fuera cumplida por él.'
  - severity: medium
    issue: «El único cuerpo» sobretraduce ἐν ἑνὶ σώματι.
    rationale: ἑνί significa «un/uno», con énfasis unitivo en contexto; «un solo cuerpo» reproduce ese valor sin introducir la idea de exclusividad que puede sugerir «el único cuerpo».
  - severity: low
    issue: «Destinada a sus santos» añade una relación no expresada claramente.
    rationale: El εἰς que sigue a «levantar un estandarte» puede conservarse de forma directa como «para sus santos y fieles», sin presentar el estandarte como algo específicamente destinado a ellos.
  revised_text: 'Doy gloria a Jesucristo, el Dios que les concedió tal sabiduría, porque he visto que están afianzados en una fe inquebrantable, como clavados, en carne y espíritu, a la cruz del Señor Jesucristo, y firmemente arraigados en el amor por medio de la sangre de Cristo. Están plenamente convencidos acerca de nuestro Señor: que verdaderamente es del linaje de David según la carne, pero Hijo de Dios por voluntad y poder divinos; que verdaderamente nació de una virgen y fue bautizado por Juan, para que toda justicia fuera cumplida por él;


    que verdaderamente fue clavado en la cruz en la carne por nosotros, bajo Poncio Pilato y Herodes el tetrarca —de cuyo fruto nosotros somos, es decir, de su benditísima pasión—; y que, por medio de su resurrección, levantara un estandarte para todos los tiempos, para sus santos y fieles, tanto entre los judíos como entre los gentiles, en un solo cuerpo de su Iglesia.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media. Aquí «pasión» significa el sufrimiento de Cristo.
    reason: La fuente proporcionada identifica expresamente el inglés como base provisional y señala que la revisión del griego está pendiente; además, «pasión» puede malinterpretarse entre lectores actuales.
  revision_rationale: Se corrige la voz pasiva de la cláusula sobre «toda justicia», que es la enmienda necesaria para la fidelidad al texto. También se ajustan de manera conservadora la expresión de la unidad eclesial y la función del estandarte, y se mejora la colocación de modificadores sin alterar el contenido ni resolver de forma doctrinal cuestiones que el texto no desarrolla.
