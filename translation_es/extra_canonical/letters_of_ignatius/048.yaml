review_pass:
  verdict: revise
  source_fidelity: El borrador conserva con cuidado la secuencia argumentativa, la repetición enfática de «verdaderamente», la agencia del Padre y la triple referencia cósmica. Sin embargo, «al margen de Jesucristo» atenúa y desplaza el sentido de χωρὶς («sin/aparte de»), que se refiere a un discurso desvinculado de Cristo, no meramente tangencial. La formulación revisada restituye esa relación. Se mantiene la cautela requerida porque el texto de trabajo depende todavía del testimonio inglés y la revisión directa del griego está pendiente.
  naturalness: El registro es claro y apropiado para el español latinoamericano. «Hagan oídos sordos» y «linaje de David» son naturales. «Sin Jesucristo» resulta más idiomático y preciso en este contexto que «al margen de Jesucristo»; «los celestiales, los terrestres y los que están debajo de la tierra» conserva el paralelismo con buena legibilidad.
  terminology: Se conservan «Jesucristo», «David», «María», «Poncio Pilato», «Padre», «Cristo Jesús», «resucitado de entre los muertos» y «vida verdadera». «Linaje» comunica adecuadamente γένος/ascendencia sin imponer una interpretación doctrinal adicional. La nota provisional sigue siendo necesaria y su ancla permanece al final del pasaje.
  issues:
  - severity: medium
    issue: «al margen de Jesucristo» para «apart from Jesus Christ»
    rationale: En español normalmente significa ‘de manera tangencial’ o ‘fuera del asunto de’, mientras que el original/testimonio expresa hablar sin Cristo o separadamente de él. «Sin Jesucristo» comunica con más fidelidad el contraste exhortativo.
  - severity: low
    issue: Representación poco paralela de la tríada cósmica
    rationale: «Seres celestiales, los que están en la tierra y los que están debajo de la tierra» es comprensible, pero la revisión hace más visible el paralelismo de los grupos descritos por el texto, sin alterar su alcance.
  revised_text: 'Por tanto, hagan oídos sordos cuando alguien les hable sin Jesucristo. Él era del linaje de David e hijo de María. Verdaderamente nació, comió y bebió; verdaderamente fue perseguido bajo Poncio Pilato; verdaderamente fue crucificado y murió a la vista de los celestiales, de los terrestres y de los que están debajo de la tierra.


    Además, verdaderamente fue resucitado de entre los muertos: su Padre lo resucitó. De igual manera, su Padre también nos resucitará a nosotros, los que creemos en él —su Padre, repito, nos resucitará— en Cristo Jesús, fuera de quien no tenemos vida verdadera.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada indica expresamente que la revisión de la lengua fuente aún está pendiente; la nota transparenta el fundamento textual de este borrador.
  revision_rationale: Se sustituye una expresión española que cambia el matiz relacional de «apart from» y se ajusta la enumeración cósmica para reflejar mejor su paralelismo. No se resuelve de forma doctrinal la relación sintáctica de «en Cristo Jesús» ni se amplía «vida verdadera».
