review_pass:
  verdict: revise
  source_fidelity: El borrador conserva la secuencia, la repetición enfática de «verdaderamente», la agencia del Padre y la tríada cósmica del testimonio inglés. Sin embargo, «al margen de Jesucristo» puede sugerir hablar de forma independiente de él, en vez de hablar sin referencia a él; «en el cielo» refleja más directamente «those in heaven» que «seres celestiales». La revisión directa del griego de la recensión media continúa pendiente según el contexto proporcionado.
  naturalness: El texto es generalmente claro y apto para lectura pública. «Sin referirse a Jesucristo» comunica con mayor naturalidad y precisión el sentido contextual. «Sin quien» es más idiomático en este contexto que «fuera de quien», sin perder la exclusividad expresada por el original.
  terminology: Se mantienen «linaje de David», «verdaderamente», «resucitado de entre los muertos», «Poncio Pilato» y «Cristo Jesús». «Hijo de María» se conserva conforme al testimonio inglés suministrado. No se introduce una interpretación doctrinal de «vida verdadera».
  issues:
  - severity: medium
    issue: «al margen de Jesucristo»
    rationale: Esta expresión puede leerse como ‘de manera independiente de Jesucristo’ y no necesariamente como una enseñanza que no lo tiene por referente. «Sin referirse a Jesucristo» conserva mejor la advertencia retórica del testimonio inglés («apart from Jesus Christ»).
  - severity: low
    issue: «los seres celestiales» por «those in heaven»
    rationale: «Seres celestiales» interpreta el grupo como habitantes angélicos. «Los que están en el cielo» conserva la designación espacial y la simetría con «los que están en la tierra» y «los que están debajo de la tierra». También mantiene la ambigüedad del referente.
  - severity: low
    issue: «fuera de quien»
    rationale: Es comprensible, pero resulta menos natural en español contemporáneo. «Sin quien» mantiene el vínculo exclusivo y funciona con fluidez en una frase relativa referida a Cristo.
  revised_text: 'Por tanto, sean sordos cuando alguien les hable sin referirse a Jesucristo. Él era del linaje de David e hijo de María. Verdaderamente nació, comió y bebió; verdaderamente fue perseguido bajo Poncio Pilato; verdaderamente fue crucificado y murió a la vista de los que están en el cielo, de los que están en la tierra y de los que están debajo de la tierra.


    Además, verdaderamente fue resucitado de entre los muertos: su Padre lo resucitó. De igual manera, su Padre también nos resucitará a nosotros, los que creemos en él —su Padre, repito, nos resucitará— en Cristo Jesús, sin quien no tenemos la vida verdadera.[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada indica expresamente que la revisión de la lengua fuente aún está pendiente; la nota transparenta el fundamento textual de este borrador.
  revision_rationale: Se ajustan tres expresiones para representar más directamente el testimonio proporcionado y mejorar la naturalidad en español latinoamericano, sin resolver ambigüedades teológicas ni sintácticas. Se conserva la nota de transparencia textual, pues aún no se ha realizado la revisión directa del griego.
