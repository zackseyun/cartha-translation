base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: es
  text: 'Por tanto, hagan oídos sordos cuando alguien les hable al margen de Jesucristo. Él era del linaje de David e hijo de María. Verdaderamente nació, comió y bebió; verdaderamente fue perseguido bajo Poncio Pilato; verdaderamente fue crucificado y murió a la vista de los seres celestiales, de los que están en la tierra y de los que están debajo de la tierra.


    Además, verdaderamente fue resucitado de entre los muertos: su Padre lo resucitó. De igual manera, su Padre también nos resucitará a nosotros, los que creemos en él —su Padre, repito, nos resucitará— en Cristo Jesús, fuera de quien no tenemos la vida verdadera.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot; queda pendiente la revisión directa del texto griego de la recensión media.
    reason: La información suministrada indica expresamente que la revisión de la lengua fuente aún está pendiente; la nota transparenta el fundamento textual de este borrador.
lexical_decisions:
- source_word: Be ye deaf
  choice: hagan oídos sordos
  rationale: Conserva la fuerza imperativa de la imagen y suena natural en español latinoamericano actual.
- source_word: of the race of David
  choice: del linaje de David
  rationale: «Linaje» comunica ascendencia familiar y mantiene el lenguaje tradicional bíblico sin resultar oscuro.
- source_word: truly
  choice: verdaderamente
  rationale: La repetición deliberada subraya la realidad corporal e histórica de los acontecimientos y debe conservarse.
- source_word: under Pontius Pilate
  choice: bajo Poncio Pilato
  rationale: Mantiene la formulación histórica concisa del testimonio.
- source_word: those in heaven ... under the earth
  choice: los seres celestiales ... los que están debajo de la tierra
  rationale: Evita el poco natural «los que están en el cielo» para el primer grupo, pero preserva la estructura tripartita cósmica.
- source_word: raised from the dead
  choice: resucitado de entre los muertos
  rationale: Expresa con precisión que Jesús fue levantado del ámbito de los muertos.
- source_word: apart from whom
  choice: fuera de quien
  rationale: Conserva la afirmación exclusiva sin ampliarla ni definir su alcance doctrinal.
theological_decisions:
- issue: Realidad de la encarnación, el sufrimiento y la muerte de Jesús
  choice: Repetir «verdaderamente» en cada afirmación principal
  alternative: Reducir la repetición por fluidez estilística
  rationale: La insistencia es teológicamente significativa y combate cualquier lectura que niegue la realidad corporal e histórica de Jesús.
- issue: Agencia del Padre en la resurrección
  choice: «su Padre lo resucitó» y «su Padre también nos resucitará»
  alternative: «resucitó» o «resucitaremos» sin agente expreso
  rationale: Conserva la agencia explícita del Padre y la repetición enfática del testimonio.
- issue: Vínculo sintáctico de «en Cristo Jesús»
  choice: Mantenerlo después del inciso enfático, sin explicitar si modifica de manera principal «resucitará» o la condición de los creyentes
  alternative: Reordenarlo para fijar una sola relación sintáctica
  rationale: La formulación recibida admite cierta tensión sintáctica; conviene no resolverla silenciosamente.
- issue: «vida verdadera»
  choice: Mantener la expresión sin identificarla exclusivamente con vida presente o futura
  alternative: Interpretarla como «vida eterna»
  rationale: Preserva la amplitud teológica del enunciado y evita importar una precisión ausente del testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea el plural «ustedes» implícito en los imperativos y pronombres, sin formas regionales. Se conserva la repetición retórica y doctrinal de «verdaderamente», al tiempo que se divide el período extenso para facilitar la lectura pública.
