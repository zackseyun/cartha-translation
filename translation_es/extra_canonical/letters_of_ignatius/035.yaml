base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: es
  text: 'Que pueda alegrarme por ustedes en todo, si soy digno. Pues, aunque estoy encadenado, no soy comparable con ninguno de ustedes que están libres. Sé que no se llenan de orgullo, porque tienen a Jesucristo dentro de ustedes. Y cuando los elogio, sé que sienten aún más vergüenza, como está escrito: «El justo se acusa a sí mismo».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La redacción de este pasaje es provisional: se basa en el antiguo testimonio inglés suministrado y queda pendiente la revisión directa del texto griego de la recensión media. La frase citada guarda relación con Proverbios 18:17 en la antigua versión griega, aunque su forma aquí no coincide necesariamente con las traducciones modernas del texto hebreo.'
    reason: Transparentar la base documental limitada y aclarar la probable procedencia de una cita cuya forma puede resultar inesperada.
lexical_decisions:
- source_word: have joy of you
  choice: alegrarme por ustedes
  rationale: Expresa en español natural que la comunidad es motivo de alegría, sin forzar una construcción posesiva calcada del testimonio inglés.
- source_word: in bonds
  choice: encadenado
  rationale: Conserva la referencia concreta al encarcelamiento de Ignacio y su tono personal.
- source_word: puffed up
  choice: se llenan de orgullo
  rationale: Comunica con claridad la imagen moral de la arrogancia en lenguaje actual y digno.
- source_word: in yourselves
  choice: dentro de ustedes
  rationale: Mantiene la afirmación de presencia interior sin explicar de manera denominacional su sentido teológico.
- source_word: self-accuser
  choice: se acusa a sí mismo
  rationale: Reproduce el carácter reflexivo y judicial de la expresión del testimonio, preservando su tensión.
theological_decisions:
- issue: Sentido de tener a Jesucristo «dentro de ustedes»
  choice: tienen a Jesucristo dentro de ustedes
  alternative: Jesucristo vive en ustedes
  rationale: La formulación elegida permanece cercana al testimonio suministrado y evita precisar si se trata de inhabitación, comunión, carácter o conducta.
- issue: Naturaleza de la cita sobre el justo
  choice: «El justo se acusa a sí mismo»
  alternative: «El justo es su propio acusador»
  rationale: Se conserva la formulación verbal, directa y potencialmente ambigua, sin convertirla en una máxima interpretativa más elaborada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se evitan arcaísmos. La traducción conserva el contraste entre Ignacio encadenado y los destinatarios libres, así como la tensión entre elogio, humildad y autoacusación. Debido a que la revisión del griego está pendiente, se mantienen formulaciones cautelosas y cercanas al testimonio público proporcionado.
