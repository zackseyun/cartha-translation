base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: es
  text: 'He comprobado que este obispo de ustedes ejerce el ministerio al servicio del bien común, no por iniciativa propia ni por medio de seres humanos, ni tampoco por vanagloria, sino en el amor de Dios Padre y del Señor Jesucristo. Me asombra su paciencia: su silencio tiene más fuerza que las palabras de otros. En efecto, está en armonía con los mandamientos, como la lira con sus cuerdas. Por eso mi alma bendice su manera de pensar conforme a Dios, pues he comprobado que es virtuosa y perfecta; bendice también el carácter sereno e imperturbable que mantiene mientras vive con toda paciencia conforme a Dios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Es necesario cotejar directamente la tradición manuscrita griega, en particular para precisar la sintaxis de la frase final y los términos vertidos como «paciencia», «manera de pensar conforme a Dios» y «carácter».
    reason: La fuente proporcionada indica que la revisión directa del griego está pendiente; la nota hace transparente esa limitación y señala los puntos que más dependen del testimonio inglés.
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: el ministerio al servicio del bien común
  rationale: Expresa de manera natural la función ministerial orientada al beneficio de toda la comunidad, sin reducirla a un cargo meramente administrativo.
- source_word: not of himself or through men
  choice: no por iniciativa propia ni por medio de seres humanos
  rationale: Conserva el contraste entre origen personal, mediación humana y fundamento divino; «seres humanos» evita que «hombres» se entienda solo en sentido masculino.
- source_word: vain glory
  choice: vanagloria
  rationale: Término español vigente y digno que conserva el matiz moral de buscar prestigio vacío.
- source_word: forbearance / patience
  choice: paciencia
  rationale: «Paciencia» comunica la resistencia serena y tolerante del término transmitido por el testimonio inglés; el matiz preciso deberá verificarse directamente en griego.
- source_word: godly mind
  choice: manera de pensar conforme a Dios
  rationale: Evita el sentido moderno de una mente divina o sobrenatural y expresa una disposición interior orientada por Dios.
- source_word: imperturbable and calm temper
  choice: carácter sereno e imperturbable
  rationale: Mantiene los dos rasgos complementarios y suena natural en español contemporáneo.
theological_decisions:
- issue: Origen y legitimidad del ministerio episcopal
  choice: «no por iniciativa propia ni por medio de seres humanos... sino en el amor de Dios Padre y del Señor Jesucristo»
  alternative: «no de sí mismo ni por los hombres»
  rationale: Se conserva la tensión del pasaje entre agencia humana y fundamento divino sin formular una doctrina posterior sobre ordenación, sucesión o nombramiento.
- issue: Sentido de «conforme a Dios» aplicado al pensamiento y la paciencia
  choice: Se presenta como orientación o cualidad acorde con Dios
  alternative: «mente divina» y «paciencia divina»
  rationale: La opción elegida evita atribuir divinidad al obispo y conserva el elogio espiritual sin introducir una afirmación ontológica.
- issue: Relación sintáctica de la cláusula final
  choice: Se explicita que el alma bendice tanto la manera de pensar como el carácter
  alternative: Tomar «el carácter sereno e imperturbable» como simple explicación de la perfección de su mente
  rationale: El testimonio inglés permite cierta incertidumbre sintáctica; la redacción española busca legibilidad, mientras la nota advierte que falta cotejo directo con el griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para dirigirse a la comunidad y «obispo» como término histórico directo. La imagen musical se conserva con claridad. Se evita lenguaje confesional posterior y se mantiene un tono exhortativo y reverente.
