base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: es
  text: 'Sé quién soy y a quiénes les escribo. Yo soy un condenado; ustedes han recibido misericordia. Yo estoy en peligro; ustedes están firmemente establecidos.


    Ustedes son la ruta de quienes son llevados a la muerte hacia Dios.[a] Son compañeros de Pablo en los misterios,[b] de quien se ha dado buen testimonio, que fue santificado y es digno de toda felicitación. Quisiera que, cuando alcance a Dios, se me halle siguiendo sus huellas. En cada una de sus cartas, Pablo los menciona en Cristo Jesús.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión conserva el lenguaje del texto antiguo. El verbo describe a personas que son llevadas a la muerte o muertas; «hacia Dios» reproduce la orientación expresada sin precisar más su sentido.
    reason: Restituir el matiz pasivo del verbo y preservar la formulación teológicamente densa sin imponer una explicación única.
  - marker: b
    text: «Misterios» puede referirse ampliamente a realidades sagradas compartidas en la fe. El pasaje no obliga a entender el término en un sentido sacramental específico.
    reason: Mantener la ambigüedad del término y evitar una lectura denominacional.
lexical_decisions:
- source_word: convict
  choice: condenado
  rationale: Conserva la condición judicial y penitenciaria expresada por el testimonio inglés sin añadir que la sentencia fuera necesariamente de muerte.
- source_word: established
  choice: firmemente establecidos
  rationale: Expresa estabilidad y firmeza comunitaria con lenguaje natural y digno.
- source_word: high-road
  choice: camino por el que pasan
  rationale: Mantiene la metáfora vial y comunica que los efesios servían de ruta o lugar de paso para creyentes conducidos al martirio.
- source_word: die unto God
  choice: morir para Dios
  rationale: Conserva la formulación teológicamente tensa, sin reducirla a «morir por Dios» ni explicarla como simple martirio.
- source_word: associates in the mysteries
  choice: comparten los misterios
  rationale: Retiene el lenguaje religioso del testimonio y evita precisar indebidamente si se trata de sacramentos, revelaciones o participación espiritual.
- source_word: obtained a good report
  choice: recibió buen testimonio
  rationale: Reproduce la idea de aprobación o testimonio favorable sin convertirla en fama pública.
- source_word: attain unto God
  choice: llegue a Dios
  rationale: Traducción natural que preserva la concepción ignaciana de alcanzar a Dios mediante su futura muerte, sin explicitar más de lo dicho.
- source_word: maketh mention of you
  choice: los menciona
  rationale: Forma actual y directa que conserva la afirmación del testimonio.
theological_decisions:
- issue: Sentido de «morir para Dios»
  choice: Se conservó literalmente «morir para Dios».
  alternative: «Morir por causa de Dios» o «morir y así llegar a Dios».
  rationale: La expresión admite una relación de finalidad, pertenencia o dirección hacia Dios; explicarla en el texto resolvería una tensión genuina.
- issue: Alcance de «misterios»
  choice: Se mantuvo «misterios».
  alternative: «Sacramentos», «verdades reveladas» o «experiencias sagradas».
  rationale: Sin revisión directa del griego, ninguna especificación más estrecha está suficientemente justificada.
- issue: Referencia a las cartas de Pablo
  choice: Se tradujo «en cada carta» y se añadió una nota de cautela textual e histórica.
  alternative: «En toda carta» o una afirmación restringida a cartas concretas.
  rationale: El testimonio suministrado formula una generalización; debe conservarse sin afirmar que Pablo nombre explícitamente a los efesios en cada epístola conservada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para la segunda persona plural y se mantiene el contraste enfático entre Ignacio y sus destinatarios. Dado que la revisión directa del griego está pendiente, las decisiones se apoyan prudentemente en el testimonio inglés público suministrado y señalan en notas las ambigüedades principales.
