base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: es
  text: 'De ahora en adelante, es razonable que despertemos y recobremos la sobriedad mientras [aún] tengamos tiempo para arrepentirnos y volvernos a Dios. Es bueno reconocer a Dios y al obispo. Quien honra al obispo es honrado por Dios; quien hace algo sin que el obispo lo sepa sirve al diablo.


    Por tanto, que todas las cosas les abunden en gracia, pues son dignos. Ustedes me reconfortaron en todo, y Jesucristo los reconfortará. Tanto en mi ausencia como en mi presencia me trataron con afecto. Que Dios los recompense; si por causa de él soportan todas las cosas, llegarán hasta él.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness
  choice: despertemos y recobremos la sobriedad
  rationale: 'Conserva las dos imágenes del testimonio: despertar y entrar en un estado de sensatez o vigilancia sobria.'
- source_word: recognize
  choice: reconocer
  rationale: Mantiene el sentido amplio del testimonio sin reducirlo a obedecer, someterse o aceptar la autoridad.
- source_word: without the knowledge
  choice: sin conocimiento
  rationale: Expresa que la acción se realiza sin que el obispo esté enterado, sin añadir necesariamente la idea más fuerte de falta de permiso.
- source_word: rendereth service
  choice: sirve
  rationale: Equivalente natural y directo que conserva la fuerte contraposición moral del pasaje.
- source_word: refreshed
  choice: reconfortaron / reconfortará
  rationale: Reproduce la reciprocidad verbal del testimonio en un español natural.
- source_word: cherished
  choice: me trataron con afecto
  rationale: Comunica cuidado afectuoso sin el matiz romántico que podría adquirir «me amaron».
- source_word: attain unto Him
  choice: llegarán hasta él
  rationale: Conserva la imagen de alcanzar o llegar a Dios sin especificar indebidamente el modo teológico.
theological_decisions:
- issue: Relación entre Dios y el obispo
  choice: «reconocer a Dios y al obispo»
  alternative: «obedecer a Dios y al obispo»
  rationale: El testimonio suministrado dice «recognize»; la traducción evita convertir una afirmación de reconocimiento en una formulación explícita de obediencia.
- issue: Actuar sin conocimiento del obispo
  choice: «sin conocimiento del obispo»
  alternative: «sin autorización del obispo»
  rationale: «Autorización» resolvería la frase en favor de una estructura jurídica más precisa que la expresada por el testimonio.
- issue: Antecedente de «por cuya causa»
  choice: «si por causa de él… llegarán hasta él»
  alternative: «si por causa de Dios… llegarán a Dios»
  rationale: Se conserva la referencia pronominal del testimonio. Aunque el antecedente más cercano es Dios, no se sustituye silenciosamente el pronombre por un nombre explícito.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene «obispo» por su valor histórico y eclesial. El pronombre «ustedes» corresponde al plural del destinatario. Los corchetes en «[aún]» conservan la señal de restauración del testimonio inglés, ya que la revisión directa del griego sigue pendiente.
