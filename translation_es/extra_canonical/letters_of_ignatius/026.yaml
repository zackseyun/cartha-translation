source:
  text: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
