  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: es
  text: 'Sí, también conviene que ustedes no se aprovechen de la juventud de su obispo, sino que, conforme al poder de Dios Padre, le muestren toda reverencia. Según he sabido, los santos presbíteros tampoco se han aprovechado de su juventud visible, sino que le ceden el lugar como a alguien prudente en Dios; pero no a él, sino al Padre de Jesucristo, el Obispo de todos.


    Por tanto, en honor de aquel que los quiso,[a] conviene que obedezcan sin fingimiento. Porque quien actúa así no engaña tanto a este obispo visible como defrauda al invisible; y en tal caso no tiene que rendir cuentas a un ser humano,[b] sino a Dios, que conoce lo oculto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «aquel que los quiso» también puede entenderse como «aquel que los eligió» o «aquel que se agradó de ustedes». El referente exacto no es seguro en el testimonio disponible.
    reason: Preserva una ambigüedad léxica y referencial que no debe resolverse antes de la revisión directa del griego.
  - marker: b
    text: Literalmente, «con carne». Aquí se refiere al plano humano, en contraste con rendir cuentas a Dios.
    reason: Aclara una metáfora antigua que una traducción literal podría volver opaca para lectores modernos.
lexical_decisions:
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva el término eclesial antiguo sin identificarlo de manera exclusiva con una estructura denominacional moderna.
- source_word: render unto him all reverence
  choice: le muestren toda reverencia
  rationale: Expresa respeto profundo en español natural sin convertirlo en adoración.
- source_word: give place to him
  choice: le ceden el lugar
  rationale: Mantiene la imagen de reconocer su posición y autoridad, sin sobreexplicarla.
- source_word: without dissimulation
  choice: sin fingimiento
  rationale: Comunica una obediencia sincera, no meramente externa o simulada.
- source_word: flesh
  choice: un ser humano
  rationale: En este contexto, la oposición es entre rendir cuentas ante una autoridad humana y ante Dios; una traducción estrictamente literal con «carne» sería poco clara en español actual.
theological_decisions:
- issue: La autoridad del joven obispo
  choice: Se conserva la exhortación a reverenciarlo y obedecerlo conforme al poder de Dios Padre.
  alternative: Explicitar que toda obediencia al obispo equivale directamente a obediencia a Dios.
  rationale: El pasaje relaciona ambas autoridades, pero mantiene su distinción; no conviene formular una equivalencia absoluta que el texto no declara.
- issue: Identidad de «aquel que los quiso»
  choice: Se mantiene la referencia ambigua.
  alternative: Identificar al referente como Dios Padre o Jesucristo.
  rationale: El testimonio inglés suministrado no permite resolver con seguridad el referente, y la revisión directa del griego está pendiente.
- issue: «El Obispo de todos»
  choice: Se conserva como título aplicado al Padre de Jesucristo.
  alternative: Generalizarlo como «el supervisor de todos» o reasignarlo a Cristo.
  rationale: La sintaxis del testimonio vincula el título con el Padre; «Obispo» conserva además la correspondencia retórica con el obispo visible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conservan «obispo» y «presbíteros» como vocabulario histórico-eclesial. La redacción es provisional porque el expediente indica que la revisión directa de la fuente griega aún está pendiente.
