review_pass:
  verdict: revise
  source_fidelity: La traducción refleja en general la argumentación y conserva correctamente la distinción retórica entre el obispo visible y Dios, «el Obispo de todos». Sin embargo, «quien actúa así» introduce una formulación no presente en el testimonio y debilita la referencia a quien engaña/defrauda. Además, «un ser humano» sustituye la metáfora deliberada «carne»; conviene conservarla en el texto y explicarla en nota.
  naturalness: El registro es claro y apropiado para español latinoamericano. «Su juventud visible» suena poco idiomático y puede reemplazarse por «su condición exteriormente juvenil». «No tendrá que vérselas con la carne» conserva el contraste antiguo y sigue siendo comprensible con nota.
  terminology: «Obispo», «presbíteros», «reverencia» y «sin fingimiento» son elecciones adecuadas. Se conserva «el Obispo de todos» como título retórico aplicado al Padre de Jesucristo, sin imponer una interpretación eclesiológica posterior.
  issues:
  - severity: medium
    issue: «Quien actúa así» no corresponde de manera precisa al sujeto y a la acción expresados en el testimonio.
    rationale: El texto contrasta engañar a «este obispo que se ve» con defraudar al invisible. La reformulación añade una acción genérica y oscurece ese contraste.
  - severity: medium
    issue: «Un ser humano» reemplaza «carne».
    rationale: Aunque aclara el sentido, elimina la metáfora y el contraste léxico de la fuente. Es preferible traducir «carne» y explicarlo en una nota.
  - severity: low
    issue: «Su juventud visible» resulta poco natural y es semánticamente impreciso.
    rationale: «Outwardly youthful condition/estate» alude a una condición o apariencia exteriormente juvenil, no a una «juventud visible» como entidad.
  revised_text: 'Sí, también conviene que ustedes no se aprovechen de la juventud de su obispo, sino que, conforme al poder de Dios Padre, le muestren toda reverencia. He sabido que los santos presbíteros tampoco se han aprovechado de su condición exteriormente juvenil, sino que le ceden el lugar como a alguien prudente en Dios; pero no a él, sino al Padre de Jesucristo, el Obispo de todos.


    Por tanto, para honrar a aquel que los quiso,[a] conviene que obedezcan sin fingimiento. Porque nadie engaña tanto a este obispo visible como defrauda al invisible; y, en tal caso, no tendrá que vérselas con la carne,[b] sino con Dios, que conoce lo oculto.'
  revised_footnotes:
  - marker: a
    text: La expresión «aquel que los quiso» también puede entenderse como «aquel que los eligió» o «aquel que se agradó de ustedes». El referente exacto no es seguro en el testimonio disponible.
    reason: Preserva la ambigüedad léxica y referencial sin identificar anticipadamente al referente.
  - marker: b
    text: Literalmente, «con la carne». En este contexto, la expresión contrasta el plano humano con Dios, que conoce lo oculto.
    reason: Conserva la metáfora de la fuente y ofrece la aclaración necesaria para lectores modernos.
  revision_rationale: Se ajusta el cierre para reproducir el contraste entre el obispo visible y el invisible sin añadir «quien actúa así». Se restituye «carne» en el texto, con una nota explicativa, y se mejora la naturalidad de la referencia a la condición juvenil exterior. La expresión ambigua sobre «aquel que los quiso» y el título «el Obispo de todos» se mantienen sin resolución doctrinal.
