base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: es
  text: 'Pero algunos, por ignorancia, lo niegan; o más bien, él los ha negado a ellos, pues son defensores de la muerte más que de la verdad. No han sido persuadidos ni por las profecías ni por la ley de Moisés, ni siquiera hasta el día de hoy por el evangelio ni por los padecimientos de cada uno de nosotros; pues también respecto de nosotros piensan lo mismo.


    ¿De qué me sirve que alguien me elogie, si blasfema contra mi Señor y no confiesa que él es portador de carne[a]? Pues quien no afirma esto lo niega por completo, siendo él mismo portador de un cadáver[b].


    No he considerado conveniente poner por escrito los nombres de esos incrédulos; es más, ¡lejos esté de mí siquiera recordarlos!, hasta que se arrepientan y vuelvan a la pasión[c], que es nuestra resurrección.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «portador de carne». La expresión afirma que Cristo tuvo carne verdadera y se contrapone a «portador de un cadáver» en la frase siguiente.
    reason: Restituye la forma predicativa y el paralelismo léxico del original.
  - marker: b
    text: Lit. «portador de un cadáver». La imagen establece un contraste deliberado con «portador de carne».
    reason: Explica el juego de palabras sin atenuar la imagen.
  - marker: c
    text: La expresión es deliberadamente condensada; en el contexto se refiere a la pasión de Cristo.
    reason: Ofrece la aclaración contextual con cautela y conserva la formulación del texto.
lexical_decisions:
- source_word: σαρκοφόρον (sarkophóron)
  choice: llevó carne
  rationale: Conserva la imagen concreta de «portar/llevar carne» y la afirmación de la encarnación real, sin sustituirla por una formulación doctrinal más desarrollada.
- source_word: νεκροφόρος (nekrophóros)
  choice: lleva un cadáver
  rationale: 'Mantiene el contraste retórico y el juego léxico con «llevó carne»: quien niega la carne viviente de Cristo es presentado como portador de un cuerpo muerto.'
- source_word: συνήγοροι τοῦ θανάτου
  choice: Defienden la muerte
  rationale: Expresa de modo natural la función de abogado, partidario o defensor que comunica συνήγοροι, conservando la oposición con la verdad.
- source_word: κατ’ ἄνδρα παθήματα
  choice: los sufrimientos que cada uno de nosotros padece
  rationale: Hace explícito en español el sentido distributivo, sin reducir la referencia a un único sufrimiento colectivo.
- source_word: εἰς τὸ πάθος
  choice: vuelvan a la pasión
  rationale: Preserva la expresión abrupta y teológicamente cargada que identifica la pasión de Cristo como punto de retorno.
theological_decisions:
- issue: La negación recíproca entre ciertas personas y Cristo
  choice: «lo niegan; o más bien, él los ha negado a ellos»
  alternative: «lo desconocen; o más bien, él los desconoce»
  rationale: Se conserva la fuerza de «negar» y la inversión deliberada de la frase, sin suavizar el juicio teológico.
- issue: Realidad corporal de Cristo
  choice: «no confiesa que él llevó carne»
  alternative: «no confiesa que vino en carne»
  rationale: La alternativa es más idiomática y evoca lenguaje neotestamentario, pero elimina la singular metáfora de «portador de carne» y debilita su contraste con «portador de un cadáver».
- issue: La pasión como «nuestra resurrección»
  choice: «la pasión, que es nuestra resurrección»
  alternative: «la pasión, por la cual resucitamos»
  rationale: La traducción mantiene la identificación paradójica del texto y no la convierte en una explicación causal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la dureza polémica, las repeticiones y las imágenes corporales del pasaje. La traducción se cotejó con el texto griego conocido de la recensión media, aunque los datos suministrados indican que la revisión formal de la fuente griega sigue pendiente; por ello no se introdujeron conjeturas que resolvieran las tensiones del testimonio.
