revisions:
- from: 'Pero algunos, por ignorancia, lo niegan; o más bien, él los ha negado a ellos. Defienden la muerte en vez de la verdad. No los han convencido ni las profecías, ni la ley de Moisés, ni, hasta el día de hoy, el evangelio, ni tampoco los sufrimientos que cada uno de nosotros padece, pues acerca de nosotros piensan de la misma manera.


    ¿De qué me sirve que alguien me elogie si blasfema contra mi Señor y no confiesa que él llevó carne[a]? Quien no afirma esto lo niega por completo, mientras él mismo lleva un cadáver[b].


    No me ha parecido bien poner por escrito los nombres de esos incrédulos. Es más, ¡que ni siquiera llegue yo a recordarlos!, hasta que se arrepientan y vuelvan a la pasión[c], que es nuestra resurrección.'
  to: 'Pero algunos, por ignorancia, lo niegan; o más bien, él los ha negado a ellos, pues son defensores de la muerte más que de la verdad. No han sido persuadidos ni por las profecías ni por la ley de Moisés, ni siquiera hasta el día de hoy por el evangelio ni por los padecimientos de cada uno de nosotros; pues también respecto de nosotros piensan lo mismo.


    ¿De qué me sirve que alguien me elogie, si blasfema contra mi Señor y no confiesa que él es portador de carne[a]? Pues quien no afirma esto lo niega por completo, siendo él mismo portador de un cadáver[b].


    No he considerado conveniente poner por escrito los nombres de esos incrédulos; es más, ¡lejos esté de mí siquiera recordarlos!, hasta que se arrepientan y vuelvan a la pasión[c], que es nuestra resurrección.'
  rationale: 'Se corrige de forma segura el principal problema de fidelidad: los dos compuestos griegos deben conservarse como predicados paralelos («es portador de carne» / «portador de un cadáver»), no como «llevó» frente a «lleva». También se ajustan «defensores», la pasiva «han sido persuadidos» y la exclamación final para reflejar mejor el tono y la sintaxis del testimonio, manteniendo la aspereza polémica y las ambigüedades del pasaje.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:00:27Z'
review_pass:
  verdict: revise
  source_fidelity: La traducción conserva bien el argumento, las antítesis («muerte»/«verdad»; «carne»/«cadáver») y la identificación final de la pasión con «nuestra resurrección». No obstante, σαρκοφόρον y νεκροφόρος son predicados nominales en presente («portador de...»), no acciones pasadas o verbos plenos. «Llevó carne» debilita además el juego formal deliberado entre ambos términos. «No los han convencido» comunica el sentido, pero «no han sido persuadidos» refleja mejor la construcción pasiva sin resultar antinatural en este registro.
  naturalness: 'El español es generalmente claro y actual. «Él llevó carne» resulta menos natural y menos preciso que «él es portador de carne», aunque la nota ayuda. «Que ni siquiera llegue yo a recordarlos» añade un matiz prospectivo que no está expresado: el giro enfático pide más directamente «¡lejos esté de mí siquiera recordarlos!».'
  terminology: «Defensores de la muerte» conserva de manera más visible el valor de συνήγοροι que «Defienden la muerte». Se mantienen «ley de Moisés», «evangelio», «pasión» y «resurrección». «Portador de carne» y «portador de un cadáver» deben usarse paralelamente en el texto, con notas breves que expliquen la imagen sin convertirla en una fórmula doctrinal ampliada.
  issues:
  - severity: medium
    issue: «él llevó carne» traduce σαρκοφόρον como acción pasada.
    rationale: El griego emplea un predicado nominal, literalmente «portador de carne», y lo contrapone inmediatamente a νεκροφόρος, «portador de un cadáver». El presente «es portador» preserva tanto la forma como el contraste.
  - severity: medium
    issue: «mientras él mismo lleva un cadáver» no reproduce la simetría predicativa completa.
    rationale: Aunque capta la imagen, «es él mismo portador de un cadáver» corresponde mejor al paralelismo de los dos adjetivos compuestos.
  - severity: low
    issue: «Que ni siquiera llegue yo a recordarlos» introduce una orientación futura.
    rationale: El énfasis de μὴ γένοιτό μοι... μνημονεύειν expresa rechazo vehemente a recordarlos, no específicamente que ello no llegue a suceder en adelante.
  - severity: low
    issue: La nota c presenta una explicación interpretativa como equivalente directo.
    rationale: «Vuelvan a la pasión» se conserva correctamente, pero la nota debe identificar la explicación como contextual y no sustituir la expresión condensada del autor.
