base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: es
  text: Puesto que todas las cosas tienen un fin, y estas dos —la vida y la muerte— están puestas juntamente ante nosotros, cada uno irá a su propio lugar. Pues así como hay dos tipos de moneda, una de Dios y otra del mundo, y cada una lleva grabado su sello propio, así los incrédulos llevan el sello de este mundo, mientras que los fieles llevan, en amor, el sello de Dios Padre por medio de Jesucristo. Si por medio de él no aceptamos libremente morir con respecto a su pasión, su vida no está en nosotros…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο νομίσματα (reflejado por “two coinages” en el testimonio)
  choice: dos tipos de moneda
  rationale: Conserva la metáfora monetaria y permite entender naturalmente que se trata de dos emisiones o pertenencias distintas, no simplemente de dos monedas individuales.
- source_word: χαρακτήρ / stamp (según el testimonio)
  choice: sello
  rationale: “Sello” comunica una marca impresa que identifica pertenencia; la repetición mantiene la estructura de la metáfora.
- source_word: ἴδιος τόπος / own place (según el testimonio)
  choice: su propio lugar
  rationale: Preserva la formulación deliberadamente abierta sin especificar destino, juicio o morada.
- source_word: ἑκουσίως / of our own free choice (según el testimonio)
  choice: libremente
  rationale: Expresa voluntad propia de manera natural y digna, sin convertir la frase en una afirmación doctrinal técnica sobre el libre albedrío.
- source_word: εἰς τὸ πάθος αὐτοῦ ἀποθανεῖν / die unto his passion (reconstruido desde el testimonio)
  choice: morir con respecto a su pasión
  rationale: Mantiene la expresión difícil y su relación con la pasión de Cristo, evitando interpretarla de forma más específica de lo que permite la evidencia suministrada.
theological_decisions:
- issue: Relación de los fieles con el sello de Dios
  choice: los fieles llevan, en amor, el sello de Dios Padre por medio de Jesucristo
  alternative: los fieles en amor llevan el sello de Dios Padre
  rationale: La puntuación elegida vincula “en amor” con la manera en que los fieles llevan el sello, pero sin eliminar por completo la posible relación del amor con “los fieles” como caracterización.
- issue: Participación voluntaria en la pasión de Cristo
  choice: Si por medio de él no aceptamos libremente morir con respecto a su pasión
  alternative: si no escogemos voluntariamente morir a semejanza de su pasión
  rationale: Se evita añadir “a semejanza de”, que resolvería la relación de manera interpretativa. También se conserva “por medio de él” como referente posible de Jesucristo, aunque la sintaxis transmitida es difícil.
- issue: Vida de Cristo en los creyentes
  choice: su vida no está en nosotros
  alternative: no tenemos su vida en nosotros
  rationale: La formulación conserva directamente la afirmación ontológica y su tensión teológica, sin explicarla como mera posesión o conducta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la metáfora monetaria, la repetición de “sello” y la ambigüedad de “su propio lugar”. Los puntos suspensivos finales indican que el pensamiento continúa en la sección siguiente. El borrador es necesariamente provisional porque la revisión directa del griego fuente está pendiente y la base suministrada es un testimonio inglés de dominio público.
