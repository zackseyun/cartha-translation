base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: es
  text: Ignacio, llamado también Teóforo, a la que ha sido bendecida por la gracia de Dios Padre en Cristo Jesús, nuestro Salvador. En él saludo a la iglesia que está en Magnesia, junto al río Meandro, y le deseo abundantes saludos en Dios Padre y en Jesucristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La fuente indicada aclara que aún no se ha efectuado la revisión directa del griego, por lo que conviene advertir el carácter provisional del texto.
lexical_decisions:
- source_word: Ignatius, who is also Theophorus
  choice: Ignacio, llamado también Teóforo
  rationale: Conserva el nombre alternativo tradicional sin interpretar su posible sentido («portador de Dios»), dado que la revisión directa del griego está pendiente.
- source_word: unto her which hath been blessed
  choice: a la que ha sido bendecida
  rationale: Mantiene la personificación femenina de la iglesia presente en el testimonio suministrado y refleja el aspecto pasivo de la bendición.
- source_word: Magnesia on the Maeander
  choice: Magnesia, junto al río Meandro
  rationale: Distingue esta ciudad de otras llamadas Magnesia y expresa de manera natural su ubicación geográfica.
- source_word: abundant greeting
  choice: abundantes saludos
  rationale: Conserva la formulación intensificada del testimonio inglés sin convertirla en una bendición más específica que el texto disponible.
theological_decisions:
- issue: Relación de la gracia, el Padre y Cristo
  choice: por la gracia de Dios Padre en Cristo Jesús, nuestro Salvador
  alternative: por la gracia de Dios, el Padre de Jesucristo nuestro Salvador
  rationale: El testimonio suministrado vincula «Padre» con Dios y presenta «en Cristo Jesús» como esfera o medio de la bendición; se preserva esa estructura sin introducir otra relación sintáctica.
- issue: Antecedente de «en él»
  choice: En él saludo a la iglesia
  alternative: por medio de él saludo a la iglesia
  rationale: Se mantiene la amplitud semántica de la expresión, sin decidir si indica esfera, unión o mediación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la forma epistolar antigua y la personificación de la iglesia, pero se divide el período para facilitar la lectura. «Teóforo» se translitera y no se traduce en el cuerpo del texto.
