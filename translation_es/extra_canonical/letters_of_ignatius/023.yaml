review_pass:
  verdict: revise
  source_fidelity: La versión conserva correctamente el destinatario personificado, el nombre alternativo Teóforo, la identificación de Magnesia junto al Meandro y la fórmula final. Sin embargo, «por la gracia» interpreta como medio la preposición griega ἐν («en»); conviene conservar «en la gracia» para reflejar la formulación y no estrechar su relación sintáctica.
  naturalness: El español es claro, digno y apropiado para un encabezamiento epistolar antiguo. «Abundantes saludos» es comprensible, aunque «muchos saludos» resulta más idiomático como equivalente de la fórmula epistolar πλεῖστα χαίρειν.
  terminology: «Teóforo», «Dios Padre», «Cristo Jesús», «Salvador», «iglesia» y «Meandro» son adecuados. Se mantiene el femenino de la destinataria sin añadir una interpretación eclesiológica.
  issues:
  - severity: medium
    issue: «por la gracia» sustituye «en la gracia».
    rationale: El texto griego de la recensión media dice ἐν χάριτι. Aunque el testimonio inglés dice «through the grace», la traducción española debe conservar, cuando es natural, el valor locativo/esférico y la amplitud de ἐν.
  - severity: low
    issue: «abundantes saludos» suena menos idiomático que la fórmula epistolar usual.
    rationale: πλεῖστα χαίρειν expresa un deseo intensificado de saludo/bienestar; «muchos saludos» conserva la fuerza sin una literalidad poco natural.
  revised_text: Ignacio, llamado también Teóforo, a la que ha sido bendecida en la gracia de Dios Padre, en Cristo Jesús, nuestro Salvador. En él saludo a la iglesia que está en Magnesia, junto al río Meandro, y le deseo muchos saludos en Dios Padre y en Jesucristo.[a]
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa de la tradición manuscrita griega de la recensión media.
    reason: La documentación de la fuente indica que la revisión directa del griego sigue pendiente; la nota comunica con precisión el carácter provisional de esta traducción.
  revision_rationale: Se corrige «por la gracia» por «en la gracia» para conservar la preposición del texto griego y su posible amplitud semántica. Se ajusta la despedida a «muchos saludos», una fórmula epistolar más natural en español que mantiene la intensificación del original. No se resuelven de forma doctrinal las relaciones sintácticas de «Dios Padre», «en Cristo Jesús» ni «en él».
