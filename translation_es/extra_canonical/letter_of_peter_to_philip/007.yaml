translation:
  language: es
  text: 'Entonces los apóstoles dieron gracias al Señor con toda clase de alabanzas y regresaron a Jerusalén.


    Mientras bajaban por el camino —del monte hacia Jerusalén—, conversaban acerca de la luz que se había hecho visible. Surgió una discusión acerca del Señor, y decían:


    —Si él, nuestro Señor, sufrió, ¡cuánto más sufriremos nosotros!


    Pedro respondió:


    —Él sufrió por nosotros, y también nosotros tendremos que sufrir por ser pequeños.[a]


    Entonces les llegó una voz que dijo:


    —Muchas veces les advertí que tendrán que sufrir. Serán arrastrados a las sinagogas y ante los gobernadores, y eso les causará sufrimiento. Pero el que no sufra tampoco [será] [...] [... mi] Padre [...], para que pueda [...].[b]


    Sin embargo, los apóstoles se alegraron mucho y subieron a Jerusalén. Entraron en el templo, enseñaron la salvación en el nombre del Señor Jesucristo y sanaron a una multitud.


    Entonces Pedro comenzó a hablar y dijo a sus discípulos:


    —Cuando nuestro Señor Jesús habitó en el cuerpo, nos lo explicó todo, pues él mismo había descendido. Hermanos míos, escuchen atentamente mis palabras.


    Pedro quedó lleno de un Espíritu santo y habló así:


    «Nuestra luz, Jesús, descendió,[c]

    fue crucificado,

    llevó una corona de espinas,

    se vistió con un manto de púrpura,

    fue colgado de un madero,

    fue sepultado en una tumba

    y resucitó de entre los muertos.


    »Hermanos míos, Jesús es ajeno a un sufrimiento como este. Nosotros, en cambio, somos quienes hemos sufrido a causa de la transgresión de la Madre. Por eso, cuando estaba entre nosotros, él anunció todas las cosas de manera simbólica. El Señor Jesús, Hijo de la gloria inconmensurable del Padre, es el autor de nuestra vida.


    »Hermanos míos, no prestemos atención a esos impíos ni andemos en [...]».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «por ser pequeños» es inusual y puede tener un sentido técnico dentro de la obra; se ha conservado literalmente.
    reason: Preservar una ambigüedad léxica relevante sin sustituirla por una interpretación.
  - marker: b
    text: El manuscrito está gravemente dañado en esta oración. Los corchetes y puntos suspensivos indican texto perdido o reconstruido de manera incierta.
    reason: Advertir que la sintaxis y el sentido de la declaración no pueden recuperarse con seguridad.
  - marker: c
    text: El testimonio consultado presenta «[de]scendió», señal de una restauración editorial. Aquí se traduce «descendió» en el texto y se registra la incertidumbre en esta nota.
    reason: Mantener legibilidad en español sin ocultar que parte de la palabra fue restaurada.
  - marker: d
    text: El final del pasaje se ha perdido; la oración queda incompleta en el manuscrito.
    reason: Explicar la interrupción textual final.
lexical_decisions:
- source_word: on account of our being small
  choice: por ser pequeños
  rationale: Se conserva la formulación inusual y potencialmente técnica del testimonio, sin interpretarla como debilidad, inferioridad o insignificancia.
- source_word: dwelt in the body
  choice: habitó en el cuerpo
  rationale: Traducción formal que mantiene la posible tensión entre Jesús y el cuerpo, importante en el contexto conceptual de la obra.
- source_word: a holy Spirit
  choice: un Espíritu santo
  rationale: Se conserva el artículo indefinido del testimonio y no se identifica automáticamente la expresión con una formulación trinitaria posterior; la mayúscula mantiene la dignidad referencial.
- source_word: hanged on a tree
  choice: colgado de un madero
  rationale: «Madero» expresa el referente de tree en lenguaje religioso antiguo sin convertirlo simplemente en «cruz», ya mencionada en la línea anterior.
- source_word: alien to such suffering
  choice: ajeno a un sufrimiento como este
  rationale: Mantiene la afirmación difícil y su tensión con la descripción previa de la crucifixión, sin armonizarla teológicamente.
- source_word: trespass of the Mother
  choice: transgresión de la Madre
  rationale: Se preserva «Madre» como figura titulada y no se explica mediante un sistema cosmológico específico.
- source_word: author of our life
  choice: autor de nuestra vida
  rationale: Retiene la amplitud de «author», que puede sugerir originador, fundador o agente, sin reducirla a una sola lectura.
- source_word: Godless ones
  choice: impíos
  rationale: Opción natural y digna en español para quienes carecen de reverencia a Dios, evitando el giro más moderno y filosófico «ateos».
theological_decisions:
- issue: Relación de Jesús con el sufrimiento
  choice: «Jesús es ajeno a un sufrimiento como este»
  alternative: «Jesús no puede padecer de esta manera» o una armonización con su sufrimiento corporal
  rationale: El pasaje yuxtapone la crucifixión de Jesús con su ajenidad al sufrimiento. Se preserva esa tensión en vez de resolverla mediante una cristología determinada.
- issue: Sentido simbólico del anuncio de Jesús
  choice: «anunció todas las cosas de manera simbólica»
  alternative: «habló en parábolas» o «solo parecía sufrir»
  rationale: La traducción no deriva del texto una doctrina particular de apariencia corporal ni restringe el simbolismo al género parabólico.
- issue: Identidad de «la Madre»
  choice: Se mantiene «la Madre» sin glosa doctrinal
  alternative: Identificarla con Sofía, Eva, la materia u otra figura
  rationale: El fragmento no proporciona suficiente información para fijar la identidad; se conserva la referencia ambigua.
- issue: «un Espíritu santo»
  choice: Se preserva el artículo indefinido
  alternative: «el Espíritu Santo»
  rationale: Así se refleja la forma del testimonio disponible y se evita imponer una identificación teológica que requiere revisión directa del copto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» implícito en las formas verbales y «hermanos míos» para el tratamiento comunitario. El estilo poético de la confesión sobre Jesús se presenta en líneas breves. El borrador es provisional porque la revisión directa del copto sigue pendiente y la base suministrada es un testimonio inglés de dominio público. Se eliminaron los números de página manuscrita [4] y [5], se corrigió el error tipográfico «aptles» y se conservaron mediante notas las lagunas y restauraciones textuales.
