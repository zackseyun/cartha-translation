    reason: Explica la terminación incompleta y preserva sus marcas.
  revision_rationale: 'Se corrigen únicamente puntos seguros a partir del testimonio inglés: se restauran las marcas de laguna y de restauración, se evita una reconstrucción editorial de la frase dañada, y se reducen interpretaciones no exigidas por el texto. La formulación de la laguna central es deliberadamente poco fluida, ya que el manuscrito no permite una oración española normal y segura. La revisión directa del copto sigue siendo necesaria para confirmar vocabulario, alcance de las restauraciones y posibles diferencias entre los testigos.'
