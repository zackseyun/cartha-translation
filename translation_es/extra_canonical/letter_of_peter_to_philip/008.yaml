base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: es
  text: 'Pedro [entonces] reunió [a los demás] y dijo:


    —[Señor nuestro] Jesucristo, autor de nuestro descanso, concédenos un espíritu de comprensión, para que también nosotros podamos hacer prodigios.


    Entonces Pedro y los demás apóstoles lo vieron [a él]. Fueron llenos de un espíritu santo, y cada uno realizó sanidades. Salieron a proclamar al Señor Jesús; después volvieron a reunirse, se saludaron unos a otros y dijeron:


    —Amén.


    Entonces Jesús se hizo visible y les dijo:


    —La paz sea con [todos] ustedes y con todos los que son fieles en mi nombre. Cuando partan, tendrán alegría, gracia y poder. No tengan miedo. Miren, yo estaré con ustedes siempre.


    Entonces los apóstoles se separaron para llevar cuatro mensajes[a] y predicar. Y fueron en paz, con el poder de Jesús.


    Carta de Pedro a Felipe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés disponible dice literalmente «en cuatro mensajes». La expresión es difícil; podría aludir a una distribución en cuatro encargos o direcciones de predicación. Se conserva «cuatro mensajes» a la espera de una revisión directa del copto.
    reason: Señalar una lectura textualmente incierta sin sustituirla por una conjetura fluida.
lexical_decisions:
- source_word: repose
  choice: descanso
  rationale: Conserva el sentido de reposo o descanso escatológico sin explicarlo mediante una formulación doctrinal más específica.
- source_word: spirit of insight
  choice: espíritu de comprensión
  rationale: Expresa una capacidad concedida para comprender; evita el tecnicismo «intelecto» y no identifica de manera automática este espíritu con el Espíritu Santo.
- source_word: miracles
  choice: prodigios
  rationale: Es natural y digno en español, y mantiene la referencia a obras extraordinarias sin confundirla con las sanidades mencionadas después.
- source_word: a holy Spirit
  choice: un espíritu santo
  rationale: Mantiene el artículo indefinido y la ambigüedad del testimonio inglés disponible, en vez de convertirlo silenciosamente en el nombre propio «el Espíritu Santo».
- source_word: became visible
  choice: se hizo visible
  rationale: Reproduce la formulación que enfatiza la manifestación visible, en lugar de reducirla simplemente a «apareció».
- source_word: four messages
  choice: cuatro mensajes
  rationale: Conserva la lectura difícil del testimonio público disponible y evita sustituirla sin respaldo copto por «cuatro misiones».
theological_decisions:
- issue: Identidad del «espíritu santo»
  choice: «un espíritu santo», en minúsculas
  alternative: «el Espíritu Santo»
  rationale: El testimonio suministrado presenta una forma indefinida. La traducción conserva esa tensión y no impone una identificación trinitaria que requeriría revisión directa del copto.
- issue: Alcance de la promesa de presencia
  choice: «yo estaré con ustedes siempre»
  alternative: «yo estaré continuamente con ustedes»
  rationale: «Siempre» comunica naturalmente la continuidad de la promesa sin especificar un límite temporal no expresado.
- issue: Naturaleza del «descanso»
  choice: Se conserva «descanso» sin glosa doctrinal
  alternative: «salvación», «reposo celestial» o «liberación»
  rationale: El término puede tener resonancias soteriológicas, pero el texto no las define aquí; explicarlas en el cuerpo resolvería indebidamente la ambigüedad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron entre corchetes las restauraciones visibles pertinentes del testimonio suministrado. El pasaje se tradujo desde la evidencia pública disponible, pero la revisión directa del copto sigue pendiente; por ello se evitaron reconstrucciones o precisiones doctrinales no verificables. La selección sigue el alcance de la conclusión breve reflejada en la capa inglesa auditada y concluye con el colofón.
