source:
  text: “Now, concerning the fullness, it is I, [even] I, who was dispatched down into the body for the sake of this seed that had been lost, and I descended to their mortal mold. They, however, failed to notice me, imagining me to be a mortal person. I spoke with the one who is mine, and he paid attention to me, just like you, too, who have paid attention this day. I granted him authority to come into the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] by means of his salvation. Given that he was deficiency, he turned into fullness.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex VIII,2 and Codex Tchacos
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/the-letter-of-peter-to-philip
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: “Now, concerning the fullness, it is I, [even] I, who was dispatched down into the body for the sake of this seed that had been lost, and I descended to their mortal mold. They, however, failed to notice me, imagining me to be a mortal person. I spoke with the one who is mine, and he paid attention to me, just like you, too, who have paid attention this day. I granted him authority to come into the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] by means of his salvation. Given that he was deficiency, he turned into fullness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: es
  text: Ahora bien, en cuanto a la plenitud, yo, [sí,] yo fui enviado al cuerpo por causa de esta semilla que se había perdido, y descendí a su molde mortal. Pero ellos no me reconocieron, pues pensaban que yo era una persona mortal. Hablé con el que me pertenece, y él me prestó atención, así como ustedes también me han prestado atención hoy. Le di autoridad para entrar en la herencia de su paternidad, y tomé [a este] [] [. . .] lleno [. . .] por medio de su salvación. Puesto que él era deficiencia, se convirtió en plenitud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un testimonio inglés de dominio público; está pendiente la revisión directa del copto. Los corchetes vacíos y las elipsis entre corchetes reproducen señales de laguna o daño textual en el testimonio. La sintaxis de «y tomé [a este] [] [. . .] lleno [. . .] por medio de su salvación» es fragmentaria e incierta.
    reason: Advierte sobre la base indirecta de la traducción y preserva transparentemente el estado dañado del manuscrito sin reconstruir contenido no atestiguado.
lexical_decisions:
- source_word: fullness
  choice: plenitud
  rationale: Conserva el término conceptual del testimonio y su contraste explícito con «deficiencia», sin interpretarlo mediante terminología doctrinal añadida.
- source_word: dispatched down into the body
  choice: enviado al cuerpo
  rationale: Expresa con naturalidad el movimiento descendente ya reiterado por «descendí», evitando una redundancia pesada; el sentido de envío queda intacto.
- source_word: seed
  choice: semilla
  rationale: Mantiene la imagen concreta y su posible valor técnico sin explicitar una identidad que el pasaje no define.
- source_word: mortal mold
  choice: molde mortal
  rationale: Preserva la metáfora inusual del testimonio en vez de normalizarla como «cuerpo» o «forma humana».
- source_word: failed to notice me
  choice: no me reconocieron
  rationale: En contexto, comunica que no percibieron su verdadera identidad; se mantiene la tensión con la apariencia de una persona mortal.
- source_word: the one who is mine
  choice: el que me pertenece
  rationale: Traducción natural que conserva la relación posesiva sin identificar al referente.
- source_word: fatherhood
  choice: paternidad
  rationale: Retiene el sustantivo abstracto y su ambigüedad conceptual, sin sustituirlo por «Padre» o «patrimonio paterno».
- source_word: deficiency
  choice: deficiencia
  rationale: Mantiene el contraste terminológico directo con «plenitud» y evita explicar anticipadamente su posible sentido cosmológico.
theological_decisions:
- issue: Identidad del hablante y del destinatario singular
  choice: No identificarlos en la traducción
  alternative: Explicitar al hablante como Cristo y al destinatario como una figura concreta
  rationale: El fragmento suministrado no los nombra; explicitarlos importaría una interpretación externa.
- issue: Sentido de «plenitud» y «deficiencia»
  choice: Conservar ambos como términos correlativos sin glosa doctrinal en el texto
  alternative: Interpretarlos como estados morales, ontológicos o cosmológicos específicos
  rationale: El contraste es genuino, pero su alcance preciso no queda resuelto por este pasaje ni por la base lingüística provisional.
- issue: «Herencia de su paternidad»
  choice: Mantener la formulación abstracta y ambigua
  alternative: Traducir «herencia de su Padre»
  rationale: La alternativa resolvería una posible relación teológica que el testimonio inglés no establece inequívocamente.
- issue: Agencia en la salvación
  choice: Traducir «por medio de su salvación» sin definir de quién procede ni cómo opera
  alternative: Reformular como «porque fue salvado» o «mediante la salvación que él otorgó»
  rationale: La frase y su entorno están dañados; conviene no fijar una lectura soteriológica más específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las metáforas y los pares conceptuales llamativos del testimonio. Debido a que la revisión del copto está pendiente, la redacción evita afirmaciones filológicas más precisas de lo que permite la evidencia suministrada.
