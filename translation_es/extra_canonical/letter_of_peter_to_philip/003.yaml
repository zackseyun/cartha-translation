    ¿Cómo partiremos?


    [a] ¿Cómo llegamos a tener autoridad para hablar con franqueza?


    ¿Por qué luchan contra nosotros las potencias?».


    Entonces una voz procedente de la luz clamó a ellos y dijo: «Ustedes son quienes dan testimonio de que les he hablado de todas estas cosas; pero, debido a su falta de fe, volveré a decirles estas cosas».'
  revised_footnotes:
