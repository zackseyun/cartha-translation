translation:
  language: es
  text: 'Entonces se hizo visible una luz resplandeciente, y el monte brilló ante la aparición de aquel que se había manifestado. Una voz los llamó y dijo:


    «Presten atención a mis palabras, para que pueda hablarles.

    ¿Por qué me buscan?

    Yo soy Jesucristo, el que permanece siempre con ustedes».


    Los apóstoles respondieron:


    «Señor, quisiéramos comprender la deficiencia de los eones,

    así como su plenitud,

    y cómo se nos retiene en esta morada.

    ¿Cómo llegamos a este lugar?

    ¿Cómo saldremos de aquí?

    [a] ¿Cómo llegamos a tener autoridad para hablar con franqueza?

    ¿Por qué luchan contra nosotros las potencias?».


    Entonces una voz procedente de la luz los llamó y dijo: «Ustedes son quienes dan testimonio de que les he dicho todas estas cosas; pero, debido a su falta de fe, volveré a decírselas».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquí el testimonio señala una laguna o un pasaje dañado antes de la pregunta. No se ha intentado reconstruir el texto perdido.
    reason: Preservar de manera visible la señal de daño o restauración manuscrita indicada en el material de base.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico de la cosmología del escrito sin reducirlo a “edades” ni identificarlo de manera prematura con seres o ámbitos específicos.
- source_word: deficiency / fullness
  choice: deficiencia / plenitud
  rationale: Mantiene el contraste conceptual del testimonio, que puede tener sentido cosmológico y teológico, sin explicarlo dentro del texto.
- source_word: dwelling-place
  choice: morada
  rationale: Es una expresión digna y natural que conserva la posible dimensión espacial o existencial del término.
- source_word: authority for boldness of speech
  choice: autoridad para hablar con franqueza
  rationale: Expresa tanto la autorización o facultad como la libertad valiente de hablar, evitando el tecnicismo poco accesible “parresía”.
- source_word: powers
  choice: potencias
  rationale: Conserva el carácter de entidades o fuerzas supraindividuales propio del contexto, sin convertirlas simplemente en autoridades humanas.
- source_word: unfaithfulness
  choice: falta de fe
  rationale: Preserva la ambigüedad entre incredulidad, desconfianza e infidelidad sin endurecerla innecesariamente como “deslealtad”.
theological_decisions:
- issue: Naturaleza de los eones
  choice: Mantener “eones” sin definición interpretativa
  alternative: Traducir “edades”, “mundos” o “seres celestiales”
  rationale: El pasaje no determina por sí solo una única ontología de los eones; una equivalencia técnica conserva esa tensión.
- issue: Identidad y función de las potencias
  choice: Traducir “potencias” sin calificarlas como demoníacas
  alternative: “Poderes malignos” o “demonios”
  rationale: Aunque son hostiles en el pasaje, el testimonio suministrado no justifica imponerles una clasificación doctrinal más precisa.
- issue: Sentido de unfaithfulness
  choice: “falta de fe”
  alternative: “incredulidad” o “infidelidad”
  rationale: La opción elegida deja abierta la relación entre no creer, no confiar y no mantenerse fieles.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva el paralelismo de las preguntas y el vocabulario cosmológico del escrito. Este borrador es provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa del copto está pendiente.'
