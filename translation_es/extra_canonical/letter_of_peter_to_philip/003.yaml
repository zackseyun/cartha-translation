  revision_rationale: 'La revisión se limita a ajustes seguros de fidelidad respecto del testimonio inglés suministrado: restituye la causalidad vinculada con la visión del que se hizo visible, traduce con mayor fuerza el verbo de clamar y refleja la cortesía de la solicitud apostólica. Conserva los tecnicismos cosmológicos, la ambigüedad de «falta de fe» y el marcador de laguna sin reconstruir contenido ausente.'
