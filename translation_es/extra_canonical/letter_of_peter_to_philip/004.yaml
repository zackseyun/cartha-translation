translation:
  language: es
  text: '«Ahora bien, en cuanto a [la deficiencia] de los eones, esta es la deficiencia: cuando se manifestaron la rebeldía y la irreflexión de la Madre, al margen del orden de la Grandeza del Padre, ella quiso establecer eones. Cuando habló, el tirano la siguió; pero, cuando ella dejó una parte, el tirano se apoderó de ella, y esta se convirtió en una deficiencia. Esta es la deficiencia de los eones.


    »Cuando el tirano tomó una parte, la plantó, puso sobre ella poderes y autoridades, y la confinó dentro de los eones mortales. Todos los poderes cósmicos se llenaron de alegría por haber sido producidos. […] Sin embargo, ignoraban al [Padre] preexistente, pues eran ajenos a él. [En cambio, a este] (tirano) se le concedió poder, y ellos lo adoraron y lo alabaron.


    »Entonces la mente del tirano se volvió arrogante a causa de las alabanzas de los poderes. Se hizo adversario y quiso sustituir una imagen [por otra imagen] y una forma por otra forma. Luego encargó a los poderes que estaban bajo su autoridad que modelaran cuerpos mortales, y estos llegaron a existir a partir de una disparidad de la semejanza que había sido producida».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado; está pendiente la revisión directa del copto. Los corchetes dentro del pasaje señalan texto restaurado o una laguna del manuscrito; «[…]» representa una laguna sin texto reconstruido.
    reason: Informa con transparencia la base provisional y conserva las señales de daño o restauración textual.
lexical_decisions:
- source_word: deficiency
  choice: deficiencia
  rationale: Conserva el término conceptual repetido y su vínculo verbal dentro del pasaje, sin interpretarlo como pecado, caída o carencia de una clase específica.
- source_word: aeons
  choice: eones
  rationale: Usa la transliteración asentada para las realidades o edades del marco cosmológico del escrito, sin reducirlas a simples períodos temporales.
- source_word: defiance and thoughtlessness
  choice: rebeldía e irreflexión
  rationale: Expresa tanto la oposición al orden como la falta de reflexión, evitando añadir una calificación doctrinal no presente.
- source_word: the tyrannical one
  choice: el tirano
  rationale: Ofrece una designación natural y digna en español, manteniendo el carácter titular de la expresión.
- source_word: powers and authorities
  choice: poderes y autoridades
  rationale: Mantiene dos categorías diferenciadas y evita identificarlas con seres o instituciones más específicos.
- source_word: pre-existent Father
  choice: '[Padre] preexistente'
  rationale: Conserva tanto la prioridad de existencia como la señal editorial de restauración alrededor de «Padre».
- source_word: disparity of the likeness
  choice: una disparidad de la semejanza
  rationale: Preserva la formulación difícil y su ambigüedad conceptual en vez de normalizarla como copia imperfecta o deformidad.
theological_decisions:
- issue: Relación de la Madre con el orden del Padre
  choice: «al margen del orden de la Grandeza del Padre»
  alternative: «contra el orden de la Grandeza del Padre»
  rationale: «Al margen de» conserva la posibilidad de separación o independencia sin intensificar necesariamente la frase hasta convertirla en oposición directa.
- issue: Identidad del tirano
  choice: No identificarlo con ninguna figura nombrada
  alternative: Explicitar que es el demiurgo, Satanás u otra figura cosmológica
  rationale: El fragmento lo denomina por su función o carácter; identificarlo resolvería una cuestión que este pasaje deja implícita.
- issue: Objeto de la adoración
  choice: «ellos lo adoraron y lo alabaron»
  alternative: Precisar quiénes son «ellos» o dar un sentido atenuado a «adoraron»
  rationale: Se conserva la referencia pronominal y la fuerza cultual del testimonio sin introducir una explicación doctrinal.
- issue: Origen de los cuerpos mortales
  choice: «llegaron a existir a partir de una disparidad de la semejanza»
  alternative: «fueron creados como copias defectuosas del modelo»
  rationale: La alternativa explicaría demasiado una expresión oscura; la redacción elegida mantiene su tensión y dificultad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron «eones» y las mayúsculas conceptuales de «Madre», «Grandeza» y «Padre». La sintaxis se hizo fluida sin eliminar las repeticiones deliberadas ni aclarar expresiones cosmológicas genuinamente ambiguas.
