  source_fidelity: 'El texto español reproduce fielmente el testimonio inglés suministrado: conserva la reunión en el monte de los Olivos, la referencia a Cristo «cuando habitaba en el cuerpo», las invocaciones repetidas, «los incorruptibles», la súplica ante la amenaza de muerte y la aposición inusual «Hijo, Cristo de la inmortalidad». La revisión directa del copto sigue pendiente, por lo que esta valoración se limita responsablemente al testimonio puente provisto.'
