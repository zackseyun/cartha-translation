translation:
  language: es
  text: 'Pedro reunió entonces a los demás. Fueron al monte llamado de los Olivos, donde antes solían reunirse con el bendito Cristo cuando habitaba en el cuerpo.


    Cuando los apóstoles se reunieron, se arrodillaron y oraron diciendo:


    «Padre, Padre, Padre de la luz,

    a ti pertenecen los incorruptibles;

    escúchanos,

    así como te has complacido en tu santo Hijo Jesucristo,

    porque por nosotros él se ha convertido en luz [a] en las tinieblas.

    En verdad, escúchanos».


    Luego oraron de nuevo, diciendo:


    «Hijo de la vida, Hijo de la inmortalidad,

    tú que habitas en la luz,

    Hijo, Cristo de la inmortalidad,

    redentor nuestro,

    danos fuerza,

    porque nos persiguen para matarnos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio conserva aquí un espacio de restauración vacío después de «luz»; es posible que falte texto.
    reason: Señalar una laguna textual sin proponer contenido no atestiguado.
lexical_decisions:
- source_word: Olivet
  choice: monte de los Olivos
  rationale: Es el nombre tradicional y natural en español del lugar llamado Olivet en el testimonio inglés.
- source_word: indestructible ones
  choice: los incorruptibles
  rationale: Conserva la referencia sustantivada a ciertos seres o personas sin identificarla doctrinalmente; «incorruptibles» expresa permanencia e inmunidad a la corrupción con dignidad idiomática.
- source_word: dwelt in the body
  choice: habitaba en el cuerpo
  rationale: Mantiene la formulación corporal y su posible carga teológica sin parafrasearla como una doctrina específica.
- source_word: deathlessness
  choice: inmortalidad
  rationale: Es la expresión natural en español para la condición de no estar sujeto a la muerte y permite conservar la repetición litúrgica.
- source_word: redeemer
  choice: redentor
  rationale: Equivalente religioso establecido, comprensible y no ligado por sí mismo a una interpretación denominacional particular.
- source_word: they are hunting for us
  choice: nos persiguen
  rationale: Comunica de manera natural una búsqueda hostil dirigida a capturarlos y matarlos, sin la posible lectura cinegética involuntaria de una traducción literal.
theological_decisions:
- issue: Identidad de «los incorruptibles»
  choice: Se conserva la expresión sin explicación identificadora.
  alternative: «los seres indestructibles» o una identificación con santos, ángeles u otra clase de seres
  rationale: El testimonio no precisa el referente; identificarlo resolvería indebidamente una ambigüedad teológica genuina.
- issue: Cristo «habitaba en el cuerpo»
  choice: Se mantiene «habitaba en el cuerpo».
  alternative: «vivía corporalmente» o «se hizo carne»
  rationale: La primera alternativa suaviza la formulación y la segunda introduce lenguaje ajeno al pasaje; la versión elegida conserva su tensión cristológica.
- issue: «Hijo, Cristo de la inmortalidad»
  choice: 'Se conserva la aposición inusual: «Hijo, Cristo de la inmortalidad».'
  alternative: «Hijo Cristo inmortal» o «Cristo, Hijo inmortal»
  rationale: Las alternativas normalizan la sintaxis y cambian la relación entre los títulos; el testimonio permite que «de la inmortalidad» modifique a «Cristo».
- issue: Complacencia del Padre en el Hijo
  choice: «te has complacido en tu santo Hijo»
  alternative: «te has deleitado con tu santo Hijo»
  rationale: «Complacerse en» conserva el sentido relacional y solemne sin sugerir una emoción más específica de la que ofrece el testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el paralelismo, las repeticiones y la cadencia invocatoria de las oraciones. El borrador es provisional porque se basa en el testimonio inglés de dominio público suministrado; está pendiente la revisión directa del copto. El número aislado «[1]» se consideró una indicación intrusiva de paginación y no se tradujo; el marcador vacío «[]» se representó mediante la nota [a].
