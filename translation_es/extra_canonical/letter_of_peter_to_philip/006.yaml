translation:
  language: es
  text: '«En cuanto a su encarcelamiento, se debe a que ustedes me pertenecen. Cuando se despojen de lo que es perecedero, entonces se convertirán en luces entre los mortales.


    »En cuanto a su lucha contra los poderes, esta se debe a que ellos, a diferencia de ustedes, no tienen descanso, pues no quieren que ustedes sean salvos».


    Entonces los apóstoles volvieron a postrarse en adoración y dijeron:


    «Señor, instrúyenos: ¿cómo lucharemos contra los arcontes, puesto que son más poderosos que nosotros?».


    Entonces una voz clamó desde la aparición y les dijo:


    «Deben combatirlos de la siguiente manera, porque los arcontes combaten contra el Hombre Interior: deben combatirlos de la siguiente manera.


    »Reúnanse y enseñen al mundo la salvación junto con una promesa. Cíñanse con el poder de mi Padre y den a conocer su petición. Él, el Padre, los ayudará, tal como los ayudó cuando me envió. […] [No] teman; [estaré con ustedes siempre], como les dije anteriormente cuando habitaba en el cuerpo».[a]


    Entonces hubo relámpagos y truenos procedentes del cielo, y aquel a quien habían visto allí en la aparición fue llevado repentinamente al cielo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los puntos suspensivos entre corchetes señalan una laguna textual; las palabras «[No]» y «[estaré con ustedes siempre]» son restauraciones editoriales. Esta versión es provisional y se basa en el testimonio inglés de dominio público suministrado; aún está pendiente la revisión directa del copto de los códices Nag Hammadi VIII,2 y Tchacos.
    reason: Advertir con transparencia tanto el daño y las restauraciones del manuscrito como el carácter indirecto de la base disponible.
lexical_decisions:
- source_word: detention
  choice: encarcelamiento
  rationale: Expresa de manera natural una privación de libertad y evita el sentido moderno más breve o administrativo que suele tener «detención».
- source_word: powers
  choice: poderes
  rationale: Conserva la designación amplia de fuerzas o entidades hostiles sin identificarla de manera más específica de lo que permite el testimonio disponible.
- source_word: archons
  choice: arcontes
  rationale: Mantiene el término técnico habitual para estas potestades gobernantes y evita equipararlas sin más con autoridades humanas.
- source_word: Inner Man
  choice: Hombre Interior
  rationale: La mayúscula conserva el carácter aparentemente técnico del concepto en el testimonio y no lo reduce a una mera vida psicológica interior.
- source_word: gird yourselves
  choice: cíñanse
  rationale: Conserva la imagen corporal y exhortativa del original transmitido, con una formulación digna y comprensible.
- source_word: snatched to heaven
  choice: fue llevado repentinamente al cielo
  rationale: Comunica tanto el traslado como su carácter súbito sin introducir necesariamente violencia en la escena.
theological_decisions:
- issue: La falta de descanso de los poderes frente al descanso de los discípulos
  choice: «ellos, a diferencia de ustedes, no tienen descanso»
  alternative: «su lucha se debe a la agitación de ellos, no a la de ustedes»
  rationale: Conserva el contraste explícito y la noción teológicamente significativa de «descanso» sin explicar en qué consiste.
- issue: La lucha contra el Hombre Interior
  choice: Se conserva «Hombre Interior» como expresión técnica
  alternative: «ser interior»
  rationale: Evita resolver si el texto se refiere al núcleo espiritual humano, a una entidad celestial o a otro concepto propio de la obra.
- issue: La ayuda del Padre y el envío del hablante
  choice: «los ayudó cuando me envió»
  alternative: «me ayudó al enviarme a ustedes»
  rationale: Preserva la tensión referencial del testimonio inglés, cuya sintaxis atribuye la ayuda a los destinatarios, sin corregirla mediante una interpretación no asegurada.
- issue: La salvación acompañada de una promesa
  choice: «enseñen al mundo la salvación junto con una promesa»
  alternative: «proclamen al mundo la promesa de salvación»
  rationale: Mantiene la posible distinción entre la enseñanza de la salvación y la promesa, en vez de fundir ambas en una sola expresión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se conservan términos técnicos como «arcontes» y «Hombre Interior». La redacción procura fluidez sin eliminar repeticiones, ambigüedades ni tensiones teológicas del testimonio disponible.
