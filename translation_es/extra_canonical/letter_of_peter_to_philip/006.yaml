review_pass:
  verdict: revise
  source_fidelity: La traducción conserva en general la secuencia, las repeticiones y los términos técnicos del testimonio inglés provisional. Sin embargo, «más poderosos» interpreta «superior», «postrarse en adoración» añade un gesto no expresado por «worshipped», y «fue llevado repentinamente» atenúa el matiz de «was snatched». También debe preservarse literalmente la señalización de laguna mediante corchetes vacíos, no convertirla en puntos suspensivos.
  naturalness: El español es mayormente natural y de registro adecuado. Se recomiendan ajustes menores para evitar expansiones interpretativas y para que la relación sintáctica de «salvación acompañada de una promesa» refleje más de cerca el testimonio.
  terminology: «Arcontes», «poderes», «Hombre Interior», «salvación» y «cíñanse» son elecciones apropiadas. Se conserva la mayúscula en «Hombre Interior» como término técnico y no se identifica doctrinalmente a los arcontes.
  issues:
  - severity: medium
    issue: «más poderosos que nosotros» para «the archons are superior to us»
    rationale: «Superior» es más amplio que poder o fuerza; «superiores a nosotros» conserva la formulación sin especificar en qué sentido lo son.
  - severity: low
    issue: «volvieron a postrarse en adoración» para «once more the apostles worshipped»
    rationale: «Postrarse» incorpora una acción corporal que el testimonio no enuncia. «Adoraron otra vez» es suficiente y más fiel.
  - severity: medium
    issue: «[…]» reemplaza los corchetes vacíos «[]» del testimonio
    rationale: El testimonio distingue una laguna marcada por corchetes vacíos de las restauraciones entre corchetes. La traducción debe conservar «[]» y la nota debe describirlo correctamente.
  - severity: low
    issue: «fue llevado repentinamente al cielo» para «was snatched to heaven»
    rationale: La expresión pierde el sentido de arrebato. «Fue arrebatado al cielo» conserva mejor el verbo sin precisar agente ni mecanismo.
  - severity: low
    issue: «enseñen al mundo la salvación junto con una promesa»
    rationale: La colocación puede hacer que «al mundo» modifique solo la enseñanza. «Enseñen la salvación acompañada de una promesa al mundo» mantiene más claramente la asociación de salvación y promesa, sin fusionarlas.
