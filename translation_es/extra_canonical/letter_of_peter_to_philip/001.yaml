base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: es
  text: '[a] Carta de Pedro, que envió a Felipe.


    Pedro, apóstol de Jesucristo, a Felipe, nuestro amado hermano y compañero apóstol, y también a los hermanos que están contigo: Saludos.


    Quiero que entiendas, hermano nuestro, que recibimos instrucciones de nuestro Señor, el Salvador del mundo entero, para que nos reunamos a fin de enseñar y predicar acerca de la salvación que nos prometió [b] nuestro Señor Jesucristo.


    Pero tú te apartaste de nosotros y no quisiste reunirte para aprender cómo podríamos coordinarnos, a fin de anunciar el mensaje.


    Por tanto, hermano nuestro, ¿tendrías a bien venir conforme a las instrucciones de nuestro Dios, Jesús?[c]


    Cuando Felipe recibió y leyó la carta, fue adonde estaba Pedro, lleno de alegría.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El comienzo del título presenta una laguna o un pasaje incierto en el manuscrito.
    reason: El testimonio fuente señala este lugar con corchetes vacíos.
  - marker: b
    text: Antes de «nuestro Señor Jesucristo» hay una laguna o restauración incierta en el manuscrito.
    reason: Conserva la señal de daño o incertidumbre textual presente en el testimonio.
  - marker: c
    text: La expresión también podría puntuarse «nuestro Dios Jesús»; el texto identifica a Jesús como «nuestro Dios».
    reason: Hace visible la construcción gramatical y evita que la puntuación oculte su tensión cristológica.
lexical_decisions:
- source_word: dispatched
  choice: envió
  rationale: Expresa de manera natural y exacta el envío de la carta, sin el matiz burocrático que tendría «despachó».
- source_word: co-apostle
  choice: compañero apóstol
  rationale: Conserva la condición apostólica compartida en español claro y digno.
- source_word: directives
  choice: instrucciones
  rationale: Comunica órdenes o indicaciones autorizadas sin endurecerlas innecesariamente como «mandatos».
- source_word: assemble together
  choice: reunirnos
  rationale: El verbo español ya contiene la idea de congregarse y evita una redundancia poco natural.
- source_word: coordinate ourselves
  choice: coordinarnos
  rationale: Mantiene el sentido organizativo del testimonio inglés sin añadir una interpretación del modo de cooperación.
- source_word: delighting with glee
  choice: lleno de alegría
  rationale: Reproduce el énfasis gozoso de forma idiomática, evitando la redundancia de «regocijándose con deleite».
theological_decisions:
- issue: La expresión «our God, Jesus» identifica gramaticalmente a Jesús como Dios.
  choice: nuestro Dios, Jesús
  alternative: nuestro Dios Jesús / Dios y Jesús
  rationale: Se conserva la aposición y su tensión cristológica, sin separar a Dios de Jesús ni suavizar la afirmación.
- issue: Agente de la promesa en «salvation promised to us by [] our Lord Jesus Christ».
  choice: la salvación que nos prometió [b] nuestro Señor Jesucristo
  alternative: la salvación prometida para nosotros por [b] nuestro Señor Jesucristo
  rationale: La formulación activa es natural en español y mantiene a Jesucristo como quien hace la promesa, según el testimonio suministrado.
- issue: Alcance universal de «savior of the entire world».
  choice: el Salvador del mundo entero
  alternative: el Salvador de todo el mundo
  rationale: Mantiene sin restricción el alcance universal de la expresión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono epistolar y exhortativo. El borrador es provisional porque la revisión directa del copto sigue pendiente; las lagunas del testimonio se indican mediante notas con marcadores en el texto.
