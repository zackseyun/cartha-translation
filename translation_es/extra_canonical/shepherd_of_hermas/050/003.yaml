review_pass:
  verdict: revise
  source_alignment_summary: El griego dice οὐκ οἴδατε («no saben», plural) y califica el ayuno como ἀνωφελής («inútil», sin provecho). El borrador usa el singular «sabes» y «vano», que no reflejan con la misma precisión la forma ni el sentido léxico del original. La formulación revisada conserva la repetición enfática de «ayuno» y expresa naturalmente en español el verbo νηστεύετε.
  spanish_quality_summary: La redacción propuesta es clara, digna y natural para lectores hispanohablantes. «Practican» evita el calco poco idiomático «el ayuno que ayunan», sin perder el hecho de que el texto acusa a los destinatarios de realizar ese ayuno.
  glossary_alignment: Κυρίῳ se traduce «el Señor», apropiadamente en este contexto griego y sin que el pasaje presente el tetragrámaton hebreo. νηστεία/νηστεύετε se mantiene como «ayuno»/«practican», y ἀνωφελής como «inútil», que conserva la idea de falta de beneficio o provecho.
  issues:
  - severity: medium
    issue: Número verbal y matiz de ἀνωφελής
    rationale: Οὐκ οἴδατε y νηστεύετε son plurales, mientras que «sabes» es singular. «Vano» puede sugerir futilidad o vanagloria, pero ἀνωφελής significa más directamente «inútil», «sin provecho».
  revised_spanish_text: 'Él dice: «No saben cómo ayunar para el Señor, ni este ayuno inútil que practican para él es un ayuno».'
  revision_rationale: Se corrigen el número plural exigido por el griego y el sentido de «inútil» para ἀνωφελής; además, «que practican» expresa idiomáticamente el participio verbal repetido sin alterar el significado.
