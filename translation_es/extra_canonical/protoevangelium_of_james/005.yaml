  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: es
  text: '**Protoevangelio de Santiago — Capítulo 5: El nacimiento de María**


    (1) Al día siguiente, Joaquín presentó sus ofrendas y se decía: «Si el Señor Dios se ha reconciliado conmigo, la lámina que lleva el sacerdote me lo hará saber».[a] Joaquín presentó sus ofrendas y observó atentamente la lámina del sacerdote mientras este subía al altar del Señor. No vio en ella señal de pecado.[b] Entonces dijo: «Ahora sé que el Señor Dios se ha reconciliado conmigo y ha alejado de mí todos mis pecados». Luego bajó justificado del Templo del Señor y regresó a su casa.


    (2) Se cumplieron unos seis meses y, en el séptimo, Ana dio a luz. Le preguntó a la partera:


    —¿Qué es?


    La partera respondió:


    —¡Es una niña!


    Ana exclamó:


    —¡Hoy mi alma ha sido engrandecida!


    Y acostó a la niña.


    Cuando se cumplieron los días de su purificación, Ana se limpió del flujo de sangre.[c] Después amamantó a la niña y le puso por nombre María.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «lámina» parece ser un ornamento sacerdotal, posiblemente la lámina de oro asociada con el sumo sacerdote; el objeto y la manera en que servía de señal no se explican aquí.
    reason: Aclara un referente cultural poco conocido sin fijar una identificación que el texto no hace explícita.
  - marker: b
    text: 'La expresión es difícil: el testimonio utilizado dice que Joaquín no vio pecado «en ella», es decir, en la lámina. El sentido exacto deberá confirmarse mediante revisión directa de la tradición manuscrita griega.'
    reason: Preserva y señala una ambigüedad textual importante en vez de resolverla silenciosamente.
  - marker: c
    text: La frase alude al período de purificación posterior al parto y a su flujo de sangre.
    reason: Hace comprensible el trasfondo ritual y corporal de una formulación antigua.
lexical_decisions:
- source_word: 'plate worn by the priest (Greek tradition: πέταλον)'
  choice: la lámina que lleva el sacerdote
  rationale: «Lámina» comunica mejor que «placa» un objeto delgado llevado como ornamento sacerdotal y mantiene la alusión cultual sin identificar de manera concluyente su forma o función.
- source_word: is reconciled to me
  choice: se ha reconciliado conmigo
  rationale: Conserva el lenguaje relacional y expiatorio del testimonio, sin reducirlo únicamente a «me ha perdonado» o «me favorece».
- source_word: justified
  choice: justificado
  rationale: Mantiene el término judicial y teológico, así como su posible resonancia bíblica, sin explicarlo dentro del texto.
- source_word: My soul is magnified
  choice: mi alma ha sido engrandecida
  rationale: Reproduce la forma pasiva y la resonancia bíblica de la expresión, sin cambiarla por la formulación distinta «mi alma engrandece».
- source_word: gave her breast to the child
  choice: amamantó a la niña
  rationale: Expresa en español natural la acción concreta del modismo sin perder contenido.
theological_decisions:
- issue: La reconciliación de Dios con Joaquín
  choice: se ha reconciliado conmigo
  alternative: me ha perdonado / me ha sido propicio
  rationale: La redacción elegida conserva la tensión del testimonio entre reconciliación, favor y eliminación de los pecados, sin imponer una teoría expiatoria específica.
- issue: La señal observada en la lámina sacerdotal
  choice: No vio en ella señal de pecado
  alternative: No vio pecado en sí mismo
  rationale: El testimonio inglés suministrado refiere la observación a la lámina, pero la frase resulta oscura. Se añade «señal de» solo para que la acción sea comprensible en español, y una nota advierte que el sentido exacto requiere cotejo directo con el griego.
- issue: La purificación posterior al parto
  choice: los días de su purificación / se limpió del flujo de sangre
  alternative: cuando se cumplieron sus días, Ana purificó su impureza
  rationale: La traducción mantiene el marco ritual y corporal del pasaje sin formular juicios doctrinales sobre Ana, María o la condición moral del parto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la repetición narrativa, el lenguaje cultual y las resonancias bíblicas. Se usaron guiones de diálogo para naturalidad en español. El borrador es necesariamente provisional porque el material proporcionado identifica como base inmediata un testimonio inglés de dominio público y señala que aún está pendiente la revisión directa del griego.
