    (1) Al día siguiente, Joaquín presentó sus ofrendas y se decía: «Si el Señor Dios se ha reconciliado conmigo, la lámina que lleva el sacerdote me lo hará saber».[a] Joaquín presentó sus ofrendas y observó atentamente la lámina del sacerdote mientras este subía al altar del Señor. No vio pecado en ella.[b] Entonces dijo: «Ahora sé que el Señor Dios se ha reconciliado conmigo y ha alejado de mí todos mis pecados». Luego bajó justificado del Templo del Señor y regresó a su casa.


    (2) Se cumplieron unos seis meses y, en el séptimo, Ana dio a luz. Le preguntó a la partera:


    —¿Qué es?


    La partera respondió:


    —¡Es una niña!


    Ana exclamó:


    —¡Hoy mi alma ha sido engrandecida!


    Y acostó a la niña.


    Cuando se cumplieron sus días, Ana limpió su flujo de sangre.[c] Después amamantó a la niña y le puso por nombre María.'
  revised_footnotes:
  - marker: a
