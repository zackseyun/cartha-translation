translation:
  language: es
  text: '(1) Y encontró a una mujer que bajaba de la montaña y la llevó consigo.[a] José dijo a la partera:


    —María es mi prometida, pero concibió del Espíritu Santo; fue criada en el Templo del Señor.[b]


    La partera fue con él. (2) Se detuvieron frente a la cueva, y una nube oscura cubrió la cueva con su sombra. La partera dijo:


    —¡Hoy mi alma ha sido engrandecida, porque mis ojos han visto algo maravilloso! ¡La salvación ha nacido para Israel!


    De inmediato, la nube se retiró de la cueva y apareció dentro de ella una gran luz, tan intensa que sus ojos no podían soportarla. Poco después, la luz fue desapareciendo hasta que se dejó ver un niño. Él se acercó y tomó el pecho de su madre María.[c]


    La partera exclamó:


    —¡Qué grande es este día, pues he visto este nuevo milagro!


    (3) La partera salió de la cueva y se encontró con Salomé. Le dijo:


    —Salomé, Salomé, tengo que contarte algo nunca visto: una virgen ha dado a luz, aunque esto es contrario a su naturaleza.[d]


    Salomé respondió:


    —¡Vive el Señor mi Dios! Si no introduzco el dedo y examino su condición, no creeré que la virgen haya dado a luz.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El texto transmitido en el testimonio suministrado es abrupto: literalmente, «encontró (y) trajo (a una) que bajaba de la montaña». Por el contexto se entiende que se trata de la partera.'
    reason: Señalar una dificultad textual y la explicitación contextual de «una mujer».
  - marker: b
    text: 'También puede entenderse: «habiendo sido criada en el Templo del Señor». La frase describe a María, no al Espíritu Santo.'
    reason: Evitar una asociación gramatical equivocada y conservar el carácter condensado de la frase.
  - marker: c
    text: 'La secuencia puede traducirse más literalmente: «la luz se retiró hasta que apareció un niño; y vino y tomó el pecho de su madre María».'
    reason: Registrar la formulación inusual y la posible agencia del recién nacido sin normalizar por completo la escena.
  - marker: d
    text: La expresión «contra su naturaleza» presenta el parto de una virgen como un hecho contrario al curso natural; el texto no desarrolla aquí una explicación fisiológica o doctrinal.
    reason: Preservar la tensión del texto sin imponer una interpretación confesional más específica.
  - marker: e
    text: «Examinar su condición» es una expresión indirecta para comprobar físicamente si seguía siendo virgen después del parto.
    reason: Aclarar el eufemismo necesario para comprender la acción narrativa.
lexical_decisions:
- source_word: midwife
  choice: partera
  rationale: Es el término corriente, claro y neutral en América Latina para la mujer que asiste en un parto.
- source_word: betrothed
  choice: prometida
  rationale: Comunica una relación matrimonial formal aún no consumada sin imponer terminología jurídica regional.
- source_word: overshadowed
  choice: cubrió ... con su sombra
  rationale: Conserva la imagen de una nube que proyecta o extiende su sombra sobre la cueva.
- source_word: Salvation
  choice: la salvación
  rationale: Mantiene el sustantivo abstracto y su posible fuerza personificada, sin reemplazarlo interpretativamente por «el Salvador».
- source_word: condition
  choice: condición
  rationale: Preserva el eufemismo del testimonio suministrado y evita añadir detalles anatómicos que este no expresa de manera directa.
theological_decisions:
- issue: Concepción de María
  choice: «concibió del Espíritu Santo»
  alternative: «quedó embarazada por obra del Espíritu Santo»
  rationale: La formulación elegida conserva la afirmación teológica y la concisión del testimonio, sin explicar de más el modo de la concepción.
- issue: «La salvación ha nacido»
  choice: Conservar «la salvación» como sujeto
  alternative: «Ha nacido el Salvador»
  rationale: El texto recibido dice «salvación»; cambiarlo por «Salvador» resolvería una posible personificación e introduciría una identificación más explícita.
- issue: Nacimiento virginal y «contra su naturaleza»
  choice: Mantener la afirmación paradójica sin armonizarla
  alternative: Explicarla como «sin perder su virginidad»
  rationale: El pasaje presenta la afirmación en esos términos y la posterior duda de Salomé; no conviene incorporar una formulación doctrinal más técnica que el testimonio no proporciona aquí.
- issue: Examen de Salomé
  choice: Traducir de manera directa pero eufemística
  alternative: Precisar anatómicamente el examen
  rationale: «Introduzco el dedo y examino su condición» refleja la crudeza narrativa y, a la vez, la falta de precisión explícita del testimonio inglés suministrado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron la numeración, el tono narrativo antiguo, las repeticiones enfáticas («Salomé, Salomé») y las afirmaciones teológicamente tensas. Debido a que la revisión directa del griego está pendiente, las notas identifican los lugares donde el testimonio inglés es abrupto o ambiguo.
