base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: es
  text: '(1) Ahora bien, yo, Santiago, escribí este relato en Jerusalén cuando se produjo una conmoción por la muerte de Herodes. Me fui al desierto hasta que cesó la conmoción en Jerusalén. Glorificaba al Señor Dios, quien me dio la sabiduría para escribir este relato.[a]


    (2) Y la gracia estará con todos los que temen al Señor. Amén.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Aún está pendiente la revisión directa de la tradición manuscrita griega.
    reason: La fuente proporcionada indica expresamente que la revisión del griego está pendiente; la nota hace transparente la base textual y evita presentar como definitiva una traducción que todavía no ha sido cotejada directamente con el idioma antiguo.
lexical_decisions:
- source_word: James
  choice: Santiago
  rationale: Es la forma tradicional y ampliamente reconocible en español para el nombre bíblico Ἰάκωβος, representado como “James” en el testimonio inglés.
- source_word: history / account
  choice: relato
  rationale: “Relato” comunica una narración escrita sin imponer el sentido historiográfico moderno que podría sugerir “historia”.
- source_word: commotion / unrest
  choice: conmoción
  rationale: Conserva la idea de agitación colectiva sin especificar, más allá de la evidencia disponible, si se trató de un motín, una persecución u otra clase de disturbio.
- source_word: wilderness
  choice: desierto
  rationale: Es el equivalente bíblico habitual y natural en español; puede designar una región despoblada sin exigir un paisaje exclusivamente arenoso.
- source_word: was glorifying
  choice: glorificaba
  rationale: Mantiene el aspecto imperfectivo del testimonio suministrado y presenta la acción como continuada, sin convertirla en un acto puntual.
- source_word: fear the Lord
  choice: temen al Señor
  rationale: Conserva la expresión religiosa tradicional y su amplitud semántica, que incluye reverencia y temor, sin reducirla a una paráfrasis interpretativa.
theological_decisions:
- issue: Naturaleza de la agitación relacionada con la muerte de Herodes
  choice: “conmoción por la muerte de Herodes”
  alternative: “disturbios tras la muerte de Herodes”
  rationale: La formulación elegida evita afirmar tanto una relación estrictamente causal como una secuencia temporal más precisa de lo que permite el testimonio disponible.
- issue: Declaración final sobre la gracia
  choice: “la gracia estará con todos los que temen al Señor”
  alternative: “que la gracia esté con todos los que temen al Señor”
  rationale: Se conserva como afirmación en futuro, tal como aparece en el testimonio inglés suministrado, en vez de transformarla en bendición desiderativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean oraciones claras y vocabulario bíblico reconocible sin arcaísmos innecesarios. Se conserva la repetición de “conmoción” y “relato” porque refleja la cohesión del testimonio suministrado y evita variaciones estilísticas que podrían introducir matices no comprobados.
