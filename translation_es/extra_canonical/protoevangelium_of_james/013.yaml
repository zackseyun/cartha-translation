base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: es
  text: '(1) Ella estaba en su sexto mes. Y, de pronto, José regresó de su trabajo de construcción, entró en la casa y la encontró embarazada. Se golpeó el rostro, se arrojó al suelo vestido de tela áspera[a] y lloró amargamente. Decía: «¿Cómo podré presentarme ante el Señor Dios? ¿Qué oración podré ofrecer por esta joven? La recibí virgen del Templo del Señor Dios, pero no la protegí. ¿Quién me ha tendido esta trampa? ¿Quién ha cometido esta maldad en mi casa? ¿Quién ha deshonrado a la virgen? ¿Acaso no se repite en mí la historia de Adán? Mientras Adán daba gloria a Dios durante la hora de la oración, llegó la serpiente, encontró sola a Eva y la engañó. ¡Y ahora me ha sucedido a mí!».


    (2) José se levantó de la tela áspera, llamó a María y le dijo: «Dios cuidó de ti. ¿Por qué has hecho esto? Te has olvidado del Señor tu Dios. ¿Por qué te has deshonrado a ti misma? Fuiste alimentada en el Lugar Santísimo y recibiste alimento de la mano de un ángel».


    (3) Ella lloró amargamente y dijo: «¡Soy pura y no he conocido varón[b]!».


    José le preguntó: «Entonces, ¿de dónde viene eso que llevas en el vientre?».


    Ella respondió: «¡Vive el Señor mi Dios, que no sé de dónde viene[c]!».


    [a] Literalmente, «en saco»; la tela de saco era una tela áspera que se usaba como señal de duelo o aflicción.

    [b] Es decir, no ha tenido relaciones sexuales con ningún hombre.

    [c] O bien: «cómo sucedió».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «en saco»; la tela de saco era una tela áspera que se usaba como señal de duelo o aflicción.
    reason: Aclara una práctica antigua y conserva la forma literal del testimonio.
  - marker: b
    text: Es decir, no ha tenido relaciones sexuales con ningún hombre.
    reason: Explica el eufemismo antiguo «conocer varón» sin eliminarlo del texto principal.
  - marker: c
    text: 'O bien: «cómo sucedió».'
    reason: Señala la posible amplitud semántica de la respuesta y evita presentar como segura una precisión aún pendiente de revisión directa del griego.
lexical_decisions:
- source_word: from his building
  choice: regresó de su trabajo de construcción
  rationale: El testimonio inglés parece describir la actividad u obra de José, no necesariamente un edificio de su propiedad. La formulación resulta natural en español y conserva el sentido ocupacional probable.
- source_word: struck his face
  choice: se golpeó el rostro
  rationale: Conserva el gesto físico de dolor del testimonio sin sustituirlo por una interpretación emocional.
- source_word: in sackcloth
  choice: vestido de tela áspera
  rationale: Comunica al lector moderno el carácter de la tela de saco; una nota conserva la expresión literal y su función de duelo.
- source_word: defiled
  choice: deshonrado
  rationale: En este contexto se refiere a una supuesta violación de la virginidad. «Deshonrar» mantiene la gravedad social y sexual sin introducir una formulación excesivamente técnica.
- source_word: known a man
  choice: conocido varón
  rationale: Se conserva el eufemismo bíblico tradicional, aclarado en nota para lectores modernos.
- source_word: this thing in your womb
  choice: eso que llevas en el vientre
  rationale: Mantiene la distancia y dureza de la pregunta de José, pero evita una construcción poco natural en español.
- source_word: As the Lord my God lives
  choice: Vive el Señor mi Dios, que
  rationale: Reproduce una fórmula solemne de juramento con resonancia bíblica y sintaxis comprensible en español.
theological_decisions:
- issue: La afirmación de María sobre su pureza
  choice: «Soy pura y no he conocido varón»
  alternative: «Soy virgen y no he tenido relaciones con ningún hombre»
  rationale: La opción elegida conserva por separado la declaración de pureza y el eufemismo semítico sobre las relaciones sexuales, sin reducir «pura» exclusivamente a virginidad.
- issue: El desconocimiento de María acerca del embarazo
  choice: «no sé de dónde viene»
  alternative: «no sé cómo sucedió»
  rationale: Se conserva la ambigüedad y extrañeza del testimonio, sin explicar aquí el origen del embarazo ni armonizar el relato con doctrinas posteriores.
- issue: La comparación de José con Adán
  choice: «¿Acaso no se repite en mí la historia de Adán?»
  alternative: «¿No soy yo como Adán?»
  rationale: Mantiene el paralelismo tipológico expresado por José sin afirmar que el narrador respalde todos los detalles de su interpretación.
- issue: Alimento recibido de un ángel
  choice: «recibiste alimento de la mano de un ángel»
  alternative: «un ángel te alimentó»
  rationale: Conserva la imagen concreta y la afirmación del texto sin ampliarla ni definir su significado teológico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron la repetición, las preguntas vehementes y el tono dramático del relato. «Lugar Santísimo» se emplea como equivalente comprensible de «Santo de los Santos». Este borrador se apoya en el testimonio inglés público suministrado; la revisión directa de la tradición manuscrita griega sigue pendiente, por lo que las decisiones que dependen de matices del original deben considerarse provisionales.
