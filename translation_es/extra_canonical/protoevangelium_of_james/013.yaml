review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones seguras respecto del testimonio inglés suministrado. «From his building» no autoriza especificar que José volvía de su «trabajo de construcción»; «in sackcloth» y «from the sackcloth» describen el saco sobre el que se arroja y del que se levanta, no una prenda que viste. El borrador además introduce el nombre «María» donde el pasaje solo dice «la».
  naturalness: El texto tiene un registro mayormente natural y digno, pero «se arrojó al suelo vestido de tela áspera» resulta sintáctica y contextualmente equívoco. «Se arrojó sobre el saco» y «se levantó del saco» son claros y conservan la imagen narrativa.
  terminology: Conviene conservar «Santo de los Santos» como equivalente más directo de «Holy of Holies», y «has humillado tu alma» para no reemplazar la expresión del testimonio por «te has deshonrado a ti misma». «Conocer varón» es un eufemismo bíblico comprensible y no necesita glosa explicativa en el texto revisado.
  issues:
  - severity: high
    issue: «Regresó de su trabajo de construcción» especifica indebidamente «from his building».
    rationale: El testimonio dice que José vino «de su edificio/obra»; no establece de forma inequívoca una ocupación ni que estuviera trabajando en construcción. «De la obra» conserva mejor la ambigüedad.
  - severity: high
    issue: «Vestido de tela áspera» altera la acción con el saco.
    rationale: El testimonio dice que José se arrojó «in sackcloth» y después se levantó «from the sackcloth». La secuencia requiere que el saco funcione como el objeto o superficie sobre la que se arroja, no como vestimenta.
  - severity: medium
    issue: Se añade «María» en «llamó a María».
    rationale: El testimonio proporcionado solo dice «called her». Aunque la identificación sea conocida por el contexto amplio, no debe añadirse un nombre ausente.
  - severity: medium
    issue: «Te has deshonrado a ti misma» reemplaza «You have humiliated your soul».
    rationale: La versión propuesta interpreta y desplaza «alma» hacia honor sexual. «Has humillado tu alma» mantiene la expresión y evita una precisión no requerida.
  - severity: low
    issue: La nota [c] propone «cómo sucedió».
    rationale: No corresponde al testimonio inglés, que repite «where it came from». Sin revisión directa del griego no debe introducirse una alternativa semántica que no está respaldada por la base suministrada.
  revised_text: '(1) Ella estaba en su sexto mes. ¡Y mira! José vino de la obra, entró en la casa y la encontró embarazada. Se golpeó el rostro, se arrojó sobre el saco y lloró amargamente. Decía: «¿Cómo miraré al Señor Dios? ¿Qué oración puedo ofrecer acerca de esta joven, puesto que la recibí virgen del Templo del Señor Dios y no la protegí? ¿Quién me ha tendido esta trampa? ¿Quién ha hecho esta maldad en mi casa? ¿Quién ha mancillado a la virgen? ¿No estoy reviviendo la historia de Adán? Pues mientras Adán daba gloria durante la hora de la oración, vino la serpiente, encontró sola a Eva y la engañó. ¡Y ahora me ha sucedido a mí!»


    (2) José se levantó del saco, la llamó y le dijo: «Dios cuidó de ti. ¿Por qué has hecho esto? Has olvidado al Señor tu Dios. ¿Por qué has humillado tu alma? Fuiste alimentada en el Santo de los Santos y recibiste alimento de la mano de un ángel».


    (3) Ella lloró amargamente y dijo: «¡Soy pura y no he conocido varón!»


    José le dijo: «Entonces, ¿de dónde vino eso que está en tu vientre?»


    Ella dijo: «¡Vive el Señor mi Dios, que no sé de dónde vino!»'
  revised_footnotes: []
  revision_rationale: La revisión elimina especificaciones no sustentadas, restaura la función narrativa del saco, no añade el nombre de María y conserva formulaciones del testimonio donde el borrador había interpretado («alma», «Santo de los Santos»). También se suprime la nota alternativa no respaldada por la base inglesa. La traducción sigue siendo provisional, pues el propio contexto indica que falta revisión directa de la tradición griega.
