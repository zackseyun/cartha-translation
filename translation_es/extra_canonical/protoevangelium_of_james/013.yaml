review_pass:
  verdict: revise
  source_fidelity: 'Se corrigen varias expansiones o desplazamientos del testimonio: «from his building» no especifica que José regresara de un «trabajo de construcción»; «in sackcloth» y «from the sackcloth» describen su postración sobre tela de saco, no que estuviera vestido con ella; y la última respuesta de María se refiere a «de dónde» procede el embarazo, no a «cómo sucedió». También se conserva la referencia genérica a «ella» donde el texto suministrado no vuelve a nombrar a María.'
  naturalness: La revisión mantiene un español latinoamericano actual y solemne. «Tela de saco» es comprensible con una nota breve; «esto que está en tu vientre» conserva la aspereza deliberada de la pregunta sin resultar forzado.
  terminology: «Lugar Santísimo», «Señor Dios», «virgen», «pura» y «conocer varón» conservan el registro religioso y la formulación del testimonio sin imponer explicaciones doctrinales.
  issues:
  - severity: medium
    issue: «regresó de su trabajo de construcción» interpreta «from his building» como una ocupación específica.
    rationale: El testimonio solo dice que José vino «de su obra/edificación»; no permite asegurar que se trataba de trabajo de construcción en ese sentido.
  - severity: medium
    issue: «vestido de tela áspera» cambia la acción descrita por «in sackcloth» y entra en tensión con «stood from the sackcloth».
    rationale: La secuencia presenta a José arrojándose o postrándose sobre tela de saco y luego levantándose de ella, no vistiéndola.
  - severity: medium
    issue: 'La nota [c], «O bien: “cómo sucedió”», introduce una alternativa que no está respaldada por el testimonio inglés suministrado.'
    rationale: La respuesta dice explícitamente que María no sabe «de dónde vino»; debe conservarse esa formulación mientras no haya revisión directa del griego.
  - severity: low
    issue: «¿Por qué te has deshonrado a ti misma?» sustituye «humiliated your soul» por una interpretación más sexualizada.
    rationale: «¿Por qué has humillado tu alma?» conserva el objeto y la acusación expresados en el testimonio.
  revised_text: "(1) Ella estaba en su sexto mes. ¡Y mira! José vino de su obra, entró en la casa y la encontró embarazada. Se golpeó el rostro, se arrojó al suelo sobre tela de saco[a] y lloró amargamente, diciendo: «¿Cómo puedo mirar al Señor Dios? ¿Qué oración puedo ofrecer respecto de esta joven, puesto que la recibí virgen del Templo del Señor Dios y no la protegí? ¿Quién me ha tendido esta trampa? ¿Quién ha hecho esta maldad en mi casa? ¿Quién ha mancillado a la virgen? ¿No estoy reviviendo la historia de Adán? Porque, mientras Adán daba gloria en la hora de la oración, vino la serpiente, encontró sola a Eva y la engañó; ¡y ahora me ha sucedido a mí!»\n\n(2) José se levantó de la tela de saco, la llamó y le dijo: «Dios cuidó de ti. ¿Por qué has hecho esto? Has olvidado al Señor tu Dios. ¿Por qué has humillado tu alma? Fuiste alimentada en el Lugar Santísimo y recibiste alimento de la mano de un ángel».\n\n(3) Ella lloró amargamente y dijo: «¡Soy pura y no he conocido varón[b]!». \n\
    \nJosé le dijo: «Entonces, ¿de dónde vino esto que está en tu vientre?».\n\nElla dijo: «¡Vive el Señor mi Dios, que no sé de dónde vino!»"
  revised_footnotes:
  - marker: a
    text: La tela de saco era una tela áspera usada como señal de duelo o aflicción.
    reason: Aclara la práctica antigua sin convertir la tela de saco en una prenda que José llevara puesta.
  - marker: b
    text: Es decir, no ha tenido relaciones sexuales con ningún hombre.
    reason: Explica el eufemismo «conocer varón» sin eliminarlo del texto principal.
  revision_rationale: La revisión elimina interpretaciones no exigidas por el testimonio inglés y conserva su lenguaje enfático, incluidos la imagen de José sobre la tela de saco, el reproche de «humillar el alma» y la declaración de María de no saber de dónde procede lo que está en su vientre. Se retiró la nota que proponía «cómo sucedió», pues altera la dirección de la pregunta y respuesta transmitidas. La revisión directa de la tradición griega sigue siendo necesaria para confirmar matices léxicos.
