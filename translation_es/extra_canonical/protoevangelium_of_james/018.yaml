  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: es
  text: '(1) Allí encontró una cueva, la llevó adentro, dejó a sus hijos con ella y salió a buscar una partera hebrea en la región de Belén.


    (2) Yo, José, caminaba, pero no caminaba. Alcé la mirada hacia la bóveda del cielo y vi que estaba inmóvil. Miré el firmamento y, asombrado, vi que hasta las aves del cielo permanecían inmóviles. Miré hacia el suelo y vi allí un recipiente, y a unos trabajadores recostados. Tenían las manos en el recipiente; masticaban, pero no masticaban; tomaban comida, pero no la tomaban; se la llevaban a la boca, pero no se la llevaban. Más bien, todos tenían el rostro vuelto hacia arriba.


    Vi unas ovejas que eran conducidas, pero se quedaron inmóviles. El pastor levantó la mano para golpearlas, pero su mano quedó alzada. Miré el torrente del río y vi unos cabritos con el hocico metido en el agua, pero no bebían.


    Y de repente, todo reanudó su curso.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado. Queda pendiente el cotejo directo con la tradición manuscrita griega, especialmente para los términos traducidos «bóveda del cielo», «firmamento», «recipiente» y «torrente del río».
    reason: La información del proyecto señala expresamente que aún no se ha realizado la revisión directa del griego; la nota hace transparente esa limitación textual.
lexical_decisions:
- source_word: cave
  choice: cueva
  rationale: Equivalente directo y natural, coherente con la escena del nacimiento en esta obra.
- source_word: Hebrew midwife
  choice: partera hebrea
  rationale: «Partera» es corriente y comprensible en América Latina; «hebrea» conserva la identificación étnica del testimonio.
- source_word: dome of heaven
  choice: bóveda del cielo
  rationale: Conserva la imagen cosmológica del texto sin imponer una explicación moderna.
- source_word: sky
  choice: firmamento
  rationale: Distingue este segundo término de «bóveda del cielo» y mantiene un registro narrativo digno; la precisión griega queda pendiente de cotejo.
- source_word: bowl
  choice: recipiente
  rationale: Evita especificar de manera excesiva la forma o función del objeto cuando el testimonio inglés no permite establecerla con seguridad.
- source_word: workers
  choice: trabajadores
  rationale: Traducción amplia que no añade un oficio ausente del testimonio disponible.
- source_word: torrent of the river
  choice: torrente del río
  rationale: Conserva la formulación enfática y la imagen de una corriente impetuosa.
- source_word: young goats
  choice: cabritos
  rationale: Forma natural en español para las crías de cabra.
- source_word: resumed its course
  choice: reanudó su curso
  rationale: Expresa el reinicio del movimiento general sin reducirlo solamente al paso del tiempo.
theological_decisions:
- issue: Suspensión milagrosa del movimiento
  choice: Conservar literalmente las fórmulas paradójicas «caminaba, pero no caminaba» y «masticaban, pero no masticaban»
  alternative: Explicarlas como una visión subjetiva de José o como una detención explícita del tiempo
  rationale: El relato presenta una suspensión misteriosa de toda actividad, pero no define su mecanismo ni afirma de manera técnica que el tiempo mismo se detuvo.
- issue: Identidad de los hijos que acompañan a María
  choice: «sus hijos», sin explicación adicional
  alternative: Precisar que eran hijos de un matrimonio anterior de José
  rationale: El capítulo los llama hijos de José, pero este pasaje no explica su origen; añadirlo importaría una tradición interpretativa externa.
- issue: Marco cosmológico antiguo
  choice: «bóveda del cielo»
  alternative: Sustituirlo por «cielo» o explicarlo según cosmología moderna
  rationale: Se preserva la imagen antigua y su tensión conceptual sin convertirla en una afirmación doctrinal moderna.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones y paradojas que producen el efecto literario de inmovilidad. Se prefirió «partera» a «comadrona» por su comprensión regional más amplia. La puntuación se ajustó para facilitar la lectura sin borrar el ritmo acumulativo del pasaje.
