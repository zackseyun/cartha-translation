    reason: La información del proyecto señala expresamente que aún no se ha realizado la revisión directa del griego; la nota hace transparente esta limitación textual.
  revision_rationale: Se hicieron ajustes mínimos para evitar añadir que María entró en la cueva, para conservar la referencia general a las bocas de los cabritos y para reflejar más directamente la inmovilidad de las ovejas. Se mantienen la ambigüedad visionaria del relato, las repeticiones paradójicas y la nota de limitación textual pendiente de revisión griega.
