    (2) Yo, José, caminaba, pero no caminaba. Alcé la mirada hacia la bóveda del cielo y vi que estaba inmóvil. Miré el firmamento y, asombrado, vi que hasta las aves del cielo permanecían inmóviles. Miré hacia el suelo y vi allí un cuenco, y a unos trabajadores recostados. Tenían las manos en el cuenco; masticaban, pero no masticaban; tomaban comida, pero no la tomaban; se la llevaban a la boca, pero no se la llevaban. Más bien, todos tenían el rostro vuelto hacia arriba.


    Vi unas ovejas que eran conducidas, pero estaban inmóviles. El pastor levantó la mano para golpearlas, pero su mano quedó alzada. Miré el torrente del río y vi unos cabritos con el hocico metido en el agua, pero no bebían.


    Y de repente, todo reanudó su curso.[a]'
