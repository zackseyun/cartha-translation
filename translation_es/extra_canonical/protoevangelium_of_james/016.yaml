translation:
  language: es
  text: '**Capítulo 16: La prueba**


    (1) El sacerdote dijo:


    —Devuelve a la virgen que recibiste del Templo del Señor.


    José se echó a llorar.


    Entonces el sumo sacerdote dijo:


    —Te daré a beber el agua de la reprensión del Señor[a], y ella pondrá tu pecado ante tus propios ojos.


    (2) El sacerdote tomó el agua, se la dio a José y lo envió al desierto. José regresó ileso.


    Luego se la dio a María y la envió al desierto. Ella regresó ilesa.


    Todo el pueblo quedó asombrado de que no se hubiera revelado el pecado de ellos.


    (3) El sacerdote dijo:


    —Si el Señor Dios no les ha revelado su pecado, tampoco yo los condeno.


    Y los dejó en libertad.


    José tomó consigo a María y regresó a su casa, lleno de alegría y glorificando al Dios de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión designa el agua empleada en esta prueba. La traducción es provisional porque la revisión directa de la tradición manuscrita griega sigue pendiente.
    reason: Señalar tanto la opacidad de la expresión ritual como la limitación documental indicada en los materiales fuente, sin insertar una identificación no demostrada en el texto principal.
lexical_decisions:
- source_word: the virgin you took
  choice: la virgen que recibiste
  rationale: «Recibiste» comunica que José la acogió bajo su cuidado y evita que «tomaste» sugiera por sí solo rapto o apropiación, sin añadir una relación no expresada en el testimonio disponible.
- source_word: the water of the Lord’s rebuke
  choice: el agua de la reprensión del Señor
  rationale: Se conserva la expresión ritual y su aspereza semántica en vez de explicarla como castigo, maldición o juicio, opciones que reducirían su amplitud.
- source_word: it’ll reveal your sin in your eyes
  choice: ella pondrá tu pecado ante tus propios ojos
  rationale: Mantiene tanto la función reveladora del agua como la referencia enfática a los ojos del acusado en español natural.
- source_word: wilderness
  choice: desierto
  rationale: Es la correspondencia bíblica habitual y puede designar una región despoblada, sin exigir un arenal.
- source_word: unharmed
  choice: ileso / ilesa
  rationale: Expresa que ambos volvieron sin haber sufrido daño como resultado de la prueba.
- source_word: neither do I judge you
  choice: tampoco yo los condeno
  rationale: En este contexto judicial, «condeno» expresa la decisión adversa que el sacerdote rehúsa pronunciar; el plural hace explícito que se dirige a José y María.
theological_decisions:
- issue: Naturaleza de la prueba ritual
  choice: Conservar «agua de la reprensión del Señor» sin identificarla expresamente con un rito bíblico concreto.
  alternative: Traducir o explicar la frase como «agua de la prueba», «agua amarga» o vincularla directamente con Números 5.
  rationale: El testimonio suministrado presenta una formulación propia y no basta para imponer una identificación técnica o una equivalencia intertextual específica.
- issue: Pecado no revelado
  choice: Mantener «el pecado de ellos» en singular y en forma condicional, sin afirmar explícitamente inocencia absoluta.
  alternative: Traducir «sus pecados» o declarar que la prueba demostró que eran inocentes.
  rationale: La narración dice que el pecado no fue revelado; conserva así la formulación y la tensión del relato sin ampliar su conclusión teológica.
- issue: Sentido de «juzgar» en la absolución sacerdotal
  choice: Usar «condeno».
  alternative: Usar «juzgo».
  rationale: El sentido contextual es no dictar sentencia adversa tras una prueba que no reveló culpa; no se pretende formular una doctrina general sobre el juicio divino o humano.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la repetición narrativa, la distinción entre «sacerdote» y «sumo sacerdote» y el tono judicial del episodio. El borrador se basa necesariamente en el testimonio inglés público suministrado; requiere cotejo posterior con el griego.
