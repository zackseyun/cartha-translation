translation:
  language: es
  text: '(1) Anás, el escriba, fue adonde estaba José y le preguntó:


    —José, ¿por qué no te presentaste ante nuestro grupo de viajeros?


    Él le respondió:


    —Porque estaba cansado del viaje y descansé el primer día después de regresar.


    Entonces Anás se volvió y vio que María estaba embarazada.


    (2) Enseguida fue adonde estaba el sacerdote y le dijo:


    —José, por quien tú diste testimonio, ha cometido una grave violación de la ley.


    El sacerdote preguntó:


    —¿Qué ha sucedido?


    Anás respondió:


    —José ha deshonrado a la virgen que recibió del Templo del Señor; celebró su boda a escondidas[a] y no la dio a conocer al pueblo de Israel.


    El sacerdote preguntó:


    —¿José ha hecho esto?


    Anás, el escriba, le dijo:


    —Envía guardias y encontrarás embarazada a la virgen.


    Los guardias fueron y la encontraron tal como él había dicho. Entonces la llevaron junto con José ante el tribunal.


    (3) El sumo sacerdote le preguntó:


    —María, ¿por qué has hecho esto? ¿Por qué te has humillado y te has olvidado del Señor tu Dios? Tú, que fuiste criada en el Lugar Santísimo, recibiste alimento de la mano de un ángel, escuchaste sus himnos[b] y danzaste ante él, ¿cómo pudiste hacer esto?


    Ella lloró amargamente y dijo:


    —¡Tan cierto como que vive el Señor Dios, soy pura ante Dios y no he conocido varón!


    (4) Entonces el sacerdote preguntó:


    —José, ¿qué es esto que has hecho?


    José respondió:


    —¡Tan cierto como que vive el Señor mi Dios y es verdadero su testimonio, soy puro con respecto a ella![c]


    El sacerdote le dijo:


    —No des falso testimonio; di la verdad. Celebraste su boda a escondidas[a] y no la diste a conocer al pueblo de Israel. Tampoco inclinaste la cabeza bajo la mano poderosa que debía bendecir tu descendencia.[d]


    José guardó silencio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, según el testimonio inglés suministrado: «robaste su boda». La expresión es inusual y probablemente acusa a José de haber celebrado o consumado clandestinamente la unión sin informar a Israel.'
    reason: Preserva la dificultad textual detrás de una traducción comprensible y señala que la revisión directa del griego está pendiente.
  - marker: b
    text: El referente de «sus» no es completamente claro en el testimonio disponible; gramaticalmente puede referirse al ángel.
    reason: Evita resolver silenciosamente una ambigüedad de referente.
  - marker: c
    text: 'También podría traducirse de manera más literal: «soy puro hacia ella». La expresión no especifica exactamente en qué sentido José afirma su pureza.'
    reason: Conserva la amplitud y extrañeza de la formulación transmitida.
  - marker: d
    text: La frase puede aludir a someterse a la autoridad y bendición correspondientes al matrimonio, pero su sentido preciso requiere revisión del texto griego.
    reason: La imagen es teológica y ritualmente sugestiva, pero no debe explicarse con una certeza que la fuente disponible no ofrece.
lexical_decisions:
- source_word: acted very lawlessly
  choice: ha cometido una grave violación de la ley
  rationale: Comunica con claridad la acusación de conducta contraria a la ley, sin reducirla a una valoración moral genérica.
- source_word: defiled her
  choice: ha deshonrado a la virgen
  rationale: En este contexto acusatorio alude a una supuesta transgresión sexual; «deshonrado» conserva la dimensión social y moral sin afirmar como hecho la pérdida ritual de pureza.
- source_word: stolen her wedding
  choice: celebró su boda a escondidas
  rationale: La expresión del testimonio inglés es inusual. Esta formulación conserva la idea probable de apropiación o celebración clandestina de la boda y evita el español poco inteligible «robó su boda».
- source_word: court
  choice: tribunal
  rationale: Expresa el lugar o instancia de interrogatorio judicial, no meramente un patio físico.
- source_word: known a man
  choice: conocido varón
  rationale: Conserva el eufemismo bíblico tradicional para las relaciones sexuales en un registro digno y comprensible.
- source_word: pure toward her
  choice: puro con respecto a ella
  rationale: Mantiene la formulación relacional y algo extraña del testimonio, sin convertirla explícitamente en una negación sexual más específica.
- source_word: offspring
  choice: descendencia
  rationale: Conserva el sentido colectivo o potencial sin especificar hijos ya nacidos.
theological_decisions:
- issue: Identidad o referente del ser que canta y ante quien María danza
  choice: «sus himnos» y «ante él», con nota de ambigüedad
  alternative: Explicitar «los himnos del ángel» o entender que el referente es Dios
  rationale: El testimonio suministrado permite una referencia gramatical al ángel, pero el sentido exacto es incierto; no se resuelve doctrinalmente.
- issue: Afirmación de pureza de María
  choice: «soy pura ante Dios y no he conocido varón»
  alternative: «soy virgen» o «no he tenido relaciones sexuales»
  rationale: Conserva tanto la afirmación de pureza ante Dios como el eufemismo independiente, sin fusionarlos ni añadir una interpretación.
- issue: Afirmación de pureza de José
  choice: «soy puro con respecto a ella»
  alternative: «no he tenido relaciones con ella»
  rationale: Evita precisar más de lo que permite la expresión transmitida y mantiene su posible amplitud moral, ritual o sexual.
- issue: La mano poderosa y la bendición de la descendencia
  choice: Conservar la imagen sin identificar explícitamente al agente
  alternative: Explicitar que es la mano de Dios o describir un rito sacerdotal concreto
  rationale: La frase parece aludir a autoridad o bendición divina o sacerdotal, pero la información disponible no permite decidir con seguridad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la numeración tradicional y se emplea diálogo con raya para una lectura natural. El borrador se basa provisionalmente en el testimonio inglés de dominio público suministrado; la revisión directa de la tradición manuscrita griega sigue pendiente. Se han señalado mediante notas las expresiones especialmente inciertas o inusuales.
