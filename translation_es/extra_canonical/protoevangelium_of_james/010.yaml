base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: es
  text: '(1) Los sacerdotes se reunieron en consejo y dijeron:


    —Hagamos un velo para el Templo del Señor.


    El sacerdote dijo:


    —Tráiganme a las vírgenes puras de la tribu de David.


    Los servidores salieron a buscarlas y encontraron siete. Entonces el sacerdote recordó que la niña María pertenecía a la tribu de David y era pura ante Dios. Los servidores fueron y la trajeron.


    (2) Las llevaron al Templo del Señor, y el sacerdote dijo:


    —Echen suertes para determinar quién hilará el oro, el blanco, el lino fino, la seda, el violeta, el escarlata y la púrpura auténtica.


    A María le correspondieron por suerte la púrpura auténtica y el escarlata, y se los llevó a su casa. Fue por aquel tiempo cuando Zacarías quedó mudo, y Samuel ocupó su lugar hasta que Zacarías pudo volver a hablar. María tomó el escarlata y se puso a hilarlo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: veil
  choice: velo
  rationale: Conserva el sentido de una cortina o velo destinado al Templo sin especificar más de lo que permite el testimonio suministrado.
- source_word: officers
  choice: servidores
  rationale: Evita el matiz moderno policial o burocrático de «oficiales» y expresa de manera natural a quienes cumplían las órdenes del sacerdote.
- source_word: pure
  choice: puras
  rationale: Mantiene la valoración ritual y moral abierta del testimonio, sin reducirla exclusivamente a una categoría ceremonial.
- source_word: linen
  choice: lino fino
  rationale: Distingue este material de «el blanco» dentro de la lista de materiales y colores.
- source_word: violet
  choice: violeta
  rationale: Conserva el término cromático diferenciado de la púrpura y el escarlata.
- source_word: true purple
  choice: púrpura auténtica
  rationale: Reproduce el calificativo distintivo «true» y evita fusionar esta clase de púrpura con el violeta.
- source_word: fell silent
  choice: quedó mudo
  rationale: Expresa en español natural la pérdida temporal del habla, confirmada por la frase posterior «hasta que... pudo volver a hablar».
- source_word: was spinning it
  choice: se puso a hilarlo
  rationale: Comunica el inicio y desarrollo de la labor con naturalidad, haciendo explícito mediante el pronombre que el objeto es el escarlata.
theological_decisions:
- issue: La pureza de María ante Dios
  choice: «era pura ante Dios»
  alternative: «era ritualmente pura delante de Dios»
  rationale: Se conserva la formulación amplia del testimonio, sin imponer una interpretación exclusivamente ritual ni una doctrina posterior sobre María.
- issue: El silencio de Zacarías
  choice: «quedó mudo»
  alternative: «guardó silencio»
  rationale: El contexto indica incapacidad temporal para hablar, pero no se añade aquí una explicación causal ni se armoniza explícitamente con otro relato.
- issue: Samuel ocupa el lugar de Zacarías
  choice: Se conserva el nombre y la sustitución tal como aparecen
  alternative: Identificar, corregir o explicar quién era Samuel
  rationale: El testimonio suministrado no identifica a Samuel ni autoriza una corrección; se preserva la tensión narrativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la repetición narrativa característica del pasaje, pero con diálogo y sintaxis naturales. El borrador es necesariamente provisional porque el expediente indica que aún está pendiente la revisión directa del griego; por ello no se presentan con certeza reconstrucciones léxicas griegas no verificadas.
