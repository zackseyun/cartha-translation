translation:
  language: es
  text: '(1) ¡Miren! Una mujer bajaba de la montaña y me dijo:


    —Hombre, ¿adónde vas?


    Yo le respondí:


    —Busco a una partera hebrea.


    Ella me preguntó:


    —¿Eres de Israel?


    Le respondí:


    —Sí.


    Entonces me preguntó:


    —¿Y quién es la que está dando a luz en la cueva?


    Yo le respondí:


    —Mi prometida.


    Ella me preguntó:


    —¿No es tu esposa?


    Yo le respondí:


    —María fue criada en el Templo del Señor, y por sorteo se decidió que sería mi esposa. Sin embargo, no es mi esposa, sino que ha concebido del Espíritu Santo.[a]


    La partera preguntó:


    —¿De veras?


    José le dijo:


    —Ven y mira.


    Y la partera fue con él.


    (2) Se detuvieron frente a la cueva, y una nube luminosa cubrió la cueva con su sombra. La partera dijo:


    —Hoy mi alma ha sido engrandecida, porque mis ojos han visto algo maravilloso: ¡la salvación ha nacido para Israel![b]


    De inmediato, la nube se retiró de la cueva y una gran luz apareció dentro de ella, de modo que sus ojos no podían soportarla. Poco después, la luz fue desapareciendo hasta que apareció un niño. Él se acercó y tomó el pecho de su madre María.


    La partera exclamó:


    —¡Qué grande es este día para mí, pues he visto este nuevo milagro!


    (3) La partera salió de la cueva y Salomé se encontró con ella.


    La partera le dijo:


    —Salomé, Salomé, tengo que contarte algo nunca visto: una virgen ha dado a luz, ¡algo contrario a su naturaleza![c]


    Salomé respondió:


    —¡Vive el Señor mi Dios! Si no examino su condición, no creeré que la virgen ha dado a luz.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría traducirse: «ha concebido por obra del Espíritu Santo». El texto afirma el origen de la concepción sin explicar su modo.'
    reason: Preservar la concisión y la ambigüedad de la expresión recibida.
  - marker: b
    text: El texto dice literalmente que «la salvación» ha nacido para Israel, no simplemente que ha nacido «un salvador».
    reason: Evitar sustituir la personificación del testimonio por una formulación teológica más familiar.
  - marker: c
    text: «Contrario a su naturaleza» puede referirse al hecho extraordinario de que una virgen dé a luz; la frase no explica con precisión en qué consiste esa contradicción.
    reason: Señalar una ambigüedad importante sin resolverla denominacionalmente.
  - marker: d
    text: «Su condición» es una expresión indirecta para referirse al estado físico de María; el testimonio de este capítulo no precisa aquí el procedimiento del examen.
    reason: Aclarar el eufemismo manteniendo la discreción del texto suministrado.
lexical_decisions:
- source_word: Hebrew midwife
  choice: partera hebrea
  rationale: «Partera» es natural y ampliamente comprensible en América Latina; «hebrea» conserva la identificación étnica del testimonio.
- source_word: betrothed
  choice: prometida
  rationale: Expresa una relación formal previa al matrimonio sin identificarla sin más como esposa.
- source_word: nurtured / raised
  choice: criada
  rationale: Comunica de manera natural que María creció bajo el cuidado del Templo, sin añadir detalles ausentes del testimonio.
- source_word: overshadowed
  choice: cubrió ... con su sombra
  rationale: Conserva la imagen concreta y la resonancia religiosa de la nube que proyecta o extiende su sombra.
- source_word: my soul is magnified
  choice: mi alma ha sido engrandecida
  rationale: Mantiene la formulación inusual y su probable eco del lenguaje bíblico, en vez de reducirla a una emoción genérica.
- source_word: condition
  choice: condición
  rationale: Preserva el eufemismo y la falta de precisión del testimonio sobre la clase de examen que Salomé pretende realizar.
theological_decisions:
- issue: Relación entre José y María
  choice: «sería mi esposa. Sin embargo, no es mi esposa»
  alternative: «me fue dada por esposa, pero todavía no es mi mujer»
  rationale: Se conserva la tensión explícita del relato entre la decisión por sorteo y la negación de una relación marital consumada, sin armonizarla con una doctrina posterior.
- issue: Origen de la concepción
  choice: «ha concebido del Espíritu Santo»
  alternative: «ha concebido por obra del Espíritu Santo»
  rationale: La formulación breve conserva la procedencia expresada por el testimonio y evita desarrollar el mecanismo de la concepción.
- issue: «La salvación ha nacido»
  choice: Se mantiene «la salvación» como sujeto que nace
  alternative: «ha nacido el Salvador»
  rationale: El testimonio habla de la salvación, no explícitamente del Salvador; se conserva esta personificación y su tensión teológica.
- issue: Parto virginal y «contra su naturaleza»
  choice: «una virgen ha dado a luz, algo contrario a su naturaleza»
  alternative: «una virgen ha dado a luz sin que su naturaleza haya sufrido daño»
  rationale: La alternativa interpretaría la frase como integridad física posparto. El borrador retiene la afirmación ambigua del testimonio sin convertirla en una formulación doctrinal más específica.
- issue: Examen propuesto por Salomé
  choice: «examino su condición»
  alternative: «la examino con mis propios dedos»
  rationale: El capítulo proporcionado emplea un eufemismo general. No se incorpora aquí el detalle más explícito que puede aparecer en otros testigos o en la continuación del relato.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya, «partera» en lugar de regionalismos como «comadrona», y «ustedes» queda implícito en la exclamación inicial «¡Miren!». La traducción es provisional porque el material suministrado declara pendiente la revisión directa del griego; por ello no se atribuyen decisiones a vocablos griegos específicos y se mantienen las ambigüedades del testimonio inglés auditado.
