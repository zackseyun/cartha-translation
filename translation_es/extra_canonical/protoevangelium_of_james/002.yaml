    «¿Hasta cuándo seguirás afligiendo tu alma?[b] Mira, el gran día del Señor se ha acercado, y no está bien que te aflijas. Toma esta cinta para la cabeza que me dio la encargada del taller. No está bien que yo la use, porque soy tu sirvienta y lleva una marca real».


    (3) Ana respondió:


    «¡Aléjate de mí! No haré esto. El Señor Dios me ha humillado profundamente. Quizá algún embaucador te dio esto, y has venido para hacerme partícipe de tu pecado».


    Entonces Juthine, la sirvienta, replicó:


    «¿Por qué habría de maldecirte, si no has escuchado mi voz? El Señor Dios ha hecho estéril tu vientre, para no darte fruto en Israel».


    (4) Ana quedó muy afligida. Se quitó la ropa de luto, se lavó la cabeza y se puso su vestido de bodas.[c] Cerca de la hora novena,[d] bajó a su jardín para pasear. Vio un laurel y se sentó debajo de él. Después de descansar, elevó una súplica al Señor:


    «Dios de mis antepasados, bendíceme y escucha mi oración, así como bendijiste a nuestra madre Sara y le diste un hijo, Isaac».'
