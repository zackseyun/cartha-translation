  revision_rationale: Se conserva la fidelidad al testimonio inglés disponible y se corrigen las expansiones no necesarias. En particular, se restituye «Juthine» de manera provisional, porque una revisión independiente de la tradición griega todavía no está documentada en el material suministrado. También se evita identificar a la responsable del taller como propietaria y se mantienen las imágenes antiguas sin suavizar la atribución divina expresada por la sirvienta.
