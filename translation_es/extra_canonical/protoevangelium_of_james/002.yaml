  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: es
  text: '**Protoevangelio de Santiago — Capítulo 2: La aflicción de Ana**


    (1) Ana, su esposa, lloraba y se lamentaba por dos motivos. Decía: «Lloro mi viudez y lloro no tener hijos».[a]


    (2) Se acercaba el gran día del Señor, y Judit,[b] su sirvienta, le dijo:


    «¿Hasta cuándo seguirás afligiendo tu alma?[c] Mira, el gran día del Señor ya está cerca y no está bien que estés de luto. Toma esta cinta para la cabeza que me dio la dueña del taller. No está bien que yo la use, porque soy tu sirvienta y lleva una insignia real».


    (3) Ana respondió:


    «¡Aléjate de mí! No haré tal cosa. El Señor Dios me ha humillado profundamente. Quizá algún embaucador te dio esa cinta y ahora has venido para hacerme partícipe de tu pecado».


    Entonces Judit, la sirvienta, replicó:


    «¿Por qué habría de maldecirte, si no has hecho caso de mis palabras? El Señor Dios ha cerrado tu vientre para que no des fruto en Israel».


    (4) Ana quedó profundamente afligida. Se quitó la ropa de luto, se lavó la cabeza y se puso su vestido de bodas.[d] Cerca de la hora novena,[e] bajó a su jardín para pasear. Vio un laurel y se sentó debajo de él. Después de descansar, suplicó al Señor:


    «Dios de mis antepasados, bendíceme y escucha mi oración, así como bendijiste a nuestra madre Sara y le diste un hijo: Isaac».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «mi viudez» se conserva tal como aparece en la tradición textual, aunque en el relato Joaquín se encuentra ausente; puede describir la experiencia de Ana como si estuviera privada de esposo.
    reason: Aclara una tensión narrativa genuina sin eliminarla del texto principal.
  - marker: b
    text: El testimonio inglés suministrado escribe el nombre «Juthine»; la forma griega comúnmente atestiguada en este pasaje corresponde a Judit. La lectura deberá confirmarse mediante la revisión directa de los manuscritos griegos.
    reason: Documenta la discrepancia nominal y el carácter provisional de la revisión de la fuente.
  - marker: c
    text: «Afligir el alma» es una expresión relacionada con el duelo, la abstinencia o la mortificación personal.
    reason: Explica un modismo antiguo que podría resultar extraño en español corriente.
  - marker: d
    text: También puede entenderse como «su ropa nupcial»; el texto contrasta estas prendas festivas con la ropa de luto.
    reason: Conserva la posible amplitud semántica de la vestimenta mencionada.
  - marker: e
    text: La hora novena corresponde aproximadamente a las tres de la tarde.
    reason: Hace comprensible el antiguo modo de contar las horas.
lexical_decisions:
- source_word: δύο θρήνους / δύο κοπετούς (reflejado en el testimonio como “for two reasons”)
  choice: «por dos motivos… Lloro… y lloro…»
  rationale: Conserva la estructura doble y enfática del lamento, con una formulación natural en español.
- source_word: χήρεια
  choice: «viudez»
  rationale: Mantiene la afirmación sorprendente de Ana sin reinterpretarla como mera soledad o abandono.
- source_word: Ἰουδίθ (forma griega probable; el testimonio inglés dice “Juthine”)
  choice: «Judit»
  rationale: Se adopta la forma hispana tradicional del nombre griego probable, dejando constancia de la variante del testimonio en nota.
- source_word: ταπεινοῖς τὴν ψυχήν (modismo reflejado como “humiliate your soul”)
  choice: «afligiendo tu alma»
  rationale: Comunica un modismo de duelo o mortificación sin sugerir simplemente que Ana se degrada moralmente.
- source_word: κεφαλοδέσμιον
  choice: «cinta para la cabeza»
  rationale: Expresión clara y no excesivamente específica para un adorno o banda que se llevaba en la cabeza.
- source_word: κυρία τοῦ ἐργαστηρίου
  choice: «dueña del taller»
  rationale: Representa de manera directa la relación de autoridad y el lugar de trabajo; evita la frase poco natural «líder del lugar de trabajo».
- source_word: χαρακτῆρα βασιλικόν
  choice: «insignia real»
  rationale: Conserva la idea de una marca, sello o emblema asociado con la realeza sin precisar indebidamente su forma.
- source_word: ἀπέκλεισεν… τὴν μήτραν
  choice: «ha cerrado tu vientre»
  rationale: Mantiene la imagen corporal y la atribución explícita al Señor Dios, en vez de reducirla a terminología clínica.
- source_word: καρπός
  choice: «fruto»
  rationale: Preserva la metáfora de descendencia y su resonancia israelita.
- source_word: δάφνη
  choice: «laurel»
  rationale: Equivalente botánico directo y comprensible.
theological_decisions:
- issue: Ana se describe como viuda aunque Joaquín está ausente, no necesariamente muerto
  choice: Se conserva «mi viudez»
  alternative: «mi abandono» o «estar sin esposo»
  rationale: El texto presenta deliberadamente esta expresión; cambiarla resolvería una tensión narrativa que debe permanecer visible.
- issue: Agencia divina en la infertilidad de Ana
  choice: «El Señor Dios ha cerrado tu vientre»
  alternative: «Tu vientre es infértil»
  rationale: La formulación conserva la afirmación teológica dura de la sirvienta y no la convierte en una observación médica neutral.
- issue: Referencia a Sara e Isaac
  choice: «nuestra madre Sara»
  alternative: «la madre Sara»
  rationale: Mantiene la identificación comunitaria de Ana con la historia de Israel expresada en el texto.
- issue: «El gran día del Señor»
  choice: Se mantiene literalmente y sin identificar la festividad
  alternative: Nombrar una fiesta judía concreta
  rationale: La evidencia proporcionada no permite determinar con seguridad qué celebración se menciona; se preserva la ambigüedad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron imágenes antiguas como «cerrar el vientre», «fruto en Israel» y «hora novena», con notas solo donde la comprensión moderna lo requiere. El borrador se apoya en el testimonio público suministrado y en evidencia griega identificable de manera provisional; sigue pendiente una auditoría directa y completa de la tradición manuscrita griega.
