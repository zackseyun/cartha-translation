review_pass:
  verdict: revise
  source_fidelity: 'Se corrigen dos matices: «looked intently» requiere expresar una mirada fija, y «What womb bore me?» se refiere al seno/vientre que la gestó, no simplemente a una segunda acción de dar a luz. Se conserva la tensión deliberada de las aguas serenas que se agitan, señalada en nota.'
  naturalness: El texto mantiene un español latinoamericano natural, digno y poético. «Miró fijamente al cielo» y «¿Qué vientre me llevó en su seno?» resultan claros y conservan la intensidad del lamento.
  terminology: Se mantienen Ana, Señor, templo, fecundo/a, fieras y «delante de ti». No se introduce interpretación doctrinal ni se elimina la ambigüedad textual indicada.
  issues:
  - severity: medium
    issue: «Alzó la mirada al cielo» atenúa «looked intently».
    rationale: La fuente especifica una mirada atenta o fija; «miró fijamente al cielo» conserva ese matiz sin añadir contenido.
  - severity: medium
    issue: «¿Qué vientre me llevó?» no expresa con suficiente precisión «What womb bore me?».
    rationale: En español, «llevar en el seno» expresa de manera natural que el vientre la gestó; evita una repetición poco clara de «dar a luz».
