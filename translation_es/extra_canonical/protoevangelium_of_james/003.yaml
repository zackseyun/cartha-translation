translation:
  language: es
  text: '(1) Ana alzó la mirada al cielo y vio un nido de gorriones en el laurel. Entonces se lamentó, diciéndose:


    «¡Ay de mí! ¿Quién me dio a luz? ¿Qué vientre me llevó? Nací como una maldición ante el pueblo de Israel y he sido despreciada. Se han burlado de mí y me han expulsado del templo del Señor, mi Dios.


    (2) »¡Ay de mí! ¿A qué me parezco? No soy como las aves del cielo, porque hasta las aves del cielo son fecundas delante de ti, Señor.


    »¡Ay de mí! ¿A qué me parezco? No soy como los animales, porque hasta los animales son fecundos delante de ti, Señor.


    »¡Ay de mí! ¿A qué me parezco? No soy como las fieras de la tierra, porque hasta las fieras de la tierra son fecundas delante de ti, Señor.


    (3) »¡Ay de mí! ¿A qué me parezco? No soy como estas aguas, porque hasta estas aguas están serenas y, sin embargo, se agitan[a], y sus peces te bendicen, Señor.


    »¡Ay de mí! ¿A qué me parezco? No soy como esta tierra, porque la tierra produce sus frutos a su debido tiempo y te bendice, Señor».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión combina serenidad y movimiento de las aguas. Se conserva esta tensión del testimonio disponible; la revisión directa del griego está pendiente.
    reason: Preservar una formulación difícil sin armonizarla ni ocultar la incertidumbre textual.
  - marker: b
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Aún está pendiente la revisión directa de la tradición manuscrita griega.
    reason: Declarar con transparencia la base documental limitada de este borrador.
lexical_decisions:
- source_word: Anna
  choice: Ana
  rationale: Se emplea la forma tradicional y natural del nombre en español bíblico.
- source_word: looked intently toward heaven
  choice: alzó la mirada al cielo
  rationale: Expresa de manera natural la orientación deliberada de la mirada sin añadir una acción ajena al contexto.
- source_word: fruitful
  choice: fecundas / fecundos
  rationale: Conserva el motivo central de la fecundidad y el contraste doloroso con la esterilidad de Ana.
- source_word: animals / wild beasts
  choice: animales / fieras de la tierra
  rationale: Mantiene la distinción del testimonio inglés entre los animales en general y las criaturas salvajes, sin precisar más de lo permitido por la evidencia suministrada.
- source_word: at the proper time
  choice: a su debido tiempo
  rationale: Comunica que la tierra da fruto en el momento correspondiente, con un giro corriente y digno en español.
theological_decisions:
- issue: El lenguaje de Ana sobre haber nacido «como una maldición»
  choice: Conservarlo como expresión de su lamento
  alternative: Atenuarlo como «me consideran una maldición»
  rationale: El pasaje presenta la percepción angustiada de Ana; suavizarla resolvería indebidamente la tensión entre su dolor, el desprecio social y su relación con Dios.
- issue: La fecundidad «delante de ti»
  choice: delante de ti
  alternative: por obra tuya
  rationale: La formulación conserva la dimensión relacional y cultual sin afirmar de manera explícita una causalidad que el testimonio proporcionado no formula.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la repetición poética de «¡Ay de mí!» y «¿A qué me parezco?», así como la progresión entre aves, animales, fieras, aguas y tierra. Las comillas angulares y la continuidad de los párrafos presentan todo el pasaje como un solo lamento.
