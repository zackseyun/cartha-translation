base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: es
  text: '(1) José sintió mucho miedo y guardó silencio acerca de ella mientras pensaba qué hacer. José dijo: «Si oculto su pecado, se descubrirá que me opongo a la ley del Señor. Pero, si la denuncio ante el pueblo de Israel, temo que lo que está dentro de ella sea de origen angelical, y se descubrirá que he entregado sangre inocente a una sentencia de muerte. Entonces, ¿qué haré con ella? La dejaré en secreto».[a]


    Y la noche lo sorprendió. (2) ¡Mira! Un ángel del Señor se le apareció en un sueño y le dijo: «No temas por esta joven,[b] porque quien está en ella procede del Espíritu Santo. Dará a luz un hijo, y le pondrás por nombre Jesús,[c] porque él salvará a su pueblo de sus pecados».


    José despertó y glorificó al Dios de Israel, que le había concedido su favor. Y la protegió.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría traducirse: «La apartaré de mí en secreto» o «la dejaré libre de mí en secreto». El matiz jurídico exacto debe confirmarse mediante revisión directa del griego.'
    reason: La expresión de separación es poco idiomática en el testimonio inglés y puede admitir más de una formulación.
  - marker: b
    text: El testimonio inglés dice literalmente «esta niña» o «esta criatura». Por el contexto, parece referirse a María, aunque la expresión es ambigua. Se requiere cotejo directo con el griego.
    reason: Evita ocultar una dificultad de referente y de género presente en la base disponible.
  - marker: c
    text: «Jesús» representa el nombre griego Iēsous, relacionado con el nombre hebreo Yeshúa y con la idea de que el Señor salva.
    reason: Aclara el juego explicativo entre el nombre y la frase «él salvará».
lexical_decisions:
- source_word: kept quiet about her (English witness; Greek review pending)
  choice: guardó silencio acerca de ella
  rationale: Conserva el sentido de no divulgar su situación sin añadir que José ya hubiera tomado una decisión.
- source_word: what’s inside her might be angelic (English witness; Greek review pending)
  choice: lo que está dentro de ella sea de origen angelical
  rationale: Mantiene la formulación extraña y cautelosa del testimonio, sin identificar de manera más precisa la naturaleza de lo concebido.
- source_word: secretly set her free from me / release her from me (English witness; Greek review pending)
  choice: La dejaré en secreto
  rationale: Expresa una separación discreta en español natural, evitando imponer una categoría jurídica precisa que no puede confirmarse sin cotejo griego.
- source_word: grace (English witness; Greek review pending)
  choice: favor
  rationale: En este contexto narrativo, «favor» comunica con naturalidad un beneficio concedido por Dios sin introducir una formulación doctrinal más técnica.
- source_word: protected her (English witness; Greek review pending)
  choice: la protegió
  rationale: Reproduce directamente la acción final sin ampliarla a convivencia, custodia matrimonial u obediencia específica.
theological_decisions:
- issue: Posible origen angelical de lo concebido
  choice: «sea de origen angelical»
  alternative: «sea un ángel» / «provenga de un ángel»
  rationale: La traducción conserva la incertidumbre de José y la expresión inusual del testimonio, sin resolverla a la luz del anuncio posterior.
- issue: Procedencia del hijo
  choice: «quien está en ella procede del Espíritu Santo»
  alternative: «lo concebido en ella es del Espíritu Santo»
  rationale: Conserva el lenguaje personal del testimonio («the one in her») y afirma procedencia, sin desarrollar una explicación doctrinal adicional.
- issue: Referente de la prohibición «Do not fear this child»
  choice: «No temas por esta joven» con nota
  alternative: «No temas a esta criatura» / «No temas por esta niña»
  rationale: El contexto sugiere que el ángel tranquiliza a José respecto de María, pero el testimonio inglés es léxicamente ambiguo; la nota preserva esa dificultad.
- issue: Relación con Mateo 1
  choice: Se conserva la redacción propia del Protoevangelio
  alternative: Armonizar plenamente con la formulación canónica de Mateo 1:20-21
  rationale: Aunque hay paralelos claros, no se sustituye la forma textual de esta obra por la de otro escrito.
translation_notes:
  register: 'Español latinoamericano neutral, narrativo y digno, con sintaxis accesible. Se conservaron las repeticiones de «José» y el llamado de atención «¡Mira!» por su valor discursivo. Este borrador es necesariamente provisional: la evidencia suministrada consiste en un testimonio inglés de dominio público y señala que la revisión directa de la tradición manuscrita griega está pendiente.'
