base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: es
  text: '(1) ¡Miren! José se disponía a salir hacia Judea cuando se produjo una gran conmoción en Belén de Judea. Llegaron unos magos[a] que preguntaban:


    —¿Dónde está el rey de los judíos? Porque vimos su estrella en el Oriente[b] y hemos venido a adorarlo[c].


    (2) Cuando Herodes lo oyó, se turbó. Envió guardias a buscar a los magos, mandó llamar a los principales sacerdotes y los interrogó en su palacio:


    —¿Qué está escrito acerca del Cristo[d]? ¿Dónde ha de nacer?


    Ellos le respondieron:


    —En Belén de Judea, porque así está escrito.


    Entonces dejó ir a los principales sacerdotes.


    Después interrogó a los magos:


    —¿Qué señal vieron acerca del que ha nacido rey?


    Los magos respondieron:


    —Vimos una estrella inmensa que brillaba entre las demás estrellas y las oscurecía tanto que ya ni siquiera se veían. Así supimos que había nacido un rey para Israel, y vinimos a adorarlo[c].


    Herodes les dijo:


    —Vayan y búsquenlo. Si lo encuentran, infórmenme para que yo también vaya a adorarlo[c].


    (3) Los magos partieron y, ¡miren!, la estrella que habían visto en el Oriente[b] los guio hasta que llegaron a la cueva, y se detuvo sobre la entrada[e] de la cueva. Cuando vieron al niño[f] con María, su madre, sacaron de sus bolsas los regalos que traían: oro, incienso y mirra.


    Después de que un ángel les advirtiera que no fueran a Judea[g], regresaron a su país por otro camino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los «magos» eran sabios o especialistas vinculados con la observación de los astros y otras prácticas de conocimiento; el texto no dice que fueran reyes ni indica cuántos eran.
    reason: Evitar que la tradición posterior determine la identidad o el número de los visitantes.
  - marker: b
    text: 'También puede entenderse: «cuando apareció» o «al salir», según cómo se interprete la expresión relacionada con el ascenso de la estrella.'
    reason: Preservar la posible ambigüedad de la expresión tradicional, pendiente de cotejo directo con el griego.
  - marker: c
    text: El verbo traducido «adorar» también puede referirse a postrarse o rendir homenaje ante alguien de alta dignidad.
    reason: Conservar la tensión entre adoración religiosa y homenaje real.
  - marker: d
    text: «Cristo» significa «Ungido» y equivale al título «Mesías».
    reason: Aclarar el título para lectores contemporáneos sin sustituirlo en el texto.
  - marker: e
    text: 'Literalmente, según el testimonio utilizado para este borrador: «sobre la cabeza de la cueva»; probablemente se refiere a su parte superior o entrada.'
    reason: Evitar una expresión poco natural, dejando constancia de la imagen del texto base provisional.
  - marker: f
    text: 'Literalmente: «a él».'
    reason: Registrar la explicitación contextual usada para lograr un español natural.
  - marker: g
    text: El texto dice que no fueran «a Judea», aunque ya se encuentran en Belén de Judea. Se conserva esta dificultad sin armonizarla con otros relatos.
    reason: Preservar una tensión geográfica genuina del testimonio suministrado.
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Conserva el término tradicional y la identidad abierta de estos visitantes; no los convierte en «reyes» ni especifica su número.
- source_word: worship
  choice: adorar
  rationale: Mantiene la fuerza religiosa del verbo del testimonio disponible sin reducirlo a un saludo cortesano, aunque el campo semántico puede incluir homenaje o postración.
- source_word: Christ
  choice: Cristo
  rationale: Conserva el título cristológico tradicional, comprensible en español; la nota aclara su sentido de «Mesías/Ungido».
- source_word: frankincense
  choice: incienso
  rationale: Es la denominación natural y tradicional en español para la resina aromática mencionada.
- source_word: country
  choice: país
  rationale: Expresa de manera corriente el lugar de origen de los magos sin identificar una región no indicada.
theological_decisions:
- issue: Identidad y número de los magos
  choice: «unos magos», sin número ni título real
  alternative: «tres reyes magos»
  rationale: El texto no dice que fueran reyes ni especifica cuántos eran; se evita incorporar tradiciones posteriores.
- issue: Naturaleza del homenaje al niño
  choice: «adorarlo»
  alternative: «rendirle homenaje»
  rationale: Se conserva la lectura teológicamente fuerte del testimonio, mientras una nota reconoce la amplitud semántica posible.
- issue: Destino que los magos deben evitar
  choice: «que no fueran a Judea»
  alternative: «que no volvieran a Herodes»
  rationale: Aunque la formulación resulta geográficamente tensa, se preserva tal como aparece en el testimonio suministrado y no se armoniza con Mateo.
- issue: Referencia pronominal al niño
  choice: «al niño»
  alternative: «a él»
  rationale: Hace natural el español y explicita el referente evidente sin agregar identidad o doctrina ausentes del pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservó el tono narrativo enfático de «¡Miren!» y se empleó diálogo con raya. El borrador es necesariamente provisional porque el material suministrado identifica como base inmediata un testimonio inglés de dominio público y señala que aún está pendiente la revisión directa de la tradición manuscrita griega.
