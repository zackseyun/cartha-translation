  yaml_path: translation/extra_canonical/protoevangelium_of_james/009.yaml
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: es
  text: '(1) José dejó caer su hacha y fue a reunirse con ellos. Cuando todos se habían congregado, fueron adonde estaba el sacerdote llevando sus varas. El sacerdote tomó todas las varas, entró en el Templo y oró. Cuando terminó la oración, tomó las varas, salió y se las devolvió. Pero no apareció ninguna señal entre ellas. José recibió su vara al final, y ¡miren!: una paloma salió de la vara y voló hasta posarse sobre la cabeza de José. Entonces el sacerdote le dijo: «Has sido escogido para recibir bajo tu cuidado a la virgen del Señor».


    (2) Pero José se negó y dijo: «Tengo hijos y soy anciano, mientras que ella es joven. No quiero ser motivo de burla entre el pueblo de Israel».


    El sacerdote le dijo: «José, teme al Señor tu Dios y recuerda lo que Dios hizo con Datán, Abirón y Coré: la tierra se abrió y se los tragó a todos por su rebelión. Ahora, pues, teme, José, para que estas cosas no sucedan en tu casa».


    (3) José, lleno de temor, la recibió bajo su cuidado y le dijo: «María, te he recibido del Templo del Señor y ahora te llevo a mi casa. Me voy a construir casas, pero volveré contigo. El Señor te protegerá».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: staffs (Greek source review pending)
  choice: varas
  rationale: «Varas» expresa de manera natural los objetos llevados para recibir una señal y evita la connotación exclusivamente pastoral de «cayados».
- source_word: welcome ... into your own care / took into care
  choice: recibir bajo su cuidado / la recibió bajo su cuidado
  rationale: Mantiene la idea de acogida y responsabilidad protectora sin añadir una relación matrimonial que el pasaje no explicita.
- source_word: virgin of the Lord
  choice: virgen del Señor
  rationale: Conserva el título del testimonio y su formulación teológica sin interpretarlo como título técnico posterior.
- source_word: laughingstock
  choice: motivo de burla
  rationale: Es una expresión clara, digna y corriente en español latinoamericano.
- source_word: build houses
  choice: construir casas
  rationale: Retiene el plural llamativo del testimonio en vez de normalizarlo como «trabajar de carpintero» o «construir una casa».
theological_decisions:
- issue: Naturaleza de la responsabilidad de José respecto de María
  choice: «recibir bajo su cuidado»
  alternative: «tomarla por esposa» o «desposarse con ella»
  rationale: El testimonio suministrado habla de cuidado y protección, no formula aquí explícitamente un matrimonio; se preserva esa distinción.
- issue: Alusión al juicio contra Datán, Abirón y Coré
  choice: «por su rebelión»
  alternative: «por contradecir» o «por su oposición»
  rationale: Conserva la dimensión moral y teológica del relato sin especificar más de lo que expresa el testimonio.
- issue: Temor de José
  choice: «lleno de temor»
  alternative: «atemorizado» o «por temor»
  rationale: Mantiene abierta la posibilidad de que se trate tanto de miedo ante el juicio como de temor reverente a Dios.
translation_notes:
  register: Español latinoamericano neutral, narración digna y accesible. Se conservan «Templo» con mayúscula por referencia al santuario de Jerusalén, el plural «casas» y la señal de la paloma. Dado que la revisión directa del griego está pendiente y el material fuente disponible es un testimonio inglés de dominio público, las decisiones se mantienen deliberadamente cautas y no se añaden notas que aparenten certeza manuscrita inexistente.
