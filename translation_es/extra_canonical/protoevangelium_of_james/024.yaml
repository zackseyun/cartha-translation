translation:
  language: es
  text: '(1) Pero, a la hora del saludo, llegaron los sacerdotes, y Zacarías no salió a recibirlos para bendecirlos, como era costumbre. Los sacerdotes se quedaron esperando a Zacarías, para recibir su saludo con una bendición y glorificar al Dios Altísimo.


    (2) Como tardaba, todos sintieron miedo. Pero uno de ellos cobró valor, entró en el santuario y vio sangre coagulada junto al altar del Señor. Y una voz decía: «¡Zacarías ha sido asesinado, y su sangre no será borrada hasta que llegue quien lo vengue!».


    Al oír estas palabras, tuvo miedo y fue a contarles a los sacerdotes lo que había visto y oído. (3) Entonces ellos cobraron valor, entraron y vieron lo que había sucedido. Los paneles del Templo clamaron, y los sacerdotes se rasgaron la ropa de arriba abajo. No encontraron su cadáver, pero vieron que su sangre se había convertido en piedra. Sintieron miedo, salieron y anunciaron a todo el pueblo que Zacarías había sido asesinado. Cuando todas las tribus del pueblo lo supieron, guardaron duelo por él y lloraron durante tres días y tres noches.


    (4) Después de tres días, los sacerdotes se reunieron para decidir quién ocuparía el lugar de Zacarías. La suerte cayó sobre Simeón, pues el Espíritu Santo le había revelado que no vería la muerte antes de ver al Cristo en carne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «En carne» conserva la expresión del testimonio y subraya que Simeón vería al Cristo en existencia corporal; la revisión directa del texto griego sigue pendiente.
    reason: La frase es deliberadamente compacta y teológicamente significativa; la nota aclara su sentido básico sin sustituirla por una formulación doctrinal más desarrollada.
lexical_decisions:
- source_word: hour of greeting (Greek source review pending)
  choice: hora del saludo
  rationale: Conserva el carácter señalado de la ocasión sin convertirla, sin evidencia suficiente, en el nombre técnico de un rito concreto.
- source_word: sanctuary (Greek source review pending)
  choice: santuario
  rationale: Distingue el recinto sagrado interior del Templo mencionado después y evita ampliar el término a todo el edificio.
- source_word: avenger (Greek source review pending)
  choice: quien lo vengue
  rationale: Expresa en español natural la llegada de una persona que reclama o ejecuta venganza por la sangre, sin identificarla ni precisar su función más de lo que permite el testimonio.
- source_word: panels of the Temple (Greek source review pending)
  choice: paneles del Templo
  rationale: Mantiene el referente arquitectónico general del testimonio inglés; se evita sustituirlo por puertas, vigas o muros mientras siga pendiente la revisión directa del griego.
- source_word: lot fell to Simeon (Greek source review pending)
  choice: la suerte cayó sobre Simeón
  rationale: Conserva el lenguaje tradicional de selección por sorteo y no lo reduce a una mera decisión humana del consejo.
- source_word: the Christ in the flesh (Greek source review pending)
  choice: el Cristo en carne
  rationale: Preserva la formulación corporal y cristológica, incluida su tensión, sin parafrasearla como «Jesús», «el Mesías encarnado» o «en persona».
theological_decisions:
- issue: La desaparición del cuerpo y la sangre convertida en piedra
  choice: Se narran ambas afirmaciones tal como aparecen, sin explicar su relación ni proponer un milagro específico.
  alternative: Armonizar el pasaje suponiendo que el cuerpo fue ocultado o que la sangre solo se endureció.
  rationale: El relato presenta esos elementos sin resolverlos; la traducción conserva esa tensión narrativa.
- issue: Identidad de quien vengará a Zacarías
  choice: 'Se mantiene indefinida: «quien lo vengue».'
  alternative: Identificar al vengador con Dios, con el Mesías o con una figura histórica concreta.
  rationale: El testimonio suministrado no identifica al vengador, por lo que hacerlo importaría una interpretación.
- issue: Revelación del Espíritu Santo a Simeón
  choice: «el Espíritu Santo le había revelado»
  alternative: «había recibido un oráculo» o «se le había profetizado».
  rationale: Comunica de manera natural que Simeón recibió el mensaje del Espíritu, sin especificar un medio de revelación que el testimonio no aporta.
- issue: Cristo «en carne»
  choice: Se conserva la expresión literal con nota aclaratoria mínima.
  alternative: «el Cristo encarnado», «el Mesías en persona» o «Jesús hecho hombre».
  rationale: Las alternativas resuelven o desarrollan teológicamente una frase cuya formulación concreta conviene mantener.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la repetición narrativa, el tono solemne y las imágenes extraordinarias del relato, pero se aligeraron construcciones inglesas poco naturales. Este borrador es provisional porque el material suministrado indica que la revisión directa de la tradición manuscrita griega sigue pendiente.
