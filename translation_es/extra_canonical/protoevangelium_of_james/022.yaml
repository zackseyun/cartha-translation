review_pass:
  verdict: revise
  source_fidelity: El borrador reproduce fielmente la secuencia narrativa y el carácter milagroso del pasaje. Sin embargo, «verdugos» puede sugerir ejecutores oficiales más que los «matadores/asesinos» enviados en el texto; y «bueyes» restringe indebidamente la referencia al ganado bovino, donde el griego βοῶν y el testimonio inglés «cows» no exigen machos castrados. Se conserva la formulación inclusiva «de dos años o menos» y la personificación de la montaña.
  naturalness: El español es claro, actual y de registro narrativo digno. «De dos años o menos» resulta más preciso y natural que «de dos años para abajo» en este contexto. «Comedero para el ganado» evita una especificación de sexo animal no apoyada y sigue siendo comprensible.
  terminology: Se mantienen «magos», «pañales», «pesebre», «ángel del Señor» y los nombres María, Elisabet y Juan. «Matadores» refleja de manera más directa la función indicada sin la connotación técnica de «verdugos».
  issues:
  - severity: medium
    issue: «Verdugos» para quienes Herodes envía
    rationale: El término puede evocar a funcionarios que ejecutan una sentencia. El texto los caracteriza de forma más general como personas enviadas a matar; «matadores» conserva esa caracterización sin añadir un marco judicial.
  - severity: low
    issue: «Pesebre para bueyes»
    rationale: La referencia al ganado bovino no justifica limitarla a «bueyes»; «para el ganado» conserva el sentido sin esa precisión añadida.
  - severity: low
    issue: «De dos años para abajo»
    rationale: Aunque comprensible, «de dos años o menos» expresa con mayor exactitud la delimitación de edad del original.
  revised_text: 'Protoevangelio de Santiago — Capítulo 22: La matanza de los niños


    (1) Cuando Herodes se dio cuenta de que los magos lo habían engañado, se enfureció. Envió a sus matadores y les ordenó matar a todos los niños de dos años o menos.


    (2) Cuando María oyó que estaban matando a los niños, tuvo miedo. Tomó a su hijo, lo envolvió en pañales y lo acostó en un pesebre para el ganado.


    (3) Cuando Elisabet oyó que buscaban a Juan, lo llevó a las colinas y buscó dónde esconderlo, pero no encontró ningún escondite. Entonces Elisabet gimió y dijo: «Montaña de Dios, recibe a una madre con su hijo», pues ya no podía subir más. De inmediato, la montaña se abrió y la recibió, y una luz brilló para ella a través de la montaña. Pues un ángel del Señor estaba con ellos y los protegía.'
  revised_footnotes: []
  revision_rationale: La revisión ajusta dos precisiones léxicas que el borrador introducía («verdugos» y «bueyes») y mejora la expresión del límite etario. También se restituye «Pues» como oración independiente al final, siguiendo la progresión del testimonio y evitando que el ángel sea presentado como explicación causal de la luz. No se añaden notas porque no hay variante textual ni ambigüedad que requiera anclaje en este pasaje.
