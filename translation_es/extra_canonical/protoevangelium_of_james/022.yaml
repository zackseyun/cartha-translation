base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: es
  text: 'Protoevangelio de Santiago — Capítulo 22: La matanza de los niños


    (1) Cuando Herodes se dio cuenta de que los magos lo habían engañado, se enfureció. Envió a sus verdugos y les ordenó matar a todos los niños de dos años para abajo.


    (2) Cuando María oyó que estaban matando a los niños, tuvo miedo. Tomó a su hijo, lo envolvió en pañales y lo acostó en un pesebre para bueyes.


    (3) Cuando Elisabet oyó que buscaban a Juan, lo llevó a las colinas y buscó dónde esconderlo, pero no encontró ningún escondite. Entonces Elisabet gimió y dijo: «Montaña de Dios, recibe a una madre con su hijo», pues ya no podía subir más. De inmediato, la montaña se abrió, la recibió, y una luz brilló para ella a través de la montaña, porque un ángel del Señor estaba con ellos y los protegía.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Es el término tradicional y preciso en este contexto antiguo; evita añadir la idea de que fueran reyes.
- source_word: killers
  choice: verdugos
  rationale: Conserva la función explícita de quienes fueron enviados a matar, con un registro narrativo digno y comprensible.
- source_word: infants
  choice: niños
  rationale: En este contexto, «niños» suena más natural que «infantes» en español latinoamericano y abarca a las víctimas de hasta dos años.
- source_word: wrapped him in cloths
  choice: lo envolvió en pañales
  rationale: Expresa de manera natural la acción de envolver a un niño pequeño sin introducir detalles ajenos al relato.
- source_word: manger for cows
  choice: pesebre para bueyes
  rationale: «Pesebre» es la designación natural del comedero; «bueyes» refleja la referencia tradicional al ganado bovino sin convertir el lugar en un establo.
- source_word: take in
  choice: recibe
  rationale: Mantiene la personificación de la montaña y anticipa de forma coherente que esta se abre y acoge a Elisabet.
- source_word: protecting
  choice: los protegía
  rationale: Presenta la protección como la acción continua del ángel y conserva el referente plural del testimonio suministrado.
theological_decisions:
- issue: Carácter milagroso de la apertura de la montaña y de la luz
  choice: Se narra directamente, sin explicación naturalizante ni ampliación doctrinal.
  alternative: Interpretar la montaña o la luz como símbolos.
  rationale: El relato presenta estos hechos como acciones concretas; la traducción conserva su forma narrativa sin decidir cuestiones históricas o simbólicas por el lector.
- issue: Identidad y función del ángel del Señor
  choice: «un ángel del Señor»
  alternative: «el ángel del Señor» o identificarlo con una figura divina específica.
  rationale: El testimonio suministrado usa una referencia indefinida; se evita importar una identificación teológica que el pasaje no formula.
- issue: Alcance del pronombre plural al final
  choice: «estaba con ellos y los protegía»
  alternative: Cambiarlo a singular y referir la protección únicamente a Elisabet.
  rationale: Se conserva la tensión gramatical del testimonio, donde Elisabet y Juan constituyen el referente plural más inmediato.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron la repetición narrativa, la personificación de la montaña y la progresión sencilla del relato. Este borrador es provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa de la tradición manuscrita griega está pendiente.'
