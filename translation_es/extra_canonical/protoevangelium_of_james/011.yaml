  text: '(1) She took the pitcher and went to fill it with water, and look! A voice said to her, “Rejoice, blessed one! The Lord is with you. Blessed are you among women.”


    Mary looked around to the right and the left to see where the voice might be coming from. She became terrified and went into her house. After setting down the pitcher, she took up the purple, sat upon her throne, and spun the purple.


    (2) And look! An angel of the Lord stood before her and said, “Do not be afraid, Mary, because you have found grace before the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she questioned herself, saying, “Will I conceive from the Lord, the living God, and give birth as all women give birth?”


    (3) The angel of the Lord said to her, “Not like that, Mary, because the power of God will overshadow you. Therefore, the holy one who will be born from you will be called the Son of the Most High. You will call his name Jesus, because he will save his people from their sins.”


    Mary said, “Look, I am the servant of the Lord. May it happen to me according to your word.”'
translation:
  language: es
  text: '(1) Ella tomó el cántaro y fue a llenarlo de agua. Y he aquí que una voz le decía:


    «¡Alégrate, favorecida! El Señor está contigo. Bendita eres entre las mujeres».


    María miró a derecha e izquierda para ver de dónde podría venir la voz. Atemorizada, entró en su casa. Dejó el cántaro, tomó la púrpura, se sentó en su trono y comenzó a hilarla.


    (2) Y he aquí que un ángel del Señor se presentó ante ella y le dijo:


    «No temas, María, porque has hallado gracia ante el Señor de todo. Concebirás por la palabra de Dios».[a]


    Al oír esto, María se preguntó:


    «¿Concebiré del Señor, el Dios viviente, y daré a luz como dan a luz todas las mujeres?»


    (3) El ángel del Señor le dijo:


    «No será de esa manera, María, porque el poder de Dios te cubrirá con su sombra. Por eso, el santo que nacerá de ti será llamado Hijo del Altísimo. Le pondrás por nombre Jesús, porque él salvará a su pueblo de sus pecados».


    María dijo:


    «He aquí la sierva del Señor. Que suceda conmigo conforme a tu palabra».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría traducirse: «Concebirás de la Palabra de Dios». El testimonio suministrado permite entender «palabra» como el medio o mensaje divino, pero también puede evocar un uso personal o titular; la revisión directa de la tradición griega sigue pendiente.'
    reason: Señala una ambigüedad léxica y teológica real que no debe resolverse silenciosamente.
lexical_decisions:
- source_word: χαῖρε (probable Greek underlying the witness’s “Rejoice”)
  choice: Alégrate
  rationale: Conserva el valor exhortativo y el eco de la fórmula de salutación sin reducirla al saludo moderno «hola».
- source_word: κεχαριτωμένη / equivalent reflected by “blessed one”
  choice: favorecida
  rationale: Distingue esta expresión de «bendita» en la frase siguiente y evita imponer una formulación confesional; la revisión directa del griego queda pendiente.
- source_word: πορφύρα / “the purple”
  choice: la púrpura
  rationale: Mantiene la referencia sustantivada al material o hilo púrpura propia del relato, en vez de explicitar de manera no atestiguada «tela» o «lana».
- source_word: χάρις / “grace”
  choice: gracia
  rationale: Preserva el término teológicamente significativo y la expresión bíblica tradicional «hallar gracia».
- source_word: λόγος θεοῦ / “God’s word”
  choice: la palabra de Dios
  rationale: Mantiene la ambigüedad entre palabra pronunciada, mensaje y posible resonancia teológica, sin convertirla explícitamente en un título personal.
- source_word: ἐπισκιάζω / “overshadow”
  choice: cubrirá con su sombra
  rationale: Reproduce la imagen metafórica concreta sin explicar de más su mecanismo.
- source_word: κύριος πάντων / “Lord of All”
  choice: Señor de todo
  rationale: Expresa dominio universal con naturalidad en español y sin introducir el título diferente «Todopoderoso».
theological_decisions:
- issue: Modo de la concepción expresado por «from God’s word»
  choice: Concebirás por la palabra de Dios
  alternative: Concebirás de la Palabra de Dios
  rationale: La preposición «por» conserva una lectura instrumental o causal y evita decidir que «Palabra» sea aquí necesariamente un título cristológico personal.
- issue: Relación entre la sombra del poder divino y el nacimiento del santo
  choice: Por eso, el santo que nacerá de ti será llamado Hijo del Altísimo
  alternative: Así, el santo nacido de ti será llamado Hijo del Altísimo
  rationale: Conserva la conexión causal indicada por el testimonio, sin desarrollar una explicación doctrinal adicional.
- issue: Pregunta de María sobre concebir «from the Lord»
  choice: ¿Concebiré del Señor, el Dios viviente...?
  alternative: ¿Concebiré por obra del Señor, el Dios viviente...?
  rationale: La forma «del Señor» preserva la expresión difícil y su tensión, mientras que «por obra de» resolvería el sentido de manera interpretativa.
- issue: Autodesignación de María
  choice: la sierva del Señor
  alternative: la esclava del Señor
  rationale: «Sierva» conserva el registro bíblico digno y la relación de servicio y pertenencia, sin las asociaciones modernas más estrechas de «esclava».
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con giros bíblicos inteligibles como «he aquí», «hallar gracia» y «conforme a tu palabra». Se conserva la repetición narrativa y la imaginería del testimonio. Este borrador se basa en el testimonio inglés público proporcionado; al estar pendiente la revisión directa del griego, las reconstrucciones léxicas griegas indicadas son provisionales.
