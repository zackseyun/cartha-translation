base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: es
  text: '(1) María hizo la púrpura y la escarlata,[a] y se las llevó al sacerdote. Él las recibió, la bendijo y dijo: «María, el Señor Dios ha engrandecido tu nombre, y serás bendecida entre todas las generaciones de la tierra».


    (2) María se alegró y fue a ver a su parienta Elisabet.[b] Llamó a la puerta. Al oír, Elisabet dejó caer la escarlata y corrió hacia la puerta. La abrió, bendijo a María y dijo: «¿Cómo es que la madre de mi Señor viene a mí? Pues mira: ¡el que está dentro de mí saltó y te bendijo!».


    Pero María había olvidado los misterios que el ángel Gabriel le había comunicado.[c] Miró fijamente al cielo y dijo: «Señor, ¿quién soy yo para que todas las mujeres de la tierra me bendigan?».


    (3) María permaneció tres meses con Elisabet. Día tras día, su vientre crecía, y María sintió miedo. Fue a su casa y se ocultó del pueblo de Israel. Tenía dieciséis años cuando le sucedieron estos misterios.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «La púrpura y la escarlata» pueden referirse a materiales textiles o a labores hechas con ellos; el texto no lo especifica aquí.
    reason: Aclara la ambigüedad material sin resolverla en el cuerpo del texto y sitúa el ancla junto a la expresión anotada.
  - marker: b
    text: El término de parentesco transmitido por el testimonio permite entender que Elisabet era parienta de María, pero no establece necesariamente que fuera su prima.
    reason: Evita presentar como seguro un grado preciso de parentesco.
  - marker: c
    text: «Misterios» conserva el término del relato para las cosas que Gabriel le había comunicado a María; no se limita aquí a «secretos».
    reason: Preserva el campo semántico y la tensión teológica del término.
  - marker: d
    text: La indicación de que María tenía dieciséis años pertenece a la tradición narrativa de esta obra.
    reason: Señala un dato propio del escrito sin armonizarlo con otras fuentes.
lexical_decisions:
- source_word: purple and scarlet
  choice: la púrpura y la escarlata
  rationale: Se conservan como sustantivos textiles o materiales, en continuidad con el contexto previo de la obra, sin añadir «hilo» ni «tela», que el testimonio suministrado no explicita.
- source_word: cousin
  choice: parienta
  rationale: El parentesco exacto no es seguro; «parienta» evita precisar «prima» sin suficiente fundamento y suena natural en español latinoamericano.
- source_word: mysteries
  choice: misterios
  rationale: Mantiene deliberadamente la amplitud y la carga religiosa del término, sin reducirlo a «secretos», «anuncios» o «sucesos».
- source_word: the one in me
  choice: el que está dentro de mí
  rationale: Conserva la forma indirecta del pasaje y no introduce explícitamente «niño» o «bebé».
- source_word: magnified your name
  choice: ha engrandecido tu nombre
  rationale: Retiene el giro solemne y semítico del testimonio en vez de interpretarlo como mera fama o prestigio.
theological_decisions:
- issue: La bendición pronunciada por Elisabet
  choice: «saltó y te bendijo»
  alternative: «saltó de alegría por ti»
  rationale: Se conserva la afirmación peculiar y teológicamente tensa de que el que está en Elisabet bendice a María; no se armoniza silenciosamente con Lucas 1:41-44.
- issue: El olvido de María
  choice: «María había olvidado los misterios»
  alternative: «María no comprendía plenamente los misterios»
  rationale: El texto afirma olvido, no mera falta de comprensión; se mantiene esa dificultad narrativa sin suavizarla.
- issue: Título «mi Señor»
  choice: «la madre de mi Señor»
  alternative: «la madre del Señor»
  rationale: Se conserva el posesivo y el título cristológico tal como aparecen en el testimonio.
- issue: Bendición futura de María
  choice: «todas las mujeres de la tierra me bendigan»
  alternative: «todas las mujeres de la tierra me llamen bendita»
  rationale: La formulación del testimonio expresa una acción directa de bendecir; se mantiene, aunque la alternativa podría acercarse a una fórmula lucana más conocida.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se moderó la repetición de «y» donde resultaba rígida en español, pero se mantuvo el avance narrativo sencillo. Se usa «Elisabet», forma bíblica reconocible en español, y «ustedes» no resulta pertinente en este pasaje. Dado que la revisión directa del griego está pendiente, las decisiones se apoyan de manera provisional en el testimonio inglés público suministrado y en la capa inglesa auditada.
