revisions:
- from: '(1) María terminó de trabajar la púrpura y la escarlata, y se las llevó al sacerdote.[a] Él las recibió, la bendijo y dijo: «María, el Señor Dios ha engrandecido tu nombre, y serás bendecida entre todas las generaciones de la tierra».


    (2) María se alegró y fue a ver a su parienta Elisabet.[b] Llamó a la puerta. Al oírla, Elisabet soltó la escarlata y corrió hacia la puerta. La abrió, bendijo a María y dijo: «¿Cómo es que la madre de mi Señor viene a visitarme? Pues mira: ¡el que está dentro de mí saltó y te bendijo!».


    Pero María había olvidado los misterios que el ángel Gabriel le había comunicado.[c] Miró fijamente al cielo y dijo: «Señor, ¿quién soy yo para que todas las mujeres de la tierra me bendigan?».


    (3) María permaneció tres meses con Elisabet. Día tras día, su vientre crecía, y María sintió miedo. Regresó a su casa y se ocultó del pueblo de Israel. Tenía dieciséis años cuando le sucedieron estos misterios.[d]'
  to: '(1) María hizo la púrpura y la escarlata,[a] y se las llevó al sacerdote. Él las recibió, la bendijo y dijo: «María, el Señor Dios ha engrandecido tu nombre, y serás bendecida entre todas las generaciones de la tierra».


    (2) María se alegró y fue a ver a su parienta Elisabet.[b] Llamó a la puerta. Al oír, Elisabet dejó caer la escarlata y corrió hacia la puerta. La abrió, bendijo a María y dijo: «¿Cómo es que la madre de mi Señor viene a mí? Pues mira: ¡el que está dentro de mí saltó y te bendijo!».


    Pero María había olvidado los misterios que el ángel Gabriel le había comunicado.[c] Miró fijamente al cielo y dijo: «Señor, ¿quién soy yo para que todas las mujeres de la tierra me bendigan?».


    (3) María permaneció tres meses con Elisabet. Día tras día, su vientre crecía, y María sintió miedo. Fue a su casa y se ocultó del pueblo de Israel. Tenía dieciséis años cuando le sucedieron estos misterios.[d]'
  rationale: 'Se hacen correcciones seguras de fidelidad frente al testimonio inglés auditado: se elimina la finalización añadida en «terminó», se conserva la elipsis de lo que Elisabet oyó, y se evitan las inferencias narrativas de «visitar» y «regresó». Se mantiene la ambigüedad de los materiales textiles, el parentesco, «misterios» y «el que está dentro de mí». La revisión directa del griego sigue pendiente, por lo que no se resuelven posibles cuestiones textuales más allá de la base suministrada.'
