translation:
  language: es
  text: '(1) En los registros de las doce tribus de Israel, Joaquín era un hombre muy rico. Duplicaba las ofrendas que presentaba al Señor, diciéndose: «Una parte de mis bienes excedentes será para todo el pueblo, y la otra será para el Señor Dios, a fin de que me perdone y sirva de expiación por mí».


    (2) Se acercaba el gran día del Señor, y los israelitas presentaban sus ofrendas. Pero Rubén se plantó ante Joaquín y le dijo: «No te corresponde presentar primero tus ofrendas, porque no has engendrado descendencia en Israel».


    (3) Joaquín se entristeció mucho y acudió al registro[a] de las doce tribus del pueblo, diciéndose: «Examinaré el registro[a] de las doce tribus de Israel para saber si soy el único que no ha engendrado descendencia en Israel». Investigó y descubrió que todos los justos de Israel habían tenido hijos. Entonces recordó que, en los últimos años del patriarca Abraham, el Señor Dios le había dado un hijo: Isaac.


    (4) Joaquín se entristeció mucho y no volvió con su esposa, sino que se retiró al desierto y allí levantó su tienda. Ayunó cuarenta días y cuarenta noches, diciéndose: «No bajaré a buscar comida ni bebida hasta que el Señor mi Dios se ocupe de mí. La oración será mi comida y mi bebida».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: También podría entenderse como «historia» o «anales». El testimonio suministrado deja incierto el sentido preciso, y la revisión directa de la tradición griega está pendiente.
    reason: Preservar la ambigüedad señalada expresamente en el testimonio inglés sin recurrir a paréntesis poco naturales en el cuerpo del texto.
lexical_decisions:
- source_word: histories / (history) (Greek review pending)
  choice: registros / registro
  rationale: En este contexto se trata de documentos genealógicos o anales tribales. «Registro» es natural en español y conserva suficiente amplitud sin introducir la explicación «genealogía» en el texto.
- source_word: Joachim
  choice: Joaquín
  rationale: Se emplea la forma tradicional y reconocible del nombre en español.
- source_word: Reubel
  choice: Rubén
  rationale: Se usa la forma bíblica convencional en español para el nombre transmitido por el testimonio.
- source_word: had a child / raised children
  choice: engendrado descendencia / habían tenido hijos
  rationale: La variación en español comunica tanto la falta de prole atribuida a Joaquín como la constatación general respecto de los justos, sin sugerir meramente la crianza de hijos ajenos.
- source_word: considers me
  choice: se ocupe de mí
  rationale: Expresa la esperanza de atención o intervención divina sin precisar indebidamente si se trata de recordar, mirar o visitar.
- source_word: gave himself to the wilderness
  choice: se retiró al desierto
  rationale: Equivalencia idiomática clara y digna para la acción de apartarse y permanecer allí.
theological_decisions:
- issue: Función de la segunda ofrenda
  choice: «a fin de que me perdone y sirva de expiación por mí»
  alternative: «para perdón, para expiar por mí»
  rationale: Conserva conjuntamente las ideas de perdón y expiación presentes en el testimonio, sin formular una teoría doctrinal sobre el mecanismo de la ofrenda.
- issue: La esterilidad como impedimento para ofrecer primero
  choice: Se conserva la afirmación directa de Rubén
  alternative: Explicarla como una norma religiosa oficialmente establecida
  rationale: El pasaje presenta la objeción del personaje, pero no determina aquí su legitimidad ni su fundamento; la traducción no debe validarla ni refutarla.
- issue: Atención divina esperada por Joaquín
  choice: «hasta que el Señor mi Dios se ocupe de mí»
  alternative: «hasta que el Señor mi Dios me conceda un hijo»
  rationale: No se explicita todavía el resultado solicitado; se preserva la formulación abierta y su tensión narrativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las repeticiones narrativas características del relato, con ajustes moderados para dar fluidez. Este borrador es provisional porque el material proporcionado identifica como pendiente la revisión directa del griego; por ello, las decisiones sobre «registros», «expiación» y «se ocupe de mí» deben cotejarse posteriormente con los manuscritos griegos.
