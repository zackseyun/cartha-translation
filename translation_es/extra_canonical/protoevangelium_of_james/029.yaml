translation:
  language: es
  text: '(1) Ella entró y la colocó en posición, y Salomé examinó su estado. Entonces Salomé gritó: «¡He puesto a prueba al Dios vivo, y miren! ¡Mi mano está ardiendo y se desprende de mí!».


    (2) Ella oró al Señor, y la partera quedó sana en aquella misma hora.


    (3) Y miren: un ángel del Señor se presentó ante Salomé y le dijo: «Tu oración ha sido escuchada ante el Señor Dios. Ve, toca al niño y recibirás salvación».


    (4) Ella así lo hizo, y Salomé quedó sana. Mientras adoraba y salía de la cueva, miren: la voz de un ángel del Señor dijo: «Salomé, Salomé, no cuentes las maravillas que has visto hasta que el niño entre en Jerusalén».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El testimonio inglés suministrado dice literalmente: «cuenta las maravillas que has visto hasta que el niño entre en Jerusalén». La traducción principal sigue la lectura tradicional del pasaje: «no cuentes… hasta que», que encaja con la prohibición temporal; debe verificarse mediante revisión directa de los manuscritos griegos.'
    reason: Documentar una diferencia significativa entre el testimonio inglés proporcionado y la lectura tradicional, dado que la revisión de la fuente griega aún está pendiente.
lexical_decisions:
- source_word: positioned her
  choice: la colocó en posición
  rationale: Conserva la referencia pronominal ambigua del testimonio disponible sin añadir una identificación no explícita.
- source_word: examined her condition
  choice: examinó su estado
  rationale: Expresa el examen de manera natural y discreta, sin introducir detalles anatómicos ausentes del testimonio suministrado.
- source_word: tested the living God
  choice: he puesto a prueba al Dios vivo
  rationale: Mantiene la acusación teológica y el aspecto perfectivo de la declaración.
- source_word: on fire and falling away from me
  choice: está ardiendo y se desprende de mí
  rationale: Conserva las dos imágenes intensas sin decidir si describen combustión, deterioro o separación física.
- source_word: was healed
  choice: quedó sana
  rationale: Es una expresión clara y natural que comunica una restauración completa.
- source_word: receive salvation
  choice: recibirás salvación
  rationale: Preserva el término teológicamente amplio sin reducirlo a mera curación física.
- source_word: worshipped
  choice: adoraba
  rationale: Mantiene el sentido religioso fuerte del verbo, sin especificar el objeto cuando el testimonio no lo hace.
- source_word: wonderful things
  choice: las maravillas
  rationale: Refleja hechos extraordinarios y dignos de asombro con una formulación bíblica natural.
theological_decisions:
- issue: Distinción entre Salomé y «la partera» en el versículo 2
  choice: Se conserva «la partera» tal como aparece en el testimonio, aunque el referente pueda ser Salomé.
  alternative: Sustituirlo por «Salomé» o por «ella».
  rationale: No se debe resolver silenciosamente una variación o tensión narrativa presente en la evidencia proporcionada.
- issue: Alcance de «salvación» en el versículo 3
  choice: Se traduce literalmente «salvación».
  alternative: Traducir «sanidad» o «curación».
  rationale: El contexto incluye sanidad, pero el término puede tener un alcance teológico más amplio; conviene preservar esa amplitud.
- issue: Mandato final sobre la divulgación
  choice: «no cuentes… hasta que»
  alternative: «cuenta… hasta que».
  rationale: La formulación afirmativa del testimonio inglés parece semánticamente difícil; la tradición griega conocida de este pasaje contiene una prohibición temporal. Debido a que la revisión directa del griego está pendiente, la decisión se señala en nota.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el ritmo narrativo con «Y miren», los referentes pronominales ambiguos y la tensión entre «Salomé» y «la partera». El borrador es provisional porque el material suministrado es un testimonio inglés y la revisión directa del griego está pendiente.
