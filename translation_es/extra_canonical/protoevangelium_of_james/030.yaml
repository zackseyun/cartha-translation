  terminology: «Magos», «adorarlo», «funcionarios», «cueva», «incienso» y «mirra» son opciones apropiadas. Las notas sobre «magos», «adorarlo» y la alternancia plural-singular son pertinentes, sobrias y no imponen interpretaciones doctrinales ni armonizaciones externas.
