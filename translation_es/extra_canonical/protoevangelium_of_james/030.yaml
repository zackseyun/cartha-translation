  source_fidelity: 'La traducción conserva los elementos narrativos del testimonio suministrado: la salida proyectada de José hacia Judea, la conmoción en Belén de Judea, la consulta de los magos, la reacción de Herodes, el envío de agentes, la llegada a la cueva y la secuencia deliberadamente irregular «estrellas»/«la estrella». También mantiene explícitamente que la estrella quedó sobre la cabeza del niño y que los regalos procedían de las bolsas de los magos.'
