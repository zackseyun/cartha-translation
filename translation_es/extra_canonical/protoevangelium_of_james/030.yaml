base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: es
  text: '(1) ¡Miren! José se disponía a salir hacia Judea cuando se produjo una gran agitación en Belén de Judea. Habían llegado unos magos[a], que preguntaban:


    —¿Dónde está el rey de los judíos? Porque vimos su estrella en Oriente y hemos venido a adorarlo[b].


    (2) Cuando Herodes oyó esto, se inquietó. Envió funcionarios y mandó llamar a los magos, y ellos le hablaron de la estrella.


    (3) ¡Miren! Ellos vieron unas estrellas en Oriente. Las estrellas los guiaron hasta que llegaron a la cueva; entonces la estrella[c] se detuvo sobre la cabeza del niño. Cuando los magos lo vieron con María, su madre, sacaron de sus bolsas regalos: oro, incienso y mirra.


    Después de que el ángel les advirtiera, regresaron a su país por otro camino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Magos» designa aquí a especialistas orientales asociados con la observación de los astros y otros saberes; el texto no los llama reyes.
    reason: Evita el sentido moderno limitado de ilusionistas y no introduce la tradición posterior de que fueran reyes.
  - marker: b
    text: La expresión traducida «adorarlo» también puede referirse a postrarse ante alguien o rendirle homenaje.
    reason: Conserva la amplitud del acto descrito sin resolver de manera indebida su alcance teológico.
  - marker: c
    text: El relato pasa de «estrellas», en plural, a «la estrella», en singular. Se conserva ese cambio tal como aparece en el testimonio.
    reason: Documenta y preserva una variación interna llamativa que no debe armonizarse silenciosamente.
lexical_decisions:
- source_word: magi
  choice: magos
  rationale: Conserva el término antiguo y su amplitud cultural sin convertir a estos personajes en «reyes» ni reducirlos simplemente a «sabios».
- source_word: worship
  choice: adorarlo
  rationale: Es la expresión natural en este contexto y conserva la fuerza religiosa del testimonio; una nota señala que el término también puede describir homenaje o postración.
- source_word: officers
  choice: funcionarios
  rationale: Comunica que eran agentes al servicio de Herodes sin precisar indebidamente que fueran soldados o guardias.
- source_word: cave
  choice: cueva
  rationale: Mantiene el escenario explícito de esta obra, sin armonizarlo con otras tradiciones de la infancia.
- source_word: frankincense
  choice: incienso
  rationale: Es el nombre corriente en español para la resina aromática ofrecida, y resulta más natural que una especificación técnica como «olíbano».
theological_decisions:
- issue: Naturaleza del homenaje rendido al niño
  choice: «adorarlo», con nota de amplitud semántica
  alternative: «rendirle homenaje» o «postrarnos ante él»
  rationale: No se elimina la lectura religiosa tradicional, pero tampoco se afirma que el verbo, por sí solo, resuelva toda la cuestión cristológica.
- issue: Identidad de los magos
  choice: «magos»
  alternative: «sabios de Oriente» o «reyes magos»
  rationale: El texto no los llama reyes. Mantener «magos» evita importar ese desarrollo tradicional y conserva la designación antigua.
- issue: Cambio de plural a singular en el fenómeno celeste
  choice: Conservar «estrellas» y luego «la estrella»
  alternative: Uniformar todo en singular
  rationale: El cambio está presente en el testimonio suministrado y debe mantenerse como tensión textual genuina, no corregirse silenciosamente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el tono narrativo enfático de «¡Miren!», la repetición de Judea, la cueva como lugar de llegada y la secuencia plural-singular de las estrellas. Dado que la revisión directa del griego está pendiente, las decisiones se apoyan de manera provisional en el testimonio inglés público suministrado y evitan afirmaciones filológicas no verificadas.
