translation:
  language: es
  text: '(1) Pero Herodes buscaba a Juan y envió a sus agentes a Zacarías para preguntarle:


    —¿Dónde escondes a tu hijo?


    Él les respondió:


    —Soy servidor de Dios y tengo mi puesto en el Templo de Dios. ¿Cómo podría saber dónde está mi hijo?


    (2) Los agentes regresaron e informaron a Herodes de todo esto. Herodes se enfureció y dijo:


    —¡Su hijo va a ser rey de Israel!


    Entonces volvió a enviar a sus agentes para que le dijeran:


    —Dime la verdad: ¿dónde está tu hijo? Sabes que tu vida está en mis manos.


    Los agentes regresaron y le informaron de lo sucedido.


    (3) Zacarías dijo:


    —Seré mártir de Dios[a] si derramas mi sangre, porque el Señor recibirá mi espíritu, ya que estarás derramando sangre inocente a la entrada del Templo del Señor.


    Hacia el amanecer, Zacarías fue asesinado, y el pueblo de Israel no supo que lo habían asesinado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La palabra antigua detrás de «mártir» también puede significar «testigo»; aquí el contexto la relaciona con el derramamiento de la sangre de Zacarías.
    reason: Preservar una ambigüedad semántica relevante hasta que pueda realizarse la revisión directa de la tradición manuscrita griega.
lexical_decisions:
- source_word: officers (Greek source term pending direct review)
  choice: agentes
  rationale: Describe de manera neutral a los enviados de Herodes sin precisar, a falta de revisión directa del griego, si eran militares, guardias o funcionarios.
- source_word: minister of God
  choice: servidor de Dios
  rationale: Es una expresión actual y digna que conserva la idea general de servicio religioso sin imponer un cargo eclesiástico posterior.
- source_word: I sit in God’s Temple
  choice: tengo mi puesto en el Templo de Dios
  rationale: Evita la impresión accidental de que Zacarías simplemente está sentado y comunica que permanece allí por razón de su servicio, aunque la formulación deberá verificarse directamente con el griego.
- source_word: your life is in my hand
  choice: tu vida está en mis manos
  rationale: Conserva el sentido idiomático de potestad sobre la vida en español natural, aunque cambia el singular inglés por la expresión española habitual.
- source_word: around daybreak
  choice: hacia el amanecer
  rationale: Reproduce la aproximación temporal sin afirmar una hora exacta.
- source_word: murdered
  choice: asesinado
  rationale: Mantiene explícito que se trata de una muerte violenta e injusta, no de un fallecimiento accidental.
theological_decisions:
- issue: El término «mártir» también puede significar «testigo» en su trasfondo antiguo.
  choice: Seré mártir de Dios[a]
  alternative: Seré testigo de Dios
  rationale: El contexto inmediato vincula la declaración con el derramamiento de la sangre de Zacarías, por lo que «mártir» resulta natural; la nota preserva la amplitud semántica y evita ocultar la posible lectura «testigo».
- issue: La recepción del espíritu de Zacarías por el Señor.
  choice: el Señor recibirá mi espíritu
  alternative: el Señor acogerá mi espíritu
  rationale: Se conserva la afirmación del testimonio sin ampliarla hacia una formulación doctrinal más específica sobre el estado de los muertos.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la numeración, la repetición narrativa y la tensión del relato, con diálogo puntuado de manera natural en español. Este borrador es provisional porque el material suministrado se basa en un testimonio inglés de dominio público y la revisión directa del griego está pendiente.
