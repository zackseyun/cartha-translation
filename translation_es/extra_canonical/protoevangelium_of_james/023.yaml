    reason: Preservar una ambigüedad semántica relevante hasta que pueda realizarse la revisión directa de la tradición manuscrita griega.
  revision_rationale: Se corrigen el aspecto verbal inicial, la expansión interpretativa de «I sit in God’s Temple» y el futuro indebido en «Seré mártir». También se conserva «está a punto de ser rey» para expresar con mayor precisión «is about to be king», y se mantiene la repetición de «estas cosas» del relato. La revisión sigue siendo provisional, pues el material proporcionado deriva de un testimonio inglés y aún falta cotejo directo con la tradición griega.
