translation:
  language: es
  text: '(1) Entonces salió una orden del rey Augusto para registrar cuántas personas había en Belén de Judea.


    Y José dijo: «Registraré a mis hijos. Pero ¿qué haré con esta muchacha? ¿Cómo la registraré? ¿Como mi esposa? Me da vergüenza. ¿Como mi hija? Pero el pueblo de Israel sabe que no es hija mía. Este es el día del Señor; haré lo que el Señor quiera».


    (2) Ensilló el asno, hizo que ella se sentara sobre él, y uno de sus hijos lo llevaba, mientras Samuel los seguía.


    Cuando se acercaban a la tercera milla, José se volvió y vio que ella estaba triste. Y se decía: «Probablemente el que está dentro de ella la está inquietando».


    José se volvió de nuevo y vio que ella reía. Entonces le dijo: «María, ¿qué te sucede, que unas veces veo tu rostro sonriente y otras, triste?».


    Ella le respondió: «Es porque ante mis ojos veo dos pueblos:[a] uno llora y se lamenta, y el otro se alegra y se llena de júbilo».


    (3) Cuando llegaron a la mitad del camino, María le dijo: «José, bájame del asno, porque el que está dentro de mí presiona para salir».


    Él la bajó del asno y le dijo: «¿Adónde te llevaré para resguardarte en este trance?[b] Este lugar está desierto».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado dice literalmente «dos personas en mis ojos». La tradición griega conocida de este pasaje suele leerse «dos pueblos ante mis ojos». La imagen se conserva sin explicar quiénes son esos dos pueblos.
    reason: Documentar una diferencia importante entre el testimonio inglés provisional y la lectura griega tradicional, preservando la ambigüedad interpretativa.
  - marker: b
    text: 'También podría traducirse: «en esta situación delicada» o «en tu condición». La expresión alude al trance del parto.'
    reason: Aclarar una expresión difícil que el testimonio inglés vierte de manera poco natural como «awkwardness».
lexical_decisions:
- source_word: ἀπογράψασθαι / register (witness)
  choice: registrar
  rationale: Conserva la idea administrativa del censo sin imponer el término técnico «empadronar», y funciona naturalmente con personas y relaciones familiares.
- source_word: παιδίον / child (witness)
  choice: muchacha
  rationale: En el contexto, José se refiere a María y pregunta si declararla esposa o hija; «muchacha» evita que «niña» sugiera una edad demasiado precisa.
- source_word: λαοί / people(s), probable Greek tradition
  choice: pueblos
  rationale: La escena visionaria contrapone dos colectividades que lloran y se alegran; el plural «pueblos» expresa mejor esa oposición que dos individuos.
- source_word: ἐσκύλθρωπεν / was sad (witness)
  choice: estaba triste
  rationale: Expresión clara y digna que mantiene la observación externa de José sin añadir una causa.
- source_word: 'σκιρτᾷ / is troubling or stirring (tradition; witness: troubling)'
  choice: la está inquietando
  rationale: Mantiene cierta amplitud entre movimiento y perturbación, dado que la revisión directa del griego sigue pendiente.
- source_word: ἀσχημοσύνη / awkwardness (witness)
  choice: trance
  rationale: En el contexto del parto, «trance» comunica la situación delicada y urgente sin introducir lenguaje vergonzante ni una descripción médica ajena al testimonio.
- source_word: ἔρημος / wilderness (witness)
  choice: lugar desierto
  rationale: Describe un sitio despoblado o aislado; «desierto» conserva el eco tradicional sin exigir un paisaje árido.
theological_decisions:
- issue: La visión de María de dos grupos contrapuestos
  choice: «ante mis ojos veo dos pueblos»
  alternative: «veo dos personas en mis ojos»
  rationale: La tradición griega conocida de este pasaje suele presentar dos pueblos; se conserva la visión sin identificar alegóricamente a judíos y gentiles ni explicar su significado.
- issue: «Este es el día del Señor»
  choice: Se conserva literalmente
  alternative: Interpretarlo como día de decisión, juicio o providencia
  rationale: La frase admite varios matices religiosos y narrativos; no se resuelve su referencia de manera denominacional.
- issue: Identidad de «el que está dentro» de María
  choice: «el que está dentro de ella/de mí»
  alternative: Nombrarlo explícitamente como Jesús, el niño o el Mesías
  rationale: Se mantiene la formulación indirecta del relato y no se añade una identificación que el pasaje no expresa en estas líneas.
translation_notes:
  register: 'Español latinoamericano neutral, narrativo y digno, con sintaxis accesible. Se mantuvo la repetición característica del relato donde aporta ritmo, pero se aligeraron giros poco naturales. Borrador necesariamente provisional: el material suministrado indica que la revisión directa e integral del griego está pendiente; la decisión «dos pueblos» se apoya en la tradición griega conocida y queda transparentada en nota.'
