translation:
  language: es
  text: (1) Allí encontró una cueva, llevó a María adentro, dejó a sus hijos con ella y salió a buscar una partera hebrea en la región de Belén.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega.
    reason: La fuente proporcionada advierte que aún no se ha realizado la comprobación directa del griego.
lexical_decisions:
- source_word: cave
  choice: cueva
  rationale: Es el equivalente natural y directo del término transmitido por el testimonio inglés.
- source_word: her
  choice: María
  rationale: Se explicita el referente para que el pasaje aislado resulte claro en español, sin cambiar su identidad narrativa.
- source_word: stationed his sons with her
  choice: dejó a sus hijos con ella
  rationale: Expresa de manera natural que José los puso allí para acompañarla o atenderla, sin añadir una finalidad que el texto no declara.
- source_word: Hebrew midwife
  choice: partera hebrea
  rationale: Conserva la identificación étnica del testimonio y usa el término latinoamericano corriente «partera».
- source_word: region of Bethlehem
  choice: región de Belén
  rationale: Traducción directa que no restringe la búsqueda a la ciudad misma.
theological_decisions:
- issue: Identidad de «sus hijos»
  choice: sus hijos
  alternative: los hijos de José
  rationale: Se conserva la formulación del testimonio sin definir su relación con María ni resolver cuestiones posteriores sobre parentesco.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se favoreció una sintaxis narrativa clara; «partera» es más común en la región que «comadrona». La explicitación de «María» evita una referencia pronominal ambigua al citar el versículo de forma independiente.
