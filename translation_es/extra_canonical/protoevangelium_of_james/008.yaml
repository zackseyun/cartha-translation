base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: es
  text: '**Protoevangelio de Santiago — Capítulo 8: María cumple doce años**


    **1** Sus padres descendieron maravillados, alabando y glorificando al Señor Dios porque la niña no se había vuelto atrás. María permaneció en el templo del Señor. Era criada como una paloma y recibía alimento de la mano de un ángel.


    **2** Cuando cumplió doce años, los sacerdotes se reunieron en consejo y dijeron:


    —Miren, María ha estado doce años en el templo del Señor.[a] ¿Qué haremos con ella para que no contamine el santuario del Señor nuestro Dios?[b]


    Entonces dijeron al sumo sacerdote:


    —Tú estás ante el altar del Señor. Entra y ora por ella. Si el Señor Dios te revela algo, lo haremos.


    **3** El sumo sacerdote entró llevando la vestidura de las doce campanillas al Lugar Santísimo y oró por ella. Y, de pronto, un ángel del Señor se presentó a su lado y le dijo:


    —Zacarías, Zacarías, sal y reúne a los viudos del pueblo. Que cada uno lleve una vara. Aquel a quien el Señor Dios señale mediante una señal será quien la reciba por esposa.[c]


    Los heraldos recorrieron toda la región de Judea e hicieron sonar la trompeta del Señor. Y, de pronto, todos los hombres acudieron apresuradamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Doce años» reproduce la lectura del testimonio suministrado. La relación exacta entre esta cifra y la edad de María requiere cotejo directo con la tradición manuscrita griega.
    reason: Conserva una posible tensión cronológica sin corregir el texto de manera conjetural.
  - marker: b
    text: «Contamine» también puede entenderse en el sentido de hacer ritualmente impuro o profanar.
    reason: Aclara el campo semántico de pureza sin especificar una causa que el pasaje no menciona.
  - marker: c
    text: 'Lit.: «ella será su esposa». La redacción no describe aquí el procedimiento matrimonial con mayor detalle.'
    reason: Evita que la fluidez de la traducción oculte la concisión y posible tensión de la formulación antigua.
lexical_decisions:
- source_word: went down
  choice: descendieron
  rationale: Conserva el movimiento espacial del testimonio sin añadir un destino que el texto no especifica.
- source_word: hadn’t turned back
  choice: no se había vuelto atrás
  rationale: Mantiene la imagen y su posible sentido tanto físico como volitivo, sin resolver la ambigüedad.
- source_word: was nurtured like a dove
  choice: era criada como una paloma
  rationale: Reproduce el símil y el cuidado continuo sin convertirlo únicamente en una referencia a la alimentación.
- source_word: pollute
  choice: contamine
  rationale: Conserva el lenguaje fuerte de pureza del santuario; una nota aclara su posible dimensión ritual.
- source_word: robe with twelve bells
  choice: vestidura de las doce campanillas
  rationale: Evita identificar con excesiva precisión una prenda cuyo término griego aún requiere revisión directa.
- source_word: Holy of Holies
  choice: Lugar Santísimo
  rationale: Es una expresión bíblica clara y ampliamente comprensible para el recinto más sagrado.
- source_word: staff
  choice: vara
  rationale: Mantiene el objeto simbólico concreto y la resonancia bíblica del relato.
- source_word: heralds
  choice: heraldos
  rationale: Conserva la función pública de quienes transmiten la convocatoria, con registro narrativo digno.
theological_decisions:
- issue: La supuesta contaminación del santuario por María al llegar a los doce años
  choice: Se conserva la preocupación de los sacerdotes en discurso directo, con «contamine».
  alternative: Suavizarla como «para que no haya ningún problema en el santuario» o explicitar la menstruación.
  rationale: El relato expresa una inquietud de pureza, pero no declara de forma explícita su causa. La traducción no debe ni borrar esa tensión ni introducir una explicación ausente.
- issue: La selección divina del esposo mediante una señal
  choice: «Aquel a quien el Señor Dios señale mediante una señal será quien la reciba por esposa».
  alternative: «El elegido por Dios se casará con ella».
  rationale: La formulación conserva tanto la iniciativa divina atribuida por el relato como el mecanismo visible de la señal, sin añadir lenguaje doctrinal de elección.
- issue: Alimento recibido de un ángel
  choice: Se traduce como afirmación narrativa directa.
  alternative: Presentarlo como visión, tradición o metáfora.
  rationale: El texto lo narra directamente; la traducción no debe racionalizarlo ni imponer una interpretación figurada.
translation_notes:
  register: Español latinoamericano neutral, narrativo, actual y digno. Se preservan la repetición enfática «Zacarías, Zacarías», la súbita fórmula de aparición mediante «de pronto» y las tensiones cronológicas y rituales del testimonio. Este borrador se basa provisionalmente en el testimonio inglés de dominio público proporcionado; sigue pendiente la revisión directa del griego y, por ello, se evita precisar en exceso términos como la vestidura sacerdotal.
