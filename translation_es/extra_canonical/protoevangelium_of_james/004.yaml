translation:
  language: es
  text: '(1) ¡Mira! Un ángel del Señor se presentó cerca de Ana y le dijo:


    —Ana, Ana, el Señor ha escuchado tu oración. Concebirás y darás a luz, y se hablará de tu descendencia en el mundo entero.


    Ana dijo:


    —¡Vive el Señor Dios! Sea niño o niña lo que dé a luz, lo ofreceré como regalo al Señor mi Dios, y le servirá todos los días de su vida.


    (2) ¡Mira! Dos ángeles llegaron y le dijeron:


    —Mira, tu esposo Joaquín viene con sus rebaños.


    Pues un ángel del Señor había bajado hasta donde estaba Joaquín y le había dicho:


    —Joaquín, Joaquín, el Señor Dios ha escuchado tu oración. Baja de aquí. Mira, tu esposa Ana ha concebido en su vientre.


    (3) Joaquín bajó inmediatamente y llamó a los pastores. Les dijo:


    —Tráiganme diez corderos sin mancha ni defecto; esos diez corderos serán para el Señor Dios. Tráiganme también doce terneros tiernos para los sacerdotes y los ancianos, y cien machos cabríos para todo el pueblo.


    (4) ¡Mira! Joaquín llegó con sus rebaños, mientras Ana estaba de pie junto a la puerta. Cuando ella vio que Joaquín venía con sus rebaños, corrió inmediatamente, se abrazó a su cuello y dijo:


    —Ahora sé que el Señor Dios me ha bendecido grandemente. Pues ¡mira!, la viuda ya no es viuda, y ¡mira!, la que no llevaba un hijo en su vientre ha concebido.


    Y Joaquín descansó aquel primer día en su casa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: look / behold (Greek source review pending)
  choice: ¡Mira!
  rationale: Conserva la señal discursiva enfática y reiterada del testimonio suministrado, con una expresión natural y directa en español.
- source_word: offspring
  choice: descendencia
  rationale: Mantiene abierto si se alude al hijo inmediato o a su posteridad y evita precisar más de lo que permite el testimonio.
- source_word: minister
  choice: servirá
  rationale: Expresa servicio dedicado a Dios en lenguaje comprensible, sin imponer un cargo cultual específico.
- source_word: without spot or blemish
  choice: sin mancha ni defecto
  rationale: Conserva la fórmula sacrificial doble y su registro bíblico.
- source_word: male goats
  choice: machos cabríos
  rationale: Mantiene explícito el sexo de los animales y emplea una denominación clara de tono bíblico.
- source_word: gate
  choice: puerta
  rationale: Es la equivalencia neutral más segura sin revisión griega que determine si se trata de una puerta doméstica o de un portón.
theological_decisions:
- issue: Estado del embarazo de Ana en los anuncios angélicos
  choice: Conservar «concebirás» en el primer anuncio y «ha concebido» en el segundo
  alternative: Armonizar ambos anuncios como una concepción futura o ya realizada
  rationale: La secuencia del testimonio contiene esa tensión temporal; no se resuelve silenciosamente.
- issue: Promesa de servicio del hijo
  choice: «le servirá todos los días de su vida»
  alternative: «ejercerá un ministerio ante él» o una referencia sacerdotal explícita
  rationale: Evita atribuir al niño una función eclesiástica o sacerdotal no indicada expresamente.
- issue: Declaración de Ana sobre la viudez
  choice: Mantener literalmente «la viuda ya no es viuda»
  alternative: Parafrasear como «ya no estoy como viuda»
  rationale: Preserva la formulación paradójica y la tensión narrativa, sin explicar si Ana hablaba de abandono, reputación o viudez literal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la repetición enfática de «¡Mira!» y el ritmo narrativo de tono bíblico. El borrador se apoya en el testimonio inglés de dominio público proporcionado; la revisión directa de la tradición manuscrita griega sigue pendiente, por lo que no se añaden notas textuales ni se afirman detalles léxicos griegos no verificados.
