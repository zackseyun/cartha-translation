  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: es
  text: '(1) Día tras día, la niña se fortalecía. Cuando tenía seis meses, su madre la puso de pie en el suelo para ver si podía mantenerse en pie. La niña dio siete pasos y llegó al pecho de su madre. Entonces su madre la alzó y dijo: «¡Vive el Señor mi Dios, que no volverás a caminar sobre este suelo hasta que te lleve al Templo del Señor!».


    Luego hizo un santuario en su habitación y no permitió que nada profano ni impuro pasara por allí. También llamó a las hijas puras de los hebreos, y ellas jugaban con la niña.


    (2) Cuando la niña cumplió un año, Joaquín celebró un gran banquete e invitó a los jefes de los sacerdotes, a los sacerdotes, a los escribas, a los ancianos y a todo el pueblo de Israel. Joaquín llevó a la niña ante los sacerdotes, y ellos la bendijeron diciendo: «Dios de nuestros antepasados, bendice a esta niña y dale un nombre que sea proclamado por siempre, de generación en generación».


    Y todo el pueblo respondió: «¡Así sea! ¡Amén!».


    Después la llevaron ante los jefes de los sacerdotes, y ellos la bendijeron diciendo: «Dios Altísimo, mira a esta niña y bendícela con una bendición definitiva, que ninguna otra pueda superar».


    (3) Su madre la llevó al santuario de su habitación y amamantó a la niña. Entonces Ana entonó un canto al Señor Dios:


    «Cantaré un canto santo al Señor mi Dios,

    porque Dios me ha visitado

    y ha quitado el reproche de mis enemigos.


    »El Señor Dios me ha dado el fruto de su justicia,

    único y, a la vez, múltiple ante él.[a]


    »¿Quién anunciará al pueblo de Rubén[b]

    que Ana amamanta a una hija?

    ¡Escuchen, escuchen, doce tribus de Israel:

    Ana amamanta a una hija!».


    Ana dejó a la niña descansando en el santuario de su habitación y fue a atender a los invitados.[c] Cuando terminó el banquete, ellos se retiraron llenos de alegría y glorificando al Dios de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «único y, a la vez, múltiple ante él» es oscura en el testimonio utilizado. También podría entenderse como «singular, pero abundante delante de Dios». Es necesario cotejar el texto griego.
    reason: Preserva una ambigüedad textual y teológica genuina, y advierte que la revisión de la fuente griega sigue pendiente.
  - marker: b
    text: El testimonio inglés dice «Reubel». Aquí se emplea «Rubén» como la forma bíblica española probablemente correspondiente; la lectura debe confirmarse mediante el cotejo con la tradición manuscrita griega.
    reason: Informa de una posible variante, error o forma onomástica sin ocultarla al lector.
  - marker: c
    text: El testimonio puede entenderse literalmente como que Ana descansó en el santuario y después salió a servirles. La traducción adopta la secuencia contextual en la que deja allí a la niña y atiende a los invitados, pero el sentido exacto requiere revisión del griego.
    reason: La referencia del sujeto y la secuencia narrativa son inciertas en el testimonio de base.
lexical_decisions:
- source_word: child
  choice: la niña
  rationale: El contexto identifica a la criatura como María; «la niña» es natural en español y mantiene claro el referente femenino.
- source_word: sanctuary
  choice: santuario
  rationale: Conserva la imagen cultual deliberada aplicada al espacio preparado en la habitación, sin reducirla a «lugar especial».
- source_word: sacrilegious or impure
  choice: profano ni impuro
  rationale: Distingue el carácter no consagrado de la impureza ritual o moral, con lenguaje comprensible y digno.
- source_word: chief priests
  choice: jefes de los sacerdotes
  rationale: Evita identificar necesariamente al grupo con un único «sumo sacerdote» y refleja el plural del testimonio.
- source_word: visited me
  choice: me ha visitado
  rationale: Mantiene el giro bíblico de intervención favorable de Dios, sin explicitar más de lo que afirma el texto.
- source_word: criticism
  choice: reproche
  rationale: «Reproche» encaja mejor con el registro bíblico de vergüenza o censura pública que «crítica».
- source_word: ministered to them
  choice: atender a los invitados
  rationale: En el contexto del banquete expresa de manera natural el servicio de Ana sin atribuirle un ministerio religioso técnico.
- source_word: went down
  choice: se retiraron
  rationale: Comunica el movimiento de salida con naturalidad; la dirección literal «bajaron» depende de una topografía no explicada en el pasaje.
theological_decisions:
- issue: Carácter sagrado del espacio doméstico
  choice: «hizo un santuario en su habitación»
  alternative: «preparó un lugar sagrado»
  rationale: Se conserva la fuerte analogía con el Templo que estructura el relato, sin afirmar que el cuarto se convirtiera formalmente en un santuario institucional.
- issue: Fórmula de juramento
  choice: «¡Vive el Señor mi Dios, que…!»
  alternative: «Tan cierto como que vive el Señor mi Dios…»
  rationale: La formulación elegida mantiene el sabor bíblico y la fuerza solemne del juramento, a la vez que resulta inteligible.
- issue: Bendición final
  choice: «bendición definitiva, que ninguna otra pueda superar»
  alternative: «bendición perfecta»
  rationale: No se transforma «final» en una categoría doctrinal específica; se conserva la idea de una bendición culminante o insuperable.
- issue: «Fruto de la justicia de Dios»
  choice: «el fruto de su justicia»
  alternative: «el fruto de la justicia de Dios»
  rationale: El posesivo evita repetición en español, pero no define si el fruto procede de la justicia divina, la manifiesta o es concedido justamente.
- issue: Expresión paradójica «singular yet manifold»
  choice: «único y, a la vez, múltiple ante él»
  alternative: «uno, pero de muchas formas delante de Dios»
  rationale: Se preserva la tensión y oscuridad del testimonio en vez de resolverla mediante una interpretación mariológica, genealógica o simbólica.
- issue: Identificación de «Reubel»
  choice: «Rubén» con nota
  alternative: retener «Reubel» sin normalizar
  rationale: Rubén es la forma bíblica española más probable, pero la nota declara la lectura del testimonio y la incertidumbre pendiente de cotejo griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con ecos bíblicos moderados. Se prefieren oraciones claras y formas como «antepasados», «amamantó» y «banquete». El canto se dispone en líneas poéticas. Este borrador es provisional porque el material suministrado declara pendiente la revisión directa de la tradición manuscrita griega; por ello, las zonas especialmente inciertas se conservan o se señalan en notas, sin imponer soluciones doctrinales.
