  revision_rationale: La revisión conserva el sentido del testimonio inglés de base y evita cambios interpretativos en puntos inciertos. Restituye el sujeto de «Ana descansó», el movimiento de «bajaron», la forma «Reubel» y la reiteración de «Dios» en el verso oscuro. También elimina la nota que justificaba un cambio narrativo no respaldado por el testimonio.
