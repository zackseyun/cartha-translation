translation:
  language: es
  text: '**Protoevangelio de Santiago — Capítulo 20: El examen de Salomé**


    (1) La partera entró y dijo:


    —María, ponte en posición, porque te espera una prueba nada pequeña.


    Entonces Salomé la examinó. Y Salomé lanzó un grito y dijo:


    —¡Ay de mí por mi maldad y mi incredulidad! He puesto a prueba al Dios vivo y, ¡miren!, mi mano está ardiendo y se desprende de mí.


    (2) Y cayó de rodillas ante el Señor, diciendo:


    —Dios de mis antepasados, acuérdate de mí, pues soy descendiente de Abraham, Isaac y Jacob. No hagas de mí un escarmiento para el pueblo de Israel, sino devuélveme a los pobres,[a] porque tú sabes, Señor, que en tu nombre he sanado a la gente y que de ti he recibido mi recompensa.


    (3) Y, ¡miren!, se le apareció un ángel del Señor y le dijo:


    —Salomé, Salomé, el Señor de todo ha escuchado tu oración. Acerca tu mano al niño y levántalo en brazos; así recibirás salvación y alegría.[b]


    (4) Y, ¡miren!, Salomé se acercó con alegría al niño y lo levantó en brazos, diciendo:


    —Lo adoro, porque ha nacido para Israel un gran rey.


    Al instante Salomé quedó sana y salió justificada de la cueva.[c]


    Y, ¡miren!, una voz decía:


    —Salomé, Salomé, no cuentes las maravillas que has visto hasta que el niño entre en Jerusalén.


    [a] La expresión «devuélveme a los pobres» es difícil y se conserva sin precisar su sentido; podría referirse a que Salomé desea volver a servir a los necesitados.


    [b] «Salvación» también puede abarcar aquí la idea de sanidad o liberación.


    [c] «Justificada» conserva el lenguaje judicial o declarativo del texto y no se sustituye por una interpretación teológica más específica.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «devuélveme a los pobres» es difícil y se conserva sin precisar su sentido; podría referirse a que Salomé desea volver a servir a los necesitados.
    reason: El testimonio inglés reconoce una formulación difícil, y la revisión directa del griego está pendiente.
  - marker: b
    text: «Salvación» también puede abarcar aquí la idea de sanidad o liberación.
    reason: Evita reducir el término a una categoría exclusivamente espiritual cuando el contexto narra una curación corporal.
  - marker: c
    text: «Justificada» conserva el lenguaje judicial o declarativo del texto y no se sustituye por una interpretación teológica más específica.
    reason: Preserva una ambigüedad teológica genuina en vez de decidir entre perdón, reivindicación o aceptación.
lexical_decisions:
- source_word: position yourself
  choice: ponte en posición
  rationale: Conserva la instrucción concreta de la partera sin añadir detalles anatómicos que el testimonio suministrado no expresa.
- source_word: tested the living God
  choice: he puesto a prueba al Dios vivo
  rationale: Mantiene tanto el acto de comprobación incrédula como la gravedad religiosa de haber desafiado a Dios.
- source_word: Lord of All
  choice: el Señor de todo
  rationale: Reproduce el alcance universal del título sin introducir un título confesional más especializado.
- source_word: lift him up
  choice: levántalo en brazos
  rationale: En el contexto de acercarse al recién nacido, expresa en español natural la acción de tomarlo y alzarlo.
- source_word: salvation
  choice: salvación
  rationale: Retiene el término amplio, que en el relato puede incluir sanidad y liberación, sin reducirlo a una sola dimensión.
- source_word: justified
  choice: justificada
  rationale: Preserva deliberadamente el matiz judicial o declarativo y su posible tensión teológica.
theological_decisions:
- issue: La adoración tributada al niño
  choice: «Lo adoro»
  alternative: «Me inclino ante él» o «le rindo homenaje»
  rationale: El testimonio dice «I worship him»; se mantiene la afirmación fuerte sin explicar de manera denominacional la identidad del niño.
- issue: La salvación prometida a Salomé
  choice: «recibirás salvación y alegría»
  alternative: «recibirás sanidad y alegría»
  rationale: Se conserva la amplitud teológica de «salvación», mientras una nota reconoce que el contexto inmediato incluye curación física.
- issue: El estado de Salomé al salir de la cueva
  choice: «salió justificada»
  alternative: «salió perdonada», «reivindicada» o «en paz»
  rationale: No se resuelve la expresión como perdón, vindicación o mera recuperación; se mantiene su tensión declarativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la repetición narrativa «Y, ¡miren!» como rasgo enfático del relato, aunque se ajusta la sintaxis para que resulte natural. El borrador es necesariamente provisional porque se basa en el testimonio inglés de dominio público suministrado; sigue pendiente la revisión directa de la tradición manuscrita griega.
