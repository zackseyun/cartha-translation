  revision_rationale: 'Se corrigen tres expansiones interpretativas para reflejar más estrechamente el testimonio disponible: la niña no debe «buscar» a sus padres, las jóvenes llevan lámparas encendidas y la niña danza sin que se le atribuya explícitamente alegría. También se ajusta la designación de las jóvenes para conservar su identidad hebrea y su cualidad de pureza en español natural. La revisión sigue siendo provisional, pues el expediente indica que falta cotejo directo con la tradición griega.'
