translation:
  language: es
  text: '(1) Ana cuidó de su niña durante aquellos meses. Cuando la niña cumplió dos años, Joaquín dijo:


    —Llevémosla al Templo del Señor para cumplir la promesa que hicimos, no sea que el Señor se enoje con nosotros y rechace nuestra ofrenda.


    Pero Ana dijo:


    —Esperemos hasta que cumpla tres años, para que no eche de menos a su padre ni a su madre.


    Y Joaquín respondió:


    —Esperemos.


    (2) Cuando la niña cumplió tres años, Joaquín dijo:


    —Llamemos a las jóvenes puras del pueblo hebreo. Que tomen lámparas y las mantengan encendidas, para que la niña no se vuelva atrás ni su corazón se aparte del Templo del Señor.


    Así lo hicieron hasta que subieron al Templo del Señor.


    El sacerdote la recibió, la besó y dijo:


    —El Señor Dios ha engrandecido tu nombre entre todas las generaciones. Por medio de ti, el Señor revelará en los últimos días su redención del pueblo de Israel.


    (3) Luego la sentó en el tercer escalón del altar, y el Señor Dios derramó su gracia sobre ella. La niña danzó de alegría, y toda la casa de Israel la amó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cared for her child
  choice: cuidó de su niña
  rationale: Expresa de manera natural el cuidado materno y conserva la referencia femenina exigida por el contexto.
- source_word: Temple of the Lord
  choice: Templo del Señor
  rationale: Mantiene la designación religiosa tradicional con un español claro y digno.
- source_word: promise
  choice: promesa
  rationale: Evita precisar «voto» sin revisión directa del término griego, aunque el contexto sea cultual.
- source_word: gift
  choice: ofrenda
  rationale: En este contexto de dedicación al Templo, «ofrenda» comunica mejor el carácter religioso que el genérico «regalo».
- source_word: pure daughters of the Hebrews
  choice: jóvenes puras del pueblo hebreo
  rationale: «Jóvenes» es idiomático para las muchachas convocadas; «puras» conserva sin interpretar la cualidad cultual o moral, y «del pueblo hebreo» evita una construcción rígida.
- source_word: lamps
  choice: lámparas
  rationale: Conserva el objeto genérico del testimonio sin especificar antorchas ni un tipo de lámpara no confirmado.
- source_word: her heart won’t be drawn away
  choice: su corazón se aparte
  rationale: Reproduce la orientación interior de la expresión y resulta natural en español.
- source_word: redemption
  choice: redención
  rationale: Conserva el peso teológico y la amplitud del término, sin reducirlo a liberación política o salvación espiritual.
- source_word: house of Israel
  choice: casa de Israel
  rationale: Mantiene la expresión colectiva tradicional y su resonancia bíblica.
- source_word: danced on her feet
  choice: danzó de alegría
  rationale: «Danzó» conserva la acción; «de alegría» hace natural la frase sin introducir una interpretación doctrinal.
theological_decisions:
- issue: Naturaleza de la promesa hecha por los padres
  choice: promesa
  alternative: voto
  rationale: Se conserva una formulación amplia hasta que se revise directamente la tradición griega.
- issue: Aceptación o rechazo de María como ofrenda
  choice: rechace nuestra ofrenda
  alternative: considere inaceptable nuestra ofrenda
  rationale: Expresa claramente el temor de los padres sin desarrollar una teoría sacrificial.
- issue: Papel de María en la redención
  choice: Por medio de ti, el Señor revelará... su redención
  alternative: En ti, el Señor manifestará... la redención
  rationale: Mantiene que Dios es el agente y que María desempeña un papel mediador en la revelación, sin definir cómo ocurre.
- issue: Gracia derramada sobre María
  choice: derramó su gracia sobre ella
  alternative: hizo reposar gracia sobre ella
  rationale: Sigue la imagen transmitida por el testimonio y evita precisar la naturaleza o los efectos de esa gracia.
- issue: «Los últimos días»
  choice: en los últimos días
  alternative: al final de los días
  rationale: Conserva la expresión escatológica sin identificar un calendario ni imponer una interpretación.
