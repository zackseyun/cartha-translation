  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya y formas exhortativas naturales. La redacción es provisional porque el expediente indica que aún está pendiente la revisión directa del griego; por ello se evitan precisiones léxicas o doctrinales que el testimonio inglés no permite asegurar.
