review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva correctamente la parábola copta: buena semilla, la cizaña singular en las cláusulas centrales, el trigo que podría arrancarse con ella, y las cizañas plurales al final. Sin embargo, «tenía» debilita innecesariamente el presente posesivo de ⲉⲩⲛ̄ⲧⲁϥ, y «en la buena semilla» expresa peor que «sobre» la relación ⲉϫⲛ. Se restituyen además en notas los datos textuales significativos conservados por la auditoría inglesa.'
  spanish_quality_summary: La redacción es clara, digna y natural. Se ajustan el presente «tiene» y la preposición «sobre» para una correspondencia más precisa, sin sacrificar fluidez. Las notas se anclan en orden y distinguen el cambio significativo de número de «cizaña».
  glossary_alignment: Jesús y reino del Padre se mantienen de forma adecuada. ⲍⲓⲍⲁⲛⲓⲟⲛ se traduce «cizaña», término español tradicional y preciso para el préstamo griego, preservando el singular inicial/central y el plural final. ⲕⲱ ⲙⲙⲟⲟⲩ se refleja en «no les permitió», ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ en «aparecerán», y los verbos finales activos de sujeto indefinido se mantienen mediante futuros plurales.
  issues:
  - severity: low
    issue: Tiempo verbal y relación espacial
    rationale: El copto presenta al hombre como alguien que «tiene» buena semilla, y ⲉϫⲛ significa «sobre» la buena semilla. «Tenía» y «en» no crean una grave alteración, pero son menos fieles que «tiene» y «sobre».
  - severity: low
    issue: Omisión de notas textuales heredadas
    rationale: La auditoría inglesa conserva como significativos el paso de cizaña singular a plural, la forma licopolitana del futuro en la cita, y la construcción activa impersonal final. Deben preservarse mediante notas españolas ancladas.
  revised_spanish_text: 'Jesús dijo: «El reino del Padre es semejante a un hombre que tiene buena semilla. Su enemigo vino de noche y sembró una cizaña[a] sobre la buena semilla. El hombre no les permitió arrancar la cizaña. Les dijo: “No sea que digan: ‘Arrancaremos[b] la cizaña’, y arranquen con ella el trigo. Porque en el día de la cosecha, las cizañas aparecerán; las arrancarán y las quemarán[c]”».'
  revised_footnotes: *id001
  revision_rationale: Se reemplazan «tenía» por «tiene» y «en» por «sobre» para reflejar con mayor precisión el copto. Se añaden las tres notas significativas preservadas en la auditoría inglesa, con marcadores únicos y anclados en el texto.
