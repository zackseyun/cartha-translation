base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: es
  text: 'Jesús dijo: «El reino del Padre es semejante a un hombre que tiene buena semilla. Su enemigo vino de noche y sembró una cizaña[a] sobre la buena semilla. El hombre no les permitió arrancar la cizaña. Les dijo: “No sea que digan: ‘Arrancaremos[b] la cizaña’, y arranquen con ella el trigo. Porque en el día de la cosecha, las cizañas aparecerán; las arrancarán y las quemarán[c]”».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: El copto usa aquí el singular indefinido «una cizaña» (ⲟⲩⲍⲓⲍⲁⲛⲓⲟⲛ), después el singular definido «la cizaña» (ⲡⲍⲓⲍⲁⲛⲓⲟⲛ), y al final cambia al plural «las cizañas» (ⲛⲍⲓⲍⲁⲛⲓⲟⲛ). El préstamo griego ζιζάνιον suele aparecer en plural en los paralelos sinópticos.
    reason: textual_variant
  - marker: b
    text: El prefijo copto ⲉⲛⲁ- («nosotros ...remos») es una variante licopolitana del futuro de primera persona plural, cuyo equivalente sahídico regular es ⲧⲛⲛⲁ-.
    reason: dialect_note
  - marker: c
    text: Literalmente, «las arrancan y las queman». Los verbos activos tienen un sujeto indefinido y funcionan con sentido pasivo.
    reason: register_note
