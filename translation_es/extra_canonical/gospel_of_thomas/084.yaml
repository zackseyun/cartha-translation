base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: es
  text: 'Jesús dijo: «El día en que ven su semejanza, se alegran. Pero cuando vean sus imágenes[a], que llegaron a ser antes de ustedes, las cuales ni mueren ni se manifiestan, ¿cuánto soportarán?»'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: El copto usa el préstamo griego εἰκών (eikōn). El texto contrapone la «semejanza» mortal (ⲉⲓⲛⲉ) a las «imágenes» (ϩⲓⲕⲱⲛ), sus contrapartes preexistentes e inmortales.
    reason: Preserva la distinción léxica y la explicación teológica documentada en la auditoría inglesa.
