    issue: Se omitió la nota sobre «imágenes».
    rationale: La auditoría inglesa conserva una nota teológica/léxica que identifica ϩⲓⲕⲱⲛ como préstamo de εἰκών y explica su contraste deliberado con ⲉⲓⲛⲉ («semejanza»). Esa distinción es significativa para la interpretación y debe preservarse en español.
