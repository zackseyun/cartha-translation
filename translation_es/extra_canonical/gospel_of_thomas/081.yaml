base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: es
  text: 'Jesús dijo: «Quien se haya hecho rico, que sea rey[a]; y quien tenga poder[b], que renuncie a él[c]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ⲣⲣⲣⲟ también puede traducirse «reine» o «gobierne»; «sea rey» refleja el matiz verbal vinculado con ⲣⲟ («rey») y conserva la expresión tajante de Tomás.
    reason: lexical_alternative
  - marker: b
    text: ⲇⲩⲛⲁⲙⲓⲥ, préstamo del griego, también puede significar «fuerza» o «capacidad» y, en algunos contextos, «poder milagroso». Se conserva «poder» por su amplitud y paralelismo.
    reason: lexical_alternative
  - marker: c
    text: El objeto de ⲁⲣⲛⲁ está implícito en copto; «él» (es decir, el poder) se añade para aclarar el sentido sin alterar la estructura.
    reason: dialect_note
