review_pass:
  verdict: revise
  source_alignment_summary: 'El texto español reproduce fielmente la estructura del copto sahídico: el perfecto relativo («se haya hecho rico»), los dos exhortativos («que sea», «que renuncie») y el objeto implícito de «renunciar», referido al poder. Sin embargo, omite las alternativas léxicas y la aclaración sintáctica conservadas en la auditoría inglesa.'
  spanish_quality_summary: 'La redacción es natural, sobria y apropiada para español latinoamericano: «Quien se haya hecho rico, que sea rey; y quien tenga poder, que renuncie a él». La reparación propuesta no modifica el sentido, sino que incorpora las notas necesarias con anclajes claros y ordenados.'
  glossary_alignment: «Jesús», «rico», «rey» y «poder» son adecuados. «Sea rey» preserva deliberadamente la dicción tajante de ⲣⲣⲣⲟ, en lugar de sustituirla por «reine» o «gobierne».
  issues:
  - severity: low
    issue: Faltan las notas léxicas y sintácticas preservadas por el POB inglés.
    rationale: La nota sobre ⲣⲣⲣⲟ conserva «reinar/gobernar» como alternativas; la de ⲇⲩⲛⲁⲙⲓⲥ conserva los matices «fuerza/capacidad»; y la de ⲁⲣⲛⲁ explica que «él» es un objeto suministrado por claridad. Deben mantenerse en español con marcadores únicos y anclados.
  revised_spanish_text: 'Jesús dijo: «Quien se haya hecho rico, que sea rey[a]; y quien tenga poder[b], que renuncie a él[c]».'
  revised_footnotes: *id001
