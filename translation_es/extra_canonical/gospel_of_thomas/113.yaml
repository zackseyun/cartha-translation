review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva la estructura y el sentido central del copto: la pregunta por el día de la venida, la negación de que llegue por observación, el par deíctico «aquí/allí», y el reinado del Padre ya difundido sobre la tierra pero no percibido. Sin embargo, omite las notas de alternativa léxica y variante textual conservadas en la auditoría inglesa, y presenta puntuación de diálogo defectuosa.'
  spanish_quality_summary: «Reinado» comunica adecuadamente el sustantivo abstracto de gobierno; «está extendido» expresa con naturalidad la realidad ya difundida. Se corrigen el punto sobrante tras la pregunta, las comillas tipográficas impropias y la puntuación de las citas. La fórmula editorial «[Él dijo]» se mantiene entre corchetes porque no aparece un verbo introductorio explícito en el manuscrito.
  glossary_alignment: ⲡⲙⲛⲧⲣⲣⲟ se traduce «reinado», no «reino», para conservar el matiz abstracto de reinado/gobierno; ⲛⲁϣ ⲛϩⲟⲟⲩ se mantiene como «¿En qué día?»; ϭⲱϣⲧ como «observación»; ⲉⲓⲥϩⲏⲏⲧⲉ como «¡Miren!»; ⲧⲏ se vierte «allí» conforme a la lectura manuscrita y al paralelismo deíctico; ⲥⲡⲱⲣϣ como «está extendido»; y ⲡⲕⲁϩ como «la tierra», con «la tierra/el país» preservado en nota.
  issues:
  - severity: medium
    issue: Faltan las notas que documentan la alternativa «reino», la variante «allí/cielo» y el posible sentido «país» de «tierra».
    rationale: La auditoría inglesa retiene estas alternativas como información significativa de léxico y crítica textual. Deben preservarse en español con marcadores únicos y anclados.
  - severity: low
    issue: La puntuación y las comillas del texto publicado son inconsistentes.
    rationale: Hay un punto indebido después de la pregunta inicial y se usan comillas escapadas no tipográficas dentro de guillemets. La revisión aplica puntuación española legible.
  revised_spanish_text: 'Sus discípulos le dijeron: «¿En qué día vendrá el reinado[a]?»


    [Él dijo]: «No vendrá mediante observación. No dirán: “¡Miren, aquí!” o “¡Miren, allí[b]!” Más bien, el reinado del Padre está extendido sobre la tierra[c], y la gente no lo ve».

    '
  revised_footnotes: *id001
  revision_rationale: Se conserva la traducción sustantiva del borrador, con reparación tipográfica y de puntuación, y se añaden las notas necesarias para preservar las decisiones léxicas y la variante manuscrita documentadas en la auditoría inglesa.
