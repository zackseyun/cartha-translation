base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: es
  text: 'Sus discípulos le dijeron: «¿En qué día vendrá el reinado[a]?»


    [Él dijo]: «No vendrá mediante observación. No dirán: “¡Miren, aquí!” o “¡Miren, allí[b]!” Más bien, el reinado del Padre está extendido sobre la tierra[c], y la gente no lo ve».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: «Reinado» también puede traducirse «reino». El copto ⲡⲙⲛⲧⲣⲣⲟ, formado a partir de «rey», tiene aquí el matiz abstracto de reinado o gobierno, más que el de un territorio.
    reason: lexical_alternative
  - marker: b
    text: El manuscrito en esta línea lee «allí» (ⲧⲏ), mientras que el texto normalizado imprime ⲡⲏ, «cielo» o «firmamento». El par «aquí/allí» concuerda con la sintaxis inmediata.
    reason: textual_variant
  - marker: c
    text: «Tierra» (ⲡⲕⲁϩ) también puede significar «país» o «tierra» en sentido territorial. La imagen es la de algo ya difundido sobre el suelo.
    reason: cultural_note
