base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: es
  text: 'Jesús dijo: «Dos descansarán en un lecho; uno morirá y uno vivirá».


    Salomé dijo: «¿Quién eres tú, hombre, que, como procedente de uno[a], has subido a mi lecho y has comido de mi mesa?»


    Jesús le dijo: «Yo soy el que existe, procedente del Igual[b]. Se me dieron las cosas de mi Padre».


    [Salomé dijo:][c] «Soy tu discípula».


    [Jesús dijo:] «Por esto digo: cuando alguien llega a estar vacío[d], quedará lleno de luz; pero cuando llega a estar dividido, quedará lleno de oscuridad».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Literalmente, «como de uno» (ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ). Puede significar «como si procedieras de alguien [especial]» o «como procedente del Uno», en consonancia con el lenguaje tomasino de unidad.
    reason: lexical_alternative
  - marker: b
    text: El copto ⲡⲉⲧϣⲏϣ significa «lo que es igual» o «el Igual», de ϣⲓϣ («ser igual, nivelado»).
    reason: theological_note
  - marker: c
    text: El texto copto no incluye las atribuciones de hablante de las dos oraciones finales («Salomé dijo» y «Jesús dijo»); se añaden entre corchetes para mayor claridad.
    reason: textual_variant
  - marker: d
    text: El manuscrito lee ϣⲏϥ, forma de ϣⲱϥ («estar vacío, desolado»), lo que crea un juego de palabras con «lleno». Muchos estudiosos lo enmiendan a ϣⲏϣ («igual») para relacionarlo con «el Igual» y contrastarlo con «dividido», pero aquí se conserva la lectura manuscrita.
    reason: textual_variant
