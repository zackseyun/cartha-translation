review_pass:
  verdict: revise
  source_alignment_summary: 'El único fragmento conservado del borrador traduce correctamente la primera cláusula: ⲛⲁⲙⲧⲟⲛ expresa futuro («descansarán») y ϭⲗⲟϭ puede verterse «lecho». Sin embargo, el texto de publicación queda truncado después de «vivirá» y omite el resto del dicho: la pregunta de Salomé, la respuesta de Jesús, las dos intervenciones finales suplidas y el contraste entre vacío/luz y dividido/oscuridad. La revisión conserva las decisiones auditadas: «vacío» para ϣⲏϥ, «dividido» para ⲡⲏϣ y la fuerza plural de «las cosas de mi Padre».'
  spanish_quality_summary: La primera oración es legible y digna, pero las comillas quedan sin cerrar y el registro no constituye un dicho completo. La versión revisada emplea español latinoamericano natural, conserva la forma principal «Jesús» y hace explícitas mediante corchetes las atribuciones de hablante que no están en el copto.
  glossary_alignment: «Jesús» sigue la terminología del proyecto. «Lecho» es una alternativa española adecuada para ϭⲗⲟϭ en el contexto de reposar y comer. «El Igual» reproduce de forma deliberadamente sustantiva ⲡⲉⲧϣⲏϣ; se conserva con nota. «Vacío» retiene la lectura manuscrita y su juego con «lleno», mientras que «dividido» traduce el cualitativo de «dividir», no el numeral dos.
  issues:
  - severity: high
    issue: El texto de publicación está truncado.
    rationale: Tras «uno vivirá» faltan todas las cláusulas restantes presentes en el copto y en la traducción inglesa auditada; además, queda una comilla abierta.
  - severity: medium
    issue: Faltan las notas necesarias para ambigüedades y decisiones textuales significativas.
    rationale: La traducción debe conservar en español la ambigüedad de «como procedente de uno», explicar «el Igual», identificar las atribuciones de hablante suplidas y documentar que «vacío» mantiene la lectura manuscrita frente a una enmienda frecuente.
