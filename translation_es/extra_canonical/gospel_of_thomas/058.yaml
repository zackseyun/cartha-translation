review_pass:
  verdict: revise
  source_alignment_summary: El original manuscrito tiene una relativa perfecta de tercera persona («quien ha trabajado/se ha afanado») seguida de «ha hallado vida», sin un pronombre independiente enfático; por tanto, la redacción española conserva correctamente la secuencia sencilla y no debe introducir «ese tal» ni «él mismo». «Ha trabajado» y «ha hallado vida» reflejan bien ϩⲓⲥⲉ y el perfecto de ϩⲉ. La revisión sustituye «Dichosa» por «Bienaventurada» para conservar el tono de bienaventuranza de ⲙⲁⲕⲁⲣⲓⲟⲥ que documenta la decisión inglesa, sin negar sus otros matices en nota.
  spanish_quality_summary: El borrador es claro y natural. «Bienaventurada la persona» es idiomático, digno y de lectura eclesial amplia; concuerda gramaticalmente con «persona». Se añaden notas breves para conservar las alternativas léxicas y la variante ortográfica que el expediente inglés considera significativas.
  glossary_alignment: Jesús se conserva conforme al estándar. «Bienaventurada» reproduce el valor de μακάριος/ⲙⲁⲕⲁⲣⲓⲟⲥ mejor que «Dichosa» en este dicho sentencioso; «persona» mantiene el referente humano genérico de ⲡⲣⲱⲙⲉ; «trabajado» conserva el sentido principal de labor/esfuerzo de ϩⲓⲥⲉ, con «sufrido» consignado como alternativa.
  issues:
  - severity: medium
    issue: «Dichosa» debilita el registro de bienaventuranza elegido y justificado para ⲙⲁⲕⲁⲣⲓⲟⲥ.
    rationale: Aunque «dichosa» cabe dentro del campo semántico, el expediente inglés escoge «blessed» específicamente para conservar el tono solemne de beatitud. «Bienaventurada» lo comunica de forma más fiel en español.
  - severity: low
    issue: El borrador no conserva las notas léxicas y textuales significativas del expediente.
    rationale: Las alternativas de ⲙⲁⲕⲁⲣⲓⲟⲥ y ϩⲓⲥⲉ, el valor genérico de ⲡⲣⲱⲙⲉ y la variante gráfica ante «vida» deben quedar disponibles al lector. No se conserva la nota inglesa sobre un supuesto pronombre enfático, pues la revisión adjudicada demuestra que es errónea.
  revised_spanish_text: 'Jesús dijo: «Bienaventurada[a] la persona[b] que ha trabajado[c]; ha hallado vida[d]».'
  revised_footnotes: *id001
  revision_rationale: 'Se ajusta el término inicial al registro de beatitud sustentado por la evidencia léxica y se restauran las notas significativas. La publicación no debe reproducir la antigua explicación de un pronombre independiente enfático: el manuscrito presenta las formas ordinarias de tercera persona ⲛ̄ⲧⲁ-ϥ-ϩⲓⲥⲉ y ⲁϥ-ϩⲉ, como establece la adjudicación previa.'
