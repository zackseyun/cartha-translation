  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: es
  text: 'Jesús dijo: «Bienaventurada[a] la persona[b] que ha trabajado[c]; ha hallado vida[d]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ⲙⲁⲕⲁⲣⲓⲟⲥ también puede matizarse como «dichosa» o «afortunada».
    reason: lexical_alternative
  - marker: b
    text: ⲡⲣⲱⲙⲉ designa genéricamente a un ser humano; «persona» evita una referencia exclusivamente masculina.
    reason: lexical_alternative
  - marker: c
    text: ϩⲓⲥⲉ puede significar «trabajar», «afanarse», «sufrir» o «estar angustiado»; también se puede traducir «que ha sufrido».
    reason: lexical_alternative
  - marker: d
    text: La forma manuscrita ⲁⲡⲱⲛϩ probablemente es una variante ortográfica; la forma sahídica normalizada ⲉⲡⲱⲛϩ es el objeto de «hallar».
    reason: textual_variant
