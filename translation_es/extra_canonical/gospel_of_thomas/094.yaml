  source_alignment_summary: 'El borrador transmite correctamente la estructura gnómica: quien busca hallará y quien llama para entrar recibirá apertura. Sin embargo, omite las notas que preservan información textual y semántica significativa del registro inglés: la restauración parcial del incipit, la dirección «para entrar» sin añadir «puerta», y el valor pasivo impersonal de la tercera persona plural.'
  spanish_quality_summary: La redacción es clara y natural en español. Se recomienda «llama para entrar» en vez de «toca para entrar», pues «llamar» es la expresión española bíblica e idiomática para tocar solicitando acceso; conserva el sentido de ⲧⲱϩⲙ sin expresar una puerta ausente del copto.
  glossary_alignment: «Jesús» sigue la terminología del proyecto. No intervienen términos teológicos del glosario. «Encontrará», «llama para entrar» y «se le abrirá» reflejan respectivamente los futuros y el uso impersonal-pasivo del copto.
  issues:
