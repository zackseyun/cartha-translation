base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: es
  text: 'Jesús dijo[a]: «Quien busca encontrará; a quien llama para entrar[b], se le abrirá[c]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: El manuscrito conserva solo parcialmente el inicio «Jesús dijo»; la lectura se restaura a partir de los corchetes de Dilley y se normaliza como ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: «Llama para entrar» traduce ⲧⲱϩⲙ con la expresión direccional ⲉϩⲟⲩⲛ («hacia dentro, para entrar»). El copto no expresa «puerta».
    reason: cultural_note
  - marker: c
    text: '«Se le abrirá» traduce el futuro impersonal de tercera persona plural con sentido pasivo; también puede entenderse: «le abrirán».'
    reason: lexical_alternative
