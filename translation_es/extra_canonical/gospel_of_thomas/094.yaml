    issue: Faltan las notas textuales y léxicas conservadas por la auditoría inglesa.
    rationale: La restauración manuscrita de «Jesús dijo», la direccionalidad de «para entrar» y la alternativa activa del plural impersonal son datos significativos que deben mantenerse en notas españolas.
  - severity: low
    issue: «Toca para entrar» es menos idiomático y puede sugerir contacto físico.
    rationale: «Llama para entrar» comunica naturalmente el acto de golpear para solicitar entrada, sin añadir el sustantivo «puerta».
