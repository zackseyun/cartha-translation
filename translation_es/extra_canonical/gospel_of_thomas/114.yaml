review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva la estructura y el sentido básico del copto: la orden volitiva de que María salga, la oposición deliberadamente marcada hembra/varón, la indignidad respecto de la vida, la acción de Jesús y la entrada en el reino de los cielos. Sin embargo, debe restaurar en español las notas sustantivas conservadas por la auditoría inglesa y mejorar la formulación algo forzada de «como ustedes varones».'
  spanish_quality_summary: El español es en general claro y digno. «Conduciré» expresa con mayor precisión el valor de ‘llevar/guiar’ de ⲥⲱⲕ, y «como ustedes, los varones» hace inteligible y natural la comparación sin atenuar la polaridad sexual del original.
  glossary_alignment: «Jesús», «espíritu» en minúscula, «reino» y «cielos» son adecuados. Se mantiene «hembra» y «varón», en vez de «mujer» y «hombre», para reflejar la oposición ⲥϩⲓⲙⲉ/ϩⲟⲟⲩⲧ; las notas explican esta elección, la variante pronominal, la fluctuación ortográfica de ‘varón’ y «cielos».
  issues:
  - severity: medium
    issue: Faltan las notas léxicas y textuales significativas que conserva la auditoría inglesa.
    rationale: La oposición hembra/varón, la variante del pronombre femenino, la variante ortográfica de ‘varón’ y la alternativa ‘cielos/cielo’ son datos relevantes para una edición POB y deben conservarse con anclajes españoles únicos.
  - severity: low
    issue: «como ustedes varones» resulta poco natural en español.
    rationale: «Como ustedes, los varones» conserva el referente masculino plural explícito del copto y mejora la legibilidad.
  revised_spanish_text: 'Simón Pedro les dijo: «Que María salga de entre nosotros, porque la hembra[a] no es digna de la vida». Jesús dijo: «Mira: yo mismo la[b] conduciré, para hacerla varón[c], de modo que ella también llegue a ser un espíritu vivo como ustedes, los varones. Porque toda hembra que se haga varón entrará en el reino de los cielos[d]».'
  revised_footnotes: *id001
  revision_rationale: Se añaden las cuatro notas significativas preservadas en la auditoría inglesa, con marcadores únicos y anclados en el texto. Se reemplaza «guiaré» por «conduciré» para reflejar más directamente ‘llevar’, y se ajusta la comparación final para un español más natural sin cambiar el sentido.
