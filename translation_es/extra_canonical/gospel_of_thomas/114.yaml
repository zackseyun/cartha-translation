base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: es
  text: 'Simón Pedro les dijo: «Que María salga de entre nosotros, porque la hembra[a] no es digna de la vida». Jesús dijo: «Mira: yo mismo la[b] conduciré, para hacerla varón[c], de modo que ella también llegue a ser un espíritu vivo como ustedes, los varones. Porque toda hembra que se haga varón entrará en el reino de los cielos[d]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: «Hembra» traduce ⲥϩⲓⲙⲉ. En lugar de «mujer», mantiene la estrecha oposición con «varón» (ϩⲟⲟⲩⲧ) y la marcada polaridad sexual de este dicho.
    reason: lexical_alternative
  - marker: b
    text: El pronombre «la» corresponde al objeto directo femenino singular. El manuscrito presenta ⲙ̄ⲙⲟⲥ, mientras que la normalización de Dilley presenta el equivalente ⲛⲛⲧⲟⲥ; ambos significan «a ella».
    reason: textual_variant
  - marker: c
    text: La grafía de «varón» fluctúa entre ⲛϩⲟⲟⲧ y ⲛϩⲟⲟⲩⲧ; es una variación ortográfica o dialectal sin diferencia de sentido.
    reason: dialect_note
  - marker: d
    text: «Los cielos» traduce ⲡⲡⲉ. Algunas traducciones dicen «el cielo»; aquí la expresión designa el ámbito del reinado divino, no exige un plural estrictamente espacial.
    reason: lexical_alternative
