base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: es
  text: 'Jesús dijo: «Busquen al Viviente[a] mientras estén vivos, para que no mueran[b] y luego busquen verlo[c][d], y no podrán verlo[e]».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: «Busquen al Viviente» traduce ϭⲱϣⲧ ⲛⲥⲁ ⲡⲉⲧⲉⲣⲉⲱⲛϩ. El verbo con esta preposición puede traducirse «buscar» o «buscar tras»; «el Viviente» significa literalmente «el que vive» y conserva el carácter destacado de la expresión sin imponer una identificación cristológica determinada.
    reason: lexical_alternative
  - marker: b
    text: 'La construcción negativa de propósito (ϩⲓⲛⲁ ϫⲉ … ⲛⲛⲉ … ⲙⲟⲩ) también puede expresarse de forma más concisa: «para no morir».'
    reason: lexical_alternative
  - marker: c
    text: ϣⲓⲛⲉ significa «buscar»; también puede tener el matiz de «intentar». «Busquen verlo» conserva el vínculo léxico con el motivo de buscar en otros dichos de Tomás.
    reason: lexical_alternative
  - marker: d
    text: El manuscrito lee ⲉⲣⲟϥ y el texto normalizado ⲉⲛⲧⲟϥ; ambas formas significan «a él».
    reason: dialect_note
  - marker: e
    text: 'ϣϭⲙϭⲟⲙ significa literalmente «ser fuerte», pero con el infinitivo expresa idiomáticamente capacidad: «poder ver».'
    reason: cultural_note
