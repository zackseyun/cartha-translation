review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador transmite correctamente la estructura básica del copto: la búsqueda del Viviente durante la vida, seguida de la advertencia de que, tras morir, no se podrá verlo. «Busquen verlo» conserva adecuadamente la elección adjudicada de traducir ϣⲓⲛⲉ como «buscar» y no como «intentar». Sin embargo, carece por completo de las notas y decisiones léxicas requeridas para conservar las alternativas significativas y el dato dialectal presentes en la auditoría inglesa.'
  spanish_quality_summary: La redacción es natural, moderna y digna. «El Viviente» conserva el carácter destacado, potencialmente titular, de la expresión copta sin imponer una identificación teológica. Se propone sustituir el punto y coma antes de la coordinación final por coma, que reproduce más fluidamente la secuencia de la oración en español.
  glossary_alignment: «Jesús» sigue la terminología del proyecto. «El Viviente» representa ⲡⲉⲧⲉⲣⲉⲱⲛϩ como expresión titulada; no hay términos del glosario general que exijan otra forma. «Busquen» para ambos verbos conserva el motivo temático de la búsqueda y concuerda con la revisión inglesa documentada.
  issues:
  - severity: medium
    issue: Faltan todas las notas al pie y decisiones léxicas españolas.
    rationale: La auditoría inglesa documenta alternativas relevantes para ϭⲱϣⲧ ⲛⲥⲁ, «el Viviente», la construcción negativa de propósito, ϣⲓⲛⲉ, la capacidad expresada por ϣϭⲙϭⲟⲙ y la variante pronominal del manuscrito. El encargo exige preservar estas alternativas significativas en notas españolas.
  - severity: low
    issue: La puntuación con punto y coma antes de «y no podrán verlo» es menos fluida que la coordinación con coma.
    rationale: No altera el sentido, pero una coma mantiene mejor el encadenamiento de las cláusulas coordinadas del copto y resulta más natural en esta frase breve.
  revised_spanish_text: 'Jesús dijo: «Busquen al Viviente[a] mientras estén vivos, para que no mueran[b] y luego busquen verlo[c][d], y no podrán verlo[e]».'
  revised_footnotes: *id001
