review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva adecuadamente los elementos centrales del copto y las correcciones adjudicadas en la pista inglesa: la cláusula final («para que»), el demostrativo y objeto plurales («Estas eran las cosas») y la fórmula breve «Quien tiene oídos». Sin embargo, «depósitos de cosecha» no expresa con naturalidad que el hombre llena sus almacenes con productos agrícolas, y faltan notas necesarias para alternativas léxicas y la restauración textual.'
  spanish_quality_summary: La prosa es clara y digna en general. Se mejora la fluidez española sustituyendo la construcción algo forzada «Usaré mi dinero, para que siembre...» por infinitivos de finalidad coordinados, y «depósitos de cosecha» por «almacenes con productos agrícolas».
  glossary_alignment: No intervienen términos teológicos del glosario del proyecto. «Jesús», «rico», «dinero», «sembrar», «cosechar», «plantar» y «oídos» reflejan de forma directa el copto y las decisiones léxicas inglesas. «Almacenes» mantiene la amplitud de ⲁϩⲟ mejor que «graneros».
  issues:
  - severity: medium
    issue: «depósitos de cosecha» es una formulación semántica y estilísticamente deficiente.
    rationale: ⲁϩⲟ designa almacenes, graneros o depósitos, y ⲕⲁⲣⲡⲟⲥ es el producto que los llena. La redacción actual puede entenderse como depósitos pertenecientes a una cosecha, no como almacenes llenados con productos agrícolas.
  - severity: low
    issue: Faltan las notas léxicas y textuales que conservan alternativas significativas de la auditoría inglesa.
    rationale: Deben documentarse el alcance de «dinero», la restauración de «cosechar», el valor agrícola de «plantar», la amplitud de «almacenes» y la construcción «no carecer de nada». Las alternativas inglesas previamente rechazadas por la adjudicación —causal «for», singular «This was» y «ears to hear»— no se trasladan como variantes españolas.
  revised_spanish_text: 'Jesús dijo: «Había un hombre rico que tenía mucho dinero[a]. Dijo: “Usaré mi dinero para sembrar, cosechar[b] y plantar[c], y llenar mis almacenes[d] con productos agrícolas, para no carecer de nada[e].” Estas eran las cosas que pensaba en su corazón. Y en aquella noche murió. Quien tiene oídos, que oiga[f].»'
  revised_footnotes: *id001
  revision_rationale: La revisión conserva la lógica final inequívoca de ϫⲉⲕⲁⲁⲥ mediante «para» seguido de infinitivos, mantiene la pluralidad de «Estas eran las cosas» y no armoniza indebidamente la fórmula final con los Evangelios sinópticos. Repara la relación sintáctica entre los almacenes y los productos agrícolas, e incorpora notas españolas ancladas de forma única y ordenada. La auditoría inglesa muestra una numeración de marcadores heredada e internamente desordenada, pero ello no impide establecer una nota española coherente ni afecta la fidelidad del texto revisado.
