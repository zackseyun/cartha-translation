base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: es
  text: 'Jesús dijo: «Había un hombre rico que tenía mucho dinero[a]. Dijo: “Usaré mi dinero para sembrar, cosechar[b] y plantar[c], y llenar mis almacenes[d] con productos agrícolas, para no carecer de nada[e].” Estas eran las cosas que pensaba en su corazón. Y en aquella noche murió. Quien tiene oídos, que oiga[f].»'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: El copto ⲭⲣⲏⲙⲁ puede significar «dinero», «riqueza» o «propiedad». Se traduce «dinero» por su sentido concreto en este contexto; «riqueza» también es posible.
    reason: lexical_alternative
  - marker: b
    text: En ⲱϩⲥ («cosechar»), la letra ϩ es una restauración de la edición de Dilley a causa de daño en el manuscrito.
    reason: lacuna_or_restoration
  - marker: c
    text: ⲧⲱⲱϭⲉ se traduce «plantar»; también puede entenderse como «cultivar». Aquí es un verbo agrícola, no «construir».
    reason: lexical_alternative
  - marker: d
    text: ⲁϩⲟ puede designar almacenes, graneros o depósitos. «Almacenes» evita una especificación excesiva.
    reason: lexical_alternative
  - marker: e
    text: '«No carecer de nada» traduce ⲣϭⲣⲱϩ con la negación ⲛⲗⲁⲁⲩ: literalmente, «no estar necesitado de nada».'
    reason: cultural_note
  - marker: f
    text: Compárese Lucas 12:16–21, la parábola del hombre rico y sus graneros, teniendo en cuenta las diferencias importantes de redacción y énfasis.
    reason: cross_reference
