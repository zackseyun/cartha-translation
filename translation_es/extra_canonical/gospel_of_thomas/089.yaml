base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: es
  text: 'Jesús dijo: «¿Por qué lavan el exterior[a] de la copa? ¿No saben[b] que el que hizo[c] el interior es también el que hizo el exterior?»'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Literalmente, «el lado exterior de la copa» (ⲡⲥⲁ ⲛⲃⲟⲗ ⲛⲡⲡⲟⲧⲏⲣⲓⲟⲛ). La expresión paralela para «el interior» es ⲡⲥⲁ ⲛϩⲟⲩⲛ.
    reason: dialect_note
  - marker: b
    text: El copto ⲛⲟⲉⲓ también puede significar «entender» o «darse cuenta». «Saben» conserva aquí el sentido cognitivo directo.
    reason: lexical_alternative
  - marker: c
    text: En la cláusula relativa, el copto ⲧⲁⲙⲓⲟ significa «hacer, formar»; también podría traducirse «formó». No repite el verbo anterior «lavar», y así se conserva el contraste entre lavar y hacer.
    reason: lexical_alternative
