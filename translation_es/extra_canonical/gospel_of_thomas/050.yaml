review_pass:
  verdict: revise
  source_alignment_summary: La redacción propuesta conserva la estructura dialogal y las principales relaciones del copto, pero «han llegado a ser» resulta poco idiomático en español y «se alzó» no expresa con precisión el verbo «estar de pie». La revisión distingue «llegar a existir» (ϣⲱⲡⲉ) de «salir» (ⲉⲓ ⲉⲃⲟⲗ), conserva el plural posesivo ambiguo de «su imagen», la cópula elíptica de «¿Son ustedes eso?» y la fórmula abstracta «movimiento y reposo».
  spanish_quality_summary: 'La revisión usa un español latinoamericano moderno y digno: «llegado a existir», «se mantuvo en pie» y «se manifestó» son más claros que las formulaciones del borrador. Se normaliza «padre vivo» en minúscula, conforme a la decisión auditada de no introducir una capitalización interpretativa.'
  glossary_alignment: «Jesús», «luz», «padre», «señal», «escogidos», «movimiento» y «reposo» reflejan las decisiones léxicas documentadas. «Escogidos» comunica ⲡⲥⲱⲧⲡ sin imponer las connotaciones eclesiales de «elegidos»; esta última se conserva como alternativa en nota. «Reposo» es una traducción española natural de ⲁⲛⲁⲡⲁⲩⲥⲓⲥ, con «descanso» anotado como alternativa estilística.
  issues:
  - severity: medium
    issue: La traducción de ϣⲱⲡⲉ como «han llegado a ser» es rígida y «se alzó» modifica el sentido de ⲟⲩⲱϩⲉ.
    rationale: El pasaje emplea ϣⲱⲡⲉ para el origen de los interlocutores y de la luz; «llegar a existir» mantiene ese vínculo con un español natural. ⲟⲩⲱϩⲉ significa «estar de pie», no específicamente «alzarse».
  - severity: medium
    issue: Faltan las notas necesarias sobre restauración textual, ambigüedad posesiva, alternativas léxicas y cópula elíptica.
    rationale: La evidencia y la auditoría inglesa preservan incertidumbres y alternativas significativas. Deben trasladarse como notas españolas ancladas para no resolver o silenciar cuestiones que el texto fuente deja abiertas.
  revised_spanish_text: 'Jesús dijo: «Si les dicen: “¿De dónde han llegado a existir?”, díganles: “Hemos salido de la luz, del lugar donde la luz llegó a existir por sí misma[a], se mantuvo en pie y se manifestó en su imagen[b]”. Si les dicen: “¿Son ustedes eso[c]?”, digan: “Somos sus hijos y somos los escogidos[d] del padre vivo”. Y si les preguntan: “¿Cuál es la señal de su padre que está en ustedes?”, díganles: “Es movimiento y reposo[e]”».'
  revised_footnotes: *id001
  revision_rationale: Se corrigen dos formulaciones del texto publicado y se añaden las notas que preservan las incertidumbres y alternativas registradas por la auditoría. La ausencia de decisiones léxicas y teológicas en los metadatos del borrador es una limitación de auditoría, pero la revisión incorpora en el texto y las notas las decisiones necesarias para publicación.
