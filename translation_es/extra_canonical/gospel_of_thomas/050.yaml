base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: es
  text: 'Jesús dijo: «Si les dicen: “¿De dónde han llegado a existir?”, díganles: “Hemos salido de la luz, del lugar donde la luz llegó a existir por sí misma[a], se mantuvo en pie y se manifestó en su imagen[b]”. Si les dicen: “¿Son ustedes eso[c]?”, digan: “Somos sus hijos y somos los escogidos[d] del padre vivo”. Y si les preguntan: “¿Cuál es la señal de su padre que está en ustedes?”, díganles: “Es movimiento y reposo[e]”».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: La cláusula «donde la luz llegó a existir por sí misma, se mantuvo en pie y se manifestó» conserva tres verbos breves del copto. La frase que sustenta «por sí misma» se halla parcialmente restaurada en el manuscrito, y su matiz exacto puede entenderse también como «de sí misma».
    reason: lacuna_or_restoration
  - marker: b
    text: '«Su imagen» traduce un posesivo plural en copto: literalmente, «la imagen de ellos». No queda claro quiénes son «ellos»; la traducción conserva la ambigüedad en vez de armonizarla como «su imagen» en singular o «la imagen de la luz».'
    reason: textual_variant
  - marker: c
    text: «¿Son ustedes eso?» reproduce una construcción copular elíptica del copto, cuyo predicado queda implícito; por ello conserva su brusquedad.
    reason: dialect_note
  - marker: d
    text: «Los escogidos» también puede traducirse «los elegidos». «Escogidos» conserva el sentido de lo seleccionado sin añadir connotaciones eclesiales más marcadas.
    reason: lexical_alternative
  - marker: e
    text: «Movimiento» traduce ⲕⲓⲙ; «moción» es una alternativa posible. «Reposo» traduce ⲁⲛⲁⲡⲁⲩⲥⲓⲥ; «descanso» es una alternativa estilística.
    reason: lexical_alternative
