base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: es
  text: 'La bendición así predicha pertenece, sin duda, a los tiempos del Reino, cuando los justos resucitarán de entre los muertos y reinarán. Entonces también la creación, renovada y liberada de la esclavitud, producirá alimentos de toda clase en abundancia, gracias al rocío del cielo y a la fertilidad de la tierra. Así lo cuentan los ancianos que vieron a Juan, el discípulo del Señor: afirmaban haberle oído decir que el Señor solía enseñar acerca de aquellos tiempos de esta manera:


    «Vendrán días en que crecerán vides, cada una con diez mil sarmientos; cada sarmiento tendrá diez mil ramas; cada rama, a su vez, diez mil ramitas; cada ramita, diez mil racimos; y cada racimo, diez mil uvas. Cada uva, al ser exprimida, dará veinticinco medidas de vino. Cuando alguno de los santos tome uno de esos racimos, otro racimo gritará: “Yo soy un racimo mejor; tómame y bendice al Señor por medio de mí”. Del mismo modo, un grano de trigo producirá diez mil espigas; cada espiga tendrá diez mil granos, y cada grano dará diez libras de harina fina, blanca y limpia. Los demás frutos, las semillas y la hierba producirán en proporciones semejantes. Y todos los animales, al alimentarse de estos frutos de la tierra, se volverán pacíficos y vivirán en armonía unos con otros, enteramente sujetos al ser humano».


    Estas cosas las atestigua por escrito Papías —oyente de Juan, compañero de Policarpo y hombre digno de la antigüedad— en el cuarto de sus libros, pues compuso cinco. Y añadió:


    «Estas cosas son creíbles para quienes creen».


    Cuando Judas, el traidor, no creyó y preguntó: «¿Cómo hará el Señor que se produzca semejante abundancia?», Papías cuenta que el Señor respondió: «Lo verán quienes lleguen a aquellos tiempos».


    Ireneo, Contra las herejías 5.33.3–4.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El fragmento de Papías se conserva citado por Ireneo en Contra las herejías 5.33.3–4. La presente traducción se basa provisionalmente en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto antiguo griego o latino.
    reason: Aclara la transmisión indirecta del fragmento y la limitación de la base textual disponible.
lexical_decisions:
- source_word: times of the Kingdom
  choice: los tiempos del Reino
  rationale: Conserva la expresión escatológica y la mayúscula editorial del testimonio, sin identificarla con un sistema doctrinal particular.
- source_word: fatness of the earth
  choice: la fertilidad de la tierra
  rationale: Expresa en español natural la idea antigua de riqueza o fecundidad del suelo, evitando el calco poco idiomático «grosura».
- source_word: shoots
  choice: sarmientos
  rationale: En el contexto de una vid, «sarmientos» es preciso y comprensible; los términos sucesivos se mantienen diferenciados como ramas y ramitas.
- source_word: five-and-twenty measures
  choice: veinticinco medidas
  rationale: Mantiene indeterminada la unidad antigua porque el testimonio proporcionado no permite precisar con seguridad su volumen.
- source_word: heads
  choice: espigas
  rationale: Es el equivalente natural para las cabezas productoras de grano del trigo.
- source_word: fine flour, bright and clean
  choice: harina fina, blanca y limpia
  rationale: «Blanca» comunica de modo idiomático la apariencia luminosa de la harina sin omitir la cualidad de pureza.
- source_word: using these fruits
  choice: al alimentarse de estos frutos
  rationale: Aclara el sentido contextual de «usar» sin añadir una idea teológica.
- source_word: hearer of John
  choice: oyente de Juan
  rationale: Conserva la afirmación tradicional con su alcance propio, sin convertirla en una relación formal de discipulado.
theological_decisions:
- issue: Naturaleza de los «tiempos del Reino»
  choice: Mantener la descripción concreta del reinado, la resurrección y la renovación de la creación
  alternative: Espiritualizar la abundancia como una metáfora de bendiciones presentes
  rationale: El fragmento presenta expresamente estos sucesos como futuros y corporales; la traducción no debe resolver la tensión escatológica mediante interpretación denominacional.
- issue: Identidad de Juan
  choice: Traducir «Juan, el discípulo del Señor» sin identificarlo adicionalmente
  alternative: Añadir «el apóstol Juan» o distinguirlo como «Juan el Anciano»
  rationale: El testimonio preservado no justifica resolver aquí la discusión histórica sobre cuál Juan se menciona.
- issue: Atribución de las palabras finales
  choice: «Papías cuenta que el Señor respondió»
  alternative: Presentarlas como palabras históricamente verificadas del Jesús canónico
  rationale: Se conserva la cadena de atribución del fragmento y no se equipara sin matices esta tradición con los Evangelios canónicos.
- issue: Judas «el traidor»
  choice: Conservar la identificación tal como aparece en el testimonio
  alternative: Corregir o reinterpretar la figura por la dificultad histórica de la escena
  rationale: La tensión interna pertenece a la tradición transmitida y no debe eliminarse silenciosamente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la exuberancia numérica, el discurso directo y la cadena de testimonios. Se corrigieron tácitamente daños evidentes de OCR del testimonio inglés, pero no se intentó reconstruir más allá del texto auditado proporcionado.
