    text: Traducción provisional basada en un testimonio inglés de dominio público; queda pendiente la revisión directa del texto griego o latino. Se conserva la elipsis presente en el testimonio.
    reason: La fuente proporcionada advierte que aún no se ha cotejado directamente el idioma antiguo, y la omisión señalada por puntos suspensivos podría afectar la sintaxis o el contenido.
  revision_rationale: 'Se realizan únicamente ajustes seguros de idiomaticidad y precisión léxica frente al testimonio inglés: «sayings» se vierte como «dichos», y «referred them to» como «los aplicaban a». Se mantienen la elipsis, los nombres, el título «Juan el Evangelista» y la cautela de la nota provisional.'
