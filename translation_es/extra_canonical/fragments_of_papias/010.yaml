  text: "So then the more ancient expositors of the churches, I mean Philo,\n_ the philosopher, and contemporary of the Apostles, and the famous Papias\n_of Hierapolis, the disciple of John the Evangelist...and their associates,\n  interpreted the sayings about Paradise spiritually, and referred them to the\n  Church of Christ.\n                ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. vii."
