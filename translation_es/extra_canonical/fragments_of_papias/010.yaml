review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio ინგლისés provisional, incluida la elipsis y la atribución a Filón, Papías y sus asociados. Conviene ajustar «expresiones» a «dichos», que corresponde más directamente a «sayings», y «las referían a» a «los aplicaban a», giro español más claro para la relación interpretativa indicada.
  naturalness: El registro es digno y comprensible. La sintaxis mejora si la serie se presenta con comas, dejando visible que la elipsis corresponde al testimonio y sin encerrar indebidamente toda la enumeración entre rayas.
  terminology: «Intérpretes», «en sentido espiritual», «paraíso» e «Iglesia de Cristo» son términos naturales y no imponen una lectura confesional. Se conserva «Juan el Evangelista», tal como lo transmite el testimonio.
  issues:
  - severity: low
    issue: «las expresiones acerca del Paraíso»
    rationale: «Sayings» se vierte más directamente como «los dichos sobre el paraíso»; «expresiones» es más amplio que el testimonio.
  - severity: low
    issue: «las referían a la Iglesia de Cristo»
    rationale: Aunque comprensible, «referir dichos a» resulta poco natural en español actual y puede sugerir atribución. «Aplicaban esos dichos a» expresa mejor la operación exegética sin reforzarla.
  - severity: low
    issue: Puntuación de la enumeración interrumpida por la elipsis
    rationale: La puntuación con rayas hace menos transparente la relación entre los nombres, la elipsis y «sus compañeros». Las comas preservan mejor la estructura incompleta del testimonio.
  revised_text: 'Así pues, los intérpretes más antiguos de las iglesias —me refiero a Filón, el filósofo y contemporáneo de los apóstoles, y al célebre Papías de Hierápolis, discípulo de Juan el Evangelista, ... y a sus compañeros— interpretaban en sentido espiritual los dichos sobre el paraíso y los aplicaban a la Iglesia de Cristo.[a]


    ANASTASIO DEL SINAÍ, Contempl. Anagog. in Hexaém. VII.'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en un testimonio inglés de dominio público; queda pendiente la revisión directa del texto griego o latino. Se conserva la elipsis presente en el testimonio.
    reason: La fuente proporcionada advierte que aún no se ha cotejado directamente el idioma antiguo, y la omisión señalada por puntos suspensivos podría afectar la sintaxis o el contenido.
