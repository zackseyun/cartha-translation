review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés disponible y conserva tanto la elipsis como la atribución de «Juan el Evangelista». Dado que no se ha cotejado el griego/latín, no se resuelven las posibles implicaciones del pasaje omitido.
  naturalness: «Las referían a la Iglesia de Cristo» es comprensible, pero resulta algo calcado y menos idiomático en español actual. «Los aplicaban a la Iglesia de Cristo» expresa naturalmente la operación interpretativa sin intensificarla. «Dichos» es una correspondencia más directa y usual para «sayings» que «expresiones».
  terminology: Se mantienen adecuadamente «Filón», «Papías de Hierápolis», «Juan el Evangelista», «Paraíso» e «Iglesia de Cristo». «En sentido espiritual» conserva prudentemente el alcance de «spiritually», sin imponer una lectura alegórica exhaustiva.
  issues:
  - severity: low
    issue: «las referían a la Iglesia de Cristo»
    rationale: Aunque es posible, la construcción es poco natural en este contexto exegético; «los aplicaban a la Iglesia de Cristo» conserva el sentido de atribuir o relacionar interpretativamente los dichos con la Iglesia.
  - severity: low
    issue: «expresiones acerca del Paraíso»
    rationale: «Dichos acerca del Paraíso» reproduce más directamente «sayings about Paradise» y es más idiomático para enunciados transmitidos o interpretados.
  revised_text: 'Así pues, los expositores más antiguos de las iglesias —me refiero a Filón, el filósofo y contemporáneo de los apóstoles, y al célebre Papías de Hierápolis, discípulo de Juan el Evangelista... y sus compañeros— interpretaban en sentido espiritual los dichos acerca del Paraíso y los aplicaban a la Iglesia de Cristo.[a]


    ANASTASIO DEL SINAÍ, Contempl. Anagog. in Hexaém. VII.'
  revised_footnotes:
