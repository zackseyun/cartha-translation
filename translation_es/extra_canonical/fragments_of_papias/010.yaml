base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: es
  text: 'Así pues, los expositores más antiguos de las iglesias —me refiero a Filón, el filósofo y contemporáneo de los apóstoles, y al célebre Papías de Hierápolis, discípulo de Juan el Evangelista... así como a sus compañeros— interpretaban en sentido espiritual las expresiones acerca del Paraíso y las referían a la Iglesia de Cristo.[a]


    ANASTASIO DEL SINAÍ, Contempl. Anagog. in Hexaém. VII.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un testimonio inglés de dominio público; queda pendiente la revisión directa del texto griego o latino. Se conserva la elipsis presente en el testimonio.
    reason: La fuente proporcionada advierte que aún no se ha cotejado directamente el idioma antiguo, y la omisión señalada por puntos suspensivos podría afectar la sintaxis o el contenido.
lexical_decisions:
- source_word: expositors
  choice: expositores
  rationale: Conserva el sentido técnico de intérpretes o comentaristas sin añadir una función eclesiástica específica.
- source_word: sayings about Paradise
  choice: las expresiones acerca del Paraíso
  rationale: «Expresiones» reproduce de manera amplia el testimonio inglés y evita precisar si se trata de dichos, palabras o pasajes cuando falta la revisión del texto antiguo.
- source_word: spiritually
  choice: en sentido espiritual
  rationale: Expresa con naturalidad el modo de interpretación indicado, sin definirlo como exclusivamente alegórico.
- source_word: referred them to
  choice: las referían a
  rationale: Mantiene la relación interpretativa del testimonio sin intensificarla como identificación absoluta.
- source_word: Church of Christ
  choice: Iglesia de Cristo
  rationale: Traducción directa y tradicional, sin introducir una identificación denominacional.
theological_decisions:
- issue: Naturaleza de la interpretación del Paraíso
  choice: «interpretaban en sentido espiritual... y las referían a la Iglesia de Cristo»
  alternative: «alegorizaban... identificándolas con la Iglesia de Cristo»
  rationale: 'La opción elegida conserva la formulación y la tensión del testimonio: indica una lectura espiritual y una referencia eclesial, pero no afirma que esta agotara el sentido del texto.'
- issue: Identidad del Juan mencionado
  choice: «Juan el Evangelista»
  alternative: «Juan, el autor del Evangelio» o «el apóstol Juan»
  rationale: Se conserva el título transmitido por el testimonio, sin resolver debates históricos sobre la identidad de Juan ni sustituirlo por «apóstol».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron los nombres y el título de la fuente en una forma reconocible; el título latino abreviado no se expandió para evitar una reconstrucción bibliográfica incierta.
