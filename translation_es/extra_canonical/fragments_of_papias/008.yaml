review_pass:
  verdict: revise
  source_fidelity: La traducción conserva adecuadamente el carácter fragmentario, la delegación de autoridad a ciertos ángeles y la identificación tradicional del dragón con Satanás y el diablo. Sin embargo, la clausura gramatical «él y sus ángeles» debe conservarse de modo más directo como sujeto de la segunda acción de ser arrojados, en vez de reducirse a un acompañamiento mediante «junto con».
  naturalness: El español es en general claro y de registro apropiado. «Fue arrojado abajo» resulta algo forzado en español actual; «fue arrojado» conserva la primera afirmación sin introducir una direccionalidad castellana poco natural, y la segunda cláusula especifica «a la tierra».
  terminology: «Autoridad», «organización del universo» y «orden» son opciones defendibles y no imponen una interpretación doctrinal. Se conserva «Satanás», «el diablo», «gran dragón» y «serpiente antigua».
  issues:
  - severity: medium
    issue: La frase final presenta «junto con sus ángeles» en lugar de conservar explícitamente «él y sus ángeles» como sujetos de la segunda acción pasiva.
    rationale: El testimonio dice que el dragón fue arrojado y, sí, que él y sus ángeles fueron arrojados a la tierra. La formulación revisada mantiene tanto la repetición enfática como la sintaxis inclusiva del texto.
  - severity: low
    issue: «Fue arrojado abajo» es una reproducción demasiado literal y poco idiomática de la primera mención.
    rationale: La primera afirmación no necesita una dirección adicional en español, pues la segunda precisa expresamente «a la tierra». «Fue arrojado» es natural y conserva el sentido.
  revised_text: 'Pero Papías dice así —lo cito palabra por palabra—:


    «A algunos de ellos, es decir, a los ángeles que al principio eran santos, les dio también autoridad sobre la organización del universo y les encomendó ejercer bien esa autoridad».


    Y a continuación dice:


    «Pero sucedió que su orden quedó reducido a nada, pues el gran dragón, la serpiente antigua, que también se llama Satanás y el diablo, fue arrojado; sí, a la tierra fueron arrojados él y sus ángeles».


    Andrés de Cesarea, Comentario sobre el Apocalipsis, cap. 34, sermón 12.[a]'
  revised_footnotes:
  - marker: a
    text: Este fragmento se conserva en Andrés de Cesarea. La presente traducción es provisional y se basa en un antiguo testimonio inglés de dominio público; está pendiente la revisión directa del texto griego o latino. Las letras incompletas del impreso se han restaurado por su contexto evidente.
    reason: La fuente proporcionada advierte que falta la revisión en la lengua antigua y contiene daños evidentes de OCR; la nota hace transparente la base documental sin recargar el texto.
  revision_rationale: Se conserva el contenido y las ambigüedades del borrador, pero se restituye en español la estructura enfática «él y sus ángeles fueron arrojados a la tierra» y se mejora la naturalidad de la primera mención del lanzamiento. No se ha añadido ninguna explicación doctrinal ni se ha resuelto la referencia implícita del agente que concede autoridad.
