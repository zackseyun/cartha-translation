base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: es
  text: 'Pero Papías dice así —lo cito palabra por palabra—:


    «A algunos de ellos, es decir, a los ángeles que al principio eran santos, les dio también autoridad sobre la organización del universo y les encomendó ejercer bien esa autoridad».


    Y a continuación dice:


    «Pero sucedió que su orden quedó reducido a nada, pues el gran dragón, la serpiente antigua, que también se llama Satanás y el diablo, fue arrojado abajo; sí, fue arrojado a la tierra, junto con sus ángeles».


    Andrés de Cesarea, Comentario sobre el Apocalipsis, cap. 34, sermón 12.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este fragmento se conserva en Andrés de Cesarea. La presente traducción es provisional y se basa en un antiguo testimonio inglés de dominio público; está pendiente la revisión directa del texto griego o latino. Las letras incompletas del impreso se han restaurado por su contexto evidente.
    reason: La fuente proporcionada advierte que falta la revisión en la lengua antigua y contiene daños evidentes de OCR; la nota hace transparente la base documental sin recargar el texto.
lexical_decisions:
- source_word: dominion
  choice: autoridad
  rationale: Comunica de manera natural la potestad delegada a los ángeles; evita que «dominio» se entienda principalmente como territorio.
- source_word: arrangement of the universe
  choice: organización del universo
  rationale: Conserva la idea amplia del ordenamiento o disposición del cosmos sin precisar indebidamente su alcance.
- source_word: array
  choice: orden
  rationale: Mantiene la relación temática con la organización anterior y deja abierta la posibilidad de una estructura o condición ordenada.
- source_word: came to nought
  choice: quedó reducido a nada
  rationale: Reproduce con fuerza la ruina o anulación expresada por el testimonio inglés sin explicar de más su naturaleza.
- source_word: was cast down
  choice: fue arrojado abajo
  rationale: Conserva el énfasis direccional de la primera expresión antes de la especificación «a la tierra».
theological_decisions:
- issue: Identidad de «algunos de ellos»
  choice: 'Conservar el pronombre y añadir la aclaración transmitida: «es decir, a los ángeles»'
  alternative: Sustituir directamente «algunos de ellos» por «algunos ángeles»
  rationale: Preserva la forma referencial del fragmento y, a la vez, la glosa aclaratoria del testigo.
- issue: Agente divino implícito
  choice: Mantener el sujeto tácito de «les dio» y «les encomendó»
  alternative: Explicitar «Dios»
  rationale: El fragmento recibido solo presenta un pronombre mayúsculo en inglés; nombrar a Dios resolvería una referencia que el texto fragmentario deja implícita.
- issue: Naturaleza del fracaso del orden angélico
  choice: Traducir literalmente como «su orden quedó reducido a nada»
  alternative: Interpretar como «perdieron su puesto» o «su gobierno fracasó»
  rationale: Evita decidir si se trata de jerarquía, formación, administración o estado ordenado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el carácter fragmentario, las repeticiones enfáticas y las referencias pronominales sin introducir una interpretación denominacional. El título latino de la obra citante se vertió de forma descriptiva al español.
