review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés disponible y conserva la repetición enfática de «was cast down». Sin embargo, «autoridad» atenúa la correspondencia léxica y la repetición de «dominion», mientras que «organización» puede sugerir una institución más que la disposición u ordenamiento del cosmos. «Junto con sus ángeles» también convierte la coordinación explícita («he and his angels») en una mera expresión acompañante.
  naturalness: El registro es generalmente claro y adecuado. «Fue arrojado abajo» resulta poco idiomático en español actual; la repetición puede conservarse naturalmente como «fue arrojado; sí, fue arrojado a la tierra». «Su orden quedó reducido a nada» es comprensible, aunque conserva una formulación algo rígida justificada por la incertidumbre del término transmitido.
  terminology: Se recomienda «dominio» para reproducir de forma consistente «dominion» y «ejercer bien su dominio». «Disposición del universo» conserva mejor la amplitud de «arrangement of the universe». La referencia de Andrés debe presentarse como una localización en la obra, no afirmar sin base adicional que sea un «Comentario».
  issues:
  - severity: medium
    issue: Inconsistencia y desplazamiento en la traducción de «dominion».
    rationale: «Autoridad» no expresa necesariamente el ámbito de gobierno delegado y no permite reflejar la repetición del inglés («gave dominion» / «exercise their dominion»). «Dominio» es natural en este contexto y conserva el vínculo.
  - severity: medium
    issue: «Organización del universo» estrecha «arrangement of the universe».
    rationale: «Organización» puede aludir a una entidad organizada o a una administración; «disposición» mantiene el sentido amplio de ordenamiento cósmico sin especificarlo.
  - severity: low
    issue: «Fue arrojado abajo» es poco natural y «junto con» debilita la coordinación final.
    rationale: La versión revisada preserva la duplicación enfática y reproduce explícitamente que el dragón y sus ángeles fueron arrojados.
  - severity: low
    issue: La denominación «Comentario sobre el Apocalipsis» interpreta el título de la obra citante.
    rationale: Con la evidencia suministrada es más prudente traducir el título de modo mínimo como «Sobre el Apocalipsis» y conservar la referencia interna.
  revised_text: 'Pero Papías dice así —lo cito palabra por palabra—:


    «A algunos de ellos —evidentemente, a los ángeles que al principio eran santos— les dio también dominio sobre la disposición del universo; les encargó ejercer bien su dominio».


    Y luego dice:


    «Pero sucedió que su orden quedó reducido a nada, pues el gran dragón, la serpiente antigua, que también se llama Satanás y el diablo, fue arrojado; sí, fue arrojado a la tierra, él y sus ángeles».


    Andrés de Cesarea, Sobre el Apocalipsis, cap. 34, sermón 12.[a]'
  revised_footnotes:
  - marker: a
    text: Este fragmento se conserva en Andrés de Cesarea. La presente traducción es provisional y se basa en un antiguo testimonio inglés de dominio público; queda pendiente la revisión directa del texto antiguo. Las letras incompletas del impreso se han restaurado según el contexto evidente.
    reason: La nota conserva la transparencia necesaria sobre la dependencia del testimonio inglés y las restauraciones de OCR, sin afirmar de manera innecesaria una lengua concreta para el texto que aún debe revisarse directamente.
  revision_rationale: Se ajustaron los términos que corresponden a «dominion» y «arrangement», se conservó la ambigüedad de «array» como «orden», y se volvió más natural la repetición de «was cast down» sin suprimirla. También se redujo la interpretación editorial en el título de la obra citante. La identificación de «algunos de ellos» con los ángeles se mantiene, porque está expresada en el testimonio inglés, pero se marca mediante incisos para reflejar su carácter parentético.
