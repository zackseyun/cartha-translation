base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: es
  text: 'Aquí comienza el argumento del Evangelio según Juan.


    El Evangelio de Juan fue dado a conocer y entregado a las iglesias por Juan mientras él aún permanecía en el cuerpo, según lo relató un tal Papías de Hierápolis, amado discípulo de Juan, en sus cinco libros exotéricos[a]. Pero él puso por escrito el Evangelio correctamente, al dictado de Juan.


    Un manuscrito vaticano del siglo IX.


    XX


    Pues Juan, el último de estos, llamado Hijo del Trueno, cuando ya era un hombre muy anciano —según nos lo transmitieron Ireneo y Eusebio, junto con una sucesión de historiadores dignos de confianza—, hacia el tiempo en que habían surgido terribles herejías, dictó el Evangelio a su propio discípulo, el virtuoso Papías de Hierápolis, para completar lo que faltaba en aquellos que antes de él habían proclamado la palabra a las naciones por toda la tierra.


    Cadena de los Padres Griegos sobre san Juan, publicada por B. Corder.


    [a] Así dice el testimonio impreso: «exotéricos»; el editor propone leer «exegéticos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Así dice el testimonio impreso: «exotéricos»; el editor propone leer «exegéticos».'
    reason: La fuente inglesa conserva una lectura y, entre paréntesis, una corrección editorial. La nota permite distinguir ambas sin borrar la historia textual.
lexical_decisions:
- source_word: argument
  choice: argumento
  rationale: Se conserva el término técnico tradicional para el encabezamiento o sumario introductorio de un libro, sin convertirlo interpretativamente en «prólogo».
- source_word: while he yet remained in the body
  choice: mientras él aún permanecía en el cuerpo
  rationale: Reproduce la expresión corporal antigua y evita sustituirla por el más explícito «mientras aún vivía».
- source_word: made known and given to the Churches
  choice: fue dado a conocer y entregado a las iglesias
  rationale: Mantiene los dos verbos y traduce «churches» como comunidades locales, sin mayúscula institucional innecesaria.
- source_word: exoteric (read exegetical) books
  choice: libros exotéricos[a]
  rationale: Conserva en el texto la lectura transmitida y lleva la enmienda editorial a una nota, en vez de incorporarla silenciosamente.
- source_word: at the dictation of John
  choice: al dictado de Juan
  rationale: Expresa de manera directa la afirmación del testimonio acerca del modo de redacción.
- source_word: Son of Thunder
  choice: Hijo del Trueno
  rationale: Mantiene el sobrenombre bíblico en forma reconocible y digna.
- source_word: the word
  choice: la palabra
  rationale: Conserva la amplitud semántica y religiosa del término sin explicitarlo como «evangelio» o «mensaje».
- source_word: to fill up what was lacking in those
  choice: para completar lo que faltaba en aquellos
  rationale: Preserva la construcción difícil y su posible ambigüedad, sin decidir que se refiere necesariamente a escritos, relatos o predicadores.
theological_decisions:
- issue: Identidad y relación de Papías con Juan
  choice: «amado discípulo de Juan» y «su propio discípulo»
  alternative: Reformular como seguidor indirecto, oyente o discípulo del apóstol
  rationale: El testimonio suministrado afirma una relación discipular directa; la traducción la conserva sin armonizarla con otros testimonios patrísticos ni evaluar su historicidad.
- issue: Autoría y dictado del Evangelio de Juan
  choice: Conservar que Juan lo dio a conocer y lo dictó a Papías
  alternative: Atenuarlo como tradición de composición, edición o publicación
  rationale: La afirmación pertenece al fragmento y debe traducirse como tal, sin convertirla en una conclusión editorial o doctrinal del proyecto.
- issue: Herejías como contexto de composición
  choice: «habían surgido terribles herejías»
  alternative: Neutralizar como «controversias» o identificar doctrinas concretas
  rationale: Se mantiene el juicio valorativo del testimonio sin añadir nombres ni perfiles doctrinales ausentes.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno, con sintaxis moderadamente formal apropiada para un fragmento patrístico. Se conserva el encabezamiento del Fragmento XX porque está incluido en el material suministrado, aunque la referencia solicitada sea Fragmento XIX. El borrador es necesariamente provisional: el expediente no aporta el texto griego o latino, sino un testimonio inglés de dominio público, y señala que la revisión en lengua fuente está pendiente. «Un manuscrito vaticano del siglo IX» y la atribución final se presentan como rótulos de procedencia, tal como aparecen en el testimonio.'
