  source_fidelity: 'La revisión directa del griego/latín no puede completarse porque el expediente solo aporta un testimonio ინგლისés y advierte que la revisión de lengua fuente está pendiente. Frente a ese testimonio, el contenido se conserva en general, incluida la transmisión atribuida a Papías y la sección XX incorporada en el testigo. Conviene reproducir explícitamente en el texto la indicación editorial «read: exegetical», en vez de convertirla solo en una explicación de nota.'
  naturalness: El español es claro y de registro apropiado. «Argumento» puede conservarse como rótulo técnico tradicional de un sumario introductorio. Se ajusta levemente la puntuación y se hace más transparente la presentación de la variante textual.
  terminology: '«Iglesias», «permanecía en el cuerpo», «al dictado», «Hijo del Trueno», «herejías» y «la palabra» son opciones fieles y de registro adecuado. «Exotéricos» debe conservarse como lectura transmitida, pero acompañado de «léase: exegéticos», tal como lo hace el testimonio inglés.'
  issues:
  - severity: medium
    issue: 'La corrección «read: exegetical» no aparece de forma explícita en el cuerpo traducido.'
    rationale: El testimonio inglés conserva la lectura «exoteric» y, entre paréntesis, manda leer «exegetical». La nota del borrador informa la enmienda, pero atribuye la propuesta a «el editor», dato que no formula el texto inglés presentado, y deja de reflejar su formato parentético.
  - severity: low
    issue: La revisión de lengua fuente sigue pendiente.
    rationale: No se suministra el texto griego o latino correspondiente a estas atribuciones tardías; por ello no es posible confirmar de modo independiente la sintaxis, las lecturas ni la delimitación entre los fragmentos XIX y XX.
