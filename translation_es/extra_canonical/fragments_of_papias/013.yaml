base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: es
  text: 'Con esto habla de manera velada, refiriéndose, según supongo, a Papías de Hierápolis, en Asia, quien era obispo en aquel tiempo y floreció en los días del santo evangelista Juan. Pues este Papías, en el cuarto libro de sus Exposiciones de las palabras del Señor[a], mencionó alimentos entre las fuentes de deleite en la resurrección.... Ireneo de Lyon afirma lo mismo en el quinto libro de Contra las herejías y presenta al ya mencionado Papías como apoyo de sus afirmaciones.


    MÁXIMO EL CONFESOR, Escolios sobre La jerarquía eclesiástica de Dionisio el Areopagita, capítulo 7.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Título tradicional: «Exposiciones de las palabras del Señor». También puede traducirse «Exposiciones de los oráculos del Señor».'
    reason: La fuente inglesa dice «Dominical Expositions», pero el título antiguo admite distintas formulaciones; la nota preserva esa amplitud mientras la revisión directa del griego o latín permanece pendiente.
lexical_decisions:
- source_word: darkly indicating
  choice: habla de manera velada
  rationale: Conserva la idea de una referencia oscura o indirecta con una expresión natural en español actual.
- source_word: flourished
  choice: floreció
  rationale: Mantiene el giro historiográfico tradicional, que indica el período de actividad o plenitud de una persona.
- source_word: Dominical Expositions
  choice: Exposiciones de las palabras del Señor
  rationale: Expresa el probable sentido de «dominical» como relativo a dichos o palabras del Señor, sin dejar un adjetivo español potencialmente ambiguo.
- source_word: viands
  choice: alimentos
  rationale: Usa un término claro y digno que no añade la connotación más específica de manjares.
- source_word: sources of delights
  choice: fuentes de deleite
  rationale: Conserva la metáfora y evita precisar indebidamente la naturaleza del deleite.
- source_word: produces in support
  choice: presenta ... como apoyo
  rationale: Refleja que Ireneo aduce a Papías como testimonio en respaldo de sus afirmaciones.
theological_decisions:
- issue: Naturaleza de los deleites en la resurrección
  choice: mencionó alimentos entre las fuentes de deleite en la resurrección
  alternative: mencionó manjares como parte de los placeres de la resurrección
  rationale: La formulación conserva la afirmación concreta del testigo sin interpretarla como enseñanza normativa ni determinar si el lenguaje es literal o figurado.
- issue: Relación cronológica de Papías con Juan
  choice: floreció en los días del santo evangelista Juan
  alternative: vivió en tiempos del santo evangelista Juan
  rationale: Se preserva la afirmación historiográfica del testigo y su tensión cronológica, sin convertirla en una afirmación más específica de contacto personal.
- issue: Identidad de Juan
  choice: el santo evangelista Juan
  alternative: san Juan el Evangelista
  rationale: Sigue la identificación explícita del testigo sin inferir otros datos acerca de cuál Juan se pretende designar.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservan la atribución cautelosa «según supongo» y los puntos suspensivos del testigo. El borrador es provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa de la fuente griega o latina sigue pendiente.
