base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: es
  text: 'Papías, oyente de Juan y obispo de Hierápolis, en Asia, escribió solamente cinco libros, a los que tituló Exposición de los discursos del Señor. En el prefacio de esta obra afirma que no sigue afirmaciones recogidas indiscriminadamente, sino que toma a los apóstoles como autoridades, y dice:


    «Yo solía preguntar qué habían dicho Andrés, Pedro, Felipe, Tomás, Santiago, Juan, Mateo o cualquier otro de los discípulos del Señor, y qué estaban diciendo Aristión y Juan el Anciano, discípulos del Señor. Porque la lectura de libros no me aprovecha tanto como la voz viva que sigue resonando claramente hasta el día de hoy por medio de sus autores».[a]


    De esto queda claro que en su misma lista de nombres hay un Juan contado entre los apóstoles y otro, Juan el Anciano, a quien menciona después de Aristión. Hemos señalado este hecho debido a la afirmación anterior, que consignamos apoyándonos en la autoridad de muchísimos: que las dos últimas cartas de Juan no son obra del apóstol, sino del Anciano. Se dice que este Papías difundió la tradición judía de un milenio; lo siguen Ireneo, Apolinar y otros, quienes afirman que, después de la resurrección, el Señor reinará corporalmente con los santos.[b]


    JERÓNIMO, Sobre los hombres ilustres 18.


    VIII


    Además, me ha llegado el falso rumor de que yo traduje los libros de Josefo y los escritos de Papías y Policarpo; pero no tengo ni el tiempo ni las fuerzas para verter obras como estas a otra lengua con una elegancia equivalente.


    JERÓNIMO, A Lucinio, Carta 71 (28), capítulo 5.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La cita de Papías se conserva aquí por medio de Jerónimo. El testimonio suministrado presenta daños de escaneo, y esta redacción repara palabras evidentemente truncadas. La frase final también puede entenderse de manera más general como «la voz viva y permanente», sin la referencia explícita a «sus autores».
    reason: Advertir que el texto base es un testimonio inglés provisional y que la cláusula final requiere cotejo directo con el latín de Jerónimo y, cuando corresponda, con la tradición griega.
  - marker: b
    text: «Corporalmente» traduce la expresión del testimonio «en la carne» y no determina por sí sola todos los detalles de la doctrina milenaria atribuida a Papías.
    reason: Conservar la formulación teológica sin ampliarla ni hacerla coincidir con un sistema doctrinal posterior.
lexical_decisions:
- source_word: hearer of John
  choice: oyente de Juan
  rationale: Conserva la formulación histórica sin convertirla en la afirmación más específica de que fue discípulo directo.
- source_word: promiscuous statements
  choice: afirmaciones recogidas indiscriminadamente
  rationale: Expresa el sentido antiguo de material no seleccionado, evitando la acepción sexual moderna de «promiscuo».
- source_word: the Elder John
  choice: Juan el Anciano
  rationale: Mantiene el título distintivo y la posible identificación separada respecto del Juan mencionado entre los apóstoles.
- source_word: living voice
  choice: la voz viva
  rationale: Conserva la conocida contraposición entre el testimonio oral vivo y los libros.
- source_word: in the flesh
  choice: corporalmente
  rationale: Comunica un reinado en condición corporal sin añadir una interpretación denominacional.
- source_word: corresponding elegance
  choice: una elegancia equivalente
  rationale: Refleja la idea de reproducir en la lengua receptora una calidad estilística correspondiente.
theological_decisions:
- issue: Identidad de los dos Juanes
  choice: Se conserva la distinción argumentada por Jerónimo entre un Juan contado entre los apóstoles y Juan el Anciano.
  alternative: Identificarlos como una sola persona o declarar como hecho que eran dos autores distintos.
  rationale: El pasaje presenta una inferencia antigua; la traducción no debe resolver por sí sola la cuestión histórica.
- issue: Autoría de las dos últimas cartas de Juan
  choice: Se presenta como una afirmación transmitida por Jerónimo y apoyada, según él, por muchos.
  alternative: Afirmarla directamente como conclusión editorial moderna.
  rationale: Preserva la atribución y el grado de certeza del testimonio.
- issue: Milenio y reinado del Señor
  choice: «tradición judía de un milenio» y «reinará corporalmente con los santos».
  alternative: Introducir términos doctrinales posteriores como «premilenialismo» o explicar la naturaleza exacta del reino.
  rationale: Evita importar categorías confesionales posteriores y conserva la tensión del testimonio.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se repararon únicamente truncamientos evidentes del testimonio escaneado. Los títulos de obras se presentan en español y los nombres propios siguen formas tradicionales ampliamente reconocibles. Borrador necesariamente provisional: el material aportado es una traducción inglesa de dominio público y la revisión directa de las fuentes griega y latina está pendiente.'
