review_pass:
  verdict: revise
  source_fidelity: La traducción refleja con precisión general el testimonio inglés suministrado y mantiene debidamente las atribuciones de Jerónimo. Sin embargo, «corporalmente» interpreta y atenúa la expresión explícita «in the flesh / en la carne»; conviene conservar esta última para una equivalencia más directa y para no delimitar de antemano su alcance. También se ajusta la cláusula sobre la «voz viva» para no presentar «autores» como una interpretación inequívoca del texto editorialmente dañado.
  naturalness: 'El español es natural, sobrio y adecuado para un texto patrístico. Se hacen ajustes menores de fluidez: «De ello queda claro», «tener por autoridades» y «elegancia correspondiente».'
  terminology: Se conservan «oyente», «Juan el Anciano», «discípulos», «milenio» y «en la carne» sin imponer conclusiones sobre la identidad de Juan, la autoría de las epístolas ni la doctrina milenaria. «En la carne» mantiene el término histórico-teológico de la fuente.
  issues:
  - severity: medium
    issue: «Corporalmente» en lugar de «en la carne»
    rationale: El testimonio inglés dice explícitamente «in the flesh». Aunque «corporalmente» es una paráfrasis posible, «en la carne» conserva mejor la formulación y su deliberada falta de especificación doctrinal.
  - severity: low
    issue: La formulación «por medio de sus autores» resuelve de modo demasiado definido la cláusula editorialmente incierta «in (the persons of) authors»
    rationale: El testimonio suministrado marca una cualificación editorial. «En quienes la transmiten», con nota, comunica el sentido sin hacer de «autores» una identificación literal e inequívoca.
  revised_text: 'Papías, oyente de Juan y obispo de Hierápolis, en Asia, escribió solamente cinco libros, a los que tituló Exposición de los discursos del Señor. En el prefacio de esta obra afirma que no sigue afirmaciones recogidas indiscriminadamente, sino que tiene a los apóstoles por autoridades, y dice:


    «Yo solía preguntar qué habían dicho Andrés, Pedro, Felipe, Tomás, Santiago, Juan, Mateo o cualquier otro de los discípulos del Señor, y qué estaban diciendo Aristión y Juan el Anciano, discípulos del Señor. Porque la lectura de libros no me aprovecha tanto como la voz viva, que sigue resonando claramente hasta el día de hoy en quienes la transmiten».[a]


    De ello queda claro que en su misma lista de nombres hay un Juan contado entre los apóstoles y otro, Juan el Anciano, a quien menciona después de Aristión. Hemos señalado este hecho debido a la afirmación anterior, que consignamos apoyándonos en la autoridad de muchísimos: que las dos últimas cartas de Juan no son obra del apóstol, sino del Anciano. Se dice que este Papías difundió la tradición judía de un milenio; lo siguen Ireneo, Apolinar y otros, quienes afirman que, después de la resurrección, el Señor reinará en la carne con los santos.[b]


    JERÓNIMO, Sobre los hombres ilustres 18.


    VIII


    Además, me ha llegado el falso rumor de que yo traduje los libros de Josefo y los escritos de Papías y Policarpo; pero no tengo ni el tiempo ni las fuerzas para verter obras como estas a otra lengua con una elegancia correspondiente.


    JERÓNIMO, A Lucinio, Carta 71 (28), capítulo 5.'
  revised_footnotes:
  - marker: a
    text: La cita de Papías se conserva aquí por medio de Jerónimo. El testimonio suministrado presenta daños de escaneo, y esta redacción repara palabras evidentemente truncadas. La cláusula final contiene una cualificación editorial en el testimonio («en las personas de los autores»); «en quienes la transmiten» ofrece un sentido prudente y requiere cotejo con el latín de Jerónimo y, cuando corresponda, con la tradición griega.
    reason: Advertir que el texto base es un testimonio inglés provisional y que la cláusula final requiere cotejo directo con el latín de Jerónimo y, cuando corresponda, con la tradición griega.
  - marker: b
    text: «En la carne» traduce directamente la expresión del testimonio y no determina por sí sola todos los detalles de la doctrina milenaria atribuida a Papías.
    reason: Conservar la formulación teológica sin ampliarla ni hacerla coincidir con un sistema doctrinal posterior.
  revision_rationale: La revisión conserva el contenido y las atribuciones del borrador, pero sustituye una paráfrasis doctrinalmente más estrecha por «en la carne», que reproduce la expresión del testimonio. Asimismo, trata con mayor cautela la cláusula final de la cita de Papías, marcada como editorialmente problemática en el testimonio inglés.
