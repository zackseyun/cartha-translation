    «Yo solía preguntar qué habían dicho Andrés, Pedro, Felipe, Tomás, Santiago, Juan, Mateo o cualquier otro de los discípulos del Señor, y qué estaban diciendo Aristión y Juan el Anciano, discípulos del Señor. Porque la lectura de libros no me aprovecha tanto como la voz viva, que sigue resonando claramente hasta el día de hoy, (en las personas de) los autores».[a]


    De esto queda claro que en su misma lista de nombres hay un Juan contado entre los apóstoles y otro, Juan el Anciano, a quien menciona después de Aristión. Hemos señalado este hecho debido a la afirmación anterior, que consignamos apoyándonos en la autoridad de muchísimos: que las dos últimas cartas de Juan no son obra del apóstol, sino del Anciano. Se dice que este Papías difundió la tradición judía de un milenio; lo siguen Ireneo, Apolinar y otros, quienes afirman que, después de la resurrección, el Señor reinará en la carne con los santos.[b]


    JERÓNIMO, Sobre los hombres ilustres 18.


