base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: es
  text: '**Fragmento IV[a]**


    Y cada uno se fue a su propia casa, pero Jesús se fue al monte de los Olivos. Al amanecer volvió al templo, [y todo el pueblo acudió a él; y él se sentó y les enseñaba]. Entonces los escribas y los fariseos llevaron a una mujer sorprendida en adulterio y, poniéndola en medio, le dijeron:


    —Maestro, esta mujer fue sorprendida cometiendo adulterio, en el acto mismo. En la Ley, Moisés nos mandó apedrear a mujeres como esta. Tú, pues, ¿qué dices?


    [Decían esto para ponerlo a prueba, a fin de tener de qué acusarlo.]


    Pero Jesús se inclinó y escribió en el suelo con el dedo. Como ellos seguían interrogándolo, él se enderezó y les dijo:


    —El que de ustedes esté sin pecado sea el primero en arrojar una piedra contra ella.


    Luego volvió a inclinarse y escribió en el suelo. Al oírlo, fueron saliendo uno por uno, comenzando por los de más edad. Jesús quedó solo con la mujer, que seguía allí en medio. Entonces se enderezó y le preguntó:


    —Mujer, ¿dónde están? ¿Nadie te condenó?


    Ella respondió:


    —Nadie, Señor.


    Jesús le dijo:


    —Tampoco yo te condeno. Vete y, de ahora en adelante, no peques más.


    *PERICOPE ADULTERAE*; véanse Westcott y Hort, *The New Testament in the Original Greek*, I, p. 241; II, pp. 82 ss., 91; Lightfoot, *Essays on Supernatural Religion*, p. 203 ss.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Está pendiente la revisión directa de los testimonios griegos o latinos. Los corchetes del texto reproducen las señales editoriales de pasajes restaurados o inciertos presentes en ese testimonio; la referencia bibliográfica final también se conserva del original impreso.
    reason: La fuente antigua no fue proporcionada en su lengua original, por lo que es necesario declarar la base provisional y explicar las marcas editoriales conservadas.
lexical_decisions:
- source_word: Master
  choice: Maestro
  rationale: Es el equivalente natural y tradicional en este contexto de enseñanza, sin añadir un título doctrinal más específico.
- source_word: taken in adultery, in the very act
  choice: sorprendida cometiendo adulterio, en el acto mismo
  rationale: Conserva el énfasis del testimonio en que fue descubierta durante el acto, con una formulación clara en español actual.
- source_word: without sin
  choice: sin pecado
  rationale: Mantiene la formulación amplia del testimonio y no la restringe al pecado concreto de adulterio.
- source_word: condemn
  choice: condenar
  rationale: Preserva el lenguaje judicial y moral del pasaje, así como la repetición deliberada entre la pregunta y la respuesta.
- source_word: beginning from the eldest
  choice: comenzando por los de más edad
  rationale: Evita que «ancianos» se interprete como un cargo religioso y conserva la referencia comparativa a la edad.
- source_word: sin no more
  choice: no peques más
  rationale: Expresa de manera directa el imperativo sin debilitarlo ni convertirlo en una afirmación sobre impecabilidad futura.
theological_decisions:
- issue: Alcance de «sin pecado»
  choice: Se conserva la expresión general «sin pecado».
  alternative: «Que no haya cometido este pecado» o «que no tenga culpa en este asunto».
  rationale: El testimonio suministrado no limita explícitamente el pecado al adulterio ni a este caso judicial; restringirlo resolvería una ambigüedad con implicaciones teológicas.
- issue: Relación entre no condenar y el llamado a dejar el pecado
  choice: Se mantienen juntas y sin explicación añadida las palabras «Tampoco yo te condeno» y «no peques más».
  alternative: Parafrasear la primera como absolución jurídica o la segunda como condición del perdón.
  rationale: El texto yuxtapone misericordia y exhortación moral sin explicar su relación sistemática; la traducción debe preservar esa tensión.
- issue: Tratamiento de las secciones entre corchetes
  choice: Se conservan los corchetes del testimonio proporcionado.
  alternative: Integrar las palabras sin marcas o suprimirlas.
  rationale: Las marcas señalan texto restaurado o incierto en el testimonio editorial y no deben desaparecer mientras esté pendiente la revisión directa de las fuentes griegas o latinas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para la segunda persona plural y se conserva «Ley» con mayúscula cuando designa la Ley de Moisés. El diálogo se presenta con raya para facilitar la lectura. No se moderniza la designación editorial latina *PERICOPE ADULTERAE* ni los títulos bibliográficos citados.
