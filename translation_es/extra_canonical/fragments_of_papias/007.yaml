base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: es
  text: 'En cuanto a la inspiración del libro (es decir, el Apocal—[a] quiero decir, el Divino) y Cirilo, así como hombres de una generación anterior, [¿Papías?],[b] Ireneo, Metodio e Hipólito, dan testimonio de su autenticidad.


    ANDRÉS DE CESAREA, Prefacio al Apocalipsis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El testimonio inglés suministrado presenta aquí una laguna: se interrumpe después de «Apocal—» y se reanuda con «quiero decir, el Divino». No se ha intentado reconstruir el texto ausente.'
    reason: Hacer visible una pérdida textual sustancial y evitar una reconstrucción no verificada.
  - marker: b
    text: «Papías» es una restitución probable de un nombre deteriorado en el testimonio suministrado; la lectura debe confirmarse mediante revisión directa de la fuente antigua.
    reason: Señalar la incertidumbre textual que afecta al nombre propio.
lexical_decisions:
- source_word: inspiration
  choice: inspiración
  rationale: Conserva el término teológico del testimonio inglés sin precisar más de lo que permite la fuente disponible.
- source_word: genuineness
  choice: autenticidad
  rationale: Expresa que los autores citados avalan el carácter genuino del libro, sin convertir la afirmación en una declaración más específica sobre autoría o canonicidad.
- source_word: men of an older generation
  choice: hombres de una generación anterior
  rationale: Traducción natural que mantiene la comparación cronológica del testimonio.
- source_word: Apocalypse
  choice: Apocalipsis
  rationale: Es el título tradicional y ampliamente comprensible del libro en español.
theological_decisions:
- issue: Naturaleza exacta del testimonio sobre el Apocalipsis
  choice: Conservar «inspiración» y «autenticidad» como afirmaciones distintas
  alternative: Unificarlas como una afirmación explícita de canonicidad o autoría apostólica
  rationale: El testimonio disponible distingue ambos conceptos y no permite identificar sin ambigüedad la autenticidad con una doctrina más concreta.
- issue: Texto perdido entre «Apocal—» y «quiero decir, el Divino»
  choice: Mantener visible la interrupción y explicarla en nota
  alternative: Reconstruir la probable redacción completa a partir de otras ediciones
  rationale: La revisión directa del texto griego o latino está pendiente, y el testimonio suministrado no contiene las palabras necesarias para una reconstrucción segura.
- issue: Identificación de Papías en un pasaje corrupto
  choice: Presentar «¿Papías?» entre corchetes y con interrogación
  alternative: Imprimir «Papías» sin indicación de duda
  rationale: La lectura parece probable por el contexto y por la forma del testimonio consultivo, pero el texto suministrado está dañado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se normalizaron los nombres propios evidentes («Ireneo» y «Andrés de Cesarea»), pero se preservaron la laguna y la incertidumbre del testimonio en vez de completar tácitamente la oración.
