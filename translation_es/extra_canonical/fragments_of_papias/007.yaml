review_pass:
  verdict: revise
  source_fidelity: 'La redacción propuesta altera la estructura del testimonio: «el Divino» no funciona como calificativo del Apocalipsis, sino que refleja la corrupción del nombre Dionisio; además, la aclaración «me refiero al Apocalipsis» debe cerrar antes de la lista de testigos. La secuencia Dionisio, Cirilo, Papías, Ireneo, Metodio e Hipólito concuerda con la forma reconocible del pasaje transmitido bajo el nombre de Andrés de Cesarea. Se conserva una nota porque el testimonio inglés provisto está materialmente dañado y la revisión directa de la fuente antigua sigue pendiente.'
  naturalness: La versión revisada emplea una construcción española fluida y conserva el registro sobrio de una atribución patrística. Los incisos con rayas aclaran el referente de «el libro» sin introducir una lectura doctrinal adicional.
  terminology: «Inspiración» y «autenticidad» son adecuados y mantienen diferenciadas las dos afirmaciones del pasaje. Se normalizan los nombres como Dionisio, Cirilo, Papías, Ireneo, Metodio e Hipólito; «Apocalipsis» conserva el título tradicional.
  issues:
  - severity: high
    issue: «el Divino» se ha traducido como si fuera parte del sintagma referido al libro.
    rationale: En el testimonio, «Divine» es una corrupción evidente en la cadena de nombres y corresponde a Dionisio; tratarlo como «el Divino» deja una oración sintácticamente anómala y omite a un testigo.
  - severity: high
    issue: La aclaración parentética sobre el Apocalipsis queda incompleta y mal integrada.
    rationale: «Apocal—[a] quiero decir, el Divino» no reproduce una construcción inteligible. La aclaración debe expresar «me refiero al Apocalipsis» y anteceder a los nombres.
  - severity: medium
    issue: Papías se presenta con interrogación editorial innecesaria.
    rationale: Aunque el testimonio suministrado está deteriorado, la secuencia de autoridades y la lectura contextual permiten normalizar Papías; la incertidumbre del soporte se explica mejor en una nota general que no convierta el nombre en una duda dentro del texto.
  revised_text: 'En cuanto a la inspiración del libro —me refiero al Apocalipsis—, Dionisio y Cirilo, así como hombres de una generación anterior, Papías, Ireneo, Metodio e Hipólito, dan testimonio de su autenticidad.[a]


    ANDRÉS DE CESAREA, prefacio al Apocalipsis.'
  revised_footnotes:
  - marker: a
    text: 'El testimonio inglés suministrado está deteriorado en esta oración: fragmenta la referencia al Apocalipsis y corrompe algunos nombres. La presente redacción normaliza la secuencia contextual de testigos (Dionisio, Cirilo, Papías, Ireneo, Metodio e Hipólito); debe confirmarse con una revisión directa de la fuente griega o latina.'
    reason: Hace visible la limitación del testimonio de trabajo sin conservar en el texto español una corrupción que impide entender la oración.
  revision_rationale: Se restituye una sintaxis coherente y la lista de testigos que el testimonio corrompido deja entrever, sin ampliar el alcance de «inspiración» ni de «autenticidad». La nota documenta que esta normalización requiere cotejo posterior con la fuente antigua.
