review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva correctamente la estructura polémica: Esteban Gobaro no sigue a Papías ni a Ireneo en la afirmación atribuida a ellos sobre el reino de los cielos. Mantiene sin atenuación «consistirá» y «alimentos materiales», conforme al testimonio inglés. Dado que la revisión directa del griego/latín está pendiente, la nota de provisionalidad sigue siendo necesaria.'
  naturalness: El borrador es en general natural y de registro adecuado. Sin embargo, «cuando afirman» puede leerse como una circunstancia temporal de «sigue»; «en cuanto a afirmar que» vincula de forma más clara la discrepancia de Esteban con la proposición atribuida a Papías e Ireneo.
  terminology: «Reino de los cielos», «Hierápolis», «Ireneo», «Focio» y «Biblioteca» son adecuados en español neutral latinoamericano. «Sobre Esteban Gobaro» es una formulación bibliográfica más idiomática que «acerca de Esteban Gobaro».
  issues:
  - severity: low
    issue: Ambigüedad sintáctica en «cuando afirman».
    rationale: La frase puede entenderse como si Esteban dejara de seguirlos en un momento temporal. La fuente indica que el desacuerdo se refiere precisamente a lo que Papías e Ireneo dicen.
  - severity: low
    issue: La nota bibliográfica puede ser más precisa respecto de la normalización.
    rationale: La corrección de «Aibliotheca» a «Bibliotheca» es una normalización de la errata del testimonio; las formas españolas de los nombres y la traducción del título son decisiones de traducción, no la misma clase de corrección tipográfica.
  revised_text: 'Tampoco Esteban sigue a Papías, obispo y mártir de Hierápolis, ni a Ireneo, el santo obispo de Lyon, en cuanto a afirmar que el reino de los cielos consistirá en disfrutar de ciertos alimentos materiales.[a]


    Focio, Biblioteca 232, sobre Esteban Gobaro.[b]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Aún está pendiente la revisión directa del texto antiguo transmitido por Focio.
    reason: La ficha de fuente indica que todavía no se ha completado la revisión en la lengua original; la nota evita presentar como definitiva una traducción indirecta.
  - marker: b
    text: El testimonio impreso presenta la forma «Aibliotheca», que aquí se normaliza como «Bibliotheca»; el título se traduce como «Biblioteca». Los nombres propios se presentan en sus formas españolas convencionales.
    reason: Distingue la corrección de una errata de las decisiones de traducción y adaptación de nombres.
  revision_rationale: Se ajusta únicamente la sintaxis para que quede inequívoco que la cláusula final expresa el punto doctrinal en el que Esteban Gobaro no sigue a Papías e Ireneo. Se conserva la fuerza de la afirmación y no se introduce interpretación doctrinal. También se mejora la formulación de la atribución y se precisa la nota sobre la errata editorial.
