review_pass:
  verdict: revise
  source_fidelity: La traducción conserva correctamente la negación, la relación de Esteban con Papías e Ireneo, la atribución plural de la afirmación y el sentido fuerte de «will consist in». Sin embargo, el orden «Tampoco sigue Esteban» es menos claro que el del testimonio, cuyo inciso identifica expresamente a Esteban como sujeto de «sigue».
  naturalness: «Tampoco Esteban sigue a...» es más natural y deja inequívoca la estructura. «cuando estos afirman» evita que el plural «afirman» pueda asociarse de manera momentánea con Esteban y conserva que Papías e Ireneo son los referidos.
  terminology: «Reino de los cielos», «Papías», «Hierápolis», «Ireneo», «Focio» y «Biblioteca» son adecuados en español latinoamericano. «Alimentos materiales» reproduce el contraste del testimonio, aunque resulte deliberadamente marcado; no conviene suavizarlo ni especificarlo como «físicos» o «terrenales».
  issues:
  - severity: low
    issue: Orden y alcance sintáctico del sujeto
    rationale: «Tampoco sigue Esteban a Papías» puede leerse, pero desplaza el sujeto respecto del inciso inglés y hace menos transparente la oposición. «Tampoco Esteban sigue...» refleja con mayor claridad «Nor again (does Stephanus follow)...».
  - severity: low
    issue: Referencia del verbo «afirman»
    rationale: El plural ya apunta a Papías e Ireneo, pero «cuando estos afirman» elimina una posible vacilación de lectura sin añadir contenido.
  revised_text: 'Tampoco Esteban sigue a Papías, obispo y mártir de Hierápolis, ni a Ireneo, el santo obispo de Lyon, cuando estos afirman que el reino de los cielos consistirá en disfrutar de ciertos alimentos materiales.[a]


    Focio, Biblioteca 232, sobre Esteban Gobaro.[b]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Aún está pendiente la revisión directa del texto antiguo transmitido por Focio.
    reason: La ficha de fuente indica que no se ha completado la revisión en la lengua original; la nota evita presentar como definitiva una traducción indirecta.
  - marker: b
    text: El testimonio impreso dice por error «Aibliotheca»; aquí se normaliza como «Bibliotheca» («Biblioteca»). También se normalizan en español los nombres Ireneo, Focio y Esteban Gobaro.
    reason: Documenta las correcciones tipográficas y la adaptación convencional de nombres propios sin alterar el contenido del fragmento.
  revision_rationale: 'Se hacen únicamente ajustes sintácticos seguros: se adelanta «Esteban» para reflejar con claridad el inciso parentético del testimonio y se explicita mediante «estos» que Papías e Ireneo son los que sostienen la afirmación. Se mantienen el carácter provisional, la formulación fuerte sobre la constitución del reino y las notas existentes. La revisión directa del griego/latín sigue siendo necesaria.'
