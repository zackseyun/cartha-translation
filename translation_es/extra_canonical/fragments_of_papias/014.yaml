base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: es
  text: 'Tampoco sigue Esteban a Papías, obispo y mártir de Hierápolis, ni a Ireneo, el santo obispo de Lyon, cuando afirman que el reino de los cielos consistirá en disfrutar de ciertos alimentos materiales.[a]


    Focio, Biblioteca 232, acerca de Esteban Gobaro.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Aún está pendiente la revisión directa del texto antiguo transmitido por Focio.
    reason: La ficha de fuente indica que no se ha completado la revisión en la lengua original; la nota evita presentar como definitiva una traducción indirecta.
  - marker: b
    text: El testimonio impreso dice por error «Aibliotheca»; aquí se normaliza como «Bibliotheca» («Biblioteca»). También se normalizan en español los nombres Ireneo, Focio y Esteban Gobaro.
    reason: Documenta las correcciones tipográficas y la adaptación convencional de nombres propios sin alterar el contenido del fragmento.
lexical_decisions:
- source_word: Stephanus
  choice: Esteban
  rationale: Se emplea la forma española tradicional del nombre griego; la identificación como Esteban Gobaro se conserva en la atribución.
- source_word: kingdom of heaven
  choice: reino de los cielos
  rationale: Es la formulación bíblica tradicional y reproduce sin reinterpretación la expresión transmitida por el testimonio inglés.
- source_word: enjoyment of certain material foods
  choice: disfrutar de ciertos alimentos materiales
  rationale: Conserva el contraste entre lo celestial y lo material sin precisar cuáles serían esos alimentos ni añadir una valoración no expresada.
- source_word: Bibliotheca
  choice: Biblioteca
  rationale: Se traduce el título de la obra de Focio y se corrige la errata evidente «Aibliotheca» del testimonio impreso.
theological_decisions:
- issue: Carácter material de la consumación del reino
  choice: «consistirá en disfrutar de ciertos alimentos materiales»
  alternative: «incluirá el disfrute de ciertos alimentos materiales»
  rationale: Se conserva la afirmación fuerte del testimonio («will consist in») y su tensión teológica, sin suavizarla ni armonizarla con una postura doctrinal posterior.
- issue: Referencia de «cuando afirman»
  choice: Papías e Ireneo son quienes hacen la afirmación
  alternative: Hacer explícito que Focio atribuye la afirmación a ambos
  rationale: La sintaxis del testimonio vincula el verbo plural con Papías e Ireneo; la traducción mantiene esa atribución sin afirmar que se hayan conservado sus palabras exactas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la estructura polémica de la oración, pero se evita el calco rígido del paréntesis inglés mediante «Tampoco sigue Esteban…». El borrador es necesariamente provisional porque la evidencia suministrada es un testimonio inglés y la revisión del griego o latín está pendiente.
