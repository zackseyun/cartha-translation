    reason: Preserva visiblemente la incertidumbre de una laguna del testimonio.
lexical_decisions:
- source_word: lived on
  choice: siguió con vida
  rationale: Expresa de manera natural que Judas sobrevivió al ahorcamiento, sin añadir cuánto tiempo vivió.
- source_word: having been cut down
  choice: pues lo bajaron
  rationale: En el contexto de un ahorcamiento, comunica que fue descolgado; evita el posible sentido moderno de «cortar» a la persona.
- source_word: falling headlong
  choice: al caer de cabeza
  rationale: Conserva la dirección violenta de la caída en lenguaje actual y claro.
- source_word: burst asunder in the midst
  choice: se partió por la mitad
  rationale: Mantiene la imagen corporal explícita del testimonio sin eufemismos.
- source_word: Oracles of the Lord
  choice: oráculos del Señor
  rationale: Conserva el término técnico tradicional y su posible amplitud semántica, en vez de reducirlo a «dichos» o «palabras».
- source_word: walked about in this world
  choice: anduvo por este mundo
  rationale: Reproduce la idea de que Judas continuó viviendo y desplazándose, con una expresión digna y natural.
- source_word: impiety
  choice: impiedad
  rationale: Mantiene el juicio religioso general del texto sin imponer una categoría doctrinal más específica.
- source_word: the mass of his head merely
  choice: el volumen de su cabeza
  rationale: «Volumen» expresa el tamaño extraordinario señalado por la comparación; la nota advierte que el pasaje está dañado.
- source_word: looking through an instrument
  choice: mirando con un instrumento
  rationale: No especifica qué instrumento médico era, ya que el testimonio suministrado tampoco lo determina.
theological_decisions:
- issue: Relación entre la muerte de Judas en Mateo y el relato de Hechos
  choice: Conservar la afirmación de Apolinar de que Judas sobrevivió inicialmente al ahorcamiento y después cayó y se abrió.
  alternative: Armonizar o reformular el relato para que coincida explícitamente con una reconstrucción doctrinal determinada.
  rationale: El fragmento propone su propia conciliación de los relatos; la traducción debe presentarla fielmente como afirmación de Apolinar, sin adoptarla como explicación editorial ni eliminar la tensión.
- issue: Identidad de «Juan»
  choice: Traducir simplemente «discípulo de Juan».
  alternative: Identificarlo como Juan el apóstol, Juan el anciano u otra figura concreta.
  rationale: El testimonio suministrado no resuelve la identidad; especificarla eliminaría una ambigüedad histórica genuina.
- issue: Valor del relato sobre Judas
  choice: Mantener «ejemplo terrible de impiedad» como valoración atribuida al fragmento.
  alternative: Convertirlo en una declaración doctrinal general sobre el castigo divino.
  rationale: El texto formula un juicio moral, pero no explica explícitamente la causalidad teológica de la condición corporal descrita.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la crudeza corporal, la estructura de cita dentro de cita y la elipsis final. Se modernizó la sintaxis sin suavizar las afirmaciones del fragmento. El uso de «Apolinar» sigue la forma española habitual de Apollinarius; la referencia bibliográfica latina se mantuvo sin traducir.
