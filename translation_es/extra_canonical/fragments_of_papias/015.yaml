base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: es
  text: 'Apolinar:[a] «Judas no murió ahorcado, sino que siguió con vida, pues lo bajaron antes de que se asfixiara. Los Hechos de los Apóstoles también lo muestran: al caer de cabeza, se partió por la mitad y se le salieron todas las entrañas. Papías, discípulo de Juan, relata este hecho con mayor claridad en el libro cuarto de la Exposición de los oráculos del Señor, de la siguiente manera:


    »Judas anduvo por este mundo como un ejemplo terrible de impiedad. Su cuerpo se hinchó hasta tal punto que él no podía pasar por donde un carro pasaba con facilidad; es más, ni siquiera cabía el volumen de su cabeza.[b] Dicen que sus párpados se hincharon tanto[c] que no podía ver la luz en absoluto. En cuanto a sus ojos, ni siquiera un médico podía verlos mirando con un instrumento, pues se habían hundido muchísimo bajo la superficie…»


    Compilado a partir de Cramer, Catena ad Acta SS. Apost. (1838), p. 12 y ss., y de otras fuentes.


    [a] Esta traducción es provisional, pues se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de las fuentes antiguas griegas o latinas.

    [b] El testimonio suministrado está dañado en este pasaje. La traducción reproduce el sentido probable de la oración sin reconstruir palabras adicionales como si fueran seguras.

    [c] Hay una laguna en el testimonio suministrado después de «tanto»; el contexto permite entender el grado extremo de la hinchazón, pero no recuperar con certeza las palabras perdidas.'
