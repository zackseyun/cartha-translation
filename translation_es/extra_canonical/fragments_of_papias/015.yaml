review_pass:
  verdict: revise
  source_fidelity: 'La versión transmite fielmente la atribución a Apolinar, su propuesta de que Judas sobrevivió inicialmente al ahorcamiento y la posterior referencia a Hechos. Sin embargo, «se partió por la mitad» atenúa o altera levemente el sentido corporal de «burst asunder in the midst», que describe que se reventó o se abrió por el medio. Además, el primer pasaje corrupto debe mantenerse expresamente incierto: el testigo inglés auditado marca «[text unclear]».'
  naturalness: El español es en general claro, moderno y de registro apropiado. Se corrige la apertura tipográfica de la cita de Papías, que aparece como una comilla de cierre («»), y se ajustan algunas formulaciones para que la imagen del texto sea natural sin suavizarla.
  terminology: «Oráculos del Señor», «impiedad», «entrañas» y «discípulo de Juan» son elecciones adecuadas y conservadoras. «Apolinar» es la forma española normal. Se mantiene sin resolver la identidad de Juan y no se armoniza editorialmente la tradición sobre Judas.
  issues:
  - severity: medium
    issue: El primer lugar textual dañado se presenta como si estuviera plenamente reconstruido.
    rationale: El English POB marca «where a waggon [text unclear] pass with ease». Aunque la comparación general es inteligible, el texto español debe señalizar la oscuridad en el punto correspondiente, en vez de ofrecer «por donde un carro pasaba» sin indicación en el cuerpo.
  - severity: medium
    issue: «Se partió por la mitad» no expresa con suficiente precisión «burst asunder in the midst».
    rationale: La expresión inglesa describe una ruptura violenta o reventamiento por el medio, no simplemente una partición. «Se reventó por el medio» conserva mejor la crudeza y el sentido.
  - severity: low
    issue: La cita de Papías se abre con una comilla de cierre.
    rationale: Después de «de la siguiente manera», el signo » es tipográficamente incorrecto como apertura. Una cita en bloque introducida por raya evita la confusión de comillas anidadas.
  revised_text: 'Apolinar:[a] «Judas no murió ahorcado, sino que siguió con vida, pues lo bajaron antes de que se asfixiara. Los Hechos de los Apóstoles también lo muestran: al caer de cabeza, se reventó por el medio y se derramaron todas sus entrañas. Papías, discípulo de Juan, relata este hecho con mayor claridad en el libro cuarto de la Exposición de los oráculos del Señor, de la siguiente manera:


    —Judas anduvo por este mundo como un ejemplo terrible de impiedad. Su cuerpo se hinchó hasta tal punto que no podía pasar por donde un carro pasaba con facilidad; es más, ni siquiera podía pasar solo el volumen de su cabeza.[b] Dicen que sus párpados se hincharon hasta tal punto[c] que no podía ver la luz en absoluto. En cuanto a sus ojos, ni siquiera un médico podía verlos mirando con un instrumento, pues se habían hundido muchísimo bajo la superficie…»


    Compilado a partir de Cramer, Catena ad Acta SS. Apost. (1838), p. 12 y ss., y de otras fuentes.


    [a] Esta traducción es provisional, pues se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de las fuentes antiguas griegas o latinas.


    [b] El testimonio suministrado está dañado en la comparación con el carro y en la expresión relativa a la cabeza. La traducción reproduce el sentido probable sin presentar como seguras palabras que no pueden recuperarse con certeza.


    [c] Hay una laguna o daño textual en el testimonio suministrado en la expresión de grado después de «hasta tal punto». El contexto indica una hinchazón extrema, pero no permite recuperar con certeza las palabras perdidas.'
  revised_footnotes:
  - marker: a
    text: Esta traducción es provisional, pues se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de las fuentes antiguas griegas o latinas.
    reason: Informa transparentemente que la revisión se realiza sobre el testigo inglés suministrado y no atribuye una certeza indebida a decisiones pendientes de cotejo con las fuentes antiguas.
  - marker: b
    text: El testimonio suministrado está dañado en la comparación con el carro y en la expresión relativa a la cabeza. La traducción reproduce el sentido probable sin presentar como seguras palabras que no pueden recuperarse con certeza.
    reason: El English POB señala explícitamente una zona de texto oscuro en esta comparación; la nota conserva esa incertidumbre.
  - marker: c
    text: Hay una laguna o daño textual en el testimonio suministrado en la expresión de grado después de «hasta tal punto». El contexto indica una hinchazón extrema, pero no permite recuperar con certeza las palabras perdidas.
    reason: Conserva la incertidumbre que el English POB representa mediante «[lacuna]», sin completar editorialmente el texto.
  revision_rationale: Se conserva la estructura, las atribuciones y las ambigüedades históricas del borrador, pero se corrige la puntuación de la cita anidada, se traduce con mayor precisión la ruptura corporal descrita y se hace visible la incertidumbre del primer lugar corrupto, tal como exige el rastro de auditoría inglés.
