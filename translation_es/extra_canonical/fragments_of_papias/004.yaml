  naturalness: El registro es claro, moderno y apropiado. Se ajusta «los antiguos padres» a «los Padres antiguos», formulación más natural para el sentido patrístico sin convertir «católicas» en una etiqueta confesional.
  terminology: «Juan el Teólogo», «Oráculos del Señor», «el Anciano», «milenio» y «le correspondió en suerte» son opciones fieles y naturales. Se conservan «epístolas universales» y la distinción entre los dos Juanes sin resolver cuestiones debatidas.
  issues:
  - severity: medium
    issue: Se suprime la duda editorial en torno a «Éfeso» en la cita eusebiana.
    rationale: El testigo ინგლის inglés presenta «[E]phesus[?]». La traducción debe preservar el signo de incertidumbre, no presentar el topónimo como plenamente seguro.
  - severity: medium
    issue: La frase relativa a Ireneo queda elíptica e incompleta.
    rationale: El testigo restaurado dice que Ireneo también «erró» a partir de Papías. «Y a partir de él también Ireneo» no comunica en español el predicado que se atribuye a Ireneo.
  - severity: low
    issue: «Los antiguos padres» no es la formulación más natural en este contexto.
    rationale: «Los Padres antiguos» expresa mejor la referencia a los padres cristianos tempranos y conserva la cautela del paréntesis del testigo.
