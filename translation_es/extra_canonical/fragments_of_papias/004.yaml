review_pass:
  verdict: revise
  source_fidelity: 'La revisión directa del griego/latín no es posible con los datos proporcionados; por ello se revisa frente al testigo inglés, que está gravemente dañado y contiene restauraciones editoriales entre corchetes. El borrador conserva adecuadamente la estructura, las atribuciones disputadas y la doble tradición sobre la muerte de Juan. Sin embargo, «y a partir de él también Ireneo» deja incompleta en español la elipsis restaurada del inglés: el sentido es que Ireneo también erró bajo la influencia de Papías. Conviene expresarlo sin aumentar el grado de certeza de la restauración.'
  naturalness: 'El registro general es claro, moderno y apropiado. Se mejoran algunas formulaciones: «los Padres antiguos» resulta más idiomático y conserva mejor el referente patrístico de «primitive (fathers)»; «respecto de él» refleja mejor «on His behalf» que «ante él». Se conserva «Juan el Teólogo», «el Anciano» y «Oráculos del Señor», todos naturales en contexto patrístico.'
  terminology: «Epístolas católicas» es el término técnico histórico y bibliográfico normal en español para catholic epistles; no impone una afiliación confesional y es más preciso que «universales» en este contexto. «Milenio», «Apocalipsis», «Partia», «Hierápolis», «Manaim» y los títulos joánicos se mantienen. La etiqueta «Historia cristiana» para Afist. Christ. es una expansión editorial plausible pero no completamente segura; al ser un encabezado de atribución, se mantiene con interrogación.
  issues:
  - severity: medium
    issue: La última cláusula sobre Ireneo está incompleta.
    rationale: «Papías también se equivoca acerca del milenio, y a partir de él también Ireneo» no comunica una predicación completa. El testigo inglés restaura «[erred]»; una formulación española prudente es «y también Ireneo, siguiendo a Papías, se equivoca», que deja claro que se trata de la valoración del transmisor.
  - severity: low
    issue: «Epístolas universales» diluye un término técnico tradicional.
    rationale: Para catholic Epistles, «epístolas católicas» es la denominación estándar en estudios bíblicos y patrísticos hispanos. En este uso, «católicas» significa generales/universales, no una toma de posición denominacional.
  - severity: low
    issue: «Ante él» no representa con precisión «on His behalf».
    rationale: La frase se refiere a la confesión y el compromiso de los dos hermanos respecto de Cristo, no necesariamente a una acción realizada en su presencia. «Respecto de él» preserva la ambigüedad.
  - severity: medium
    issue: El testigo de partida es una transcripción inglesa corrupta y las atribuciones son tardías.
    rationale: Las lecturas restauradas, la autoría de los encabezados y ciertos detalles de la cita requieren cotejo futuro con las ediciones griegas/latinas. Esta revisión no debe presentar tales restauraciones como texto antiguo seguro.
  revised_text: 'Papías, obispo de Hierápolis, quien fue discípulo de Juan el Teólogo y compañero de Policarpo, escribió cinco libros de Oráculos del Señor. Al enumerar a los apóstoles, después de Pedro y Juan, Felipe, Tomás y Mateo, incluyó entre los discípulos del Señor a Aristión y a un segundo Juan, a quien también llamó «el Anciano». [Dice] que algunos piensan que este Juan es el autor de las dos epístolas breves y católicas que circulan bajo el nombre de Juan; y da como razón que los Padres antiguos solo aceptan la primera epístola. Algunos también han considerado erróneamente que el Apocalipsis es obra suya, es decir, de Juan el Anciano. Papías también se equivoca acerca del milenio, y también Ireneo, siguiendo a Papías, se equivoca.


    Papías dice en su segundo libro que Juan el Teólogo y su hermano Santiago fueron muertos por los judíos. El mencionado Papías afirmó, basándose en el testimonio de las hijas de Felipe, que Barsabás, llamado también Justo, puesto a prueba por los incrédulos, bebió veneno de serpiente en el nombre del Señor y quedó protegido de todo daño. También refiere otros hechos maravillosos, en particular el de la madre de Manaim, quien fue resucitada. En cuanto a los que Cristo resucitó, [afirma] que sobrevivieron hasta el tiempo de Adriano.


    FELIPE DE SIDE (?), Historia cristiana.


    VI


    Después de Domiciano, Nerva reinó un año. Este hizo volver a Juan de la isla —es decir, Patmos— y le permitió residir en Éfeso. Juan era entonces el único sobreviviente de los doce apóstoles y, después de escribir su Evangelio, recibió el honor del martirio. Pues Papías, obispo de Hierápolis, quien fue testigo ocular de Juan, dice en el segundo libro de los Oráculos del Señor que este fue muerto por los judíos. De ese modo cumplió claramente, junto con su hermano, la profecía de Cristo acerca de ellos, así como la confesión y el compromiso que ellos mismos hicieron respecto de él. Porque, cuando el Señor les dijo: «¿Pueden beber la copa que yo bebo?», ellos asintieron y aceptaron de inmediato. Entonces él les dijo: «Beberán mi copa y serán bautizados con el bautismo con que yo soy bautizado».[a] Y con razón, pues es imposible que Dios mienta. Asimismo, el erudito Orígenes afirma en su interpretación del Evangelio según Mateo que Juan sufrió el martirio, y declara que conoció este hecho
    por medio de los sucesores de los apóstoles. También el bien informado Eusebio dice en su Historia eclesiástica: «A Tomás le correspondió en suerte Partia; a Juan, en cambio, Asia, donde fijó su residencia y murió en Éfeso».[b]


    JORGE HAMÁRTOLO, Crónica.'
  revised_footnotes:
  - marker: a
    text: La formulación combina expresiones de Mateo 20:22-23 y Marcos 10:38-39. La referencia al bautismo aparece en Marcos, mientras que algunos manuscritos de Mateo también la incluyen.
    reason: Aclara la forma compuesta de la cita sin armonizar silenciosamente el testigo.
  - marker: b
    text: El signo de duda que aparece en el testigo impreso junto a «Éfeso» parece editorial o derivado de una transmisión defectuosa. La traducción conserva el lugar transmitido, sin pretender resolver la incertidumbre del testigo.
    reason: Da cuenta de la incertidumbre visible en el testigo inglés sin convertir una probable corrección editorial en certeza textual.
  revision_rationale: 'Se aplican correcciones seguras de sentido, terminología y fluidez: se completa la afirmación polémica sobre Ireneo conforme a la restauración explícita del testigo inglés; se adopta el término técnico «epístolas católicas»; y se ajusta «on His behalf» a «respecto de él». Se mantiene la ambigüedad de las identidades joánicas, las atribuciones literarias, el martirio de Juan y la lectura dudosa asociada con Éfeso. Los corchetes editoriales y las notas se conservan.'
