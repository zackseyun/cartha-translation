  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: es
  text: 'Papías, obispo de Hierápolis, quien fue discípulo de Juan el Teólogo y compañero de Policarpo, escribió cinco libros de Oráculos del Señor. Al enumerar a los apóstoles, después de Pedro y Juan, Felipe, Tomás y Mateo, incluyó entre los discípulos del Señor a Aristión y a un segundo Juan, a quien también llamó «el Anciano». [Dice] que algunos piensan que este Juan es el autor de las dos epístolas breves y universales que circulan bajo el nombre de Juan; y da como razón que los antiguos padres solo aceptan la primera epístola. Algunos también han considerado erróneamente que el Apocalipsis es obra suya, es decir, de Juan el Anciano. Papías también se equivoca acerca del milenio, y a partir de él también Ireneo.


    Papías dice en su segundo libro que Juan el Teólogo y su hermano Santiago fueron muertos por los judíos. El mencionado Papías afirmó, basándose en el testimonio de las hijas de Felipe, que Barsabás, llamado también Justo, desafiado por los incrédulos, bebió veneno de serpiente en el nombre del Señor y quedó protegido de todo daño. También refiere otros hechos maravillosos, en particular el de la madre de Manaim, quien fue resucitada. En cuanto a los que Cristo resucitó, [afirma] que sobrevivieron hasta el tiempo de Adriano.


    FELIPE DE SIDE (?), Historia cristiana.


    VI


    Después de Domiciano reinó Nerva durante un año. Este hizo volver a Juan de la isla —es decir, Patmos— y le permitió residir en Éfeso. Juan era entonces el único sobreviviente de los doce apóstoles y, después de escribir su Evangelio, recibió el honor del martirio. Pues Papías, obispo de Hierápolis, quien fue testigo ocular de Juan, dice en el segundo libro de los Oráculos del Señor que este fue muerto por los judíos. De ese modo cumplió claramente, junto con su hermano, la profecía de Cristo acerca de ellos, así como la confesión y el compromiso que ellos mismos hicieron ante él. Porque, cuando el Señor les dijo: «¿Pueden beber la copa que yo bebo?», ellos asintieron y aceptaron de inmediato. Entonces él les dijo: «Beberán mi copa y serán bautizados con el bautismo con que yo soy bautizado».[a] Y con razón, pues es imposible que Dios mienta. Asimismo, el erudito Orígenes afirma en su interpretación del Evangelio según Mateo que Juan sufrió el martirio, y declara que conoció este hecho
    por medio de los sucesores de los apóstoles. También el bien informado Eusebio dice en su Historia eclesiástica: «A Tomás le correspondió en suerte Partia; a Juan, en cambio, Asia, donde fijó su residencia y murió en Éfeso».[b]


    JORGE HAMÁRTOLO, Crónica.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulación combina expresiones de Mateo 20:22-23 y Marcos 10:38-39. La referencia al bautismo aparece en Marcos, mientras que algunos manuscritos de Mateo también la incluyen.
    reason: Aclara la forma compuesta de la cita sin armonizar silenciosamente el testigo.
  - marker: b
    text: El signo de duda que aparece en el testigo impreso junto a «Éfeso» parece editorial o derivado de la transmisión defectuosa; la cita conocida de Eusebio afirma que Juan murió allí.
    reason: Da cuenta de la incertidumbre visible en el testigo inglés y de la probable corrupción de transmisión.
lexical_decisions:
- source_word: John the Divine
  choice: Juan el Teólogo
  rationale: Título tradicional y natural en español para el griego Theologos; evita que «el Divino» sugiera divinidad propia.
- source_word: Oracles of the Lord
  choice: Oráculos del Señor
  rationale: Conserva el título tradicional de la obra de Papías sin precisar indebidamente si se refiere a dichos, discursos o exposiciones.
- source_word: catholic Epistles
  choice: epístolas universales
  rationale: Expresa el sentido antiguo de «católicas» como dirigidas ampliamente, sin evocar de manera innecesaria una denominación posterior.
- source_word: The Elder
  choice: el Anciano
  rationale: Mantiene el título que distingue al segundo Juan sin resolver su identidad.
- source_word: Millennium
  choice: milenio
  rationale: Equivalente directo que conserva la referencia escatológica y la valoración polémica del testigo.
- source_word: received by lot
  choice: le correspondió en suerte
  rationale: Conserva la idea antigua de una asignación por sorteo o reparto.
theological_decisions:
- issue: Identidad de los dos Juanes
  choice: Mantener «un segundo Juan» y «Juan el Anciano» como figuras textualmente distinguibles
  alternative: Identificarlos con Juan el apóstol o con el evangelista
  rationale: El fragmento presenta la distinción como parte de su argumento, y no corresponde resolver una cuestión histórica discutida.
- issue: Autoría de las epístolas y del Apocalipsis
  choice: Presentar las atribuciones como opiniones de «algunos» y conservar la censura del recopilador
  alternative: Afirmar o negar directamente la autoría joánica
  rationale: La fuente transmite una disputa histórica y no una conclusión uniforme.
- issue: Milenio
  choice: Traducir literalmente el juicio «se equivoca» sin explicarlo ni respaldarlo
  alternative: Reformularlo conforme a una postura milenarista o amilenarista
  rationale: La valoración pertenece al testigo transmisor y debe conservarse sin importar una doctrina denominacional.
- issue: Martirio de Juan
  choice: Conservar la afirmación del testigo como afirmación histórica atribuida
  alternative: Armonizarla con otras tradiciones sobre la muerte de Juan
  rationale: El fragmento preserva una tradición concreta cuya tensión con otras fuentes no debe eliminarse.
- issue: Citas evangélicas sobre la copa y el bautismo
  choice: Traducir la forma citada por el cronista y señalar su relación textual en notas
  alternative: Sustituirla silenciosamente por la redacción exacta de una versión bíblica moderna
  rationale: La cita del fragmento combina lenguaje paralelo y debe respetarse como recepción patrística.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se repararon cortes de línea y daños evidentes de OCR. Se conservaron entre corchetes las suplencias editoriales con valor sustantivo. La traducción es provisional porque el material suministrado es un testigo inglés de dominio público y la revisión directa del griego o latín sigue pendiente; además, los encabezados y atribuciones pertenecen a testigos tardíos, no necesariamente a Papías mismo.
