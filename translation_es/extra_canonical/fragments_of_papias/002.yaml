  yaml_path: translation/extra_canonical/fragments_of_papias/002.yaml
  text: 'Five books by Papias are extant, bearing the title Expositions of the Oracles of the Lord. Irenaeus also mentions these as the only [works] written by him, in the following words: “These things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesses in writing in the fourth of his books. For there are five books composed by him.” So far Irenaeus.


    Yet Papias himself, in the preface to his discourses, certainly does not [claim] that he was a hearer and eyewitness of the holy Apostles. Rather, he shows by the language he uses that he received the matters of the faith from those who were their friends:


    “But I will not scruple also to give a place for you along with my interpretations to everything that I carefully learned and carefully remembered in time past from the elders, guaranteeing its truth. For, unlike the many, I did not take pleasure in those who have very much to say, but in those who teach the truth; nor in those who relate foreign commandments, but in those (who record) such as were given from the Lord to the Faith and are derived from the Truth itself. And again, whenever a person came (in my way) who had been a follower of the Elders, I would inquire about the discourses of the elders—what was said by Andrew, or by Peter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion and the Elder John, the disciples of the Lord, say. For I did not think that I could get so much profit from the contents of books as from the utterances of a living and abiding voice.”


    Here it is worth while to observe that he twice enumerates the name of John. The first he mentions in connection with Peter, James, Matthew, and the rest of the Apostles, evidently meaning the Evangelist; but the other John he mentions after an interval and classes with others outside the number of the Apostles, placing Aristion before him, and he distinctly calls him an Elder. Thus he makes it quite evident that their statement is true who say that there were two persons of that name in Asia, and that there are two tombs in Ephesus, each of which even now is called the tomb of John. It is important to notice this, for it is probable that it was the second, if one will not admit that it was the first, who saw the Revelation which is ascribed by name to John. Papias, of whom we are now speaking, confesses that he had received the words of the Apostles from those who had followed them, but says that he was himself a hearer of Aristion and the Elder John. At all events, he mentions them
    frequently by name and besides records their traditions in his writings. So much for these points, which I trust have not been uselessly adduced.


    It is worth while, however, to add to the words of Papias given above other passages from him, in which he records some other wonderful events likewise, as having come down to him by tradition. That Philip the Apostle resided in Hierapolis with his daughters has already been stated; but it must be noted here how Papias, their contemporary, relates that he had heard a marvellous tale from the daughters of Philip. For he relates that in his ti[me] a man rose from the dead, and again he gives another wonderful story about Justus, who was surnamed Barsabas: how he drank a deadly poison and yet, by the grace of the Lord, suffered no inconvenience. Of this Justus the Book of Acts records that, after the ascension of the Saviour, the holy Apostles put him forward with Matthias and prayed for the right choice, in place of the traitor Judas, to make their number complete. The passage is somewhat as follows: “And they put forward two, Joseph, called Barsabas, who was surnamed Justus, and Matthias;
    and they prayed, and said.”


    The same writer has recorded other notices as having come down to him from oral tradition: certain strange parables of the Saviour and teachings of his, and some other statements of a rather mythical character. Among these he says that there will be a period of some ten thousand years after the resurrection, and that the kingdom of Christ will be set up in material form on this earth. These ideas, I suppose, he got through a misunderstanding of the apostolic accounts, not perceiving that the things recorded there in figures were spoken by them mystically.


    For he evidently was a man of very limited capacity, as one may say, judging from his own statements. Yet it was owing to him that so many church fathers after him adopted a like opinion, urging in their own support the antiquity of the man, as, for instance, Irenaeus and whoever else they were who declared that they held like views. Papias also gives in his own work other accounts of the words of the Lord on the authority of Aristion, mentioned above, and traditions of the Elder John. To these we refer the curious; for our present purpose we will merely add to his words, which have been quoted above, a tradition which has been set forth through these sources concerning Mark, who wrote the Gospel:


    “And the Elder said this also: Mark, having become the interpreter of Peter, wrote down accurately everything that he remembered, without, however, recording in order what was either said or done by Christ. For neither did he hear the Lord nor did he follow him; but afterwards, as I said, (attended) Peter, who adapted his instructions to the needs of his hearers but had no design of giving a connected account of the Lord’s oracles. So then Mark made no mistake, while [he] thus wrote down some things as he remembered them; for [he] made it his one care not to omit anything that he heard, or [to] set down any false statement therein.”


    Such, then, is the account given by Papias concerning Mark. But concerning Matthew, the following statement is made [by him]:


    “So then Matthew composed the oracles in the Hebrew language, and each one interpreted them as he could.”


    The same writer employed testimonies from the First Epistle of John, and likewise from that of Peter. And he has related another story about a woman accused of many sins before the Lord, which the Gospel according'
translation:
  language: es
  text: 'Se conservan cinco libros de Papías que llevan por título Exposiciones de los oráculos del Señor. Ireneo también los menciona como las únicas obras escritas por él, con estas palabras: «De estas cosas da testimonio por escrito Papías, oyente de Juan, compañero de Policarpo y hombre digno de la antigüedad, en el cuarto de sus libros. Pues él compuso cinco libros». Hasta aquí Ireneo.


    Sin embargo, Papías mismo, en el prólogo de sus exposiciones, ciertamente no afirma haber sido oyente y testigo ocular de los santos apóstoles. Más bien, por las palabras que emplea muestra que recibió lo referente a la fe de quienes habían tratado con ellos:


    «Pero tampoco vacilaré en incluir para ti, junto con mis explicaciones, todo cuanto en otro tiempo aprendí cuidadosamente de los ancianos y recordé con cuidado, garantizando su verdad. Porque, a diferencia de la mayoría, no me complacía en quienes dicen muchas cosas, sino en quienes enseñan la verdad; ni en quienes refieren mandamientos ajenos, sino en quienes transmiten los mandamientos dados por el Señor a la fe y procedentes de la Verdad misma. Además, si alguna vez llegaba alguien que hubiera seguido a los ancianos, yo averiguaba lo dicho por los ancianos: qué habían dicho Andrés, Pedro, Felipe, Tomás, Santiago, Juan, Mateo o cualquier otro de los discípulos del Señor; y qué dicen Aristión y el anciano Juan, discípulos del Señor. Porque no pensaba que el contenido de los libros pudiera serme de tanto provecho como lo dicho por una voz viva y perdurable».


    Aquí vale la pena observar que enumera dos veces el nombre de Juan. Al primero lo menciona junto con Pedro, Santiago, Mateo y los demás apóstoles, refiriéndose evidentemente al evangelista; pero menciona al otro Juan después de un intervalo y lo coloca entre otros que están fuera del número de los apóstoles, anteponiéndole a Aristión, y lo llama claramente «anciano». Así deja del todo claro que es verdadera la afirmación de quienes dicen que hubo en Asia dos personas con ese nombre y que en Éfeso hay dos sepulcros, cada uno de los cuales todavía ahora es llamado sepulcro de Juan. Es importante advertirlo, pues es probable que fuera el segundo —si no se acepta que fue el primero— quien contempló el Apocalipsis atribuido por nombre a Juan. Papías, de quien ahora hablamos, reconoce que recibió las palabras de los apóstoles por medio de quienes los habían seguido, pero dice que él mismo fue oyente de Aristión y del anciano Juan. En todo caso, los menciona frecuentemente por nombre y también
    consigna sus tradiciones en sus escritos. Esto baste acerca de estos puntos, que espero no haber expuesto sin provecho.


    Conviene, sin embargo, añadir a las palabras de Papías citadas arriba otros pasajes suyos en los que registra asimismo algunos acontecimientos maravillosos que le llegaron por tradición. Ya se ha dicho que el apóstol Felipe residía en Hierápolis con sus hijas; pero debe señalarse aquí que Papías, contemporáneo de ellas, cuenta que oyó de las hijas de Felipe un relato maravilloso. Refiere, en efecto, que en su tiempo un hombre resucitó de entre los muertos. También cuenta otra historia maravillosa acerca de Justo, de sobrenombre Barsabás: bebió un veneno mortal y, sin embargo, por la gracia del Señor no sufrió daño alguno. Acerca de este Justo, el libro de los Hechos cuenta que, después de la ascensión del Salvador, los santos apóstoles lo presentaron junto con Matías y oraron para que se hiciera la elección correcta y así completar su número en lugar del traidor Judas. El pasaje dice aproximadamente así: «Presentaron a dos: a José, llamado Barsabás y de sobrenombre Justo, y a Matías;
    y oraron diciendo...».


    El mismo escritor registró otras noticias que le habían llegado por tradición oral: ciertas parábolas extrañas del Salvador y enseñanzas suyas, además de algunas otras afirmaciones de carácter más bien fabuloso. Entre ellas dice que, después de la resurrección, habrá un período de unos diez mil años y que el reino de Cristo será establecido de forma material sobre esta tierra. Supongo que llegó a estas ideas por haber entendido mal los relatos apostólicos, sin comprender que lo que ellos consignaron mediante figuras fue expresado en sentido místico.


    Pues, a juzgar por sus propias afirmaciones, evidentemente era un hombre de capacidad muy limitada. Sin embargo, por causa de él muchos padres de la Iglesia posteriores adoptaron una opinión semejante y apelaron en su apoyo a la antigüedad de aquel hombre; entre ellos, por ejemplo, Ireneo y cualesquiera otros que declararon sostener ideas parecidas. Papías también ofrece en su propia obra otros relatos de las palabras del Señor con base en la autoridad de Aristión, ya mencionado, así como tradiciones del anciano Juan. A ellos remitimos a quienes deseen investigarlas; para nuestro propósito presente, solo añadiremos a las palabras suyas ya citadas una tradición transmitida por estas fuentes acerca de Marcos, quien escribió el Evangelio:


    «También decía esto el anciano: Marcos, después de convertirse en intérprete de Pedro, escribió con exactitud todo cuanto recordaba, aunque no puso en orden lo que Cristo había dicho o hecho. Porque él no oyó al Señor ni lo siguió; pero más tarde, como dije, acompañó a Pedro, quien adaptaba sus enseñanzas a las necesidades de sus oyentes, sin proponerse elaborar una exposición ordenada de los oráculos del Señor. Por tanto, Marcos no se equivocó al escribir así algunas cosas según las recordaba, pues puso especial cuidado en no omitir nada de lo que había oído ni consignar en ello afirmación falsa alguna».


    Este es, pues, el testimonio de Papías acerca de Marcos. En cuanto a Mateo, se le atribuye la siguiente afirmación:


    «Así pues, Mateo reunió los oráculos en lengua hebrea[a], y cada uno los interpretó como pudo».


    El mismo escritor utilizó testimonios de la Primera Carta de Juan y también de la de Pedro. Además, relató otra historia acerca de una mujer acusada ante el Señor de muchos pecados, la cual contiene el Evangelio según... [b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Lengua hebrea» traduce una expresión antigua que también puede referirse, de manera más amplia, a la lengua de los hebreos; en ciertos contextos podría incluir el arameo. El texto no permite decidirlo con certeza.
    reason: Preservar la ambigüedad histórica y lingüística sin sustituir el testimonio por una identificación moderna segura.
  - marker: b
    text: El testimonio suministrado termina aquí, en medio de la oración, después de «el Evangelio según».
    reason: Advertir que la interrupción pertenece al alcance del testimonio disponible y no a una omisión deliberada de la traducción.
lexical_decisions:
- source_word: λόγια / oracles
  choice: oráculos
  rationale: Conserva el término técnico tradicional y su amplitud semántica, que puede abarcar dichos, enseñanzas o pronunciamientos, sin reducirlo a una categoría moderna.
- source_word: πρεσβύτεροι / elders
  choice: ancianos
  rationale: Mantiene la designación histórica sin decidir si se trata de una edad, una generación transmisora o un oficio eclesial.
- source_word: ἑρμηνευτής / interpreter
  choice: intérprete
  rationale: Preserva la ambigüedad entre traductor, mediador lingüístico y expositor de la predicación de Pedro.
- source_word: ζώσης φωνῆς καὶ μενούσης / living and abiding voice
  choice: una voz viva y perdurable
  rationale: Reproduce la contraposición entre los libros y el testimonio oral vivo sin convertirla en una máxima doctrinal.
- source_word: Ἑβραΐδι διαλέκτῳ / Hebrew dialect
  choice: lengua hebrea
  rationale: Traducción legible del testimonio recibido; una nota conserva la posible amplitud del término antiguo.
- source_word: μυθικώτερα / rather mythical
  choice: de carácter más bien fabuloso
  rationale: Refleja el juicio crítico de Eusebio con lenguaje natural, sin presentar necesariamente los relatos como mitología formal.
theological_decisions:
- issue: Identidad de los dos Juanes
  choice: Conservar el razonamiento de Eusebio como afirmación y probabilidad propias del narrador
  alternative: Identificar categóricamente al anciano Juan con el autor del Apocalipsis
  rationale: El pasaje distingue dos personas, pero mantiene abierta y condicionada la atribución del Apocalipsis.
- issue: Reino material posterior a la resurrección
  choice: Traducir la postura atribuida a Papías y la crítica de Eusebio sin armonizarlas
  alternative: Corregir el número o reinterpretar el reino como puramente espiritual
  rationale: La tensión histórica y teológica pertenece al testimonio y no debe resolverse editorialmente.
- issue: Marcos y el orden del Evangelio
  choice: Mantener que no escribió «en orden» y que aun así no se equivocó
  alternative: Explicar «orden» como exclusivamente cronológico o literario
  rationale: El texto no define la clase de orden y vincula la fidelidad de Marcos con su memoria y exactitud.
- issue: Los oráculos de Mateo
  choice: Mantener «oráculos» y «lengua hebrea» con nota
  alternative: Traducir «Evangelio completo» y «arameo»
  rationale: El testimonio no permite precisar con seguridad ni el género exacto de la composición ni la variedad lingüística.
- issue: Evaluación peyorativa de Papías
  choice: Conservarla como juicio de Eusebio
  alternative: Suavizarla u omitirla por deferencia eclesial
  rationale: Es parte esencial del fragmento preservado y distingue la voz del transmisor de la de Papías.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se diferenciaron mediante el contexto las voces de Ireneo, Papías y Eusebio; se repararon corrupciones evidentes de OCR siguiendo el testimonio inglés auditado. Dado que la revisión directa del griego y el latín está pendiente, la redacción es una versión provisional basada en el testigo público suministrado y conserva las ambigüedades históricas relevantes.
