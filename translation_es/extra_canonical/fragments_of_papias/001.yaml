base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: es
  text: '**Fragmento I**


    **I**


    Ireneo y otros refieren que Juan, el Teólogo y apóstol, sobrevivió hasta la época de Trajano. Después de esto, Papías de Hierápolis y Policarpo, obispo de Esmirna, sus oyentes, llegaron a ser conocidos.[a]


    —Eusebio, *Crónica* (Sincelo 655, 14), correspondiente a la Olimpiada 220.


    **II**


    Por aquel tiempo, Policarpo se destacó en Asia como discípulo de los apóstoles. De manos de quienes habían visto al Señor y habían sido sus servidores, recibió el encargo de supervisar la comunidad de Esmirna.[b] En ese mismo tiempo, Papías, que también era obispo de la comunidad de Hierápolis, cobró renombre.


    —Eusebio, *Historia eclesiástica* 3.36.1–2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Sus oyentes» se refiere a Juan en el testimonio. La expresión indica que Papías y Policarpo lo habían escuchado, sin definir por sí sola una relación técnica de discipulado.
    reason: Conservar la relación transmitida sin reforzarla como una afirmación de sucesión o discipulado formal.
  - marker: b
    text: 'El testimonio inglés suministrado presenta una corrupción tipográfica en esta oración. La traducción sigue el sentido preservado en Eusebio, *Historia eclesiástica* 3.36.1: Policarpo recibió la supervisión de la comunidad de Esmirna de quienes habían visto al Señor y habían sido sus servidores.'
    reason: Resolver transparentemente la laguna OCR mediante el pasaje eusebiano citado, sin presentar la restauración como una conjetura libre.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: Juan, el Teólogo y Apóstol
  rationale: «El Teólogo» es un título histórico más natural y preciso en español que el posible «el Divino», que podría sugerir que Juan mismo era divino.
- source_word: survived until the times of Trajan
  choice: vivió hasta tiempos de Trajano
  rationale: Expresa con naturalidad que Juan permaneció con vida hasta el período de Trajano, sin añadir una fecha más precisa que la del testimonio.
- source_word: his hearers
  choice: quienes lo habían escuchado
  rationale: Conserva la afirmación del testimonio y evita el tecnicismo «oyentes»; la nota reconoce la incertidumbre que resulta de depender de una versión inglesa.
- source_word: flourished / became distinguished
  choice: se destacó / cobró renombre
  rationale: Distingue de manera natural dos expresiones cercanas y comunica notoriedad pública sin implicar necesariamente prosperidad material.
- source_word: diocese of Hierapolis
  choice: diócesis de Hierápolis
  rationale: Mantiene el término del testimonio inglés disponible, sin reconstruir por conjetura el posible vocablo griego subyacente.
theological_decisions:
- issue: Título de Juan
  choice: el Teólogo y Apóstol
  alternative: el Divino y Apóstol
  rationale: Evita atribuir explícitamente divinidad a Juan y refleja el uso histórico del título aplicado al autor o figura joánica.
- issue: Relación de Papías y Policarpo con Juan
  choice: quienes lo habían escuchado
  alternative: sus discípulos
  rationale: El testimonio dice «hearers», no «disciples»; se conserva la formulación más limitada para no fortalecer una afirmación de sucesión discipular.
- issue: Reconstrucción del pasaje dañado sobre Policarpo
  choice: señalar la laguna como texto corrupto e ilegible
  alternative: reconstruir una oración continua a partir de paralelos o conjeturas
  rationale: La evidencia suministrada no permite una restauración responsable; mantener visible la pérdida evita introducir contenido histórico o eclesiológico incierto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los encabezados, las atribuciones antiguas y la discontinuidad del segundo fragmento. El borrador es necesariamente provisional porque el material suministrado consiste en un testimonio inglés de dominio público con corrupción tipográfica/OCR, y la revisión directa de las fuentes griegas o latinas sigue pendiente.
