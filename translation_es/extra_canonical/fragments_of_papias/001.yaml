    **II**


    Por aquel tiempo se destacó en Asia Policarpo, discípulo de los apóstoles, quien [texto corrupto e ilegible acerca de la iglesia de Esmirna y de «… ministros del Señor»].[b] En ese mismo tiempo también cobró renombre Papías, obispo de la diócesis de Hierápolis.


