base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: es
  text: 'Tomando como punto de partida a Papías el Grande, de Hierápolis, discípulo del apóstol que se recostó sobre el pecho de Cristo[a], así como a Clemente, a Panteno, sacerdote de los alejandrinos, y a Amonio, el gran erudito: aquellos antiguos y primeros expositores que coinciden entre sí al entender que toda la obra de los seis días se refiere a Cristo y a su Iglesia.[b]


    ANASTASIO DEL SINAÍ, Contempl. Anagog. in Hexaém. I.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto no nombra al apóstol; la expresión alude al discípulo que se reclinó junto a Jesús durante la cena (véase Juan 13:23).
    reason: Evita introducir en el cuerpo una identificación explícita ausente del testimonio.
  - marker: b
    text: La redacción conservada es un fragmento sintácticamente dependiente. El sentido parece ser que estos antiguos expositores interpretaban la obra de los seis días con referencia a Cristo y a la Iglesia. La traducción es provisional, pues aún está pendiente la revisión directa del texto griego o latino.
    reason: Advierte tanto la forma fragmentaria como la limitación documental de una traducción basada en el testimonio inglés público suministrado.
  - marker: c
    text: 'Atribución: Anastasio del Sinaí, Contempl. Anagog. in Hexaém. I; se conserva abreviado el título de la obra tal como aparece en el testimonio disponible.'
    reason: Preserva la atribución y evita expandir conjeturalmente un título que requiere cotejo directo con la fuente.
lexical_decisions:
- source_word: Taking their start from
  choice: Tomando como punto de partida a
  rationale: Conserva el carácter dependiente y fragmentario de la formulación transmitida, sin inventar un sujeto ni un verbo principal ausentes del testimonio inglés.
- source_word: the Apostle who leaned on Christ’s bosom
  choice: el apóstol que se recostó sobre el pecho de Cristo
  rationale: Mantiene la alusión joánica y la relación sintáctica del testimonio, sin identificar explícitamente al apóstol por nombre.
- source_word: Pantanus the priest of the Alexandrians
  choice: Panteno, sacerdote de los alejandrinos
  rationale: Usa la forma española habitual del nombre y conserva el alcance amplio de la designación, sin convertirla en un cargo eclesiástico más específico.
- source_word: all the work of the six days
  choice: toda la obra de los seis días
  rationale: Reproduce la referencia tradicional a los seis días de la creación y evita sustituirla por el término técnico «Hexamerón» dentro del cuerpo.
- source_word: expositors
  choice: expositores
  rationale: Expresa la función interpretativa de estas figuras sin restringirla indebidamente a «comentaristas» de un solo texto.
theological_decisions:
- issue: Relación de la obra de los seis días con Cristo y la Iglesia
  choice: «se refiere a Cristo y a su Iglesia»
  alternative: «debe entenderse como Cristo y su Iglesia»
  rationale: La formulación elegida conserva la lectura anagógica indicada por el testimonio sin afirmar una identidad absoluta entre cada elemento de la creación y Cristo o la Iglesia.
- issue: Identidad del apóstol reclinado sobre el pecho de Cristo
  choice: No identificarlo por nombre
  alternative: «el apóstol Juan»
  rationale: El testimonio suministrado alude al apóstol, pero no lo nombra; explicitar «Juan» resolvería una referencia que el texto deja implícita.
translation_notes:
  register: Español latinoamericano neutral, digno y accesible. Se mantuvo deliberadamente el carácter fragmentario de la oración mediante una construcción inicial en gerundio y dos puntos, en lugar de suplir un sujeto o verbo principal. Los nombres propios se dieron en sus formas españolas habituales. Dado que la revisión del griego o latín está pendiente, las decisiones se basan de manera provisional en el testimonio inglés de dominio público proporcionado.
