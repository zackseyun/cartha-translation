  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: es
  text: 'A quienes practicaban la sencillez sincera ante Dios solían llamarlos «niños», como también lo muestra Papías en el primer libro de las Exposiciones del Señor, y Clemente de Alejandría en El pedagogo.[a]


    —Máximo el Confesor, Escolios sobre las obras de Dionisio Areopagita, Sobre la jerarquía eclesiástica, capítulo 2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público de J. B. Lightfoot. Queda pendiente la revisión directa del texto griego o latino conservado.
    reason: La fuente suministrada indica expresamente que aún no se ha realizado la revisión en la lengua antigua; la nota hace visible esa limitación textual.
lexical_decisions:
- source_word: guilelessness
  choice: sencillez sincera
  rationale: Expresa la ausencia de engaño o doblez en un español natural, sin reducir el sentido a mera ingenuidad.
- source_word: towards God
  choice: ante Dios
  rationale: Comunica una actitud y conducta vividas en relación con Dios; «para con Dios» sería más formal y menos corriente.
- source_word: children
  choice: niños
  rationale: Conserva la imagen y la terminología explícita del testimonio, sin interpretarla como una categoría espiritual más específica.
- source_word: Expositions of the Lord
  choice: Exposiciones del Señor
  rationale: Mantiene formalmente el título transmitido, cuya relación genitiva puede referirse a enseñanzas o dichos del Señor sin resolver aquí esa posible amplitud.
- source_word: Paedagogue
  choice: El pedagogo
  rationale: Usa el título español tradicional y transparente de la obra de Clemente de Alejandría.
theological_decisions:
- issue: Sentido de la designación «niños»
  choice: Conservar «niños» sin explicación doctrinal en el texto
  alternative: Traducir «hijos» o «niños espirituales»
  rationale: El testimonio vincula el término con la ausencia de engaño ante Dios, pero no define aquí una doctrina técnica; explicitarla resolvería más de lo que permite la fuente disponible.
- issue: Naturaleza de la virtud descrita
  choice: «sencillez sincera»
  alternative: «inocencia», «candor» o «falta de malicia»
  rationale: La formulación elegida preserva el énfasis moral en no actuar con engaño, evitando sugerir impecabilidad absoluta o ingenuidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la sintaxis testimonial («como también lo muestra…») y la atribución bibliográfica. Se eliminó el marcador intrusivo de página presente en el testimonio impreso.
