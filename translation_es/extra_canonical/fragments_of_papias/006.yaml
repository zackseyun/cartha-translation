review_pass:
  verdict: revise
  source_fidelity: 'La atribución se conserva: Ireneo es presentado como discípulo de Papías, y Papías como oyente de Juan. Se mantiene sin completar la secuencia truncada «Eva[…]». Sin embargo, «había oído a» puede significar meramente que escuchó a Juan en alguna ocasión y no refleja con suficiente precisión «was a hearer of», que describe la condición de oyente.'
  naturalness: La redacción es clara y de registro apropiado, pero conviene marcar inequívocamente que la relativa «quien fue oyente» se refiere a Papías y emplear «oyente de», expresión más directa y fiel al testimonio.
  terminology: «Ireneo», «Papías» y «Jerónimo» son formas españolas asentadas. La no reconstrucción de «Eva[…]» es metodológicamente correcta. «Oyente de» conserva el término relacional sin imponer que Papías fuera necesariamente discípulo en un sentido técnico.
  issues:
  - severity: medium
    issue: «había oído a Juan» sustituye «was a hearer of John».
    rationale: El verbo «oír» puede denotar un acto puntual de escucha; «hearer of» presenta a Papías como «oyente de» Juan. La corrección mantiene la sobriedad del testimonio sin ampliar su alcance.
  - severity: low
    issue: La referencia de «quien» puede beneficiarse de una delimitación sintáctica explícita.
    rationale: 'Aunque el antecedente inmediato es Papías, los incisos con rayas hacen inequívoca la relación transmitida: Papías fue oyente de Juan.'
  revised_text: 'Ireneo, discípulo de Papías —quien fue oyente de Juan el Eva[…]—, relata:


    —Jerónimo, *A Teodora*, Carta 75 (29), capítulo 3.'
  revised_footnotes:
  - marker: a
    text: El testimonio disponible se interrumpe después de «Eva»; no se completa por conjetura como «Evangelista».
    reason: Señalar de manera transparente la truncación del testimonio y evitar presentar una reconstrucción como texto conservado.
  revision_rationale: Se reemplaza «había oído a» por «fue oyente de» para reflejar el sentido relacional de «was a hearer of» sin atribuir más de lo que expresa el testimonio. Las rayas delimitan la relativa referida a Papías. Se conserva la truncación, la nota y la referencia bibliográfica.
