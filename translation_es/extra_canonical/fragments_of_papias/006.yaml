  text: 'Irenzeus, a disciple of Papias who was a hearer of John the Eva[...], relates.


    —Jerome, To Theodora, Letter 75 (29), chapter 3.'
translation:
  language: es
  text: 'Ireneo, discípulo de Papías, quien había oído a Juan el Eva[…][a], relata:


    —Jerónimo, *A Teodora*, Carta 75 (29), capítulo 3.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio disponible se interrumpe después de «Eva»; no se completa por conjetura como «Evangelista».
    reason: Señalar de manera transparente la truncación del testimonio y evitar presentar una reconstrucción como texto conservado.
lexical_decisions:
- source_word: Irenzeus
  choice: Ireneo
  rationale: Se normaliza en español el nombre tradicionalmente conocido como Ireneo; «Irenzeus» parece ser una forma defectuosa del testimonio inglés u OCR.
- source_word: Papias
  choice: Papías
  rationale: Se emplea la forma española establecida del nombre.
- source_word: hearer of
  choice: había oído a
  rationale: Conserva la afirmación mínima del testimonio sin ampliar «oyente» hasta convertirlo necesariamente en discípulo.
- source_word: relates
  choice: relata
  rationale: Reproduce el verbo introductorio sin suplir el contenido ausente después de los dos puntos.
- source_word: JEROME ad Theodoram
  choice: Jerónimo, A Teodora
  rationale: Se usan la forma española del nombre y una traducción directa del título latino citado.
theological_decisions:
- issue: Identidad o título incompleto de «Juan el Eva[…]»
  choice: Conservar «Juan el Eva[…]» sin completar
  alternative: «Juan el Evangelista»
  rationale: El testimonio proporcionado queda truncado en «Eva» y la revisión directa del griego o latín está pendiente; completar el título introduciría una conjetura no señalada.
- issue: Antecedente de «quien había oído»
  choice: Mantener la relativa inmediatamente después de «Papías»
  alternative: Reformular de modo que Ireneo sea quien oyó a Juan
  rationale: La sintaxis del testimonio inglés vincula naturalmente la relativa con Papías; no hay base en los datos suministrados para reasignarla.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la concisión fragmentaria y la ruptura textual del testimonio. La puntuación con dos puntos indica que «relata» introduce material que no aparece en el fragmento suministrado; la referencia bibliográfica se presenta aparte.
