  terminology: Se mantienen de manera consistente los términos técnicos y las mayúsculas de las entidades personificadas. «Espíritu santo» evita una identificación doctrinal añadida; «Ser Humano Primordial» refleja prudentemente la expresión inclusiva adoptada en el puente inglés. La nota sobre «eónica» es útil y no interpreta indebidamente el sistema cosmológico.
  issues:
  - severity: low
    issue: La nota a afirma que los corchetes pueden señalar «palabras restituidas o de lectura incierta».
    rationale: Según el material proporcionado, las marcas angulares y los corchetes se preservan como marcas de restitución editorial. No se ofrece base para ampliar su función a lecturas inciertas. Una nota más precisa debe limitarse a describirlas como restituciones editoriales.
