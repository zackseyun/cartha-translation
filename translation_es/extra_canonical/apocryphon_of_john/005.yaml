    2. ‹Ella›[a] le rogó al Espíritu invisible y virginal —es decir, a Barbelo— que le concediera el Preconocimiento, y el Espíritu accedió.


    3. Cuando hubo [accedido], el Preconocimiento se presentó y acompañó a la Providencia, la que se origina en la Idea del Espíritu invisible y virginal.


    4. Ella lo ensalzó [y] ensalzó a su poder perfecto, Barbelo, porque ellos habían llegado a existir por causa de ella.


