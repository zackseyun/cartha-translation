translation:
  language: es
  text: 'Apócrifo de Juan — La péntada


    1. Ella se convirtió en la matriz universal, porque es la que existe antes que todos ellos: la Madre-Padre, el Ser Humano Primordial, el Espíritu santo, la triplemente masculina, la triplemente poderosa, la de triple nombre, la andrógina, el eón eterno entre los seres invisibles, la primera en emanar.


    2. ‹Ella›[a] le rogó al Espíritu invisible y virginal —es decir, a Barbelo— que le concediera el Conocimiento Previo, y el Espíritu accedió.


    3. Cuando él hubo [accedido], el Conocimiento Previo se presentó y acompañó a la Providencia, la que se origina en la Idea del Espíritu invisible y virginal.


    4. Ella lo ensalzó [y] ensalzó a su poder perfecto, Barbelo, porque ellos habían llegado a existir por causa de ella.


    5. Una vez más, ella le rogó que le concediera la [Indestructibilidad], y él accedió.


    6. Cuando él hubo [accedido], la Indestructibilidad [se presentó] y acompañó a la Idea y al Conocimiento Previo.


    7. Ella ensalzó al Invisible y a Barbelo, aquella por cuya causa ellos habían llegado a existir.


    8. Barbelo también le rogó que le concediera la vida eterna, y el Espíritu invisible accedió. Cuando él hubo accedido, la Vida Eterna se presentó,


    9. y ellos [acompañaron] y ensalzaron al [Espíritu] invisible y a Barbelo, por cuya causa habían llegado a existir.


    10. Una vez más, ella le rogó que le concediera la verdad. Y [él accedió]; y [cuando hubo] accedido,


    11. la Verdad se presentó, y ellos acompañaron y ensalzaron al admirable Espíritu invisible y a su Barbelo, por cuya causa habían llegado a existir.


    12. Esta es la péntada eónica[b] del Padre, la cual es el Ser Humano Primordial, imagen del Espíritu invisible.


    13. Esta es la Providencia —es decir, Barbelo—, junto con la Idea, el Conocimiento Previo, la Indestructibilidad, la Vida Eterna y la Verdad.


    14. Esta es la péntada eónica andrógina, que constituye la década eónica, la cual es el Padre.


    [a] Los signos ‹ › indican una restitución editorial del texto; los corchetes en otros lugares señalan palabras restituidas o de lectura incierta en el testimonio utilizado.


    [b] «Eónica» significa aquí «perteneciente a un eón», una realidad o ámbito eterno del mundo invisible.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los signos ‹ › indican una restitución editorial del texto; los corchetes en otros lugares señalan palabras restituidas o de lectura incierta en el testimonio utilizado.
    reason: Aclara las marcas críticas preservadas del testimonio inglés sin presentarlas como palabras seguras del manuscrito.
  - marker: b
    text: «Eónica» significa aquí «perteneciente a un eón», una realidad o ámbito eterno del mundo invisible.
    reason: Ayuda al lector común con un término cosmológico técnico que no tiene equivalente español sencillo.
lexical_decisions:
- source_word: universal womb
  choice: matriz universal
  rationale: «Matriz» conserva tanto la imagen corporal como la función generadora, y resulta natural en español actual.
- source_word: Mother-Father
  choice: Madre-Padre
  rationale: Se mantiene la expresión compuesta y su tensión deliberada entre géneros, sin explicarla ni armonizarla.
- source_word: Primal Man
  choice: Ser Humano Primordial
  rationale: Expresa la prioridad arquetípica sin restringir innecesariamente el referente al varón; concuerda con la formulación andrógina del pasaje.
- source_word: triple-male / triple-powerful / triple-named
  choice: triplemente masculina / triplemente poderosa / de triple nombre
  rationale: Se conserva la serie triple con formulaciones comprensibles, evitando calcos españoles más opacos.
- source_word: aeon / aeonic
  choice: eón / eónica
  rationale: Se retiene el término técnico cosmológico porque «edad» o «eternidad» borraría su sentido de entidad o ámbito supramundano.
- source_word: Precognition
  choice: Conocimiento Previo
  rationale: Distingue esta figura personificada de la Providencia y evita la connotación moderna predominantemente paranormal de «precognición».
- source_word: Providence
  choice: Providencia
  rationale: Conserva la personificación y la terminología conceptual tradicional sin añadir contenido doctrinal.
- source_word: Idea
  choice: Idea
  rationale: Mantiene el sustantivo conceptual personificado y su capitalización.
- source_word: Indestructibility
  choice: Indestructibilidad
  rationale: Reproduce la cualidad personificada con precisión y diferencia el concepto de mera inmortalidad.
- source_word: attended
  choice: acompañó / acompañaron
  rationale: Conserva la relación de asistencia o asociación sin imponer una jerarquía no explícita.
- source_word: pentad / decad
  choice: péntada / década
  rationale: Mantiene la terminología numérica técnica del sistema descrito, aun donde la enumeración genera una tensión aparente.
theological_decisions:
- issue: Identificación y género de Barbelo y del Espíritu invisible
  choice: Conservar tanto la identificación «es decir, a Barbelo» como la alternancia entre formas femeninas para Barbelo y masculinas para el Espíritu.
  alternative: Uniformar todos los pronombres y títulos bajo un solo género.
  rationale: El pasaje combina lenguaje Madre-Padre, andrógino y pronombres de distinto género; uniformarlo resolvería indebidamente una tensión propia del texto.
- issue: Relación entre la péntada y los elementos enumerados
  choice: Traducir literalmente «péntada» y mantener todos los nombres de la enumeración.
  alternative: Reordenar, fusionar o eliminar elementos para producir un conjunto inequívoco de cinco.
  rationale: La aritmética conceptual del pasaje no debe corregirse mediante conjetura editorial, especialmente mientras está pendiente la revisión copta directa.
- issue: «la cual es el Padre» en los versículos 12 y 14
  choice: Mantener el relativo con su ambigüedad referencial.
  alternative: Reformular para identificar explícitamente al Padre con la péntada, la década o el Ser Humano Primordial.
  rationale: La sintaxis permite tensión entre esas identificaciones; una paráfrasis más específica impondría una lectura teológica.
- issue: Carácter santo del Espíritu
  choice: Traducir «el Espíritu santo» en minúscula adjetival dentro de la serie descriptiva.
  alternative: Usar «el Espíritu Santo» como título cristiano convencional.
  rationale: La minúscula evita importar automáticamente una identificación trinitaria posterior, sin negar el calificativo de santidad presente en el testimonio.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservan las personificaciones mediante mayúscula inicial y las señales de restitución textual. El borrador es necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto está pendiente. Se eliminó el número de página manuscrita «6» por no pertenecer al contenido del pasaje.'
