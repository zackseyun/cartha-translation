  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: es
  text: '**El arrepentimiento de la Madre**


    1. Yo, sin embargo, dije:


    —Señor, ¿qué significa «ella iba de un lado a otro»?


    Él sonrió y dijo:


    —¡No pienses que esto corresponde a lo que dijo Moisés: «sobre las aguas»![a]


    2. Más bien, cuando ella vio el mal que había ocurrido y el robo que su hijo había cometido, se arrepintió. El olvido la envolvió en medio de la oscuridad de la ignorancia, y comenzó a sentir vergüenza. [No se atrevía] a regresar, sino que [andaba] de un lado a otro.


    3. Este movimiento es «ir de un lado a otro». El orgulloso obtuvo poder de su madre porque, en su ignorancia, suponía que nadie existía aparte de ella.


    4. Sin embargo, cuando vio la multitud de ángeles que había creado, se exaltó por encima de ellos.


    5. Además, cuando la Madre se dio cuenta de que el ropaje de oscuridad era defectuoso, comprendió que su compañero no había estado de acuerdo con ella.


    6. Se arrepintió y lloró copiosamente. La Plenitud entera escuchó su oración de arrepentimiento, y en favor de ella alabaron al Espíritu invisible y virginal.


    7. Y [él] accedió.[b] Cuando [el Espíritu invisible] hubo accedido, el Espíritu santo fue derramado sobre ella desde la Plenitud entera de ellos. Pues su compañero no se acercó a ella por sí solo, sino por medio de la Plenitud, para corregir la deficiencia de ella. Entonces fue elevada, aunque no hasta su propio eón, sino por encima de su hijo, para que habitara en el Noveno hasta que hubiera corregido su deficiencia.


    8. También salió una voz del elevado eón celestial:


    —Existen el Ser Humano y el Hijo del Ser Humano.[c]


    El arconte principal, Yaltabaot, la oyó y supuso que la voz había venido de su madre, pero no sabía de dónde había venido.


    9. También se los dio a conocer: es decir, la sagrada y perfecta Madre-Padre, la Providencia perfecta, la imagen del Invisible, quien es el Padre del Todo y por medio de quien todo llegó a existir, el Ser Humano primordial; pues hizo visible su semejanza en forma masculina.[d]


    10. Además, todo el eón del arconte principal se estremeció y los cimientos del abismo se movieron. El fondo de las aguas que estaban sobre la materia quedó iluminado por la aparición de aquella imagen que se había hecho visible. Cuando todas las autoridades y el arconte principal miraron, vieron iluminada toda la región que estaba debajo de ellos.


    [a] El testimonio inglés suministrado contiene aquí el indicador editorial «{waters:2}». Se traduce la palabra como «aguas» y se remite a esta nota porque no se ha proporcionado la explicación correspondiente al número.


    [b] El pronombre restaurado «[él]» no tiene un referente seguro en el testimonio suministrado; la frase siguiente identifica explícitamente al Espíritu invisible como quien accede.


    [c] «Ser Humano» traduce aquí *Man* en sentido arquetípico, no meramente a un varón individual. También podría traducirse «el Hombre» y «el Hijo del Hombre».


    [d] La sintaxis y los referentes pronominales del párrafo son difíciles. «Se los dio a conocer» conserva la referencia plural del testimonio sin identificar de manera concluyente al sujeto ni a los destinatarios.'
