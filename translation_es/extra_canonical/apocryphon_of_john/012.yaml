lexical_decisions:
- source_word: moved back and forth
  choice: iba de un lado a otro / ir de un lado a otro
  rationale: Conserva el movimiento oscilante que el propio pasaje define, con una expresión natural en español.
- source_word: Fullness
  choice: la Plenitud
  rationale: Mantiene el sentido técnico cosmológico del término y evita reducirlo a una simple idea de totalidad.
- source_word: aeon
  choice: eón
  rationale: Transliteración ya asentada para la realidad o ámbito cosmológico descrito; «era» sería equívoco en este contexto.
- source_word: chief archon
  choice: arconte principal
  rationale: Conserva el título técnico y expresa la primacía indicada por el adjetivo.
- source_word: garment of darkness
  choice: ropaje de oscuridad
  rationale: Mantiene la metáfora concreta y su tono solemne.
- source_word: deficiency
  choice: deficiencia
  rationale: Preserva el concepto cosmológico sin interpretarlo como pecado, culpa o mera imperfección moral.
- source_word: the Ninth
  choice: el Noveno
  rationale: Mantiene el uso sustantivado y la posible referencia a un ámbito cosmológico, sin añadir «cielo» o «eón».
- source_word: The Man / Primal Man
  choice: el Ser Humano / el Ser Humano primordial
  rationale: Comunica el valor humano arquetípico y evita que «hombre» se entienda únicamente como varón; una nota conserva la alternativa tradicional.
- source_word: Mother-Father
  choice: Madre-Padre
  rationale: Conserva la combinación paradójica y teológicamente significativa sin normalizarla.
- source_word: authorities
  choice: autoridades
  rationale: Conserva el término de rango cosmológico sin identificarlo automáticamente con poderes políticos o demonios.
theological_decisions:
- issue: Identidad del sujeto que accede en el párrafo 7
  choice: Conservar «[él]» y luego «[el Espíritu invisible]», con nota de ambigüedad
  alternative: Identificar ambas menciones sin reserva como el Espíritu invisible o como el compañero
  rationale: El testimonio presenta una restauración y una transición pronominal inciertas; resolverlas ocultaría una ambigüedad textual genuina.
- issue: Naturaleza de la deficiencia de la Madre
  choice: Traducir literalmente «deficiencia»
  alternative: Interpretar como «pecado», «falta» o «caída»
  rationale: El pasaje describe una condición cosmológica y no autoriza por sí solo una equivalencia doctrinal más específica.
- issue: Título «The Man» y «Son of Man»
  choice: «el Ser Humano» y «el Hijo del Ser Humano», con alternativa tradicional en nota
  alternative: «el Hombre» y «el Hijo del Hombre»
  rationale: La opción principal expresa el referente humano primordial y arquetípico, mientras la nota preserva la forma tradicional y la tensión terminológica.
- issue: Relación entre la Madre y su compañero
  choice: «no había estado de acuerdo con ella» y «no se acercó a ella por sí solo»
  alternative: Explicar la relación como unión conyugal, consentimiento ritual o cooperación creadora
  rationale: Se conserva el lenguaje relacional del testimonio sin imponer una reconstrucción doctrinal no explicitada.
- issue: Referentes y sintaxis del párrafo 9
  choice: Mantener una formulación cercana y añadir una nota sobre la incertidumbre
  alternative: Reestructurar el párrafo asignando de forma concluyente sujeto, objeto y aposiciones
  rationale: La traducción inglesa de consulta es sintácticamente ambigua y la revisión directa del copto está pendiente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservan términos cosmológicos técnicos como «Plenitud», «eón» y «arconte», apoyados por el contexto. Los corchetes señalan restauraciones presentes en el testimonio suministrado. Se omitió el número de página manuscrita «14». Dado que la revisión del copto está pendiente, este borrador se fundamenta provisionalmente en el testimonio inglés público y evita resolver sus ambigüedades textuales y pronominales.
