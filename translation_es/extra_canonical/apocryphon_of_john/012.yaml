review_pass:
  verdict: revise
  source_fidelity: 'Se requieren correcciones seguras respecto del testimonio inglés: debe conservarse en el texto el ancla editorial {waters:2}; falta el «¡No!» final del parlamento inicial; el nombre debe ser «Yaltabaoth»; y en §9 «He also taught them» debe traducirse como «También les enseñó», no como «se los dio a conocer». La revisión directa del copto sigue pendiente, por lo que se conservan las ambigüedades de las restauraciones y de la sintaxis.'
  naturalness: El registro es en general claro, moderno y apropiadamente solemne. «Desde la Plenitud entera de ellos» resulta algo literal, pero reproduce una relación posesiva ambigua del testimonio y puede conservarse. «Les enseñó» es más natural y exacto que «se los dio a conocer».
  terminology: 'Se conservan los tecnicismos «Plenitud», «eón», «arconte», «deficiencia» y «Madre-Padre». Para The Man / Son of Man se recomienda «el Hombre» / «el Hijo del Hombre»: refleja de manera más directa el testimonio, mantiene la formulación intertextual establecida y no impide señalar en nota su posible función arquetípica. Se corrige «Yaltabaot» por «Yaltabaoth», conforme al testimonio suministrado.'
  issues:
  - severity: high
    issue: El marcador editorial {waters:2} fue sustituido por una nota [a].
    rationale: El testimonio y la auditoría inglesa indican que este marcador debe preservarse. La nota propuesta no transmite su función como ancla dentro de la cita y añade una explicación editorial no presente en la fuente.
  - severity: medium
    issue: Se omite el «No!» final de §1.
    rationale: 'El rechazo enfático forma parte explícita del parlamento: «..., no!».'
  - severity: high
    issue: «Yaltabaot» no coincide con «Yaltabaoth».
    rationale: Los nombres propios deben seguir el testimonio suministrado, salvo evidencia textual que justifique otra grafía.
  - severity: high
    issue: En §9, «También se los dio a conocer» no traduce «He also taught them».
    rationale: El verbo fuente es «enseñó» y «them» es el destinatario; la redacción propuesta cambia la acción y convierte la lista subsiguiente en objeto dado a conocer.
  - severity: medium
    issue: «Ser Humano» / «Hijo del Ser Humano» se aparta innecesariamente de The Man / Son of Man.
    rationale: Aunque busca explicitar un valor arquetípico, atenúa la expresión masculina y la correspondencia formal del testimonio, que además habla enseguida de «forma masculina». «Hombre» conserva la ambigüedad semántica sin imponer una interpretación.
  revised_text: '**El arrepentimiento de la Madre**


    1. Yo, sin embargo, dije:


    —Señor, ¿qué significa «ella iba de un lado a otro»?


    Él sonrió y dijo:


    —¡No pienses que esto concuerda con lo que dijo Moisés: «sobre las {aguas:2}»! ¡No!


    2. Más bien, cuando ella vio el mal que había ocurrido y el robo que su hijo había cometido, se arrepintió. El olvido la envolvió en medio de la oscuridad de la ignorancia, y comenzó a sentir vergüenza. [No se atrevía] a regresar, sino que [andaba] de un lado a otro.


    3. Este movimiento es «ir de un lado a otro». El orgulloso obtuvo poder de su madre porque, en su ignorancia, suponía que nadie existía aparte de ella.


    4. Sin embargo, cuando vio la multitud de ángeles que había creado, se exaltó por encima de ellos.


    5. Además, cuando la Madre se dio cuenta de que el ropaje de oscuridad era defectuoso, comprendió que su compañero no había estado de acuerdo con ella.


    6. Se arrepintió, llorando copiosamente, y la Plenitud entera escuchó su oración de arrepentimiento. En favor de ella, alabaron al Espíritu invisible y virginal.


    7. Y [él] accedió.[a] Pero cuando [el Espíritu invisible] hubo accedido, el Espíritu santo fue derramado sobre ella desde la Plenitud entera de ellos. Pues no fue que su compañero se acercara a ella por sí solo, sino que se acercó a ella por medio de la Plenitud, para corregir su deficiencia. Fue elevada, aunque no hasta su propio eón, sino por encima de su hijo, para que habitara en el Noveno hasta que hubiera corregido su deficiencia.


    8. También salió una voz del elevado eón celestial:


    —El Hombre existe, y el Hijo del Hombre.[b]


    El arconte principal, Yaltabaoth, la oyó y supuso que la voz había venido de su madre, pero no sabía de dónde había venido.


    9. También les enseñó: es decir, la sagrada y perfecta Madre-Padre, la Providencia perfecta, la imagen del Invisible, quien es el Padre del Todo, por medio de quien todo llegó a existir, el Hombre primordial; pues manifestó su semejanza en forma masculina.[c]


    10. Además, todo el eón del arconte principal se estremeció y los cimientos del abismo se movieron. El fondo de las aguas que estaban sobre la materia quedó iluminado por la aparición de aquella imagen que se había hecho visible. Cuando todas las autoridades y el arconte principal miraron, vieron iluminada toda la región que estaba debajo de ellos.


    [a] El pronombre restaurado «[él]» no tiene un referente seguro en el testimonio suministrado. La frase siguiente nombra explícitamente al Espíritu invisible como quien accede.


    [b] «Hombre» traduce *Man* y puede tener aquí un sentido primordial o arquetípico, además de conservar la expresión «Hijo del Hombre».


    [c] La sintaxis y los referentes pronominales de este párrafo son difíciles. «También les enseñó» conserva el verbo y el destinatario plural del testimonio sin identificar de manera concluyente al sujeto ni precisar la relación sintáctica de todas las expresiones que siguen.'
