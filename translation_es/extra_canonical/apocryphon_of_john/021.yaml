translation:
  language: es
  text: '«Ante ustedes he llevado todo a su término por causa de ustedes. Les he dicho todo esto para que lo escriban y lo transmitan en secreto a sus compañeros espirituales, porque este es el misterio de la raza inconmovible».[a]


    El Salvador también le confió estas palabras para que las pusiera por escrito y las mantuviera bajo resguardo. Le dijo: «Maldito sea cualquiera que entregue estas palabras a cambio de una dádiva, sea comida, bebida, ropa o cualquier otra cosa semejante».


    Estas palabras también le fueron confiadas en misterio. De repente, él desapareció de su presencia. Entonces Juan fue adonde estaban sus compañeros discípulos y les contó lo que el Salvador le había dicho.


    Jesucristo. Amén.


    El escrito secreto según Juan'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La traducción de este pasaje es provisional: se basa en un testimonio inglés de dominio público; está pendiente la revisión directa de los manuscritos coptos. «Raza inconmovible» y «compañeros espirituales» reproducen expresiones técnicas cuyo sentido exacto permanece discutido.'
    reason: Advierte con transparencia la base textual indirecta y preserva la ambigüedad de dos expresiones clave.
lexical_decisions:
- source_word: in your hearing
  choice: Ante ustedes
  rationale: Expresa que la revelación fue pronunciada en presencia de los oyentes sin conservar el giro poco natural «en su oído».
- source_word: companion spirits
  choice: compañeros espirituales
  rationale: Conserva la referencia enigmática a asociados de carácter espiritual y evita identificarla indebidamente con una categoría doctrinal específica.
- source_word: unmoving race
  choice: raza inconmovible
  rationale: Mantiene el término técnico y la imagen de estabilidad del testimonio, sin sustituirla por interpretaciones como «generación perfecta».
- source_word: keep them locked away
  choice: las mantuviera bajo resguardo
  rationale: Comunica custodia y acceso restringido en español natural, sin exigir la imagen literal de una cerradura.
- source_word: trade these sayings for a gift
  choice: entregue estas palabras a cambio de una dádiva
  rationale: Refleja la prohibición de transmitir el texto a cambio de compensación; «dádiva» armoniza con los ejemplos materiales posteriores.
- source_word: in a mystery
  choice: en misterio
  rationale: Preserva la formulación deliberadamente ambigua del testimonio, que puede aludir tanto al secreto como a una revelación mistérica.
- source_word: The Secret Writing According to John
  choice: El escrito secreto según Juan
  rationale: Traduce el título de manera directa y digna; «escrito» evita imponer el género de «evangelio» o «apócrifo».
theological_decisions:
- issue: Identidad de la «raza inconmovible»
  choice: Se conserva la expresión «raza inconmovible».
  alternative: Interpretarla como «generación inmutable», «linaje firme» o un grupo doctrinal específico.
  rationale: El lenguaje pertenece a la terminología propia de la obra y debe retener su tensión conceptual sin explicación confesional añadida.
- issue: Naturaleza de los «compañeros espirituales»
  choice: Se mantiene una designación amplia y enigmática.
  alternative: Identificarlos explícitamente como elegidos, gnósticos, ángeles o creyentes.
  rationale: El testimonio suministrado no resuelve aquí su identidad, por lo que la traducción no debe hacerlo.
- issue: Referente del sujeto que desaparece
  choice: «él desapareció de su presencia», manteniendo el referente implícito como el Salvador por el contexto.
  alternative: Añadir explícitamente «el Salvador desapareció».
  rationale: La formulación conserva la cohesión narrativa sin reforzar más de lo necesario una identificación que el pronombre del testimonio deja gramaticalmente implícita.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el carácter esotérico del pasaje y sus términos técnicos sin añadir categorías denominacionales. Se omitió el número de página manuscrita «32», de acuerdo con la capa inglesa auditada. Se explicitó «Juan» una vez en la narración para evitar una cadena ambigua de pronombres en español; el contexto y el título identifican al destinatario y transmisor.
