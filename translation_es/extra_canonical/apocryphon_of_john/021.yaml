review_pass:
  verdict: revise
  source_fidelity: 'Se requiere corrección. El testimonio inglés mantiene un destinatario singular: «in your hearing», «for your sake», «to you», seguido de «him». El borrador lo cambia a plural («ustedes», «les», «escriban») y añade «Juan», aunque el testimonio conserva el referente sin nombre. También «compañeros espirituales» invierte la construcción de «companion spirits» y puede convertir espíritus en personas; «entregue ... a cambio de una dádiva» atenúa el sentido comercial de «trade».'
  naturalness: La prosa es mayormente clara y de registro adecuado. «En misterio» es comprensible pero menos natural que «en un misterio»; puede mantenerse por su valor técnico ambiguo. «Mantener bajo resguardo» comunica custodia, pero «mantenerlas encerradas» conserva mejor «keep them locked away» sin resultar forzado.
  terminology: Se conservan prudentemente «raza inconmovible» y el título «El escrito secreto según Juan». Para «companion spirits», «espíritus compañeros» conserva la relación gramatical y la ambigüedad del testimonio, aunque suene técnico. «El Salvador» es consistente con el testimonio auditado.
  issues:
  - severity: high
    issue: Cambio del destinatario de singular a plural en el primer enunciado.
    rationale: El inglés suministrado se dirige a una sola persona («your ... your ... you»), y el contexto posterior usa «him». «Ante ustedes», «les» y «escriban» introducen plural no atestiguado.
  - severity: medium
    issue: «Compañeros espirituales» no reproduce con precisión «companion spirits».
    rationale: La frase inglesa designa «spirits» calificados como compañeros; la versión propuesta puede leerse como compañeros humanos de índole espiritual. «Espíritus compañeros» preserva mejor la construcción y evita identificar al grupo.
  - severity: medium
    issue: «Entregue ... a cambio de una dádiva» debilita «trade these sayings for a gift».
    rationale: «Trade» implica comerciar o intercambiar. «Comercie con estas palabras a cambio de un regalo» expresa la prohibición sin añadir una interpretación doctrinal.
  - severity: medium
    issue: Se inserta el nombre «Juan» en la narración.
    rationale: El testimonio dice solamente que él partió hacia sus discípulos compañeros. El título permite reconocer el marco, pero la traducción debe conservar el referente narrativo implícito.
  - severity: low
    issue: «Bajo resguardo» atenúa la imagen de encierro.
    rationale: «Keep them locked away» contiene la noción de mantener los dichos cerrados o encerrados; una formulación más literal sigue siendo natural en español.
  revised_text: '«En tu presencia he terminado todo por tu causa, pero te he dicho todo para que lo pongas por escrito y lo distribuyas en secreto a tus espíritus compañeros, որովհետև este es el misterio de la raza inconmovible».[a]



    El Salvador también le confió estos dichos para que los pusiera por escrito y los mantuviera encerrados, y le dijo: «Maldito sea cualquiera que comercie con estos dichos a cambio de un regalo, ya sea comida, bebida, ropa o cualquier otra cosa semejante».



    Estos dichos también le fueron confiados en un misterio, y de repente desapareció de él. Luego se dirigió a sus discípulos compañeros y les informó lo que el Salvador le había dicho.



    Jesucristo. Amén.



    El escrito secreto según Juan'
  revised_footnotes:
  - marker: a
    text: 'La traducción de este pasaje es provisional: se basa en un testimonio inglés de dominio público; está pendiente la revisión directa de los manuscritos coptos. «Raza inconmovible» y «espíritus compañeros» reproducen expresiones técnicas cuyo sentido exacto permanece discutido.'
    reason: Actualiza la nota para reflejar la traducción revisada de «companion spirits» y mantiene la necesaria transparencia sobre la base textual indirecta.
  revision_rationale: La revisión restituye el destinatario singular, conserva los pronombres y referentes no explicitados del testimonio, y ajusta expresiones clave para reproducir la estructura y el sentido comercial o restrictivo del original inglés. Se retienen sin interpretación confesional los términos técnicos y la ambigüedad de «en un misterio».
