review_pass:
  verdict: revise
  source_fidelity: La versión conserva adecuadamente la secuencia narrativa, los términos técnicos y el carácter reservado del pasaje. Sin embargo, «Ante ustedes» no expresa con precisión «in your hearing», «lo transmitan» atenúa el sentido de distribuir, «bajo resguardo» omite la imagen de mantener bajo llave, y la introducción explícita de «Juan» añade un nombre que no aparece en el texto suministrado.
  naturalness: 'El registro es en general digno y natural. Se mejoran algunos giros para lograr un español latinoamericano más directo sin perder la ambigüedad técnica: «mientras ustedes escuchaban», «lo distribuyan en secreto», «lo mantuviera bajo llave» e «intercambie estas palabras».'
  terminology: Se mantienen «compañeros espirituales», «raza inconmovible», «misterio» y «El escrito secreto según Juan», pues reproducen sin interpretación confesional las expresiones técnicas y el título del testimonio. «El Salvador» se conserva como designación narrativa de la fuente auditada.
  issues:
  - severity: medium
    issue: «Ante ustedes» para «In your hearing»
    rationale: La expresión española indica principalmente presencia, mientras que el original auditado recalca que la declaración fue oída por los destinatarios. «Mientras ustedes escuchaban» conserva mejor ese matiz.
  - severity: medium
    issue: «Lo transmitan» para «distribute them»
    rationale: Transmitir puede referirse simplemente a comunicar o legar. «Lo distribuyan en secreto» mantiene el componente de difusión o reparto presente en el testimonio.
  - severity: medium
    issue: «Bajo resguardo» para «keep them locked away»
    rationale: Aunque expresa custodia, omite la restricción concreta figurada por «locked away». «Bajo llave» conserva ese elemento sin resultar extraño.
  - severity: low
    issue: Adición de «Entonces Juan»
    rationale: El nombre no figura en el texto inglés suministrado. Aunque el contexto lo sugiera, debe mantenerse el referente sin explicitar para no añadir información editorial.
  revised_text: '«Mientras ustedes escuchaban, he terminado todo por causa de ustedes; pero les he dicho todo para que lo escriban y lo distribuyan en secreto a sus compañeros espirituales, porque este es el misterio de la raza inconmovible».[a]



    El Salvador también le confió estas palabras para que las pusiera por escrito y las mantuviera bajo llave. Y le dijo: «Maldito sea quien intercambie estas palabras por una dádiva, ya sea comida, bebida, ropa o cualquier otra cosa semejante».



    Estas palabras también le fueron confiadas en un misterio. De repente, él desapareció de su presencia, y se fue a ver a sus compañeros discípulos y les contó lo que el Salvador le había dicho.



    Jesucristo. Amén.



    El escrito secreto según Juan'
  revised_footnotes:
  - marker: a
    text: 'La traducción de este pasaje es provisional: se basa en un testimonio inglés de dominio público; está pendiente la revisión directa de los manuscritos coptos. «Raza inconmovible» y «compañeros espirituales» reproducen expresiones técnicas cuyo sentido exacto permanece discutido.'
    reason: Advierte con transparencia la base textual indirecta y preserva la ambigüedad de dos expresiones clave.
  revision_rationale: La revisión corrige desviaciones semánticas seguras frente al testimonio inglés, elimina la explicitación editorial de Juan y conserva los términos deliberadamente enigmáticos. No se resuelve la identidad de los compañeros espirituales, de la raza inconmovible ni el alcance técnico de «en un misterio».
