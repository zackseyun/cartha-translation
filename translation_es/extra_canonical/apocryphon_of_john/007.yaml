translation:
  language: es
  text: '**El Apócrifo de Juan — Las cuatro luces**


    1. La Vida eterna, junto con su Voluntad, y la Mente, junto con el Conocimiento anticipado, se presentaron ante el Espíritu invisible y Barbelo y los ensalzaron, pues habían llegado a existir por causa de ella.


    2. El Espíritu santo, junto con Barbelo, también llevó a plenitud al Dios autogenerado, su Hijo, para que este se presentara ante el grande, invisible y virginal Espíritu: el Dios autogenerado, el Cristo, a quien había ensalzado en voz alta.


    3. Él surgió por medio de la Providencia, y el Espíritu invisible y virginal puso al Dios verdaderamente autogenerado sobre el Todo.


    4. También sometió bajo él toda autoridad y dispuso que la Verdad estuviera dentro de él, para que conociera el Todo: él, que recibió un nombre más exaltado que todo nombre. Ese nombre será pronunciado ante quienes sean dignos de él,


    5. porque de la Luz, que es Cristo, y de la Incorruptibilidad, mediante el don del Espíritu y las cuatro [grandes] luces procedentes del Dios autogenerado [...].[a] Él esperó que se presentaran ante él:


    6. las tres: Voluntad, Idea y Vida;


    7. y las cuatro potencias: Entendimiento, Gracia, Percepción y Discernimiento.


    8. Además, la Gracia pertenece al eón de luz Armozel —que es el primer ángel—, y junto con este eón hay otros tres eones: Gracia, Verdad y Forma.


    9. También está la segunda luz, Oriael, que fue puesta sobre el segundo eón.


    10. Junto con él hay otros tres eones: Reflexión, Percepción y Memoria.


    11. La tercera luz es Daveithai, que fue puesta sobre el tercer eón, y junto con él hay otros tres eones: Entendimiento, Amor y Forma ideal.


    12. El cuarto eón fue puesto sobre la cuarta luz, Eleleth.


    13. Junto con él hay otros tres eones: Perfección, Paz y Sabiduría.


    14. Estas son las cuatro luces que se presentan ante el Dios autogenerado.


    15. Estos son los doce eones que se presentan ante el Hijo del Poderoso —el Autogenerado, Cristo— por medio de la voluntad y el don del Espíritu invisible. Los doce eones pertenecen al Hijo autogenerado.


    16. Todo quedó establecido por medio de la voluntad del Espíritu santo y por medio del Autogenerado.'
