lexical_decisions:
- source_word: self-generated
  choice: autogenerado / el Autogenerado
  rationale: Conserva el carácter técnico y la recurrencia del título sin sustituirlo por categorías doctrinales posteriores. Se usa como adjetivo o sustantivo según la construcción.
- source_word: the All
  choice: el Todo
  rationale: La mayúscula indica que no se trata meramente de «todas las cosas», sino de una designación cosmológica global.
- source_word: aeon
  choice: eón
  rationale: Mantiene el término técnico de la cosmología del escrito; traducirlo siempre como «era» oscurecería su posible sentido de entidad o ámbito emanado.
- source_word: light
  choice: luz
  rationale: Reproduce la metáfora y el término cosmológico del testimonio sin imponer «luminaria» como interpretación; el compuesto se vierte «eón de luz».
- source_word: attended
  choice: se presentaron ante / se presenta ante
  rationale: En este contexto expresa la relación de presencia o servicio ante una entidad superior con mayor naturalidad que el ambiguo español «asistir».
- source_word: Precognition
  choice: Conocimiento anticipado
  rationale: Comunica de manera transparente la idea de conocer de antemano y conserva su función como entidad personificada mediante mayúsculas.
- source_word: Indestructibility
  choice: Incorruptibilidad
  rationale: Término natural en el registro religioso y filosófico para una condición imperecedera personificada.
- source_word: Discretion
  choice: Discernimiento
  rationale: En la serie de potencias mentales, «discernimiento» expresa mejor la capacidad de distinguir o juzgar que el moderno «discreción».
- source_word: Sophia
  choice: Sabiduría
  rationale: Traduce el sentido del nombre griego sin ocultarlo tras una transliteración; la mayúscula conserva su carácter personificado.
theological_decisions:
- issue: Identidad y relación entre el Dios autogenerado, el Hijo y Cristo en 2 y 15
  choice: Conservar las aposiciones y la sintaxis tensa del testimonio
  alternative: Reformularlos inequívocamente como una sola persona o como entidades distintas
  rationale: El pasaje permite más de una lectura sintáctica; aclararlo de manera categórica importaría una decisión teológica no exigida por la evidencia suministrada.
- issue: El Espíritu «santo», «invisible» y «virginal»
  choice: Mantener cada calificativo donde aparece
  alternative: Uniformar todas las menciones como «Espíritu Santo»
  rationale: La variación forma parte del perfil conceptual del texto y no debe armonizarse con fórmulas cristianas posteriores.
- issue: Relación entre eones y luces
  choice: Preservar las formulaciones variables de los versículos 8–13
  alternative: Regularizar cada luz como gobernante de su eón
  rationale: El testimonio cambia la dirección de la relación en el versículo 12; corregirla silenciosamente eliminaría una tensión textual genuina.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron las mayúsculas de entidades personificadas y términos cosmológicos. Los nombres Barbelo, Armozel, Oriael, Daveithai y Eleleth se transliteraron. Borrador necesariamente provisional: la base suministrada es un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente.'
