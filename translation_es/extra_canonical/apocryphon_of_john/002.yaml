translation:
  language: es
  text: 'Inmediatamente, [mientras reflexionaba sobre estas cosas], he aquí que [los cielos se abrieron y] la creación [entera] bajo el cielo resplandeció, y [el mundo] se estremeció.


    [Sentí miedo, y he aquí que] vi dentro de la [luz a un niño de pie] junto a mí.


    Mientras [lo contemplaba, se volvió] semejante a un anciano; luego [cambió de] aspecto y se hizo semejante a un hijo[a].


    Lo que estaba ante mí [no era una entidad diversa], sino una [apariencia] de múltiples formas dentro de la [luz]. Las [semejanzas] aparecían unas a través de otras, [y] la [apariencia] tenía tres formas.


    Él me preguntó:


    —Juan, Juan, ¿por qué te maravillas y por qué [tienes] miedo? ¿Acaso todos ustedes desconocen esta apariencia? Quiero decir: no [seas] débil de corazón. Yo soy quien [está] siempre [con todos ustedes]. Yo [soy el Padre], yo soy la Madre, yo soy el Hijo. Yo soy aquel que no ha sido contaminado ni mancillado.


    [Ahora he venido a informarte de] lo que es, [lo que fue] y lo que [sucederá], para que [comprendas las cosas] que (todavía) no se han manifestado [y las que se han manifestado, y para informarte acerca del] [linaje inconmovible del] [Hombre Perfecto].


    [Alza, por tanto] el [rostro, para que] [recibas] las cosas que [te diré] hoy [y] puedas [comunicárselas a los espíritus compañeros] [del] [linaje inconmovible] del [Hombre Perfecto].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado marca «son» («hijo») con una nota cuyo contenido no fue incluido. Se conserva la lectura y se señala el lugar para revisión cuando pueda consultarse directamente el copto y el aparato textual.
    reason: Preservar el marcador textual existente sin inventar el contenido ausente de la nota.
lexical_decisions:
- source_word: lo, the heavens were opened
  choice: he aquí que [los cielos se abrieron]
  rationale: «He aquí» conserva la irrupción visionaria y el tono solemne del testimonio, mientras los corchetes señalan el texto reconstruido.
- source_word: a child
  choice: un niño
  rationale: Mantiene la primera forma de la aparición sin armonizarla con las formas posteriores.
- source_word: a son
  choice: un hijo
  rationale: Conserva la formulación extraña e indefinida del testimonio en vez de identificar silenciosamente la figura como «el Hijo».
- source_word: diverse entity
  choice: entidad diversa
  rationale: 'Retiene la dificultad y ambigüedad del testimonio: una sola presencia puede mostrarse bajo varias formas, sin convertir la frase en una afirmación doctrinal más precisa de lo que permite la base disponible.'
- source_word: appearance
  choice: apariencia
  rationale: Distingue lo que se manifiesta visualmente de una afirmación sobre la esencia de la figura.
- source_word: unmoving race
  choice: linaje inconmovible
  rationale: «Linaje» comunica un grupo o descendencia sin las connotaciones biológicas modernas de «raza»; «inconmovible» conserva el carácter estable o inmóvil del término.
- source_word: Perfect Man
  choice: Hombre Perfecto
  rationale: Se conserva como título técnico con mayúsculas, sin reinterpretarlo como simple madurez moral.
- source_word: companion spirits
  choice: espíritus compañeros
  rationale: Mantiene a «espíritus» como sustantivo y evita la lectura distinta «compañeros espirituales».
theological_decisions:
- issue: Identidad triple de quien habla
  choice: «Yo [soy el Padre], yo soy la Madre, yo soy el Hijo»
  alternative: Reformular la frase en lenguaje trinitario tradicional
  rationale: La traducción conserva la secuencia y la tensión propias del pasaje, sin imponer categorías doctrinales posteriores.
- issue: Unidad y multiplicidad de la aparición
  choice: Una «entidad diversa» frente a una «apariencia» con tres formas
  alternative: Explicar que eran tres personas o una sola persona con tres modos
  rationale: Ninguna de esas explicaciones está exigida por el testimonio suministrado; se preserva la ambigüedad.
- issue: Cambio de singular a plural en el discurso
  choice: «te maravillas», «todos ustedes», «no seas», «con todos ustedes»
  alternative: Uniformar todo el discurso en singular o en plural
  rationale: Se mantienen los cambios de número presentes en el testimonio, aunque resulten abruptos.
- issue: Manifestación futura y presente
  choice: «las cosas que (todavía) no se han manifestado [y las que se han manifestado]»
  alternative: Identificarlas con doctrinas o acontecimientos concretos
  rationale: El referente queda abierto, tal como en la fuente de trabajo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes como indicación de reconstrucciones o lagunas suplidas en el testimonio; los paréntesis en «(todavía)» también se mantuvieron. Se omitió ««2»» por ser un número de página intrusivo del manuscrito, no parte del discurso. Dado que la revisión directa del copto sigue pendiente, las decisiones son provisionales y se apoyan en el testimonio inglés público suministrado.
