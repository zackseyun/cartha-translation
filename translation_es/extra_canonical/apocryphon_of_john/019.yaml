  text: '1. I asked, however, “Lord, where did the vile spirit come from?”


    2. He said to me, “The Mother-Father, who abounds in mercy, the holy Spirit in every form, the one who is merciful and «28» who shows compassion for all of you—that is, the Reflection of Radiant Providence—raised up the seed of the perfect race, its intellect, and the eternal light of the Man.


    3. When the chief archon realized that they were higher than he was in the height and surpassed him in intellect, he wanted to grasp their objective. He did not know that they surpassed him in intellect and that he would be unable to grasp them.


    4. He devised a plot with his authorities, who are his powers, and together they committed adultery with Sophia. Bitter Destiny was begotten by them, the final, unstable fetter. It is of a wavering kind, yet it is more durable and stronger than she with whom the gods joined in adultery, and the angels, and the demons, and all the generations down to the present day. For from that Destiny came all transgression, injustice, blasphemy, the fetter of oblivion and ignorance, every harsh command with grievous transgressions, and overwhelming fears.


    5. In this way all creation was also blinded so that they would not know the God who is over them all. Because of the fetter of oblivion, their sins were hidden, for they are bound by measurements, times, and moments, since it is the universal overlord.


    6. Then he regretted everything that had happened because of him.


    7. This time he conspired to bring a flood «29» upon the products of humanity, but the greatness of radiant Providence informed Noah. Noah preached to all the seed of the children of humanity, but those who were strangers to him did not listen to him.


    8. It was not as Moses said, ‘They hid themselves in an ark.’ Instead, they hid themselves in a place—not only Noah, but also many other people from the unmoving race.


    9. They entered a place and hid themselves within a radiant cloud. He was aware of his authority, and she who belongs to the light accompanied him.


    10. She had shone upon them because he had caused darkness to cover the whole earth, and he devised a plot together with his powers.


    11. He sent his angels to the daughters of men to take some for themselves and to raise up offspring for their pleasure, but at first they were unsuccessful.


    12. When they did not succeed, they gathered again and devised a plot together.


    13. They created a vile spirit resembling the Spirit who had descended, so that through it they might defile souls. The angels transformed their appearance into the appearance of their mates, making them full of the spirit of darkness, which they had mixed together with evil for them.


    14. They presented gold and silver, and gifts of copper and iron, and objects made from every kind of metal. By leading the people who followed them «30» astray with a multitude of tricks, they brought them into great troubles.


    15. They grew old without enjoying any pleasures.


    16. Without discovering the truth and without knowledge of the true God, they died. In this way all creation fell into age-long slavery, lasting from the foundation of the world until now.


    17. They also selected women and fathered children from the darkness according to the likeness of their own spirit. They closed up their hearts and hardened themselves by means of the hardness of the vile spirit, even until now.”'
translation:
  language: es
  text: '1. Sin embargo, yo pregunté: «Señor, ¿de dónde surgió el espíritu vil?»


    2. Entonces él me dijo: «La Madre-Padre, abundante en misericordia, el Espíritu santo en toda forma, quien tiene misericordia y se compadece de todos ustedes —es decir, el Reflejo de la Providencia radiante— levantó la descendencia de la raza perfecta, su inteligencia y la luz eterna del Ser Humano.[a]


    3. Cuando el arconte principal se dio cuenta de que ellos estaban por encima de él en las alturas y lo superaban en inteligencia, quiso comprender su propósito. No sabía que ellos lo superaban en inteligencia y que él no podría comprenderlos.


    4. Tramó un plan con sus autoridades, que son sus poderes, y juntos cometieron adulterio con Sofía. De ellos nació el amargo Destino, la última atadura inestable. Es de naturaleza vacilante, pero es más duradero y fuerte que aquella con quien se unieron en adulterio los dioses, los ángeles, los demonios y todas las generaciones hasta el día de hoy.[b] Pues de ese Destino procedieron toda transgresión, injusticia y blasfemia, la atadura del olvido y la ignorancia, todo mandato severo acompañado de graves transgresiones y temores abrumadores.


    5. De este modo también fue cegada toda la creación para que no conociera al Dios que está por encima de todos. A causa de la atadura del olvido, sus pecados quedaron ocultos, pues están sujetos a medidas, tiempos y momentos, ya que el Destino domina sobre todo.[c]


    6. Entonces él lamentó todo lo que había sucedido por causa suya.


    7. Esta vez conspiró para traer un diluvio sobre las obras de la humanidad, pero la grandeza de la Providencia radiante avisó a Noé. Él predicó a toda la descendencia de los seres humanos, pero quienes eran extraños para él no le hicieron caso.


    8. No sucedió como dijo Moisés: “Se escondieron en un arca”. Más bien, se escondieron en un lugar: no solo Noé, sino también muchas otras personas de la raza inconmovible.[d]


    9. Entraron en un lugar y se ocultaron dentro de una nube radiante. Él tenía conciencia de su autoridad, y la que pertenece a la luz lo acompañó.[e]


    10. Ella había resplandecido sobre ellos, porque él había hecho que la oscuridad cubriera toda la tierra y había tramado un plan junto con sus poderes.


    11. Envió a sus ángeles a las hijas de los seres humanos para que tomaran algunas para sí y engendraran descendencia para su propio placer, pero al principio no tuvieron éxito.


    12. Como no lo consiguieron, volvieron a reunirse y tramaron juntos otro plan.


    13. Crearon un espíritu vil semejante al Espíritu que había descendido, para contaminar por medio de él las almas. Los ángeles transformaron su apariencia en la de las parejas de las mujeres y las llenaron del espíritu de oscuridad que habían mezclado con el mal para ellas.[f]


    14. Les ofrecieron oro y plata, regalos de cobre y hierro, y objetos hechos de toda clase de metal. Con una multitud de engaños extraviaron a quienes los siguieron y los metieron en grandes dificultades.


    15. Envejecieron sin disfrutar de placer alguno.


    16. Murieron sin haber descubierto la verdad ni conocido al Dios verdadero. De este modo, toda la creación cayó en una esclavitud perdurable, desde la fundación del mundo hasta ahora.


    17. Además, escogieron mujeres y engendraron hijos desde la oscuridad, conforme a la semejanza de su propio espíritu. Cerraron sus corazones y se endurecieron mediante la dureza del espíritu vil, hasta el día de hoy».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ser Humano» traduce aquí un título o figura primordial; también podría verterse literalmente «Hombre».
    reason: Aclara el uso técnico sin fijar una identificación doctrinal.
  - marker: b
    text: 'La sintaxis de la comparación es difícil en el testimonio disponible: no queda del todo claro cómo se relacionan «ella», Sofía y el Destino, ni qué elementos dependen de «se unieron».'
    reason: Preserva una ambigüedad real del testimonio y evita presentar la traducción como más segura de lo que es.
  - marker: c
    text: El referente de «domina sobre todo» parece ser el Destino, aunque la formulación pronominal del testimonio es ambigua.
    reason: Documenta una explicitación necesaria para un español natural.
  - marker: d
    text: «Raza inconmovible» es una designación técnica de un grupo espiritual estable o inmutable en la visión del escrito.
    reason: Ayuda al lector a no entender «inconmovible» solo en sentido emocional.
  - marker: e
    text: Los referentes de «él», «su» y «la que pertenece a la luz» no son completamente claros en el testimonio disponible.
    reason: La traducción conserva los pronombres en vez de asignarlos con certeza a Noé, la Providencia u otra figura.
  - marker: f
    text: «Parejas de las mujeres» representa una expresión cuyo referente exacto es incierto; puede aludir a sus esposos o compañeros.
    reason: Señala la dificultad semántica sin ocultarla mediante una paráfrasis dogmática.
lexical_decisions:
- source_word: vile spirit
  choice: espíritu vil
  rationale: Conserva el juicio peyorativo del testimonio sin identificarlo automáticamente con una categoría doctrinal posterior.
- source_word: Mother-Father
  choice: Madre-Padre
  rationale: Mantiene la expresión compuesta y su tensión de género, característica del texto, sin parafrasearla.
- source_word: Reflection of Radiant Providence
  choice: Reflejo de la Providencia radiante
  rationale: Reproduce el título técnico con mayúsculas y evita sustituirlo por una interpretación teológica.
- source_word: Man
  choice: Ser Humano
  rationale: En este contexto funciona como figura primordial o título, no simplemente como varón individual; la mayúscula conserva su valor técnico.
- source_word: chief archon
  choice: arconte principal
  rationale: Se conserva el término técnico «arconte», ampliamente reconocible en textos gnósticos, y se traduce el calificativo jerárquico.
- source_word: Destiny
  choice: Destino
  rationale: La mayúscula señala que el texto lo personifica como poder engendrado y dominador.
- source_word: unmoving race
  choice: raza inconmovible
  rationale: Mantiene la imagen de estabilidad espiritual del término técnico y la formulación colectiva del testimonio.
- source_word: age-long slavery
  choice: esclavitud perdurable
  rationale: Expresa larga duración sin imponer necesariamente la idea de eternidad absoluta.
theological_decisions:
- issue: Identidad y género gramatical de la Providencia
  choice: Se conserva «Providencia» en femenino y se mantienen los cambios pronominales del pasaje cuando son inteligibles.
  alternative: Uniformar todas las referencias como femeninas o atribuirlas expresamente a otra figura.
  rationale: El testimonio presenta referentes pronominales tensos o ambiguos; uniformarlos resolvería indebidamente una dificultad textual o conceptual.
- issue: Relación entre Sofía y el Destino en 4
  choice: Se traduce de forma cercana y se añade una nota sobre la sintaxis incierta.
  alternative: Reformular la frase para afirmar con precisión qué entidad supera a cuál.
  rationale: La comparación del testimonio es gramaticalmente difícil y no conviene imponer una solución no asegurada por la evidencia suministrada.
- issue: Crítica de la versión mosaica del diluvio
  choice: 'Se conserva la negación explícita: «No sucedió como dijo Moisés».'
  alternative: Armonizar el relato con Génesis o suavizarlo como una mera ampliación.
  rationale: La oposición al relato atribuido a Moisés es una afirmación teológica genuina del documento y debe preservarse.
- issue: Alcance del dominio del Destino en 5
  choice: Se explicita «el Destino» como sujeto probable de «domina sobre todo».
  alternative: Mantener únicamente el pronombre «este/ello» o referirlo a otra entidad.
  rationale: El antecedente más cercano en el desarrollo es Destino, pero la nota reconoce que el testimonio tiene un referente pronominal ambiguo.
- issue: Origen de los hijos en 17
  choice: «engendraron hijos desde la oscuridad»
  alternative: «engendraron hijos de las tinieblas» como clasificación ontológica inequívoca.
  rationale: «Desde» conserva la formulación de procedencia sin resolver si la oscuridad es fuente, medio o cualidad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron términos técnicos necesarios («arconte», «Sofía», «Providencia», «Destino») y las tensiones del relato. La presente redacción es provisional porque el material suministrado indica que la revisión directa del copto aún está pendiente; se trabajó desde el testimonio inglés público y la capa de consulta auditada. Se omitieron los números de página manuscrita que interrumpían las oraciones.
