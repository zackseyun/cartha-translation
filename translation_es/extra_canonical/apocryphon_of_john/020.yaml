translation:
  language: es
  text: '1. Por tanto, yo, la Providencia perfecta del Todo, me transformé en mi propia simiente, porque fui la primera en existir. Recorrí todos los caminos, porque soy la riqueza de la luz.


    2. Soy la memoria de la Plenitud. Pero entré en el ámbito de la oscuridad y perseveré hasta llegar al centro de la prisión. Los cimientos del Caos temblaron, y yo me oculté de ellos por causa de su maldad, de modo que no me reconocieron.


    3. Regresé de nuevo por segunda vez y recorrí los alrededores.


    4. Salí de entre los que pertenecen a la luz —la cual soy yo—, pues soy la memoria de la Providencia.


    5. Entré en medio de la oscuridad y en el interior del Hades, ocupándome de mi misión. Los cimientos del Caos temblaron y amenazaron con desplomarse sobre quienes habitan en el Caos y destruirlos. Entonces volví a apresurarme hacia arriba, hacia mi raíz de luz, para que no fueran destruidos antes de tiempo.


    6. Salí incluso por tercera vez: yo, la luz que está dentro de la luz; yo, la memoria de la Providencia. Entré en medio de la oscuridad y en el interior del Hades, y llené mi rostro con la luz de la consumación de su eón.[a] Entré en medio de su prisión, es decir, la prisión del cuerpo,[b] y dije: «Quien oye, que se levante del sueño profundo». Entonces él lloró, y las lágrimas corrieron.


    7. Se secó sus amargas lágrimas y dijo: «¿Quién llama mi nombre? ¿Y de dónde me ha venido esta esperanza, mientras estoy encadenado en la prisión?».


    8. Yo dije también: «Soy la Providencia de la luz pura.


    9. Soy el pensamiento del Espíritu virginal, que te eleva al lugar digno de alabanza.


    10. Levántate y recuerda que tú eres quien prestó atención. Sigue tu raíz, que soy yo, la Misericordiosa. Protégete de los ángeles de la indigencia, de los demonios del Caos y de todos los que te tienden trampas. Cuídate del sueño profundo y del encierro en el interior del Hades».


    11. También lo levanté y lo sellé con la luz del agua de los cinco sellos,[c] para que desde ese momento la Muerte no lo dominara. Y ahora ascenderé al eón perfecto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eón» es un término cosmológico que puede referirse a una era, un ámbito o una entidad del mundo divino. La frase «la consumación de su eón» es difícil y admite más de una interpretación.
    reason: Preservar la ambigüedad de un término técnico y de una construcción oscura del testimonio.
  - marker: b
    text: El testimonio impreso indica que la palabra equivalente a «del» en «la prisión del cuerpo» fue restaurada por los editores debido a una laguna o dificultad textual.
    reason: Representar en nota el marcador editorial ‹of› del testimonio sin entorpecer el texto principal.
  - marker: c
    text: «El agua de los cinco sellos» parece aludir a una acción ritual propia del escrito; este pasaje no la explica con suficiente detalle para identificarla con certeza.
    reason: Evitar una identificación denominacional o sacramental no demostrada por el extracto.
lexical_decisions:
- source_word: Providence
  choice: Providencia
  rationale: Conserva el término personificado y técnico del testimonio, con mayúscula para señalar su función como figura hablante.
- source_word: the all
  choice: el Todo
  rationale: Se mantiene como término cosmológico sustantivado, sin reducirlo a «todo» en sentido meramente distributivo.
- source_word: seed
  choice: simiente
  rationale: «Simiente» conserva tanto el sentido de semilla como la posible dimensión de descendencia u origen, evitando resolver la imagen.
- source_word: Fullness
  choice: Plenitud
  rationale: Equivalente tradicional y comprensible del término cosmológico, conservado como nombre técnico mediante mayúscula.
- source_word: chaos
  choice: Caos
  rationale: Se trata como ámbito o poder cosmológico personificado, conforme al contexto.
- source_word: Hades
  choice: Hades
  rationale: Se translitera el nombre del ámbito de los muertos para no identificarlo sin más con el infierno de tradiciones posteriores.
- source_word: aeon
  choice: eón
  rationale: Se conserva el tecnicismo cosmológico, pues «era» o «mundo» resolverían indebidamente su alcance.
- source_word: angels of destitution
  choice: ángeles de la indigencia
  rationale: Traducción relativamente formal que conserva la extraña categoría del texto; «indigencia» comunica carencia extrema sin introducir una interpretación doctrinal.
- source_word: sealed
  choice: sellé
  rationale: Mantiene el lenguaje ritual del pasaje sin explicarlo ni asociarlo a un rito denominacional concreto.
theological_decisions:
- issue: Identidad y género de la voz hablante
  choice: Concordancia femenina con «Providencia» («la primera», «la Misericordiosa»)
  alternative: Usar masculino por identificar a la voz con el Salvador
  rationale: El pasaje presenta explícitamente a la voz como la Providencia; la concordancia gramatical española preserva esa presentación sin imponer una identificación cristológica masculina no explicitada aquí.
- issue: Naturaleza del «Hades»
  choice: Conservar «Hades»
  alternative: Traducir «infierno» o «mundo de los muertos»
  rationale: La transliteración mantiene abierta la cosmología propia del escrito y evita importar concepciones posteriores del castigo eterno.
- issue: La prisión y el cuerpo
  choice: «la prisión del cuerpo» con nota sobre la restauración textual
  alternative: Parafrasear que el cuerpo es intrínsecamente malo
  rationale: Se conserva la metáfora del testimonio sin convertirla en una afirmación doctrinal más extensa de lo que permite el texto.
- issue: Los cinco sellos
  choice: Mantener la expresión ritual sin explicación confesional
  alternative: Identificarla con bautismo, unción u otro sacramento específico
  rationale: La referencia es teológicamente significativa pero ambigua en este extracto; no debe resolverse desde una tradición posterior.
- issue: Amenaza de destrucción en el Caos
  choice: «amenazaron con desplomarse... y destruirlos»
  alternative: Atribuir inequívocamente a la Providencia la intención de destruirlos
  rationale: La sintaxis del testimonio es ambigua; esta formulación mantiene la conexión más inmediata con los cimientos que tiemblan sin convertirla en una declaración sobre la voluntad destructiva de la voz hablante.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron con mayúscula los principales términos cosmológicos personificados o técnicos: Providencia, Todo, Plenitud, Caos y Muerte. La traducción es provisional porque el material suministrado declara pendiente la revisión directa del copto; por ello se sigue críticamente el testimonio inglés público y se señalan las restauraciones y ambigüedades relevantes. Se eliminó el número de página manuscrita «31», que interrumpía la oración.'
