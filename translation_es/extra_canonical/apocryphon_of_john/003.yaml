translation:
  language: es
  text: '1. [También] pedí [comprenderlo, y él me dijo]: «La Mónada[a] [es una unidad sin nada] superior a ella.


    2. [Es aquella que existe] como [Dios] y como Padre del Todo, [el invisible], que está por encima del [Todo, que existe como] incorruptibilidad, [como] luz pura que ningún [ojo] puede contemplar.


    3. Él [es el] [Espíritu] invisible, de quien no es apropiado [pensar] como un dios ni como algo semejante, porque es más que un dios, pues nada existe por encima de él y nadie lo gobierna.


    4. [Esto se debe a que él] no [existe] dentro de nada subordinado [a él, pues todo] existe dentro de él, porque él es quien se estableció [a sí mismo].


    5. [Él es eterno], pues no necesita [nada], porque [él] es perfección completa.


    6. [Nada le faltaba] que necesitara para ser perfeccionado por [ello].


    7. [Antes bien], es por siempre completamente perfecto en [luz].


    8. Es [ilimitado], pues no existe nadie [antes que él] que pudiera ponerle límites.


    9. Es insondable, [pues no] existe antes que él nadie que pudiera [sondearlo].


    10. [Está] más allá de toda medida, pues nadie [existió antes que él que pudiera medirlo].


    11. [Es invisible, pues nadie] lo ha visto.


    12. [Es eterno], pues [existe] eternamente.


    13. Es [inefable, pues] nadie existió que pudiera concebirlo para hablar [de él].


    14. No puede ser nombrado, pues [nadie existió antes que él] que pudiera [darle nombre].


    15. Es [luz sin medida], pura, santa, [sin mancha].


    16. Es inefable y [existe en perfecta] incorruptibilidad.


    17. (Existe) [no] (confinado) dentro de la perfección, ni dentro de la bienaventuranza, ni dentro de la divinidad, sino muy por encima (de ellas).


    18. No es corpóreo [ni] incorpóreo.


    19. No es grande [ni] pequeño.


    20. [Es imposible] decir que tiene cantidad o [que tiene cualidad], porque nadie puede [comprenderlo].


    21. No es un ser entre [los seres, sino que está] muy por encima, [no] como [si fuera más elevado], sino (que es elevado) en sí mismo.


    22. No [participa] ni en los eones[b] ni en la temporalidad, porque quien participa en [un eón] establecido previamente [...].


    23. [No] le fue no asignada una medida temporal,[c] [pues] no recibe nada de otro, [porque lo recibiría] como préstamo; pues quien existe antes que otro [no necesita] aceptar (nada) de [otro].


    24. Esto se debe a que él es quien se contempla a sí mismo, esperando, en [su] luz, pues el [...] es glorioso.


    25. A él le pertenece una pureza sin medida.


    26. Es un eón que otorga eones.


    27. Es [vida] que otorga vida.


    28. Es un bienaventurado que otorga bienaventuranza.


    29. Es conocimiento que otorga conocimiento.


    30. [Es] bondad que otorga bondad.


    31. [Es] misericordia y redención [que otorgan misericordia].


    32. Es gracia que otorga gracia,


    33. [no] porque le pertenezca, sino porque otorga [la luz] que está más allá de toda medida y comprensión.


    34. [¿Cómo podré hablarte] de él, [pues] su [eón] está más allá de la destrucción, en reposo y permaneciendo en [silencio, descansando], existente antes de [todo, porque él] es el guía de [todos] los eones [y] quien les concede fuerza mediante su bondad?»


    [a] «Mónada» significa aquí la realidad única y suprema, sin nada por encima de ella.

    [b] «Eones» puede referirse a realidades o ámbitos eternos; el término se conserva por su sentido técnico en este escrito.

    [c] El texto transmitido contiene una difícil doble negación, que se conserva para no resolver una lectura incierta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Mónada» significa aquí la realidad única y suprema, sin nada por encima de ella.
    reason: Aclara un término filosófico técnico poco usual sin sustituirlo por una interpretación reductora.
  - marker: b
    text: «Eones» puede referirse a realidades o ámbitos eternos; el término se conserva por su sentido técnico en este escrito.
    reason: Preserva la polisemia cosmológica y temporal de «aeon».
  - marker: c
    text: El texto transmitido contiene una difícil doble negación, que se conserva para no resolver una lectura incierta.
    reason: Advierte al lector de una dificultad textual genuina en vez de enmendarla silenciosamente.
lexical_decisions:
- source_word: monad
  choice: Mónada
  rationale: Se conserva el término técnico, aclarado en nota, porque «unidad» por sí sola perdería su función como designación de la realidad suprema.
- source_word: the All
  choice: el Todo
  rationale: Mantiene la expresión cosmológica totalizante y su posible carácter técnico.
- source_word: indestructibility
  choice: incorruptibilidad
  rationale: Es una formulación digna y natural en español religioso y expresa una condición no sujeta a corrupción o destrucción.
- source_word: unspeakable
  choice: inefable
  rationale: Comunica que no puede expresarse adecuadamente con palabras sin sugerir mera prohibición de hablar.
- source_word: aeon
  choice: eón
  rationale: Conserva la ambigüedad técnica entre duración eterna, ámbito y entidad; una nota orienta al lector sin fijar un único sentido.
- source_word: somatic / non-somatic
  choice: corpóreo / incorpóreo
  rationale: Reproduce de manera natural y simétrica la negación paradójica de ambas categorías.
- source_word: blessedness
  choice: bienaventuranza
  rationale: Distingue el estado abstracto de la simple felicidad y mantiene el registro filosófico-religioso.
theological_decisions:
- issue: La afirmación de que el Espíritu invisible es «más que un dios»
  choice: Se traduce literalmente «más que un dios».
  alternative: «Superior a Dios» o «más que Dios».
  rationale: El artículo indefinido del testimonio suministrado mantiene la comparación apofática sin identificar sin más el referente con una formulación doctrinal posterior.
- issue: Negaciones apofáticas de corporeidad e incorporeidad
  choice: 'Se conservan ambas: «No es corpóreo ni incorpóreo».'
  alternative: Parafrasear como «trasciende toda forma de existencia».
  rationale: La paradoja es teológicamente significativa y no debe resolverse mediante explicación interpretativa.
- issue: Doble negación en el párrafo 23
  choice: Se conserva de forma marcada y se explica en nota.
  alternative: Regularizar como «No le fue asignada una medida temporal».
  rationale: El testimonio declara que la lectura es difícil; corregirla silenciosamente ocultaría la incertidumbre textual.
- issue: Relación con perfección, bienaventuranza y divinidad
  choice: Se conserva que no está «confinado dentro» de ellas, sino por encima.
  alternative: Afirmar simplemente que «trasciende» esos atributos.
  rationale: La formulación concreta preserva la tensión entre atribuir esas cualidades y negar que lo contengan.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno, con sintaxis accesible. Se preservan corchetes, paréntesis y elipsis como señales de reconstrucción, aclaración o laguna del testimonio suministrado. Se omiten los números de página insertos en el cuerpo («3», «4») porque no forman parte de la sintaxis. Borrador necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto sigue pendiente.'
