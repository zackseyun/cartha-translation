translation:
  language: es
  text: '1. También le pregunté al Salvador:


    —Señor, ¿serán entonces conducidas a salvo todas las almas hasta la luz pura?


    2. Él me respondió:


    —Grandes cuestiones han surgido en tu mente, pues es difícil explicárselas a otros, excepto a los que pertenecen a la raza inconmovible.[a]


    3. Aquellos sobre quienes repose el Espíritu de vida y a quienes él fortalezca serán salvados y llegarán a ser perfectos. Serán dignos de la Grandeza, y allí serán purificados de todo mal y de toda participación en el mal.


    4. Por tanto, puesto que no tendrán otra preocupación que la indestructibilidad, en la cual fijarán su atención desde ese momento, sin ira, envidia, celos, deseo ni codicia alguna, nada los inquietará salvo la condición de la existencia en la carne. La sobrellevarán aguardando con esperanza el momento en que los recibidores les den la bienvenida.[b]


    5. Tales personas, pues, son dignas de la vida eterna e indestructible y de la elección, porque resisten y soportan todas las cosas, a fin de completar la contienda y heredar la vida eterna.


    6. Le pregunté:


    —Señor, las almas de aquellos que no hayan realizado estas obras, pero sobre quienes haya descendido el poder ‹y› el Espíritu de vida, ¿serán [rechazadas]?[c]


    7. Él me respondió:


    —Si el Espíritu descendió sobre ellas, a pesar de eso serán salvadas y se corregirán, porque el poder descenderá sobre todas las personas, pues sin él nadie puede resistir.


    8. Sin embargo, después de que nazca, a medida que el Espíritu de vida crezca y el poder llegue y fortalezca a esa alma, nadie podrá desviarla mediante obras malas.[d]


    9. Pero aquellos sobre quienes desciende el espíritu falso son arrastrados por él y desviados.


    10. Yo le pregunté:


    —Señor, cuando sus almas hayan salido de la carne, ¿adónde irán?


    11. Él sonrió y me dijo:


    —El alma en la cual el poder llegue a ser más fuerte que el espíritu vil —pues es fuerte y huye del mal— será salvada, incluso por la intervención del Indestructible, y elevada hasta el reposo de los eones.[e]


    12. Yo le pregunté:


    —Señor, ¿dónde habitarán las almas de quienes ignoraban a quién pertenecían?


    13. Él me dijo:


    —Cuando el espíritu vil se fortaleció en ellos, se desviaron. Este oprime el alma y la arrastra a obras malas; la arroja al olvido y, después de que sale del cuerpo, es entregada a las autoridades que surgieron por medio del arconte.[f] Ellas la atan con cadenas, la arrojan en prisión y la acompañan hasta que despierta del olvido y alcanza el conocimiento. Si de este modo llega a ser perfecta, será salvada.


    14. Yo le pregunté:


    —Señor, ¿cómo puede el alma hacerse más pequeña y volver al estado natural de su madre o entrar en el ser humano?[g]


    15. Él se alegró cuando le hice esta pregunta y me dijo:


    —En verdad eres dichoso, porque has llegado a comprender que se hará que tal alma siga a otra persona en quien habita el Espíritu de vida.[h]


    16. Será salvada por medio de él.


    17. No será arrojada de nuevo en otra carne.


    18. También pregunté:


    —Señor, ¿adónde irán las almas de quienes sí conocieron, pero se apartaron?


    19. Él me dijo:


    —Serán llevadas al lugar adonde van los ángeles de la indigencia, el lugar donde no hay arrepentimiento. Allí serán retenidas hasta el día en que sean atormentados quienes blasfemaron contra el Espíritu, y serán castigadas con un castigo de duración eónica.[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Raza inconmovible» es una expresión técnica del escrito. También podría traducirse «linaje inamovible» o «generación inconmovible».
    reason: La frase es conceptualmente cargada y no debe confundirse con una categoría étnica moderna.
  - marker: b
    text: «Recibidores» parece designar a seres o agentes que reciben a las almas. El término exacto deberá confirmarse mediante revisión del copto.
    reason: La traducción literal resulta inusual en español, pero puede preservar un título técnico.
  - marker: c
    text: Los signos ‹ › indican una inserción editorial y los corchetes [ ] una restauración incierta en el testimonio utilizado.
    reason: Se preservan explícitamente las señales críticas proporcionadas por la fuente.
  - marker: d
    text: 'La referencia de «después de que nazca» no es clara en el testimonio: podría referirse al alma, al Espíritu o al proceso descrito.'
    reason: La sintaxis heredada es ambigua y no debe resolverse sin cotejo directo del copto.
  - marker: e
    text: Los «eones» son realidades o ámbitos de la cosmología del escrito, además de poder expresar edades o períodos.
    reason: Ayuda al lector sin sustituir el término técnico por una interpretación.
  - marker: f
    text: «Arconte» significa gobernante o autoridad y aquí funciona como término técnico para una potestad cósmica.
    reason: Aclara un préstamo poco común manteniendo su carácter especializado.
  - marker: g
    text: La formulación «estado natural de su madre» y «entrar en el ser humano» es difícil y admite otras reconstrucciones o traducciones.
    reason: El testimonio inglés es oscuro y la revisión de la lengua fuente está pendiente.
  - marker: h
    text: «Siga a otra persona» traduce una expresión difícil que también podría entenderse como «suceda a otra» o «sea puesta en lugar de otra».
    reason: Evita presentar como segura una interpretación específica del tránsito del alma.
  - marker: i
    text: Literalmente, un castigo relacionado con una «edad» o un «eón»; la expresión por sí sola no resuelve aquí la duración exacta.
    reason: Preserva la ambigüedad teológica y temporal del testimonio.
lexical_decisions:
- source_word: unmoving race
  choice: raza inconmovible
  rationale: Conserva la expresión técnica y extraña del testimonio sin reinterpretarla como un grupo denominacional o moral.
- source_word: indestructibility
  choice: indestructibilidad
  rationale: Mantiene el sustantivo abstracto y su función conceptual en el pasaje.
- source_word: receivers
  choice: recibidores
  rationale: Preserva el posible sentido técnico de agentes celestiales que reciben a las almas; una traducción más idiomática podría ocultarlo.
- source_word: Greatness
  choice: Grandeza
  rationale: La mayúscula refleja que probablemente funciona como título o realidad trascendente, sin especificar una identidad no explícita.
- source_word: aeons
  choice: eones
  rationale: Se translitera el término cosmológico técnico en vez de reducirlo a «edades» o «eternidad».
- source_word: archon
  choice: arconte
  rationale: Se conserva el título técnico de la cosmología del escrito; «gobernante» sería posible, pero menos preciso en este contexto.
- source_word: age-long punishment
  choice: castigo de duración eónica
  rationale: Conserva la relación léxica con «eón» y evita resolver la cuestión de si la duración es eterna o limitada a una edad.
- source_word: false/vile spirit
  choice: espíritu falso / espíritu vil
  rationale: Se mantiene la distinción del testimonio entre dos designaciones inglesas, pendiente de cotejo copto.
theological_decisions:
- issue: Destino de quienes recibieron el Espíritu pero no realizaron las obras
  choice: «a pesar de eso serán salvadas y se corregirán»
  alternative: «serán salvadas de todos modos y cambiarán»
  rationale: Conserva la tensión entre salvación, conducta y reforma sin armonizarla con un sistema soteriológico posterior.
- issue: Retorno del alma a otra carne
  choice: Se conserva el lenguaje de sucesión, salvación mediante otra persona y no ser arrojada otra vez en otra carne
  alternative: Interpretarlo explícitamente como reencarnación o como una experiencia meramente espiritual
  rationale: El pasaje sugiere un proceso corporal sucesivo, pero su sintaxis y mecanismo son difíciles; no se impone una doctrina más precisa que el testimonio.
- issue: Intervención del Indestructible
  choice: «incluso por la intervención del Indestructible»
  alternative: «por la intervención del Indestructible»
  rationale: Se conserva la partícula intensiva del testimonio y la identidad titular sin identificarla de forma denominacional.
- issue: Duración del castigo final
  choice: «castigo de duración eónica»
  alternative: «castigo eterno» o «castigo temporal»
  rationale: La traducción mantiene abierta la extensión semántica de la expresión y su vínculo con los eones.
- issue: Género de Espíritu
  choice: Pronombre masculino cuando aparece como agente personal
  alternative: Concordancia femenina con la palabra española «fuerza» o formulación impersonal
  rationale: «Espíritu» es masculino en español y el testimonio lo presenta como agente; no se extraen conclusiones ontológicas adicionales.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usó diálogo con raya y sintaxis moderadamente formal. El borrador es necesariamente provisional porque el material suministrado es un testimonio público en inglés y la revisión directa de los códices coptos está pendiente. Se eliminaron los números de página manuscrita «26» y «27», pero se conservaron las marcas editoriales ‹and›/[rejected] en español como ‹y›/[rechazadas].
