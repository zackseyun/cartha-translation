status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: La revisión se limita necesariamente al testimonio inglés suministrado; no se proporcionó texto copto para un cotejo directo. El borrador conserva en general la secuencia, los términos técnicos y las incertidumbres editoriales del testimonio. Se requieren correcciones puntuales para no introducir referentes ausentes («del cuerpo» en v. 13), para reflejar mejor la sintaxis temporal de v. 19 («para/el día», no «hasta el día») y para evitar una interpretación excesiva de la sucesión del alma en vv. 15–16.
  naturalness: El registro es adecuado para español latinoamericano neutral. Se mejora «recibidores» por «receptores», se aligera alguna sintaxis y se conserva la extrañeza deliberada donde el testimonio es oscuro.
  terminology: Se mantienen «Salvador», «Espíritu de vida», «Grandeza», «indestructibilidad», «eones» y «arconte». «Raza inconmovible» se conserva como traducción técnica provisional, con nota que impide leerla como categoría étnica moderna. «Castigo eónico» preserva la ambigüedad de age-long sin decidir entre duración eterna o limitada.
  issues:
  - severity: medium
    issue: v. 13 añade «después de que sale del cuerpo».
    rationale: El testimonio dice solamente «after it departs»; aunque el antecedente probable es el alma, «del cuerpo» es una explicitación no presente en la redacción auditada.
  - severity: medium
    issue: v. 15 traduce «will be made to succeed another» como «siga a otra persona».
    rationale: «Seguir» y «persona» interpretan de más una expresión oscura. Conviene conservar la noción de sucesión sin identificar con seguridad al referente como persona.
  - severity: medium
    issue: v. 19 convierte «they will be detained for the day» en «serán retenidas hasta el día».
    rationale: «Hasta» puede implicar liberación al llegar ese día, matiz que no está expresado por el testimonio. «Para el día» conserva mejor la construcción sin resolver su función.
  - severity: low
    issue: v. 4 usa «no tendrán otra preocupación» frente al presente «they have no concern».
    rationale: El presente caracteriza a ese grupo; «no tienen» refleja mejor el testimonio, mientras que el futuro se mantiene donde este aparece.
  - severity: low
    issue: «Recibidores» es poco natural en español actual.
    rationale: «Receptores» mantiene el posible carácter técnico y resulta más reconocible; la nota conserva la cautela sobre su identificación.
