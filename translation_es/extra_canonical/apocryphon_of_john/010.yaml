review_pass:
  verdict: revise
  source_fidelity: Se requiere revisión. La primera oración del borrador convierte «grasped» en «tomó una chispa», asignando indebidamente «una chispa resplandeciente» como objeto de «tomó»; el testimonio la vincula con la creación de los eones. También cambia el presente «exists ... now» y «is inside him» por pasados. La traducción de Harmas como «el malvado» no conserva «the evil», y la hispanización selectiva de Athoth/Sabaoth se aparta sin necesidad de las formas del testimonio.
  naturalness: La prosa puede ser natural y sobria sin resolver las irregularidades editoriales. «Se asombró en el orgullo que está dentro de él» conserva la construcción conceptual del testimonio, aunque resulta algo marcada. La anomalía entre corchetes debe permanecer claramente visible.
  terminology: «eones», «autoridades», «Hades» y «profundidades» son elecciones adecuadas. Deben conservarse Athoth y Sabaoth como en el testimonio auditado; Caín y Abel pueden mantenerse en sus formas españolas convencionales. «El mal» es más fiel que «el malvado».
  issues:
  - severity: high
    issue: La primera oración añade que él tomó la chispa.
    rationale: El testimonio dice que «grasped and created ... further aeons with a shining spark»; no identifica de forma segura la chispa como el objeto tomado. La versión propuesta reestructura el pasaje de una manera interpretativa.
  - severity: medium
    issue: 'Se sustituyen presentes del testimonio por pasados: «había» y se atenúa «existe ... ahora».'
    rationale: El texto suministrado dice «that exists (even) now» y «pride that is inside him». Deben mantenerse el presente y el énfasis temporal, incluida la cautela editorial de «(aún)».
  - severity: medium
    issue: «el malvado» traduce interpretativamente «the evil» y convierte la notación anómala en una frase española resuelta parcialmente.
    rationale: Conviene conservar «el mal» y reproducir la notación «[{ojo:1}]» sin pretender determinar su función antes de revisar el copto.
  - severity: low
    issue: Athoth y Sabaoth fueron hispanizados selectivamente.
    rationale: Dado que los demás nombres se transliteran según el testimonio y no se aporta base textual para el cambio, es más consistente conservar Athoth y Sabaoth.
  revised_text: '1. Él tomó y creó para sí otros eones con una chispa resplandeciente que existe (aún) ahora. Se asombró en el orgullo que está dentro de él y engendró para sí autoridades.


    4. El primero tiene el nombre de Athoth, a quien las generaciones llaman [el Segador].[a]


    5. El segundo es Harmas, [siendo] el mal [{ojo:1}].[b]


    6. El tercero es Kalila-Oumbri.


    7. El cuarto es Yabel.


    8. El quinto es Adonaiou, llamado Sabaoth.


    9. El sexto es Caín, a quien las generaciones de los seres humanos llaman el Sol.


    10. El séptimo es Abel.


    11. El octavo es Abrisene.


    12. El noveno es Yobel.


    13. El décimo es Armoupieel.


    14. El undécimo es Melcheir-Adonein.


    15. El duodécimo es Belias, quien está sobre las profundidades del Hades.[c]'
  revised_footnotes:
  - marker: a
    text: «El Segador» aparece entre corchetes en el testimonio utilizado, lo que señala una restitución o incertidumbre textual.
    reason: Preserva de manera visible el carácter editorial de la expresión suministrada.
  - marker: b
    text: El testimonio conserva aquí la notación anómala «[{ojo:1}]» después de «el mal»; se reproduce sin resolverla, a la espera de una revisión directa del copto.
    reason: Evita convertir una señal editorial o una lectura incierta en texto seguro.
  - marker: c
    text: «Hades» designa aquí el ámbito inferior; no se traduce como «infierno» para no imponer una equivalencia teológica posterior.
    reason: Conserva la terminología y la ambigüedad histórica del pasaje.
  revision_rationale: La revisión conserva la secuencia y las ambigüedades del testimonio inglés suministrado. En particular, evita decidir qué objeto «tomó» el sujeto en la primera oración, mantiene los presentes y el inciso «(aún)», y conserva sin normalizar la lectura editorialmente problemática de Harmas. Se preservan los corchetes, la notación incrustada y los anclajes de notas; se omite ««11»» conforme a la auditoría inglesa, que lo identifica como paginación manuscrita.
