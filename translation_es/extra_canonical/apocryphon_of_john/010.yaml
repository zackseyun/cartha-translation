translation:
  language: es
  text: '1. Él tomó una chispa resplandeciente que existe todavía ahora y, con ella, creó para sí otros eones. Quedó maravillado por el orgullo que había en su interior y engendró autoridades para sí.


    4. El primero se llama Atot, a quien las generaciones llaman [el Segador].[a]


    5. El segundo es Harmas, [que es] el malvado [{ojo:1}].[b]


    6. El tercero es Kalila-Oumbri.


    7. El cuarto es Yabel.


    8. El quinto es Adonaiou, llamado Sabaot.


    9. El sexto es Caín, a quien las generaciones humanas llaman el Sol.


    10. El séptimo es Abel.


    11. El octavo es Abrisene.


    12. El noveno es Yobel.


    13. El décimo es Armoupieel.


    14. El undécimo es Melcheir-Adonein.


    15. El duodécimo es Belias, quien está sobre las profundidades del Hades.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «El Segador» aparece entre corchetes en el testimonio utilizado, lo que señala una restitución o incertidumbre textual.
    reason: Preservar de manera visible el carácter editorial de la expresión suministrada.
  - marker: b
    text: El testimonio conserva aquí la notación anómala «[{ojo:1}]» después de «el malvado»; se reproduce sin resolverla, a la espera de una revisión directa del copto.
    reason: Evitar convertir una señal editorial o una lectura incierta en texto seguro.
  - marker: c
    text: «Hades» designa aquí el ámbito inferior; no se traduce como «infierno» para no imponer una equivalencia teológica posterior.
    reason: Conservar la terminología y la ambigüedad histórica del pasaje.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Conserva el término técnico propio de la cosmología del escrito, en vez de reducirlo a «edades» o «mundos».
- source_word: authorities
  choice: autoridades
  rationale: Mantiene el sentido de seres o potestades gobernantes sin identificarlo interpretativamente con «arcontes» cuando el testimonio suministrado dice «authorities».
- source_word: generations of humanity
  choice: generaciones humanas
  rationale: Expresa el referente colectivo de manera natural e inclusiva, sin añadir una interpretación sobre linajes concretos.
- source_word: deeps
  choice: profundidades
  rationale: Reproduce la imagen espacial en plural y evita convertirla en una designación doctrinal más específica.
- source_word: Hades
  choice: Hades
  rationale: Conserva el nombre tradicional del ámbito inferior y no lo equipara sin más con «infierno».
- source_word: shining spark
  choice: chispa resplandeciente
  rationale: Mantiene la imagen luminosa concreta del testimonio.
theological_decisions:
- issue: Naturaleza de los eones y las autoridades
  choice: Conservar «eones» y «autoridades» como categorías distintas
  alternative: Interpretarlos como mundos, ángeles, demonios o arcontes
  rationale: El pasaje presenta categorías cosmológicas cuya identidad precisa no debe resolverse mediante terminología confesional añadida.
- issue: Belias y el Hades
  choice: «quien está sobre las profundidades del Hades»
  alternative: «quien gobierna el infierno»
  rationale: La traducción elegida preserva la relación expresada y evita identificar Hades con el infierno teológico posterior.
- issue: Asombro y orgullo de Yaltabaot
  choice: «Quedó maravillado por el orgullo que había en su interior»
  alternative: «Se admiró orgullosamente de sí mismo»
  rationale: Conserva la tensión y la sintaxis conceptual del testimonio sin precisar indebidamente el objeto de su asombro.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Los nombres se conservan según el testimonio, salvo Atot y Sabaot, formas hispanizadas de uso extendido; Caín y Abel siguen sus formas tradicionales en español. La redacción es provisional porque no se ha realizado aún la revisión directa de los manuscritos coptos. Se eliminaron los números ««11»» por entenderse como paginación manuscrita, de acuerdo con la capa inglesa auditada; se conservaron los corchetes y la notación editorial anómala.
