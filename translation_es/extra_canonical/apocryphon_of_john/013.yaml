  text: '2. Further, they created by means of their individual powers, in accordance with their allotted attributes. Each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension).


    9. However, the host of angels attended him, and they obtained from the authorities the seven substances of the life-soul, so that they could create the sizes of the limbs and the sizes of the torso, and the proper functioning of all the parts with one another.


    10. … However, those especially at work in the limbs are these: the head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shinbone, Aroer; the left shinbone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: es
  text: '**El apócrifo de Juan — Las autoridades crean a Adán**


    1. Además, por medio de la luz vieron en el agua la forma de la imagen, y él dijo a las autoridades que lo acompañaban: «Vengan, creemos un ser humano según la imagen de Dios y según nuestra semejanza, para que su imagen se convierta en luz para nosotros».


    2. Entonces crearon mediante sus poderes individuales, de acuerdo con los atributos que se les habían asignado. Cada autoridad aportó un atributo valiéndose de la forma de la imagen que había visto en su dimensión psíquica.[a]


    3. Él creó un ser conforme a la semejanza del Hombre Primordial perfecto, y ellos dijeron: «Llamémoslo Adán, para que su nombre se convierta para nosotros en un poder de luz». Entonces los poderes comenzaron su labor:


    4. El primero, {Bondad:2}, creó un hueso viviente; y el segundo, Providencia, creó un tendón viviente.


    5. El tercero, Divinidad, creó carne viviente; y el cuarto, Señorío, creó médula viviente.


    6. El quinto, Reino, creó sangre viviente.


    7. El sexto, Celos, creó piel viviente.


    8. El séptimo, Entendimiento, creó cabello viviente.


    9. Pero la multitud de los ángeles lo asistió, y ellos recibieron de las autoridades las siete sustancias del alma vital,[b] para poder determinar las dimensiones de las extremidades y del torso, y hacer que todas las partes funcionaran debidamente unas con otras.


    10. El primero comenzó a crear la cabeza. Eteraphaope-Abron creó su cabeza; Meniggesstroeth, el cerebro; Asterechmen, el ojo derecho; Thaspomocham, el ojo izquierdo; Yeronumos, la oreja derecha; Bissoum, la oreja izquierda; Akioreim, la nariz; Banen-Ephroum, los labios; Amen, los dientes; Ibikan, las muelas; Basiliademe, las amígdalas; Achcha, la úvula; Adaban, el cuello; Chaaman, las vértebras; Dearcho, la garganta; Tebar, el hombro derecho; N[..., el] hombro izquierdo; Mniarchon, el codo derecho; [...e, el] codo izquierdo; Abilrion, la axila derecha; Evanthen, la axila izquierda; Krys, la mano derecha; Beluai, la mano izquierda; Treneu, los dedos de la mano derecha; Balbel, los dedos de la mano izquierda; Kriman, las uñas de las manos; Astrops, el pecho derecho; Barroph, el pecho izquierdo; Baoum, la articulación del hombro derecho; Ararim, la articulación del hombro izquierdo; Areche, el vientre; Phthave, el ombligo; Senaphim, el abdomen; Arachethopi, las costillas derechas; Zabedo,
    las costillas izquierdas; Barias, la cadera derecha; Phnouth, la cadera izquierda; Abenlenarchei, la médula; Chnoumeninorin, los huesos; Gesole, el estómago; Agromauma, el corazón; Bano, los pulmones; Sostrapal, el hígado; Anesimalar, el bazo; Thopithro, los intestinos; Biblo, los riñones; Roeror, los tendones; Taphreo, la columna vertebral; Ipouspoboba, las venas; Bineborin, las arterias; a Aatoimenpsephei le corresponde el aliento de cada miembro; Entholleia, toda la carne; Bedouk, la {parte inferior derecha:6}; Arabeei, el pene izquierdo; Eilo, el gemelo; Sorma, los genitales; Gorma-Kaiochlabar, el muslo derecho; Nebrith, el muslo izquierdo; Pserem, los riñones de la pierna derecha; Asaklas, el riñón izquierdo; Ormaoth, la pierna derecha; Emenun, la pierna izquierda; Knyx, la tibia derecha; Tupelon, la tibia izquierda; Achiel, la rodilla derecha; Phneme, la rodilla izquierda; Phiouthrom, el pie derecho; Boabel, sus dedos; Trachoun, el pie izquierdo; Phikna, sus dedos; Miamai, las
    uñas de los pies; Labernioum, [...].[c]


    Los encargados de todas estas partes son siete: Athoth, Armas, Kalila, Jabel, Sabaoth, Caín y Abel. Pero los que actúan especialmente en los miembros son estos: en la cabeza, Diolimodraza; en el cuello, Yammeax; en el hombro derecho, Yakoubib; en el hombro izquierdo, Yerton; en la mano derecha, Oudidi; en la izquierda, Arbao; en los dedos de la mano derecha, Lampno; en los de la izquierda, Leekaphar; en el pecho derecho, Barbar; en el izquierdo, Imae; en el tórax, Pisandraptes; en la articulación del hombro derecho, Koade; en la del izquierdo, Odeor; en las costillas derechas, Asphixix; en las izquierdas, Synogchouta; en el vientre, Arouph; en el útero, Sabalo; en el muslo derecho, Charcharb; en el izquierdo, Chthaon; en todos los genitales, Bathinoth; en la pierna derecha, Choux; en la izquierda, Charcha; en la tibia derecha, Aroer; en la izquierda, Toechtha; en la rodilla derecha, Aol; en la izquierda, Charaner; en el pie derecho, Bastan; en sus dedos, Archentechtha; en el pie izquierdo,
    Marephnounth; en sus dedos, Abrana.


    11. Los que ejercen poder sobre todos ellos son siete: Michael, Ouriel, Asmenedas, Saphasatoel, Aarmouriam, Richram y Amiorps.


    12. Además, los que gobiernan las facultades son estos: Archendekta gobierna los sentidos; Deitharbathas, la percepción; Oummaa, la imaginación; Aachiaram, la proporción; y Riaramnacho, todos los impulsos.


    13. El origen de los demonios que habitan en todo el cuerpo se divide en cuatro: calor, frío, humedad y sequedad.


    14. La madre de todos ellos es la materia. El que gobierna el calor es Phloxopha; el que gobierna el frío, Oroorrothos; el que gobierna la sequedad, Erimacho; y el que gobierna la humedad, Athuro.


    15. La madre de todos estos, Onorthochras, está en medio de ellos, porque es ilimitada y se mezcla con todos. Ella es verdaderamente la materia, pues los nutre.


    16. Los cuatro demonios principales son estos: Ephememphi, que corresponde al placer; Yoko, al deseo; Nenentophni, a la tristeza; y Blaomen, al miedo.


    17. La madre de todos ellos es Esthensis-Ouch-Epi-Ptoe.


    18. De los cuatro demonios surgieron las pasiones. De la tristeza proceden la envidia, los celos, el infortunio, la aflicción, el dolor, la crueldad, la ansiedad, el lamento y otras cosas semejantes.


    19. Del placer surgen mucha maldad, arrogancia vacía y cosas semejantes.


    20. Del deseo proceden la ira, la furia, la amargura, la pasión amarga, la insatisfacción constante y cosas semejantes.


    21. Del miedo proceden el terror, el servilismo, la miseria y la humillación.


    22. Todas estas cosas se asemejan tanto a lo virtuoso como a lo vicioso.


    23. Pero el conocimiento de su verdadera naturaleza proviene de Anaro, jefe del alma material,[d] pues corresponde a los siete sentidos, a Ouch-Epi-Ptoe.[e]


    24. Este es el número de los ángeles: en total son 365.


    25. Todos trabajaron en él, miembro por miembro, hasta terminar tanto el cuerpo psíquico como el cuerpo material.


    26. Además de estos, hay otros que gobiernan las demás pasiones.


    27. Aunque no te los he enumerado, si quieres saber quiénes son, todo esto está escrito en el *Libro de Zoroastro*.


    [a] «Psíquica» conserva un término técnico que, en este contexto, designa una dimensión vinculada al alma; no significa simplemente «psicológica».


    [b] La expresión del testimonio, «alma vital», parece relacionar estas siete sustancias con la vida animada del cuerpo.


    [c] En esta extensa lista hay lagunas y varias lecturas oscuras o aparentemente anómalas. Los corchetes, puntos suspensivos y llaves reproducen esas dificultades en el testimonio disponible.


    [d] «Material» traduce aquí el término técnico «hílico», es decir, perteneciente a la materia.


    [e] La relación sintáctica entre Anaro, los siete sentidos y Ouch-Epi-Ptoe es incierta en el testimonio disponible.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Psíquica» conserva un término técnico que, en este contexto, designa una dimensión vinculada al alma; no significa simplemente «psicológica».
    reason: Evitar que el lector moderno entienda el término en su sentido clínico habitual.
  - marker: b
    text: La expresión del testimonio, «alma vital», parece relacionar estas siete sustancias con la vida animada del cuerpo.
    reason: Aclarar una expresión cosmológica inusual sin resolver su significado técnico más allá de la evidencia.
  - marker: c
    text: En esta extensa lista hay lagunas y varias lecturas oscuras o aparentemente anómalas. Los corchetes, puntos suspensivos y llaves reproducen esas dificultades en el testimonio disponible.
    reason: Señalar la condición textual de formas como «N[...]», «{parte inferior derecha:6}» y otras designaciones anatómicas problemáticas.
  - marker: d
    text: «Material» traduce aquí el término técnico «hílico», es decir, perteneciente a la materia.
    reason: Hacer accesible el tecnicismo y preservar al mismo tiempo su identidad conceptual.
  - marker: e
    text: La relación sintáctica entre Anaro, los siete sentidos y Ouch-Epi-Ptoe es incierta en el testimonio disponible.
    reason: Preservar una ambigüedad real del testimonio en vez de imponer una reconstrucción.
lexical_decisions:
- source_word: psychic
  choice: psíquico / psíquica
  rationale: Se conserva el término técnico para distinguir la dimensión o cuerpo del alma de lo meramente material, evitando reducirlo a «psicológico».
- source_word: hylic
  choice: material
  rationale: Expresa en español corriente el sentido técnico de aquello que pertenece a la materia; una nota identifica explícitamente el término «hílico».
- source_word: life-soul
  choice: alma vital
  rationale: Mantiene la composición y la posible distinción cosmológica del testimonio sin sustituirla por una categoría doctrinal más familiar.
- source_word: authorities
  choice: autoridades
  rationale: Conserva la designación jerárquica del relato y evita identificar sin apoyo a estos seres con una clase denominacionalmente definida.
- source_word: powers
  choice: poderes
  rationale: Mantiene la diferenciación léxica respecto de «autoridades» presente en el testimonio.
- source_word: Primal Man
  choice: Hombre Primordial
  rationale: Refleja el título cosmológico y su carácter arquetípico con mayúsculas, sin equipararlo de manera interpretativa con otra figura.
- source_word: passions
  choice: pasiones
  rationale: Conserva la categoría moral y afectiva antigua, que en el pasaje abarca impulsos y afecciones perjudiciales.
- source_word: staphyle
  choice: úvula
  rationale: Es el equivalente anatómico natural en español dentro de la lista de partes de la boca y la garganta.
theological_decisions:
- issue: Alusión a Génesis 1:26
  choice: «según la imagen de Dios y según nuestra semejanza»
  alternative: Armonizar exactamente con una traducción bíblica española determinada
