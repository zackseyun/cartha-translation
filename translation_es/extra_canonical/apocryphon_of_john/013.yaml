    Zabedo, las costillas izquierdas; Barias, la cadera derecha; Phnouth, la cadera izquierda; Abenlenarchei, la médula; Chnoumeninorin, los huesos; Gesole, el estómago; Agromauma, el corazón; Bano, los pulmones; Sostrapal, el hígado; Anesimalar, el bazo; Thopithro, los intestinos; Biblo, los riñones; Roeror, los tendones; Taphreo, la columna vertebral; Ipouspoboba, las venas; Bineborin, las arterias; a Aatoimenpsephei le corresponde el aliento en cada miembro; Entholleia, toda la carne; Bedouk, la {parte inferior derecha:6}; Arabeei, el pene izquierdo; Eilo, el gemelo; Sorma, los genitales; Gorma-Kaiochlabar, el muslo derecho; Nebrith, el muslo izquierdo; Pserem, los riñones de la pierna derecha; Asaklas, el riñón izquierdo; Ormaoth, la pierna derecha; Emenun, la pierna izquierda; Knyx, la tibia derecha; Tupelon, la tibia izquierda; Achiel, la rodilla derecha; Phneme, la rodilla izquierda; Phiouthrom, el pie derecho; Boabel, sus dedos; Trachoun, el pie izquierdo; Phikna, sus dedos; Miamai,
    las uñas de los pies; Labernioum, [...].[c]


    Los encargados de todas estas partes son siete: Athoth, Armas, Kalila, Jabel, Sabaoth, Caín y Abel. Pero los que actúan especialmente en los miembros son estos: en la cabeza, Diolimodraza; en el cuello, Yammeax; en el hombro derecho, Yakoubib; en el hombro izquierdo, Yerton; en la mano derecha, Oudidi; en la izquierda, Arbao; en los dedos de la mano derecha, Lampno; en los de la izquierda, Leekaphar; en el pecho derecho, Barbar; en el izquierdo, Imae; en el tórax, Pisandraptes; en la articulación del hombro derecho, Koade; en la del izquierdo, Odeor; en las costillas derechas, Asphixix; en las izquierdas, Synogchouta; en el vientre, Arouph; en el útero, Sabalo; en el muslo derecho, Charcharb; en el izquierdo, Chthaon; en todos los genitales, Bathinoth; en la pierna derecha, Choux; en la izquierda, Charcha; en la tibia derecha, Aroer; en la izquierda, Toechtha; en la rodilla derecha, Aol; en la izquierda, Charaner; en el pie derecho, Bastan; en sus dedos, Archentechtha; en el pie izquierdo,
