    24. Este es el número de los ángeles: en total son 365.


    25. Todos trabajaron en él, miembro por miembro, hasta que terminaron tanto el cuerpo psíquico como el cuerpo hílico.


    26. Además de estos, hay otros que gobiernan las pasiones restantes.


    27. Aunque no te los he enumerado, si quieres saber quiénes son, todo esto está escrito en el *Libro de Zoroastro*.'
