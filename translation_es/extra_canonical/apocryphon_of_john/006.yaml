translation:
  language: es
  text: '1. Él también contempló a Barbelo con la luz pura que rodea al Espíritu invisible y con su centella; y ella concibió de él.


    2. Él engendró una centella de luz por medio de una luz semejante a la bienaventuranza, aunque esta no es igual a su grandeza.


    3. Así surgió el Unigénito de la Madre-Padre: era su único descendiente, el Unigénito del Padre, la luz pura.


    4. El Espíritu invisible y virginal también se alegró por la luz que había llegado a existir, la que había procedido del primer poder de su Providencia, es decir, Barbelo.


    5. Y lo ungió con su unción hasta que llegó a ser perfecto, sin que le faltara nada de la unción, pues lo había ungido con la unción del Espíritu invisible. Él lo asistió mientras derramaba sobre él; y tan pronto como recibió del Espíritu, alabó al Espíritu santo y a la Providencia perfecta, por cuya causa había procedido.


    6. También pidió que le diera un colaborador, que es la Mente, y él accedió con agrado.


    7. Cuando el Espíritu invisible accedió, la Mente se presentó y asistió a Cristo —el Ungido—, alabándolo a él y a Barbelo. Todos ellos llegaron a morar dentro del silencio.


    8. La Mente también quiso realizar algo por medio del Logos[a] del Espíritu invisible. Su voluntad, que estaba en potencia, se hizo realidad y se presentó con la Mente y la Luz, alabándolo.


    9. Y el Logos siguió a la Voluntad, porque por medio del Logos Cristo, el Dios autogenerado,[b] creó el Todo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Logos» puede significar palabra, discurso, razón o principio racional. Se conserva el término griego para no limitar aquí su sentido.
    reason: Aclarar un término técnico deliberadamente no traducido.
  - marker: b
    text: «Autogenerado» traduce una designación técnica del ser divino que procede por sí mismo; también podría verterse «autoengendrado».
    reason: Registrar una alternativa léxica relevante sin imponer una interpretación ontológica más precisa que el testimonio.
  - marker: c
    text: «El Todo» designa aquí la totalidad de lo existente o el conjunto del cosmos.
    reason: Explicar el sentido técnico de la expresión sustantivada.
lexical_decisions:
- source_word: Barbelo
  choice: Barbelo
  rationale: Se conserva como nombre técnico propio de la figura emanada, sin sustituirlo por una interpretación doctrinal.
- source_word: light-spark / spark
  choice: centella de luz / centella
  rationale: «Centella» comunica una emanación luminosa pequeña y viva, y mantiene la relación léxica entre ambas apariciones.
- source_word: Mother-Father
  choice: Madre-Padre
  rationale: Se preserva la formulación paradójica y de género doble del testimonio, sin normalizarla como «Padre y Madre».
- source_word: only-begotten
  choice: Unigénito
  rationale: Término español tradicional y conciso que expresa la condición de único engendrado; la mayúscula señala su uso titular en este contexto.
- source_word: Providence
  choice: Providencia
  rationale: Se mantiene como entidad o potencia personificada, indicada por la mayúscula y posteriormente identificada con Barbelo.
- source_word: Mind
  choice: Mente
  rationale: Traducción directa del término técnico noético; la mayúscula conserva su carácter hipostático o personificado.
- source_word: Logos
  choice: Logos
  rationale: Se translitera para conservar su amplitud semántica —palabra, razón o principio articulador— y evitar resolverla mediante una sola equivalencia.
- source_word: the All
  choice: el Todo
  rationale: Expresa la totalidad cósmica como concepto técnico y evita el matiz más cotidiano de «todo» en minúscula.
theological_decisions:
- issue: Identidad del sujeto que engendra y unge
  choice: Conservar los pronombres masculinos y la secuencia del testimonio sin sustituirlos repetidamente por nombres propios.
  alternative: Explicitar en cada cláusula «el Espíritu invisible», «Barbelo» o «Cristo».
  rationale: El texto transmitido presenta referentes pronominales potencialmente ambiguos; explicitarlos resolvería de manera interpretativa una tensión genuina.
- issue: Cristo como «Dios autogenerado»
  choice: Mantener «Cristo, el Dios autogenerado».
  alternative: Reformular como «el Cristo divino, generado por sí mismo» o armonizarlo con categorías cristológicas posteriores.
  rationale: La expresión pertenece a la cosmología propia de la obra y debe conservarse sin corrección confesional.
- issue: Relación entre Logos y Cristo en la creación
  choice: Mantener la sintaxis según la cual Cristo crea el Todo por medio del Logos.
  alternative: Identificar directamente a Cristo con el Logos mediante una aposición no explícita.
  rationale: El pasaje distingue gramaticalmente al Logos de Cristo; no conviene importar una identificación sistemática externa.
- issue: Perfección mediante la unción
  choice: Traducir que «llegó a ser perfecto» y no le faltaba nada de la unción.
  alternative: Atenuarlo como «fue manifestado perfecto» para evitar la idea de adquisición.
  rationale: La formulación fuente vincula la perfección con la unción y conserva una tensión teológica que no debe neutralizarse.
- issue: Voluntad potencial y actual
  choice: Expresar que la voluntad «estaba en potencia» y «se hizo realidad».
  alternative: Simplificar como «su deseo se cumplió».
  rationale: La versión más formal conserva la distinción metafísica entre potencia y actualización presente en el testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos técnicos personificados con mayúscula inicial y la ambigüedad pronominal donde el testimonio no identifica inequívocamente al referente. Dado que la revisión directa del copto está pendiente, este borrador se basa de manera provisional en el testimonio inglés público suministrado; se omitió el número de página intrusivo «7».
