  revision_rationale: La revisión conserva el carácter provisional de una traducción basada en el testimonio inglés público, dado que no se ha proporcionado todavía una base copta para control directo. Corrige omisiones y una puntuación que altera la estructura sintáctica, y restituye donde corresponde la ambigüedad pronominal del testimonio. Se ha eliminado el número de página intrusivo, como ya indicaban las notas de preparación.
