  revision_rationale: Se corrigen el error de corchetes y la estructura interrogativa del v. 6, se recupera en el v. 8 la pregunta por la clase del eón y se realizan ajustes léxicos menores para mayor cercanía al testimonio inglés. Se preservan tanto la incertidumbre textual marcada por corchetes como las preguntas abiertas sobre el Padre y el eón.
