translation:
  language: es
  text: '1. La enseñanza [del] Salvador, [la revelación] de los misterios y [las] palabras ocultas en el silencio, [es decir, estas palabras que] él enseñó a Juan, [su] discípulo.


    2. [Sin embargo, un día] sucedió que Juan, [el hermano] de Santiago —ellos eran hijos de Zebedeo—, había subido al templo. Entonces un fariseo llamado Arimanios [se acercó] a él [y] le preguntó: «¿[Dónde] está tu maestro, [a quien] seguías?».


    3. Él le [respondió]: «Ha regresado al [lugar] de donde [vino]».


    4. El fariseo [le dijo: «Con engaños, ese nazareno] los embaucó a todos ustedes, les llenó [los oídos de mentiras] y les cerró [el corazón, apartándolos] de las tradiciones [de sus antepasados]».


    5. [Cuando] yo, [Juan], oí estas palabras, [me alejé] del templo [hacia un lugar desierto lleno de montañas] y me lamenté [profundamente en mi corazón, preguntándome]:


    6. «¿Cómo [fue] designado el Salvador? ¿Por qué fue enviado [al mundo] por [su Padre]? ¿Y quién es su] Padre, el que [lo envió]? ¿Y qué clase] de eón[a] es [aquel al que iremos]?


    7. Pues ¿qué quiso decir [cuando nos dijo]: “El eón al [que ustedes irán] es un eón [indestructible]”?


    8. [Sin embargo, no] nos explicó [cómo es]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eón» puede significar una era o edad, pero en este escrito también puede designar un ámbito o realidad supramundana. Se conserva el término para no reducir su sentido.
    reason: Aclarar un término técnico cuya ambigüedad es relevante para la cosmología y la teología del pasaje.
lexical_decisions:
- source_word: savior
  choice: Salvador
  rationale: Conserva el título religioso del testimonio y emplea la forma española tradicional y clara.
- source_word: sayings
  choice: palabras
  rationale: En este contexto introductorio, «palabras» resulta más natural que «dichos» y puede abarcar enseñanzas o declaraciones.
- source_word: appointed
  choice: designado
  rationale: Preserva la idea de una asignación o investidura sin precisar indebidamente quién la efectuó ni su modalidad.
- source_word: dispatched
  choice: enviado
  rationale: Es el equivalente natural en español y conserva la relación de comisión expresada en el pasaje.
- source_word: aeon
  choice: eón
  rationale: Mantiene el término técnico y su amplitud semántica, que puede referirse a una era, ámbito o realidad supramundana.
- source_word: traditions of your fathers
  choice: tradiciones de sus antepasados
  rationale: Expresa de manera neutral e inclusiva el sentido ancestral de la frase, sin perder su carácter tradicional.
theological_decisions:
- issue: Identidad y naturaleza del Padre del Salvador
  choice: 'Se conserva la pregunta abierta: «¿quién es su Padre?»'
  alternative: Identificar o explicar al Padre conforme a una doctrina posterior
  rationale: El texto presenta la identidad del Padre como un misterio que Juan todavía no comprende; resolverlo borraría la tensión narrativa y teológica.
- issue: Sentido de «eón»
  choice: Se translitera «eón» y se añade una nota explicativa
  alternative: Traducir solo «mundo», «edad» o «eternidad»
  rationale: Ninguna de esas opciones por sí sola conserva todo el campo semántico y cosmológico del término en este escrito.
- issue: Destino expresado como «el eón al que iremos»
  choice: Se mantiene el movimiento hacia un eón indestructible
  alternative: Parafrasearlo como «vida eterna» o «cielo»
  rationale: Esas paráfrasis impondrían categorías más específicas que el pasaje no formula.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes para señalar texto dañado o reconstruido editorialmente en los manuscritos. La redacción es provisional porque el material suministrado depende de un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente. Se usaron «ustedes» y formas correspondientes para un registro regionalmente neutral.
