translation:
  language: es
  text: 'Todos los ángeles y demonios trabajaron hasta formar el cuerpo psíquico.[a] Pero su creación permaneció completamente inerte e inmóvil durante mucho tiempo.


    Cuando la madre quiso recuperar el poder que había concedido al arconte principal, suplicó al misericordiosísimo Madre-Padre del Todo.


    Mediante el decreto sagrado, este envió las cinco luces al lugar de los ángeles del arconte principal. Ellas le aconsejaron que hiciera salir el poder de la madre y le dijeron a Yaltabaot: «Sopla de tu Espíritu en su rostro, y su cuerpo se pondrá en pie». Él sopló su Espíritu en el rostro del hombre; este Espíritu es el poder de su madre.


    Yaltabaot no se daba cuenta de lo que hacía, pues existe en la ignorancia. Entonces el poder de la madre salió de él y entró en el cuerpo psíquico que habían formado a imagen del que existe desde el principio.


    El cuerpo se movió, cobró fuerza y resplandeció. En ese momento, las demás potestades sintieron envidia, pues el hombre había llegado a existir por medio de todas ellas, y ellas le habían dado su poder. Su inteligencia superaba la de quienes lo habían formado y también la del arconte principal.


    Cuando vieron que resplandecía, que podía razonar mejor que ellas y que estaba libre de maldad, lo levantaron y lo arrojaron a la región más baja de toda la materia.


    Pero el Bendito, el Madre-Padre, bondadoso y misericordioso, tuvo compasión del poder de la madre que había salido del gobernante principal, pues ellos podían llegar a dominar el cuerpo psíquico y sensible. Por medio de su Espíritu bondadoso y de su gran misericordia, envió a Adán una ayudante: la Reflexión luminosa, que procede de él y recibe el nombre de «Vida».[b]


    Ella ayuda a toda la creación: trabaja junto con Adán, lo restaura a su perfección, le enseña acerca del descenso de su descendencia y le muestra el camino de ascenso, el mismo camino por el que esta descendió.


    Además, la Reflexión de luz permaneció oculta dentro de Adán, para que los arcontes no supieran de ella y para que esa Reflexión corrigiera la deficiencia de la madre. El hombre se hizo visible por causa de la sombra de luz que había en su interior, y su inteligencia superó la de todos los que lo habían formado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Psíquico» se conserva como término técnico del pasaje; aquí no equivale de manera inequívoca a «espiritual» ni a «mental».
    reason: Ayuda al lector moderno sin cerrar el sentido antropológico especializado.
  - marker: b
    text: El testimonio consultado identifica a esta figura con el nombre «Vida».
    reason: Sustituye el marcador editorial «{Life:1}» del testimonio por una nota legible, sin incorporarlo como si formara parte del texto antiguo.
lexical_decisions:
- source_word: psychic body
  choice: cuerpo psíquico
  rationale: Conserva el término antropológico distintivo del testimonio sin reducirlo a «cuerpo espiritual» o «alma», opciones que resolverían indebidamente su sentido técnico.
- source_word: chief archon
  choice: arconte principal
  rationale: Mantiene «arconte» como título técnico y traduce el calificativo con una expresión comprensible y neutral.
- source_word: Mother-Father of the All
  choice: Madre-Padre del Todo
  rationale: Preserva la expresión compuesta, su tensión de género y el sentido cosmológico de «el Todo».
- source_word: Radiant Reflection / Reflection of Light
  choice: Reflexión luminosa / Reflexión de luz
  rationale: Mantiene la personificación femenina y la variación verbal del testimonio, sin sustituirla por un término doctrinal más especializado.
- source_word: light-shadow
  choice: sombra de luz
  rationale: Conserva la imagen paradójica del texto en vez de normalizarla como mera luz o resplandor.
- source_word: powers
  choice: potestades
  rationale: Distingue a estos seres o poderes personificados del «poder» de la madre y emplea un término digno y comprensible en contexto religioso.
theological_decisions:
- issue: Naturaleza del «cuerpo psíquico»
  choice: Se conserva la expresión técnica sin explicarla dentro del texto.
  alternative: Traducir «cuerpo animado», «cuerpo del alma» o «cuerpo natural».
  rationale: Las alternativas inclinan la interpretación hacia sistemas antropológicos concretos y reducen una ambigüedad importante del testimonio.
- issue: Identidad y género del Madre-Padre
  choice: Se mantiene el título compuesto «Madre-Padre» y se usan las referencias gramaticales exigidas por cada oración sin deshacer el compuesto.
  alternative: Normalizarlo como «Padre-Madre», «Dios» o exclusivamente masculino/femenino.
  rationale: El título deliberadamente compuesto forma parte de la caracterización teológica del pasaje.
- issue: Razón de la compasión en la oración sobre el dominio del cuerpo
  choice: «pues ellos podían llegar a dominar» conserva la relación causal y la referencia plural sin añadir una finalidad explícita.
  alternative: «para impedir que ellos dominaran» o «a fin de que dominaran».
  rationale: El testimonio suministrado presenta una construcción ambigua; explicitar prevención o propósito resolvería una tensión que la evidencia disponible no permite zanjar.
- issue: Procedencia de la Reflexión luminosa
  choice: «que procede de él» sigue la referencia masculina del testimonio al benefactor.
  alternative: Hacer que proceda de Adán o de la madre.
  rationale: No se reasigna el antecedente para armonizar el relato con una reconstrucción doctrinal externa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se favorecieron oraciones claras sin borrar la terminología cosmológica ni las imágenes paradójicas. El número de página intrusivo «20» fue omitido. Este borrador se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa de los manuscritos coptos, por lo que no se afirman retroversiones léxicas coptas específicas.
