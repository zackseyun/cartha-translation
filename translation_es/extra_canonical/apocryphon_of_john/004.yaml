translation:
  language: es
  text: '1. Esto se debe a que [no] [comprendemos las cosas indecibles ni] comprendemos lo que [no puede medirse], excepto aquel que se originó [de] él, es decir, [el] Padre, porque él [solo] es quien nos lo [explicó], puesto que es quien se contempla a sí [mismo] dentro de la luz que lo rodea, es decir, el manantial [de] agua viva. Él es quien abastece [a cada eón] y, en todas las direcciones a la vez, [contempla] su imagen al mirar fijamente en el manantial del [Espíritu].[a]


    2. Él es quien deposita su deseo dentro de su [agua]-luz, [que habita en el] manantial del [agua de luz pura] que lo rodea; y [su pensamiento, hasta entonces potencial, se hizo] realidad, y ella se acercó, [es decir], la que había [aparecido] ante él dentro [del resplandor de] su luz.


    3. Esta es la primera [potencia, que existía] antes que el Todo y [que emanó] de su mente.[b]


    4. Ella [es la Providencia del Todo] —su luz [resplandece como la] luz de él—, la [perfecta] potencia que es [la] imagen del perfecto Espíritu invisible y virginal.


    5. [La primera potencia] es la gloria de Barbelo, la gloria perfecta dentro de los eones, la gloria de la revelación.[c]


    6. Ella exaltó al Espíritu virginal y lo alabó, porque por causa de él había emanado.


    7. Este es el primer pensamiento, la imagen de él.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El pasaje está muy deteriorado y reconstruido entre corchetes. No es del todo seguro si el sujeto «se contempla a sí mismo» o contempla a otro.
    reason: Advertir la incertidumbre textual y sintáctica que afecta la interpretación.
  - marker: b
    text: «El Todo» es un término cosmológico que aquí abarca la totalidad de las realidades o eones.
    reason: Aclarar un término técnico sin sustituirlo por una interpretación más estrecha.
  - marker: c
    text: El manuscrito contiene en este punto la indicación de página «5», que no forma parte de la oración.
    reason: Documentar la omisión editorial indicada en el testimonio inglés.
lexical_decisions:
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico cosmológico, ya asentado en español, en vez de reducirlo a «era» o «mundo».
- source_word: spring
  choice: manantial
  rationale: Expresa una fuente de agua viva de manera natural y mantiene la imaginería del pasaje.
- source_word: power
  choice: potencia
  rationale: En este contexto designa una realidad o entidad primordial, no solo capacidad o fuerza; «potencia» conserva mejor ese valor técnico.
- source_word: Providence
  choice: Providencia
  rationale: La mayúscula señala que funciona como designación personificada de Barbelo.
- source_word: the All
  choice: el Todo
  rationale: Se mantiene como término cosmológico colectivo y no se explicita como «universo».
- source_word: issued forth / came forth
  choice: emanó / había emanado
  rationale: «Emanar» comunica la procedencia de una realidad divina sin imponer la idea de creación material.
- source_word: Barbelo
  choice: Barbelo
  rationale: Se translitera el nombre propio tradicional sin interpretarlo.
theological_decisions:
- issue: Identidad del que se originó del Padre
  choice: «aquel que se originó [de] él»
  alternative: Identificarlo explícitamente como Hijo o Cristo
  rationale: El fragmento no lo nombra aquí; se preserva la referencia ambigua sin añadir una identificación doctrinal.
- issue: Autorreflexión divina
  choice: «se contempla a sí [mismo]»
  alternative: «lo estudia» o «lo conoce»
  rationale: La construcción del testimonio es difícil; «se contempla» armoniza con la imagen posterior de mirar su propia imagen sin resolver por completo la metafísica.
- issue: Personificación femenina del pensamiento
  choice: Se conservan «ella» y las formas femeninas
  alternative: Neutralizar como una facultad impersonal
  rationale: El texto presenta el pensamiento o primera potencia como figura femenina vinculada con Barbelo.
- issue: Relación entre Barbelo y el Espíritu virginal
  choice: «por causa de él había emanado»
  alternative: «él la había creado»
  rationale: Se mantiene la formulación de procedencia sin convertirla en una afirmación explícita de creación.
- issue: «Primer pensamiento» y «su imagen»
  choice: «Este es el primer pensamiento, la imagen de él»
  alternative: «Ella es el primer pensamiento y su imagen»
  rationale: Se conserva el cambio de demostrativo y la posible tensión gramatical del testimonio, evitando uniformarlo silenciosamente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes como señales de lagunas o restauraciones editoriales. La traducción es provisional porque no se proporcionó el texto copto para una revisión directa; se basa en el testimonio inglés público suministrado y mantiene su ambigüedad donde el texto está dañado.
