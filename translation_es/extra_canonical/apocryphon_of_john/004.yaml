    2. Él es quien deposita su deseo dentro de su [agua]-luz, [que habita en el] manantial de [luz pura]-agua que lo rodea; y [su pensamiento, hasta entonces potencial, se hizo] realidad, y ella se acercó, [es decir], la que había [aparecido] ante él dentro [del resplandor de] su luz.


    3. Esta es la primera [potencia, que existía] antes del Todo y [que emanó] de su mente.[b]


