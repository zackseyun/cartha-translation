  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: es
  text: 'También estableció siete reyes, cada uno de los cuales corresponde a los firmamentos celestiales sobre los siete cielos, y cinco sobre las profundidades del abismo, para que gobernaran.


    También compartió con ellos su fuego, pero no les transmitió nada del poder de la luz que había obtenido de su madre, porque él es oscuridad ignorante. Cuando la luz se mezcló con la oscuridad, hizo resplandecer la oscuridad; y cuando la oscuridad se mezcló con la luz, oscureció la luz. Quedó en una condición que no era ni luz ni oscuridad, sino que se volvió penumbrosa.


    El arconte débil tiene tres nombres. El primero es Yaltabaoth, el segundo es Saklas y el tercero es Samael. Es malvado por el orgullo que hay en él, pues dijo: «Yo soy Dios y no hay ningún dios aparte de mí». Pues desconoce su propio poder y el lugar del cual se originó.


    Los arcontes también crearon para sí siete poderes, y cada uno de los poderes creó para sí seis ángeles, de modo que llegaron a ser 365 ángeles. Estos son los cuerpos correspondientes a los nombres:


    El primero ‹es› Athoth: tiene rostro de oveja; el segundo es Eloaiou: tiene rostro de asno; el tercero es Astaphaios: tiene rostro de [hiena]; el cuarto es Yao: tiene rostro de [dragón] de siete cabezas; el quinto es Sabaoth: tiene rostro de dragón; el sexto es Adonin: tiene rostro de mono; el séptimo es Sabbede: tiene rostro de fuego resplandeciente.


    Estos constituyen el aspecto séptuple de la semana.[a]


    Yaltabaoth, sin embargo, tenía multitud de rostros, más que todos los demás, de modo que, cuando estaba entre los serafines, podía adoptar ante todos ellos el rostro que quisiera.


    Como compartió con ellos su fuego, llegó a ser su soberano.


    A causa del poder glorioso que poseía gracias a la luz de su madre, se dio a sí mismo el nombre de Dios y desobedeció al lugar del cual se había originado.


    También unió en su pensamiento los siete poderes con las autoridades que estaban con él. Cuando habló, sucedió, y dio nombre a cada uno de los poderes, comenzando por el más alto:


    El primero es Bondad, junto con la primera autoridad, Athoth; el segundo es Providencia, junto con la segunda autoridad, Eloaio; el tercero es Divinidad, junto con la tercera autoridad, Astraphaio; el cuarto es Señorío, junto con la cuarta autoridad, Yao; el quinto es Reino, junto con la quinta autoridad, Sabaoth; el sexto es Celos, junto con la sexta autoridad, Adonein; el séptimo es Sofía, junto con la séptima autoridad, Sabbateon.


    Estos también tienen un firmamento correspondiente a cada eón celestial.[b]


    Recibieron nombres acordes con la gloria de los seres celestiales, para provocar la [aniquilación de los] poderes. Pero el poder residía en los nombres que su originador les había dado, mientras que los nombres que recibieron de acuerdo con la gloria de los seres celestiales significarán para ellos aniquilación y debilidad.[c]


    De este modo, tienen dos nombres.


    [Además, después de] crear [todas las cosas, las organizó] conforme a la imagen de los primeros eones que habían llegado a existir, a fin de crearlas a semejanza de los seres indestructibles.[d]


    No fue porque hubiera visto a los seres indestructibles, sino por el poder que había dentro de él, el cual había obtenido de su madre, que produjo dentro de sí la imagen del mundo. Cuando vio la creación que lo rodeaba y la multitud de ángeles a su alrededor, los cuales habían salido de él, les declaró: «Yo soy un Dios celoso y no hay ningún Dios aparte de mí».


    Sin embargo, al declarar esto, dio a entender a los ángeles que lo servían que existe otro Dios. Pues, si no existiera otro, ¿cómo podría estar celoso de otro?


    Entonces la madre comenzó «a {move:3} de un lado a otro»,[e] al darse cuenta de la deficiencia, mientras disminuía el resplandor de su luz; y se oscureció porque su compañero no había estado de acuerdo con ella.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «aspecto séptuple de la semana» es oscura y parece vincular las siete figuras con los siete días o con una estructura semanal de siete partes.
    reason: Aclara una frase difícil sin imponer una reconstrucción cosmológica específica.
  - marker: b
    text: «Eón» es un término técnico que puede referirse a una realidad, ámbito o entidad del mundo celestial.
    reason: Facilita la comprensión de un préstamo técnico necesario.
  - marker: c
    text: El texto de esta oración es difícil y parcialmente reconstruido; los corchetes señalan palabras suplidas por los editores.
    reason: Advierte al lector sobre la incertidumbre textual que afecta el sentido.
  - marker: d
    text: Los corchetes indican una reconstrucción editorial de una parte dañada o ausente del texto.
    reason: Hace transparente el estado fragmentario del testimonio.
  - marker: e
    text: La notación «{move:3}» es incierta y se conserva sin resolver. La expresión circundante puede describir agitación o movimiento repetido.
    reason: Preserva la notación editorial del testimonio y evita presentarla como una lectura segura.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Se conserva el término técnico habitual para las potestades gobernantes de la cosmología del escrito, evitando identificarlo sin más con un gobernante humano.
- source_word: power
  choice: poder
  rationale: Mantiene la repetición y la amplitud semántica del testimonio; según el contexto puede designar capacidad o entidad personal.
- source_word: authority
  choice: autoridad
  rationale: Distingue esta categoría de «poder» y preserva la jerarquía del pasaje.
- source_word: aeon
  choice: eón
  rationale: Se translitera el término cosmológico técnico en vez de reducirlo a «era» o «mundo».
- source_word: Sophia
  choice: Sofía
  rationale: Se conserva como nombre propio de la figura personificada, aunque coincide con la palabra griega para sabiduría.
- source_word: firmament
  choice: firmamento
  rationale: Equivalente tradicional y comprensible que conserva la cosmología estratificada del texto.
- source_word: overlord
  choice: soberano
  rationale: Expresa dominio superior con un registro digno y natural, sin añadir una connotación feudal innecesaria.
- source_word: feeble
  choice: débil
  rationale: Traducción directa que conserva la valoración negativa sin intensificarla.
- source_word: likeness
  choice: imagen / semejanza
  rationale: Se varía conforme a la sintaxis española, manteniendo la relación de copia o correspondencia sin precisar una identidad ontológica.
- source_word: jealous
  choice: celoso
  rationale: Preserva deliberadamente la alusión y el argumento interno del pasaje, sin suavizarla como «exclusivo».
theological_decisions:
- issue: La pretensión de Yaltabaot de ser Dios
  choice: Se mantienen «Dios» y «dios» según la función referencial inmediata, sin validar la pretensión del personaje.
  alternative: Traducir siempre «dios» en minúscula.
  rationale: El pasaje contrapone la autoproclamación del arconte con la existencia de otro Dios; la capitalización española ayuda a seguir el discurso, pero no resuelve la tensión cosmológica.
- issue: Relación de la luz materna con el arconte
  choice: Se afirma que obtuvo poder de la luz de su madre, sin explicar el mecanismo ni armonizar la mezcla de luz y oscuridad.
  alternative: Interpretarlo explícitamente como una chispa divina robada.
  rationale: El testimonio no emplea aquí esa formulación y debe conservarse su ambigüedad.
- issue: Los nombres dobles de los poderes
  choice: Se conserva la afirmación paradójica de que unos nombres albergan poder y otros implican aniquilación y debilidad.
  alternative: Explicar cuáles nombres son verdaderos, falsos o redentores.
  rationale: La redacción transmitida es difícil y teológicamente tensa; una explicación confesional excedería la evidencia suministrada.
- issue: El compañero de la madre
  choice: «su compañero» sin identificarlo ni definir la naturaleza de su desacuerdo.
  alternative: Identificarlo con una figura concreta de la mitología del tratado.
  rationale: Este fragmento no proporciona por sí solo una identificación inequívoca.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos cosmológicos técnicos «arconte» y «eón», con apoyo en notas. Los nombres propios se adaptaron moderadamente a la ortografía española, manteniendo las variantes internas del testimonio. Se omitieron los números de página del códice insertos en el testimonio inglés por no pertenecer al discurso. Los corchetes y el signo editorial ‹es› se conservaron; la notación opaca del último párrafo se expresó en el texto y se explicó mediante nota.
