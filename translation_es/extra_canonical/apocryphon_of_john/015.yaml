translation:
  language: es
  text: '1. Cuando miraron hacia abajo, se dieron cuenta de que la inteligencia de él superaba la de ellos. Entonces se reunieron para deliberar con el grupo de los arcontes y con todos los ángeles.


    2. Tomaron fuego, tierra y agua, y los mezclaron entre sí junto con los cuatro vientos ardientes. Los amasaron todos juntos y provocaron un gran estruendo. Luego lo llevaron a la sombra de la muerte para formarlo una vez más con tierra, agua, fuego y viento: aquello cuyo origen está en la materia, que es la ignorancia de la oscuridad, la pasión y el falso espíritu de ellos.


    3. Esta es la tumba, la figura del cuerpo con la que los ladrones vistieron al ser humano; es la cadena del olvido. Y él se convirtió en un ser humano mortal.


    4. Este es el primero que descendió y la primera separación.[a] Pero la Reflexión de la Luz, que habitaba dentro de él, despertó su inteligencia.


    5. Después, los arcontes lo llevaron y lo pusieron en el paraíso. Le dijeron: «Come», es decir, «en la pereza», pues el deleite de ellos es amargo, su belleza está corrompida, su deleite es engaño, sus árboles son impiedad, su fruto es un veneno incurable y su promesa es la muerte.


    6. Sin embargo, habían puesto su árbol de la vida en medio del paraíso. Yo les enseñaré a todos ustedes el misterio de la vida de ellos: el complot que tramaron juntos, que es semejanza de su espíritu.


    7. Su raíz es amarga y sus ramas son muerte; su sombra es odio, y el engaño habita entre sus hojas. Su flor es la unción maligna, su fruto es muerte, su semilla es la pasión y brota en la oscuridad.


    8. Los que prueban de él tienen su morada en el Hades, y la oscuridad es su lugar de descanso.


    9. Sin embargo, para impedir que él alzara la mirada hacia su plenitud y reconociera la vergüenza de su desnudez, ellos permanecieron delante de lo que llaman «el árbol del conocimiento del bien y del mal», que es la Reflexión de la Luz.[b] Pero fui yo quien hizo que comieran».


    10. También le pregunté al Salvador:


    —Señor, ¿no fue la serpiente la que enseñó a Adán a comer?


    11. El Salvador sonrió y dijo:


    —La serpiente les enseñó a comer de la maldad de la pasión sexual y de la destrucción, para poder aprovecharse de él.


    12. Además, él sabía que, por causa de la Reflexión de la Luz que habita en él, este le era desobediente, pues ella hacía que su inteligencia fuera más acertada que la del arconte principal. Entonces él quiso extraer el poder que él mismo le había dado e hizo que Adán cayera en un «trance».[c]


    13. Volví a preguntarle al Salvador:


    —¿Qué es el «trance»?


    14. Él respondió:


    —No es lo que escribió Moisés ni lo que ustedes han oído. En su primer libro dijo: «Hizo que se durmiera»; pero lo que hizo dormir fue su percepción. En efecto, dijo por medio del profeta: «Haré insensibles sus corazones para que no presten atención ni vean».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «el primero que descendió y la primera separación» es oscura; el testimonio disponible no determina con certeza qué antecedente tiene «este» ni en qué sentido se habla de una separación.
    reason: Preservar una ambigüedad textual y conceptual real sin introducir una explicación especulativa.
  - marker: b
    text: 'La construcción del versículo es difícil: el testimonio relaciona directamente la Reflexión de la Luz con el llamado árbol del conocimiento, pero no deja del todo clara la relación entre ella, quienes permanecen delante y el árbol.'
    reason: Advertir sobre una sintaxis inestable que afecta la interpretación teológica.
  - marker: c
    text: Los referentes de varios pronombres en este versículo son inciertos. La lectura probable entiende que el arconte principal reconoce la desobediencia de Adán y procura recuperar de él el poder que le había dado, pero la formulación se ha mantenido deliberadamente cercana al testimonio.
    reason: Distinguir una lectura probable de una identificación segura de los personajes.
  - marker: d
    text: La cita profética se transmite aquí en una forma que combina el endurecimiento del corazón con no prestar atención ni ver; no se ha armonizado con una forma bíblica determinada.
    reason: Evitar imponer retrospectivamente el texto exacto de una versión canónica concreta.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Conserva el término técnico habitual para los poderes gobernantes de este escrito, sin sustituirlo por una interpretación denominacional.
- source_word: intellect
  choice: inteligencia
  rationale: Expresa la facultad de comprensión de manera natural y mantiene su distinción respecto de «percepción» en el versículo 14.
- source_word: Reflection of Light
  choice: Reflexión de la Luz
  rationale: Mantiene la personificación femenina y la forma conceptual del título, sin identificarla con una figura doctrinal externa al pasaje.
- source_word: lust
  choice: pasión
  rationale: En los versículos 2 y 7 conserva un campo semántico más amplio que el exclusivamente sexual; en el versículo 11 se explicita «pasión sexual» porque el testimonio allí la califica así.
- source_word: Hades
  choice: Hades
  rationale: Conserva el nombre del ámbito de los muertos y evita equipararlo sin más con «infierno».
- source_word: trance
  choice: trance
  rationale: Retiene el término señalado y luego explicado por el propio diálogo, sin anticipar que signifique simplemente sueño.
- source_word: perception
  choice: percepción
  rationale: Preserva el contraste interpretativo entre el sueño corporal atribuido a Moisés y el adormecimiento de una facultad cognitiva.
theological_decisions:
- issue: Identidad y función de la Reflexión de la Luz
  choice: Se mantuvo como título personificado femenino, sin identificación adicional.
  alternative: Identificarla como una figura específica de otro sistema gnóstico o como una persona bíblica.
  rationale: El pasaje le atribuye presencia y acción, pero esta sección no resuelve por sí sola todas sus equivalencias teológicas.
- issue: Árbol del conocimiento en el versículo 9
  choice: Se conservó la afirmación de que el árbol «es la Reflexión de la Luz», junto con la sintaxis difícil del testimonio.
  alternative: Reformular el árbol como propiedad de la Reflexión de la Luz o hacer que ella sea quien se encuentre delante del árbol.
  rationale: La relación gramatical y conceptual es difícil en el testimonio suministrado; resolverla silenciosamente alteraría una tensión genuina.
- issue: Referentes pronominales del versículo 12
  choice: Se conservaron referentes parcialmente ambiguos mediante «él», «este» y «le», con aclaración editorial en nota.
  alternative: Nombrar en cada caso al arconte principal, Adán o la Reflexión de la Luz.
  rationale: Los pronombres del testimonio son ambiguos y una explicitación completa impondría una lectura no segura.
- issue: Relectura del sueño de Adán
  choice: 'Se presentó como contraste interno del Salvador con lo escrito por Moisés: no sueño ordinario, sino percepción adormecida.'
  alternative: Armonizar ambas explicaciones o tratar una de ellas como simple metáfora de la otra.
  rationale: El texto formula una oposición explícita que debe permanecer visible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos técnicos «arcontes» y «Hades», mientras que la sintaxis se hizo legible para un público general. El borrador se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa de los manuscritos coptos y sus variantes.
