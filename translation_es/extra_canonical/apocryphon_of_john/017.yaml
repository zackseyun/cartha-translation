  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: es
  text: '1. Me aparecí en forma de águila sobre el árbol del conocimiento, que es el Reflejo de la Providencia de la Luz Pura, para instruirlos y despertarlos de su profundo sueño, pues ambos se encontraban caídos y se habían dado cuenta de que estaban desnudos.


    2. El Reflejo se les apareció como una luz y despertó su entendimiento. Pero cuando ‹Y›aldabaot comprendió que se habían apartado de él, maldijo su tierra.


    3. Encontró a la mujer mientras ella se preparaba para su esposo.


    4. Él era su señor, aunque desconocía el misterio que había sucedido por medio del decreto sagrado. Ellos tenían miedo de acusarlo. Él mostró a sus ángeles la ignorancia que llevaba dentro, expulsó a los dos del paraíso y los vistió de oscuras tinieblas.


    5. El arconte principal vio también a la virgen que estaba junto a Adán y vio que el resplandeciente Reflejo de la Vida había aparecido dentro de ella. ‹Y›aldabaot se llenó de ignorancia. Cuando la Providencia del Todo vio esto, envió mensajeros, y ellos sacaron rápidamente a Vida de Eva.


    6. Entonces el arconte principal la contaminó y engendró con ella dos hijos, el primero y el segundo: Eloim y Yave.


    7. Eloim tiene rostro de oso, mientras que Yave tiene rostro de gato.


    8. Yave es justo, pero Eloim es injusto.


    9. Yave fue puesto sobre el fuego y el viento, mientras que Eloim fue puesto sobre el agua y la tierra. Pero, con intención de engañar, él los llamó Caín y Abel.


    10. Hasta el día de hoy, las relaciones sexuales han continuado por causa del arconte principal. Fue él quien sembró el deseo sexual dentro de la mujer que pertenece a Adán. Mediante las relaciones sexuales hizo copias de los cuerpos y les infundió su espíritu falso.


    11. Puso a los dos arcontes sobre varios principados para que gobernaran sobre la tumba.[a]


    12. Pero cuando Adán percibió la semejanza de su propia presciencia,[b] engendró la semejanza del Hijo del Hombre, a quien llamó Set, de acuerdo con la manera en que existe la raza entre los eones.


    13. De igual modo, la madre también hizo descender su espíritu, que es conforme a su propia semejanza, junto con una imagen[c] del que habita en la Plenitud, porque ella preparará una morada para los eones que descenderán.


    14. Él también hizo que bebieran el agua del olvido procedente del arconte principal, para que no conocieran el lugar de su origen.[d]


    15. De este modo, la descendencia permaneció durante un tiempo para prestar ayuda,[e] a fin de que, cuando el Espíritu salga de los eones sagrados, lo levante y lo sane de su deficiencia, para que la Plenitud entera llegue a ser santa e irreprochable».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «La tumba» puede aludir al cuerpo o al mundo material concebido como lugar de muerte, pero el texto no lo explica aquí.
    reason: La metáfora cosmológica puede resultar opaca para lectores modernos y no conviene resolverla dentro del texto.
  - marker: b
    text: También podría traducirse «conocimiento previo». El sentido exacto del término en esta frase es incierto.
    reason: Se preserva la ambigüedad léxica de «precognition/foreknowledge» en el testimonio disponible.
  - marker: c
    text: El término también puede traducirse «simulacro» o «representación».
    reason: La palabra admite distintos grados de semejanza o copia y la evidencia copta directa aún está pendiente de revisión.
  - marker: d
    text: El referente de «Él» no es inequívoco en la secuencia del pasaje.
    reason: Evita atribuir con certeza la acción a una figura concreta cuando la sintaxis transmitida es ambigua.
  - marker: e
    text: La frase también podría entenderse como «la descendencia permaneció durante un tiempo, recibiendo ayuda».
    reason: La función sintáctica de «para ayudar» en el testimonio inglés es incierta.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Conserva el término técnico de la cosmología del escrito; «gobernante» sería más transparente, pero perdería su función especializada.
- source_word: Reflection
  choice: Reflejo
  rationale: Mantiene la personificación y la relación metafórica con la Providencia sin identificarla con otro concepto.
- source_word: Providence
  choice: Providencia
  rationale: Equivalente tradicional y comprensible que conserva su carácter personificado en el pasaje.
- source_word: Fullness
  choice: Plenitud
  rationale: Reproduce el término cosmológico técnico (pleroma) y se escribe con mayúscula por su uso como realidad trascendente personificada o definida.
- source_word: aeons
  choice: eones
  rationale: Transliteración asentada para las entidades o ámbitos de esta cosmología; evita reducirlos simplemente a períodos temporales.
- source_word: polluted
  choice: contaminó
  rationale: Conserva la valoración negativa y la posible dimensión ritual o corporal sin precisar una forma de abuso que el testimonio inglés no explicita.
- source_word: sexual intercourse
  choice: relaciones sexuales
  rationale: Expresión natural y digna en español latinoamericano, suficientemente directa para el sentido del pasaje.
- source_word: simulacrum
  choice: imagen
  rationale: «Imagen» comunica una representación semejante sin las connotaciones modernas potencialmente engañosas de «simulacro».
- source_word: seed
  choice: descendencia
  rationale: En este contexto antropológico y genealógico, «descendencia» resulta natural, aunque el término también puede entenderse literalmente como «semilla».
theological_decisions:
- issue: Identidad y género gramatical de las figuras personificadas
  choice: Se mantuvieron «Providencia», «Vida», «Plenitud» y «madre» en femenino según la expresión del testimonio, mientras «Espíritu» permanece en masculino gramatical.
  alternative: Neutralizar las personificaciones o armonizar su género con sistemas teológicos posteriores.
  rationale: El pasaje presenta estas realidades como agentes diferenciados; la traducción conserva esa tensión sin imponer una doctrina externa.
- issue: Relación entre Eloim/Yave y Caín/Abel
  choice: Se conservó la afirmación de que el arconte les dio esos nombres con intención de engañar.
  alternative: Armonizar explícitamente estas figuras con el relato canónico de Génesis.
  rationale: La reinterpretación polémica es propia del Apócrifo de Juan y no debe suavizarse ni corregirse teológicamente.
- issue: Referencia del pronombre en «he also made them drink»
  choice: Se mantuvo «Él» sin identificar de manera explicativa al referente.
  alternative: Sustituirlo por «el arconte principal» o por otra figura específica.
  rationale: La cadena de referentes es incierta en el testimonio proporcionado; explicitarla resolvería indebidamente la ambigüedad.
- issue: Pronombres singulares en el cierre
  choice: Se conservó «lo levante y lo sane», sin definir si el referente es la descendencia colectiva o un individuo representativo.
  alternative: Pluralizar («los levante y los sane») o identificar al referente como Set o la humanidad.
  rationale: El cambio del colectivo «descendencia» a pronombres singulares forma parte de la dificultad del texto y se preserva.
- issue: Condición sexual de Eva y acción del arconte
  choice: Se tradujo «la contaminó» sin ampliar el acto.
  alternative: «La violó», «la profanó» o «la sedujo».
  rationale: Cada alternativa determina de manera distinta la naturaleza del acto; «contaminó» conserva el lenguaje valorativo sin añadir una especificación no segura.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron los tecnicismos cosmológicos «arconte», «eón» y «Plenitud», apoyados por el contexto y notas solo donde la opacidad o ambigüedad lo exige. Se omitieron los indicadores de página «24» y «25» porque no forman parte del discurso y cortan las oraciones. El borrador es necesariamente provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa del copto está indicada como pendiente.'
