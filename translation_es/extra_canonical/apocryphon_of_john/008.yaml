translation:
  language: es
  text: '1. Además, de la Presciencia de la Mente Perfecta, mediante la revelación de la voluntad del Espíritu invisible y de la voluntad del Autogenerado, surgió el Hombre Perfecto, la primera revelación, es decir, la verdad.


    2. Él es aquel a quien el Espíritu virginal llamó Pigera-Adamas. Lo puso sobre el primer eón, junto con el Poderoso, el Autogenerado, Cristo, al lado de la primera luz, Armozel, acompañado por sus potestades.


    3. Además, el Invisible le concedió una fuerza espiritual e invulnerable.


    4. Entonces él habló, exaltó y alabó al Espíritu invisible, diciendo:


    «Por causa de ti, el Todo llegó a existir,

    y a ti volverá el Todo.


    5. Te alabaré y exaltaré a ti y al Autogenerado, y a los tres eones: el Padre, la Madre y el Hijo, el poder perfecto».


    6. También puso a su hijo Set sobre el segundo eón, delante de la segunda luz, Oroiel. Dentro del tercer eón, la descendencia de Set fue puesta sobre la tercera luz, Daveitai, y allí fueron colocadas las almas de los santos.


    7. Además, dentro del cuarto eón fueron colocadas las almas de quienes no habían conocido la Plenitud y no se arrepintieron de inmediato, sino que persistieron así durante algún tiempo y solo después se arrepintieron.


    8. Estos son la cuarta luz, Elelet.[a]


    9. Estos son seres que exaltan al Espíritu invisible.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulación «Estos son la cuarta luz» reproduce la discordancia y la referencia plural del testimonio disponible; también podría entenderse o enmendarse como «Esta es la cuarta luz».
    reason: Advierte una dificultad textual y sintáctica genuina sin corregir silenciosamente el texto.
lexical_decisions:
- source_word: Precognition
  choice: Presciencia
  rationale: Conserva el sentido técnico de conocimiento anticipado y su carácter hipostático mediante mayúscula.
- source_word: Perfect Mind
  choice: Mente Perfecta
  rationale: Traducción formal y comprensible que mantiene la terminología cosmológica del pasaje.
- source_word: self-generated one
  choice: Autogenerado
  rationale: Preserva el título técnico y evita interpretarlo mediante terminología doctrinal posterior.
- source_word: aeon
  choice: eón
  rationale: Mantiene el término técnico de la cosmología del escrito, ya asentado en español académico y religioso.
- source_word: the All
  choice: el Todo
  rationale: Conserva el sentido cosmológico colectivo del original mediado por el testimonio inglés.
- source_word: Fullness
  choice: Plenitud
  rationale: Mantiene como término técnico la referencia al ámbito o totalidad divina, sin añadir una explicación doctrinal.
- source_word: seed of Seth
  choice: descendencia de Set
  rationale: En este contexto designa al linaje o posteridad de Set; «descendencia» resulta natural sin perder el valor colectivo.
- source_word: powers
  choice: potestades
  rationale: Distingue a los seres o poderes asociados de la «fuerza» concedida en el párrafo siguiente.
- source_word: holy ones
  choice: santos
  rationale: Expresión natural y digna que conserva la referencia colectiva sin especificar una categoría eclesial.
theological_decisions:
- issue: Identidad y relación entre el Hombre Perfecto, el Autogenerado y Cristo
  choice: Se conservaron como expresiones yuxtapuestas, sin aclarar si todos los títulos designan a una misma figura.
  alternative: Fusionar explícitamente los títulos o distinguir varias entidades mediante una reformulación.
  rationale: La sintaxis del testimonio es densa y teológicamente ambigua; resolverla excedería la evidencia suministrada.
- issue: Tríada «Padre, Madre, Hijo» y «poder perfecto»
  choice: Se mantuvo «el poder perfecto» tras los tres miembros, sin identificarlo exclusivamente con uno de ellos.
  alternative: Presentarlo como aposición del Hijo o como un cuarto elemento.
  rationale: La puntuación del testimonio permite tensión sintáctica y no justifica imponer una identificación.
- issue: Estado de quienes desconocían la Plenitud
  choice: Se conservó la secuencia de demora y arrepentimiento posterior.
  alternative: Interpretar su persistencia como una condición específica de pecado, ignorancia o incredulidad.
  rationale: El pasaje no define en qué persistieron; la traducción evita añadir una categoría doctrinal.
- issue: Referencia plural en el párrafo 8
  choice: Se preservó literalmente «Estos son la cuarta luz, Elelet».
  alternative: Corregir a «Esta es la cuarta luz» o hacer que «estos» remita de forma explícita a las almas.
  rationale: La formulación inusual pertenece al testimonio y puede reflejar una dificultad textual o una referencia colectiva; se señala sin armonizarla.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron con mayúscula los títulos y conceptos cosmológicos personificados, y se transliteraron los nombres técnicos. El borrador es provisional porque la revisión directa del copto sigue pendiente; se basa en el testimonio inglés público suministrado. Se omitió el número de página manuscrita «9», que interrumpía la oración y no pertenece al contenido continuo.
