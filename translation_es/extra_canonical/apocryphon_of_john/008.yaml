review_pass:
  verdict: revise
  source_fidelity: 'La revisión directa del copto sigue pendiente, por lo que la evaluación se limita al testimonio inglés proporcionado. El borrador reproduce en general la estructura, los términos cosmológicos y las ambigüedades del testimonio. Sin embargo, normaliza o altera indebidamente tres nombres técnicos: «Pigera-Adama(s)», «Daveithai» y «Eleleth». La incertidumbre parentética de «Adama(s)» debe conservarse, y las otras dos grafías no deben cambiarse sin apoyo textual. También conviene no introducir «así» en 7, pues el testimonio especifica que continuaron sin arrepentirse, no meramente que persistieron en una situación previamente definida.'
  naturalness: El español es mayormente natural, digno y apto para un registro académico-religioso. Se mejoran algunos enlaces y se traduce explícitamente la aclaración parentética «(unrepentant)» como «sin arrepentirse». Se conserva deliberadamente la discordancia de 8, acompañada de nota, porque una corrección silenciosa resolvería una dificultad del testimonio.
  terminology: «Presciencia», «Mente Perfecta», «Autogenerado», «eón», «Plenitud» y «el Todo» son opciones adecuadas para conservar el carácter técnico del pasaje. Se prefiere «poderes» para el sustantivo plural asociado a Armozel, sin confundirlo con la «fuerza» singular de 3. La puntuación de la lista «el Padre, la Madre, el Hijo, el poder perfecto» se mantiene sin dos puntos para no imponer una relación sintáctica o doctrinal que el testimonio no resuelve.
  issues:
  - severity: medium
    issue: Normalización de «Pigera-Adama(s)» como «Pigera-Adamas».
    rationale: El paréntesis en el testimonio registra incertidumbre o variación textual. Suprimirlo fija una lectura no asegurada.
  - severity: medium
    issue: Alteración de los nombres «Daveithai» y «Eleleth» a «Daveitai» y «Elelet».
    rationale: Los nombres técnicos deben reproducir la grafía del testimonio disponible salvo que exista evidencia directa de la fuente para corregirlos.
  - severity: low
    issue: «Persistieron así» en el párrafo 7 es menos explícito que el testimonio.
    rationale: El inglés aclara entre paréntesis que continuaron sin arrepentirse; «sin arrepentirse» conserva el dato sin añadir una referencia vaga.
  - severity: low
    issue: Los dos puntos tras «los tres eones» pueden sugerir que la enumeración siguiente los identifica de forma cerrada.
    rationale: La puntuación con comas preserva mejor la tensión sintáctica del testimonio, que además añade «el poder perfecto».
