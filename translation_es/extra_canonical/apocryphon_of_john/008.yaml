  revision_rationale: Se conserva la equivalencia formal y el vocabulario técnico del borrador, pero se restauran las grafías y la incertidumbre de los nombres tal como aparecen en el testimonio inglés. Las modificaciones restantes aclaran el alcance de «sin arrepentirse» y evitan que la puntuación resuelva ambigüedades cosmológicas o teológicas. La omisión del número de página manuscrita «9» es apropiada, pues no integra la proposición.
