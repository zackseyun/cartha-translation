base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: es
  text: '1. Entonces la Reflexión de la Luz se ocultó dentro de él. El arconte principal quiso extraerla de su costilla, pero la Reflexión de la Luz no puede ser apresada.


    2. Aunque la oscuridad la persiguió, no pudo atraparla. Entonces él extrajo de sí una porción de su poder e hizo otro molde con forma de mujer, conforme a la semejanza de la Reflexión que se le había aparecido. Introdujo en el molde femenino la porción que había extraído del poder del hombre —y no «su costilla», como dijo Moisés—, y vio a la mujer junto a él.


    3. En aquel momento apareció también la Reflexión Radiante. Ella levantó el velo que había cubierto su mente, y él recobró la sobriedad después de la embriaguez de la oscuridad. Reconoció a la figura correspondiente a su propia imagen y dijo: «Esta sí es hueso de mis huesos y carne de mi carne.


    4. Por eso el hombre dejará a su padre y a su madre, se unirá a su esposa y los dos llegarán a ser una sola carne», porque su compañera le será enviada. Él dejará a su padre y a su madre, incluso a Sofía, nuestra hermana, la que descendió con inocencia para corregir su deficiencia. Por causa de esta fue llamada «Vida», la que es «la madre de los vivientes»[a], mediante la Providencia de la soberanía del Cielo y [la Reflexión que se apareció] a él.[b] Por medio de ella, ellos gustaron del conocimiento perfecto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés permite «la madre o los vivientes» y también la lectura tradicional «la madre de los vivientes». La traducción adopta esta última por su probable alusión a Génesis 3:20, pero la expresión subyacente requiere revisión directa del copto.
    reason: Preservar una variante o ambigüedad textual relevante sin hacer ilegible el texto principal.
  - marker: b
    text: Las palabras «la Reflexión que se apareció» están entre corchetes porque representan una restauración editorial del texto; además, la relación sintáctica de toda esta frase es incierta.
    reason: Conservar la señal de restauración y advertir que la construcción no debe presentarse como segura.
lexical_decisions:
- source_word: Reflection of Light / Radiant Reflection
  choice: Reflexión de la Luz / Reflexión Radiante
  rationale: Se conservan como designaciones personificadas y se mantiene la relación léxica entre ambas expresiones, sin sustituirlas por términos interpretativos como «pensamiento» o «sabiduría».
- source_word: chief archon
  choice: arconte principal
  rationale: «Arconte» conserva el término técnico del marco cosmológico del escrito; «principal» expresa la jerarquía sin imponer la traducción teológica «gobernante supremo».
- source_word: mold
  choice: molde
  rationale: Mantiene la imagen concreta de una forma preparada para recibir una porción de poder y evita convertirla en «cuerpo», algo más interpretativo.
- source_word: counterpart of his own image
  choice: figura correspondiente a su propia imagen
  rationale: Expresa correspondencia o contraparte sin decidir de manera indebida si se trata de duplicado, pareja o reflejo ontológico.
- source_word: cleave
  choice: se unirá
  rationale: Es una formulación natural y digna en español actual que conserva el sentido de adhesión estrecha de la cita de Génesis.
- source_word: Sophia
  choice: Sofía
  rationale: Se translitera como nombre propio de la figura personificada y no se traduce como «Sabiduría», para no borrar su función técnica en el relato.
- source_word: Providence
  choice: Providencia
  rationale: La mayúscula señala su posible carácter personificado o técnico, preservando la ambigüedad del testimonio.
- source_word: perfect knowledge
  choice: conocimiento perfecto
  rationale: Traducción transparente que no introduce explícitamente el tecnicismo «gnosis» donde el testimonio suministrado dice «knowledge».
theological_decisions:
- issue: Contraste con el relato mosaico de la costilla
  choice: 'Se conserva explícitamente: «y no “su costilla”, como dijo Moisés»'
  alternative: Armonizar el pasaje con Génesis o suavizarlo como mera explicación
  rationale: El escrito polemiza de forma deliberada con la versión atribuida a Moisés; armonizarla borraría una tensión teológica genuina.
- issue: Identidad y actuación de la Reflexión
  choice: Se presenta como figura femenina personificada mediante pronombres y mayúsculas
  alternative: Tratar «reflexión» como una facultad mental impersonal
  rationale: La figura se oculta, aparece y actúa; la personificación pertenece al argumento del texto.
- issue: Descenso inocente y deficiencia de Sofía
  choice: «descendió con inocencia para corregir su deficiencia»
  alternative: Explicar la inocencia como ignorancia o la deficiencia como pecado
  rationale: El texto mantiene en tensión inocencia y deficiencia; no se resuelve esa tensión con categorías doctrinales externas.
- issue: Sintaxis de «mediante la Providencia...»
  choice: Se mantiene ligada al enunciado sobre dejar al padre, la madre y Sofía, aun con su dificultad
  alternative: Reordenarla para vincularla de modo inequívoco con el nombre «Vida» o con el envío de la compañera
  rationale: El testimonio es sintácticamente incierto; una reconstrucción fluida pero categórica ocultaría esa ambigüedad.
- issue: Referente plural de «ellos gustaron»
  choice: Se conserva «ellos» sin identificar a los participantes
  alternative: Especificar «el hombre y la mujer» o «la humanidad»
  rationale: El referente no queda plenamente determinado en el testimonio suministrado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos cosmológicos técnicos («arconte», «Sofía», «Providencia») y las imágenes concretas del pasaje. Se eliminó el número de página intrusivo «23». El borrador es necesariamente provisional porque la evidencia proporcionada consiste en un testimonio inglés de dominio público y la revisión directa del copto está pendiente.
