review_pass:
  verdict: revise
  source_fidelity: El borrador sigue de cerca el testimonio inglés suministrado y conserva bien la personificación de «Reflexión». Sin embargo, «extrajo de sí» fija como referente al arconte, mientras que el testimonio dice «de él» y luego habla del poder del hombre; debe conservarse esa referencia no resuelta. Además, «la madre de los vivientes» escoge en el texto principal una lectura tradicional allí donde el testimonio inglés presenta «the mother or the living»; esa ambigüedad no debe resolverse por la alusión a Génesis.
  naturalness: El español es en general claro, actual y de registro adecuado. «La contraparte de su propia imagen» comunica mejor el término relacional que «la figura correspondiente a su propia imagen», sin perder cautela. La construcción final continúa siendo difícil por la sintaxis del testimonio; se la mantiene señalada mediante corchetes y nota, con el mínimo ajuste funcional de coordinación.
  terminology: «arconte principal», «molde», «Sofía», «Providencia», «Reflexión de la Luz» y «Reflexión Radiante» son elecciones apropiadas y consistentes. Se conserva «conocimiento perfecto», sin introducir «gnosis».
  issues:
  - severity: medium
    issue: El referente de «de sí» queda indebidamente determinado.
    rationale: El testimonio dice que el arconte «extrajo de él» una porción de poder y después identifica ese poder como el «del hombre». «De sí» en español remite normalmente al sujeto, el arconte, y altera o resuelve una referencia que el testimonio no resuelve con seguridad.
  - severity: medium
    issue: La lectura «la madre de los vivientes» se adopta en el cuerpo principal pese a la ambigüedad del testimonio.
    rationale: La nota reconoce que el testimonio permite «la madre o los vivientes», pero el texto principal privilegia la lectura de Génesis. La fidelidad exige preservar la formulación ambigua, aun si resulta extraña, y explicarla en nota.
  - severity: low
    issue: «Figura correspondiente» es más explicativo y menos preciso que «contraparte».
    rationale: «Counterpart» expresa una relación de correspondencia; «contraparte» la reproduce de modo más directo y natural en este registro, sin imponer que sea pareja, copia o reflejo.
  - severity: low
    issue: La coordinación final requiere un ajuste mínimo.
    rationale: Para coordinar en español «Providencia» con la expresión restaurada «[la Reflexión que se apareció] a él», conviene repetir «por medio de»/«de», sin resolver el alcance sintáctico incierto que la nota ya advierte.
  revised_text: '1. Entonces la Reflexión de la Luz se ocultó dentro de él. El arconte principal quiso extraerla de su costilla, pero la Reflexión de la Luz no puede ser apresada.


    2. Aunque la oscuridad la persiguió, no pudo atraparla. Entonces él extrajo de él una porción de su poder e hizo otro molde con forma de mujer, conforme a la semejanza de la Reflexión que se le había aparecido. Introdujo en el molde femenino la porción que había extraído del poder del hombre —y no «su costilla», como dijo Moisés—, y vio a la mujer junto a él.


    3. En aquel momento apareció también la Reflexión Radiante. Ella levantó el velo que había cubierto su mente, y él recobró la sobriedad después de la embriaguez de la oscuridad. Reconoció la contraparte de su propia imagen y dijo: «Esta es ciertamente hueso de mis huesos y carne de mi carne.


    4. Por eso el hombre dejará a su padre y a su madre, se unirá a su esposa y los dos llegarán a ser una sola carne», porque su compañera le será enviada. Él dejará a su padre y a su madre, incluso a Sofía, nuestra hermana, la que descendió con inocencia para corregir su deficiencia. Por causa de esta fue llamada «Vida», la que es «la madre o los vivientes»[a], por medio de la Providencia de la soberanía del Cielo y de [la Reflexión que se apareció] a él.[b] Por medio de ella, ellos gustaron del conocimiento perfecto.'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés dice literalmente «la madre o los vivientes». La expresión puede reflejar una variante o una construcción textual incierta; aunque evoca la fórmula tradicional de Génesis 3:20 («madre de todos los vivientes»), no se la regulariza en el texto principal. Hace falta revisión directa del copto.
    reason: Preservar la ambigüedad textual sin imponer una armonización con Génesis.
  - marker: b
    text: Las palabras «la Reflexión que se apareció» están entre corchetes porque representan una restauración editorial. La relación sintáctica de «por medio de la Providencia... y de [la Reflexión...]» con el contexto sigue siendo incierta.
    reason: Conservar la señal de restauración y advertir la incertidumbre sintáctica.
  revision_rationale: 'Se corrigen dos puntos de fidelidad: se evita identificar el referente ambiguo de «de él» con el arconte y se deja sin armonizar la expresión ambigua «la madre o los vivientes». También se mejora la equivalencia de «counterpart» y se hace apenas funcional la coordinación final, sin resolver su sintaxis ni sus referentes. El número de página intrusivo «23» permanece omitido, conforme al registro de auditoría inglés.'
