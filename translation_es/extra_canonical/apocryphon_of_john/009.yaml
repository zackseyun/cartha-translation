translation:
  language: es
  text: 'Además, siendo un eón, Sofía de la Reflexión concibió por sí misma un pensamiento, junto con la concepción del Espíritu invisible y la Presciencia.


    Quiso producir de sí misma una semejanza, sin el consentimiento del Espíritu, que no lo había aprobado, y sin su compañero ni la deliberación de este, aunque el aspecto de su masculinidad no lo había aprobado.


    Además, dio a luz sin haber encontrado a su compañero y después de haber deliberado sin el consentimiento del Espíritu ni el conocimiento de su compañero. Debido a la fuerza invulnerable que habitaba en ella,


    su pensamiento no quedó estéril, sino que produjo de sí misma algo incompleto y distinto de su propia apariencia. Como lo había creado sin su compañero, él era diferente de la apariencia de su madre, pues poseía otra forma.


    Además, cuando ella vio el resultado de su propia voluntad, él tomó la forma de un dragón con rostro de león[a],


    y sus ojos parecían fuegos de relámpago que centellean.


    Ella lo arrojó lejos de sí, fuera de aquellos lugares, para que ninguno de los inmortales pudiera verlo, porque lo había creado en ignorancia.


    También lo rodeó de una nube luminosa y erigió un trono en medio de la nube, para que nadie pudiera verlo excepto el Espíritu santo —cuyo nombre es la Madre de los Vivientes—, y le dio el nombre de Yaltabaot[b].


    Este es el arconte principal[c], quien obtuvo de su madre un gran poder.


    Él se separó de ella y se alejó de los lugares donde había nacido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión combina las imágenes de un dragón y un rostro de león. El testimonio inglés suministrado contiene una marca editorial junto a «dragón»; la revisión directa de los manuscritos coptos está pendiente.
    reason: Advertir una cuestión textual/editorial relevante sin trasladar al cuerpo una marca técnica opaca.
  - marker: b
    text: «Yaltabaot» también se translitera de otras maneras en publicaciones modernas.
    reason: El nombre copto/griego admite variantes de transliteración; se adopta una forma legible y cercana al testimonio.
  - marker: c
    text: «Arconte» significa «gobernante» o «jefe» y aquí funciona como término técnico para una potestad cósmica.
    reason: Facilitar la comprensión de un término cosmológico conservado por precisión.
lexical_decisions:
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico de la cosmología del escrito, en vez de reducirlo a «era» o «ser», que resolverían indebidamente su sentido.
- source_word: Sophia of Reflection
  choice: Sofía de la Reflexión
  rationale: Se mantiene «Sofía» como nombre propio y se traduce el título de manera transparente, sin imponer otra terminología técnica no comprobada en el copto.
- source_word: Precognition
  choice: Presciencia
  rationale: Expresa conocimiento anticipado y conserva su posible función como entidad o atributo personificado mediante la mayúscula.
- source_word: bring forth / produced
  choice: producir / produjo
  rationale: Permite conservar la imaginería de emanación o generación sin hacerla exclusivamente biológica; «dio a luz» se usa donde el testimonio destaca el acto de engendrar.
- source_word: companion
  choice: compañero
  rationale: Traducción neutral que preserva la relación cosmológica sin identificarla más específicamente como esposo, consorte o pareja.
- source_word: face of her maleness
  choice: aspecto de su masculinidad
  rationale: La frase del testimonio es difícil; esta versión conserva tanto la referencia a lo masculino como la idea de manifestación o aspecto, sin convertirla en una persona inequívoca.
- source_word: lion-faced dragon form
  choice: forma de un dragón con rostro de león
  rationale: Conserva ambos elementos de la imagen del testimonio y produce una expresión natural en español.
- source_word: chief archon
  choice: arconte principal
  rationale: «Arconte» conserva el término técnico del escrito; «principal» comunica su rango sin añadir asociaciones políticas modernas.
- source_word: Mother of the Living
  choice: Madre de los Vivientes
  rationale: Mantiene el carácter titular y la posible alusión tradicional; «vivientes» es más personal que «seres vivos».
theological_decisions:
- issue: La acción creadora de Sofía y el papel del Espíritu
  choice: Se conserva que actuó sin el consentimiento del Espíritu y sin su compañero.
  alternative: Presentar el episodio simplemente como una creación pecaminosa o rebelde.
  rationale: El pasaje describe desacuerdo, ignorancia e incompletitud, pero no debe armonizarse con categorías doctrinales ajenas ni intensificarse su juicio moral.
- issue: Identidad del Espíritu santo y la Madre de los Vivientes
  choice: 'Se reproduce la aposición tal como aparece: «el Espíritu santo —cuyo nombre es la Madre de los Vivientes—».'
  alternative: Identificarla explícitamente con Sofía, con una figura trinitaria posterior o con otra entidad.
  rationale: La formulación mantiene la tensión e identidad expresada por el testimonio sin resolver su cosmología.
- issue: Naturaleza de Yaltabaot
  choice: Se lo llama «arconte principal» y se describe su origen sin identificarlo con ninguna figura de otros textos.
  alternative: Llamarlo demiurgo, Satanás o dios creador.
  rationale: Esas identificaciones pueden ser interpretativas; el pasaje suministrado solo lo designa como arconte principal.
- issue: Resultado de la voluntad de Sofía
  choice: «cuando ella vio el resultado de su propia voluntad»
  alternative: «cuando vio a su hijo» o «cuando vio su creación».
  rationale: La formulación conserva la ambigüedad del complemento editorial implícito en el testimonio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos cosmológicos «eón» y «arconte», aclarando este último en nota. La traducción es provisional porque el expediente indica que la revisión directa del copto aún está pendiente; se eliminó el número de página manuscrita «10» y no se reprodujo la marca editorial «:1».
