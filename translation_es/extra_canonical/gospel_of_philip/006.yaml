base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: es
  text: '«Jesús» es un nombre oculto; «Cristo» es un nombre revelado. Por eso, «Jesús» no se traduce, sino que se lo llama por su nombre: «Jesús». En cambio, el nombre «Cristo» es «Mesías» en siríaco y «Cristo» en griego; los demás pueblos también lo expresan en su propia lengua. «El Nazareno» revela lo que está oculto. Cristo lo tiene todo dentro de sí: sea ser humano, ángel o misterio, y al Padre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público proporcionado. Aún está pendiente la revisión directa del texto copto del Códice II de Nag Hammadi.
    reason: La fuente suministrada declara que la revisión en la lengua antigua está pendiente; la nota hace transparente la base documental de esta versión.
lexical_decisions:
- source_word: Jesus
  choice: Jesús
  rationale: Se conserva la forma tradicional española del nombre, de acuerdo con la afirmación del pasaje de que no se traduce, sino que se usa como nombre propio.
- source_word: Christ
  choice: Cristo
  rationale: Se mantiene el título tradicional, preservando además el contraste explícito con «Mesías» y su relación con distintas lenguas.
- source_word: Messiah
  choice: Mesías
  rationale: Equivalente español convencional del título semítico presentado por el testimonio como la forma siríaca.
- source_word: the Nazarene
  choice: el Nazareno
  rationale: La forma sustantivada conserva el carácter titular de la expresión y su función reveladora en el pasaje.
- source_word: mystery
  choice: misterio
  rationale: Traducción directa que mantiene abierta la referencia conceptual y teológica sin explicarla ni reducirla.
theological_decisions:
- issue: Alcance de «Cristo lo tiene todo dentro de sí»
  choice: 'Conservar la formulación inclusiva y paradójica: «sea ser humano, ángel o misterio, y al Padre»'
  alternative: Reformular como categorías o naturalezas que Cristo contiene
  rationale: El testimonio es sintáctica y teológicamente tenso; explicitar naturalezas, seres o realidades impondría una interpretación no expresada.
- issue: Relación entre «el Nazareno» y lo oculto
  choice: «revela lo que está oculto»
  alternative: «manifiesta al que está oculto»
  rationale: El testimonio inglés favorece una referencia neutra a «lo oculto». Se preserva esa amplitud, sin identificar de manera conjetural a una persona o nombre concreto.
- issue: Cláusula final «and the Father»
  choice: Mantener «y al Padre» coordinado con la enumeración
  alternative: «incluido el Padre» o «y también tiene al Padre dentro de sí»
  rationale: La construcción transmitida resulta abrupta y admite más de un análisis. La traducción conserva esa tensión en vez de normalizar su teología.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean comillas angulares para los nombres y títulos examinados. «Se lo llama» evita una pasiva rígida y conserva la referencia masculina. La última oración mantiene deliberadamente la aspereza y ambigüedad del testimonio disponible.
