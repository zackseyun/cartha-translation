translation:
  language: es
  text: 'Un hebreo engendra a un hebreo, y a [los] de esta clase se los llama «prosélito». Pero un [prosélito] no engendra a otro prosélito. Son como […] y engendran a otros […] les basta con llegar a existir.


    El esclavo busca solamente la libertad; no busca los bienes de su amo. Pero el hijo no es solamente hijo, sino que reclama para sí la herencia de su padre. Los que heredan lo muerto están ellos mismos muertos y heredan lo muerto. Los que heredan lo viviente están ellos mismos vivos y heredan tanto lo viviente como lo muerto. Los muertos no pueden heredar nada, pues ¿cómo podrían heredar los muertos? Si el muerto hereda lo viviente, no morirá; más bien, ¡el muerto vivirá aún más! Un gentil no muere, porque nunca ha vivido como para poder morir. Quien ha creído en la Verdad ha vivido y corre peligro de morir, porque está vivo desde el día en que vino Cristo. El mundo es creado, las ciudades son embellecidas[a] y los muertos son sacados.


    Cuando éramos hebreos, no teníamos padre: teníamos solamente a nuestra madre. Pero cuando nos hicimos cristianos, llegamos a tener tanto padre como madre.


    [a] O: «las ciudades son pobladas». El sentido de la expresión transmitida aquí es incierto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «las ciudades son pobladas». El sentido de la expresión transmitida aquí es incierto.'
    reason: La traducción inglesa de consulta usa «gentrified», una elección inusual y potencialmente anacrónica; la nota señala la incertidumbre mientras queda pendiente la revisión directa del copto.
lexical_decisions:
- source_word: creates
  choice: engendra
  rationale: En la secuencia sobre hebreos y prosélitos se refiere a producir personas de la misma condición, no a la creación del mundo; «engendra» conserva la imagen de descendencia que continúa en el pasaje.
- source_word: proselyte
  choice: prosélito
  rationale: Es el término religioso tradicional y comprensible para una persona convertida o incorporada a una comunidad religiosa.
- source_word: the living
  choice: lo viviente
  rationale: Conserva el contraste sustantivado y deliberadamente ambiguo con «lo muerto», sin decidir si se trata de personas, realidades o bienes.
- source_word: gentile
  choice: gentil
  rationale: Mantiene la categoría étnico-religiosa antigua sin sustituirla por una explicación interpretativa.
- source_word: Truth
  choice: Verdad
  rationale: La mayúscula refleja su posible uso como realidad personificada o título, sin precisar más su sentido teológico.
- source_word: gentrified
  choice: embellecidas
  rationale: El vocablo inglés moderno «gentrified» resulta anacrónico y probablemente intenta representar una expresión textual incierta; «embellecidas» encaja en la serie proverbial, con una nota que preserva la alternativa «pobladas».
- source_word: carried out
  choice: son sacados
  rationale: Conserva la imagen concreta de retirar a los muertos, sin añadir «para sepultarlos».
theological_decisions:
- issue: La relación entre hebreo, prosélito y cristiano
  choice: Conservar las categorías y la lógica paradójica del texto sin armonizarlas con doctrinas posteriores.
  alternative: Explicar «hebreo» como judío por nacimiento y «prosélito» como converso, o reformular el pasaje desde una teología eclesial posterior.
  rationale: El fragmento emplea estas identidades de manera figurada y enigmática; explicitarlas resolvería una tensión que el texto mantiene.
- issue: Herencia de lo viviente y lo muerto
  choice: 'Traducir con sustantivos neutros: «lo viviente» y «lo muerto».'
  alternative: Interpretar como «los vivos y los muertos» o como bienes espirituales y materiales.
  rationale: La formulación admite más de un referente; el español neutro conserva esa amplitud.
- issue: El gentil que nunca ha vivido
  choice: Mantener literalmente la paradoja.
  alternative: Aclarar que se habla de vida espiritual y muerte espiritual.
  rationale: La distinción entre vida física y espiritual parece implícita, pero introducirla expresamente cerraría la interpretación.
- issue: Padre y madre de hebreos y cristianos
  choice: Preservar las imágenes familiares sin identificar a la madre o al padre.
  alternative: Identificarlos con figuras divinas, comunidades, pactos o principios concretos.
  rationale: El fragmento no proporciona en este contexto una identificación inequívoca.
translation_notes:
  register: Español latinoamericano neutro, actual y digno. Se conservaron los corchetes y puntos suspensivos como señales de restauración y daño manuscrito. Se evitó marcar género mediante desdoblamientos innecesarios; los masculinos singulares corresponden a las figuras genéricas del texto. Borrador provisional basado en el testimonio inglés de dominio público suministrado; está pendiente la revisión directa del copto de Nag Hammadi Codex II,3.
