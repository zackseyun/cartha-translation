review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado y conserva adecuadamente sus paradojas, sus corchetes de restauración y sus lagunas. No se dispone aquí de una base copta para confirmar de manera independiente la lectura subyacente; en particular, «gentrified» exige cautela.
  naturalness: El español es generalmente natural, actual y de registro adecuado. La expresión «a [los] de esta clase se los llama “prosélito”» presenta una discordancia evitable entre el referente plural y el sustantivo singular. «Prosélitos» es la forma idiomática en este contexto.
  terminology: «Hebreo», «prosélito», «gentil», «Verdad», «lo viviente» y «lo muerto» son elecciones apropiadas y no cierran las ambigüedades del pasaje. «Embellecidas» es una solución provisional razonable para el problemático «gentrified», pero la alternativa «pobladas» no está sustentada por el testimonio inglés proporcionado.
  issues:
  - severity: medium
    issue: Discordancia de número en «se los llama “prosélito”».
    rationale: 'El antecedente «[los] de esta clase» es plural. En español natural, la designación debe ir en plural: «se les llama “prosélitos”».'
  - severity: medium
    issue: La nota propone «las ciudades son pobladas» como alternativa sin apoyo explícito en el testimonio inglés auditado.
    rationale: La fuente de consulta dice «gentrified» y reconoce una formulación inusual; no aporta una variante equivalente a «pobladas». Es preferible limitar la nota a la incertidumbre y a la provisionalidad de «embellecidas» hasta cotejar el copto.
  revised_text: 'Un hebreo engendra a un hebreo, y a [los] de esta clase se les llama «prosélitos». Pero un [prosélito] no engendra a otro prosélito. Son como […] y engendran a otros […] les basta con llegar a existir.



    El esclavo busca solamente la libertad; no busca los bienes de su amo. Pero el hijo no es solamente hijo, sino que reclama para sí la herencia de su padre. Los que heredan lo muerto están ellos mismos muertos y heredan lo muerto. Los que heredan lo viviente están ellos mismos vivos y heredan tanto lo viviente como lo muerto. Los muertos no pueden heredar nada, pues ¿cómo podrían heredar los muertos? Si el muerto hereda lo viviente, no morirá; más bien, ¡el muerto vivirá aún más! Un gentil no muere, porque nunca ha vivido como para poder morir. Quien ha creído en la Verdad ha vivido y corre peligro de morir, porque está vivo desde el día en que vino Cristo. El mundo es creado, las ciudades son embellecidas[a] y los muertos son sacados.



    Cuando éramos hebreos, no teníamos padre: teníamos solamente a nuestra madre. Pero cuando nos hicimos cristianos, llegamos a tener tanto padre como madre.



    [a] La expresión traducida «son embellecidas» es incierta en el testimonio inglés de consulta; se requiere cotejo directo con el copto.'
