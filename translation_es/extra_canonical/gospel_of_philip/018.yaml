review_pass:
  verdict: revise
  source_fidelity: La traducción conserva bien la estructura, los corchetes y las lagunas del testimonio inglés provisional. Sin embargo, cambia indebidamente a singular los referentes plurales de «for them» y «revealed to them alone», y omite los paréntesis de «(eternal)», que son una señal editorial distinta de los corchetes.
  naturalness: El registro es generalmente natural y digno. «Bodas» resulta más idiomático que «matrimonios» en esta comparación. La secuencia fragmentaria sobre el fuego debe conservar su aspereza para no completar una laguna manuscrita.
  terminology: «Cámara/cámara nupcial», «misterios», «Verdad», «imágenes» y «plenitud» son elecciones adecuadas y no imponen una lectura doctrinal. «Siglos» puede mantenerse de modo provisional, con nota que advierta la posible equivalencia técnica «eones»; deben preservarse los paréntesis editoriales en «(eternos)» y «(eterno)».
  issues:
  - severity: high
    issue: Los pronombres finales se vuelven singulares («esa persona», «ella»).
    rationale: El testimonio dice «for them» y «to them alone». El singular altera el referente y restringe sin base una afirmación formulada en plural.
  - severity: medium
    issue: Se han omitido los paréntesis de «(eternal) ages» y «(eternal) age».
    rationale: Los paréntesis forman parte de la señalización editorial del testimonio y deben mantenerse, como se mantienen los corchetes y las elipsis.
  - severity: low
    issue: «Matrimonios» es menos natural que «bodas» en el contexto comparativo.
    rationale: «Bodas» designa de forma más idiomática los acontecimientos que «suceden de noche», sin cambiar el sentido.
  revised_text: 'Todo el que [entre] en la cámara encenderá su [lámpara], porque [esto] es como las bodas que […] suceden de noche: el fuego […] de noche y se apaga. Pero los misterios de este matrimonio se cumplen en el día y en la luz. Ni ese día ni su luz se ponen jamás.


    Si alguien llega a ser hijo de la cámara nupcial, recibirá la luz. Si alguien no la recibe mientras está aquí, no podrá recibirla en el otro lugar. Quien reciba esa luz no será visto ni atado, y nadie podrá perturbar a alguien así, aun mientras habite en el mundo. Además, cuando salgan del mundo, ya habrán recibido la Verdad en las imágenes. El mundo se ha convertido en los (eternos) siglos[a], porque el (eterno) siglo es la plenitud para ellos. Y es así: se les revela solo a ellos. No está oculto en la oscuridad ni en la noche, sino que está oculto en un día perfecto y en una luz santa.


    El Evangelio


    Según Felipe'
  revised_footnotes:
  - marker: a
    text: «(Eternos) siglos» traduce provisionalmente una expresión que también puede entenderse como «eones». Los paréntesis se conservan del testimonio base; la revisión directa del copto está pendiente.
    reason: Conserva tanto la incertidumbre léxica de la expresión potencialmente técnica como la señal editorial de la fuente provisional.
  revision_rationale: Se corrigen los referentes plurales, se restituyen los paréntesis editoriales de la fuente y se mejora levemente la naturalidad con «bodas». Se mantiene sin completar la cláusula dañada sobre el fuego y se preservan las ambigüedades simbólicas y teológicas del pasaje.
