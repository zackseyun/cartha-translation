translation:
  language: es
  text: 'Todo el que [entre] en la cámara encenderá su [lámpara], porque [esto] es como los matrimonios que […] se celebran de noche: el fuego […] de noche y se apaga. Pero los misterios de este matrimonio se cumplen en el día y en la luz. Ni ese día ni su luz se ponen jamás.


    Si alguien llega a ser hijo de la cámara nupcial, recibirá la luz. Si alguien no la recibe mientras está aquí, no podrá recibirla en el otro lugar. Quien reciba esa luz no será visto ni atado, y nadie podrá perturbar a alguien así, aun mientras habite en el mundo. Además, cuando salga del mundo, ya habrá recibido la Verdad en las imágenes. El mundo se ha convertido en los siglos eternos[a], porque el siglo eterno es la plenitud para esa persona. Y es así: se le revela solo a ella. No está oculto en la oscuridad ni en la noche, sino que está oculto en un día perfecto y en una luz santa.


    El Evangelio


    Según Felipe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Siglos eternos» traduce provisionalmente una expresión que también puede entenderse como «eones». La revisión directa del copto está pendiente.
    reason: La base proporcionada es un testimonio inglés y señala explícitamente que falta la revisión de la lengua fuente; la nota evita presentar como segura una equivalencia posiblemente técnica.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: cámara / cámara nupcial
  rationale: Conserva la distinción del testimonio entre la primera mención abreviada y la expresión nupcial explícita, con un registro comprensible y digno.
- source_word: mysteries
  choice: misterios
  rationale: Mantiene el término religioso y su carácter deliberadamente no explicado.
- source_word: Truth
  choice: Verdad
  rationale: La mayúscula refleja su posible uso técnico o personificado sin definirlo doctrinalmente.
- source_word: images
  choice: imágenes
  rationale: Traducción directa que preserva la ambigüedad conceptual del pasaje.
- source_word: (eternal) ages / (eternal) age
  choice: siglos eternos / siglo eterno
  rationale: Expresa el sentido temporal supramundano sugerido por el testimonio, pero una nota advierte que la equivalencia exacta depende de la revisión copta.
- source_word: fullness
  choice: plenitud
  rationale: Conserva el posible valor técnico del término sin sustituirlo por una explicación interpretativa.
- source_word: According to Philip
  choice: Según Felipe
  rationale: Fórmula titular tradicional, natural en español y formalmente cercana al testimonio.
theological_decisions:
- issue: Identidad de la «cámara nupcial» y de sus «misterios»
  choice: No explicarlos ni identificarlos con un rito o doctrina específicos
  alternative: Interpretarlos explícitamente como sacramento, iniciación, unión celestial o matrimonio literal
  rationale: El pasaje conserva lenguaje simbólico y no aporta aquí elementos suficientes para resolver su referencia.
- issue: La recepción de la luz «aquí» y «en el otro lugar»
  choice: Mantener la afirmación tajante del texto
  alternative: Atenuarla o armonizarla con una doctrina posterior sobre la salvación después de la muerte
  rationale: La traducción debe preservar la tensión escatológica genuina del testimonio.
- issue: «No será visto ni atado»
  choice: Conservar ambos verbos sin explicar su mecanismo
  alternative: Precisarlos como invisibilidad física, liberación espiritual o inmunidad frente a poderes cósmicos
  rationale: El contexto permite varias lecturas y no justifica escoger una en el cuerpo del texto.
- issue: «La Verdad en las imágenes»
  choice: Preservar la relación paradójica sin paráfrasis
  alternative: Convertirla en «la verdad representada por símbolos» o en una formulación doctrinal
  rationale: Una explicación cerraría una ambigüedad central del pasaje.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y puntos suspensivos para señalar restauraciones y lagunas manuscritas. Se evitó el masculino genérico cuando podía alterarse sin perder naturalidad, aunque «hijo de la cámara nupcial» se mantuvo por su fuerza metafórica. Borrador necesariamente provisional: el expediente indica que aún está pendiente la revisión directa del copto.'
