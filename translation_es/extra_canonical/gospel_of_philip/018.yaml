review_pass:
  verdict: revise
  source_fidelity: 'La versión conserva adecuadamente las restauraciones entre corchetes, las lagunas con puntos suspensivos y la deliberada paradoja de que algo «no está oculto» y, sin embargo, «está oculto». No obstante, en la sección final altera dos plurales significativos del testimonio inglés: «for them» y «to them alone» pasan indebidamente a singular.'
  naturalness: El registro es en general claro y apropiado. «Aun mientras habite en el mundo» resulta menos natural y además cambia sin necesidad la construcción del original; «aun mientras vive en el mundo» expresa el sentido con mayor fluidez. La secuencia fragmentaria sobre el fuego se mantiene porque corresponde a una laguna señalada en el testimonio.
  terminology: «Cámara nupcial», «misterios», «Verdad», «imágenes» y «plenitud» son elecciones prudentes que no fuerzan una interpretación doctrinal. La nota sobre «siglos eternos»/«eones» es pertinente dada la revisión copta pendiente.
  issues:
  - severity: medium
    issue: Singularización de «for them» y «to them alone»
    rationale: El borrador dice «para esa persona» y «se le revela solo a ella», mientras que el testimonio dice «for them» y «to them alone». Deben conservarse el plural y su posible referencia colectiva sin resolverla interpretativamente.
  - severity: low
    issue: «Aun mientras habite en el mundo»
    rationale: El subjuntivo no refleja bien la afirmación descriptiva del testimonio («even while they dwell in the world»). «Aun mientras vive en el mundo» es más natural y fiel.
  revised_text: 'Todo el que [entre] en la cámara encenderá su [lámpara], porque [esto] es como los matrimonios que […] se celebran de noche: el fuego […] de noche y se apaga. Pero los misterios de este matrimonio se cumplen en el día y en la luz. Ni ese día ni su luz se ponen jamás.


