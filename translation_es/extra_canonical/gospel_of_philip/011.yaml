translation:
  language: es
  text: 'Dios es tintorero. Así como los buenos tintes —a los que llaman auténticos— mueren junto con lo que ha sido teñido con ellos, así sucede con quienes han sido teñidos por Dios. Como sus tintes son inmortales, ellos se vuelven inmortales por medio de sus colores. Pero Dios bautiza en agua.[a]


    Es imposible que alguien vea alguna de las cosas que realmente existen sin llegar a ser como ellas. No sucede como con la persona que está en el mundo: ve el sol sin convertirse en sol, y ve el cielo, la tierra y todas las demás cosas sin convertirse en ellas. Así son las cosas. Pero tú viste algo de aquel lugar y llegaste a ser como esas cosas. Viste al Espíritu y te convertiste en espíritu; viste a Cristo y te convertiste en Cristo; viste [al Padre y] te convertirás en padre. Por eso, [aquí] lo ves todo y no [te ves a ti mismo]; pero allí te ves a ti mismo, porque [te convertirás] en lo que ves.[b]


    La fe recibe; el amor da. [Nadie podrá] [recibir] sin fe, y nadie podrá dar sin amor. Por eso creemos para recibir, pero damos para amar, pues quien no da con amor no obtiene ningún provecho. Quien todavía no ha recibido al Señor sigue siendo hebreo.


    Los apóstoles que nos precedieron lo llamaron «Jesús el Nazareno Mesías», es decir, «Jesús el Nazareno Cristo». El último nombre es «Cristo»; el primero, «Jesús»; y el de en medio, «el Nazareno». «Mesías» tiene dos significados: «Cristo» y «el medido». «Jesús», en hebreo, significa «la redención». «Nazara» significa «la verdad». Por tanto, «el Nazareno» es «la verdad». «Cristo» es el que fue medido. «El Nazareno» y «Jesús» son los que fueron medidos.[c]


    Una perla no pierde valor si la arrojan al lodo, ni adquiere más valor si la ungen con bálsamo; para su dueño siempre conserva su valor. Así sucede con los hijos de Dios: estén donde estén, siguen siendo valiosos para su Padre.


    Si dices: «Soy judío», nadie se conmoverá. Si dices: «Soy romano», nadie se inquietará. Si dices: «Soy griego», «bárbaro», «esclavo» o [«libre»], nadie se turbará. [Si] [dices]: «Soy cristiano», el […] temblará. Ojalá que [… de] esta clase, este que […] no podrá soportar [oír] su nombre.


    Dios devora seres humanos. Por eso se le [sacrifica] al ser humano. Antes de que se sacrificara al ser humano, se sacrificaban animales, porque aquellos a quienes se los sacrificaban no eran dioses.


    Los recipientes de vidrio y de barro llegan a existir por medio del fuego. Pero, si los recipientes de vidrio se rompen, se los vuelve a hacer, porque llegaron a existir por medio de un aliento; en cambio, si los recipientes de barro se rompen, son destruidos, porque llegaron a existir sin aliento.


    Un burro que hacía girar una piedra de molino recorrió cien millas. Cuando lo soltaron, todavía se encontraba en el mismo lugar. Muchas personas viajan, pero no llegan a ninguna parte. Al caer la tarde, no habían visto ni ciudad ni aldea, ni cosa creada ni natural, ni poder ni ángel. Esos desdichados trabajaron en vano.


    La eucaristía es Jesús, porque en siríaco se lo llama «Pharisatha», es decir, «el que está extendido», pues Jesús vino a crucificar al mundo.


    El Señor entró en el taller de tintorería de Leví. Tomó setenta y dos colores y los echó en la tina. Los sacó todos blancos y dijo: «Así es como el Hijo de la Humanidad ha venido [como] tintorero».


    La Sabiduría, a quien llaman «la estéril», es la Madre [de los ángeles] y [la] compañera de [… María] Magdalena. [… la amaba] más que a los discípulos [… él] la besaba muchas veces en su […]. Los demás […] […] le dijeron: «¿Por qué la amas más que a todos nosotros?». El Salvador les respondió: «¿Por qué no los amo a ustedes como a ella? Cuando una persona ciega y otra que ve están ambas en la oscuridad, no se diferencian entre sí. Cuando llega la luz, quien ve verá la luz, pero quien es ciego permanecerá en la oscuridad».


    El Señor dijo: «Dichoso quien existe antes de existir, porque quien existe existió y existirá».


    La superioridad de la humanidad no se manifiesta, sino que reside en lo oculto. Por eso la humanidad domina a animales que son más fuertes y mayores tanto en lo visible como en lo oculto. Esto les permite sobrevivir. Pero, si la humanidad se separa de ellos, se matan, se muerden y se devoran unos a otros, porque no encontraban alimento. Ahora, en cambio, han encontrado alimento porque la humanidad ha trabajado la tierra.


    Si alguien baja al agua, sale sin haber recibido nada y dice: «Soy cristiano», ha tomado prestado el nombre con intereses. Pero, si recibe el Espíritu Santo, posee el nombre como un don. A quien ha recibido un don no se lo quitan; en cambio, quien lo ha tomado prestado con intereses tiene que devolverlo. Así sucede cuando alguien llega a existir en un misterio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta versión es provisional y se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto copto del Códice II de Nag Hammadi.
    reason: La ficha de la fuente indica expresamente que aún no se ha realizado la revisión en la lengua antigua.
  - marker: b
    text: Los corchetes señalan palabras restauradas o inciertas, y los puntos suspensivos entre corchetes señalan lagunas del manuscrito, conforme al testimonio utilizado.
    reason: Aclara al lector el significado editorial de las señales visibles en el texto.
  - marker: c
    text: Las equivalencias entre «Mesías», «el medido», «Jesús», «redención», «Nazara» y «verdad» pertenecen al razonamiento etimológico del propio escrito; se conservan sin corregirlas según la lingüística moderna.
    reason: Evita que el lector confunda las asociaciones interpretativas antiguas del pasaje con etimologías filológicas aceptadas.
lexical_decisions:
- source_word: dyer / dyes / dyed
  choice: tintorero / tintes / teñido
  rationale: Mantiene la imagen artesanal y la repetición deliberada que estructura tanto la apertura como el episodio del taller de Leví.
- source_word: die with
  choice: mueren junto con
  rationale: Conserva la formulación paradójica del testimonio suministrado en vez de explicarla como mera permanencia del color.
- source_word: human-eater
  choice: devora seres humanos
  rationale: Reproduce con claridad y sin suavizar la afirmación provocadora; evita el término más especializado «antropófago».
- source_word: breath
  choice: aliento
  rationale: Retiene la posible resonancia vital o espiritual sin decidir si se refiere simplemente al aire empleado en fabricar vidrio.
- source_word: Son of Humanity
  choice: Hijo de la Humanidad
  rationale: Refleja la forma distintiva del testimonio y evita armonizarla automáticamente con el título canónico tradicional «Hijo del Hombre».
- source_word: Pharisatha
  choice: Pharisatha
  rationale: Se conserva la transliteración transmitida y se traduce por separado la explicación que ofrece el propio texto.
- source_word: comes into being in a mystery
  choice: llega a existir en un misterio
  rationale: Mantiene la expresión ontológica y ritual abierta, sin sustituirla por una interpretación sacramental específica.
theological_decisions:
- issue: Transformación de quien contempla las realidades trascendentes
  choice: «te convertiste en espíritu… en Cristo… te convertirás en padre»
  alternative: Interpretarlo como simple semejanza o unión moral
  rationale: El pasaje afirma una transformación directa; se conserva su tensión teológica sin armonizarla con una doctrina posterior.
- issue: Afirmación de que Dios devora seres humanos
  choice: Se traduce de forma directa
  alternative: Atenuarla como metáfora de sacrificio o comunión
  rationale: El contexto puede sugerir una lectura simbólica, pero el texto no la explicita y no corresponde resolverla en la traducción.
- issue: Identificación de la eucaristía con Jesús y crucifixión del mundo
  choice: «La eucaristía es Jesús… vino a crucificar al mundo»
  alternative: Parafrasear como representación de Jesús o victoria sobre el mundo
  rationale: Se preservan tanto la identificación como la dirección inusual de la crucifixión.
- issue: Relación entre la Sabiduría, María Magdalena y el Salvador
  choice: Se mantienen las lagunas y el término «compañera»
  alternative: Reconstruir una relación conyugal o exclusivamente discipular
  rationale: El manuscrito fragmentario no permite precisar la relación; la traducción no impone una conclusión.
- issue: Recepción del nombre cristiano mediante agua y Espíritu
  choice: Se conserva el contraste entre nombre prestado y nombre recibido como don
  alternative: Identificar explícitamente el rito con una teología bautismal denominacional
  rationale: El pasaje relaciona agua, Espíritu, nombre y misterio, pero no define esas relaciones con suficiente detalle para sistematizarlas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefirieron oraciones claras y vocabulario común, pero se conservaron las repeticiones, paradojas, etimologías inusuales, tensiones teológicas y rupturas ocasionadas por las lagunas. Se evitó armonizar el escrito con terminología bíblica o doctrinal posterior. «Humanidad» funciona como colectivo y permite mantener abierto el referente donde el testimonio inglés alterna entre humanity, human y pronombres ambiguos.
