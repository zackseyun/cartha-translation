source:
  text: 'Those who sow in the winter reap in the summer. The winter is the world, the summer the other age. Let''s sow in the world so that we may reap in the summer. Because of this, it''s not right for us to pray in the winter. The summer follows the winter. But if someone reaps in the winter they won''t reap, but uproot, as this kind won''t produce fruit […] it doesn''t just come out […] but in the other Sabbath […] it''s fruitless.


    Christ came to buy some, but to save others, and to redeem yet others. He bought those who were strangers, made them his own, and set them apart as a pledge as he wanted to. It wasn''t just when he appeared that he laid down his life when he wanted to, but since the day the world came into being he laid down his life when he wanted to. Then he came first to take it, since it had been pledged. It was dominated by the robbers that had captured it, but he saved it; and those who are good in the world he redeemed, as well as those who are bad.


    The light and the darkness, the right and the left, are brothers of each other. They''re inseparable. So, those who are good aren''t good, those who are bad aren''t bad, nor is life (really) life, nor is death (really) death. Because of this, each one will be dissolved into its origin from the beginning. But those who are exalted above the world are indissoluble and eternal.'
