    Cristo vino a comprar a unos, a salvar a otros y a redimir a otros más. Compró a los que eran extranjeros, los hizo suyos y los puso como prenda, según quiso. No fue solamente cuando se manifestó que entregó su vida cuando quiso; más bien, desde el día en que el mundo llegó a existir, entregó su vida cuando quiso. Entonces vino primero a tomarla, pues había sido dada en prenda.[c] Estaba bajo el dominio de los ladrones que la habían capturado, pero él la salvó. También redimió tanto a los buenos que están en el mundo como a los malos.


    La luz y la oscuridad, la derecha y la izquierda, son hermanos entre sí. Son inseparables. Por tanto, los buenos no son buenos; los malos no son malos; la vida no es realmente vida, ni la muerte es realmente muerte. Por eso, cada uno se disolverá en su origen, desde el principio.[d] Pero los que han sido elevados por encima del mundo son indisolubles y eternos.'
