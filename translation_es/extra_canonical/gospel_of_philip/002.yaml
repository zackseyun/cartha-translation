base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: es
  text: 'Los que siembran en invierno cosechan en verano. El invierno es el mundo; el verano, la otra era. Sembremos en el mundo para que cosechemos en el verano. Por eso, no es correcto que oremos en el invierno.[a] El verano viene después del invierno. Pero si alguien cosecha en el invierno, no cosechará, sino que arrancará de raíz, pues esta clase no producirá fruto […] no solo sale […] sino que en el otro sábado […] es estéril.[b]


    Cristo vino a comprar a unos, a salvar a otros y a redimir a otros más. Compró a los que eran extranjeros, los hizo suyos y los apartó como garantía, según quiso. No fue solamente cuando se manifestó que entregó su vida cuando quiso; más bien, desde el día en que el mundo llegó a existir, entregó su vida cuando quiso. Entonces vino primero a tomarla, pues había sido dada en garantía.[c] Estaba bajo el dominio de los ladrones que la habían capturado, pero él la salvó. También redimió tanto a los buenos que están en el mundo como a los malos.


    La luz y la oscuridad, la derecha y la izquierda, son hermanas entre sí.[d] Son inseparables. Por tanto, los buenos no son buenos; los malos no son malos; la vida no es realmente vida, ni la muerte es realmente muerte. Por eso, cada uno se disolverá en su origen, desde el principio.[e] Pero los que han sido elevados por encima del mundo son indisolubles y eternos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La relación entre «orar en el invierno» y la imagen de sembrar y cosechar es incierta; la frase se conserva sin explicación doctrinal añadida.
    reason: Preservar una afirmación enigmática sin resolverla mediante conjetura.
  - marker: b
    text: Los puntos suspensivos entre corchetes indican lagunas o texto cuya reconstrucción es incierta. La secuencia conservada es fragmentaria.
    reason: Señalar daño manuscrito o restauración incierta conforme al testimonio proporcionado.
  - marker: c
    text: El referente de «la» en «tomarla» y «dada en garantía» no es completamente seguro en este pasaje; la redacción lo relaciona gramaticalmente con «su vida» sin excluir otras posibilidades.
    reason: Hacer visible una ambigüedad referencial relevante.
  - marker: d
    text: En español, «luz», «oscuridad», «derecha» e «izquierda» son sustantivos femeninos; por eso se usa «hermanas». El sentido corresponde a que forman pares estrechamente relacionados.
    reason: Explicar una adaptación gramatical que podría parecer teológicamente significativa sin serlo.
  - marker: e
    text: 'También podría entenderse: «cada cosa se disolverá en su origen primordial». La sintaxis de la frase transmitida es difícil.'
    reason: Registrar una alternativa plausible y conservar la incertidumbre.
lexical_decisions:
- source_word: winter / summer
  choice: invierno / verano
  rationale: Conserva literalmente la metáfora agrícola y temporal que el pasaje interpreta como «el mundo» y «la otra era».
- source_word: the other age
  choice: la otra era
  rationale: «Era» comunica un período u orden de existencia sin imponer la noción espacial de «otro mundo».
- source_word: pray
  choice: oremos
  rationale: Mantiene el sentido religioso directo del testimonio, aunque la afirmación resulte enigmática en su contexto fragmentario.
- source_word: buy / save / redeem
  choice: comprar / salvar / redimir
  rationale: Preserva la triple distinción verbal del texto en vez de fundir los términos en una sola idea soteriológica.
- source_word: pledge
  choice: garantía / dada en garantía
  rationale: Expresa algo apartado o entregado como prenda, y mantiene la metáfora transaccional sin decidir con precisión el referente ambiguo.
- source_word: laid down his life
  choice: entregó su vida
  rationale: Es una expresión natural en español y conserva el carácter voluntario reiterado por «cuando quiso».
- source_word: right and left
  choice: la derecha y la izquierda
  rationale: Retiene el par simbólico y su forma nominal sin interpretarlo moral, política o espacialmente.
- source_word: indissoluble
  choice: indisolubles
  rationale: Mantiene el contraste léxico directo con «se disolverá» y evita parafrasearlo como mera inmortalidad.
theological_decisions:
- issue: La afirmación de que no es correcto orar en invierno
  choice: Se traduce literalmente y se conserva su conexión metafórica con el mundo.
  alternative: Explicarla como una prohibición de orar en la era presente.
  rationale: El pasaje es enigmático y posiblemente fragmentario; explicitar una doctrina resolvería indebidamente su tensión.
- issue: Diversas acciones de Cristo hacia distintos grupos
  choice: Se mantienen «comprar», «salvar» y «redimir» como acciones diferenciadas.
  alternative: Uniformarlas como «salvar».
  rationale: La diferenciación puede ser teológicamente significativa y no debe eliminarse sin evidencia copta directa.
- issue: Referente de «la/lo» en la sección de la garantía y los ladrones
  choice: Se conserva el pronombre femenino exigido por «vida» en la redacción española, con nota sobre la ambigüedad del referente.
  alternative: Identificar expresamente el referente como el alma, la vida o una persona/grupo.
  rationale: El testimonio inglés no permite fijar con seguridad el referente, y la revisión del copto está pendiente.
- issue: Los buenos no son buenos y los malos no son malos
  choice: Se conserva la paradoja sin suavizarla.
  alternative: Añadir «en sentido absoluto» o explicar que las categorías son provisionales.
  rationale: Esas explicaciones podrían reflejar una interpretación doctrinal no expresada en el texto suministrado.
- issue: Disolución en el origen
  choice: Se conserva «cada uno se disolverá en su origen, desde el principio».
  alternative: Traducir interpretativamente como «volverá a su origen primordial».
  rationale: La sintaxis es difícil; la versión elegida preserva tanto la disolución como la expresión temporal sin armonizarlas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefirieron oraciones claras y vocabulario común, pero se conservaron las repeticiones, las metáforas económicas y agrícolas, y las paradojas del testimonio. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice II de Nag Hammadi.
