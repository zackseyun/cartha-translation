  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: es
  text: 'Hay animales que se someten a los seres humanos, como el ternero, el burro y otros semejantes. Otros no son dóciles y viven solos en el desierto. La humanidad ara el campo con los animales dóciles y, como resultado, se alimenta a sí misma y también a los animales, sean dóciles o no. Así sucede con el ser humano perfecto: ara con los poderes dóciles y prepara para todos los que existirán. Por eso se sostiene el lugar entero, tanto el bien como el mal, tanto la derecha como la izquierda. El Espíritu Santo pastorea a todos y gobierna todos los poderes: los dóciles, los que [no lo son] y los que están solos; porque verdaderamente los […] mantiene encerrados [de modo que, aunque …] quieran, no podrán [salir].[a]


    [El que fue] formado [es hermoso, pero] se descubriría que sus hijos son formas nobles. Si no hubiera sido formado, sino engendrado, se descubriría que su descendencia era noble. Pero ahora fue formado y engendró. ¿Qué nobleza es esta? Primero hubo adulterio y después asesinato; y él —Caín— fue engendrado en adulterio, porque era hijo de la serpiente. Por eso también se convirtió en asesino como su padre y mató a su hermano Abel. Toda unión entre quienes son diferentes es adulterio.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto está dañado en esta oración. Los corchetes señalan palabras restituidas o faltantes, y los puntos suspensivos indican una laguna. La reconstrucción y hasta la sintaxis exacta son inciertas.
    reason: Advertir al lector que la frase no puede traducirse como un enunciado continuo seguro a causa del deterioro manuscrito.
  - marker: b
    text: «Diferentes» también puede entenderse como «desemejantes». El fragmento no aclara si se refiere a naturalezas, clases de seres, condiciones espirituales u otro tipo de diferencia.
    reason: Preservar la ambigüedad conceptual de la sentencia final y evitar una aplicación doctrinal añadida.
lexical_decisions:
- source_word: submit / submissive
  choice: someterse / dócil
  rationale: Se distingue entre la acción inicial de someterse y la cualidad repetida de los animales y poderes utilizables; «dócil» resulta natural en español sin borrar el contraste con lo indómito.
- source_word: humanity / perfect human
  choice: la humanidad / el ser humano perfecto
  rationale: Conserva la diferencia entre el colectivo humano y la figura singular o representativa, con lenguaje inclusivo y natural.
- source_word: powers
  choice: poderes
  rationale: Mantiene el término cosmológico deliberadamente amplio sin interpretarlo como ángeles, espíritus u otra categoría específica.
- source_word: the whole place stands
  choice: se sostiene el lugar entero
  rationale: Conserva la imagen espacial y la posible idea de estabilidad o subsistencia, sin precisar una cosmología no explícita.
- source_word: shepherds
  choice: pastorea
  rationale: Retiene la metáfora pastoral y el vínculo verbal con la acción de un pastor.
- source_word: seed
  choice: descendencia
  rationale: En este contexto genealógico comunica el sentido humano de «semilla» con mayor naturalidad, sin reducirlo necesariamente al material biológico.
- source_word: partnership
  choice: unión
  rationale: Expresa una asociación relacional estrecha y permite conservar la aplicación sentenciosa del pasaje; «sociedad» sonaría comercial o institucional.
theological_decisions:
- issue: Alcance del gobierno del Espíritu Santo
  choice: «pastorea a todos y gobierna todos los poderes»
  alternative: Restringir «todos» a los poderes dóciles o buenos
  rationale: El testimonio suministrado incluye expresamente poderes dóciles, no dóciles y solitarios; la traducción preserva esa tensión universal sin armonizarla.
- issue: Bien y mal; derecha e izquierda
  choice: Conservar ambas parejas sin explicación
  alternative: Identificarlas con grupos, regiones cósmicas o categorías morales concretas
  rationale: El fragmento no define estas oposiciones y no corresponde importar una interpretación doctrinal.
- issue: Caín como hijo de la serpiente
  choice: Traducir la afirmación de manera directa y atribuir explícitamente el pronombre a Caín mediante rayas
  alternative: Atenuarla como metáfora o reemplazarla por una filiación moral
  rationale: La filiación es una afirmación teológica propia del escrito y debe conservarse sin validarla, corregirla ni armonizarla con otros relatos.
- issue: Toda unión de diferentes como adulterio
  choice: «Toda unión entre quienes son diferentes es adulterio»
  alternative: Limitarla explícitamente al matrimonio, a seres espirituales o a naturalezas incompatibles
  rationale: El referente de «diferentes» queda indeterminado en el testimonio; se conserva la amplitud y la tensión del aforismo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y las lagunas del testimonio, así como la terminología cosmológica no definida. Este borrador es provisional porque se basa en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Códice II de Nag Hammadi.
