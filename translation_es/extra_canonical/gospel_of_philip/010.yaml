review_pass:
  verdict: revise
  source_fidelity: La versión reproduce en general el contenido del testimonio inglés suministrado y conserva las oposiciones cosmológicas, la afirmación sobre Caín y las señales de deterioro. Sin embargo, «dóciles» atenúa y vuelve inconsistente el contraste reiterado de «submit / submissive», «desierto» restringe indebidamente «wilderness», y «mantiene encerrados» interpreta más que el directo «confines». La cláusula dañada también añade «aunque», que no está señalado por el testimonio.
  naturalness: El registro es claro y apto para español latinoamericano. Se mejora la fluidez haciendo paralela la terminología de sumisión y mediante «preparando» para reflejar el participio inglés. «Formas nobles» conserva la formulación extraña del pasaje sin normalizarla.
  terminology: Se recomienda «sumisos» / «no se someten» para mantener el léxico del testimonio sin identificar los poderes. «Semilla» debe conservarse en vez de «descendencia», pues el testimonio emplea deliberadamente la imagen de seed. «Confina» retiene la metáfora o imagen verbal sin explicitar el modo del encierro.
  issues:
  - severity: medium
    issue: «Dóciles» y «no son dóciles» no reproducen de manera uniforme «submissive / not submissive».
    rationale: «Dócil» caracteriza temperamento o domesticación; el texto subraya la acción o condición de someterse. «Sumisos» y «no se someten» mantienen mejor el contraste reiterado, también aplicado a los poderes.
  - severity: low
    issue: «Desierto» hace más específico «wilderness».
    rationale: El original inglés alude al ámbito silvestre, no necesariamente a un desierto. «Regiones agrestes» evita esa restricción geográfica.
  - severity: medium
    issue: La reconstrucción española de la frase dañada introduce «aunque».
    rationale: El testimonio conserva «[so that …] want to, they won’t be able to [leave]»; añadir «aunque» aporta una relación concesiva no señalada como parte de la reconstrucción. Conviene conservar la sintaxis fragmentaria y los marcadores.
  - severity: low
    issue: «Descendencia» sustituye la imagen de «seed».
    rationale: Aunque es idiomática en contexto genealógico, pierde la metáfora léxica del testimonio. «Semilla» es natural y mantiene la imagen.
  revised_text: 'Hay animales que se someten a los seres humanos, como el ternero, el burro y otros de esta clase. Otros no se someten y viven solos en regiones agrestes. La humanidad ara el campo con los animales sumisos y, por consiguiente, se alimenta a sí misma y a los animales, sean sumisos o no. Así es con el ser humano perfecto: ara con los poderes sumisos, preparando para todos los que existirán. Por eso subsiste el lugar entero, ya sea lo bueno o lo malo, la derecha o la izquierda. El Espíritu Santo pastorea a todos y gobierna todos los poderes: los sumisos, los que [no lo son] y los que están solos; porque verdaderamente los […] confina [de modo que …] quieran, no podrán [salir].[a]



    [El que fue] formado [es hermoso, pero] se vería que sus hijos son formas nobles. Si no hubiera sido formado, sino engendrado, se vería que su semilla era noble. Pero ahora fue formado y engendró. ¿Qué nobleza es esta? Primero hubo adulterio y después asesinato; y él —Caín— fue engendrado en adulterio, porque era hijo de la serpiente. Por eso también se convirtió en asesino como su padre y mató a su hermano Abel. Toda unión entre quienes son diferentes es adulterio.[b]'
  revised_footnotes:
  - marker: a
    text: El texto está dañado en esta oración. Los corchetes señalan palabras restituidas o faltantes, y los puntos suspensivos indican una laguna. La reconstrucción y hasta la sintaxis exacta son inciertas.
    reason: La nota sigue siendo necesaria; la revisión elimina una relación concesiva añadida y conserva la discontinuidad del testimonio.
  - marker: b
    text: «Diferentes» también puede entenderse como «desemejantes». El fragmento no aclara si se refiere a naturalezas, clases de seres, condiciones espirituales u otro tipo de diferencia.
    reason: Preserva la ambigüedad conceptual de la sentencia final sin añadir una aplicación doctrinal.
  revision_rationale: La revisión sigue de cerca el testimonio inglés público proporcionado. Ajusta términos que restringían o interpretaban el texto («dóciles», «desierto», «mantiene encerrados», «descendencia»), conserva las imágenes y repeticiones del pasaje, y mantiene visible la sintaxis incierta de la sección dañada. Dado que no se suministró el texto copto, la evaluación directa de esa fuente sigue pendiente.
