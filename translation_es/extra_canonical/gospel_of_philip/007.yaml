translation:
  language: es
  text: 'Los que dicen que el Señor primero murió y después resucitó están equivocados, porque primero resucitó y después murió. Quien no adquiere primero la resurrección no morirá. ¡Vive Dios, que esa persona /moriría\![a]


    Nadie esconderá algo grande y valioso dentro de una cosa grande; sin embargo, muchas veces alguien ha puesto incontables miles en algo que apenas vale un centavo. Así sucede también con el alma: algo valioso llegó a existir dentro de un cuerpo despreciable.


    Algunos temen resucitar desnudos. Por eso quieren resucitar en la carne, y [no] saben que quienes llevan puesta la [carne] están desnudos. Los que […] despojarse [no están] desnudos. «La carne [y la sangre no] heredarán el reino [de Dios]». ¿Qué es, entonces, lo que no heredará? Lo que llevamos encima. Pero ¿qué es también lo que heredará? La carne y la sangre de Jesús. Por eso dijo: «Quien no come mi carne ni bebe mi sangre no tiene vida en sí». ¿Qué es su carne? Es la Palabra, y su sangre es el Espíritu Santo. Quienes han recibido estas cosas tienen alimento, bebida y vestido.


    Por mi parte, no estoy de acuerdo con los otros que dicen: «No resucitará». Ambos lados están equivocados. Tú que dices: «La carne no resucitará», dinos qué resucitará, para que podamos reconocerte. Dices: «El espíritu en la carne y esta otra luz en la carne». Pero esta afirmación también está en la carne, porque, digas lo que digas, no puedes decirlo aparte de la carne. Es necesario resucitar en esta carne, pues todo existe en ella. En este mundo, las personas valen más que la ropa que llevan puesta. En el reino de los cielos, la ropa vale más que quienes la llevan puesta.


    Todo se purifica mediante agua y fuego: lo visible mediante lo visible, y lo oculto mediante lo oculto. Algunas cosas están ocultas por medio de cosas visibles. Hay agua en el agua y fuego en el crisma.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forma /moriría\ reproduce una señal inusual del testimonio utilizado; su lectura y posible corrección requieren revisión directa del manuscrito copto.
    reason: Preservar una anomalía textual sin convertirla silenciosamente en una lectura segura.
  - marker: b
    text: «Crisma» se refiere al ungüento o aceite empleado para la unción.
    reason: Aclarar un término ritual poco frecuente sin reemplazarlo por una interpretación más general.
lexical_decisions:
- source_word: arose / resurrection
  choice: resucitó / resurrección
  rationale: Mantiene el campo léxico uniforme y conserva la paradoja de adquirir la resurrección antes de morir.
- source_word: flesh
  choice: carne
  rationale: Conserva tanto la referencia corporal como la tensión simbólica del pasaje, sin sustituirla por «cuerpo» ni resolver su sentido.
- source_word: Word
  choice: la Palabra
  rationale: Reproduce el título teológico tradicional y su identificación explícita con la carne de Jesús.
- source_word: chrism
  choice: crisma
  rationale: Traslada el término ritual específico en lugar de generalizarlo como aceite o unción.
- source_word: clothes / clothing
  choice: ropa / vestido
  rationale: Usa vocabulario natural y mantiene la metáfora común que enlaza carne, desnudez y revestimiento.
- source_word: honor you
  choice: reconocerte
  rationale: En este desafío retórico comunica conceder validez o crédito al interlocutor; «honrarte» sonaría menos natural y podría sugerir veneración.
theological_decisions:
- issue: La afirmación de que el Señor resucitó antes de morir
  choice: Se conserva literalmente la secuencia paradójica.
  alternative: Reformularla como una referencia a una resurrección espiritual previa a la muerte física.
  rationale: El texto no explica de manera inequívoca la paradoja; interpretarla eliminaría una tensión teológica genuina.
- issue: Qué parte resucita
  choice: Se preservan tanto «esta carne» como la comparación con una ropa superior en el reino.
  alternative: Armonizar el pasaje a favor de una resurrección exclusivamente corporal o exclusivamente espiritual.
  rationale: El argumento contrapone y relaciona carne, espíritu, luz y vestido sin ofrecer una sistematización inequívoca.
- issue: La carne y la sangre que heredan
  choice: Se mantiene la identificación con la carne y la sangre de Jesús, seguida de Palabra y Espíritu Santo.
  alternative: Convertir la explicación en lenguaje sacramental o puramente metafórico.
  rationale: La traducción no debe decidir por el lector el carácter ritual, simbólico u ontológico de estas identificaciones.
- issue: Reino de Dios y reino de los cielos
  choice: Se conservan las dos formulaciones distintas presentes en el testimonio.
  alternative: Uniformarlas bajo una sola expresión.
  rationale: La variación puede ser significativa y no debe borrarse sin revisión directa del copto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservan los corchetes, la elipsis y las barras inversas como señales de laguna, restauración o anomalía transmitidas por el testimonio inglés. Este borrador es provisional porque la revisión directa del copto del Códice II de Nag Hammadi aún está pendiente.
