translation:
  language: es
  text: 'Cuando Eva estaba [en] Adán, la muerte no existía. Cuando se separó de él, la muerte llegó a existir. Si él [entra] de nuevo y la recibe para sí, no habrá muerte.


    «[Dios mío], Dios mío, ¿por qué, Señor, [me] has abandonado?». Dijo esto en la cruz porque allí fue dividido. […] que fue engendrado por medio de aquello que […] de Dios. El […] de entre los muertos […] existe, pero […] es perfecto […] de carne, pero esta […] es carne verdadera […] no es verdadera, [sino …] imagen de la verdadera.


    La cámara nupcial no es para los animales, ni para los esclavos, ni para los impuros, sino para las personas libres y las vírgenes.


    Somos engendrados de nuevo por medio del Espíritu Santo, pero somos engendrados por medio de Cristo mediante dos cosas. Somos ungidos por medio del Espíritu. Cuando fuimos engendrados, fuimos unidos.


    Sin luz, nadie puede verse en el agua ni en un espejo; tampoco podrás ver en la luz sin agua o espejo. Por eso es necesario ser bautizado en ambos: en la luz y en el agua. Pero la luz es el crisma.


    Había tres casas de ofrenda en Jerusalén. La que se abre hacia el oeste se llama «el Santo». La otra, que se abre hacia el sur, se llama «el Santo del Santo». La tercera, que se abre hacia el este, se llama «el Santo de los Santos», el lugar donde solo entra el sumo sacerdote. El bautismo es la casa «del Santo». La [redención] es «el Santo del Santo». «El [Santo] de los Santos» es la cámara nupcial. El [bautismo] incluye la resurrección [con] la redención. La redención está en la cámara nupcial. Pero [la] cámara nupcial es mejor que […] No encontrarás su […] los que oran […] Jerusalén. […] Jerusalén que [… Jerusalén], al ser vista […] estos que son llamados «[los Santos] de los Santos» [… el] velo rasgado […] cámara nupcial, salvo la imagen [… que] [está arriba. Por eso] su velo se rasgó de arriba abajo, porque era necesario que algunos de abajo subieran arriba.


    Los poderes no pueden ver a quienes se han revestido de la luz perfecta, ni pueden atarlos. Pero uno se revestirá de esa luz en el misterio de la unión.


    Si la mujer no se hubiera separado del varón, no habría muerto con el varón. La separación de él fue el principio de la muerte. Por eso Cristo vino a reparar la separación que existía desde el principio, uniendo de nuevo a los dos. Dará vida a quienes murieron a causa de la separación, uniéndolos. Ahora bien, la esposa se une con su esposo en la cámara nupcial, y quienes se han unido en la cámara nupcial ya no serán separados. Por eso Eva se separó de Adán: porque no se unió con él en la cámara nupcial.


    El alma de Adán llegó a existir mediante un aliento. Su compañera era el espíritu. Aquello que le fue dado era su madre. Su alma fue [tomada] y en su lugar se le dio [vida] (Eva). Cuando fue unido […] palabras que eran mejores que los poderes, y ellos lo envidiaron […] compañera espiritual […] oculto […] es decir, el […] ellos mismos […] cámara nupcial para que […] Jesús apareció [… el] Jordán, la [plenitud del reino] de los cielos. El que [fue engendrado] antes de todo fue engendrado de nuevo. El que [fue ungido] primero fue ungido de nuevo. El que fue redimido fue redimido de nuevo.


    Si es necesario hablar de un misterio: el Padre de todo se unió con la virgen que descendió, y un fuego lo iluminó aquel día. Él reveló la gran cámara nupcial, por lo que su cuerpo llegó a existir aquel día. Salió de la cámara nupcial como el que llegó a existir a partir del novio y de la novia. Así estableció Jesús todas las cosas dentro de sí mismo. También es necesario que cada uno de los discípulos entre en su descanso por medio de estas cosas.


    Adán llegó a existir a partir de dos vírgenes: del Espíritu y de la tierra virgen. Así también Cristo fue engendrado de una virgen para corregir la caída que ocurrió al principio.


    Hay dos árboles que crecen en el Paraíso. Uno engendra [animales] y el otro engendra seres humanos. Adán [comió] del árbol que engendraba animales, [y] se convirtió en animal y engendró [animales]. Por eso los hijos de Adán adoran a los [animales]. El árbol […] es fruto […] esto ellos […] comieron el […] fruto del […] engendrar seres humanos […] del ser humano de […] Dios hace al ser humano, [… los seres humanos] hacen a [Dios]. Así sucede en el mundo: los seres humanos hacen dioses y adoran su propia creación. ¡Sería mejor que los dioses adoraran a los seres humanos!


    La verdad es que la obra de la humanidad procede de su poder; por eso son llamados «los poderes». Sus obras son sus hijos, que llegan a existir mediante el descanso. Así, su poder existe en sus obras, pero el descanso se manifiesta en sus hijos. Y descubrirás que esto se extiende hasta la imagen. Así es la persona en la imagen: realiza sus obras mediante su poder, pero engendra a sus hijos mediante el descanso.


    En este mundo, los esclavos trabajan para los libres. En el reino de los cielos, los libres servirán a los esclavos. Los hijos de la cámara nupcial servirán a los hijos del [matrimonio. Los] hijos de la cámara nupcial tienen un [solo] nombre: «Descanso». [Al estar] juntos, no necesitan tomar forma, [porque tienen] contemplación […] son muchos […] con los que están en […] las glorias de los […] no […] ellos […] descender al [agua …] se redimirán […] es decir, los que han […] en su nombre, porque él dijo: «[Así] cumpliremos toda justicia».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice II de Nag Hammadi. Los corchetes dentro del pasaje señalan restauraciones o palabras inciertas, y los puntos suspensivos entre corchetes indican lagunas del manuscrito.
    reason: Informa con transparencia la base textual provisional y explica las señales editoriales necesarias para leer un texto muy fragmentario.
lexical_decisions:
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Conserva la imagen ritual y teológica central del escrito con una expresión clara y digna en español actual.
- source_word: chrism
  choice: crisma
  rationale: Mantiene el término técnico para la unción ritual, en vez de sustituirlo por una interpretación más general.
- source_word: powers / power
  choice: poderes / poder
  rationale: Preserva el juego verbal del pasaje entre las entidades llamadas «poderes» y la capacidad activa denominada «poder».
- source_word: rest
  choice: descanso
  rationale: Reproduce el motivo recurrente sin decidir si denota reposo ritual, estado escatológico o realidad espiritual.
- source_word: begotten
  choice: engendrado
  rationale: Mantiene el lenguaje de generación del testimonio y sus repeticiones deliberadas.
- source_word: female / male
  choice: mujer / varón
  rationale: Conserva la oposición sexual del argumento sin usar el registro zoológico que en español podrían sugerir «hembra» y «macho».
- source_word: houses of offering
  choice: casas de ofrenda
  rationale: Traducción formal que no identifica con seguridad estas estructuras con recintos o dependencias históricas específicas.
theological_decisions:
- issue: La reunión de Eva y Adán y el fin de la muerte
  choice: Se preservan los referentes pronominales y la formulación simbólica sin explicar qué significa que él «entre» o la «reciba».
  alternative: Explicitar que Adán vuelve a recibir a Eva o interpretar el pasaje como una doctrina sacramental concreta.
  rationale: El texto transmitido es ambiguo y fragmentario; precisarlo resolvería indebidamente su tensión teológica.
- issue: La cámara nupcial como misterio de unión
  choice: Se traduce de manera consistente «cámara nupcial» y «unión», sin equipararlas explícitamente con matrimonio, eucaristía u otro rito posterior.
  alternative: Identificar la cámara nupcial con un sacramento o práctica denominacional determinada.
  rationale: El pasaje utiliza imaginería ritual propia, pero no ofrece base suficiente para imponer una identificación confesional.
- issue: La luz, el agua y el crisma
  choice: Se conserva la afirmación «la luz es el crisma» junto al bautismo en luz y agua.
  alternative: Parafrasear la luz como Espíritu Santo o reducir ambas imágenes al bautismo acuático.
  rationale: La equivalencia pertenece al texto y debe mantenerse sin armonización doctrinal.
- issue: Cristo engendrado y ungido de nuevo
  choice: Se mantiene la repetición «de nuevo» pese a su dificultad teológica.
  alternative: Reformularla como manifestación, reconocimiento o renovación simbólica.
  rationale: La repetición es genuina en el testimonio suministrado y no debe neutralizarse mediante interpretación.
- issue: «Dios hace al ser humano; los seres humanos hacen a Dios»
  choice: Se conserva la formulación paradójica y la restauración marcada entre corchetes.
  alternative: Cambiar «Dios» por «dioses» o explicar que se trata únicamente de ídolos.
  rationale: El contexto critica la fabricación de dioses, pero el estado fragmentario exige preservar la forma transmitida y su posible tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones, paradojas y brusquedades propias del escrito, así como las lagunas y restauraciones del testimonio. Se evitó suavizar el lenguaje ritual o identificarlo con doctrinas denominacionales posteriores.
