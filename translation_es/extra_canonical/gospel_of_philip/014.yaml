review_pass:
  verdict: revise
  source_fidelity: La revisión se limita necesariamente al testimonio inglés suministrado, pues no se proporciona el texto copto para cotejo directo. El borrador preserva de manera fiel las lagunas ([…]), las restauraciones entre corchetes, las repeticiones y las ambigüedades rituales del testimonio. Se recomienda un ajuste menor para no alterar la designación citada de la primera «casa» y para resolver una discordancia referencial en el pasaje sobre «los poderes».
  naturalness: El español es en general natural, actual y de registro apropiadamente sobrio. Se ajusta la puntuación de la cita interrogativa según el uso español y se hace más fluida la construcción «la obra de la humanidad… por eso son llamados», cuyo sujeto plural quedaba mal establecido.
  terminology: «Cámara nupcial», «crisma», «poderes», «descanso», «engendrado» y «casa(s) de ofrenda» son elecciones consistentes y adecuadas. Se conservan sin interpretación confesional. «El Santo», «el Santo del Santo» y «el Santo de los Santos» se mantienen como etiquetas literales y extrañas, tal como exige el testimonio puente.
  issues:
  - severity: low
    issue: Puntuación tras la cita interrogativa inicial
    rationale: En español no corresponde añadir punto entre el signo de cierre de interrogación y las comillas antes de «Dijo esto». Se corrige sin afectar el contenido.
  - severity: medium
    issue: «El bautismo es la casa “del Santo”» altera la etiqueta citada
