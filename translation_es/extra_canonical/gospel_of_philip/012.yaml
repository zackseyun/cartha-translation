translation:
  language: es
  text: '[El] misterio del matrimonio [es] grande, porque [sin] él el mundo [no existiría]; porque [la] estructura del [mundo…], sino la estructura [… el matrimonio]. Piensa en lo [íntimo…] profanado, porque tiene […] poder. Su imagen existe en una [profanación].[a]


    Los espíritus impuros adoptan [formas] masculinas y femeninas. Los masculinos son los que tienen intimidad con las almas que habitan en una forma femenina, y los femeninos son los que se mezclan con quienes están en una forma masculina, por causa de la desobediencia. Nadie podrá librarse de quedar atado por ellos sin recibir un poder masculino y uno femenino —el novio y la novia— conforme a la imagen de la cámara nupcial.[b] Cuando las mujeres insensatas ven a un hombre sentado a solas, se abalanzan sobre él, juguetean con él y lo profanan. Del mismo modo, cuando los hombres insensatos ven a una mujer hermosa sentada a solas, la seducen y la fuerzan, queriendo profanarla. Pero, si ven al esposo y a su esposa sentados juntos, las mujeres no pueden entrar en el esposo ni los hombres en la esposa. Así sucede cuando la imagen se une con el ángel: nadie podrá atreverse a entrar en el [hombre] ni en la mujer.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes y puntos suspensivos señalan palabras restituidas o lagunas del manuscrito. Debido al daño, la sintaxis y el sentido de estas líneas son inciertos.
    reason: Advierte al lector sobre la condición fragmentaria del primer párrafo y evita presentar una reconstrucción como segura.
  - marker: b
    text: «Poder masculino», «poder femenino», «novio», «novia» y «cámara nupcial» pueden tener aquí un sentido simbólico o ritual; el pasaje no lo aclara.
    reason: Preserva la ambigüedad conceptual y teológica sin imponer una lectura confesional.
  - marker: c
    text: También son inciertos los referentes de «la imagen», «el ángel», «el hombre» y «la mujer» en esta comparación.
    reason: Señala una ambigüedad genuina que no debe resolverse silenciosamente.
lexical_decisions:
- source_word: mystery of marriage
  choice: misterio del matrimonio
  rationale: Conserva el lenguaje mistérico y la referencia matrimonial sin interpretarla como un sacramento específico.
- source_word: structure
  choice: estructura
  rationale: Mantiene el término abstracto del testimonio inglés en un pasaje gravemente incompleto, sin reconstruir su argumento.
- source_word: defiled / defilement
  choice: profanado / profanación
  rationale: Reproduce la dimensión de contaminación o violación de lo sagrado y evita reducir el sentido a mera suciedad física.
- source_word: male and female forms
  choice: formas masculinas y femeninas
  rationale: Distingue la forma asumida del sexo de las personas mencionadas posteriormente.
- source_word: male power and a female one
  choice: un poder masculino y uno femenino
  rationale: Preserva la formulación conceptual y su posible sentido simbólico sin sustituirla por categorías doctrinales.
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Es una equivalencia formal y comprensible que conserva el término técnico recurrente en el Evangelio de Felipe.
- source_word: coerce
  choice: fuerzan
  rationale: Expresa claramente la falta de consentimiento indicada por el testimonio, sin suavizar la violencia.
- source_word: image unites with the angel
  choice: la imagen se une con el ángel
  rationale: Mantiene la relación enigmática entre «imagen» y «ángel» sin explicar ni identificar sus referentes.
theological_decisions:
- issue: Relación entre matrimonio, existencia del mundo y cámara nupcial
  choice: Conservar el vocabulario matrimonial y mistérico sin armonización doctrinal
  alternative: Interpretarlo explícitamente como matrimonio humano, sacramento o unión espiritual
  rationale: El pasaje combina lenguaje cosmológico, sexual y ritual, y su estado fragmentario no permite fijar una sola interpretación.
- issue: Poder masculino y femenino recibido para escapar de los espíritus
  choice: Mantener ambos poderes y su identificación aposicional con el novio y la novia
  alternative: Explicarlos como virtudes, ángeles, sacramentos o componentes del alma
  rationale: El texto ofrece imágenes yuxtapuestas, pero no define con precisión su ontología.
- issue: La imagen unida con el ángel
  choice: Traducir literalmente la afirmación enigmática
  alternative: Resolver «ángel» como cónyuge celestial, yo superior o ser espiritual específico
  rationale: La evidencia suministrada no justifica escoger una interpretación teológica particular.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva el paralelismo y la aspereza de los fragmentos dañados. Este borrador es provisional: se basa en el testimonio inglés de dominio público suministrado, pues la revisión directa del copto sigue pendiente.'
