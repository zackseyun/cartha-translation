review_pass:
  verdict: revise
  source_fidelity: 'El borrador reproduce de manera fiel el testimonio inglés suministrado y conserva adecuadamente corchetes, lagunas y la ambigüedad de las imágenes nupciales. Sin acceso directo al copto, esta evaluación se limita a la fidelidad frente al testimonio inglés puente. Conviene sustituir «profanado/profanación» por «contaminado/contaminación»: *defiled/defilement* no exige en este pasaje una noción de profanación sacrílega y la nueva opción conserva mejor la amplitud semántica. También se ajustan dos construcciones para reflejar más directamente «through disobedience» e «in the image of».'
  naturalness: El español es en general claro, actual y de registro adecuado. «No podrá librarse de quedar atado» resulta algo pesado; «no podrá escapar de ser atado» es más directo. «Mediante la desobediencia» representa con mayor precisión la relación instrumental del original inglés.
  terminology: «Misterio», «matrimonio», «poder masculino/femenino», «novio», «novia», «cámara nupcial», «imagen» y «ángel» son elecciones apropiadas y no imponen una interpretación doctrinal. «Contaminar» mantiene la recurrencia léxica de *defile* sin introducir de modo indebido el matiz específicamente cultual de «profanar».
  issues:
  - severity: medium
    issue: «Profanado/profanación» restringe indebidamente el sentido de «defiled/defilement».
    rationale: «Profanar» suele implicar una violación de lo sagrado. El testimonio emplea el término más amplio *defile*, repetido en un contexto sexual y simbólico; «contaminar/contaminación» conserva mejor esa amplitud sin resolver su carácter ritual o moral.
  - severity: low
    issue: «Por causa de la desobediencia» y «conforme a la imagen» son algo interpretativos o menos directos.
    rationale: «Mediante la desobediencia» vierte más cercanamente *through disobedience*, y «a imagen de» refleja la construcción *in the image of* sin añadir el matiz normativo que puede tener «conforme a».
  - severity: low
    issue: «Librarse de quedar atado» es una construcción poco fluida.
    rationale: «Escapar de ser atado» conserva el pasivo y la dependencia de «sin recibir», a la vez que resulta más natural.
  revised_text: '[El] misterio del matrimonio [es] grande, porque [sin] él el mundo [no existiría]; porque [la] estructura del [mundo…], sino la estructura [… el matrimonio]. Piensa en lo [íntimo…] contaminado, porque tiene […] poder. Su imagen existe en una [contaminación].[a]



    Los espíritus impuros adoptan [formas] masculinas y femeninas. Los masculinos son los que tienen intimidad con las almas que habitan en una forma femenina, y los femeninos son los que se mezclan con quienes están en una forma masculina mediante la desobediencia. Nadie podrá escapar de ser atado por ellos sin recibir un poder masculino y uno femenino —el novio y la novia— a imagen de la cámara nupcial.[b] Cuando las mujeres insensatas ven a un hombre sentado a solas, se abalanzan sobre él, juguetean con él y lo contaminan. Del mismo modo, cuando los hombres insensatos ven a una mujer hermosa sentada a solas, la seducen y la fuerzan, queriendo contaminarla. Pero, si ven al esposo y a su esposa sentados juntos, las mujeres no pueden entrar en el esposo ni los hombres en la esposa. Así sucede cuando la imagen se une con el ángel: nadie podrá atreverse a entrar en el [hombre] ni en la mujer.[c]'
