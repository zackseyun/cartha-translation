theological_decisions:
- issue: Relación entre resurrección presente y resurrección después de la muerte
  choice: Conservar la afirmación tajante de que la resurrección debe recibirse durante la vida
  alternative: Explicarla como mera experiencia espiritual anticipada
  rationale: El pasaje mantiene deliberadamente una tensión escatológica que no debe resolverse mediante paráfrasis doctrinal.
- issue: El creador del mundo y su falta de incorruptibilidad
  choice: Traducir literalmente la afirmación sin identificar al creador con Dios ni con otra figura
  alternative: Armonizarla con una doctrina específica de la creación
  rationale: La identidad y valoración de «quien lo creó» forman parte de la ambigüedad teológica genuina del texto.
- issue: «Un dios engendra un dios»
  choice: Mantener la formulación en minúscula
  alternative: Cambiarla por «Dios engendra hijos de Dios»
  rationale: La expresión desarrolla una analogía de generación y semejanza; reformularla eliminaría su fuerza y añadiría interpretación.
- issue: Género del «ser humano perfecto»
  choice: Usar «ser humano» y referentes que no lo reduzcan necesariamente a un varón
  alternative: Traducir sistemáticamente «hombre perfecto»
  rationale: La expresión parece antropológica y posiblemente arquetípica; «ser humano» conserva mejor ese alcance, excepto donde el texto vincula explícitamente santidad y sacerdocio.
- issue: La Ley como árbol del conocimiento y principio de muerte
  choice: Preservar la identificación y su valoración negativa
  alternative: Atenuarla mediante una explicación paulina o denominacional
  rationale: La tensión pertenece al argumento propio del escrito y no debe armonizarse desde fuera.
- issue: Lenguaje de unión e intimidad
  choice: Mantener las metáforas relacionales sin sexualizarlas más ni espiritualizarlas por completo
  alternative: Convertir toda «intimidad» en simple asociación doctrinal
  rationale: El pasaje emplea deliberadamente imágenes nupciales y de semejanza ontológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron corchetes y puntos suspensivos para indicar lagunas y restauraciones inciertas del manuscrito. La traducción es necesariamente provisional porque el material suministrado declara pendiente la revisión directa del copto; por ello no se reconstruyeron lagunas ni se suavizaron afirmaciones teológicas difíciles. Se prefirieron oraciones claras, pero se mantuvieron repeticiones y transiciones abruptas cuando forman parte del testimonio fragmentario.
