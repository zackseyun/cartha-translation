review_pass:
  verdict: revise
  source_fidelity: La traducción conserva de manera amplia el contenido, las lagunas marcadas con corchetes, las formulaciones teológicas difíciles y la terminología central del testimonio inglés suministrado. Sin embargo, «era venidera» introduce una orientación escatológica que el testigo expresa como «(eterna) era» y que no debe sustituirse; además, la formulación de la copa como «figura de la sangre por la que dan gracias» altera la relación «la sangre sobre la cual dan gracias».
  naturalness: El español es en general natural, sobrio y apto para un registro de traducción académica. Se han ajustado dos formulaciones para que sean claras sin reducir la ambigüedad ritual o simbólica del pasaje.
  terminology: «Unción», «incorruptibilidad», «cámara nupcial», «ser humano perfecto» y «Palabra» son decisiones consistentes y no imponen una lectura confesional. Se conserva «Hijo del Ser Humano» con una nota que informa la alternativa tradicional. «Era (eterna)» reproduce la acotación del testigo sin añadir «venidera».
  issues:
  - severity: medium
    issue: «En la era venidera» por «in the (eternal) age».
    rationale: «Venidera» no está en el testigo y convierte una calificación explícita, «(eterna)», en una inferencia escatológica. Dada la densidad técnica de «era/eón» en este escrito, conviene conservar la formulación sin resolverla.
  - severity: medium
    issue: «La sangre por la que dan gracias» en la descripción de la copa.
    rationale: El testigo dice que la copa está dispuesta como tipo de «la sangre sobre la cual dan gracias». La preposición «por» puede indicar causa o medio y modifica la imagen ritual. «Sobre la cual» conserva la relación textual.
  revised_text: 'Quienes dicen que primero morirán y después resucitarán están equivocados. Si no reciben primero la resurrección mientras viven, no recibirán nada cuando mueran. Lo mismo ocurre cuando hablan del bautismo y dicen: «El bautismo es algo grande», porque quienes lo reciben vivirán.



    El apóstol Felipe dijo: «José el carpintero plantó un huerto porque necesitaba madera para su oficio. Él mismo hizo la cruz con los árboles que había plantado, y su descendiente quedó colgado de aquello que él plantó. Su descendiente era Jesús, y la planta era la cruz». Pero el Árbol de la Vida está en medio del Paraíso; del olivo vino la unción[a], y de esta, la resurrección.



    Este mundo devora cadáveres. Todo lo que es devorado en él también muere. La Verdad se alimenta de vida; por eso, nadie que se nutra de [la Verdad] morirá. Jesús vino de aquel lugar y trajo alimento de allí; a quienes quisieron, les dio [de comer para que] no murieran.



    [Dios…] un Paraíso, [ser humano…] Paraíso, hay […] y […] de Dios […] quienes están [en él…] Deseo que [el Paraíso…] me digan: «[… come] esto», o «no comas [aquello…] deseo». El árbol del conocimiento es el lugar donde comeré de todo. Mató a Adán, pero aquí hace vivir a la humanidad. La Ley era el árbol. Tiene el poder de dar el conocimiento del bien y del mal. No los apartó del mal ni los estableció en el bien, sino que produjo la muerte para quienes comieron de él; pues cuando dijo: «Come esto; no comas aquello», se convirtió en el principio de la muerte.



    La unción es superior al bautismo, pues se nos llama «cristianos» por la unción, no por el bautismo. Y fue por la unción por lo que Cristo recibió su nombre, porque el Padre ungió al Hijo, el Hijo ungió a los apóstoles y los apóstoles nos ungieron a nosotros. Quien ha sido ungido lo tiene todo: la resurrección, la luz, la cruz y el Espíritu Santo. El Padre le dio esto en la cámara nupcial, y él lo recibió. El Padre estaba en el Hijo y el Hijo en el Padre. Este es [el reino] de los cielos.



    El Señor lo dijo bien: «Algunos fueron al reino de los cielos riendo y salieron […] un cristiano […] y tan pronto como [… bajó] al agua, él […] todo acerca de […] es [un] juego, [pero… desprecian] esto […] al reino de [los cielos…] si desprecian […] y si lo tratan con desdén como un juego, [… saldrán] riendo». Lo mismo sucede con el pan, la copa y el aceite, aunque hay uno superior a estos.



    El mundo llegó a existir por una transgresión, porque quien lo creó quería hacerlo incorruptible e inmortal. Él cayó y no obtuvo lo que quería, pues el mundo no era incorruptible, y quien lo creó tampoco era incorruptible. Porque no son las cosas las que son incorruptibles, sino los hijos. Nada podrá recibir la incorruptibilidad sin hacerse hijo. Pero quien no puede recibir, ¡cuánto menos podrá dar!



    La copa de la oración contiene vino y agua, pues ha sido dispuesta como figura de la sangre sobre la cual dan gracias. Se llena del Espíritu Santo y pertenece al ser humano completamente perfecto. Cada vez que bebamos de ella, recibiremos al ser humano perfecto. El agua viva es un cuerpo. Es necesario que nos revistamos del ser humano viviente. Por eso, quienes bajan al agua se despojan de sus ropas para revestirse de aquel.



    Un caballo engendra un caballo, un ser humano engendra un ser humano y un dios engendra un dios. Lo mismo sucede con [el novio] y [las novias]. Ellos [llegan a existir] de […] Ningún judío […] de […] existe y […] de los judíos […] los cristianos […] llamaron a estos […] «el linaje escogido de […]», «el ser humano verdadero», «el Hijo del Ser Humano»[b] y «la descendencia del Hijo del Ser Humano». Este linaje verdadero es conocido en el mundo. Estos son los lugares donde existen los hijos de la cámara nupcial.



    En este mundo, la unión se da entre varón y mujer, el lugar de la fuerza y la debilidad. En la era (eterna), la unión es de otra clase, aunque nos referimos a esas realidades con los mismos nombres. Sin embargo, hay otros nombres que están por encima de todo nombre pronunciado, y son superiores a los fuertes, porque donde hay fuerza existen quienes son aún más poderosos. No son dos cosas distintas, sino que ambas son la misma cosa. Esto es lo que no podrá descender sobre el corazón carnal.



    ¿No es necesario que todo el que lo tiene todo se conozca plenamente? Algunos que no se conocen no podrán disfrutar de lo que poseen, pero quienes han llegado a conocerse lo disfrutarán.



    No solo serán incapaces de atar al ser humano perfecto, sino que tampoco podrán verlo, porque si lo ven, lo atarán. No hay otra manera de que alguien adquiera para sí esta gracia [sino] revistiéndose de la luz perfecta [y] convirtiéndose en la [luz] perfecta. [Quien se haya revestido de ella] irá […] esto es lo perfecto […] que lleguemos a ser […] antes de que viniéramos a […] quien recibe todo […] estos lugares, podrá […] aquel lugar, pero […] [en medio] como incompleto. Solo Jesús conoce el fin de este.



    El hombre santo —el sacerdote— es enteramente santo, incluso en su cuerpo, porque si recibe el pan, lo santificará; lo mismo hará con la copa o con cualquier otra cosa que tome y purifique. ¿Por qué no habría de purificar también el cuerpo?



    Así como Jesús perfeccionó el agua del bautismo, de esa manera derramó la muerte. Por eso bajamos al agua, pero no bajamos a la muerte, para no ser derramados en el espíritu del mundo. Cuando este sopla, llega el invierno; cuando el Espíritu Santo alienta, llega el verano.



    Quien conoce la verdad es una persona libre, y la persona libre no peca, porque «quien peca es esclavo del pecado». La Verdad es la Madre, pero el conocimiento es la unión. A quienes no se entregan al pecado, el mundo los llama «libres». El conocimiento de la verdad llena de orgullo a quienes no se entregan al pecado. Eso es lo que los hace libres y los eleva por encima de todo. Pero «el amor edifica»; y quien ha sido liberado mediante el conocimiento se hace esclavo por amor a quienes todavía no pueden alcanzar [la] libertad del conocimiento, [pero] el conocimiento los capacita [para] llegar a ser libres. El amor […] nada como propio […] lo […] propio. Nunca [dice: «…»] ni «esto es mío», [sino: «…] son de ustedes». El amor espiritual es vino fragante. Todos los que se ungen con él lo disfrutan. Mientras permanecen cerca los ungidos, también lo disfrutan quienes están a su alrededor. Si los ungidos con el perfume los dejan y se van, quienes no están ungidos y solo se hallaban cerca

    permanecen en su hedor.



    El samaritano no le dio al herido nada más que vino con aceite. No era otra cosa que el ungüento, y este sanó las heridas, porque «el amor cubre multitud de pecados».



    Los hijos que una mujer dé a luz se parecerán al hombre que ella ama. Si es su esposo, se parecerán a su esposo; si es un adúltero, se parecerán al adúltero. A menudo, si una mujer se acuesta con su esposo porque tiene que hacerlo, pero su corazón está con el adúltero con quien mantiene intimidad, y da a luz un hijo, el hijo que da a luz se parece al adúltero. Pero ustedes, que existen con el Hijo de Dios, no amen al mundo; amen más bien al Señor, para que aquellos a quienes engendren no lleguen a parecerse al mundo, sino al Señor.



    El ser humano se une con el ser humano, el caballo con el caballo y el asno con el asno. Las especies se unen [con] especies semejantes. Así sucede cuando el espíritu se une con el espíritu, la [Palabra] tiene intimidad con la Palabra [y la luz] tiene intimidad [con la luz. Si tú] te haces ser humano, [el ser humano] te amará. Si te haces [espíritu], el Espíritu se unirá contigo. [Si] te haces Palabra, la Palabra se unirá contigo. Si te haces luz, la luz tendrá intimidad contigo. Si llegas a ser uno de los de arriba, los de arriba reposarán sobre ti. Si te haces caballo, asno, becerro, perro, oveja o cualquier otro de los animales que están afuera o abajo, ni el ser humano, ni el espíritu, ni la Palabra, ni la luz, ni los de arriba, ni los de adentro podrán amarte. No podrán reposar dentro de ti, y no tendrás parte en ellos.



    Quien es esclavo contra su voluntad podrá ser liberado. Quien ha sido liberado por la gracia de su amo y se ha vendido de nuevo como esclavo ya no podrá ser liberado.'
