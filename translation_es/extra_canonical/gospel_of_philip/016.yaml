review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado y conserva en general sus lagunas, repeticiones y ambigüedades. Se requieren correcciones puntuales: «pornography» debe reflejarse como «pornografía», no «prostitución»; y varios pronombres en el pasaje sobre causar tristeza deben conservar la indeterminación/plural del testimonio en vez de fijarlos en singular.'
  naturalness: El español es mayormente claro, actual y de registro digno. Se mejoran algunas formulaciones para evitar añadidos innecesarios («La cosecha») y para hacer más natural la referencia al jefe de familia y a la exposición del matrimonio.
  terminology: Se mantienen de forma consistente «Hijo de la Humanidad», «crear/engendrar», «Palabra», «dar descanso» y «cámara nupcial». «Pornografía» es el equivalente auditivamente fiel del inglés de control; no hay base en los datos proporcionados para una nota que atribuya un campo semántico distinto al término subyacente.
  issues:
  - severity: medium
    issue: «prostitución» traduce «pornography».
    rationale: El testimonio inglés dice explícitamente «it becomes pornography». «Prostitución» cambia el referente y estrecha o desplaza la imagen de la exposición sexual indebida. «Pornografía» conserva el término del texto de control sin imponer una interpretación adicional.
  - severity: medium
    issue: La nota c hace una afirmación léxica sobre el término subyacente no verificable con el material proporcionado.
    rationale: La tarea declara pendiente la revisión directa del copto y no suministra el vocablo copto ni evidencia para sostener que abarque específicamente «prostitución» o «inmoralidad sexual». Debe retirarse.
  - severity: low
    issue: «La cosecha» añade un sujeto no expreso a «They gather into barns».
    rationale: Aunque la inferencia agrícola es comprensible, «Se recoge en graneros» conserva mejor la formulación impersonal y fragmentaria del testimonio.
  - severity: low
    issue: En el razonamiento sobre quienes están en buena situación, el borrador singulariza referentes que el inglés mantiene ambiguos mediante «they/them».
    rationale: «Les causa tristeza» y «No son así» preservan mejor la referencia abierta y el carácter difícil del pasaje.
  revised_text: 'El mundo se cultiva mediante cuatro cosas. Se recoge en graneros mediante el agua, la tierra, el viento y la luz. De la misma manera, Dios también cultiva mediante cuatro cosas: la fe, la esperanza, el amor y el conocimiento. Nuestra tierra es la fe en la que estamos arraigados. [Y] el [agua] es la esperanza mediante la cual [somos] alimentados. El viento es el amor mediante el cual crecemos. Y la luz [es] el conocimiento mediante el cual [maduramos]. La gracia existe en [cuatro clases. Es] terrenal, es [celestial, …] el cielo del cielo […] mediante […].[a]



    Dichoso quien no ha […] a ninguna alma. Este es Jesucristo. Recorrió todos los lugares y no fue una carga para nadie. Por eso, dichosa la persona que es así: es una persona perfecta, pues la Palabra nos habla de lo difícil que es mantenerse a la altura. ¿Cómo podremos alcanzar algo tan grande? ¿Cómo dará descanso a todos? Ante todo, no está bien causar tristeza a nadie —sea grande o pequeño, incrédulo o creyente— y después dar descanso a quienes ya descansan entre los que están en buena situación. Hay quienes se benefician al dar descanso al que está en buena situación. Quien hace el bien no puede darles descanso, porque no puede hacer sencillamente lo que quiera; tampoco puede causar tristeza, porque no puede causar aflicción. Sin embargo, a veces quien está en buena situación les causa tristeza. No son así, sino que es su propia maldad la que les causa tristeza. Quien posee la naturaleza de la persona perfecta da alegría al que es bueno, pero algunos se entristecen terriblemente por
    ello.



    Un jefe de familia había adquirido de todo: hijos, esclavos, ganado, perros, cerdos, trigo [o] cebada, paja, heno, […] carne y bellotas. [Pero era] sabio y entendía con qué alimentar a cada [uno]. A los hijos les servía pan […], pero [… a los] esclavos les servía […]; al ganado [le echaba cebada], paja y heno; a [los] perros les echaba huesos, [y a los cerdos], bellotas y desperdicios.



    Así sucede con el discípulo de Dios. Si es sabio, entiende lo que significa ser discípulo. Las formas corporales no lo engañarán, sino que observará la condición del alma de cada uno y hablará con cada uno. En el mundo hay muchos animales hechos con forma humana. El discípulo los reconoce. A los cerdos les echará bellotas; al ganado, cebada con paja y heno; a los perros, huesos; a los esclavos les dará el aperitivo, y a los hijos, el alimento perfecto.



    Existe el Hijo de la Humanidad, y existe el hijo del Hijo de la Humanidad.[b] El Señor es el Hijo de la Humanidad, y el hijo del Hijo de la Humanidad es quien crea mediante el Hijo de la Humanidad. El Hijo de la Humanidad recibió de Dios la capacidad de crear. También posee la capacidad de engendrar. Quien recibió la capacidad de crear es una criatura; quien recibió la capacidad de engendrar es engendrado. Quien crea no puede engendrar; quien engendra puede crear. Dicen: «Quien crea, engendra». Pero lo que engendra es una criatura. [Por eso], sus engendrados no son sus hijos, sino que son […]. Quien crea obra [públicamente] y él mismo queda [manifestado]. Quien engendra, engendra [en secreto], y ellos están ocultos […] la imagen. [De nuevo], quien [crea, crea] públicamente; pero quien engendra, [engendra] hijos en secreto.



    [Nadie podrá] saber [cuándo el esposo] y la esposa tienen intimidad entre sí, excepto ellos mismos, porque el matrimonio del mundo es un misterio para quienes se han casado. Si el matrimonio impuro está oculto, ¡cuánto más es el matrimonio puro un verdadero misterio! No es carnal, sino puro. No procede del deseo, sino de la voluntad. No pertenece a la oscuridad ni a la noche, sino al día y a la luz. Si un matrimonio es desnudado, se convierte en pornografía: no solo si la novia recibe la semilla de otro hombre, sino que incluso comete adulterio si sale de la cámara nupcial y alguien la ve. Que se muestre a su padre, a su madre, al amigo del novio y a los hijos del novio. A ellos se les permite entrar cada día en la cámara nupcial. Pero que los demás anhelen tan solo oír su voz y disfrutar de su perfume y que, como perros, coman las migajas que caen de la mesa. Los novios y las novias pertenecen a la cámara nupcial. Nadie podrá ver al novio y a la novia a menos que [lleguen a ser] como
    ellos.'
