translation:
  language: es
  text: 'El mundo se cultiva mediante cuatro cosas. La cosecha se recoge en graneros mediante el agua, la tierra, el viento y la luz. De la misma manera, Dios también cultiva mediante cuatro cosas: la fe, la esperanza, el amor y el conocimiento. Nuestra tierra es la fe en la que estamos arraigados. [Y] el [agua] es la esperanza mediante la cual [somos] alimentados. El viento es el amor mediante el cual crecemos. Y la luz [es] el conocimiento mediante el cual [maduramos]. La gracia existe en [cuatro clases. Es] terrenal, es [celestial, …] el cielo del cielo […] mediante […].[a]


    Dichoso quien no ha […] a ninguna alma. Este es Jesucristo. Recorrió todos los lugares y no fue una carga para nadie. Por eso, dichosa la persona que es así: es una persona perfecta, pues la Palabra nos habla de lo difícil que es mantenerse a la altura. ¿Cómo podremos alcanzar algo tan grande? ¿Cómo dará descanso a todos? Ante todo, no está bien causar tristeza a nadie —sea grande o pequeño, incrédulo o creyente— y después dar descanso a quienes ya descansan entre los que están en buena situación. Hay quienes se benefician al dar descanso al que está en buena situación. Quien hace el bien no puede darles descanso, porque no puede hacer sencillamente lo que quiera; tampoco puede causar tristeza, porque no puede causar aflicción. Sin embargo, a veces el que está en buena situación le causa tristeza. Esa persona no es así; es su propia maldad la que le causa tristeza. Quien posee la naturaleza de la persona perfecta da alegría al que es bueno, pero algunos se entristecen terriblemente por
    ello.


    Un dueño de casa había adquirido de todo: hijos, esclavos, ganado, perros, cerdos, trigo [o] cebada, paja, heno, […] carne y bellotas. [Pero era] sabio y entendía con qué alimentar a cada [uno]. A los hijos les servía pan […], pero [… a los] esclavos les servía […]; al ganado [le echaba cebada], paja y heno; a [los] perros les echaba huesos, [y a los cerdos], bellotas y desperdicios.


    Así sucede con el discípulo de Dios. Si es sabio, entiende lo que significa ser discípulo. Las formas corporales no lo engañarán, sino que observará la condición del alma de cada uno y hablará con él. En el mundo hay muchos animales hechos con forma humana. El discípulo los reconoce. A los cerdos les echará bellotas; al ganado, cebada con paja y heno; a los perros, huesos; a los esclavos les dará el aperitivo, y a los hijos, el alimento perfecto.


    Existe el Hijo de la Humanidad, y existe el hijo del Hijo de la Humanidad.[b] El Señor es el Hijo de la Humanidad, y el hijo del Hijo de la Humanidad es quien crea mediante el Hijo de la Humanidad. El Hijo de la Humanidad recibió de Dios la capacidad de crear. También posee la capacidad de engendrar. Quien recibió la capacidad de crear es una criatura; quien recibió la capacidad de engendrar es engendrado. Quien crea no puede engendrar; quien engendra puede crear. Dicen: «Quien crea, engendra». Pero lo que engendra es una criatura. [Por eso], sus engendrados no son sus hijos, sino que son […]. Quien crea obra [públicamente] y él mismo queda [manifestado]. Quien engendra, engendra [en secreto], y ellos están ocultos […] la imagen. [De nuevo], quien [crea, crea] públicamente; pero quien engendra, [engendra] hijos en secreto.


    [No habrá nadie capaz de] saber [cuándo el esposo] y la esposa tienen intimidad entre sí, excepto ellos mismos, porque el matrimonio del mundo es un misterio para quienes se han casado. Si el matrimonio impuro está oculto, ¡cuánto más es el matrimonio puro un verdadero misterio! No es carnal, sino puro. No procede del deseo, sino de la voluntad. No pertenece a la oscuridad ni a la noche, sino al día y a la luz. Si un matrimonio queda expuesto y desnudo, se convierte en prostitución[c]: no solo si la novia recibe la semilla de otro hombre, sino que incluso comete adulterio si sale de la cámara nupcial y alguien la ve. Que se muestre a su padre, a su madre, al amigo del novio y a los hijos del novio. A ellos se les permite entrar cada día en la cámara nupcial. Pero que los demás anhelen tan solo oír su voz y disfrutar de su perfume y que, como perros, coman las migajas que caen de la mesa. Los novios y las novias pertenecen a la cámara nupcial. Nadie podrá ver al novio y a la novia a menos
    que [llegue a ser] como ellos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes y puntos suspensivos señalan restauraciones o lagunas del manuscrito según el testimonio disponible. Esta versión es provisional, pues todavía está pendiente la revisión directa del copto.
    reason: Informa con transparencia sobre el estado fragmentario del texto y la base documental de la traducción.
  - marker: b
    text: «Hijo de la Humanidad» también podría verterse tradicionalmente como «Hijo del Hombre». Se conserva aquí la formulación del testimonio consultado para no borrar la repetición «hijo del Hijo».
    reason: Preserva una decisión titular y antropológica potencialmente significativa sin declarar una única interpretación.
  - marker: c
    text: El término subyacente puede abarcar «prostitución» o, de manera más amplia, «inmoralidad sexual»; el contexto lo relaciona con la exposición indebida de la unión y con el adulterio.
    reason: Reconoce la amplitud semántica y evita que una sola equivalencia moderna cierre la interpretación.
lexical_decisions:
- source_word: farm / farmed
  choice: cultivar / se cultiva
  rationale: Mantiene la metáfora agrícola que organiza la primera sección y su aplicación a la acción de Dios.
- source_word: knowledge
  choice: conocimiento
  rationale: Conserva el término conceptual sin interpretarlo como sabiduría, revelación o conocimiento salvífico.
- source_word: give rest
  choice: dar descanso
  rationale: Retiene la repetición y la posible carga espiritual de la expresión, aunque el razonamiento del pasaje sea difícil.
- source_word: Word
  choice: Palabra
  rationale: La mayúscula conserva la posible referencia personal o revelatoria sin imponer una identificación doctrinal explícita.
- source_word: Son of Humanity
  choice: Hijo de la Humanidad
  rationale: Sigue la formulación del testimonio suministrado y evita normalizar silenciosamente el título como «Hijo del Hombre».
- source_word: beget / begotten
  choice: engendrar / engendrado
  rationale: Preserva el contraste técnico entre crear y engendrar que estructura el argumento.
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Conserva el motivo simbólico característico del pasaje en un español digno y comprensible.
- source_word: pornography
  choice: prostitución
  rationale: Se opta por un término antiguo de relación sexual ilícita coherente con el contexto de adulterio; la amplitud semántica se reconoce en nota.
theological_decisions:
- issue: Relación entre crear y engendrar
  choice: Conservar literalmente la distinción y sus aparentes tensiones
  alternative: Armonizar el pasaje mediante vocabulario trinitario o cosmológico posterior
  rationale: El texto desarrolla su propia contraposición conceptual; explicarla doctrinalmente resolvería una ambigüedad que debe permanecer abierta.
- issue: Identidad del «Hijo de la Humanidad» y de su hijo
  choice: Mantener los títulos y relaciones tal como aparecen
  alternative: Identificarlos expresamente con figuras o grupos doctrinales determinados
  rationale: El fragmento no ofrece suficiente base para imponer una identificación confesional.
- issue: Matrimonio puro y cámara nupcial
  choice: Preservar a la vez el lenguaje matrimonial y su dimensión misteriosa
  alternative: Interpretarlo exclusivamente como matrimonio físico, rito sacramental o unión espiritual
  rationale: La tensión entre imagen, práctica y misterio es parte del texto y no debe resolverse en la traducción.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefieren construcciones inclusivas naturales como «quien» y «la persona» sin alterar referentes explícitos. Se mantienen corchetes, lagunas, repeticiones y razonamientos abruptos del testimonio. La redacción es necesariamente provisional porque el material suministrado declara pendiente la revisión directa del copto del Códice II de Nag Hammadi.
