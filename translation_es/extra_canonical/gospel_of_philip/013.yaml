status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 'La revisión se limita al testimonio inglés suministrado, ya que no se proporciona el copto para una comprobación directa. El borrador conserva adecuadamente la estructura, las lagunas y la terminología principal. Sin embargo, en un pasaje fragmentario añade «así» después de «porque […]», aunque el testimonio no contiene base para esa adición. También reformula indebidamente una construcción deliberadamente abrupta: «No solo es necesario para quienes adquieren… sino que ellos también han sido adquiridos para ustedes» pasa a dirigirse a «ustedes» y altera la referencia ambigua de «ellos».


    Hay leves ajustes de puntuación y de formulación para conservar mejor la literalidad sin volver el español innecesariamente opaco.'
  naturalness: El español es en general natural, moderno y apto para un registro sobrio. «Cámara nupcial», «unción», «plenitud» y «potestades» funcionan bien en este contexto. Se mantiene una sintaxis más abrupta donde el testimonio es fragmentario o conceptualmente denso. «Que nunca me encuentre yo allí» es correcto, aunque «¡Que nunca se me encuentre allí!» reproduce más directamente la pasiva del testimonio; se conserva la formulación del borrador por naturalidad.
  terminology: 'La terminología clave es consistente: «mundo», «potestades», «lugares intermedios / lugar intermedio», «descanso», «unción», «cámara nupcial», «figuras e imágenes» y «plenitud». «Eucaristía» conserva el término del testimonio sin imponer una interpretación. La nota en [a] es prudente y no doctrinaliza «un Cristo».'
  issues:
  - severity: medium
    issue: Adición de «así» en un lugar lacunoso
    rationale: «porque […] así» añade contenido no presente en el testimonio, que solo dice «because it […]». Debe conservarse la laguna sin completar la sintaxis.
  - severity: medium
    issue: Cambio de referentes y de persona en la frase sobre adquirir los nombres
    rationale: El borrador dice «No solo es necesario que ustedes adquieran…», mientras que el testimonio conserva la construcción ambigua «It is not only necessary for those who acquire… but they too have been acquired for you». La segunda persona explícita y la reordenación reducen la ambigüedad y cambian la relación entre los referentes.
  - severity: low
    issue: Puntuación del pasaje visionario
    rationale: La puntuación puede ajustarse para no sugerir una secuencia sintáctica más segura que la que permite el texto dañado.
  revised_text: 'Quien sale del mundo ya no puede ser atado, porque estuvo en el mundo. Se revela que está por encima del deseo de […] y del temor. Domina sobre […]; es superior a la envidia. Si […] vienen, ellos —las potestades— [lo] atan y lo ahogan. ¿Cómo podrán [ellos] escapar de las [grandes potestades…]? ¿Cómo podrán […]? Algunos [dicen]: «Somos fieles», para que […] [espíritu impuro] y demonio, porque, si tuvieran el Espíritu Santo, ningún espíritu impuro se aferraría a ellos. No temas a la carne ni la ames. Si la temes, te dominará; si la amas, te tragará y te ahogará.


