translation:
  language: es
  text: 'Quien sale del mundo ya no puede ser atado, porque estuvo en el mundo. Se revela que está por encima del deseo de […] y del temor. Domina sobre […]; es superior a la envidia. Si […] vienen, ellos —las potestades— [lo] atan y lo ahogan. ¿Cómo podrán [ellos] escapar de las [grandes potestades…]? ¿Cómo podrán […]? Algunos [dicen]: «Somos fieles», para que […] [espíritu impuro] y demonio, porque, si tuvieran el Espíritu Santo, ningún espíritu impuro se aferraría a ellos. No temas a la carne ni la ames. Si la temes, te dominará; si la amas, te tragará y te ahogará.


    Una persona se encuentra o bien en este mundo, o en la resurrección, o en los lugares intermedios. ¡Que nunca me encuentre yo allí! En este mundo hay tanto bien como mal. Sus cosas buenas no son buenas, y sus cosas malas no son malas. Pero después de este mundo hay un mal que es verdaderamente malo: lo que se llama «el lugar intermedio». Es la muerte. Mientras estamos en este mundo, conviene que adquiramos para nosotros la resurrección, para que, cuando seamos despojados de la carne, se nos encuentre en el descanso y no viajemos por el lugar intermedio, porque muchos se extravían en el camino.


    Es bueno salir del mundo antes de pecar. Algunos ni quieren ni pueden; pero otros, aunque quisieran, no sacarían provecho, porque no actuaron. El querer los hace pecadores. Pero, aunque no quieran, la justicia seguirá oculta para ellos. No es la voluntad, ni es la acción.


    Un apóstol vio [en una] visión a unas personas encerradas en una casa en llamas y atadas con […] ardientes, arrojadas […] de lo ardiente […] a ellas en […]; y les dijeron [… capaces] de ser salvadas […]. Ellas no quisieron y recibieron […] castigo, al que se llama «las tinieblas [de afuera]», porque […] así.


    El alma y el espíritu llegaron a existir a partir del agua y del fuego. La descendencia de la cámara nupcial surgió del agua, del fuego y de la luz. El fuego es la unción; la luz es el fuego. No hablo de aquel fuego sin forma, sino del otro, cuya forma es blanca, que resplandece, es hermoso y da hermosura.


    La verdad no vino desnuda al mundo, sino que vino en figuras e imágenes. El mundo no la recibirá de ninguna otra manera. Hay un nuevo nacimiento y una imagen del nuevo nacimiento. Es verdaderamente necesario ser engendrado de nuevo por medio de la imagen. ¿Qué son la resurrección y la imagen? Por medio de la imagen es necesario que ella se levante. ¿Y la cámara nupcial y la imagen? Por medio de la imagen es necesario que ellos entren en la verdad, que es la restauración. No solo es necesario que ustedes adquieran el nombre del Padre, del Hijo y del Espíritu Santo, sino que ellos también han sido adquiridos para ustedes. Si alguien no los adquiere, también se le quitará el nombre. Pero se los recibe en la unción del […] del poder de la cruz. Los apóstoles llamaron a esto «[la] derecha y la izquierda», porque esta persona ya no es un [cristiano], sino un Cristo.[a]


    El Señor [hizo] todo en un misterio: un bautismo, una unción, una eucaristía, una redención y una cámara nupcial […]. Él [dijo]: «Vine para hacer [lo de abajo] como lo [de arriba, y lo de afuera] como lo [de adentro, y para unirlos] en el lugar». […] aquí por medio de [figuras…]. Los que dicen: «[…] hay uno arriba […]», [se equivocan, porque] lo que se revela es aquello […], lo [que] se llama «lo de abajo»; y lo que está oculto respecto de ello es lo que está por encima, porque es bueno. Y dicen: «Lo de adentro, lo de afuera y lo que está fuera de lo de afuera». Por eso el Señor llamó a la destrucción «las tinieblas de afuera». No hay nada fuera de ellas.


    Él dijo: «Mi Padre, que está oculto». Dijo: «Entra en tu habitación, cierra la puerta detrás de ti y ora a tu Padre, que está oculto»; es decir, al que está dentro de todos ellos. Pero quien está dentro de todos ellos es la plenitud. Más allá de eso, no hay nada más en el interior. Esto es lo que se llama «lo que está por encima de ellos».


    Antes de Cristo, algunos vinieron de donde ya no podían entrar, y fueron adonde ya no podían salir. Entonces vino Cristo. Sacó a los que habían entrado e hizo entrar a los que habían salido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito está dañado en «[cristiano]». La expresión «un Cristo» reproduce deliberadamente el contraste del testimonio; no significa necesariamente que la persona sea identificada sin más con Jesucristo.
    reason: Aclara tanto la restauración editorial como una formulación teológicamente sensible sin eliminar su ambigüedad.
lexical_decisions:
- source_word: world
  choice: mundo
  rationale: Conserva el término cosmológico recurrente sin reducirlo a sociedad, creación o pecado.
- source_word: powers
  choice: potestades
  rationale: Distingue a los agentes supra-humanos de un poder abstracto y mantiene el matiz cosmológico del pasaje.
- source_word: middle / middle places
  choice: lugar intermedio / lugares intermedios
  rationale: Mantiene la terminología espacial y escatológica, así como la variación singular/plural del testimonio.
- source_word: rest
  choice: descanso
  rationale: Traducción natural que conserva el posible sentido tanto de reposo como de estado escatológico.
- source_word: chrism
  choice: unción
  rationale: Expresa el rito de ungir de manera comprensible; evita el poco usual «crisma» sin identificarlo automáticamente con una práctica denominacional posterior.
- source_word: types
  choice: figuras
  rationale: Comunica formas representativas o simbólicas sin imponer el sentido técnico posterior de «tipos».
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Conserva la expresión ritual y simbólica distintiva, sin parafrasear su significado teológico.
- source_word: fullness
  choice: plenitud
  rationale: Mantiene el término conceptual sin sustituirlo por una explicación doctrinal.
- source_word: a Christ
  choice: un Cristo
  rationale: Reproduce la afirmación llamativa del testimonio y su contraste con «cristiano», sin suavizarla.
theological_decisions:
- issue: Adquirir la resurrección durante la vida presente
  choice: «adquiramos para nosotros la resurrección»
  alternative: «alcancemos la resurrección»
  rationale: La formulación extraña es teológicamente significativa; se conserva sin armonizarla con esquemas escatológicos canónicos.
- issue: Evaluación paradójica del bien y del mal del mundo
  choice: «Sus cosas buenas no son buenas, y sus cosas malas no son malas»
  alternative: Explicar que son bienes y males aparentes
  rationale: Se preserva la paradoja y no se añade una interpretación ausente del testimonio.
- issue: Relación entre voluntad, acción, pecado y justicia
  choice: «No es la voluntad, ni es la acción»
  alternative: Resolver la frase a favor de la intención o de las obras
  rationale: El texto es abrupto y posiblemente fragmentario; no se resuelve su tensión mediante una doctrina particular.
- issue: Lenguaje sacramental o mistérico
  choice: Se mantienen bautismo, unción, eucaristía, redención y cámara nupcial como una serie
  alternative: Interpretarlos como ritos institucionales posteriores o como meros símbolos
  rationale: La traducción deja abierta la función exacta de cada elemento en el escrito.
- issue: «Ya no es un cristiano, sino un Cristo»
  choice: Traducción literal con nota de ambigüedad
  alternative: «pertenece a Cristo» o «es semejante a Cristo»
  rationale: Las alternativas eliminan una afirmación difícil pero genuina y la adaptan a categorías teológicas posteriores.
- issue: El Padre oculto y la plenitud interior
  choice: Se conserva el lenguaje espacial de «dentro», «más allá» y «por encima»
  alternative: Reformularlo como omnipresencia divina
  rationale: No se impone una sistematización doctrinal al lenguaje cosmológico del texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y puntos suspensivos como señales de lagunas o restauraciones editoriales. Dado que la revisión directa del copto está pendiente, el borrador sigue de manera cautelosa el testimonio inglés público suministrado y evita reconstrucciones adicionales. Se alterna singular y plural solo donde lo exige el testimonio, y se mantiene la sintaxis abrupta en los pasajes fragmentarios.
