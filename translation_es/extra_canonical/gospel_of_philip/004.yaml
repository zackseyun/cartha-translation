review_pass:
  verdict: revise
  source_fidelity: La traducción reproduce de forma fiel la argumentación, las repeticiones y las ambigüedades teológicas del testimonio inglés suministrado. No obstante, en la sección dañada se introducen conexiones y formulaciones no presentes de modo explícito en el testimonio («pues», «pueda», «ni se ofrecerían»), lo cual reduce la fidelidad a sus lagunas y elipsis. La revisión las conserva sin completarlas interpretativamente. La revisión directa del copto sigue pendiente.
  naturalness: El español es en general natural, moderno y de registro digno. Se ajusta la transición de la comparación sobre el Paraíso para conservar mejor su relación con la afirmación anterior, sin volver el texto menos fluido.
  terminology: «Gobernantes», «poderes», «humanidad», «Espíritu Santo» y «ser humano perfecto» son opciones adecuadas y coherentes. Se conserva «esclavitud» y no se impone la identificación técnica de los gobernantes como arcontes. La nota mantiene la posible alusión cristológica sin afirmarla como identificación textual.
  issues:
  - severity: medium
    issue: Se añadieron nexos y una construcción verbal dentro de un pasaje fragmentario.
    rationale: '«Pues no quieren», «para que pueda ser» y «ni se ofrecerían animales» explicitan relaciones sintácticas o modales que el testimonio inglés deja afectados por lagunas: «There are powers that exist […] humanity, not wanting them to be [saved], so that they may be […] because if humanity [was saved], sacrifices [wouldn''t] happen […] and animals offered up...».'
  - severity: low
    issue: La comparación del Paraíso se separó en dos oraciones con «De igual modo».
    rationale: El testimonio presenta la frase sobre el Paraíso como comparación inmediata de la falta de pan en el mundo. El guion conserva más claramente esa relación sin introducir una formulación explicativa adicional.
  revised_text: 'Los gobernantes querían engañar a la humanidad, porque vieron que esta tenía parentesco con los que son verdaderamente buenos. Tomaron el nombre de los buenos y se lo dieron a los que no son buenos, para engañar a la humanidad mediante los nombres y vincularla con los que no son buenos; y luego, ¡qué favor le hacen! La apartan de los que no son buenos y la colocan entre los buenos. Los gobernantes sabían lo que hacían, pues querían tomar a quienes eran libres y someterlos a esclavitud para siempre.



    Hay poderes que existen […] la humanidad, sin querer que sea [salvada], para que sea […] porque, si la humanidad [fuera salvada], los sacrificios [no] sucederían […] y animales ofrecidos a los poderes, porque aquellos a quienes se hacían las ofrendas eran animales. Eran ofrecidos vivos, pero, cuando eran ofrecidos, morían. Un ser humano fue ofrecido muerto a Dios, y vivió.[a]



    Antes de que viniera Cristo, no había pan en el mundo—tal como el Paraíso, donde estaba Adán, tenía muchos árboles para alimentar a los animales, pero no tenía trigo para alimentar a la humanidad. La humanidad solía comer como los animales; pero cuando vino Cristo, el ser humano perfecto, trajo pan del cielo para que la humanidad se alimentara con el alimento propio de los seres humanos.



    Los gobernantes pensaban que actuaban por su propio poder y voluntad, pero el Espíritu Santo realizaba en secreto, por medio de ellos, todo lo que quería. La verdad, que existe desde el principio, se siembra por todas partes; muchos la ven cuando es sembrada, pero pocos la ven cuando es cosechada.'
  revised_footnotes:
  - marker: a
