review_pass:
  verdict: revise
  source_fidelity: 'La traducción reproduce bien la estructura argumentativa, la oposición entre «los gobernantes» y «los buenos», y la ambigüedad de «un ser humano». Sin embargo, en el tramo fragmentario se han añadido conexiones y predicados no presentes en el testimonio inglés: «pues», «ni se ofrecerían» y la formulación plenamente reconstruida de una cláusula que el testimonio conserva como fragmento. Deben mantenerse las lagunas sin completar su sintaxis o contenido de forma interpretativa.'
  naturalness: El español es en general natural, actual y apto para un registro digno. «La apartan» y «la colocan» resuelven correctamente la referencia colectiva a la humanidad. En el último párrafo, «creían que hacían lo que hacían» conserva mejor la repetición enfática del original que «pensaban que actuaban».
  terminology: «Gobernantes», «poderes», «humanidad», «Espíritu Santo» y «ser humano perfecto» son elecciones adecuadas y no imponen una interpretación doctrinal. «Parentesco» comunica bien la afinidad expresada por kinship. Se conserva prudentemente la identidad no especificada del ser humano ofrecido.
  issues:
  - severity: medium
    issue: Expansión interpretativa en el pasaje dañado sobre los poderes y los sacrificios.
    rationale: El testimonio dice «sacrifices [would not] happen […] and animals offered up to the powers». El borrador añade «ni se ofrecerían animales a los poderes», completando una relación verbal que no aparece fuera de la laguna. También «pues» presenta una relación causal no señalada explícitamente. En un texto lacunoso, estas adiciones deben evitarse.
  - severity: low
    issue: Atenuación de la repetición retórica final.
    rationale: «The rulers thought they did what they did» se refleja más fielmente en «Los gobernantes creían que hacían lo que hacían» que en «pensaban que actuaban».
  - severity: low
    issue: La formulación «todo lo que quería» queda algo elíptica en español.
    rationale: «Todo lo que quería hacer por medio de ellos» hace explícito en español el infinitivo implícito en «everything it wanted to through them», sin resolver la tensión teológica del pasaje.
  revised_text: 'Los gobernantes querían engañar a la humanidad, porque vieron que esta tenía parentesco con los que son verdaderamente buenos. Tomaron el nombre de los buenos y se lo dieron a los que no son buenos, para engañar a la humanidad mediante los nombres y vincularla con los que no son buenos; y luego, ¡qué favor le hacen! La apartan de los que no son buenos y la colocan entre los buenos. Los gobernantes sabían lo que hacían, pues querían tomar a quienes eran libres y someterlos a esclavitud para siempre.



    Hay poderes que existen […] humanidad, y no quieren que sea [salvada], para que pueda ser […] porque, si la humanidad [fuera salvada], los sacrificios [no] tendrían lugar […] y animales ofrecidos a los poderes, porque aquellos a quienes se hacían las ofrendas eran animales. Los animales eran ofrecidos vivos, pero al ser ofrecidos morían. Un ser humano fue ofrecido muerto a Dios, y vivió.[a]



    Antes de que viniera Cristo no había pan en el mundo, así como el Paraíso, donde estaba Adán, tenía muchos árboles para alimentar a los animales, pero no tenía trigo para alimentar a la humanidad. La humanidad solía comer como los animales, pero cuando vino Cristo, el ser humano perfecto, trajo pan del cielo para que la humanidad se alimentara con el alimento de la humanidad.



    Los gobernantes creían que hacían lo que hacían por su propio poder y voluntad, pero el Espíritu Santo realizaba en secreto, por medio de ellos, todo lo que quería hacer. La verdad, que existe desde el principio, se siembra por todas partes; y muchos la ven cuando es sembrada, pero pocos la ven cuando es cosechada.'
  revised_footnotes:
  - marker: a
    text: La frase puede aludir a Cristo, pero el pasaje no identifica de manera explícita al ser humano ofrecido. Los corchetes y puntos suspensivos señalan restauraciones o lagunas en el testimonio manuscrito.
    reason: Conserva la posible alusión cristológica como posibilidad, no como identificación textual cierta, y explica de forma concisa las convenciones del texto dañado.
  revision_rationale: La revisión limita los cambios a correcciones seguras. Conserva las elecciones terminológicas principales del borrador y su registro, pero retira la expansión «ni se ofrecerían» del segmento lacunoso para no suplir material ausente. También restituye repeticiones retóricas relevantes y hace más natural la construcción final sobre la acción secreta del Espíritu.
