translation:
  language: es
  text: 'Los gobernantes querían engañar a la humanidad, porque vieron que esta tenía parentesco con los que son verdaderamente buenos. Tomaron el nombre de los buenos y se lo dieron a los que no son buenos, para engañar a la humanidad mediante los nombres y vincularla con los que no son buenos. Y luego, ¡qué favor le hacen! La apartan de los que no son buenos y la colocan entre los buenos. Los gobernantes sabían lo que hacían, pues querían tomar a quienes eran libres y someterlos a esclavitud para siempre.


    Hay poderes que existen […] la humanidad, pues no quieren que sea [salvada], para que pueda ser […] porque, si la humanidad [fuera salvada], los sacrificios [no] se realizarían […] ni se ofrecerían animales a los poderes, porque aquellos a quienes se hacían las ofrendas eran animales. Los animales eran ofrecidos vivos, pero al ser ofrecidos morían. Un ser humano fue ofrecido muerto a Dios, y vivió.[a]


    Antes de que viniera Cristo no había pan en el mundo. De igual modo, el Paraíso, donde estaba Adán, tenía muchos árboles para alimentar a los animales, pero no tenía trigo para alimentar a la humanidad. La humanidad solía comer como los animales; pero cuando vino Cristo, el ser humano perfecto, trajo pan del cielo para que la humanidad se alimentara con el alimento propio de los seres humanos.


    Los gobernantes pensaban que actuaban por su propio poder y voluntad, pero el Espíritu Santo realizaba en secreto, por medio de ellos, todo lo que quería. La verdad, que existe desde el principio, se siembra por todas partes. Muchos la ven cuando es sembrada, pero pocos la ven cuando es cosechada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase puede aludir a Cristo, pero el pasaje no identifica de manera explícita al ser humano ofrecido. Los corchetes y puntos suspensivos anteriores señalan lagunas o restauraciones en el testimonio manuscrito.
    reason: Preserva la posible lectura cristológica sin convertirla en una certeza textual y explica las señales de daño manuscrito.
lexical_decisions:
- source_word: rulers
  choice: gobernantes
  rationale: Conserva el sentido literal y la función cosmológica del término sin imponer como traducción principal el tecnicismo «arcontes».
- source_word: humanity
  choice: la humanidad
  rationale: Mantiene la referencia colectiva de manera natural y neutral en español latinoamericano.
- source_word: kinship
  choice: parentesco
  rationale: Preserva la afirmación fuerte de afinidad o relación de origen, sin reducirla a una mera semejanza.
- source_word: bind
  choice: vincular
  rationale: Expresa la unión producida mediante los nombres; evita introducir una imagen física no explícita en el testimonio base.
- source_word: powers
  choice: poderes
  rationale: Mantiene la terminología cosmológica del pasaje y la distingue de «gobernantes».
- source_word: the perfect human
  choice: el ser humano perfecto
  rationale: Reproduce la caracterización antropológica de Cristo sin sustituirla por un título doctrinal más específico.
- source_word: food of humanity
  choice: el alimento propio de los seres humanos
  rationale: Hace natural en español la contraposición con la comida de los animales, conservando su sentido antropológico.
theological_decisions:
- issue: Identidad de los «gobernantes»
  choice: Mantener «gobernantes» sin explicación doctrinal dentro del texto
  alternative: Traducir «arcontes» o identificarlos explícitamente como potestades cósmicas malignas
  rationale: El testimonio suministrado permite percibir su carácter hostil, pero no justifica añadir una identificación técnica en el cuerpo del texto.
- issue: Agencia del Espíritu Santo por medio de los gobernantes
  choice: Conservar la afirmación de que el Espíritu realizaba su voluntad «por medio de ellos»
  alternative: Atenuarla diciendo que actuaba a pesar de ellos
  rationale: El pasaje sostiene deliberadamente la tensión entre la intención de los gobernantes y la acción secreta del Espíritu; no debe resolverse interpretativamente.
- issue: El ser humano ofrecido muerto a Dios
  choice: Preservar la formulación enigmática y añadir una nota de ambigüedad
  alternative: Identificar directamente al ser humano con Cristo
  rationale: La alusión puede ser cristológica, pero el texto suministrado no hace explícita esa identificación.
- issue: Pan celestial y humanidad perfecta
  choice: Mantener las imágenes y títulos tal como aparecen
  alternative: Explicarlos como eucaristía o encarnación
  rationale: Esas lecturas son posibles, pero introducirlas en la traducción resolvería una ambigüedad teológica genuina.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones retóricas, las antítesis y la tensión teológica. Los corchetes y puntos suspensivos reproducen las señales de laguna o restauración del testimonio proporcionado. Borrador provisional basado en el testimonio inglés de dominio público; está pendiente la revisión directa del copto del Códice de Nag Hammadi II,3.
