translation:
  language: es
  text: 'Jesús los tomó a todos por sorpresa, porque no se manifestó tal como era, sino como [ellos] podían verlo. Se les manifestó (de) [todas estas] (maneras): se [manifestó] a [los] grandes como grande; se [manifestó] a los pequeños como pequeño; se [manifestó] [a los] ángeles como ángel, y a los seres humanos como ser humano. Así, su Palabra se ocultó de todos. Algunos sí lo vieron, pero pensaban que se veían a sí mismos. Sin embargo, cuando se manifestó gloriosamente a sus discípulos en la montaña, no era pequeño. Se hizo grande, pero también hizo grandes a los discípulos para que pudieran verlo como grande.


    Aquel día dijo en la Eucaristía: «Tú que has unido la luz perfecta con el Espíritu Santo, ¡une también a los ángeles con nosotros, con las imágenes!»[a]


    No desprecies al cordero, porque sin él es imposible ver la puerta.[b] Nadie podrá acercarse desnudo al rey.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La relación exacta de «con las imágenes» con «los ángeles» o con «nosotros» no es clara en el testimonio disponible.
    reason: Preserva una ambigüedad sintáctica y conceptual sin imponer una interpretación.
  - marker: b
    text: «El cordero» y «la puerta» se conservan como imágenes del texto; su referente preciso no se explica aquí.
    reason: Evita introducir una identificación teológica no explícita.
lexical_decisions:
- source_word: took all of them by stealth
  choice: los tomó a todos por sorpresa
  rationale: Expresa la idea de actuar sin ser advertido sin imponer el sentido de engaño deliberado que podría sugerir «con engaño».
- source_word: appeared
  choice: se manifestó
  rationale: En este contexto de formas variables de revelación, «se manifestó» comunica mejor que una mera aparición visual, sin eliminar la posibilidad de percepción visible.
- source_word: his Word
  choice: su Palabra
  rationale: Se conserva la personificación y la posible carga técnica o teológica de «Word», sin identificarla explícitamente con una doctrina posterior.
- source_word: Eucharist
  choice: Eucaristía
  rationale: Mantiene el término ritual del testimonio y su ambigüedad histórica, en vez de sustituirlo por una interpretación como «cena» o «acción de gracias».
- source_word: lamb
  choice: cordero
  rationale: Conserva la imagen animal y su posible valor simbólico sin explicarlo dentro del texto.
- source_word: door
  choice: puerta
  rationale: Traducción directa que preserva la formulación enigmática.
theological_decisions:
- issue: La adaptación de la manifestación de Jesús a la capacidad de quienes lo ven
  choice: Conservar literalmente la secuencia «grande... pequeño... ángel... ser humano»
  alternative: Explicarla como acomodación pedagógica o como cambio ontológico
  rationale: El pasaje no define el mecanismo ni su naturaleza; la traducción conserva esa tensión.
- issue: Identidad de «su Palabra»
  choice: Mantener «su Palabra» con mayúscula
  alternative: Traducir «su palabra» como simple mensaje o identificarla explícitamente con Jesús
  rationale: La personificación es clara, pero la relación exacta entre Jesús y la Palabra queda abierta en el testimonio.
- issue: «Con las imágenes» en la invocación eucarística
  choice: Conservar la frase sin resolver su relación sintáctica
  alternative: Interpretarla como «ángeles que son imágenes» o «nosotros, las imágenes»
  rationale: La construcción es difícil y admite más de una relación; una reformulación explicativa resolvería indebidamente la ambigüedad.
- issue: Simbolismo del cordero, la puerta y la desnudez
  choice: Mantener las imágenes sin glosa doctrinal en el cuerpo
  alternative: Identificar expresamente al cordero con Cristo, la puerta con la salvación o la vestidura con una condición sacramental
  rationale: Esas identificaciones son posibles, pero el fragmento no las explica de manera inequívoca.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes como señales de restauración o daño manuscrito y los paréntesis como indicaciones editoriales del testimonio inglés. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice II de Nag Hammadi.
