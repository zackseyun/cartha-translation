review_pass:
  verdict: revise
  source_fidelity: Revisión provisional contra el testimonio inglés suministrado, pues la revisión directa del copto sigue pendiente. «Por sorpresa» no reproduce adecuadamente «by stealth», que indica actuación furtiva o secreta, no mera sorpresa. «Gloriosamente» interpreta y modifica la construcción «in glory»; conviene conservar «en gloria».
  naturalness: El español es en general natural y de registro digno. «De manera furtiva» transmite mejor el primer verbo. «En gloria» es conciso y mantiene la formulación marcada del testimonio.
  terminology: '«Palabra», «Eucaristía», «cordero», «puerta», «rey», «ángeles» e «imágenes» son elecciones adecuadas. Se conservan las señales editoriales del testimonio: corchetes para restauraciones y paréntesis para elementos editoriales. No se requiere nota añadida: la ambigüedad de «con las imágenes» puede permanecer en el texto sin anclar una explicación que no figura en el testimonio.'
  issues:
  - severity: medium
    issue: «Los tomó a todos por sorpresa» para «Jesus took all of them by stealth».
    rationale: «Por sorpresa» expresa principalmente el efecto sobre los demás; «by stealth» caracteriza el modo de actuar como furtivo o secreto. «Los tomó a todos de manera furtiva» conserva mejor esa distinción.
  - severity: medium
    issue: «Se manifestó gloriosamente» para «he appeared ... in glory».
    rationale: El adverbio «gloriosamente» puede sugerir una valoración o manera de aparición. «En gloria» sigue más de cerca la construcción y preserva su posible sentido técnico o descriptivo.
  - severity: low
    issue: Notas a y b añadidas sin correspondencia en el testimonio inglés ni necesidad de anclaje textual.
    rationale: Las notas no son falsas, pero introducen aparato interpretativo adicional. La ambigüedad sintáctica y las imágenes pueden conservarse sin glosa; retirar los marcadores evita presentar como nota de fuente una observación editorial.
  revised_text: 'Jesús los tomó a todos de manera furtiva, porque no se manifestó tal como era, sino como [ellos] podían verlo. Se les manifestó (de) [todas estas] (maneras): se [manifestó] a [los] grandes como grande; se [manifestó] a los pequeños como pequeño; se [manifestó] [a los] ángeles como ángel, y a los seres humanos como ser humano. Así, su Palabra se ocultó de todos. Algunos sí lo vieron, pensando que se veían a sí mismos. Pero cuando se manifestó a sus discípulos en gloria en la montaña, no era pequeño. Se hizo grande, pero también hizo grandes a los discípulos para que pudieran verlo como grande.



    Aquel día, en la Eucaristía, dijo: «Tú que has unido la luz perfecta con el Espíritu Santo, ¡une también a los ángeles con nosotros, con las imágenes!»



    No desprecies al cordero, porque sin él es imposible ver la puerta. Nadie podrá acercarse desnudo al rey.'
  revised_footnotes: []
  revision_rationale: 'Se corrigen dos desplazamientos de sentido frente al testimonio inglés: el carácter furtivo de la acción inicial y la expresión «en gloria». Se mantiene la ambigüedad de la invocación eucarística y el lenguaje figurado final sin identificación doctrinal. La revisión es necesariamente provisional hasta cotejar el copto.'
