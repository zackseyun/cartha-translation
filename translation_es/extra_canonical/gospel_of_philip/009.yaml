  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: es
  text: 'Los hijos del ser humano celestial son más numerosos que los del ser humano terrenal. Si Adán tiene tantos hijos, aunque mueren, ¡cuántos hijos tiene el ser humano perfecto: los que no mueren, sino que son engendrados continuamente!


    El padre engendra un hijo, pero es imposible que un hijo engendre un hijo, porque quien ha sido engendrado no puede engendrar hijos; el hijo engendra hermanos, no hijos. Todos los que son engendrados en el mundo son engendrados físicamente, y los otros en […] son engendrados por él […] allá, para el ser humano […] en el […] lugar celestial […] de la boca […] la Palabra salió de allí. Ellos serían alimentados de la boca [y] llegarían a ser perfectos. Los perfectos son concebidos y engendrados mediante un beso. Por eso también nosotros nos besamos unos a otros, y concebimos de la gracia que hay en unos y otros.


    Tres acompañaban al Señor en todo momento: María, su madre; la hermana de ella; y Magdalena, llamada su compañera[a], porque María es su hermana, su madre y su compañera.


    «El Padre» y «el Hijo» son nombres simples; «el Espíritu Santo» es un nombre doble[b], porque están en todas partes. Están en el cielo y abajo; están ocultos y se manifiestan. El Espíritu Santo se manifiesta abajo y está oculto en el cielo.


    Los poderes malignos sirven a los santos, porque el Espíritu Santo los ha cegado para que piensen que sirven a un ser humano común, cuando en realidad trabajan para los santos. Por eso, cierto día un discípulo preguntó al Señor acerca de un asunto mundano. Él le dijo: «Pregúntale a tu Madre, y ella te dará de parte de otro».


    Los apóstoles dijeron a los discípulos: «Que toda nuestra ofrenda reciba sal». Llamaban […] «sal». Sin ella, la ofrenda no [llega a ser] aceptable. Pero la Sabiduría [no tiene] hijos; por eso [se la] llama […], esto de la sal, el lugar donde ellos […] a su manera. El Espíritu Santo […] […] muchos hijos.


    Lo que pertenece al padre pertenece al hijo. Pero mientras el hijo es pequeño, no se le confía lo que es suyo. Cuando llega a ser adulto, su padre le entrega todo lo que le pertenece.


    Quienes han sido engendrados por el Espíritu y se extravían, también se extravían por medio de él[c]. Por eso, mediante este único Espíritu se enciende —es decir, el fuego— y se apaga.


    Echamoth es una cosa y Echmoth otra. Echamoth es simplemente Sabiduría; pero Echmoth es la Sabiduría de la Muerte, la que conoce la muerte. A esta se la llama «la pequeña Sabiduría».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Compañera» también puede significar asociada o pareja; el término no define por sí solo la naturaleza exacta de la relación.
    reason: Evitar que una palabra semánticamente amplia se lea como una afirmación conyugal inequívoca.
  - marker: b
    text: El texto llama «doble» al nombre «Espíritu Santo», probablemente porque consta de dos elementos; los plurales que siguen se conservan tal como aparecen en el testimonio.
    reason: Señalar una construcción difícil sin normalizarla al singular.
  - marker: c
    text: 'También podría entenderse: «se apartan de él». La referencia y el valor de la expresión son inciertos.'
    reason: Preservar una ambigüedad teológica y gramatical significativa.
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: ser humano celestial / ser humano terrenal / ser humano perfecto
  rationale: «Ser humano» conserva el sentido genérico sin limitarlo al varón y mantiene el contraste antropológico del testimonio.
- source_word: beget / begotten
  choice: engendrar / ser engendrado
  rationale: La repetición parece deliberada y conceptual; se conserva con un término formal y comprensible.
- source_word: companion / partner
  choice: compañera
  rationale: Mantiene la amplitud semántica del testimonio sin precisar una relación conyugal ni meramente discipular.
- source_word: the Word
  choice: la Palabra
  rationale: Reproduce el título conceptual con mayúscula sin imponer una identificación más explícita que la del texto.
- source_word: Wisdom
  choice: Sabiduría
  rationale: La mayúscula refleja su uso como figura o entidad personificada en el pasaje.
- source_word: powers
  choice: poderes
  rationale: Conserva el vocabulario cosmológico del escrito; «autoridades» podría sugerir instituciones humanas.
- source_word: Echamoth / Echmoth
  choice: Echamoth / Echmoth
  rationale: Se transliteran y se conserva la diferencia gráfica y conceptual que el propio pasaje destaca.
theological_decisions:
- issue: Identidad de las tres Marías y la sintaxis de «su hermana, su madre y su compañera»
  choice: Conservar «María» en la última oración y la relación triple sin armonizarla.
  alternative: Entender que cada designación corresponde a una mujer diferente o identificar «compañera» como esposa.
  rationale: El testimonio es sintáctica y conceptualmente difícil; resolverlo eliminaría una ambigüedad genuina.
- issue: Plural en la explicación de «Espíritu Santo»
  choice: Conservar «porque están en todas partes» y los plurales siguientes.
  alternative: Cambiar al singular para que se refiera solo al Espíritu Santo.
  rationale: El plural está en el testimonio y puede aludir a los nombres, sus componentes o las realidades nombradas; no se corrige teológicamente.
- issue: El Espíritu como medio tanto de generación como de extravío
  choice: Traducir literalmente «también se extravían por medio de él».
  alternative: Atribuir el extravío a otra causa o traducir «se apartan de él».
  rationale: Se preserva la tensión teológica y la referencia pronominal, aunque resulte difícil.
- issue: Lenguaje maternal referido por el Señor
  choice: Mantener «tu Madre» con mayúscula, sin identificarla.
  alternative: Explicarla como el Espíritu Santo, la Sabiduría o María.
  rationale: El fragmento no identifica de manera inequívoca a la figura; una identificación sería interpretativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la repetición conceptual de «engendrar», así como los corchetes y puntos suspensivos que señalan lagunas o restauraciones inciertas. La traducción es provisional porque el material suministrado indica que aún está pendiente la revisión directa del copto del Códice II de Nag Hammadi.
