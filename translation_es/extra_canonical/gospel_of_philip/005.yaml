  terminology: «Espíritu Santo», «poder/poderes», «apóstoles», «sucesores apostólicos» y «Padre» mantienen la terminología del testimonio sin especificar jerarquías espirituales ni resolver interpretaciones teológicas disputadas. La nota a explica prudentemente la anomalía aparente de la pregunta sin afirmar una solución filológica definitiva.
