    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: es
  text: 'Algunos dicen: «María concibió por obra del Espíritu Santo». Se equivocan; no saben lo que dicen. ¿Cuándo ha concebido una mujer por medio de otra mujer?[a] «María es la virgen a quien ningún poder mancilló» constituye el gran testimonio de aquellos hebreos que llegaron a ser (los primeros) apóstoles y (los) sucesores apostólicos. La virgen a quien ningún poder mancilló […] los poderes se mancillaron a sí mismos.[b]


    Y el Señor [no habría] dicho: «Mi [Padre que está en] el cielo», si [él] no hubiera tenido otro padre. Más bien, habría dicho simplemente: [«Mi Padre»]. El Señor dijo a los [discípulos: «…] [de] cada [casa] y traigan a la casa del Padre; pero no roben nada de la casa del Padre ni se lo lleven».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El argumento trata al Espíritu Santo como femenino. Su base lingüística y su sentido preciso deberán verificarse mediante una revisión directa del texto copto.
    reason: Aclara un razonamiento que de otro modo parece incoherente en español, sin resolver de manera prematura su trasfondo.
  - marker: b
    text: Los corchetes señalan texto perdido o reconstruido, y los puntos suspensivos entre corchetes indican una laguna en el manuscrito. Los paréntesis conservan aclaraciones o incertidumbres editoriales del testimonio utilizado.
    reason: Hace transparentes las señales de daño manuscrito y restauración que deben preservarse en una edición provisional.
lexical_decisions:
- source_word: conceived by the Holy Spirit
  choice: concibió por obra del Espíritu Santo
  rationale: Es la formulación natural en español para indicar agencia, sin convertir la frase en una afirmación doctrinal más explícita que el testimonio suministrado.
- source_word: power / powers
  choice: poder / poderes
  rationale: Conserva la repetición y la posible referencia a potestades espirituales, sin interpretarlas ni sustituirlas por una categoría teológica más específica.
- source_word: defiled
  choice: mancilló / se mancillaron
  rationale: Mantiene tanto la idea de profanación o contaminación como el contraste reflexivo de la segunda cláusula.
- source_word: apostolic (successors)
  choice: sucesores apostólicos
  rationale: Expresa en español corriente la sucesión indicada por el testimonio, conservando los paréntesis como señal de incertidumbre editorial.
- source_word: Father’s house
  choice: casa del Padre
  rationale: Preserva la repetición y la carga simbólica de «Padre» sin explicar la imagen.
theological_decisions:
- issue: La objeción «¿Cuándo ha concebido una mujer por medio de otra mujer?»
  choice: Conservar literalmente el razonamiento y explicar su presupuesto solo en nota.
  alternative: Reformularlo como una negación directa de la concepción virginal o identificar explícitamente al Espíritu como madre.
  rationale: El pasaje establece una asociación femenina que resulta extraña en español, pero no conviene resolver su trasfondo lingüístico o teológico mientras esté pendiente la revisión directa del copto.
- issue: «otro padre»
  choice: Mantener la expresión sin identificar a ese padre.
  alternative: Precisar que se trata de un padre terrenal, biológico o espiritual.
  rationale: El fragmento no identifica al referente; hacerlo eliminaría una ambigüedad teológicamente significativa.
- issue: «poderes»
  choice: Mantener el término general.
  alternative: Traducir «potestades», «autoridades» o «seres espirituales».
  rationale: «Poderes» conserva la ambigüedad del testimonio y evita imponer una jerarquía angélica concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la polémica abrupta, las repeticiones y la sintaxis fragmentaria donde el manuscrito está dañado. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,3.
