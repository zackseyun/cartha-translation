translation:
  language: es
  text: 'Los nombres que se dan a quienes son del mundo son muy engañosos, porque apartan el corazón de lo correcto y lo dirigen hacia lo que no es correcto. Quien oye «Dios» no piensa en lo correcto, sino en lo que no es correcto. Lo mismo sucede con «el Padre», «el Hijo», «el Espíritu Santo», «la vida», «la luz», «la resurrección», «la iglesia» y todos los demás: no piensan en [lo correcto], sino en lo que [no] es correcto, [a menos que] hayan aprendido lo correcto. Los [nombres que se oyeron] existen en el mundo […] [engañan. Si existieran] en la era eterna,[a] no se habrían usado como nombres en el mundo ni se habrían colocado entre las cosas del mundo. Tienen su fin en la era eterna.


    Hay un nombre que no se pronuncia en el mundo: el nombre que el Padre dio al Hijo. Está por encima de todo; es el nombre del Padre, porque el Hijo no habría llegado a ser padre si no hubiera tomado el nombre del Padre. Quienes tienen este nombre lo conocen, pero no lo dicen; y quienes no lo tienen no lo conocen. Pero la Verdad trajo nombres al mundo para nosotros, porque nos es imposible conocerla sin estos nombres.[b] La Verdad es una sola, pero para nosotros es muchas cosas, a fin de enseñarnos en amor esta única realidad por medio de muchas cosas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Era eterna» traduce una expresión que también puede entenderse como «eón». El manuscrito presenta lagunas en esta oración; los corchetes y los puntos suspensivos señalan texto restaurado o perdido.
    reason: Aclara un término técnico y preserva la evidencia visible del estado fragmentario del manuscrito.
  - marker: b
    text: El pronombre «la» se refiere a la Verdad.
    reason: Evita una referencia pronominal confusa en español sin añadir una interpretación teológica.
lexical_decisions:
- source_word: worldly / world
  choice: del mundo / mundo
  rationale: Mantiene la repetición conceptual del testimonio y evita «mundanos», que en español puede sugerir ante todo inmoralidad o secularidad.
- source_word: what's right / what's not right
  choice: lo correcto / lo que no es correcto
  rationale: Conserva la oposición deliberadamente general del texto sin convertirla en «verdad/error» ni imponer una interpretación metafísica.
- source_word: (eternal) age
  choice: era eterna
  rationale: Distingue esta expresión de «mundo» y conserva la aclaración interpretativa «eterna» indicada entre paréntesis en el testimonio.
- source_word: Truth
  choice: la Verdad
  rationale: La mayúscula refleja su tratamiento personificado en el pasaje, sin identificarla explícitamente con una figura doctrinal concreta.
- source_word: learn it (Truth)
  choice: conocerla
  rationale: El pronombre femenino remite con claridad a «la Verdad»; «conocer» resulta natural en español y admite tanto aprendizaje como comprensión.
theological_decisions:
- issue: La relación entre el Hijo, el nombre del Padre y llegar a ser padre
  choice: «el Hijo no habría llegado a ser padre si no hubiera tomado el nombre del Padre»
  alternative: «el Hijo no habría llegado a ser el Padre...»
  rationale: Se conserva la ausencia de artículo ante «padre» en el testimonio y no se resuelve la tensión identificando sin más al Hijo con el Padre.
- issue: La unidad y multiplicidad de la Verdad
  choice: «La Verdad es una sola, pero para nosotros es muchas cosas»
  alternative: «Hay una sola Verdad, pero se manifiesta de muchas maneras»
  rationale: La opción elegida mantiene la formulación paradójica del testimonio; la alternativa explicaría y resolvería una ambigüedad que el texto deja abierta.
- issue: Función de los nombres religiosos
  choice: Se preserva que pueden engañar y, a la vez, son necesarios para conocer la Verdad
  alternative: Explicar que solo los conceptos falsos engañan
  rationale: El pasaje mantiene una tensión interna entre el peligro y la necesidad de los nombres; no debe armonizarse doctrinalmente.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se mantuvieron las repeticiones de «nombre», «mundo», «correcto» y «Verdad» porque estructuran el argumento. Los corchetes y la elipsis reproducen las señales de restauración y laguna del testimonio suministrado. Borrador necesariamente provisional: la ficha indica que aún está pendiente la revisión directa del copto del Códice II de Nag Hammadi.'
