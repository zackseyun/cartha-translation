  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are slaves of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the slaves will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: es
  text: 'Cuando Abraham […] para ver lo que iba a ver, [se] circuncidó la carne del prepucio, [enseñándonos] que es necesario destruir la carne.


    [La mayoría de las cosas] del mundo pueden mantenerse en pie y vivir mientras sus [partes interiores permanecen ocultas. Si quedan al descubierto], mueren, como [lo ilustra] el ser humano visible. [Mientras] las entrañas de una persona permanecen ocultas, la persona vive. Si sus entrañas quedan expuestas y salen de ella, morirá. Lo mismo sucede con el árbol. Mientras su raíz está oculta, florece y crece. Si su raíz queda expuesta, el árbol se seca. Así ocurre con todo lo que nace en el mundo, no solo con lo manifiesto, sino también con lo oculto; porque mientras la raíz del mal permanece oculta, es fuerte. Pero si se la reconoce, se disuelve; y si queda al descubierto, muere. Por eso la Palabra dice: «El hacha ya está puesta a la raíz de los árboles».[a] No se limitará a cortar, porque lo cortado vuelve a brotar. Más bien, el hacha cava profundamente en la tierra hasta sacar la raíz. Jesús arrancó la raíz por completo, pero otros solo lo hicieron en parte. En cuanto a nosotros, que cada
    uno cave hasta llegar a la raíz del mal que lleva dentro y lo arranque de raíz en nosotros. Será desarraigado si lo reconocemos. Pero si no lo reconocemos, echa raíces dentro de nosotros y produce su fruto en nosotros. Nos domina y nos vemos obligados a servirle. Nos captura para que hagamos lo que [no] queremos y [no] hagamos lo que queremos.[b] [Es] poderoso porque no lo hemos reconocido. Permanece activo mientras [existe].


    [La ignorancia] es la madre de [todo mal]. La ignorancia causará [la muerte, porque] lo que procede de [la ignorancia] ni existió, ni [existe], ni llegará a existir […] serán perfeccionados cuando toda la verdad sea revelada, porque la verdad es como la ignorancia: cuando está oculta, reposa dentro de sí misma; pero si es revelada y reconocida, es glorificada, pues es más fuerte que la ignorancia y el error. Da libertad. La Palabra dice: «Si conocen la verdad, la verdad los hará libres».[c] La ignorancia es esclavitud; el conocimiento es libertad. Si conocemos la verdad, encontraremos dentro de nosotros los frutos de la verdad. Si nos unimos a ella, recibirá nuestra plenitud.


    Ahora tenemos lo que se ha revelado de la creación. Decimos: «Los fuertes son honorables, pero los ocultos son débiles y despreciados». Así sucede con los aspectos manifiestos de la verdad: son débiles y despreciados, mientras que los ocultos son fuertes y honorables. Sin embargo, los misterios de la verdad se revelan mediante figuras e imágenes.


    La cámara,[d] sin embargo, está oculta; es el Santo dentro del Santo. Al principio, el velo ocultaba cómo Dios gobernaba la creación; pero cuando el velo se rasgue y se revele lo que está dentro, esta casa quedará abandonada [como] un desierto o, más bien, será [destruida]. Y toda divinidad huirá [de] estos lugares, no hacia el Santo [de los] Santos, porque no podrá unirse con la [luz] pura y la plenitud [sin defecto], [sino que] llegará a estar bajo las alas de la cruz [y bajo] sus brazos. Esta arca [será su] salvación cuando las aguas del diluvio se lancen sobre ellos. Si algunos pertenecen al sacerdocio, podrán entrar detrás del velo con el sumo sacerdote. Por eso el velo no se rasgó solamente en la parte de arriba, pues entonces habría quedado abierto solo para los de arriba; ni se rasgó solamente en la parte de abajo, pues entonces habría quedado revelado solo para los de abajo. Más bien, se rasgó de arriba abajo.[e] Los de arriba nos abrieron la parte de abajo para que entremos
    en el secreto de la verdad.


    Esto es verdaderamente lo honorable y lo fuerte; pero entraremos allí por medio de figuras despreciadas y debilidades. Estas se humillan ante la gloria perfecta. Hay una gloria superior a otra gloria y un poder superior a otro poder. Así, lo perfecto se abrió para nosotros junto con los secretos de la verdad; el Santo de los Santos fue revelado y la cámara nos invitó a entrar.


    Mientras está oculto, el mal permanece inactivo, pero no ha sido quitado de entre la descendencia del Espíritu Santo. Ellos son esclavos del mal. Pero cuando quede al descubierto, la luz perfecta se derramará sobre todos, y todos los que estén en ella [recibirán la unción].[f] Entonces los esclavos serán liberados y los cautivos serán redimidos. «[Toda] planta [que] mi Padre que está en el cielo [no haya] plantado [será] desarraigada».[g] Los que están separados se unirán […] serán llenados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Compárese Mateo 3:10 y Lucas 3:9. La aplicación posterior amplía la imagen: el hacha no solo corta el árbol, sino que excava hasta extraer la raíz.'
    reason: Identifica la alusión y señala el desarrollo peculiar de la metáfora.
  - marker: b
    text: La formulación recuerda Romanos 7:15-20. Los corchetes conservan palabras restauradas en una sección dañada del manuscrito.
    reason: Aclara la alusión y la incertidumbre textual.
  - marker: c
    text: Compárese Juan 8:32.
    reason: Identifica la cita.
  - marker: d
    text: «Cámara» también puede entenderse como «cámara nupcial», una imagen ritual importante en el Evangelio de Felipe; aquí se conserva la expresión más breve del testimonio disponible.
    reason: Preserva una posible asociación técnica sin introducirla de forma categórica en el texto.
  - marker: e
    text: Compárese Mateo 27:51 y Marcos 15:38.
    reason: Identifica la alusión al velo rasgado.
  - marker: f
    text: Literalmente, «recibirán el crisma»; es decir, la unción. El texto no define aquí con precisión su carácter ritual.
    reason: Explica el término especializado sin fijar una interpretación denominacional.
  - marker: g
    text: Compárese Mateo 15:13.
    reason: Identifica la cita.
lexical_decisions:
- source_word: flesh
  choice: carne
  rationale: Conserva la repetición y la carga simbólica del pasaje sin reducirla de antemano al cuerpo físico ni reinterpretarla doctrinalmente.
- source_word: Word
  choice: la Palabra
  rationale: Mantiene la personificación y la posible resonancia cristológica del testimonio, a la vez que introduce las citas escriturarias.
- source_word: knowledge
  choice: conocimiento
  rationale: Es una traducción neutral y natural; evita importar como tecnicismo la categoría posterior «gnosis».
- source_word: types
  choice: figuras
  rationale: Expresa modelos o representaciones simbólicas de la verdad en español claro y conserva su contraste con la realidad perfecta.
- source_word: chamber
  choice: cámara
  rationale: Preserva el término distintivo del Evangelio de Felipe y su ambigüedad ritual; una nota indica que también puede entenderse como cámara nupcial.
- source_word: fullness
  choice: plenitud
  rationale: Conserva el vocabulario conceptual del texto sin reemplazarlo por el tecnicismo transliterado «pleroma».
- source_word: chrism
  choice: unción
  rationale: Traduce el acto o don ritual con un término comprensible, sin imponer una identificación sacramental específica.
- source_word: seed
  choice: descendencia
  rationale: En este contexto referido a personas, «descendencia» resulta más natural que «semilla», aunque se conserva la imagen colectiva.
theological_decisions:
- issue: El mandato de «destruir la carne»
  choice: Conservar literalmente «destruir la carne»
  alternative: Interpretarlo como mortificar deseos pecaminosos o rechazar el cuerpo
  rationale: El pasaje vincula la frase con la circuncisión, pero no explica inequívocamente su alcance; la traducción no debe resolver esa tensión.
- issue: La inexistencia de lo que procede de la ignorancia
  choice: Mantener la formulación ontológica fragmentaria
  alternative: Parafrasearla como simple desaparición moral del mal
  rationale: El texto parece afirmar algo sobre el ser o la irrealidad de lo nacido de la ignorancia, pero el manuscrito está dañado y la sintaxis cambia de número.
- issue: «Toda divinidad» que huye
  choice: Traducir «toda divinidad» sin identificar el referente
  alternative: Sustituirlo por Dios, los poderes divinos o la presencia divina
  rationale: El referente es teológicamente difícil y ambiguo; precisarlo excedería la evidencia suministrada.
- issue: Destino de la divinidad bajo la cruz
  choice: Conservar la secuencia y sus imágenes
  alternative: Armonizarla con una doctrina sistemática de la cruz, el templo o la plenitud
  rationale: El pasaje entrelaza velo, santuario, cruz y arca de manera propia; la traducción preserva esa tensión.
- issue: La cámara oculta
  choice: Mantener «cámara» y explicar la posible lectura nupcial en nota
  alternative: Traducir directamente «cámara nupcial»
  rationale: Aunque el término tiene asociaciones nupciales en la obra, el testimonio presentado dice «chamber» y el contexto inmediato no explicita «nupcial».
- issue: «La descendencia del Espíritu Santo» y su esclavitud
  choice: Conservar que «ellos son esclavos del mal»
  alternative: Suavizarlo como una influencia externa sobre creyentes
  rationale: La afirmación produce una tensión deliberada entre pertenencia al Espíritu y esclavitud al mal que no debe eliminarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron todos los corchetes y puntos suspensivos como señales de lagunas o restauraciones editoriales del testimonio. La traducción emplea equivalencia óptima, con imágenes concretas y repeticiones deliberadas. Dado que la revisión directa del copto está pendiente, este borrador se apoya de manera provisional en el testimonio inglés público suministrado y evita afirmar decisiones morfológicas que exigirían cotejo del códice.
