review_pass:
  verdict: revise
  source_fidelity: La versión sigue de cerca el testimonio inglés suministrado y conserva adecuadamente sus corchetes, lagunas y formulaciones teológicamente tensas. Sin acceso directo al copto, la revisión de lengua fuente no puede confirmarse de manera independiente. Se requieren correcciones puntuales para no reinterpretar ciertos referentes y para conservar la voz pasiva del testimonio.
  naturalness: 'El español es generalmente claro, actual y de registro apropiado. Hay algunas formulaciones mejorables: «aspectos manifiestos» introduce una abstracción ausente del testimonio, «estas se humillan» cambia una pasiva por reflexivo, y «las aguas del diluvio se lancen» es menos natural que «irrumpan».'
  terminology: Se mantienen acertadamente «carne», «Palabra», «plenitud», «unción» y «cámara», con notas prudentes. «Santo de los Santos» es una opción idiomática aceptable para «Holies of the Holies», mientras que «el Santo dentro del Santo» conserva la construcción distintiva de «Holy in the Holy».
  issues:
  - severity: medium
    issue: «los aspectos manifiestos de la verdad»
    rationale: El testimonio dice «those who are revealed of the truth» y se refiere a personas o entidades, no a «aspectos». La abstracción interpretativa debe evitarse; «los que se manifiestan de la verdad» conserva mejor la ambigüedad, aunque resulte deliberadamente inusual.
  - severity: medium
    issue: «Estas se humillan ante la gloria perfecta»
    rationale: El inglés «They are humbled in the presence of the perfect glory» está en voz pasiva. El reflexivo español convierte el sentido en una acción realizada por las figuras y debilidades. Debe decirse «Son humilladas ante la gloria perfecta».
  - severity: low
    issue: «la carne del prepucio»
    rationale: Aunque comprensible, «la carne de su prepucio» expresa de modo más natural el genitivo del testimonio y el referente de Abraham.
  - severity: low
    issue: «las aguas del diluvio se lancen sobre ellos»
    rationale: «Surge over» describe la irrupción o crecida de las aguas; «irrumpan sobre ellos» es más natural y preciso en español.
  revised_text: 'Cuando Abraham […] para ver lo que iba a ver, [circuncidó] la carne de su prepucio, [indicándonos] que es necesario destruir la carne.


    [La mayoría de las cosas] del mundo pueden mantenerse en pie y vivir mientras sus [partes interiores permanecen ocultas. Si quedan al descubierto], mueren, como [lo ilustra] el ser humano visible. [Mientras] las entrañas de una persona permanecen ocultas, la persona vive. Si sus entrañas quedan expuestas y salen de ella, morirá. Lo mismo sucede con el árbol. Mientras su raíz está oculta, florece y crece. Si su raíz queda expuesta, el árbol se seca. Así ocurre con todo lo que nace en el mundo, no solo con lo manifiesto, sino también con lo oculto; porque mientras la raíz del mal permanece oculta, es fuerte. Pero si se la reconoce, se disuelve; y si queda al descubierto, muere. Por eso la Palabra dice: «El hacha ya está puesta a la raíz de los árboles».[a] No se limitará a cortar, porque lo cortado vuelve a brotar. Más bien, el hacha cava profundamente en la tierra hasta sacar la raíz. Jesús arrancó la raíz por completo, pero otros solo lo hicieron en parte. En cuanto a nosotros, que cada
    uno cave hasta llegar a la raíz del mal que lleva dentro y lo arranque de raíz en nosotros. Será desarraigado si lo reconocemos. Pero si no lo reconocemos, echa raíces dentro de nosotros y produce su fruto en nosotros. Nos domina y nos vemos obligados a servirle. Nos captura para que hagamos lo que [no] queremos y [no] hagamos lo que queremos.[b] [Es] poderoso porque no lo hemos reconocido. Permanece activo mientras [existe].


    [La ignorancia] es la madre de [todo mal]. La ignorancia causará [la muerte, porque] lo que procede de [la ignorancia] ni existió, ni [existe], ni llegará a existir […] serán perfeccionados cuando toda la verdad sea revelada, porque la verdad es como la ignorancia: cuando está oculta, reposa dentro de sí misma; pero si es revelada y reconocida, es glorificada, pues es más fuerte que la ignorancia y el error. Da libertad. La Palabra dice: «Si conocen la verdad, la verdad los hará libres».[c] La ignorancia es esclavitud; el conocimiento es libertad. Si conocemos la verdad, encontraremos dentro de nosotros los frutos de la verdad. Si nos unimos a ella, recibirá nuestra plenitud.


    Ahora tenemos lo que se ha revelado de la creación. Decimos: «Los fuertes son honorables, pero los ocultos son débiles y despreciados». Así sucede con los que se manifiestan de la verdad: son débiles y despreciados, mientras que los ocultos son fuertes y honorables. Sin embargo, los misterios de la verdad se revelan mediante figuras e imágenes.


    La cámara,[d] sin embargo, está oculta; es el Santo dentro del Santo. Al principio, el velo ocultaba cómo Dios gobernaba la creación; pero cuando el velo sea rasgado y se revele lo que está dentro, esta casa quedará abandonada [como] un desierto o, más bien, será [destruida]. Y toda divinidad huirá [de] estos lugares, no hacia el Santo [de los] Santos, porque no podrá unirse con la [luz] pura y la plenitud [sin defecto], [sino que] llegará a estar bajo las alas de la cruz [y bajo] sus brazos. Esta arca [será su] salvación cuando las aguas del diluvio irrumpan sobre ellos. Si algunos pertenecen al sacerdocio, podrán entrar detrás del velo con el sumo sacerdote. Por eso el velo no se rasgó solamente en la parte de arriba, pues entonces habría quedado abierto solo para los de arriba; ni se rasgó solamente en la parte de abajo, pues entonces habría quedado revelado solo para los de abajo. Más bien, se rasgó de arriba abajo.[e] Los de arriba nos abrieron la parte de abajo para que entremos
    en el secreto de la verdad.


    Esto es verdaderamente lo honorable y lo fuerte; pero entraremos allí por medio de figuras despreciadas y debilidades. Son humilladas ante la gloria perfecta. Hay una gloria superior a otra gloria y un poder superior a otro poder. Así, lo perfecto se abrió para nosotros con los secretos de la verdad; el Santo de los Santos fue revelado y la cámara nos invitó a entrar.


    Mientras está oculto, el mal permanece inactivo, pero no ha sido quitado de entre la descendencia del Espíritu Santo. Ellos son esclavos del mal. Pero cuando quede al descubierto, la luz perfecta se derramará sobre todos, y todos los que estén en ella [recibirán la unción].[f] Entonces los esclavos serán liberados y los cautivos serán redimidos. «[Toda] planta [que] mi Padre que está en el cielo [no haya] plantado [será] desarraigada».[g] Los que están separados se unirán […] serán llenados.'
