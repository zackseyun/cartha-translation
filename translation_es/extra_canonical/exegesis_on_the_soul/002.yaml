lexical_decisions:
- source_word: prostitution / harlotry
  choice: prostitución / prostituirse
  rationale: Conserva la metáfora sexual dominante y su aplicación explícita tanto al cuerpo como al alma, sin suavizarla con términos menos precisos.
- source_word: shepherds
  choice: pastores
  rationale: Mantiene literalmente el término del testimonio, aunque el contexto bíblico pueda admitir otra tradición textual; no se armoniza con versiones canónicas posteriores.
- source_word: perceptible realm
  choice: ámbito perceptible
  rationale: Expresa el dominio captado por los sentidos sin imponer el tecnicismo filosófico «mundo sensible».
- source_word: senseless external things
  choice: cosas externas e insensibles
  rationale: Preserva la posible referencia a objetos carentes de sensación; evita interpretarlo como «cosas absurdas».
- source_word: men great of flesh
  choice: hombres de mucha carne
  rationale: Retiene la formulación corporal extraña y deliberada del testimonio en vez de resolverla como fuerza, genitalidad o corpulencia.
- source_word: world rulers
  choice: gobernantes mundiales
  rationale: Refleja el valor literal del compuesto citado sin identificar dogmáticamente a estos poderes.
- source_word: having sex
  choice: teniendo relaciones sexuales
  rationale: Conserva el carácter explícito de la imagen final en español natural y digno.
theological_decisions:
- issue: Sentido de la prostitución
  choice: Mantener tanto el sentido corporal como el espiritual y la prioridad que el autor concede a la prostitución del alma.
  alternative: Reducir toda referencia a idolatría o inmoralidad sexual literal.
  rationale: El pasaje distingue expresamente ambos planos y afirma una relación causal entre ellos.
- issue: Interpretación de «los hijos de Egipto»
  choice: Presentar la explicación del propio autor como una pregunta interpretativa.
  alternative: Convertirla en una definición doctrinal absoluta o identificarla con una escuela específica.
  rationale: Así se preservan la forma retórica y la tensión entre carne, percepción y asuntos terrenales.
- issue: Efesios 6:12
  choice: Conservar «sangre y carne» y «gobernantes mundiales de estas tinieblas».
  alternative: Armonizar con fórmulas bíblicas españolas habituales como «carne y sangre», «principados» o «potestades».
  rationale: La obra cita e interpreta una forma textual propia; armonizarla ocultaría la evidencia del testimonio.
- issue: Lenguaje femenino para el alma
  choice: Usar pronombres y concordancia femeninos cuando el discurso personifica al alma.
  alternative: Neutralizar la personificación o tratar «alma» como una entidad abstracta sin género narrativo.
  rationale: La alegoría depende de presentar al alma como esposa y mujer que se prostituye.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las imágenes sexuales explícitas porque estructuran el argumento alegórico. Las citas bíblicas siguen la forma del testimonio de esta obra y no se armonizaron con una versión bíblica moderna. Dado que la revisión directa del copto está pendiente, el borrador se basa provisionalmente en el testimonio inglés de dominio público suministrado; las lagunas y restauraciones se señalan mediante notas.
