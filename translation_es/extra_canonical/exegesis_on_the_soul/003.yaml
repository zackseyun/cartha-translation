review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue de cerca el testimonio inglés suministrado y conserva adecuadamente las lagunas, los corchetes editoriales y la ambigüedad teológica. No obstante, varias formas verbales presentes atenúan futuros explícitos del testimonio, y dos pasajes requieren corrección semántica: «become mad at herself» no significa simplemente enfurecerse, y «She purified herself in the bridal chamber» no dice que ella purificara la cámara.'
  naturalness: El registro es mayormente natural, actual y digno para el español latinoamericano. «Matriz» y «cámara nupcial» son apropiados en este contexto. Se mejora la fluidez mediante futuros coherentes y mediante una formulación más clara de la imagen de la matriz del alma.
  terminology: 'Se mantienen términos acertados y prudentes: «Padre», «matriz», «reino exterior», «contaminación», «bautismo», «primogénito» y «cámara nupcial». «Mercado» refleja con mayor precisión «marketplace» que «plaza». No se identifica doctrinalmente al hermano/novio.'
  issues:
  - severity: medium
    issue: Futuros del Padre vertidos como presentes
    rationale: El testimonio dice «will show mercy» y «will cause»; «se compadece» y «hace» los convierten en presentes. Deben conservarse «se compadecerá» y «hará».
  - severity: high
    issue: «Become mad at herself» se reduce a «se enfurece consigo misma»
    rationale: «Mad» comunica volverse loca o perder la cordura, no solo airarse. La furia aparece después, en «raging».
  - severity: high
    issue: Cambio del objeto en la purificación dentro de la cámara nupcial
    rationale: El testimonio afirma que ella «purified herself in the bridal chamber», no que purificó la cámara. La oración debe mantener a la novia/alma como quien se purifica, mientras llena la cámara de perfume.
  - severity: low
    issue: «Plaza» para «marketplace»
    rationale: Aunque es posible, «mercado» representa de forma más directa el lugar comercial público de la imagen.
  - severity: low
    issue: «Se extiende hacia fuera» para «surrounds outwardly»
    rationale: «Rodea exteriormente» conserva mejor el verbo espacial del testimonio, aun dentro de la imagen anatómica inusual.
  revised_text: 'Sin embargo, cuando ella se da cuenta de la aflicción en que se encuentra, clama ante el Padre y se arrepiente, el Padre se compadecerá de ella. Hará que su matriz se aparte del reino exterior y vuelva hacia dentro, haciendo que el alma recobre su buen carácter. Pues no es así en la mujer, ya que la matriz corporal está dentro, como los demás órganos internos del cuerpo.


    La matriz del alma, en cambio, rodea exteriormente, como los genitales externos del varón. Por tanto, cuando la matriz del alma se vuelve hacia dentro por voluntad del Padre, es bautizada y queda de inmediato purificada de la contaminación exterior que le fue impuesta, como [ropas] sucias que se sumergen [en agua y] se agitan hasta que desaparece la suciedad y quedan limpias. Así, la purificación del alma consiste en recobrar la renovación de [] su naturaleza anterior y en volver a sí misma. Ese es su bautismo.


    Entonces se volverá loca consigo misma, como una mujer en trabajo de parto: se retuerce y se enfurece a la hora de dar a luz. Sin embargo, por ser mujer, no puede concebir un hijo por sí sola. Desde el cielo, el Padre le envió un varón: su hermano, el primogénito. Entonces el novio descendió hasta la novia. Ella abandonó su prostitución anterior y se purificó de las contaminaciones de los adúlteros. Incluso fue renovada para convertirse en novia. Se purificó en la cámara nupcial, llenándola de perfume, y se sentó allí a esperar a su verdadero novio. Ya no andaba de un lado a otro por el mercado teniendo relaciones sexuales con quien quería, sino que permanecía esperándolo: «¿Cuándo llegará?». Y seguía temiéndole porque no sabía qué aspecto tenía. Ya no recordaba el momento en que cayó de la casa de su Padre. Sin embargo, por voluntad del Padre, […] Y soñaba con él como una mujer que ama a un hombre.


    Entonces el novio, de acuerdo con la voluntad del Padre, descendió hasta ella, a la cámara nupcial que había sido preparada, y la adornó.'
