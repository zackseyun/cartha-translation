  revision_rationale: La revisión conserva el carácter provisional de una traducción basada en el testimonio inglés, sin suplir la laguna ni resolver identificaciones teológicas implícitas. Corrige los futuros explícitos, restituye la distinción entre locura y furia, y mantiene la reflexividad de la purificación de la novia en la cámara nupcial. Los corchetes vacíos y la elipsis se preservan exactamente como señales de incertidumbre textual.
