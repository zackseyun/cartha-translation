  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: es
  text: 'Sin embargo, cuando ella se da cuenta de la aflicción en que se encuentra, clama ante el Padre y se arrepiente, el Padre se compadece de ella. Hace que su matriz se aparte del reino exterior y vuelva hacia dentro, de modo que el alma recobre su buen carácter. Pues no es así en la mujer, ya que la matriz corporal está dentro, como los demás órganos internos del cuerpo.


    La matriz del alma, en cambio, se extiende hacia fuera, como los genitales externos del varón. Por tanto, cuando la matriz del alma se vuelve hacia dentro por voluntad del Padre, es bautizada y queda de inmediato purificada de la contaminación exterior que le fue impuesta, como [ropas] sucias que se sumergen [en agua y] se agitan hasta que desaparece la suciedad y quedan limpias. Así, la purificación del alma consiste en recobrar la renovación de [] su naturaleza anterior y en volver a sí misma. Ese es su bautismo.


    Entonces se enfurece consigo misma y actúa como una mujer en trabajo de parto: se retuerce y se agita con furia a la hora de dar a luz. Sin embargo, por ser mujer, no puede concebir un hijo por sí sola. Desde el cielo, el Padre le envió un varón: su hermano, el primogénito. Entonces el novio descendió hasta la novia. Ella abandonó su prostitución anterior y se purificó de las contaminaciones de los adúlteros. Incluso fue renovada para convertirse en novia. Purificó la cámara nupcial, la llenó de perfume y se sentó allí a esperar a su verdadero novio. Ya no andaba de un lado a otro por la plaza teniendo relaciones sexuales con quien quería, sino que permanecía esperándolo: «¿Cuándo llegará?». Y seguía temiéndole porque no sabía qué aspecto tenía. Ya no recordaba el momento en que cayó de la casa de su Padre. Sin embargo, por voluntad del Padre, […] Y soñaba con él como una mujer que ama a un hombre.


    Entonces el novio, de acuerdo con la voluntad del Padre, descendió hasta ella, entró en la cámara nupcial que había sido preparada y la adornó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: trouble
  choice: aflicción
  rationale: Expresa una condición penosa con registro digno y evita reducir el sentido a un simple problema práctico.
- source_word: womb
  choice: matriz
  rationale: Conserva la imagen anatómica central y su contraste explícito con los genitales externos; «vientre» sería menos preciso.
- source_word: outward kingdom
  choice: reino exterior
  rationale: Mantiene la formulación espacial y teológica del testimonio sin interpretarla como mundo material u otra categoría doctrinal.
- source_word: good character
  choice: buen carácter
  rationale: Conserva la amplitud moral del testimonio sin sustituirla por «naturaleza» o «virtud».
- source_word: pollution
  choice: contaminación
  rationale: Reproduce la metáfora de impureza sin imponer terminología ritual específica.
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Es una expresión natural y digna que preserva el posible peso simbólico del término.
- source_word: marketplace
  choice: plaza
  rationale: Representa el espacio público urbano al que alude la imagen y suena natural en español latinoamericano.
- source_word: firstborn
  choice: primogénito
  rationale: Conserva el título familiar y su potencial resonancia teológica sin identificar de manera explícita al personaje.
theological_decisions:
- issue: Identidad del hermano primogénito y novio
  choice: No identificarlo explícitamente por nombre
  alternative: Traducir o glosar el referente como Cristo o el Salvador
  rationale: El pasaje suministrado solo lo llama hermano, primogénito y novio; precisar su identidad resolvería una referencia que el texto deja implícita.
- issue: Sentido del bautismo del alma
  choice: Conservar la imagen como bautismo y purificación interior
  alternative: Explicarla como un rito eclesial específico o como mera metáfora moral
  rationale: El texto vincula bautismo, purificación, retorno y restauración, pero no define aquí su relación con un rito concreto.
- issue: Agencia en la contaminación exterior
  choice: «que le fue impuesta»
  alternative: «que sufrió contra su voluntad» o una formulación que identifique a los responsables
  rationale: Mantiene la voz pasiva y la coerción presentes en el testimonio sin añadir responsables ni precisar el modo.
- issue: Restauración de la naturaleza anterior
  choice: «recobrar la renovación de [] su naturaleza anterior»
  alternative: Regularizar como «renovar su naturaleza anterior»
  rationale: Se preservan la construcción difícil y la laguna textual para no resolver editorialmente un pasaje incierto.
- issue: Lenguaje femenino aplicado al alma
  choice: Mantener pronombres y concordancia femeninos
  alternative: Neutralizar el género del alma o tratarla solo como símbolo impersonal
  rationale: El género femenino sostiene las imágenes de matriz, novia, prostitución y parto que estructuran el argumento.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron los corchetes de restauración editorial, los corchetes vacíos y la elipsis que señala una laguna. Dado que la revisión directa del copto está pendiente, el borrador sigue de forma prudente el testimonio inglés público suministrado y evita reconstrucciones adicionales.
