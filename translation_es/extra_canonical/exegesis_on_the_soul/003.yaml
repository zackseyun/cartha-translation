review_pass:
  verdict: revise
  source_fidelity: 'La revisión se basa en el testimonio inglés público suministrado, pues la revisión directa del copto sigue pendiente. El borrador preserva en general la imaginería, las lagunas y la ambigüedad teológica. No obstante, altera dos elementos relevantes: «become mad at herself» se reduce a enojo, y «She purified herself in the bridal chamber» se convierte erróneamente en la purificación de la cámara.'
  naturalness: 'El español es mayormente claro y de registro digno. Se ajustan algunas formulaciones para mayor precisión y fluidez: «rodea exteriormente», «empapadas» y la futura secuencia verbal del pasaje.'
  terminology: Se mantienen «matriz», «reino exterior», «bautizada», «primogénito» y «cámara nupcial». Se conserva «varón» para el contraste sexual explícito del texto y no se identifica doctrinalmente al hermano/novio.
  issues:
  - severity: high
    issue: «Entonces se enfurece consigo misma» traduce «Then she will become mad at herself».
    rationale: «Enfurecerse» solo expresa ira, mientras que el testimonio expresa volverse loca o enloquecer consigo misma. La imagen posterior conserva la furia, pero no sustituye el primer matiz.
  - severity: high
    issue: «Purificó la cámara nupcial» cambia el objeto de «She purified herself in the bridal chamber».
    rationale: El texto dice que ella se purificó a sí misma en la cámara nupcial; después llenó esa cámara de perfume. La redacción propuesta atribuye indebidamente a la cámara la purificación.
  - severity: medium
    issue: «La matriz del alma ... se extiende hacia fuera» atenúa «surrounds outwardly».
    rationale: El testimonio describe la matriz del alma como algo que rodea exteriormente, en analogía con los genitales externos masculinos; «se extiende» no conserva con precisión esa imagen espacial.
  - severity: low
    issue: «[ropas] ... se sumergen» no refleja exactamente «soaked».
    rationale: Las ropas ya están empapadas y son agitadas; «se sumergen» introduce una acción distinta.
  revised_text: 'Sin embargo, cuando ella se da cuenta de la aflicción en que se encuentra, clama ante el Padre y se arrepiente, el Padre tendrá misericordia de ella. Hará que su matriz se aparte del reino exterior y vuelva hacia dentro, haciendo que el alma recobre su buen carácter. Pues no es así en una mujer, ya que la matriz corporal está dentro, como los demás órganos internos del cuerpo.



    La matriz del alma, en cambio, rodea exteriormente, como los genitales externos del varón. Por tanto, cuando la matriz del alma se vuelve hacia dentro por voluntad del Padre, es bautizada y de inmediato queda purificada de la contaminación exterior que le fue impuesta, como [ropas] sucias empapadas [en agua y] agitadas hasta que desaparece la suciedad y quedan limpias. Así, la purificación del alma es recobrar la renovación de [] su naturaleza anterior y volver a sí misma. Ese es su bautismo.



    Entonces se volverá loca consigo misma, actuando como una mujer en trabajo de parto: se retorcerá y se enfurecerá a la hora de dar a luz. Sin embargo, por ser mujer, no puede concebir un hijo por sí sola. Desde el cielo, el Padre le envió un varón: su hermano, el primogénito. Entonces el novio descendió hasta la novia. Ella abandonó su prostitución anterior y se purificó de las contaminaciones de los adúlteros. Incluso fue renovada para convertirse en novia. Se purificó en la cámara nupcial, la llenó de perfume y se sentó allí a esperar a su verdadero novio. Ya no andaba de un lado a otro por la plaza teniendo relaciones sexuales con quien quería; más bien, permanecía esperándolo: «¿Cuándo llegará?». Y seguía temiéndole porque no sabía qué aspecto tenía. Ya no recordaba el momento en que cayó de la casa de su Padre. Sin embargo, por voluntad del Padre, […] Y soñaba con él como una mujer que ama a un hombre.



    Entonces el novio, de acuerdo con la voluntad del Padre, descendió hasta ella, entró en la cámara nupcial que había sido preparada y la adornó.'
  revised_footnotes: []
  revision_rationale: La revisión corrige los cambios de sentido relativos a la locura de la figura femenina y a quién recibe la purificación en la cámara nupcial. También recupera la imagen espacial de la «matriz del alma» y la comparación de las ropas ya empapadas. Se conservan los corchetes vacíos y la elipsis como señales de daño o incertidumbre textual, sin suplir su contenido. Dado que el testimonio suministrado alterna futuros y pasados en la secuencia narrativa, se conserva esa alternancia sin armonizarla editorialmente.
