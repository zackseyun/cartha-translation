    También [Helena] dice:



    Mi corazón cambió dentro de mí;


    [] a mi hogar quisiera volver. (Homero, Odisea 4.260–261)



    Pues gemía y decía:



    Fue Afrodita quien me engañó


    y me llevó lejos de mi aldea.


    Abandoné a mi propia hija


    y a mi esposo, bueno, inteligente y apuesto. (Homero, Odisea 4.261–4.264)



    Porque cuando el alma abandona a su esposo perfecto a causa de la infidelidad de Afrodita, quien llega a existir aquí mediante el acto de engendrar, entonces sufrirá daño. Pero si gime y se arrepiente, será devuelta a su casa.'
  revised_footnotes: []
  revision_rationale: Se conserva el texto del borrador salvo la restitución de los corchetes vacíos, que es necesaria para reflejar la laguna indicada por el testimonio. Aunque el alcance de «[Helen also]» podría reproducirse más literalmente como «[También Helena]», se mantiene «También [Helena] dice» porque en español «también» cumple naturalmente la función discursiva de «Again» y el nombre restaurado sigue marcado; no obstante, la señal de laguna vacía sí exige corrección obligatoria. La revisión directa del copto continúa pendiente.
