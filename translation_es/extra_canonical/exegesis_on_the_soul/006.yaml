  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: es
  text: 'Por eso está escrito en el poeta:


    Odiseo estaba sentado en la isla, sufriendo y afligido,

    y apartaba el rostro de las palabras y los encantos de Calipso,

    anhelando volver a ver su aldea y el humo que se elevaba de ella.

    Y si no hubiera [recibido] ayuda del Cielo,

    [no habría podido regresar] a su aldea. (Homero, Odisea 1.48–1.59)


    También [Helena] dice:


    Mi corazón cambió dentro de mí;

    […] a mi hogar quisiera volver. (Homero, Odisea 4.260–261)


    Pues gemía y decía:


    Fue Afrodita quien me engañó

    y me llevó lejos de mi aldea.

    Abandoné a mi propia hija

    y a mi esposo, bueno, inteligente y apuesto. (Homero, Odisea 4.261–4.264)


    Porque cuando el alma abandona a su esposo perfecto a causa de la infidelidad de Afrodita, quien llega a existir aquí mediante el acto de engendrar, entonces sufrirá daño. Pero si gime y se arrepiente, será devuelta a su casa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: village
  choice: aldea
  rationale: Conserva la imagen reiterada del testimonio y evita sustituirla por «patria» o «tierra natal», términos interpretativamente más amplios.
- source_word: Heaven
  choice: Cielo
  rationale: La mayúscula conserva su posible función metonímica o divina sin identificar de manera explícita al agente.
- source_word: moans
  choice: gime
  rationale: Mantiene el lamento audible y penitencial que conecta el ejemplo de Helena con la aplicación al alma.
- source_word: perfect husband
  choice: esposo perfecto
  rationale: Reproduce la formulación valorativa sin explicitar una identidad teológica que el pasaje no nombra.
- source_word: act of begetting
  choice: acto de engendrar
  rationale: Traducción formal que preserva la difícil relación entre Afrodita, la generación y la existencia terrenal.
- source_word: returned to her house
  choice: será devuelta a su casa
  rationale: Conserva la voz pasiva y la correspondencia entre el regreso de Helena al hogar y la restauración del alma.
theological_decisions:
- issue: Identidad del «esposo perfecto»
  choice: Mantener «esposo perfecto» sin identificación adicional
  alternative: Identificarlo explícitamente con Dios, Cristo o un esposo celestial
  rationale: El fragmento sostiene una alegoría, pero aquí no identifica expresamente al esposo; explicitarlo eliminaría una ambigüedad genuina.
- issue: Agente de la restauración
  choice: Conservar la voz pasiva «será devuelta»
  alternative: «Dios la hará volver» o «volverá»
  rationale: La voz pasiva deja abierto quién efectúa el retorno y no borra la posible pasividad divina.
- issue: Sentido de la generación vinculada con Afrodita
  choice: Traducir literalmente «mediante el acto de engendrar»
  alternative: Parafrasear como deseo sexual, nacimiento corporal o reproducción
  rationale: La expresión es conceptualmente difícil y su interpretación cosmológica o moral no debe decidirse sin revisión directa del copto.
