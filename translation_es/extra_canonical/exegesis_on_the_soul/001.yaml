translation:
  language: es
  text: '[a] Hace mucho tiempo, los sabios dieron al alma un nombre femenino. En efecto, también es femenina por naturaleza. Incluso tiene matriz.


    Mientras vivió a solas con el Padre, era virgen y su forma era andrógina. Pero cuando cayó en un cuerpo y entró en esta vida, cayó en manos de muchos ladrones. Aquellas criaturas crueles se la pasaron unas a otras y la [violaron].[b] Unas abusaron de ella por la fuerza, mientras que otras la sedujeron con un regalo. En pocas palabras, la profanaron, y ella [perdió] su [c] virginidad.


    En su cuerpo se prostituyó y se entregó a todos sin excepción, considerando esposo suyo a cada uno que estaba dispuesta a abrazar. Después de haberse entregado a adúlteros crueles e infieles para que abusaran de ella, gimió profundamente y se arrepintió.


    Sin embargo, aun cuando apartaba el rostro de aquellos adúlteros, corría hacia otros. Estos la obligaban a vivir con ellos y a servirlos en su lecho, como si fueran sus amos. Avergonzada, ya no se atrevía a dejarlos. Ellos, por su parte, la engañaron durante mucho tiempo, haciéndose pasar por esposos fieles y verdaderos, como si la respetaran mucho. Después de todo esto, la abandonaron y se fueron.


    Entonces quedó como una viuda indefensa, pobre y desolada. En el tiempo de su aflicción no le quedó ni un bocado de comida. Lo único que obtuvo de ellos fue la contaminación producida por las relaciones sexuales. Y los hijos que tuvo de los adúlteros son mudos, ciegos, enfermizos y de entendimiento débil.


    Pero cuando el Padre excelso la visitó, fijó en ella su mirada y la vio gemir entre dolores y vergüenza, arrepentida de la prostitución que había practicado; y cuando ella comenzó a invocar su nombre para que la ayudara, [gimió][d] con todo su corazón y dijo: «Sálvame, Padre mío. Mírame, porque [te rendiré cuentas],[e] pues abandoné mi casa y [f] escapé de la habitación donde vivía como doncella. Haz que vuelva a ti una vez más».


    Cuando él la vea en esta condición, la considerará digna de recibir su misericordia, pues muchos son los sufrimientos que le sobrevinieron por haber abandonado su casa.'
