lexical_decisions:
- source_word: soul
  choice: alma
  rationale: Es el equivalente natural y tradicional en español; el género gramatical femenino permite conservar la personificación sostenida del pasaje.
- source_word: androgynous
  choice: andrógina
  rationale: Conserva de manera directa la descripción paradójica de una figura femenina cuya forma reúne rasgos de ambos sexos, sin explicarla doctrinalmente.
- source_word: robbers
  choice: ladrones
  rationale: Mantiene la imagen concreta y violenta del testimonio, sin sustituirla por una identificación alegórica no explícita.
- source_word: violated
  choice: violaron
  rationale: En el contexto sexual y coercitivo, expresa con claridad la violencia indicada por la restauración editorial.
- source_word: practiced prostitution
  choice: se prostituyó
  rationale: Expresa con naturalidad la acción reiterada sin rebajar la crudeza moral y corporal de la metáfora.
- source_word: weak-minded
  choice: de entendimiento débil
  rationale: Evita un insulto moderno o un diagnóstico clínico, y conserva la idea de una capacidad intelectual debilitada.
- source_word: exalted Father
  choice: Padre excelso
  rationale: Mantiene el sentido de elevación y dignidad con un registro solemne y comprensible.
- source_word: maiden’s quarters
  choice: la habitación donde vivía como doncella
  rationale: Aclara la construcción posesiva poco natural en español, conservando la imagen doméstica y el estado virginal.
theological_decisions:
- issue: Naturaleza femenina y forma andrógina del alma
  choice: Se conservan juntas ambas afirmaciones sin armonizarlas.
  alternative: Interpretar «andrógina» como puramente espiritual o eliminar la aparente tensión.
  rationale: El pasaje presenta deliberadamente ambas descripciones; resolverlas impondría una lectura teológica externa.
- issue: Identidad de los ladrones y adúlteros
  choice: Se mantienen como figuras no identificadas.
  alternative: Nombrarlos como demonios, poderes, pasiones o seres humanos.
  rationale: El fragmento no explicita aquí su referente, por lo que la traducción debe preservar la apertura alegórica.
- issue: Culpa y victimización del alma
  choice: Se conserva tanto la violencia que padece como su prostitución y arrepentimiento.
  alternative: Presentarla exclusivamente como víctima o exclusivamente como culpable.
  rationale: El texto mantiene una tensión entre coerción, seducción, entrega voluntaria y arrepentimiento que no debe simplificarse.
- issue: «La considerará digna» de misericordia
  choice: Se traduce literalmente la relación entre su condición, sufrimientos y recepción de misericordia.
  alternative: Reformularlo como gracia incondicional o como mérito estricto.
  rationale: Ninguna de esas sistematizaciones está exigida por el pasaje; la formulación conserva su propia lógica teológica.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva la imaginería sexual explícita por ser esencial a la alegoría, con formulaciones claras pero no sensacionalistas. El borrador es necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto del Códice II,6 de Nag Hammadi sigue pendiente. Las restauraciones y lagunas indicadas mediante corchetes en el testimonio se representan mediante notas marcadas en el texto.'
