translation:
  language: es
  text: 'Israel ciertamente no habría sido visitado al principio para ser rescatado de la tierra de Egipto, de la casa de esclavitud, si no hubiera gemido ante Dios y se hubiera lamentado por la tiranía de su esclavitud.


    También está escrito en los Salmos:


    Me agoté de tanto gemir.

    Cada noche inundaré mi cama


    y empaparé mi lecho con mis lágrimas.

    He envejecido en medio de todos mis enemigos.

    Apártense de mí, todos los que practican el mal,

    porque el Señor ha oído el clamor de mi llanto,

    y el Señor ha recibido mi oración. (Salmo 6:6-9)[a]


    Si nos arrepentimos, Dios sin duda nos escuchará, pues él es paciente y rico en misericordia. A él sea la gloria por los siglos de los siglos. ¡Amén!


    La Exégesis sobre el alma'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La numeración y la forma de esta cita siguen el testimonio inglés suministrado. La redacción puede diferir de la de traducciones bíblicas modernas del Salmo 6.
    reason: Aclara que se traduce la cita tal como aparece en el testimonio disponible y evita armonizarla silenciosamente con una versión bíblica particular.
lexical_decisions:
- source_word: visited
  choice: visitado
  rationale: Conserva el lenguaje tradicional de la intervención divina sin reducirlo únicamente a «ayudado» o «liberado», acciones que el resto de la oración ya explicita.
- source_word: house of bondage
  choice: casa de esclavitud
  rationale: Mantiene la imagen bíblica de una «casa» caracterizada por la esclavitud, con una formulación clara en español latinoamericano.
- source_word: moaned over
  choice: se hubiera lamentado por
  rationale: Distingue este verbo de «gemido» y expresa una lamentación provocada por la opresión.
- source_word: tyranny
  choice: tiranía
  rationale: Retiene la fuerza política y opresiva del término del testimonio inglés.
- source_word: workers of evil
  choice: los que practican el mal
  rationale: Expresa en español natural la idea activa de obrar o hacer el mal.
- source_word: accepted my prayer
  choice: ha recibido mi oración
  rationale: Preserva la idea de acogida favorable sin convertirla explícitamente en «respondió», algo que el texto no afirma de manera directa.
- source_word: richly merciful
  choice: rico en misericordia
  rationale: Reproduce una expresión bíblica reconocible y natural, manteniendo la abundancia de la misericordia divina.
theological_decisions:
- issue: La «visita» divina a Israel
  choice: «habría sido visitado… para ser rescatado»
  alternative: «Dios habría acudido a Israel… para rescatarlo»
  rationale: Se conserva la pasiva y la noción teológica de visitación, mientras la frase final aclara su finalidad liberadora sin identificar expresamente al agente dentro de esa cláusula.
- issue: Relación entre arrepentimiento y escucha divina
  choice: «Si nos arrepentimos, Dios sin duda nos escuchará»
  alternative: «Cuando nos arrepentimos, Dios nos escucha»
  rationale: Mantiene la forma condicional y la seguridad enfática del testimonio sin formular una regla más amplia que la del texto.
- issue: Doxología final
  choice: «A él sea la gloria por los siglos de los siglos»
  alternative: «A quien sea la gloria para siempre»
  rationale: Ofrece una fórmula doxológica natural y digna, sin añadir contenido doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se excluyeron del cuerpo de la obra los elementos ajenos al texto —preguntas frecuentes, datos de contacto y aviso comercial—. Borrador provisional basado en el testimonio inglés de dominio público; queda pendiente la revisión directa del copto del Códice II,6 de Nag Hammadi.
