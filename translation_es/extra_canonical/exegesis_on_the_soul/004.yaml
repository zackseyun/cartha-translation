translation:
  language: es
  text: 'Porque ese matrimonio no es como el matrimonio carnal, quienes tienen relaciones sexuales entre sí se contentan con esa clase de unión. Y, como si fuera un peso, dejan atrás la molestia del deseo corporal, [apartando el rostro][a] el uno del otro. Este matrimonio, en cambio, [es diferente]. Cuando [se unen el uno con el otro], llegan a ser una sola vida.


    [] Por eso dijo el profeta acerca del primer hombre y la primera mujer: «Los dos llegarán a ser una sola carne» (Génesis 2:24).


    Pues al principio estaban unidos el uno al otro cuando vivían con el Padre, antes de que la mujer desviara al hombre, que es su hermano. Este matrimonio los ha unido de nuevo, y el alma se ha unido con su verdadero amado, el señor de sus orígenes, como está escrito: «El señor de la mujer es su marido» (Génesis 3:16; Efesios 5:23).


    Entonces, poco a poco, ella lo reconoció y volvió a alegrarse. Lloraba en su presencia al recordar la vergüenza que había sufrido antes como viuda. Y se embelleció aún más para que él se complaciera en habitar con ella.


    Y el profeta dijo en los Salmos:


    «Escucha, hija mía; mira e inclina tu oído.

    Olvida a tu pueblo y la casa de tu padre,

    y el rey deseará tu belleza,

    porque él es tu señor» (Salmo 45:10-11).


    Pues él le ordena apartar la mirada de su pueblo y de la multitud de sus adúlteros, entre quienes vivió en otro tiempo, para consagrarse únicamente a su rey, su verdadero Señor. También le ordena olvidar la casa de su padre terrenal, donde su situación era espantosa, y recordar, en cambio, a su Padre que está en el cielo.


    De igual manera, también se le dijo a Abraham: «Sal de tu tierra, de entre tus parientes y de la casa de tu padre» (Génesis 12:1).


    Así, después de que el alma [se embelleció] de nuevo con su esplendor, [deseó] adorar a su amado, y [él también] la amó. Cuando ella se unió con él, recibió [] de él la semilla del espíritu que da vida. Por medio de ella da a luz hijos rectos y los cría, porque este es el gran y perfecto prodigio del nacimiento. Así se consuma este matrimonio por la voluntad del Padre.


    Es necesario que el alma se regenere y vuelva a ser lo que era antes. Entonces el alma actúa por su propia voluntad y recibe del Padre la naturaleza divina para su renovación, a fin de ser restaurada al lugar donde estaba al principio:


    Esta es la resurrección de entre los muertos.

    Esta es la redención de la esclavitud.

    Este es el viaje ascendente hacia el cielo.

    Este es el camino de ascenso hacia el Padre.


    Por eso dijo el profeta:


    «Alaba al Señor, alma mía;

    que todo lo que hay en mí alabe su santo nombre.

    Alma mía, alaba a Dios,

    quien perdona todas tus maldades,

    quien sana todas tus enfermedades,

    quien rescata tu vida de la muerte,

    quien te corona de misericordia,

    quien colma de bienes tu anhelo.

    Tu juventud será renovada como la del águila» (Salmo 103:1-5).


    Después de rejuvenecer, ella ascenderá alabando al Padre y a su hermano, quien la salvó. De este modo, el alma se salva al nacer de nuevo. Y esto no ocurre por repetir fórmulas, ni por el conocimiento de los instruidos, ni por lo aprendido en libros. Ocurre, más bien, por la gracia del [Espíritu]; es el don del [Dios] compasivo. Este es el camino de esta realidad celestial.


    Por eso el Salvador proclama: [] «Nadie puede venir a mí si mi Padre no lo atrae y lo trae a mí; y yo lo resucitaré en el último día» (Juan 6:44).


    [a] Los corchetes reproducen palabras restauradas en el testimonio utilizado; los corchetes vacíos señalan una laguna sin restaurar.'
