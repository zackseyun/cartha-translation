lexical_decisions:
- source_word: carnal marriage
  choice: matrimonio carnal
  rationale: Conserva el contraste antropológico y retórico del testimonio sin suavizarlo como simple matrimonio físico.
- source_word: sex
  choice: relaciones sexuales / unión
  rationale: «Relaciones sexuales» expresa con claridad el sentido inicial; «unión» evita una repetición torpe en la frase inmediata sin borrar el referente.
- source_word: one life
  choice: una sola vida
  rationale: Mantiene la formulación distintiva del pasaje y no la armoniza con la cita posterior sobre «una sola carne».
- source_word: original master
  choice: el señor de sus orígenes
  rationale: Expresa la prioridad original y la autoridad relacional sin introducir el matiz moderno y potencialmente reductivo de «dueño».
- source_word: upright children
  choice: hijos rectos
  rationale: Retiene el sentido moral de rectitud y la imaginería explícita de generación.
- source_word: regenerates herself
  choice: se regenere
  rationale: Conserva la forma reflexiva y la agencia atribuida al alma, aun cuando el pasaje también atribuye la renovación al Padre.
- source_word: divine nature
  choice: naturaleza divina
  rationale: Traducción directa que preserva la afirmación teológica fuerte sin reinterpretarla.
- source_word: heavenly reality
  choice: realidad celestial
  rationale: Mantiene la amplitud conceptual del testimonio en vez de identificarla con un rito, doctrina o lugar específico.
theological_decisions:
- issue: Relación entre la voluntad del alma y la acción del Padre
  choice: Se conservan juntas la acción «por su propia voluntad» y la recepción de la naturaleza divina «del Padre».
  alternative: Subordinar explícitamente la voluntad humana a la gracia divina o presentar la renovación como exclusivamente autónoma.
  rationale: El pasaje sostiene ambas afirmaciones en tensión; resolverla favorecería una lectura doctrinal no exigida por el testimonio.
- issue: Identidad del hermano que salva al alma
  choice: Se mantiene «su hermano» sin identificación añadida.
  alternative: Identificar expresamente al hermano con Cristo, el Salvador o el esposo.
  rationale: Aunque el contexto permite asociaciones, el testimonio suministrado no hace aquí una identificación inequívoca.
- issue: El alma recibe la naturaleza divina
  choice: Se traduce literalmente «recibe del Padre la naturaleza divina».
  alternative: Atenuarlo como «participa de cualidades divinas» o explicarlo como deificación.
  rationale: La formulación debe conservar su fuerza y ambigüedad sin imponer una construcción teológica posterior.
- issue: Terminología de renacimiento, resurrección y ascenso
  choice: Se mantienen como imágenes relacionadas pero no se fusionan en una sola doctrina sistemática.
  alternative: Interpretarlas todas como bautismo, conversión, resurrección corporal o ascenso posmortal.
  rationale: El propio texto yuxtapone las imágenes y no obliga a elegir una sola referencia.
- issue: Citas bíblicas
  choice: Se traducen según la forma citada en el testimonio y se conservan sus referencias.
  alternative: Armonizarlas con una versión bíblica española o corregirlas según los textos hebreo y griego canónicos.
  rationale: Aquí las citas forman parte de una obra copta y deben reflejar la forma en que el testimonio las presenta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la imaginería nupcial y sexual, los cambios de referente y las afirmaciones teológicas tensas. Este borrador es provisional porque se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto del Códice II,6 de Nag Hammadi. Las referencias bíblicas no se armonizaron con una traducción bíblica española concreta.
