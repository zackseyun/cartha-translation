base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/005.yaml
  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: es
  text: 'Por tanto, conviene orar al Padre e invocarlo con toda nuestra alma, suspirando no exteriormente con los labios, sino con el espíritu interior que brota de lo profundo. Debemos arrepentirnos de la vida que llevábamos antes, confesar nuestros pecados, reconocer la mentira vacía en la que vivíamos y nuestro celo vano, lamentarnos por la oscuridad y la ola que nos envolvió, y llorar por nosotros mismos para que él tenga compasión de nosotros, aborreciéndonos por lo que somos ahora.


    El Salvador dijo también:


    «Dichosos los que lloran, porque recibirán compasión.

    Dichosos los que tienen hambre, porque serán saciados» (Mateo 5:4, 6; Lucas 6:21).


    Dijo además: «Si alguien no aborrece su alma, no puede seguirme» (Lucas 14:26).[a]


    Esto se debe a que el arrepentimiento es el principio de la salvación. Por eso, «antes de que apareciera Cristo, vino Juan predicando el bautismo de arrepentimiento» (Hechos 13:24).


    El arrepentimiento ocurre en medio del dolor y la tristeza. Sin embargo, el Padre es bueno y ama a la humanidad; escucha al alma que lo invoca y le envía la luz de la salvación. Por eso dijo mediante el Espíritu al profeta:


    Di a los hijos de mi pueblo:


    «[Si] sus pecados llegan [desde la tierra hasta] el cielo,

    y si son [rojos] como la escarlata

    y más negros que la tela de duelo,

    [y si] […] vuelven a mí con toda su alma

    y me dicen: “¡Padre mío!”,

    yo los escucharé como a un pueblo santo» (1 Clemente 8:3).[b]


    En otro pasaje dice: «Así dice el Señor, el Santo de Israel: “Si vuelven y lloran, serán salvados, y sabrán dónde estaban cuando pusieron su esperanza en lo que está vacío”» (Isaías 30:15).[c]


    Y en otro pasaje dijo:


    Jerusalén lloró mucho y dijo: «Ten compasión de mí». Él tendrá compasión de ti al oír el sonido de tu llanto. Cuando vio, te respondió. El Señor les dará pan de adversidad y agua de aflicción. Desde ahora, quienes les mienten ya no se acercarán a ustedes. Sus ojos verán a quienes les mienten (Isaías 30:19-20).[d]


    Por tanto, conviene orar a Dios de noche y de día, extendiendo hacia él nuestras manos como quienes navegan en medio del mar. Ellos oran a Dios con todo el corazón y sin doblez, porque quienes oran con doblez solo se mienten a sí mismos. En efecto, para saber quién es digno de la salvación, Dios examina lo más íntimo y escudriña las profundidades del corazón. Pues nadie que todavía ame el lugar de la mentira es digno de la salvación.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «aborrece su alma» reproduce la terminología de este tratado. La cita se relaciona con Lucas 14:26, donde la formulación transmitida también puede entenderse en referencia a la propia vida o persona.
    reason: Preservar una expresión teológicamente tensa sin imponer una interpretación única.
  - marker: b
    text: Los corchetes señalan palabras restauradas o lagunas en el testimonio disponible. La cita aparece también en 1 Clemente 8:3 y combina lenguaje relacionado con varios pasajes proféticos.
    reason: Explicar las señales de daño o restauración y advertir que la cita no debe normalizarse silenciosamente.
  - marker: c
    text: La formulación atribuida a Isaías 30:15 difiere de las formas habituales del texto bíblico conservado; aquí se traduce tal como la cita el tratado.
    reason: Mantener la forma de la cita antigua como evidencia textual.
  - marker: d
    text: Este pasaje combina y adapta expresiones de Isaías 30:19-20. Se conserva su forma en el tratado, aun donde la secuencia de personas gramaticales y la frase «cuando vio» resultan difíciles.
    reason: No corregir conjeturalmente un texto oscuro ni ocultar su inestabilidad gramatical.
lexical_decisions:
- source_word: soul
  choice: alma
  rationale: Conserva el término antropológico repetido por el testimonio y su vínculo con la exhortación a invocar al Padre «con toda nuestra alma».
- source_word: repentance
  choice: arrepentimiento
  rationale: Es la equivalencia tradicional y comprensible para el giro religioso que presenta el arrepentimiento como comienzo de la salvación.
- source_word: hollow zealotry
  choice: celo vano
  rationale: Evita el matiz moderno, político y peyorativo de «fanatismo», a la vez que conserva la idea de un fervor carente de sustancia.
- source_word: pitied / compassion
  choice: recibir compasión / tener compasión
  rationale: Mantiene la repetición conceptual del testimonio sin imponer la formulación canónica «consolados», que no corresponde a esta cita compuesta.
- source_word: duplicity
  choice: doblez
  rationale: Expresa un corazón dividido o insincero en un registro bíblico digno, pero todavía comprensible.
- source_word: inward parts
  choice: lo más íntimo
  rationale: Comunica naturalmente el examen divino del interior humano sin introducir una anatomía literal ajena al uso español corriente.
- source_word: place of lies
  choice: lugar de la mentira
  rationale: Preserva la imagen espacial y su posible carga simbólica sin explicarla ni identificarla doctrinalmente.
theological_decisions:
- issue: «Hate his soul» en la cita atribuida a Jesús
  choice: «aborrece su alma»
  alternative: «aborrece su vida» o «se aborrece a sí mismo»
  rationale: Se conserva «alma» porque el tratado desarrolla una teología del alma y el testimonio emplea expresamente ese término; una paráfrasis como «vida» resolvería prematuramente su alcance.
- issue: Dignidad para la salvación
  choice: «quién es digno de la salvación»
  alternative: «quién merece la salvación»
  rationale: «Digno» conserva la afirmación del testimonio sin convertirla en una explicación sistemática acerca del mérito, la gracia o sus relaciones.
- issue: Identidad de las citas bíblicas
  choice: Conservar las formas citadas por el tratado
  alternative: Sustituirlas por el texto de una versión bíblica canónica moderna
  rationale: Las citas presentan formas compuestas o divergentes; normalizarlas borraría evidencia sobre el uso textual del autor antiguo.
- issue: «Holy people»
  choice: «como a un pueblo santo»
  alternative: «como pueblo santo»
  rationale: La preposición «como» conserva la relación sintáctica ambigua del testimonio, que puede indicar la manera en que Dios los escucha o su reconocimiento como pueblo santo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan las repeticiones retóricas, las imágenes de la ola, el pan y el agua de aflicción, y las asperezas significativas de las citas. Los corchetes se mantienen como señales textuales; la elipsis entre corchetes representa una laguna. Dado que la revisión directa del copto está pendiente, el borrador se apoya de manera provisional en el testimonio inglés público suministrado y evita afirmaciones filológicas que ese testimonio no permite comprobar.
