review_pass:
  verdict: revise
  source_fidelity: La traducción propuesta no corresponde al texto griego proporcionado. El griego de este testimonio contiene únicamente tres versículos y narra la guerra vinculada con Siquem, la muerte del rey desde el muro, la toma de los cautivos y la posterior campaña contra Aretán. Los vv. 4–8, Belisat y las notas asociadas no están en la fuente suministrada. Además, el griego dice que Judá y sus hermanos se formaron para combatir, no que Judá lo hiciera individualmente; no incluye «mayor»; y sitúa la liberación de los cautivos en Aretán, no en Hebrón.
  naturalness: 'La revisión usa español latinoamericano actual y sobrio: «nos formamos para combatir», «una ciudad fortificada», «amenazaba con matarnos» y «liberamos a los cautivos». Conserva el tono narrativo militar sin añadir explicaciones.'
  terminology: «Cautivos» traduce αἰχμαλωσία en su referencia colectiva a personas capturadas. «Áretán» es una transliteración española prudente de Ἀρετάν; se mantiene una nota mínima sobre la identificación incierta del lugar. No corresponde conservar terminología, nombres ni notas de los vv. 4–8 ausentes de la fuente.
  issues:
  - severity: high
    issue: El borrador incorpora los vv. 4–8 y material narrativo que no aparece en el texto griego fuente.
    rationale: La fuente provista para Testament of Judah 4 termina en el v. 3. Deben eliminarse los contenidos no atestiguados aquí, incluidos Belisat, Jacob, el gigante y la visión del ángel.
  - severity: high
    issue: El v. 1 añade «mayor» y cambia el sujeto de la formación de combate a primera persona singular.
    rationale: El griego suministrado no contiene un comparativo y usa el participio plural παραταξάμενοι, referido a Judá junto con sus hermanos.
  - severity: high
    issue: Los vv. 2–3 sustituyen acontecimientos y topónimos de la fuente.
    rationale: El griego dice que Judá mató al rey desde el muro y que el grupo tomó todos los cautivos; después fueron a Áretán y liberaron a los cautivos. No menciona Hebrón ni la huida de «los demás».
  - severity: medium
    issue: Las tres notas existentes están ancladas a contenido ausente de la fuente.
    rationale: Deben retirarse para que las anclas y las notas correspondan al pasaje traducido.
  - severity: low
    issue: «Rey de reyes» contradice incluso la auditoría inglesa más reciente, aunque el problema principal es que el versículo entero no está en esta fuente.
    rationale: La auditoría citada dice «king of all the kings», mientras que el borrador dice «rey de reyes».
  revised_text: '1. Después de esto, tuvimos una guerra al sur, la de Siquem; y, al formarnos para combatir junto con mis hermanos, perseguimos a mil hombres, matamos a doscientos de ellos y a cuatro reyes.


    2. Yo subí al muro, maté a su rey y tomamos a todos los cautivos.


    3. Al día siguiente fuimos a Áretán[a], una ciudad fortificada que nos amenazaba con matarnos. Pero Gad y yo nos acercamos por el este de la ciudad, mientras que Rubén y Leví lo hicieron por el oeste; así liberamos a los cautivos.'
  revised_footnotes:
  - marker: a
    text: La identificación de Áretán es incierta; se conserva una transliteración del nombre griego.
    reason: textual_variant
  revision_rationale: Se reemplaza íntegramente el texto para ajustarlo al testimonio griego suministrado, que comprende solo los vv. 1–3. Se preservan los sujetos plurales, la secuencia narrativa, los topónimos y la referencia colectiva a los cautivos. La expresión inicial se traduce sin introducir el comparativo «mayor», ausente del griego provisto. Se elimina todo contenido y toda nota dependiente de versículos no presentes.
