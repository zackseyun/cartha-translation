revisions:
- from: Porque si alguien bebe vino hasta embriagarse, este le trastorna la mente con pensamientos impuros, le enardece el cuerpo hacia el placer de la inmoralidad sexual, comete el pecado y no se avergüenza.
  to: Porque, si alguien bebe vino hasta embriagarse, el vino trastorna tu mente con pensamientos impuros, enciende el cuerpo para la inmoralidad sexual, en busca de placer, y comete el pecado y no se avergüenza.
  rationale: Se restituye «tu mente» para reflejar el σου del griego, aun cuando produzca la misma alternancia de persona presente en la fuente. Se repite «el vino» para un español más natural y para conservar el sujeto gramatical de toda la serie verbal, incluida la formulación final semánticamente difícil. La frase preposicional se ajusta para distinguir la orientación hacia la inmoralidad sexual y hacia el placer, sin eliminar la aspereza ni imponer un referente humano en los últimos verbos.
