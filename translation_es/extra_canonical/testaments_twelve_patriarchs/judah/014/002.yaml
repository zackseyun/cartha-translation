base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: es
  text: Porque, si alguien bebe vino hasta embriagarse, el vino trastorna tu mente con pensamientos impuros, enciende el cuerpo para la inmoralidad sexual, en busca de placer, y comete el pecado y no se avergüenza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: hasta embriagarse
  rationale: Expresa de manera natural el resultado o grado indicado por la frase griega, sin condenar en sí mismo todo consumo de vino.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: con pensamientos impuros
  rationale: «Pensamientos» comunica aquí los razonamientos o ideas interiores; «impuros» conserva la fuerza moral de ῥυπαροῖς con lenguaje actual y digno.
- source_word: συνταράσσει τὸν νοῦν
  choice: le trastorna la mente
  rationale: Refleja la agitación intensa de συνταράσσει y vierte νοῦς como «mente», en consonancia con el contexto cognitivo.
- source_word: εἰς πορνείαν
  choice: de la inmoralidad sexual
  rationale: πορνεία tiene alcance sexual general en este contexto; «inmoralidad sexual» evita reducirlo injustificadamente a un solo acto.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: le enardece el cuerpo hacia el placer
  rationale: Conserva la imagen de calentar o inflamar el cuerpo y la orientación hacia el placer, con una formulación comprensible.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: comete el pecado
  rationale: Traducción directa que mantiene el artículo y la progresión desde el deseo hasta el acto pecaminoso.
theological_decisions:
- issue: Referente del sujeto implícito en «comete el pecado y no se avergüenza»
  choice: Se conserva el sujeto tácito, dejando que el contexto lo vincule naturalmente con la persona que bebe.
  alternative: Hacer explícito «el cuerpo comete el pecado» o «la persona comete el pecado».
  rationale: El griego cambia de τὸ σῶμα, neutro, a verbos en singular sin pronombre expreso; explicitar «el cuerpo» impondría una lectura gramaticalmente problemática, mientras que añadir «la persona» eliminaría una leve ambigüedad del original.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvo la cadena retórica del original y se evitó seguir mecánicamente el cambio pronominal de la consulta inglesa («your»), pues el griego comienza con el indefinido «alguien» y luego usa segunda persona en «tu mente», una irregularidad textual. La versión española regulariza la referencia mediante pronombres de objeto («le») para lograr claridad sin alterar el sentido.
