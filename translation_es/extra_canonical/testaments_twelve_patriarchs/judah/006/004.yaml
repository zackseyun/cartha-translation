  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/004.yaml
  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: es
  text: Y cuando llegamos a la ciudad[a], sus mujeres hacían rodar piedras cuesta abajo contra nosotros desde la cima de la montaña sobre la cual estaba la ciudad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El texto fuente tiene τῇ τῇ πόλει, con el artículo dativo repetido, evidentemente por un descuido del copista. La traducción lee una sola vez τῇ πόλει: «a la ciudad».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: hacían rodar
  rationale: El imperfecto expresa una acción continua o repetida; «hacían rodar» comunica que las mujeres lanzaban las piedras haciéndolas rodar desde lo alto.
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: piedras cuesta abajo contra nosotros
  rationale: λίθους significa «piedras», y ἐπί con acusativo señala dirección hostil. «Cuesta abajo» hace explícito el movimiento indicado por el relieve y «contra nosotros» conserva el sentido hostil.
- source_word: κορυφῆς τοῦ ὄρους
  choice: la cima de la montaña
  rationale: κορυφή designa la parte más alta o cumbre, y ὄρος una montaña; «la cima de la montaña» es preciso y natural en español.
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: sobre la cual estaba la ciudad
  rationale: La cláusula relativa identifica la montaña como el lugar donde se encontraba la ciudad, sin añadir que estuviera necesariamente en la cima.
theological_decisions: []
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la acción durativa del imperfecto y la relación topográfica entre la montaña y la ciudad.
