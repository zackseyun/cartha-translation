  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: es
  text: Y, después de que yo oculté a Simeón y a los demás[a] a espaldas de ellos[b], tomamos la altura y destruimos por completo también esta ciudad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκρύψας
  choice: después de ocultar
  rationale: El participio aoristo expresa una acción táctica previa a la toma de la altura. «Ocultar» comunica de manera natural la idea de esconder deliberadamente.
- source_word: τὸν τε καὶ Συμεών
  choice: a Simeón y a los demás
  rationale: La expresión griega es elíptica y empareja a Simeón con otra persona o grupo no nombrado. Esta formulación produce un español comprensible sin ocultar la dificultad textual, que se explica en la nota.
- source_word: ἐξωπίσθεν
  choice: a espaldas de ellos
  rationale: El adverbio raro indica una posición por detrás o desde la retaguardia. La frase expresa con claridad la colocación de la fuerza oculta detrás de los adversarios.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: tomamos la altura
  rationale: El verbo con genitivo significa apoderarse o tomar posesión, y el adjetivo sustantivado designa una altura o posición elevada. «Tomamos la altura» es una expresión militar natural y concisa.
- source_word: ἐξωλοθρεύσαμεν
  choice: destruimos por completo
  rationale: El compuesto intensivo expresa destrucción total. «Por completo» conserva esa intensidad sin recurrir a un término innecesariamente técnico.
- source_word: καὶ ταύτην τὴν πόλιν
  choice: también esta ciudad
  rationale: El segundo καί tiene fuerza aditiva y presenta esta ciudad como otra más dentro de una serie de conquistas.
