  register: Español latinoamericano neutral, actual y digno. Se conserva el tono de relato militar con una sintaxis fluida. «Maquir» sigue la forma bíblica española habitual; «espada poderosa» mantiene la elevación de la frase griega sin volverla artificiosa.
