  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/003.yaml
  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: es
  text: Pero los de Maquir volvieron a atacarnos al quinto día; y, arremetiendo contra ellos con una espada poderosa[a], los vencimos y los matamos antes de que subieran la cuesta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El verbo griego προσδίδωσι («añade», «se entrega» o «se lanza») está en tercera persona singular y tiempo presente, lo cual resulta anómalo dentro de una narración en primera persona plural y tiempo pasado. Puede deberse a una abreviación o alteración del texto. La traducción expresa el sentido ofensivo que parece exigir el contexto, sin corregir explícitamente el griego.
    reason: textual_variant
  - marker: b
    text: La expresión griega dice literalmente «subir la subida». Se refiere a una cuesta, un paso o un acceso ascendente que los enemigos intentaban alcanzar o escalar.
    reason: lexical_note
lexical_decisions:
- source_word: πάλιν
  choice: volvieron a
  rationale: Expresa de manera natural en español que se trató de un nuevo ataque.
- source_word: ἐπῆλθον ἡμῶν
  choice: atacarnos
  rationale: ἐπέρχομαι con referencia personal en este contexto militar indica una acometida hostil; «atacarnos» comunica esa fuerza directamente.
- source_word: προσδίδωσι πρὸς αὐτούς
  choice: arremetiendo contra ellos
  rationale: La forma verbal es sintácticamente anómala, pero el contexto parece describir una acción ofensiva dirigida contra el enemigo. Esta traducción vierte el sentido aparente sin reconstruir expresamente el griego.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: con una espada poderosa
  rationale: El instrumental ἐν indica el medio, κραταιός denota fuerza o poder y μάχαιρα significa espada. La expresión conserva el tono marcial elevado.
- source_word: περιγινόμεθα αὐτῶν
  choice: los vencimos
  rationale: περιγίγνομαι con genitivo significa imponerse o prevalecer sobre alguien. «Los vencimos» es claro, natural y adecuado para la narración militar.
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: subieran la cuesta
  rationale: La construcción con acusativo cognado significa literalmente «subir la subida» y alude a una pendiente, acceso o paso ascendente. «Subieran la cuesta» conserva el movimiento y resulta idiomático.
