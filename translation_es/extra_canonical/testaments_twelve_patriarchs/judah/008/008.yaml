  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: es
  text: 'Y yo dije: «Te enviaré un cabrito del rebaño». Ella respondió: «¿Me darás una prenda hasta que me lo envíes?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este intercambio no aparece de manera directa en el texto griego α de esta sección, que pasa de la pregunta de Tamar a la entrega de las prendas. La formulación sigue la tradición más amplia de Génesis 38:17.
    reason: Documentar con transparencia que la lectura procede de la tradición de Génesis que informa la capa inglesa del proyecto y no de palabras conservadas en el testimonio griego α citado.
lexical_decisions:
- source_word: 'English consultation: “kid from the flock” (cf. Genesis 38:17)'
  choice: un cabrito del rebaño
  rationale: Traducción natural y precisa de la tradición de Génesis 38 que subyace al texto inglés; «cabrito» identifica una cría de cabra y «del rebaño» conserva la procedencia expresada.
- source_word: 'English consultation: “pledge” (cf. Greek ἀρραβών in Genesis 38:17 LXX)'
  choice: una prenda
  rationale: «Prenda» expresa una garantía entregada temporalmente y encaja con los objetos solicitados después; evita el sentido principalmente matrimonial que «compromiso» tendría hoy.
- source_word: 'English consultation: “until you send it”'
  choice: hasta que me lo envíes
  rationale: El pronombre masculino singular retoma claramente «cabrito» y mantiene la condición temporal de la pregunta.
theological_decisions:
- issue: Ausencia del intercambio en el testimonio griego α de Charles
  choice: Conservar el intercambio de la capa inglesa del proyecto, pero señalar explícitamente su procedencia textual en una nota
  alternative: Omitir el versículo o presentarlo como si tuviera respaldo directo en el griego α
  rationale: La edición fuente indicada no contiene un equivalente griego directo para este intercambio; la nota mantiene la honestidad textual sin borrar el contenido asignado al versículo del proyecto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el diálogo directo y conciso. «Prenda» se usa en su sentido de garantía, comprensible por el contexto y aclarable por los objetos mencionados en la continuación.
