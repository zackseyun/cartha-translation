  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: es
  text: Por tanto, hijos míos, cuídense de la inmoralidad sexual y del amor al dinero, y escuchen a Judá, el padre de ustedes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: cuídense
  rationale: Comunica de manera natural el imperativo medio de mantenerse en guardia y apartarse de algo.
- source_word: πορνείας
  choice: inmoralidad sexual
  rationale: Expresa el sentido amplio de conducta sexual ilícita sin limitarlo a una sola práctica.
- source_word: φιλαργυρίας
  choice: amor al dinero
  rationale: Traduce de forma directa y comprensible el apego o afán por el dinero.
- source_word: ἀκούσατε
  choice: escuchen
  rationale: Conserva el imperativo y, en este contexto exhortativo, puede implicar prestar atención y obedecer sin explicitar más de lo que dice el griego.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: a Judá, su padre
  rationale: Mantiene la autorreferencia en tercera persona y la aposición del original.
