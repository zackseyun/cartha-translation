id: T12P.JUD.8.20
reference: Testament of Judah 8:20
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πιὼν τὸν οἶνον οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν. 7. Πολλὴ γὰρ τῷ πίνοντι οἶνον, τέκνα μου,
  language: Greek
  note: Greek from Charles XIV.6-7a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: es
  text: Después de beber vino, no respeté el mandamiento de Dios y tomé por esposa a una mujer cananea. Porque quien bebe vino necesita mucha prudencia, hijos míos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ᾐσχύνθην
  choice: no respeté
  rationale: Aunque el verbo suele expresar vergüenza, aquí, con «el mandamiento de Dios» como objeto, comunica no mostrar la debida consideración o reverencia. «No respeté» conserva el sentido contextual en español natural sin introducir una desobediencia más explícita que el griego.
- source_word: γυναῖκα Χαναναίαν
  choice: por esposa a una mujer cananea
  rationale: Expresa de manera natural la construcción «tomé una mujer cananea» y conserva tanto su origen étnico como su función matrimonial.
- source_word: Πολλὴ ... τῷ πίνοντι οἶνον
  choice: quien bebe vino necesita mucha prudencia
  rationale: El texto transmitido parece elíptico tras πολλή y el sustantivo que completa la idea no aparece en el fragmento griego citado. La formulación sigue la comprensión contextual de la edición inglesa auditada, pero evita fingir una correspondencia léxica completa.
- source_word: τέκνα μου
  choice: hijos míos
  rationale: Es la forma vocativa natural y digna para la exhortación paterna en español latinoamericano neutral.
theological_decisions:
- issue: Naturaleza de la falta contra el mandamiento divino
  choice: no respeté el mandamiento de Dios
  alternative: desobedecí el mandamiento de Dios
  rationale: Se mantiene la imagen semántica de falta de respeto o reverencia presente en αἰσχύνομαι, sin resolverla automáticamente como mera desobediencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el tono confesional y exhortativo del padre a sus hijos. La segunda oración se presenta con fluidez, teniendo en cuenta que el texto griego proporcionado queda sintácticamente incompleto después de πολλή.
