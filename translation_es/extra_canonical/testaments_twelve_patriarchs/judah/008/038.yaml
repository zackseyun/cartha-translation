source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: es
  text: Así pues, el sacerdocio de Dios es superior al reino terrenal, a menos que, por causa de pecados, se aleje del Señor y sea dominado por el reino terrenal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: supera
  rationale: Expresa de forma natural la superioridad indicada por el verbo griego, sin añadir la comparación entre cielo y tierra que no aparece en el texto fuente presentado.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: el sacerdocio de Dios
  rationale: Conserva tanto el sentido institucional de ἱερατεία como el genitivo, cuya relación exacta no debe explicitarse más de lo necesario.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: al reino terrenal
  rationale: Traduce la comparación regida por ὑπερέχει y mantiene el contraste entre sacerdocio y poder regio terrestre.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se aparte del Señor
  rationale: Comunica la idea de caer o separarse de la relación con el Señor en español claro, sin imponer una formulación doctrinal técnica.
- source_word: κυριευθῇ
  choice: quede bajo el dominio
  rationale: Reproduce la voz pasiva y el sentido de ser sometido o dominado por el reino terrenal.
theological_decisions:
- issue: Superioridad condicionada del sacerdocio
  choice: Mantener la cláusula «a menos que» aplicada al sacerdocio
  alternative: Presentar la superioridad como absoluta o aplicar la caída únicamente a sacerdotes individuales
  rationale: La sintaxis griega formula una excepción real a la superioridad del sacerdocio cuando este se aparta del Señor por los pecados y es dominado por el reino terrenal.
- issue: Sujeto de los verbos en singular
  choice: Entender «el sacerdocio» como sujeto colectivo de «se aparte» y «quede»
  alternative: Introducir explícitamente «el sacerdote» o «los sacerdotes»
  rationale: El antecedente gramatical es ἡ ἱερατεία; conservar el sujeto institucional evita añadir una identificación no expresada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue prioritariamente el griego suministrado. No se incorpora la comparación «como el cielo es más alto que la tierra» de la capa inglesa, porque no figura en este texto griego. «Así pues» refleja el valor inferencial de Οὕτως γὰρ sin forzar una conexión causal extensa.
