revisions:
- from: Y sé que, por causa de estas dos cosas,[a] mi linaje quedará expuesto a la perdición de la inmoralidad sexual. Incluso harán cambiar a hombres sabios de entre mis hijos y harán que el reino de Judá sea reducido, el cual me dio el Señor por haber obedecido a mi padre.[b]
  to: Y sé que, a causa de estas dos cosas,[a] mi descendencia llegará a la ruina por la inmoralidad sexual. Hasta desviarán a hombres sabios de entre mis hijos y harán que el reino de Judá se reduzca, el cual el Señor me dio por obedecer a mi padre.[b]
  rationale: La revisión prioriza el texto griego suministrado (Charles XVII.2 α), en vez de la reformulación exhortativa del inglés POB. Mejora dos calcos poco naturales, conserva la amplitud de πορνεία y no identifica el sujeto plural de los verbos «desviarán» y «harán», aunque el contexto permite relacionarlo con «estas dos cosas». «Hasta» reproduce de forma moderada el matiz enfático de καίγε.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:50:51Z'
review_pass:
  verdict: revise
  source_fidelity: El borrador sigue el griego de manera general y, correctamente, no reproduce la paráfrasis exhortativa más amplia del audit trail inglés. Sin embargo, «harán cambiar a hombres sabios» no comunica con claridad el sentido de ἀλλοιώσουσιν, que en este contexto es alterar, desviar o corromper. «Quedará expuesto a la perdición de la inmoralidad sexual» es excesivamente literal y poco idiomático; el genitivo sigue siendo algo comprimido, pero puede expresarse naturalmente como ruina por inmoralidad sexual.
  naturalness: «Mi descendencia llegará a la ruina por la inmoralidad sexual» y «desviarán a hombres sabios» son formulaciones actuales, claras y de registro digno en español latinoamericano. Se conserva el sujeto plural no expresado y la fuerza enfática de καίγε con «hasta».
  terminology: «Inmoralidad sexual» es una opción amplia y adecuada para πορνεία. «Descendencia» comunica τὸ γένος μου con mayor naturalidad que «linaje» en esta predicción. «Desviarán» evita afirmar una forma concreta de corrupción no especificada por el griego.
  issues:
  - severity: medium
    issue: «Harán cambiar a hombres sabios» es una traducción poco natural y semánticamente imprecisa de ἀλλοιώσουσι.
    rationale: La expresión española resulta incompleta —no indica en qué cambiarían— y no refleja bien el valor contextual de alterar o desviar a personas sabias.
  - severity: medium
    issue: «Quedará expuesto a la perdición de la inmoralidad sexual» es demasiado calco y resulta oscura.
    rationale: La construcción griega εἰς ἀπώλειαν πορνείας es densa, pero el español puede expresar prudentemente la relación como ruina por inmoralidad sexual, sin restringir πορνεία a prostitución ni introducir un agente específico.
  - severity: low
    issue: La nota b presenta una literalidad útil, pero la redacción principal puede ser más directa.
    rationale: «Por obedecer a mi padre» conserva la relación causal o circunstancial de ἐν ὑπακοῇ πατρός μου sin la perífrasis pesada «por haber obedecido».
  revised_text: Y sé que, a causa de estas dos cosas,[a] mi descendencia llegará a la ruina por la inmoralidad sexual. Hasta desviarán a hombres sabios de entre mis hijos y harán que el reino de Judá se reduzca, el cual el Señor me dio por obedecer a mi padre.[b]
  revised_footnotes:
  - marker: a
    text: 'Es decir, los dos males mencionados en el contexto: el oro y la belleza de las mujeres.'
    reason: Aclara el referente de «estas dos cosas» sin incorporarlo al texto, donde el griego solo usa la expresión anafórica.
  - marker: b
    text: 'Literalmente: «en la obediencia de mi padre».'
    reason: Registra la expresión griega compacta; la traducción puede entenderse como que el reino fue dado a Judá en relación con su obediencia a su padre.
  revision_rationale: La revisión prioriza el texto griego suministrado (Charles XVII.2 α), en vez de la reformulación exhortativa del inglés POB. Mejora dos calcos poco naturales, conserva la amplitud de πορνεία y no identifica el sujeto plural de los verbos «desviarán» y «harán», aunque el contexto permite relacionarlo con «estas dos cosas». «Hasta» reproduce de forma moderada el matiz enfático de καίγε.
