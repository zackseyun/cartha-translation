id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: es
  text: Y sé que, a causa de estas dos cosas,[a] mi descendencia llegará a la ruina por la inmoralidad sexual. Hasta desviarán a hombres sabios de entre mis hijos y harán que el reino de Judá se reduzca, el cual el Señor me dio por obedecer a mi padre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Es decir, los dos males mencionados en el contexto: el oro y la belleza de las mujeres.'
    reason: Aclara el referente de «estas dos cosas» sin incorporarlo al texto, donde el griego solo usa la expresión anafórica.
  - marker: b
    text: 'Literalmente: «en la obediencia de mi padre».'
    reason: Registra la expresión griega compacta; la traducción puede entenderse como que el reino fue dado a Judá en relación con su obediencia a su padre.
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  choice: por causa de estas dos cosas
  rationale: Conserva la referencia anafórica a los dos males mencionados en el contexto, sin introducir en el versículo una identificación que el texto griego aquí no repite.
- source_word: τὸ γένος μου
  choice: mi linaje
  rationale: Expresa la descendencia o estirpe de Judá de manera natural y digna.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: quedará expuesto a la perdición de la inmoralidad sexual
  rationale: Mantiene tanto la idea de ruina como el vínculo genitivo, algo comprimido y ambiguo, con πορνεία; evita limitar el término únicamente a la prostitución.
- source_word: ἀλλοιώσουσι
  choice: harán cambiar
  rationale: Refleja el sentido causativo de alterar o pervertir sin especificar un sujeto que el griego deja implícito.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: harán que ... sea reducido
  rationale: Reproduce la construcción causativa y la idea de disminución o debilitamiento del reino.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: por haber obedecido a mi padre
  rationale: Comunica en español corriente la relación entre el don del reino y la obediencia de Judá a su padre.
theological_decisions:
- issue: Identidad del sujeto implícito de ἀλλοιώσουσι y ποιήσουσιν
  choice: Mantener el sujeto indeterminado con «harán»
  alternative: Identificar como sujetos al oro y la belleza de las mujeres, o a agentes humanos concretos
  rationale: La forma verbal permite inferir el referente por el contexto, pero este versículo no lo nombra de forma explícita; conservar la indeterminación evita resolver silenciosamente la tensión sintáctica.
- issue: Relación entre πορνείας y ἀπώλειαν
  choice: «la perdición de la inmoralidad sexual»
  alternative: «perecerá por inmoralidad sexual»
  rationale: La alternativa es más fluida, pero fija claramente una relación causal. La formulación escogida conserva mejor la densidad y posible ambigüedad del genitivo griego.
- issue: Fundamento de la concesión del reino
  choice: «por haber obedecido a mi padre»
  alternative: «en obediencia a mi padre»
  rationale: Se entiende como referencia a la obediencia de Judá, sin añadir una explicación doctrinal ni eliminar la relación expresada en el original.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. La traducción sigue prioritariamente el texto griego proporcionado, no la paráfrasis exhortativa del inglés de consulta. Se preservan la referencia contextual de «estas dos cosas», el sujeto verbal implícito y la expresión genitiva poco común vinculada con la inmoralidad sexual.
