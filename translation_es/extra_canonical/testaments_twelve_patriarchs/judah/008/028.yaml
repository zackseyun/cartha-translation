  rationale: Se reemplaza «Porque» por «Pues» como conector causal natural en el flujo exhortativo; ambos son posibles para Ὅτι. Se precisa τὸ διαβούλιον como «la capacidad de deliberar del alma» y ἐλεῆσαι como «tener misericordia», sin añadir una interpretación teológica. «Nadie» reproduce de forma idiomática el uso genérico de ἄνδρα en esta construcción y evita un masculino genérico menos natural.
