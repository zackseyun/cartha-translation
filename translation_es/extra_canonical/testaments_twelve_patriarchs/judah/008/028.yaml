source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: es
  text: Pues estas cosas apartan a una persona de la ley de Dios, ciegan la capacidad de deliberar del alma, enseñan arrogancia y no permiten que nadie tenga misericordia de su prójimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφιστᾷ
  choice: apartan
  rationale: Expresa de manera natural la idea de alejar o separar a alguien de la ley de Dios.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: el discernimiento del alma
  rationale: «Discernimiento» comunica la facultad interior de deliberar o juzgar; evita reducir la expresión a una mera inclinación emocional.
- source_word: ὑπερηφανίαν
  choice: arrogancia
  rationale: Término actual y claro para la soberbia o altivez censurada por el texto.
- source_word: ἐλεῆσαι
  choice: compadecerse
  rationale: Conserva el sentido de mostrar misericordia o compasión hacia otra persona.
- source_word: τὸν πλησίον αὐτοῦ
  choice: su prójimo
  rationale: Equivalente bíblico natural que mantiene la dimensión ética y relacional del griego.
theological_decisions:
- issue: Relación entre estas conductas y la ley de Dios
  choice: «apartan a la persona de la ley de Dios»
  alternative: «hacen que uno se aparte de la ley de Dios»
  rationale: Mantiene la causalidad atribuida a «estas cosas» sin añadir una explicación doctrinal sobre el modo exacto en que ocurre el apartamiento.
- issue: Naturaleza de τὸ διαβούλιον τῆς ψυχῆς
  choice: «el discernimiento del alma»
  alternative: «la inclinación del alma»
  rationale: El sustantivo griego se relaciona con deliberación, designio o capacidad de juicio. «Discernimiento» conserva esa amplitud mejor que «inclinación», aunque la expresión sigue siendo metafórica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la metáfora de cegar una facultad interior y el término bíblico «prójimo». La repetición griega de καί se presenta como una enumeración fluida en español.
