source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: es
  text: Pero si sobrepasa el límite, el espíritu del engaño invade su mente y hace que el borracho diga obscenidades, quebrante la ley y no sienta vergüenza, sino que se jacte de su deshonra y considere que es algo bueno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: sobrepasa el límite
  rationale: Conserva la imagen de cruzar una frontera o medida establecida, con expresión natural en español.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: se introduce en su mente
  rationale: Expresa la entrada o irrupción del espíritu en la mente sin añadir la idea de ataque, que no aparece explícitamente en el griego.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: el espíritu del engaño
  rationale: «Engaño» comunica aquí el extravío producido por el error y concuerda con el contexto moral.
- source_word: τὸν μέθυσον
  choice: el borracho
  rationale: Designa directamente a la persona ebria, manteniendo el tono franco del original.
- source_word: αἰσχρορρημονεῖν
  choice: diga obscenidades
  rationale: Traduce el acto de hablar de manera vergonzosa u obscena con lenguaje actual y claro.
- source_word: παρανομεῖν
  choice: quebrante la ley
  rationale: Mantiene el componente explícito de actuar contra la ley, en vez de reducirlo a una transgresión genérica.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: se jacte de su deshonra
  rationale: Reproduce tanto la jactancia como la condición deshonrosa que constituye su objeto.
- source_word: νομίζειν εἶναι καλόν
  choice: la considere algo bueno
  rationale: Sigue el griego, que dice «bueno» o «bello», y evita importar «gloria» de la capa inglesa.
theological_decisions:
- issue: Agencia del «espíritu del engaño»
  choice: se introduce en su mente
  alternative: ataca su mente
  rationale: La traducción conserva la personificación y la agencia espiritual, pero no intensifica ἐμβάλλει hasta convertirlo inequívocamente en un ataque.
- issue: Sentido de παρανομεῖν
  choice: quebrante la ley
  alternative: transgreda
  rationale: El compuesto griego contiene una referencia a la ley; se conserva esa dimensión sin precisar qué ley se tiene en vista.
- issue: Valoración final de la deshonra
  choice: la considere algo bueno
  alternative: la considere una gloria
  rationale: καλόν significa «bueno», «bello» o «noble» según el contexto; «gloria» no corresponde directamente al texto fuente y resolvería la expresión de forma indebida.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la progresión causal del griego y su lenguaje moral directo, sin suavizar «borracho» ni «obscenidades». No se requieren notas al pie.
