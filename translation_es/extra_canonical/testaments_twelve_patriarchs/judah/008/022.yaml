revisions:
- from: Pero si sobrepasa el límite, el espíritu del engaño se introduce en su mente y hace que el borracho diga obscenidades, quebrante la ley y no sienta vergüenza, sino que se jacte de su deshonra y la considere algo bueno.
  to: Pero si sobrepasa el límite, el espíritu del engaño invade su mente y hace que el borracho diga obscenidades, quebrante la ley y no sienta vergüenza, sino que se jacte de su deshonra y considere que es algo bueno.
  rationale: Se realizan dos ajustes mínimos para reflejar con mayor fidelidad la irrupción activa del espíritu en la mente y para aclarar la valoración final de la deshonra. Se conserva la ambigüedad del antecedente de «si sobrepasa el límite» y no se añade ninguna identificación de la ley ni interpretación teológica adicional.
