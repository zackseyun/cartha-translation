id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: es
  text: 'Pues el ángel del Señor me dijo: «El Señor lo[a] escogió por encima de ti para que se acerque a él, coma a su mesa y le ofrezca las primicias de los manjares de los hijos de Israel. Pero tú serás rey de Jacob».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Es decir, a Leví, según el contexto; el griego dice literalmente «a él».
    reason: Aclara el referente sin reemplazar en el texto la forma pronominal de la fuente.
  - marker: b
    text: Este testigo griego termina con «rey de Jacob»; no incluye «con él» ni «como un león».
    reason: Documenta una diferencia significativa frente a la formulación de la capa inglesa del proyecto y evita importar la imagen del león desde otra tradición contextual.
lexical_decisions:
- source_word: Αὐτόν
  choice: lo
  rationale: Conserva el pronombre masculino del griego sin sustituirlo directamente por el nombre Leví; el referente se aclara en nota por el contexto.
- source_word: ὑπὲρ σὲ
  choice: por encima de ti
  rationale: Expresa la preferencia comparativa de la elección sin introducir la idea temporal «antes que tú».
- source_word: προσεγγίζειν αὐτῷ
  choice: para que se acerque a él
  rationale: Mantiene el sentido cultual y relacional de acercarse al Señor.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: coma a su mesa
  rationale: Traduce de manera idiomática la expresión griega, cuyo sentido es participar de la mesa del Señor.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: las primicias de los manjares
  rationale: «Primicias» conserva el término cultual, y «manjares» comunica alimentos valiosos o deleitosos sin recargar la frase.
- source_word: βασιλεὺς Ἰακώβ
  choice: rey de Jacob
  rationale: Reproduce de cerca el genitivo griego y conserva su formulación dinástica o corporativa.
theological_decisions:
- issue: Identidad del escogido
  choice: Mantener el pronombre «lo» y aclarar en nota que el contexto señala a Leví
  alternative: Insertar «Leví» directamente en el texto
  rationale: El testigo griego presentado dice literalmente «a él»; explicitar el nombre en el cuerpo resolvería una referencia que el texto deja contextual.
- issue: Cláusula final sobre el reinado de Judá
  choice: «Pero tú serás rey de Jacob»
  alternative: «Y tú serás rey con él, como un león»
  rationale: 'La alternativa de la versión inglesa incorpora elementos que no aparecen en este testigo griego: no figuran ni «con él» ni el símil del león.'
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean pronombres divinos en minúscula conforme al uso editorial moderno. La sintaxis conserva el paralelismo de las funciones sacerdotales y el contraste final con la función real.
