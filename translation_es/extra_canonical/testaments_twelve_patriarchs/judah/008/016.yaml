    issue: «engaño» para πλάνη
    rationale: πλάνη denota principalmente error, extravío o desviación. «Engaño» puede sugerir más específicamente una acción engañosa o fraude, ausente del griego.
  - severity: low
    issue: Mayúscula tras dos puntos
    rationale: «No se embriaguen» debe ir en minúscula conforme a la puntuación española, salvo que se adopte deliberadamente formato de cita independiente.
  revised_text: 'Y ahora les digo, hijos míos: no se embriaguen con vino, porque el vino desvía la mente de la verdad, enciende la ira del deseo y conduce los ojos al extravío.'
