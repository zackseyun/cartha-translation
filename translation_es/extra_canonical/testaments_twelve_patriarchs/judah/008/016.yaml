source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: es
  text: 'Y ahora les digo, hijos míos: no se embriaguen con vino, porque el vino desvía la mente de la verdad, enciende la ira del deseo y conduce los ojos al extravío.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθύσκεσθε οἴνῳ
  choice: se embriaguen con vino
  rationale: Reproduce de manera natural la prohibición de embriagarse expresada por el presente imperativo griego.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: desvía la mente de la verdad
  rationale: Conserva la imagen de torcer o apartar el entendimiento respecto de la verdad sin recargar la expresión.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: enciende la ira del deseo
  rationale: Mantiene la construcción difícil y la tensión entre ira y deseo, sin corregirla hacia una interpretación más específica.
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: lleva los ojos al engaño
  rationale: Preserva la personificación y la referencia concreta a los ojos; «engaño» comunica aquí extravío o error.
theological_decisions:
- issue: Alcance de la prohibición relativa al vino
  choice: No se embriaguen con vino
  alternative: No beban vino
  rationale: El verbo griego prohíbe la embriaguez, no afirma de manera inequívoca una prohibición absoluta del consumo.
- issue: Relación entre ὀργή e ἐπιθυμία
  choice: la ira del deseo
  alternative: la pasión del deseo
  rationale: ὀργή significa primariamente «ira»; se conserva el genitivo ambiguo en vez de resolverlo como una doctrina psicológica concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «les» por naturalidad regional amplia y se conserva el vocativo afectuoso «hijos míos». La sintaxis mantiene el paralelismo exhortativo del griego.
