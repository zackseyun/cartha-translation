id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: es
  text: 'Pero ella me mandó decir: «Estoy embarazada del hombre a quien pertenecen estas cosas. Reconoce, pues, de quién son el anillo, el bastón y la diadema».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε πρός με λέγουσα
  choice: me mandó decir
  rationale: Expresa naturalmente el envío de un mensaje y conserva el sentido del griego sin añadir que fue secreto.
- source_word: ἐν γαστρὶ ἔχω
  choice: estoy embarazada
  rationale: Equivalencia idiomática clara y actual de la expresión griega «tener en el vientre».
- source_word: ἐπίγνωθι
  choice: reconoce
  rationale: Conserva el imperativo de identificar o reconocer a partir de los objetos presentados.
- source_word: δακτύλιος
  choice: anillo
  rationale: Es el significado directo del término y corrige la sustitución por «cinturón» presente en la capa inglesa.
- source_word: ῥάβδος
  choice: bastón
  rationale: Representa de manera natural el objeto personal designado por el griego, sin imponer una función específica como cetro.
- source_word: διάδημα
  choice: diadema
  rationale: Mantiene el término griego y su posible valor de insignia, sin reducirlo necesariamente a una corona.
theological_decisions:
- issue: Identidad del padre mediante prendas u objetos personales
  choice: Conservar la formulación «del hombre a quien pertenecen estas cosas» y la orden de reconocerlos
  alternative: Explicitar que Judá es el padre o dueño de los objetos
  rationale: El griego presenta la prueba y la inferencia sin formular explícitamente la conclusión; la traducción preserva esa progresión narrativa.
- issue: Armonización con otras versiones o pasajes
  choice: Traducir la lista griega «anillo, bastón y diadema»
  alternative: Adoptar «bastón, cinturón y diadema» de la versión inglesa del proyecto
  rationale: La fuente griega indicada para este versículo contiene δακτύλιος, ῥάβδος y διάδημα; no corresponde importar aquí ζώνη de otra recensión o contexto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue prioritariamente la fuente griega. Se omiten «mientras la sacaban» y «secretamente» porque no aparecen en el texto griego proporcionado; también se conserva el orden original de los tres objetos.
