reference: Testament of Judah 8:42
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: es
  text: Y he sabido todos los males que cometerán en [los últimos días].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «los últimos días» aparece entre corchetes en la edición griega de Charles, que la señala como una interpolación cristiana.
    reason: Explicar de manera transparente los corchetes editoriales conservados en el texto principal.
lexical_decisions:
- source_word: ἔγνωκα
  choice: he llegado a saber
  rationale: El perfecto expresa un conocimiento adquirido cuyos efectos permanecen; evita introducir la lectura de la recensión β acerca de haber leído los libros de Enoc.
- source_word: ὅσα κακὰ
  choice: cuántas maldades
  rationale: Conserva el sentido exclamativo o cuantitativo de ὅσα y el carácter amplio de κακά, sin añadir actos específicos ausentes del texto α.
- source_word: ποιήσετε
  choice: cometerán
  rationale: En español natural, «cometer maldades» expresa adecuadamente ποιεῖν κακά; la forma futura plural se dirige a los descendientes implícitos por el contexto.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: en los últimos días
  rationale: Equivalencia formal y natural de la expresión escatológica griega.
theological_decisions:
- issue: Lectura de la recensión α frente a la β
  choice: Traducir únicamente «Y he llegado a saber»
  alternative: «He leído en los libros de Enoc el justo»
  rationale: La fuente griega indicada pertenece al texto α y no contiene la referencia a Enoc; incorporar la lectura β alteraría el testimonio textual seleccionado.
- issue: Contenido de las maldades futuras
  choice: Mantener la formulación general «cuántas maldades cometerán»
  alternative: Añadir que los hijos se apartarán del Señor y cometerán toda maldad y aflicción ante él
  rationale: Esos detalles de la versión inglesa no aparecen en esta lectura α; no deben importarse al texto traducido.
- issue: Cláusula marcada como interpolación cristiana
  choice: Conservar «en los últimos días» entre corchetes
  alternative: Omitir la cláusula o integrarla sin señal editorial
  rationale: La edición de Charles la marca como interpolación, y la política del proyecto exige preservarla; los corchetes hacen visible su situación textual sin resolverla doctrinalmente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue la lectura griega α suministrada, no la expansión de la recensión β reflejada en el inglés de consulta. El sujeto plural implícito se vierte como «cometerán» sin añadir «sus hijos», pues no aparece expresamente en este fragmento.
