    issue: Construcción «quise darle a Selá»
    rationale: En español, esta construcción normalmente presenta a Selá como destinatario de «dar», mientras que δοῦναι αὐτῇ τὸν Σηλώμ tiene a Tamar como destinataria y a Selá como el dado. Debe expresarse «darle a Tamar a Selá por esposo» o equivalente.
  - severity: low
    issue: Referencia nominal de la madre
    rationale: «La madre de él» es comprensible, pero «la madre de Selá» resulta más idiomático y evita una cadena pronominal innecesaria.
