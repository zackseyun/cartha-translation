source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: es
  text: También quise darle a Tamar a Selá por esposo, pero la madre de Selá no lo permitió. Ella obró mal porque Tamar no era de las mujeres cananeas, como ella misma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «porque [ella] no era de las hijas de los cananeos, como también ella misma». Por el contexto, la primera referencia es Tamar y la segunda es la madre de Selá.
    reason: Aclara los referentes que el griego deja implícitos o repite de forma potencialmente ambigua.
lexical_decisions:
- source_word: Ἤθελον
  choice: quise
  rationale: Expresa de manera natural la voluntad o intención de Judá en este contexto narrativo.
- source_word: τὸν Σηλὼμ
  choice: a Selá
  rationale: Se emplea la forma española tradicional del nombre bíblico; el acusativo lo presenta como aquello que Judá quería dar a Tamar.
- source_word: δοῦναι αὐτῇ
  choice: darle a Selá
  rationale: Conserva la formulación concisa del griego sin añadir explícitamente «por esposo», aunque el contexto matrimonial lo implica.
- source_word: οὐκ ἀφῆκεν
  choice: no lo permitió
  rationale: Equivalencia idiomática de «no dejó [que ocurriera]».
- source_word: Ἐπονηρεύσατο
  choice: actuó con malicia
  rationale: Mantiene el juicio moral del verbo sin precisar indebidamente si se trató de engaño, intriga u otra forma concreta de mala conducta.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: de las mujeres cananeas
  rationale: El modismo «hijas de los cananeos» designa naturalmente a mujeres pertenecientes a ese pueblo.
theological_decisions:
- issue: Diferencia entre el texto griego y la capa inglesa de consulta
  choice: 'Seguir el relato atestiguado en el texto griego proporcionado: Judá quiso dar Selá a Tamar, pero la madre de Selá se opuso por el origen no cananeo de Tamar.'
  alternative: Seguir el texto inglés, según el cual Judá mismo retuvo a Selá por temor a que muriera y después reconoció un juicio del Señor.
  rationale: La traducción debe partir de la evidencia en la lengua original. El contenido de la versión inglesa suministrada no corresponde a este texto griego y no debe reemplazarlo.
- issue: Referente del sujeto implícito en «οὐκ ἦν»
  choice: Explicitar «Tamar» en el texto para lograr claridad narrativa.
  alternative: 'Conservar el pronombre ambiguo: «porque ella no era…».'
  rationale: En el contexto, el contraste «como sí lo era ella misma» identifica a la madre de Selá como cananea y señala a Tamar como la mujer que no lo era; la nota registra que el griego usa pronombres implícitos.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la concisión narrativa del griego y su valoración moral, sin incorporar el material distinto presente en la versión inglesa de consulta.
