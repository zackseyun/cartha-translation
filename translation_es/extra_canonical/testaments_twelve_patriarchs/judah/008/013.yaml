    issue: «Había cometido inmoralidad sexual» atenúa y generaliza ἐκπεπόρνευκε.
    rationale: El verbo griego remite específicamente a prostituirse o ser acusada de ello; «inmoralidad sexual» puede abarcar conductas que el original no expresa.
  - severity: low
    issue: El ancla de la nota cronológica aparece al final de toda la cita.
    rationale: Debe colocarse junto a «algunos días», el segmento al que se refiere, para que el lector identifique con precisión la variante.
  revised_text: 'Y después de algunos días[a] se supo que Tamar se había prostituido y estaba embarazada. Al oírlo, dije: «Sáquenla y que sea quemada».'
