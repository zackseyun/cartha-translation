  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: es
  text: 'Y después de algunos días[a] se supo que Tamar se había prostituido y estaba embarazada. Al oírlo, dije: «Sáquenla y que sea quemada».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto griego dice «después de algunos días»; otros relatos de esta tradición indican «unos tres meses después».
    reason: Aclara la variante cronológica sin sustituir la lectura del texto griego base.
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  choice: después de algunos días
  rationale: Sigue el texto griego de la recensión α y no incorpora los «tres meses» procedentes de la tradición de Génesis.
- source_word: ἐκπεπόρνευκε
  choice: había cometido inmoralidad sexual
  rationale: Expresa de manera natural y digna la acusación sexual del verbo, sin añadir la idea específica de prostitución profesional.
- source_word: ἐν γαστρὶ ἔχει
  choice: estaba embarazada
  rationale: Equivalente actual y claro del modismo griego «tener en el vientre».
- source_word: καυθήτω
  choice: que sea quemada
  rationale: Conserva la fuerza del imperativo pasivo griego y su ambigüedad sobre si se trata de ejecución por fuego.
theological_decisions:
- issue: Adiciones narrativas de la tradición de Génesis y de la versión inglesa
  choice: No incluir «tres meses», «tu nuera», «miren» ni la explicación sobre la arrogancia y la ira
  alternative: Incorporar esos detalles siguiendo Génesis 38 o la capa inglesa de consulta
  rationale: El texto griego suministrado dice «después de algunos días» y no contiene esas expresiones; la traducción prioriza la evidencia de la fuente original.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el carácter severo y lacónico del discurso de Judá, sin importar las expansiones explicativas de la versión inglesa.
