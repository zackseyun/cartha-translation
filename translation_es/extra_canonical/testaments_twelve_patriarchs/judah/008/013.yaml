review_pass:
  verdict: revise
  source_fidelity: El borrador sigue correctamente el texto griego de la recensión α en «después de algunos días», la noticia sobre Tamar, el embarazo y la orden de sacarla para quemarla. Sin embargo, «inmoralidad sexual» es más general que ἐκπεπόρνευκε, que expresa la acusación de haberse prostituido o de conducta sexual presentada como prostitución.
  naturalness: El español es claro, actual y de registro sobrio. «Se había prostituido» es natural en este contexto narrativo y conserva mejor la fuerza acusatoria del griego que la formulación abstracta «había cometido inmoralidad sexual».
  terminology: 'Conviene traducir ἐκπεπόρνευκε con «se había prostituido», sin afirmar que Tamar ejerciera necesariamente la prostitución como ocupación: en el pasaje funciona como una acusación. «Estaba embarazada» y «que sea quemada» son adecuados.'
  issues:
