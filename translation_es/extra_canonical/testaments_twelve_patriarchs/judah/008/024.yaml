  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: es
  text: Porque di mi bastón, es decir, el sostén de mi tribu; mi cinturón, es decir, mi poder; y mi diadema, es decir, la gloria de mi reino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: bastón
  rationale: Conserva la imagen concreta de una vara que sirve de apoyo y permite entender la explicación simbólica que sigue.
- source_word: στήριγμα
  choice: sostén
  rationale: Expresa aquello que da apoyo y estabilidad, y mantiene la relación semántica con «bastón».
- source_word: ζώνην
  choice: cinturón
  rationale: Es el equivalente actual y natural de la prenda ceñida a la cintura, sin perder su función simbólica.
- source_word: δύναμιν
  choice: poder
  rationale: Representa el sentido amplio de capacidad, fuerza o poder sin limitarlo innecesariamente a la fuerza física.
- source_word: διάδημα
  choice: diadema
  rationale: Mantiene el término regio específico del griego y su asociación explícita con la realeza.
- source_word: δόξαν τῆς βασιλείας μου
  choice: la gloria de mi reino
  rationale: Traducción directa que conserva tanto la dignidad regia como la formulación posesiva del original.
theological_decisions:
- issue: Sentido simbólico de los tres objetos entregados
  choice: Conservar las explicaciones internas del texto sin identificar históricamente los objetos o imponerles una interpretación doctrinal adicional.
  alternative: Explicitar una lectura profética, mesiánica o moral de cada objeto.
  rationale: El griego mismo ofrece las equivalencias simbólicas y no exige resolverlas mediante una tradición interpretativa externa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preserva la estructura tripartita y explicativa del griego. Se omite repetir «mi» ante «cinturón» únicamente donde la coordinación española lo permite con naturalidad, pero se conserva ante «diadema» mediante el artículo por continuidad sintáctica.
