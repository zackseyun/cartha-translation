  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: es
  text: Por tanto, no se eleven por encima de Leví ni se alcen contra mí; más bien, honren plenamente al Señor en ambos y, entre los seres humanos, acérquense a Leví.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo no tiene una contraparte directa en el texto griego α citado. Su redacción combina el llamado a no exaltarse de 21:1 con el lenguaje de «acercarse» de 21:5. La frase «honren plenamente al Señor en ambos» no tiene equivalente directo en ese testimonio; en 21:6, el texto α continúa con una comparación con el mar.
    reason: Advertir con transparencia que el versículo es una composición del proyecto y distinguir sus elementos atestiguados de la adición no documentada.
lexical_decisions:
- source_word: ὑψοῦσθε (tema reconstruido de XXI.1)
  choice: se eleven
  rationale: Conserva la imagen de exaltarse o ponerse por encima de alguien, sin reducirla únicamente a orgullo interior.
- source_word: προσεγγίζειν (XXI.5)
  choice: acérquense
  rationale: Reproduce de manera natural el sentido de aproximarse o vincularse estrechamente con Leví.
- source_word: in both (sin equivalente directo en el testimonio α)
  choice: en ambos
  rationale: Mantiene la ambigüedad del texto del proyecto, probablemente referida a Leví y Judá, sin resolverla mediante una interpretación añadida.
- source_word: among men (sin equivalente directo identificado)
  choice: entre los seres humanos
  rationale: Expresa el alcance humano general en español latinoamericano neutral y evita que «hombres» se entienda solo como varones.
theological_decisions:
- issue: Relación y precedencia entre Judá y Leví
  choice: No se eleven por encima de Leví ni se alcen contra mí
  alternative: No se consideren superiores a Leví ni se opongan a mí
  rationale: La formulación elegida conserva la metáfora de exaltación y la tensión entre ambas figuras, sin imponer una jerarquía confesional posterior.
- issue: Frase «honren plenamente al Señor en ambos»
  choice: Conservarla con una nota de crítica textual
  alternative: Omitirla por carecer de contraparte directa en el texto α
  rationale: Forma parte del texto del proyecto solicitado, pero debe señalarse con transparencia que es una adición sin correspondencia directa en el testimonio griego indicado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa el plural de exhortación «ustedes» implícito en las formas verbales. «En ambos» se conserva deliberadamente ambiguo, y la falta de una contraparte directa en el testimonio α se documenta en nota.
