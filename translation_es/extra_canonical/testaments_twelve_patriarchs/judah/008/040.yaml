  source_fidelity: 'El texto español reproduce fielmente el enunciado inglés del proyecto: conserva la prohibición doble, la expresión deliberadamente ambigua «en ambos» y el llamado a acercarse a Leví. Puesto que el propio contexto confirma que este versículo es una composición parafrástica sin contraparte directa completa en el testimonio griego α, la nota es indispensable y correctamente lo declara.'
  naturalness: La redacción es clara, idiomática y de registro digno en español latinoamericano neutral. «No se eleven por encima de Leví» conserva bien la imagen de exaltación; «se alcen contra mí» transmite naturalmente la oposición. Aunque «en ambos» resulta necesariamente elíptico, conservar esa elipsis evita introducir una identificación interpretativa ausente del texto del proyecto.
  terminology: «Leví» y «Señor» son formas convencionales y apropiadas. «Entre los seres humanos» comunica el alcance inclusivo de “among men” sin restringirlo a varones y sin alterar el tono. La nota emplea una descripción textual prudente, sin atribuir autoridad indebida a la composición.
