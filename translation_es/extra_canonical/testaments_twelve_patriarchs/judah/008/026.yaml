source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: es
  text: Y el ángel de Dios me mostró que las mujeres dominan al rey y se enseñorean del pobre. Al rey le quitan la gloria; al hombre, la fuerza; y al pobre, hasta el más pequeño apoyo con que cuenta en su pobreza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: dominan al rey
  rationale: El verbo κρατέω con genitivo expresa control o dominio sobre alguien; no contiene la idea temporal de «para siempre».
- source_word: κατακυριεύουσιν
  choice: se enseñorean de
  rationale: Conserva la fuerza intensiva del verbo, que indica ejercer dominio sobre otra persona, en un registro digno y comprensible.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: al hombre, la fuerza
  rationale: ἀνήρ significa aquí literalmente «hombre»; el griego transmitido no incluye un adjetivo equivalente a «fuerte».
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: hasta el más mínimo sustento en su pobreza
  rationale: στήριγμα es aquello que sostiene o sirve de apoyo; «sustento» resulta natural en relación con el pobre. ἐλάχιστον intensifica la pequeñez de ese recurso.
theological_decisions:
- issue: Alcance de la afirmación sobre las mujeres
  choice: Mantener la afirmación general y contundente del texto
  alternative: Atenuarla como referencia exclusiva a ciertas mujeres o a un episodio particular
  rationale: La formulación griega usa el plural genérico αἱ γυναῖκες y no ofrece en este versículo una restricción explícita; traducirla sin añadir calificativos preserva la tensión del pasaje.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el paralelismo retórico de las tres pérdidas mediante punto y coma y elipsis verbal. No se incorpora «para siempre», pues carece de apoyo en el texto griego citado, ni «hombre fuerte», ya que el sustantivo ἀνήρ aparece sin modificador.
