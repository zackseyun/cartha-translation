review_pass:
  verdict: revise
  source_fidelity: El borrador refleja correctamente la triple estructura del griego y evita dos expansiones sin apoyo presentes en el texto inglés («para siempre» y «hombre fuerte»). «Dominan al rey» y «se enseñorean del pobre» transmiten adecuadamente κρατοῦσι y κατακυριεύουσιν. Conviene ajustar la última frase para expresar con mayor precisión que se trata del exiguo apoyo con que cuenta el pobre, no de un sustento situado genéricamente «en su pobreza».
  naturalness: El español es claro, sobrio y apto para un registro proverbial o admonitorio. «Se enseñorean» conserva el tono elevado sin resultar incomprensible. La reformulación final mejora la fluidez y hace más explícita la relación posesiva e instrumental implícita en «apoyo de su pobreza».
  terminology: «Ángel de Dios», «gloria», «fuerza», «pobre» y «rey» son elecciones adecuadas. «Apoyo» corresponde de manera más directa a στήριγμα que «sustento», aunque ambos son posibles según el contexto.
  issues:
  - severity: low
    issue: Matiz de τὴν πτωχείας ἐλάχιστον στήριγμα
    rationale: «Hasta el más mínimo sustento en su pobreza» es comprensible, pero puede sugerir simplemente alimento o provisión durante la pobreza. στήριγμα designa apoyo, sostén o recurso; una formulación como «el más pequeño apoyo con que cuenta en su pobreza» conserva mejor ese matiz y el superlativo ἐλάχιστον.
  revised_text: Y el ángel de Dios me mostró que las mujeres dominan al rey y se enseñorean del pobre. Al rey le quitan la gloria; al hombre, la fuerza; y al pobre, hasta el más pequeño apoyo con que cuenta en su pobreza.
