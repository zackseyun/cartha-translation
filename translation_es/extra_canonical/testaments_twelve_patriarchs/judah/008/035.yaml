source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: es
  text: 'Y ahora, hijos míos, les ordeno: amen a Leví para que permanezcan, y no se enaltezcan contra él, para que no sean completamente destruidos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: les ordeno
  rationale: Expresa el mandato solemne y directo del verbo griego.
- source_word: ἀγαπᾶτε
  choice: amen
  rationale: Imperativo presente que exhorta a mantener una actitud de amor hacia Leví.
- source_word: διαμείνητε
  choice: permanezcan
  rationale: Conserva el sentido de continuar, subsistir o perdurar sin reducirlo exclusivamente a «vivir».
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: se engrían contra él
  rationale: Comunica la idea de alzarse con orgullo frente a Leví y mantiene el matiz de hostilidad.
- source_word: ἐξολοθρευθῆτε
  choice: sean exterminados por completo
  rationale: Refleja la fuerza del verbo pasivo, que indica destrucción total.
theological_decisions:
- issue: La relación entre amar a Leví y permanecer
  choice: Se conserva la construcción final «para que permanezcan».
  alternative: «para que vivan»
  rationale: El griego διαμείνητε admite la idea de persistir o continuar existiendo; «permanezcan» preserva esa amplitud y no define de manera innecesaria la naturaleza de la consecuencia.
- issue: La advertencia contra exaltarse sobre Leví
  choice: «no se engrían contra él»
  alternative: «no se exalten por encima de él»
  rationale: La formulación elegida expresa orgullo y oposición sin precisar si se trata de autoridad religiosa, social o política, cuestión que el texto no resuelve.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» implícito en las formas verbales. La puntuación tras «les ordeno» presenta con naturalidad los dos mandatos que siguen.
