revisions:
- from: 'Y ahora, hijos míos, les ordeno: amen a Leví, para que permanezcan, y no se engrían contra él, no sea que sean exterminados por completo.'
  to: 'Y ahora, hijos míos, les ordeno: amen a Leví para que permanezcan, y no se enaltezcan contra él, para que no sean completamente destruidos.'
  rationale: La revisión conserva la estructura final y la amplitud semántica del original, pero reemplaza una expresión española poco idiomática por una formulación natural que representa el sentido de exaltarse contra Leví. Se ajusta además la última cláusula para mayor fluidez sin atenuar la destrucción total indicada por el griego.
