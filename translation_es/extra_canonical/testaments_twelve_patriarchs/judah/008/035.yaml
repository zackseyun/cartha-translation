  timestamp: '2026-07-13T05:46:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'El borrador refleja bien la secuencia y las relaciones del griego: el mandato de amar a Leví, la finalidad expresada por ἵνα διαμείνητε y la advertencia introducida por ἵνα μή. «Permanezcan» conserva adecuadamente la amplitud de διαμείνητε y no debe restringirse a «vivan».'
  naturalness: «Engreírse contra alguien» resulta poco idiomático en español latinoamericano actual. «Enaltecerse contra él» expresa de modo más directo el alzarse orgullosamente contra Leví. También conviene evitar la repetición algo pesada de «exterminados por completo».
  terminology: «Leví» es la forma española establecida del nombre. «Amen» y «les ordeno» mantienen el tono exhortativo y solemne del pasaje. «Completamente destruidos» comunica la intensidad de ἐξολοθρευθῆτε sin añadir una interpretación doctrinal o histórica.
  issues:
  - severity: medium
    issue: «no se engrían contra él»
    rationale: Aunque intenta comunicar orgullo hostil, la construcción «engreírse contra» no es natural ni clara en el español meta. El griego ἐπαίρεσθε ἐπ᾽ αὐτόν se reproduce mejor como «no se enaltezcan contra él», que conserva tanto la autoexaltación como la oposición.
  - severity: low
    issue: «sean exterminados por completo»
    rationale: Es fiel en sentido general, pero «completamente destruidos» suena más natural y mantiene la fuerza intensiva del verbo griego sin la redundancia estilística de «exterminados por completo».
  revised_text: 'Y ahora, hijos míos, les ordeno: amen a Leví para que permanezcan, y no se enaltezcan contra él, para que no sean completamente destruidos.'
