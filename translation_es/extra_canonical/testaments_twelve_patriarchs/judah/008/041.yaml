  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: es
  text: Pues por causa de él, el Señor escogerá de entre ustedes la realeza, y de Leví el sacerdocio, para que el Señor sea para todas las naciones y para el linaje de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo no tiene una correspondencia directa en el texto griego α. Su formulación reúne motivos de Testamento de Judá 22:2-3 («hasta que llegue la salvación de Israel») y 24:6 («juzgar y salvar a todos los que invocan al Señor»); por tanto, debe leerse como una síntesis homilética del proyecto, no como traducción de un único versículo griego conservado.
    reason: Distinguir con transparencia la síntesis editorial de la evidencia textual directa y evitar atribuir al testigo α palabras que no contiene.
lexical_decisions:
- source_word: ἡ βασιλεία / βασιλεία (tema sintetizado; sin correspondencia directa en α)
  choice: la realeza
  rationale: Expresa la institución y dignidad real sin confundirla con un territorio; sigue de cerca el sentido del texto inglés del proyecto.
- source_word: ἱερωσύνη (tema sintetizado; sin correspondencia directa en α)
  choice: el sacerdocio
  rationale: Es la equivalencia natural y tradicional para la función o institución sacerdotal atribuida a Leví.
- source_word: πάντα τὰ ἔθνη / πάντας (trasfondo de XXIV.6)
  choice: todas las naciones
  rationale: Conserva el alcance universal del motivo subyacente sin restringirlo a un grupo concreto.
- source_word: γένος Ἰσραήλ (formulación del proyecto; sin correspondencia directa en α)
  choice: el linaje de Israel
  rationale: «Linaje» comunica descendencia o estirpe y mantiene la distinción frente a «todas las naciones».
theological_decisions:
- issue: Atribución de la realeza a Judá y del sacerdocio a Leví
  choice: Mantener ambas atribuciones como aparecen en la formulación del proyecto
  alternative: Suprimir la oración por carecer de correspondencia directa en el testigo α
  rationale: La entrada solicitada contiene una síntesis homilética ya establecida, pero la nota deja explícito que no es traducción de un versículo griego único.
- issue: Finalidad expresada por «para que el Señor sea para...»
  choice: Conservar la formulación abierta y algo elíptica
  alternative: Interpretar como «para que el Señor salve a todas las naciones» o «reine sobre todas las naciones»
  rationale: El texto fuente directo no permite decidir entre presencia, pertenencia, señorío o salvación; explicitar una de esas lecturas resolvería indebidamente la ambigüedad teológica.
translation_notes:
  register: Español latinoamericano neutro, actual y digno. Se emplean «ustedes», «realeza», «sacerdocio» y «linaje» por claridad general. La construcción «el Señor sea para» se conserva deliberadamente para no imponer una interpretación ausente de la evidencia griega directa.
