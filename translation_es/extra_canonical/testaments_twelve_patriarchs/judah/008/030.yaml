id: T12P.JUD.8.30
reference: Testament of Judah 8:30
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: es
  text: Impide que se ofrezcan sacrificios a Dios y no se acuerda de bendecir a Dios. No escucha a un profeta cuando habla y se irrita ante las palabras de piedad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμποδίζει
  choice: Impide
  rationale: El verbo está en voz activa y significa poner obstáculos o impedir; evita convertirlo en el pasivo «se ve impedido» de la consulta inglesa.
- source_word: εὐλογίαν Θεοῦ οὐ μνημονεύει
  choice: no se acuerda de bendecir a Dios
  rationale: Conserva la lectura verbal implícita en la expresión y coincide con el sentido contextual de omitir la alabanza o bendición dirigida a Dios.
- source_word: οὐκ ἀκούει
  choice: No escucha
  rationale: Representa directamente la negación de escuchar o prestar oído, sin añadir la circunstancia «cuando oye» de la consulta inglesa.
- source_word: λόγους εὐσεβείας
  choice: las palabras de piedad
  rationale: Traduce λόγους como «palabras» y εὐσεβείας como la cualidad religiosa de reverencia o devoción, sin imponer una formulación doctrinal específica.
- source_word: προσοχθίζει
  choice: se irrita ante
  rationale: Expresa desagrado, indignación o irritación frente a algo; no añade por separado dos reacciones emocionales.
theological_decisions:
- issue: Objeto y agente de «impide»
  choice: «Impide los sacrificios a Dios»
  alternative: «Se ve impedido de ofrecer sacrificios a Dios»
  rationale: El griego ἐμποδίζει es activo y tiene como objeto «sacrificios de/a Dios»; la versión conserva esa sintaxis aunque el sujeto de la oración dependa del contexto precedente.
- issue: Sentido de εὐσέβεια
  choice: «piedad»
  alternative: «devoción» o «reverencia a Dios»
  rationale: «Piedad» preserva el alcance amplio del término griego, que puede abarcar reverencia religiosa y conducta devota.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene el sujeto tácito del griego y el paralelismo de las cuatro acciones. No se reproduce la expansión interpretativa inglesa «se ofende y se enoja», pues el griego presenta un solo verbo.
