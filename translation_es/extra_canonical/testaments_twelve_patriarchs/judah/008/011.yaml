source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: es
  text: Envié a alguien a recoger las prendas dadas en garantía, pero no la encontré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπεμψα
  choice: Envié a alguien
  rationale: El verbo significa «envié» y deja implícita a la persona enviada; «a alguien» hace natural la expresión en español sin identificar indebidamente al mensajero.
- source_word: τοῦ λαβεῖν
  choice: para recoger
  rationale: El infinitivo articular expresa propósito. «Recoger» comunica aquí la acción de recuperar los objetos entregados previamente.
- source_word: τοὺς ἀρραβῶνας
  choice: las prendas dadas en garantía
  rationale: En este contexto, el plural se refiere a objetos entregados como garantía, no a un compromiso matrimonial; la formulación evita la ambigüedad moderna de «arras».
- source_word: Καὶ οὐχ εὗρον αὐτήν
  choice: pero no la encontró
  rationale: Aunque la forma griega εὗρον coincide gráficamente con la primera persona singular, el referente femenino αὐτήν y el contexto favorecen entender que el enviado no encontró a la mujer. «Pero» expresa el contraste natural entre el propósito y el resultado.
theological_decisions: []
translation_notes:
  register: Español latinoamericano neutral, natural y digno. Se traduce únicamente el texto griego proporcionado; no se incorpora la mención del cabrito ni la pregunta a la gente del lugar presentes en la tradición de Génesis y en la capa inglesa, pues no aparecen en este pasaje griego α.
