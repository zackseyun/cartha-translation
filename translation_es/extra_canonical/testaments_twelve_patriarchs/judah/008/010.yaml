source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: es
  text: Y cuando me uní a ella, quedó embarazada. Pero yo no sabía lo que había hecho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: me uní a ella
  rationale: Expresa de manera digna y comprensible el eufemismo griego para la relación sexual, sin añadir detalles ausentes del texto fuente.
- source_word: συνελήφθη
  choice: quedó embarazada
  rationale: En este contexto, el verbo significa que ella concibió; esta formulación es natural en español latinoamericano.
- source_word: Ἀγνοῶν
  choice: no sabía
  rationale: Conserva la afirmación de desconocimiento o falta de conciencia de Judá sin especificar una causa que esta porción griega no menciona.
- source_word: ὃ ἐποίησα
  choice: lo que había hecho
  rationale: Reproduce directamente el objeto ambiguo de la falta de conocimiento y mantiene la secuencia temporal.
theological_decisions:
- issue: Causa del desconocimiento de Judá
  choice: No especificarla
  alternative: Añadir «a causa del vino»
  rationale: La fuente griega proporcionada afirma que Judá no sabía lo que había hecho, pero no atribuye aquí ese desconocimiento al vino. Añadir la causa dependería de material contextual no incluido en este segmento.
- issue: Reconocimiento de la mujer al marcharse
  choice: No incluirlo
  alternative: Añadir «tampoco la reconocí cuando me fui»
  rationale: Esa afirmación aparece en la capa inglesa de consulta, pero no en las palabras griegas suministradas para este segmento; por ello no se incorpora al texto principal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la concisión del griego y su ambigüedad respecto de las circunstancias del acto y del desconocimiento posterior.
