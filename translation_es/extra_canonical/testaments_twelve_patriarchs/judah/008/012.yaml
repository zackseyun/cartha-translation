  verdict: revise
  source_fidelity: 'El borrador sigue de cerca el griego proporcionado: conserva la negación de que hubiera una prostituta en la puerta, su llegada desde otro lugar, la breve permanencia sentada y la creencia de que nadie sabía que Judá había entrado adonde ella estaba. Correctamente no incorpora las expansiones de la capa inglesa, que no están en el texto griego citado. Conviene expresar de modo más natural la referencia al acceso urbano como «puerta de la ciudad».'
  naturalness: El español es claro y de registro adecuado. «En la puerta no había» resulta algo menos preciso y natural en este contexto que «no había ninguna prostituta junto a la puerta de la ciudad». «La gente de la ciudad» evita la leve rigidez de «los habitantes de la ciudad» sin alterar el sentido.
  terminology: «Prostituta» es una solución contextual razonable para la forma griega problemática, siempre con nota. No debe añadirse «sagrada», «cultual» ni «extranjera», pues el texto griego suministrado no lo exige.
  issues:
  - severity: low
    issue: La localización «en la puerta» puede sonar como si estuviera dentro de una puerta física.
    rationale: τῇ πύλῃ, en narrativa antigua, se refiere normalmente a la puerta o acceso de la ciudad; «junto a la puerta de la ciudad» lo comunica con naturalidad sin introducir una interpretación doctrinal.
  - severity: low
    issue: La nota afirma una diferencia con la capa inglesa de consulta, pero «referencia adicional a una extranjera» debe formularse como rasgo de esa capa, no como variante del griego.
    rationale: El griego dado habla de que la mujer llegó «de otro lugar», no la designa con el sustantivo «extranjera». La nota revisada mantiene esta distinción con mayor precisión.
