source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: es
  text: 'También la gente de la ciudad decía: «No había ninguna prostituta junto a la puerta de la ciudad», porque ella había llegado de otro lugar y se había sentado allí solo por poco tiempo. Y pensaban que nadie sabía que yo había entrado adonde ella estaba.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El término griego traducido «prostituta» presenta una dificultad textual. Además, el texto griego proporcionado dice que pensaban que nadie sabía que Judá había entrado adonde ella estaba; no incluye que Judá reconociera haber pecado, que guardara silencio por vergüenza ni la designación de una «extranjera» que aparece en la capa inglesa de consulta.
    reason: Señala la incertidumbre textual sin resolverla de manera indebida y documenta con precisión la divergencia sustancial respecto de la traducción inglesa.
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: los habitantes de la ciudad
  rationale: Expresa con naturalidad el sentido de «los que estaban en la ciudad».
- source_word: ἐν τῇ πύλῃ
  choice: en la puerta
  rationale: Conserva la referencia a la puerta de la ciudad como lugar público, sin añadir una ubicación no explícita.
- source_word: τελεσικόμενον
  choice: prostituta
  rationale: La forma griega transmitida es problemática en este contexto; la escena y la tradición textual subyacente apuntan a una mujer dedicada a la prostitución. Se adopta una expresión directa y comprensible, señalando la dificultad en nota.
- source_word: πρὸς βραχὺ ἐκαθέσθη
  choice: solo se había sentado allí por poco tiempo
  rationale: Reproduce tanto la brevedad de la estancia como la acción de sentarse.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: yo había entrado adonde ella estaba
  rationale: Mantiene el modo indirecto del griego y no explicita más de lo que dice la fuente.
theological_decisions:
- issue: La versión inglesa añade que Judá comprendió que había pecado, guardó silencio y sintió vergüenza.
  choice: No incorporar esas afirmaciones en el texto principal.
  alternative: 'Seguir la redacción inglesa: «Y comprendí que había pecado... porque me avergonzaba».'
  rationale: Esas ideas no aparecen en el texto griego proporcionado para Charles XII.9-10. La traducción se fundamenta primero en la evidencia de la lengua original y evita presentar como texto una expansión interpretativa.
- issue: Identidad y condición de la mujer
  choice: Traducir el término contextual como «prostituta» sin precisar una función cultual.
  alternative: «prostituta sagrada» o «mujer consagrada».
  rationale: El vocablo transmitido es incierto y el pasaje no permite establecer con seguridad una función religiosa; especificarla resolvería indebidamente una ambigüedad textual y teológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el desarrollo narrativo del griego, con sintaxis clara para lectores generales y sin ampliar el contenido a partir de la versión inglesa.
