revisions:
- from: 'Además, los habitantes de la ciudad decían: «En la puerta no había ninguna prostituta», pues ella había llegado de otro lugar y solo se había sentado allí por poco tiempo. Y ellos pensaban que nadie sabía que yo había entrado adonde ella estaba.[a]'
  to: 'También la gente de la ciudad decía: «No había ninguna prostituta junto a la puerta de la ciudad», porque ella había llegado de otro lugar y se había sentado allí solo por poco tiempo. Y pensaban que nadie sabía que yo había entrado adonde ella estaba.[a]'
  rationale: La revisión conserva el contenido y la ambigüedad del griego, mejora la idiomaticidad latinoamericana y precisa la imagen de la puerta urbana. Se mantiene la nota porque la lección griega transmitida para «prostituta» es difícil y porque el inglés aportado contiene material que no figura en la fuente griega citada.
