source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: es
  text: Así que, embriagado con vino, no la reconocí; y su belleza me engañó por la apariencia de su adorno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  choice: Así que, embriagado por el vino
  rationale: Conserva la relación consecutiva de οὖν y expresa de manera natural el estado indicado por el participio aoristo pasivo μεθυσθείς.
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: no la reconocí
  rationale: Traduce directamente ἐπιγινώσκω como reconocer o identificar, sin ampliar el sentido.
- source_word: ἠπάτησέ με
  choice: me engañó
  rationale: Mantiene el sentido directo de ἀπατάω. El griego no menciona explícitamente la mente, por lo que se evita añadirla.
- source_word: τὸ κάλλος αὐτῆς
  choice: su belleza
  rationale: Equivalencia clara y natural del sustantivo κάλλος.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: mediante la apariencia de sus adornos
  rationale: σχῆμα puede referirse a apariencia, forma o presentación, mientras κόσμησις alude al arreglo o adorno. La formulación conserva esa relación sin reducirla a una moda específica.
theological_decisions: []
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la confesión en primera persona y la causalidad del original sin introducir explicaciones psicológicas ausentes del griego.
