lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: me desvié hacia ella
  rationale: Conserva el sentido concreto de apartarse o desviarse en dirección a la mujer, sin añadir motivos no expresados.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Déjame entrar a ti
  rationale: Reproduce el eufemismo sexual del griego de manera comprensible y digna, manteniendo su formulación indirecta.
- source_word: Τί μοι δώσεις;
  choice: ¿Qué me darás?
  rationale: Traducción directa de la pregunta griega; no se añade la cláusula explicativa presente en el texto inglés porque no figura en esta fuente griega.
