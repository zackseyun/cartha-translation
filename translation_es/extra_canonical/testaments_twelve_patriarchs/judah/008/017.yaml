id: T12P.JUD.8.17
reference: Testament of Judah 8:17
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: es
  text: Porque el espíritu de la inmoralidad sexual tiene al vino como servidor para dar placer a la mente, pues estas dos cosas también le quitan al ser humano el entendimiento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: el espíritu de la inmoralidad sexual
  rationale: Conserva la personificación de πνεῦμα y expresa πορνεία con una formulación actual, amplia y comprensible, sin restringirla a un solo acto sexual.
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: tiene al vino como servidor
  rationale: 'Reproduce la relación metafórica del griego: el vino actúa como auxiliar o servidor del espíritu de inmoralidad sexual.'
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: para el placer de la mente
  rationale: Mantiene tanto la finalidad expresada por πρὸς como el sentido mental de νοῦς, sin añadir una interpretación psicológica o moral no explícita.
- source_word: ἀφιστῶσι τὴν διάνοιαν
  choice: apartan el entendimiento
  rationale: ἀφίστημι expresa separar o desviar; «apartan» conserva esa imagen, mientras que «el entendimiento» comunica aquí la facultad de discernir de διάνοια.
- source_word: τοῦ ἀνθρώπου
  choice: del ser humano
  rationale: Traducción inclusiva y semánticamente exacta del uso genérico de ἄνθρωπος.
theological_decisions:
- issue: Agencia atribuida al «espíritu de la inmoralidad sexual»
  choice: Se conserva literalmente como una entidad personificada
  alternative: Traducirlo como «la inclinación a la inmoralidad sexual»
  rationale: El texto griego dice πνεῦμα y le atribuye un servidor; sustituirlo por «inclinación» resolvería una posible ambigüedad ontológica que el original deja abierta.
- issue: Referente de «estas dos cosas»
  choice: Se mantiene la referencia general a las dos realidades recién mencionadas
  alternative: Explicitar «la inmoralidad sexual y el vino»
  rationale: El griego usa τὰ δύο ταῦτα sin repetir los referentes. La traducción conserva esa cohesión y no precisa más de lo que precisa la fuente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el paralelismo causal del original y su personificación, con sintaxis clara para lectura pública.
