source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: es
  text: Porque es esclavo de dos pasiones opuestas y no puede obedecer a Dios, porque cegó su alma y camina de día como de noche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυσὶ ... πάθεσιν ἐναντίοις
  choice: a dos pasiones opuestas
  rationale: Conserva el sentido de dos impulsos o pasiones en conflicto, sin precisar cuáles son.
- source_word: δουλεύει
  choice: sirve como esclavo
  rationale: Expresa con naturalidad la fuerza del verbo griego, que indica esclavitud o sometimiento, no mero servicio voluntario.
- source_word: Θεῷ ὑπακοῦσαι
  choice: obedecer a Dios
  rationale: Equivalencia directa y clara del infinitivo griego con su complemento.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: ha cegado su propia alma
  rationale: El verbo griego está en singular y favorece como sujeto implícito al mismo individuo; el reflexivo aclara esa lectura sin atribuir la acción a las dos pasiones, como hace el inglés.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: anda de día como si fuera de noche
  rationale: Reproduce la comparación y la imagen moral del original en español natural.
theological_decisions:
- issue: Agente de la ceguera del alma
  choice: El individuo ha cegado su propia alma
  alternative: Las dos pasiones han cegado su alma
  rationale: ἐτύφλωσε es singular; por ello, el griego no respalda directamente el sujeto plural adoptado por la versión inglesa. Se conserva la responsabilidad moral personal sugerida por la sintaxis.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la metáfora de la esclavitud y el contraste entre día y noche, evitando ampliar las dos pasiones no identificadas en este versículo.
