- from: Porque sirve como esclavo a dos pasiones opuestas y no puede obedecer a Dios, pues ha cegado su propia alma y anda de día como si fuera de noche.
  to: Porque es esclavo de dos pasiones opuestas y no puede obedecer a Dios, porque cegó su alma y camina de día como de noche.
  rationale: Se ajusta el tiempo verbal al aoristo y se mejora la naturalidad de la expresión de esclavitud. Se mantiene el sujeto singular implícito de «cegó», sin adoptar el plural interpretativo de la versión inglesa ni añadir el reflexivo enfático «propia».
