source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: es
  text: Porque Dios me dio a mí la realeza y a él el sacerdocio, y sometió la realeza al sacerdocio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: Dios
  rationale: Traduce directamente el sustantivo griego; se evita seguir el inglés «the Lord», pues el texto fuente dice «Dios».
- source_word: τὴν βασιλείαν
  choice: la realeza
  rationale: En la primera aparición designa la dignidad o función regia otorgada a Judá; «realeza» expresa mejor ese sentido que un territorio político.
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: el sacerdocio / del sacerdocio
  rationale: Ambos términos griegos se refieren a la condición o institución sacerdotal; una misma traducción mantiene clara la relación conceptual.
- source_word: ὑπέταξε
  choice: puso ... bajo la autoridad de
  rationale: Comunica de manera natural la subordinación indicada por el verbo, sin suavizar la relación jerárquica.
- source_word: τὴν βασιλείαν
  choice: el reino
  rationale: En la segunda aparición, dentro de la relación institucional con el sacerdocio, «reino» resulta natural y conserva el cambio de formulación presente también en el griego.
theological_decisions:
- issue: Relación entre realeza y sacerdocio
  choice: «puso el reino bajo la autoridad del sacerdocio»
  alternative: «sometió el reino al sacerdocio»
  rationale: La formulación elegida conserva la subordinación explícita sin añadir una explicación denominacional sobre su alcance o duración.
- issue: Identidad del receptor del sacerdocio
  choice: «a él»
  alternative: explicitar un nombre propio
  rationale: Se conserva el pronombre del texto griego y su dependencia del contexto, sin resolver aquí una referencia que el versículo no nombra.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la estructura paralela de los dos dones y la tensión jerárquica de la cláusula final. No se requieren notas al pie.
