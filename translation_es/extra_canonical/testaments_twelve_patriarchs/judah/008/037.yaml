  text: A mí me dio lo que está en la tierra; a él, lo que está en los cielos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: lo que está en la tierra
  rationale: Conserva el sentido espacial y colectivo de la expresión griega con una formulación natural en español.
- source_word: τὰ ἐν οὐρανοῖς
  choice: lo que está en los cielos
  rationale: Mantiene el plural οὐρανοῖς y el paralelismo con la primera cláusula.
theological_decisions:
- issue: Referentes de los pronombres implícito y explícito
  choice: Conservar «me dio» y «a él» sin identificar a los personajes
  alternative: Añadir nombres o títulos para aclarar los referentes
  rationale: El fragmento griego no nombra aquí a quien da ni al destinatario de la segunda cláusula; explicitarlos resolvería una ambigüedad que debe preservarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la estructura paralela y el contraste enfático entre «a mí» y «a él»; la elipsis verbal de la segunda cláusula resulta natural en español.
