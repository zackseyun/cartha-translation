source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: es
  text: Y ciertamente, me arrepentí de estas cosas; no consumí vino ni carne hasta mi vejez, y no conocí alegría alguna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: arrepentido de estas cosas
  rationale: El participio expresa arrepentimiento por lo mencionado anteriormente; la formulación conserva su relación circunstancial con las abstenciones posteriores.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: no comí carne ni bebí vino
  rationale: Aunque el griego usa literalmente «comí» con vino y carne, en español natural se distribuyen los verbos apropiados. Se conserva el orden castellano más fluido sin alterar el sentido.
- source_word: ἕως γήρους μου
  choice: hasta mi vejez
  rationale: Traducción directa que mantiene el límite temporal expresado por el griego.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: no disfruté de alegría alguna
  rationale: «Ver alegría» es una expresión semítica que en contexto significa experimentar o disfrutar alegría; esta versión comunica el sentido de forma natural y mantiene la negación enfática.
theological_decisions:
- issue: Relación entre arrepentimiento, abstinencia y falta de alegría
  choice: Mantener las tres afirmaciones unidas sin explicar si las abstenciones son penitencia, disciplina o consecuencia emocional.
  alternative: Presentar explícitamente la abstinencia como penitencia religiosa.
  rationale: El texto relaciona las acciones, pero no define de manera inequívoca su función teológica; añadir una explicación resolvería indebidamente esa tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitó el calco poco natural «no comí vino» y se vertió el modismo «no vi alegría» por su sentido experiencial.
source_grounding:
  english_pob_role: consult_only
