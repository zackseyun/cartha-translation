id: T12P.JUD.8.18
reference: Testament of Judah 8:18
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: es
  text: Porque, si alguien bebe vino hasta embriagarse, con pensamientos impuros perturba su mente, enardece su cuerpo hacia la inmoralidad sexual y el placer, comete el pecado y no se avergüenza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: hasta embriagarse
  rationale: Expresa de manera natural el sentido de beber hasta llegar a la embriaguez, sin condenar aquí todo consumo de vino.
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: con pensamientos impuros
  rationale: Mantiene el valor moral de ῥυπαρός y traduce διαλογισμοί como pensamientos o razonamientos internos.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: perturba su mente
  rationale: Comunica la agitación intensa del νοῦς. Se regulariza el pronombre como tercera persona para concordar con «alguien»; el griego conserva una oscilación hacia la segunda persona.
- source_word: εἰς πορνείαν
  choice: para la inmoralidad sexual
  rationale: πορνεία tiene un campo semántico más amplio que una sola clase de unión sexual; «inmoralidad sexual» conserva esa amplitud.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: enardece su cuerpo ... por causa del placer
  rationale: Refleja la imagen de calentar o inflamar el cuerpo y conserva la relación con el placer sin añadir una «ocasión» que no aparece explícitamente en el texto griego.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: comete el pecado
  rationale: Traducción directa que conserva el artículo y la referencia al acto pecaminoso resultante.
theological_decisions:
- issue: Relación entre embriaguez, deseo y pecado
  choice: 'Se conserva la secuencia causal afirmada por el texto: perturbación mental, excitación corporal y comisión del pecado.'
  alternative: Introducir una condición adicional, como «si se presenta la ocasión».
  rationale: La cláusula condicional adicional de la versión inglesa no está en el griego suministrado; omitirla evita suavizar o reconfigurar la tensión moral del original.
- issue: Alcance de πορνεία
  choice: inmoralidad sexual
  alternative: unión sexual
  rationale: La opción elegida no limita indebidamente el término griego a la unión sexual en general ni a un acto específico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. La frase conserva la fuerza exhortativa y la cadena de consecuencias del griego. No se añadieron notas al texto porque las diferencias relevantes pueden resolverse responsablemente en la traducción; por ello no hay marcadores de nota al pie.
