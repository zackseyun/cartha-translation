review_pass:
  verdict: revise
  source_fidelity: La secuencia causal del griego se conserva y, correctamente, no se incorpora la condición adicional de la traducción inglesa («si se presenta la ocasión»), que no figura en el texto griego provisto. Sin embargo, πρὸς ἡδονήν se entiende mejor como un segundo propósito o fin coordinado con εἰς πορνείαν («hacia la inmoralidad sexual y el placer»), no como causa («por causa del placer»).
  naturalness: La redacción es en general clara y de registro adecuado. «Para la inmoralidad sexual por causa del placer» resulta algo forzado y puede sugerir una relación causal que el griego no expresa. La coordinación propuesta es más natural y reproduce mejor la progresión.
  terminology: «Hasta embriagarse», «pensamientos impuros», «inmoralidad sexual», «comete el pecado» y «no se avergüenza» son elecciones adecuadas en español latinoamericano neutral. «Enardece» conserva bien la imagen intensiva de ἐκθερμαίνει.
  issues:
  - severity: medium
    issue: «por causa del placer» traduce πρὸς ἡδονήν como causa.
    rationale: πρός con acusativo expresa aquí dirección, finalidad o resultado; junto con εἰς πορνείαν, el placer se presenta como término asociado de la excitación corporal. «Por causa de» introduce una causalidad no indicada.
  revised_text: Porque, si alguien bebe vino hasta embriagarse, con pensamientos impuros perturba su mente, enardece su cuerpo hacia la inmoralidad sexual y el placer, comete el pecado y no se avergüenza.
