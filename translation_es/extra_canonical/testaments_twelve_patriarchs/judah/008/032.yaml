revisions:
- from: Hijos míos, el amor al dinero conduce a la idolatría, porque, engañados por el dinero, llaman dioses a los que no lo son, y hace que quien lo alberga caiga fuera de sí.[a]
  to: Hijos míos, el amor al dinero conduce a la idolatría, porque, por el engaño del dinero, llaman dioses a quienes no lo son, y hace que quien alberga tal amor quede fuera de sí.[a]
  rationale: 'Se hacen ajustes limitados de claridad y fluidez: se explicita que el engaño procede del dinero y se sustituye el pronombre ambiguo por «tal amor», que reproduce el referente femenino de αὐτήν. Se conserva la traducción directa del griego, incluida su ambigüedad relativa en ἔκστασις, y se mantiene la nota aclaratoria.'
