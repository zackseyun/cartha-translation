source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: es
  text: Hijos míos, el amor al dinero conduce a la idolatría, porque, por el engaño del dinero, llaman dioses a quienes no lo son, y hace que quien alberga tal amor quede fuera de sí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: «caiga en éxtasis». Aquí la expresión parece indicar quedar fuera de sí o perder el buen juicio.'
    reason: ἔκστασις puede evocar en español una experiencia mística positiva; la nota conserva la formulación literal y explica el sentido probable en este contexto negativo.
lexical_decisions:
- source_word: φιλαργυρία
  choice: el amor al dinero
  rationale: Expresa de manera natural y directa la afición desordenada al dinero, sin limitarla a una mera conducta avara.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: conduce a la idolatría
  rationale: Conserva la imagen de dirección o consecuencia presente en ὁδηγεῖ.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: engañados por el dinero
  rationale: Reproduce el sentido de extravío o engaño causado por el dinero en una construcción clara en español.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: llaman dioses a los que no lo son
  rationale: Traducción cercana al griego que mantiene el contraste polémico sin ampliarlo.
- source_word: τὸν ἔχοντα αὐτήν
  choice: quien lo alberga
  rationale: Se refiere al amor al dinero como una disposición interior persistente; evita la ambigüedad poco natural de «quien lo tiene».
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: caiga fuera de sí
  rationale: Conserva la idea de pérdida o desplazamiento del juicio sin atribuir necesariamente una experiencia mística.
theological_decisions:
- issue: Material temático añadido en el texto inglés
  choice: Traducir únicamente la afirmación griega sobre el amor al dinero y la idolatría
  alternative: Incluir que el vino conduce a la inmoralidad sexual y que estas cosas apartan la mente de la ley de Dios
  rationale: La cláusula sobre el vino y la conclusión acerca de la ley no aparecen en el texto griego proporcionado para este versículo; incorporarlas presentaría una recapitulación editorial como si fuera traducción directa.
- issue: Sentido de ἔκστασις
  choice: «fuera de sí»
  alternative: «extravío», «locura» o «éxtasis»
  rationale: El contexto sugiere una perturbación del juicio causada por el amor al dinero. «Fuera de sí» preserva cierta amplitud semántica y evita el sentido religioso moderno de «éxtasis».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el vocativo familiar «Hijos míos» y el paralelismo causal del griego. El borrador sigue primero la evidencia griega y no incorpora las ampliaciones temáticas del texto inglés.
