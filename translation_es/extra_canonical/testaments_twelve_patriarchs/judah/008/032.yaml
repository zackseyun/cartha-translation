    text: 'Lit.: «caiga en éxtasis». Aquí la expresión parece indicar quedar fuera de sí o perder el buen juicio.'
    reason: ἔκστασις puede evocar en español una experiencia mística positiva; la nota conserva la formulación literal y explica el sentido probable en este contexto negativo.
