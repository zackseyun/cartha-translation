source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a slave to sexual immorality, as I myself also suffered.
translation:
  language: es
  text: El que comete inmoralidad sexual no se da cuenta de que está siendo despojado, y no se avergüenza cuando queda deshonrado. Pues, aunque alguien sea rey y cometa inmoralidad sexual, queda despojado de su reino al hacerse esclavo de la inmoralidad sexual, como yo también lo sufrí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: el que comete inmoralidad sexual / si comete inmoralidad sexual
  rationale: Expresa el sentido amplio de πορνεύω en español latinoamericano actual sin restringirlo indebidamente a la prostitución o al adulterio.
- source_word: γυμνούμενος / γυμνοῦται
  choice: está siendo despojado / queda despojado
  rationale: El sentido literal es «ser desnudado», pero en ambos contextos funciona como imagen de pérdida o privación; «despojado» conserva la metáfora y enlaza naturalmente con el reino.
- source_word: ἀδοξῶν
  choice: cuando pierde su honra
  rationale: Comunica la pérdida de honor o reputación implícita en el participio, en paralelo con «ser despojado».
- source_word: τῆς βασιλείας
  choice: de su reino
  rationale: βασιλεία puede referirse al reinado, dominio o reino. «Su reino» conserva la imagen regia y es natural en este contexto.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: al hacerse esclavo de la inmoralidad sexual
  rationale: Mantiene la personificación de la inmoralidad sexual como poder al cual uno queda sometido.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: como también me sucedió a mí
  rationale: Traduce con naturalidad la afirmación autobiográfica sin añadir una especificación ausente del griego.
theological_decisions:
- issue: Relación entre inmoralidad sexual, deshonra y pérdida del reino
  choice: Conservar la afirmación causal e ilustrativa del texto sin convertirla en una doctrina general sobre salvación o destitución política.
  alternative: Interpretar «reino» como salvación eterna o exclusivamente como cargo político.
  rationale: El griego presenta la experiencia de Judá como ejemplo moral, pero no define aquí el alcance teológico preciso de βασιλεία.
- issue: Esclavitud a la inmoralidad sexual
  choice: Mantener literalmente la metáfora de esclavitud.
  alternative: Parafrasear como «dejarse dominar por sus deseos».
  rationale: La imagen de δουλεύω es deliberadamente fuerte y presenta la conducta como un poder que somete; suavizarla perdería tensión moral y teológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la repetición de «inmoralidad sexual» y «despojado» para reflejar la cohesión léxica del griego. No se añaden notas porque las ambigüedades pueden conservarse adecuadamente en el cuerpo del texto.
