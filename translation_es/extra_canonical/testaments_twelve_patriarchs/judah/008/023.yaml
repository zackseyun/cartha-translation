    issue: «como también me sucedió a mí» para ὡς κἀγὼ ἔπαθον
    rationale: ἔπαθον significa «padecí» o «sufrí», no meramente que algo ocurrió. La formulación propuesta atenúa la afirmación autobiográfica y la consecuencia dolorosa expresada por el griego.
  - severity: low
    issue: «cuando pierde su honra» para ἀδοξῶν
    rationale: La expresión comunica una consecuencia relacionada, pero el griego presenta más directamente el estado de ser deshonrado o desacreditado. «Cuando queda deshonrado» conserva mejor esa voz y sigue siendo natural.
