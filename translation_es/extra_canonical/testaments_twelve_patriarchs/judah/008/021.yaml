source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: es
  text: 'Y esta es la prudencia al beber vino: mientras conserve el pudor, puede beber.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνεσις
  choice: prudencia
  rationale: En este contexto designa buen juicio o sensatez práctica respecto al consumo de vino.
- source_word: οἰνοποσίας
  choice: al beber vino
  rationale: Expresa de manera natural la acción o práctica de consumir vino.
- source_word: ἕως ὅτε
  choice: mientras
  rationale: 'Conserva el valor temporal y condicional de la expresión: beber es admisible durante el tiempo en que se mantiene la cualidad indicada.'
- source_word: αἰδῶ
  choice: el pudor
  rationale: El término alude a reserva moral, vergüenza sana o sentido de decoro; «pudor» preserva su concisión y contenido ético.
- source_word: πίνει
  choice: puede beber
  rationale: Aunque la forma griega significa literalmente «bebe», dentro de una máxima sobre la prudencia al beber funciona como autorización condicionada. La formulación evita convertirla en una orden.
theological_decisions:
- issue: Carácter moralmente condicionado del consumo de vino
  choice: Presentar el beber como permitido mientras se conserve el pudor
  alternative: Traducir literalmente «mientras tenga pudor, bebe»
  rationale: 'El contexto formula una norma de discreción, no una orden universal de beber. Se mantiene la tensión del texto: no prohíbe el vino, pero subordina su consumo al dominio moral.'
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue el texto griego breve sin incorporar las expansiones explicativas de la versión inglesa («no desviarse hacia la desvergüenza»), pues estas hacen explícita una implicación de αἰδώς que no aparece como cláusula separada en la fuente.
