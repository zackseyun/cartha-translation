source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*κοσμηθεῖσα κόσμῳ νυμφικῷ ἐκάθισεν *ἐν Ἐνὰν *τῇ πόλει *πρὸς τὴν πύλην. 2. Νόμος γὰρ ἦν τῶν Ἀμορραίων τὴν *χηρεύουσαν προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην.'
  language: Greek
  note: Greek from Charles XII.1b-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: es
  text: Ella, adornada con atavío nupcial, se sentó en la ciudad de Enán, junto a la puerta. Pues era ley entre los amorreos que la viuda se sentara durante siete días junto a la puerta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: Adornada con atavío nupcial
  rationale: Conserva tanto la acción de engalanarse como el carácter nupcial de la vestimenta, con una expresión natural y digna en español.
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: junto a la puerta de la ciudad de Enán
  rationale: Expresa de manera idiomática la ubicación indicada por el griego, entendiendo Enán como el nombre de la ciudad.
- source_word: Νόμος γὰρ ἦν τῶν Ἀμορραίων
  choice: Pues era ley entre los amorreos
  rationale: Representa el genitivo como una costumbre legal vigente en ese pueblo, sin añadir contenido interpretativo.
- source_word: τὴν χηρεύουσαν
  choice: la viuda
  rationale: El participio presente de χηρεύω designa a una mujer en estado de viudez. El griego suministrado no dice «la que estaba por casarse».
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας
  choice: se sentara durante siete días
  rationale: Comunica el acto prescrito y su duración. No se añade «en fornicación», idea ausente del texto griego proporcionado.
theological_decisions:
- issue: Descripción de la mujer sometida a la costumbre amorrea
  choice: la viuda
  alternative: la que estaba por casarse
  rationale: Se mantiene el sentido léxico directo de χηρεύουσαν y no se armoniza el pasaje con una interpretación contextual no expresada en esta fuente griega.
- issue: Naturaleza de la permanencia junto a la puerta
  choice: se sentara durante siete días
  alternative: se sentara durante siete días en fornicación
  rationale: La fuente griega solo prescribe sentarse o permanecer sentada junto a la puerta; no contiene ningún término equivalente a «fornicación».
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue de cerca la fuente griega suministrada, incluso donde difiere de la capa inglesa de consulta; no se incorpora la afirmación de que ella supo que Judá subía, pues no aparece en este segmento griego.
