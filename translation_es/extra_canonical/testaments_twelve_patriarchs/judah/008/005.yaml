review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el griego provisto y, correctamente, no incorpora «habiendo sabido que yo subía» ni «en fornicación», añadidos presentes en la capa inglesa pero ausentes de este texto griego. Conserva también χηρεύουσαν como una mujer en estado de viudez.
  naturalness: «Adornada con atavío nupcial» es comprensible, pero el participio inicial sin sujeto expreso puede resultar algo colgante en español. Expresar «Ella» y mantener la ubicación como dos complementos produce una redacción más clara y natural.
  terminology: «Atavío nupcial», «amorreos» y «viuda» son adecuados. «Puerta» conserva el sentido de πύλη, probablemente la puerta urbana.
  issues:
  - severity: low
    issue: El sujeto de la primera oración queda implícito tras un participio inicial.
    rationale: Aunque se puede recuperar por el contexto, el griego expresa el sujeto femenino y el español gana claridad con «Ella».
  - severity: low
    issue: La construcción «junto a la puerta de la ciudad de Enán» puede sugerir que «Enán» modifica directamente a «puerta».
    rationale: El griego ubica la acción «en la ciudad de Enán» y «junto a la puerta»; conservar ambos complementos por separado refleja mejor la sintaxis y evita una leve ambigüedad.
  revised_text: Ella, adornada con atavío nupcial, se sentó en la ciudad de Enán, junto a la puerta. Pues era ley entre los amorreos que la viuda se sentara durante siete días junto a la puerta.
