    text: 'Lit.: «descubrí la cubierta [o el velo] de la impureza de mis hijos». La expresión griega es inusual y su sentido preciso no es claro; puede aludir a haber expuesto públicamente la deshonra relacionada con sus hijos.'
    reason: Aclara la construcción difícil sin imponer una interpretación única sobre la relación de «impureza» y «mis hijos».
  revision_rationale: La revisión prioriza el texto griego sobre las expansiones de la auditoría inglesa, conserva el eufemismo relativo a Tamar y mantiene la metáfora final con una nota de incertidumbre. Se cambia «vergüenza ante nadie» por «no respeta a nadie» para reflejar el sentido ordinario de αἰδέομαι con persona como objeto, mientras que la vergüenza queda expresada donde el griego emplea explícitamente αἰσχύνομαι.
