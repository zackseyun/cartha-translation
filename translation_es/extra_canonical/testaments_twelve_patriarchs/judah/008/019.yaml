id: T12P.JUD.8.19
reference: Testament of Judah 8:19
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: es
  text: 'Así es quien se entrega al vino, hijos míos: el que se embriaga no respeta a nadie. Pues miren, también me extravió, hasta el punto de no avergonzarme ante la multitud de la ciudad; ante los ojos de todos me desvié hacia Tamar, cometí un gran pecado y dejé al descubierto la cubierta de la impureza de mis hijos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: «descubrí la cubierta [o el velo] de la impureza de mis hijos». La expresión griega es inusual y su sentido preciso no es claro; puede aludir a haber expuesto públicamente la deshonra relacionada con sus hijos.'
    reason: Aclara la construcción difícil sin imponer una interpretación única sobre la relación de «impureza» y «mis hijos».
lexical_decisions:
- source_word: πάροινος
  choice: quien se entrega al vino
  rationale: Expresa a la persona dominada o caracterizada por el vino sin limitar el término a un episodio aislado de embriaguez.
- source_word: ὁ μεθύων
  choice: el que se embriaga
  rationale: Traduce naturalmente el participio presente y conserva su sentido general.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: no siente vergüenza ante nadie
  rationale: El verbo puede implicar vergüenza, respeto o consideración; el contexto inmediato repite la idea de no avergonzarse, por lo que esta formulación mantiene la conexión léxica.
- source_word: ἐπλάνησεν
  choice: me hizo perder el rumbo
  rationale: Conserva la imagen de extravío o engaño y evita añadir la referencia al mandamiento de Dios, que no aparece en el texto griego proporcionado.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: me desvié para ir con Tamar
  rationale: Mantiene el verbo de desviación y la orientación hacia Tamar, dejando intacta la discreción eufemística del griego.
- source_word: τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: el velo de la impureza de mis hijos
  rationale: Reproduce la imagen difícil de κάλυμμα y conserva la relación ambigua del genitivo con «mis hijos».
theological_decisions:
- issue: La versión inglesa menciona que Judá transgredió el mandamiento de Dios.
  choice: No incluir esa afirmación.
  alternative: «También me hizo transgredir el mandamiento de Dios».
  rationale: La cláusula no figura en el texto griego suministrado; añadirla convertiría una expansión de la capa inglesa en parte del texto base.
- issue: Naturaleza exacta del pecado con Tamar.
  choice: Conservar la expresión indirecta «me desvié para ir con Tamar».
  alternative: Explicitar una relación sexual.
  rationale: El griego usa una formulación indirecta; explicitarla eliminaría su eufemismo y resolvería más de lo que dice esta oración.
- issue: Sentido de «el velo de la impureza de mis hijos».
  choice: Mantener la metáfora y explicarla en nota.
  alternative: Interpretar «expuse la vergüenza de mis hijos».
  rationale: La alternativa es más fluida, pero reduce una expresión griega inusual a una sola interpretación y borra su tensión textual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el trato paternal «hijos míos», el llamado de atención «miren» y la metáfora difícil del cierre. La puntuación organiza el largo período griego para facilitar la lectura sin alterar su progresión.
