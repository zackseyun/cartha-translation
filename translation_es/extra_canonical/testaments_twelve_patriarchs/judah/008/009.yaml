  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: es
  text: Y le di mi bastón y mi diadema como prenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: bastón
  rationale: Equivalente natural de la vara o bastón personal entregado como señal identificable.
- source_word: διάδημά
  choice: diadema
  rationale: Conserva el objeto regio específico del griego sin ampliarlo interpretativamente a «de tu reino».
- source_word: εἰς ἀρραβῶνα
  choice: como prenda
  rationale: Expresa una garantía entregada para asegurar el cumplimiento de una obligación; «prenda» es claro y conciso en español.
theological_decisions:
- issue: Diferencia entre la cláusula griega y el texto inglés de consulta
  choice: Traducir únicamente la entrega narrada en la fuente griega
  alternative: Incorporar la pregunta, la respuesta y el cinturón presentes en el inglés
  rationale: La fuente griega proporcionada dice que Judá entregó el bastón y el diadema como prenda. No contiene diálogo ni menciona un cinturón; añadirlos en este versículo desplazaría material ajeno a esta cláusula.
translation_notes:
  register: Español latinoamericano neutral, narración sencilla y digna. Se mantiene la primera persona de la fuente y el orden básico de los dos objetos entregados.
source_grounding:
  english_pob_role: consult_only
