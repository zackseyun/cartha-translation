    issue: «antes que yo» en lugar de una comparación
    rationale: ἤ ἐγώ funciona como el segundo término de comparación. «Antes que yo» introduce un significado de anterioridad que el griego no expresa; debe decirse «más justa que yo».
  - severity: low
    issue: Objeto sobredeterminado en «Al reconocerlo»
    rationale: El participio Ἐπιγνούς no lleva objeto expreso en el texto proporcionado. El pronombre «lo» obliga a un referente de género gramatical no especificado. Una formulación contextual sin objeto expreso es más prudente.
