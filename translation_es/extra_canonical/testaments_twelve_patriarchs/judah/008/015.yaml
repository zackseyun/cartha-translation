base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: es
  text: 'Al darme cuenta, dije: «Tamar ha sido declarada más justa que yo».[a] Y no volví a tener relaciones con ella.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «Tamar es más justa que yo». En este texto griego no aparecen las frases «me avergoncé» ni «porque no se la di a mi hijo Selá».'
    reason: La nota conserva la alternativa idiomática para el perfecto pasivo y transparenta que las dos cláusulas de la versión inglesa no se encuentran en la fuente griega suministrada.
lexical_decisions:
- source_word: Ἐπιγνούς
  choice: Al reconocerlo
  rationale: Traduce el participio aoristo de ἐπιγινώσκω de manera natural. El objeto no está explícito en este texto griego, por lo que no se añade «las prendas» ni «ellos».
- source_word: Δεδικαίωται
  choice: ha sido declarada justa
  rationale: Conserva el valor perfecto pasivo de δικαιόω y su matiz de vindicación o reconocimiento de justicia, sin reducirlo simplemente a una comparación moral.
- source_word: ἢ ἐγώ
  choice: antes que yo
  rationale: ἤ suele significar «que» en una comparación, pero la construcción con δικαιόω es inusual y admite más de una comprensión; la elección mantiene la prioridad comparativa sin insertar la frase ausente acerca de Selá.
- source_word: τοῦ γνῶναι αὐτήν
  choice: a tener relaciones con ella
  rationale: El verbo «conocer» funciona aquí como eufemismo sexual. La traducción comunica ese sentido con claridad y dignidad en español actual.
theological_decisions:
- issue: Sentido de Δεδικαίωται Θαμὰρ ἢ ἐγώ
  choice: «Tamar ha sido declarada justa antes que yo»
  alternative: «Tamar es más justa que yo»
  rationale: El griego presenta un perfecto pasivo y una comparación sintácticamente tensa. Se conserva la idea de vindicación y se documenta la alternativa más idiomática en una nota, sin resolver silenciosamente la ambigüedad.
- issue: Material presente en la versión inglesa pero ausente del texto griego suministrado
  choice: No incluir «me avergoncé» ni «porque no se la di a mi hijo Selá»
  alternative: Incluir esas cláusulas conforme a la versión inglesa y al paralelo de Génesis 38:26
  rationale: La traducción se fundamenta primero en la evidencia original proporcionada. Esas cláusulas no aparecen en este pasaje griego y añadirlas convertiría material paralelo en texto principal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evita el calco arcaico «no volví a conocerla» porque podría ocultar el sentido sexual para lectores modernos. La formulación sigue el breve texto griego dado y no armoniza el versículo con Génesis 38:26.
