id: T12P.JUD.8.29
reference: Testament of Judah 8:29
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: es
  text: Priva a su alma de toda bondad, lo oprime con sufrimientos y fatigas, aleja de él el sueño y va consumiendo su carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: Priva
  rationale: Reproduce el sentido de quitar o despojar de algo; se conserva el sujeto singular implícito del griego.
- source_word: πάσης ἀγαθότητος
  choice: toda bondad
  rationale: Mantiene el alcance total de πάσης y el sentido moral amplio de ἀγαθότης sin reducirlo a bienes o beneficios.
- source_word: συνέχει
  choice: mantiene sujeto
  rationale: Expresa la idea de retener, constreñir o tener atrapado dentro de una situación penosa.
- source_word: πόνοις καὶ μόχθοις
  choice: penas y fatigas
  rationale: 'Distingue los dos términos relacionados: sufrimientos o trabajos penosos, y esfuerzos agotadores.'
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: aleja de él el sueño
  rationale: Comunica de manera natural la expresión griega inusual, cuyo sentido contextual es hacer que el sueño se aparte.
- source_word: καταδαπανᾷ
  choice: consume por completo
  rationale: El verbo intensivo indica agotar o consumir enteramente.
- source_word: τὰς σάρκας αὐτοῦ
  choice: su carne
  rationale: Aunque el griego emplea el plural σάρκας, en español idiomático el singular colectivo «carne» expresa el cuerpo físico consumido.
theological_decisions:
- issue: Sujeto implícito de los verbos
  choice: Conservarlo implícito y singular
  alternative: Usar «ellos», siguiendo el inglés de consulta
  rationale: Todos los verbos rectores del texto griego están en tercera persona singular; identificar o pluralizar el agente resolvería una referencia que este fragmento no explicita.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. La coordinación directa conserva la fuerza acumulativa del original; no se añadieron explicaciones doctrinales ni se corrigió el sujeto singular a partir de la versión inglesa.
