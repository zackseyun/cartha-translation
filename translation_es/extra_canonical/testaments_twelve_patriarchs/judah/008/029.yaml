review_pass:
  verdict: revise
  source_fidelity: El borrador conserva correctamente el sujeto implícito singular de los verbos griegos, frente al plural de la versión inglesa de control. Traduce adecuadamente la secuencia de privación, opresión, pérdida del sueño y deterioro físico. Sin embargo, «por completo» añade una idea de consumación total que no es necesario explicitar; el prefijo de καταδαπανᾷ intensifica el desgaste, pero no exige afirmar que este se complete.
  naturalness: El texto es claro y de registro adecuado. «Lo mantiene sujeto a penas y fatigas» es comprensible, aunque «lo oprime con sufrimientos y fatigas» reproduce más directamente συνέχει y resulta más fluido en español actual. «Va consumiendo su carne» expresa naturalmente el desgaste continuado sugerido por el presente verbal.
  terminology: «Alma», «bondad», «sueño» y «carne» son elecciones apropiadas y no introducen interpretaciones doctrinales. Se conserva «carne» en singular como colectivo idiomático, pese al plural griego τὰς σάρκας.
  issues:
  - severity: low
    issue: «por completo» en «consume por completo su carne»
    rationale: La expresión hace explícita una consumación total que el verbo griego intensivo puede sugerir, pero no obliga a afirmar. «Va consumiendo» mantiene la fuerza de desgaste sin cerrar el proceso.
  - severity: low
    issue: «mantiene sujeto a» para συνέχει
    rationale: Es posible, pero «oprime con» refleja de modo más directo el valor de afligir o apremiar mediante dolores y trabajos, y concuerda con la construcción instrumental del griego.
  revised_text: Priva a su alma de toda bondad, lo oprime con sufrimientos y fatigas, aleja de él el sueño y va consumiendo su carne.
  revised_footnotes: []
