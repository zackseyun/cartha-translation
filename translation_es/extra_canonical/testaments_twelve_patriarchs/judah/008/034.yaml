  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: es
  text: Pues sé que después de mi muerte actuarán sin ley y contenderán con Leví; pero no podrán vencerlo, porque el ángel del Señor lo guía, mientras que a mí me ha extraviado el espíritu del engaño.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo no tiene una contraparte directa en el texto griego α conservado de esta sección. Su contenido es un puente homilético del proyecto que enlaza la advertencia previa con el discurso posterior sobre Leví y Judá; por tanto, no debe considerarse una traducción directa del griego citado.
    reason: Distinguir con transparencia entre el testimonio de la fuente original y el contenido editorial heredado de la capa inglesa del proyecto.
lexical_decisions:
- source_word: sin contraparte directa en el texto griego α conservado
  choice: actuarán sin ley
  rationale: Traduce con naturalidad la idea de «act lawlessly» sin atribuir al testimonio griego un término que no contiene.
- source_word: sin contraparte directa en el texto griego α conservado
  choice: contenderán con Leví
  rationale: Mantiene el conflicto expresado en la capa inglesa del proyecto y evita precisar si la contienda es verbal, política o militar.
- source_word: sin contraparte directa en el texto griego α conservado
  choice: el espíritu del engaño
  rationale: Conserva la personificación y la tensión teológica de la formulación del proyecto, sin reducirla a un simple error humano.
theological_decisions:
- issue: Autoridad textual del contenido del versículo
  choice: Conservar el texto del proyecto, pero señalar expresamente que carece de contraparte directa en el testimonio griego α indicado.
  alternative: Omitir el versículo o presentarlo como si fuera traducción directa del griego.
  rationale: La edición fuente declara que este contenido funciona como puente homilético del proyecto. La nota evita conferirle falsamente respaldo manuscrito directo.
- issue: Contraste entre la guía de Leví y el extravío de Judá
  choice: Mantener el contraste mediante «mientras que».
  alternative: Separar las dos afirmaciones o explicar doctrinalmente la acción del ángel y del espíritu.
  rationale: Así se preserva la tensión del texto inglés sin definir la naturaleza, alcance o causalidad de esas influencias espirituales.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva «Leví», de uso bíblico extendido. La redacción mantiene las afirmaciones y su contraste sin añadir explicaciones denominacionales ni resolver la ambigüedad sobre la acción de los seres espirituales.
