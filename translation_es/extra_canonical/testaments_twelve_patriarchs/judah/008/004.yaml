- from: Después de esto, tras dos años de viudez, Tamar oyó que yo subía a esquilar las ovejas.
  to: Después de esto, mientras Tamar era viuda, dos años después oyó que yo subía a esquilar las ovejas.
  rationale: Se reemplaza la formulación que presupone «dos años de viudez» por «dos años después», preservando la relación temporal menos específica del griego. Se mantienen el sujeto femenino de «oyó», la primera persona de la noticia comunicada y la finalidad de subir a esquilar las ovejas. No se incorpora la frase adicional del audit trail inglés porque no está en el texto griego provisto.
