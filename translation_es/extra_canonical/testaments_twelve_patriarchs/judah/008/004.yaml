base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: es
  text: Después de esto, mientras Tamar era viuda, dos años después oyó que yo subía a esquilar las ovejas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμάρ
  choice: tras… de viudez, Tamar
  rationale: Expresa de manera natural el genitivo absoluto griego, que presenta a Tamar en estado de viudez.
- source_word: μετὰ ἔτη δύο
  choice: tras dos años de viudez
  rationale: Por su posición junto a la referencia a Tamar viuda, se entiende naturalmente como el tiempo transcurrido desde que enviudó.
- source_word: ἀκούσασα
  choice: oyó
  rationale: El participio femenino singular tiene a Tamar como sujeto, no a Judá; evita seguir la inversión de sujetos presente en la capa inglesa.
- source_word: ἀνέρχομαι
  choice: yo subía
  rationale: Conserva la primera persona del presente griego dentro del discurso indirecto, expresada en español con imperfecto por concordancia narrativa.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: a esquilar las ovejas
  rationale: Traduce la construcción de finalidad con una expresión idiomática y directa en español.
