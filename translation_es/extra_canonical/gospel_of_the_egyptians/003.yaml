translation:
  language: es
  text: 'Domedón Doxomedón avanzó en procesión: el eón de los eones, el trono dentro de él, las potencias [que lo rodeaban], las glorias y las [indestructibilidades. El] Padre de la gran Luz, [que pro]cedió del Silencio, es [el gran] eón Doxomedón, en el cual reposa el niño [triple] varón. El trono de su [gloria] fue erigido [dentro de él, aquel] sobre el cual está [inscrito] su nombre que no puede revelarse, en la tablilla, […], siendo uno la palabra, el [Padre de la Luz] del Todo, aquel [que pro]cedió del Silencio mientras reposa dentro del Silencio, cuyo nombre […] está en un símbolo [invisible].


    [Un] misterio oculto [e invisible] avanzó en procesión:


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    y de esta manera las tres potencias ofrecieron alabanza al Espíritu [grande], invisible, innombrable, virginal e inefable, y a [su] virgen varón.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Los corchetes y puntos suspensivos señalan lagunas o restauraciones del texto; queda pendiente la revisión directa del copto de los códices de Nag Hammadi III,2 y IV,2.
    reason: La fuente proporcionada declara pendiente la revisión en la lengua antigua, y el pasaje contiene numerosas reconstrucciones y daños textuales.
lexical_decisions:
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico cosmológico, habitual en español para estas obras, en vez de reducirlo a «edad» o «era».
- source_word: came in procession
  choice: avanzó en procesión
  rationale: Reproduce el carácter ritual y dinámico de la expresión sin convertirla simplemente en «apareció».
- source_word: powers
  choice: potencias
  rationale: En este contexto designa entidades o realidades celestes; «potencias» conserva ese sentido técnico mejor que «poderes».
- source_word: indestructibilities
  choice: indestructibilidades
  rationale: Se mantiene la forma abstracta y plural, extraña pero significativa, sin sustituirla interpretativamente por «seres indestructibles».
- source_word: Silence
  choice: Silencio
  rationale: La mayúscula refleja que funciona como realidad hipostasiada o nombre cosmológico.
- source_word: the All
  choice: el Todo
  rationale: Se conserva la expresión cosmológica totalizante como término técnico.
- source_word: undisclosable name
  choice: nombre que no puede revelarse
  rationale: Expresa la imposibilidad de dar a conocer el nombre sin identificarla necesariamente con mera impronunciabilidad.
- source_word: unutterable
  choice: inefable
  rationale: Término natural y digno en español para aquello que no puede expresarse con palabras.
- source_word: male virgin
  choice: virgen varón
  rationale: Conserva la formulación paradójica y la tensión de género del testimonio en lugar de armonizarla.
theological_decisions:
- issue: Relación entre Doxomedón, el eón y el Padre de la gran Luz
  choice: Se conserva la sintaxis identificadora pero fragmentaria del testimonio
  alternative: Reordenar el pasaje para afirmar inequívocamente que Doxomedón es el Padre o que contiene al Padre
  rationale: El texto transmitido es difícil y está dañado; una reestructuración doctrinal resolvería una ambigüedad que la evidencia suministrada no permite resolver.
- issue: El niño «[triple-]male»
  choice: «niño [triple] varón»
  alternative: «niño tres veces varón» o «niño triple-masculino»
  rationale: La restauración es incierta y la expresión pertenece al vocabulario técnico de la obra; los corchetes preservan esa incertidumbre sin normalizar el concepto.
- issue: La «virgen varón» asociada al Espíritu
  choice: Se mantiene como figura distinta coordinada mediante «y a»
  alternative: 'Interpretarla como atributo del Espíritu: «el Espíritu… y virgen varón»'
  rationale: La sintaxis del testimonio favorece dos objetos de la alabanza, pero se conserva el marcador restaurado en «[su]» y no se define su relación metafísica.
- issue: Secuencia de vocales
  choice: Se reproduce sin transliteración interpretativa
  alternative: Convertirla en nombres vocálicos o explicar su supuesto significado litúrgico
  rationale: Las vocales forman parte material del pasaje y su función exacta no debe fijarse sin revisión directa del copto y del manuscrito.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los términos cosmológicos técnicos («eón», «potencias», «el Todo») y las formulaciones deliberadamente extrañas del pasaje. Se omitieron los números desnudos de página del manuscrito, pero se preservaron las señales de daño y restauración mediante corchetes y puntos suspensivos.
