translation:
  language: es
  text: 'El gran Logos, el Dios autogenerado y el Hombre indestructible, Adamas, ofrecieron alabanza. Pidieron para el autogenerado un poder y una fuerza eterna, a fin de completar los cuatro eones, para que por medio de ellos apareciera [a] […] la gloria y el poder del Padre invisible de los hombres sagrados de la gran Luz, quienes entrarán en el mundo, la imagen de la noche.


    El Hombre indestructible, Adamas, les pidió que de él procediera un hijo, para que llegara a ser padre de la raza inmóvil e indestructible; para que por medio de ella aparecieran el Silencio y la Voz, y para que por medio de ella el eón muerto se levantara a fin de disolverse. Entonces procedió de lo alto el poder de la gran Luz: la Manifestación. Ella dio a luz a las cuatro grandes luces:


    Harmozel,


    Oroiael,


    Davithe,


    Eleleth,


    y al gran Seth indestructible, hijo del Hombre indestructible, Adamas. Así quedó completa la Héptada perfecta, que existe en misterios ocultos. [b] Cuando ella [obtiene] la [gloria], se convierte en once Ógdoadas, y el Padre asintió en señal de aprobación. Toda la Plenitud de las luces se alegró.'
  philosophy: optimal-equivalence
