review_pass:
  verdict: revise
  source_fidelity: La versión conserva en general la secuencia, los nombres y los tecnicismos del testimonio inglés provisional. Sin embargo, sustituye los corchetes vacíos del testimonio ([]) por los llamados de nota [a] y [b], con lo que deja de representar explícitamente dos lagunas manuscritas. También conviene conservar con mayor precisión «completion of the four aeons» como «la consumación de los cuatro eones» y corregir la acentuación de «Ogdóadas». La revisión directa del copto sigue pendiente.
  naturalness: La redacción revisada mantiene un español latinoamericano formal y fluido. «Tributaron alabanza», «se alzara» y «la consumación» son naturales en este registro sin rebajar el carácter técnico del pasaje.
  terminology: Se conservan Logos, Autogenerado, eón, Manifestación, Héptada y Plenitud. «Ogdóadas» corrige la forma acentual de «Ógdoadas». Los nombres Harmozel, Oroiael, Davithe, Eleleth, Seth y Adamas se mantienen.
  issues:
  - severity: high
    issue: Se reemplazaron las lagunas [] del testimonio por los marcadores [a] y [b].
    rationale: El testimonio presenta una laguna vacía antes de […] y otra antes de «When she [obtains]». Los marcadores de nota no deben ocupar el lugar del texto perdido; deben añadirse junto a los corchetes vacíos para preservar la evidencia textual.
  - severity: medium
    issue: «a fin de completar los cuatro eones» cambia levemente la función de «for the completion of the four aeons».
    rationale: El original del testimonio enumera lo pedido «para la consumación de los cuatro eones»; la formulación con infinitivo hace de los solicitantes quienes completan activamente los eones.
  - severity: medium
    issue: «Ógdoadas» tiene acentuación inadecuada en español.
    rationale: La adaptación española del tecnicismo se escribe «Ogdóada»; en plural, «Ogdóadas».
  revised_text: 'El gran Logos, el Dios autogenerado y el Hombre indestructible, Adamas, tributaron alabanza. Pidieron para el Autogenerado un poder y una fuerza eterna, para la consumación de los cuatro eones, a fin de que por medio de ellos aparecieran []ᵃ […] la gloria y el poder del Padre invisible de los hombres sagrados de la gran Luz, quienes entrarán en el mundo, la imagen de la noche.


    El Hombre indestructible, Adamas, les pidió que de él viniera un hijo, para que llegara a ser padre de la raza inmóvil e indestructible; para que por medio de ella aparecieran el Silencio y la Voz, y para que por medio de ella el eón muerto se alzara, a fin de disolverse. Y así, de lo alto procedió el poder de la gran Luz, la Manifestación. Ella dio a luz a las cuatro grandes luces:


    Harmozel,


    Oroiael,


    Davithe,


    Eleleth,


    y al gran Seth indestructible, hijo del Hombre indestructible, Adamas. Así se completó la Héptada perfecta, que existe en misterios ocultos. []ᵇ Cuando ella [obtiene] la [gloria], se convierte en once Ogdóadas, y el Padre asintió en señal de aprobación. Toda la Plenitud de las luces se alegró.'
  revised_footnotes:
