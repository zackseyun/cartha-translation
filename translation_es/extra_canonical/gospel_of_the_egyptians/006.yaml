lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Se conserva el término técnico, como en el testimonio, para evitar reducir su posible sentido de palabra, razón o entidad personificada.
- source_word: self-generated
  choice: autogenerado
  rationale: Reproduce de manera concisa la idea de origen en sí mismo sin añadir una explicación doctrinal.
- source_word: aeon(s)
  choice: eón/eones
  rationale: Se mantiene el tecnicismo cosmológico, cuyo referente no equivale simplemente a una edad o época.
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula y el sustantivo conservan su probable carácter técnico y colectivo.
- source_word: Hebdomad
  choice: Héptada
  rationale: Término técnico para un conjunto de siete; evita una paráfrasis interpretativa.
- source_word: Ogdoads
  choice: Ógdoadas
  rationale: Término técnico para conjuntos de ocho, conservado en plural según el testimonio.
- source_word: Manifestation
  choice: Manifestación
  rationale: Se conserva como nombre o título femenino, de acuerdo con el pronombre posterior del testimonio.
- source_word: unmoving
  choice: inmóvil
  rationale: Mantiene la imagen metafísica de estabilidad sin sustituirla por 'inmutable', que sería más interpretativo.
theological_decisions:
- issue: Número gramatical de los sujetos que ofrecen alabanza
  choice: «ofrecieron», en plural
  alternative: «ofreció», entendiendo los títulos como una sola entidad
  rationale: El testimonio enumera al gran Logos, al Dios autogenerado y al Hombre indestructible, Adamas, y usa una forma verbal plural; se preserva esa tensión sin identificar expresamente las figuras.
- issue: Referente de «la imagen de la noche»
  choice: Se conserva al final sin aclarar su referente
  alternative: Vincularla explícitamente con el mundo o con quienes entrarán en él
  rationale: La sintaxis transmitida es ambigua y no permite resolver con seguridad qué elemento es la imagen de la noche.
- issue: Levantamiento y disolución del eón muerto
  choice: Traducción literal de la secuencia paradójica
  alternative: Interpretarla como destrucción, liberación o renovación
  rationale: Se conserva la tensión entre levantarse y disolverse, sin imponer una lectura soteriológica concreta.
- issue: Relación entre la Manifestación y las luces/Seth
  choice: Se mantiene que ella da a luz a las cuatro luces, seguida por Seth en la enumeración
  alternative: Afirmar explícitamente que también dio a luz a Seth
  rationale: La puntuación y coordinación del testimonio no hacen completamente inequívoco el alcance del verbo «dio a luz».
- issue: Cálculo de la Héptada y las once Ógdoadas
  choice: Se conservan los términos y números sin armonización
  alternative: Explicar o corregir la aritmética cosmológica
  rationale: El pasaje es fragmentario y su estructura numérica pertenece a su propio sistema simbólico; no debe normalizarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres propios y los tecnicismos cosmológicos Logos, eón, Héptada, Ógdoadas y Plenitud. La redacción sigue de cerca el testimonio público en inglés porque la revisión directa del copto está pendiente; por ello, las lagunas, restauraciones y ambigüedades se marcan en vez de resolverse silenciosamente.
