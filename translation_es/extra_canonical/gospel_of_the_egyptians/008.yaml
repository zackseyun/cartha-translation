  revision_rationale: 'La revisión corrige dos expansiones semánticas del borrador: «salió» conserva mejor «proceeded forth» que «se manifestó», y «sobre los eones» evita añadir el verbo «gobernar». También conserva explícitamente los corchetes de la laguna textual. Se mantiene la sintaxis singular de «quien alabó...» conforme al antecedente singular inmediato del testimonio, sin resolver una posible dificultad textual o sintáctica que requeriría cotejo copto.'
