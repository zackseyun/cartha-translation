translation:
  language: es
  text: 'Entonces todo se estremeció, y el estremecimiento se apoderó de los indestructibles. Luego los tres hijos varones descendieron desde lo alto hasta los no nacidos y autoengendrados, y hasta los engendrados en lo engendrado. La Grandeza se manifestó: la Grandeza entera del gran Cristo.


    Él erigió incontables miríadas de tronos gloriosos dentro de los cuatro eones que los rodeaban, incontables miríadas de poderes, glorias [a] e indestructibilidades. Así avanzaron, y la iglesia espiritual e indestructible creció dentro de las cuatro luces del gran Viviente autogenerado, el Dios de la verdad, quien alabó, cantó y ensalzó con una sola voz, en común acuerdo y con una boca que no cesaba:


    al Padre,


    a la Madre,


    al Hijo


    y a toda su Plenitud, como mencioné antes.[b]


    A los cinco sellos que poseen las miríadas,


    a los arcontes que gobiernan los eones


    y a los portadores de la gloria de los jefes


    se les ordenó manifestarse a los dignos.


    Amén.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En este punto el manuscrito presenta una laguna o una porción dañada; no puede determinarse con seguridad qué palabras faltan.
    reason: Señalar de manera visible la discontinuidad textual indicada por los corchetes del testimonio.
  - marker: b
    text: «Antes» representa una palabra suplida por el editor o traductor del testimonio para completar el sentido.
    reason: Distinguir el suplemento editorial marcado con corchetes angulares en el testimonio de las palabras conservadas.
lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: indestructibles / indestructibilidades
  rationale: Conserva la terminología técnica y la relación léxica repetida del testimonio, sin sustituirla por una interpretación como «inmortales».
- source_word: self-begotten / self-generated
  choice: autoengendrados / autogenerado
  rationale: Mantiene la diferencia léxica presente en el testimonio inglés provisional, aunque ambos términos describen existencia originada por sí misma.
- source_word: Greatness
  choice: Grandeza
  rationale: Se conserva como título personificado mediante mayúscula, de acuerdo con su función en el pasaje.
- source_word: aeons
  choice: eones
  rationale: Es el término técnico habitual y evita reducir estas realidades cosmológicas a simples períodos de tiempo.
- source_word: Fullness
  choice: Plenitud
  rationale: Preserva como título técnico la totalidad divina mencionada en el texto.
- source_word: archons
  choice: arcontes
  rationale: La transliteración asentada conserva la identidad de estos gobernantes cósmicos sin imponer una equivalencia confesional.
- source_word: church
  choice: iglesia
  rationale: Traducción directa y natural de la denominación comunitaria del testimonio, conservando sus calificativos «espiritual e indestructible».
- source_word: countless myriads
  choice: incontables miríadas
  rationale: Retiene la expresión enfática de una multitud innumerable.
theological_decisions:
- issue: Identidad del sujeto que alaba, canta y ensalza
  choice: Se conserva el relativo singular «quien» después de «el Dios de la verdad»
  alternative: Hacer de «la iglesia espiritual e indestructible» el sujeto plural de la alabanza
  rationale: La sintaxis del testimonio provisional presenta un antecedente singular inmediato. No se corrige silenciosamente la posible tensión entre ese antecedente y la escena de alabanza.
- issue: Relación entre Padre, Madre, Hijo y Plenitud
  choice: Se conserva la enumeración sin explicación doctrinal añadida
  alternative: Definir la naturaleza o relación ontológica de las figuras
  rationale: El pasaje no desarrolla esas relaciones aquí; explicarlas importaría una interpretación ajena al testimonio.
- issue: «Engendrados en lo engendrado»
  choice: Se mantiene la formulación deliberadamente abstracta
  alternative: Identificar «lo engendrado» con un ámbito o ser específico
  rationale: La expresión del testimonio es ambigua y debe permanecer así hasta una revisión directa del copto.
- issue: Los «dignos»
  choice: dignos
  alternative: merecedores / elegidos
  rationale: «Dignos» comunica aptitud o merecimiento sin introducir una doctrina específica de elección o salvación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron términos técnicos del entorno cosmológico del escrito —«eones», «arcontes», «Plenitud»— y las repeticiones retóricas. Este borrador es provisional porque se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de los códices coptos de Nag Hammadi III,2 y IV,2.
