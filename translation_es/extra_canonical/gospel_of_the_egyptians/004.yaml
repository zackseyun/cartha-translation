translation:
  language: es
  text: 'Pidieron [un] poder. Procedió un silencio del Silencio viviente, es decir, [glorias] e indestructibilidades en los eones, [… eones], miríadas añadidas [a …], tres varones, [los tres] descendientes varones. Los linajes [masculinos] llenaron el gran eón Doxomedón [con] el poder de la palabra del [Pléroma entero].[a]


    Entonces el [hijo] triple-varón del gran Cristo, a quien había ungido el [gran] Espíritu invisible, aquel cuyo poder [se llamaba] Ainón, presentó [alabanza al] gran Espíritu invisible, [a su] virgen masculina, Yoel, [al] Silencio del silencio silencioso y a la grandeza […].


    [En el Códice III faltan las páginas 45–48; corresponden a las páginas 55–60 del Códice IV].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Pléroma» significa literalmente «plenitud» y aquí funciona como término cosmológico.
    reason: Aclara un tecnicismo necesario sin insertar la explicación en el cuerpo del texto.
  - marker: b
    text: En el Códice III faltan las páginas 45–48; esta laguna corresponde a las páginas 55–60 del Códice IV.
    reason: Documenta la laguna manuscrita y su testimonio paralelo, conforme a los datos de la fuente.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Se conserva el término técnico cosmológico, de uso establecido en español para estas obras, sin reducirlo a «edades» ni interpretarlo como seres o ámbitos en cada caso.
- source_word: Fullness
  choice: Pléroma
  rationale: El término técnico «Pléroma» comunica mejor la función cosmológica del original que el genérico «plenitud»; la nota ofrece la equivalencia literal.
- source_word: triple-male
  choice: triple-varón
  rationale: Se preserva la extraña formulación técnica y su énfasis masculino, sin normalizarla como «tres veces varón» ni identificarla doctrinalmente.
- source_word: male virgin
  choice: virgen masculina
  rationale: Se mantiene deliberadamente la paradoja de género del testimonio, sin armonizarla ni explicarla.
- source_word: Silence of silent Silence
  choice: Silencio del silencio silencioso
  rationale: Se reproduce la repetición enfática y la posible distinción entre figuras o hipóstasis, aunque la expresión resulte inusual en español.
- source_word: speech
  choice: palabra
  rationale: «Palabra» permite tanto el sentido de habla como el de expresión eficaz, sin imponer la identificación técnica con el Logos.
theological_decisions:
- issue: Naturaleza de los eones
  choice: Conservar «eones» sin definir si son períodos, ámbitos o entidades.
  alternative: Traducir «edades» o explicarlos como seres divinos.
  rationale: El pasaje admite una carga cosmológica técnica que no debe resolverse de manera denominacional o especulativa.
- issue: Relación del gran Cristo y el Espíritu invisible
  choice: Traducir literalmente que el Espíritu había ungido al hijo triple-varón del gran Cristo.
  alternative: Reformular la frase para identificar al hijo con Cristo o aclarar una jerarquía ontológica.
  rationale: La sintaxis y la cosmología del testimonio deben conservar su tensión sin imponer una cristología posterior.
- issue: Yoel como «virgen masculina»
  choice: Mantener la designación paradójica.
  alternative: Neutralizarla como «virgen» o reinterpretarla como andrógina.
  rationale: La expresión forma parte de la imaginería teológica específica del escrito y no corresponde explicarla más allá de la evidencia proporcionada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Los corchetes conservan las restauraciones editoriales y las elipsis señalan texto perdido o ilegible. Debido a que la revisión directa del copto está pendiente, el borrador sigue de manera cautelosa el testimonio inglés de dominio público, preservando sus incertidumbres, repeticiones y terminología técnica.
