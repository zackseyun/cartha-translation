translation:
  language: es
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    Oh Yesseus Mazareus Yessedekeus,


    oh agua viva,


    oh hijo del hijo,


    oh nombre glorioso,


    ALĒTHŌS ALĒTHŌS,


    el Ser eterno,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    oh Ser que contempla los eones,[a]


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    el eternamente eterno,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ dentro del corazón, el que existe,


    UAEI EISAEI EIOEI EIOSEI.


    Este gran nombre tuyo habita dentro de mí,


    oh Perfecto autogenerado.


    Tú, que no estás fuera de mí,


    yo te contemplo,


    oh tú, a quien nadie puede ver,


    pues ¿quién puede comprenderte en una lengua diferente?


    Porque te he conocido,


    ahora me he unido al inmutable.


    Me he revestido con la armadura de luz.


    Me he convertido en Luz,


    porque la Madre estaba en el Lugar por la excelsa belleza de la gracia.


    Por eso extendí mis manos cuando estaban plegadas.


    He recibido forma dentro del círculo de la riqueza de luz,


    en mi regazo,


    el cual produce la forma de los muchos engendrados por la luz,


    allí donde no llega ninguna acusación.


    ALĒTHŌS,


    proclamaré tu gloria,


    porque te he comprendido,


    SOU IĒS IDE AEIŌ AEIE OIS,


    ¡oh Eón, Eón, oh Dios del Silencio!


    Te honro plenamente.


    Tú eres mi lugar de descanso, oh Hijo,


    ĒS ĒS O E,


    ser sin forma entre los que no tienen forma,


    que levantas al Hombre, dentro del cual me purificarás,


    para que entre en tu vida,


    conforme a tu nombre indestructible.


    Por tanto, el incienso de vida habita dentro de mí.


    Lo he mezclado con agua conforme al molde de todos los arcontes,[b]


    para que viva contigo en el bienestar de los santos,


    tú que existes para siempre.


    ALĒTHŌS ALĒTHŌS.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eones» translitera un término que puede referirse a edades eternas y, en este escrito, también a realidades o ámbitos supramundanos.
    reason: Aclara un término técnico sin fijar una cosmología más precisa de la que permite el testimonio.
  - marker: b
    text: «Arcontes» translitera el término griego para «gobernantes» o «potestades»; aquí designa figuras del orden cósmico del escrito.
    reason: Ayuda al lector común a comprender el tecnicismo conservando su carga antigua.
lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: Se conservan sin traducir y con sus formas diferenciadas por su función formularia o vocálica y porque el testimonio suministrado preserva deliberadamente la variación.
- source_word: aeons
  choice: eones
  rationale: Transliteración técnica ya asentada en español para las realidades o edades supramundanas del texto; evita reducir el término a una sola interpretación.
- source_word: self-generated
  choice: autogenerado
  rationale: Conserva la afirmación de origen propio sin sustituirla por categorías teológicas posteriores.
- source_word: merged with
  choice: me he unido a
  rationale: Expresa una unión estrecha sin imponer necesariamente una fusión ontológica absoluta que el testimonio indirecto no permite asegurar.
- source_word: archons
  choice: arcontes
  rationale: Mantiene el término técnico para los gobernantes o potestades del sistema cosmológico del escrito.
- source_word: Place
  choice: Lugar
  rationale: La mayúscula señala que probablemente funciona como designación técnica, sin explicar de manera especulativa su referente.
theological_decisions:
- issue: Relación entre el hablante y el inmutable
  choice: «me he unido al inmutable»
  alternative: «me he fusionado con el inmutable»
  rationale: La formulación elegida preserva la unión mística, pero evita decidir que la identidad personal queda absorbida por completo.
- issue: Título «the Man»
  choice: «el Hombre»
  alternative: «el ser humano»
  rationale: La mayúscula conserva su probable carácter de figura o título primordial dentro de la cosmología del escrito.
- issue: Lenguaje materno y espacial
  choice: «la Madre estaba en el Lugar»
  alternative: Explicar «Madre» y «Lugar» mediante equivalentes doctrinales
  rationale: Se mantienen los títulos y la tensión simbólica del pasaje sin importar un esquema confesional o exegético externo.
- issue: «God of Silence»
  choice: «Dios del Silencio»
  alternative: «Dios silencioso»
  rationale: El genitivo puede designar una relación titular con el Silencio; convertirlo en adjetivo resolvería innecesariamente esa relación.
translation_notes:
  register: Español latinoamericano neutral, poético y litúrgico. Se preservan las secuencias vocálicas, los nombres rituales, las llaves de AAAA{A} y la distinción entre ALĒTHES y ALĒTHŌS. Se omiten el número de página intrusivo [15] y los corchetes vacíos, pues son señales editoriales sin contenido recuperable. Dado que la revisión directa del copto está pendiente, la redacción se mantiene cautelosa ante construcciones oscuras y evita reconstrucciones conjeturales.
