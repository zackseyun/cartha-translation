translation:
  language: es
  text: 'Entonces el gran Set, hijo del Hombre indestructible, Adamas, ofreció alabanza a:


    el gran Espíritu invisible, innombrable, inexpresable y virginal;

    la <virgen masculina>;

    <y el niño tres veces varón>;

    <y la> virgen masculina Youel;

    y Esephech, guardián del esplendor;

    y la corona de su gloria, el niño del niño;

    [a] y los grandes eones de Doxomedón;

    y la Plenitud, como mencioné anteriormente.


    Y suplicó en favor de su descendencia.


    Entonces salió de aquel lugar Plesitea, el gran poder de la gran luz:


    la madre de los ángeles,

    la madre de las luces,

    la madre gloriosa,

    la virgen de cuatro pechos,

    que llevaba el fruto de Gomorra como un manantial, y de Sodoma,

    siendo ella el fruto del manantial de Gomorra que habitaba dentro de sí.


    Ella salió por medio del gran Set.


    Entonces el gran Set se alegró por el don que el niño indestructible le había concedido. Extrajo su simiente de la virgen de cuatro pechos y la depositó consigo dentro del cuarto eón, dentro de la tercera gran luz, Davite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio presenta aquí una laguna textual antes de «y los grandes eones de Doxomedón».
    reason: El texto fuente marca explícitamente una omisión con corchetes vacíos; la nota hace visible la falta sin reconstruir palabras no conservadas.
lexical_decisions:
- source_word: seed
  choice: descendencia / simiente
  rationale: 'Se traduce según el contexto: «descendencia» cuando designa al linaje por el cual Set suplica, y «simiente» cuando el relato describe su extracción y depósito. Así se conserva la relación semántica sin forzar en español una sola palabra poco natural en ambos lugares.'
- source_word: aeon
  choice: eón
  rationale: Se conserva el término técnico de la cosmología del escrito, en vez de reducirlo a «era» o «mundo».
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula señala que funciona como realidad cosmológica o nombre técnico, equivalente al concepto de pleroma.
- source_word: came/proceeded forth
  choice: salió
  rationale: «Salió» expresa de manera clara y digna el movimiento de procedencia, sin añadir una interpretación metafísica no explícita.
- source_word: four-breasted virgin
  choice: virgen de cuatro pechos
  rationale: Traducción directa que mantiene la imagen corporal extraña del testimonio sin suavizarla.
- source_word: keeper of splendor
  choice: guardián del esplendor
  rationale: Reproduce la función titular de Esephech con una expresión natural en español.
theological_decisions:
- issue: Lenguaje paradójico de género en los títulos celestiales
  choice: Conservar «virgen masculina», «niño tres veces varón» y las señales angulares del testimonio
  alternative: Regularizar las expresiones según un solo género o interpretarlas mediante una paráfrasis
  rationale: Las formulaciones paradójicas parecen teológicamente significativas. Resolverlas ocultaría la tensión del texto; además, los corchetes angulares del testimonio indican una situación textual o editorial que debe permanecer visible.
- issue: Relación entre Set, la virgen y la simiente
  choice: Mantener literalmente que Set extrae su simiente de la virgen y la deposita «consigo»
  alternative: Explicar quién engendra, recibe o porta la simiente
  rationale: La sintaxis y la imaginería son difíciles, y el testimonio no permite resolver con seguridad sus relaciones ontológicas o rituales.
- issue: El fruto, Gomorra y Sodoma
  choice: Preservar la secuencia y su ambigüedad
  alternative: Reordenar la frase para identificar una fuente única o explicar el simbolismo
  rationale: La construcción transmitida es oscura. Una aclaración interpretativa podría alterar la cosmología del pasaje.
- issue: Procedencia de Plesitea «por medio del gran Set»
  choice: «Ella salió por medio del gran Set»
  alternative: «Ella emanó a través del gran Set»
  rationale: La opción elegida mantiene la mediación expresada en el texto sin imponer terminología emanacionista más técnica que la evidencia suministrada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los nombres propios transliterados y los términos cosmológicos técnicos. Esta versión es provisional porque el material suministrado se basa en un testimonio inglés de dominio público y aún está pendiente la revisión directa del copto de los códices de Nag Hammadi III,2 y IV,2.
