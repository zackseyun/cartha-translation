translation:
  language: es
  text: 'Tres poderes procedieron de él: el Padre, la Madre y el Hijo, desde el Silencio viviente, que procedió del Padre indestructible. Estos procedieron [del] Silencio del Padre desconocido, [y] de aquel lugar [pro]cedió Domedón Doxomedón, [el eón de] los eones y la [Luz] de [sus] poderes individuales. De este modo, el Hijo [pro]cedió en cuarto lugar; la Madre, [en quinto; y el Padre,] en sexto.


    Él permaneció [inadvertido] y aún no había sido anunciado. [Él es aquel] que no está representado por signo alguno en medio de todos [los poderes], las glorias y las [indestructibilidades].


    De aquel lugar [pro]cedieron los tres poderes, […] las tres Ogdóadas que [el Padre pro]duce en Silencio, junto con la Providencia, desde su seno: el Padre, la Madre y el Hijo.


    La <primera> Ogdóada, por causa de la cual procedió el niño triple-varón, es:


    Pensamiento,

    y Logos,

    e Indestructibilidad,

    y Vida [eterna],

    Voluntad,

    Mente,

    Conocimiento previo,

    el Padre andrógino.


    El segundo poder-Ogdóada:


    la Madre,

    la virgen Barbelón,

    Epititioj[… ]ai,

    Memeneaimén, [quien] vela por el cielo,

    Karb[…],

    el poder que supera toda interpretación,

    la Madre inefable.


    [Ella se] originó por sí [misma…]. Procedió. [Ella] estuvo de acuerdo con el Padre [del] Silencio silencioso.


    El tercer poder-[Ogdóada]:


    el Hijo del [Silencio silencioso],

    y la corona del Silencio silencioso,

    [y] la gloria del Padre,

    y la virtud de la […] [Madre].


    [Él] produce, desde el seno, los siete poderes de la gran Luz, que son las siete voces, y su plenitud es el habla.


    Estos son los tres [poderes], las tres Ogdóadas que el Padre [pro]dujo desde su seno [por medio de] su Providencia. Los produjo en aquel lugar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Silence
  choice: Silencio
  rationale: Se conserva como entidad o principio personificado mediante mayúscula, de acuerdo con el uso del pasaje.
- source_word: aeon
  choice: eón
  rationale: Término técnico naturalizado en español que preserva el sentido cosmológico sin interpretarlo como mera «era».
- source_word: Ogdoad
  choice: Ogdóada
  rationale: Se mantiene el término técnico para un conjunto de ocho entidades; traducirlo solo como «grupo de ocho» borraría su función nominal.
- source_word: Logos
  choice: Logos
  rationale: Se conserva la transliteración por su posible función de nombre o hipóstasis y para no resolverla unilateralmente como «Palabra» o «Razón».
- source_word: Providence
  choice: Providencia
  rationale: La mayúscula conserva la probable personificación del término en este contexto.
- source_word: lap
  choice: seno
  rationale: «Seno» expresa el ámbito íntimo y generativo implicado sin imponer una anatomía demasiado concreta.
- source_word: triple-male child
  choice: niño triple-varón
  rationale: Versión deliberadamente cercana y extraña que conserva la formulación técnica y ambigua del testimonio, sin normalizarla como «niño tres veces varón».
- source_word: speech
  choice: habla
  rationale: Distingue el acto o facultad articulada de «Logos», que se mantiene como término técnico.
- source_word: unsignified
  choice: no está representado por signo alguno
  rationale: Expresa la ausencia de designación o significación sin convertirla simplemente en anonimato.
theological_decisions:
- issue: Relación y orden del Padre, la Madre y el Hijo
  choice: Conservar literalmente la secuencia y los ordinales restaurados
  alternative: Reordenar o explicar la tríada según un sistema teológico reconstruido
  rationale: El texto presenta tensiones internas y lagunas; no corresponde armonizarlas doctrinalmente.
- issue: Personificación del Silencio y la Providencia
  choice: Usar mayúsculas y mantener la sintaxis relacional
  alternative: Traducirlos como cualidades abstractas en minúscula
  rationale: El contexto los trata como realidades activas o hipostáticas, aunque su estatuto exacto permanece abierto.
- issue: Padre andrógino
  choice: Mantener «el Padre andrógino»
  alternative: Atenuarlo como «Padre de carácter masculino y femenino»
  rationale: La formulación directa conserva la tensión teológica y simbólica del documento.
- issue: Identidad del sujeto en «Él produce»
  choice: Mantener el pronombre masculino entre corchetes
  alternative: Identificar explícitamente al Hijo o al Padre
  rationale: El testimonio no permite fijar con plena seguridad el antecedente; se preserva la ambigüedad.
- issue: «Silencio silencioso»
  choice: Conservar la repetición
  alternative: Suavizar como «Silencio insondable» o «Silencio absoluto»
  rationale: La repetición puede reflejar una construcción técnica del original y no debe ser interpretada libremente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron corchetes, ángulos y elipsis como señales de restauración, adición editorial o pérdida textual. Se omitieron los números de página manuscrita que interrumpían las oraciones. Los nombres propios se adaptaron mínimamente a la acentuación española. Borrador necesariamente provisional porque la revisión directa del copto está pendiente y la base suministrada es un testimonio inglés de dominio público.
