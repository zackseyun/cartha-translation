translation:
  language: es
  text: 'Sus compañeros aparecieron para completar la Ogdóada del Dios autogenerado:


    la Gracia, del primer luminar, Harmozel;

    la Percepción, del segundo luminar, Oroiael;

    el Entendimiento, del tercer luminar, Davithe;

    el Discernimiento, del cuarto luminar, Eleleth.


    Esta es la primera Ogdóada del Dios autogenerado, y el Padre asintió en señal de aprobación. Toda la Plenitud de los Luminares se complació.


    Aparecieron los servidores:


    el primero, el gran Gamaliel, del primer gran luminar, Harmozel;

    y el gran Gabriel, del segundo gran luminar, Oroiael;

    y el gran Samlo[a], del gran luminar, Davithe;

    y el gran Abrasax, de […] [el gran luminar], Eleleth.


    Y los compañeros aparecieron conforme a la voluntad del beneplácito del Padre:


    la Memoria, del grande, Gamaliel, el primero;

    el Amor, del grande, Gabriel, el segundo;

    la Paz, del gran Samblo[b], el tercero;

    la Vida Eterna, del grande, Abrasax, el cuarto.


    Así quedaron completas las cinco Ogdóadas, cuarenta en total, como un poder que supera toda interpretación.


    Entonces el gran Logos autogenerado y la Palabra de la Plenitud de los cuatro luminares ofrecieron alabanza a:


    el gran Espíritu virginal, invisible e innombrable,

    es decir, el varón virgen,

    y el gran eón Doxomedón,

    y los tronos que hay dentro de ellos,

    y los poderes que los rodean,

    glorias, autoridades y poderes,

    <y> el niño triple-varón,

    y el varón virgen Youel,

    y Esephech, […], guardián del esplendor, [el niño] del niño,

    y la corona de [su] gloria,

    la Plenitud entera,

    y todas las glorias que allí habitan,

    las Plenitudes infinitas

    y los eones innombrables,


    para que nombraran al Padre, el cuarto, junto con la raza indestructible, y llamaran a la descendencia del Padre «la descendencia del gran Set».'
