lexical_decisions:
- source_word: Ogdoad
  choice: Ogdóada
  rationale: Se conserva el tecnicismo cosmológico y se adapta a la ortografía española; designa un conjunto de ocho.
- source_word: self-generated
  choice: autogenerado
  rationale: Mantiene la afirmación técnica del pasaje sin explicarla mediante una categoría teológica posterior.
- source_word: light
  choice: luminar
  rationale: En este contexto designa entidades o ámbitos celestes individualizados, no solo luz física; «luminar» permite conservar esa función nominal.
- source_word: Fullness
  choice: Plenitud
  rationale: Se usa mayúscula por su función cosmológica técnica, sin sustituirla por el préstamo «Pleroma» que no figura en el testimonio suministrado.
- source_word: proceeded
  choice: aparecieron
  rationale: En la secuencia emanativa, expresa que las figuras surgieron o se manifestaron; evita el poco natural «procedieron» entendido como iniciar una acción.
- source_word: ministers
  choice: servidores
  rationale: Comunica una función de servicio sin imponer el sentido eclesiástico moderno de «ministros».
- source_word: Discretion
  choice: Discernimiento
  rationale: Expresa la capacidad de distinguir o juzgar con prudencia y encaja mejor en la serie de facultades personificadas.
- source_word: Speech
  choice: Palabra
  rationale: Distingue de «Logos» a la vez que conserva la personificación de la expresión o palabra de la Plenitud.
- source_word: aeon
  choice: eón
  rationale: Conserva el término cosmológico técnico habitual y evita reducirlo simplemente a un período temporal.
- source_word: seed
  choice: descendencia
  rationale: En la referencia colectiva a la estirpe del Padre y de Set, «descendencia» comunica mejor el sentido genealógico en español actual.
theological_decisions:
- issue: Relación entre «Logos» y «Palabra»
  choice: 'Se conservaron como designaciones diferenciadas: «Logos» y «Palabra».'
  alternative: Traducir ambos como «Palabra» o «Verbo».
  rationale: El testimonio presenta dos expresiones coordinadas; unificarlas borraría una posible distinción interna.
- issue: Expresión paradójica «male virgin»
  choice: «varón virgen»
  alternative: «virgen masculino» o una reformulación explicativa.
  rationale: Se preserva deliberadamente la tensión de género del lenguaje fuente sin normalizarla ni interpretarla doctrinalmente.
- issue: «the Father, the fourth»
  choice: «el Padre, el cuarto»
  alternative: «el cuarto Padre» o explicar a qué serie pertenece.
  rationale: La aposición es ambigua en el testimonio; se conserva sin decidir si «cuarto» es título, posición o identificación.
- issue: Sujeto y finalidad de «might name»
  choice: «para que nombraran al Padre… y llamaran…»
  alternative: «para que pudieran nombrar…» o hacer explícito un sujeto concreto.
  rationale: Se mantiene indeterminado el sujeto plural y se expresa la finalidad sin añadir una identificación ausente.
- issue: Identificación de la «raza indestructible»
  choice: Se mantuvo como entidad coordinada sin explicación.
  alternative: Identificarla expresamente con la descendencia de Set.
  rationale: Aunque la cláusula siguiente las relaciona, el texto conserva una distinción sintáctica que no debe eliminarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los nombres propios transliterados, los términos cosmológicos técnicos, las mayúsculas funcionales y las señales editoriales < >, [ ] y […]. Los números de página manuscrita [11] y [12] no se incorporaron al cuerpo porque no pertenecen a la sintaxis. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto de NHC III,2 y IV,2.
