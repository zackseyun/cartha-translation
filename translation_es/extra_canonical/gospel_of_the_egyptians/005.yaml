translation:
  language: es
  text: '[] [...apareció de] aquel [lugar] la nube [de la] gran Luz, el poder viviente, la madre de los santos indestructibles, el gran poder, Mirotoe. Y ella dio a luz a aquel cuyo nombre pronuncio tres veces:


    IEN

    IEN

    EA

    EA

    EA,


    porque este es Adamas, la luz resplandeciente, que procede del Hombre, el Hombre Primordial, por medio de quien y para quien todo llegó a existir, y sin quien nada llegó a existir. El Padre incognoscible e inaprensible emanó y descendió de lo alto para poner fin a la deficiencia.


    Entonces el gran Logos, el Dios autogenerado, y el Hombre indestructible, Adamas, se unieron el uno con el otro. Llegó a existir un Logos del Hombre; pero el Hombre llegó a existir mediante un acto de habla. Él dirigió alabanzas a:


    el gran Espíritu virginal, invisible e inaprensible;


    la virgen masculina;


    el niño tres veces masculino;


    [] la [virgen] masculina, Youel;


    Esephech, guardián del esplendor;


    el niño del niño;


    la corona de su gloria;


    el gran eón Doxomedón;


    los tronos que están dentro de él;


    los poderes que lo rodean;


    las glorias;


    las realidades indestructibles;


    y toda su Plenitud, que mencioné anteriormente;


    la tierra del aire, la que recibe a Dios, donde los hombres santos de la gran Luz reciben una imagen;


    los hombres del Padre del Silencio viviente y silencioso;


    el Padre y toda su Plenitud, como mencioné anteriormente.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Se conserva el término técnico transliterado para no reducir su posible sentido de palabra, razón o entidad hipostática.
- source_word: Fullness
  choice: Plenitud
  rationale: Traducción natural que mantiene el uso cosmológico técnico del pasaje; la mayúscula señala su función como realidad o ámbito nombrado.
- source_word: aeon
  choice: eón
  rationale: Se mantiene el tecnicismo cosmológico en forma asentada en español, sin interpretarlo meramente como una duración temporal.
- source_word: self-generated
  choice: autogenerado
  rationale: Conserva la afirmación de origen propio sin sustituirla por términos doctrinales posteriores.
- source_word: deficiency
  choice: deficiencia
  rationale: Mantiene el contraste técnico con la Plenitud y evita explicarlo como pecado, mal o carencia específica.
- source_word: indestructibilities
  choice: realidades indestructibles
  rationale: El sustantivo abstracto plural resulta poco natural en español; se explicita mínimamente que designa entidades o realidades sin identificarlas más.
- source_word: abrogate
  choice: poner fin a
  rationale: Expresa de manera clara la eliminación o anulación de la deficiencia sin imponer el matiz jurídico de «derogar».
theological_decisions:
- issue: Relación entre el Logos, Adamas y el Hombre
  choice: Se conserva la distinción entre «el gran Logos», «un Logos del Hombre» y «el Hombre».
  alternative: Uniformar todas las expresiones como «la Palabra» o identificar sus referentes.
  rationale: El pasaje presenta relaciones emanativas ambiguas que no deben armonizarse ni identificarse silenciosamente.
- issue: Lenguaje paradójico de género
  choice: «la virgen masculina» y «el niño tres veces masculino»
  alternative: Suavizar las expresiones como «virgen varón» o reinterpretarlas simbólicamente.
  rationale: Se preserva la tensión deliberada del lenguaje cosmológico y de género del testimonio.
- issue: Origen del Hombre mediante habla
  choice: «mediante un acto de habla»
  alternative: «por la palabra»
  rationale: La formulación conserva la posible distinción entre Logos y una acción verbal creadora, sin resolver su relación.
- issue: Padre del Silencio
  choice: «el Padre del Silencio viviente y silencioso»
  alternative: «los hombres del Padre, de la viviente Silenciosa» u otra redistribución sintáctica.
  rationale: Se sigue provisionalmente la sintaxis del testimonio inglés, reconociendo que el texto copto aún requiere revisión directa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los corchetes y puntos suspensivos que señalan lagunas o restauraciones manuscritas, así como los nombres rituales en líneas separadas. Se omite el número de página manuscrita [10], pues no pertenece al discurso. Dado que la revisión directa del copto está pendiente, esta versión es provisional y se basa en el testimonio inglés público suministrado. Los nombres propios se transliteran de forma conservadora; «Doxomedón» recibe tilde conforme a la pronunciación española probable.
