translation:
  language: es
  text: 'Cinco mil años después, la gran luz Eleleth dijo: «Que haya un gobernante sobre el Caos y el Hades». Entonces apareció una nube [] [llamada] la Sofía material[a] [...].


    [Ella] contempló las regiones [del Caos]. Su rostro se parecía a [...] en su forma [...] sangre. Entonces [el gran] ángel Gamaliel habló [al gran Gabriel], servidor de [la gran luz] Oroiael. [Le dijo: «Que salga un] ángel [para] gobernar sobre el Caos [y el Hades]».


    Entonces la nube [obedeció y produjo] dos mónadas,[b] cada una [dotada] de luz. [... el trono] que ella había establecido en la nube [de arriba].


    Entonces Sakla, el gran [ángel, vio] al gran demonio [que lo acompañaba, Nebr]uel, y [juntos] se convirtieron en un espíritu de la tierra que engendra. [Engendraron] ángeles servidores.


    Sakla [dijo] al gran [demonio] Nebruel: «Que [los] doce eones[c] lleguen a existir en [el ...] eón, mundos [...]».


    [...] el gran ángel [Sakla] dijo, por voluntad del autogenerado:[d] [] «Habrá [...] contando siete [...]». Y dijo a los [grandes ángeles]: «Vayan, y [que cada] uno de ustedes gobierne su [propio mundo]».


    Cada uno [de estos] doce [ángeles] surgió:


    [El primer] ángel es Ath[oth]. [Él es aquel] a quien [las grandes] generaciones humanas llaman [...].


    [El] segundo es Harmas, [que] es [ojo de fuego].


    El tercero [es Galila].


    [El] cuarto es Yobel.


    [El quinto es] Adonaios, [llamado] Sabaoth.


    El sexto [es Caín, a quien] las [grandes generaciones] humanas llaman el sol.


    El [séptimo es Abel].


    El octavo es Akiressina.


    El [noveno es Yubel].


    El décimo es Harm[oupiael].


    [El] undécimo es Arch[ir-Adonin].


    El duodécimo [es Belias].


    [Estos son] los que están apostados sobre el Hades [y el Caos]. Después de la fundación [del mundo], Sakla dijo a sus [ángeles]: «Yo, sí, yo soy un Dios [celoso], y aparte de mí nada ha [llegado a existir», porque él] [] confiaba en su propia sustancia.


    Entonces una voz vino desde lo alto y dijo: «El Hombre existe, y el Hijo del Hombre».[e]


    El primer molde[f] fue formado a causa del descenso de la imagen de arriba, que refleja su voz en lo alto: la imagen que se asomó mediante el asomarse de la imagen de arriba. A causa de esto llegó a existir el Arrepentimiento.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Material» traduce el término técnico «hílico», es decir, perteneciente a la materia.
    reason: Aclara un término cosmológico poco común sin sobrecargar el texto principal.
  - marker: b
    text: Una «mónada» es una unidad singular; aquí el término parece tener un sentido cosmológico técnico.
    reason: Ayuda al lector común y conserva la cautela interpretativa.
  - marker: c
    text: «Eón» puede referirse a una edad, un ámbito o una entidad del orden celestial; el texto fragmentario no permite precisarlo en todos los casos.
    reason: Preserva la ambigüedad semántica del término.
  - marker: d
    text: «Autogenerado» designa al que llega a existir por sí mismo; no se especifica aquí su identidad.
    reason: Evita una identificación teológica importada.
  - marker: e
    text: «El Hombre» y «el Hijo del Hombre» parecen funcionar aquí como títulos o figuras celestiales, aunque el fragmento no explica plenamente su identidad.
    reason: Señala la posible función titular sin resolverla dogmáticamente.
  - marker: f
    text: También podría entenderse como «primera forma modelada».
    reason: Registra una alternativa natural para la metáfora de formación.
  - marker: g
    text: La mayúscula conserva la posibilidad de que «Arrepentimiento» esté personificado.
    reason: Explica una decisión editorial con implicaciones cosmológicas.
lexical_decisions:
- source_word: hylic Sophia
  choice: Sofía material
  rationale: «Hylic» significa relativo a la materia. Se traduce el calificativo para facilitar la comprensión, pero se conserva «Sofía» como nombre o figura técnica del relato.
- source_word: monads
  choice: mónadas
  rationale: Se conserva el término técnico «mónadas», pues «unidades» borraría sus posibles resonancias cosmológicas; una nota ofrece orientación básica.
- source_word: aeons
  choice: eones
  rationale: Se usa el término técnico habitual en textos cosmológicos antiguos, sin decidir si en cada aparición designa una entidad, una era o un ámbito.
- source_word: self-generated one
  choice: autogenerado
  rationale: Reproduce la idea de uno originado por sí mismo y evita identificarlo con una figura doctrinal no explícita en el pasaje.
- source_word: minister / ministering
  choice: servidor / servidores
  rationale: En español actual expresa una función subordinada de servicio sin la connotación política moderna de «ministro».
- source_word: first mold
  choice: primer molde
  rationale: Mantiene la metáfora concreta y la ambigüedad del testimonio, sin sustituirla interpretativamente por «cuerpo», «forma» o «modelo».
- source_word: Repentance
  choice: Arrepentimiento
  rationale: La mayúscula refleja que el término puede estar personificado o funcionar como entidad cosmológica, sin afirmarlo de manera concluyente.
theological_decisions:
- issue: La afirmación de Sakla de ser el único Dios
  choice: Se conserva como discurso directo de Sakla dentro de la narración
  alternative: Armonizarla con una confesión monoteísta normativa o explicarla como una mentira explícita
  rationale: El contexto crea tensión al contraponer la pretensión de Sakla con la voz de lo alto. La traducción no debe resolver esa valoración mediante añadidos.
- issue: «El Hombre» y «el Hijo del Hombre»
  choice: Mayúsculas y traducción literal
  alternative: «el ser humano y su hijo» o una identificación cristológica explícita
  rationale: La formulación parece titular o cosmológica, pero el fragmento por sí solo no permite imponer una identificación precisa.
- issue: Género de la nube/Sofía
  choice: Pronombre femenino «ella»
  alternative: Tratar «nube» solo como sustantivo inanimado sin referencia personal
  rationale: El testimonio vincula la nube con Sofía y luego emplea una referencia femenina; se conserva esa personificación.
- issue: Naturaleza de los eones
  choice: Mantener «eones» sin glosa interpretativa en el texto
  alternative: Traducir uniformemente «eras», «mundos» o «seres celestiales»
  rationale: El pasaje es fragmentario y parece yuxtaponer eones y mundos; elegir una sola ontología resolvería una ambigüedad genuina.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y puntos suspensivos para señalar lagunas y restauraciones del manuscrito; no se intentó reconstruir material ausente. Los nombres propios se mantuvieron en formas cercanas al testimonio suministrado, salvo «Caín», de uso asentado en español. Se eliminó el número de página intrusivo «[13]». Este borrador es necesariamente provisional porque el material proporcionado indica que sigue pendiente la revisión directa del copto de los códices de Nag Hammadi III,2 y IV,2.
