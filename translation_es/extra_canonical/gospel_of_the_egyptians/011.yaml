  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: es
  text: 'Ella recibió su plenitud y su poder por la voluntad y el beneplácito del Padre. Por ese beneplácito, él se complació en la gran estirpe indestructible e inconmovible de los grandes y poderosos hombres del gran Set, para sembrarla dentro de los eones que habían sido producidos y para que, por medio de ella, se colmara la deficiencia. Pues ella descendió desde lo alto hasta el mundo, como imagen de la noche. Después de manifestarse, intercedió por la descendencia del arconte de este eón y por <las> autoridades que procedieron de él: la descendencia contaminada del dios engendrador de demonios, que será destruido. También intercedió por la descendencia [] de Adán y del gran Set, que se asemeja al sol.


    Entonces llegó el gran ángel Hormos para preparar la descendencia del gran Set por medio de las vírgenes de la siembra contaminada de este eón, dentro de un vaso sagrado engendrado por el Logos mediante el Espíritu Santo.[a]


    Entonces llegó el gran Set con su descendencia, y esta fue sembrada dentro de los eones que habían sido producidos. El número de estos correspondía al valor numérico de «Sodoma».[b] Algunos dicen que Sodoma es el lugar donde el gran Set apacienta, es decir, Gomorra. Otros, en cambio, dicen que el gran Set sacó su plantío de Gomorra y lo trasplantó a un segundo lugar, al que llamó Sodoma.


    Esta es la estirpe que surgió por medio de Edokla, pues ella, al hablar, dio a luz a la Verdad y la Justicia, y fue el comienzo de la semilla de vida eterna destinada a quienes perseverarán gracias al conocimiento de su emanación. Esta es la gran estirpe indestructible que, atravesando tres [] mundos, ha llegado al mundo. El diluvio ocurrió como figura de la consumación del eón, pero será enviado al mundo por causa de esta estirpe.[c]


    Una conflagración alcanzará la tierra, y habrá gracia para los de la estirpe surgida por medio de los profetas y de los vigilantes que velan por la vida de la estirpe. Por causa de esta estirpe vendrán hambres y plagas; estas cosas sucederán por causa de la gran estirpe indestructible. Por causa de esta estirpe también llegarán pruebas, incluso el engaño de falsos profetas.


    Entonces el gran Set contempló la obra del diablo: sus muchos disfraces, sus intrigas contra la estirpe indestructible e inconmovible, las persecuciones de parte de sus poderes y sus ángeles, y el error por el cual actuaron contra sí mismos.


    Entonces el gran Set ofreció alabanza a:


    el gran Espíritu virginal e innombrable;


    la virgen varón [] Barbelón;


    el niño tres veces varón Telmael Telmael Heli Heli Machar Machar Set;


    el poder viviente, ALĒTHES ALĒTHŌS;[d]


    la virgen varón Youel;


    Esephech, guardián del esplendor, corona de su gloria;


    el gran eón Doxomedón;


    los tronos que están dentro de él;


    los poderes que los rodean;


    y toda la Plenitud, como mencioné anteriormente.


    Además, pidió que hubiera vigilantes sobre su descendencia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Logos» se conserva como término técnico. Los paréntesis editoriales del testimonio inglés alrededor de «con semilla» no se incorporan al texto corrido; la frase copta deberá revisarse directamente.
    reason: Advertir una decisión provisional basada en el testimonio indirecto y evitar una aclaración editorial poco natural.
  - marker: b
    text: El texto relaciona el número de los eones con el valor numérico de las letras de «Sodoma», probablemente mediante un procedimiento de equivalencia alfabética.
    reason: La referencia al «valor numérico» puede resultar opaca para lectores modernos.
  - marker: c
    text: El referente de «será enviado» parece ser «el diluvio», aunque la construcción y el cambio temporal son difíciles; se conserva la ambigüedad del testimonio.
    reason: Señalar una dificultad textual genuina sin corregirla de manera conjetural.
  - marker: d
    text: ALĒTHES ALĒTHŌS se deja sin traducir porque en este contexto puede ser una fórmula o un nombre; literalmente se relaciona con «verdadero» y «verdaderamente».
    reason: Preservar la posible función onomástica o litúrgica de la expresión griega.
lexical_decisions:
- source_word: completion
  choice: plenitud
  rationale: En este contexto cosmológico, «plenitud» expresa mejor un estado de realización completa que el más mecánico «completamiento».
- source_word: pleasure
  choice: beneplácito
  rationale: Conserva la relación con la voluntad favorable del Padre y mantiene un registro religioso digno sin identificarlo simplemente con placer emocional.
- source_word: race
  choice: estirpe
  rationale: Evita las connotaciones biológicas modernas de «raza» y comunica un linaje o colectividad de origen común.
- source_word: seed
  choice: descendencia / semilla
  rationale: Se usa «descendencia» cuando designa al grupo humano o espiritual, y «semilla» donde la metáfora de siembra y vida eterna es explícita.
- source_word: aeon
  choice: eón
  rationale: Se conserva el tecnicismo cosmológico, cuya referencia puede ser temporal o hipostática según el contexto.
- source_word: archon
  choice: arconte
  rationale: Se mantiene el término técnico habitual para una autoridad o gobernante cósmico en estos textos.
- source_word: Logos
  choice: Logos
  rationale: Se translitera el título técnico para no resolver si aquí significa Palabra, Razón o una entidad personificada.
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula señala que funciona como nombre o realidad cosmológica técnica.
- source_word: watchers
  choice: vigilantes
  rationale: Reproduce el sentido de quienes vigilan o custodian y permite conservar el juego verbal con «velan».
- source_word: unmoving
  choice: inconmovible
  rationale: Expresa estabilidad e inalterabilidad mejor que el sentido puramente espacial de «inmóvil».
theological_decisions:
- issue: Identidad y función de la figura femenina inicial
  choice: Conservar los pronombres femeninos sin identificarla por nombre
  alternative: Añadir el nombre inferido de una entidad cosmológica
  rationale: El fragmento suministrado comienza con un antecedente ausente; identificarla resolvería indebidamente una ambigüedad contextual.
- issue: Relación entre el beneplácito del Padre y la estirpe de Set
  choice: Mantener que el Padre se complace en la estirpe y la siembra en los eones
  alternative: Reformular como creación, elección o predestinación en categorías doctrinales posteriores
  rationale: La traducción conserva la imaginería propia del texto sin importarle un sistema teológico externo.
- issue: Ambigüedad de la intercesión por descendencias contrapuestas
  choice: Mantener que ella intercede tanto por la descendencia contaminada como por la de Adán y Set
  alternative: Cambiar la primera intercesión por una acusación o petición en contra
  rationale: Aunque produce tensión teológica, el testimonio dado expresa petición «en favor de» ambas y no debe armonizarse.
- issue: El diluvio y el futuro envío al mundo
  choice: Conservar el cambio de pasado a futuro y el pronombre implícitamente referido al diluvio
  alternative: Corregir el futuro o hacer que otro antecedente sea enviado
  rationale: La secuencia es difícil y posiblemente textual, pero la evidencia proporcionada no permite resolverla con seguridad.
- issue: Lenguaje masculino y virginal aplicado a seres celestes
  choice: Traducir literalmente «virgen varón» y «tres veces varón»
  alternative: Suavizarlo como «virgen masculino» o interpretarlo como androginia
  rationale: Las expresiones paradójicas parecen deliberadas y deben conservar su tensión sin explicación doctrinal añadida.
- issue: ALĒTHES ALĒTHŌS
  choice: Conservar la transliteración
  alternative: Traducir como «verdadero, verdaderamente»
  rationale: Puede funcionar como fórmula, nombre o expresión litúrgica; traducirla eliminaría esa ambigüedad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservan los términos cosmológicos técnicos «eón», «arconte», «Logos» y «Plenitud», así como los nombres propios y fórmulas transliteradas. Los corchetes vacíos [] señalan lagunas del manuscrito y los signos angulares <las> una restauración editorial. El borrador es necesariamente provisional porque la revisión directa del copto de los códices Nag Hammadi III,2 y IV,2 está pendiente; se ha trabajado con el testimonio inglés público suministrado, consultándolo como evidencia secundaria.
