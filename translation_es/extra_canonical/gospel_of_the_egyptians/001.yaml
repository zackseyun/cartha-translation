translation:
  language: es
  text: '[] El libro [sagrado] del [...] gran [Espíritu] invisible,


    el Padre cuyo nombre es impronunciable,

    que se originó] desde las alturas de [la Plenitud,

    la] Luz de Luz procedente de los eones de Luz,

    la Luz del [Silencio de la] Providencia

    y el Padre del Silencio,

    la [Luz] de la Palabra y la Verdad,

    la Luz de las [] [realidades indestructibles,

    la] Luz infinita,

    [el] resplandor procedente de los eones de la Luz

    del Padre que no puede ser revelado ni designado,

    que no envejece y no puede ser expresado,

    el eón de los eones,[a]

    el autogenerado, el que se genera a sí mismo, el que se produce a sí mismo,

    el extraño,

    el eón,

    VERDAD, ALĒTHŌS.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eón» puede referirse a una edad o duración inmensa y, en esta literatura, también a una realidad o ámbito celestial.
    reason: Aclara un término técnico polisémico sin fijar una sola interpretación.
  - marker: b
    text: ALĒTHŌS es una transliteración del griego y normalmente significa «verdaderamente» o «en verdad»; aquí se conserva porque puede funcionar como término formular o nombre.
    reason: Evita borrar la diferencia entre «VERDAD» y la forma griega transmitida.
lexical_decisions:
- source_word: sacred
  choice: sagrado
  rationale: Conserva el sentido religioso del título y permanece entre corchetes porque el testimonio señala una restauración.
- source_word: Fullness
  choice: Plenitud
  rationale: Equivalente tradicional y comprensible del término técnico referido a la totalidad del ámbito divino; la mayúscula conserva su carácter titular.
- source_word: aeon
  choice: eón
  rationale: Mantiene el tecnicismo cosmológico sin reducirlo simplemente a «edad» o «eternidad», sentidos que resolverían indebidamente su alcance.
- source_word: Speech
  choice: Palabra
  rationale: En este contexto personificado, «Palabra» resulta más natural y digna que «habla», sin identificarla expresamente con otra figura teológica.
- source_word: indestructibilities
  choice: realidades indestructibles
  rationale: El plural abstracto literal «indestructibilidades» sería poco natural en español; «realidades indestructibles» conserva la referencia plural sin definir más su naturaleza.
- source_word: undisclosable, unsignified
  choice: que no puede ser revelado ni designado
  rationale: 'Reproduce dos negaciones distintas: imposibilidad de darlo a conocer y de señalarlo o nombrarlo conceptualmente.'
- source_word: self-generated, self-generating, self-producing
  choice: el autogenerado, el que se genera a sí mismo, el que se produce a sí mismo
  rationale: Conserva la progresión entre estado, acción generativa y producción, evitando colapsar los tres títulos.
- source_word: alien
  choice: el extraño
  rationale: Preserva la alteridad expresada por el título sin imponer «extranjero» como referencia geográfica o política.
theological_decisions:
- issue: La identidad del «gran Espíritu invisible» y del «Padre»
  choice: Conservar los títulos tal como aparecen, sin equipararlos explícitamente con formulaciones doctrinales posteriores.
  alternative: Identificarlos o explicarlos mediante terminología trinitaria o confesional.
  rationale: El pasaje ofrece una serie de títulos propios de su cosmología y no explicita tal identificación.
- issue: Sentido de «eón»
  choice: Mantener «eón» como término técnico y añadir una nota breve.
  alternative: Traducir uniformemente como «eternidad», «era» o «mundo».
  rationale: El término puede designar duración, entidad o ámbito en este contexto; una sola paráfrasis eliminaría esa ambigüedad.
- issue: ALĒTHŌS junto a «VERDAD»
  choice: Conservar la forma transliterada en mayúsculas y explicar su posible valor griego en nota.
  alternative: Traducirla silenciosamente como «verdaderamente» o tratarla como simple repetición de «Verdad».
  rationale: Su función exacta en la secuencia puede ser formularia o titular, y el testimonio la presenta como una forma distinta.
translation_notes:
  register: Español latinoamericano neutral, actual y solemne. Se conservaron los corchetes, los puntos suspensivos y aun el corchete aislado del testimonio para representar sus señales de laguna y restauración, sin reconstruir material ausente. La traducción es provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa del copto está pendiente.
