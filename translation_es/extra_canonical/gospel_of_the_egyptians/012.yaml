review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés suministrado y conserva las lagunas y restauraciones. Sin embargo, varios nombres técnicos fueron hispanizados o alterados sin respaldo del testimonio (en particular Selmechel, Micheus, Michar, Sesengenpharanges, Mixanther y Michanor). También conviene no resolver explícitamente como «Esta luz» el antecedente sintácticamente incierto de la relativa sobre la preexistencia y la institución del bautismo.
  naturalness: El registro es generalmente claro y apropiado. Se han mantenido las largas enumeraciones y cierta aspereza sintáctica cuando reflejan la construcción difícil del testimonio. Se ajustan algunos términos para mayor naturalidad sin aclarar doctrinalmente los pasajes oscuros.
  terminology: Se conservan eón, arconte, Plenitud, Logos, Autogenerado y las cuatro Luces como términos cosmológicos. «Parusías» preserva el tecnicismo del testimonio mejor que «venidas». Los nombres no bíblicos se mantienen según la grafía del testimonio inglés, y «Set» se conserva como la forma española tradicional del nombre.
  issues:
  - severity: medium
    issue: Alteración de nombres técnicos propios
    rationale: La forma «Selmequel» no corresponde a Selmechel; asimismo, Micheus/Michar, Sesengenpharanges, Mixanther y Michanor fueron modificados. En una lista ritual y cosmológica de nombres, tales normalizaciones comprometen la trazabilidad al testimonio.
  - severity: medium
    issue: Resolución indebida de un antecedente incierto
    rationale: «Esta luz preexistía» identifica expresamente la gran luz como sujeto de dos relativas cuyo antecedente resulta sintácticamente difícil en el testimonio. Es preferible conservar la relativa sin una oración explicativa que cierre esa ambigüedad.
  - severity: low
    issue: «Venidas» pierde el tecnicismo de parousias
    rationale: El testimonio conserva «parousias» en griego. «Parusías» es comprensible en español académico y evita reducir el término a un único matiz interpretativo.
  - severity: low
    issue: Traducción de virgin Spirit
    rationale: «Espíritu virginal» es posible, pero «Espíritu virgen» conserva más directamente la aposición atributiva extraña del testimonio sin reformularla.
  revised_text: 'Entonces, de los grandes eones salieron cuatrocientos ángeles etéreos, entre los cuales estaban el gran Aerosiel y el gran Selmechel, para velar por la gran raza indestructible, por su fruto y por los grandes hombres del gran Set, desde el tiempo y el momento de la Verdad y la Justicia hasta la consumación del eón y de sus arcontes, a quienes los grandes jueces sentenciaron a muerte.


    Entonces el gran Set fue enviado por las cuatro Luces, conforme a la voluntad del Autogenerado, [a] y de toda la Plenitud, mediante <el don> y el beneplácito del gran Espíritu invisible, y los cinco sellos, y toda la Plenitud.


    Él atravesó las tres parusías que mencioné antes: el diluvio, la conflagración y la sentencia de los arcontes, las potencias y las autoridades, para que aquella que se había extraviado fuera salvada mediante la reconciliación del mundo y el bautismo por medio de un cuerpo engendrado por el Logos, el cual el gran Set preparó secretamente para sí mismo por medio de la virgen, a fin de que los santos fueran engendrados por el Espíritu santo mediante símbolos secretos e invisibles, mediante la reconciliación de mundo con mundo, mediante la renuncia al mundo y al dios de los trece eones, y mediante las sesiones de los santos indecibles e indestructibles, en el regazo y la gran Luz del Padre, que preexistía con su Providencia y que, por medio de ella, instituyó el bautismo sagrado que supera al cielo, mediante el Indestructible [b] engendrado por el Logos, es decir, el Viviente, Jesús, aquel de quien el gran Set se revistió. Por medio de él clavó a las potencias de los trece eones

    y confirmó a los que son producidos y retirados.


    Los equipó con la armadura del conocimiento de esta verdad, con una fuerza invencible de indestructibilidad. Se les aparecieron:


    el gran asistente Yesseus Mazareus Yessedekeus, el agua viva;


    los grandes jefes: Jacob el Grande, Teopemptos e Isavel;


    los que supervisan el manantial de la verdad: Micheus, Michar y Mnesinous;


    el que supervisa el bautismo para los vivientes;


    los que purifican;


    Sesengenpharanges;


    los que supervisan las puertas de las aguas: Micheus y Michar;


    los que supervisan la montaña elevada: Seldao y Elainos;


    los receptores de la gran raza;


    los poderosos indestructibles <del> gran Set;


    los servidores de las cuatro Luces: el gran Gamaliel, el gran Gabriel, el gran Samblo y el gran [c] Abrasax;


    los que supervisan la salida del sol: Olses, Hupneus y Heurumaious;


    los encargados de la entrada al reposo de la vida eterna, los gobernantes Mixanther y Michanor;


    los guardianes de las almas elegidas: Akramas y Strempouchos;


    la gran potencia Heli Heli Machar Machar Set;


    el gran Espíritu virgen, invisible, innombrable e inefable, y el Silencio;


    y la gran Luz Harmozel;


    el lugar del Autogenerado viviente, el Dios de verdad, y <el> que lo acompaña: el Hombre indestructible, Adamas;


    la segunda, Oroiael, el lugar del gran Set;


    y Jesús, quien posee vida y vino y crucificó lo que está en la Ley;


    la tercera, Davithe, el lugar de los hijos del gran Set;


