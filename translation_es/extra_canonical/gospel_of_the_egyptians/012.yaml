translation:
  language: es
  text: 'Entonces, de los grandes eones salieron cuatrocientos ángeles etéreos, entre los cuales estaban el gran Aerosiel y el gran Selmequel, para velar por la gran raza indestructible, por su fruto y por los grandes hombres del gran Set, desde el tiempo y el momento de la Verdad y la Justicia hasta la consumación del eón y de sus arcontes, a quienes los grandes jueces sentenciaron a muerte.


    Entonces el gran Set fue enviado por las cuatro luminarias, conforme a la voluntad del Autogenerado, [a] y de toda la Plenitud, mediante <el don> y el beneplácito del gran Espíritu invisible, y los cinco sellos, y toda la Plenitud.


    Él atravesó las tres venidas que mencioné antes: el diluvio, la conflagración y la sentencia de los arcontes, las potencias y las autoridades, para que aquella que se había extraviado fuera salvada mediante la reconciliación del mundo y el bautismo por medio de un cuerpo engendrado por el Logos. El gran Set preparó en secreto ese cuerpo para sí mismo por medio de la virgen, a fin de que los santos fueran engendrados por el Espíritu santo mediante símbolos secretos e invisibles; mediante la reconciliación de mundo con mundo; mediante la renuncia al mundo y al dios de los trece eones; y mediante las moradas de los santos indecibles e indestructibles, en el regazo y la gran luz del Padre. Esta luz preexistía junto con su Providencia, y por medio de ella estableció el bautismo sagrado que supera al cielo, mediante el Indestructible [b] engendrado por el Logos, es decir, el Viviente, Jesús, aquel de quien el gran Set se revistió. Por medio de él clavó a las potencias de los trece eones y
    confirmó a los que son producidos y apartados.


    Los equipó con la armadura del conocimiento de esta verdad, con la fuerza invencible de la indestructibilidad. Se les aparecieron:


    el gran servidor Yesseus Mazareus Yessedekeus, el agua viva;


    los grandes jefes: Jacobo el Grande, Teopemptos e Isavel;


    los que supervisan el manantial de la verdad: Miqueus, Micar y Mnesinous;


    el que supervisa el bautismo para los vivientes;


    los que purifican;


    Sesengenfaranges;


    los que supervisan las puertas de las aguas: Miqueus y Micar;


    los que supervisan la montaña elevada: Seldao y Elainos;


    los receptores de la gran raza;


    los poderosos indestructibles <del> gran Set;


    los servidores de las cuatro luminarias: el gran Gamaliel, el gran Gabriel, el gran Samblo y el gran [c] Abrasax;


    los que supervisan la salida del sol: Olses, Hupneus y Heurumaious;


    los encargados de la entrada al reposo de la vida eterna, los gobernantes Mixanter y Micanor;


    los guardianes de las almas elegidas: Akramas y Strempouchos;


    la gran potencia Heli Heli Machar Machar Set;


    el gran Espíritu virginal, invisible, innombrable e inefable, y el Silencio;


    y la gran luminaria Harmozel;


    el lugar del Autogenerado viviente, el Dios de la verdad, y <el> que lo acompaña: el Hombre indestructible, Adamas;


    la segunda, Oroiael, el lugar del gran Set;


    y Jesús, quien posee la vida, quien vino y crucificó lo que está en la Ley;


    la tercera, Davithe, el lugar de los hijos del gran Set;


    la cuarta, Eleleth, el lugar de las almas de los hijos que reposan;


    la quinta, Yoel, quien está encargado del nombre de aquel que será designado para bautizar con el bautismo sagrado que supera al cielo indestructible.


    Pero de ahora en adelante, [d] por medio del Hombre indestructible Poimael y de quienes son dignos de súplica, las renuncias de los cinco sellos junto al manantial bautismal, conocerán a sus receptores cuando reciban instrucción acerca de ellos; estos, a su vez, los conocerán, y ellos no probarán la muerte en absoluto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquí hay una laguna en el manuscrito.
    reason: Señalar una pérdida textual conservada como corchetes vacíos en el testimonio.
  - marker: b
    text: Aquí hay una laguna en el manuscrito.
    reason: Señalar una pérdida textual conservada como corchetes vacíos en el testimonio.
  - marker: c
    text: Aquí hay una laguna en el manuscrito entre «gran» y «Abrasax».
    reason: Advertir que el título o nombre pudo contener material ahora perdido.
  - marker: d
    text: Aquí hay una laguna en el manuscrito. La sintaxis de la oración final es incierta.
    reason: La pérdida textual contribuye a una construcción oscura; se evita ocultar la incertidumbre.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Se conserva el término técnico propio de la cosmología del escrito, sin reducirlo a «edades» ni «mundos».
- source_word: archons
  choice: arcontes
  rationale: Transliteración técnica habitual que evita interpretar estas figuras simplemente como gobernantes humanos.
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula señala su función como realidad cosmológica técnica, equivalente a Pléroma, sin introducir una transliteración no presente en el testimonio suministrado.
- source_word: self-generated one
  choice: Autogenerado
  rationale: Expresa la idea de origen en sí mismo y mantiene el uso sustantivado del título.
- source_word: parousias
  choice: venidas
  rationale: Traducción inteligible que conserva la noción de llegadas o manifestaciones sin imponer el sentido cristiano posterior de una única «segunda venida».
- source_word: Logos
  choice: Logos
  rationale: Se retiene el término técnico debido a su densidad conceptual y para no decidir unilateralmente entre «Palabra», «Verbo» o «Razón».
- source_word: sessions
  choice: moradas
  rationale: En el contexto de seres santos situados en la luz del Padre, «moradas» ofrece una lectura natural; la base inglesa es difícil y la revisión copta sigue pendiente.
- source_word: receivers
  choice: receptores
  rationale: Se mantiene la función técnica de quienes reciben a miembros o almas de la raza, sin explicitar una identidad no segura.
- source_word: repose
  choice: reposo
  rationale: Conserva el valor religioso del descanso escatológico y armoniza con «los hijos que reposan».
- source_word: baptism-spring
  choice: manantial bautismal
  rationale: Reproduce ambos componentes de la expresión de manera natural en español.
theological_decisions:
- issue: Identidad entre Set y Jesús
  choice: «Jesús, aquel de quien el gran Set se revistió»
  alternative: «Jesús, aquel a quien el gran Set revistió»
  rationale: La sintaxis del testimonio presenta a Jesús como la figura que Set «se puso» o asumió; se preserva esa cristología distintiva sin armonizarla con formulaciones canónicas.
- issue: Objeto de la crucifixión
  choice: «crucificó lo que está en la Ley»
  alternative: «fue crucificado conforme a la Ley»
  rationale: Se mantiene la afirmación extraña y tensa del testimonio, donde Jesús actúa sobre «lo que está en la Ley», sin normalizarla.
- issue: Referente femenino de quien se extravió
  choice: «aquella que se había extraviado»
  alternative: identificarla como Sabiduría, alma o raza
  rationale: El referente no está explícito en el fragmento; se conserva la ambigüedad gramatical y teológica.
- issue: Espíritu virginal
  choice: «el gran Espíritu virginal»
  alternative: «la gran virgen Espíritu»
  rationale: La formulación elegida es natural en español y no fuerza género femenino ontológico para «Espíritu», aunque conserva el atributo virginal.
- issue: Providencia y luz
  choice: «Esta luz preexistía junto con su Providencia»
  alternative: hacer que el antecedente sea el Padre o el regazo
  rationale: Se explicita solo el antecedente gramatical más cercano para facilitar la lectura, sin desarrollar una identificación doctrinal adicional.
translation_notes:
  register: Español latinoamericano neutral, digno y actual. Se conservaron los nombres propios y los términos cosmológicos especializados sin armonización confesional. Las restauraciones editoriales permanecen entre corchetes angulares; las lagunas se señalan mediante notas. Debido a que la revisión directa del copto está pendiente, las decisiones difíciles se consideran provisionales y se basan en el testimonio inglés público suministrado.
