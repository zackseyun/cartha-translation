    Él atravesó las tres parusías que mencioné antes: el diluvio, la conflagración y la sentencia de los arcontes, las potencias y las autoridades, para que aquella que se había extraviado fuera salvada mediante la reconciliación del mundo y el bautismo por medio de un cuerpo engendrado por el Logos, que el gran Set preparó secretamente para sí mismo por medio de la virgen, a fin de que los santos fueran engendrados por el Espíritu Santo mediante símbolos secretos e invisibles, mediante la reconciliación de mundo con mundo, mediante la renuncia al mundo y al dios de los trece eones, y mediante las asambleas de los santos indecibles e indestructibles, en el regazo y la gran luz del Padre, que preexistía con su Providencia y que, por medio de ella, instituyó el bautismo sagrado que supera al cielo, mediante el Indestructible [b] engendrado por el Logos, es decir, el Viviente, Jesús, aquel de quien el gran Set se revistió. Por medio de él clavó a las potencias de los trece eones

