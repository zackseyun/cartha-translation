base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: es
  text: '(1) Pero ninguno de los judíos se lavó las manos, ni Herodes ni ninguno de sus jueces. Como no quisieron lavárselas, Pilato se levantó. (2) Entonces el rey Herodes ordenó que llevaran al Señor ante él y les dijo: «Hagan con él todo lo que les ordené».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. La revisión directa del texto griego del Códice de Akhmim aún está pendiente.
    reason: La fuente proporcionada identifica el griego como lengua antigua, pero solo ofrece como base de trabajo un testimonio inglés y advierte que falta la revisión en la lengua fuente.
lexical_decisions:
- source_word: washed the hands
  choice: se lavó las manos / lavárselas
  rationale: Conserva el gesto explícito del testimonio disponible y usa una formulación natural en español.
- source_word: judges
  choice: jueces
  rationale: Traducción directa que mantiene abierta la identidad y función precisa de estos personajes.
- source_word: stood up
  choice: se levantó
  rationale: Reproduce el movimiento indicado sin inferir que Pilato se retiró o dio por terminada la sesión.
- source_word: the Lord
  choice: el Señor
  rationale: Mantiene el título cristológico del testimonio, sin sustituirlo por un nombre propio.
- source_word: to be brought
  choice: que llevaran al Señor ante él
  rationale: Expresa con naturalidad la orden de presentar al Señor delante de Herodes, siguiendo la lectura contextual del testimonio inglés.
theological_decisions:
- issue: Responsabilidad de los judíos, Herodes y sus jueces en el gesto de lavarse las manos
  choice: Conservar la atribución colectiva tal como aparece en el testimonio
  alternative: Suavizar o reinterpretar la referencia como limitada a ciertos dirigentes
  rationale: La traducción no debe alterar la afirmación del documento, aunque su lenguaje polémico exige leerse en su contexto literario e histórico.
- issue: Sentido de la orden final de Herodes
  choice: «Hagan con él todo lo que les ordené»
  alternative: «Hagan todo lo que les mandé hacerle»
  rationale: La opción elegida conserva el alcance amplio y ligeramente ambiguo de la orden, sin especificar acciones que el fragmento no enumera.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la numeración de las secciones y se evita añadir explicaciones al cuerpo del texto. La redacción es provisional porque no se proporcionó el texto griego para cotejo directo.
