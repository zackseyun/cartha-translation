review_pass:
  verdict: revise
  source_fidelity: La versión reproduce fielmente la secuencia y los participantes del testimonio inglés disponible. Sin embargo, «ante él» añade un destino explícito que no figura en el testimonio («ordered the Lord to be brought») y que no debe incorporarse mientras el cotejo griego directo siga pendiente.
  naturalness: El español es claro, actual y de registro apropiado. «Como no quisieron lavarse las manos» evita la posible ambigüedad pronominal de «lavárselas»; «Háganle todo lo que les ordené» expresa de modo más directo la orden final sin precisar su contenido.
  terminology: «Judíos», «jueces», «el Señor» y los nombres propios están bien mantenidos. Se conserva el título «el Señor» sin introducir interpretaciones adicionales.
  issues:
  - severity: medium
    issue: Adición de «ante él» en la orden de Herodes.
    rationale: El testimonio inglés suministrado solo dice que Herodes ordenó que llevaran al Señor; no dice que fuera llevado ante Herodes. La adición restringe innecesariamente el sentido y no está justificada por la base de trabajo proporcionada.
  - severity: low
    issue: Referencia pronominal en «Como no quisieron lavárselas».
    rationale: Aunque se entiende por el contexto, repetir «las manos» resulta más nítido en español y conserva el gesto expresado en el testimonio.
  revised_text: '(1) Pero ninguno de los judíos se lavó las manos, ni Herodes ni ninguno de sus jueces. Como no quisieron lavarse las manos, Pilato se levantó. (2) Entonces Herodes el rey ordenó que llevaran al Señor y les dijo: «Háganle todo lo que les ordené».[a]'
  revised_footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. La revisión directa del texto griego del Códice de Akhmim aún está pendiente.
    reason: La fuente proporcionada identifica el griego como lengua antigua, pero solo ofrece como base de trabajo un testimonio inglés y advierte que falta la revisión en la lengua fuente.
  revision_rationale: Se elimina «ante él», detalle no atestiguado en la base inglesa provista. Se hacen ajustes menores de claridad idiomática sin alterar la ambigüedad ni ampliar el contenido de la orden de Herodes. Se mantiene la nota provisional anclada al final del pasaje.
