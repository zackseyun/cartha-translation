    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: es
  text: '(3) José estaba allí, amigo de Pilato y del Señor. Al ver que estaban a punto de crucificarlo, fue ante Pilato y le pidió el cuerpo del Señor para sepultarlo. (4) Pilato mandó un mensaje a Herodes y le pidió el cuerpo.


    (5) Herodes dijo: «Hermano Pilato, aunque nadie lo hubiera pedido, nosotros lo habríamos sepultado, pues también está por comenzar el sábado. Porque está escrito en la Ley: “Que el sol no se ponga sobre alguien que ha sido ejecutado”».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto griego del Códice de Akhmim (P.Cair. 10759).
    reason: La fuente proporcionada indica expresamente que todavía no se ha realizado la revisión en la lengua original; la nota hace transparente esa limitación textual.
lexical_decisions:
- source_word: friend
  choice: amigo
  rationale: Conserva de manera directa la relación expresada por el testimonio disponible, sin precisar una función oficial no indicada.
- source_word: body
  choice: cuerpo
  rationale: Mantiene la referencia concreta al cadáver de Jesús y la repetición del texto.
- source_word: for burial
  choice: para sepultarlo
  rationale: Expresa en español natural la finalidad de la petición sin añadir detalles funerarios.
- source_word: Sabbath
  choice: sábado
  rationale: Es el término bíblico tradicional y comprensible en español para el día judío de reposo.
- source_word: one who's been killed
  choice: alguien que ha sido ejecutado
  rationale: En este contexto legal, «ejecutado» comunica que la muerte fue infligida como pena, evitando reducir la expresión a un homicidio común.
theological_decisions:
- issue: La relación de José con Pilato y con el Señor
  choice: «amigo de Pilato y del Señor»
  alternative: «amigo tanto de Pilato como del Señor»
  rationale: Se conserva la doble relación tal como aparece en el testimonio, sin explicar cómo debe entenderse cada amistad.
- issue: Autoridad de Herodes sobre la entrega del cuerpo
  choice: Pilato le pide el cuerpo a Herodes
  alternative: Pilato consulta a Herodes acerca del cuerpo
  rationale: Se mantiene la formulación llamativa del testimonio, sin armonizarla con los relatos canónicos ni explicar la jurisdicción implícita.
- issue: Cita atribuida a la Ley
  choice: «Que el sol no se ponga sobre alguien que ha sido ejecutado»
  alternative: «El sol no debe ponerse sobre un muerto»
  rationale: La versión conserva la aplicación del precepto a una persona ejecutada y no identifica de manera editorial un pasaje concreto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «sepultar» por su claridad y tono narrativo bíblico, «sábado» en su sentido judío y puntuación española para el discurso directo. Se conserva la estructura y la tensión histórica del testimonio sin armonización.
