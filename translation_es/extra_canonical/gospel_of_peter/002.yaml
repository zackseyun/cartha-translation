  naturalness: El texto es claro y de registro bíblico actual. Se ajusta levemente el orden de «también» en la frase sobre el sábado para que la relación con la formulación de Herodes sea más natural y transparente en español.
  terminology: «Señor», «cuerpo», «sepultar», «sábado» y «Ley» son términos adecuados, consistentes y comprensibles en español latinoamericano neutral. Se mantiene «Herodes» sin especificar una identidad o función no indicada por el testimonio.
