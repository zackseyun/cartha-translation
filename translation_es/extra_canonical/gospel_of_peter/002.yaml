review_pass:
  verdict: revise
  source_fidelity: 'La traducción reproduce fielmente el contenido del testimonio inglés suministrado: la doble amistad de José, la petición del cuerpo para la sepultura, la consulta de Pilato a Herodes y la motivación ligada al comienzo del sábado. No se armoniza el pasaje con los evangelios canónicos. La revisión directa del griego sigue pendiente, por lo que no es posible confirmar matices del Códice de Akhmim más allá del testimonio provisto.'
  naturalness: El texto es claro y de registro bíblico actual. Se ajustan «mandó un mensaje» por «envió un mensaje» y «para sepultarlo» por «para darle sepultura», formulaciones algo más naturales y precisas en este contexto. Se reordena «también» para reflejar con mayor fluidez la construcción del testimonio.
  terminology: «Señor», «Ley», «sábado», «cuerpo» y «sepultura» son apropiados para el registro y no introducen interpretaciones doctrinales. «El que ha sido ejecutado» conserva el sentido de muerte infligida presente en el testimonio, sin identificar editorialmente la cita legal ni imponer una referencia textual específica.
  issues:
  - severity: low
    issue: Redacción de la misión de Pilato a Herodes
    rationale: «Mandó un mensaje» es comprensible, pero «envió un mensaje» resulta más idiomático en español latinoamericano y sigue el «sent word» de la auditoría inglesa.
  - severity: low
    issue: Finalidad funeraria
    rationale: «Para darle sepultura» evita una referencia pronominal menos fluida y conserva exactamente la finalidad expresada por «for burial».
  - severity: low
    issue: Posición de «también» en la frase sobre el sábado
    rationale: «Pues el sábado también está por comenzar» expresa más naturalmente el matiz aditivo del testimonio sin cambiar su alcance.
  revised_text: '(3) José estaba allí, amigo de Pilato y del Señor. Al ver que estaban a punto de crucificarlo, fue ante Pilato y le pidió el cuerpo del Señor para darle sepultura. (4) Pilato envió un mensaje a Herodes y le pidió el cuerpo.


    (5) Herodes dijo: «Hermano Pilato, aunque nadie lo hubiera pedido, nosotros lo habríamos sepultado, pues el sábado también está por comenzar. Porque está escrito en la Ley: “Que el sol no se ponga sobre el que ha sido ejecutado”».[a]'
  revised_footnotes:
  - marker: a
    text: Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto griego del Códice de Akhmim (P.Cair. 10759).
    reason: La fuente proporcionada indica expresamente que todavía no se ha realizado la revisión en la lengua original; la nota hace transparente esa limitación textual.
  revision_rationale: Se aplican únicamente mejoras estilísticas seguras que mantienen el sentido y las ambigüedades del testimonio disponible. Se conserva la nota de transparencia, pues la fuente griega aún no ha sido revisada directamente.
