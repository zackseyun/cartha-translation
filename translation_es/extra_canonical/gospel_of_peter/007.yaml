  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: es
  text: 'Entonces los judíos, los ancianos y los sacerdotes, al comprender cuánto daño se habían hecho a sí mismos, comenzaron a lamentarse y a decir: «¡Ay de nuestros pecados! ¡Se acercan el juicio y el fin de Jerusalén!»[a]


    Pero yo y mis compañeros estábamos afligidos y, heridos en lo más profundo, permanecíamos escondidos, porque nos buscaban como si fuéramos malhechores y quisiéramos incendiar el templo.[b] Además de todo esto, ayunábamos sentados, lamentándonos y llorando noche y día, hasta el sábado.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión puede entenderse como dos realidades relacionadas —el juicio y el fin de Jerusalén—; el texto no explica si son idénticas.
    reason: Preservar la ambigüedad escatológica y sintáctica.
  - marker: b
    text: Es decir, los buscaban acusándolos de ser malhechores y de querer incendiar el templo.
    reason: Evitar que la construcción se interprete como admisión de culpabilidad.
  - marker: c
    text: También podría entenderse que ayunaron y lloraron hasta que llegó el sábado; el testimonio disponible no precisa qué hicieron después.
    reason: Delimitar el alcance temporal sin añadir información.
lexical_decisions:
- source_word: the Jews
  choice: los judíos
  rationale: Conserva la designación colectiva del testimonio disponible sin ampliarla ni sustituirla; el contexto enumera además a los ancianos y sacerdotes.
- source_word: wrong ... done to themselves
  choice: daño se habían hecho a sí mismos
  rationale: Mantiene el sentido reflexivo y evita especificar una culpa o perjuicio que el testimonio inglés no define con precisión.
- source_word: judgment
  choice: juicio
  rationale: Conserva la posible dimensión judicial y teológica del término sin resolverla como mero castigo.
- source_word: being wounded in mind
  choice: heridos en lo más profundo
  rationale: Expresa en español natural un dolor interior intenso sin convertirlo en una lesión física ni en un diagnóstico psicológico moderno.
- source_word: wrongdoers
  choice: malhechores
  rationale: Término digno y comprensible para personas acusadas de obrar mal, sin añadir una categoría jurídica más específica.
- source_word: the Sabbath
  choice: el sábado
  rationale: Es la forma bíblica habitual y clara en español neutral para el día sabático.
theological_decisions:
- issue: Relación entre «el juicio» y «el fin de Jerusalén»
  choice: «Se acercan el juicio y el fin de Jerusalén»
  alternative: «Se acerca el juicio, es decir, el fin de Jerusalén»
  rationale: Se conserva la coordinación del testimonio y no se identifica silenciosamente el juicio con el fin de Jerusalén.
- issue: Responsabilidad expresada por «se habían hecho a sí mismos»
  choice: Mantener la construcción reflexiva
  alternative: «el mal que habían cometido»
  rationale: La alternativa desplazaría el énfasis desde el daño sufrido por ellos mismos hacia una formulación general de culpa; se preserva la tensión del texto.
- issue: Acusación de querer incendiar el templo
  choice: Presentarla como acusación mediante «como si... quisiéramos»
  alternative: «porque éramos malhechores y queríamos incendiar el templo»
  rationale: El narrador afirma que eran buscados bajo esa imputación, no que la acusación fuera verdadera.
