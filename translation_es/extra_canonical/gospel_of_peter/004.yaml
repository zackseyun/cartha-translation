source:
  text: '(10) And they brought two wrongdoers and crucified the Lord in the middle of them, but he was silent as if having no pain. (11) And when they set up the cross, they wrote that "This is the king of Israel." (12) And having laid the clothes in front of him, they divided them and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We, because of the wrong that we did, are suffering this way, but this one, having become Savior of humanity, what wrong has he done to you?"


    (14) And they were angry at him. They commanded that the legs not be broken, so that he might die tortured.'
