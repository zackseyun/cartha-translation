base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: es
  text: '(10) Llevaron a dos malhechores y crucificaron al Señor en medio de ellos, pero él guardaba silencio, como si no sintiera dolor. (11) Cuando levantaron la cruz, escribieron: «Este es el rey de Israel». (12) Pusieron sus ropas delante de él, las repartieron y echaron suertes sobre ellas.


    (13) Pero uno de aquellos malhechores los reprendió diciendo: «Nosotros sufrimos así por el mal que hicimos; pero este, que llegó a ser el Salvador de la humanidad, ¿qué mal les ha hecho a ustedes?».


    (14) Ellos se enojaron con él y ordenaron que no le quebraran las piernas, para que muriera atormentado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'El relato parece referirse al malhechor que los reprendió: ordenaron no quebrarle las piernas para prolongar su sufrimiento. Sin embargo, la referencia de los pronombres no es totalmente inequívoca.'
    reason: Preservar la ambigüedad señalada en la capa de consulta inglesa sin volver confuso el texto principal.
lexical_decisions:
- source_word: wrongdoers
  choice: malhechores
  rationale: Término natural y digno que expresa la conducta delictiva sin precisar delitos que el testimonio no identifica.
- source_word: was silent
  choice: guardaba silencio
  rationale: Conserva el aspecto continuado de la expresión y su tono narrativo.
- source_word: set up the cross
  choice: levantaron la cruz
  rationale: Expresa con naturalidad el acto de erigirla, sin añadir detalles ausentes del testimonio.
- source_word: Savior of humanity
  choice: Salvador de la humanidad
  rationale: Mantiene el título teológico y el alcance humano universal de la frase transmitida.
- source_word: die tortured
  choice: muriera atormentado
  rationale: Reproduce la idea de una muerte prolongada mediante sufrimiento, con español claro y sobrio.
theological_decisions:
- issue: Aparente ausencia de dolor del Señor
  choice: como si no sintiera dolor
  alternative: sin sentir dolor
  rationale: La comparación conserva la cautela del testimonio («como si») y evita afirmar como hecho una ausencia absoluta de dolor.
- issue: Llegar a ser Salvador de la humanidad
  choice: que llegó a ser el Salvador de la humanidad
  alternative: que es el Salvador de la humanidad
  rationale: Se mantiene la formulación temporal del testimonio en vez de sustituirla por una afirmación atemporal que eliminaría su tensión teológica.
- issue: Referente de la orden de no quebrar las piernas
  choice: no le quebraran las piernas
  alternative: no les quebraran las piernas
  rationale: El singular se ajusta al malhechor que acaba de reprenderlos, pero el encadenamiento pronominal admite discusión; la nota hace explícita esta incertidumbre textual e interpretativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usan «ustedes» y construcciones narrativas claras. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del griego del Códice de Akhmim.
