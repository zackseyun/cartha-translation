source:
  text: '(55) And having gone, they found the tomb had been opened. And having approached, they bent down and saw there a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) "Why did you come? Whom do you seek? Not that one who was crucified? He arose and went away. But if you don''t believe, bend down and see where he was lying, that he''s not there, because he arose and went to where he came from."


    (57) Then the women were afraid, and fled.'
