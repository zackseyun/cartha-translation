base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: es
  text: '(55) Ellas fueron y encontraron que el sepulcro había sido abierto.[a] Al acercarse, se inclinaron y vieron allí a cierto joven sentado en medio del sepulcro. Era de hermosa apariencia y estaba vestido con una túnica larga y resplandeciente. Él les dijo: (56) «¿Por qué vinieron? ¿A quién buscan? ¿No es al que fue crucificado? Resucitó y se fue. Pero, si no creen, inclínense y miren el lugar donde yacía: no está allí, porque resucitó y fue adonde había venido».


    (57) Entonces las mujeres tuvieron miedo y huyeron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del texto griego del Códice de Akhmim (P.Cair. 10759).
    reason: La información proporcionada indica que la revisión en la lengua antigua aún no se ha realizado, por lo que debe transparentarse la base documental limitada.
lexical_decisions:
- source_word: tomb
  choice: sepulcro
  rationale: Es una palabra natural y digna en español bíblico contemporáneo; aquí designa tanto la estructura funeraria como su espacio interior.
- source_word: young man
  choice: cierto joven
  rationale: Conserva la presentación indefinida del testigo inglés sin identificar explícitamente al personaje como ángel.
- source_word: beautiful
  choice: de hermosa apariencia
  rationale: Expresa con naturalidad que el joven era bello, sin hacer que el adjetivo parezca describir su carácter moral.
- source_word: long, shining robe
  choice: túnica larga y resplandeciente
  rationale: Mantiene los rasgos visibles de la vestidura con vocabulario claro y digno.
- source_word: arose
  choice: resucitó
  rationale: En el contexto de quien fue crucificado, comunica de manera natural el sentido de volver a la vida; no añade quién produjo la resurrección.
- source_word: went to where he came from
  choice: fue adonde había venido
  rationale: Conserva la formulación extraña y teológicamente sugerente del testigo, sin precisar un destino que el texto no nombra.
theological_decisions:
- issue: Identidad del joven en el sepulcro
  choice: «cierto joven»
  alternative: «un ángel»
  rationale: El pasaje lo llama joven y describe su aspecto, pero no lo identifica expresamente como ángel.
- issue: Sentido de «arose»
  choice: «resucitó»
  alternative: «se levantó»
  rationale: El referente es el crucificado ausente del sepulcro, por lo que «resucitó» expresa el sentido contextual normal en español, mientras se conserva sin especificar el agente de la acción.
- issue: Destino posterior del crucificado
  choice: «fue adonde había venido»
  alternative: «volvió al lugar de donde había venido»
  rationale: La opción elegida reproduce la tensión de la expresión transmitida y evita convertirla explícitamente en un regreso o identificar el lugar.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvo la numeración tradicional de las secciones y la repetición enfática de «resucitó y se fue». Se evitó identificar al joven como ángel o explicar el destino de Jesús. Dado que la revisión griega está pendiente, las decisiones se apoyan provisionalmente en el testigo inglés público suministrado.
