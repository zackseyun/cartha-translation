translation:
  language: es
  text: 'Y lo entregó al pueblo antes del primer día de su fiesta de los Panes sin Levadura. (6) Los que tomaron al Señor echaron a correr mientras lo empujaban y decían: «¡Arrastremos al Hijo de Dios, ahora que tenemos poder sobre él!».


    (7) Lo vistieron de púrpura y lo sentaron en el tribunal, diciendo: «¡Juzga con justicia, rey de Israel!». (8) Uno de ellos trajo una corona de espinas y la puso sobre la cabeza del Señor.


    (9) Otros de los presentes le escupían en el rostro, y otros le daban bofetadas. Unos lo punzaban con una caña, y algunos lo azotaban, diciendo: «¡Honremos con este honor al Hijo de Dios!».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Unleavened Bread
  choice: Panes sin Levadura
  rationale: Nombre claro y tradicional de la festividad judía, conservando la referencia específica del testimonio.
- source_word: were running, pushing him
  choice: echaron a correr mientras lo empujaban
  rationale: Reproduce las acciones simultáneas sin forzar una relación no expresada por el testimonio.
- source_word: having authority over him
  choice: ahora que tenemos poder sobre él
  rationale: Conserva la afirmación irónica de dominio y la vincula naturalmente con la exhortación precedente.
- source_word: purple
  choice: púrpura
  rationale: Mantiene el color y su asociación regia sin añadir una prenda que el testimonio no especifica.
- source_word: seat of judgment
  choice: tribunal
  rationale: Equivalente natural en español para el asiento o lugar desde el cual se dicta juicio.
- source_word: piercing him with a reed
  choice: lo punzaban con una caña
  rationale: Conserva la acción repetida y el instrumento; evita convertirla en un simple golpe.
- source_word: scourging
  choice: lo azotaban
  rationale: Término corriente y digno para el castigo corporal descrito.
theological_decisions:
- issue: La autoridad de los agresores sobre el Hijo de Dios
  choice: «ahora que tenemos poder sobre él»
  alternative: «pues tenemos autoridad sobre él»
  rationale: Se preserva la pretensión blasfema e irónica de los agresores sin explicar si tal poder es político, físico o teológico.
- issue: Burla mediante títulos regios y divinos
  choice: Conservar «Hijo de Dios» y «rey de Israel» literalmente
  alternative: Parafrasear los títulos como expresiones meramente sarcásticas
  rationale: El texto presenta los títulos dentro de la burla, pero no elimina su peso cristológico; la traducción mantiene esa tensión.
- issue: Mandato «Judge justly»
  choice: «Juzga con justicia»
  alternative: «Haz justicia»
  rationale: La forma elegida conserva la relación verbal con el tribunal y la ironía del mandato dirigido al rey escarnecido.
- issue: Fórmula final de honor irónico
  choice: «Honremos con este honor al Hijo de Dios»
  alternative: «Así honremos al Hijo de Dios»
  rationale: Aunque la repetición resulta marcada, reproduce la ironía deliberada y la formulación redundante del testimonio disponible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los números de sección del testimonio. El borrador es necesariamente provisional porque se suministró un testimonio inglés de dominio público y la revisión directa del griego del Códice de Akhmim está pendiente; por ello no se introdujeron notas textuales ni reconstrucciones no respaldadas por los datos proporcionados.
