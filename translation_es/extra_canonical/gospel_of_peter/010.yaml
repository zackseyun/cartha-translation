base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: es
  text: '(38) Cuando los soldados vieron esto, despertaron al centurión y a los ancianos, pues ellos también estaban allí haciendo guardia. (39) Mientras les contaban lo que habían visto, volvieron a ver a tres hombres que salían de la tumba. Dos sostenían al tercero, y una cruz los seguía. (40) Las cabezas de los dos llegaban hasta el cielo, pero la del que ellos conducían sobrepasaba los cielos.


    (41) Entonces oyeron una voz que venía de los cielos y decía:


    —¿Han proclamado el mensaje a los que duermen?[a]


    (42) Y se oyó una respuesta proveniente de la cruz:


    —¡Sí!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Los que duermen» puede referirse a los muertos. La revisión directa del texto griego aún está pendiente.
    reason: Aclara una metáfora potencialmente opaca y documenta el carácter provisional de la base textual sin resolverla dentro del texto.
lexical_decisions:
- source_word: keeping guard
  choice: haciendo guardia
  rationale: Expresión natural en español que conserva la acción de vigilar el sepulcro.
- source_word: supporting
  choice: sostenían
  rationale: Mantiene la imagen física sin precisar si cargaban por completo o solo ayudaban a caminar.
- source_word: heaven / the heavens
  choice: el cielo / los cielos
  rationale: Conserva la distinción formal presente en el testimonio suministrado, aunque su alcance exacto depende de la revisión griega pendiente.
- source_word: those who sleep
  choice: los que duermen
  rationale: Preserva la metáfora antigua y su posible referencia a los muertos, sin reemplazarla interpretativamente.
- source_word: proclaimed
  choice: proclamado el mensaje
  rationale: En español, el complemento implícito de «proclamar» resulta poco natural; «el mensaje» hace explícito solo lo necesario sin determinar su contenido.
theological_decisions:
- issue: Identidad de los tres hombres
  choice: No identificar explícitamente al tercero como Jesús ni a los otros dos como ángeles.
  alternative: Nombrarlos como Jesús y dos ángeles.
  rationale: El pasaje los llama solamente «tres hombres» y luego «el que ellos conducían»; la traducción preserva esa forma narrativa.
- issue: Sentido de «los que duermen»
  choice: Conservar la metáfora.
  alternative: Traducir «los muertos».
  rationale: La metáfora puede implicar a los muertos, pero verterla directamente de ese modo eliminaría una ambigüedad genuina.
- issue: La cruz como hablante
  choice: Mantener literalmente que la respuesta procede de la cruz.
  alternative: Atribuir la respuesta a quien iba delante de la cruz.
  rationale: El testimonio presentado atribuye expresamente la voz a la cruz; suavizarlo alteraría un rasgo distintivo del relato.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvo la numeración de las secciones y el carácter extraordinario de las imágenes. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del griego del Códice de Akhmim.
