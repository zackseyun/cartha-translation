review_pass:
  verdict: revise
  source_fidelity: Se conserva la secuencia, la imaginería extraordinaria y la distinción formal entre «el cielo» (v. 40a) y «los cielos» (vv. 40b–41). Sin embargo, el «Han» del v. 41 cambia indebidamente el destinatario singular implícito en la pregunta («Have you proclaimed...?»). «El mensaje» añade un objeto que el testimonio inglés no expresa; «predicado a» permite conservar la construcción sin especificar contenido.
  naturalness: El texto revisado mantiene un registro narrativo digno y natural para español latinoamericano. «Al que llevaban» expresa con mayor naturalidad la relación física ya descrita sin precisar más que el original.
  terminology: «Predicar» es una equivalencia natural de «proclaim» en este contexto y no identifica el contenido de la proclamación. Se mantienen «los que duermen» y la atribución literal de la respuesta a la cruz. La nota aclara la posible referencia funeraria sin resolverla en el cuerpo del texto.
  issues:
  - severity: medium
    issue: Número verbal en la pregunta del v. 41
    rationale: 'El borrador dice «¿Han proclamado...?» (plural), mientras que el testimonio fuente formula una pregunta dirigida a un sujeto singular: «Have you proclaimed...?». Debe decir «¿Has...?».'
  - severity: medium
    issue: Adición de «el mensaje» en el v. 41
    rationale: El complemento no aparece en el testimonio fuente. Aunque hace más fluida la frase, concreta un contenido que el pasaje deja tácito. «¿Has predicado a los que duermen?» conserva la elipsis de contenido de modo idiomático.
  - severity: low
    issue: «Conducían» en el v. 40
    rationale: «Llevaban» retoma de forma más directa y natural el apoyo físico indicado en el v. 39, sin sugerir una conducción independiente.
  revised_text: '(38) Cuando los soldados vieron esto, despertaron al centurión y a los ancianos, pues ellos también estaban allí haciendo guardia. (39) Mientras les contaban lo que habían visto, volvieron a ver a tres hombres que salían de la tumba. Dos sostenían al tercero, y una cruz los seguía. (40) Las cabezas de los dos llegaban hasta el cielo, pero la del que llevaban sobrepasaba los cielos.


    (41) Entonces oyeron una voz que venía de los cielos y decía:


    —¿Has predicado a los que duermen?[a]


    (42) Y se oyó una respuesta proveniente de la cruz:


    —¡Sí!'
  revised_footnotes:
  - marker: a
    text: «Los que duermen» puede referirse a los muertos. La revisión directa del texto griego aún está pendiente.
    reason: Aclara una metáfora potencialmente opaca y documenta el carácter provisional de la base textual sin resolverla dentro del texto.
  revision_rationale: Se corrige el singular de la pregunta y se elimina la adición interpretativa «el mensaje». La formulación «¿Has predicado a los que duermen?» conserva el destinatario, el contenido tácito y la metáfora del testimonio suministrado, a la vez que resulta natural en español. Se ajusta «conducían» a «llevaban» por precisión narrativa.
