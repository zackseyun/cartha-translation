review_pass:
  verdict: revise
  source_fidelity: 'La secuencia narrativa y las imágenes extraordinarias se conservan bien: los soldados despiertan al centurión y a los ancianos; tres hombres salen del sepulcro; dos sostienen al tercero; la cruz sigue; y la respuesta se atribuye literalmente a la cruz. Se mantiene adecuadamente la distinción formal «el cielo / los cielos». Sin embargo, la pregunta celeste está en singular en el original griego (y el giro griego corresponde a «¿has proclamado/predicado...?»), mientras que el borrador usa el plural «¿Han proclamado...?».'
  naturalness: El español es claro, moderno y de registro apropiado. «Haciendo guardia», «sostenían al tercero» y «una cruz los seguía» son naturales. «El mensaje» facilita la construcción española de «proclamar», pero explicita un objeto que el texto fuente deja sin expresar; puede conservarse como una explicitación mínima, siempre que se corrija el número verbal.
  terminology: «Centurión», «ancianos», «tumba», «los que duermen» y «cruz» son adecuados. Se debe preservar «los que duermen» sin sustituirlo por «los muertos». La nota es pertinente, pero debe evitar presentar la revisión griega como simplemente pendiente si ya puede observarse con seguridad el singular verbal; la nota puede limitarse a explicar la metáfora y la provisionalidad general de la base.
  issues:
  - severity: medium
    issue: «¿Han proclamado...?» está en plural.
    rationale: La pregunta se dirige en singular en el griego («¿has proclamado/predicado a los que duermen?»). El plural altera el referente gramatical de la voz celestial.
  - severity: low
    issue: «Entonces» en el v. 41 no tiene correlato expreso.
    rationale: No cambia sustancialmente el sentido, pero puede omitirse para reflejar con mayor precisión la transición sobria del texto.
  - severity: low
    issue: «El mensaje» explicita el objeto de «proclamar».
    rationale: El verbo fuente no expresa aquí el contenido proclamado. La adición mejora la naturalidad en español, pero conviene reconocer que es una explicitación mínima; se mantiene en la revisión por fluidez, sin definir el contenido.
  revised_text: '(38) Cuando los soldados vieron esto, despertaron al centurión y a los ancianos, pues ellos también estaban allí haciendo guardia. (39) Mientras les contaban lo que habían visto, volvieron a ver a tres hombres que salían de la tumba. Dos sostenían al tercero, y una cruz los seguía. (40) Las cabezas de los dos llegaban hasta el cielo, pero la del que ellos conducían sobrepasaba los cielos.


    (41) Oyeron una voz que venía de los cielos y decía:


    —¿Has proclamado el mensaje a los que duermen?[a]


    (42) Y se oyó una respuesta proveniente de la cruz:


    —¡Sí!'
  revised_footnotes:
  - marker: a
    text: «Los que duermen» puede referirse a los muertos. El texto conserva la metáfora; la revisión directa y completa del griego del Códice de Akhmim sigue pendiente.
    reason: Aclara la posible referencia sin reemplazar la metáfora en el texto ni imponer una interpretación.
  revision_rationale: La única corrección necesaria es cambiar el plural «Han» por el singular «Has», conforme al verbo de la pregunta en el texto griego. También se elimina «Entonces», añadido sin necesidad. Se conserva «el mensaje» como apoyo idiomático mínimo para «proclamar», sin especificar qué se proclamó, y se preservan la ambigüedad de «los que duermen» y la atribución literal de la respuesta a la cruz.
