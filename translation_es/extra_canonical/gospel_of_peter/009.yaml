    issue: 'v. 35: «se oyó una gran voz»'
    rationale: El testimonio dice «there was a great voice in heaven». «Se oyó» añade una perspectiva auditiva que no está expresada en la formulación existencial. «Hubo una gran voz en el cielo» preserva mejor la construcción, la ubicación y la ambigüedad sobre el hablante.
