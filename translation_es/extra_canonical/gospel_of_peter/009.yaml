  source_fidelity: 'La traducción sigue fielmente el testimonio inglés provisional y conserva distinciones importantes: «día del Señor», «dos hombres» / «jóvenes» y el apartamiento solo parcial de la piedra. En v. 35, sin embargo, «se oyó» transforma la construcción existencial («there was») en un evento de percepción; «hubo» la refleja más estrictamente.'
  naturalness: El español es natural, actual y de registro digno para América Latina. «Hubo una gran voz en el cielo» mantiene la extrañeza deliberada del texto sin resultar ininteligible.
  terminology: «Sepulcro», «día del Señor», «fulgor» y «jóvenes» son elecciones apropiadas. No se identifica indebidamente a los hombres como ángeles.
