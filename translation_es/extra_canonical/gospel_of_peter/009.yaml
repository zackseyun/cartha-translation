base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: es
  text: (34) Cuando amaneció el sábado, una multitud de Jerusalén y de la región circundante fue a ver el sepulcro que había sido sellado. (35) Pero durante la noche, antes de que amaneciera el día del Señor, mientras los soldados hacían guardia de dos en dos, hubo una gran voz en el cielo. (36) Vieron abrirse los cielos, y de allí descendieron dos hombres que resplandecían con gran fulgor y se acercaron al sepulcro. (37) La piedra que había sido colocada a la entrada rodó por sí sola y se apartó parcialmente. El sepulcro quedó abierto, y ambos jóvenes entraron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: morning of the Sabbath
  choice: amaneció el sábado
  rationale: Expresa de manera natural en español el comienzo de la mañana sabática sin añadir una interpretación cronológica innecesaria.
- source_word: grave / tomb
  choice: sepulcro
  rationale: Mantiene uniformidad para el lugar de sepultura y ofrece un registro digno y comprensible.
- source_word: Lord's day
  choice: día del Señor
  rationale: Conserva la designación tradicional y su posible valor técnico sin sustituirla explícitamente por «domingo».
- source_word: great voice in heaven
  choice: una gran voz en el cielo
  rationale: Retiene la formulación extraordinaria del testimonio y no identifica al hablante, a quien el texto no nombra.
- source_word: having much radiance
  choice: resplandecían con gran fulgor
  rationale: Comunica la intensa luminosidad de las figuras con lenguaje natural y solemne.
- source_word: made way in part
  choice: se apartó parcialmente
  rationale: Preserva el detalle inusual de que la piedra solo dejó paso en parte, sin normalizarlo como una remoción completa.
- source_word: young men
  choice: jóvenes
  rationale: Conserva el cambio descriptivo de «hombres» a «jóvenes» presente en el testimonio, sin identificarlos expresamente como ángeles.
theological_decisions:
- issue: Identidad de los dos hombres resplandecientes
  choice: dos hombres; ambos jóvenes
  alternative: dos ángeles
  rationale: El texto suministrado los llama primero hombres y luego jóvenes. No se impone una identificación angelológica que el pasaje no hace explícita.
- issue: Sentido de «día del Señor»
  choice: día del Señor
  alternative: domingo
  rationale: La expresión se conserva para mantener su forma y posible carga religiosa, aunque en contexto probablemente se refiera al primer día de la semana.
- issue: Procedencia de la voz
  choice: en el cielo
  alternative: desde el cielo
  rationale: Se mantiene la localización dada por el testimonio sin inferir con mayor precisión su dirección o su hablante.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se sigue provisionalmente el testimonio inglés de dominio público porque la revisión directa del griego está pendiente. La redacción busca equivalencia óptima, conserva el detalle de que la piedra se apartó solo parcialmente y evita identificar como ángeles a los personajes llamados «hombres» y «jóvenes».
