base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: es
  text: '(28) Los escribas, los fariseos y los ancianos se reunieron entre sí al oír que todo el pueblo murmuraba, se golpeaba el pecho y decía: «Si al morir él ocurrieron estas señales tan extraordinarias, ¡miren qué justo era!».


    (29) Los ancianos tuvieron miedo y fueron adonde estaba Pilato. Le suplicaron diciendo: (30) «Danos soldados para que custodiemos su sepultura durante tres días, no sea que sus discípulos vengan, lo roben, y el pueblo crea que resucitó de entre los muertos y nos haga daño».[a]


    (31) Pilato les dio al centurión Petronio, junto con soldados, para custodiar la tumba. Ancianos y escribas fueron con ellos a la sepultura. (32) Después de hacer rodar una gran piedra hasta donde estaban el centurión y los soldados,[b] todos los presentes la colocaron a la entrada de la sepultura. (33) Le pusieron siete sellos, levantaron allí una tienda y montaron guardia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «y nos perjudique». El tipo de daño no se especifica.'
    reason: Preservar la amplitud de la expresión del testimonio suministrado.
  - marker: b
    text: 'La redacción del testimonio suministrado es inusual: literalmente presenta la piedra como rodada «hasta el centurión y los soldados». La traducción conserva esa relación espacial sin intentar corregirla; queda pendiente la revisión directa del griego.'
    reason: Señalar una dificultad textual o sintáctica genuina y evitar resolverla con una conjetura no sustentada.
lexical_decisions:
- source_word: grumbling
  choice: murmuraba
  rationale: Expresa la protesta colectiva en un registro bíblico comprensible y natural, sin precisar indebidamente si se trataba de queja, reproche o descontento.
- source_word: beating their chests
  choice: se golpeaba el pecho
  rationale: Conserva el gesto corporal de duelo o remordimiento del testimonio suministrado.
- source_word: just
  choice: justo
  rationale: Mantiene la amplitud moral y judicial del término, sin convertirlo en una afirmación doctrinal más específica.
- source_word: grave / tomb
  choice: sepultura / tumba
  rationale: Ambos términos son naturales en español y reflejan la variación del testimonio inglés sin introducir una diferencia material entre los referentes.
- source_word: kept watch
  choice: montaron guardia
  rationale: Es la expresión idiomática actual para una vigilancia militar continuada.
theological_decisions:
- issue: La afirmación de que Jesús era justo
  choice: «¡miren qué justo era!»
  alternative: «¡vean que era inocente!»
  rationale: «Justo» preserva el campo semántico amplio del testimonio y evita reducir la declaración exclusivamente a inocencia jurídica.
- issue: La creencia del pueblo en la resurrección
  choice: «crea que resucitó de entre los muertos»
  alternative: «crea que ha sido levantado de entre los muertos»
  rationale: La formulación conserva la afirmación tal como la temen los ancianos, sin decidir aquí entre matices de voz activa, pasiva o divina que requieren revisión directa del griego.
- issue: El daño temido por los dirigentes
  choice: «nos haga daño»
  alternative: «nos perjudique» o «nos haga mal»
  rationale: 'Mantiene sin resolver la naturaleza del perjuicio: puede ser físico, social, político o judicial.'
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la numeración y la repetición narrativa propias del pasaje, pero se ajustó la sintaxis para una lectura pública natural. Este borrador es necesariamente provisional porque el material proporcionado identifica como base inmediata un testimonio inglés de dominio público y señala que la revisión directa del griego del Códice de Akhmim aún está pendiente.
