review_pass:
  verdict: revise
  source_fidelity: El borrador sigue de cerca el testimonio inglés suministrado. Sin embargo, «Si al morir él ocurrieron» no es una construcción española segura para «If at his death ... happened» y debe corregirse. En (32), «hasta donde estaban» convierte la relación inusual «to the centurion and the soldiers» en una localización explícita; conviene conservar la rareza sin resolverla de ese modo, dado que no se ha aportado una revisión directa del griego.
  naturalness: El registro es mayormente natural y apto para lectura pública. Se recomienda «cuando él murió» para evitar el orden sintáctico anómalo de (28), y «fueron a Pilato» por ser más directo que «fueron adonde estaba Pilato». Se elimina el punto sobrante después de la cita en (28).
  terminology: «Escribas», «fariseos», «ancianos», «centurión», «justo», «resucitó de entre los muertos», «sellos» y «montaron guardia» son elecciones adecuadas. «Sepultura» y «tumba» reflejan la variación de grave/tomb del testimonio. La nota sobre «nos haga daño» conserva correctamente la amplitud de «do us wrong».
  issues:
  - severity: medium
    issue: 'Construcción defectuosa en (28): «Si al morir él ocurrieron...»'
    rationale: El pronombre intercalado hace que la frase resulte anómala en español. «Si cuando él murió ocurrieron...» expresa con naturalidad la referencia temporal del testimonio («at his death») sin alterar su sentido.
  - severity: medium
    issue: Resolución excesiva de la frase inusual en (32)
    rationale: «Hasta donde estaban el centurión y los soldados» explicita una ubicación que el testimonio inglés no formula de manera clara. «En dirección al centurión y los soldados» conserva la relación direccional inusual y mantiene la ambigüedad a la espera de revisar el griego.
  - severity: low
    issue: Punto redundante tras la cita de (28)
    rationale: La exclamación ya cierra la oración; el punto posterior a las comillas es innecesario en esta puntuación española.
  revised_text: '(28) Los escribas, los fariseos y los ancianos se reunieron entre sí al oír que todo el pueblo murmuraba, se golpeaba el pecho y decía: «Si cuando él murió ocurrieron estas señales tan extraordinarias, ¡miren qué justo era!»


    (29) Los ancianos tuvieron miedo y fueron a Pilato. Le suplicaron y le dijeron: (30) «Danos soldados para que custodiemos su sepultura durante tres días, no sea que sus discípulos vengan, lo roben y el pueblo crea que resucitó de entre los muertos y nos haga daño».[a]


    (31) Pilato les dio al centurión Petronio, junto con soldados, para custodiar la tumba. Ancianos y escribas fueron con ellos a la sepultura. (32) Después de hacer rodar una gran piedra en dirección al centurión y los soldados,[b] todos los presentes la colocaron a la entrada de la sepultura. (33) Le pusieron siete sellos, levantaron allí una tienda y montaron guardia.'
  revised_footnotes:
  - marker: a
    text: 'También puede traducirse: «y nos perjudique». El tipo de daño no se especifica.'
    reason: Conserva la amplitud de «do us wrong» en el testimonio suministrado.
  - marker: b
    text: 'La redacción del testimonio suministrado es inusual: presenta la piedra como rodada «hacia el centurión y los soldados». La traducción conserva esa relación sin intentar resolverla; queda pendiente la revisión directa del griego.'
    reason: Evita convertir una formulación textual extraña en una localización explícita no asegurada por el testimonio inglés.
  revision_rationale: Las revisiones corrigen una dificultad sintáctica inequívoca, eliminan puntuación redundante y preservan con mayor cautela la formulación anómala de (32). No se introducen interpretaciones doctrinales ni se resuelve la ambigüedad textual antes de contar con revisión directa del griego del Códice de Akhmim.
