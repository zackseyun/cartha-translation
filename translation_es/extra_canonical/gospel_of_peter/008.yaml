review_pass:
  verdict: revise
  source_fidelity: La traducción conserva adecuadamente la secuencia narrativa, los grupos mencionados, la petición de vigilancia por tres días, el temor a que los discípulos se lleven el cuerpo y la vigilancia con siete sellos. También conserva prudentemente la formulación anómala del testimonio acerca de hacer rodar la piedra «hasta el centurión y los soldados», sin resolverla mediante una reconstrucción conjetural. Sin embargo, «Si al morir él ocurrieron» no reproduce de forma gramatical ni natural la relación temporal de «at his death» y debe corregirse a «Si a su muerte ocurrieron».
  naturalness: El registro es en general natural y apropiado para español latinoamericano neutral. «Murmuraba», «se golpeaba el pecho», «justo» y «montaron guardia» son buenas opciones. Se corrige la sintaxis de v. 28 y la puntuación redundante posterior a parlamentos que ya terminan con signo de exclamación o con la nota.
  terminology: «Escribas», «fariseos», «ancianos», «centurión», «sepultura/tumba», «sellos» y «resucitó de entre los muertos» son términos adecuados. «Lo roben» conserva de manera concisa el verbo del testimonio, aunque se refiere al cuerpo de Jesús. La nota a mantiene acertadamente la amplitud de «do us wrong».
  issues:
  - severity: medium
    issue: 'Sintaxis defectuosa en v. 28: «Si al morir él ocurrieron...»'
    rationale: La colocación de «él» tras «morir» resulta agramatical o marcadamente forzada en español y oscurece que las señales ocurrieron con ocasión de su muerte. «Si a su muerte ocurrieron...» expresa el sentido del testimonio sin añadir interpretación.
  - severity: low
    issue: Puntuación redundante tras los parlamentos en vv. 28 y 30
    rationale: Después de un signo de exclamación de cierre no corresponde añadir un punto. En v. 30, el ancla de nota puede seguir directamente a la comilla de cierre.
  revised_text: '(28) Los escribas, los fariseos y los ancianos se reunieron entre sí al oír que todo el pueblo murmuraba, se golpeaba el pecho y decía: «Si a su muerte ocurrieron estas señales tan extraordinarias, ¡miren qué justo era!»


    (29) Los ancianos tuvieron miedo y fueron adonde estaba Pilato. Le suplicaron diciendo: (30) «Danos soldados para que custodiemos su sepultura durante tres días, no sea que sus discípulos vengan, lo roben, y el pueblo crea que resucitó de entre los muertos y nos haga daño»[a]


    (31) Pilato les dio al centurión Petronio, junto con soldados, para custodiar la tumba. Ancianos y escribas fueron con ellos a la sepultura. (32) Después de hacer rodar una gran piedra hasta donde estaban el centurión y los soldados,[b] todos los presentes la colocaron a la entrada de la sepultura. (33) Le pusieron siete sellos, levantaron allí una tienda y montaron guardia.'
  revised_footnotes:
  - marker: a
    text: 'También puede traducirse: «y nos perjudique». El tipo de daño no se especifica.'
    reason: Preserva la amplitud de la expresión «do us wrong» del testimonio suministrado.
  - marker: b
    text: 'La redacción del testimonio suministrado es inusual: literalmente presenta la piedra como rodada «hasta el centurión y los soldados». La traducción conserva esa relación espacial sin intentar corregirla; queda pendiente la revisión directa del griego.'
    reason: Señala una dificultad textual o sintáctica genuina y evita resolverla con una conjetura no sustentada.
  revision_rationale: Se realizan únicamente correcciones seguras de sintaxis y puntuación. Se preservan tanto la ambigüedad de la acción temida contra los dirigentes como la construcción inusual relativa a la piedra, que requiere cotejo directo con el griego del Códice de Akhmim.
