base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: es
  text: '(50) Al amanecer del día del Señor, María Magdalena, discípula del Señor, no había hecho en la tumba del Señor lo que las mujeres acostumbran hacer por sus seres queridos que han muerto, porque tenía miedo de los judíos, pues estaban enfurecidos.


    (51) Llevando consigo a sus amigas, fue a la tumba donde él había sido puesto. (52) Ellas temían que los judíos las vieran, y decían: «Si el día en que fue crucificado no pudimos llorar y lamentarnos, quizá ahora podamos hacerlo junto a su tumba. (53) Pero ¿quién nos hará rodar la piedra puesta a la entrada de la tumba, para que podamos entrar, sentarnos junto a él y cumplir con nuestros deberes? (54) La piedra es grande, y tememos que alguien nos vea. Si no podemos entrar, al menos dejemos a la entrada lo que traemos en memoria de él, y lloremos y lamentémonos hasta que regresemos a nuestra casa».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Lord's day
  choice: el día del Señor
  rationale: Conserva la expresión tradicional y su posible valor técnico sin sustituirla interpretativamente por «domingo».
- source_word: grave
  choice: tumba
  rationale: Es natural en español latinoamericano y mantiene la referencia al lugar de sepultura.
- source_word: friends
  choice: amigas
  rationale: El contexto y los pronombres femeninos indican que las acompañantes de María eran mujeres.
- source_word: do our duties
  choice: cumplir con nuestros deberes
  rationale: Mantiene la formulación general del testimonio disponible, que alude a las prácticas funerarias sin precisar ritos no expresados.
- source_word: in memory of him
  choice: en memoria de él
  rationale: Reproduce el sentido conmemorativo sin especificar la naturaleza de las ofrendas llevadas.
theological_decisions:
- issue: La expresión «día del Señor»
  choice: Se conserva literalmente «día del Señor».
  alternative: «domingo»
  rationale: La expresión puede funcionar como designación cristiana del primer día de la semana, pero la traducción evita eliminar su forma y resonancia teológica.
- issue: Referencia colectiva a «los judíos»
  choice: Se conserva como designación narrativa del testimonio.
  alternative: «las autoridades judías»
  rationale: El testimonio suministrado dice «the Jews» y no permite restringir con seguridad la referencia a las autoridades, aunque el contexto presenta a un grupo hostil.
- issue: Naturaleza de los deberes funerarios
  choice: Se deja en términos generales como «cumplir con nuestros deberes».
  alternative: «ungir su cuerpo» o «realizar los ritos funerarios»
  rationale: El pasaje no especifica aquí una unción ni define los actos concretos; precisarlos importaría información externa.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva la numeración tradicional de las secciones. Borrador necesariamente provisional: se basa en el testimonio inglés de dominio público proporcionado, pues la revisión directa del griego del Códice de Akhmim sigue pendiente.'
