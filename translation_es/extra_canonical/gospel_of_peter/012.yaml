review_pass:
  verdict: revise
  source_fidelity: La traducción refleja fielmente el testimonio inglés suministrado en la secuencia narrativa, las referencias a María Magdalena y sus acompañantes, el temor a ser vistas, la piedra y las acciones funerarias. Sin embargo, en §54 «Si no podemos entrar» restringe indebidamente la condición abierta «If we aren’t able», que no especifica que el impedimento sea entrar; puede abarcar realizar el propósito expresado. Se corrige conservando la ambigüedad.
  naturalness: El español es natural, claro y de registro digno para América Latina. «Lamentarnos» y «en memoria de él» son adecuados. La redacción revisada mantiene el paralelismo y la progresión del discurso directo.
  terminology: «Día del Señor», «tumba», «los judíos» y «cumplir con nuestros deberes» conservan las formulaciones generales y no introducen interpretaciones rituales o doctrinales. «Amigas» concuerda con el marco narrativo femenino, aunque la revisión directa del griego sigue pendiente.
  issues:
  - severity: medium
    issue: 'Restricción añadida en §54: «Si no podemos entrar».'
    rationale: El testimonio dice únicamente «If we aren’t able», sin objeto expreso. Añadir «entrar» determina el alcance de la incapacidad y altera una ambigüedad que debe conservarse.
  revised_text: '(50) Al amanecer del día del Señor, María Magdalena, discípula del Señor, no había hecho en la tumba del Señor lo que las mujeres acostumbran hacer por sus seres queridos que han muerto, porque tenía miedo de los judíos, pues estaban enfurecidos.


    (51) Llevando consigo a sus amigas, fue a la tumba donde él había sido puesto. (52) Ellas temían que los judíos las vieran, y decían: «Si el día en que fue crucificado no pudimos llorar y lamentarnos, quizá ahora podamos hacerlo junto a su tumba. (53) Pero ¿quién nos hará rodar la piedra puesta a la entrada de la tumba, para que podamos entrar, sentarnos junto a él y cumplir con nuestros deberes? (54) La piedra es grande, y tememos que alguien nos vea. Si no podemos hacerlo, al menos dejemos a la entrada lo que traemos en memoria de él, y lloremos y lamentémonos hasta que regresemos a nuestra casa».'
  revised_footnotes: []
  revision_rationale: Se sustituye «Si no podemos entrar» por «Si no podemos hacerlo» para no añadir un objeto que el testimonio inglés no expresa. No se requieren notas ni cambios adicionales. La revisión permanece provisional hasta la cotejación directa con el griego del Códice de Akhmim.
