review_pass:
  verdict: revise
  source_fidelity: La versión sigue fielmente el testimonio inglés suministrado y conserva sin restringir la referencia narrativa a «los judíos» y la expresión «día del Señor». Sin embargo, «Si no podemos entrar» en (54) introduce una condición concreta que el testimonio deja elíptica («if we aren’t able»); podría referirse a lograr retirar la piedra o, más ampliamente, a llevar a cabo su propósito.
  naturalness: El español es claro, actual y de registro digno. «Realizar nuestros deberes» comunica con algo más naturalidad la acción general indicada por «do our duties», sin especificar un rito.
  terminology: «Día del Señor», «tumba», «en memoria de él» y «los judíos» son elecciones apropiadas y no imponen interpretaciones doctrinales ni históricas adicionales. «Amigas» es una inferencia contextual razonable dada la concordancia femenina del pasaje.
  issues:
  - severity: medium
    issue: 'Especificación añadida en (54): «Si no podemos entrar».'
    rationale: El testimonio inglés dice solamente «And if we aren’t able», sin expresar el complemento. Añadir «entrar» reduce una ambigüedad que debe conservarse; la incapacidad puede estar vinculada a mover la piedra o a realizar la acción proyectada en conjunto.
  - severity: low
    issue: «cumplir con nuestros deberes» suena levemente administrativo en este contexto funerario.
    rationale: No es infiel, pero «realizar nuestros deberes» mantiene la generalidad del original puente y fluye mejor en la escena, sin introducir «ritos» ni «unción».
  revised_text: '(50) Al amanecer del día del Señor, María Magdalena, discípula del Señor, no había hecho en la tumba del Señor lo que las mujeres acostumbran hacer por sus seres queridos que han muerto, porque tenía miedo de los judíos, pues estaban enfurecidos.


    (51) Llevando consigo a sus amigas, fue a la tumba donde él había sido puesto. (52) Ellas temían que los judíos las vieran y decían: «Si el día en que fue crucificado no pudimos llorar y lamentarnos, quizá ahora podamos hacerlo junto a su tumba. (53) Pero ¿quién nos hará rodar la piedra puesta a la entrada de la tumba, para que podamos entrar, sentarnos junto a él y realizar nuestros deberes? (54) La piedra es grande, y tememos que alguien nos vea. Si no podemos hacerlo, al menos dejemos a la entrada lo que traemos en memoria de él, y lloremos y lamentémonos hasta que regresemos a nuestra casa».'
  revised_footnotes: []
  revision_rationale: Se corrige únicamente la adición interpretativa «entrar» en (54), reemplazándola por «hacerlo» para conservar la elipsis del testimonio. Se ajusta además «cumplir con nuestros deberes» a «realizar nuestros deberes» por fluidez, sin alterar ni concretar las prácticas funerarias. La revisión sigue siendo provisional, pues el material proporcionado declara pendiente la comprobación directa del griego del Códice de Akhmim.
