  terminology: Los nombres «Simón Pedro», «Andrés», «Leví» y «Alfeo» son formas españolas convencionales. «Los doce discípulos del Señor» conserva la formulación explícita sin convertirla en un título técnico. «Panes sin Levadura» es una designación bíblica reconocible y no introduce interpretación adicional.
