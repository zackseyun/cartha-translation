  source_fidelity: 'La traducción sigue fielmente el testimonio inglés provisto: conserva el marco temporal de la fiesta, la partida de la gente, el llanto y duelo de los doce, el retorno individual a casa, y la acción final de Pedro, Andrés y Leví. No añade identificaciones geográficas ni armoniza el pasaje con relatos canónicos. La revisión directa del griego sigue pendiente, como indica el contexto.'
