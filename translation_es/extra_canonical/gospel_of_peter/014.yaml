  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: es
  text: (58) Era el último día de los Panes sin Levadura, y mucha gente se marchaba y regresaba a su casa porque la fiesta había terminado. (59) Pero nosotros, los doce discípulos del Señor, llorábamos y estábamos afligidos; y cada uno regresó a su casa, entristecido por lo que había sucedido. (60) Pero yo, Simón Pedro, y mi hermano Andrés tomamos nuestras redes y fuimos al mar. Con nosotros estaba Leví, hijo de Alfeo, a quien el Señor…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito termina de manera incompleta después de «a quien el Señor».
    reason: Aclara que los puntos suspensivos representan el final perdido o incompleto del manuscrito, no una omisión editorial.
lexical_decisions:
- source_word: Unleavened Bread
  choice: los Panes sin Levadura
  rationale: Conserva el nombre tradicional y reconocible de la fiesta judía, con lenguaje claro para lectores actuales.
- source_word: houses / home
  choice: su casa
  rationale: En español natural, «regresar a su casa» expresa el retorno al hogar sin imponer una distinción que el testimonio inglés no exige.
- source_word: weeping and grieving
  choice: llorábamos y estábamos afligidos
  rationale: 'Mantiene los dos componentes de la expresión: el llanto visible y el dolor interior, evitando una repetición poco natural.'
- source_word: sea
  choice: mar
  rationale: Reproduce la designación narrativa tradicional sin identificar de manera explícita un lugar que el fragmento no nombra.
- source_word: nets
  choice: redes
  rationale: Es el equivalente normal en el contexto de la pesca y no añade detalles sobre el tipo de red.
- source_word: Levi, the son of Alphaeus
  choice: Leví, hijo de Alfeo
  rationale: Emplea las formas españolas convencionales de los nombres y conserva la relación filial.
theological_decisions:
- issue: Identidad del grupo como «los doce discípulos del Señor»
  choice: los doce discípulos del Señor
  alternative: los Doce del Señor
  rationale: Conserva la formulación explícita del testimonio sin convertirla en un título técnico ni armonizarla con otros relatos.
- issue: Cláusula inconclusa acerca de Leví
  choice: a quien el Señor…
  alternative: omitir la cláusula incompleta
  rationale: Mantiene la tensión y la incompletitud reales del manuscrito, sin conjeturar qué hizo o dijo el Señor.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se favoreció una sintaxis narrativa fluida, manteniendo la repetición contrastiva de «Pero» y sin armonizar el fragmento con los evangelios canónicos. Traducción provisional basada en el testimonio inglés de dominio público proporcionado; está pendiente la revisión directa del griego.
