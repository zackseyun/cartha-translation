base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: es
  text: '(21) Entonces sacaron los clavos de las manos del Señor y lo pusieron en tierra. Toda la tierra se estremeció, y sobrevino un gran temor.


    (22) Luego brilló el sol, y se comprobó que era la hora novena.[a] (23) Los judíos se alegraron y entregaron a José el cuerpo del Señor para que lo sepultara, pues había visto todo el bien que él había hecho.[b] (24) José tomó al Señor, lo lavó, lo envolvió en lino y lo llevó a su propio sepulcro, conocido como «el Jardín de José».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La hora novena correspondía aproximadamente a las tres de la tarde.
    reason: Aclara para lectores modernos el sistema horario antiguo sin reemplazar la expresión del texto.
  - marker: b
    text: La redacción del testimonio disponible no deja claro quién había visto ni quién había hecho «todo el bien».
    reason: Hace explícita una ambigüedad genuina que no debe resolverse sin revisar directamente el texto griego.
lexical_decisions:
- source_word: placed him on the earth
  choice: lo pusieron en tierra
  rationale: Conserva la relación verbal entre poner el cuerpo en tierra y el estremecimiento de toda la tierra, sin imponer que ya se trate de la sepultura.
- source_word: the ninth hour
  choice: la hora novena
  rationale: Mantiene el modo antiguo de contar las horas; la nota aclara su equivalencia aproximada para lectores actuales.
- source_word: linen
  choice: lino
  rationale: Reproduce el material mencionado por el testimonio sin añadir una prenda o cantidad que el texto no especifica.
- source_word: Joseph's Garden
  choice: el Jardín de José
  rationale: Se conserva como nombre propio tradicional del lugar, con una formulación natural en español.
theological_decisions:
- issue: Designación colectiva «the Jews»
  choice: Los judíos
  alternative: Las autoridades judías
  rationale: El testimonio disponible usa una designación colectiva y no especifica únicamente a las autoridades; se preserva su alcance textual sin añadir una identificación más estrecha.
- issue: Ambigüedad de los pronombres en el versículo 23
  choice: pues había visto todo el bien que él había hecho
  alternative: pues ellos habían visto todo el bien que José había hecho
  rationale: La sintaxis del testimonio inglés disponible no identifica de forma inequívoca quién vio ni quién hizo el bien. La traducción conserva esa tensión y la señala en nota, en vez de resolverla doctrinal o narrativamente.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conserva la numeración de los pasajes y la repetición de «tierra». El borrador es necesariamente provisional: se basa en el testimonio inglés de dominio público del Códice de Akhmim (P.Cair. 10759), pues la revisión directa del griego sigue pendiente.'
