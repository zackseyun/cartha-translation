review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés disponible. Conviene no añadir «del Señor» a «su cuerpo» en v. 23, ya que el testimonio dice simplemente «his body» y el antecedente ya está presente. La ambigüedad pronominal de v. 23 se conserva apropiadamente y debe mantenerse señalada hasta la revisión del griego.
  naturalness: El registro es natural, sobrio y apto para español latinoamericano. «Lo pusieron sobre la tierra» reproduce con mayor transparencia la imagen del texto que «lo pusieron en tierra», sin convertir la acción en sepultura. «Resultó ser la hora novena» es una formulación más directa para «it was found to be».
  terminology: «El Señor», «la hora novena», «lino» y «los judíos» son elecciones adecuadas y no introducen interpretaciones confesionales. «El Jardín de José» funciona como denominación del lugar, tal como indica el testimonio.
  issues:
  - severity: low
    issue: Adición de «del Señor» en v. 23
    rationale: El testimonio de control dice «gave Joseph his body», no «the Lord's body». Aunque el referente es claro por el contexto, «su cuerpo» conserva más estrictamente la formulación recibida.
  - severity: low
    issue: «Lo pusieron en tierra» puede sonar menos idiomático y algo más interpretativo
    rationale: «Placed him on the earth» se vierte más transparentemente como «lo pusieron sobre la tierra»; además conserva la repetición intencional con «Toda la tierra».
  - severity: low
    issue: «Se comprobó que era» en v. 22
    rationale: «Resultó ser la hora novena» comunica de manera más natural el hallazgo o constatación expresado por el testimonio, sin alterar su sentido.
