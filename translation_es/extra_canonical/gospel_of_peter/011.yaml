review_pass:
  verdict: revise
  source_fidelity: Se requiere una corrección en el v. 46. La cláusula griega preservada, ὑμῖν δὲ ἔδοξεν, se entiende de manera más directa como «pero a ustedes les pareció bien» o «pero ustedes lo decidieron», no como «esto nos consta». La revisión sigue el griego por encima de la formulación del testigo inglés, que parece haber suavizado o interpretado esa cláusula. El resto conserva adecuadamente la secuencia, los referentes no especificados y el lenguaje narrativo del pasaje.
  naturalness: El español es claro y de registro digno. Se ajustan ligeramente «todos los que habían ido» a «todos los presentes» y la puntuación de las citas para mayor naturalidad y correspondencia contextual.
  terminology: Se mantienen «centurión», «tumba», «Hijo de Dios», «ante Dios» y «pueblo judío». La nota contextual sobre «pueblo judío» se conserva, pues el enunciado refleja el temor de personajes concretos y no debe generalizarse. No es necesaria una nota para la expresión de Pilato una vez que se traduce su cláusula final conforme al griego.
  issues:
  - severity: high
    issue: El v. 46 traduce «y esto nos consta».
    rationale: La construcción griega ὑμῖν δὲ ἔδοξεν se dirige a «ustedes» y expresa que algo les pareció bien o fue decidido por ellos. «Nos consta» cambia tanto el referente pronominal como el sentido de la declaración.
  - severity: low
    issue: «Todos los que habían ido» en el v. 47 es menos preciso y natural que «todos los presentes».
    rationale: El grupo se refiere a quienes se hallaban allí; «presentes» conserva el referente colectivo sin sugerir innecesariamente un desplazamiento previo.
  revised_text: '(43) Entonces aquellos hombres decidieron juntos ir a informar de estas cosas a Pilato. (44) Mientras todavía lo estaban considerando, de nuevo se vio que los cielos se abrían, y cierto hombre descendió y entró en la tumba. (45) Al ver estas cosas, los que estaban con el centurión dejaron la tumba que vigilaban y se apresuraron de noche a ir ante Pilato. Profundamente angustiados, le contaron todo lo que habían visto y dijeron: «¡Verdaderamente él era el Hijo de Dios!»


    (46) Pilato respondió: «Soy inocente de la sangre del Hijo de Dios, pero a ustedes les pareció bien».


    (47) Entonces todos los presentes le rogaron y lo instaron a ordenar al centurión y a los soldados que no dijeran nada de lo que habían visto. (48) Dijeron: «Es mejor para nosotros ser culpables de un gran pecado ante Dios que caer en manos del pueblo judío y ser apedreados».[b] (49) Así que Pilato ordenó al centurión y a los soldados que no dijeran nada.'
  revised_footnotes:
  - marker: b
    text: La expresión refleja el temor y la perspectiva de los personajes del relato; no debe entenderse como una acusación contra el pueblo judío en general.
    reason: Previene una generalización antijudía sin alterar la formulación histórica del testimonio.
  revision_rationale: Se corrige el sentido de la cláusula final del v. 46 conforme al griego, aun cuando ello difiere del audit trail inglés suministrado. Se elimina la nota a porque dependía de la traducción incorrecta «esto nos consta» y ya no aporta una aclaración necesaria. La nota b permanece anclada a la formulación colectiva del v. 48. Las demás revisiones son de fluidez y precisión referencial, sin resolver ambigüedades del pasaje ni imponer una lectura doctrinal.
