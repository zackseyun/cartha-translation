review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado en la secuencia, los referentes y las expresiones clave. No se dispone aquí de una transcripción griega para una verificación directa e independiente; por ello, la revisión de fuente queda necesariamente provisional. Se preservan adecuadamente la ambigüedad de «cierto hombre» y el referente no especificado de «todos los que habían venido».
  naturalness: El español es en general natural y de registro digno. Conviene ajustar «se apresuraron de noche a ir ante Pilato», cuyo orden resulta algo pesado, y eliminar el punto redundante colocado tras el signo de exclamación de la cita en el v. 45.
  terminology: «Centurión», «tumba», «Hijo de Dios», «inocente de la sangre», «ante Dios» y «pueblo judío» son elecciones apropiadas y fieles al nivel de equivalencia del testimonio. «Esto nos consta» comunica bien la afirmación de Pilato, aunque «esto nos resulta claro» se ciñe más visiblemente a la formulación del testimonio inglés («this is clear to us») sin añadir un matiz jurídico-probatorio.
  issues:
  - severity: low
    issue: Puntuación redundante después de la cita del v. 45
    rationale: En español, el signo de cierre de exclamación ya cumple la función de cierre oracional; el punto posterior («!». ) debe suprimirse.
  - severity: low
    issue: Construcción algo forzada en el desplazamiento nocturno del v. 45
    rationale: «Se apresuraron de noche a ir ante Pilato» es comprensible, pero «de noche se apresuraron a presentarse ante Pilato» es más fluido y conserva tanto la premura como la indicación temporal.
  - severity: low
    issue: «Esto nos consta» puede sonar más jurídico que el testimonio inglés
    rationale: El inglés dice que el hecho es claro para ellos. «Esto nos resulta claro» conserva ese sentido de manera directa, sin afirmar un grado mayor de constatación.
  revised_text: '(43) Entonces aquellos hombres decidieron ir juntos a informar de estas cosas a Pilato. (44) Mientras todavía lo estaban considerando, de nuevo se vio que los cielos se abrían, y cierto hombre descendió y entró en la tumba. (45) Al ver estas cosas, los que estaban con el centurión dejaron la tumba que vigilaban y, de noche, se apresuraron a presentarse ante Pilato. Profundamente angustiados, le contaron todo lo que habían visto y dijeron: «¡Verdaderamente él era el Hijo de Dios!»


    (46) Pilato respondió: «Soy inocente de la sangre del Hijo de Dios, y esto nos resulta claro».[a]


    (47) Entonces todos los que habían venido le rogaron y lo instaron a ordenar al centurión y a los soldados que no dijeran nada de lo que habían visto. (48) Dijeron: «Es mejor para nosotros ser culpables de un gran pecado ante Dios que caer en manos del pueblo judío y ser apedreados».[b] (49) Así que Pilato ordenó al centurión y a los soldados que no dijeran nada.'
