base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: es
  text: '(43) Entonces aquellos hombres decidieron ir juntos a informar de estas cosas a Pilato. (44) Mientras todavía lo estaban considerando, de nuevo se vio que los cielos se abrían, y cierto hombre descendió y entró en la tumba. (45) Al ver estas cosas, los que estaban con el centurión dejaron la tumba que vigilaban y se apresuraron de noche a ir ante Pilato. Profundamente angustiados, le contaron todo lo que habían visto y dijeron: «¡Verdaderamente él era el Hijo de Dios!».


    (46) Pilato respondió: «Soy inocente de la sangre del Hijo de Dios, y esto nos consta».[a]


    (47) Entonces todos los que habían ido le rogaron y lo instaron a ordenar al centurión y a los soldados que no dijeran nada de lo que habían visto. (48) Dijeron: «Es mejor para nosotros ser culpables de un gran pecado ante Dios que caer en manos del pueblo judío y ser apedreados».[b] (49) Así que Pilato ordenó al centurión y a los soldados que no dijeran nada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría traducirse: «Estoy limpio de la sangre del Hijo de Dios». La expresión declara ausencia de responsabilidad por su muerte. El sentido exacto de «esto nos consta» deberá confirmarse mediante revisión directa del griego.'
    reason: Aclara un modismo y señala la incertidumbre derivada de que la revisión del texto griego está pendiente.
  - marker: b
    text: La expresión refleja el temor y la perspectiva de los personajes del relato; no debe entenderse como una acusación contra el pueblo judío en general.
    reason: Previene una generalización antijudía sin alterar la formulación histórica del testimonio.
lexical_decisions:
- source_word: grave / tomb (Greek review pending)
  choice: tumba
  rationale: «Tumba» es natural, digna y coherente en ambos casos; evita la connotación específica de una fosa que puede tener «sepulcro» o «grave» según el contexto.
- source_word: clean of the blood
  choice: inocente de la sangre
  rationale: Conserva el modismo bíblico-jurídico de no ser responsable por la muerte de alguien, sin convertirlo en una explicación interpretativa.
- source_word: Jewish people
  choice: pueblo judío
  rationale: Representa al referente colectivo del testimonio inglés sin emplear una expresión despectiva ni ampliar la acusación más allá del relato.
- source_word: before God
  choice: ante Dios
  rationale: Es la formulación idiomática y solemne para culpabilidad en presencia o juicio de Dios.
theological_decisions:
- issue: Confesión sobre Jesús en el v. 45
  choice: «Verdaderamente él era el Hijo de Dios»
  alternative: «Verdaderamente este era Hijo de Dios»
  rationale: Se conserva el artículo y el tiempo pasado del testimonio proporcionado, sin armonizar la frase con relatos canónicos ni definir su alcance cristológico.
- issue: Declaración de inocencia de Pilato
  choice: «Soy inocente de la sangre del Hijo de Dios»
  alternative: «Estoy limpio de la sangre del Hijo de Dios»
  rationale: «Inocente de la sangre» comunica en español actual el sentido forense del modismo, manteniendo la afirmación teológicamente cargada del narrador sin respaldarla ni corregirla.
- issue: Identidad de «todos los que habían ido»
  choice: Se mantiene el referente colectivo sin identificarlo de manera más precisa
  alternative: «Todos los dirigentes» o «todos los judíos»
  rationale: El pasaje suministrado no identifica expresamente al grupo; precisarlo resolvería indebidamente una ambigüedad textual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la numeración, la secuencia narrativa, las repeticiones significativas y las ambigüedades de los referentes. Este borrador es provisional porque se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del griego del Códice de Akhmim.
