  revision_rationale: 'Se hacen correcciones seguras de fidelidad y sintaxis: se elimina el agente añadido en la cita, se restituye la referencia singular a la bebida mezclada y se emplea un pretérito puntual para la caída. La formulación final de (19) sigue siendo provisional: «fue llevado arriba» se acerca a «was taken up» y no determina su referente. Dado que la base suministrada es un testimonio inglés y la revisión directa del griego está pendiente, se mantienen las notas de ambigüedad y no se introducen armonizaciones canónicas.'
