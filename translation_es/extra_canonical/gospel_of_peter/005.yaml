base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: es
  text: '(15) Era mediodía, y la oscuridad dominaba toda Judea. Ellos estaban inquietos y angustiados ante la posibilidad de que el sol se pusiera mientras él aún seguía vivo, pues está escrito para ellos: «Que el sol no se ponga sobre una persona a la que han dado muerte».[a] (16) Uno de ellos dijo: «Denle a beber hiel con vino agrio». Después de mezclarlos, se los dieron a beber. (17) Así cumplieron todas las cosas y amontonaron pecados sobre sus propias cabezas. (18) Muchos andaban con lámparas, pensando que era de noche, y algunos caían.


    (19) Entonces el Señor gritó: «¡Poder mío, el Poder, me has abandonado!».[b] Cuando dijo esto, fue elevado.[c] (20) En esa misma hora, la cortina del templo de Jerusalén se rasgó en dos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La procedencia exacta de esta cita no se identifica en el pasaje. La redacción «está escrito para ellos» y la expresión «una persona a la que han dado muerte» se conservan sin armonizarlas con otro texto bíblico.
    reason: Aclara una cita o alusión difícil sin atribuirle una fuente no demostrada.
  - marker: b
    text: 'Literalmente según el testimonio utilizado: «Poder mío, el Poder». La expresión es inusual y no se ha sustituido por la forma de otros relatos de la pasión.'
    reason: Preserva una lectura teológicamente significativa y evita una armonización silenciosa.
  - marker: c
    text: El testimonio no deja claro quién o qué «fue elevado»; podría referirse al Señor o a algo relacionado con sus palabras. La traducción mantiene el sujeto implícito.
    reason: Señala una ambigüedad genuina que no debe resolverse sin revisión directa del griego.
lexical_decisions:
- source_word: darkness held fast over
  choice: la oscuridad dominaba
  rationale: Comunica una oscuridad persistente y abarcadora sin recurrir a una expresión poco natural en español.
- source_word: bile with sour wine
  choice: hiel con vino agrio
  rationale: Conserva los dos elementos del testimonio y evita armonizar el pasaje con formulaciones de otros relatos de la pasión.
- source_word: lanterns
  choice: lámparas
  rationale: Es un término amplio y natural para luces portátiles antiguas; «linternas» podría sugerir un objeto moderno.
- source_word: My Power, the Power
  choice: Poder mío, el Poder
  rationale: Mantiene la formulación inusual del testimonio, incluida la diferencia entre el posesivo y el artículo, sin convertirla silenciosamente en una cita armonizada.
- source_word: veil
  choice: cortina
  rationale: «Cortina» resulta comprensible para lectores actuales y designa adecuadamente la separación textil del templo; no se emplea «velo» como tecnicismo tradicional.
theological_decisions:
- issue: La exclamación del Señor
  choice: «¡Poder mío, el Poder, me has abandonado!»
  alternative: «¡Dios mío, Dios mío, por qué me has abandonado!»
  rationale: El testimonio suministrado dice «Power» y presenta una forma distinta de la de los evangelios canónicos. Se conserva esa diferencia y su tensión teológica.
- issue: Sujeto de «fue elevado»
  choice: Se conserva el sujeto sin expresar
  alternative: «su espíritu fue llevado arriba» o «él fue llevado arriba»
  rationale: El testimonio es ambiguo acerca de qué fue elevado. El español permite omitir el sujeto, y la nota advierte la ambigüedad sin imponer una interpretación cristológica o antropológica.
- issue: Acumulación de pecados
  choice: «amontonaron pecados sobre sus propias cabezas»
  alternative: «cargaron con la culpa de todo»
  rationale: Se preserva la imagen concreta y la atribución explícita de pecados, sin reemplazarla por una explicación doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron la secuencia narrativa sencilla y las repeticiones características del pasaje. El borrador es provisional porque el material suministrado indica que la revisión directa del griego del Códice de Akhmim aún está pendiente; por ello, las decisiones se basan en el testimonio inglés público aportado, consultado junto con la capa inglesa POB.
