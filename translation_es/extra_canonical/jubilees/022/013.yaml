  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: es
  text: 'Y se acercó y lo besó. Y dijo: «Benditos sean mi hijo Jacob y todos sus hijos por Yahvé, el Altísimo, por todos los siglos. Que Yahvé te dé una descendencia justa y que santifique a algunos de tus descendientes en medio de toda la tierra. Que las naciones te sirvan y que todas las naciones se inclinen ante tu descendencia».'
