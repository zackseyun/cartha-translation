review_pass:
  verdict: revise
  source_alignment_summary: 'El borrador conserva los elementos principales del ge''ez y de la traducción inglesa auditada: el juramento divino, el hijo «primogénito» y «amado», la bendición y multiplicación enfáticas, las comparaciones con estrellas y arena, y la herencia de las ciudades enemigas. Sin embargo, «no me has retenido a tu hijo» no expresa con naturalidad en español que Abraham no rehusó/negó su hijo a Dios.'
  spanish_quality_summary: 'El registro es claro, digno y apropiado. Se requiere un ajuste breve de régimen y sentido verbal: «no me has negado a tu hijo» es una construcción española natural para «have not withheld your son ... from me» y mantiene la fuerza del pasaje.'
  glossary_alignment: '«Yahvé» aplica correctamente la convención del proyecto para el nombre divino. «Primogénito», «amado», «descendencia» y «heredará» reproducen adecuadamente los valores contextuales transmitidos por la fuente y el audit trail. No se requiere nota: la nota inglesa alternativa parece metadato heredado y no aporta una alternativa española necesaria para el texto publicado.'
  issues:
  - severity: medium
    issue: Construcción «no me has retenido a tu hijo»
    rationale: Aunque intenta reflejar «have not withheld your son ... from me», «retener a tu hijo de mí» resulta forzado y puede sugerir que el hijo estaba ya con Dios. «No me has negado a tu hijo» comunica idiomáticamente que Abraham no se lo rehusó a Dios, sin añadir contenido.
  revised_spanish_text: 'Y dijo: «Por mí mismo he jurado, dice Yahvé, porque has hecho esta cosa y no me has negado a tu hijo, tu primogénito, tu amado, ciertamente te bendeciré y ciertamente multiplicaré tu descendencia como las estrellas del cielo y como la arena que está en la orilla del mar; y tu descendencia heredará las ciudades de sus enemigos».'
  revision_rationale: Se sustituye únicamente una construcción española poco natural por «no me has negado a tu hijo», que preserva el sentido de no retener o rehusar el hijo a Dios. La ausencia de decisiones léxicas y la nota alternativa inglesa constituyen una limitación del audit trail, pero no exigen una nota ni una alteración adicional del texto español.
