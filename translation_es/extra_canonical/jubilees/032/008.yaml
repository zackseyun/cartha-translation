  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: es
  text: La quemarán con fuego, porque ha profanado el nombre de la casa de su padre, y será arrancada de Israel. Y no se hallará fornicación ni impureza en Israel, en todos los días de las generaciones de la tierra, porque Israel es santo para Yahvé; y todo el que profane a Israel ciertamente morirá; lo apedrearán con piedras.
