base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: es
  text: Y así serán tus hijos por todas las edades. Y Yahvé te dé a ti y a tu descendencia grandeza de corazón para su gloria; y te acerque a ti y a tu descendencia a él, de entre toda carne, para que ministren[a] en su santuario como los ángeles de la presencia y como los santos. Como ellos será la descendencia de tus hijos para gloria y grandeza.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: O «para que ministres».
    reason: Preserva la alternativa de persona singular consignada en la nota inglesa; el texto principal «ministren» sigue el plural del verbo ge'ez, referido a la descendencia.
