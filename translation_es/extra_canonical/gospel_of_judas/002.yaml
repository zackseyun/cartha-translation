translation:
  language: es
  text: 'Un día, Jesús estaba con sus discípulos en Judea. Los encontró sentados juntos, practicando su piedad. Cuando [se acercó a] sus discípulos, que estaban sentados juntos orando sobre el pan, [él] se rio.


    Los discípulos le dijeron:


    —Maestro, ¿por qué te ríes de [nuestra] oración? ¿Qué hemos hecho? [Esto] es lo correcto.


    Él les respondió:


    —No me río de ustedes. No hacen esto porque quieran, sino porque por medio de esto su Dios [será] alabado.


    Ellos dijeron:


    —Maestro, tú […] eres el Hijo de nuestro Dios.


    Jesús les dijo:


    —¿Cómo [me] conocen? En verdad [yo] les digo: ninguna generación del pueblo que está entre ustedes me conocerá.


    Cuando sus discípulos oyeron esto, [comenzaron] a llenarse de ira y furia, y comenzaron a maldecirlo en sus corazones.


    Pero cuando Jesús se dio cuenta de su ignorancia, [les dijo]:


    —¿Por qué dejan que su ira los perturbe? ¿Acaso el Dios que está dentro de ustedes y [sus estrellas] se han enojado con sus almas? Si alguno de ustedes es [lo bastante fuerte] entre los seres humanos como para hacer surgir la Humanidad perfecta,[a] que se levante y se plante ante mí.


    Todos dijeron:


    —Somos lo bastante fuertes.


    Pero sus espíritus no tuvieron el valor de presentarse ante [él], excepto Judas Iscariote. Él pudo presentarse ante Jesús, pero no pudo mirarlo a los ojos, así que apartó la mirada.


    Judas [le dijo]:


    —Sé quién eres y de dónde has venido. Has venido del reino inmortal de Barbelo,[b] y no soy digno de pronunciar el nombre de quien te envió.


    Entonces Jesús, sabiendo que Judas estaba pensando en lo que es sublime, le dijo:


    —Apártate de los demás, y te contaré los misterios del reino. No para que vayas allí, sino que sufrirás mucho, porque otro te reemplazará para completar los doce [elementos][c] ante su Dios.


    Judas le dijo:


    —¿Cuándo me contarás estas cosas, y cuándo amanecerá el gran día de luz para la generación […]?


    Pero después que Judas dijo estas cosas, Jesús lo dejó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Humanidad perfecta» puede ser una expresión técnica. También podría entenderse como «el ser humano perfecto»; el testimonio disponible no permite resolver con seguridad el matiz.
    reason: Preservar una ambigüedad antropológica y teológica relevante.
  - marker: b
    text: Barbelo es un nombre empleado en algunos escritos antiguos para una realidad o figura del ámbito divino. Aquí la frase también puede entenderse como «la generación inmortal de Barbelo».
    reason: Orientar al lector sin imponer una reconstrucción doctrinal y reconocer la amplitud semántica de «realm/generation».
  - marker: c
    text: La palabra «elementos» es una restauración de texto dañado; no es seguro qué conjunto de doce se menciona.
    reason: Hacer explícita la incertidumbre manuscrita indicada por los corchetes.
lexical_decisions:
- source_word: practicing their piety
  choice: practicando su piedad
  rationale: Conserva la expresión cultual y su posible matiz crítico sin reducirla a una práctica religiosa específica.
- source_word: praying over the bread
  choice: orando sobre el pan
  rationale: Mantiene la relación espacial y ritual del testimonio; evita identificar sin base suficiente el acto con la eucaristía o una bendición concreta.
- source_word: your God
  choice: su Dios
  rationale: Preserva la distancia retórica de Jesús respecto del Dios de los discípulos, tensión importante del pasaje.
- source_word: perfect Humanity
  choice: la Humanidad perfecta
  rationale: La mayúscula señala que puede tratarse de una realidad antropológica o técnica, sin decidir si significa persona perfecta, humanidad primordial o figura celestial.
- source_word: Barbelo
  choice: Barbelo
  rationale: Se translitera el nombre propio de la figura o ámbito celestial en vez de interpretarlo.
- source_word: the twelve [elements]
  choice: los doce [elementos]
  rationale: Se conserva la restauración entre corchetes y la ambigüedad de aquello que integra el conjunto de doce.
- source_word: generation
  choice: generación
  rationale: Mantiene un término recurrente y posiblemente técnico del escrito sin sustituirlo por pueblo, linaje o raza.
theological_decisions:
- issue: Distancia entre Jesús y el Dios de los discípulos
  choice: su Dios / el Dios que está dentro de ustedes
  alternative: Dios / nuestro Dios
  rationale: El posesivo de segunda persona pertenece al testimonio y no debe armonizarse con formulaciones cristianas posteriores.
- issue: Identidad de Jesús y conocimiento de los discípulos
  choice: ninguna generación del pueblo que está entre ustedes me conocerá
  alternative: ninguno de ustedes me conocerá
  rationale: Se mantiene la construcción colectiva y difícil en lugar de simplificar su alcance teológico.
- issue: Destino de Judas respecto del reino
  choice: No para que vayas allí, sino que sufrirás mucho
  alternative: Podrás ir allí, aunque sufrirás mucho
  rationale: Se conserva la negación y la tensión del testimonio sin convertir el dicho en promesa de salvación o condenación más explícita.
- issue: Naturaleza de la Humanidad perfecta
  choice: Humanidad perfecta
  alternative: Ser Humano perfecto
  rationale: La traducción elegida preserva la posible dimensión colectiva, primordial o celestial del término.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron los corchetes y la elipsis para señalar restituciones, palabras inciertas y lagunas del manuscrito. El diálogo usa «ustedes» y puntuación española. Dado que la revisión directa del copto está pendiente, esta versión es provisional y se basa en el testimonio inglés público suministrado, consultando el POB inglés solo como capa de control.
