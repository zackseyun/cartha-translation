  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: es
  text: 'A la mañana siguiente, se apareció a sus discípulos. [Y] ellos le dijeron:


    —Maestro, ¿adónde [fuiste] y qué hiciste cuando nos dejaste?


    Jesús les respondió:


    —Fui a otra generación grande y santa.[a]


    Sus discípulos le preguntaron:


    —Señor, ¿qué gran generación es mejor y más santa que nosotros, y no está en estos dominios?


    Al oír esto, Jesús se rio y les dijo:


    —¿Por qué se preguntan en su corazón acerca de la generación fuerte y santa? En verdad les digo: nadie nacido [de] este dominio verá a esa [generación]. Ningún ejército de ángeles de las estrellas gobernará sobre ella, y ninguna persona de nacimiento mortal podrá unirse a ella, porque esa generación no procede de […] que ha llegado a ser […] la generación de la gente entre [ellos] procede de la generación de la gran gente […] las autoridades poderosas que […] ni los poderes […] aquellos mediante los cuales ustedes gobiernan.[b]


    Cuando sus discípulos oyeron estas cosas, cada uno quedó perturbado en su espíritu. No pudieron decir nada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Generación» puede referirse a un linaje, un grupo o una clase de seres. El texto no precisa aquí cuál de estos sentidos predomina.
    reason: Preservar la ambigüedad semántica y evitar una identificación doctrinal prematura.
  - marker: b
    text: Los corchetes reproducen palabras restauradas o inciertas en el testimonio suministrado; los puntos suspensivos entre corchetes, […], indican lagunas del manuscrito. Por eso esta sección queda fragmentaria y su relación sintáctica no siempre puede determinarse.
    reason: Advertir al lector sobre el daño textual y evitar que la traducción aparente una certeza inexistente.
lexical_decisions:
- source_word: generation
  choice: generación
  rationale: 'Conserva la repetición y la posible amplitud semántica del testimonio: linaje, grupo o clase de seres, sin reducirla a una sola interpretación.'
- source_word: realm(s)
  choice: dominio(s)
  rationale: Expresa un ámbito sujeto a potestad o gobierno y encaja con el lenguaje cosmológico del pasaje sin introducir el término técnico «eón», ausente del testimonio suministrado.
- source_word: strong
  choice: fuerte
  rationale: Mantiene el sentido directo y la tensión del calificativo sin reinterpretarlo como autoridad, poder espiritual o virtud moral.
- source_word: rule over
  choice: gobernará sobre
  rationale: Conserva la idea explícita de dominio ejercido sobre la generación.
- source_word: mortal birth
  choice: de nacimiento mortal
  rationale: Reproduce la referencia al origen mortal sin convertirla en una afirmación doctrinal más específica.
- source_word: join it
  choice: unirse a ella
  rationale: Es una formulación natural que preserva la posibilidad de incorporación o pertenencia sin precisar un mecanismo.
theological_decisions:
- issue: Naturaleza de la «generación grande y santa»
  choice: Mantener «generación» y los calificativos del testimonio sin identificarla.
  alternative: Interpretarla explícitamente como linaje celestial, raza espiritual, iglesia o grupo de elegidos.
  rationale: El pasaje distingue a esta generación de los nacidos en el dominio presente, pero no ofrece aquí base suficiente para fijar una identidad doctrinal única.
- issue: «Ángeles de las estrellas»
  choice: Traducir la expresión literalmente.
  alternative: Explicarla como ángeles astrales, arcontes o poderes demoníacos.
  rationale: La traducción literal conserva la cosmología del texto sin imponer una clasificación teológica no explícita en el testimonio.
- issue: Risa de Jesús
  choice: «Jesús se rio», sin explicación valorativa.
  alternative: Presentarla como burla, compasión, aprobación o ironía.
  rationale: El texto señala la risa, pero no determina inequívocamente su intención.
- issue: Origen y acceso a la generación
  choice: Conservar las negaciones y la sintaxis fragmentaria hasta donde resulta legible.
  alternative: Reconstruir una doctrina coherente sobre el origen celestial o la imposibilidad absoluta de acceso.
  rationale: Las lagunas impiden resolver de manera segura la relación entre procedencia, nacimiento mortal y pertenencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y raya de diálogo para una lectura natural. Se conserva la reiteración de «generación», «dominio» y «poderes», así como la brusquedad del tramo deteriorado. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Códice Tchacos 3.
