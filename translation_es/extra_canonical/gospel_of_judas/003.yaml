    —¿Por qué se preguntan en sus corazones acerca de la generación fuerte y santa? En verdad les digo: nadie nacido [de] este dominio verá a esa [generación]. Ningún ejército de ángeles de las estrellas gobernará sobre ella, y ninguna persona de nacimiento mortal podrá unirse a ella, porque esa generación no procede de […] que ha llegado a ser […] la generación de la gente entre [ellos] procede de la generación del gran pueblo […] las autoridades poderosas que […] ni los poderes […] aquellos mediante los cuales ustedes gobiernan.[b]


    Cuando sus discípulos oyeron estas cosas, cada uno quedó perturbado en su espíritu. No pudieron decir nada.'
