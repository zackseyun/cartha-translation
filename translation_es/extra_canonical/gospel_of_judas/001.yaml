  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: es
  text: 'Este es el mensaje secreto de juicio que Jesús comunicó a Judas Iscariote durante un período de ocho días, tres días antes de celebrar la Pascua.


    Cuando apareció en la tierra, hizo señales y grandes prodigios para la salvación de la humanidad. Algunos [anduvieron][a] por el camino de la justicia, pero otros anduvieron en su transgresión; por eso fueron llamados los doce discípulos. Comenzó a hablarles de los misterios que están más allá del mundo y de lo que sucedería al final. A menudo no se manifestaba a sus discípulos, sino que lo encontraban entre ellos como un niño.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes indican texto restaurado o incierto en el manuscrito.
    reason: La palabra correspondiente aparece entre corchetes en el testimonio inglés suministrado y debe conservarse como restauración editorial.
  - marker: b
    text: 'También podría entenderse: «lo encontrabas entre ellos como un niño»; el testimonio inglés usa una forma impersonal de segunda persona.'
    reason: La forma inglesa «you’d find» admite una lectura genérica; se eligió el plural contextual «lo encontraban» para un español natural, sin ocultar la alternativa.
lexical_decisions:
- source_word: secret message of judgment
  choice: mensaje secreto de juicio
  rationale: Conserva la formulación y la ambigüedad del testimonio disponible sin convertir «juicio» en condena, sentencia o declaración.
- source_word: spoke with Judas Iscariot
  choice: comunicó a Judas Iscariote
  rationale: «Comunicó» expresa la transmisión del mensaje con naturalidad en español y evita sugerir necesariamente una conversación recíproca.
- source_word: Passover
  choice: la Pascua
  rationale: Es el término bíblico usual y comprensible en español para la festividad judía mencionada.
- source_word: signs and great wonders
  choice: señales y grandes prodigios
  rationale: Mantiene la pareja tradicional de conceptos y un registro digno sin volverla excesivamente arcaica.
- source_word: humanity
  choice: la humanidad
  rationale: Reproduce el alcance colectivo e inclusivo del término sin añadir una interpretación sobre individuos concretos.
- source_word: way of righteousness
  choice: camino de la justicia
  rationale: Conserva tanto la metáfora del camino como la amplitud ética y religiosa de «justicia».
- source_word: mysteries beyond the world
  choice: misterios que están más allá del mundo
  rationale: Preserva la dimensión espacial o trascendente del testimonio y evita precisar una cosmología no explícita.
- source_word: at the end
  choice: al final
  rationale: Mantiene la referencia abierta sin añadir «del mundo», «de los tiempos» u otra precisión escatológica ausente.
- source_word: reveal himself
  choice: se manifestaba
  rationale: Expresa que Jesús no se hacía reconocible o visible de la manera habitual, sin determinar exactamente la naturaleza del fenómeno.
theological_decisions:
- issue: Sentido de «juicio» en el título inicial
  choice: juicio
  alternative: condena / sentencia
  rationale: El testimonio permite una noción amplia de juicio; escoger una alternativa más estrecha resolvería indebidamente su posible sentido teológico.
- issue: Relación causal en el llamado de los doce
  choice: «por eso fueron llamados los doce discípulos»
  alternative: «y fueron llamados los doce discípulos»
  rationale: Se conserva el nexo causal presente en el testimonio, aunque su referente narrativo resulte poco claro.
- issue: Estado o aparición de Jesús como niño
  choice: «lo encontraban entre ellos como un niño»
  alternative: «aparecía entre ellos en forma de niño»
  rationale: La redacción mantiene el símil y evita afirmar una transformación corporal explícita que el testimonio no exige.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservaron los corchetes de restauración y las ambigüedades principales. Este borrador es provisional porque se basa en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Codex Tchacos 3.
