lexical_decisions:
- source_word: the one who bears me / the human who bears me
  choice: el que me lleva / el ser humano que me lleva
  rationale: Conserva la imagen corporal y la posible distinción entre Jesús y quien lo porta, sin explicarla doctrinalmente.
- source_word: Saklas
  choice: Saklas
  rationale: Se translitera el nombre propio en vez de identificarlo o interpretarlo.
- source_word: horn
  choice: cuerno
  rationale: Mantiene literalmente el símbolo del testimonio, cuya función precisa es ambigua.
- source_word: realm(s)
  choice: reino(s)
  rationale: «Reino» es natural y conserva el sentido de esfera o dominio; no se añadió una cosmología explicativa.
- source_word: guest room
  choice: aposento de huéspedes
  rationale: Traducción transparente que evita equipararlo sin certeza con un lugar tradicional específico.
- source_word: handed him over
  choice: se lo entregó
  rationale: Reproduce el acto de entrega sin imponer el término teológicamente cargado «traicionó» en la oración final.
theological_decisions:
- issue: Relación entre Jesús y «el ser humano que me lleva»
  choice: Conservar la formulación literal «el ser humano que me lleva»
  alternative: Interpretar «mi cuerpo» o «el hombre que me reviste»
  rationale: El pasaje admite tensión antropológica y cristológica; la traducción no debe resolverla.
- issue: Naturaleza de la acción de Judas
  choice: «sacrificarás» y, al final, «se lo entregó»
  alternative: «matarás» y «lo traicionó»
  rationale: Se preserva el vocabulario sacrificial del discurso y la expresión narrativa neutral del testimonio.
- issue: Antigüedad de la gran generación de Adán
  choice: «existe desde antes que el cielo, la tierra y los ángeles»
  alternative: «está presente ante el cielo, la tierra y los ángeles»
  rationale: Sigue el valor temporal de «before» en el testimonio, aunque la revisión directa del copto permanece pendiente.
- issue: Entrada de Judas en la nube
  choice: Afirmar sencillamente que «entró en ella»
  alternative: Explicar la entrada como exaltación, muerte o visión
  rationale: El texto no explicita la naturaleza del suceso.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las repeticiones solemnes de «En verdad», las imágenes poco familiares y las ambigüedades del testimonio. Los corchetes se conservaron en el cuerpo del texto; el único marcador de nota, [a], aparece allí explícitamente.
