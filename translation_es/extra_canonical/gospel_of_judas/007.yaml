translation:
  language: es
  text: 'Jesús dijo: «En verdad [les digo]: este bautismo [que han recibido en] mi nombre […] destruirá a toda la generación del Adán terrenal. Mañana torturarán al que me lleva. En verdad [les digo]: ninguna mano de un ser humano mortal [caerá] sobre mí. En verdad [te digo], Judas: los que ofrecen sacrificios a Saklas […] todo lo malo. Pero tú harás más que todos ellos, porque sacrificarás al ser humano que me lleva. Tu cuerno ya se ha alzado, tu ira se ha encendido, tu estrella ha ascendido y tu corazón se ha [desviado]. En verdad [te digo]: tu último [… y] el [… los tronos] del reino han sido [derrotados], los reyes se han debilitado, las generaciones angélicas se han entristecido, el mal [que sembraron…] es destruido [y] el [gobernante] es aniquilado. [Y] entonces el [fruto] de la gran generación de Adán será exaltado, porque esa generación, procedente de los reinos, existe desde antes que el cielo, la tierra y los ángeles. Mira, se te ha dicho todo. Alza los ojos y contempla la nube
    que tiene luz en su interior y las estrellas que la rodean. La estrella que va al frente es tu estrella».


    Entonces Judas alzó la mirada, vio la nube luminosa y entró en ella. Los que estaban de pie en el suelo oyeron una voz que salía de la nube y decía: «[… la] gran [generación…] y […]».[a] Y Judas ya no vio a Jesús.


    De inmediato se produjo entre [los] judíos una agitación mayor que […]. Sus sumos sacerdotes murmuraban porque él había entrado en el aposento de huéspedes para orar. Pero allí había algunos escribas que vigilaban atentamente para arrestarlo mientras oraba. Tenían miedo del pueblo, pues todos lo consideraban profeta.


    Se acercaron a Judas y le dijeron:


    —¿Qué haces aquí? ¿No eres discípulo de Jesús?


    Él les respondió como ellos querían. Entonces Judas recibió algún dinero y se lo entregó.


    El Evangelio de Judas'
