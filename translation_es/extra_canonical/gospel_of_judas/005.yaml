  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: es
  text: 'Cuando Jesús [dijo] estas cosas, se fue, [llevando] consigo a Judas Iscariote. Le dijo: «El agua de la montaña elevada procede [de] […] No vino a [regar… el pozo] del árbol [del fruto…] de este mundo […] después de un tiempo […], sino que vino a regar el paraíso de Dios y el [fruto] perdurable, porque [eso] no corromperá la [forma de vida] de aquella generación, sino que [existirá] por toda la eternidad».


    Judas le [dijo: «Dime], ¿qué clase de fruto tiene esta generación?».


    Jesús dijo: «Las almas de toda generación humana morirán. Sin embargo, cuando estas personas hayan cumplido su tiempo en el reino y el espíritu las abandone, sus cuerpos morirán, pero sus almas vivirán y serán llevadas a lo alto».


    Judas dijo: «¿Qué harán las demás generaciones humanas?».


    Jesús dijo: «No es posible sembrar en [roca] y cosechar su fruto. Del mismo modo, [no es posible sembrar en] la estirpe [corrompida], junto con la sabiduría perecedera [y] la mano que creó a los seres humanos mortales, para que sus almas asciendan a los ámbitos superiores. [En verdad] te digo: [ningún gobernante], ángel [ni] poder podrá ver los [lugares] que [esta gran] generación santa [verá]». Después de decir esto, Jesús se fue.


    Judas dijo: «Maestro, así como has escuchado a todos ellos, escúchame ahora también a mí, porque he tenido una gran visión».


    Pero Jesús se rio al oírlo. Le dijo: «¿Por qué estás tan agitado, demonio decimotercero? Habla, y tendré paciencia contigo».


    Judas le dijo: «En la visión me vi a mí mismo. Los doce discípulos me apedreaban y me perseguían [rápidamente]. También llegué al lugar donde [te había seguido]. Vi [una casa en aquel lugar], y mis ojos no podían [medir] su tamaño. La rodeaban personas importantes, y aquella casa tenía un techo de vegetación. En medio de la casa había [una multitud…]. ¡Maestro, recíbeme junto con estas personas!».


    [Jesús] respondió: «Tu estrella te ha extraviado, Judas», y añadió: «Ninguna persona de nacimiento mortal es digna de entrar en la casa que has visto, porque ese lugar está reservado para los santos. Allí no gobernarán ni el sol, ni la luna, ni el día; los santos, en cambio, permanecerán siempre en el ámbito con los ángeles santos. Mira, te he revelado los misterios del reino y te he instruido acerca del extravío de las estrellas y […] enviado [a lo alto] sobre los doce ámbitos».


    Judas dijo: «Maestro, mi descendencia no domina a los gobernantes, ¿verdad?».


    Jesús le respondió: «Ven, déjame [hablarte de la generación santa. No para que vayas allí], sino que sentirás gran tristeza cuando veas el reino y toda su generación».


    Al oír esto, Judas le dijo: «¿De qué me ha servido que me hayas separado de aquella generación?».


    Jesús respondió: «Llegarás a ser el decimotercero; las demás generaciones te maldecirán, y tú gobernarás sobre ellas. En los últimos días, ellas […] hacia ti, y tú no ascenderás hasta la generación santa».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: realm / realms
  choice: mundo / ámbitos
  rationale: En «este mundo» el contexto parece cosmológico y la expresión resulta natural; en «ámbitos superiores» y «doce ámbitos» se conserva la idea de regiones celestes sin imponer la terminología de un sistema doctrinal concreto.
- source_word: generation
  choice: generación
  rationale: Se mantiene el término repetido porque puede referirse tanto a un conjunto humano como a una categoría espiritual; traducirlo como «raza» o «linaje» resolvería indebidamente esa ambigüedad.
- source_word: race
  choice: estirpe
  rationale: Distingue este término del repetido «generación» y evita las connotaciones modernas de «raza», conservando la idea de procedencia o grupo.
- source_word: ruler(s)
  choice: gobernante(s)
  rationale: Conserva la posible referencia tanto a autoridades como a poderes cósmicos, sin identificarla expresamente con «arcontes» ante la falta de revisión copta directa.
- source_word: seed
  choice: descendencia
  rationale: Mantiene el sentido colectivo y genealógico posible, más natural en español que el literal «semilla» en esta pregunta.
- source_word: thirteenth demon
  choice: demonio decimotercero
  rationale: Reproduce la designación abrupta y teológicamente tensa del testimonio sin suavizarla ni reinterpretarla.
- source_word: taken up / ascend
  choice: serán llevadas a lo alto / asciendan
  rationale: Se preserva la diferencia entre una acción pasiva y otra activa presente en el testimonio.
- source_word: great people
  choice: personas importantes
  rationale: Expresa el probable sentido de rango o eminencia; «personas grandes» sería poco natural y ambiguo en español.
theological_decisions:
- issue: Destino de Judas respecto de la generación santa
  choice: «tú no ascenderás hasta la generación santa»
  alternative: «no entrarás en la generación santa»
  rationale: Se conserva el verbo espacial «ascender» del testimonio, aunque la imagen resulte difícil, para no convertirla en una afirmación doctrinal más explícita de pertenencia o exclusión.
- issue: Condición de las almas y los cuerpos
  choice: «sus cuerpos morirán, pero sus almas vivirán y serán llevadas a lo alto»
  alternative: Parafrasear como inmortalidad natural del alma o resurrección
  rationale: La traducción mantiene la antropología propia del pasaje sin armonizarla con sistemas teológicos posteriores.
- issue: La mano creadora y las almas
  choice: Se conserva la sintaxis «la mano que creó… para que sus almas asciendan»
  alternative: Reordenar la frase para atribuir con certeza una intención positiva o negativa al creador
  rationale: El pasaje está dañado y su relación lógica es incierta; no se resuelve quién actúa ni cómo se vinculan creación y ascenso.
- issue: La estrella de Judas
  choice: «Tu estrella te ha extraviado»
  alternative: Interpretarla como destino, ángel personal o signo astrológico
  rationale: Se preserva la imaginería astral del texto sin definir su metafísica.
- issue: Judas como el decimotercero
  choice: «Llegarás a ser el decimotercero… gobernarás sobre ellas»
  alternative: Explicarlo como exaltación, condena o sustitución apostólica
  rationale: Se mantiene la tensión entre maldición y gobierno sin imponer una valoración definitiva.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice Tchacos 3. Los corchetes y puntos suspensivos se conservaron para señalar restauraciones, lagunas o texto dañado del manuscrito. Se corrigieron únicamente uniones accidentales evidentes de palabras. No se añadieron notas al pie, por lo que no hay marcadores que insertar en el texto principal.
