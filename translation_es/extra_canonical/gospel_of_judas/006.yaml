translation:
  language: es
  text: 'Jesús dijo:


    —[Ven], y te enseñaré acerca de los [misterios que ningún] ser humano [verá], porque existe un reino grande e ilimitado cuyos confines ninguna generación angélica ha visto. [En] él hay un [gran] Espíritu invisible, al que ningún ojo [angélico] ha visto jamás, ningún corazón ha comprendido y nunca se le ha dado nombre alguno.


    »Allí apareció una nube luminosa. Y él —el Espíritu— dijo: “Que llegue a existir un ángel para servirme”. Entonces de la nube surgió un gran ángel, el Autogenerado, el Dios de la Luz. Por causa de él, otros cuatro ángeles llegaron a existir desde otra nube y sirvieron al Autogenerado angélico. Y el [Autogenerado] dijo: “Que llegue a existir [un reino]”; y llegó a existir [tal como él dijo]. Él [creó] la primera luminaria para que gobernara sobre ese reino. Luego dijo: “Que lleguen a existir ángeles para servir[la]”; y llegaron a existir [miríadas] incontables. También dijo: “[Que llegue a] existir un reino luminoso”; y llegó a existir. Creó la segunda luminaria para que gobernara sobre él, junto con miríadas incontables de ángeles que prestaran servicio. Así creó los demás reinos de luz. Designó quiénes los gobernarían y creó para ellos miríadas incontables de ángeles que los asistieran.


    »Adamas estaba en la primera nube de luz, que ningún ángel entre todos los llamados “Dios” podía ver jamás. Y [Adamas engendró a Set en] aquel [lugar según la] imagen [de…] y según la semejanza de [este] ángel. Hizo aparecer la [generación] incorruptible de Set ante las doce [luminarias] andróginas. [Después] hizo aparecer setenta y dos luminarias en la generación incorruptible, conforme a la voluntad del Espíritu. A su vez, las setenta y dos luminarias hicieron aparecer trescientas sesenta luminarias en la generación incorruptible, conforme a la voluntad del Espíritu, para que hubiera cinco por cada una. Los doce reinos de las doce luminarias constituyen a su padre. Cada reino tiene seis cielos, de modo que hay setenta y dos cielos para las setenta y dos luminarias; y cada una [de ellas tiene cinco] firmamentos, [para un total de] trescientos sesenta [firmamentos]. Se [les] concedió autoridad y un [gran] ejército de incontables ángeles para honra y servicio, además de espíritus vírgenes
    [también], para honra y [servicio] de todos los reinos y de los cielos con sus firmamentos.


    »Ahora bien, el padre y las setenta y dos luminarias, junto con el Autogenerado y sus setenta y dos reinos, llaman “cosmos” —es decir, “perecedero”— al conjunto de aquellos inmortales.[a] Allí apareció el primer ser humano con sus poderes incorruptibles. En el reino que apareció con su generación están la nube del conocimiento y el ángel llamado [Eleleth…]. Después de estas cosas, [Eleleth] dijo: “Que lleguen a existir doce ángeles [para] gobernar sobre el Caos y el [Hades]”. Y miren: de la nube apareció un [ángel] cuyo rostro centelleaba con [fuego] y cuya apariencia estaba [manchada] de sangre. Su nombre era Nebro, que significa “Rebelde”. Otros lo llaman Yaldabaot. También otro ángel, Saklas, salió de la nube. Entonces Nebro creó seis ángeles —y Saklas [hizo lo mismo]— para que fueran ayudantes. Produjeron doce ángeles en los cielos, y cada uno recibió una porción en ellos.


    »Los doce gobernantes dijeron a los doce ángeles: “Que cada uno de ustedes […] y que ellos […] generación [… cinco] ángeles:


    »El primero [es Yaot], llamado “el Bueno”.


    »El segundo es Harmatot, [el ojo de fuego].


    »El [tercero] es Galila.


    »El cuarto [es] Yobel.


    »El quinto es Adonaios.


    »Estos son los cinco que gobernaron sobre el Hades y son los primeros sobre el Caos.


    »Entonces Saklas dijo a sus ángeles: “Creemos un ser humano según la semejanza y la imagen”.[b] Y formaron a Adán y a su esposa Eva, quien en la nube es llamada “Vida”, porque con este nombre todas las generaciones lo buscan, y cada una la llama con sus propios nombres.[c] Ahora bien, Saklas no [ordenó…] dar a luz, excepto […] entre las generaciones […] que este […] y el [ángel] le dijo: “Tu vida durará un tiempo limitado, junto con la de tus hijos”».


    Entonces Judas preguntó a Jesús:


    —¿[Cuánto] tiempo puede vivir una persona?


    Jesús respondió:


    —¿Por qué te asombra que la duración de la vida de Adán y de su generación sea limitada en el lugar donde él recibió su reino junto con su gobernante?


    Judas preguntó a Jesús:


    —¿Muere el espíritu humano?


    Jesús respondió:


    —Así es la cuestión: Dios ordenó a Miguel que prestara espíritus a los seres humanos para que sirvieran. Después, el Grande ordenó a Gabriel que diera espíritus a la gran generación que no tiene rey: el espíritu junto con el alma. Así que el [resto] de las almas […] luz [… el] Caos […] busquen [el] espíritu que está dentro de ustedes, al cual hicieron vivir en esta carne procedente de las generaciones angélicas.[d] Después, Dios hizo que el conocimiento fuera llevado a Adán y a quienes estaban con él, para que los reyes del Caos y del Hades no gobernaran sobre ellos.


    [Entonces] Judas preguntó a Jesús:


    —Entonces, ¿qué harán aquellas generaciones?


    Jesús respondió:


    —En verdad te digo que las estrellas llevan a término todas estas cosas. Cuando Saklas complete el período que se le ha fijado, la primera estrella de ellos aparecerá con las generaciones, y ellos terminarán lo que se ha dicho. Entonces cometerán inmoralidad sexual en mi nombre, asesinarán a sus hijos y [ellos…] mal y […] los reinos, llevando a las generaciones y presentándolas ante Saklas. [Y] después de eso […] llevará a las doce tribus de [Israel] desde […], y todas las [generaciones] servirán a Saklas, pecando en mi nombre. Y tu estrella [gobernará] sobre el decimotercer reino.


    Entonces Jesús [se rio].


    [Judas] preguntó:


    —Maestro, ¿por qué [te ríes de mí]?


    [Jesús] respondió:


    —No me río [de ti, sino] del extravío de las estrellas, porque esas seis estrellas se extravían junto con esos cinco guerreros, y todas serán destruidas junto con sus creaciones.


    Entonces Judas preguntó a Jesús:


    —¿Qué harán los que han sido bautizados en tu nombre?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La relación sintáctica entre «cosmos», «perecedero», el padre, las luminarias y el conjunto de los inmortales es difícil. La traducción sigue el testimonio inglés suministrado y conserva la paradoja de que los inmortales reciban una designación glosada como «perecedero».
    reason: Ambigüedad textual y conceptual que no conviene resolver silenciosamente.
  - marker: b
    text: La frase invierte el orden más conocido «imagen y semejanza»; aquí se conserva «semejanza y la imagen» según el testimonio disponible.
    reason: Preservar el orden de la fuente y evitar armonización con Génesis.
  - marker: c
    text: 'Los pronombres de esta oración son discordantes en el testimonio conservado: «lo buscan» parece referirse a un masculino, mientras «la llama» se refiere a Eva. Se conserva la dificultad en vez de uniformar los referentes.'
    reason: Daño o inestabilidad textual con referente pronominal incierto.
  - marker: d
    text: Esta oración está muy fragmentada; no es seguro quién hace vivir al espíritu en la carne ni cómo se relacionan «luz», «Caos» y «generaciones angélicas».
    reason: Advertir que la sintaxis ofrecida es provisional y no una reconstrucción segura.
lexical_decisions:
- source_word: realm
  choice: reino
  rationale: Conserva la dimensión espacial y gubernativa del término dentro de la cosmología del escrito; «ámbito» sería posible, pero perdería parte del matiz de dominio.
- source_word: Self-Begotten
  choice: Autogenerado
  rationale: Reproduce el título técnico sin identificarlo con una categoría doctrinal posterior. Se escribe con mayúscula por funcionar como título propio.
- source_word: luminary
  choice: luminaria
  rationale: Mantiene la designación cosmológica técnica y evita reducirla a «astro» o «luz».
- source_word: generation
  choice: generación
  rationale: Preserva la polisemia entre linaje, grupo y orden de seres, sin resolverla contextualmente de manera uniforme.
- source_word: incorruptible
  choice: incorruptible
  rationale: Conserva el contraste cosmológico con lo perecedero y su carga teológica sin parafrasearla.
- source_word: androgynous
  choice: andróginas
  rationale: Traducción directa del descriptor de las luminarias, sin suavizar su contenido cosmológico.
- source_word: cosmos
  choice: cosmos
  rationale: Se mantiene el préstamo reconocido en español porque el propio texto añade la glosa «perecedero» y parece explotar una denominación técnica.
- source_word: Chaos
  choice: Caos
  rationale: Se trata como región cosmológica personificada o titulada, no meramente como desorden abstracto.
- source_word: Hades
  choice: Hades
  rationale: Se translitera el nombre de la región del inframundo para no equipararlo automáticamente con «infierno».
- source_word: to loan spirits
  choice: prestara espíritus
  rationale: Mantiene la inusual metáfora del préstamo, importante para la antropología del pasaje, en vez de normalizarla como «dar».
- source_word: sleep around
  choice: cometerán inmoralidad sexual
  rationale: Expresa en registro digno el sentido de conducta sexual promiscua sin introducir una práctica más específica de la que permite el testimonio.
- source_word: error / go astray
  choice: extravío / se extravían
  rationale: Conserva el vínculo léxico y la noción de desviación de las estrellas, evitando convertirla sin más en error intelectual.
theological_decisions:
- issue: Identidad del Espíritu invisible y del Autogenerado
  choice: Se conservan como figuras distintas según la secuencia y los títulos del texto.
  alternative: Identificarlos explícitamente con Dios Padre y Cristo.
  rationale: El pasaje presenta una cosmología propia y no autoriza imponer identificaciones de sistemas doctrinales posteriores.
- issue: «Todos los llamados Dios»
  choice: Se traduce literalmente y con «Dios» entre comillas.
  alternative: Reformular como «todos los que son llamados dioses».
  rationale: La sintaxis y el referente son difíciles; la formulación conserva la tensión y evita decidir si «Dios» funciona como título colectivo o nombre.
- issue: Espíritu y alma en la gran generación
