review_pass:
  verdict: revise
  source_fidelity: 'La versión sigue de cerca el testimonio inglés suministrado y conserva en general las lagunas mediante corchetes y puntos suspensivos. Sin embargo, hay correcciones seguras: «Designó quiénes los gobernarían» añade una agencia y unos referentes no expresados, donde el testimonio dice que los reinos «fueron hechos para ser gobernados»; la frase fragmentaria dirigida a Judas cambia indebidamente el singular («tú / has hecho») por plural («ustedes / hicieron»); y la colocación de los corchetes en «servir[la]» no reproduce la restauración ni concuerda con «reino».'
  naturalness: 'El español es mayormente natural, moderno y de registro adecuado. Se ajustan algunas construcciones para que conserven la rareza de la fuente sin introducir ambigüedad gramatical evitable: «los hizo ser gobernados», «hicieron surgir doce ángeles» y «cinco firmamentos para cada una».'
  terminology: Se mantienen de modo consistente «Autogenerado», «luminaria», «Caos», «Hades», «incorruptible» y «reino». Se conservan las formas españolas moderadamente adaptadas de los nombres (Set, Adán, Yaldabaot, Yaot, Harmatot) y no se imponen identificaciones doctrinales a las figuras cosmológicas.
  issues:
  - severity: medium
    issue: Agencia añadida en la organización de los reinos de luz
    rationale: «Designó quiénes los gobernarían» interpreta y amplía «he made them to be ruled». La revisión conserva la pasiva/causativa sin identificar gobernantes.
  - severity: medium
    issue: Cambio de persona en el pasaje muy fragmentario sobre el espíritu
    rationale: El testimonio inglés dice «the spirit within you which you’ve made to live» y se dirige a Judas en singular. «Dentro de ustedes, al cual hicieron» altera esa persona.
  - severity: medium
    issue: Corchetes y concordancia en «servir[la]»
    rationale: El antecedente es «reino», masculino, y el corchete del testimonio abarca la restauración que comienza con «it». La formulación revisada conserva la señal editorial sin feminizar el referente.
  - severity: low
    issue: «Produjeron doce ángeles» es menos idiomático para la emanación descrita
    rationale: «Hicieron surgir doce ángeles» comunica la acción sin sugerir producción material ni cambiar el contenido.
  revised_text: 'Jesús dijo:


    —[Ven], y te enseñaré acerca de los [misterios que ningún] ser humano [verá], porque existe un reino grande e ilimitado cuyos confines ninguna generación angélica ha visto. [En] él hay un [gran] Espíritu invisible, al que ningún ojo [angélico] ha visto jamás, ningún corazón ha comprendido y nunca se le ha dado nombre alguno.


    »Allí apareció una nube luminosa. Y él —el Espíritu— dijo: “Que llegue a existir un ángel para servirme”. Entonces de la nube surgió un gran ángel, el Autogenerado, el Dios de la Luz. Por causa de él, otros cuatro ángeles llegaron a existir desde otra nube y sirvieron al Autogenerado angélico. Y el [Autogenerado] dijo: “Que llegue a existir [un reino]”; y llegó a existir [tal como él dijo]. Él [creó] la primera luminaria para que gobernara sobre ese reino. Luego dijo: “Que lleguen a existir ángeles para servir[lo,” y llegaron a existir miríadas] incontables. También dijo: “[Que llegue a] existir un reino luminoso”; y llegó a existir. Creó la segunda luminaria para que gobernara sobre él, junto con miríadas incontables de ángeles que prestaran servicio. Así creó los demás reinos de luz. Los hizo ser gobernados y creó para ellos miríadas incontables de ángeles que los asistieran.


    »Adamas estaba en la primera nube de luz, que ningún ángel entre todos los llamados “Dios” podía ver jamás. Y [Adamas engendró a Set en] aquel [lugar según la] imagen [de…] y según la semejanza de [este] ángel. Hizo aparecer la [generación] incorruptible de Set ante las doce [luminarias] andróginas. [Después] hizo aparecer setenta y dos luminarias en la generación incorruptible, conforme a la voluntad del Espíritu. A su vez, las setenta y dos luminarias hicieron aparecer trescientas sesenta luminarias en la generación incorruptible, conforme a la voluntad del Espíritu, para que hubiera cinco por cada una. Los doce reinos de las doce luminarias constituyen a su padre. Cada reino tiene seis cielos, de modo que hay setenta y dos cielos para las setenta y dos luminarias; y para cada una [cinco] firmamentos, [para un total de] trescientos sesenta [firmamentos]. Se [les] concedió autoridad y un [gran] ejército de incontables ángeles para honra y servicio, además de espíritus vírgenes [también],
    para honra y [servicio] de todos los reinos y de los cielos con sus firmamentos.


    »Ahora bien, el padre y las setenta y dos luminarias, junto con el Autogenerado y sus setenta y dos reinos, llaman “cosmos” —es decir, “perecedero”— al conjunto de aquellos inmortales.[a] Allí apareció el primer ser humano con sus poderes incorruptibles. En el reino que apareció con su generación están la nube del conocimiento y el ángel llamado [Eleleth…]. Después de estas cosas, [Eleleth] dijo: “Que lleguen a existir doce ángeles [para] gobernar sobre el Caos y el [Hades]”. Y miren: de la nube apareció un [ángel] cuyo rostro centelleaba con [fuego] y cuya apariencia estaba [manchada] de sangre. Su nombre era Nebro, que significa “Rebelde”. Otros lo llaman Yaldabaot. También otro ángel, Saklas, salió de la nube. Entonces Nebro creó seis ángeles —y Saklas [hizo lo mismo]— para que fueran ayudantes. Hicieron surgir doce ángeles en los cielos, y cada uno recibió una porción en ellos.


    »Los doce gobernantes dijeron a los doce ángeles: “Que cada uno de ustedes […] y que ellos […] generación [… cinco] ángeles:


    »El primero [es Yaot], llamado “el Bueno”.


    »El segundo es Harmatot, [el ojo de fuego].


    »El [tercero] es Galila.


    »El cuarto [es] Yobel.


    »El quinto es Adonaios.


    »Estos son los cinco que gobernaron sobre el Hades y son los primeros sobre el Caos.


    »Entonces Saklas dijo a sus ángeles: “Creemos un ser humano según la semejanza y la imagen”.[b] Y formaron a Adán y a su esposa Eva, quien en la nube es llamada “Vida”, porque con este nombre todas las generaciones lo buscan, y cada una la llama con sus propios nombres.[c] Ahora bien, Saklas no [ordenó…] dar a luz, excepto […] entre las generaciones […] que este […] y el [ángel] le dijo: “Tu vida durará un tiempo limitado, junto con la de tus hijos”».


    Entonces Judas preguntó a Jesús:


    —¿[Cuánto] tiempo puede vivir una persona?


    Jesús respondió:


    —¿Por qué te asombra que la duración de la vida de Adán y de su generación sea limitada en el lugar donde él recibió su reino junto con su gobernante?


    Judas preguntó a Jesús:


    —¿Muere el espíritu humano?


    Jesús respondió:


    —Así es la cuestión: Dios ordenó a Miguel que prestara espíritus a los seres humanos para que sirvieran. Después, el Grande ordenó a Gabriel que diera espíritus a la gran generación que no tiene rey: el espíritu junto con el alma. Así que el [resto] de las almas […] luz [… el] Caos […] busquen [el] espíritu que está dentro de ti, que has hecho vivir en esta carne, procedente de las generaciones angélicas.[d] Después, Dios hizo que el conocimiento fuera llevado a Adán y a quienes estaban con él, para que los reyes del Caos y del Hades no gobernaran sobre ellos.


    [Entonces] Judas preguntó a Jesús:


    —Entonces, ¿qué harán aquellas generaciones?


    Jesús respondió:


    —En verdad te digo que las estrellas llevan a término todas estas cosas. Cuando Saklas complete el período que se le ha fijado, la primera estrella de ellos aparecerá con las generaciones, y ellos terminarán lo que se ha dicho. Entonces cometerán inmoralidad sexual en mi nombre, asesinarán a sus hijos y [ellos…] mal y […] los reinos, llevando a las generaciones y presentándolas ante Saklas. [Y] después de eso […] llevará a las doce tribus de [Israel] desde […], y todas las [generaciones] servirán a Saklas, pecando en mi nombre. Y tu estrella [gobernará] sobre el decimotercer reino.


    Entonces Jesús [se rio].


    [Judas] preguntó:


    —Maestro, ¿por qué [te ríes de mí]?


    [Jesús] respondió:


    —No me río [de ti, sino] del extravío de las estrellas, porque esas seis estrellas se extravían junto con esos cinco guerreros, y todas serán destruidas junto con sus creaciones.


    Entonces Judas preguntó a Jesús:


    —¿Qué harán los que han sido bautizados en tu nombre?'
