lexical_decisions:
- source_word: Master
  choice: Maestro
  rationale: Tratamiento natural y digno en español; evita introducir títulos cristológicos no explícitos en el testimonio.
- source_word: house
  choice: casa
  rationale: Mantiene el sentido básico del testimonio y no lo interpreta como «templo», aunque la presencia del altar permita esa posibilidad.
- source_word: minister
  choice: servidor
  rationale: Conserva la función amplia del término sin imponer el cargo eclesiástico moderno que podría sugerir «ministro».
- source_word: generations
  choice: generaciones
  rationale: Reproduce de manera constante la terminología cosmológica y humana del testimonio, aunque su alcance varía según el contexto.
- source_word: finish / completed
  choice: llevar a su término / llevados a su término
  rationale: Conserva la ambigüedad entre completar, consumar y terminar, y evita explicar de forma especulativa el sistema cosmológico.
- source_word: realms
  choice: dominios
  rationale: Expresa ámbitos cósmicos sin identificar el término con reinos políticos ni añadir una cosmología específica.
- source_word: inhabited world
  choice: mundo habitado
  rationale: Traducción formal que preserva el alcance humano-geográfico de la expresión.
- source_word: sleep around
  choice: vivir en promiscuidad
  rationale: Comunica en español actual la conducta sexual indiscriminada distinguida en el texto de «acostarse con hombres».
- source_word: pious
  choice: piadosos
  rationale: Equivalente neutral que no determina si el pasaje elogia o critica irónicamente a ese grupo.
- source_word: pillar of fire
  choice: columna de fuego
  rationale: Equivalente tradicional y transparente, sin imponer una identificación intertextual concreta.
theological_decisions:
- issue: Identidad del «Dios» servido por los discípulos
  choice: «Ese es el Dios al que sirven»
  alternative: Escribir «ese es su dios» en minúscula
  rationale: Se conserva la forma del testimonio sin decidir editorialmente si se trata de una deidad inferior, una acusación irónica o una referencia polémica al Dios adorado por ellos.
- issue: Función de las estrellas y los ángeles
  choice: Mantener el lenguaje cosmológico literalmente y señalar incertidumbres
  alternative: Explicarlo mediante categorías gnósticas específicas
  rationale: El fragmento presupone una cosmología particular, pero el pasaje dañado no permite resolver sus relaciones sin importar una reconstrucción doctrinal.
- issue: «Generación fuerte e incorruptible»
  choice: Conservar «generación» en singular y sus calificativos
  alternative: Interpretarla como «raza», «linaje espiritual» o una comunidad religiosa definida
  rationale: La traducción preserva la tensión antropológica y cosmológica sin identificar la generación con un grupo doctrinal concreto.
- issue: Declaración sobre la misión de Jesús
  choice: «Yo no fui enviado a la generación corruptible»
  alternative: Suavizar como «mi misión no estaba dirigida principalmente...»
  rationale: Se mantiene el contraste absoluto del testimonio y no se armoniza con otros escritos cristianos.
- issue: Culpabilidad en el último día
  choice: «serán declarados culpables»
  alternative: «serán destruidos» o «serán castigados»
  rationale: El testimonio expresa un veredicto de culpa, no especifica la pena ni su naturaleza.
- issue: Conductas enumeradas en la visión
  choice: Traducirlas directamente sin atenuarlas ni convertirlas en categorías doctrinales
  alternative: Reformularlas como una condena general de cultos rivales
  rationale: La lista forma parte de la polémica interna del texto; la traducción no debe ampliar ni reducir su alcance moral o ritual.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se mantienen entre corchetes las restauraciones o palabras inciertas, así como las elipsis que representan lagunas. El borrador es necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa del copto del Códice Tchacos 3 está pendiente. Se corrigieron únicamente problemas evidentes de espaciado del testimonio, sin reconstruir material perdido.'
