translation:
  language: es
  text: 'Otro día, Jesús se acercó a ellos. Ellos le dijeron: «Maestro, te vimos en un sueño, pues anoche tuvimos grandes [sueños]».


    Pero Jesús dijo: «¿Por qué […] se han escondido?».[a]


    Y ellos [dijeron: «Vimos] una gran [casa, con un gran] altar [dentro, y] doce personas —diríamos que eran sacerdotes— y un nombre.[b] Una multitud esperaba junto al altar [hasta que] los sacerdotes [terminaran de recibir] las ofrendas. Nosotros también seguíamos esperando».


    [Jesús dijo]: «¿Cómo eran?».


    Ellos respondieron: «[Algunos] ayunan [durante] dos semanas. Otros sacrifican a sus propios hijos; otros, a sus esposas, mientras se alaban y se humillan unos a otros. Otros se acuestan con hombres; otros asesinan; y otros cometen muchos pecados y actos criminales. ¡[Y] las personas que están [delante] del altar invocan tu [nombre]! Con todos sus sacrificios llenan el [altar] de ofrendas». Después de decir esto, [ellos] callaron porque estaban perturbados.


    Jesús les dijo: «¿Por qué están perturbados? En verdad les digo que todos los sacerdotes que están delante de ese altar invocan mi nombre. Y [de nuevo] les digo: mi nombre ha sido escrito sobre esta [casa] de las generaciones de las estrellas por las generaciones humanas.[c] [Y ellos] han plantado vergonzosamente árboles sin fruto en mi nombre».


    Jesús les dijo: «Ustedes son quienes reciben las ofrendas sobre el altar que vieron. Ese es el Dios al que sirven, y ustedes son las doce personas que vieron. Los animales que vieron llevar al sacrificio son la multitud a la que ustedes extravían delante de ese altar. [El servidor de ustedes] se levantará y usará mi nombre de esa manera, y [las] generaciones de los piadosos le serán fieles. Después de él, otra persona presentará [a quienes viven en promiscuidad]; otra, a quienes asesinan niños; otra, a quienes se acuestan con hombres; además, a quienes ayunan y todo lo demás: impureza, crimen y error. Y quienes dicen: “Somos iguales a los ángeles” son las estrellas que llevan todo a su término.[d] Se les ha dicho a las generaciones humanas: “Miren, Dios ha aceptado el sacrificio de ustedes de manos de los sacerdotes”, es decir, del servidor del error. Pero el Señor que da las órdenes es el Señor sobre todas las cosas. En el último día serán declarados culpables».


    Jesús [les] dijo: «Dejen de [sacrificar animales]. Los han [ofrecido] sobre el altar, sobre sus estrellas junto con sus ángeles, donde ya han sido llevados a su término.[e] Así que dejen que se vuelvan […] con ustedes y que [se vuelvan] claros».


    Sus discípulos [le dijeron]: «Límpianos de nuestros [pecados], que hemos cometido por el engaño de los ángeles».


    Jesús les dijo: «No es posible […], ni [puede] un manantial apagar el fuego de todo el mundo habitado. Tampoco puede el pozo de una [ciudad] satisfacer a todas las generaciones, excepto a la grande y estable.[f] Una sola lámpara no iluminará todos los dominios, excepto la segunda generación; tampoco puede un panadero alimentar a toda la creación bajo [el cielo]».


    Y [cuando los discípulos oyeron] estas [cosas], le dijeron: «¡Maestro, ayúdanos y sálvanos!».


    Jesús les dijo: «Dejen de luchar contra mí. Cada uno de ustedes tiene su propia estrella, [y …] de las estrellas […] lo que le pertenece […].[g] Yo no fui enviado a la generación corruptible, sino a la generación fuerte e incorruptible, porque ningún enemigo ha gobernado [sobre] esa generación, ni tampoco ninguna de las estrellas. En verdad les digo: la columna de fuego caerá pronto, y las estrellas no harán vacilar a esa generación».


    [a] El texto está incompleto; no se conserva qué precedía a «se han escondido» ni si la forma verbal debe entenderse exactamente así.

    [b] La expresión «y un nombre» es oscura en el testimonio conservado y se mantiene sin explicación añadida.

    [c] La relación entre «la casa», «las generaciones de las estrellas» y «las generaciones humanas» es ambigua en el texto conservado.

    [d] También podría entenderse «las estrellas que completan todo»; se conserva la posible idea de culminación sin precisar su sentido cosmológico.

    [e] El referente de «han sido llevados a su término» es incierto: podría aludir a los animales, las estrellas, los ángeles u otro elemento perdido.

    [f] La sintaxis es difícil: «excepto la grande y estable» parece caracterizar una generación, pero el referente exacto no es seguro.

    [g] La extensa laguna impide reconstruir la relación entre cada persona, su estrella y «lo que le pertenece».'
