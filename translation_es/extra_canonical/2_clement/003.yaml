base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: es
  text: 'Puesto que él tuvo tan gran misericordia de nosotros —ante todo, porque nosotros, los que vivimos, no ofrecemos sacrificios a esos dioses muertos ni los adoramos, sino que por medio de él hemos conocido al Padre de la verdad—, ¿en qué consiste conocerlo, sino en no negar a aquel por medio de quien lo conocimos?


    En efecto, él mismo dice: «A quien me reconozca, yo también lo reconoceré delante del Padre».[a]


    Esta, pues, es nuestra recompensa, si de veras reconocemos a aquel por medio de quien fuimos salvados.


    Pero ¿cómo lo reconocemos? Haciendo lo que él dice, sin desobedecer sus mandamientos, y honrándolo no solo con los labios, sino con todo el corazón y con toda la mente.


    También dice en Isaías: «Este pueblo me honra con los labios, pero su corazón está lejos de mí».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Compárese Mateo 10:32; Lucas 12:8. La formulación citada no coincide por completo con una sola de esas formas conservadas.
    reason: Identifica los paralelos evangélicos sin afirmar una dependencia textual más precisa de la que permite el testimonio suministrado.
  - marker: b
    text: Isaías 29:13. La redacción de la cita puede reflejar una forma textual antigua distinta de algunas traducciones modernas del pasaje.
    reason: Ubica la cita profética y advierte con cautela sobre su forma textual.
lexical_decisions:
- source_word: confesseth / confess
  choice: reconocer / reconocemos
  rationale: En este contexto significa reconocer públicamente la lealtad a Cristo, no confesar pecados. «Reconocer» comunica ese sentido en español actual y permite conservar la relación entre la cita y su aplicación ética.
- source_word: Father of truth
  choice: Padre de la verdad
  rationale: Se conserva la formulación genitiva del testimonio, sin convertirla en «Padre verdadero» ni explicar de manera doctrinal la relación entre «Padre» y «verdad».
- source_word: knowledge / known
  choice: conocer / conocido
  rationale: La forma verbal resulta natural en español y mantiene la repetición conceptual del pasaje entre el conocimiento recibido y la fidelidad debida.
- source_word: dead gods
  choice: dioses muertos
  rationale: Se mantiene la expresión polémica y paradójica del texto, sin suavizarla como «ídolos inertes».
- source_word: whole mind
  choice: toda la mente
  rationale: Conserva la distinción entre corazón y mente presente en el testimonio, aunque ambas nociones puedan superponerse en el uso antiguo.
theological_decisions:
- issue: Ambigüedad de los pronombres en la primera pregunta
  choice: «¿en qué consiste conocerlo, sino en no negar a aquel por medio de quien lo conocimos?»
  alternative: Explicitar «conocer al Padre» y «no negar a Cristo»
  rationale: El texto suministrado no identifica de nuevo cada referente. La traducción conserva esa tensión referencial en vez de resolverla mediante una interpretación añadida.
- issue: Naturaleza de la recompensa
  choice: «Esta, pues, es nuestra recompensa, si de veras reconocemos...»
  alternative: Parafrasear la recompensa como salvación futura o aprobación divina
  rationale: Se conserva la afirmación escueta del autor sin precisar el contenido o el momento de la recompensa más allá de lo dicho.
- issue: Relación entre confesión verbal y obediencia
  choice: Mantener que se reconoce a Cristo haciendo lo que manda y honrándolo de corazón y mente
  alternative: Reducir «confesar» a una declaración oral de fe
  rationale: El propio pasaje define el reconocimiento mediante obediencia integral; la traducción preserva esa relación sin imponer una formulación doctrinal posterior.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se evitó el arcaísmo «confesar» cuando podría entenderse ante todo como admitir una culpa, y se prefirió «reconocer» en sentido público y relacional. Se conservaron las repeticiones argumentativas y las expresiones «Padre de la verdad» y «dioses muertos». Borrador necesariamente provisional: el material proporcionado es un testimonio inglés de dominio público y señala que la revisión directa del griego está pendiente; por ello no se atribuyen matices griegos que no puedan verificarse aquí.'
