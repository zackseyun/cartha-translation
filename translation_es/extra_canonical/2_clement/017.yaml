base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: es
  text: '**2 Clemente 17**


    Por tanto, arrepintámonos de todo corazón, para que ninguno de nosotros perezca en el camino. Porque, si hemos recibido el mandato de dedicarnos a apartar a las personas de los ídolos y enseñarles, ¡cuánto más debemos evitar que perezca un alma que ya conoce a Dios!


    Ayudémonos, pues, unos a otros, para que también guiemos a los débiles hacia el bien, a fin de que todos seamos salvos. Hagamos volver y amonestémonos unos a otros.


    No pensemos que debemos prestar atención y creer solamente ahora, mientras nos instruyen los ancianos[a]. También cuando regresemos a casa, recordemos los mandamientos del Señor y no permitamos que los deseos de este mundo nos arrastren en dirección contraria. Más bien, reunámonos aquí con mayor frecuencia y esforcémonos por avanzar en los mandamientos del Señor, para que, teniendo todos un mismo sentir, seamos reunidos para entrar en la vida.


    Porque el Señor dijo: «Vengo a reunir a todas las naciones, tribus y lenguas».[b] Con esto habla del día de su manifestación, cuando vendrá y nos salvará, a cada uno según sus obras.[c]


    Los incrédulos verán su gloria y su poder, y quedarán asombrados cuando vean que el reino del mundo le ha sido dado a Jesús. Dirán: «¡Ay de nosotros! Tú estabas aquí, pero no lo sabíamos ni creíamos; tampoco obedecimos a los ancianos cuando nos hablaban de nuestra salvación». Y se cumplirá lo dicho: «El gusano de ellos no morirá y su fuego no se apagará, y serán un espectáculo para todo ser humano».[d]


    Esto se refiere al día del juicio, cuando se verá a quienes, aun siendo de los nuestros, viven de manera impía y han falsificado los mandamientos de Jesucristo.[e]


    Pero los justos, que hicieron el bien, soportaron tormentos y aborrecieron los placeres del alma, verán cómo quienes obraron mal y negaron a Jesús con sus palabras o sus hechos son castigados con tormentos terribles en un fuego que no se apaga. Entonces darán gloria a Dios y dirán: «Hay esperanza para quien ha servido a Dios de todo corazón».


    [a] Es decir, quienes instruían y dirigían a la comunidad cristiana; el término también puede traducirse «presbíteros».


    [b] Cita o adaptación de Isaías 66:18.


    [c] La frase conserva juntas la salvación realizada por el Señor y la evaluación de cada persona conforme a sus obras, sin explicar aquí cómo se relacionan ambas afirmaciones.


    [d] Cita o adaptación de Isaías 66:24.


    [e] «Han falsificado» también puede entenderse como «han adulterado» o «han tergiversado».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Es decir, quienes instruían y dirigían a la comunidad cristiana; el término también puede traducirse «presbíteros».
    reason: Aclara el sentido comunitario de «ancianos» y conserva una equivalencia eclesiástica posible sin imponerla en el texto.
  - marker: b
    text: Cita o adaptación de Isaías 66:18.
    reason: Identifica la fuente bíblica de la declaración sobre la reunión de naciones y lenguas.
  - marker: c
    text: La frase conserva juntas la salvación realizada por el Señor y la evaluación de cada persona conforme a sus obras, sin explicar aquí cómo se relacionan ambas afirmaciones.
    reason: Señala una tensión teológica genuina que no debe resolverse silenciosamente.
  - marker: d
    text: Cita o adaptación de Isaías 66:24.
    reason: Identifica la fuente bíblica de la imagen del gusano, el fuego y el espectáculo ante toda carne.
  - marker: e
    text: «Han falsificado» también puede entenderse como «han adulterado» o «han tergiversado».
    reason: Conserva el campo semántico de la expresión fuerte aplicada al trato dado a los mandamientos.
lexical_decisions:
- source_word: μετανοέω / repent (witness)
  choice: arrepentirnos
  rationale: Expresa un cambio integral de corazón y conducta, y mantiene el vocabulario exhortativo tradicional en español actual.
- source_word: κατηχέω / instruct
  choice: enseñarles
  rationale: Comunica con naturalidad la instrucción religiosa sin imponer el sentido técnico posterior de «catequizar».
- source_word: πρεσβύτεροι / presbyters
  choice: ancianos
  rationale: Es la equivalencia directa y comprensible para dirigentes de la comunidad; una nota conserva la alternativa «presbíteros».
- source_word: ἐπιστρέφω / convert, turn
  choice: hagamos volver
  rationale: Mantiene el valor transitivo de ayudar a otros a volverse o regresar, sin sugerir necesariamente un rito o una conversión inicial.
- source_word: ἐπιφάνεια / appearing
  choice: manifestación
  rationale: Conserva la idea de una aparición pública y visible del Señor.
- source_word: παραχαράσσω / deal falsely, falsify
  choice: falsificado
  rationale: Retiene la imagen fuerte de alterar fraudulentamente los mandamientos; la nota ofrece «adulterado» y «tergiversado».
- source_word: ἡδοναὶ τῆς ψυχῆς / pleasures of the soul
  choice: placeres del alma
  rationale: Preserva la formulación antropológica inusual del pasaje en vez de resolverla como «deseos pecaminosos».
- source_word: ἐλπίς / hope
  choice: esperanza
  rationale: Mantiene la conclusión en términos de esperanza y evita convertirla en una afirmación más específica sobre mérito o recompensa.
theological_decisions:
- issue: Salvación y juicio según las obras
  choice: «vendrá y nos salvará, a cada uno según sus obras»
  alternative: «vendrá a recompensarnos a cada uno conforme a sus obras»
  rationale: Se conserva la tensión entre la acción salvadora del Señor y la evaluación conforme a las obras, sin armonizarla mediante una interpretación doctrinal.
- issue: Identidad de «los nuestros» en el juicio
  choice: «quienes, aun siendo de los nuestros, viven de manera impía»
  alternative: «los impíos que están entre nosotros»
  rationale: La formulación mantiene la advertencia dirigida a miembros de la comunidad y no decide su condición espiritual final antes del juicio descrito.
- issue: Negar a Jesús mediante palabras u obras
  choice: Se conservan ambas formas de negación
  alternative: Reducir la negación a apostasía verbal
  rationale: El pasaje trata la conducta como una posible negación de Jesús junto con las declaraciones explícitas.
- issue: Castigo escatológico
  choice: «fuego que no se apaga» y «tormentos terribles»
  alternative: Parafrasear como castigo temporal o como metáfora puramente figurada
  rationale: Se mantiene el lenguaje judicial e imaginería del texto sin añadir una teoría sobre su duración, naturaleza o mecanismo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con exhortaciones claras y cadencia apta para lectura pública. Se evitó tanto el arcaísmo innecesario como la terminología confesional especializada. La redacción se contrastó, hasta donde permite el material suministrado, con formulaciones griegas reconocibles del pasaje; dado que el expediente indica que la revisión directa de la tradición manuscrita griega sigue pendiente, este borrador debe considerarse provisional en los puntos donde el testimonio inglés es inestable, especialmente la oración sobre escuchar ahora y recordar en casa.
