  revision_rationale: La revisión elimina una adición no respaldada («aquí»), restituye la fuerza retórica y el vocabulario de redención del testigo, y corrige construcciones españolas poco naturales. Se usa «presbíteros» como equivalente directo y se conserva «ancianos» en nota. La frase sobre la exhortación presente y el recuerdo posterior en casa sigue la forma griega comúnmente conocida, pero se marca la inestabilidad del testigo inglés proporcionado. La traducción conserva el lenguaje de juicio y fuego sin definir su mecanismo, duración ni implicaciones doctrinales.
