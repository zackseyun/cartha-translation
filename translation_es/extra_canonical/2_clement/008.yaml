translation:
  language: es
  text: 'Por tanto, mientras estamos en la tierra, arrepintámonos, pues somos barro en manos del artesano.


    Así como el alfarero, cuando está haciendo una vasija y esta se deforma o se aplasta entre sus manos, vuelve a darle forma, pero, una vez que la ha metido en el horno de fuego, ya no puede repararla, así también nosotros, mientras estamos en este mundo, arrepintámonos de todo corazón del mal que hemos hecho en la carne, para que el Señor nos salve mientras aún tenemos tiempo de arrepentirnos.


    Porque, después de que hayamos salido de este mundo, ya no podremos confesar nuestros pecados ni arrepentirnos.


    Por eso, hermanos, si hacemos la voluntad del Padre, mantenemos pura la carne y guardamos los mandamientos del Señor, recibiremos vida eterna.


    Pues el Señor dice en el Evangelio: «Si no fueron fieles en lo poco, ¿quién les dará lo mucho? Porque les digo que quien es fiel en lo más pequeño también es fiel en lo mucho».[a]


    Por tanto, esto es lo que quiere decir: «Mantengan pura la carne y sin mancha el sello, para que recibamos vida».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La cita guarda relación con Lucas 16:10-12, pero su formulación no coincide exactamente con ese pasaje.
    reason: Identifica la probable tradición evangélica sin borrar la forma particular de la cita en 2 Clemente.
  - marker: b
    text: «El sello» es una imagen que el texto no explica aquí. Se ha conservado sin identificarla de manera exclusiva con el bautismo u otra realidad concreta.
    reason: Preserva una ambigüedad histórica y teológica significativa y evita una lectura denominacional.
lexical_decisions:
- source_word: clay under the craftsman's hand
  choice: barro en manos del artesano
  rationale: Conserva la imagen de materia moldeable y la referencia general al artífice; el contexto inmediato identifica después al alfarero.
- source_word: potter
  choice: alfarero
  rationale: Es el término natural y preciso para quien forma una vasija de barro.
- source_word: in the flesh
  choice: en la carne
  rationale: Mantiene la expresión antropológica antigua sin reducirla a «con el cuerpo» ni cargarla de una interpretación doctrinal.
- source_word: make confession
  choice: confesar nuestros pecados
  rationale: Expresa con claridad el sentido penitencial del contexto, sin especificar un rito o destinatario confesional.
- source_word: kept the flesh pure
  choice: mantenemos pura la carne
  rationale: Preserva la formulación corporal y moral del testimonio, evitando explicar de manera restrictiva qué clase de pureza se tiene en mente.
- source_word: the seal unstained
  choice: sin mancha el sello
  rationale: Conserva intacta la metáfora del sello y su ambigüedad histórica y teológica.
theological_decisions:
- issue: Relación entre arrepentimiento, conducta y salvación
  choice: 'Conservar la secuencia exhortativa: arrepentirse ahora, hacer la voluntad del Padre, guardar los mandamientos y recibir vida.'
  alternative: Reformular el pasaje para subordinar explícitamente estas acciones a un esquema doctrinal posterior de gracia y obras.
  rationale: El texto presenta una tensión soteriológica genuina y no debe armonizarse con una tradición denominacional concreta.
- issue: Identidad y significado de «el sello»
  choice: Mantener «el sello» sin interpretación en el cuerpo del texto.
  alternative: Traducir o glosar como bautismo, fe, Espíritu o profesión cristiana.
  rationale: Aunque «sello» puede tener resonancias bautismales o iniciáticas en el cristianismo antiguo, la evidencia suministrada no permite resolver aquí la metáfora.
- issue: «La carne» y la pureza
  choice: Retener «la carne» en vez de identificarla exclusivamente con pureza sexual o ascetismo.
  alternative: Traducir «mantengan casto el cuerpo».
  rationale: La expresión puede abarcar la vida corporal y moral de manera más amplia; una especificación estrecha importaría una interpretación.
- issue: Cita atribuida al Señor en el Evangelio
  choice: Presentarla como cita evangélica con formulación propia del testimonio.
  alternative: Uniformarla palabra por palabra con una traducción moderna de Lucas 16:10-12.
  rationale: La forma citada combina o adapta lenguaje tradicional y debe conservarse como aparece en esta obra, no reemplazarse por el texto canónico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» en la cita y la exhortación plural, pero se conserva el inclusivo «arrepintámonos/recibamos». La redacción es provisional porque el material suministrado es un testimonio inglés de dominio público y señala que la revisión directa del griego está pendiente.
