  revision_rationale: 'Se hacen correcciones limitadas de fidelidad: se evita ampliar «confesión» a «confesión de pecados» y se restituye el verbo «guardar» en la primera parte de la cita evangélica. Se ajustan además algunas expresiones para reflejar más estrechamente el testimonio sin interpretar «la carne» ni «el sello».'
