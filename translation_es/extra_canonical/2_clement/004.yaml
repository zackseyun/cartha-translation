base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: es
  text: '4


    Por tanto, no basta con que lo llamemos «Señor», pues eso no nos salvará. Porque él dice: «No todo el que me dice: “Señor” será salvo, sino el que practica la justicia».


    Así pues, hermanos, confesémoslo con nuestras obras: amándonos unos a otros, no cometiendo adulterio, no hablando mal unos de otros ni teniendo envidia, sino teniendo dominio propio, siendo compasivos y bondadosos. Debemos ser solidarios unos con otros y no amar el dinero. Confesémoslo mediante estas obras, y no mediante las contrarias.


    No debemos temer a los seres humanos, sino a Dios.


    Por eso, si hacen estas cosas, dijo el Señor: «Aunque estén reunidos conmigo en mi seno,[a] si no cumplen mis mandamientos, los echaré fuera y les diré: “Apártense de mí; no sé de dónde son ustedes, hacedores de maldad”».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «en mi regazo» o «en mi seno». La imagen expresa una cercanía íntima, aunque su sentido exacto en esta cita no es seguro.
    reason: La expresión es poco usual y una traducción completamente idiomática resolvería una ambigüedad genuina.
  - marker: b
    text: La declaración reúne expresiones semejantes a Mateo 7:21-23 y Lucas 13:25-27, pero no coincide exactamente con la forma conservada en esos pasajes.
    reason: Ayuda a reconocer la tradición evocada sin presentar esta cita compuesta como reproducción exacta de un texto canónico.
lexical_decisions:
- source_word: κύριον
  choice: «Señor»
  rationale: Conserva el título cristológico y la relación verbal con la cita que sigue.
- source_word: ποιῶν τὴν δικαιοσύνην
  choice: «practica la justicia»
  rationale: Expresa una conducta efectiva y mantiene el sentido ético de δικαιοσύνη sin reducirlo a una sola obra.
- source_word: ὁμολογῶμεν
  choice: «reconozcámoslo»
  rationale: En este contexto significa declararlo o reconocerlo públicamente mediante la conducta; «confesarlo» sería posible, pero resulta menos transparente para muchos lectores actuales.
- source_word: ἐγκρατεῖς
  choice: «dueños de nosotros mismos»
  rationale: Comunica de manera natural la idea de dominio propio o templanza.
- source_word: συμπάσχειν
  choice: «compartir el sufrimiento»
  rationale: Mantiene el componente explícito de padecer con otros, más concreto que una mera simpatía.
- source_word: φιλαργυρεῖν
  choice: «amar el dinero»
  rationale: Reproduce el sentido literal de apego codicioso al dinero en lenguaje claro.
- source_word: ἐργάται ἀνομίας
  choice: «ustedes que practican la maldad»
  rationale: Conserva la idea de personas caracterizadas por obrar la ἀνομία; evita imponer aquí un matiz técnico exclusivamente jurídico.
theological_decisions:
- issue: Relación entre llamar a Jesús «Señor», la salvación y las obras
  choice: Se conserva la afirmación de que la sola invocación verbal no salva y que el reconocimiento debe manifestarse en practicar la justicia.
  alternative: Reformular el pasaje para armonizarlo explícitamente con una doctrina posterior sobre fe y obras.
  rationale: El texto presenta deliberadamente una tensión exhortativa; la traducción no debe resolverla mediante explicaciones doctrinales añadidas.
- issue: Identidad del hablante en las citas
  choice: Se mantiene «él dice» y luego «dijo el Señor», sin identificar con mayor precisión la fuente o fusionar las fórmulas con un texto canónico concreto.
  alternative: Atribuir ambas citas de manera explícita a Jesús o a un evangelio determinado.
  rationale: El contexto apunta al Señor, pero la forma final combina lenguaje conocido de diversas tradiciones; conviene preservar la formulación del escrito.
- issue: Imagen de estar reunidos «en mi seno»
  choice: Se conserva la imagen corporal y relacional.
  alternative: Interpretarla como «bajo mi amparo» o «junto a mí».
  rationale: La expresión es inusual y posiblemente tradicional; explicitar una interpretación eliminaría su ambigüedad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitó el arcaísmo «hermanos» solo donde no correspondía, pero se conservó en el vocativo comunitario. La puntuación distingue la exhortación del autor de las palabras atribuidas al Señor. El borrador se apoya en la tradición griega conocida y contrasta la versión inglesa suministrada; en el último párrafo se traduce la construcción condicional de manera natural, sin añadir el problemático «si hacen estas cosas» del testimonio inglés, pues el contraste recae en no cumplir los mandamientos.
