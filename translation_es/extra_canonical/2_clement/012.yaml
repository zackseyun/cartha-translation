base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: es
  text: 'Por tanto, esperemos a cada momento el reino de Dios con amor y justicia, pues no sabemos el día de la manifestación de Dios.


    Porque el Señor mismo, cuando alguien le preguntó cuándo vendría su reino, dijo: «Cuando los dos sean uno, lo de afuera como lo de adentro, y lo masculino con lo femenino, ni masculino ni femenino».[a]


    Los dos son uno cuando nos decimos la verdad unos a otros y en dos cuerpos hay una sola alma, sin fingimiento.


    Y con «lo de afuera como lo de adentro» quiere decir lo siguiente: llama «lo de adentro» al alma y «lo de afuera» al cuerpo. Por tanto, así como tu cuerpo está a la vista, también tu alma sea manifiesta por sus buenas obras.


    Y con «lo masculino con lo femenino, ni masculino ni femenino» quiere decir lo siguiente: que un hermano, al ver a una hermana, no piense en ella como mujer, y que una hermana, al ver a un hermano, no piense en él como hombre.


    «Si ustedes hacen estas cosas —dice—, vendrá el reino de mi Padre».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este dicho también se conserva, con algunas diferencias, en otras tradiciones cristianas antiguas; no aparece con esta redacción en los Evangelios canónicos.
    reason: Orienta al lector sobre una cita inusual sin armonizarla ni atribuirle una procedencia más precisa de la que permite la evidencia suministrada.
lexical_decisions:
- source_word: καθ’ ὥραν
  choice: en todo momento
  rationale: Expresa una espera constante y oportuna en español natural; evita el arcaísmo ambiguo del testimonio inglés «betimes».
- source_word: ἐπιφανείας
  choice: manifestación
  rationale: Conserva el sentido de aparición pública o revelación sin precisar indebidamente cómo ocurrirá.
- source_word: ἀνυποκρίτως
  choice: sin hipocresía
  rationale: Reproduce de manera directa la idea de sinceridad no fingida.
- source_word: τὸ ἄρσεν / τῆς θηλείας
  choice: lo masculino / lo femenino
  rationale: Mantiene la formulación abstracta y enigmática del dicho; en la explicación se emplean «mujer» y «hombre» para que el español resulte natural.
- source_word: δῆλος ἔστω ἐν τοῖς καλοῖς ἔργοις
  choice: debe quedar de manifiesto por medio de sus buenas obras
  rationale: Comunica que el alma se hace visible o evidente en las obras buenas, sin identificarla simplemente con ellas.
theological_decisions:
- issue: Naturaleza y procedencia del dicho atribuido al Señor
  choice: Conservar el dicho en su forma propia y añadir una nota de referencia
  alternative: Armonizarlo con un pasaje de los Evangelios canónicos o explicar su procedencia dentro del texto
  rationale: El texto lo atribuye al Señor, pero su forma no coincide literalmente con un Evangelio canónico; se preserva esa tensión histórica sin resolverla doctrinalmente.
- issue: Sentido de «ni masculino ni femenino»
  choice: Mantener tanto la expresión paradójica como la explicación ética del autor
  alternative: Interpretarla explícitamente como abolición ontológica del sexo o limitarla expresamente a la abstinencia sexual
  rationale: El pasaje ofrece su propia explicación, pero su lenguaje sigue siendo inusual; la traducción no debe imponer una lectura confesional o antropológica adicional.
- issue: «Vendrá el reino de mi Padre»
  choice: Traducir el futuro de forma directa
  alternative: Reformularlo como una presencia interior o como una cronología escatológica precisa
  rationale: La forma directa conserva la tensión entre conducta ética y venida del reino sin definir una causalidad o esquema escatológico no expresado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las repeticiones explicativas y el carácter enigmático del dicho. Se usó «ustedes» para el plural y «tu» donde el griego pasa al singular. El borrador se apoya en la tradición griega conocida del pasaje, cotejada con el testimonio inglés proporcionado; conviene una auditoría textual final contra una edición crítica griega.
