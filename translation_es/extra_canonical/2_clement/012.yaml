review_pass:
  verdict: revise
  source_fidelity: La traducción transmite fielmente el sentido general del testimonio inglés y conserva la explicación interna del autor. Sin embargo, en el dicho enigmático la redacción «lo masculino junto con lo femenino no sea ni masculino ni femenino» convierte una yuxtaposición elíptica del original en una proposición española más interpretativa. Conviene retener la elipsis y la ambigüedad. «En todo momento» es aceptable para καθ’ ὥραν, aunque «a cada momento» refleja mejor su matiz distributivo y actual.
  naturalness: El registro es claro, actual y apropiado. Se mejoran levemente «sin hipocresía» por «sin fingimiento», más cercano a la ausencia de simulación, y la formulación de la visibilidad del alma para conservar el imperativo sin volverlo innecesariamente perifrástico.
  terminology: «Reino de Dios», «manifestación», «alma», «buenas obras» y «mi Padre» son adecuados. Se preservan «lo masculino» y «lo femenino» en el dicho, mientras que «mujer» y «hombre» en su explicación reflejan la aplicación concreta que hace el autor sin añadir una interpretación doctrinal.
  issues:
  - severity: medium
    issue: El dicho cita «lo masculino junto con lo femenino no sea ni masculino ni femenino».
    rationale: La adición de «no sea» resuelve sintácticamente una construcción deliberadamente elíptica y ambigua («lo masculino con lo femenino, ni masculino ni femenino»). Debe conservarse esa ambigüedad, sin imponer una relación predicativa concreta.
  - severity: low
    issue: «En todo momento» para καθ’ ὥραν.
    rationale: Es posible, pero «a cada momento» reproduce con mayor precisión el valor de ‘hora tras hora’ o ‘en cada ocasión’, sin arcaísmo.
  - severity: low
    issue: «Sin hipocresía» y «debe quedar de manifiesto».
    rationale: «Sin fingimiento» representa de modo más directo la falta de simulación; «sea manifiesta» conserva con sencillez el imperativo del pasaje.
  revised_text: 'Por tanto, esperemos a cada momento el reino de Dios con amor y justicia, pues no sabemos el día de la manifestación de Dios.


    Porque el Señor mismo, cuando alguien le preguntó cuándo vendría su reino, dijo: «Cuando los dos sean uno, lo de afuera como lo de adentro, y lo masculino con lo femenino, ni masculino ni femenino».[a]


    Los dos son uno cuando nos decimos la verdad unos a otros y en dos cuerpos hay una sola alma, sin fingimiento.


    Y con «lo de afuera como lo de adentro» quiere decir lo siguiente: llama «lo de adentro» al alma y «lo de afuera» al cuerpo. Por tanto, así como tu cuerpo está a la vista, también tu alma sea manifiesta por sus buenas obras.


    Y con «lo masculino con lo femenino, ni masculino ni femenino» quiere decir lo siguiente: que un hermano, al ver a una hermana, no piense en ella como mujer, y que una hermana, al ver a un hermano, no piense en él como hombre.


    «Si ustedes hacen estas cosas —dice—, vendrá el reino de mi Padre».'
  revised_footnotes:
