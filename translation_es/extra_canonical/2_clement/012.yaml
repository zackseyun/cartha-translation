source:
  text: 'Let us therefore await the kingdom of God betimes in love and righteousness, since we know not the day of God''s appearing.


    For the Lord Himself, being asked by a certain person when his kingdom would come, said, When the two shall be one, and the outside as the inside, and the male with the female, neither male or female.


    Now the two are one, when we speak truth among ourselves, and in two bodies there shall be one soul without dissimulation.


    And by the outside as the inside He meaneth this: by the inside he meaneth the soul and by the outside the body. Therefore in like manner as they body appeareth, so also let thy soul be manifest by its good works.


    And by the male with the female, neither male nor female, he meaneth this; that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should not have any thought of him as a male.


    These things if ye do, saith He, the kingdom of my father shall come.'
