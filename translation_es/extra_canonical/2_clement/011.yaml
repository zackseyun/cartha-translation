    «Desdichados los de ánimo dividido, los que dudan en su corazón y dicen: “También oímos estas cosas hace mucho tiempo, en los días de nuestros padres; sin embargo, hemos esperado día tras día y no hemos visto cumplirse ninguna de ellas”.


