base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: es
  text: 'Por tanto, sirvamos a Dios con un corazón puro, y seremos justos; pero, si no lo servimos porque no creemos en la promesa de Dios, seremos desdichados.


    Pues también dice la palabra profética: «Desdichados quienes tienen el ánimo dividido, quienes dudan en su corazón y dicen: “También oímos estas cosas hace mucho tiempo, en los días de nuestros padres; sin embargo, hemos esperado día tras día y no hemos visto cumplirse ninguna de ellas”.


    ¡Insensatos! Compárense con un árbol; tomen una vid. Primero pierde sus hojas; luego brota un retoño; después aparece una uva verde y, por último, una uva plenamente madura.


    Del mismo modo, mi pueblo pasó por disturbios y aflicciones; pero después recibirá bienes».


    Por tanto, hermanos míos, no tengamos el ánimo dividido, sino perseveremos con paciencia en la esperanza, para que también nosotros obtengamos nuestra recompensa.


    Porque fiel es el que prometió dar a cada uno la retribución por sus obras.


    Así pues, si practicamos la justicia delante de Dios, entraremos en su reino y recibiremos las promesas que ningún oído ha oído ni ojo ha visto, ni han llegado al corazón del ser humano.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: double-minded
  choice: de ánimo dividido
  rationale: Conserva la imagen de una disposición interior escindida y su relación contextual con la duda, sin reducirla simplemente a indecisión.
- source_word: serve
  choice: servir
  rationale: Mantiene el sentido religioso amplio de servicio y obediencia a Dios.
- source_word: sour berry
  choice: uva verde
  rationale: Expresa con naturalidad la etapa inmadura y agria del fruto de la vid.
- source_word: tumults
  choice: disturbios
  rationale: Conserva la idea de agitación o conmoción colectiva sin precisar una clase de conflicto no indicada por el testimonio.
- source_word: recompense of his works
  choice: la retribución correspondiente a sus obras
  rationale: Preserva la relación entre la conducta de cada persona y la retribución prometida, sin definir aquí la naturaleza de esa retribución.
- source_word: wrought righteousness
  choice: practicamos la justicia
  rationale: Es una formulación actual y comprensible que mantiene el carácter activo de obrar justamente.
theological_decisions:
- issue: Relación entre servir a Dios, practicar la justicia y ser justos
  choice: Mantener las afirmaciones en su forma condicional y exhortativa
  alternative: Reformularlas para subordinarlas explícitamente a un esquema doctrinal posterior
  rationale: El pasaje vincula directamente el servicio fiel y la práctica de la justicia con ser justos y entrar en el reino; la traducción conserva esa tensión sin añadir explicaciones confesionales.
- issue: Retribución según las obras
  choice: Conservar «la retribución correspondiente a sus obras»
  alternative: Sustituirla por una referencia general a gracia, salvación o juicio
  rationale: La formulación del testimonio es explícita y debe mantenerse sin armonización teológica.
- issue: Promesas no oídas ni vistas
  choice: Mantener «promesas» como antecedente y conservar la repetición del ojo
  alternative: Corregir la repetición o introducir «cosas» como antecedente
  rationale: El testimonio suministrado habla de las promesas y repite «nor eye seen»; ante la revisión griega pendiente, se conserva la anomalía de manera visible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron el tono exhortativo, la cita profética y la imaginería agrícola. Este borrador es necesariamente provisional porque el material proporcionado no incluye el texto griego y declara pendiente la revisión en la lengua original.
