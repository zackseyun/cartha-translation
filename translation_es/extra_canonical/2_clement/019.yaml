base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: es
  text: 'Por tanto, hermanos y hermanas, después de haber escuchado al Dios de la verdad,[a] les leo una exhortación para que presten atención a lo que está escrito, a fin de que se salven tanto ustedes mismos como quien lee en medio de ustedes. Lo que les pido como recompensa es que se arrepientan de todo corazón y se den a ustedes mismos salvación y vida.[b] Al hacer esto, pondremos un ejemplo ante todos los jóvenes que desean esforzarse en el conocimiento de la devoción a Dios y de la bondad de Dios.


    No nos disgustemos ni nos irritemos —necios como somos— cuando alguien nos amoneste y nos haga volver de la injusticia a la justicia. A veces hacemos el mal sin darnos cuenta, debido a la indecisión y la incredulidad que hay en nuestro interior; nuestros deseos vanos oscurecen nuestro entendimiento.


    Practiquemos, pues, la justicia para que seamos salvos hasta el fin. Dichosos los que obedecen estos mandatos. Aunque sufran por poco tiempo en este mundo, recogerán el fruto inmortal de la resurrección.


    Por tanto, quien vive con devoción a Dios no se entristezca si sufre en el tiempo presente, pues le espera un tiempo dichoso. Volverá a vivir en el cielo junto con nuestros padres y se alegrará por toda una eternidad sin tristeza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La expresión también puede entenderse de manera más literal: «después del Dios de la verdad, les leo una exhortación». Probablemente distingue la lectura previa de la palabra divina de la exhortación que ahora se lee, pero la formulación antigua es difícil.'
    reason: Preserva una dificultad sintáctica y evita presentar como segura una reconstrucción contextual.
  - marker: b
    text: La frase atribuye de manera exhortativa «salvación y vida» a la respuesta de los oyentes. No explica aquí cómo se relaciona esa respuesta con la acción salvadora de Dios.
    reason: Señala una tensión teológica genuina sin suavizar el texto ni imponer una solución doctrinal.
lexical_decisions:
- source_word: brothers and sisters (ἀδελφοί καὶ ἀδελφαί, as reflected in the witness)
  choice: hermanos y hermanas
  rationale: Conserva la mención explícita de ambos grupos y emplea una forma natural en español latinoamericano.
- source_word: exhortation / ἔντευξις (probable underlying term)
  choice: exhortación
  rationale: Mantiene el carácter pastoral y admonitorio del escrito sin reducirlo a una mera lectura informativa.
- source_word: double-mindedness
  choice: indecisión
  rationale: Expresa una voluntad dividida e inconstante en lenguaje actual; evita el poco natural «doble ánimo».
- source_word: piety / godly
  choice: devoción a Dios / quien vive con devoción a Dios
  rationale: Comunica una vida orientada reverentemente hacia Dios y evita que «piadoso» se entienda solo como compasivo.
- source_word: ordinances
  choice: mandatos
  rationale: Es una expresión clara y amplia para las instrucciones anteriores, sin imponer un sentido técnico sacramental o jurídico.
- source_word: miserable / endure affliction
  choice: sufre / sufran
  rationale: En el contexto se refiere a padecimientos presentes, no necesariamente a una condición moral o emocional miserable.
- source_word: fathers
  choice: padres
  rationale: Retiene la referencia ancestral y la imagen familiar del testimonio, sin sustituirla interpretativamente por «antepasados».
theological_decisions:
- issue: La expresión «se den a ustedes mismos salvación y vida» puede parecer atribuir la salvación al esfuerzo humano.
  choice: Conservar la formulación directa, con nota aclaratoria.
  alternative: «procuren para ustedes salvación y vida» o «reciban salvación y vida»
  rationale: El testimonio formula una exhortación deliberadamente fuerte y vincula arrepentimiento, justicia y salvación. Cambiarla por «reciban» resolvería una tensión teológica que el texto mismo no resuelve.
- issue: Alcance temporal de la salvación
  choice: «para que seamos salvos hasta el fin»
  alternative: «para que al final seamos salvos»
  rationale: La expresión admite un matiz de perseverancia hasta el final y posiblemente de salvación final. La traducción preserva esa amplitud sin elegir solo una lectura.
- issue: Naturaleza del «fruto inmortal de la resurrección»
  choice: Mantener la metáfora sin explicar si el fruto es vida inmortal, recompensa o la resurrección misma.
  alternative: «recibirán la vida inmortal en la resurrección»
  rationale: La explicación alternativa estrecharía una imagen que el texto deja abierta.
- issue: «Volverá a vivir en el cielo»
  choice: Conservar tanto la renovación de la vida como la localización celestial.
  alternative: «resucitará y vivirá en el cielo»
  rationale: La alternativa identificaría explícitamente esta frase con la resurrección; el contexto favorece esa relación, pero la formulación transmitida no necesita que se explicite.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron el tono homilético, las exhortaciones en primera persona plural y las imágenes de fruto, resurrección y eternidad. Dado que la ficha indica que la revisión directa del griego está pendiente, las decisiones se apoyan en el testimonio público suministrado y, donde corresponde, se marca la incertidumbre en nota.
