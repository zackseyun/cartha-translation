review_pass:
  verdict: revise
  source_fidelity: 'La traducción refleja en general la exhortación, el llamado al arrepentimiento, la práctica de la justicia, la aflicción temporal y la esperanza de resurrección. Sin embargo, «pondremos un ejemplo» interpreta de forma demasiado estrecha «set a goal»; «pondremos una meta» conserva mejor la imagen. «Conocimiento de la devoción» tampoco corresponde bien a «study of piety»: se trata del estudio o cultivo de la piedad/devoción y de la bondad de Dios. «Indecisión» debilita «double-mindedness», que alude a una disposición interior dividida o vacilante. Se conserva la aspereza de «den a ustedes mismos salvación y vida», sin resolver doctrinalmente su tensión.'
  naturalness: 'El español es mayormente natural y mantiene un registro homilético actual. Se mejoran algunas expresiones para mayor precisión y fluidez: «quien lee entre ustedes», «dedicarse al estudio», «duplicidad» y «el piadoso». «Piedad» es natural en este registro y, con la nota contextual, evita la paráfrasis extensa «quien vive con devoción a Dios».'
  terminology: Se conservan «Dios de la verdad», «arrepentirse», «salvación», «vida», «justicia», «resurrección» y «padres». «Piedad/piadoso» representa de modo más compacto y consistente el par piety/godly del testimonio. «Preceptos» reproduce adecuadamente «ordinances» sin introducir un sentido técnico.
  issues:
  - severity: medium
    issue: «Pondremos un ejemplo» por «we will set a goal».
    rationale: «Ejemplo» puede ser una consecuencia contextual, pero no conserva la metáfora explícita de fijar una meta, objetivo o modelo.
  - severity: medium
    issue: «Conocimiento de la devoción a Dios» por «study of piety».
    rationale: La formulación cambia el objeto de «study» y suena menos natural; el texto habla de esforzarse o trabajar en el estudio de la piedad y de la bondad de Dios.
  - severity: medium
    issue: «Indecisión» por «double-mindedness».
    rationale: «Indecisión» se limita a no poder elegir, mientras que la expresión describe una interioridad dividida o una lealtad/actitud vacilante.
  - severity: low
    issue: La nota a afirma como probable una reconstrucción contextual concreta.
    rationale: Dado que la revisión directa del griego está pendiente y el testimonio inglés es sintácticamente difícil, la nota debe limitarse a señalar la dificultad sin presentar esa explicación como probable.
  revised_text: 'Por tanto, hermanos y hermanas, después de haber oído al Dios de la verdad,[a] les leo una exhortación para que presten atención a lo que está escrito, a fin de que se salven tanto ustedes mismos como quien lee entre ustedes. Pues les pido como recompensa que se arrepientan de todo corazón y se den a ustedes mismos salvación y vida.[b] Al hacer esto, pondremos una meta ante todos los jóvenes que desean esforzarse en el estudio de la piedad y de la bondad de Dios.


    No nos disgustemos ni nos irritemos —necios como somos— cuando alguien nos amoneste y nos haga volver de la injusticia a la justicia. Porque a veces, mientras hacemos el mal, no nos damos cuenta de ello a causa de la duplicidad y la incredulidad que hay en nuestro interior, y nuestro entendimiento es oscurecido por nuestros deseos vanos.


    Practiquemos, pues, la justicia para que seamos salvos hasta el fin. Dichosos los que obedecen estos preceptos. Aunque sufran aflicción por poco tiempo en el mundo, recogerán el fruto inmortal de la resurrección.


    Por tanto, que el piadoso no se entristezca si sufre en el tiempo presente; le espera un tiempo dichoso. Volverá a vivir en el cielo con nuestros padres y se alegrará por toda una eternidad sin tristeza.'
  revised_footnotes:
  - marker: a
    text: 'La construcción transmitida es difícil. También puede reflejar una formulación más literal: «después del Dios de la verdad, les leo una exhortación».'
    reason: Señala la dificultad sintáctica sin fijar una reconstrucción contextual que no puede confirmarse con seguridad a partir del testimonio suministrado.
  - marker: b
    text: La frase atribuye de manera exhortativa «salvación y vida» a la respuesta de los oyentes. No explica aquí cómo se relaciona esa respuesta con la acción salvadora de Dios.
    reason: Conserva la tensión teológica del texto sin suavizarla ni imponer una solución doctrinal.
  revision_rationale: 'Se revisaron los puntos donde el borrador interpretaba o debilitaba expresiones del testimonio: la imagen de establecer una meta, el estudio de la piedad, la duplicidad interior y la designación del piadoso. Se conserva el tono exhortativo, la ambigüedad temporal de «hasta el fin», la metáfora del fruto de la resurrección y la formulación fuerte sobre salvación y vida. La nota sobre la apertura se hizo deliberadamente más cauta porque la ficha indica que aún falta revisión directa del griego.'
