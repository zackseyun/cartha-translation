    reason: Señala una tensión teológica genuina sin suavizar el texto ni imponer una solución doctrinal.
  revision_rationale: Se corrige la principal desviación semántica («ejemplo» por «meta») y se ajustan «estudio», «doble ánimo» y «ordenanzas» para una correspondencia más cercana con el testimonio inglés, manteniendo español latinoamericano natural y el tono exhortativo. La primera cláusula y la exhortación a darse «salvación y vida» conservan sus notas, pues la documentación suministrada reconoce que la revisión directa del griego está pendiente y no conviene resolver sus ambigüedades de modo interpretativo.
