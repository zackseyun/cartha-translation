review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva adecuadamente la estructura exhortativa, las referencias a arrepentimiento, justicia, salvación, resurrección y vida futura. Sin embargo, «pondremos un ejemplo ante todos los jóvenes» no corresponde al testimonio («we shall set a goal for all the young»): introduce la idea de ejemplaridad y omite la de una meta. «Conocimiento de la devoción» también desplaza «study of piety»; «estudio de la piedad» es más fiel. La nota a es apropiada, dada la dificultad de la primera cláusula y la falta de una revisión griega directa en la ficha.'
  naturalness: El español es generalmente natural y de registro homilético contemporáneo. Se mejora la fluidez con «tengan por meta» y «estudio de la piedad». «De doble ánimo» conserva mejor la imagen moral del testimonio que «indecisión», sin resultar ininteligible en este registro.
  terminology: «Hermanos y hermanas», «exhortación», «justicia», «resurrección», «salvación y vida» y «padres» son elecciones adecuadas. Se conserva «piedad» para piety/godly, término religioso tradicional pero aún comprensible; evita parafrasear «el piadoso» como una descripción más larga. «Ordenanzas» refleja ordinances de forma más cercana que «mandatos», sin requerir una interpretación técnica.
  issues:
  - severity: medium
    issue: «Pondremos un ejemplo ante todos los jóvenes» traduce «we shall set a goal for all the young».
    rationale: '«Ejemplo» no está expresado en el testimonio y cambia la relación: el texto habla de establecer una meta para los jóvenes, no de presentarse como modelo ante ellos.'
  - severity: medium
    issue: «Conocimiento de la devoción a Dios» traduce «study of piety».
    rationale: La frase convierte el estudio en conocimiento y añade explícitamente «a Dios» a «piedad». «Estudio de la piedad» retiene mejor el sentido sin sobreexplicarlo.
  - severity: low
    issue: «Indecisión» atenúa «double-mindedness».
    rationale: El término alude a una disposición interior dividida o inconstante, no solo a dificultad para decidir. «Doble ánimo» conserva ese matiz en un registro apropiado.
  - severity: low
    issue: «Mandatos» puede estrechar «ordinances».
    rationale: «Ordenanzas» ofrece una correspondencia más amplia con las instrucciones o preceptos mencionados, sin especificar una institución particular.
  revised_text: 'Por tanto, hermanos y hermanas, después de haber escuchado al Dios de la verdad,[a] les leo una exhortación para que presten atención a lo que está escrito, a fin de que se salven tanto ustedes mismos como quien lee en medio de ustedes. Lo que les pido como recompensa es que se arrepientan de todo corazón y se den a ustedes mismos salvación y vida.[b] Al hacer esto, estableceremos una meta para todos los jóvenes que desean esforzarse en el estudio de la piedad y de la bondad de Dios.


    No nos disgustemos ni nos irritemos —necios como somos— cuando alguien nos amoneste y nos aparte de la injusticia para llevarnos a la justicia. A veces hacemos el mal sin darnos cuenta, debido al doble ánimo y a la incredulidad que hay en nuestro interior; nuestros deseos vanos oscurecen nuestro entendimiento.


    Practiquemos, pues, la justicia para que seamos salvos hasta el fin. Dichosos los que obedecen estas ordenanzas. Aunque sufran por poco tiempo en este mundo, recogerán el fruto inmortal de la resurrección.


    Por tanto, el piadoso no se entristezca si padece en el tiempo presente, pues le espera un tiempo dichoso. Volverá a vivir en el cielo junto con nuestros padres y se alegrará por toda una eternidad sin tristeza.'
  revised_footnotes:
  - marker: a
    text: 'La expresión también puede entenderse de manera más literal: «después del Dios de la verdad, les leo una exhortación». Probablemente distingue la lectura previa de la palabra divina de la exhortación que ahora se lee, pero la formulación antigua es difícil.'
    reason: Preserva una dificultad sintáctica y evita presentar como segura una reconstrucción contextual.
  - marker: b
