base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: es
  text: 'Que ninguno de ustedes diga que esta carne no es juzgada ni resucita.


    Comprendan: ¿En qué fueron salvados? ¿En qué recobraron la vista, si no fue mientras estaban en esta carne?


    Por lo tanto, debemos cuidar la carne como templo de Dios. Pues así como fueron llamados en la carne, también vendrán en la carne.[a]


    Si Cristo, el Señor que nos salvó, siendo primero espíritu, se hizo carne y así nos llamó, también nosotros recibiremos nuestra recompensa en esta carne.[b]


    Por lo tanto, amémonos unos a otros, para que todos entremos en el reino de Dios.


    Mientras tengamos oportunidad de ser sanados, pongámonos en manos de Dios, quien nos sana, y démosle algo en retribución.[c] ¿Qué le daremos? Arrepentimiento de corazón sincero.


    Porque él conoce todas las cosas de antemano y sabe lo que hay en nuestro corazón.


    Por lo tanto, démosle alabanza eterna, no solo con los labios, sino también de corazón, para que nos reciba como hijos. Pues el Señor también dijo: «Estos son mis hermanos: los que hacen la voluntad de mi Padre».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: «también vendrán en la carne». El texto no precisa aquí si esta venida se refiere a comparecer ante Dios, a la resurrección o a la entrada en el reino.'
    reason: Preservar la amplitud de la expresión y advertir que no debe resolverse silenciosamente.
  - marker: b
    text: La expresión «siendo primero espíritu» se conserva de manera directa; el pasaje no explica aquí en qué sentido Cristo era «espíritu» ni el alcance de «primero».
    reason: Mantener la tensión cristológica del texto sin imponer una explicación denominacional.
  - marker: c
    text: La frase griega expresa una retribución o correspondencia dada a Dios; la oración siguiente la identifica como arrepentimiento sincero.
    reason: Aclarar una metáfora económica que podría malinterpretarse como si la sanidad divina pudiera comprarse.
lexical_decisions:
- source_word: σάρξ (sarx)
  choice: carne
  rationale: Conserva el término concreto y repetido que sostiene el argumento acerca del juicio, la resurrección y el cuidado del cuerpo, sin sustituirlo por una interpretación como «naturaleza humana».
- source_word: ἀνίσταται (anistatai)
  choice: resucita
  rationale: En este contexto escatológico expresa levantarse de la muerte, y «resucita» lo comunica con naturalidad.
- source_word: φυλάσσειν (phylassein)
  choice: cuidar
  rationale: Expresa guardar, proteger o preservar la carne; «cuidar» resulta claro en español actual sin añadir una idea ascética específica.
- source_word: μισθός (misthos)
  choice: recompensa
  rationale: Mantiene la noción de pago o premio futuro sin definir su naturaleza.
- source_word: μετάνοια (metanoia)
  choice: arrepentimiento
  rationale: Es el equivalente religioso usual y aquí denota una vuelta sincera del corazón.
- source_word: αἶνος αἰώνιος (ainos aiōnios)
  choice: alabanza eterna
  rationale: Reproduce de manera directa la duración y el carácter de la respuesta ofrecida a Dios.
theological_decisions:
- issue: La carne como sujeto de juicio y resurrección
  choice: «esta carne no es juzgada ni resucita»
  alternative: «este cuerpo no será juzgado ni resucitará»
  rationale: Se conserva «carne» y el presente del discurso para mantener tanto la insistencia léxica como la formulación enfática del pasaje.
- issue: Preexistencia y encarnación de Cristo
  choice: «siendo primero espíritu, se hizo carne»
  alternative: «aunque al principio era espíritu, se encarnó»
  rationale: La formulación más directa preserva la tensión del texto y evita explicar «espíritu» o «primero» mediante una cristología posterior.
- issue: Llegada futura en la carne
  choice: «también vendrán en la carne»
  alternative: «también comparecerán en la carne»
  rationale: Se mantiene el verbo amplio «venir» sin decidir si se refiere específicamente a presentarse ante el juicio, resucitar o entrar en el reino.
- issue: Ser recibidos como hijos
  choice: «para que nos reciba como hijos»
  alternative: «para que nos acepte como hijos suyos»
  rationale: Evita añadir «suyos», aunque el contexto naturalmente relaciona la filiación con Dios.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se conserva la repetición retórica de «carne», «corazón» y «por lo tanto». La traducción fue cotejada con la formulación griega conocida del pasaje, aunque los materiales proporcionados señalan que la revisión directa de la tradición manuscrita aún está pendiente.
