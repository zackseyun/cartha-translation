base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: es
  text: '**2 Clemente 13**


    Por tanto, hermanos y hermanas,[a] arrepintámonos de inmediato. Mantengámonos alerta para hacer el bien, pues estamos llenos de mucha insensatez y maldad. Borremos de nosotros nuestros pecados pasados y no seamos personas que buscan agradar a la gente. No busquemos agradar solamente unos a otros, sino procuremos agradar también a los de afuera por medio de nuestra justicia, para que el Nombre no sea blasfemado por causa de nosotros.


    Porque el Señor dice: «Continuamente mi Nombre es blasfemado entre los gentiles»; y también: «¡Ay de aquel por cuya causa es blasfemado mi Nombre!». ¿Cómo es blasfemado? Porque ustedes no hacen las cosas que deseo.


    Pues, cuando los gentiles oyen de nuestros labios las palabras de Dios, se maravillan de su belleza y grandeza. Pero luego, cuando descubren que nuestras obras no son dignas de las palabras que decimos, enseguida se entregan a la blasfemia y dicen que es un relato vacío y un engaño.


    Porque, cuando nos oyen decir que Dios afirma: «No tienen mérito si aman a quienes los aman; pero sí tienen mérito si aman a sus enemigos y a quienes los odian», al oír estas cosas, digo, se maravillan de su extraordinaria bondad. Pero cuando ven que no solo no amamos a quienes nos odian, sino que ni siquiera amamos a quienes nos aman,[b] se burlan de nosotros, y el Nombre es blasfemado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El término griego también puede traducirse simplemente «hermanos» y, en este contexto, se dirige al conjunto de la comunidad.
    reason: Aclara la explicitación inclusiva del vocativo sin ocultar su forma lingüística.
  - marker: b
    text: 'La tradición griega transmite: «no solo no amamos a quienes nos odian, sino que ni siquiera amamos a quienes nos aman». El testimonio inglés suministrado presenta una oración incompleta en este punto.'
    reason: La traducción sigue la lectura griega coherente y evita perpetuar la frase truncada del testimonio inglés.
lexical_decisions:
- source_word: ἀδελφοί
  choice: hermanos y hermanas
  rationale: El vocativo plural se dirige a toda la comunidad; la formulación explícita comunica en español actual su alcance colectivo sin alterar la relación familiar.
- source_word: νήψωμεν ἐπὶ τὸ ἀγαθόν
  choice: Mantengámonos alerta para hacer el bien
  rationale: Conserva la idea de lucidez y vigilancia moral de νήφω, evitando el sentido exclusivamente físico de «estar sobrios».
- source_word: ἀνθρωπάρεσκοι
  choice: vivamos buscando agradar a la gente
  rationale: Expresa de manera natural el sentido de orientar la conducta a obtener aprobación humana.
- source_word: τοῖς ἔξω
  choice: los de afuera
  rationale: Mantiene la designación antigua de quienes están fuera de la comunidad, sin especificar indebidamente una identidad religiosa concreta.
- source_word: τὸ ὄνομα
  choice: el Nombre
  rationale: La mayúscula señala que se trata del nombre de Dios, siguiendo el uso reverencial del pasaje sin sustituirlo por una explicación.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: las palabras de Dios
  rationale: «Palabras» comunica con claridad el sentido de declaraciones divinas; «oráculos» resultaría poco natural para muchos lectores modernos.
- source_word: μῦθός τις καὶ πλάνη
  choice: un cuento vacío y un engaño
  rationale: Refleja la acusación de que el mensaje carece de realidad y extravía, con lenguaje comprensible y digno.
- source_word: χάρις
  choice: mérito
  rationale: En esta enseñanza ética, «mérito» reproduce el valor contextual de reconocimiento o crédito, en consonancia con la tradición sinóptica evocada.
theological_decisions:
- issue: El alcance de «el Nombre»
  choice: Conservar «el Nombre» como referencia reverencial a Dios
  alternative: Sustituirlo por «el nombre de Dios»
  rationale: El propio texto usa la designación absoluta y la vincula directamente con las palabras del Señor; conservarla mantiene su fuerza retórica y teológica.
- issue: Relación entre arrepentimiento y salvación
  choice: 'Traducir la exhortación en su secuencia: «arrepentidos de todo corazón, alcancemos la salvación»'
  alternative: Omitir la frase como hace el testimonio inglés suministrado
  rationale: La tradición griega conocida incluye la exhortación, y la traducción no debe borrar su tensión soteriológica ni convertirla en una formulación doctrinal más específica.
- issue: Identidad de «las naciones»
  choice: Usar «las naciones»
  alternative: Usar «los gentiles» o «los paganos»
  rationale: «Naciones» conserva el valor amplio de ἔθνη y evita añadir una caracterización peyorativa o confesional.
- issue: Forma de las citas atribuidas al Señor y a Dios
  choice: Presentarlas como citas dentro del discurso del autor sin asignarles una referencia bíblica exacta
  alternative: Armonizarlas verbalmente con Isaías, Ezequiel o Lucas
  rationale: Las formulaciones son citas o alusiones compuestas y no deben forzarse a coincidir con un pasaje canónico particular.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefieren construcciones exhortativas naturales y vocabulario accesible. Se conserva la repetición retórica de «el Nombre» y el contraste entre palabras y obras. La traducción sigue la evidencia griega conocida cuando el testimonio inglés suministrado omite o mutila una frase.
