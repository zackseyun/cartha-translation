revisions:
- from: '**2 Clemente 13**


    Por tanto, hermanos y hermanas,[a] arrepintámonos ahora mismo. Mantengámonos alerta para hacer el bien, pues estamos llenos de mucha insensatez y maldad. Borremos nuestros pecados pasados y, arrepentidos de todo corazón, alcancemos la salvación.[b] No vivamos buscando agradar a la gente ni queramos agradarnos solo unos a otros, sino también a los de afuera mediante nuestra conducta justa, para que el Nombre no sea blasfemado por causa nuestra.


    Porque el Señor dice: «En todo momento mi Nombre es blasfemado entre todas las naciones»; y también: «¡Ay de aquel por cuya causa es blasfemado mi Nombre!». ¿Por qué es blasfemado? Porque ustedes no hacen lo que yo deseo.


    Cuando las naciones oyen de nuestros labios las palabras de Dios, quedan admiradas de su belleza y grandeza. Pero después, cuando descubren que nuestras obras no son dignas de las palabras que decimos, enseguida comienzan a blasfemar y dicen que todo esto no es más que un cuento vacío y un engaño.


    Pues nos oyen decir que Dios afirma: «No tiene ningún mérito que amen a quienes los aman; pero sí tiene mérito que amen a sus enemigos y a quienes los odian». Al oír esto, quedan admirados de tan extraordinaria bondad. Sin embargo, cuando ven que no solo no amamos a quienes nos odian, sino que ni siquiera amamos a quienes nos aman,[c] se burlan de nosotros, y el Nombre es blasfemado.'
