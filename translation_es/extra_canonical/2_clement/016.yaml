    issue: La tierra y el plomo fundido
    rationale: La redacción «toda la tierra será como plomo que se funde» puede describir solo una semejanza estática. La imagen transmitida indica que la tierra se derrite, como el plomo al fuego; se ajusta la sintaxis para conservar esa acción.
