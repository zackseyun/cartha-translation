base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: es
  text: 'Por tanto, hermanos y hermanas,[a] ya que se nos ha brindado una oportunidad nada pequeña para arrepentirnos y aún tenemos tiempo, volvamos al Dios que nos llamó mientras todavía tenemos a quien nos reciba.


    Porque, si renunciamos a estos placeres y dominamos nuestra alma, negándonos a satisfacer sus malos deseos, participaremos de la misericordia de Jesús.


    Pero ustedes saben que el día del juicio ya viene como un horno encendido. Las potencias de los cielos se derretirán, y toda la tierra será como plomo que se funde en el fuego. Entonces quedarán de manifiesto las obras ocultas y públicas de los seres humanos.


    Por tanto, socorrer al necesitado[b] es bueno, como lo es arrepentirse del pecado. El ayuno es mejor que la oración, y socorrer al necesitado es mejor que ambos. El amor cubre multitud de pecados, pero la oración que nace de una buena conciencia libra de la muerte. Dichoso todo el que sea hallado lleno de estas cosas, porque socorrer al necesitado aligera la carga del pecado.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La palabra traducida «hermanos y hermanas» es una forma plural que puede dirigirse a toda la comunidad.
    reason: Aclara el valor inclusivo comunitario sin alterar el cuerpo del texto.
  - marker: b
    text: La expresión griega también puede traducirse «dar limosna» o «hacer obras de misericordia». Lo mismo se aplica a sus repeticiones en este párrafo.
    reason: Documenta el campo semántico de ἐλεημοσύνη y la decisión de usar una formulación natural en español actual.
  - marker: c
    text: 'También podría traducirse: «porque la ayuda al necesitado llega a ser un alivio del pecado».'
    reason: Conserva una alternativa cercana a la construcción griega y señala que la imagen no define por sí sola el mecanismo teológico implicado.
lexical_decisions:
- source_word: ἀδελφοί (as reflected by “brethren” in the supplied witness)
  choice: hermanos y hermanas
  rationale: Expresa en español actual el sentido colectivo de la forma masculina plural usada para dirigirse a toda la comunidad, sin excluir a las mujeres.
- source_word: μετάνοια / μετανοῆσαι (as reflected by “repentance / repent” in the supplied witness)
  choice: arrepentimiento / arrepentirnos
  rationale: Conserva la dimensión moral y espiritual del retorno a Dios presente en el pasaje.
- source_word: ἐλεημοσύνη (as reflected by “almsgiving” in the supplied witness)
  choice: socorrer al necesitado
  rationale: Comunica la ayuda misericordiosa y material al pobre con una expresión natural y digna; “limosna” puede sugerir en el uso moderno una dádiva mínima o condescendiente.
- source_word: δυνάμεις τῶν οὐρανῶν (as reflected by “powers of the heavens” in the supplied witness)
  choice: las potencias de los cielos
  rationale: Mantiene la expresión apocalíptica sin decidir si designa cuerpos celestes, seres espirituales o fuerzas cósmicas.
- source_word: καλὴ συνείδησις (as reflected by “good conscience” in the supplied witness)
  choice: buena conciencia
  rationale: Es una equivalencia directa y comprensible que conserva la relación entre integridad moral y oración.
- source_word: κούφισμα ἁμαρτίας (as reflected by “lifts off the burden of sin” in the supplied witness)
  choice: aligera la carga del pecado
  rationale: Preserva la metáfora del pecado como peso sin convertirla en una formulación dogmática más específica.
theological_decisions:
- issue: Relación entre ayuno, oración, ayuda al necesitado, amor y pecado
  choice: Conservar las comparaciones y afirmaciones tal como aparecen, incluida “aligera la carga del pecado”
  alternative: Reformularlas para subordinarlas explícitamente a una doctrina posterior sobre mérito, perdón o justificación
  rationale: El texto presenta una exhortación sapiencial y penitencial de fuerte tensión teológica. No corresponde resolver esa tensión mediante explicaciones confesionales añadidas.
- issue: Identidad de “las potencias de los cielos”
  choice: Mantener la expresión abierta
  alternative: Traducir como “astros”, “ángeles” o “fuerzas del universo”
  rationale: La formulación admite más de un referente en lenguaje apocalíptico; especificarlo eliminaría una ambigüedad genuina.
- issue: “La oración… libra de la muerte”
  choice: Traducir “muerte” sin calificarla
  alternative: Precisar “muerte eterna”, “muerte espiritual” o “muerte física”
  rationale: El contexto no obliga a escoger una sola de estas interpretaciones.
- issue: “Participaremos de la misericordia de Jesús”
  choice: Conservar la formulación participativa
  alternative: Parafrasear como “Jesús nos perdonará” o “seremos salvos por Jesús”
  rationale: La traducción preserva la formulación propia del pasaje sin reducir su alcance a una sola categoría teológica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se evitan arcaísmos. La cadencia exhortativa y apocalíptica se conserva con frases claras. El borrador se contrastó con la evidencia griega identificable detrás del testimonio suministrado, pero, dado que el expediente declara pendiente la revisión directa de la fuente griega, las decisiones deben considerarse sujetas a cotejo crítico final.
