source:
  text: 'Therefore let us also be found among those that give thanks, among those that have served God, and not among the ungodly that are judged.


    For I myself too, being an utter sinner and not yet escaped from temptation, but being still amidst the engines of the devil, do my diligence to follow after righteousness, that I may prevail so far at least as to come near unto it, while I fear the judgment to come.'
