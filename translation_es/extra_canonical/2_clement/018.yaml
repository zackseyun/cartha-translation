base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: es
  text: 'Así pues, seamos también nosotros de los que dan gracias, de los que han servido a Dios, y no de los impíos que son juzgados.


    Porque yo mismo soy un pecador en todo sentido y todavía no he escapado de la tentación, sino que aún me encuentro en medio de los instrumentos del diablo. Sin embargo, me esfuerzo por perseguir la justicia, a fin de lograr siquiera acercarme a ella, pues temo el juicio venidero.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστούντων
  choice: los que dan gracias
  rationale: Conserva el sentido explícito de agradecimiento del participio, sin convertirlo en una referencia litúrgica más específica.
- source_word: δεδουλευκότων τῷ θεῷ
  choice: los que han servido a Dios
  rationale: Refleja el aspecto perfecto y la idea de servicio rendido a Dios; evita «esclavos», que en este contexto podría añadir una dureza no necesaria.
- source_word: πανθαμαρτωλός
  choice: un pecador en todo sentido
  rationale: Expresa la intensidad del compuesto griego sin recurrir a una formulación poco natural como «pecador absoluto».
- source_word: ἐν μέσοις τοῖς ὀργάνοις τοῦ διαβόλου
  choice: en medio de los instrumentos del diablo
  rationale: Mantiene la imagen concreta y relativamente abierta de ὄργανα, que puede aludir a medios, instrumentos o mecanismos, sin reducirla a una sola interpretación.
- source_word: τὴν δικαιοσύνην διώκειν
  choice: perseguir la justicia
  rationale: Conserva la fuerza activa de διώκειν y el objeto abstracto δικαιοσύνη.
- source_word: τὴν κρίσιν τὴν μέλλουσαν
  choice: el juicio venidero
  rationale: Reproduce de manera digna y clara la referencia al juicio futuro.
theological_decisions:
- issue: Relación entre el esfuerzo humano, la justicia y el juicio
  choice: «me esfuerzo por perseguir la justicia… pues temo el juicio venidero»
  alternative: Explicitar una doctrina de mérito, santificación o seguridad de salvación
  rationale: El texto vincula esfuerzo, aproximación a la justicia y temor del juicio, pero no define aquí cómo se relacionan doctrinalmente; la traducción preserva esa tensión.
- issue: Sentido de «los impíos que son juzgados»
  choice: Mantener el presente «son juzgados»
  alternative: «serán condenados»
  rationale: No se equipara silenciosamente «juzgar» con «condenar» ni se transforma de forma innecesaria el valor temporal del participio.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el paralelismo exhortativo y la transición a la confesión personal. Aunque el expediente indica que la revisión directa del griego está pendiente, las decisiones se han cotejado con la formulación griega transmitida del pasaje; conviene confirmar la lectura contra una edición crítica antes de publicación definitiva.
