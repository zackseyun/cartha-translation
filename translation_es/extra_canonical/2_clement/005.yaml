  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: es
  text: '5 Por tanto, hermanos, abandonemos nuestra estancia pasajera en este mundo, hagamos la voluntad de quien nos llamó y no tengamos miedo de partir de este mundo.


    Porque el Señor dice: «Serán como corderos en medio de lobos».


    Pero Pedro le respondió: «¿Y qué pasará si los lobos despedazan a los corderos?».


    Jesús dijo a Pedro: «No teman los corderos a los lobos después de que hayan muerto. Tampoco ustedes teman a quienes los matan y no pueden hacerles nada; teman, más bien, a aquel que, después de que ustedes mueran, tiene autoridad sobre el alma y el cuerpo para arrojarlos a la Gehenna de fuego».[a]


    Y ustedes saben, hermanos, que la estancia de esta carne en este mundo es insignificante y breve, pero la promesa de Cristo es grande y maravillosa: el descanso del reino venidero y de la vida eterna.[b]


    ¿Qué podemos hacer, entonces, para alcanzar estas cosas, sino vivir en santidad y justicia, considerar ajenas a nosotros las cosas de este mundo y no desearlas?


    Porque, cuando deseamos obtener estas cosas, nos apartamos del camino justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este dicho combina temas conocidos de Mateo 10:16, 28 y Lucas 12:4-5, pero incluye un diálogo entre Pedro y Jesús que no aparece así en los Evangelios canónicos conservados.
    reason: 'La nota es prudente: señala paralelos canónicos sin atribuir de forma no demostrada el diálogo a una fuente determinada.'
  - marker: b
    text: La construcción también puede entenderse como «el descanso del reino que vendrá y de la vida eterna».
    reason: La nota preserva una posible relación sintáctica alternativa sin imponer una interpretación.
lexical_decisions:
- source_word: παροικία / sojourn (según el testimonio inglés)
  choice: estancia pasajera
  rationale: Conserva la imagen de residencia temporal y extranjería sin recurrir al poco natural «peregrinación»; la repetición posterior se traduce como «estancia» por fluidez.
- source_word: Gehenna
  choice: Gehenna
  rationale: Se mantiene el nombre propio tradicional del lugar, en vez de nivelarlo con «infierno», para preservar la especificidad del testimonio.
- source_word: mean
  choice: insignificante
  rationale: En este contexto contrasta la condición humilde y transitoria de la vida corporal con la grandeza de la promesa; «insignificante» expresa mejor ese contraste que «mala» o «vil».
- source_word: walk in holiness and righteousness
  choice: vivir en santidad y justicia
  rationale: La expresión idiomática «vivir» comunica naturalmente la metáfora semítica de caminar como conducta, manteniendo ambos términos éticos.
- source_word: rest
  choice: descanso
  rationale: Conserva la imagen escatológica sin interpretarla de manera denominacional.
theological_decisions:
- issue: Identidad de aquel que tiene autoridad sobre alma y cuerpo
  choice: a aquel
  alternative: a Dios
  rationale: El referente implícito se conserva sin identificarlo explícitamente, evitando resolver lo que el texto citado deja tácito.
- issue: Relación entre el descanso, el reino venidero y la vida eterna
  choice: el descanso del reino venidero y de la vida eterna
  alternative: el descanso, es decir, el reino venidero y la vida eterna
  rationale: Se preserva la relación sintáctica algo abierta del testimonio en vez de convertirla sin más en una equivalencia explicativa.
- issue: Destino de alma y cuerpo
  choice: arrojarlos a la Gehenna de fuego
  alternative: arrojar a ambos a la Gehenna de fuego
  rationale: El pronombre plural conserva la referencia conjunta a alma y cuerpo, sin añadir una explicación ajena al texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se evitan arcaísmos. La traducción es provisional porque el material suministrado indica que la revisión directa del griego está pendiente; las decisiones se apoyan en el testimonio inglés público y en los ecos sinópticos identificables.
