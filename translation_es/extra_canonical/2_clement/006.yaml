review_pass:
  verdict: revise
  source_fidelity: El borrador refleja fielmente el testimonio inglés suministrado en casi todo el pasaje y conserva sus exhortaciones y condicionamientos. Sin embargo, «este mundo presente» interpreta «this age»; «este siglo» conserva mejor el contraste temporal-escatológico. Más importante, «librarían a sus hijos del cautiverio» cambia «their children in the captivity» por liberación del cautiverio. Debe decir «a sus hijos en el cautiverio», sin resolver la formulación inusual de la cita.
  naturalness: El español es claro, actual y de registro apropiado. «Estar unidos al otro» es comprensible, pero «mantener comunión con el otro» representa más directamente la imagen de compañía/asociación y mantiene la personificación. «No nos aprovecha» evita la repetición coloquial de «servir» inmediatamente después de «servir a Dios».
  terminology: «Siervo», «riquezas», «alma», «descanso», «castigo eterno», «bautismo», «reino de Dios» y «defensor» son elecciones adecuadas. Se conserva «siglo» para traducir la oposición de las dos edades, sin convertirla en una oposición espacial entre dos mundos.
  issues:
  - severity: medium
    issue: «del cautiverio» en la cita atribuida a Ezequiel
    rationale: El testimonio inglés dice que los justos no librarían «their children in the captivity», no que los librarían «del cautiverio». La preposición «del» altera el sentido y armoniza implícitamente una cita ya reconocidamente divergente.
  - severity: low
    issue: «Este mundo presente» para «this age»
    rationale: «Mundo» puede expresar un orden presente, pero «siglo» conserva de manera más precisa la oposición entre la edad presente y la futura, y evita añadir un referente espacial.
  - severity: low
    issue: «mantenernos unidos al otro» para «hold companionship with the other»
    rationale: La formulación es aceptable, pero «mantener comunión con el otro» traduce con mayor precisión la relación de asociación y funciona naturalmente dentro de la personificación del pasaje.
  revised_text: 'Pero el Señor dice: «Ningún siervo puede servir a dos señores». Si deseamos servir a Dios y a las riquezas, no nos aprovecha de nada.


    Pues ¿de qué le sirve a alguien ganar el mundo entero si pierde su alma?[a]


    Ahora bien, este siglo y el venidero son dos enemigos.


    Uno habla de adulterio, impureza, avaricia y engaño; el otro se despide de estas cosas.


    Por tanto, no podemos ser amigos de los dos, sino que debemos despedirnos de uno y mantener comunión con el otro.


    Consideremos que es mejor aborrecer las cosas de aquí, pues son mezquinas, pasajeras y perecederas, y amar las de allá, pues son buenas e imperecederas.


    Porque, si hacemos la voluntad de Cristo, hallaremos descanso. Pero, si no la hacemos y desobedecemos sus mandamientos, nada nos librará del castigo eterno.


    También dice la Escritura en Ezequiel: «Aunque Noé, Job y Daniel se levantaran, no librarían a sus hijos en el cautiverio».[b]


    Pero si ni siquiera hombres justos como ellos pueden librar a sus hijos mediante sus obras justas, ¿con qué confianza entraremos nosotros en el reino de Dios si no conservamos puro e incontaminado nuestro bautismo? ¿O quién será nuestro defensor si no somos hallados con obras santas y justas?'
  revised_footnotes:
  - marker: a
    text: La frase retoma la enseñanza de Jesús conservada en los Evangelios; «alma» también puede abarcar la vida o la persona misma.
    reason: Preserva la amplitud semántica de «alma» y señala la alusión bíblica sin sustituir el texto.
  - marker: b
    text: La forma de la cita difiere del texto habitual de Ezequiel 14:14, 20, donde los tres justos libran solo sus propias vidas y no se dice que «se levantaran». Aquí se reproduce la forma citada por 2 Clemente, incluida la expresión «en el cautiverio».
    reason: Advierte transparentemente la divergencia de la cita y evita armonizar o reinterpretar silenciosamente su formulación.
  revision_rationale: 'Se corrigen dos puntos de fidelidad: «siglo» en vez de «mundo presente» para la oposición de las edades, y «en el cautiverio» en vez de «del cautiverio» para no alterar la cita transmitida. Se ajustan dos expresiones para mayor correspondencia semántica y fluidez, sin introducir interpretación doctrinal. Dado que la revisión directa de la tradición griega sigue pendiente, se preserva la ambigüedad y redacción del testimonio inglés donde no hay una corrección segura.'
