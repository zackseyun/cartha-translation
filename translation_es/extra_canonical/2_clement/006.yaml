base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: es
  text: 'Pero el Señor dice: «Ningún siervo puede servir a dos señores». Si deseamos servir a Dios y a las riquezas, no nos sirve de nada.


    Pues ¿de qué le sirve a alguien ganar el mundo entero si pierde su alma?[a]


    Este mundo presente y el venidero son enemigos.


    Uno habla de adulterio, impureza, avaricia y engaño; el otro se despide de estas cosas.


    Por tanto, no podemos ser amigos de ambos, sino que debemos despedirnos de uno y mantenernos unidos al otro.


    Consideremos que es mejor aborrecer las cosas de aquí, pues son mezquinas, pasajeras y perecederas, y amar las de allá, pues son buenas e imperecederas.


    Porque, si hacemos la voluntad de Cristo, hallaremos descanso. Pero, si no la hacemos y desobedecemos sus mandamientos, nada nos librará del castigo eterno.


    También dice la Escritura en Ezequiel: «Aunque Noé, Job y Daniel se levantaran, no librarían a sus hijos del cautiverio».[b]


    Pero si ni siquiera hombres justos como ellos pueden librar a sus hijos mediante sus obras justas, ¿con qué confianza entraremos nosotros en el reino de Dios si no conservamos puro e incontaminado nuestro bautismo? ¿O quién será nuestro defensor si no somos hallados con obras santas y justas?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase retoma la enseñanza de Jesús conservada en los Evangelios; «alma» también puede abarcar la vida o la persona misma.
    reason: Preservar la amplitud semántica de «alma» y señalar la alusión bíblica sin sustituir el texto.
  - marker: b
    text: La forma de la cita difiere del texto habitual de Ezequiel 14:14, 20, donde los tres justos libran solo sus propias vidas y no se dice que «se levantaran». Aquí se reproduce la forma citada por 2 Clemente.
    reason: Advertir con transparencia la divergencia textual y evitar armonizar silenciosamente la cita.
lexical_decisions:
- source_word: mammon
  choice: las riquezas
  rationale: Expresa en español actual el poder rival de la riqueza material, sin conservar un préstamo poco transparente para muchos lectores.
- source_word: this age and the future
  choice: este mundo presente y el venidero
  rationale: «Mundo» comunica aquí el orden o época actual; «el venidero» conserva el contraste escatológico sin añadir «mundo» donde el texto lo deja implícito.
- source_word: mean
  choice: mezquinas
  rationale: Conserva el juicio de escaso valor o bajeza del original reflejado por el testimonio, sin intensificarlo hasta «malvadas».
- source_word: hold companionship with
  choice: mantenernos unidos a
  rationale: Reproduce la idea relacional de asociarse o guardar compañía con el siglo venidero en una forma natural en español.
- source_word: advocate
  choice: defensor
  rationale: Mantiene el sentido general de alguien que interviene en favor de otro, sin imponer una figura técnica o una identificación doctrinal.
theological_decisions:
- issue: Relación entre obediencia, obras y entrada en el reino
  choice: Conservar las afirmaciones condicionales fuertes del pasaje
  alternative: Suavizarlas mediante una explicación doctrinal sobre fe, gracia o mérito
  rationale: El texto vincula explícitamente la voluntad de Cristo, los mandamientos, el bautismo y las obras justas con el descanso y la entrada en el reino. La traducción no debe resolver desde fuera esa tensión teológica.
- issue: «Nuestro bautismo» como realidad que debe conservarse pura
  choice: Traducir literalmente la imagen moral y ritual
  alternative: Parafrasear como «nuestra vida después del bautismo» o identificarla con una doctrina bautismal específica
  rationale: La expresión admite discusión interpretativa; se conserva sin ampliación confesional.
- issue: El referente de «uno» y «el otro»
  choice: Mantener la personificación de los dos mundos o épocas
  alternative: Explicitar que uno representa el pecado y el otro la justicia
  rationale: El pasaje personifica ambos órdenes y deja que las listas y exhortaciones definan su carácter.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la retórica exhortativa, la personificación de las dos épocas y el vocabulario teológico tradicional cuando sigue siendo comprensible. El borrador se apoya en el testimonio inglés público suministrado, pues la revisión directa del griego está pendiente.
