    Esta era y la venidera son enemigas.


    Una habla de adulterio, impureza, avaricia y engaño; la otra se despide de estas cosas.


    Por tanto, no podemos ser amigos de ambas, sino que debemos despedirnos de una y mantenernos unidos a la otra.


    Consideremos que es mejor aborrecer las cosas de aquí, pues son mezquinas, pasajeras y perecederas, y amar las de allá, pues son buenas e imperecederas.


    Porque, si hacemos la voluntad de Cristo, hallaremos descanso. Pero, si no la hacemos y desobedecemos sus mandamientos, nada nos librará del castigo eterno.


    También dice la Escritura en Ezequiel: «Aunque Noé, Job y Daniel se levantaran, no librarían a sus hijos en el cautiverio».[b]


    Pero si ni siquiera hombres justos como ellos pueden librar a sus hijos mediante sus obras justas, ¿con qué confianza entraremos nosotros en el reino de Dios si no conservamos puro e incontaminado nuestro bautismo? ¿O quién será nuestro defensor si no somos hallados con obras santas y justas?'
  revised_footnotes:
  - marker: a
    text: La frase retoma la enseñanza de Jesús conservada en los Evangelios; «alma» también puede abarcar la vida o la persona misma.
    reason: Preserva la amplitud semántica de «alma» y señala la alusión bíblica sin sustituir el texto.
  - marker: b
    text: La forma de la cita difiere del texto habitual de Ezequiel 14:14, 20, donde los tres justos libran solo sus propias vidas y no se dice que «se levantaran». Aquí se reproduce la forma citada por 2 Clemente; «en el cautiverio» conserva su formulación inusual.
    reason: Advierte transparentemente la divergencia textual y evita armonizar o aclarar silenciosamente la cita.
  revision_rationale: 'Se corrigen dos desplazamientos de sentido: el contraste entre la era presente y la futura se restituye sin convertirlo en una oposición entre mundos, y la referencia a los hijos «en el cautiverio» deja de expresarse como una liberación «del cautiverio». También se ajustan los pronombres femeninos para concordar con «era», manteniendo la personificación original. Las notas se conservan y la segunda se precisa para explicar la formulación inusual sin resolverla interpretativamente.'
