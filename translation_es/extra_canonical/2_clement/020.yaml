base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: es
  text: 'No permitan tampoco que esto les perturbe la mente: que veamos a los injustos poseer riquezas mientras los siervos de Dios pasan necesidad.


    Así pues, tengamos fe, hermanos y hermanas. La vida presente nos entrena para que seamos coronados en la venidera.


    Ninguna persona justa recoge pronto el fruto, sino que lo espera.


    Porque, si Dios diera rápidamente a los justos su recompensa, enseguida nos ejercitaríamos en el comercio y no en la piedad; pareceríamos justos, aunque no buscaríamos lo que honra a Dios, sino lo que nos resulta provechoso. Por eso, el juicio divino alcanza al espíritu que no es justo y lo carga de cadenas.


    Al único Dios invisible, Padre de la verdad, que nos envió al Salvador y Príncipe de la inmortalidad, por medio de quien también nos reveló la verdad y la vida celestial, a él sea la gloria por los siglos de los siglos. Amén.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: pasan necesidad
  rationale: Expresa con naturalidad la estrechez o privación sufrida por los siervos de Dios sin limitarla exclusivamente a pobreza económica.
- source_word: trained
  choice: nos entrena / nos ejercitaríamos
  rationale: Conserva la imagen de formación y disciplina que conecta la vida presente con la corona futura.
- source_word: merchandise / commerce
  choice: el comercio
  rationale: Mantiene el contraste entre una conducta motivada por la ganancia y la verdadera piedad.
- source_word: godliness / godly
  choice: la piedad / lo que honra a Dios
  rationale: «Piedad» conserva el término religioso tradicional; la segunda expresión evita la repetición poco natural y comunica una orientación genuina hacia Dios.
- source_word: spirit
  choice: espíritu
  rationale: Preserva la referencia del testimonio suministrado sin identificar de manera más específica el espíritu con el alma, la mente o una persona.
- source_word: Prince of immortality
  choice: Príncipe de la inmortalidad
  rationale: Retiene el título elevado y su posible alcance cristológico sin reducirlo a «autor» o «fuente».
theological_decisions:
- issue: Demora de la recompensa de los justos
  choice: Se conserva como entrenamiento presente con miras a ser coronados en la vida venidera.
  alternative: Explicarlo como una doctrina detallada sobre el momento exacto de la recompensa final.
  rationale: El pasaje contrasta el presente y el futuro, pero no define aquí una cronología escatológica completa.
- issue: Motivación para la justicia
  choice: Se mantiene el contraste entre piedad genuina y búsqueda de provecho.
  alternative: Interpretar «comercio» únicamente como condena de la actividad mercantil.
  rationale: El argumento critica una justicia practicada como transacción para obtener recompensa rápida, no necesariamente el comercio como ocupación.
- issue: El espíritu encadenado por el juicio
  choice: Se conserva la formulación figurada y su ambigüedad.
  alternative: Precisar que se refiere al alma del individuo después de la muerte o a un castigo histórico concreto.
  rationale: El testimonio no permite resolver con seguridad la identidad del «espíritu» ni la naturaleza o el momento de las cadenas.
- issue: Doxología dirigida a Dios
  choice: «a él sea la gloria» refiere al único Dios invisible mencionado al inicio de la oración.
  alternative: Hacer que la gloria se dirija explícitamente al Salvador.
  rationale: La estructura del testimonio suministrado retoma al referente principal, aunque menciona al Salvador en una cláusula subordinada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa tratamiento plural con «ustedes» implícito y lenguaje inclusivo natural en «hermanos y hermanas». El borrador se basa necesariamente en el testimonio inglés público suministrado y en la capa inglesa auditada; la revisión directa del griego sigue pendiente, por lo que se evitan precisiones que excedan esa evidencia.
