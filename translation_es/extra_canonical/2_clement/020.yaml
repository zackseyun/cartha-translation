review_pass:
  verdict: revise
  source_fidelity: El borrador sigue fielmente el testimonio inglés suministrado en el contraste entre la prosperidad de los injustos y la aflicción de los siervos de Dios, la formación presente para la corona futura, la demora del fruto y la doxología final. Sin acceso directo al griego, no se deben resolver ambigüedades adicionales. En el período condicional central, sin embargo, el inglés auditado presenta una hipótesis contraria en pasado («if God had... we would...»); el imperfecto de subjuntivo con condicional simple del borrador debilita esa relación temporal y modal.
  naturalness: El registro es generalmente natural y digno. «No dejen que esto también los inquiete» expresa con más fluidez el imperativo inicial. «Lo que es lucrativo» evita añadir el posesivo y el referente «nos» a una expresión que en el testimonio solo contrasta lo piadoso con lo rentable. «Cargar con cadenas» es la colocación española más natural.
  terminology: 'Se mantienen términos adecuados y teológicamente no restrictivos: «injustos», «siervos de Dios», «piedad», «espíritu», «Salvador», «Príncipe de la inmortalidad» y «vida celestial». «Piedad» conserva el contraste del texto sin convertirlo en una condena del comercio como oficio. «Espíritu» preserva la indeterminación del referente.'
  issues:
  - severity: medium
    issue: El condicional de la recompensa y de la conducta subsiguiente no refleja el contrafactual pasado del testimonio inglés auditado.
    rationale: «Si Dios diera..., nos ejercitaríamos» formula una hipótesis abierta o presente. «Si Dios hubiera dado..., nos habríamos dedicado...» corresponde a «if God had... we would...», sin decidir una cuestión que requeriría cotejo griego directo.
  - severity: low
    issue: «Lo que nos resulta provechoso» añade un beneficiario no expreso.
    rationale: El testimonio dice «what is gainful/profitable» de manera absoluta. «Lo que es lucrativo» conserva el contraste sin esa explicitación.
  - severity: low
    issue: La apertura resulta algo literal en español.
    rationale: «No permitan tampoco que esto les perturbe la mente» puede expresarse naturalmente como «No dejen que esto también los inquiete», sin cambiar el sentido.
  revised_text: 'No dejen que esto también los inquiete: que vemos a los injustos poseer riquezas mientras los siervos de Dios pasan necesidad.


    Así pues, tengamos fe, hermanos y hermanas. La vida presente nos entrena para que seamos coronados en la venidera.


    Ninguna persona justa recoge pronto el fruto, sino que lo espera.


    Porque, si Dios hubiera dado rápidamente a los justos su recompensa, de inmediato nos habríamos dedicado al comercio y no a la piedad; habríamos parecido justos, aunque no habríamos buscado lo que es piadoso, sino lo que es lucrativo. Por eso, el juicio divino alcanza a un espíritu que no es justo y lo carga con cadenas.


    Al único Dios invisible, Padre de la verdad, que nos envió al Salvador y Príncipe de la inmortalidad, por medio de quien también nos reveló la verdad y la vida celestial, a él sea la gloria por los siglos de los siglos. Amén.'
  revised_footnotes: []
  revision_rationale: La revisión mejora la naturalidad y ajusta de manera segura la estructura condicional al testimonio inglés auditado. Conserva las imágenes y ambigüedades del pasaje, incluido el «espíritu» sometido a cadenas y el referente principal de la doxología. La forma exacta del condicional y otros matices deben confirmarse frente a la tradición griega antes de tratar esta redacción como definitiva.
