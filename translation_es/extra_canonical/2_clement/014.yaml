base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: es
  text: 'Por lo tanto, hermanos, si hacemos la voluntad de Dios, nuestro Padre, seremos parte de la Iglesia primera,[a] la espiritual, creada antes que el sol y la luna. Pero si no hacemos la voluntad del Señor, seremos parte de la Escritura que dice: «Mi casa se convirtió en una cueva de ladrones». Así pues, elijamos más bien ser parte de la Iglesia de la vida, para que seamos salvos.


    No creo que ustedes ignoren que la Iglesia viviente es el cuerpo de Cristo, pues la Escritura dice: «Dios hizo al ser humano varón y mujer». El varón es Cristo, y la mujer es la Iglesia. Además, los Libros y los Apóstoles[b] muestran claramente que la Iglesia no existe ahora por primera vez, sino que ha existido desde el principio. Ella era espiritual, así como nuestro Jesús también era espiritual; pero fue manifestada en los últimos días para salvarnos.


    Ahora bien, la Iglesia, aunque era espiritual, fue manifestada en la carne de Cristo. Así nos muestra que, si la conservamos en la carne y no la corrompemos, la recibiremos de nuevo en el Espíritu Santo. Porque esta carne es figura y copia del espíritu.[c] Por tanto, quien corrompa la copia no recibirá el original como su porción. Esto, pues, es lo que quiere decir, hermanos: «Guarden la carne para que participen del espíritu».


    Pero, si decimos que la carne es la Iglesia y que el espíritu es Cristo, entonces quien ultraja la carne ultraja a la Iglesia.[d] Por tanto, esa persona no participará del espíritu, que es Cristo.


    Tan grandes son la vida y la incorruptibilidad que esta carne puede recibir, si el Espíritu Santo se une a ella, que nadie puede expresar ni decir lo que el Señor ha preparado para sus elegidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: También podría traducirse «la Iglesia original» o «la Iglesia primordial».
    reason: El griego describe a la Iglesia como «primera» y luego afirma que fue creada antes del sol y la luna.
  - marker: b
    text: «Los Libros» probablemente designa las Escrituras; «los Apóstoles» puede referirse a sus enseñanzas o escritos.
    reason: El texto presenta ambos términos como autoridades, pero no identifica obras concretas.
  - marker: c
    text: Los términos griegos contrastan una figura o copia correspondiente con el original o arquetipo.
    reason: El vocabulario conceptual no tiene una pareja exacta y natural en español, y es central para el argumento.
  - marker: d
    text: «Ultraja» también puede expresar maltratar, deshonrar o violentar; el contexto no limita la ofensa a un acto específico.
    reason: El verbo griego tiene un campo semántico amplio que no conviene reducir silenciosamente.
lexical_decisions:
- source_word: ἐκκλησία
  choice: Iglesia
  rationale: Conserva el sentido comunitario y teológico del término en todo el pasaje; la mayúscula ayuda a señalar que se presenta como una realidad personificada y preexistente.
- source_word: ἀδελφοί
  choice: hermanos
  rationale: Es el vocativo plural directo y tradicional en español; en este contexto comunitario puede abarcar a toda la congregación sin añadir palabras ausentes del texto.
- source_word: ἄρσεν καὶ θῆλυ
  choice: varón y mujer
  rationale: Mantiene la distinción sexual y permite seguir la interpretación alegórica inmediata del autor. «Varón» resulta más natural que «macho» aplicado a una persona.
- source_word: ἄνωθεν
  choice: desde el principio
  rationale: En el contexto de la Iglesia anterior al sol y la luna, comunica su existencia primordial; el término también puede sugerir «desde arriba», ambigüedad indicada en nota.
- source_word: ἀντίτυπον ... αὐθεντικόν
  choice: figura y copia ... original
  rationale: Expresa el contraste entre la realidad correspondiente visible y su arquetipo. «Figura y copia» evita que «contraparte» suene mecánico en español.
- source_word: φθείρω
  choice: corromper
  rationale: Conserva el campo semántico de dañar, echar a perder o profanar, y permite mantener la repetición entre la carne y la copia.
- source_word: ὑβρίζω
  choice: ultrajar
  rationale: Comunica un trato injurioso y deshonroso sin limitar el término a una sola clase de conducta.
- source_word: ἀφθαρσία
  choice: incorruptibilidad
  rationale: Es la equivalencia más formal del griego y conserva su relación conceptual con «corromper» en los párrafos anteriores.
theological_decisions:
- issue: La Iglesia espiritual y preexistente
  choice: Se traduce literalmente como «la Iglesia primera, la espiritual, creada antes que el sol y la luna» y «existe desde el principio».
  alternative: Reformularla como el propósito eterno de Dios para la Iglesia.
  rationale: El texto personifica a la Iglesia y afirma explícitamente su existencia primordial; explicarlo como mero plan divino resolvería una tensión teológica que el original deja abierta.
- issue: Identificación alegórica de varón, mujer, Cristo e Iglesia
  choice: 'Se conserva sin explicación doctrinal añadida: «El varón es Cristo, y la mujer es la Iglesia».'
  alternative: Suavizarla como una comparación o símbolo opcional.
  rationale: El autor formula identificaciones directas y luego desarrolla su argumento con ellas.
- issue: Relación entre carne, Iglesia, espíritu y Cristo
  choice: Se mantiene la secuencia de equivalencias del autor y la alternancia entre «espíritu» y «Espíritu Santo».
  alternative: Uniformar todas las referencias como alusiones al Espíritu Santo o al espíritu humano.
  rationale: El pasaje usa esas expresiones de manera compleja y no deben fundirse en una sola referencia interpretativa.
- issue: Salvación y conducta corporal
  choice: Se conserva la afirmación condicional y exhortativa del pasaje.
  alternative: Reformularla para ajustarla a un sistema posterior sobre fe, obras o sacramentos.
  rationale: La traducción debe mantener la tensión propia del texto sin importar una solución confesional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron la personificación femenina de la Iglesia, las repeticiones argumentativas y las formulaciones densas del original. Se evitó el arcaísmo y también la expansión confesional. El signo angular espurio del testimonio inglés no se reprodujo. La redacción fue contrastada con el texto griego tradicional del pasaje, aunque la ficha suministrada advierte que su revisión formal de lengua fuente sigue pendiente.
