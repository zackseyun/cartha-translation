    No creo que ustedes ignoren que la Iglesia viviente es el cuerpo de Cristo, pues la Escritura dice: «Dios hizo al ser humano varón y mujer». El varón es Cristo, y la mujer es la Iglesia. Además, los Libros y los Apóstoles[b] muestran claramente que la Iglesia no existe ahora por primera vez, sino que ha existido desde el principio. Ella era espiritual, así como nuestro Jesús también era espiritual; pero se manifestó en los últimos días para salvarnos.[c]


