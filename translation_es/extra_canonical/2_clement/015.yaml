base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: es
  text: 'No considero que les haya dado un consejo insignificante acerca del dominio propio. Quien lo ponga en práctica no lo lamentará, sino que se salvará tanto a sí mismo como a mí, que le di el consejo. Porque no es pequeña recompensa hacer volver a un alma extraviada y encaminada a la perdición, para que sea salva.


    Esta es, pues, la retribución que podemos ofrecer al Dios que nos creó: que tanto quien habla como quien escucha lo hagan con fe y amor.


    Permanezcamos, por tanto, en lo que hemos creído, practicando la justicia y la santidad, para que podamos presentarnos con confianza ante Dios, quien dice: «Mientras todavía estés hablando, yo diré: “Aquí estoy”».


    Estas palabras son señal de una gran promesa, pues el Señor dice acerca de sí mismo que está más dispuesto a dar que quien pide a pedir.


    Ya que participamos de tan grande bondad, no nos privemos de alcanzar tantos bienes. Porque tan grande como es el gozo que estas palabras traen a quienes las ponen en práctica, así de grande es también la condenación que traen a quienes las desobedecen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: continence / self-control (Greek source term pending direct verification)
  choice: dominio propio
  rationale: Expresa de manera natural y amplia la disciplina moral indicada por el testimonio inglés; evita limitarla sin certeza a la abstinencia sexual. La lectura deberá cotejarse directamente con el griego.
- source_word: convert a wandering and perishing soul
  choice: hacer volver a un alma extraviada y encaminada a la perdición
  rationale: «Hacer volver» conserva la idea de reorientación o retorno; la formulación mantiene separados el extravío presente y el peligro de perdición sin afirmar que esta ya se consumó.
- source_word: boldness
  choice: confianza
  rationale: Comunica la libertad y seguridad para comparecer ante Dios con lenguaje actual y digno; «audacia» podría sugerir presunción.
- source_word: begrudge ourselves
  choice: no nos privemos
  rationale: Reproduce el sentido exhortativo de no negarnos a nosotros mismos los bienes ofrecidos, sin recurrir a un calco poco natural.
- source_word: pleasure
  choice: gozo
  rationale: En este contexto moral y exhortativo, «gozo» expresa mejor el efecto positivo profundo de obedecer estas palabras que el más ambiguo «placer».
theological_decisions:
- issue: La afirmación de que quien obedece «salvará» tanto a sí mismo como al consejero
  choice: se salvará tanto a sí mismo como a mí
  alternative: contribuirá a la salvación tanto de sí mismo como de mí
  rationale: Se conserva la formulación fuerte y la tensión teológica del testimonio, sin añadir una explicación causal o doctrinal que el pasaje no ofrece.
- issue: Relación entre hablar, escuchar y la retribución ofrecida a Dios
  choice: que tanto quien habla como quien escucha lo hagan con fe y amor
  alternative: si quien habla y quien escucha hablan y escuchan con fe y amor
  rationale: La redacción española evita una repetición rígida, pero mantiene que la respuesta debida a Dios involucra por igual al hablante y al oyente, ambos actuando con fe y amor.
- issue: Naturaleza de la condenación por desobedecer
  choice: condenación
  alternative: juicio
  rationale: El testimonio presenta una consecuencia fuerte en contraste con el gozo de la obediencia; «condenación» conserva esa fuerza sin especificar su duración ni desarrollar una doctrina adicional.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las exhortaciones comunitarias y los paralelismos del pasaje, aligerando solo construcciones inglesas arcaicas. Dado que el material suministrado identifica el testimonio inglés como base provisional y señala que falta la revisión directa del griego, las decisiones léxicas que dependen del término griego deben considerarse sujetas a cotejo antes de publicación definitiva.
