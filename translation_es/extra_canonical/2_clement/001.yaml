base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: es
  text: 'Hermanos, debemos considerar a Jesucristo como a Dios, como al Juez de vivos y muertos.


    No debemos tener en poca estima nuestra salvación, porque, cuando lo tenemos en poca estima, también esperamos recibir poco. Quienes escuchan como si se tratara de cosas insignificantes obran mal; y nosotros mismos obramos mal, pues no sabemos de dónde, por quién ni a qué lugar fuimos llamados, ni cuánto padeció Jesucristo por nosotros.


    Entonces, ¿qué recompensa le daremos? ¿O qué fruto digno de lo que él nos dio? ¡Cuántos deberes piadosos le debemos!


    Porque nos concedió la luz; nos habló como un padre a sus hijos; nos salvó cuando perecíamos.


    Entonces, ¿qué alabanza le daremos? ¿O qué retribución por las cosas que recibimos?


    Teníamos la mente incapacitada y adorábamos maderos, piedras, oro, plata y bronce, obras humanas; y toda nuestra vida no era otra cosa que muerte. Mientras estábamos así envueltos en tinieblas y oprimidos por esta densa niebla en nuestra visión, recobramos la vista al despojarnos, por voluntad de él, de la nube que nos envolvía.


    Porque tuvo misericordia de nosotros y, en su compasión, nos salvó, al ver en nosotros mucho extravío y perdición, aun cuando no teníamos esperanza de salvación fuera de la que procedía de él.


    Porque nos llamó cuando no existíamos y quiso que, de no existir, llegáramos a existir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Cuando no existíamos» conserva una expresión que puede entenderse en relación con la condición previa de los llamados y que también evoca el paso del no-ser al ser; el texto no precisa una sola interpretación.
    reason: Mantiene la ambigüedad de ἐκ μὴ ὄντος εἶναι sin resolverla como una afirmación exclusivamente creacional o comunitaria.
lexical_decisions:
- source_word: φρονεῖν ... ὡς περὶ θεοῦ
  choice: pensar acerca de Jesucristo como acerca de Dios
  rationale: Conserva la afirmación comparativa directa del inicio sin rebajarla ni convertirla en una fórmula doctrinal más desarrollada.
- source_word: μικρὰ φρονεῖν
  choice: pensar con poca estima
  rationale: Reproduce la idea de valorar o considerar como pequeño, evitando que «pensar poco» se entienda solo como pensar con poca frecuencia.
- source_word: ὅσια
  choice: obligaciones sagradas
  rationale: El término puede referirse a lo santo o a deberes religiosos; esta opción encaja con el verbo «debemos» del contexto y evita seguir sin explicación la lectura inglesa «misericordias».
- source_word: ξύλα
  choice: maderos
  rationale: En el contexto de objetos de culto, «maderos» comunica piezas o ídolos de madera mejor que el colectivo «madera».
- source_word: πηροὶ τῇ διανοίᾳ
  choice: Teníamos mutilado el entendimiento
  rationale: Mantiene la fuerte imagen de incapacidad o mutilación mental del texto, sin suavizarla a mera ignorancia.
- source_word: σπλαγχνισθείς
  choice: movido a compasión
  rationale: Expresa una compasión profunda que impulsa a actuar, en español natural y digno.
- source_word: ἐκ μὴ ὄντος εἶναι
  choice: de no existir, llegáramos a existir
  rationale: Preserva el juego entre no ser y ser sin decidir por sí solo si se refiere a creación, conversión o constitución como pueblo.
theological_decisions:
- issue: Identificación de Jesucristo con Dios y con el Juez
  choice: «como acerca de Dios, como acerca del Juez de vivos y muertos»
  alternative: «como Dios y Juez de vivos y muertos»
  rationale: La forma elegida conserva la repetición y la construcción comparativa del texto, afirmando su fuerza sin eliminar su forma retórica.
- issue: Referente de «cuando no existíamos»
  choice: Mantener literalmente el lenguaje de no existir y añadir una nota de ambigüedad
  alternative: Interpretarlo en el cuerpo como «cuando aún no éramos su pueblo» o como una afirmación explícita sobre la creación
  rationale: El contexto permite una lectura espiritual o corporativa, mientras que la formulación también evoca el paso del no ser al ser; no corresponde resolver esa tensión en la traducción.
- issue: Agencia al recobrar la vista
  choice: «por voluntad de él, nos quitamos la nube»
  alternative: «por voluntad de él, fue quitada la nube»
  rationale: Conserva conjuntamente la voluntad divina y la participación humana expresadas en la construcción del pasaje, sin convertirlas en opciones excluyentes.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las preguntas retóricas, las imágenes intensas y la repetición argumentativa. Se evitó lenguaje eclesiástico innecesariamente técnico. Aunque el expediente suministrado identifica la tradición manuscrita griega, también indica que la revisión directa de la fuente está pendiente; por ello, las decisiones se contrastaron con la formulación griega tradicionalmente atestiguada del capítulo y deben verificarse en la auditoría textual final.
