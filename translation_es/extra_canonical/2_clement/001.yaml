revisions:
- from: 'Hermanos, debemos pensar acerca de Jesucristo como acerca de Dios, como acerca del Juez de vivos y muertos.


    No debemos pensar con poca estima acerca de nuestra salvación, porque, cuando pensamos con poca estima acerca de él, también esperamos recibir poco. Los que escuchan como si se tratara de cosas insignificantes pecan; y nosotros también pecamos al no reconocer de dónde fuimos llamados, quién nos llamó, a qué lugar fuimos llamados y cuánto soportó padecer Jesucristo por nosotros.


    Entonces, ¿qué recompensa le daremos? ¿O qué fruto ofreceremos que sea digno de lo que él nos dio? ¡Cuántas obligaciones sagradas tenemos para con él!


    Él nos concedió la luz; nos habló como un padre a sus hijos; cuando perecíamos, nos salvó.


    Entonces, ¿qué alabanza le daremos? ¿O con qué recompensa le pagaremos por lo que recibimos?


    Teníamos mutilado el entendimiento y adorábamos piedras, maderos, oro, plata y bronce, obras de manos humanas; toda nuestra vida no era otra cosa que muerte. Estábamos envueltos en oscuridad y teníamos la vista cubierta por una niebla tan espesa, pero recobramos la vista cuando, por voluntad de él, nos quitamos la nube que nos envolvía.


    Él tuvo misericordia de nosotros y, movido a compasión, nos salvó. Vio que había en nosotros mucho extravío y perdición, y que no teníamos ninguna esperanza de salvación fuera de la que procedía de él.


    Porque nos llamó cuando no existíamos y quiso que, de no existir, llegáramos a existir.[a]'
