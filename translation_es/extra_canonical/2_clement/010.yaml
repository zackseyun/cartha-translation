base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: es
  text: 'Por lo tanto, hermanos míos, hagamos la voluntad del Padre que nos llamó, para que vivamos. Busquemos ante todo la virtud, abandonemos el vicio, que va delante de nuestros pecados, y huyamos de la impiedad, para que no nos alcancen los males.


    Porque, si nos esforzamos por hacer el bien, la paz nos seguirá.


    Por esta razón, una persona no puede alcanzar la felicidad[a]: hay quienes nos infunden temores humanos y prefieren el disfrute presente a la promesa futura.


    No saben cuán grande es el tormento que trae el disfrute presente ni qué deleite trae la promesa futura.


    Si fueran ellos solos quienes hicieran estas cosas, sería tolerable. Pero ahora persisten en enseñar el mal a personas inocentes, sin saber que recibirán una condena doble: tanto ellos como quienes los escuchan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «alcanzar la felicidad» representa palabras suplidas en el testimonio inglés consultado; el sentido exacto del pasaje es incierto y requiere revisión directa del griego.
    reason: El testimonio marca esta expresión como adición editorial y la información proporcionada indica que aún está pendiente la revisión de la lengua fuente.
lexical_decisions:
- source_word: 'virtue (Greek witness: ἀρετή, source-language review pending)'
  choice: virtud
  rationale: Conserva el contraste moral con «vicio» y es natural en español actual.
- source_word: 'vice (Greek witness: κακία, source-language review pending)'
  choice: vicio
  rationale: Expresa la maldad como disposición o conducta y mantiene el paralelismo con «virtud».
- source_word: 'ungodliness (Greek witness: ἀσέβεια, source-language review pending)'
  choice: impiedad
  rationale: Es el equivalente tradicional y amplio para la falta de reverencia hacia Dios, sin añadir una definición confesional.
- source_word: enjoyment
  choice: disfrute
  rationale: Mantiene la oposición entre el placer inmediato y la promesa futura sin intensificarlo indebidamente.
- source_word: innocent souls
  choice: personas inocentes
  rationale: Comunica naturalmente el referente humano de «almas» en español moderno, evitando que se entienda como una afirmación antropológica técnica.
theological_decisions:
- issue: Relación entre hacer la voluntad del Padre y vivir
  choice: «hagamos la voluntad del Padre que nos llamó, para que vivamos»
  alternative: «para que obtengamos la vida»
  rationale: Se conserva la formulación final del testimonio sin definir si «vivir» se refiere principalmente a la vida presente, moral o futura.
- issue: La paz como quien persigue al que hace el bien
  choice: «la paz nos seguirá»
  alternative: «alcanzaremos la paz»
  rationale: 'Mantiene la personificación y la inversión deliberada: quienes buscan hacer el bien son seguidos por la paz.'
- issue: Condena doble de maestros y oyentes
  choice: '«recibirán una condena doble: tanto ellos como quienes los escuchan»'
  alternative: «ellos y sus oyentes serán condenados dos veces»
  rationale: Conserva la tensión del texto sin explicar de manera especulativa en qué consiste exactamente lo doble.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «hermanos míos» por fidelidad al vocativo antiguo; puede entenderse de manera inclusiva en el contexto comunitario. Dado que la revisión directa del griego está pendiente, esta versión es provisional y evita resolver silenciosamente la dificultad textual del tercer párrafo.
