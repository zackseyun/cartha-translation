review_pass:
  verdict: revise
  source_fidelity: La traducción transmite fielmente el argumento y conserva la alternancia del autor entre referencias personales y neutras. Conviene ajustar la segunda cita para reflejar el doble imperativo («prorrumpe y grita») y conservar más de cerca el orden de la exhortación sobre no cansarse de ofrecer oraciones. La oración final también se beneficia de una construcción que vincule inequívocamente «venir y llamarnos» con la salvación de muchos.
  naturalness: El español es claro, actual y de registro digno. «Prorrumpe en gritos» es válido, pero «Prorrumpe y grita» reproduce mejor los dos verbos de la cita y resulta natural en una cita de estilo elevado. «Cuando vino y nos llamó» puede entenderse como modificador temporal de «salvó»; «al venir y llamarnos» elimina esa leve ambigüedad.
  terminology: «Estéril», «iglesia», «con sencillez», «afianzar» y «perecer» son elecciones adecuadas. Se conserva «marido» dentro de la formulación bíblica citada, sin necesidad de actualizarla a un término menos literal.
  issues:
  - severity: low
    issue: La segunda mención de la cita reduce el doble imperativo a «Grita».
    rationale: El testimonio base dice «Break out and cry» y la primera cita ya refleja ambos elementos. «Prorrumpe y grita» los conserva sin añadir interpretación.
  - severity: low
    issue: La exhortación sobre la oración invierte el orden y debilita levemente la conexión verbal del original.
    rationale: El sentido está presente, pero «No nos cansemos, como mujeres de parto, de ofrecer con sencillez nuestras oraciones a Dios» sigue más estrechamente la secuencia del testimonio.
  - severity: low
    issue: La sintaxis de la última frase puede hacer menos explícita la relación entre la venida, el llamamiento y la salvación.
    rationale: «Al venir y llamarnos» expresa de modo directo el participio instrumental/circunstancial del testimonio.
  revised_text: '“Alégrate, estéril, tú que no das a luz; prorrumpe y grita, tú que no sufres dolores de parto, porque los hijos de la abandonada son más numerosos que los de la que tiene marido”.[a] Al decir: “Alégrate, estéril, tú que no das a luz”, se refería a nosotros, pues nuestra iglesia era estéril antes de que le fueran dados hijos.


    Y al decir: “Prorrumpe y grita, tú que no sufres dolores de parto”, quiere decir esto: no nos cansemos, como mujeres de parto, de ofrecer con sencillez nuestras oraciones a Dios.


    Además, al decir: “Los hijos de la abandonada son más numerosos que los de la que tiene marido”, habló así porque nuestro pueblo parecía estar desolado y abandonado por Dios. Pero ahora, después de haber creído, hemos llegado a ser más numerosos que aquellos que parecían tener a Dios.


    También otra Escritura dice: “No vine a llamar a justos, sino a pecadores”.[b]


    Esto quiere decir que es justo salvar a los que perecen.


    Porque esta es, en verdad, una obra grande y admirable: afianzar no lo que se mantiene en pie, sino lo que está cayendo.


    Así también Cristo quiso salvar lo que perecía. Y salvó a muchos al venir y llamarnos, cuando ya perecíamos.'
