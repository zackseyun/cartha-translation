base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: es
  text: '“Alégrate, estéril, tú que no das a luz; prorrumpe en gritos, tú que no sufres dolores de parto, porque los hijos de la abandonada son más numerosos que los de la que tiene marido”.[a] Al decir: “Alégrate, estéril, tú que no das a luz”, se refería a nosotros, pues nuestra iglesia era estéril antes de que le fueran dados hijos.


    Y al decir: “Grita, tú que no sufres dolores de parto”, quiere decir esto: presentemos con sencillez nuestras oraciones a Dios; no nos cansemos como las que sufren dolores de parto.


    Además, al decir: “Los hijos de la abandonada son más numerosos que los de la que tiene marido”, habló así porque nuestro pueblo parecía estar desolado y abandonado por Dios. Pero ahora, después de haber creído, hemos llegado a ser más numerosos que aquellos que parecían tener a Dios.


    También otra Escritura dice: “No vine a llamar a justos, sino a pecadores”.[b]


    Esto quiere decir que es justo salvar a los que perecen.


    Porque esta es, en verdad, una obra grande y admirable: afianzar no lo que se mantiene en pie, sino lo que está cayendo.


    Así también Cristo quiso salvar lo que perecía. Y salvó a muchos cuando vino y nos llamó, mientras ya estábamos pereciendo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cita de Isaías 54:1; compárese Gálatas 4:27. La forma citada sigue la antigua versión griega del pasaje.
    reason: Identifica la Escritura citada y explica por qué su formulación puede diferir de traducciones hechas directamente del hebreo.
  - marker: b
    text: La frase aparece en Mateo 9:13, Marcos 2:17 y Lucas 5:32, con pequeñas diferencias entre los relatos y sus tradiciones textuales.
    reason: Identifica la tradición evangélica sin afirmar un único Evangelio como fuente directa de la cita.
lexical_decisions:
- source_word: στεῖρα
  choice: estéril
  rationale: Conserva la imagen bíblica de la mujer incapaz de dar a luz y enlaza naturalmente con la explicación posterior acerca de la iglesia.
- source_word: ἐκκλησία
  choice: iglesia
  rationale: Es el equivalente natural y tradicional para la comunidad reunida; aquí se refiere a la comunidad del autor, por lo que se mantiene “nuestra iglesia”.
- source_word: ἁπλῶς
  choice: con sencillez
  rationale: Mantiene el sentido de sinceridad o falta de doblez sin precisar indebidamente una interpretación técnica.
- source_word: ἀναφέρωμεν
  choice: presentemos
  rationale: Expresa el movimiento de elevar u ofrecer las oraciones a Dios en español natural y digno.
- source_word: τὰ ἀπολλύμενα
  choice: lo que perecía
  rationale: 'Conserva el giro neutro y general del argumento, mientras que la frase anterior aplica la idea explícitamente a personas: “los que perecen”.'
- source_word: στηρίζειν
  choice: afianzar
  rationale: Comunica la acción de sostener, fortalecer o volver firme aquello que está cayendo.
theological_decisions:
- issue: Identidad de la mujer estéril y abandonada
  choice: 'Se conserva la interpretación explícita del autor: “se refería a nosotros” y “nuestra iglesia”.'
  alternative: Identificarla de manera más precisa con una entidad histórica o teológica determinada.
  rationale: El pasaje aplica la profecía a su propia comunidad, pero no ofrece aquí una identificación más técnica; añadirla importaría una conclusión ajena al texto.
- issue: “Los que parecían tener a Dios”
  choice: Se mantiene “parecían tener a Dios”.
  alternative: Explicitar que se refiere a Israel, al pueblo judío o a otra comunidad concreta.
  rationale: El referente puede inferirse en el contexto antiguo, pero este fragmento no lo nombra; conservar la formulación evita resolver una tensión polémica de manera denominacional.
- issue: Salvar lo que perece
  choice: Se conserva la alternancia entre personas (“los que perecen”) y formulación neutra (“lo que perecía”).
  alternative: Uniformar todas las expresiones como referencias personales.
  rationale: La variación refleja la forma del argumento y evita estrechar el alcance de las expresiones generales.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la metáfora del parto, la personificación de la iglesia y las repeticiones argumentativas. “Prorrumpe en gritos” mantiene el tono elevado de la cita bíblica, mientras el comentario explicativo usa sintaxis más directa. Dado que el expediente indica que la revisión directa de la tradición manuscrita griega está pendiente, el borrador se apoya en la evidencia griega conocida del pasaje y consulta el testimonio inglés suministrado, sin tratarlo como base opaca.
