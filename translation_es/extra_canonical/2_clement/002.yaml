review_pass:
  verdict: revise
  source_fidelity: El borrador transmite fielmente la secuencia argumentativa del testimonio inglés y conserva correctamente la alternancia entre «los que perecen» y el neutro «lo que perecía». La cita de Isaías y la aplicación eclesial están bien preservadas. Se requiere un ajuste sintáctico en la explicación de «Grita», para que «como las mujeres que están de parto» califique claramente el cansarse y no la mera presentación de las oraciones; también conviene hacer más transparente la relación de «vino y nos llamó» con la salvación de muchos.
  naturalness: El español es mayormente natural, actual y de registro digno. «Prorrumpe en gritos» es aceptable en la cita elevada. La reformulación de la segunda explicación y del cierre mejora la fluidez y evita una lectura equívoca.
  terminology: «Estéril», «iglesia», «con sencillez», «perecen» y «afianzar» son elecciones defendibles y no imponen una interpretación doctrinal. «Afianzar» conserva adecuadamente la imagen de hacer firme frente a caer.
  issues:
  - severity: medium
    issue: Ambigüedad sintáctica en «presentemos con sencillez nuestras oraciones a Dios; no nos cansemos como las que sufren dolores de parto».
    rationale: El orden actual puede hacer que la comparación con mujeres en parto parezca desligada de «no nos cansemos». El testimonio dice que no debemos cansarnos, como mujeres de parto, de ofrecer las oraciones con sencillez a Dios.
  - severity: low
    issue: Relación algo imprecisa de «cuando vino y nos llamó» en la frase final.
    rationale: El original transmitido presenta a Cristo viniendo y llamándonos mientras ya perecíamos. «Pues vino y nos llamó cuando ya estábamos pereciendo» refleja esa relación de manera más directa.
  revised_text: '“Alégrate, estéril, tú que no das a luz; prorrumpe en gritos, tú que no sufres dolores de parto, porque los hijos de la abandonada son más numerosos que los de la que tiene marido”.[a] Al decir: “Alégrate, estéril, tú que no das a luz”, se refería a nosotros, pues nuestra iglesia era estéril antes de que le fueran dados hijos.


    Y al decir: “Grita, tú que no sufres dolores de parto”, quiere decir esto: no nos cansemos, como las mujeres que están de parto, de presentar con sencillez nuestras oraciones a Dios.


    Además, al decir: “Los hijos de la abandonada son más numerosos que los de la que tiene marido”, habló así porque nuestro pueblo parecía estar desolado y abandonado por Dios. Pero ahora, después de haber creído, hemos llegado a ser más numerosos que aquellos que parecían tener a Dios.


    También otra Escritura dice: “No vine a llamar a justos, sino a pecadores”.[b]


    Esto quiere decir que es justo salvar a los que perecen.


    Porque esta es, en verdad, una obra grande y admirable: afianzar no lo que se mantiene en pie, sino lo que está cayendo.


    Así también Cristo quiso salvar lo que perecía. Y salvó a muchos, pues vino y nos llamó cuando ya estábamos pereciendo.'
