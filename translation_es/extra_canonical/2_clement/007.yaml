    issue: «Por la pista recta, en el certamen imperecedero» desplaza la sintaxis e imagen del original.
    rationale: El testimonio distingue «el recorrido/carrera recta» y «el certamen imperecedero» como la prueba que debe correrse. «Corramos la carrera recta, el certamen imperecedero» preserva mejor la construcción y evita presentar el certamen solo como un entorno.
  - severity: low
    issue: «Reciben la corona» y «recibamos la corona» sustituyen el pasivo «son/seamos coronados».
    rationale: La formulación activa es inteligible, pero «ser coronados» conserva de modo más cercano la imagen y la voz del testimonio.
