  verdict: revise
  source_fidelity: 'El borrador conserva fielmente la exhortación atlética, el contraste entre lo perecedero y lo imperecedero, la sanción por fraude y la cita final. Conviene ajustar «corramos por la pista recta, en el certamen imperecedero»: el testimonio presenta «the straight course, the incorruptible contest» como el objeto de la carrera, no meramente como el lugar y el contexto en que se corre. También es preferible conservar el pasivo de «ser coronados».'
