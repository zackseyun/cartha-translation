  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: es
  text: 'Así pues, hermanos míos, luchemos, sabiendo que el certamen está cerca. Aunque muchos acuden a certámenes perecederos, no todos son coronados, sino solo los que se han esforzado mucho y han luchado con valentía.


    Luchemos, entonces, para que todos seamos coronados.


    Por tanto, corramos la carrera recta, el certamen imperecedero. Acudamos a él en gran número y luchemos, para que también nosotros seamos coronados. Y si no todos podemos ser coronados, al menos acerquémonos a la corona.


    Debemos saber que, si se descubre que quien participa en un certamen perecedero ha actuado fraudulentamente, primero lo azotan y después lo retiran y lo expulsan de la pista.


    ¿Qué les parece? ¿Qué se hará con quien haya actuado fraudulentamente en el certamen de la incorrupción?


    Pues acerca de quienes no han guardado el sello[a], dice:


    «Su gusano no morirá,


    y su fuego no se apagará,


    y serán un espectáculo para toda la humanidad».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto no explica aquí qué representa el «sello»; se conserva la imagen sin identificarla de manera explícita.
    reason: Evita imponer una interpretación sacramental o confesional determinada.
lexical_decisions:
- source_word: contest / Greek ἀγών (as reflected in the witness)
  choice: certamen
  rationale: Conserva la imagen de una competencia atlética y permite mantener de manera coherente la pista, el esfuerzo y la corona.
- source_word: contend / Greek ἀγωνίζομαι (as reflected in the witness)
  choice: luchar
  rationale: En español actual expresa esfuerzo intenso dentro de un certamen sin limitar la imagen a una carrera.
- source_word: corruptible / incorruption
  choice: perecedero / imperecedero; incorrupción en la pregunta retórica
  rationale: «Perecedero/imperecedero» resulta natural para contrastar los certámenes, mientras que «incorrupción» conserva en la pregunta la formulación conceptual y solemne del testimonio.
- source_word: dealing corruptly
  choice: actuar fraudulentamente
  rationale: Comunica con claridad una infracción deshonesta en el certamen sin especificar un método de engaño que el texto no identifica.
- source_word: seal
  choice: sello
  rationale: Mantiene sin interpretar una imagen técnica y teológicamente cargada del cristianismo antiguo.
- source_word: all flesh
  choice: todo ser humano
  rationale: Expresa el sentido colectivo del modismo de forma comprensible en español latinoamericano actual.
theological_decisions:
- issue: Identidad y significado del «sello»
  choice: Conservar «sello» sin identificarlo en el texto principal
  alternative: Interpretarlo explícitamente como bautismo, confesión o pertenencia a Cristo
  rationale: El pasaje no explica aquí la imagen; una identificación explícita resolvería una cuestión histórica y teológica que debe permanecer abierta.
- issue: Tensión entre «para que todos recibamos la corona» y «si no todos podemos recibirla»
  choice: Conservar ambas afirmaciones sin armonizarlas
  alternative: Reformular la segunda como una mera hipótesis o limitar el alcance de «todos»
  rationale: La tensión exhortativa está presente en el testimonio y no debe eliminarse mediante una explicación añadida.
- issue: Referente de «dice» en la cita final
  choice: Usar simplemente «dice»
  alternative: Especificar «Dios dice» o «la Escritura dice»
  rationale: El testimonio suministrado no obliga a escoger explícitamente entre esos referentes.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva de forma sostenida la metáfora atlética del certamen, la pista y la corona. El borrador se apoya en el testimonio inglés público suministrado; queda pendiente cotejar directamente cada decisión con la tradición manuscrita griega.
