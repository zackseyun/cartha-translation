  terminology: «Certamen», «luchar», «perecedero», «imperecedero», «sello» y «actuar fraudulentamente» son opciones defendibles y coherentes. Se mantiene «sello» sin identificarlo. «Toda la humanidad» expresa de forma natural el alcance colectivo de «all flesh», sin introducir una interpretación teológica adicional.
