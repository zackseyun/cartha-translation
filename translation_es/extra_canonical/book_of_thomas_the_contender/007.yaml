base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: es
  text: '«Dichosos ustedes que conocen de antemano lo que puede hacerlos tropezar y huyen de las cosas extrañas.


    Dichosos ustedes que son insultados y despreciados por el amor que su Señor les muestra.


    Dichosos ustedes que lloran y son perseguidos por quienes no tienen esperanza, porque serán liberados de todo cautiverio.


    »Velen y oren para que eviten vivir en la carne y, en cambio, salgan del amargo cautiverio de esta vida. Cuando oren, hallarán descanso, porque habrán abandonado el sufrimiento y la vergüenza. Pues, cuando se aparten de los sufrimientos y deseos del cuerpo, recibirán descanso del Bueno y reinarán con el Rey, unidos él y ustedes el uno con los otros, desde ahora y por los siglos de los siglos. Amén».


    El libro de Tomás


    El Contendiente


    Escrito para los maduros


    Acuérdense también de mí, hermanos míos,


    en sus oraciones:


    Paz a los santos


    y a los del espíritu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Blessed
  choice: Dichosos
  rationale: Expresa de manera natural el estado favorable proclamado por una bienaventuranza, sin reducirlo a una bendición ritual.
- source_word: what can trip you up
  choice: lo que puede hacerlos tropezar
  rationale: Conserva la metáfora del tropiezo y su posible sentido moral o espiritual.
- source_word: strange things
  choice: las cosas extrañas
  rationale: Mantiene la amplitud y ambigüedad del testimonio inglés provisional, sin precisar indebidamente si se trata de enseñanzas, prácticas o realidades ajenas.
- source_word: existing in the flesh
  choice: vivir en la carne
  rationale: Reproduce el lenguaje antropológico del pasaje de forma comprensible y evita interpretar «carne» simplemente como cuerpo físico.
- source_word: repose / rest
  choice: descanso
  rationale: Es una expresión natural y digna que conserva la noción de alivio y reposo escatológico.
- source_word: the Good One
  choice: el Bueno
  rationale: Mantiene el título sustantivado y su posible referencia divina sin identificarlo de forma más específica que el testimonio.
- source_word: The Contender
  choice: El Contendiente
  rationale: Conserva la función titular de quien lucha o disputa; evita «Atleta», que introduciría una imagen más específica.
- source_word: the Mature
  choice: los maduros
  rationale: Preserva la posible categoría espiritual del título sin sustituirla por «perfectos» o «iniciados».
theological_decisions:
- issue: Relación entre vida corporal y «carne»
  choice: «eviten vivir en la carne» y «sufrimientos y deseos del cuerpo»
  alternative: «eviten existir corporalmente»
  rationale: La redacción conserva la distinción del testimonio entre «carne» y padecimientos o apetitos corporales, sin imponer una doctrina sistemática acerca del cuerpo.
- issue: Unidad con el Rey
  choice: «unidos él y ustedes el uno con los otros»
  alternative: «hechos uno con él»
  rationale: Conserva la reciprocidad expresada por el testimonio y evita convertirla explícitamente en identidad ontológica.
- issue: Liberación de todo cautiverio
  choice: 'Futuro: «serán liberados»'
  alternative: 'Presente espiritual: «quedan libres»'
  rationale: Respeta la orientación futura de la promesa sin decidir si su cumplimiento es terrenal, espiritual o escatológico.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se conservan las repeticiones y el tono exhortativo de las bienaventuranzas. Este borrador es necesariamente provisional: se basa en el testimonio inglés de dominio público proporcionado, pues la revisión directa del copto sigue pendiente. Se omitieron del texto traducido los materiales modernos ajenos a la obra (FAQ, datos de contacto y aviso comercial). La nota del testimonio sobre un verbo con posible valor cognitivo no se incorporó, porque no se identifica con certeza su ubicación en este fragmento y ninguna llamada [a] puede asignarse responsablemente.'
