review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés provisional. Se mantienen las ambigüedades de «cosas extrañas», «carne», «el Bueno» y la unión recíproca con el Rey. Se precisan «no respetados», «apartarse» y «apetitos corporales» para reflejar mejor el texto de control. La revisión directa del copto aún está pendiente.
  naturalness: El español es claro, actual y de registro digno. Se corrige la puntuación de las comillas, que en el borrador invertía indebidamente una comilla de cierre antes de «Velen y oren», y se suaviza la construcción final de la unión mutua.
  terminology: «Dichosos», «carne», «descanso», «el Bueno», «el Rey», «el Contendiente» y «los maduros» son elecciones sostenibles en español latinoamericano neutral. «Apetitos corporales» conserva mejor la amplitud de bodily appetites que «deseos del cuerpo».
  issues:
  - severity: medium
    issue: Puntuación de comillas inconsistente
    rationale: El borrador abre comillas antes de la primera bienaventuranza, pero usa una comilla de cierre antes de «Velen y oren» sin haber cerrado el discurso. Esto genera un defecto estructural y confunde el alcance de la cita.
  - severity: low
    issue: «Despreciados» interpreta más que «not respected»
    rationale: «No respetados» reproduce de manera más directa la falta de respeto del testimonio, mientras que «despreciados» puede sugerir un rechazo más intenso.
  - severity: low
    issue: «Deseos del cuerpo» reduce «appetites»
    rationale: «Apetitos corporales» conserva la referencia a impulsos o apetencias sin limitarla a deseos en sentido amplio.
  - severity: low
    issue: Construcción de unión recíproca poco natural
    rationale: «Unidos él y ustedes el uno con los otros» presenta discordancia entre singular y plural. «Ustedes y él, unidos entre sí» expresa la mutualidad sin añadir una interpretación doctrinal.
  revised_text: '«Dichosos ustedes que conocen de antemano lo que puede hacerlos tropezar y huyen de las cosas extrañas.


    Dichosos ustedes que son insultados y no respetados por el amor que su Señor les muestra.


    Dichosos ustedes que lloran y son perseguidos por quienes no tienen esperanza, porque serán liberados de todo cautiverio.


    Velen y oren para que eviten vivir en la carne y, en cambio, se aparten del amargo cautiverio de esta vida. Cuando oren, hallarán descanso, porque habrán abandonado el sufrimiento y la vergüenza. Pues cuando se aparten de los sufrimientos y apetitos corporales, recibirán descanso del Bueno y reinarán con el Rey, ustedes y él unidos entre sí, desde ahora y por los siglos de los siglos. Amén».


