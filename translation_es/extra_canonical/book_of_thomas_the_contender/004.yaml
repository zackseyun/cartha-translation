translation:
  language: es
  text: 'Entonces el Salvador continuó: «¡Oh insondable amor de la luz! ¡Oh amargura del fuego que arde en los cuerpos y la médula de los seres humanos, que día y noche se enciende en ellos, abrasa sus miembros y [hace] que sus mentes se embriaguen y sus almas enloquezcan! [. . .] a ellos, tanto en varones como en mujeres [. . .] noche, y hacen movimientos [. . .] en secreto y a la vista, porque los varones [hacen movimientos . . . sobre las mujeres], y las mujeres sobre [los varones]. [Por eso se] dijo: “Todos los que buscan la verdad mediante la verdadera sabiduría desarrollarán alas para volar; escaparán del deseo que abrasa los espíritus humanos y desarrollarán alas para escapar de cualquier espíritu [maligno] que vean”».[a]


    Tomás respondió: «Señor, esto es precisamente lo que te pregunto, porque he comprendido que, como dices, tú eres nuestro benefactor».


    El Salvador respondió de nuevo: «Por eso debemos hablarte, pues esta es la enseñanza para los maduros. Si ahora quieres llegar a ser maduro, cumplirás estas cosas. Si no, tu nombre es “Ignorante”, porque quien tiene entendimiento no puede convivir con un necio, ya que quien tiene entendimiento es maduro en toda sabiduría. En efecto, quien es sabio será alimentado por la verdad y “será como un árbol que crece junto a la corriente sinuosa” (Salmo 1:3).[b] Para el necio, en cambio, el bien y el mal son lo mismo. Aunque algunos poseen alas, corren, sin embargo, hacia las cosas visibles, alejadas de la verdad. Esto se debe a que el fuego que los guía crea para ellos una ilusión de verdad, [los] ilumina con una belleza [perecedera], los encierra en una dulce oscuridad y los hechiza con un deleite aromático.


    »Los cegará con un deseo inextinguible, abrasará sus almas y se convertirá para ellos en algo semejante a una estaca clavada en el corazón, que nunca podrán sacar. Los conduce adonde quiere, como un freno puesto en la boca. Con la amargura del cautiverio del deseo por las cosas visibles —que por impulso degeneran, cambian y se desvían— los ha atado con sus cadenas y ha encadenado cada uno de sus miembros. Continuamente son arrastrados hacia abajo. Cuando mueren, todos los animales del ámbito perecedero los devoran».


    Tomás respondió: «Está claro, tal como se ha dicho: [“Muchos son . . . los que no conocen] [. . .] alma”».[c]


    Y [el Salvador] respondió: «[Dichoso] el sabio que [buscó la verdad y], al encontrarla, [] reposó en ella para siempre y no tuvo miedo de quienes procuraban perturbarlo».[d]


    Tomás respondió: «Señor, ¿es bueno que reposemos entre las cosas que nos pertenecen?»


    El Salvador dijo: «Sí, es provechoso y bueno para ustedes, porque las cosas visibles entre los seres humanos desaparecerán. Su recipiente carnal desaparecerá y, cuando quede reducido a nada, llegará a existir entre las cosas visibles, entre las cosas que pueden verse. Entonces el fuego que ven les causará dolor debido a su anterior amor por la fe. Serán reunidos de nuevo con lo visible. Además, quienes pueden ver entre las cosas invisibles, por no poseer el amor más grande, perecerán a causa de su preocupación por esta vida y del ardor del fuego. Al cabo de poco tiempo, lo visible desaparecerá. Entonces surgirán sombras sin forma y, entre las tumbas, permanecerán para siempre sobre los cadáveres, sufriendo, mientras su alma se corrompe».[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito está dañado en varias partes de este párrafo. Los corchetes señalan palabras restituidas o inciertas, y los puntos suspensivos entre corchetes indican texto perdido. «Maligno» depende de una aclaración editorial del testimonio.
    reason: Advertir al lector sobre lagunas extensas y restauraciones que afectan el sentido.
  - marker: b
    text: Alusión a Salmo 1:3. La expresión «corriente sinuosa» sigue el testimonio suministrado; difiere de la formulación habitual del salmo, «corrientes de agua».
    reason: Identificar la cita y conservar la forma particular del escrito.
  - marker: c
    text: La cita de Tomás está tan fragmentada que no es posible reconstruir con seguridad su contenido ni su relación gramatical con «alma».
    reason: Evitar presentar una reconstrucción especulativa como texto seguro.
  - marker: d
    text: Esta oración contiene restauraciones y una laguna representada por corchetes vacíos. «Reposó» también puede comunicar la idea de hallar descanso o quedar establecido.
    reason: Señalar daño textual y una ambigüedad semántica relevante.
  - marker: e
    text: El párrafo final presenta varias construcciones difíciles, en especial «amor por la fe», «llegará a existir entre las cosas visibles» y «quienes pueden ver entre las cosas invisibles». La traducción es provisional hasta realizar una revisión directa del copto.
    reason: La base disponible es un testimonio inglés y la fuente copta aún no ha sido cotejada directamente.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Conserva el título cristológico del testimonio sin añadir una identificación no explícita en este pasaje.
- source_word: mature
  choice: maduros / llegar a ser maduro
  rationale: Mantiene la repetición conceptual y el sentido de plenitud o formación, sin sustituirlo por lenguaje iniciático más interpretativo.
- source_word: Ignoramus
  choice: Ignorante
  rationale: Reproduce como nombre o apelativo la oposición retórica entre entendimiento y necedad en español natural.
- source_word: lust
  choice: deseo
  rationale: Preserva un campo semántico más amplio que «lujuria», aunque el contexto corporal y sexual orienta su sentido; evita resolver de manera excesiva la ambigüedad.
- source_word: visible things
  choice: cosas visibles / lo visible
  rationale: Mantiene la categoría cosmológica recurrente y su contraste explícito con las cosas invisibles.
- source_word: fleshly vessel
  choice: recipiente carnal
  rationale: Conserva la metáfora del cuerpo como contenedor y el adjetivo corporal del testimonio.
- source_word: reposed
  choice: reposó
  rationale: Retiene la terminología de descanso o estabilidad espiritual y su posible carga técnica sin parafrasearla doctrinalmente.
- source_word: perishable realm
  choice: ámbito perecedero
  rationale: Expresa una esfera o dominio sujeto a corrupción sin introducir terminología cosmológica ajena al testimonio.
theological_decisions:
- issue: Valor moral del deseo y de lo visible
  choice: Se conserva la valoración negativa expresada por el discurso y su lenguaje cosmológico.
  alternative: Reformularla como una condena limitada exclusivamente a la conducta sexual inmoral.
  rationale: El pasaje vincula el deseo corporal con una crítica más amplia de las cosas visibles; restringirlo resolvería una tensión que el texto mantiene.
- issue: «Former love for the faith»
  choice: «anterior amor por la fe»
  alternative: Corregir o reinterpretar como «anterior amor por la carne» o «falta de fe».
  rationale: Aunque la frase resulta difícil en su contexto, el testimonio suministrado dice «faith»; se preserva la dificultad hasta una revisión directa del copto.
- issue: Destino después de la muerte
  choice: Se traducen literalmente las imágenes de ser devorados, las sombras, las tumbas y la corrupción del alma.
  alternative: Armonizarlas con una doctrina sistemática concreta del juicio, infierno o aniquilación.
  rationale: Las imágenes son propias del escrito y no deben ajustarse a una tradición confesional determinada.
- issue: Quiénes ven entre las cosas invisibles
  choice: 'Se conserva la construcción ambigua: «quienes pueden ver entre las cosas invisibles».'
  alternative: Identificarlos explícitamente como visionarios, seres espirituales o creyentes.
  rationale: El testimonio no permite determinar con seguridad el referente ni la sintaxis subyacente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones retóricas, las imágenes abruptas y la terminología cosmológica del testimonio. Los corchetes y las lagunas se mantuvieron para distinguir el texto conservado de las restauraciones editoriales. Borrador provisional basado en el testimonio inglés de dominio público; requiere cotejo directo con el copto del Códice de Nag Hammadi II,7.
