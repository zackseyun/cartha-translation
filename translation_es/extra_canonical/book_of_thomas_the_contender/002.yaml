base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: es
  text: 'El Salvador dijo: «Hermano Tomás, escúchame mientras aún te quede tiempo en el mundo, y te revelaré aquello que te has preguntado en tu interior.


    »Se ha dicho que eres mi gemelo y mi verdadero amigo. Por eso, examínate y descubre quién eres, de qué manera existes y cómo llegarás a ser. Puesto que serás llamado “mi hermano”, no conviene que te desconozcas a ti mismo. Sin embargo, sé que te has comprendido, porque ya comprendiste que yo soy el verdadero conocimiento. Así pues, aunque no comprendas, al estar de acuerdo conmigo[a], ya has alcanzado el conocimiento y serás llamado “el que se conoce a sí mismo”. Porque quien no se conoce a sí mismo nada sabe; pero quien se conoce a sí mismo, junto con ello, ya ha adquirido un conocimiento profundo de todo. Por consiguiente, hermano mío Tomás, has contemplado lo que está oculto a los seres humanos: aquello con lo que tropiezan por desconocerse a sí mismos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El sentido de la expresión traducida «al estar de acuerdo conmigo» es incierto en este punto; también podría entenderse como «al coincidir conmigo» o «al unirte a mí».
    reason: El testimonio inglés señala aquí una nota y la formulación admite más de una relación posible con el Salvador; la nota preserva esa incertidumbre sin fijar una lectura doctrinal.
lexical_decisions:
- source_word: heed me
  choice: escúchame
  rationale: Expresa atención obediente de manera natural y digna, sin endurecer el sentido como «obedéceme».
- source_word: mode in which you are
  choice: de qué manera existes
  rationale: Conserva la formulación ontológica poco común del testimonio y evita reducirla a estado emocional o conducta.
- source_word: true knowledge
  choice: el verdadero conocimiento
  rationale: Mantiene la posible identificación predicativa del Salvador con el conocimiento, sin interpretarla como mera posesión de información verdadera.
- source_word: self-knowledge
  choice: conocerse a sí mismo
  rationale: Es más idiomático en español latinoamericano que «autoconocimiento» dentro de estas oraciones y conserva el énfasis reflexivo.
- source_word: gazed on
  choice: has contemplado
  rationale: Retiene el matiz de percepción atenta o profunda, más fuerte que un simple «has visto».
theological_decisions:
- issue: La aparente tensión entre no comprender y haber alcanzado conocimiento
  choice: «aunque no comprendas... ya has alcanzado el conocimiento»
  alternative: Armonizar como «aunque todavía no lo comprendas plenamente»
  rationale: Se conserva la paradoja del testimonio en vez de resolverla mediante la adición interpretativa de «plenamente».
- issue: Identidad de Jesús con el conocimiento
  choice: «yo soy el verdadero conocimiento»
  alternative: «yo poseo el conocimiento verdadero»
  rationale: La lectura predicativa tiene peso teológico propio y no debe convertirse en una afirmación menos fuerte sobre posesión.
- issue: Alcance de «everything»
  choice: «un conocimiento profundo de todo»
  alternative: «un conocimiento profundo de todas las cosas»
  rationale: «De todo» reproduce el alcance universal y resulta natural, sin especificar indebidamente qué abarca.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron la repetición de «comprender/conocimiento», la tensión lógica del pasaje y su lenguaje introspectivo. Este borrador es necesariamente provisional porque solo se suministró un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente.
