  footnotes:
  - marker: a
    text: En este punto el manuscrito o su reconstrucción presenta una laguna o señal vacía; el sentido de la oración queda incompleto.
    reason: Explicar una señal textual anómala sin completarla por conjetura.
  - marker: b
    text: 'Tártaro: nombre antiguo de una región profundísima de castigo.'
    reason: Aclarar un término cultural poco conocido preservando su distinción respecto de Hades.
  - marker: c
    text: 'Hades: nombre del ámbito de los muertos; aquí aparece distinguido del Tártaro.'
    reason: Evitar que el lector lo identifique automáticamente con otro término escatológico.
  - marker: d
    text: 'Tartarucos: transliteración de un título o nombre poco claro, relacionado con el Tártaro; el texto lo llama «ángel».'
    reason: El término es raro y su significado exacto es incierto.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Conserva el título cristológico del testimonio sin añadir una identificación no expresada en este pasaje.
- source_word: deeds of decay
  choice: obras de corrupción
  rationale: Expresa deterioro moral y perecibilidad sin reducir la frase a una doctrina técnica.
- source_word: lust
  choice: pasión desenfrenada
  rationale: Evita limitar necesariamente el término al deseo sexual y conserva su sentido de apetito desordenado.
- source_word: Tartaros
  choice: Tártaro
  rationale: Usa la forma española establecida del nombre del lugar de castigo, manteniéndolo distinto de Hades.
- source_word: Hades
  choice: Hades
  rationale: Translitera el término y evita equipararlo silenciosamente con infierno, sepulcro o Tártaro.
- source_word: Tartarouchos
  choice: Tartarucos
  rationale: Transliteración española aproximada del título o nombre raro, cuya función exacta no debe resolverse por conjetura.
theological_decisions:
- issue: La relación entre el amor, el reino y el «dulce fuego»
  choice: «por su amor han perdido [el reino], el dulce fuego»
  alternative: «por amor al dulce fuego han perdido el reino»
  rationale: Se mantiene la sintaxis tensa y ambigua del testimonio, sin identificar con seguridad el objeto del amor ni la aposición.
- issue: Naturaleza del castigo descrito
  choice: Conservar literalmente las imágenes del abismo, el Tártaro, el Hades y el fuego
  alternative: Uniformarlas bajo el término «infierno»
  rationale: El pasaje emplea imágenes y nombres diferenciados; armonizarlos borraría su diversidad conceptual.
- issue: «Lo que siembra y lo sembrado»
  choice: Mantener ambos elementos como sujetos distintos
  alternative: Interpretarlos como sembrador y semilla, cuerpo y alma, o generación y descendencia
  rationale: El testimonio es enigmático y no justifica imponer una interpretación doctrinal específica.
- issue: «el día en que vivía en el cuerpo»
  choice: Conservar la formulación corporal del testimonio
  alternative: Reformularla como una declaración sistemática sobre alma y cuerpo
  rationale: La traducción preserva el lenguaje antropológico del escrito sin convertirlo en una doctrina más definida.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes y las elipsis para señalar restauraciones editoriales y lagunas del manuscrito. La traducción es provisional porque el material suministrado indica que aún está pendiente la revisión directa del copto; por ello se preservaron las construcciones oscuras en vez de suavizarlas mediante conjeturas.
