translation:
  language: es
  text: 'Tomás respondió: «¿Qué podemos decir después de estas cosas? ¿Qué podemos decirles a los ciegos? ¿Qué enseñanza debemos comunicar a estos pobres mortales que dicen: “Vinimos aquí para [hacer] el bien y no para maldecir”, y que, sin embargo, [dicen]: “Si no hubiéramos sido engendrados en la carne, jamás habríamos conocido [el pecado]”?»


    El Salvador dijo: «En verdad, respecto de [ellos], no los consideren seres humanos, sino [animales], porque así como los animales se devoran unos a otros, también esta clase de personas se devora entre sí. Es precisamente lo contrario: por su amor han perdido [el reino], el dulce fuego; se han hecho esclavos de la muerte y corren a realizar obras de corrupción. Practican la pasión desenfrenada de sus antepasados. Serán arrojados al abismo para sufrir el tormento del amargo mal de su naturaleza, pues serán azotados y obligados a correr hacia atrás, hacia donde no pueden ver; y [serán separados] de sus miembros, soportándolo no con valentía, sino [con] desesperación. Y se alegran porque […] locura e irracionalidad […] [Ellos] persiguen esta irracionalidad sin reconocer [su locura, creyendo] que [son] sabios. [Ellos…] su cuerpo […] [a] Su mente está orientada hacia sí misma, porque su pensamiento está absorbido por sus acciones; pero el fuego los abrasará».


    Tomás respondió: «Señor, ¿qué hará la persona arrojada entre ellos? Me preocupan mucho, pues son muchos los que los atacan».


    El Salvador contestó: «¿Qué piensas tú mismo?».


    Judas, llamado Tomás, dijo: «Señor, es justo que tú hables y que yo escuche».


    El Salvador respondió: «Presta atención a lo que voy a decirte y cree lo que es verdadero. Lo que siembra y lo sembrado desaparecerán en el fuego, en fuego y agua, y se cubrirán en tumbas oscuras. Después de mucho tiempo, manifestarán el fruto de árboles malos, siendo reprendidos y muertos en las bocas de animales y seres humanos, impulsados por las lluvias, los vientos, el aire y la luz que brilla desde lo alto».


    Tomás respondió: «Sin duda nos has convencido, Señor. Lo sabemos en nuestro corazón, y está claro que [así es] y que tu palabra basta. Sin embargo, estas palabras que nos dices son motivo de burla y repugnancia para el mundo, porque se interpretan mal. Entonces, ¿cómo podemos ir a predicarlas, si [no] somos respetados [en] el mundo?».


    El Salvador respondió: «En verdad les digo que cualquiera que oiga [la palabra de ustedes] y la rechace, se burle de ella o se ría de estas cosas, en verdad les digo que será entregado al gobernante de lo alto, quien reina sobre todo poder. Este lo hará girar en círculos y lo arrojará desde el cielo hasta el abismo, y quedará encerrado en un lugar estrecho y sombrío. Además, no podrá darse vuelta ni moverse debido a la enorme profundidad del Tártaro[b] y a la [pesada amargura] del Hades[c] inconmovible. […] a ellos hacia allí […] no perdonarán […] los perseguirán. Entregarán […] a […] el ángel Tartarucos[d] […] fuego que los persigue. […] látigos ardientes que arrojan una lluvia de chispas al rostro del perseguido.


    »Si corre hacia el oeste, se encontrará con el fuego.


    »Si corre hacia el sur, también allí se encontrará con él.


    »Si se vuelve hacia el norte, volverá a salirle al encuentro el peligro del fuego hirviente.


    »Tampoco podrá hallar un camino hacia el este para huir por allí y ser rescatado.


    »Porque no lo encontró el día en que vivía en el cuerpo, tampoco lo encontrará el día del juicio».'
