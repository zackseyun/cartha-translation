translation:
  language: es
  text: 'Tomás le dijo al Señor: «Te ruego, pues, que antes de tu ascensión respondas a lo que voy a preguntarte. Cuando te oiga hablar de las cosas ocultas, podré hablar de ellas [abiertamente].[a] Y tengo claro que es difícil practicar la verdad delante de los demás».


    El Salvador respondió: «Si las cosas visibles están ocultas para ustedes, ¿cómo podrán oír acerca de las invisibles? Si les resulta difícil hacer las obras de la verdad que son visibles en este mundo, ¿cómo harán, entonces, las que se relacionan con la Altura invisible y la Plenitud?[b] ¿Y cómo podrán ser llamados “obreros”? En esto todavía son discípulos y aún no han alcanzado la cumbre de la perfección».


    Tomás respondió y dijo al Salvador: «Explícanos las cosas que llamas invisibles, [pero que] permanecen ocultas para nosotros».


    El Salvador dijo: «[Todos] los cuerpos […] los animales son engendrados […] se manifiesta como […] también esto, los que están arriba […] las cosas visibles, pero [son] visibles […] en su propia raíz, y su fruto los sustenta.[c] Estos cuerpos visibles, en cambio, sobreviven comiendo animales semejantes a ellos, y por eso los cuerpos cambian. Lo que cambia se deteriorará y perecerá; desde ese momento pierde toda esperanza de vida, porque es un cuerpo animal. Por tanto, así como perecen los cuerpos de los animales, también perecerán estas formas [corporales]. Se originan de la unión sexual, como las de los animales, ¿no es así? Si también se originan de la unión sexual, ¿cómo engendrarán algo diferente de los animales? Por consiguiente, seguirán siendo niños hasta que alcancen la madurez».


    Tomás respondió: «Por eso te digo, Señor, que quienes hablan de cosas invisibles y difíciles de interpretar se parecen a los que de noche disparan flechas hacia un blanco. En efecto, disparan sus flechas como todos los demás, pues tiran hacia el blanco, aunque este no puede verse. Pero cuando surja la luz y cubra la oscuridad,[d] quedará de manifiesto la obra de cada uno. Oh Señor, luz nuestra, ilumínanos».


    Jesús dijo: «La naturaleza de la luz es luz».[e]


    Tomás dijo: «Señor, ¿por qué sale y se pone esta luz visible que brilla para los seres humanos?».


    El Salvador respondió: «Dichoso Tomás, esta luz visible brilla para ustedes no para que permanezcan aquí, sino para que puedan partir. Cuando todos los escogidos abandonen la condición animal,[f] esta luz ascenderá de nuevo a su propia esencia y saludará [a la luz],[g] porque es una buena sierva».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «[Abiertamente]» explicita una palabra que el testimonio presenta entre paréntesis; el sentido exacto de la frase es incierto.
    reason: Señalar una aclaración editorial sin incorporarla silenciosamente al texto.
  - marker: b
    text: «Altura» y «Plenitud» pueden ser términos técnicos de la cosmología del escrito; aquí se conservan sin definirlos.
    reason: Preservar el posible sentido especializado y evitar una interpretación denominacional.
  - marker: c
    text: El manuscrito está muy deteriorado en este tramo. Los corchetes indican restauraciones editoriales y las elipsis, texto perdido o ilegible. La secuencia de ideas no puede reconstruirse con seguridad.
    reason: Advertir que la aparente falta de continuidad procede del estado textual.
  - marker: d
    text: El testimonio dice literalmente que la luz «cubra» o «vele» la oscuridad, expresión poco usual que se ha conservado.
    reason: No corregir silenciosamente una imagen difícil a «disipe la oscuridad».
  - marker: e
    text: 'La formulación es deliberadamente enigmática y también puede entenderse: «La luz es luz por naturaleza».'
    reason: Conservar la ambigüedad de una expresión tautológica.
  - marker: f
    text: «Condición animal» traduce una expresión que también podría verterse «estado animal»; el texto no precisa si se refiere al cuerpo, a una manera de vivir o a ambos.
    reason: Mantener abierta una ambigüedad antropológica y teológica genuina.
  - marker: g
    text: El objeto de «saludará» no es seguro. «[A la luz]» sigue la reconstrucción del testimonio; también podría entenderse que la luz es recibida o acogida.
    reason: Hacer visible la incertidumbre sintáctica y textual.
lexical_decisions:
- source_word: Fullness
  choice: la Plenitud
  rationale: Conserva el posible valor técnico y cosmológico del término sin sustituirlo por una interpretación doctrinal más específica.
- source_word: workers
  choice: obreros
  rationale: Mantiene la metáfora ocupacional y su relación con «hacer las obras de la verdad».
- source_word: students
  choice: discípulos
  rationale: En este diálogo maestro-discípulo, «discípulos» es natural y conserva la idea de quienes todavía aprenden, aunque «estudiantes» sería una alternativa más literal.
- source_word: animal body / animal state
  choice: cuerpo animal / condición animal
  rationale: Preserva la repetición conceptual del testimonio y evita suavizar su antropología; «condición» expresa estado sin añadir una explicación doctrinal.
- source_word: intercourse
  choice: unión sexual
  rationale: Es claro, digno y actual; expresa el modo de generación indicado sin vulgaridad.
- source_word: essence
  choice: esencia
  rationale: Retiene el lenguaje metafísico del testimonio y no lo reduce a «origen» o «fuente».
- source_word: the nature of light is light
  choice: La naturaleza de la luz es luz
  rationale: Conserva la formulación enigmática y tautológica en vez de explicarla o corregirla.
theological_decisions:
- issue: Altura y Plenitud como lenguaje cosmológico
  choice: 'Usar mayúsculas: «la Altura invisible y la Plenitud»'
  alternative: «la altura invisible y la plenitud»
  rationale: Las mayúsculas señalan el posible carácter técnico de ambos conceptos, pero la traducción no define su sistema teológico.
- issue: Destino de los cuerpos y las formas corporales
  choice: Mantener la afirmación fuerte de que se deterioran y perecen
  alternative: Parafrasearla como simple mortalidad física
  rationale: El pasaje contrapone de forma deliberada lo animal, lo visible y la esperanza de vida; suavizarlo resolvería una tensión propia del texto.
- issue: Abandono de la condición animal
  choice: Traducir sin identificarlo con una doctrina específica de salvación, ascetismo o muerte
  alternative: Interpretarlo como abandonar el cuerpo, los deseos o el mundo
  rationale: El testimonio es ambiguo y no permite elegir con seguridad entre esas lecturas.
- issue: La luz que vuelve a su esencia y saluda
  choice: Conservar la personificación y suplir «[a la luz]» solo como restauración explícita
  alternative: Reescribirlo como una reunión de la luz con su fuente divina
  rationale: La sintaxis y el referente son inciertos; una paráfrasis teológica impondría una cosmología más definida que la evidencia suministrada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron repeticiones, preguntas retóricas, lenguaje cosmológico y formulaciones difíciles. Los corchetes y las elipsis reproducen señales de restauración o daño textual. Dado que la revisión directa del copto sigue pendiente y la base suministrada es un testimonio inglés de dominio público, el borrador debe considerarse provisional.
