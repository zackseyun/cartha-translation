review_pass:
  verdict: revise
  source_fidelity: La versión sigue fielmente el testimonio inglés suministrado, pero algunos signos editoriales del testimonio (paréntesis y corchetes vacíos) se modificaron y una referencia singular incierta se convirtió en plural. La revisión los conserva explícitamente.
  naturalness: El español es en general natural, moderno y de registro digno. Se ajustan algunas construcciones para mantener la sintaxis deliberadamente difícil sin introducir afirmaciones adicionales.
  terminology: «Altura», «Plenitud», «cuerpo animal», «condición animal» y «esencia» conservan apropiadamente el léxico cosmológico y antropológico sin imponer una lectura doctrinal.
  issues:
  - severity: medium
    issue: Se alteraron señales editoriales del testimonio dañado.
    rationale: El testimonio tiene paréntesis en «(openly)», «(bodily)» y «(back)/(the light)», además de corchetes vacíos en «visible []». El borrador sustituyó varios por corchetes, eliminó los corchetes vacíos y convirtió «(back)» en una afirmación no marcada («de nuevo»). Deben preservarse para no presentar como seguro lo que el testimonio marca como suplementario o incierto.
  - severity: medium
    issue: La pregunta sobre lo originado por unión sexual cambió una referencia singular ambigua a plural.
    rationale: El testimonio dice «If it also originates ... how will it beget...?»; «se originan ... engendrarán» atribuye sin necesidad un antecedente plural definido. «Si esto también procede... ¿cómo engendrará...?», aunque áspero, conserva la ambigüedad.
  - severity: low
    issue: La primera declaración de Tomás reordenaba levemente la dependencia temporal.
    rationale: La formulación revisada conserva de modo más cercano «cuando oiga... entonces podré hablar (abiertamente)», sin resolver el alcance de la condición.
  revised_text: 'Tomás le dijo al Señor: «Te ruego, pues, que respondas lo que te pregunto antes de tu ascensión, y que, cuando te oiga hablar de cosas ocultas, entonces pueda hablar de ellas (abiertamente).[a] Y me queda claro que es difícil practicar la verdad delante de los demás».


    El Salvador respondió: «Si las cosas visibles les están ocultas, ¿cómo podrán oír acerca de las invisibles? Si les resulta difícil hacer las obras de la verdad que son visibles en este mundo, ¿cómo, en realidad, harán las que se relacionan con la Altura invisible y la Plenitud?[b] ¿Y cómo serán llamados “obreros”? En esto son discípulos y todavía no han alcanzado la cumbre de la perfección».


    Tomás respondió y dijo al Salvador: «Explícanos acerca de las cosas que llamas invisibles, [pero que] nos están ocultas».


    El Salvador dijo: «[Todos] los cuerpos […] los animales son engendrados […] se manifiesta como […] también esto, los que están arriba […] cosas visibles, pero [son] visibles [] en su propia raíz, y su fruto los sustenta.[c] Estos cuerpos visibles, en cambio, sobreviven comiendo animales semejantes a ellos, con el resultado de que los cuerpos cambian. Lo que cambia se deteriorará y perecerá, y a partir de entonces perderá toda esperanza de vida, pues es un cuerpo animal. Por tanto, así como perecen los cuerpos de los animales, también perecerán estas formas (corporales). Se originan de la unión sexual, como las de los animales, ¿no es así? Si esto también procede de la unión sexual, ¿cómo engendrará algo diferente de los animales? Por consiguiente, seguirán siendo niños hasta que alcancen la madurez».


    Tomás respondió: «Por eso te digo, Señor, que quienes hablan de cosas invisibles y de cosas difíciles de interpretar se parecen a quienes, de noche, disparan flechas a un blanco. Ciertamente disparan sus flechas como todos los demás que lo hacen, dado que disparan al blanco, pero este no puede verse. Sin embargo, cuando surja la luz y vele la oscuridad,[d] entonces se manifestará la obra de cada uno. Oh Señor, luz nuestra, ilumínanos».


