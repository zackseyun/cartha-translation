translation:
  language: es
  text: 'Entonces el Salvador continuó: «¡Ay de ustedes, los impíos, los que no tienen esperanza y esperan lo que no llegará a suceder! ¡Ay de ustedes, cuya esperanza está puesta en la carne, en la prisión destinada a perecer! ¿Hasta cuándo seguirán olvidados? ¿Y hasta cuándo supondrán que también perecerán las cosas imperecederas? Su esperanza está puesta en el mundo; ¡su dios es esta vida! ¡Ustedes mismos se están destruyendo!


    »¡Ay de ustedes por el fuego que los abrasa por dentro, porque no puede apagarse! ¡Ay de ustedes por la rueda que gira dentro de sus mentes! ¡Ay de ustedes, atrapados por el ardor que habita en su interior, porque consumirá visiblemente su carne, desgarrará invisiblemente sus almas y los preparará para reunirse con sus amigos! ¡Ay de ustedes, prisioneros, porque están encadenados en cuevas!


    »¡Ustedes se burlan y sonríen con una risa demente! No son conscientes de su condenación, no reflexionan sobre su estado y [no] han comprendido que viven en tinieblas y [muerte]. Al contrario, están embriagados de fuego y [llenos] de amargura. Su mente ha enloquecido por el [ardor que hay dentro de] ustedes, ¡y el veneno y los ataques de sus enemigos les resultan dulces! Las tinieblas surgieron para ustedes como si fueran luz, porque entregaron su libertad a cambio de esclavitud. Ennegrecieron sus corazones, abandonaron sus pensamientos a la necedad y llenaron sus pensamientos con el humo ardiente que hay dentro de ustedes. Su luz [quedó oscurecida] en la nube [de…], y las ropas que los cubren, ustedes […]. Y [ustedes] fueron capturados por una [esperanza] vacía. ¿Y en quién creyeron? ¿[No comprenden que] todos [ustedes] viven entre aquellos que […] a ustedes como si [ustedes…]?


    »[…] ¡Se sumergieron en el agua de las tinieblas! ¡Actuaron conforme a sus propios impulsos! ¡Ay de ustedes, que viven en el error y desatienden la luz del sol que juzga al mundo y lo contempla desde lo alto, y que rodeará todas las cosas para someter a los enemigos! Tampoco perciben la luna, que de noche y de día contempla desde lo alto los cadáveres producidos por sus matanzas.


    »¡Ay de ustedes, que aman estar cerca de mujeres y [aman] tener relaciones impuras con ellas! ¡Ay de ustedes, atrapados por las fuerzas de su cuerpo, porque ellas los atormentarán! ¡Ay de ustedes, atrapados por las fuerzas de demonios malignos! ¡Ay de ustedes, que atraen sus miembros con fuego![a]


    »¿Quién enviará sobre ustedes una lluvia de rocío refrescante para apagar la nube de fuego que los envuelve junto con su ardor? ¿Quién hará que el sol brille sobre ustedes para disipar las tinieblas de su interior y ocultar las tinieblas y el agua impura? El sol y la luna, junto con el aire, el viento, la tierra y el agua, les concederán una fragancia agradable. Porque, si el sol no brilla sobre estos cuerpos, se marchitarán y perecerán como la maleza y la hierba. Si el sol brilla sobre ellos, se apoderan del terreno y ahogan la vid. Pero si la vid se impone, da sombra a toda la maleza y a los demás arbustos que crecen a su lado, [se extiende] y aumenta, ella sola tomará posesión de la tierra donde crece y dominará todo lugar que haya cubierto con su sombra. Cuando madure, dominará toda la tierra y producirá fruto en abundancia para su dueño. Así lo complacerá todavía más, pues él se habrá evitado el gran trabajo de arrancar esas plantas. En cambio, la vid misma se deshizo de ellas,
    incluso ahogándolas; y murieron y quedaron tan [muertas] como la tierra».


    Entonces Jesús continuó diciendo: «¡Ay de ustedes, porque no aceptaron la enseñanza! Y los que […] trabajarán en la predicación […]. Y [ustedes] corren hacia […] hará bajar [a ellos] […] de día ustedes los matan […] para que pudieran levantarse de entre los muertos».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «atraen sus miembros con fuego» es oscura en el testimonio disponible; también podría entenderse con matices como seducir, incitar o arrastrar los miembros.
    reason: Preserva una ambigüedad léxica real sin imponer una interpretación moral o fisiológica concreta.
  - marker: b
    text: El párrafo final está gravemente fragmentado. Los corchetes y puntos suspensivos señalan lagunas o restauraciones del texto; no es posible recuperar con seguridad la relación gramatical entre varias frases.
    reason: Advierte al lector que la sintaxis quebrada procede del estado del manuscrito y no de una redacción española defectuosa.
lexical_decisions:
- source_word: godless
  choice: impíos
  rationale: Expresa irreverencia u oposición a Dios en un registro bíblico digno y comprensible, sin restringir el sentido a un ateísmo moderno.
- source_word: flesh
  choice: carne
  rationale: Conserva la imagen antropológica y polémica del testimonio sin interpretarla simplemente como «cuerpo».
- source_word: imperishable things
  choice: cosas imperecederas
  rationale: Mantiene el contraste explícito entre lo perecedero y lo que no perece.
- source_word: scorching
  choice: ardor
  rationale: Reproduce la sensación abrasadora interna y evita la expresión poco natural «quemazón» en varias repeticiones.
- source_word: gloom
  choice: tinieblas
  rationale: Da continuidad al contraste con la luz y mantiene un registro religioso natural; el testimonio permite también «oscuridad profunda».
- source_word: bodily powers
  choice: fuerzas de su cuerpo
  rationale: Conserva la personificación ambigua de poderes ligados al cuerpo, sin reducirla a deseos o funciones corporales.
- source_word: lure your limbs with fire
  choice: atraen sus miembros con fuego
  rationale: Mantiene la extraña imagen del testimonio, cuya referencia exacta no es segura, en vez de resolverla mediante una paráfrasis doctrinal.
- source_word: grapevine
  choice: vid
  rationale: Es la equivalencia natural y tradicional para la planta cultivada, distinguiéndola de la maleza y los arbustos.
- source_word: rise from death
  choice: levantarse de entre los muertos
  rationale: Conserva la posible resonancia de resurrección sin imponer una explicación sobre el pasaje fragmentario.
theological_decisions:
- issue: La esperanza puesta en la carne como prisión
  choice: «la carne, en la prisión destinada a perecer»
  alternative: «la carne, es decir, la prisión destinada a perecer»
  rationale: No se añadió una identificación explicativa que el testimonio no marca inequívocamente; se conserva la tensión entre carne y prisión.
- issue: «Su dios es esta vida»
  choice: Se mantuvo la afirmación directa
  alternative: Parafrasear como «tratan esta vida como si fuera su dios»
  rationale: La formulación tajante pertenece a la denuncia del texto y no debe suavizarse ni convertirse en una explicación.
- issue: Sol y luna como agentes personificados
  choice: Se conservaron sus acciones de juzgar, contemplar y conceder fragancia
  alternative: Interpretarlos como símbolos explícitos de seres o realidades espirituales
  rationale: El testimonio personifica los cuerpos cósmicos, pero no justifica identificar doctrinalmente lo que representan.
- issue: Relaciones con mujeres
  choice: «aman estar cerca de mujeres y [aman] tener relaciones impuras con ellas»
  alternative: Generalizar como condena de toda sexualidad o suavizar como mera inmoralidad
  rationale: Se preserva la formulación ascética y polémica del testimonio sin ampliar su alcance ni validar una doctrina denominacional sobre matrimonio o sexualidad.
- issue: Levantarse de entre los muertos
  choice: Se retuvo dentro de la sintaxis dañada
  alternative: Reconstruir una declaración clara de resurrección o martirio
  rationale: El contexto puede sugerir resurrección, pero las lagunas impiden precisar sujetos, causalidad y secuencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se conservan la repetición profética de «¡Ay de ustedes!», las imágenes ásperas y la sintaxis fragmentaria donde el manuscrito está dañado. Borrador provisional basado en el testimonio público inglés suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,7. Los corchetes conservan restauraciones o incertidumbres y […] representa lagunas.
