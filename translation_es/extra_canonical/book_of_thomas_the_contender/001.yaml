base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: es
  text: '[] Dichos secretos que el Salvador comunicó a Judas Tomás, y que yo —sí, yo, Matías— puse por escrito mientras caminaba y los escuchaba hablar entre sí.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: secret sayings
  choice: Dichos secretos
  rationale: Conserva la forma sentenciosa y el carácter reservado expresados por el testimonio inglés.
- source_word: the Savior
  choice: el Salvador
  rationale: Equivalente tradicional, claro y teológicamente no restrictivo.
- source_word: spoke to
  choice: comunicó a
  rationale: Expresa que los dichos fueron dirigidos a Judas Tomás sin forzar si fueron pronunciados de una sola vez o en conversación.
- source_word: Judas Thomas
  choice: Judas Tomás
  rationale: Usa las formas españolas habituales de ambos nombres y conserva el nombre compuesto del testimonio.
- source_word: Mathaias
  choice: Matías
  rationale: Adopta la forma española reconocible del nombre transmitido como Mathaias.
- source_word: wrote down
  choice: puse por escrito
  rationale: Indica con naturalidad que el narrador registró los dichos.
- source_word: with one another
  choice: entre sí
  rationale: Mantiene la reciprocidad de la conversación sin identificar más de lo que permite el testimonio.
theological_decisions:
- issue: Identidad y título del hablante
  choice: el Salvador
  alternative: Jesús / el Señor
  rationale: El testimonio suministrado emplea el título «Savior» y no identifica aquí al hablante con otro título; se conserva esa formulación.
- issue: Énfasis autorreferencial del escriba
  choice: yo —sí, yo, Matías—
  alternative: yo, Matías
  rationale: Retiene el énfasis marcado de «I, yes I», que destaca la afirmación personal del narrador sin explicar su función.
- issue: Participantes de la conversación
  choice: los escuchaba hablar entre sí
  alternative: escuchaba al Salvador y a Judas Tomás conversar
  rationale: Se conserva la referencia pronominal del testimonio y no se resuelve explícitamente una identificación que debe confirmarse mediante revisión del copto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Traducción provisional basada en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto de Nag Hammadi Codex II,7. Los corchetes iniciales se conservan tal como aparecen en el testimonio, probablemente como señal editorial de una laguna o inicio dañado, sin añadir una nota no sustentada.
