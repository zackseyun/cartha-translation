translation:
  language: es
  text: '(1) De nuevo, después de muchos días, Jesús estaba jugando con otros niños en la azotea de una casa de dos pisos.[a] Pero uno de los niños cayó y murió. Cuando los demás niños vieron esto, entraron en sus casas y dejaron solo a Jesús.


    (2) Los padres del niño que había muerto llegaron y acusaron a Jesús:


    —¡Tú empujaste a nuestro hijo!


    Pero Jesús dijo:


    —Yo no lo empujé.


    (3) Ellos estaban furiosos y gritaban. Jesús bajó de la azotea, se puso junto al cuerpo y exclamó en voz alta:


    —Zenón, Zenón —pues así se llamaba—, levántate y di si yo te empujé.


    Él se levantó y dijo:


    —No, señor.[b]


    Al verlo, quedaron asombrados.


    Jesús volvió a decirle:


    —¡Duérmete![c]


    Entonces los padres del niño alabaron a Dios y adoraron al niño Jesús.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión arquitectónica también podría entenderse como «el techo de una habitación en el piso alto». La traducción es provisional mientras se revisa directamente la tradición manuscrita griega.
    reason: La base entregada es un testimonio inglés y la descripción exacta del lugar es incierta.
  - marker: b
    text: Aquí «señor» puede ser un tratamiento respetuoso; no necesariamente constituye un título divino.
    reason: Preserva la ambigüedad cristológica y pragmática del tratamiento.
  - marker: c
    text: El mandato conserva literalmente la imagen de dormir, usada aquí en estrecha relación con la muerte.
    reason: Evita convertir una metáfora deliberada en una explicación interpretativa.
  - marker: d
    text: También podría traducirse «se postraron ante el niño Jesús» o «le rindieron homenaje», según el verbo griego del testimonio que se adopte. La revisión directa de la tradición griega está pendiente.
    reason: La traducción suministrada usa «worshipped», pero sin el texto griego no puede determinarse con plena seguridad el matiz entre adoración y homenaje.
lexical_decisions:
- source_word: roof of an upstairs room
  choice: la azotea de una casa de dos pisos
  rationale: Expresa en español natural la idea arquitectónica del testimonio inglés sin reducirla simplemente a un techo inclinado; dado que falta la revisión directa del griego, la nota conserva la incertidumbre.
- source_word: Rise
  choice: levántate
  rationale: Es la equivalencia natural del mandato y permite tanto incorporarse como volver a la vida según el contexto, sin añadir una formulación doctrinal.
- source_word: sir
  choice: señor
  rationale: Conserva el tratamiento respetuoso del testimonio; se escribe con minúscula para no decidir que aquí funciona como título divino.
- source_word: Fall asleep
  choice: Duérmete
  rationale: Mantiene la metáfora del sueño y evita sustituirla interpretativamente por «muere».
- source_word: worshipped
  choice: adoraron
  rationale: Reproduce la afirmación fuerte del testimonio suministrado, sin rebajarla a «rindieron homenaje».
theological_decisions:
- issue: Sentido de «señor» en la respuesta de Zenón
  choice: «señor», con minúscula
  alternative: «Señor», como título cristológico
  rationale: El contexto admite un tratamiento respetuoso y la evidencia suministrada no permite imponer inequívocamente un título divino.
- issue: Mandato final dirigido al niño resucitado
  choice: Conservar «¡Duérmete!»
  alternative: Explicitar «¡Muere otra vez!»
  rationale: La metáfora preserva la tensión narrativa entre sueño y muerte y evita resolver algo que el texto expresa indirectamente.
- issue: Respuesta de los padres ante Jesús niño
  choice: «adoraron al niño Jesús»
  alternative: «se postraron ante el niño Jesús» o «le rindieron homenaje»
  rationale: El testimonio de consulta dice «worshipped»; la traducción mantiene su fuerza teológica, aunque se señala que la revisión del griego sigue pendiente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean diálogos con raya y oraciones claras para lectura pública. «Azotea», «furiosos» y «asombrados» son de uso amplio. El borrador es necesariamente provisional porque el material proporcionado identifica como pendiente la revisión directa de la fuente griega.
