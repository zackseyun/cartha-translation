translation:
  language: es
  text: '**16. Jesús sana a Santiago de la mordedura de una serpiente**


    (1) Santiago fue al bosque a atar haces de leña para que pudieran hacer pan. Jesús fue con él. Mientras recogían la leña, una serpiente temible mordió a Santiago en la mano.


    (2) Santiago quedó tendido, agonizando. El niño Jesús corrió hacia él y sopló sobre la mordedura. Al instante, la mordedura quedó sanada, la bestia murió y Santiago se salvó.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito Hagios Saba 259 no contiene los capítulos 17 y 18. Por eso, esos dos capítulos se basan en manuscritos griegos posteriores. La presente traducción del capítulo 16 se ha preparado a partir de un testimonio inglés de dominio público; queda pendiente la revisión directa del texto griego.
    reason: Informa con transparencia tanto la situación manuscrita indicada en el material fuente como la limitación de la base empleada para este borrador.
lexical_decisions:
- source_word: grove
  choice: bosque
  rationale: Expresa de manera natural el lugar arbolado indicado por el testimonio inglés, sin precisar una especie de árboles que la fuente disponible no identifica.
- source_word: tie up sticks
  choice: atar haces de leña
  rationale: Comunica que las ramas se recogían y agrupaban para usarlas como combustible, presumiblemente para preparar el pan.
- source_word: terrible snake
  choice: serpiente temible
  rationale: Conserva la fuerza descriptiva del testimonio sin convertir explícitamente la serpiente en «venenosa», dato que no se afirma de forma directa.
- source_word: sprawled out and dying
  choice: quedó tendido, agonizando
  rationale: Reproduce tanto la condición física de Santiago como la inminencia de su muerte en español natural.
- source_word: blew on the bite
  choice: sopló sobre la mordedura
  rationale: Mantiene la acción concreta y extraordinaria del relato sin añadir una fórmula, gesto o explicación teológica.
- source_word: the beast was destroyed
  choice: la bestia murió
  rationale: En este contexto, «la bestia» remite a la serpiente; «murió» expresa con claridad el resultado sin la rigidez poco natural de «fue destruida».
- source_word: was saved
  choice: se salvó
  rationale: Conserva la formulación amplia del testimonio, que en el contexto inmediato indica que Santiago fue librado de la muerte.
theological_decisions:
- issue: Modo de la curación realizada por Jesús
  choice: Narrar que Jesús sopló sobre la mordedura y que esta sanó de inmediato
  alternative: Explicar el soplo como un acto sacramental, mágico o como símbolo explícito del Espíritu
  rationale: La fuente narra la acción y su resultado, pero no ofrece una interpretación doctrinal; la traducción preserva esa reserva.
- issue: Sentido de «Santiago se salvó»
  choice: Mantener «se salvó»
  alternative: Traducir de forma restrictiva «sobrevivió» o ampliar hacia la salvación espiritual
  rationale: «Se salvó» conserva la amplitud verbal, mientras el contexto deja claro que se trata ante todo del rescate del peligro mortal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones y la sencillez narrativa propias del relato. «Hacer pan» se mantuvo por cercanía al testimonio, aunque en algunos contextos podría entenderse como «hornear pan». Dado que la revisión directa del griego está pendiente, no se introdujeron precisiones léxicas que dependan de reconstruir el texto fuente.
