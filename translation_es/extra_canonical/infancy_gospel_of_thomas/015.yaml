    **(2)** Al entrar en la escuela, Jesús encontró un libro que estaba sobre el atril. Lo tomó, pero no leyó lo que estaba escrito en él, porque no procedía de la Ley de Dios.[b] En cambio, abrió la boca y pronunció palabras tan admirables que el maestro, sentado frente a él, lo escuchó con gran alegría y lo animó a seguir hablando. La gente que estaba allí quedó asombrada ante sus santas palabras.


