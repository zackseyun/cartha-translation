base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: es
  text: '**(1)** Algunos días después, otro maestro volvió a decirle a José, el padre de Jesús:


    —Ven, hermano; confíamelo en la escuela para que pueda enseñarle las letras con halagos.


    José le respondió:


    —Si tienes valor, hermano, llévatelo con salvación.[a]


    El maestro tomó al niño de la mano y se lo llevó con mucho temor y preocupación. El niño fue de buena gana.


    **(2)** Al entrar en la escuela, Jesús encontró un libro que estaba sobre el atril. Lo tomó, pero no leyó lo que estaba escrito en él, porque no pertenecía a la Ley de Dios.[b] En cambio, abrió la boca y pronunció palabras tan admirables que el maestro, sentado frente a él, lo escuchaba con gran alegría y lo animaba a seguir hablando. La gente que estaba allí quedó asombrada ante sus santas palabras.


    **(3)** José corrió enseguida a la escuela, pues sospechaba que este maestro ya no era inexperto y que había sufrido.[c] Pero el maestro le dijo:


    —Para que lo sepas, hermano: ciertamente recibí a tu hijo como discípulo, pero está lleno de mucha gracia y sabiduría. Por tanto, hermano, llévalo con salvación a tu casa.[a]


    **(4)** Jesús le dijo al maestro:


    —Ya que hablaste correctamente y diste un testimonio correcto, también será salvado por causa tuya el que fue derribado.[d]


    En ese mismo instante, aquel maestro también fue salvado. Entonces José tomó al niño y lo llevó a su casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Con salvación» reproduce literalmente una expresión inusual del testimonio disponible. También podría entenderse de manera idiomática como «con bien» o «sano y salvo».
    reason: Conservar una frase ambigua y teológicamente significativa sin imponer una interpretación idiomática.
  - marker: b
    text: 'También puede traducirse: «porque no procedía de la Ley de Dios». No queda claro si la frase describe el contenido, el origen o la pertenencia del libro.'
    reason: Hacer visible la ambigüedad de la relación entre el libro y la Ley de Dios.
  - marker: c
    text: 'La redacción del testimonio es difícil: «ya no era inexperto y había sufrido». No queda claro qué significa aquí que el maestro ya no fuera inexperto ni qué clase de sufrimiento se presupone.'
    reason: Evitar corregir en silencio una expresión cuya revisión directa en griego está pendiente.
  - marker: d
    text: «El que fue derribado» no es identificado en este pasaje. «Será salvado» también podría referirse, según el contexto, a ser librado, sanado o restaurado.
    reason: Preservar la referencia indefinida y el alcance semántico de «salvado».
lexical_decisions:
- source_word: letters
  choice: las letras
  rationale: Conserva el sentido elemental de aprender el alfabeto y evita ampliar el texto a una educación general.
- source_word: with flattery
  choice: con halagos
  rationale: Mantiene la expresión inusual del testimonio disponible sin reinterpretarla como paciencia, persuasión o amabilidad.
- source_word: book
  choice: libro
  rationale: Reproduce el término general del testimonio; no se especifica si era códice, rollo u otro tipo de texto.
- source_word: lectern
  choice: atril
  rationale: Es la designación natural y comprensible en español para el soporte sobre el cual estaba el libro.
- source_word: God’s law
  choice: la Ley de Dios
  rationale: La mayúscula señala que se alude a la instrucción o ley sagrada, sin identificar de manera más estrecha el contenido del libro.
- source_word: holy words
  choice: santas palabras
  rationale: Conserva la valoración religiosa explícita del texto sin sustituirla por «sabias» o «inspiradas».
- source_word: the one struck down
  choice: el que fue derribado
  rationale: Retiene tanto la referencia indefinida como la imagen de haber sido abatido, sin identificar al personaje ni precisar si estaba muerto, herido o castigado.
theological_decisions:
- issue: La fórmula repetida «with salvation»
  choice: con salvación
  alternative: con bien / sano y salvo
  rationale: Aunque resulta poco idiomática en español, conserva deliberadamente la singular formulación soteriológica del testimonio y su repetición; una nota advierte su carácter literal.
- issue: La relación entre el testimonio del maestro y la salvación del derribado
  choice: también será salvado por causa tuya el que fue derribado
  alternative: el que fue derribado también recobrará la vida gracias a ti
  rationale: Se mantiene «salvado» y no se lo convierte en «resucitado» o «sanado», pues el estado del derribado y la naturaleza de su restauración no están definidos en el testimonio.
- issue: La salvación del maestro
  choice: aquel maestro también fue salvado
  alternative: aquel maestro también quedó a salvo
  rationale: La repetición de «salvado» preserva el posible vínculo teológico y narrativo con la declaración anterior, sin limitarlo a seguridad física.
- issue: Identidad de «el que fue derribado»
  choice: referente no identificado
  alternative: identificarlo con un maestro de un episodio anterior
  rationale: El pasaje suministrado no nombra al referente; identificarlo requeriría armonización contextual o una decisión interpretativa no exigida por el texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo directo natural y se aclaran los referentes pronominales cuando es necesario. Se conservan, con notas, las expresiones extrañas «con salvación», «ya no era inexperto y había sufrido» y «el que fue derribado». El borrador es necesariamente provisional porque solo se proporcionó un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega está pendiente.
