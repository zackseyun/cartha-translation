  source_fidelity: 'El borrador refleja fielmente el testimonio inglés disponible y sigue de cerca su sintaxis: conserva la triple petición, el contraste «de lo alto / los de abajo / subir», la subordinación de «que yo estoy aquí…» a «comprender», la maldición y el desenlace narrativo. Puesto que la revisión directa del griego sigue pendiente, no hay base segura para sustituir las formulaciones que preservan las ambigüedades del testimonio.'
