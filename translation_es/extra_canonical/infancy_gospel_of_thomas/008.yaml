  terminology: «Estéril», «insensatos de corazón», «liberar», «maldición» y «fueron salvados» son elecciones adecuadas. En particular, «fueron salvados» conserva la amplitud del inglés y no la reduce a sanación o liberación; «llamarlos a subir» mantiene tanto la llamada como el movimiento ascendente.
