base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: es
  text: '(1) El niño Jesús se rio y dijo: «Ahora, que la estéril dé fruto, que los ciegos vean y que los insensatos de corazón lleguen a comprender que yo estoy aquí, venido de lo alto, para liberar a los de abajo y llamarlos a subir, tal como me lo ordenó el que me envió a ustedes».


    (2) Inmediatamente fueron salvados todos los que habían caído bajo su maldición. Y desde entonces nadie se atrevió a provocarlo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: barren
  choice: la estéril
  rationale: Conserva la imagen de infertilidad y su forma sustantivada, sin especificar una persona concreta más allá de lo que permite el testimonio.
- source_word: foolish in heart
  choice: los insensatos de corazón
  rationale: Mantiene el modismo antropológico antiguo y evita reducir «corazón» a mera capacidad intelectual.
- source_word: from above
  choice: venido de lo alto
  rationale: Expresa origen o procedencia celestial sin identificar de manera más precisa lo que el testimonio deja abierto.
- source_word: those below
  choice: los de abajo
  rationale: Preserva el contraste espacial deliberado con «lo alto» y su posible carga teológica.
- source_word: call them up
  choice: llamarlos a subir
  rationale: Conserva tanto la acción de llamar como el movimiento ascendente, sin sustituirlos por una interpretación doctrinal.
- source_word: curse
  choice: maldición
  rationale: Es el equivalente directo y natural; mantiene la fuerza narrativa y moral del término.
- source_word: provoke
  choice: provocarlo
  rationale: Reproduce la amplitud semántica del testimonio, que puede abarcar irritar, desafiar u hostigar.
theological_decisions:
- issue: Relación entre «de lo alto» y «los de abajo»
  choice: 'Mantener el contraste espacial: «venido de lo alto… los de abajo… subir».'
  alternative: Interpretarlo explícitamente como descenso del cielo y ascenso al cielo.
  rationale: El contraste posee resonancias celestiales, pero conviene conservar su formulación figurada y no resolver más de lo que permite el testimonio disponible.
- issue: Alcance de «fueron salvados»
  choice: Traducir literalmente «fueron salvados».
  alternative: «Fueron sanados» o «quedaron libres de la maldición».
  rationale: «Salvados» conserva la amplitud del término y su tensión entre rescate, restauración y reversión de la maldición.
- issue: Sentido de «que yo estoy aquí, venido de lo alto»
  choice: Vincular la comprensión con la presencia y procedencia de Jesús.
  alternative: Puntuarlo como una declaración independiente sin relación sintáctica clara con «comprender».
  rationale: La sintaxis del testimonio favorece que aquello que deben comprender sea la presencia y procedencia de Jesús, sin definir exhaustivamente su naturaleza.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y una sintaxis clara, conservando las imágenes antitéticas de lo alto y lo bajo. «Se rio» sigue la ortografía vigente. Dado que la revisión directa del griego está pendiente, el borrador permanece expresamente basado en el testimonio inglés público y evita afirmaciones filológicas no verificadas.
