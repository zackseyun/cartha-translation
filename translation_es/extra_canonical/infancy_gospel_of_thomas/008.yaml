source:
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart find understanding: that I’m here from above, so that I may deliver those below and call them up, just as the one who sent me to you has ordered me.”


    (2) And immediately all who had fallen under his curse were saved. And no one dared to provoke him from then on.'
