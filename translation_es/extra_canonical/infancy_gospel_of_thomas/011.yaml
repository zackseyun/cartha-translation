base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: es
  text: '(1) El niño Jesús tenía unos siete años, y su madre María lo envió a traer agua. Pero había una gran multitud junto a la cisterna, y golpearon el cántaro, que se quebró.


    (2) Entonces Jesús extendió el manto que llevaba puesto, lo llenó de agua y se lo llevó a su madre. María vio la señal que Jesús había realizado. Lo besó y dijo: «Señor, Dios mío, bendice a nuestro hijo», porque temían que alguien lo hechizara.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en un testimonio inglés de dominio público. Aún está pendiente la revisión directa de la tradición manuscrita griega. La expresión «nuestro hijo» reproduce la lectura del testimonio consultado.
    reason: La fuente suministrada advierte que falta la revisión del griego; además, la frase presenta una posible dificultad textual o interpretativa que no debe resolverse en silencio.
lexical_decisions:
- source_word: child
  choice: niño
  rationale: Es la forma natural y digna en español para referirse a Jesús a esa edad.
- source_word: fill up water / fetch water
  choice: traer agua
  rationale: Expresa idiomáticamente el encargo de ir por agua, sin reproducir la construcción poco natural del testimonio inglés.
- source_word: water cistern
  choice: cisterna
  rationale: Conserva el tipo de depósito de agua indicado por el testimonio.
- source_word: cloak
  choice: manto
  rationale: Designa con naturalidad una prenda exterior y permite entender la acción extraordinaria del relato.
- source_word: sign
  choice: señal
  rationale: Conserva el lenguaje religioso del relato sin sustituirlo por «milagro», que resolvería el matiz interpretativo.
- source_word: bewitch
  choice: hechizara
  rationale: Comunica claramente el temor a un acto de brujería o encantamiento en español latinoamericano neutral.
theological_decisions:
- issue: La invocación de María y la identidad de «nuestro hijo»
  choice: «Señor, Dios mío, bendice a nuestro hijo»
  alternative: «Señor Dios mío, bendice a mi hijo»
  rationale: Se conserva la tensión del testimonio, donde María se dirige a Dios y habla de «nuestro hijo», sin reinterpretar la frase ni corregir su posible extrañeza.
- issue: Descripción del acto de Jesús
  choice: «la señal que Jesús había realizado»
  alternative: «el milagro que Jesús había hecho»
  rationale: «Señal» mantiene la categoría del testimonio y evita imponer una clasificación teológica más específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se favorecieron frases claras y narrativas, conservando «cisterna», «manto» y «señal». La traducción es necesariamente provisional porque no se proporcionó el texto griego para cotejo directo.
