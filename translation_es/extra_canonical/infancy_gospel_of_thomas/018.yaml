review_pass:
  verdict: revise
  source_fidelity: El borrador reproduce fielmente la secuencia narrativa, la orden dirigida al hombre, su levantamiento y la reacción de la multitud según el testimonio inglés disponible. Sin embargo, «estaban construyendo un edificio» introduce un sujeto humano indefinido que el pasivo de la fuente no expresa; «se estaba construyendo un edificio» conserva mejor la construcción impersonal/pasiva. «Este niño viene del cielo» desplaza «is from heaven» hacia una idea de procedencia o descenso; «es del cielo» es más fiel y no añade ese matiz.
  naturalness: El español es claro, actual y apropiado para un relato antiguo. «Se estaba construyendo un edificio» es natural y más exacto. «Dijeron» mantiene la acción puntual del relato mejor que «Decían».
  terminology: «Alboroto», «levántate», «almas» y «lo adoró» son opciones defendibles de manera provisional. La nota sobre «lo adoró» conserva prudentemente la amplitud posible del verbo de reverencia, y la nota sobre «almas» evita restringir indebidamente su alcance mientras falta revisión directa del griego.
  issues:
  - severity: medium
    issue: Sujeto añadido en la construcción del edificio
    rationale: «Estaban construyendo» presupone agentes humanos no expresados. La fuente dice que un edificio estaba siendo construido; la forma impersonal «se estaba construyendo» preserva ese enfoque.
  - severity: medium
    issue: Matiz añadido en «viene del cielo»
    rationale: El testimonio dice que el niño «es del cielo», no que esté viniendo o haya venido del cielo. «Es del cielo» mantiene la formulación sin precisar el modo de procedencia.
  - severity: low
    issue: Aspecto verbal de «Decían»
    rationale: La reacción de la multitud se presenta como una declaración narrativa puntual. «Dijeron» es más directo y corresponde mejor al testimonio.
  revised_text: '(1) Después de algún tiempo, se estaba construyendo un edificio. Se produjo un gran alboroto, y Jesús se levantó y fue allá.


    Al ver a un hombre tendido y muerto, Jesús lo tomó de la mano y le dijo: «A ti te digo, hombre: levántate y haz tu trabajo». El hombre se levantó de inmediato y lo adoró.[a]


    (2) La multitud vio lo sucedido y quedó asombrada. Dijeron: «Este niño es del cielo, pues ha salvado de la muerte a muchas almas,[b] y seguirá salvando durante todos los días de su vida».'
  revised_footnotes:
  - marker: a
    text: También podría traducirse «se postró ante él» o «le rindió homenaje», según el término griego del manuscrito que se adopte; hace falta una revisión directa de las fuentes griegas.
    reason: El borrador se basa en un testimonio inglés y el verbo de reverencia puede tener distintos grados de sentido cultual.
  - marker: b
    text: Aquí «almas» puede tener el sentido de «personas» o «vidas». Se conserva la expresión del testimonio disponible mientras queda pendiente la revisión directa del griego.
    reason: Evita decidir prematuramente si la frase tiene un sentido exclusivamente físico o también teológico.
  revision_rationale: Las revisiones eliminan un agente no expresado, restituyen la afirmación «es del cielo» sin convertirla en una acción de venida y ajustan el verbo de habla al desarrollo puntual de la narración. Se conservan las notas porque la base proporcionada es un testimonio inglés y la comprobación directa del griego sigue pendiente.
