base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: es
  text: '(1) Después de algún tiempo, estaban construyendo un edificio. Se produjo un gran alboroto, y Jesús se levantó y fue allá.


    Al ver a un hombre tendido y muerto, Jesús lo tomó de la mano y le dijo: «A ti te digo, hombre: levántate y haz tu trabajo». El hombre se levantó de inmediato y lo adoró.[a]


    (2) La multitud vio lo sucedido y quedó asombrada. Decían: «Este niño viene del cielo, pues ha salvado de la muerte a muchas almas,[b] y seguirá salvando durante todos los días de su vida».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: También podría traducirse «se postró ante él» o «le rindió homenaje», según el término griego del manuscrito que se adopte; hace falta una revisión directa de las fuentes griegas.
    reason: El borrador se basa en un testimonio inglés y el verbo de reverencia puede tener distintos grados de sentido cultual.
  - marker: b
    text: Aquí «almas» puede tener el sentido de «personas» o «vidas». Se conserva la expresión del testimonio disponible mientras queda pendiente la revisión directa del griego.
    reason: Evita decidir prematuramente si la frase tiene un sentido exclusivamente físico o también teológico.
lexical_decisions:
- source_word: building
  choice: edificio
  rationale: Expresa de manera natural la construcción mencionada sin precisar de forma injustificada qué clase de estructura era.
- source_word: great commotion
  choice: un gran alboroto
  rationale: Comunica una agitación pública notable en español latinoamericano corriente.
- source_word: rise
  choice: levántate
  rationale: Conserva el mandato directo y su posible sentido tanto corporal como vivificador en el contexto.
- source_word: worshipped
  choice: lo adoró
  rationale: Representa el sentido fuerte del testimonio inglés, pero se señala en nota la posible amplitud semántica que deberá verificarse en el griego.
- source_word: souls
  choice: almas
  rationale: Mantiene la formulación del testimonio disponible y evita sustituirla silenciosamente por «personas» o «vidas» antes de revisar el griego.
theological_decisions:
- issue: La procedencia celestial del niño
  choice: «Este niño viene del cielo»
  alternative: «Este niño es del cielo»
  rationale: «Viene del cielo» reproduce con claridad la afirmación de procedencia sin añadir una formulación doctrinal más específica.
- issue: La reacción del hombre resucitado ante Jesús
  choice: «lo adoró»
  alternative: «se postró ante él» o «le rindió homenaje»
  rationale: Se conserva la fuerza teológica del testimonio disponible, a la vez que una nota reconoce que la revisión del término griego puede exigir una expresión menos específica.
- issue: Alcance de «salvar almas de la muerte»
  choice: Se conserva literalmente «ha salvado de la muerte a muchas almas»
  alternative: «ha salvado muchas vidas de la muerte»
  rationale: La frase puede referirse a rescates físicos y también evocar un sentido más amplio. Se preserva esa tensión en vez de resolverla.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se favorecieron oraciones claras y narrativas sin modernizar en exceso el tono antiguo. Este borrador es provisional: se apoya en el testimonio inglés de dominio público proporcionado, pues la revisión directa de la tradición manuscrita griega sigue pendiente.'
