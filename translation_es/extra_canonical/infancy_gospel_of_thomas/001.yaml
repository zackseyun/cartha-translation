translation:
  language: es
  text: 'Yo, Tomás el israelita, consideré necesario dar a conocer a todos los hermanos y hermanas gentiles todo lo que hizo nuestro Señor Jesucristo en la aldea de Nazaret, después de haber nacido en nuestra región de Belén. Este es el comienzo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Thomas the Israelite
  choice: Tomás el israelita
  rationale: Conserva la identificación étnico-religiosa del testigo sin ampliarla ni interpretarla.
- source_word: Gentile brothers (and sisters)
  choice: hermanos y hermanas gentiles
  rationale: Hace explícita la inclusión señalada por el testigo inglés y mantiene «gentiles» como término histórico comprensible.
- source_word: all the things done by our Lord Jesus Christ
  choice: todo lo que hizo nuestro Señor Jesucristo
  rationale: Expresa de manera natural en español la totalidad de las acciones atribuidas a Jesús, conservando el título cristológico completo.
- source_word: village of Nazareth
  choice: aldea de Nazaret
  rationale: «Aldea» refleja la escala del asentamiento indicada por el testigo, sin modernizarlo como ciudad.
- source_word: our region of Bethlehem
  choice: nuestra región de Belén
  rationale: Mantiene la formulación geográfica inusual y su posible ambigüedad, sin sustituirla por una expresión más conocida.
- source_word: This is the beginning
  choice: Este es el comienzo
  rationale: Reproduce con sencillez la fórmula introductoria que da paso al relato.
theological_decisions:
- issue: Relación entre Nazaret y Belén
  choice: Mantener que los hechos ocurrieron en Nazaret después del nacimiento en la región de Belén
  alternative: Armonizar la frase con relatos canónicos o reformular la geografía
  rationale: La traducción conserva la secuencia y la tensión geográfica del testigo suministrado, sin imponer una armonización doctrinal.
- issue: Título «nuestro Señor Jesucristo»
  choice: Conservar el título completo
  alternative: Reducirlo a «Jesús» o «Jesucristo»
  rationale: El título pertenece al testimonio recibido y expresa su perspectiva confesional sin requerir explicación adicional.
