base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: es
  text: '(1) En el tiempo de la siembra, José sembró semillas, y el niño Jesús sembró una medida de trigo.


    (2) Su padre cosechó cien medidas grandes y dio generosamente a los pobres y a los huérfanos. Pero José tomó de las semillas de Jesús.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase final es oscura en el testimonio disponible. También podría entenderse en relación con la semilla o la cosecha procedente de lo sembrado por Jesús. La revisión directa del griego está pendiente.
    reason: Advierte al lector sobre una ambigüedad textual real y sobre el carácter provisional de la base de traducción, sin imponer una reconstrucción.
lexical_decisions:
- source_word: one measure
  choice: una medida
  rationale: Conserva la unidad genérica del testimonio sin identificarla con una medida antigua específica que el material suministrado no permite establecer.
- source_word: a hundred great measures
  choice: cien medidas grandes
  rationale: Mantiene tanto la cifra como el calificativo del testimonio; evita convertir la expresión en una unidad moderna o eliminar su énfasis.
- source_word: graciously
  choice: generosamente
  rationale: Expresa de manera natural la disposición benévola con que se reparte la cosecha.
- source_word: poor and the orphans
  choice: los pobres y los huérfanos
  rationale: Reproduce directamente los dos grupos vulnerables mencionados, con lenguaje claro y digno.
- source_word: took from Jesus’ seeds
  choice: tomó de las semillas de Jesús
  rationale: Preserva la formulación abrupta y algo ambigua del testimonio, sin añadir un objeto, propósito o relación causal no expresados.
theological_decisions:
- issue: Relación entre la siembra de Jesús y la cosecha extraordinaria
  choice: No explicar el mecanismo del prodigio ni atribuir explícitamente toda la cosecha a Jesús
  alternative: Decir que la medida sembrada por Jesús produjo cien medidas
  rationale: El testimonio presentado yuxtapone la siembra y la gran cosecha, pero su última oración es ambigua. La traducción conserva esa tensión sin completar el relato doctrinal o narrativamente.
- issue: Identidad de «su padre»
  choice: Conservar «su padre»
  alternative: Sustituirlo por «José»
  rationale: La referencia paterna pertenece al testimonio y refleja el marco narrativo; no conviene armonizarla ni explicarla teológicamente dentro del texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la estructura sencilla del relato y su repetición característica. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa de la tradición manuscrita griega.
