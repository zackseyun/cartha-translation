    —¡Ay de mí! ¡Ay de mí! Estoy desconcertado y abatido. Me he cubierto de vergüenza al hacerme cargo de este niño.


    (2) »Hermano, llévatelo de aquí, porque no puedo soportar su mirada ni la claridad de su palabra. Este niño sencillamente no es de este mundo. ¡Hasta puede dominar el fuego! Quizá existía antes de la creación del mundo. ¿Qué vientre lo llevó? ¿Qué clase de madre lo crio? No lo sé. ¡Ay de mí, hermano! Me deja atónito; mi mente no puede seguirlo. Me engañé a mí mismo, desdichado tres veces. Creí que conseguiría un discípulo, y resulta que tengo un maestro.


    (3) »Amigos, considero mi vergüenza: siendo ya anciano, he sido vencido por un niño. Deberían expulsarme y dejarme morir, o tendría que huir de esta aldea por causa de este niño. Ya no puedo dejarme ver entre la gente, y menos aún ante quienes vieron que un niño tan pequeño me venció. Pero ¿qué puedo decir o contarle a alguien acerca de los trazos del primer elemento? La verdad, amigos, es que no lo sé, pues no comprendo ni el principio ni el fin.


    (4) »Por tanto, hermano José, llévalo con salvación[a] a tu casa, porque este niño es algo grande: sea un dios, un ángel o cualquier otra cosa que pudiera decir, no lo sé.[b]'
