translation:
  language: es
  text: '(1) Desde allí iba con su padre José, cuando alguien que venía corriendo le golpeó el hombro. Jesús le dijo: «¡Maldito seas por causa de tu jefe!»[a]


    Y murió de inmediato.


    Al ver que había muerto de inmediato, la gente exclamó: «¿De dónde ha salido este niño, que su palabra se convierte en realidad?»


    (2) Cuando los padres del niño muerto vieron lo sucedido, culparon a José, el padre de Jesús, y le dijeron: «Sea cual sea el lugar de donde hayas sacado a este niño, no puedes vivir con nosotros en esta aldea. Si quieres quedarte aquí, enséñale a bendecir y no a maldecir, porque nos han quitado a nuestro hijo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «por causa de tu jefe» reproduce una frase inusual del testimonio utilizado. Su sentido es incierto y queda pendiente de revisión directa en la tradición manuscrita griega.
    reason: Advierte al lector sobre una dificultad textual o de traducción sin resolverla mediante conjetura.
lexical_decisions:
- source_word: struck his shoulder
  choice: le golpeó el hombro
  rationale: Conserva la acción concreta del testimonio sin precisar si el golpe fue intencional o accidental.
- source_word: his word becomes deed
  choice: su palabra se convierte en realidad
  rationale: Expresa en español natural que lo pronunciado por el niño se cumple, sin añadir una explicación sobre cómo ocurre.
- source_word: has been taken away from us
  choice: nos han quitado a nuestro hijo
  rationale: Mantiene la formulación pasiva e indeterminada del testimonio, sin identificar explícitamente al agente ni sustituirla por una interpretación como «ha muerto».
theological_decisions:
- issue: Relación entre la maldición de Jesús y la muerte del niño
  choice: Se conserva la secuencia narrativa sin afirmar expresamente una causalidad adicional.
  alternative: Traducir de modo que Jesús aparezca explícitamente como quien mata al niño.
  rationale: El relato yuxtapone la maldición y la muerte inmediata, pero la traducción no debe intensificar la afirmación más allá del testimonio suministrado.
- issue: Sentido de la frase «because of your leader»
  choice: «por causa de tu jefe»
  alternative: Armonizarla con otra lectura, omitirla o interpretarla como una referencia concreta a una autoridad.
  rationale: La expresión es inusual y su sentido resulta incierto; se conserva la tensión del testimonio inglés mientras queda pendiente la revisión directa del griego.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Borrador provisional basado en el testimonio inglés de dominio público suministrado; la revisión directa de la fuente griega sigue pendiente. Se preservan la brusquedad del relato y su ambigüedad causal.
