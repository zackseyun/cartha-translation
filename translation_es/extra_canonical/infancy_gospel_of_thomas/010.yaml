  text: 'In Hagios Saba 259, this passage appears after Chapter 16.


    (1) Again, a certain young man was splitting wood into equal parts. And he split the bottom of his foot, bled out, and died.


    (2) A commotion arose, and Jesus ran there. Forcing his way through the crowd, he seized the stricken foot, and immediately it was healed. And he said to the young man, “Go, split your wood.”


    (3) And the crowds saw and were amazed and said, “For he saved many souls from death, and he will continue to save all the days of his life.”'
translation:
  language: es
  text: 'En el manuscrito Hagios Saba 259, este pasaje aparece después del capítulo 16.[a]


    (1) De nuevo, cierto joven estaba partiendo leña en trozos iguales. Entonces se abrió la planta del pie, se desangró y murió.


    (2) Se produjo un alboroto, y Jesús corrió hacia allí. Abriéndose paso entre la multitud, tomó el pie herido, y este sanó de inmediato. Entonces le dijo al joven: «Ve y sigue partiendo tu leña».


    (3) Las multitudes lo vieron, quedaron asombradas y dijeron: «Pues ha salvado de la muerte muchas vidas, y seguirá salvando todos los días de su vida».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Hagios Saba 259, este episodio se encuentra después del capítulo 16; su ubicación varía dentro de la tradición manuscrita.
    reason: La nota preserva el dato textual del encabezado y aclara que se trata de una cuestión de orden manuscrito.
  - marker: b
    text: 'También podría traducirse: «ha salvado muchas almas de la muerte». Aquí «vidas» se refiere a personas libradas de morir.'
    reason: Hace visible la alternativa literal de «souls» y evita ocultar la ambigüedad léxica del testimonio disponible.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: partiendo leña en trozos iguales
  rationale: Conserva el sentido concreto de dividir la madera en partes parejas y suena natural en español latinoamericano.
- source_word: split the bottom of his foot
  choice: se abrió la planta del pie
  rationale: Expresa de manera idiomática una herida profunda en la planta sin sugerir que el pie quedó completamente partido.
- source_word: bled out
  choice: se desangró
  rationale: Mantiene con claridad la gravedad y el resultado mortal de la hemorragia.
- source_word: Forcing his way through the crowd
  choice: Abriéndose paso entre la multitud
  rationale: Reproduce el movimiento enérgico de Jesús sin añadir violencia no explicitada.
- source_word: seized the stricken foot
  choice: tomó el pie herido
  rationale: «Tomó» es natural y conserva la acción física; «herido» identifica el pie afectado sin recargar la frase.
- source_word: souls
  choice: vidas
  rationale: En este contexto, «souls» representa a personas o vidas rescatadas de la muerte, no necesariamente almas incorpóreas.
- source_word: all the days of his life
  choice: todos los días de su vida
  rationale: Conserva la formulación temporal enfática del testimonio inglés.
theological_decisions:
- issue: Sentido de «salvó muchas almas de la muerte»
  choice: «ha salvado de la muerte muchas vidas»
  alternative: «ha salvado muchas almas de la muerte»
  rationale: El contexto trata de rescatar personas de la muerte física. «Vidas» comunica ese sentido sin imponer una lectura doctrinal sobre el alma.
- issue: Alcance de la predicción final
  choice: «seguirá salvando todos los días de su vida»
  alternative: «salvará durante toda su vida»
  rationale: Se conserva la continuidad afirmada por el testimonio y también la referencia ambigua a «su vida», sin precisar una doctrina posterior.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvo la narración sencilla y directa. Debido a que la revisión directa del griego está pendiente, las decisiones se basan provisionalmente en el testimonio inglés público suministrado y se señalan las ambigüedades relevantes.
