  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/019.yaml
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: es
  text: '(1) Cuando Jesús tenía doce años, sus padres fueron a Jerusalén para la fiesta de la Pascua, según la costumbre. Pero, mientras regresaban, Jesús se quedó en Jerusalén sin que sus padres lo supieran.


    (2) Como pensaban que iba con la caravana, caminaron durante un día y lo buscaron entre sus parientes y conocidos. Al no encontrarlo, regresaron a Jerusalén para buscarlo.


    Después de tres días lo encontraron en el templo, sentado en medio de los maestros, escuchándolos y haciéndoles preguntas. Quienes lo oían se maravillaban de cómo interrogaba a los ancianos y explicaba los puntos principales de la Ley, los enigmas y las parábolas de los profetas.


    (3) Su madre le dijo:


    —Hijo, ¿por qué nos has hecho esto? Mira, te hemos estado buscando con dolor y angustia.


    Jesús respondió:


    —¿Por qué me buscaban? ¿No sabían que es necesario que yo esté en el lugar de mi Padre?[a]


    (4) Los escribas y los fariseos le preguntaron a María:


    —¿Eres tú la madre de este niño?


    Ella respondió:


    —Sí, lo soy.


    Entonces le dijeron:


    —Dichosa tú, porque el Señor Dios ha bendecido el fruto de tu vientre. Nunca hemos visto una sabiduría semejante, digna de alabanza, ni una virtud tan gloriosa.[b]


    (5) Jesús se levantó, salió de allí siguiendo a su madre y obedecía a sus padres. Ella guardaba todas estas cosas y las meditaba en su corazón.


    Jesús progresaba en sabiduría, madurez y gracia ante Dios y ante los seres humanos. A él sea la [gloria…].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También podría entenderse: «entre las cosas de mi Padre» o «ocupado en los asuntos de mi Padre». El testimonio utilizado aquí favorece el sentido espacial: «en el lugar de mi Padre».'
    reason: Preservar una ambigüedad tradicional de la expresión sin ocultar la opción seguida por el testimonio base.
  - marker: b
    text: La construcción de esta frase es difícil en el testimonio disponible. La traducción procura conservar unidos los conceptos de sabiduría, alabanza, gloria y virtud sin imponer una interpretación doctrinal.
    reason: Advertir al lector sobre la incertidumbre sintáctica y evitar una falsa precisión.
  - marker: c
    text: Los corchetes y los puntos suspensivos reflejan que el final de la doxología está incompleto o ha sido restaurado de manera incierta en la tradición textual.
    reason: Conservar de forma visible la señal de daño, laguna o restauración manuscrita presente en el testimonio.
lexical_decisions:
- source_word: traveling company
  choice: caravana
  rationale: Expresa de manera natural en español latinoamericano el grupo de viajeros que se desplazaba conjuntamente, sin sugerir una entidad comercial.
- source_word: known relatives
  choice: parientes y conocidos
  rationale: La expresión del testimonio inglés es poco natural y posiblemente comprimida; esta formulación conserva ambos ámbitos plausibles de búsqueda y armoniza con el sentido contextual.
- source_word: teachers
  choice: maestros
  rationale: Mantiene la función pedagógica de los interlocutores en el templo sin identificarla de manera más específica de lo que permite el testimonio suministrado.
- source_word: main points of the law
  choice: puntos principales de la Ley
  rationale: Conserva la referencia a contenidos centrales o encabezamientos de la Ley y emplea mayúscula para señalar la Torá en este contexto.
- source_word: maturity
  choice: madurez
  rationale: Preserva la amplitud de la expresión recibida, que puede abarcar crecimiento físico y desarrollo personal, sin reducirla simplemente a estatura.
- source_word: before God and humans
  choice: ante Dios y ante los seres humanos
  rationale: Reproduce la dimensión relacional o evaluativa de la frase y usa lenguaje inclusivo natural sin alterar el referente humano general.
theological_decisions:
- issue: La necesidad de que Jesús esté en relación con su Padre
  choice: «es necesario que yo esté en el lugar de mi Padre»
  alternative: «debo ocuparme de los asuntos de mi Padre»
  rationale: El testimonio suministrado dice explícitamente «in the place of my Father». Se conserva el sentido espacial y la tensión teológica, en vez de sustituirlo por la conocida alternativa de «asuntos».
- issue: Sabiduría y virtud en la bendición pronunciada sobre María
  choice: «una sabiduría semejante, digna de alabanza, ni una virtud tan gloriosa»
  alternative: «tal sabiduría de alabanza y gloria de virtud»
  rationale: La sintaxis del testimonio es difícil. La traducción ofrece un español inteligible sin convertir la declaración en una fórmula doctrinal ni atribuir a María lo que el contexto parece decir del niño.
- issue: Destinatario de la doxología final
  choice: «A él sea la [gloria…]»
  alternative: «A quien sea la [gloria…]»
  rationale: El pronombre español explicita el referente masculino más probable, Jesús, pero se mantiene entre corchetes la parte transmitida como incompleta. La incertidumbre textual queda señalada en la nota.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya, «ustedes» implícito en las formas verbales y vocabulario comprensible para lectores generales. El borrador es necesariamente provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa de la tradición manuscrita griega figura como pendiente. Se preservan la ambigüedad de la expresión relativa al Padre y la señal de texto incompleto al final.'
