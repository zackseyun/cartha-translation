base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: es
  text: '(1) Jesús tenía entonces unos ocho años. Su padre era carpintero y fabricaba arados y yugos. Cierto hombre rico le encargó una cama para que la hiciera muy grande y adecuada. Pero uno de los largueros, llamado «…», era más corto y no tenía la longitud correcta.[a] José se angustió y no sabía qué hacer.


    El niño se acercó a su padre y le dijo:


    —Pon en el suelo las dos tablas y alinéalas por el extremo donde estás tú.


    (2) José hizo tal como él le había dicho. El niño Jesús se colocó en el otro extremo, agarró la tabla más corta y la estiró hasta dejarla de la misma longitud que la otra.


    Luego dijo a su padre:


    —No te angusties; ahora haz lo que quieras.


    José lo abrazó y lo besó, diciendo:


    —Dichoso soy, porque Dios me dio a este niño.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El nombre de esta pieza no se conserva o no puede determinarse con seguridad en el testimonio disponible; por eso se representa con puntos suspensivos.
    reason: Aclara la laguna o término irresuelto de la tradición manuscrita sin conjeturar una lectura.
lexical_decisions:
- source_word: carpenter
  choice: carpintero
  rationale: Es el equivalente natural y preciso en español; el contexto especifica que fabricaba arados y yugos.
- source_word: ploughs and yokes
  choice: arados y yugos
  rationale: Conserva los dos objetos agrícolas del testimonio y usa vocabulario ampliamente comprensible en América Latina.
- source_word: bed
  choice: cama
  rationale: Mantiene el sentido directo del testimonio sin precisar una forma de mueble que la evidencia suministrada no determina.
- source_word: beams / boards
  choice: largueros / tablas
  rationale: «Larguero» describe la pieza longitudinal de la cama en la primera mención; «tablas» conserva el término más general en la instrucción. La variación refleja la del testimonio disponible.
- source_word: stretched it
  choice: la estiró
  rationale: Expresa de manera directa el carácter milagroso de la acción sin explicarlo ni suavizarlo.
- source_word: Blessed am I
  choice: Dichoso soy
  rationale: Fórmula digna y natural que conserva la declaración personal de dicha sin añadir una bendición litúrgica.
theological_decisions:
- issue: Carácter milagroso de la extensión de la tabla
  choice: Se afirma sencillamente que Jesús la estiró hasta igualarla con la otra.
  alternative: Explicar el mecanismo o declarar explícitamente que ocurrió un milagro.
  rationale: El relato presenta la acción sin explicación; la traducción conserva esa tensión narrativa y evita añadir interpretación.
- issue: Agencia divina en la entrega del niño
  choice: «Dios me dio a este niño»
  alternative: «Dios me ha bendecido con este niño».
  rationale: La formulación directa conserva la afirmación del testimonio sin ampliar su alcance teológico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya y sintaxis fluida. La traducción es provisional porque se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del griego. Se preserva explícitamente el término irresuelto mediante «…» y una nota.
