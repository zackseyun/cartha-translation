base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: es
  text: '(1) El niño Jesús tenía cinco años. Después de la lluvia, jugaba en el vado de un arroyo. Removió el agua lodosa, la reunió en estanques y la dejó limpia y excelente, dándole órdenes solo con su palabra, y no mediante acción alguna.[a]


    (2) Luego tomó barro blando del lodo y formó con él doce gorriones. Pero era sábado cuando hizo estas cosas, y muchos niños estaban con él.


    (3) Cierto judío vio al niño Jesús haciendo estas cosas con los demás niños. Fue adonde estaba José, su padre, y acusó maliciosamente al niño Jesús. Dijo:


    —Hizo barro en sábado, lo cual no está permitido, y formó doce gorriones.


    (4) José fue y lo reprendió:


    —¿Por qué haces estas cosas en sábado?


    Pero Jesús dio unas palmadas y, a la vista de todos, ordenó a las aves con un grito:


    —¡Vayan, alcen el vuelo como seres vivos!


    Los gorriones alzaron el vuelo y se alejaron piando.[b]


    (5) Al ver esto, el fariseo[c] quedó asombrado y se lo contó a todos sus amigos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión «y no mediante acción alguna» reproduce una contraposición inusual del testimonio entre ordenar con la palabra y actuar. La revisión directa del griego está pendiente.
    reason: Advertir que la dificultad de la frase se preserva provisionalmente en vez de armonizarla.
  - marker: b
    text: También podría traducirse «chillando»; aquí se usa «piando» por tratarse de gorriones.
    reason: Explicar una elección onomatopéyica que no tiene un equivalente único en español.
  - marker: c
    text: Antes el personaje es llamado «cierto judío», pero aquí el testimonio lo llama «el fariseo». Se conserva el cambio de designación.
    reason: Preservar una variación interna significativa sin identificar o armonizar al personaje por conjetura.
lexical_decisions:
- source_word: ford
  choice: vado
  rationale: Conserva el sentido concreto de un paso poco profundo en una corriente de agua.
- source_word: clean and excellent
  choice: limpia y excelente
  rationale: Mantiene los dos calificativos del testimonio, aunque la combinación resulte inusual, sin reducir el segundo a una interpretación más específica.
- source_word: slandered
  choice: acusó maliciosamente
  rationale: Expresa una denuncia hostil o difamatoria en español natural, sin afirmar de manera inequívoca que todos los hechos denunciados fueran falsos.
- source_word: Sabbath
  choice: sábado
  rationale: Es la designación bíblica habitual y comprensible en español para el día judío de reposo.
- source_word: sparrows
  choice: gorriones
  rationale: Equivalente tradicional y directo para las pequeñas aves mencionadas.
- source_word: squawking
  choice: piando
  rationale: Describe de forma natural el sonido de gorriones en español; evita el menos apropiado «graznando», asociado sobre todo con aves mayores.
theological_decisions:
- issue: La orden de Jesús limpia el agua «por la palabra» y no «por una acción»
  choice: dándole órdenes solo con su palabra, y no mediante acción alguna
  alternative: mandándola solo con su palabra, y no por medio de una obra
  rationale: Preserva la contraposición llamativa del testimonio entre palabra y acción, sin explicarla ni convertirla en una afirmación doctrinal más definida.
- issue: La objeción por realizar estas acciones en sábado
  choice: lo cual no está permitido
  alternative: lo cual no es lícito
  rationale: Mantiene la afirmación legal del personaje en lenguaje actual, sin confirmar narratorialmente una interpretación particular de la ley sabática.
- issue: Cambio de identificación entre «cierto judío» y «el fariseo»
  choice: Se conservan ambas designaciones tal como aparecen en el testimonio, con nota
  alternative: Uniformar ambas referencias como «el hombre» o «el judío»
  rationale: El cambio puede reflejar la tradición textual o narrativa y no debe resolverse silenciosamente.
- issue: Las aves reciben vida o vuelan «como seres vivos»
  choice: alcen el vuelo como seres vivos
  alternative: vuelen y cobren vida
  rationale: Conserva la formulación comparativa del testimonio y evita afirmar más explícitamente de lo que este dice sobre el momento o la naturaleza de la vivificación.
translation_notes:
  register: Español latinoamericano neutral, narración digna y accesible. Se usa diálogo con raya, sintaxis clara y vocabulario bíblico corriente sin arcaísmos innecesarios. El borrador es provisional porque la información suministrada indica que la revisión directa de la tradición manuscrita griega aún está pendiente; por ello se siguen de cerca el testimonio inglés de dominio público y la capa inglesa auditada, preservando sus ambigüedades y tensiones.
