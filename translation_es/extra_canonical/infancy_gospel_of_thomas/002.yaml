  revision_rationale: La revisión conserva el carácter provisional de una traducción basada en el testimonio inglés mientras mejora precisión semántica y fluidez. Se elimina la nota sobre «piando» porque la corrección a «chillando» refleja con mayor amplitud el sonido expresado por el testimonio. No se resuelve la identidad del acusador ni se interpreta doctrinalmente la vivificación o el vuelo de las aves.
