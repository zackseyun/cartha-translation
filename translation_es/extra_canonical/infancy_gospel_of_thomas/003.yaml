base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: es
  text: '(1) El hijo de Anás, el sumo sacerdote, le dijo a Jesús: «¿Por qué haces algo así en sábado?». Luego tomó una rama de sauce, destruyó los estanques, dejó correr el agua que Jesús había reunido y secó lo que se había juntado.[a]


    (2) Pero, al ver lo sucedido, Jesús le dijo: «Tu fruto no tendrá raíz, y tu brote se marchitará como una rama abrasada por un viento impetuoso».


    (3) Inmediatamente, aquel niño se marchitó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La expresión del testimonio consultado, «their gatherings», es ambigua. También podría referirse a las acumulaciones de agua. La revisión directa del griego está pendiente.
    reason: Advierte al lector sobre una incertidumbre textual y traductológica real sin imponer una interpretación.
lexical_decisions:
- source_word: willow twig
  choice: rama de sauce
  rationale: Expresa con naturalidad el objeto vegetal identificado por el testimonio, sin añadir tamaño ni función no especificados.
- source_word: pools
  choice: estanques
  rationale: Conserva la idea de pequeñas acumulaciones delimitadas de agua; «estanques» resulta claro en español latinoamericano neutral.
- source_word: their gatherings
  choice: lo que se había juntado
  rationale: Mantiene la imprecisión del testimonio inglés acerca de si se trata del agua acumulada, de las acumulaciones mismas o de otra cosa reunida, sin resolverla de forma conjetural.
- source_word: fruit / root / shoot
  choice: fruto / raíz / brote
  rationale: Conserva el conjunto de imágenes vegetales y su relación interna.
- source_word: withered / withered away
  choice: se marchitará / se marchitó
  rationale: Reproduce el vínculo verbal entre la maldición y su cumplimiento, y conserva la caracterización metafórica de lo ocurrido al niño.
- source_word: violent wind
  choice: viento impetuoso
  rationale: Transmite fuerza y violencia con una expresión digna y natural.
theological_decisions:
- issue: Naturaleza y alcance de las palabras de Jesús
  choice: Traducirlas como una declaración directa cuyo cumplimiento se narra de inmediato
  alternative: Atenuar las palabras como advertencia o presentar el desenlace como una muerte explícita
  rationale: El testimonio presenta una declaración seguida por el marchitamiento inmediato del niño, pero no usa en el texto suministrado un término explícito para «morir»; la traducción conserva esa tensión sin suavizarla ni intensificarla.
- issue: Referencia de la imagen «fruto», «raíz» y «brote»
  choice: Conservar literalmente la metáfora sin identificar de manera explícita su referente
  alternative: Interpretarla como descendencia, vida, futuro o estado físico del niño
  rationale: La formulación admite más de una lectura y el testimonio no resuelve de forma expresa el alcance de la imagen.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron las imágenes vegetales y la brusca secuencia narrativa. Este borrador es provisional porque el material suministrado es un testimonio inglés de dominio público y la revisión directa de la tradición manuscrita griega está pendiente.
