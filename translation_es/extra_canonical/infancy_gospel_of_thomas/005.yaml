  revision_rationale: 'Se corrigen dos desplazamientos de sentido en el discurso final de Jesús: se restituye «por qué soy tuyo» en lugar de una identificación personal no presente en el testimonio, y se conserva la voz pasiva de «he sido sometido». También se ajusta la primera pregunta para reflejar la coordinación fuente («y ellos sufren») sin introducir explícitamente una relación causativa. El resto de las ambigüedades se mantiene documentado en notas, a la espera de revisión del griego.'
