    (3) Jesús le dijo:


    —Te basta con buscarme y encontrarme, y no azotarme además por haber asumido una ignorancia natural.[c] No has visto claramente por qué soy tuyo.[d] ¡Mira! He sido sometido ante ti.[e]'
