translation:
  language: es
  text: '(1) José le dijo a Jesús:


    —¿Por qué dices semejantes cosas, haciendo que ellos sufran y nos odien?


    El niño le respondió:


    —Ya que conoces palabras sabias, no ignoras de dónde vinieron; se dijeron acerca de un niño de cinco años.[a] Ellos no volverán a levantarse, y estos recibirán su castigo.[b]


    En ese mismo instante, quienes lo acusaban quedaron ciegos.


    (2) Entonces José tomó a Jesús de la oreja y tiró de ella con fuerza.


    (3) Jesús le dijo:


    —Te basta con buscarme y encontrarme; pero no debes, además, azotarme por haber asumido una ignorancia natural.[c] No has visto claramente quién soy para ti.[d] ¡Mira! Me he sometido ante ti.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «se dijeron acerca de un niño de cinco años» es difícil en el testimonio disponible; la revisión directa del griego está pendiente.
    reason: Señalar una expresión textualmente incierta sin corregirla por conjetura.
  - marker: b
    text: Los referentes de «ellos» y «estos» no son claros. «Volverán a levantarse» también puede entenderse como «se recuperarán» o, en un sentido más fuerte, «resucitarán».
    reason: Preservar la ambigüedad pronominal y semántica.
  - marker: c
    text: «Por haber asumido una ignorancia natural» traduce literalmente una expresión oscura; podría aludir a una ignorancia propia de la condición humana o infantil.
    reason: Evitar imponer una explicación teológica a una cláusula difícil.
  - marker: d
    text: 'La frase también podría traducirse: «No has visto claramente por qué soy tuyo».'
    reason: Registrar la alternativa más literal de una oración sintácticamente incierta.
  - marker: e
    text: 'También: «he sido sometido ante ti». No está claro si la expresión destaca una sumisión voluntaria o un sometimiento sufrido.'
    reason: Conservar la posible diferencia de voz y agencia.
lexical_decisions:
- source_word: “wise words” (Greek review pending)
  choice: «palabras sabias»
  rationale: Conserva la formulación del testimonio disponible sin convertirla en «sabiduría» ni precisar una referencia ausente.
- source_word: “raised” (Greek review pending)
  choice: «volverán a levantarse»
  rationale: Mantiene la posible referencia a recuperarse, ponerse en pie o volver a la vida, sin resolver la ambigüedad.
- source_word: “scourge” (Greek review pending)
  choice: «azotarme»
  rationale: Reproduce la fuerza del verbo del testimonio, aunque la acción narrativa inmediata consiste en tirar de la oreja.
- source_word: “subdued” (Greek review pending)
  choice: «me he sometido»
  rationale: Expresa subordinación voluntaria o sujeción sin añadir una interpretación cristológica específica.
theological_decisions:
- issue: Identidad y relación de Jesús con José en «why I’m yours»
  choice: «quién soy para ti»
  alternative: «por qué soy tuyo»
  rationale: La frase transmitida es difícil. La opción principal ofrece español natural, pero la nota conserva la lectura más literal y su tensión acerca de la relación entre Jesús y José.
- issue: «Ignorancia natural» asumida por Jesús
  choice: Conservar «por haber asumido una ignorancia natural»
  alternative: Parafrasear como ignorancia propia de la condición humana
  rationale: No se explica doctrinalmente la frase ni se determina si alude a encarnación, infancia o apariencia; se mantiene su formulación problemática.
- issue: Destino de los niños afectados
  choice: «no volverán a levantarse»
  alternative: «no resucitarán» o «no se recuperarán»
  rationale: Evita decidir si se trata de muerte definitiva, ausencia de resurrección o incapacidad de recuperarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usó diálogo con raya y tratamiento de «tú». Dado que el expediente declara pendiente la revisión del griego y solo proporciona un testimonio inglés de dominio público, el borrador es necesariamente provisional; las construcciones oscuras y los pronombres ambiguos se conservaron y se documentaron en notas.
