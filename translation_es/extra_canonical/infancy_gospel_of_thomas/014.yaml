    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega; algunas formulaciones podrían ajustarse después de cotejarla.
    reason: La fuente proporcionada declara que la revisión del griego original aún está pendiente, por lo que debe transparentarse la base provisional de la traducción.
  revision_rationale: 'Se hacen ajustes leves de idiomaticidad y transparencia formal: «fuera ajeno a las letras» evita una expresión marcada; «cayó y murió» conserva la sucesión del testimonio; y «para evitar que murieran» hace explícita la función preventiva de la orden. No se modifica el sentido narrativo ni se atenúa el episodio de la maldición y la muerte.'
