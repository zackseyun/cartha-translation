base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: es
  text: '(1) José vio la sabiduría y el entendimiento de Jesús. No quería que desconociera las letras, así que lo confió a otro maestro.


    El maestro escribió el alfabeto para Jesús y le dijo:


    —Di alfa.


    (2) El niño respondió:


    —Primero dime qué es beta, y yo te diré qué es alfa.


    El maestro se irritó y lo golpeó. Jesús lo maldijo, y el maestro cayó muerto.


    (3) El niño volvió a casa con sus padres. José llamó a la madre de Jesús y le ordenó que no lo dejara salir de la casa, para que no murieran quienes lo provocaran.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado. Queda pendiente la revisión directa de la tradición manuscrita griega; algunas formulaciones podrían ajustarse después de cotejarla.
    reason: La fuente proporcionada declara que la revisión del griego original aún está pendiente, por lo que debe transparentarse la base provisional de la traducción.
lexical_decisions:
- source_word: letters
  choice: las letras
  rationale: Conserva el sentido básico del testimonio suministrado y, en el contexto de alfa y beta, comunica el aprendizaje elemental de la escritura sin limitarlo innecesariamente al nombre del alfabeto.
- source_word: gave him over / entrusted
  choice: lo confió
  rationale: Expresa de manera natural que José puso a Jesús bajo la enseñanza de otro maestro, sin las connotaciones negativas que podría tener «lo entregó».
- source_word: alpha / beta
  choice: alfa / beta
  rationale: Se mantienen los nombres griegos de las letras, esenciales para el intercambio narrativo.
- source_word: cursed
  choice: maldijo
  rationale: Traducción directa que conserva la fuerza y la tensión teológica del relato sin suavizar la acción.
- source_word: fell and died
  choice: cayó muerto
  rationale: Redacción española natural que conserva la sucesión estrecha entre la caída y la muerte; el testimonio también permite traducir más explícitamente «cayó y murió».
- source_word: set him free from the house
  choice: lo dejara salir de la casa
  rationale: Comunica en español actual la prohibición de permitir que el niño abandone la casa.
- source_word: provoke
  choice: provocaran
  rationale: Mantiene la amplitud del verbo del testimonio, que puede abarcar irritar, desafiar u hostigar.
theological_decisions:
- issue: La maldición de Jesús y la muerte del maestro
  choice: 'Se afirma de manera directa: «Jesús lo maldijo, y el maestro cayó muerto».'
  alternative: Suavizar la relación entre ambos sucesos o sustituir «maldijo» por una expresión menos fuerte.
  rationale: El relato presenta deliberadamente una escena difícil; la traducción debe preservar esa tensión y no armonizarla con expectativas doctrinales posteriores.
- issue: Finalidad o resultado en la advertencia de José
  choice: «para que no murieran quienes lo provocaran»
  alternative: «no fuera a suceder que murieran quienes lo provocaran» o «de modo que quienes lo provocaran no murieran».
  rationale: El testimonio suministrado expresa una finalidad preventiva; se conserva sin precisar más de lo que permite la evidencia disponible.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usan diálogos con raya y formulaciones sencillas. Se evita añadir títulos cristológicos, explicaciones morales o armonizaciones doctrinales ausentes del testimonio.
