translation:
  language: es
  text: '**17. Jesús sana a un bebé**


    (1) Después de estas cosas, cierto bebé que vivía cerca de José enfermó y murió. Su madre lloraba desconsoladamente.


    Pero Jesús oyó que había gran llanto y conmoción, y corrió allá de inmediato. Encontró muerto al niño, le tocó el pecho y le dijo:


    —Yo te digo, bebé: no mueras, sino vive y quédate con tu madre.


    El bebé enseguida abrió los ojos y se rio. Entonces Jesús le dijo a la madre:


    —Toma a tu hijo, dale leche y acuérdate de mí.


    (2) La gente que estaba allí quedó asombrada y decía:


    —¡La verdad es que este niño es un dios o un ángel, porque cada palabra suya se convierte en un hecho!


    Después Jesús se fue de allí y volvió a jugar con los otros niños.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: baby
  choice: bebé / niño / hijo
  rationale: Se usa «bebé» al presentar al infante y en el llamado directo; «niño» evita una repetición rígida en la narración, y «hijo» corresponde naturalmente a lo dicho a la madre.
- source_word: great grief and commotion
  choice: gran llanto y conmoción
  rationale: «Llanto» expresa de manera concreta y natural la aflicción audible que atrae a Jesús, mientras «conmoción» conserva el alboroto de la escena.
- source_word: looked up
  choice: abrió los ojos
  rationale: En el contexto de un bebé muerto que revive, comunica con naturalidad la señal inmediata de vida; la base inglesa es provisional y la expresión deberá cotejarse con el griego.
- source_word: every word becomes a deed
  choice: cada palabra suya se convierte en un hecho
  rationale: Conserva la formulación enfática y casi proverbial del testimonio, vinculando directamente la palabra de Jesús con su realización.
- source_word: played with the children
  choice: volvió a jugar con los otros niños
  rationale: «Volvió» refleja el sentido de «again» y «otros» aclara naturalmente que Jesús juega con sus compañeros infantiles.
theological_decisions:
- issue: La multitud llama al niño «un dios o un ángel»
  choice: «este niño es un dios o un ángel»
  alternative: «este niño es Dios o un ángel»
  rationale: Se conserva la alternativa indefinida del testimonio inglés y la ambigüedad de la exclamación popular, sin convertirla en una afirmación doctrinal más definida de lo que permite la evidencia suministrada.
- issue: Mandato de Jesús al bebé muerto
  choice: «no mueras, sino vive»
  alternative: «no estés muerto; vive»
  rationale: Mantiene la tensión y la forma imperativa de la fuente, aun cuando el relato ya ha declarado muerto al bebé.
translation_notes:
  register: Español latinoamericano neutral, actual y digno, con diálogo directo y narración clara. Borrador provisional basado en el testimonio inglés de dominio público suministrado; la revisión directa de la tradición manuscrita griega sigue pendiente. Por ello, decisiones como «abrió los ojos» y algunos matices aspectuales deberán verificarse contra el griego antes de la edición definitiva.
