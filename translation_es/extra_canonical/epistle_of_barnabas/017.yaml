review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés de base y conserva correctamente los corchetes como señal de texto restaurado o incierto. Sin embargo, «espero de corazón» interpreta y atenúa la imagen explícita de «mi alma espera»; una formulación que conserve «mi alma» es posible en español actual y mantiene mejor el énfasis personal del texto. «Cosas presentes o futuras» y «expresadas en parábolas» reproducen adecuadamente la indeterminación y el lenguaje figurado del testimonio.
  naturalness: El registro es claro, digno y propio del español latinoamericano. «Hasta aquí sobre esto» es un cierre más directo y menos expansivo que «Esto basta sobre el tema», sin introducir el matiz adicional de que el asunto queda suficientemente tratado.
  terminology: «Salvación» y «parábolas» son términos adecuados y tradicionales. Deben mantenerse los corchetes y su nota, sin resolver la incertidumbre textual ni especificar qué son las realidades presentes o futuras.
  issues:
  - severity: low
    issue: «espero de corazón» no conserva la imagen de «mi alma espera».
    rationale: Aunque es una paráfrasis natural, añade el matiz afectivo de «de corazón» y elimina la expresión personal explícita del testimonio. «Mi alma espera» es comprensible y conserva mejor la formulación.
  - severity: low
    issue: «Esto basta sobre el tema» amplía levemente el cierre del original.
    rationale: El testimonio dice simplemente «So much then for this». «Hasta aquí sobre esto» ofrece un equivalente idiomático más ceñido sin sugerir que el autor ha tratado el tema de manera suficiente.
  revised_text: 'Hasta donde me fue posible exponerles todo con sencillez, mi alma espera no haber omitido nada [de lo referente a la salvación, frustrando así mi deseo].[a]


    Pues, si les escribiera acerca de las cosas presentes o futuras, no las entenderían, porque están expresadas en parábolas. Hasta aquí sobre esto.'
  revised_footnotes:
  - marker: a
    text: El texto entre corchetes refleja una porción incierta o restaurada en la tradición textual disponible.
    reason: Preservar de forma visible la señal de incertidumbre manuscrita transmitida por el testimonio de base.
  revision_rationale: 'Se conservan la estructura, la ambigüedad temporal, el vocabulario teológico y la señal editorial del texto de base. Los cambios son mínimos: restituyen la imagen de «mi alma» y ajustan el cierre a una equivalencia española más cercana, sin imponer interpretación alguna. La evaluación sigue siendo provisional, pues el contexto suministrado indica que falta revisión directa de los testimonios griegos y latinos.'
