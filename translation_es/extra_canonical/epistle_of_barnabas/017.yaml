base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: es
  text: 'Hasta donde me fue posible exponerles todo con sencillez, espero de corazón no haber omitido nada [de lo referente a la salvación, frustrando así mi deseo].[a]


    Pues, si les escribiera acerca de las cosas presentes o futuras, no las entenderían, porque están expresadas en parábolas. Esto basta sobre el tema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El texto entre corchetes refleja una porción incierta o restaurada en la tradición textual disponible.
    reason: Preservar de forma visible la señal de incertidumbre manuscrita transmitida por el testimonio de base.
lexical_decisions:
- source_word: with all simplicity
  choice: con sencillez
  rationale: Conserva la idea de una exposición franca y accesible sin sugerir falta de profundidad.
- source_word: my soul hopeth
  choice: espero de corazón
  rationale: Reproduce de manera natural el énfasis personal de la expresión semítica o antigua «mi alma espera».
- source_word: things immediate or future
  choice: las cosas presentes o futuras
  rationale: Sigue el sentido del testimonio inglés disponible; «presentes» conserva mejor el contraste temporal con «futuras».
- source_word: put in parables
  choice: expresadas en parábolas
  rationale: Mantiene el término tradicional y la posible tensión entre formulación figurada y falta de comprensión.
- source_word: So much then for this
  choice: Esto basta sobre el tema
  rationale: Cierre idiomático y digno que señala el fin de esta sección.
theological_decisions:
- issue: Alcance de lo omitido y relación con la salvación
  choice: Conservar entre corchetes «de lo referente a la salvación, frustrando así mi deseo»
  alternative: Integrar la frase sin corchetes u omitirla
  rationale: Los corchetes del testimonio señalan restauración, daño o incertidumbre textual; mantenerlos evita presentar como segura una lectura que no lo es.
- issue: Naturaleza de las «cosas presentes o futuras»
  choice: No especificar a qué realidades se refiere
  alternative: Interpretarlas como profecías, misterios o acontecimientos escatológicos
  rationale: El texto disponible deja indeterminado el referente; precisarlo importaría una interpretación no exigida por la evidencia.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se evitó el literalismo poco natural de «mi alma espera» mediante «espero de corazón». La redacción es provisional porque todavía está pendiente la revisión directa de los testimonios griegos y latinos.
