review_pass:
  verdict: revise
  source_fidelity: 'La traducción sigue bien el sentido general del testimonio y conserva correctamente la indeterminación de «cosas presentes o futuras». Sin embargo, «frustrando así mi deseo» presenta la relación final de forma menos precisa: el autor espera no haber omitido nada para no haber fallado en su propósito/deseo. «Porque están expresadas en parábolas» es aceptable, pero «por estar expuestas en parábolas» refleja mejor la construcción causal del texto.'
  naturalness: El español es claro y de registro apropiado. «Confío no haber omitido» suena más natural y sobrio que «espero de corazón no haber omitido», sin perder el énfasis personal. «Hasta aquí sobre esto» reproduce el cierre antiguo con sencillez.
  terminology: «Salvación» y «parábolas» son adecuados y tradicionales. No se debe concretar el contenido de las realidades presentes o futuras. Se conservan los corchetes y su nota, dado que el testimonio de base los presenta como señal editorial de texto restaurado o incierto.
  issues:
  - severity: medium
    issue: Relación de la cláusula final dentro del texto entre corchetes
    rationale: '«Frustrando así mi deseo» puede hacer parecer que la omisión frustra activamente el deseo. El sentido es final y retrospectivo: el autor espera no haber omitido nada, para no haber fallado en su propósito.'
  - severity: low
    issue: Formulación de la causa en la segunda oración
    rationale: «Están expresadas en parábolas» comunica el sentido, pero «por estar expuestas en parábolas» conserva de modo más directo la construcción causal y el matiz de que su presentación figurada impide la comprensión.
  revised_text: 'Hasta donde me fue posible explicarles todo con sencillez, confío no haber omitido nada [de lo referente a la salvación y así no haber fallado en mi propósito][a].


    Pues, si les escribiera acerca de las cosas presentes o futuras, no las comprenderían, por estar expuestas en parábolas. Hasta aquí sobre esto.'
  revised_footnotes:
  - marker: a
    text: El texto entre corchetes refleja una porción incierta o restaurada en la tradición textual disponible.
    reason: Preserva de forma visible la señal de incertidumbre manuscrita transmitida por el testimonio de base.
  revision_rationale: Se ajusta la cláusula final para reflejar la finalidad expresada por el autor, se conserva la ambigüedad temporal y temática del original, y se mejora levemente la formulación causal y el cierre sin introducir interpretación doctrinal. La revisión directa de los testigos griegos y latinos sigue pendiente; por ello se mantiene la señal editorial entre corchetes del texto de base.
