  yaml_path: translation/extra_canonical/epistle_of_barnabas/011.yaml
  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: es
  text: 'Pero examinemos si el Señor se preocupó por revelar de antemano algo acerca del agua y de la cruz. En cuanto al agua, está escrito con referencia a Israel que no recibirían el bautismo que trae el perdón de los pecados, sino que edificarían para sí mismos.[a]


    Pues el profeta dice: «Asómbrate, cielo, y estremézcase aún más la tierra por esto, porque este pueblo ha cometido dos males: me abandonaron a mí, fuente de vida, y cavaron para sí una fosa de muerte».


    «¿Acaso mi monte santo, el Sinaí, es una roca desierta? Porque ustedes serán como polluelos que revolotean en lo alto cuando se les priva de su nido».


    Y de nuevo dice el profeta: «Iré delante de ti, allanaré montañas, destrozaré puertas de bronce y haré pedazos cerrojos de hierro. Te daré tesoros oscuros, escondidos e invisibles, para que sepan que yo soy el Señor Dios».


    Y dice: «Habitarás en una cueva elevada de una roca firme». También: «Su agua estará asegurada. Verán al Rey en su gloria, y el alma de ustedes meditará en el temor del Señor».


    Y de nuevo dice por medio de otro profeta: «Quien hace estas cosas será como el árbol plantado junto a corrientes de agua que se dividen; dará su fruto a su debido tiempo, su hoja no caerá y todo cuanto haga prosperará.


    »No sucede así con los impíos, no sucede así; al contrario, son como el polvo que el viento dispersa de la superficie de la tierra. Por eso los impíos no permanecerán en el juicio, ni los pecadores en la asamblea de los justos; porque el Señor conoce el camino de los justos, pero el camino de los impíos perecerá».


    Ustedes comprenden cómo señaló al mismo tiempo el agua y la cruz. Este es el sentido: dichosos quienes ponen su esperanza en la cruz y descienden al agua, pues habla de la recompensa «a su debido tiempo». «Entonces —dice— recompensaré». Pero ¿qué dice acerca del presente? «Su hoja no caerá». Con esto quiere decir que toda palabra que salga de la boca de ustedes con fe y amor llevará a muchos a la conversión y a la esperanza.


    Y de nuevo dice otro profeta: «La tierra de Jacob fue elogiada por encima de toda la tierra». Esto quiere decir: él glorifica el recipiente de su Espíritu.[b]


    ¿Qué dice después? «Había un río que fluía desde el lado derecho, y de él brotaron árboles hermosos; quien coma de ellos vivirá para siempre».


    Dice esto porque descendemos al agua cargados de pecados e inmundicia, y salimos de ella llevando fruto en el corazón, poniendo en Jesús, en el espíritu, nuestro temor y nuestra esperanza.[c] «Quien coma de ellos vivirá para siempre». Esto quiere decir: «Quien —dice— oiga estas cosas y crea vivirá para siempre».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «sino que edificarían para sí mismos» queda incompleta en el testimonio textual suministrado; no se añade un complemento conjetural.
    reason: Advertir una ruptura textual genuina sin repararla silenciosamente.
  - marker: b
    text: «Recipiente de su Espíritu» también podría entenderse como «vasija de su Espíritu». El referente concreto no se identifica expresamente aquí.
    reason: Preservar la metáfora y la ambigüedad interpretativa.
  - marker: c
    text: 'La relación exacta de «en el espíritu» con las palabras anteriores es incierta. También sería posible entender: «teniendo espiritualmente nuestro temor y nuestra esperanza puestos en Jesús».'
    reason: Dar cuenta de una ambigüedad sintáctica y teológica sin resolverla en el texto principal.
lexical_decisions:
- source_word: ὕδωρ / aqua (witness tradition)
  choice: agua
  rationale: Conserva el término concreto que articula tanto las citas proféticas como la interpretación bautismal del autor.
- source_word: βάπτισμα / baptismus
  choice: bautismo
  rationale: Es el equivalente natural y preciso en español, sin añadir una explicación doctrinal no presente en el texto.
- source_word: ἄφεσις ἁμαρτιῶν (concept reflected in witness)
  choice: perdón de los pecados
  rationale: Expresa en lenguaje actual la remisión de pecados sin alterar su sentido teológico.
- source_word: σκεῦος τοῦ πνεύματος (concept reflected in witness)
  choice: recipiente de su Espíritu
  rationale: Mantiene la metáfora material y su ambigüedad referencial; «instrumento» o «morada» interpretarían más de lo que permite el testimonio suministrado.
- source_word: μετάνοια (concept reflected as conversion)
  choice: conversión
  rationale: En este contexto indica un cambio de orientación producido en otros; «arrepentimiento» también sería posible, pero resulta menos amplio.
- source_word: φόβος
  choice: temor
  rationale: Preserva el vocabulario religioso tradicional y la tensión entre reverencia y miedo, en vez de reducirlo a «respeto».
theological_decisions:
- issue: Relación entre el agua y el bautismo
  choice: Mantener la identificación interpretativa que hace el propio autor sin ampliarla
  alternative: Explicar el agua como regeneración bautismal o como mero símbolo
  rationale: El pasaje vincula explícitamente el descenso al agua con el perdón, pero no desarrolla aquí una teoría sacramental completa.
- issue: Esperanza puesta en la cruz
  choice: Traducir literalmente «ponen su esperanza en la cruz»
  alternative: Reformular como esperanza en Cristo crucificado
  rationale: La reformulación sería teológicamente comprensible, pero eliminaría la expresión distintiva y concreta del autor.
- issue: «Recipiente de su Espíritu»
  choice: Conservar la metáfora y la referencia pronominal ambigua
  alternative: Identificar el recipiente como el cuerpo humano, la Iglesia o la tierra de Jacob
  rationale: El texto suministrado no resuelve de manera inequívoca el referente, por lo que no debe imponerse una interpretación denominacional.
- issue: Temor y esperanza «en Jesús, en el espíritu»
  choice: Preservar la formulación y señalar su dificultad
  alternative: Traducir «teniendo espiritualmente nuestro temor y esperanza en Jesús»
  rationale: La alternativa produce un español más fluido, pero resuelve una relación sintáctica que el testimonio provisional deja incierta.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para la segunda persona plural y se conservan las imágenes proféticas. Las citas se presentan con puntuación moderna, sin intentar armonizarlas con traducciones bíblicas canónicas, pues el autor cita formas textuales mixtas. Borrador necesariamente provisional: el material proporcionado indica que la revisión directa de los testigos griegos y latinos está pendiente.'
