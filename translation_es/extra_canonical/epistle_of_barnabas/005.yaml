    Por tanto, debemos estar profundamente agradecidos al Señor, porque nos reveló el pasado, nos dio sabiduría acerca del presente y no nos dejó sin entendimiento acerca del futuro.



    Ahora bien, la Escritura dice: «No sin justicia se tiende la red para las aves».[c] Con esto quiere decir que perecerá justamente quien, aun conociendo el camino de la justicia, se lanza al camino de la oscuridad.



    Hay además esto, hermanos míos: si el Señor soportó padecer por nuestras almas, aunque era Señor del mundo entero —aquel a quien Dios dijo desde la fundación del mundo: «Hagamos al ser humano a nuestra imagen y semejanza»—, ¿cómo soportó padecer a manos de seres humanos?



