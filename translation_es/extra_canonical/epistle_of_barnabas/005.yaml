  yaml_path: translation/extra_canonical/epistle_of_barnabas/005.yaml
  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: es
  text: 'Con este propósito el Señor soportó entregar su carne a la corrupción, para que fuéramos purificados mediante el perdón de los pecados, purificación que viene por la sangre con que él nos rocía.[a]


    Pues la Escritura acerca de él contiene algunas cosas que se refieren a Israel y otras que se refieren a nosotros. Dice así: «Él fue herido por las transgresiones de ustedes y molido por nuestros pecados; por sus heridas fuimos sanados. Como oveja fue llevado al matadero y como cordero que guarda silencio ante quien lo esquila».[b]


    Por tanto, debemos estar profundamente agradecidos al Señor, porque nos reveló el pasado, nos dio sabiduría acerca del presente y no nos dejó sin entendimiento acerca del futuro.


    Ahora bien, la Escritura dice: «No sin justicia se tiende la red para las aves».[c] Con esto quiere decir que perecerá justamente quien, aun conociendo el camino de la justicia, se obliga a entrar en el camino de la oscuridad.


    Hay además esto, hermanos míos: si el Señor soportó padecer por nuestras almas, aunque era Señor del mundo entero —aquel a quien Dios dijo desde la fundación del mundo: «Hagamos al ser humano a nuestra imagen y semejanza»—, ¿cómo llegó a soportar el sufrimiento a manos de seres humanos?


    Entiéndanlo: los profetas, después de recibir de él la gracia, profetizaron acerca de él. Pero él mismo soportó el sufrimiento para destruir la muerte y manifestar la resurrección de los muertos, pues era necesario que se manifestara en carne;


    para que al mismo tiempo hiciera efectiva la promesa dada a los padres y, preparando para sí un pueblo nuevo, mostrara mientras estaba en la tierra que, después de realizar la resurrección, él mismo ejercerá el juicio.[d]


    Además, predicó enseñando a Israel y realizando tantas maravillas y prodigios, y lo amó en gran manera.


    Cuando escogió a sus propios apóstoles, quienes proclamarían su evangelio —hombres que eran pecadores por encima de todo pecado, a fin de mostrar que no había venido a llamar a justos, sino a pecadores—, entonces manifestó que era el Hijo de Dios.[e]


    Porque, si no hubiera venido en carne, los seres humanos no habrían podido mirarlo y ser salvos, puesto que ni siquiera pueden mirar de frente los rayos del sol, el cual dejará de existir y es obra de sus propias manos.


    Por eso el Hijo de Dios vino en carne: para llevar a su culminación la cuenta total de los pecados de quienes persiguieron y mataron a sus profetas.[f]


    Con este propósito, pues, soportó el sufrimiento. Porque Dios dice que las heridas de su carne procedieron de ellos: «Cuando hieran a su propio pastor, entonces se perderán las ovejas del rebaño».[g]


    Pero él mismo quiso sufrir de esta manera, pues era necesario que padeciera sobre un madero. Porque quien profetizó dijo acerca de él: «Libra mi alma de la espada»; y: «Traspasen mi carne con clavos, porque las asambleas de malhechores se han levantado contra mí».[h]


    Y dice también: «Miren, he entregado mi espalda a los azotes y mis mejillas a los golpes, y he puesto mi rostro como roca dura».[i]'
