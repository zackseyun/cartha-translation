  footnotes:
  - marker: a
    text: Lit. «por la sangre de su aspersión». La expresión evoca la purificación ritual mediante sangre rociada.
    reason: La construcción subyacente es compacta y admite más de una relación gramatical entre sangre, aspersión y purificación.
  - marker: b
    text: Combinación libre de Isaías 53:5 y 53:7; alterna «ustedes» y «nosotros» tal como aparece en el testimonio.
    reason: La alternancia pronominal es llamativa y no debe armonizarse silenciosamente.
  - marker: c
    text: La cita adapta Proverbios 1:17. Su forma y la explicación que sigue difieren del sentido más habitual del proverbio en las traducciones modernas.
    reason: El autor utiliza una forma textual o interpretación particular que conviene preservar.
  - marker: d
    text: «Hiciera efectiva» traduce una expresión que literalmente puede entenderse como «redimiera» o «rescatara la promesa».
    reason: Se señala una dificultad léxica con posible relevancia teológica.
  - marker: e
    text: Lit. «pecadores por encima de todo pecado»; también podría entenderse como una manera enfática de llamarlos pecadores sobresalientes.
    reason: La afirmación es deliberadamente extrema y su formulación exacta es difícil.
  - marker: f
    text: «Llevar a su culminación la cuenta total» traduce una expresión que también puede significar «recapitular» o «completar plenamente».
    reason: La cláusula es semánticamente densa y no conviene ocultar su ambigüedad.
  - marker: g
    text: Adaptación de Zacarías 13:7. «Su propio pastor» refleja la forma citada aquí, aunque otras formas antiguas dicen «mi pastor».
    reason: La cita presenta una variante significativa respecto de formas bíblicas conocidas.
  - marker: h
    text: Las palabras combinan lenguaje semejante al de Salmos 22:20, 22:16 y 119:12 LXX, pero no corresponden exactamente a una sola cita bíblica conservada.
    reason: Evita presentar como cita textual exacta lo que parece una combinación o forma textual no conservada.
  - marker: i
    text: Adaptación de Isaías 50:6-7.
    reason: Identifica la alusión y permite reconocer que la redacción no coincide palabra por palabra con las versiones modernas.
lexical_decisions:
- source_word: φθορά / corruption (witness)
  choice: corrupción
  rationale: Conserva la expresión fuerte del testimonio y su posible referencia tanto al deterioro corporal como a la muerte, sin reducirla a una sola interpretación.
- source_word: ἄφεσις ἁμαρτιῶν / remission of sins
  choice: perdón de los pecados
  rationale: Es la formulación natural y ampliamente comprensible en español latinoamericano para la remisión de pecados.
- source_word: αἷμα τοῦ ῥαντίσματος / blood of sprinkling
  choice: la sangre con que él nos rocía
  rationale: Expresa en español natural la imagen ritual de la aspersión y evita la frase poco idiomática «sangre de su rociamiento».
- source_word: ὁδὸς δικαιοσύνης / way of righteousness
  choice: camino de la justicia
  rationale: Mantiene la metáfora ética de los dos caminos característica de la obra.
- source_word: ἐν σαρκί / in the flesh
  choice: en carne
  rationale: Conserva el énfasis cristológico y corporal del texto sin añadir «humana», dato implícito pero no explícito.
- source_word: ξύλον / tree, wood
  choice: madero
  rationale: Preserva la ambivalencia entre árbol, madera e instrumento de ejecución, y suena natural en este contexto.
- source_word: ἀνακεφαλαιώσασθαι / sum up (probable source behind witness)
  choice: llevar a su culminación la cuenta total
  rationale: Retiene tanto la idea de completar como la de reunir o totalizar la cuenta de los pecados, sin resolver del todo una expresión difícil.
theological_decisions:
- issue: La sangre y la purificación
  choice: «purificación que viene por la sangre con que él nos rocía»
  alternative: «purificados por el perdón de los pecados mediante la sangre de su aspersión»
  rationale: Mantiene la relación entre perdón, purificación y sangre sin precisar un esquema expiatorio denominacional.
- issue: La promesa hecha a los padres
  choice: «hiciera efectiva la promesa dada a los padres»
  alternative: «redimiera la promesa hecha a los padres»
  rationale: El verbo «redimir una promesa» resulta oscuro en español; «hacer efectiva» comunica su cumplimiento sin especificar más de lo que permite el testimonio.
- issue: La condición pecadora de los apóstoles
  choice: «pecadores por encima de todo pecado»
  alternative: «los peores pecadores»
  rationale: Se conserva la formulación extrema y difícil del texto en vez de suavizarla o convertirla en una afirmación histórica más precisa.
- issue: El amor de Cristo por Israel
  choice: «lo amó en gran manera»
  alternative: «los amó en gran manera»
  rationale: Se mantiene como antecedente singular colectivo a Israel, conforme al testimonio, evitando cambiarlo tácitamente por los israelitas.
- issue: Cristo y el juicio futuro
  choice: «él mismo ejercerá el juicio»
  alternative: «él mismo juzgará»
  rationale: Conserva explícito el énfasis del texto en que el mismo que resucita ejercerá el juicio.
- issue: Responsabilidad por la muerte de los profetas
  choice: «los pecados de quienes persiguieron y mataron a sus profetas»
  alternative: «los pecados de ellos contra quienes persiguieron y mataron a sus profetas»
  rationale: Aclara la relación sintáctica más probable sin identificar a los responsables con un grupo étnico o religioso más amplio que el señalado por el texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» en la cita y formas verbales no peninsulares. Se mantienen el tono exhortativo, las repeticiones y varias expresiones abruptas del escrito. Debido a que la revisión directa del griego y del latín está pendiente, las decisiones difíciles se presentan con cautela y se documentan en notas.
