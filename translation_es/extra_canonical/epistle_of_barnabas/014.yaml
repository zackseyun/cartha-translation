  yaml_path: translation/extra_canonical/epistle_of_barnabas/014.yaml
  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: es
  text: 'Sí, en verdad. Pero, en cuanto al pacto que juró a los padres dar al pueblo, veamos si efectivamente lo ha dado. Lo ha dado, pero ellos no fueron hallados dignos de recibirlo a causa de sus pecados.


    Pues el profeta dice: «Moisés ayunó en el monte Sinaí cuarenta días y cuarenta noches, para recibir el pacto del Señor y dárselo al pueblo. Y [Moisés][a] recibió del Señor las dos tablas, escritas en el espíritu por el dedo de la mano del Señor». Moisés las tomó y bajó para dárselas al pueblo.


    Y el Señor dijo a Moisés: «Moisés, Moisés, baja pronto, porque tu pueblo, al que sacaste de la tierra de Egipto, ha obrado perversamente». Moisés se dio cuenta de que de nuevo se habían hecho imágenes de metal fundido; entonces arrojó las tablas de sus manos, y las tablas del pacto del Señor se hicieron pedazos.


    Moisés las recibió, pero ellos no fueron hallados dignos. Ahora bien, ¿cómo lo recibimos nosotros? Fíjense en esto: Moisés lo recibió como siervo, pero el Señor mismo nos lo dio para que fuéramos el pueblo de su herencia, después de haber soportado con paciencia por nosotros.


    Pero él fue manifestado para que, al mismo tiempo, ellos llegaran a la plenitud de sus pecados[b] y nosotros recibiéramos el pacto por medio de quien lo heredó, es decir, el Señor Jesús. Él había sido preparado de antemano para esto: para que, al manifestarse en persona, rescatara de la oscuridad nuestros corazones, que ya habían sido entregados a la muerte y puestos en poder de la maldad del error, y así estableciera el pacto en nosotros por medio de la palabra.


    Pues está escrito que el Padre le manda librarnos de la oscuridad y preparar para sí un pueblo santo.


    Por eso dice el profeta: «Yo, el Señor tu Dios, te llamé en justicia; te tomaré de la mano y te fortaleceré. Te he dado como pacto para el linaje[c] y como luz para las naciones, para abrir los ojos de los ciegos, sacar de sus cadenas a los prisioneros y de la cárcel a quienes están sentados en la oscuridad». Comprendemos, entonces, de dónde fuimos rescatados.


    De nuevo dice el profeta: «Mira, te he puesto como luz para las naciones, para que seas salvación hasta los confines de la tierra». Así dice el Señor que te rescató, es decir, Dios.


    De nuevo dice el profeta: «El Espíritu del Señor está sobre mí; por eso me ungió para anunciar buenas noticias a los humildes. Me envió a sanar a los quebrantados de corazón, a proclamar liberación a los cautivos y recuperación de la vista a los ciegos, a proclamar el año favorable del Señor y el día de la retribución, y a consolar a todos los que lloran».


    [a] El nombre aparece entre corchetes porque es una aclaración restaurada en el testimonio de traducción suministrado.


    [b] También puede traducirse: «fueran llevados a término en sus pecados». La expresión conserva la difícil idea de que sus pecados alcanzan su consumación.


    [c] O bien: «para el pueblo». El testimonio suministrado dice literalmente «linaje» o «raza»; la formulación de la cita profética presenta variación textual.'
