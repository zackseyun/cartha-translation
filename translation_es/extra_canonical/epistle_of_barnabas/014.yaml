lexical_decisions:
- source_word: covenant
  choice: pacto
  rationale: Es la opción natural y ampliamente comprensible en español latinoamericano, y mantiene la continuidad conceptual a lo largo del capítulo.
- source_word: cast-metal images / molten images
  choice: imágenes de metal fundido
  rationale: Expresa con claridad el procedimiento de fabricación sin limitar el referente a un tipo específico de ídolo.
- source_word: people of his inheritance
  choice: pueblo de su herencia
  rationale: Conserva la imagen hereditaria del testimonio y evita sustituirla por una interpretación explicativa.
- source_word: in the spirit
  choice: en el espíritu
  rationale: Se retiene la formulación ambigua del testimonio, sin decidir si alude al Espíritu divino, al ámbito espiritual o al modo de escritura.
- source_word: race
  choice: linaje
  rationale: Evita las connotaciones modernas de «raza» y conserva la idea de descendencia o colectividad; se señala la alternativa en nota.
- source_word: humble
  choice: humildes
  rationale: Mantiene el valor del testimonio suministrado sin reemplazarlo por «pobres» o «afligidos», lecturas asociadas con otras formas textuales de Isaías.
- source_word: day of recompense
  choice: día de la retribución
  rationale: Conserva la ambivalencia judicial de recompensa o castigo mejor que una paráfrasis interpretativa.
theological_decisions:
- issue: La consumación de los pecados de «ellos»
  choice: «llegaran a la plenitud de sus pecados»
  alternative: «fueran llevados a término en sus pecados»
  rationale: La redacción mantiene la afirmación teológicamente tensa del autor sin suavizarla ni convertirla en una doctrina sistemática.
- issue: Quién heredó el pacto
  choice: «por medio de quien lo heredó, es decir, el Señor Jesús»
  alternative: «por medio del heredero, el Señor Jesús»
  rationale: Se conserva la afirmación explícita de herencia y su identificación cristológica, sin explicar de qué manera se entiende esa herencia.
- issue: Agencia en la entrega del pacto
  choice: «el Señor mismo nos lo dio»
  alternative: «el Señor mismo nos las dio»
  rationale: El pronombre singular remite al pacto, no meramente a las tablas, de acuerdo con el hilo argumental.
- issue: Referencia de «el Señor» que soportó con paciencia
  choice: Se mantiene «el Señor» sin identificación adicional
  alternative: Identificarlo expresamente como Jesús
  rationale: El contexto posterior es cristológico, pero el testimonio no hace explícita la identificación en esa oración; se preserva la progresión del argumento.
- issue: Función de la palabra en el establecimiento del pacto
  choice: «por medio de la palabra»
  alternative: «por medio del mensaje» o identificar «la Palabra» como título personal
  rationale: Se evita decidir si «palabra» designa el mensaje proclamado o tiene una carga cristológica personal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplean «ustedes» implícito en «fíjense», «pacto», «naciones» y una sintaxis clara, sin arcaísmos como «he aquí». Las citas mantienen un tono bíblico reconocible, pero legible. Dado que la revisión directa del griego y del latín está pendiente y el material suministrado es un testimonio inglés de dominio público, esta redacción debe considerarse provisional y especialmente cautelosa en «en el espíritu», «plenitud de sus pecados» y «pacto para el linaje».
