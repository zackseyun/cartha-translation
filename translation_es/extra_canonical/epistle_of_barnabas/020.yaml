review_pass:
  verdict: revise
  source_fidelity: La versión conserva la estructura y casi todos los elementos del catálogo de vicios. «El Oscuro» es una adaptación interpretativa cuidadosamente documentada de la designación literal «el Negro/el de negro»; no identifica indebidamente a la figura. «Exaltación del poder» refleja de manera plausible la expresión griega indicada (ὕψωμα δυνάμεως), aunque el testimonio inglés ofrece la lectura anómala «exhalation».
  naturalness: 'El español es claro, moderno y de registro adecuado. Conviene corregir dos giros que atenúan o añaden matices: «se mantienen vigilantes ... para hacer el mal» añade el verbo «hacer», ausente del texto, y «juzgan injustamente a los pobres» expresa una acción más que la acusación de ser jueces injustos respecto de los pobres.'
  terminology: «Insolencia», «doblez de corazón», «mansedumbre», «hechicería», «magia» y «temor de Dios» son apropiados. «Altivez del poder» comunica con mayor naturalidad el valor de ὕψωμα δυνάμεως que «exaltación del poder», sin especificar quién ejerce ese poder ni convertirlo en «abuso de poder».
  issues:
  - severity: medium
    issue: «...se mantienen vigilantes no para temer a Dios, sino para hacer el mal»
    rationale: El testimonio dice «wakeful not for the fear of God but for that which is evil». «Para hacer el mal» introduce una finalidad activa no expresada. «Vigilan, no por temor de Dios, sino para el mal» conserva la concisión y ambigüedad del original.
  - severity: medium
    issue: «juzgan injustamente a los pobres»
    rationale: «Unjust judges of the poor» los caracteriza como jueces injustos en relación con los pobres; la redacción propuesta puede entenderse como que dictan sentencias injustas contra ellos. «Jueces injustos de los pobres» preserva mejor el lenguaje de catálogo y deja abierto el alcance preciso de la injusticia.
  - severity: low
    issue: «exaltación del poder»
    rationale: Es posible, pero «altivez del poder» expresa más idiomáticamente una elevación arrogante o presuntuosa, sin alejarse de la expresión griega señalada en el expediente.
  revised_text: 'Pero el camino del Oscuro[a] es torcido y está lleno de maldición. Es un camino de muerte eterna con castigo, en el cual se encuentran las cosas que destruyen las almas humanas: idolatría, insolencia, altivez del poder[b], hipocresía, doblez de corazón, adulterio, asesinato, saqueo, orgullo, transgresión, engaño, malicia, obstinación, hechicería, magia, codicia y falta de temor de Dios.


    Quienes andan por él persiguen a los buenos, odian la verdad, aman la mentira, no reconocen la recompensa de la justicia, no se aferran al bien ni al juicio justo, no se preocupan por la viuda ni por el huérfano, y vigilan, no por temor de Dios, sino para el mal. De ellos se mantienen muy lejos la mansedumbre y la paciencia. Aman las cosas vanas, buscan recompensa, no se compadecen del pobre ni se esfuerzan por ayudar al agobiado; están dispuestos a calumniar, no reconocen a quien los creó, asesinan niños, corrompen las criaturas de Dios, rechazan al necesitado, oprimen al afligido, defienden a los ricos, son jueces injustos de los pobres y están llenos de todo pecado.'
  revised_footnotes:
  - marker: a
    text: Literalmente, «el Negro» o «el de color negro»; es una designación personificada del mal. Se traduce «el Oscuro» para conservar el sentido simbólico sin las asociaciones raciales que tendría la expresión literal en español actual.
    reason: Aclara una metáfora antigua cuya traducción estrictamente literal podría malinterpretarse.
  - marker: b
    text: El testimonio inglés suministrado dice «exhalación del poder», una expresión inusual. La expresión griega indicada en el expediente, ὕψωμα δυνάμεως, puede referirse a una elevación orgullosa o presuntuosa del poder; «altivez del poder» conserva esa amplitud. La revisión completa de los testigos griegos y latinos sigue pendiente.
    reason: Documenta la dificultad del testimonio inglés y el carácter provisional de la decisión léxica.
  revision_rationale: Se preserva el catálogo, su tono moral y las ambigüedades del testimonio. Las revisiones eliminan una ampliación no necesaria («hacer el mal»), recuperan la caracterización judicial del texto y mejoran la naturalidad de la expresión relativa al poder sin imponer una interpretación doctrinal.
