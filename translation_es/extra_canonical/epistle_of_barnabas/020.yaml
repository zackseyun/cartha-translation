translation:
  language: es
  text: 'Pero el camino del Oscuro[a] es torcido y está lleno de maldición. Es un camino de muerte eterna con castigo, en el cual se encuentran las cosas que destruyen las almas humanas: idolatría, insolencia, exaltación del poder[b], hipocresía, doblez de corazón, adulterio, asesinato, saqueo, orgullo, transgresión, engaño, malicia, obstinación, hechicería, magia, codicia y falta de temor de Dios.


    Quienes andan por él persiguen a los buenos, odian la verdad, aman la mentira, no reconocen la recompensa de la justicia, no se aferran al bien ni al juicio justo, no se preocupan por la viuda ni por el huérfano, y se mantienen vigilantes no para temer a Dios, sino para hacer el mal. De ellos se mantienen muy lejos la mansedumbre y la paciencia. Aman las cosas vanas, buscan recompensa, no se compadecen del pobre ni se esfuerzan por ayudar al agobiado; están dispuestos a calumniar, no reconocen a quien los creó, asesinan niños, corrompen las criaturas de Dios, rechazan al necesitado, oprimen al afligido, defienden a los ricos, juzgan injustamente a los pobres y están llenos de todo pecado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «el Negro» o «el de color negro»; es una designación personificada del mal. Se traduce «el Oscuro» para conservar el sentido simbólico sin las asociaciones raciales que tendría la expresión literal en español actual.
    reason: Aclara una metáfora antigua cuya traducción estrictamente literal podría malinterpretarse.
  - marker: b
    text: El testimonio inglés suministrado dice «exhalación del poder», una expresión inusual. El paralelo griego apunta a la idea de elevación o exaltación del poder. La revisión directa y completa de los testigos griegos y latinos sigue pendiente.
    reason: Documenta la incertidumbre textual y traductológica en vez de ocultarla.
lexical_decisions:
- source_word: the Black One (τοῦ μέλανος)
  choice: el Oscuro
  rationale: Conserva la personificación y el contraste moral sin introducir un nombre teológico que el texto no explicita; «el Negro» tendría asociaciones raciales impropias en español actual.
- source_word: crooked
  choice: torcido
  rationale: Mantiene la metáfora de los dos caminos y su sentido moral.
- source_word: boldness
  choice: insolencia
  rationale: En esta lista de vicios, comunica una audacia presuntuosa o desvergonzada, no la valentía positiva que podría sugerir «audacia».
- source_word: exhalation/exaltation of power (ὕψωμα δυνάμεως, según el paralelo griego)
  choice: exaltación del poder
  rationale: La forma «exhalación del poder» del testimonio inglés parece reflejar una lectura o formulación anómala; «exaltación» representa de manera más plausible la idea de elevar o ensalzar el poder, sin reducirla interpretativamente a «abuso de poder».
- source_word: doubleness of heart
  choice: doblez de corazón
  rationale: Conserva la imagen antropológica antigua y expresa duplicidad interior en español comprensible.
- source_word: cleaving to
  choice: aferrarse a
  rationale: Expresa adhesión firme con lenguaje natural y mantiene la fuerza del original.
- source_word: forbearance
  choice: paciencia
  rationale: Es una expresión actual y ampliamente comprensible de la tolerancia paciente ante agravios.
- source_word: not toiling for him that is oppressed with toil
  choice: no se esfuerzan por ayudar al agobiado
  rationale: Hace inteligible la construcción difícil sin eliminar la obligación práctica hacia quien está cargado o afligido.
- source_word: advocates of the wealthy
  choice: defienden a los ricos
  rationale: Conserva la denuncia de parcialidad social y judicial sin exigir un contexto jurídico técnico.
theological_decisions:
- issue: Identidad del «Oscuro»
  choice: Mantener el título «el Oscuro» sin identificarlo explícitamente
  alternative: «el Maligno» o «el diablo»
  rationale: El texto presenta una figura personificada, pero la traducción no debe resolver más de lo que expresa la designación transmitida.
- issue: Naturaleza de la muerte y el castigo
  choice: «un camino de muerte eterna con castigo»
  alternative: Reformular como «un camino que lleva al castigo de la muerte eterna»
  rationale: Se conserva la relación sintáctica y la tensión del testimonio, sin precisar si «eterna» modifica solo la muerte o toda la realidad punitiva.
- issue: «Recompensa de la justicia»
  choice: Conservar la formulación sin definir su agente ni su momento
  alternative: «la recompensa que Dios dará a los justos»
  rationale: Evita añadir una especificación escatológica y divina que, aunque posible, no está explícita en la frase proporcionada.
- issue: Puntuación en la secuencia sobre el Creador y los asesinos de niños
  choice: Separar «no reconocen a quien los creó» de «asesinan niños»
  alternative: Vincular «asesinos de niños» como complemento de la cláusula anterior
  rationale: La enumeración paralela favorece entenderlos como cargos distintos y evita la lectura incoherente de que el Creador hizo que fueran asesinos.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preserva la forma exhortativa de catálogo de vicios, pero se divide la extensa oración para facilitar la lectura pública. La redacción es provisional porque el material suministrado declara pendiente la revisión directa de las fuentes griegas y latinas.
