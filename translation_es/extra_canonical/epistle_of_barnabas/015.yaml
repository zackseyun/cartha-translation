base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/015.yaml
  text: 'Moreover, concerning the Sabbath, it is likewise written in the Ten Words, which he spoke to Moses face to face on Mount Sinai: “You shall make holy the Sabbath of the Lord with pure hands and a pure heart.”


    And in another place he says, “If my sons observe the Sabbath, then I will bestow my mercy upon them.”


    He speaks of the Sabbath at the beginning of creation: “And God made the works of his hands in six days, and he finished on the seventh day, rested on it, and made it holy.”


    Pay attention, children, to what this means: “He finished in six days.” He means that in six thousand years the Lord will bring all things to an end, for with him a day signifies a thousand years. He himself testifies to me about this, saying, “Behold, the day of the Lord will be as a thousand years.” Therefore, children, in six days—that is, in six thousand years—everything will come to an end.


    “And he rested on the seventh day.” This is what he means: when his Son comes and abolishes the time of the Lawless One, judges the ungodly, and changes the sun, the moon, and the stars, then he will truly rest on the seventh day.


    Yes, and furthermore he says, “You shall make it holy with pure hands and a pure heart.” Therefore, if anyone is now able to make holy the day that God made holy, even though he is pure in heart, we have gone completely astray.


    But if it is only afterward, and not until then, that we will truly rest and make it holy—when we ourselves are able to do so after being justified and receiving the promise, when iniquity is no more and all things have been made new by the Lord—then we will be able to make it holy, because we ourselves will first have been made holy.


    Finally, he says to them, “Your new moons and your Sabbaths I cannot endure.” You see what he means: it is not your present Sabbaths that are acceptable [to me], but the Sabbath that I have made. On that Sabbath, when I have brought all things to rest, I will make the beginning of the eighth day, which is the beginning of another world.


    Therefore, we also keep the eighth day for rejoicing, on which Jesus also rose from the dead and, after being revealed, ascended into the heavens.'
translation:
  language: es
  text: '15 Además, acerca del sábado también está escrito en las Diez Palabras, que Dios pronunció ante Moisés cara a cara en el monte Sinaí: «Santificarán el sábado del Señor con manos puras y corazón puro».


    Y en otro lugar dice: «Si mis hijos guardan el sábado, derramaré mi misericordia sobre ellos».


    Acerca del sábado habla al comienzo de la creación: «Dios hizo las obras de sus manos en seis días; terminó el séptimo día, descansó en él y lo santificó».


    Presten atención, hijos, a lo que significa: «Terminó en seis días». Esto significa que en seis mil años el Señor llevará todas las cosas a su fin, pues para él un día representa mil años. Él mismo me da testimonio de esto cuando dice: «Miren, el día del Señor será como mil años». Por tanto, hijos, en seis días, es decir, en seis mil años, todo llegará a su fin.


    «Y descansó el séptimo día». Esto significa que, cuando venga su Hijo, ponga fin al tiempo del Inicuo, juzgue a los impíos y transforme el sol, la luna y las estrellas, entonces descansará verdaderamente en el séptimo día.


    Además, dice: «Lo santificarás con manos puras y corazón puro». Por tanto, si alguien puede santificar ahora el día que Dios santificó, aun siendo puro de corazón, estamos completamente equivocados.


    Pero solo después, y no antes, descansaremos de verdad y lo santificaremos: cuando podamos hacerlo tras haber sido justificados y haber recibido la promesa, cuando ya no exista la maldad y el Señor haya hecho nuevas todas las cosas. Entonces podremos santificarlo, porque nosotros mismos habremos sido santificados primero.


    Por último, les dice: «No puedo soportar sus lunas nuevas ni sus sábados». Ya ven lo que quiere decir: no son los sábados que ustedes observan ahora los que me agradan, sino el sábado que yo he establecido. En él, después de llevar todas las cosas al reposo, daré comienzo al octavo día, que es el principio de otro mundo.


    Por eso también celebramos con alegría el octavo día, en el cual Jesús resucitó de entre los muertos y, después de manifestarse, ascendió a los cielos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ten Words
  choice: Diez Palabras
  rationale: Conserva la designación antigua del Decálogo presente en el testimonio, sin reemplazarla silenciosamente por un término interpretativo más familiar.
- source_word: hallow / make holy
  choice: santificar
  rationale: Mantiene la recurrencia conceptual entre santificar el sábado y ser santificados, con lenguaje bíblico natural en español.
- source_word: observe the Sabbath
  choice: guardar el sábado
  rationale: Es la expresión bíblica tradicional y comprensible para cumplir u observar el sábado.
- source_word: Lawless One
  choice: el Inicuo
  rationale: Conserva la referencia personal y escatológica del título sin identificar de manera más específica a la figura.
- source_word: eighth day
  choice: octavo día
  rationale: Mantiene literalmente el símbolo temporal y escatológico desarrollado por el autor.
- source_word: another world
  choice: otro mundo
  rationale: Preserva la formulación del testimonio sin precisar si se refiere a era, creación o mundo venidero.
- source_word: keep the eighth day for rejoicing
  choice: celebramos con alegría el octavo día
  rationale: Expresa de manera natural la práctica festiva señalada, sin añadir una denominación litúrgica posterior.
theological_decisions:
- issue: Interpretación de los seis días como seis mil años
  choice: Presentarla como explicación propia del autor
  alternative: Convertirla en afirmación doctrinal directa o suavizarla como mera posibilidad
  rationale: El pasaje afirma explícitamente esta lectura; la traducción la conserva sin aval editorial ni corrección doctrinal.
- issue: Identidad del «Inicuo»
  choice: Mantener el título sin identificación adicional
  alternative: Traducir «Anticristo», «diablo» o «hombre de pecado»
  rationale: La evidencia suministrada no justifica resolver la identidad más allá del título personal.
- issue: Sujeto de «descansará»
  choice: Conservar la tercera persona sin sustituirla por un nombre
  alternative: Explicitar «Dios», «el Señor» o «el Hijo»
  rationale: El antecedente puede percibirse como teológicamente tenso; explicitarlo resolvería una ambigüedad que el testimonio conserva.
- issue: Santificación presente del sábado
  choice: Mantener la argumentación condicional y escatológica del autor
  alternative: Armonizarla con una postura confesional sobre la observancia sabática
  rationale: La traducción debe reflejar el razonamiento del documento, no importar una doctrina denominacional.
- issue: El octavo día y la práctica cristiana
  choice: Traducir «celebramos con alegría el octavo día»
  alternative: Identificarlo expresamente como domingo o Día del Señor
  rationale: El texto relaciona el octavo día con la resurrección, pero no emplea en el material suministrado esos nombres posteriores.
- issue: «Después de manifestarse, ascendió»
  choice: Conservar la secuencia del testimonio
  alternative: Reformularla para armonizar explícitamente la cronología con relatos canónicos
  rationale: Se preserva la forma del pasaje sin introducir una explicación armonizadora.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan las repeticiones clave —sábado, santificar, día, descansar— porque sostienen la argumentación. Se usa «ustedes» para la segunda persona plural. Dado que la revisión directa del griego/latín está pendiente y el material de partida es un testimonio inglés de dominio público, el borrador evita notas textuales no verificables y no añade marcadores de nota al texto.
