base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/004.yaml
  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted slave. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: es
  text: 'Por lo tanto, debemos examinar a fondo el tiempo presente y buscar las cosas que tienen poder para salvarnos. Huyamos por completo de todas las obras de la maldad, para que las obras de la maldad no nos dominen; y aborrezcamos el extravío del tiempo presente, para que seamos amados por causa de lo que está por venir.


    No demos a nuestra alma ningún descanso que le permita relacionarse con pecadores y malvados, no sea que lleguemos a ser como ellos.


    El último tropiezo está cerca, aquel del cual habla la Escritura, como dice Enoc.[a] Pues con este fin el Soberano ha acortado los tiempos y los días, para que su Amado se apresure y llegue a su herencia.


    También el profeta habla de esta manera: «Diez reinos reinarán sobre la tierra, y después de ellos surgirá otro rey, el cual humillará a tres de los reyes bajo uno».[b]


    De igual manera, Daniel habla acerca de lo mismo: «Vi que la cuarta bestia era malvada, fuerte y más indomable que todas las bestias de la tierra; vi que de ella surgían diez cuernos y que de estos salía un cuerno pequeño, una excrecencia; y vi cómo humillaba bajo uno a tres de los grandes cuernos».[c]


    Por lo tanto, deben comprender. Además, les pido una cosa, como uno de ustedes y como quien ama a cada uno más que a su propia vida: cuídense ahora y no se hagan semejantes a ciertas personas que acumulan pecado sobre pecado, diciendo que nuestro pacto sigue perteneciéndoles también.


    Es nuestro; pero ellos lo perdieron para siempre de esta manera, apenas Moisés lo había recibido. Pues la Escritura dice: «Moisés estuvo en el monte ayunando cuarenta días y cuarenta noches, y recibió del Señor el pacto: tablas de piedra escritas por el dedo de la mano del Señor».


    Pero ellos lo perdieron al volverse a los ídolos. Pues así dice el Señor: «Moisés, Moisés, baja pronto, porque tu pueblo, al que sacaste de la tierra de Egipto, ha actuado contra la ley». Moisés comprendió y arrojó de sus manos las dos tablas. El pacto de ellos quedó hecho pedazos, para que el pacto del amado Jesús fuera sellado en nuestros corazones mediante la esperanza que nace de la fe en él.[d]


    Aunque con gusto escribiría muchas cosas —no como maestro, sino como corresponde a quien los ama, para que no carezcan de lo que poseemos—, me apresuré a escribirles, pues soy su siervo entregado. Por eso, mantengámonos alerta en estos últimos días. Todo el tiempo de nuestra fe no nos servirá de nada si ahora, en el tiempo de la maldad y en medio de los tropiezos que vendrán, no ofrecemos resistencia como corresponde a hijos de Dios, para que el Negro no logre entrar.[e]


    Huyamos de toda vanidad; aborrezcamos por completo las obras del camino del mal. No se aparten entre ustedes reuniéndose en privado, como si ya estuvieran justificados; más bien, reúnanse y deliberen sobre el bien común.[f]


    Pues la Escritura dice: «¡Ay de quienes son sabios para sí mismos y entendidos ante sus propios ojos!». Hagámonos espirituales; lleguemos a ser un templo perfecto para Dios. En cuanto dependa de nosotros, ejercitémonos en el temor de Dios y esforcémonos por guardar sus mandamientos, para que nos alegremos en sus decretos.[g]


    El Señor juzga al mundo sin favoritismos; cada uno recibirá conforme a sus obras. Si alguien es bueno, su justicia irá delante de él en el camino; si es malo, tendrá delante la retribución de su maldad. No sea que, si nos descuidamos como personas que han sido llamadas, nos quedemos dormidos sobre nuestros pecados, y el príncipe del mal adquiera poder contra nosotros y nos expulse del reino del Señor.


    Comprendan también esto, hermanos míos: cuando ven que, aun después de tantas señales y maravillas realizadas en Israel, ellos fueron abandonados, tengamos cuidado, no sea que se descubra que somos, como dice la Escritura: «Muchos son llamados, pero pocos escogidos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La obra de Enoc aquí citada o aludida no se identifica con precisión en el testimonio suministrado; la revisión directa de las fuentes griegas y latinas sigue pendiente.
    reason: Advertir una referencia textual incierta sin atribuirle una fuente específica.
  - marker: b
    text: «Bajo uno» reproduce una expresión difícil del testimonio. También podría entenderse de otra manera según la lectura del original; no se resuelve aquí por conjetura.
    reason: Preservar una ambigüedad genuina de la fuente disponible.
  - marker: c
    text: La formulación combina elementos de Daniel 7 con una redacción que no coincide exactamente con las formas bíblicas habituales. «Excrecencia» conserva la imagen extraña del testimonio.
    reason: Señalar el carácter libre o textual de la cita y una elección léxica marcada.
  - marker: d
    text: El autor contrapone aquí «el pacto de ellos» con «el pacto del amado Jesús». La traducción conserva esa afirmación polémica sin suavizarla ni ampliarla.
    reason: Evitar ocultar una tensión teológica e histórica importante.
  - marker: e
    text: «El Negro» traduce literalmente el epíteto inusual del adversario en el testimonio; no alude a etnia ni color de piel humano.
    reason: Prevenir una lectura racial moderna y conservar a la vez la designación antigua.
  - marker: f
    text: La sintaxis de la primera cláusula es difícil en el testimonio. Se entiende como una prohibición de formar grupos privados y apartarse de la comunidad, pero la revisión del original podría requerir ajuste.
    reason: Transparentar una decisión provisional ante una construcción textual oscura.
  - marker: g
    text: El testimonio inglés marca «and» como una restauración entre corchetes. En español se incorpora la conjunción por fluidez, sin que cambie el sentido básico.
    reason: Dar cuenta de la señal de restauración del testimonio sin introducir corchetes innecesarios en el texto meta.
lexical_decisions:
- source_word: lawlessness / ἀνομία (probable Greek Vorlage)
  choice: maldad; contra la ley
  rationale: «Maldad» comunica con naturalidad las obras y el tiempo caracterizados por la anomia; en la cita sobre Israel, «ha actuado contra la ley» conserva de forma más explícita el componente jurídico del término.
- source_word: offence / σκάνδαλον (probable Greek Vorlage)
  choice: tropiezo
  rationale: Mantiene la imagen de algo que hace caer y evita resolverlo como mera «ofensa» moral.
- source_word: Master
  choice: Soberano
  rationale: Expresa autoridad sin confundir necesariamente el título con «Señor» en las citas bíblicas.
- source_word: beloved
  choice: Amado / amado Jesús
  rationale: Se conserva el título sustantivado en la primera aparición y la identificación explícita con Jesús donde aparece en el testimonio.
- source_word: covenant
  choice: pacto
  rationale: Término bíblico claro y corriente en español latinoamericano, mantenido uniformemente.
- source_word: Black One
  choice: el Negro
  rationale: Conserva el epíteto inusual y marcado del testimonio sin sustituirlo interpretativamente por «diablo» o «Maligno».
- source_word: ordinances
  choice: decretos
  rationale: Distingue estas disposiciones de los «mandamientos» mencionados inmediatamente antes.
- source_word: without respect of persons
  choice: sin favoritismos
  rationale: Equivalencia idiomática actual para el juicio imparcial, sin el arcaísmo «acepción de personas».
theological_decisions:
- issue: Identidad y posesión del pacto
  choice: 'Se conserva la afirmación polémica: «Es nuestro; pero ellos lo perdieron para siempre»'
  alternative: Suavizarla como una pérdida temporal o como simple incumplimiento
  rationale: El texto presenta una afirmación teológica fuerte y polémica. La traducción no debe atenuarla ni armonizarla con una postura denominacional posterior.
- issue: Relación entre obras, justicia y juicio
  choice: «cada uno recibirá conforme a sus obras» y «su justicia irá delante de él»
  alternative: Reformularlo en términos exclusivos de mérito, evidencia o imputación
  rationale: Se mantiene la tensión soteriológica del pasaje sin imponer una explicación doctrinal externa.
- issue: Perseverancia de los llamados
  choice: Se conserva la advertencia de que los llamados pueden ser expulsados del reino si se descuidan
  alternative: Convertir la advertencia en una situación meramente hipotética o eliminar su fuerza
  rationale: La traducción reproduce la advertencia tal como está formulada, sin resolver debates posteriores sobre perseverancia.
- issue: Referente de «su Amado» y «su herencia»
  choice: Se mantienen los pronombres y la formulación ambigua
  alternative: Explicitar que la herencia pertenece a Dios, a Cristo o al Amado
  rationale: El testimonio suministrado no permite resolver con seguridad todas las relaciones referenciales.
- issue: «bajo uno» en la profecía
  choice: Se conserva literalmente «bajo uno»
  alternative: Interpretar «de una vez», «por sí solo» o «bajo su poder»
  rationale: La expresión del testimonio es inusual y la revisión directa del griego/latín está pendiente; se evita una conjetura silenciosa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y exhortaciones inclusivas en primera persona. Se preservan las repeticiones retóricas, el tono urgente y las afirmaciones teológicamente tensas. El borrador es necesariamente provisional porque el material suministrado declara pendiente la revisión directa de los testigos griegos y latinos; se consultó el testimonio inglés como capa auditada y no se fingió acceso a evidencia original no proporcionada.
