  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: es
  text: 'De la misma manera, vuelve a precisar lo referente a la cruz por medio de otro profeta, quien dice: «¿Y cuándo se cumplirán estas cosas?», dice el Señor. «Cuando un árbol sea doblado y vuelva a quedar derecho, y cuando sangre gotee de un árbol».[a] Una vez más se te instruye acerca de la cruz y de aquel que iba a ser crucificado.


    También dice por medio de Moisés que, cuando gente de otra nación hizo guerra contra Israel, quiso recordarles que, a causa de sus pecados, habían sido entregados a la muerte. El Espíritu habla al corazón de Moisés para que represente anticipadamente la cruz y a aquel que iba a sufrir, pues, según dice, si no ponen su esperanza en él, se les hará guerra para siempre. Moisés, entonces, amontona unas armas sobre otras en medio del combate y, de pie en un lugar más alto que todos los demás, extiende los brazos. Así Israel vuelve a vencer; pero cada vez que los baja, los israelitas mueren a espada.[b]


    ¿Por qué sucedía esto? Para que aprendieran que no pueden ser salvados si no ponen su esperanza en él.


    Y de nuevo dice por medio de otro profeta: «Todo el día extendí mis manos hacia un pueblo desobediente que contradecía mi camino justo».[c]


    Moisés vuelve a representar anticipadamente a Jesús: que él debía sufrir y que él mismo, a quien creerían haber destruido, daría vida. Lo representa mediante una señal cuando Israel estaba cayendo. En efecto, el Señor hizo que serpientes de toda clase los mordieran, y ellos morían —pues por medio de la serpiente se produjo la transgresión de Eva—, para convencerlos de que, a causa de su transgresión, serían entregados al sufrimiento de la muerte.


    Más aún, aunque Moisés dio este mandamiento: «No tendrás como dios una imagen de metal fundido ni una imagen tallada», él mismo hizo una para mostrarles una representación anticipada de Jesús. Moisés hace, pues, una serpiente de bronce, la coloca en un lugar visible y convoca públicamente al pueblo.[d]


    Cuando se reunieron, rogaron a Moisés que intercediera por ellos para que fueran sanados. Moisés les dijo: «Cuando alguno de ustedes sea mordido, que vaya a la serpiente colocada sobre el madero, y que crea y espere que la serpiente, aunque está muerta, puede dar vida; entonces será salvado de inmediato». Y así lo hicieron. También aquí, en estas cosas, tienes la gloria de Jesús: todas las cosas están en él y dirigidas hacia él.[e]


    ¿Qué le dice además Moisés a Jesús —Josué—, hijo de Nun, cuando le da este nombre como profeta, para que todo el pueblo lo escuche solamente a él, puesto que el Padre revela todas las cosas acerca de su Hijo Jesús?[f]


    Así pues, cuando Moisés envió como espía a la tierra a Jesús, hijo de Nun, le dio este nombre y le dijo: «Toma un libro en tus manos y escribe lo que dice el Señor: que el Hijo de Dios arrancará de raíz toda la casa de Amalec en los últimos días».[g]


    Mira: una vez más se trata de Jesús, no de un hijo de hombre, sino del Hijo de Dios, y fue revelado en la carne de manera figurada. Puesto que algunos dirán que Cristo es hijo de David, el propio David profetiza con temor, comprendiendo el error de los pecadores: «El Señor dijo a mi Señor: “Siéntate a mi derecha hasta que ponga a tus enemigos como estrado bajo tus pies”».[h]


    E Isaías también dice: «El Señor dijo a mi Cristo, el Señor, a quien tomé de la mano derecha, para que las naciones lo escucharan; y quebrantaré la fuerza de los reyes».[i] Observa cómo David lo llama Señor y no lo llama hijo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La procedencia exacta de esta cita profética no es segura. Su redacción se conserva tal como aparece en la tradición de Bernabé y no se armoniza con otro texto.
    reason: La cita no corresponde de manera transparente a un pasaje profético canónico y el testimonio fuente es provisional.
  - marker: b
    text: Alusión a Éxodo 17:8-13. El relato bíblico menciona que Moisés levantaba las manos; la descripción de armas amontonadas pertenece a la forma interpretativa presentada aquí.
    reason: Aclara el trasfondo sin corregir la versión del autor.
  - marker: c
    text: Alusión a Isaías 65:2. La frase «mi camino justo» refleja la forma de la cita empleada aquí.
    reason: Identifica la fuente probable y preserva su variante.
  - marker: d
    text: Alusión al mandamiento contra las imágenes y al relato de la serpiente de bronce; compárese Éxodo 20:4 y Números 21:6-9.
    reason: Permite reconocer los dos pasajes combinados por el autor.
  - marker: e
    text: La expresión «en él y dirigidas hacia él» conserva dos relaciones distintas en la formulación transmitida.
    reason: Evita reducir una construcción teológicamente significativa a una paráfrasis única.
  - marker: f
    text: En griego, «Jesús» y «Josué» representan el mismo nombre, Iēsous. El argumento depende de esa identidad de nombre.
    reason: La distinción usual en español ocultaría el juego exegético.
  - marker: g
    text: Combinación interpretativa de Éxodo 17:14 y otros elementos del argumento del autor. En Éxodo, la eliminación de Amalec es atribuida al Señor; aquí se formula en referencia al Hijo de Dios.
    reason: Señala la diferencia sin alterar el texto.
  - marker: h
    text: Cita del Salmo 110:1 (109:1 en la numeración griega).
    reason: Identifica la cita bíblica.
  - marker: i
    text: Alusión a Isaías 45:1. La forma «mi Cristo, el Señor» y el resto de la cita difieren de la redacción habitual del pasaje; se conserva la forma transmitida aquí.
    reason: Evita armonizar una cita textual y teológicamente inusual.
lexical_decisions:
- source_word: τύπος / type
  choice: representación anticipada
  rationale: Expresa la función figurativa y prospectiva del término sin imponer el tecnicismo «tipo» al lector común; se conserva «de manera figurada» donde el argumento lo requiere.
- source_word: ξύλον / tree, wood
  choice: árbol / madero
  rationale: Se usa «árbol» en la profecía citada, conforme al testimonio suministrado, y «madero» para el soporte de la serpiente, manteniendo la relación simbólica con la cruz sin uniformar artificialmente todos los contextos.
- source_word: Ἰησοῦς
  choice: Jesús —Josué—
  rationale: El mismo nombre griego puede corresponder a Jesús o Josué. Se hace visible esta identidad nominal porque el razonamiento del autor depende de ella.
- source_word: ἀναζωοποιήσει / make alive
  choice: dará vida / puede dar vida
  rationale: Traducción natural que conserva la afirmación fuerte del autor acerca de comunicar vida.
- source_word: εἰς αὐτόν / unto him
  choice: dirigidas hacia él
  rationale: Mantiene la orientación del giro, junto con «en él», sin reducir ambos complementos a una sola idea.
- source_word: χριστός
  choice: Cristo / mi Cristo
  rationale: Se conserva el título cristológico del discurso y la forma inusual de la cita de Isaías, sin armonizarla con versiones bíblicas posteriores.
theological_decisions:
- issue: Lectura cristológica de los brazos extendidos de Moisés
  choice: Conservarla como afirmación interpretativa del autor
  alternative: Reformular el episodio solo como alusión histórica a Éxodo
  rationale: El capítulo presenta explícitamente el gesto como representación de la cruz y del que sufriría; neutralizarlo borraría su argumento.
- issue: La serpiente de bronce como figura de Jesús
  choice: Mantener la tensión y el lenguaje del autor
  alternative: Explicar o suavizar la identificación por resultar chocante
  rationale: La comparación es deliberada y forma parte de la exégesis antigua del pasaje; no corresponde resolverla doctrinalmente en el texto.
- issue: «No un hijo de hombre, sino el Hijo de Dios»
  choice: Traducir literalmente la contraposición conceptual
  alternative: Convertir «hijo de hombre» en el título «Hijo del Hombre»
  rationale: El contexto contrasta filiación meramente humana con filiación divina; poner mayúsculas introduciría una identificación titular no exigida por el testimonio.
- issue: Cristo como hijo de David
  choice: Preservar la polémica tal como aparece
  alternative: Armonizarla con genealogías o formulaciones canónicas
  rationale: La tensión pertenece al argumento del autor y no debe resolverse mediante añadidos confesionales.
- issue: Citas proféticas no coincidentes con formas bíblicas conocidas
  choice: Conservar la redacción atestiguada y señalar su carácter inusual
  alternative: Sustituirla por el texto de una traducción bíblica moderna
  rationale: La prioridad es traducir el texto de Bernabé, incluidas sus formas de cita, no reconstruir o corregir sus fuentes.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea el trato singular «tú» implícito en «se te instruye» y «tienes», correspondiente al destinatario singular del discurso, sin arcaísmos. Las oraciones largas se segmentan moderadamente para facilitar la lectura, pero se conserva la progresión retórica y repetitiva del original. Dado que la evidencia suministrada es un testimonio inglés de dominio público y la revisión directa del griego y el latín está pendiente, el borrador mantiene cautela ante citas, variantes y términos técnicos.
