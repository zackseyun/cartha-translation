    No codiciarás los bienes de tu prójimo ni serás ávido de ganancias. Tampoco te unirás de corazón a los altivos, sino que andarás con los humildes y justos. Recibirás como buenas las cosas que te sucedan, sabiendo que nada ocurre sin Dios.[d] No tendrás doble ánimo ni doble lengua.


