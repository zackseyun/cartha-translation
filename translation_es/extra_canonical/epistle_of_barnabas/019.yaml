review_pass:
  verdict: revise
  source_fidelity: El borrador sigue con bastante precisión el testimonio inglés provisto y conserva varias ambigüedades relevantes. Se requieren ajustes menores para no suavizar «no dirás que algo es tuyo», para reflejar mejor «shame and fear» y para evitar que una nota resuelva el referente de «él». La revisión directa de los testigos griegos y latinos sigue pendiente, por lo que las formulaciones marcadas como probables no pueden considerarse definitivas.
  naturalness: El español es claro, actual y apropiadamente solemne. Se conservan el futuro exhortativo y el contraste catequético de los dos caminos. Los ajustes propuestos mejoran la naturalidad sin perder la concisión sentenciosa.
  terminology: «Inmoralidad sexual», «muchachos», «doble ánimo», «doble lengua», «Maligno», «amo», «esclavo» y «esclava» son elecciones funcionales. «Representación de Dios» comunica adecuadamente la metáfora de «tipo/figura», con nota histórica. «Rescate por tus pecados» preserva deliberadamente la imagen fuerte del testimonio.
  issues:
  - severity: medium
    issue: «No dirás que nada es exclusivamente tuyo»
    rationale: 'La expresión añade «exclusivamente», que atenúa la formulación del testimonio: «no dirás que algo es tuyo». Debe conservarse la negación más directa de la posesión propia.'
  - severity: low
    issue: «con respeto y temor»
    rationale: El testimonio inglés contiene «in shame and fear». «Con pudor y temor» refleja mejor ambos elementos sin convertir «shame» en mera deferencia.
  - severity: low
    issue: 'Nota f: identificación de «él» con Dios'
    rationale: Aunque se formula como posibilidad, la nota orienta el referente hacia Dios. El sujeto de «vino a llamar» debe permanecer sin identificar en una nota que solo registre la ambigüedad.
  - severity: low
    issue: «buscarás la compañía de los santos»
    rationale: «Seek out ... the persons of the saints» pide buscar a esas personas; «la compañía» introduce una idea relacional no explícita. «Buscarás ... a los santos» es más fiel y natural.
  revised_text: 'Este es, pues, el camino de la luz: si alguien desea recorrer el camino hasta el lugar que le ha sido asignado, sea diligente en sus obras. El conocimiento que se nos ha dado para que andemos por él es el siguiente:


    Amarás a quien te hizo; temerás a quien te creó; glorificarás a quien te rescató de la muerte. Serás sencillo de corazón y rico en espíritu. No te unirás a quienes andan por el camino de la muerte. Aborrecerás todo lo que no agrada a Dios. Aborrecerás toda hipocresía. Nunca abandonarás los mandamientos del Señor.


    No te exaltarás, sino que serás humilde en todo. No te atribuirás gloria. No tramarás nada malo contra tu prójimo ni darás cabida a la arrogancia en tu alma.


    No cometerás inmoralidad sexual ni adulterio, ni corromperás a muchachos.[a] La palabra de Dios no saldrá de tu boca donde haya impureza.[b] No harás distinciones entre personas cuando reprendas a alguien por una falta. Serás apacible y sereno; temerás las palabras que has oído. No guardarás rencor contra tu hermano.


