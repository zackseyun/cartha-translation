translation:
  language: es
  text: 'Este es, pues, el camino de la luz: si alguien desea recorrer el camino hasta el lugar que le ha sido asignado, sea diligente en sus obras. El conocimiento que se nos ha dado para que andemos por él es el siguiente:


    Amarás a quien te hizo; temerás a quien te creó; glorificarás a quien te rescató de la muerte. Serás sencillo de corazón y rico en espíritu. No te unirás a quienes andan por el camino de la muerte. Aborrecerás todo lo que no agrada a Dios. Aborrecerás toda hipocresía. Nunca abandonarás los mandamientos del Señor.


    No te exaltarás, sino que serás humilde en todo. No te atribuirás gloria. No tramarás nada malo contra tu prójimo ni darás cabida a la arrogancia en tu alma.


    No cometerás inmoralidad sexual ni adulterio, ni corromperás a muchachos.[a] La palabra de Dios no saldrá de tu boca donde haya impureza.[b] No harás distinciones entre personas cuando reprendas a alguien por una falta. Serás apacible y sereno; temerás las palabras que has oído. No guardarás rencor contra tu hermano.


    No dudarás de si algo sucederá o no.[c] No tomarás en vano el nombre del Señor. Amarás a tu prójimo más que a tu propia vida. No matarás a un niño mediante el aborto ni, una vez nacido, le quitarás la vida. No retirarás tu mano de tu hijo ni de tu hija, sino que desde su juventud les enseñarás el temor de Dios.


    No codiciarás los bienes de tu prójimo ni serás ávido de ganancias. Tampoco te unirás de corazón a los altivos, sino que andarás con los humildes y justos. Recibirás como buenas las cosas que te sucedan, sabiendo que nada ocurre sin Dios.[d] No tendrás doble ánimo ni doble lengua.


    Te someterás a tus amos como a una representación de Dios, con respeto y temor.[e] No darás órdenes con amargura a tu esclavo ni a tu esclava, quienes ponen su esperanza en el mismo Dios, no sea que dejen de temer al Dios que está sobre ambos; porque él no vino a llamar según las apariencias, sino a aquellos a quienes el Espíritu preparó.[f]


    Harás partícipe a tu prójimo de todas las cosas y no dirás que nada es exclusivamente tuyo. Pues, si ustedes comparten lo imperecedero, ¡cuánto más deben compartir lo perecedero! No serás precipitado al hablar, porque la boca es una trampa mortal. En cuanto te sea posible, serás puro por el bien de tu alma.


    No seas de los que extienden las manos para recibir y las retiran cuando deben dar. Amarás como a la niña de tus ojos a todo el que te comunique la palabra del Señor.


    Recordarás el día del juicio noche y día, y cada día buscarás la compañía de los santos: ya sea trabajando con la palabra, yendo a exhortarlos y pensando cómo salvar almas mediante tu palabra, o trabajando con tus manos como rescate por tus pecados.[g]


    No vacilarás en dar ni murmurarás cuando des, sino que reconocerás quién es el buen pagador de tu recompensa. Guardarás lo que has recibido, sin añadirle ni quitarle nada. Aborrecerás por completo al Maligno. Juzgarás con justicia.


    No causarás división, sino que reconciliarás a quienes estén en conflicto. Confesarás tus pecados. No acudirás a la oración con mala conciencia. Este es el camino de la luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Corromperás a muchachos» traduce una prohibición antigua cuya formulación probablemente alude a la explotación sexual de varones jóvenes; el alcance exacto requiere cotejo directo de los testigos griegos y latinos.
    reason: Aclara una expresión difícil sin estrechar indebidamente su sentido.
  - marker: b
    text: La expresión «donde haya impureza» es oscura en el testimonio disponible y también puede entenderse en relación con personas impuras. Se conserva la ambigüedad a la espera de una revisión directa del texto antiguo.
    reason: El testimonio inglés refleja una construcción poco clara que no debe armonizarse silenciosamente.
  - marker: c
    text: 'También podría entenderse: «No vacilarás sobre si algo sucederá o no». El referente de «algo» no se especifica.'
    reason: Preserva la indeterminación de la máxima.
  - marker: d
    text: «Sin Dios» se conserva tal como aparece en el testimonio; no se amplía a «sin que Dios lo permita», pues esa formulación resolvería la tensión interpretativa.
    reason: Evita imponer una explicación particular de la providencia.
  - marker: e
    text: El pasaje refleja una sociedad en la que existía la esclavitud. «Representación de Dios» comunica la idea de figura o imagen sin identificar al amo con Dios.
    reason: Aporta contexto histórico y evita una lectura ontológica equivocada.
  - marker: f
    text: «Él» puede referirse a Dios en el contexto inmediato; la formulación se mantiene sin identificar más precisamente al sujeto.
    reason: Conserva una ambigüedad referencial genuina.
  - marker: g
    text: «Como rescate por tus pecados» reproduce una metáfora fuerte del texto. No se redefine aquí la relación entre obras, arrepentimiento, perdón y salvación.
    reason: Preserva la tensión teológica del pasaje sin importarle una doctrina posterior.
lexical_decisions:
- source_word: ὁδὸς τοῦ φωτός (reconstructed from the Greek tradition)
  choice: camino de la luz
  rationale: Conserva la imagen rectora y la formulación tradicional del contraste entre los dos caminos.
- source_word: πορνεύσεις / sexual vice terminology (source review pending)
  choice: cometerás inmoralidad sexual
  rationale: Expresa la categoría amplia de conducta sexual ilícita sin reducirla a una sola práctica.
- source_word: παιδοφθορήσεις (probable Greek reading)
  choice: corromperás a muchachos
  rationale: Mantiene tanto el referente masculino juvenil como la amplitud del verbo, cuya referencia exacta puede incluir explotación sexual; se añade nota.
- source_word: ἁπλοῦς τῇ καρδίᾳ (probable parallel wording)
  choice: sencillo de corazón
  rationale: Preserva el modismo ético de sinceridad e integridad sin convertirlo en ingenuidad.
- source_word: δίγνωμων / δίγλωσσος (probable Greek terminology)
  choice: doble ánimo / doble lengua
  rationale: Retiene el paralelismo concreto sobre inconstancia interior y habla engañosa.
- source_word: τύπος θεοῦ (probable Greek wording)
  choice: representación de Dios
  rationale: Evita el tecnicismo poco transparente «tipo» y conserva la idea de figura o representación, sin identificar al amo con Dios.
- source_word: λύτρωσις τῶν ἁμαρτιῶν (probable wording)
  choice: rescate por tus pecados
  rationale: Mantiene la fuerte metáfora transaccional del testimonio, sin reinterpretarla como simple señal de arrepentimiento.
theological_decisions:
- issue: Providencia divina en «nada ocurre sin Dios»
  choice: Conservar la formulación breve y fuerte
  alternative: «Nada ocurre sin que Dios lo permita»
  rationale: La alternativa resolvería la tensión al introducir explícitamente la idea de permiso, ausente del testimonio suministrado.
- issue: Trabajo manual «como rescate por tus pecados»
  choice: Mantener la expresión y marcarla con nota
  alternative: «como muestra de arrepentimiento por tus pecados»
  rationale: La paráfrasis suavizaría una afirmación teológicamente difícil y eliminaría la metáfora de rescate.
- issue: El Espíritu prepara a los llamados
  choice: «aquellos a quienes el Espíritu preparó»
  alternative: «aquellos que el Espíritu había preparado»
  rationale: Se conserva la agencia del Espíritu y el aspecto verbal sin imponer un sistema doctrinal sobre elección o conversión.
- issue: Mandato sobre aborto e infanticidio
  choice: Traducir ambos actos de manera explícita y diferenciada
  alternative: Generalizarlos como «no matarás niños»
  rationale: El texto distingue la muerte prenatal de la posterior al nacimiento; conservar esa distinción refleja su contenido ético.
- issue: Lenguaje histórico sobre esclavitud
  choice: Conservar «amo», «esclavo» y «esclava»
  alternative: Modernizar como «empleador» y «trabajador»
  rationale: La modernización ocultaría la institución social concreta a la que se dirige el escrito; la traducción no implica aprobación.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usa el futuro imperativo («amarás», «no harás») para conservar el carácter catequético y solemne de la serie, alternándolo solo donde la sintaxis natural exige un imperativo directo. Se evita el voseo y el español arcaizante. Borrador necesariamente provisional: el material suministrado identifica como base inmediata un testimonio inglés de dominio público y señala que aún está pendiente la revisión directa de los testigos griegos y latinos; por ello, las decisiones filológicas atribuidas al griego se presentan como probables y no definitivas.'
