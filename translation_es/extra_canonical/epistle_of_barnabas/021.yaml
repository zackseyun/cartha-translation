base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: es
  text: 'Por tanto, es bueno aprender los preceptos del Señor —todos los que se han escrito anteriormente— y vivir conforme a ellos. Porque quien hace estas cosas será glorificado en el reino de Dios; pero quien elige lo contrario perecerá junto con sus obras. Por esto hay resurrección; por esto, recompensa.


    Les ruego a quienes ocupan una posición de autoridad[a] que, si aceptan de mí algún consejo bienintencionado, mantengan entre ustedes a aquellos a quienes puedan hacer el bien. No dejen de hacerlo.


    Está cerca el día en que todo será destruido junto con el Maligno. El Señor está cerca, y también su recompensa.


    Una y otra vez les ruego: sean buenos legisladores para ustedes mismos; sigan siendo sus propios consejeros fieles; eliminen de entre ustedes toda hipocresía.


    Que Dios, el Señor de todo el mundo, les dé sabiduría, entendimiento, instrucción, conocimiento de sus preceptos y perseverancia.


    Déjense enseñar por Dios; busquen con diligencia lo que el Señor requiere de ustedes y pónganlo por obra, para que sean hallados fieles en el día del juicio.[b]


    Si se conserva algún recuerdo del bien, acuérdense de mí al practicar estas cosas,[c] para que tanto mi anhelo como mi desvelo produzcan algún buen resultado. Se lo ruego como un favor.


    Mientras la buena vasija esté con ustedes,[d] no descuiden ninguna de estas cosas. Antes bien, búsquenlas constantemente y cumplan todo mandamiento, pues son cosas dignas.


    Por esta razón me esforcé aún más por escribirles hasta donde me fue posible, para llenarlos de alegría. Que estén bien, hijos del amor y de la paz. Que el Señor de la gloria y de toda gracia esté con el espíritu de ustedes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'También puede traducirse: «a quienes están por encima» o «a los dirigentes». El texto no especifica un cargo concreto.'
    reason: Preservar la amplitud semántica del término de rango o autoridad.
  - marker: b
    text: 'El texto dice literalmente: «para que sean hallados en el día del juicio», sin expresar qué condición se espera que tengan al ser hallados.'
    reason: Dar cuenta de una elipsis significativa que la traducción completa por claridad.
  - marker: c
    text: Algunos testimonios ingleses antiguos repiten «estas cosas»; la repetición parece accidental y no se reproduce aquí.
    reason: Explicar la diferencia respecto del testimonio inglés suministrado.
  - marker: d
    text: «La buena vasija» se ha entendido tradicionalmente como una referencia al cuerpo, pero el texto no lo dice de manera explícita.
    reason: Conservar la metáfora original y distinguirla de su interpretación.
lexical_decisions:
- source_word: δικαιώματα
  choice: preceptos
  rationale: Expresa disposiciones o exigencias establecidas por el Señor sin restringir el término a leyes civiles ni convertirlo en una abstracción doctrinal.
- source_word: περιπατεῖν
  choice: vivir conforme a ellos
  rationale: Conserva el sentido metafórico de conducirse o llevar una forma de vida, con lenguaje natural en español actual.
- source_word: ἀνταπόδομα
  choice: recompensa
  rationale: Mantiene la idea de retribución sin decidir de antemano si el resultado es exclusivamente premio o incluye juicio retributivo.
- source_word: ὑπερέχοντας
  choice: quienes ocupan una posición de autoridad
  rationale: Refleja la superioridad de rango o función sin especificar un cargo eclesial que el texto no nombra.
- source_word: ὑπομονήν
  choice: perseverancia
  rationale: En este contexto exhortativo comunica constancia paciente y firme, no mera espera pasiva.
- source_word: σκεῦος
  choice: vasija
  rationale: Conserva la metáfora concreta del recipiente o vaso y evita insertar en el texto principal la identificación interpretativa con el cuerpo.
- source_word: σώζεσθε
  choice: Que estén bien
  rationale: En la despedida funciona como fórmula de saludo final; esta versión evita forzar aquí el sentido soteriológico de «sean salvos», aunque el verbo puede evocarlo.
theological_decisions:
- issue: Relación entre resurrección y recompensa
  choice: «Por esto hay resurrección; por esto, recompensa»
  alternative: «Esta es la razón de la resurrección y de la retribución»
  rationale: La formulación breve conserva la elipsis y no define con exceso si διὰ τοῦτο expresa causa, propósito o consecuencia.
- issue: Condición ante el día del juicio
  choice: «para que sean hallados fieles» con nota
  alternative: «para que sean hallados en el día del juicio»
  rationale: El texto transmitido deja implícito el complemento de «hallados». «Fieles» hace legible la exhortación, pero se señala expresamente la elipsis para no ocultar la ambigüedad.
- issue: Identidad de la «buena vasija»
  choice: Mantener la metáfora sin identificarla en el texto principal
  alternative: «Mientras tengan el cuerpo»
  rationale: La identificación con el cuerpo es una interpretación antigua y plausible, pero el griego disponible dice literalmente «la buena vasija» y no nombra el cuerpo.
- issue: Sentido de la despedida σώζεσθε
  choice: «Que estén bien»
  alternative: «Sean salvos»
  rationale: El contexto epistolar favorece una fórmula de despedida, aunque se reconoce que el verbo conserva una posible resonancia de salvación.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se prefieren frases exhortativas claras, «ustedes» para el plural y vocabulario accesible. Se mantienen las repeticiones retóricas auténticas («Por esto…», «Una y otra vez…») y las elipsis teológicamente relevantes, con notas cuando la claridad exige completar el sentido.
