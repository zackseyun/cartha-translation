base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/006.yaml
  text: 'When, then, he gave the commandment, what does he say? “Who is it who disputes with me? Let him oppose me. Or who is it who goes to court with me? Let him draw near to the servant of the Lord.


    Woe to you, for you will all grow old like a garment, and the moth will consume you.” And again the prophet says, since he was appointed like a hard stone for crushing: “Behold, I will place in the fountains of Zion a very precious, chosen, honored chief cornerstone.”


    Then again, what does he say? “And whoever sets his hope on him will live forever.” Is our hope, then, set on a stone? Far from it! Rather, it is because the Lord has established his flesh in strength. For he says, “And he set me like a hard rock.”


    And the prophet says again, “The stone that the builders rejected has become the head and the corner.” And again he says, “This is the great and wonderful day that the Lord made.”


    I am writing to you more simply so that you may understand—I who am the scum of your love.


    What, then, does the prophet say again? “The assembly of evildoers gathered around me; they surrounded me as bees surround a honeycomb”; and, “They cast lots for my garment.”


    Since, then, he was about to be revealed in the flesh and to suffer, his suffering was revealed beforehand. For the prophet says concerning Israel, “Woe to their soul, for they have devised an evil plan against themselves, saying, ‘Let us bind the righteous one, for he is of no use to us.’”


    What does the other prophet, Moses, say to them? “Behold, this is what the Lord God says: Enter the good land that the Lord swore to Abraham, Isaac, and Jacob, and inherit it—a land flowing with milk and honey.”


    But what does knowledge say? Understand: Set your hope on him who is about to be revealed to you in the flesh, namely Jesus. For a human is suffering earth, since Adam’s creation came from the face of the earth.


    What, then, does he say? “Into the good land, a land flowing with milk and honey.” Blessed is our Lord, brothers, who established among us wisdom and understanding of his secret things. For the prophet speaks a parable concerning the Lord. Who will understand it except one who is wise and prudent and loves his Lord?


    Since, then, he renewed us through the forgiveness of sins, he made us into a new type, so that we would have the soul of children, as though he were creating us again.


    For Scripture speaks concerning us when he says to the Son, “Let us make humanity according to our image and according to our likeness, and let them rule over the beasts of the earth, the birds of heaven, and the fish of the sea.” And when the Lord saw the beautiful creation of us humans, he said, “Increase and multiply and fill the earth.” These words refer to the Son.


    Again I will show you how the Lord speaks concerning us. He made a second creation at the end, and the Lord says, “Behold, I make the last things like the first.” Referring to this, then, the prophet proclaimed, “Enter a land flowing with milk and honey, and be lords over it.”


    Behold, then, we have been created anew, as he says again in another prophet: “Behold, says the Lord, I will take from these”—that is, from those whom the Spirit of the Lord foresaw—“their stony hearts, and I will put hearts of flesh into them,” for he himself was to be revealed in the flesh and to dwell in us.


    For the dwelling place of our heart is a holy temple to the Lord, my brothers.


    For the Lord says again, “With what shall I appear before the Lord my God and be glorified? I will confess you in the assembly of my brothers, and I will sing to you in the midst of the assembly of the saints.” We, therefore, are those whom he brought into the good land.


    What, then, are the milk and the honey? The child is first kept alive by honey and then by milk. In the same way, we also, being kept alive by our faith in the promise and by the word, will live and be lords of the earth.


    Now we have already said above, “And let them increase and multiply and rule over the fish.” But who is able [now] to rule over beasts, fish, and birds of heaven? For we ought to understand that ruling implies power, so that one gives orders and exercises dominion.


    If, then, this does not happen now, surely he spoke to us about the hereafter, when we ourselves will be made perfect so that we may become heirs of the Lord’s covenant.'
translation:
  language: es
  text: 'Cuando dio el mandamiento, ¿qué dice? «¿Quién disputa conmigo? Que se me oponga. ¿O quién entabla juicio conmigo? Que se acerque al siervo del Señor.


    ¡Ay de ustedes!, porque todos envejecerán como una prenda de vestir, y la polilla los consumirá». Y de nuevo dice el profeta, puesto que él fue destinado a ser como una piedra dura para triturar: «Miren, pondré en los manantiales de Sion una piedra muy preciosa, escogida, principal piedra angular y digna de honra».[a]


    Luego, ¿qué dice de nuevo? «Todo el que ponga su esperanza en él vivirá para siempre». ¿Acaso nuestra esperanza está puesta en una piedra? ¡De ninguna manera! Más bien, esto se dice porque el Señor afirmó su carne con poder. Pues dice: «Y me puso como roca dura».


    También dice de nuevo el profeta: «La piedra que rechazaron los constructores llegó a ser cabeza del ángulo». Y otra vez dice: «Este es el día grande y maravilloso que hizo el Señor».


    Les escribo con mayor sencillez para que entiendan, yo, que soy la escoria de su amor.[b]


    ¿Qué dice de nuevo el profeta? «La asamblea de malhechores se reunió a mi alrededor; me rodearon como las abejas rodean un panal»; y: «Echaron suertes por mi ropa».


    Puesto que él estaba por manifestarse en la carne y sufrir, su sufrimiento fue manifestado de antemano. Pues el profeta dice acerca de Israel: «¡Ay de su alma!, porque tramaron contra sí mismos un plan malvado al decir: “Atemos al justo, porque no nos sirve de nada”».


    ¿Qué les dice el otro profeta, Moisés? «Miren, esto dice el Señor Dios: Entren en la buena tierra que el Señor juró dar a Abraham, Isaac y Jacob, y recíbanla como herencia, una tierra que fluye leche y miel».


    Pero ¿qué dice el conocimiento? Entiendan: pongan su esperanza en aquel que está por manifestarse a ustedes en la carne, es decir, Jesús. Porque el ser humano es tierra que sufre, pues de la superficie de la tierra vino la creación de Adán.[c]


    ¿Qué dice entonces? «Entren en la buena tierra, una tierra que fluye leche y miel». Bendito sea nuestro Señor, hermanos, quien estableció entre nosotros sabiduría y comprensión de sus misterios. Pues el profeta habla en parábola acerca del Señor. ¿Quién la comprenderá, sino el que es sabio y prudente y ama a su Señor?


    Puesto que él nos renovó mediante el perdón de los pecados, hizo de nosotros una nueva clase de seres, para que tuviéramos alma de niños, como si nos estuviera creando de nuevo.


    Pues la Escritura habla acerca de nosotros cuando él dice al Hijo: «Hagamos al ser humano a nuestra imagen y semejanza, y que ellos gobiernen sobre los animales de la tierra, las aves del cielo y los peces del mar». Y cuando el Señor vio la hermosa creación de nosotros, los seres humanos, dijo: «Crezcan, multiplíquense y llenen la tierra». Estas palabras se refieren al Hijo.


    De nuevo te mostraré cómo habla el Señor acerca de nosotros. Al final hizo una segunda creación, y el Señor dice: «Miren, hago las cosas últimas como las primeras». Con referencia a esto, el profeta proclamó: «Entren en una tierra que fluye leche y miel y señoreen sobre ella».


    Miren, pues, hemos sido creados de nuevo, como dice otra vez por medio de otro profeta: «Miren —dice el Señor—, quitaré de estos», es decir, de aquellos a quienes el Espíritu del Señor vio de antemano, «sus corazones de piedra y pondré en ellos corazones de carne»; porque él mismo estaba por manifestarse en la carne y habitar en nosotros.


    Porque la morada de nuestro corazón es un templo santo para el Señor, hermanos míos.


    Pues el Señor dice también: «¿Con qué compareceré ante el Señor mi Dios y seré glorificado? Te confesaré en la asamblea de mis hermanos y te cantaré en medio de la asamblea de los santos». Nosotros, por tanto, somos aquellos a quienes él introdujo en la buena tierra.


    ¿Qué son, entonces, la leche y la miel? Al niño se lo mantiene con vida primero con miel y después con leche. Del mismo modo, también nosotros, sostenidos con vida por nuestra fe en la promesa y por la palabra, viviremos y señorearemos sobre la tierra.


    Ya dijimos antes: «Que crezcan, se multipliquen y gobiernen sobre los peces». Pero ¿quién puede [ahora] gobernar sobre animales, peces y aves del cielo?[d] Debemos comprender que gobernar implica poder, de modo que uno dé órdenes y ejerza dominio.


    Por tanto, si esto no sucede ahora, sin duda habló para nosotros acerca del mundo venidero, cuando nosotros mismos seamos llevados a la perfección para que lleguemos a ser herederos del pacto del Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio conservado aquí dice «en los manantiales de Sion», lectura inusual frente a la forma bíblica más conocida «en Sion». Se mantiene sin armonizar.
    reason: Advertir una lectura textual distintiva que afecta la imagen de la cita.
  - marker: b
    text: «Escoria» traduce una expresión deliberadamente humillante, que también puede denotar desecho o lo que se limpia y se arroja.
    reason: Aclarar una metáfora fuerte cuya naturalidad y matiz no coinciden exactamente entre las lenguas.
  - marker: c
    text: La expresión «tierra que sufre» es difícil y se conserva de manera literal. El autor la relaciona inmediatamente con la formación de Adán de la tierra.
    reason: Preservar una formulación oscura y su posible juego conceptual sin resolverlo por conjetura.
  - marker: d
    text: «[Ahora]» aparece como palabra suplida en el testimonio de traducción utilizado; los corchetes mantienen visible esa condición textual.
    reason: Conservar la señal crítica heredada del testimonio base.
lexical_decisions:
- source_word: 'πηγαί / supplied witness: “fountains”'
  choice: manantiales
  rationale: Conserva la lectura distintiva del testimonio proporcionado, «manantiales de Sion», sin armonizarla con la forma bíblica más conocida «en Sion».
- source_word: 'ἀκρογωνιαῖος / supplied witness: “chief corner-stone”'
  choice: principal piedra angular
  rationale: Mantiene tanto la función arquitectónica como el énfasis honorífico de la cita.
- source_word: 'περίψημα / supplied witness: “offscouring”'
  choice: escoria
  rationale: Reproduce la autohumillación fuerte del autor; una opción más suave como «servidor indigno» borraría la imagen.
- source_word: 'γνῶσις / supplied witness: “knowledge”'
  choice: conocimiento
  rationale: Se conserva como sujeto personificado y no se sustituye por «interpretación» o «sabiduría», pues el argumento distingue luego sabiduría y comprensión.
- source_word: 'γῆ πάσχουσα / supplied witness: “earth suffering”'
  choice: tierra que sufre
  rationale: Preserva la formulación extraña y la posible asociación etimológica o alegórica entre humanidad, tierra y sufrimiento, sin corregirla conjeturalmente.
- source_word: 'τύπος / supplied witness: “type”'
  choice: nueva clase de seres
  rationale: En este contexto apunta al resultado de una recreación; se evita el tecnicismo ambiguo «tipo», aunque se mantiene la idea de una condición humana nueva.
- source_word: 'κατακυριεύω / supplied witness: “be lords over”'
  choice: señorear sobre
  rationale: Distingue este dominio fuerte de la mención más general de «gobernar» y conserva el vínculo con ejercer señorío.
- source_word: 'διαθήκη / supplied witness: “covenant”'
  choice: pacto
  rationale: Término claro y extendido en español latinoamericano para la relación pactal, sin imponer una tradición confesional particular.
theological_decisions:
- issue: Referente cristológico de las citas sobre la piedra
  choice: Se conservaron los pronombres y la explicación del autor, que identifica al esperado y manifestado en carne con Jesús.
  alternative: Hacer explícito «Cristo» en cada cita.
  rationale: El pasaje construye gradualmente la identificación; añadir «Cristo» donde el texto solo dice «él» resolvería la progresión interpretativa.
- issue: «Afirmó su carne con poder»
  choice: Se mantuvo que el Señor afirmó «su carne», sin explicar metafísicamente la frase.
  alternative: Traducir como que Dios fortaleció el cuerpo de Jesús o que Cristo hizo firme su encarnación.
  rationale: La sintaxis y la teología de la expresión son tensas; una paráfrasis precisa impondría una lectura no segura.
- issue: Palabras de la creación dirigidas al Hijo
  choice: 'Se tradujo literalmente la afirmación del autor: Dios «dice al Hijo» y las palabras «se refieren al Hijo».'
  alternative: Reformular como una interpretación trinitaria explícita de Génesis.
  rationale: El texto ofrece una lectura cristológica, pero no desarrolla aquí una formulación doctrinal posterior.
- issue: Templo y corazón
  choice: «La morada de nuestro corazón es un templo santo para el Señor».
  alternative: «Nuestro corazón es la morada, un templo santo del Señor».
  rationale: Se preserva la construcción del testimonio, aun cuando admite más de una relación sintáctica entre corazón, morada y templo.
- issue: Dominio futuro sobre la tierra
  choice: Se mantuvo como expectativa del mundo venidero vinculada a la perfección y a heredar el pacto.
  alternative: Interpretarlo como dominio espiritual presente o como un reino milenario específico.
  rationale: El autor contrapone expresamente «ahora» con «el mundo venidero», pero no define con mayor precisión el marco escatológico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y «te» cuando el autor pasa al singular. Las citas se integran con puntuación moderna, pero se preservan repeticiones, preguntas retóricas, imágenes inusuales y tensiones interpretativas. Dado que la revisión directa del griego y de los testigos latinos está pendiente, las decisiones más frágiles se identifican en notas y no se armonizan silenciosamente.
