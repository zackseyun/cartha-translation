    También dice de nuevo el profeta: «La piedra que rechazaron los constructores llegó a ser la piedra principal del ángulo». Y otra vez dice: «Este es el día grande y maravilloso que hizo el Señor».


    Les escribo con mayor sencillez para que entiendan, yo, que soy la escoria de su amor.[b]


    ¿Qué dice de nuevo el profeta? «La asamblea de malhechores se reunió a mi alrededor; me rodearon como las abejas rodean un panal»; y: «Echaron suertes por mi ropa».


    Puesto que él estaba por manifestarse en la carne y sufrir, su sufrimiento fue manifestado de antemano. Pues el profeta dice acerca de Israel: «¡Ay de su alma!, porque tramaron contra sí mismos un plan malvado al decir: “Atemos al justo, porque no nos sirve de nada”».


    ¿Qué les dice el otro profeta, Moisés? «Miren, esto dice el Señor Dios: Entren en la buena tierra que el Señor juró a Abraham, Isaac y Jacob, y recíbanla como herencia, una tierra que fluye con leche y miel».


    Pero ¿qué dice el conocimiento? Entiendan: pongan su esperanza en aquel que está por manifestarse a ustedes en la carne, es decir, Jesús. Porque el ser humano es tierra que sufre, pues de la superficie de la tierra vino la creación de Adán.[c]


    ¿Qué dice entonces? «Entren en la buena tierra, una tierra que fluye con leche y miel». Bendito sea nuestro Señor, hermanos, quien estableció entre nosotros sabiduría y comprensión de sus misterios. Pues el profeta habla en parábola acerca del Señor. ¿Quién la comprenderá, sino el que es sabio y prudente y ama a su Señor?


    Puesto que él nos renovó mediante el perdón de los pecados, hizo de nosotros una nueva forma, para que tuviéramos alma de niños, como si nos estuviera creando de nuevo.


    Pues la Escritura habla acerca de nosotros cuando él dice al Hijo: «Hagamos al ser humano a nuestra imagen y semejanza, y que ellos gobiernen sobre los animales de la tierra, las aves del cielo y los peces del mar». Y cuando el Señor vio la hermosa creación de nosotros, los seres humanos, dijo: «Crezcan, multiplíquense y llenen la tierra». Estas palabras se refieren al Hijo.


    De nuevo te mostraré cómo habla el Señor acerca de nosotros. Al final hizo una segunda creación, y el Señor dice: «Miren, hago las cosas últimas como las primeras». Con referencia a esto, el profeta proclamó: «Entren en una tierra que fluye con leche y miel y señoreen sobre ella».


    Miren, pues, hemos sido creados de nuevo, como dice otra vez por medio de otro profeta: «Miren —dice el Señor—, quitaré de estos», es decir, de aquellos a quienes el Espíritu del Señor vio de antemano, «sus corazones de piedra y pondré en ellos corazones de carne»; porque él mismo estaba por manifestarse en la carne y habitar en nosotros.


    Porque la morada de nuestro corazón es un templo santo para el Señor, hermanos míos.


    Pues el Señor dice también: «¿Con qué compareceré ante el Señor mi Dios y seré glorificado? Te alabaré en la asamblea de mis hermanos y te cantaré en medio de la asamblea de los santos». Nosotros, por tanto, somos aquellos a quienes él introdujo en la buena tierra.


    ¿Qué son, entonces, la leche y la miel? Al niño se lo mantiene con vida primero con miel y después con leche. Del mismo modo, también nosotros, sostenidos con vida por nuestra fe en la promesa y por la palabra, viviremos y señorearemos sobre la tierra.


    Ya dijimos antes: «Que crezcan, se multipliquen y gobiernen sobre los peces». Pero ¿quién puede [ahora] gobernar sobre animales, peces y aves del cielo?[d] Debemos comprender que gobernar implica poder, de modo que uno dé órdenes y ejerza dominio.


    Por tanto, si esto no sucede ahora, sin duda habló para nosotros acerca del mundo venidero, cuando nosotros mismos seamos llevados a la perfección para que lleguemos a ser herederos del pacto del Señor.'
