base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: es
  text: '**Bernabé 1**


    Les envío un saludo, hijos e hijas, en el nombre del Señor que nos amó. Que vivan en paz.


    Al ver cuán grandes y abundantes son para ustedes los justos preceptos de Dios, me alegro de manera extraordinaria, con una alegría inmensa y desbordante, por sus espíritus bienaventurados y gloriosos. ¡Tan profundamente arraigada está en ustedes la gracia del don espiritual que han recibido!


    Por eso me considero aún más dichoso, con la esperanza de ser salvo, pues verdaderamente veo que el Espíritu ha sido derramado entre ustedes desde la riqueza del manantial del Señor. ¡Tanto me maravilló lo que vi en ustedes, algo que yo anhelaba profundamente!


    Convencido de esto, y consciente de que, después de haberles dicho muchas cosas, sé que el Señor me acompañó por el camino de la justicia, me siento enteramente impulsado a amarlos más que a mi propia vida. En efecto, en ustedes habitan una gran fe y un gran amor por medio de la esperanza de la vida que procede de él.


    Por tanto, consideré que, si procuraba compartir con ustedes una parte de lo que recibí, tendría como recompensa haber servido a espíritus como los suyos. Así que me apresuré a enviarles estas breves palabras, para que, junto con su fe, también lleguen a tener un conocimiento completo.


    Ahora bien, tres son los preceptos del Señor: la esperanza de vida, principio y fin de nuestra fe; la justicia, principio y fin del juicio; y el amor manifestado con gozo y júbilo, testimonio de las obras de justicia.[a]


    Pues el Señor nos dio a conocer por medio de sus profetas las cosas pasadas y presentes, y además nos permitió saborear por anticipado las cosas futuras. Al ver que cada una de ellas se cumple tal como él anunció, debemos presentar una ofrenda cada vez más rica y sublime: el temor reverente que le debemos.[b] Yo, no como si fuera maestro, sino como uno de ustedes, les expondré unas pocas cosas que podrán alegrarlos en las circunstancias presentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construcción de esta tríada es muy condensada. También puede entenderse que el amor, acompañado de gozo y júbilo, da testimonio de las obras de justicia.
    reason: Preservar la ambigüedad sintáctica del testimonio antiguo sin imponer una sola relación entre sus miembros.
  - marker: b
    text: 'Lit.: «debemos ofrecer una ofrenda más rica y elevada al temor de él».'
    reason: La expresión transmitida es inusual; la nota conserva su forma más literal junto a una versión comprensible en el texto.
lexical_decisions:
- source_word: ordinances / Greek δικαιώματα (as reflected in the witness)
  choice: justos preceptos
  rationale: Conserva tanto la idea de disposiciones divinas como su carácter justo, sin reducir el término a ordenanzas rituales.
- source_word: ordinances / Greek δόγματα (in the later threefold statement)
  choice: preceptos
  rationale: En este contexto introductorio, «preceptos» resulta natural y amplio; evita la carga confesional moderna que puede tener «dogmas».
- source_word: spirits
  choice: espíritus
  rationale: Mantiene la expresión antropológica y retórica del testimonio antiguo, en vez de sustituirla interpretativamente por «personas» o «corazones».
- source_word: the hope of life
  choice: la esperanza de vida
  rationale: Preserva la construcción compacta y su posible referencia tanto a la vida esperada como a la esperanza que la vida suscita.
- source_word: fear of Him
  choice: el temor reverente que le debemos
  rationale: Comunica respeto y lealtad religiosa sin sugerir mero terror, a la vez que conserva el motivo bíblico del temor de Dios.
- source_word: firstfruits of the taste
  choice: saborear por anticipado
  rationale: Expresa en español natural la metáfora combinada de primicias y degustación sin convertirla en una formulación rígida e incomprensible.
theological_decisions:
- issue: Relación entre fe, amor y la vida que pertenece al Señor
  choice: «por medio de la esperanza de la vida que procede de él»
  alternative: «mediante la esperanza de la vida que es suya»
  rationale: La formulación evita definir de manera excesiva si la vida es posesión, don o vida propia del Señor, pero ofrece una frase inteligible en español.
- issue: Sentido salvífico de «esperando ser salvo»
  choice: 'Se conserva en primera persona: «con la esperanza de ser salvo»'
  alternative: Parafrasear como seguridad absoluta de salvación
  rationale: Mantiene la tensión y modalidad de esperanza presentes en el testimonio, sin convertirlas en duda doctrinal ni en certeza sistemática.
- issue: La tríada de esperanza, justicia y amor
  choice: Se conserva la estructura nominal y paralela, con nota sobre su sintaxis
  alternative: Reordenar y explicar las relaciones como una doctrina sistemática
  rationale: El período es condensado y admite más de una delimitación; la traducción no debe resolver silenciosamente todas sus relaciones.
- issue: «Temor de Dios» como ofrenda
  choice: 'Se mantiene la metáfora sacrificial: «presentar una ofrenda...: el temor reverente»'
  alternative: «aumentar nuestro temor de Dios»
  rationale: La opción elegida conserva la imagen de ofrenda del texto, aunque la construcción resulte inusual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se evita tanto el arcaísmo como la terminología denominacional. El saludo inicial se divide para sonar natural sin perder «en paz». Dado que los datos proporcionados señalan que la revisión directa de los testigos griegos y latinos sigue pendiente, el borrador se apoya principalmente en el testimonio público suministrado y trata con cautela los posibles valores griegos reflejados en él.
