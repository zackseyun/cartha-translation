    Deben comprender quién es Isaac, quién es Rebeca y en relación con quiénes ha mostrado Dios que un pueblo es mayor que el otro.


    En otra profecía, Jacob habla con mayor claridad a su hijo José y dice: «Mira, el Señor no me ha privado de ver tu rostro; tráeme a tus hijos para que los bendiga».[b]


