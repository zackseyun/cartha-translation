  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: es
  text: 'Ahora veamos si la herencia pertenece a este pueblo o al primero, y si el pacto se refería a nosotros o a ellos.


    Escuchen, pues, lo que dice la Escritura acerca de los pueblos: «Isaac rogó por Rebeca, su esposa, porque ella era estéril, y ella concibió. Entonces Rebeca fue a consultar al Señor. Y el Señor le dijo: “Dos naciones hay en tu vientre y dos pueblos en tus entrañas; un pueblo vencerá al otro, y el mayor servirá al menor”».[a]


    Deben comprender quién es Isaac, quién es Rebeca y con respecto a quiénes ha mostrado Dios que un pueblo es mayor que el otro.


    En otra profecía, Jacob habla con mayor claridad a su hijo José, diciendo: «Mira, el Señor no me ha privado de ver tu rostro; tráeme a tus hijos para que los bendiga».[b]


    José llevó a Efraín y a Manasés, queriendo que Manasés recibiera la bendición por ser el mayor; por eso lo condujo hacia la mano derecha de su padre Jacob. Pero Jacob vio en el Espíritu una figura del pueblo que vendría después. ¿Y qué dice la Escritura? «Jacob cruzó las manos, puso la derecha sobre la cabeza de Efraín, el segundo y menor, y lo bendijo. José dijo a Jacob: “Pasa tu mano derecha a la cabeza de Manasés, porque él es mi hijo primogénito”. Pero Jacob dijo a José: “Lo sé, hijo mío, lo sé; pero el mayor servirá al menor. Sin embargo, también este será bendecido”».[c]


    Observen por medio de quiénes dispuso Dios que este pueblo fuera el primero y el heredero del pacto.


    Y si, además de esto, también lo dejó escrito por medio de Abraham, nuestro conocimiento llega a ser completo. ¿Qué le dice, pues, a Abraham, cuando él solo creyó y eso le fue contado como justicia? «Mira, yo te he constituido, Abraham, padre de naciones que creen en Dios sin estar circuncidadas».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La cita combina y adapta Génesis 25:21-23. En Génesis, la frase final suele traducirse «el mayor servirá al menor»; aquí se usa también para contrastar dos pueblos.
    reason: Identifica la fuente escrituraria y advierte que la redacción del autor no reproduce de manera exacta una única forma bíblica.
  - marker: b
    text: Adaptación de Génesis 48:11, introducida aquí como profecía.
    reason: Aclara la procedencia de una cita cuya forma difiere de versiones bíblicas modernas.
  - marker: c
    text: Resumen interpretativo de Génesis 48:13-20, al que se incorpora la expresión «el mayor servirá al menor» de Génesis 25:23.
    reason: La cita fusiona episodios y requiere transparencia textual para no atribuir toda la formulación directamente a Génesis 48.
  - marker: d
    text: La frase reúne el lenguaje de Génesis 15:6 y 17:5 con la interpretación de Abraham como padre de quienes creen sin estar circuncidados; compárese Romanos 4:9-17.
    reason: Señala el carácter compuesto e interpretativo de la cita final.
lexical_decisions:
- source_word: κληρονομία / inheritance
  choice: herencia
  rationale: Conserva el término jurídico y teológico de recibir lo prometido sin explicar de antemano en qué consiste.
- source_word: διαθήκη / covenant
  choice: pacto
  rationale: Es una forma clara y ampliamente comprensible en el español latinoamericano, adecuada para la relación pactal que discute el autor.
- source_word: λαός / people
  choice: pueblo
  rationale: Mantiene el contraste colectivo y la repetición argumentativa entre los dos pueblos.
- source_word: τύπος / type
  choice: figura
  rationale: Expresa una correspondencia anticipatoria sin imponer terminología técnica poco accesible como «tipo».
- source_word: ἐν πνεύματι / in the Spirit
  choice: en el Espíritu
  rationale: La mayúscula refleja la probable referencia al Espíritu divino, aunque la formulación conserva la concisión del testimonio.
- source_word: ἀκροβυστία / uncircumcision
  choice: sin estar circuncidadas
  rationale: Resulta más natural en español actual que el sustantivo abstracto «incircuncisión» y conserva el contraste ritual.
theological_decisions:
- issue: Identidad de «este pueblo» y «el primero»
  choice: Conservar las expresiones sin identificar explícitamente a los grupos
  alternative: Explicitar «los cristianos» e «Israel»
  rationale: El autor desarrolla la identificación mediante su interpretación de las citas; introducir nombres resolvería antes de tiempo la tensión del pasaje.
- issue: Sujeto de acciones ambiguas atribuidas a «él»
  choice: Usar «Dios» donde el español exigiría mayor claridad
  alternative: Mantener siempre el pronombre «él»
  rationale: En «ha mostrado» y «dispuso», el contexto presenta a Dios como agente; nombrarlo evita una ambigüedad gramatical involuntaria sin alterar el argumento.
- issue: Jacob como figura interpretativa
  choice: «una figura del pueblo que vendría después»
  alternative: «un tipo profético de la Iglesia»
  rationale: Se mantiene la afirmación tipológica del autor sin añadir una identificación eclesiológica explícita ausente de la frase.
- issue: Fe de Abraham y justicia
  choice: «creyó y eso le fue contado como justicia»
  alternative: «creyó y fue considerado justo»
  rationale: La formulación conserva la lógica de imputación o cómputo y evita decidir si el objeto contado fue la fe o la persona, más allá de lo que permite el testimonio suministrado.
- issue: Prioridad y herencia del pacto
  choice: «fuera el primero y el heredero del pacto»
  alternative: «tuviera precedencia como heredero del pacto»
  rationale: Conserva la llamativa afirmación polémica del autor y su lenguaje de prioridad, sin suavizarla ni armonizarla teológicamente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» implícito en las exhortaciones («Escuchen», «Deben», «Observen»), evitando arcaísmos. Las citas se presentan con puntuación moderna. Dado que el expediente declara pendiente la revisión directa del griego y de los testigos latinos, la redacción es una propuesta provisional basada en el testimonio inglés suministrado y en las alusiones bíblicas identificables; las notas hacen visibles las citas compuestas y adaptadas.
