source:
  text: 'Now let us see whether this people or the first people hath the inheritance, and whether the covenant had reference to us or to them.


    Hear then what the scripture saith concerning the people; And Isaac prayed concerning Rebecca his wife, for she was barren. And she conceived. Then Rebecca went out to enquire of the Lord. And the Lord said unto her; Two nations are in thy womb, and two peoples in thy belly, and one people shall vanquish another people, and the greater shall serve the less.


    Ye ought to understand who Isaac is, and who Rebecca is, and in whose case He hath shown that the one people is greater than the other.


    And in another prophecy Jacob speaketh more plainly to Joseph his son, saying; Behold, the Lord hath not bereft me of thy face; bring me thy sons, that I may bless them.


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the spirit a type of the people that should come afterwards. And what saith He? And Jacob crossed his hands, and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said unto Jacob, Transfer thy right hand to the head of Manasseh, for he is my first born son. And Jacob said to Joseph, I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.


    Mark in whose cases He ordained that this people should be first and heir of the covenant.


    If then besides this He also recorded it through Abraham, we attain the completion of our knowledge. What then saith he to Abraham when he alone believed, and was ascribed for righteousness? Behold I have made thee, Abraham, a father of nations that believe in God in uncircumcision.'
