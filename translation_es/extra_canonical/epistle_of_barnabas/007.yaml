  yaml_path: translation/extra_canonical/epistle_of_barnabas/007.yaml
  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: es
  text: 'Entiendan, pues, hijos de la alegría, que el buen Señor nos reveló de antemano todas las cosas, para que supiéramos a quién debemos dar gracias y alabar en todo.


    Así pues, si el Hijo de Dios, que es Señor y futuro Juez de vivos y muertos, sufrió para que su herida nos diera vida, creamos que el Hijo de Dios no pudo sufrir sino por nosotros.


    Además, cuando fue crucificado, le dieron a beber vinagre y hiel. Escuchen cómo los sacerdotes del templo dieron a conocer este asunto. Hay un mandamiento en la Escritura: «Quien no observe el ayuno ciertamente morirá».[a] Puesto que el Señor estaba por ofrecer en su propia persona el receptáculo de su Espíritu como sacrificio por nuestros pecados, ordenó que también se cumpliera la figura presentada en Isaac, quien fue ofrecido sobre el altar.


    ¿Qué dice, entonces, por medio del profeta? «Que coman del macho cabrío ofrecido durante el ayuno por todos sus pecados». Presten mucha atención: «Que solo los sacerdotes coman todas las entrañas sin lavar, con vinagre».[b]


    ¿Por qué? «Ya que ustedes me darán a beber hiel con vinagre a mí, que estoy por ofrecer mi carne por los pecados de mi pueblo nuevo, coman ustedes solos mientras el pueblo ayuna y se lamenta vestido de tela áspera y cubierto de ceniza». Así mostró que debía sufrir a manos de ellos.


    Presten atención a los mandamientos que dio: «Tomen dos machos cabríos, hermosos y semejantes, y ofrézcanlos. Que el sacerdote tome uno como holocausto por los pecados».


    Pero ¿qué deben hacer con el otro? «Ese es maldito», dice. Observen cómo se revela la figura de Jesús.


    «Todos ustedes deben escupirlo, hostigarlo, colocar lana escarlata alrededor de su cabeza y luego arrojarlo al desierto». Hecho esto, el encargado de llevar el macho cabrío al desierto lo conduce, le quita la lana y la pone sobre la rama llamada Rachia,[c] la misma planta cuyos brotes solemos comer cuando los encontramos en el campo. Solo el fruto de este arbusto espinoso es tan dulce.


    ¿Qué significa esto? Presten atención. Uno está junto al altar y el otro es maldito. Además, el maldito está coronado. Porque en aquel día lo verán con el largo manto escarlata alrededor de su cuerpo y dirán: «¿No es este aquel a quien una vez crucificamos, despreciamos y escupimos? En verdad, este era quien entonces decía que era el Hijo de Dios».


    Pero ¿en qué se parece él al macho cabrío? Por eso se dice que los machos cabríos deben ser hermosos y semejantes: para que, cuando lo vean venir entonces, queden asombrados por su semejanza con el macho cabrío. Vean, pues, la figura de Jesús que había de sufrir.


    Pero ¿qué significa que coloquen la lana entre las espinas? Es una figura de Jesús presentada a la iglesia, pues quien quisiera quitar la lana escarlata tendría que sufrir mucho debido a la aspereza terrible de la espina y vencerla mediante la aflicción. Así dice: «Quienes desean verme y alcanzar mi reino deben aferrarse a mí en medio de la tribulación y la aflicción».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta formulación no corresponde literalmente a un pasaje conocido de las Escrituras canónicas. Puede reflejar una tradición ritual o una paráfrasis vinculada al ayuno del Día de la Expiación.
    reason: Advierte al lector sobre una cita antigua de procedencia incierta sin corregir ni armonizar el texto.
  - marker: b
    text: La cita sobre comer las entrañas «sin lavar, con vinagre» tampoco se encuentra así en el texto bíblico conservado; probablemente depende de una tradición o forma textual hoy desconocida.
    reason: La rareza y procedencia incierta de la cita son relevantes para una lectura informada.
  - marker: c
    text: Rachia es el nombre de una planta en el testimonio utilizado. Su identificación exacta es incierta; el contexto la describe como un arbusto espinoso con brotes o fruto comestibles.
    reason: Evita una identificación botánica especulativa y explica por qué se translitera el nombre.
lexical_decisions:
- source_word: children of gladness
  choice: hijos de la alegría
  rationale: Conserva la metáfora familiar y el matiz de gozo del testimonio, en un español claro y digno.
- source_word: quick and dead
  choice: vivos y muertos
  rationale: Expresa en español actual la fórmula tradicional relativa al juicio universal.
- source_word: vessel of His Spirit
  choice: receptáculo de su Espíritu
  rationale: Mantiene la metáfora corporal deliberadamente extraña sin identificarla de manera interpretativa con un término más específico.
- source_word: type
  choice: figura
  rationale: Comunica la correspondencia tipológica pretendida sin depender del tecnicismo «tipo», potencialmente opaco para lectores generales.
- source_word: fair and alike
  choice: hermosos y semejantes
  rationale: 'Preserva ambos rasgos del testimonio: buena apariencia y similitud mutua.'
- source_word: goad it
  choice: hostigarlo
  rationale: El testimonio puede sugerir aguijonear o maltratar; «hostigarlo» conserva la acción abusiva sin precisar un instrumento no seguro.
- source_word: Rachia
  choice: Rachia
  rationale: Se retiene el nombre transmitido porque la identificación botánica es incierta y la revisión directa de las fuentes griegas y latinas está pendiente.
- source_word: lay hold on Me
  choice: aferrarse a mí
  rationale: Reproduce la imagen de asirse de Cristo y resulta natural en español latinoamericano.
theological_decisions:
- issue: Necesidad o finalidad del sufrimiento del Hijo de Dios
  choice: «no pudo sufrir sino por nosotros»
  alternative: «solo pudo haber sufrido por causa nuestra»
  rationale: Conserva la tensión modal del testimonio sin convertirla explícitamente en una teoría particular de necesidad divina o expiación.
- issue: El receptáculo del Espíritu ofrecido como sacrificio
  choice: Se conserva la formulación metafórica
  alternative: Interpretarlo directamente como «su cuerpo» o «su humanidad»
  rationale: La expresión antigua es teológicamente densa y ambigua; explicitar una identificación cerraría indebidamente sus posibilidades.
- issue: Isaac y los machos cabríos como anticipaciones de Jesús
  choice: «figura»
  alternative: «profecía», «prefiguración» o «símbolo»
  rationale: «Figura» preserva el razonamiento tipológico del autor sin afirmar una categoría doctrinal más precisa que el texto.
- issue: «Mi pueblo nuevo»
  choice: Se conserva literalmente
  alternative: «el nuevo pueblo que me pertenece» o una identificación eclesiológica explícita
  rationale: Evita importar una doctrina denominacional sobre la relación entre la iglesia e Israel.
- issue: «Sufrir a manos de ellos»
  choice: Se conserva el referente pronominal sin ampliarlo
  alternative: Identificar colectivamente a un pueblo, religión o etnia
  rationale: No se extiende la acusación más allá de la retórica inmediata del pasaje y se evita una generalización antijudía.
- issue: Acceso al reino mediante tribulación
  choice: «deben aferrarse a mí en medio de la tribulación y la aflicción»
  alternative: «deben alcanzarme por medio del sufrimiento»
  rationale: La formulación evita presentar el sufrimiento como mérito salvífico automático, a la vez que conserva la exigencia ascética del texto.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural exhortativo y «tela áspera» en lugar del arcaísmo «cilicio». La puntuación distingue las citas atribuidas a la Escritura o al Señor, aunque varias de ellas proceden de tradiciones no identificadas. Borrador necesariamente provisional: el material suministrado depende de un testimonio inglés de dominio público y señala que la revisión directa del griego y el latín sigue pendiente.'
