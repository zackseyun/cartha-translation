review_pass:
  verdict: revise
  source_fidelity: El borrador conserva adecuadamente la estructura argumentativa del testimonio inglés, incluidas las tensiones entre «novilla» y «becerro» y entre doce y tres niños. Sin embargo, «atar» no reproduce bien «twist», y «impureza» para «foulness» introduce una connotación ritual más definida que la que permite el testimonio disponible.
  naturalness: El registro es claro y digno. «Niños» corresponde más directamente a «children» que «muchachos», sin imponer una edad o función social precisa. Se ajusta también la construcción del rociamiento para expresar que se rocía a cada persona.
  terminology: Se mantienen «figura», «novilla/becerro», «madero», «lana escarlata», «hisopo» y «evangelio». Se conserva «autoridad sobre el evangelio», pese a ser una construcción inusual, por fidelidad al testimonio. «Lo desagradable del hisopo» preserva mejor la vaguedad de «foulness» que «impureza».
  issues:
  - severity: medium
    issue: «aten la lana escarlata» no refleja el verbo «twist».
    rationale: El testimonio describe torcer o entrelazar la lana; simplemente atarla reduce y modifica la acción ritual descrita.
  - severity: medium
    issue: «impureza» interpreta «foulness» en clave ritual.
    rationale: «Foulness» puede aludir a algo desagradable, áspero o repulsivo; «impureza» restringe indebidamente el sentido y puede sugerir contaminación ritual.
  - severity: low
    issue: «muchachos» es más específico que «children».
    rationale: El testimonio no precisa que se trate de adolescentes o jóvenes varones; «niños» conserva mejor la designación sin resolver la cuestión.
  - severity: low
    issue: «rocíen al pueblo uno por uno» resulta ambiguo en español.
    rationale: «Rocíen a cada persona del pueblo» expresa con naturalidad la distribución individual indicada por el testimonio.
  revised_text: '¿Qué creen que significa la figura contenida en el mandamiento dado a Israel? Se ordena que unos hombres cuyos pecados han llegado al colmo ofrezcan una novilla, la sacrifiquen y la quemen; luego, que los niños recojan las cenizas y las echen en recipientes, y que entrelacen la lana escarlata y el hisopo en un madero —vean aquí otra vez la figura de la cruz y la lana escarlata—; y que, una vez hecho esto, los niños rocíen a cada persona del pueblo, para que sean purificados de sus pecados.


    Comprendan con cuánta claridad se les habla: el becerro es Jesús; los hombres que lo ofrecen, por ser pecadores, son quienes lo entregaron para que fuera sacrificado. Después de esto, ya no son hombres los que ofrecen; la gloria ya no es para los pecadores.[a]


    Los niños que rocían son quienes nos anunciaron el perdón de los pecados y la purificación de nuestros corazones. A ellos, que eran doce como testimonio para las tribus —pues hay doce tribus de Israel—, él les dio autoridad sobre el evangelio, para que lo anunciaran.


    Pero ¿por qué son tres los niños que rocían? Como testimonio para Abraham, Isaac y Jacob, porque ellos son poderosos ante Dios.


    Luego está el hecho de colocar la lana sobre el madero. Esto significa que el reino de Jesús está sobre la cruz y que quienes ponen su esperanza en él vivirán para siempre.


    ¿Y por qué están juntas la lana y el hisopo? Porque en su reino habrá días malos y desagradables, en los cuales seremos salvados; pues quien padece en la carne es sanado por lo desagradable del hisopo.[b]


    Para nosotros es evidente que estas cosas sucedieron con este propósito; para ellos, en cambio, eran oscuras, porque no escucharon la voz del Señor.'
