  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: es
  text: '¿Qué creen que significa la figura contenida en el mandamiento dado a Israel? Se ordena que unos hombres cuyos pecados han llegado al colmo ofrezcan una novilla, la sacrifiquen y la quemen; luego, que los muchachos recojan las cenizas y las echen en recipientes, que aten la lana escarlata a un madero —vean aquí otra vez la figura de la cruz y la lana escarlata— junto con el hisopo; y, una vez hecho esto, que los muchachos rocíen al pueblo uno por uno, para que sean purificados de sus pecados.


    Comprendan con cuánta claridad se les habla: el becerro es Jesús; los hombres que lo ofrecen, por ser pecadores, son quienes entregaron a Jesús para que fuera sacrificado. Después de esto, ya no son hombres los que ofrecen; la gloria ya no pertenece a los pecadores.[a]


    Los muchachos que rocían son quienes nos anunciaron el perdón de los pecados y la purificación de nuestros corazones. A ellos, que eran doce como testimonio de las tribus —pues doce son las tribus de Israel—, él les dio autoridad sobre el evangelio para que lo anunciaran.


    Pero ¿por qué son tres los muchachos que rocían? Como testimonio de Abraham, Isaac y Jacob, porque ellos son poderosos ante Dios.


    Luego está el hecho de colocar la lana sobre el madero. Esto significa que el reino de Jesús está sobre la cruz y que quienes ponen su esperanza en él vivirán para siempre.


    ¿Y por qué aparecen juntos la lana y el hisopo? Porque en su reino habrá días malos e impuros, en los cuales seremos salvados; pues quien padece en la carne es sanado mediante la impureza del hisopo.[b]


    Para nosotros es evidente que estas cosas sucedieron con este propósito; para ellos, en cambio, eran oscuras, porque no escucharon la voz del Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La frase «Después de esto, ya no son hombres los que ofrecen; la gloria ya no pertenece a los pecadores» es difícil y su sentido exacto no es seguro en el testimonio disponible.
    reason: Señalar una oscuridad textual o interpretativa genuina sin resolverla en el cuerpo de la traducción.
  - marker: b
    text: La expresión traducida «mediante la impureza del hisopo» también puede entenderse en el sentido de lo desagradable o áspero del hisopo. La relación exacta entre esta cualidad, el sufrimiento corporal y la sanidad es oscura.
    reason: Preservar la ambigüedad semántica y la lógica paradójica de la frase.
lexical_decisions:
- source_word: type
  choice: figura
  rationale: Expresa una correspondencia simbólica o prefigurativa de manera natural en español, sin convertirla en una afirmación técnica más precisa de lo que permite el testimonio disponible.
- source_word: heifer / calf
  choice: novilla / becerro
  rationale: Se conserva el cambio léxico interno del testimonio, que primero habla de una novilla y luego interpreta al animal como un becerro.
- source_word: children
  choice: muchachos
  rationale: Evita que «hijos» sugiera parentesco y refleja a participantes jóvenes en el rito; se mantiene el mismo término en las referencias a doce y a tres.
- source_word: tree
  choice: madero
  rationale: En este contexto tipológico, «madero» permite la asociación explícita con la cruz sin sustituir el objeto por «cruz» antes de que el autor haga la interpretación.
- source_word: scarlet wool
  choice: lana escarlata
  rationale: Equivalente concreto y tradicional que conserva tanto el material como el color.
- source_word: hyssop
  choice: hisopo
  rationale: Nombre bíblico habitual de la planta ritual.
- source_word: foul / foulness
  choice: impuros / impureza
  rationale: El contexto parece ritual y simbólico; «impuro» comunica mejor esa dimensión que «sucio», aunque la formulación sigue siendo difícil.
- source_word: authority over the Gospel
  choice: autoridad sobre el evangelio
  rationale: Se conserva la relación preposicional inusual del testimonio en vez de normalizarla como autoridad simplemente «para predicar».
theological_decisions:
- issue: Identificación tipológica del animal con Jesús
  choice: «el becerro es Jesús»
  alternative: «el becerro representa a Jesús»
  rationale: La formulación directa conserva la fuerza interpretativa del autor y no suaviza su identificación tipológica.
- issue: Doce y tres muchachos que rocían
  choice: Conservar ambas cifras sin armonizarlas
  alternative: Interpretar que son grupos distintos o corregir una de las cifras
  rationale: El testimonio presenta ambas referencias y no explica de manera explícita su relación; la traducción preserva esa tensión.
- issue: El reino de Jesús y la cruz
  choice: «el reino de Jesús está sobre la cruz»
  alternative: «el reinado de Jesús se fundamenta en la cruz»
  rationale: La opción elegida mantiene la afirmación espacial y teológica, deliberadamente llamativa, sin imponer una explicación doctrinal.
- issue: Sanidad mediante la impureza del hisopo
  choice: Mantener la paradoja
  alternative: Reformular como purificación mediante el hisopo
  rationale: El texto vincula de manera difícil el sufrimiento corporal, la sanidad y la cualidad desagradable o impura del hisopo; resolverlo como simple purificación borraría la tensión.
- issue: La gloria y los pecadores
  choice: «la gloria ya no pertenece a los pecadores»
  alternative: «los pecadores ya no tienen gloria»
  rationale: Se conserva la estructura conceptual del testimonio, sin identificar de forma especulativa qué gloria está en vista.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usó tratamiento plural con «ustedes» implícito y formas verbales naturales. El borrador se basa provisionalmente en el testimonio inglés público suministrado, pues la revisión directa del griego y de los testigos latinos está pendiente; por ello se conservaron las dificultades, los cambios de vocabulario y las aparentes tensiones numéricas en vez de corregirlos silenciosamente.
