review_pass:
  verdict: revise
  source_fidelity: La traducción conserva bien la cita profética y su contraste entre ayuno exterior y misericordia. Sin embargo, el cierre debe reflejar «todas las cosas» y la lectura griega conocida προσήλυτοι («prosélitos»), no la paráfrasis «novatos» del testimonio inglés. También se ajusta la formulación para no presentar como condicional añadido («Así será») una estructura que en la cita funciona como continuación de la promesa divina.
  naturalness: El español es en general claro y de registro digno. Se normalizan las comillas y la puntuación de la cita extensa, y se reemplazan algunas formulaciones algo rígidas por equivalentes actuales sin perder las imágenes del texto.
  terminology: Se mantienen «ayuno», «maldad», «justicia», «Amado» y «prosélitos». «Cuerdas apretadas de contratos impuestos por la fuerza» conserva prudentemente la expresión difícil sobre obligaciones coercitivas. «Persona humillada» mantiene el alcance social y personal de la imagen.
  issues:
  - severity: medium
    issue: El texto principal dice «todas estas cosas».
    rationale: El testimonio inglés dice «concerning all things» y el griego conocido περὶ πάντων corresponde a «acerca de todas las cosas», no solo a lo previamente citado.
  - severity: medium
    issue: La nota contrapone innecesariamente «novatos» y «prosélitos» sin que el texto principal explique de modo preciso la divergencia del testimonio inglés.
    rationale: La lectura griega conocida es προσήλυτοι, «prosélitos», mientras que «novices» pertenece a la traducción inglesa suministrada. Conviene conservar «prosélitos» y formular una nota breve y exacta.
  - severity: low
    issue: La puntuación y el anidamiento de comillas de la cita extensa resultan confusos.
    rationale: Una sola cita continua con puntuación interna clara facilita la lectura y no altera la estructura retórica.
  - severity: low
    issue: «Así será si» agrega una explicitación que no está expresada de ese modo en el testimonio.
    rationale: La frase condicional debe conservarse como continuación de la declaración divina, sin convertirla en una fórmula explicativa externa.
  revised_text: 'Por eso vuelve a hablarles acerca de estas cosas:


    «¿Para qué ayunan por mí —dice el Señor—, de modo que hoy se oiga su voz clamando? Este no es el ayuno que yo escogí —dice el Señor—, ni que una persona humille su alma.


    Aunque doblen el cuello como un aro, se vistan de tela áspera y hagan de las cenizas su lecho, ni aun así lo llamarán un ayuno aceptable.


    Pero a nosotros nos dice: “Miren, este es el ayuno que yo escogí —dice el Señor—: desaten toda atadura de maldad; suelten las cuerdas apretadas de los contratos impuestos por la fuerza; dejen libres a los quebrantados y hagan pedazos todo vínculo injusto. Comparte tu pan con el hambriento; si ves a alguien desnudo, vístelo; recibe en tu casa a quien no tiene refugio; si ves a una persona humilde, no la desprecies, ni tampoco a nadie de tu familia y de tu propia descendencia.


    Entonces tu luz despuntará por la mañana y tu sanidad surgirá pronto; la justicia irá delante de ti y la gloria de Dios te rodeará.


    Entonces clamarás y Dios te escuchará; mientras todavía estés hablando, él dirá: ‘Aquí estoy’, si apartas de ti el yugo, el señalar con el dedo y las palabras de murmuración; si das tu pan de todo corazón al hambriento y te compadeces de la persona humillada”.


    Con este propósito, por tanto, hermanos míos, el que es paciente, al prever que el pueblo que había preparado en su Amado creería con sencillez, nos manifestó de antemano todas las cosas, para que no tropezáramos, como prosélitos,[a] con la ley de ellos.'
  revised_footnotes:
  - marker: a
    text: El griego conocido dice «como prosélitos» (προσήλυτοι). El testimonio inglés suministrado traduce aquí «como novatos».
    reason: Documenta de manera concisa la diferencia entre la lectura griega conocida y el testimonio inglés de trabajo.
  revision_rationale: Se conserva la orientación provisional del proyecto, pero se corrigen diferencias verificables con el testimonio y con la lectura griega conocida del cierre. La revisión también mejora la legibilidad de la cita sin armonizar ni ampliar su sentido teológico.
