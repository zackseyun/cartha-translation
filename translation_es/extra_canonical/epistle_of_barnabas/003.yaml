review_pass:
  verdict: revise
  source_fidelity: Se requieren correcciones puntuales. «Prosélitos» concuerda con la lectura griega habitualmente impresa (προσήλυτοι), frente a «novices» del testimonio inglés; por ello debe conservarse con nota. «Contra la ley» no refleja bien εἰς τὸν νόμον αὐτῶν ni la metáfora de naufragio. También conviene conservar «alma» en «alma humillada», en vez de convertirla en «persona».
  naturalness: 'El texto es en general claro y de registro apropiado. Se mejoran algunas formulaciones para un español latinoamericano más natural y preciso: «¿Por qué ayunan para mí?», «se acuesten sobre ceniza», «partan tu pan» y una formulación más fluida para los miembros de la propia familia.'
  terminology: «Ayuno», «maldad», «yugo», «justicia», «gloria de Dios», «Amado» y «prosélitos» son elecciones adecuadas. Se retiene «contratos impuestos por la fuerza» como traducción prudente de la imagen de obligaciones coercitivas y se preserva el posesivo distanciador «su ley».
  issues:
  - severity: medium
    issue: «contra la ley de ellos»
    rationale: El testimonio inglés dice «shipwreck ourselves upon their law» y la lectura griega normalmente citada tiene εἰς («en/hacia»), no una oposición expresada por «contra». «Naufragar en su ley» conserva la metáfora sin añadir confrontación.
  - severity: medium
    issue: «la persona humillada»
    rationale: El texto habla de un «alma» (ψυχή) humillada/abatida. Cambiarla por «persona» elimina una imagen y una ambigüedad del original.
  - severity: low
    issue: Inconsistencia de persona en los mandatos
    rationale: 'El pasaje heredado cambia de plural en la recriminación inicial a singular en las exhortaciones de la cita. Debe mantenerse ese cambio, pero con formas singulares coherentes: «parte», «ves», «recibe», «no desprecies».'
  - severity: low
    issue: Nota sobre «prosélitos»
    rationale: La nota es pertinente porque el testimonio inglés proporcionado dice «novatos», mientras que la lectura griega conocida se entiende normalmente como «prosélitos». Debe indicar que la colación integral de los testigos sigue pendiente, sin presentar la cuestión como resuelta por el inglés.
  revised_text: 'Por eso vuelve a hablarles acerca de estas cosas:


    «¿Por qué ayunan para mí —dice el Señor—, de modo que hoy se oiga su voz clamando? Este no es el ayuno que yo escogí —dice el Señor—, ni consiste en que una persona humille su alma.


    »Ni siquiera si doblan el cuello como un aro, se visten de tela de saco y se acuestan sobre ceniza, llamarán a eso un ayuno aceptable.


    »Pero a nosotros nos dice: “Miren, este es el ayuno que yo escogí —dice el Señor—: desaten toda atadura de maldad; suelten las cuerdas apretadas de los contratos impuestos por la fuerza; dejen libres a los quebrantados y hagan pedazos todo vínculo injusto. Parte tu pan para el hambriento; si ves a alguien desnudo, vístelo; recibe en tu casa a quien no tiene refugio; si ves a una persona humilde, no la desprecies, ni desprecies a ninguno de los de tu propia familia.


    »Entonces tu luz despuntará como la mañana y tu sanidad surgirá pronto; la justicia irá delante de ti y la gloria de Dios te rodeará.


    »Entonces clamarás y Dios te escuchará; mientras aún estés hablando, él dirá: ‘Aquí estoy’, si apartas de ti el yugo, el señalar con el dedo y las palabras de murmuración; si das tu pan de todo corazón al hambriento y te compadeces del alma humillada”.


    Con este propósito, hermanos míos, el que es paciente, al prever que el pueblo que había preparado en su Amado creería con sencillez, nos reveló de antemano todas estas cosas, para que no naufragáramos en su ley como prosélitos.[a]'
  revised_footnotes:
  - marker: a
    text: El testimonio inglés suministrado dice «como novatos». La lectura griega conocida en este lugar suele leerse como «como prosélitos» (προσήλυτοι). Esta diferencia deberá verificarse mediante una colación completa de los testigos griegos y latinos.
    reason: Documenta la divergencia significativa entre el testimonio inglés de trabajo y la lectura griega conocida, sin ocultar el carácter pendiente de la revisión integral de los testigos.
  revision_rationale: Se corrigen expresiones que alteraban el sentido o la imagen del texto, especialmente la dirección de la metáfora «naufragar en su ley» y «alma humillada». Se conserva la ambigüedad de «su Amado», la expresión «su ley» y la imaginería jurídica y social del pasaje. No se añaden identificaciones doctrinales ni históricas ajenas al texto.
