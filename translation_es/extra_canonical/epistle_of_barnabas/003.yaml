base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: es
  text: 'Por eso vuelve a hablarles acerca de estas cosas:


    «¿Para qué ayunan para mí —dice el Señor—, de modo que hoy se oiga su voz a gritos? Este no es el ayuno que yo escogí —dice el Señor—, ni consiste en que una persona se humille a sí misma.


    »Aunque doblen el cuello como un aro, se vistan de tela áspera y hagan de la ceniza su lecho, ni aun así lo llamarán un ayuno aceptable.


    »Pero a nosotros nos dice: “Miren, este es el ayuno que yo escogí —dice el Señor—: desaten toda atadura de maldad; suelten las cuerdas apretadas de los contratos impuestos por la fuerza; dejen libres a los quebrantados y hagan pedazos todo vínculo injusto. Comparte tu pan con el hambriento; si ves a alguien desnudo, vístelo; recibe en tu casa a quien no tiene refugio; si ves a una persona humilde, no la desprecies, ni tampoco a nadie de tu familia y de tu propia descendencia.


    »Entonces tu luz despuntará como la mañana y tu sanidad surgirá pronto; la justicia irá delante de ti y la gloria de Dios te rodeará.


    »Entonces clamarás y Dios te escuchará; mientras aún estés hablando, él dirá: ‘Aquí estoy’. Así será si apartas de ti el yugo, el señalar con el dedo y las palabras de murmuración; si das tu pan de todo corazón al hambriento y te compadeces de la persona humillada”.


    Con este propósito, hermanos míos, el que es paciente previó que el pueblo que había preparado en su Amado creería con sencillez, y nos reveló de antemano todas estas cosas, para que no naufragáramos, como prosélitos,[a] contra la ley de ellos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés suministrado dice «como novatos»; la lectura griega conocida en este punto suele entenderse como «como prosélitos». La redacción debe verificarse de nuevo mediante una revisión completa de los testigos griegos y latinos.
    reason: Documentar una variante de traducción significativa y la naturaleza provisional de la revisión de las fuentes antiguas.
lexical_decisions:
- source_word: fast / νηστεύετε (reflejado por el testimonio inglés)
  choice: ayunan
  rationale: Conserva el vocabulario religioso central del pasaje y permite mantener el contraste entre el rito externo y la justicia misericordiosa.
- source_word: forcible contracts
  choice: contratos impuestos por la fuerza
  rationale: Expresa tanto el carácter contractual como la coacción, sin reducir la frase a una referencia general a cadenas físicas.
- source_word: broken ones
  choice: los quebrantados
  rationale: Mantiene la imagen de personas dañadas u oprimidas sin especificar indebidamente si el quebranto es físico, social o interior.
- source_word: stretching forth of the finger
  choice: el señalar con el dedo
  rationale: Es una expresión natural en español que conserva la imagen de acusación o desprecio.
- source_word: well-beloved
  choice: su Amado
  rationale: Conserva el uso titular y la posible referencia cristológica, sin insertar explícitamente un nombre que el texto no da aquí.
- source_word: novices / probable Greek prosēlytoi
  choice: prosélitos
  rationale: La lectura griega conocida del cierre apunta a «prosélitos», mientras que el testimonio inglés suministrado vierte «novices». Se adopta el término más formalmente ligado a la lectura griega y se documenta la diferencia en nota.
theological_decisions:
- issue: Identidad de «su Amado»
  choice: Mantener «su Amado» sin identificarlo expresamente
  alternative: Traducir «Jesucristo» o «su Hijo amado»
  rationale: El contexto puede sugerir una referencia cristológica, pero la formulación citada no nombra expresamente a Jesús ni añade «Hijo».
- issue: Relación entre el ayuno y las obras de justicia
  choice: Conservar la oposición retórica del texto sin afirmar que todo ayuno queda abolido
  alternative: Parafrasear como una condena universal del ayuno ritual
  rationale: El pasaje define el ayuno escogido por Dios mediante la liberación del oprimido y la misericordia, pero no conviene convertir esa tensión retórica en una conclusión doctrinal más amplia.
- issue: «La ley de ellos»
  choice: Mantener el posesivo distanciador del autor
  alternative: Sustituirlo por «la ley judía» o «la ley de Moisés»
  rationale: Las alternativas identificarían y caracterizarían el referente de manera más explícita que el texto de este capítulo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» en la cita inicial y singular en las exhortaciones donde el testimonio cambia al singular. Se preservan las imágenes concretas —el cuello como aro, la ceniza como lecho, el yugo y el dedo que señala— y la tensión polémica del cierre. El borrador se apoya en el testimonio inglés público suministrado y en cotejo léxico limitado con la tradición griega conocida; todavía requiere revisión integral directa de los testigos griegos y latinos.
