translation:
  language: es
  text: 'Puesto que Moisés dijo: «No comerán cerdo, ni águila, ni halcón, ni milano, ni cuervo, ni ningún pez que no tenga escamas», entendió tres preceptos.[a]


    Además, les dice en Deuteronomio: «Estableceré mis preceptos como pacto sobre este pueblo». Por tanto, no es un mandamiento de Dios que se abstuvieran de morder con los dientes, sino que Moisés habló en sentido espiritual.


    Así pues, mencionó el cerdo con esta intención: «No te unirás —dice— a personas semejantes a los cerdos»; es decir, cuando viven en la abundancia se olvidan del Señor, pero cuando pasan necesidad lo reconocen. Del mismo modo, el cerdo, cuando come, no reconoce a su dueño; pero cuando tiene hambre, chilla, y después de recibir alimento vuelve a callarse.


    «Tampoco comerás águila, halcón, milano ni cuervo». «No te unirás —dice— ni te harás semejante a personas que no saben procurarse el alimento con trabajo y sudor, sino que en su maldad se apoderan de lo ajeno y, mientras aparentan andar con sencillez, acechan y buscan con avidez a alguien a quien despojar». Así también estas aves no se procuran alimento, sino que permanecen ociosas y buscan cómo comerse la carne ajena, causando daño con sus malas acciones.


    «Y no comerás —dice— lamprea, pulpo ni sepia». Quiere decir: «No te harás semejante a personas totalmente impías y ya condenadas a muerte»; así como solo estos peces son malditos y nadan en las profundidades: no nadan cerca de la superficie como los demás, sino que habitan en el fondo, bajo el mar profundo.


    Además: «No comerás liebre». ¿Por qué? «No serás corruptor de muchachos ni te harás semejante a quienes lo son»; pues la liebre adquiere cada año una abertura más en el cuerpo y, según el número de años que vive, tantas aberturas tiene.[b]


    También: «No comerás hiena». «No te harás —dice— adúltero ni cometerás inmoralidad sexual, ni te harás semejante a quienes lo hacen». ¿Por qué? Porque este animal cambia de naturaleza año tras año y unas veces se hace macho y otras, hembra.[b]


    También aborreció a la comadreja, y con razón. «No te harás —dice— semejante a esos hombres de quienes oímos que cometen impureza con la boca, ni te unirás a mujeres impuras que cometen impureza con la boca». Pues este animal concibe por la boca.[b]


    En cuanto a los alimentos, entonces, Moisés recibió tres preceptos de este tipo y los expresó en sentido espiritual; pero ellos, movidos por el deseo de la carne, los entendieron como si se refirieran a comer.


    David también comprende esos mismos tres preceptos y dice: «Dichoso el hombre que no ha andado en el consejo de los impíos» —como los peces que se internan en la oscuridad de las profundidades—; «ni se ha detenido en el camino de los pecadores» —como quienes aparentan temer al Señor, pero pecan como cerdos—; «ni se ha sentado en el asiento de los destructores» —como las aves posadas al acecho de una presa—. Ya tienen la enseñanza completa acerca de la comida.


    Moisés también dice: «Comerán todo animal que tenga la pezuña partida y rumie». ¿Qué quiere decir? Quien recibe el alimento reconoce al que se lo da y, después de saciarse, muestra que se alegra en él. Habló acertadamente, atendiendo al mandamiento. Entonces, ¿qué quiere decir? Únanse a quienes temen al Señor: a quienes meditan en su corazón sobre el sentido preciso de la palabra que recibieron; a quienes proclaman los preceptos del Señor y los guardan; a quienes saben que meditar es una labor gozosa y rumian la palabra del Señor. Pero ¿por qué el animal que tiene la pezuña partida? Porque el justo camina en este mundo y, al mismo tiempo, espera el mundo santo venidero. Ya ven cuán sabio legislador fue Moisés.


    Pero ¿cómo podían ellos percibir o comprender estas cosas? Nosotros, en cambio, puesto que hemos comprendido correctamente los mandamientos, los exponemos como quiso el Señor. Para esto circuncidó nuestros oídos y nuestros corazones, a fin de que comprendiéramos estas cosas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio inglés impreso dice «seine», evidente error por «swine» («cerdo»). La redacción se basa provisionalmente en ese testimonio; queda pendiente la revisión directa de los testigos griegos y latinos, incluida la identificación exacta de la lista zoológica.
    reason: Transparencia textual ante un error manifiesto del testimonio y la falta de cotejo directo con la lengua antigua.
  - marker: b
    text: Las afirmaciones antiguas sobre la anatomía y reproducción de la liebre, la hiena y la comadreja se conservan tal como funcionan en el argumento del autor; no corresponden al conocimiento zoológico moderno.
    reason: Evitar corregir o armonizar silenciosamente afirmaciones fisiológicas antiguas que son parte integral de la interpretación.
lexical_decisions:
- source_word: χοῖρος / swine
  choice: cerdo
  rationale: Forma neutral y actual; corrige el evidente error tipográfico «seine» del testimonio inglés y conserva el animal requerido por la interpretación posterior.
- source_word: προσκολλάω / cleave
  choice: unirse a
  rationale: Expresa adhesión estrecha y asociación personal en español natural, sin introducir un sentido técnico denominacional.
- source_word: ἀναμαρυκάομαι / chew the cud
  choice: rumiar
  rationale: Conserva tanto el sentido zoológico como la metáfora de meditar repetidamente la palabra.
- source_word: διαστολή / distinction
  choice: sentido preciso
  rationale: Refleja la idea de discernimiento o diferenciación del mensaje recibido y evita una traducción castellana rígida u opaca.
- source_word: πορνεύω / fornicator
  choice: cometer inmoralidad sexual
  rationale: Equivalencia amplia y comprensible que no reduce indebidamente el campo semántico a una sola conducta.
- source_word: παιδοφθορέω / corrupter of boys
  choice: corruptor de muchachos
  rationale: Mantiene la formulación acusatoria del texto y su referencia a varones jóvenes sin explicitar más de lo que permite el testimonio disponible.
- source_word: ὀλοθρευταί / destroyers
  choice: destructores
  rationale: Conserva la relación verbal fuerte del texto citado y evita sustituirla silenciosamente por «burladores» u otra lectura bíblica armonizada.
theological_decisions:
- issue: Interpretación espiritual de las leyes alimentarias
  choice: Presentar como afirmación del autor que Moisés habló en sentido espiritual
  alternative: Armonizar la exposición con interpretaciones judías o cristianas posteriores de la ley
  rationale: El pasaje formula explícitamente esta hermenéutica; la traducción debe preservarla como postura del autor, sin respaldarla mediante glosas ni suavizar su tensión.
- issue: Referente de «ellos» al recibir carnalmente los preceptos
  choice: Conservar el pronombre «ellos» sin identificarlo de manera más específica
  alternative: Explicitar «los judíos» o «Israel»
  rationale: Evita añadir una identificación potencialmente polémica que el fragmento suministrado no exige de forma explícita.
- issue: Primera persona plural al final
  choice: Conservar «nosotros» frente a «ellos»
  alternative: Generalizar como «quienes comprenden»
  rationale: Mantiene la retórica y la tensión comunitaria del autor sin reinterpretar la identidad del grupo.
- issue: Circuncisión de oídos y corazones
  choice: Mantener la metáfora literalmente
  alternative: Parafrasear como «abrió nuestra mente»
  rationale: La imagen teológica es deliberada y enlaza comprensión, alianza y transformación interior.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea tratamiento plural «ustedes» implícito en las formas verbales y singular exhortativo dentro de las citas cuando así lo exige la argumentación. Se conservaron las repeticiones, preguntas retóricas, imágenes alimentarias y contrastes del autor, al tiempo que se aligeró la sintaxis arcaica del testimonio inglés. Dado que la revisión directa del griego y del latín está pendiente, el borrador declara en nota los puntos donde el testimonio inglés presenta especial incertidumbre.
