  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: es
  text: '9 Además, acerca de los oídos, dice que fue nuestro corazón lo que él circuncidó. El Señor dice por medio del profeta: «Al oír con sus oídos, me escucharon». Y dice también: «Los que están lejos oirán con sus oídos y comprenderán lo que he hecho». Y el Señor dice: «Circunciden su corazón».


    También dice: «Escucha, Israel, porque así dice el Señor tu Dios: El que desee vivir para siempre, que oiga con sus oídos la voz de mi siervo».[a] Y dice también: «Escucha, cielo, y presta oído, tierra, porque el Señor ha dicho estas cosas como testimonio». Y también: «Escuchen las palabras del Señor, gobernantes de este pueblo». Y también: «Escuchen, hijos míos, la voz del que clama en el desierto». Por eso circuncidó nuestros oídos, para que creyéramos al oír la palabra.


    Pero, además, la circuncisión en la que ellos ponen su confianza ha quedado anulada, pues él dijo que debía practicarse una circuncisión que no fuera de la carne. Sin embargo, ellos transgredieron, porque un ángel maligno les enseñó astucia.


    Él les dice: «Así dice el Señor su Dios» —así encuentro el mandamiento—: «No siembren entre espinos; circuncídense para su Señor».[b] ¿Y qué dice? «Circunciden la dureza de su corazón, y entonces no endurecerán su cuello». Consideren también esto: «Miren —dice el Señor—, todas las naciones tienen incircunciso el prepucio, pero este pueblo tiene incircunciso el corazón».


    Pero tú dirás: «En verdad, el pueblo fue circuncidado como señal». No, porque también lo están todos los sirios y los árabes, y todos los sacerdotes de los ídolos. ¿Acaso todos ellos pertenecen también a su pacto? Además, también los egipcios se cuentan entre los circuncidados.


    Aprendan, pues, plenamente acerca de todas estas cosas, hijos del amor: Abraham, quien primero estableció la circuncisión, contempló anticipadamente en el Espíritu a Jesús cuando circuncidó, pues había recibido las disposiciones de tres letras.


    Porque la Escritura dice: «Y Abraham circuncidó a dieciocho y trescientos varones de su casa».[c] ¿Cuál fue, entonces, el conocimiento que se le dio? Entiendan que menciona primero los dieciocho y luego, tras una separación, los trescientos. En el número dieciocho, la «I» representa diez y la «H», ocho. Ahí tienen a JESÚS (IHSOYS).[d] Y como la cruz representada por la «T» había de traer gracia, menciona también los trescientos. Así revela a Jesús en las dos letras y la cruz en la restante.


    Lo sabe quien puso dentro de nosotros el don innato de su pacto: nadie ha aprendido jamás de mí una palabra más auténtica. Pero sé que ustedes son dignos de ella.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio textual suministrado contiene después de «mi siervo» una señal intrusa («~y»), probablemente ajena al texto; se omite.
    reason: Advertir una anomalía material del testimonio sin incorporarla al cuerpo del texto.
  - marker: b
    text: La expresión traducida «circuncídense para su Señor» es difícil y su forma exacta requiere revisión directa de los testigos griegos y latinos.
    reason: Preservar la incertidumbre textual y sintáctica reconocida en la fuente proporcionada.
  - marker: c
    text: El argumento separa «dieciocho» de «trescientos», aunque la cifra total corresponde a los trescientos dieciocho hombres de la casa de Abraham; véase Génesis 14:14 en la tradición griega.
    reason: Hacer comprensible la base numérica de la interpretación sin armonizar el texto principal.
  - marker: d
    text: 'La interpretación se basa en la numeración griega: iota (Ι) vale diez, eta (Η) vale ocho y tau (Τ) vale trescientos. Las dos primeras letras evocan el comienzo del nombre griego de Jesús (ΙΗΣΟΥΣ), y la tau se entiende como figura de la cruz.'
    reason: El juego de letras y números no resulta transparente para lectores modernos ni funciona con el alfabeto español.
lexical_decisions:
- source_word: περιτομή / circumcision (as reflected in the witness)
  choice: circuncisión / circuncidar
  rationale: Conserva la imagen corporal y su reinterpretación espiritual, esencial para el argumento del capítulo.
- source_word: σφραγίς / seal (as reflected in the witness)
  choice: señal
  rationale: En este contexto designa una marca identificadora del pacto; «señal» resulta natural sin imponer un sentido sacramental técnico.
- source_word: διαθήκη / covenant (as reflected in the witness)
  choice: pacto
  rationale: Es el equivalente bíblico usual y accesible en español latinoamericano.
- source_word: τέκνα ἀγάπης / children of love (as reflected in the witness)
  choice: hijos del amor
  rationale: Mantiene la expresión afectiva y semítica sin convertirla interpretativamente en «amados hijos».
- source_word: γνῶσις / knowledge (as reflected in the witness)
  choice: conocimiento
  rationale: Preserva la terminología exegética del autor y evita cargarla con connotaciones posteriores de «gnosis».
- source_word: ἔμφυτος δωρεά / innate gift (as reflected in the witness)
  choice: don innato
  rationale: Retiene la idea difícil de un don implantado o connatural sin explicarla de manera excesiva.
theological_decisions:
- issue: Referente de los pronombres divinos en «él circuncidó»
  choice: Conservar «él» en minúscula
  alternative: Explicitar «Dios» o usar mayúscula reverencial
  rationale: El testimonio suministrado alterna referencias cuyo sujeto se infiere por el contexto; no se resuelve más de lo que permite la evidencia disponible.
- issue: Afirmación polémica sobre la circuncisión física
  choice: Traducir de forma directa «ha quedado anulada»
  alternative: Suavizar como «no basta» o «ha perdido su valor»
  rationale: La formulación del testimonio es fuerte; suavizarla alteraría la tensión teológica e histórica del escrito.
- issue: «Un ángel maligno les enseñó astucia»
  choice: Conservar literalmente la atribución
  alternative: Interpretar «ángel» como mensajero humano o «astucia» como engaño
  rationale: Se mantiene la ambigüedad del agente y el juicio polémico del autor sin añadir una identificación doctrinal.
- issue: Lectura cristológica de los números y letras
  choice: Preservar el razonamiento I-H-T y explicarlo solo en nota
  alternative: Corregirlo según ortografía española o sustituirlo por letras griegas normalizadas en el cuerpo
  rationale: El argumento depende de la numeración y las formas gráficas antiguas; debe conservarse como exégesis propia del autor.
- issue: «Contempló anticipadamente en el Espíritu a Jesús»
  choice: Mantener la afirmación cristológica explícita
  alternative: Diluirla como «previó espiritualmente»
  rationale: La referencia a Jesús es expresa en el testimonio y forma el núcleo del argumento tipológico.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural exhortativo y «tú» donde el autor introduce a un interlocutor singular. Se conservan la repetición retórica de «dice también», la polémica del pasaje y su exégesis alfabético-numérica. Dado que la revisión directa del griego y el latín está pendiente, el borrador sigue críticamente el testimonio público suministrado y señala las dificultades relevantes.
