base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: es
  text: 'Pasemos ahora a otra lección y enseñanza. Hay dos caminos de enseñanza y de poder: el de la luz y el de la oscuridad. Existe una gran diferencia entre ambos caminos, pues en uno están apostados los ángeles de Dios que dan luz, y en el otro, los ángeles de Satanás.


    El primero es Señor desde toda la eternidad y por toda la eternidad; el otro, en cambio, es señor de la presente época de maldad.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La traducción de este capítulo es provisional: se basa en un testimonio inglés de dominio público; queda pendiente la revisión directa de los manuscritos griegos y latinos.'
    reason: La información suministrada indica expresamente que la revisión de las fuentes en lenguas antiguas aún está pendiente.
lexical_decisions:
- source_word: two ways
  choice: dos caminos
  rationale: Conserva la imagen ética tradicional de dos modos de vida y resulta natural en español.
- source_word: light giving angels
  choice: ángeles de Dios que dan luz
  rationale: Mantiene la función activa expresada por el testimonio inglés sin reducirla a una cualidad meramente descriptiva.
- source_word: are stationed
  choice: están apostados
  rationale: Preserva la imagen de seres asignados o dispuestos en cada camino.
- source_word: season of iniquity that now is
  choice: la presente época de maldad
  rationale: Expresa el carácter temporal del dominio y conserva la dimensión moral de la frase.
theological_decisions:
- issue: Contraste entre el señorío eterno de Dios y el señorío temporal del adversario
  choice: «Señor» para el primero y «señor» para el otro
  alternative: Usar «Señor» con mayúscula en ambos casos
  rationale: La distinción tipográfica evita sugerir igualdad de rango, sin eliminar el término paralelo del testimonio recibido.
- issue: Identidad de «el primero»
  choice: Mantener la referencia implícita al gobernante del camino de la luz
  alternative: Explicitar «Dios es el Señor»
  rationale: No se añade una identificación ausente de la formulación transmitida, aunque el contexto la hace clara.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva la estructura exhortativa, el paralelismo de los dos caminos y la tensión entre señorío eterno y autoridad temporal.
