base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/016.yaml
  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: es
  text: 'Además, les hablaré también acerca del templo: cómo aquellos desdichados, extraviados, pusieron su esperanza en el edificio y no en el Dios que los creó, como si este fuera casa de Dios.


    Pues casi como los gentiles, lo consagraron en el templo.[a] Pero ¿qué dice el Señor al abolir el templo? Aprendan: «¿Quién midió el cielo con la palma de su mano, o midió la tierra con su mano? ¿Acaso no fui yo? —dice el Señor—. El cielo es mi trono, y la tierra, el estrado de mis pies. ¿Qué clase de casa me edificarán? ¿O cuál será el lugar de mi reposo?» Comprenden que la esperanza de ellos es vana.


    Además, dice de nuevo: «Miren, los mismos que derribaron este templo lo edificarán».


    Y así sucede: por haber ido a la guerra, sus enemigos lo derribaron; y ahora hasta los siervos de sus enemigos lo edificarán.


    También se reveló cómo serían entregados la ciudad, el templo y el pueblo de Israel. Pues la Escritura dice: «En los últimos días, el Señor entregará a la destrucción las ovejas del pastizal, el redil y su torre». Y sucedió tal como había dicho el Señor.


    Pero investiguemos si existe algún templo de Dios. Sí existe: allí donde él mismo se propone hacerlo y terminarlo.[b] Pues está escrito: «Y sucederá que, cuando la semana esté llegando a su fin, el templo de Dios será edificado gloriosamente en el nombre del Señor».


    Encuentro, entonces, que hay un templo. ¿Cómo será edificado en el nombre del Señor? Comprendan. Antes de que creyéramos en Dios, la morada de nuestro corazón estaba corrompida y débil; era verdaderamente un templo hecho por manos humanas. Estaba llena de idolatría y era casa de demonios, porque hacíamos todo lo contrario a Dios.


    Pero será edificada en el nombre del Señor. Presten atención, entonces, para que el templo del Señor sea edificado gloriosamente.


    ¿Cómo? Comprendan. Al recibir el perdón de nuestros pecados y poner nuestra esperanza en el Nombre, llegamos a ser nuevos, creados otra vez desde el principio. Por eso Dios habita verdaderamente en nuestra morada, dentro de nosotros. ¿Cómo? La palabra de su fe, el llamado de su promesa, la sabiduría de sus preceptos y los mandamientos de la enseñanza; él mismo profetiza en nosotros, él mismo habita en nosotros, y a nosotros, que estábamos esclavizados a la muerte, nos abre la puerta del templo —que es la boca— y nos da arrepentimiento; así nos conduce al templo incorruptible.[c]


    Porque quien desea salvarse no dirige su mirada a la persona, sino a aquel que habita y habla en ella. Se asombra de no haber oído nunca antes tales palabras de boca de quien habla, ni haber deseado jamás oírlas. Este es el templo espiritual edificado para el Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El referente de «lo consagraron» es incierto en el testimonio disponible; también podría entenderse como una referencia directa a Dios.
    reason: Preserva una ambigüedad pronominal relevante que no debe resolverse sin revisión directa de los testimonios griegos y latinos.
  - marker: b
    text: 'La expresión también puede entenderse: «en el lugar donde él mismo se encarga de hacerlo y completarlo».'
    reason: La formulación es difícil y la fuente antigua requiere revisión; la nota conserva una alternativa semántica cercana.
  - marker: c
    text: 'La sintaxis de esta larga enumeración es difícil: también es posible entender que «la palabra de su fe, el llamado de su promesa, la sabiduría de sus preceptos y los mandamientos de la enseñanza» conducen al templo incorruptible.'
    reason: Hace visible una incertidumbre estructural con incidencia teológica, sin sobrecargar el cuerpo del texto.
lexical_decisions:
- source_word: temple / Greek ναός (probable underlying term)
  choice: templo
  rationale: Conserva de manera natural y uniforme la imagen central del santuario, tanto para el edificio como para la morada espiritual.
- source_word: building
  choice: edificio
  rationale: Lo distingue de «templo» y mantiene la crítica a depositar la esperanza en la estructura material.
- source_word: span
  choice: palma de su mano
  rationale: Expresa en español corriente la antigua medida basada en la mano sin perder la imagen antropomórfica de la cita.
- source_word: undertakes to make and finish it
  choice: se propone hacerlo y terminarlo
  rationale: Mantiene la agencia divina y evita precisar más de lo que permite el testimonio inglés provisional.
- source_word: the Name
  choice: el Nombre
  rationale: La mayúscula conserva su función reverencial y su peso teológico sin sustituirlo por una identificación explícita.
- source_word: ordinances
  choice: preceptos
  rationale: «Preceptos» resulta claro y digno en español latinoamericano, sin imponer una categoría sacramental o jurídica específica.
- source_word: incorruptible
  choice: incorruptible
  rationale: Conserva el contraste conceptual entre la morada anterior, corrupta, y el templo espiritual que no se corrompe.
- source_word: looketh not to the man
  choice: no dirige su mirada a la persona
  rationale: Comunica la idea de fijar la atención o confianza en el mensajero y emplea un sustantivo inclusivo y natural.
theological_decisions:
- issue: Crítica del templo material
  choice: Conservar la afirmación polémica del autor sin suavizarla ni hacerla normativa fuera de su propio argumento.
  alternative: Reformularla como una simple preferencia por el templo espiritual.
  rationale: El pasaje presenta una tensión deliberada entre el edificio y la morada divina en las personas; armonizarla reduciría la fuerza del texto.
- issue: Referente de «lo consagraron»
  choice: Mantener el pronombre «lo» y señalar la dificultad en nota.
  alternative: Traducir «consagraron a Dios» o «consagraron el templo».
  rationale: El testimonio suministrado deja inestable el referente; explicitarlo resolvería indebidamente una ambigüedad genuina.
- issue: Lugar donde Dios construye el templo
  choice: Traducir «allí donde él mismo se propone hacerlo y terminarlo».
  alternative: Identificar de inmediato ese lugar con el corazón humano.
  rationale: Aunque el desarrollo posterior apunta a la morada interior, se preserva la progresión argumental y la formulación inicialmente abierta.
- issue: Sintaxis de los medios de la presencia divina
  choice: Tratar la serie («la palabra... el llamado... la sabiduría... los mandamientos») como explicación de cómo habita Dios, y hacer de Dios el agente que conduce.
  alternative: Hacer que toda la serie sea sujeto gramatical de «nos conduce».
  rationale: La sintaxis del testimonio es densa y admite más de un análisis; esta puntuación ofrece español legible, mientras la nota reconoce la dificultad.
- issue: La persona que habla y quien habita en ella
  choice: Distinguir al mensajero humano de «aquel que habita y habla en ella» sin identificarlo más.
  alternative: Identificar expresamente al habitante como Dios, Cristo o el Espíritu.
  rationale: El contexto sugiere presencia divina, pero el pasaje no exige aquí una identificación denominacional o trinitaria más precisa.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se usa «ustedes» implícito en las formas verbales plurales («aprendan», «comprendan», «presten»), evitando arcaísmos como «vosotros». Se conservan la repetición exhortativa, la imaginería del templo y el tono polémico del escrito. Borrador necesariamente provisional: el material proporcionado identifica el texto base como un testimonio inglés de dominio público y señala que la revisión directa del griego/latín está pendiente.'
