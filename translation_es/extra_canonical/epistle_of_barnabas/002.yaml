base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: es
  text: 'Puesto que los días son malos y el que actúa tiene la autoridad, debemos prestar atención a nosotros mismos y buscar los preceptos del Señor.


    Los apoyos de nuestra fe son el temor y la paciencia, y nuestros aliados son la perseverancia y el dominio propio.


    Mientras estas virtudes permanezcan en un espíritu puro en lo que concierne al Señor, se alegran junto con ellas la sabiduría, el entendimiento, la ciencia y el conocimiento.


    Pues él nos ha dado a conocer por medio de todos los profetas que no desea sacrificios, holocaustos ni ofrendas. En cierta ocasión dijo:


    «¿Qué me importa la multitud de sus sacrificios? —dice el Señor—. Estoy harto de holocaustos; no deseo la grasa de corderos ni la sangre de toros y machos cabríos, ni siquiera cuando vienen a presentarse ante mí. ¿Quién les pidió estas cosas de sus manos? No continúen pisoteando mi atrio. Si traen harina fina, es en vano; el incienso me resulta abominable. No puedo soportar sus lunas nuevas ni sus sábados».


    Por tanto, él anuló estas cosas para que la nueva ley de nuestro Señor Jesucristo, libre del yugo de la imposición, tuviera una ofrenda no hecha por manos humanas.


    También les dice:


    «¿Acaso ordené a sus antepasados, cuando salieron de la tierra de Egipto, que me ofrecieran holocaustos y sacrificios?


    »No. Esto fue lo que les ordené: Que ninguno guarde en su corazón un rencor malicioso contra su prójimo, y que no amen el juramento falso».


    Así pues, a menos que carezcamos de entendimiento, debemos comprender la intención de la bondad de nuestro Padre. Él nos habla porque desea que no nos extraviemos como ellos, sino que busquemos cómo acercarnos a él.


    Así nos dice:


    «El sacrificio para Dios es un corazón quebrantado; aroma grato para el Señor es el corazón que glorifica a su Hacedor».


    Por tanto, hermanos, debemos aprender con exactitud lo referente a nuestra salvación, no sea que el Maligno introduzca en nosotros el error y nos arroje lejos de nuestra vida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐνεργῶν / “the Active One” (witness)
  choice: el que actúa
  rationale: Conserva el sentido verbal y la ambigüedad del título sin convertirlo en un nombre técnico poco natural como «el Activo»; el referente no se identifica explícitamente.
- source_word: φόβος
  choice: temor
  rationale: Mantiene el valor religioso y moral del término sin reducirlo a miedo emocional.
- source_word: μακροθυμία
  choice: perseverancia
  rationale: Expresa paciencia prolongada y entereza; evita la forma menos corriente «longanimidad» para lectores generales.
- source_word: ἐγκράτεια
  choice: dominio propio
  rationale: Equivalente actual y claro para autocontrol o continencia.
- source_word: ἐπιστήμη / “science” (witness)
  choice: ciencia
  rationale: Mantiene la distinción de la serie sapiencial del testimonio, aunque «ciencia» aquí significa saber o comprensión disciplinada, no exclusivamente ciencia moderna.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Término bíblico tradicional para ofrendas totalmente quemadas; el contexto sacrificial impide confundirlo con el uso histórico moderno.
- source_word: προσφορά
  choice: ofrenda
  rationale: Es natural y conserva el sentido cultual; evita el cultismo «oblación» en el cuerpo del texto.
- source_word: ἀχειροποίητος / “not made by human hands”
  choice: no hecha por manos humanas
  rationale: Traducción transparente que conserva el contraste teológico y cultual sin explicar de qué ofrenda se trata.
- source_word: διάνοια / “mind” (witness)
  choice: intención
  rationale: En el contexto apunta al propósito manifestado en la bondad del Padre; «mente de la bondad» sería oscuro en español.
- source_word: ὁ πονηρός / “the Evil One”
  choice: el Maligno
  rationale: Conserva la personificación y el título, sin rebajarlo al mal en abstracto.
theological_decisions:
- issue: Identidad de «el que actúa»
  choice: Se conserva como «el que actúa» sin identificarlo.
  alternative: «el Maligno», «Satanás» o «el poder activo»
  rationale: El testimonio suministrado presenta un título ambiguo. Identificar al referente resolvería una cuestión interpretativa que el texto no resuelve aquí.
- issue: Anulación de los sacrificios
  choice: 'Se traduce de forma directa: «anuló estas cosas».'
  alternative: Explicarlo como abolición total de la ley mosaica o solo rechazo de abusos rituales
  rationale: El autor vincula la anulación con la nueva ley y una ofrenda no manual, pero la traducción no debe añadir un sistema teológico posterior.
- issue: «Nueva ley» de Jesucristo
  choice: Se mantiene «la nueva ley de nuestro Señor Jesucristo».
  alternative: «nuevo pacto» o «nuevo mandamiento»
  rationale: La formulación del testimonio dice «law» y posee peso argumentativo propio; sustituirla alteraría la tensión entre ley, sacrificio y libertad.
- issue: Naturaleza de la ofrenda no hecha por manos humanas
  choice: No se especifica.
  alternative: Identificarla con la Eucaristía, la alabanza, la vida moral o el corazón contrito
  rationale: Las líneas siguientes orientan hacia el corazón y la alabanza, pero el texto no formula una identificación exclusiva.
- issue: Uso de citas proféticas compuestas
  choice: Se presentan como citas del discurso divino según el texto de Bernabé, sin armonizarlas con una versión bíblica canónica moderna.
  alternative: Corregir cada cita para ajustarla literalmente a Isaías, Jeremías, Zacarías o Salmos
  rationale: La forma citada es parte del argumento de la epístola y combina o adapta formulaciones proféticas.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva el tono exhortativo y la textura bíblica sin arcaísmos innecesarios. «Hermanos» reproduce el vocativo histórico. La puntuación organiza las citas extensas para facilitar la lectura. Debido a que la revisión directa del griego y el latín está pendiente y el material proporcionado es un testimonio inglés, las decisiones sobre términos fuente se consideran provisionales y preservan especialmente las ambigüedades señaladas.
