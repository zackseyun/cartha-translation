base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: es
  text: 'Sin embargo, ¿qué les estoy diciendo? ¿Que los que están vivos morirán? ¿Cómo viven en una ilusión? Los ricos se han vuelto pobres y los reyes han sido derribados. Todo está sujeto al cambio. El mundo es una ilusión, si en verdad no estoy exagerando la situación.


    La resurrección, en cambio, no tiene esa naturaleza (ilusoria y pasajera), porque es la realidad que permanece firme. Es la revelación de lo que existe, la transfiguración de las cosas y una transformación en lo nuevo. Porque lo imperecedero [a] [descenderá] sobre lo perecedero. La luz descenderá sobre la oscuridad y la devorará. Entonces la Plenitud llenará la Deficiencia. Estos son símbolos e imágenes de la resurrección. Esto da lugar a lo bueno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio conserva aquí una laguna o señal de daño textual antes de la restauración «[descenderá]».
    reason: El formato de la fuente contiene corchetes vacíos seguidos de una restauración editorial; la nota preserva esa incertidumbre sin dejar un marcador vacío poco claro en el texto principal.
lexical_decisions:
- source_word: illusion
  choice: ilusión
  rationale: Conserva el contraste del testimonio entre la condición cambiante del mundo y la realidad firme de la resurrección, sin introducir una explicación doctrinal adicional.
- source_word: imperishability
  choice: lo imperecedero
  rationale: La forma sustantivada es natural en español y mantiene la oposición abstracta y personificada con «lo perecedero».
- source_word: Fullness
  choice: Plenitud
  rationale: Se conserva como término técnico y se escribe con mayúscula para reflejar su función conceptual en el pasaje.
- source_word: Deficiency
  choice: Deficiencia
  rationale: Mantiene el contraste técnico con «Plenitud» sin reducirlo a pobreza, carencia material u otra interpretación específica.
- source_word: swallowing it up
  choice: la devorará
  rationale: Reproduce con viveza la imagen de absorción o eliminación de la oscuridad.
theological_decisions:
- issue: Naturaleza de la resurrección frente al mundo ilusorio y pasajero
  choice: «no tiene esa naturaleza ilusoria y pasajera»
  alternative: «no es de esa clase»
  rationale: Hace explícito el referente del paréntesis editorial del testimonio, pero no define la resurrección según una tradición confesional.
- issue: Relación entre Plenitud y Deficiencia
  choice: Conservar ambos términos técnicos con mayúscula
  alternative: Traducirlos de manera explicativa como «totalidad» y «carencia»
  rationale: Evita resolver la posible carga cosmológica o teológica del vocabulario y preserva la tensión del texto.
- issue: Resultado final de las imágenes de resurrección
  choice: «Esto produce lo bueno»
  alternative: «Esto constituye el bien»
  rationale: Mantiene la formulación abierta del testimonio, sin identificar «lo bueno» con una doctrina específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan la pregunta abrupta inicial, el lenguaje simbólico y los términos conceptuales «Plenitud» y «Deficiencia». La traducción es provisional porque la revisión directa del copto está pendiente y se basa en el testimonio inglés de dominio público suministrado.
