  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: es
  text: 'Reconozco que estoy dando [] la respuesta en un lenguaje complejo. Sin embargo, no hay nada difícil de entender en la palabra de verdad. La respuesta se manifestó para que nada quedara oculto, sino para hacer manifiesto todo lo relacionado con la existencia. El resultado fue, por una parte, la eliminación del mal y, por otra, la revelación de los escogidos. Todo esto es la emanación de la verdad y del espíritu; la gracia procede de la verdad.


    La gente no piensa que tú ignores que el Salvador se tragó la muerte, porque acabó con el mundo perecedero. Lo transformó[a] en un eón imperecedero y se levantó, tragándose lo visible por medio de lo invisible y abriéndonos así el camino hacia nuestra inmortalidad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El objeto de «transformó» aparece restaurado o incierto en el testimonio; probablemente se refiere al mundo perecedero.
    reason: Conservar la señal editorial de incertidumbre representada por [it] en el testimonio suministrado, usando un marcador obligatorio en el texto principal.
lexical_decisions:
- source_word: word of truth
  choice: palabra de verdad
  rationale: Conserva la formulación conceptual del testimonio sin convertirla en «mensaje verdadero» ni precisar un sentido técnico no demostrado.
- source_word: emanation
  choice: emanación
  rationale: Mantiene el término cosmológico y su posible carga técnica, sin sustituirlo por una paráfrasis interpretativa.
- source_word: aeon
  choice: eón
  rationale: Retiene la amplitud semántica y la posible función técnica del término, evitando reducirlo simplemente a «era» o «mundo».
- source_word: swallowed up
  choice: se tragó / tragándose
  rationale: Reproduce la imagen fuerte y repetida del testimonio, en vez de suavizarla como «venció» o «eliminó».
- source_word: dispensed with
  choice: acabó con
  rationale: Expresa de manera natural la supresión del mundo perecedero sin afirmar con mayor precisión de la disponible cómo ocurrió.
- source_word: raised himself up
  choice: se levantó
  rationale: Preserva la forma reflexiva y su ambigüedad entre levantarse y resucitar, sin resolverla doctrinalmente.
- source_word: paving the way
  choice: abriéndonos así el camino
  rationale: Comunica con naturalidad la metáfora de preparar acceso o tránsito hacia la inmortalidad.
theological_decisions:
- issue: Relación entre verdad, espíritu y gracia
  choice: «la emanación de la verdad y del espíritu; la gracia procede de la verdad»
  alternative: «la emanación de verdad y espíritu, siendo la gracia de la verdad»
  rationale: Conserva las relaciones expresadas por el testimonio sin identificar la emanación con una persona ni sistematizar su cosmología.
- issue: Acción del Salvador respecto de sí mismo
  choice: «se levantó»
  alternative: «se resucitó a sí mismo»
  rationale: Evita imponer una afirmación explícita de autorresurrección cuando el testimonio inglés permite una lectura menos determinada.
- issue: Lo transformado en un eón imperecedero
  choice: Pronombre «Lo» con nota de ambigüedad
  alternative: Identificar expresamente el referente como «el mundo perecedero»
  rationale: El texto suministrado marca el objeto como restaurado o incierto; la traducción no debe ocultar esa condición.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conserva «eón» como término potencialmente técnico y la imagen de tragarse la muerte y lo visible. Los corchetes vacíos después de «dando» reproducen una laguna del testimonio. Borrador provisional basado en el testimonio inglés de dominio público; queda pendiente la revisión directa del copto.
