  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: es
  text: 'Sin embargo, si algunos no creen, es porque no pueden ser convencidos. Pues, hijo mío, que los muertos resucitarán es asunto de fe, no de argumentación.


    Entre los filósofos de este mundo hay algunos que creen, para que al menos ellos resuciten. Y que el filósofo de este mundo no se considere justificado al creer que él mismo vuelve a la vida por sí solo. Pues por nuestra fe conocemos al Hijo del Hombre y creemos que resucitó de entre los muertos. De él declaramos: «Se convirtió en la aniquilación de la muerte». Porque grande es la fe, y <grandes>[a] son quienes creen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El segundo «grandes» está suplido por los editores para completar el sentido de una laguna o expresión incompleta del testimonio.
    reason: Reemplaza la convención editorial de corchetes angulares por una nota explícita y conserva la transparencia textual.
lexical_decisions:
- source_word: believe / belief
  choice: creer / fe
  rationale: Se distingue de manera contextual entre el acto de creer y la fe como realidad o ámbito al que pertenece la resurrección, conservando la repetición conceptual del testimonio.
- source_word: argumentation
  choice: argumentación
  rationale: Mantiene el contraste explícito con la fe sin reducir el término a una simple prueba o razonamiento.
- source_word: feel justified
  choice: se considere justificado
  rationale: Conserva la posible carga forense o teológica de «justificado» sin resolverla como mera seguridad subjetiva.
- source_word: returns himself (to life from death) by himself
  choice: él mismo vuelve a la vida por sí solo
  rationale: Reproduce la insistencia reflexiva del testimonio y explicita naturalmente en español el retorno a la vida.
- source_word: obliteration of death
  choice: aniquilación de la muerte
  rationale: Preserva la fuerza de la imagen, más intensa que «fin» o «derrota», sin identificarla con una formulación doctrinal posterior.
- source_word: Son of Man
  choice: Hijo del Hombre
  rationale: Usa la forma bíblica tradicional y ampliamente comprensible en español.
theological_decisions:
- issue: Relación entre fe y argumentación
  choice: «es asunto de fe, no de argumentación»
  alternative: «pertenece a la fe y no al razonamiento»
  rationale: La formulación escogida conserva el contraste tajante del testimonio sin afirmar que toda reflexión racional sea ilegítima.
- issue: Quién resucita y por qué
  choice: «hay algunos que creen, para que al menos ellos resuciten»
  alternative: «algunos creen que por lo menos resucitarán»
  rationale: Se mantiene la ambigüedad del testimonio entre finalidad y consecuencia, en vez de convertirla sin aviso en contenido de la creencia.
- issue: Agencia en el retorno a la vida
  choice: «él mismo vuelve a la vida por sí solo»
  alternative: «se resucita a sí mismo»
  rationale: La opción elegida conserva la expresión redundante y difícil del testimonio, evitando imponer una lectura metafísica precisa.
- issue: Antecedente de la declaración sobre la muerte
  choice: «De él declaramos» referido al Hijo del Hombre
  alternative: 'Construcción relativa: «de quien declaramos»'
  rationale: Se conserva el antecedente más inmediato del testimonio y se mejora la claridad sintáctica sin añadir una identificación doctrinal.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. El borrador sigue provisionalmente el testimonio inglés de dominio público, pues la revisión directa del copto está pendiente. Se conservaron las tensiones del pasaje, incluidas la relación entre fe y argumentación, la finalidad potencial de «para que» y la insistencia en «él mismo... por sí solo».
