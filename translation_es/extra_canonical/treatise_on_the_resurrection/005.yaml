review_pass:
  verdict: revise
  source_fidelity: 'El borrador sigue de cerca el testimonio inglés provisional y conserva adecuadamente sus ambigüedades principales: la resurrección pertenece a la fe y no a la argumentación; la relación imprecisa entre creer y resucitar; y la insistencia en la acción «él mismo... por sí solo». «Hijo del Hombre» y «aniquilación de la muerte» son opciones fieles y no imponen una interpretación confesional. Se recomienda «llegó a ser» para reflejar de forma más directa «He became». La revisión del copto sigue pendiente, por lo que no se pueden resolver con seguridad dificultades propias del texto subyacente.'
  naturalness: El español es en general natural y de registro digno. Se mejora ligeramente «para que al menos ellos resuciten» a «para que al menos resuciten», sin eliminar la ambigüedad final del original. Es necesario retirar los corchetes angulares del texto, ya que la nota declara que los reemplaza; mantener simultáneamente ambas convenciones resulta tipográficamente inconsistente.
  terminology: «Fe», «creer», «argumentación», «Hijo del Hombre» y «justificado» son terminología apropiada. «Aniquilación» conserva la intensidad de «obliteration» mejor que opciones atenuadas. «Llenó a ser» no corresponde; se usa «llegó a ser».
  issues:
  - severity: low
    issue: La restauración editorial aparece tanto entre corchetes angulares como con llamada de nota.
    rationale: El texto muestra «<grandes>[a]», mientras que la nota afirma reemplazar los corchetes angulares por una nota explícita. Debe emplearse una sola convención para que la restauración sea transparente y legible.
  - severity: low
    issue: «Se convirtió en» es algo menos directo que el predicado de devenir del testimonio.
    rationale: «Llegó a ser la aniquilación de la muerte» refleja más estrechamente «He became the obliteration of death» y mantiene un registro natural.
  revised_text: 'Sin embargo, si algunos no creen, es porque no pueden ser convencidos. Pues, hijo mío, que los muertos resucitarán es asunto de fe, no de argumentación.


    Entre los filósofos de este mundo hay algunos que creen, para que al menos resuciten. Y que el filósofo de este mundo no se considere justificado al creer que él mismo vuelve a la vida por sí solo. Pues por nuestra fe conocemos al Hijo del Hombre y creemos que resucitó de entre los muertos. De él declaramos: «Llegó a ser la aniquilación de la muerte». Porque grande es la fe, y grandes[a] son quienes creen.'
  revised_footnotes:
  - marker: a
    text: El segundo «grandes» está suplido por los editores para completar el sentido de una laguna o expresión incompleta del testimonio.
    reason: Indica explícitamente la restauración editorial sin conservar además los corchetes angulares de la convención del testimonio inglés.
  revision_rationale: La revisión corrige la presentación inconsistente de la restauración editorial y ajusta una formulación verbal para una correspondencia más directa con el testimonio. Conserva la estructura, las repeticiones conceptuales y las ambigüedades del pasaje, sin formular conclusiones doctrinales ni suplir más contenido del que indica la restauración editorial.
