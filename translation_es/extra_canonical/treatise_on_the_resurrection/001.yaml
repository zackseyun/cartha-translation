review_pass:
  verdict: revise
  source_fidelity: La versión sigue fielmente el testimonio inglés provisional. No obstante, conviene conservar explícitamente la señal parentética de «(interpretation)», que el borrador convirtió en una afirmación plenamente resuelta, y mantener el cambio verbal de «received» a «obtained» en la frase siguiente.
  naturalness: El español es claro, moderno y de registro apropiado. Se ajusta «mientras que» a «pues» para evitar una oposición temporal algo forzada y se usa «reposo» para reflejar de manera más cercana el término formal «repose».
  terminology: «Regino», «palabra de la verdad», «resurrección» y la secuencia «nuestro Salvador, nuestro Señor Cristo» son elecciones admisibles y no imponen una lectura doctrinal. Se preserva la satisfacción parentética como señal editorial del testimonio.
  issues:
  - severity: medium
    issue: Se eliminó la señal parentética en «correct (interpretation)».
    rationale: El testimonio inglés marca «interpretation» entre paréntesis. «La interpretación correcta» normaliza esa incertidumbre editorial; debe conservarse la señal, aun si el resultado es menos fluido.
  - severity: low
    issue: «La recibimos» nivela el verbo «obtained».
    rationale: El testimonio distingue «we have received» de «We obtained it». «La obtuvimos» conserva esa variación sin alterar el sentido.
  - severity: low
    issue: «Mientras que» resulta más contrastivo y temporal de lo que exige el testimonio.
    rationale: «Pues» expresa con mayor naturalidad la razón o contraste implícito de «when we have received» en este puente inglés.
  revised_text: '[] Hijo mío, Regino, algunos desean aprender muchas cosas. Este es su propósito cuando se ocupan de preguntas cuyas respuestas desconocen. Si logran responderlas, tienden a creerse muy importantes. Yo, sin embargo, no creo que hayan alcanzado la palabra de la verdad. Más bien, buscan su propia satisfacción, pues hemos recibido (la verdadera satisfacción) por medio de nuestro Salvador, nuestro Señor Cristo. [] La obtuvimos cuando conocimos la verdad y hallamos en ella nuestro reposo.



    Sin embargo, puesto que cortésmente preguntas cuál es la (interpretación) correcta de la resurrección, te escribo lo esencial. Muchos, sin duda, no creen en ella; unos pocos, sin embargo, la encuentran. Hablemos, pues, del tema.'
  revised_footnotes: []
  revision_rationale: 'Se conservan los corchetes vacíos y se restituye la parentetización editorial presente en el testimonio inglés. La redacción permanece provisional: el expediente especifica que la revisión directa del copto aún está pendiente. No se añaden notas, pues no hay anclas ni notas de fuente que requieran desarrollo.'
