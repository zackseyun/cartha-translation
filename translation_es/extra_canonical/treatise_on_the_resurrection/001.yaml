translation:
  language: es
  text: '[] Hijo mío, Regino, algunos desean aprender muchas cosas. Este es su propósito cuando se ocupan de preguntas cuyas respuestas desconocen. Si logran responderlas, tienden a creerse muy importantes. Yo, sin embargo, no creo que hayan alcanzado la palabra de la verdad. Más bien, buscan su propia satisfacción, mientras que nosotros hemos recibido la verdadera satisfacción por medio de nuestro Salvador, nuestro Señor Cristo. [] La recibimos cuando conocimos la verdad y hallamos en ella nuestro descanso.


    Ahora bien, puesto que cortésmente preguntas cuál es la interpretación correcta de la resurrección, te escribo lo esencial. Muchos, sin duda, no creen en ella; unos pocos, sin embargo, la encuentran. Hablemos, pues, del tema.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Rheginos
  choice: Regino
  rationale: Se adapta el nombre a una forma natural en español sin alterar su identificación.
- source_word: word of truth
  choice: palabra de la verdad
  rationale: Se conserva la expresión formal del testimonio, incluida su posible densidad conceptual.
- source_word: satisfaction
  choice: satisfacción
  rationale: Mantiene el contraste léxico explícito entre la satisfacción que algunos buscan y la que los destinatarios han recibido.
- source_word: repose
  choice: descanso
  rationale: Expresa con naturalidad la idea de reposo sin imponer una interpretación técnica adicional.
- source_word: resurrection
  choice: resurrección
  rationale: Es el equivalente directo y teológicamente no restrictivo del término transmitido.
- source_word: find it
  choice: la encuentran
  rationale: Conserva la formulación inusual y su contraste con la falta de fe, sin aclararla de manera interpretativa.
theological_decisions:
- issue: Naturaleza de la «satisfacción» recibida
  choice: verdadera satisfacción
  alternative: satisfacción
  rationale: Los paréntesis del testimonio indican una aclaración editorial; se incorpora de forma discreta para conservar el contraste, sin desarrollar una doctrina.
- issue: Sentido de «encontrar» la resurrección
  choice: la encuentran
  alternative: llegan a comprenderla
  rationale: Se preserva la tensión y ambigüedad del testimonio en vez de reducirla a comprensión intelectual.
- issue: Título cristológico
  choice: nuestro Salvador, nuestro Señor Cristo
  alternative: nuestro Salvador y Señor, Cristo
  rationale: Se mantiene la secuencia y relación titular del testimonio sin armonizarla con una fórmula confesional posterior.
- issue: Interpretación correcta de la resurrección
  choice: cuál es la interpretación correcta de la resurrección
  alternative: qué es realmente la resurrección
  rationale: Se conserva la señal interpretativa presente en el testimonio inglés provisional, reconociendo que la revisión copta está pendiente.
translation_notes:
