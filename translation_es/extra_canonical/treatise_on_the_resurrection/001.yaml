source:
  text: '[] My son Rheginos, some wish to learn many things. This is their objective when preoccupied with questions whose answers they lack. If they are successful with these, they tend to think of themselves as quite important. I, however, do not believe they have attained to the word of truth. Instead, they look out for their own satisfaction, when we have received (true satisfaction) through our Savior, our Lord Christ. [] We obtained it when we knew the truth and found our repose in it.


    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
