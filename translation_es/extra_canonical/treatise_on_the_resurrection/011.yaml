    Ahora bien, no se preocupen por compartir esto con nadie entre ustedes, porque puede ser de provecho.[b]


    Muchos están investigando (las cuestiones acerca de las cuales les he escrito). A ellos les digo: Paz y gracia sean con ellos.


    Les envío saludos a ustedes y a quienes los aman con amor fraternal.


    Tratado sobre la Resurrección'
