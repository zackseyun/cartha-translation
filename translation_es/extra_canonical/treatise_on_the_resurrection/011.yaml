translation:
  language: es
  text: 'Por la bondad de mi [a] Señor Jesucristo he recibido todo esto. Acerca de estas cosas los he instruido a ustedes y a sus [hermanos y hermanas], hijos míos, sin omitir nada que pudiera fortalecerlos. Sin embargo, si en mi explicación de la palabra he escrito algo que resulte oscuro, se lo explicaré si me lo preguntan.


    Ahora bien, no se preocupen por compartir esto con alguno de ustedes, porque puede ser de provecho.[b]


    Muchos están investigando las cuestiones sobre las que les he escrito. A ellos les digo: Paz y gracia sean con ellos.


    Les envío saludos a ustedes y a quienes los aman con amor fraternal.


    Tratado sobre la Resurrección'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El testimonio disponible señala aquí una laguna o una restauración incierta antes de «Señor».
    reason: Preservar la señal de daño o ausencia textual indicada por los corchetes vacíos de la fuente de trabajo.
  - marker: b
    text: La sintaxis de esta oración es incierta en el testimonio disponible; también podría entenderse como una advertencia acerca de compartir el escrito.
    reason: Advertir al lector de una dificultad textual real sin resolverla silenciosamente.
lexical_decisions:
- source_word: graciousness
  choice: bondad
  rationale: Expresa de manera natural la disposición benévola del Señor sin imponer un tecnicismo doctrinal como «gracia» en una construcción poco idiomática.
- source_word: the word
  choice: la palabra
  rationale: Conserva la amplitud de la expresión del testimonio, que puede aludir al mensaje, la enseñanza o la exposición, sin resolverla indebidamente.
- source_word: strengthen
  choice: fortalecerlos
  rationale: Mantiene la imagen de dar firmeza o vigor a los destinatarios en un español claro y digno.
- source_word: brothers and sisters
  choice: hermanos y hermanas
  rationale: Hace explícito el sentido inclusivo indicado por la restauración del testimonio inglés.
- source_word: love of brothers and sisters
  choice: amor fraternal
  rationale: Es la formulación idiomática neutral para el afecto propio de una comunidad de hermanos y hermanas.
theological_decisions:
- issue: Fuente de lo recibido por el autor
  choice: «Por la bondad de mi [a] Señor Jesucristo he recibido todo esto»
  alternative: «Por la gracia de mi [a] Señor Jesucristo...»
  rationale: «Bondad» preserva el sentido de benevolencia de graciousness sin convertir necesariamente la frase en una fórmula técnica sobre la gracia.
- issue: Sentido de «la palabra»
  choice: Se conserva «la palabra»
  alternative: «el mensaje» o «la enseñanza»
  rationale: La referencia es ambigua y puede designar el discurso, el mensaje o su explicación; no se identifica de forma explícita con una doctrina particular.
- issue: Instrucción sobre compartir el escrito
  choice: Se conserva la formulación afirmativa del testimonio disponible
  alternative: Entender la frase como una prohibición de divulgar el escrito
  rationale: La relación entre «no se preocupen», «compartir» y «puede ser de provecho» es difícil; la traducción no añade una restricción doctrinal o disciplinaria ausente del testimonio suministrado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y «hijos míos» para conservar el tono afectuoso del remitente. El borrador es provisional porque se basa en el testimonio inglés de dominio público y aún requiere cotejo directo con el copto del Códice I,4 de Nag Hammadi. Se excluyeron las preguntas frecuentes, los datos de contacto y el aviso comercial posteriores al título por ser material editorial moderno ajeno a la obra antigua.
