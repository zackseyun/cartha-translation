review_pass:
  verdict: revise
  source_fidelity: El borrador conserva en general el contenido del testimonio inglés provisional y excluye correctamente el material editorial moderno. Sin embargo, desplaza indebidamente la laguna indicada por «my [] Lord» al artículo femenino español («mi [a] Señor»), y omite la señal de restauración de «[I have] instructed». La oración sobre compartir el escrito sigue siendo sintácticamente difícil en el testimonio; debe conservarse como exhortación a no angustiarse, no como prohibición.
  naturalness: «Por la bondad de mi [a] Señor» y «compartir esto con alguno de ustedes» resultan poco naturales. Reordenar la primera frase y emplear «con nadie entre ustedes» da un español latinoamericano más fluido. «Paz para ellos, y gracia» refleja la forma elíptica de la fuente sin añadir «sean con ellos».
  terminology: «Bondad» es una opción defendible para el inglés provisional «graciousness» y evita convertirlo automáticamente en un tecnicismo. «La palabra», «hermanos y hermanas» y «amor fraternal» son adecuados; las dos primeras expresiones preservan, respectivamente, la amplitud y la explicitación inclusiva del testimonio.
  issues:
  - severity: medium
    issue: La laguna textual se representa como «mi [a] Señor».
    rationale: 'Los corchetes vacíos de la fuente aparecen entre «my» y «Lord» y no justifican insertar una «a» española. Debe mantenerse una laguna vacía en esa posición: «mi [] Señor».'
  - severity: medium
    issue: Se perdió el corchete de restauración en «[I have] instructed».
    rationale: El testimonio inglés marca como restaurado o incierto el auxiliar verbal. La traducción debe conservar esa señal como «[he] instruido».
  - severity: medium
    issue: La frase sobre compartir presenta una formulación española imprecisa.
    rationale: «Con alguno de ustedes» no reproduce naturalmente «with anyone among you». «Con nadie entre ustedes» conserva el alcance indefinido; «no se angustien» mantiene el sentido no prohibitivo de «be not anxious», aunque la sintaxis subyacente siga siendo difícil.
  - severity: low
    issue: «Paz y gracia sean con ellos» explicita una cópula no expresada en el testimonio.
    rationale: No altera sustancialmente el sentido, pero «Paz para ellos, y gracia» sigue más de cerca la bendición elíptica transmitida.
  revised_text: 'He recibido todo esto por la bondad de mi [] Señor Jesucristo. Acerca de estas cosas, [he] instruido a ustedes y a sus [hermanos y hermanas], hijos míos, sin omitir nada que pudiera fortalecerlos. Sin embargo, si en mi explicación de la palabra he escrito algo oscuro, se lo explicaré si me lo preguntan.


    Ahora bien, no se angustien por compartir esto con nadie entre ustedes, porque puede ser útil.[a]


    Muchos están investigando las cuestiones sobre las que les he escrito. A ellos les digo: Paz para ellos, y gracia.


    Les envío saludos a ustedes y a quienes los aman con amor fraternal.


    Tratado sobre la Resurrección'
  revised_footnotes:
  - marker: a
    text: La sintaxis de esta oración es incierta en el testimonio disponible; también podría entenderse como una advertencia acerca de compartir el escrito.
    reason: La dificultad sintáctica del testimonio inglés provisional permanece y no debe resolverse silenciosamente.
  revision_rationale: La revisión conserva todas las señales de laguna o restauración presentes en el testimonio de trabajo, corrige la ubicación errónea de la laguna española, mejora la naturalidad sin resolver la oración difícil como una prohibición y ajusta la bendición final al carácter elíptico de la fuente. El título se mantiene y el contenido editorial moderno permanece excluido.
