review_pass:
  verdict: revise
  source_fidelity: La traducción reproduce adecuadamente el argumento, la elección para salvación y redención, y la oposición entre la Plenitud, el mundo y el Todo. Sin embargo, debe conservarse de manera visible el paréntesis de «(salvación)», el artículo parentético de «(el) mundo» y la laguna vacía tal como la transmite el testimonio, sin convertirla en puntos suspensivos ni desplazarla de su posición.
  naturalness: El español es claro, actual y de registro apropiadamente sentencioso. Se ajusta «orden» a «sistema» para reflejar el término del testimonio sin una reinterpretación innecesaria, y se normaliza levemente el orden de las oraciones.
  terminology: Se mantienen «salvación», «redención», «Plenitud» y «el Todo» como términos diferenciados. «Sistema» conserva el término de la fuente y la nota explica el posible sentido cosmológico de «Plenitud» sin imponer «Pleroma».
  issues:
  - severity: medium
    issue: Los paréntesis de incertidumbre o aclaración no se preservan en el texto principal.
    rationale: El testimonio presenta «(salvation)» y «(the) world». La nota sobre salvación no sustituye la señal visible en el texto, y la omisión de «(el)» elimina una ambigüedad editorial transmitida.
  - severity: medium
    issue: La laguna manuscrita se representa como «[...]» y en una posición sintáctica distinta.
    rationale: 'La fuente emplea corchetes vacíos: «did not [] come into being». Los puntos suspensivos afirman una extensión indeterminada que el testimonio no especifica. En español, «No [] llegó a existir» conserva tanto la laguna vacía como su ubicación.'
  - severity: low
    issue: «Orden» sustituye «system».
    rationale: Aunque «orden» es posible como interpretación cosmológica, «sistema» mantiene con mayor transparencia el término del testimonio de trabajo y evita precisar su sentido.
  revised_text: Lo que han pensado los que son salvos no perecerá. La mente de quienes han conocido (la salvación)[a] no perecerá. Por eso fuimos escogidos para salvación y redención, pues desde el principio estaba predeterminado que no caeríamos en la insensatez de los ignorantes, sino que entraríamos en la sabiduría de quienes conocen la verdad. La verdad que ellos preservan no puede ni podrá perderse. El sistema de la Plenitud[b] es fuerte. Lo que se desprendió y llegó a ser (el) mundo es débil. El Todo, sin embargo, es lo que se preserva. No [] llegó a existir[c]; ya existía.
  revised_footnotes:
  - marker: a
    text: «La salvación» aparece entre paréntesis en el testimonio inglés suministrado, lo que puede señalar una aclaración o una lectura incierta.
    reason: Conservar en el texto y explicar la señal editorial del testimonio de trabajo.
  - marker: b
    text: «Plenitud» puede ser un término cosmológico técnico; también suele transliterarse «Pleroma».
    reason: Informar del posible valor especializado sin imponer la transliteración en el texto principal.
  - marker: c
    text: Los corchetes vacíos señalan una laguna o un pasaje ilegible en este punto del manuscrito; no es posible determinar si faltan palabras ni cuántas.
    reason: Representar sin ampliarla la laguna indicada por el testimonio.
  revision_rationale: 'La revisión preserva todas las marcas editoriales del testimonio inglés provisional: los paréntesis en «(la salvación)» y «(el) mundo», y los corchetes vacíos de la laguna. Asimismo, restituye «sistema» para mantener una equivalencia más directa con «system», sin alterar la ambigüedad cosmológica del pasaje.'
