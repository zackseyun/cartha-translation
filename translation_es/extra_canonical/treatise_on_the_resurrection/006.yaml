id: TRES.006
reference: Treatise on the Resurrection — Chosen for Salvation
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: es
  text: Lo que han pensado los que son salvos no perecerá. La mente de quienes han conocido la salvación[a] no perecerá. Por eso fuimos escogidos para salvación y redención, pues desde el principio estaba predeterminado que no caeríamos en la insensatez de los ignorantes, sino que entraríamos en la sabiduría de quienes conocen la verdad. La verdad que ellos preservan no puede ni podrá perderse. Firme es el orden de la Plenitud[b]. Débil es lo que se desprendió y llegó a ser el mundo. El Todo, sin embargo, es lo que se preserva. No llegó a existir [...][c]; ya existía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «La salvación» aparece entre paréntesis en el testimonio inglés suministrado, lo que señala una aclaración o una lectura incierta.
    reason: Preservar la incertidumbre textual transmitida por la fuente de trabajo.
  - marker: b
    text: «Plenitud» puede ser un término cosmológico técnico; también suele transliterarse «Pleroma».
    reason: Informar al lector del posible valor especializado sin imponer la transliteración en el texto principal.
  - marker: c
    text: Hay una laguna o un pasaje ilegible en este punto del manuscrito; no es posible saber si faltan palabras.
    reason: Representar explícitamente el daño manuscrito indicado por los corchetes vacíos del testimonio.
lexical_decisions:
- source_word: mind
  choice: mente
  rationale: Conserva el singular del testimonio y evita convertirlo sin necesidad en el plural «las mentes».
- source_word: salvation and redemption
  choice: salvación y redención
  rationale: Mantiene la distinción entre ambos términos teológicos sin armonizarlos.
- source_word: system
  choice: orden
  rationale: En este contexto cosmológico, «orden» resulta más natural que «sistema» y comunica una realidad estructurada sin imponer una interpretación técnica moderna.
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula conserva su posible sentido cosmológico o técnico, sin explicarlo dentro del texto.
- source_word: broke loose
  choice: se desprendió
  rationale: Reproduce la idea de separación o ruptura y deja abierta la naturaleza exacta del proceso.
- source_word: the All
  choice: el Todo
  rationale: Conserva la designación totalizante y su carácter posiblemente técnico mediante la mayúscula.
- source_word: preserved
  choice: se preserva
  rationale: Mantiene la repetición léxica con la verdad que «preservan» y evita precisar indebidamente quién realiza la acción.
theological_decisions:
- issue: Conocimiento de la salvación
  choice: quienes han conocido la salvación
  alternative: quienes han conocido
  rationale: El testimonio incluye «salvation» entre paréntesis; se conserva en el texto con nota de incertidumbre en vez de eliminarlo o presentarlo como completamente seguro.
- issue: Predeterminación y elección
  choice: desde el principio estaba predeterminado que no caeríamos
  alternative: desde el principio se había decidido que no caeríamos
  rationale: Se conserva el lenguaje explícito de predeterminación y la tensión teológica del pasaje, sin suavizarlo ni ampliarlo doctrinalmente.
- issue: Relación entre la Plenitud, el mundo y el Todo
  choice: Firme es el orden de la Plenitud. Débil es lo que se desprendió y llegó a ser el mundo. El Todo, sin embargo, es lo que se preserva.
  alternative: El sistema del Pleroma es fuerte. Lo que se separó para convertirse en el mundo es débil. Pero el universo se conserva.
  rationale: La formulación mantiene diferenciados los términos potencialmente técnicos, evita identificar «el Todo» con el universo físico y conserva la ambigüedad de la relación entre separación y formación del mundo.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. La sintaxis conserva el tono sentencioso del tratado, pero evita calcos innecesarios. Borrador provisional basado en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto.
