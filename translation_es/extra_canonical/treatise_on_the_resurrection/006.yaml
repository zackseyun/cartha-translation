review_pass:
  verdict: revise
  source_fidelity: 'Se requiere una revisión limitada para reflejar elementos presentes tanto en el testimonio de trabajo como en la auditoría inglesa: «in fact», el carácter explícito de «system» y el artículo parentético de «(the) world». La laguna debe representarse sin convertir los corchetes vacíos en puntos suspensivos.'
  naturalness: El español del borrador es claro, actual y de registro adecuado. La sintaxis más directa en las dos afirmaciones sentenciosas finales conserva bien el sentido sin perder dignidad.
  terminology: «Salvación», «redención», «Plenitud» y «el Todo» son elecciones adecuadas y conservan los posibles usos técnicos. «Sistema» es preferible a «orden» aquí, pues corresponde de modo más transparente al testimonio y no interpreta la relación cosmológica.
  issues:
  - severity: medium
    issue: Se omite «in fact» / «de hecho».
    rationale: El testimonio inglés de base dice «The truth they preserve in fact cannot and will not be lost». Aunque la versión inglesa POB lo omite, la revisión frente al testimonio suministrado exige conservar este elemento.
  - severity: medium
    issue: «orden» traduce «system».
    rationale: «Orden» puede sugerir una interpretación cosmológica adicional. «Sistema» reproduce el término del testimonio y de la auditoría inglesa con menor intervención interpretativa.
  - severity: medium
    issue: Se omite el paréntesis de «(the) world».
    rationale: El artículo aparece entre paréntesis en ambos textos ingleses y debe conservarse como incertidumbre o aclaración textual, no regularizarse como «el mundo» sin señalamiento.
  - severity: low
    issue: La laguna «[]» se presenta como «[...]».
    rationale: Los corchetes vacíos del testimonio indican una laguna o incertidumbre sin extensión especificada. Los puntos suspensivos añaden una convención no presente en la base.
  revised_text: Lo que han pensado los que son salvos no perecerá. La mente de quienes han conocido la salvación[a] no perecerá. Por eso fuimos escogidos para salvación y redención, pues desde el principio estaba predeterminado que no caeríamos en la insensatez de los ignorantes, sino que entraríamos en la sabiduría de quienes conocen la verdad. La verdad que ellos preservan, de hecho, no puede ni podrá perderse. El sistema de la Plenitud[b] es fuerte. Lo que se desprendió y llegó a ser (el) mundo es débil. El Todo, sin embargo, es lo que se preserva. No llegó a existir [][c]; ya existía.
  revised_footnotes:
  - marker: a
    text: «La salvación» aparece entre paréntesis en el testimonio inglés suministrado, lo que señala una aclaración o una lectura incierta.
    reason: Preservar la incertidumbre textual transmitida por la fuente de trabajo.
  - marker: b
    text: «Plenitud» puede ser un término cosmológico técnico; también suele transliterarse «Pleroma».
    reason: Informar al lector del posible valor especializado sin imponer la transliteración en el texto principal.
  - marker: c
    text: Los corchetes vacíos señalan una laguna o incertidumbre textual en este punto del manuscrito; el testimonio suministrado no permite determinar qué falta.
    reason: Representar el daño o la restauración incierta indicada por «[]», sin añadir una extensión a la laguna.
  revision_rationale: La revisión conserva el carácter provisional de una traducción basada en el testimonio inglés mientras corrige cuatro pérdidas de información textual. No resuelve doctrinalmente los términos técnicos ni especifica la naturaleza de la separación que llega a ser «(el) mundo».
