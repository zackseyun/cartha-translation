base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: es
  text: ¿De qué manera predicó el Señor mientras vivía en la carne y después de revelarse como Hijo de Dios? Habitó en este lugar donde ustedes habitan y habló acerca de la ley de las cosas naturales, a la cual yo, sin embargo, llamo «muerte». Regino, el Hijo de Dios era el Hijo del Hombre. Asumió ambas realidades, pues poseía humanidad y divinidad. Por consiguiente, por una parte, como Hijo de Dios podía desterrar la muerte; y, por otra, como Hijo del Hombre llevó a cabo la restauración de la Plenitud.[a] Esto se debía a que su origen estaba arriba, como semilla de la verdad, antes de que llegara a existir su estructura inferior.[b] En esta surgieron muchos dominios y divinidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Plenitud» puede ser un término técnico del tratado para designar la totalidad o realidad superior; se conserva la mayúscula para señalar esa posibilidad.
    reason: Aclara un concepto especializado sin imponer una interpretación definitiva.
  - marker: b
    text: La expresión «estructura inferior» es incierta. Podría aludir a su constitución en el ámbito inferior, pero la revisión directa del texto copto está pendiente.
    reason: Hace visible la dependencia provisional del testimonio inglés y preserva la ambigüedad textual.
lexical_decisions:
- source_word: lived in the flesh
  choice: vivía en la carne
  rationale: Conserva el lenguaje corporal y teológico del testimonio sin reducirlo a «vivía como ser humano».
- source_word: law of natural things
  choice: ley de las cosas naturales
  rationale: Mantiene una expresión difícil y posiblemente técnica, pues la revisión directa del copto está pendiente.
- source_word: took both to himself
  choice: asumió ambas realidades
  rationale: Expresa que el Hijo de Dios y el Hijo del Hombre, o la humanidad y la divinidad, convergen en él, sin afirmar una formulación doctrinal posterior.
- source_word: banish death
  choice: desterrar la muerte
  rationale: Reproduce la fuerza de apartar o expulsar la muerte.
- source_word: Fullness
  choice: Plenitud
  rationale: La mayúscula señala el probable carácter técnico de este concepto en el tratado.
- source_word: structure
  choice: estructura
  rationale: Retiene deliberadamente el término poco transparente del testimonio inglés hasta que pueda cotejarse con el copto.
- source_word: dominions and divinities
  choice: dominios y divinidades
  rationale: Conserva las dos categorías diferenciadas sin identificarlas de manera especulativa con poderes, autoridades o dioses.
theological_decisions:
- issue: Relación entre el Hijo de Dios y el Hijo del Hombre
  choice: «el Hijo de Dios era el Hijo del Hombre»
  alternative: «el Hijo de Dios se hizo Hijo del Hombre»
  rationale: Se conserva la afirmación de identidad del testimonio, sin introducir una secuencia encarnacional que el texto no explicita.
- issue: Humanidad y divinidad del Señor
  choice: «poseía humanidad y divinidad»
  alternative: «era plenamente humano y plenamente divino»
  rationale: Evita importar una formulación cristológica conciliar posterior más específica que la evidencia disponible.
- issue: Restauración de la Plenitud
  choice: «llevó a cabo la restauración de la Plenitud»
  alternative: «restauró la totalidad»
  rationale: Mantiene el posible sentido cosmológico o técnico y no lo normaliza como una totalidad genérica.
- issue: Origen superior y estructura inferior
  choice: Conservar el contraste «arriba» / «estructura inferior»
  alternative: Interpretarlo como cielo / cuerpo terrenal
  rationale: El referente exacto es incierto y no debe resolverse sin revisión de la fuente copta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y «Regino» como forma hispanizada del nombre. El borrador es necesariamente provisional porque solo se suministró un testimonio inglés de dominio público y la revisión del copto permanece pendiente.
