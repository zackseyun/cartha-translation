id: TRES.010
reference: Treatise on the Resurrection — Experience the Resurrection Now
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing (with others). Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing (with others). Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/010.yaml
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing with others. Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
translation:
  language: es
  text: 'Así pues, oh Regino, no pienses en verdades parciales ni vivas conforme a esta carne solo para estar de acuerdo con los demás. Huye, más bien, de las divisiones y las ataduras, y experimentarás ahora la resurrección. Porque, si lo mortal sabe que morirá, aunque pase muchos años en esta vida, llega a esto: ¿por qué no considerarte resucitado y llegado ya a tu destino?[a]


    Si posees la resurrección, ¿por qué sigues actuando como si todavía fueras a morir? Debes saber que ya estás muerto. No reconoces esto por falta de formación. Es conveniente que todos se ejerciten de diversas maneras; así serán liberados de este elemento[b] para que no caigan en el error, sino que reciban de nuevo lo que existía desde el principio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «resucitado y llegado». El destino o punto de llegada no se especifica en el testimonio disponible.
    reason: La adición mínima «a tu destino» hace natural la frase en español, mientras la nota conserva la forma y ambigüedad del testimonio.
  - marker: b
    text: «Este elemento» es una expresión ambigua; podría aludir a una esfera, condición o componente, pero el testimonio disponible no permite precisarlo.
    reason: Evita que el lector tome «elemento» como una identificación segura del cuerpo, la materia o el mundo.
lexical_decisions:
- source_word: partial (truths)
  choice: verdades parciales
  rationale: Conserva el sentido ofrecido por el testimonio inglés y mantiene visible la referencia elíptica a verdades, sin convertirla en una afirmación doctrinal más precisa de lo que permite la base disponible.
- source_word: flesh
  choice: carne
  rationale: Mantiene el término antropológico tradicional y su posible carga material o existencial, sin reducirlo a «cuerpo» ni interpretarlo como mera conducta pecaminosa.
- source_word: bondages
  choice: ataduras
  rationale: Expresa condiciones de sujeción en español natural y conserva una amplitud que «esclavitudes» podría estrechar.
- source_word: experience the resurrection now
  choice: experimentarás ahora la resurrección
  rationale: Preserva la afirmación temporal enfática y evita debilitarla como simple anticipación o esperanza.
- source_word: training / train
  choice: formación / se ejerciten
  rationale: La variación evita una repetición rígida y comunica tanto la carencia de disciplina o instrucción como la práctica necesaria.
- source_word: this element
  choice: este elemento
  rationale: Se conserva literalmente la expresión ambigua porque la revisión directa del copto está pendiente y no debe identificarse sin evidencia con el cuerpo, el mundo o la materia.
- source_word: what was from the beginning
  choice: lo que existía desde el principio
  rationale: Mantiene indeterminado el referente y expresa con naturalidad la anterioridad señalada por el testimonio.
theological_decisions:
- issue: La resurrección como realidad presente
  choice: «experimentarás ahora la resurrección» y «si posees la resurrección»
  alternative: «tendrás un anticipo de la resurrección»
  rationale: El testimonio presenta la resurrección como experiencia o posesión actual. No se atenúa esa tensión mediante una interpretación futurista.
- issue: La afirmación «ya estás muerto»
  choice: Conservarla de manera directa
  alternative: Explicarla como muerte simbólica o espiritual
  rationale: La base textual no define aquí la clase de muerte; explicitarla resolvería indebidamente una ambigüedad teológica.
- issue: Liberación de «este elemento»
  choice: Mantener el referente sin identificar
  alternative: Traducir «liberados de este cuerpo» o «de este mundo material»
  rationale: Esas alternativas introducirían una interpretación antropológica o cosmológica que el testimonio suministrado no establece con certeza.
- issue: Recuperación de lo primordial
  choice: «reciban de nuevo lo que existía desde el principio»
  alternative: Precisar «recuperen su estado original»
  rationale: Se preserva la indeterminación del objeto recibido y no se impone una doctrina particular sobre la condición original.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «Regino», forma hispanizada reconocible del nombre Rheginos. La traducción es provisional porque la base suministrada es un testimonio inglés de dominio público y la revisión directa del copto sigue pendiente. Se preservan deliberadamente las tensiones entre mortalidad, muerte presente y posesión actual de la resurrección.
