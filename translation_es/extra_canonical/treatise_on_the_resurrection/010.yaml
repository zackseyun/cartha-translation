review_pass:
  verdict: revise
  source_fidelity: La adición «a tu destino» introduce un referente que no está expresado en el testimonio inglés («having arrived»). Aunque la nota reconoce la elipsis, la traducción principal debe conservarla sin completar el supuesto punto de llegada. El resto mantiene adecuadamente las ambigüedades de «carne», «este elemento», la muerte presente y la resurrección como realidad actual.
  naturalness: El registro es claro y apropiado para español latinoamericano neutral. Se mejora levemente «No reconoces esto» por «Lo ignoras», que corresponde más directamente a «You ignore this», y se ajusta la secuencia final para reflejar con claridad la consecuencia expresada en el testimonio.
  terminology: «Regino», «carne», «ataduras», «resurrección», «formación», «ejerciten» y «este elemento» son opciones admisibles. Se conserva «este elemento» sin identificación interpretativa y con nota, dado que la revisión directa del copto sigue pendiente.
  issues:
  - severity: medium
    issue: «a tu destino» completa indebidamente «having arrived».
    rationale: El testimonio no especifica adónde o a qué se ha llegado. La nota no elimina la expansión semántica introducida en el texto.
  - severity: low
    issue: La nota a deja de ser necesaria tras retirar la expansión.
    rationale: La formulación «resucitado y ya llegado» conserva la elipsis del testimonio sin requerir explicación adicional.
  revised_text: 'Así pues, oh Regino, no pienses en verdades parciales ni vivas conforme a esta carne solo para estar de acuerdo con los demás. Huye, más bien, de las divisiones y las ataduras, y experimentarás ahora la resurrección. Porque, si lo mortal sabe que morirá, aunque pase muchos años en esta vida, llega a esto: ¿por qué no considerarte resucitado y ya llegado?


    Si posees la resurrección, ¿por qué sigues actuando como si todavía fueras a morir? Debes saber que ya estás muerto. Lo ignoras por falta de formación. Conviene que todos se ejerciten de diversas maneras, y serán liberados de este elemento[b] para que no caigan en el error, sino que reciban de nuevo lo que existía desde el principio.'
  revised_footnotes:
  - marker: b
    text: «Este elemento» es una expresión ambigua; podría aludir a una esfera, condición o componente, pero el testimonio disponible no permite precisarlo.
    reason: Evita identificar de manera insegura el referente con el cuerpo, la materia o el mundo.
  revision_rationale: Se elimina una ampliación interpretativa del complemento elíptico de «having arrived» y su nota asociada. Los demás cambios son de correspondencia léxica y fluidez, sin resolver ambigüedades teológicas o antropológicas que el testimonio disponible no resuelve.
