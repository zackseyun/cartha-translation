translation:
  language: es
  text: 'Por tanto, nunca dudes acerca de la resurrección, hijo mío, Regino. Porque, si en otro tiempo no vivías en carne, te revestiste de carne cuando entraste en este mundo.


    ¿Por qué no habrías de revestirte de carne cuando regreses y asciendas al eón?[a] Lo que es mejor que la carne es lo que da vida. Lo que llegó a existir por causa tuya, ¿acaso no te pertenece? Y lo que te pertenece, ¿acaso no existe contigo? Pero mientras estás en este mundo, ¿qué te falta? Esto es lo que tanto te has esforzado por descubrir.


    La placenta del cuerpo es la vejez,[b] y tú te encuentras en un estado de mortalidad. Lo que te falta es una ganancia, pues, si partes, no perderás lo mejor. Lo inferior se deteriora, pero hay gracia para ello.[c]


    Así pues, nada puede rescatarnos de este mundo. Sin embargo, nosotros somos el Todo; por eso somos salvados.[d] Hemos recibido la salvación desde el principio hasta el fin. Pensemos de esta manera. Entendamos de esta manera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eón» es un término técnico que puede designar una edad, un ámbito trascendente o una realidad eterna. El testimonio disponible incluye entre paréntesis la idea de «regresar»; aquí se integra en la oración, pero requiere revisión directa del copto.
    reason: Aclarar un término especializado y señalar una incertidumbre textual del testimonio.
  - marker: b
    text: 'Lit. según el testimonio inglés: «lo que sigue al parto del cuerpo» o «la placenta del cuerpo». La imagen y su relación con la vejez son difíciles; traducción provisional pendiente de revisión del copto.'
    reason: Advertir que la metáfora obstétrica es oscura y que la base actual es indirecta.
  - marker: c
    text: 'También podría entenderse: «lo peor decae, pero para ello hay gracia». No se explicita si el referente es la carne, el cuerpo o aquello que se deteriora.'
    reason: Preservar la ambigüedad referencial y valorativa.
  - marker: d
    text: La relación lógica también puede leerse simplemente como «nosotros somos el Todo; somos salvados». El «por eso» refleja el paréntesis explicativo del testimonio inglés.
    reason: Distinguir el texto atestiguado de una conexión lógica indicada editorialmente.
lexical_decisions:
- source_word: flesh
  choice: carne
  rationale: Conserva el término corporal y su tensión conceptual sin sustituirlo por «cuerpo».
- source_word: took on flesh
  choice: te revestiste de carne
  rationale: Expresa la adquisición o asunción de carne de forma natural, sin definir con mayor precisión el mecanismo aludido.
- source_word: aeon
  choice: eón
  rationale: Mantiene el término técnico de la literatura gnóstica y evita reducirlo a «eternidad», «era» o «mundo eterno».
- source_word: the All
  choice: el Todo
  rationale: Conserva como designación conceptual la totalidad trascendente a la que parece referirse el tratado.
- source_word: afterbirth
  choice: placenta
  rationale: Mantiene la imagen obstétrica concreta del testimonio inglés; se señala en nota por su carácter difícil y posiblemente metafórico.
- source_word: what is best / what is worse
  choice: lo mejor / lo inferior
  rationale: Preserva el contraste valorativo sin identificar explícitamente sus referentes.
theological_decisions:
- issue: La carne en la resurrección
  choice: Conservar «revestirse de carne» tanto al entrar en el mundo como al ascender al eón.
  alternative: Interpretar la segunda referencia como recibir un cuerpo espiritual o abandonar la carne.
  rationale: El pasaje mantiene una tensión entre la carne y «lo que es mejor que la carne»; no corresponde resolverla doctrinalmente.
- issue: La afirmación «somos el Todo»
  choice: Traducir literalmente y vincular la salvación mediante «por eso».
  alternative: Parafrasear como pertenencia, integración o retorno al Todo.
  rationale: La formulación ontológica es deliberadamente fuerte y debe conservarse sin imponer una explicación doctrinal.
- issue: «Nada puede rescatarnos de este mundo»
  choice: Mantener la aparente paradoja seguida por «sin embargo».
  alternative: Reformular «nada de este mundo puede rescatarnos» para facilitar la lógica.
  rationale: El testimonio disponible dice «from this world» y la relación con la siguiente afirmación es teológicamente tensa; se preserva hasta revisar el copto.
- issue: Gracia para lo inferior
  choice: Conservar el pronombre «ello» sin identificar su referente.
  alternative: Especificar que hay gracia para la carne, el cuerpo o lo que se deteriora.
  rationale: El antecedente exacto no es seguro en la evidencia suministrada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservan las repeticiones exhortativas, las preguntas retóricas y los términos técnicos. El borrador es necesariamente provisional porque no se proporcionó el texto copto y la revisión directa de la lengua fuente está pendiente; se evitó presentar como segura cualquier reconstrucción doctrinal o textual.
