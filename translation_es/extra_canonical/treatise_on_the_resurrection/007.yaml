review_pass:
  verdict: revise
  source_fidelity: La revisión directa del copto no es posible con los datos suministrados; por ello se contrasta con el testimonio inglés disponible. El texto sigue de cerca el testimonio, pero «placenta» no es equivalente seguro de «afterbirth», que designa de manera más amplia lo expulsado después del parto. Conviene conservar la imagen sin restringirla. «Rescatarnos» para «redeem us» es posible, pero «redimirnos» mantiene mejor el campo léxico del testimonio. Se preservan la ambigüedad de eón, la inserción parentética «regreses» y la relación editorial entre «el Todo» y «somos salvados».
  naturalness: El español es natural y de registro apropiado. «En otro tiempo» puede sugerir un pasado histórico concreto donde «antes» refleja con mayor claridad «once» en este contexto. «Lo inferior» introduce una interpretación comparativa algo distinta de «what is worse»; «lo que es peor» es más fiel y conserva la formulación abierta. «Lo que viene después del parto del cuerpo» es deliberadamente extraño, pero reproduce mejor la oscuridad de la imagen que «placenta».
  terminology: «Carne», «revestirse de carne», «eón» y «el Todo» son elecciones adecuadas. Se mantiene «gracia» sin explicación doctrinal. «Regino» es una adaptación española razonable de Rheginos, aunque la identificación y grafía del nombre quedan sujetas a cotejo del copto; no hace falta nota adicional en este pasaje.
  issues:
  - severity: medium
    issue: «La placenta del cuerpo» restringe indebidamente «the afterbirth of the body».
    rationale: «Afterbirth» puede incluir la placenta, pero no se limita necesariamente a ella. Dado que la metáfora es difícil y la revisión del copto está pendiente, una expresión más amplia evita una precisión anatómica no exigida por el testimonio.
  - severity: low
    issue: «Lo inferior» interpreta «What is worse».
    rationale: Aunque el contraste funciona, «inferior» desplaza el sentido de peor hacia una jerarquía de rango. «Lo que es peor» conserva el comparativo valorativo del testimonio.
  - severity: low
    issue: «Rescatarnos» suaviza el léxico de «redeem».
    rationale: «Redimirnos» es natural en este registro y corresponde más estrechamente al testimonio, sin resolver su sentido teológico.
  revised_text: 'Por tanto, nunca dudes acerca de la resurrección, hijo mío, Regino. Porque, si antes no vivías en carne, te revestiste de carne cuando entraste en este mundo.


    ¿Por qué no habrías de revestirte de carne cuando regreses y asciendas al eón?[a] Lo que es mejor que la carne es lo que da vida. Lo que llegó a existir por causa tuya, ¿acaso no te pertenece? Y lo que te pertenece, ¿acaso no existe contigo? Pero mientras estás en este mundo, ¿qué te falta? Esto es lo que tanto te has esforzado por descubrir.


    Lo que viene después del parto del cuerpo es la vejez,[b] y tú te encuentras en un estado de mortalidad. Lo que te falta es una ganancia, pues, si partes, no perderás lo mejor. Lo que es peor se deteriora, pero hay gracia para ello.[c]


    Así pues, nada puede redimirnos de este mundo. Sin embargo, nosotros somos el Todo; por eso somos salvados.[d] Hemos recibido la salvación desde el principio hasta el fin. Pensemos de esta manera. Entendamos de esta manera.'
  revised_footnotes:
  - marker: a
    text: «Eón» es un término técnico que puede designar una edad, un ámbito trascendente o una realidad eterna. El testimonio disponible incluye entre paréntesis la idea de «regresar»; aquí se integra en la oración, pero requiere revisión directa del copto.
    reason: Aclara el término especializado y señala la incertidumbre textual del testimonio.
  - marker: b
    text: 'Lit. según el testimonio inglés: «lo que viene después del parto del cuerpo». La imagen y su relación con la vejez son difíciles; podría aludir a la placenta u otros elementos posteriores al parto. Traducción provisional pendiente de revisión del copto.'
    reason: Evita identificar sin seguridad «afterbirth» exclusivamente con la placenta y conserva la dificultad de la metáfora.
  - marker: c
    text: 'También podría entenderse: «lo que es peor decae, pero para ello hay gracia». No se explicita si el referente es la carne, el cuerpo o aquello que se deteriora.'
    reason: Preserva la ambigüedad referencial y valorativa.
  - marker: d
    text: La relación lógica también puede leerse simplemente como «nosotros somos el Todo; somos salvados». El «por eso» refleja el paréntesis explicativo del testimonio inglés.
    reason: Distingue el texto atestiguado de una conexión lógica indicada editorialmente.
  revision_rationale: 'Se hacen correcciones puntuales y seguras contra el testimonio inglés: se sustituye «placenta» por una expresión inclusiva para «afterbirth», se conserva el comparativo «lo que es peor» y se usa «redimirnos» para «redeem». El resto preserva las ambigüedades conceptuales, textuales y teológicas del pasaje. La revisión directa del copto sigue siendo necesaria antes de fijar el texto.'
