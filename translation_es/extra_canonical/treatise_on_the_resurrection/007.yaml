review_pass:
  verdict: revise
  source_fidelity: La traducción sigue de cerca el testimonio inglés suministrado y conserva adecuadamente sus tensiones conceptuales. Se requieren ajustes menores para reflejar con más precisión «took on flesh» y «have obtained salvation», y para no presentar como una conexión plenamente integrada la glosa parentética «(so)». La revisión directa del copto sigue pendiente, por lo que se mantiene la cautela ante los pasajes oscuros.
  naturalness: El registro es claro, actual y apropiado para español latinoamericano neutral. «Tomar carne» resulta más directo y menos interpretativo que «revestirse de carne» en este contexto. Se conserva la formulación extraña de la imagen obstétrica mediante nota, pues no es seguro aclararla en el cuerpo del texto.
  terminology: Se mantienen «carne», «eón», «el Todo», «salvación» y «gracia». «Regino» es una adaptación española natural de Rheginos. La expresión «placenta del cuerpo» conserva solo parcialmente el alcance de afterbirth; la nota debe indicar que el término puede abarcar lo expulsado tras el parto, incluida la placenta, sin resolver la imagen.
  issues:
  - severity: medium
    issue: «Te revestiste de carne» para «you took on flesh»
    rationale: «Revestirse» añade una metáfora de vestidura que el testimonio inglés no explicita. «Tomaste carne» conserva mejor la indeterminación de la acción.
  - severity: low
    issue: «Hemos recibido la salvación» para «We have obtained salvation»
    rationale: «Hemos obtenido la salvación» reproduce de modo más preciso el verbo del testimonio, sin alterar el sentido.
  - severity: low
    issue: La glosa parentética «(so)» se transforma en una relación afirmada mediante «por eso» fuera de paréntesis
    rationale: Conviene conservar los paréntesis para señalar que la conexión lógica está marcada editorialmente en el testimonio disponible.
  - severity: low
    issue: La nota sobre «placenta» equipara de manera demasiado estrecha afterbirth con placenta
    rationale: Afterbirth puede designar lo expulsado después del parto e incluir la placenta; la nota debe conservar esa amplitud y la dificultad de la metáfora.
  revised_text: 'Por tanto, nunca dudes acerca de la resurrección, hijo mío, Regino. Porque, si alguna vez no viviste en carne, tomaste carne cuando entraste en este mundo.



    ¿Por qué no tomarías carne cuando regreses y asciendas al eón?[a] Lo que es mejor que la carne es lo que da vida. Lo que llegó a existir por causa tuya, ¿acaso no te pertenece? Y lo que te pertenece, ¿acaso no existe contigo? Pero mientras estás en este mundo, ¿qué te falta? Esto es lo que tanto te has esforzado por descubrir.



    Lo que sigue al parto del cuerpo es la vejez,[b] y tú te encuentras en un estado de mortalidad. Lo que te falta es una ganancia, pues, si partes, no perderás lo mejor. Lo inferior se deteriora, pero hay gracia para ello.[c]



    Así pues, nada puede redimirnos de este mundo. Nosotros, sin embargo, somos el Todo (por eso somos salvados).[d] Hemos obtenido la salvación desde el principio hasta el fin. Pensemos de esta manera. Entendamos de esta manera.'
  revised_footnotes:
  - marker: a
    text: «Eón» es un término técnico que puede designar una edad, un ámbito trascendente o una realidad eterna. El testimonio disponible incluye entre paréntesis la idea de «regresar»; aquí se integra en la oración, pero requiere revisión directa del copto.
    reason: Aclara un término especializado y señala una incertidumbre textual del testimonio.
  - marker: b
    text: 'Lit. según el testimonio inglés: «lo que sigue al parto del cuerpo». «Afterbirth» puede referirse a lo expulsado después del parto, incluida la placenta. La imagen y su relación con la vejez son difíciles; traducción provisional pendiente de revisión del copto.'
    reason: Conserva la amplitud de la imagen obstétrica y advierte su dificultad.
  - marker: c
    text: 'También podría entenderse: «lo peor decae, pero para ello hay gracia». No se explicita si el referente es la carne, el cuerpo o aquello que se deteriora.'
    reason: Preserva la ambigüedad referencial y valorativa.
  - marker: d
    text: La relación lógica también puede leerse simplemente como «nosotros somos el Todo; somos salvados». Los paréntesis conservan la conexión explicativa indicada en el testimonio inglés.
    reason: Distingue el texto atestiguado de la conexión lógica señalada editorialmente.
  revision_rationale: 'Se hacen correcciones puntuales y seguras de fidelidad al testimonio inglés: «tomaste/tomarías carne» evita la metáfora añadida de «revestirse»; «hemos obtenido» refleja obtained; y los paréntesis en la declaración sobre el Todo preservan el estatuto editorial de «(so)». La difícil imagen de afterbirth se traslada de manera más amplia como «lo que sigue al parto» y se explica sin fijar una lectura. No se resuelven cuestiones doctrinales ni ambigüedades que exigen cotejo directo con el copto.'
