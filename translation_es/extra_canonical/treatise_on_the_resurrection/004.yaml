source:
  text: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: es
  text: 'Entonces, como en efecto dijo el apóstol: «Sufrimos con él, resucitamos con él y ascendimos al cielo con él». Ahora bien, si vivimos de manera visible en este mundo, llevamos puesto este mundo. Somos sus rayos resplandecientes y permanecemos con él hasta nuestro ocaso, es decir, hasta nuestra muerte en esta vida. Por medio de él somos atraídos al cielo, como los rayos por el sol, sin que nada nos detenga. Esta es la resurrección espiritual, [a] que absorbe el alma así como absorbe la carne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquí el manuscrito presenta una laguna o texto no restaurado.
    reason: El testimonio suministrado marca explícitamente un espacio perdido mediante corchetes vacíos; la nota hace visible esa incertidumbre textual sin inventar una reconstrucción.
lexical_decisions:
- source_word: we wear this world
  choice: llevamos puesto este mundo
  rationale: Conserva la metáfora concreta y extraña del testimonio, en vez de reducirla a «pertenecemos» o «vivimos conforme a» este mundo.
- source_word: radiant beams
  choice: rayos resplandecientes
  rationale: Mantiene la imagen luminosa que continúa en la comparación con el sol.
- source_word: our setting
  choice: nuestro ocaso
  rationale: Preserva el juego entre los rayos solares y su puesta, explicitado inmediatamente como la muerte en esta vida.
- source_word: drawn to heaven
  choice: atraídos al cielo
  rationale: Expresa el movimiento causado por él sin introducir una idea adicional de ascensión voluntaria.
- source_word: swallowing up
  choice: que absorbe
  rationale: «Absorber» comunica incorporación o consumación de manera natural; evita que «tragar» produzca una imagen grotesca no exigida por el contexto.
theological_decisions:
- issue: Participación conjunta con Cristo en sufrimiento, resurrección y ascensión
  choice: «Sufrimos con él, resucitamos con él y ascendimos al cielo con él»
  alternative: «Hemos sufrido/resucitado/ascendido con él»
  rationale: Sigue el aspecto verbal del testimonio disponible sin decidir si las acciones deben entenderse exclusivamente como hechos consumados, experiencias presentes o realidades sacramentales.
- issue: Alcance de la resurrección espiritual respecto del alma y la carne
  choice: «que absorbe el alma así como absorbe la carne»
  alternative: «que consume tanto el alma como la carne»
  rationale: Conserva el paralelismo y la tensión antropológica del texto, sin explicar de qué manera la resurrección espiritual incluye a cada una.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantienen las metáforas deliberadamente inusuales de vestirse del mundo, ser rayos y llegar al ocaso. Borrador provisional basado en el testimonio inglés de dominio público; queda pendiente la revisión directa del copto.
