review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés suministrado, incluida la laguna marcada. Sin embargo, «que absorbe» convierte en relativa una continuación que en el testimonio queda en participio («swallowing up»); conviene conservar la construcción en aposición para reflejar mejor la sintaxis y la ambigüedad de la laguna.
  naturalness: El español es claro, moderno y de registro apropiado. «Llevamos puesto este mundo» preserva bien la metáfora extraña. «Como los rayos por el sol» resulta algo elíptico, pero es comprensible y reproduce la imagen. La revisión propuesta mejora principalmente la correspondencia formal al final.
  terminology: «Resurrección espiritual», «cielo», «alma», «carne», «rayos resplandecientes» y «ocaso» son elecciones adecuadas y no imponen una lectura doctrinal. Se conserva «apóstol» sin identificarlo.
  issues:
  - severity: medium
    issue: 'La cláusula posterior a la laguna se presenta como relativa: «[a] que absorbe...»'
    rationale: El testimonio dice «This is the spiritual resurrection, [] swallowing up the soul...», con un participio tras una laguna. «Que absorbe» presupone una reconstrucción sintáctica específica de la porción perdida. «[a] absorbiendo...» conserva mejor la sintaxis participial disponible y no rellena la laguna.
  revised_text: 'Entonces, como en efecto dijo el apóstol: «Sufrimos con él, resucitamos con él y ascendimos al cielo con él». Ahora bien, si vivimos de manera visible en este mundo, llevamos puesto este mundo. Somos sus rayos resplandecientes y permanecemos con él hasta nuestro ocaso, es decir, hasta nuestra muerte en esta vida. Por medio de él somos atraídos al cielo, como los rayos por el sol, sin que nada nos detenga. Esta es la resurrección espiritual, [a] absorbiendo el alma así como la carne.'
  revised_footnotes:
  - marker: a
    text: Aquí el manuscrito presenta una laguna o texto no restaurado.
    reason: El testimonio suministrado marca explícitamente un espacio perdido mediante corchetes vacíos; la nota hace visible esa incertidumbre textual sin inventar una reconstrucción.
  revision_rationale: Se mantiene todo el contenido y las metáforas del testimonio inglés provisional. Solo se cambia «que absorbe» por «absorbiendo» para no convertir la secuencia posterior a la laguna en una oración relativa ni presuponer una restauración sintáctica que el texto suministrado no respalda. La revisión directa del copto sigue pendiente.
