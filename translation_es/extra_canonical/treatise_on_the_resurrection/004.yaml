review_pass:
  verdict: revise
  source_fidelity: La traducción sigue fielmente el testimonio inglés disponible y conserva sus metáforas principales. Sin embargo, «[a]» no preserva de forma inequívoca los corchetes vacíos «[]» del testimonio, que señalan una laguna no restaurada; la laguna debe mantenerse en el texto, además de anotarse.
  naturalness: El español es claro, moderno y de registro adecuado. «Llevamos puesto este mundo» conserva deliberadamente la imagen extraña. Conviene hacer explícita la voz pasiva de la comparación final para que «como los rayos por el sol» no resulte elíptico.
  terminology: «Resurrección espiritual», «resucitamos», «ascendimos al cielo», «rayos resplandecientes» y «ocaso» son elecciones apropiadas y no imponen una interpretación doctrinal.
  issues:
  - severity: medium
    issue: La laguna textual no se conserva literalmente.
    rationale: El original suministrado y el POB inglés muestran «[]». El marcador de nota «[a]» puede informar sobre la laguna, pero no debe reemplazar el signo textual que indica el vacío no restaurado.
  - severity: low
    issue: Comparación pasiva algo elíptica.
    rationale: «Como los rayos por el sol» refleja literalmente la construcción inglesa, pero «como los rayos son atraídos por el sol» es más natural y conserva la misma relación causal.
  revised_text: 'Entonces, como en efecto dijo el apóstol: «Sufrimos con él, resucitamos con él y ascendimos al cielo con él». Ahora bien, si vivimos de manera visible en este mundo, llevamos puesto este mundo. Somos sus rayos resplandecientes y permanecemos con él hasta nuestro ocaso, es decir, hasta nuestra muerte en esta vida. Por medio de él somos atraídos al cielo, como los rayos son atraídos por el sol, sin que nada nos detenga. Esta es la resurrección espiritual, [][a] que absorbe el alma así como absorbe la carne.'
  revised_footnotes:
  - marker: a
    text: Aquí el manuscrito presenta una laguna o texto no restaurado.
    reason: Los corchetes vacíos conservan en el texto la señal de la laguna del testimonio suministrado; la nota explica su significado sin proponer una reconstrucción.
  revision_rationale: Se conserva explícitamente la laguna mediante «[]» y se mantiene una nota anclada para explicarla. También se hace más fluida la comparación de los rayos sin modificar su sentido. La revisión sigue siendo provisional, pues la revisión directa del copto está pendiente.
