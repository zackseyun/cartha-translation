    Entonces, ¿qué es la resurrección? Es la revelación continua de quienes han resucitado.[c] Porque, si recuerdas haber leído en el evangelio que Elías apareció, con Moisés junto a él, no pienses que la resurrección es una ilusión. ¡No es una ilusión, sino una realidad! En efecto, sería más exacto decir que el mundo es una ilusión que decir que la resurrección —que ha tenido lugar por medio de nuestro Señor, el Salvador, Jesucristo— es una ilusión.'
