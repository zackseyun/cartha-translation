    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: es
  text: 'Sin embargo, hay algunos que, en el curso de su investigación, desean saber si quien es salvo, al despojarse del cuerpo, será salvo de inmediato. Que nadie dude de esto. […].[a] En efecto, los miembros visibles que están muertos [] no serán salvados, pues, de ser así, resucitarían los miembros [vivos] que existen en ellos.[b]


    Entonces, ¿qué es la resurrección? Es la revelación continua de quienes han resucitado.[c] Porque, si recuerdas haber leído en el evangelio que Elías apareció, y Moisés con él, no pienses que la resurrección es una ilusión. ¡No es una ilusión, sino una realidad! En efecto, sería más exacto decir que el mundo es una ilusión que decir que la resurrección —realizada por medio de nuestro Señor, el Salvador Jesucristo— es una ilusión.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los puntos suspensivos entre corchetes señalan una laguna o texto no conservado en el testimonio.
    reason: Evitar que la discontinuidad se interprete como una omisión editorial ordinaria.
  - marker: b
    text: Los corchetes vacíos y la palabra «[vivos]» reproducen señales de daño o restauración textual del testimonio utilizado.
    reason: Distinguir lo conservado de lo suplido y advertir que el pasaje es textualmente incierto.
  - marker: c
    text: También podría expresarse «la manifestación continua de quienes han resucitado»; la formulación del testimonio es difícil.
    reason: Preservar la ambigüedad semántica de «revelation» mientras se ofrece una alternativa natural.
lexical_decisions:
- source_word: discarding the body
  choice: al despojarse del cuerpo
  rationale: Conserva la imagen de quitarse o dejar el cuerpo sin explicarla como muerte ni imponer una antropología específica.
- source_word: saved
  choice: salvo / salvados
  rationale: Mantiene el vocabulario soteriológico del testimonio y su repetición deliberada.
- source_word: continuing revelation
  choice: revelación continua
  rationale: Reproduce de manera directa la formulación difícil y evita reducirla a mera aparición o recuerdo.
- source_word: illusion
  choice: ilusión
  rationale: Preserva el contraste explícito entre apariencia engañosa y realidad.
- source_word: has come to pass through
  choice: realizada por medio de
  rationale: Expresa la mediación atribuida a Jesucristo sin precisar indebidamente si se refiere a su propia resurrección o a la resurrección en general.
theological_decisions:
- issue: Momento de la salvación al dejar el cuerpo
  choice: Conservar la pregunta y la afirmación «Que nadie dude de esto» sin añadir una respuesta explícita perdida en la laguna.
  alternative: Interpretar la frase como afirmación directa de salvación inmediata.
  rationale: La laguna impide saber qué contenido seguía; completar la respuesta resolvería una ambigüedad textual real.
- issue: Relación entre los miembros visibles muertos y los miembros vivos
  choice: Mantener la distinción paradójica del testimonio, incluida la restauración «[vivos]».
  alternative: Parafrasearla como oposición entre cuerpo físico y cuerpo espiritual.
  rationale: La paráfrasis introduciría categorías teológicas que el fragmento no formula expresamente.
- issue: Naturaleza de la resurrección
  choice: «revelación continua de quienes han resucitado»
  alternative: «manifestación permanente de los resucitados».
  rationale: La elección conserva tanto el carácter revelatorio como el aspecto continuo, sin aclarar artificialmente una formulación conceptualmente tensa.
- issue: Resurrección realizada por medio de Jesucristo
  choice: Mantener una construcción que puede abarcar la resurrección de Cristo y la realidad de la resurrección mediada por él.
  alternative: Especificar «la resurrección de Jesús» o «nuestra resurrección».
  rationale: El testimonio inglés no permite decidir con seguridad entre esas precisiones.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones, paradojas, corchetes y lagunas. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice de Nag Hammadi I,4.
