  revision_rationale: 'Se corrige la ubicación de los corchetes para que reproduzca el testimonio inglés: «living [limbs]» = «los [miembros] vivos». Se realizan dos ajustes menores de fluidez y puntuación, y se emplea «ha tenido lugar por medio de» para mantener el carácter acontecido de la resurrección y la ambigüedad de la mediación atribuida a Jesucristo. La revisión sigue siendo provisional, pues el control directo del copto está pendiente.'
