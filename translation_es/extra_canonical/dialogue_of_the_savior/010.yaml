translation:
  language: es
  text: 'Él [llevó] a Judas, Mateo y María […] [para mostrarles el confín más remoto] del cielo y de la tierra.[a] Y cuando puso su [mano] sobre ellos, esperaron poder [verlo].


    Judas miró hacia arriba y contempló un lugar de gran altura; también contempló abajo el lugar del abismo.


    Judas le dijo a Mateo: «Hermano, ¿quién puede subir a semejante altura o bajar al abismo, puesto que allí hay un gran fuego infernal y un gran terror?»


    En ese mismo instante salió una palabra de lo alto. Mientras Judas estaba allí, vio cómo descendía la palabra.


    Le preguntó a la palabra: «¿Por qué has descendido?»


    El Hijo del Hombre los saludó y les dijo: «Una semilla procedente de una potencia era deficiente y descendió al abismo de la tierra. La Majestad la recordó y le envió la [palabra]. La palabra llevó la semilla ante la [presencia] de la Majestad, para que […] la primera palabra no se perdiera».


    [Sus] discípulos se maravillaron de todo lo que les decía y lo recibieron todo con fe, aun sabiendo que es inútil ocuparse de la injusticia.


    Luego dijo a sus discípulos: «¿No les dije que lo bueno será elevado a la luz como una voz visible y un relámpago?»


    Todos sus discípulos lo alabaron y dijeron: «Señor, antes de que aparecieras aquí, ¿quién te alababa, puesto que todas las alabanzas son para ti? ¿O quién te bendecía, puesto que todas las bendiciones <son para> ti?»


    Mientras estaban allí, él vio a dos espíritus que llevaban consigo una sola alma. Y hubo un gran relámpago. Del Hijo del Hombre salió una palabra que decía: «¡Denles sus vestiduras!»


    Y el pequeño llegó a ser igual al grande.[b] Eran [como] los que fueron recibidos arriba. […] [No había diferencia] entre ellos. Las [palabras] que él [pronunció convencieron a] los discípulos.


    María [le dijo: «Mira, yo] veo el mal [que influye en] las personas desde el principio, cuando viven unas con otras».


    El Señor [le] dijo: «Cuando los ves, [sabes] mucho. Ellos [no permanecerán allí juntos]. Pero cuando veas al que Existe Eternamente, esa será la gran visión».[c]


    Todos le dijeron: «Explícanoslo».


    Él les dijo: «¿De qué manera quieren verlo: [en] una visión pasajera o en una visión que permanece para siempre?»


    Y continuó diciendo: «Esfuércense cuanto puedan por salvar lo que permanecerá después de [ustedes]; búsquenlo y hablen desde su interior, para que todo cuanto busquen esté en armonía con ustedes mismos. Porque verdaderamente les [digo]: el Dios viviente [está] dentro de ustedes, […] [así como ustedes están] dentro de Dios».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito está dañado en diversos puntos de este pasaje. Los corchetes señalan letras o palabras restauradas; los puntos suspensivos entre corchetes señalan una laguna no reconstruida, y los signos angulares indican una corrección editorial.
    reason: Explicar de manera compacta todas las señales textuales conservadas en la traducción.
  - marker: b
    text: 'También podría entenderse: «lo pequeño llegó a ser igual a lo grande». El género y los referentes no son seguros en el testimonio disponible.'
    reason: Preservar la incertidumbre referencial de la frase.
  - marker: c
    text: La expresión traducida «el que Existe Eternamente» funciona como una designación, pero el texto no explica aquí con mayor precisión a quién se refiere.
    reason: Evitar una identificación teológica no explícita.
  - marker: d
    text: La redacción de la frase final es parcialmente reconstruida debido a una laguna del manuscrito.
    reason: Advertir que la reciprocidad final depende en parte de una restauración textual.
lexical_decisions:
- source_word: word
  choice: palabra
  rationale: Se conserva la referencia repetida e intencionalmente ambigua a una «palabra», sin identificarla de manera automática con un título cristológico.
- source_word: power
  choice: potencia
  rationale: «Potencia» mantiene la posible condición de entidad o poder trascendente mejor que una paráfrasis como «ser poderoso».
- source_word: Majesty
  choice: la Majestad
  rationale: Se conserva como designación reverencial sustantivada, sin reemplazarla por «Dios» y borrar la terminología propia del escrito.
- source_word: iniquity
  choice: injusticia
  rationale: Ofrece una expresión natural y digna, aunque el contexto fragmentario no permite precisar si se trata de maldad, injusticia o iniquidad.
- source_word: garments
  choice: vestiduras
  rationale: Mantiene el posible valor simbólico de la imagen y el registro solemne del pasaje.
- source_word: Eternally Existent One
  choice: el que Existe Eternamente
  rationale: Reproduce la designación ontológica sin imponer una identificación doctrinal más específica.
- source_word: inside
  choice: dentro de
  rationale: Conserva la reciprocidad espacial o mística del enunciado final sin explicarla teológicamente.
theological_decisions:
- issue: Identidad de «la palabra»
  choice: Mantener «una palabra/la palabra» en minúscula
  alternative: «el Verbo» como título personal
  rationale: El testimonio suministrado alterna una palabra que desciende y una palabra que sale del Hijo del Hombre; capitalizarla o titularla resolvería una ambigüedad genuina.
- issue: «Una semilla procedente de una potencia era deficiente»
  choice: Conservar la formulación y su tensión cosmológica
  alternative: Explicarla como un alma caída o una chispa divina
  rationale: El texto no identifica explícitamente la semilla, y una interpretación añadida importaría un sistema doctrinal.
- issue: Relación entre Dios y los discípulos al final
  choice: 'Traducir de forma recíproca: Dios dentro de ustedes y ustedes dentro de Dios'
  alternative: Parafrasear como presencia espiritual o unión mística
  rationale: La traducción directa preserva la fuerza y la posible tensión teológica de la afirmación sin definir su mecanismo.
- issue: «Lo bueno» elevado a la luz
  choice: Mantener el neutro «lo bueno»
  alternative: «los buenos»
  rationale: El testimonio permite entender una realidad buena o aquello que es bueno; convertirlo en personas cerraría innecesariamente el sentido.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» y se conserva el tono visionario del escrito. La traducción es provisional porque el encargo indica que la revisión directa del copto sigue pendiente; por ello se han preservado las restauraciones, lagunas y ambigüedades del testimonio inglés público suministrado.
