review_pass:
  verdict: revise
  source_fidelity: La traducción conserva con cuidado la terminología conceptual y las incertidumbres del testimonio inglés provisional. Sin embargo, debe representarse visiblemente la laguna marcada con «[]» en el parlamento de María; la nota por sí sola no preserva el indicador textual. También conviene conservar mediante paréntesis, no corchetes editoriales, el «(by)» parentético de la pregunta sobre la verdad.
  naturalness: El español es en general natural, sobrio y adecuado para el registro dialogal. Se ajusta la construcción «será llamada» a «se le llamará», que expresa con mayor claridad que el calificativo recae sobre la persona.
  terminology: «Plenitud», «carencia», «aquello que anima», «el que revela», «descansar» y «armoniza» son opciones prudentes y coherentes. Se mantienen los corchetes para restituciones, los signos angulares para el suplemento editorial y los paréntesis para el elemento parentético del testimonio.
  issues:
  - severity: medium
    issue: La laguna «[]» tras «temor y asombro» no aparece en el texto traducido.
    rationale: El testimonio inglés conserva expresamente una laguna independiente antes de «even [like a consuming fire]». La nota c la describe, pero el texto debe mostrar el indicador en su ubicación para preservar la señal textual.
  - severity: low
    issue: «[por la verdad]» usa corchetes para un elemento que el testimonio marca con paréntesis.
    rationale: Los corchetes se reservan aquí para restituciones editoriales. El original auditado usa «(by)», que debe conservarse como indicación parentética, sin presentarlo como restauración.
  - severity: low
    issue: «Será llamada muerta/vivo» deja poco claro el referente de la denominación.
    rationale: «Se le llamará muerta/viva» mantiene el sentido del testimonio y hace explícito en español que la designación se aplica a la persona.
