translation:
  language: es
  text: 'Los discípulos le preguntaron:


    —¿Qué es la plenitud y qué es la carencia?


    Él les respondió:


    —Ustedes vinieron de la plenitud y habitan en el lugar de la carencia.


    Y miren, su luz se ha derramado sobre mí.


    Mateo preguntó:


    —Señor, dime cómo mueren los que están muertos y cómo viven los que están vivos.


    [a] El Señor dijo:


    —[Ustedes me han] preguntado acerca de un dicho [verdadero] que ningún ojo ha visto, y ustedes son los únicos de quienes lo he oído. Pero yo les digo que, cuando aquello que anima a una persona le es quitado, será llamada muerta; y cuando lo que está vivo <entra en> lo que está muerto, será llamado vivo.


    Judas preguntó:


    —Hablando con verdad, ¿por qué algunos <mueren> y otros viven?


    El Señor dijo:


    —Todo lo que procede de la verdad no morirá. Todo lo que procede de mujer morirá.


    María preguntó:


    —Dime, Señor, ¿por qué he venido a este lugar: para ganar o para perder?


    El Señor respondió:


    —Tú revelas la riqueza del que revela.


    María le preguntó:


    —Señor, entonces, ¿hay algún lugar abandonado [por la verdad] o falto de ella?[b]


    El Señor dijo:


    —El lugar donde yo no habito.


    María dijo:


    —Señor, tú inspiras temor y asombro, [aun como fuego consumidor] para quienes no [te] conocen.[c]


    Mateo preguntó:


    —¿Por qué no descansamos de una vez?


    El Señor dijo:


    —Cuando dejen atrás lo que no pueden llevar consigo, entonces descansarán.


    Mateo preguntó:


    —¿Cómo armoniza lo pequeño con lo grande?


    El Señor dijo:


    —Dejando atrás estas cargas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay una laguna en el manuscrito antes de estas palabras.
    reason: Representa el corchete vacío del testimonio, que señala texto perdido o ilegible.
  - marker: b
    text: 'La frase también puede entenderse: «¿hay algún lugar que la verdad haya abandonado?».'
    reason: Preserva la alternativa indicada por «forsaken (by) or that lacks the truth» sin recargar el diálogo.
  - marker: c
    text: El manuscrito presenta una laguna antes de «aun como fuego consumidor»; las palabras entre corchetes son una restitución editorial, y «te» también está restituido.
    reason: Conserva los indicios textuales del testimonio y explica la omisión de los números de página manuscrita.
lexical_decisions:
- source_word: fullness
  choice: plenitud
  rationale: Conserva el término conceptual del testimonio y su contraste directo con «carencia», sin añadir una interpretación doctrinal.
- source_word: deficiency
  choice: carencia
  rationale: «Carencia» expresa falta o privación en español natural y mantiene abierto si se trata de un lugar, estado o realidad metafísica.
- source_word: what animates a person
  choice: aquello que anima a una persona
  rationale: Evita identificar de manera no exigida el referente con «alma», «espíritu» o «aliento», y así preserva la ambigüedad.
- source_word: revealer
  choice: el que revela
  rationale: La perífrasis resulta más natural que «revelador» como título y conserva la relación verbal con «revelas».
- source_word: rest
  choice: descansar
  rationale: Mantiene el sentido amplio, posiblemente físico, espiritual o escatológico, sin resolverlo.
- source_word: harmonize
  choice: armoniza
  rationale: Reproduce la relación enigmática entre lo pequeño y lo grande sin sustituirla por «igualarse» o «unirse».
theological_decisions:
- issue: Origen en la plenitud y morada en la carencia
  choice: Conservar la formulación espacial y metafísica sin explicación añadida
  alternative: Interpretarla explícitamente como descenso del alma desde un mundo divino
  rationale: El pasaje no define la ontología de «plenitud» y «carencia»; una explicación más específica importaría un sistema doctrinal.
- issue: Lo que anima a la persona
  choice: Usar una expresión descriptiva y neutral
  alternative: Traducir «alma» o «espíritu»
  rationale: El testimonio inglés no determina cuál de esos conceptos corresponde, y la revisión directa del copto está pendiente.
- issue: «Todo lo que procede de mujer morirá»
  choice: Traducir literalmente la tensión del dicho
  alternative: Parafrasear como «todo ser humano nacido mortalmente»
  rationale: La formulación deliberadamente fuerte debe conservarse sin suavizarse ni convertirse en una afirmación doctrinal más precisa.
- issue: Lugar abandonado o falto de la verdad
  choice: Presentar ambas posibilidades dentro de una formulación legible, con nota
  alternative: Elegir exclusivamente «abandonado por la verdad» o «falto de verdad»
  rationale: El testimonio señala una alternativa sintáctica real; no conviene resolverla en silencio.
- issue: Condición para el descanso
  choice: Mantener «dejar atrás» como condición expresada por el Señor
  alternative: Especificar renuncia material, muerte corporal o desapego ascético
  rationale: El objeto «lo que no pueden llevar consigo» permanece general y admite más de una lectura.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y diálogo con raya. Los corchetes conservan restituciones editoriales; los signos angulares conservan suplementos editoriales del testimonio. Se omiten los números de página 19 y 20. Borrador necesariamente provisional porque la revisión directa del copto del Códice de Nag Hammadi III,5 está pendiente.
