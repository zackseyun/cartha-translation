translation:
  language: es
  text: 'Judas respondió:


    —Dime, Señor, ¿cómo sacude la tierra el temblor de un [terremoto]?


    El Señor tomó una piedra y la sostuvo en la mano. [Él le dijo: «¿Qué] tengo en la mano?»


    Él respondió:


    —[Es] una piedra.


    Él les dijo:


    —Lo que sostiene la [tierra] es lo mismo que sostiene el cielo. Cuando una palabra salga de la Majestad, se encontrará con aquello que sostiene el cielo y la tierra. La tierra no se moverá. Si se moviera, caería; pero no se mueve, para que la primera palabra no falle. La palabra estableció el mundo, habitó en él y percibió su fragancia. A todos ustedes, Hijos del Hombre,[a] les proclamo todo lo que es inconmovible, porque ustedes proceden de aquel lugar. Ustedes viven en los corazones de quienes hablan con alegría y verdad. Si la palabra sale del cuerpo del Padre entre los seres humanos y estos no la reciben, regresará a su lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Hijos del Hombre»: el texto presenta la expresión en plural. Su sentido exacto aquí es incierto; podría funcionar como una designación especial de los destinatarios.'
    reason: Aclara una forma inusual sin identificarla dogmáticamente ni corregirla al título singular.
lexical_decisions:
- source_word: '[earthquake] shaking'
  choice: el temblor de un [terremoto]
  rationale: Conserva la restauración editorial entre corchetes y reproduce la aparente repetición del testimonio sin forzar una reconstrucción más precisa.
- source_word: Majesty
  choice: Majestad
  rationale: Mantiene el título reverencial y su posible valor técnico en el discurso cosmológico.
- source_word: word
  choice: palabra
  rationale: Se conserva el sustantivo común y su ambigüedad entre una expresión pronunciada y una realidad personificada; la minúscula evita imponer una identificación teológica.
- source_word: set up the world
  choice: estableció el mundo
  rationale: Expresa fundación u ordenación sin precisar indebidamente si se trata de creación absoluta o de sostenimiento.
- source_word: smelled the fragrance thereof
  choice: percibió su fragancia
  rationale: Ofrece una formulación natural en español sin eliminar la imagen sensorial del texto.
- source_word: Sons of Man
  choice: Hijos del Hombre
  rationale: Mantiene el plural y la forma marcada del testimonio, sin normalizarla al título singular conocido por otros textos.
- source_word: immovable
  choice: inconmovible
  rationale: Conserva el vínculo conceptual con la tierra que no se mueve y permite también un sentido espiritual o cosmológico.
- source_word: Father’s body
  choice: cuerpo del Padre
  rationale: Traducción directa que preserva una expresión teológicamente difícil sin sustituirla por una paráfrasis doctrinal.
theological_decisions:
- issue: Posible personificación de «la palabra»
  choice: Mantener «la palabra» en minúscula
  alternative: «la Palabra» con mayúscula
  rationale: El pasaje atribuye acciones personales a la palabra, pero el testimonio disponible no obliga a identificarla de manera inequívoca con un título cristológico.
- issue: Identidad de «Hijos del Hombre»
  choice: Conservar el plural como título marcado
  alternative: «seres humanos» o «hijos de la humanidad»
  rationale: La normalización borraría una formulación llamativa que puede tener función técnica dentro de la obra.
- issue: Sentido de «proceden de aquel lugar»
  choice: Preservar la referencia espacial indeterminada
  alternative: Explicitar «del cielo» o «del lugar inconmovible»
  rationale: El antecedente no es suficientemente seguro y explicitarlo resolvería una ambigüedad genuina.
- issue: Salida de la palabra del «cuerpo del Padre»
  choice: Traducir literalmente la imagen corporal
  alternative: «presencia», «ser» o «seno del Padre»
  rationale: Las alternativas interpretan o suavizan una expresión cuya tensión teológica debe conservarse.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se eliminaron los números de página del manuscrito que interrumpían la oración. Los corchetes conservan restauraciones o lagunas señaladas por el testimonio inglés; la redacción es provisional porque está pendiente la revisión directa del copto.
