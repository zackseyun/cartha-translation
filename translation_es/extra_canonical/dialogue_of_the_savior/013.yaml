translation:
  language: es
  text: 'María dijo: «Quiero comprenderlo todo, [precisamente tal como] es».


    El Señor dijo: «Quien busca la vida tendrá esto por riqueza, porque el [descanso] que el mundo da es falso, y su oro y su plata son engañosos».


    Sus discípulos le preguntaron: «¿Qué debemos hacer para que nuestra obra quede terminada?».


    El Señor [les dijo]: «Estén preparados en cualquier circunstancia. Dichoso quien ha conocido [] [la lucha y ha contemplado] la batalla con sus propios ojos. No ha matado ni [él] ha sido muerto, sino que ha salido victorioso».


    Judas preguntó: «Señor, dime: ¿cuál es el comienzo del camino?».


    Él dijo: «El amor y la bondad. Si tan solo una de estas cosas hubiera existido entre los gobernantes[a], el mal jamás habría llegado a existir».


    Mateo dijo: «Señor, has hablado sin dificultad acerca del fin de todas las cosas».


    El Señor dijo: «Han comprendido todo lo que les dije y lo han acogido con fe. Si lo conocen, les pertenece; si no, no les pertenece».


    Le preguntaron: «¿A qué lugar vamos?».


    El Señor dijo: «Ocupen el lugar que puedan alcanzar».


    María preguntó: «¿Es visible todo lo que está dispuesto de esta manera?».


    El Señor dijo: «Ya les he dicho que quien puede ver es también quien revela».


    Sus discípulos, los doce, le preguntaron: «Maestro, [con] [] tranquilidad […] enséñanos […]».


    El Señor dijo: «[Si han comprendido] todo lo que [les he dicho], [llegarán a ser inmortales, porque] ustedes […] todo».


    María dijo: «Solo una cosa [diré] al Señor acerca del secreto de la verdad: en esto permanecemos firmes y, en esto, somos transparentes ante lo que pertenece al mundo».


    Judas dijo a Mateo: «Queremos comprender con qué clase de vestiduras seremos revestidos cuando dejemos atrás la condición perecedera de la [carne]».


    El Señor dijo: «Los gobernantes y los administradores poseen vestiduras que solo se les dan por un tiempo y que no perduran. Pero ustedes, como hijos de la verdad, no deben vestirse con esas vestiduras que solo perduran por un tiempo. Más bien, les digo que serán dichosos cuando se quiten sus vestiduras, porque [] [dejar a un lado lo] exterior no es gran cosa».


    […] dijo: «¿Soy yo quien habla y soy yo quien recibe […]?».


    El Señor dijo: «Sí, [quien recibe] a su Padre de [una manera racional][b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Gobernantes» traduce el término tradicionalmente transcrito como «arcontes». Puede referirse a autoridades o a poderes cósmicos; el contexto no permite precisar aquí su identidad.
    reason: Preservar una ambigüedad histórica y teológica relevante sin cargar el texto principal con un tecnicismo.
  - marker: b
    text: La expresión «de una manera racional» es incierta y aparece dentro de una restauración editorial; la revisión directa del copto está pendiente.
    reason: Advertir que la frase final depende de un texto dañado y de una base inglesa provisional.
lexical_decisions:
- source_word: archons
  choice: gobernantes
  rationale: Traduce el sentido básico del término y evita convertirlo sin explicación en un tecnicismo doctrinal. La nota conserva la posible dimensión cosmológica.
- source_word: rest
  choice: descanso
  rationale: Conserva la restauración editorial del testimonio y el contraste paradójico entre la vida buscada y lo que ofrece el mundo.
- source_word: deathless
  choice: inmortales
  rationale: Expresa de manera natural en español la ausencia de muerte sin precisar indebidamente si se trata de una condición presente, futura, corporal o espiritual.
- source_word: destructibility
  choice: condición perecedera
  rationale: Resulta idiomático en español y mantiene la idea de corrupción o caducidad asociada a la carne.
- source_word: garments
  choice: vestiduras
  rationale: Mantiene la imagen simbólica repetida y un registro digno, sin explicar de antemano su referente.
- source_word: logical way
  choice: manera racional
  rationale: Traducción provisional y deliberadamente literal de una expresión incierta en el testimonio inglés.
theological_decisions:
- issue: Identidad de los «archons»
  choice: «gobernantes» con nota
  alternative: «arcontes» o «potestades cósmicas»
  rationale: No se resuelve si son autoridades terrenales, poderes cósmicos o ambas cosas; la formulación principal queda accesible y la nota señala la ambigüedad.
- issue: Sentido de las vestiduras
  choice: Conservar la metáfora sin interpretación
  alternative: Identificarlas explícitamente con el cuerpo, la mortalidad o poderes espirituales
  rationale: El pasaje vincula las vestiduras con la carne perecedera y lo exterior, pero no define de manera inequívoca todas las correspondencias.
- issue: «Quien puede ver… revela»
  choice: Mantener la identidad entre quien ve y quien revela
  alternative: Parafrasear como una relación causal o como dos personas distintas
  rationale: La formulación del testimonio es tensa y ambigua; se evita resolverla mediante una explicación añadida.
- issue: Recepción del Padre
  choice: Conservar la restauración y la expresión «de una manera racional»
  alternative: Interpretar como recepción espiritual, intelectual o conforme al Logos
  rationale: La cláusula está dañada y la revisión directa del copto está pendiente; no se impone una lectura teológica específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantuvieron los corchetes, los corchetes vacíos y las elipsis para representar restauraciones editoriales, lagunas sin resolver y texto perdido. El borrador es provisional porque se basa en el testimonio inglés público suministrado y aún requiere cotejo directo con el copto del Códice III,5 de Nag Hammadi.
