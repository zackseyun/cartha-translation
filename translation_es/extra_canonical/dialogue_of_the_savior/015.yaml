base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: es
  text: '«En cuanto a ustedes, esfuércense con diligencia por liberarse de la [ira] y de los celos. Despójense de sus [obras] y no […]. […] […] reproche […], porque les digo [que…] recibirán […] mucho […] quien buscó y [descubrió la vida verdadera]. Esa persona [alcanzará el descanso y] vivirá para siempre. Les digo: [cuídense], para que no extravíen sus espíritus ni sus almas».


    [El Diálogo] del Salvador'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: strive diligently
  choice: esfuércense con diligencia
  rationale: Conserva tanto la exhortación al esfuerzo como su intensidad, con una formulación natural y digna.
- source_word: free yourselves
  choice: liberarse
  rationale: Expresa la acción reflexiva de quedar libres sin añadir una explicación causal ausente del testimonio.
- source_word: strip from yourselves your [works]
  choice: despójense de sus [obras]
  rationale: Mantiene la imagen de quitarse algo y conserva «obras» como término deliberadamente amplio; no se sustituye por «pecados» ni por otra interpretación doctrinal.
- source_word: the one who searched
  choice: quien buscó
  rationale: Preserva el referente indefinido y la forma verbal del testimonio sin determinar género innecesariamente.
- source_word: true life
  choice: la vida verdadera
  rationale: Traducción directa que conserva el contraste implícito sin explicar en qué consiste esa vida.
- source_word: achieve rest
  choice: alcanzará el descanso
  rationale: «Descanso» mantiene la posible carga escatológica o espiritual sin resolverla mediante una paráfrasis.
- source_word: lead … into error
  choice: extravíen
  rationale: En español actual comunica conducir al error o desviar; la construcción transitiva permite conservar como objetos «sus espíritus» y «sus almas».
- source_word: Savior
  choice: Salvador
  rationale: Equivalente tradicional, claro y no sectario del título.
theological_decisions:
- issue: Sentido de «obras»
  choice: Conservar «[obras]» sin explicación dentro del texto
  alternative: Interpretarlo como pecados, acciones materiales o cargas
  rationale: El fragmento no define el referente y el daño manuscrito impide precisar su alcance; explicarlo resolvería indebidamente una ambigüedad teológica.
- issue: Naturaleza del «descanso»
  choice: Traducir literalmente «[alcanzará el descanso y]»
  alternative: Parafrasear como salvación, reposo celestial o liberación
  rationale: El término puede tener resonancias espirituales o escatológicas, pero el pasaje no permite escoger una sola interpretación.
- issue: Relación entre espíritus y almas
  choice: Mantener ambos términos coordinados y en plural
  alternative: Fusionarlos como una sola realidad interior
  rationale: La distinción o paralelismo del testimonio debe permanecer visible sin imponer una antropología doctrinal.
- issue: Promesa de vivir para siempre
  choice: «vivirá para siempre»
  alternative: «tendrá vida eterna»
  rationale: La formulación verbal refleja más directamente el testimonio y evita convertirla innecesariamente en una expresión doctrinal fija.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para la segunda persona plural. Los corchetes y puntos suspensivos reproducen restauraciones editoriales y lagunas del manuscrito; no se añadieron marcadores de nota porque este fragmento conclusivo no remite de manera específica a las notas numeradas del testimonio. Borrador necesariamente provisional: la fuente suministrada indica que aún está pendiente la revisión directa del copto del Códice de Nag Hammadi III,5.'
