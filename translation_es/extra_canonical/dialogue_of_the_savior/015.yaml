review_pass:
  verdict: revise
  source_fidelity: La traducción refleja bien el sentido general del testimonio inglés provisional y conserva apropiadamente los corchetes en las restauraciones principales. Sin embargo, debe conservarse la distinción material entre el corchete vacío «[]» y la laguna «[…]» que aparece antes de «reproach». También conviene no convertir «having [discovered ...]» en una coordinación verbal que debilita su relación con «the one who searched», ni introducir «que» dentro de una restauración donde el testimonio solo restaura «you». La revisión directa del copto sigue pendiente.
  naturalness: El español es natural, actual y de registro digno. «No conduzcan sus espíritus ni sus almas al error» expresa de modo más transparente la construcción del testimonio que «no extravíen sus espíritus ni sus almas», sin interpretar el pasaje.
  terminology: «ira», «celos», «obras», «vida verdadera», «descanso», «espíritus», «almas» y «Salvador» son elecciones adecuadas y mantienen las ambigüedades teológicas del fragmento. Se conserva «descanso» sin hacerlo equivaler a una formulación doctrinal más específica.
  issues:
  - severity: medium
    issue: Se ha reemplazado el marcador «[]» por «[…]» antes de «reproach».
    rationale: El testimonio distingue un corchete vacío de una laguna indicada por puntos. Aunque no se conozca el motivo editorial exacto, esa diferencia debe preservarse en una traducción de manuscrito fragmentario.
  - severity: low
    issue: «y [descubrió la vida verdadera]» altera «having [discovered the true life]».
    rationale: La coordinación con «y» presenta el descubrimiento como una acción sucesiva independiente. «habiendo [descubierto ...]» conserva mejor la relación participial del testimonio.
  - severity: low
    issue: «les digo [que…]» añade «que» a una restauración distinta de la del testimonio.
    rationale: El texto inglés tiene «I say to [you, . . .]», no «I say [that ...]». Puede mantenerse la sintaxis fragmentaria con «les digo [a ustedes, …]».
  revised_text: '«En cuanto a ustedes, esfuércense con diligencia por liberarse de la [ira] y de los celos. Despójense de sus [obras] y no […]. [] […] reproche […], porque les digo [a ustedes, …] recibirán […] mucho […] quien buscó, habiendo [descubierto la vida verdadera]. Esa persona [alcanzará el descanso y] vivirá para siempre. Les digo: [cuídense], para que no conduzcan sus espíritus ni sus almas al error».


    [El Diálogo] del Salvador'
  revised_footnotes: []
  revision_rationale: 'Se ajustan los marcadores de daño/restauración para reproducir la segmentación del testimonio, se conserva la dependencia participial de «habiendo descubierto» y se evita añadir contenido dentro de corchetes. No se incorporan las notas 1–25: ninguna está anclada de forma específica en este breve fragmento conclusivo.'
