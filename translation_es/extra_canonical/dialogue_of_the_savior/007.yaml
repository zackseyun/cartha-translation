translation:
  language: es
  text: 'María preguntó a sus hermanos: «¿Dónde guardarán [estas] preguntas que hacen al Hijo del [Hombre]?»


    El Señor le [dijo]: «Hermana, [nadie] puede preguntar acerca de estas cosas [excepto] quien posee un lugar en el corazón [] donde guardarlas. Una persona así puede salir del [mundo], entrar en el lugar [de la vida] y no quedar retenida en este mundo de pobreza».


    Mateo dijo: «Señor, quiero [contemplar] ese lugar de vida, [donde] no hay injusticia, sino solamente [luz] pura».


    El Señor respondió: «Hermano Mateo, no puedes verlo [mientras] estés revestido de carne».


    Mateo dijo: «Señor, [si] no puedo verlo, al menos permíteme conocerlo».


    El Señor dijo: «Todo el que se ha conocido a sí mismo lo ha visto. Hace todo lo que se le da para hacer. Así, alguien como él ha llegado a [ser como] aquel lugar en bondad».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: store
  choice: guardar
  rationale: Conserva la imagen de recibir y mantener las preguntas en un lugar interior, con un verbo natural en español.
- source_word: place in the heart
  choice: lugar en el corazón
  rationale: Mantiene literalmente la metáfora espacial del testimonio sin convertirla en una explicación psicológica.
- source_word: place of life
  choice: lugar de vida
  rationale: Preserva la expresión recurrente y su posible carácter técnico sin ampliarla como «vida eterna».
- source_word: world of poverty
  choice: mundo de pobreza
  rationale: Retiene la formulación marcada y su amplitud semántica, sin reducirla a pobreza económica ni reinterpretarla doctrinalmente.
- source_word: wear the flesh
  choice: estar revestido de carne
  rationale: Reproduce la metáfora corporal con lenguaje digno y comprensible; evita el más plano «tener un cuerpo».
- source_word: known himself
  choice: se ha conocido a sí mismo
  rationale: Conserva la formulación reflexiva y su posible peso sapiencial, sin especificar en qué consiste ese conocimiento.
- source_word: iniquity
  choice: injusticia
  rationale: Expresa el contraste moral de forma natural en español y sin imponer una categoría doctrinal más estrecha.
theological_decisions:
- issue: Relación entre autoconocimiento y visión del lugar de vida
  choice: «Todo el que se ha conocido a sí mismo lo ha visto»
  alternative: «Quien se conoce a sí mismo conoce ese lugar»
  rationale: Se conserva la afirmación fuerte y la distinción verbal del testimonio entre conocer y ver, sin explicar ni atenuar su tensión teológica.
- issue: Posibilidad de contemplar el lugar mientras se lleva la carne
  choice: «no puedes verlo [mientras] estés revestido de carne»
  alternative: «no puedes verlo mientras vivas en el cuerpo»
  rationale: La elección mantiene la metáfora de vestirse de carne y no decide si el dicho se refiere a la vida corporal, a una condición espiritual o a ambas.
- issue: Semejanza entre la persona y el lugar en bondad
  choice: «ha llegado a [ser como] aquel lugar en bondad»
  alternative: «por su bondad ha llegado a ser como aquel lugar»
  rationale: Se preservan tanto la restauración editorial como la relación sintáctica poco definida de «en bondad», evitando precisar si la bondad pertenece primordialmente a la persona, al lugar o a la semejanza.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes del testimonio para señalar restauraciones editoriales o daño manuscrito, incluido el corchete vacío después de «corazón». El borrador es necesariamente provisional porque la revisión directa del copto del Códice III,5 de Nag Hammadi está pendiente; se basa en el testimonio inglés de dominio público suministrado y consulta el POB inglés solo como capa auditada.
