review_pass:
  verdict: revise
  source_fidelity: 'La revisión directa del copto sigue pendiente; frente al testimonio inglés suministrado, el borrador es mayormente fiel y conserva de manera adecuada los corchetes, incluido el corchete vacío. Hay dos ajustes seguros: «salir del mundo» debilita «depart from [the world]», que aquí se expresa mejor como «partir de [el mundo]»; y «aquel lugar» añade una distancia deíctica no presente en «that place», ya referido como «ese lugar».'
  naturalness: El español es claro, moderno y de registro digno. «Partir de [el mundo]» resulta natural en este registro y conserva mejor el sentido de salida definitiva que «salir del [mundo]». Se mantiene «lugar de vida» sin artículo dentro de la designación recurrente, conforme al testimonio.
  terminology: «Hijo del [Hombre]», «lugar [de vida]», «mundo de pobreza», «revestido de carne» y «se ha conocido a sí mismo» preservan términos e imágenes relevantes sin imponer una lectura doctrinal. «Injusticia» es una equivalencia admisible de «iniquity» en este testimonio puente.
  issues:
  - severity: medium
    issue: «puede salir del [mundo]» para «can depart from [the world]»
    rationale: «Salir» puede denotar simplemente abandonar un espacio; «partir de» conserva mejor el matiz de partida o separación que articula el paso al lugar de vida.
  - severity: low
    issue: «aquel lugar» para «that place»
    rationale: «Aquel» introduce una distancia mayor que no está indicada; «ese lugar» retoma de forma más directa el lugar mencionado por Mateo.
  revised_text: 'María preguntó a sus hermanos: «¿Dónde guardarán [estas] preguntas que hacen al Hijo del [Hombre]?»


