    Mateo dijo: «Señor, quiero [contemplar] ese lugar de vida, [donde] no hay injusticia, sino solamente [luz] pura».


    El Señor respondió: «Hermano Mateo, no puedes verlo [mientras] estés revestido de carne».


    Mateo dijo: «Señor, [si] no puedo verlo, al menos permíteme conocerlo».


    El Señor dijo: «Todo el que se ha conocido a sí mismo lo ha visto. Hace todo lo que se le da para hacer. Así, alguien como él ha llegado a [ser como] ese lugar en bondad».'
  revised_footnotes: []
  revision_rationale: Se hacen únicamente correcciones seguras contra el testimonio inglés auditado. Se preservan todas las lagunas y restauraciones entre corchetes, la ambigüedad de «en bondad» y el carácter provisional de una traducción mediada por el testimonio inglés hasta que haya revisión del copto.
