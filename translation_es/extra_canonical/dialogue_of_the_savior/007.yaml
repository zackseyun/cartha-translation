review_pass:
  verdict: revise
  source_fidelity: La traducción conserva fielmente la secuencia dialogal, las imágenes de «lugar en el corazón», «lugar de vida», «mundo de pobreza» y «revestido de carne», así como todas las restauraciones y el corchete vacío del testimonio. Se ajusta la formulación de las preguntas dirigidas al Hijo para expresar inequívocamente el complemento indirecto presente en el testimonio inglés, y se conserva el futuro de «will not be detained». La revisión directa del copto sigue pendiente, por lo que la fidelidad se evalúa provisionalmente frente al testimonio inglés suministrado.
  naturalness: El registro es digno, claro y neutral para América Latina. «Que le hacen al Hijo» resulta más idiomático y preciso que «que hacen al Hijo»; «no será retenida» reproduce con mayor nitidez la afirmación futura sin perder naturalidad. Se evita el masculino referencial innecesario en la conclusión mediante «Una persona así».
  terminology: Se mantienen coherentemente «El Señor», «Hijo del [Hombre]», «lugar [de la vida]», «injusticia», «luz», «carne» y «bondad». «Injusticia» es una opción moderna admisible para el inglés provisional «iniquity», sin imponer una lectura doctrinal. Los corchetes se preservan exactamente como indicadores de daño o restauración editorial.
  issues:
  - severity: low
    issue: Complemento de «preguntas» en la pregunta inicial
    rationale: «Preguntas que hacen al Hijo» puede entenderse, pero «preguntas que le hacen al Hijo» expresa de manera inequívoca que el Hijo es la persona a quien se pregunta, conforme al testimonio inglés.
  - severity: low
    issue: Tiempo verbal en «no quedar retenida»
    rationale: El infinitivo coordinado es posible tras «puede», pero el testimonio afirma específicamente que esa persona «will not be detained». «No será retenida» conserva con mayor claridad ese futuro.
  - severity: low
    issue: Referencia personal en la frase final
    rationale: «Alguien como él» introduce un referente masculino que el original inglés no especifica. «Una persona así» mantiene el sentido sin añadir género.
  revised_text: 'María preguntó a sus hermanos: «¿Dónde guardarán [estas] preguntas que le hacen al Hijo del [Hombre]?»


    El Señor le [dijo]: «Hermana, [nadie] puede preguntar acerca de estas cosas [excepto] quien posee un lugar en el corazón [] donde guardarlas. Una persona así puede salir del [mundo], entrar en el lugar [de la vida] y no será retenida en este mundo de pobreza».


    Mateo dijo: «Señor, quiero [contemplar] ese lugar de vida, [donde] no hay injusticia, sino solamente [luz] pura».


    El Señor respondió: «Hermano Mateo, no puedes verlo [mientras] estés revestido de carne».


    Mateo dijo: «Señor, [si] no puedo verlo, al menos permíteme conocerlo».


    El Señor dijo: «Todo el que se ha conocido a sí mismo lo ha visto. Hace todo lo que se le da para hacer. Así, una persona así ha llegado a [ser como] aquel lugar en bondad».'
  revised_footnotes: []
  revision_rationale: Se realizan únicamente ajustes seguros de sintaxis, referencia y tiempo verbal. No se alteran las ambigüedades del testimonio, las expresiones de posible valor técnico ni las restauraciones editoriales entre corchetes. No se añaden notas porque el pasaje no contiene anclas de nota y los corchetes ya cumplen la función de señalar el estado textual del testimonio proporcionado.
