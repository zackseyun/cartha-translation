translation:
  language: es
  text: 'Judas [dijo]: «De verdad quiero [aprenderlo todo]».


    El [Señor] le dijo: «El [Dios viviente no] habita [en ninguna parte de] todo [el lugar] de esta deficiencia».


    Judas [preguntó]: «¿Quién [gobernará sobre nosotros]?».


    El Señor respondió: «[Mira, aquí habita] todo lo que existe [entre] lo que permanecerá. Ustedes [gobernarán] sobre ellos».


    Judas dijo: «Mira, los arcontes[a] están sobre nosotros para gobernarnos».


    El Señor respondió: «Son ustedes quienes gobernarán sobre ellos. Cuando eliminen de ustedes los celos, se revestirán de luz y entrarán en la cámara nupcial».


    Judas preguntó: «¿Cómo se nos proporcionarán [nuestras] vestiduras?».


    El Señor respondió: «Unos se las proporcionarán y otros [las] recibirán, []; y son ellos [quienes les darán] sus vestiduras. Porque ¿quién puede llegar a aquel lugar, siendo tan [temible]? Sin embargo, las vestiduras de vida serán dadas a los seres humanos porque conocen el camino por el que irán. De hecho, hasta para mí es difícil llegar allí».


    María dijo: «De este modo, <basta> la dificultad de cada día. Los trabajadores son dignos de su alimento. Los discípulos serán iguales a sus maestros».


    Dijo esto como una mujer que lo comprendía todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Arcontes» significa literalmente «gobernantes»; en textos de este ámbito puede referirse a potestades que dominan el mundo.
    reason: Aclara un término técnico poco común sin imponer una identificación doctrinal específica.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico tradicional, en vez de reducirlo a «gobernantes», porque en este escrito puede designar potestades cósmicas y la ambigüedad debe mantenerse.
- source_word: bridal chamber
  choice: cámara nupcial
  rationale: Expresión natural y digna que conserva la imagen ritual y simbólica sin interpretarla.
- source_word: garments of life
  choice: vestiduras de vida
  rationale: Mantiene la metáfora concreta y su posible sentido soteriológico sin explicitar una doctrina.
- source_word: deficiency
  choice: deficiencia
  rationale: Conserva el valor abstracto y posiblemente cosmológico del término del testimonio, sin sustituirlo por una interpretación como «mundo imperfecto».
- source_word: students
  choice: discípulos
  rationale: En un diálogo de enseñanza, «discípulos» expresa naturalmente la relación con los maestros; no obstante, la base inglesa también admite el más general «estudiantes».
theological_decisions:
- issue: La afirmación «hasta para mí es difícil llegar allí»
  choice: Se traduce literalmente y sin atenuación.
  alternative: Parafrasearla como una dificultad meramente retórica o referida solo a seres humanos.
  rationale: La frase presenta una tensión teológica genuina; el traductor no debe resolverla ni armonizarla.
- issue: Quién gobernará sobre los arcontes
  choice: Se mantiene el plural «ustedes» en las palabras del Señor.
  alternative: Interpretar el pronombre como una referencia exclusiva a Judas.
  rationale: La forma inglesa «you» es ambigua en número, pero el contexto inmediato habla de «ustedes mismos» y de una comunidad; la opción plural hace coherente la secuencia sin añadir una identidad doctrinal.
- issue: La cámara nupcial
  choice: Se conserva como imagen sin explicación doctrinal.
  alternative: Identificarla expresamente con un sacramento, una unión celestial o un estado posmortem.
  rationale: El pasaje no define aquí la imagen y debe preservarse su amplitud interpretativa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se preservan los corchetes del testimonio para indicar reconstrucciones o texto incierto, incluido el espacio vacío «[]»; los signos angulares en «<basta>» señalan una adición editorial. Este borrador es provisional porque se basa en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice III,5 de Nag Hammadi.
