    Judas dijo: «He aquí, los arcontes[a] nos dominan, para gobernarnos».


    El Señor respondió: «Son ustedes quienes gobernarán sobre ellos. Cuando eliminen de ustedes los celos, se revestirán de luz y entrarán en la cámara nupcial».


    Judas preguntó: «¿Cómo se nos proporcionarán [nuestras] vestiduras?».


    El Señor respondió: «Unos se las darán, y otros [las] recibirán, []; y ellos son [quienes les darán] sus vestiduras. Porque ¿quién puede alcanzar aquel lugar, siendo tan [temible]? Sin embargo, las vestiduras de vida serán dadas a los seres humanos porque conocen el camino que recorrerán. De hecho, hasta para mí es difícil llegar allí».


