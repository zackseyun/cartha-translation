translation:
  language: es
  text: 'Mateo dijo: «¿Cómo [...]?»[a]


    [] El Salvador dijo: «[Si no mantienen en orden] lo que hay dentro de ustedes, [su obra] sobrevivirá, pero ustedes [no]».


    Judas [dijo]: «Señor, [quisiera conocer todas] las obras de las almas [que pertenecen a] estos pequeños. Cuando [...], ¿dónde habitarán? [...] el espíritu [...]?».


    El Señor [dijo: «... reciban] a estos. No mueren ni son destruidos, porque han comprendido a [sus] compañeros y a quien los recibirá, porque la verdad busca a los sabios y a los justos».


    El Salvador [dijo]: «La lámpara [del] cuerpo es la mente.[b] Mientras [lo que hay dentro de] ustedes se mantenga en orden, es decir, [el alma], sus cuerpos serán [iluminados]. Mientras sus corazones estén oscurecidos, la luz que ustedes [] esperan [permanecerá lejos de ustedes]. Los he llamado [a mí], porque pronto me iré, para que [reciban] mi palabra entre [ustedes. Miren], se la envío».


    [a] Los corchetes reproducen las lagunas y las restituciones editoriales del testimonio utilizado; los puntos suspensivos entre corchetes indican texto perdido, y los corchetes vacíos señalan una laguna no reconstruida. La traducción debe revisarse directamente a partir del manuscrito copto.


    [b] «Mente» traduce provisionalmente el término representado así en el testimonio inglés; una revisión del copto deberá confirmar su alcance exacto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes reproducen las lagunas y las restituciones editoriales del testimonio utilizado; los puntos suspensivos entre corchetes indican texto perdido, y los corchetes vacíos señalan una laguna no reconstruida. La traducción debe revisarse directamente a partir del manuscrito copto.
    reason: Aclara el estado fragmentario del texto y que la base disponible es un testimonio inglés de dominio público, no una revisión concluida del copto.
  - marker: b
    text: «Mente» traduce provisionalmente el término representado así en el testimonio inglés; una revisión del copto deberá confirmar su alcance exacto.
    reason: Evita presentar como definitiva una decisión léxica potencialmente importante para la antropología del pasaje.
lexical_decisions:
- source_word: what is inside you
  choice: lo que hay dentro de ustedes
  rationale: Conserva la amplitud de la expresión y evita identificarla prematuramente con una facultad concreta, aunque después el texto añada la restitución «[el alma]».
- source_word: maintain in order
  choice: mantener en orden
  rationale: Reproduce el sentido de conservar algo debidamente dispuesto sin añadir una interpretación moral o ascética específica.
- source_word: deeds of the souls
  choice: obras de las almas
  rationale: Mantiene la formulación concreta del testimonio y su posible ambigüedad respecto de acciones, hechos o actividad.
- source_word: mind
  choice: mente
  rationale: Es el equivalente neutral y comprensible del testimonio inglés; se marca como provisional porque falta la revisión directa del copto.
- source_word: hearts are darkened
  choice: sus corazones estén oscurecidos
  rationale: Conserva la metáfora de luz y oscuridad y evita reemplazar «corazones» por una explicación psicológica.
- source_word: word
  choice: palabra
  rationale: Preserva la amplitud semántica y la posible carga teológica sin imponer «mensaje», «enseñanza» o «Logos».
theological_decisions:
- issue: Relación entre «lo que hay dentro de ustedes» y «el alma»
  choice: Conservar ambas expresiones y la condición editorial de «[el alma]»
  alternative: Identificar en toda la sección lo interior directamente con el alma
  rationale: La identificación aparece dentro de una restitución editorial; no debe proyectarse retrospectivamente sobre cada aparición de la expresión.
- issue: Supervivencia de la obra frente a la persona
  choice: «[su obra] sobrevivirá, pero ustedes [no]»
  alternative: Explicar la frase como condenación, pérdida espiritual o permanencia del legado
  rationale: El pasaje está dañado y la afirmación admite varias lecturas; se conserva su tensión sin resolverla doctrinalmente.
- issue: Condición de las almas de «estos pequeños»
  choice: Mantener que «no mueren ni son destruidos» sin explicación adicional
  alternative: Interpretarlo explícitamente como inmortalidad natural, resurrección o salvación
  rationale: El fragmento no permite precisar el marco antropológico o escatológico de la afirmación.
- issue: La verdad como agente que busca
  choice: «la verdad busca a los sabios y a los justos»
  alternative: Parafrasear que Dios busca a esas personas
  rationale: Se preserva la personificación presente en el testimonio sin identificar «la verdad» con un referente teológico no expresado.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para la segunda persona plural y comillas angulares para el diálogo. Se conservan estrictamente los corchetes, las lagunas y las restituciones del testimonio suministrado. El borrador es necesariamente provisional porque la revisión directa del copto del Códice de Nag Hammadi III,5 sigue pendiente.
