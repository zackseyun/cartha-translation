translation:
  language: es
  text: '«Quien [no] conoce la obra de la plenitud no conoce nada.


    »Quien no permanece en la oscuridad no puede ver la luz [...].[a]


    »Quien [no comprende] cómo llegó a existir el fuego arderá dentro de él, sin conocer su origen.


    »Si alguien no comprende primero el agua, no conoce nada, pues ¿de qué le sirve ser bautizado en ella?


    »Quien no comprende cómo llegó a existir el viento que sopla será arrastrado junto con él.


    »Quien no comprende cómo llegó a existir el cuerpo que lleva puesto será destruido junto con él.


    »¿Y cómo conocerá al [Padre] quien no conoce al Hijo?


    »Todo queda oculto para quien no conoce la raíz de todas las cosas.


    »Quien no conoce la raíz de la maldad no será ajeno a ella.


    »Quienes no comprenden cómo vinieron tampoco comprenderán cómo se irán.


    »Y no es ajeno a este mundo quien [se enaltezca] y, por consiguiente, sea humillado».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El manuscrito presenta una laguna antes de «luz»; no es posible determinar aquí el texto perdido. Las demás palabras entre corchetes son restauraciones del testimonio utilizado.
    reason: La traducción debe señalar tanto la laguna visible como el carácter reconstruido de otras palabras, sin presentar las restauraciones como seguras.
lexical_decisions:
- source_word: deed of completeness
  choice: obra de la plenitud
  rationale: Conserva el carácter abstracto y posiblemente técnico de la expresión del testimonio, sin reducirla a «perfección» ni explicar su sentido incierto.
- source_word: stands
  choice: permanece
  rationale: Expresa una condición o posición sostenida de manera natural en español, sin interpretar excesivamente la imagen.
- source_word: blowing wind
  choice: viento que sopla
  rationale: Mantiene explícita la acción del viento presente en el testimonio.
- source_word: body he wears
  choice: cuerpo que lleva puesto
  rationale: Preserva la metáfora del cuerpo como vestidura, aunque resulte deliberadamente llamativa.
- source_word: root of iniquity
  choice: raíz de la maldad
  rationale: «Maldad» es comprensible y amplio; evita restringir el término a una doctrina jurídica específica.
- source_word: be no stranger to
  choice: no ser ajeno a
  rationale: Reproduce la expresión paradójica del pasaje sin resolver si implica pertenencia, familiaridad o sujeción.
theological_decisions:
- issue: Relación entre conocimiento, bautismo y salvación o destino
  choice: Se conservan las afirmaciones en forma sapiencial y condicional, sin añadir una explicación sacramental o soteriológica.
  alternative: Explicitar que el conocimiento es requisito para que el bautismo sea eficaz o para alcanzar la salvación.
  rationale: El testimonio no define la naturaleza exacta del provecho del bautismo ni sistematiza las consecuencias teológicas.
- issue: «Hijo» y «Padre»
  choice: Se mantienen como títulos personales con mayúscula.
  alternative: Traducirlos en minúscula o identificar explícitamente a Jesús y a Dios.
  rationale: El contexto permite reconocer títulos teológicos, pero no autoriza insertar identificaciones explicativas en el cuerpo del texto.
- issue: Destino del cuerpo y del mundo
  choice: Se conserva el lenguaje de ser destruido con el cuerpo y de no ser ajeno al mundo.
  alternative: Interpretarlo explícitamente como condenación, mortalidad física o apego espiritual.
  rationale: La formulación admite más de una lectura y debe conservarse su tensión.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron las repeticiones de «conocer» y «comprender», las imágenes corporales y naturales, y las paradojas del pasaje. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice Nag Hammadi III,5. Se omitió el número de página manuscrita [15].
