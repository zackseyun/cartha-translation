translation:
  language: es
  text: '«Cuando ofrezcan alabanzas, háganlo de esta manera:[a]


    Escúchanos, Padre,

    así como escuchaste a tu Hijo único,

    y hasta lo recibiste junto a ti.

    [Tú] le concediste descanso de mucho [trabajo].

    nuestro poder [no puede ser vencido],

    [porque] tus fuerzas de combate [no pueden ser vencidas],

    [. . .] luz [. . .] viviente [. . .] inaccesible [. . . viviente].

    La palabra [verdadera] [ha dado] arrepentimiento para vida,

    [y esto ha procedido] de ti.

    Tú eres el pensamiento y la serenidad completa del solitario.

    Escúchanos una vez más,

    así como escuchaste a tus elegidos.

    Por medio de tu sacrificio, los elegidos entrarán.

    Por sus buenas obras han liberado sus almas de los miembros corporales ciegos,

    para que puedan existir [] para siempre.

    Amén».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
