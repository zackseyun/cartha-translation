    reason: Informa con transparencia la base textual limitada y explica las marcas críticas conservadas en el cuerpo del texto.
lexical_decisions:
- source_word: offer up praise
  choice: ofrezcan alabanzas
  rationale: Conserva la imagen de presentar u ofrecer alabanza, con una expresión natural y digna en español.
- source_word: only Son
  choice: Hijo único
  rationale: Mantiene el sentido filial y la singularidad del Hijo sin introducir terminología doctrinal más específica que la del testimonio disponible.
- source_word: battle forces
  choice: fuerzas de combate
  rationale: Reproduce la metáfora militar del testimonio sin especificar si se trata de ejércitos, poderes u otra clase de fuerzas.
- source_word: repentance for life
  choice: arrepentimiento para vida
  rationale: Preserva la relación deliberadamente compacta y algo ambigua entre arrepentimiento y vida, en vez de explicarla como causa, medio o resultado.
- source_word: solitary
  choice: solitario
  rationale: Conserva el sustantivo singular y su posible sentido técnico o espiritual sin interpretarlo como monje, asceta o persona aislada.
- source_word: blind bodily limbs
  choice: miembros corporales ciegos
  rationale: Mantiene la extraña imagen antropológica del testimonio, sin suavizarla ni convertirla en una afirmación doctrinal más convencional.
theological_decisions:
- issue: La relación entre las buenas obras y la liberación del alma
  choice: «Por sus buenas obras han liberado sus almas»
  alternative: «Mediante sus buenas obras, sus almas han sido liberadas»
  rationale: Se conserva la voz activa y la atribución de agencia presentes en el testimonio, aunque generen tensión teológica; no se reformula para ajustarla a una doctrina posterior.
- issue: La entrada de los elegidos por el sacrificio del Padre
  choice: «Por medio de tu sacrificio, los elegidos entrarán»
  alternative: «Gracias a tu ofrenda, los elegidos entrarán»
  rationale: Se mantiene «sacrificio» y no se identifica su referente ni su mecanismo, pues el pasaje disponible no los aclara.
- issue: Identidad del «solitario»
  choice: Se deja sin identificar
  alternative: Interpretarlo como Dios, el Hijo, el creyente individual o un asceta
  rationale: La sintaxis del testimonio permite incertidumbre conceptual; la traducción no impone una identificación confesional.
translation_notes:
  register: Español latinoamericano neutral, actual y reverente. Se conserva la forma poética y responsiva de la oración, junto con sus fragmentos, irregularidades sintácticas y pasajes dañados. No se regulariza la minúscula inicial de «nuestro poder», pues puede reflejar la continuidad de una frase perdida. El grupo «[]» se mantiene tal como aparece en el testimonio suministrado, señalando una laguna sin reconstrucción legible.
