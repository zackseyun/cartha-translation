translation:
  language: es
  text: 'Sus discípulos [dijeron: «Señor], ¿quién es el que busca y [quién] es el que revela?»


    [El Señor] les [dijo]: «El que busca es [el mismo] que revela».


    Mateo [volvió a decirle: «Señor], mientras [te escucho] y mientras hablo, ¿quién es el que [habla y] quién es el que escucha?»


    El [Señor] dijo: «El que habla es el mismo que [escucha], y el que puede ver es el mismo que revela».


    María dijo: «Señor, mira: [mientras] llevo puesto un cuerpo, ¿de dónde brotan mis lágrimas y de dónde viene mi risa?»


    El Señor dijo: «[Es el cuerpo el que] llora por sus obras [y por] las obras que aún quedan por hacer. Es la mente la que ríe [por [...] los frutos del] espíritu. Quien no [permanece] en la oscuridad será [in]capaz de ver [la luz].


    »Les digo: [todo lo que está fuera de] la luz es oscuridad, y [quien] no permanece en [la oscuridad será in]capaz de ver la luz. Sin embargo, [los hijos del] engaño fueron sacados [...]. Ustedes se revestirán de la luz y [así vivirán] para siempre [...]. [Si ...], entonces [todo] poder de arriba y de abajo los tratará con crueldad. Allí [habrá] llanto y [rechinar] de dientes por el fin de [todas] las cosas».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traducción provisional basada en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto del Códice III,5 de Nag Hammadi. Los corchetes indican restauraciones de texto dañado o perdido, y los puntos suspensivos entre corchetes señalan lagunas. Algunas reconstrucciones, en especial las referentes a la oscuridad y la luz, son inciertas.
    reason: Informa con transparencia la base textual indirecta y explica las señales de daño manuscrito sin ocultar la incertidumbre.
lexical_decisions:
- source_word: seeks
  choice: busca
  rationale: Conserva el sentido básico y la relación verbal deliberada con «revela» sin añadir un objeto no presente.
- source_word: reveals
  choice: revela
  rationale: Mantiene la ambigüedad respecto de qué o a quién se revela; no se añadió «la verdad» ni otra explicación.
- source_word: wearing a body
  choice: llevo puesto un cuerpo
  rationale: Reproduce la metáfora de vestirse con un cuerpo, importante en el pasaje, en vez de normalizarla como «vivo en un cuerpo».
- source_word: mind
  choice: mente
  rationale: Es la equivalencia más directa según el testimonio disponible y evita identificarla interpretativamente con «alma» o «intelecto».
- source_word: spirit
  choice: espíritu
  rationale: Preserva el término teológicamente abierto sin determinar si alude al espíritu humano o al Espíritu divino.
- source_word: put on the light
  choice: se revestirán de la luz
  rationale: Conserva la imagen de ponerse la luz como vestidura y la relaciona naturalmente con la metáfora corporal anterior.
- source_word: powers
  choice: poder
  rationale: «Todo poder» mantiene el alcance distributivo de la lectura suministrada sin convertir estas entidades en autoridades políticas ni definir su naturaleza.
theological_decisions:
- issue: Identidad del que busca, habla, escucha, ve y revela
  choice: Se conservaron las afirmaciones de identidad tal como aparecen, sin explicar si se refieren a una sola persona, a una facultad interior o a una realidad espiritual.
  alternative: Interpretarlas mediante expresiones como «tu ser interior» o «el espíritu que está en ti».
  rationale: El pasaje formula deliberadamente estas relaciones de modo enigmático; resolverlas impondría una lectura doctrinal ausente del testimonio.
- issue: Relación entre cuerpo, mente y espíritu
  choice: 'Se mantuvieron como términos distintos: «cuerpo», «mente» y «espíritu».'
  alternative: Armonizarlos como una antropología tripartita definida o sustituir «mente» por «alma».
  rationale: La traducción debe preservar la tensión conceptual sin construir un sistema antropológico más preciso que el texto.
- issue: Necesidad de permanecer en la oscuridad para ver la luz
  choice: Se preservó la formulación paradójica «quien no permanece en la oscuridad será incapaz de ver la luz».
  alternative: Corregirla conjeturalmente a «quien permanece en la oscuridad será incapaz de ver la luz».
  rationale: Aunque podría sospecharse corrupción textual o restauración incierta, el testimonio suministrado repite la paradoja; no corresponde enmendarla silenciosamente sin revisión copta.
- issue: «Hijos del engaño»
  choice: Se tradujo literalmente y se dejó sin identificar.
  alternative: Interpretarlo como demonios, falsos maestros o personas engañadas.
  rationale: El contexto fragmentario no permite precisar con seguridad su referente.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usó «ustedes» para el plural y comillas angulares en el diálogo. Se conservaron los corchetes y las lagunas del testimonio, con ajustes mínimos de sintaxis para que el español sea legible. «Mira» comunica con naturalidad el valor discursivo de «behold» sin adoptar un registro arcaizante. La traducción sigue siendo provisional porque no se proporcionó el texto copto para cotejo directo.
