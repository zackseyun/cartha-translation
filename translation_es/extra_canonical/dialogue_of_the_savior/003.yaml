translation:
  language: es
  text: '«Les enseñaré cuándo llegará el tiempo de la destrucción.[a] El primer poder de la oscuridad los alcanzará; no tengan miedo[b] ni digan: “Miren, ha llegado el tiempo”.[c] Pero cuando vean una vara solitaria […].[d] Sepan que […] de la obra […] y los arcontes […] los alcanzarán […]. El miedo es el verdadero poder [de la oscuridad]. Por tanto, si temen lo que pronto los alcanzará, eso los dominará, y ninguno de ellos los soltará ni tendrá compasión de ustedes. Miren, más bien, lo que está dentro [de ustedes],[e] porque han dominado todo lo terrenal. Esto […] [los] llevará hacia arriba, a un [lugar] sin dominio [y sin] tirano. Cuando ustedes […] verán a aquellos […], y también [los oirán. Yo] les digo: la razón […]. La razón es [… donde] está la verdad. Ellos, sin embargo, […], y ustedes […] la verdad. Esto [está […] dentro de] la mente viviente. Por consiguiente, […] y la alegría de ustedes […], para que […] sus almas […], para que la palabra no […] lo que levantaron […] y no pudieron
    [comprenderlo] […]. Hagan que lo que está [dentro] de ustedes y lo que está [fuera] de ustedes sea una misma cosa.[f]


    El […] lugar de paso es ciertamente aterrador ante [sus] ojos; pero no duden en atravesarlo. ¡Grande es su profundidad, inmensa [es] su altura! [Tengan una sola mente […]], y el fuego […] gotas de rocío […] todos los poderes […] ustedes. Ellos […] y [todos] los poderes […] ellos […] antes. Les digo: […] el alma […] llegará a ser […] en todos ellos […] ustedes son […] y que […] no duerman […] los hijos […] y ustedes […] ustedes […].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El sentido de «destrucción» no puede precisarse por el contexto conservado; podría referirse a ruina, disolución o una crisis final.
    reason: Preservar la amplitud semántica y la tensión escatológica.
  - marker: b
    text: El pronombre plural «los» y la forma «ustedes» representan a los destinatarios colectivos del discurso.
    reason: Aclarar una distinción gramatical que el español neutral latinoamericano expresa de manera diferente.
  - marker: c
    text: «Miren» traduce una fórmula de llamada de atención equivalente a «he aquí».
    reason: Usar español actual sin perder la función enfática.
  - marker: d
    text: La expresión «vara solitaria» queda aislada por una laguna del manuscrito, por lo que su significado en la escena es incierto.
    reason: Señalar incertidumbre textual decisiva.
  - marker: e
    text: La referencia a «lo que está dentro» se dirige probablemente a los oyentes, pero el testimonio conserva aquí una señal de restauración.
    reason: Distinguir el texto restaurado de lo claramente conservado.
  - marker: f
    text: La exhortación acerca de lo interior y lo exterior admite sentidos éticos, espirituales o antropológicos; el fragmento no permite escoger uno con certeza.
    reason: Evitar imponer una lectura teológica particular.
lexical_decisions:
- source_word: destruction
  choice: destrucción
  rationale: Conserva el sentido amplio del testimonio sin precisar si se trata de ruina, disolución o fin cósmico.
- source_word: power of darkness
  choice: poder de la oscuridad
  rationale: Mantiene tanto la posible referencia a una fuerza como a una entidad personificada.
- source_word: solitary staff
  choice: vara solitaria
  rationale: Traducción formal y deliberadamente no interpretativa de una expresión cuyo contexto está perdido.
- source_word: archons
  choice: arcontes
  rationale: Se conserva el término técnico antiguo en transliteración, sin identificarlo de manera reductiva con gobernantes humanos o seres espirituales.
- source_word: logic
  choice: la razón
  rationale: En español corriente y digno, «la razón» comunica la facultad o principio racional; el pasaje fragmentario no permite una precisión mayor.
- source_word: living mind
  choice: mente viviente
  rationale: Reproduce la formulación inusual del testimonio y evita sustituirla por un concepto teológico más definido.
- source_word: crossing place
  choice: lugar de paso
  rationale: Conserva la imagen espacial sin decidir si designa un cruce, tránsito o umbral escatológico.
theological_decisions:
- issue: Naturaleza de los poderes y los arcontes
  choice: Mantener «poderes» y «arcontes» sin explicación doctrinal dentro del texto
  alternative: Identificarlos explícitamente como demonios, ángeles o gobernantes políticos
  rationale: El fragmento no resuelve su identidad, y una identificación explícita importaría una interpretación teológica.
- issue: El poder del miedo
  choice: «El miedo es el verdadero poder [de la oscuridad]»
  alternative: Parafrasear que la oscuridad solo tiene poder cuando la persona teme
  rationale: La traducción conserva la tensión del enunciado y la restauración entre corchetes sin convertirla en una explicación psicológica.
- issue: Interior y exterior
  choice: Conservar la exhortación a hacerlos «una misma cosa»
  alternative: Interpretarla como pureza moral, integración psicológica o unión mística
  rationale: El texto permite varias lecturas y no debe resolverse en favor de una tradición concreta.
- issue: Ascenso a un lugar sin dominio ni tirano
  choice: Mantener el lenguaje espacial y político
  alternative: Explicarlo como cielo, salvación o liberación del mundo material
  rationale: La condición fragmentaria impide identificar con seguridad el destino descrito.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para la segunda persona plural. Los corchetes conservan palabras restauradas o de lectura incierta; […] señala lagunas del manuscrito. Esta versión es necesariamente provisional: fue preparada a partir del testimonio inglés de dominio público suministrado, pues la revisión directa del copto del Códice de Nag Hammadi III,5 está pendiente.'
