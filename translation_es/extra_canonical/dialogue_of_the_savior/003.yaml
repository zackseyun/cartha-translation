review_pass:
  verdict: revise
  source_fidelity: La versión sigue de cerca el testimonio inglés suministrado y conserva de manera general las lagunas y restauraciones. Sin embargo, en «lo que está dentro (de ustedes)» se desplazó la señal de restauración, y en «Esto […] [los] llevará» se introdujo entre corchetes un objeto que el testimonio no marca como restaurado. «La razón» es posible, pero «la lógica» reproduce más directamente el término del testimonio puente, sin que haya aún revisión directa del copto.
  naturalness: El español es mayormente claro, actual y apropiado para un discurso solemne. Se corrige «Cuando ustedes […] verán» por «Cuando ustedes […] vean», que conserva la laguna y permite una construcción gramatical natural en español. Se mantienen las construcciones entrecortadas donde proceden de las lagunas del manuscrito.
  terminology: «Arcontes», «poder», «oscuridad», «mente viviente» y «lugar de paso» son opciones prudentes y no imponen una interpretación doctrinal. Se prefiere «lógica» para el inglés «logic» en este estadio provisional; una revisión copta futura podrá reevaluar el término.
  issues:
  - severity: medium
    issue: Desplazamiento de las marcas de restauración en «lo que está dentro [de ustedes]».
    rationale: 'El testimonio dice «[what is] inside (you)»: la restauración afecta «what is», mientras que «(you)» se presenta entre paréntesis. La traducción debe conservar esa distinción editorial en la medida en que el español lo permita.'
  - severity: medium
    issue: Marcación editorial inexacta en «Esto […] [los] llevará».
    rationale: 'El testimonio presenta «This [] [will] convey you»: solo «will» está entre corchetes, mientras que el destinatario no lo está. En español, «Esto [] los [llevará]» refleja mejor esa distribución.'
  - severity: low
    issue: «La razón» atenúa la correspondencia léxica con «logic».
    rationale: Aunque «razón» puede funcionar en contextos filosóficos, «lógica» es el equivalente más directo del testimonio inglés y evita ampliar el sentido hacia facultad racional en general.
  - severity: low
    issue: La nota e atribuye de forma demasiado amplia la restauración a la referencia completa a «lo que está dentro».
    rationale: En el testimonio, la restauración corresponde específicamente a «[what is]», y «(you)» es una aclaración parentética. La nota debe describir esa evidencia con precisión.
