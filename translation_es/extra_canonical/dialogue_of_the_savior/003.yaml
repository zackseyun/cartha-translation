    no pudieron [comprenderlo] […]. Hagan que lo que está [dentro] de ustedes y lo que está [fuera] de ustedes sea una misma cosa.[f]



    El [] lugar de paso es ciertamente aterrador ante [sus] ojos; pero no duden en atravesarlo. ¡Grande es su profundidad, inmensa [es] su altura! [Tengan una sola mente […]], y el fuego […] gotas de rocío […] todos los poderes […] ustedes. Ellos […] y [todos] los poderes […] ellos […] antes. Les digo: […] el alma […] llegará a ser […] en todos ellos […] ustedes son […] y que […] no duerman […] los hijos […] y ustedes […] ustedes […].»'
  revised_footnotes:
  - marker: e
    text: En el testimonio puente, la restauración corresponde a «[lo que está]», mientras que «(de ustedes)» aparece como aclaración parentética; la formulación exacta sigue siendo incierta por el estado del texto.
    reason: Reflejar con precisión las distintas señales editoriales del testimonio.
  revision_rationale: 'Se hacen correcciones limitadas y seguras: se restituyen las señales editoriales de restauración y aclaración parentética según el testimonio inglés, se mejora una construcción temporal española sin completar la laguna, y se usa «lógica» como equivalente directo provisional de «logic». Se conservan los corchetes vacíos, las lagunas y las formulaciones fragmentarias. La revisión directa del copto permanece pendiente.'
