translation:
  language: es
  text: 'María preguntó: «¿[De qué] clase es la semilla de mostaza? ¿Es del cielo o de la tierra?»


    El Señor dijo: «Después de que el Padre estableció el mundo para sí, dejó con la Madre del Todo mucho de lo que había sobrado. Por eso él siembra y obra».


    Judas dijo: «Nos has dicho esto desde la mente verdadera. Cuando oremos, ¿cómo debemos orar?»


    El Señor dijo: «Oren en el lugar donde no hay mujer».


    Mateo dice: «Él nos dice: “Oren en el lugar donde no hay mujer”. Esto significa destruir las obras de lo femenino.[a] No es porque haya otra clase de nacimiento, sino para que dejen [de dar a luz]».


    María dijo: «¿Nunca serán destruidas?»


    El Señor dijo: «[Ustedes] saben que perecerán [una vez más], […], y [las obras] de [lo femenino que están aquí] también serán [destruidas]».


    Judas dijo [a Mateo]: «Las obras de [lo femenino] ciertamente perecerán. Entonces los arcontes[b] [invocarán a sus eones],[c] y nosotros estaremos preparados para enfrentarlos».


    El Señor dijo: «¿Los verán [a ustedes, y verán] a quienes los reciben? Miren: del Padre sale una palabra verdadera hacia el abismo, en silencio, con un relámpago, y engendra. ¿La ven ellos, o la vencen? Con toda certeza, ustedes conocen mejor [el camino] que [ni ángel] ni autoridad [conoce]. Es el camino del Padre y del Hijo, porque los dos son uno, y ustedes avanzarán por el [camino] que han conocido. Aunque los arcontes se hagan enormes, no podrán alcanzarlo. Les digo la [verdad]: incluso para mí es difícil alcanzarlo».


    […] [María] preguntó [al Señor]: «Si las obras [son destruidas, ¿qué es en realidad lo que] destruye una obra?»


    [El Señor dijo]: «Ustedes saben que [cuando] yo [la] destruya, irá a su propio lugar».


    Judas dijo: «¿Cómo se hace visible el espíritu?»


    El Señor dijo: «¿Cómo [se hace visible] la espada?»


    Judas dijo: «¿Cómo se hace visible la luz?»


    El Señor dijo: «[Se hace visible] eternamente por sí misma».


    Judas preguntó: «¿Quién disuelve las obras [de quién]? ¿Las obras [disuelven] el mundo, o es el mundo el que disuelve las obras?»


    El Señor [respondió]: «Quien [comprende es quien disuelve las obras]. Esto es así porque quien ha conocido las obras tiene el deber de obrar la [voluntad] del Padre».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Lo femenino» traduce una expresión distinta de «mujer» en la línea anterior; en este pasaje parece funcionar como categoría abstracta, aunque su alcance exacto es incierto.
    reason: Aclara una distinción léxica relevante sin resolver la dificultad interpretativa.
  - marker: b
    text: Los «arcontes» son gobernantes o poderes; en varios escritos de Nag Hammadi, el término designa poderes cósmicos hostiles o limitadores.
    reason: Explica un tecnicismo poco familiar preservando su forma tradicional.
  - marker: c
    text: «Eones» puede referirse a edades, ámbitos o entidades del orden cósmico. La reconstrucción de esta frase es incierta debido al estado del manuscrito.
    reason: Señala tanto el campo semántico del término como la incertidumbre textual visible en la restauración.
lexical_decisions:
- source_word: Mother of the All
  choice: Madre del Todo
  rationale: Conserva el título cosmológico y su personificación sin explicarlo mediante un sistema doctrinal ajeno al pasaje.
- source_word: works / work
  choice: obras / obrar
  rationale: Mantiene en español la repetición y el juego verbal del testimonio, especialmente en la conclusión sobre obrar la voluntad del Padre.
- source_word: female
  choice: lo femenino
  rationale: Distingue esta expresión abstracta de «mujer» en la frase anterior y evita convertirla sin fundamento en una referencia exclusiva a mujeres concretas.
- source_word: archons
  choice: arcontes
  rationale: Usa la transliteración asentada para los poderes gobernantes de este entorno literario y la aclara en nota.
- source_word: aeons
  choice: eones
  rationale: Conserva el tecnicismo cosmológico y su ambigüedad referencial en vez de sustituirlo por «edades» o «mundos».
- source_word: dissolves
  choice: disuelve
  rationale: Preserva la imagen de desintegración y la pregunta deliberadamente difícil sobre la relación entre obras y mundo.
- source_word: generative
  choice: engendra
  rationale: Expresa de manera verbal y natural la capacidad generativa de la palabra sin decidir qué o a quién engendra.
- source_word: attain to it
  choice: alcanzarlo
  rationale: Mantiene la ambigüedad de si el referente inmediato es el camino u otra realidad descrita en el discurso.
theological_decisions:
- issue: La frase «donde no hay mujer» y su interpretación
  choice: Conservar literalmente «mujer» en el dicho y «lo femenino» en la explicación
  alternative: Armonizar ambas expresiones como «mujer» o reinterpretarlas espiritualmente
  rationale: El texto mismo distingue las formulaciones y presenta una tensión teológica y antropológica que no debe suavizarse ni resolverse denominacionalmente.
- issue: La unidad del Padre y del Hijo
  choice: «los dos son uno»
  alternative: «son una sola persona» o «tienen una misma voluntad»
  rationale: Reproduce la afirmación sin definir metafísicamente la clase de unidad.
- issue: «Incluso para mí es difícil alcanzarlo»
  choice: Mantener la declaración en boca del Señor
  alternative: Enmendarla o explicarla para armonizarla con una cristología posterior
  rationale: La lectura resulta teológicamente tensa, pero está presente en el testimonio suministrado y no debe corregirse por motivos doctrinales.
- issue: Destrucción de las obras y retorno a su lugar
  choice: Conservar el lenguaje sin identificar el mecanismo ni el destino
  alternative: Explicarlo como juicio, salvación, muerte física o restauración cósmica
  rationale: El pasaje no ofrece suficiente información para escoger una interpretación concreta.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usa «ustedes» para el plural y se preservan los corchetes como señales de lagunas o restauraciones; «[…]» representa una laguna sin texto recuperable. Se omitieron los números de página del manuscrito. Este borrador se basa en el testimonio inglés de dominio público proporcionado; queda pendiente la revisión directa del copto del Códice III,5 de Nag Hammadi.
