translation:
  language: es
  text: 'Judas preguntó:


    —Dinos, Señor, ¿qué [existía] antes de que [el cielo y] la tierra llegaran a existir?[a]


    El Señor dijo:


    —Había oscuridad y agua, y [] un espíritu estaba sobre el [agua]. Y les digo [la verdad]: Miren, lo que buscan y aquello por lo que preguntan [está] dentro de ustedes, y [posee] el poder y el misterio [del] espíritu, porque [se origina] en [el espíritu]. La maldad entró [para destruir] la mente [continuamente]. Miren, […].[b]


    [Mateo] dijo:


    —Señor, dinos, ¿dónde está establecida [el alma] y dónde habita la [mente] verdadera?


    El Señor [dijo]:


    —El fuego del espíritu llegó a existir [entre] aquellos dos; así [el espíritu] llegó a existir, y la mente verdadera dentro de ellos. [Si] alguien establece el alma en lo alto, entonces [será] exaltada.[c]


    Mateo le preguntó:


    —[] ¿[No es necesaria la circuncisión] cuando se la entiende [según la interpretación verdadera]?


    El Señor [dijo]:


    —[La circuncisión es] más provechosa que el trabajo de ustedes. [Aparten] de ustedes [lo que pueda] perseguirlos, es decir, todo lo que está [dentro] de sus corazones; porque, a medida que sus corazones [sean circuncidados], así [encontrarán] el modo de vencer a los poderes de arriba y de abajo. Y les digo: que quien [posee] poder renuncie [a él] y se arrepienta; y que quien [entiende] busque, encuentre y se alegre.[d]


    Judas dijo:


    —Mira, [yo] veo que todo es [exactamente] como una señal sobre [la tierra], y por eso llegó a existir de esta manera.


    El Señor [dijo]:


    —Cuando el Padre estableció el mundo, [reunió] parte de sus aguas, y la palabra salió de ellas. [] Padeció mucha [aflicción, pero] estaba por encima del curso [de las estrellas] que rodea toda la tierra.[e]


    [Continuó]:


    —El agua reunida [arriba] está más allá de las estrellas, y [más allá] del agua <hay> un gran fuego infernal que las rodea como una muralla. En cuanto varias de las entidades interiores se separaron de las demás, [comenzaron a calcularse] los períodos de tiempo.


    »Cuando la [totalidad] quedó establecida, él miró [hacia abajo]: el Padre, quien le dijo: “Ve, [haz brotar algo] de ti, para que [a la tierra] no le falte nada de generación en [generación, ni] de era en era”.[f]


    »Entonces [ella] hizo brotar de sí fuentes de leche, fuentes de miel, de aceite y de vino, además de buenos frutos, sabores deliciosos y raíces saludables, [para que] a la tierra no le faltara nada de generación [en] generación ni de era en era.[g]


    »Está por encima de […]; [] se mantuvo [en pie y mostró] su belleza […]. Y afuera [había una gran luz], más brillante [que] la que se le parece, porque aquella gobierna sobre [todos] los eones de arriba y de abajo. [La luz fue] extraída del fuego y esparcida por el [firmamento], arriba y abajo. Los que están sobre el cielo de arriba y sobre la tierra de abajo dependen de ellos. Todo depende de ellos.[h]


    Cuando Judas oyó esto, se postró, cayó de rodillas y alabó al Señor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La traducción de este pasaje es provisional: se basa en el testimonio inglés público suministrado; aún está pendiente la revisión directa del manuscrito copto del Códice III de Nag Hammadi.'
    reason: Documentar con transparencia la base indirecta de la traducción.
  - marker: b
    text: Los corchetes señalan palabras restauradas o inciertas; [] representa una laguna sin reconstrucción y […] una porción perdida o ilegible.
    reason: Explicar las señales textuales conservadas del testimonio.
  - marker: c
    text: La relación exacta entre «aquellos dos», «el espíritu» y «ellos» no es segura debido al estado fragmentario del texto.
    reason: Preservar la ambigüedad referencial sin llenar las lagunas.
  - marker: d
    text: La frase inicial está dañada. También podría entenderse con otros matices; no es seguro cómo se relacionan «la circuncisión» y «el trabajo de ustedes».
    reason: Advertir que una afirmación potencialmente doctrinal depende de una reconstrucción incierta.
  - marker: e
    text: No está claro si «la palabra» debe entenderse como una expresión pronunciada o como una realidad personal; tampoco es completamente seguro el referente de «padeció».
    reason: Evitar resolver una posible lectura cristológica o cosmológica.
  - marker: f
    text: En esta sección se han omitido los números de página del manuscrito que interrumpían las oraciones. Los referentes de «él» y «le» siguen siendo inciertos.
    reason: Distinguir la paginación del contenido y señalar la dificultad pronominal.
  - marker: g
    text: «Ella» representa el pronombre de la fuente inglesa, pero su referente podría ser el agua, la totalidad, la tierra u otra realidad mencionada en la parte perdida.
    reason: No atribuir con falsa certeza la acción creadora a un sujeto concreto.
  - marker: h
    text: El texto cambia entre singular y plural («aquella», «ellos»), y las lagunas impiden determinar con seguridad qué luces o entidades sostienen el cielo y la tierra.
    reason: Conservar la incoherencia aparente que puede deberse al daño manuscrito.
lexical_decisions:
- source_word: spirit
  choice: espíritu
  rationale: Se conserva en minúscula porque el testimonio suministrado no determina de manera segura si se trata del Espíritu divino como nombre propio o de «espíritu» en sentido cosmológico.
- source_word: secrecy
  choice: misterio
  rationale: En este contexto, «misterio» expresa con naturalidad una realidad espiritual oculta; «secreto» sería posible, pero resulta más estrecho y menos idiomático.
- source_word: true mind
  choice: mente verdadera
  rationale: Mantiene el término antropológico «mente» y evita interpretarlo como «entendimiento», «intelecto» o una entidad técnica no demostrable sin revisión copta.
- source_word: circumcision
  choice: circuncisión
  rationale: Se conserva el referente literal y la posterior aplicación al corazón, sin reducirlo de antemano a una metáfora ni convertirlo en una afirmación ritual inequívoca.
- source_word: powers
  choice: poderes
  rationale: Preserva la posible referencia a potestades cósmicas sin identificar doctrinalmente su naturaleza.
- source_word: word
  choice: palabra
  rationale: La minúscula conserva la ambigüedad del testimonio entre una palabra pronunciada y una figura cosmológica personal.
- source_word: aeons
  choice: eones
  rationale: Es la transliteración española usual para las realidades o edades cósmicas del texto; traducirlo solo como «edades» podría borrar su posible sentido técnico.
- source_word: inferno
  choice: fuego infernal
  rationale: Comunica una enorme masa de fuego sin identificarla automáticamente con el infierno escatológico.
theological_decisions:
- issue: Identidad del espíritu sobre el agua
  choice: «un espíritu», en minúscula
  alternative: «el Espíritu»
  rationale: El artículo y la identidad teológica no pueden establecerse con seguridad a partir del testimonio inglés provisional; la traducción no impone una identificación trinitaria.
- issue: Sentido de la circuncisión
  choice: Conservar tanto la pregunta sobre la circuncisión como la circuncisión de los corazones
  alternative: Parafrasear todo como purificación interior
  rationale: El pasaje mantiene una tensión entre el acto de circuncidar y su dimensión interior; no se resuelve en favor de una postura ritual o antirritual.
- issue: Naturaleza de los poderes de arriba y abajo
  choice: «poderes» sin explicación doctrinal en el cuerpo
  alternative: «potestades espirituales» o «seres demoníacos»
  rationale: El texto no define aquí su identidad ni su carácter moral.
- issue: Identidad de la palabra que sale del agua
  choice: «la palabra», sin mayúscula cristológica
  alternative: «la Palabra»
  rationale: Aunque una lectura personal o cristológica es posible, el testimonio disponible no permite fijarla sin revisión del copto.
- issue: Referentes de los pronombres en la cosmogonía
  choice: Mantener referentes parcialmente abiertos y señalar la incertidumbre
  alternative: Identificar de forma explícita al Padre, el agua, la totalidad o la tierra en cada oración
  rationale: El texto está dañado y sus cambios de género y número no permiten una resolución segura.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» para el plural y un diálogo natural sin volver coloquiales las exposiciones cosmológicas. Se conservan corchetes, lagunas, puntos suspensivos y la adición entre ángulos <hay>. La sintaxis se aclara solo donde el testimonio lo permite; las rupturas, ambigüedades y cambios pronominales significativos permanecen visibles.
