review_pass:
  verdict: revise
  source_fidelity: 'La traducción conserva en general las lagunas, las restauraciones entre corchetes, la personificación de la ira y el carácter provisional del testimonio. Sin embargo, «gobernantes» reduce indebidamente «archons», y «ofrecieron alabanza» elimina el cambio explícito a la segunda persona del testimonio («and you offered up praise»). La relación sintáctica dañada en torno a «the way of crossing over for the elect and solitary» debe reflejarse sin convertir con seguridad a los elegidos y solitarios en destinatarios de una instrucción mediante «cómo cruzar al otro lado: para».'
  naturalness: El español es mayormente natural, sobrio y apto para un texto antiguo. «Camino de cruzar al otro lado» y la conservación de la sintaxis fragmentaria permiten mayor fidelidad sin imponer una interpretación. «Arcontes» es un préstamo establecido en español académico y religioso; una nota breve lo hace accesible.
  terminology: «El Salvador», «reposo», «temporalidad», «ira», «Padre» y «verdad» son adecuados. Se recomienda «arcontes» para conservar el término técnico transmitido por el testimonio, con una nota que indique que puede aludir a gobernantes o poderes y que el referente preciso permanece incierto. «Solitarios» conserva adecuadamente la posible designación técnica.
  issues:
  - severity: medium
    issue: «Gobernantes» sustituye «archons».
    rationale: Aunque capta una posible acepción, borra del texto principal un término potencialmente técnico y teológicamente significativo. «Arcontes» conserva el término sin decidir su alcance.
  - severity: high
    issue: «ofrecieron alabanza» cambia la segunda persona explícita del testimonio a tercera persona plural.
    rationale: El inglés dice «and you offered up praise». La oscilación entre «aquellos» y «ustedes» debe conservarse, no armonizarse.
  - severity: medium
    issue: '«enseñé a la gente cómo cruzar al otro lado: para los elegidos y solitarios» fija una relación sintáctica que el testimonio presenta de manera quebrada.'
    rationale: El original habla de instruir acerca del camino de cruzar al otro lado y luego presenta «for the elect and solitary» seguido de una laguna. Conviene mantener la construcción abierta.
  revised_text: 'El Salvador dijo a sus discípulos: «Hermanos, ha llegado ya el momento de que dejemos nuestra labor y permanezcamos en reposo, porque quien permanece en reposo descansará para siempre. Les digo: trasciendan siempre [. . .] la temporalidad [. . .]. [Les digo]: [. . .] no teman [a quienes . . .] ustedes. Yo [les digo]: la ira es temible, [y quien] provoca la ira es una [persona temible]. Pero, puesto que ustedes [han podido sufrir], quizá salga de [ustedes . . .].


    »La gente ha recibido con temor y temblor estas palabras acerca de la ira. La ira nombró arcontes[a] sobre ellos, porque nadie puede evitar la ira. Sin embargo, cuando vine, abrí un camino e instruí a la gente acerca del camino de cruzar al otro lado para los elegidos y solitarios,[b] [] aquellos que han conocido al Padre y que han sido fieles a la verdad, y ustedes ofrecieron alabanza».'
  revised_footnotes:
  - marker: a
    text: «Arcontes» traduce un término tradicionalmente transcrito de ese modo. Puede referirse a gobernantes o poderes; el referente preciso es incierto.
    reason: Conserva en el texto el término técnico del testimonio sin imponer una cosmología específica.
  - marker: b
    text: «Solitarios» puede funcionar como una designación especial, pero su sentido exacto en este pasaje no es seguro.
    reason: Preserva la ambigüedad de una expresión posiblemente técnica.
  revision_rationale: Se conserva el formato de lagunas y restauraciones del testimonio inglés provisional. La revisión restituye «arcontes», mantiene abierta la sintaxis dañada relativa al camino de cruzar al otro lado y preserva el cambio no armonizado a la segunda persona en «ustedes ofrecieron alabanza».
