review_pass:
  verdict: revise
  source_fidelity: La versión conserva adecuadamente la estructura fragmentaria, los corchetes, las lagunas y la personificación de la ira del testimonio inglés. Sin embargo, «gobernantes» debilita el término técnico «archons», y «ofrecieron» elimina el cambio explícito a segunda persona de «and you offered up praise».
  naturalness: El registro es generalmente natural y digno. Se mejora la secuencia final evitando los dos puntos, que convierten una relación sintáctica dañada e incierta en una explicación demasiado definida. «Arcontes» es un préstamo asentado en español para este contexto y puede explicarse en nota.
  terminology: Se mantiene «Salvador», «reposo», «temporalidad», «ira», «elegidos» y «solitarios». Se recomienda «arcontes» como equivalente formal de archons, con una nota que indique su posible referencia a gobernantes o poderes y que no fije una cosmología.
  issues:
  - severity: medium
    issue: «Gobernantes» sustituye «archons» por una interpretación semántica no técnica.
    rationale: El testimonio emplea «archons», término que puede ser técnico. «Arcontes» conserva el término y su ambigüedad; la nota puede ofrecer «gobernantes» como glosa posible sin convertirla en la única lectura.
  - severity: medium
    issue: «Ofrecieron alabanza» cambia la segunda persona del testimonio a tercera persona.
    rationale: El inglés dice «and you offered up praise». Aunque el cambio desde «those who» es abrupto, debe conservarse como «y ustedes ofrecieron alabanza», no armonizarse.
  - severity: low
    issue: Los dos puntos tras «cruzar al otro lado» fijan indebidamente la relación de la frase siguiente.
    rationale: La secuencia contiene una laguna y su sintaxis es incierta. Una coma conserva mejor la continuidad entrecortada del testimonio.
  revised_text: 'El Salvador dijo a sus discípulos: «Hermanos, ha llegado ya el momento de que dejemos nuestra labor y permanezcamos en reposo, porque quien permanece en reposo descansará para siempre. Les digo: trasciendan siempre [. . .] la temporalidad [. . .]. [Les digo]: [. . .] no teman [a quienes . . .] ustedes. Yo [les digo]: la ira es temible, [y quien] provoca la ira es una [persona temible]. Pero, puesto que ustedes [han podido sufrir], quizá salga de [ustedes . . .].



    »La gente ha recibido con temor y temblor estas palabras acerca de la ira. La ira puso arcontes[a] sobre ellos, porque nadie puede evitar la ira. Sin embargo, cuando vine, abrí un camino e instruí a la gente acerca del camino para cruzar al otro lado, para los elegidos y solitarios,[b] [] aquellos que han conocido al Padre y que han sido fieles a la verdad, y ustedes ofrecieron alabanza».'
  revised_footnotes:
  - marker: a
    text: «Arcontes» transcribe un término que puede referirse a gobernantes o poderes. Su sentido preciso en este pasaje es incierto.
    reason: Conserva el término técnico del testimonio («archons») y explica su posible alcance sin imponer una cosmología concreta.
  - marker: b
    text: «Solitarios» puede funcionar como una designación especial, pero su sentido exacto en este pasaje no es seguro.
    reason: Preserva la ambigüedad de una expresión posiblemente técnica.
  revision_rationale: 'Las correcciones conservan más estrechamente los términos y las irregularidades sintácticas del testimonio inglés provisional: «arcontes» retiene archons, se evita una puntuación que sobreinterprete la laguna, y «ustedes ofrecieron» mantiene el cambio final a segunda persona. Se han preservado todos los signos de daño o restauración del manuscrito tal como aparecen en el testimonio suministrado.'
