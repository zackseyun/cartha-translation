translation:
  language: es
  text: 'El Salvador dijo a sus discípulos: «Hermanos, ha llegado ya el momento de que dejemos nuestra labor y permanezcamos en reposo, porque quien permanece en reposo descansará para siempre. Les digo: trasciendan siempre [. . .] la temporalidad [. . .]. [Les digo]: [. . .] no teman [a quienes . . .] ustedes. Yo [les digo]: la ira es temible, [y quien] provoca la ira es una [persona temible]. Pero, puesto que ustedes [han podido sufrir], quizá salga de [ustedes . . .].


    »La gente ha recibido con temor y temblor estas palabras acerca de la ira. La ira puso gobernantes[a] sobre ellos, porque nadie puede evitar la ira. Sin embargo, cuando vine, abrí un camino y enseñé a la gente cómo cruzar al otro lado: para los elegidos y solitarios,[b] [] aquellos que han conocido al Padre, han sido fieles a la verdad y ofrecieron alabanza».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Gobernantes» traduce el término tradicionalmente transcrito como «arcontes». Aquí puede referirse a autoridades o poderes; el sentido preciso es incierto.
    reason: Aclara un término potencialmente técnico sin imponer una cosmología específica.
  - marker: b
    text: «Solitarios» puede funcionar como una designación especial, pero su sentido exacto en este pasaje no es seguro.
    reason: Preserva la ambigüedad de una expresión posiblemente técnica.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Equivalente tradicional, claro y digno del título cristológico presente en el testimonio.
- source_word: stand at rest / rest
  choice: permanecer en reposo / descansar
  rationale: Conserva la repetición conceptual entre estado presente y descanso permanente, evitando una expresión rígida como «estar de pie en reposo».
- source_word: transcend
  choice: trasciendan
  rationale: Mantiene el movimiento conceptual de superar o ir más allá sin explicar una posible cosmología implícita.
- source_word: temporality
  choice: temporalidad
  rationale: Reproduce el sustantivo abstracto del testimonio y preserva su amplitud semántica.
- source_word: anger
  choice: ira
  rationale: Mantiene la personificación y el tono intenso del pasaje de forma más consistente que alternar con «enojo».
- source_word: archons
  choice: gobernantes
  rationale: Traduce el sentido básico del término y evita imponer como texto principal una interpretación técnica no comprobada mediante revisión copta.
- source_word: crossing over
  choice: cruzar al otro lado
  rationale: Conserva la metáfora de tránsito sin precisar indebidamente su destino o significado doctrinal.
- source_word: elect and solitary
  choice: elegidos y solitarios
  rationale: Retiene las dos designaciones y su posible carga técnica sin armonizarlas ni parafrasearlas.
theological_decisions:
- issue: Naturaleza del «reposo»
  choice: Conservar «reposo» y «descansará» sin explicación doctrinal
  alternative: Interpretarlo explícitamente como salvación, muerte, contemplación o descanso escatológico
  rationale: El testimonio no resuelve el referente y el manuscrito requiere revisión directa del copto.
- issue: Personificación de la ira
  choice: Mantener «La ira puso gobernantes sobre ellos»
  alternative: Reformular como que personas airadas nombraron autoridades o que poderes cósmicos dominan a la humanidad
  rationale: La sintaxis transmitida atribuye la acción a la ira; explicarla silenciaría una tensión genuina.
- issue: Identidad de los «solitarios»
  choice: Traducir literalmente y añadir una nota de cautela
  alternative: Verter «monjes», «célibes» o «los unidos»
  rationale: Esas alternativas incorporan interpretaciones históricas o espirituales no seguras en esta fase provisional.
- issue: Relación sintáctica de «para los elegidos y solitarios»
  choice: Conservar la construcción entrecortada con dos puntos y la laguna
  alternative: Integrarla fluidamente como destinatarios inequívocos de la enseñanza
  rationale: El texto dañado no permite fijar con seguridad la relación gramatical.
- issue: Sujeto de «ofrecieron alabanza»
  choice: 'Mantener la segunda persona implícita del testimonio: «ofrecieron» dentro de la serie dirigida a ustedes'
  alternative: Cambiar a tercera persona para concordar con «aquellos»
  rationale: El testimonio inglés conserva una oscilación de persona; la traducción evita resolverla mediante una reconstrucción no verificada.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se conservaron los corchetes, los puntos suspensivos y los corchetes vacíos como señales de lagunas o restauraciones del testimonio. El borrador es provisional porque se basa en un testimonio inglés de dominio público y queda pendiente la revisión directa del copto del Códice III,5 de Nag Hammadi.
