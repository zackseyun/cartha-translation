  glossary_alignment: No se presentan términos sujetos a los valores predeterminados del glosario. «Juicio» conserva el evento judicial escatológico; «tierra seca» mantiene el sentido concreto de የብስ, en vez de generalizarlo como «tierra».
  issues:
