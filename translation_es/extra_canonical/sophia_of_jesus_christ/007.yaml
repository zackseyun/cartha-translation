translation:
  language: es
  text: 'Sus discípulos volvieron a hablar:


    —Dinos claramente cómo descendieron desde las realidades invisibles, desde lo que no muere hasta el mundo de la mortalidad.


    El Salvador perfecto dijo:


    —El Hijo del Hombre se unió a su compañera Sofía y manifestó una poderosa luz andrógina. Su nombre masculino es «Salvador, Progenitor de Todo»; su nombre femenino es «Sofía, Progenitora de Todo», aunque algunos la llaman «Pistis»[a].


    »Como [] una gota de la luz, todo el que entra en el mundo es enviado por él al mundo del Todopoderoso, para que él lo vigile. Y, por voluntad de Sofía, la atadura de su olvido encadenó la luz, a fin de que por este medio el asunto pudiera ser <revelado> a todo el mundo empobrecido: el orgullo y la ceguera del Todopoderoso, y la ignorancia que le dio nombre[b].


    »Yo, en cambio, por voluntad de la gran Luz, procedí de las regiones de arriba, <liberándome> de esa atadura y deteniendo la actividad de los ladrones. He despertado aquella gota enviada por Sofía, para que por medio de mí dé mucho fruto y llegue a ser perfecta, y nunca vuelva a ser deficiente, sino que por medio de mí, el gran Salvador, sea <unida>, de modo que se manifieste su gloria; para que también Sofía sea corregida de aquel defecto; para que sus [] hijos nunca vuelvan a ser deficientes, sino que reciban honor y gloria, asciendan hasta su Padre y comprendan el lenguaje de la Luz masculina[b].


    »Y ustedes fueron enviados por el Hijo, quien también fue enviado, para que recibieran luz y se separaran del olvido de las autoridades; para que este nunca volviera a manifestarse por causa de ustedes, es decir, el frotamiento impuro que nace del fuego temible que salió del falo de ellas. Pisoteen la mala intención de esas autoridades[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Pistis» es una transliteración de una palabra griega que puede significar «fe», «confianza» o «fidelidad»; aquí funciona como nombre.
    reason: Aclara el valor léxico sin reemplazar ni interpretar de manera exclusiva el nombre del personaje.
  - marker: b
    text: Los corchetes vacíos [] señalan una laguna o texto perdido en el manuscrito; los signos < > indican palabras restituidas por los editores. Por ello, la sintaxis y algunos enlaces de estas frases son inciertos.
    reason: Hace visibles el daño manuscrito y la intervención editorial que el testimonio señala.
  - marker: c
    text: El referente exacto de «este» es incierto, y la expresión «frotamiento impuro» es oscura en el testimonio conservado.
    reason: Advierte una ambigüedad textual importante sin resolverla mediante conjetura.
lexical_decisions:
- source_word: invisibilities
  choice: realidades invisibles
  rationale: Conserva el plural conceptual del testimonio sin imponer una cosmología más específica; «invisibilidades» sería poco natural en español.
- source_word: androgynous light
  choice: luz andrógina
  rationale: Mantiene de forma directa la combinación de rasgos masculinos y femeninos presente en el texto.
- source_word: All-Begetter
  choice: Progenitor de Todo / Progenitora de Todo
  rationale: Reproduce el título generativo y permite conservar su forma masculina y femenina; evita reducirlo a «creador», que podría borrar el matiz de engendramiento.
- source_word: Pistis
  choice: Pistis
  rationale: Se conserva como nombre propio y se explica en nota, sin sustituirlo por una interpretación.
- source_word: fetter
  choice: atadura
  rationale: Expresa sujeción o encadenamiento sin concretar de manera innecesaria el objeto físico.
- source_word: defective
  choice: deficiente
  rationale: Conserva la idea reiterada de carencia o imperfección y evita introducir una noción moral no explícita.
- source_word: authorities
  choice: autoridades
  rationale: Traducción formal que preserva el sentido cosmológico posible sin reemplazarlo por el término doctrinal «arcontes».
- source_word: impure rubbing
  choice: frotamiento impuro
  rationale: Mantiene la expresión corporal y deliberadamente extraña del testimonio, sin suavizarla ni interpretarla como un acto más específico.
- source_word: phallus
  choice: falo
  rationale: Equivalente anatómico directo y digno, adecuado al registro del pasaje.
theological_decisions:
- issue: Identidad del «Todopoderoso»
  choice: Se conserva el título «Todopoderoso» y la atribución textual de orgullo, ceguera e ignorancia.
  alternative: Identificarlo explícitamente como Dios, demiurgo o arconte.
  rationale: El pasaje distingue figuras dentro de su propia cosmología, pero el testimonio suministrado no autoriza resolver con precisión denominacional o sistemática la identidad del personaje.
- issue: Referente de «su olvido» y «su gloria»
  choice: Se mantiene el posesivo «su» sin aclaración interpretativa.
  alternative: Sustituirlo por el nombre de un referente supuesto.
  rationale: El testimonio presenta referentes gramaticalmente ambiguos; aclararlos en el texto resolvería indebidamente la tensión.
- issue: Relación del Hijo del Hombre con Sofía
  choice: «se unió a su compañera Sofía»
  alternative: «tuvo relaciones con», «engendró con» o una unión puramente espiritual explícita.
  rationale: «Se unió» conserva la asociación íntima de «consorted» sin definir más de lo que permite el testimonio.
- issue: Rectificación de Sofía
  choice: «Sofía sea corregida de aquel defecto»
  alternative: «sea redimida de su pecado» o «sea sanada».
  rationale: Se conserva el lenguaje de defecto y corrección, evitando importar categorías soteriológicas o morales más específicas.
- issue: «Lenguaje de la Luz masculina»
  choice: Se conserva literalmente como «lenguaje de la Luz masculina».
  alternative: Interpretarlo como revelación, Logos, voz divina o enseñanza.
  rationale: La expresión cosmológica permanece abierta y no debe identificarse con una doctrina externa.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y se mantiene el tono revelatorio del diálogo. La traducción es provisional porque se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto de los códices de Nag Hammadi y Berlín. Se preservan las lagunas [] y las restituciones editoriales < >.
