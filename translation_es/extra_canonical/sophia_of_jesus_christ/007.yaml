    »Como [] gota de la luz, todo el que entra en el mundo es enviado por él al mundo del Todopoderoso, para que él vele por esa persona. Y, por voluntad de Sofía, la atadura de su olvido encadenó la luz, a fin de que por este medio el asunto pudiera ser <revelado> a todo el mundo empobrecido: el orgullo y la ceguera del Todopoderoso, y la ignorancia que le dio nombre[b].


    »Yo, en cambio, por voluntad de la gran Luz, procedí de las regiones de arriba, <liberando> de esa atadura, tras detener la actividad de los ladrones. He despertado aquella gota enviada por Sofía, para que por medio de mí dé mucho fruto y llegue a ser perfecta, y nunca vuelva a ser deficiente, sino que por medio de mí, el gran Salvador, sea <unida>, de modo que se manifieste su gloria; para que también Sofía sea corregida de aquel defecto; para que sus [] hijos nunca vuelvan a ser deficientes, sino que reciban honor y gloria, asciendan hasta su Padre y comprendan el lenguaje de la Luz masculina[b].


