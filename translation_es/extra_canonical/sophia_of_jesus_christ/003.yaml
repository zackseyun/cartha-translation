translation:
  language: es
  text: 'Felipe preguntó:


    —Señor, entonces, ¿cómo se manifestó él a los perfectos?


    El Salvador perfecto le respondió:


    —Antes de que se hiciera visible todo cuanto es visible, la majestad y la autoridad existían [a] en él, pues él abarca la totalidad de las Totalidades, mientras que nada lo abarca a él. Esto se debe a que él es enteramente mente, y es pensamiento y reflexión, consideración, razonamiento y poder. Todas estas son potencias equivalentes y son las fuentes de las Totalidades. Y todo su linaje, desde el primero hasta el último, está en el conocimiento previo de él, el Padre infinito no engendrado.


    Tomás le preguntó:


    —Señor, Salvador, ¿por qué llegaron estos a existir y por qué fueron revelados?


    El Salvador perfecto respondió:


    —Yo procedí del Infinito para decírselo todo. El Espíritu que Es fue quien engendró, pues tenía el poder <de> engendrar [b] y la naturaleza de quien [da] forma, a fin de que pudiera revelarse la gran riqueza escondida en él. Por su misericordia y su amor, quiso producir fruto por sí mismo, para no <disfrutar> él solo de su bondad, sino para que otros espíritus de la generación inconmovible pudieran producir cuerpos y espíritus, gloria y honor en la incorruptibilidad, y su don infinito; así su tesoro podría ser manifestado por medio del Dios autoengendrado, Padre de toda incorruptibilidad y de quienes después llegarían a existir, pero que aún no habían aparecido visiblemente. Entre los incorruptibles prevalece una gran diferencia.


    Entonces exclamó:


    —¡Quien tenga oídos para oír acerca de los infinitos, que oiga!


    Y añadió:


    —¡He hablado a quienes están despiertos!


    Prosiguió [c] diciendo:


    —Todo lo que se originó de lo perecedero perecerá, porque se originó de lo perecedero; pero lo que se originó de lo imperecedero no perecerá, sino que será imperecedero.


    Por consiguiente, muchos se extraviaron porque no conocían esta diferencia, y murieron.


    [a] El testimonio inglés señala aquí una laguna o incertidumbre textual mediante corchetes vacíos.

    [b] «<de>» representa una adición editorial, y los corchetes vacíos señalan una laguna o incertidumbre en el testimonio; «[da]» representa texto restaurado.

    [c] El testimonio inglés señala aquí una laguna o incertidumbre textual mediante corchetes vacíos.'
