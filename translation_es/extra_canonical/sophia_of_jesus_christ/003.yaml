lexical_decisions:
- source_word: the perfect ones
  choice: los perfectos
  rationale: Conserva el término técnico y la posible categoría espiritual del escrito sin explicarla ni reducirla a «los maduros».
- source_word: the Totalities
  choice: las Totalidades
  rationale: La mayúscula y el plural preservan el probable uso cosmológico técnico del testimonio.
- source_word: foreknowledge
  choice: conocimiento previo
  rationale: Expresa conocimiento anticipado sin importar el sentido doctrinal más específico que podría sugerir «presciencia».
- source_word: the Infinite
  choice: el Infinito
  rationale: Se mantiene como designación sustantivada y personal del principio divino.
- source_word: the Spirit Who Is
  choice: el Espíritu que Es
  rationale: Conserva la formulación ontológica y su posible carácter titular.
- source_word: unmoving generation
  choice: generación inconmovible
  rationale: Mantiene la imagen técnica de una estirpe estable e inalterable; «inmóvil» podría sugerir solo falta de movimiento físico.
- source_word: self-begotten God
  choice: Dios autoengendrado
  rationale: Reproduce la afirmación paradójica del texto sin sustituirla por una fórmula teológica posterior.
- source_word: indestructability / imperishable
  choice: incorruptibilidad / imperecedero
  rationale: 'Se conserva la variación del testimonio: un sustantivo técnico en el primer contexto y el contraste natural «perecedero/imperecedero» en el segundo.'
theological_decisions:
- issue: Identidad del referente masculino en «he embraces» y «in his foreknowledge»
  choice: Mantener los pronombres masculinos y la sintaxis del testimonio
  alternative: Identificar explícitamente al referente como el Padre o como otra entidad mencionada
  rationale: El pasaje suministrado permite cierta ambigüedad referencial; explicitarla resolvería indebidamente la tensión.
- issue: Relación entre el Espíritu que Es, el Infinito y el Dios autoengendrado
  choice: Conservar las designaciones distintas y la secuencia del texto
  alternative: Armonizarlas como nombres inequívocos de una sola persona divina
  rationale: El testimonio presenta una cosmología propia cuya relación interna no debe normalizarse conforme a doctrinas posteriores.
- issue: «A great difference prevails among the indestructible ones»
  choice: «Entre los incorruptibles prevalece una gran diferencia»
  alternative: Explicar cuál es la diferencia o jerarquizarlos explícitamente
  rationale: El texto afirma la diferencia sin definirla; se preserva esa falta de especificación.
- issue: «those who are infinite»
  choice: «los infinitos»
  alternative: «las realidades infinitas» o «los seres infinitos»
  rationale: La expresión puede referirse a seres o entidades y el testimonio no la precisa; la forma sustantivada mantiene la ambigüedad.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea diálogo con raya y tratamiento de «tú» implícito, sin regionalismos. El borrador es provisional porque no se proporcionó el texto copto para revisión directa; se basa en el testimonio público inglés suministrado y conserva sus señales críticas.
