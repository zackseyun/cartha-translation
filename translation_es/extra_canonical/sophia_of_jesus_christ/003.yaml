id: SOJC.003
reference: Sophia of Jesus Christ — The Appearance of He Who Is
language:
  code: es
  name: Spanish
  native_name: Español
  variant: neutral Latin American Spanish
source:
  text: 'Philip asked: “Lord, how, then, did he appear to the perfect ones?”


    The perfect Savior said to him: “Before anything that is visible became visible, the majesty and authority existed [] in him, because he embraces the entirety of the Totalities, whereas nothing embraces him. This is because he is entirely mind, and he is thought and reflection, consideration, reasoning, and power. They all are equivalent powers, being the sources of the Totalities. And their entire race, from first to last, is in his foreknowledge, of the infinite unbegotten Father.”


    Thomas asked him: “Lord, Savior, what is the reason these came into being, and why were they revealed?”


    The perfect Savior said: “I originated from the Infinite in order to tell you everything. The Spirit Who Is was the one who begot, having the power <of> a begetter [] and the nature of one who [bestows] form, so that the great wealth concealed in him could be revealed. On account of his mercy and his love he desired to produce fruit by himself, to avoid <enjoying> his goodness all alone (by himself), but so that other spirits of the unmoving generation could produce bodies and spirits, glory and honor in indestructability, and his infinite gift, so that his treasure could be manifested by the self-begotten God, the Father of all indestructability and of those that afterward would come into existence, but who had not yet appeared visibly. A great difference prevails among the indestructible ones.”


    He cried out and said: “Let whoever has ears to hear about those who are infinite, hear!” And: “I have spoken to those who are awake!”


    He continued further [] and said: “Everything that originated from what is perishable will perish, because it originated from what is perishable, but what has originated from what is imperishable will not perish, but will be imperishable.


    Consequently, many erred because they were unaware of this difference, and they died.”'
