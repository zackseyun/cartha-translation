  language: es
  text: 'Entonces Tomás le preguntó: «Señor, Salvador, ¿cuántos eones[a] están por encima de los cielos?».


    El Salvador perfecto dijo: «Te alabo por preguntar acerca de los grandes eones, porque tus raíces habitan en los infinitos. Cuando fueron revelados aquellos de quienes hablé antes, él [proveyó…]


    (Faltan las páginas coptas 109 y 110)


    »[…] [ ] y llegan a una unidad, los llamamos la “Asamblea de la Ogdóada”[b]. Esta se manifestó como andrógina y fue llamada en parte masculina y en parte femenina. La parte masculina se llama “Asamblea”, mientras que la femenina se llama “Vida”, para mostrar que la vida de todos los eones procedió de una figura femenina.


    »Y todos los nombres se recibieron del principio originador. Esto sucedió porque, de la armonía de él con su pensamiento, aparecieron con gran rapidez las potencias llamadas “dioses”; y, conforme a su sabiduría, [los] dioses de los dioses revelaron dioses; <y los dioses>, conforme a su sabiduría, revelaron señores; y los señores de los señores, conforme a sus actos de pensamiento, revelaron señores; y los señores, conforme a su poder, revelaron arcángeles; y los arcángeles, conforme a sus palabras, revelaron ángeles. [ ] De ellos aparecieron representaciones dotadas de estructura, forma y nombre para todos los eones y sus mundos.


    »Todos los inmortales que acabo de describir ejercen autoridad procedente del Ser Humano Inmortal, que recibe el nombre de “Silencio”, porque, cuando contemplaron en silencio, sin pronunciar palabra, la majestad de ella llegó a su plenitud. Puesto que los indestructibles tenían autoridad, cada uno creó un gran reino en la Ogdóada, además de tronos, templos y firmamentos para sus respectivas majestades, porque todos ellos se originaron por la voluntad de la Madre del Mundo».


    Entonces los santos apóstoles le dijeron: «Señor, Salvador, háblanos de quienes habitan en los eones, porque necesitamos averiguar acerca de ellos».


    El Salvador perfecto [ ] dijo: «Pueden preguntar acerca de cualquier cosa, y yo les daré la respuesta.


    »Ellos crearon ejércitos de ángeles —innumerables miríadas— para el servicio y para su gloria. Crearon espíritus vírgenes, luces inexpresables e inquebrantables, porque no padecen enfermedad ni debilidad, sino que manifiestan voluntad.


    »De este modo, los eones quedaron completados rápidamente, junto con los cielos y los firmamentos, en la gloria del Ser Humano Inmortal y de su consorte, Sofía. De allí, todos los eones y mundos, junto con los que vinieron después, recibieron el modelo para crear sus semejanzas, tanto en los cielos del caos como en sus propios mundos. Y toda naturaleza, a partir de la revelación del caos, habita en la luz sin sombra, en una alegría indescriptible y en un gozo inexpresable. Disfrutan continuamente de su gloria, que nunca se desvanece, [ ] y de su reposo infinito, que es indescriptible entre todos los eones y todas las potencias de estos que llegaron a existir después. Todo lo que acabo de decirles, lo dije para que ustedes brillen en la luz aún más que estos».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Eones» es un término técnico para realidades o ámbitos eternos de la cosmología del escrito; el contexto no permite reducirlo simplemente a períodos de tiempo.
    reason: Aclara un préstamo técnico necesario sin resolver la ambigüedad cosmológica.
  - marker: b
    text: «Ogdóada» significa literalmente un conjunto de ocho y aquí funciona como nombre de una realidad celestial.
    reason: Ayuda al lector moderno a comprender un término técnico poco común.
lexical_decisions:
- source_word: aeons
  choice: eones
  rationale: Se conserva el término técnico cosmológico, ya asentado en español para este tipo de literatura, sin reducirlo a «edades» ni identificarlo de manera interpretativa con seres, mundos o períodos.
- source_word: Assembly of the Ogdoad
  choice: Asamblea de la Ogdóada
  rationale: «Asamblea» mantiene la personificación y su relación explícita con la parte masculina; «Ogdóada» conserva el término técnico que designa una agrupación o realidad de ocho.
- source_word: Immortal Human
  choice: Ser Humano Inmortal
  rationale: Expresa la figura arquetípica con lenguaje comprensible y evita que «Hombre» se entienda únicamente como varón, sin borrar la personificación del pasaje.
- source_word: Silence
  choice: Silencio
  rationale: Se conserva como nombre o título propio y se mantiene la posterior referencia femenina («la majestad de ella»), aun cuando produzca una tensión gramatical en español.
- source_word: simulacra
  choice: representaciones
  rationale: Comunica la idea de imágenes o formas derivadas sin la connotación moderna predominantemente negativa de «simulacros»; el contexto precisa que poseen estructura, forma y nombre.
- source_word: virgin spirits
  choice: espíritus vírgenes
  rationale: Mantiene la imagen del testimonio sin explicarla como pureza moral, asexualidad u otra doctrina no expresada.
- source_word: Sophia
  choice: Sofía
  rationale: Se usa la forma tradicional española del nombre, que a la vez conserva su vínculo reconocible con la Sabiduría personificada.
theological_decisions:
- issue: Identidad y género del Ser Humano Inmortal llamado «Silencio»
  choice: Mantener «Ser Humano Inmortal» y la referencia femenina «la majestad de ella»
  alternative: Armonizar todos los pronombres en masculino o identificar explícitamente a Silencio como una entidad femenina distinta
  rationale: El testimonio presenta una tensión real entre el título y la referencia femenina; la traducción no la resuelve mediante una interpretación teológica añadida.
- issue: Naturaleza de los eones
  choice: Conservar «eones» como término técnico
  alternative: Traducirlos sistemáticamente como «edades», «mundos» o «seres celestiales»
  rationale: El pasaje parece atribuirles dimensiones personales, espaciales y cosmológicas; una equivalencia más específica eliminaría esa amplitud.
- issue: Procedencia femenina de la vida de los eones
  choice: Traducir «procedió de una figura femenina»
  alternative: Suavizar como «procedió del principio femenino» o identificarla con una figura doctrinal concreta
  rationale: Se conserva la afirmación del testimonio y su énfasis femenino sin imponer una ontología ajena al texto.
- issue: Jerarquía de dioses, señores, arcángeles y ángeles
  choice: Mantener la secuencia y los plurales tal como aparecen
  alternative: Reformularlos como nombres simbólicos, rangos creados por un único Dios o emanaciones en sentido doctrinal
  rationale: La traducción debe preservar la cosmología propia del escrito sin normalizarla según una tradición confesional posterior.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» en el discurso plural. Se preservan los corchetes, puntos suspensivos, signos angulares y el aviso sobre las páginas faltantes como señales textuales del testimonio suministrado. Debido a que la revisión directa del copto está pendiente, este borrador se apoya provisionalmente en el testimonio inglés público y evita reconstruir las lagunas.
