translation:
  language: es
  text: 'Después de resucitar de entre los muertos, sus doce discípulos y siete mujeres siguieron siendo sus seguidores y viajaron a Galilea, al monte [a] llamado «Lugar de la Cosecha y la Alegría». Cuando se reunieron, estaban perplejos acerca de la naturaleza fundamental del mundo, el plan, la providencia divina, el poder de las autoridades y la manera en que el Salvador se relaciona con ellas en el misterio del plan divino. El Salvador se apareció, no con su forma anterior y visible, sino como el espíritu invisible. Su figura era semejante a la de un ángel alto y radiante; pero no debo describir aquello a lo que se parecía, pues ningún ser mortal podría soportarlo. Era carne enteramente pura y perfecta, como aquella de la que nos enseñó en el monte llamado «de los Olivos», en Galilea.


    Y dijo:


    —¡La paz esté con ustedes! ¡Mi paz les doy!


    Todos quedaron sobrecogidos y tuvieron miedo.


    El Salvador [b] se rio y les preguntó:


    —¿En qué están pensando? ¿Por qué están perplejos? ¿Qué buscan?


    Felipe dijo:


    —La naturaleza fundamental del mundo y su plan.


    El Salvador les dijo:


    —Quiero que entiendan que todos los nacidos en la tierra desde la fundación del mundo hasta ahora, por ser polvo, no han logrado encontrar a Dios, aunque han investigado acerca de su ser y su semejanza. Los más grandes sabios entre ellos han formulado conjeturas basándose en la manera en que el mundo está ordenado y se mueve, pero sus conjeturas no han alcanzado la verdad.


    »Todos los filósofos dicen que el orden del universo es regido de tres maneras distintas, y por eso no están de acuerdo. Algunos sostienen que el mundo se rige a sí mismo. [c] Otros sostienen que lo hace la providencia, y otros, que lo hace el destino; pero ninguna de estas cosas es así.


    »Repito: ninguna de las tres propuestas que acabo de exponer se acerca a la verdad, pues son conjeturas humanas. Yo, en cambio, procedo de la Luz Infinita, porque lo conozco, y estoy aquí para decirles con exactitud cuál es la verdad. La vida de todo lo que se origina a sí mismo es impura, pues se ha hecho a sí mismo. La teoría de la providencia no tiene nada de sabia, y la teoría del destino carece de entendimiento.


    »A ustedes, sin embargo, se les ha concedido conocer. También recibirá conocimiento cualquier otra persona digna de él: quien no haya sido engendrado por la siembra de una unión impura,[d] sino por aquel que fue enviado primero, porque este es un inmortal entre los mortales».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquí el testimonio señala una laguna o daño en el manuscrito antes del nombre del monte.
    reason: Conservar de forma visible la señal de daño textual transmitida por el testimonio inglés.
  - marker: b
    text: Aquí el testimonio señala una laguna o daño en el manuscrito después de «el Salvador».
    reason: Evitar ocultar una discontinuidad material que podría afectar la lectura de la oración.
  - marker: c
    text: Aquí el testimonio señala una laguna o daño en el manuscrito entre la primera propuesta y las siguientes.
    reason: Advertir que la transición entre las teorías filosóficas puede estar incompleta.
  - marker: d
    text: La expresión del testimonio es difícil y literalmente alude a la «siembra» producida por un «frotamiento impuro», probablemente una referencia a la unión sexual. La traducción «unión impura» es provisional.
    reason: Preservar la extrañeza y la incertidumbre de una frase cuya revisión directa en copto sigue pendiente.
lexical_decisions:
- source_word: fundamental nature
  choice: naturaleza fundamental
  rationale: Conserva la formulación ontológica del testimonio sin reducirla a «origen» o «esencia», sentidos que resolverían prematuramente una expresión cuyo cotejo copto aún está pendiente.
- source_word: plan
  choice: plan
  rationale: Mantiene la amplitud del término del testimonio, que podría aludir al orden o designio cósmico, sin identificarlo automáticamente con la providencia.
- source_word: authorities
  choice: autoridades
  rationale: Preserva el posible sentido técnico de potestades cósmicas y evita sustituirlo por «gobernantes» o «poderes», ya que el contexto distingue su poder de ellas mismas.
- source_word: invisible spirit
  choice: el espíritu invisible
  rationale: Reproduce la expresión de manera directa y mantiene su tensión con la posterior descripción de carne pura y perfecta.
- source_word: likeness
  choice: figura
  rationale: En la descripción de la aparición, «figura» resulta natural en español y evita confundir esta semejanza visual con la «semejanza» divina mencionada después.
- source_word: cosmic order
  choice: orden del universo
  rationale: Expresa con claridad el alcance cósmico implícito en el testimonio sin añadir terminología filosófica innecesaria.
- source_word: self-originated / self-made
  choice: se origina a sí mismo / se ha hecho a sí mismo
  rationale: Conserva la reiteración y la difícil afirmación causal del texto, sin armonizarla con una cosmología externa.
- source_word: Infinite Light
  choice: Luz Infinita
  rationale: Se trata como designación trascendente en este contexto y se conserva su forma conceptual sin explicación doctrinal añadida.
- source_word: impure rubbing
  choice: unión impura
  rationale: Ofrece una expresión digna y comprensible para una imagen sexual difícil; la nota conserva la literalidad más áspera del testimonio.
- source_word: Savior
  choice: Salvador
  rationale: Equivalente tradicional, claro y no denominacional para el título usado de manera constante en el pasaje.
theological_decisions:
- issue: Relación entre espíritu invisible y carne perfecta
  choice: Conservar ambas afirmaciones sin armonizarlas
  alternative: Interpretar «carne» metafóricamente o convertir «espíritu» en una mera apariencia
  rationale: El pasaje mantiene deliberadamente una tensión entre invisibilidad, apariencia angélica y carne pura; la traducción no debe resolverla mediante una doctrina posterior.
- issue: Identidad de «aquel que fue enviado primero»
  choice: Mantener el referente sin identificar
  alternative: Identificarlo explícitamente con Cristo, el Salvador u otra figura
  rationale: El testimonio suministrado no hace explícita la identidad en esta oración; añadirla importaría una interpretación.
- issue: Providencia, destino y autorregulación del mundo
  choice: Presentarlas como tres teorías rechazadas dentro del discurso
  alternative: Reformular el pasaje como rechazo absoluto de toda providencia divina
  rationale: El texto critica una teoría filosófica denominada providencia, aunque antes habla de «providencia divina» entre las preguntas de los discípulos. Se conserva esa tensión terminológica.
- issue: «Un inmortal entre los mortales»
  choice: Conservar el singular y su ambigüedad referencial
  alternative: Cambiarlo al plural o definir a quién describe
  rationale: La sintaxis del testimonio vincula el pronombre con «aquel que fue enviado primero», pero el sentido puede ser teológicamente cargado; no se explicita más de lo que permite el texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» y puntuación moderna de diálogo. La traducción es provisional porque el material suministrado declara pendiente la revisión directa del copto; por ello se preservan las lagunas, las referencias ambiguas y las tensiones conceptuales, y se evita reconstruir texto ausente o imponer una lectura confesional.
