translation:
  language: es
  text: 'María le preguntó:


    —Entonces, Señor, ¿cómo podemos llegar a conocer eso?


    El Salvador perfecto dijo:


    —Comiencen por las cosas ocultas y lleguen hasta el límite de las cosas visibles; entonces la emanación del Pensamiento les revelará por sí misma cómo la fe en las cosas invisibles se encuentra en lo visible, cosas que pertenecen al Padre no engendrado. ¡Quien tenga oídos para oír, que oiga!


    »Al Señor del Mundo no se lo llama “Padre”, sino “Antepadre”, <porque el Padre es> el principio originador de los que llegarán a ser visibles; pero él […] es [el] Antepadre sin principio. Se contempla a sí mismo dentro de sí, como en un espejo, y aparece en su propia semejanza como el divino Padre de Sí Mismo y <como> el que refleja sobre los que reflejan: el primer existente, el Padre no engendrado. En efecto, tiene la misma antigüedad <que> la luz que está delante de él, pero no la iguala en poder.


    »Después reveló muchos seres reflectantes, engendrados por sí mismos, de igual antigüedad y poder, que subsisten en gloria y son innumerables. Su linaje se llama “la Generación sobre la cual no hay Reino”, procedente de aquel en el cual ustedes mismos han llegado a ser visibles entre estos <reinos>. Y a toda esa multitud sobre la cual no hay reino se la llama […] “los Hijos del Padre no engendrado”, “Dios”, “[Salvador]” e “Hijo de Dios”; su semejanza habita con ustedes.


    »Él es el Incognoscible, lleno de toda gloria indestructible y de alegría indecible. Todos reposan en él y se alegran continuamente con una alegría indecible por su gloria, que nunca cambia, y con un gozo inconmensurable. Hasta ahora, esto jamás había sido oído ni conocido entre todos los eones y sus mundos».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Forefather
  choice: Antepadre
  rationale: Conserva la distinción técnica y explícita frente a «Padre» sin sustituirla por el más genealógico «antepasado».
- source_word: unbegotten
  choice: no engendrado
  rationale: Mantiene el concepto cosmológico de alguien que no ha sido generado, con una expresión clara y tradicional en español.
- source_word: Self-Father
  choice: Padre de Sí Mismo
  rationale: Reproduce el compuesto reflexivo y evita imponer una interpretación como «autoengendrado», que corresponde a otro término del pasaje.
- source_word: reflecting / reflector
  choice: reflectantes / el que refleja
  rationale: Preserva la imaginería del espejo y la repetición conceptual del testimonio, aunque el giro siga siendo deliberadamente extraño.
- source_word: self-begotten
  choice: engendrados por sí mismos
  rationale: Expresa la generación reflexiva sin confundirla con «no engendrados».
- source_word: aeons
  choice: eones
  rationale: Retiene el término cosmológico técnico, pues traducirlo simplemente como «edades» podría borrar su posible sentido de entidades o ámbitos.
- source_word: nation / Generation
  choice: linaje / Generación
  rationale: «Linaje» resulta natural para el colectivo, mientras que «Generación» se conserva en el título propio solicitado.
- source_word: Unknowable
  choice: Incognoscible
  rationale: Conserva el carácter titular y absoluto del término, no meramente algo todavía desconocido.
theological_decisions:
- issue: Relación entre el Señor del Mundo, el Padre y el Antepadre
  choice: Conservar las designaciones y los pronombres del testimonio sin armonizarlos
  alternative: Identificar explícitamente a cada figura o corregir la aparente tensión entre ellas
  rationale: El pasaje es cosmológicamente ambiguo y el testimonio contiene daño textual; resolver las identidades introduciría una interpretación doctrinal no garantizada.
- issue: Comparación con la luz anterior
  choice: «tiene la misma antigüedad <que> la luz que está delante de él, pero no la iguala en poder»
  alternative: Entender que la luz y el personaje son plenamente iguales o que «antiguo» significa eterno
  rationale: Se mantiene la tensión explícita entre igualdad de antigüedad y desigualdad de poder.
- issue: Nombres colectivos «Dios», «Salvador» e «Hijo de Dios»
  choice: Mantener la sintaxis colectiva y el singular de los títulos tal como aparece
  alternative: Pluralizar los títulos o asignarlos a una sola persona
  rationale: La concordancia del testimonio es difícil; normalizarla eliminaría una ambigüedad textual y teológica genuina.
- issue: Fe en lo invisible hallada en lo visible
  choice: Mantener la formulación epistémica sin explicarla como teología natural, sacramentalismo u otra doctrina
  alternative: Parafrasear el mecanismo preciso por el cual lo visible revela lo invisible
  rationale: El texto afirma la relación, pero no define aquí su marco doctrinal.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se preservaron los signos editoriales del testimonio: los corchetes indican restauración o laguna y los ángulos, palabras suplidas. Dado que la revisión directa del copto está pendiente, el borrador sigue de manera cautelosa el testimonio inglés público y evita pulir sus dificultades hasta convertirlas en afirmaciones más definidas.'
