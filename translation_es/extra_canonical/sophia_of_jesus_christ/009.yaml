translation:
  language: es
  text: 'María le preguntó:


    —Señor santo, ¿de dónde procedieron tus discípulos, adónde van y cómo deben comportarse aquí?


    El Salvador perfecto les dijo:


    —Quiero que sepan que Sofía, la Madre del Mundo y la consorte, quiso por sí sola, sin su contraparte masculina, traer a estos a la existencia. Sin embargo, por voluntad del Padre del Mundo, para que pudiera manifestarse su bondad inconcebible, él creó la cortina entre los inmortales y los que vinieron después, a fin de que el resultado pudiera seguir, que […][a]


    (Faltan las páginas coptas 115–116)[b]


    […] «[…] y aliento, y pudieran de dos llegar a ser uno, tal como era desde el principio, para que pudieran producir mucho fruto y ascender hacia Aquel que es desde el principio, con alegría y gloria inexpresables, y [honor y] el don del [Padre del Mundo].


    »[Por consiguiente], quien conoce [al Padre con conocimiento perfecto irá] al Padre [y descansará en] el [Padre] no engendrado. Pero [quien lo conoce imperfectamente] irá [a la deficiencia] y al descanso [de la Ogdóada].[c]


    »[Ahora bien], quien conoce silenciosamente al [Espíritu] inmortal de luz, reflexionando y concordando con la verdad, si me da señales del Invisible, llegará a ser una luz en el Espíritu silencioso. Quien conoce al Hijo del Hombre con conocimiento y amor, si me da una señal de […] el Hijo del Hombre, puede ir a las moradas de los que están en la Ogdóada».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes y los puntos suspensivos señalan una laguna o texto incompleto en el manuscrito; la oración queda interrumpida.
    reason: Advertir al lector que la dificultad sintáctica proviene del estado textual y no debe completarse con conjeturas silenciosas.
  - marker: b
    text: En este punto faltan las páginas coptas 115–116, por lo que se ha perdido una sección extensa del pasaje.
    reason: Registrar la pérdida material indicada por el testimonio fuente.
  - marker: c
    text: «Ogdóada» significa literalmente un conjunto de ocho y aquí designa un ámbito cosmológico. El pasaje fragmentario no permite definirlo con mayor precisión.
    reason: Aclarar un tecnicismo poco conocido sin imponer una reconstrucción doctrinal.
lexical_decisions:
- source_word: Sophia
  choice: Sofía
  rationale: Se translitera el nombre griego en su forma española, en vez de traducirlo como «Sabiduría», porque aquí funciona como nombre propio de una figura cosmológica.
- source_word: consort
  choice: consorte
  rationale: Conserva la relación técnica expresada por el testimonio sin precisar una condición matrimonial que el texto no explicita.
- source_word: male (counterpart)
  choice: contraparte masculina
  rationale: Expresa la complementariedad indicada entre paréntesis y evita reducir el término a «varón» o «esposo».
- source_word: curtain
  choice: cortina
  rationale: Mantiene la imagen concreta del testimonio; «velo» sería posible, pero podría añadir asociaciones religiosas no exigidas aquí.
- source_word: ungraspable benevolence
  choice: bondad inconcebible
  rationale: Comunica una benevolencia que no puede abarcarse intelectualmente en español natural y digno.
- source_word: He Who Is from the beginning
  choice: Aquel que es desde el principio
  rationale: Conserva el carácter titular y la construcción temporal sin identificarla de manera interpretativa con otro título.
- source_word: unbegotten
  choice: no engendrado
  rationale: Es el equivalente teológico más directo y mantiene la distinción entre existir y ser engendrado.
- source_word: Ogdoad
  choice: Ogdóada
  rationale: Usa el tecnicismo cosmológico asentado en español, sin sustituirlo interpretativamente por «octavo cielo» u otra explicación.
- source_word: repose
  choice: descanso
  rationale: Mantiene la imagen de reposo o estado final sin imponer «salvación», «morada» o «muerte».
- source_word: signs
  choice: señales
  rationale: Traducción amplia que preserva la ambigüedad entre indicios, marcas o pruebas.
theological_decisions:
- issue: Identidad de Sofía y su acción creadora
  choice: Conservar «Sofía, la Madre del Mundo y la consorte» y la referencia ambigua «estos»
  alternative: Traducir «Sabiduría» e identificar explícitamente qué seres quiso producir
  rationale: El pasaje presenta títulos cosmológicos y un referente dañado o dependiente del contexto; explicitarlo resolvería indebidamente la ambigüedad.
- issue: Agencia en la creación de la cortina
  choice: Mantener «él creó» con el Padre del Mundo como antecedente gramatical
  alternative: Usar una construcción impersonal o atribuir la acción a Sofía
  rationale: El testimonio suministrado señala al Padre como sujeto, aunque el contexto fragmentario aconseja no desarrollar las implicaciones doctrinales.
- issue: Destinos según conocimiento perfecto o imperfecto
  choice: Preservar la oposición entre el Padre no engendrado, la deficiencia y el descanso de la Ogdóada
  alternative: Armonizar ambos destinos o interpretarlos mediante categorías soteriológicas posteriores
  rationale: La tensión forma parte del texto y no debe resolverse denominacionalmente.
- issue: «De dos llegar a ser uno»
  choice: Traducir literalmente sin explicar los dos elementos
  alternative: Identificarlos como masculino y femenino, alma y espíritu, o alguna otra pareja
  rationale: La pérdida manuscrita impide saber con seguridad cuáles son los dos; se conserva la indeterminación.
- issue: Conocimiento silencioso y entrega de señales
  choice: Conservar la formulación extraña y condicional
  alternative: Parafrasearla como confesión de fe, sacramento o contraseña ritual
  rationale: El testimonio no permite escoger con seguridad una interpretación doctrinal o ritual.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» en las formas verbales plurales. Se preservan los títulos cosmológicos, las repeticiones, las restauraciones entre corchetes y las rupturas causadas por daños manuscritos. Borrador provisional basado en el testimonio inglés de dominio público suministrado; queda pendiente la revisión directa del copto de Nag Hammadi Codex III,4 y Berlin Codex 8502,3.
