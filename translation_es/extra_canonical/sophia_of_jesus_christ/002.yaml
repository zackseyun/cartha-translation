    »Él es eterno, sin nacimiento, porque todo el que ha nacido será destruido (en la muerte). No es engendrado, sin principio, porque todo el que tuvo un comienzo tendrá un final. Puesto que nadie gobierna sobre él, no tiene nombre, pues todo el que tiene nombre fue creado por alguien más. Y El Que Es posee una apariencia que le es propia, [a] distinta de todo cuanto ustedes han visto y comprendido. Sin embargo, es una apariencia enigmática que trasciende todas las cosas y supera al mundo. Mira en todas direcciones (simultáneamente) y se contempla a sí misma desde sí misma.


    »Por ser infinita, jamás puede ser comprendida.


    Es indestructible para siempre; nada se le asemeja.


