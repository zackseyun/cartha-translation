translation:
  language: es
  text: 'Mateo le dijo: «Señor, nadie puede descubrir la verdad sino por medio de ti; por eso, enséñanos la verdad».


    El Salvador dijo: «El Que Es no puede expresarse. Ningún poder lo conoció, ni autoridad alguna, ni nada contingente, ni cosa alguna creada desde la fundación del mundo hasta ahora; solamente él, y aquel a quien él quiera concederle una revelación por medio del que tuvo su origen en la Primera Luz. Desde este momento, yo soy el Gran Salvador. Esto se debe a que él es inmortal y eterno.


    »Él es eterno, sin nacimiento, porque todo el que ha nacido será destruido en la muerte. Es ingénito, sin principio, porque todo el que tuvo principio tendrá fin. Puesto que nadie gobierna sobre él, no tiene nombre, pues todo el que tiene nombre fue creado por otro. Y El Que Es posee una apariencia exclusivamente suya, [a] distinta de todo cuanto ustedes han visto y comprendido. Sin embargo, es una apariencia enigmática que trasciende todas las cosas y supera al mundo. Mira en todas direcciones a la vez y se contempla a sí mismo desde sí mismo.


    »Por ser infinito, jamás puede ser comprendido.


    Es indestructible para siempre; nada se le asemeja.


    Es el bien que nunca cambia.


    No tiene defecto.


    Es eterno.


    Es bienaventurado.


    No puede ser conocido, pero él se conoce a sí mismo.


    Está más allá de toda medida; no se puede seguir su rastro.


    Es perfecto, sin imperfección.


    Su bienaventuranza es indestructible.


    Es llamado “Padre del Mundo”».'
  philosophy: optimal-equivalence
