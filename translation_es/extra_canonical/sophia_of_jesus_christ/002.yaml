lexical_decisions:
- source_word: He Who Is
  choice: El Que Es
  rationale: Conserva el título ontológico y su carácter solemne, sin convertirlo en una explicación doctrinal.
- source_word: inexpressible
  choice: no puede expresarse
  rationale: Comunica de forma natural la imposibilidad de expresarlo plenamente y evita el menos común «inexpresable».
- source_word: nothing contingent
  choice: nada contingente
  rationale: Mantiene el término filosófico del testimonio, aunque su sentido preciso deberá verificarse en copto.
- source_word: unbegotten
  choice: ingénito
  rationale: Distingue la ausencia de generación de la frase paralela «sin nacimiento» y conserva la precisión conceptual.
- source_word: enigmatic appearance
  choice: apariencia enigmática
  rationale: Preserva tanto el lenguaje de apariencia como el carácter misterioso, sin resolver la tensión.
- source_word: cannot be traced out
  choice: no se puede seguir su rastro
  rationale: Expresa la imagen de lo inescrutable en español actual y digno.
- source_word: blessed
  choice: bienaventurado
  rationale: Conserva el registro religioso elevado y lo distingue de una mera idea de felicidad.
theological_decisions:
- issue: Referente de «he» en «he is deathless and eternal»
  choice: Mantener «él» sin identificar explícitamente al referente
  alternative: Sustituirlo por «El Que Es» o por «el Gran Salvador»
  rationale: El testimonio inglés permite una ambigüedad referencial; explicitarla impondría una interpretación teológica no asegurada.
- issue: Relación entre El Que Es y «el que tuvo su origen en la Primera Luz»
  choice: Conservarlos como referentes verbalmente distintos
  alternative: Identificarlos o explicar su relación
  rationale: El pasaje no define aquí esa relación; la traducción no debe añadir una jerarquía o identidad doctrinal.
- issue: Alternancia de género gramatical en la descripción de la apariencia infinita
  choice: Usar «apariencia» en femenino en la oración correspondiente y volver al referente personal masculino después
  alternative: Uniformar todo en masculino
  rationale: La alternancia refleja la sintaxis y la tensión del testimonio, donde «it» puede referirse a la apariencia y «he» a El Que Es.
- issue: Título «Father of the World»
  choice: Padre del Mundo
  alternative: Padre del universo
  rationale: La traducción literal preserva el título transmitido sin ampliar «mundo» a una cosmología específica.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se mantiene la estructura aforística y repetitiva de la sección final. Borrador provisional basado en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto de los códices de Nag Hammadi III,4 y Berlín 8502,3.
