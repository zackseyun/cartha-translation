  yaml_path: translation/extra_canonical/sophia_of_jesus_christ/010.yaml
  text: '“Behold! I have disclosed to you the name of the Perfect One, the entire will of the Mother of the holy angels, so that here the masculine [host] may be brought to completion, so that [in the aeons] there [could appear the infinities, as well as] those that [came into existence in the] unfathomable [riches of the Great] Invisible [Spirit, so that they] all [could partake in his benevolence], even the riches [of their repose] without any [kingdom over it].


    “I originated [from the first] sent one, that I could disclose to you He Who Is from the beginning, on account of the pride of the arch-begetter and his angels, because they boast about themselves, saying that they are gods. And I came to free them from their blindness, so that I could announce to everyone concerning the God who dwells above the world.


    [] “Tread, therefore, on their graves, shame their evil intention, break their yoke, and awaken my own. I have granted you authority over everything as the Sons of Light, so that with [your] feet you could tread on their power.”


    These are the matters [the] blessed Savior [spoke, and he vanished] from their midst. [All the disciples] were then in [great, unspeakable joy] in [the Spirit from] that day onward. [And his disciples] began preaching [the] divine Gospel of [the] eternal, indestructible [Spirit]. Amen.


    The Sophia of Jesus Christ'
translation:
  language: es
  text: '«¡Miren! Les he revelado el nombre del Perfecto y toda la voluntad de la Madre de los santos ángeles, para que aquí la [hueste] masculina[a] llegue a su plenitud; para que allí, [en los eones], [puedan manifestarse los infinitos, así como] quienes [llegaron a existir en] las [riquezas insondables del Gran] Espíritu Invisible; [para que] todos [participen de su bondad], incluso de las riquezas [de su reposo], sobre el cual no hay [reino alguno].


    »Yo procedí del [primer] enviado para revelarles a Aquel que Es desde el principio, a causa del orgullo del progenitor principal y de sus ángeles, pues se jactan de sí mismos y dicen que son dioses. Vine a liberarlos de su ceguera, para anunciar a todos acerca del Dios que habita por encima del mundo.


    »[...] Pisen, pues, sus sepulcros; avergüencen su mala intención, rompan su yugo y despierten a los míos. Les he dado autoridad sobre todas las cosas como Hijos de la Luz, para que con [sus] pies pisoteen su poder».


    Estas son las cosas que [el] bendito Salvador [dijo; luego desapareció] de en medio de ellos. [Todos los discípulos] quedaron entonces llenos de [un gozo grande e indescriptible] en [el Espíritu] desde aquel día. [Y sus discípulos] comenzaron a predicar [el] evangelio divino del [Espíritu] eterno e indestructible. Amén.


    La Sabiduría de Jesucristo'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Los corchetes dentro del texto señalan palabras restauradas o pasajes perdidos en los manuscritos; por eso algunas frases permanecen fragmentarias o inciertas.
    reason: El texto copto sobrevive con lagunas, y el borrador depende provisionalmente del testimonio inglés de dominio público mientras está pendiente la revisión directa del copto.
lexical_decisions:
- source_word: Perfect One
  choice: el Perfecto
  rationale: Conserva el título sustantivado y su función técnica sin ampliarlo doctrinalmente.
- source_word: aeons
  choice: eones
  rationale: Mantiene el término cosmológico técnico del escrito; «edades» no expresaría con claridad las realidades personificadas o espaciales aquí aludidas.
- source_word: masculine host
  choice: hueste masculina
  rationale: Preserva tanto la dimensión colectiva de «host» como la extraña especificación masculina, sin normalizar la cosmología del pasaje.
- source_word: Great Invisible Spirit
  choice: Gran Espíritu Invisible
  rationale: Traducción formal del título, con mayúsculas para señalar su uso propio en el tratado.
- source_word: He Who Is
  choice: Aquel que Es
  rationale: Mantiene el título ontológico y su tensión deliberada, sin sustituirlo por un nombre divino confesional.
- source_word: arch-begetter
  choice: progenitor principal
  rationale: Expresa la idea de un progenitor de rango rector sin identificarlo de manera interpretativa con otra figura ni introducir un tecnicismo oscuro.
- source_word: Sons of Light
  choice: Hijos de la Luz
  rationale: Conserva el título colectivo tradicional y su imaginería de identidad espiritual.
- source_word: Sophia
  choice: Sabiduría
  rationale: En el título se vierte el sustantivo griego por su sentido común en español, de acuerdo con el título tradicional inteligible «La Sabiduría de Jesucristo».
theological_decisions:
- issue: Identidad del «primer enviado»
  choice: «Yo procedí del [primer] enviado»
  alternative: «Yo soy el [primer] enviado»
  rationale: El testimonio proporcionado presenta una relación de procedencia, no una identificación directa; se conserva esa sintaxis aunque resulte teológicamente tensa.
- issue: Referente de «liberarlos de su ceguera»
  choice: Se conserva el pronombre «los» sin explicitar su referente
  alternative: Identificarlo con el progenitor principal y sus ángeles, o con todas las personas
  rationale: El antecedente es potencialmente ambiguo y no debe resolverse silenciosamente.
- issue: Naturaleza del dominio sobre el reposo
  choice: «sobre el cual no hay [reino alguno]»
  alternative: «que no está sometido a ningún reino»
  rationale: La formulación literal conserva la imagen cosmológica y la posible ambigüedad del referente.
- issue: Designación final del ser eterno
  choice: «[Espíritu] eterno e indestructible»
  alternative: «Padre eterno, indestructible para siempre»
  rationale: El alcance solicitado y la lectura conclusiva inicial del testimonio identifican aquí al Espíritu; se evita armonizarla con la conclusión duplicada posterior, que presenta una variante.
translation_notes:
  register: 'Español latinoamericano neutral, actual y digno. Se emplea «ustedes» implícito en las formas verbales y se conservan los títulos cosmológicos con mayúscula. Las repeticiones, imágenes inusuales y ambigüedades se mantienen cuando pertenecen al testimonio. Este borrador es provisional: se basa en el testimonio inglés público suministrado, pues la revisión directa de los códices coptos aún está pendiente.'
