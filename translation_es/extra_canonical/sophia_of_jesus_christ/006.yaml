    —Quiero que sepas que al Ser Humano Primordial se lo llama «el Progenitor» y «la Mente Autocompleta». Contempló junto con su compañera, la gran Sofía, y manifestó a su hijo primogénito y andrógino. Su nombre masculino es «Hijo Primogénito de Dios», mientras que su nombre femenino es «Sofía Primogénita, Madre del Universo»; algunos la llaman «Amor». El primogénito, llamado «Cristo», creó del Espíritu y de la Luz una multitud de innumerables [][b] ángeles para que sirvieran, pues ejerce una autoridad que procede de su Padre.


