translation:
  language: es
  text: 'Entonces Bartolomé le preguntó:


    —¿Cómo se lo llama [a] «el Ser Humano» y «el Hijo del Hombre» en el evangelio? Entonces, ¿cuál de ellos corresponde al Hijo?


    El Santo le respondió:


    —Quiero que sepan que al Ser Humano Primordial se lo llama «el Progenitor» y «la Mente Autocompleta». Contempló junto con su compañera, la gran Sofía, y manifestó a su hijo primogénito y andrógino. Su nombre masculino es «Hijo Primogénito de Dios», mientras que su nombre femenino es «Sofía Primogénita, Madre del Universo»; algunos la llaman «Amor». El primogénito, llamado «Cristo», creó del Espíritu y de la Luz una multitud de innumerables [b] ángeles para que sirvieran, porque ejerce la autoridad recibida de su Padre.


    Sus discípulos le dijeron:


    —Señor, revélanos lo referente al que llaman «el Ser Humano», para que también nosotros podamos comprender con precisión su gloria.


    El Salvador perfecto dijo:


    —¡Quien tenga oídos para oír, que oiga! Debido a que procede de la luz radiante, el Padre Primogenerador recibe el nombre de «Adán, el Ojo de Luz». Sus santos ángeles, inexpresables y sin sombra, se alegran sin cesar y con gozo por los reflejos que recibieron de su Padre. Todo el reino del Hijo del Hombre, llamado «el Hijo de Dios», está lleno de un gozo inexpresable y sin sombra, y de una alegría que nunca cambia: alegría por su indestructible [c] gloria, que hasta ahora no se había oído ni revelado en los eones ni en los mundos que surgieron después de ellos. Yo procedo de la Luz Infinita, autogenerada y primordial, para revelarles todas las cosas.'
