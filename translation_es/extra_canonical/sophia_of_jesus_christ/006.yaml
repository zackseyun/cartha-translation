  footnotes:
  - marker: a
    text: El testimonio de base señala aquí una restauración editorial y una laguna en el manuscrito; la redacción exacta es incierta.
    reason: Advertir al lector que la formulación de la pregunta depende de texto reconstruido o perdido.
  - marker: b
    text: Hay una laguna en el manuscrito después de «innumerables».
    reason: Conservar la señal de pérdida textual presente en el testimonio suministrado.
  - marker: c
    text: Hay una laguna en el manuscrito entre «indestructible» y «gloria».
    reason: Conservar la incertidumbre textual sin inventar el contenido ausente.
lexical_decisions:
- source_word: the Human / Son of Man
  choice: el Ser Humano / el Hijo del Hombre
  rationale: Se distingue el título antropológico general de la expresión tradicional «Hijo del Hombre», sin identificarlos más de lo que hace el pasaje.
- source_word: Primal Human
  choice: Ser Humano Primordial
  rationale: «Primordial» expresa anterioridad originaria; «Ser Humano» evita que «Hombre» se entienda exclusivamente como varón.
- source_word: the Begetter
  choice: el Progenitor
  rationale: Conserva la función generadora y el carácter titular con un término digno y comprensible.
- source_word: Self-Completed Mind
  choice: la Mente Autocompleta
  rationale: Mantiene la idea reflexiva de plenitud o consumación en sí misma sin añadir una explicación doctrinal.
- source_word: Great Sophia
  choice: la gran Sofía
  rationale: Se conserva Sofía como nombre técnico del personaje, en vez de reducirlo silenciosamente al sustantivo común «sabiduría».
- source_word: androgynous
  choice: andrógino
  rationale: Es el equivalente directo y preserva la tensión de los nombres masculino y femenino que siguen.
- source_word: first-begotten / First-Begetting
  choice: primogénito / Primogenerador
  rationale: Se distingue entre quien es engendrado primero y el título activo aplicado al Padre, aunque el testimonio inglés de base no permite asegurar todos los matices del copto.
- source_word: aeons
  choice: eones
  rationale: Se mantiene el término cosmológico técnico, habitual en español para estos textos antiguos.
- source_word: self-begotten
  choice: autogenerada
  rationale: Expresa origen desde sí misma y concuerda con «Luz», sin sustituirlo por fórmulas teológicas posteriores.
theological_decisions:
- issue: Identidad entre «el Ser Humano», «el Hijo del Hombre» y «el Hijo de Dios»
  choice: Conservar los títulos diferenciados y las relaciones tal como aparecen
  alternative: Armonizarlos como títulos inequívocamente idénticos de una sola figura
  rationale: La pregunta y la respuesta mantienen una tensión terminológica que no debe resolverse mediante armonización doctrinal.
- issue: Carácter masculino y femenino del hijo primogénito
  choice: Mantener «andrógino» y los dos nombres de género
  alternative: Espiritualizar o parafrasear la dualidad como mero simbolismo
  rationale: El pasaje afirma explícitamente ambos aspectos; interpretarlos excedería la traducción.
- issue: Procedencia de los ángeles «del Espíritu y de la Luz»
  choice: Vincular la frase con el acto de crear sin explicar su mecanismo
  alternative: Presentarlos como instrumentos, materia o agentes personales definidos
  rationale: El testimonio permite más de una relación semántica y no justifica imponer una cosmología más precisa.
- issue: La Luz Infinita «autogenerada y primordial»
  choice: Conservar ambos calificativos aplicados a la Luz
  alternative: Aplicarlos al hablante o reformularlos según una doctrina de generación específica
  rationale: La sintaxis del testimonio suministrado favorece su relación con «Luz», pero no debe desarrollarse más allá del texto.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se emplea «ustedes» en el discurso plural y se conservan como títulos las mayúsculas relevantes. La traducción es provisional porque se basa en el testimonio inglés público suministrado; queda pendiente la revisión directa del copto de los códices de Nag Hammadi III,4 y Berlín 8502,3.
