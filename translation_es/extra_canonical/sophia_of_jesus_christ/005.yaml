translation:
  language: es
  text: 'Mateo le preguntó:


    —Señor, Salvador, ¿cómo fue revelado el Humano?


    El Salvador perfecto dijo:


    —Deseo que conozcan al que apareció antes que el mundo.


    »En el principio, el Padre infinito, surgido de sí mismo, [a] hecho por sí mismo, estaba colmado de una luz radiante e inexpresable. Cuando quiso que su semejanza llegara a ser un gran poder, el principio originador de aquella luz apareció de repente como el Humano andrógino e inmortal, para que por medio de ese Humano inmortal ellos pudieran alcanzar su salvación y despertar del olvido mediante el enviado como intérprete, quien habita con ustedes hasta el fin de los ladrones empobrecidos. Su consorte es la gran Sabiduría, quien, en él, fue destinada desde el principio a la unión por el Padre autogenerado, a partir del Humano inmortal que fue el primero en aparecer, como divinidad y reino, pues esto fue revelado por el Padre, [b] llamado «el Humano» y «el Padre de sí mismo». Para manifestar su propia majestad, creó un eón poderoso llamado Ogdóada, al que se le concedió gran autoridad, incluso para gobernar sobre la creación empobrecida.


    »De aquella luz y del Espíritu masculino triple, que pertenece a Sabiduría, su consorte, creó dioses, ángeles y arcángeles: incontables miríadas para el servicio. Esto fue así porque este Dios creó divinidad y reino, de modo que fue llamado «Dios de dioses» y «Rey de reyes». En él, el Humano primordial posee su mente y su pensamiento propios, que son precisamente pensamiento, reflexión y contemplación, razón, [c] y poder. Todas las cualidades existentes son perfectas e inmortales.


    »En cuanto a la incorruptibilidad, en verdad son iguales; pero en cuanto al poder, hay una diferencia semejante a la que existe entre padre e hijo, entre hijo y pensamiento, y entre el pensamiento y lo que queda después. Como dije antes, entre las entidades creadas, la mónada ocupa el primer lugar. Y después de todo lo demás, cuanto apareció fue revelado por su poder. De las entidades creadas surgió todo lo elaborado; de lo elaborado surgió lo formado, y de lo formado surgió lo nombrado. Así surgió, de principio a fin, la diferencia entre los no engendrados.'
