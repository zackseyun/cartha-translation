review_pass:
  verdict: revise
  source_fidelity: La versión sigue en general el testimonio inglés suministrado y conserva prudentemente varias ambigüedades. Sin embargo, sustituye indebidamente «Sophia» por «Sabiduría», explicita con «Para manifestar» una finalidad ausente en «for his own majesty», y elimina las señales editoriales <and> y <and son>. También reemplaza las lagunas [] del testimonio por referencias [a], [b] y [c], por lo que ya no se ve la señal textual que las notas pretenden documentar. El cotejo directo con el copto sigue pendiente.
  naturalness: El español es mayormente claro, actual y de registro digno. Se mejora la fluidez de algunos encadenamientos sin resolver las relaciones sintácticas y teológicas que el testimonio deja difíciles. «Para su propia majestad» es más fiel que «Para manifestar su propia majestad», y «Sofía» resulta natural como nombre propio personificado.
  terminology: Se mantienen «Humano», «eón», «Ogdóada», «mónada», «andrógino» y «no engendrados» como términos o títulos técnicos. «Sophia» debe representarse como «Sofía», no traducirse como «Sabiduría», dado que el testimonio la presenta como nombre propio y emplea la forma Sophia. Se preservan las distinciones del testimonio entre surgido de sí mismo, hecho por sí mismo y autogenerado.
  issues:
  - severity: medium
    issue: «Sophia» se tradujo como «Sabiduría».
    rationale: El testimonio inglés conserva Sophia como nombre propio, mientras que el borrador la convierte en un sustantivo común personificado. «Sofía» conserva el nombre, evita una interpretación léxica no indicada por el testimonio y mantiene la designación técnica.
  - severity: medium
    issue: Las lagunas [] se sustituyeron por [a], [b] y [c].
    rationale: Los corchetes vacíos son una señal editorial de texto perdido; las letras de nota no deben ocupar su lugar. Se debe conservar [] y asociar cada nota mediante un ancla separada.
  - severity: medium
    issue: Se suprimieron las restauraciones editoriales marcadas con ángulos.
    rationale: El testimonio distingue <and> y <and son> como restauraciones. Deben mantenerse como <y> y <e hijo>, sin presentarlas como texto indiscutido.
  - severity: low
    issue: «Para manifestar su propia majestad» agrega una finalidad interpretativa.
    rationale: «For his own majesty» se vierte de forma más directa y ambigua como «Para su propia majestad».
  - severity: low
    issue: La nota editorial afirma que las restauraciones seguras se integran sin conservar su marca.
    rationale: En este pasaje el testimonio suministrado sí marca restauraciones con ángulos; la nota debe reflejar que se preservan.
