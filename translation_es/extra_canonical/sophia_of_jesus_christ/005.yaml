lexical_decisions:
- source_word: Human
  choice: Humano
  rationale: Se conserva como título cosmológico y se escribe con mayúscula para distinguirlo de una referencia genérica a la humanidad o a un varón.
- source_word: Sophia
  choice: Sabiduría
  rationale: Se traduce el nombre transparente por su equivalente español, con mayúscula por su función personificada; evita tratarlo como un nombre opaco.
- source_word: aeon
  choice: eón
  rationale: Término técnico asentado en español para una realidad o dominio supramundano; «edad» perdería aquí su sentido cosmológico.
- source_word: Ogdoad
  choice: Ogdóada
  rationale: Forma técnica española que conserva la designación de una entidad asociada al número ocho.
- source_word: self-grown / self-made / self-begotten
  choice: surgido de sí mismo / hecho por sí mismo / autogenerado
  rationale: Se mantienen las distintas expresiones del testimonio en vez de uniformarlas, pues pueden representar matices deliberados o incertidumbre textual.
- source_word: androgynous
  choice: andrógino
  rationale: Traducción directa que conserva la tensión antropológica y cosmológica del pasaje sin explicarla doctrinalmente.
- source_word: deathless / immortal
  choice: inmortal
  rationale: En español natural ambas expresiones convergen aquí en «inmortal»; el contexto presenta la ausencia de muerte como cualidad ontológica.
- source_word: monad
  choice: mónada
  rationale: Se retiene el término filosófico técnico, ya incorporado al español, en vez de resolverlo interpretativamente como «unidad».
- source_word: unbegotten ones
  choice: los no engendrados
  rationale: Versión formal que preserva la aparente tensión con la mención inmediata de entidades creadas.
theological_decisions:
- issue: Identidad y género del Humano primordial
  choice: «el Humano andrógino e inmortal»
  alternative: «el ser humano inmortal, varón y mujer»
  rationale: La formulación elegida conserva el carácter titular y el término técnico del testimonio sin convertirlo en una explicación binaria más definida que la fuente.
- issue: Relación entre el Humano inmortal, Sabiduría y el Padre
  choice: Se mantiene la sintaxis densa y parcialmente ambigua
  alternative: Reordenar la oración para asignar con certeza cada acción y título a una figura específica
  rationale: El testimonio suministrado es sintácticamente difícil y la revisión copta está pendiente; no se debe imponer una identificación teológica definitiva.
- issue: Plural de quienes reciben salvación
  choice: «ellos pudieran alcanzar su salvación»
  alternative: Identificar explícitamente a los seres humanos, poderes o descendientes
  rationale: El antecedente no es seguro en el testimonio; se conserva la ambigüedad referencial.
- issue: «Dios de dioses» y creación de dioses
  choice: Se traduce literalmente
  alternative: Atenuar «dioses» como «seres divinos»
  rationale: El lenguaje jerárquico del pasaje es explícito y no debe armonizarse con una teología posterior.
- issue: Igualdad en incorruptibilidad y diferencia en poder
  choice: Se conserva la afirmación paradójica sin explicación
  alternative: Definir una jerarquía ontológica sistemática
  rationale: El texto distingue cualidad y poder, pero no ofrece aquí una doctrina plenamente desarrollada.
- issue: Los «no engendrados» al final
  choice: Se conserva «los no engendrados» pese al contexto de creación
  alternative: Corregir a «los engendrados» o «los seres generados»
  rationale: La tensión puede reflejar el testimonio, una tradición textual compleja o un problema de traducción; sin cotejo copto no conviene enmendarla.
translation_notes:
  register: Español latinoamericano neutral, actual y digno. Se usan títulos con mayúscula cuando funcionan como nombres cosmológicos. Se conservan términos técnicos indispensables («eón», «Ogdóada», «mónada») y se evitan paráfrasis confesionales. Borrador provisional basado en el testimonio público inglés suministrado; queda pendiente el cotejo directo de los manuscritos coptos. Las restauraciones editoriales seguras del testimonio se integran en español natural, mientras que las lagunas se marcan mediante notas.
