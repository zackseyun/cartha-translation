source:
  text: |-
    For I am persuaded that ye are well trained in the sacred writings, and nothing is hidden from you. But to myself this is not granted. Only, as it is said in these scriptures, Be ye angry and sin not, and Let not the sun set on your wrath. Blessed is he that remembereth this; and I trust that this is in you.

    Now may the God and Father of our Lord Jesus Christ, and the eternal High-priest Himself the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long suffering and in patient endurance and in purity; and may He grant unto you a lot and portion among His saints, and to us with you, and to all that are under heaven, who shall believe on our Lord and God Jesus Christ and on His Father that raised him from the dead.

    Pray for all the saints. Pray also for kings and powers and princes and for them that persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all men, that ye may be perfect in Him.
