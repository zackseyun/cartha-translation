  english_witness: 'And the presbyters also must be compassionate, merciful towards all men, turning back the sheep that are gone astray, visiting all the infirm, not neglecting a widow or an orphan or a poor man: but providing always for that which is honorable in the sight of God and of men, abstaining from all anger, respect of persons, unrighteous judgment, being far from all love of money, not quick to believe anything against any man, not hasty in judgment, knowing that we all are debtors of sin.


    If then we entreat the Lord that He would forgive us, we also ought to forgive: for we are before the eyes of our Lord and God, and we must all stand at the judgment-seat of Christ, and each man must give an account of himself.


    Let us therefore so serve Him with fear and all reverence, as He himself gave commandment and the Apostles who preached the Gospel to us and the prophets who proclaimed beforehand the coming of our Lord; being zealous as touching that which is good, abstaining from offenses and from the false brethren and from them that bear the name of the Lord in hypocrisy, who lead foolish men astray.'
translation:
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
