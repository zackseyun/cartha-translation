  english_witness: 'I write these things to you by Crescens, whom I commended to you recently and now commend unto you: for he hath walked blamelessly with us; and I believe also with you in like manner. But ye shall have his sister commended, when she shall come to you. Fare ye well in the Lord Jesus Christ in grace, ye and all yours. Amen.'
translation:
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
