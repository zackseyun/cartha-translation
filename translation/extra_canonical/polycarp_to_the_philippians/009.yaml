  english_witness: 'Let us therefore without ceasing hold fast by our hope and by the earnest of our righteousness, which is Jesus Christ who took up our sins in His own body upon the tree, who did no sin, neither was guile found in His mouth, but for our sakes He endured all things, that we might live in Him.


    Let us therefore become imitators of His endurance; and if we should suffer for His name''s sake, let us glorify Him. For He gave this example to us in His own person, and we believed this.'
translation:
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
