  english_witness: 'I rejoiced with you greatly in our Lord Jesus Christ, for that ye received the followers of the true Love and escorted them on their way, as befitted you--those men encircled in saintly bonds which are the diadems of them that be truly chosen of God and our Lord;


    and that the steadfast root of your faith which was famed from primitive times abideth until now and beareth fruit unto our Lord Jesus Christ, who endured to face even death for our sins, whom God raised, having loosed the pangs of Hades; on whom,


    though ye saw Him not, ye believe with joy unutterable and full of glory; unto which joy many desire to enter in; forasmuch as ye know that it is by grace ye are saved, not of works, but by the will of God through Jesus Christ.'
translation:
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
