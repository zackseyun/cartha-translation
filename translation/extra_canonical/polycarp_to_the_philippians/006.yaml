  english_witness: 'Knowing then that God is not mocked, we ought to walk worthily of His commandment and His glory.


    In like manner deacons should be blameless in the presence of His righteousness, as deacons of God and Christ and not of men; not calumniators, not double-tongued, not lovers of money, temperate in all things, compassionate, diligent, walking according to the truth of the Lord who became a minister (deacon) of all. For if we be well pleasing unto Him in this present world, we shall receive the future world also, according as He promised us to raise us from the dead, and that if we conduct ourselves worthily of Him we shall also reign with Him, if indeed we have faith.


    In like manner also the younger men must be blameless in all things, caring for purity before everything and curbing themselves from every evil. For it is a good thing to refrain from lusts in the world, for every lust warreth against the Spirit, and neither whoremongers nor effeminate persons nor defilers of themselves with men shall inherit the kingdom of God, neither they that do untoward things. Wherefore it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk in a blameless and pure conscience.'
translation:
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
