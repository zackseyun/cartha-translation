  english_witness: 'Wherefore gird up your loins and serve God in fear and truth, forsaking the vain and empty talking and the error of the many, for that ye have believed on Him that raised our Lord Jesus Christ from the dead and gave unto him glory and a throne on His right hand; unto whom all things were made subject that are in heaven and that are on the earth; to whom every creature that hath breath doeth service; who cometh as judge of quick and dead; whose blood God will require of them that are disobedient unto Him.


    Now He that raised Him from the dead will raise us also; if we do His will and walk in His commandments and love the things which He loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, false witness; not rendering evil for evil or railing for railing or blow for blow or cursing for cursing;


    but remembering the words which the Lord spake, as He taught; Judge not that ye be not judged. Forgive, and it shall be forgiven to you. Have mercy that ye may receive mercy. With what measure ye mete, it shall be measured to you again; and again Blessed are the poor and they that are persecuted for righteousness'' sake, for theirs is the kingdom of God.'
translation:
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
