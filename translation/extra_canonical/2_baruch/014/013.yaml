  to: Therefore they leave this world without fear, and with trust and gladness they
    wait to receive the world that you promised them …
  rationale: Replaced the awkward phrase “trustingly, with gladness” with the more
    natural and unambiguous “with trust and gladness,” and removed unnecessary commas.
