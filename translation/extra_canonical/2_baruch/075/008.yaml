source:
  text: |-
    # Source page p0180 (printed 162)
    ܠܘܩܕܡ ܕܬܬܝܕܥ ܕܐܢܬܘܢ.
    ܒܫܘܠܡܗ̇ ܡܢ ܟܠܗ̇ ܗܠܝܢ
    ܐܫܬܪܝ. ܘܗܐ ܗܝ
    ܡܬܬܝܕܥܐ ܡܢ ܟܠܗ̇ ܕܐܝܟ
    ܬܪ̈ܬܝܢ ܕܐܬܝܕܥ
    ܠܟ ܡܢ ܩܕܝܡ. ܟܕ
    ܀ ܢܫܬܠܡܘܢ ܥܡܡ̈ܐ. v. 6.
    ܘܐܢܬ ܙܒܢܐ ܕܡܫܝܚܐ.
    ܘܗܘܐ ܒܒܥܘܗܝ ܒܡܕܒܪܐ.
    ܘܡܢܗܘܢ ܢܚܬܘ ܡܠܐܟܘܗܝ
    ܢܫܬܘܠܡ. ܘܠܝܬ ܗܘܝܐ
    ܕܐܝܟ ܗܠܝܢ ܒܡܕܒܪܐ ܐܚܪܝܢ
    ܕܬܬܝܕܥ ܕܚܝܠ ܡܠܬܗ.
    ܡܠܐ ܒܡܕܐ ܕܠܐ ܝܕܥ
    ܠܐܣܝܪ̈ܐ. ܘܕܠܐ ܕܫܢ
    ܠܙܐܒܗ ܕܝܥܩܘܒ ܐܘܪܗ
    ܕܚܙܘ. ܘܗܕܐ ܡܛܠ
    ܕܢܬܬܒܥܘܢ ܡܢ ܟܘܠ
    ܒܩ̈ܒܝ ܓܒܪ̈ܝ. ܟܘܠ
    ܐܝܠܝܢ ܕܝܢ ܕܐܬܓܠܝܘ
    ܒܠܝܒܗ ܐܘ ܕܝܕܥܘܗܝ.
    ܘܠܝܬ ܒܗܘܘܢ ܓܢܝܙܘܬܐ
    73..ܢܫܬܠܡܘܢ ܝܘܡܝܗܘܿܢ ܡܢ
    ܟܐܒܐ ܕܡܡܘܬ ܠܥܡܠܐ
    ܕܐܝܬ ܒܥܠܡܐ. ܡܢܟܝ
    ܒܡܥܒܪܐ ܠܥܠܡ ܢܠܐ ܬܪܘܗܝ
    ܕܡܥܡܘܬܐ. ܘܢ̇ܚܬ ܛܠܐ
    ܒܒܘܣܡܐ ܘܢܚܐ
    ܢܬܚܙܐ. ܘܢܗ̇ܚܬܘ ܣܡܟܐ
    ܬܘܒ ܢܝܚܐ ܒܫܠܝܐ.
    ܘܡܘܪܢܐ ܢܬܬܢܝܚ.
    ܘܕܘܝܐ ܘܟܘܪܗܢܐ
    ܘܐܢܚ̈ܬܐ ܢܥܪܩܘܢ ܡܢ
    ܒܢܝܢܫ̈ܐ. ܘܬܗܘܐ ܚܕܘܬܐ
    ܒܟܠܗ̇ ܐܪܥܐ. ܘܬܘܒ ܠܐ
    ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ. ܘܠܐ
    ܡܕܡ ܡܥܝܩ ܢܓܕܫ ܣܡܡܠܐ
    ܡܕܡ. ܘܕ̈ܝܢܐ ܘܡܕ̈ܝܢܝܘܬܐ
    ܘܚܪ̈ܝܢܐ ܘܬܒ̈ܥܬܐ
    ܘܕܡܐ ܘ̈ ܪ̈ܓܝܓܬܐ ܘܚܣܡܐ
    ܘܣܢܐܬܐ. ܘܟܠ ܐܝܠܝܢ
    ܕܕ̈ܡܝܢ ܕܟ̈ܝܢ. ܠܚܘܝܒܐ
    ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ. ܗ̈ܢܝܢ
    ܐ̈ܢܝܢ ܓܝܪ ܘܐܝܠ

    # Source page p0179 (printed 163)
    ܡܥܒܪ ܡܥܝܢܘܗܝ ܒܚ̈ܛܗܐ.
    ܡܛܠ ܗܠܝܢ ܝܬܝܪܐܝܬ
    ܚܫܝܒ ܗܘܐ ܒܗܘܦܟܗܘܢ
    ܕܒܢܝܢܫܐ ܘܢܕ̈ܝܐܝܢ ܚܘ̈ܒܐ
    ܡܢ ܒܥܕܐ ܘܢܩ̈ܦܝܢ ܠܒܢ̈ܝ
    ܐܢܫܐ. ܘܐܣܦܝܩ ܘܕ̈ܡܘܥܐ
    ܢܦܩܝܢ ܡܢ ܢܩ̈ܒܝܗܘܢ
    ܐܝܟ ܕܢܬܬܒܥܘܢ ܥܡܠܘܗ݈ܝ.
    ܘ̈ܢܫܐ ܗܢܝܢ ܗܘܝ
    ܠܐ ܢܗܘܐ ܠܗܝܢ ܟܐܒܐ
    ܡܕܡ ܕܝ̈ܠܕܢ. ܘܠܐ ܢܫܬܢܩܢ
    ܡܕܡ ܕܝ̈ܗܒܢ ܦܐܪ̈ܐ
    ܕܡܪܒܥܐ ܝܗ݈ܝܒ ܗܘܐ
    ܒܗܘܢ ܝܘܩ̈ܪܐ. ܠܐ
    ܢܠܕܢ ܚܝܘ̈ܬܐ. ܘܠܐ
    ܢܒܣܡܘܢ ܐܝܠܝܢ ܕܒܢܝܢ. ܡܢ
    ܢܦܩܘܗܝ ܓܝܪ ܢܘ̈ܦܚܝ
    ܪ̈ܘܚܝܢ ܒܒ̈ܢܝܐ. ܥܡ
    ܐܝܠܝܢ ܕܒܥܝܕܝܢ ܠܗܝܢ
    ܒܢܝܢܐ ܣܓܝܐܐ. ܡܣܘܟܐ
    ܕܙܒܢܐ ܗ̇ܘ ܝܘܡܢܝܐ ܗܘ
    ܕܫܪܝܪ ܕܡܬܚܒܠܐ. ܘܢܫܐ
    ܕܫܪܝܪ ܕܠܐ ܡܬܚܒܠܐ.
    ܡܛܠ ܗܢܐ ܗܠܝܢ ܕܡ̈ܩܕܡܢ
    ܙܒܢܝܢ ܒܗ ܗ̈ܘܝ.
    ܡܛܠ ܗܢܐ ܪܚܝܩ ܗܘ
    ܟܠ ܥܢܝܢܐ. ܘܩܪܝܒ ܗܘ
    ܙܢܝܢ ܫ̈ܒܥܐ ܢܘܗܪܐ
    ܐܚܪܢܐ ܕܐܬܘ ܡܢ ܟܐܬ
    ܩ̈ܕܡܝܐ ܘܩ̈ܨܝܐ ܐܚܪ̈ܢܝܬܐ.
    ܘܠܝܬ ܐܘܪܚܐ. ܡܕܡ
    ܕܐܬܝܕܥ ܡܪܝܐ ܒܥܘܩܒܪܗ.
    ܠܐ ܓܝܪ ܡܬܕܪܟܐ. ܐܘ
    ܡܕܡ ܕܒܨܐ ܪ̈ܥܝܢܝ ܐܢܫܐ
    ܕܠܐ ܡܣܬܝܟܝܢ. ܐܘ ܡܕܡ
    ܕܨ̇ܐܪ ܣܘܟܠܐ ܕܥܝܪ̈ܐ. ܐܘ
    ܡܕܡ ܡ̣ܕܐ ܕܢܘܪܐ
    ܡܚ̈ܫܒܬܐ ܘܡ̇ܕܒܪ. ܐܘ
    ܡܕܡ ܡܢ ܥܒ̈ܕܐ ܢܦܘܨ
    ܕܐܐܪ ܒܘܚܢܝܢ. ܐܠܐ
    ܠܢ ܗܘ̇ ܕܐܝܬ ܡܬܬܚܡܐ
    ܐܢܬ ܘܡܚܘܝ ܐܢܬ
    ܒܥܒ̈ܕܝܘܗܝ. ܡܛܠ ܕܐܢ
    ܡܬܬܚܡܘܢ ܠܐ ܡܬܬܚܡ
    ܐܢܬ ܠܐ ܒܚ̈ܝܘܗܝ ܐܢܫܝܢ
    ܕܐܝܠܝܢ ܕܡܢܝܢ ܠܐ ܡܫܟܚܝܢ
    ܕܢܣܩܘܢ ܒܘܚܢܝܢ. ܐܠܐ
    ܐܢܫܝܢ ܕܡܟܝܢ ܡܚܫ̈ܒܬܐ
    ܡܫܟܚܝܢ ܕܢܬܪܨܘܢ. ܚܢܢ
    ܕܝܢ ܐܢܫܝܢ
