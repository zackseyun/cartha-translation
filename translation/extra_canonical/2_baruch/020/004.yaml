  text: |-
    # Source page p0218 (printed 124)
    ܐܢܫ ܕܝܢ ܐܠܘ ܠܐ
    ܩܪܒ ܢܡܘܣܐ. ܘܐܠܘ ܠܐ
    ܐܬܝܕܥܬ ܚܟܡܬܐ.
    ܗܘܝܐ ܕܝܢ ܡܛܠ ܕܡ̣ܢ
    ܚܕܐ ܟܪܣܐ ܢܦܩܢ ܗܘܝ
    ܐܦ ܡ̣ܢ ܚܕܐ ܢܫܬܘܝܢ.
    ܘܐܠܘ ܐܝܩܪܐ ܕܐܒܗ̈ܝܐ
    ܡܥܕܪ ܗܘܐ ܕܡܬܕܒܪܝܢ
    ܐܝܟ ܗܢܘܢ ܟܐܢܘܬܐ.
    ܐܠܐ ܐܦ ܗ̇ܘ ܬܘܒ
    ܕܥܒܕ ܡܬܕܒܪ. ܗܘܝ
    ܕܝܢ ܟܐܢܘܬܐ ܐܬܢܣܒܬ
    ܠܗܘܢ ܐܝܟܘܢ ܘܟܡܝܠܐ.
    ܒܐܘܪܚܐ ܣܓܝܐܬܐ.
    ܘܗ̇ܘ ܙܒܢܐ ܕܥܒܕ
    .. ܡܟܝܠܐ ܒܬܘܒܘܬܐ ܙܒܢܐ ܐܝܬܘܗܝ.
    16 ܘܒܢܝ̈ܐ ܘܐܒܗ̈ܝܐ. ܡܪܝܐ
    ܡܢܝܗܝ ܐܘ ܫ̈ܢܝܗܝ ܕܗܘܝ
    ܙܒܘ̈ܢܝ ܘܫ̈ܢܝܗܝ. ܘܡ̣ܢܘ
    ܡܫܟܚ ܕܢܗܘܐ ܡܟܝܠܐ
    ܢܝܚܐ ܗ̇ܘ ܕܥܬܝܕ ܠܗ
    17 .. ܡܫܘܚܬܐ. ܡ̣ܢ ܘ ܡܕܡ
    .v. c ܀ ܡܪܝܐ ܘܐܡܪ ܠܝ. ܠ
    ܬܫܒܘܚܬܐ ܘܬܘܕܝܬܐ
    ܚܢܢ. ܘܒܟܢ ܐܠܐ ܡܕܡ
    ܕܐܦܩܟ. ܠܐ ܡܟܝܠ ܢܗܘܐ
    ܠܗ ܣܘܪܚܢܐ ܕܙܒܢܐ
    ܕܚܕܘ ܐܠܐ ܐܬܝܬܝ
    ܡܘܬܪܐ. ܘܡܛܠ ܚܢܢ
    ܕܐܒܗܝ ܕܐܬܝܠܕܘ. ܡܢܗܘ.
    ܐܘ ܡܢܝ ܐܬܢܒܝ
    ܡܘܫܐ ܕܡܐ ܡܒܣܪܝܢ
    ܫ̈ܢܝܟ ܚܙܝ ܒܥܝܢܝܟ. ܘܡܛܠ
    ܕܐܬܝܗܒܬ ܠܡܘܬ
    ܕܠܥܠܡ ܐܝܬܝ ܢܣܘܒܘܬ
    ܒܪܢܫܐ ܕܒܣܘܪ. ܘܐܢܬܘܢ
    .. ܡܢܝ ܠܥܠܡ ܕܐܣܪܝܠ.܀
    18 ܘܥܢܝܬ ܘܐܡܪܬ. ܗܘܘ ܗܘ
    ܕܐܢܬ ܢܣܒܬ ܡܢ
    ܢܘܗܪܐ. ܘܫܠܝܛܐ ܐܢܬܝ
    ܕܬܕܥܝܘ ܒܗ. ܗܢܘܢ
    ܕܝܢ ܣܓܝ̈ܐܐ ܕܐܝܬ
    ܠܗܘܢ ܢܣܒܘ ܡܢ ܚܫܘܟܐ
    ܕܐܕܡ. ܘܠܐ ܐܬܒܣܣܘ
    19..ܒܢܘܗܪܐ ܕܡܘܫܐ.܀. ܘܥܢܐ
    ܘܐܡܪ ܠܝ. ܡܛܠ ܗܢܐ
    ܒܗܘ ܙܒܢܐ ܐܡܝܪ

    # Source page p0217 (printed 125)
    ܗܘܘ ܫܡܝܐ ܘܐܪܥܐ܀
    ܬܘܒ ܗܘܘ ܓܝܪ ܕܙܒܢܐ
    ܠܥܠܡ. ܗܘ ܫܡܝܐ ܕܝܢ
    ܕܐܬܒܪܝܘ ܗܘܘ ܒܟܠ
    ܙܒܢ. ܗܢܘܢ ܕܝܢ ܡܢ ܒܬܪ
    ܠܗܘܘ ܪܘܚ ܣܦܝܩ
    ܘܚܫܘܟܐ. ܟܕ ܝܿܕܥܝܢ ܕܐܝܬ
    ܠܗܘܢ ܢܘܗܪܐ ܡܒܣܡܐ܀
    ܘܐܘܣܝܐ ܗܘ ܕܠܐ
    ܡܬܚܙܐ ܗܘܘ ܕܢܥܒܕ
    ܒܗ ܡܕܡ. ܐܘ ܡܘܬܐ
    ܡܿܝܬܐ. ܘܠܐ ܚܝܐ
    ܒܠܐ ܐܝܬ ܕܐܢ ܐܝܬ.
    ܐܢ ܕܝܢ ܠܐ ܬܬܚܫܒ
    ܒܢܦܫܟ ܐܠܐ ܗܠܝܢ. ܘܠܐ
    ܬܬܡܠܠ ܐܠܐ ܐܝܠܝܢ
    ܕܫܡܥܬ. ܛܘܒ ܫܡܥܬܘܢ
    ܗܘ ܓܝܪ ܕܙܒܢܐ ܠܘ
    ܕܡ̈ܠܟܐ ܠܘ ܕܡܕܒܪܢܘܬܐ.
    ܠܘ ܕܥܒܕܐ ܡܬܝܕܥܐ
    ܘܠܐ ܫܘܒܚܐ. ܡܛܠ ܕܐܢ
    ܗܘܘ ܒܥܠܡܐ ܡܕܡ ܚܕܬ
    ܘܬܘܒ ܡܬܚܒܠܘܬܗܘܢ
    ܬܬܝܕܥ. ܥܕܡܐ ܠܙܒܢܐ
    ܕܡܕܒܪܢܘܬܐ ܕܗܘܘ ܠ
    ܡܬܚܫܒܝܢ. ܠܐ ܡܬܬܕܢܝܢ
    ܗܘܘ ܡܢܗܘܢ. ܘܬܘܒ
    ܡܛܠܬܝ ܡܠܟܘ ܙܒܢܐ ܗܢܐ
    ܐܝܟ ܝܘܡܐ ܕܬܢܓܪܐ ܡܣܘܬܐ
    ܕܠܐ ܐܝܬܝܗܝ ܕܒܥܪܝܗܝ ܒܗ
    ܡܘܠܕ ܙܒܢܐ. ܐܢܬ ܒܘܝܐ
    ܢܦܫܟ ܡܕܡ ٠٠٠/ܘܗܘ
    ܒܚܪܬܐ ܡܬܚܒܠܐ ܗܘܐ
    ܠܡܕܡ ܕܗܘܐ. ܗܘܐ ܗܘܐ
    ܠܡܕܡ ܕ٠٠٠܀٠٠٠ ܡܛܠ ܗܢܐ
    ܠܐ ܚܫ̈ܒܐ ܬܪ̈ܝܢ.
    ܕܡܬܬܙܝܥܝܢ ܙܒ̈ܢܐ ܬܪܝܢ
    ܡܢ ܩܕܡܝܐ. ܘܢܕܘܫܘܢ
    ܒ̈ܢܝܐ ܬܪܝܢ ܕܠܐ ܐܝܬܝܗܝܢ
    ܒܥܒܕܗ. ܘܢܥܒܪܘܢ ܫܢܝ̈ܐ
    ܡܒܛܠܢܝܬܐ. ܬܪܝܢ ܕܠܐ ܗ̈ܘܝ
    ܕܢܩܘܡܘܢ. ܡܛܠ ܗܢܐ ܗܢܐ
    ܕܢܣܬܝܟ ܟܪܝܘܗܝ.
    ܕܬܬܗܦܟ ܬܢܚܬܗ
    ܘܬܣܒܥ ܟܒܘܬܐ. ܒܙܒܢܗ.
    ܘܗܘ ܡܘܠܕܐ ܐܢܬ ܕܒܥܒܕ
    ܡܥܡܕܢܝܐ. ܡܣܟܝܢ ܠܐ
    ܠ
