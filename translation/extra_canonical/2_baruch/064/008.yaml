  rationale: The Syriac idiom 'l-shāʿthā' means 'for the moment,' 'temporarily,' or
    'at that time.' Translating it as 'concerning the hour' misses the idiomatic meaning,
    which in this context contrasts Manasseh's temporary earthly deliverance (the
    melting of the bronze horse) with his ultimate eternal fate.
