    ܕܐܚܝܗܘܢ. ܡܛܠ ܗܢܐ
    ܡܝܬܝ ܐܢܐ ܒܝܫܬܐ ܥܠ
    ܡܕܝܢܬܐ ܗܕܐ ܘܥܠ
    ܥܡܘܪ̈ܝܗ̇. ܘܬܬܝܗܒ ܡܢ
    ܩܕܡܝ ܠܙܒܢܐ. ܘܒܥܡܡ̈ܐ
    ܐܙܪܥܘ ܐܢܘܢ ܠܡܘ
    ܚܝܒܘ. ܡܟܝܠ ܕܝ
    ܕܐܡܪ ܠܐܢܫܝܢ ܡܛܠ
    ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ.
    ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
    ܗܕܐ ܡܕܝܢܬܐ. ܡܛܠ
    ܕܒ̈ܝܫܬܗ̇ ܕܐܝܕܝܗ̇
    ܠܗܕܐ ܡܕܝܢܬܐ ܐܝܟ
    ܥܡܗܕܐ ܡܪܝܪܐ. ܘܨܥܪܘܗܝ
    .. ܐܝܟ ܫܘܕܐ ܚܠܝܬܐ ܀ ܘ.
    3 ܘܐܡܪܬ ܐܘ ܡܪܝܐ
    ܡܪܝܐ. ܠܗܕܐ ܐܢܬ
    ܠܡܥܒܕ ܕܐܢܐ ܒܥܝܬܗ̇
    ܕܐܡ̣ܪ. ܠܐ ܡܪܝܐ. ܠܝ
    : ܐܫܬܘ ܪ̈ܚܡܝܟ ܡ̈ܒܝܢܝܢ.
    ܣܒ ܠܘܬܟ ܪܘܚܝ
    ܕܐܙܠ ܠܝ ܠܘܬ ܐܒ̈ܗܝ.
    ܘܠܐ ܐܚܙܐ ܒܚܪܒܗ̇
    ܕܐܡܝ. ܡܛܠ ܕܐ̈ܡܘܬܝ
    ܐܠܝܢ ܥܡ ܣܓܝܐ. ܕܐܡܘܬ
    ܥܡ ܟܢܘܫܬܝ. ܠܐ ܡܫܟܚ
    ܐܢܐ. ܐܠܐ ܐܦ ܠܐ
    ܕܐܚܙܐ ܒܒܝܫܬܗ̇ ܕܐܡܝ
    ܡܫܟܚܢܐ ܢܦܫܝ. ܚܕܐ ܕܝܢ
    ܐܡܪ ܐܢܐ ܩܕܡܝܟ
    ܡܪܝܐ. ܡܢܐ ܗܟܝܠ
    ܗܘ̇ܐ ܡܢ ܒܬܪ ܗܠܝܢ.
    ܀ ܐܢ ܓܝܪ ܬܘܒܕ ܐܢܬ
    ܡܕܝܢܬܟ. ܘܬܫܠܡ ܐܢܬ
