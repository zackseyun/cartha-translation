    ܠܗ. ܚܙܝܬ ܡܟܝܠ ܕܥܒܕ
    ܥܡܐ ܗܢܐ. ܒܝܫܬܐ
    ܕܒܥܝܢܝ ܬܪܝܢ ܫܒܛܝܢ
    ܕܦܫܘ. ܝܬܝܪ ܡܢ ܥܣܪܐ
    ܫܒܛܝܢ ܕܐܫܬܒܝܘ. ܡܛܠ ܕܐܢܘܢ
