    ܘܚ

    # Source page p0187 (printed 155)
    ܬܬܛܪܦ ܗܝܕܝܢ ܒܚܫ̈ܟܐ
    ܒܝܘ̈ܡܝܐ ܕܕܝܠܗ ܟܕ
    ܚܙܝܢ ܗܘܘ ܬܘ̈ܠܥܐ
    ܣܓܝ̈ܐܐ ܕܢܦ̈ܩܢ ܗܘ̈ܝ
    ܡܢ ܗ̇ܘ ܕܒܟ̣ܪ ܐܢܘܢ. ــ
    ܘܒܬܪ ܝܘܫܝܐ ܢܘܚܪܐ
    ܕܐܝܬܝ ܗܘܘ ܗܘ ܙܒܢܐ
    ܕܐܬܠܒܟ ܒܗ ܙܕܩܝܐ
    ܘܡܠܟܘܬܗ. ܘܗܘ̣ܐ ܒܝܘܡ
    ܙܒܢܐ ܒܝܫܘܬܐ ܕܗܘ̣ܬ.
    ܘܚܙܝܬ ܕܥܠ ܡܟܝܟܘܬܗ
    ܘܕܟ̣ܘܬ ܣܓܝ̈ܐܐ
    ܕܒܟ̈ܘܡܐ ܢܣ̣ܒܘ ܗܝܕܝܢ.
    ܘܗܘ̈ܒܠܝ ܣܓܝ̈ܐܐ
    ܕܐܬܪܒܘ ܗܝܕܝܢ ܒܚܘܒ̣ܐ
    ܕܥܠ ܡܟܝܟܘܬܗ ܡܥܒܕ
    ܘܡܚܙܝ ܒܗܘ̇ ܙܒܢܐ ܩܕܡ
    ܗܘ̣ܘ. ܘܚܟܡܬܐ ܟܟܝܘܬܐ
    ܡܬܡܢܝܐ ܗܘܬ ܘܡܘܬܪܢܘܬܐ
    ܕܣܘܟܠܐ ܟܘܪܗܢܐ ܚܫܝܒܐ
    ܡܬܚܙܝܐ ܗܘܬ. ܘܡܕܪ̈ܫܐ
    ܕܨܒܝܢܐ ܟܝܘܬܘܬܐ
    ܘܒܥ
    ܘܕܝܫܘܬܐ ܕܦܘܩܕܢܘܗܝ
    ܕܚܠܬ ܓܝܪ ܡܫܬܡܥܢ
    ܗܘܬ. ܘܐܢܫܐ ܕܐܬܚܝܒܘ
    ܗܟܢܐ ܟܐܘܬ ܙܒܢܐ. ܡܛܠ
    ܕܠܐ ܚܿܫܝܢ ܗܘܘ ܒܡܘܬܗܘܢ.
    ܝܬܝܪ ܡܢ ܡܠܝܘܬ ܫ̈ܢܝܐ
    ܡܫܬܒܚܝܢ ܗܘܘ ܘܒܚܕܘܬܐ
    ܡܕܝܡܐ ܗܿܘܝܢ ܚܠܝܦܝ
    ܗܘܘ. ܥܠ ܕܫ̈ܢܝܐ
    ܘܬܘܠܕ̈ܬܐ ܚܠܦܝܢ ܐܢܘܢ
    ܡ̇ܢ. ܘܡܘܬܐ ܕܝܠܗܘܢ ܬܒܥ
    ܘܡ̇ܢ ܡܒܛܠܢܐ ܐܦܩܕ
    ܕܢܬܬܒܥ. ܗܝ ܗܝ ܡܟܝܠ ܦܘܪܥܢܘܬܐ
    ܕܡܚܝܒܘܬܐ. ܕܝܘܪܒܢܐ
    ܕܐܬܚܝܒܘ ܕܢܥܒܕܘܢ ܐܢܘܢ
    ܒܥ̈ܒܕܝܗܘܢ. ܡܛܠ ܕܗܟܢܐ
    ܕܐܢܫܘܬ ܡ̈ܠܟܐ ܗܘܘ ܡܢ
    ܒܪܝܫܝܬ. ܘܚܕܡܘܬ ܕܐܝܟܠܝ.
    ܘܕܚܠܬ ܦܘܪܥܢܐ ܕܦܓܪܐ
    ܐܬܦܪܣܝܬ. ܒܐܘܬ ܙܒܢܐ.
    ܘܒܥܝܘܬ ܕܡܘܬܐ ܩܦܚܬ
    ܕܗܘܘ ܒ
