    # Source page p0197 (printed 145)
    ܡܦܩܢܗ ܓܝܪ ܡܣܟܝ
    ܐܢܘܢ ܗܢܝܢ ܠܡܘ̈ܬܐ
    ܕܡܫܟܠܐ. ܗܘܘ ܕܐܝܟ
    ܐܢܘܢ. ܟܕ ܡܕܡ ܠܐ
    ܡܚܠܦܝܢ ܒܨܘܪܬܗܘܢ.
    ܐܠܐ ܐܝܟ ܕܩܒܠܬ ܗܘܬ
    ܡܦܩܐ ܠܗܘܢ. ܘܐܝܟ
    ܕܐܫܠܡܬ ܐܢܘܢ ܠܗ̇.
    ܗܟܢܐ ܐܦ ܡܩܝܡܐ
    ܠܗܘܢ. ܗܢܝܢ ܡܬܒܥܐ
    ܓܝܪ ܠܡܚܘܝܘ ܠܐܝܠܝܢ
    ܕܚܝܝܢ. ܕܚܝܘ ܡ̈ܝܬܐ.
    ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ
    ܗܘܘ. ܘܢܗܘܐ ܟܕ
    ܕܐܬܝܕܥܘ ܚܕ ܠܚܕ
    ܐܝܠܝܢ ܕܗܫܐ ܝܕܥܝܢ. ܗܝܕܝܢ
    ܢܒܛܠ ܕܝܢ ܚܙܘܗ
    ܕܐܝܠܝܢ ܕܡܩܕܡܝܢ ܐܡܝܢ.܀.
    ܘܗܘܘ ܡܢ ܒܬܪ ܕܒܥܘ
    ܗܘ ܝܘܡܐ ܕܡܘܬܐ. ܗܝܕܝܢ
    ܡܢ ܒܬܪ ܕܝܢ ܡܬܚܘܝܘ
    ܕܡܬܚܘܝܢ. ܕܐܢܘܢ
    ܕܡܬܚܙܝܢ. ܐܦ ܠܡܒܣܡܗܘܢ
    ܕܐܝܠܝܢ ܕܡܬܕܡܝܢ.
    ܡܠܟܒܕܐ ܓܝܪ ܕܡܘܬܗܘܢ
    ܐܝܠܝܢ ܕܗܘܐ ܩܕܡܝܟܝܢ
    ܒܝܫ ܡܢ ܡܐ ܕܐܝܬܝܗ̇.
    ܚܕ ܕܢܣܒܪܘܢ ܬܫܢܝܩܐ.
    ܦ ܬܫܒܘܚܬܗܘܢ ܕܐܝܠܝܢ
    ܕܗܘܐ ܐܙܕܩܘ ܒܙܒܢܗܘܢ.
    ܘܗܠܝܢ ܕܐܝܬ ܗܘܘ ܠܗܘܢ
    ܫܘܒܠܐ ܒܚܝ̈ܝܗܘܢ.
    ܘܗܠܝܢ ܕܢܨܒܘ ܒܠܒܗܘܢ
    ܥܩܪܐ ܕܚܟܡܬܐ. ܗ̇ܢܝܢ
    ܢܬܬܥܝܪ ܐܢܗܘܢ ܒܫܘܒ̈ܚܐ.
    ܘܬܬܢܗܪ ܨܘܪܬܗܘܢ
    ܕܐܦܝ̈ܗܘܢ ܒܢܘܗܪܐ
    ܕܐܝܩܪܗܘܢ ܕܢܫܒܚܘܢ
    ܕܢܣܒܘܢ ܘܢܩܒܠܘܢ ܥܠܡܐ
    ܕܠܐ ܡܐ̇ܬ. ܗ̇ܢܝܢ ܡܠܝܢ
    ܠܗܘܢ. ܒܘܕܐ ܓܝܪ ܝܬܝܪܐܝܬ
    ܢܬܬܙܝܥܘܢ ܐܝܠܝܢ ܕܐܝܟ
    ܗ̇ܢܝܢ. ܐܠܐ ܕܐܣܠܝܘ
    ܢܡܘܣܝ̈. ܘܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
    ܕܠܐ ܢܫܡܥܘܢ ܚܟܡܬܐ.
    ܘܠܐ ܢܩܒܠܘܢ ܣܘܟܠܐ.
    ܟܕ ܗܟܝܠ ܢ
