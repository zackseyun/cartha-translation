    # Source page p0211 (printed 131)
    ܗܘ̈ܦܝ ܡܥܝܪܢܘܬ ܚܕܐ
    ܒܚܕܐ. ܘܚܕܐ ܚܕܐ
    ܡܦܩܕܢܢ. ܡܢܗܝܢ ܓܝܪ
    ܡܘܬܪ̈ܢ ܡܢ ܕܠܝܬܝܗܝܢ. ܘܡܢ
    ܕܐܝܬܝܗܝܢ ܢܣܒܢܢ
    ܘܡܢܗܝܢ ܕܠܝܬܝܗܝܢ ܘܕܐܝܬܝܗܝܢ
    ܡܣܒܪܝܢܢ. ܐܝܟ ܕܠܐ
    ܢܬܬܡܗܘܢ ܐܝܠܝܢ ܕܗ̈ܦܝ ܥܠ
    ܙܥܘܪ. ܒܗܘܢܘ ܝܘܡ̈ܬܐ
    ܕܡܬܒܩܐ ܗܘ ܕܒܐܝܕܘܗܝ .܀.
    ܒܙܒܢ ܕܝܢ ܗܠܝܢ ܕܢܬܬܡܗܘܢ
    ܗܢܘܢ ܕܐܬܚܒܠܘ.. ܡܫܘܚܬܗ
    ܕܝܢ ܘܡܢܝܢܗ ܕܗܘ ܙܒܢܐ
    ܗܘ̈ܦܝ ܬܪ̈ܬܝܢ ܡ̈ܢܘܢ ܫܒܘ̈ܥܐ
    ܕܫܒܥܐ ܫܒܘ̈ܥܝܢ. ܘܥܪܝܬܐ
    ܘܐܘܚܪܐ. ܛܒ ܬܗܘܐ
    ܕܐܝܟ ܢܡܢܡܐ ܘܢܚܙܐ.
    ܘܛܒܐ ܕܝܢ ܡܢ ܗܕܐ ܕܠܐ
    ܢܡܢܡܐ. ܕܠܐ ܢܦܠ. ܐܠܐ
    ܐܡܪ ܐܦ ܗܕܐ. ܢܫܘܩ
    ܗܘ ܕܠܐ ܡܬܚܒܠܐ ܠܡܘܠܟܢ
    ܕܡ
    ܐܦ ܗ̣ܘܐ ܠܝ ܗܘ
    ܕܒܚܕ ܬܪ̈ܥܣܪ ܒܝܪܚܐ
    ܫܒܝܥܝܐ ܫܢܬ ܫܬܝܬܝܬܐ
    ܡܠܠ ܥܡܝ ܡܠܬܐ ܕܐܡܪܬ
    ܠܝ ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ
    ܘܐܘܕܥܟ ܡܕܡ ܕܥܬܝܕ
    ܠܡܗܘܐ. ܘܩܡܬ ܥܠ ܪ̈ܓܠܝ
    ܘܐܡܪ ܠܝ ܫܡܥ ܝܐ ܒܪܘܟ
    ܘܐܙܕܗܪ ܒܡܠܬܝ. ܠܐ ܬܣܒܪ
    ܕܡܛܠ ܕܛܥܘ ܥܡܐ ܚܪܒܬ
    ܡܕܝܢܬܐ ܗܕܐ. ܐܠܐ ܡܛܠ
    ܕܥܒܕܘ ܒܝܫܬܐ ܐܬܡܣܪܘ.
    ܘܡܛܠ ܕܐܬܡܣܪܘ ܠܐ
    ܬܬܚܫܒ. ܘܐܬܡܣܪܬ ܠܗܘܢ
    ܡܛܠ ܙܒܢܐ. ܩܘܡ ܗܟܝܠ
    ܘܥܒܕ ܣܘܩܡܐ ܕܒܝܫ̈ܐ
    ܘܐܡܪ ܠܗܘܢ ܕܗܘܘ
    ܡܙܗܪܝܢ ܐܢܘܢ ܒܕܡܝܐ
    ܕܐܢܬ ܚܙܝܬ. ܘܐܣܗܕ ܠܗܘܢ
    ܒܡܘܡܬܐ ܕܒܗ ܒܕܡܝܐ
    ܐܢܬ ܡܬܚܙܝܬ. ܐܦ
    ܐܢܬ ܓܝܪ ܩܪܝܬܘܗܝ.

    # Source page p0210 (printed 132)
    ܘܚܕܐ ܡܫܟܬܐ ܬܥܒܕ
    ܐܠܦ ܣܛܪ̈ܝܢ. ܘܚܕ ܣܛܪܐ
    ܢܥܒܕ ܐܠܦ ܟܢܫ̈ܝܢ. ܘܚܕܐ
    ܟܢܫܬܐ ܬܥܒܕ ܩܘܪܐ
    ܕܣܡܝܐ. ܘܐܝܠܝܢ ܕܦܫ̣ܘ
    ܢܬܒܣܡܘܢ. ܘܬܘܒ ܕܝܢ
    ܢܚܙܘܢ ܬܕܡܘܪܬܐ ܒܟܠ
    ܝܘܡ. ܘܚܝ̈ܐ ܓܝܪ ܢܦܩܘܢ
    ܡܢ ܡܕܒܚܐ. ܠܡܢܕܥܘ ܟܘܠ
    ܕܦܪ̈ܚܐ ܕܚܝܐ ܕܦܪ̈ܚܐ
    ܕܣܦܝܪܝܢ. ܘܒܝܘܡܬܗܘܢ
    ܕܗܢܘܢ. ܟܢ̈ܢܐ ܕ̈ܣܓܝ
    ܛܠܠܐ ܕܐܣܝܘܬܐ. ܘܢܚܬܘܢ
    ܡܢ ܡܪܘܡܐ ܙܒܢܐ ܢܚܝܐ
    ܘܬܘܒ ܡܢ ܥܠܠܐ ܕܕ̈ܡܥܐ
    ܕܡܢܝܐ. ܘܢܬܡܠܟܘܢ ܡܥܝܗ
    ܒܗܠܝܢ ܫܢܝ̈ܐ. ܡܛܠ ܕܗ̣ܢܘܢ
    ܐܢܘܢ ܕܡܛܝܘ ܠܫܘܠܡܗ
    30 ܕܙܒܢܐ.܀. ܘܗܘܐ ܡܢ ܒܬܪ
    ܗܠܝܢ ܐܡܠܠ ܕܐܡܠܠ
    ܙܒܢܐ ܕܡܐܬܝܬܗ ܕܡܫܝܚܐ.
    ܘܢܬܦܣܩ
    ܕܗܘܘ ܬܬܛܫܐ ܡܢܝ
    ܕܢܦܩܐ ܕܙܩܝܦܐ ܘܢܦܩܝ.
    ܘܬܬܚܙܐ ܗܝ ܕܐܬܟܣܝܬ
    ܕܢܦܩܐ ܙܥܝܪܐ ܒܚܕ
    ܡܢܗ̇. ܕܚܕܐ ܬܬܒܥܝܬ.
    ܘܬܚܕܝ ܩܕܡܝܬ ܐ
    ܘܐܚܪܝܬܐ ܠܐ ܬܬܬܥܝܩ.
    ܝܕܥ ܐܢܐ ܕܡܛܐ ܙܒܢܐ.
    ܕܐܡܝܪ ܒܠܒܘܗܝ. ܕܡܫܬܡܥܘܗܝ
    ܕܒܪܝ. ܢܦܩܬܗܘܢ ܕܝܢ
    ܕ̈ܢܒܝܐ ܡܢ ܚܝ̈ܝܗܝ ܡܠܘܗܝ
    ܘܠܒܝ. ܘܝܕܥ ܐܢܐ ܕܐܝܬ
    ܢܦܫܝ. ܝܕܥ ܐܢܐ ܕܡܛܐ
    ܬܫܡܫܬܗܘܢ ܕܐܒ̈ܗܝ
    31.. ܐܡܪܠܗܘܢ.܀.܀.܀.܀.܀.
    ܗܘܘ ܡܢ ܒܬܪ ܗܠܝܢ܆
    ܐܙܠܬ ܐܢܐ ܠܘܬ ܥܡܐ
    ܘܐܡܪܬ ܠܗܘܢ. ܟܢܫܘ
    ܠܝ ܣܒܝܟܘܢ ܘܒܢܝ̈ܟܘܢ.
    ܘܐܡܪ ܒܥܘ ܡܠܝ.
    ܘܐܬܟܢܫܘ ܟܠܗܘܢ
    ܀ ܒܚܠܬܐ ܕܩܕܪܘܢ. ܘܒܥܝܬ
    ܘܐܡܪܬ ܠܗܘܢ.
