    witness: “They took the name of those that are good”
    issue: The draft changes the witness’s singular “name” to plural.
  - draft: “bind people to those who are not good”
    witness: “bind them to those that aren't good”
    issue: “People” broadens the stated referent, humanity; retain the explicit referent.
  - draft: “and animals would not be offered to the powers”
    witness: “and animals offered up to the powers”
