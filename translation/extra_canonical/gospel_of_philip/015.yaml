  issues:
  - location: Opening sentence
    issue: The parenthetical signal in “and (then) they'll rise” has been removed.
    correction: 'Restore: “they will die first and (then) rise.”'
  - location: Truth and food passage
    issue: The draft changes the witness’s ambiguous wording and bracketed restoration (“to those who wanted, he gave them [to eat, so that]”) to “to those who wanted it, he gave [it to eat, so that].”
    correction: Retain the witness’s referents and restoration boundary.
  - location: Cup of prayer
    issue: “Type” is rendered as “image,” and “It fills with the Holy Spirit” is changed to the passive “It is filled with the Holy Spirit.” The latter changes the grammatical assertion.
    correction: Use “type” and “It fills with the Holy Spirit.”
  - location: Eternal-age union
    issue: The parenthetical signals in “the (eternal) age” and “not (two) different things” have been removed.
    correction: Restore both parenthetical signals.
  - location: Self-knowledge passage
    issue: The plural object in “will enjoy them” has been changed to singular “will enjoy it.”
    correction: Use “will enjoy them.”
  - location: Perfect human passage
    issue: The identifying parenthesis “(the perfect human)” after “see them” has been omitted.
    correction: 'Restore: “see them (the perfect human).”'
  - location: Holy man/priest passage
    issue: The witness’s parenthetical identifications “the holy man (priest)” and “his (very) body” have been flattened.
    correction: Restore both parenthetical signals.
  - location: Love and anointing passage
    issue: The future wording “All those who will anoint themselves with it” has been changed to present-tense “All those who anoint themselves with it.”
    correction: Retain the future wording.
  - location: Final sentence
    issue: The parenthetical signal in “sold themselves (back) into slavery” has been removed.
    correction: Restore “(back).”
