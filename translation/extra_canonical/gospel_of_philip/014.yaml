  issues:
  - location: Second paragraph
    issue: The draft inserts the unsupported article “an” in “is not true, [but …] an image of the true.” The witness reads “[but …] image of the true,” and the lacunose wording should not be supplemented.
  - location: Powers paragraph
    issue: The draft reduces “the mystery of the union” to “the mystery of union.” Retain the witness’s definite article.
  - location: Mystery/bridal-chamber paragraph
    issue: The draft changes “like the one who came into being” to “like one who came into being.” Retain the witness’s wording.
