grounding_review:
  model: gpt-5.6-terra-2026-07-09
  deployment: gpt-5-6-terra-atlas
  verdict: revise
  issues:
  - location: Seeing what exists
    issue: The draft changes the witness's plural wording, “unless they become like them,” to singular “like it,” and adds “those things.” This narrows/clarifies a formulation that should remain as witnessed.
  - location: Names of Jesus
    issue: The witness's parenthetical signal in “called (him)” is omitted. Parenthetical/restoration signals must remain visible.
  - location: Levi’s dyeing place
    issue: “Levi’s place of dyeing” is rendered as “Levi’s dye workshop.” “Workshop” is an added specification not present in the witness.
  - location: Mary Magdalene passage
    issue: The wording “The rest of […] […] they said to him” is normalized to “The rest of […] […] said to him.” Although awkward, the witness's wording should not be silently regularized around lacunose material.
  reviewed_at: '2026-07-11T19:26:48Z'
