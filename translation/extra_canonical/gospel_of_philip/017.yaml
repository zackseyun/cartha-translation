  issues:
  - location: axe/root saying
    issue: “what is cut blossoms again” weakens the witness’s future expression, “that which will be cut blossoms again.”
  - location: revealed and hidden of the truth
    issue: The draft changes “those who are revealed of the truth” into “those things of the truth that are revealed,” shifting the referent from persons to things.
  - location: uprooting the evil within
    issue: “Pull it out by its root” does not retain the witness’s wording and spatial claim, “pluck it out from its root in us.”
