  issues:
  - “great people of the great Seth” changes the witness’s “great men of the great Seth.”
  - “three appearances” replaces the witness’s “three parousias,” reducing a stated technical term.
  - 'The draft recasts the Father/light/Providence clause: the witness says that the referent “pre-existed with his Providence” and “instituted through her” the baptism, whereas the draft explicitly makes “This light” the instituting subject.'
  - The witness’s visible marker “[14]” after “produced and removed” is omitted.
  - Several renderings add interpretive reshaping where a closer rendering preserves the witness’s claims and syntax, especially “put on” for “donned” and “baptismal spring” for “baptism-spring.”
