  english_witness: In what way did the Lord preach when he lived in the flesh and after he revealed himself to be Son of God? He dwelt in this place where you abide, discoursing of the law of natural things, which I, however, I call “death.” Rheginos, the Son of God was the Son of Man. He took both to himself, having humanity and divinity. Consequently, on the one hand he could banish death as the Son of God, and on the other hand as the Son of Man he brought the restoration of the Fullness. That was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came to be.
translation:
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
