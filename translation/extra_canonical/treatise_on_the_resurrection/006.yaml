source:
  text: |-
    What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
