source:
  text: |-
    I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.

    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.
