  english_witness: 'Yet what am I telling you? Those who are alive shall die? How do they live in an illusion? The rich have become poor, and the kings are cast down. Everything is subject to change. The world is an illusion, if in fact I do not exaggerate the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things, and a transformation into what is new. Because imperishability [] [will descend] on the perishable. The light will flow down on the darkness, swallowing it up. The Fullness then will fill the Deficiency. These are symbols and images of the resurrection. This makes for what is good.'
translation:
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
