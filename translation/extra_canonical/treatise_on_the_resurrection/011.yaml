source:
  text: |-
    From the graciousness of my [] Lord, Jesus Christ have I obtained all this. Concerning these things [I have] instructed you and your [brothers and sisters], my children, while not neglecting anything that could strengthen you. If, however, in my explanation of the word there is anything I have written that is obscure, I shall explain it to you if you ask.

    Now, however, be not anxious to share this with anyone among you, because it can be helpful.

    Many are looking into (the questions about which) I have written to you. To these I say, Peace be to them, and grace.

    I send greetings to you and to those who love you with the love of brothers and sisters.

    The Treatise on the Resurrection

    FAQs

