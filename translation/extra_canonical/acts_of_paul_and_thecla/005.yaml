  english_witness: '5:1 At length Thecla was missed, and sought for by the family and by Thamyris in every street, as though she had been lost, but one of the porter''s fellow-servants told them, that she had gone out in the night-time.


    5:2 Then they examined the porter, and he told them, that she was gone to the prison to the strange man.


    5:3 They went therefore according to his direction, and there found her; and when they came out, they got a mob together, and went and told the governor all that happened.


    5:4 Upon which he ordered Paul to be brought before his judgement seat.


    5:5 Thecla in the mean time lay wallowing on the ground in the prison, in that same place where Paul had sat to teach her; upon which the governor also ordered her to be brought before his judgement-seat; which summons she received with joy, and went.


    5:6 When Paul was brought thither, the mob with more vehemence cried out, He is a magician, let him die.


    5:7 Nevertheless the governor attended with pleasure upon Paul''s discourses of the holy works of Christ; and, after a council called, he summoned Thecla, and said to her, Why do you not, according to the law of the Iconians, marry Thamyris?


    5:8 She stood still, with her eyes fixed upon Paul; and finding she made no reply, Theoclia, her mother, cried out, saying, Let the unjust creature be burnt; let her be burnt in the midst of the theatre, for refusing Thamyris, that all women may learn from her to avoid such practices.


    5:9 Then the governor was exceedingly concerned, and ordered Paul to be whipt out of the city, and Thecla to be burnt.


    5:10 So the governor arose, and went immediately into the theatre; and all the people went forth to see the dismal sight.


    5:11 But Thecla, just as a lamb in the wilderness looks every way to see his shepherd, looked around for Paul;


    5:12 And as she was looking upon the multitude, she saw the Lord Jesus in the likeness of Paul, and said to herself, Paul is come to see me in my distressed circumstances. And she fixed her eyes upon him; but he instantly ascended up to heaven, while she looked on him.


    5:13 The the young men and women brought wood and straw for the burning of Thecla; who, being brought naked to the stake, extorted tears from the governor, with surprise beholding the greatness of her beauty.


    5:14 And when they had placed the wood in order, the people commanded her to go upon it; which she did, first making the sign of the cross.


    5:15 Then the people set fire to the pile; though the flame was exceeding large, it did not touch her, for God took compassion on her, and caused a great eruption from the earth beneath, and a cloud from above to pour down great quantities of rain and hail;


    5:16 Insomuch that by the rupture of the earth, very many were in great danger, and some were killed, the fire was extinguished, and Thecla was preserved.'
translation:
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
