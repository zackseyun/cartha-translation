translation:
  text: '2:1 While Paul was preaching this sermon in the church which was in Onesiphorus’s house, a virgin named Thecla—whose mother’s name was Theoclia and who was betrothed to a man named Thamyris—sat at a window in her house.


    2:2 From there, by the advantage of a window in the house where Paul was, she heard Paul’s sermons both night and day concerning God, charity, faith in Christ, and prayer.


    2:3 Nor would she depart from the window until, with exceeding joy, she was subdued to the doctrines of faith.


    2:4 At length, when she saw many women and virgins going in to Paul, she earnestly desired that she might be thought worthy to appear in his presence and hear the word of Christ; for she had not yet seen Paul’s person, but had only heard his sermons, and that alone.


    2:5 But when she could not be prevailed upon to depart from the window, her mother sent for Thamyris, who came with the greatest pleasure, hoping now to marry her. Accordingly, he said to Theoclia, “Where is my Thecla?”


    2:6 Theoclia replied, “Thamyris, I have something very strange to tell you; for Thecla, for the space of three days, will not move from the window, not so much as to eat or drink, but is so intent on hearing the artful and delusive discourses of a certain foreigner that I perfectly admire, Thamyris, that a young woman of her known modesty will suffer herself to be so prevailed upon.


    2:7 “For that man has disturbed the whole city of Iconium, and even your Thecla, among others. All the women and young men flock to him to receive his doctrine; who, besides all the rest, tells them that there is but one God, who alone is to be worshipped, and that we ought to live in chastity.


    2:8 “Notwithstanding this, my daughter Thecla, like a spider’s web fastened to the window, is captivated by the discourses of Paul and attends upon them with prodigious eagerness and vast delight; and thus, by attending on what he says, the young woman is seduced. Now then, go and speak to her, for she is betrothed to you.”


    2:9 Accordingly Thamyris went, and having saluted her, and taking care not to surprise her, he said, “Thecla, my spouse, why do you sit in this melancholy posture? What strange impressions are made upon you? Turn to Thamyris, and blush.”


    2:10 Her mother also spoke to her after the same manner and said, “Child, why do you sit so melancholy and, like one astonished, make no reply?”


    2:11 Then they wept exceedingly: Thamyris, that he had lost his spouse; Theoclia, that she had lost her daughter; and the maids, that they had lost their mistress; and there was a universal mourning in the family.


    2:12 But all these things made no impression upon Thecla so as to incline her so much as to turn to them and take notice of them; for she still regarded the discourses of Paul.


    2:13 Then Thamyris ran forth into the street to observe who they were who went into Paul and came out from him; and he saw two men engaged in a very warm dispute, and said to them,


    2:14 “Sirs, what business have you here? And who is that man within, belonging to you, who deludes the minds of men, both young men and virgins, persuading them that they ought not to marry, but continue as they are?


    2:15 “I promise to give you a considerable sum if you will give me a just account of him; for I am the chief person of this city.”


    2:16 Demas and Hermogenes replied, “We cannot so exactly tell who he is; but this we know, that he deprives young men of their (intended) wives, and virgins of their (intended) husbands, by teaching, ‘There can be no future resurrection, unless you continue in chastity, and do not defile your flesh.’”'
