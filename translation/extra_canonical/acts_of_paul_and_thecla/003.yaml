  english_witness: '3:1 Then said Thamyris, Come along with me to my house, and refresh yourselves. So they went to a very splendid entertainment, where there was wine in abundance, and very rich provision.


    3:2 They were brought to a table richly spread, and made to drink plentifully by Thamyris, on account of the love he had for Thecla and his desire to marry her.


    3:3 Then Thamyris said, I desire ye would inform me what the doctrines of this Paul are, that I may understand them; for I am under no small concern about Thecla, seeing she so delights in that stranger''s discourses, that I am in danger of losing my intended wife.


    3:4 Then Demas and Hermogenes answered both together, and said, Let him be brought before the governor Castillius, as one who endeavours to persuade the people into the new religion of the Christians, and he, according to the order of Caesar, will put him to death, by which means you will obtain your wife;


    3:5 While we at the same time will teach her, that the resurrection which he speaks of is already come, and consists in our having children; and that we then arose again, when we came to the knowledge of God.


    3:6 Thamyris having this account from them, was filled with hot resentment:


    3:7 And rising early in the morning he went to the house of Onesiphorus, attended by the magistrates, the jailer, and a great multitude of people with staves, and said to Paul;


    3:8 Thou hast perverted the city of Iconium, and among the rest, Thecla, who is betrothed to me, so that now she will not marry me. Thou shalt therefore go with us to the governor Castillius.


    3:9 And all the multitude cried out, Away with this imposter (magician), for he has perverted the minds of our wives, and all the people hearken to him.'
translation:
  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
