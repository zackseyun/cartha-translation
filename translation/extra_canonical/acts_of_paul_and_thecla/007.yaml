  english_witness: '7:1 Then Paul sent back Onesiphorus and his family to their own home, and taking Thecla along with him, went for Antioch;


    7:2 And as soon as they came into the city, a certain Syrian, named Alexander, a magistrate, in the city, who had done many considerable services for the city during his magistracy, saw Thecla and fell in love with her, and endeavoured by many rich presents to engage Paul in his interest.


    7:3 But Paul told him, I know not the woman of whom you speak, nor does she belong to me.


    7:4 But he being a person of great power in Antioch, seized her in the street and kissed her; which Thecla would not bear, but looking about for Paul, cried out in a distressed loud tone, Force me not, who am a stranger; force me not, who am a servant of God; I am one of the principal persons of Iconium, and was obliged to leave that city because I would not be married to Thamyris.


    7:5 Then she laid hold on Alexander, tore his coat, and took his crown off his head, and made him appear ridiculous before all the people.


    7:6 But Alexander, partly as he loved her, and partly being ashamed of what had been done, led her to the governor, and upon her confession of what she had done, he condemned her to be thrown among the beasts.'
translation:
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
