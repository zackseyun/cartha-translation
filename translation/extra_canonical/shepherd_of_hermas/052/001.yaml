translation:
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations
    of the parables. But since you are so persistent, I will interpret for you the parable of the field
    and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having
    labored much and endured many toils—for no one can dig without toil or labor.
