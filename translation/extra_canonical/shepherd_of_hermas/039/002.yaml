translation:
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy
    Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works
    lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has
    power to ascend to the altar of God.'
