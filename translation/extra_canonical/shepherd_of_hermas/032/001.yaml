translation:
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and
    do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you
    will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will
    exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness,
    having prosperity within itself.
