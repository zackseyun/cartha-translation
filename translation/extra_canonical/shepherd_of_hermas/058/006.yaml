translation:
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the
    hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the
    drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing
    things like these gives his own disease its fill; he therefore indulges himself in his act. All these
    indulgences are harmful to the slaves of God. Therefore, because of these deceptions, those who are
    punished and tormented suffer.
  philosophy: optimal-equivalence
