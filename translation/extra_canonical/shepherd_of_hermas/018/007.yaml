translation:
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged
    woman the revelation may become complete.” He answered me and said: “How long will you be senseless?
    Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
