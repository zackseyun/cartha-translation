translation:
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and
    rolling from the road into the pathless places: these are those who have believed, but because of
    their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a
    better road, they go astray and suffer misery as they walk in the pathless places.'
