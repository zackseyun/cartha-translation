translation:
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed
    themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then,
    have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption,
    then, has hope of a certain renewal, but death has eternal destruction.”
