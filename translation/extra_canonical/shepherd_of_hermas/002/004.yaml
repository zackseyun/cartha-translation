translation:
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning
    her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil
    and startling intention for a most reverent spirit, and one already proven, if it should desire an
    evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full
    of all simplicity and great innocence.”
