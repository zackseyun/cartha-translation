source:
  text: |-
    Μετὰ τὸ λαλῆσαι αὐτὴν τὰ ῥήματα ταῦτα ἐκλείσθησαν οἱ οὐρανοί· κἀγὼ ὅλος ἤμην πεφρικὼς καὶ λυπούμενος. ἔλεγον δὲ ἐν ἐμαυτῷ· Εἰ αὕτη μοι ἡ ἁμαρτία ἀναγράφεται, πῶς δυνήσομαι σωθῆναι; ἢ πῶς ἐξιλάσομαι τὸν Θεὸν περὶ τῶν ἁμαρτιῶν μου τῶν τελείων; ἢ ποίοις ῥήμασιν ἐρωτήσω τὸν Κύριον ἵνα ἱλατευθῇ μοι; 2. ταῦτά μου συμβουλευομένου καὶ διακρίνοντος ἐν τῇ καρδίᾳ μου, βλέπω κατεναντί μου καθέδραν λευκὴν ἐξ ἐρίων χιονίνων γεγονυῖαν μεγάλην· καὶ ἦλθεν γυνὴ πρεσβῦτις ἐν ἱματισμῷ λαμπροτάτῳ, ἔχουσα βιβλίον εἰς τὰς χεῖρας, καὶ ἐκάθισεν μόνη, καὶ ἀσπάζεταί με· Ἑρμᾶ, χαῖρε. κἀγὼ λυπούμενος καὶ κλαίων εἶπον· Κυρία, χαῖρε. 3. καὶ εἶπέν μοι· Τί στυγνός, Ἑρμᾶ, ὁ μακρόθυμος καὶ ἀστομάχητος, ὁ πάντοτε γελῶν, τί οὕτω κατηφὴς τῇ ἰδέᾳ καὶ οὐχ ἱλαρός; κἀγὼ εἶπον αὐτῇ· Ὑπὸ γυναικὸς ἀγαθωτάτης λεγούσης ὅτι ἥμαρτον εἰς αὐτήν. 4. ἡ δὲ ἔφη· Μηδαμῶς ἐπὶ τὸν δοῦλον τοῦ Θεοῦ τὸ πρᾶγμα τοῦτο. ἀλλὰ πάντως ἐπὶ τὴν καρδίαν σου ἀνέβη περὶ αὐτῆς. ἔστιν μὲν τοῖς δούλοις τοῦ Θεοῦ ἡ τοιαύτη βουλὴ ἁμαρτίαν ἐπιφέρουσα· πονηρὰ γὰρ βουλὴ καὶ ἔκπληκτος, εἰς πάνσεμνον πνεῦμα καὶ ἤδη δεδοκιμασμένον, ἐὰν ἐπιθυμήσῃ πονηρὸν ἔργον, καὶ μάλιστα Ἑρμᾶς ὁ ἐγκρατής, ὁ ἀπεχόμενος πάσης ἐπιθυμίας πονηρᾶς καὶ πλήρης πάσης ἁπλότητος καὶ ἀκακίας μεγάλης.
