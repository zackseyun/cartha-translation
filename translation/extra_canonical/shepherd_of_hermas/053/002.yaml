translation:
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that
    dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in
    your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you
    defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not
    live.”'
