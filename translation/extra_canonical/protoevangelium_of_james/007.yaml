  english_witness: '(1) And she cared for her child through the months. When she was two years old, Joachim said, “Let’s take her to the Temple of the Lord, so that we may keep the promise we made, so that the Lord won’t be angry with us and find our gift unacceptable.”


    But Anna said, “Let’s wait until her third year, so that she won’t seek her father or mother.”


    And Joachim said, “Let’s wait.”


    (2) And the child became three years old, and Joachim said, “Let’s call the pure daughters of the Hebrews. And let them take their lamps, and let them be lit, so that the child won’t turn back, and her heart won’t be drawn away from the Temple of the Lord.” And they did so until they went up to the Temple of the Lord.


    And the priest welcomed her, kissed her, and said, “The Lord God has magnified your name among all the generations. Through you, the Lord will reveal his redemption of the people of Israel in the last days.”


    (3) And he sat her down on the third step of the altar, and the Lord God poured grace upon her. And she danced on her feet, and all the house of Israel loved her.'
translation:
  text: '(1) And she cared for her child through the months. When she was two years old, Joachim said, “Let us take her to the Temple of the Lord, so that we may keep the promise we made, so that the Lord will not be angry with us and find our gift unacceptable.”


    But Anna said, “Let us wait until her third year, so that she will not seek her father or mother.”


    And Joachim said, “Let us wait.”


    (2) And the child became three years old, and Joachim said, “Let us call the pure daughters of the Hebrews. And let them take their lamps, and let them be lit, so that the child will not turn back, and her heart will not be drawn away from the Temple of the Lord.” And they did so until they went up to the Temple of the Lord.


    And the priest welcomed her, kissed her, and said, “The Lord God has magnified your name among all the generations. Through you, the Lord will reveal his redemption of the people of Israel in the last days.”


    (3) And he sat her down on the third step of the altar, and the Lord God poured grace upon her. And she danced on her feet, and all the house of Israel loved her.'
