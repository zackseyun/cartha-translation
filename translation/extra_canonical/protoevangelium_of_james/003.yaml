translation:
  text: '(1) Anna looked intently toward heaven and saw a nest of sparrows in the laurel tree. Anna lamented, saying to herself,


    “Woe is me! Who gave birth to me? What womb bore me? I was born as a curse before the people of Israel and have been despised. They have mocked me and banished me from the Temple of the Lord my God.


    (2) “Woe is me! What am I like? I am not like the birds of heaven, because even the birds of heaven are fruitful before you, Lord.


    “Woe is me! What am I like? I am not like the animals, because even the animals are fruitful before you, Lord.


    “Woe is me! What am I like? I am not like the wild beasts of the earth, because even the wild beasts of the earth are fruitful before you, Lord.


    (3) “Woe is me! What am I like? I am not like these waters, because even these waters are serene yet churn, and their fish bless you, Lord.


    “Woe is me! What am I like? I am not like this earth, because the earth produces her fruits at the proper time and blesses you, Lord.”'
