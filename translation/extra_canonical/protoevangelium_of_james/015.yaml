  issues:
  - location: (4), Joseph’s oath
    issue: “and by the witness of God’s truth” changes the witness’s coordination (“and the witness of God’s truth”) into an explicit oath formula. Retain the witness’s wording without adding “by.”
  - location: (2), accusation against Joseph
    issue: “Joseph, the man you vouched for” slightly recasts “Joseph, about whom you bore witness.” The latter should be retained more closely, since the witness foregrounds the priest’s prior testimony concerning Joseph.
