  english_witness: '(1) But at the hour of greeting, the priests came, and Zechariah didn’t meet them to bless them as was customary. And the priests stood around for Zechariah, waiting to greet him with a blessing and to glorify the Most High God.


    (2) But when he delayed, they were all afraid. But one of them gathered the courage to go into the sanctuary and saw blood clotted beside the altar of the Lord. And a voice was saying, “Zechariah has been murdered, and his blood won’t be wiped away until his avenger comes!”


    When he heard this saying, he was afraid, and he went and reported to the priests what he had seen and heard. (3) And they gathered their courage and went and saw what had taken place. And the panels of the Temple cried out, and they (the priests) ripped their clothes from top to bottom. And they didn’t find his corpse, but they found his blood had turned to stone. And they were afraid, and they went out and reported to all the people that Zechariah had been murdered. And when all the tribes of the people heard, they mourned him and wept three days and three nights.


    (4) And after three days, the priests held a council about who should replace Zechariah. And the lot fell to Simeon, for he was told by the Holy Spirit that he wouldn’t see death until he saw the Christ in the flesh.'
translation:
  text: '(1) But at the hour of greeting, the priests came, and Zechariah did not meet them to bless them as was customary. And the priests stood around for Zechariah, waiting to greet him with a blessing and to glorify the Most High God.


    (2) But when he delayed, they were all afraid. But one of them gathered the courage to go into the sanctuary and saw blood clotted beside the altar of the Lord. And a voice was saying, “Zechariah has been murdered, and his blood will not be wiped away until his avenger comes!”


    When he heard this saying, he was afraid, and he went and reported to the priests what he had seen and heard. (3) And they gathered their courage and went and saw what had taken place. And the panels of the Temple cried out, and they—the priests—ripped their clothes from top to bottom. And they did not find his corpse, but they found his blood had turned to stone. And they were afraid, and they went out and reported to all the people that Zechariah had been murdered. And when all the tribes of the people heard, they mourned him and wept three days and three nights.


    (4) And after three days, the priests held a council about who should replace Zechariah. And the lot fell to Simeon, for he was told by the Holy Spirit that he would not see death until he saw the Christ in the flesh.'
