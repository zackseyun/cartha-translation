  english_witness: '(1) And Joseph threw down his axe, and went to their meeting. And when they had all gathered, they went to the priest with their staffs. And having taken all their staffs, he went into the Temple and prayed. And when he had finished the prayer, he took the staffs, went out, and gave them back. But there wasn’t a sign among them. And Joseph took his staff last, and look! A dove went from the staff, and flew upon Joseph’s head. And the priest said to Joseph, “You’ve been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she’s young. I won’t be a laughingstock among the people of Israel.”


    And the priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore; how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things won’t happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care, and said to her, “Mary, I’ve taken you from the Temple of the Lord, and now I bring you to my house. I’m going away to build houses, but I’ll come back to you. The Lord will protect you.”'
translation:
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
