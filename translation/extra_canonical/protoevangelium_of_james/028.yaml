  issues:
  - location: (1), opening clause
    issue: 'The witness retains parenthetical restoration/uncertainty signals: “found (and) brought (her).” The draft resolves these as “found her ... and brought her with him,” removing the signals and adding “with him,” which is not stated.'
  - location: (1), Joseph’s description of Mary
    issue: “nurtured in the Temple of the Lord” is rendered “after being raised in the Temple of the Lord.” This changes the witness’s participial description into a temporal/causal sequence. Retain “nurtured” or equivalent without “after being.”
  - location: (2), light
    issue: The draft adds “so bright” and changes “appeared in the cave” to “appeared inside.” The witness already states that their eyes could not bear the light; “so bright” is interpretive amplification. Retain the cave wording without the addition.
  - location: (3), Salome’s oath
    issue: The witness retains the parenthetical lacuna/restoration signal “insert my finger (and) examine.” The draft removes it. This signal must remain visible.
