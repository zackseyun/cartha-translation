  english_witness: '(1) And look! Joseph prepared to go out into Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) And when Herod heard, he was disturbed, and he sent officers to the magi, and sent for the chief priests and questioned them in his palace, saying to them, “What has been written about the Christ? Where will he be born?”


    They said to him, “In Bethlehem of Judea, for this is what’s written.” And he set them (the chief priests) free.


    And he questioned the magi, saying to them, “What sign did you see about the one who’s been born king?”


    And the magi said, “We saw an immense star shining among the other stars and dimming them so much that they weren’t even visible. And so we knew that a king had been born for Israel, and we came to worship him.”


    And Herod said to them, “Go and search, and if you find him, report to me so that I can also come and worship him.”


    (3) And the magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. And when they saw him with his mother Mary, the magi took gifts from their bags: gold, and frankincense, and myrrh.


    And having been warned by the angel not to go into Judea, they returned to their country by another way.'
translation:
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
