  english_witness: '(1) And Joseph saw his (Jesus’) wisdom and understanding. He didn’t want him to be unacquainted with letters, but gave him over to another teacher.


    And the teacher wrote the alphabet for him (Jesus) and said, “Say alpha.”


    (2) And the child said, “First you tell me what the beta is, and I’ll tell you what the alpha is.”


    And the teacher became irritated and struck him. And Jesus cursed him, and the teacher fell and died.


    (3) And the child went into his house to his parents, and Joseph called his (Jesus’) mother and ordered her not to set him (Jesus) free from the house so that those who provoke him may not die.'
translation:
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
