  english_witness: '(1) Now he (Jesus) was about eight years old. And his father, being a carpenter who made ploughs and yokes, took a bed from a certain rich man so that he might make it very great and suitable. And one of the beams, called the (…), was shorter; it didn’t have the (right) length. Joseph was grieved, and didn’t know what to do.


    The child came to his father and said, “Set down the two boards and line them up on your end.”


    (2) And Joseph did just as he said to him. And the child Jesus stood at the other end and seized the short board and stretched it. And he made it equal with the other board.


    And he said to his father, “Don’t grieve, but make whatever you want to.”


    And Joseph embraced and kissed him, saying, “Blessed am I, that God gave this child to me.”'
translation:
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
