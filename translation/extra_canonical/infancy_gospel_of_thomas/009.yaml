  english_witness: '(1) And again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. But one of the children fell and died. And the other children saw this and went into their houses. And they left Jesus alone.


    (2) And the parents of the child who had died came and accused Jesus, saying, “You pushed down our child!”


    But Jesus said, “I didn’t push him down.”


    (3) And they were raging and shouting. Jesus came down from the roof and stood beside the body and cried out in a loud voice, saying, “Zeno, Zeno” – because this was his name – “Rise and say whether I pushed you down.”


    And he rose and said, “No, sir.”


    And they saw and were amazed.


    And again Jesus said to him, “Fall asleep!”


    And the parents of the child praised God and worshipped the child Jesus.'
translation:
  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
