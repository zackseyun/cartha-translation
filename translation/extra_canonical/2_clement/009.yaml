source:
  text: |-
    And let not any one of you say that this flesh is not judged neither riseth again.

    Understand ye. In what were ye saved? In what did ye recover your sight? if ye were not in this flesh.

    We ought therefore to guard the flesh as a temple of God:

    for in like manner as ye were called in the flesh, ye shall come also in the flesh.

    If Christ the Lord who saved us, being first spirit, then became flesh, and so called us, in like manner also shall we in this flesh receive our reward.

    Let us therefore love one another, that we all may come unto the kingdom of God.

    While we have time to be healed, let us place ourselves in the hands of God the physician, giving Him a recompense.

    What recompense? Repentance from a sincere heart.

    For He discerneth all things beforehand and knoweth what is in our heart.

    Let us therefore give unto Him eternal praise, not from our lips only, but also from our heart, that He may receive us as sons.

    For the Lord also said, These are my brethren, which do the will of My Father.
