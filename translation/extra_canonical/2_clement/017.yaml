translation:
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
