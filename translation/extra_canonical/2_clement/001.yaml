  issues:
  - “Brothers and sisters” expands the witness’s “Brethren”; use “Brethren” or “Brothers.”
  - The draft changes “our Salvation” to “our salvation,” obscuring the witness’s capitalized designation, and weakens “think mean things of” into “think little of.”
  - “Those who listen as though these were insignificant things” introduces “these” and does not closely retain “they that listen as concerning mean things.”
  - “Endured for our sake” omits the explicit claim that Christ “endured to suffer.”
  - “He saw how much error and destruction were in us” recasts “having beheld in us much error and perdition”; the witness’s “perdition” should remain visible.
