  english_witness: 'But the Lord saith, No servant can serve two masters. If we desire to serve both God and mammon, it is unprofitable for us:


    For what advantage is it, if a man gain the whole world and forfeit his soul?


    Now this age and the future are two enemies.


    The one speaketh of adultery and defilement and avarice and deceit, but the other biddeth farewell to these.


    We cannot therefore be friends of the two, but must bid farewell to the one and hold companionship with the other.


    Let us consider that it is better to hate the things which are here, because they are mean and for a short time and perishable, and to love the things which are there, for they are good and imperishable.


    For, if we do the will of Christ, we shall find rest; but if otherwise, then nothing shall deliver us from eternal punishment, if we should disobey His commandments.


    And the scripture also saith in Ezekiel, Though Noah and Job and Daniel should rise up, they shall not deliver their children in the captivity.


    But if even such righteous men as these cannot by their righteous deeds deliver their children, with what confidence shall we, if we keep not our baptism pure and undefiled, enter into the kingdom of God? Or who shall be our advocate, unless we be found having holy and righteous works?'
translation:
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
