  english_witness: 'Now I do not think that I have given any mean council respecting continence, and whosoever performeth it shall not repent thereof, but shall save both himself and me his councilor. For it is no mean reward to convert a wondering and perishing soul, that it may be saved.


    For this is the recompense which we are able to pay to God who created us, if he that speaketh and heareth both speak and hear with faith and love.


    Let is therefore abide in the things which we believed, in righteousness and holiness, that we may with boldness as of God who saith, Whiles thou art still speaking I will say, Behold, I am here.


    For this word is the token of a great promise: for the Lord saith of Himself that He is more ready to give than he that asketh to ask.


    Seeing then that we are partakers of so great kindness, let us not grudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to them that have performed them, so also is the condemnation great which they bring to them that have been disobedient.'
translation:
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
