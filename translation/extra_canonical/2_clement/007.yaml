  english_witness: 'So then, my brethren, let us contend, knowing that the contest is nigh at hand, and that, while many resort to the corruptible contests, yet not all are crowned, but only they that have toiled hard and contended bravely.


    Let us then contend that we all may be crowned.


    Wherefore let us run in the straight course, the incorruptible contest. And let us resort to it in throngs and contend, that we may also be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that he which contendeth in the corruptible contest, if he be found dealing corruptly with it, is first flogged. and then removed and driven out of the race course.


    What think ye? What shall be done to him that hath dealt corruptly with the contest of incorruption?


    For as concerning them that have not kept the seal, He saith, Their worm shall not die, and their fire shall not be quenched, and they shall be for a spectacle unto all flesh.'
translation:
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
