  english_witness: 'Let us therefore not only call Him Lord, for this will not save us:


    for He saith, Not every one that saith unto Me, Lord, shall be saved, but he that doeth righteousness.


    So then, brethren, let us confess Him in our works, by loving one another, by not committing adultery nor speaking evil one against another nor envying, but being temperate, merciful, kindly. And we ought to have fellow-feeling one with another and not to be covetous. By these works let us confess Him, and not by the contrary.


    And we ought not rather to fear men but God.


    For this cause, if ye do these things, the Lord said, Though ye be gathered together with Me in My bosom, and do not My commandments, I will cast you away and will say unto you, Depart from Me, I know you not whence ye are, ye workers of iniquity.'
translation:
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
