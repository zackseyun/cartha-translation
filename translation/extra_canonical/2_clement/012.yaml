  issues:
  - “Eagerly await” does not preserve “await ... betimes”; it substitutes eagerness for the witness’s temporal/timeliness signal.
  - The saying’s “outside as the inside” is twice strengthened/interpreted as “becomes like the inside.” The witness does not include “becomes like.”
  - “There is one soul in two bodies” changes the future/modal wording “there shall be one soul in two bodies.”
  - The draft recasts the compact phrase “the male with the female, neither male nor female” as a predication (“is neither ...”), rather than retaining the witness’s wording/ellipsis.
