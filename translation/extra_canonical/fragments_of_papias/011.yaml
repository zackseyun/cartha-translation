  verdict: revise
  issues:
  - The draft silently normalizes several visibly defective or lacunary witness readings (for example, “ne,” “lave,” “our,” “urn,” the damaged Papias notice, and “forbt:”). Restorations must be marked rather than presented as uninterrupted text.
  - “Peaceful and harmonious with one another” adds a relational qualification not stated in the witness, which says only that the animals will become “peaceable and harmonious.”
  - The draft recasts Judas’s question as “How will the Lord accomplish such growth?” The witness instead asks how “such growths” shall be accomplished “by the Lord”; the more exact wording should be retained.
  - The final saying changes “They shall see, who shall come to these (times)” into “Those who come to those times will see,” removing the witness’s parenthetical/restoration signal.
