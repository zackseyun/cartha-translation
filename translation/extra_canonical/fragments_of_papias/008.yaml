  english_witness: "But thus says Papias, (1 quote him) word for word :—                       4\n    To some of them, clearly the angels which at first were holy, He\ngave dominion also over the arrangement of the universe,                       ar\nHe commissioned them to exercise their dominion well.\n    And he says next :—\n    But it so befel that their array came to nought; for the gre:\ndragon, the old serpent, who is also called Satan and the devi\nwas cast down, yea, and was cast down to the earth, he and h\nangels.                                                              1a       ee\n                   ANDREAS   OF CASAREA      in Afpocalypsin c. 34 serm. 12."
translation:
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
