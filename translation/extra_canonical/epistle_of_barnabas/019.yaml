  english_witness: 'This then is the way of light, if anyone desiring to travel on the way to his appointed place would be zealous in his works. The knowledge then which is given to us whereby we may walk therein is as follows.


    Thou shalt love Him that made thee, thou shalt fear Him that created thee, thou shalt glorify Him that redeemed thee from death; thou shalt be simple in heart and rich in spirit; thou shalt not cleave to those who walk the way of death; thou shalt hate everything that is not pleasing to God; thou shalt hate all hypocrisy; thou shalt never forsake the commandments of the Lord.


    Thou shalt not exalt thyself, but shalt be lowly minded in all things. Thou shalt not assume glory to thyself. Thou shalt not entertain a wicked design against thy neighbor; thou shalt not admit boldness into thy soul.


    Thou shalt not commit fornication, thou shalt not commit adultery, thou shalt not corrupt boys. The word of God shall not come forth from thee where any are unclean. Thou shalt not make a difference in a person to reprove him for a transgression. Thou shalt be meek, thou shalt be quiet, thou shalt be fearing the words which thou hast heard. Thou shalt not bear a grudge against thy brother.


    Thou shalt not doubt whether a thing shall be or not be. Thou shalt not take the name of the Lord in vain. Thou shalt love thy neighbor more than thine own soul. Thou shalt not murder a child by abortion, nor again shalt thou kill it when it is born. Thou shalt not withhold thy hand from thy son or daughter, but from their youth thou shalt teach them the fear of God.


    Thou shalt not be found coveting thy neighbors goods; thou shalt not be found greedy of gain. Neither shalt thou cleave with thy soul to the lofty, but shalt walk with the humble and righteous. The accidents that befall thee thou shalt receive as good, knowing that nothing is done without God. Thou shalt not be double minded nor double tongued.


    Thou shalt be subject unto thy masters as to a type of God in shame and fear. Thou shalt not command in bitterness thy bondservant or thine handmaid who set their hope on the same God, lest haply, they should cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit hath prepared.


    Thou shalt make thy neighbor partake in all things, and shalt not say that anything is thine own. For if ye are fellow partakers in that which is imperishable, how much rather shall ye be in the things which are perishable. Thou shalt not be hasty with thine own tongue, for the mouth is the snare of death. So far as thou art able, thou shalt be pure for thy soul''s sake.


    Be not thou found holding out thy hands to receive, and drawing them in to give. Thou shalt love as the apple of thine eye every one that speaketh unto thee the word of the Lord.


    Thou shalt remember the day of judgment night and day, and thou shalt seek out day by day the persons of the saints, either laboring by word and going to exhort them and meditating how thou mayest save souls by thy word, or thou shalt work with thy hands for a ransom for thy sins.


    Thou shall not hesitate to give, neither shalt thou murmur when giving, but thou shalt know who is the good paymaster of thy reward. Thou shalt keep those things which thou hast received, neither adding to them nor taking away from them. Thou shalt utterly hate the Evil One. Thou shalt judge righteously.


    Thou shalt not make a schism, but thou shalt pacify them that contend by bringing them together. Thou shalt confess thy sins. Thou shalt not betake thyself to prayer with an evil conscience. This is the way of light.'
translation:
  text: 'This, then, is the way of light: if anyone desires to travel on the way to his appointed place, he should be zealous in his works. The knowledge given to us, by which we may walk in it, is as follows.


    You shall love the One who made you. You shall fear the One who created you. You shall glorify the One who redeemed you from death. You shall be simple in heart and rich in spirit. You shall not cleave to those who walk the way of death. You shall hate everything that is not pleasing to God. You shall hate all hypocrisy. You shall never forsake the commandments of the Lord.


    You shall not exalt yourself, but shall be lowly minded in all things. You shall not assume glory for yourself. You shall not entertain a wicked design against your neighbor. You shall not admit boldness into your soul.


    You shall not commit fornication. You shall not commit adultery. You shall not corrupt boys. The word of God shall not come forth from you where any are unclean. You shall not make a difference in a person when reproving him for a transgression. You shall be meek. You shall be quiet. You shall fear the words you have heard. You shall not bear a grudge against your brother.


    You shall not doubt whether a thing shall be or not be. You shall not take the name of the Lord in vain. You shall love your neighbor more than your own soul. You shall not murder a child by abortion, nor shall you kill it when it is born. You shall not withhold your hand from your son or daughter, but from their youth you shall teach them the fear of God.


    You shall not be found coveting your neighbor''s goods. You shall not be found greedy for gain. Neither shall you cleave with your soul to the lofty, but you shall walk with the humble and righteous. You shall receive the accidents that befall you as good, knowing that nothing is done without God. You shall not be double-minded or double-tongued.


    You shall be subject to your masters as to a type of God, in shame and fear. You shall not command your bondservant or handmaid in bitterness, though they set their hope on the same God, lest perhaps they cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit has prepared.


    You shall make your neighbor partake in all things, and shall not say that anything is your own. For if you are fellow partakers in that which is imperishable, how much rather shall you be in the things that are perishable? You shall not be hasty with your own tongue, for the mouth is the snare of death. So far as you are able, you shall be pure for your soul''s sake.


    Do not be found holding out your hands to receive and drawing them in to give. You shall love as the apple of your eye everyone who speaks to you the word of the Lord.


    You shall remember the day of judgment night and day, and day by day you shall seek out the persons of the saints, either laboring by word and going to exhort them and meditating how you may save souls by your word, or working with your hands for a ransom for your sins.


    You shall not hesitate to give, nor shall you murmur when giving, but you shall know who is the good paymaster of your reward. You shall keep the things you have received, neither adding to them nor taking away from them. You shall utterly hate the Evil One. You shall judge righteously.


    You shall not make a schism, but shall pacify those who contend by bringing them together. You shall confess your sins. You shall not betake yourself to prayer with an evil conscience. This is the way of light.'
