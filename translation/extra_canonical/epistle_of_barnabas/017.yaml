  english_witness: 'So far as it was possible with all simplicity to declare it unto you, my soul hopeth that I have not omitted anything [of the matters pertaining unto salvation and so failed in my desire].


    For if I should write to you concerning things immediate or future, ye would not understand them, because they are put in parables. So much then for this.'
translation:
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
