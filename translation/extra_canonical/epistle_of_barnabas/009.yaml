  english_witness: 'Furthermore He saith concerning the ears, how that it is our heart which He circumcised. The Lord saith in the prophet; With the hearing of the ears they listened to Me. And again He saith; They that are afar off shall hear with their ears, and shall perceive what I have done. And; Be ye circumcised in your hearts, saith the Lord.


    And again He saith; Hear, O Israel, for thus saith the Lord thy God. Who is he that desireth to live forever, let him hear with his ears the voice of My servant. ~y And again He saith; Hear, O heaven, and give ear, O earth, for the Lord hath spoken these things for a testimony. And again He saith; Hear the words of the Lord, ye rulers of this people. And again He saith; Hear, O my children, the voice of one crying in the wilderness. Therefore He circumcised our ears, that hearing the word we might believe.


    But moreover the circumcision, in which they have confidence, is abolished; for He hath said that a circumcision not of the flesh should be practiced. But they transgressed, for an evil angel taught them cleverness.


    He saith unto them; Thus saith the Lord your God (so I find the commandment); sow not upon thorns, be ye circumcised in to your Lord. And what saith He? Be ye circumcised in the hardness of your heart; and then ye will not harden your neck. Take this again; Behold, sayith the Lord, all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.


    But thou wilt say; In truth the people hath been circumcised for a seal. Nay, but so likewise is every Syrian and Arabian and all the priests of the idols. Do all those then too belong to their covenant? Moreover the Egyptians also are included among the circumcised.


    Learn therefore, children of love, concerning all things abundantly, that Abraham, who first appointed circumcision, looked forward in the spirit unto Jesus, when he circumcised having received the ordinances of three letters.


    For the scripture saith; And Abraham circumcised of his household eighteen males and three hundred. What then was the knowledge given unto him? Understand ye that He saith the eighteen first, and then after an interval three hundred In the eighteen ''I'' stands for ten, ''H'' for eight. Here thou hast JESUS (IHSOYS). And because the cross in the ''T'' was to have grace, He saith also three hundred. So He revealeth Jesus in the two letters, and in the remaining one the cross.


    He who placed within us the innate gift of His covenant knoweth; no man hath ever learnt from me a more genuine word; but I know that ye are worthy.'
translation:
  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
