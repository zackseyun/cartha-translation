  english_witness: 'But let us pass on to another lesson and teaching. There are two ways of teaching and of power, the one of light and the other of darkness; and there is a great difference between the two ways. For on the one are stationed the light giving angels of God, on the other the angels of Satan.


    And the one is the Lord from all eternity and unto all eternity, whereas the other is Lord of the season of iniquity that now is.'
translation:
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
