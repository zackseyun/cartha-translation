  verdict: revise
  issues:
  - location: Prophecy of ten reigns
    issue: The draft changes “Ten reigns shall reign” to “Ten kingdoms will reign.” This substitutes a different subject for the witness’s wording and should be retained more closely.
  - location: Master's beloved and inheritance
    issue: The draft renders “come into his inheritance,” while the witness reads “come to His inheritance.” The witness’s pronoun/reference should remain visible rather than being recast.
  - location: Instruction against standing apart
    issue: “Do not enter secretly and stand apart” can prohibit secret entry itself. The witness’s wording, “Do not entering in privily stand apart,” more specifically qualifies standing apart and should be preserved more closely.
