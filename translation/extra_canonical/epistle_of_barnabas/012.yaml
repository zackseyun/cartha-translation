source:
  text: |-
    In like manner again He defineth concerning the cross in another prophet, who saith; And when shall these things be accomplished? saith the Lord. Whenever a tree shall be bended and stand upright, and whensoever blood shall drop from a tree. Again thou art taught concerning the cross, and Him that was to be crucified.

    And He saith again in Moses, when war was waged against Israel by men of another nation, and that He might remind them when the war was waged against them that for their sins they were delivered unto death; the Spirit saith to the heart of Moses, that he should make a type of the cross and of Him that was to suffer, that unless, saith He, they shall set their hope on Him, war shall be waged against them for ever. Moses therefore pileth arms one upon another in the midst of the encounter, and standing on higher ground than any he stretched out his hands, and so Israel was again victorious. Then, whenever he lowered them, they were slain with the sword.

    Wherefore was this? That they might learn that they cannot be saved, unless they should set their hope on Him.

    And again in another prophet He saith; The whole day long have I stretched out My hands to a disobedient people that did gainsay My righteous way.

    Again Moses maketh a type of Jesus, how that He must suffer, and that He Himself whom they shall think to have destroyed shall make alive in an emblem when Israel was falling. For the Lord caused all manner of serpents to bite them, and they died (forasmuch as the transgression was wrought in Eve through the serpent), that He might convince them that by reason of their transgression they should be delivered over to the affliction of death.

    Yea and further though Moses gave the commandment; Ye shall not have a molten or a carved image for your God, yet he himself made one that he might show them a type of Jesus. So Moses maketh a brazen serpent, and setteth it up conspicuously, and summoneth the people by proclamation.

    When therefore they were assembled together they entreated Moses that he should offer up intercession for them that they might be healed. And Moses said unto them; Whensoever, said he, one of you shall be bitten, let him come to the serpent which is placed on the tree, and let him believe and hope that the serpent being himself dead can make alive; and forthwith he shall be saved. And so they did. Here again thou hast in these things also the glory of Jesus, how that in Him and unto Him are all things.

    What again saith Moses unto Jesus (Joshua) the son of Nun, when he giveth him this name, as being a prophet, that all the people might give ear to him alone, because the Father revealeth all things concerning His Son Jesus?

    Moses therefore saith to Jesus the son of Nun, giving him this name, when he sent him as a spy on the land; Take a book in thy hands, and write what the Lord saith, how the Son of God shall cut up by the roots all the house of Amalek in the last days.

    Behold again it is Jesus, not a son of man, but the Son of God, and He was revealed in the flesh in a figure. Since then men will say that Christ is the son of David, David himself prophesieth being afraid and understanding the error of sinners; The Lord said unto my Lord, Sit thou on My right hand until I set thine enemies for a footstool under Thy feet.

    And again thus sayith Isaiah; The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before Him, and I will break down the strength of kings. See how David calleth Him Lord, and calleth Him not Son.
