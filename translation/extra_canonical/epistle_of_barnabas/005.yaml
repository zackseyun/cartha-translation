  english_witness: 'For to this end the Lord endured to deliver His flesh unto corruption, that by the remission of sins we might be cleansed, which cleansing is through the blood of His sprinkling.


    For the scripture concerning Him containeth some things relating to Israel, and some things relating to us. And it speaketh thus; He was wounded for your transgressions, and He hath been bruised for our sins; by His stripes we were healed. As a sheep He was led to slaughter, as a lamb is dumb before his shearer.


    We ought therefore to be very thankful unto the Lord, for that He both revealed unto us the past, and made us wise in the present, and as regards the future we are not without understanding.


    Now the scripture saith; Not unjustly is the net spread for the birds. He meaneth this that a man shall justly perish, who having the knowledge of the way of righteousness forceth himself into the way of darkness.


    There is yet this also, my brethren; if the Lord endured to suffer for our souls, though He was Lord of the whole world, unto whom God said from the foundation of the world, Let us make man after our image and likeness, how then did He endure to suffer at the hand of men?


    Understand ye. The prophets, receiving grace from Him, prophesied concerning Him. But He Himself endured that He might destroy death and show forth the resurrection of the dead, for that He must needs be manifested in the flesh;


    that at the same time He might redeem the promise made to the fathers, and by preparing the new people for Himself might show, while He was on earth, that having brought about the resurrection He will Himself exercise judgment.


    Yea and further, He preached teaching Israel and performing so many wonders and miracles, and He loved him exceedingly.


    And when He chose His own apostles who were to proclaim His Gospel, who that He might show that He came not to call the righteous but sinners were sinners above every sin, then He manifested Himself to be the Son of God.


    For if He had not come in the flesh neither would men have looked upon Him and been saved, forasmuch as when they look upon the sun that shall cease to be, which is the work of His own hands, they cannot face its rays.


    Therefore the Son of God came in the flesh to this end, that He might sum up the complete tale of their sins against those who persecuted and slew His prophets.


    To this end therefore He endured. For God saith of the wounds of His flesh that they came from them; When they shall smite their own shepherd, then shall the sheep of the flock be lost.


    But He Himself desired so to suffer; for it was necessary for Him to suffer on a tree. For he that prophesied said concerning Him, Spare My soul form the sword; and, Pierce My flesh with nails, for the congregations of evil-doers have risen up against Me.


    And again He saith; Behold I have given My back to stripes, and My cheeks to smitings, and My face did I set as a hard rock.'
translation:
  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
