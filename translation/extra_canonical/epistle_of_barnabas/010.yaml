  issues:
  - location: Opening dietary list
    issue: The draft silently changes the witness's “seine” to “swine.” Since the supplied witness reads “seine,” any emendation should be marked rather than silently adopted.
  - location: Interpretation of divided hoof
    issue: “The meaning of the word” weakens the witness's more specific “the distinction of the word.” The distinction should remain visible.
  - location: Final paragraph
    issue: “Explain them” replaces the witness's “tell them,” and “rightly understood” replaces “justly perceived.” The revised wording should preserve the witness's stated claim more closely.
  - location: Command concerning hoof and cud
    issue: The witness omits the verb after “Ye shall”; the draft silently supplies “eat.” If supplied for sense, it should be visibly bracketed.
