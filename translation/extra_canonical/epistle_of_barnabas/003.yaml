  english_witness: 'He speaketh again therefore to them concerning these things; Wherefore fast ye for Me, saith the Lord, so that your voice is heard this day crying aloud? This is not the fast which have chosen, saith the Lord; not a man abasing his soul;


    not though ye should bend your neck as a hoop, and put on sackcloth and make your bed of ashes, not even so shall ye call a fast that is acceptable.


    But unto us He saith; Behold, this is the fast which I have chosen, saith the Lord; loosen every band of wickedness, untie the tightened cords of forcible contracts, send away the broken ones released and tear in pieces every unjust bond. Break thy bread to the hungry, and if thou seest one naked clothe him; bring the shelterless into thy house, and if thou seest a humble man, thou shalt not despise him, neither shall any one of thy household and of thine own seed.


    Then shall thy light break forth in the morning, and thy healing shall arise quickly, and righteousness shall go forth before thy face, and the glory of God shall environ thee.


    Then shalt thou cry out and God shall hear thee; while thou art still speaking, He shall say ''Lo, I am here''; if thou shalt take away from thee the yoke and the stretching forth of the finger and the word of murmuring, and shalt give thy bread to the hungry heartily, and shalt pity the abased soul.


    To this end therefore, my brethren, He that is long-suffering, foreseeing that the people whom He had prepared in His well-beloved would believe in simplicity, manifested to us beforehand concerning all things, that we might not as novices shipwreck ourselves upon their law.'
translation:
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
