  english_witness: 'Yea verily, but as regards the covenant which He swear to the fathers to give it to the people let us see whether He hath actually given it. He hath given it, but they themselves were not found worthy to receive it by reason of their sins.


    For the prophet saith; And Moses was fasting in Mount Sinai forty days and forty nights, that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tables which were written by the finger of the hand of the Lord in the spirit. And Moses took them, and brought them down to give them to the people.


    And the Lord said unto Moses; Moses, Moses, come down quickly; for thy people, whom thou leddest forth from the land of Egypt, hath done wickedly. And Moses perceived that they had made for themselves again molten images, and he cast them out of his hands and the tables of the covenant of the Lord were broken in pieces.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Mark this. Moses received them being a servant, but the Lord himself gave them to us to be the people of His inheritance, having endured patiently for our sakes.


    But He was made manifest, in order that at the same time they might be perfected in their sins, and we might receive the covenant through Him who inherited it, even the Lord Jesus, who was prepared beforehand hereunto, that appearing in person He might redeem out of darkness our hearts which had already been paid over unto death and delivered up to the iniquity of error, and thus establish the covenant in us through the word.


    For it is written how the Father chargeth Him to deliver us from darkness, and to prepare a holy people for Himself.


    Therefore saith the prophet; I the Lord thy God called thee in righteousness, and I will lay hold of thy hand and will strengthen thee, and I have given thee to be a covenant of the race, a light to the Gentiles, to open the eyes of the blind, and to bring forth them that are bound from their fetters, and them that sit in darkness from their prison house. We perceive then whence we were ransomed.


    Again the prophet saith; Behold I have set Thee to be a light unto the Gentiles, that Thou shouldest be for salvation unto the ends of the earth; thus saith the Lord that ransomed thee, even God.


    Again the prophet saith; The Spirit of the Lord is upon Me, wherefore He anointed Me to preach good tidings to the humble; He hath sent Me to heal them that are broken-hearted, to preach release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of recompense, to comfort all that mourn.'
translation:
  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
