  english_witness: '(25) Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, "Woe to our sins. The judgment and the end of Jerusalem is near!"


    (26) But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. (27) On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
