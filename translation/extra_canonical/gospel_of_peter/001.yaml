  english_witness: (1) But of the Jews no one washed the hands, neither Herod nor one of his judges, and when they didn't want to wash Pilate stood up. (2) And then Herod the king, commanding the Lord to be brought, said to them, "Do whatever I commanded you to do to him."
translation:
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
