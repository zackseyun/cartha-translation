  english_witness: (34) Now when the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went that they might see the grave that had been sealed. (35) But during the night before the Lord's day dawned, while the soldiers were watching two by two as guards, there was a great voice in heaven. (36) And they saw the heavens being opened, and two men descended from there, having much radiance, and they approached the tomb. (37) But that stone which had been placed at the door rolled away by itself, and made way in part, and the tomb was opened, and both the young men went in.
translation:
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
