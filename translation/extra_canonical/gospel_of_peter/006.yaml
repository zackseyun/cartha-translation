translation:
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
