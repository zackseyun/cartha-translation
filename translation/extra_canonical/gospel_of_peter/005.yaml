  english_witness: '(15) And it was mid-day, and darkness held fast over all Judea. And they were troubled and distressed lest the sun set, since he was still living. It''s written to them, "The sun shouldn''t set on one who''s been killed." (16) And one of them said, "Give him bile with sour wine to drink." And having mixed it, they gave it to him to drink. (17) And they fulfilled all things and accumulated the sins on their head. (18) And many were going around with lanterns, thinking it was night, and some fell down.


    (19) And the Lord cried out, saying, "My Power, the Power, you''ve left me!" And when he said this, it was taken up. (20) And that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
