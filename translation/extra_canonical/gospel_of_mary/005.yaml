  english_witness: 'In response Andrew said to the brothers (and sisters), ''Say what you will about what she''s said, I myself don''t believe that the Savior said these things, because these teachings seem like different ideas."


    In response Peter spoke out with the same concerns. He asked them concerning the Savior: "He didn''t speak with a woman without our knowledge and not publicly with us, did he? Will we turn around and all listen to her? Did he prefer her to us?"


    Then Mary wept and said to Peter, "My brother Peter, what are you thinking? Do you really think that I thought this up by myself in my heart, or that I''m lying about the Savior?"


    In response Levi said to Peter, "Peter, you''ve always been angry. Now I see you debating with this woman like the adversaries. But if the Savior made her worthy, who are you then to reject her? Surely the Savior knows her very well. That''s why he loved her more than us.


    "Rather we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, not laying down any other rule or other law beyond what the Savior said."


    When [Levi said these things], they started to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
