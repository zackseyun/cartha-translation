translation:
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
