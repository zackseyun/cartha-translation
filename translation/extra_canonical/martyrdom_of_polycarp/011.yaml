  english_witness: 'But on his persisting again and saying, ''Swear by the genius of Caesar,'' he answered, ''If thou supposest vainly that I will swear by the genius of Caesar, as thou sayest, and feignest that thou art ignorant who I am, hear thou plainly, I am a Christian. But if thou wouldest learn the doctrine of Christianity, assign a day and give me a hearing.''


    The proconsul said; ''Prevail upon the people.'' But Polycarp said; ''As for thyself, I should have held thee worthy of discourse; for we have been taught to render, as is meet, to princes and authorities appointed by God such honor as does us no harm; but as for these, I do not hold them worthy, that I should defend myself before them.'''
translation:
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
