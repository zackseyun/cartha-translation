  english_witness: 'So taking the lad with them, on the Friday about the supper hour, the gendarmes and horsemen went forth with their accustomed arms, hastening as against a robber. And coming up in a body late in the evening, they found the man himself in bed in an upper chamber in a certain cottage; and though he might have departed thence to another place, he would not, saying, The will of God be done.


    So when he heard that they were come, he went down and conversed with them, the bystanders marvelling at his age and his constancy, and wondering how there should be so much eagerness for the apprehension of an old man like him. Thereupon forthwith he gave orders that a table should be spread for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour that he might pray unmolested;


    and on their consenting, he stood up and prayed, being so full of the grace of God, that for two hours he could not hold his peace, and those that heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
