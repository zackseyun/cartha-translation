  english_witness: 'Now the glorious Polycarp at the first, when he heard it, so far from being dismayed, was desirous of remaining in town; but the greater part persuaded him to withdraw. So he withdrew to a farm not far distant from the city; and there he stayed with a few companions, doing nothing else night and day but praying for all men and for the churches throughout the world; for this was his constant habit.


    And while praying he falleth into a trance three days before his apprehension; and he saw his pillow burning with fire. And he turned and said unto those that were with him: ''It must needs be that I shall be burned alive.'''
translation:
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
