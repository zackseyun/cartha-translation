translation:
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
