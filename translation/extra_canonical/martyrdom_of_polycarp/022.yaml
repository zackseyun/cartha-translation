  english_witness: Now the blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh before the calends of March, on a great Sabbath, at the eighth hour. He was apprehended by Herodes, when Philip of Tralles was high priest, in the proconsulship of Statius Quadratus, but in the reign of the Eternal King Jesus Christ. To whom be the glory, honor, greatness, and eternal throne, from generation to generation. Amen.
translation:
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
