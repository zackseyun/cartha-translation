  english_witness: 'The Savior said to his disciples: “Brothers, the time has now arrived for us to stop our work and stand at rest, because whoever stands at rest will rest forever. I say to you, transcend always [. . .] temporality [. . .]. [I say] to you, [. . .] fear [not those . . .] you. I [say to you], anger is fearsome [and whoever] provokes anger is a [fearsome person]. Because, however, you have [been able to suffer], it might come forth from [you . . .].


    “The people have accepted these sayings concerning anger with fear and trembling. Anger appointed archons over them, because no one can avoid anger. When I came, however, I opened a path and instructed people concerning the way of crossing over for the elect and solitary, [] those who have known the Father and who have been faithful to truth, and you offered up praise.'
translation:
  text: 'The Savior said to his disciples: “Brothers, the time has now arrived for us to stop our work and stand at rest, because whoever stands at rest will rest forever. I say to you, transcend always [. . .] temporality [. . .]. [I say] to you, [. . .] fear [not those . . .] you. I [say to you], anger is fearsome [and whoever] provokes anger is a [fearsome person]. Because, however, you have [been able to suffer], it might come forth from [you . . .].


    “The people have accepted these sayings concerning anger with fear and trembling. Anger appointed archons over them, because no one can avoid anger. When I came, however, I opened a path and instructed people concerning the way of crossing over for the elect and solitary, [] those who have known the Father and who have been faithful to truth, and you offered up praise.”'
