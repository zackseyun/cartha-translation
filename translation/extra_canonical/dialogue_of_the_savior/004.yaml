  english_witness: 'Matthew said: “How [. . .]?”


    [] The Savior said: “[If you do not maintain in order] what is inside you, [your work] will survive, but [not] you.”


    Judas [said]: “Lord, [I would like to know all] the deeds of the souls [that belong to] these little ones. When [. . .], where will they dwell? [. . .] the spirit [. . .]?”


    The Lord [said: “. . . accept] them. They neither die nor are destroyed, because they have understood [their] companions and the one who will accept them, because the truth seeks the wise and the righteous.”


    The Savior [said]: “The lamp [of the] body is the mind. While [what is inside] you is maintained in order, namely, [the soul], your bodies will be [illuminated]. While your hearts are darkened, your light that you [] hope for [will remain far away from you]. I have called [you to myself], because I will soon leave, in order that [you might accept] my word among [you. Behold], I send it to [you].”'
