  issues:
  - The restored reading in the fire saying is altered from “One who [understands] not” to “One who does [not understand].” Retain the witness’s bracketed restoration and its placement.
  - “what does it profit such a person to be baptized therein?” is substantively recast as “what does such a person gain by being baptized in it?” Preserve the witness’s stated claim.
  - The witness says the person will be “blown away together with it” and “destroyed together with it”; the draft reduces both to “with it.” Retain “together with”.
