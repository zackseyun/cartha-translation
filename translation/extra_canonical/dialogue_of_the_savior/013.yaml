  issues:
  - The draft removes the witness’s parenthetical restoration signal in “the [rest] the world (gives).”
  - Several renderings alter the supplied wording or emphasis, including “looks for” to “seeks,” “this will be their wealth” to “will have this as their wealth,” “any circumstance” to “every circumstance,” and “will be completed” to “may be completed.”
  - The battle saying changes “has beheld” to “has seen,” adds “his own” before “eyes,” and replaces the witness’s lacunose “[he]” in “has [he] been killed” with “[been].” The witness’s restoration signal and wording should remain visible.
  - “If only one of these” is changed to “If even one of these,” altering the stated condition.
  - Additional substantive or potentially interpretive substitutions occur, including “concerning” to “about,” “which place” to “what place,” “set up” to “arranged,” “one thing only will I [say]” to “I will [say] only one thing,” “with what kind of garments ... clothed” to “what kind of garments ... wear,” and “come forth victorious” to “emerged victorious.”
  - The revised rendering should retain the witness’s phrasing where possible, particularly where its wording, brackets, parentheses, and ellipses mark uncertainty or restoration.
