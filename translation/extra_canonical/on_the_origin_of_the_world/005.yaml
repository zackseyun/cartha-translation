  english_witness: 'When the heavens had established themselves together with their hosts and all of their government, the Primal Parent grew arrogant, and he was worshiped by the entire host of angels, and all the gods and their angels offered praise and worship to him, and he was elated, and repeatedly bragged, saying to them: “I am self-sufficient.”


    He said, “I am the one who is God, and except me there is nothing else that exists,” and when he had said this, he transgressed against all the deathless ones who use verbal articulation, and they accused him over it.


    When Pistis then witnessed the impiety of the chief archon, she became enraged. She who was unseen said: “You are in error, Samael,” that is, “Blind God.” “There is a deathless man of light who existed before you did, and he will become manifest among the forms you have shaped. He will tread on you in scorn, like a potter’s vessel is tread upon, and you will plummet down to your mother, the Abyss, together with those who are your own, because at the completion of all of your works, the whole deficiency that has been exposed by the truth will be abrogated, and its existence will end, and it will be as though it had never been.”


    Upon saying this, Pistis manifested the likeness of her greatness in the waters, and having done this, she retreated back up into her light.'
translation:
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
