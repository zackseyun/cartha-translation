  english_witness: 'As an androgynous entity, Eros appeared from out of that primal blood. His masculine element is Himireris, [8] which is fire from light. His feminine element that dwells together with him, a soul consisting of blood, originates from the substance of Pronoia. He is quite lovely in his beauty, possessing a charm surpassing all the created entities of Chaos.


    All the gods then, and their angels, when they gazed on Eros, fell in love with him, and manifesting himself inside [9] of all of them, he set them ablaze, just like several lamps are lit from a single lamp, even one and the same light is present, yet the lamp is not diminished, and in this way Eros dispersed himself inside all of the created entities of Chaos, and was not diminished. Just like Eros appeared at the center of light and darkness, and (just like) the sexual union of Eros was consummated at the center of the angels and humanity, so from out of the earth the primal pleasure [10] bloomed. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted up from out of that blood shed onto the earth. On account of this, those who imbibe it generate desire for sexual union.


    After the grapevine, a fig tree as well as a pomegranate tree sprouted up from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
