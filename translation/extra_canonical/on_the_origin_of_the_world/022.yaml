  english_witness: 'When the archons then realized that (Adam and Eve) had broken their commandments (to them), they arrived in Paradise and approached Adam and Eve, accompanied by an earthquake and big threats, to see the result of their support. Adam and Eve then shook violently and hid beneath the trees in Paradise. The archons then were unaware of where they were, and said: “Adam, where are you?”


    He said: “Here I am, because out of fear of you I hid, being embarrassed,” and they said to him in ignorance: “Who informed you of the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said: “The woman you gave to me, she is the one who gave to me, and I ate.”


    They said then to the latter: [] “What have you done?”


    She answered, and said: “The teacher is the one who incited, and I ate.”


    The archons then approached the teacher. Their eyes grew foggy on account of him, and they were unable to do anything against him. They cursed him, given that they were powerless.


    After this, they approached the woman and cursed her as well as her descendants.


    After the woman, they cursed Adam, as well as the land, on account of him, the crops also, and they cursed everything they had created. They possess no blessing. Good cannot be the consequence of evil.


    From that day, the authorities truly realized there was something more powerful than they.


    They knew only that their commandments had not been observed. A tremendous jealousy was introduced into the world solely on account of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to put him to the test, and they assembled together every tame animal and the wild beasts of the earth, as well as the birds of heaven, and brought them in front of Adam, in order to learn what he would call them. When he had seen them, he assigned names to their creatures.


    They grew disturbed on account of Adam recovering from every test. They gathered and concocted schemes, and they said: “Behold Adam! He has become like one of us, in that he knows the difference between light and darkness. Perhaps now he will be fooled, as is the case with the tree of knowledge, and will even approach the tree of life, and eat of it, and become deathless, and become lord, and loathe us and despise us, as well as all of our glory. He will then condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from where he was taken, in order that from now on he will be unable to know anything superior to what we are capable of.” And in this way, they banished Adam from Paradise, together with his wife, and this act they perpetrated was not sufficient for them. Instead, they grew fearful.


    They entered (Paradise, approaching) the tree of life, and enclosed it with large fearsome entities, fiery living creatures called “Cherubin,” and they placed a flaming sword among them, fearsomely rotating continuously, to prevent any earthly being ever entering that place.


    Given that the archons grew jealous of Adam, they desired to shorten their lifespans. They were unable, on account of fate, which had been set from the beginning, because to each one a lifespan of 1,000 years had been assigned, in agreement with the orbit of the radiant bodies. However, even though the archons were unable to accomplish this, each one of the perpetrators of evil subtracted ten years, and the full lifespan reached to 930 years, and these pass in suffering, and feebleness, and malevolent disruption, and this is the way life has been, from that day, until the consummation of the age.'
translation:
  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
