translation:
  text: 'Then the Primal Parent gave those who dwelt with him an opinion regarding the man. Each one of them then cast his sperm into the center of the navel of the earth.


    From that day, the seven archons fashioned man together with his body to resemble their own body, yet his likeness resembled the man who had appeared to them. His shaping occurred one part at a time, and their leader formed the brain as well as the nervous system.


    Afterward, he appeared like the one who had existed prior to him. He became [] a man possessing a soul, and he was called Adam, that is, “Father,” in accord with the name of the one who had existed prior to him. When they had completed Adam, he forsook him like a lifeless vessel, since he had taken on form like an abortion, without a spirit inside him.


    When the chief archon recalled the speech of Pistis, he feared that the true man might enter into his shaped form and become its lord. This is why he departed from his shaped form for forty days; it then lacked a soul. He retreated and forsook it.


    On the fortieth day, Sophia Zoe sent her breath into Adam, who was without soul. He began to move on the ground, and he was unable to stand erect.


    Next, when the seven archons arrived, they saw him and became deeply troubled. They approached him and seized him, and he spoke to the breath inside him: “Who are you? And from where did you come to here?”


    It answered and said: “I have come from the force of the man in order to ruin your work.” Upon hearing this, they glorified him, because he granted them respite from the fear and the apprehension in which they found themselves.


    They then called that day “Rest,” because they had rested from work. When they saw that Adam was able to stand erect, they rejoiced, and they took him and placed him inside Paradise, and they retreated up to their heavens.'
