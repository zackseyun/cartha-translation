  english_witness: 'When Sabaoth, the son of Yaldabaoth, had heard the voice of Pistis, he sang praises to her, and he denounced his father [and mother] [] at the bidding of Pistis, and he praised her on account of her having taught them concerning the deathless man and his light. Pistis Sophia next pointed her finger and poured onto him some of the light from her (own) light, as a denunciation of his father. When Sabaoth had been illuminated, he obtained great authority against all the hosts of Chaos. From that day, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss, and hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters, and on account of his light, all of the authorities of Chaos grew jealous of him, and when they had become troubled, they waged a great war in the seven heavens.


    When Pistis Sophia then had witnessed the war, from her light she sent out seven archangels to Sabaoth. They bore him up to the seventh heaven. They stood in front of him as attendants. She furthermore sent to him three additional archangels, and established for him the kingdom that is over everyone, in order that he could dwell over the twelve gods of Chaos.


    Now, when Sabaoth had taken over the dwelling-place of rest as recompense for his repentance, Pistis gave him her daughter Zoe as well, together with great authority, in order that she could teach him concerning everything that exists in the eighth heaven, and because he possessed authority, before all else he constructed a palace for himself. It is immense, magnificent, seven times larger than all those that exist in the seven heavens, and in front of [] his palace he created a throne, which was immense, and which stood on a four-faced chariot called “Cherubin.”


    The Cherubin possess eight shapes on each of the four corners: lion forms, and calf forms, and human forms, and eagle forms, in order that all the forms have a sum of sixty-four forms, and there are seven archangels who stand in front of it. He [4] is the eighth, and he possesses authority. All the forms have the sum of seventy-two. Additionally, from this chariot the seventy-two gods derived (their) shape, in order that they could rule over the seventy-two languages of the nations, and at that throne he additionally created serpent-like angels, called “Seraphin,” which glorify him always.'
translation:
  text: 'When Sabaoth, the son of Yaldabaoth, heard the voice of Pistis, he sang praises to her. At Pistis’s command, he denounced his father [and mother] [], and he praised her because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of the light from her own light onto him, as a denunciation of his father. When Sabaoth was illuminated, he received great authority over all the hosts of Chaos. From that day on, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. Because of his light, all the authorities of Chaos became jealous of him. When they grew troubled, they waged a great war in the seven heavens.


    When Pistis Sophia witnessed the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as attendants. She also sent him three additional archangels and established for him the kingdom that is over everyone, so that he could dwell above the twelve gods of Chaos.


    Now, when Sabaoth had received the dwelling place of rest as a reward for his repentance, Pistis also gave him her daughter Zoe, together with great authority, so that she could teach him about everything that exists in the eighth heaven. Because he possessed authority, before anything else he built a palace for himself. It is immense and magnificent, seven times larger than all those that exist in the seven heavens. In front of [] his palace, he created an immense throne that stood on a four-faced chariot called “Cherubin.”


    The Cherubin have eight shapes on each of the four corners: forms of lions, calves, humans, and eagles, so that all the forms total sixty-four. Seven archangels stand in front of it. He [4] is the eighth, and he possesses authority. All the forms total seventy-two. In addition, the seventy-two gods derived their shape from this chariot so that they could rule over the seventy-two languages of the nations. At that throne he also created serpent-like angels called “Seraphin,” who always glorify him.'
