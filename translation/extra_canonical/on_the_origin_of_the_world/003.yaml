  english_witness: 'When the archon witnessed his size – and yet he saw no one but himself, seeing nothing further than water and darkness – he then imagined that he was the only one who existed. His [. . .] was completed by means of verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters, and when that spirit had become manifest, the archon separated the aqueous substance, and what was dry was separated into a different place, and out of matter he fashioned for himself a dwelling-place, and he called it “Heaven,” and out of matter the archon fashioned a footstool, and he called it “Earth.”


    A thought then occurred to the archon, agreeing with his nature, and by means of verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. Upon his eyes being opened, he gazed at his father, to whom he made the sound “eee!” His father then named him “Eee-a-o.” [1]


    He then created the second son, making a cooing sound to him, and upon opening his eyes, he made to his father the sound “eh!” His father named him “Eloai.”


    He then created the third son, making a cooing sound to him, and upon opening his eyes, he made to his father the sound “asss!” His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
