  english_witness: 'It was then reported to the authorities that their shaped form was alive and had stood up, and they were deeply disturbed. They dispatched seven archangels to learn what had transpired.


    They approached Adam. When they saw Eve speaking with him, they said to each other: “What kind of entity is this radiant woman? Because she is similar to that likeness which manifested itself to us inside the light. Come now, let us seize her and cast our seed into her, so that when she is defiled she will be unable to ascend into her light. Instead, those she gives birth to will be at our command. However, let us not inform Adam, because he is not one of us. Instead, let us put a profound sleep over him, and let us teach him while he is asleep how she originated from his rib, so that his wife will obey, and he will be lord over her.”


    Because she was a force, Eve then laughed at their decision. She made mist enter into their eyes, and covertly left her likeness with Adam.


    She entered into the tree of knowledge and lingered there, and they chased after her, and she disclosed to them that she had entered into the tree, and had become a tree. Falling then into a great fear, the blind entities escaped.


    When afterwards they had shaken off the stupor, they approached Adam, and seeing the likeness of this woman [] together with him, they were deeply troubled, believing that she was the actual Eve, and they behaved impulsively. They approached her, and seized her, and cast their seed onto her.


    They committed this in evil, defiling with natural and obscene means, first defiling the seal of her voice, [13] which had spoken with them, saying: “What existed before you?” (In this way they) meant to defile at the consummation (of the age) those who might declare that they were born of the true man by means of verbal articulation, and they went astray, being unaware that they had defiled their own body, it being the likeness the authorities and their angels defiled with every means.'
translation:
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
