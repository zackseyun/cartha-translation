  english_witness: 'Now we will move on to consider our world, so that we can with precision complete the description of its structure and governance. It will then become clear how faithfulness to the unseen aeon was found, which has been manifest from creation until the consummation of the age.


    Consequently, I arrive at the chief themes concerning the deathless man. I will discuss the beings that pertain to him, showing how it is that they are here.


    When a multitude of humans had come into existence, by the parentage of [the Adam who] [] had been made, even from out of matter, and when the world had already become fully populated, the archons were its master; that is, they maintained its bondage with ignorance. And why? For the following reason: Given that the deathless father is aware that a deficiency in truth came to exist among the aeons and their universe, when he desired to bring to nullity the archons of perdition by means of the creatures they had shaped, he dispatched your likenesses down into the world of perdition, that is, the blessed small spirits of innocence. They are not strangers to knowledge, because all of knowledge is lodged in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they straightaway reveal the structure of indestructibility as a censure of the archons and their hosts.


    In this way, when the blessed entities appeared in forms shaped by the authorities, they were envied, and out of envy the authorities joined their seed together with theirs, wishing to defile them. They were incapable of this.


    When then the blessed entities appeared in a radiant form, they appeared in several modes, and they originated from different aeons, revealing their knowledge to the church made visible by the shaped forms of perdition. She [16] was found to contain every kind of seed, on account of the seed of the authorities that had been joined [with her].


    The savior then created all of them [(as) one], and their spirits are clearly superior, being blessed [] and variously chosen, as well as several other beings having no king and being superior to all those who existed before they had.


    Four races therefore exist, three pertaining to the kings of the eighth heaven, but the fourth race being kingless, even perfect, which is the highest of them all, because these are the ones who will enter into the Holy Place of their father, and they will obtain rest together with repose, and eternal, ineffable glory, and infinite joy.


    What is more, they are kings inside the realm of death, given that they are deathless. They will censure the gods of Chaos and their hosts.'
translation:
  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
