  issues:
  - 'The draft removes witness restoration/editorial signals: “(to them),” “(own),” “(the),” “(self-),” and “(previously).” These must remain visible, as must the lacunae “[]” and “afterwards [].”'
  - “Contradicting their own (self-)interests” is reduced to “Acting against their own interests,” omitting the witness’s marked restoration and its explicit formulation.
  - “Inform the form they had shaped how to hate them” is rendered “teach the form ... how to hate them.” While related, “inform” should be retained to avoid introducing a potentially stronger instructional claim.
  - “From out of the light” is simplified to “from the light”; the witness’s wording should be retained.
