reference: 'Didascalia Apostolorum — Chapter 3: An instruction to women, that they should please and honour their husbands alone, caring diligently and wisely for the work of their houses with attention; and that they should not bathe with men; and that they should not adorn themselves and become a cause of stumbling to men and ensnare them; and that they should be chaste and quiet, and not quarrel with their husbands.'
