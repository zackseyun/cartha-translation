  english_witness: '“When Sabaoth, son of Yaldabaoth, witnessed the power of that angel, he repented and sentenced to judgment his father and Matter, his mother, whom he reviled.


    “And he sang songs of praise to Sophia above, and to her daughter Zoe. Sophia and Zoe brought him up and appointed him over the seventh heaven, under the veil that divides the upper and lower (realms). He is called ‘God of hosts, Sabaoth,’ because he is over the hosts of chaos, because Sophia appointed him.


    “When these events had transpired, Sabaoth made a massive four-faced chariot of cherubim for himself, and an infinity of angels to be his servants, as well as harps and lyres.


    “Sophia brought her daughter Zoe and caused her to sit at his right hand and to instruct him concerning the things of the eighth heaven. And she placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called ‘life,’ [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had transpired.


    “When Yaldabaoth saw Sabaoth in this great majesty and exalted so highly, he grew envious of him, and his envy became an androgynous entity. And such was the origin of Envy, who gave birth to Death, and Death gave birth to offspring, and Death appointed each of them to be in charge of its (own) heaven. And all of the heavens of the chaos were filled with their multitudes.


    “All of these events, however, transpired by the will of the Father of the All, according to the pattern of everything above, in order that the summation of chaos could be achieved.


    “Behold, I have instructed you concerning the mold of the archons, the matter in which was made manifest, as well as their parent and their world.” [8]'
translation:
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
