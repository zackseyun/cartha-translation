  issues:
  - location: The fleshly woman’s action
    issue: “She also gave some to her husband” adds “some,” which is not present in the witness. The witness states that she gave to her husband also.
  - location: The serpent’s curse
    issue: '“The serpent remained under the authorities’ curse” weakens and recasts the witness’s explicit temporal formulation: “the serpent came under the curse of the authorities, lasting [] until the Perfect Man came.” The lacunary duration signal must remain attached to the claim.'
  - location: Terminology
    issue: “Their defect” replaces the witness’s “Their blemish.” While close, “blemish” should be retained to avoid unnecessary alteration of the stated characterization.
