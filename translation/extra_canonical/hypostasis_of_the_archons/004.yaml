  english_witness: 'The archons conveyed Adam, even placing him in the garden, so that he might tend it and guard it. They ordered him, and said: “You are allowed to eat from [all] the trees in the garden, but eat not from the tree of the knowledge of good and evil. [Touch] it not, because on the day you eat from it, you certainly will die.”


    [This] they [said to him], yet they understood not what [they had said] to him. Instead, it was according to the will of the Father [] that they said this in the way they did, so that Adam would (indeed) eat, and so that Adam would <not> think of them in the way a thoroughly material man would.


    The archons schemed with one another, and said: “Come, let us cause a deep sleep to fall upon Adam,” so that Adam slept. The deep sleep they caused to fall upon him, and which he slept, is ignorance. They opened up his side, like a living woman. Then they closed up his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him, and she spoke with him, saying: “Arise, Adam.”


    When he gazed on her, he said: “You have granted me life; you will be called the Mother of the living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart talking with him, they were aroused and lusted for her. They said to one another: “Come, let us sow our semen into her,” and they pursued her. She, however, laughed at them on account of their stupidity and blindness. As they grabbed her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. And thus they brought judgment on themselves by means of the shape they had modeled in their own image.'
translation:
  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
