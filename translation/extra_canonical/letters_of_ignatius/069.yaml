  english_witness: 'My brethren, my heart overfloweth altogether in love towards you; and rejoicing above measure I watch over your safety; yet not I, but Jesus Christ, wearing whose bonds I am the more afraid, because I am not yet perfected. But your prayer will make me perfect [unto God], that I may attain unto the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the Apostles as the presbytery of the Church.


    Yea, and we love the prophets also, because they too pointed to the Gospel in their preaching and set their hope on Him and awaited Him; in whom also having faith they were saved in the unity of Jesus Christ, being worthy of all love and admiration as holy men, approved of Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
