  english_witness: 'But as touching Philo the deacon from Cilicia, a man of good report, who now also ministereth to me in the word of God, together with Rhaius Agathopus, an elect one who followeth me from Syria, having bidden farewell to this present life; the same who also bear witness to you--and I myself thank God on your behalf, because ye received them, as I trust the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren which are in Troas saluteth you; from whence also I write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and by concord. Fare ye well in Christ Jesus our common hope.'
translation:
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
