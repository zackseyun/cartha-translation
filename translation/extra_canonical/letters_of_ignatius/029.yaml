  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
translation:
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
