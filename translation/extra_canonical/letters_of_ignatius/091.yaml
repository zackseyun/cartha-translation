source:
  text: |-
    Welcoming thy godly mind which is grounded as it were on an immovable rock, I give exceeding glory that it hath been vouchsafed me to see thy blameless face,

    whereof I would fain have joy in God. I exhort thee in the grace wherewith thou art clothed to press forward in thy course and to exhort all men that they may be saved. Vindicate thine office in all diligence of flesh and of spirit. Have a care for union, than which there is nothing better. Bear all men, as the Lord also beareth thee. Suffer all men in love, as also thou doest.

    Give thyself to unceasing prayers. Ask for larger wisdom than thou hast. Be watchful, and keep thy spirit from slumbering. Speak to each man severally after the manner of God. Bear the maladies of all, as a perfect athlete. where there is more toil, there is much gain.
