  english_witness: Knowing that ye are full of God, I have exhorted you briefly. Remember me in your prayers, that I may attain unto God; and remember also the church which is in Syria, whereof I am not worthy to be called a member. For I have need of your united prayer and love in God, that it may be granted to the church which is in Syria to be refreshed by the dew of your fervent supplication.
translation:
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
