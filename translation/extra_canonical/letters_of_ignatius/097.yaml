  english_witness: 'Seeing that the church which is in Antioch of Syria hath peace, as it hath been reported to me, through your prayers, I myself also have been the more comforted since God hath banished my care; if so be I may through suffering attain unto God, that I may be found a disciple through your intercession.


    It becometh thee, most blessed Polycarp, to call together a godly council and to elect some one among you who is very dear to you and zealous also, who shall be fit to bear the name of God''s courier--to appoint him, I say, that he may go to Syria and glorify your zealous love unto the glory of God.


    A Christian hath no authority over himself, but giveth his time to God. This is God''s work, and yours also, when ye shall complete it: for I trust in the Divine grace, that ye are ready for an act of well doing which is meet for God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
