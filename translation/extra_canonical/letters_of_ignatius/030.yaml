source:
  text: |-
    Therefore as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do ye anything without the bishop and the presbyters. And attempt not to think anything right for yourselves apart from others: but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.

    Hasten to come together all of you, as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.
