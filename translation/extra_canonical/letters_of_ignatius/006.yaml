  english_witness: 'For if I in a short time had such converse with your bishop, which was not after the manner of men but in the Spirit, how much more do I congratulate you who are closely joined with him as the Church is with Jesus Christ and as Jesus Christ is with the Father, that all things may be harmonious in unity.


    Let no man be deceived. If any one be not within the precinct of the altar, he lacketh the bread [of God]. For, if the prayer of one and another hath so great force, how much more that of the bishop and of the whole Church.


    Whosoever therefore cometh not to the congregation, he doth thereby show his pride and hath separated himself; for it is written, God resisteth the proud. Let us therefore be careful not to resist the bishop, that by our submission we may give ourselves to God.'
translation:
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
