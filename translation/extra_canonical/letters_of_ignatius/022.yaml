  english_witness: 'I am devoted to you and to those whom for the honor of God ye sent to Smyrna; whence also I write unto you with thanksgiving to the Lord, having love for Polycarp as I have for you also. Remember me, even as I would that Jesus Christ may also remember you.


    Pray for the church which is in Syria, whence I am led a prisoner to Rome-- I who am the very last of the faithful there; according as I was counted worthy to be found unto the honor of God. Fare ye well in God the Father and in Jesus Christ our common hope.'
translation:
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
