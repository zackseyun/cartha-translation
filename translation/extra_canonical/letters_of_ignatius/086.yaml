  english_witness: 'Philo and Rhaius Agathopus, who followed me in the cause of God, ye did well to receive as ministers of [Christ] God; who also give thanks to the Lord for you, because ye refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which ye despised not, neither were ashamed of them. Nor shall He, who is perfect faithfulness, be ashamed of you, even Jesus Christ.'
translation:
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
