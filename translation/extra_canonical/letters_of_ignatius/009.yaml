  english_witness: 'Let no one therefore deceive you, as indeed ye are not deceived, seeing that ye belong wholly to God. For when no lust is established in you, which hath power to torment you, then truly ye live after God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians which is famous unto all the ages.


    They that are of the flesh cannot do the things of the Spirit, neither can they that are of the Spirit do the things of the flesh; even as faith cannot do the things of unfaithfulness, neither unfaithfulness the things of the faith. Nay, even those things which ye do after the flesh are spiritual; for ye do all things in Jesus Christ.'
translation:
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
