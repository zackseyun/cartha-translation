  english_witness: 'If then those who had walked in ancient practices attained unto newness of hope, no longer observing Sabbaths but fashioning their lives after the Lord''s day, on which our life also arose through Him and through His death which some men deny--a mystery whereby we attained unto belief, and for this cause we endure patiently, that we may be found disciples of Jesus Christ our only teacher--


    if this be so, how shall we be able to live apart from Him? seeing that even the prophets, being His disciples, were expecting Him as their teacher through the Spirit. And for this cause He whom they rightly awaited, when He one, raised them from the dead.'
translation:
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
