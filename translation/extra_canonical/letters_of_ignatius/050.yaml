  english_witness: 'Shun ye therefore those vile offshoots that gender a deadly fruit, whereof if a man taste, forthwith he dieth. For these men are not the Father''s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable--the Cross whereby He through His passion inviteth us, being His members. Now it cannot be that a head should be found without members, seeing that God promiseth union, and this union is Himself'
translation:
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
