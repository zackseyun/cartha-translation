  english_witness: 'From Syria even unto Rome I fight with wild beasts, by land and sea, by night and by day, being bound amidst ten leopards, even a company of soldiers, who only wax worse when they are kindly treated. Howbeit through their wrong doings I become more completely a disciple; yet am I not hereby justified.


