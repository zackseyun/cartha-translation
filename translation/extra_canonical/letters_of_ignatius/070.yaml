  english_witness: 'But if any one propound Judaism unto you, hear him not: for it is better to hear Christianity from a man who is circumcised than Judaism from one uncircumcised. But if either the one or the other speak not concerning Jesus Christ, I look on them as tombstones and graves of the dead, whereon are inscribed only the names of men.


    Shun ye therefore the wicked arts and plottings of the prince of this world, lest haply ye be crushed by his devices, and wax weak in your love. But assemble yourselves all together with undivided heart. And


    I give thanks to my God, that I have a good conscience in my dealings with you, and no man can boast either in secret or openly, that I was burdensome to any one in small things or in great. Yea and for all among whom I spoke, it is my prayer that they may not turn it into a testimony against themselves.'
translation:
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
