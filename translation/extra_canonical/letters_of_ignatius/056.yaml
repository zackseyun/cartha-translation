  english_witness: 'Ye never grudged any one; ye were the instructors of others And my desire is that those lessons shall hold good which as teachers ye enjoin.


    Only pray that I may have power within and without, so that I may not only say it but also desire it; that I may not only be called a Christian, but also be found one. For if I shall be found so, then can I also be called one, and be faithful then, when I am no more visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is the more plainly visible. The Work is not of persuasiveness, but Christianity is a thing of might, whensoever it is hated by the world.'
translation:
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
