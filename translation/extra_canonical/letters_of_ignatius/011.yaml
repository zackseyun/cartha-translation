  issues:
  - 'The draft joins repentance and finding God under the same ''hope'' (''there is hope that they may repent and find God''), whereas the witness says that there is in them a hope of repentance and then states the purpose of prayer: ''that they may find God.'''
  - '''Instead'' introduces an exclusion or replacement not present in the witness. The witness preserves both claims: believers are to show themselves their brothers by forbearance, and they are also to be zealous imitators of the Lord.'
