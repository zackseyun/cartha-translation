  english_witness: Seeing then that all things have an end, and these two life and death--are set before us together, and each man shall go to his own place; for just as there are two coinages, the one of God and the other of the world, and each of them hath its proper stamp impressed upon it, the unbelievers the stamp of this world, but the faithful in love the stamp of God the Father through Jesus Christ, through whom unless of our own free choice we accept to die unto His passion, His life is not in us:--
translation:
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
