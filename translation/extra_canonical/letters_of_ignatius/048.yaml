  english_witness: 'Be ye deaf therefore, when any man speaketh to you apart from Jesus Christ, who was of the race of David, who was the Son of Mary, who was truly born and ate and drank, was truly persecuted under Pontius Pilate, was truly crucified and died in the sight of those in heaven and those on earth and those under the earth;


    who moreover was truly raised from the dead, His Father having raised Him, who in the like fashion will so raise us also who believe on Him--His Father, I say, will raise us--in Christ Jesus, apart from whom we have not true life.'
translation:
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
