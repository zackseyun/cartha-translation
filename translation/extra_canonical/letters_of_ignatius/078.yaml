  english_witness: For He suffered all these things for our sakes [that we might be salved]; and He suffered truly, as also He raised Himself truly; not as certain unbelievers say, that He suffered in semblance, being themselves mere semblance. And according as their opinions are, so shall it happen to them, for they are without body and demon-like.
translation:
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
