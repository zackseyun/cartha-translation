source:
  text: |-
    The farthest bounds of the universe shall profit me nothing, neither the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest bounds of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].

    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Bestow not on the world one who desireth to be God's, neither allure him with material things. Suffer me to receive the pure light. When I am come thither, then shall I be a man.

    Permit me to be an imitator of the passion of my God. If any man hath Him within himself, let him understand what I desire, and let him have fellow-feeling with me, for he knoweth the things which straiten me.
