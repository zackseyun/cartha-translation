  english_witness: 'I desire no longer to live after the manner of men; and this shall be, if ye desire it. Desire ye, that ye yourselves also may be desired. In a brief letter I beseech you; believe me.


    And Jesus Christ shall make manifest unto you these things, that I speak the truth--Jesus Christ, the unerring mouth in whom the Father hath spoken [truly].


    Entreat ye for me, that I may attain [through the Holy Spirit]. I write not unto you after the flesh, but after the mind of God. If I shall suffer, it was your desire; if I shall be rejected, it was your hatred.'
translation:
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
