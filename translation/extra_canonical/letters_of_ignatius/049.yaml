  english_witness: But if it were as certain persons who are godless, that is unbelievers, say, that He suffered only in semblance, being themselves mere semblance, why am I in bonds? And why also do I desire to fight with wild beasts? So I die in vain. Truly then I lie against the Lord.
translation:
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
