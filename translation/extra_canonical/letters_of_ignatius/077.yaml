  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
translation:
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
