  issues:
  - location: Paragraph 5
    draft: condemning knowledge practiced apart from the truth of the command
    problem: “Condemning” strengthens the witness’s “blaming,” and “command” narrows “injunction.”
  - location: Paragraph 8
    draft: If you bear its tree
    problem: The witness says “if thou bear the tree”; “its” introduces an uncertain antecedent and changes the wording.
  - location: Paragraph 8
    draft: Eve is not corrupted but is believed in as a virgin
    problem: “Believed in” should retain the witness’s “believed on,” preserving the stated claim without alteration.
  - location: Final sentence
    draft: As he teaches the saints, the Word rejoices
    problem: This changes “the Word is gladdened” from a passive statement into an active one, altering the substantive claim.
