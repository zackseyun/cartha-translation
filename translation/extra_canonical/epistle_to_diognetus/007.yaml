  english_witness: 'For it is no earthly discovery, as I said, which was committed to them, neither do they care to guard so carefully any mortal invention, nor have they entrusted to them the dispensation of human mysteries.


    But truly the Almighty Creator of the Universe, the Invisible God Himself from heaven planted among men the truth and the holy teaching which surpasseth the wit of man, and fixed it firmly in their hearts, not as any man might imagine, by sending (to mankind) a subaltern, or angel, or ruler, or one of those that direct the affairs of earth, or one of those who have been entrusted with the dispensations in heaven, but the very Artificer and Creator of the Universe Himself, by Whom He made the heavens, by Whom He enclosed the sea in its proper bounds, Whose mysteries all the elements faithfully observe, from Whom [the sun] hath received even the measure of the courses of the day to keep them, Whom the moon obeys as He bids her shine by night, Whom the stars obey as they follow the course of the moon, by Whom all things are ordered and bounded and placed in subjection, the heavens and the things that are in the heavens, the earth and the things that are in the earth, the sea and the things
    that are in the sea, fire, air, abyss, the things that are in the heights, the things that are in the depths, the things that are between the two. Him He sent unto them.


    Was He sent, think you, as any man might suppose, to establish a sovereignty, to inspire fear and terror?


    Not so. But in gentleness [and] meekness has He sent Him, as a king might send his son who is a king. He sent Him, as sending God; He sent Him, as [a man] unto men; He sent Him, as Savior, as using persuasion, not force: for force is no attribute of God.


    He sent Him, as summoning, not as persecuting; He sent Him, as loving, not as judging.


    For He will send Him in judgment, and who shall endure His presence?


    ....[Dost thou not see] them thrown to wild beasts that so they may deny the Lord, and yet not overcome?


    Dost thou not see that the more of them are punished, just so many others abound?


    These look not like the works of a man; they are the power of God; they are proofs of His presence.'
translation:
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
