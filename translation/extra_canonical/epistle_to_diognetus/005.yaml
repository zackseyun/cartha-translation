  english_witness: 'For Christians are not distinguished from the rest of mankind either in locality or in speech or in customs.


    For they dwell not somewhere in cities of their own, neither do they use some different language, nor practice an extraordinary kind of life.


    Nor again do they possess any invention discovered by any intelligence or study of ingenious men, nor are they masters of any human dogma as some are.


    But while they dwell in cities of Greeks and barbarians as the lot of each is cast, and follow the native customs in dress and food and the other arrangements of life, yet the constitution of their own citizenship, which they set forth, is marvelous, and confessedly contradicts expectation.


    They dwell in their own countries, but only as sojourners; they bear their share in all things as citizens, and they endure all hardships as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like all other men and they beget children; but they do not cast away their offspring.


    They have their meals in common, but not their wives.


    They find themselves in the flesh, and yet they live not after the flesh.


    Their existence is on earth, but their citizenship is in heaven.


    They obey the established laws, and they surpass the laws in their own lives.


    They love all men, and they are persecuted by all.


    They are ignored, and yet they are condemned. They are put to death, and yet they are endued with life.


    They are in beggary, and yet they make many rich. They are in want of all things, and yet they abound in all things.


    They are dishonored, and yet they are glorified in their dishonor. They are evil spoken of, and yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they respect


    Doing good they are punished as evil-doers; being punished they rejoice, as if they were thereby quickened by life.


    War is waged against them as aliens by the Jews, and persecution is carried on against them by the Greeks, and yet those that hate them cannot tell the reason of their hostility.'
translation:
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
