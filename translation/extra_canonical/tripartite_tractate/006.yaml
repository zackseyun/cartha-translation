  english_witness: '<...> and just as the acts of wonder by the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they pertain to speech, [] both [acts of wonder] and qualities are seeds and thoughts of his offspring, and living, eternal roots that appear as self-originating offspring, existing as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, sound and speech are unnecessary, it being unnecessary to perform [an act] to obtain what they wish to [have done]. Instead, based on the pattern of [the Father’s] own existence, [those] who originate from him beget anything they wish. And he has child<ren>, the one of whom they think, and of whom they speak, and toward whom they move, and the one in whom they subsist, and the one to whom they sing hymns to glorify him; because this is their power of procreation, resembling those from whom they originated, congruent with their shared help, given that they help each other as do those who are unbegotten.


    The Father, in accord with his exalted place above the Totalities, being unknown and ungraspable, possesses a greatness and scale that if revealed suddenly, immediately, would destroy all the lofty beings among the aeons who had originated from him. He, therefore, restrained his strength and his infinite resources that comprise his [] being, [remaining] unspeakable and unnameable, exalted above all mind and all speech.


    This is, though, the one who stretched himself out, and what he stretched out formed a foundation and a place and a dwelling for the universe, one of his names being the One by Whom, because he is the Father of All. By his labor for the existing ones, he sowed into them the thought to search for him. The wealth of their [. . .] is that they grasp that he exists and that they inquire into what was existent.'
translation:
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
