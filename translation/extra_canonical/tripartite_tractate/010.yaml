  english_witness: 'The emanation of the Totalities, who exist from the existent one, did not take place by being separated from each other, like [something] discarded by the one who gives birth to them. Instead, their begetting resembles an act of extension, just as the Father extends himself to the ones he loves, so that [those] who have originated from him could also become him. Although a unity, the current age is divided into units of time, which in turn are divided into years, which in their turn are divided into seasons, and (then) seasons into months, and months into days, and days into hours, and hours into minutes. Even so, [] the age of truth, because it is one and many, is honored with the insignificant and important names as each can grasp it. To use an analogy, this is like a spring that, although being what it is, it nevertheless flows, growing into streams and lakes and canals and branches. Or, it is like a root that spreads out beneath trees, and branches with their fruit,
    or like a human body, divided in an inseparable manner into various branching limbs, primary and secondary limbs, great and small.


    The aeons brought forth themselves in agreement with the third fruit by free will and by the understanding he gave them for thought. It is not their desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Neither is it their desire to give glory together with the entire Totality, nor do they desire to glorify together with any individual aeon who reached a higher place or state than his own, except he obtain <what> was desired from the one with a more exalted name and a higher place. [] They receive each other at the higher place, and the one who wanted to go higher begets himself, in a manner of speaking, begetting himself together with the other one and with what he is, being renewed together with the one who came to him from his brother, and beholding him and entreating him about the matter.


    So that this transpires in this way, the one who desired to give glory says nothing to him about it except this, because a limit for speech is set down in the Fullness, so that they remain silent about the ungraspability of the Father, yet permitting them to speak about their desire to grasp him.'
translation:
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
