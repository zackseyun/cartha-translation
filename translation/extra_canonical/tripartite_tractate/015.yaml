  english_witness: 'And <he> sowed a word in him invisibly which was intended to become knowledge, and he granted him power to move away and to cast away from himself those who are disobedient to him. In this way, he revealed himself to him. To those, however, who came to be for his sake, he revealed a form beyond their grasp. They (consequently) behaved with enmity toward each other. <He> suddenly revealed himself to them, drawing near in the form of lightning, and departed like a flash of lightning. When finishing their mutual entanglement, he ended it [] by the sudden revelation, for which they were not prepared, were not expecting, and did not know.


    This made them frightened and they fell down, because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> named Little One, so they have but a dim idea of the Exalted One who pre-exists them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. They therefore received his revelation and prostrated before him. They became witnesses persuaded of <him>, acknowledging the light that had appeared was stronger than those who resisted them.


    However, those of the likeness grew sore afraid, because they could not bear to hear about him in the beginning, that a vision of this kind could exist. They consequently plunged into the pit of ignorance called “the Outer Darkness” and “Chaos,” and “Death” and “the Abyss.” He positioned them lower than the order of the beings of memory, given that it was evidently stronger than they. They were deemed worthy to rule over the indescribable darkness, because they own it and it is the lot assigned to them. He granted that they, also, would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came to be and the revelation for the one who was deficient, and the revelation for those who came to be because of him. He revealed himself to him within him, because he is with him, sharing in his suffering, bestowing on him repose little by little, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. To those, however, who fell outside, he revealed himself on a sudden and in a flash, and he then quickly withdrew himself, not allowing them to gaze on him.'
translation:
  text: 'And <he> invisibly sowed in him a word that was intended to become knowledge, and he gave him power to move away and to cast away from himself those who disobey him. In this way, he revealed himself to him. But to those who came into being for his sake, he revealed a form beyond their grasp. They therefore behaved with hostility toward one another. <He> suddenly revealed himself to them, drawing near in the form of lightning and departing like a flash of lightning. When finishing their mutual entanglement, he ended it [] through the sudden revelation, for which they were unprepared, were not expecting, and did not know.


    This frightened them, and they fell down because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> called the Little One, so they have only a dim idea of the Exalted One who exists before them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. Therefore, they received his revelation and prostrated themselves before him. They became witnesses who were persuaded of <him>, acknowledging that the light which had appeared was stronger than those who resisted them.


    But those of the likeness became terribly afraid because they could not bear to hear about him in the beginning, that a vision of this kind could exist. Consequently, they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, given that it was evidently stronger than they were. They were considered worthy to rule over the indescribable darkness because they own it, and it is the lot assigned to them. He granted that they too would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came into being, the revelation for the one who was deficient, and the revelation for those who came into being because of him. He revealed himself to him within him because he is with him, sharing in his suffering, gradually giving him repose, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. But to those who fell outside, he revealed himself suddenly and in a flash. Then he quickly withdrew himself, not allowing them to gaze on him.'
