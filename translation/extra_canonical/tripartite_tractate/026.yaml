  issues:
  - location: Redemption of the Son and others
    issue: The draft replaces “first attained redemption” and “all the rest attained redemption” with “received redemption.” This weakens or changes the witness’s repeated attainment language.
  - location: The Son's subjection in the flesh
    issue: The draft changes “subjecting himself to everything necessary to us in the flesh” to “subjected himself to everything necessary for us in the flesh.” The latter can introduce a different, purposive claim; retain the witness’s “to us” relation.
