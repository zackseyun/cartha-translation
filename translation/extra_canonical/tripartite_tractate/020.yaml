  issues:
  - 'The draft removes witness parenthetical signals: “(his works),” “(he does so),” and “(invisible).” These must remain visible.'
  - “As [] though in his own thoughts he had spoken them and done them” is altered to “through his own thoughts,” changing the stated comparison.
  - “Producing and pronouncing whatever he contemplates” is changed to past tense (“contemplated”), although the witness has present tense.
  - The witness’s plural “all that exist” and “(entities of) illnesses” are substantively recast as singular “all that exists” and “entities of illness.”
