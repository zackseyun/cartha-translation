  issues:
  - location: Prayer and remembrance
    draft: what caused him to remember those who had existed from the beginning was that he himself had been remembered
    witness: what caused his remembrance of those who had existed from the beginning was that he (himself) had been remembered
    reason: The draft recasts the witness's formulation and drops the parenthetical emphasis on “(himself).”
  - location: Comparison after the cessation of emanations
    draft: they are unequal to those who existed before them
    witness: they are unequal to those who pre-existed
    reason: “Pre-existed” is a substantive temporal/status claim and should remain visible without adding the comparative “before them.”
  - location: Good intention
    draft: The good intention belonged to <him who> sought the preexistent one
    witness: the good intention being <his who> sought for the pre-existent
    reason: The draft changes the supplied restoration from <his who> to <him who>, changes “sought for” to “sought,” and renders “the pre-existent” as “the preexistent one,” adding an explicit nominal identification not present in the witness.
  - location: Origin in unity and unanimity
    draft: they acted from that thought in unity and unanimity, since their existence had come from unity and unanimity
    witness: from that thought they acted in unity and unanimity, given that from unity and from unanimity they had derived their existence
    reason: The draft smooths and compresses the witness's explicit double source formulation (“from unity and from unanimity”).
