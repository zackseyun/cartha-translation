  english_witness: '1. She became the universal womb because she is the one who exists before all of them, the Mother-Father, the Primal Man, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to issue forth.


    2. ‹She› entreated the unseen, virginal Spirit — that is, Barbelo — to grant her Precognition, and the Spirit agreed,


    3. and when he had [agreed], Precognition approached, and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She extolled him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She also entreated once more to grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached], and attended Idea and Precognition.


    7. She extolled the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also entreated to grant her eternal life, and the unseen Spirit agreed, and when he had agreed, Eternal Life approached,


    9. and they [attended] and extolled the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She also entreated once more to grant her truth. And [he agreed], and [when he had] agreed


    11. Truth approached, and they attended and extolled the unseen, «6» admirable Spirit and his Barbelo on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Man, the image of the unseen Spirit.


    13. This is Providence — that is, Barbelo — and Idea, and Precognition, and Indestructibility, and Eternal Life and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
