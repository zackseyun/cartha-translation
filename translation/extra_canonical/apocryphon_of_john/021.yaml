  issues:
  - location: Sentence 1
    issue: The draft changes “write them down” to singular “write it down,” obscuring the witness’s plural referent.
  - location: Sentence 2
    issue: “Cursed is anyone who trades” changes the witness’s formulation, “Cursed be any who will trade.”
  - location: Sentence 2
    issue: The witness marker «32» is omitted; it must remain visible.
  - location: Sentence 3
    issue: The draft explicitly identifies the one who vanished as “the Savior,” whereas the witness says only “he vanished from him.” This identification should not be added.
