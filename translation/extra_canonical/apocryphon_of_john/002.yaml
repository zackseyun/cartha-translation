  english_witness: '1. Immediately, [as I was musing on these matters], lo, the [heavens were opened, and] the [entire] creation underneath heaven glowed, and [the world] was shaken.


    2. «2» [I grew fearful, and lo, I] saw inside the [light a child standing] near me.


    3. As I gazed [on it, it became] similar to an old man, and he [altered his] appearance, growing similar to a {son:1}.


    4. It [was not a diverse entity] in front of me, but there was an [appearance] featuring multiple forms inside the [light], and [the resemblances] made their appearance through each other, [and] the [appearance] possessed three forms.


    5. He asked me: “John, John, why do you marvel, and why [do you] fear?


    6. Is this appearance unknown to all of you?


    7. I mean, do not [be] of a weak heart.


    8. I am the one who [is] always [with all of you].


    9. I [am the Father], I am the Mother, I am the Son.


    10. I am the unpolluted and untainted one.


    11. [I have now come to inform you of] what is, [and what was], and what will [happen], so that [you might understand the things] that are not (yet) manifest [and those things that are manifest, and to inform you of] the [unmoving race of] the [Perfect Man].


    12. [Lift up, therefore] your [face, so that] you [might accept] the things I [will tell you] today, [and] might [convey them to your companion] spirits [of] the [unmoving] race of the Perfect [Man].”'
translation:
  text: 'Immediately, [as I was musing on these matters], lo, the [heavens were opened, and] the [entire] creation underneath heaven glowed, and [the world] was shaken.


    «2» [I grew fearful, and lo, I] saw inside the [light a child standing] near me.


    As I gazed [on it, it became] similar to an old man, and he [altered his] appearance, growing similar to a {son:1}.


    It [was not a diverse entity] in front of me, but there was an [appearance] featuring multiple forms inside the [light], and [the resemblances] made their appearance through each other, [and] the [appearance] possessed three forms.


    He asked me: “John, John, why do you marvel, and why [do you] fear?


    Is this appearance unknown to all of you?


    I mean, do not [be] of a weak heart.


    I am the one who [is] always [with all of you].


    I [am the Father], I am the Mother, I am the Son.


    I am the unpolluted and untainted one.


    [I have now come to inform you of] what is, [and what was], and what will [happen], so that [you might understand the things] that are not (yet) manifest [and those things that are manifest, and to inform you of] the [unmoving race of] the [Perfect Man].


    [Lift up, therefore] your [face, so that] you [might accept] the things I [will tell you] today, [and] might [convey them to your companion] spirits [of] the [unmoving] race of the Perfect [Man].”'
