  english_witness: '1. I appeared in the shape of an eagle on the tree of knowledge, which is Reflection of Providence of Pure Light, so that I could instruct them and rouse them out of their deep sleep, because both of them were in a fallen condition, and they were aware of their nudity.


    2. Reflection appeared to them in the mode of a light, and she roused their thinking, but when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    3. He encountered the woman when she was «24» making herself ready for her husband.


    4. He was her overlord, although he knew not the mystery that had transpired by means of the sacred decree, and they were afraid to accuse him, and he displayed to his angels the ignorance inside him, and he expelled them from paradise, and he clothed them in dark gloom.


    5. The chief archon also beheld the virgin who stood near Adam, and that the radiant Reflection of Life had appeared inside her, and ‹Y›aldabaoth was filled with ignorance, and when the Providence of the All saw this, she dispatched messengers, and they quickly removed Life from out of Eve.


    6. Then the chief archon polluted her, and he begot with her two sons, the first and the second: Eloim and Yave.


    7. Eloim has the face of a bear, but Yave has the face of a cat.


    8. Yave is just, but Eloim is unjust.


    9. Yave was placed over fire and wind, but Eloim was placed over water and earth, but with intent to deceive he called these with the names Cain and Abel.


    10. Until today sexual intercourse has continued because of the chief archon, and it was he who planted sexual lust inside her who belongs to Adam, but through intercourse he made copies of the bodies, and he inspired them with his false spirit.


    11. He, however, placed the two archons over several principalities, so that they would rule over the tomb.


    12. However, when Adam became aware of the likeness of his own precognition, he begot the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race is among the aeons.


    13. Similarly, the mother also sent down her spirit, which is in her own likeness, as well as a simulacrum of the one who dwells in the Fullness, because she will make ready a dwelling place for the aeons who will descend.


    14. He also caused them to drink the water of oblivion from the chief archon, so that they would not know the place of their origin.


    15. In this way, the seed remained for a period of time to help, so that when the Spirit issues forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
