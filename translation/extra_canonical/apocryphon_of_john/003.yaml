    2. [It is that which exists] as [God] and as Father of the All, [the unseen] one, who is higher than [the All, who exists as] indestructibility, [as] pure light upon which no [eye] can gaze.


    3. He [is the] unseen [Spirit], of whom it is improper [to think] as a god or as anything similar, because he is more than a god, since nothing exists higher than him and no one «3» rules over him.


    4. [This is because he does] not [exist] within anything subordinate [to him, since everything] exists within him, because he is self-[established].


    5. [He is eternal], since he needs [nothing], because [he] is complete perfection.


    6. [He lacked nothing] that he would need in order to be perfected by [it].


    7. [Instead], he is forever completely perfect in [light].


    8. He is [limitless], since no one exists [before him] who could place limits on him.


    9. He is unfathomable, [since there] exists before him no one who could [fathom him].


    10. [He is] beyond measurement, since no one [existed before him who could measure] him.


    11. [He is unseen, since no] one has seen [him].


    12. [He is eternal], since he [exists] eternally.


    13. He is [unspeakable, since] no one existed who could conceive of him in order to speak [of him].


    14. He cannot be named, since [no one existed before him] who could name [him].


    15. He is [light beyond measure], pure, sacred, and [unstained].


    16. He is unspeakable, [existing in perfect] indestructibility.


    17. (He exists) [not] (confined) within perfection, nor within blessedness, nor within divinity, but he is highly exalted (above these).


    18. He is neither bodily [nor] nonbodily.


    19. He is neither large [nor] small.


    20. [It is impossible] to say that he has a quantity or that [he has a quality], because no one can [understand him].


    21. He is not a being among [beings, but he is] highly exalted, [not] as [though he were loftier], but (he is lofty in) himself.


    22. He neither [participates] in the aeons nor in temporality, because whoever participates in [an aeon] that was established previously [...].


    23. He [was not] not assigned a temporal measure, [since] he does not receive anything from another, [because it would be received] as a loan, since the one who exists before someone (else) [has no need] to accept (something) from [another].


    24. This is because he is the one who gazes at himself, waiting, in «4» [his] light, since the [...] is glorious.


    25. Purity beyond measure belongs to him.


    26. He is an aeon who bestows aeons.


    27. He is [life] that bestows life.


    28. He is a blessed one who bestows blessedness.


    29. He is knowledge that bestows knowledge.


    30. [He is] goodness that bestows goodness.


    31. [He is] mercy and redemption [that bestow mercy].


    32. He is grace that bestows grace,


    33. [not] because it belongs to him, but because he bestows [the light] that is beyond measure and comprehension.


    34. [How can I speak] with you about him, [since] his [aeon] is beyond destruction, at rest and abiding in [silence, resting], existing before [everything, because he] is the leader of [all] aeons, [and] he is the one who grants them strength through his goodness?”'
