  english_witness: 'Peter then assembled the others. They went to the mountain called Olivet, where formerly they would assemble together with the blessed Christ when he dwelt in the body.


    When the apostles were met together, and had fallen to their knees, they prayed as follows, and spoke:


    “Father, Father, Father of the light,

    you to whom belong the indestructible ones,

    listen to us,

    just as [you] have been delighted in your holy Son, Jesus Christ,

    because for our sake he has become a light [] in the darkness.

    Verily, [1] listen to us.”


    And once more they prayed, and spoke:


    “Son of life, Son of deathlessness,

    you who dwell in the light,

    Son, Christ of deathlessness,

    our redeemer,

    grant us strength,

    because they are hunting for us to murder us.”'
translation:
  text: 'Peter then assembled the others. They went to the mountain called Olivet, where formerly they would assemble together with the blessed Christ when he dwelt in the body.


    When the apostles were met together, and had fallen to their knees, they prayed as follows, and spoke:


    “Father, Father, Father of the light,

    you to whom belong the indestructible ones,

    listen to us,

    just as [you] have been delighted in your holy Son, Jesus Christ,

    because for our sake he has become a light [] in the darkness.

    Verily, [1] listen to us.”


    And once more they prayed, and spoke:


    “Son of life, Son of deathlessness,

    you who dwell in the light,

    Son, Christ of deathlessness,

    our redeemer,

    grant us strength,

    because they are hunting for us to murder us.”'
