  english_witness: '“Now, then, regarding [the deficiency] of the aeons, here is the deficiency: When the defiance and thoughtlessness of the Mother became manifest, apart from the order of the Greatness of the Father, she desired to establish aeons. When she spoke, the tyrannical one followed, but when she abandoned a piece, the tyrannical one seized it, and it turned into a deficiency. This is the deficiency of the aeons.


    “When the tyrannical one had taken a piece, he planted it, stationing powers and authorities over it, and he restricted it to inside the mortal aeons. Every cosmic power was gleeful that they had been produced. [] However, they were ignorant of the pre-existent [Father], given that they are aliens to him. [Instead, this] (tyrannical) one was granted power, and they worshipped him and praised him.


    “Now the mind of the tyrannical one grew arrogant on account of the praise of the powers. He became an opponent and desired to replace an image [with another image] and to replace a form with another form. Now, he delegated the powers under his authority to shape mortal bodies, and they came to exist out of a disparity of the likeness that had been produced.'
