  english_witness: '[] The Letter of Peter, which he dispatched to Philip.


    Peter, the apostle of Jesus Christ, to Philip, our beloved brother, and our co-apostle, as well as the brethren together with you. Greetings.


    I desire for you to understand, our brother, that we received directives from our Lord, the savior of the entire world, for us to assemble together, in order to teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    You, however, separated yourself from us, and you desired not to assemble together to learn how we could coordinate ourselves, so that we might announce the message.


    Would it, therefore, be acceptable to you, our brother, to come in accord with the directives of our God, Jesus?


    When Philip had received and read this, he went to Peter, delighting with glee.'
translation:
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
