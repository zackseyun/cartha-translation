  verdict: revise
  issues:
  - The opening changes the witness's prospective wording, “those who will have sex with each other,” to the present-tense/generalizing “those who have sex with each other.”
  - Several renderings soften or alter witness-specific wording without need, including “carnal marriage” → “bodily marriage,” “content” → “are content,” “to abide with her” → “to remain with her,” “obtains” → “receives,” and “appropriate” → “fitting.”
  - The draft omits or relocates some connective emphasis present in the witness, notably “however” in “When, however, they have joined,” and shifts “The Savior therefore calls out” to “Therefore, the Savior calls out.”
  reviewed_at: '2026-07-11T22:22:53Z'
