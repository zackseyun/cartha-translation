translation:
  text: Since, then, we have been deemed worthy of many great and glorious things,
    let us press on toward the goal of peace that has been handed down to us from
    the beginning, and let us fix our gaze on the Father and Creator of the whole
    world, and cling to his magnificent and surpassing gifts and benefits of peace.
