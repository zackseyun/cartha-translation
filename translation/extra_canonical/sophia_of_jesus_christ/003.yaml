  issues:
  - location: Savior's reply to Thomas
    draft: I came from the Infinite
    witness: I originated from the Infinite
    issue: The draft weakens/replaces the witness's specific claim of origination.
  - location: Purpose of the Spirit's fruit-production
    draft: to avoid <enjoying> his goodness all alone
    witness: to avoid <enjoying> his goodness all alone (by himself)
    issue: The parenthetical qualification '(by himself)' is omitted and should remain visible.
  - location: Perishable and imperishable origins
    draft: Everything that came from what is perishable ... what has come from what is imperishable
    witness: Everything that originated from what is perishable ... what has originated from what is imperishable
    issue: The witness's repeated language of origination is replaced.
  - location: Final consequence
    draft: many went astray because they did not know this difference
    witness: many erred because they were unaware of this difference
    issue: The draft substitutes a potentially more interpretive formulation for the witness's statement.
