  issues:
  - “brought forth” replaces “manifested” for the first-begotten son, altering the witness’s stated mode of appearance.
  - “because he has authority” weakens “because he wields authority,” which explicitly attributes exercised authority to Christ.
  - “Because he originated from radiant light” changes the witness’s “On account of his origin from radiant light”; retain the origin-language without recasting it as a completed action.
  - “received” replaces “obtained” regarding the angels’ reflections, and “which until now has been...” syntactically narrows the final clause toward “glory” rather than preserving the witness’s broader wording.
