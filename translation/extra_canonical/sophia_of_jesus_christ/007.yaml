  issues:
  - draft: “...so that the Almighty can watch over them.”
    witness: “...so that they can be watched over by him.”
    problem: The draft resolves the witness's pronouns into a specific claim that the Almighty is the watcher. The witness does not explicitly identify “him” as the Almighty.
  - draft: “...<freeing> myself from that fetter...”
    witness: “...<loosing> from that fetter...”
    problem: “Myself” adds a reflexive object not present in the witness, and the supplied restoration signal should remain attached to the witness's substantive wording.
  - draft: “...so that his glory could be revealed. Thus Sophia could also be corrected...”
    witness: “...so that his glory could be manifested, so that Sophia could also be rectified...”
    problem: “Thus” makes Sophia's correction a stated consequence of the preceding clause, whereas the witness presents it as a further purpose (“so that”).
