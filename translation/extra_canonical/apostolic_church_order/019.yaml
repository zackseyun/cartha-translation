  text: 'James said, " The Reader shall be appointed

    after he has been fully proved t; bridling his tongue,

    not a drunkard, not a derider in his speech, but decorous in his appearance ; obedient, being the first

    to congregate on the Lord''s-day ; a servant knowing

    what is meet for him, that he may fulfil the work of

    publishing the Gospel. For he who fills the ears

    of others with his doctrines, it becomes him the

    more that he should be a faithful workman before

    God."'
