source:
  edition: Henry Tattam (1848)
  language: English
  text: 'Cephas said, " Thou shalt not make schisms :

    thou shalt reconcile in peace those who contend

    with one another. Judge in righteousness without

    accepting of persons. Reprove him who hath

    sinned, for his sin. Suffer not wealth to prevail before God, neither justify the unworthy, for beauty

    profiteth not; but righteous judgment before all.

    Doubt not* in thy prayer, thinking whether what

    thou hast asked of him will be or not. Let it not

    indeed be that when thou receivest thou stretchest

    out thine hand, but when thou shouldest give thou

    drawest thy hand to thee. But if thou hast at

    handf thou shalt give for the redemption of thy

    sins. Thou shalt not doubt, thou shalt give ;

    neither when thou hast given shalt thou murmur,

    knowing this reward is of God. Thou shalt not

    turn away from the needy, but shalt communicate

    with the needy in all things : Thou shalt not say

    these things are mine alone. If ye communicate

    with one another of those things which are incorruptible, how much rather should ye not do it in

    those things which are corruptible?"'
