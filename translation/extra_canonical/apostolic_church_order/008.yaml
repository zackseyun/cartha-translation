source:
  edition: Henry Tattam (1848)
  language: English
  text: 'Philip said, " My son, be not of unlawful desires,

    because desire leads to fornication, drawing men to

    it involuntarily : for lust is a demon.* For if the

    evil spirit of anger is united with that of sensuality,

    they destroy those who shall receive them. And

    the way of the evil spirit is the sin of the soul. For

    when he seest a little quiet entering in he will

    make the way broad ; and he will take with him

    all other evil spirits : he will go to that soul, and

    will not leave the man to meditate at all, lest he

    should see the truth. Let a restraint be put to

    your anger, and curb it with not a little care, that

    you may cast it behind you, lest it should precipitate you into some evil deed. For wrath and evil

    desire, if they are suffered always remaining, are

    demons. And when they have dominion over a

    man they change him in soul, that he may be

    prepared for a great deed: and when they

    have led him into unrighteous acts, they deride


    him, and will rejoice in the destruction of that

    man."'
