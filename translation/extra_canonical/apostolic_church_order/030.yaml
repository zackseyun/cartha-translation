source:
  edition: Henry Tattam (1848)
  language: English
  text: 'Peter said, " Brethren, the authority is not of

    one, by constraint, but as we were commanded by

    the Lord.


    " I pray you that you keep the commandments of

    God, not taking any thing from them, nor adding

    to them ; in the name of our Lord Jesus Christ,

    whose is the glory for ever. Amen.,,


    The first book of the Canons of our Fathers the

    Apostles is finished, which are in the hands of

    Clemens*; and this is the second book, in the

    peace of God. Amen.


    In the name of God the Most Holy.


    The Second Book of the Canons of our Fathers the

    Apostles, by the hands of Clemens, which is

    the Third Book.'
