  text: 'Philip said, " Let the laymen obey the decrees which have been delivered to them for the

    laity, being in subjection to those who serve at the

    altar. Let every one please God in the place to

    which he hath been appointed. They should not

    love hostility to one another. They should not

    envy for the situation which is appointed for each

    one ; but let every one abide in the calling to

    which he hath been called of God. Let not any

    one inquire after the offence of his neighbour*, in


    * The margin has by a later hand, instead of JUinequjc|>Hp ,

    his friend, AJtneTglTOYOUq , his neighbour, according to

    the Sahidic.


    his course on which he has entered, for the angels

    exceed not the command of the Lord."'
