  text: 'Bartholomew said, " I beseech you, my Brethren, while you have time, and he who asks remains

    with you, (and) you are able to do good to them, do


    * JUtnepepgHT &.., literally, be not of a double heart.

    t Literally, of thy hands, ovfrom the labours of thy hands.


    not fail in any thing to any one, which you have the

    power to do.


    For the day of the Lord draweth nigh, in which

    every thing that is seen shall be dissolved, and the

    wicked shall be destroyed with it, for the Lord

    cometh, and his reward is with him.


    " Be ye lawgivers to your own selves ; be ye

    teachers to yourselves alone, as God hath taught you.

    Thou shalt keep those things which thou hast received, thou shalt not take from them, neither shalt

    thou add to them."'
