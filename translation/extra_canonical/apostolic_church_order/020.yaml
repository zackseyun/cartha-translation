    their children well, being humble, prudent, meek,

    sober, quiet*; not vehement, nor murmurers; not

    double tongued, nor wrathful, for wrath destroy eth

    the wise ; nor hypocrites. They shall not afflict

    the poor, neither shall they accept the person of

    the rich ; they shall not be drinkers of much wine,

    being ready to act in every good service in secret.

    Cheerful in their habitations, constraining the brethren who have, that they should open their hand

    to give. And they also being givers, the goods

    being in common, that the people may honour them

    with all honour, and all fear, beseeching with great

    earnestness those who walk in dissimulation. And

    some they should teach, and some they should rebuke, but the rest they should prohibit. But let

