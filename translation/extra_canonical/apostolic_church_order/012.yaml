  text: 'Thomas said, " My son, he who declares to

    thee the words of God, and hath been the cause of life

    to thee, and hath given the holy seal to thee which is

    in the Lord, thou shalt love him as the apple of

    thine eyes, and remember him by night and day :

    thou shalt honour him as of the Lord : for in that

    place in which the word of power is, there is the

    Lord ; and thou shalt seek his face daily ; him,

    and those who remain of the saints, that thou mayest

    rest thee on their words : for he who is united to

    the saints shall be holy. Thou shalt honour him

    according to thy power, by the sweat* of thy brow,

    and by the labour of thy hands : for if the Lord

    hath made thee meet that he might impart to thee

    spiritual food, and spiritual drink, and eternal life,

    by him ; it becomes thee also the more, that thou

    shouldest impart to him the food which perishes

    and is temporal ; for the labourer is worthy of his

    hire. For it is written, Thou shalt not muzzle the


