  text: 'John said, " There are two ways, one is the ap**/ <-

    way of life, and the other is the way of death ; and 7

    there is much difference in these two ways. But 7- 2

    the way of life is this, Thou shalt love* the Lord


    thy God with all thy heart, who created thee, and

    thou shalt glorify him who redeemed thee from

    death ; for this is the first commandment.


    * The Sahidic is correct— CKEJUtepe, thou shalt love.'
