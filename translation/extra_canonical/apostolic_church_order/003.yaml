  text: 'John said, " Men and brethren, we know that

    we shall give account for those things which we

    hear, and for those things which have been commanded us. Let not any one of us accept the person of his friend. But if any one should hear his

    friend speak of those things which are not profitable,

    let him restrain him, saying, " what thou sayest is

    not good." It therefore pleased them that John

    should speak first.'
