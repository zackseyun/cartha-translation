source:
  edition: Henry Tattam (1848)
  language: English
  text: 'Peter said, " Thou shalt not kill ; thou shalt not

    commit adultery ; thou shalt not commit fornication ; thou shalt not pollute a youth ; thou shalt not

    steal ; thou shalt not be a sorcerer ; thou shalt not

    use divination ; thou shalt not cause a woman to

    miscarry, neither if she hath brought forth a child

    shalt thou kill it. Thou shalt not covet any thing

    that is thy neighbour''s : thou shalt not bear false

    witness : thou shalt not speak evil of any one,

    neither shalt thou think evil. Thou shalt not be

    double-minded,* neither shalt thou be doubletongued, for a double tongue is a snare of death.

    Thy speech shall not be vain, neither tending to a

    lie. Thou shalt not be covetous, neither rapacious ;

    nor a hypocrite, nor of an evil heart, nor proud.

    Thou shalt not speak an evil word against thy

    neighbour. Thou shalt not hate any man, but thou

    shalt reprove some, and shalt have mercy upon

    others. Thou shalt pray for some, and shalt love

    others as thy own soul."'
