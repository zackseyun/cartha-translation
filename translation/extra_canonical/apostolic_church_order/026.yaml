  text: 'John said, "''Have you forgotten, O my brethren, in the day that our Master took the bread and

    the cup he blessed them, saying, ''This is my body and

    my blood'' ? You have seen that he gave no place for

    the women, that they might help with them. (Martha answered for Mary because he saw her laughing: Mary said, ''I laughed not''). For he said to

    us, teaching, that the weak shall be liberated by

    the strong."'
