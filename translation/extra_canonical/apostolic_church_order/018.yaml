    John said, "You have rightly recalled these

    things to remembrance, O my brethren ; for when

    those on the right hand have received the censers

    from the hands of the angels, they present them

    before the Lord* But those on the left hand shall

    be sustained by the multitude of angels. f But it

    behoves the Presbyters that they should be in the

    world, after the manner of old men, removing far

    off, that they should not touch a woman, being charitable (and) lovers of the brethren : that they

    should not accept persons, being partakers of the

    holy mysteries with the Bishop, assisting in all

    things, collecting the multitude together, that they

    may love their Shepherd. And the Presbyters on

    the right hand have the care of those who labour at

    the altar, that they should honour those who are

    worthy of all honour, and rebuke those who merit

    their rebuke. The Presbyters on the left hand

    shall have the care of the people, that they may be

    upright, that no one may be disturbed. And they

    shall instruct them that they should be in all subjection. But when they have instructed one, answering contumaciously J, those within the altar should

