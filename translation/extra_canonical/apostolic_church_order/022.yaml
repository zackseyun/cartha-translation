source:
  edition: Henry Tattam (1848)
  language: English
  text: 'Andrew said, " Let the Deacons be doers of

    good works, drawing near by day and night in

    every place. They must not exalt themselves

    above the poor ; neither must they accept the persons of the rich. They shall know the afflicted,

    that they may give to him out of their store of provisions; constraining those who are able for good

    works to gather them in, attending to the words of

    our Master, '' I was an hungered, and ye gave me

    meat.'' For those who have ministered without sin,

    gain for themselves much confidence."'
