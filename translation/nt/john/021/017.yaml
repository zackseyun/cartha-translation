theological_decisions:
- issue: Preserving the two Greek love verbs in John 21:15–17
  chosen_reading: Render ἀγαπάω as agape-love and φιλέω as phileo-love directly in the English text.
  alternative_readings:
  - Render both verbs as love
  rationale: 'Maintainer-approved revision: preserve the distinct Greek love verbs directly in English. John 21:15–16 has Jesus ask with ἀγαπᾷς (ἀγαπάω) and Peter answer with φιλῶ (φιλέω); in 21:17 Jesus asks with φιλεῖς (φιλέω), and Peter again answers with φιλῶ. Use the hyphenated forms ‘agape-love’ and ‘phileo-love’ so readers can see the vocabulary and the third-question change in the text itself. This reflects POB’s commitment to the authority of Scripture and to preserving its wording rather than flattening two source words into one undifferentiated English word. Remove the former love-verb debate footnote; retain the Greek source and original draft provenance unchanged.'
  doctrine_reference: Maintainer-approved editorial decision, 2026-09-06; preserve source wording.
- issue: Force of Peter's confession 'you know all things'
  chosen_reading: Translate straightforwardly as a strong statement of Jesus' comprehensive knowledge within the discourse
  alternative_readings:
  - Soften to 'you know everything about this'
  - Treat as an explicit doctrinal assertion of omniscience in the translation wording
  rationale: The Greek plainly says 'you know all things.' The translation should preserve the strength of Peter's statement without expanding it into a doctrinal gloss. Historic orthodoxy is compatible with the statement, but the verse itself should speak in its own terms.
  doctrine_reference: Affirmations; Translation philosophy §1 and §3.
