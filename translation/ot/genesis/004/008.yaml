theological_decisions:
- issue: Whether to include Cain's spoken words absent from the Masoretic Text
  chosen_reading: Retain the shorter Masoretic wording provisionally, while disclosing the invitation in Samaritan Hebrew and Greek and the distinct Latin and Syriac wording.
  alternative_readings:
  - Retain the shorter MT in the main text without supplied speech
  - Include an invitation to the field, as in Samaritan Hebrew and Greek
  - Disclose the Latin invitation outside and the Syriac invitation to the plain without treating all versions as identical
  rationale: This is primarily a textual decision rather than a doctrinal one. The published transcription of 4QGenb (4Q2) supports the shorter junction in surviving wording, while much of the speech introduction is supplied. The consulted Samaritan Hebrew and Greek texts include an invitation; the Latin and Syriac versions phrase it differently. An invitation could have been lost before the shorter Hebrew witnesses or added to complete an abrupt utterance. The comparison and independent note-proposal review do not settle historical priority, and no fresh manuscript-image or exhaustive apparatus review is claimed.
  doctrine_reference: Translation philosophy §1 (original-language primacy) and §3 (preserve tension/alternatives in footnotes)
