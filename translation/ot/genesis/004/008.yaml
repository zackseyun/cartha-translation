id: GEN.4.8
reference: Genesis 4:8
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
translation:
  text: And Cain said to Abel his brother[a]. Then, while they were in the field, Cain rose up against Abel his brother and killed him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Masoretic Text does not record Cain's words. The surviving wording in 4QGenb (4Q2), as published, supports this shorter transition. The Samaritan Pentateuch and Greek Septuagint include, “Let us go to the field.” The Latin Vulgate has, “Let us go outside”; the Syriac Peshitta similarly includes an invitation to the plain. Whether the invitation was lost from the shorter form or added to complete it is disputed.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  chosen: And Cain said
  alternatives:
  - And Cain spoke
  lexicon: HALOT
  rationale: The verb אמר ordinarily means 'say.' Although the shorter Hebrew form leaves the content of Cain's speech unstated, 'said' remains the most direct rendering; the longer wording is disclosed rather than supplied in the main text.
- source_word: אֶל
  chosen: to
  alternatives:
  - with
  lexicon: HALOT
  rationale: The preposition normally marks direction toward a person, hence 'to Abel.' Some English versions smooth to 'said to' or 'talked with'; 'to' best reflects the Hebrew.
- source_word: אָחִיו
  chosen: his brother
  lexicon: HALOT
  rationale: The construct with pronominal suffix is straightforward. Retaining 'his brother' preserves the narrative emphasis on fratricide, especially since the phrase recurs later in the verse.
- source_word: '[elliptical speech after וַיֹּאמֶר]'
  chosen: '[no words supplied in main text]'
  alternatives:
  - “Let us go to the field.” (Samaritan Hebrew and Greek)
  - “Let us go outside.” (Latin Vulgate)
  - “Let us go to the plain.” (Syriac Peshitta)
  lexicon: Septuagint; Samaritan Pentateuch; Vulgate; Peshitta (published texts, not fresh lexicon consultation)
  rationale: The current main text follows the local WLC/MT source and supplies no speech after 'And Cain said to Abel his brother.' The Samaritan Hebrew and consulted Greek edition include an invitation to the field; the Latin Vulgate says 'outside' and the Syriac Peshitta refers to the plain. The published partial wording of 4QGenb (4Q2) supports the shorter transition without preserving the entire speech introduction. Both early loss and completion remain possible; the published-source comparison justifies disclosure, not promotion of an earliest form.
- source_word: וַיְהִי בִּהְיוֹתָם
  chosen: Then, while they were
  alternatives:
  - And it happened when they were
  - When they were
  lexicon: HALOT
  rationale: This construction is a common narrative temporal frame. 'Then, while they were' gives readable modern English while preserving the temporal sense.
- source_word: בַּשָּׂדֶה
  chosen: in the field
  alternatives:
  - in the open country
  lexicon: HALOT
  rationale: שָׂדֶה most naturally means 'field/open country.' 'Field' is the standard and fits the narrative setting.
- source_word: וַיָּקָם ... אֶל
  chosen: rose up against
  alternatives:
  - attacked
  - rose against
  lexicon: HALOT
  rationale: The idiom 'rose up against' preserves the Hebrew imagery and hostility more closely than the more interpretive 'attacked,' while remaining natural English.
- source_word: וַיַּהַרְגֵהוּ
  chosen: killed him
  alternatives:
  - murdered him
  - struck him down
  lexicon: HALOT
  rationale: The verb הרג means 'kill/slay.' Although the act is morally murder, 'killed' is the more lexically direct rendering; 'murdered' would import a legal/moral categorization not explicit in the verb itself.
