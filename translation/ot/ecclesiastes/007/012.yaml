id: ECC.7.12
reference: Ecclesiastes 7:12
source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
translation:
  text: For wisdom provides shade just as money provides shade[a], but the advantage of knowledge is that wisdom keeps its possessors alive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “For in the shade of wisdom, in the shade of money.” Shade is an image of protection or shelter.
    reason: lexical_alternative
  - marker: b
    text: Or “wisdom gives life to its possessors.” The verb can mean “give life to” or “keep alive.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces an explanation for the preceding statement. 'For' fits the discourse flow in English better than the more ambiguous 'because' here.
- source_word: בְּצֵל
  chosen: provides shade
  alternatives:
  - is in the shadow of
  - is a protection
  - is a shade
  lexicon: HALOT
  rationale: Supplies natural English while retaining the Hebrew’s shade image.
- source_word: הַחָכְמָה
  chosen: wisdom
  lexicon: HALOT
  rationale: Standard rendering of חָכְמָה in Ecclesiastes; the context concerns practical and existential wisdom.
- source_word: בְּצֵל הַכָּסֶף
  chosen: money provides shade
  alternatives:
  - silver is a shelter
  - money is a protection
  lexicon: HALOT
  rationale: Preserves the repeated parallel expression.
- source_word: וְיִתְרוֹן
  chosen: but the advantage
  alternatives:
  - and the profit
  - and the benefit
  - and the superiority
  lexicon: HALOT
  rationale: 'יִתְרוֹן is a key Ecclesiastes term for gain, profit, or advantage. Here it introduces a contrastive qualification: wisdom and money both provide shelter, yet wisdom has an added benefit. Rendering with ''but the advantage'' brings out that contrast in idiomatic English.'
- source_word: דַּעַת
  chosen: of knowledge
  alternatives:
  - of understanding
  - of knowing
  lexicon: HALOT
  rationale: Construct relation with what follows is difficult, but 'the advantage of knowledge' is a natural rendering that preserves the noun's cognitive sense without overinterpreting.
- source_word: הַחָכְמָה
  chosen: wisdom
  lexicon: HALOT
  rationale: Repeated term retained consistently. The clause explains the specific advantage associated with wisdom.
- source_word: תְּחַיֶּה
  chosen: keeps alive
  alternatives:
  - gives life to
  - keeps alive
  - revives
  lexicon: HALOT
  rationale: This is a direct, contextually fitting sense of the Piel.
- source_word: בְעָלֶיהָ
  chosen: its possessors
  alternatives:
  - its owners
  - those who have it
  - its masters
  lexicon: HALOT
  rationale: Retains the possessive relation and the feminine reference to wisdom.
