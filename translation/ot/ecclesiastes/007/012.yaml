  from: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
  to: For wisdom provides shade just as money provides shade[a], but the advantage of knowledge is that wisdom keeps its possessors alive[b].
  rationale: “Provides shade” is a natural way to supply the verbless Hebrew while preserving the repeated concrete image of צֵל rather than replacing it with the inferred abstraction “shelter.” “Keeps its possessors alive” is an appropriate contextual rendering of the Piel verb and is more direct than “preserves the life of.”
