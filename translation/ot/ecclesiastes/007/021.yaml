id: ECC.7.21
reference: Ecclesiastes 7:21
source:
  edition: WLC
  text: גַּ֤ם לְ/כָל הַ/דְּבָרִים֙ אֲשֶׁ֣ר יְדַבֵּ֔רוּ אַל תִּתֵּ֖ן לִבֶּ֑/ךָ אֲשֶׁ֥ר לֹֽא תִשְׁמַ֥ע אֶֽת עַבְדְּ/ךָ֖ מְקַלְלֶֽ/ךָ־־־־׃
translation:
  text: Also, do not take to heart everything people say[a], lest you hear your servant[b] cursing you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “do not give your heart to every word that they speak.”'
    reason: literal_rendering
  - marker: b
    text: Or “slave.” The Hebrew עֶבֶד can refer to a servant or a slave, depending on the context.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  chosen: Also
  alternatives:
  - Even
  - Moreover
  lexicon: HALOT
  rationale: Introduces an additional piece of wisdom connected to the surrounding context. 'Also' is natural English and preserves the additive force without overemphasis.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  chosen: everything people say
  alternatives:
  - to all the things that are said
  - to everything they say
  lexicon: HALOT
  rationale: Natural English for the spoken content and indefinite plural subject.
- source_word: אַל תִּתֵּן לִבֶּךָ
  chosen: do not take to heart
  alternatives:
  - do not pay attention
  - do not take to heart
  lexicon: HALOT
  rationale: Natural English idiom for the Hebrew expression; the literal image is retained in a note.
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  chosen: lest you hear
  alternatives:
  - so that you may not hear
  - otherwise you will hear
  lexicon: HALOT
  rationale: Preserves the warning/result force without weakening it to a mere possibility.
- source_word: עַבְדְּךָ
  chosen: your servant
  alternatives:
  - your slave
  lexicon: HALOT
  rationale: עֶבֶד can denote servant or slave. In this wisdom context the bonded status is not theologically salient; the point is social subordination within a household. Per translation philosophy, 'servant' is preferable here, while 'slave' remains a viable lexical alternative.
- source_word: מְקַלְלֶךָ
  chosen: cursing you
  alternatives:
  - reviling you
  - speaking evil of you
  lexicon: HALOT
  rationale: From קלל in the sense 'to curse, treat with contempt.' 'Cursing you' is the most direct and natural rendering in context, matching the interpersonal offense envisioned.
