  from: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
  to: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
  rationale: Restored drafter 'the masters of collections' (preserving difficult בַּעֲלֵי אֲסֻפּוֹת) and 'from one shepherd' (מִן source preposition) per chosen renderings.
- timestamp: '2026-08-28T22:19:25Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: ambiguity
  tier: 1
  from: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
  to: The words of the wise are like goads, and like firmly planted nails are the masters of collections[a]; they are given from one shepherd.[b]
  rationale: Moving the notes to the expressions they discuss is necessary. However, “the collected sayings” does not translate בַּעֲלֵי (“masters/owners”) and resolves a notoriously difficult construction without marking that resolution. “Masters of collections” is unusual but intelligible English and preserves the source expression and its ambiguity; the note can provide the principal alternatives. With passive נִתְּנוּ, מִן most directly marks source, so “from one shepherd” is preferable to the proposal’s more agentive “by one shepherd.”
