id: ECC.1.2
reference: Ecclesiastes 1:2
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
translation:
  text: Vapor of vapors[a], says Qoheleth[b]; vapor of vapors—all is vapor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew hevel means 'vapor' or 'breath.' 'Vapor of vapors' is a Hebrew superlative, expressing what is
      supremely fleeting, insubstantial, or elusive.
    reason: lexical_choice
  - marker: b
    text: Qoheleth is the Hebrew designation traditionally rendered 'Teacher' or 'Preacher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל
  chosen: vapor
  alternatives:
  - breath
  lexicon: HALOT
  rationale: The concrete noun denotes breath or vapor. 'Vapor' preserves the image of something fleeting and hard to
    grasp without suggesting that everything literally consists of breath.
- source_word: הֲבֵל הֲבָלִים
  chosen: vapor of vapors
  alternatives:
  - breath of breaths
  lexicon: HALOT
  rationale: The construct is a Hebrew superlative. Retaining the repeated concrete noun preserves the poem's
    programmatic image and force.
- source_word: אָמַר
  chosen: says
  alternatives:
  - said
  lexicon: HALOT
  rationale: Although morphologically qatal, Hebrew speech formulas in proverbial or literary framing function
    performatively and are idiomatically rendered with the English present. 'Says Qoheleth' fits the discourse register
    and keeps the statement vivid.
- source_word: קֹהֶלֶת
  chosen: Qoheleth
  alternatives:
  - the Teacher
  - the Preacher
  - the Assembler
  lexicon: HALOT
  rationale: Following the transliterate-when-uncertain philosophy, 'Qoheleth' preserves the Hebrew designation without
    prematurely resolving its nuance. 'Teacher' and 'Preacher' each narrow the semantic range differently.
- source_word: הַכֹּל
  chosen: all
  alternatives:
  - everything
  lexicon: HALOT
  rationale: In the compressed summary, 'all' is the natural English subject and does not narrow the scope.
- source_word: הָבֶל
  chosen: vapor
  alternatives:
  - breath
  lexicon: HALOT
  rationale: The final predicate repeats the programmatic image without adding 'mere,' which is not expressed by the
    source.
