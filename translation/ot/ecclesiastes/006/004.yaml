  from: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
  to: For it comes in futility[a] and goes in darkness, and its name is covered in darkness[b].
  rationale: “Comes in vanity” is obscure English, but “like a vapor” changes the Hebrew prepositional expression into a simile and foregrounds only one aspect of הֶבֶל. “In futility” is natural, preserves the construction, and leaves the vapor image as an honest alternative in the note. “Its” consistently refers to the stillborn child, and the reordered final clause retains the repeated darkness image.
