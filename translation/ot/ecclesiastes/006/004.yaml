  review_summary: “Comes in vanity” is obscure English, but “like a vapor” changes the Hebrew prepositional expression into a simile and foregrounds only one aspect of הֶבֶל. “In futility” is natural, preserves the construction, and leaves the vapor image as an honest alternative in the note. “Its” consistently refers to the stillborn child, and the reordered final clause retains the repeated darkness image.
