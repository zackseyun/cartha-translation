id: JOB.34.26
reference: Job 34:26
source:
  edition: WLC
  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
translation:
  text: He strikes them as wicked people in full view[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'He strikes them for their wickedness in full view.' The difficult opening phrase may describe the grounds
      for their punishment rather than the status in which they are struck.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  chosen: as
  alternatives:
  - for
  - in place of
  lexicon: HALOT
  rationale: With 'wicked people,' the preposition is best understood as the status in which they are publicly struck. A
    causal construal remains footnoted.
- source_word: רְשָׁעִים
  chosen: wicked people
  alternatives:
  - the wicked
  lexicon: HALOT
  rationale: The plural adjective functions substantivally and does not require a male limitation in generic English.
- source_word: סְפָקָם
  chosen: He strikes them
  alternatives:
  - He claps at them
  - He strikes them down
  lexicon: HALOT
  rationale: The verb denotes striking. 'Down' would add a result not explicit in the form.
- source_word: בִּמְקוֹם
  chosen: in
  alternatives:
  - in a place
  lexicon: HALOT
  rationale: 'Together with the participle of seeing, the phrase describes public visibility rather than a second independent
    place.'
- source_word: רֹאִים
  chosen: full view
  alternatives:
  - where people can see
  - before onlookers
  lexicon: HALOT
  rationale: The participle denotes observers. 'In full view' expresses the public judicial setting naturally.
