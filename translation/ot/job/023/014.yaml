  from: For he will complete what is appointed for me[a], and many such things are with him.
  to: For he will complete what is appointed for me[a], and he has many such things.
  rationale: The final Hebrew expression literally says that many such things are “with him,” an idiom that naturally conveys possession or availability. “He has many such things” removes a genuinely wooden English construction without defining what those comparable matters are. The existing note on what is appointed for Job remains pertinent.
