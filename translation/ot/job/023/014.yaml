  chosen_reading: what is appointed for me
  alternative_readings:
  - my decree
  - my statute
  - my appointed portion
  rationale: The immediate context concerns God's determination of Job's path and destiny, not Job's own legal ordinance. This rendering preserves divine sovereignty without importing a more technical legal sense than the context warrants.
