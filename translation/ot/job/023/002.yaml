id: JOB.23.2
reference: Job 23:2
source:
  edition: WLC
  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
translation:
  text: Even today my complaint is defiant[a]; my hand is heavy over my groaning.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my complaint is rebellion.” Some interpret the Hebrew as “my complaint is bitter,” but the usual sense of the noun is rebellion or defiance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “my hand is heavy over my groaning.” The clause is difficult; some emend “my hand” to “his hand.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  chosen: Even
  alternatives:
  - also
  - indeed
  lexicon: HALOT
  rationale: Used with הַיּוֹם to form the idiomatic temporal emphasis 'Even today,' highlighting that Job's condition persists up to the present.
- source_word: הַיּוֹם
  chosen: today
  alternatives:
  - this day
  lexicon: HALOT
  rationale: Temporal adverbial use; 'today' is natural modern English and preserves the immediacy of Job's statement.
- source_word: מְרִי
  chosen: defiant
  alternatives:
  - bitter
  - rebellion
  lexicon: HALOT
  rationale: Natural English predicate retaining the noun’s defiance/rebellion sense in context.
- source_word: שִׂיחִי
  chosen: my complaint
  alternatives:
  - my meditation
  - my discourse
  - my musing
  lexicon: HALOT
  rationale: In Job this noun can denote speech, musing, or complaint. Given the lament context and parallel with groaning, 'my complaint' best fits the discourse situation without over-paraphrasing.
- source_word: יָדִי
  chosen: my hand
  alternatives:
  - his hand
  lexicon: HALOT
  rationale: The consonantal text with 1cs suffix naturally yields 'my hand.' Although some interpreters understand the phrase idiomatically or emend toward 'his hand,' the MT should be retained in the main text.
- source_word: כָּבְדָה
  chosen: is heavy
  alternatives:
  - has become heavy
  - lies heavy
  lexicon: HALOT
  rationale: The verb denotes heaviness or weight. Present English 'is heavy' communicates the stative sense clearly in context.
- source_word: עַל
  chosen: over
  alternatives:
  - upon
  - over
  - against
  lexicon: HALOT
  rationale: Preserves the clause’s unresolved relational force rather than imposing causation.
- source_word: אַנְחָתִי
  chosen: my groaning
  alternatives:
  - my sighing
  lexicon: HALOT
  rationale: The noun refers to lamenting sighs/groans. 'Groaning' fits the intensity of Job's suffering and pairs naturally with 'complaint.'
