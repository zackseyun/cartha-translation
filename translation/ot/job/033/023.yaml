  from: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
  to: If there is for him an angel[a], a mediator, one among a thousand, to tell a man what is right for him[b],
  rationale: “His uprightness” is too readily heard in English as an affirmation of the sufferer’s moral uprightness. In this context, ישרו idiomatically denotes what is right for him—his proper course. “A man” naturally represents the indefinite singular אדם.
