id: JOB.38.14
reference: Job 38:14
source:
  edition: WLC
  text: תִּ֭תְהַפֵּךְ כְּ/חֹ֣מֶר חוֹתָ֑ם וְ֝/יִֽתְיַצְּב֗וּ כְּמ֣וֹ לְבֽוּשׁ׃
translation:
  text: It changes like clay under a seal[a], and they stand out like a garment.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “like clay of a seal”; the comparison is to clay altered by a seal’s impression.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts to “they” without stating its antecedent. It may refer to forms or features becoming visible, but the reference is uncertain.
    reason: ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  chosen: changes
  alternatives:
  - is turned
  - changes itself
  - is transformed
  lexicon: HALOT
  rationale: The Hitpael depicts the earth undergoing a change of form or appearance; “changes” is natural without implying an unstated agent.
- source_word: כְּחֹמֶר
  chosen: like clay
  alternatives:
  - as clay
  lexicon: HALOT
  rationale: חֹמֶר is ordinary clay. The simile compares the earth's appearance to clay receiving an impression.
- source_word: חוֹתָם
  chosen: under a seal
  alternatives:
  - for a seal
  - of a seal
  - beneath a seal
  lexicon: HALOT
  rationale: The phrase כְחֹמֶר חוֹתָם is elliptical. 'Under a seal' makes explicit the image of clay being impressed by a seal, which best communicates the Hebrew comparison in idiomatic English.
- source_word: ויתיצבו
  chosen: they stand out
  alternatives:
  - they take their stand
  - they present themselves
  - they stand forth
  lexicon: HALOT
  rationale: The plural verb likely refers to features of the earth revealed by daylight. 'Stand out' captures emergence into visible definition better than the more wooden 'take their stand.'
- source_word: כמו לבוש
  chosen: like a garment
  alternatives:
  - as clothing
  - like clothing
  lexicon: HALOT
  rationale: לְבוּשׁ denotes clothing/garment. 'Like a garment' preserves the singular image and the poetic comparison, likely evoking folds or contours becoming visible.
- source_word: וְיִתְיַצְּבוּ
  chosen: and they stand out
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This idiomatically conveys becoming visibly distinct while retaining the plural and its unstated antecedent.
