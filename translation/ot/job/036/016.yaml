id: JOB.36.16
reference: Job 36:16
source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
translation:
  text: Indeed, he drew you away from the mouth of distress into a broad place with no constraint beneath it[a], and what is set on your table is full of rich food.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; it contrasts the “mouth” or “jaws” of a narrow distress with an unrestricted broad place.
    reason: alternative_reading
  - marker: b
    text: Hebrew “full of fatness,” an image of rich food and abundance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  chosen: Indeed
  alternatives:
  - And also
  - Moreover
  - Even now
  lexicon: HALOT
  rationale: Introduces and intensifies the statement. 'Indeed' captures the emphatic/additive force in natural English without overtranslating.
- source_word: הֲסִיתְךָ
  chosen: he drew you away
  alternatives:
  - he enticed you
  - he moved you
  - he incited you
  lexicon: HALOT
  rationale: Conveys inducement or movement away without importing deception.
- source_word: מִפִּי צָר
  chosen: out of the mouth of distress
  alternatives:
  - from the mouth of trouble
  - from the jaws of affliction
  - from the mouth of a narrow place
  lexicon: HALOT
  rationale: פֶּה 'mouth' is retained metaphorically rather than paraphrased away; צַר can denote distress, straits, or narrowness. 'Distress' preserves both the affliction sense and the contrast with the following 'broad place.'
- source_word: רַחַב
  chosen: a broad place
  alternatives:
  - a spacious place
  - roominess
  - freedom
  lexicon: HALOT
  rationale: The noun/adjective conveys breadth or spaciousness. 'Broad place' preserves the concrete spatial metaphor common in Hebrew poetry, while remaining understandable.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  chosen: with no constraint beneath it
  alternatives:
  - where there is no restriction under it
  - with no narrowness under it
  - unconfined beneath
  lexicon: HALOT
  rationale: מוּצָק here is difficult; in context it contrasts with constriction/straits. The phrase describes the broad place as unconstricted. 'With no constraint beneath it' preserves the imagery while making sense in English.
- source_word: וְנַחַת
  chosen: what is set
  alternatives:
  - and the setting
  - and rest
  - and what was laid down
  lexicon: HALOT
  rationale: A defensible contextual rendering of the rare noun in relation to the table.
- source_word: שֻׁלְחָנְךָ
  chosen: your table
  lexicon: HALOT
  rationale: Straightforward lexical rendering; the image is of provision or feasting.
- source_word: מָלֵא דָשֶׁן
  chosen: is full of rich food
  alternatives:
  - was full of fatness
  - was full of rich food
  - was full of abundance
  lexicon: HALOT
  rationale: Keeps the image of abundance and rich fare in idiomatic English.
