id: JOB.22.11
reference: Job 22:11
source:
  edition: WLC
  text: אוֹ חֹ֥שֶׁךְ לֹֽא תִרְאֶ֑ה וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־־־׃
translation:
  text: or darkness, so that you cannot see, and a flood of water[a] covers you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is literally “an abundance of waters” and may describe overflowing waters.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  chosen: or
  alternatives:
  - or else
  lexicon: HALOT
  rationale: 'אוֹ most naturally introduces the next calamity in Eliphaz''s description: ''or darkness...'' English ''or'' preserves the terse connective force without overexpansion.'
- source_word: חֹשֶׁךְ
  chosen: darkness
  alternatives:
  - gloom
  - obscurity
  lexicon: HALOT
  rationale: The noun denotes darkness in a literal or figurative sense. 'Darkness' is the most direct and idiomatic rendering and fits the imagery of inability to see.
- source_word: לֹא תִרְאֶה
  chosen: so that you cannot see
  alternatives:
  - you do not see
  - you cannot see it
  lexicon: HALOT
  rationale: The Hebrew is literally 'you do not see.' In context, after the verbless 'or darkness,' English requires a slight smoothing. 'So that you cannot see' captures the resultant force of the darkness more naturally than a bare 'you do not see.'
- source_word: וְשִׁפְעַת
  chosen: and a flood of
  alternatives:
  - and a flood of
  - and a torrent of
  - and plenty of
  lexicon: HALOT
  rationale: With מים, “flood of” is an idiomatic expression for an overflowing abundance without replacing the covering image of כסה.
- source_word: מַיִם
  chosen: water
  alternatives:
  - water
  lexicon: HALOT
  rationale: Hebrew מים is formally plural, but English idiom uses the mass noun after “a flood of.”
- source_word: תְּכַסֶּךָּ
  chosen: covers you
  alternatives:
  - overwhelms you
  - conceals you
  lexicon: HALOT
  rationale: The Piel of כסה means 'cover.' 'Covers you' is the most transparent rendering. 'Overwhelms you' is an interpretive extension suggested by context, but the main text should retain the more literal image.
