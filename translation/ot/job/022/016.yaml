  from: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
  to: who were snatched away[a] before their time, whose foundation was poured out like a river.[b]
  rationale: The current “was washed away by a river” resolves the compressed and difficult second colon by making the river an agent and by replacing יצק’s pouring image. “Was poured out like a river” preserves the key lexical image and leaves the precise relation less overdetermined. The note appropriately explains the remaining syntactic ambiguity.
