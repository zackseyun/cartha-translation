id: JOB.22.16
reference: Job 22:16
source:
  edition: WLC
  text: אֲשֶֽׁר קֻמְּט֥וּ וְ/לֹא עֵ֑ת נָ֝הָ֗ר יוּצַ֥ק יְסוֹדָֽ/ם־־׃
translation:
  text: who were snatched away[a] before their time, whose foundation was poured out like a river.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may suggest being seized, shriveled, or suddenly removed.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is compressed and may be rendered literally, “a river was poured out—their foundation.” It may depict their foundation as poured away like a river or as swept away by overflowing water, perhaps alluding to the flood.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: who
  alternatives:
  - who/which
  - those who
  lexicon: HALOT
  rationale: Relative particle introducing the description of the wicked mentioned in context; 'who' is the most natural English connector for persons.
- source_word: קֻמְּטוּ
  chosen: were snatched away
  alternatives:
  - were cut down
  - were shriveled up
  - were seized
  lexicon: HALOT
  rationale: The passive form conveys a sudden removal or being taken away. In this context of premature destruction, 'were snatched away' best captures the force without overcommitting to a physical-image gloss like 'shriveled up.'
- source_word: וְלֹא עֵת
  chosen: before their time
  alternatives:
  - and not at the proper time
  - not in due time
  - when it was not time
  lexicon: HALOT
  rationale: Idiomatic Hebrew for an untimely end. 'Before their time' is clear modern English and preserves the sense of premature judgment.
- source_word: נָהָר
  chosen: like a river
  alternatives:
  - a stream
  - the river
  - a flood
  lexicon: HALOT
  rationale: The comparative rendering preserves the river image while not asserting that the river is the grammatical agent of the passive verb.
- source_word: יוּצַק
  chosen: was poured out
  alternatives:
  - was poured out
  - was cast down
  - was flooded over
  lexicon: HALOT
  rationale: The passive verb’s central image is pouring out; this avoids the unmarked shift to “washed away.”
- source_word: יְסוֹדָם
  chosen: their foundation
  alternatives:
  - their base
  - their foundations
  lexicon: HALOT
  rationale: Singular collective noun with 3mp suffix. 'Their foundation' is the most idiomatic rendering and fits the metaphor of collapse under judgment.
