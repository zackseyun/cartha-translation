  from: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
  to: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned the sheep and the young men and consumed them, and I alone have escaped to tell you.”
  rationale: With fire as subject, בער ב identifies what the fire burned; “burned among” misleadingly makes the animals and men merely the location of the fire. “Burned ... and consumed them” retains the Hebrew’s two coordinated verbs without needless collapse.
