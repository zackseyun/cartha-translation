  from: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
  to: How often is the lamp of the wicked put out,[a] and how often does their disaster come upon them? How often does he apportion pains in his anger?
  rationale: The initial כַּמָּה has scope over the successive questions. Repeating “how often” makes that scope explicit and prevents the latter clauses from sounding like assertions. “Pains” is more direct than “sorrows” for חֲבָלִים in this judicial context. The retained note belongs with the lamp image; the other proposed notes are not necessary.
