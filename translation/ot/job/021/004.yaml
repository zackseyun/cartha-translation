  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
translation:
  text: As for me, is my complaint addressed to a man? If it were, why should my spirit not be impatient?
