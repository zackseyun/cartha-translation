id: JOB.6.22
reference: Job 6:22
source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
translation:
  text: Have I ever said, ‘Give me,’ or, ‘Pay a bribe[b] for me out of your resources[a],’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew כֹּחַ literally means “strength” or “power,” but here it refers to one’s means or resources.
    reason: lexical_alternative
  - marker: b
    text: The verb is related to the noun for a “bribe” or “gift”; here it refers to making a payment on Job’s behalf.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  chosen: Have I ever
  alternatives:
  - Did I
  - Is it that I
  lexicon: HALOT
  rationale: Introduces a rhetorical question with emphatic force. In context Job is denying that he made such demands of his friends; 'Have I ever' brings out the rebuttal naturally in English while preserving the interrogative sense.
- source_word: אָמַרְתִּי
  chosen: said
  alternatives:
  - spoken
  - asked
  lexicon: HALOT
  rationale: The verb is the common 'say.' Although the sense is that of making a request, 'said' stays closer to the Hebrew and lets the quoted imperatives carry the force of the request.
- source_word: הָבוּ לִי
  chosen: Give me
  alternatives:
  - Give me
  - Provide for me
  lexicon: HALOT
  rationale: The Hebrew leaves the object unstated, as natural English may also do here.
- source_word: וּמִכֹּחֲכֶם
  chosen: out of your resources
  alternatives:
  - From your strength
  - From your resources
  - Out of your substance
  lexicon: HALOT
  rationale: In this context כוח refers idiomatically to available means rather than physical strength.
- source_word: שִׁחֲדוּ
  chosen: pay a bribe
  alternatives:
  - bribe
  - give a gift
  - make a payment
  lexicon: HALOT
  rationale: The verb derives from שֹׁחַד, 'bribe.' Here Job denies asking them to expend their own resources to secure his cause. 'Pay a bribe' makes the transactional sense explicit in idiomatic English. Because 'bribe' can sound morally charged, the wording preserves the lexical force rather than softening it to 'gift.'
- source_word: בַעֲדִי
  chosen: for me
  alternatives:
  - for me
  - for my sake
  lexicon: HALOT
  rationale: This is a natural rendering of the beneficiary phrase.
