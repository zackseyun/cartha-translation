id: JOB.8.14
reference: Job 8:14
source:
  edition: WLC
  text: אֲשֶׁר יָק֥וֹט כִּסְל֑/וֹ וּ/בֵ֥ית עַ֝כָּבִ֗ישׁ מִבְטַחֽ/וֹ־׃
translation:
  text: Whose confidence is cut off,[a] and whose trust is a spider’s web.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is rare and uncertain; it may mean “is cut off” or “is severed.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “a spider’s house.”
    reason: literal_form
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: whose
  alternatives:
  - for whom
  - whose—
  lexicon: HALOT
  rationale: Relative particle linking this verse to the wicked/hypocrite described in context. 'Whose' gives smooth English by attaching the clause directly to the antecedent implied from the previous verse.
- source_word: יָקוֹט
  chosen: is cut off
  alternatives:
  - is loathed
  - is severed
  - is fragile
  lexicon: HALOT
  rationale: This is the best-supported contextual rendering of the difficult verb; “fragile” interprets the simile rather than translating the verb.
- source_word: כִּסְלוֹ
  chosen: his confidence
  alternatives:
  - his hope
  - his folly
  - his loins
  lexicon: HALOT
  rationale: Though the noun can denote 'loins' in some contexts and is related to ideas of folly elsewhere, in wisdom literature it often carries the sense of confidence/security. Here that sense is demanded by the parallel with מִבְטַחוֹ ('his trust'). 'Confidence' avoids redundancy while preserving the semantic field of security.
- source_word: וּבֵית
  chosen: and ... house
  alternatives:
  - and ... home
  lexicon: HALOT
  rationale: The conjunction plus construct noun introduces the second parallel colon. 'House' is retained rather than 'home' because the image is literal and fragile, not domestic or emotive.
- source_word: עַכָּבִישׁ
  chosen: spider’s
  alternatives:
  - of a spider
  lexicon: HALOT
  rationale: Standard rendering of the noun. The possessive form in English is natural in the construct chain 'house of a spider'.
- source_word: מִבְטַחוֹ
  chosen: his trust
  alternatives:
  - his security
  - that in which he trusts
  lexicon: HALOT
  rationale: The noun denotes object or ground of trust/security. 'His trust' preserves the compact Hebrew expression and works well in parallel with 'his confidence.' The metaphor then identifies that trust as no sturdier than a spider's house/web.
- source_word: בֵּית עַכָּבִישׁ
  chosen: a spider’s web
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Web” is the ordinary English referent of the Hebrew image, with the literal wording retained in a note.
