id: JOB.13.15
reference: Job 13:15
source:
  edition: WLC
  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
translation:
  text: Though he slay me, I will not wait; yet I will argue my ways before him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew source records the written form (ketiv) “not” and the traditional reading (qere) “to him.” With the qere, the clause can mean “I will hope in him.” The verb can express waiting or hope; “I have no hope” is another interpretation of the written form. This comparison does not establish which reading is earlier.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  chosen: Though
  alternatives:
  - Behold
  - Indeed
  lexicon: HALOT
  rationale: Introduces a concessive or emphatic clause here. In context with the following verb, English 'Though' best captures the force in natural modern style.
- source_word: יִקְטְלֵנִי
  chosen: he slay me
  alternatives:
  - he kill me
  lexicon: HALOT
  rationale: From קטל, 'kill/slay.' 'Slay' preserves the elevated, grave tone of Job's speech better than the flatter 'kill.'
- source_word: לֹא אֲיַחֵל
  chosen: I will not wait
  alternatives:
  - I have no hope
  - I will not hope
  lexicon: Published contextual comparison; see docs/JOB_13_15_SOURCE_COMPARISON_2026-09-06.md
  rationale: The retained written form supplies negation, not a unique English sense of the verb. “I will not wait” interprets Job as refusing to delay presenting his case despite the risk of death; absence of hope is another contextual interpretation. The waiting interpretation remains provisional, not lexically required by the negation. No fresh HALOT consultation is claimed.
- source_word: אַךְ
  chosen: yet
  alternatives:
  - surely
  - nevertheless
  - only
  lexicon: HALOT
  rationale: Marks contrast or limitation. 'Yet' fits the adversative turn from possible death to Job's determination to speak.
- source_word: דְּרָכַי
  chosen: my ways
  alternatives:
  - my conduct
  - my case
  lexicon: HALOT
  rationale: Literally 'my ways.' It can imply conduct or course of life; 'my ways' preserves the Hebrew image while remaining understandable.
- source_word: אֶל־פָּנָיו
  chosen: before him
  alternatives:
  - to his face
  - in his presence
  lexicon: HALOT
  rationale: Literally 'to his face.' In idiomatic English, 'before him' conveys direct presentation in God's presence without awkwardness.
- source_word: אוֹכִיחַ
  chosen: I will argue
  alternatives:
  - I will prove
  - I will reprove
  - I will defend
  lexicon: HALOT
  rationale: Hiphil of יכח here carries the sense of presenting or arguing a case. 'Argue' best fits the legal/disputational context in Job.
- source_word: הֵן יִקְטְלֵנִי
  chosen: Though he slay me
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: In context הֵן may introduce the concession naturally; no English modal such as “may” needs to be added.
