theological_decisions:
- issue: Distinguishing the Hebrew written and traditional read forms from the English interpretation of the verb
  chosen_reading: Retain the written form with negation and current main English provisionally
  alternative_readings:
  - Though he slay me, yet will I hope in him
  rationale: The declared source follows the Hebrew written form (ketiv), while the same source records the traditional reading (qere). Both belong to the Hebrew textual tradition; this is not a choice between original-language evidence and an English tradition. Retention does not establish that the written form is earlier. The English sense of the verb requires separate contextual judgment.
  doctrine_reference: Translation philosophy §1, §3
