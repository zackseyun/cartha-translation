  from: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
  to: By his breath the heavens became fair[a]; his hand formed the fleeing serpent[b][c].
  rationale: The prior adjudication appropriately makes “formed” the main reading and preserves “pierced” as an alternative, but “he made the heavens fair” introduces an explicit subject and causative construction not grammatically expressed in שִׁפְרָה. The feminine singular verb agrees with “heavens” as a collective and is naturally rendered “became fair” or “grew bright.” “Became fair” retains the broad beautifying sense without turning the clause into a weather description or inventing causative morphology. Notes are attached to the expressions they address.
