id: JOB.3.14
reference: Job 3:14
source:
  edition: WLC
  text: עִם מְ֭לָכִים וְ/יֹ֣עֲצֵי אָ֑רֶץ הַ/בֹּנִ֖ים חֳרָב֣וֹת לָֽ/מוֹ־׃
translation:
  text: with kings and counselors of the earth, who built desolate places for themselves[a],
  footnotes:
  - marker: a
    text: Literally, “built ruins for themselves.” The difficult phrase may refer to ruined or desolate places, perhaps structures rebuilt from ruins or structures that later became ruins.
    reason: semantic_difficulty
