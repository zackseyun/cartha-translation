  to: For my sighing comes before my bread[a], and my roarings pour out like water[b].
  rationale: שַׁאֲגֹתַי is the plural of a term ordinarily used for roaring and should not be flattened entirely into “groanings.” “My roars” is possible but sounds less natural as an English subject here; “my roarings” is idiomatic enough in elevated lament and better sustains the lexical image. The alternative “groanings” belongs in a note, while the bread/food note remains correctly scoped.
