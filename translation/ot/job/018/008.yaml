  text: כִּֽי שֻׁלַּ֣ח בְּ/רֶ֣שֶׁת בְּ/רַגְלָ֑י/ו וְ/עַל שְׂ֝בָכָ֗ה יִתְהַלָּֽךְ־־׃
translation:
  text: For his own feet carry him into a net, and he walks on a lattice.
