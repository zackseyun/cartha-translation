lexical_decisions:
- source_word: שֻׁלַּח בְּרֶשֶׁת בְּרַגְלָיו
  chosen: his own feet carry him into a net
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English conveys the construction's meaning that his own feet are the means of entering the net.
- source_word: וְעַל שְׂבָכָה יִתְהַלָּךְ
  chosen: and he walks on a lattice
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: עַל denotes position on or over, while שְׂבָכָה is an independent lattice/netting image; no possessive relation is explicit.
