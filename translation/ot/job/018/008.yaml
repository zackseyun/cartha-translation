  from: For he is cast into a net by his own feet[b][a], and he walks on a mesh.
  to: For he is sent into a net by his own feet, and he walks onto a mesh.
  rationale: 'Wholesale revert of azure-gpt-5.4 2026-04-23 pass: restores drafter text. Chosen renderings preserved: [''is sent'']. Applied via definitive_apply (fuzzy fingerprint match handling LORD/Yahweh, footnote markers, and quote normalization).'
- timestamp: '2026-08-28T22:13:13Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: For he is sent into a net by his own feet, and he walks onto a mesh.
  to: For his own feet carry him into a net, and he walks on a lattice.
  rationale: The passive literalism "he is sent ... by his own feet" is markedly unnatural in English and obscures the point that his own movement brings him into the trap. "His own feet carry him" is a natural source-faithful recasting. The second colon means that he walks on/over a lattice or netting, not "onto" it. However, "its mesh" adds a possessive link not expressed in the Hebrew and narrows שְׂבָכָה to the preceding net; retain the independent poetic image, "a lattice."
