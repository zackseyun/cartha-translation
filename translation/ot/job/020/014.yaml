id: JOB.20.14
reference: Job 20:14
source:
  edition: WLC
  text: לַ֭חְמ/וֹ בְּ/מֵעָ֣י/ו נֶהְפָּ֑ךְ מְרוֹרַ֖ת פְּתָנִ֣ים בְּ/קִרְבּֽ/וֹ׃
translation:
  text: His food turns in his belly; it is the venom of poisonous snakes within him.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: לַחְמוֹ
  chosen: his food
  alternatives:
  - his bread
  lexicon: HALOT
  rationale: Though the noun often literally means 'bread,' in context it stands more broadly for what he has eaten. 'Food' communicates the sense naturally in English while preserving the concrete imagery of what is consumed.
- source_word: בְּמֵעָיו
  chosen: in his belly
  alternatives:
  - in his inward parts
  - in his bowels
  lexicon: HALOT
  rationale: The term refers to the internal organs/entrails. 'In his belly' is idiomatic modern English and fits the digestive imagery of the verse better than the more archaic 'bowels' or the vaguer 'inward parts'.
- source_word: נֶהְפָּךְ
  chosen: turns
  alternatives:
  - is changed
  - is transformed
  - is overturned
  lexicon: HALOT
  rationale: This naturally conveys the food’s change of state within him.
- source_word: מְרוֹרַת
  chosen: the venom of
  alternatives:
  - the gall of
  - the bitterness of
  lexicon: HALOT
  rationale: Although the noun is related to 'bitterness/gall,' in this collocation with snakes it denotes poisonous bile/venom. 'Venom' best communicates the intended image to modern readers. 'Gall' is a traditional rendering and is preserved as an alternative.
- source_word: פְּתָנִים
  chosen: poisonous snakes
  alternatives:
  - asps
  - vipers
  lexicon: HALOT
  rationale: The source denotes venomous snakes, but a precise modern species identification is uncertain.
- source_word: בְּקִרְבּוֹ
  chosen: within him
  alternatives:
  - in his midst
  - inside him
  lexicon: HALOT
  rationale: The phrase refers to what is inside the wicked man. 'Within him' is natural English and preserves the internalized, bodily force of the image.
