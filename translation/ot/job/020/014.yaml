  from: his food in his belly is turned[a]; it is the venom of cobras within him.
  to: His food turns in his belly; it is the venom of poisonous snakes within him.
  rationale: “Is turned” is unnatural English, and “turns” is a good natural rendering of the change expressed by נֶהְפָּךְ. The second colon is a nominal identification, however, not explicitly “becomes”; “it is” preserves the Hebrew relation more closely. Broad “poisonous snakes” avoids an uncertain species identification for פְּתָנִים.
