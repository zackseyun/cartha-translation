  from: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
  to: How much less when you say, “You do not see him.” Your case is before him, so wait for him.[a]
  rationale: The current footnote marker is attached to “say” although the note concerns the final verb, and “must” adds modal force not explicitly expressed. The prior “and wait for him” is grammatically abrupt after an indicative clause. Treating the final imperfect as an exhortation and rendering the relation with “so” gives coherent English without false precision; the note retains the verb’s lexical difficulty.
