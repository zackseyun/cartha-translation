id: JOB.15.23
reference: Job 15:23
source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
translation:
  text: 'He wanders about in search of bread: “Where is it?” He knows that a day of darkness is ready at hand for him.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “ready in his hand.” The expression may mean that the day of darkness is close at hand for him.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  chosen: wanders about
  alternatives:
  - wanders
  - roams
  - is a fugitive
  lexicon: HALOT
  rationale: Qal participle of נדד denotes restless wandering or roaming. 'Wanders about' captures the ongoing, unsettled action in idiomatic English without overinterpreting it as exile.
- source_word: לַלֶּחֶם
  chosen: in search of bread
  alternatives:
  - for food
  - for a loaf
  lexicon: HALOT
  rationale: Natural purposive English while preserving the concrete “bread.”
- source_word: אַיֵּה
  chosen: “Where is it?”
  alternatives:
  - Where is bread?
  - Where?
  lexicon: HALOT
  rationale: The question can stand directly without supplying “saying.”
- source_word: יָדַע
  chosen: He knows
  alternatives:
  - He realizes
  - He is sure
  lexicon: HALOT
  rationale: Simple perfect of ידע, expressing settled awareness. 'He knows' is the most direct rendering.
- source_word: נָכוֹן
  chosen: is ready
  alternatives:
  - is prepared
  - is fixed
  - is established
  lexicon: HALOT
  rationale: The passive/adjectival form conveys something prepared or made ready. 'Is ready' fits the impending sense of judgment/disaster in context.
- source_word: בידו
  chosen: at hand for him
  alternatives:
  - in his hand
  - for him
  - beside him
  lexicon: HALOT
  rationale: Literally 'in his hand,' but in this idiom the sense is that the day of darkness is close upon him or within his grasp/lot. 'At hand for him' communicates imminence without the awkward literalism of 'in his hand.'
- source_word: יום חשך
  chosen: a day of darkness
  alternatives:
  - the day of darkness
  - a dark day
  lexicon: HALOT
  rationale: Construct phrase meaning a day characterized by darkness, here likely calamity or doom. 'A day of darkness' preserves the Hebrew imagery and avoids flattening it into mere metaphor.
- source_word: נָכוֹן בְּיָדוֹ
  chosen: ready at hand for him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Retains the idiom’s prepared and imminent force, with the literal wording noted.
