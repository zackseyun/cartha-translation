id: JOB.24.11
reference: Job 24:11
source:
  edition: WLC
  text: בֵּין שׁוּרֹתָ֥/ם יַצְהִ֑ירוּ יְקָבִ֥ים דָּ֝רְכ֗וּ וַ/יִּצְמָֽאוּ־׃
translation:
  text: Between their walls they press out oil[a]; they tread winepresses, yet they go thirsty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult. “Their walls” may refer to walled enclosures, and the verb rendered “press out oil” is related to the word for oil.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  chosen: Between
  alternatives:
  - Among
  lexicon: HALOT
  rationale: This retains the ordinary spatial sense of the Hebrew preposition.
- source_word: שׁוּרוֹתָם
  chosen: their walls
  alternatives:
  - their walls
  - their rows
  lexicon: HALOT
  rationale: The noun can denote walls; “rows” and “terraces” add an unmarked agricultural interpretation.
- source_word: יַצְהִירוּ
  chosen: they press out oil
  alternatives:
  - they make oil shine
  - they produce oil
  lexicon: HALOT
  rationale: Hiphil of צהר here is commonly understood in context as producing or pressing oil, not merely 'shining.' The surrounding imagery is agricultural exploitation, so 'press out oil' makes the action explicit and idiomatic.
- source_word: יְקָבִים
  chosen: winepresses
  alternatives:
  - vats
  lexicon: HALOT
  rationale: Standard term for winepresses or wine vats. 'Winepresses' is the clearer and more specific English choice.
- source_word: דָּרְכוּ
  chosen: they tread
  alternatives:
  - they trample
  lexicon: HALOT
  rationale: Common verb for treading grapes in a winepress. 'Tread' is the established and precise rendering.
- source_word: וַיִּצְמָאוּ
  chosen: yet they go thirsty
  alternatives:
  - and they thirst
  - but they are thirsty
  lexicon: HALOT
  rationale: The waw-consecutive advances the scene to its bitter result. 'Yet they go thirsty' captures the irony that those producing oil and wine are themselves deprived.
