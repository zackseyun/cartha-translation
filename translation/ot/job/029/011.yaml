  category: ambiguity
  tier: 1
  from: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
  to: For when an ear heard, it called me blessed, and when an eye saw, it testified about me[a].
  rationale: The marker should be moved from “heard” to the final verb. More importantly, “testified for me” makes the testimony sound like advocacy; the verb more directly says that those who saw Job testified about him. The preceding parallel makes the testimony favorable without requiring that nuance to be built into the preposition.
