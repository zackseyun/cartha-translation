  category: lexical
  tier: 1
  from: Among the bushes they bray[b][a]; under the nettles they huddle together.
  to: Among the bushes they bray; under thorny plants[a] they are gathered together[b].
  rationale: חָרוּל is an uncertain noxious or thorny plant term, so “thorny plants” preserves the general image without asserting that the growth consists specifically of thornbushes, nettles, or brambles. The passive יְסֻפָּחוּ is better represented by “are gathered together”; “cluster together” suppresses the passive morphology and can suggest a voluntary action. The verse's degraded animal imagery remains intact in “bray.”
