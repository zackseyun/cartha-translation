id: JOB.30.7
reference: Job 30:7
source:
  edition: WLC
  text: בֵּין שִׂיחִ֥ים יִנְהָ֑קוּ תַּ֖חַת חָר֣וּל יְסֻפָּֽחוּ־׃
translation:
  text: Among the bushes they bray; under thorny plants[a] they are gathered together[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The precise plant is uncertain; suggested renderings include “nettles,” “brambles,” and “thornbushes.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb may also suggest being joined or crowded together.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  chosen: among
  alternatives:
  - between
  lexicon: HALOT
  rationale: The preposition can mean 'between' or more broadly 'among/in the midst of.' With a plural noun ('bushes'), idiomatic English prefers 'among.'
- source_word: שִׂיחִים
  chosen: bushes
  alternatives:
  - shrubs
  - thickets
  lexicon: HALOT
  rationale: The noun denotes low scrub or bushes. 'Bushes' is clear modern English and fits the wilderness setting without over-specifying density implied by 'thickets.'
- source_word: יִנְהָקוּ
  chosen: they bray
  alternatives:
  - they groan
  - they cry out
  lexicon: HALOT
  rationale: From נהק, commonly used of the braying of donkeys. In this context Job depicts degraded outcasts with animal-like behavior, so 'bray' preserves the harsh, dehumanizing imagery better than the more generic 'groan' or 'cry out.'
- source_word: תַּחַת
  chosen: under
  alternatives:
  - beneath
  lexicon: HALOT
  rationale: A straightforward spatial preposition; 'under' is the most natural English equivalent.
- source_word: חָרוּל
  chosen: thorny plants
  alternatives:
  - thornbush
  - bramble
  lexicon: HALOT
  rationale: This generic expression reflects the plant's noxious or prickly character while preserving uncertainty about its botanical identity and growth form.
- source_word: יְסֻפָּחוּ
  chosen: they are gathered together
  alternatives:
  - they are gathered together
  - they are joined together
  - they cower together
  lexicon: HALOT
  rationale: The passive rendering follows the Hebrew form and avoids adding emotional posture or voluntary clustering.
