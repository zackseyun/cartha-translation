id: NUM.28.23
reference: Numbers 28:23
source:
  edition: WLC
  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
translation:
  text: In addition to the regular morning burnt offering, you shall offer these.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: מִלְּבַד
  chosen: In addition to
  alternatives:
  - Besides
  - Apart from
  lexicon: HALOT
  rationale: The phrase marks these festival sacrifices as additional to the standing offering. 'In addition to' is the clearest modern English equivalent.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  chosen: the regular morning burnt offering
  alternatives:
  - the morning burnt offering belonging to the continual offering
  - the regular daily morning offering
  lexicon: HALOT
  rationale: The relative phrase identifies the morning burnt offering with the regular offering; it does not describe one offering made 'for' another.
- source_word: תַּעֲשׂוּ
  chosen: you shall offer
  alternatives:
  - you shall make
  - you shall do
  lexicon: HALOT
  rationale: In sacrificial instructions, 'offer' is the natural contextual equivalent of the verb 'make/do.'
- source_word: אֶת אֵלֶּה
  chosen: these
  alternatives:
  - these things
  lexicon: HALOT
  rationale: The object marker and demonstrative refer to the offerings just prescribed; English needs only 'these.'
