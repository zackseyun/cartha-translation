id: PRO.25.6
reference: Proverbs 25:6
source:
  edition: WLC
  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
translation:
  text: Do not promote yourself before a king, and do not stand in the place of the great.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among important people.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַדַּר
  chosen: promote yourself
  alternatives:
  - honor yourself
  - display your splendor
  - put yourself forward
  lexicon: HALOT
  rationale: The reflexive courtly idiom warns against putting oneself forward.
- source_word: לִפְנֵי מֶלֶךְ
  chosen: before a king
  alternatives:
  - in the presence of a king
  lexicon: HALOT
  rationale: לִפְנֵי commonly means 'before' or 'in the presence of.' 'Before a king' is concise, idiomatic, and preserves the courtly setting.
- source_word: בִּמְקוֹם גְּדֹלִים
  chosen: in the place of the great
  alternatives:
  - in the place of the great
  - where great men stand
  - in the place of nobles
  lexicon: HALOT
  rationale: The substantive adjective denotes socially prominent persons without requiring “men.”
- source_word: תַּעֲמֹד
  chosen: stand
  alternatives:
  - take your stand
  - station yourself
  lexicon: HALOT
  rationale: The verb עמד is straightforwardly 'stand.' In context it refers to taking a position or place among the prominent, so the simple gloss is retained for readability and formal fidelity.
