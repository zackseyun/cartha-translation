  from: Do not exalt yourself before a king[a], and do not stand in the place of great men.
  to: Do not promote yourself before a king, and do not stand in the place of the great.[a]
  rationale: In this courtly context, the reflexive verb concerns self-advancement or self-display; "promote yourself" conveys this more idiomatically than "exalt yourself." "The great" naturally renders the substantival plural for socially eminent people without adding a male-specific referent not required by the expression.
