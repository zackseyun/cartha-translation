id: PRO.2.19
reference: Proverbs 2:19
source:
  edition: WLC
  text: כָּל בָּ֭אֶי/הָ לֹ֣א יְשׁוּב֑וּ/ן וְ/לֹֽא יַ֝שִּׂ֗יגוּ אָרְח֥וֹת חַיִּֽים־־׃
translation:
  text: None who go in to her return, nor do they reach the paths of life.
