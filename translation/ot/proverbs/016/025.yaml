  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
translation:
  text: There is a way that seems right to a man, but its end leads to death.
  footnotes: []
