id: PRO.20.15
reference: Proverbs 20:15
source:
  edition: WLC
  text: יֵ֣שׁ זָ֭הָב וְ/רָב פְּנִינִ֑ים וּ/כְלִ֥י יְ֝קָ֗ר שִׂפְתֵי דָֽעַת־־׃
translation:
  text: There is gold and an abundance of precious stones, but knowledgeable lips are a precious vessel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “precious stones” has an uncertain referent; proposed meanings include corals, rubies, and pearls.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  chosen: There is
  alternatives:
  - There are
  - One may find
  lexicon: HALOT
  rationale: Existential particle introducing the proverb's observation. Singular English 'There is' works idiomatically even with the following compound items.
- source_word: זָהָב
  chosen: gold
  lexicon: HALOT
  rationale: Straightforward material term; no reason to expand or paraphrase.
- source_word: וְרָב
  chosen: and an abundance of
  alternatives:
  - and many
  - and much
  lexicon: HALOT
  rationale: רָב here functions substantivally/adjectivally with the following noun to indicate great quantity. 'An abundance of' captures the sense more naturally than the wooden 'many' with a luxury item.
- source_word: פְּנִינִים
  chosen: precious stones
  alternatives:
  - corals
  - rubies
  - jewels
  lexicon: HALOT
  rationale: Avoids false species precision while representing a valuable gem-like material.
- source_word: וּכְלִי יְקָר
  chosen: a precious vessel
  alternatives:
  - a costly jewel
  - a precious article
  - a valuable thing
  lexicon: HALOT
  rationale: 'כְלִי is broadly ''vessel, article, object, implement.'' In this proverb it is metaphorical/appositional: lips characterized by knowledge are compared to a valuable object. ''Precious vessel'' preserves the concrete imagery better than flattening to ''valuable thing.'''
- source_word: שִׂפְתֵי דָעַת
  chosen: knowledgeable lips
  alternatives:
  - knowledgeable lips
  - lips that know
  lexicon: HALOT
  rationale: Naturally conveys lips characterized by knowledge while retaining the source image.
