  from: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
  to: A son who abuses his father and drives away his mother brings shame and disgrace.[a]
  rationale: “Devastates his father” is unnatural and can misleadingly suggest that the father, rather than his resources or household, is physically devastated. “Abuses” naturally conveys the severe destructive mistreatment denoted by the participle in this relational context, without restricting it to financial plundering. The recast English syntax accurately represents the predicative “son” and the two shame-causing participles.
