id: PRO.19.26
reference: Proverbs 19:26
source:
  edition: WLC
  text: מְֽשַׁדֶּד אָ֭ב יַבְרִ֣יחַ אֵ֑ם בֵּ֝֗ן מֵבִ֥ישׁ וּ/מַחְפִּֽיר־׃
translation:
  text: A son who abuses his father and drives away his mother brings shame and disgrace.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A son who plunders his father and chases away his mother causes shame and disgrace.” The first verb denotes severe or violent mistreatment and can include plundering.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁדֶּד
  chosen: abuses
  alternatives:
  - plunders
  - despoils
  - ruins
  lexicon: HALOT
  rationale: This is natural English for severe destructive mistreatment of a parent while preserving the breadth of the Hebrew.
- source_word: אָב
  chosen: his father
  alternatives:
  - father
  lexicon: HALOT
  rationale: Simple rendering of the noun with possessive sense supplied naturally in English from the relational context of the proverb.
- source_word: יַבְרִיחַ
  chosen: drives away
  alternatives:
  - chases away
  - puts to flight
  - banishes
  lexicon: HALOT
  rationale: The Hiphil of ברח here conveys causing the mother to flee or be sent away. 'Drives away' is natural modern English and preserves the causative force.
- source_word: אֵם
  chosen: his mother
  alternatives:
  - mother
  lexicon: HALOT
  rationale: Straightforward rendering, with possessive sense made explicit in English parallel to 'his father.'
- source_word: בֵּן
  chosen: a son
  alternatives:
  - the son
  - such a son
  lexicon: HALOT
  rationale: The noun functions predicatively/appositionally, characterizing the person described. 'A son' preserves the proverbial, classifying force.
- source_word: מֵבִישׁ
  chosen: who brings shame
  alternatives:
  - shameful
  - causing shame
  - who shames
  lexicon: HALOT
  rationale: The participle from בוש in Hiphil means causing shame. 'Who brings shame' is idiomatic and preserves the active causative sense.
- source_word: וּמַחְפִּיר
  chosen: and disgrace
  alternatives:
  - and reproach
  - and dishonor
  - and humiliation
  lexicon: HALOT
  rationale: From חפר in a causative/shaming sense, parallel to מֵבִישׁ. Rendering the pair as 'shame and disgrace' preserves the intensifying parallelism in concise English. Although the Hebrew form is participial, English idiom often compresses the second term into a coordinated noun after 'brings.'
- source_word: בֵּן מֵבִישׁ וּמַחְפִּיר
  chosen: A son ... brings shame and disgrace
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The English construction naturally conveys the son's shame-causing character and retains the paired results.
