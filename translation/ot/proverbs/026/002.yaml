id: PRO.26.2
reference: Proverbs 26:2
source:
  edition: WLC
  text: כַּ/צִּפּ֣וֹר לָ֭/נוּד כַּ/דְּר֣וֹר לָ/ע֑וּף כֵּ֥ן קִֽלְלַ֥ת חִ֝נָּ֗ם לא תָבֹֽא׃
translation:
  text: Like a bird in its wandering, like a swallow in its flight, so an undeserved curse does not come.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The written Hebrew text reads “does not come”; the traditional reading is “does not come to him.”
    reason: textual_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  chosen: Like a bird
  alternatives:
  - Like a bird
  lexicon: HALOT
  rationale: The noun commonly denotes a bird generally; “sparrow” is overly specific here.
- source_word: לָנוּד
  chosen: in its wandering
  alternatives:
  - to wander
  - flitting about
  - restlessly wandering
  lexicon: HALOT
  rationale: This preserves the infinitival motion image without adding a particular manner beyond the Hebrew.
- source_word: כַּדְּרוֹר
  chosen: like a swallow
  alternatives:
  - like a swift
  lexicon: HALOT
  rationale: דְּרוֹר is traditionally rendered 'swallow,' though some identify it as 'swift.' 'Swallow' remains the most recognizable English equivalent and suits the proverb's imagery; the zoological alternative is preserved in a footnote.
- source_word: לָעוּף
  chosen: in its flight
  alternatives:
  - to fly
  - in flight
  lexicon: HALOT
  rationale: This naturally renders the infinitive without importing “away.”
- source_word: כֵּן
  chosen: so
  alternatives:
  - thus
  - in the same way
  lexicon: HALOT
  rationale: כֵּן introduces the comparison's conclusion. 'So' is concise, natural, and preserves the proverbial structure.
- source_word: קִלְלַת
  chosen: curse
  alternatives:
  - a curse
  lexicon: HALOT
  rationale: 'Construct form with חִנָּם: ''curse of/for nothing,'' idiomatically ''undeserved curse.'' English requires an article in context, but the core lexical value is ''curse.'''
- source_word: חִנָּם
  chosen: undeserved
  alternatives:
  - without cause
  - for nothing
  - groundless
  lexicon: HALOT
  rationale: חִנָּם commonly means 'without cause' or 'gratuitously.' 'Undeserved' communicates the moral sense in clear modern English and fits the proverb's point that a baseless curse finds no landing place.
- source_word: לֹא תָבֹא
  chosen: does not come
  alternatives:
  - does not come
  - will not come
  - does not alight
  lexicon: HALOT
  rationale: This follows the written Hebrew text and does not make the inferred landing image part of the translation.
