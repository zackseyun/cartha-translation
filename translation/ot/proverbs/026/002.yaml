  from: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
  to: Like a bird in its wandering, like a swallow in its flight, so an undeserved curse does not come.[a]
  rationale: צִפּוֹר is a generic bird term, so “bird” avoids unjustified species-level precision. The infinitival phrases are well represented by “in its wandering” and “in its flight”; “flying away” adds a direction not in the Hebrew. The written text has “does not come,” not “come to rest,” which makes the landing/taking-effect inference unmarked. The textual note is warranted, but it must accurately distinguish the written reading from the traditional/Qere reading.
