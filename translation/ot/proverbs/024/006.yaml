id: PRO.24.6
reference: Proverbs 24:6
source:
  edition: WLC
  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
translation:
  text: For with wise guidance[a] you will wage your war, and victory[b] comes through many counselors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with strategy” or “with wise counsel”; the Hebrew term refers to skillful guidance or tactical planning.
    reason: lexical_alternative
  - marker: b
    text: Or “deliverance”; in this battle context, the Hebrew points more specifically to victory.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - because
  lexicon: HALOT
  rationale: Introduces the ground or explanation for the preceding admonition. 'For' fits the proverbial logic naturally in English.
- source_word: בְתַחְבֻּלוֹת
  chosen: with wise guidance
  alternatives:
  - with strategy
  - with sound guidance
  - with wise counsel
  lexicon: HALOT
  rationale: Retains the instrumental sense and the strategic-guidance connotation.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  chosen: you will wage your war
  alternatives:
  - you will make war for yourself
  - you will conduct war
  - you will carry on war
  lexicon: HALOT
  rationale: Idiomatic English for “make/wage war,” with the dative naturally represented by “your.”
- source_word: וּתְשׁוּעָה
  chosen: and victory
  alternatives:
  - and deliverance
  - and salvation
  lexicon: HALOT
  rationale: In this military-proverbial context, תְּשׁוּעָה refers to successful outcome in battle. 'Victory' is the most contextually precise English rendering, while 'deliverance' and 'salvation' are broader possibilities.
- source_word: בְּרֹב
  chosen: is in an abundance of
  alternatives:
  - comes through many
  - is with many
  - is in the multitude of
  lexicon: HALOT
  rationale: The phrase marks the sphere or means by which victory is found. 'In an abundance of' is natural English and preserves the sense of multiplicity.
- source_word: יוֹעֵץ
  chosen: counselors
  alternatives:
  - advisers
  - one who gives counsel
  lexicon: HALOT
  rationale: 'Although morphologically singular in form, the phrase רֹב יוֹעֵץ is a collective expression best rendered in English as plural: ''counselors.'' This matches the proverb''s emphasis on numerous advisers.'
- source_word: בְּרֹב יוֹעֵץ
  chosen: comes through many counselors
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for victory achieved by means of a multitude of advisers.
