  review_summary: '“Lift up disgrace” is possible word-for-word English but reads like an incomplete or misleading English idiom. “Raise disgrace high” makes the causative elevation image of מֵרִים intelligible without replacing it with an inferred effect such as merely bearing or receiving disgrace. The antithesis remains pointed: the wise receive honor, while fools elevate disgrace.'
