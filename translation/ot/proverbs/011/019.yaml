  from: So righteousness leads to life[a], but he who pursues evil, to his own death.
  to: So righteousness leads to life[a], but whoever pursues evil heads toward his own death.
  rationale: כן is best retained here as the adverbial “So/Thus,” not recast as the unmarked modifier “true” of righteousness. The current second colon is grammatically incomplete in English; “heads toward” supplies its corresponding resultative relation naturally.
