  from: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
  to: When the wicked rise, people hide themselves[a], but when they perish, the righteous increase.
  rationale: אָדָם is a generic human term here, and plural “people” is natural English in this social contrast; it does not imply a specifically male individual. “Hide themselves” is a sound contextual middle/reflexive rendering of the Niphal, while the passive remains a genuine alternative worth noting.
