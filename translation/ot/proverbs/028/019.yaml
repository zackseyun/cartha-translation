  from: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
  to: Whoever works his land will have plenty of bread, but whoever pursues empty pursuits[a] will have his fill of poverty.
  rationale: “Empty pursuits” fits the contrast with productive work, preserves the empty/full verbal irony, and does not overstate the referent as merely “worthless.” The substantival plural can also be understood as empty people or idlers; the note candidly retains that possible reading.
