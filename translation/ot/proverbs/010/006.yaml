id: PRO.10.6
reference: Proverbs 10:6
source:
  edition: WLC
  text: בְּ֭רָכוֹת לְ/רֹ֣אשׁ צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
translation:
  text: Blessings are on the head of the righteous, but the mouth of the wicked conceals violence.[a]
  footnotes:
  - marker: a
    text: Or “but violence covers the mouth of the wicked.” The Hebrew syntax permits either “violence” or “the mouth of the wicked” to be understood as the subject.
    reason: ambiguity
