  from: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
  to: Blessings are on the head of the righteous, but the mouth of the wicked conceals violence.[a]
  rationale: The earlier adjudication treated the postverbal חָמָס as certainly the subject, but the Hebrew also permits “the mouth of the wicked” to be the singular subject and “violence” the object. That analysis is strongly supported by the parallel wording in verse 11, where the mouth remains the topic in contrast with the righteous person’s mouth. “Conceals violence” is also more natural English than “covers violence.” Because the syntax remains genuinely ambiguous, the inverse construal belongs in a note rather than being excluded.
