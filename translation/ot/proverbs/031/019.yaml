id: PRO.31.19
reference: Proverbs 31:19
source:
  edition: WLC
  text: יָ֭דֶי/הָ שִׁלְּחָ֣ה בַ/כִּישׁ֑וֹר וְ֝/כַפֶּ֗י/הָ תָּ֣מְכוּ פָֽלֶךְ׃
translation:
  text: She puts her hands to the distaff, and her palms hold the spindle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The precise identification of these spinning implements is uncertain; the first is commonly understood as a distaff and the second as a spindle.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיהָ
  chosen: her hands
  alternatives:
  - her hand
  lexicon: HALOT
  rationale: Dual form with 3fs suffix, naturally rendered as the pair of hands belonging to the woman described in the poem.
- source_word: שִׁלְּחָה
  chosen: puts her hands to
  alternatives:
  - sends out
  - puts forth
  - extends
  lexicon: HALOT
  rationale: This is natural English for applying her hands purposefully to the work while avoiding false precision about the exact physical motion.
- source_word: בַכִּישׁוֹר
  chosen: to the distaff
  alternatives:
  - to the spindle
  - with the distaff
  lexicon: HALOT
  rationale: “Distaff” is a common contextual identification, but the precise spinning implement remains uncertain and is qualified in the note.
- source_word: וְכַפֶּיהָ
  chosen: and her palms
  alternatives:
  - and her hands
  lexicon: HALOT
  rationale: כַּף literally denotes the palm or hollow of the hand. 'Palms' preserves the more specific bodily image and the poetic parallelism with 'hands' in the first colon.
- source_word: תָּמְכוּ
  chosen: hold
  alternatives:
  - grasp
  - support
  - take hold of
  lexicon: HALOT
  rationale: The verb can denote supporting, holding, or grasping; “hold” is the least over-specific natural rendering here.
- source_word: פָלֶךְ
  chosen: the spindle
  alternatives:
  - the whorl
  - the spinning spindle
  lexicon: HALOT
  rationale: פָלֶךְ denotes a spinning tool, commonly the spindle. Rendering it as 'spindle' preserves the domestic craft imagery and complements 'distaff' in the first colon.
