id: PRO.4.23
reference: Proverbs 4:23
source:
  edition: WLC
  text: מִֽ/כָּל מִ֭שְׁמָר נְצֹ֣ר לִבֶּ֑/ךָ כִּֽי מִ֝מֶּ֗/נּוּ תּוֹצְא֥וֹת חַיִּֽים־־׃
translation:
  text: Guard your heart with the greatest care[a], for from it flow the springs of life[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says 'above all guarding, guard your heart,' an idiom emphasizing the greatest care and vigilance.
    reason: lexical_alternative
  - marker: b
    text: Or 'for from it are the sources/outgoings of life.' The wording pictures the heart as the fountainhead from which life flows.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל
  lemma: מִשְׁמָר
  chosen: with the greatest
  alternatives:
  - more than all
  - from all
  lexicon: HALOT
  rationale: 'With the following noun מִשְׁמָר, the preposition מן has a comparative/superlative force: ''more than every kind of guarding'' or ''above all else that is guarded.'' ''With the greatest care'' expresses this superlative naturally in English.'
- source_word: מִשְׁמָר
  chosen: care
  alternatives:
  - guard
  - keeping
  - watch
  lexicon: HALOT
  rationale: The noun denotes guarding, keeping, or watchfulness. In this idiom, 'care' communicates vigilant attention in natural English, while the imperative 'Guard' retains the source's central image.
- source_word: נְצֹר
  chosen: Guard
  alternatives:
  - keep
  - watch over
  lexicon: HALOT
  rationale: The imperative calls for active protection or careful keeping. 'Guard' matches the semantic field of מִשְׁמָר and yields a concise, forceful English imperative.
- source_word: לִבֶּךָ
  chosen: your heart
  lexicon: HALOT
  rationale: In Hebrew anthropology, 'heart' is the center of thought, will, and affections, not merely emotion. The literal rendering should be retained rather than interpreted away.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the reason for the imperative. 'For' is idiomatic and preserves the explanatory connection.
- source_word: מִמֶּנּוּ
  chosen: from it
  alternatives:
  - from him
  - from the heart
  lexicon: HALOT
  rationale: The suffix refers back to 'heart' (masculine noun in Hebrew). English naturally uses 'it' for the organ/metaphorical center. 'From it' preserves the source syntax and avoids over-expansion.
- source_word: תּוֹצְאוֹת
  chosen: springs
  alternatives:
  - outgoings
  - sources
  - issues
  lexicon: HALOT
  rationale: The noun can denote goings out, outlets, or sources. In context with 'life,' 'springs' captures the image of life flowing out from the heart; adding 'flow' makes that metaphor natural and clear in modern English.
- source_word: חַיִּים
  chosen: life
  alternatives:
  - lives
  lexicon: HALOT
  rationale: Though morphologically plural, חַיִּים commonly functions as an abstract singular meaning 'life.' Singular English is the natural equivalent here.
