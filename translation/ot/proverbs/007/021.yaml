  from: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
  to: She sways him with much persuasive speech; with the smoothness of her lips she drives him on.
  rationale: 'The proposed first colon is a clear improvement: “abundant persuasion” is unnatural and repetitively gloss-like. But “leads him astray” interprets the result and replaces the forceful motion image of Hiphil נדח with a familiar moral idiom. “Drives him on” retains that image without the coercive overstatement of “compels him.” “Smoothness of her lips” is slightly more faithful to the construct expression than treating “smooth” simply as an adjective of lips.'
