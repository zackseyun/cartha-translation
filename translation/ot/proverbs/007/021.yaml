id: PRO.7.21
reference: Proverbs 7:21
source:
  edition: WLC
  text: הִ֭טַּתּ/וּ בְּ/רֹ֣ב לִקְחָ֑/הּ בְּ/חֵ֥לֶק שְׂ֝פָתֶ֗י/הָ תַּדִּיחֶֽ/נּוּ׃
translation:
  text: She sways him with much persuasive speech; with the smoothness of her lips she drives him on.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: הִטַּתּוּ
  chosen: she sways him
  alternatives:
  - she turns him aside
  - she seduces him
  - she inclines him
  lexicon: HALOT
  rationale: Natural contextual expression of causing him to turn or incline.
- source_word: בְּרֹב
  chosen: with her abundant
  alternatives:
  - with much
  - by the abundance of
  lexicon: HALOT
  rationale: רֹב denotes abundance or multitude. Rendered with 'abundant' in close connection to the following noun to preserve the instrumental sense introduced by בְּ while keeping the English natural.
- source_word: לִקְחָהּ
  chosen: persuasion
  alternatives:
  - enticing speech
  - instruction
  - argument
  lexicon: HALOT
  rationale: לקח can mean learning, instruction, or persuasive discourse depending on context. In Proverbs 7, the woman is using speech to entice, so 'persuasion' best fits the immediate context. 'Instruction' would sound too positive or didactic in English; 'enticing speech' is interpretive and more expansive than the noun itself.
- source_word: בְּחֵלֶק
  chosen: with the smoothness of
  alternatives:
  - with smooth
  - with flattery of
  - with slipperiness of
  lexicon: HALOT
  rationale: חלק in this idiom refers to smoothness, especially smooth or flattering speech. 'With the smoothness of' preserves the metaphor and avoids collapsing it immediately into the interpretive gloss 'flattery,' though that sense is present.
- source_word: שְׂפָתֶיהָ
  chosen: her lips
  alternatives:
  - her speech
  lexicon: HALOT
  rationale: Literally 'her lips.' Retained to preserve the Hebrew imagery and poetic concreteness. 'Her speech' would be a smoother dynamic rendering but loses the embodied metaphor.
- source_word: תַּדִּיחֶנּוּ
  chosen: she drives him on
  alternatives:
  - she drives him along
  - she leads him astray
  - she impels him
  lexicon: HALOT
  rationale: Retains the verbal image of forceful urging/driving without asserting literal compulsion or substituting the interpretive idiom “leads astray.”
- source_word: בְּרֹב לִקְחָהּ
  chosen: with much persuasive speech
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Avoids the unnatural and redundant “abundant persuasion” while representing the abundance and speech/persuasion sense in context.
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  chosen: with the smoothness of her lips
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the Hebrew's concrete lips image and its smoothness metaphor.
