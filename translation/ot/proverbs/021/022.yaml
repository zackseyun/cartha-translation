  from: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
  to: A wise man goes up against a city of mighty men and brings down the strength in which it trusts.[a]
  rationale: The city is indefinite, and עֹז is “strength” or “might,” not necessarily a concrete “stronghold.” The feminine suffix on מִבְטֶחָה refers to the city. “They trusted in” makes the city’s defenders the explicit referent, whereas “it trusts” preserves the Hebrew referent and its personification while remaining natural English.
