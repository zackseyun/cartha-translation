id: PRO.21.22
reference: Proverbs 21:22
source:
  edition: WLC
  text: עִ֣יר גִּ֭בֹּרִים עָלָ֣ה חָכָ֑ם וַ֝/יֹּ֗רֶד עֹ֣ז מִבְטֶחָֽ/ה׃
translation:
  text: A wise man goes up against a city of mighty men and brings down the strength in which it trusts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “brings down the strength of its confidence”; that is, the strength in which the city trusts.
    reason: literal_form
lexical_decisions:
- source_word: עִיר
  chosen: city
  alternatives:
  - town
  lexicon: HALOT
  rationale: The basic sense is an urban settlement or fortified city. 'City' is the standard and most natural rendering here, especially in a military/proverbial context.
- source_word: גִּבֹּרִים
  chosen: mighty men
  alternatives:
  - warriors
  - strong men
  - heroes
  lexicon: HALOT
  rationale: The noun often denotes strong or valiant men, frequently with martial overtones. 'Mighty men' preserves the Hebrew imagery and masculine form better than the more interpretive 'warriors,' while still fitting the context of a defended city.
- source_word: עָלָה
  chosen: goes up against
  alternatives:
  - ascends
  - goes up
  - attacks
  lexicon: HALOT
  rationale: Literally 'goes up,' but in military contexts the verb commonly carries the sense of advancing against or attacking a city. 'Goes up against' preserves the Hebrew idiom while making the adversarial force clear in English.
- source_word: חָכָם
  chosen: a wise man
  alternatives:
  - the wise man
  - a wise one
  lexicon: HALOT
  rationale: The singular adjective/noun functions substantivally. 'A wise man' fits proverbial style and follows the gender-accurate policy, since the Hebrew is grammatically masculine and representative.
- source_word: וַיֹּרֶד
  chosen: and brings down
  alternatives:
  - and pulls down
  - and casts down
  - and lowers
  lexicon: HALOT
  rationale: From ירד, literally 'causes to go down' or 'brings down' in context. 'Brings down' is idiomatic modern English and suits the image of overcoming defenses.
- source_word: עֹז
  chosen: the strength
  alternatives:
  - strength
  - might
  lexicon: HALOT
  rationale: The noun means strength or might; “stronghold” supplies an unsupported concrete object.
- source_word: מִבְטֶחָה
  chosen: in which it trusts
  alternatives:
  - their confidence
  - their security
  - their trust
  lexicon: HALOT
  rationale: The feminine suffix refers to the city, whose confidence or security is personified.
- source_word: עִיר גִּבֹּרִים
  chosen: a city of mighty men
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The phrase is indefinite and identifies the city by its mighty defenders.
