id: PRO.17.19
reference: Proverbs 17:19
source:
  edition: WLC
  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
translation:
  text: Whoever loves transgression loves strife; whoever raises his doorway seeks ruin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “raises his opening” or “raises his entrance”; the precise implication of the image is uncertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  chosen: loves
  alternatives:
  - is fond of
  - delights in
  lexicon: HALOT
  rationale: Qal participle of אָהַב denotes loving or taking pleasure in. 'Loves' preserves the proverb's moral force and parallelism in both cola.
- source_word: פֶּשַׁע
  chosen: transgression
  alternatives:
  - rebellion
  - offense
  lexicon: HALOT
  rationale: פֶּשַׁע commonly denotes willful violation or rebellion, stronger than a mere mistake. 'Transgression' fits wisdom literature and preserves the ethical seriousness.
- source_word: מַצָּה
  chosen: strife
  alternatives:
  - quarreling
  - contention
  lexicon: HALOT
  rationale: In context this noun refers to conflict or contention. 'Strife' is concise, idiomatic, and preserves the proverb's general scope better than the more event-specific 'quarreling.'
- source_word: מַגְבִּיהַּ
  chosen: raises
  alternatives:
  - raises
  - exalts
  lexicon: HALOT
  rationale: The Hiphil participle means to raise or make high; “raises” is direct English.
- source_word: פִּתְחוֹ
  chosen: his doorway
  alternatives:
  - his door
  - his gate
  - his entrance
  lexicon: HALOT
  rationale: The noun denotes an opening or entrance, not specifically a door panel.
- source_word: מְבַקֶּשׁ
  chosen: seeks
  alternatives:
  - looks for
  - invites
  lexicon: HALOT
  rationale: The participle of בקש normally means seek. In proverbial usage it can imply courting a result; 'seeks' preserves the Hebrew wording while allowing the implied irony.
- source_word: שָׁבֶר
  chosen: ruin
  alternatives:
  - ruin
  - collapse
  - breaking
  lexicon: HALOT
  rationale: “Ruin” retains the word's sense of breaking, collapse, or calamity without over-specifying the outcome.
