id: PRO.17.9
reference: Proverbs 17:9
source:
  edition: WLC
  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
translation:
  text: Whoever covers an offense[a] seeks love, but whoever repeats a matter[b] separates a close friend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “covers a transgression.” The Hebrew preserves the image of covering rather than explicitly saying “forgives.”
    reason: lexical_alternative
  - marker: b
    text: That is, brings the matter up again rather than letting it rest.
    reason: idiom
lexical_decisions:
- source_word: מְכַסֶּה
  chosen: covers
  alternatives:
  - covers
  - conceals
  - forgives
  lexicon: HALOT
  rationale: The direct verb is natural English and maintains the source image.
- source_word: פֶּשַׁע
  chosen: an offense
  alternatives:
  - transgression
  - rebellion
  - wrongdoing
  lexicon: HALOT
  rationale: פשע often denotes transgression or rebellion, but in wisdom context here it refers to an interpersonal wrong. 'An offense' fits the relational setting and idiomatic English better than the more formal 'transgression.'
- source_word: מְבַקֵּשׁ
  chosen: seeks
  alternatives:
  - pursues
  - desires
  lexicon: HALOT
  rationale: The participle straightforwardly means 'seeking.' 'Seeks' is concise and preserves the proverb's moral logic.
- source_word: אַהֲבָה
  chosen: love
  alternatives:
  - affection
  - friendship
  lexicon: HALOT
  rationale: The noun broadly denotes love. 'Love' is the most direct equivalent and preserves the lexical connection without narrowing it prematurely to friendship, though the context is relational.
- source_word: שֹׁנֶה
  chosen: repeats
  alternatives:
  - brings up again
  - does again
  - retells
  lexicon: HALOT
  rationale: From שנה 'to repeat/do again.' In context with 'a matter,' the sense is revisiting or bringing up an issue again. 'Repeats' is compact and faithful; the more interpretive 'keeps bringing up' is possible but slightly expands the text.
- source_word: בְדָבָר
  chosen: a matter
  alternatives:
  - a word
  - an issue
  - the matter
  lexicon: HALOT
  rationale: דבר has a broad semantic range including word, matter, affair. Here it likely means a matter/issue previously discussed. 'A matter' is idiomatic and sufficiently broad.
- source_word: מַפְרִיד
  chosen: separates
  alternatives:
  - divides
  - alienates
  lexicon: HALOT
  rationale: The Hiphil participle means 'causing separation.' 'Separates' is the most direct rendering.
- source_word: אַלּוּף
  chosen: a close friend
  alternatives:
  - an intimate friend
  - a companion
  - a close companion
  lexicon: HALOT
  rationale: The Hebrew noun is singular and denotes an intimate friend or close companion.
