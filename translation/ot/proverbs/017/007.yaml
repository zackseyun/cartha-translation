id: PRO.17.7
reference: Proverbs 17:7
source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
translation:
  text: Lofty speech does not suit a fool[a]; much less do lying lips suit a nobleman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “grand speech” or “excessive speech.” The Hebrew expression can describe elevated or overblown speech.
    reason: lexical_alternative
  - marker: b
    text: Or “a prince” or “a generous man.” The Hebrew term can refer to noble rank or noble character.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  chosen: does not suit
  alternatives:
  - is not becoming
  - is not suitable
  - is not seemly
  lexicon: HALOT
  rationale: A natural rendering of what is becoming or fitting.
- source_word: נָבָל
  chosen: a fool
  alternatives:
  - a senseless man
  - a vile person
  lexicon: HALOT
  rationale: In wisdom literature נָבָל commonly denotes a morally and intellectually deficient person, not merely someone lacking intelligence. 'Fool' is the standard concise rendering in Proverbs and fits the genre.
- source_word: שְׂפַת יֶתֶר
  chosen: lofty speech
  alternatives:
  - lofty speech
  - abundant speech
  - grand speech
  lexicon: HALOT
  rationale: It conveys elevated speech without treating it as unambiguously excellent.
- source_word: אַף כִּי
  chosen: much less
  alternatives:
  - much less
  - still less
  lexicon: HALOT
  rationale: It marks the intensified second comparison.
- source_word: נָדִיב
  chosen: a nobleman
  alternatives:
  - a prince
  - a noble
  - a generous man
  lexicon: HALOT
  rationale: It naturally represents a person of noble standing while the note preserves the character-based and princely senses.
- source_word: שְׂפַת שָׁקֶר
  chosen: lying lips
  alternatives:
  - false speech
  - a lying lip
  lexicon: HALOT
  rationale: The Hebrew literally says 'lip of falsehood.' 'Lying lips' is idiomatic English, preserves the concrete imagery, and matches wisdom-style diction.
