  from: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
  to: Lofty speech does not suit a fool[a]; much less do lying lips suit a nobleman[b].
  rationale: “Excellent” can wrongly make the speech morally commendable, whereas שְׂפַת יֶתֶר concerns speech that is elevated, grand, or excessive. “Lofty speech” preserves this range better, and the revised parallel syntax is natural English. The alternatives for both contested expressions are honestly retained.
