  review_summary: 'The final participial clause is not a vocative: אֱלֹהִים צַדִּיק is the subject, “the righteous God,” and וּבֹחֵן supplies the grounds for the petitions. The current “O righteous God who examines” alters the syntax. “Kidneys” preserves the concrete Hebrew image; a note gives the ordinary English idiomatic sense without flattening the main text.'
