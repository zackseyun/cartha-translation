  from: The counsel of Yahweh is for those who fear him, and his covenant is to make it known to them.
  to: The counsel of Yahweh is for those who fear him, and he makes his covenant known to them.
  rationale: 'The current second clause is grammatically and semantically defective: the covenant cannot naturally be said “to make it known.” Making Yahweh the subject of “makes known” properly represents the infinitive construction. Retain “counsel” rather than recasting סוד as “Yahweh confides,” since the noun denotes confidential counsel/intimacy and the verbal paraphrase adds a particular speech-act nuance.'
