  from: Sing praise to Yahweh[a], you his faithful ones[b], and give thanks to the remembrance of his holiness.
  to: Sing praise to Yahweh, you his faithful ones[a], and give thanks in remembrance of his holiness[b].
  rationale: “Give thanks to the remembrance” falsely makes remembrance the recipient. The proposed “at the remembrance” improves that relation but remains strained English. “In remembrance of” is a natural English liturgical expression that retains the Hebrew nominal remembrance language and does not supply the absent word “name.”
