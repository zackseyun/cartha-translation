  category: lexical
  tier: 1
  from: But you have exalted my horn like that of a wild ox[a][b]; I have been anointed with fresh oil.
  to: But you have raised my horn like that of a wild ox[a]; I am moistened with fresh oil.[b]
  rationale: “Raised” is a sound, natural rendering of the verb in the horn image, though “exalted” was not wrong. The unusual בַּלֹּתִי does not securely specify the act of anointing; however, “drenched” intensifies the image beyond what the uncertain verb warrants. “Moistened with fresh oil” is source-near, intelligible English, and avoids importing ceremonial anointing. The notes must be placed with the terms they address.
