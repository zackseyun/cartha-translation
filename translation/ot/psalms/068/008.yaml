  from: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
  to: The earth quaked; even the heavens poured down before God—Sinai itself—before God, the God of Israel.
  rationale: For the heavens, נטף is a precipitation image. “Dripped” is mechanically narrow and materially underplays the poetic rain idiom; “poured down” is natural without abandoning the image. “Sinai itself” conveys the emphatic appositional force of זֶה סִינַי more naturally than the awkward, potentially deictic “this Sinai.”
