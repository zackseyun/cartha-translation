  from: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[b][c]; those who see me in the street flee from me.
  to: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances; those who see me in public avoid me[b].
  rationale: “In public” appropriately retains the broad sense of בחוץ without specifying a street, and “avoid me” naturally conveys the social withdrawal expressed by נדדו ממני without insisting on literal flight. The literal-form note adequately preserves the movement image. The opening construction remains debatable and merits an alternative note.
