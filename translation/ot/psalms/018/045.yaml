id: PSA.18.45
reference: Psalms 18:45
source:
  edition: WLC
  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
translation:
  text: Foreigners fade away and come trembling out of their strongholds[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verb rendered “come trembling out” is rare and uncertain; possible senses include “come cringing out” or “limp out.”
    reason: lexical_alternative
  - marker: b
    text: “Strongholds” may also be rendered “fortresses” or, more generally, “enclosures.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  chosen: Foreigners
  alternatives:
  - sons of foreigners
  - foreigners
  lexicon: HALOT
  rationale: Although literally employing a “sons of” construction, the phrase idiomatically denotes foreign people rather than specifically offspring of foreigners.
- source_word: יִבֹּלוּ
  chosen: fade away
  alternatives:
  - wither
  - waste away
  - come trembling
  lexicon: HALOT
  rationale: From נבל in Qal, commonly 'wither, fade, droop.' 'Fade away' fits the poetic context of defeated enemies losing strength or vitality. It is preferable to importing fear into this verb, since trembling is better associated with the following verb.
- source_word: וְיַחְרְגוּ
  chosen: come trembling out
  alternatives:
  - come cringing out
  - limp out
  - come out shaking
  lexicon: HALOT
  rationale: The verb חרג is rare and contextually difficult. In this military-poetic setting, it likely conveys emerging in agitation or fear from confinement. 'Come trembling out' captures the probable sense and reads naturally in English. Because the exact nuance is uncertain, alternatives are preserved in a footnote.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  chosen: out of their strongholds
  alternatives:
  - from their fortresses
  - from their prisons
  - from their enclosures
  lexicon: HALOT
  rationale: The noun can denote places of confinement or enclosure; in this context of subdued enemies, 'strongholds' best fits the military imagery of foes forced to emerge from defended places. 'Prisons' would suggest captivity rather than defensive retreat, which is less likely here.
