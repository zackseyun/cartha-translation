id: PSA.103.7
reference: Psalms 103:7
source:
  edition: WLC
  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
translation:
  text: He made his ways known to Moses, his deeds to the people of Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the sons of Israel”; that is, the Israelites.
    reason: literal_form
lexical_decisions:
- source_word: יוֹדִיעַ
  chosen: made known
  alternatives:
  - caused to know
  - revealed
  lexicon: HALOT
  rationale: Hiphil of ידע means to cause someone to know or make known. 'Made known' is idiomatic modern English and preserves the causative sense better than the more wooden 'caused to know.'
- source_word: דְּרָכָיו
  lemma: דֶּרֶךְ
  chosen: his ways
  alternatives:
  - his path
  - his manner of acting
  lexicon: HALOT
  rationale: דֶּרֶךְ literally means 'way/road,' but in this context refers to God's ways, that is, his manner or pattern of acting. 'His ways' preserves the Hebrew metaphor and common biblical idiom.
- source_word: לְמֹשֶׁה
  chosen: to Moses
  lexicon: HALOT
  rationale: Simple dative/prepositional phrase indicating the recipient of revelation.
- source_word: לִבְנֵי יִשְׂרָאֵל
  chosen: to the people of Israel
  alternatives:
  - to the children of Israel
  - to the people of Israel
  lexicon: HALOT
  rationale: The phrase conventionally refers to Israel as a people; this rendering avoids a misleading male-only implication while retaining the literal expression in the note.
- source_word: עֲלִילוֹתָיו
  chosen: his deeds
  alternatives:
  - his acts
  - his mighty acts
  lexicon: HALOT
  rationale: The noun denotes deeds or actions, often notable acts. 'His deeds' is clear and natural; 'mighty acts' would add an evaluative nuance not explicit in the word itself, though contextually possible.
