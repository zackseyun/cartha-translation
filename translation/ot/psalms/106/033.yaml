  from: For they rebelled against his Spirit[a], and Moses spoke rashly with his lips[b].
  to: For they rebelled against his spirit[a], and he spoke rashly with his lips.
  rationale: 'The proposal correctly restores the natural contextual construal. In vv. 32–33, Moses is the salient masculine singular antecedent: the people made him angry/provoked his spirit, and he then spoke rashly. The Hebrew does not identify רוחו as God''s Spirit, and capitalization plus the supplied subject “Moses” in the current text wrongly splits the two pronouns between referents. “Rebelled against” is defensible for המרּו, though “defied” may bring out the effect on Moses more idiomatically; the proposed main wording is source-faithful and preserves the concrete “spirit” image. The existing footnote b is no longer needed because both pronouns are consistently rendered and the event remains clear from context.'
