id: PSA.106.33
reference: Psalms 106:33
source:
  edition: WLC
  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
translation:
  text: For they rebelled against his Spirit[a], and Moses spoke rashly with his lips[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first pronoun most naturally refers to God's Spirit; compare Isaiah 63:10.
    reason: cross_reference
  - marker: b
    text: The second pronoun refers to Moses at Meribah; compare Numbers 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the reason for the preceding statement. 'For' fits the explanatory flow in English while remaining close to the Hebrew conjunction.
- source_word: הִמְרוּ
  chosen: rebelled against
  alternatives:
  - rebelled against
  - provoked
  - embittered
  lexicon: HALOT
  rationale: The Hiphil is from marah, to rebel against, not from marar, to be bitter.
- source_word: אֶת רוּחוֹ
  chosen: his Spirit
  alternatives:
  - his רוח = temper
  - his mind
  - his spirit
  lexicon: HALOT
  rationale: The object most naturally refers to God's Spirit, against whom the people rebelled.
- source_word: וַיְבַטֵּא
  chosen: Moses spoke rashly
  alternatives:
  - he spoke thoughtlessly
  - he uttered
  - he spoke rashly
  lexicon: HALOT
  rationale: The subject shifts to Moses, whose rash speech at Meribah is supplied by the narrative context.
- source_word: בִּשְׂפָתָיו
  chosen: with his lips
  alternatives:
  - with his mouth
  - by his lips
  lexicon: HALOT
  rationale: A literal rendering of the Hebrew idiom. 'With his lips' is clear modern English and preserves the concrete imagery of speech.
