  from: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[b][c], and they leave their abundance to their children.
  to: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their bellies with your stored-up treasure; they are satisfied with sons[b], and they leave their abundance to their children[c].
  rationale: “Their bellies” is the natural distributive English expression for a singular body-part noun with a plural possessive suffix; “their belly” is conspicuously gloss-like. The replacement notes also correctly align the little-children note with “children” and preserve the real syntactic possibility that “sons” is the subject of “are satisfied.”
