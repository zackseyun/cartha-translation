  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: And I became a reproach to them; when they see me, they shake their heads.
  to: And I have become an object of scorn to them; when they see me, they shake their heads.
  rationale: The Hebrew idiom means that the speaker has become the target of their contempt. "Became a reproach to them" is susceptible in English to the reverse sense, as though he reproached them. "Object of scorn" makes the relation clear while preserving the source meaning and the continuing result of the perfect.
