  from: And I have become a reproach to them; when they see me[a], they shake their heads.
  to: And I became a reproach to them; when they see me, they shake their heads.
  rationale: 'Wholesale revert of azure-gpt-5.4 2026-04-23 pass: restores drafter text. Chosen renderings preserved: [''became'']. Applied via definitive_apply (fuzzy fingerprint match handling LORD/Yahweh, footnote markers, and quote normalization).'
- timestamp: '2026-08-28T22:10:04Z'
  adjudicator: wisdom-source-audit
