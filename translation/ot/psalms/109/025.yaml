id: PSA.109.25
reference: Psalms 109:25
source:
  edition: WLC
  text: וַ/אֲנִ֤י הָיִ֣יתִי חֶרְפָּ֣ה לָ/הֶ֑ם יִ֝רְא֗וּ/נִי יְנִיע֥וּ/ן רֹאשָֽׁ/ם׀׃
translation:
  text: And I have become an object of scorn to them; when they see me, they shake their heads.
