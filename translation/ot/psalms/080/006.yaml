  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
translation:
  text: You make us a source of contention for our neighbors, and our enemies laugh among themselves[a].
  footnotes:
  - marker: a
    text: The Hebrew pronoun is ambiguous. It may instead mean “mock them,” referring to God's people collectively.
    reason: alternative_reading
