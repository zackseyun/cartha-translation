  from: Do you indeed speak righteousness in silence? Do you judge uprightly[a][b], sons of man?
  to: Do you indeed speak righteousness, O silent ones?[a] Do you judge uprightly, sons of man?[b]
  rationale: The current “speak righteousness in silence” treats אֵלֶם as an adverbial phrase without a preposition and produces a near-contradiction rather than representing its nominal form. A vocative rendering is grammatically more plausible, but the sense remains uncertain; “silent ones” follows the Masoretic pointing while the note preserves the longstanding alternate vocalization “mighty ones/gods.” Separate, correctly placed notes identify the two disputed expressions.
