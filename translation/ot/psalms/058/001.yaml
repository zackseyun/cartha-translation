id: PSA.58.1
reference: Psalms 58:1
source:
  edition: WLC
  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
translation:
  text: Do you indeed speak righteousness, O silent ones?[a] Do you judge uprightly, sons of man?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew אֵלֶם is difficult. The Masoretic Text points it as a form related to silence or muteness; another vocalization yields “mighty ones” or “gods”: “Do you indeed speak righteousness, O mighty ones?”'
    reason: alternative_reading
  - marker: b
    text: Literally, “sons of man”; that is, human beings.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  chosen: Do you indeed
  alternatives:
  - Is it really
  - Do you truly
  lexicon: HALOT
  rationale: Introduces a rhetorical question with an emphatic particle. 'Indeed' preserves the interrogative force and irony of the psalmist's challenge.
- source_word: אֵלֶם
  chosen: O silent ones
  alternatives:
  - silence
  - mute ones
  - mighty ones
  lexicon: HALOT
  rationale: Represents the pointed form as nominal and vocative rather than supplying an unmarked adverbial “in silence,” while leaving the alternate vocalization in the note.
- source_word: צֶדֶק
  chosen: righteousness
  alternatives:
  - justice
  - what is right
  lexicon: HALOT
  rationale: Here the word modifies what they ought to speak. 'Righteousness' keeps the moral-judicial sense while matching the Hebrew noun closely; 'justice' is possible but less natural with 'speak' in English.
- source_word: תְּדַבֵּרוּן
  chosen: speak
  alternatives:
  - declare
  - utter
  lexicon: HALOT
  rationale: A straightforward rendering of the Piel verb דבר. 'Speak' is the most natural English equivalent in this rhetorical accusation.
- source_word: מֵישָׁרִים
  chosen: uprightly
  alternatives:
  - with equity
  - justly
  - straightforwardly
  lexicon: HALOT
  rationale: The noun/adverbial accusative conveys straightness/equity in judgment. 'Uprightly' preserves the imagery and fits idiomatic English with 'judge'.
- source_word: תִּשְׁפְּטוּ
  chosen: judge
  alternatives:
  - govern
  - render judgment
  lexicon: HALOT
  rationale: The verb is judicial in context. 'Judge' is concise and preserves the legal force.
- source_word: בְּנֵי אָדָם
  chosen: sons of man
  alternatives:
  - sons of Adam
  - children of man
  - human beings
  lexicon: HALOT
  rationale: Retains the Hebrew expression in the text, with its idiomatic reference to human beings explained in the note.
