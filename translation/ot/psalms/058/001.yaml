theological_decisions:
- issue: Interpretation of אֵלֶם in this difficult verse
  chosen_reading: Follow the Masoretic pointing as 'silence' in the main text
  alternative_readings:
  - address to 'mighty ones'
  - address to 'gods'
  rationale: The verse is textually and lexically difficult. The MT supports a reading involving silence/muteness, yielding a biting rhetorical question about whether these judges speak righteousness at all. Since alternate understandings are longstanding and materially affect interpretation, they are preserved in a footnote rather than silently excluded.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
revisions:
- timestamp: '2026-04-21T00:23:44Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/058/002.json
  category: awkward_english
  tier: 1
  from: Do you indeed speak righteousness in silence? Do you judge uprightly, sons of man?
  to: Sons of man, do you indeed speak righteousness in silence? Do you judge uprightly?
  rationale: The Hebrew vocative 'sons of man' applies to the subjects of both parallel clauses ('speak' and 'judge'). Placing it at the very end of the English sentence, attached only to the second clause, makes its scope slightly ambiguous. Moving the vocative to the beginning of the verse makes it clear that the entire rhetorical challenge is addressed to the 'sons of man' while preserving the poetic parallelism of the two questions.
