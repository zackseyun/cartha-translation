  from: Put fear in them, O Yahweh; let the nations know that they are only man. Selah
  to: Put fear in them, O Yahweh; let the nations know that they are human. Selah
  rationale: מוֹרָה is best represented here by “fear,” and “Put fear in them” is natural English for the imperative prayer. In אֱנוֹשׁ הֵמָּה, the singular collective noun identifies the nations as human/mortal beings; “only” adds an unmarked limiting nuance, while “they are only man” is unidiomatic and mismatches the plural referent. “They are human” retains the intended creaturely contrast without false precision.
