id: PSA.48.14
reference: Psalms 48:14
source:
  edition: WLC
  text: כִּ֤י זֶ֨ה אֱלֹהִ֣ים אֱ֭לֹהֵי/נוּ עוֹלָ֣ם וָ/עֶ֑ד ה֖וּא יְנַהֲגֵ֣/נוּ עַל מֽוּת׀־׃
translation:
  text: For this God is our God forever and ever; he will guide us until death.[a]
  footnotes:
  - marker: a
    text: The final Hebrew expression is uncertain. Or “beyond death”; if read differently, it may mean “forever.” Some understand it as a musical direction.
    reason: alternative_reading
