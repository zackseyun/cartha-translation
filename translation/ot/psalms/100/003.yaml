  category: awkward_english
  tier: 1
  from: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
  to: Know that Yahweh is God. He made us, and we did not make ourselves[a]; we are his people and the sheep of his pasture.
  rationale: “Yahweh, he is God” mechanically reproduces Hebrew pronoun usage and is unnecessarily unnatural in English; “Yahweh is God” retains the assertion without adding exclusivity. The ketiv’s elliptical contrast, “and not we,” is naturally expressed as “and we did not make ourselves.” The qere alternative properly belongs in a note attached to that textual decision, not to the divine name.
