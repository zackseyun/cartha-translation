id: PSA.100.3
reference: Psalms 100:3
source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
translation:
  text: Know that Yahweh is God. He made us, and we did not make ourselves[a]; we are his people and the sheep of his pasture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, following the traditional marginal reading, “He made us, and we are his.”
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  chosen: Know
  alternatives:
  - Recognize
  - Understand
  lexicon: HALOT
  rationale: Imperative plural of ידע, calling the hearers to acknowledge or know as a settled truth. 'Know' is concise and traditional while remaining natural English.
- source_word: כִּי
  chosen: that
  alternatives:
  - for
  - indeed
  lexicon: HALOT
  rationale: Introduces the content of what is to be known. 'That' best fits the declarative clause in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: הוּא אֱלֹהִים
  chosen: is God
  alternatives:
  - is God
  - he alone is God
  lexicon: HALOT
  rationale: After the explicit subject “Yahweh,” English does not need a repeated pronoun; the copular assertion and Hebrew emphasis are adequately retained.
- source_word: הוּא עָשָׂנוּ
  chosen: He made us
  alternatives:
  - He has made us
  - He fashioned us
  lexicon: HALOT
  rationale: עשה here refers to God's making/creating his people. Simple past reads naturally in English and fits the psalm's confessional style.
- source_word: וְלֹא אֲנַחְנוּ
  chosen: and we did not make ourselves
  alternatives:
  - and not ourselves
  - and we are his
  lexicon: HALOT
  rationale: This supplies in natural English the verb ellipted in the ketiv’s contrast with “He made us,” while the qere reading remains documented in the note.
- source_word: עַמּוֹ
  chosen: his people
  lexicon: HALOT
  rationale: Standard covenantal designation for those belonging to God. Straightforward possessive rendering.
- source_word: וְצֹאן מַרְעִיתוֹ
  chosen: and the sheep of his pasture
  alternatives:
  - the flock of his pasture
  lexicon: HALOT
  rationale: A common pastoral metaphor. 'Sheep of his pasture' preserves the imagery and close lexical correspondence of צאן and מרעית.
