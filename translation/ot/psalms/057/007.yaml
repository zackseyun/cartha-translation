  from: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
  to: My heart is steadfast[a], O God; my heart is steadfast. I will sing and make melody.[b]
  rationale: The waw simply joins the paired cohortatives. “Yes” adds an unmarked emphatic element and interrupts the natural coordination. The revision directly represents both verbs while retaining their distinct musical senses.
