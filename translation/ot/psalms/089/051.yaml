id: PSA.89.51
reference: Psalms 89:51
source:
  edition: WLC
  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
translation:
  text: with which your enemies have taunted, Yahweh, with which they have taunted the footsteps[b] of your anointed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your Messiah.” The Hebrew says “your anointed” (מְשִׁיחֶךָ), referring here to the Davidic king.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word may denote footsteps, steps, heels, or tracks; the concrete image is preserved here.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  chosen: have taunted
  alternatives:
  - have reproached
  - have mocked
  - have reviled
  lexicon: HALOT
  rationale: The verb חרף denotes scornful reproach or taunting. 'Have taunted' is idiomatic modern English and preserves the hostile, derisive force without sounding archaic. The perfect is rendered with present relevance in English ('have taunted').
- source_word: אוֹיְבֶיךָ
  chosen: your enemies
  lexicon: HALOT
  rationale: Straightforward construct with 2ms suffix. 'Enemies' is the natural and consistent rendering.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - O Yahweh
  lexicon: HALOT
  rationale: The divine name is in direct address; comma punctuation marks the vocative without requiring “O.”
- source_word: אֲשֶׁר
  chosen: with which
  alternatives:
  - which
  - that
  lexicon: HALOT
  rationale: In this context אֲשֶׁר introduces the content/instrument of the reproach and links back to the preceding clause in the psalm. 'With which' best captures the relative connection in idiomatic English.
- source_word: עִקְּבוֹת
  chosen: the footsteps
  alternatives:
  - the heels
  - the tracks
  - the steps
  lexicon: HALOT
  rationale: From עקב, literally 'heels/footsteps/tracks.' In context it likely refers metaphorically to the coming, movements, or traces of the king/anointed one. 'Footsteps' preserves the concrete imagery while remaining intelligible.
- source_word: מְשִׁיחֶךָ
  chosen: your anointed
  alternatives:
  - your Messiah
  lexicon: HALOT
  rationale: Although משיח can be rendered 'Messiah' when functioning as a title, in this psalmic royal context it most naturally refers to the LORD's anointed king. 'Your anointed' preserves the Hebrew sense without importing a more explicit messianic title into the main text; the alternative is worth preserving in a footnote because of broader canonical resonance.
