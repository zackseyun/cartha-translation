  review_summary: כִּמְעַט marks the nearness of the stated outcome, not principally its future imminence, so “soon” is inadequate. The proposed “would almost have dwelt” conveys the right sense but is less natural in this elevated sentence; placing “nearly” before the participle more clearly scopes it over the nearly realized outcome. “Dwelt in silence” properly preserves the source image.
