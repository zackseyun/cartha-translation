id: PSA.135.13
reference: Psalms 135:13
source:
  edition: WLC
  text: יְ֭הוָה שִׁמְ/ךָ֣ לְ/עוֹלָ֑ם יְ֝הוָ֗ה זִכְרְ/ךָ֥ לְ/דֹר וָ/דֹֽר־׃
translation:
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or ‘your remembrance’ or ‘your memorial.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: POB renders the Tetragrammaton as the personal name 'Yahweh.' The direct poetic address does not require the elevated English particle 'O.'
- source_word: שִׁמְךָ
  chosen: your name
  lexicon: HALOT
  rationale: The phrase retains the Hebrew term's breadth, including both the divine name and the reputation associated with it.
- source_word: לְעוֹלָם
  chosen: endures forever
  alternatives:
  - is forever
  - is for eternity
  lexicon: HALOT
  rationale: The Hebrew clause is verbless, but the temporal phrase implies continuance. Supplying 'endures' expresses that force naturally.
- source_word: זִכְרְךָ
  chosen: your renown
  alternatives:
  - your remembrance
  - your memorial
  lexicon: HALOT
  rationale: In parallel with 'your name' and with duration across generations, the noun denotes Yahweh's enduring remembered reputation or renown.
- source_word: לְדֹר וָדֹר
  chosen: endures from generation to generation
  alternatives:
  - is from generation to generation
  - through all generations
  lexicon: HALOT
  rationale: Repeating 'endures' makes the persistence implied by the second verbless clause clear and preserves the poetic parallelism.
