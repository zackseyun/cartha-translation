  category: mistranslation
  tier: 1
  from: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[b][c]. He heaps up wealth and does not know who will gather it.
  to: Surely a man walks about as an image[a]; surely people are in turmoil in vain[b]. He heaps things up but does not know who will gather them.
  rationale: צלם is “image,” not “shadow”; the source image should be retained. “Heaps things up” appropriately avoids supplying the specific object “wealth,” and “them” retains the plural suffix. But “people bustle about for vapor” is not natural English and imposes an unsupported purposive relation. In this collocation הבל naturally functions adverbially, and “in vain” is both faithful to the contextual force and idiomatic. “Are in turmoil” preserves the plural verbal form without adding the more specific activity “bustle.”
