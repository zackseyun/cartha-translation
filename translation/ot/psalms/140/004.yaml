id: PSA.140.4
reference: Psalms 140:4
source:
  edition: WLC
  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
translation:
  text: Keep me, O Yahweh, from the hands of the wicked[a]; guard me from violent men, who have planned to trip up my feet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the hand of a wicked man.” The Hebrew is singular and may be read individually or collectively.
    reason: alternative_reading
  - marker: b
    text: Or “who have devised how to push my steps aside.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  chosen: Keep me
  alternatives:
  - Preserve me
  - Watch over me
  lexicon: HALOT
  rationale: From שׁמר, here an imperative/request for protection. 'Keep me' is concise, natural English and pairs well with the following synonymous verb without becoming overly repetitive in a wooden way.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִידֵי רָשָׁע
  chosen: from the hands of the wicked
  alternatives:
  - from the hand of the wicked man
  - from the power of the wicked
  lexicon: HALOT
  rationale: The idiom 'from the hands of' preserves the Hebrew image of hostile power/control. Although רָשָׁע is morphologically singular, English often uses 'the wicked' collectively; this avoids an unnecessarily individualized reading while retaining the class sense.
- source_word: מֵאִישׁ חֲמָסִים
  chosen: from violent men
  alternatives:
  - from violent men
  - from a violent man
  - from the man of violences
  lexicon: HALOT
  rationale: The formally singular representative expression is construed collectively by the following plural verb.
- source_word: תִּנְצְרֵנִי
  chosen: guard me
  alternatives:
  - preserve me
  - watch over me
  lexicon: HALOT
  rationale: From נצר, another plea for protection. 'Guard me' gives a natural English distinction from the previous 'Keep me' while maintaining the synonymous parallelism.
- source_word: אֲשֶׁר
  chosen: who
  alternatives:
  - that
  lexicon: HALOT
  rationale: Refers back to the hostile person/group; 'who' is the most natural relative pronoun in English for personal antecedents.
- source_word: חָשְׁבוּ
  chosen: have planned
  alternatives:
  - have devised
  - have purposed
  - have thought
  lexicon: HALOT
  rationale: The source verb is plural and should retain plural English agreement.
- source_word: לִדְחוֹת
  chosen: to trip up
  alternatives:
  - to thrust down
  - to push aside
  - to overthrow
  lexicon: HALOT
  rationale: The verb דחה can mean to push, thrust, or drive away/down. With 'my feet' as object, the sense is causing a stumble. 'Trip up' captures the idiom in readable English without losing the hostile action.
- source_word: פְּעָמָי
  chosen: my feet
  alternatives:
  - my steps
  - my footsteps
  lexicon: HALOT
  rationale: Though פעמים can denote steps/footsteps, with דחה the concrete image of bodily stumbling is prominent. 'My feet' best preserves the metaphorical-physical force in English.
