- timestamp: '2026-04-21T01:29:49Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/144/014.json
  category: awkward_english
  tier: 1
  from: and no going out
  to: and no one going forth
  rationale: The current rendering 'and no going out' is a very literal translation of the Hebrew, but it is awkward in English. It sounds more like a command or a description of a quarantine than a blessing of security. The context, with 'no breach' before it and 'no cry' after it, implies a calamitous departure, such as a military sortie or people being led into exile. The suggested rewrite, 'and no one going forth,' is more natural English, fits the elevated context, and better implies this sense of movement out from the city, while still being general enough to allow the footnote to specify possibilities like 'exile'.
- timestamp: '2026-04-23T11:31:12Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: Our cattle are heavy with young; there is no breach and no one going forth, and no cry in our streets.
  to: Our cattle are heavy with young; there is no breach and no going out, and no cry in our streets.
  rationale: Replaced 'no one going forth' with 'no going out' to more closely reflect the Hebrew's impersonal phrasing and maintain formal consistency with the parallel negatives.
- timestamp: '2026-08-28T22:31:55Z'
  adjudicator: wisdom-source-audit-final
  reviewer_model: gpt-5.6-sol-2026-07-09
  source_review: WLC Hebrew, chapter context, prior Sol/Terra proposal and final high-scrutiny adjudication
  category: ambiguity
  tier: 1
  from: Our cattle are heavy with young[a]; there is no breach and no going out[b], and no cry in our streets.
  to: Our oxen are heavily laden[a]; there is no breach, no one carried away[b], and no cry in our streets.
  rationale: “Heavy with young” supplies pregnancy without lexical warrant; “oxen are heavily laden” reflects the ordinary burden-bearing sense while noting that both terms are difficult. In the security sequence, unrestricted “no one going out” sounds as though peaceful movement has ceased and fails to convey the likely calamitous sense of the feminine participle. “No one carried away” is idiomatic and contextually apt for forced removal or captivity, but because the terse Hebrew literally denotes a going out and permits other construals, that uncertainty is retained in the note. Repeating “and” between the first two coordinated negatives is unnecessary in English.
