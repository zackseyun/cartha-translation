id: PSA.22.16
reference: Psalms 22:16
source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
translation:
  text: For dogs have surrounded me; a company of evildoers has encircled me; like a lion—my hands and my feet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Masoretic Hebrew reads “like a lion—my hands and my feet,” a difficult expression. The Greek reads “they dug my hands and feet,” often rendered “they pierced.” A Hebrew scroll from Nahal Hever is transcribed with a different spelling, ka'aru, but its meaning and the earliest wording remain disputed.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the reason or ground for the lament. 'For' fits the discourse flow in English and preserves the causal/explanatory force without overinterpreting.
- source_word: סְבָבוּנִי
  chosen: have surrounded me
  alternatives:
  - surrounded me
  - closed in around me
  lexicon: HALOT
  rationale: From סבב, 'to surround, encircle.' The perfect is rendered idiomatically with present relevance in English. 'Have surrounded me' preserves the completed hostile action.
- source_word: כְּלָבִים
  chosen: dogs
  lexicon: HALOT
  rationale: Literal rendering. In context it is metaphorical for hostile, contemptible attackers, but the image should be preserved rather than interpreted away.
- source_word: עֲדַת מְרֵעִים
  chosen: a company of evildoers
  alternatives:
  - an assembly of evildoers
  - a band of wicked men
  lexicon: HALOT
  rationale: עֲדָה denotes an assembled group or company; מְרֵעִים are those doing evil. 'Company of evildoers' is natural modern English while retaining the collective hostile image.
- source_word: הִקִּיפוּנִי
  chosen: has encircled me
  alternatives:
  - have enclosed me
  - has surrounded me
  lexicon: HALOT
  rationale: From נקף/נָקַף in the hiphil, conveying surrounding or enclosing. 'Encircled me' gives a slightly distinct English verb from the earlier סבב while preserving the parallelism.
- source_word: כָּאֲרִי
  chosen: like a lion
  alternatives:
  - they pierced
  - they have dug through
  lexicon: HALOT
  rationale: The declared WLC source reads כָּאֲרִי, 'like a lion.' Retention here reflects the current source base pending adjudication, not proof that the Masoretic reading is earliest. The published 5/6Hev1b transcription has כארו, so original-language primacy does not exclude the alternative as merely Greek or Christian. Its spelling, interpretation and historical priority require separate assessment; the final waw in the 4Q88 reconstruction is supplied and cannot provide a second secure complete attestation.
- source_word: יָדַי וְרַגְלָי
  chosen: my hands and my feet
  lexicon: HALOT
  rationale: Straightforward rendering of the body parts governed by the difficult preceding phrase. The unusual verbless construction is retained as much as possible in English rather than smoothing into an interpretive paraphrase.
- source_word: כָּאֲרִי יָדַי וְרַגְלָי
  chosen: like a lion—my hands and my feet
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the WLC wording and its unresolved syntax without supplying an unwarranted action or agent.
