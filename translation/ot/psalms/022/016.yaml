  from: For dogs have surrounded me[a]; a company of evildoers has encircled me; like a lion are my hands and my feet.
  to: For dogs have surrounded me; a company of evildoers has encircled me; like a lion—my hands and my feet.[a]
  rationale: The Masoretic wording is genuinely syntactically incomplete. The em dash preserves its abruptness without inventing a verb, an attacking subject, or a misleading equation in which the speaker’s limbs are lion-like. The revised note accurately distinguishes the difficult Hebrew reading from the ancient alternative without overstating its attestation.
