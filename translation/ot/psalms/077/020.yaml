id: PSA.77.20
reference: Psalms 77:20
source:
  edition: WLC
  text: נָחִ֣יתָ כַ/צֹּ֣אן עַמֶּ֑/ךָ בְּֽ/יַד מֹשֶׁ֥ה וְ/אַהֲרֹֽן־׃
translation:
  text: You led your people like a flock through Moses and Aaron[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “by the hand of Moses and Aaron,” an idiom expressing agency.
    reason: literal_form
lexical_decisions:
- source_word: נָחִיתָ
  chosen: You led
  alternatives:
  - You guided
  - You conducted
  lexicon: HALOT
  rationale: Qal perfect 2ms of נחה/נחית in context addresses God directly and denotes leading or guiding. 'Led' is the most natural modern English rendering and fits the shepherding image that follows.
- source_word: כַצֹּאן
  chosen: like a flock
  alternatives:
  - like sheep
  lexicon: HALOT
  rationale: The prefixed כ marks comparison, 'like/as.' צאן is a collective noun for small livestock, especially sheep/goats. 'Like a flock' preserves the collective pastoral image better than the more individualized 'like sheep.'
- source_word: עַמֶּךָ
  chosen: your people
  alternatives:
  - your nation
  lexicon: HALOT
  rationale: עם commonly means 'people' in covenantal/national sense. 'Your people' is the standard and contextually appropriate rendering for Israel addressed to God.
- source_word: ביד
  chosen: through
  alternatives:
  - through
  - under the leadership of
  lexicon: HALOT
  rationale: In this construction, בְּיַד denotes agency or instrumentality. “Through” is idiomatic English while the literal hand expression is documented in the footnote.
- source_word: מֹשֶׁה וְאַהֲרֹן
  chosen: Moses and Aaron
  rationale: Personal names are transliterated by standard English conventions per project philosophy.
