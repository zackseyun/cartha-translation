  from: You led your people like a flock by the hand of Moses and Aaron[a][b].
  to: You led your people like a flock through Moses and Aaron[a].
  rationale: The proposal correctly renders the Hebrew agency idiom בְּיַד in natural contemporary English. “Through Moses and Aaron” preserves God as the subject and Moses and Aaron as mediating agents, without importing an explicit leadership term. “Like a flock” appropriately represents the collective צֹאן and preserves the image. The removed flock note is redundant in the translated text; retaining a concise note for the literal Hebrew hand idiom is honest and useful.
