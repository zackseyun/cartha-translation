  review_summary: “Boasts in the desire of his soul” is unnatural gloss-English, and “about his own desire” gives the force of עַל and נַפְשׁוֹ naturally. In this compressed sequence, Yahweh is most naturally the object of both verbs; בֵּרֵךְ functions as the familiar euphemistic form for cursing God, not as an unsupported reflexive “blesses himself.”
lexical_decisions:
- source_word: עַל תַּאֲוַת נַפְשׁוֹ
  chosen: about his own desire
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The preposition marks the subject of boasting, and “own desire” avoids the misleadingly emotional specificity of “heart’s desire.”
- source_word: וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהוָה
  chosen: and the greedy man curses and rejects Yahweh
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The compressed clause most plausibly has Yahweh as object of both verbs; “curses” represents the euphemistic use of ברך in this context and נִאֵץ denotes contemptuous rejection.
