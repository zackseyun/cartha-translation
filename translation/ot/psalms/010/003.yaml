id: PSA.10.3
reference: Psalms 10:3
source:
  edition: WLC
  text: כִּֽי הִלֵּ֣ל רָ֭שָׁע עַל תַּאֲוַ֣ת נַפְשׁ֑/וֹ וּ/בֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ יְהוָֽה־־׀׃
translation:
  text: For the wicked man boasts about his own desire, and the greedy man curses and rejects Yahweh.[a]
  footnotes:
  - marker: a
    text: The Hebrew is compressed and difficult. Literally, the verb rendered “curses” is “blesses”; it is likely a euphemistic use in reference to God. Or, “the greedy man blesses and rejects Yahweh.”
    reason: alternative_reading
