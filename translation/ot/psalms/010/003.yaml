  from: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises Yahweh.
  to: For the wicked man boasts about his own desire, and the greedy man curses and rejects Yahweh.[a]
  rationale: “Boasts in the desire of his soul” is unnatural gloss-English, and “about his own desire” gives the force of עַל and נַפְשׁוֹ naturally. In this compressed sequence, Yahweh is most naturally the object of both verbs; בֵּרֵךְ functions as the familiar euphemistic form for cursing God, not as an unsupported reflexive “blesses himself.”
