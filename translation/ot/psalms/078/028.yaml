  from: He made it fall in the midst of their camp[a], all around their dwellings.
  to: He made them fall within their camp[a], all around their dwellings.
  rationale: The implied referent is the winged birds of the preceding line. Plural “them” makes that antecedent clear and avoids the misleading singular “it,” while “within” naturally represents the interior sense of בְּקֶרֶב. The existing note remains an honest explanation of the Hebrew singular possessive suffixes and their collective English sense.
