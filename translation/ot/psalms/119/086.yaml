id: PSA.119.86
reference: Psalms 119:86
source:
  edition: WLC
  text: כָּל מִצְוֺתֶ֥י/ךָ אֱמוּנָ֑ה שֶׁ֖קֶר רְדָפ֣וּ/נִי עָזְרֵֽ/נִי־׃
translation:
  text: All your commandments are trustworthy; they persecute me with lies. Help me!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  chosen: commandments
  alternatives:
  - command
  - orders
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת are God's authoritative commandments. Rendered 'commandment(s)' consistently across the psalm's eight terms.
- source_word: אֱמוּנָה
  chosen: trustworthy
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: As a predicate of the commandments, the term expresses their reliability; “trustworthy” is source-faithful and natural English.
