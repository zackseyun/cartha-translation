id: PSA.119.39
reference: Psalms 119:39
source:
  edition: WLC
  text: הַעֲבֵ֣ר חֶ֭רְפָּתִ/י אֲשֶׁ֣ר יָגֹ֑רְתִּי כִּ֖י מִשְׁפָּטֶ֣י/ךָ טוֹבִֽים׃
translation:
  text: Turn away the reproach that I dread, for your ordinances are good.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
