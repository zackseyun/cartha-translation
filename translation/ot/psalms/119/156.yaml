id: PSA.119.156
reference: Psalms 119:156
source:
  edition: WLC
  text: רַחֲמֶ֖י/ךָ רַבִּ֥ים יְהוָ֑ה כְּֽ/מִשְׁפָּטֶ֥י/ךָ חַיֵּֽ/נִי׀׃
translation:
  text: Great is your mercy, Yahweh; give me life according to your ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: כְּֽמִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
