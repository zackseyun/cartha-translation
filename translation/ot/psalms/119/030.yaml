id: PSA.119.30
reference: Psalms 119:30
source:
  edition: WLC
  text: דֶּֽרֶךְ אֱמוּנָ֥ה בָחָ֑רְתִּי מִשְׁפָּטֶ֥י/ךָ שִׁוִּֽיתִי־׃
translation:
  text: I have chosen the way of faithfulness; I have set your ordinances before me.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
