  text: עָ֭שִׂיתִי מִשְׁפָּ֣ט וָ/צֶ֑דֶק בַּל תַּ֝נִּיחֵ֗/נִי לְ/עֹֽשְׁקָֽ/י־׃
translation:
  text: I[a] have done justice and righteousness; do not leave me to my oppressors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 121–128 all begin with ʿayin (ע), the sixteenth letter
      of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: מִשְׁפָּט
  chosen: justice
  lemma: מִשְׁפָּט
  alternatives:
  - what is just
  - an ordinance
  lexicon: HALOT
  rationale: Here מִשְׁפָּט is a righteous act the psalmist has done ('justice and
    righteousness'), not the standing law-term.
