id: PSA.119.131
reference: Psalms 119:131
source:
  edition: WLC
  text: פִּֽ/י פָ֭עַרְתִּי וָ/אֶשְׁאָ֑פָ/ה כִּ֖י לְ/מִצְוֺתֶ֣י/ךָ יָאָֽבְתִּי־׃
translation:
  text: I open wide my mouth and pant, because I long for your commandments.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִצְוֺתֶיךָ
  chosen: commandments
  alternatives:
  - command
  - orders
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת are God's authoritative commandments. Rendered 'commandment(s)' consistently across the psalm's eight terms.
- source_word: פָּעַרְתִּי
  chosen: I open wide
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The verb denotes opening wide or gaping, not merely opening.
