id: PSA.119.62
reference: Psalms 119:62
source:
  edition: WLC
  text: חֲצֽוֹת לַ֗יְלָה אָ֭קוּם לְ/הוֹד֣וֹת לָ֑/ךְ עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ־׃
translation:
  text: At midnight I rise to praise you for your righteous ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּטֵי
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
