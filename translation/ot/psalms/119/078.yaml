id: PSA.119.78
reference: Psalms 119:78
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ זֵ֭דִים כִּי שֶׁ֣קֶר עִוְּת֑וּ/נִי אֲ֝נִ֗י אָשִׂ֥יחַ בְּ/פִקּוּדֶֽי/ךָ־׃
translation:
  text: Let the arrogant be put to shame, for they wrong me with falsehood; but I
    will meditate on your precepts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפִקּוּדֶֽיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this
    term distinct from statutes and commandments.
