source:
  edition: WLC
  text: קִדְּמ֣וּ עֵ֭ינַ/י אַשְׁמֻר֑וֹת לָ֝/שִׂ֗יחַ בְּ/אִמְרָתֶֽ/ךָ׃
translation:
  text: My eyes stay open through the watches of the night, to meditate on your promise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאִמְרָתֶֽךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on
    which the psalmist stakes his life; rendered 'promise' to distinguish it from
    דָּבָר ('word'), with 'word/saying' as alternatives.
