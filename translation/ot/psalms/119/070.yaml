  review_summary: “Unfeeling like fat” mixes an inferred effect with the comparison and produces awkward English. “Thick like fat” more directly preserves the concrete image of טָפַשׁ כַּחֵלֶב. English plural “hearts” naturally represents the Hebrew collective singular לִבָּם without changing the referent.
