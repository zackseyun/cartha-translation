id: PSA.119.169
reference: Psalms 119:169
source:
  edition: WLC
  text: תִּקְרַ֤ב רִנָּתִ֣/י לְ/פָנֶ֣י/ךָ יְהוָ֑ה כִּ/דְבָרְ/ךָ֥ הֲבִינֵֽ/נִי׃
translation:
  text: Let[a] my cry come before you, Yahweh; give me understanding according to your word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 169–176 all begin with taw (ת), the twenty-second letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כִּדְבָרְךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
