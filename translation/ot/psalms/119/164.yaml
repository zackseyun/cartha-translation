id: PSA.119.164
reference: Psalms 119:164
source:
  edition: WLC
  text: שֶׁ֣בַע בַּ֭/יּוֹם הִלַּלְתִּ֑י/ךָ עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ׃
translation:
  text: Seven times a day I praise you for your righteous ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּטֵי
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
