id: PSA.119.64
reference: Psalms 119:64
source:
  edition: WLC
  text: חַסְדְּ/ךָ֣ יְ֭הוָה מָלְאָ֥ה הָ/אָ֗רֶץ חֻקֶּ֥י/ךָ לַמְּדֵֽ/נִי׃
translation:
  text: The earth is full of your steadfast love, Yahweh; teach me your statutes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: חֻקֶּיךָ
  chosen: statutes
  alternatives:
  - decrees
  - prescriptions
  lexicon: HALOT
  rationale: חֹק/חֻקִּים are engraved, prescribed statutes. Rendered 'statutes' consistently;
    'decrees' preserved as an alternative.
