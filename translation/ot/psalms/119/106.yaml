id: PSA.119.106
reference: Psalms 119:106
source:
  edition: WLC
  text: נִשְׁבַּ֥עְתִּי וָ/אֲקַיֵּ֑מָ/ה לִ֝/שְׁמֹ֗ר מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ׃
translation:
  text: I have sworn an oath and confirmed it, to keep your righteous ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּטֵי
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
