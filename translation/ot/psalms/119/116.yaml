source:
  edition: WLC
  text: סָמְכֵ֣/נִי כְ/אִמְרָתְ/ךָ֣ וְ/אֶֽחְיֶ֑ה וְ/אַל תְּ֝בִישֵׁ֗/נִי מִ/שִּׂבְרִֽ/י־׃
translation:
  text: Uphold me according to your promise, that I may live, and let me not be ashamed
    of my hope.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאִמְרָתְךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on
    which the psalmist stakes his life; rendered 'promise' to distinguish it from
    דָּבָר ('word'), with 'word/saying' as alternatives.
