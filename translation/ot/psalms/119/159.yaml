id: PSA.119.159
reference: Psalms 119:159
source:
  edition: WLC
  text: רְ֭אֵה כִּי פִקּוּדֶ֣י/ךָ אָהָ֑בְתִּי יְ֝הוָ֗ה כְּֽ/חַסְדְּ/ךָ֥ חַיֵּֽ/נִי־׃
translation:
  text: Consider how I love your precepts! Give me life, Yahweh, according to your
    steadfast love.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִקּוּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this
    term distinct from statutes and commandments.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
