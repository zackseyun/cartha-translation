  text: יְבֹא֣וּ/נִי רַחֲמֶ֣י/ךָ וְ/אֶֽחְיֶ֑ה כִּי תֽ֝וֹרָתְ/ךָ֗ שַֽׁעֲשֻׁעָֽ/י־׃
