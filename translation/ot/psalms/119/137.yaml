id: PSA.119.137
reference: Psalms 119:137
source:
  edition: WLC
  text: צַדִּ֣יק אַתָּ֣ה יְהוָ֑ה וְ֝/יָשָׁ֗ר מִשְׁפָּטֶֽי/ךָ׃
translation:
  text: Righteous[a] are you, Yahweh, and upright are your ordinances.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 137–144 all begin with tsadhe (צ), the eighteenth
      letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: מִשְׁפָּטֶֽיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
