id: PSA.119.175
reference: Psalms 119:175
source:
  edition: WLC
  text: תְּֽחִי נַ֭פְשִׁ/י וּֽ/תְהַֽלְלֶ֑/ךָּ וּֽ/מִשְׁפָּטֶ֥/ךָ יַעֲזְרֻֽ/נִי־׃
translation:
  text: Let my soul live and praise you, and let your ordinances help me.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּֽמִשְׁפָּטֶךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
