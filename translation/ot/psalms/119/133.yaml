  text: פְּ֭עָמַ/י הָכֵ֣ן בְּ/אִמְרָתֶ֑/ךָ וְֽ/אַל תַּשְׁלֶט בִּ֥/י כָל אָֽוֶן־־־׃
translation:
  text: Keep my steps steady according to your promise, and let no iniquity gain dominion
    over me.
  philosophy: optimal-equivalence
lexical_decisions:
