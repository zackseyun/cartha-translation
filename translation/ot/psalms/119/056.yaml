  from: 'This has been my practice: I keep your precepts.'
  to: This has been mine, because I have kept your precepts.
  rationale: The current “my practice” supplies a specific antecedent that the Hebrew does not state. זֹאת הָיְתָה לִּי leaves “this” open and says that it has been/belonged to the psalmist because he kept the precepts. The proposed wording preserves that ambiguity and represents the perfect נָצָרְתִּי appropriately.
