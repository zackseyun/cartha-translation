  text: זֹ֥את הָֽיְתָה לִּ֑/י כִּ֖י פִקֻּדֶ֣י/ךָ נָצָֽרְתִּי־׃
translation:
  text: This has been mine, because I have kept your precepts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִקֻּדֶיךָ
