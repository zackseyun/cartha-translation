  text: מָֽה אָהַ֥בְתִּי תוֹרָתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם הִ֣יא שִׂיחָתִֽ/י־־׃
translation:
  text: Oh[a] how I love your law! It is my meditation all day long.
