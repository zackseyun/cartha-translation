id: PSA.119.65
reference: Psalms 119:65
source:
  edition: WLC
  text: ט֭וֹב עָשִׂ֣יתָ עִֽם עַבְדְּ/ךָ֑ יְ֝הוָ֗ה כִּ/דְבָרֶֽ/ךָ־׃
translation:
  text: You[a] have dealt well with your servant, Yahweh, according to your word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 65–72 all begin with teth (ט), the ninth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כִּדְבָרֶֽךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
