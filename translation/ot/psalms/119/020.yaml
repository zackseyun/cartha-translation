id: PSA.119.20
reference: Psalms 119:20
source:
  edition: WLC
  text: גָּרְסָ֣ה נַפְשִׁ֣/י לְ/תַאֲבָ֑ה אֶֽל מִשְׁפָּטֶ֥י/ךָ בְ/כָל עֵֽת־־׃
translation:
  text: My soul is consumed with longing for your ordinances at all times.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
