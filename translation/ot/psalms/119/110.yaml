id: PSA.119.110
reference: Psalms 119:110
source:
  edition: WLC
  text: נָתְנ֬וּ רְשָׁעִ֣ים פַּ֣ח לִ֑/י וּ֝/מִ/פִּקּוּדֶ֗י/ךָ לֹ֣א תָעִֽיתִי׃
translation:
  text: The wicked have set a snare for me, but I do not stray from your precepts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפִּקּוּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this
    term distinct from statutes and commandments.
