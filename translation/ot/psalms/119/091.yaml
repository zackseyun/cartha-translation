id: PSA.119.91
reference: Psalms 119:91
source:
  edition: WLC
  text: לְֽ֭/מִשְׁפָּטֶי/ךָ עָמְד֣וּ הַ/יּ֑וֹם כִּ֖י הַ/כֹּ֣ל עֲבָדֶֽי/ךָ׃
translation:
  text: According to your ordinances they stand today, for all things are your servants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְֽמִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
