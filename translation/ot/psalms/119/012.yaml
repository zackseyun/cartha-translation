id: PSA.119.12
reference: Psalms 119:12
source:
  edition: WLC
  text: בָּר֖וּךְ אַתָּ֥ה יְהוָ֗ה לַמְּדֵ֥/נִי חֻקֶּֽי/ךָ׃
translation:
  text: Blessed are you, Yahweh; teach me your statutes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: חֻקֶּֽיךָ
  chosen: statutes
  alternatives:
  - decrees
  - prescriptions
  lexicon: HALOT
  rationale: חֹק/חֻקִּים are engraved, prescribed statutes. Rendered 'statutes' consistently;
    'decrees' preserved as an alternative.
