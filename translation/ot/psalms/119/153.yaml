id: PSA.119.153
reference: Psalms 119:153
source:
  edition: WLC
  text: רְאֵֽה עָנְיִ֥/י וְ/חַלְּצֵ֑/נִי כִּי תֽ֝וֹרָתְ/ךָ֗ לֹ֣א שָׁכָֽחְתִּי־־׃
translation:
  text: Look[a] on my affliction and deliver me, for I do not forget your law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 153–160 all begin with resh (ר), the twentieth letter
      of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: תֽוֹרָתְךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English
    gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching'
    preserved as alternatives.
