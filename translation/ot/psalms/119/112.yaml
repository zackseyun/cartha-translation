  from: I incline my heart to perform your statutes forever, to the very end.
  to: I have inclined my heart to carry out your statutes forever, to the very end.
  rationale: The perfect נָטִיתִי should not be rendered as the present “I incline.” The proposed perfect construction correctly addresses that issue, but “set my heart on” replaces the Hebrew’s inclination image with a stronger, more idiomatic goal-oriented expression. Retaining “inclined my heart” is both clear English and source-near; “carry out” naturally renders לעשות in this setting.
