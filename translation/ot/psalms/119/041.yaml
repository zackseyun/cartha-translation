id: PSA.119.41
reference: Psalms 119:41
source:
  edition: WLC
  text: וִֽ/יבֹאֻ֣/נִי חֲסָדֶ֣/ךָ יְהוָ֑ה תְּ֝שֽׁוּעָתְ/ךָ֗ כְּ/אִמְרָתֶֽ/ךָ׃
translation:
  text: Let[a] your steadfast love come to me, Yahweh, your salvation according to
    your promise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 41–48 all begin with waw (ו), the sixth letter of
      the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: כְּאִמְרָתֶֽךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on
    which the psalmist stakes his life; rendered 'promise' to distinguish it from
    דָּבָר ('word'), with 'word/saying' as alternatives.
