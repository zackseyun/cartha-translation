id: PSA.119.109
reference: Psalms 119:109
source:
  edition: WLC
  text: נַפְשִׁ֣/י בְ/כַפִּ֣/י תָמִ֑יד וְ֝/תֽוֹרָתְ/ךָ֗ לֹ֣א שָׁכָֽחְתִּי׃
translation:
  text: My life is continually in my hand, yet I do not forget your law.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתֽוֹרָתְךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching' preserved as alternatives.
