id: PSA.119.138
reference: Psalms 119:138
source:
  edition: WLC
  text: צִ֭וִּיתָ צֶ֣דֶק עֵדֹתֶ֑י/ךָ וֶֽ/אֱמוּנָ֥ה מְאֹֽד׃
translation:
  text: You have commanded that your testimonies be righteous and utterly faithful.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  chosen: testimonies
  alternatives:
  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדֹות (plural of עֵדָה, covenant testimony) is rendered 'testimonies' consistently with עֵדוּת across the psalm.
- source_word: צֶדֶק ... וֶאֱמוּנָה מְאֹד
  chosen: righteous and utterly faithful
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: These terms predicate righteousness and very great faithfulness/reliability of the testimonies.
