  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כְּ֝/מִשְׁפָּ֗ט לְ/אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
translation:
  text: Turn to me and be gracious to me, as is your way with those who love your
    name.
