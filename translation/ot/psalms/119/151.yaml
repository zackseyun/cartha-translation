id: PSA.119.151
reference: Psalms 119:151
source:
  edition: WLC
  text: קָר֣וֹב אַתָּ֣ה יְהוָ֑ה וְֽ/כָל מִצְוֺתֶ֥י/ךָ אֱמֶֽת־׃
translation:
  text: But you are near, Yahweh, and all your commandments are true.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: מִצְוֺתֶיךָ
  chosen: commandments
  alternatives:
  - command
  - orders
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת are God's authoritative commandments. Rendered 'commandment(s)'
    consistently across the psalm's eight terms.
