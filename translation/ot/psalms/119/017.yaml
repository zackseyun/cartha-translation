  text: גְּמֹ֖ל עַֽל עַבְדְּ/ךָ֥ אֶֽחְיֶ֗ה וְ/אֶשְׁמְרָ֥ה דְבָרֶֽ/ךָ־׃
translation:
  text: Do good[a] to your servant, that I may live and keep your word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 17–24 all begin with gimel (ג), the third letter of the alphabet—continuing the acrostic introduced at verse 1.
    reason: Retains the applicable acrostic note and matches the inline marker.
lexical_decisions:
- source_word: דְבָרֶֽךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
- source_word: גְּמֹל עַל
  chosen: Do good to
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Conveys the favorable idiom naturally without importing “bountifully.”
