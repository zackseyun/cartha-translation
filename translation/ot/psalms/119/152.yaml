  review_summary: יָדַעְתִּי is "I knew"; "I learned" adds a learning event rather than translating the stated state of knowledge. "From your testimonies" naturally expresses the source of that knowledge. "Established" is a natural rendering of יְסַדְתָּם for the enduring status of the testimonies and is preferable here to the more concrete "founded."
