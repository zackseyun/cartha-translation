id: PSA.119.152
reference: Psalms 119:152
source:
  edition: WLC
  text: קֶ֣דֶם יָ֭דַעְתִּי מֵ/עֵדֹתֶ֑י/ךָ כִּ֖י לְ/עוֹלָ֣ם יְסַדְתָּֽ/ם׃
translation:
  text: Long ago I knew from your testimonies that you established them forever.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֵדֹתֶיךָ
  chosen: testimonies
  alternatives:
  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדֹות (plural of עֵדָה, covenant testimony) is rendered 'testimonies' consistently with עֵדוּת across the psalm.
- source_word: יָדַעְתִּי
  chosen: I knew
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Translates the ordinary perfect of ידע without adding an acquisition event.
- source_word: יְסַדְתָּם
  chosen: you established them
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Faithfully conveys fixing/establishing the testimonies permanently in idiomatic English.
