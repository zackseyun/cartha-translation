  from: Long ago I learned from your testimonies that you have founded them forever.
  to: Long ago I knew from your testimonies that you established them forever.
  rationale: יָדַעְתִּי is "I knew"; "I learned" adds a learning event rather than translating the stated state of knowledge. "From your testimonies" naturally expresses the source of that knowledge. "Established" is a natural rendering of יְסַדְתָּם for the enduring status of the testimonies and is preferable here to the more concrete "founded."
