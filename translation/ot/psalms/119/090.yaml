  from: Your faithfulness endures to all generations; you established the earth, and it stands fast.
  to: Your faithfulness is from generation to generation; you established the earth, and it stands.
  rationale: 'The first colon is nominal: “Your faithfulness [is] from generation to generation.” “Endures” is a plausible interpretive expansion, but “is from generation to generation” better retains the Hebrew’s formulation. וַתַּעֲמֹד states simply that the earth stands; “stands fast” adds a stabilizing nuance not overtly marked here. The revision is natural enough while reducing interpretation.'
