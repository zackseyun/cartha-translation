id: PSA.119.55
reference: Psalms 119:55
source:
  edition: WLC
  text: זָ֘כַ֤רְתִּי בַ/לַּ֣יְלָה שִׁמְ/ךָ֣ יְהוָ֑ה וָֽ֝/אֶשְׁמְרָ֗/ה תּוֹרָתֶֽ/ךָ׃
translation:
  text: I remember your name in the night, Yahweh, and I keep your law.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: תּוֹרָתֶֽךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English
    gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching'
    preserved as alternatives.
