id: PSA.119.1
reference: Psalms 119:1
source:
  edition: WLC
  text: אַשְׁרֵ֥י תְמִֽימֵי דָ֑רֶךְ הַֽ֝/הֹלְכִ֗ים בְּ/תוֹרַ֥ת יְהוָֽה־׃
translation:
  text: Blessed[a] are those whose way is blameless, who walk in the law of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Psalm 119 is an alphabetic acrostic: its 176 verses form 22 stanzas of eight verses, and within each stanza every line begins with the same successive letter of the Hebrew alphabet. Verses 1–8 all begin with ʾaleph (א), the first letter.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּתוֹרַת
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching' preserved as alternatives.
- source_word: יְהוָֽה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
