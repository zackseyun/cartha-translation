id: PSA.119.33
reference: Psalms 119:33
source:
  edition: WLC
  text: הוֹרֵ֣/נִי יְ֭הוָה דֶּ֥רֶךְ חֻקֶּ֗י/ךָ וְ/אֶצְּרֶ֥/נָּה עֵֽקֶב׃
translation:
  text: Teach[a] me, Yahweh, the way of your statutes, and I will keep it to the end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 33–40 all begin with he (ה), the fifth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: חֻקֶּיךָ
  chosen: statutes
  alternatives:
  - decrees
  - prescriptions
  lexicon: HALOT
  rationale: חֹק/חֻקִּים are engraved, prescribed statutes. Rendered 'statutes' consistently; 'decrees' preserved as an alternative.
