id: PSA.119.166
reference: Psalms 119:166
source:
  edition: WLC
  text: שִׂבַּ֣רְתִּי לִֽ/ישׁוּעָתְ/ךָ֣ יְהוָ֑ה וּֽ/מִצְוֺתֶ֥י/ךָ עָשִֽׂיתִי׃
translation:
  text: I hope for your salvation, Yahweh, and I do your commandments.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: וּֽמִצְוֺתֶיךָ
  chosen: commandments
  alternatives:
  - command
  - orders
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת are God's authoritative commandments. Rendered 'commandment(s)'
    consistently across the psalm's eight terms.
