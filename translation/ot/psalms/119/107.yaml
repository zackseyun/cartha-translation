id: PSA.119.107
reference: Psalms 119:107
source:
  edition: WLC
  text: נַעֲנֵ֥יתִי עַד מְאֹ֑ד יְ֝הוָ֗ה חַיֵּ֥/נִי כִ/דְבָרֶֽ/ךָ־׃
translation:
  text: I am severely afflicted; give me life, Yahweh, according to your word.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: כִדְבָרֶֽךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with
    אִמְרָה ('promise') the two utterance-terms stay distinct.
