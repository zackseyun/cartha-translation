id: PSA.119.174
reference: Psalms 119:174
source:
  edition: WLC
  text: תָּאַ֣בְתִּי לִֽ/ישׁוּעָתְ/ךָ֣ יְהוָ֑ה וְ֝/תֽוֹרָתְ/ךָ֗ שַׁעֲשֻׁעָֽ/י׃
translation:
  text: I long for your salvation, Yahweh, and your law is my delight.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: וְתֽוֹרָתְךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English
    gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching'
    preserved as alternatives.
