  text: רָאִ֣יתִי בֹ֭גְדִים וָֽ/אֶתְקוֹטָ֑טָ/ה אֲשֶׁ֥ר אִ֝מְרָתְ/ךָ֗ לֹ֣א שָׁמָֽרוּ׃
translation:
  text: I look on the faithless with disgust, because they do not keep your word.
