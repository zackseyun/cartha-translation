id: PSA.119.168
reference: Psalms 119:168
source:
  edition: WLC
  text: שָׁמַ֣רְתִּי פִ֭קּוּדֶי/ךָ וְ/עֵדֹתֶ֑י/ךָ כִּ֖י כָל דְּרָכַ֣/י נֶגְדֶּֽ/ךָ־׃
translation:
  text: I keep your precepts and testimonies, for all my ways are before you.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִקּוּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this
    term distinct from statutes and commandments.
- source_word: וְעֵדֹתֶיךָ
  chosen: testimonies
  alternatives:
  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדֹות (plural of עֵדָה, covenant testimony) is rendered 'testimonies'
    consistently with עֵדוּת across the psalm.
