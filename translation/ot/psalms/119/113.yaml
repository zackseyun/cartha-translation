source:
  edition: WLC
  text: סֵעֲפִ֥ים שָׂנֵ֑אתִי וְֽ/תוֹרָתְ/ךָ֥ אָהָֽבְתִּי׃
translation:
  text: I[a] hate the double-minded, but I love your law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 113–120 all begin with samekh (ס), the fifteenth letter
      of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: וְֽתוֹרָתְךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English
    gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching'
    preserved as alternatives.
