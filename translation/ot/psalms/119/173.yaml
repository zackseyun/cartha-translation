  from: Let your hand be ready to help me, for I have chosen your precepts.
  to: May your hand help me, for I have chosen your precepts.
  rationale: The current “be ready” introduces preparedness, which is not expressed by the jussive construction תְּהִי ... לְעָזְרֵנִי. The proposal correctly removes that addition, but bare “Let your hand help me” is slightly less idiomatic in contemporary English and can obscure the petitionary force. “May your hand help me” preserves both the concrete image of God’s hand and the Hebrew wish/request.
