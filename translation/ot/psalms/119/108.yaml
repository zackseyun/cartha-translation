id: PSA.119.108
reference: Psalms 119:108
source:
  edition: WLC
  text: נִדְב֣וֹת פִּ֭/י רְצֵה נָ֣א יְהוָ֑ה וּֽ/מִשְׁפָּטֶ֥י/ךָ לַמְּדֵֽ/נִי־׃
translation:
  text: Accept the freewill offerings of my mouth, Yahweh, and teach me your ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: וּֽמִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
