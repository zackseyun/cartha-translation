  from: You reject all who stray from your statutes, for their cunning is in vain.
  to: You reject all who stray from your statutes, for their deceit is a lie.
  rationale: The current “in vain” does not represent שֶׁקֶר, whose sense is falsehood, deception, or lie. Nor does “cunning” adequately convey תַּרְמִית, deceit or treachery. “Their deceit is a lie” is compact, natural enough in poetic English, and reproduces the emphatic nominal assertion without supplying an unstated consequence.
