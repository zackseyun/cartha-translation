id: PSA.119.72
reference: Psalms 119:72
source:
  edition: WLC
  text: טֽוֹב לִ֥/י תֽוֹרַת פִּ֑י/ךָ מֵ֝/אַלְפֵ֗י זָהָ֥ב וָ/כָֽסֶף־־׃
translation:
  text: The law of your mouth is better for me than thousands of gold and silver.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֽוֹרַת
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching' preserved as alternatives.
- source_word: מֵאַלְפֵי זָהָב וָכָסֶף
  chosen: than thousands of gold and silver
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hebrew expresses an unspecified quantity of precious metals; this wording avoids supplying “pieces” while retaining the expression's ellipsis.
