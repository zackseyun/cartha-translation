id: PSA.119.126
reference: Psalms 119:126
source:
  edition: WLC
  text: עֵ֭ת לַ/עֲשׂ֣וֹת לַ/יהוָ֑ה הֵ֝פֵ֗רוּ תּוֹרָתֶֽ/ךָ׃
translation:
  text: It is time for Yahweh to act, for your law has been broken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: תּוֹרָתֶֽךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English
    gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching'
    preserved as alternatives.
