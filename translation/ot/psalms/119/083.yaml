id: PSA.119.83
reference: Psalms 119:83
source:
  edition: WLC
  text: כִּֽי הָ֭יִיתִי כְּ/נֹ֣אד בְּ/קִיט֑וֹר חֻ֝קֶּ֗י/ךָ לֹ֣א שָׁכָֽחְתִּי־׃
translation:
  text: For I have become like a wineskin in the smoke[a], yet I do not forget your
    statutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A wineskin left hanging in smoke grew shriveled, blackened, and cracked
      — the psalmist's image for feeling worn out and useless, yet still clinging
      to God's statutes.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֶּיךָ
  chosen: statutes
  alternatives:
  - decrees
  - prescriptions
  lexicon: HALOT
  rationale: חֹק/חֻקִּים are engraved, prescribed statutes. Rendered 'statutes' consistently;
    'decrees' preserved as an alternative.
