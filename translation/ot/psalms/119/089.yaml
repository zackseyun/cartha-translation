id: PSA.119.89
reference: Psalms 119:89
source:
  edition: WLC
  text: לְ/עוֹלָ֥ם יְהוָ֑ה דְּ֝בָרְ/ךָ֗ נִצָּ֥ב בַּ/שָּׁמָֽיִם׃
translation:
  text: Forever[a], Yahweh, your word stands firm in the heavens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 89–96 all begin with lamedh (ל), the twelfth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: דְּבָרְךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
