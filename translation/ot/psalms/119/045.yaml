id: PSA.119.45
reference: Psalms 119:45
source:
  edition: WLC
  text: וְ/אֶתְהַלְּכָ֥ה בָ/רְחָבָ֑ה כִּ֖י פִקֻּדֶ֣י/ךָ דָרָֽשְׁתִּי׃
translation:
  text: I will walk about in a wide-open place, for I have sought your precepts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִקֻּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this term distinct from statutes and commandments.
- source_word: בָרְחָבָה
  chosen: in a wide-open place
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The noun denotes a broad or open space; this preserves the Hebrew spatial image rather than translating its inferred result as "freedom."
