reference: Psalms 119:7
source:
  edition: WLC
  text: א֭וֹדְ/ךָ בְּ/יֹ֣שֶׁר לֵבָ֑ב בְּ֝/לָמְדִ֗/י מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ׃
translation:
  text: I will praise you with an upright heart, as I learn your righteous ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּטֵי
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
