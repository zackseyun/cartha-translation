id: PSA.119.102
reference: Psalms 119:102
source:
  edition: WLC
  text: מִ/מִּשְׁפָּטֶ֥י/ךָ לֹא סָ֑רְתִּי כִּֽי אַ֝תָּ֗ה הוֹרֵתָֽ/נִי־־׃
translation:
  text: I do not turn aside from your ordinances, for you yourself have taught me.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמִּשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
