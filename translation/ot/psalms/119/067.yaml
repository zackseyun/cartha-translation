source:
  edition: WLC
  text: טֶ֣רֶם אֶ֭עֱנֶה אֲנִ֣י שֹׁגֵ֑ג וְ֝/עַתָּ֗ה אִמְרָתְ/ךָ֥ שָׁמָֽרְתִּי׃
translation:
  text: Before I was afflicted I went astray, but now I keep your word.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתְךָ
  chosen: word
  lemma: אִמְרָה
  alternatives:
  - promise
  - saying
  lexicon: HALOT
  rationale: Here אִמְרָה is the utterance one obeys (parallel with 'went astray'),
    so 'word' fits better than the promissory 'promise' used elsewhere in the psalm.
