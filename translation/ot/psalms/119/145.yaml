id: PSA.119.145
reference: Psalms 119:145
source:
  edition: WLC
  text: קָרָ֣אתִי בְ/כָל לֵ֭ב עֲנֵ֥/נִי יְהוָ֗ה חֻקֶּ֥י/ךָ אֶצֹּֽרָה־׃
translation:
  text: I[a] call with my whole heart; answer me, Yahweh! I will keep your statutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 145–152 all begin with qoph (ק), the nineteenth letter
      of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: חֻקֶּיךָ
  chosen: statutes
  alternatives:
  - decrees
  - prescriptions
  lexicon: HALOT
  rationale: חֹק/חֻקִּים are engraved, prescribed statutes. Rendered 'statutes' consistently;
    'decrees' preserved as an alternative.
