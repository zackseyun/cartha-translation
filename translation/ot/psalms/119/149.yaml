id: PSA.119.149
reference: Psalms 119:149
source:
  edition: WLC
  text: ק֭וֹלִ/י שִׁמְעָ֣/ה כְ/חַסְדֶּ֑/ךָ יְ֝הוָ֗ה כְּֽ/מִשְׁפָּטֶ֥/ךָ חַיֵּֽ/נִי׃
translation:
  text: Hear my voice according to your steadfast love; give me life, Yahweh, according
    to your ordinances.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The divine name יְהוָה is rendered 'Yahweh' per DOCTRINE.md (the divine
    name is a name), with 'the LORD' preserved as the traditional alternative.
- source_word: כְּֽמִשְׁפָּטֶךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his
    just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone
    of 'judgments'; 'judgments/rules' preserved as alternatives.
