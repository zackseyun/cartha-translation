id: PSA.119.25
reference: Psalms 119:25
source:
  edition: WLC
  text: דָּֽבְקָ֣ה לֶ/עָפָ֣ר נַפְשִׁ֑/י חַ֝יֵּ֗/נִי כִּ/דְבָרֶֽ/ךָ׃
translation:
  text: My[a] soul clings to the dust; give me life according to your word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the Hebrew, verses 25–32 all begin with daleth (ד), the fourth letter
      of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
lexical_decisions:
- source_word: כִּדְבָרֶֽךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with
    אִמְרָה ('promise') the two utterance-terms stay distinct.
