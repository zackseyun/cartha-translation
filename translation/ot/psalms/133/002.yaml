  category: lexical
  tier: 1
  from: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
  to: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard, running down on the opening of his robes.[b]
  rationale: 'The proposal rightly removes false precision from “collar”: פִּי מִדּוֹתָיו literally concerns the mouth/opening of the garments, and “opening” is the appropriate main-text rendering. It also properly relocates the note. Repeating “running down” effectively reflects the repeated participles. However, the proposed omission of “on” before “Aaron’s beard” loses the Hebrew’s repeated עַל and weakens the cascading parallelism. Likewise, the final עַל should remain “on,” as in the Hebrew; motion toward an endpoint can be inferred in English, but “to” unnecessarily recasts the image as a destination rather than oil upon the garment opening.'
