  text: צֶ֭דֶק לְ/פָנָ֣י/ו יְהַלֵּ֑ךְ וְ/יָשֵׂ֖ם לְ/דֶ֣רֶךְ פְּעָמָֽי/ו׃
translation:
  text: Righteousness will go before him and make his footsteps a path.
