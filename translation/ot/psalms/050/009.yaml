  from: I will not take a bull from your house[a], or goats from your pens.
  to: I will not take a bull from your house or male goats from your pens.
  rationale: עַתּוּדִים denotes male goats/he-goats. 'Male goats' is ordinary and clear English and restores lexical information omitted by the generic 'goats.' The disjunctive 'or' is not required by the Hebrew and can misleadingly suggest an exclusive alternative; simple coordination is more natural in this negated list. No footnote is necessary once the male specification is retained.
