theological_decisions:
- issue: Identifying the speaker and addressee in the compressed Hebrew of verse 9
  chosen_reading: Supply an elliptical verb of speaking so the faithful person confesses that Yahweh is his refuge and makes the Most High his dwelling place.
  alternative_readings:
  - 'Preserve an abrupt shift of voice: “For you, Yahweh, are my refuge! You have made the Most High your dwelling place.”'
  - Treat “Yahweh—my refuge, the Most High” as the object of “you have made.”
  rationale: The Masoretic wording is syntactically compressed and has long produced several defensible construals. The chosen wording preserves every expressed participant, follows the dialogue of the psalm, and prevents English from implying that Yahweh made the Most High his own dwelling. The note keeps the source compression and principal alternative visible.
  doctrine_reference: PHILOSOPHY.md — source-image accuracy with contextual understanding in the companion layer
