id: PSA.91.9
reference: Psalms 91:9
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
translation:
  text: For you have said, “Yahweh is my refuge,” and have made the Most High your dwelling place[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "The Masoretic Hebrew is compressed: literally, 'For you, Yahweh, my refuge; the Most High you have made your dwelling place.' The main text supplies an elliptical verb of speaking, also reflected in ancient interpretation and in a proposed reconstruction of the Qumran witness 11Q11. Or preserve the abrupt change of voice: 'For you, Yahweh, are my refuge! You have made the Most High your dwelling place.'"
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - For
  - Because
  lexicon: HALOT
  rationale: Introduces the ground for the promised protection and the faithful person's confession. 'For' carries that explanatory force naturally while allowing the supplied speech clause to stand clearly.
- source_word: אַתָּה
  chosen: you
  lexicon: HALOT
  rationale: Second masculine singular pronoun, retained explicitly for emphasis in the Hebrew clause.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: מַחְסִי
  chosen: my refuge
  alternatives:
  - my shelter
  lexicon: HALOT
  rationale: מַחְסֶה denotes a place of refuge or shelter. 'Refuge' is the more established and precise term in Psalmic protection language.
- source_word: עֶלְיוֹן
  chosen: the Most High
  alternatives:
  - Most High
  lexicon: HALOT
  rationale: A divine title meaning 'Most High.' The article in English makes the title read naturally and clearly as a designation for God.
- source_word: שַׂמְתָּ
  chosen: you have made
  alternatives:
  - you have set
  - you have placed
  lexicon: HALOT
  rationale: Qal perfect 2ms of שׂים, here meaning to make or set something as something. 'You have made' is idiomatic with the complement 'your dwelling place.'
- source_word: מְעוֹנֶךָ
  chosen: your dwelling place
  alternatives:
  - your habitation
  - your refuge
  lexicon: HALOT
  rationale: מָעוֹן refers to a dwelling or habitation. 'Dwelling place' is clear modern English and distinguishes it from מַחְסֶה ('refuge') earlier in the verse.
