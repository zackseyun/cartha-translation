id: PSA.14.6
reference: Psalms 14:6
source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
translation:
  text: You put the counsel of the poor to shame, but Yahweh is his refuge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the counsel of the afflicted' or 'the poor man's plan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  chosen: the counsel of
  alternatives:
  - the plan of
  - the advice of
  - the purpose of
  lexicon: HALOT
  rationale: Construct form of עֵצָה, denoting counsel, plan, or advice. 'Counsel' preserves the broad sense without over-specifying either internal intention ('plan') or spoken advice alone.
- source_word: עָנִי
  chosen: the poor
  alternatives:
  - the afflicted
  - the needy
  - the humble
  lexicon: HALOT
  rationale: עָנִי commonly denotes one who is poor, afflicted, or oppressed. In this psalm's social and moral context, 'the poor' is concise and natural English while still allowing the broader vulnerability implied by the Hebrew.
- source_word: תָבִישׁוּ
  chosen: You put ... to shame
  alternatives:
  - you put to shame
  - you mock
  - you disgrace
  - You shame
  lexicon: HALOT
  rationale: The Hiphil means to put something or someone to shame. English needs the full idiom with the abstract object 'counsel.'
- source_word: כִּי
  chosen: but
  alternatives:
  - for
  - since
  - because
  lexicon: HALOT
  rationale: Here the particle introduces the contrast between the attackers' attempt to shame the poor person's counsel and Yahweh's protection.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: מַחְסֵהוּ
  chosen: his refuge
  alternatives:
  - his shelter
  - his place of refuge
  lexicon: HALOT
  rationale: מַחְסֶה means refuge or shelter, with 3ms suffix. 'His refuge' is the most natural and established rendering, preserving the metaphor of protective safety.
