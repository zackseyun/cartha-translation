  from: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
  to: For I said, “May they not rejoice over me; when my foot slips, they boast against me.”
  rationale: The current “Otherwise” invents a conditional relation not supplied by פֶּן. The particle expresses the feared or guarded-against result, well represented by “May they not.” The second clause is retained as an assertion concerning their arrogant response when he slips, rather than extending the negative across it without clear syntactic necessity.
