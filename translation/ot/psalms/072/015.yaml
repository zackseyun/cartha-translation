  category: grammar
  tier: 1
  from: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
  to: May he live, and may he give him some of the gold of Sheba. May he pray for him continually; all day long may he bless him.[a]
  rationale: 'The Hebrew deliberately employs active third-person masculine singular forms: וְיִתֶּן, וְיִתְפַּלֵּל, and יְבָרֲכֶנְהוּ. The passive renderings and especially the supplied plural “they” obscure that grammar. Retaining the singular pronouns preserves the text’s unresolved referents rather than silently selecting agents. “Some of the gold of Sheba” appropriately represents the partitive/source force of מִן in this tribute context.'
