  review_summary: The preceding verb is past, but אֲמִילַם is an imperfect in the recurring declaration of verses 10–12 and should not be rendered as completed past action. כִּי gives emphatic or asseverative force here, naturally represented by “surely.” Removing the comma after “Yahweh” improves the clause without changing meaning.
