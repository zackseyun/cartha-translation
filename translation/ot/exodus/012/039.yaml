id: EXO.12.39
reference: Exodus 12:39
source:
  edition: WLC
  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ
    מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
translation:
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they
    had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: וַיֹּאפוּ
  chosen: They baked
  alternatives:
  - And they baked
  lexicon: HALOT
  rationale: The narrative verb is naturally represented without a sentence-initial conjunction in the standalone verse.
- source_word: הַבָּצֵק
  chosen: the dough
  alternatives:
  - the kneaded dough
  lexicon: HALOT
  rationale: בצק denotes dough. 'The dough' is clear modern English and fits the narrative sequence.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  chosen: they had brought out of Egypt
  alternatives:
  - that they had brought out from Egypt
  lexicon: HALOT
  rationale: The relative clause identifies the dough. English omits a redundant relative pronoun after the direct
    object and uses idiomatic 'out of Egypt.'
- source_word: עֻגֹת מַצּוֹת
  chosen: into unleavened cakes
  alternatives:
  - as cakes of unleavened bread
  - into flat cakes without yeast
  lexicon: HALOT
  rationale: עֻגֹת are cakes/round loaves, and מַצּוֹת specifies that they were unleavened. 'Unleavened cakes' is
    concise and faithful; 'cakes' here refers to bread-cakes, not dessert.
- source_word: כִּי לֹא חָמֵץ
  chosen: since it had not become leavened
  alternatives:
  - because it was not leavened
  - because it had not risen
  lexicon: HALOT
  rationale: The verb describes the dough entering a leavened state. 'Had not become leavened' preserves that verbal
    force.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  chosen: they had been driven out of Egypt
  alternatives:
  - they had been expelled from Egypt
  lexicon: HALOT
  rationale: The passive verb expresses forcible expulsion. English uses idiomatic 'out of Egypt.'
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  chosen: and could not delay
  alternatives:
  - and could not linger
  - and could not tarry
  lexicon: HALOT
  rationale: התמהמה means to delay or linger. 'Could not delay' is contemporary and captures the sense of having no time
    to wait.
- source_word: וְגַם
  chosen: and
  alternatives:
  - nor
  - and ... either
  lexicon: HALOT
  rationale: 'The additive conjunction introduces the additional circumstance that they had not prepared provisions; ordinary
    coordination is clear after the preceding negative.'
- source_word: צֵדָה
  chosen: provisions
  alternatives:
  - food for the journey
  - supplies
  lexicon: HALOT
  rationale: צדה refers to provisions or travel supplies. 'Provisions' is concise and suitably broad, covering food
    prepared for departure.
- source_word: לָהֶם
  chosen: for themselves
  alternatives:
  - for their journey
  - for themselves to take
  lexicon: HALOT
  rationale: The pronoun indicates the provisions were prepared for their own use. 'For themselves' is the most direct
    rendering.
