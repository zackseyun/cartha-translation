id: EXO.12.40
reference: Exodus 12:40
source:
  edition: WLC
  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
translation:
  text: The dwelling of the sons of Israel, who lived in Egypt[a], was four hundred thirty years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 4QExodc (4Q14), the partly preserved name Egypt is followed directly by the duration, without the Septuagint's following reference to Canaan; the missing beginning cannot establish the wording of the whole clause. In 2QExoda (2Q2), the geographical phrase is reconstructed in a gap. The Samaritan Pentateuch reads, 'the dwelling of the sons of Israel and their fathers, which they lived in the land of Canaan and in the land of Egypt, was four hundred thirty years.' The Septuagint reads, 'the dwelling of the sons of Israel, which they lived in the land of Egypt and in the land of Canaan, was four hundred thirty years.'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  chosen: dwelling
  alternatives:
  - sojourning
  - time of residence
  - settlement
  lexicon: HALOT
  rationale: "מוֹשַׁב denotes dwelling/residence or place/time of dwelling. Here it refers not merely to a location but to the period/state of residence, so 'dwelling' preserves the noun while remaining natural in English. Cleanup note: the reader-facing rendering no longer begins with 'Now' because this source expression does not contain an explicit temporal 'now'; any connective force is carried by the surrounding English clause or context."
- source_word: בְּנֵי יִשְׂרָאֵל
  chosen: the sons of Israel
  alternatives:
  - the children of Israel
  - the Israelites
  lexicon: HALOT
  rationale: Formally, the Hebrew is 'sons of Israel.' This keeps the traditional covenantal expression and follows the gender-accurate principle. 'Israelites' is smoother but less transparent to the source wording.
- source_word: אֲשֶׁר יָשְׁבוּ
  chosen: who lived
  alternatives:
  - during which they lived
  - which they dwelt
  - who sojourned
  lexicon: HALOT
  rationale: The relative clause modifies 'dwelling/residence' and explains its duration. English requires some restructuring for clarity. 'Lived' is a natural rendering of ישׁב in this context.
- source_word: בְּמִצְרַיִם
  chosen: in Egypt
  lexicon: HALOT
  rationale: Straightforward locative use of the preposition ב with the place name Egypt.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  chosen: four hundred thirty years
  alternatives:
  - thirty years and four hundred years
  lexicon: HALOT
  rationale: English idiom reverses the Hebrew order of the compound number. 'Four hundred thirty years' is the natural equivalent and preserves the stated duration.
