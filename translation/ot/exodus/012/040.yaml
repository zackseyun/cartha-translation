theological_decisions:
- issue: Scope of the 430 years in relation to Egypt alone or to a broader patriarchal sojourn
  chosen_reading: 'Main text follows the Masoretic wording as given: the residence of the sons of Israel in Egypt was 430 years.'
  alternative_readings:
  - Some ancient witnesses (notably the Samaritan Pentateuch and Septuagint) read 'in Egypt and in Canaan,' broadening the period beyond Egypt alone.
  rationale: The Hebrew source provided is the Masoretic Text and explicitly says 'in Egypt.' In 2Q2, the geography is entirely reconstructed and cannot supply a preserved reading. 4Q14 supports Egypt directly followed by the duration, excluding Canaan after Egypt at that location but not a longer form in the missing beginning. The distinct Samaritan and Greek forms remain in a footnote; these fragments do not establish the full Masoretic geographical scope or the absence of 'their fathers.'
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
