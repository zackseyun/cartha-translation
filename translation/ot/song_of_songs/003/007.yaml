  from: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
  to: Look, it is Solomon’s couch[a]; sixty warriors from among Israel’s mighty men surround it.
  rationale: The current final clause is stiff and duplicates “mighty men” awkwardly. The revision should retain the partitive force of מִן, however; bare “warriors of Israel” can lose the sense that the sixty are selected from among them. “Warriors” is apt in this immediately martial context, and the couch note belongs after “couch.”
