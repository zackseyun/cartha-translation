  from: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
  to: The fig tree has formed its early figs[a], and the vines in blossom[b] give off fragrance. Arise, my love, my beautiful one, and come away[c].
  rationale: With פַגֶּיהָ, “has ripened” risks suggesting mature fruit, whereas the Hebrew image concerns figs at an early developmental stage. “Has formed its early figs” preserves that stage without overstatement. The revised marker placement is also correct.
