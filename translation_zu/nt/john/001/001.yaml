base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: zu
  text: Ekuqaleni[a] wayekhona uLizwi, uLizwi wayekuNkulunkulu, futhi uLizwi wayenguNkulunkulu.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Le nkulumo inananela uGenesise 1:1, ixhumanisa uLizwi nokuqala kwendalo.
    reason: cross_reference
  - marker: b
    text: Kungachazwa nangokuthi, “uLizwi wayenobunjalo bukaNkulunkulu,” noma, “lokho uNkulunkulu ayeyikho, uLizwi wayeyikho.” Ukuhleleka kwesiGreki lapha kugcizelela ubunjalo bukaLizwi njengobukaNkulunkulu, ngesikhathi kumhlukanisa noNkulunkulu okukhulunywe ngaye esigabeni esandulele.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Ekuqaleni
  rationale: Le nkulumo iyindlela yemvelo yesiZulu yokusho ukuthi “ekuqaleni,” futhi igcina ukunanela kukaGenesise 1:1.
- source_word: ἦν
  choice: wayekhona / wayeno- / wayengu-
  rationale: Isenzo esingaphelele esithi ἦν siphindaphindwa kathathu. IsiZulu sidinga ukusihlanganisa nezakhi ezihambisana nomusho ngamunye; “wayekhona” siveza ukuba khona, kanti “wayenoNkulunkulu” nokuthi “wayenguNkulunkulu” kulondoloza ukugeleza nencazelo yezigaba ezilandelayo.
- source_word: ὁ λόγος
  choice: uLizwi
  rationale: “ULizwi” ligcina umqondo wezwi elikhulumayo nelambulayo, ngesikhathi lisebenza njengesiqu somuntu kulo mongo. Liyigama lesiZulu elinesithunzi, eliqondakalayo, futhi alinciphisi uλόγος ube “umyalezo” nje kuphela.
- source_word: πρὸς τὸν θεόν
  choice: wayenoNkulunkulu
  rationale: Lapha πρός iveza ukuba ndawonye nobudlelwano obuqondene nomuntu. “WayenoNkulunkulu” kuyisiZulu semvelo esisho ukuthi uLizwi wayekanye noNkulunkulu, kuyilapho kugcinwa umehluko phakathi kukaLizwi noNkulunkulu okukhulunywa ngaye.
- source_word: τὸν θεόν
  choice: uNkulunkulu
  rationale: Isibizo esinesiqiniseko sibhekisela kuNkulunkulu ngokuqondile; isiZulu sisebenzisa “uNkulunkulu” ngaphandle kwesidingo sokwengeza elinye igama lokuqinisekisa.
- source_word: θεὸς ἦν ὁ λόγος
  choice: uLizwi wayenguNkulunkulu
  rationale: Lokhu kugcina amandla esisho sesiGreki sokuthi ubunjalo bukaLizwi bungobukaNkulunkulu. Akuguqulwa kube “wayengowaphezulu,” okungase kunciphise incazelo, futhi ukuhleleka kwesiZulu kwenza kucace ukuthi uLizwi uyisihloko somusho.
theological_decisions:
- issue: Ukuhumusha uθεός ongenaso isiqalo esichazayo esigabeni sokugcina
  choice: uLizwi wayenguNkulunkulu
  alternative: uLizwi wayengowaphezulu; lokho uNkulunkulu ayeyikho, uLizwi wayeyikho
  rationale: Uθεός ubekwe ngaphambi kwesenzo futhi ugcizelela ubunjalo bukaLizwi, ngaphandle kokwenza uLizwi abe ngumuntu ofanayo noNkulunkulu okukhulunywe ngaye esigabeni esandulele. Umbhalo oyinhloko ugcina isisho esiqondile nesinamandla; ezinye izindlela zibekwa embhalweni waphansi ukuze kuvezwe lolo hlobo lwencazelo ngaphandle kokuluxazulula ngokweqile.
translation_notes:
  register: Kusetshenziswe isiZulu sanamuhla, esihloniphekile nesifundeka kalula. “ULizwi” ligcinwe njengesiqu esibalulekile, kanti “wayenoNkulunkulu” kukhethwe ngenxa yokwemvelo kwaso ekuboniseni ukuba ndawonye nobudlelwano. Izimpawu zemibhalo yaphansi zibekwe ngqo ezindaweni ezizichazayo.
