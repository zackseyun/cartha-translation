id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: zu
  name: Zulu
  native_name: isiZulu
  variant: Standard isiZulu
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: zu
  text: Umhwamuko wemihwamuko[a], kusho uQohelethi[b]; umhwamuko wemihwamuko, konke kungumhwamuko nje.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'NgesiHebheru, הֶבֶל (hevel) lisho ngokoqobo umoya ophefumulwayo noma umhwamuko. Kule ncwadi lisetshenziswa izikhathi ezingama-38, futhi ngokomfanekiso lingathwala izincazelo ezintathu ezihambisanayo ngesikhathi esisodwa: into edlula masinyane, engabambeki, kanye nokuphambana phakathi kwalokho obekulindelwe nalokho okwenzekayo. Akukho gama elilodwa lesiZulu eliyithwala ngokuphelele yonke le mibono. Lapha kugcinwe isithombe esithi “umhwamuko.” Isakhi esithi “umhwamuko wemihwamuko” siyindlela yesiHebheru yokugcizelela izinga eliphakeme kakhulu, njengokuthi “iNgoma yezingoma.”'
    reason: Clarifies the semantic explanation in natural isiZulu and restores the audit-trail's specific count of 38 occurrences.
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: umhwamuko
  rationale: Igama lesiHebheru libhekisela ngokoqobo entweni efana nomoya ophumayo noma umhwamuko, bese lisetshenziswa njengesifaniso sento edlulayo, engabambeki, nengaphumeleli ngendlela ebilindelwe. Elithi “umhwamuko” ligcina lesi sithombe esibonakalayo ngesiZulu futhi ligwema elithi “umoya,” elingase liqondwe ngokuyinhloko njengomoya ongabonakali noma uMoya ngokwenkolo.
- source_word: הֲבֵל הֲבָלִים
  choice: umhwamuko wemihwamuko
  rationale: Isakhi sesiHebheru esithi “X ka-X abaningi” siveza izinga eliphakeme kakhulu. Ukuthi “umhwamuko wemihwamuko” kugcina kokubili ukwakheka okugcizelelayo nesithombe somthombo, njengasezakhiweni ezithi “iNgoma yezingoma.”
- source_word: אָמַר
  choice: kusho
  rationale: Nakuba isenzo sisesimweni esivame ukubhekisela kokwedlule, lapha siyifomula yenkulumo yemibhalo; inkathi yamanje ethi “kusho” izwakala ngokwemvelo futhi igcina amazwi ephila.
- source_word: קֹהֶלֶת
  choice: uQohelethi
  rationale: Igama lihunyushwe ngokuloba umsindo wesiHebheru kunokulikhiphela encazelweni eyodwa efana nokuthi “uMfundisi” noma “uMshumayeli,” ngoba lezo zindlela zinciphisa ububanzi besiqu sesiHebheru.
- source_word: הַכֹּל
  choice: konke
  rationale: Elithi “konke” lidlulisela amandla abanzi nahlanganisa konke omusho wesiHebheru.
- source_word: הָבֶל
  choice: kungumhwamuko nje
  rationale: Esilandisweni sokugcina, u-“nje” uletha umuzwa wokwehlisa ukubaluleka nokudumaza okulindelwe, ukuze umusho uzwakale njengesahlulelo sokuhlola, hhayi njengencazelo yokuthi zonke izinto zenziwe ngomhwamuko.
theological_decisions:
- issue: Ukuhumusha umfanekiso oyinhloko othi הֶבֶל
  choice: Kugcinwe isithombe esiqondile ngomqondo othi “umhwamuko,” kuthi esilandisweni sokugcina kwengezwe u-“nje.”
  alternative: ize; ubuze; ukungabi nanjongo; umoya
  rationale: Amagama angaqondakali ngesithombe, njengokuthi “ize” noma “ukungabi nanjongo,” akhetha uhlangothi olulodwa kuphela futhi angafaka umqondo wokuthi ukuphila akunancazelo nhlobo. “Umhwamuko” uvumela imiqondo yokudlula masinyane, ukungabambeki, nokuphambana phakathi kokulindelwe nokwenzekayo ukuba ihlale ihlangene. “Umoya” wona ungafaka incazelo engahlosiwe ephathelene nomoya noma uMoya.
- issue: Isiqu esithi קֹהֶלֶת
  choice: Silotshwe ngokomsindo ngokuthi “uQohelethi.”
  alternative: uMfundisi; uMshumayeli; uMbuthisi
  rationale: Incazelo eqondile yomsebenzi noma yesiqu ayiqinisekile. Ukuloba ngokomsindo kugcina lokhu kuvuleka ngaphandle kokunquma kusengaphambili ukuthi umlobi ungumfundisi, umshumayeli, noma umhlanganisi.
translation_notes:
  register: Kusetshenziswe isiZulu esijwayelekile, esinesizotha kodwa esiqondakala kalula. Ukuphindaphinda nokwakheka komusho kugcinwe ngenxa yamandla enkondlo yesiHebheru. “Umhwamuko” ukhethwe esikhundleni sika-“umoya” ukuze kugwenywe ukudideka nomoya noma uMoya ngokwenkolo; u-“nje” esigabeni sokugcina wenza isahlulelo sokwehlisa okulindelwe sizwakale ngokwemvelo ngesiZulu.
