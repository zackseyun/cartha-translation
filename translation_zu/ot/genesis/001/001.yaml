  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: zu
  text: Ekuqaleni, lapho uNkulunkulu edala amazulu nomhlaba[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Ngokwesiko lokhu kuhunyushwa njengomusho ophelele: “Ekuqaleni uNkulunkulu wadala amazulu nomhlaba.” IsiHebheru singabuye sifundwe njengomushwana wesikhathi othembele komunye umusho: igama elithi בְּרֵאשִׁית alinasiqalo esichazayo futhi lilandelwa isenzo esiphelele esithi בָּרָא. Lokhu kufana nokuvuleka kukaGenesise 2:4b. Kulesi sifundo, umusho oyinhloko ufika evesini 3: “UNkulunkulu wathi, ‘Makube khona ukukhanya.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Ekuqaleni, lapho … edala
  rationale: Igama elithi רֵאשִׁית ligcina umqondo ‘wokuqala’, kanti u־בְּרֵאשִׁית ongenaso isiqondisi sobunye ulandelwa yisenzo esiphelele; lokhu kungafundeka ngokwemvelo njengesigatshana sesikhathi esiholela emushweni oyinhloko. Ukuhlanganisa ‘Ekuqaleni’ no ‘lapho’ kugcina kokubili umqondo wegama nomsebenzi wesigatshana.
- source_word: בָּרָא
  choice: edala
  rationale: Ukudala yigama lesiZulu eliqondile nelivamile lesenzo saphezulu u־בָּרָא. Isimo esithi ‘edala’ sivumelana nesigatshana sesikhathi esiqhubekela phambili, ngaphandle kokuchaza indlela indalo eyenzeka ngayo.
- source_word: אֱלֹהִים
  choice: uNkulunkulu
  rationale: Nakuba leli gama linesimo sobuningi ngesiHebheru, lapha lihambisana nesenzo sobunye, ngakho libhekisela kuNkulunkulu oyedwa.
- source_word: אֵת
  choice: akuhunyushiwe ngokuqondile
  rationale: U־אֵת umaka umenziwa oqondile ocacisiwe ngesiHebheru; isiZulu asidingi igama elihlukile lokuwumela.
- source_word: הַשָּׁמַיִם
  choice: amazulu
  rationale: ‘Amazulu’ ligcina isimo sobuningi sesiHebheru futhi, lihlangene ‘nomhlaba’, liveza ingqikithi yakho konke okudaliweyo.
- source_word: הָאָרֶץ
  choice: umhlaba
  rationale: Nakuba u־אֶרֶץ engasho futhi ‘izwe’, ekuhlanganisweni ‘kwamazulu nomhlaba’ usho umhlaba njengengxenye yendalo yonke.
theological_decisions:
- issue: Ukwakheka komusho wokuqala
  choice: 'Isigatshana sesikhathi esincikile: “Ekuqaleni, lapho uNkulunkulu edala amazulu nomhlaba—”'
  alternative: 'Umusho ophelele ozimele: “Ekuqaleni uNkulunkulu wadala amazulu nomhlaba.”'
  rationale: Ukungabi nasiqondisi kobunye ku־בְּרֵאשִׁית, ukulandelwa kwalo yisenzo esiphelele u־בָּרָא, kanye nokufana nendlela evula ngayo uGenesise 2:4b noHoseya 1:2 kusekela ukufundwa kwesigatshana sesikhathi. Nokho, ukufundwa njengomusho ozimele kunomlando omude; ngakho kugcinwe embhalweni waphansi kunokuba kuqedwe ukungaqiniseki kombhalo.
translation_notes:
  register: Kusetshenziswe isiZulu esijwayelekile, sanamuhla nesinesizotha. ‘Amazulu nomhlaba’ kuyinkulumo yemvelo egcina isimo somthombo nomqondo wokuphelela kwendalo. Udwi omude ubonisa ukuthi isigatshana siyaqhubeka siye emushweni oyinhloko olandelayo.
