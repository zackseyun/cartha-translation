id: JUD.1.17
reference: Jude 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin, olùfẹ́, ẹ rántí àwọn ọ̀rọ̀ tí àwọn àpọ́sítélì Olúwa wa, Jésù Mèsáyà,[a] ti sọ tẹ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.”'
    reason: Àṣàyàn ọ̀rọ̀ ìbílẹ̀ fún Χριστός ni “Kristi,” nígbà tí “Mèsáyà” mú ìtumọ̀ oyè náà hàn.
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ tí δέ fi hàn jáde, “ẹ̀yin” sì pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ náà mọ́, ní ìyàtọ̀ sí àwọn ẹni tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn.
- source_word: ἀγαπητοί
  choice: olùfẹ́
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ ni; “olùfẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì, tó sì pa ìfẹ́ inú ọ̀rọ̀ náà mọ́.
- source_word: μνήσθητε
  choice: ẹ rántí
  rationale: Ó túmọ̀ sí àṣẹ fún ọ̀pọ̀ ènìyàn láti pe ẹ̀kọ́ tí wọ́n ti gbọ́ padà sí ọkàn; “ẹ rántí” ṣe èyí ní kedere àti ní ti ẹ̀dá.
- source_word: τῶν ῥημάτων
  choice: àwọn ọ̀rọ̀
  rationale: Nínú àyíká yìí, ῥήματα tọ́ka sí àwọn ohun tí a sọ; “àwọn ọ̀rọ̀” jẹ́ ìtumọ̀ tààrà tó sì wọ́pọ̀.
- source_word: τῶν προειρημένων
  choice: tí ... ti sọ tẹ́lẹ̀
  rationale: Ó pa ìtumọ̀ pé a ti sọ àwọn ọ̀rọ̀ náà ṣáájú mọ́ láì fi dandan sọ pé àsọtẹ́lẹ̀ ni.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: tí àwọn àpọ́sítélì ... ti sọ
  rationale: Ìṣètò gbólóhùn yìí fi àwọn àpọ́sítélì hàn gẹ́gẹ́ bí àwọn tó sọ ọ̀rọ̀ náà, ó sì bá ìlò Yorùbá mu.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tó fìdí múlẹ̀ fún κύριος, “wa” sì pa ìbáṣepọ̀ tó wà nínú τοῦ ... ἡμῶν mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” jẹ́ orúkọ, “Mèsáyà” sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró náà, dípò kí a mú un bí orúkọ ìdílé.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró. “Mèsáyà” mú ìtumọ̀ oyè náà hàn kedere; a fi “Kristi” sínú àlàyé ìsàlẹ̀ fún àwọn òǹkàwé tó mọ ọ̀nà ìbílẹ̀ yẹn dáadáa.
translation_notes:
  register: Yorùbá àṣàjọ, tó ní àmì ohùn níbi tó yẹ. Ìpè “olùfẹ́” ní ọ̀wọ̀ àti ìfẹ́, gbólóhùn náà sì jẹ́ kedere fún òǹkàwé òde òní láì sọ ọ̀rọ̀ náà di ti ẹ̀ya ìjọ kan.
