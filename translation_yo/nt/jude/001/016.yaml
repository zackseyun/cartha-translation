  to: Àwọn wọ̀nyí ni àwọn tó ń kùn, tí kò ní ìtẹ́lọ́rùn pẹ̀lú ipò wọn, tí ń tẹ̀lé ìfẹ́kúfẹ̀ẹ́ tiwọn[a]; ẹnu wọn sì ń sọ ọ̀rọ̀ ìgbéraga[b], wọ́n sì ń ṣe ojúsàájú sí àwọn ènìyàn nítorí àǹfààní[c].
