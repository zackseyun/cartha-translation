id: JUD.1.16
reference: Jude 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: yo
  text: Àwọn wọ̀nyí ni àwọn tó ń kùn, tí kò ní ìtẹ́lọ́rùn pẹ̀lú ipò wọn, tí ń tẹ̀lé ìfẹ́kúfẹ̀ẹ́ tiwọn[a]; ẹnu wọn sì ń sọ ọ̀rọ̀ ìgbéraga[b], wọ́n sì ń ṣe ojúsàájú sí àwọn ènìyàn nítorí àǹfààní[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń gbé ìgbésí ayé gẹ́gẹ́ bí ohun tí ara wọn ń fẹ́.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹnu wọn ń sọ àwọn ọ̀rọ̀ ńláńlá.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “wọ́n ń ṣe àgbàyanu sí ojú àwọn ènìyàn”—àkànlò fún fífi ojú rere àrà ọ̀tọ̀ hàn sí àwọn kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: àwọn tó ń kùn
  rationale: Ó tọ́ka sí àwọn tí ìkùn tàbí ẹ̀dùn wọn máa ń hàn nínú ọ̀rọ̀ wọn. Àkànlò yìí jẹ́ ti Yorùbá òde òní, ó sì fi ìwà tí ń bá wọn lọ hàn.
- source_word: μεμψίμοιροι
  choice: àwọn tó ń ráhùn nípa ipò wọn
  rationale: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí túmọ̀ sí àwọn tí kò tẹ́lọ́rùn sí ìpín tàbí ipò wọn, tí wọ́n sì ń ráhùn nípa rẹ̀. Ìtumọ̀ yìí jẹ́ kí ó yà díẹ̀ sí γογγυσταί.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: wọ́n ń gbé ìgbésí ayé gẹ́gẹ́ bí àwọn ohun tí ara wọn ń fẹ́
  rationale: πορευόμενοι níbí jẹ́ àkàwé fún ìwà ìgbésí ayé. Gbólóhùn yìí jẹ́ àfihàn tó ṣe kedere, ó sì pa ìtumọ̀ ἐπιθυμίαι mọ́ ní fífẹ̀ láì fi mọ́ ìfẹ́kúfẹ̀ẹ́ ti ìbálòpọ̀ nìkan.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: ẹnu wọn ń sọ àwọn ọ̀rọ̀ ìgbéraga
  rationale: A pa ‘ẹnu wọn’ mọ́ gẹ́gẹ́ bí àkànlò orísun. ὑπέρογκα ń ṣàpèjúwe ọ̀rọ̀ tó kún fún ìgbéraga, tó ń gbé ẹni tó ń sọ ọ́ ga ju bó ṣe yẹ lọ.
- source_word: θαυμάζοντες πρόσωπα
  choice: wọ́n ń ṣe ojúsàájú sí àwọn ènìyàn
  rationale: Àkànlò Gíríìkì náà túmọ̀ sí fífi ojú rere àrà ọ̀tọ̀ hàn sí àwọn ènìyàn kan. ‘Ṣe ojúsàájú’ sọ ẹ̀sùn ìwà náà ní Yorùbá tó ṣe kedere.
- source_word: ὠφελείας χάριν
  choice: nítorí èrè
  rationale: 'Ó fi ìdí ìwà ojúsàájú náà hàn: wọ́n ń ṣe é kí wọ́n lè rí àǹfààní tàbí èrè fún ara wọn.'
theological_decisions:
- issue: Agbára ìwà búburú inú ἐπιθυμίαι
  choice: àwọn ohun tí ara wọn ń fẹ́ nínú àyọkà pàtàkì, kí àyíká ọ̀rọ̀ fi ìwà búburú rẹ̀ hàn
  alternative: ìfẹ́kúfẹ̀ẹ́ ara wọn
  rationale: ἐπιθυμίαι lè túmọ̀ sí àwọn ìfẹ́ tó lágbára ní gbogbogbò, bí ó tilẹ̀ jẹ́ pé nínú ìkìlọ̀ Juda ó ní agbára ìwà búburú. Ìtumọ̀ pàtàkì kò fi ọ̀rọ̀ náà mọ́ ìfẹ́kúfẹ̀ẹ́ ti ìbálòpọ̀ nìkan.
- issue: Ìtumọ̀ àkànlò θαυμάζοντες πρόσωπα
  choice: ṣe ojúsàájú sí àwọn ènìyàn
  alternative: yìn tàbí ṣe àgbàyanu sí ojú àwọn ènìyàn
  rationale: Kì í ṣe wíwo ojú tàbí yíyanilẹ́nu lasán ni àkànlò náà ń sọ, bí kò ṣe fífi ojú rere àrà ọ̀tọ̀ hàn sí àwọn kan nítorí àǹfààní. Ìtumọ̀ yìí mú ẹ̀sùn ìwà náà ṣe kedere láì fi èrò ẹ̀kọ́ ìjọ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú ọ̀rọ̀ tó bójú mu, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. A ṣí gbólóhùn Gíríìkì gígùn náà sí méjì fún ìṣàn ọ̀rọ̀ Yorùbá tó dára, ṣùgbọ́n a pa ìtẹ̀síwájú àwọn ẹ̀sùn náà mọ́.
