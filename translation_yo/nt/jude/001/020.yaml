id: JUD.1.20
reference: Jude 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin olùfẹ́, ẹ máa gbé ara yín ró lórí ìgbàgbọ́ yín mímọ́ jùlọ[a], kí ẹ sì máa gbàdúrà nínú Ẹ̀mí Mímọ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìgbàgbọ́ yín mímọ́ jùlọ.” Ìṣètò ọ̀rọ̀ Gíríìkì lè túmọ̀ sí kíkọ́ ohun kan sórí ìpìlẹ̀, tàbí gbígbé ara ẹni ró ní ìbáṣepọ̀ pẹ̀lú rẹ̀. “Ìgbàgbọ́” tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé” tàbí “ìdúróṣinṣin,” bí ó tilẹ̀ jẹ́ pé níbí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbàgbọ́ Kristẹni tí àwùjọ náà jọ ní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ Ẹ̀mí Mímọ́.” Gbólóhùn náà lè tẹnumọ́ àyíká tàbí ipa tí a ti ń gbàdúrà (“nínú”), tàbí pé Ẹ̀mí Mímọ́ ni ó ń fún wọn lágbára láti gbàdúrà (“nípasẹ̀”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí àwọn aláìwà-bí-Ọlọ́run tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ wọn hàn, “ẹ̀yin” sì pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ἀγαπητοί
  choice: olùfẹ́
  rationale: Ọ̀rọ̀ ìpè yìí ní ìfẹ́ àti ọlá nínú rẹ̀; “olùfẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó bá ìforúkọsílẹ̀ mímọ́ mu, tí ó sì lè tọ́ka sí gbogbo àwùjọ.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: ẹ máa gbé ara yín ró
  rationale: Ó pa àwòrán fífi ohun kan ró mọ́, ó sì fi hàn pé gbogbo àwùjọ ni ó ń fún ara rẹ̀ lókun; “ara yín” pa agbára arọ́pò-orúkọ afẹ̀yìntì mọ́.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: lórí ìgbàgbọ́ yín tí ó jẹ́ mímọ́ jù lọ
  rationale: “Lórí” bá àwòrán ilé tí a ń kọ́ sórí ìpìlẹ̀ mu, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ “nínú/nípa ìbáṣepọ̀ pẹ̀lú” sílẹ̀. “Mímọ́ jù lọ” pa ìwọ̀n gíga superlative mọ́.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: Nínú Júdà, ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbàgbọ́ Kristẹni tí àwùjọ gbà tí wọ́n sì ń jẹ́wọ́; ọ̀rọ̀ náà ṣì lè ní ìtumọ̀ ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́, èyí tí àlàyé ìsàlẹ̀ mẹ́nu kàn.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: Ó tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run, “nínú” sì pa ἐν mọ́ láìfi dandan pinnu bóyá ibi/ipò tàbí agbára olùrànlọ́wọ́ ni a tẹnumọ́.
- source_word: προσευχόμενοι
  choice: kí ẹ sì máa gbàdúrà
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún participle ìyànjú, ó sì pa ìṣe tí ń bá a lọ àti ìṣàn gbolohun sí ẹsẹ tó tẹ̀ lé e mọ́.
theological_decisions:
- issue: Ohun tí “ἐν πνεύματι ἁγίῳ” ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ Ọlọ́run
  alternative: ẹ̀mí tàbí ìwà inú ènìyàn tí ó jẹ́ mímọ́
  rationale: Lílo ọ̀rọ̀ náà nínú àyíká ìkọ́ni Kristẹni àkọ́kọ́ àti nínú Júdà mú kí ìtọ́ka sí Ẹ̀mí Mímọ́ jẹ́ èyí tí ó ṣeé ṣe jù, láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ πίστις nínú “ìgbàgbọ́ yín tí ó jẹ́ mímọ́ jù lọ”
  choice: ìgbàgbọ́ Kristẹni tí àwùjọ gba tí wọ́n sì ń jẹ́wọ́
  alternative: ìṣe ìgbẹ́kẹ̀lé ti ara ẹni tàbí ìṣòtítọ́
  rationale: Lílo “ìgbàgbọ́” ní Júdà, pàápàá ní ìbáṣepọ̀ pẹ̀lú ìgbàgbọ́ tí a fi lé àwọn ènìyàn mímọ́ lọ́wọ́, ṣètìlẹ́yìn fún ìtumọ̀ àwùjọ yìí; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì bá ìforúkọsílẹ̀ Bíbélì òde òní mu. A lo “ẹ máa … / kí ẹ sì máa …” láti mú àwọn participle ìyànjú Gíríìkì jáde ní Yorùbá àdánidá, a sì fi àmì kọ́mà sí òpin nítorí pé èrò náà ń bá a lọ sí ẹsẹ 21.
