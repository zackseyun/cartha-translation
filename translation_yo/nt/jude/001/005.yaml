id: JUD.1.5
reference: Jude 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: yo
  text: Mo fẹ́ rán yín létí[a] pé, bí ó tilẹ̀ jẹ́ pé ẹ ti mọ gbogbo nǹkan wọ̀nyí lẹ́ẹ̀kan ṣoṣo, Jésù, lẹ́yìn tí ó gba àwọn ènìyàn kan là kúrò ní ilẹ̀ Íjíbítì, pa àwọn tí kò gbàgbọ́ run lẹ́yìn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ka “Olúwa” tàbí “Ọlọ́run” dípò “Jésù.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: rán yín létí
  rationale: Ó sọ ìtumọ̀ mímú ohun tí àwọn olùgbọ́ ti mọ̀ padà wá sí ìrántí wọn ní Yorùbá àdánidá.
- source_word: βούλομαι
  choice: Mo fẹ́
  rationale: Ó túmọ̀ ìfẹ́ tàbí ète ẹni àkọ́kọ́ ní ọ̀nà tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: bí ó tilẹ̀ jẹ́ pé ẹ ti mọ gbogbo nǹkan wọ̀nyí lẹ́ẹ̀kan ṣoṣo tán
  rationale: A mú participle náà gẹ́gẹ́ bí gbólóhùn ìyọ̀ǹda; ‘gbogbo nǹkan wọ̀nyí’ fi πάντα mọ àkóónú ìtàn ìgbàlà tí wọ́n jọ mọ̀, ‘lẹ́ẹ̀kan ṣoṣo tán’ sì pa agbára ἅπαξ mọ́.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èdè Gíríìkì tí a pèsè ka Ἰησοῦς; a túmọ̀ rẹ̀ tààrà láì dín ìtumọ̀ nípa ipa Jésù nínú ìjádelọ kù.
- source_word: λαὸν
  choice: àwọn ènìyàn kan
  rationale: Ọ̀rọ̀ náà kò ní article; yíyan yìí tọ́ka sí ẹgbẹ́ ènìyàn kan láì fi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: kúrò ní ilẹ̀ Íjíbítì
  rationale: Ó pa àwòrán ìjádelọ kúrò ní ilẹ̀ Íjíbítì mọ́ ní Yorùbá tó rọrùn.
- source_word: σώσας
  choice: lẹ́yìn tí ó gba ... là
  rationale: Ó fi hàn pé ìgbàlà ṣẹlẹ̀ ṣáájú ìparun, gẹ́gẹ́ bí aorist participle ṣe ń ṣiṣẹ́.
- source_word: τὸ δεύτερον
  choice: nígbà tó yá
  rationale: Ó sọ ìṣẹ̀lẹ̀ kejì tó tẹ̀ lé ìgbàlà ní Yorùbá àdánidá, láì fi agbára lé ‘ìgbà kejì’ lọ́nà líle.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: àwọn tí kò gbàgbọ́
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó sì ṣe kedere fún àìní ìgbàgbọ́ ẹgbẹ́ náà.
- source_word: ἀπώλεσεν
  choice: ó pa ... run
  rationale: Ó pa líle ìdájọ́ Ọlọ́run àti ìtumọ̀ ìparun ọ̀rọ̀ Gíríìkì náà mọ́.
theological_decisions:
- issue: Ẹni tó ṣe ìgbàlà nínú gbólóhùn ìjádelọ
  choice: Jésù nínú ọ̀rọ̀ pàtàkì
  alternative: Olúwa tàbí Ọlọ́run
  rationale: SBLGNT tí a fi fún wa ka Ἰησοῦς. Ìtumọ̀ náà pa ẹ̀rí Kristọ́lọ́jì tó lágbára mọ́, kò sì ṣe àtúnṣe rẹ̀ láti mú un rọrùn; àwọn ẹ̀dà mìíràn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo ‘ẹ/yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ὑμᾶς.
