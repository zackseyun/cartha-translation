  to: Mo fẹ́ rán yín létí[a] pé, bí ó tilẹ̀ jẹ́ pé ẹ ti mọ gbogbo nǹkan wọ̀nyí lẹ́ẹ̀kan ṣoṣo, Jésù, lẹ́yìn tí ó gba àwọn ènìyàn kan là kúrò ní ilẹ̀ Íjíbítì, pa àwọn tí kò gbàgbọ́ run lẹ́yìn náà.
