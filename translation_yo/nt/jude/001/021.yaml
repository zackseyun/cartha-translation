id: JUD.1.21
reference: Jude 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: yo
  text: Ẹ pa ara yín mọ́ nínú ìfẹ́ Ọlọ́run[a], ẹ sì máa dúró de àánú Olúwa wa Jésù Mèsáyà[b], sí ìyè àìnípẹ̀kun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nínú ìfẹ́ tí Ọlọ́run ní sí yín’ tàbí ‘nínú ìfẹ́ yín sí Ọlọ́run.’ Gíríìkì lè gba ìtumọ̀ méjèèjì.
    reason: alternative_reading
  - marker: b
    text: Gíríìkì ní ‘Jésù Kírísítì’; ‘Mèsáyà’ ni a lò níhìn-ín nítorí Χριστός jẹ́ àkọlé.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí ‘fún ìyè àìnípẹ̀kun’ tàbí ‘títí dé ìyè àìnípẹ̀kun.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Ẹ pa ara yín mọ́
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘ẹ má ṣe jẹ́ kí ara yín kúrò’ mọ́ láìfikún ọ̀nà tí wọn yóò gbà ṣe é.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: nínú ìfẹ́ Ọlọ́run
  rationale: Èyí tẹ̀ lé ìṣètò Gíríìkì, ó sì mọ̀ọ́mọ̀ fi àìdánilójú genitive náà sílẹ̀—ó lè tọ́ka sí ìfẹ́ Ọlọ́run sí wọn tàbí ìfẹ́ wọn sí Ọlọ́run.
- source_word: προσδεχόμενοι
  choice: ẹ sì máa dúró de
  rationale: Participle àsìkò ìsinsìnyí ń fi ìṣe tí ó ń bá àṣẹ náà lọ hàn. ‘Máa dúró de’ sọ ìretí tí ń tẹ̀ síwájú ní Yorùbá àdánidá.
- source_word: ἔλεος
  choice: àánú
  rationale: ‘Àánú’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìtumọ̀ ìyọ́nú àti ojúrere tí a kò tọ́ sí mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó yẹ fún κύριος nínú àkọlé tí a fi fún Jésù níhìn-ín.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Jésù jẹ́ orúkọ, Mèsáyà sì mú iṣẹ́ Χριστός gẹ́gẹ́ bí àkọlé ẹni àmì òróró Ọlọ́run hàn dípò kí a kàn ṣe àdàkọ ‘Kírísítì.’
- source_word: εἰς ζωὴν αἰώνιον
  choice: sí ìyè àìnípẹ̀kun
  rationale: ‘Sí’ pa ìdarí sí ibi àfojúsùn tàbí àbájáde tí εἰς lè ní mọ́, láìfi dandan pinnu bóyá ìtumọ̀ rẹ̀ jẹ́ ‘fún’ tàbí ‘títí dé.’
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ἀγάπῃ θεοῦ
  choice: nínú ìfẹ́ Ọlọ́run
  alternative: nínú ìfẹ́ tí Ọlọ́run ní sí yín; nínú ìfẹ́ yín sí Ọlọ́run
  rationale: Orísun Gíríìkì kò fi dandan sọ ẹni tí ó ní ìfẹ́ sí ẹlòmíràn. Ìtumọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kírísítì
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí àkọlé ní ọ̀rọ̀ yìí; ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fi àmì òróró yàn hàn kedere láìgbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọlé.
- issue: Ìbáṣepọ̀ εἰς ζωὴν αἰώνιον pẹ̀lú àánú
  choice: sí ìyè àìnípẹ̀kun
  alternative: fún ìyè àìnípẹ̀kun; títí dé ìyè àìnípẹ̀kun
  rationale: εἰς lè ṣàpèjúwe àfojúsùn, àbájáde, tàbí ìdarí. ‘Sí’ sun mọ́ ìṣètò orísun, àkọ́silẹ̀ ìsàlẹ̀ sì fi àwọn ìtumọ̀ mìíràn hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ.’ ‘Ẹ sì máa dúró de’ mú ìṣe tí ń bá a lọ hàn, nígbà tí ‘sí ìyè àìnípẹ̀kun’ mọ̀ọ́mọ̀ pa ìwọ̀n àìdánilójú preposition Gíríìkì mọ́.
