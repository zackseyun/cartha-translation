id: JUD.1.13
reference: Jude 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: yo
  text: àwọn ìgbì òkun tí ń rú gùdù, tí ń fọ ìtìjú ara wọn jáde[a]; àwọn ìràwọ̀ alárìnkiri, àwọn tí a ti pamọ́ ìṣúdùdù òkùnkùn[b] sílẹ̀ fún wọn títí láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ń tú ohun ẹ̀gàn tiwọn jáde,” tàbí “tí ń tú àwọn ìṣe ìtìjú tiwọn jáde.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ó sì lè tọ́ka sí ẹ̀gàn fúnra rẹ̀ tàbí sí àwọn ìṣe ìtìjú tí ń tú wọn síta.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdúdú òkùnkùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: ìgbì òkun tí ń ru gùdù
  rationale: Ó pa àwòrán ìgbì òkun tí ó le, tí kò sì ṣeé kó níjàánu mọ́, ní èdè Yorùbá àdánidá.
- source_word: ἐπαφρίζοντα
  choice: tí ń tú ... jáde bí ìfófó
  rationale: Ìṣe tí ó ń bá a lọ ni participle náà ń fi hàn; ọ̀rọ̀ yìí sì so ìfófó ìgbì mọ́ ohun tí wọ́n ń tú jáde.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: ìtìjú ara wọn
  rationale: Ó pa ìtẹnumọ́ ἑαυτῶν mọ́. Bí ó tilẹ̀ jẹ́ pé αἰσχύνας jẹ́ ọ̀pọ̀ nínú Gíríìkì, ‘ìtìjú’ jẹ́ ọ̀rọ̀ àpapọ̀ tí ó dára jù lọ ní Yorùbá; àlàyé ìsàlẹ̀ ṣí àìdánilójú rẹ̀ sílẹ̀.
- source_word: ἀστέρες πλανῆται
  choice: àwọn ìràwọ̀ alárìnkiri
  rationale: Ó pa àkàwé ara ọ̀run tí ń rìn kiri mọ́ láìfi ìtumọ̀ ìmọ̀ ìjìnlẹ̀ òde òní ti ‘planet’ wọ inú ẹsẹ náà.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: ìṣúdùdù òkùnkùn
  rationale: ‘Ìṣúdùdù’ ń fi òkùnkùn tí ó nípọn, tí ó sì bani lẹ́rù hàn, ó sì pa agbára àsọyé onípele méjì nínú Gíríìkì mọ́.
- source_word: εἰς αἰῶνα
  choice: títí láéláé
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, gbólóhùn náà ń tọ́ka sí iye àkókò tí kò ní òpin; ‘títí láéláé’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere.
- source_word: τετήρηται
  choice: a ti fi ... pamọ́ de
  rationale: Ó fi perfect passive hàn gẹ́gẹ́ bí ohun tí a ti yàn sílẹ̀, tí ó sì wà ní ìpamọ́ de àwọn ẹni náà.
theological_decisions:
- issue: Iye àkókò àti agbára àwòrán ìdájọ́ nínú εἰς αἰῶνα
  choice: títí láéláé
  alternative: fún ayérayé; títí dé ìgbà náà
  rationale: Nínú àyíká ìdájọ́ yìí, ‘títí láéláé’ ni ó bá ìtumọ̀ àdánidá mu jù, láìfi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Bóyá αἰσχύνας túmọ̀ sí ìtìjú tàbí àwọn ìṣe ìtìjú
  choice: ìtìjú ara wọn
  alternative: àwọn ìṣe ìtìjú tiwọn; ohun ẹ̀gàn tiwọn
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ẹ̀gàn fúnra rẹ̀ tàbí sí àwọn ìṣe tí ń mú ẹ̀gàn wá; a pa àìdánilójú náà mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘ru gùdù’ fún agbára ìgbì, ‘ìṣúdùdù òkùnkùn’ fún àwòrán ìdájọ́ tí ó jinlẹ̀, a sì fi gbogbo àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
