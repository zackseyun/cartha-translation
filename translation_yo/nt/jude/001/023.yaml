  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní pàtàkì: àwọn méjì ‘àwọn mìíràn,’ ìgbàlà nípa fífà wọn jáde nínú iná, àánú pẹ̀lú ìbẹ̀rù, àti ìkórìíra aṣọ tí ẹran ara ti sọ di ẹlẹ́gbin. Ṣùgbọ́n ‘nígbà tí ẹ ń kórìíra’ sọ alábápín μισοῦντες di gbolóhùn àkókò; ‘ní fífi … kórìíra’ dáa ju bẹ́ẹ̀ lọ fún ìṣe tí ó bá àánú lọ pẹ̀lú.'
  naturalness: ‘Fà wọ́n jáde’ jẹ́ èdè Yorùbá adayébá ju ‘fà wọ́n yọ’ lọ nínú àwòrán ìgbàlà kánjúkánjú. Àwọn àlàyé ẹsẹ̀ akọ́sọ́rọ̀ náà tún ní àwọn ọ̀rọ̀ tí kò rọrùn dáadáa, páápàá ‘ìbẹ̀rù ọlọ́wọ̀’ àti ‘dá … nídè’; a ti tún wọn ṣe sí Yorùbá títọ́, tó sì ṣe kedere.
  terminology: ‘Gba … là,’ ‘ṣàánú,’ ‘ìbẹ̀rù,’ ‘kórìíra,’ àti ‘ẹran ara’ bójú mu, wọ́n sì pa ìwúwo ìtumọ̀ àti àìdánilójú orísun mọ́. ‘Aṣọ àwọ̀tẹ́lẹ̀’ lè dúró fún χιτών gẹ́gẹ́ bí aṣọ tí a wọ̀ sábẹ́ aṣọ òde, láìdín un kù sí aṣọ abẹ́ òde òní.
