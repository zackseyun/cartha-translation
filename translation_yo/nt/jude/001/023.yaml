id: JUD.1.23
reference: Jude 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: yo
  text: Ẹ gba àwọn mìíràn là nípa fífà wọ́n jáde kúrò nínú iná[a]; ẹ sì ṣàánú àwọn mìíràn pẹ̀lú ìbẹ̀rù[b], ní fífi kódà aṣọ àwọ̀tẹ́lẹ̀ tí ẹran ara ti sọ di ẹlẹ́gbin kórìíra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ gba àwọn mìíràn là, ní fífà wọn jáde kúrò nínú iná.” Iná náà lè tọ́ka sí ìdájọ́ tó ń bọ̀ tàbí ewu ẹ̀mí tí ó le koko.
    reason: alternative_reading
  - marker: b
    text: “Pẹ̀lú ìbẹ̀rù” lè túmọ̀ sí ìbẹ̀rù ìbòwò níwájú Ọlọ́run, tàbí ìṣọ́ra kí ìbàjẹ́ má bà á kan ẹni tí ń ṣàánú náà pẹ̀lú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “aṣọ tí ìwà ẹlẹ́ṣẹ̀ ti sọ di ẹlẹ́gbin.” Ọ̀rọ̀ Gíríìkì náà ní “ẹran ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: ẹ gba … là
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ, “gba … là” sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìgbàlà tàbí gbígba ẹni kúrò nínú ewu, láìsọ pé ewu náà jẹ́ ti ara nìkan.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: nípa fífà wọ́n yọ kúrò nínú iná
  rationale: Ó fi ìṣe kánjúkánjú àti alágbára hàn, ó sì pa àwòrán lílágbára ti mímú ẹni jáde kúrò nínú iná mọ́.
- source_word: ἐλεᾶτε
  choice: ẹ ṣàánú
  rationale: “Ṣàánú” jẹ́ ọ̀rọ̀ Yorùbá adayébá fún fífi àánú hàn sí ẹlòmíràn, ó sì mú ipá àṣẹ inú ọ̀rọ̀ Gíríìkì dúró.
- source_word: ἐν φόβῳ
  choice: pẹ̀lú ìbẹ̀rù
  rationale: 'Ìtumọ̀ tààrà yìí pa àìdánilójú náà mọ́: ó lè jẹ́ ìbẹ̀rù ọlọ́wọ̀ fún Ọlọ́run tàbí ìṣọ́ra kí ìbàjẹ́ má bà á kan ẹni tó ń ṣàánú.'
- source_word: μισοῦντες
  choice: nígbà tí ẹ ń kórìíra
  rationale: “Kórìíra” pa líle ìkìlọ̀ náà mọ́, ìlànà yìí sì fi hàn pé kí àánú wọn lọ pọ̀ mọ́ kíkọ ohun tó ń sọni di ẹlẹ́gbin sílẹ̀.
- source_word: χιτῶνα
  choice: aṣọ àwọ̀tẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí aṣọ tí a wọ sábẹ́ aṣọ òde; “aṣọ àwọ̀tẹ́lẹ̀” ṣe kedere ju “aṣọ” lásán lọ, kò sì dà bí aṣọ abẹ́ òde òní nìkan.
- source_word: ἐσπιλωμένον
  choice: tí … ti sọ di ẹlẹ́gbin
  rationale: Ó sọ ipò aṣọ tí àbàwọ́n tàbí ìbàjẹ́ ti bà jẹ́, ó sì ṣiṣẹ́ dáadáa pẹ̀lú àwòrán aṣọ inú ẹsẹ náà.
- source_word: σάρξ
  choice: ẹran ara
  rationale: “Ẹran ara” pa àwòrán àti ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, dípò kí a sọ ọ́ di ẹ̀kọ́ pàtó bí “ìwà ẹlẹ́ṣẹ̀” nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ohun tí “iná” dúró fún nínú àwòrán ìgbàlà
  choice: A fi “iná” sílẹ̀ gẹ́gẹ́ bí àwòrán láìsọ ohun kan ṣoṣo tí ó dúró fún.
  alternative: Ìdájọ́ ọjọ́ iwájú tàbí ewu ẹ̀mí tó le koko ní ìsinsìnyí.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìtumọ̀ àwòrán náà ní pàtó; fífi “iná” sílẹ̀ pa ìkìlọ̀ àti àìdánilójú rẹ̀ mọ́.
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn nípa aṣọ tí ó di ẹlẹ́gbin
  choice: ẹran ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Bó tilẹ̀ jẹ́ pé gbólóhùn náà tọ́ka sí ìbàjẹ́ ìwà, “ẹran ara” pa àkàwé orísun náà àti ìforígbárí ẹ̀kọ́ inú rẹ̀ mọ́ láìfi àlàyé ẹ̀kọ́ kan rọ́pò rẹ̀.
- issue: Irú ìbẹ̀rù tí ἐν φόβῳ ń tọ́ka sí
  choice: ìbẹ̀rù
  alternative: ọ̀wọ̀ ọlọ́wọ̀ fún Ọlọ́run tàbí ìṣọ́ra nítorí ewu ìbàjẹ́
  rationale: Àwọn ìtumọ̀ méjèèjì bá àyíká ọ̀rọ̀ mu; a kò yan ọ̀kan ṣoṣo nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá àkànṣe tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àṣẹ ọ̀pọ̀ ènìyàn “Ẹ …” bá àyíká mu. “Aṣọ àwọ̀tẹ́lẹ̀” yẹra fún ìtumọ̀ tóóró ti aṣọ abẹ́ òde òní, “ẹran ara” sì pa àwòrán orísun mọ́. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti yẹ.
