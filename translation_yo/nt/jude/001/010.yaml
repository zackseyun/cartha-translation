  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìṣètò gírámà Gíríìkì—ìyàtọ̀ láàárín ohun tí wọ́n kò lóye àti ohun tí wọ́n mọ̀ nípa ìwà ẹ̀dá—gẹ́gẹ́ bí ó ti yẹ, ó sì pa ìtumọ̀ méjèèjì tí φθείρονται lè ní mọ́. Síbẹ̀, ‘ń sọ̀rọ̀-òdì sí’ lè túmọ̀ sí kíkàn tako, kì í sì fi ìwà ọ̀rọ̀ ẹ̀gàn/abúsí ti βλασφημοῦσιν hàn ní kíkún.
  naturalness: Ìtumọ̀ àtúnṣe náà jẹ́ Yorùbá boṣewa tí ó rọrùn láti ka. A tún yọ ‘ti’ kúrò nínú ‘wọ́n ti ń bàjẹ́,’ nítorí ‘ti’ kò sí nínú fáàbù Gíríìkì náà, ó sì lè mú ìtumọ̀ ‘ti ṣẹlẹ̀ tẹ́lẹ̀’ wá.
  terminology: ‘Ń sọ ọ̀rọ̀ ẹ̀gàn sí’ dáa ju ‘ń sọ̀rọ̀-òdì sí’ lọ fún βλασφημοῦσιν nínú àyíká yìí. ‘Nípa ìwà ẹ̀dá’ àti ‘ẹranko aláìní làákàyè’ pa φυσικῶς àti ἄλογα ζῷα mọ́ dáadáa. ‘Ń bàjẹ́’ fi ìbàjẹ́ àti ìparun tí φθείρονται lè tọ́ka sí sílẹ̀ láìfi èrò ìtumọ̀ kan ṣoṣo múlẹ̀.
  issues:
  - severity: medium
    issue: ‘Ń sọ̀rọ̀-òdì sí’ kò fi agbára βλασφημοῦσιν hàn ní kíkún.
    rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘takò’ tàbí ‘sọ lòdì sí’ láìsí ìtumọ̀ ọ̀rọ̀ ẹ̀gàn tàbí abúsí. ‘Ń sọ ọ̀rọ̀ ẹ̀gàn sí’ jẹ́ mímú ìtumọ̀ ìpilẹ̀ mọ́ dáadáa, láìdín un kù sí ṣíṣe àbùkù sí Ọlọ́run.
  - severity: low
    issue: ‘Wọ́n ti ń bàjẹ́’ ṣàfikún àmì àsìkò tí kò wà nínú Gíríìkì.
    rationale: ‘Ti’ lè fi hàn pé ìṣẹ̀lẹ̀ náà ti bẹ̀rẹ̀ tàbí ti ṣẹlẹ̀ tẹ́lẹ̀; fáàbù ìsinsìnyí φθείρονται kò béèrè fún ìfikún yìí.
  - severity: low
    issue: Àkọsílẹ̀ c ní ‘ń pa ara wọn run,’ èyí tó lè mú ìtumọ̀ aṣesìnṣe (reflexive) lágbára jù.
