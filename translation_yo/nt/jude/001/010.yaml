id: JUD.1.10
reference: Jude 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn wọ̀nyí ń sọ ọ̀rọ̀ ẹ̀gàn sí ohunkóhun tí wọn kò lóye[a]; ṣùgbọ́n àwọn ohun tí wọ́n mọ̀ nípa ìwà ẹ̀dá, gẹ́gẹ́ bí àwọn ẹranko aláìní làákàyè[b], nínú àwọn ohun wọ̀nyí ni wọ́n ń bàjẹ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń ṣe àbùkù sí ohunkóhun tí wọn kò mọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí àwọn ẹranko tí kì í ronú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nípasẹ̀ àwọn ohun wọ̀nyí ni wọ́n ń parun.”
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka ọ̀pọ̀ yìí tọ́ka sí àwọn afàwọ̀rajà tí Júúdà ń bá wí ní àyíká ọ̀rọ̀ náà, láìfi akọ tàbí abo kún un.
- source_word: βλασφημοῦσιν
  choice: ń sọ̀rọ̀-òdì sí
  rationale: Ó lè túmọ̀ sí sísọ ọ̀rọ̀ ẹ̀gàn, ọ̀rọ̀-òdì, tàbí ọ̀rọ̀-ìbùjẹ́ sí ènìyàn tàbí ohun mímọ́. Àṣàyàn yìí pa ìtumọ̀ náà mọ́ láìdín in kù sí ṣíṣe àbùkù sí Ọlọ́run nìkan.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: ohunkóhun tí wọn kò lóye
  rationale: Nínú ìyàtọ̀ rẹ̀ pẹ̀lú ìmọ̀ àdámọ́ ẹranko, ‘lóye’ fi àìní òye jinlẹ̀ hàn ju ‘mọ̀’ lásán lọ.
- source_word: φυσικῶς
  choice: nípa ìwà ẹ̀dá
  rationale: Ó tọ́ka sí ohun tí a mọ̀ nípa àdámọ́ tàbí ìwà ẹ̀dá, ní ìyàtọ̀ sí ìmọ̀ tí ó wá láti inú làákàyè tàbí ìṣípayá.
- source_word: ἄλογα ζῷα
  choice: àwọn ẹranko tí kò ní làákàyè
  rationale: Ó fi àìní agbára láti ronú lọ́nà tí ó bójú mu hàn ní èdè Yorùbá tí ó ṣe kedere, láìlo ọ̀rọ̀ ẹ̀gàn tí ó le jù.
- source_word: ἐπίστανται
  choice: mọ̀
  rationale: Níhìn-ín ó sọ nípa ìmọ̀ àdámọ́ tí ó ní ààlà; ‘mọ̀’ jẹ́ àdánidá lẹ́gbẹ̀ẹ́ gbólóhùn ‘nípa ìwà ẹ̀dá.’
- source_word: ἐν τούτοις
  choice: nínú àwọn ohun wọ̀nyí
  rationale: Èyí pa àwòrán ibi tàbí ààyè ìwà tí ìbàjẹ́ wọn ń ṣẹlẹ̀ mọ́, nígbà tí ó tún lè ní ìtumọ̀ pé àwọn ohun náà ni ọ̀nà ìparun wọn.
- source_word: φθείρονται
  choice: wọn ti ń bàjẹ́
  rationale: Fáàbù náà lè jẹ́ ìbàjẹ́ ìwà tàbí ìparun. ‘Ń bàjẹ́’ pa ìlọsíwájú ìbàjẹ́ àti ìparun ara wọn mọ́ láìyan ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ βλασφημέω níbi tí ohun tí a ń sọ̀rọ̀-òdì sí kò jẹ́ Ọlọ́run ní pàtó
  choice: sọ̀rọ̀-òdì sí
  alternative: ṣe àbùkù sí; sọ̀rọ̀ ẹ̀gàn sí
  rationale: Èyí fi bí ọ̀rọ̀ wọn ṣe burú hàn, ṣùgbọ́n kò fi èrò kun ẹsẹ̀ náà pé Ọlọ́run nìkan ni wọ́n ń sọ̀rọ̀ sí.
- issue: Agbára ìtumọ̀ φθείρονται
  choice: wọn ti ń bàjẹ́
  alternative: wọn ń parun; àwọn ohun wọ̀nyí ń pa wọ́n run
  rationale: Ọ̀rọ̀ Gíríìkì náà lè kó ìbàjẹ́ ìwà àti ìparun ìdájọ́ pọ̀. Àṣàyàn yìí jẹ́ kí ìfarakanra ìtumọ̀ méjèèjì dúró.
- issue: Ìṣe ἐν τούτοις
  choice: nínú àwọn ohun wọ̀nyí
  alternative: nípasẹ̀ àwọn ohun wọ̀nyí
  rationale: Fọọmu Gíríìkì náà lè jẹ́ ti ibi tàbí ti ohun èlò. A pa ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ mọ́ nínú ẹsẹ̀, a sì ṣàlàyé omi-in nínú àkọsílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A yan ‘sọ̀rọ̀-òdì sí’ láti gba ìbúpọ̀ ìtumọ̀ ẹ̀gàn àti àbùkù; ‘ìwà ẹ̀dá’ sì ṣàfihàn ìmọ̀ àdámọ́. Gbólóhùn ìkẹyìn mọ̀ọ́mọ̀ pa ìfarakanra tó wà láàárín ìbàjẹ́ àti ìparun mọ́.
