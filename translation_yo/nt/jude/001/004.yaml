id: JUD.1.4
reference: Jude 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: yo
  text: Nítorí àwọn ènìyàn kan ti wọlé lọ́nà ìkọ̀kọ̀ láìjẹ́ kí ẹnikẹ́ni kíyè sí wọn[a]. Àwọn wọ̀nyí ni a ti kọ̀wé nípa wọn tipẹ́tipẹ́ ní ti ìdájọ́ yìí[b]. Wọ́n jẹ́ ènìyàn aláìbọ̀wọ̀ fún Ọlọ́run; wọ́n ń yí oore-ọ̀fẹ́ Ọlọ́run wa di ìwà ìbàjẹ́ tí kò ní ìjánu[c], wọ́n sì ń sẹ́ Ọ̀gá àti Olúwa wa kan ṣoṣo, Jésù Mèsáyà[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti wọlé ní àṣírí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ti fi àmì sí wọn tipẹ́tipẹ́ ní ti ìdájọ́ yìí,” tàbí “a ti yàn wọn tẹ́lẹ̀ fún ìdájọ́ yìí.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìwà àìnítìjú” tàbí “ìfẹ́kúfẹ̀ẹ́ tí kò ní ìjánu.”
    reason: lexical_alternative
  - marker: d
    text: Ní èdè Gíríìkì, “Jésù Kristi”; a tú Χριστός sí “Mèsáyà” níhìn-ín nítorí pé Χριστός jẹ́ orúkọ oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: ti yọ́ wọlé láìsí ẹni tó kíyè sí wọn
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n yọ́ wọlé ní ọ̀nà àṣírí, tí àwọn ẹlòmíràn kò sì ṣàkíyèsí wọn; èdè Yorùbá yìí ṣe kedere, ó sì jẹ́ ti òde òní.
- source_word: πάλαι προγεγραμμένοι
  choice: a ti kọ̀wé nípa wọn tipẹ́tipẹ́ ṣáájú
  rationale: Ìtumọ̀ yìí tẹ̀ lé àwòrán gírámà Gíríìkì pé a ti kọ nípa wọn ṣáájú, láìfipá pinnu bóyá ọ̀rọ̀ náà túmọ̀ sí yíyàn wọn tẹ́lẹ̀ tàbí ìkìlọ̀ Ìwé Mímọ́ nípa wọn.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: “Ìdájọ́” pa agbára ọ̀rọ̀ ilé-ẹjọ́ mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìdálẹ́bi nìkan.
- source_word: ἀσεβεῖς
  choice: aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Èyí sọ àìní ìbẹ̀rù àti ọ̀wọ̀ wọn sí Ọlọ́run ní èdè tí ó ṣe kedere sí òǹkàwé Yorùbá.
- source_word: χάριτα
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún oore tí Ọlọ́run fi fúnni láìjẹ́ pé a tọ́ sí i.
- source_word: μετατιθέντες
  choice: yí ... padà sí
  rationale: Ó pa ìṣe yíyí ohun kan padà sí ohun mìíràn mọ́, láìfi ìtumọ̀ àfikún sí i.
- source_word: ἀσέλγειαν
  choice: ìwà ìbàjẹ́ tí kò ní ìjánu
  rationale: Gbólóhùn náà fi ìwà àìnítìjú àti ìfẹ́kúfẹ̀ẹ́ aláìníjàánu hàn, ṣùgbọ́n kò fi ọ̀rọ̀ náà mọ́ ìṣekúṣe ibálòpọ̀ nìkan.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: Ọ̀gá àti Olúwa wa kan ṣoṣo
  rationale: A tú àwọn orúkọ oyè méjèèjì, δεσπότης àti κύριος, sọ́tọ̀, nígbà tí a tún pa ìtumọ̀ pé ẹni náà nìkan ni ó ní ipò yìí mọ́.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesu Mèsáyà
  rationale: A tú Χριστός gẹ́gẹ́ bí orúkọ oyè “Mèsáyà,” kì í ṣe bí apá kan lásán nínú orúkọ ẹni.
- source_word: ἀρνούμενοι
  choice: sẹ́
  rationale: “Sẹ́” jẹ́ ọ̀rọ̀ Yorùbá tààrà fún kíkọ́ ẹni tàbí àṣẹ rẹ̀, ó sì lè kan ọ̀rọ̀ àti ìwà.
theological_decisions:
- issue: Agbára ọ̀rọ̀ προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: A ti kọ̀wé nípa wọn tipẹ́tipẹ́ ṣáájú fún ìdájọ́ yìí.
  alternative: A ti yàn wọn tẹ́lẹ̀ fún ìdálẹ́bi yìí.
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ohun tí a kọ nípa wọn ṣáájú tàbí sí fífi àmì sí wọn tẹ́lẹ̀. Àyípadà náà kò fi ẹ̀kọ́ ìpinnu ẹni kọ̀ọ̀kan láti ìbẹ̀rẹ̀ wọ inú ẹsẹ náà ju bí Gíríìkì ṣe béèrè lọ.
- issue: Ẹni tí àwọn oyè “Ọ̀gá” àti “Olúwa” ń tọ́ka sí
  choice: Oyè méjèèjì tọ́ka sí Jesu Mèsáyà.
  alternative: “Ọ̀gá” tọ́ka sí Ọlọ́run Baba, “Olúwa” sì tọ́ka sí Jesu Mèsáyà.
  rationale: Ìṣètò gírámà Gíríìkì ní ọ̀nà àdánidá jù lọ so oyè méjèèjì pọ̀ mọ́ Jesu Mèsáyà; a kò ya wọn sọ́tọ̀ láìní ìdí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún kíkà ní gbangba. A lo àwọn gbólóhùn tó ṣe kedere fún àwọn ọ̀rọ̀ ìwà àti ẹ̀sìn láìlo èdè ẹ̀ya ìjọ kan pàtó.
