id: JUD.1.6
reference: Jude 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: yo
  text: Àti àwọn áńgẹ́lì tí kò pa ipò tiwọn mọ́[a], ṣùgbọ́n tí wọ́n fi ibùgbé tiwọn sílẹ̀[b], ó sì ti pa wọ́n mọ́ nínú ẹ̀wọ̀n ayérayé lábẹ́ òkùnkùn biribiri[c] fún ìdájọ́ ọjọ́ ńlá náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “agbègbè tiwọn” tàbí “ipò àṣẹ tiwọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ibi gbígbé tiwọn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “òkùnkùn jíjinlẹ̀” tàbí “nínú òkùnkùn.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí òkùnkùn biribiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ọ̀rọ̀ ìdájọ́ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: τηρήσαντας / τετήρηκεν
  choice: kò pa ... mọ́ / ó ti fi ... pamọ́
  rationale: 'Àwọn gbólóhùn méjèèjì pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́ dé ìwọ̀n tí Yorùbá àdánidá gbà: àwọn áńgẹ́lì kò pa ipò wọn mọ́, Ọlọ́run sì ti fi wọ́n pamọ́ de ìdájọ́.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: ipò àṣẹ tiwọn
  rationale: ἀρχή lè túmọ̀ sí ìbẹ̀rẹ̀, àṣẹ, tàbí ipò tí a yàn fún ẹnì kan. “Ipò àṣẹ” fi èrò ipò tàbí agbègbè ojúṣe hàn láì sọ pé ìṣàkóso òṣèlú ni.
- source_word: ἀπολιπόντας
  choice: tí wọ́n fi ... sílẹ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n mọ̀ọ́mọ̀ kọ ibùgbé náà sílẹ̀.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: ibùgbé tiwọn
  rationale: οἰκητήριον túmọ̀ sí ibi gbígbé; “tíwọn” sì pa ìtumọ̀ ἴδιον mọ́ láì fi àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: de ìdájọ́ ọjọ́ ńlá náà
  rationale: “De” fi ìtọ́sọ́nà sí ìdájọ́ ọjọ́ ńlá hàn, ṣùgbọ́n kò sọ ọ́ di “títí di” ní ọ̀nà tí yóò túmọ̀ sí ohun tí ọ̀rọ̀ náà kò sọ ní tààrà.
- source_word: δεσμοῖς ἀϊδίοις
  choice: sínú ẹ̀wọ̀n ayérayé
  rationale: “Ẹ̀wọ̀n” jẹ́ àwòrán Yorùbá tí ó ṣe kedere fún ìdè tàbí ṣẹ́kẹ́ṣẹkẹ̀; “ayérayé” sì sọ ìwà pípẹ́ títí ti ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: lábẹ́ òkùnkùn biribiri
  rationale: ζόφος jẹ́ òkùnkùn tí ó nípọn tí ó sì kún fún ìrìnù; “òkùnkùn biribiri” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa àwòrán náà mọ́.
- source_word: τε
  choice: Àti
  rationale: “Àti” so àpẹẹrẹ yìí mọ́ àwọn àpẹẹrẹ ìdájọ́ tó ṣáájú rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀ṣẹ̀ àwọn áńgẹ́lì
  choice: A sọ pé wọn kò pa ipò àṣẹ tiwọn mọ́, wọ́n sì fi ibùgbé tiwọn sílẹ̀, láì ṣàlàyé ní pàtó ohun tí ipò tàbí ibùgbé náà jẹ́.
  alternative: Kí a sọ ọ́ ní tààrà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ Jẹ́nẹ́sísì 6 tàbí gẹ́gẹ́ bí ìṣubú àwọn áńgẹ́lì ní ìbẹ̀rẹ̀pẹ̀pẹ̀.
  rationale: Ó ṣeé ṣe kí Júdà máa tọ́ka sí àṣà ìtàn Júù kan tí àwọn olùgbọ́ rẹ̀ mọ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé àṣà náà ní kíkún. Ìtumọ̀ náà kò gbé èrò ìtumọ̀ kan wọ inú ẹsẹ.
- issue: Agbára ìtumọ̀ ἀΐδιος
  choice: ayérayé
  alternative: títí láé; tí kò lópin
  rationale: “Ayérayé” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì fi ìwà pípẹ́ títí hàn láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún ọ̀rọ̀ náà.
- issue: Ẹni tí ó fi àwọn áńgẹ́lì pamọ́
  choice: ó ti fi wọ́n pamọ́
  alternative: Ọlọ́run ti fi wọ́n pamọ́
  rationale: Ọ̀rọ̀ Gíríìkì ní kókó-ọrọ̀ tí a kò dárúkọ, èyí tí àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni. Lílo “ó” pa ìṣètò ọ̀rọ̀ orísun mọ́ láì fi orúkọ kún un.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ìdájọ́ àti àìṣe kedere tó wà nínú orísun mọ́.
