  source_fidelity: Ìtumọ̀ àkọ́kọ́ mú èrò pàtàkì ẹsẹ náà dáadáa. Síbẹ̀, “ipò àṣẹ” lè fi ìtumọ̀ ìṣàkóso/àṣẹ múlẹ̀ ju ἀρχή ṣe níhìn-ín lọ, níbi tí “ipò tiwọn” ti dáa jù láti pa ìtumọ̀ ṣí sílẹ̀. Bákan náà, “fi ... pamọ́” lè túmọ̀ sí fífarapamọ́, dípò ìpamọ́/ìfipamọ́ fún ìdájọ́ tí τετήρηκεν ń sọ; “pa ... mọ́” tún dá àtúnlò ρήμα τηρέω méjèèjì hàn dáadáa.
