  to: Ẹ̀yin olùfẹ́, bí mo tilẹ̀ ń sapá gidigidi láti kọ̀wé sí yín nípa ìgbàlà tí gbogbo wa jọ ní, mo rí i pé ó pọndandan láti kọ̀wé[d], kí n sì rọ̀ yín kí ẹ jà takuntakun fún ìgbàgbọ́[b] tí a ti fi lé àwọn ènìyàn mímọ́[c] lọ́wọ́ lẹ́ẹ̀kan ṣoṣo[a].
