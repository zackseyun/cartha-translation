id: JUD.1.3
reference: Jude 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, bí mo tilẹ̀ ń sapá gidigidi láti kọ̀wé sí yín nípa ìgbàlà tí gbogbo wa jọ ní, mo rí i pé ó pọndandan láti kọ̀wé[d], kí n sì rọ̀ yín kí ẹ jà takuntakun fún ìgbàgbọ́[b] tí a ti fi lé àwọn ènìyàn mímọ́[c] lọ́wọ́ lẹ́ẹ̀kan ṣoṣo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “tí a ti fi lé wọn lọ́wọ́,” èyí tó tẹnumọ́ bí a ṣe fi ẹ̀kọ́ àwọn aposteli lé àwọn onígbàgbọ́ lọ́wọ́.
    reason: lexical_alternative
  - marker: b
    text: “Ìgbàgbọ́” níhìn-ín ṣeé ṣe kó túmọ̀ sí àkójọpọ̀ ẹ̀kọ́ Kristẹni tí a fi lé àwọn onígbàgbọ́ lọ́wọ́, kì í ṣe ìṣe gbígbàgbọ́ nìkan.
    reason: alternative_reading
  - marker: c
    text: “Àwọn ènìyàn mímọ́” túmọ̀ sí àwọn ènìyàn Ọlọ́run, ìyẹn àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: d
    text: A tún lè sọ ọ́ pé, “mo rí i pé ó pọndandan láti kọ̀wé sí yín, kí n sì rọ̀ yín pé …”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni; ó pa ìfẹ́ àti ìrẹ̀lẹ̀ olùkọ̀wé mọ́ láìfi ‘ọ̀rẹ́’ kún ohun tí Gíríìkì kò sọ.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: bí mo tilẹ̀ ń fi gbogbo ìtara ṣe
  rationale: Ó mú ìtara àti ìsapá tó wà nínú àpólà Gíríìkì jáde, ó sì fi ìyàtọ̀ láàárín ète àkọ́kọ́ àti dandan tó dé hàn.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: nípa ìgbàlà tí gbogbo wa jọ ní
  rationale: Ó sọ κοινῆς gẹ́gẹ́ bí ohun tí gbogbo wọn pín pọ̀, ní èdè Yorùbá tó ṣe kedere.
- source_word: ἀνάγκην ἔσχον
  choice: mo rí i pé ó pọndandan
  rationale: Àpólà náà ń tọ́ka sí dandan tó ṣẹlẹ̀ nítorí ipò kan; ọ̀rọ̀ yìí kò lágbára ju Gíríìkì lọ bí ‘a fipá mú mi’ ṣe lè rí.
- source_word: παρακαλῶν
  choice: kí n sì rọ̀ yín
  rationale: Ó mú ìpè tó jinlẹ̀ àti ìṣílétí ọ̀rẹ́ jáde ní Yorùbá àgbéléwò.
- source_word: ἐπαγωνίζεσθαι
  choice: kí ẹ jà takuntakun fún
  rationale: Ó pa àwòrán ìjàkadì àti agbára ọ̀rọ̀ ìṣe náà mọ́, láìsọ ọ́ di ìjà ogun gangan.
- source_word: τῇ ... πίστει
  choice: fún ìgbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ohun tí àwọn Kristẹni gbà gbọ́ tí a fi lé ìjọ lọ́wọ́; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ yìí mọ́ láìpa ìtumọ̀ gbígbàgbọ́ tì pátápátá.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  rationale: Ó fi hàn pé fífi ìgbàgbọ́ náà fún wọn jẹ́ ohun tó ṣẹlẹ̀ lẹ́ẹ̀kan, tí kò nílò àtúnṣe léraléra.
- source_word: παραδοθείσῃ
  choice: tí a fi fún
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún fífi ohun kan dé ọwọ́ àwọn mìíràn; àlàyé [a] fúnni ní yíyan tó tẹnumọ́ ìfàléwọ́ àti ìtànkálẹ̀.
- source_word: τοῖς ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Ó yàgò fún èrò pé àwọn ènìyàn tí ìjọ kan ti sọ di ẹni mímọ́ lẹ́yìn ikú nìkan ni, ó sì bá ìlò Kristẹni ìjímìjí mu.
theological_decisions:
- issue: Ìtumọ̀ τῇ πίστει (‘ìgbàgbọ́’)
  choice: Àkójọpọ̀ òtítọ́ tàbí ẹ̀kọ́ Kristẹni tí a fi lé àwọn onígbàgbọ́ lọ́wọ́
  alternative: Ìgbẹ́kẹ̀lé tàbí ìṣe gbígbàgbọ́ ti ẹnì kọ̀ọ̀kan
  rationale: Gbólóhùn ‘tí a fi fún àwọn ènìyàn mímọ́’ fi hàn pé ohun tí a lè fi lé àwùjọ lọ́wọ́ ni a ń sọ; síbẹ̀, a fi ọ̀rọ̀ gbòòrò ‘ìgbàgbọ́’ sí ara ẹsẹ̀, a sì ṣàlàyé ìtumọ̀ tó ṣeé ṣe jù ní àlàyé.
- issue: Agbára ἅπαξ παραδοθείσῃ
  choice: Fífi ìgbàgbọ́ náà fún wọn ní ọ̀nà pàtó lẹ́ẹ̀kan ṣoṣo
  alternative: Ohun tó ṣẹlẹ̀ nígbà kan ṣoṣo láìjẹ́ pé ọ̀rọ̀ náà tẹnumọ́ ìparí tàbí àìtúnṣe
  rationale: ἅπαξ lè túmọ̀ sí ‘lẹ́ẹ̀kan ṣoṣo’ nínú àyíká yìí; ìtumọ̀ náà pa agbára ọ̀rọ̀ mọ́ láìfi ètò ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘jà takuntakun’ láti pa àwòrán ìjàkadì mọ́, kì í ṣe láti pe sí ìwà ipá. Gbogbo àmì àlàyé [a]–[d] wà nínú ara ẹsẹ̀.
