id: JUD.1.14
reference: Jude 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: yo
  text: Ẹ́nọ́kù náà, ẹni keje láti ọ̀dọ̀ Ádámù, sọ àsọtẹ́lẹ̀ nípa àwọn wọ̀nyí pé, “Wò ó,[c] Olúwa dé pẹ̀lú ẹgbẹẹgbẹ̀rún àwọn ẹni mímọ́ rẹ̀,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ó tún lè jẹ́ “pẹ̀lú ọ̀kẹ́ àwọn ẹni mímọ́ rẹ̀.” Ọ̀rọ̀ μυριάσιν lè túmọ̀ sí ọ̀kẹ́, tàbí ọ̀pọ̀lọpọ̀ tí kò ṣeé kà; gbólóhùn náà ń tọ́ka sí ogun mímọ́ ńláǹlà.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ àyọlò yìí fara jọ 1 Ẹ́nọ́kù 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: sọ àsọtẹ́lẹ̀
  rationale: Ó pa ìtumọ̀ iṣẹ́ àsọtẹ́lẹ̀ mọ́, láì dín un kù sí sísọ ohun ọjọ́ iwájú nìkan.
- source_word: δὲ καὶ
  choice: pẹ̀lú
  rationale: Níbí, àwọn ọ̀rọ̀ méjèèjì ń tẹ ọ̀rọ̀ náà síwájú, wọ́n sì fi Ẹ́nọ́kù kún àwọn ẹlẹ́rìí tí a ti mẹ́nu kàn.
- source_word: τούτοις
  choice: nípa àwọn wọ̀nyí
  rationale: Dative náà lè túmọ̀ sí ‘fún,’ ‘nípa,’ tàbí ‘lòdì sí’; ‘nípa àwọn wọ̀nyí’ bá àyíká ọ̀rọ̀ mu, kò sì fi akọ tàbí ìdánimọ̀ mìíràn kún Gíríìkì.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: ẹni keje láti ọ̀dọ̀ Ádámù
  rationale: Ìtumọ̀ tààrà fún àpèjúwe ipò rẹ̀ nínú ìran láti Ádámù.
- source_word: Ἑνὼχ
  choice: Ẹ́nọ́kù
  rationale: Àkọtọ̀ orúkọ náà ní Yorùbá.
- source_word: λέγων
  choice: pé
  rationale: Ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ àyọlò tí participle náà ń mú wọlé.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó dá agbára ìkìlọ̀ àti ọ̀rọ̀ àsọtẹ́lẹ̀ náà dúró ní Yorùbá òde òní.
- source_word: ἦλθεν
  choice: dé
  rationale: Aorist náà jẹ́ ìṣe àtijọ́ ní fọ́ọ̀mù; ‘dé’ pa èyí mọ́, kì í sì í sọ ọ́ di ọjọ́ iwájú láìjẹ́ pé Gíríìkì ṣe bẹ́ẹ̀.
- source_word: κύριος
  choice: Olúwa
  rationale: Ó pa oyè náà mọ́ láì pinnu bóyá Ọlọ́run ni tàbí Jésù ni a ń tọ́ka sí.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: pẹ̀lú ẹgbẹẹgbẹ̀rún àwọn ẹni mímọ́ rẹ̀
  rationale: ‘Pẹ̀lú’ fi ìbákẹ́gbẹ́ hàn; ‘ẹgbẹẹgbẹ̀rún’ sọ ọ̀pọ̀lọpọ̀ ogun mímọ́ náà ní Yorùbá àdánidá, láì fi ‘àwọn áńgẹ́lì’ kún ohun tí Gíríìkì kò sọ ní kedere.
theological_decisions:
- issue: Ta ni ‘Olúwa’ nínú àyọlò Ẹ́nọ́kù?
  choice: Fi sílẹ̀ gẹ́gẹ́ bí ‘Olúwa’ nìkan.
  alternative: Ṣàlàyé rẹ̀ ní kedere gẹ́gẹ́ bí Ọlọ́run tàbí Jésù.
  rationale: Gíríìkì sọ κύριος nìkan; ìtumọ̀ náà pa àìdánilójú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
- issue: Irú àyọlò láti inú 1 Ẹ́nọ́kù
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí àsọtẹ́lẹ̀, kí a sì fi ìtọ́kasí sí àlàyé ìsàlẹ̀.
  alternative: Fi ìdájọ́ nípa ipò ìwé 1 Ẹ́nọ́kù sínú ọ̀rọ̀ pàtàkì.
  rationale: Júdà sọ pé Ẹ́nọ́kù sọ àsọtẹ́lẹ̀; ẹsẹ náà kò sọ ìdájọ́ kan nípa ipò ìwé náà nínú àkójọpọ̀ Ìwé Mímọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘Wò ó’ fún ohùn àsọtẹ́lẹ̀, ‘nípa àwọn wọ̀nyí’ láti pa àìdánilójú τούτοις mọ́, àti ‘ẹgbẹẹgbẹ̀rún àwọn ẹni mímọ́’ láì sọ pé áńgẹ́lì ni wọ́n.
