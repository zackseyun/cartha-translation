id: JUD.1.18
reference: Jude 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: yo
  text: pé wọ́n máa ń sọ fún yín pé, “Ní àkókò ìkẹyìn[a], àwọn ẹlẹ́gàn[b] yóò wà, tí ń gbé ìgbésí ayé wọn ní ìbámu pẹ̀lú àwọn ìfẹ́kúfẹ̀ẹ́ tiwọn fúnra wọn tí kò fi ọ̀wọ̀ fún Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ní ìgbà òpin” tàbí “Ní òpin àkókò.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan, “àkókò,” kì í ṣe “àwọn ọjọ́.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn olùṣẹ̀sín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n máa ń sọ
  rationale: Àpẹẹrẹ imperfect náà tọ́ka sí ọ̀rọ̀ tí wọ́n ń sọ léraléra tàbí tí wọ́n máa ń sọ ní àkókò àtijọ́; “wọ́n máa ń sọ” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Ní ìgbà ìkẹyìn
  rationale: Èyí pa χρόνος mọ́ gẹ́gẹ́ bí ẹyọ kan, “ìgbà,” dípò yíyí i sí “àwọn ọjọ́ ìkẹyìn,” ó sì pa ìtumọ̀ nípa òpin mọ́.
- source_word: ἐμπαῖκται
  choice: àwọn ẹlẹ́gàn
  rationale: “Àwọn ẹlẹ́gàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tó ń fi ẹlòmíràn ṣe yẹ̀yẹ́ tàbí tí ń fi ẹ̀gàn tako ohun tí wọ́n gbọ́.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: ní ìbámu pẹ̀lú àwọn ìfẹ́kúfẹ̀ẹ́ tiwọn fúnra wọn
  rationale: “Ní ìbámu pẹ̀lú” ṣàfihàn ìtumọ̀ κατά, “tiwọn fúnra wọn” sì tẹnu mọ́ ἑαυτῶν. “Ìfẹ́kúfẹ̀ẹ́” kò fi ìtumọ̀ náà mọ́ ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: πορευόμενοι
  choice: tí wọn yóò máa gbé ìgbésí ayé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń ṣàpèjúwe ìlànà ìwà àti bí ènìyàn ṣe ń gbé ayé, kì í ṣe ìrìn ní ti ara nìkan.
- source_word: τῶν ἀσεβειῶν
  choice: èyí tí kò fi ọ̀wọ̀ fún Ọlọ́run
  rationale: Gbólóhùn yìí sọ ìwà àìbẹ̀rù àti àìbọ̀wọ̀ fún Ọlọ́run tó ń dá àwọn ìfẹ́kúfẹ̀ẹ́ náà mọ̀, láì dín un kù sí ẹ̀ṣẹ̀ irú kan ṣoṣo.
theological_decisions:
- issue: Gbólóhùn nípa àkókò òpin
  choice: Ní ìgbà ìkẹyìn
  alternative: Ní àwọn ọjọ́ ìkẹyìn; Ní òpin àkókò
  rationale: A pa ẹyọ χρόνος mọ́, a kò sì mú ọ̀rọ̀ Juda bá gbólóhùn “àwọn ọjọ́ ìkẹyìn” ní àwọn ibòmíràn mu lọ́nà tí kò sí nínú orísun.
- issue: Ìdájọ́ ìwà àwọn ìfẹ́kúfẹ̀ẹ́
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ ... èyí tí kò fi ọ̀wọ̀ fún Ọlọ́run
  alternative: àwọn ìfẹ́kúfẹ̀ẹ́ àìwà-bí-Ọlọ́run; àwọn ìfẹ́kúfẹ̀ẹ́ búburú
  rationale: Èyí pa ìdájọ́ ẹ̀sìn àti ìwà inú ἀσέβεια mọ́, ṣùgbọ́n kò sọ pé ìfẹ́kúfẹ̀ẹ́ náà jẹ́ ti ìbálòpọ̀ nìkan.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A tún ṣètò àmì àlàyé [a] sí “ìgbà ìkẹyìn” àti [b] sí “àwọn ẹlẹ́gàn,” kí àmì kọ̀ọ̀kan bá àlàyé rẹ̀ mu.
