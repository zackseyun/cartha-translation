id: JUD.1.2
reference: Jude 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: yo
  text: Kí àánú àti àlàáfíà àti ìfẹ́ pọ̀ sí i fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó di púpọ̀ sí i” tàbí “kí ó pọ̀ rẹpẹtẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: àánú
  rationale: “Àánú” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ἔλεος, ó sì pa ìtumọ̀ ìṣe rere sí ẹni tí ó nílò rẹ̀ mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Nínú àdúrà ìkíni yìí, “fún yín” fi hàn pé àwọn olùgbà lẹ́tà ni a ń fẹ́ kí àwọn ìbùkún náà máa pọ̀ sí i fún.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ àdánidá, tí gbogbo ènìyàn lóye, ó sì lè gba ìtumọ̀ ìbágbépọ̀ rere àti ìwàláàyè pípé.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ ní àwọn ibi míì.
- source_word: πληθυνθείη
  choice: máa pọ̀ sí i
  rationale: Gbólóhùn yìí mú agbára optative inú ìbùkún náà jáde ní Yorùbá àdánidá, ó sì pa àwòrán ohun tí ń di púpọ̀ mọ́.
- source_word: καὶ ... καὶ ... καὶ
  choice: àti ... àti ... àti
  rationale: Àtúnṣe “àti” pa ìró àti ìtẹnumọ́ ìkójọpọ̀ mẹ́tẹ̀ẹ̀ta inú orísun mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ optative inú ọ̀rọ̀ ìbùkún
  choice: Kí àánú àti àlàáfíà àti ìfẹ́ máa pọ̀ sí i fún yín.
  alternative: Àánú àti àlàáfíà àti ìfẹ́ kí ó di púpọ̀ fún yín.
  rationale: Ìbẹ̀rẹ̀ “Kí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tàbí àdúrà ìbùkún; “máa pọ̀ sí i” sì dá àwòrán πληθυνθείη dúró láì sọ ẹni tàbí ohun tó ń mú un ṣẹlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì, ó sì rọrùn fún òǹkàwé lásán láti lóye. Àtúnṣe “àti” ni a pa mọ́ nítorí ìró ọ̀rọ̀ Gíríìkì.
