id: JUD.1.7
reference: Jude 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: yo
  text: gẹ́gẹ́ bí Sódómù àti Gòmórà àti àwọn ìlú tí ó yí wọn ká[a] ti ṣe àgbèrè ní ọ̀nà kan náà, tí wọ́n sì lépa ẹran-ara mìíràn[b], a gbé wọn kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ, wọ́n ń gba ìjìyà iná ayérayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kíkún, “ní ọ̀nà kan náà bí àwọn wọ̀nyí.” “Àwọn wọ̀nyí” lè tọ́ka sí àwọn áńgẹ́lì tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú, tàbí sí àwọn àpẹẹrẹ ìṣọ̀tẹ̀ àti ìdájọ́ tó ṣáájú lápapọ̀.
    reason: alternative_reading
  - marker: b
    text: “Ẹran-ara mìíràn” tún lè jẹ́ “ẹran-ara ọ̀tọ̀”; ìtumọ̀ ìbílẹ̀ kan ni “ẹran-ara àjèjì.” A túmọ̀ gbólóhùn náà ní tààrà, a kò sì dín in kù sí ìtumọ̀ kan pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó mú ìfiwéra pẹ̀lú àwọn àpẹẹrẹ inú ẹsẹ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sódómù àti Gòmórà
  rationale: Àwọn orúkọ ibi ni a kọ ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: àwọn ìlú tí ó yí wọn ká
  rationale: Ó pa ìtumọ̀ ibi tí περὶ pẹ̀lú accusative ní sí mọ́.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: ní ọ̀nà kan náà
  rationale: Ó fi ìjọra ọ̀nà ìṣe hàn láì pinnu ní pàtó ẹni tí τούτοις ń tọ́ka sí.
- source_word: ἐκπορνεύσασαι
  choice: ti ṣe àgbèrè
  rationale: Àgbèrè jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìwà ìbálòpọ̀ aláìmọ́ tí ọ̀rọ̀ Gíríìkì náà ń sọ ní àyíká yìí.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: tí wọ́n sì lépa
  rationale: Ó pa àwòrán títẹ̀lé tàbí lílépa ohun kan mọ́.
- source_word: σαρκὸς ἑτέρας
  choice: ẹran-ara mìíràn
  rationale: Ìtumọ̀ tààrà ni, tí kò dín gbólóhùn náà kù sí ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- source_word: πρόκεινται δεῖγμα
  choice: a gbé wọn kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ
  rationale: Ó fi hàn pé a ṣàfihàn wọn ní gbangba gẹ́gẹ́ bí àpẹẹrẹ ìdájọ́.
- source_word: πυρὸς αἰωνίου
  choice: iná ayérayé
  rationale: Ó túmọ̀ gbólóhùn náà tààrà, láì rọ̀ ọ́ tàbí ṣàfikún ẹ̀kọ́ tó kọjá ohun tí ẹsẹ náà sọ.
- source_word: δίκην ὑπέχουσαι
  choice: wọ́n ń jìyà ìyà
  rationale: Ó pa ìtumọ̀ fífarada ìjìyà tàbí ẹ̀san ìdájọ́ mọ́.
theological_decisions:
- issue: Ohun tí τούτοις ń tọ́ka sí
  choice: 'A túmọ̀ rẹ̀ ní ọ̀nà tí kò yan ẹni kan pàtó: “ní ọ̀nà kan náà.”'
  alternative: Ó lè túmọ̀ sí “ní ọ̀nà kan náà bí àwọn wọ̀nyí,” níbi tí “àwọn wọ̀nyí” ti lè jẹ́ àwọn áńgẹ́lì inú ẹsẹ 6 tàbí gbogbo àwọn àpẹẹrẹ ìṣọ̀tẹ̀ àti ìdájọ́ tó ṣáájú.
  rationale: Èdè Gíríìkì fi ìfiwéra hàn, ṣùgbọ́n ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí kò dájú; a kò gbọdọ̀ fi ìtumọ̀ kan lé e lórí.
- issue: Ìtumọ̀ σαρκὸς ἑτέρας
  choice: “ẹran-ara mìíràn”
  alternative: “ẹran-ara ọ̀tọ̀” tàbí ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí irú ìrékọjá ìbálòpọ̀ kan pàtó.
  rationale: Gbólóhùn Gíríìkì náà jẹ́ ti ara rẹ̀, ìtumọ̀ rẹ̀ pàtó sì jẹ́ ohun tí a ń jíròrò; ìtumọ̀ tààrà pa àìdájú náà mọ́.
- issue: Agbára ọ̀rọ̀ πυρὸς αἰωνίου
  choice: “iná ayérayé”
  alternative: “iná àìnípẹ̀kun”
  rationale: A pa ọ̀rọ̀ ìdájọ́ inú ẹsẹ náà mọ́ láì sọ ọ́ di gbólóhùn ẹ̀kọ́ tó gùn ju ohun tí ẹsẹ náà fúnra rẹ̀ sọ.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. A gbé àmì àlàyé [b] lẹ́yìn gbólóhùn “iná ayérayé” nítorí pé àlàyé náà ń ṣàlàyé “ẹran-ara mìíràn” tó wà ṣáájú; àmì náà ṣì hàn nínú ọ̀rọ̀ gẹ́gẹ́ bí a ti béèrè.
