  source_fidelity: Àtúnyẹ̀wò nílò. “Ṣùgbọ́n” ń mú ìtakò tó lágbára wọlé fún δέ, níbi tí ó ti jẹ́ ìyípadà rọrùn sí ọ̀rọ̀ ìyìn. Pẹ̀lú èyí, “tí ó sì lè” tún “ó lè” ṣe fún καὶ στῆσαι, bí ó tilẹ̀ jẹ́ pé participle δυναμένῳ kan ṣoṣo ló ń darí àwọn infinitive méjèèjì. Àtúnṣe náà ń pa ìtumọ̀ “pa yín mọ́ kí ẹ má bàa kọsẹ̀” àti “mú yín dúró” mọ́, ó sì jẹ́ kí ἀμώμους hàn gẹ́gẹ́ bí àìní àbùkù/lẹ́bi.
  naturalness: Ìbẹ̀rẹ̀ “Sí ẹni tí ó lè …” dára nítorí gbolohun ìyìn náà ń tẹ̀ síwájú sí ẹsẹ̀ 25. Ṣùgbọ́n “pa yín mọ́ kúrò nínú ìkọsẹ̀” kéré sí ìrọ̀rùn ju “pa yín mọ́ kí ẹ má bàa kọsẹ̀” lọ. “Láìní àbùkù” jẹ́ èdè Yorùbá boṣewa tí ó ṣe kedere ju “láìlẹ́gàn” lọ nínú àyíká yìí.
  terminology: “Ògo rẹ̀” túmọ̀ δόξα αὐτοῦ ní tààrà. “Láìní àbùkù” pa ìró ẹbọ àti ìwà-ẹni ti ἀμώμους mọ́ láìsọ ìtumọ̀ rẹ̀ di ti ẹ̀kọ́ ìjọ kan. “Pẹ̀lú ìdùnnú ńlá” jẹ́ ìtumọ̀ àdánidá fún ἐν ἀγαλλιάσει; “ńlá” ń ṣàfihàn ìdùnnú àṣejù tí ọ̀rọ̀ náà ní, kì í sì í pinnu ẹ̀kọ́ kan.
