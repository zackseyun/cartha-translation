  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: yo
  text: Sí ẹni tí ó lè pa yín mọ́ kí ẹ má bàa kọsẹ̀[a], àti láti mú yín dúró níwájú ògo rẹ̀[b], láìní àbùkù[c], pẹ̀lú ìdùnnú ńlá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kí ẹ má bàa ṣubú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àìkọsẹ̀ tàbí àìṣubú.'
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ Gẹ̀ẹ́sì ìbílẹ̀ kan ní, “níwájú wíwà ológo rẹ̀”; ṣùgbọ́n ní tààrà, Gíríìkì sọ pé, “níwájú ògo rẹ̀.”
    reason: alternative_reading
  - marker: c
    text: 'Tàbí: “láìlẹ́bi.” Ọ̀rọ̀ Gíríìkì náà tún lè mú àwòrán ohun ẹbọ tí kò ní àbùkù wá sí ọkàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: sí ẹni tí ó lè
  rationale: Ó pa ìtumọ̀ àbọ̀-orúkọ olùṣe inú èdè Gíríìkì mọ́, ó sì bá ìbẹ̀rẹ̀ ọ̀rọ̀ ìyìn tí yóò parí ní ẹsẹ̀ 25 mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àmì ìyípadà onírẹ̀lẹ̀ sí ọ̀rọ̀ ìyìn ìparí; “Ṣùgbọ́n” so apá yìí mọ́ ohun tó ṣáájú láìfi ìtakò líle kún un.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: pa yín mọ́ kúrò nínú ìkọsẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípa ènìyàn mọ́ kí ó má bàa kọsẹ̀, ó sì pa àwòrán ἀπταίστους mọ́.
- source_word: καὶ στῆσαι
  choice: tí ó sì lè mú yín dúró
  rationale: Ó tẹ̀lé ìtumọ̀ gidi ti ἵστημι, “mú kí ó dúró,” dípò yíyí i sí ọ̀rọ̀ ìfihàn tí ó lè dín àwòrán Gíríìkì kù.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: níwájú ògo rẹ̀
  rationale: Ó túmọ̀ ọ̀rọ̀ náà ní tààrà, kì í sì í fi “wíwà ológo” kún ohun tí Gíríìkì pè ní “ògo rẹ̀.”
- source_word: ἀμώμους
  choice: láìlẹ́gàn
  rationale: “Láìlẹ́gàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó yege fún ẹni tí kò ní àbùkù tàbí ohun tí a lè dá lẹ́bi, ó sì lè gba ìtumọ̀ ìwà rere àti àwòrán ohun ẹbọ aláìlábùkù.
- source_word: ἐν ἀγαλλιάσει
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: ἀγαλλίασις tọ́ka sí ayọ̀ tí ó kún fún ìdùnnú gidigidi; “ayọ̀ ńlá” sọ agbára ọ̀rọ̀ náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τῆς δόξης αὐτοῦ
  choice: ògo rẹ̀
  alternative: wíwà ológo rẹ̀
  rationale: Gíríìkì sọ “ògo rẹ̀” ní tààrà. Yíyan èyí yẹra fún fífi àlàyé tí kò hàn gbangba sínú ọ̀rọ̀ náà.
- issue: Bí ἀπταίστους ṣe ń tọ́ka sí ìkọsẹ̀ nínú ẹ̀ṣẹ̀ tàbí ìṣubú pátápátá
  choice: kúrò nínú ìkọsẹ̀
  alternative: kúrò nínú ìṣubú
  rationale: “Ìkọsẹ̀” pa àwòrán orísun mọ́, kò sì pinnu bóyá ìtọ́kasí rẹ̀ jẹ́ sí ẹ̀ṣẹ̀ ojoojúmọ́ tàbí ìṣubú kúrò nínú ìgbàgbọ́ pátápátá.
- issue: Bí ἀμώμους ṣe yẹ kí ó jẹ́ ti ìdájọ́ ìwà tàbí àwòrán ohun ẹbọ
  choice: láìlẹ́gàn
  alternative: láìlábùkù
  rationale: “Láìlẹ́gàn” jẹ́ èdè tí òǹkàwé òde òní lè lóye, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àwòrán ohun tí kò ní àbùkù hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere, ó sì yẹ fún ọ̀rọ̀ ìyìn ìparí. A pa gbolohun náà mọ́ ní ṣíṣí sí ẹsẹ̀ 25, gẹ́gẹ́ bí ìṣọ̀kan gírámà orísun ṣe rí.
