id: JUD.1.15
reference: Jude 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: yo
  text: láti mú ìdájọ́ ṣẹ lòdì sí gbogbo ènìyàn, àti láti fi gbogbo àwọn aláìgbọ̀wọ̀ fún Ọlọ́run hàn pé wọ́n jẹ̀bi[a] nítorí gbogbo iṣẹ́ àìgbọ̀wọ̀ fún Ọlọ́run tí wọ́n ṣe nínú àìgbọ̀wọ̀ fún Ọlọ́run, àti nítorí gbogbo ọ̀rọ̀ líle[b] tí àwọn ẹlẹ́ṣẹ̀ aláìgbọ̀wọ̀ fún Ọlọ́run ti sọ lòdì sí i.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti tú àṣírí ẹ̀ṣẹ̀ gbogbo àwọn aláìgbọ̀wọ̀ fún Ọlọ́run” tàbí “láti fi ẹ̀rí mú wọn.” Ọ̀rọ̀ Giriki náà lè túmọ̀ sí mímú ohun tí kò tọ́ wá sí ìmọ́lẹ̀, ṣùgbọ́n níbí ó wà nínú àyíká ìdájọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀rọ̀ àfojúdi.” Ọ̀rọ̀ Giriki náà túmọ̀ sí “líle” ní tààrà, ṣùgbọ́n nípa ọ̀rọ̀ sísọ ó lè tọ́ka sí ọ̀rọ̀ líle, agídí, tàbí àfojúdi.
    reason: lexical_alternative
  - marker: c
    text: “I” ń tọ́ka sí Olúwa tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: láti ṣe ìdájọ́ sí gbogbo ènìyàn
  rationale: “Ṣe ìdájọ́” jẹ́ ọ̀nà Yorùbá tó bójú mu fún mímú ìdájọ́ ṣẹ, “sí” sì mú ìtumọ̀ κατά ní ipò ìdájọ́ hàn. “Gbogbo ènìyàn” jẹ́ kí πάντων tó dúró láìsí ọ̀rọ̀-orúkọ ṣe kedere.
- source_word: ἐλέγξαι
  choice: láti fi ... hàn ní ẹlẹ́bi
  rationale: Ní àyíká ilé-ẹjọ́ yìí, gbólóhùn náà túmọ̀ sí ṣí ẹ̀bi payá àti fífi ẹ̀bi mú ẹni, kì í ṣe ìbáwí lásán.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: gbogbo àwọn aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá fún àwọn tí kò ní εὐσέβεια, ó sì yà wọ́n sọ́tọ̀ gẹ́gẹ́ bí ẹgbẹ́ kan.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  choice: nítorí gbogbo iṣẹ́ àìbọ̀wọ̀ fún Ọlọ́run tí wọ́n fi àìbọ̀wọ̀ fún un ṣe
  rationale: Atúmọ̀ yìí pa àtúnlò gbòǹgbò ἀσεβ- mọ́ ní ọ̀nà tó ṣeé lóye ní Yorùbá, ó sì fi ìṣe àti ọ̀nà tí wọ́n gbà ṣe é hàn.
- source_word: σκληρῶν
  choice: ọ̀rọ̀ líle
  rationale: Nínú àyíká ọ̀rọ̀ sísọ, “líle” lè tọ́ka sí ọ̀rọ̀ burúkú, agídí tàbí àfojúdi, nígbà tó tún pa àwòrán “líle” inú Giriki mọ́.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: tí ... ti sọ sí i
  rationale: “Sọ sí i” jẹ́ ọ̀nà Yorùbá tó ṣàn láti sọ pé wọ́n sọ ọ̀rọ̀ lòdì sí ẹni náà; “ti sọ” sì mú àwọn ìṣe tí wọ́n ti ṣe wá sí ẹ̀sùn tó wà níwájú.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: àwọn ẹlẹ́ṣẹ̀ aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó pa àwọn àpèjúwe méjèèjì mọ́, ó sì tún ἀσεβ- ṣe láti mú ìtẹnumọ́ ẹsẹ náà hàn.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“i”) ń tọ́ka sí
  choice: Pa arọ́pò-orúkọ “i” mọ́ nínú àkọsílẹ̀ pàtàkì.
  alternative: Túmọ̀ ọ́ ní tààrà bí “Olúwa” tàbí “Ọlọ́run.”
  rationale: Ẹsẹ 14 jẹ́ kí ó hàn pé Olúwa ni ẹni tí a ń tọ́ka sí, ṣùgbọ́n Giriki lo arọ́pò-orúkọ. Pípa arọ́pò-orúkọ mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ orísun.
- issue: Ìtumọ̀ ìdájọ́ ti ἐλέγξαι
  choice: “fi ... hàn ní ẹlẹ́bi”
  alternative: “fi wọ́n hàn” tàbí “bá wọ́n wí”
  rationale: Nítorí pé ó tẹ̀ lé ποιῆσαι κρίσιν, àyíká náà jẹ́ ti ìdájọ́; síbẹ̀ àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí ṣí ohun tí kò tọ́ payá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní. A pa àtúnlò “àìbọ̀wọ̀ fún Ọlọ́run” mọ́ láti ṣàfihàn ìtẹnumọ́ ἀσεβ- inú Giriki, bí ó tilẹ̀ jẹ́ pé ó mú gbólóhùn náà gùn díẹ̀. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
