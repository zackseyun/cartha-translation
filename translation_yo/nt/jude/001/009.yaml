id: JUD.1.9
reference: Jude 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: yo
  text: Ṣùgbọ́n Míkáẹ́lì, áńgẹ́lì àgbà, nígbà tí ó ń bá Èṣù jiyàn, tí ó sì ń bá a jíròrò nípa ara Mósè, kò gbójúgbóyà láti gbé ìdájọ́ ẹ̀gàn kan kalẹ̀ sí i[a]; dípò bẹ́ẹ̀, ó ní[b], “Kí Olúwa bá ọ wí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ kan ṣe máa ń sọ ọ́, “kò gbójúgbóyà láti kéde ẹ̀sùn ẹ̀gàn sí i.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí dún bí Sekaráyà 3:2, níbi tí Olúwa ti bá Sátánì wí.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: olórí àwọn áńgẹ́lì
  rationale: Ó sọ ìtumọ̀ oyè náà ní Yorùbá tó ṣe kedere, dípò lílo ọ̀rọ̀ àyálò tí ọ̀pọ̀ òǹkàwé lè má lóye.
- source_word: διαβόλῳ
  choice: Èṣù
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ọ̀tá ẹ̀mí gẹ́gẹ́ bí ẹni pàtó; “Èṣù” ni orúkọ oyè tó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: διακρινόμενος ... διελέγετο
  choice: ń bá ... jiyàn, tí ó sì ń bá a ṣe àríyànjiyàn
  rationale: A pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́, a sì fi ìṣe tó ń lọ lọ́wọ́ hàn, bí àwọn ìrísí Gíríìkì ṣe ń fi ìjàkadì àti àríyànjiyàn ọ̀rọ̀ hàn.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: nípa ara Mósè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọ̀rọ̀ náà kan ara Mósè, ó sì pa ìtọ́kasí pàtó náà mọ́.
- source_word: οὐκ ἐτόλμησεν
  choice: kò gbójúgbóyà
  rationale: Ó mú ìtumọ̀ pé kò dáṣà tàbí kò láyà láti ṣe ohun náà jáde ní èdè Yorùbá àdánidá.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: láti dá a lẹ́jọ́ pẹ̀lú ọ̀rọ̀ ẹ̀gàn
  rationale: Gbólóhùn Gíríìkì náà ṣòro, ó sì lè túmọ̀ sí ìdájọ́ tàbí ẹ̀sùn tí ó ní ẹ̀gàn nínú. Ìtumọ̀ yìí pa ìrísí ìdájọ́ àti ọ̀rọ̀ ẹ̀gàn mọ́ láì sọ pé Míkáẹ́lì ń sọ̀rọ̀-òdì sí Ọlọ́run.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Kí Olúwa bá ọ wí
  rationale: “Kí ...” fi agbára optative Gíríìkì hàn gẹ́gẹ́ bí ìfẹ́ tàbí ìpè sí Olúwa pé kí ó ṣe ìbáwí náà.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó fìdí múlẹ̀ fún oyè κύριος ní irú àyíká yìí.
theological_decisions:
- issue: Ìkóra-ẹni-níjàánu Míkáẹ́lì nígbà tó ń bá Èṣù sọ̀rọ̀
  choice: Míkáẹ́lì kò fi ọ̀rọ̀ ẹ̀gàn dá Èṣù lẹ́jọ́ fúnra rẹ̀; ó fi ìbáwí náà lé Olúwa lọ́wọ́.
  alternative: Ó lè túmọ̀ sí pé Míkáẹ́lì kò kéde ẹ̀sùn ọ̀rọ̀-ìbàjẹ́ sí i, tàbí pé kò fẹ́ sọ ìdájọ́ kan tí yóò jẹ́ ọ̀rọ̀-òdì.
  rationale: 'A kò ṣàlàyé ẹ̀kọ́ nípa àwọn áńgẹ́lì ju ohun tí ẹsẹ náà sọ lọ. A pa ìyàtọ̀ tó ṣe kedere mọ́: Míkáẹ́lì kò gbé ìdájọ́ ẹ̀gàn kalẹ̀ fúnra rẹ̀, ṣùgbọ́n ó ké pe àṣẹ Olúwa.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ àti àìdánilójú inú Gíríìkì mọ́. A gbe àmì [a] sí lẹ́yìn gbólóhùn tí àlàyé rẹ̀ ń ṣàlàyé, a sì gbe [b] sí lẹ́yìn ọ̀rọ̀ ìṣáájú sí àsọyé Míkáẹ́lì.
