  source_fidelity: 'Ìtumọ̀ náà ń fi gbogbo àwọn èrò pàtàkì inú Gíríìkì hàn: Míkáẹ́lì, Èṣù, ìjiyàn nípa ara Mósè, ìkóra-ẹni-níjàánu rẹ̀ nípa ìdájọ́ ẹ̀gàn, àti ìfẹ́/ìpè náà pé kí Olúwa bá a wí. Síbẹ̀, “olórí àwọn áńgẹ́lì” lè dà bí ẹni tó jẹ́ olórí gbogbo àwọn áńgẹ́lì, níbi tí ἀρχάγγελος ti jẹ́ oyè ẹyọ kan. Bákan náà, lílo “jiyàn” àti “ṣe àríyànjiyàn” lẹ́sẹ̀kẹsẹ̀ jẹ́ àtúnsọ tó mú ìyàtọ̀ kékeré láàrin διακρινόμενος àti διελέγετο ṣòro láti gbọ́.'
