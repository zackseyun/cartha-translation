id: JUD.1.1
reference: Jude 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: yo
  text: 'Júdà, ẹrú Jésù Mèsáyà àti arákùnrin Jákọ́bù, sí àwọn tí a fẹ́ràn[a] nínú Ọlọ́run Baba, tí a pa mọ́ fún Jésù Mèsáyà[b], tí a sì pè[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “àwọn tí a sọ di mímọ́ nínú Ọlọ́run Baba” dípò “àwọn tí a fẹ́ràn nínú Ọlọ́run Baba.”
    reason: textual_variant
  - marker: b
    text: Ó tún lè jẹ́, “tí Jésù Mèsáyà pa mọ́.” Dative Gíríìkì lè tọ́ka sí ẹni tó ṣe iṣẹ́ náà (“láti ọwọ́” tàbí “nípasẹ̀”) tàbí sí ẹni tí a ṣe é fún (“fún”).
    reason: alternative_reading
  - marker: c
    text: Ní ti gírámà, ó tún ṣeé túmọ̀ ní ọ̀rọ̀-orúkọ gẹ́gẹ́ bí “àwọn tí a pè.”
    reason: previous_rendering
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí ó wà lábẹ́ ìní àti àṣẹ olúwa, kì í ṣe òṣìṣẹ́ lasán; “ẹrú” pa agbára ìfaramọ́ Júdà sí Jésù mọ́.
- source_word: Χριστοῦ / Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró náà, nítorí náà “Mèsáyà” fi ìtumọ̀ oyè náà hàn dípò lílo rẹ̀ bí orúkọ lásán.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: àti arákùnrin Jákọ́bù
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ níbí; “àti” jẹ́ èdè Yorùbá àdánidá, kò sì sọ ọ́ di ìtakora tí Gíríìkì kò béèrè.
- source_word: ἐν θεῷ πατρὶ
  choice: nínú Ọlọ́run Baba
  rationale: “Nínú” pa ìtumọ̀ ἐν gẹ́gẹ́ bí ipò tàbí àyíká ìbáṣepọ̀ mọ́ láì sọ ọ́ di “láti ọ̀dọ̀” tàbí “fún” láìní ẹ̀rí tó.
- source_word: ἠγαπημένοις
  choice: àwọn tí a fẹ́ràn
  rationale: Àpólà aláìṣe yìí tọ́ka sí àwọn tí wọ́n wà ní ipò jíjẹ́ ẹni ìfẹ́; ìṣe àìṣe Yorùbá kò fi ẹni tó fẹ́ràn wọn kún ọ̀rọ̀ Gíríìkì.
- source_word: τετηρημένοις
  choice: tí a pa mọ́ fún
  rationale: “Pa mọ́” sọ ìpamọ́ tàbí ìṣọ́ra tí ó ń bá a lọ; “fún” gbé ìtumọ̀ dative ti àǹfààní tàbí ìtọ́sọ́nà sí Jésù kalẹ̀, nígbà tí àṣàyàn “láti ọwọ́” wà ní àlàyé ìsàlẹ̀.
- source_word: κλητοῖς
  choice: tí a sì pè
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró fún àwọn olùgbà lẹ́tà; gbólóhùn ìṣe àìṣe yìí jẹ́ Yorùbá àdánidá, ó sì bá àwọn àpèjúwe méjì tó ṣáájú rẹ̀ mu.
- source_word: Ἰούδας / Ἰάκωβος
  choice: Júdà / Jákọ́bù
  rationale: Àwọn wọ̀nyí ni ọ̀nà Yorùbá tí a mọ̀ fún ṣíṣe àfihàn àwọn orúkọ Gíríìkì náà.
theological_decisions:
- issue: Ìbáṣepọ̀ τετηρημένοις pẹ̀lú Ἰησοῦ Χριστῷ
  choice: a pa mọ́ fún Jésù Mèsáyà
  alternative: Jésù Mèsáyà pa wọ́n mọ́
  rationale: Dative Gíríìkì lè tọ́ka sí ẹni tí a pa wọn mọ́ fún tàbí sí ẹni tó pa wọn mọ́. Àkọ́kọ́ ni a lò nínú ẹsẹ̀, ṣùgbọ́n a pa èkejì mọ́ nínú àlàyé láì fòpin sí àìdánilójú gírámà náà.
- issue: Ọ̀rọ̀ inú àfọwọ́kọ fún ἠγαπημένοις
  choice: àwọn tí a fẹ́ràn
  alternative: àwọn tí a sọ di mímọ́
  rationale: SBLGNT ní ἠγαπημένοις (“tí a fẹ́ràn”); àwọn àfọwọ́kọ kan ní ἡγιασμένοις (“tí a sọ di mímọ́”), nítorí náà àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn níbi tí ó ti yẹ, pẹ̀lú èdè tó lọ́lá ṣùgbọ́n tó yé òǹkàwé òde òní. A yan “ẹrú” láti pa agbára δοῦλος mọ́; a sì lo àwọn gbólóhùn ìṣe àìṣe fún àwọn àpólà Gíríìkì kí àtòjọ àwọn olùgbà lẹ́tà lè ṣàn lọ́nà Yorùbá àdánidá.
