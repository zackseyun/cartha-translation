id: JUD.1.25
reference: Jude 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: yo
  text: Fún Ọlọ́run kan ṣoṣo, Olùgbàlà wa, nípasẹ̀ Jésù, Mèsáyà náà[a], Olúwa wa, kí ògo, ọláńlá, agbára ìṣàkóso, àti àṣẹ jẹ́ tirẹ̀, ṣáájú gbogbo àkókò, nísinsìnyí, àti títí láéláé[b]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” A ti túmọ̀ oyè Gíríìkì náà Χριστός sí “Mèsáyà” láti fi ìtumọ̀ rẹ̀, ẹni tí a ti fi òróró yàn, hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ṣáájú gbogbo ìgbà ... àti sí gbogbo àwọn ìgbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: Ọlọ́run kan ṣoṣo
  rationale: Ó fi hàn pé Ọlọ́run nìkan ṣoṣo ni a ń sọ̀rọ̀ sí; ọ̀rọ̀ yìí sì jẹ́ ti Yorùbá àdánidá ju ìtumọ̀ líle bí ‘Ọlọ́run nìkan’ lọ nínú àyọkà ìyìn.
- source_word: σωτῆρι ἡμῶν
  choice: Olùgbàlà wa
  rationale: ‘Olùgbàlà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún ẹni tí ń gbani là, ó sì bá àyíká ìgbàlà àti ìyìn inú lẹ́tà Júdà mu.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: nípasẹ̀ Jésù Mèsáyà Olúwa wa
  rationale: ‘Nípasẹ̀’ pa ìtumọ̀ ọ̀nà tàbí alárinà mọ́; ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè, ‘Olúwa wa’ sì dúró gẹ́gẹ́ bí àfikún tó ń ṣàlàyé ẹni tí Jésù jẹ́.
- source_word: δόξα
  choice: ògo
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún δόξα nínú ọ̀rọ̀ ìyìn.
- source_word: μεγαλωσύνη
  choice: ọláńlá
  rationale: Ó mú ìtumọ̀ títóbi àti ọlá gíga tí μεγαλωσύνη ní jáde láìdín in kù sí ‘titobi’ lásán.
- source_word: κράτος
  choice: agbára ìṣàkóso
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi agbára tó ń ṣiṣẹ́ nínú ìṣàkóso hàn, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ἐξουσία.
- source_word: ἐξουσία
  choice: àṣẹ
  rationale: ‘Àṣẹ’ fi ẹ̀tọ́ àti agbára láti pàṣẹ hàn, ní ìyàtọ̀ sí agbára ìṣàkóso.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: ṣáájú gbogbo àkókò
  rationale: Ó sọ ìtẹ̀sí sí ohun tó wà ṣáájú gbogbo àkókò ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan nípa ‘ìgbà’ pamọ́.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: nísinsìnyí àti títí láéláé
  rationale: Ó pa ìlọsíwájú láti ìsinsìnyí dé ayérayé mọ́ ní ọ̀nà tí ó ṣe àdánidá ní Yorùbá.
theological_decisions:
- issue: Ibi tí gbólóhùn alárinà ‘nípasẹ̀ Jésù Mèsáyà’ so mọ́
  choice: A pa á mọ́ lẹ́yìn ‘Ọlọ́run kan ṣoṣo, Olùgbàlà wa,’ bí ó ti rí nínú Gíríìkì.
  alternative: A lè tún gbolohun náà tò kí ó fi hàn kedere pé ìyìn ni a ń fi fún Ọlọ́run nípasẹ̀ Jésù.
  rationale: Ìtò yìí pa ìdojúkọ ìyìn sí Ọlọ́run kan ṣoṣo àti ipa Jésù gẹ́gẹ́ bí alárinà mọ́, láìfi ipa mú ìbátan gírámà tí orísun náà kò sọ di mímọ́ pátápátá.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì-òróró náà; ‘Mèsáyà’ mú ìtumọ̀ oyè yẹn jáde, nígbà tí àlàyé ìsàlẹ̀ darukọ ọ̀nà ìtumọ̀ míì tí ó wọ́pọ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Ìtò ‘Fún … ni kí … jẹ́ tirẹ̀’ pa ìrísí orin ìyìn mọ́, àwọn àmì ohùn sì wà níbi tí wọ́n ti yẹ.
