id: JUD.1.11
reference: Jude 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: yo
  text: Ègbé ni fún wọn[a], nítorí wọ́n ti rìn ní ọ̀nà Kéènì, wọ́n sì ti jù ara wọn sínú ìṣìnà Báláámù nítorí èrè, wọ́n sì ti ṣègbé nínú ìṣọ̀tẹ̀ Kórà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí èrè, wọ́n fi ìkanra wọ inú ìṣìnà Báláámù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ
  choice: Ègbé ni fún wọn
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àwọn wòlíì mọ́; ó lágbára ju ọ̀rọ̀ àánú bí ‘Ó ṣe!’ lọ.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: wọ́n ti rìn ní ọ̀nà Kéènì
  rationale: ‘Rìn ní ọ̀nà’ jẹ́ àkàwé Yorùbá tó ṣe kedere fún títẹ̀lé ìwà tàbí ìlànà ẹnì kan, ó sì pa àwòrán ὁδός àti ἐπορεύθησαν mọ́.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: sínú ìṣìnà Báláámù
  rationale: Ìṣìnà lè túmọ̀ sí ọ̀nà àṣìṣe tàbí ìṣìnà nípa ìwà; ‘sínú’ fi ìṣípò tí gbólóhùn náà ń ṣàpẹẹrẹ hàn.
- source_word: μισθοῦ
  choice: nítorí èrè
  rationale: Ó sọ ìdí oníwọra tí ọ̀rọ̀ Gíríìkì fi hàn ní Yorùbá àdánidá; ‘èrè’ lè jẹ́ owó tàbí ohun tí ènìyàn ń jèrè.
- source_word: ἐξεχύθησαν
  choice: wọ́n ti tú ara wọn dà
  rationale: Ó pa àwòrán lílágbára ti ‘tú jáde’ mọ́, ó sì fi ìfiara-ẹni-sílẹ̀ sí ìṣe náà hàn láì sọ àlàyé náà di ohun kan ṣoṣo.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: nínú ìṣọ̀tẹ̀ Kórà
  rationale: Ní ìbámu pẹ̀lú ìtọ́kasí sí Númérì 16, ‘ìṣọ̀tẹ̀’ sọ ìtakò Kórà di mímọ̀ ju ‘àríyànjiyàn’ lọ.
- source_word: ἀπώλοντο
  choice: wọ́n sì ti ṣègbé
  rationale: ‘Ṣègbé’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún píparun tàbí ṣíṣègbé, ó sì ní ìwọ̀n ọ̀rọ̀ ìdájọ́ tó yẹ.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: Kéènì / Báláámù / Kórà
  rationale: Àwọn wọ̀nyí ni àkọsílẹ̀ orúkọ tó faramọ́ ní àṣà Bíbélì Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ gbólóhùn líle καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: wọ́n sì ti tú ara wọn dà sínú ìṣìnà Báláámù nítorí èrè
  alternative: nítorí èrè, wọ́n sì ti fi ìkanra wọ inú ìṣìnà Báláámù
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán ἐξεχύθησαν (‘tú jáde’) àti ìdí èrè ti μισθοῦ mọ́. Nítorí gbólóhùn Gíríìkì náà kúkúrú, ó sì ní àkàwé tí kò rọrùn, àlàyé ìtumọ̀ tó jẹ́ àdánidá sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. Ìṣọ̀kan gbólóhùn mẹ́ta—Kéènì, Báláámù, àti Kórà—ni a pa mọ́, pẹ̀lú àkàwé ‘rìn ní ọ̀nà’ àti ‘tú ara wọn dà.’
