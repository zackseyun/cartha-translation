  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: yo
  text: Àwọn wọ̀nyí ni àwọn tí ń fa ìpín[a], àwọn tí ìwàláàyè ẹ̀dá lásán ń darí[b], tí kò ní Ẹ̀mí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ń ya ara wọn sọ́tọ̀” tàbí “àwọn tí ń fa ìyapa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn aláìní ìwà-ẹ̀mí” tàbí “àwọn tí ìwà ẹ̀dá ń darí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹ̀mí”; ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù lọ pé Ẹ̀mí Mímọ́ ni.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Àwọn wọ̀nyí
  rationale: Ó ń tọ́ka sí àwọn olùkọ́ èké tí a ti ṣàpèjúwe ṣáájú; ó sì pa agbára ọ̀rọ̀ ìtọ́kasí Gíríìkì mọ́.
- source_word: οἱ ἀποδιορίζοντες
  choice: àwọn tí ń fa ìyapa
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ìṣe wọn gẹ́gẹ́ bí àwọn tó ń dá ìpín sílẹ̀ láàárín àwọn ènìyàn. Ìtumọ̀ pé wọ́n ń ya ara wọn sọ́tọ̀ tún ṣeé ṣe, nítorí náà a fi sí àlàyé ìsàlẹ̀.
- source_word: ψυχικοί
  choice: àwọn ènìyàn ti ẹ̀dá lásán
  rationale: Ó tọ́ka sí àwọn tí ìwàláàyè ẹ̀dá ènìyàn lásán ń darí, ní ìtakora sí àwọn tí Ẹ̀mí Ọlọ́run ń darí. Ìtumọ̀ yìí pa ìyàtọ̀ inú ẹsẹ náà mọ́ láì fi èrò ẹ̀sìn kan kún un.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Nínú àyíká ọ̀rọ̀ náà, ó ṣeé ṣe jù lọ pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fi ìdájọ́ ìtumọ̀ yìí hàn, ṣùgbọ́n a pa àṣàyàn ‘ẹ̀mí’ mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: μὴ ἔχοντες
  choice: tí kò ní
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àkópọ̀ ọ̀rọ̀ aláìní ti Gíríìkì mu.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ẹ̀mí ní ìtumọ̀ gbogbogbòò
  rationale: Ìtakora tó wà láàárín ψυχικοί àti πνεῦμα mú kí Ẹ̀mí Mímọ́ jẹ́ ìtumọ̀ tó ṣeé ṣe jù lọ nínú àyíká ọ̀rọ̀ Júdà. Síbẹ̀, nítorí pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lè túmọ̀ sí ‘ẹ̀mí,’ a fi àṣàyàn náà sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ti ẹ̀dá lásán” láti ṣàfihàn ψυχικοί láì mú kí ó túmọ̀ sí ìfẹ́ ayé tàbí ìwà búburú nìkan.
