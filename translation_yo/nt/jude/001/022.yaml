  text: And have mercy on those who are doubting,[a]
translation:
  language: yo
  text: Ẹ sì ṣàánú àwọn tí ń ṣiyèméjì,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ń yẹ̀sẹ̀”; ó sì ṣeé ṣe kó túmọ̀ sí “àwọn tí ń jiyàn.” Ọ̀rọ̀ Gíríìkì náà lè ní ju ìtumọ̀ kan lọ nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ẹ sì
  rationale: “Sì” so ìṣírí yìí mọ́ àwọn ìṣírí tó yí i ká; “Ẹ” tún fi hàn pé ọ̀rọ̀ àṣẹ náà ń tọ́ka sí ọ̀pọ̀ ènìyàn.
- source_word: οὓς μὲν
  choice: àwọn tí
  rationale: Gbólóhùn yìí bẹ̀rẹ̀ sí í dá ẹgbẹ́ kan yà sọ́tọ̀ lára àwọn ẹgbẹ́ tí a mẹ́nu kàn ní ọ̀rọ̀ tó tẹ̀ lé e; Yorùbá kò nílò kí a tú μέν sí ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: ἐλεᾶτε
  choice: ṣàánú fún
  rationale: Ó jẹ́ ọ̀rọ̀ àṣẹ pé kí wọ́n fi àánú àti ìyọ́nú hàn sí àwọn ẹni náà; “ṣàánú fún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: διακρινομένους
  choice: tí ń ṣiyèméjì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó lè tọ́ka sí àwọn tí ọkàn wọn kò balẹ̀ tàbí tí wọn kò dá ohun kan lójú. A yan “ń ṣiyèméjì” gẹ́gẹ́ bí ìtumọ̀ tó ṣeé lóye jù, ṣùgbọ́n a pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ διακρινομένους nínú ìṣírí láti ṣàánú àwọn tó wà nínú ewu nípa ẹ̀mí
  choice: àwọn tí ń ṣiyèméjì
  alternative: àwọn tí ń yí ọkàn padà síwá-sẹ́yìn; tàbí àwọn tí ń jiyàn
  rationale: “Ṣiyèméjì” fi àwọn ẹni náà hàn gẹ́gẹ́ bí ẹni tí kò dá ohun kan lójú, kì í ṣe dandan bí ọ̀tá. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó ju ẹyọ kan lọ, nítorí náà a kò mú àìdánilójú inú rẹ̀ kúrò, a sì ṣàkọsílẹ̀ àwọn àṣàyàn mìíràn.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa ìṣírí náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àṣẹ sí ọ̀pọ̀ ènìyàn.
