id: JUD.1.12
reference: Jude 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: yo
  text: Àwọn wọ̀nyí ni àpáta tó farasin nínú omi ní àwọn àsè ìfẹ́ yín[a]. Wọ́n ń bá yín jẹ àsè láìbẹ̀rù, wọ́n ń ṣe olùṣọ́-àgùntàn fún ara wọn[b][c]. Wọ́n jẹ́ ìkùukùu tí kò ní omi, tí ẹ̀fúùfù ń gbé lọ; àwọn igi ní ìgbà ìwọ́wé tí kò ní èso, tí ó kú lẹ́ẹ̀mejì, tí a sì fà tu pẹ̀lú gbòǹgbò wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àbàwọ́n” tàbí “àbùkù” ní àwọn àsè ìfẹ́ yín. Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àbùkù ìwà, ṣùgbọ́n ó tún lè túmọ̀ sí àpáta abẹ́ omi tó léwu; ìtumọ̀ kejì yìí bá ìtòlẹ́sẹẹsẹ àwọn àkàwé aláwòrán tí Júdà lò mu jù.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ “wọ́n ń ṣe olùṣọ́-àgùntàn fún ara wọn” sí “wọ́n ń bọ́ ara wọn,” èyí tó tẹnu mọ́ ìwà ìmọtara-ẹni-nìkan wọn.
    reason: lexical_alternative
  - marker: c
    text: Wo Ìsíkíẹ́lì 34 fún àwòrán àwọn olùṣọ́ tí ń bọ́ ara wọn dípò kí wọ́n bọ́ agbo ẹran.
    reason: cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: àpáta tó fara sin sábẹ́ omi
  rationale: Ó pa àwòrán àwọn àpáta inú omi tí kò hàn gbangba, tí ó sì lèwu, mọ́; ó tún bá ọ̀wọ́ àwọn àwòrán àdánidá inú ẹsẹ yìí mu.
- source_word: ἀγάπαις
  choice: àwọn àsè ìfẹ́
  rationale: Ọ̀rọ̀ ọ̀pọ̀ yìí ń tọ́ka sí oúnjẹ àjọṣe tí àwọn onígbàgbọ́ ń jẹ papọ̀ nínú ìfẹ́; ‘àsè ìfẹ́’ pa ìsopọ̀ rẹ̀ mọ́ ìfẹ́ mọ́.
- source_word: συνευωχούμενοι
  choice: wọ́n ń bá yín jẹ àsè
  rationale: Ó sọ kedere pé àwọn ẹni náà ń kópa nínú àsè àjọṣe pẹ̀lú wọn, ní èdè Yorùbá àdánidá.
- source_word: ἀφόβως
  choice: láìbẹ̀rù
  rationale: Ó pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ láàárín àìní ìbẹ̀rù, àìní ìtìjú, àti àìní ọ̀wọ̀.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: wọ́n ń ṣe olùṣọ́-àgùntàn fún ara wọn
  rationale: Ó pa àkàwé olùṣọ́-àgùntàn mọ́, dípò kí a dín un kù sí jíjẹ oúnjẹ nìkan; ó tún jẹ́ kí ìṣọ̀kan pẹ̀lú Ìsíkíẹ́lì 34 dúró.
- source_word: νεφέλαι ἄνυδροι
  choice: ìkùukùu tí kò ní omi
  rationale: Ìtumọ̀ yìí ṣe àwòrán ìlérí òjò tí kò mú ohun tí a ń retí wá.
- source_word: παραφερόμεναι
  choice: tí ẹ̀fúùfù ń gbá kiri
  rationale: Ó fi hàn pé agbára òde ni ń gbé àwọn ìkùukùu náà kiri.
- source_word: φθινοπωρινὰ
  choice: igi ìgbà ìwọ́wé
  rationale: Ó tọ́ka sí àsìkò ìwọ́wé, nígbà tí a lè retí èso, ó sì pa àwòrán àsìkò inú orísun mọ́.
- source_word: ἄκαρπα
  choice: tí kò ní èso
  rationale: Ó pa àwòrán gidi ti igi aláìléso mọ́ láìyí i padà sí àlàyé àkàwé.
- source_word: δὶς ἀποθανόντα
  choice: tí ó kú lẹ́ẹ̀mejì
  rationale: Ó pa ọ̀rọ̀ líle àti ìyanu inú Gíríìkì mọ́ láìṣàlàyé rẹ̀ ju bí orísun ṣe ṣe lọ.
- source_word: ἐκριζωθέντα
  choice: tí a sì fà tu kúrò ní gbòǹgbò
  rationale: Ó jẹ́ àwòrán kedere pé a ti fa igi náà tu pátápátá, tí kò sì ní ìyè mọ́.
theological_decisions:
- issue: Ìtumọ̀ σπιλάδες nípa àwọn olùkọ́ èké
  choice: àwọn àpáta tó fara sin sábẹ́ omi, tí ó jẹ́ ewu àṣírí láàárín àsè àjọṣe
  alternative: àbàwọ́n tàbí àbùkù ní àwọn àsè ìfẹ́
  rationale: Ọ̀wọ́ àwọn àkàwé àdánidá tí ó tẹ̀ lé e mú kí àpáta abẹ́ omi bá ọ̀rọ̀ mu dáadáa; àmọ́ àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ ìṣe-ìwà tí ó ṣeé ṣe mọ́.
- issue: Agbára ποιμαίνοντες nínú ἑαυτοὺς ποιμαίνοντες
  choice: a pa àkàwé olùṣọ́-àgùntàn mọ́
  alternative: wọ́n ń bọ́ ara wọn
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì sábà túmọ̀ sí ṣíṣe iṣẹ́ olùṣọ́; ìtumọ̀ yìí kò dín àwòrán náà kù, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú Ìsíkíẹ́lì 34 hàn.
translation_notes:
  register: A lo Yorùbá àkókò yìí tí ó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ. Àwọn àkàwé orísun—àpáta abẹ́ omi, olùṣọ́-àgùntàn, ìkùukùu aláìní omi, àti igi aláìléso—ni a pa mọ́, pẹ̀lú gbolohun líle náà “kú lẹ́ẹ̀mejì.”
