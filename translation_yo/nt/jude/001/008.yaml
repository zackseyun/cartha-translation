id: JUD.1.8
reference: Jude 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: yo
  text: Síbẹ̀, ní ọ̀nà kan náà, àwọn ènìyàn wọ̀nyí náà, tí wọ́n ń lá àlá[a], ń sọ ara di ẹlẹ́gbin, wọ́n kọ àṣẹ sílẹ̀, wọ́n sì ń sọ ọ̀rọ̀ ẹ̀gàn sí àwọn ológo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ní ìgbẹ́kẹ̀lé sí àlá.” Aláìlópìn Gíríìkì náà lè ní ìtumọ̀ pé wọ́n ń lo àlá gẹ́gẹ́ bí ìdí tàbí ìdáláre fún ìwà wọn.'
    reason: lexical_alternative
  - marker: b
    text: '“Àwọn ológo” lè tọ́ka sí àwọn ẹ̀dá ọ̀run tí a gbé ga, bóyá àwọn áńgẹ́lì. Ní Gíríìkì: “àwọn ògo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Síbẹ̀, ní ọ̀nà kan náà
  rationale: “Síbẹ̀” mú agbára ìtakora μέντοι jáde, “ní ọ̀nà kan náà” sì pa ìfiwéra ὁμοίως mọ́ pẹ̀lú àwọn àpẹẹrẹ tó ṣáájú.
- source_word: οὗτοι
  choice: àwọn ènìyàn wọ̀nyí
  rationale: Ó tọ́ka sí àwọn tó yọ́ wọ inú ẹgbẹ́ tí àyíká ọ̀rọ̀ ń ṣàpèjúwe, láìfi akọ tàbí abo kún ohun tí Gíríìkì kò sọ.
- source_word: ἐνυπνιαζόμενοι
  choice: tí wọ́n gbára lé àlá wọn
  rationale: 'Ọ̀rọ̀ aláìlópìn náà lè fi ìpìlẹ̀ tàbí ọ̀nà ìṣe wọn hàn: wọ́n ń lo ìrírí àlá gẹ́gẹ́ bí àṣẹ fún ìwà wọn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gígúnná jù lọ, “tí wọ́n ń lá àlá,” mọ́.'
- source_word: σάρκα μὲν μιαίνουσιν
  choice: ń sọ ara di ẹlẹ́gbin
  rationale: “Ara” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún σάρξ ní àyíká ìwà àìmọ́ yìí, “sọ ... di ẹlẹ́gbin” sì mú ìtumọ̀ ìbàjẹ́ ti μιαίνω jáde láìsọ irú ẹ̀ṣẹ̀ pàtó tí ẹsẹ̀ náà kò dárúkọ.
- source_word: κυριότητα δὲ ἀθετοῦσιν
  choice: wọ́n kọ ọlá-àṣẹ sílẹ̀
  rationale: “Ọlá-àṣẹ” pa àlàyé κυριότης mọ́ láìpinnu bóyá Ọlọ́run, àwọn ẹ̀dá ọ̀run, tàbí àṣẹ ní gbogbogbòò ni a ń tọ́ka sí; “kọ ... sílẹ̀” fi ìkọ̀ tàbí ìtìlẹ́yìn-kúrò ti ἀθετέω hàn.
- source_word: δόξας δὲ βλασφημοῦσιν
  choice: wọ́n sì ń sọ̀rọ̀-òdì sí àwọn ológo
  rationale: “Àwọn ológo” pa ọ̀pọ̀ δόξας àti àìdánimọ̀ àwọn tí a tọ́ka sí mọ́; “sọ̀rọ̀-òdì sí” jẹ́ ọ̀rọ̀ Yorùbá adayeba fún ọ̀rọ̀ ẹ̀gàn tàbí ìbúra-òdì ti βλασφημέω nínú àyíká yìí.
theological_decisions:
- issue: Ẹni tàbí ohun tí δόξας ń tọ́ka sí
  choice: Àwọn ológo, gẹ́gẹ́ bí ọ̀rọ̀ gbòòrò fún àwọn ẹ̀dá ọ̀run tí wọ́n ní ògo
  alternative: Àwọn áńgẹ́lì; àwọn ọlá ọ̀run; “àwọn ògo” ní gígúnná
  rationale: Júdà 1:9 mú kí àwọn ẹ̀dá ọ̀run ṣeé ṣe gan-an, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ “áńgẹ́lì” ní tààrà. Nítorí náà, ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé ohun tó ṣeé ṣe.
- issue: Agbára ἐνυπνιαζόμενοι
  choice: Ìwà wọn ní ìbáṣepọ̀ pẹ̀lú gbígbára lé àlá
  alternative: Wọ́n kàn ń lá àlá; wọ́n jẹ́ alálàá
  rationale: Aláìlópìn náà lè ṣàlàyé ìpìlẹ̀ ìṣe wọn, ṣùgbọ́n gígúnná “tí wọ́n ń lá àlá” tún ṣeé ṣe; a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ohùn ọ̀wọ̀, kedere, tí ó sì yẹ fún kíkà ní gbangba. A lo “ọlá-àṣẹ” àti “àwọn ológo” láti pa àìdánilójú inú Gíríìkì mọ́, a sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ̀ náà.
