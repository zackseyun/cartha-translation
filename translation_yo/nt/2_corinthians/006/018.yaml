id: 2CO.6.18
reference: 2 Corinthians 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: yo
  text: “Èmi yóò sì jẹ́ Baba fún yín,[a] ẹ̀yin yóò sì jẹ́ àwọn ọmọkùnrin àti ọmọbìnrin fún mi,” ni Olúwa Olódùmarè wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, “Èmi yóò jẹ́ fún yín sí ipò Baba, ẹ̀yin yóò sì jẹ́ fún mi sí ipò àwọn ọmọkùnrin àti ọmọbìnrin.” Ọ̀nà gbólóhùn Gíríìkì náà ń fi ìbáṣepọ̀ májẹ̀mú hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: Èmi yóò sì jẹ́ Baba fún yín
  rationale: Ọ̀rọ̀ yìí fi ìbáṣepọ̀ májẹ̀mú hàn. ‘Jẹ́ Baba fún yín’ jẹ́ Yorùbá àdánidá tí ó tún pa ìtumọ̀ àti ìṣọ̀kan gbolohun Gíríìkì mọ́; ‘Èmi’ mú ìtẹnumọ́ inú ọ̀rọ̀ náà jáde.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: ẹ̀yin yóò sì jẹ́ ... fún mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς wà ní kedere, nítorí náà ‘ẹ̀yin’ pa ìtẹnumọ́ àti ìbáṣepọ̀ alábápín pẹ̀lú ‘Èmi’ mọ́.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: ọmọkùnrin àti ọmọbìnrin
  rationale: Gíríìkì dárúkọ akọ àti abo ní pàtó; yíyan ọ̀rọ̀ méjèèjì kò sọ ìtumọ̀ náà di ‘àwọn ọmọ’ lásán.
- source_word: λέγει
  choice: ni ... wí
  rationale: Ilana ‘ni X wí’ jẹ́ ọ̀nà Yorùbá ọlọ́lá àti àdánidá fún gbólóhùn ìtọ́kasí àsọtẹ́lẹ̀, ó sì lè gbé agbára ọ̀rọ̀ ìwé mímọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni àfiwé Yorùbá tí ó wọ́pọ̀, tí ó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Ọlọ́run níbí.
- source_word: παντοκράτωρ
  choice: Olódùmarè
  rationale: ‘Olódùmarè’ jẹ́ orúkọ oyè Yorùbá ọlọ́lá fún Ọlọ́run aláṣẹ gbogbo; ní àjọpọ̀ ‘Olúwa Olódùmarè,’ ó mú ìwọ̀n κύριος παντοκράτωρ jáde láì fi orúkọ oyè míràn bí ‘Olúwa àwọn ọmọ-ogun’ wọlé.
theological_decisions:
- issue: Bí a ṣe máa pa ìdárúkọ akọ àti abo nínú ìbáṣepọ̀ ọmọ mọ́
  choice: ọmọkùnrin àti ọmọbìnrin
  alternative: àwọn ọmọ
  rationale: υἱοὺς καὶ θυγατέρας dárúkọ ọmọkùnrin àti ọmọbìnrin ní tààrà; ‘àwọn ọmọ’ yóò mú ìtẹnumọ́ yìí kúrò.
- issue: Bí a ṣe máa túmọ̀ κύριος παντοκράτωρ gẹ́gẹ́ bí orúkọ oyè Ọlọ́run
  choice: Olúwa Olódùmarè
  alternative: Olúwa Alágbára-gbogbo; Olúwa àwọn ọmọ-ogun
  rationale: Yíyan yìí pa κύριος mọ́ gẹ́gẹ́ bí ‘Olúwa,’ ó sì sọ παντοκράτωρ ní ọ̀nà Yorùbá ọlọ́lá láì yí i sí orúkọ oyè Heberu míràn tí kò sí nínú Gíríìkì ẹsẹ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹnumọ́ ‘Èmi/ẹ̀yin’ àti ìṣọ̀kan ìbáṣepọ̀ inú Gíríìkì mọ́.
