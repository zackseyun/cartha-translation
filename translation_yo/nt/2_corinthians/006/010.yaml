  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtẹ̀lé ọ̀rọ̀ Gíríìkì mọ́ dáadáa: àwọn àfiwé mẹ́tẹ̀ẹ̀ta, ìtakora δέ, ‘nígbà gbogbo,’ àti ìyàlẹ́nu pé a kò ní nǹkan kan ṣùgbọ́n a ní ohun gbogbo. Àmọ́, ‘bí ẹni tí a ń banújẹ́’ kò bá ọ̀pọ̀ ẹni nínú Gíríìkì mu dáadáa, ó sì lè dà bí ẹni pé ‘a’ ń fa ìbànújẹ́ sí ẹlòmíràn. Àtúnṣe náà mú ìtumọ̀ ‘àwọn tí ń banujẹ́’ hàn kedere láì sọ ohun tó fa ìbànújẹ́ náà.'
  naturalness: ‘A ní ohun gbogbo ní ìní’ jẹ́ ìtẹnumọ́ tí ó lè dùn bí àtúnsọ nínú Yorùbá. ‘A sì ní ohun gbogbo’ jẹ́ èdè àdánidá, ó sì tún pa ìtakora pẹ̀lú ‘kò ní nǹkan kan’ mọ́. Ìṣètò ‘bí àwọn tí …, síbẹ̀ tí …’ tún ń jẹ́ kí àwọn gbolohun mẹ́tẹ̀ẹ̀ta náà ní ìfararora tó rọrùn láti ka.
  terminology: ‘Òtòṣì,’ ‘sọ … di ọlọ́rọ̀,’ ‘banujẹ́,’ àti ‘yọ̀’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu ní Yorùbá òde òní. A kò sọ pé ọ̀rọ̀ tàbí ohun gbogbo náà jẹ́ ti ẹ̀mí nínú ẹsẹ̀ pàtàkì, nítorí Gíríìkì kò ṣàlàyé bẹ́ẹ̀. Àkọsílẹ̀ a nínú àkọ́kọ́ kò jẹ́ àṣàyàn ọ̀rọ̀ míràn rárá; a ti fi àṣàyàn gidi sí i.
  issues:
  - severity: medium
    issue: Gbolohun ‘bí ẹni tí a ń banújẹ́’ ní àìfararora nípa nọ́ńbà àti ìtumọ̀.
    rationale: ‘Ẹni’ jẹ́ ọ̀kan, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ ẹni; sí i, ‘a ń banújẹ́’ lè ka sí ‘we are sad’ tàbí sí ìṣe tí a ń ṣe sí ẹlòmíràn nínú ìṣètò yìí. ‘Bí àwọn tí ń banujẹ́’ jẹ́ kedere, ó sì pa àìsọ ẹni tó fa ìbànújẹ́ mọ́.
  - severity: low
    issue: ‘A ní ohun gbogbo ní ìní’ kì í ṣe ọ̀nà tó rọrùn jù lọ nínú Yorùbá.
    rationale: Ọ̀rọ̀ náà tún ‘ní’ ṣe, nígbà tí ‘a sì ní ohun gbogbo’ ti ń sọ ìní/ìní ọwọ́ tí κατέχοντες ń tọ́ka sí ní kíkún láàárín ìtakora ẹsẹ̀ náà.
  - severity: medium
    issue: Àkọsílẹ̀ a tún gbolohun inú ẹsẹ̀ sọ dípò kí ó fúnni ní àṣàyàn ìtumọ̀.
    rationale: Ìdí àkọsílẹ̀ náà ni lexical_alternative. Ó yẹ kí ó fúnni ní ‘a ń mú ọ̀pọ̀ ènìyàn lọ́rọ̀’ gẹ́gẹ́ bí ọ̀nà míràn láti tú πλουτίζοντες, láì fi ìtumọ̀ ẹ̀mí tàbí ti ohun ayé lé e lórí.
