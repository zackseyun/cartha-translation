id: 2CO.6.10
reference: 2 Corinthians 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: yo
  text: bí àwọn tí ń banujẹ́, síbẹ̀ tí ń yọ̀ nígbà gbogbo; bí òtòṣì, síbẹ̀ tí ń sọ ọ̀pọ̀ ènìyàn di ọlọ́rọ̀[a]; bí àwọn tí kò ní nǹkan kan, síbẹ̀ tí ń ní ohun gbogbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń mú ọ̀pọ̀ ènìyàn lọ́rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Pọ́ọ̀lù fi èyí sọ ìtakora tó wà láàárín àìní tí ó hàn níta àti níní ohun gbogbo ní ọ̀nà tó jinlẹ̀; ẹsẹ̀ náà fúnra rẹ̀ kò ṣàlàyé irú ìní náà síwájú sí i.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: bí ẹni tí / bí
  rationale: Ó pa ìṣètò àfiwé tí Pọ́ọ̀lù tún ṣe mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ irú ìtakora yìí mu.
- source_word: λυπούμενοι
  choice: a ń banújẹ́
  rationale: Ó fi ipò ìbànújẹ́ tí ń bá a lọ hàn láì sọ ẹni tàbí ohun tó ń fa á ní pàtó.
- source_word: ἀεὶ δὲ χαίροντες
  choice: síbẹ̀ a ń yọ̀ nígbà gbogbo
  rationale: “Síbẹ̀” mú ìtakora δέ jáde, “nígbà gbogbo” sì dúró fún ἀεί; “a ń yọ̀” fi ayọ̀ tí ń bá a lọ hàn.
- source_word: πτωχοὶ
  choice: òtòṣì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe tààrà fún ẹni tí kò lówó tàbí ohun ìní, láì mú ìtumọ̀ náà le ju ti Gíríìkì lọ.
- source_word: πλουτίζοντες
  choice: a ń sọ ọ̀pọ̀ ènìyàn di ọlọ́rọ̀
  rationale: Ó tú ìṣe “mú kí ó di ọlọ́rọ̀” yékéyéké, ṣùgbọ́n kò fi kún un pé ọrọ̀ nípa ẹ̀mí nìkan ni.
- source_word: μηδὲν ἔχοντες
  choice: ẹni tí kò ní nǹkan kan
  rationale: Ó pa àwòrán àìní pátápátá mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: πάντα κατέχοντες
  choice: a ní ohun gbogbo ní ìní
  rationale: “Ní ìní” mú agbára κατέχω gẹ́gẹ́ bí ohun tí a ní tàbí tí a dì mú jáde, ó sì jẹ́ kí ìtakora pẹ̀lú “kò ní nǹkan kan” dúró.
theological_decisions:
- issue: Irú ọrọ̀ àti ohun ìní tí Pọ́ọ̀lù ń sọ̀rọ̀ nípa rẹ̀
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààrà, a kò sì fi “nípa ẹ̀mí” sínú ẹsẹ̀ náà.
  alternative: Kí a sọ ní gbangba pé ọrọ̀ àti ohun gbogbo náà jẹ́ ọrọ̀ nípa ẹ̀mí nínú Kristi.
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ọrọ̀ jinlẹ̀ tí kì í ṣe ti ohun ayé, ṣùgbọ́n Gíríìkì kò fi àlàyé yẹn kún un. Fífi ìtakora náà sílẹ̀ bó ṣe rí ń pa agbára ọ̀rọ̀ Pọ́ọ̀lù àti àìdájú tí ó mọ̀ọ́mọ̀ lò mọ́.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àrọ́pò-orúkọ “a” bá ẹni púpọ̀ inú Gíríìkì mu, ó sì tọ́ka sí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn. A tún “bí” àti “síbẹ̀” ṣe láti pa ìlù àti ìtakora àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta mọ́.
