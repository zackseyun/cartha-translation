id: 2CO.6.7
reference: 2 Corinthians 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: yo
  text: nínú ọ̀rọ̀ òtítọ́, nínú agbára Ọlọ́run; nípasẹ̀ àwọn ohun ìjà òdodo[a] ní ọwọ́ ọ̀tún àti ní ọwọ́ òsì[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun ìjà ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí gbólóhùn yìí tọ́ka sí ohun ìjà tí a ń lò ní ọwọ́ méjèèjì, tó sì ń fi ìmúrasílẹ̀ pípé fún ìkọlù àti ìdáàbòbò hàn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “fún ọwọ́ ọ̀tún àti fún ọwọ́ òsì.” Gíríìkì sọ ní ṣókí pé “ti ọ̀tún àti ti òsì.”
    reason: translation_alternative
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: ọ̀rọ̀ òtítọ́
  rationale: “Ọ̀rọ̀ òtítọ́” pa ìṣètò Gíríìkì mọ́, ó sì lè tọ́ka sí ọ̀rọ̀ tí ó jẹ́ òtítọ́ tàbí sí ìhìn iṣẹ́ òtítọ́ láìfi ipa mú ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ náà.
- source_word: δυνάμει θεοῦ
  choice: agbára Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì pa ìlù ìtúnsọ “nínú ... nínú ...” (ἐν ... ἐν ...) mọ́.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ inú genitive, διά ń fi ohun èlò tàbí ọ̀nà tí a fi ń ṣe nǹkan hàn; “nípasẹ̀” mú ìtumọ̀ yìí jáde kedere.
- source_word: ὅπλων
  choice: àwọn ohun ìjà
  rationale: ὅπλον lè jẹ́ ohun èlò ogun fún ìkọlù tàbí fún ìdáàbòbò; “ohun ìjà” gbòòrò tó láti gba méjèèjì.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tí ó bójú mu jù fún δικαιοσύνη níbí, ó sì lè gba ìwà títọ́ àti ìdájọ́ tí ó tọ́ láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: ní ọwọ́ ọ̀tún àti ní ọwọ́ òsì
  rationale: Àwọn ajẹtífù náà dúró bí ọ̀rọ̀-orúkọ, wọ́n sì ṣeé lóye gẹ́gẹ́ bí ọwọ́ méjèèjì. Fífi “ọwọ́” kún un jẹ́ dandan fún Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa bí Gíríìkì ṣe há pọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú gbólóhùn Paulu
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” pa ìtumọ̀ gbòòrò ti ìwà títọ́/righteousness mọ́. “Ìdájọ́ òdodo” ṣeé ṣe bí justice, ṣùgbọ́n yóò dín àyè ìtumọ̀ Gíríìkì kù, nítorí náà a fi í sí àlàyé ìsàlẹ̀.
- issue: Àwòrán àwọn ohun ìjà ní ọ̀tún àti ní òsì
  choice: ní ọwọ́ ọ̀tún àti ní ọwọ́ òsì
  alternative: fún ọwọ́ ọ̀tún àti fún ọwọ́ òsì
  rationale: Gíríìkì kò sọ “ọwọ́” ní tààrà, ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí àwọn ohun ìjà tí a ń lò ní ọwọ́ méjèèjì, bóyá fún ìkọlù àti ìdáàbòbò. Ìtumọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá, a sì pa àṣàyàn mìíràn mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀nà ọ̀rọ̀ ọlọ́lá tí ó sì ṣeé lóye. A pa àtúnsọ “nínú” mọ́ láti tẹ̀lé ìlù ἐν ... ἐν ..., a sì lo “ohun ìjà” dípò ọ̀rọ̀ tó lè túmọ̀ sí ohun ìdáàbòbò nìkan. Àmì ohùn kún ibi tí ó bá yẹ.
