id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: yo
  text: Ẹ má ṣe di ẹni tí a fi àjàgà kan so pọ̀ pẹ̀lú àwọn aláìgbàgbọ́ tí kò bá yín mu.[b] Nítorí ìpín wo ni òdodo ní pẹ̀lú àìlófin?[a] Tàbí ìbáṣepọ̀ wo ni ìmọ́lẹ̀ ní pẹ̀lú òkùnkùn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́” fún “òdodo” (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà fa àwòrán àwọn ẹranko tí wọn kò bá ara wọn mu, tí a so pọ̀ lábẹ́ àjàgà kan; fi wé Diutarónómì 22:10.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Ẹ má ṣe di ẹni
  rationale: Ó pa agbára ìfòfindè mọ́, ó sì fi ìtumọ̀ γίνομαι gẹ́gẹ́ bí ‘di’ hàn dípò kí ó jẹ́ ipò lasán.
- source_word: ἑτεροζυγοῦντες
  choice: tí a so mọ́ àjàgà tí kò bá ... mu
  rationale: Ó pa àwòrán ẹranko méjì tí wọn kò bá ara wọn mu lábẹ́ àjàgà kan mọ́, ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἀπίστοις
  choice: àwọn aláìgbàgbọ́
  rationale: Ó tọ́ka sí àwọn tí kò gba ìhìn rere gbọ́; ìsopọ̀ ‘mọ́’ bá àwòrán àjàgà mu.
- source_word: μετοχὴ
  choice: ìpín
  rationale: Ó túmọ̀ sí ohun tí àwọn méjèèjì ní tàbí ṣe papọ̀, ó sì bá ìbéèrè àfiwé náà mu.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: ‘Òdodo’ ni ìtumọ̀ Yorùbá tí ó bójú mu fún righteousness ní ìtakora pẹ̀lú ἀνομία, láìyọ ìtumọ̀ ‘ìdájọ́ òdodo’ kúrò.
- source_word: ἀνομίᾳ
  choice: àìlófin
  rationale: Ó tẹ̀lé ìtumọ̀ ἀνομία ní tààrà gẹ́gẹ́ bí àìní tàbí àìgbọ́ràn sí òfin, ó sì pa ìtakora pẹ̀lú òdodo mọ́.
- source_word: κοινωνία
  choice: ìdàpọ̀
  rationale: Ó sọ nípa jíjẹ́ alábàápín tàbí ní ìbáṣepọ̀ tímọ́tímọ́; ọ̀rọ̀ yìí ṣe kedere ní àyíká ìmọ́lẹ̀ àti òkùnkùn.
- source_word: φωτὶ πρὸς σκότος
  choice: ìmọ́lẹ̀ ... pẹ̀lú òkùnkùn
  rationale: Ó pa àfiwé gangan mọ́, ‘pẹ̀lú’ sì sọ ìbáṣepọ̀ tí πρός ń béèrè nípa rẹ̀ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ìtakora ti Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú àyíká yìí, ìtakora rẹ̀ pẹ̀lú àìlófin ń tọ́ka sí ìwà tàbí ipò tí ó tọ́; síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ tó lè jẹ́ ‘ìdájọ́ òdodo’ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti mímọ́, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan gbólóhùn àlàyé dípò ọ̀rọ̀ ìjọ àtijọ́ tí ó lè ṣókùnkùn, láti pa àwòrán àjàgà àti ìtakora mẹ́ta náà mọ́ fún òǹkàwé òde òní.
