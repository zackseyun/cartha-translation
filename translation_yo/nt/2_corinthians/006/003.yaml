  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: yo
  text: A kì í fúnni ní ohun ìkọ̀sẹ̀ kankan nínú ọ̀ràn kankan[a], kí a má bàa dá iṣẹ́ ìránṣẹ́ náà lẹ́bi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kì í fúnni ní ìdí ìkọ̀sẹ̀ kankan nínú ọ̀ràn kankan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a má bàa rí àbùkù nínú iṣẹ́ ìránṣẹ́ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: a kò fi ohunkóhun di ohun ìkọ̀sẹ̀
  rationale: Ọ̀rọ̀ yìí mú àwòrán ìkọ̀sẹ̀ inú προσκοπήν dúró, ó sì sọ ọ́ ní Yorùbá àdánidá gẹ́gẹ́ bí fífi ohun kan di ìdí ìkọ̀sẹ̀.
- source_word: ἐν μηδενί
  choice: fún ẹnikẹ́ni
  rationale: Ní ìṣọ̀kan pẹ̀lú gbólóhùn náà, èyí fi hàn pé Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ kò fẹ́ jẹ́ ìdí ìkọ̀sẹ̀ lábẹ́ ipò èyíkéyìí. Ìtumọ̀ gígùn jù lọ, ‘ní ohunkóhun,’ wà nínú àlàyé ìsàlẹ̀.
- source_word: διδόντες
  choice: fi ... di
  rationale: Ẹ̀ka ọ̀rọ̀ oníṣe yìí túmọ̀ ní tààrà sí ‘fífún,’ ṣùgbọ́n ‘fi ... di’ ni ọ̀nà Yorùbá tó ṣe kedere fún fífúnni ní àǹfààní tàbí ìdí ìkọ̀sẹ̀.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí ń ṣàfihàn ète tàbí àbájáde tí a fẹ́ dènà ní Yorùbá àdánidá.
- source_word: μωμηθῇ
  choice: di èyí tí a óò máa dá lẹ́bi
  rationale: Ó pa ohùn àìṣe ti Gíríìkì mọ́, ó sì gbé ìtumọ̀ dídá lẹ́bi tàbí wíwá àbùkù jáde.
- source_word: ἡ διακονία
  choice: iṣẹ́ ìránṣẹ́ náà
  rationale: ‘Iṣẹ́ ìránṣẹ́’ túmọ̀ iṣẹ́ tí a ń ṣe fún Ọlọ́run àti fún àwọn ẹlòmíràn, láìfi ètò ipò ṣọ́ọ̀ṣì ti àkókò tó tẹ̀ lé e kún un.
theological_decisions:
- issue: Ìtumọ̀ διακονία nínú àpèjúwe Pọ́ọ̀lù nípa iṣẹ́ rẹ̀
  choice: iṣẹ́ ìránṣẹ́ náà
  alternative: iṣẹ́ òjíṣẹ́ náà
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí iṣẹ́ tí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ń ṣe gẹ́gẹ́ bí ìránṣẹ́ Ọlọ́run. ‘Iṣẹ́ ìránṣẹ́’ pa ìtumọ̀ iṣẹ́ sísìn mọ́ láìdín in kù sí ipò àṣẹ ẹ̀sìn kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ohun ìkọ̀sẹ̀’ láti pa àwòrán Gíríìkì mọ́, a sì lo ‘iṣẹ́ ìránṣẹ́’ fún διακονία láìgbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọlé.
