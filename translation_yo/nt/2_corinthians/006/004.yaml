  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: yo
  text: 'Ṣùgbọ́n nínú ohun gbogbo[a], à ń fi ara wa hàn gẹ́gẹ́ bí àwọn ìránṣẹ́ Ọlọ́run[b]: nínú ìfaradà púpọ̀[c], nínú ìpọ́njú, nínú ìnira, nínú ìdààmú líle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní gbogbo ọ̀nà.” Gbólóhùn Gíríìkì náà gbòòrò; ó lè ṣàpèjúwe gbogbo ipò tàbí gbogbo ọ̀nà tí a fi ń fi irú ẹni tí a jẹ́ hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí àwọn tí ń sin Ọlọ́run” tàbí “gẹ́gẹ́ bí àwọn òjíṣẹ́ Ọlọ́run.” Ọ̀rọ̀ Gíríìkì διάκονοι tẹnumọ́ iṣẹ́ ìsìn, kò sì pọn dandan pé ó ń tọ́ka sí oyè ìjọ kan.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “pẹ̀lú ìfaradà púpọ̀.” Àtúnlò “nínú” nínú àkójọ náà ń tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tí ó ṣáájú, ó sì bẹ̀rẹ̀ àlàyé rere nípa bí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ṣe ń ṣiṣẹ́.
- source_word: ἐν παντί
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtumọ̀ gbígbòòrò Gíríìkì mọ́, yálà ó ń tọ́ka sí gbogbo ipò tàbí gbogbo ọ̀nà tí wọ́n fi ń fi iṣẹ́ wọn hàn.
- source_word: συνιστάνοντες ἑαυτούς
  choice: à ń fi ara wa hàn
  rationale: Gbólóhùn yìí lè túmọ̀ sí fífi ara ẹni síwájú tàbí fífi ẹ̀rí hàn nípa irú ẹni tí a jẹ́; àṣàyàn yìí jẹ́ ti ẹ̀dá Yorùbá, kò sì fi ìtumọ̀ ìyìn ara ẹni kún un.
- source_word: ὡς θεοῦ διάκονοι
  choice: bí ìránṣẹ́ Ọlọ́run
  rationale: διάκονοι tẹnumọ́ iṣẹ́ ìsìn. “Ìránṣẹ́” jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, kò sì sọ ọ́ di oyè ìjọ kan pàtó.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: nínú ìfaradà púpọ̀
  rationale: ὑπομονή jẹ́ dídúró ṣinṣin lábẹ́ ìdánwò, kì í ṣe sùúrù lásán; “púpọ̀” tún pa agbára πολλῇ mọ́.
- source_word: θλίψεσιν
  choice: nínú ìpọ́njú
  rationale: “Ìpọ́njú” sọ ìtẹ̀sí tàbí ìrora tí θλῖψις ní nínú àkójọ ìjìyà yìí.
- source_word: ἀνάγκαις
  choice: nínú ìnira
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ipò líle tí ń fi dandan múni, ju àìní ohun ìní lásán lọ.
- source_word: στενοχωρίαις
  choice: nínú ìhámọ́
  rationale: στενοχωρία ní àwòrán ẹni tí ipò há mọ́; “ìhámọ́” pa àwòrán àti agbára ọ̀rọ̀ náà mọ́, ó sì yàtọ̀ sí “ìpọ́njú” àti “ìnira.”
theological_decisions:
- issue: Ìtumọ̀ διάκονοι nínú àyíká iṣẹ́ ìránṣẹ́
  choice: ìránṣẹ́ Ọlọ́run
  alternative: òjíṣẹ́ Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì náà ń dá wọn mọ̀ gẹ́gẹ́ bí àwọn tí ń sin Ọlọ́run, kò sì pọn dandan pé ó ń tọ́ka sí ipò tàbí oyè ìjọ. “Ìránṣẹ́” yẹra fún fífi ètò ìjọ kan pàtó sínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A pa àtúnṣe “nínú” mọ́ láti fi ìṣètò àkójọ Gíríìkì hàn, a sì lo “ìhámọ́” láti dá àwòrán ipò tí ó há mọ́ nínú στενοχωρία sí.
