  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: yo
  text: Ní ìpadà tó bá èyí mu[a]—mo ń bá yín sọ̀rọ̀ bí àwọn ọmọ—ẹ̀yin náà, ẹ ṣí ara yín sílẹ̀ sí i.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ìsanpadà kan náà,” “gẹ́gẹ́ bí ohun tí ẹ fi san padà,” tàbí “ní pàṣípààrọ̀ tó dọ́gba.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “kí a fẹ̀ yín sí i,” tàbí “ẹ di gbòòrò sí i.” Nínú àyíká ọ̀rọ̀, ìtumọ̀ rẹ̀ ni kí wọ́n ṣí ara wọn sílẹ̀ sí i nínú ìfẹ́ àti ìtẹ́wọ́gbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιμισθίαν
  choice: ìdáhùn tó bá tiwa mu
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí a fi dá ohun kan padà, tàbí ìfèsì tó bá ohun tí a ti rí gbà mu. Nínú àyíká ọ̀rọ̀ yìí, kì í ṣe owó tàbí ẹ̀san iṣẹ́, bí kò ṣe ìfèsì ìfẹ́ àti ìṣípayá ọkàn tó bá ti Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ mu.
- source_word: ὡς τέκνοις
  choice: bí ẹni pé mo ń bá àwọn ọmọ sọ̀rọ̀
  rationale: Èyí pa ìtumọ̀ ‘sí àwọn ọmọ’ mọ́, ó sì mú gbólóhùn náà jẹ́ èdè Yorùbá àdánidá láìfi ‘àwọn ọmọ mi’ kún un, nítorí arọ́pò-orúkọ ohun-ìní kò sí nínú Gíríìkì.
- source_word: πλατύνθητε
  choice: ẹ ṣí ara yín sílẹ̀ gbòòrò
  rationale: Ìtumọ̀ gangan ni ‘ẹ jẹ́ kí a fẹ̀ yín sí i’ tàbí ‘ẹ fẹ̀ sí i.’ Àyíká ẹsẹ 11–12 fi hàn pé àkàwé náà ń sọ nípa ìfẹ́ àti títẹ́wọ́ gba; ‘ẹ ṣí ara yín sílẹ̀ gbòòrò’ pa àkàwé fífẹ̀ sí i mọ́ láìfi ‘ọkàn’ kún ọ̀rọ̀ Gíríìkì ní tààràtà.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: 'Ó tẹnumọ́ ìfèsì alábápín: bí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ti ṣí ara wọn sílẹ̀, bẹ́ẹ̀ ni àwọn ará Kọ́ríńtì náà gbọ́dọ̀ ṣe.'
- source_word: δὲ
  choice: a fi hàn nínú ìṣàn gbólóhùn, kì í ṣe pẹ̀lú ọ̀rọ̀ àfikún ọ̀tọ̀
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ níbí. Èdè Yorùbá kò nílò ‘ṣùgbọ́n’ tàbí ‘nísinsìnyí’ ní ipò yìí; ìṣàn gbólóhùn fúnra rẹ̀ fi ìyípadà sí ìṣílétí hàn.
theological_decisions:
- issue: Bóyá kí a pe àwọn ará Kọ́ríńtì ní ‘àwọn ọmọ mi’ ní tààràtà
  choice: àwọn ọmọ
  alternative: àwọn ọmọ mi
  rationale: Ohùn Pọ́ọ̀lù dà bí ti bàbá sí ọmọ, ṣùgbọ́n Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní. A kò fi ‘mi’ kún un, kí ìtumọ̀ ìbátan náà lè wà láìkọjá ohun tí orísun sọ.
- issue: Bóyá kí a sọ ohun tí wọ́n gbọ́dọ̀ ṣí ní ‘ọkàn’
  choice: ẹ ṣí ara yín sílẹ̀ gbòòrò
  alternative: ẹ ṣí ọkàn yín sílẹ̀ gbòòrò
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ọkàn àti ìfẹ́, ṣùgbọ́n πλατύνθητε fúnra rẹ̀ kò darúkọ ‘ọkàn.’ Yíyan ‘ara yín’ jẹ́ kí Yorùbá ṣe kedere, ó sì pa àkàwé àti ìwọ̀n àìsọ pàtó inú Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà pa ìṣílétí Pọ́ọ̀lù àti àkàwé fífẹ̀ sí i mọ́, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹlẹ́gbẹ́ kan kún un.
