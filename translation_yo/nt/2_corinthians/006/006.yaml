id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: yo
  text: nínú ìwà mímọ́, nínú ìmọ̀, nínú sùúrù, nínú inú rere, nínú Ẹ̀mí Mímọ́[a], nínú ìfẹ́ tí kò ní àgàbàgebè,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ẹ̀mí mímọ́,” bí a bá gbà pé ó ń ṣàpèjúwe ìwà tàbí ìtẹ̀sí ọkàn ènìyàn tí ó mọ́ dípò Ẹ̀mí Mímọ́ Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: nínú ìwà mímọ́
  rationale: ἁγνότης ń tọ́ka sí ìwà tí ó mọ́ ní ọ̀nà gbígbòòrò. ‘Ìwà mímọ́’ jẹ́ èdè Yorùbá àdánidá, kò sì fi ìtumọ̀ náà mọ́ ìwà mímọ́ nípa ìbálòpọ̀ nìkan.
- source_word: γνώσει
  choice: nínú ìmọ̀
  rationale: γνῶσις túmọ̀ sí ìmọ̀ tàbí òye; ‘ìmọ̀’ pa ìtumọ̀ gbígbòòrò ọ̀rọ̀ náà mọ́.
- source_word: μακροθυμίᾳ
  choice: nínú sùúrù
  rationale: μακροθυμία jẹ́ fífaradà pẹ̀lú sùúrù sí àwọn ènìyàn tàbí ìṣòro. ‘Sùúrù’ ṣe kedere, ó sì jẹ́ èdè Yorùbá òde òní.
- source_word: χρηστότητι
  choice: nínú inú rere
  rationale: χρηστότης ń sọ nípa inú rere àti ṣíṣe rere sí ẹlòmíràn; ‘inú rere’ mú ìbáṣepọ̀ inú ọ̀rọ̀ náà hàn lọ́nà àdánidá.
- source_word: πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: Nínú lílo Páùlù, gbólóhùn yìí ṣeé ṣe jù lọ láti tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run. A fi àmì ẹsẹ̀ kún un láti tọ́ka sí ìtumọ̀ mìíràn tí gírámà lè gbà.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: nínú ìfẹ́ àìṣèké
  rationale: ἀγάπη jẹ́ ‘ìfẹ́,’ ἀνυπόκριτος sì túmọ̀ sí èyí tí kò ní àgàbàgebè tàbí èké. ‘Ìfẹ́ àìṣèké’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἐν
  choice: nínú
  rationale: Àtúnsọ ἐν ń fi ọ̀nà, ipò, tàbí ohun tí iṣẹ́ ìránṣẹ́ náà ń fara hàn nínú rẹ̀ hàn. Àtúnsọ ‘nínú’ pa ìlù àti ìtẹnumọ́ àkójọ Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí πνεύματι ἁγίῳ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ Ọlọ́run
  alternative: ẹ̀mí mímọ́ gẹ́gẹ́ bí ìwà tàbí ìtẹ̀sí ọkàn ènìyàn tí ó mọ́
  rationale: Lílo ọ̀rọ̀ náà lọ́dọ̀ Páùlù àti àyíká ọ̀rọ̀ mú kí ìtọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run ṣeé ṣe jù lọ. Síbẹ̀, nítorí àkójọ náà tún ní àwọn ànímọ́ ènìyàn, a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ọlọ́wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtúnsọ ‘nínú’ mọ́ láti tẹ̀ lé ìlù àkójọ Gíríìkì. A gbe àmì [a] sí ‘Ẹ̀mí Mímọ́,’ nítorí ibẹ̀ ni àlàyé ìsàlẹ̀ ti kan ní ti gidi.
