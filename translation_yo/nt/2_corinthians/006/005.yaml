translation:
  language: yo
  text: ní lílù, ní ẹ̀wọ̀n, ní rúkèrúdò, ní iṣẹ́ àṣekára, ní àwọn òru àìsùn, ní àwẹ̀,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: lílù
  rationale: Ó ń tọ́ka sí lílu ènìyàn tàbí ìyà nípa lílù; ọ̀rọ̀ yìí bá àtòjọ kúkúrú ti Gíríìkì mu láìfi ẹni tó lù ú kún un.
- source_word: φυλακαῖς
  choice: fífi sẹ́wọ̀n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrírí ìhámọ́ sínú ẹ̀wọ̀, ó sì lè dúró fún ọ̀pọ̀ ìgbà tí irú rẹ̀ ṣẹlẹ̀.
- source_word: ἀκαταστασίαις
  choice: rúkèrúdò
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìdàrúdàpọ̀, ìrúkèrúdò, tàbí ìṣọ̀tẹ̀ àwùjọ; “rúkèrúdò” pa ìwọ̀n ìtumọ̀ náà mọ́ láìdín in kù sí ìjà òpópónà nìkan.
- source_word: κόποις
  choice: iṣẹ́ àṣekára
  rationale: Ó sọ iṣẹ́ líle tí ń mú àárẹ̀ wá, kì í ṣe iṣẹ́ lásán.
- source_word: ἀγρυπνίαις
  choice: àwọn òru àìsùn
  rationale: Ó fi ìrírí ọ̀pọ̀ ìgbà tí kò fi sùn hàn ní Yorùbá tó ṣe kedere, láìsọ ohun tó fa àìsùn náà.
- source_word: νηστείαις
  choice: àwẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà fún ṣíṣe láìjẹun; a kò fi kún un bóyá àwẹ̀ náà jẹ́ ti ìfẹ́ ẹni tàbí ti ipò líle.
