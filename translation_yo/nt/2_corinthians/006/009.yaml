source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: yo
  text: bí ẹni tí a kò mọ̀, síbẹ̀ tí a mọ̀ dáadáa[a]; bí ẹni tí ń kú, sì kíyèsí i, àwa wà láàyè; bí ẹni tí a ń kọ́ lẹ́kọ̀ọ́, síbẹ̀ tí a kò pa[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí a dá mọ̀”; ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ dídámọ̀ ẹni ní kíkún dípò jíjẹ́ olókìkí lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “bí ẹni tí a ń bá wí” tàbí “bí ẹni tí a ń fi ìyà tọ́”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbáwí àtúnṣe tàbí ìkọ́nilẹ́kọ̀ọ́ tó ń mọ ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: bí ẹni tí
  rationale: Ó ń ṣáájú ọ̀kọ̀ọ̀kan àwọn àpèjúwe alátakò náà, ó sì mú kí àtúnsọ ìṣètò ọ̀rọ̀ Pọ́ọ̀lù hàn ní Yorùbá àdánidá.
- source_word: ἀγνοούμενοι
  choice: ẹni tí a kò mọ̀
  rationale: Ó pa ìtumọ̀ àìmọ̀ tàbí àìdámọ̀ ẹni mọ́, ó sì bá ọ̀rọ̀ tó tẹ̀ lé e ṣe àtakò kedere.
- source_word: ἐπιγινωσκόμενοι
  choice: ẹni tí a mọ̀ dáadáa
  rationale: Ó mú agbára ọ̀rọ̀ náà gẹ́gẹ́ bí mímọ̀ tàbí dídámọ̀ ní kíkún hàn láì sọ ọ́ di òkìkí lásán.
- source_word: ἀποθνῄσκοντες
  choice: ẹni tí ń kú
  rationale: Ó fi ipò tí ó ń lọ lọ́wọ́ tàbí ìfarahàn ẹni tó wà lẹ́gbẹ̀ẹ́ ikú hàn, ó sì yàtọ̀ sí θανατούμενοι tó wà ní ìparí.
- source_word: ἰδοὺ
  choice: kíyè sí i
  rationale: Ó dá agbára ìpè láti fiyè sí ohun ìyanu náà dúró ní èdè Yorùbá ọlọ́lá tí ó sì ṣeé lóye.
- source_word: ζῶμεν
  choice: àwa wà láàyè
  rationale: 'Ó pa ìtakora tó múni lójú mọ́: wọ́n dà bí ẹni tí ń kú, ṣùgbọ́n wọ́n ṣì wà láàyè.'
- source_word: παιδευόμενοι
  choice: ẹni tí a ń bá wí
  rationale: ‘Bá wí’ lè tọ́ka sí ìtọ́nisọ́nà tàbí ìbáwí àtúnṣe nínú ìjìyà, láì fi dandan sọ pé ó jẹ́ ìjìyà ẹ̀ṣẹ̀.
- source_word: μὴ θανατούμενοι
  choice: tí a kò pa
  rationale: Ó pa ohùn àfarawé passive náà mọ́ ní Yorùbá, ó sì fi ìdènà ikú gangan hàn ní ṣókí.
theological_decisions:
- issue: Ìtumọ̀ παιδευόμενοι ní ìbáṣepọ̀ pẹ̀lú ìjìyà
  choice: a ń bá wí
  alternative: a ń kọ́ lẹ́kọ̀ọ́ / a ń fi ìyà tọ́
  rationale: Yíyan ‘a ń bá wí’ pa àyè sílẹ̀ fún ìbáwí àtúnṣe àti ìkọ́nilẹ́kọ̀ọ́, láì pinnu pé Ọlọ́run ń fìyà jẹ wọ́n nítorí ẹ̀ṣẹ̀. Ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n kedere. Àtúnsọ ‘bí ẹni tí’ ń pa ìṣètò ọ̀rọ̀ alátakò Pọ́ọ̀lù mọ́; ‘síbẹ̀’ ń mú ìtakora náà yé olùkà ní ti ẹ̀dá Yorùbá, bí ó tilẹ̀ jẹ́ pé καί ni orísun.
