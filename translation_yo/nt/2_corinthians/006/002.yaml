  source_fidelity: 'Àwọn ìtumọ̀ pàtàkì—γάρ, ἐπήκουσά σου, βοηθέω, àti ìkìlọ̀ ἰδού/νῦν—wà ní ìbámu tó dára pẹ̀lú Gíríìkì. Ṣùgbọ́n “àkókò tí ó ṣe ìtẹ́wọ́gbà” yí ipa àpèjúwe εὐπρόσδεκτος padà: ó lè túmọ̀ sí àkókò tí ó ń tẹ́wọ́ gba ohun kan, kì í ṣe àkókò tí a tẹ́wọ́ gbà/fún ní ojú rere.'
