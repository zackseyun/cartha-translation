id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: yo
  text: 'Nítorí ó sọ pé,[a]


    “Láti ìgbà ojú rere ni mo fetí sí ọ,

    àti ní ọjọ́ ìgbàlà ni mo ràn ọ́ lọ́wọ́.”


    Wò ó, ìsinsìnyí ni àkókò ojú rere gan-an; wò ó,[b] ìsinsìnyí ni ọjọ́ ìgbàlà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ó sọ pé, ‘Láti ìgbà ojú rere ni mo gbọ́ ọ.’” Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí gbígbọ́ ẹnì kan pẹ̀lú ìtẹ́wọ́gbà tàbí pẹ̀lú ìdáhùn rere.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ìparí náà sí, “ìsinsìnyí ni àkókò ojú rere náà … ìsinsìnyí ni ọjọ́ ìgbàlà náà.” Gíríìkì kò ní article níbí, Yorùbá sì lè jẹ́ kí gbólóhùn náà ní ìtumọ̀ pàtó tàbí àìpàtó gẹ́gẹ́ bí àyíká.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Nítorí ó sọ pé
  rationale: “Nítorí” fi ipa ìṣàlàyé γάρ hàn, “ó sọ pé” sì pa Ọlọ́run gẹ́gẹ́ bí olùsọ ọ̀rọ̀ inú Ìwé Mímọ́ mọ́, láìfi orúkọ tí Gíríìkì kò sọ kún un.
- source_word: Καιρῷ δεκτῷ
  choice: Ní àkókò ìtẹ́wọ́gbà
  rationale: “Àkókò” bá καιρός mu gẹ́gẹ́ bí àkókò yíyẹ tàbí àkókò tí a yàn; “ìtẹ́wọ́gbà” ṣàfihàn δεκτός gẹ́gẹ́ bí ohun tí a tẹ́wọ́ gbà tàbí tí ojú rere wà fún.
- source_word: ἐπήκουσά σου
  choice: mo fetí sí ọ
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ gbígbọ́ pẹ̀lú àfiyèsí àti ìtẹ́wọ́gbà mọ́, láìmú un lọ dé “mo dá ọ lóhùn,” èyí tí yóò túmọ̀ rẹ̀ ju bí orísun ṣe sọ lọ.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: ní ọjọ́ ìgbàlà
  rationale: Yorùbá kò lo òǹkà-ọrọ̀ bí “a/the” ní ọ̀nà kan náà bí Gẹ̀ẹ́sì; “ní ọjọ́ ìgbàlà” jẹ́ adayeba, ó sì fi àìní àtẹnumọ́ pàtó nínú Gíríìkì sílẹ̀ ní ṣíṣí.
- source_word: ἐβοήθησά σοι
  choice: mo ràn ọ́ lọ́wọ́
  rationale: Èyí ni ọ̀nà Yorùbá adayeba àti kedere fún “mo ṣe ìrànlọ́wọ́ fún ọ.”
- source_word: ἰδοὺ
  choice: Kíyèsí i
  rationale: “Kíyèsí i” jẹ́ ọ̀rọ̀ ìpe-àfiyèsí tó ní iyì, ó sì pa agbára àsọyé ἰδού mọ́ ju “Wò ó” lọ.
- source_word: νῦν
  choice: ìsinsìnyí
  rationale: Ó fi ìtẹnumọ́ àti ìkánjú “ní báyìí gan-an” tí νῦν ní hàn.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: àkókò tí ó ṣe ìtẹ́wọ́gbà
  rationale: “Tí ó ṣe ìtẹ́wọ́gbà” jẹ́ Yorùbá adayeba fún àkókò tí ojú rere wà fún, ó sì pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú δεκτός inú àyọlò náà.
- source_word: ἡμέρα σωτηρίας
  choice: ọjọ́ ìgbàlà
  rationale: Gbólóhùn náà jẹ́ kedere àti adayeba ní Yorùbá, láìfi ìtumọ̀ eschatological míì tí orísun kò sọ kún un.
theological_decisions:
- issue: Bóyá kí a fi àkókò àti ọjọ́ náà hàn gẹ́gẹ́ bí ohun pàtó (“the”) tàbí ohun àìpàtó (“a/an”).
  choice: Lo “àkókò ìtẹ́wọ́gbà / ọjọ́ ìgbàlà” ní àyọlò, kí akọsilẹ̀ [b] sì ṣàlàyé pé a tún lè lóye ìpari náà gẹ́gẹ́ bí àkókò àti ọjọ́ pàtó.
  alternative: “àkókò náà tí ó ṣe ìtẹ́wọ́gbà … ọjọ́ náà ti ìgbàlà”
  rationale: Gíríìkì kò ní article ní àwọn gbólóhùn wọ̀nyí, ṣùgbọ́n àyíká le fún wọn ní ìtumọ̀ pàtó. Nítorí Yorùbá kò ní article bíi ti Gẹ̀ẹ́sì, àyọlò àkọ́kọ́ pa àìdánilójú náà mọ́, akọsilẹ̀ sì fi ìtumọ̀ míì tó ṣeé ṣe hàn.
- issue: Bóyá λέγει túmọ̀ sí “ó sọ” nípa Ọlọ́run tàbí “Ìwé Mímọ́ sọ.”
  choice: “ó sọ pé”
  alternative: “ó wí pé” tàbí “Ìwé Mímọ́ sọ pé”
  rationale: Aṣojú ẹni-kẹta náà pa ìrísí Gíríìkì àti ìmọ̀ pé Ọlọ́run ni olùsọ inú àyọlò mọ́, láìfi “Ìwé Mímọ́” tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Bóyá ἐπήκουσά σου yẹ kí ó jẹ́ “mo gbọ́ ọ” tàbí “mo dá ọ lóhùn.”
  choice: “mo fetí sí ọ”
  alternative: “mo gbọ́ ọ pẹ̀lú ojú rere” tàbí “mo dá ọ lóhùn”
  rationale: Yíyan “fetí sí” mú ìdáhùn rere tí ọ̀rọ̀-ìṣe náà lè ní wá síwájú láìyanju rẹ̀ sí ìtumọ̀ “dá lóhùn” nìkan.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A lo “Kíyèsí i” fún ìpe-àfiyèsí ọlọ́lá, “fetí sí” fún gbígbọ́ pẹ̀lú ìtẹ́wọ́gbà, àti ìlà ewì láti pa ìrísí àyọlò Aísáyà mọ́.
