translation:
  language: yo
  text: nínú ọlá àti àbùkù[a], nínú ìròyìn búburú àti ìròyìn rere[b]; gẹ́gẹ́ bí àwọn ẹlẹ́tàn, síbẹ̀ a jẹ́ olóòótọ́[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ògo àti àbùkù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ògo,” ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí ọlá tí ènìyàn ń rí ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ọ̀rọ̀ búburú àti ọ̀rọ̀ rere.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “gẹ́gẹ́ bí ẹlẹ́tàn àti olóòótọ́.” Gbólóhùn náà fi bí àwọn ènìyàn ṣe ń wo Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ wé ohun tí wọ́n jẹ́ ní tòótọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: nínú
  rationale: Pẹ̀lú àwọn orúkọ ọ̀rọ̀ oníbàáramu wọ̀nyí, διά ń tọ́ka sí àwọn ipò tí iṣẹ́ ìránṣẹ́ ń la kọjá. “Nínú” jẹ́ èdè Yorùbá àdánidá, ó sì lè tún un ṣe láìfi ìtumọ̀ ohun èlò sí i.
- source_word: δόξης
  choice: ọlá
  rationale: Nínú ìtakora rẹ̀ pẹ̀lú ἀτιμία, ọ̀rọ̀ náà ní ìtumọ̀ ọlá tí ènìyàn ń rí ní gbangba, kì í ṣe ògo Ọlọ́run ní pàtó.
- source_word: ἀτιμίας
  choice: àbùkù
  rationale: “Àbùkù” dúró gẹ́gẹ́ bí òdìkejì “ọlá,” ó sì sọ nípa ìtìjú tàbí àìbọ̀wọ̀ ní gbangba.
- source_word: δυσφημίας
  choice: èsùn búburú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ọ̀rọ̀ burúkú tí a ń sọ sí ènìyàn tàbí orúkọ búburú. Yíyan yìí yàgò fún pípa ìtumọ̀ náà mọ́ sí ìbanilórúkọjẹ́ tí a mọ̀ pé irọ́ ni.
- source_word: εὐφημίας
  choice: ìyìn rere
  rationale: Èyí jẹ́ òdìkejì èsùn tàbí ìròyìn búburú, ó sì mú èrò ọ̀rọ̀ rere àti orúkọ rere jáde ní Yorùbá àdánidá.
- source_word: ὡς
  choice: bí ẹni pé
  rationale: Ó fi ojú-ìwòye tàbí bí àwọn ẹlòmíràn ṣe ń ka àwọn aposteli sí hàn, láìsọ pé èsùn náà jẹ́ òtítọ́.
- source_word: πλάνοι
  choice: ẹlẹ́tàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹni tí a fi ẹ̀sùn kàn pé ó ń ṣi àwọn ẹlòmíràn lọ́nà.
- source_word: ἀληθεῖς
  choice: olóòótọ́
  rationale: Nínú Yorùbá, “olóòótọ́” ń sọ pé àwọn ìránṣẹ́ náà ń sọ òtítọ́ tàbí pé wọ́n jẹ́ ojúlówó, ó sì dúró ní ìtakora pẹ̀lú “ẹlẹ́tàn.”
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé apá ìkẹyìn ń fi bí àwọn ènìyàn ṣe ń wo àwọn ìránṣẹ́ wé ohun tí wọ́n jẹ́ ní tòótọ́
  choice: “bí ẹni pé a jẹ́ ẹlẹ́tàn, síbẹ̀ a jẹ́ olóòótọ́”
  alternative: “gẹ́gẹ́ bí ẹlẹ́tàn àti olóòótọ́”
  rationale: “Bí ẹni pé” fi hàn pé ẹlẹ́tàn ni àwọn mìíràn ń pè wọ́n, nígbà tí “síbẹ̀” pa ìtakora mọ́ pé olóòótọ́ ni wọ́n ní tòótọ́. Èyí kò mú èsùn náà gẹ́gẹ́ bí òtítọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo àmì ohùn ní kíkún. Ìtúmọ̀ náà pa ìṣètò àwọn méjì-méjì àti ìtakora inú Gíríìkì mọ́, ó sì lo “a” nítorí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ tí àyíká ẹsẹ náà tọ́ka sí.
