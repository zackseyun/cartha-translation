id: 2CO.6.12
reference: 2 Corinthians 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: yo
  text: Ẹ kò ní ìhámọ́ lọ́dọ̀ wa, ṣùgbọ́n nínú ìfẹ́ inú yín ni ẹ ní ìhámọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kò ní ìhámọ́ nínú wa, ṣùgbọ́n nínú ọkàn yín ni ẹ ní ìhámọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: ẹ há
  rationale: Ọ̀rọ̀ náà túmọ̀ ní ìpilẹ̀ṣẹ̀ sí wíwà ní ibi tó há, ó sì lè tọ́ka lọ́nà àpèjúwe sí dídín ẹni lọ́wọ́ tàbí àìní ààyè. “Ẹ há” pa àwòrán ibi tóóró mọ́, ó sì jẹ́ Yorùbá àdánidá. A lo ọ̀rọ̀ kan náà ní ìgbà méjèèjì láti pa ìyàtọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ἐν ἡμῖν
  choice: nítorí wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν sábà túmọ̀ sí “nínú,” níbí ó ń tọ́ka sí ohun tàbí àwọn ẹni tí ìhámọ́ náà ti ọ̀dọ̀ wọn wá. “Nítorí wa” sọ ìtumọ̀ ìbáṣepọ̀ yìí ní Yorùbá tó ṣe kedere.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín gbólóhùn méjèèjì.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: nínú ìfẹ́ ọkàn yín fúnra yín
  rationale: σπλάγχνα jẹ́ àwọn ẹ̀yà inú ní ìtumọ̀ gangan, ṣùgbọ́n ó ń tọ́ka sí ìmọ̀lára jíjinlẹ̀ àti ìfẹ́ níbí. “Ìfẹ́ ọkàn” jẹ́ àdánidá, ó sì pa èrò ìmọ̀lára inú mọ́; “fúnra yín” tẹnumọ́ pé inú àwọn ará Kọ́ríńtì ni ìhámọ́ náà wà.
- source_word: οὐ
  choice: kò
  rationale: Ìsẹ́ àìjẹ́ tààrà fún gbólóhùn àkọ́kọ́.
theological_decisions:
- issue: Ìtumọ̀ àpèjúwe σπλάγχνα
  choice: Ó ń tọ́ka sí ìfẹ́ àti ìmọ̀lára inú àwọn ará Kọ́ríńtì.
  alternative: Àwọn ẹ̀yà inú wọn ní ìtumọ̀ gangan.
  rationale: 'Àyíká ọ̀rọ̀ jẹ́ ti ìbáṣepọ̀: Pọ́ọ̀lù ń fi ọkàn rẹ̀ tí ó ṣí sí wọn wé bí àwọn ṣe dín ìfẹ́ wọn sí i kù. Nítorí náà, ìtumọ̀ àpèjúwe ló bá ète ọ̀rọ̀ mu.'
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A pa àwòrán “há” mọ́ ní ìsẹ̀lẹ̀ méjèèjì, a sì fi àlàyé míràn sínú àlàyé ìsàlẹ̀ láti tọ́ka sí ìtumọ̀ gangan ti ἐν àti ọ̀nà míràn láti túmọ̀ σπλάγχνα.
