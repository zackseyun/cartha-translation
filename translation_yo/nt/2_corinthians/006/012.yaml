revisions:
- from: Ẹ̀yin kò há nítorí wa[a], ṣùgbọ́n ẹ há nínú ìfẹ́ ọkàn yín fúnra yín.
  to: Ẹ kò ní ìhámọ́ lọ́dọ̀ wa, ṣùgbọ́n nínú ìfẹ́ inú yín ni ẹ ní ìhámọ́.[a]
  rationale: The revision replaces the non-idiomatic predicate há with repeated ìhámọ́ (‘constraint/restriction’), preserving the same-word contrast of the Greek. “Lọ́dọ̀ wa” communicates that the restriction does not arise from Paul’s party, while the footnote records the closer formal alternative “nínú wa.” “Ìfẹ́ inú yín” expresses the figurative affective sense of σπλάγχνα in natural Yoruba.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:34:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the figurative force of στενοχωρεῖσθε and the contrast between Paul’s party and the Corinthians’ own inner disposition. However, “Ẹ̀yin kò há” is not an idiomatic Yoruba way to predicate constraint of persons; há primarily describes something being narrow or tight. The revision expresses the repeated constraint with ìhámọ́ in both clauses, while retaining the relational sense of ἐν ἡμῖν as constraint not coming from Paul and his companions.
  naturalness: “Ẹ kò ní ìhámọ́ lọ́dọ̀ wa” and “nínú ìfẹ́ inú yín” are clear, modern Standard Yoruba. “Ìfẹ́ inú” naturally conveys deep inward affection without reducing σπλάγχνα to intellectual ‘heart’ or making it literal anatomy.
  terminology: Ìhámọ́ provides a suitable figurative equivalent for στενοχωρεῖσθε and is repeated to preserve the Greek rhetoric. Ìfẹ́ inú renders the relational, affective sense of σπλάγχνα. The footnote preserves the more literal relational wording “nínú wa” and the alternative “ọkàn yín.”
  issues:
  - severity: medium
    issue: “Ẹ̀yin kò há ... ṣùgbọ́n ẹ há” is not idiomatic for people being constrained.
    rationale: Há normally describes narrowness/tightness rather than functioning naturally as a passive-like predicate meaning ‘you are restricted.’ This obscures Paul’s intended contrast.
  - severity: low
    issue: “Ìfẹ́ ọkàn” can be read chiefly as love rather than the broader deep affections denoted by σπλάγχνα.
    rationale: “Ìfẹ́ inú” more naturally conveys inward affection and preserves the embodied-inner metaphor without over-specifying the emotion.
  revised_text: Ẹ kò ní ìhámọ́ lọ́dọ̀ wa, ṣùgbọ́n nínú ìfẹ́ inú yín ni ẹ ní ìhámọ́.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “Ẹ kò ní ìhámọ́ nínú wa, ṣùgbọ́n nínú ọkàn yín ni ẹ ní ìhámọ́.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the non-idiomatic predicate há with repeated ìhámọ́ (‘constraint/restriction’), preserving the same-word contrast of the Greek. “Lọ́dọ̀ wa” communicates that the restriction does not arise from Paul’s party, while the footnote records the closer formal alternative “nínú wa.” “Ìfẹ́ inú yín” expresses the figurative affective sense of σπλάγχνα in natural Yoruba.
