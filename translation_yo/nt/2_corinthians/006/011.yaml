  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: yo
  text: Ẹnu wa ti ṣí sí yín[a], ẹ̀yin ará Kọ́ríńtì; ọkàn wa sì ti gbòòrò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó rọrùn láti lóye, “A ti bá yín sọ̀rọ̀ ní gbangba.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọkàn wa ti fẹ̀” tàbí “ọkàn wa ṣí sílẹ̀ pátápátá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: ẹnu
  rationale: “Ẹnu” pa àwòrán ara tí Paulu lò mọ́, ó sì dúró ní ìbámu pẹ̀lú “ọkàn” nínú gbólóhùn kejì.
- source_word: ἀνέῳγεν
  choice: ti ṣí
  rationale: Àkókò perfect inú Gíríìkì fi ìṣe tó ti ṣẹlẹ̀ tí ipò rẹ̀ ṣì ń bá a lọ hàn. “Ti ṣí” pa àwòrán náà mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πρὸς ὑμᾶς
  choice: sí yín
  rationale: “Sí yín” fi hàn pé ọ̀rọ̀ tí ẹnu rẹ̀ sọ dojú kọ àwọn ará Kọ́ríńtì; ó tún bá àwòrán ẹnu tí ó ṣí sí ẹnì kan mu.
- source_word: Κορίνθιοι
  choice: ẹ̀yin ará Kọ́ríńtì
  rationale: Èyí jẹ́ ìpè tààrà sí àwọn ènìyàn Kọ́ríńtì. “Ẹ̀yin ará Kọ́ríńtì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ìpè náà mọ́.
- source_word: καρδία
  choice: ọkàn
  rationale: “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àárín ìfẹ́, ìmọ̀lára àti ìwà inú ẹni, ó sì pa àwòrán Gíríìkì mọ́.
- source_word: πεπλάτυνται
  choice: ti gbòòrò
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtàkì sí mímú ohun gbòòrò. “Ti gbòòrò” pa àwòrán yẹn àti ìtumọ̀ perfect mọ́ láì fi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Àwòrán ẹnu tí ó ṣí àti ọkàn tí ó gbòòrò gẹ́gẹ́ bí àmì ọ̀rọ̀ àìfipamọ́ àti ìfẹ́ Paulu
  choice: 'Pa àwòrán ara méjèèjì mọ́ nínú ọ̀rọ̀ pàtàkì: “Ẹnu wa ti ṣí … ọkàn wa sì ti gbòòrò.”'
  alternative: “A ti bá yín sọ̀rọ̀ ní gbangba, ẹ̀yin ará Kọ́ríńtì; a sì nífẹ̀ẹ́ yín gidigidi.”
  rationale: Gbólóhùn Gíríìkì fi àwòrán méjèèjì sílẹ̀ láì tú wọn sí ọ̀rọ̀ ìtumọ̀. Pípa wọn mọ́ jẹ́ kí ìfọkànsìn àti ìfẹ́ Paulu hàn, láì dá ìtumọ̀ kan ṣoṣo lé òǹkàwé lórí.
translation_notes:
  register: Yorùbá boṣewa oníàmì ohùn ni a lò, pẹ̀lú èdè tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹ̀yin ará Kọ́ríńtì” mú ìpè vocative náà jẹ́ àdánidá ní Yorùbá, nígbà tí “ẹnu” àti “ọkàn” pa ìfaraṣe ewì àti àwòrán ara inú orísun mọ́.
