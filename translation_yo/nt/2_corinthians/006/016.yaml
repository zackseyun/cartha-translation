id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: yo
  text: 'Ìbámu wo sì ni tẹ́ńpìlì[a] Ọlọ́run ní pẹ̀lú àwọn òrìṣà? Nítorí àwa ni tẹ́ńpìlì Ọlọ́run alààyè, gẹ́gẹ́ bí Ọlọ́run ti sọ pé: “Èmi yóò gbé láàárín wọn[b], èmi yóò sì rìn láàárín wọn; èmi yóò jẹ́ Ọlọ́run wọn, àwọn yóò sì jẹ́ ènìyàn mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ilé mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nínú wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “nínú” tàbí “láàárín”; àyíká májẹ̀mú àwùjọ níbí mú kí “láàárín wọn” bá ọ̀rọ̀ náà mu dáadáa.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: ìbámu
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìfọwọ́sí, ìṣọ̀kan, tàbí ìbámu. “Ìbámu” jẹ́ èdè Yorùbá àdánidá tí ó sì bá ìbéèrè àsọyé nípa àwọn ohun tí kò lè bá ara wọn mu lọ.
- source_word: ναῷ / ναὸς
  choice: tẹ́ńpìlì
  rationale: ναός tọ́ka sí ilé mímọ́ Ọlọ́run, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì. “Tẹ́ńpìlì” ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ibi ìjọsìn mọ́.
- source_word: εἰδώλων
  choice: àwọn òrìṣà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ohun tí àwọn kèfèrí ń bọ̀. “Àwọn òrìṣà” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere ju “àwọn ère” lọ, nítorí ère lè jẹ́ àwòrán lásán.
- source_word: ζῶντος
  choice: alààyè
  rationale: Ó ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí ẹni alààyè, ní ìyàtọ̀ sí àwọn òrìṣà tí kò ní ìyè.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: gẹ́gẹ́ bí Ọlọ́run ti sọ
  rationale: Èyí pa agbára ìfiwéra καθώς mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti darí òǹkàwé sí ẹ̀rí Ìwé Mímọ́.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Èmi yóò máa gbé láàárín wọn
  rationale: ἐν pẹ̀lú ọ̀pọ̀ αὐτοῖς lè túmọ̀ sí “nínú wọn” tàbí “láàárín wọn.” Àyíká májẹ̀mú àwùjọ àti gbólóhùn “rìn láàárín wọn” mú kí “láàárín wọn” jẹ́ yíyan tí ó bá èdè Yorùbá mu jù.
- source_word: ἐμπεριπατήσω
  choice: èmi yóò sì máa rìn láàárín wọn
  rationale: Yíyan yìí pa àwòrán gbígbé Ọlọ́run pẹ̀lú àwọn ènìyàn rẹ̀ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ἔσομαι αὐτῶν θεός
  choice: èmi yóò jẹ́ Ọlọ́run wọn
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti pa ọ̀rọ̀ ìbáṣepọ̀ májẹ̀mú náà mọ́.
- source_word: λαός
  choice: ènìyàn
  rationale: Nínú ọ̀rọ̀ májẹ̀mú, λαός tọ́ka sí àwùjọ àwọn ènìyàn Ọlọ́run gẹ́gẹ́ bí odindi kan; “ènìyàn mi” ni gbólóhùn Yorùbá tí ó bá ìlò yìí mu.
theological_decisions:
- issue: Àwòrán tẹ́ńpìlì gẹ́gẹ́ bí àwùjọ
  choice: àwa ni tẹ́ńpìlì Ọlọ́run alààyè
  alternative: àwa jẹ́ tẹ́ńpìlì kan ti Ọlọ́run alààyè
  rationale: ναὸς jẹ́ aláìní árítíkù nínú Gíríìkì, ṣùgbọ́n gẹ́gẹ́ bí orúkọ àpèjúwe lẹ́yìn ἐσμεν, ó ń sọ ìdánimọ̀ àwùjọ náà. Yíyan “tẹ́ńpìlì Ọlọ́run” pa ìtumọ̀ àwùjọ àti ìdánimọ̀ náà mọ́ láìfi “kan” kún un.
- issue: Ọ̀nà tí a gbà sọ gbígbé Ọlọ́run
  choice: Èmi yóò máa gbé láàárín wọn
  alternative: Èmi yóò máa gbé nínú wọn
  rationale: Gíríìkì ἐν αὐτοῖς lè gba méjèèjì. Àyíká ọ̀rọ̀ jẹ́ ti àwùjọ májẹ̀mú, gbólóhùn tí ó tẹ̀ lé sì sọ pé Ọlọ́run yóò rìn láàárín wọn; nítorí náà, “láàárín wọn” ni a fi sínú ọ̀rọ̀ pàtàkì, a sì pa “nínú wọn” mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti mímọ́, ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ. “Máa” pẹ̀lú ọ̀rọ̀ ọjọ́ iwájú ń mú ìtumọ̀ gbígbé àti rírìn tí ń bá a lọ hàn. Gbólóhùn ìbẹ̀rẹ̀ pa ìbéèrè àsọyé Gíríìkì mọ́.
