- from: 'Ìbámu wo sì ni tẹ́ńpìlì Ọlọ́run ní pẹ̀lú àwọn òrìṣà? Nítorí àwa ni tẹ́ńpìlì Ọlọ́run alààyè[a], gẹ́gẹ́ bí Ọlọ́run ti sọ pé: “Èmi yóò máa gbé láàárín wọn[b], èmi yóò sì máa rìn láàárín wọn; èmi yóò jẹ́ Ọlọ́run wọn, àwọn yóò sì jẹ́ ènìyàn mi.”'
  to: 'Ìbámu wo sì ni tẹ́ńpìlì[a] Ọlọ́run ní pẹ̀lú àwọn òrìṣà? Nítorí àwa ni tẹ́ńpìlì Ọlọ́run alààyè, gẹ́gẹ́ bí Ọlọ́run ti sọ pé: “Èmi yóò gbé láàárín wọn[b], èmi yóò sì rìn láàárín wọn; èmi yóò jẹ́ Ọlọ́run wọn, àwọn yóò sì jẹ́ ènìyàn mi.”'
  rationale: A yọ “máa” kúrò láti má ṣe fi ìtumọ̀ ìṣe àtúnsẹ̀ kún àwọn ọ̀rọ̀ ọjọ́ iwájú Gíríìkì. A tún gbe àmì ìsàlẹ̀ a sí lẹ́yìn “tẹ́ńpìlì,” èyí tí àlàyé rẹ̀ kan, a sì ṣe àlàyé rẹ̀ kúrú kí ó má bà a dání lórí pé “Ọlọ́run alààyè” ni àṣàyàn náà ń ṣàlàyé. Ìyókù ọ̀rọ̀ náà pa ìtumọ̀, ìforúkọsílẹ̀, àti àìdájú “nínú/láàárín” mọ́.
