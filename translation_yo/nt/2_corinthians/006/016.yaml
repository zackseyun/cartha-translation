  source_fidelity: Ìtumọ̀ náà ń fi ìbéèrè àsọyé náà, ìyàtọ̀ láàárín Ọlọ́run alààyè àti àwọn òrìṣà, ìdánimọ̀ àwùjọ náà gẹ́gẹ́ bí tẹ́ńpìlì Ọlọ́run, àti ìlérí májẹ̀mú tí a fa ọ̀rọ̀ rẹ̀ yọ hàn dáadáa. Síbẹ̀, “yóò máa gbé/rìn” lè dámọ̀ràn ìṣe tí ń tún ṣẹlẹ̀ tàbí àṣà, níbi tí ọjọ́ iwájú Gíríìkì ń sọ ìlérí náà ní tààrà. “Yóò gbé” àti “yóò rìn” dáa jù fún ìbámu pẹ̀lú ìpilẹ̀ ọ̀rọ̀ náà.
