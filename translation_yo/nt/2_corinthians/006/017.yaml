- from: Nítorí náà, ẹ jáde kúrò láàárín wọn, ẹ sì yà sọ́tọ̀[a], ni Olúwa wí. Ẹ má ṣe fọwọ́ kan ohun àìmọ́[b][c]; èmi yóò sì gbà yín wọlé.
  to: Nítorí náà, ẹ jáde kúrò láàárín wọn, ẹ sì yà sọ́tọ̀[a], ni Olúwa wí, “Ẹ má ṣe fọwọ́ kan ohun àìmọ́[b][c]; èmi yóò sì tẹ́wọ́ gbà yín.”
  rationale: 'Àtúnṣe náà jẹ́ ti ìṣàn Yorùbá àti ìdúró-kíkà péré: a fi ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ìsọ̀rọ̀ àsọtẹ́lẹ̀ kan ṣoṣo, a sì rọ́pò ‘gbà yín wọlé’ pẹ̀lú ‘tẹ́wọ́ gbà yín’ láti pa ìtumọ̀ εἰσδέξομαι mọ́ ní kíkún. A tún jẹ́ kí àṣàyàn ìsàlẹ̀ b lo ‘ohunkóhun àìmọ́,’ tó jẹ́ kedere ju ìkọ́ ‘tí ó jẹ́ aláìmọ́’ lọ nínú àyíká ìwẹ̀mọ́.'
