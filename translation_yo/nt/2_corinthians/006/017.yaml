  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: yo
  text: Nítorí náà, ẹ jáde kúrò láàárín wọn, ẹ sì yà sọ́tọ̀[a], ni Olúwa wí, “Ẹ má ṣe fọwọ́ kan ohun àìmọ́[b][c]; èmi yóò sì tẹ́wọ́ gbà yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ jẹ́ ẹni tí a yà sọ́tọ̀’ tàbí ‘ẹ ya ara yín sọ́tọ̀.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ má ṣe fọwọ́ kan ohunkóhun àìmọ́.’
    reason: lexical_alternative
  - marker: c
    text: Pọ́ọ̀lù ń mú èdè àwọn wòlíì inú Majẹ̀mú Láéláé wá sí ìrántí, pàápàá jù lọ Aísáyà 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí èrò tí ó jáde láti inú àríyànjiyàn tí ó ṣáájú, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: ἐξέλθατε
  choice: ẹ jáde
  rationale: Àṣẹ aorist fún ọ̀pọ̀ ènìyàn ni; ‘ẹ jáde’ fi ìpè sí ìgbésẹ̀ pàtó hàn láìfikún ìtumọ̀ tí kò sí nínú ọ̀rọ̀ náà.
- source_word: ἐκ μέσου αὐτῶν
  choice: kúrò láàárín wọn
  rationale: Ó pa ìtumọ̀ jíjáde láti àárín ẹgbẹ́ kan mọ́, ó sì ṣeé lóye ní Yorùbá òde òní.
- source_word: ἀφορίσθητε
  choice: ẹ sì yà sọ́tọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ ní ìrísí àfarawà; ìtumọ̀ yìí jẹ́ ti ara Yorùbá, ó sì pa èrò jíjẹ́ ẹni tí a yà sọ́tọ̀ mọ́ láìsọ ọ́ di ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
- source_word: λέγει κύριος
  choice: ni Olúwa wí
  rationale: Èyí jẹ́ ọ̀nà àsọtẹ́lẹ̀ tí a fi ń tọ́ka sí ẹni tí ń sọ̀rọ̀; ‘Olúwa’ bá κύριος mu nínú ọ̀rọ̀ Gíríìkì Majẹ̀mú Tuntun.
- source_word: ἀκαθάρτου
  choice: ohun àìmọ́
  rationale: Adájẹ́ neuter náà dúró gẹ́gẹ́ bí orúkọ ohun tí kò mọ́. ‘Ohun àìmọ́’ pa ìtumọ̀ ẹ̀ka ohun náà mọ́ láìdá ohun pàtó kan mọ̀.
- source_word: μὴ ἅπτεσθε
  choice: Ẹ má ṣe fọwọ́ kan
  rationale: ἅπτομαι lè túmọ̀ sí fífọwọ́ kan tàbí dídìmú; nínú àwòrán ìwẹ̀mọ́ àti ìyà-sọ́tọ̀ yìí, ‘fọwọ́ kan’ ni ó sun mọ́ ìtumọ̀ orísun jù.
- source_word: κἀγὼ
  choice: èmi yóò sì
  rationale: Ó pa ìsopọ̀ καί àti ìtẹnumọ́ ἐγώ mọ́ nípasẹ̀ ‘sì’ àti arọ́pò-orúkọ ‘èmi.’
- source_word: εἰσδέξομαι ὑμᾶς
  choice: gbà yín wọlé
  rationale: Ó fi ìgbàlejò tàbí ìtẹ́wọ́gbà rere hàn, ó sì pa ìrísí ọjọ́ iwájú ti ọ̀rọ̀-ìṣe náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ àsọtẹ́lẹ̀ tí ó ní ìbáṣepọ̀ pẹ̀lú Majẹ̀mú Láéláé
  choice: Olúwa
  alternative: YÁHWÈ tàbí Ọ̀gá
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń ṣe àfihàn èdè Aísáyà, ọrọ̀ Gíríìkì Majẹ̀mú Tuntun ní κύριος. ‘Olúwa’ pa ẹ̀rí orísun náà mọ́ láìfi orúkọ Hébérù tí kò hàn níbí kún un.
- issue: Ipa àṣẹ ἀφορίσθητε
  choice: ẹ sì yà sọ́tọ̀
  alternative: kí a yà yín sọ́tọ̀ tàbí ẹ ya ara yín sọ́tọ̀
  rationale: Ìtumọ̀ náà pa àṣẹ ìyà-sọ́tọ̀ mọ́ láìyanju pátápátá bóyá ìrísí àfarawà náà ń tẹnumọ́ ipò, iṣẹ́ Ọlọ́run, tàbí ìṣe àwọn olùgbọ́. Kò tún sọ ọ́ di àṣẹ láti já gbogbo ìbáṣepọ̀ pẹ̀lú àwọn tí kò gbàgbọ́.
translation_notes:
  register: A lo Yorùbá tí ó bófin mu, tí ó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn kún un níbi tí ó yẹ. ‘Gbà yín wọlé’ jẹ́ gbólóhùn àdánidá tí ó ní ìmọ̀lára ìtẹ́wọ́gbà, nígbà tí ‘ohun àìmọ́’ pa àwòrán ìwẹ̀mọ́ inú ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́.
