  timestamp: '2026-07-17T19:27:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì náà dáadáa: àwọn àṣẹ púpọ̀ náà, ìyà-sọ́tọ̀, ìkìlọ̀ nípa ohun àìmọ́, àti ìlérí ìtẹ́wọ́gbà ọjọ́ iwájú wà níbẹ̀. Síbẹ̀, ‘gbà yín wọlé’ lè dín εἰσδέξομαι sí ìtumọ̀ gbígbà ẹni wọ ilé; ‘tẹ́wọ́ gbà yín’ jẹ́ ìtumọ̀ tó gbòòrò, tó sì bá ìtẹ́wọ́gbà rere inú ọ̀rọ̀ náà mu dáadáa.'
  naturalness: ‘Ẹ má ṣe fọwọ́ kan ohun àìmọ́’ jẹ́ Yorùbá adayébá. A tún ṣe àmì ìsọ̀rọ̀-òfin àsọtẹ́lẹ̀ náà nípasẹ̀ àmi ìsọ̀rọ̀ taara, kí ‘ni Olúwa wí’ má bàa dà bí gbolohun tí ó ya kúrò nínú ìsọ̀rọ̀ kan náà.
  terminology: ‘Olúwa,’ ‘yà sọ́tọ̀,’ àti ‘ohun àìmọ́’ yẹ fún àkọsílẹ̀ ìwé mímọ́ yìí. ‘Tẹ́wọ́ gbà’ pa ìtumọ̀ ìfẹ́fẹ́fẹ́ ìgbọ́wọ́ ẹni mọ́ láìfi ìtumọ̀ ilé tàbí ibi kan dandan sí i.
  issues:
