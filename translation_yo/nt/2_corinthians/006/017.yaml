    issue: ‘Gbà yín wọlé’ ní ìtumọ̀ ààyè/ilé tó lè hàn ju bó ṣe yẹ lọ.
    rationale: εἰσδέξομαι túmọ̀ sí ìtẹ́wọ́gbà rere tàbí gbigba ẹni. ‘Èmi yóò sì tẹ́wọ́ gbà yín’ jẹ́ gbígbòòrò, ó sì ṣọ́ra láti má so ìlérí náà mọ́ lílọ sínú ilé kan.
  - severity: low
    issue: Ìdúró-kíkà lẹ́yìn ‘ni Olúwa wí’ ya ọ̀rọ̀ àsọtẹ́lẹ̀ kan sí gbolohun méjì.
    rationale: Gíríìkì náà fi λέγει κύριος sínú àárín ọ̀rọ̀ àṣẹ náà. Àmi ìsọ̀rọ̀ taara àti kọ́mà ń jẹ́ kí ìṣàn ọ̀rọ̀ náà túbọ̀ hàn gbangba ní Yorùbá.
