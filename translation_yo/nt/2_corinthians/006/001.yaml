id: 2CO.6.1
reference: 2 Corinthians 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: yo
  text: Bí a ṣe ń bá Ọlọ́run ṣiṣẹ́ pọ̀[a], àwa náà ń rọ̀ yín kí ẹ má ṣe gba oore-ọ̀fẹ́ Ọlọ́run lásán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí alábàáṣiṣẹ́.” Ọ̀rọ̀ Gíríìkì náà kò sọ ní pàtó ẹni tí Paulu ń bá ṣiṣẹ́ pọ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka gidigidi sí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: bí a ti ń bá Ọlọ́run ṣiṣẹ́ pọ̀
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́, ó sì mú ẹni tí a ń bá ṣiṣẹ́ pọ̀ hàn gẹ́gẹ́ bí Ọlọ́run, èyí tí ọ̀rọ̀ tó ṣáájú nípa iṣẹ́ ìlàjà Ọlọ́run àti iṣẹ́ aṣojú Paulu ń tọ́ka sí. Àkọ́lé ìsàlẹ̀ fi ìtumọ̀ tí kò sọ ẹni náà ní pàtó sílẹ̀.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ ìyípadà ọ̀rọ̀ onírẹ̀lẹ̀. “Nítorí náà” so ẹsẹ̀ yìí mọ́ ìpè tó wà ní 5:20 àti iṣẹ́ Ọlọ́run tí a ṣẹ̀ṣẹ̀ ṣàlàyé, láìsọ ọ́ di àtakò.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: 'Ó fi iṣẹ́ rírọ̀ kún ipò iṣẹ́-pọ̀: “àwa pẹ̀lú ń rọ̀ yín.”'
- source_word: παρακαλοῦμεν
  choice: ń rọ̀
  rationale: “Rọ̀” jẹ́ ọ̀rọ̀ Yorùbá ti òde òní fún ìpè tọkàntọkàn tàbí ìkìlọ̀ alágbára, láìdi èdè ẹ̀sìn líle.
- source_word: μὴ
  choice: kí ẹ má ṣe
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ìdènà tó tẹ̀ lé ọ̀rọ̀ rírọ̀.
- source_word: εἰς κενὸν
  choice: lásán
  rationale: Nínú àyíká yìí, “lásán” túmọ̀ sí pé ohun náà kò ní èso tàbí àbájáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ìtumọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις, ó sì pa ìtumọ̀ iṣẹ́ inú rere àti ẹ̀bùn Ọlọ́run mọ́.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀kan orúkọ méjèèjì nínú “oore-ọ̀fẹ́ Ọlọ́run” ṣe àfihàn genitive Gíríìkì lọ́nà Yorùbá tó ṣe déédé.
- source_word: δέξασθαι
  choice: gba
  rationale: “Gba” jẹ́ ìbámu àdánidá fún gbígba tàbí títẹ́wọ́gba ohun kan, ó sì bá ìlò ẹ̀kọ́ ìgbàgbọ́ mu láìfikún ìtumọ̀.
- source_word: ὑμᾶς
  choice: yín / ẹ
  rationale: Fọ́ọ̀mù ọ̀pọ̀ ènìyàn “yín/ẹ” pa àfojúsùn ọ̀pọ̀ ti ὑμᾶς mọ́, ó sì yẹ fún èdè ọlọ́wọ̀.
theological_decisions:
- issue: Ẹni tí a ń bá ṣiṣẹ́ pọ̀ nínú Συνεργοῦντες
  choice: A mú Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀ ń bá ṣiṣẹ́ pọ̀.
  alternative: “Bí a ti ń ṣiṣẹ́ pọ̀” tàbí “gẹ́gẹ́ bí alábàáṣiṣẹ́,” láìsọ ẹni tí wọ́n ń bá ṣiṣẹ́.
  rationale: Ọ̀rọ̀ tó sún mọ́ ọn jù lọ tẹnu mọ́ iṣẹ́ ìlàjà Ọlọ́run àti ipò àwọn aposteli gẹ́gẹ́ bí aṣojú rẹ̀ (5:18–20). Síbẹ̀, Gíríìkì kò sọ ẹni tí wọ́n ń bá ṣiṣẹ́ ní tààràtà; nítorí náà a tọ́ka sí ìṣòro yìí nínú àkọ́lé ìsàlẹ̀ dípò kí a pa àṣàyàn mìíràn rẹ́.
- issue: Ìtumọ̀ gbígba oore-ọ̀fẹ́ “lásán”
  choice: Gbígba tí kò ní èso tàbí àbájáde tí ó yẹ.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé wọn kò gba oore-ọ̀fẹ́ náà rárá.
  rationale: εἰς κενόν ń tọ́ka sí ohun tí ó di asán tàbí tí kò ní èso. Ìtumọ̀ náà kò pinnu ní pàtó bí èyí ṣe ní í ṣe pẹ̀lú ìgbàlà wọn; a pa ìkìlọ̀ àti ìfúnpọ̀ ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “àwa/ẹ” láti pa ọ̀pọ̀ ènìyàn Gíríìkì mọ́. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti yẹ.
