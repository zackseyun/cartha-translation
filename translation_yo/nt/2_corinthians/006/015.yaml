id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: yo
  text: Ìbáramu wo sì ni ó wà láàárín Mèsáyà àti Beliari? Tàbí ìpín wo ni onígbàgbọ́ ní pẹ̀lú aláìgbàgbọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliari: Èyí ni ìkọ̀wé Yorùbá fún orúkọ Gíríìkì Βελιάρ (Beliar); a tún máa ń lo ìrísí orúkọ náà “Beliali.”'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: ìbáramu
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìṣọ̀kan tàbí bí àwọn méjì ṣe lè bá ara wọn mu. “Ìbáramu” jẹ́ èdè Yorùbá àdánidá tí ó mú ìtakora inú ìbéèrè náà jáde.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín, Χριστός dúró gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, nítorí náà “Mèsáyà” ni a lò dípò kí a sọ ọ́ di orúkọ lásán.
- source_word: Βελιάρ
  choice: Beliari
  rationale: Orúkọ ẹni ni a kọ ní ìbámu pẹ̀lú ìró èdè Yorùbá, láìfi àlàyé ìtumọ̀ míì kún ọ̀rọ̀ pàtàkì.
- source_word: μερίς
  choice: ìpín
  rationale: “Ìpín” pa èrò ohun tí ẹnì kan ní tàbí ń pín pẹ̀lú ẹlòmíràn mọ́, ó sì bá ìbéèrè àsọyé náà mu.
- source_word: πιστῷ
  choice: onígbàgbọ́
  rationale: Àpèjúwe náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹni; “onígbàgbọ́” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti tọ́ka sí ẹni tí ó gbàgbọ́.
- source_word: ἀπίστου
  choice: aláìgbàgbọ́
  rationale: Nínú ìtakora rẹ̀ pẹ̀lú πιστός, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí kò gbàgbọ́; “aláìgbàgbọ́” pa ìtumọ̀ yìí mọ́ láìyí i sí àìṣòótọ́.
- source_word: πρὸς
  choice: láàárín ... àti ...
  rationale: Pẹ̀lú συμφώνησις, ọ̀rọ̀ atọ́ka yìí fi ìbáṣepọ̀ àwọn méjì hàn; ìṣètò “láàárín ... àti ...” jẹ́ èdè Yorùbá àdánidá.
- source_word: μετὰ
  choice: pẹ̀lú
  rationale: Ọ̀rọ̀ atọ́ka náà fi ìbáṣepọ̀ tàbí àjọṣepọ̀ hàn; “pẹ̀lú” ni ìtumọ̀ kúkúrú tí ó bá a mu.
- source_word: δὲ
  choice: sì
  rationale: δὲ ń tẹ̀síwájú nínú ọ̀wọ́ àwọn ìbéèrè àsọyé. “Sì” fi ìtẹ̀síwájú náà hàn láìmú ìtakora tí ó lágbára wọ inú rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú fífi Χριστός àti Beliari dojú kọ ara wọn, oyè ẹni tí Ọlọ́run yàn ni ó hàn gbangba. “Mèsáyà” pa ipò oyè náà mọ́.
- issue: Ta ni Βελιάρ ń tọ́ka sí
  choice: A pa Beliari mọ́ gẹ́gẹ́ bí orúkọ ẹni búburú tí a fi ṣe ìtakora pẹ̀lú Mèsáyà
  alternative: Beliali
  rationale: A tú orúkọ náà sí ìkọ̀wé Yorùbá láìfi ìdánimọ̀ tàbí ẹ̀kọ́ àfikún sínú ọ̀rọ̀ pàtàkì; àkọsílẹ̀ ìsàlẹ̀ sọ àwọn ìrísí orúkọ mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A yan “ìbáramu” fún ọ̀rọ̀ tí ó jọ harmony/accord, a sì pa ìṣètò àwọn ìbéèrè àsọyé méjèèjì mọ́. Àmì ohùn wà lórí àwọn ọ̀rọ̀ Yorùbá níbi tí ó ti yẹ; orúkọ àjèjì “Beliari” kò gba àmì ohùn láti yẹra fún fífi ìtúmọ̀ ìró tí orísun kò sọ kún un.
