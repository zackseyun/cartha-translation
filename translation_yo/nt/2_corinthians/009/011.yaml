id: 2CO.9.11
reference: 2 Corinthians 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: yo
  text: A ń sọ yín di ọlọ́rọ̀ ní gbogbo ọ̀nà fún fífúnni lọ́pọ̀wọ́, èyí tí, nípasẹ̀ wa, ń mú ìdúpẹ́ sí Ọlọ́run wá—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: ní gbogbo ọ̀nà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìpèsè náà gbòòrò sí gbogbo ọ̀nà; ó jẹ́ èdè Yorùbá àdánidá ju títúmọ̀ rẹ̀ gẹ́gẹ́ bí ibi kan lọ.
- source_word: πλουτιζόμενοι
  choice: a ń sọ yín di ọlọ́rọ̀
  rationale: Ìtumọ̀ yìí pa ìṣe tí ẹni mìíràn ń ṣe mọ́ wọn mọ́, Ọlọ́run sì ni olùṣe tí àyíká ọ̀rọ̀ náà túmọ̀ sí. Fífí arọ́pò-orúkọ ‘yín’ kún un jẹ́ kí gbólóhùn àpapọ̀ Giriki náà ṣe kedere ní Yorùbá.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: fún gbogbo ọ̀wọ́ ọ̀làwọ́
  rationale: Nínú àyíká ọ̀rọ̀ ọrẹ fífún yìí, ἁπλότης ń tọ́ka sí fífúnni tọkàntọkàn àti lọ́pọ̀wọ́, kì í ṣe ìrọ̀rùn nìkan. ‘Fún’ sì pa èrò ìdí tàbí àbájáde εἰς mọ́.
- source_word: ἥτις
  choice: èyí tí
  rationale: Ó tọ́ka padà sí ọ̀wọ́ ọ̀làwọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì ṣàgbékalẹ̀ àbájáde rẹ̀.
- source_word: κατεργάζεται
  choice: ó ń mú ... wá
  rationale: Àpólà yìí sọ ní èdè Yorùbá àdánidá pé ohun kan ń fa àbájáde kan jáde.
- source_word: δι’ ἡμῶν
  choice: nípasẹ̀ wa
  rationale: 'Ó pa ìtumọ̀ ohun èlò tàbí aṣojú mọ́: Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ni a fi ń ṣe iṣẹ́ ìpín ọrẹ náà.'
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ìdúpẹ́ sí Ọlọ́run
  rationale: Ó pa ìdúpẹ́ gẹ́gẹ́ bí ohun tí ọ̀wọ́ ọ̀làwọ́ náà ń mú jáde mọ́, Ọlọ́run sì ni ẹni tí a ń dúpẹ́ lọwọ rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἁπλότης nínú àyíká ọrẹ àkójọ
  choice: ọ̀wọ́ ọ̀làwọ́ nínú fífúnni
  alternative: ìrọ̀rùn, òtítọ́ inú, tàbí ọkàn kan ṣoṣo
  rationale: Bí ó tilẹ̀ jẹ́ pé ἁπλότης lè túmọ̀ sí ìrọ̀rùn tàbí òtítọ́ inú ní ibòmíràn, àyíká ìpèsè owó àti ìdúpẹ́ tí ó ń yọrí sí mú kí ọ̀wọ́ ọ̀làwọ́ jẹ́ ìtumọ̀ tí ó bá ibi yìí mu jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. A pa àkópọ̀ gbólóhùn tí ó ń tẹ̀ síwájú mọ́ pẹ̀lú àmì gígùn ní ìparí, nítorí ẹsẹ yìí jẹ́ apá kan nínú gbólóhùn gígùn. ‘Ọlọ́rọ̀’ kò túmọ̀ sí ìlérí ọrọ̀ àlùmọ́nì ní pàtó; àpólà ‘ní gbogbo ọ̀nà fún gbogbo ọ̀wọ́ ọ̀làwọ́’ ló ń dí ìtumọ̀ rẹ̀ mọ́ àyíká ìpèsè fún fífúnni.
