id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: yo
  text: Nítorí náà, mo rí i pé ó ṣe pàtàkì láti rọ àwọn arákùnrin[a] náà pé kí wọ́n lọ ṣáájú wa sí ọ̀dọ̀ yín, kí wọ́n sì ṣètò ẹ̀bùn ọ̀làwọ́[b] tí ẹ ti ṣèlérí náà sílẹ̀ ṣáájú, kí ó lè ti múra tán gẹ́gẹ́ bí ẹ̀bùn ọ̀làwọ́, kì í ṣe gẹ́gẹ́ bí ohun tí a fi ipá gba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin,” bí a bá lóye ẹgbẹ́ aṣojú náà gẹ́gẹ́ bí ẹgbẹ́ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ìbùkún.” Níhìn-ín, ó ń tọ́ka sí ọrẹ tí àwọn ará Kọ́ríńtì ti ṣèlérí láti fi ọ̀làwọ́ fún.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “ojúkòkòrò” tàbí “ìwọra”; níhìn-ín, ó ṣàpèjúwe ìkójọ ọrẹ náà bí ohun tí a fi ìfipámúni yọ lọ́wọ́ wọn, dípò ẹ̀bùn tí wọ́n fi ọ̀làwọ́ fún.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Nítorí náà, mo rí i pé ó ṣe pàtàkì
  rationale: Ó fi ìdájọ́ Pọ́ọ̀lù nípa ohun tí ó yẹ kí a ṣe hàn, láì sọ ọ́ di àṣẹ tí kò ṣeé yà sílẹ̀.
- source_word: παρακαλέσαι
  choice: láti rọ
  rationale: “Rọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìtara gba ẹnì kan níyànjú láti ṣe ohun kan.
- source_word: τοὺς ἀδελφοὺς
  choice: àwọn arákùnrin náà
  rationale: Ó pa ìbálòpọ̀ akọ tí ọ̀rọ̀ Gíríìkì náà ní mọ́; àlàyé ìsàlẹ̀ sọ pé ó tún lè tọ́ka sí ẹgbẹ́ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: kí wọn ṣáájú wa lọ sọ́dọ̀ yín
  rationale: Ó sọ ìrìn àjò aṣojú náà ṣáájú Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ní kedere gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: προκαταρτίσωσι
  choice: kí wọn sì ṣètò ... sílẹ̀ ṣáájú
  rationale: Ó túmọ̀ sí ṣíṣe ètò kí ọrẹ náà lè ti múra tán kí Pọ́ọ̀lù tó dé.
- source_word: προεπηγγελμένην
  choice: tí ẹ ti ṣèlérí
  rationale: Ó fi hàn pé àwọn ará Kọ́ríńtì ti ṣèlérí ọrẹ náà tẹ́lẹ̀.
- source_word: εὐλογίαν
  choice: ẹ̀bùn ọ̀làwọ́
  rationale: Ní àyíká ìkójọ ọrẹ yìí, ọ̀rọ̀ náà ń tọ́ka sí ọrẹ tí a fi inú rere fún; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan, “ìbùkún,” mọ́.
- source_word: ἑτοίμην εἶναι
  choice: kí ó lè múra tán
  rationale: Ó sọ ète ìṣètò ṣáájú náà ní Yorùbá àdánidá.
- source_word: πλεονεξίαν
  choice: ohun tí a fi ipá gbà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà sábà máa ń túmọ̀ sí ojúkòkòrò, níbí ó ń ṣe àfihàn ọrẹ bí ohun tí a fi ìfipámúni tàbí ìmọtara-ẹni-nìkan yọ lọ́wọ́ àwọn olùfúnni.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú ἀδελφοὺς
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin
  rationale: A pa fọ́ọ̀mù akọ ọ̀rọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, ṣùgbọ́n a kò pa ṣíṣeéṣe pé ẹgbẹ́ aṣojú náà lè jẹ́ àkópọ̀ ọkùnrin àti obìnrin rẹ́; a fi sí àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ εὐλογία nínú ọ̀rọ̀ ìkójọ ọrẹ
  choice: ẹ̀bùn ọ̀làwọ́
  alternative: ìbùkún
  rationale: “Ẹ̀bùn ọ̀làwọ́” mú ohun tí ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká yìí yé kedere, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán “ìbùkún” àti ìtẹnumọ́ rẹ̀ mọ́.
- issue: Ìtumọ̀ πλεονεξία ní òpin ìyàtọ̀ náà
  choice: ohun tí a fi ipá gbà
  alternative: ojúkòkòrò
  rationale: Ìtumọ̀ yìí mú ìyàtọ̀ tó wà láàárín ọrẹ àtinúwá àti ọrẹ tí a yọ lọ́wọ́ ènìyàn jáde, láì sọ ìtumọ̀ ìpilẹ̀ ti ojúkòkòrò nù; àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lásán. A tún “ẹ̀bùn ọ̀làwọ́” sọ láti pa ìtẹnumọ́ εὐλογία méjèèjì mọ́.
