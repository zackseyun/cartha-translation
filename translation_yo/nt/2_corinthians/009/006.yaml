id: 2CO.9.6
reference: 2 Corinthians 9:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: yo
  text: 'Èyí sì ni pé: ẹni tí ó ń fúnrúgbìn níwọ̀nba yóò sì ká níwọ̀nba, ẹni tí ó ń fúnrúgbìn pẹ̀lú ìbùkún[a] yóò sì ká pẹ̀lú ìbùkún.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́pọ̀ yanturu” tàbí “ní ọ̀làwọ́.” Ọ̀rọ̀ Gíríìkì náà lo orúkọ ọ̀rọ̀ náà fún “ìbùkún” ní ọ̀pọ̀, ṣùgbọ́n níbí gbólóhùn náà lè ṣàpèjúwe fífúnni ní ọ̀pọ̀ yanturu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Èyí sì ni pé:'
  rationale: Èyí sì ni pé jẹ́ ọ̀nà Yorùbá àdánidá láti mú àkópọ̀ ọ̀rọ̀ pàtàkì kan wọlé, ó sì pa agbára ìyípadà ọ̀rọ̀ inú δέ mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: ὁ σπείρων
  choice: ẹni tí ó ń fúnrúgbìn
  rationale: 'Ó pa ìtumọ̀ àpapọ̀ àti àpẹẹrẹ ti participle náà mọ́: ẹni èyíkéyìí tí ó bá wà ní ipò afúnrúgbìn.'
- source_word: φειδομένως
  choice: níwọ̀nba díẹ̀
  rationale: Ní àyíká fífúnni yìí, ọ̀rọ̀ náà tọ́ka sí ìwọ̀n kékeré tàbí fífúnni díẹ̀. Àṣàyàn yìí ṣe kedere láìfi ẹ̀sùn líle bí ìwọra kún un.
- source_word: καὶ θερίσει
  choice: yóò sì ká
  rationale: Sì so àbájáde ìkórè pọ̀ mọ́ irú fífúnrúgbìn náà, yóò sì ṣe àfihàn ọjọ́ iwájú gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: ἐπ’ εὐλογίαις
  choice: pẹ̀lú ìbùkún
  rationale: Ó pa orúkọ ọ̀rọ̀ ìbùkún àti àtúnlò rẹ̀ mọ́ nínú fífúnrúgbìn àti ìkórè. Ní àyíká yìí, gbólóhùn náà tún lè túmọ̀ sí lọ́pọ̀ yanturu tàbí ní ọ̀làwọ́; àlàyé ìsàlẹ̀ fi èyí hàn.
theological_decisions:
- issue: Ìtumọ̀ εὐλογίαις nínú òwe fífúnrúgbìn àti ìkórè
  choice: Pa ìtumọ̀ gangan “ìbùkún” mọ́ nínú àkọọ́lẹ̀.
  alternative: “lọ́pọ̀ yanturu” tàbí “ní ọ̀làwọ́”
  rationale: Àyíká náà jẹ́ ti fífúnni lọ́pọ̀, ṣùgbọ́n εὐλογία jẹ́ orúkọ ọ̀rọ̀ tí ó ní ìtumọ̀ ìbùkún. “Pẹ̀lú ìbùkún” pa ìsopọ̀ ọ̀rọ̀ àti ìdọ́gba fífúnrúgbìn–ìkórè mọ́, láìyí òwe náà padà sí ìlérí dandan pé ẹni tí ó fúnni yóò di ọlọ́rọ̀ nípa ohun ìní.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Àtúnlò “níwọ̀nba díẹ̀” àti “pẹ̀lú ìbùkún” pa ìfarawé àti ìwọ̀ntúnwọ̀nsì òwe Gíríìkì mọ́.
