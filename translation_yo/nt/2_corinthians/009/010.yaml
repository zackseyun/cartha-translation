id: 2CO.9.10
reference: 2 Corinthians 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: yo
  text: Ẹni tí ó ń pèsè irúgbìn fún afúnrúgbìn àti oúnjẹ fún jíjẹ yóò pèsè irúgbìn yín, yóò sì sọ ọ́ di púpọ̀, yóò sì mú èso òdodo yín pọ̀ sí i[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò mú àwọn èso tàbí ohun tí òdodo yín mú jáde pọ̀ sí i.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èso ìdájọ́ yín.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè túmọ̀ sí “òdodo” tàbí, ní àwọn àyíká kan, “ìdájọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: Ẹni tí ó ń pèsè
  rationale: A mú ọ̀rọ̀ arọ́pò-orúkọ olùṣe náà jáde gẹ́gẹ́ bí ‘Ẹni tí ó ń pèsè’; ó ṣe kedere, ó sì pa ìtumọ̀ pípèsè mọ́ láìfi ìtumọ̀ ọ̀làwọ́ tí ó lè wà nínú ọ̀rọ̀ náà kún un ní tipátipá.
- source_word: σπόρον
  choice: irúgbìn
  rationale: ‘Irúgbìn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a ń fún, ó sì pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
- source_word: τῷ σπείροντι
  choice: fún afúnrúgbìn
  rationale: ‘Afúnrúgbìn’ túmọ̀ sí ẹni tí ń fún irúgbìn; ó jẹ́ ọ̀rọ̀ ṣókí tí ó bá participle olùṣe mu.
- source_word: ἄρτον εἰς βρῶσιν
  choice: oúnjẹ fún jíjẹ
  rationale: Nítorí ‘àkàrà’ tàbí ‘búrẹ́dì’ lè dín ἄρτον kù sí irú oúnjẹ kan pàtó ní Yorùbá òde òní, ‘oúnjẹ fún jíjẹ’ mú iṣẹ́ ọ̀rọ̀ náà àti ìyàtọ̀ rẹ̀ sí irúgbìn tí a ó fún dúró lọ́nà àdánidá.
- source_word: χορηγήσει
  choice: yóò pèsè
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí tún ìṣe pípèsè tí ó wà ní ìbẹ̀rẹ̀ gbólóhùn náà sọ.
- source_word: πληθυνεῖ
  choice: yóò sì sọ ọ́ di púpọ̀
  rationale: Ó sọ ìtumọ̀ mímú ohun di púpọ̀ jáde kedere, nígbà tí ‘ọ́’ tọ́ka sí irúgbìn.
- source_word: τὸν σπόρον ὑμῶν
  choice: irúgbìn fún yín
  rationale: Genitive náà lè jẹ́ irúgbìn tí ó jẹ́ ti àwọn olùgbọ́ tàbí tí a pèsè fún wọn; ‘fún yín’ bá ìṣàn Yorùbá mu, ó sì yẹra fún ọ̀rọ̀ tí kò rọrùn bí ‘irúgbìn yín’ nínú àyíká yìí.
- source_word: αὐξήσει
  choice: yóò sì mú ... pọ̀ sí i
  rationale: Ìtumọ̀ rẹ̀ ni mímú kí ohun dàgbà tàbí pọ̀ sí i; ìkọ́lé yìí jẹ́ àdánidá ní Yorùbá.
- source_word: τὰ γενήματα
  choice: èso
  rationale: ‘Èso’ lè túmọ̀ sí ohun tí ohun ọ̀gbìn mú jáde àti àbájáde ìwà; nítorí náà ó pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ àpẹẹrẹ náà mọ́. A ṣàlàyé ‘ìkórè/ọ̀pọ̀ èso’ nínú àlàyé ìsàlẹ̀.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún righteousness, ó sì pa ìbú ìtumọ̀ ìwà rere àti ìdúró tó tọ́ mọ́. ‘Ìdájọ́ òdodo’ wà gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘èso òdodo yín’
  choice: Àpẹẹrẹ fún èso tàbí àbájáde tí ń jáde láti inú òdodo wọn, pàápàá nínú ọ̀làwọ́ fífúnni, láìdín un kù sí èrè ohun ìní tàbí ipò òdodo níwájú Ọlọ́run nìkan.
  alternative: Ó lè tọ́ka sí ìbùkún ohun ìní, èso ìṣòtítọ́/ìdájọ́ òdodo, tàbí ẹ̀rí ìwà òdodo.
  rationale: Àyíká náà jẹ́ ti fífúnni pẹ̀lú ọ̀làwọ́, ṣùgbọ́n àwòrán iṣẹ́ àgbẹ̀ àti δικαιοσύνη ní ìbú ìtumọ̀. A pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ dípò yíyan ìtumọ̀ ẹ̀ka kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A kò fi ọ̀rọ̀ àsopọ̀ bí ‘Ǹjẹ́’ tàbí ‘Nísinsin yìí’ sí ìbẹ̀rẹ̀, nítorí δέ kì í ṣe ọ̀rọ̀ àkókò níhìn-ín, ìṣàn Yorùbá náà kò sì nílò rẹ̀.
