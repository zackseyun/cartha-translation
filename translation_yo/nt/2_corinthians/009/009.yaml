  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: yo
  text: 'gẹ́gẹ́ bí a ti kọ ọ́ pé:


    “Ó fọ́n ká, ó fi fún àwọn tálákà;

    òdodo rẹ̀[a] dúró títí láéláé.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo rẹ̀ dúró títí láéláé.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ òdodo àti ìdájọ́ òdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà àdáni tí a fi ń tọ́ka sí Ìwé Mímọ́; ó bójú mu Gíríìkì, ó sì jẹ́ èdè Yorùbá tí ó ṣe déédé.
- source_word: Ἐσκόρπισεν
  choice: Ó tú ká
  rationale: Ó pa àwòrán títú ohun ká sí ibi púpọ̀ mọ́, dípò kí a sọ ọ́ di ‘ó pín’ lásán; nínú àyíká yìí, ó ń tọ́ka sí fífúnni lọ́pọ̀lọpọ̀.
- source_word: ἔδωκεν
  choice: ó fi fún
  rationale: Ìṣe tí ó ti ṣẹlẹ̀ ni aorist náà ń sọ; ‘ó fi fún’ jẹ́ ọ̀nà Yorùbá àdáni tí ó sì bá ẹni tí a fún tẹ̀ lé e mu.
- source_word: τοῖς πένησιν
  choice: àwọn òtòṣì
  rationale: πένης ń tọ́ka sí àwọn tí ohun ìní wọn kéré; ‘àwọn òtòṣì’ jẹ́ ìtumọ̀ tààrà, tí ó sì yé àwọn òǹkàwé lónìí.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: òdodo rẹ̀
  rationale: ‘Òdodo’ pa ìtumọ̀ δικαιοσύνη gẹ́gẹ́ bí ìwà tàbí ìṣe tí ó tọ́ mọ́, ó sì lè ru ìmọ̀ ìdájọ́ òdodo pẹ̀lú. A pa àṣàyàn ‘ìdájọ́ òdodo’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: μένει
  choice: dúró
  rationale: Nínú gbólóhùn yìí, ‘dúró’ túmọ̀ sí pé ohun náà ń bá a lọ, kò sì dópin; ó jẹ́ Yorùbá tó rọrùn, tó sì bójú mu μένει.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Èyí ni ọ̀nà Yorùbá àdáni fún ohun tí ń bá a lọ láìní òpin.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ tí Pọ́ọ̀lù fa yọ
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ ni ìtumọ̀ gbòòrò tí ó pa ìwà àti ìṣe tí ó tọ́ mọ́ láìfi tipátipá pinnu bóyá ìwà ẹni tàbí ìṣe ọ̀làwọ́ rẹ̀ ni a tẹnu mọ́. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ìdájọ́ òdodo.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A ṣètò apá àyọlò náà bí ewì láti pa ìrísí ọ̀rọ̀ Sáàmù tí a fa yọ mọ́.
