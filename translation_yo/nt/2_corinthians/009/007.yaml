reference: 2 Corinthians 9:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: yo
  text: Kí olúkúlùkù fúnni gẹ́gẹ́ bí ó ti pinnu nínú ọkàn rẹ̀, kì í ṣe láti inú ìbànújẹ́[a] tàbí nípa ìfipámú[b], nítorí Ọlọ́run fẹ́ràn olùfúnni tí inú rẹ̀ dùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láìfẹ́.” Ní tààrà, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “láti inú ìbànújẹ́” tàbí “láti inú ìbànilẹ́rù.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “nítorí àìní-àṣàyàn” tàbí “nípa tipátipá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtumọ̀ pínpín ti ọ̀rọ̀ ẹyọ náà mọ́, ó sì kan ẹnì kọ̀ọ̀kan láìfi akọ tàbí abo kún un.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìlànà tí ìfúnni yóò tẹ̀ lé hàn ní Yorùbá àdánidá.
- source_word: προῄρηται
  choice: ó ti pinnu
  rationale: Ó sọ ìpinnu tí a ti mọ̀ọ́mọ̀ ṣe tẹ́lẹ̀, kì í ṣe ìṣe òjijì tàbí èyí tí ẹlòmíràn fi tipá múni ṣe.
- source_word: τῇ καρδίᾳ
  choice: nínú ọkàn rẹ̀
  rationale: Ó pa àwòrán ọkàn gẹ́gẹ́ bí ibi ìpinnu inú ẹni mọ́, dípò kíkó ìtumọ̀ rẹ̀ mọ́ èrò orí nìkan.
- source_word: μὴ ἐκ λύπης
  choice: kì í ṣe láti inú ìbànújẹ́
  rationale: λύπη túmọ̀ ní tààrà sí ìbànújẹ́ tàbí ìkorò ọkàn; gbólóhùn yìí pa agbára ọ̀rọ̀ náà mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún lè tọ́ka sí fífúnni láìfẹ́.
- source_word: ἢ ἐξ ἀνάγκης
  choice: tàbí lábẹ́ àfipámú
  rationale: Nínú àyíká ìfúnni, ἀνάγκη ń tọ́ka sí ìkápá tàbí ipá tí kò jẹ́ kí ẹni ní àṣàyàn ní òmìnira.
- source_word: ἱλαρὸν
  choice: tí inú rẹ̀ dùn
  rationale: Ọ̀nà àdánidá ni èyí láti sọ ẹni aláyọ̀ tàbí ẹni tó ń fúnni pẹ̀lú inú dídùn ní Yorùbá.
- source_word: δότην
  choice: olùfúnni
  rationale: Ọ̀rọ̀ orúkọ ṣókí, tó ṣe kedere fún ẹni tí ń fúnni.
- source_word: ἀγαπᾷ
  choice: fẹ́ràn
  rationale: Ó pa ìtumọ̀ ìfẹ́ ti ἀγαπάω mọ́ láìyí i sí ìtẹ́wọ́gbà nìkan.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá boṣewa fún orúkọ olùṣe náà.
theological_decisions:
- issue: Ẹyọ aṣojú àti akọ gírámà Gíríìkì
  choice: olúkúlùkù ... ó ... rẹ̀
  alternative: olúkúlùkù ọkùnrin ... òun
  rationale: Àwọn arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn. Èyí pa ẹyọ àti ìdojúkọ ẹnì kọ̀ọ̀kan mọ́ láìsọ pé àwọn ọkùnrin nìkan ni ọ̀rọ̀ náà kàn.
- issue: Ìtumọ̀ λύπη nínú ọ̀rọ̀ nípa fífúnni
  choice: láti inú ìbànújẹ́
  alternative: láìfẹ́
  rationale: Àkọ́kọ́ pa ìtumọ̀ gangan ti ‘ìbànújẹ́/ìkorò ọkàn’ mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àyíká ‘láìfẹ́’ hàn láìfi ọ̀kan dípò èkejì ní ìkọ̀kọ̀.
- issue: Ìṣe fífúnni tí a kò kọ ní kedere nínú gbólóhùn àkọ́kọ́ Gíríìkì
  choice: Kí olúkúlùkù fúnni
  alternative: Olúkúlùkù gẹ́gẹ́ bí ó ti pinnu nínú ọkàn rẹ̀
  rationale: Ìṣe náà ṣe kedere láti inú àyíká àti ọ̀rọ̀ δότην; fífi ‘fúnni’ kún un jẹ́ dandan fún gbólóhùn Yorùbá tó pé, kò sì ṣàfikún ẹ̀kọ́ tuntun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu. Èdè náà níyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a pa àwòrán ‘ọkàn’ àti ìyàtọ̀ láàárín ìbànújẹ́, àfipámú, àti ayọ̀ mọ́.
