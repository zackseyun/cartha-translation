    reason: lexical_alternative
  revision_rationale: The revision replaces a worship-associated term with a relief-service term appropriate to the collection under discussion, improves the Yoruba expression for repeated thanksgivings, and retains both the Greek distinction between διακονία and λειτουργία and the source’s open-ended concluding dash. The footnotes remain correctly anchored and preserve viable lexical alternatives.
