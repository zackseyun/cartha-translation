revisions:
- from: Nítorí iṣẹ́ ìránṣẹ́ ti iṣẹ́ ìsìn yìí kì í ṣe pé ó ń pèsè ohun tí àwọn ẹni mímọ́ nílò nìkan[a], ṣùgbọ́n ó tún ń pọ̀ sí i nípasẹ̀ ọ̀pọ̀ ọpẹ́ tí a ń fi fún Ọlọ́run[b]—
  to: Nítorí iṣẹ́ ìránṣẹ́ fún iṣẹ́ ìrànlọ́wọ́ yìí kì í ṣe pé ó ń pèsè ohun tí àwọn ẹni mímọ́ nílò nìkan[a], ṣùgbọ́n ó tún ń mú kí ọ̀pọ̀lọpọ̀ ìdúpẹ́ lọ sí Ọlọ́run[b]—
  rationale: The revision replaces a worship-associated term with a relief-service term appropriate to the collection under discussion, improves the Yoruba expression for repeated thanksgivings, and retains both the Greek distinction between διακονία and λειτουργία and the source’s open-ended concluding dash. The footnotes remain correctly anchored and preserve viable lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the explanatory force of ὅτι, the contrast between meeting the saints’ deficiencies and an abundance of thanksgiving, and the unfinished syntactic continuation marked by the dash. However, “iṣẹ́ ìsìn” can naturally suggest worship or religious observance in Yoruba and is not a suitable rendering of λειτουργία in this relief-collection context. The expression for the Godward abundance is also clearer when it indicates that the ministry occasions many thanksgivings, without overstating a disputed nuance of διά.
  naturalness: The proposed revision uses idiomatic modern Yoruba. “Àwọn ẹni mímọ́” remains a recognizable, appropriately formal Pauline ecclesial term. “Ìdúpẹ́” is more natural and precise than bare “ọpẹ́” for plural acts of thanksgiving.
  terminology: “Iṣẹ́ ìránṣẹ́” for διακονία and “iṣẹ́ ìrànlọ́wọ́” for the συγκεκριμένη λειτουργία retain a useful distinction while fitting the immediate charitable context. “Àwọn ẹni mímọ́” appropriately preserves ἅγιοι.
  issues:
  - severity: medium
    issue: “iṣẹ́ ìsìn” for λειτουργία
    rationale: In contemporary Standard Yoruba, iṣẹ́ ìsìn primarily evokes worship/religious service. The Greek refers here to the particular practical service of the collection, so “iṣẹ́ ìrànlọ́wọ́” is more contextually faithful.
  - severity: low
    issue: “ọ̀pọ̀ ọpẹ́” and “nípasẹ̀” construction
    rationale: “Ọ̀pọ̀lọpọ̀ ìdúpẹ́ sí Ọlọ́run” is more idiomatic for many thanksgivings. Rendering the outcome as causing thanksgiving is clear Yoruba while retaining the verse’s abundance and Godward direction; the alternative footnote preserves the more formally structured image.
  revised_text: Nítorí iṣẹ́ ìránṣẹ́ fún iṣẹ́ ìrànlọ́wọ́ yìí kì í ṣe pé ó ń pèsè ohun tí àwọn ẹni mímọ́ nílò nìkan[a], ṣùgbọ́n ó tún ń mú kí ọ̀pọ̀lọpọ̀ ìdúpẹ́ lọ sí Ọlọ́run[b]—
  revised_footnotes:
  - marker: a
    text: Tàbí, “ó ń kún ohun tí ó kù fún àwọn ẹni mímọ́.”
    reason: lexical_alternative
