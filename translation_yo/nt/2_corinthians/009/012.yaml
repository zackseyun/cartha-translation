id: 2CO.9.12
reference: 2 Corinthians 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: yo
  text: Nítorí iṣẹ́ ìránṣẹ́ fún iṣẹ́ ìrànlọ́wọ́ yìí kì í ṣe pé ó ń pèsè ohun tí àwọn ẹni mímọ́ nílò nìkan[a], ṣùgbọ́n ó tún ń mú kí ọ̀pọ̀lọpọ̀ ìdúpẹ́ lọ sí Ọlọ́run[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń kún ohun tí ó kù fún àwọn ẹni mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó tún ń ṣàn àkúnwọ́sílẹ̀ nípasẹ̀ ọ̀pọ̀lọpọ̀ ìdúpẹ́ sí Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ọ̀rọ̀ tí ó ṣáájú, ó sì bójú mu fún ìtumọ̀ ‘for/because’ nínú àyíká yìí.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: iṣẹ́ ìránṣẹ́ ti iṣẹ́ ìsìn yìí
  rationale: A pa ìyàtọ̀ láàárín διακονία àti λειτουργία mọ́ nípa lílo ‘iṣẹ́ ìránṣẹ́’ àti ‘iṣẹ́ ìsìn,’ láì sọ àwọn ọ̀rọ̀ méjèèjì di ọ̀rọ̀ kan náà.
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: ó ń pèsè ohun tí … nílò
  rationale: Èyí sọ ìpèsè ohun tí ó kù tàbí tí kò tó di Yorùbá àdánidá, tí ó sì ṣe kedere nínú ọ̀rọ̀ ìrànlọ́wọ́ yìí.
- source_word: τῶν ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Ó pa ọ̀rọ̀ pàtàkì tí Pọ́ọ̀lù máa ń lò fún àwọn onígbàgbọ́ mọ́, láì mú èrò ìsọni-di-mímọ́ ti ìgbà tó tẹ̀ lé e wọ inú ẹsẹ náà.
- source_word: περισσεύουσα
  choice: ó tún ń pọ̀ sí i
  rationale: Ó fi ìtumọ̀ ọ̀pọ̀ yanturu tí ó kọjá ìwọ̀n hàn, bí ó tilẹ̀ jẹ́ pé àwòrán ‘ṣàn àkúnwọ́sílẹ̀’ tún ṣeé ṣe.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: nípasẹ̀ ọ̀pọ̀ ọpẹ́ tí a ń fi fún Ọlọ́run
  rationale: ‘Nípasẹ̀’ pa agbára διά pẹ̀lú genitive mọ́; àfikún ‘tí a ń fi fún’ mú ẹni tí ọpẹ́ náà ń lọ sí ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù ἅγιοι
  choice: àwọn ẹni mímọ́
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: ‘Àwọn ẹni mímọ́’ sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa èdè ìjọ Pọ́ọ̀lù mọ́; ‘àwọn ènìyàn Ọlọ́run’ jẹ́ ìtumọ̀ àlàyé ju èyí lọ.
- issue: Ìbáṣepọ̀ iṣẹ́ ìránṣẹ́ náà pẹ̀lú ọpẹ́ sí Ọlọ́run
  choice: ó tún ń pọ̀ sí i nípasẹ̀ ọ̀pọ̀ ọpẹ́ tí a ń fi fún Ọlọ́run
  alternative: ó tún ń ṣàn àkúnwọ́sílẹ̀ nínú ọ̀pọ̀ ọpẹ́ sí Ọlọ́run
  rationale: A kò sọ bí διά ṣe ń ṣiṣẹ́ níbí di ọ̀nà kan ṣoṣo; ìtumọ̀ pàtàkì pa èrò ọ̀nà tàbí ohun tí iṣẹ́ náà fi ń pọ̀ sí i mọ́, àkọsílẹ̀ ìsàlẹ̀ sì fi àwòrán àkúnwọ́sílẹ̀ hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìyàtọ̀ àwọn ọ̀rọ̀ διακονία àti λειτουργία mọ́, a sì fi àmì ìdádúró gígùn sí òpin láti tẹ̀ lé bí gbólóhùn náà ṣe ń bá a lọ.
