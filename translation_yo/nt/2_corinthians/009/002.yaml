id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: yo
  text: Nítorí mo mọ ìmúratán yín[a], èyí tí mo ń ṣògo nípa yín fún àwọn ará Makedóníà, pé Akáíà[b] ti múra sílẹ̀ láti ọdún tó kọjá, ìtara yín sì ti ru ọ̀pọ̀ jù lọ[c] nínú wọn sókè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìtara ọkàn” tàbí “ìfẹ́ inú láti ṣe é.”
    reason: lexical_alternative
  - marker: b
    text: Akáíà ni agbègbè ìjọba Róòmù kan tí Kọ́ríńtì wà nínú rẹ̀; orúkọ agbègbè náà dúró fún àwọn onígbàgbọ́ tó wà níbẹ̀.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ọ̀pọ̀ ènìyàn jù lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: ìmúratán
  rationale: Ọ̀rọ̀ yìí sọ ìfẹ́ inú àti ìṣetán láti ṣe ohun kan; “ìmúratán” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ju ìmúra lásán lọ.
- source_word: καυχῶμαι
  choice: mo fi ń ṣògo
  rationale: Èyí pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́, kò sì sọ ọ́ di ìgbéraga inú tàbí ìyìn lásán.
- source_word: ὑπὲρ ὑμῶν
  choice: nípa yín
  rationale: Nínú ìsopọ̀ rẹ̀ pẹ̀lú καυχῶμαι, ó túmọ̀ sí pé Pọ́ọ̀lù ń sọ ohun rere nípa wọn níwájú àwọn ará Makedóníà.
- source_word: Μακεδόσιν
  choice: fún àwọn ará Makedóníà
  rationale: Dátífù náà ń tọ́ka sí àwọn ẹni tí Pọ́ọ̀lù ń bá sọ̀rọ̀; “àwọn ará Makedóníà” jẹ́ àfihàn ènìyàn ibẹ̀ láìfi “onígbàgbọ́” kún ọ̀rọ̀ Gíríìkì.
- source_word: Ἀχαΐα
  choice: Akáíà
  rationale: A pa orúkọ agbègbè Róòmù náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́, bí ó tilẹ̀ jẹ́ pé àwọn onígbàgbọ́ ibẹ̀ ni ọ̀rọ̀ náà dúró fún nínú àyíká yìí.
- source_word: παρεσκεύασται
  choice: ti múra sílẹ̀
  rationale: Ìṣe pípé náà fi ipò tó wá láti inú ìmúra tẹ́lẹ̀ hàn; “ti múra sílẹ̀” jẹ́ èdè Yorùbá àdánidá fún ipò yẹn.
- source_word: ἀπὸ πέρυσι
  choice: láti ọdún tó kọjá
  rationale: Gbólóhùn náà túmọ̀ sí pé ìmúra náà ti bẹ̀rẹ̀ ní ọdún tó ṣáájú, ó sì ń bá a lọ títí di àkókò tí a ń sọ̀rọ̀.
- source_word: τὸ ὑμῶν ζῆλος
  choice: ìtara yín
  rationale: “Ìtara” mú agbára àti ìfọkànsìn rere ζῆλος jáde ní àyíká ìyìn yìí.
- source_word: ἠρέθισε
  choice: ti ru … sókè
  rationale: Ní àyíká rere yìí, ọ̀rọ̀ náà túmọ̀ sí mímú kí àwọn ẹlòmíràn ní ìtara, kì í ṣe bíbínú sí wọn.
- source_word: τοὺς πλείονας
  choice: ọ̀pọ̀ jù lọ nínú wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ “ọ̀pọ̀ ènìyàn jù lọ” nínú àwọn ará Makedóníà tí a ṣẹ̀ṣẹ̀ dárúkọ.
theological_decisions:
- issue: Ẹni tí “Akáíà” dúró fún
  choice: A pa “Akáíà” mọ́ gẹ́gẹ́ bí orúkọ agbègbè tó dúró fún àwọn onígbàgbọ́ ibẹ̀.
  alternative: “Ẹ̀yin” tàbí “àwọn onígbàgbọ́ ní Akáíà ti múra sílẹ̀.”
  rationale: Gíríìkì dárúkọ Ἀχαΐα ní tààrà; pípa orúkọ náà mọ́ ń dá ọ̀rọ̀ Pọ́ọ̀lù àti ìwọ̀n gbogbo agbègbè náà sí.
- issue: Agbára ọ̀rọ̀ ṣíṣògo Pọ́ọ̀lù
  choice: “mo fi ń ṣògo nípa yín”
  alternative: “mo ń sọ̀rọ̀ ìyìn nípa yín” tàbí “mo ń gbéraga nínú yín”
  rationale: καυχῶμαι jẹ́ ọ̀rọ̀ líle tí Pọ́ọ̀lù mọ̀ọ́mọ̀ lò; kò yẹ kí a rọ̀ ọ́ di ìyìn lásán tàbí kí a fún un ní ìtumọ̀ ìgbéraga búburú.
translation_notes:
  register: A lo Yorùbá àgbàdojú, ọ̀wọ̀, àti èyí tí ó yé àwọn òǹkàwé òde òní. Àmì ohùn wà níbi tí ó bá yẹ. “Ìmúratán” àti “ìtara” pa ìyàtọ̀ tó wà láàárín προθυμία àti ζῆλος mọ́; “ru … sókè” sì mú ipa ìwúrí rere ἐρεθίζω jáde.
