  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: ó pa ìyàtọ̀ láàárín προθυμίαν (“ìmúratán”) àti ζῆλος (“ìtara”) mọ́, ó sì ṣàfihàn ipò pípẹ́ ti παρεσκεύασται pẹ̀lú ἀπὸ πέρυσι. Àmọ́, ọ̀nà “nípa yín fún àwọn ará Makedóníà” nílò ìmúṣẹ̀dá díẹ̀ kí ó lè hàn kedere pé àwọn ará Makedóníà ni ẹni tí Pọ́ọ̀lù ń bá ṣògo sí.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tó mọ́gbọ́n dání ní gbogbogbòò. “Mo ń ṣògo nípa yín fún àwọn ará Makedóníà” jẹ́ ìṣọ̀kan tó rọrùn síi ju “mo fi ń ṣògo nípa yín fún” lọ. A tún gbé àmì àlàyé c sí ọ̀rọ̀ “ọ̀pọ̀ jù lọ,” èyí tí ó jẹ́ ohun tí àlàyé rẹ̀ ń ṣàlàyé gan-an.
  terminology: “Ìmúratán,” “ṣògo,” “Akáíà,” àti “ìtara” bójú mu sí àwọn ọ̀rọ̀ Gíríìkì náà. Orúkọ àwọn ibi náà àti ìtọ́kasí Akáíà gẹ́gẹ́ bí agbègbè kan ni a pa mọ́.
  issues:
  - severity: low
    issue: Ìṣọ̀kan “mo fi ń ṣògo nípa yín fún àwọn ará Makedóníà” kò rọrùn jù lọ.
