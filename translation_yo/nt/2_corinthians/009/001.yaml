base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: yo
  text: Ní ti iṣẹ́ ìránṣẹ́ fún àwọn ẹni mímọ́[a], kò ṣe dandan fún mi láti kọ̀wé sí yín,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “sí àwọn ẹni mímọ́.” Ọ̀rọ̀ aṣáájú Gíríìkì náà lè tọ́ka sí ìtọ́sọ́nà tàbí àwọn tí iṣẹ́ náà ṣe fún ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Nítorí ní ti
  rationale: “Ní ti” fi àkòrí tuntun hàn, “Nítorí” sì pa ìsopọ̀ γὰρ mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú; a kò gbìyànjú láti tú μὲν lọ́tọ̀ níbi tí Yorùbá kò ti nílò rẹ̀.
- source_word: διακονίας
  choice: iṣẹ́ ìránṣẹ́
  rationale: Èyí pa ìtumọ̀ iṣẹ́ tàbí iṣẹ́ ìrànlọ́wọ́ tí a ṣe fún ẹlòmíràn mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé fún iṣẹ́ ìjọsìn àti ìtọju àwọn aláìní.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: sí àwọn ẹni mímọ́
  rationale: “Sí” tẹ̀lé ìtọ́sọ́nà εἰς, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè tọ́ka sí àwọn tí iṣẹ́ náà ṣe fún.
- source_word: ἁγίους
  choice: àwọn ẹni mímọ́
  rationale: Èyí fi ìtumọ̀ àwọn tí a yà sọ́tọ̀ fún Ọlọ́run hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: περισσόν
  choice: kò pọndandan
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé kíkọ̀wé náà kò ṣe dandan tàbí pé ó lé ju ohun tí a nílò lọ; “kò pọndandan” jẹ́ adayeba, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: kò pọndandan fún mi láti kọ̀wé sí yín
  rationale: Ìṣètò yìí jẹ́ Yorùbá adayeba, ó sì pa ẹni tó ń kọ̀wé àti àwọn tí a ń kọ sí mọ́ kedere.
theological_decisions:
- issue: Bóyá εἰς fi ìtọ́sọ́nà tàbí ẹni tí iṣẹ́ náà ń ṣe fún hàn
  choice: sí àwọn ẹni mímọ́
  alternative: fún àwọn ẹni mímọ́
  rationale: A yan “sí” gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, ṣùgbọ́n a pa ìtumọ̀ “fún” mọ́ nínú àlàyé ìsàlẹ̀ nítorí pé méjèèjì ṣeé ṣe ní àyíká yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “àwọn ẹni mímọ́” fún ἅγιοι, a sì lo “kò pọndandan” dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ líle fún περισσόν.
