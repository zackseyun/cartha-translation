id: 2CO.9.3
reference: 2 Corinthians 9:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: yo
  text: Ṣùgbọ́n mo rán àwọn arákùnrin náà, kí ìṣògo wa nípa yín má bàa di asán[a] nínú ọ̀ràn yìí[b], kí ẹ sì ti múra sílẹ̀ gẹ́gẹ́ bí mo ti ń sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “má bàa hàn pé ó jẹ́ asán” tàbí “má bàa di òfo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní ti èyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: mo rán
  rationale: Aorist náà bá ìṣe tí a sọ ní ọ̀nà ìtàn mu; ọ̀rọ̀ yìí sì lè túmọ̀ sí “mo rán” láìfi dandan sọ bóyá àwọn aṣojú náà ti dé.
- source_word: τοὺς ἀδελφούς
  choice: àwọn arákùnrin náà
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ọkùnrin kan pàtó tí Pọ́ọ̀lù rán gẹ́gẹ́ bí aṣojú; “àwọn arákùnrin náà” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: ìṣògo wa nípa yín
  rationale: καύχημα lè jẹ́ ìṣògo tàbí ohun tí ènìyàn fi ń ṣògo. Níhìn-ín, ó tọ́ka sí ohun tí Pọ́ọ̀lù ti ń fi ìgbéraga rere sọ nípa àwọn ará Kọ́ríńtì.
- source_word: κενωθῇ
  choice: má bàa di asán
  rationale: Àsàyàn yìí sọ ìtumọ̀ ohun tí a sọ di òfo tàbí aláìní ẹ̀rí ní Yorùbá àdánidá, ó sì pa èrò ìdènà inú ἵνα μή mọ́.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: nínú ọ̀ràn yìí
  rationale: μέρος jẹ́ àkànṣe ọ̀rọ̀ níhìn-ín fún apá tàbí ọ̀ràn kan, kì í ṣe ẹ̀yà ara tàbí ìpín ohun kan ní ti gidi.
- source_word: καθὼς ἔλεγον
  choice: gẹ́gẹ́ bí mo ti ń sọ
  rationale: “ti ń sọ” fi ìṣe tí ó ń lọ tàbí tí a ń ṣe léraléra hàn, ó sì bá imperfect ἔλεγον mu.
- source_word: παρεσκευασμένοι ἦτε
  choice: kí ẹ sì ti múra sílẹ̀
  rationale: “ti múra sílẹ̀” pa ìtumọ̀ ipò ìmúrasílẹ̀ tí periphrastic perfect náà ní mọ́; “kí” sì bá gbólóhùn ète tí ἵνα bẹ̀rẹ̀ mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn èrò Gíríìkì, ṣùgbọ́n a tún un ṣe díẹ̀ kí ó lè yé àwọn òǹkàwé Yorùbá lójú ẹsẹ̀. A gbe àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àṣàyàn ìtumọ̀ wọn kan ní tààràtà.
