id: 2CO.9.13
reference: 2 Corinthians 9:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: yo
  text: Nítorí ẹ̀rí tí iṣẹ́ ìránṣẹ́ yìí fi hàn, wọ́n ń yin Ọlọ́run lógo nítorí ìgbọ́ràn tí ìjẹ́wọ́ yín sí ìhìnrere Mèsáyà fi hàn,[a] àti nítorí ìfúnni ọ̀làwọ́ yín fún wọn àti fún gbogbo ènìyàn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nítorí ìtẹríba ìjẹ́wọ́ yín sí ìhìnrere Kristi.” Ọ̀rọ̀ Gíríìkì náà pa ìbáṣepọ̀ tó sún mọ́ra láàárín ìjẹ́wọ́ àti ìgbọ́ràn mọ́; Χριστός sì jẹ́ oyè tí ó túmọ̀ sí “Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: “Ìfúnni ọ̀làwọ́” níbí ṣeé ṣe kí ó tọ́ka pàápàá sí ìkópa ọ̀làwọ́ nínú àkójọpọ̀ ẹ̀bùn, kì í ṣe ìdàpọ̀ tàbí ìbáṣepọ̀ lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: ẹ̀rí tí ... fi hàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, iṣẹ́ ìrànwọ́ náà jẹ́ ẹ̀rí tí ó hàn gbangba pé ìgbàgbọ́ àti ìfẹ́ wọn jẹ́ ojúlówó; gbolohun yìí dára ju lílo ọ̀rọ̀ tó túmọ̀ sí ìdánwò lọ.
- source_word: διακονίας
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ó tọ́ka sí iṣẹ́ ìrànwọ́ fún àwọn ènìyàn mímọ́, ó sì pa ìtumọ̀ iṣẹ́ tó wúlò àti iṣẹ́ fún Ọlọ́run mọ́.
- source_word: δοξάζοντες τὸν θεὸν
  choice: wọ́n ń yin Ọlọ́run lógo
  rationale: A sọ participle náà di gbólóhùn pípé fún Yorùbá tó ṣe kedere, nígbà tí a pa ìtumọ̀ δοξάζω mọ́.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: ìgbọ́ràn tí ìjẹ́wọ́ yín ... fi hàn
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó fi ìbáṣepọ̀ tó wà láàárín ìgbọ́ràn àti ìjẹ́wọ́ hàn, láì sọ pé ìjẹ́wọ́ fúnra rẹ̀ ni ó ń gbọ́ràn.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: sí ìhìnrere Mèsáyà
  rationale: “Sí” pa ìdarí tàbí ìbáṣepọ̀ εἰς mọ́; “Mèsáyà” sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró.
- source_word: ἁπλότητι
  choice: ọ̀làwọ́
  rationale: Nínú ọ̀rọ̀ nípa àkójọpọ̀ ẹ̀bùn yìí, ọ̀rọ̀ náà túmọ̀ sí fífúnni lọ́wọ́ gbòòrò ju ìtumọ̀ àìlábùkù tàbí ayedero lọ.
- source_word: κοινωνίας
  choice: ẹ fi ń pín ohun tí ẹ ní
  rationale: Ó jẹ́ kí ìtumọ̀ ìkópa nípa fífúnni ní ohun ìní hàn kedere, láì dín ọ̀rọ̀ náà kù sí owó nìkan.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: fún wọn àti fún gbogbo ènìyàn
  rationale: “Fún” jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá láti fi àwọn tí ìpínpín ọ̀làwọ́ náà ń tọ̀ sí hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú εὐαγγέλιον τοῦ Χριστοῦ
  choice: ìhìnrere Mèsáyà
  alternative: ìhìnrere Kristi
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” pa agbára ìtumọ̀ ẹni tí a fi àmì òróró yàn mọ́ láì fi ẹ̀kọ́ ìjọ kan kún un.
- issue: Ìbáṣepọ̀ ὑποταγή àti ὁμολογία
  choice: ìgbọ́ràn tí ìjẹ́wọ́ yín ... fi hàn
  alternative: ìtẹríba ìjẹ́wọ́ yín
  rationale: Gíríìkì lè jẹ́ gẹ́gẹ́ bí “ìtẹríba ìjẹ́wọ́ yín,” ṣùgbọ́n ìtumọ̀ àkọ́kọ́ yìí ṣe kedere ní Yorùbá pé ìjẹ́wọ́ wọn ní ìhìnrere ni ìgbọ́ràn náà ti farahàn, láì yọ ẹdọfu inú gbólóhùn náà kúrò pátápátá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, kì í ṣe ọ̀rọ̀ ọ̀wọ̀ fún ẹnì kan.
