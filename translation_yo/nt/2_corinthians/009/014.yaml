reference: 2 Corinthians 9:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: yo
  text: àti nínú àdúrà wọn fún yín[a], wọ́n ń yánhànhàn fún yín nítorí oore-ọ̀fẹ́ Ọlọ́run tó pọ̀ ju ìwọ̀n lọ lórí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ẹ̀bẹ̀ wọn fún yín, bí wọ́n ti ń yánhànhàn fún yín.”
    reason: 'Àṣàyàn ọ̀rọ̀ àti ìbáṣepọ̀ gírámà: δέησις lè jẹ́ “ẹ̀bẹ̀,” ìṣètò Gíríìkì sì lè tẹnu mọ́ ìyánhànhàn wọn nínú àdúrà náà.'
lexical_decisions:
- source_word: δέησις
  choice: àdúrà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹ̀bẹ̀ tàbí àdúrà àtọkànwá. “Àdúrà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè gba ìtumọ̀ ẹ̀bẹ̀ àtọkànwá sínú láì di ọ̀rọ̀ ẹ̀sìn onímọ̀ pàtó.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ó tọ́ka sí àwọn olùgbà ẹ̀bùn tí a mẹ́nu kàn ṣáájú, ó sì ṣe iṣẹ́ ìní nínú “àdúrà wọn.”
- source_word: ὑπὲρ ὑμῶν
  choice: fún yín
  rationale: Nínú àyíká àdúrà, ὑπέρ pẹ̀lú ọ̀rọ̀-orúkọ ní genitive túmọ̀ sí gbígbàdúrà fún ẹnì kan tàbí ní ipò rẹ̀; “fún yín” ni ọ̀nà àdánidá jù lọ ní Yorùbá.
- source_word: ἐπιποθούντων
  choice: wọ́n ń yán hànhàn fún yín
  rationale: Participle yìí ṣàpèjúwe ìfẹ́ àtọkànwá tí ń bá a lọ. A tú un sí gbólóhùn aláṣe kí ìsopọ̀ gírámà Gíríìkì tó há le ṣe kedere ní Yorùbá.
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú accusative níbí, διά ń sọ ìdí tàbí ohun tó fa ìfẹ́ wọn; “nítorí” pa ìtumọ̀ ìdí náà mọ́.
- source_word: ὑπερβάλλουσαν
  choice: tí ó pọ̀ rékọjá
  rationale: Ó ń ṣàpèjúwe χάρις gẹ́gẹ́ bí ohun tó tayọ rékọjá ìwọ̀n. Gbólóhùn yìí pa agbára àfiwé àti ìpọ̀jù inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις, ó sì pa ìtumọ̀ ojú rere àti iṣẹ́ rere Ọlọ́run mọ́.
- source_word: ἐφ’ ὑμῖν
  choice: lórí yín
  rationale: “Lórí yín” pa àwòrán oore-ọ̀fẹ́ Ọlọ́run tó wà lórí wọn mọ́, láì dí ìtumọ̀ míì bí “láàárín yín” mọ́ patapata.
- source_word: καὶ
  choice: àti
  rationale: Ó so ẹsẹ yìí mọ́ ìtẹ̀sí ọ̀rọ̀ ẹsẹ tó ṣáájú gẹ́gẹ́ bí àsopọ̀ rírọrùn.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà láàárín àdúrà àti yíyan hànhàn
  choice: Àwọn olùgbà ẹ̀bùn ń gbàdúrà fún àwọn ará Kọ́ríńtì, wọ́n sì ń yán hànhàn fún wọn nínú ipò àdúrà yẹn.
  alternative: A lè tú u ní ọ̀nà tó tẹ̀lé ìṣètò Gíríìkì gan-an pé, “àti nípa ẹ̀bẹ̀ wọn fún yín, bí wọ́n ti ń yán hànhàn fún yín ...,” èyí tó lè tẹnu mọ́ àdúrà gẹ́gẹ́ bí ọ̀nà tí ìyánhànhàn wọn gbà farahàn.
  rationale: Gíríìkì kúrú, participle genitive náà sì so mọ́ αὐτῶν. Ìtumọ̀ yìí jẹ́ kí ìṣe méjèèjì—àdúrà àti yíyan hànhàn—hàn kedere, láì fi ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ oore-ọ̀fẹ́ Ọlọ́run lórí wọn
  choice: A fi “oore-ọ̀fẹ́ Ọlọ́run tí ó pọ̀ rékọjá lórí yín” sílẹ̀ gẹ́gẹ́ bí ìṣe tàbí ojú rere Ọlọ́run tó hàn lára wọn.
  alternative: A lè tú ἐφ’ ὑμῖν sí “láàárín yín” tàbí “nípa yín,” èyí tó lè tọ́ka sí bí oore-ọ̀fẹ́ náà ṣe ń ṣiṣẹ́ nínú àwùjọ wọn.
  rationale: “Lórí yín” sún mọ́ àwòrán ọ̀rọ̀ Gíríìkì, ṣùgbọ́n kò ṣàlàyé irú oore-ọ̀fẹ́ náà ju bí ẹsẹ ṣe sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “yín” nítorí àwọn ènìyàn púpọ̀ ni a ń bá sọ.
