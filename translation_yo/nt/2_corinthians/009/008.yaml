id: 2CO.9.8
reference: 2 Corinthians 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: yo
  text: Ọlọ́run sì lágbára láti mú kí gbogbo oore-ọ̀fẹ́ pọ̀ yanturu sí yín, kí, ní gbogbo ọ̀nà, nígbà gbogbo, ẹ ní ohun tó tó[a], kí ẹ sì pọ̀ yanturu nínú gbogbo iṣẹ́ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ohun gbogbo tí ẹ nílò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìtó, ìpèsè tó, tàbí ìtẹ́lọ́rùn; níbí, ó ń tọ́ka sí ìpèsè Ọlọ́run tó tó fún wọn, kì í ṣe dídá ara ẹni dúró láìgbẹ́kẹ̀ lé Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: lágbára
  rationale: Ó sọ agbára Ọlọ́run láti ṣe ohun náà jáde ní ọ̀nà àdánidá ní Yorùbá, láìsọ pé ó jẹ́ àǹfààní lásán.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ pẹ̀lẹ́ ni δέ níbí; “sì” bá ìṣàn ọ̀rọ̀ mu, kò sì sọ ọ́ di àtakò líle.
- source_word: πᾶσαν χάριν
  choice: gbogbo oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” pa ìtumọ̀ gbígbòòrò χάρις mọ́, ó sì lè ní ìpèsè Ọlọ́run fún fífúnni nínú àyíká ẹsẹ yìí láìdín un kù sí owó nìkan.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: mú kí ... máa pọ̀ dé ọ̀dọ̀ yín
  rationale: Ó pa ìtumọ̀ olùmúṣe ti infinitive náà àti ìtọ́sọ́nà εἰς mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí àbájáde hàn ní ọ̀nà Yorùbá tó jẹ́ ti ẹ̀dá.
- source_word: ἐν παντὶ πάντοτε
  choice: nínú ohun gbogbo nígbà gbogbo
  rationale: Ó pa ìtẹnumọ́ àwọn ọ̀rọ̀ παν- méjèèjì mọ́.
- source_word: πᾶσαν αὐτάρκειαν
  choice: ìpèsè tó pé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ohun tí Ọlọ́run pèsè tó fún àìní wọn, kì í ṣe agbára láti dá ara ẹni dúró láìgbẹ́kẹ̀ lé Ọlọ́run.
- source_word: ἔχοντες
  choice: máa ní
  rationale: Ó pa ìṣe tó ń bá ọ̀rọ̀-ìṣe pàtàkì lọ ní àkókò kan náà mọ́, ní Yorùbá tó rọrùn.
- source_word: περισσεύητε
  choice: máa pọ̀ sí i
  rationale: Ó tún èrò ọ̀pọ̀ yanturu tó wà nínú περισσεῦσαι sọ, bí Gíríìkì ṣe ṣe é.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: nínú gbogbo iṣẹ́ rere
  rationale: “Nínú” jẹ́ àdánidá lẹ́yìn “pọ̀ sí i,” ó sì sọ pé ọ̀pọ̀ yanturu wọn yóò hàn nínú gbogbo iṣẹ́ rere.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká fífúnni
  choice: Oore-ọ̀fẹ́ Ọlọ́run ní ìtumọ̀ gbígbòòrò, tó tún ní ìpèsè tó ń fún wọn lágbára láti ṣe ọ̀làwọ́
  alternative: Ojú rere nìkan tàbí ẹ̀bùn ohun ìní
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa fífúnni, ṣùgbọ́n χάρις gbòòrò ju owó tàbí ohun ìní lọ; “oore-ọ̀fẹ́” pa fífẹ̀ ìtumọ̀ náà mọ́.
- issue: Ìtumọ̀ αὐτάρκεια
  choice: Ìpèsè tó pé fún àìní wọn
  alternative: Ìtẹ́lọ́rùn tàbí dídá ara ẹni dúró láìní ẹlòmíràn
  rationale: Àyíká náà fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tó ń pèsè fún wọn kí wọn lè ṣe ọ̀làwọ́; nítorí náà, a kò gbọ́dọ̀ fi èrò òmìnira kúrò lọ́dọ̀ Ọlọ́run sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó níyì, pẹ̀lú àmì ohùn ní kíkún. A pa àsọtúnsọ ọ̀pọ̀ yanturu àti “gbogbo/nígbà gbogbo” mọ́ láìjẹ́ kí gbólóhùn náà le fún òǹkàwé lasán.
