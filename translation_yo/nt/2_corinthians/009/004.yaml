  to: Kí ó má bàa jẹ́ pé, bí àwọn ará Makedóníà kan bá wá pẹ̀lú mi, tí wọ́n sì rí i pé ẹ kò múra tán, àwa—láì tilẹ̀ sọ ti ẹ̀yin[b]—a ó kó ìtìjú nínú ọ̀ràn ìgbẹ́kẹ̀lé yìí.[a]
  rationale: A ṣàtúnṣe ìdàpọ̀ ọ̀rọ̀ tí kò dáa “bá bá mi wá” sí “bá wá pẹ̀lú mi,” a sì rọ́pò ọ̀rọ̀ ìtìjú tí kò dáa pátápátá pẹ̀lú “àwa ... a ó kó ìtìjú.” Àwọn ìyókù, pẹ̀lú àmì ẹsẹ̀-àlàyé àti ìtumọ̀ ὑπόστασις, ni a pa mọ́.
