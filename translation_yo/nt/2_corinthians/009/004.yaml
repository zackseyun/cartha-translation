reference: 2 Corinthians 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: yo
  text: Kí ó má bàa jẹ́ pé, bí àwọn ará Makedóníà kan bá wá pẹ̀lú mi, tí wọ́n sì rí i pé ẹ kò múra tán, àwa—láì tilẹ̀ sọ ti ẹ̀yin[b]—a ó kó ìtìjú nínú ọ̀ràn ìgbẹ́kẹ̀lé yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìgbẹ́kẹ̀lé yìí.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ohun tí a ń ṣe” tàbí “ipò” nínú àyíká yìí, ṣùgbọ́n ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbẹ́kẹ̀lé Pọ́ọ̀lù nípa wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láì mẹ́nu kan ẹ̀yin.” Pọ́ọ̀lù fi ọ̀rọ̀ yìí sọ lọ́nà pẹ̀lẹ́ pé àwọn ará Kọ́ríńtì náà yóò ní ìtìjú bí wọn kò bá múra tán.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Kí ó má bàá jẹ́ pé, bí
  rationale: Ó fi ìbẹ̀rù Pọ́ọ̀lù hàn nípa ohun tí ó ṣeé ṣe kí ó ṣẹlẹ̀, ó sì tún pa ìtumọ̀ ọ̀rọ̀ oníṣ条件 ἐάν mọ́ ní Yorùbá àdánidá.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: àwọn ará Makedóníà kan bá bá mi wá
  rationale: Ọ̀rọ̀ náà kò tọ́ka sí ẹgbẹ́ pàtó kan; “kan” fi ìtumọ̀ àìpàtó náà hàn.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: wọ́n sì rí i pé ẹ kò múra tán
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọn kò tíì múra sílẹ̀, ní pàtàkì nípa ọrẹ tí a ń kó jọ.
- source_word: καταισχυνθῶμεν
  choice: ojú yóò ti àwa
  rationale: Àṣàyàn yìí pa ìtumọ̀ ìtìjú níwájú àwọn ẹlòmíràn mọ́, kì í ṣe ìmọ̀lára inú nìkan.
- source_word: ἡμεῖς
  choice: àwa
  rationale: A lo arọ́pò-orúkọ tí a tẹnumọ́ láti bá ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mu.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: láì tilẹ̀ sọ ti ẹ̀yin
  rationale: Ó jẹ́ gbólóhùn àárín gbùngbùn tí ó rọ ọ̀rọ̀ Pọ́ọ̀lù, ṣùgbọ́n tí ó tún fi hàn pé àwọn ará Kọ́ríńtì náà yóò ní ìtìjú.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: nínú ọ̀ràn ìgbẹ́kẹ̀lé yìí
  rationale: Nínú àyíká yìí, ὑπόστασις tọ́ka sí ìgbẹ́kẹ̀lé Pọ́ọ̀lù nípa àwọn ará Kọ́ríńtì; “ọ̀ràn ìgbẹ́kẹ̀lé” pa ìtumọ̀ náà mọ́ láì mú ìtumọ̀ ìmọ̀-ìjìnlẹ̀ “substance” wọlé.
theological_decisions:
- issue: Ìtumọ̀ ὑπόστασις nínú àyíká Pọ́ọ̀lù tí kì í ṣe ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ pàtó
  choice: ọ̀ràn ìgbẹ́kẹ̀lé
  alternative: ìgbẹ́kẹ̀lé yìí; iṣẹ́ tí a dáwọ́ lé yìí; ipò yìí
  rationale: Àyíká ẹsẹ̀ náà jẹ́ nípa ìgbẹ́kẹ̀lé Pọ́ọ̀lù pé àwọn ará Kọ́ríńtì ti múra ọrẹ náà tán. Èyí yẹra fún fífi ìtumọ̀ ìmọ̀-ìjìnlẹ̀ tàbí ẹ̀kọ́ ìgbà míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn fún ìjọ Kọ́ríńtì; “àwa” ni a tẹnumọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì. Àmì ìdádúró gígùn ya gbólóhùn àfikún Pọ́ọ̀lù sọ́tọ̀.
