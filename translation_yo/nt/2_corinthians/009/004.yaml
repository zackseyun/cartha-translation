  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìbẹ̀rù nípa ìbẹ̀wò àwọn ará Makedóníà, àìmúrasílẹ̀ àwọn ará Kọ́ríńtì, ìtìjú Pọ́ọ̀lù àti tiwọn, àti ὑπόστασις gẹ́gẹ́ bí ìgbẹ́kẹ̀lé ni ó hàn. Síbẹ̀, “bá bá mi wá” jẹ́ àtúnlò “bá” tí kò tọ́ nínú Yorùbá; a nílò ọ̀rọ̀ “pẹ̀lú mi” láti tú σὺν ἐμοί jáde kedere. “A ó kó ìtìjú” sì jẹ́ ọ̀nà tí ó mọ́gbọ́n dání láti fi ìtìjú ní gbangba hàn nínú ìṣeéṣe ọjọ́ iwájú.'
  naturalness: Ìgbékalẹ̀ gbólóhùn náà dára, ṣùgbọ́n “ojú yóò ti àwa” kò dáa gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá òde òní. “A ó kó ìtìjú” jẹ́ àdánidá, ó sì pa ìtumọ̀ ìtìjú níwájú àwọn ènìyàn mọ́. “Kí ó má bàa jẹ́ pé, bí ... bá ...” tún dáa fún μή πως ἐὰν.
  terminology: “Àwọn ará Makedóníà,” “ẹ̀yin,” àti “àwa” bójú mu. “Ọ̀ràn ìgbẹ́kẹ̀lé yìí” ń tú ἐν τῇ ὑποστάσει ταύτῃ ní ìtumọ̀ àyíká rẹ̀, láì fi ìtumọ̀ ẹ̀kọ́-ìjìnlẹ̀ kún un. A tún ṣàtúnṣe àṣàyàn ẹsẹ̀-àlàyé “undertaking” sí “ohun tí a ń ṣe” kí ó má bàa sọ ìtumọ̀ míì tí kò dájú.
