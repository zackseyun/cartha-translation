  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: yo
  text: Ọpẹ́ ni fún Ọlọ́run nítorí ẹ̀bùn rẹ̀ tí a kò lè fi ọ̀rọ̀ ṣàpèjúwe ní kíkún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ẹ̀bùn rẹ̀ tí a kò lè fi ọ̀rọ̀ sọ.” Ọ̀rọ̀ Giriki náà lè túmọ̀ sí ohun tí àpèjúwe tàbí ìròyìn kò lè sọ dé ẹ̀kúnrẹ́rẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Ọpẹ́ ni
  rationale: Nínú gbólóhùn ìyìn yìí, χάρις pẹ̀lú τῷ θεῷ ń sọ ìdúpẹ́ sí Ọlọ́run, kì í ṣe ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí ìtumọ̀ orúkọ ní ọ̀pọ̀ ibi.
- source_word: τῷ θεῷ
  choice: fún Ọlọ́run
  rationale: Dátífù náà tọ́ka sí ẹni tí a ń dúpẹ́ lọ́wọ́; ‘fún Ọlọ́run’ bá àṣà èdè Yorùbá mu nínú gbólóhùn ‘Ọpẹ́ ni fún Ọlọ́run.’
- source_word: ἐπὶ
  choice: nítorí
  rationale: Pẹ̀lú dátífù níbí, ἐπί ń fi ìdí tàbí ohun tó fa ìdúpẹ́ hàn; ‘nítorí’ sọ ìbáṣepọ̀ yìí ní kedere.
- source_word: ἀνεκδιηγήτῳ
  choice: tí ọ̀rọ̀ kò lè ṣàpèjúwe rẹ̀ ní kíkún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a kò lè sọ tàbí ṣàlàyé dé ẹ̀kúnrẹ́rẹ́; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò pé ẹ̀bùn náà kọjá àpèjúwe kíkún mọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí Ọlọ́run, bí Giriki ṣe fi í sílẹ̀ láì tún orúkọ Ọlọ́run sọ.
- source_word: δωρεᾷ
  choice: ẹ̀bùn
  rationale: δωρεά jẹ́ ohun tí a fi fúnni lọ́fẹ̀ẹ́; ‘ẹ̀bùn’ tó ní ọlá àti tó wọ́pọ̀ tó láti gbé ìtumọ̀ náà láì fi ọ̀rọ̀ míì kún un.
theological_decisions:
- issue: Ohun tí ‘ẹ̀bùn rẹ̀’ ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ẹ̀bùn Ọlọ́run láì sọ pàtó ohun tí ẹ̀bùn náà jẹ́.
  alternative: Kí a sọ pé ó tọ́ka pàtó sí Kristi, sí ìgbàlà nínú Kristi, tàbí sí oore-ọ̀fẹ́ Ọlọ́run tó ń mú ìwà ọ̀làwọ́ jáde.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ ‘ẹ̀bùn rẹ̀’ nìkan. Àyíká ọ̀rọ̀ ń sọ nípa oore-ọ̀fẹ́ Ọlọ́run àti ìwà ọ̀làwọ́, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ Kristẹni ti rí Kristi gẹ́gẹ́ bí ohun pàtàkì tí a ń tọ́ka sí. Ìtumọ̀ náà kò yanju ohun tí ọ̀rọ̀ Giriki fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ọpẹ́ ni fún Ọlọ́run’ mú ìdúpẹ́ àti ìyìn inú gbólóhùn Giriki jáde; ‘tí ọ̀rọ̀ kò lè ṣàpèjúwe rẹ̀ ní kíkún’ yẹra fún ọ̀rọ̀ àtijọ́ tàbí gbólóhùn tí kò wọ́pọ̀.
