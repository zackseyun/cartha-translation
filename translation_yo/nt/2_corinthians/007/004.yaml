  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: yo
  text: Mo ní ìgboyà ńlá sí yín[a], mo sì ń ṣògo púpọ̀ nípa yín. Ìṣírí kún inú mi[b]; ayọ̀ sì kún inú mi dé àkúnwọ́sílẹ̀ láàárín gbogbo ìpọ́njú wa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ní ìgbẹ́kẹ̀lé ńlá sí yín.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ìfẹ̀hàn-ọrọ̀ ní gbangba àti láìbẹ̀rù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ìtùnú kún inú mi.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ìfúnnilókun àti ìtùnú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “láìka gbogbo ìpọ́njú wa sí.” Ọ̀rọ̀ Gíríìkì náà lè fi ayọ̀ tí ó ń kún inú ẹni dé àkúnwọ́sílẹ̀ ní àárín ìdààmú tí ó ń lọ lọ́wọ́ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ìgboyà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìgboyà, ìgbẹ́kẹ̀lé, tàbí sísọ̀rọ̀ ní gbangba láìbẹ̀rù. “Ìgboyà” pa agbára ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ míì hàn.
- source_word: πρὸς ὑμᾶς
  choice: sí yín
  rationale: Ó fi ìdarí àti ìbáṣepọ̀ ìgboyà Pọ́ọ̀lù sí àwọn ará Kọ́ríńtì hàn ní Yorùbá àdánidá.
- source_word: καύχησις
  choice: ṣògo
  rationale: “Ṣògo” pa èdè ìṣògo Pọ́ọ̀lù mọ́ láìrọ̀ ọ́ sí ìgbéraga búburú; “nítorí yín” mú kí ó ṣe kedere pé ohun tí ó ń sọ nípa wọn ni.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Nínú àyíká yìí, gbólóhùn náà tọ́ka sí ìṣògo rere nípa àwọn ará Kọ́ríńtì àti fún iyì wọn.
- source_word: πεπλήρωμαι
  choice: kún inú mi
  rationale: Ìṣe pípé aláìṣe ní Gíríìkì tọ́ka sí ipò tí ó wà nísinsìnyí lẹ́yìn ohun tí ó ti ṣẹlẹ̀; gbólóhùn Yorùbá yìí sọ ipò ìkún náà lọ́nà àdánidá.
- source_word: παρακλήσει
  choice: ìṣírí
  rationale: παράκλησις ní ìtumọ̀ ìṣírí, ìtùnú, àti fífúnni lókun. “Ìṣírí” dára fún àyíká ìròyìn Títù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa “ìtùnú” mọ́ gẹ́gẹ́ bí àṣàyàn tòótọ́.
- source_word: ὑπερπερισσεύομαι
  choice: kún àkúnwọ́sílẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì olókun yìí fi ọ̀pọ̀lọpọ̀ tí ó kọjá ìwọ̀n hàn; “kún àkúnwọ́sílẹ̀” pa àwòrán ohun tí ń ṣàn kọjá etí mọ́.
- source_word: χαρᾷ
  choice: ayọ̀
  rationale: “Ayọ̀” ni ìtumọ̀ àdánidá àti tààrà fún χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: láàárín gbogbo ìpọ́njú wa
  rationale: “Láàárín” fi hàn pé ayọ̀ àti ìpọ́njú ń wà papọ̀, láìyí ọ̀rọ̀ náà padà sí pé ayọ̀ wà kìkì láìka ìpọ́njú sí.
- source_word: πολλή ... πολλή
  choice: ńlá ... púpọ̀
  rationale: Àtúnsọ πολλή tẹnumọ́ ọ̀pọ̀lọpọ̀. Yorùbá àdánidá ń lo “ńlá” pẹ̀lú ìgboyà àti “púpọ̀” pẹ̀lú ìṣe ṣíṣògo, bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù kan náà kò tún farahàn.
theological_decisions:
- issue: Ṣíṣe àfihàn καύχησις rere láìfi ìtumọ̀ ìgbéraga ẹlẹ́ṣẹ̀ kún un
  choice: “mo sì ń ṣògo púpọ̀ nítorí yín”
  alternative: “mo sì ní ìgbéraga ńlá nítorí yín” tàbí “mo ní ìgbẹ́kẹ̀lé púpọ̀ nínú yín”
  rationale: Pọ́ọ̀lù máa ń lo èdè ìṣògo ní ọ̀nà rere tí àyíká ọ̀rọ̀ ń ṣàlàyé. “Ṣògo” pa àsopọ̀ ìtumọ̀ náà mọ́, kò sì rọ̀ ọ́ sí ìmọ̀lára ìgbéraga lasán.
- issue: Pípamọ́ ìfàsẹ́yìn tó wà láàárín ayọ̀ àti ìjìyà
  choice: “láàárín gbogbo ìpọ́njú wa”
  alternative: “láìka gbogbo ìpọ́njú wa sí”
  rationale: Gíríìkì lè tọ́ka sí ayọ̀ tó ń kún àkúnwọ́sílẹ̀ ní àárín ìpọ́njú tí ó ń lọ lọ́wọ́. “Láàárín” pa ìwàpapọ̀ ayọ̀ àti ìjìyà mọ́ dípò yíyàn ìtumọ̀ atako nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn kún un níbi tí ó bá yẹ. “Kún àkúnwọ́sílẹ̀” jẹ́ àwòrán àdánidá fún ọ̀pọ̀lọpọ̀ ayọ̀, “ìpọ́njú” sì pa agbára θλῖψις mọ́.
