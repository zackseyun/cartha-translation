id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: yo
  text: Nítorí náà, bí mo tilẹ̀ kọ̀wé sí yín, kò jẹ́ nítorí ẹni tí ó ṣe àìtọ́, bẹ́ẹ̀ ni kò jẹ́ nítorí ẹni tí wọ́n ṣe ohun àìtọ́ sí, ṣùgbọ́n kí ìtara[b] yín fún wa lè hàn gbangba láàárín yín níwájú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan ní: “kí ìtara wa fún yín lè hàn gbangba láàárín yín níwájú Ọlọ́run.”'
    reason: textual_variant
  - marker: b
    text: Tàbí “ìháragàgà,” “ìfọkànsìn,” tàbí “àníyàn jíjinlẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Nítorí náà, bí mo tilẹ̀
  rationale: “Nítorí náà” fi ìtumọ̀ ìyọrísí ἄρα hàn, “bí ... tilẹ̀” sì pa agbára ìyọ̀ǹda εἰ καὶ mọ́ ní Yorùbá àdánidá.
- source_word: ἔγραψα ὑμῖν
  choice: mo kọ̀wé sí yín
  rationale: Ó túmọ̀ aorist náà gẹ́gẹ́ bí ìṣe tí ó ti ṣẹlẹ̀, ó sì fi ìdarí ọ̀rọ̀ sí àwọn ará Kọ́ríńtì hàn.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: kì í ṣe nítorí ẹni tí ó ṣe àìtọ́
  rationale: Àwọn ọ̀rọ̀ yìí pa ìtumọ̀ ìdí ἕνεκεν àti èrò-ìṣe participle ἀδικήσαντος mọ́ láì sọ irú àìtọ́ náà ní pàtó.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: tàbí nítorí ẹni tí a ṣe ní àìtọ́
  rationale: Ó pa ìṣọ̀kan pẹ̀lú gbólóhùn tó ṣáájú mọ́, ó sì fi ohùn àfarawà participle náà hàn ní Yorùbá.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: bí kò ṣe kí ... lè hàn gbangba
  rationale: Ìkọ̀lé “bí kò ṣe kí ... lè” fi ète hàn, “hàn gbangba” sì pa ìtumọ̀ passive φανερωθῆναι mọ́.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: ìtara yín
  rationale: “Ìtara” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìháragàgà, ìfọkànsìn, tàbí àníyàn jíjinlẹ̀; ó yẹ fún agbára σπουδή ní àyíká yìí.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: Ó fi ìtọ́sọ́nà ìtara wọn sí Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀ hàn ní kúkúrú àti ní ti àdánidá.
- source_word: πρὸς ὑμᾶς
  choice: láàárín yín
  rationale: Ní gbólóhùn tí ó nira yìí, “láàárín yín” jẹ́ ìtumọ̀ Yorùbá tó ṣeé lóye fún bí ìtara náà ṣe fara hàn ní àwùjọ wọn, láì mú ìṣòro ìkọ̀lé Gíríìkì kúrò pátápátá.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó péye, tó ní iyì, fún ìwà ní ojú tàbí ní ìwàláàyè Ọlọ́run.
theological_decisions:
- issue: Ohun tí “ìtara yín fún wa ... láàárín yín” ń tọ́ka sí nínú gbólóhùn Gíríìkì tí ìkọ̀lé rẹ̀ nira
  choice: A túmọ̀ ọ́ pé lẹ́tà Paulu mú kí ìtara àwọn ará Kọ́ríńtì fún òun àti àwọn ẹlẹgbẹ́ rẹ̀ fara hàn láàárín àwọn ará Kọ́ríńtì níwájú Ọlọ́run.
  alternative: Kí ìtara wa fún yín lè hàn gbangba láàárín yín níwájú Ọlọ́run.
  rationale: Ọ̀rọ̀ SBLGNT tí a tẹ̀ jáde ní τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς. Ìtumọ̀ àkọ́kọ́ tẹ̀ lé “yín” àti “fún wa,” bí ó tilẹ̀ jẹ́ pé ìkọ̀lé náà nira. A kò yanjú ìyàtọ̀ ẹ̀rí àfọwọ́kọ ní ìkọ̀kọ̀; a fi ọ̀nà mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “ẹni tí ó ṣe àìtọ́” dípò ọ̀rọ̀ amòfin kan, kí ìtumọ̀ participle náà má bàa di pàtó ju orísun lọ.
