  revision_rationale: The revision corrects the Yoruba expression for the wronged person and uses a more contextually natural past-reference negation. It otherwise preserves the SBLGNT wording, including its syntactically difficult expression of the Corinthians’ earnestness for Paul and his companions, and retains the variant in a footnote.
