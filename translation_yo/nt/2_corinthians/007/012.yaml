revisions:
- from: Nítorí náà, bí mo tilẹ̀ kọ̀wé sí yín, kì í ṣe nítorí ẹni tí ó ṣe àìtọ́, tàbí nítorí ẹni tí a ṣe ní àìtọ́, bí kò ṣe kí ìtara[b] yín fún wa lè hàn gbangba láàárín yín níwájú Ọlọ́run.[a]
  to: Nítorí náà, bí mo tilẹ̀ kọ̀wé sí yín, kò jẹ́ nítorí ẹni tí ó ṣe àìtọ́, bẹ́ẹ̀ ni kò jẹ́ nítorí ẹni tí wọ́n ṣe ohun àìtọ́ sí, ṣùgbọ́n kí ìtara[b] yín fún wa lè hàn gbangba láàárín yín níwájú Ọlọ́run.[a]
  rationale: The revision corrects the Yoruba expression for the wronged person and uses a more contextually natural past-reference negation. It otherwise preserves the SBLGNT wording, including its syntactically difficult expression of the Corinthians’ earnestness for Paul and his companions, and retains the variant in a footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential-concessive opening, the two contrasting substantival participles, the purpose clause, and the difficult SBLGNT reading in which the Corinthians’ earnestness for Paul and his coworkers is manifested among them before God. The textual-variant footnote appropriately preserves the alternative reading.
  naturalness: 'Two phrases are not fully idiomatic in modern Standard Yoruba: “kì í ṣe” can suggest a habitual/general negation where the context concerns the prior writing, and “ẹni tí a ṣe ní àìtọ́” is less clear than an explicit passive construction. The revision makes the past-reference and the person wronged clear while retaining the source’s non-specificity.'
  terminology: “Ìtara” is a suitable, dignified rendering of σπουδή in this context. “Níwájú Ọlọ́run” appropriately renders ἐνώπιον τοῦ θεοῦ. The revised wording retains these terms and the formal public-reading register.
  issues:
  - severity: medium
    issue: The phrase “ẹni tí a ṣe ní àìtọ́” is unclear and not idiomatic as a rendering of “the one who was wronged.”
    rationale: It may be heard as someone who acted wrongly rather than someone against whom a wrong was committed. “Ẹni tí wọ́n ṣe ohun àìtọ́ sí” naturally and clearly expresses the passive participle ἀδικηθέντος without specifying the wrongdoing.
  - severity: low
    issue: “Kì í ṣe” is less precise for the completed act of writing in this sentence.
    rationale: “Kò jẹ́” more naturally conveys “it was not,” while preserving the conditional force of “bí mo tilẹ̀ kọ̀wé.”
  revised_text: Nítorí náà, bí mo tilẹ̀ kọ̀wé sí yín, kò jẹ́ nítorí ẹni tí ó ṣe àìtọ́, bẹ́ẹ̀ ni kò jẹ́ nítorí ẹni tí wọ́n ṣe ohun àìtọ́ sí, ṣùgbọ́n kí ìtara[b] yín fún wa lè hàn gbangba láàárín yín níwájú Ọlọ́run.[a]
  revised_footnotes:
