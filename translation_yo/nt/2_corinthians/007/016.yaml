  yaml_path: translation/nt/2_corinthians/007/016.yaml
  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: yo
  text: Mo yọ̀ pé ní gbogbo ọ̀nà, mo ní ìgbẹ́kẹ̀lé nínú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo yọ̀ nítorí pé nínú ohun gbogbo, mo ní ìgbẹ́kẹ̀lé nípa yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: χαίρω
  choice: Mo yọ̀
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe ìsinsìnyí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó ní iyì.
- source_word: ὅτι
  choice: pé
  rationale: Ní àyíká yìí, ó ṣeé ṣe jù pé ὅτι ń mú àkóónú ohun tí Pọ́ọ̀lù yọ̀ sí wá, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ‘nítorí pé’ tún ṣeé ṣe.
- source_word: ἐν παντί
  choice: ní gbogbo ọ̀nà
  rationale: Gbólóhùn náà ní ipa adverbial, ó sì ń tọ́ka sí ààyè tó gbòòrò; ‘ní gbogbo ọ̀nà’ jẹ́ Yorùbá àdánidá ju ‘nínú ohun gbogbo’ lọ.
- source_word: θαρρῶ
  choice: mo ní ìgbẹ́kẹ̀lé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń fi ìgbẹ́kẹ̀lé Pọ́ọ̀lù nípa àwọn ará Kọ́ríńtì hàn, dípò pé ó kàn túmọ̀ sí pé ó ní ìgboyà.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó pa àwòrán ìbáṣepọ̀ tí ἐν ní mọ́, níbi tí ìgbẹ́kẹ̀lé náà ti wà nínú àwọn ènìyàn náà; ‘nípa yín’ jẹ́ àṣàyàn Yorùbá tó túbọ̀ ṣàlàyé.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yé àwọn òǹkàwé lásán. A fi àmì àkọsílẹ̀ ẹsẹ̀ [a] sí ọ̀rọ̀ pàtàkì.
