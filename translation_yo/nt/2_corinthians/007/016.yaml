  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: χαίρω jẹ́ “Mo yọ̀”; ὅτι jẹ́ “pé,” tí ó ń ṣàfihàn àkóónú ayọ̀ náà; ἐν παντί jẹ́ “ní gbogbo ọ̀nà”; θαρρῶ jẹ́ “mo ní ìgbẹ́kẹ̀lé”; àti ἐν ὑμῖν jẹ́ “nínú yín.” Àìdánilójú kékeré tó wà nínú ὅτι àti ìsọ̀rí ἐν ὑμῖν ni àkọsílẹ̀ ìsàlẹ̀ náà ń ṣàfihàn láì fi ìtumọ̀ kan ṣoṣo múlẹ̀ ju bó ṣe yẹ lọ.'
