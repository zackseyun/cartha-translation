  terminology: “ṣe ... ní àìṣòdodo,” “ba ... jẹ́,” and “rẹ́ ... jẹ” are appropriately broad renderings for the respective Greek verbs. The footnote for ἐφθείραμεν remains attached to the second denial and offers legitimate lexical alternatives.
