id: 2CO.7.2
reference: 2 Corinthians 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: yo
  text: Ẹ ṣe ààyè fún wa[a]. A kò ṣe ẹnikẹ́ni ní àìṣòdodo, a kò ba ẹnikẹ́ni jẹ́[b], a kò sì rẹ́ ẹnikẹ́ni jẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ tẹ́wọ́ gba wa,” tàbí, “Ẹ ṣí ọkàn yín sí wa.” Gíríìkì sọ ní tààrà pé, “Ẹ ṣe ààyè fún wa,” ó sì ṣeé ṣe kí ọ̀rọ̀ náà máa tẹ̀síwájú nínú àwòrán ìbáṣepọ̀ tó wà ní 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kò sọ ẹnikẹ́ni di oníbàjẹ́,” tàbí, “a kò pa ẹnikẹ́ni run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Ẹ gba ààyè fún
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ ní tààrà sí fífi ààyè sílẹ̀. Ní àyíká 2 Kọrinti 6:11–13, ó jẹ́ ẹ̀bẹ̀ fún ìtẹ́wọ́gbà àti ààyè nínú ìfẹ́ wọn; yíyan yìí pa àwòrán inú Gíríìkì mọ́ láì fi ‘ọkàn’ kún ọ̀rọ̀ pàtàkì.
- source_word: ἡμᾶς
  choice: wa
  rationale: Ó jẹ́ ẹni tí àṣẹ náà kan, ó sì túmọ̀ sí ‘wa’.
- source_word: οὐδένα
  choice: ẹnikẹ́ni ... kò
  rationale: Ìṣètò àìníní Yorùbá tó bójú mu ni lílo ‘ẹnikẹ́ni’ pẹ̀lú ‘kò’; a tún un ṣe lẹ́ẹ̀mẹ́ta láti pa ìtẹnumọ́ orísun mọ́.
- source_word: ἠδικήσαμεν
  choice: ṣe ... ní àìṣòdodo
  rationale: Ó sọ ní gbòòrò pé wọn kò hùwà àìṣòdodo sí ẹnikẹ́ni; ọ̀rọ̀ yìí kò fi irú ìpalára kan pàtó lé e lórí.
- source_word: ἐφθείραμεν
  choice: ba ... jẹ́
  rationale: φθείρω lè túmọ̀ sí bíbàjẹ́, píparun, tàbí ṣíṣe ẹni ní ìpalára ìwà tàbí ẹ̀mí. ‘Ba ... jẹ́’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtúmọ̀ náà sílẹ̀ ní ọ̀nà gbòòrò.
- source_word: ἐπλεονεκτήσαμεν
  choice: rẹ́ ... jẹ
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ fífi ọgbọ́n àrékérekè gba ohun ẹni tàbí jíjẹ ẹni nífààní fún èrè ara ẹni; ó gba ìjẹnilọ́wọ́gbà owó tàbí ti ìbáṣepọ̀ láàyè.
theological_decisions:
- issue: Irú ẹ̀bẹ̀ tí Χωρήσατε ἡμᾶς jẹ́
  choice: Ẹ̀bẹ̀ ìbáṣepọ̀ pé kí àwọn ará Kọrinti gba ààyè fún Paulu àti àwọn ẹlẹgbẹ́ rẹ̀ nínú ìfẹ́ àti ìgbésí ayé wọn
  alternative: Ìpè gbogbogbò láti gba Paulu tàbí láti tẹ́wọ́ gbà á
  rationale: Àyíká 6:11–13 ń sọ̀rọ̀ nípa ìfẹ́ tí ó gbòòrò àti fífi ààyè sílẹ̀. Ṣùgbọ́n a kò fi ‘nínú ọkàn yín’ sínú ọ̀rọ̀ pàtàkì, nítorí Gíríìkì ẹsẹ yìí kò sọ ọ́ ní tààrà.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tí ó sì ṣeé yé ni a lò. A pa ìtẹnumọ́ gbolohun mẹ́ta náà mọ́ nípa ṣíṣe ‘ẹnikẹ́ni’ lẹ́ẹ̀mẹ́ta, a sì lo ‘Ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn. Àmì ohùn ni a fi sí ibi tí ó bá yẹ.
