id: 2CO.7.5
reference: 2 Corinthians 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: yo
  text: Nítorí pé nígbà tí a dé Makedóníà pàápàá, ara wa kò rí ìsinmi kankan,[a] ṣùgbọ́n ìpọ́njú sì wà lójú wa ní gbogbo ọ̀nà—ìjà ní òde, ìbẹ̀rù ní inú—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “àwa fúnra wa kò rí ìsinmi.” Ọ̀rọ̀ Gíríìkì náà ní “ara wa,” èyí tó ń tọ́ka sí àìlera àti ìpọ́njú wa gẹ́gẹ́ bí ènìyàn tí ó wà nínú ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Nítorí ... pàápàá
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú ní ọ̀nà àlàyé, ó sì pa ìtẹnumọ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: nígbà tí a dé Makedóníà
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò; ‘dé Makedóníà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ εἰς mu.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: kò rí ìsinmi kankan
  rationale: ἄνεσις túmọ̀ sí ìsinmi tàbí ìtura kúrò lábẹ́ ìpọ́njú; ‘kò rí ìsinmi kankan’ jẹ́ àdánidá, ó sì pa ìtẹnumọ́ òdì mọ́.
- source_word: ἡ σὰρξ ἡμῶν
  choice: ara wa
  rationale: Nínú àyíká yìí σάρξ ń tọ́ka sí ìwàláàyè ènìyàn nínú ara, pẹ̀lú àìlera àti ìpọ́njú rẹ̀, kì í ṣe sí ẹ̀dá ẹlẹ́ṣẹ̀. ‘Ara wa’ pa àwòrán ara mọ́ láì dà bí ọ̀rọ̀ àjèjì.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: ṣùgbọ́n a ń pọ́n wa lójú ní gbogbo ọ̀nà
  rationale: Participle passive náà ṣàpèjúwe bí ìpọ́njú ṣe ń tẹ àwọn olùsọ̀rọ̀ mọ́lẹ̀; ‘pọ́n ... lójú’ jẹ́ Yorùbá lọwọlọwọ, tó ní ìwọ̀n àti ìtẹnumọ́.
- source_word: ἔξωθεν μάχαι
  choice: ìjà níta
  rationale: μάχαι lè jẹ́ ìjà tàbí ìforígbárí; ọ̀rọ̀ ṣókí yìí pa ìbáramu pẹ̀lú ‘nínú’ mọ́, kò sì fi dandan sọ pé ogun ológun ni.
- source_word: ἔσωθεν φόβοι
  choice: ẹ̀rù nínú
  rationale: Ó pa ìyàtọ̀ tó dọ́gba láàárín ohun tó wà níta àti ìbẹ̀rù inú mọ́ ní ọ̀rọ̀ Yorùbá ṣókí.
theological_decisions:
- issue: Ìtumọ̀ σάρξ
  choice: ara wa
  alternative: àwa fúnra wa
  rationale: Níhìn-ín σάρξ kò tọ́ka sí ìwà ẹ̀ṣẹ̀, bí kò ṣe sí ènìyàn nínú ara pẹ̀lú àìlera àti ìdààmú rẹ̀. ‘Ara wa’ pa àwòrán orísun mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àdánidá míì hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn gbólóhùn ìparí méjèèjì jẹ́ ṣókí láti pa ìwọ̀ntúnwọ̀nsì àti agbára ọ̀rọ̀ Gíríìkì mọ́.
