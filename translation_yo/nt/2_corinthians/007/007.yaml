id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: yo
  text: Kì í ṣe nípasẹ̀ dídé rẹ̀ nìkan[a], ṣùgbọ́n nípasẹ̀ ìtùnú[b] tí ó gba nítorí yín, nígbà tí ó ń ròyìn fún wa nípa ìfẹ́-ọkàn yín, ẹkún arò yín[c], àti ìtara yín fún mi; èyí sì mú kí inú mi dùn sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wíwà rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwúrí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìbànújẹ́ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: dídé rẹ̀
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò Títù yìí, ọ̀rọ̀ náà ń tọ́ka sí bí ó ṣe dé, kì í ṣe ‘wíwà’ lásán; ‘dídé rẹ̀’ sì jẹ́ èdè Yorùbá àdánidá.
- source_word: παρακλήσει / παρεκλήθη
  choice: ìtùnú / tí ó rí
  rationale: ‘Ìtùnú’ bá ipò ìbànújẹ́ àti ìrọ̀rùn ọkàn mu. A lo ‘tí ó rí’ láti sọ ìṣe aláìlórúkọ náà ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lo ọ̀rọ̀ orísun kan náà fún orúkọ àti ọ̀rọ̀-ìṣe.
- source_word: ἐφ’ ὑμῖν
  choice: nítorí yín
  rationale: Ó fi àwọn ará Kọ́ríńtì àti ìdáhùn wọn hàn gẹ́gẹ́ bí ìdí tàbí àǹfààní ìtùnú Títù, láìfi kún un pé àwọn fúnra wọn ló tù ú nínú ní tààrà.
- source_word: ἀναγγέλλων
  choice: bí ó ti ń ròyìn fún wa
  rationale: Ó pa ipa ọ̀rọ̀ alájọṣe náà mọ́, ó sì fi hàn bí Pọ́ọ̀lù ṣe gbọ́ nípa ìdáhùn wọn.
- source_word: ἐπιπόθησιν
  choice: ìfẹ́-ọkàn jíjinlẹ̀ yín
  rationale: Ó sọ ìfẹ́ tàbí ìyánhànhàn tó lágbára ní èdè Yorùbá tó ṣe kedere.
- source_word: ὀδυρμόν
  choice: ìbànújẹ́ yín
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ẹ̀dùn ọkàn tí a ń fi ẹkún tàbí arò hàn; ‘ìbànújẹ́’ jẹ́ èdè àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ẹkún arò’ hàn.
- source_word: ζῆλον
  choice: ìtara yín
  rationale: ‘Ìtara’ fi ìfẹ́ inú àti akitiyan gbígbóná hàn láìsọ ọ̀rọ̀ náà di ohun búburú tàbí rere ju bí àyíká ṣe sọ.
- source_word: ὑπὲρ ἐμοῦ
  choice: fún mi
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ìtara tí ó dojú kọ Pọ́ọ̀lù mọ́, láìyan láàárín ‘ní tì mí’ àti ‘nípa mi.’
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: nítorí náà, ayọ̀ mi sì pọ̀ sí i
  rationale: Ó fi àbájáde àti agbára afiwéra μᾶλλον hàn ní ọ̀nà Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A yan ìtumọ̀ tó tẹ̀ lé èdè Gíríìkì ṣùgbọ́n tí kò le ní etí olùkà Yorùbá òde òní.
