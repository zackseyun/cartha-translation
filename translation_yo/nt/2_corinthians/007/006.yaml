id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run, ẹni tí ń tù àwọn onírẹ̀lẹ̀[a] nínú, tù wá nínú nípasẹ̀ dídé Títù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ọkàn wọn rẹ̀wẹ̀sì,” tàbí “àwọn ẹni ipò-kéré.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ wíwà Títù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ìpọ́njú tí Pọ́ọ̀lù ṣàpèjúwe ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn ìyàtọ̀ ní Yorùbá.
- source_word: ὁ παρακαλῶν
  choice: ẹni tí ń tu ... nínú
  rationale: Ọ̀rọ̀ alábápín àsìkò ìsinsìnyí náà ṣàpèjúwe ìṣe tí ó jẹ́ àṣà Ọlọ́run; ‘tu ... nínú’ bá ọ̀rọ̀ ìtùnú nínú àyíká ẹsẹ náà mu.
- source_word: τοὺς ταπεινοὺς
  choice: àwọn tí a rẹ̀ sílẹ̀
  rationale: Nínú àyíká ìpọ́njú, ọ̀rọ̀ náà lè tọ́ka sí àwọn tí ipò wọn rẹ̀ sílẹ̀ tàbí tí ọkàn wọn rẹ̀. Yíyan yìí kò sọ ọ́ di ìrẹ̀lẹ̀ gẹ́gẹ́ bí ìwà nìkan, kò sì fi mọ́ ìbànújẹ́ ọkàn nìkan.
- source_word: παρεκάλεσεν
  choice: tu ... nínú
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ὁ παρακαλῶν, ó sì sọ ìtura tí Ọlọ́run fún wọn nípasẹ̀ Títù.
- source_word: ἐν τῇ παρουσίᾳ
  choice: nípa dídé
  rationale: παρουσία lè túmọ̀ sí wíwà níbẹ̀ tàbí dídé; ní àyíká yìí, dídé Títù ni ohun tí ó mú ìtùnú wá.
- source_word: Τίτου
  choice: Títù
  rationale: Ìkọ orúkọ náà ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀ fún Titus.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ó pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe tí a tẹnumọ́ nínú Gíríìkì, ní ìṣètò gbólóhùn Yorùbá tí ó jẹ́ àdánidá.
theological_decisions:
- issue: Ìtumọ̀ τοὺς ταπεινοὺς nínú àyíká
  choice: àwọn tí a rẹ̀ sílẹ̀
  alternative: àwọn onírẹ̀lẹ̀; àwọn tí ọkàn wọn rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ipò ìrẹ̀lẹ̀, rírẹ̀ sílẹ̀ nítorí ìpọ́njú, tàbí ìrẹ̀wẹ̀sì ọkàn. Ọ̀rọ̀ inú àkọ́kọ́ jẹ́ kí ìtumọ̀ náà gbòòrò, àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́.
- issue: Agbára ἐν pẹ̀lú παρουσία
  choice: nípa dídé Títù
  alternative: nípasẹ̀ wíwà Títù pẹ̀lú wa
  rationale: Àyíká ń tọ́ka sí ìṣẹ̀lẹ̀ dídé Títù gẹ́gẹ́ bí ọ̀nà ìtùnú, ṣùgbọ́n παρουσία tún lè tẹnumọ́ wíwà rẹ̀ níbẹ̀.
translation_notes:
  register: Èdè Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A tún gbólóhùn ‘tu ... nínú’ ṣe láti pa ìsopọ̀ παρακαλῶν/παρεκάλεσεν mọ́.
