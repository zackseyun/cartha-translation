id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: yo
  text: Kò sọ èyí láti dá yín lẹ́bi,[a] nítorí mo ti sọ tẹ́lẹ̀ pé ẹ wà nínú ọkàn wa, láti jọ kú àti láti jọ wà láàyè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìdálẹ́bi,” tàbí “pẹ̀lú ète láti dá yín lẹ́bi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún jíjọ kú àti jíjọ wà láàyè.” Ọ̀rọ̀ Gíríìkì tẹnumọ́ ìdúró papọ̀ nínú ikú àti ìyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: láti dá yín lẹ́bi
  rationale: Ọ̀rọ̀ yìí fi ète tàbí ìdarí ọ̀rọ̀ hàn. ‘Láti dá yín lẹ́bi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kì í ṣe láti mú ìdálẹ́bi wá ni Pọ́ọ̀lù fi ń sọ̀rọ̀.
- source_word: λέγω
  choice: Èmi kò sọ èyí
  rationale: ‘Sọ’ túmọ̀ λέγω ní kedere; fífi ‘èyí’ kún un tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ. ‘Èmi’ tún mú ìtẹnumọ́ Gíríìkì inú ọ̀rọ̀ náà jáde lọ́nà àdánidá.
- source_word: προείρηκα
  choice: mo ti sọ tẹ́lẹ̀
  rationale: Àkókò perfect tọ́ka sí ohun tí a ti sọ ṣáájú tí ó sì ṣì ṣe pàtàkì nísinsìnyí; ‘mo ti sọ tẹ́lẹ̀’ mú èyí jáde dáadáa.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: ẹ wà nínú ọkàn wa
  rationale: Èyí pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì sọ ìfẹ́ jíjinlẹ̀ àti ìsopọ̀ ọkàn. Bí Gíríìkì tilẹ̀ lo ọ̀pọ̀ ‘ọkàn,’ Yorùbá máa ń lo ‘ọkàn wa’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ tó jẹ́ àdánidá.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: láti jọ kú àti láti jọ wà láàyè
  rationale: ‘Láti’ pa ìtumọ̀ ète tàbí àbájáde εἰς τὸ mọ́ láì pinnu rẹ̀ jù; ‘jọ’ sì fi συν- inú àwọn ọ̀rọ̀ ìṣe méjèèjì hàn, nígbà tí ìtẹ̀lé ikú ṣáájú ìyè dúró gẹ́gẹ́ bí orísun.
- source_word: συναποθανεῖν
  choice: láti jọ kú
  rationale: ‘Jọ kú’ fi ìṣọ̀kan àti ìdúró papọ̀ tí συν- ń tẹnumọ́ hàn ní Yorùbá tó rọrùn.
- source_word: συζῆν
  choice: láti jọ wà láàyè
  rationale: ‘Jọ wà láàyè’ jẹ́ ọ̀nà àdánidá láti sọ ìpín nínú ìyè papọ̀, ó sì bá ‘jọ kú’ dọ́gba.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ‘láti jọ kú àti láti jọ wà láàyè’ gẹ́gẹ́ bí ọ̀rọ̀ amúlò pàtó nípa májẹ̀mú, ìgbéyàwó, tàbí ìṣọ̀kan pẹ̀lú Kristi
  choice: Pa ọ̀rọ̀ ìfẹ́ àti ìṣọ̀kan nínú ikú àti ìyè mọ́ láì fi ẹ̀kọ́ pàtó kún un
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìṣòtítọ́ májẹ̀mú tàbí ìkópa nínú Kristi
  rationale: Ẹsẹ̀ náà fi ìfẹ́ jíjinlẹ̀ àti ìṣọ̀kan Pọ́ọ̀lù pẹ̀lú àwọn ará Kọ́ríńtì hàn, ṣùgbọ́n kò pe ìṣọ̀kan náà ní ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
translation_notes:
  register: Yorùbá àgbàṣe tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Ẹ’ àti ‘yín’ jẹ́ ọ̀pọ̀ ènìyàn, wọ́n sì bá àwọn ará Kọ́ríńtì mu; ‘wa’ pa ohùn Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ mọ́.
