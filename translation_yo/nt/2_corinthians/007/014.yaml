id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: yo
  text: Nítorí bí mo bá ti fọ́nnu nípa yín fún un rárá, a kò fi mí sí ìtìjú. Kàkà bẹ́ẹ̀, gẹ́gẹ́ bí a ti sọ ohun gbogbo fún yín ní òtítọ́, bẹ́ẹ̀ náà ni ìfọ́nnu wa níwájú Títù[a] fi hàn pé òótọ́ ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfọ́nnu wa fún Títù nípa yín.”
    reason: Ọ̀rọ̀ Gíríìkì ἡ ἐπὶ Τίτου lè tọ́ka sí ìfọ́nnu tí a ṣe níwájú tàbí fún Títù; àyíká ọ̀rọ̀ fi hàn pé àwọn ará Kọ́ríńtì ni Pọ́ọ̀lù ń fọ́nnu nípa wọn.
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις ἡμῶν
  choice: mo bá ti fọ́nnu / ìfọ́nnu wa
  rationale: “Fọ́nnu/ìfọ́nnu” pa ìbátan ọ̀rọ̀-ìṣe àti orúkọ mọ́, ó sì lè túmọ̀ sí jíjẹ́rìí rere tàbí fífi ìgbéraga hàn; àyíká ọ̀rọ̀ ló fi hàn pé ìfọ́nnu Pọ́ọ̀lù ní ìdí tí ó tọ́.
- source_word: οὐ κατῃσχύνθην
  choice: a kò dójú tì mí
  rationale: 'Èyí pa ìtumọ̀ ìṣe-aláìṣe mọ́: ohun tí ó ṣẹlẹ̀ kò sọ Pọ́ọ̀lù di ẹni ìtìjú, dípò pé ó kan ní ìmọ̀lára ìtìjú nínú ara rẹ̀.'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: a ti sọ ohun gbogbo fún yín ní òtítọ́
  rationale: Ó pa ìwọ̀n gbogbo ohun (πάντα) àti ọ̀nà ìsọ̀rọ̀ olóòtítọ́ (ἐν ἀληθείᾳ) mọ́ ní Yorùbá àdánidá.
- source_word: ἡ ἐπὶ Τίτου
  choice: níwájú Títù
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, ó sì tọ́ka sí ìfọ́nnu tí Pọ́ọ̀lù ṣe níwájú tàbí fún Títù láìfi ohun tí kò hàn gbangba kún un.
- source_word: ἀλήθεια ἐγενήθη
  choice: fi hàn pé òótọ́ ni
  rationale: 'Gbólóhùn Yorùbá yìí sọ ìtumọ̀ àkànlò náà ní kedere: ohun tí Pọ́ọ̀lù ti sọ nípa wọn jẹ́rìí sí ara rẹ̀ pé ó bá òtítọ́ mu.'
- source_word: ὅτι
  choice: Nítorí
  rationale: Ὅτι ń mú àlàyé tí ẹsẹ yìí fi kún ọ̀rọ̀ tó ṣáájú wọlé.
theological_decisions:
- issue: Irú ìfọ́nnu tí Pọ́ọ̀lù ń sọ
  choice: Lo “fọ́nnu/ìfọ́nnu,” kí àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ jíjẹ́rìí rere tí ó ní ìdí.
  alternative: Lo “ní ìgbọ́kànlé” tàbí “ṣògo” láti yẹra fún ìtumọ̀ ìgbéraga.
  rationale: Καυχάομαι àti καύχησις lè tọ́ka sí ìfọ́nnu tàbí ayọ̀ ìgbẹ́kẹ̀lé tí ó yẹ. Yíyan “fọ́nnu” pa agbára ọ̀rọ̀ àti ìbátan àwọn ọ̀rọ̀ méjèèjì mọ́, láìdájọ́ pé ó jẹ́ ìgbéraga ẹlẹ́ṣẹ̀.
translation_notes:
  register: Yorùbá boṣewa oníwọ̀ntúnwọ̀nsì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “A kò dójú tì mí” àti “fi hàn pé òótọ́ ni” jẹ́ àkànlò Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní, nígbà tí “níwájú Títù” pa àìdánilójú gírámà Gíríìkì mọ́.
