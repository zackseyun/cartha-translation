  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: ó pa ìsopọ̀ ìdí (διὰ τοῦτο), ìtumọ̀ àṣepé, ìtẹnumọ́ ayọ̀, ayọ̀ Títù, àti pé gbogbo àwọn ará Kọ́ríńtì ni orísun ìtura Títù mọ́. Síbẹ̀, àwọn ìsọ̀rọ̀ “rí ìtùnú gbà” àti “rí ìtura gbà” kò dùn mọ́ Yorùbá ìgbàlódé, wọ́n sì dà bí ìtúmọ̀ ọ̀rọ̀-fún-ọ̀rọ̀. “Rí ìtùnú” àti “rí ìtura” dáa sí i, wọ́n sì tún lè gbé ìṣe àṣepé Gíríìkì náà.'
  naturalness: Àtúnṣe náà mú gbólóhùn náà rọrùn àti àdánidá sí i. “A yọ̀ sí i gidigidi” ń gbé ìtẹnumọ́ περισσοτέρως μᾶλλον kalẹ̀ láì ṣe àkójọpọ̀ ọ̀rọ̀ tí ó lérù. “Láti ọ̀dọ̀ gbogbo yín” jẹ́ ọ̀nà Yorùbá tí ó hàn gbangba fún orísun/olùfa ìtura náà.
  terminology: A pa ìfararora παρακαλέω/παράκλησις mọ́ pẹ̀lú “ìtùnú,” a sì fi “ìṣírí” sílẹ̀ nínú àlàyé gẹ́gẹ́ bí ìtumọ̀ mìíràn. “Ẹ̀mí rẹ̀” ń tọ́ka sí inú tàbí ipò ọkàn Títù, kì í ṣe Ẹ̀mí Mímọ́. Àlàyé [b] yẹ kí ó sọ “rí ìsinmi” dipo “balẹ̀,” nítorí èyí sun mọ́ ìtumọ̀ ‘has found rest’ jù.
