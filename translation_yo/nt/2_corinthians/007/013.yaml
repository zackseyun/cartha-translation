id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: yo
  text: Nítorí èyí, a ti rí ìtùnú.[a] Ní àfikún sí ìtùnú wa, a yọ̀ sí i gidigidi nítorí ayọ̀ Títù, nítorí ẹ̀mí rẹ̀ ti rí ìtura láti ọ̀dọ̀ gbogbo yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti gba ìṣírí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìtùnú tàbí ìṣírí ní àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀mí rẹ̀ ti rí ìsinmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó pa ìtumọ̀ ìdí tàbí àbájáde tí gbólóhùn Gíríìkì náà ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú.
- source_word: παρακεκλήμεθα
  choice: a ti rí ìtùnú gbà
  rationale: Ìṣe àṣepé aláìṣiṣẹ́ náà tọ́ka sí ìtùnú tí wọ́n ti rí gbà, tí ipò rẹ̀ sì ń bá a lọ. ‘Rí ìtùnú gbà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi ‘gba ìṣírí’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Ní àfikún sí ìtùnú wa
  rationale: Ní àyíká yìí, ἐπί pẹ̀lú dative fi ayọ̀ tí ó tún wà lórí ìtùnú wọn hàn. Ìtumọ̀ yìí mú ìbáṣepọ̀ ọ̀rọ̀ náà ṣe kedere láì yí èrò rẹ̀ padà.
- source_word: περισσοτέρως μᾶλλον
  choice: púpọ̀ sí i gidigidi
  rationale: Àkójọpọ̀ àwọn ọ̀rọ̀ afiwéra méjèèjì ń fi ìtẹnumọ́ hàn; gbólóhùn Yorùbá yìí pa ìtẹnumọ́ náà mọ́ láì dun bí ìtumọ̀ líle.
- source_word: ἐχάρημεν
  choice: a yọ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún ayọ̀ lílágbára tí χαίρω ń sọ, ó sì bá χαρά (‘ayọ̀’) tí ó tẹ̀ lé e mu.
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: nítorí ayọ̀ Títù
  rationale: Ní àyíká yìí, ayọ̀ Títù ni ìpìlẹ̀ ayọ̀ Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀; ‘nítorí’ sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá.
- source_word: ἀναπέπαυται
  choice: ti rí ìtura gbà
  rationale: Ìṣe àṣepé náà sọ ìtura tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì dúró. Àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ti balẹ̀’ mọ́ gẹ́gẹ́ bí ọ̀nà mìíràn.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: ẹ̀mí rẹ̀
  rationale: Ó pa èdè nípa inú Títù tàbí ìmọ̀lára rẹ̀ mọ́, láì sọ ọ́ di ‘ọkàn’ tàbí ‘èrò inú’ nìkan.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: lọ́dọ̀ gbogbo yín
  rationale: Ó fi orísun ìtura náà hàn ní Yorùbá àdánidá, ó sì pa ‘gbogbo’ tí ó wà nínú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nípa Títù
  choice: ẹ̀mí Títù fúnra rẹ̀, ìyẹn inú tàbí ìmọ̀lára rẹ̀
  alternative: Ẹ̀mí Mímọ́
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ‘rẹ̀’ àti àyíká ọ̀rọ̀ nípa bí Títù ṣe dáhùn sí àwọn ará Kọ́ríńtì fi hàn pé ẹ̀mí Títù fúnra rẹ̀ ni a ń sọ, kì í ṣe Ẹ̀mí Mímọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi àmì ohùn kún ọ̀rọ̀ níbi tí ó ti jẹ́ àdánidá, a sì lo ‘yín’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, nítorí πάντων ὑμῶν ń tọ́ka sí gbogbo ìjọ.
