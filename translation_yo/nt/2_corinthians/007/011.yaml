id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: yo
  text: Nítorí ẹ wo bí ìbànújẹ́ yìí gan-an tí ó wà ní ìbámu pẹ̀lú Ọlọ́run[a] ṣe mú ìtara púpọ̀ tó nínú yín! Àní ìgbèjà ara yín[b], àní ìbínú, àní ìbẹ̀rù, àní ìfẹ́-ọkàn jíjinlẹ̀, àní ìtara, àní ìgbẹ̀san[c]. Ní gbogbo ọ̀nà, ẹ fi ara yín hàn pé ẹ jẹ́ aláìlẹ́bi ní ti ọ̀ràn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìbànújẹ́ yìí gan-an tí ó bá ìfẹ́ Ọlọ́run mu.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfìdí ara yín múlẹ̀” tàbí “ẹ fi ara yín hàn pé ẹ kò lọ́wọ́ nínú ìwà búburú náà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìjìyà” tàbí “ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Nítorí náà, ẹ wò ó
  rationale: Ó pa agbára ìtọ́ka ἰδού àti ìtumọ̀ ìṣàròyé γάρ mọ́, ní ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: ìbànújẹ́ yìí gan-an ní ìbámu pẹ̀lú Ọlọ́run
  rationale: A sọ àpólà ọ̀rọ̀-ìṣe náà di ọ̀rọ̀-orúkọ, a sì pa ìtumọ̀ gbooro κατὰ θεόν mọ́ láì sọ ọ́ di ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: ti mú ìtara ńlá jáde nínú yín
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìbànújẹ́ náà mú àbájáde kan wá nínú wọn; ìtara sì bá σπουδή mu ní àyíká yìí.
- source_word: ἀλλὰ
  choice: kódà
  rationale: Àtúnwí ἀλλά níbí ń fi ohun tuntun kún àtòjọ náà, ó sì ń mú kí ọ̀kọ̀ọ̀kan lágbára; ‘kódà’ ṣe bẹ́ẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: ἀπολογίαν
  choice: ẹ gbèjà ara yín
  rationale: Ó mú èrò ìdáhùn tàbí ìgbèjà ara ẹni jáde, láì pinnu ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: ἀγανάκτησιν
  choice: ẹ bínú gidigidi
  rationale: Ó sọ ìbínú líle tàbí ìkọ̀sí ìwà búburú, ṣùgbọ́n kò sọ ẹni tàbí ohun tí ìbínú náà dojú kọ.
- source_word: φόβον
  choice: ẹ bẹ̀rù
  rationale: A pa ohun tí ìbẹ̀rù náà dojú kọ sílẹ̀ láì sọ, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: ἐπιπόθησιν
  choice: ẹ ní ìfẹ́-ọkàn jíjinlẹ̀
  rationale: Ó fi ìfẹ́ tàbí ìyánhànhàn líle hàn láì fi ohun tí wọ́n ń fẹ́ kún un.
- source_word: ζῆλον
  choice: ẹ ní ìtara
  rationale: ‘Ìtara’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìfẹ́ líle láti ṣe ohun kan, ó sì yẹ fún àyíká ìrònúpìwàdà yìí.
- source_word: ἐκδίκησιν
  choice: ẹ mú ìdájọ́ ṣẹ
  rationale: Yíyan yìí fi ìgbésẹ̀ láti mú ohun tó tọ́ ṣẹ hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ìjìyà àti gbígbẹ̀san mọ́.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: Ní gbogbo ọ̀nà, ẹ fi ara yín hàn
  rationale: Ó mú ìtumọ̀ ẹ̀rí tàbí ìfihàn συνεστήσατε jáde, ó sì túmọ̀ ἐν παντί gẹ́gẹ́ bí àkójọpọ̀ gbogbo ìhùwàsí wọn.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: pé ẹ jẹ́ mímọ́ ní ti ọ̀ràn náà
  rationale: ‘Mímọ́’ pa àwòrán ìwà pípé tàbí àìní àbàwọ́n mọ́, dípò kí a fi ‘aláìlẹ́bi’ pinnu ìtumọ̀ òfin nìkan.
theological_decisions:
- issue: Ìtumọ̀ κατὰ θεόν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  alternative: tí ó bá ìfẹ́ Ọlọ́run mu
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa ọ̀nà tí Pọ́ọ̀lù gbà sọ ọ́ mọ́, láì dájú pé ó túmọ̀ sí ìfẹ́ Ọlọ́run, ìlànà rẹ̀, tàbí ìbànújẹ́ tó ní ìwà-bí-Ọlọ́run nìkan.
- issue: Ìtumọ̀ ἐκδίκησις nínú ọ̀rọ̀ ìrònúpìwàdà
  choice: mú ìdájọ́ ṣẹ
  alternative: fi ìyà jẹ; gbẹ̀san; mú ohun tó tọ́ ṣẹ
  rationale: Àyíká náà ń sọ nípa ìdáhùn àwọn ará Kọ́ríńtì sí ẹ̀ṣẹ̀. Yíyan yìí fi ìgbésẹ̀ ododo hàn láì gbé ẹ̀san ara ẹni lárugẹ, ṣùgbọ́n àlàyé pa ìtumọ̀ ìjìyà tó ṣeé ṣe mọ́.
- issue: Ìtumọ̀ ἁγνούς nípa ọ̀ràn náà
  choice: ẹ jẹ́ mímọ́ ní ti ọ̀ràn náà
  alternative: ẹ jẹ́ aláìlẹ́bi ní ti ọ̀ràn náà
  rationale: ‘Mímọ́’ tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, ó sì pa àìdájú díẹ̀ mọ́ nípa bóyá Pọ́ọ̀lù ń sọ àìní ẹ̀bi pátápátá tàbí bí wọ́n ṣe ya ara wọn sọ́tọ̀ kúrò nínú ìwà búburú náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnwí “kódà” pa ìlù àti ìtẹnumọ́ àtòjọ Gíríìkì mọ́, nígbà tí àwọn gbólóhùn kúkúrú mú kí ẹsẹ náà rọrùn fún òǹkàwé lasán.
