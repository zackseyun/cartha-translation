    rationale: Gíríìkì ń ṣàkójọ àwọn ẹ̀rí gẹ́gẹ́ bí orúkọ; pípa ìrísí yìí mọ́ ń mú ìtẹnumọ́ àti ìbáṣepọ̀ àwọn nǹkan méje náà hàn dáadáa.
