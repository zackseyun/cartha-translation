    rationale: γάρ jẹ́ ‘nítorí/fún,’ kì í ṣe àmì àbájáde ‘nítorí náà’; ìyàtọ̀ náà kan ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù.
  - severity: medium
    issue: “ìtara ńlá” fún πόσην ... σπουδήν
    rationale: πόσην ń tẹnumọ́ ìwọ̀n—“bí ... ṣe pọ̀ tó”—kì í kan pé ìtara náà ‘ńlá’.
