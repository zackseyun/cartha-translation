id: 2CO.7.10
reference: 2 Corinthians 7:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: yo
  text: Nítorí ìbànújẹ́ ní ìbámu pẹ̀lú Ọlọ́run[a] ń mú ìrònúpìwàdà tí ń yọrí sí ìgbàlà láìsí ìkábàámọ̀[b] wá; ṣùgbọ́n ìbànújẹ́ ti ayé ń mú ikú wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìbànújẹ́ tí ó bá Ọlọ́run mu.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí “ìbànújẹ́ ní ìbámu pẹ̀lú Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìrònúpìwàdà tí a kò ní kábàámọ̀, tí ń yọrí sí ìgbàlà.” Ọ̀rọ̀ náà lè ṣàpèjúwe ìrònúpìwàdà ní tààrà sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  rationale: Ó fi hàn pé ìbànújẹ́ náà bá Ọlọ́run àti ìlànà rẹ̀ mu, láìsọ ọ́ di èrò ẹ̀kọ́ ìsìn kan pàtó. Ó tún dá ìyàtọ̀ rẹ̀ sí ‘ti ayé’ dúró.
- source_word: λύπη
  choice: ìbànújẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún ìrora ọkàn tàbí ìbànújẹ́ nínú àwọn gbólóhùn méjèèjì.
- source_word: μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí yíyí ọkàn àti ìgbésí ayé padà kúrò nínú ẹ̀ṣẹ̀, kì í ṣe kìkàn ronú lọ́nà mìíràn.
- source_word: εἰς σωτηρίαν
  choice: tí ń yọrí sí ìgbàlà
  rationale: Ó sọ ète tàbí àbájáde tí εἰς ń tọ́ka sí, láìsọ bí ìrònúpìwàdà àti ìgbàlà ṣe so pọ̀ ní ọ̀nà ẹ̀kọ́ ìsìn kan pàtó.
- source_word: ἀμεταμέλητον
  choice: láìsí ìkábàámọ̀
  rationale: Ó pa ìtumọ̀ ‘tí a kò ní kábàámọ̀’ mọ́, ó sì wà ní ipò tí ó jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ìrònúpìwàdà tàbí gbogbo ọ̀nà tó yọrí sí ìgbàlà má ṣe di pípa mọ́ sí ìtumọ̀ kan ṣoṣo.
- source_word: ἐργάζεται / κατεργάζεται
  choice: ń mú … wá
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé ohun kan ń fa àbájáde kan, ó sì pa ìfarajọ àwọn abala méjèèjì mọ́.
- source_word: τοῦ κόσμου
  choice: ti ayé
  rationale: Ó túmọ̀ genitive náà ní tààrà, ó sì yà á sọ́tọ̀ sí ìbànújẹ́ tí ó ní ìbámu pẹ̀lú Ọlọ́run.
- source_word: θάνατον
  choice: ikú
  rationale: A pa ìtumọ̀ rẹ̀ gbòòrò bí ti Gíríìkì, láìdín in kù sí ikú ti ara, ti ẹ̀mí, tàbí ti ọjọ́ ìkẹyìn nìkan.
theological_decisions:
- issue: Irú ìbànújẹ́ méjì tí Pọ́ọ̀lù fi wéra
  choice: ìbànújẹ́ ní ìbámu pẹ̀lú Ọlọ́run àti ìbànújẹ́ ti ayé
  alternative: ìbànújẹ́ ti Ọlọ́run àti ìbànújẹ́ ayé
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ inú Gíríìkì mọ́, ṣùgbọ́n kò sọ pé Ọlọ́run fúnra rẹ̀ ló fa ìbànújẹ́ náà tàbí pé ‘ikú’ jẹ́ irú ikú kan pàtó.
- issue: Ìbáṣepọ̀ ìrònúpìwàdà pẹ̀lú ìgbàlà
  choice: ìrònúpìwàdà tí ń yọrí sí ìgbàlà
  alternative: ìrònúpìwàdà fún ìgbàlà
  rationale: Ó pa agbára ète tàbí àbájáde εἰς mọ́, láìfi ọ̀nà ìgbàlà sí abẹ́ àlàyé ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
- issue: Ohun tí ἀμεταμέλητον ń ṣàpèjúwe
  choice: Fi ‘láìsí ìkábàámọ̀’ sí lẹ́yìn ‘ìgbàlà’ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe tò ó, kí ìtumọ̀ rẹ̀ má bàa di pípa mọ́ sí ohun kan ṣoṣo
  alternative: ìrònúpìwàdà tí a kò ní kábàámọ̀, tí ń yọrí sí ìgbàlà
  rationale: Adjective náà lè ní ìbáṣepọ̀ tímọ́tímọ́ pẹ̀lú ìrònúpìwàdà, ṣùgbọ́n ipò rẹ̀ tún jẹ́ kí a lè gbọ́ ọ gẹ́gẹ́ bí ohun tó kan gbogbo ìrònúpìwàdà tó yọrí sí ìgbàlà. Àkọ́lé ìsàlẹ̀ ojú ewé pa ọ̀nà kejì mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. ‘Ìrònúpìwàdà,’ ‘ìgbàlà,’ àti ‘ikú’ jẹ́ ọ̀rọ̀ tí ó mọ́gbọ́n dání nínú ìforúkọsílẹ̀ Bíbélì, ṣùgbọ́n gbogbo gbólóhùn náà ṣì ṣeé lóye fún òǹkàwé Yorùbá òde òní. A yẹra fún gígùn gbólóhùn ju bó ṣe yẹ àti fún fífi ẹ̀kọ́ ìsìn ẹgbẹ́ kan sínú ẹsẹ̀ náà.
