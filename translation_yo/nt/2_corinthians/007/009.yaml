id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: yo
  text: Ní báyìí, mo yọ̀—kì í ṣe nítorí pé ẹ banújẹ́, bí kò ṣe nítorí pé ẹ ní ìbànújẹ́ débi ìrònúpìwàdà[a]. Nítorí ẹ banújẹ́ ní ìbámu pẹ̀lú Ọlọ́run[b], kí ẹ má bàa ní àdánù kankan nípasẹ̀ wa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìyípadà ọkàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọ̀nà tí Ọlọ́run fẹ́,” tàbí “ní ọ̀nà tó yẹ níwájú Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ẹ má bàa ní ìpalára kankan nítorí wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ní báyìí
  rationale: Ó fi ojú tí Pọ́ọ̀lù fi ń wo ọ̀ràn náà ní àkókò yìí hàn, ní ìyàtọ̀ sí ìbànújẹ́ tí ó ti ṣẹlẹ̀ tẹ́lẹ̀.
- source_word: χαίρω
  choice: mo yọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ọ̀rọ̀-ìṣe àti ìdùnnú Pọ́ọ̀lù mọ́.
- source_word: ἐλυπήθητε
  choice: ẹ banújẹ́
  rationale: Ọ̀rọ̀ yìí ṣe àfihàn pé wọ́n dé ipò ìbànújẹ́; ṣíṣe àtúnlò rẹ̀ nínú ẹsẹ náà tún pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: εἰς μετάνοιαν
  choice: yọrí sí ìrònúpìwàdà
  rationale: εἰς tọ́ka sí àbájáde tàbí ibi tí ìbànújẹ́ náà darí wọn sí; ‘yọrí sí’ jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: Ọ̀rọ̀ Yorùbá tí a mọ̀ sí ìyípadà inú àti ìwà nípa yíyí padà kúrò nínú ohun tí kò tọ́; ó bá agbára ti ọ̀rọ̀ náà ní inú ẹsẹ yìí mu.
- source_word: κατὰ θεόν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  rationale: Ó pa ìbáṣepọ̀ ìbànújẹ́ náà pẹ̀lú ìwọ̀n tàbí ìfẹ́ Ọlọ́run mọ́ láì sọ ìtumọ̀ náà di èyí tí óóró ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: ζημιωθῆτε
  choice: ẹ má bàa pàdánù ohunkóhun
  rationale: Ó mú èrò àdánù tí ζημιόω ní wá, láì sọ ọ́ di ìpalára ara.
- source_word: ἐξ ἡμῶν
  choice: láti ọwọ́ wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún orísun tàbí ohun tí àdánù lè ti wá, ó sì pa àìdánilójú díẹ̀ tí ἐξ ní mọ́.
theological_decisions:
- issue: Irú ìbànújẹ́ tí κατὰ θεόν ń tọ́ka sí
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  alternative: ní ọ̀nà ti Ọlọ́run fẹ́; ìbànújẹ́ oníwà-bí-Ọlọ́run
  rationale: Àṣàyàn yìí fi ìbànújẹ́ náà sí ìbáṣepọ̀ pẹ̀lú Ọlọ́run, ṣùgbọ́n kò pinnu bóyá gbolohun náà túmọ̀ sí ‘gẹ́gẹ́ bí ìfẹ́ Ọlọ́run,’ ‘gẹ́gẹ́ bí ìwọ̀n Ọlọ́run,’ tàbí ‘ní ọ̀nà tó yẹ níwájú Ọlọ́run.’
- issue: Ìtumọ̀ μετάνοια
  choice: ìrònúpìwàdà
  alternative: ìyípadà ọkàn tàbí èrò
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ní agbára ìwà àti ti ẹ̀mí ju yíyí èrò lásán lọ; síbẹ̀, àlàyé ìsàlẹ̀ fi àwọ̀ ìtumọ̀ ìyípadà ọkàn hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn ‘ní ìbámu pẹ̀lú Ọlọ́run’ mọ̀ọ́mọ̀ pa àìdánilójú ẹ̀kọ́-ìsìn inú κατὰ θεόν mọ́.
