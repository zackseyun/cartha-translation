  to: Ní báyìí, mo yọ̀—kì í ṣe nítorí pé ẹ banújẹ́, bí kò ṣe nítorí pé ẹ ní ìbànújẹ́ débi ìrònúpìwàdà[a]. Nítorí ẹ banújẹ́ ní ìbámu pẹ̀lú Ọlọ́run[b], kí ẹ má bàa ní àdánù kankan nípasẹ̀ wa[c].
