id: 2CO.7.15
reference: 2 Corinthians 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: yo
  text: Ìfẹ́ ọkàn rẹ̀ sí yín sì túbọ̀ pọ̀ sí i bí ó ti ń rántí ìgbọ́ràn gbogbo yín, àti bí ẹ ti fi ìbẹ̀rù àti ìwárìrì[a] gbà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìbòwò àti ìwárìrì.” Gbólóhùn “ìbẹ̀rù àti ìwárìrì” jẹ́ àkànlò èdè tí Pọ́ọ̀lù máa ń lò fún ìfèsì tó ṣe pàtàkì, pẹ̀lú ìrẹ̀lẹ̀ àti ìbòwò.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: ìfẹ́ ọkàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ẹ̀yà inú ní ti gidi, ṣùgbọ́n níhìn-ín ó jẹ́ àkànlò èdè fún ìfẹ́ jíjinlẹ̀ àti ìmọ̀lára oníjẹ̀lẹ́ńkẹ́ sí ẹlòmíràn. “Ìfẹ́ ọkàn” jẹ́ èdè Yorùbá àdánidá tí ó mú agbára ìmọ̀lára náà jáde.
- source_word: περισσοτέρως
  choice: túbọ̀ pọ̀ sí i
  rationale: Ó fi ìwọ̀n àfiwé hàn pé ìfẹ́ Títù sí wọn ń pọ̀ sí i ju tẹ́lẹ̀ lọ.
- source_word: εἰς ὑμᾶς
  choice: sí yín
  rationale: Ó tọ́ka sí ibi tí ìfẹ́ náà darí sí; “sí yín” tún pa ìtumọ̀ ọ̀pọ̀ ènìyàn mọ́.
- source_word: ἀναμιμνῃσκομένου
  choice: bí ó ti ń rántí
  rationale: Ọ̀rọ̀ ìṣe aláìlópìn náà ṣàpèjúwe ipò tí ó ń bá ìfẹ́ rẹ̀ tí ń pọ̀ sí i lọ, ó sì pa ìmọ̀ pé ó ń rántí mọ́.
- source_word: ὑπακοήν
  choice: ìgbọ́ràn
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì bójú mu fún bí àwọn ará Kọ́ríńtì ṣe fèsì sí ìtọ́ni aposteli.
- source_word: πάντων ὑμῶν
  choice: gbogbo yín
  rationale: Ó tẹnumọ́ pé gbogbo àwùjọ náà ló kópa, kì í ṣe àwọn kan nìkan.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: pẹ̀lú ìbẹ̀rù àti ìwárìrì
  rationale: Èyí pa àkànlò èdè Pọ́ọ̀lù àti ìfọkànsìn rẹ̀ mọ́ láì yanjú rẹ̀ sí ìbẹ̀rù lásán tàbí ọ̀wọ̀ nìkan.
- source_word: ἐδέξασθε
  choice: ẹ ti ... gba
  rationale: “Gba” lè ní ìtumọ̀ kíkọ́ ẹnì kan sílẹ̀, kíka á sí ẹni ìtẹ́wọ́gbà, àti gbígba ohun tí ó mú wá, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: αὐτόν
  choice: òun
  rationale: A pa arọ́pò-orúkọ inú Gíríìkì mọ́; àyíká ẹsẹ̀ fi hàn pé Títù ni ó ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ “ìbẹ̀rù àti ìwárìrì” nípa bí àwọn ará Kọ́ríńtì ṣe gba Títù
  choice: Pa àkànlò èdè náà mọ́ gẹ́gẹ́ bí “ìbẹ̀rù àti ìwárìrì,” kí àlàyé ẹsẹ̀ ìsàlẹ̀ fi hàn pé ó lè ní ìtumọ̀ ọ̀wọ̀ jíjinlẹ̀ àti ìfèsì onírẹ̀lẹ̀.
  alternative: “ọ̀wọ̀ àti ìwárìrì” tàbí ìbẹ̀rù ní ìtumọ̀ ẹ̀rù gan-an
  rationale: Àkànlò èdè Pọ́ọ̀lù náà ní agbára ìtumọ̀ tí ó ju ẹ̀rù lásán lọ. Títúmọ̀ rẹ̀ ní tààrà nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé ìsàlẹ̀, pa ìdánilójú àti àìdánilójú inú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá ìṣedéédé òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́lá tí ó ṣeé lóye. “Ìfẹ́ ọkàn” yẹra fún títúmọ̀ σπλάγχνα ní ti ẹ̀yà ara, “gbogbo yín” sì pa ìtẹnumọ́ gbogbo àwùjọ mọ́.
