- from: Nítorí bí mo tilẹ̀ fi lẹ́tà náà mú inú yín bàjẹ́, èmi kò kábàámọ̀ rẹ̀—bí mo tilẹ̀ ti ń kábàámọ̀ rẹ̀ nígbà kan[a] (nítorí mo rí i pé lẹ́tà yẹn mú inú yín bàjẹ́, bí ó tilẹ̀ jẹ́ fún ìgbà díẹ̀[b]).
  to: Nítorí bí mo tilẹ̀ fi lẹ́tà náà mú inú yín bàjẹ́, èmi kò kábàámọ̀ rẹ̀—bí mo tilẹ̀ ti kábàámọ̀ rẹ̀[a] (nítorí mo rí i pé lẹ́tà yẹn mú inú yín bàjẹ́, bí ó tilẹ̀ jẹ́ fún ìgbà díẹ̀[b]).
