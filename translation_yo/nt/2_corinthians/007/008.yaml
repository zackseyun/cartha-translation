id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: yo
  text: Nítorí bí mo tilẹ̀ fi lẹ́tà náà mú inú yín bàjẹ́, èmi kò kábàámọ̀ rẹ̀—bí mo tilẹ̀ ti kábàámọ̀ rẹ̀[a] (nítorí mo rí i pé lẹ́tà yẹn mú inú yín bàjẹ́, bí ó tilẹ̀ jẹ́ fún ìgbà díẹ̀[b]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí mo tilẹ̀ ti ń kábàámọ̀ rẹ̀.” Àkókò imperfect nínú èdè Gíríìkì lè tẹnu mọ́ ipò ìkábàámọ̀ kan ní ìgbà àtijọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “fún wákàtí kan”; àṣà ọ̀rọ̀ yìí túmọ̀ sí “fún àkókò kúkúrú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: mú inú yín bàjẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú kí ẹnì kan ní ìbànújẹ́ tàbí ìrora ọkàn. ‘Mú inú yín bàjẹ́’ jẹ́ Yorùbá àdánidá, ó sì pa agbára ìmọ̀lára inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: fi lẹ́tà náà
  rationale: ἐν níbí ń tọ́ka sí ohun èlò tí Paulu lò; ‘fi lẹ́tà náà’ sọ ìtumọ̀ ọ̀nà tàbí ohun èlò yìí ní Yorùbá àdánidá.
- source_word: μεταμέλομαι
  choice: kò kábàámọ̀ rẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà jẹ́ ìbànújẹ́ tàbí ìrònú pé ó ṣe ohun tí kò yẹ, kì í ṣe ìrònúpìwàdà ní ìtumọ̀ ẹ̀sìn.
- source_word: μετεμελόμην
  choice: ti ń kábàámọ̀ rẹ̀ nígbà kan
  rationale: Àkókò imperfect Gíríìkì lè fi ipò ìbànújẹ́ tí ó wà fún àkókò kan ní ìgbà àtijọ́ hàn. Ìtumọ̀ yìí pa ìyàtọ̀ rẹ̀ mọ́ sí ‘kò kábàámọ̀’ ti ìsinsìnyí.
- source_word: βλέπω
  choice: mo rí i
  rationale: ‘Mo rí i’ jẹ́ ìtumọ̀ tààrà tí ó sì lè túmọ̀ sí mímọ̀ tàbí ṣíṣe àkíyèsí ní àyíká yìí.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: lẹ́tà yẹn
  rationale: ‘Yẹn’ pa agbára ọ̀rọ̀ atọ́ka ἐκείνη mọ́, ó sì jẹ́ èdè Yorùbá òde òní.
- source_word: πρὸς ὥραν
  choice: fún ìgbà díẹ̀
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ tí ó túmọ̀ sí fún àkókò kúkúrú, kì í ṣe wákàtí kan gangan.
- source_word: ὅτι
  choice: Nítorí / nítorí
  rationale: ὅτι àkọ́kọ́ ń ṣàlàyé gbólóhùn tó ṣáájú, èkejì sì ń gbé ìdí tàbí àlàyé Paulu kalẹ̀.
- source_word: εἰ καὶ
  choice: bí ... tilẹ̀
  rationale: Ìṣètò Yorùbá yìí sọ concessive force ti εἰ καὶ ní ọ̀nà àdánidá, láì sọ ìdánilójú ọ̀rọ̀ náà di ohun mìíràn.
theological_decisions:
- issue: Ìtumọ̀ μεταμέλομαι nínú àpèjúwe ìmọ̀lára Paulu
  choice: kábàámọ̀
  alternative: ronúpìwàdà / banújẹ́
  rationale: Àyíká náà ń sọ nípa bí Paulu ṣe rí ipa lẹ́tà rẹ̀ lára àwọn ará Kọrinti, kì í ṣe nípa ìrònúpìwàdà rẹ̀ níwájú Ọlọ́run. ‘Kábàámọ̀’ yà èyí sọ́tọ̀ kúrò lọ́dọ̀ μετανοέω, láì fi ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà kún un.
- issue: Àìdánilójú ìtòlẹ́sẹẹsẹ gbólóhùn parenthetical
  choice: Lo àmì àkámọ́ yíká fún ‘nítorí mo rí i ...’
  alternative: So gbogbo rẹ̀ pọ̀ mọ́ gbólóhùn náà láìsí àmì àkámọ́ yíká
  rationale: Àmì àkámọ́ yíká ń tẹ̀ lé ìṣètò SBLGNT, ó sì pa ìdádúró àti ìdiju ọ̀rọ̀ Paulu mọ́ láì fipá yan ìbáṣepọ̀ ọ̀rọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A lo ‘lẹ́tà’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn pàtó, a sì lo ‘mú inú ... bàjẹ́’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìbànújẹ́ ọkàn. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
