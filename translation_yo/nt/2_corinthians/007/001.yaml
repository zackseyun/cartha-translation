id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin olùfẹ́, níwọ̀n bí a ti ní àwọn ìlérí wọ̀nyí, ẹ jẹ́ kí a wẹ ara wa mọ́ kúrò nínú gbogbo èérí ti ara àti ti ẹ̀mí[a], bí a ti ń mú ìjẹ́mímọ́ dé ẹ̀kúnrẹ́rẹ́[b] nínú ìbẹ̀rù Ọlọ́run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àìmọ́ ti ara àti ti ẹ̀mí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí a ti ń sọ ìjẹ́mímọ́ di pípé.”
    reason: lexical_alternative
  - marker: c
    text: “Ìbẹ̀rù Ọlọ́run” níbí túmọ̀ sí ìbẹ̀rù tí ó kún fún ọ̀wọ̀ àti ìyanu níwájú Ọlọ́run, kì í ṣe ìpayà lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: àwọn ìlérí wọ̀nyí
  rationale: “Ìlérí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἐπαγγελία, “wọ̀nyí” sì tọ́ka padà sí àwọn ìdánilójú tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí ó ṣáájú.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ó pa ìfẹ́ àti ọlá inú ọ̀rọ̀ ìpè náà mọ́ ní èdè Yorùbá tó ṣe déédé.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: ẹ jẹ́ kí a wẹ ara wa mọ́
  rationale: Ìtumọ̀ yìí mú agbára ìṣírí olùsọ̀rọ̀ ẹni-àkọ́kọ́ púpọ̀ jáde, ó sì fi Pọ́ọ̀lù àti àwọn òǹkàwé sínú ìpè náà papọ̀.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: kúrò nínú gbogbo èérí
  rationale: “Èérí” lè sọ àbàwọ́n tàbí àìmọ́ ní ti ìwà àti ní ti ẹ̀sìn, ó sì bá àyíká ọ̀rọ̀ ìjẹ́mímọ́ mu.
- source_word: σαρκὸς καὶ πνεύματος
  choice: ti ara àti ti ẹ̀mí
  rationale: “Ara” àti “ẹ̀mí” fi ìyàtọ̀ tó wà láàárín apá ti ara àti apá inú ènìyàn hàn láì túmọ̀ σάρξ sí “ẹ̀dá ẹlẹ́ṣẹ̀.”
- source_word: ἐπιτελοῦντες
  choice: bí a ti ń mú ... dé ẹ̀kúnrẹ́rẹ́
  rationale: Ó mú ìṣe tó ń bá ìwẹ̀numọ́ lọ àti ìtẹ̀síwájú sí òpin tí a pinnu fún un hàn.
- source_word: ἁγιωσύνην
  choice: ìjẹ́mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ipò tàbí ànímọ́ mímọ́ nínú àyíká ìwà rere yìí.
- source_word: ἐν φόβῳ θεοῦ
  choice: nínú ìbẹ̀rù Ọlọ́run
  rationale: Ó pa àwòrán Bíbélì àti agbára ọ̀rọ̀ “ìbẹ̀rù” mọ́; kò dín un kù sí ọ̀wọ̀ lásán.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú “èérí ti ara àti ti ẹ̀mí”
  choice: A túmọ̀ rẹ̀ sí “ara,” apá ti ara ènìyàn.
  alternative: ẹran ara; ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Ìṣọ̀kan rẹ̀ pẹ̀lú “ẹ̀mí” ń tọ́ka sí gbogbo ènìyàn ní apá ti ara àti apá inú, kì í ṣe dandan ìtumọ̀ pàtó ti ìtẹ̀sí ẹlẹ́ṣẹ̀.
- issue: Agbára καθαρίσωμεν gẹ́gẹ́ bí ọ̀rọ̀ ìṣírí
  choice: “ẹ jẹ́ kí a wẹ ara wa mọ́,” tó ka Pọ́ọ̀lù àti àwọn òǹkàwé mọ́ra
  alternative: ó yẹ kí a wẹ ara wa mọ́
  rationale: Ọ̀rọ̀-ìṣe subjunctive ẹni-àkọ́kọ́ púpọ̀ jẹ́ ìṣírí alágbára, kì í ṣe gbólóhùn ojúṣe lásán.
- issue: Ìtumọ̀ φόβος ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run
  choice: A pa “ìbẹ̀rù Ọlọ́run” mọ́.
  alternative: ọ̀wọ̀ fún Ọlọ́run
  rationale: Gbólóhùn náà ní ìbẹ̀rù ọlọ́wọ̀ àti ìyanu ọlọ́wọ̀ nínú, ṣùgbọ́n lílo “ìbẹ̀rù” pa ìwọ̀n àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìpele ọlá tó ṣe déédé ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ̀yin olùfẹ́” pa ìfẹ́ inú ìpè náà mọ́, “ẹ jẹ́ kí a” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣírí tó ka olùsọ̀rọ̀ àti olùgbọ́ mọ́ra. A gbé àwọn àmì àlàyé sí lẹ́gbẹ̀ẹ́ gbólóhùn tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
