id: 2CO.10.17
reference: 2 Corinthians 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ń ṣògo, kí ó ṣògo nínú Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì: “Ẹni tí ń ṣògo, kí ó ṣògo nínú Olúwa.” Ó ṣeé ṣe kí Pọ́ọ̀lù ń tọ́ka sí Jeremáyà 9:24 (LXX 9:23).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: ẹni tí ó bá ń ṣògo
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí dúró gẹ́gẹ́ bí orúkọ fún ẹnikẹ́ni tó bá ń ṣe ìṣògo; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ aṣojú ẹyọ kan mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ kékeré hàn sí ọ̀rọ̀ tó ṣáájú; “Ṣùgbọ́n” bá àyíká tí Pọ́ọ̀lù ti ń fi ìṣògo tí kò tọ́ wé èyí tí ó tọ́ mu.
- source_word: καυχώμενος / καυχάσθω
  choice: ń ṣògo / kí ó ṣògo
  rationale: καυχάομαι túmọ̀ sí ṣíṣògo tàbí fífi ohun kan yangàn. “Ṣògo” pa ìtẹnumọ́ ọ̀rọ̀ náà mọ́, “kí ó ṣògo” sì fi àṣẹ tàbí ìgbani-nímọ̀ràn ẹni kẹta hàn ní Yorùbá àdánidá.
- source_word: ἐν
  choice: nínú
  rationale: Pẹ̀lú καυχάομαι, ἐν ń tọ́ka sí ibi, ìpìlẹ̀, tàbí ẹni tí ìṣògo dá lé. “Nínú” tún pa àrọ́kọ tí ó ṣeé ṣe sí Jeremáyà 9:24 mọ́.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí “Olúwa” jẹ́ ní kedere sí i; yíyan “Olúwa” pa àìdánilójú àti ìró ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láìfi àlàyé kún un.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú àrọ́kọ Ìwé Mímọ́
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Pọ́ọ̀lù dàbí ẹni pé ó ń sọ Jeremáyà, ṣùgbọ́n κυρίῳ nìkan ni Gíríìkì ní. Nítorí náà, a kò sọ ọ́ di “Olúwa Jésù” tàbí “Ọlọ́run,” kí ìfararora àti ìfarapa ìtumọ̀ tó wà nínú lílo Pọ́ọ̀lù lè dúró.
translation_notes:
  register: Yorùbá tó bófin mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. “Ẹni tí ó bá ń ṣògo” jẹ́ àdánidá fún gbólóhùn aṣojú gbogbogbò, “kí ó ṣògo” sì pa agbára àṣẹ ẹni kẹta mọ́. Àmì ohùn ni a fi sí ibi tí ó yẹ.
