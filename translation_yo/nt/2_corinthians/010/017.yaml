    text: 'Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì: “Ẹni tí ń ṣògo, kí ó ṣògo nínú Olúwa.” Ó ṣeé ṣe kí Pọ́ọ̀lù ń tọ́ka sí Jeremáyà 9:24 (LXX 9:23).'
    reason: cross_reference
