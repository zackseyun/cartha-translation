id: 2CO.10.4
reference: 2 Corinthians 10:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: yo
  text: Nítorí àwọn ohun ìjà tí a fi ń jagun kì í ṣe ti ara[a]; kàkà bẹ́ẹ̀, wọ́n lágbára lọ́dọ̀ Ọlọ́run[b] láti wó àwọn ibi olódi lulẹ̀—à ń wó àwọn àríyànjiyàn[c] lulẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe ti ẹran ara”; níhìn-ín ó lè túmọ̀ sí pé wọn kì í gbẹ́kẹ̀ lé agbára ènìyàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n lágbára nípasẹ̀ Ọlọ́run,” tàbí “wọ́n ní agbára àtọ̀runwá.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “àwọn ìrònú,” tàbí “àwọn ìṣírò ọkàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: àwọn ohun ìjà
  rationale: Ó pa àwòrán ohun èlò ogun mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: στρατείας
  choice: tí a fi ń jagun
  rationale: Gbólóhùn yìí mú ìtumọ̀ ìjà ogun tí ń lọ lọ́wọ́ jáde ní èdè Yorùbá àdánidá.
- source_word: σαρκικὰ
  choice: ti ara
  rationale: Ó pa ìsopọ̀ pẹ̀lú ‘ara’ mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ẹ̀ṣẹ̀ nìkan tàbí sí ohun ayé nìkan.
- source_word: δυνατὰ τῷ θεῷ
  choice: wọ́n lágbára lọ́dọ̀ Ọlọ́run
  rationale: ‘Lọ́dọ̀ Ọlọ́run’ tẹ̀lé dative Gíríìkì tí ó ṣókùnkùn díẹ̀, ó sì yẹra fún fífi ìtumọ̀ ohun èlò ‘nípasẹ̀’ múlẹ̀ bí ẹni pé kò sí àṣàyàn mìíràn.
- source_word: καθαίρεσιν
  choice: láti wó ... lulẹ̀
  rationale: Ó pa àwòrán bíbu odi ogun lulẹ̀ mọ́, ó sì so mọ́ ọ̀rọ̀-ìṣe καθαιροῦντες tó tẹ̀ lé e.
- source_word: ὀχυρωμάτων
  choice: àwọn ibi olódi
  rationale: Ó túmọ̀ sí àwọn ibi tí a fi odi tàbí agbára dáàbò bo, ó sì ṣiṣẹ́ dáadáa nínú àkàwé yìí.
- source_word: λογισμοὺς
  choice: àwọn àríyànjiyàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn ìrònú tàbí ìdáláre tí ń tako ìmọ̀ Ọlọ́run, kì í ṣe gbogbo èrò lásán.
- source_word: καθαιροῦντες
  choice: à ń wó ... lulẹ̀
  rationale: Àtúnlò ‘wó ... lulẹ̀’ pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú καθαίρεσιν, ó sì fi ipa àsọyé Gíríìkì hàn.
theological_decisions:
- issue: Ìtumọ̀ σαρκικὰ nínú ìyàtọ̀ láàárín ọ̀nà ènìyàn àti agbára Ọlọ́run
  choice: ti ara
  alternative: ti ẹran ara; ti ayé; tí ó gbẹ́kẹ̀ lé agbára ènìyàn
  rationale: ‘Ti ara’ pa àìdájú àti àwọ̀ ìmọ̀-ẹ̀sìn ọ̀rọ̀ Paulu mọ́, láì sọ ọ́ di ‘ẹlẹ́ṣẹ̀’ tàbí ‘ti ayé’ nìkan.
- issue: Agbára dative τῷ θεῷ nínú δυνατὰ τῷ θεῷ
  choice: lágbára lọ́dọ̀ Ọlọ́run
  alternative: lágbára nípasẹ̀ Ọlọ́run; ní agbára àtọ̀runwá
  rationale: Gíríìkì lè tọ́ka sí agbára tí ó jẹ́ ti Ọlọ́run, tí ó wá láti ọ̀dọ̀ rẹ̀, tàbí tí ó lágbára ní ojú rẹ̀. Àṣàyàn pàtàkì yìí kò fi ipa mú ìtumọ̀ ohun èlò nìkan; àlàyé ìsàlẹ̀ fi àwọn ọ̀nà mìíràn hàn.
- issue: Iṣẹ́ λογισμοὺς nínú àkàwé ibi olódi
  choice: àwọn àríyànjiyàn
  alternative: àwọn ìrònú; àwọn ìṣírò ọkàn
  rationale: Àyíká ẹsẹ tó tẹ̀ lé e fi hàn pé àwọn ọ̀nà ìrònú alatako ni a ń sọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò sí i mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ‘àwọn ohun ìjà,’ ‘jagun,’ ‘ibi olódi,’ àti ‘wó ... lulẹ̀’ láti pa àwòrán ogun àti ìbùdó olódi Gíríìkì mọ́. Àmì gígùn náà so λογισμοὺς καθαιροῦντες mọ́ àlàyé bíbu àwọn ibi olódi lulẹ̀.
