id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: yo
  text: Nítorí a kò na ara wa kọjá ààlà, bí ẹni pé a kò tíì dé ọ̀dọ̀ yín; nítorí a ti dé ọ̀dọ̀ yín gan-an pẹ̀lú ìhìn rere Mèsáyà—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: a kò na ara wa kọjá ààlà
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́—níní ara ẹni kọjá ibi tí ó yẹ—ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: bí ẹni pé a kò tíì dé ọ̀dọ̀ yín
  rationale: Ó fi èrò àròsọ tí gbólóhùn náà ń tako hàn, ó sì sọ ìtumọ̀ dídé ọ̀dọ̀ àwọn ará Kọ́ríńtì ní èdè àdánidá.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: nítorí a dé títí dé ọ̀dọ̀ yín gan-an
  rationale: “Títí dé” túmọ̀ ἄχρι, “gan-an” sì gbé ìtẹnumọ́ καί jáde láì mú kí ọ̀rọ̀ di líle.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: pẹ̀lú ìhìn rere
  rationale: Ní àyíká yìí, ἐν lè tọ́ka sí ohun tí wọ́n mú wá tàbí ọ̀nà iṣẹ́ wọn; “pẹ̀lú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ipa yan ìtumọ̀ irinṣẹ́ nìkan.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́, dípò kí ó dà bí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ τοῦ Χριστοῦ
  choice: ìhìn rere Mèsáyà
  alternative: ìhìn rere Kristi
  rationale: “Mèsáyà” jẹ́ oyè tó bá Χριστός mu ní àyíká yìí. Ìṣọ̀kan Yorùbá náà kò fi tipátipá pinnu bóyá ìhìn rere náà jẹ́ ti Mèsáyà tàbí pé ó jẹ́ nípa Mèsáyà.
- issue: Ìbáṣepọ̀ ἐν pẹ̀lú εὐαγγελίῳ
  choice: pẹ̀lú ìhìn rere
  alternative: nínú iṣẹ́ ìhìn rere
  rationale: “Pẹ̀lú” fi hàn pé ìhìn rere ni wọ́n mú dé ọ̀dọ̀ wọn, láì pa àyè ìtumọ̀ pé iṣẹ́ wọn wà nínú àgbègbè ìhìn rere mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ó ní ìyì ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. Àmì ìdádúró gígùn ní òpin pa ìṣàn ọ̀rọ̀ mọ́ sí ẹsẹ tó tẹ̀ lé e.
