id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: yo
  text: Ṣùgbọ́n àwa kì yóò ṣògo kọjá ìwọ̀n, bí kò ṣe ní ìbámu pẹ̀lú ìwọ̀n àgbègbè iṣẹ́[a] tí Ọlọ́run pín fún wa—ìwọ̀n tí ó dé àní ọ̀dọ̀ yín—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ààlà” tàbí “ìlànà ìdíwọ̀n”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀pá ìdíwọ̀n, ìlànà, tàbí àgbègbè tí a pín fún ẹnì kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: kọjá ìwọ̀n
  rationale: Ó fi èrò líla ààlà tàbí ìwọ̀n tí ó yẹ hàn, ó sì pa àwòrán ìwọ̀n inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καυχησόμεθα
  choice: a kì yóò ṣògo
  rationale: “Ṣògo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ohun tí ẹni ṣe tàbí ẹ̀tọ́ ẹni yangàn nínú àyíká ọ̀rọ̀ yìí.
- source_word: κατὰ τὸ μέτρον
  choice: ní ìbámu pẹ̀lú ìwọ̀n
  rationale: Ó túmọ̀ ìṣe ní ìbámu pẹ̀lú ìwọ̀n tàbí ààlà tí a yàn, ó sì dá àtúnlò μέτρον sí.
- source_word: κανόνος
  choice: àgbègbè iṣẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tàbí pápá iṣẹ́ tí a pín fún Pọ́ọ̀lù, kì í ṣe òfin ìwà ní pàtàkì.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: tí Ọlọ́run pín fún wa
  rationale: “Pín fún” sọ ìpín tàbí ìyàn tí Ọlọ́run ṣe ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: μέτρου
  choice: ìwọ̀n
  rationale: Ó pa àtúnlò ọ̀rọ̀ μέτρον mọ́, ó sì ṣàlàyé àgbègbè iṣẹ́ náà gẹ́gẹ́ bí ìwọ̀n tí a yàn.
- source_word: ἐφικέσθαι
  choice: tí ó dé
  rationale: Ó fi bí ìwọ̀n àgbègbè náà ṣe nà tó hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ἄχρι καὶ ὑμῶν
  choice: àní ọ̀dọ̀ yín
  rationale: “Àní” pa ìtẹnumọ́ καί mọ́, “ọ̀dọ̀ yín” sì fi ibi tí àgbègbè náà dé hàn.
theological_decisions:
- issue: Ìtumọ̀ κανών nínú ọ̀rọ̀ Pọ́ọ̀lù nípa iṣẹ́ rẹ̀
  choice: Àgbègbè iṣẹ́ tí Ọlọ́run pín fún un, tí ó sì kan àwọn ará Kọ́ríńtì
  alternative: Òfin tàbí àmì ìdíwọ̀n tí Pọ́ọ̀lù fi ń díwọ̀n ìṣògo rẹ̀
  rationale: Àyíká ọ̀rọ̀ náà tẹnumọ́ ìwọ̀n, ìpín, àti ibi tí iṣẹ́ náà dé. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé dá àwọn ìtumọ̀ “ọ̀pá ìdíwọ̀n,” “ìlànà,” àti “ààlà” sí láì fòpin sí àìdánilójú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. “Àgbègbè iṣẹ́” jẹ́ kedere sí òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa fífẹ̀ ìtumọ̀ κανών mọ́. Àmì gígùn ní òpin ń fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
