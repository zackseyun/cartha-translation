  yaml_path: translation/nt/2_corinthians/010/009.yaml
  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: yo
  text: kí n má bàa dà bí ẹni pé mo ń fi àwọn lẹ́tà náà dẹ́rù bà yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹni pé mo ń fi àwọn lẹ́tà náà halẹ̀ mọ́ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: kí n má bàa
  rationale: Ó mú ète tàbí àbájáde tí ó so mọ́ ọ̀rọ̀ tó ṣáájú jáde, ó sì pa ìkọ̀ ἵνα pẹ̀lú subjunctive mọ́ ní Yorùbá àdánidá.
- source_word: δόξω
  choice: dà bí ẹni pé
  rationale: Níbí, δοκέω túmọ̀ sí ‘farahàn’ tàbí ‘dà bí,’ kì í ṣe ‘rò.’ Ọ̀rọ̀ yìí mú ìtumọ̀ ìfarahàn náà jáde lọ́nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ὡς ἂν
  choice: bí ẹni pé
  rationale: Ó fi ìfiwéra tàbí bí ohun kan ṣe dà hàn láì sọ pé ohun náà dájú; ‘bí ẹni pé’ pa ìṣiyèméjì inú gbólóhùn Gíríìkì mọ́.
- source_word: ἐκφοβεῖν
  choice: dẹ́rù bà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí mímú kí ẹ̀rù ba ẹnì kan. ‘Dẹ́rù bà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lágbára, láì gbé e ga dé ‘mú ẹ̀rù ńláǹlà bà.’
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ẹni kejì ni, ó sì jẹ́ ẹni tí ìṣe ἐκφοβεῖν kan.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: fi àwọn lẹ́tà náà
  rationale: διά pẹ̀lú genitive ń fi ohun èlò tàbí ọ̀nà hàn. ‘Fi’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí; ‘àwọn ... náà’ tún pa definite article inú Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. A pa àdámọ̀ gbólóhùn tó ń tẹ̀ lé ọ̀rọ̀ ṣáájú mọ́, gẹ́gẹ́ bí ἵνα ṣe bẹ̀rẹ̀ ẹsẹ yìí. ‘Àwọn lẹ́tà náà’ tẹ̀ lé article Gíríìkì dípò ṣíṣe ‘ti mo kọ’ sí kedere nínú àkọ́kọ́.
