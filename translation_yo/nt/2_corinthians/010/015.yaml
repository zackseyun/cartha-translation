  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: Pọ́ọ̀lù kò fẹ́ fọ́nnu lórí làálàá àwọn ẹlòmíràn, ó sì ní ìrètí ìfẹ̀síwájú. Síbẹ̀, “iṣẹ́ wa yóò túbọ̀ gbilẹ̀” sọ μεγαλυνθῆναι di ìsọtẹ́lẹ̀ ìṣe ọjọ́ iwájú, ó sì rọ́pò kókó-ọrọ̀ “àwa” pẹ̀lú “iṣẹ́ wa.” Àtúnṣe náà pa ìbáṣepọ̀ rẹ̀ pẹ̀lú “a ní ìrètí” àti àìdánilójú ìtumọ̀ ọ̀rọ̀ náà mọ́ dáadáa.'
