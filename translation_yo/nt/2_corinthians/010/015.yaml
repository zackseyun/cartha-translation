source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: yo
  text: A kò ń fọ́nnu kọjá ìwọ̀n nínú làálàá àwọn ẹlòmíràn. Ṣùgbọ́n a ní ìrètí pé, bí ìgbàgbọ́ yín ṣe ń dàgbà láàárín yín, kí a lè túbọ̀ gbilẹ̀ ní ìbámu pẹ̀lú ààyè iṣẹ́ wa[a][b], sí ìwọ̀n tí ó pọ̀ sí i[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìbámu pẹ̀lú ìwọ̀n tí a pín fún wa” tàbí “ní ìbámu pẹ̀lú ìlànà wa.” Ọ̀rọ̀ Gíríìkì κανών níbí ń tọ́ka sí pápá tàbí ààyè iṣẹ́ tí a wọn, tí a sì pín fún ẹnì kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a lè di ẹni tí a gbé ga” tàbí “kí a lè túbọ̀ pọ̀ sí i.” Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí èrò náà jẹ́ ìfẹ̀síwájú iṣẹ́ aposteli Pọ́ọ̀lù, kì í ṣe ìyìn ara rẹ̀ lásán. Gbólóhùn náà tún lè jẹ́, “bí ìgbàgbọ́ yín ṣe ń dàgbà, kí a lè túbọ̀ gbilẹ̀ láàárín yín.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “sí ìwọ̀n tí ó pọ̀ gidigidi” tàbí “fún ìfẹ̀síwájú síwájú sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Kì í ṣe pé a ń fọ́nnu kọjá ààlà
  rationale: Èyí fi àwòrán ohun tí ó ní ìwọ̀n tàbí ààlà hàn, ó sì sọ ní Yorùbá àdánidá pé Pọ́ọ̀lù kò gba ẹ̀tọ́ láti fọ́nnu níta ààyè tí ó yẹ.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: nípa làálàá àwọn ẹlòmíràn
  rationale: κόπος túmọ̀ sí iṣẹ́ àṣekára tàbí làálàá; gbólóhùn náà túmọ̀ sí pé Pọ́ọ̀lù kò ka iṣẹ́ tí àwọn ẹlòmíràn ṣe sí ògo tirẹ̀.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Kàkà bẹ́ẹ̀, a ní ìrètí pé
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀-orúkọ ἐλπίδα mọ́ nípasẹ̀ ‘ní ìrètí,’ ó sì fi ìyàtọ̀ δέ hàn lọ́nà àdánidá.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: bí ìgbàgbọ́ yín ti ń dàgbà
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tí ó yẹ fún πίστις níbí; ‘ń dàgbà’ fi ìṣe tí ó ń bá a lọ hàn.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Àṣàyàn yìí mú kí ọ̀rọ̀ náà tọ́ka sí ìgbàgbọ́ tí ń dàgbà nínú àwùjọ àwọn ará Kọ́ríńtì, láì dá a mọ́ ẹnì kọ̀ọ̀kan nìkan.
- source_word: μεγαλυνθῆναι
  choice: iṣẹ́ wa yóò túbọ̀ gbilẹ̀
  rationale: Ọ̀rọ̀ náà ní ìpilẹ̀ṣẹ̀ túmọ̀ sí mímú ohun kan tóbi tàbí fífẹ̀ sí i. Ní àyíká ọ̀rọ̀ yìí, ohun tí ń fẹ̀ sí i ni iṣẹ́ aposteli Pọ́ọ̀lù, kì í ṣe ìgbéraga ara ẹni.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: ní ìbámu pẹ̀lú ààyè iṣẹ́ tí a yàn fún wa
  rationale: κανών ní àyíká yìí tọ́ka sí ààlà tàbí pápá iṣẹ́ tí a pín fún Pọ́ọ̀lù, kì í ṣe ‘kánónì’ ní ìtumọ̀ ẹ̀kọ́ ìsìn tó wáyé lẹ́yìn náà.
- source_word: εἰς περισσείαν
  choice: dé ìwọ̀n tí ó pọ̀ gidigidi
  rationale: ‘Dé’ pa agbára ìtọ́sọ́nà εἰς mọ́, ‘tí ó pọ̀ gidigidi’ sì sọ ìlọsíwájú dé ọ̀pọ̀lọpọ̀ tàbí ìfẹ̀síwájú hàn.
theological_decisions:
- issue: Ìtumọ̀ μεγαλυνθῆναι ní ìbáṣepọ̀ pẹ̀lú àṣẹ aposteli
  choice: A sọ ọ́ nípa bí iṣẹ́ aposteli Pọ́ọ̀lù yóò ṣe túbọ̀ gbilẹ̀, kì í ṣe bí a ó ṣe yin Pọ́ọ̀lù fúnra rẹ̀ ga.
  alternative: Ó lè túmọ̀ sí pé àwọn ará Kọ́ríńtì yóò gbé Pọ́ọ̀lù ga tàbí pé òkìkí rẹ̀ yóò pọ̀ sí i.
  rationale: Àwọn ẹsẹ tó yí i ká ń sọ nípa pápá iṣẹ́ tí Ọlọ́run pín àti nípa àìfọ́nnu nínú iṣẹ́ ẹlòmíràn; nítorí náà, ìfẹ̀síwájú iṣẹ́ ni àkòrí pàtàkì.
- issue: Ìtumọ̀ κανών
  choice: ààyè iṣẹ́ tí a yàn fún wa
  alternative: òfin, ìlànà, tàbí ìwọ̀n tí a pín fún wa
  rationale: Ní 2 Kọ́ríńtì 10:13–16, ọ̀rọ̀ náà jẹ́ àwòrán pápá iṣẹ́ tí a wọn tàbí pín fún aposteli; ìtumọ̀ yìí yẹra fún ìtumọ̀ anákírónísítíkì ti ‘kánónì.’
- issue: Ohun tí ἐν ὑμῖν ń bá mu
  choice: A so ó mọ́ bí ìgbàgbọ́ àwọn ará Kọ́ríńtì ṣe ń dàgbà láàárín wọn.
  alternative: 'A lè so ó mọ́ μεγαλυνθῆναι: ‘kí a lè gbilẹ̀ láàárín yín.’'
  rationale: Ìtòsí rẹ̀ sí ‘ìgbàgbọ́ yín’ mú àṣàyàn inú ọ̀rọ̀ àkọ́kọ́ ṣeé ṣe gan-an, ṣùgbọ́n ìṣètò Gíríìkì lè gba àṣàyàn kejì náà; àlàyé ìsàlẹ̀ ojú ewé pa àìdánilójú gírámà náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘a’ gẹ́gẹ́ bí arọ́pò-orúkọ Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀, ‘làálàá’ fún iṣẹ́ àṣekára, àti ‘ààyè iṣẹ́’ láti yà κανών kúrò nínú ìtumọ̀ ‘kánónì’ ti ẹ̀kọ́ ìsìn.
