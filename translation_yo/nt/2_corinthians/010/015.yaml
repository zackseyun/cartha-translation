revisions:
- from: Kì í ṣe pé a ń fọ́nnu kọjá ààlà nípa làálàá àwọn ẹlòmíràn. Kàkà bẹ́ẹ̀, a ní ìrètí pé bí ìgbàgbọ́ yín ti ń dàgbà láàárín yín, iṣẹ́ wa yóò túbọ̀ gbilẹ̀ ní ìbámu pẹ̀lú ààyè iṣẹ́ tí a yàn fún wa[a], dé ìwọ̀n tí ó pọ̀ gidigidi[b][c].
  to: A kò ń fọ́nnu kọjá ìwọ̀n nínú làálàá àwọn ẹlòmíràn. Ṣùgbọ́n a ní ìrètí pé, bí ìgbàgbọ́ yín ṣe ń dàgbà láàárín yín, kí a lè túbọ̀ gbilẹ̀ ní ìbámu pẹ̀lú ààyè iṣẹ́ wa[a][b], sí ìwọ̀n tí ó pọ̀ sí i[c].
  rationale: A tún ìṣètò gbolóhùn náà ṣe kí “a ní ìrètí” lè darí “kí a lè túbọ̀ gbilẹ̀,” gẹ́gẹ́ bí ἐλπίδα ... μεγαλυνθῆναι. A yọ ìtumọ̀ tí ó sọ ìṣe náà di ti “iṣẹ́ wa” àti ìṣe ọjọ́ iwájú kúrò nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n a fi ìtumọ̀ àyíká yẹn sílẹ̀ nínú àlàyé. A tún mú εἰς περισσείαν sun mọ́ “sí ìwọ̀n tí ó pọ̀ sí i.”
