id: 2CO.10.1
reference: 2 Corinthians 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: yo
  text: Èmi fúnra mi, Pọ́ọ̀lù, ń bẹ̀ yín nípasẹ̀ ìrẹ̀lẹ̀ àti ìwà pẹ̀lẹ́ Mèsáyà—èmi ẹni tí mo jẹ́ onírẹ̀lẹ̀ níwájú yín,[b][c] ṣùgbọ́n tí mo ní ìgboyà sí yín nígbà tí mi ò sí lọ́dọ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Onírẹ̀lẹ̀” lè jẹ́ ọ̀nà ẹ̀gàn tí Pọ́ọ̀lù fi ń tún bí àwọn kan ṣe ṣàpèjúwe rẹ̀ nígbà tí ó wà níwájú wọn sọ; ó tún lè túmọ̀ sí “ẹni rírẹ̀lẹ̀,” tàbí, ní ìtumọ̀ tó túbọ̀ ṣàlàyé, “ẹlẹ́rù.”
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “gẹ́gẹ́ bí ojú”; ìyẹn ni, “ní ojú ara” tàbí “lójúkojú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Èmi Pọ́ọ̀lù fúnra mi
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá. A kò fi δέ hàn gẹ́gẹ́ bí ìtakora tó lágbára nítorí pé ó lè kan jẹ́ àmì ìyípadà ọ̀rọ̀.
- source_word: παρακαλῶ ὑμᾶς
  choice: ń ... bẹ̀ yín
  rationale: “Bẹ̀ yín” fi ẹ̀bẹ̀ ti ara ẹni àti ti tọkàntọkàn hàn, dípò àṣẹ líle.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: fi ìrẹ̀lẹ̀ àti ìwà tútù ... bẹ̀ yín
  rationale: “Fi ... bẹ̀” mú ipa διά pẹ̀lú genitive jáde gẹ́gẹ́ bí ohun tí ẹ̀bẹ̀ náà gbára lé; “ìrẹ̀lẹ̀” àti “ìwà tútù” yà àwọn ànímọ́ méjèèjì sọ́tọ̀ láì sọ wọ́n di ọ̀kan.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ bí oyè níbí; “Mèsáyà” tú ìtumọ̀ oyè náà jáde dípò lílo àkọsílẹ̀-ohùn “Kristi.”
- source_word: κατὰ πρόσωπον
  choice: nígbà tí mo bá wà lójúkojú láàárín yín
  rationale: Ó fi ìtumọ̀ ìfihàn ara ẹni ní ojú ara hàn, ó sì pa àwòrán “ojúkojú” mọ́ ní ìyàtọ̀ sí àìsí.
- source_word: ταπεινὸς
  choice: onírẹ̀lẹ̀
  rationale: Ó pa ìtumọ̀ ìrẹ̀lẹ̀ tàbí ipò rírẹlẹ̀ mọ́, láì pinnu bóyá Pọ́ọ̀lù ń sọ ara rẹ̀ tàbí ó ń tún ẹ̀sùn àwọn míì sọ ní ọ̀nà ẹ̀gàn.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: ṣùgbọ́n tí mo ní ìgboyà sí yín nígbà tí n kò sí níbẹ̀
  rationale: Ó pa ìtakora tó wà láàárín wíwà níwájú wọn àti àìsí mọ́; “sí yín” kò fi ìṣọ̀tá tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká yìí, nítorí náà a tú ìtumọ̀ oyè náà jáde, láì mú un bí orúkọ lásán.
- issue: Ohùn ọ̀rọ̀ “ταπεινὸς” nínú àpèjúwe Pọ́ọ̀lù
  choice: onírẹ̀lẹ̀, pẹ̀lú àlàyé pé ó lè jẹ́ ẹ̀sùn tí a ń tún sọ
  alternative: ẹlẹ́rù tàbí ẹni tí kò níyì
  rationale: Gíríìkì kò fi àmì àsọyé tààrà sí i. Ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀gàn tó ṣeé ṣe mọ́, dípò kí ó yan ìtumọ̀ odi tàbí rere patapata.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A yan “Mèsáyà” fún oyè Χριστός. Àwọn àmì àlàyé [b] àti [c] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé; kò sí [a] nítorí àlàyé Gẹ̀ẹ́sì fún [a] kò bá àmì tó wà nínú ọ̀rọ̀ pàtàkì mu, ó sì dà bí àṣìṣe ìṣètò.
