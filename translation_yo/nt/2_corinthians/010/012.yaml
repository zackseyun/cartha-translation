id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: yo
  text: Nítorí a kò gbójúgbóyà láti ka ara wa sí ọ̀kan lára àwọn tí ń yin ara wọn, tàbí láti fi ara wa wé àwọn kan nínú wọn[a]. Ṣùgbọ́n nígbà tí àwọn fúnra wọn bá ń fi ara wọn wọ̀n ara wọn, tí wọ́n sì ń fi ara wọn wé ara wọn[b], òye kò yé wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “ka ara wa sí ọ̀kan lára wọn” tàbí “fi ara wa sí ipò kan náà pẹ̀lú wọn”; ọ̀rọ̀ Gíríìkì náà ní èrò fífi ẹni sínú ẹ̀ka kan náà pẹ̀lú àwọn ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “wọ́n ń wọ̀n ara wọn nínú ara wọn, wọ́n sì ń fi ara wọn wé ara wọn.” Ìtumọ̀ rẹ̀ ni pé àwọn fúnra wọn ni wọ́n fi ṣe òṣùwọ̀n fún ara wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: a kò gbójúgbóyà
  rationale: Ó fi ìkọ̀ láti ṣe ohun tí ó dà bí ìgbéraga hàn, ó sì pa ìró ẹ̀gàn Pọ́ọ̀lù mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: ἐγκρῖναι
  choice: láti ka ara wa mọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ẹni sínú ẹ̀ka tàbí ipò kan pẹ̀lú àwọn ẹlòmíràn, kì í ṣe dídájọ́ ìwà lásán.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: láti fi ara wa wé / ń fi ara wọn wé
  rationale: “Fi ... wé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìfiwéra, ó sì pa àsọtúnsọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: ara wa ... àwọn kan lára àwọn tí ń yin ara wọn
  rationale: συνιστάνω níbí ń tọ́ka sí yíyin tàbí gbígbé ara ẹni ga; ìṣètò afẹ̀yìntì náà fi hàn pé àwọn náà ni wọ́n ń yin ara wọn.
- source_word: ἀλλὰ αὐτοὶ
  choice: Ṣùgbọ́n nígbà tí àwọn fúnra wọn
  rationale: “Àwọn fúnra wọn” pa ìtẹnumọ́ αὐτοὶ àti ìyàtọ̀ láàárín Pọ́ọ̀lù àti àwọn olùyin-ara-wọn mọ́.
- source_word: ἐν ἑαυτοῖς
  choice: ń fi ara wọn wọ̀n ara wọn
  rationale: Ìtumọ̀ gbolohun náà lè jẹ́ “nínú/àárín ara wọn”; àtúmọ̀ yìí jẹ́ kí ìlò ara wọn gẹ́gẹ́ bí òṣùwọ̀n hàn, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
- source_word: μετροῦντες
  choice: ń ... wọ̀n
  rationale: “Wọ̀n” pa àwòrán òṣùwọ̀n inú μετρέω mọ́, dípò yíyí i padà sí “ṣe àyẹ̀wò” lásán.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: ara wọn wé ara wọn
  rationale: Àtúnsọ àwọn ọ̀rọ̀ afẹ̀yìntì jẹ́ pàtàkì sí àríwísí Pọ́ọ̀lù, nítorí náà a pa á mọ́ ní Yorùbá.
- source_word: οὐ συνιᾶσιν
  choice: òye kò yé wọn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá, tó ní iyì, fún pé wọn kò lóye ohun tí wọ́n ń ṣe.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán “wọ̀n,” àsọtúnsọ “ara wọn,” àti ìró ẹ̀gàn inú ọ̀rọ̀ Pọ́ọ̀lù mọ́; gbogbo àmì ohùn ni a lò níbi tí ó bá yẹ.
