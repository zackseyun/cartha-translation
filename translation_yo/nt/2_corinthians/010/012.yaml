  to: Nítorí a kò gbójúgbóyà láti ka ara wa sí ọ̀kan lára àwọn tí ń yin ara wọn, tàbí láti fi ara wa wé àwọn kan nínú wọn[a]. Ṣùgbọ́n nígbà tí àwọn fúnra wọn bá ń fi ara wọn wọ̀n ara wọn, tí wọ́n sì ń fi ara wọn wé ara wọn[b], òye kò yé wọn.
