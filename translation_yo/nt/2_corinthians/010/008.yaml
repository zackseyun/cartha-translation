id: 2CO.10.8
reference: 2 Corinthians 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: yo
  text: Nítorí bí mo bá tilẹ̀ fọ́nnu díẹ̀ sí i nípa àṣẹ wa, èyí tí Olúwa fi fún wa láti gbé yín ró, kì í ṣe láti wó yín lulẹ̀,[a] ojú kì yóò tì mí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe fún ìparun yín.” Ọ̀rọ̀ Gíríìkì náà ṣe ìtakora láàárín gbígbé ilé ró àti wíwó o lulẹ̀; ọ̀rọ̀ inú ẹsẹ̀ pa àwòrán ìkọ́lé náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kì yóò fi mí sí ìtìjú.” Fọ́ọ̀mù ọ̀rọ̀ Gíríìkì lè tẹnumọ́ ìtìjú tí ẹlòmíràn mú bá ẹni; “ojú kì yóò tì mí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún lè sọ ìtumọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Nítorí bí mo tilẹ̀
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “bí” sì ṣàfihàn gbólóhùn oníṣòro ἐάν; “tilẹ̀” mú ìtumọ̀ tẹnumọ́ τε wọ inú Yorùbá àdánidá.
- source_word: περισσότερόν τι
  choice: díẹ̀ sí i
  rationale: Ó pa ìfiwéra ‘sí i’ àti ìrọ̀rùn àìdánilójú τι mọ́, láì sọ pé ìfọ́nnu náà pọ̀ gan-an.
- source_word: καυχήσωμαι
  choice: mo ... ń fọ́nnu
  rationale: Nínú gbólóhùn ‘bí ... tilẹ̀,’ ọ̀rọ̀ yìí ń sọ ohun tí a gbà pé ó lè ṣẹlẹ̀; ‘fọ́nnu’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún καυχάομαι nínú àyíká yìí.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: nípa àṣẹ wa
  rationale: “Àṣẹ” túmọ̀ sí ẹ̀tọ́ tàbí agbára tí a fi lé ẹni lọ́wọ́, kì í ṣe okun lásán.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: èyí tí Olúwa fi fún wa
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí ‘àṣẹ’; “fi fún wa” sọ pé Olúwa ni orísun àṣẹ náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εἰς οἰκοδομὴν
  choice: láti gbé yín ró
  rationale: “Gbé ... ró” pa àwòrán iṣẹ́ ìkọ́lé οἰκοδομή mọ́, ó sì sọ ẹni tí iṣẹ́ náà ń kan ní kedere gẹ́gẹ́ bí àyíká ṣe fi hàn.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: kì í ṣe láti wó yín lulẹ̀
  rationale: 'Ó pa ìtakora àwòrán ìkọ́lé mọ́: gbígbé ró ní òdì kejì sí wíwó lulẹ̀, dípò lílo ọ̀rọ̀ tó lè túmọ̀ sí ìparun pátápátá nìkan.'
- source_word: οὐκ αἰσχυνθήσομαι
  choice: ojú kì yóò tì mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìfọ́nnu Pọ́ọ̀lù kì yóò yọrí sí ìtìjú; fọ́ọ̀mù Gíríìkì tún lè ṣe àfihàn pé a ó ‘fi í sí ìtìjú,’ èyí tí àlàyé ẹsẹ̀ sọ.
theological_decisions:
- issue: Ìwà àti ète àṣẹ aposteli
  choice: Àṣẹ Pọ́ọ̀lù wá láti ọ̀dọ̀ Olúwa, ète rẹ̀ sì ni láti mú kí àwọn ará Kọ́ríńtì dúró ṣinṣin, kì í ṣe láti pa wọ́n run.
  alternative: Kí a ka àṣẹ náà sí ohun tí ète rẹ̀ jẹ́ ìbáwí tí ń pa ènìyàn run.
  rationale: Ìtakora tó wà láàárín οἰκοδομή àti καθαίρεσις fi hàn pé àṣẹ náà jẹ́ fún ìgbéga wọn, bí ó tilẹ̀ jẹ́ pé Pọ́ọ̀lù lè lò ó pẹ̀lú ìmúrasílẹ̀ àti ìdúróṣinṣin.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. “Gbé yín ró / wó yín lulẹ̀” pa àwòrán ìkọ́lé méjèèjì mọ́; “ojú kì yóò tì mí” jẹ́ àṣà-ọrọ Yorùbá tó ṣe kedere fún ìtìjú láì sọ ìtumọ̀ Gíríìkì di ti inú ọkàn nìkan.
