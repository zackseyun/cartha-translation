review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tọ́ka sí gbogbo àwọn èrò pàtàkì inú Gíríìkì: ìdí ìṣàlàyé, ìpò-ṣàníyàn, ìfọ́nnu nípa àṣẹ tí Olúwa fi fún wọn, ète ìgbẹ́kẹ̀lé wọn, àti àìní ìtìjú. Ṣùgbọ́n “bí mo tilẹ̀ ń fọ́nnu” fi hàn bí ìṣe tí ń lọ lọwọlọwọ, dípò ìṣe àfojúsùn/oníṣòro tí aorist subjunctive καυχήσωμαι ń gbé kalẹ̀.'
  naturalness: “Ojú kì yóò tì mí,” “gbé yín ró,” àti “wó yín lulẹ̀” jẹ́ Yorùbá boṣewa, adayeba, tí ó sì yẹ fún ìforúkọsílẹ̀ aposteli. Fífi “bá” sí gbólóhùn oníṣòro náà mú un dára sí i, ó sì dá ìtumọ̀ Gíríìkì lójú.
  terminology: “Àṣẹ” yẹ fún ἐξουσία, “Olúwa” yẹ fún κύριος, “gbé yín ró” pa àwòrán οἰκοδομή mọ́, “wó yín lulẹ̀” sì dáhùn sí καθαίρεσις. Àwọn àlàyé ẹsẹ̀ mejeeji bá àwọn yíyàn ìtumọ̀ wọ̀nyí mu.
  issues:
  - severity: medium
    issue: Ìṣe oníṣòro καυχήσωμαι ni a túmọ̀ sí “mo tilẹ̀ ń fọ́nnu.”
    rationale: 'Àmì “ń” ń fi ìṣe tí ń lọ hàn; nígbà tí ἐάν pẹlu aorist subjunctive ń sọ ìṣe tí ó lè ṣẹlẹ̀: “bí mo bá tilẹ̀ fọ́nnu.” Ìtúnṣe náà pa ìpò-ṣàníyàn àti ojú ọjọ́ iwájú ìjíròrò Pọ́ọ̀lù mọ́.'
