  to: Ṣùgbọ́n mo bẹ̀ yín pé, nígbà tí mo bá wà pẹ̀lú yín, kí n má bàa ní láti fi ìgboyà hàn pẹ̀lú ìdánilójú tí mo rò pé mo lè fi gbójú láti dojú kọ àwọn kan tí wọ́n rò pé àwa ń rìn gẹ́gẹ́ bí ti ara[a].
