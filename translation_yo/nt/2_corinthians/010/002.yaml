reference: 2 Corinthians 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: yo
  text: Ṣùgbọ́n mo bẹ̀ yín pé, nígbà tí mo bá wà pẹ̀lú yín, kí n má bàa ní láti fi ìgboyà hàn pẹ̀lú ìdánilójú tí mo rò pé mo lè fi gbójú láti dojú kọ àwọn kan tí wọ́n rò pé àwa ń rìn gẹ́gẹ́ bí ti ara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ẹni pé a ń gbé ìgbésí ayé ní ìbámu pẹ̀lú ìlànà ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέομαι
  choice: mo bẹ̀ yín
  rationale: Ọ̀rọ̀ náà jẹ́ ẹ̀bẹ̀ àtọkànwá tí ó lágbára ju bíbéèrè lásán lọ; fífi “yín” kún un mú olùgbà ẹ̀bẹ̀ tí àyíká ọ̀rọ̀ ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: nígbà tí mo bá wà pẹ̀lú yín, kí ó má ṣe di dandan fún mi láti fi ìgboyà hàn
  rationale: Èyí sọ ohun tí Paulu ń bẹ̀ fún ní Yorùbá àdánidá, ó sì jẹ́ kí ìdí tí kò fẹ́ kí ó ṣẹlẹ̀—pé ó lè di dandan fún un láti ṣe bẹ́ẹ̀—hàn láìṣe àlàyé ju ti orísun lọ.
- source_word: παρὼν
  choice: nígbà tí mo bá wà pẹ̀lú yín
  rationale: Nínú ìyàtọ̀ sí jíjìnnà rẹ̀ nínú àyíká ẹsẹ̀ náà, èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún wíwà níbẹ̀ lọ́dọ̀ wọn.
- source_word: θαρρῆσαι
  choice: láti fi ìgboyà hàn
  rationale: Ó tọ́ka sí fífi ìgboyà àti ìdúró ṣinṣin hàn sí àwọn alátakò, kì í ṣe ìmọ̀lára ìgboyà nìkan.
- source_word: τῇ πεποιθήσει
  choice: pẹ̀lú ìgbẹ́kẹ̀lé
  rationale: πεποίθησις túmọ̀ sí ìgbẹ́kẹ̀lé tàbí ìdánilójú; “pẹ̀lú” pa ipa dátífù náà mọ́ gẹ́gẹ́ bí ohun tí ìgboyà rẹ̀ bá rìn.
- source_word: ᾗ λογίζομαι
  choice: tí mo rò pé
  rationale: λογίζομαι níbí ń sọ ìrònú tàbí ìpinnu tí a ti gbé yẹ̀ wò; “mo rò pé” jẹ́ Yorùbá àdánidá tí kò fi ìdánilójú tó pọ̀ ju orísun lọ.
- source_word: τολμῆσαι ἐπί τινας
  choice: èmi yóò fi dojú kọ àwọn kan
  rationale: “Dojú kọ” mú ìdarí ìgbésẹ̀ sí àwọn ènìyàn kan àti agbára ìtakora ἐπί τινας hàn, láì sọ irú ìjìyà tàbí ìṣe pàtó tí orísun kò sọ.
- source_word: τοὺς λογιζομένους
  choice: tí wọ́n rò pé
  rationale: Partisípọ̀ náà ń sọ ìdájọ́ tí àwọn alatako ṣe nípa Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Èyí pa àwòrán àti àìdánilójú ọ̀rọ̀ Paulu mọ́, dípò kí a túmọ̀ rẹ̀ ní pàtó sí ìwà ẹlẹ́ṣẹ̀ tàbí ìlànà ènìyàn nìkan.
- source_word: περιπατοῦντας
  choice: ń rìn
  rationale: Ó pa àkàwé Paulu fún ìgbésí ayé àti ìwà híhù mọ́, ó sì jẹ́ ọ̀rọ̀ tí ó ṣeé lóye ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú κατὰ σάρκα
  choice: nípa ti ara
  alternative: gẹ́gẹ́ bí ìlànà ènìyàn
  rationale: “Nípa ti ara” pa ìtumọ̀ ọ̀rọ̀ Paulu tí ó lè kan ailera ènìyàn, ojú ìwòye ayé, tàbí ìwà tí kì í ṣe ti Ẹ̀mí mọ́. Yíyàn “ẹ̀dá ẹlẹ́ṣẹ̀” yóò mú ẹ̀sùn náà le ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ fi dandan sọ lọ; àlàyé ẹsẹ̀ ìsàlẹ̀ pèsè ọ̀nà ìtumọ̀ àdánidá míì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìtakora δέ, ìtẹnumọ́ ẹ̀bẹ̀, àti àìdánilójú ọ̀rọ̀ “ara” mọ́, ṣùgbọ́n a ṣètò rẹ̀ ní ọ̀nà tí ó ṣàn déédéé fún òǹkàwé Yorùbá.
