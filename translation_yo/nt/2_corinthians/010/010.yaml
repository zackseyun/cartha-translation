  source_fidelity: Ìtumọ̀ náà tọ́ka ọ̀rọ̀ náà sí àríwísí tí a ròyìn, ó sì pa ìyàtọ̀ láàárín lẹ́tà, ìwà ní ti ara, àti ọ̀rọ̀ ẹnu mọ́. Síbẹ̀, “ní ìwọ̀n” kì í ṣàfihàn βαρεῖαι dáadáa ní Yorùbá; ó sábà túmọ̀ sí ‘ní ìdíwọ̀n’ dípò ‘wúwo’ ní ìtumọ̀ àfiwé. Pẹ̀lú èyí, “pẹ̀lú wa” jẹ́ àfikún tí kò sí nínú Gíríìkì.
  naturalness: Àwọn apá púpọ̀ jẹ́ Yorùbá boṣewa tó ṣeé lóye. “Àwọn lẹ́tà rẹ̀ wúwo, wọ́n sì lágbára” jẹ́ àdánidá, ó sì sún mọ́ àwòrán Gíríìkì. “Ìwà ní ti ara rẹ̀” ń sọ παρουσία τοῦ σώματος ní kedere láìfi ‘pẹ̀lú wa’ kún un. “A sì kẹ́gàn ọ̀rọ̀ ẹnu rẹ̀” jẹ́ ọ̀nà adayeba fún participle tí ó fi ìtìjú/títẹ́nilẹ́gbẹ̀ hàn.
  terminology: A pa ‘lẹ́tà,’ ‘lágbára,’ àti ‘ọ̀rọ̀ ẹnu’ mọ́. A rọ́pò “ní ìwọ̀n” pẹ̀lú “wúwo” fún βαρεῖαι, a sì tún akọ̀sílẹ̀ [b] kọ́ nítorí “kò lẹ́yìn” kì í jẹ́ àṣàyàn tó pé fún ἐξουθενημένος.
