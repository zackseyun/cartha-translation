id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: yo
  text: Nítorí wọ́n ń sọ pé,[a] “Àwọn lẹ́tà rẹ̀ wúwo, wọ́n sì lágbára, ṣùgbọ́n ìwà ní ti ara rẹ̀ kò lágbára, a sì kẹ́gàn ọ̀rọ̀ ẹnu rẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí, ó ń sọ pé, ‘Àwọn lẹ́tà náà wúwo, wọ́n sì lágbára…’” Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ‘ó ń sọ,’ ṣùgbọ́n ó lè jẹ́ ọ̀nà láti ròyìn àríwísí tí àwọn ènìyàn ń sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ka ọ̀rọ̀ ẹnu rẹ̀ sí asán,” tàbí “ọ̀rọ̀ ẹnu rẹ̀ jẹ́ ohun ẹ̀gàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé, bí ó ti rí nínú àyíká ọ̀rọ̀ náà.
- source_word: ἐπιστολαὶ
  choice: àwọn lẹ́tà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún ìwé tí a kọ ránṣẹ́, láìfi ìtumọ̀ ṣọ́ọ̀ṣì kún un.
- source_word: μέν ... δὲ
  choice: … ṣùgbọ́n …
  rationale: Ó mú ìyàtọ̀ tó wà láàárín agbára àwọn lẹ́tà àti bí Pọ́ọ̀lù ṣe farahàn ní ojú wọn hàn ní Yorùbá àdánidá.
- source_word: φησίν
  choice: wọ́n ń sọ pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ó lè jẹ́ ọ̀nà ìtọ́kasí ọ̀rọ̀ ẹnì kan tàbí èrò ẹgbẹ́ kan; àyíká ọ̀rọ̀ ń tọ́ka sí àríwísí àwọn alátakò Pọ́ọ̀lù.
- source_word: βαρεῖαι
  choice: ní ìwọ̀n
  rationale: Ó pa àwòrán ohun tó wúwo mọ́, ó sì lè túmọ̀ sí pé àwọn lẹ́tà náà ṣe pàtàkì, wọ́n le koko, wọ́n sì ní ipa.
- source_word: ἰσχυραί
  choice: lágbára
  rationale: Ìtumọ̀ tààrà tó sì bá ‘ní ìwọ̀n’ ṣiṣẹ́ dáadáa.
- source_word: παρουσία τοῦ σώματος
  choice: ìrísí ara rẹ̀ nígbà tí ó wà pẹ̀lú wa
  rationale: Nínú àyíká yìí, παρουσία túmọ̀ sí wíwà níbẹ̀ lójúkojú, τοῦ σώματος sì dojú kọ ìfarahàn ara; gbolohun yìí jẹ́ Yorùbá àdánidá ju ìtumọ̀ líle ‘wíwà ara’ lọ.
- source_word: ἀσθενής
  choice: kò lágbára
  rationale: Ó pa èrò ‘aláìlera’ tàbí ‘àìní agbára’ mọ́ láì pinnu bóyá ara, ìrísí, tàbí ipa rẹ̀ ni àwọn alátakò ń sọ̀rọ̀ nípa rẹ̀.
- source_word: λόγος
  choice: ọ̀rọ̀ ẹnu
  rationale: Ní ìyàtọ̀ sí lẹ́tà, ọ̀rọ̀ náà tọ́ka sí bí Pọ́ọ̀lù ṣe ń sọ̀rọ̀ níwájú ènìyàn.
- source_word: ἐξουθενημένος
  choice: jẹ́ ohun tí a kẹ́gàn
  rationale: Ó fi hàn pé àwọn ènìyàn ka ọ̀rọ̀ rẹ̀ sí asán tàbí wo ó ní ojú ẹ̀gàn, dípò fífi hàn pé kò níye ní ti ara rẹ̀.
theological_decisions:
- issue: Kí ìtumọ̀ má ṣe fi àríwísí àwọn alátakò Pọ́ọ̀lù hàn bí ìdájọ́ olùkọ̀wé fúnra rẹ̀
  choice: A fi ọ̀rọ̀ náà sí ẹnu àwọn tí ń sọ pé, “wọ́n ń sọ pé.”
  alternative: “Ó ń sọ pé” tàbí “a ń sọ pé”
  rationale: Àyíká fi hàn pé àríwísí tí a ròyìn ni, kì í ṣe ìjẹ́rìí olùkọ̀wé pé Pọ́ọ̀lù jẹ́ aláìlera tàbí pé ọ̀rọ̀ rẹ̀ kò níye.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún. ‘Ní ìwọ̀n’ pa àwòrán βαρεῖαι mọ́; ‘ìrísí ara rẹ̀ nígbà tí ó wà pẹ̀lú wa’ mú παρουσία τοῦ σώματος ṣe kedere ní Yorùbá láì sọ àríwísí náà di òtítọ́ tí olùkọ̀wé fọwọ́ sí.
