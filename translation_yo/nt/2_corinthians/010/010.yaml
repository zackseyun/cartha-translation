revisions:
- from: Nítorí wọ́n ń sọ pé,[a] “Àwọn lẹ́tà rẹ̀ ní ìwọ̀n, wọ́n sì lágbára, ṣùgbọ́n ìrísí ara rẹ̀ nígbà tí ó wà pẹ̀lú wa kò lágbára, ọ̀rọ̀ ẹnu rẹ̀ sì jẹ́ ohun tí a kẹ́gàn.”[b]
  to: Nítorí wọ́n ń sọ pé,[a] “Àwọn lẹ́tà rẹ̀ wúwo, wọ́n sì lágbára, ṣùgbọ́n ìwà ní ti ara rẹ̀ kò lágbára, a sì kẹ́gàn ọ̀rọ̀ ẹnu rẹ̀.”[b]
  rationale: Àtúnṣe náà yí “ní ìwọ̀n” padà sí “wúwo” kí βαρεῖαι lè ní ìtumọ̀ tó pé, ó yọ “pẹ̀lú wa” tí kò sí nínú ìpilẹ̀ Gíríìkì kúrò, ó sì ṣàtúnṣe akọ̀sílẹ̀ [b] kí àwọn àṣàyàn rẹ̀ lè fi ἐξουθενημένος hàn tọ́gbọ́n. Ìtumọ̀ náà ṣì jẹ́ ọ̀rọ̀ àríwísí tí a ròyìn, kì í ṣe ìdájọ́ olùkọ̀wé.
