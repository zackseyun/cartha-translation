id: 2CO.10.5
reference: 2 Corinthians 10:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: yo
  text: àti gbogbo ohun gíga tí a gbé dìde lòdì sí ìmọ̀ Ọlọ́run[a], a sì ń mú gbogbo èrò ní ìgbèkùn wá sínú ìgbọ́ràn sí Mèsáyà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ohun tí a gbé ga,” tàbí “gbogbo ìgbéraga.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Mèsáyà náà”; ní ìtumọ̀ àṣà: “Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: gbogbo ohun gíga
  rationale: Ó pa àwòrán ohun tí ó ga tàbí tí a gbé ga mọ́, láì dín ìtumọ̀ náà kù sí ìgbéraga tàbí àríyànjiyàn nìkan; “gbogbo” sì fi agbára distributive πᾶν hàn.
- source_word: ἐπαιρόμενον
  choice: tí a gbé dìde
  rationale: Èyí pa ìtumọ̀ ohun tí a gbé sókè tàbí tí a gbé dìde mọ́, kò sì fi dandan sọ pé ohun náà fúnra rẹ̀ ló ń gbé ara rẹ̀ ga.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: lòdì sí ìmọ̀ Ọlọ́run
  rationale: “Lòdì sí” fi ìtakò κατὰ hàn, “ìmọ̀ Ọlọ́run” sì pa àkójọpọ̀ genitive Gíríìkì mọ́ láì pinnu bóyá ó túmọ̀ sí ìmọ̀ nípa Ọlọ́run tàbí mímọ Ọlọ́run ní ìbáṣepọ̀.
- source_word: αἰχμαλωτίζοντες
  choice: a sì ń mú … ní ìgbèkùn
  rationale: Ó pa àkàwé ológun ti gbígbé ẹnì kan ní ìgbèkùn mọ́, ó sì fi plural participle náà hàn nípasẹ̀ “a.”
- source_word: πᾶν νόημα
  choice: gbogbo èrò
  rationale: “Èrò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún thought, ó sì jẹ́ kí ìtumọ̀ náà gbòòrò ju “ètò búburú” tàbí “ẹ̀tan” lọ.
- source_word: εἰς τὴν ὑπακοὴν
  choice: wá sínú ìgbọ́ràn
  rationale: “Wá sínú” fi ìṣípò sí ipò tuntun tí εἰς ń tọ́ka sí hàn, dípò kí a sọ ète nìkan.
- source_word: τοῦ Χριστοῦ
  choice: sí Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró níbí; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: A ka Χριστός sí oyè ní àyíká yìí, nítorí náà “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́; àṣà ìtumọ̀ Bíbélì Yorùbá sábà máa ń lo “Kristi,” a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Irú ohun tí πᾶν ὕψωμα ἐπαιρόμενον ń tọ́ka sí
  choice: ohun gíga tí a gbé dìde lòdì sí ìmọ̀ Ọlọ́run
  alternative: gbogbo ìgbéraga tàbí àgídí tí ń gbé ara rẹ̀ ga
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àwòrán gbòòrò ti ohun gíga tàbí ohun ìdènà; a kò dín un kù sí ìwà ìgbéraga inú ọkàn tàbí àsọjáde asán nìkan.
translation_notes:
  register: Yorùbá àfẹnusọ tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa àwòrán ohun gíga àti ìgbèkùn mọ́, ṣùgbọ́n a ṣètò gbólóhùn náà lọ́nà tí ó ṣeé lóye fún òǹkàwé Yorùbá òde òní. Àmì kọ́mà ìparí fi hàn pé ẹsẹ̀ yìí jẹ́ apá kan nínú gbólóhùn tó ń bá a lọ.
