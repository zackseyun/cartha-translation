id: 2CO.10.18
reference: 2 Corinthians 10:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: yo
  text: Nítorí kì í ṣe ẹni tí ó ń gbóríyìn fún ara rẹ̀ ni a fọwọ́ sí,[a] bí kò ṣe ẹni tí Olúwa ń gbóríyìn fún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ sí: ‘ẹni tí ó ń dámọ̀ràn ara rẹ̀’ … ‘ẹni tí Olúwa ń dámọ̀ràn.’ Ọ̀rọ̀ Gíríìkì kan náà ni a lò ní ibi méjèèjì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: ń gbóríyìn fún
  rationale: Nínú àyíká ọ̀rọ̀ nípa ìṣògo àti àyẹ̀wò, gbólóhùn yìí túmọ̀ sí fífi ẹnì kan hàn gẹ́gẹ́ bí ẹni tí ó yẹ fún ìtẹ́wọ́gbà. A lo ọ̀rọ̀ Yorùbá kan náà ní ibi méjèèjì láti pa àtúnsọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δόκιμος
  choice: ẹni ìtẹ́wọ́gbà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí a ti yẹ̀ wò tí a sì fọwọ́ sí. ‘Ẹni ìtẹ́wọ́gbà’ jẹ́ èdè Yorùbá àdánidá, ó sì bá ìyàtọ̀ láàárín ìgbóríyìn ara ẹni àti ìgbóríyìn Olúwa mu.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ àkọ́lé κύριος tí ó wọ́pọ̀, láì fi ‘Jésù’ tàbí ‘Ọlọ́run’ kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Ó pa ìtumọ̀ arọ́pò-orúkọ ìpadàsí ara ẹni mọ́ nínú èdè Yorùbá àdánidá.
- source_word: ὃν
  choice: ẹni tí
  rationale: 'Ó mú ìtakora náà ṣe kedere: kì í ṣe ẹni kan, bí kò ṣe ẹni tí Olúwa gbóríyìn fún.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa iṣẹ́ γάρ mọ́ gẹ́gẹ́ bí àsopọ̀ tí ń ṣàlàyé ọ̀rọ̀ tí ó ṣáájú.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ (ὁ κύριος) ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Nínú àwọn lẹ́tà Paulu, ‘Olúwa’ sábà máa ń tọ́ka sí Jésù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ju κύριος lọ. Ìtumọ̀ náà kò yanju ohun tí ọ̀rọ̀ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. Àtúnsọ ọ̀rọ̀ pàtàkì náà wà ní ibi méjèèjì, a sì pa ìtumọ̀ ‘Olúwa’ mọ́ láì ṣàfikún ẹni tí àkọ́lé náà tọ́ka sí.
