revisions:
- from: Nítorí kì í ṣe ẹni tí ó ń gbóríyìn fún ara rẹ̀ ni ó jẹ́ ẹni ìtẹ́wọ́gbà,[a] bí kò ṣe ẹni tí Olúwa ń gbóríyìn fún.
  to: Nítorí kì í ṣe ẹni tí ó ń gbóríyìn fún ara rẹ̀ ni a fọwọ́ sí,[a] bí kò ṣe ẹni tí Olúwa ń gbóríyìn fún.
  rationale: A rọ́pò ‘jẹ́ ẹni ìtẹ́wọ́gbà’ pẹ̀lú ‘ni a fọwọ́ sí’ láti mú agbára δόκιμος—ìfọwọ́sí lẹ́yìn àyẹ̀wò—hàn kedere. A tún ẹsẹ̀-ìsàlẹ̀ ṣe nítorí ‘fi hàn’ kò ṣe aṣojú ìtumọ̀ συνίστημι dáadáa nínú àyíká yìí. Àtúnsọ ọ̀rọ̀ náà, ìtakora gbolohun, àti àìdánimọ̀ pàtó ẹni tí ‘Olúwa’ jẹ́ ni a ti pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń pa ìtakora Gíríìkì mọ́ dáadáa: ẹni tí ó ń gbóríyìn fún ara rẹ̀ kò gbọdọ̀ jẹ́ ẹni tí a fọwọ́ sí, ṣùgbọ́n ẹni tí Olúwa ń gbóríyìn fún. Síbẹ̀, ‘ẹni ìtẹ́wọ́gbà’ lè túmọ̀ sí ẹni tí a tẹ́wọ́ gba ní gbogbogbò, níbi tí δόκιμος ti ń tọ́ka sí ẹni tí a ti dán wò tàbí tí a fọwọ́ sí. Àtúnṣe náà mú èyí hàn kedere.'
  naturalness: Gbólóhùn tí a tún ṣe jẹ́ Yorùbá àgbàṣe, ó sì dá ìbáṣepọ̀ ‘kì í ṣe ... ni a fọwọ́ sí, bí kò ṣe ...’ hàn ní kedere. ‘Ń gbóríyìn fún’ jẹ́ ọ̀nà àdánidá láti sọ ìgbéga tàbí ìmúni yẹ ara ẹni, a sì tún lò ó fún ìgbéga ẹni láti ọ̀dọ̀ Olúwa.
  terminology: ‘Olúwa’ yẹ fún κύριος, láì sọ ẹni tí àkọ́lé náà ń tọ́ka sí ní pàtó. ‘A fọwọ́ sí’ dá ìtumọ̀ δόκιμος (‘approved’) sunmọ́ ju ‘ẹni ìtẹ́wọ́gbà’ lọ nínú àyíká ìdánwò àti ìfọwọ́sowọ́pọ̀. A pa àtúnsọ συνιστάνων/συνίστησιν mọ́ pẹ̀lú ‘ń gbóríyìn fún’ ní ibi méjèèjì.
  issues:
  - severity: medium
    issue: ‘Ẹni ìtẹ́wọ́gbà’ kò fi ìtumọ̀ ìfọwọ́sí lẹ́yìn àyẹ̀wò tí δόκιμος ní hàn tó.
    rationale: Ó lè túmọ̀ sí ẹni tí a kan gbà wọlé tàbí ẹni tí ó gbajúmọ̀. ‘Ni a fọwọ́ sí’ sọ ìdájọ́ ìtẹ́wọ́gbà/ìfọwọ́sí tí ọ̀rọ̀ Gíríìkì náà ń tẹnumọ́ ní kedere.
  - severity: medium
    issue: Àlàyé ẹsẹ̀-ìsàlẹ̀ lo ‘fi ... hàn’ gẹ́gẹ́ bí yíyàn míràn fún συνίστημι.
    rationale: ‘Fi hàn’ sábà ń túmọ̀ sí ṣíṣí tàbí ṣàfihàn, kì í ṣe ìmúni yẹ/ìdámọ̀ràn ẹni fún ìtẹ́wọ́gbà. A tún un ṣe kí ó sọ yíyàn ìtumọ̀ ‘dámọ̀ràn’ ní ìbámu pẹ̀lú ìtumọ̀ Gíríìkì àti pẹ̀lú àtúnsọ ọ̀rọ̀ náà.
  revised_text: Nítorí kì í ṣe ẹni tí ó ń gbóríyìn fún ara rẹ̀ ni a fọwọ́ sí,[a] bí kò ṣe ẹni tí Olúwa ń gbóríyìn fún.
