review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gbé ìfiwéra τῷ λόγῳ ... τῷ ἔργῳ àti ìtakora àìsí/wíwà kalẹ̀ dáadáa. Ṣùgbọ́n ‘àwa yóò sì jẹ́’ fi ọjọ́ iwájú kún ọ̀rọ̀ náà; Gíríìkì ní àwọn ọ̀rọ̀-ìṣe ìsinsìnyí, οἷοί ἐσμεν ... τοιοῦτοι ... [ἐσμεν], tí ó jẹ́ ìdánilójú nípa ohun tí wọ́n jẹ́, kì í ṣe ìlérí ọjọ́ iwájú.
  naturalness: ‘Irú ẹni tí àwa jẹ́ ... irú ẹni náà ni àwa yóò sì jẹ́’ wúlò ṣùgbọ́n ó le, ó sì tún ‘irú ẹni’ ṣe lọ́pọ̀. Ètò ‘bí àwa ṣe rí ... bẹ́ẹ̀ náà ni àwa ṣe rí’ jẹ́ Yorùbá boṣewa, ó sì tẹ̀lé ìfiwéra Gíríìkì náà ní kedere.
  terminology: ‘Ọ̀rọ̀,’ ‘lẹ́tà,’ àti ‘ìṣe’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu. ‘Nípasẹ̀ lẹ́tà’ ń sọ διά + genitive gẹ́gẹ́ bí ọ̀nà/ohun èlò láìfi ìtumọ̀ míì kún un.
  issues:
  - severity: medium
    issue: A fi ọjọ́ iwájú kún apá kejì ẹsẹ náà.
    rationale: ‘Yóò ... jẹ́’ àti àlàyé ìsàlẹ̀ rẹ̀ sọ pé ìṣe náà yóò ṣẹlẹ̀ nígbà tí Pọ́ọ̀lù bá dé. Ṣùgbọ́n παρόντες jẹ́ participle ìsinsìnyí tí ó jọ ἀπόντες, àti τοιοῦτοι ṣe ìfiwéra ìsinsìnyí pẹ̀lú οἷοί ἐσμεν. Àyíká le ní ìkìlọ̀ nípa ìbẹ̀wò tó ń bọ̀, ṣùgbọ́n a kò gbọdọ̀ sọ èyí di àsọtẹ́lẹ̀ ọjọ́ iwájú nínú ìtumọ̀.
  - severity: low
    issue: Ìsàlẹ̀ a ń gbèjà ìtumọ̀ tí kò bá àkókò ọ̀rọ̀ Gíríìkì mu.
    rationale: Ó sọ pé àṣàyàn rẹ̀ ‘pa àkókò ọ̀rọ̀ Gíríìkì mọ́’ nígbà tí ìtumọ̀ pàtàkì fi ọjọ́ iwájú kún un. Níwọ̀n bí àtúnṣe kò fi ìyàtọ̀ ìtumọ̀ tó nílò àlàyé sílẹ̀, a yọ ìsàlẹ̀ náà kúrò.
