id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: yo
  text: 'Kí irú ẹni bẹ́ẹ̀ ronú lórí èyí pé: bí àwa ṣe rí nínú ọ̀rọ̀ nípasẹ̀ lẹ́tà nígbà tí a kò sí níbẹ̀, bẹ́ẹ̀ náà ni àwa ṣe rí nínú ìṣe nígbà tí a wà níbẹ̀.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: Kí ... ronú lórí
  rationale: Àṣẹ ẹni kẹta ẹyọ kan ni; ‘ronú lórí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi hàn pé kí ẹni náà gbé òtítọ́ yìí yẹ̀ wò dáadáa.
- source_word: ὁ τοιοῦτος
  choice: irú ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí ẹni kan tí ìwà tàbí èrò rẹ̀ bá ti ẹni tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ mẹ́nu kàn mu; ó yẹra fún èdè àtijọ́.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: irú ẹni tí àwa jẹ́ ... irú ẹni náà ni àwa yóò sì jẹ́
  rationale: Ìtumọ̀ yìí pa ìfiwéra ànímọ́ inú Gíríìkì mọ́, ó sì sọ ìkìlọ̀ nípa ohun tí wọn yóò fi ìṣe hàn nígbà tí wọn bá dé ní ọ̀nà àdánidá.
- source_word: τῷ λόγῳ
  choice: nínú ọ̀rọ̀
  rationale: Dative ti apá tàbí ojú-ọ̀nà ni; ó pa ìtakora kúkúrú láàárín ‘ọ̀rọ̀’ àti ‘ìṣe’ mọ́.
- source_word: δι’ ἐπιστολῶν
  choice: nípasẹ̀ àwọn lẹ́tà
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ohun èlò tàbí ọ̀nà; àwọn lẹ́tà ni ọ̀nà tí ọ̀rọ̀ wọn fi dé.
- source_word: ἀπόντες
  choice: nígbà tí a kò sí níbẹ̀
  rationale: Participle àyíká ni, tí ó dúró ní ìtakora pẹ̀lú wíwà wọn níbẹ̀.
- source_word: παρόντες
  choice: nígbà tí a bá wà níbẹ̀
  rationale: Ó pa ìtakora pẹ̀lú àìsí wọn mọ́, ó sì fi ipò ọjọ́ iwájú tí ọ̀rọ̀ àyíká ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: τῷ ἔργῳ
  choice: nínú ìṣe
  rationale: Ó tọ́ka sí apá ìṣe, ní ìtakora pẹ̀lú ọ̀rọ̀; ‘ìṣe’ ṣe kedere sí òǹkàwé òde òní.
theological_decisions:
- issue: Ìbámu láàárín bí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ṣe fara hàn nínú lẹ́tà nígbà tí wọn kò sí àti ohun tí wọn yóò ṣe nígbà tí wọn bá dé.
  choice: Fi ẹsẹ náà hàn gẹ́gẹ́ bí ìkìlọ̀ pé ìṣe wọn níwájú yóò bá agbára ọ̀rọ̀ inú lẹ́tà wọn mu.
  alternative: Túmọ̀ ọ́ lásán gẹ́gẹ́ bí ìhalẹ̀ nípa ìṣe ọjọ́ iwájú, tàbí bí ìyàtọ̀ láàárín ọ̀nà ìsọ̀rọ̀ àti agbára.
  rationale: Gíríìkì fi ìfiwéra tààrà hàn láàárín ọ̀rọ̀ nípasẹ̀ lẹ́tà ní àìsí àti ìṣe ní wíwà; a kò gbọ́dọ̀ mú un kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwa’ níbi tí a fẹ́ fi ẹni tí ń sọ̀rọ̀ hàn kedere, àti ‘a’ nínú gbólóhùn àfikún; a pa ìtakora ‘ọ̀rọ̀ ... ìṣe’ àti ‘kò sí ... wà’ mọ́.
