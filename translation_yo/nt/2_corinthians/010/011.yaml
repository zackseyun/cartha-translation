- from: 'Kí irú ẹni bẹ́ẹ̀ ronú lórí èyí pé: irú ẹni tí àwa jẹ́ nínú ọ̀rọ̀ nípasẹ̀ àwọn lẹ́tà nígbà tí a kò sí níbẹ̀, irú ẹni náà ni àwa yóò sì jẹ́ nínú ìṣe nígbà tí a bá wà níbẹ̀.[a]'
  to: 'Kí irú ẹni bẹ́ẹ̀ ronú lórí èyí pé: bí àwa ṣe rí nínú ọ̀rọ̀ nípasẹ̀ lẹ́tà nígbà tí a kò sí níbẹ̀, bẹ́ẹ̀ náà ni àwa ṣe rí nínú ìṣe nígbà tí a wà níbẹ̀.'
