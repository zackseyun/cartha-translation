id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: yo
  text: 'Ẹ ń wo ohun tí ó hàn lójú[a]. Bí ẹnikẹ́ni bá dá ara rẹ̀ lójú pé òun jẹ́ ti Mèsáyà, kí ó tún ronú nípa èyí nínú ọkàn rẹ̀: pé gẹ́gẹ́ bí òun ti jẹ́ ti Mèsáyà[b], bẹ́ẹ̀ náà ni àwa pẹ̀lú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó túmọ̀ ọ̀rọ̀ náà ní tààrà: “Ẹ ń wo àwọn ohun gẹ́gẹ́ bí ìrísí wọn”; ó tún ṣeé ṣe kí ó túmọ̀ sí, “Ẹ wo ohun tí ó wà níwájú yín.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “jẹ́ ti Kristi”; a túmọ̀ rẹ̀ sí “jẹ́ ti Mèsáyà” láti fi jíjẹ́ tirẹ̀ tàbí ìfaramọ́ sí i hàn, àti láti túmọ̀ Χριστός gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: ohun tí ó hàn lójú
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun ìta tàbí ohun tí ojú lè rí; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìrísí òde mọ́.
- source_word: βλέπετε
  choice: Ẹ ń wo
  rationale: A mú un gẹ́gẹ́ bí ọ̀rọ̀ ìṣàpèjúwe tó ń bá wọn wí, kì í ṣe àṣẹ; bí ó tilẹ̀ jẹ́ pé ìrísí Gíríìkì náà lè gba ìtumọ̀ àṣẹ.
- source_word: πέποιθεν ἑαυτῷ
  choice: ní ìdánilójú nínú ara rẹ̀
  rationale: Perfect náà ń fi ìgbẹ́kẹ̀lé tí ó ti fìdí múlẹ̀ hàn; ọ̀nà yìí sì sọ ìgbẹ́kẹ̀lé ẹni sí ara rẹ̀ ní Yorùbá tó ṣe kedere.
- source_word: Χριστοῦ εἶναι
  choice: jẹ́ ti Mèsáyà
  rationale: Genitive pẹ̀lú εἶναι ń sọ jíjẹ́ ti ẹnìkan tàbí ìfaramọ́ sí i; ‘jẹ́ ti’ pa ìṣọ̀kan ọ̀rọ̀ náà mọ́ láìfi àlàyé àfikún sí i.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: kí ó tún ronú lórí èyí nínú ara rẹ̀
  rationale: Ó ń pè é sí àtúnyẹ̀wò inú ọkàn; ‘tún ronú’ àti ‘nínú ara rẹ̀’ mú agbára ìmísí náà jáde ní èdè Yorùbá àdánidá.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: gẹ́gẹ́ bí òun ti jẹ́ ti Mèsáyà, bẹ́ẹ̀ náà ni àwa pẹ̀lú
  rationale: Ìtumọ̀ náà pa ìfiwéra tó dọ́gba mọ́, ó sì mú ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ láìsọ jáde hàn ní Yorùbá fún ìmọ̀ye.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró níhìn-ín; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, kò sì sọ ọ́ di orúkọ lásán.
- issue: Ìbáṣepọ̀ tí Χριστοῦ εἶναι ń sọ
  choice: jẹ́ ti Mèsáyà
  alternative: faramọ́ Mèsáyà
  rationale: ‘Jẹ́ ti’ pa ìtumọ̀ jíjẹ́ ohun-ìní tàbí ẹni tó jẹ́ ti Mèsáyà mọ́, láìdín un kù sí ìfaramọ́ nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní ibi tó yẹ. A lo ‘ẹ’ fún ẹni púpọ̀ nínú ìbáwí àkọ́kọ́, ‘ẹnikẹ́ni/ó/òun’ fún ẹni kọ̀ọ̀kan, àti ‘àwa’ fún Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀. Àmì [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
