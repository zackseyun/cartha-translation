id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: yo
  text: láti kéde ìhìn rere ní àwọn agbègbè tí ó wà ní òkèèrè yín[a], kì í ṣe láti ṣògo nínú pápá iṣẹ́ ẹlòmíràn[b] nípa àwọn ohun tí a ti múra sílẹ̀ tán[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti wàásù ìhìn rere ní àwọn ilẹ̀ tí ó wà ní òkèèrè yín.”
    reason: lexical_alternative
  - marker: b
    text: “Pápá iṣẹ́” ni a fi tú ọ̀rọ̀ Gíríìkì κανών níbí. Ó túmọ̀ sí agbègbè tàbí ààlà iṣẹ́ tí a yàn fún ẹni kan, kì í ṣe òfin ìwà tàbí ohun tí a wá ń pè ní “kánónì” nígbà tí ó yá.
    reason: cultural_note
  - marker: c
    text: Tàbí, “láti ṣògo nínú pápá iṣẹ́ ẹlòmíràn nípa ohun tí a ti ṣe tán.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: àwọn agbègbè tí ó rékọjá yín
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ibi tí ó wà ní òkèèrè, rékọjá ibi tí àwọn ará Kọ́ríńtì wà. Ìtumọ̀ yìí pa ìbátan ibi tí Gíríìkì sọ mọ́ láì fi ‘agbègbè yín’ kún un.
- source_word: εὐαγγελίσασθαι
  choice: láti kéde ìhìn rere
  rationale: Èyí fi ìṣe ìkéde hàn ní èdè Yorùbá òde òní, ó sì yẹra fún ọ̀rọ̀ ìjọ tí ó lè ṣòro fún òǹkàwé lásán.
- source_word: ἀλλοτρίῳ
  choice: ẹlòmíràn
  rationale: Ó túmọ̀ sí ohun tí ó jẹ́ ti ẹlòmíràn; nínú gbólóhùn yìí ó ń ṣàpèjúwe pápá iṣẹ́ tí í ṣe ti ẹlòmíràn.
- source_word: κανόνι
  choice: pápá iṣẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, κανών jẹ́ ààlà tàbí agbègbè iṣẹ́ tí a pín fún ẹni kan, kì í ṣe òfin ìwà tàbí ‘kánónì’ Ìwé Mímọ́.
- source_word: ἕτοιμα
  choice: àwọn ohun tí a ti múra sílẹ̀ tán
  rationale: Ọ̀rọ̀ àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ ọ̀pọ̀, ó sì ń tọ́ka sí àwọn ohun tí ó ti wà ní ìmúrasílẹ̀. A kò sọ ẹni tí ó múra wọn sílẹ̀ nítorí Gíríìkì náà kò sọ ọ́.
- source_word: καυχήσασθαι
  choice: láti ṣògo
  rationale: ‘Ṣògo’ pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì bá lílo ọ̀rọ̀ náà ní gbogbo àyíká ẹsẹ yìí mu.
theological_decisions:
- issue: Ìtumọ̀ κανών nínú ọ̀rọ̀ iṣẹ́ Pọ́ọ̀lù
  choice: pápá iṣẹ́ tí a pín tàbí yàn fún ẹni kan
  alternative: òfin, ìlànà, tàbí kánónì
  rationale: Àwọn ẹsẹ 13–15 ń sọ̀rọ̀ nípa ìwọ̀n ààlà àti agbègbè iṣẹ́. Nítorí náà, ‘pápá iṣẹ́’ ni ó mú èrò nípa ààlà iṣẹ́ aposteli jáde láì gbé ìtumọ̀ ìjọ tó wá lẹ́yìn wọ inú ẹsẹ náà.
- issue: Ohun tí τὰ ἕτοιμα ń tọ́ka sí
  choice: àwọn ohun tí a ti múra sílẹ̀ tán, ní àyíká iṣẹ́ ìránṣẹ́ ẹlòmíràn
  alternative: àwọn ohun tí ó ti ṣe tán tàbí iṣẹ́ tí ẹlòmíràn ti parí
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù kọ̀ láti ṣògo lórí èso iṣẹ́ ẹlòmíràn, ṣùgbọ́n Gíríìkì fúnra rẹ̀ sọ ‘àwọn ohun tí a ti múra sílẹ̀’ ní ọ̀nà tí ó ṣókùnkùn díẹ̀. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú yẹn mọ́, àlàyé ìsàlẹ̀ sì fi ìtumọ̀ mìíràn hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kéde ìhìn rere” dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ ìjọ tó le; “pápá iṣẹ́” sì jẹ́ àwòrán èdè adayeba fún agbègbè iṣẹ́ aposteli. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
