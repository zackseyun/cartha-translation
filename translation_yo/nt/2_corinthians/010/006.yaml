  to: àti pé a sì ti múra tán láti fìyà jẹ gbogbo ìwà àìgbọ́ràn[a], nígbà tí ìgbọ́ràn yín bá kún.[b]
  rationale: 'A tún ọ̀rọ̀ náà ṣe díẹ̀ fún Yorùbá boṣewa tó rọrùn àti ìbámu pẹkipẹki pẹ̀lú Gíríìkì: a ṣàlàyé ipa distributive ‘gbogbo,’ a rọ́pò ìtẹnumọ́ àṣejù ‘pé pérépéré’ pẹ̀lú ‘bá kún,’ a sì mú àwọn àlàyé ìsàlẹ̀ péye ní gírámà àti ní ìsọ̀kan pẹ̀lú àwọn aṣayan lexical.'
