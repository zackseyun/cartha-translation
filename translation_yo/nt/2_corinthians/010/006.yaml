review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fi ìmọ̀ràn pàtàkì Gíríìkì hàn dáadáa: ìmúrasílẹ̀, ìjìyà fún gbogbo àìgbọ́ràn, àti àkókò tí ìgbọ́ràn àwọn ará Kọ́ríńtì yóò fi dé kíkún. Síbẹ̀, ‘bá pé pérépéré’ dà bí ìtẹnumọ́ àṣejù, ó sì kéré sí ìforígbárí ìtumọ̀ passive πληρωθῇ ju ‘bá kún’ lọ. ‘Ìwà àìgbọ́ràn’ tún mú ẹyọ̀kan πᾶσαν παρακοήν hàn ní Yorùbá tútù.'
  naturalness: ‘A sì ti múra tán’ jẹ́ ọ̀nà Yorùbá adayébá láti so participle náà mọ́ ọ̀rọ̀ tó ṣáájú. ‘Láti fìyà jẹ gbogbo ìwà àìgbọ́ràn’ kedere ju ‘láti fi ìyà jẹ gbogbo àìgbọ́ràn’ lọ, àti ‘nígbà tí ìgbọ́ràn yín bá kún’ jẹ́ gbolohun àdánidá, kedere.
  terminology: A pa ‘àìgbọ́ràn’ àti ‘ìgbọ́ràn’ mọ́ gẹ́gẹ́ bí ìbámu tó yẹ fún παρακοή àti ὑπακοή. ‘Fìyà jẹ’ yẹ fún ἐκδικῆσαι nínú àyíká ìbáwí; àlàyé ìsàlẹ̀ ń pa aṣayan ‘gbẹ̀san’ àti ‘mú ìdájọ́ ṣẹ’ mọ́ láì fi ìtumọ̀ ẹ̀sìn kan kún un.
  issues:
  - severity: medium
    issue: ‘Bá pé pérépéré’ jẹ́ ìtẹnumọ́ àṣejù, ó sì lè dà bí pé ìgbọ́ràn náà ti pé tán dipo pé ó ń dé kíkún rẹ̀.
    rationale: πληρωθῇ jẹ́ aorist passive subjunctive, tí ó ń tọ́ka sí ìgbọ́ràn tí yóò ní ìmúṣẹ/kíkún ní àkókò ọjọ́ iwájú. ‘Bá kún’ pa èrò náà mọ́ ní ọ̀nà Yorùbá tó rọrùn.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ b ní aṣayan ‘bá kún’ láì tún ọ̀rọ̀-orúkọ ‘ìgbọ́ràn yín’ sọ.
    rationale: Àtúnṣe sí àlàyé gbolohun pípé ń jẹ́ kí aṣayan ìtumọ̀ náà ṣalaye fúnra rẹ̀.
  - severity: low
    issue: ‘Gbogbo àìgbọ́ràn’ lè tọ́ka sí àìgbọ́ràn gẹ́gẹ́ bí èrò àpapọ̀ ju sí ọ̀kọ̀ọ̀kan ìwà àìgbọ́ràn lọ.
    rationale: Fífún un ní ‘gbogbo ìwà àìgbọ́ràn’ mú ipa distributive πᾶσαν hàn kedere, láì yí ìtumọ̀ rẹ̀ padà.
