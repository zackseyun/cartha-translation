id: 2CO.10.6
reference: 2 Corinthians 10:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: yo
  text: àti pé a sì ti múra tán láti fìyà jẹ gbogbo ìwà àìgbọ́ràn[a], nígbà tí ìgbọ́ràn yín bá kún.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti gbẹ̀san lórí gbogbo ìwà àìgbọ́ràn” tàbí “láti mú ìdájọ́ ṣẹ lórí gbogbo ìwà àìgbọ́ràn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí mímú ìdájọ́ ṣẹ tàbí gbígbẹ̀san; ṣùgbọ́n nínú àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí fífi ìyà bá àìgbọ́ràn wí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ìgbọ́ràn yín bá dé ìmúṣẹ” tàbí “nígbà tí ìgbọ́ràn yín bá pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: a ti múra tán
  rationale: Àṣà ọ̀rọ̀ Gíríìkì náà túmọ̀ sí wíwà ní ìmúrasílẹ̀. ‘A ti múra tán’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì pa ìtumọ̀ ìmúrasílẹ̀ mọ́.
- source_word: ἐκδικῆσαι
  choice: láti fi ìyà jẹ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí lílo àṣẹ àpọ́sítélì láti bá àìgbọ́ràn wí, kì í ṣe ìgbẹ̀san ara ẹni. Àlàyé ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: πᾶσαν παρακοήν
  choice: gbogbo àìgbọ́ràn
  rationale: Ìtumọ̀ yìí pa ìwúwo πᾶσαν mọ́, ó sì fi παρακοή hàn gẹ́gẹ́ bí àìgbọ́ràn tàbí kíkọ̀ láti gbọ́.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Àkópọ̀ ‘nígbà tí ... bá’ fi àkókò ọjọ́ iwájú tí ó sinmi lórí ohun tí yóò ṣẹlẹ̀ hàn lọ́nà Yorùbá àdánidá.
- source_word: πληρωθῇ
  choice: bá pé pérépéré
  rationale: Ó sọ pé ìgbọ́ràn náà yóò dé ìwọ̀n kíkún rẹ̀; ‘pé pérépéré’ jẹ́ àdánidá, ó sì pa èrò ìmúṣẹ tàbí ìparí mọ́.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: ìgbọ́ràn yín
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá ti ọ̀rọ̀ oníni náà ní Yorùbá.
theological_decisions:
- issue: Irú ìgbésẹ̀ tí Pọ́ọ̀lù pinnu láti gbé sí àtakò
  choice: ìbáwí pẹ̀lú ìjìyà fún àìgbọ́ràn láàárín ìjọ
  alternative: ìgbẹ̀san ara ẹni sí àwọn alátakò tàbí ìdájọ́ ìkẹyìn ti Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ náà dá lórí àṣẹ àpọ́sítélì àti ṣíṣe àtúnṣe sí àtakò. ‘Fi ìyà jẹ’ yẹra fún èrò ìgbẹ̀san ara ẹni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbígbé ẹ̀tọ́ tàbí gbígbẹ̀san mọ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ṣàlàyé.
