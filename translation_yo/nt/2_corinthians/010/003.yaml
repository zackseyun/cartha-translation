  to: Nítorí bí a tilẹ̀ ń rìn nínú ara[a], a kò jagun gẹ́gẹ́ bí ara—
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò wọ́pọ̀ ‘ẹran ara’ pẹ̀lú ‘ara,’ kí ìtumọ̀ σάρξ má bàa yí sí ‘ẹran’ ní ojúlówó. Ó tún mú ìtumọ̀ κατὰ σάρκα di Yorùbá àdánidá nípasẹ̀ ‘gẹ́gẹ́ bí ara,’ nígbà tí ó pa àtúnlò ọ̀rọ̀ Gíríìkì náà, àwòrán ‘rìn,’ ìrísí concessive, àti àmì ìtẹ̀síwájú ẹsẹ̀ mọ́.
