  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: yo
  text: Nítorí bí a tilẹ̀ ń rìn nínú ara[a], a kò jagun gẹ́gẹ́ bí ara—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí bí a tilẹ̀ ń gbé nínú ara, a kò jagun nípasẹ̀ ìlànà ènìyàn lásán.”
    reason: ìtumọ̀ ọ̀rọ̀ míràn
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: nínú ẹran ara
  rationale: Ó pa àwòrán σάρξ mọ́, ó sì tọ́ka sí ìgbésí ayé wa gẹ́gẹ́ bí ènìyàn tí ó ní ara, láì fi ìtumọ̀ ‘ìwà ẹ̀ṣẹ̀’ kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń ṣàlàyé ohun tí ó ṣáájú, ‘Nítorí’ sì mú ìsopọ̀ ìjiyàn náà hàn ní Yorùbá àdánidá.
- source_word: περιπατοῦντες
  choice: bí ó tilẹ̀ jẹ́ pé a ń rìn
  rationale: ‘Rìn’ pa àkàwé ti Gíríìkì mọ́, nígbà tí gbólóhùn concessive náà mú ìyàtọ̀ sí apá kejì hàn.
- source_word: οὐ κατὰ σάρκα
  choice: a kò jagun ní ìbámu pẹ̀lú ẹran ara
  rationale: ‘Ní ìbámu pẹ̀lú’ fi κατὰ hàn gẹ́gẹ́ bí ìlànà tàbí ọ̀nà ìṣe, ó sì pa àtúnṣe ọ̀rọ̀ ‘ẹran ara’ mọ́ láì dín ìtumọ̀ rẹ̀ sí ọ̀nà ènìyàn nìkan.
- source_word: στρατευόμεθα
  choice: a kò jagun
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ogun, ó sì pa àwòrán ológun tí Pọ́ọ̀lù lò mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάρξ ní ibi méjèèjì
  choice: Lo ‘ẹran ara’ ní ibi méjèèjì nínú ẹsẹ pàtàkì.
  alternative: ‘A ń gbé nínú ara ... a kò sì jagun nípasẹ̀ ìlànà ènìyàn lásán.’
  rationale: Lílo ọ̀rọ̀ kan náà pa àtúnṣe àti ìforígbárí inú ọ̀rọ̀ Pọ́ọ̀lù mọ́. Ó yẹra fún fífi ‘ìwà ẹ̀ṣẹ̀’ sí ibi tí ọ̀rọ̀ náà lè túmọ̀ sí ìwàláàyè ènìyàn nínú ara àti àwọn ọ̀nà tí ó jẹ́ ti ènìyàn lásán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. Àmì gígùn ní òpin pa ìtẹ̀síwájú sí ẹsẹ tó tẹ̀ lé e mọ́.
