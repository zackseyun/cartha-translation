id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: yo
  text: Nítorí gbogbo nǹkan jẹ́ fún yín, kí oore-ọ̀fẹ́ náà, bí ó ti ń pọ̀ sí i nípasẹ̀ àwọn ènìyàn púpọ̀ sí i[a], lè mú kí ìdúpẹ́ náà túbọ̀ pọ̀ sí i fún ògo Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọ̀pọ̀ ènìyàn,” tàbí “nípasẹ̀ iye ènìyàn tí ó pọ̀ jù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀pọ̀ ènìyàn lápapọ̀ tàbí sí iye ènìyàn tí ń pọ̀ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πάντα
  choice: gbogbo nǹkan
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ tó gbòòrò, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ‘everything/all things’ mu láì dín ohun tí Pọ́ọ̀lù ń tọ́ka sí kù.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí a sọ ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: διά pẹ̀lú accusative níbí ń tọ́ka sí àǹfààní àwọn olùgbọ́; ‘nítorí yín’ jẹ́ ọ̀nà àdánidá láti sọ pé ó wà fún ire wọn.
- source_word: ἵνα
  choice: kí
  rationale: Ó fi ète tàbí àbájáde hàn ní Yorùbá àdánidá.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ χάρις mọ́ gẹ́gẹ́ bí ojú rere àti iṣẹ́ oore Ọlọ́run, láì sọ ọ́ di ẹ̀kọ́ pàtó kan.
- source_word: πλεονάσασα
  choice: bí ó ti ń dé ọ̀dọ̀
  rationale: Nínú àyíká yìí, gbolohun náà fi hàn pé oore-ọ̀fẹ́ ń tàn dé ọ̀dọ̀ ènìyàn púpọ̀ sí i; yíyí participle náà sí gbólóhùn ‘bí ó ti ń...’ jẹ́ Yorùbá tó ṣe kedere.
- source_word: διὰ τῶν πλειόνων
  choice: ọ̀dọ̀ àwọn ènìyàn púpọ̀ sí i
  rationale: Ọ̀rọ̀ comparative substantival náà lè tọ́ka sí ọ̀pọ̀ ènìyàn tàbí iye ènìyàn tí ń pọ̀ sí i; àkọ́kọ́ yìí mú ìtànkálẹ̀ náà jáde ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
- source_word: τὴν εὐχαριστίαν
  choice: ìdúpẹ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún thanksgiving tí a darí sí Ọlọ́run.
- source_word: περισσεύσῃ
  choice: pọ̀ dé àkúnwọ́sílẹ̀
  rationale: Ó fi ọ̀pọ̀lọpọ̀ tí ó ré kọjá ìwọ̀n hàn, ó sì pa àwòrán ìkúnwọ́sílẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: fún ògo Ọlọ́run
  rationale: 'Ó sọ ète tàbí àbájáde náà ní Yorùbá tó rọrùn: ìdúpẹ́ náà ń yọrí sí ògo Ọlọ́run.'
theological_decisions:
- issue: Ohun tí ‘oore-ọ̀fẹ́’ ń tọ́ka sí àti bí ó ṣe ń ṣiṣẹ́ nínú gbólóhùn ète náà
  choice: A fi ‘oore-ọ̀fẹ́’ sílẹ̀ ní ìtumọ̀ gbòòrò gẹ́gẹ́ bí ojú rere Ọlọ́run tí ń ṣiṣẹ́, tí ó sì ń dé ọ̀dọ̀ ènìyàn púpọ̀ sí i.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí oore-ọ̀fẹ́ ìgbàlà tí àwọn olùgbà ń pọ̀ sí i ń rí gbà, tàbí sí iṣẹ́ oore Ọlọ́run nínú iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù.
  rationale: Ẹsẹ náà kò fi dandan mú wa yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí; àkọ́kọ́ yẹ kí ó pa fífẹ̀ ìtumọ̀ χάρις mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àkọ́kọ́ yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan, ó sì pa àìdánilójú ọ̀rọ̀ Gíríìkì διὰ τῶν πλειόνων mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
