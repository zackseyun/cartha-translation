    issue: “nítorí yín” fún δι’ ὑμᾶς
    rationale: Ní Yorùbá, ọ̀rọ̀ náà lè gbọ́ bí ìdí/okùnfà (‘because of you’). Ní àyíká yìí διά pẹ̀lú accusative ń sọ àǹfààní; “fún yín” ṣàlàyé èyí dáadáa.
  - severity: medium
    issue: “bí ó ti ń dé ọ̀dọ̀ àwọn ènìyàn...” fún πλεονάσασα διὰ τῶν πλειόνων
    rationale: '“Dé ọ̀dọ̀” túmọ̀ sí ìlọ síbi àwọn ènìyàn, ṣùgbọ́n διά ń sọ ọ̀nà/asẹ: oore-ọ̀fẹ́ ń pọ̀ sí i ‘nípasẹ̀’ wọn. A kò gbọ́dọ̀ yí ìbáṣepọ̀ náà padà.'
  - severity: low
    issue: “ìdúpẹ́ pọ̀ dé àkúnwọ́sílẹ̀”
    rationale: Ó ṣeé lóye, ṣùgbọ́n “túbọ̀ pọ̀ sí i” jẹ́ Yorùbá tó rọrùn, ó sì ń fi περισσεύσῃ hàn ní kedere.
