id: 2CO.4.3
reference: 2 Corinthians 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: yo
  text: Ṣùgbọ́n bí ó tilẹ̀ jẹ́ pé a ti fi ìbòjú bo ìhìnrere wa, láàárín àwọn tí ń ṣègbé ni a ti fi ìbòjú bo ó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwọn tí ń ṣègbé”; tàbí, “láàárín àwọn tí ó sọnù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Bí ó tilẹ̀ jẹ́ pé
  rationale: Ó mú ìtumọ̀ àídájú tí ó ní ìyọ̀ǹda (‘even if’) jáde ní Yorùbá àdánidá; δέ ń bá ọ̀rọ̀ ṣáájú lọ pẹ̀lú ìyàtọ̀ kékeré, èyí tí àyíká gbólóhùn náà ń fi hàn láìjẹ́ pé a gbọdọ̀ fi ‘ṣùgbọ́n’ kún un.
- source_word: κεκαλυμμένον
  choice: ni a fi ìbòjú bò
  rationale: Ó pa àkàwé ìbòjú tí ó ti wà ní 3:14–16 mọ́, ó sì fi ipò àṣeyọrí ti perfect passive hàn lọ́nà Yorùbá tó ṣeé lóye.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: ìhìnrere wa
  rationale: Ó pa ọ̀rọ̀ ìní ἡμῶν mọ́, ó sì lo ‘ìhìnrere,’ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ní iyì fún εὐαγγέλιον.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: láàárín àwọn tí ń ṣègbé
  rationale: ‘Láàárín’ fi agbègbè tàbí ẹgbẹ́ tí ἐν pẹ̀lú dative ń tọ́ka sí hàn; ‘tí ń ṣègbé’ pa ìṣe tàbí ipò tí ń lọ lọ́wọ́ nínú present participle mọ́.
- source_word: ἐστὶν κεκαλυμμένον
  choice: ni a fi ìbòjú bò ó
  rationale: Ó tún predicate Gíríìkì náà sọ fún ìtẹnumọ́, gẹ́gẹ́ bí orísun ṣe ṣe, ‘ó’ sì ń tọ́ka kedere sí ìhìnrere wa.
theological_decisions:
- issue: Ìtumọ̀ ἀπολλυμένοις nínú àyíká ìgbàlà ti Pọ́ọ̀lù
  choice: àwọn tí ń ṣègbé
  alternative: àwọn tí ó ti sọnù
  rationale: Present participle náà fi ipò tàbí ìlànà tí ń lọ lọ́wọ́ hàn. ‘Àwọn tí ń ṣègbé’ pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́, kò sì sọ ọ́ di àmì ipò tó ti parí bí ‘àwọn tí ó ti sọnù.’
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àkàwé ‘ìbòjú’ ni a pa mọ́ láti bá àyíká 2 Kọrinti 3:14–16 àti 4:4 mu; àtúnsọ predicate náà tún ń pa ìtẹnumọ́ Gíríìkì mọ́.
