review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn èrò pàtàkì Gíríìkì náà mọ́: ìpèsè àídájú tí ó ní ìyọ̀ǹda, àkàwé ìbòjú, “ìhìnrere wa,” àti ipò tí ń lọ lọwọ àwọn tí ń ṣègbé. Síbẹ̀, lílo “ni a fi ìbòjú bò” nínú ìpèsè méjèèjì kò rọrùn gan-an gẹ́gẹ́ bí Yorùbá ìgbàlódé, ó sì lè dà bí ìsọfúnni nípa ẹni kan tí ó ṣe ìṣe náà ju bí ó ti ń ṣàlàyé ipò ìhìnrere náà lọ.'
