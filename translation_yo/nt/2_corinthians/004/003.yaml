  terminology: “Ìhìnrere,” “ìbòjú,” àti “àwọn tí ń ṣègbé” bá ìforígbárí àti àkàwé inú ọ̀rọ̀ Gíríìkì mu. A kò yí “àwọn tí ń ṣègbé” padà sí ọ̀rọ̀ tó ti pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ju bó ṣe yẹ lọ.
