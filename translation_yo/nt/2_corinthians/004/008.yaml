  source_fidelity: Ìtumọ̀ náà pa ìtòlẹ́sẹẹsẹ ìtakora méjì ti Gíríìkì mọ́, ó sì fi ìlọsíwájú láti wíwà ní ìdàrúdàpọ̀/àìmọ ohun tí a lè ṣe sí àìní-àbá pátápátá hàn. Ṣùgbọ́n “a kò tẹ̀ wa mọ́lẹ̀” jẹ́ ìkọ́lé tí kò tọ́ nínú Yorùbá fún ìṣe tí a ń ṣe sí wa; ó lè túmọ̀ sí pé ‘àwa kò tẹ ara wa mọ́lẹ̀.’ “A kò há mọ́” jẹ́ ọ̀nà Yorùbá tó dájú síi tí ó pa àwòrán ìhámọ́/ìdínkù inú στενοχωρούμενοι mọ́.
  naturalness: “A ń ní ìpọ́njú” àti “a kò há mọ́” jẹ́ èdè Yorùbá àkọ́ṣe, tí ó ní ìwọ̀ntúnwọ̀nsì tó yẹ fún ìforígbárí Pọ́ọ̀lù. “A ò mọ ohun tí a ó ṣe” jẹ́ kedere, ṣùgbọ́n a lè lo “a ń dààmú” ní ìpín kejì láti pa ìrísí àwọn participle Gíríìkì méjèèjì mọ́, pẹ̀lú ìtumọ̀ ìdàrúdàpọ̀ ju ìbànújẹ́ lásán lọ.
  terminology: “Ìpọ́njú,” “há mọ́,” “dààmú,” àti “àìní-àbá pátápátá” ń ṣètọ́jú ìyàtọ̀ tó wà láàrin θλίβω/στενοχωρέομαι àti ἀπορέω/ἐξαπορέω. “Àìní-àbá pátápátá” kì í fi ẹ̀kọ́ kan kún ẹsẹ náà nípa ìgbàgbọ́ tàbí ipò ọpọlọ.
