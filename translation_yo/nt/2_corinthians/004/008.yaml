id: 2CO.4.8
reference: 2 Corinthians 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: yo
  text: A ń ní ìpọ́njú ní gbogbo ọ̀nà[a], ṣùgbọ́n a kò há mọ́[b]; a ń dààmú, ṣùgbọ́n a kò wà ní àìní-àbá pátápátá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ohun gbogbo.” Gbólóhùn náà ń fi ìwọ̀n ìpọ́njú náà tó ká gbogbo apá hàn; kò gbọdọ̀ túmọ̀ sí pé ìpọ́njú náà yí wọn ká nípa ibi.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “a kò di ẹni tí a há sínú ibi tóóró.” Ọ̀rọ̀ Gíríìkì náà lo àwòrán híhá ènìyàn mọ́ tàbí fífi í sínú ààyè tóóró.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a kò wà ní àìní-àbá pátápátá.” Ọ̀rọ̀ Gíríìkì kejì mú “a ń dààmú” le sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: ní gbogbo ọ̀nà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìpọ́njú náà gbòòrò dé gbogbo apá ìgbésí ayé; kò pọndandan kí ó túmọ̀ sí pé ó yí wọn ká nípa ibi.
- source_word: θλιβόμενοι
  choice: A ń dojú kọ ìpọ́njú
  rationale: θλίβω ń sọ nípa fífi ìkìmọ́ tàbí ìnira bá ènìyàn. Gbólóhùn Yorùbá yìí jẹ́ ti òde òní, ó sì mú ìjìyà àti ìkìmọ́ inú ọ̀rọ̀ náà jáde láì da a pọ̀ mọ́ àwòrán ibi tóóró nínú ọ̀rọ̀ tó tẹ̀ lé e.
- source_word: στενοχωρούμενοι
  choice: a kò tẹ̀ wa mọ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán fífi ènìyàn sínú ibi tóóró tàbí híhá a mọ́. Ìtumọ̀ yìí sọ àbájáde tí Pọ́ọ̀lù sẹ́—pé ìpọ́njú kò tẹ̀ wọ́n mọ́lẹ̀—ní èdè Yorùbá tó ṣe déédé.
- source_word: ἀπορούμενοι
  choice: a ò mọ ohun tí a ó ṣe
  rationale: ἀπορέω túmọ̀ sí wíwà ní àìní-àbá tàbí àìmọ ohun tí ènìyàn yóò ṣe. Ìtumọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá, ó sì dá ìtumọ̀ náà dúró lórí ìdàrúdàpọ̀ dípò ìbànújẹ́ lásán.
- source_word: ἐξαπορούμενοι
  choice: a kò débi tí a ò rí ọ̀nà àbáyọ mọ́
  rationale: 'Ọ̀rọ̀ àkópọ̀ náà mú ἀπορέω le sí i: wíwà ní àìní-àbá pátápátá. Gbólóhùn yìí pa ìlọsíwájú láti àìmọ ohun tí a ó ṣe dé àìrí ọ̀nà àbáyọ mọ́, láì sọ ọ́ di ẹ̀kọ́ nípa pípàdánù ìgbàgbọ́.'
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: ṣùgbọ́n ... kò ...; ṣùgbọ́n ... kò
  rationale: Àtúnṣe ìtakora náà ṣe pàtàkì sí ìró àti agbára ẹsẹ yìí; “ṣùgbọ́n ... kò” jẹ́ ọ̀nà àdánidá láti pa á mọ́ ní Yorùbá.
theological_decisions:
- issue: Bí ìmúná ọ̀rọ̀ kejì nínú ἀπορούμενοι / ἐξαπορούμενοι ṣe lágbára tó
  choice: “a kò débi tí a ò rí ọ̀nà àbáyọ mọ́” láti fi ìmúná ọ̀rọ̀ àkópọ̀ náà hàn
  alternative: “a kò sọ̀rètí nù” tàbí “a kò wà ní àìní-àbá pátápátá”
  rationale: Àyíká ẹsẹ náà ń sọ nípa ìpọ́njú àwọn aposteli àti bí wọn kò ṣe tẹríba fún un. Ìtumọ̀ tí a yàn pa ìtumọ̀ àìní-àbá àti ìmúná ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ẹ̀kọ́ àkànṣe kan kún un nípa àìní ìgbàgbọ́ tàbí ipò ọpọlọ.
translation_notes:
  register: A lo Yorùbá àkọ́ṣe tó ní àmì ohùn ní kíkún, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ méjì náà àti ìtakora “ṣùgbọ́n ... kò” ni a pa mọ́. “Ọ̀nà àbáyọ” jẹ́ àwòrán àdánidá ní Yorùbá fún àìrí ohun tí a lè ṣe, láì sọ ìtumọ̀ náà di àlàyé ẹ̀kọ́ ìsìn.
