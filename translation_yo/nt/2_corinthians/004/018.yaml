  to: Bí a kò ṣe ń darí àfiyèsí wa sí àwọn ohun tí a ń rí, bí kò ṣe sí àwọn ohun tí a kò ń rí. Nítorí àwọn ohun tí a ń rí wà fún ìgbà díẹ̀[a], ṣùgbọ́n àwọn ohun tí a kò ń rí wà títí láé.
  rationale: A tún “Nígbà tí” ṣe sí “Bí a kò ṣe ń” nìkan, láti mú agbára participle σκοπούντων hàn gẹ́gẹ́ bí ìṣe tó ń bá ọ̀rọ̀ àyíká lọ, kì í ṣe gbolohun àkókò “nígbà tí.” Gbogbo ìtakora, ìsọ̀kan ọ̀rọ̀, àti àmì ẹsẹ̀ náà ni a pa mọ́.
