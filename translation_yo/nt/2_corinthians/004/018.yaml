id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: yo
  text: Bí a kò ṣe ń darí àfiyèsí wa sí àwọn ohun tí a ń rí, bí kò ṣe sí àwọn ohun tí a kò ń rí. Nítorí àwọn ohun tí a ń rí wà fún ìgbà díẹ̀[a], ṣùgbọ́n àwọn ohun tí a kò ń rí wà títí láé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí ‘ohun tí a ń rí ... ohun tí a kò ń rí’; tàbí ‘àwọn ohun tí ó ṣeé fojú rí ... àwọn ohun tí kò ṣeé fojú rí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: ń darí àfiyèsí wa sí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi àfiyèsí tàbí ojú inú sí ohun kan. Yíyan ‘darí àfiyèsí wa sí’ jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi ìtumọ̀ líle ju ti Gíríìkì lọ.
- source_word: μὴ
  choice: kò
  rationale: Ó jẹ́ ìsẹ́ nírọ̀rùn; kò ní ìtumọ̀ ‘kò ... mọ́’ tí yóò fi àfikún àkókò tí kò sí nínú Gíríìkì.
- source_word: τὰ βλεπόμενα
  choice: àwọn ohun tí a ń rí
  rationale: Ó pa ìṣọ̀kan ọ̀rọ̀ aláìlèsọ-orúkọ náà mọ́, ó sì jẹ́ kí ìyàtọ̀ tó wà láàárín ohun tí a ń rí àti ohun tí a kò ń rí hàn kedere.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Nínú ìlànà ‘kò ... bí kò ṣe,’ èyí fi ìtakora tó lágbára hàn lọ́nà Yorùbá tó mọ́gbọ́n dání.
- source_word: τὰ μὴ βλεπόμενα
  choice: àwọn ohun tí a kò ń rí
  rationale: Ó tẹ̀ lé ìṣọ̀kan gbolohun Gíríìkì, kò sì tú un sí ‘ohun tẹ̀mí,’ èyí tí ọ̀rọ̀ náà kò sọ ní tààràtà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó mú ìdí tàbí àlàyé fún gbólóhùn tó ṣáájú wọlé.
- source_word: πρόσκαιρα
  choice: wà fún ìgbà díẹ̀
  rationale: Ó sọ pé àwọn ohun náà ní àkókò tó ní òpin. Èyí jẹ́ èdè Yorùbá tó ṣe kedere, kò sì fi ‘ìṣẹ́jú díẹ̀’ kun ìtumọ̀ náà.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: Ó fi apá kejì ti ìtakora náà hàn kedere.
- source_word: αἰώνια
  choice: wà títí láé
  rationale: Nínú ìtakora pẹ̀lú πρόσκαιρα, ó tọ́ka sí ohun tí kò ní òpin; ‘wà títí láé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: ἡμῶν
  choice: àwa ... wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà ní genitive nínú Gíríìkì, Yorùbá nílò kókó gbangba; ‘àwa’ àti ‘wa’ mú ẹni tó ń ṣe iṣẹ́ náà hàn ní ti ẹ̀dá.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ohun tí a ń rí àti ohun tí a kò ń rí
  choice: 'Pa èdè gidi náà mọ́: ‘àwọn ohun tí a ń rí ... àwọn ohun tí a kò ń rí.’'
  alternative: ‘àwọn ohun ti ara ... àwọn ohun tẹ̀mí’ tàbí ‘ohun tí ó ṣeé fojú rí ... ohun tí kò ṣeé fojú rí’
  rationale: Pọ́ọ̀lù fi ohun tí a ń rí àti ohun tí a kò ń rí wéra, ṣùgbọ́n kò sọ wọn di ẹ̀ka ‘ohun ti ara’ àti ‘ohun tẹ̀mí’ ní tààràtà. Ìtumọ̀ yìí pa ìṣòro àti ààyè ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Èdè Yorùbá ìpele àárín, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ń darí àfiyèsí wa sí’ dípò àkànṣe ojú gangan, nítorí σκοπέω níbí ń sọ nípa ohun tí ènìyàn gbájú mọ́. A pa àmì ẹsẹ̀ [a] mọ́ nínú ọ̀rọ̀ pàtàkì.
