  terminology: A pa ìfararọ̀ “àwọn ohun tí a ń rí … àwọn ohun tí a kò ń rí” mọ́, láìdá wọn sí ohun ti ara àti ohun tẹ̀mí. “Fún ìgbà díẹ̀” àti “títí láé” fi πρόσκαιρα/αἰώνια hàn ní ìtakora tó yẹ.
