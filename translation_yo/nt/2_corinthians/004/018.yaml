  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtakora Gíríìkì náà mọ́ dáadáa: ohun tí a ń rí ni a kọ̀ láti gbájú mọ́, ohun tí a kò ń rí ni a sì ń gbájú mọ́; àwọn àkọ́kọ́ jẹ́ fún ìgbà díẹ̀, àwọn kejì sì jẹ́ ayérayé. Ṣùgbọ́n “Nígbà tí” fún participle σκοπούντων ń mú ìtumọ̀ àkókò “when” wọlé, ó sì ń fi gbolohun náà sílẹ̀ gẹ́gẹ́ bí gbolohun àìpé. “Bí a kò ṣe ń …” sún mọ́ agbára circumstantial “as/while” náà ju.'
