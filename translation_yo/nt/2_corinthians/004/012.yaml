id: 2CO.4.12
reference: 2 Corinthians 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: yo
  text: Nítorí náà, ikú ń ṣiṣẹ́ nínú wa, ṣùgbọ́n ìyè ń ṣiṣẹ́ nínú yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìparí ọ̀rọ̀ inú ẹsẹ 8–11 hàn ní Yorùbá àdánidá.
- source_word: ὁ θάνατος
  choice: ikú
  rationale: Ọ̀rọ̀ náà tọ́ka sí ikú gẹ́gẹ́ bí agbára tó ń ṣiṣẹ́ nínú ìjìyà àwọn aposteli; Yorùbá kò nílò àfihàn pàtó fún árítíkù Gíríìkì níbí.
- source_word: ἐν ἡμῖν
  choice: nínú wa
  rationale: Ó pa ìtumọ̀ tààrà àti ìfiwé pẹ̀lú ‘nínú yín’ mọ́, ó sì lè ní ìtumọ̀ ara ẹni àti ti àwùjọ.
- source_word: ἐνεργεῖται
  choice: ń ṣiṣẹ́
  rationale: Ó fi ìṣe tó ń bá a lọ àti agbára tó ń mú àbájáde wá hàn ní èdè Yorùbá tó rọrùn.
- source_word: ἡ δὲ ζωὴ
  choice: ṣùgbọ́n ìyè
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tí δέ dá sílẹ̀ láàárín ikú àti ìyè hàn; ‘ìyè’ pa ọ̀rọ̀ àkótán Gíríìkì mọ́.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó bá ‘nínú wa’ dọ́gba, ó sì jẹ́ kí ìtumọ̀ náà ṣí sí ẹni kọ̀ọ̀kan àti gbogbo ìjọ.
theological_decisions:
- issue: Ìtumọ̀ ìyàtọ̀ láàárín ikú àti ìyè
  choice: A pa ‘ikú’ àti ‘ìyè’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ kúkúrú tí kò túmọ̀ wọn sí ẹ̀ka kan ṣoṣo.
  alternative: Kí a túmọ̀ ikú sí ikú ti ara nìkan tàbí sí ikú sí ara ẹni, kí a sì túmọ̀ ìyè sí ìyè ẹ̀mí tàbí ìyè ayérayé nìkan.
  rationale: Àyíká ẹsẹ 10–11 so ikú àti ìyè Jésù pọ̀ mọ́ ara àti ìjìyà àwọn aposteli, nígbà tí iṣẹ́ ìránṣẹ́ wọn ń mú ìyè dé ọ̀dọ̀ àwọn ará Kọ́ríńtì. Fífipamọ́ ọ̀rọ̀ méjèèjì yàgò fún dídín ẹ̀kọ́ náà kù.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì ṣe àfihàn ìbáradọ́gba gbolohun Gíríìkì. A tún ‘ń ṣiṣẹ́’ sọ ní apá kejì láti jẹ́ kí gbolohun náà pé àti kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀-ìṣe náà sílẹ̀ níbẹ̀.
