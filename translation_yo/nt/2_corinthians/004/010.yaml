id: 2CO.4.10
reference: 2 Corinthians 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: yo
  text: Àwa ń gbé ikú Jésù[a] kiri nínú ara nígbà gbogbo, kí ìyè Jésù pẹ̀lú lè farahàn nínú ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kíkú Jésù.” Ọ̀rọ̀ orúkọ Gíríìkì náà lè tẹnu mọ́ ipò tàbí ìrírí ikú tí a ń ru nínú ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó fi hàn pé ohun náà ń ṣẹlẹ̀ ní gbogbo ìgbà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: νέκρωσιν
  choice: ikú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ipò tàbí ìrírí ikú. “Ikú” ṣe kedere, ó sì pa ìbáramu mọ́ pẹ̀lú “ìyè” ní apá kejì.
- source_word: τοῦ Ἰησοῦ
  choice: Jésù
  rationale: Ìtumọ̀ náà pa ìbáṣepọ̀ onígbẹ̀yìn Gíríìkì mọ́ láì pinnu ju bó ṣe yẹ lọ bóyá ó túmọ̀ sí ikú tí Jésù kú tàbí ikú tó ní í ṣe pẹ̀lú rẹ̀.
- source_word: ἐν τῷ σώματι
  choice: nínú ara
  rationale: Àkọ́kọ́ yìí kò ní arọ́pò-orúkọ ohun-ìní ní Gíríìkì; a kò fi “wa” kún un, kí ìtumọ̀ aṣojú tàbí àpapọ̀ lè dúró.
- source_word: περιφέροντες
  choice: a ń gbé ... kiri
  rationale: Ó sọ ìṣe tí ń bá a lọ, ó sì pa àwòrán ohun tí ènìyàn ń ru tàbí ń gbé kiri mọ́ ní Yorùbá àdánidá.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí fi ète tàbí àbájáde hàn lọ́nà Yorùbá tó ṣe kedere.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó pa ìbáramu àfikún tó wà láàárín ikú Jésù àti ìyè Jésù mọ́.
- source_word: ζωὴ
  choice: ìyè
  rationale: “Ìyè” jẹ́ ọ̀rọ̀ tó bójú mu ní àyíká ẹ̀kọ́ Bíbélì, ó sì tọ́ka sí ìyè Jésù ẹni tí ó jíǹde.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: nínú ara wa
  rationale: Ó pa ẹyọ ọ̀rọ̀ σώματι àti ohun-ìní ọ̀pọ̀ “wa” mọ́, gẹ́gẹ́ bí Gíríìkì, ó sì ṣeé lóye ní Yorùbá.
- source_word: φανερωθῇ
  choice: lè farahàn
  rationale: Ó sọ pé ìyè náà yóò di ohun tí a lè rí tàbí mọ̀, láì sọ ẹni tó mú un farahàn ní pàtó; báyìí ni agbára ọ̀rọ̀ ìṣe aláìlórúkọ Gíríìkì ṣe dúró.
theological_decisions:
- issue: Ìtumọ̀ νέκρωσις ní ìbáṣepọ̀ pẹ̀lú Jésù
  choice: ikú Jésù
  alternative: kíkú Jésù
  rationale: Àwọn méjèèjì ṣeé ṣe, ṣùgbọ́n “ikú” sún mọ́ ìtumọ̀ ọ̀rọ̀ náà, ó sì bá ìbáramu “ikú” àti “ìyè” mu láì fi ìtumọ̀ ẹ̀kọ́ kan tí ó dín kù wọ inú ẹsẹ náà.
- issue: Ẹyọ ara nínú gbolohun méjèèjì
  choice: ara; ara wa
  alternative: àwọn ara wa ní apá kejì
  rationale: Gíríìkì lo ẹyọ ní ibi méjèèjì. Dídá a sí ẹyọ pa ìlànà ọ̀rọ̀ àti ìmọ̀ àpapọ̀ iṣẹ́ àwọn aposteli mọ́.
translation_notes:
  register: Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A pa ẹyọ “ara” àti àìsí “wa” ní ìṣẹ̀lẹ̀ àkọ́kọ́ mọ́, a sì fi àmì ohùn síbi tí ó bá àṣà Yorùbá mu.
