id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: yo
  text: Nítorí a mọ̀ pé ẹni tí ó jí Jésù[a] dìde yóò tún jí àwa náà dìde pẹ̀lú Jésù, yóò sì mú wa dúró níwájú rẹ̀ pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “Olúwa Jésù” dípò “Jésù.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: nítorí a mọ̀ pé
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ yìí ní ìtumọ̀ ìdí nínú àyíká ọ̀rọ̀ náà; gbolohun yìí fi hàn pé ìmọ̀ yìí ni ìdí tí Pọ́ọ̀lù fi ń fara da ìpọ́njú.
- source_word: ὁ ἐγείρας
  choice: ẹni tí ó jí ... dìde
  rationale: Ó tọ́ka sí Ọlọ́run nípasẹ̀ ọ̀rọ̀-ìṣe aláṣàpèjúwe; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìṣe jíjí dìde mọ́.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ inú SBLGNT; a fi kíkà gígùn sí àlàyé ìsàlẹ̀ láti jẹ́ kí ẹ̀rí ìwé àfọwọ́kọ hàn gbangba.
- source_word: καὶ ἡμᾶς
  choice: yóò tún jí àwa náà dìde
  rationale: “tún” àti “náà” mú agbára àfikún καί jáde, wọ́n sì so àjíǹde àwọn onígbàgbọ́ pọ̀ mọ́ ti Jésù láì sọ pé ohun kan náà ni wọ́n.
- source_word: σὺν Ἰησοῦ
  choice: pẹ̀lú Jésù
  rationale: σύν pẹ̀lú ọ̀rọ̀-orúkọ dative fi ìbáṣepọ̀ tàbí ìjọpọ̀ hàn; “pẹ̀lú” pa ìtumọ̀ yẹn mọ́ láì yí i sí ohun-èlò bí “nípasẹ̀”.
- source_word: παραστήσει
  choice: yóò sì mú wa dúró níwájú rẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí mímú ẹnì kan dúró tàbí fífi í hàn níwájú ẹnì kan. Gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìrètí ọjọ́ iwájú náà mọ́ láì pinnu ibi ìṣẹ̀lẹ̀ náà ju Gíríìkì lọ.
- source_word: σὺν ὑμῖν
  choice: pẹ̀lú yín
  rationale: Ó pa ìtumọ̀ ìjọpọ̀ mọ́, ó sì fi hàn pé Pọ́ọ̀lù àti àwọn ará Kọ́ríńtì jọ ní ìrètí yìí.
theological_decisions:
- issue: Onírúurú kíkà lẹ́yìn ἐγείρας
  choice: A lo “Jésù” nínú ẹsẹ̀ gẹ́gẹ́ bí SBLGNT, a sì fi “Olúwa Jésù” sínú àlàyé ìsàlẹ̀.
  alternative: Kí a lo “Olúwa Jésù” nínú ẹsẹ̀ pàtàkì.
  rationale: Ọ̀ràn ẹ̀rí ìwé àfọwọ́kọ ni èyí, kì í ṣe yíyan ẹ̀kọ́ ìgbàgbọ́ kan. Àwọn kíkà méjèèjì jẹ́rìí sí àjíǹde Jésù; àlàyé ìsàlẹ̀ sì pa onírúurú kíkà náà mọ́ fún ìṣàyẹ̀wò.
- issue: Agbára ọjọ́ ìkẹyìn nínú παραστήσει
  choice: A túmọ̀ ọ́ sí pé Ọlọ́run yóò mú Pọ́ọ̀lù àti àwọn ará Kọ́ríńtì dúró níwájú rẹ̀ papọ̀ lẹ́yìn àjíǹde.
  alternative: Ìdáláre ní gbogbogbòò, tàbí fífi wọn hàn ní pàtó níwájú ìtẹ́ ìdájọ́ Kristi.
  rationale: Àyíká ọ̀rọ̀ àjíǹde tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú, ṣùgbọ́n Gíríìkì kò sọ ibi tàbí ìlànà rẹ̀ ní kíkún; nítorí náà, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó kọjá ọ̀rọ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá àgbàṣe òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Jí ... dìde” àti “mú ... dúró níwájú” jẹ́ àwọn ọ̀nà tí ó ṣe kedere fún òǹkàwé lásán, tí wọ́n sì sún mọ́ ìtumọ̀ Gíríìkì.
