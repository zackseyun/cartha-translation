id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: yo
  text: Kàkà bẹ́ẹ̀, a ti kọ àwọn ohun ìkọ̀kọ̀ tí ń mú ìtìjú wá sílẹ̀. A kò ń gbé ìgbésí ayé wa nínú àrékérekè, bẹ́ẹ̀ ni a kò fi ẹ̀tàn ba ọ̀rọ̀ Ọlọ́run jẹ́[b]. Ṣùgbọ́n, nípa mímú òtítọ́ hàn gbangba[a], a ń fi ara wa hàn sí gbogbo ẹ̀rí-ọkàn ènìyàn níwájú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìfarahàn òtítọ́.” Ọ̀rọ̀ Gíríìkì lè tẹnumọ́ mímú òtítọ́ di mímọ̀ ní gbangba, kì í ṣe ìkéde ẹnu nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kò da ohun mìíràn pọ̀ mọ́ ọ̀rọ̀ Ọlọ́run láti bà á jẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí fífi ẹ̀tàn yí ohun kan padà tàbí dín ìjẹ́mímọ́ rẹ̀ kù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: a ti kọ ... sílẹ̀
  rationale: Ó fi ìkọ̀sílẹ̀ tí ó ṣe pàtó àti tí ó lágbára hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: àwọn ohun ìkọ̀kọ̀ tí ń mú ìtìjú wá
  rationale: Ó pa ìbáṣepọ̀ láàárín ohun tí a fi pamọ́ àti ìtìjú mọ́, láì pinnu ju ohun tí Gíríìkì sọ lọ bóyá ìṣe náà fúnra rẹ̀ ni ó burú tàbí pé ìtìjú ni àbájáde rẹ̀.
- source_word: περιπατοῦντες
  choice: ń gbé ìgbésí ayé wa
  rationale: Ìtumọ̀ àpèjúwe ‘rìn’ níbí ni ìwà àti ọ̀nà ìgbésí ayé; gbólóhùn yìí jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν πανουργίᾳ
  choice: nínú àrékérekè
  rationale: ‘Àrékérekè’ sọ ọgbọ́n búburú àti ìwà ẹ̀tàn tí πανουργία ní nínú rẹ̀.
- source_word: δολοῦντες
  choice: fi ẹ̀tàn ba ... jẹ́
  rationale: Ó mú èrò fífi ẹ̀tàn yí ohun kan padà tàbí sọ ọ́ di aláìmọ́ hàn, láì dín un kù sí àṣìṣe lásán.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tí ó gbajúmọ̀, tí ó sì pa ìbú ọrọ λόγος mọ́ láì fi dandan sọ pé Ìwé Mímọ́ nìkan tàbí ìwàásù nìkan ni.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: nípa mímú òtítọ́ hàn gbangba
  rationale: Ó tẹnumọ́ ṣíṣí òtítọ́ payá tàbí mímú un hàn, láì sọ ọ́ di ìpolongo ẹnu nìkan.
- source_word: συνιστάνοντες ἑαυτούς
  choice: a ń fi ara wa hàn ... pé a yẹ fún ìtẹ́wọ́gbà
  rationale: Ó sọ èrò fífi ara ẹni hàn gẹ́gẹ́ bí ẹni tí ó yẹ fún ìtẹ́wọ́gbà ní Yorùbá tí ó ṣe kedere, láì fi ìgbéraga kún ọ̀rọ̀ náà.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: sí ẹ̀rí-ọkàn gbogbo ènìyàn
  rationale: Ó pa ìtúmọ̀ pínpín πᾶσαν àti ìtọ́kasí sí ìmọ̀ inú rere tàbí búburú ẹni kọ̀ọ̀kan mọ́.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ó ń rí, tí ó sì ń ṣe ìdájọ́ iṣẹ́ ìránṣẹ́ wọn.
theological_decisions:
- issue: Ìyàtọ̀ tí Pọ́ọ̀lù fi sáàárín iṣẹ́ ìránṣẹ́ ẹ̀tàn àti iṣẹ́ ìránṣẹ́ òtítọ́
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí àlàyé ìṣípayá àti ìwà títọ́ nínú iṣẹ́ ìránṣẹ́ aposteli.
  alternative: Kí a dín ọ̀rọ̀ náà kù sí lílo ọgbọ́n ọ̀rọ̀ ẹ̀tàn nìkan, tàbí kí a sọ ọ́ di ẹ̀kọ́ gbígbòòrò nípa gbogbo bí a ṣe ń lo Ìwé Mímọ́.
  rationale: Àyíká ẹsẹ náà dá lórí ìwà àti ìkéde àwọn aposteli. Ìtumọ̀ náà pa àyè yìí mọ́ láì fi ẹ̀kọ́ nípa ìmísí, iṣẹ́ àṣà mímọ́, tàbí ipò ṣọ́ọ̀ṣì tí kò farahàn kedere sínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ọ̀rọ̀ ode-òní tí ó ṣeé lóye ni a lò. A yan “gbé ìgbésí ayé” dípò pípa àpèjúwe “rìn” mọ́ ní tààrà, nítorí ó túmọ̀ ìwà ìgbésí ayé ní kedere. Àwọn àmì ohùn kún ibi tí wọ́n ti yẹ.
