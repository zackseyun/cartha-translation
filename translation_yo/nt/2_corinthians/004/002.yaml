  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbo rẹ̀: ìkọ̀sílẹ̀ ohun ìkọ̀kọ̀ ìtìjú, ìkọ̀sílẹ̀ àrékérekè àti yíyí ọ̀rọ̀ Ọlọ́run pa dà pẹ̀lú ẹ̀tàn, àti mímú òtítọ́ hàn. Síbẹ̀, ìparí náà, “pé a yẹ fún ìtẹ́wọ́gbà,” fi ìdájọ́ àfikún sí συνιστάνοντες ἑαυτούς; ọ̀rọ̀ náà ní ìtumọ̀ fífi ara ẹni hàn/tabi ìfihàn ara ẹni sí ẹ̀rí-ọkàn, kì í sọ ní tààrà pé ẹni náà yẹ fún ìtẹ́wọ́gbà.'
