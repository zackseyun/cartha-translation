  to: Kàkà bẹ́ẹ̀, a ti kọ àwọn ohun ìkọ̀kọ̀ tí ń mú ìtìjú wá sílẹ̀. A kò ń gbé ìgbésí ayé wa nínú àrékérekè, bẹ́ẹ̀ ni a kò fi ẹ̀tàn ba ọ̀rọ̀ Ọlọ́run jẹ́[b]. Ṣùgbọ́n, nípa mímú òtítọ́ hàn gbangba[a], a ń fi ara wa hàn sí gbogbo ẹ̀rí-ọkàn ènìyàn níwájú Ọlọ́run.
