id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: yo
  text: Nítorí àwa tí a wà láàyè ni a ń fi lé ikú lọ́wọ́ nígbà gbogbo nítorí Jésù,[a] kí ìyè Jésù náà lè farahàn nínú ẹran ara wa tí ó lè kú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nítorí ti Jésù’ tàbí ‘fún Jésù.’
    reason: lexical_alternative
  - marker: b
    text: ‘Ẹran ara’ níhìn-ín ń tọ́ka sí ara wa tí ó lè kú, kì í ṣe ‘ìwà ẹ̀ṣẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: nígbà gbogbo
  rationale: Ó fi ìṣe tí ń ṣẹlẹ̀ léraléra tàbí láìdáwọ́ dúró hàn, ó sì bá ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: àwa tí a wà láàyè
  rationale: Ó pa ìtẹnumọ́ ἡμεῖς àti ìtumọ̀ participle náà mọ́, ó sì dá ìyàtọ̀ láàárín ìyè àti ikú dúró.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: a ń fi lé ikú lọ́wọ́
  rationale: Àmì ‘ń’ pa ipa present tí ń bá a lọ mọ́; ‘fi lé ... lọ́wọ́’ ṣàfihàn passive παραδίδωμι àti fífi ẹni fún ewu ikú.
- source_word: διὰ Ἰησοῦν
  choice: nítorí Jésù
  rationale: διά pẹ̀lú accusative sábà ń tọ́ka sí ìdí tàbí ohun tí ó fa ìṣẹ̀lẹ̀; gbolohun yìí kò pinnu bóyá ìtumọ̀ náà ni ‘nítorí ìbáṣepọ̀ wa pẹ̀lú Jésù’ tàbí ‘nítorí iṣẹ́ Jésù.’
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó ṣàfihàn ète tàbí àbájáde láìfipá yan ọ̀kan nínú wọn.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó pa ìbámu mọ́ láàárín fífi wọn lé ikú lọ́wọ́ àti fífi ìyè Jésù hàn.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: ìyè Jésù
  rationale: Ó pa irú genitive Gíríìkì mọ́, ó sì dúró ní ìyàtọ̀ sí ‘ikú.’
- source_word: φανερωθῇ
  choice: lè fara hàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún passive subjunctive náà, láìfi ẹni tó mú un hàn kún ọ̀rọ̀.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: nínú ẹran ara wa tí ó lè kú
  rationale: ‘Ẹran ara’ pa σάρξ mọ́ gẹ́gẹ́ bí ìwàláàyè ti ara; ‘tí ó lè kú’ ṣàlàyé θνητός gẹ́gẹ́ bí ohun tí ikú lè dé bá.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: ẹran ara
  alternative: ara; ìwà ẹ̀ṣẹ̀
  rationale: Níhìn-ín, ‘tí ó lè kú’ fi hàn pé Pọ́ọ̀lù ń sọ nípa ara ènìyàn aláìlera tí ikú lè dé bá, kì í ṣe ìwà ẹ̀ṣẹ̀. ‘Ẹran ara’ pa ọ̀rọ̀ Gíríìkì náà mọ́ ju ‘ara’ lọ.
- issue: Ìbáṣepọ̀ tí διὰ Ἰησοῦν ń fi hàn
  choice: nítorí Jésù
  alternative: nítorí ti Jésù; fún Jésù
  rationale: Gíríìkì lè tọ́ka sí ìdí—wọn ń jìyà nítorí Jésù tàbí nítorí ìfaramọ́ wọn sí i. ‘Nítorí Jésù’ pa ààyè ìtumọ̀ yẹn mọ́ láìsọ ọ́ di ète nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A lo ‘a ń fi lé ... lọ́wọ́’ láti mú passive tí ń bá a lọ jáde, àti ‘ẹran ara’ láti pa àwòrán ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ṣèdíwọ́ fún àìgbọ́ye rẹ̀ gẹ́gẹ́ bí ìwà ẹ̀ṣẹ̀.
