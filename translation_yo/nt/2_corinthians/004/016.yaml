id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: yo
  text: Nítorí náà, a kò sọ ìgboyà nù. Ṣùgbọ́n bí ènìyàn wa ti òde tilẹ̀ ń bàjẹ́ lọ, síbẹ̀ ènìyàn wa ti inú ń di tuntun láti ọjọ́ dé ọjọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘ènìyàn wa ti òde’ àti ‘ènìyàn wa ti inú.’ Ọ̀rọ̀ Gíríìkì náà lo ‘ènìyàn’ ní ìtumọ̀ aṣojú, ó sì fi apá òde àti apá inú ìwà ènìyàn wéra.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí tí ó jáde láti inú àríyànjiyàn tó ṣáájú hàn ní ọ̀nà àdánidá àti ọ̀wọ̀.
- source_word: οὐκ ἐγκακοῦμεν
  choice: àárẹ̀ kò mú wa rẹ̀wẹ̀sì
  rationale: Ó sọ pé wọn kò sọ ìgboyà nù tàbí juwọ́ sílẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ἀλλ’ εἰ καὶ
  choice: Ṣùgbọ́n bí ... tilẹ̀
  rationale: Ìṣọ̀kan ‘bí ... tilẹ̀’ pa agbára ìyọ̀ǹda ọ̀rọ̀ Gíríìkì mọ́ láì pinnu bóyá a ó túmọ̀ ọ́ sí ‘bí ó tilẹ̀ jẹ́ pé’ tàbí ‘bí ... bá tilẹ̀’.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: ẹni ti òde wa
  rationale: ‘Ẹni’ dúró fún ènìyàn lápapọ̀, ‘ti òde wa’ sì pa àfiwé òde/inú mọ́ láì fi èrò nípa ara àti ọkàn kún un.
- source_word: διαφθείρεται
  choice: ń bàjẹ́ lọ
  rationale: Ó fi ìbàjẹ́ tàbí ìrẹ̀wẹ̀sì tí ń bá a lọ hàn, kì í ṣe ìparun lẹ́sẹ̀kẹsẹ̀.
- source_word: ὁ ἔσω ἡμῶν
  choice: ẹni ti inú wa
  rationale: Ó bá ‘ẹni ti òde wa’ dọ́gba, ó sì pa àfiwé tí Pọ́ọ̀lù mọ̀ọ́mọ̀ ṣe mọ́.
- source_word: ἀνακαινοῦται
  choice: ń di tuntun
  rationale: Ó ṣàfihàn ìsọ̀dọ̀tun tí ń bá a lọ; ọ̀rọ̀ náà ṣí sí ẹni tó ń ṣe ìsọ̀dọ̀tun bíi ti pàṣípààrọ̀ Gíríìkì.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: láti ọjọ́ dé ọjọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣẹ̀lẹ̀ tí ń tẹ̀ síwájú lójoojúmọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ὁ ἔξω ἄνθρωπος àti ὁ ἔσω
  choice: ẹni ti òde wa / ẹni ti inú wa
  alternative: ènìyàn òde wa / ènìyàn inú wa; ara òde wa / ọkàn inú wa
  rationale: Àṣàyàn náà pa àfiwé ènìyàn òde àti ènìyàn inú mọ́, ṣùgbọ́n kò sọ ọ́ di ẹ̀kọ́ pàtó nípa pípín ènìyàn sí ara àti ọkàn ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó ti yẹ, pẹ̀lú èdè ọlọ́wọ̀ tí ó ṣeé lóye. ‘Ẹni ti òde wa / ẹni ti inú wa’ jẹ́ àdánidá ju ìtumọ̀ líle ‘ènìyàn òde wa / ènìyàn inú wa’ lọ, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìfarahàn ọ̀rọ̀ Gíríìkì mọ́.
