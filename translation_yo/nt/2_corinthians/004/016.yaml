  to: Nítorí náà, a kò sọ ìgboyà nù. Ṣùgbọ́n bí ènìyàn wa ti òde tilẹ̀ ń bàjẹ́ lọ, síbẹ̀ ènìyàn wa ti inú ń di tuntun láti ọjọ́ dé ọjọ́.[a]
