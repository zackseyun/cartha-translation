id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: yo
  text: Ní tiwọn, ọlọ́run ìgbà ayé yìí[b] ti fọ́ ọkàn àwọn aláìgbàgbọ́ lójú, kí ìmọ́lẹ̀ ìhìn rere nípa ògo Mèsáyà[c], ẹni tí í ṣe àwòrán Ọlọ́run, má bàa tàn sí wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọn má bàa rí ìmọ́lẹ̀ ìhìn rere nípa ògo Mèsáyà.” Ọ̀rọ̀-ìṣe Gíríìkì tó ṣọ̀wọ́n níbí lè tẹnu mọ́ bí ìmọ́lẹ̀ ṣe ń tàn tàbí bí àwọn ènìyàn ṣe ń rí i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọlọ́run ayé yìí.” Ọ̀rọ̀ Gíríìkì aiōn sábà máa ń túmọ̀ sí “ìgbà ayé” tàbí “sáà,” ó sì ń tẹnu mọ́ sáà búburú tó wà yìí.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì Christos; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Nínú ọ̀ràn wọn
  rationale: Ó tọ́ka sí àwọn tí kò gba ìhìn rere gbọ́ nínú àyíká ẹsẹ tó ṣáájú, ó sì yẹra fún ìtumọ̀ pé agbára kan ń gbé inú wọn.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: ọlọ́run ìgbà ayé yìí
  rationale: “Ìgbà ayé” mú ìtumọ̀ αἰών gẹ́gẹ́ bí sáà tàbí àkókò tó wà yìí jáde, dípò gbogbo ayé ẹ̀dá; lẹ́tà kékeré fi hàn pé kì í ṣe Ọlọ́run tòótọ́.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: ti sọ èrò inú ... di afọ́jú
  rationale: Ọ̀rọ̀ yìí pa àwòrán afọ́jú mọ́, ó sì lo “èrò inú” fún agbára ìrònú àti òye tí νόημα ń tọ́ka sí níbí.
- source_word: τῶν ἀπίστων
  choice: àwọn aláìgbàgbọ́
  rationale: Ó túmọ̀ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ sí àwọn tí kò gbàgbọ́ láìfi ẹ̀sùn míì kún un.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: kí ... má bàa tàn sí wọn
  rationale: Ó fi ète tàbí àbájáde gbolohun Gíríìkì hàn, ó sì mú ìmọ́lẹ̀ gẹ́gẹ́ bí ohun tí ń tàn; àìdánilójú nípa bóyá ọ̀rọ̀ náà túmọ̀ sí “rí” wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: ìmọ́lẹ̀ ìhìn rere
  rationale: “Ìmọ́lẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa àkàwé φωτισμός mọ́; “ìhìn rere” jẹ́ ìtumọ̀ taara àti àgbáyé fún εὐαγγέλιον.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: nípa ògo Mèsáyà
  rationale: Ó pa “ògo” mọ́ gẹ́gẹ́ bí orúkọ, ó sì sọ ìbáṣepọ̀ àwọn ọ̀rọ̀ náà ní Yorùbá àdánidá; Χριστός ń ṣiṣẹ́ bí oyè níbí.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: ẹni tí í ṣe àwòrán Ọlọ́run
  rationale: Ó pa ìdánimọ̀ Kristẹni tó wà nínú Gíríìkì mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
theological_decisions:
- issue: Ẹni tí “ọlọ́run ìgbà ayé yìí” ń tọ́ka sí
  choice: A pa gbólóhùn orísun náà mọ́ gẹ́gẹ́ bí “ọlọ́run ìgbà ayé yìí,” pẹ̀lú lẹ́tà kékeré.
  alternative: Láti sọ ọ́ ní tààrà pé “Sátánì” tàbí pé ó jẹ́ ètò ayé aláìlẹ́mìí kan.
  rationale: Ọ̀rọ̀ Gíríìkì fi agbára ibi ẹni-lẹ́mìí kan hàn, ṣùgbọ́n kò pe orúkọ Sátánì ní ẹsẹ yìí; ìtumọ̀ kò gbọ́dọ̀ sọ ohun tí orísun kò sọ ní tààrà.
- issue: Ìṣe αὐγάσαι pẹ̀lú φωτισμός
  choice: Ìmọ́lẹ̀ ìhìn rere ni kò tàn sí àwọn aláìgbàgbọ́.
  alternative: Àwọn aláìgbàgbọ́ ni kò rí ìmọ́lẹ̀ ìhìn rere.
  rationale: Ọ̀rọ̀-ìṣe náà ṣọ̀wọ́n, ìṣètò rẹ̀ sì lè gba ìtumọ̀ méjèèjì; àkọsílẹ̀ pàtàkì yan ìtumọ̀ tó bá “ìmọ́lẹ̀” mu jù, àlàyé ìsàlẹ̀ sì pa èkejì mọ́.
- issue: Agbára ẹ̀kọ́ ní “àwòrán Ọlọ́run”
  choice: A túmọ̀ ọ́ ní tààrà pé Mèsáyà ni àwòrán Ọlọ́run.
  alternative: Láti fi àwọn ọ̀rọ̀ ẹ̀kọ́ nípa ìwà Ọlọ́run tàbí ẹ̀dá Mèsáyà kún un.
  rationale: Ìtumọ̀ náà pa ìjẹ́wọ́ pàtàkì ẹsẹ náà mọ́, ṣùgbọ́n kò gbé ọ̀rọ̀ ẹ̀kọ́ tó péye ju ohun tí Gíríìkì sọ lọ wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Ọlọ́run” ni a fi lẹ́tà ńlá kọ fún Ọlọ́run tòótọ́, ṣùgbọ́n “ọlọ́run” ní lẹ́tà kékeré ni a lò fún agbára afipò tí ẹsẹ náà mẹ́nu kàn.
