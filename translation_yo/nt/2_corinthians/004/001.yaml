  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti ní iṣẹ́ ìránṣẹ́ yìí, gẹ́gẹ́ bí a ṣe rí àánú gbà, a kì í rẹ̀wẹ̀sì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìyọrísí hàn.
- source_word: τὴν διακονίαν ταύτην
  choice: iṣẹ́ ìránṣẹ́ yìí
  rationale: διακονία túmọ̀ sí iṣẹ́ tí a ń ṣe fún ẹlòmíràn; nínú àyíká yìí, ó ń tọ́ka sí iṣẹ́ ìránṣẹ́ aposteli tí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ gbà.
- source_word: καθὼς ἠλεήθημεν
  choice: gẹ́gẹ́ bí a ti rí àánú gbà
  rationale: Ó pa ìbáṣepọ̀ καθὼς mọ́ láì sọ pàtó ju orísun lọ bóyá ó ń fi ìbámu, ìdí, tàbí ọ̀nà gbígba iṣẹ́ náà hàn; fọ́ọ̀mù àìṣe ἠλεήθημεν ni a túmọ̀ sí ‘rí àánú gbà.’
- source_word: οὐκ ἐγκακοῦμεν
  choice: àárẹ̀ kò mú wa rẹ̀wẹ̀sì
  rationale: ἐγκακέω túmọ̀ sí jíjọ̀wọ́ tàbí pípadà sẹ́yìn nítorí ìrẹ̀wẹ̀sì; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó gba ìtumọ̀ náà mú.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín iṣẹ́ ìránṣẹ́ àti àánú
  choice: Pa ‘gẹ́gẹ́ bí’ mọ́
  alternative: ‘nítorí pé a rí àánú gbà’ tàbí ‘nípa àánú tí a rí gbà’
  rationale: καθὼς kò fi dandan sọ ìdí tààrà; yíyàn ‘gẹ́gẹ́ bí’ pa àìdájú àti ìfúnpọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ọ̀pọ̀ arọ́pò-orúkọ ‘a/wa’ gẹ́gẹ́ bí orísun.
