  source_fidelity: 'Ìtumọ̀ náà pa àkàwé ìṣúra nínú ohun èlò amọ̀ mọ́, ó sì fi ète ἵνα hàn. Ṣùgbọ́n ìparí gbolóhùn àkọ́kọ́ náà, “kí ó má sì ṣe wá láti ọ̀dọ̀ wa,” kò ṣeé lóye ní ti gírámà Yorùbá, nítorí ó dà bí ẹni pé “wa” ni kì í ṣe ohun kan. Àtúnṣe náà mú ἐξ ἡμῶν hàn ní kedere gẹ́gẹ́ bí orísun: “kí ó má sì wá láti ọ̀dọ̀ wa.” “Agbára tí ó tayọ náà” jẹ́ ọ̀nà adayébá láti sọ ἡ ὑπερβολὴ τῆς δυνάμεως láìfi ìtumọ̀ àfikún kún un.'
