  to: Ṣùgbọ́n a ní ìṣúra yìí nínú àwọn ìkòkò amọ̀[ a ], kí agbára tí ó tayọ náà[ b ] lè jẹ́ ti Ọlọ́run, kí ó má sì wá láti ọ̀dọ̀ wa.
