id: 2CO.4.7
reference: 2 Corinthians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: yo
  text: Ṣùgbọ́n a ní ìṣúra yìí nínú àwọn ìkòkò amọ̀[ a ], kí agbára tí ó tayọ náà[ b ] lè jẹ́ ti Ọlọ́run, kí ó má sì wá láti ọ̀dọ̀ wa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχομεν
  choice: a ní
  rationale: Ó ṣàfihàn ọ̀rọ̀ ìní ní àkókò ìsinsìnyí, ẹni àkọ́kọ́ púpọ̀, ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ àti ìyípadà ọ̀rọ̀ mọ́ láti inú àyíká ẹsẹ tó ṣáájú.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ìṣúra yìí
  rationale: Ó pa àwòrán ìṣúra àti atọ́ka sí ohun tí a ti sọ ṣáájú mọ́ láìṣe àlàyé àfikún.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: nínú àwọn ìkòkò amọ̀
  rationale: ὀστράκινος túmọ̀ sí ohun tí a fi amọ̀ tí a sun ṣe, σκεῦος sì jẹ́ ohun èlò tàbí àpò; “ìkòkò amọ̀” jẹ́ àwòrán adayébá, tó sì fi àìlera àti ẹlẹgẹ́ hàn.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ètò yìí jẹ́ ọ̀nà Yorùbá adayébá láti fi ète tàbí àbájáde hàn láìfipá yan ọ̀kan ṣoṣo.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: títóbi agbára náà tí ó kọjá ìwọ̀n
  rationale: Ó pa ìtumọ̀ ìwọ̀n tó tayọ tàbí tó kọjá ààlà mọ́, ó sì tún pa ìṣètò ọ̀rọ̀ orúkọ inú Gíríìkì mọ́ dípò kí a sọ ọ́ di “agbára ńlá” lásán.
- source_word: ᾖ τοῦ θεοῦ
  choice: lè jẹ́ ti Ọlọ́run
  rationale: “Lè jẹ́” bá subjunctive lẹ́yìn ἵνα mu, “ti Ọlọ́run” sì pa genitive náà mọ́ láìfi ọ̀rọ̀ “hàn pé” kún un.
- source_word: καὶ μὴ ἐξ ἡμῶν
  choice: kí ó má sì ṣe wá láti ọ̀dọ̀ wa
  rationale: Ó fi orísun hàn gẹ́gẹ́ bí ἐξ, kì í ṣe ohun-ìní lásán, ó sì pa ìyàtọ̀ tó wà láàárín Ọlọ́run àti àwa mọ́.
theological_decisions:
- issue: Ìtumọ̀ àkàwé “ìṣúra” àti “ìkòkò amọ̀”
  choice: A pa àkàwé náà mọ́ láìsọ ní pàtó pé ìṣúra ni ìhìnrere tàbí pé ìkòkò ni ara ènìyàn.
  alternative: “ìṣúra ìhìnrere yìí” tàbí “nínú ara wa tí ó jẹ́ aláìlera”
  rationale: Àyíká ọ̀rọ̀ lè ṣàlàyé àkàwé náà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò tú u; àfikún bẹ́ẹ̀ yóò ju ohun tí Gíríìkì sọ lọ.
- issue: Agbára ète tàbí àbájáde nínú ἵνα
  choice: A lo “kí ... lè,” èyí tó lè gba ìtumọ̀ ète pẹ̀lú ìfarahàn àbájáde.
  alternative: Ìtumọ̀ àbájáde nìkan, bí “nípa bẹ́ẹ̀ ...”
  rationale: ἵνα lè ní ojú ìtumọ̀ méjèèjì nínú ọ̀rọ̀ Pọ́ọ̀lù; “kí ... lè” pa ìfarapa yìí mọ́ láìyanju rẹ̀ ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Ìkòkò amọ̀” jẹ́ àwòrán tó yé àwọn òǹkàwé lónìí; gbólóhùn nípa agbára sì mọ̀ọ́mọ̀ dúró sún mọ́ ìṣètò Gíríìkì láti pa ìtẹnumọ́ rẹ̀ mọ́.
