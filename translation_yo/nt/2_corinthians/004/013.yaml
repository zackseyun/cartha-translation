id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: yo
  text: Ṣùgbọ́n, níwọ̀n bí a ti ní ẹ̀mí ìgbàgbọ́ kan náà[a], gẹ́gẹ́ bí a ti kọ ọ́ pé, “Mo gbàgbọ́, nítorí náà ni mo ṣe sọ̀rọ̀,” àwa náà gbàgbọ́, nítorí náà ni àwa náà ṣe ń sọ̀rọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe kí “ẹ̀mí ìgbàgbọ́ kan náà” tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tó ń fúnni ní ìgbàgbọ́, dípò ìṣarasíhùwà ìgbàgbọ́ tí wọ́n jọ ní.
    reason: alternative_reading
  - marker: b
    text: Paulu ń fa ọ̀rọ̀ yọ láti Sáàmù 116:10 (115:1 nínú Septuagint), ó sì ń fi ìgbàgbọ́ àti sísọ̀rọ̀ tiwa bá ẹ̀rí onísáàmù náà mu.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες
  choice: bí a ti ní
  rationale: Ó gbé ìtumọ̀ participle náà jáde láì sọ ọ́ di gbólóhùn ìdí tó lágbára ju ti Gíríìkì lọ, ó sì so ọ́ mọ́ ọ̀rọ̀ pàtàkì tó tẹ̀ lé e.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré tàbí ìtẹ̀síwájú nínú àríyànjiyàn Paulu hàn.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: ẹ̀mí ìgbàgbọ́ kan náà
  rationale: 'Ọ̀rọ̀ yìí dáàbò bo àìdánilójú Gíríìkì: ó lè tọ́ka sí ìṣarasíhùwà tí ìgbàgbọ́ ń darí, tàbí sí Ẹ̀mí Mímọ́. A kò fi “Mímọ́” kún un nínú ọ̀rọ̀ pàtàkì.'
- source_word: κατὰ τὸ γεγραμμένον
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn tí ń mú àyọlò Ìwé Mímọ́ wọlé.
- source_word: Ἐπίστευσα
  choice: Mo gbàgbọ́
  rationale: Ó tú ọ̀rọ̀-ìṣe aorist náà ní tààrà, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ìgbàgbọ́.
- source_word: διὸ
  choice: nítorí náà ni ... ṣe
  rationale: Ìṣètò Yorùbá yìí fi àbájáde tàbí ìparí èrò tí διό ní hàn kedere ní ibi méjèèjì.
- source_word: ἐλάλησα
  choice: mo sọ̀rọ̀
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá fún λαλέω nínú àyọlò náà.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: àwa náà gbàgbọ́
  rationale: “Àwa” àti “náà” pa ìtẹnumọ́ àti ìfiwéra pẹ̀lú ẹni tó sọ Sáàmù náà mọ́.
- source_word: διὸ καὶ λαλοῦμεν
  choice: nítorí náà ni àwa náà ṣe ń sọ̀rọ̀
  rationale: Ó pa ìṣọ̀kan ọ̀rọ̀ mọ́ pẹ̀lú àyọlò náà, ó sì fi iṣe tó ń lọ lọ́wọ́ hàn nípasẹ̀ “ń sọ̀rọ̀.”
theological_decisions:
- issue: Bóyá πνεῦμα ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí/ìṣarasíhùwà ìgbàgbọ́ tí àwọn ènìyàn jọ ní
  choice: ẹ̀mí ìgbàgbọ́ kan náà
  alternative: Ẹ̀mí kan náà tí ń fúnni ní ìgbàgbọ́, ìyẹn Ẹ̀mí Mímọ́
  rationale: Àyíká ọ̀rọ̀ so gbólóhùn náà mọ́ ẹ̀rí onísáàmù pé ó gbàgbọ́, nítorí náà ó sọ̀rọ̀. Síbẹ̀, Gíríìkì kò fòpin sí ṣíṣe àfihàn rẹ̀ sí Ẹ̀mí Mímọ́; àlàyé ìsàlẹ̀ ojú ewé ni ó pa àṣàyàn yẹn mọ́.
- issue: Bí a ṣe tú ìdílé ọ̀rọ̀ πιστ-
  choice: gbàgbọ́ / ìgbàgbọ́
  alternative: gbẹ́kẹ̀ lé / ìgbẹ́kẹ̀lé
  rationale: “Gbàgbọ́” àti “ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, wọ́n sì pa ìbáṣepọ̀ orísun ọ̀rọ̀ πίστις/πιστεύω mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tó yẹ. Ìṣètò “nítorí náà ni ... ṣe” jẹ́ ti Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ ìdí-àbájáde inú Gíríìkì mọ́; “àwa náà” tún pa ìtẹnumọ́ καὶ ἡμεῖς mọ́.
