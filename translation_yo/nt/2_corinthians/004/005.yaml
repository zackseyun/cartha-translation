review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ìtakora náà, ohun tí a ń kéde nípa Mèsáyà Jésù gẹ́gẹ́ bí Olúwa, àti ipò àwọn akọ̀wé gẹ́gẹ́ bí ẹrú àwọn olùgbọ́ ni a ti pa mọ́. “Nítorí ti Jésù” lè dà bí ‘nípa Jésù’ ní Yorùbá òde òní ju bí ìdí/mọ́tífù ti διά + accusative ṣe rí lọ.'
