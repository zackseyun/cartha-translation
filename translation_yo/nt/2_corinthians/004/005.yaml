  terminology: “Mèsáyà,” “Olúwa,” àti “ẹrú” jẹ́ yíyan tó bá àwọn ìpinnu ìtumọ̀ mu. “Ẹrú yín” pa agbára δοῦλοι mọ́, nígbà tí àlàyé ìsàlẹ̀ ṣe ìwọ̀ntúnwọ̀nsì pẹ̀lú “ìránṣẹ́ yín.”
  issues:
