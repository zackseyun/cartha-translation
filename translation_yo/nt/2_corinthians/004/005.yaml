revisions:
- from: Nítorí pé kì í ṣe ara wa ni à ń kéde, bí kò ṣe Mèsáyà Jésù[a] gẹ́gẹ́ bí Olúwa; àwa fúnra wa sì jẹ́ ẹrú yín[b] nítorí ti Jésù.[c]
  to: Nítorí pé kì í ṣe ara wa ni à ń kéde, bí kò ṣe Mèsáyà Jésù[a] gẹ́gẹ́ bí Olúwa; àwa fúnra wa sì jẹ́ ẹrú yín[b] nítorí Jésù[c].
  rationale: Àtúnṣe náà jẹ́ ti ìṣàn-ọrọ̀ Yorùbá àti ìmúdájú ìtumọ̀ ìdí/mọ́tífù nìkan. Kò yí ìtakora, oyè Mèsáyà Jésù gẹ́gẹ́ bí Olúwa, tàbí agbára ‘ẹrú yín’ padà.
  reviewer_model: gpt-5.6-terra
