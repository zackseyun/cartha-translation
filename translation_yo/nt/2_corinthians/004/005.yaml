id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: yo
  text: Nítorí pé kì í ṣe ara wa ni à ń kéde, bí kò ṣe Mèsáyà Jésù[a] gẹ́gẹ́ bí Olúwa; àwa fúnra wa sì jẹ́ ẹrú yín[b] nítorí Jésù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ “Kristi” nígbà tí ó bá ń ṣiṣẹ́ bí apá kan nínú orúkọ; níbí a mú un gẹ́gẹ́ bí oyè “Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìránṣẹ́ yín.” Ọ̀rọ̀ Gíríìkì δοῦλοι lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; “ẹrú” pa ìtumọ̀ ìtẹríba tó lágbára mọ́ ní ìyàtọ̀ sí Jésù gẹ́gẹ́ bí Olúwa.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nítorí ti Jésù.” Gbólóhùn Gíríìkì náà ń fi Jésù hàn gẹ́gẹ́ bí ìdí tàbí ohun tó sún wọn láti jẹ́ ẹrú yín.
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: à ń kéde
  rationale: “Kéde” fi ìtumọ̀ pípolongo ní gbangba hàn, láì fi ọ̀rọ̀ náà mọ́ ìwàásù inú ìjọ nìkan.
- source_word: ἑαυτοὺς
  choice: ara wa / àwa fúnra wa
  rationale: A pa àtúnlò arọ́pò-orúkọ afarapamọ́ náà mọ́ láti mú ìyàtọ̀ láàárín ẹni tí wọ́n ń kéde àti ipò Pọ́ọ̀lù pẹ̀lú àwọn alábáṣiṣẹ́ rẹ̀ hàn.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mèsáyà Jésù
  rationale: A lo “Mèsáyà” gẹ́gẹ́ bí oyè níbí, a sì tẹ̀ lé bí àwọn ọ̀rọ̀ náà ṣe tò nínú Gíríìkì.
- source_word: κύριον
  choice: gẹ́gẹ́ bí Olúwa
  rationale: “Olúwa” ni ìtumọ̀ κύριος níbí; “gẹ́gẹ́ bí” sì fi hàn pé jíjẹ́ Olúwa ni ohun tí wọ́n ń kéde nípa Jésù.
- source_word: δούλους
  choice: ẹrú
  rationale: “Ẹrú” pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì mú ìtẹríba wọn yọ ní ìyàtọ̀ sí Jésù tí í ṣe Olúwa.
- source_word: ὑμῶν
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníhun yìí sọ ìbáṣepọ̀ ìsìn wọn sí àwọn ará Kọ́ríńtì ní ọ̀nà àdánidá ní Yorùbá.
- source_word: διὰ Ἰησοῦν
  choice: nítorí ti Jésù
  rationale: 'διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ìdí tàbí ohun tó fà á níbí: ipò ẹrú wọn fún àwọn onígbàgbọ́ wá látàrí Jésù.'
theological_decisions:
- issue: 'Bí a ṣe túmọ̀ Χριστός: oyè tàbí apá kan orúkọ'
  choice: 'Oyè: “Mèsáyà”'
  alternative: “Kristi”
  rationale: Àyíká ọ̀rọ̀ náà ń gbé ẹni tí wọ́n ń kéde kalẹ̀, nítorí náà agbára Χριστός gẹ́gẹ́ bí oyè ṣì hàn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn mọ́.
- issue: Ipa κύριον nínú Χριστὸν Ἰησοῦν κύριον
  choice: “Mèsáyà Jésù gẹ́gẹ́ bí Olúwa”
  alternative: “Mèsáyà Jésù, Olúwa” tàbí “Mèsáyà Jésù ni Olúwa”
  rationale: “Gẹ́gẹ́ bí Olúwa” pa ìṣètò Gíríìkì àti ipa κύριον gẹ́gẹ́ bí ohun tí a sọ nípa Jésù mọ́, láì fi ọ̀rọ̀-ìṣe tuntun kún un.
- issue: Agbára δοῦλοι nínú ìyàtọ̀ sí κύριον
  choice: “ẹrú yín”
  alternative: “ìránṣẹ́ yín”
  rationale: “Ẹrú” pa ìtẹríba tó lágbára mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí òǹkàwé rí àṣàyàn Yorùbá tó rọrùn sí i.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó lọ́lá, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. “Kì í ṣe … bí kò ṣe …” mú ìtakora inú ẹsẹ náà jáde; semicolon sì ya ohun tí wọ́n ń kéde sọ́tọ̀ kúrò nínú ipò wọn sí àwọn ará Kọ́ríńtì.
