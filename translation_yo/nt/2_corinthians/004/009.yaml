id: 2CO.4.9
reference: 2 Corinthians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διωκόμενοι ἀλλ’ οὐκ ἐγκαταλειπόμενοι, καταβαλλόμενοι ἀλλ’ οὐκ ἀπολλύμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: yo
  text: a ń ṣe ìnúnibíni sí wa, ṣùgbọ́n a kò fi wa sílẹ̀[a]; a ń lu wa lulẹ̀[b], ṣùgbọ́n a kò pa wa run,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò ṣá wa tì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ń ju wa lulẹ̀” tàbí “a ń sọ wa lulẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διωκόμενοι
  choice: a ń ṣe inúnibíni sí wa
  rationale: Ó fi hàn pé àwọn alátakò ń lé wọn, wọ́n sì ń pọ́n wọn lójú; ó tún bá ìṣe tí ó ń lọ níwájú mu.
- source_word: ἐγκαταλειπόμενοι
  choice: a kò kọ̀ wá sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé a kò ṣá wọn tì tàbí fi wọ́n sílẹ̀ láìsí ìrànlọ́wọ́; èdè náà jẹ́ ti òde òní, ó sì yàgò fún ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí ní pàtó nínú ẹsẹ náà.
- source_word: καταβαλλόμενοι
  choice: a ń lù wá ṣubú
  rationale: Ó pa àwòrán jíjẹ́ kí ènìyàn ṣubú lulẹ̀ mọ́, ó sì dùn bí Yorùbá àdánidá ju ìtumọ̀ ọ̀rọ̀-kọ̀ọ̀kan lọ.
- source_word: ἀπολλύμενοι
  choice: a kò pa wá run
  rationale: Ó mú ìyàtọ̀ láàárín lílù wọ́n ṣubú àti pípa wọ́n run hàn kedere.
- source_word: ἀλλ’ οὐκ
  choice: ṣùgbọ́n a kò
  rationale: Ó dá ìlòdì méjèèjì dúró ní kíkún, ó sì pa ìlù ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ἐγκαταλειπόμενοι yẹ kí ó jẹ́ ọ̀rọ̀ ìbílẹ̀ ẹ̀sìn tó túmọ̀ sí ‘kọ̀ sílẹ̀’ tàbí gbólóhùn ojoojúmọ́ tó túmọ̀ sí ‘fi sílẹ̀.’
  choice: a kò kọ̀ wá sílẹ̀
  alternative: a kò fi wá sílẹ̀
  rationale: ‘Kọ̀ wá sílẹ̀’ ṣàfihàn pípa ènìyàn tì ní kedere láìfi ọ̀rọ̀ kun un pé ta ni kò kọ̀ wọ́n sílẹ̀; báyìí ni a ṣe pa àìsọ ẹni tó ń ṣe ìṣe náà àti ìfọkànsìn ẹsẹ náà mọ́.
translation_notes:
  register: Èdè Yorùbá tí ó bójú mu, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye ni a lò. Ìtẹ̀síwájú ‘a ń … wa’ pa ìrísí àwọn ọ̀rọ̀ aláìṣe Gíríìkì àti ìṣe tí ó ń lọ mọ́; àwọn àmì ohùn sì wà níbi tí wọ́n ti yẹ.
