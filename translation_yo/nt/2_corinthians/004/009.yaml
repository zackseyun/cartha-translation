  source_fidelity: 'Ìtumọ̀ náà pa ìfararọ̀ méjèèjì nínú Gíríìkì mọ́: ìnúnibíni ṣùgbọ́n kì í ṣe fífi sílẹ̀; lílù lulẹ̀ ṣùgbọ́n kì í ṣe píparun. Àtúnṣe kékeré náà mú καταβαλλόμενοι hàn ní kedere gẹ́gẹ́ bí lílù ènìyàn dé ilẹ̀, kì í ṣe lílù tí ó lè dà bí ohun mìíràn.'
