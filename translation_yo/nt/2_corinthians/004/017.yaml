id: 2CO.4.17
reference: 2 Corinthians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: yo
  text: Nítorí ìpọ́njú wa tí ó fẹ́rẹ́, tí ó sì wà fún ìgbà díẹ̀ yìí, ń mú ìwúwo ògo ayérayé tí ó ga ju gbogbo àfiwé lọ wá fún wa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìwọ̀n tí ó ga jù lọ.” Ní Gíríìkì ní ti gidi, “gẹ́gẹ́ bí àpọ̀jù dé àpọ̀jù”; ọ̀nà àsọyé ni èyí tí ń fi ìwọ̀n àrà ọ̀tọ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: tí ó wà fún ìgbà díẹ̀ yìí
  rationale: Ó fi hàn pé ìpọ́njú náà jẹ́ ti ìsinsìnyí, kò sì pẹ́; ó tún dá ìyàtọ̀ rẹ̀ sí ‘ayérayé’ dúró ní kedere.
- source_word: ἐλαφρὸν
  choice: tí ó fẹ́ẹ́rẹ́
  rationale: ‘Fẹ́ẹ́rẹ́’ pa àwòrán ohun tí kò wúwo mọ́, ó sì ṣe ìtakora pẹ̀lú ìwọ̀n (βάρος) tó tẹ̀ lé e.
- source_word: θλίψεως
  choice: ìpọ́njú
  rationale: ‘Ìpọ́njú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìnira, ìtẹ̀sí, tàbí ìjìyà, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἡμῶν
  choice: wa
  rationale: 'Ó pa ìbáṣepọ̀ oníhun inú Gíríìkì mọ́: ìpọ́njú náà jẹ́ ti ‘wa.’'
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: tí ó kọjá gbogbo àfiwé
  rationale: Àtúnwí Gíríìkì náà ń fi ìwọ̀n àrà ọ̀tọ̀ hàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá tó ń sọ agbára ìtẹnumọ́ náà.
- source_word: αἰώνιον
  choice: ayérayé
  rationale: Ó bá ìtumọ̀ ohun tí kò lópin mu, ó sì dúró ní ìtakora pẹ̀lú ìpọ́njú tí ó wà fún ìgbà díẹ̀.
- source_word: βάρος
  choice: ìwọ̀n
  rationale: ‘Ìwọ̀n’ pa èrò ohun tó wúwo tàbí tó ní ọlá púpọ̀ mọ́, ó sì bá ‘fẹ́ẹ́rẹ́’ ṣe ìtakora. Nínú àkópọ̀ ‘ìwọ̀n ògo,’ kò dà bí ẹrù tó ń pọ́nni.
- source_word: δόξης
  choice: ògo
  rationale: Àkópọ̀ ‘ìwọ̀n ògo’ pa ìbáṣepọ̀ genitive Gíríìkì mọ́ dípò yíyí ògo padà sí àpèjúwe lásán.
- source_word: κατεργάζεται
  choice: ń mú ... wá
  rationale: Ó sọ ìṣe tó ń lọ lọ́wọ́ àti àbájáde tó munadoko ní Yorùbá àdánidá, láìsọ pé ìjìyà fi ẹ̀tọ́ gba ìgbàlà.
- source_word: ἡμῖν
  choice: fún wa
  rationale: 'Ó fi dative àǹfààní hàn: ògo náà ń bọ̀ fún àǹfààní wa, kì í ṣe dandan pé ó ń ṣẹlẹ̀ nínú wa.'
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: ìpọ́njú wa tí ó fẹ́ẹ́rẹ́, tí ó sì wà fún ìgbà díẹ̀ yìí
  rationale: 'Ìṣètò yìí jẹ́ Yorùbá tí ó rọrùn, ó sì pa gbogbo èrò inú ọ̀rọ̀ Gíríìkì mọ́: tiwa ni, ó fẹ́ẹ́rẹ́, kò sì pẹ́.'
theological_decisions:
- issue: Irú ògo tí ìpọ́njú ń mú wá
  choice: Ẹsẹ̀ náà sọ pé ìpọ́njú ìsinsìnyí ń yọrí sí ògo ayérayé fún àwọn onígbàgbọ́, láìsọ pé ìjìyà ń fi ẹ̀tọ́ ènìyàn ra ìgbàlà.
  alternative: Kí a túmọ̀ ọ́ pé ìpọ́njú ń jèrè ògo gẹ́gẹ́ bí èrè iṣẹ́ ènìyàn, tàbí pé ó ń mú ìdàgbàsókè ẹ̀mí ti ìsinsìnyí nìkan wá.
  rationale: Ìtakora láàárín ohun tí ó wà fún ìgbà díẹ̀ àti ohun ayérayé tọ́ka sí àbájáde ọjọ́ iwájú. ‘Ń mú ... wá fún wa’ pa ìsopọ̀ ohun èlò àti àbájáde mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ pé ìjìyà ń ra ìgbàlà kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìpọ́njú’ dípò ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè dín ìtumọ̀ kù; ‘fẹ́ẹ́rẹ́’ àti ‘ìwọ̀n’ pa ìtakora àwòrán Gíríìkì mọ́.
