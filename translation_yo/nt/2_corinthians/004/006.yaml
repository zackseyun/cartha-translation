id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: yo
  text: Nítorí Ọlọ́run, ẹni tí ó sọ pé, “Ìmọ́lẹ̀ yóò tàn jáde láti inú òkùnkùn,”[c] òun ni ó ti tàn nínú ọkàn wa, fún ìmúmọ́lẹ̀ ìmọ̀ nípa ògo Ọlọ́run ní ojú Mèsáyà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè gbà á gẹ́gẹ́ bí, “nínú Mèsáyà fúnra rẹ̀.” Gbólóhùn Gíríìkì náà tún lè tọ́ka ní ọ̀nà gidi sí “ojú Mèsáyà,” èyí tí ó pa àwòrán ògo Ọlọ́run tí a lè rí mọ́.
    reason: alternative_reading
  - marker: b
    text: Gíríìkì Χριστοῦ, tí a sábà máa ń tú sí “Kristi”; níhìn-ín a tú u sí “Mèsáyà” nítorí pé ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ tí a fa yìí ń dún bí Jẹ́nẹ́sísì 1:3, ó sì lo àwòrán ìmọ́lẹ̀ ìṣẹ̀dá fún iṣẹ́ Ọlọ́run ti fífi ara rẹ̀ hàn nínú àwọn onígbàgbọ́.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń fi ìdí gbólóhùn tó ṣáájú múlẹ̀; “Nítorí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa ìsopọ̀ ìdí yìí mọ́.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Ọlọ́run, ẹni tí ó sọ pé
  rationale: A tú participle oní-artikli náà sí gbólóhùn alábùdá, èyí tó bá Yorùbá àdánidá mu láì pàdánù ìtumọ̀ rẹ̀.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Ìmọ́lẹ̀ yóò tàn jáde láti inú òkùnkùn
  rationale: “Yóò tàn” pa fọ́ọ̀mù ọjọ́ iwájú mọ́, “jáde láti inú” sì mú agbára ἐκ hàn, pẹ̀lú àwòrán ìṣẹ̀dá nípa ìmọ́lẹ̀ àti òkùnkùn.
- source_word: ὃς ἔλαμψεν
  choice: òun ni ó ti tàn
  rationale: “Òun ni” tún tọ́ka sí Ọlọ́run ní kedere, “ó ti tàn” sì jẹ́ aláìfàṣẹsẹ̀ bí ọ̀rọ̀ Gíríìkì, ó sì fi iṣẹlẹ̀ tó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: nínú ọkàn wa
  rationale: “Ọkàn” pa àkàwé Bíbélì fún inú ènìyàn mọ́, ó sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lóye dáadáa.
- source_word: πρὸς φωτισμὸν
  choice: fún ìmólẹ̀
  rationale: Yíyan ọ̀rọ̀-orúkọ “ìmólẹ̀” pa ìṣọ̀kan gírámà àti ìpọ́njú ìtumọ̀ φωτισμός mọ́ dípò yíyí rẹ̀ sí gbólóhùn-ìṣe tó lè túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: τῆς γνώσεως τῆς δόξης τοῦ θεοῦ
  choice: ìmọ̀ ògo Ọlọ́run
  rationale: 'Àkójọpọ̀ ọ̀rọ̀-orúkọ yìí pa ìbáṣepọ̀ genitive ti Gíríìkì mọ́ ní ọ̀nà kúkúrú, adayeba ní Yorùbá: ìmọ̀ tí ohun tí a mọ̀ jẹ́ ògo Ọlọ́run.'
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: ní ojú Mèsáyà
  rationale: “Ojú” ni ìtumọ̀ tó ṣe kedere jù fún πρόσωπον, àyíká ìmọ́lẹ̀ àti ògo sì ń ti àwòrán ojú lẹ́yìn. “Mèsáyà” tú Χριστός gẹ́gẹ́ bí oyè.
theological_decisions:
- issue: Bí a ṣe tú Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi ògo rẹ̀ hàn; “Mèsáyà” mú ipa oyè náà jáde, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa “Kristi” mọ́ gẹ́gẹ́ bí ìtúmọ̀ ìbílẹ̀.
- issue: Ìtumọ̀ ἐν προσώπῳ Χριστοῦ
  choice: ní ojú Mèsáyà
  alternative: nínú ẹni tí Kristi í ṣe
  rationale: Ìtúmọ̀ gidi “ojú” bá àwòrán títàn àti ògo mu, ó sì pa ìfarahàn ògo Ọlọ́run mọ́ láì sọ ọ́ di èrò aláìní àwòrán. Síbẹ̀, a fi ìtumọ̀ “nínú ẹni tí Kristi í ṣe” sí àkọsílẹ̀ nítorí pé πρόσωπον lè ní ìtumọ̀ ẹni tàbí wíwà ní àyíká yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, àti ti òde òní; a pa àkójọpọ̀ ọ̀rọ̀ Pọ́ọ̀lù àti àwòrán ìmọ́lẹ̀, òkùnkùn, ọkàn, ògo, àti ojú mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
