id: 2CO.1.14
reference: 2 Corinthians 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: yo
  text: gẹ́gẹ́ bí ẹ̀yin pẹ̀lú ti wá lóye wa dé ìwọ̀n kan[a], pé àwa ni ìṣògo yín, gẹ́gẹ́ bí ẹ̀yin náà ṣe jẹ́ ìṣògo wa[b], ní ọjọ́ Olúwa wa Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní apá kan” tàbí “níwọ̀n díẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdí fún ìṣògo” tàbí “ìdí fún fífi yangàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: ti wá lóye
  rationale: Ó fi hàn pé àwọn ará Kọ́ríńtì dé ibi tí wọ́n ti mọ̀ tàbí lóye Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ní ti gidi, láìsọ pé òye náà pé pátápátá.
- source_word: ἀπὸ μέρους
  choice: dé ìwọ̀n kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé òye wọn kò tíì pé, ó sì pa àìdájú nípa ìwọ̀n rẹ̀ mọ́.
- source_word: καύχημα
  choice: ìṣògo
  rationale: “Ìṣògo” pa èrò Pọ́ọ̀lù nípa ayọ̀ àti ohun tí ènìyàn ń fi yangàn mọ́, láìsọ ọ́ di ìgbéraga búburú nìkan.
- source_word: καθάπερ
  choice: gẹ́gẹ́ bí
  rationale: 'Ó pa ìfiwéra alápàdé méjì mọ́: àwọn aposteli jẹ́ ìṣògo ìjọ, ìjọ náà sì jẹ́ ìṣògo àwọn aposteli.'
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ní ọjọ́ Olúwa wa Jésù
  rationale: Ó pa gbólóhùn ìrètí ọjọ́ ìkẹyìn náà àti oyè Kristi gẹ́gẹ́ bí Olúwa mọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún oyè Kristi nínú àyíká yìí.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ẹ̀yin pẹ̀lú
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì pa agbára àfikún καί mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ Pọ́ọ̀lù nípa ìṣògo tí ó jẹ́ ti ara wọn lẹ́nì kìíní-kejì
  choice: àwa ni ìṣògo yín, gẹ́gẹ́ bí ẹ̀yin pẹ̀lú náà ṣe jẹ́ ìṣògo wa
  alternative: àwa ni ìdí tí ẹ fi lè yangàn, gẹ́gẹ́ bí ẹ̀yin náà ti jẹ́ ìdí tí àwa fi lè yangàn
  rationale: 'Yíyan “ìṣògo” pa ọ̀rọ̀ àpèjúwe Pọ́ọ̀lù àti ìdààmú ẹ̀kọ́ tó wà nínú rẹ̀ mọ́: ó ń sọ nípa ayọ̀ àti ìgbéraga rere nínú ìbáṣepọ̀ wọn ní ọjọ́ Olúwa, kì í ṣe gbígbé ara ẹni ga.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé lásán. “Dé ìwọ̀n kan” jẹ́ àdánidá ju títú ἀπὸ μέρους sílẹ̀ ní ọ̀rọ̀-ọ̀rọ̀ lọ, nígbà tí “ìṣògo” ń pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti yẹ.
