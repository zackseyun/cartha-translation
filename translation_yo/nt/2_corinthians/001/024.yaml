id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: yo
  text: Kì í ṣe pé àwa ń jẹ ọ̀gá lórí ìgbàgbọ́ yín[a], ṣùgbọ́n àwa jẹ́ àwọn alábàáṣiṣẹ́ fún ayọ̀ yín[b], nítorí nípa ìgbàgbọ́ ni ẹ̀yin fi dúró ṣinṣin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń ṣiṣẹ́ pọ̀ fún ayọ̀ yín.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí ẹ dúró ṣinṣin nínú ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: ń jẹ ọ̀gá lórí
  rationale: Ó fi ìtumọ̀ lílo agbára ọ̀gá tàbí àṣẹ lé ẹlòmíràn lórí hàn, ó sì bá ọ̀rọ̀ ìkọ̀ tí Pọ́ọ̀lù lò mu ní Yorùbá àdánidá.
- source_word: ὑμῶν τῆς πίστεως
  choice: ìgbàgbọ́ yín
  rationale: Ìṣètò oníjẹ̀nítífù náà túmọ̀ sí ìgbàgbọ́ tí ó jẹ́ ti àwọn ará Kọ́ríńtì; ‘ìgbàgbọ́ yín’ jẹ́ kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: συνεργοί
  choice: alábàáṣiṣẹ́
  rationale: Ó tọ́ka sí àwọn tí ń ṣiṣẹ́ pọ̀ pẹ̀lú ẹlòmíràn, kì í ṣe àwọn aláṣẹ lórí wọn; ‘alábàáṣiṣẹ́’ pa ìtumọ̀ ìfọwọ́sowọ́pọ̀ mọ́.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: fún ayọ̀ yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ẹ̀ka ọ̀rọ̀ náà jẹ́ oníjẹ̀nítífù, nínú àyíká yìí iṣẹ́ wọn ń mú ayọ̀ àwọn ará Kọ́ríńtì wá; ‘fún ayọ̀ yín’ sọ ète náà ní kedere.
- source_word: τῇ γὰρ πίστει
  choice: nítorí nípa ìgbàgbọ́
  rationale: Dátífù náà lè fi ọ̀nà tàbí ìpìlẹ̀ hàn; ‘nípa ìgbàgbọ́’ pa èyí mọ́, ‘nítorí’ sì ṣàfihàn iṣẹ́ γάρ gẹ́gẹ́ bí àlàyé ìdí.
- source_word: ἑστήκατε
  choice: ẹ̀yin fi dúró ṣinṣin
  rationale: Fọ́ọ̀mù pípé náà ń fi ipò dídúró tí ó ti fìdí múlẹ̀ hàn; ‘dúró ṣinṣin’ mú agbára àti ìtẹ̀síwájú ipò náà jáde.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní ibi méjèèjì
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Àyíká náà ń sọ̀rọ̀ nípa ìdúró àwọn onígbàgbọ́, kò sì fi dandan mú wa ka ọ̀rọ̀ náà sí òtítọ́ṣinṣin. ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ pa ‘ìgbẹ́kẹ̀lé’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- issue: Iṣẹ́ dátífù nínú τῇ πίστει
  choice: nípa ìgbàgbọ́
  alternative: nínú ìgbàgbọ́
  rationale: A ka dátífù náà sí ọ̀nà tàbí ìpìlẹ̀ dídúró wọn, ṣùgbọ́n ó tún ṣeé kà sí ipò tí wọ́n dúró nínú rẹ̀; a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ ti òde òní, ó ṣeé lóye fún gbogbo ènìyàn, ó sì pa ìyàtọ̀ tó wà láàárín àṣẹ lórí àwọn ará àti ṣíṣiṣẹ́ pọ̀ fún ayọ̀ wọn mọ́.
