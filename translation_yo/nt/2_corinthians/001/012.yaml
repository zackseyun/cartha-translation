  source_fidelity: 'Ìtumọ̀ náà ń fi ìtumọ̀ pàtàkì Gíríìkì hàn dáadáa: ìṣògo, ẹ̀rí-ọkàn, ìwà mímọ́, òtítọ́ inú, ọgbọ́n ti ẹran ara, oore-ọ̀fẹ́ Ọlọ́run, àti ìhùwàsí wọn nínú ayé. Síbẹ̀, ìṣètò “nípa … ni àwa fi gbé” lè jẹ́ kí ‘ní’ (ἐν) dà bí ọ̀nà-iṣẹ́ tàbí irinṣẹ́ ju bí àyíká/ìwà ìgbésí-ayé lọ. Àtúnṣe náà mú ìbáṣepọ̀ gbolohun náà sun mọ́ ẹ̀rí-ọkàn tí ń jẹ́rìí pé wọn gbé ìgbésí ayé wọn báyìí.'
