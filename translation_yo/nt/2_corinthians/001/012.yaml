- from: 'Nítorí èyí ni ìṣògo wa: ẹ̀rí ọkàn wa ni pé, nípa ìwà mímọ́[a] àti òtítọ́ inú tí ó ti ọ̀dọ̀ Ọlọ́run wá[b], kì í ṣe nípa ọgbọ́n ti ẹran ara[c], bí kò ṣe nípa oore-ọ̀fẹ́ Ọlọ́run, ni àwa fi gbé ìgbésí ayé wa nínú ayé, pàápàá jù lọ sí yín.'
  to: 'Nítorí ìṣògo wa ni èyí: ẹ̀rí-ọkàn wa jẹ́rìí pé a gbé ìgbésí ayé wa nínú ayé ní ìwà mímọ́[a] àti òtítọ́ inú tí ó ti ọ̀dọ̀ Ọlọ́run wá[b], kì í ṣe ní ọgbọ́n ti ẹran ara[c], bí kò ṣe ní oore-ọ̀fẹ́ Ọlọ́run—àti pé pàápàá jù lọ sí yín.'
