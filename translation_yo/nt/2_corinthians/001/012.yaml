id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: yo
  text: 'Nítorí ìṣògo wa ni èyí: ẹ̀rí-ọkàn wa jẹ́rìí pé a gbé ìgbésí ayé wa nínú ayé ní ìwà mímọ́[a] àti òtítọ́ inú tí ó ti ọ̀dọ̀ Ọlọ́run wá[b], kì í ṣe ní ọgbọ́n ti ẹran ara[c], bí kò ṣe ní oore-ọ̀fẹ́ Ọlọ́run—àti pé pàápàá jù lọ sí yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “ìrọ̀rùn ọkàn” dípò “ìwà mímọ́.”
    reason: textual_variant
  - marker: b
    text: Tàbí “òtítọ́ inú bí ti Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ọgbọ́n ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: ìṣògo
  rationale: “Ìṣògo” sọ ìdí tí Pọ́ọ̀lù fi lè fi ìgboyà yọ̀, láì fi dandan túmọ̀ ọ́ sí ìgbéraga búburú.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: ẹ̀rí ọkàn wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ẹ̀rí inú tí ẹ̀rí-ọkàn ń jẹ́.
- source_word: ἁγιότητι
  choice: ìwà mímọ́
  rationale: Ó pa agbára ìwà rere àti ti ẹ̀sìn inú “holiness” mọ́; àfọwọ́kọ mìíràn ní “ìrọ̀rùn ọkàn.”
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: òtítọ́ inú tí ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó fi εἰλικρίνεια hàn gẹ́gẹ́ bí àìlẹ́tàn àti òtítọ́ inú, ó sì ka genitive náà sí orísun láì sọ pé Ọlọ́run fúnra rẹ̀ ni ẹni tí a ń ṣàpèjúwe.
- source_word: σοφίᾳ σαρκικῇ
  choice: ọgbọ́n ti ẹran ara
  rationale: Ó pa ọ̀rọ̀-ẹbí σάρξ mọ́, bí ó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ọgbọ́n ènìyàn nínú àyíká yìí.
- source_word: χάριτι θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ χάρις mọ́.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: àwa fi gbé ìgbésí ayé wa nínú ayé
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìhùwàsí àti ọ̀nà ìgbé-ayé, kì í ṣe ìṣe kan ṣoṣo.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: pàápàá jù lọ sí yín
  rationale: Ó mú agbára àfiwé περισσοτέρως àti ìtọ́kasí ìbáṣepọ̀ πρὸς ὑμᾶς jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Agbára τοῦ θεοῦ nínú εἰλικρινείᾳ τοῦ θεοῦ
  choice: “òtítọ́ inú tí ó ti ọ̀dọ̀ Ọlọ́run wá,” gẹ́gẹ́ bí orísun
  alternative: “òtítọ́ inú bí ti Ọlọ́run” tàbí “òtítọ́ inú Ọlọ́run”
  rationale: Genitive náà lè tọ́ka sí orísun tàbí ànímọ́. Ìtumọ̀ àkọ́kọ́ dára ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn ànímọ́ mọ́.
- issue: Ìtumọ̀ σοφίᾳ σαρκικῇ
  choice: “ọgbọ́n ti ẹran ara”
  alternative: “ọgbọ́n ènìyàn”
  rationale: Ìtumọ̀ àkọ́kọ́ pa àsopọ̀ mọ́ pẹ̀lú ọ̀rọ̀ Pọ́ọ̀lù nípa σάρξ; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ tó túbọ̀ jẹ́ ti iṣẹ́-ìtumọ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ṣùgbọ́n ó dúró ní èdè òde òní tí òǹkàwé lásán lè lóye. A lo “àwa” láti fi ìtẹnumọ́ ẹgbẹ́ Pọ́ọ̀lù hàn, “yín” sì jẹ́ ọ̀pọ̀ ènìyàn.
