  source_fidelity: 'Ìtumọ̀ náà mú ìpìlẹ̀ ẹsẹ̀ Gíríìkì náà dáadáa wá: ìfẹ̀sẹ̀múlẹ̀ nínú ìṣòtítọ́ Ọlọ́run, “ọ̀rọ̀ wa sí yín,” àti ìtakora “Bẹ́ẹ̀ ni àti Bẹ́ẹ̀ kọ́.” Àmì ìsàlẹ̀ (a) tún ṣàfihàn ìṣètò tó sún mọ́ ti Gíríìkì láì fi ìtumọ̀ kan tí a jiyàn sílẹ̀ gẹ́gẹ́ bí èyí tó dájú jù.'
  naturalness: 'Gbólóhùn àkọ́kọ́ fẹ́ àtúnṣe kékeré: “Bí Ọlọ́run ti ṣe olóòótọ́ tó” kò dáa gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ pé Ọlọ́run jẹ́ olóòótọ́; “Bí Ọlọ́run ti jẹ́ olóòótọ́ tó” ni ó péye, ó sì ń ṣiṣẹ́ dáadáa pẹ̀lú ìṣètò “bẹ́ẹ̀ ni.” Àwọn apá yòókù jẹ́ Yorùbá boṣewa, tí ó sì ní àmì ohùn tó yẹ.'
