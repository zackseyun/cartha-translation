  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: yo
  text: Bí Ọlọ́run ti jẹ́ olóòótọ́ tó, bẹ́ẹ̀ ni ọ̀rọ̀ wa sí yín kì í ṣe “Bẹ́ẹ̀ ni àti Bẹ́ẹ̀ kọ́.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki: “Ṣùgbọ́n Ọlọ́run jẹ́ olóòótọ́, pé ọ̀rọ̀ wa sí yín kì í ṣe ‘bẹ́ẹ̀ ni àti bẹ́ẹ̀ kọ́.’”'
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀rọ̀” tún lè túmọ̀ sí “ìhìn” tàbí “ohun tí a sọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: olóòótọ́
  rationale: Ó sọ pé Ọlọ́run ṣeé gbẹ́kẹ̀ lé, ó sì pa ohun tí ó sọ mọ́; èyí bá ìpìlẹ̀ ìjẹ́rìí Pọ́ọ̀lù mu.
- source_word: δὲ ... ὅτι
  choice: Bí ... ti ... tó, bẹ́ẹ̀ ni
  rationale: Ìṣètò yìí fi agbára ìmúdájú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá, níbi tí ìṣòtítọ́ Ọlọ́run ti jẹ́ ìpìlẹ̀ ọ̀rọ̀ tó tẹ̀ lé.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédé fún ẹni tí gbólóhùn náà ń sọ nípa rẹ̀.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ sọ fún àwọn ará Kọ́ríńtì, ó sì pa ìbòòrò itumọ̀ λόγος mọ́ ju “ìhìn” nìkan lọ.
- source_word: ἡμῶν
  choice: wa
  rationale: Ó fi hàn pé ọ̀rọ̀ náà jẹ́ ti Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: ὁ πρὸς ὑμᾶς
  choice: sí yín
  rationale: Ó sọ ní ṣókí pé àwọn ará Kọ́ríńtì ni a darí ọ̀rọ̀ náà sí.
- source_word: οὐκ ἔστιν
  choice: kì í ṣe
  rationale: Ó pa àkókò ìsinsìnyí àti ìtumọ̀ pé irú ọ̀rọ̀ náà kì í ní ìwà yẹn mọ́.
- source_word: Ναὶ καὶ Οὔ
  choice: “Bẹ́ẹ̀ ni àti Bẹ́ẹ̀ kọ́”
  rationale: Ó pa ìtakora tó mọ́ gédégbé nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́, gẹ́gẹ́ bí àpẹẹrẹ ọ̀rọ̀ tí ń yí padà tàbí tí ń tako ara rẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìṣètò ìmúdájú πιστὸς δὲ ὁ θεὸς ὅτι
  choice: Bí Ọlọ́run ti ṣe olóòótọ́ tó, bẹ́ẹ̀ ni ...
  alternative: Ṣùgbọ́n Ọlọ́run jẹ́ olóòótọ́, pé ...
  rationale: Aṣàyàn náà jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ tó wà láàárín ìṣòtítọ́ Ọlọ́run àti ìmúdájú Pọ́ọ̀lù mọ́ láì sọ ó di ìdí tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò “Bí ... ti ... tó, bẹ́ẹ̀ ni” mú ìjẹ́rìí líle náà yé òǹkàwé lasán, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìṣètò gangan tó sún mọ́ Gíríìkì mọ́.
