  terminology: A pa ‘owó ìdógò’ mọ́ láti gbé àwòrán ìṣòwò ti ἀρραβών jáde. ‘Ẹ̀mí náà’ bójú mu nínú àyíká Pọ́ọ̀lù, níbi tí Ẹ̀mí Ọlọ́run ti jẹ́ ẹni tí a ti mọ̀ tẹ́lẹ̀.
  issues:
  - severity: medium
    issue: Ìbáṣepọ̀ Ẹ̀mí àti owó ìdógò kò yege tó nínú gbolohun lọwọlọwọ.
    rationale: ‘Fi Ẹ̀mí náà fún wa gẹ́gẹ́ bí owó ìdógò’ lè ní ìgbọ́kànlé míràn nínú Yorùbá. Gíríìkì náà ń pè Ẹ̀mí náà ní ἀρραβών, ìyẹn ìdógò/ìsanwó ìbẹ̀rẹ̀.
  - severity: low
    issue: ‘Fi èdìdì sí wa’ kéré sí ìdánidá.
    rationale: ‘Fi èdìdì dì wá’ ń sọ ìṣe σφραγίζω ní tààrà àti ní ọ̀nà Yorùbá tó wọ́pọ̀.
