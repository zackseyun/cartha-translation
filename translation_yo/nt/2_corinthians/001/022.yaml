  rationale: Àtúnṣe náà mú kí Ẹ̀mí náà hàn gbangba gẹ́gẹ́ bí ìdógò náà, ó sì mú ọ̀rọ̀ fífi èdìdì dì wá di Yorùbá tí ó dáa síi. A kò ṣàlàyé ohun tí ìdógò náà ń ṣe ju àwòrán Gíríìkì lọ.
