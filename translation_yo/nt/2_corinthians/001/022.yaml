id: 2CO.1.22
reference: 2 Corinthians 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: yo
  text: ẹni tí ó sì fi èdìdì dì wá, tí ó sì fi Ẹ̀mí náà ṣe owó ìdógò nínú ọkàn wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdógò” tàbí “ìdánilójú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: fi èdìdì sí wa
  rationale: Ó pa àwòrán fífi èdìdì mọ́ gẹ́gẹ́ bí àmì jíjẹ́ ti ẹni kan, ìfìdí rẹ̀ múlẹ̀, tàbí ààbò, láì ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: δοὺς
  choice: fi ... fún wa
  rationale: Ọ̀rọ̀ alábápín aorist náà ni a so mọ́ ti àkọ́kọ́ ní ọ̀nà àdánidá Yorùbá, kí ìṣe méjèèjì lè dúró ní ìbámu.
- source_word: ἀρραβῶνα
  choice: owó ìdógò
  rationale: Ó tọ́ka sí apá owó tí a kọ́kọ́ san, tí ó sì jẹ́ ìdánilójú pé a ó san ìyókù; ‘owó ìdógò’ pa àwòrán ọ̀rọ̀ ìṣòwò náà mọ́ ní Yorùbá òde òní.
- source_word: τοῦ πνεύματος
  choice: Ẹ̀mí náà ... gẹ́gẹ́ bí owó ìdógò
  rationale: Ìṣètò yìí mú kí ó ṣe kedere ní Yorùbá pé Ẹ̀mí ni owó ìdógò náà, ní ìbámu pẹ̀lú genitive Gíríìkì, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: nínú ọkàn wa
  rationale: Ó pa ibi inú ẹni tí gbolohun Gíríìkì tọ́ka sí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé.
- source_word: ὁ καὶ ... καὶ
  choice: ẹni tí ó sì ... tí ó sì
  rationale: Ó so ẹni tí a ń sọ̀rọ̀ rẹ̀ pọ̀ mọ́ Ọlọ́run nínú ẹsẹ tó ṣáájú, ó sì pa ìbáramu ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ Ẹ̀mí gẹ́gẹ́ bí ἀρραβών
  choice: A túmọ̀ àwòrán náà ní kíkún sí ‘Ẹ̀mí náà ... gẹ́gẹ́ bí owó ìdógò.’
  alternative: ‘Ẹ̀mí náà gẹ́gẹ́ bí ìdánilójú’ tàbí ‘ìdógò Ẹ̀mí.’
  rationale: ‘Owó ìdógò’ pa àwòrán ìṣòwò tí Pọ́ọ̀lù lò mọ́; ṣíṣe e ní ‘ìdánilójú’ nìkan yóò sọ àwòrán náà di èrò àìrí, nígbà tí ‘ìdógò Ẹ̀mí’ lè dà bí genitive tí kò ṣe kedere ní Yorùbá.
translation_notes:
  register: Yorùbá àkọsílẹ̀ tí ó bójú mu, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹni tí’ láti so ẹsẹ náà mọ́ ọ̀rọ̀ tó ṣáájú; a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
