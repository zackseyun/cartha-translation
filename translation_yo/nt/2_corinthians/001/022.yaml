review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìṣe méjèèjì—fífi èdìdì dì àwọn olùgbàgbọ́ àti fífi Ẹ̀mí ṣe ἀρραβών—mọ́. Ṣùgbọ́n ìṣètò ‘fi Ẹ̀mí náà fún wa gẹ́gẹ́ bí owó ìdógò’ lè dà bí ẹni pé a fún Ẹ̀mí ní owó ìdógò kan, dípò pé Ẹ̀mí fúnra rẹ̀ ni ìdógò náà. Àtúnṣe náà sọ ìbáṣepọ̀ náà di kedere láì mú ìtumọ̀ ẹ̀kọ́ ìsìn kan wọ inú rẹ̀.
