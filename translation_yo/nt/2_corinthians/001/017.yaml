id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: yo
  text: Ǹjẹ́ nígbà tí mo pinnu èyí, ṣé mo hùwà láìní ìdúróṣinṣin[a]? Tàbí àwọn ohun tí mo ń pinnu, ṣé mo ń pinnu wọn nípa ti ara[b], kí ó lè jẹ́ pé lọ́dọ̀ mi, “Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́” ni ó wà[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú ìyípadà-ọkàn.” Ọ̀rọ̀ náà lè tọ́ka sí àìdúróṣinṣin tàbí mímú ìpinnu ní fúyẹ́.
    reason: lexical_alternative
  - marker: b
    text: “Nípa ti ara” lè túmọ̀ sí gẹ́gẹ́ bí èrò ènìyàn lásán tàbí ní ọ̀nà ti ayé.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, kí ọ̀rọ̀ “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́” tí kò bá ara wọn mu lè máa wá láti ọ̀dọ̀ rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: nígbà tí mo pinnu
  rationale: Ó so participle náà mọ́ èrò Pọ́ọ̀lù tẹ́lẹ̀ láti rin ìrìn-àjò, ó sì pa ìtumọ̀ ìpinnu mọ́ láìfi ètò pàtó kún un.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: mo hùwà láìní ìdúróṣinṣin
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí híhu ìwà pẹ̀lú ìfẹ́ tí kò dúró ṣinṣin; èyí jẹ́ Yorùbá àdánidá ju títúmọ̀ ‘ìfúyẹ́’ ní tààrà lọ.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: àwọn ohun tí mo ń pinnu, ṣé mo ń pinnu wọn
  rationale: A pa àtúnwí Gíríìkì mọ́ nítorí pé ó ń fi ìbéèrè Pọ́ọ̀lù tẹnumọ́.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: A pa ‘ara’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú àwọn lẹ́tà Pọ́ọ̀lù, láìdín ìtumọ̀ rẹ̀ kù sí ‘ti ayé’ nìkan.
- source_word: παρ’ ἐμοὶ
  choice: lọ́dọ̀ mi
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí a rí nínú ìwà tàbí ọ̀rọ̀ ẹni.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́”
  rationale: A pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, nítorí ó mú ẹ̀sùn yíyí ọkàn tàbí ọ̀rọ̀ méjì hàn kedere.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn Pọ́ọ̀lù κατὰ σάρκα
  choice: nípa ti ara
  alternative: gẹ́gẹ́ bí èrò ènìyàn lásán; ní ọ̀nà ti ayé
  rationale: Pípa ‘ara’ mọ́ ń jẹ́ kí ìhun ọ̀rọ̀ ẹ̀kọ́ Pọ́ọ̀lù dúró, kò sì fi tipátipá yan ìtumọ̀ kan ṣoṣo nínú àwọn ìtumọ̀ tó ṣeé ṣe.
- issue: Ìbáṣepọ̀ ‘Bẹ́ẹ̀ ni’ àti ‘Bẹ́ẹ̀ kọ́’
  choice: A fi méjèèjì sílẹ̀ ní ọ̀nà tí ó lè túmọ̀ sí ọ̀rọ̀ tí kò dúró ṣinṣin.
  alternative: Ṣíṣe àlàyé nínú ẹsẹ̀ pé ó ń sọ ‘Bẹ́ẹ̀ ni’ àti ‘Bẹ́ẹ̀ kọ́’ lẹ́ẹ̀kan náà.
  rationale: Gíríìkì fi ẹ̀sùn náà hàn ní ọ̀nà àfiwé tí ó ní àìdájú díẹ̀; àlàyé kíkún yẹ fún àlàyé ìsàlẹ̀ dípò fífi sínú ọ̀rọ̀ ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ṣé’ nínú àwọn ìbéèrè àsọyé fún ìṣàn ọ̀rọ̀ àdánidá, a sì pa àwọn àtúnwí pàtàkì ti Gíríìkì mọ́.
