  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì bá ìforúkọsílẹ̀ lẹ́tà àpọ́sítélì mu. “Ṣé mo hùwà láìní ìdúróṣinṣin?” àti “àwọn ohun tí mo ń pinnu, ṣé mo ń pinnu wọn...” jẹ́ ohun tí ó ṣeé lóye, bí ó tilẹ̀ jẹ́ pé àtúnwí kejì náà mọ̀ọ́mọọ́ tẹ̀lé ìtẹnumọ́ Gíríìkì.
  terminology: “Nípa ti ara” dáa gẹ́gẹ́ bí ìtumọ̀ pàtàkì fún κατὰ σάρκα; àlàyé ìsàlẹ̀ fún un sì fúnni ní àwọn ìtumọ̀ mìíràn láìpa àìdájú rẹ̀ run. “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́” jẹ́ ìbámu tó yẹ fún Náì àti Oú, àtúnwí wọn sì ṣe pàtàkì.
