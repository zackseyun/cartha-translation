id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: yo
  text: Olùbùkún ni Ọlọ́run àti Baba Olúwa[b] wa, Jésù Mèsáyà[a]—Baba àwọn àánú[c] àti Ọlọ́run gbogbo ìtùnú[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Ọ̀gá” fún “Olúwa.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ìyọ́nú.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìṣírí” tàbí “ìtùnú ọkàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ẹni ìbùkún ni
  rationale: Ó pa ìtumọ̀ ajẹtífù inú ọ̀rọ̀ ìyìn náà mọ́, ó sì jẹ́ ọ̀nà Yorùbá òde òní tí ó ní iyì láti kéde pé Ọlọ́run yẹ fún ìbùkún àti ìyìn.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Ọlọ́run àti Baba
  rationale: Àpilẹ̀kọ Gíríìkì kan náà bo orúkọ méjèèjì, nítorí náà gbolohun náà tọ́ka sí ẹni kan ṣoṣo gẹ́gẹ́ bí Ọlọ́run àti Baba.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tí ó bójú mu jù fún κύριος nínú lílo Kristẹni Májẹ̀mú Tuntun, bí ó tilẹ̀ jẹ́ pé “Ọ̀gá” lè túmọ̀ sí ọ̀gá tàbí olúwa ènìyàn.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà dípò kí a fi sílẹ̀ gẹ́gẹ́ bí orúkọ lasán; “Jesu Mèsáyà” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ Jesu ẹni tí a fi òróró yàn.
- source_word: οἰκτιρμῶν
  choice: àwọn àánú
  rationale: A pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì lè sọ ọ̀pọ̀ ìfihàn ìyọ́nú àti àánú Ọlọ́run.
- source_word: παρακλήσεως
  choice: ìtùnú
  rationale: Nínú àyíká ìpọ́njú tí ó tẹ̀ lé e, “ìtùnú” jẹ́ ọ̀rọ̀ Yorùbá adayeba tó bo ìrànlọ́wọ́ àti ìfọkànbalẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tún lè túmọ̀ sí ìṣírí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ oyè Χριστός nínú Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  alternative: Jesu Kristi
  rationale: Níbí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi òróró yàn; “Mèsáyà” mú ìtumọ̀ oyè náà hàn gbangba láì sọ ọ́ di orúkọ ìdílé.
- issue: Ìtumọ̀ “Baba àwọn àánú”
  choice: A pa àkójọpọ̀ Gíríìkì náà mọ́ láì ṣàlàyé rẹ̀ sí “orisun gbogbo àánú.”
  alternative: Baba aláàánú / orísun gbogbo àánú
  rationale: Gíríìkì lè tọ́ka sí Baba tí àánú jẹ́ ìwà rẹ̀ tàbí ẹni tí gbogbo àánú ti ń wá; fífi àkójọpọ̀ náà mọ́ ń dáàbò bo ìwọ̀n àìdájú yẹn.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìkọ̀wé náà ní iyì bí ọ̀rọ̀ ìyìn, ṣùgbọ́n a yẹra fún àwọn fọ́ọ̀mù Yorùbá Bíbélì àtijọ́ bí “li” àti àwọn gbólóhùn tí kò rọrùn fún òǹkàwé òde òní. Àmì gígùn náà fi hàn pé “Baba àwọn àánú...” tún ń ṣàpèjúwe Ọlọ́run kan náà.
