  to: Olùbùkún ni Ọlọ́run àti Baba Olúwa[b] wa, Jésù Mèsáyà[a]—Baba àwọn àánú[c] àti Ọlọ́run gbogbo ìtùnú[d].
  rationale: The revision replaces an opening expression that could reverse or blur the doxological sense with the established Yoruba predicate “Olùbùkún ni,” and regularizes Jésù with its tone mark. The remainder preserves the source syntax and intentional lexical breadth without adding theological interpretation.
