  - severity: low
    issue: Àfikún ‘náà’
    rationale: ‘Àwa náà’ lè túmọ̀ sí ‘àwa pẹ̀lú/àwa náà,’ ṣùgbọ́n ἡμᾶς nínú εἰς τὸ δύνασθαι ἡμᾶς kò ní ‘also’ tàbí ìtẹnumọ́. ‘A’ tàbí ‘àwa’ láìsí ‘náà’ jẹ́ ìfaradà tó sún mọ́ ọ̀rọ̀ ìpilẹ̀.
