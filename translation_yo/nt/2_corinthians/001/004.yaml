review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní ìlò àtúnṣe-ọ̀rọ̀ παρακαλέω/παράκλησις gẹ́gẹ́ bí ‘tù/ìtùnú,’ ìpọ́njú, ète ‘kí ... lè,’ àti ìtẹnumọ́ αὐτοὶ. Síbẹ̀, ‘àwa náà’ lè fi ìtumọ̀ ‘we also/too’ kún un ju ohun tí ọ̀rọ̀ náà sọ, àti ‘... nínú’ ní òpin gbólóhùn kejì jẹ́ àṣìṣe ètò-ọrọ.
  naturalness: Yorùbá gbólóhùn àkọ́kọ́ jẹ́ adayeba. Àmọ́, ‘tu àwọn tí ó wà nínú ìpọ́njú èyíkéyìí nínú’ ní ‘nínú’ tí a tún lò láìní iṣẹ́, èyí sì dá ìṣàn gbólóhùn dúró. A tún ṣàtúnṣe ọ̀nà ìgbà ìtùnú sí èdè tí ó ṣàn dáadáa.
  terminology: ‘Ìtùnú’ àti ‘tù’ jẹ́ ìyànfẹ́ tó bójú mu fún àyíká ìpọ́njú, wọ́n sì pa ìdílé ọ̀rọ̀ Gíríìkì mọ́. ‘Ìṣírí’ ní àlàyé ìsàlẹ̀ jẹ́ ìyípadà tí ó yẹ. ‘Látọ̀dọ̀ Ọlọ́run’ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ìtùnú ti ń wá, bó tilẹ̀ jẹ́ pé Gíríìkì fi i hàn gẹ́gẹ́ bí olùṣe nínú ìṣe aláìṣe.
  issues:
