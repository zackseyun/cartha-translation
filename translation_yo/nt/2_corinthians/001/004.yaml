  to: ẹni tí ń tù wá nínú gbogbo ìpọ́njú wa,[a] kí a lè máa tu àwọn tí ó wà nínú ìpọ́njú èyíkéyìí, nípasẹ̀ ìtùnú tí a fúnra wa ń gbà látọ̀dọ̀ Ọlọ́run.
