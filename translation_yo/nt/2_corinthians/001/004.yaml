id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: yo
  text: ẹni tí ń tù wá nínú gbogbo ìpọ́njú wa,[a] kí a lè máa tu àwọn tí ó wà nínú ìpọ́njú èyíkéyìí, nípasẹ̀ ìtùnú tí a fúnra wa ń gbà látọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ń fún wa ní ìṣírí ... ìṣírí”; èdè Gíríìkì lo ìdílé ọ̀rọ̀ kan náà ní gbogbo ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: tù / tu / ìtùnú / rí ìtùnú gbà
  rationale: Àwọn ọ̀rọ̀ yìí pa ìdílé ọ̀rọ̀ Gíríìkì kan náà mọ́ ní Yorùbá, wọ́n sì fi ìtùnú tí ń fún ẹni ní okun hàn láàárín ìpọ́njú. Fífún àsọyé náà ní ìrísí adayeba béèrè ‘rí ìtùnú gbà’ ní ibi tí Gíríìkì ti lo ọ̀rọ̀-ìṣe aláìṣe.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: nínú gbogbo ìpọ́njú wa
  rationale: ‘Ìpọ́njú’ mú èrò ìnira, wàhálà, àti ìtẹ̀sí mọ́lẹ̀ inú θλῖψις jáde; ‘nínú’ sì jẹ́ ọ̀nà Yorùbá adayeba láti sọ ipò tí ìtùnú Ọlọ́run ti dé bá wọn.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: kí àwa náà lè máa
  rationale: Èyí fi ète tàbí àbájáde gbólóhùn Gíríìkì hàn. ‘Àwa náà’ so ohun tí Ọlọ́run ṣe fún wọn pọ̀ mọ́ ohun tí wọ́n lè ṣe fún ẹlòmíràn.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: àwọn tí ó wà nínú ìpọ́njú èyíkéyìí
  rationale: '‘Èyíkéyìí’ sọ ìtumọ̀ pínpín náà ní kedere: gbogbo ẹni tí ó bá wà nínú irú ìpọ́njú kọ̀ọ̀kan.'
- source_word: αὐτοὶ
  choice: àwa fúnra wa
  rationale: Èyí pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ ní Yorùbá adayeba.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: lọ́dọ̀ Ọlọ́run
  rationale: Nínú Yorùbá, ‘rí ... gbà lọ́dọ̀ Ọlọ́run’ fi Ọlọ́run hàn gẹ́gẹ́ bí orísun àti ẹni tí ó ń ṣe ìtùnú náà, láìṣe gbólóhùn náà ní líle.
theological_decisions:
- issue: Ìtúmọ̀ gbòòrò παρακαλέω / παράκλησις
  choice: tù / ìtùnú
  alternative: gbà níyànjú / ìṣírí
  rationale: Nítorí θλῖψις (‘ìpọ́njú’) ni àyíká ọ̀rọ̀ náà, ìtumọ̀ ìtùnú tí ń fún ẹni ní okun ni ó ṣe pàtàkì jù. Síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ìṣírí’ tí ó tún ṣeé ṣe hàn.
- issue: Agbára ὑπὸ τοῦ θεοῦ nínú gbólóhùn aláìṣe
  choice: rí ... gbà lọ́dọ̀ Ọlọ́run
  alternative: jẹ́ títùnú láti ọwọ́ Ọlọ́run
  rationale: Àṣàyàn náà jẹ́ Yorùbá tí ó ṣàn dáadáa, ó sì pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe ìtùnú.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A tún ìdílé ọ̀rọ̀ ‘tù/ìtùnú’ ṣe láti pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́; ‘ìpọ́njú èyíkéyìí’ sì mú ìwọ̀n gbòòrò cláusù kejì jáde.
