id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[a][b] wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí gẹ́gẹ́ bí a ti sábà máa ń pè é, “Jésù Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Ní àwọn àyíká ọ̀rọ̀ kan, a tún lè tú “Olúwa” sí “Ọ̀gá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìkíni Paulu mu; ó pa ìtumọ̀ inú rere Ọlọ́run tí a kò fi iṣẹ́ rà mọ́.
- source_word: ὑμῖν
  choice: pẹ̀lú yín
  rationale: Nínú gbólóhùn ìbùkún Yorùbá, ‘wà pẹ̀lú yín’ jẹ́ ọ̀nà àdánidá láti sọ ohun tí Gíríìkì fi dative nìkan hàn.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbágbépọ̀ ní ìrẹ́pọ̀ àti ìlera pípé tí εἰρήνη lè tọ́ka sí.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn ní Yorùbá àdánidá.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Ó pa ìbáṣepọ̀ appositional inú Gíríìkì mọ́ láì sọ ọ́ di ‘Ọlọ́run wa àti Baba wa,’ èyí tí ó lè yí ìṣètò ọ̀rọ̀ náà padà.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tó péye, tó sì ní ìwọ̀n ọlá tó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Jésù níbí.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: ‘Jésù’ jẹ́ orúkọ, nígbà tí ‘Mèsáyà’ jẹ́ orúkọ oyè tó mú ìtumọ̀ Χριστός—Ẹni Àmì Òróró—hàn. Yorùbá kò nílò àpilẹ̀kọ pàtó níwájú orúkọ oyè náà bí Gẹ̀ẹ́sì ṣe nílò ‘the.’
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú ìkíni Paulu
  choice: Mèsáyà
  alternative: Kristi
  rationale: A mú ìtumọ̀ orúkọ oyè náà jáde dípò kí a kàn lo fọ́ọ̀mù àyálò ‘Kristi’; bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ κυρίου gẹ́gẹ́ bí orúkọ oyè Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ bá ìwọ̀n ọlá àti lílo kristọ́lójì nínú Májẹ̀mú Tuntun mu ju ‘Ọ̀gá’ lọ, ní pàtàkì nínú ìbùkún yìí tí a ti darúkọ Jésù lẹ́gbẹ̀ẹ́ Ọlọ́run Baba wa.
- issue: Ìbáṣepọ̀ orísun nínú ‘ἀπὸ θεοῦ ... καὶ κυρίου’
  choice: A pa Ọlọ́run Baba àti Olúwa Jésù mọ́ gẹ́gẹ́ bí orísun kan náà tí ἀπό ń ṣàkóso
  alternative: Ṣíṣe àtúnṣe gbólóhùn náà kí Ọlọ́run nìkan dà bí orísun
  rationale: Ìṣètò Gíríìkì so àwọn méjèèjì pọ̀ mọ́ ἀπό; ìtumọ̀ Yorùbá pa ìṣọ̀kan gírámà yìí mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àpẹẹrẹ ‘Kí ... wà pẹ̀lú yín’ mú gbólóhùn ìkíni tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì jáde ní Yorùbá àdánidá, ọ̀wọ̀, àti èdè tí òǹkàwé òde òní lè lóye.
