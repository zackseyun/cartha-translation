  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: yo
  text: Pẹ̀lú ìgbẹ́kẹ̀lé yìí, mo ní èrò láti kọ́kọ́ wá sọ́dọ̀ yín,[a] kí ẹ lè ní àǹfààní kejì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti wá sọ́dọ̀ yín ṣáájú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “oore-ọ̀fẹ́ kejì” tàbí “ojúrere kejì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: ìgbẹ́kẹ̀lé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìdánilójú tàbí ìgbẹ́kẹ̀lé. “Ìgbẹ́kẹ̀lé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìdí tí Pọ́ọ̀lù fi ní èrò ìrìnàjò rẹ̀ mu.
- source_word: ἐβουλόμην
  choice: mo pinnu
  rationale: Ó sọ ìfẹ́-inú tàbí èrò ẹni láti ṣe ohun kan; “mo pinnu” fi ète Pọ́ọ̀lù hàn láìsọ pé ó ti di ètò tí kò lè yí padà.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: láti kọ́kọ́ wá sọ́dọ̀ yín
  rationale: Nínú àyíká ọ̀rọ̀ ìrìnàjò yìí, πρότερον lè tọ́ka sí ohun tí yóò kọ́kọ́ ṣẹlẹ̀ nínú ìtòlẹ́sẹẹsẹ; ìtumọ̀ yìí bá ẹsẹ tó tẹ̀ lé e mu, ṣùgbọ́n a tọ́ka sí ìtumọ̀ “ṣáájú” nínú àlàyé ìsàlẹ̀.
- source_word: δευτέραν χάριν
  choice: àǹfààní kejì
  rationale: Níbí, χάρις ṣeé lóye gẹ́gẹ́ bí oore tàbí àǹfààní tí ìbẹ̀wò Pọ́ọ̀lù yóò mú wá, kì í ṣe dandan gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ nípa oore-ọ̀fẹ́ ìgbàlà. “Àǹfààní” mú ìtumọ̀ àyíká ọ̀rọ̀ náà ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: σχῆτε
  choice: kí ẹ lè ní
  rationale: ἔχω níbí túmọ̀ sí ní tàbí rí gbà; “kí ẹ lè ní” tẹ̀ lé ọ̀nà tí Gíríìkì gbà sọ ọ́, ó sì jẹ́ Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú ọ̀rọ̀ ìbẹ̀wò Pọ́ọ̀lù
  choice: àǹfààní kejì
  alternative: oore-ọ̀fẹ́ kejì; ojúrere kejì
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àǹfààní tàbí ìbùkún tí ìbẹ̀wò Pọ́ọ̀lù mú wá ni a ń sọ; àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ gbooro χάρις mọ́, láìfi ẹ̀kọ́ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣeé yé fún gbogbo ènìyàn. “Kọ́kọ́ wá sọ́dọ̀ yín” jẹ́ ọ̀nà àdánidá láti sọ ipò ìbẹ̀wò náà nínú ìtòlẹ́sẹẹsẹ ìrìnàjò; a fi ìtumọ̀ àsìkò “ṣáájú” sí àlàyé ìsàlẹ̀. A yan “àǹfààní kejì” dípò àsọyé aláìṣe “jèrè àǹfààní lẹ́ẹ̀kejì” kí orúkọ χάρις lè dúró kedere.
