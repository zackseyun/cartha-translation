- from: Nítorí a kò kọ ohun mìíràn sí yín bí kò ṣe ohun tí ẹ ń kà, tí ẹ sì ń lóye nítòótọ́; mo sì ní ìrètí pé ẹ ó lóye rẹ̀ títí dé òpin[a],
  to: Nítorí a kò kọ ohun mìíràn sí yín bí kò ṣe ohun tí ẹ ń kà, tí ẹ sì tún ń lóye; mo sì ní ìrètí pé ẹ ó lóye títí dé òpin[a],
  rationale: Àtúnṣe náà rọ́pò ‘nítòótọ́’ pẹ̀lú ‘tún’ láti fi καὶ hàn gẹ́gẹ́ bí ‘also,’ ó sì yọ ‘rẹ̀’ tí orísun kò sọ. Gbogbo ìfarahàn ìtumọ̀ ἕως τέλους àti àmì ìsàlẹ̀ ni a pa mọ́.
