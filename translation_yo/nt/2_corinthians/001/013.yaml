  revision_rationale: Àtúnṣe náà rọ́pò ‘nítòótọ́’ pẹ̀lú ‘tún’ láti fi καὶ hàn gẹ́gẹ́ bí ‘also,’ ó sì yọ ‘rẹ̀’ tí orísun kò sọ. Gbogbo ìfarahàn ìtumọ̀ ἕως τέλους àti àmì ìsàlẹ̀ ni a pa mọ́.
