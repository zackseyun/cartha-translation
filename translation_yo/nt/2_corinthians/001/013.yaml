id: 2CO.1.13
reference: 2 Corinthians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: yo
  text: Nítorí a kò kọ ohun mìíràn sí yín bí kò ṣe ohun tí ẹ ń kà, tí ẹ sì tún ń lóye; mo sì ní ìrètí pé ẹ ó lóye títí dé òpin[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ó lóye ní kíkún.”
    reason: Ἕως τέλους lè túmọ̀ sí ‘títí dé òpin’ ní tààrà tàbí ó lè fi ìpéye hàn, ìyẹn ‘ní kíkún.’
lexical_decisions:
- source_word: ἄλλα
  choice: ohun mìíràn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí a kọ kò ní ìtumọ̀ mìíràn tàbí ọ̀rọ̀ àṣírí kan lẹ́yìn rẹ̀.
- source_word: ἀναγινώσκετε
  choice: ẹ ń kà
  rationale: Ó pa ìtumọ̀ ìṣe kíkà lẹ́tà náà mọ́, ó sì bá àkókò ìsinsìnyí inú Gíríìkì mu.
- source_word: ἐπιγινώσκετε
  choice: ẹ sì ń lóye nítòótọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí mímọ ìtumọ̀ ohun tí a kà. ‘Lóye’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, ‘nítòótọ́’ sì gbé agbára καί jáde láì sọ àsọyé tó ju orísun lọ.
- source_word: ἐπιγνώσεσθε
  choice: ẹ ó lóye rẹ̀
  rationale: A tún lo ‘lóye’ láti pa ìbáṣepọ̀ ọ̀rọ̀ yìí mọ́ pẹ̀lú ἐπιγινώσκετε, nígbà tí àkókò ọjọ́ iwájú wà ní ‘ẹ ó.’
- source_word: ἕως τέλους
  choice: títí dé òpin
  rationale: Èyí tẹ̀ lé gbólóhùn Gíríìkì ní tààrà, ó sì pa àìdánilójú rẹ̀ mọ́ bóyá ó túmọ̀ sí ìfaradà títí dé òpin tàbí òye ní kíkún.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Nítorí a kò ... bí kò ṣe
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìdíwọ̀n pé kò sí ohun mìíràn yàtọ̀ sí ohun tí a mẹ́nuba.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì pa àmì kọ́mà ìparí mọ́ nítorí ẹsẹ yìí ń bá ọ̀rọ̀ ẹsẹ tó tẹ̀ lé e lọ.
