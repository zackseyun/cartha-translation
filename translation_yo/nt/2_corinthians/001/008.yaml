  source_fidelity: 'Ìtumọ̀ náà gbé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ gbòǹgbò Gíríìkì náà kalẹ̀ dáadáa: Pọ́ọ̀lù kò fẹ́ kí àwọn olùgbọ́ má mọ̀ nípa ìpọ́njú náà; ìpọ́njú náà ṣẹlẹ̀ ní Éṣíà; a fi ẹrù wúwo wọn gidigidi ju agbára wọn lọ; ó sì mú kí wọ́n sọ ìrètí ìwàláàyè nù. Ṣùgbọ́n ọ̀rọ̀ “a di ẹni tí ẹrù rẹ̀ wúwo rékọjá” kò ṣàfihàn passive plural ἐβαρήθημεν dáadáa, ó sì dà bí ẹni kan ṣoṣo tí ẹrù tirẹ̀ wúwo.'
  naturalness: “Nítorí a kò fẹ́ kí ẹ má mọ̀” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì hàn gbangba ju “kí ó jẹ́ àìmọ̀ fún yín” lọ nínú àyíká yìí. “A fi ẹrù wúwo wa gidigidi” ń mú àwòrán pé a wu wọn lórí pẹ̀lú ẹrù jáde ní ti ẹda, nígbà tí “àní láti wà láàyè” ń yẹra fún ìtẹnumọ́ ẹlẹ́ẹ̀mejì nínú “àní ... pàápàá.”
  terminology: “Ẹ̀yin ará,” “ìpọ́njú,” àti “Éṣíà” yẹ. Àlàyé ìsàlẹ̀ c ní draft sọ “ṣiyèméjì,” èyí tí ó túmọ̀ sí iyèméjì/doubt dípò pípadánù ìrètí; a ti ṣàtúnṣe rẹ̀ kí ó fi ìtumọ̀ lexical alternative náà hàn dáadáa.
