id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: yo
  text: 'Nítorí a kò fẹ́ kí ẹ má mọ̀, ẹ̀yin ará[a], nípa ìpọ́njú wa tí ó ṣẹlẹ̀ ní Éṣíà[b]: a fi ẹrù wúwo wa gidigidi, ju agbára wa lọ, tó bẹ́ẹ̀ tí a fi sọ ìrètí nù àní láti wà láàyè.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí ó ṣeé ṣe kí Pọ́ọ̀lù máa bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀, ọkùnrin àti obìnrin.
    reason: cultural_note
  - marker: b
    text: “Éṣíà” níbí ni agbègbè ìṣàkóso Róòmù ní apá ìwọ̀-oòrùn Éṣíà Kékeré, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì Éṣíà òde òní.
    reason: cultural_note
  - marker: c
    text: Tàbí, “tó bẹ́ẹ̀ tí a fi sọ ìrètí pé a ó máa wà láàyè nìṣó nù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: Nítorí a kò fẹ́ kí ó jẹ́ àìmọ̀ fún yín
  rationale: Ó pa gbólóhùn ìfẹ́ inú Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò ní ìtumọ̀ ẹ̀gàn.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ìkíni àwọn ọmọ ìjọ, ó sì lè tọ́ka sí gbogbo àwùjọ láìfi akọ tàbí abo kún ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: nípa ìpọ́njú wa
  rationale: “Ìpọ́njú” mú ìnira àti ìtẹ̀síwájú agbára inú θλῖψις jáde ní èdè Yorùbá ọlọ́lá tí ó ṣe kedere.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: tí ó ṣẹlẹ̀ ní Éṣíà
  rationale: Ó tú participle náà ní tààrà, láìṣàfikún ohun tí kò sí nínú orísun.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: a di ẹni tí ẹrù rẹ̀ wúwo rékọjá, ó sì kọjá agbára wa
  rationale: Ó pa àwòrán ìwúwo ἐβαρήθημεν àti ìtẹnumọ́ méjèèjì—rékọjá àti ju agbára lọ—mọ́ ní Yorùbá àdánidá.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: tó bẹ́ẹ̀ tí a fi sọ ìrètí nù àní láti wà láàyè pàápàá
  rationale: Ó fi àbájáde hàn kedere, ó sì mú agbára ἐξαπορέω àti ìtẹnumọ́ καί jáde.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nínú ìkíni lẹ́tà
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n nínú ìkíni sí ìjọ ó ṣeé ṣe kí ó kó àwọn onígbàgbọ́ ọkùnrin àti obìnrin pọ̀. “Ẹ̀yin ará” jẹ́ ìbádọ́gba Yorùbá tí ó wọ́pọ̀, láìgbọ́wọ́lé ẹ̀kọ́ ẹ̀sìn kan pàtó.
- issue: Bí a ṣe máa tú ἐξαπορηθῆναι καὶ τοῦ ζῆν
  choice: a sọ ìrètí nù àní láti wà láàyè pàápàá
  alternative: a kò mọ ohun tí a lè ṣe mọ́ nípa ìwàláàyè wa
  rationale: Àṣàyàn náà pa líle ìbànújẹ́ àti ewu ikú mọ́, ṣùgbọ́n kò sọ pé ikú ṣẹlẹ̀ tàbí pé Pọ́ọ̀lù fẹ́ pa ara rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ̀yin ará” gẹ́gẹ́ bí ìkíni ìjọ tí ó wọ́pọ̀, àti “Éṣíà” gẹ́gẹ́ bí orúkọ ibi.
