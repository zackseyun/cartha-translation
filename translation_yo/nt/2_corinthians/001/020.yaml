revisions:
- from: Nítorí gbogbo ìlérí Ọlọ́run, bí wọ́n ti pọ̀ tó, nínú rẹ̀ ni “Bẹ́ẹ̀ ni” wà.[a] Nítorí náà, nípasẹ̀ rẹ̀ pẹ̀lú ni “Àmín”[b] náà wà sí Ọlọ́run, fún ògo nípasẹ̀ wa.[c]
  to: Nítorí, bí ìlérí Ọlọ́run ti pọ̀ tó, nínú rẹ̀ ni “Bẹ́ẹ̀ ni” wà.[a] Nítorí náà, nípasẹ̀ rẹ̀ náà ni a fi ń sọ “Àmín”[b] sí Ọlọ́run fún ògo nípasẹ̀ wa.[c]
