id: 2CO.1.20
reference: 2 Corinthians 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: yo
  text: Nítorí, bí ìlérí Ọlọ́run ti pọ̀ tó, nínú rẹ̀ ni “Bẹ́ẹ̀ ni” wà.[a] Nítorí náà, nípasẹ̀ rẹ̀ náà ni a fi ń sọ “Àmín”[b] sí Ọlọ́run fún ògo nípasẹ̀ wa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó túmọ̀ ọ̀rọ̀ náà sí i: “nínú rẹ̀ ni wọ́n ti ní ‘Bẹ́ẹ̀ ni’ wọn.”'
    reason: alternative_reading
  - marker: b
    text: “Àmín” jẹ́ ọ̀rọ̀ ìfìdí-múlẹ̀ tó túmọ̀ sí ohun bí “lóòótọ́” tàbí “kí ó rí bẹ́ẹ̀.”
    reason: cultural_note
  - marker: c
    text: Tàbí, “sí ògo Ọlọ́run nípasẹ̀ wa,” bí a bá lóye πρὸς δόξαν gẹ́gẹ́ bí “sí ògo Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: gbogbo ... bí wọ́n ti pọ̀ tó
  rationale: Ó sọ pé gbogbo ìlérí Ọlọ́run pátápátá ni Pọ́ọ̀lù ní lọ́kàn, láìsọ iye wọn pàtó; ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìtumọ̀ ὅσαι jáde.
- source_word: ἐπαγγελίαι θεοῦ
  choice: ìlérí Ọlọ́run
  rationale: “Ìlérí” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ἐπαγγελία, genitive θεοῦ sì ń fi hàn pé àwọn ìlérí náà jẹ́ ti Ọlọ́run.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ Pọ́ọ̀lù àti ìtọ́ka rẹ̀ sí Kristi mọ́, láìfi ọ̀rọ̀ ìṣàlàyé bí “mú ṣẹ” kun ẹsẹ̀ náà.
- source_word: τὸ Ναί
  choice: “Bẹ́ẹ̀ ni”
  rationale: Èyí ni ìfìdí-múlẹ̀ Yorùbá tó bá Ναί mu, ó sì pa agbára ọ̀rọ̀ àfiwé Pọ́ọ̀lù mọ́.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: Nítorí náà, nípasẹ̀ rẹ̀ pẹ̀lú
  rationale: “Nítorí náà” fi ìyọrísí hàn, “nípasẹ̀ rẹ̀” sì pa ipa Kristi gẹ́gẹ́ bí alárinà mọ́; “pẹ̀lú” dúró fún καί.
- source_word: τὸ Ἀμὴν
  choice: “Àmín” náà
  rationale: “Àmín” ti di ọ̀rọ̀ ìjọsìn tí àwọn olùka Yorùbá mọ̀; “náà” ń ṣàfihàn article náà, ó sì mú àfiwé rẹ̀ pẹ̀lú “Bẹ́ẹ̀ ni” hàn.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: Ó fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí “Àmín” náà ń tọ̀ sí, ní ìbámu pẹ̀lú dative Gíríìkì.
- source_word: πρὸς δόξαν
  choice: fún ògo
  rationale: Ó pa ète tí πρὸς ń tọ́ka sí mọ́ láìyanjú ní pàtó ẹni tí “ògo” náà jẹ́ tirẹ̀ nínú gbólóhùn àkọ́kọ́.
- source_word: δι’ ἡμῶν
  choice: nípasẹ̀ wa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́ ní gbangba láìfi “iṣẹ́ ìránṣẹ́ wa” tàbí àlàyé mìíràn kun un.
theological_decisions:
- issue: Bóyá kí a tú gbólóhùn kúkúrú Pọ́ọ̀lù sí “Kristi mú gbogbo ìlérí ṣẹ”
  choice: Pa ọ̀rọ̀ kúkúrú náà mọ́ pé “nínú rẹ̀ ni ‘Bẹ́ẹ̀ ni’ wà.”
  alternative: “Nínú rẹ̀ ni gbogbo ìlérí Ọlọ́run ti ní ìmúṣẹ.”
  rationale: Ìmúṣẹ ìlérí nínú Kristi wà nínú ìtumọ̀ ẹsẹ̀ náà, ṣùgbọ́n Gíríìkì kò lo ọ̀rọ̀ “mú ṣẹ.” Yíyan ọ̀rọ̀ kúkúrú náà ń pa àìsọ-gbogbo rẹ̀ àti agbára ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ πρὸς δόξαν pẹ̀lú τῷ θεῷ
  choice: “sí Ọlọ́run, fún ògo nípasẹ̀ wa”
  alternative: “sí ògo Ọlọ́run nípasẹ̀ wa”
  rationale: Gbólóhùn Gíríìkì lè jẹ́ kí “sí Ọlọ́run” tọ́ka sí ẹni tí Àmín ń lọ sí, tí “fún ògo” sì sọ ète; àfikún ẹsẹ̀ ìsàlẹ̀ pa ọ̀nà ìtumọ̀ pé ògo Ọlọ́run ni ète náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìṣọ̀kan àfiwé “Bẹ́ẹ̀ ni/Àmín” àti gbólóhùn Pọ́ọ̀lù tó mọ̀ọ́mọ̀ kúkúrú mọ́, bí ó tilẹ̀ jẹ́ pé èyí mú kí apá kejì ní ìrísí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó díẹ̀ ṣókùnkùn.
