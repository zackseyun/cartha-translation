id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: yo
  text: 'Pọ́ọ̀lù, àpọ́sítélì Mèsáyà Jésù[a] nípa ìfẹ́ Ọlọ́run, àti Timotiu arákùnrin wa[b], sí ìjọ Ọlọ́run tí ó wà ní Kọ́ríńtì, pẹ̀lú gbogbo àwọn ẹni mímọ́ tí ó wà ní gbogbo Akáíà:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.”
    reason: alternative_reading
  - marker: b
    text: Ní tààrà, “Timotiu arákùnrin náà.”
    reason: source_form
lexical_decisions:
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí ni èdè Yorùbá ìgbàlódé sábà máa ń lò fún ipò pàtàkì ẹni tí a rán ní àṣẹ; ó péye ju ‘òjíṣẹ́’ lọ ní àyíká ìkíni lẹ́tà Pọ́ọ̀lù.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè níbí, nítorí náà ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn hàn; a pa ‘Kristi Jésù’ mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: διὰ θελήματος θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: ‘Nípa’ fi hàn pé ìfẹ́ Ọlọ́run ni ìpìlẹ̀ àti ọ̀nà tí Pọ́ọ̀lù fi di àpọ́sítélì, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ὁ ἀδελφὸς
  choice: arákùnrin wa
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ‘arákùnrin náà’ láìsí arọ́pò-orúkọ ohun-ìní, ‘arákùnrin wa’ ni ìsọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìbáṣepọ̀ onígbàgbọ́ tí àyíká ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: ‘Ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwùjọ àwọn onígbàgbọ́ mu nínú ìkíni lẹ́tà Pọ́ọ̀lù.
- source_word: ἁγίοις
  choice: àwọn ẹni mímọ́
  rationale: Yíyan yìí ṣàfihàn pé àwọn ènìyàn tí Ọlọ́run yà sọ́tọ̀ ni a ń sọ, láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: ‘Pẹ̀lú’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye láti fi agbára ìkópọ̀ σύν hàn.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: ní gbogbo Akáíà
  rationale: Ó tẹ̀ lé ìtò Gíríìkì, ó sì fi hàn pé gbogbo agbègbè Akáíà ni ọ̀rọ̀ náà kàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú oyè ìbẹ̀rẹ̀ Pọ́ọ̀lù
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Ní àkópọ̀ ọ̀rọ̀ yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè náà hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ìbílẹ̀ ‘Kristi’ mọ́.
- issue: Bí a ṣe túmọ̀ ὁ ἀδελφὸς
  choice: arákùnrin wa
  alternative: arákùnrin náà
  rationale: Gíríìkì kò ní ‘wa’ ní tààrà, ṣùgbọ́n àpilẹ̀kọ ὁ àti àyíká ìkíni ń tọ́ka sí Timotiu gẹ́gẹ́ bí arákùnrin tí Pọ́ọ̀lù àti àwọn olùgbà lẹ́tà ní papọ̀. Àṣàyàn àdánidá ni a lò nínú ẹsẹ̀, a sì fi ọ̀nà tó sún mọ́ ìrísí Gíríìkì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìrísí ìkíni lẹ́tà Gíríìkì mọ́, títí kan àmì méjì ní òpin, nítorí gbólóhùn náà ń bá a lọ nínú ẹsẹ̀ tó tẹ̀ lé e. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
