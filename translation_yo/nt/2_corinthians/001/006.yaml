source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ń jìyà, ó jẹ́ nítorí ìtùnú àti ìgbàlà yín; tàbí bí a bá ń gba ìtùnú, ó jẹ́ nítorí ìtùnú yín[a][b], èyí tí ó ń ṣiṣẹ́ nínú ìfaradà àwọn ìjìyà kan náà tí àwa náà ń jìyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan kò ní: “tàbí bí a bá ń gba ìtùnú, ó jẹ́ nítorí ìtùnú yín.”'
    reason: textual_variant
  - marker: b
    text: Tàbí “ìwúrí” dípò “ìtùnú” ní gbogbo ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: a bá ń jìyà
  rationale: Ó fi ìpọ́njú tí ń lọ lọ́wọ́ hàn ní èdè Yorùbá àdánidá, ó sì bá ọ̀rọ̀ nípa àwọn ìjìyà ní ìparí ẹsẹ náà mu.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: ìtùnú / ń rí ìtùnú gbà
  rationale: Ní àyíká 2 Kọ́ríńtì 1:3–7, ọ̀rọ̀ náà ní ìtumọ̀ ìtùnú àti ìfúnnilókun; “ìtùnú” pa ìṣọ̀kan ọ̀rọ̀ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi “ìwúrí” hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ìgbàlà, ó sì pa ìtumọ̀ gbígbòòrò ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì dín in sí ìdáǹdè kúrò nínú ewu kan ṣoṣo.
- source_word: τῆς ἐνεργουμένης
  choice: èyí tí ń ṣiṣẹ́
  rationale: Ó fi agbára ìtùnú tó ń mú ohun kan ṣẹ hàn, kì í ṣe pé ìtùnú náà wà lásán.
- source_word: ἐν ὑπομονῇ
  choice: nígbà tí ẹ bá fi sùúrù fara da
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì sọ ìfaradà onísùúrù tí gbolohun Gíríìkì ń tọ́ka sí di mímọ̀.
- source_word: τῶν αὐτῶν παθημάτων
  choice: àwọn ìjìyà kan náà
  rationale: Ó pa ìtumọ̀ pé àwọn onígbàgbọ́ àti àwọn aposteli ń ní irú ìjìyà kan náà mọ́.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Nínú àwọn gbólóhùn méjèèjì, ó sọ pé ohun tí àwọn aposteli nírìírí jẹ́ fún àǹfààní àwọn ará Kọ́ríńtì; “nítorí” jẹ́ èdè Yorùbá tó rọrùn ní àyíká yìí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ/yín” fún ọ̀pọ̀ ènìyàn, a sì tún àwọn ọ̀rọ̀ ìtùnú àti ìjìyà ṣe láti pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
