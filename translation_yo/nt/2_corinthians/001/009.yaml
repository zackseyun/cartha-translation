review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the emphatic contrast (ἀλλά; αὐτοί), the perfect-state sense of ἐσχήκαμεν, the purpose clause, and God's defining action of raising the dead. “Ìdájọ́ ikú” appropriately retains the judicial/declarative ambiguity of τὸ ἀπόκριμα τοῦ θανάτου.
  naturalness: “Nínú wa” is more idiomatic and less physically suggestive than “nínú ara wa” for the inward sense intended here. Repeating the verb in the contrast, “ṣùgbọ́n kí a gbẹ́kẹ̀ lé Ọlọ́run,” makes the Yoruba syntax unambiguous and preserves the Greek contrast directly.
  terminology: “Ìdájọ́ ikú,” “gbẹ́kẹ̀ lé,” “Ọlọ́run,” and “ń jí àwọn òkú dìde” are clear, standard, and theologically noninterpretive. The alternate footnote is retained.
  issues:
  - severity: low
    issue: “nínú ara wa” can suggest physical interiority.
    rationale: ἐν ἑαυτοῖς means ‘in ourselves’; “nínú wa” expresses this naturally without the possible bodily nuance of “ara.”
  - severity: low
    issue: “bí kò ṣe Ọlọ́run” leaves the repeated reliance verb implicit.
    rationale: Although understandable, explicitly restating “kí a gbẹ́kẹ̀ lé” gives a more natural and exact Yoruba rendering of the Greek antithesis.
  revised_text: Ṣùgbọ́n ní tòótọ́, àwa fúnra wa ti ní ìdájọ́ ikú[a] nínú wa, kí a má bàa gbẹ́kẹ̀ lé ara wa, ṣùgbọ́n kí a gbẹ́kẹ̀ lé Ọlọ́run, ẹni tí ń jí àwọn òkú dìde.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ìpinnu ikú.”
    reason: lexical_alternative
  revision_rationale: 'The revision makes two limited idiomatic improvements: it renders the inward reflexive phrase as “nínú wa” and explicitly states the second half of the reliance contrast. It does not alter the source''s ambiguity regarding the ‘sentence/verdict of death.’'
