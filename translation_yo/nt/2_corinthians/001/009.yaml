id: 2CO.1.9
reference: 2 Corinthians 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: yo
  text: Ṣùgbọ́n ní tòótọ́, àwa fúnra wa ti ní ìdájọ́ ikú[a] nínú wa, kí a má bàa gbẹ́kẹ̀ lé ara wa, ṣùgbọ́n kí a gbẹ́kẹ̀ lé Ọlọ́run, ẹni tí ń jí àwọn òkú dìde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpinnu ikú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n ní tòótọ́
  rationale: Àkójọpọ̀ yìí pa ìtakò tí ἀλλά ní mọ́, ó sì tún mú ìtẹnumọ́ ọ̀rọ̀ náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτοὶ
  choice: àwa fúnra wa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́; “fúnra wa” fi ìtẹnumọ́ yẹn hàn kedere.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara wa
  rationale: Èyí pa ìtumọ̀ ohun tí wọ́n ní nínú ìrírí ara wọn mọ́ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: ìdájọ́ ikú
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀπόκριμα ń tọ́ka sí ìpinnu tàbí ìdájọ́ tí ikú jẹ́ àbájáde rẹ̀; “ìdájọ́ ikú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àwòrán ìdájọ́ mu.
- source_word: ἐσχήκαμεν
  choice: ti ní
  rationale: Ìṣe pípé náà ń fi ipò tí ó ti fìdí múlẹ̀ láti inú ìrírí tó ti ṣẹlẹ̀ hàn. “Ti ní” pa èyí mọ́ láìfi èrò “gba” kún ọ̀rọ̀ Gíríìkì.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: kí a má bàa gbẹ́kẹ̀ lé
  rationale: “Kí a má bàa” sọ ète tàbí àbájáde tí a pinnu, “gbẹ́kẹ̀ lé” sì fi ìgbẹ́kẹ̀lé tó ti fìdí múlẹ̀ hàn lọ́nà àdánidá.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: bí kò ṣe Ọlọ́run
  rationale: Èyí mú ìtakò láàárín gbígbẹ́kẹ̀lé ara ẹni àti gbígbẹ́kẹ̀lé Ọlọ́run ṣe kedere.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: ẹni tí ń jí àwọn òkú dìde
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó ṣe àpèjúwe Ọlọ́run gẹ́gẹ́ bí ẹni tí agbára rẹ̀ ń mú àwọn òkú padà sí ìyè.
theological_decisions:
- issue: Bóyá τοὺς νεκρούς yẹ kí ó jẹ́ “àwọn òkú” tàbí kí a túmọ̀ rẹ̀ sí “àwọn ènìyàn tí ó ti kú.”
  choice: àwọn òkú
  alternative: àwọn ènìyàn tí ó ti kú
  rationale: “Àwọn òkú” péye, ó yé àwọn òǹkàwé, ó sì pa ìró ọ̀rọ̀ nípa agbára àjíǹde Ọlọ́run mọ́ láìfi àlàyé míì kún un.
- issue: Bóyá ìdájọ́ ikú náà jẹ́ ìdájọ́ òfin gangan tàbí ìmọ̀lára Pọ́ọ̀lù pé ikú rẹ̀ ti dájú.
  choice: ìdájọ́ ikú
  alternative: ìpinnu pé a ó kú
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìdájọ́ tàbí ìpinnu tí ó ti fìdí múlẹ̀. A kò sọ pé ilé-ẹjọ́ ènìyàn ló ṣe e, bẹ́ẹ̀ ni a kò sọ ọ́ di ìmọ̀lára lásán; a pa àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá àgbàdojú, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà pa ìtẹnumọ́ “àwa fúnra wa,” ìtakò láàárín ara ẹni àti Ọlọ́run, àti àìdánilójú kékeré inú ἀπόκριμα mọ́.
