revisions:
- from: Ṣùgbọ́n ní tòótọ́, àwa fúnra wa ti ní ìdájọ́ ikú[a] nínú ara wa, kí a má bàa gbẹ́kẹ̀ lé ara wa, bí kò ṣe Ọlọ́run, ẹni tí ń jí àwọn òkú dìde.
  to: Ṣùgbọ́n ní tòótọ́, àwa fúnra wa ti ní ìdájọ́ ikú[a] nínú wa, kí a má bàa gbẹ́kẹ̀ lé ara wa, ṣùgbọ́n kí a gbẹ́kẹ̀ lé Ọlọ́run, ẹni tí ń jí àwọn òkú dìde.
  rationale: 'The revision makes two limited idiomatic improvements: it renders the inward reflexive phrase as “nínú wa” and explicitly states the second half of the reliance contrast. It does not alter the source''s ambiguity regarding the ‘sentence/verdict of death.’'
