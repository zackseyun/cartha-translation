id: 2CO.1.11
reference: 2 Corinthians 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: yo
  text: Ẹ̀yin pẹ̀lú sì ń bá wa ṣèrànwọ́ nípasẹ̀ àdúrà ẹ̀bẹ̀ yín, kí ọ̀pọ̀ ènìyàn[b] lè dúpẹ́, nípasẹ̀ ọ̀pọ̀ ènìyàn, nítorí wa fún ẹ̀bùn oore-ọ̀fẹ́[c] tí a fi fún wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì tún “ọ̀pọ̀” sọ lẹ́ẹ̀mejì. “Nípasẹ̀ ọ̀pọ̀ ènìyàn” tún lè ní ìtumọ̀ “nípasẹ̀ ọ̀pọ̀ [àdúrà].”
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “láti ọ̀dọ̀ ọ̀pọ̀ ojú.” Níhìn-ín, “ojú” dúró fún àwọn ènìyàn.
    reason: lexical_alternative
  - marker: c
    text: “Ẹ̀bùn oore-ọ̀fẹ́” tún lè jẹ́ “ìbùkún” tàbí “ojúrere tí a fi hàn wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: ń bá wa ṣèrànwọ́
  rationale: Ọ̀rọ̀ náà fi hàn pé àwọn ará Kọ́ríńtì ń darapọ̀ mọ́ Pọ́ọ̀lù nínú ìrànlọ́wọ́; “ń bá wa ṣèrànwọ́” jẹ́ Yorùbá àdánidá tí ó sì pa agbára συν- mọ́.
- source_word: τῇ δεήσει
  choice: nípasẹ̀ ẹ̀bẹ̀ àdúrà yín
  rationale: δέησις tọ́ka sí àdúrà ẹ̀bẹ̀ tàbí ìrawọ́ ẹ̀bẹ̀. “Nípasẹ̀” mú iṣẹ́ irinṣẹ́ dative náà jáde, “yín” sì jẹ́ kó ṣe kedere pé àdúrà àwọn tí a ń bá sọ̀rọ̀ ni.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ṣàfihàn ète tàbí àbájáde gẹ́gẹ́ bí ἵνα, ó sì jẹ́ ọ̀nà Yorùbá tí ó rọrùn jù lọ nínú gbólóhùn yìí.
- source_word: ἐκ πολλῶν προσώπων
  choice: ọ̀pọ̀ ènìyàn
  rationale: πρόσωπον túmọ̀ ní pàtó sí “ojú,” ṣùgbọ́n níbí ó dúró fún ènìyàn. A fi àlàyé ìtumọ̀ gangan sí àkọsílẹ̀ ìsàlẹ̀.
- source_word: χάρισμα
  choice: ẹ̀bùn oore-ọ̀fẹ́
  rationale: χάρισμα jẹ́ ẹ̀bùn tí a fi oore-ọ̀fẹ́ fúnni; yíyan yìí pa èrò “ẹ̀bùn” àti ìpilẹ̀ rẹ̀ nínú oore-ọ̀fẹ́ mọ́ láì sọ irú ìgbàlà pàtó tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: διὰ πολλῶν
  choice: kí ọ̀pọ̀ ènìyàn lè dúpẹ́
  rationale: Gbólóhùn Gíríìkì náà ṣòro, ó sì tún “ọ̀pọ̀” sọ lẹ́ẹ̀mejì. Ọ̀rọ̀ àkọ́kọ́ mú ìtumọ̀ pé ọ̀pọ̀ ènìyàn ni yóò jẹ́ ọ̀nà tí ìdúpẹ́ yóò gbà wá; àkọsílẹ̀ [a] pa àtúmọ̀ tí ó tún “ọ̀pọ̀” sọ lẹ́ẹ̀mejì mọ́.
- source_word: εὐχαριστηθῇ
  choice: lè dúpẹ́
  rationale: Passive Gíríìkì náà túmọ̀ sí pé kí a ṣe ìdúpẹ́. Yorùbá àdánidá máa ń fi ẹni tí ń dúpẹ́ sí ipò olùṣe dípò lílo passive tí yóò le.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ní àyíká àdúrà àti ìdúpẹ́ yìí, “nítorí wa” lè fi ìtọ́kasí tàbí àǹfààní ὑπέρ hàn láì mú un dín kù sí ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Ohun tí χάρισμα ń tọ́ka sí
  choice: ẹ̀bùn oore-ọ̀fẹ́ tí a fi fún wa
  alternative: ìbùkún tàbí ojúrere tí a fi hàn wá
  rationale: Àyíká lè tọ́ka sí ìdáǹdè Ọlọ́run, ṣùgbọ́n ẹsẹ̀ náà kò sọ ọ́ ní pàtó. Nítorí náà, a pa ọ̀rọ̀ “ẹ̀bùn” mọ́, a kò sì sọ irú iṣẹ́ Ọlọ́run tí ó jẹ́ ní ọ̀nà tí yóò ti ìtumọ̀ náà pa.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìgbà òde, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. “Ẹ̀bẹ̀ àdúrà” pa agbára δέησις mọ́, nígbà tí “ń bá wa ṣèrànwọ́” ń sọ ìfọwọ́sowọ́pọ̀ náà ní ọ̀nà tí olùkà Yorùbá lè lóye nírọ̀rùn.
