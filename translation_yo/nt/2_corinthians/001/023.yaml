source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: yo
  text: Ṣùgbọ́n èmi ń pe Ọlọ́run ṣe ẹlẹ́rìí lórí ẹ̀mí mi[a] pé, láti dá yín sí ni mi ò tún lọ sí Kọ́ríńtì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lòdì sí ara mi”; ní ti gidi, “lórí ẹ̀mí mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mi ò tún lọ sí Kọ́ríńtì mọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Ṣùgbọ́n èmi
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ pẹ̀lẹ́ tí δέ ń tọ́ka sí hàn, “èmi” sì pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: ń pe Ọlọ́run ní ẹlẹ́rìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìpè ẹlẹ́rìí nínú ìbúra, ó sì pa ìtumọ̀ pé Pọ́ọ̀lù ń ké pe Ọlọ́run láti jẹ́rìí sí òtítọ́ ọ̀rọ̀ rẹ̀ mọ́.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: sí ọkàn ara mi
  rationale: Ó tẹ̀ lé àwòrán gbólóhùn Gíríìkì, ó sì fi hàn pé Pọ́ọ̀lù fi ara rẹ̀ sábẹ́ ẹ̀rí Ọlọ́run. Àlàyé ìsàlẹ̀ ojú ìwé ṣàfihàn ìtumọ̀ míì tí ó ṣeé ṣe.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàgbékalẹ̀ ohun tí Pọ́ọ̀lù fẹ́ kí Ọlọ́run jẹ́rìí sí.
- source_word: φειδόμενος ὑμῶν
  choice: láti dá yín sí
  rationale: 'Gbólóhùn yìí sọ ète tàbí ìdí ìṣe náà ní Yorùbá àdánidá: Pọ́ọ̀lù kò wá nítorí ó fẹ́ yẹra fún fífi ìbáwí líle kàn wọ́n.'
- source_word: οὐκέτι ἦλθον
  choice: èmi kò tún wá
  rationale: Nínú àyíká ọ̀rọ̀, èyí túmọ̀ sí pé Pọ́ọ̀lù kò ṣe ìpadàbọ̀ tí a retí; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ “kò wá mọ́” mọ́.
- source_word: εἰς Κόρινθον
  choice: sí Kọ́ríńtì
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ìrìn sí ìlú kan.
theological_decisions:
- issue: Ìbúra tí ó fi Ọlọ́run ṣe ẹlẹ́rìí àti ohun tí ἐπὶ τὴν ἐμὴν ψυχήν túmọ̀ sí
  choice: sí ọkàn ara mi
  alternative: lòdì sí ara mi
  rationale: A pa ìrísí àkànṣe Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́, láì pinnu bóyá ἐπί níhìn-ín tẹnumọ́ ohun tí ìbúra náà dúró lé tàbí ìdájọ́ tí yóò dojú kọ Pọ́ọ̀lù bí ọ̀rọ̀ rẹ̀ bá jẹ́ irọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Dá yín sí” jẹ́ ọ̀rọ̀ àdánidá fún fífi ìyà tàbí ìbáwí tí ó lè dé bá wọn sílẹ̀; a sì fi àwọn ìtumọ̀ míì tí gbólóhùn Gíríìkì lè gbà sínú àlàyé ìsàlẹ̀ ojú ìwé.
