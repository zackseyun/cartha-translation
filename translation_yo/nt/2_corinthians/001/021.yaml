source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: yo
  text: Ẹni tí ó ń mú wa dúró ṣinṣin pẹ̀lú yín nínú Mèsáyà, tí ó sì fi òróró yàn wa, ni Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi.” Ọ̀rọ̀ oyè náà ní èdè Gíríìkì ni Christos; a sì túmọ̀ rẹ̀ sí “Mèsáyà” níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: ń mú ... dúró ṣinṣin
  rationale: Ó fi ìtumọ̀ mímú ohun dúró ṣinṣin tàbí fífi ìdí rẹ̀ múlẹ̀ hàn, ó sì pa agbára ìṣe tí ń lọ lọ́wọ́ inú ọ̀rọ̀ ìṣe àbọ̀ Gíríìkì mọ́.
- source_word: σὺν ὑμῖν
  choice: wa àti ẹ̀yin
  rationale: Ìṣètò yìí sọ ìdánimọ̀pọ̀ Pọ́ọ̀lù àti àwọn ará Kọ́ríńtì ní Yorùbá àdánidá, láìsọ wọ́n di ẹgbẹ́ méjì tí kò ní ìbáṣepọ̀.
- source_word: εἰς Χριστόν
  choice: nínú Mèsáyà
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς lè túmọ̀ ní ti gidi sí ‘sínú,’ níbí ó ń tọ́ka sí ìbáṣepọ̀ tàbí ìṣọ̀kan pẹ̀lú Mèsáyà; ‘nínú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ọ́.
- source_word: χρίσας
  choice: fi òróró yàn
  rationale: Ó pa àwòrán ìyan-ni-pípàṣẹ nípa òróró mọ́, ó sì ṣetọju ìsopọ̀ ọ̀rọ̀ náà pẹ̀lú Χριστός.
- source_word: θεός
  choice: Ọlọ́run
  rationale: A gbé ‘Ọlọ́run’ síwájú gẹ́gẹ́ bí àfihàn àdánidá ní Yorùbá, nígbà tí ìtẹnumọ́ pé Ọlọ́run gan-an ni olùṣe náà ṣì dúró.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ní àyíká yìí Χριστός jẹ́ oyè ẹni tí a fi òróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò kí ó dà bí orúkọ lásán.
theological_decisions:
- issue: Agbára εἰς nínú εἰς Χριστόν
  choice: Ìtumọ̀ ìbáṣepọ̀/ìṣọ̀kan, ‘nínú Mèsáyà’
  alternative: Ìtumọ̀ lẹ́tà-lẹ́tà ‘sínú Mèsáyà’ tàbí ọ̀nà àṣà ‘nínú Kristi’
  rationale: ‘Sínú’ lè ṣeé gbà ní ti gírámà, ṣùgbọ́n lílo Pọ́ọ̀lù níbí ń tọ́ka sí mímú wọn dúró ṣinṣin nínú ìbáṣepọ̀ pẹ̀lú Mèsáyà. ‘Nínú’ jẹ́ kíkà àdánidá tí kò fi ìtumọ̀ ìṣọ̀kan náà sí pàtó ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà jẹ́ ti ìgbàlódé, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. ‘Wa àti ẹ̀yin’ mú ìkópa papọ̀ tí Gíríìkì sọ hàn ní ọ̀nà tí ó rọrùn fún òǹkàwé Yorùbá.
