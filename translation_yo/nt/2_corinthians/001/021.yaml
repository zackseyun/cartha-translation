revisions:
- from: Ṣùgbọ́n Ọlọ́run ni ẹni tí ń mú wa àti ẹ̀yin dúró ṣinṣin nínú Mèsáyà[a], tí ó sì fi òróró yàn wa.
  to: Ẹni tí ó ń mú wa dúró ṣinṣin pẹ̀lú yín nínú Mèsáyà, tí ó sì fi òróró yàn wa, ni Ọlọ́run.[a]
  rationale: Àtúnṣe náà rọ́pò “wa àti ẹ̀yin” pẹ̀lú “wa pẹ̀lú yín” láti sọ ìtumọ̀ σὺν ὑμῖν ní Yorùbá àdánidá. A tún ṣètò gbolohun náà sí “Ẹni tí ó … ni Ọlọ́run” láti jẹ́ kí ìparí θεός hàn ní ìtẹnumọ́, láìfi ìtumọ̀ tuntun kún un. Àmì ìsàlẹ̀ ni a gbé sí ìkẹyìn gbolohun kí ó má bà a dà bí pé ó kan Mèsáyà nìkan, bí ó tilẹ̀ jẹ́ pé òun ni ọ̀rọ̀ tí àlàyé náà ń tọ́ka sí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:52Z'
