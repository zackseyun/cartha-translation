  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa oyè náà mọ́, ó ṣàfihàn κηρυχθείς gẹ́gẹ́ bí ìkéde, ó tún pa ìṣọ̀kan ìlò διά mọ́, ó sì fi ‘kò di’/‘ó ti di’ hàn fún ἐγένετο àti γέγονεν. Àwòrán ‘Bẹ́ẹ̀ ni’ àti ‘Bẹ́ẹ̀ kọ́’ tún dá ìfipá ọ̀rọ̀ Pọ́ọ̀lù sí.'
