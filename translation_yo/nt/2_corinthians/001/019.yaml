revisions:
- from: Nítorí Ọmọ Ọlọ́run, Jésù Mèsáyà, ẹni tí a kéde láàárín yín nípasẹ̀ wa—nípasẹ̀ èmi àti Sílífánù àti Tímótì—kò di “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́”; ṣùgbọ́n nínú rẹ̀, ó ti di “Bẹ́ẹ̀ ni.”
  to: Nítorí Ọmọ Ọlọ́run, Jésù Mèsáyà, ẹni tí a kéde láàárín yín nípasẹ̀ wa—nípasẹ̀ mi àti Sílífánù àti Tímótì—kò di “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́”; ṣùgbọ́n nínú rẹ̀, ó ti di “Bẹ́ẹ̀ ni.”
  rationale: A tún ‘èmi’ ṣe sí ‘mi’ lẹ́yìn ‘nípasẹ̀’ kí gírámà Yorùbá lè tọ́. Gbogbo àwọn ìpinnu ìtumọ̀ míì ni a pa mọ́, pẹ̀lú àìdánilójú tó mọ̀ọ́mọ̀ wà nínú ọ̀rọ̀ Ναί/Οὔ.
