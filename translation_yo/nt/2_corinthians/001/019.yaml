id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: yo
  text: Nítorí Ọmọ Ọlọ́run, Jésù Mèsáyà, ẹni tí a kéde láàárín yín nípasẹ̀ wa—nípasẹ̀ mi àti Sílífánù àti Tímótì—kò di “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́”; ṣùgbọ́n nínú rẹ̀, ó ti di “Bẹ́ẹ̀ ni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa ọ̀rọ̀ oyè nípa Kristi mọ́ ní ọ̀nà tí ó jẹ́ àdánidá, tí ó sì wọ́pọ̀ nínú Yorùbá.
- source_word: Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè ‘Mèsáyà’ níbí; àkójọpọ̀ náà dúró gẹ́gẹ́ bí orúkọ àti oyè láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
- source_word: κηρυχθείς
  choice: ẹni tí a kéde
  rationale: ‘Kéde’ mú ìtumọ̀ ìpolongo ní gbangba ti κηρύσσω jáde ní Yorùbá òde òní.
- source_word: δι’ ἡμῶν
  choice: nípasẹ̀ wa
  rationale: Ó pa ìtumọ̀ ohun èlò tàbí aṣojú ti διά mọ́, ó sì múra ọ̀nà sílẹ̀ fún àwọn orúkọ tó tẹ̀ lé.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: nípasẹ̀ èmi àti Sílífánù àti Tímótì
  rationale: Ó tún preposition náà ṣe gẹ́gẹ́ bí Gíríìkì, ó sì pa ìtọ́ka Pọ́ọ̀lù sí ara rẹ̀ àti àwọn alábàáṣiṣẹ́ rẹ̀ mọ́.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: kò di “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́”
  rationale: ‘Kò di’ ṣàfihàn ἐγένετο, nígbà tí ‘Bẹ́ẹ̀ ni’ àti ‘Bẹ́ẹ̀ kọ́’ pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́ láìtú u sí àlàyé.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: ṣùgbọ́n nínú rẹ̀, ó ti di “Bẹ́ẹ̀ ni”
  rationale: ‘Ó ti di’ mú ipa perfect γέγονεν jáde, ‘nínú rẹ̀’ sì pa àìṣedéédé tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός nínú Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: A yan ‘Mèsáyà’ láti fi oyè náà hàn ní kedere; a kò yí i sí orúkọ tí a yá láti èdè mìíràn nígbà tí Yorùbá lè sọ ìtumọ̀ oyè náà.
- issue: Bóyá kí a ṣàlàyé Ναί/Οὔ tàbí kí a pa àwòrán ọ̀rọ̀ náà mọ́
  choice: “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́” ... “Bẹ́ẹ̀ ni”
  alternative: kì í ṣe aláìdúróṣinṣin, bí kò ṣe ẹni tí a lè gbára lé
  rationale: A pa ọ̀nà ìsọ Pọ́ọ̀lù àti ẹdọfu ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, dípò kí a yan ìtumọ̀ kan ṣoṣo fún òǹkàwé.
translation_notes:
  register: Yorùbá àgbékalẹ̀, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. Àwọn àfikún àmì ìsọ yí ‘Bẹ́ẹ̀ ni/Bẹ́ẹ̀ kọ́’ ká láti fi hàn pé Pọ́ọ̀lù ń lo wọn gẹ́gẹ́ bí ọ̀rọ̀ àkànṣe.
