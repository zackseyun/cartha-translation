  revised_text: Nítorí Ọmọ Ọlọ́run, Jésù Mèsáyà, ẹni tí a kéde láàárín yín nípasẹ̀ wa—nípasẹ̀ mi àti Sílífánù àti Tímótì—kò di “Bẹ́ẹ̀ ni” àti “Bẹ́ẹ̀ kọ́”; ṣùgbọ́n nínú rẹ̀, ó ti di “Bẹ́ẹ̀ ni.”
