  terminology: ‘Ọmọ Ọlọ́run,’ ‘Jésù Mèsáyà,’ ‘kéde,’ àti àwọn orúkọ Sílífánù/Tímótì jẹ́ èyí tí ó bá ìforúkọsílẹ̀ àti ìforúkọsílẹ̀ oyè mu. Kò sí ìtúmọ̀ ẹ̀kọ́ ìjọ tí a fi kún un.
  issues:
