revisions:
- from: Ìrètí wa nípa yín sì dúró ṣinṣin, nítorí a mọ̀ pé bí ẹ ti ń ṣe alábápín nínú àwọn ìjìyà náà, bẹ́ẹ̀ náà ni ẹ ń ṣe alábápín nínú ìtùnú náà.[a]
  to: Ìrètí wa nípa yín sì dúró ṣinṣin, nítorí a mọ̀ pé, bí ẹ ṣe jẹ́ alábápín nínú àwọn ìjìyà, bẹ́ẹ̀ náà ni ẹ ṣe jẹ́ alábápín nínú ìtùnú.[a]
  rationale: The revision retains the draft’s faithful lexical choices and correlative structure while rendering κοινωνοί ἐστε as a present predicate (‘ẹ ṣe jẹ́ alábápín’) rather than a progressive action. It also removes nonessential demonstratives not expressed in the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s firm hope, its stated basis in shared suffering, and the corresponding sharing in comfort. However, the Greek uses the present copula ('you are participants'), whereas 'ẹ ń ṣe alábápín' introduces a more explicitly progressive action. The demonstratives 'náà' are also not needed to represent the Greek.
  naturalness: The wording is clear and appropriately dignified Standard Yoruba. 'Jẹ́ alábápín nínú' is a more direct and idiomatic way to render the Greek predicate than 'ń ṣe alábápín nínú.'
  terminology: Ìrètí, dúró ṣinṣin, ìjìyà, and ìtùnú are suitable and consistent with the passage’s terminology. The footnote appropriately preserves 'ìṣírí' as a viable alternative for παράκλησις.
  issues:
  - severity: low
    issue: Progressive construction for κοινωνοί ἐστε
    rationale: ‘Ẹ ń ṣe alábápín’ can imply an ongoing activity. The Greek more directly states that the Corinthians are participants/sharers; ‘ẹ ṣe jẹ́ alábápín’ preserves this predicate relationship without adding aspect.
  - severity: low
    issue: Added demonstratives náà
    rationale: ‘Àwọn ìjìyà náà’ and ‘ìtùnú náà’ are understandable contextually, but the Greek does not specifically mark these nouns with demonstratives. Omitting náà is closer and cleaner.
  revised_text: Ìrètí wa nípa yín sì dúró ṣinṣin, nítorí a mọ̀ pé, bí ẹ ṣe jẹ́ alábápín nínú àwọn ìjìyà, bẹ́ẹ̀ náà ni ẹ ṣe jẹ́ alábápín nínú ìtùnú.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí “ìṣírí” dípò “ìtùnú” (παράκλησις).
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful lexical choices and correlative structure while rendering κοινωνοί ἐστε as a present predicate (‘ẹ ṣe jẹ́ alábápín’) rather than a progressive action. It also removes nonessential demonstratives not expressed in the Greek.
