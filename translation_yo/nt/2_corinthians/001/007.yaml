id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: yo
  text: Ìrètí wa nípa yín sì dúró ṣinṣin, nítorí a mọ̀ pé, bí ẹ ṣe jẹ́ alábápín nínú àwọn ìjìyà, bẹ́ẹ̀ náà ni ẹ ṣe jẹ́ alábápín nínú ìtùnú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣírí” dípò “ìtùnú” (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: ìrètí
  rationale: “Ìrètí” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ìfojúsọ́nà tí ìgbẹ́kẹ̀lé wà nínú rẹ̀, láì sọ ọ́ di ìdánilójú lásán.
- source_word: βεβαία
  choice: dúró ṣinṣin
  rationale: Gbólóhùn yìí fi hàn pé ìrètí náà fẹsẹ̀ múlẹ̀, ó sì ṣe é gbẹ́kẹ̀ lé; ó tún jẹ́ èdè Yorùbá àdánidá.
- source_word: ὑπὲρ ὑμῶν
  choice: nípa yín
  rationale: Nínú àyíká yìí, ὑπέρ tọ́ka sí àwọn ará Kọ́ríńtì gẹ́gẹ́ bí àwọn tí ìrètí náà kàn; “nípa yín” ṣàfihàn ìtumọ̀ yẹn ní kedere.
- source_word: εἰδότες
  choice: nítorí a mọ̀ pé
  rationale: Ọ̀rọ̀ aláìlẹ́ni Gíríìkì náà sọ ìdí tí ìrètí Pọ́ọ̀lù fi dúró ṣinṣin; “nítorí” mú ìbáṣepọ̀ ìdí yìí hàn gbangba.
- source_word: ὡς ... οὕτως καί
  choice: bí ... bẹ́ẹ̀ náà ni
  rationale: Èyí pa ìṣọ̀kan ìfiwéra Gíríìkì mọ́, ó sì ń dun bí Yorùbá àdánidá.
- source_word: κοινωνοί
  choice: ń ṣe alábápín nínú
  rationale: “Alábápín” ṣàfihàn kíkópa tàbí pínpín ohun kan pọ̀, ó sì bá àkópọ̀ gírámà ẹsẹ náà mu.
- source_word: παθημάτων
  choice: àwọn ìjìyà
  rationale: “Àwọn ìjìyà” jẹ́ ọ̀rọ̀ gbòòrò, tó ṣe kedere fún onírúurú ohun tí ènìyàn ń fara dà nínú àyíká yìí.
- source_word: παρακλήσεως
  choice: ìtùnú
  rationale: Nínú àyíká 2 Kọ́ríńtì 1, “ìtùnú” pa àkòrí ọ̀rọ̀ tí Pọ́ọ̀lù ń tún lò mọ́; síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ìṣírí.
- source_word: '[elliptical second clause]'
  choice: ẹ ń ṣe alábápín nínú
  rationale: Gíríìkì kò tún ọ̀rọ̀ ìṣe náà sọ ní abala kejì, ṣùgbọ́n Yorùbá nílò rẹ̀ kí gbólóhùn náà lè péye, kedere, kí ó sì ṣàn dáadáa.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé lásán. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa ìfiwéra àti ìdí tí ọ̀rọ̀ Gíríìkì fi gbé kalẹ̀ mọ́.
