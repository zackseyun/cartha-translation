id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí àwọn ìjìyà Kristi[a][b] ṣe ń pọ̀ sí i nínú wa, bẹ́ẹ̀ náà ni ìtùnú wa ṣe ń pọ̀ sí i nípasẹ̀ Kristi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìjìyà nítorí Kristi.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìjìyà tó jẹ́ ti Kristi tàbí ìjìyà tí a fara dà nítorí rẹ̀.
    reason: alternative_reading
  - marker: b
    text: A tún lè tú “Kristi” sí “Mèsáyà” níbi tí ipò oyè náà bá ṣe pàtàkì jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ọ̀rọ̀ tó ṣáájú, ó sì pa agbára ìdí tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: καθὼς ... οὕτως
  choice: gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni
  rationale: Ó pa ìfiwéra alábápín méjì inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: περισσεύει
  choice: ń ṣàn àkúnwọ́sílẹ̀
  rationale: Àwòrán yìí fi ọ̀pọ̀lọpọ̀ tó ré kọjá òṣùwọ̀n hàn, ó sì jẹ́ kí àtúnsọ ọ̀rọ̀ náà ní apá méjèèjì ṣe kedere.
- source_word: τὰ παθήματα
  choice: àwọn ìjìyà
  rationale: “Ìjìyà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà tó sì bójú mu fún àwọn ìrírí ìpọ́njú tí Pọ́ọ̀lù ń sọ nípa wọn.
- source_word: τοῦ Χριστοῦ
  choice: Kristi
  rationale: Àfikún orúkọ méjì ní “àwọn ìjìyà Kristi” pa ìbáṣepọ̀ tí genitive Gíríìkì kò tú sí ọ̀nà kan ṣoṣo mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ “nítorí Kristi” sílẹ̀ gẹ́gẹ́ bí àṣàyàn.
- source_word: εἰς ἡμᾶς
  choice: dé ọ̀dọ̀ wa
  rationale: Ó sọ ní Yorùbá àdánidá pé àwọn ìjìyà náà ń dé bá Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀, láìfi “sínú wa” tí kò rọrùn múlẹ̀.
- source_word: διὰ τοῦ Χριστοῦ
  choice: nípasẹ̀ Kristi
  rationale: Ó fi Kristi hàn gẹ́gẹ́ bí ẹni tí ìtùnú fi ń dé, ní ìbámu pẹ̀lú διά pẹ̀lú genitive.
- source_word: παράκλησις
  choice: ìtùnú
  rationale: Nínú àyíká ẹsẹ̀ yìí, “ìtùnú” dára jù lọ fún ìtumọ̀ pastoral tí ó dúró ní ìdàkejì ìpọ́njú àti ìjìyà.
- source_word: ἡ παράκλησις ἡμῶν
  choice: ìtùnú wa
  rationale: Ó tú gbólóhùn oníṣúra náà ní tààrà, ó sì jẹ́ kó ṣeé kà láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ìjìyà Kristi”
  choice: A pa ìbáṣepọ̀ náà ṣí sí ìjìyà tó jẹ́ ti Kristi, tí àwọn ènìyàn rẹ̀ sì ń ṣe àjọpín nínú rẹ̀.
  alternative: Àwọn ìjìyà tí a fara dà nítorí Kristi; tàbí ìjìyà tí Kristi fúnra rẹ̀ ní tí ó ń dé bá àwọn ènìyàn rẹ̀.
  rationale: Genitive τοῦ Χριστοῦ lè gba ju ìtumọ̀ kan lọ. Ọ̀rọ̀ pàtàkì náà kò yanju rẹ̀ sí ọ̀nà kan ṣoṣo, àlàyé ìsàlẹ̀ sì pa àṣàyàn “nítorí Kristi” mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ṣàn àkúnwọ́sílẹ̀” pa àwòrán περισσεύει àti àtúnsọ rẹ̀ mọ́; “dé ọ̀dọ̀ wa” sì jẹ́ àdánidá ju ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ “sínú wa” lọ.
