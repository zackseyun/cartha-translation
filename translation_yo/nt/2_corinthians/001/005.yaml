revisions:
- from: Nítorí gẹ́gẹ́ bí àwọn ìjìyà Kristi[a][b] ti ń ṣàn àkúnwọ́sílẹ̀ dé ọ̀dọ̀ wa, bẹ́ẹ̀ náà ni ìtùnú wa ṣe ń ṣàn àkúnwọ́sílẹ̀ nípasẹ̀ Kristi.
  to: Nítorí gẹ́gẹ́ bí àwọn ìjìyà Kristi[a][b] ṣe ń pọ̀ sí i nínú wa, bẹ́ẹ̀ náà ni ìtùnú wa ṣe ń pọ̀ sí i nípasẹ̀ Kristi.
  rationale: A rọ́pò ìtumọ̀ εἰς ἡμᾶς pẹ̀lú ‘nínú wa’ láti pa ìhà ìrírí tí ó wà nínú Gíríìkì mọ́. A tún lo ‘ń pọ̀ sí i’ lẹ́ẹ̀mejì fún περισσεύει, nítorí ó jẹ́ ọ̀nà Yorùbá tó dáa láti fi ìpọ̀lọpọ̀ tó ré kọjá ìwọ̀n hàn, nígbà tí ó ń pa ìfiwéra àti àtúnsọ ti ẹsẹ̀ náà mọ́. Àwọn àlàyé ìsàlẹ̀ mejeeji wà pẹ̀lú àwọn àmì wọn, wọ́n sì ń pa àìdájú tó wà nínú ‘ìjìyà Kristi’ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:03Z'
