  terminology: ‘Ìjìyà Kristi’ pa genitive τοῦ Χριστοῦ mọ́ ní ìmọ̀lára rẹ̀ tí a kò tíì mú sí ojú kan; àlàyé ìsàlẹ̀ náà ń dáàbò bo ìtumọ̀ ‘nítorí Kristi.’ ‘Ìtùnú’ yẹ fún παράκλησις nínú àyíká ìpọ́njú yìí. ‘Kristi’ ní ọ̀rọ̀ pàtàkì dára, a sì fi ‘Mèsáyà’ sí àlàyé gẹ́gẹ́ bí àṣàyàn lexical.
