id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: yo
  text: Ẹni tí ó gbà wá là kúrò nínú ikú ńlá bẹ́ẹ̀, tí yóò sì gbà wá là; òun ni a ti ní ìrètí nínú rẹ̀ pé yóò ṣì gbà wá là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηλικούτου
  choice: irú ... ńlá bẹ́ẹ̀
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ bí ikú tàbí ewu náà ti pọ̀ tó; gbólóhùn yìí mú ìtẹnumọ́ náà jáde lọ́nà Yorùbá àdánidá.
- source_word: θανάτου
  choice: ikú
  rationale: Orúkọ Gíríìkì náà túmọ̀ ní tààrà sí ‘ikú.’ A pa àwòrán inú orísun mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé ìtumọ̀ àfidípò nínú àlàyé ìsàlẹ̀.
- source_word: ἐρρύσατο
  choice: gbà wá ... là
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí gbígbà ènìyàn sílẹ̀ kúrò nínú ewu; ‘gbà ... là’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: ῥύσεται
  choice: yóò ... gbà wá là
  rationale: A lo ọ̀rọ̀ kan náà fún ọ̀rọ̀-ìṣe tó jọra, a sì fi ‘yóò’ hàn pé ohun ọjọ́ iwájú ni.
- source_word: εἰς ὃν
  choice: Òun ni àwa ti gbẹ́kẹ̀ lé
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, εἰς ń fi ẹni tí ìrètí dúró lé hàn; ‘gbẹ́kẹ̀ lé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrètí tí a fi sínú ẹnì kan.
- source_word: ἠλπίκαμεν
  choice: àwa ti gbẹ́kẹ̀ lé
  rationale: Ìṣe pípé náà ń fi ìrètí tí a ti gbé lé Ọlọ́run, tí ó sì ń bá a lọ, hàn; ‘ti gbẹ́kẹ̀ lé’ pa ìfaradà yìí mọ́.
- source_word: καὶ ἔτι
  choice: ṣì tún
  rationale: ‘Ṣì’ ń fi ìtẹ̀síwájú hàn, ‘tún’ sì ń fi ìgbà míì hàn; papọ̀ wọn mú agbára ọ̀rọ̀ Gíríìkì náà jáde láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Bóyá kí a tú ‘ikú’ ní tààrà tàbí kí a sọ ọ́ di ‘ewu ikú’ nínú ọ̀rọ̀ àkọ́kọ́
  choice: Pa ‘ikú’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́
  alternative: Tú un lọ́nà àdánidá sí ‘ewu ikú ńlá bẹ́ẹ̀’
  rationale: Gíríìkì sọ ‘ikú’ ní pàtó. Pípa ọ̀rọ̀ náà mọ́ ń bọ̀wọ̀ fún àwòrán àti ìtẹnumọ́ Pọ́ọ̀lù, nígbà tí àlàyé ìsàlẹ̀ ń jẹ́ kí òǹkàwé rí ìtumọ̀ pé ewu tó lè pani ni.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Gbà ... là’ jẹ́ ọ̀rọ̀ àdánidá fún ìgbàlà kúrò nínú ewu. A tún ìṣe náà sọ lẹ́ẹ̀mejì gẹ́gẹ́ bí Gíríìkì, a sì lo ‘ṣì tún’ láti pa ìtẹ̀síwájú àti ìrètí ìgbà iwájú mọ́.
