  source_fidelity: Ìtumọ̀ náà pa ‘ikú’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ní i, ó sì tọ́ka sí ìgbàlà àtijọ́, ti ọjọ́ iwájú, àti ìgbàlà tí a tún ń retí. Ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ ‘gbà wá kúrò’ nílò ‘là’ kí ìtumọ̀ ìdáǹdè kúrò nínú ewu le pé. Bákan náà, ‘tún’ wà nínú ìsọfúnni ọjọ́ iwájú àkọ́kọ́, níbi tí Gíríìkì kò ti fi ‘again/yet’ sí; καὶ ἔτι wà ní ìsọfúnni ìkẹyìn.
  naturalness: ‘Gbà wá là kúrò nínú’ jẹ́ Yorùbá tí ó péye, tó sì dára ju ‘gbà wá kúrò nínú’ lọ. ‘A ti ní ìrètí nínú rẹ̀’ jẹ́ ọ̀nà ìgbàlódé tí ó hàn gbangba láti sọ ìrètí tí a ti fi sí ẹni náà, ó sì yẹ fún ìṣe pípé Gíríìkì náà.
  terminology: A pa ‘ikú’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì lo ‘gbà ... là’ fún ῥύομαι ní gbogbo ìgbà mẹ́ta. Àlàyé ìsàlẹ̀ ń fúnni ní ‘ewu ńlá tó lè pa wá’ gẹ́gẹ́ bí ìtumọ̀ àfidípò, láì rọ́pò àwòrán ‘ikú’ nínú ọ̀rọ̀ àkọ́kọ́.
