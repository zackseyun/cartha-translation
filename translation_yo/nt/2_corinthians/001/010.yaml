revisions:
- from: ẹni tí ó gbà wá kúrò nínú irú ikú ńlá bẹ́ẹ̀, tí yóò sì tún gbà wá là.[a] Òun ni àwa ti gbẹ́kẹ̀ lé pé yóò ṣì tún gbà wá là,
  to: Ẹni tí ó gbà wá là kúrò nínú ikú ńlá bẹ́ẹ̀, tí yóò sì gbà wá là; òun ni a ti ní ìrètí nínú rẹ̀ pé yóò ṣì gbà wá là.
  rationale: Àtúnṣe náà fi ‘là’ kún ìgbàlà àkọ́kọ́, ó sì yọ ‘tún’ kúrò níbi tí kò sí nínú Gíríìkì. A fi ‘ṣì’ sí ìsọfúnni ìkẹyìn láti ṣàfihàn ἔτι (‘sí i/yet’), nígbà tí ‘a ti ní ìrètí nínú rẹ̀’ ń pa ìtumọ̀ ἠλπίκαμεν àti εἰς ὃν mọ́. A tún pa ìtumọ̀ gangan ‘ikú’ mọ́, pẹ̀lú àlàyé àfidípò rẹ̀.
