id: 2CO.1.16
reference: 2 Corinthians 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: yo
  text: kí n sì gba ọ̀dọ̀ yín kọjá lọ sí Makedóníà, kí n tún ti Makedóníà wá sọ́dọ̀ yín, kí ẹ sì rán mi lọ sí Jùdíà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ sì ràn mí lọ́wọ́ láti tẹ̀ síwájú nínú ìrìnàjò mi sí Jùdíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: gba ọ̀dọ̀ yín kọjá
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pọ́ọ̀lù fẹ́ gba ibi tí àwọn ará Kọ́ríńtì wà kọjá gẹ́gẹ́ bí apá kan nínú ìrìnàjò rẹ̀.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: kọjá lọ sí Makedóníà
  rationale: Ó mú ìtumọ̀ lílọ gba ibì kan kọjá sí ibi tí a ń lọ jáde ní Yorùbá àdánidá.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: tún ti Makedóníà wá sọ́dọ̀ yín
  rationale: “Tún” tọ́ka sí ìpadà wá lẹ́ẹ̀kejì, “ti Makedóníà” sì pa orísun ìrìnàjò mọ́.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: kí ẹ sì rán mi lọ
  rationale: Ó pa àwọn ará Kọ́ríńtì mọ́ gẹ́gẹ́ bí olùṣe, ó sì sọ ìránni lọ síwájú nínú ìrìnàjò ní ọ̀nà tó ṣe kedere; ìtumọ̀ ìrànlọ́wọ́ fún ìrìnàjò wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: sí Jùdíà
  rationale: “Sí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ibi tí ìrìnàjò ń lọ hàn.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún; gbólóhùn náà tẹ̀ lé ìṣàn èrò ẹsẹ tó ṣáájú, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú “kí n sì.” Orúkọ ibi “Makedóníà” àti “Jùdíà” ni a lò ní fọ́ọ̀mù Yorùbá tó ṣe kedere.
