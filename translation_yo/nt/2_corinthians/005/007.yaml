  text: For we walk by faith[a], not by sight—
translation:
  language: yo
  text: Nítorí a ń rìn nípa ìgbàgbọ́, kì í ṣe nípa ohun tí ojú rí[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìrísí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìrísí tàbí fọ́ọ̀mù ohun tí a lè rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: διά pẹ̀lú ọ̀rọ̀ inú genitive ń fi ọ̀nà tàbí ohun èlò hàn. “Nípa ìgbàgbọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ìyàtọ̀ tó wà láàárín πίστις àti εἶδος mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó yí ẹsẹ̀ náà ká. “Nítorí” pa ipa àsopọ̀ àti àlàyé rẹ̀ mọ́.
- source_word: περιπατοῦμεν
  choice: àwa ń rìn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí “rìn” ní tààrà, ó sì lè jẹ́ àkàwé fún bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀. “Àwa ń rìn” pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì yé òǹkàwé Yorùbá.
- source_word: οὐ διὰ εἴδους
  choice: kì í ṣe nípa ohun tí a rí
  rationale: εἶδος lè tọ́ka sí ohun tí ojú rí, ìrísí, tàbí àwòrán ohun. “Ohun tí a rí” jẹ́ ti ẹ̀dá Yorùbá, ó sì yàgò fún dídín ìtumọ̀ náà kù sí ìrísí òde nìkan.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ Pọ́ọ̀lù yìí
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú ìtakora pẹ̀lú εἶδος, πίστις ń tọ́ka sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé dípò ohun tí a lè rí. “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó bójú mu jù, láìfi ìtumọ̀ “ìṣòtítọ́” tí kò lágbára nínú àyíká yìí wọlé.
- issue: Bí a ṣe máa túmọ̀ εἶδος láìyanju àìdánilójú rẹ̀
  choice: ohun tí a rí
  alternative: ìrísí; ohun tí ojú rí
  rationale: “Ohun tí a rí” mú ìtakora pẹ̀lú ìgbàgbọ́ hàn ní kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn, “ìrísí,” mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A pa àkàwé “rìn” mọ́, a sì lo “ohun tí a rí” láti mú ìtakora náà hàn lọ́nà àdánidá. Àmì ìdádúró gígùn ní òpin ń tẹ̀ lé bí ẹsẹ̀ náà ṣe ń lọ sínú ọ̀rọ̀ tó tẹ̀ lé e.
