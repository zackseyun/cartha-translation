  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: yo
  text: Nítorí náà, láti ìsinsin yìí lọ, a kò tún mọ̀ ẹnikẹ́ni gẹ́gẹ́ bí ti ara mọ́[a]. Bí ó tilẹ̀ jẹ́ pé a ti mọ Mèsáyà gẹ́gẹ́ bí ti ara rí[b], ṣùgbọ́n nísinsin yìí a kò tún mọ̀ ọ́n mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti ọ̀rọ̀ gangan, “gẹ́gẹ́ bí ti ara”; ó tún lè túmọ̀ sí “láti ojú ìwòye ènìyàn” tàbí “nípa ìlànà ayé.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni Χριστόν; ní ti àṣà, a máa ń túmọ̀ ọ́ sí “Kristi.” Níhìn-ín a túmọ̀ rẹ̀ sí “Mèsáyà” láti pa ìtumọ̀ oyè náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí tàbí àbájáde àríyànjiyàn Pọ́ọ̀lù ṣáájú rẹ̀.
- source_word: ἀπὸ τοῦ νῦν
  choice: láti ìsinsin yìí lọ
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìyípadà kan tí ó bẹ̀rẹ̀ ní báyìí tí ó sì ń bá a lọ.
- source_word: οὐδένα οἴδαμεν
  choice: a kò fi ... wo ẹnikẹ́ni mọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, οἴδαμεν kọjá mímọ ẹni lásán; ó kan bí a ṣe ń wo tàbí ṣe ìdájọ́ ẹni. ‘Fi ojú ... wo’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: κατὰ σάρκα
  choice: fi ojú ti ara wo
  rationale: Ó pa àwòrán ‘ara’ (σάρξ) mọ́, nígbà tí ó ń sọ̀rọ̀ nípa wíwo ẹni láti ojú ìwòye ènìyàn tàbí ní ìbámu pẹ̀lú ìlànà ayé.
- source_word: εἰ καὶ
  choice: Bí ó tilẹ̀ jẹ́ pé
  rationale: Ó gbé agbára ìyọ̀ǹda inú gbólóhùn Gíríìkì jáde láì pinnu ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐγνώκαμεν
  choice: a ti fi ... wo ... rí
  rationale: ‘ti ... rí’ fi ìṣe ìgbà àtijọ́ tí ó ní í ṣe pẹ̀lú ìsinsin yìí hàn, ní ìbámu pẹ̀lú perfect Gíríìkì.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè tó túmọ̀ sí Ẹni Àmì-òróró; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò kí ó dà bí orúkọ lásán.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: síbẹ̀ nísinsin yìí, a kò mọ̀ ọ́n lọ́nà yẹn mọ́
  rationale: Ó pa ìyàtọ̀ tó lágbára láàárín ọ̀nà ìmọ̀ tẹ́lẹ̀ àti ti ìsinsin yìí mọ́; ‘lọ́nà yẹn’ tọ́ka sí κατὰ σάρκα láì tún un sọ lọ́nà tí kò ṣe àdánidá.
theological_decisions:
- issue: Ìtumọ̀ κατὰ σάρκα nípa àwọn ènìyàn àti Mèsáyà
  choice: fi ojú ti ara wo
  alternative: láti ojú ìwòye ènìyàn; nípa ìlànà ayé
  rationale: Ìtumọ̀ náà pa èdè Pọ́ọ̀lù nípa ‘ara’ mọ́, ṣùgbọ́n kò sọ pé Pọ́ọ̀lù ń sẹ́ jíjẹ́ ènìyàn tòótọ́ ti Mèsáyà. Ohun tí a kọ̀ ni ọ̀nà ìwòye tí ó dá lórí ẹ̀ka ti ènìyàn àti ti ayé nìkan.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ìyàtọ̀ láàárín οἴδαμεν àti γινώσκομεν
  choice: A lo ‘fi ojú ... wo’ ní apá àkọ́kọ́, a sì lo ‘mọ̀ ọ́n lọ́nà yẹn’ ní apá kejì.
  alternative: Lílo ‘mọ̀’ ní apá méjèèjì
  rationale: 'Èyí mú Yorùbá dùn bí èdè àdánidá, ó sì pa ìsopọ̀ ìtumọ̀ mọ́: ọ̀nà tí wọ́n fi ń mọ̀ tàbí wo ẹni ni ó yí padà, kì í ṣe pé Mèsáyà kò ṣeé mọ̀ mọ́.'
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Fi ojú ti ara wo’ jẹ́ àsọyé tí òǹkàwé lásán lè lóye, ó sì pa àwòrán σάρξ mọ́. A yẹra fún èdè ẹgbẹ́ ìjọ kan pàtó.
