  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èrò gíríìkì náà dáadáa: ìgboyà tí ń bá a lọ, ìmọ̀ tí ó dájú, àti ìyàtọ̀ láàárín wíwà nínú ara àti jíjìnnà sí Olúwa. Ṣùgbọ́n «nígbà tí a bá ṣì wà» ní ìrísí ọjọ́ iwájú/ìpò-ìṣàníyàn, níbi tí participle Gíríìkì ń ṣàpèjúwe ipò ìsinsìnyí. «A wà ní òde kúrò lọ́dọ̀ Olúwa» sì jẹ́ àkójọpọ̀ ọ̀rọ̀ tí kò rọrùn, tí ó tún ń sọ ìtumọ̀ jíjìnnà náà lẹ́ẹ̀mejì.'
  naturalness: «Nígbà tí a wà ní ilé nínú ara» pa àwòrán ‘ní ilé’ mọ́, bí ó tilẹ̀ jẹ́ pé ó jẹ́ àwòrán àfiwé. «A jìnnà sí Olúwa» jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ἀπὸ τοῦ κυρίου mu. Àmì ohùn àti ọ̀rọ̀ ìjọsìn náà yẹ fún Yorùbá boṣewa.
  terminology: «Olúwa» yẹ fún κύριος. «Ara» yẹ fún σῶμα. A kò gbọ́dọ̀ jẹ́ kí ọ̀rọ̀ náà dà bí ẹni pé Kristi kò sí pẹ̀lú àwọn onígbàgbọ́ rárá; ìtumọ̀ náà kan pa ìtakora àfiwé Pọ́ọ̀lù mọ́.
  issues:
