  - severity: low
    issue: «a wà ní òde kúrò lọ́dọ̀ Olúwa» kò rọrùn
    rationale: «Ní òde» àti «kúrò lọ́dọ̀» ń kó èrò jíjìnnà kan náà jọ, ṣùgbọ́n àkójọpọ̀ náà kò dà bí ìlò Yorùbá tó wọ́pọ̀. «A jìnnà sí Olúwa» jẹ́ èdè adayeba, ó sì pa ìyapa ἀπό mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ «kò sí níbẹ̀» kò ní ohun tí a tọ́ka sí kedere
    rationale: Gbolohun náà lè dà bí pé ‘kò sí níbẹ̀’ lásán, dípò ‘a kò sí lọ́dọ̀ Olúwa.’ A tún lè ṣàlàyé òdìkejì àwọn ọ̀rọ̀-ìṣe náà ní èdè tó mọ́gbọ́n dání.
