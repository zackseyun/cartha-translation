id: 2CO.5.6
reference: 2 Corinthians 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: yo
  text: Nítorí náà, a ní ìgboyà nígbà gbogbo, a sì mọ̀ pé nígbà tí a wà ní ilé nínú ara, a jìnnà sí Olúwa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “a kò sí lọ́dọ̀ Olúwa.” Ọ̀rọ̀-ìṣe Gíríìkì ἐκδημοῦμεν jẹ́ òdìkejì ọ̀rọ̀ náà “wà ní ilé,” ó sì lè túmọ̀ sí “jìnnà” tàbí “kò sí lọ́dọ̀ ẹni kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: a ní ìgboyà
  rationale: Ó fi ipò ìgboyà tí ń bá a lọ hàn; gbólóhùn olóhùn-ìṣe jẹ́ àdánidá ní Yorùbá, ó sì bá ìtumọ̀ participle náà mu.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìbáṣepọ̀ ìparí-ọ̀rọ̀ mọ́ pẹ̀lú àlàyé Pọ́ọ̀lù tó ṣáájú nípa ìyè àjíǹde àti ibùgbé ọ̀run.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó ṣàfihàn pé ìgboyà náà ń bá a lọ ní gbogbo àkókò.
- source_word: εἰδότες
  choice: a sì mọ̀
  rationale: Perfect participle οἶδα ní agbára ìsinsìnyí ń tọ́ka sí ìmọ̀ tí ó dúró ṣinṣin; ‘mọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ἐνδημοῦντες
  choice: nígbà tí a bá ṣì wà ní ilé
  rationale: Ó pa àwòrán jíjẹ́ ẹni tó wà nílé mọ́, ó sì mú ìtakora rẹ̀ pẹ̀lú ἐκδημοῦμεν hàn.
- source_word: ἐν τῷ σώματι
  choice: nínú ara
  rationale: Ó tọ́ka sí ìwàláàyè ẹni nínú ara lórí ilẹ̀ ayé láìfi ‘ara yìí’ tàbí ìtumọ̀ àfikún mìíràn kún un.
- source_word: ἐκδημοῦμεν
  choice: a wà ní òde
  rationale: Gẹ́gẹ́ bí òdì kejì ἐνδημοῦντες, ó pa àwòrán ‘ní ilé/ní òde’ mọ́ ní Yorùbá; àlàyé ‘kúrò lọ́dọ̀’ mú ìtumọ̀ jíjẹ́ ẹni tí kò sí níbẹ̀ ṣe kedere.
- source_word: ἀπὸ τοῦ κυρίου
  choice: kúrò lọ́dọ̀ Olúwa
  rationale: ἀπό fi ìyapa ààyè hàn; ‘lọ́dọ̀ Olúwa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ wíwà ní iwájú tàbí ní ẹ̀gbẹ́ ẹni.
theological_decisions:
- issue: Ìtakora àpẹẹrẹ láàárín wíwà nínú ara àti wíwà lọ́dọ̀ Olúwa
  choice: Ẹsẹ̀ náà sọ pé nígbà tí a wà ní ilé nínú ara, a wà ní òde kúrò lọ́dọ̀ Olúwa.
  alternative: Kí a sọ pé àwọn onígbàgbọ́ ti yapa pátápátá kúrò lọ́dọ̀ Kristi nígbà tí wọ́n wà nínú ara, tàbí kí a mú ọ̀rọ̀ ẹsẹ̀ 8 wọ inú ẹsẹ̀ yìí.
  rationale: Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹsẹ̀ yìí mọ́ láìsọ pé Kristi kò sí pẹ̀lú àwọn onígbàgbọ́ rárá, láì sì mú ‘kúrò nínú ara ... wà lọ́dọ̀ Olúwa’ láti ẹsẹ̀ 8 wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ‘wà ní ilé/wà ní òde’ ti Gíríìkì mọ́, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
