id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: yo
  text: Nítorí gbogbo wa ni a gbọdọ̀ fara hàn gbangba[a] níwájú ìtẹ́ ìdájọ́ Mèsáyà[b], kí olúkúlùkù lè gba ohun tí ó bá ohun tí ó ṣe nípasẹ̀ ara[c][d] mu, yálà rere tàbí búburú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí gbogbo wa farahàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífarahàn lásán tàbí fífi ẹni hàn gbangba; ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ kejì tí ó lágbára mọ́.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Kristi.” A túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè.'
    reason: alternative_reading
  - marker: c
    text: Tàbí, “fún ohun tí ó ṣe nínú ara.” Gbólóhùn Gíríìkì náà lè tọ́ka sí àwọn ìṣe tí a ṣe nípasẹ̀ ara ẹni, tàbí sí ìgbésí ayé ènìyàn nínú ara.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “kí olúkúlùkù lè gba ohun tí ó tọ́ sí i fún ohun tí ó ṣe nípasẹ̀ ara.”
    reason: previous_rendering
lexical_decisions:
- source_word: φανερωθῆναι
  choice: kí a fi gbogbo wa hàn gbangba
  rationale: Ọ̀rọ̀ ìṣe aláìṣe yìí lè túmọ̀ sí fífarahàn, ṣùgbọ́n ó tún ní agbára ti fífi ohun tí ó wà ní ìkọ̀kọ̀ hàn kedere. ‘Fi … hàn gbangba’ pa ìtumọ̀ ìṣípayá ní àyíká ìdájọ́ mọ́.
- source_word: βήματος
  choice: ìjókòó ìdájọ́
  rationale: Ní àyíká yìí, βῆμα jẹ́ ibi tí adájọ́ ti ń ṣe àyẹ̀wò, kì í ṣe ìjókòó lásán. ‘Ìjókòó ìdájọ́’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì pa àwòrán ilé-ẹjọ́ mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níhìn-ín; ‘Mèsáyà’ fi ìtumọ̀ oyè ẹni tí a fòróró yàn hàn dípò kí a ka a sí orúkọ lásán.
- source_word: κομίσηται
  choice: lè gba ohun tí ó tọ́ sí i
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígba ohun padà ní ìbámu pẹ̀lú ìṣe ẹni. Àyànfẹ́ yìí sọ ìtumọ̀ èsì tàbí ẹ̀san náà ní Yorùbá àdánidá láìfikún irú èsì tí ẹsẹ̀ náà kò sọ.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: fún ohun tí ó ti ṣe nínú ara
  rationale: Gbólóhùn Gíríìkì náà ṣókí, ó sì lè tọ́ka sí ohun tí a ṣe nípasẹ̀ ara tàbí nínú ìgbésí ayé ara. Ìtumọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi ìtumọ̀ ohun-èlò ‘nípasẹ̀ ara’ pamọ́.
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé ẹnì kọ̀ọ̀kan ni yóò jíhìn fún ìṣe tirẹ̀.
- source_word: ἀγαθὸν … φαῦλον
  choice: rere … búburú
  rationale: Àwọn ọ̀rọ̀ Yorùbá yìí pa ìyàtọ̀ ìwà rere àti ohun tí kò dára mọ́ láìsọ φαῦλον di ‘ibi gidi’ ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
theological_decisions:
- issue: Irú àti ààlà ìdájọ́ níwájú Mèsáyà
  choice: A pa èdè pé gbogbo wa yóò farahàn àti pé olúkúlùkù yóò gba ohun tí ó tọ́ sí i mọ́, láìsọ irú àwọn ènìyàn tí ìdájọ́ náà kàn tàbí irú àbájáde rẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó gẹ́gẹ́ bí ìdájọ́ ẹ̀san àwọn onígbàgbọ́ nìkan, tàbí gẹ́gẹ́ bí ìdájọ́ ìkẹyìn gbogbo ènìyàn.
  rationale: Ẹsẹ̀ náà tẹnumọ́ àfihàn gbogbo ènìyàn àti jíjíhìn ẹnì kọ̀ọ̀kan, ṣùgbọ́n kò dá àwọn ìbéèrè ìmọ̀-ẹ̀sìn tó tẹ̀ lé e lóhùn ní pàtó. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ àti ìnira ìdájọ́ ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ìjókòó ìdájọ́’ mú àwòrán ilé-ẹjọ́ wá láìlo ọ̀rọ̀ òfin tí kò wọ́pọ̀; ‘a fi … hàn gbangba’ sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
