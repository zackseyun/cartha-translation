revisions:
- from: Nítorí ó di dandan kí a fi gbogbo wa hàn gbangba[a] níwájú ìjókòó ìdájọ́ Mèsáyà[b], kí olúkúlùkù lè gba ohun tí ó tọ́ sí i fún ohun tí ó ti ṣe nínú ara[c][d], ì báà jẹ́ rere tàbí búburú.
  to: Nítorí gbogbo wa ni a gbọdọ̀ fara hàn gbangba[a] níwájú ìtẹ́ ìdájọ́ Mèsáyà[b], kí olúkúlùkù lè gba ohun tí ó bá ohun tí ó ṣe nípasẹ̀ ara[c][d] mu, yálà rere tàbí búburú.
  rationale: A tún gbolohun àkọ́kọ́ ṣe kí ó jẹ́ Yorùbá àdánidá, a rọ́pò “ìjókòó” pẹ̀lú “ìtẹ́” fún ibi ìdájọ́, a sì mú “nípasẹ̀ ara” wá sínú ọ̀rọ̀ àkọ́kọ́ láti pa διά τοῦ σώματος mọ́. A tún ṣètò òpin sí “yálà rere tàbí búburú.” Àwọn àlàyé ìsàlẹ̀ ń pa àwọn ìtumọ̀ mìíràn mọ́ láìfi ìmọ̀-ẹ̀sìn kankan kún ẹsẹ̀ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:39Z'
