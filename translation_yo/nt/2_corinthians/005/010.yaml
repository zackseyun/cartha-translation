  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa èrò pàtàkì ẹsẹ̀ náà mọ́: gbogbo ènìyàn gbọdọ̀ wà níwájú ibi ìdájọ́ ti Mèsáyà, olúkúlùkù sì máa gba ohun tó bá ìṣe rẹ̀ mu. Ṣùgbọ́n “a fi gbogbo wa hàn gbangba” kò rọrùn gẹ́gẹ́ bí Yorùbá, “nínú ara” sì yí διά (‘nípasẹ̀’) padà sí ibi tí ìṣe ti ṣẹlẹ̀. Àtúnṣe náà mú ìbáṣepọ̀ ìṣe ẹni, ara gẹ́gẹ́ bí ọ̀nà, àti ìṣípayá gbangba sun mọ́ Gíríìkì.'
  naturalness: “Gbogbo wa ni a gbọdọ̀ fara hàn gbangba” jẹ́ gbolohun Yorùbá boṣewa tí ó dára ju ìkọ́lé passive “a fi gbogbo wa hàn gbangba” lọ. “Ìtẹ́ ìdájọ́” sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì yẹ fún βῆμα nínú àyíká yìí.
  terminology: A ti pa “Mèsáyà” mọ́ fún Χριστός gẹ́gẹ́ bí oyè. “Ìtẹ́ ìdájọ́” pa ìtumọ̀ ilé-ẹjọ́ ti βῆμα mọ́. “Ohun tí ó bá ohun tí ó ṣe nípasẹ̀ ara mu” ń ṣàfihàn ìbámu èrè/èsì pẹ̀lú ìṣe, láìsọ pé ìsanwó rere nìkan tàbí ìjìyà nìkan ni.
  issues:
  - severity: medium
    issue: Ìkọ́lé “kí a fi gbogbo wa hàn gbangba” kò dára ní Yorùbá.
    rationale: Bí ó tilẹ̀ jẹ́ pé ó ń gbìyànjú láti pa passive φανερωθῆναι mọ́, ìkọ́lé náà kò lò ‘gbogbo wa’ ní ọ̀nà àdánidá. “Gbogbo wa ni a gbọdọ̀ fara hàn gbangba” mú èrò ìṣípayá ní gbangba hàn ní Yorùbá tó rọrùn.
  - severity: medium
    issue: “Nínú ara” kò fi ọ̀nà/instrumentality διά τοῦ σώματος hàn dáadáa.
    rationale: Gíríìkì διά pẹ̀lú genitive máa ń tọ́ka sí ‘nípasẹ̀.’ Ìtumọ̀ àkọ́kọ́ yẹ kí ó pa ìtumọ̀ yìí mọ́; a lè fi ‘nínú ara’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
  - severity: low
    issue: “Ìjókòó ìdájọ́” kì í ṣe ọ̀rọ̀ tó wọ́pọ̀ jù fún ibi ìdájọ́.
    rationale: “Ìtẹ́ ìdájọ́” jẹ́ ọ̀rọ̀ Yorùbá tó dára, ó sì ṣàfihàn platform/seat ìdájọ́ láìdín ìtumọ̀ òfin kù.
  - severity: low
    issue: “Ì báà jẹ́ rere tàbí búburú” kò rọrùn.
    rationale: “Yálà rere tàbí búburú” jẹ́ ìparí ìyàtọ̀ tí ó kúnrẹ́rẹ́, tó sì ba ἀγαθὸν εἴτε φαῦλον mu.
