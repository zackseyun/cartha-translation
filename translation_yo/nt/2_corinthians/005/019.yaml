id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: yo
  text: Ìyẹn ni pé, Ọlọ́run wà nínú Mèsáyà, ó ń mú ayé bá ara rẹ̀ làjà, láìka àwọn ìrékọjá wọn sí wọn, ó sì fi ọ̀rọ̀ ìlàjà náà sínú wa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì fi ọ̀rọ̀ ìlàjà náà sí àárín wa,” tàbí, “ó sì fi ọ̀rọ̀ ìlàjà náà lé wa lọ́wọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìn iṣẹ́ ìlàjà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: èyíinì ni pé
  rationale: Ó ń ṣe àlàyé ohun tí gbólóhùn tó ṣáájú túmọ̀ sí, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Ọlọ́run wà nínú Mèsáyà
  rationale: A pa ἐν mọ́ gẹ́gẹ́ bí ‘nínú,’ kí a má bàa yanjú bí ó ṣe lè túmọ̀ sí ‘nípasẹ̀’ láìjẹ́ pé ọ̀rọ̀ Gíríìkì sọ bẹ́ẹ̀ ní tààrà.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí; ‘Mèsáyà’ ń fi ìtumọ̀ oyè náà hàn dípò lílo rẹ̀ bí orúkọ lásán.
- source_word: κόσμον
  choice: ayé
  rationale: ‘Ayé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún κόσμος ní àyíká yìí, ó sì lè tọ́ka sí aráyé tí wọ́n yà kúrò lọ́dọ̀ Ọlọ́run.
- source_word: καταλλάσσων ἑαυτῷ
  choice: ó ń mú ayé bá ara rẹ̀ làjà
  rationale: Ìkọ̀lé yìí sọ ìṣe ìlàjà àti ibi tí ìlàjà náà ń darí sí ní Yorùbá àdánidá, ó sì pa agbára participle asìkò-lọ́wọ́ mọ́.
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: láìka àwọn ìrékọjá wọn sí wọn lọ́rùn
  rationale: ‘Ka ... sí ... lọ́rùn’ pa àwòrán ìṣirò inú λογίζομαι mọ́, ó sì ṣe kedere pé Ọlọ́run kò mú ẹ̀ṣẹ̀ náà dúró lòdì sí wọn.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: ó sì fi ... sí inú wa
  rationale: Èyí tẹ̀lé ìtumọ̀ gidi ti τίθημι àti ἐν, ó sì pa ọ̀rọ̀ tí ó lè túmọ̀ sí ‘sáàárín wa’ tàbí ‘lé wa lọ́wọ́’ mọ́ fún àlàyé ìsàlẹ̀.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: ọ̀rọ̀ ìlàjà
  rationale: ‘Ọ̀rọ̀’ lè túmọ̀ sí ohun tí a ń kéde tàbí ìhìn iṣẹ́, ó sì tún sún mọ́ λόγος ju fífi àlàyé míì kún un lọ.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú gbólóhùn Pọ́ọ̀lù nípa ẹni tí Ọlọ́run fi ń ṣiṣẹ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: A túmọ̀ oyè náà ní ọ̀nà tó fi ìtumọ̀ rẹ̀ hàn, láìsọ ohun míì kún ẹ̀kọ́ nípa ẹni Mèsáyà.
- issue: Bí a ṣe lóye θεὸς ἦν ἐν Χριστῷ
  choice: Ọlọ́run wà nínú Mèsáyà
  alternative: Nínú Mèsáyà ni Ọlọ́run ti ń mú ayé bá ara rẹ̀ làjà; Ọlọ́run ń tipasẹ̀ Mèsáyà mú ayé bá ara rẹ̀ làjà
  rationale: Àṣàyàn náà sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì kò kọjá àìdánilójú láàárín ìtumọ̀ ‘nínú’ àti ìtumọ̀ ohun èlò ‘nípasẹ̀.’
- issue: Bí a ṣe lóye ἐν ἡμῖν
  choice: sí inú wa
  alternative: sáàárín wa; lé wa lọ́wọ́
  rationale: Ọ̀rọ̀ pàtàkì pa ἐν mọ́ ní tààrà; àlàyé ìsàlẹ̀ sì jẹ́ kí àwọn ìtumọ̀ ajọṣepọ̀ àti iṣẹ́-ìránṣẹ́ tí ó ṣeé ṣe wà ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá yẹ, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè. ‘Làjà/ìlàjà’ pa ìbátan lexical tó wà láàárín καταλλάσσω àti καταλλαγή mọ́.
