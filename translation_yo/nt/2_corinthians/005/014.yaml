  source_fidelity: Ìtumọ̀ náà mú ìlànà ọgbọ́n ẹsẹ náà, genitive tí a kò dá sí ẹ̀gbẹ́ kan nínú “ìfẹ́ Mèsáyà,” àti ìparí kúkúrú “gbogbo wọn kú” dáadáa. Ṣùgbọ́n “nítorí gbogbo ènìyàn” sábà máa ń túmọ̀ sí “because of all people,” kì í sì jẹ́ ìṣàfihàn tó péye fún ὑπὲρ πάντων ní àyíká ikú fún ire àwọn ẹlòmíràn. “Fún gbogbo wọn” dara jù, ó sì pa “all” mọ́ láìfi “ènìyàn” kún un.
