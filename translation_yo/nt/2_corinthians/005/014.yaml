id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: yo
  text: 'Nítorí ìfẹ́ Mèsáyà ń fi agbára mú wa, níwọ̀n bí a ti dájọ́ èyí pé: ọ̀kan kú fún gbogbo wọn; nítorí náà, gbogbo wọn kú.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá adayeba fún ἀγάπη; kò ní ìtumọ̀ àtijọ́ tàbí ti ẹ̀ka ìjọ kan pàtó.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, nítorí náà “Mèsáyà” túmọ̀ oyè náà dípò kí a lò ó bí orúkọ lásán. Àkójọpọ̀ “ìfẹ́ Mèsáyà” tún fi ìbáṣepọ̀ genitive náà sílẹ̀ láìdájọ́ bóyá ìfẹ́ Mèsáyà sí wa ni tàbí ìfẹ́ wa sí Mèsáyà.
- source_word: συνέχει
  choice: ń sún wa ṣá
  rationale: Gbólóhùn yìí sọ agbára inú tí ń tẹ ènìyàn síwájú, tí ó sì ń darí ìṣe rẹ̀. “Ń sún wa ṣá” jẹ́ ọ̀nà Yorùbá adayeba láti fi ìfipá ìfẹ́ yìí hàn láìsọ pé ó gba ìfẹ́-ọkàn wọn kúrò.
- source_word: κρίναντας
  choice: a ti dé orí ìpinnu
  rationale: Ó mú ìtumọ̀ ìdájọ́ tàbí àgbéyẹ̀wò tí ó yọrí sí ìpinnu jáde, ó sì bá ìbáṣepọ̀ participle náà mu gẹ́gẹ́ bí ìdí fún gbólóhùn àkọ́kọ́.
- source_word: εἷς
  choice: ẹnì kan
  rationale: Gíríìkì sọ “ọ̀kan” ní ṣókí. “Ẹnì kan” jẹ́ adayeba ní Yorùbá, kò sì fi àlàyé tí ẹsẹ náà kò sọ kún un.
- source_word: ὑπὲρ πάντων
  choice: nítorí gbogbo ènìyàn
  rationale: Nínú àyíká yìí, “nítorí” lè sọ ikú tí a ṣe fún ire tàbí ní ipò àwọn ẹlòmíràn, láìfi ẹ̀kọ́ pàtó kan nípa ètùtù lé ọ̀rọ̀ ὑπέρ lórí.
- source_word: ἄρα
  choice: nítorí náà
  rationale: Ó fi ìyọrísí ọgbọ́n inú gbólóhùn Pọ́ọ̀lù hàn kedere.
- source_word: οἱ πάντες ἀπέθανον
  choice: gbogbo wọn kú
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ tí ó kéré ṣùgbọ́n tí ó lágbára mọ́, láìṣàlàyé ẹni tí “gbogbo” ń tọ́ka sí tàbí bí wọ́n ṣe kú.
theological_decisions:
- issue: Agbára genitive nínú ἡ ἀγάπη τοῦ Χριστοῦ
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “ìfẹ́ Mèsáyà,” èyí tí ó lè gba ìtumọ̀ méjèèjì.
  alternative: “ìfẹ́ tí Mèsáyà ní sí wa” tàbí “ìfẹ́ wa sí Mèsáyà”
  rationale: Genitive Gíríìkì lè jẹ́ subjective tàbí objective. Àyíká ẹsẹ náà kò fi dandan mú kí a yan ọ̀kan; àkọsílẹ̀ ìsàlẹ̀ ni ó ṣàlàyé àṣàyàn méjèèjì.
- issue: Ìtumọ̀ “gbogbo wọn kú”
  choice: A túmọ̀ ọ́ ní ṣókí gẹ́gẹ́ bí orísun ṣe sọ ọ́.
  alternative: Gbogbo ènìyàn kú ní aṣojú nínú Mèsáyà; tàbí gbogbo onígbàgbọ́ kú pẹ̀lú rẹ̀.
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù lè tọ́ka sí ikú aṣojú tàbí ìdápọ̀ mọ́ Mèsáyà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé ààlà “gbogbo.” A kò fi ìtumọ̀ ẹ̀kọ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tí ó bá jẹ́ adayeba; a sì pa ìrònú ọgbọ́n àti ìṣókí ẹsẹ náà mọ́.
