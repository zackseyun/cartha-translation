  - severity: low
    issue: ‘a ti ń kérora’ fi ‘ti’ kún ìpele iṣe tí Gíríìkì kò sọ.
    rationale: ‘À ń kérora’ jẹ́ ìtumọ̀ tó sún mọ́ στενάζομεν, ó sì jẹ́ Yorùbá àdánidá.
  - severity: low
