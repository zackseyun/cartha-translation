  to: Nítorí nínú èyí ni à ń kérora, ní ìfẹ́kúfẹ̀ẹ́ láti fi ibùgbé wa láti ọ̀run[a] bò wá.[b]
  rationale: Àtúnṣe náà yí ìkọ́lé tí kò rọrùn ‘wọ ibùgbé ... bò wá’ padà sí ‘fi ibùgbé ... bò wá,’ èyí tí ó jẹ́ Yorùbá àdánidá, tí ó sì pa ìtumọ̀ ‘wọ̀ lé orí’ mọ́. Ó tún rọ́pò ‘a ti ń kérora’ pẹ̀lú ‘à ń kérora,’ ó sì mú ‘láti ọ̀run’ hàn ní tààrà gẹ́gẹ́ bí orísun ibùgbé náà. Àwòrán àti àìdájú ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ náà wà ní ìpamọ́.
