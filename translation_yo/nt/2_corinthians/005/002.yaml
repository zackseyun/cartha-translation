  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì ní gbogbogbòò: ó pa ìsopọ̀ àlàyé, àìdájú ‘nínú èyí,’ ìkérora, ìfẹ́kúfẹ̀ẹ́, àti àwòrán ibùgbé/aṣọ mọ́. Ṣùgbọ́n ‘wọ ibùgbé ... bò wá’ kò rọrùn ní Yorùbá, ó sì lè dà bí ẹni pé ibùgbé náà ló ń wọ ẹni náà.'
  naturalness: ‘À ń kérora’ jẹ́ ìlò àdánidá ju ‘a ti ń kérora’ lọ nínú àyíká yìí. ‘Fi ... bò wá’ jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti sọ àwòrán wíwọ ohun kan lé orí ohun tí ẹnìkan ti ní lára, láìpa ìdàpọ̀ àwòrán Gíríìkì run.
  terminology: ‘Ibùgbé wa láti ọ̀run’ ń ṣàfihàn orísun (ἐξ οὐρανοῦ) kedere. ‘Ìfẹ́kúfẹ̀ẹ́’ yẹ fún ἐπιποθοῦντες. A kò sọ ní pàtó irú ibùgbé tàbí ara tí a ń tọ́ka sí.
