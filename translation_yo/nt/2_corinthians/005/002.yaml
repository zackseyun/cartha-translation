  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: yo
  text: Nítorí nínú èyí ni à ń kérora, ní ìfẹ́kúfẹ̀ẹ́ láti fi ibùgbé wa láti ọ̀run[a] bò wá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, ‘ibùgbé wa ti ọ̀run.’ Ọ̀rọ̀ Gíríìkì náà, ní tààrà, ní ‘ibùgbé wa láti ọ̀run,’ èyí sì tẹnumọ́ ibi tí ibùgbé náà ti wá.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ìṣe Gíríìkì náà lè ní ìtumọ̀ ‘wọ̀ lé orí,’ bí ẹni tí ń wọ aṣọ kan lé èkejì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ní tòótọ́
  rationale: Ó pa ìsopọ̀ àlàyé àti ìtẹnumọ́ oníwọ̀ntúnwọ̀nsì inú gbólóhùn Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν τούτῳ
  choice: nínú èyí
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìdájú ohun tí ‘èyí’ ń tọ́ka sí mọ́, láìfi ‘àgọ́’ tàbí ‘ara’ kún un.
- source_word: στενάζομεν
  choice: a ti ń kérora
  rationale: ‘Kérora’ fi ẹrù inú àti ìfẹ́ jíjinlẹ̀ hàn dáadáa ju ọ̀rọ̀ tí ó túmọ̀ sí ìmí ẹ̀dùn lásán lọ.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: ibùgbé wa tí ó ti ọ̀run wá
  rationale: ‘Ibùgbé’ pa àwòrán ibi gbígbé mọ́; ‘tí ó ti ọ̀run wá’ sì tẹnumọ́ orísun rẹ̀, gẹ́gẹ́ bí ἐξ οὐρανοῦ, dípò kíkàn sọ pé ó jẹ́ ti ọ̀run.
- source_word: ἐπενδύσασθαι
  choice: láti wọ ... bò wá
  rationale: Ó pa àwòrán wíwọ aṣọ mọ́, ‘bò wá’ sì mú ìtumọ̀ wíwọ ohun kan lé ohun tí ó ti wà lára ẹni hàn.
- source_word: ἐπιποθοῦντες
  choice: tí a ń fi ìyánhànhàn fẹ́
  rationale: Ó sọ ìfẹ́ líle àti ìfẹ́ tí ń bá a lọ tí participle Gíríìkì náà ń fi hàn.
theological_decisions:
- issue: Irú ohun tí àwòrán ibùgbé láti ọ̀run ń tọ́ka sí
  choice: A pa àwòrán méjèèjì—ibùgbé àti aṣọ tí a wọ̀—mọ́, láìsọ ní pàtó pé ara àjíǹde, ipò àárín ikú àti àjíǹde, tàbí ilé ọ̀run ni.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí ‘ara àjíǹde láti ọ̀run’ tàbí ‘ilé wa ní ọ̀run.’
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò yan ọ̀kan nínú àwọn ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ wọ̀nyí ní kedere; títẹ̀lé àwòrán Gíríìkì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. ‘Wọ ibùgbé ... bò wá’ mọ̀ọ́mọ̀ pa ìdapọ̀ àwòrán ilé àti aṣọ inú ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé kì í ṣe àsọyé ojoojúmọ́.
