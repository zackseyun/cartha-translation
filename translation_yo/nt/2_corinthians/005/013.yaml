  - severity: medium
    issue: Àìbámu arọ́pò orúkọ nínú ‘orí rẹ̀’
    rationale: Kókó-ọrọ náà ni ‘a’ (àwa), ṣùgbọ́n ‘rẹ̀’ jẹ́ ẹni kẹta ẹyọkan. ‘Orí wa’ ni ìbámu tó yẹ.
  - severity: low
    issue: ‘Ń ronú lọ́nà tí ó tọ́’ gbooro díẹ̀
    rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣe ìpinnu tó tọ́, ṣùgbọ́n σωφρονοῦμεν níhìn-ín dá lórí jíjẹ́ ẹni tó wà ní òye/ìrònú tó péye ní ìyàtọ̀ pẹ̀lú jíjẹ́ ẹni tí orí dàrú.
