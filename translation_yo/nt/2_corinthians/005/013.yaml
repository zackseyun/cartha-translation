  source_fidelity: Ìtumọ̀ náà pa ìṣọ̀kan ìdí γάρ, ìfararọ̀ εἴτε ... εἴτε, àti ìtọ́kasí ‘fún Ọlọ́run’ / ‘fún yín’ mọ́. Ṣùgbọ́n ‘a bá tiẹ̀ dà bí ẹni tí orí rẹ̀ dàrú’ fi ‘tiẹ̀’ àti ‘dà bí ẹni’ kún ọ̀rọ̀ Gíríìkì; wọ́n dín agbára ìfiara-ẹni-hàn Pọ́ọ̀lù kù, wọ́n sì yí í sí ìrísí lasan. ‘A ń ronú lọ́nà tí ó tọ́’ tún gbooro ju σωφρονοῦμεν lọ díẹ̀, tí ó jẹ́ ìwà jíjẹ́ ẹni ìrònú tó péye/sober-minded.
  naturalness: ‘Orí wa dàrú’ jẹ́ ọ̀nà Yorùbá tí ó hàn gbangba, tí ó sì bá ìyàtọ̀ pẹ̀lú ìrònú tó péye mu. Àtúnṣe náà yọ ìṣòro ìbámu ènìyàn nínú ‘orí rẹ̀’ lẹ́yìn ‘a’ kúrò, ó sì mú ọ̀rọ̀ náà kúrú, rọrùn, àti ìbámu pẹ̀lú ọ̀nà Gíríìkì tí ó jẹ́ kúkúrú.
  terminology: ‘Ọlọ́run’ yẹ fún θεῷ. ‘Ìrònú tó péye’ fi σωφρονοῦμεν hàn dáadáa ní ọ̀rọ̀ ìtàn yìí, láì dín un sí ìmọ̀ ọgbọ́n lasan tàbí ìfọ̀kànbalẹ̀ nìkan. ‘Orí wa dàrú’ jẹ́ ọ̀rọ̀ ìbámu fún ἐξέστημεν, nígbà tí àlàyé ẹsẹ̀ ń pa aṣayan ‘beside ourselves’ mọ́.
  issues:
