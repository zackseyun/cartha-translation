  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: yo
  text: Nítorí bí orí wa bá dàrú[a], fún Ọlọ́run ni; bí a bá sì ní ìrònú tó péye[b], fún yín ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí òye wa bá yà,” ìyẹn, bí ẹni tí kò wà ní àárín èrò rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí a bá wà ní òye wa pípé,” tàbí “bí a bá jẹ́ ẹni ìrònú pẹ̀lẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: bí ... bí ... sì
  rationale: Àtúnṣe yìí mú ìyàtọ̀ àwọn ọ̀nà méjèèjì jáde gẹ́gẹ́ bí gbólóhùn Gíríìkì, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àsopọ̀ ìṣàlàyé γάρ mọ́, nípa fífi ìdí ọ̀rọ̀ tó ṣáájú hàn.
- source_word: ἐξέστημεν
  choice: a bá tiẹ̀ dà bí ẹni tí orí rẹ̀ dàrú
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí jíjẹ́ bí ẹni tí kò sí ní àárín èrò tó péye. Fífi ‘dà bí’ kún un pa àìdánilójú náà mọ́, láì sọ pé Pọ́ọ̀lù jẹ́ aṣiwèrè ní ti gidi.
- source_word: θεῷ
  choice: fún Ọlọ́run ni
  rationale: Dative kúkúrú náà ń tọ́ka sí ẹni tí ìṣe náà dojú kọ tàbí ẹni tí ó jẹ́ fún àǹfààní rẹ̀; ‘fún Ọlọ́run’ jẹ́ kedere, ó sì bá ìlò Yorùbá mu.
- source_word: σωφρονοῦμεν
  choice: a ń ronú lọ́nà tí ó tọ́
  rationale: Ó fi ìrònú tó péye, tó mọ́gbọ́n dání hàn, ó sì dúró ní ìyàtọ̀ pẹ̀lú ἐξέστημεν láì fi èdè àìdánidá ṣe é.
- source_word: ὑμῖν
  choice: fún yín ni
  rationale: 'Ó sọ ìtọ́kasí àti àǹfààní dative náà di mímọ́: ìwà tí ó bójú mu yìí jẹ́ fún ire àwọn ará Kọ́ríńtì.'
theological_decisions:
- issue: Ìtumọ̀ àfiwé Pọ́ọ̀lù nípa ipò ọpọlọ rẹ̀
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìwà tí ó lè dà bí ìwà ẹni tí orí rẹ̀ dàrú, ní ìyàtọ̀ sí ìrònú tó péye.
  alternative: Kí a sọ pé ó ń tọ́ka sí ìrírí ìmúnilọ́kànsókè ẹ̀sìn ní pàtó, tàbí pé àwọn ẹlòmíràn kàn ń fi ẹ̀sùn aṣiwèrè kàn án.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ kúkúrú, ó sì ní ìfọ̀rọ̀wérọ̀ nínú. Ìtumọ̀ yìí pa ìyàtọ̀ tó lágbára mọ́ láì fìdí aṣiwèrè gidi tàbí ẹ̀kọ́ pàtó nípa ìrírí ìmúnilọ́kànsókè múlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. ‘Orí rẹ̀ dàrú’ jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ ἐξέστημεν hàn, nígbà tí ‘ń ronú lọ́nà tí ó tọ́’ ń mú ìtumọ̀ σωφρονοῦμεν jáde ní kedere. Àmì ohùn kún ibi tí ó yẹ.
