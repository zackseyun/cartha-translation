- from: Nítorí náà, àwa ń ṣiṣẹ́ gẹ́gẹ́ bí ikọ̀ fún Mèsáyà[a], bí ẹni pé Ọlọ́run ń fi ẹnu wa ké sí yín. Àwa ń bẹ̀ yín nítorí Mèsáyà pé, “Ẹ bá Ọlọ́run[b] làjà.”
  to: 'Nítorí náà, àwa jẹ́ aṣojú fún Mèsáyà[a], bí ẹni pé Ọlọ́run ń bẹ̀ yín nípasẹ̀ wa. Àwa ń bẹ̀ yín ní orúkọ Mèsáyà pé: Ẹ bá Ọlọ́run[b] làjà.'
  rationale: A rọ́pò “ikọ̀” pẹ̀lú “aṣojú” kí iṣẹ́ aṣojú πρεσβεύομεν lè hàn ní kedere. A tún lo “nípasẹ̀ wa” fún δι’ ἡμῶν, a sì ṣe ìbámu àwọn ọ̀rọ̀ ìbẹ̀bẹ̀ méjèèjì (παρακαλοῦντος àti δεόμεθα) pẹ̀lú “ń bẹ̀.” “Ẹ bá Ọlọ́run làjà” jẹ́ ìtumọ̀ Yorùbá tó rọrùn, tó sì pa àṣẹ sí ìlàjà mọ́ láì fipá sọ ẹni tí ó ń ṣe iṣẹ́ ìlàjà náà. A ṣe àtúnṣe àlàyé b kí ó le fi àṣàyàn ìtumọ̀ gidi hàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:56Z'
