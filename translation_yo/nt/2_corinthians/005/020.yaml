id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: yo
  text: 'Nítorí náà, àwa jẹ́ aṣojú fún Mèsáyà[a], bí ẹni pé Ọlọ́run ń bẹ̀ yín nípasẹ̀ wa. Àwa ń bẹ̀ yín ní orúkọ Mèsáyà pé: Ẹ bá Ọlọ́run[b] làjà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός, àkọ́lé tó túmọ̀ sí ẹni tí a fòróró yàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “pẹ̀lú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: fún Mèsáyà / nítorí Mèsáyà
  rationale: Ὑπέρ pẹ̀lú ọ̀rọ̀-orúkọ ní genitive túmọ̀ sí ṣíṣe nítorí ẹnì kan tàbí ní ipò rẹ̀. “Fún” bá iṣẹ́ ikọ̀ mu, “nítorí” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbẹ̀bẹ̀ ní ipò Mèsáyà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa ìlàjà.
- source_word: πρεσβεύομεν
  choice: àwa ń ṣiṣẹ́ gẹ́gẹ́ bí ikọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe iṣẹ́ aṣojú tàbí ikọ̀. Gbólóhùn yìí ṣe kedere ní Yorùbá, ó sì pa ìṣe tí ń bá a lọ mọ́.
- source_word: ὡς
  choice: bí ẹni pé
  rationale: 'Ó pa ìtumọ̀ àfiwé mọ́: a gbọ́dọ̀ lóye iṣẹ́ àwọn ikọ̀ náà bí ẹni pé Ọlọ́run fúnra rẹ̀ ló ń ké sí àwọn olùgbọ́ nípasẹ̀ wọn.'
- source_word: παρακαλοῦντος
  choice: ń ké sí yín
  rationale: Ní àyíká ọ̀rọ̀ ìlàjà, παρακαλέω jẹ́ ìpè tàbí ìrọ̀ síni pẹ̀lú ìtara. “Ké sí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì sọ ọ́ di àṣẹ líle.
- source_word: δι’ ἡμῶν
  choice: ń fi ẹnu wa
  rationale: Διά pẹ̀lú genitive fi ẹni tàbí ohun èlò tí a fi ń ṣe iṣẹ́ hàn. “Fi ẹnu wa” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run ń sọ ìpè rẹ̀ nípasẹ̀ àwọn aposteli.
- source_word: δεόμεθα
  choice: Àwa ń bẹ̀ yín
  rationale: Δέομαι jẹ́ ìbẹ̀bẹ̀ onítara. “Ń bẹ̀ yín” jẹ́ èdè Yorùbá tó wọ́pọ̀, tó sì mú ìkánjú àti ìtara Pọ́ọ̀lù jáde.
- source_word: καταλλάγητε
  choice: Ẹ … làjà
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ aorist passive pé kí àwọn olùgbọ́ gba ipò ìlàjà. Yorùbá àdánidá máa ń lo “bá … làjà”; ìtumọ̀ yìí pa àṣẹ àti èrò ìpadà sí àjọṣe àlàáfíà mọ́ láì ṣàlàyé bí iṣẹ́ Ọlọ́run àti ìdáhùn ènìyàn ṣe pín.
- source_word: τῷ θεῷ
  choice: bá Ọlọ́run làjà
  rationale: Dative náà lè ní ìtumọ̀ ìtọ́sọ́nà (“sí Ọlọ́run”) tàbí ìbáṣepọ̀ (“pẹ̀lú Ọlọ́run”). Àkànlò Yorùbá “bá Ọlọ́run làjà” sọ ìbáṣepọ̀ náà ní ọ̀nà tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ àkọ́lé fún ẹni tí a fòróró yàn. “Mèsáyà” pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí àkọ́lé mọ́; a fi “Kristi” sí àlàyé ìsàlẹ̀ nítorí pé ó ti wọ́pọ̀ nínú àṣà Kristẹni Yorùbá.
- issue: Ohùn àti ẹni tó ń ṣe iṣẹ́ nínú ìlàjà
  choice: Ẹ bá Ọlọ́run làjà
  alternative: Ẹ jẹ́ kí a mú yín bá Ọlọ́run làjà
  rationale: Gíríìkì lo àṣẹ passive, ṣùgbọ́n Yorùbá àdánidá sọ ìlàjà ní ọ̀nà ìbáṣepọ̀. A kò fi ẹni tí ó ṣe iṣẹ́ passive náà kún un, kí ìtumọ̀ má bàa pinnu ju orísun lọ nípa bí iṣẹ́ Ọlọ́run àti ìdáhùn ènìyàn ṣe jọ ń ṣiṣẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbànde òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Ó ní iyì ṣùgbọ́n ó ṣeé lóye fún ará ìlú. “Ikọ̀” ń sọ aṣojú tí a rán lọ; “fi ẹnu wa ké sí yín” sì jẹ́ àkànlò àdánidá fún Ọlọ́run tó ń sọ̀rọ̀ nípasẹ̀ àwọn ènìyàn.
