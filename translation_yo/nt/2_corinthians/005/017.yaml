  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: yo
  text: Nítorí náà[a], bí ẹnikẹ́ni bá wà nínú Mèsáyà, ìṣẹ̀dá tuntun wà; àwọn ohun àtijọ́ ti kọjá lọ; kíyèsí[b], àwọn ohun tuntun ti wáyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ó jẹ́ ìṣẹ̀dá tuntun.” Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ láìsọ: ní tààràtà, “bí ẹnikẹ́ni bá wà nínú Mèsáyà—ìṣẹ̀dá tuntun.”'
    reason: alternative_reading
  - marker: b
    text: Ọ̀pọ̀ ìtumọ̀ Bíbélì kà á pé, “gbogbo nǹkan ti di tuntun.” Ṣùgbọ́n ẹ̀dà SBLGNT níbí kàn ní “àwọn ohun tuntun ti wáyé,” kò sì ní ọ̀rọ̀ kan tó túmọ̀ sí “gbogbo.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde ìjíròrò tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti so ìrònú náà pọ̀ ní Yorùbá.
- source_word: εἴ τις
  choice: bí ẹnikẹ́ni bá
  rationale: Ó mú ipò àìdánimọ̀ tó kan ẹnikẹ́ni jáde láìfi ìtumọ̀ akọ tàbí abo kún un.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, ó sì bá èdè ìṣọ̀kan Pọ́ọ̀lù pẹ̀lú Mèsáyà mu.
- source_word: καινὴ κτίσις
  choice: ìṣẹ̀dá tuntun wà
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níbí. Fífi “wà” kún un mú un ṣeé kà ní Yorùbá láìfi dandan sọ pé ẹni náà nìkan ni ìṣẹ̀dá tuntun.
- source_word: τὰ ἀρχαῖα
  choice: àwọn ohun àtijọ́
  rationale: Ó pa àpẹẹrẹ ọ̀pọ̀ nǹkan tí ajẹtífù aláìlórúkọ Gíríìkì náà ní mọ́, láìdín ààlà rẹ̀ kù.
- source_word: παρῆλθεν
  choice: ti kọjá lọ
  rationale: Ó sọ ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ tí ipa rẹ̀ sì dúró di ìsinsìnyí ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe àfiyèsí tó dára ní Yorùbá, ó sì pa agbára àsọyé ἰδοὺ mọ́.
- source_word: γέγονεν καινά
  choice: àwọn ohun tuntun ti dé
  rationale: Ó pa ọ̀pọ̀ nǹkan καινά mọ́, ó sì fi ipò tuntun tó ti dé tí ó sì ń bá a lọ hàn, láìfi “gbogbo” tí kò sí nínú ẹ̀dà SBLGNT kún un.
theological_decisions:
- issue: Ṣíṣe Χριστῷ bí oyè tàbí bí orúkọ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: “Mèsáyà” túmọ̀ oyè Χριστός dípò kí ó ṣe é bí orúkọ lásán, ó sì pa ìjẹ́pàtàkì ti Mèsáyà nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- issue: Bí a ṣe máa mú gbólóhùn aláìní ọ̀rọ̀-ìṣe καινὴ κτίσις jáde
  choice: ìṣẹ̀dá tuntun wà
  alternative: ó jẹ́ ìṣẹ̀dá tuntun
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìṣẹ̀dá tuntun tó bẹ̀rẹ̀ tàbí sí ẹni náà gẹ́gẹ́ bí ìṣẹ̀dá tuntun. Àkọ́kọ́ pa àìdánilójú yìí mọ́, àlàyé ìsàlẹ̀ sì fi ìtumọ̀ kejì hàn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “Mèsáyà” gẹ́gẹ́ bí oyè, “wò ó” fún ìpe àfiyèsí, a sì pa kíkuru àti àìdánilójú gíríìkì mọ́ níbi tí èdè Yorùbá ti gbà á.
