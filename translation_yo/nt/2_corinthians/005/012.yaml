id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: yo
  text: Àwa kò tún ń yin ara wa níwájú yín; kàkà bẹ́ẹ̀, à ń fún yín ní àǹfààní láti ṣògo nítorí wa[a], kí ẹ lè ní ohun tí ẹ ó fi dá àwọn tí ń ṣògo ní ìrísí òde, tí wọn kì í sì í ṣògo ní ọkàn, lóhùn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “à ń fún yín ní ìdí láti ṣògo nípa wa,” tàbí “láti ṣògo ní ìgbèjà wa.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “àwọn tí ń ṣògo ní ojú, tí wọn kì í sì í ṣògo ní ọkàn”; èyí ni pé, wọ́n ń ṣògo nínú ohun tí ó hàn níta dípò nínú òtítọ́ inú.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: ń yin ara wa níwájú yín
  rationale: Ọ̀rọ̀ náà níhìn-ín túmọ̀ sí fífi ara ẹni hàn gẹ́gẹ́ bí ẹni tí ó yẹ fún ìtẹ́wọ́gbà. ‘Yin ara wa níwájú yín’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìgbóríyìn fún ara ẹni mọ́.
- source_word: ἀφορμὴν
  choice: àǹfààní
  rationale: Ó lè túmọ̀ sí àǹfààní, àkókò, tàbí ìpìlẹ̀ fún ohun kan. ‘Àǹfààní’ bá ọ̀nà tí Pọ́ọ̀lù ń gbà pèsè ohun tí àwọn ará Kọ́ríńtì lè fi dáhùn mu.
- source_word: καυχήματος / καυχωμένους
  choice: ṣògo / ń ṣògo
  rationale: Lílo ọ̀rọ̀ kan náà ní ibi méjèèjì pa àsopọ̀ ọ̀rọ̀ inú Gíríìkì mọ́, ó sì lè ní ìtumọ̀ yíyọ̀ tàbí gbígbéraga gẹ́gẹ́ bí àyíká ọ̀rọ̀.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: ‘Nítorí wa’ lè gbé èrò pé nípa wa tàbí ní ìgbèjà wa, láìfi tipátipá yan ọ̀kan nínú ìtumọ̀ méjèèjì.
- source_word: ἵνα ἔχητε πρὸς
  choice: kí ẹ lè ní ohun tí ẹ ó fi dá ... lóhùn
  rationale: Gbólóhùn Gíríìkì fi ohun tí a ó sọ padà sí àwọn alatako sílẹ̀ lábẹ́ òye; ìtumọ̀ yìí mú un ṣe kedere ní Yorùbá àdánidá láìfi àfikún ẹ̀kọ́ sínú rẹ̀.
- source_word: ἐν προσώπῳ
  choice: nítorí ohun tí ó hàn lójú
  rationale: Ní ìdojúkọ pẹ̀lú ‘ọkàn,’ ‘ohun tí ó hàn lójú’ sọ ìfarahàn òde ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán ‘ojú’ inú Gíríìkì mọ́.
- source_word: καρδίᾳ
  choice: ohun tí ó wà lọ́kàn
  rationale: ‘Ọkàn’ ni ìtumọ̀ Yorùbá tó bójú mu fún καρδία, ó sì pa ìdojúkọ láàárín ohun òde àti òtítọ́ inú mọ́.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé Pọ́ọ̀lù ń sẹ́ pé òun ń tún ìgbóríyìn fún ara rẹ̀ ṣe.
theological_decisions:
- issue: Ìtumọ̀ ìdojúkọ ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ
  choice: Ìdojúkọ láàárín ohun tí ó hàn níta àti ohun tí ó wà nínú ọkàn
  alternative: Ìdojúkọ láàárín orúkọ rere ní gbangba àti òtítọ́ inú; tàbí láàárín wíwà níwájú ẹni àti ìwà inú
  rationale: Àyíká ọ̀rọ̀ ṣe àtakò ohun òde sí ohun inú. Ìtumọ̀ náà pa àtakò yìí mọ́ láìdín un kù sí ẹ̀kọ́ ìsìn kan pàtó.
- issue: Ìtumọ̀ ὑπὲρ ἡμῶν
  choice: ‘Nítorí wa,’ tó lè túmọ̀ sí nípa wa tàbí ní ìgbèjà wa
  alternative: ‘Nípa wa’ nìkan; tàbí ‘ní ipò wa’ nìkan
  rationale: 'Àyíká ọ̀rọ̀ gba èrò méjèèjì láàyè: àwọn ará Kọ́ríńtì lè ṣògo nípa Pọ́ọ̀lù, kí wọ́n sì tipa bẹ́ẹ̀ sọ̀rọ̀ ní ìgbèjà rẹ̀. Ọ̀rọ̀ Yorùbá yìí kò yanjú àìdánilójú náà láìnídìí.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Kàkà bẹ́ẹ̀’ mú ìyípadà ἀλλά jáde ní ọ̀nà àdánidá; ‘dá ... lóhùn’ jẹ́ gbólóhùn tí gbogbo ènìyàn lóye, nígbà tí ‘ṣògo’ pa àtúnṣe ọ̀rọ̀ καύχημα/καυχάομαι mọ́.
