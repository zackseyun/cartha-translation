  source_fidelity: Ìtumọ̀ náà mú ìṣètò àtakò àti ọ̀pọ̀ ìtumọ̀ pàtàkì inú Gíríìkì wá dáadáa. Ṣùgbọ́n apá náà “tí wọn kò sì ṣògo nítorí ohun tí ó wà lọ́kàn” yí ìtumọ̀ ἐν καρδίᾳ padà sí ‘nítorí ohun tí ó wà nínú ọkàn’; Gíríìkì sọ pé àwọn ènìyàn náà ń ṣògo ‘ní’ ìrísí òde, kì í sì í ṣògo ‘ní’ ọkàn. Àtúnṣe náà pa ìfarakanra ọ̀rọ̀ náà mọ́.
