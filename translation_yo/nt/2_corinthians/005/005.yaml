id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: yo
  text: Ọlọ́run ni ẹni tí ó múra wa sílẹ̀ fún ohun yìí gan-an, ẹni tí ó sì fún wa ní owó ìdógò ti Ẹ̀mí.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú “owó ìdógò” sí “ìdánilójú,” “owó tí a fi sílẹ̀,” tàbí “apá àkọ́kọ́ tí a san.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà lè túmọ̀ sí pé Ẹ̀mí fúnra rẹ̀ ni owó ìdógò náà, tàbí pé Ọlọ́run ti fún wa ní ìdógò tí ó ń fi ohun tí Ẹ̀mí yóò mú ṣẹ dá wa lójú.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: múra wa sílẹ̀
  rationale: Ó fi hàn pé Ọlọ́run ń ṣe wa ní ẹni tí ó yẹ fún ipò ara tuntun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa rẹ̀, kì í ṣe pé ó kàn ‘ṣiṣẹ́’ lórí wa.
- source_word: εἰς αὐτὸ τοῦτο
  choice: fún ohun yìí gan-an
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́, ó sì tọ́ka sí ohun pàtó tí a ti sọ ṣáájú.
- source_word: θεός
  choice: Ọlọ́run
  rationale: Ọlọ́run ni olùṣe tí gbólóhùn náà dá mọ̀.
- source_word: δοὺς
  choice: ẹni tí ó sì fún wa
  rationale: A tú participle aorist náà sí gbólóhùn àlàyé tí ó bá èdè Yorùbá mu, láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ἀρραβῶνα
  choice: owó ìdógò
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí apá owó tí a san ṣáájú, tí ó sì jẹ́ ìdánilójú pé èyí tó kù yóò tẹ̀ lé; ‘owó ìdógò’ pa àpẹẹrẹ ọ̀rọ̀ ajé náà mọ́.
- source_word: τοῦ πνεύματος
  choice: ti Ẹ̀mí
  rationale: Ó pa ìrísí genitive Gíríìkì mọ́, láìfi dandan pinnu nínú ọ̀rọ̀ pàtàkì bóyá Ẹ̀mí fúnra rẹ̀ ni ìdógò náà tàbí ìdógò tí ó ní í ṣe pẹ̀lú iṣẹ́ Ẹ̀mí.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ ń fi ìtẹ̀síwájú ìrònú hàn lọ́nà tí ó rọrùn ní Yorùbá, láìsọ ọ́ di àtakò líle tàbí ọ̀rọ̀ àkókò.
theological_decisions:
- issue: Ìtumọ̀ ‘owó ìdógò ti Ẹ̀mí’
  choice: A pa ọ̀nà gbólóhùn náà mọ́ kí ó lè tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ìdógò ìgbésí ayé ọjọ́ iwájú.
  alternative: Ó tún lè túmọ̀ sí ìdógò tí Ọlọ́run fúnni, èyí tí ó ṣe ìdánilójú ohun tí Ẹ̀mí yóò mú ṣẹ.
  rationale: Lílo ἀρραβών ní 2 Kọr 1:22 àti Ef 1:13–14 ń ṣe atilẹyin pé Ẹ̀mí fúnra rẹ̀ ni ẹ̀bùn ìdógò náà; síbẹ̀, ọ̀nà genitive inú Gíríìkì kò fi gbogbo ìṣòro ìtumọ̀ náà parí, nítorí náà a ṣàlàyé méjèèjì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Owó ìdógò’ jẹ́ àpẹẹrẹ ọ̀rọ̀ ajé tí òǹkàwé òde òní lè lóye, nígbà tí àlàyé ìsàlẹ̀ ń ṣàfihàn àwọn ọ̀nà ìtumọ̀ míì.
