id: 2CO.5.8
reference: 2 Corinthians 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: yo
  text: Nítorí náà, a ní ìgboyà, a sì kúkú fẹ́ láti kúrò nínú ara, àti láti wà nílé pẹ̀lú Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti má ṣe wà nínú ara mọ́, àti láti wà nílé pẹ̀lú Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: a ní ìgboyà
  rationale: Ó fi ìgboyà tí ó dúró ṣinṣin hàn ní ọ̀nà àdánidá ní Yorùbá, láìlo ọ̀rọ̀ àtijọ́ tàbí fífi ìtumọ̀ míì kún un.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín, δέ ń tẹ̀ síwájú láti inú èrò ẹsẹ 6–7, ó sì ní ìṣe ìyọrísí ju ti ìtakora líle lọ.
- source_word: καὶ
  choice: a sì
  rationale: Àsopọ̀ Yorùbá yìí so àwọn ọ̀rọ̀-ìṣe méjèèjì pọ̀ lọ́nà àdánidá.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: a kúkú fẹ́
  rationale: Àkójọpọ̀ náà fi ìfẹ́ yíyan ohun kan dípò òmíràn hàn; “kúkú fẹ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìfẹ́ yìí.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: láti kúrò ní ara
  rationale: Ó pa àwòrán jíjẹ́ ẹni tí kò sí ní ilé mọ́, ó sì fi “ara” sílẹ̀ gẹ́gẹ́ bí ó ti wà, láìsọ ọ́ di “láti kú.”
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: kí a sì wà ní ilé lọ́dọ̀ Olúwa
  rationale: Ó pa ìtakora àwòrán “kúrò” àti “wà ní ilé” mọ́; “lọ́dọ̀ Olúwa” sì fi wíwà pẹ̀lú Olúwa hàn lọ́nà Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Bóyá kí a sọ ọ̀rọ̀ Paulu di ẹ̀kọ́ tí ó ṣe kedere nípa ohun tó ṣẹlẹ̀ lẹ́yìn ikú
  choice: Pa àwòrán kíkúrò ní ara àti wíwà ní ilé lọ́dọ̀ Olúwa mọ́, láìfi “lẹ́yìn ikú” tàbí “ní ọ̀run” kún un.
  alternative: “láti kú kí a sì lọ wà pẹ̀lú Olúwa ní ọ̀run”
  rationale: Ẹsẹ náà ń tọ́ka gidigidi sí wíwà lọ́dọ̀ Olúwa lẹ́yìn kíkúrò ní ara, ṣùgbọ́n àwọn ọ̀rọ̀ “ikú” àti “ọ̀run” kò sí nínú Gíríìkì; fífi àwòrán náà sílẹ̀ ń pa ìpéye àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Wà ní ilé” ni a lò láti pa àkàwé ἐκδημέω/ἐνδημέω mọ́.
