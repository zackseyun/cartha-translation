id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: yo
  text: Gbogbo nǹkan wọ̀nyí wá láti ọ̀dọ̀ Ọlọ́run[a], ẹni tí ó mú wa bá ara rẹ̀ làjà nípasẹ̀ Mèsáyà[b], tí ó sì fún wa[c] ní iṣẹ́ ìránṣẹ́ ìlàjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo nǹkan.” Gbólóhùn náà lè tọ́ka ní gbòòrò sí ohun gbogbo nínú ìṣẹ̀dá tuntun yìí, tàbí ní pàtó sí àwọn ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “nípasẹ̀ Kírísítì”; a túmọ̀ rẹ̀ sí “nípasẹ̀ Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: c
    text: “Wa” lè tọ́ka ní gbòòrò sí àwọn onígbàgbọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ náà Pọ́ọ̀lù tẹnu mọ́ iṣẹ́ ìránṣẹ́ aposteli tí a fi lé òun àti àwọn alábàáṣiṣẹ́ rẹ̀ lọ́wọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Gbogbo nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo ohun tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ẹsẹ̀ yìí, ní pàtàkì ìṣẹ̀dá tuntun àti ìgbésí ayé tí a yí padà. “Wọ̀nyí” mú ìtọ́kasí náà hàn, nígbà tí a kò fi δέ ṣe ọ̀rọ̀ ìtakora líle tàbí fi “nísinsìnyí” kún un.
- source_word: ἐκ τοῦ θεοῦ
  choice: wá láti ọ̀dọ̀ Ọlọ́run
  rationale: ἐκ fi orísun hàn; gbólóhùn Yorùbá yìí sọ ní kedere pé Ọlọ́run ni orísun gbogbo nǹkan wọ̀nyí.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: ẹni tí ó mú wa padà bá ara rẹ̀ làjà
  rationale: A tú participle aorist náà sí gbólóhùn aláṣepọ̀ ní Yorùbá. “Mú wa padà bá ara rẹ̀ làjà” fi ìmúpadàbọ̀ ìbáṣepọ̀ hàn láìsọ pé ènìyàn ni ó bẹ̀rẹ̀ ìlàjà náà.
- source_word: διὰ Χριστοῦ
  choice: nípasẹ̀ Mèsáyà
  rationale: διά pẹ̀lú genitive fi ọ̀nà tàbí aṣojú hàn. Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà “Mèsáyà” ni a lò.
- source_word: καὶ δόντος ἡμῖν
  choice: tí ó sì fún wa
  rationale: Participle kejì ní Ọlọ́run gẹ́gẹ́ bí olùṣe kan náà; “fún wa” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún δόντος, tí kò sì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: iṣẹ́ ìránṣẹ́ ìlàjà
  rationale: διακονία túmọ̀ sí iṣẹ́ ìránṣẹ́ tàbí ojúṣe tí a gbé lé ẹni lọ́wọ́; genitive τῆς καταλλαγῆς ṣàlàyé irú iṣẹ́ náà, ìyẹn iṣẹ́ tí ìlàjà jẹ́ kókó rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kírísítì
  rationale: Nínú ẹsẹ̀ yìí, Χριστός ń tọ́ka sí oyè ẹni tí Ọlọ́run fi ṣe iṣẹ́ ìlàjà, kì í ṣe orúkọ lásán; “Mèsáyà” pa iṣẹ́ oyè náà mọ́.
- issue: Ààlà ẹni tí ἡμᾶς àti ἡμῖν ń tọ́ka sí
  choice: wa
  alternative: àwa onígbàgbọ́ lápapọ̀; tàbí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ aposteli rẹ̀ ní pàtàkì
  rationale: Gíríìkì kò pinnu ààlà náà ní kedere. Àyíká lè gba gbogbo onígbàgbọ́, ṣùgbọ́n ó tún tẹnu mọ́ iṣẹ́ tí a fi lé Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ lọ́wọ́; nítorí náà a pa “wa” mọ́ láìyanju ìṣòro náà nínú ẹsẹ̀.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn níbi tí ó ti yẹ, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Iṣẹ́ ìránṣẹ́” jẹ́ ọ̀rọ̀ ọ̀wọ̀ fún iṣẹ́ tí Ọlọ́run gbé lé ènìyàn lọ́wọ́, nígbà tí “ìlàjà” pa ìtumọ̀ ìmúpadàbọ̀ ìbáṣepọ̀ mọ́.
