revisions:
- from: Nítorí a mọ̀ pé bí a bá wó ilé àgọ́ wa ti orí ilẹ̀ yìí palẹ̀[a], a ní ilé kan láti ọ̀dọ̀ Ọlọ́run, ilé tí ọwọ́ ènìyàn kò kọ́[b], tí ó wà títí láé ní àwọn ọ̀run.[c]
  to: Nítorí a mọ̀ pé bí ilé àgọ́ wa ti ayé bá wó palẹ̀[a], a ní[c] ìkọ́lé kan láti ọ̀dọ̀ Ọlọ́run, ìyẹn ilé tí a kò fi ọwọ́ kọ́[b], tí ó wà títí láé ní àwọn ọ̀run.
  rationale: A tún ìṣe passive καταλυθῇ ṣe kí ‘àwa’ má bàa di ẹni tí ń wó ilé náà. A lo ‘ìkọ́lé’ fún οἰκοδομή, a sì ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ilé’ fún οἰκία, láti pa àwòrán ìkọ́lé àti ilé mọ́. A tún gbe àmì ẹsẹ tó ṣàlàyé ἔχομεν sún mọ́ ‘a ní.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:22Z'
