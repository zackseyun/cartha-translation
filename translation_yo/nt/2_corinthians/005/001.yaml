id: 2CO.5.1
reference: 2 Corinthians 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: yo
  text: Nítorí a mọ̀ pé bí ilé àgọ́ wa ti ayé bá wó palẹ̀[a], a ní[c] ìkọ́lé kan láti ọ̀dọ̀ Ọlọ́run, ìyẹn ilé tí a kò fi ọwọ́ kọ́[b], tí ó wà títí láé ní àwọn ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “bí ilé àgọ́ wa ti ayé bá parun” tàbí “bá tú ká.” Ọ̀rọ̀ Gíríìkì lè ṣàpèjúwe bí a ṣe ń tú ilé tàbí àgọ́ kalẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ilé tí a kò fi ọwọ́ kọ́”; èyí fi hàn pé kì í ṣe iṣẹ́ ọwọ́ ènìyàn, bí kò ṣe ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì ní “a ní,” kì í ṣe “a ó ní”; èyí pa ìfaradà láàárín ohun-ìní ìsinsìnyí àti ìmúṣẹ ọjọ́ iwájú mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: Nítorí a mọ̀ pé
  rationale: “A mọ̀” fi ìmọ̀ tí ó dájú hàn; “nítorí” sì pa ipa γάρ mọ́ gẹ́gẹ́ bí àsopọ̀ tó ń ṣàlàyé ohun tí ó ṣáájú.
- source_word: ἐὰν ... καταλυθῇ
  choice: bí a bá ... wó ... palẹ̀
  rationale: Ìṣètò “bí a bá” fi ohun tí ó lè ṣẹlẹ̀ lọ́jọ́ iwájú hàn. “Wó ... palẹ̀” bá àwòrán ilé àti àgọ́ mu, ó sì lè túmọ̀ sí pípalẹ̀ tàbí ìparun.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: ilé àgọ́ wa ti orí ilẹ̀ yìí
  rationale: Èyí pa “ilé” àti “àgọ́” méjèèjì mọ́, láì fi “ara” rọ́pò àwòrán tí Pọ́ọ̀lù lò. “Ti orí ilẹ̀ yìí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ἐπίγειος hàn.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: ilé kan láti ọ̀dọ̀ Ọlọ́run
  rationale: Nínú àyíká yìí οἰκοδομή tọ́ka sí ohun tí a kọ́. “Láti ọ̀dọ̀ Ọlọ́run” pa ìtumọ̀ orísun inú ἐκ θεοῦ mọ́.
- source_word: ἔχομεν
  choice: a ní
  rationale: A pa àsìkò ìsinsìnyí inú Gíríìkì mọ́, dípò yíyí i sí “a ó ní,” kí ìfaradà láàárín ohun tí a ní nísinsìnyí àti ìmúṣẹ rẹ̀ lọ́jọ́ iwájú má bàjẹ́.
- source_word: οἰκίαν ἀχειροποίητον
  choice: ilé tí ọwọ́ ènìyàn kò kọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá tó ṣe kedere, ó sì pa ìyàtọ̀ láàárín ohun tí Ọlọ́run pèsè àti ohun tí ènìyàn fi ọwọ́ ṣe mọ́.
- source_word: αἰώνιον ἐν τοῖς οὐρανοῖς
  choice: tí ó wà títí láé ní àwọn ọ̀run
  rationale: “Títí láé” fi ìdúróṣinṣin aláìnípẹ̀kun hàn; “àwọn ọ̀run” sì pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí àwòrán ilé àti àgọ́ ń tọ́ka sí
  choice: Pa àwòrán “ilé àgọ́” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “Ara wa ti ayé” tàbí “àgọ́ tí í ṣe ilé wa lórí ilẹ̀.”
  rationale: Ọ̀rọ̀ Gíríìkì mọ̀ọ́mọ̀ parapọ̀ àwòrán ilé, àgọ́ àti ohun tí a kọ́. Fífi “ara” sínú ọ̀rọ̀ pàtàkì yóò pinnu ìtumọ̀ tí ẹsẹ náà fún olùkà dípò pípa àwòrán rẹ̀ mọ́.
- issue: Ìgbà tí ἔχομεν ń tọ́ka sí
  choice: Lo “a ní” ní àsìkò ìsinsìnyí.
  alternative: “A ó ní.”
  rationale: Ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí. Èyí pa ìbéèrè ìtumọ̀ mọ́ bóyá ohun-ìní náà ti wà nísinsìnyí tàbí pé a ń sọ ohun ọjọ́ iwájú gẹ́gẹ́ bí ohun tí ó dájú.
translation_notes:
  register: Yorùbá boṣewa tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A pa àmì ohùn mọ́ níbi tí ó bá jẹ́ àdánidá. “Ilé àgọ́” jẹ́ àkópọ̀ tó yé ni Yorùbá, ó sì pa àwòrán méjèèjì inú Gíríìkì mọ́; a yẹra fún fífi ọ̀rọ̀ ìtumọ̀ bí “ara” sínú ọ̀rọ̀ pàtàkì.
