  terminology: ‘Ìkọ́lé ... ìyẹn ilé’ ń pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì méjì mọ́. ‘Ilé tí a kò fi ọwọ́ kọ́’ sun mọ́ ἀχειροποίητον ju ‘ilé tí ọwọ́ ènìyàn kò kọ́’ lọ, nítorí ó pa èrò ‘kì í ṣe nípasẹ̀ ọwọ́’ mọ́ láì fi kún un.
