  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ nínú àwòrán Gíríìkì mọ́, pàápàá ‘ilé/àgọ́,’ ìsinsìnyí ‘a ní,’ àti ‘àwọn ọ̀run.’ Ṣùgbọ́n ‘bí a bá wó ... palẹ̀’ sọ ẹni tí ń ṣe ìwó náà di ‘àwa,’ nígbà tí καταλυθῇ jẹ́ ìṣe àìṣiṣẹ́ ẹni (passive): ilé àgọ́ náà ni a wó palẹ̀ / tí ó wó palẹ̀. A tún lè fi ìyàtọ̀ οἰκοδομή (‘ìkọ́lé’) àti οἰκία (‘ilé’) hàn dáadáa.'
