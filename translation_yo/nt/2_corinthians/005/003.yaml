  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: yo
  text: Bí ó bá jẹ́ pé, nígbà tí a bá ti wọ aṣọ, a kì yóò rí wa ní ìhòòhò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó bá jẹ́ pé, lẹ́yìn tí a ti wọ̀ ọ́, a kì yóò rí wa ní ìhòòhò.”
    reason: Àṣàyàn mìíràn fún bí a ṣe lè so participle ἐνδυσάμενοι àti γυμνοί di Yorùbá, pẹ̀lú ohun tí a wọ̀ tí a kò dárúkọ ní kedere.
lexical_decisions:
- source_word: εἴ γε
  choice: bí ó bá jẹ́ pé
  rationale: Ó pa agbára àídájú εἰ mọ́, ó sì fi ìtẹnumọ́ γε hàn láì sọ ọ́ di ohun tí ó dájú.
- source_word: καὶ ἐνδυσάμενοι
  choice: nígbà tí a bá ti wọ aṣọ
  rationale: Ọ̀rọ̀ yìí mú ìṣe participle aorist middle náà jáde gẹ́gẹ́ bí ohun tí ó ṣáájú ‘a kì yóò rí wa,’ ó sì pa àpẹẹrẹ aṣọ mọ́ ní èdè Yorùbá àdánidá.
- source_word: οὐ γυμνοὶ
  choice: kì ... ní ìhòòhò
  rationale: ‘Ìhòòhò’ ni ìtumọ̀ tààrà fún γυμνοί, ó sì pa àwòrán aṣọ àti ìhòòhò mọ́.
- source_word: εὑρεθησόμεθα
  choice: a kì yóò rí wa
  rationale: Ìtumọ̀ yìí pa future passive mọ́ ní ọ̀nà tí ó ṣeé lóye ní Yorùbá, láì ṣàlàyé ẹni tí yóò rí wa.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ wíwọ aṣọ àti ìhòòhò
  choice: Pa àpẹẹrẹ náà mọ́ láì ṣàlàyé ohun tí ‘ìhòòhò’ dúró fún ní pàtó.
  alternative: Kí ‘ìhòòhò’ túmọ̀ sí àìní ara àjíǹde, ipò láàárín ikú àti àjíǹde, tàbí ìtìjú níwájú Ọlọ́run.
  rationale: Ẹsẹ̀ náà kò dá ọ̀kan nínú àwọn ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ wọ̀nyí mú; nítorí náà, ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò. A fi àpẹẹrẹ aṣọ/ìhòòhò Pọ́ọ̀lù sílẹ̀, a kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún un.
