id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: yo
  text: Nítorí ní tòótọ́, nígbà tí a wà nínú àgọ́ yìí, a ń kérora, ẹrù sì ń wúwo lórí wa, nítorí pé a kò fẹ́ bọ́ aṣọ kúrò lára, bí kò ṣe láti wọ aṣọ míì lé èyí tí a ti wọ̀[a], kí ìyè lè gbé ohun tí ó lè kú[b] mì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti wọ aṣọ bo èyí tí a ti wọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka sí wíwọ aṣọ òde lé aṣọ tí ó ti wà lára.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun kíkú” tàbí “ìwà-kíkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ní tòótọ́
  rationale: Ó pa ìbáṣepọ̀ àlàyé àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: σκήνει
  choice: àgọ́
  rationale: Ó pa àwòrán àgọ́ gẹ́gẹ́ bí ìgbé ayé inú ara lọ́wọ́lọ́wọ́ mọ́, ó sì so ẹsẹ̀ náà mọ́ àyíká ọ̀rọ̀ rẹ̀.
- source_word: στενάζομεν
  choice: a ń kérora
  rationale: ‘Kérora’ fi ìrora, ìwúwo, àti ìfẹ́kúfẹ̀ẹ́ ohun ọjọ́ iwájú hàn ju ọ̀rọ̀ tí ó túbọ̀ rọ̀ lọ.
- source_word: βαρούμενοι
  choice: ẹrù sì ń wúwo lórí wa
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò pé ohun kan ń di wọn lọ́rùn mọ́.
- source_word: ἐφ’ ᾧ
  choice: nítorí pé
  rationale: Ní àyíká yìí, ó ṣàfihàn ìdí tí wọn fi ń kérora, láìfi ìtumọ̀ míì kún un.
- source_word: ἐκδύσασθαι
  choice: bọ́ aṣọ kúrò lára
  rationale: Ó pa àwòrán aṣọ mọ́, kò sì tú u sí ẹ̀kọ́ pàtó nípa ipò ẹni lẹ́yìn ikú.
- source_word: ἐπενδύσασθαι
  choice: wọ aṣọ míì lé èyí tí a ti wọ̀
  rationale: Ó mú agbára ọ̀rọ̀ Gíríìkì jáde pé a ń wọ ohun míì sí orí ohun tí ó ti wà lára.
- source_word: καταποθῇ
  choice: gbé ... mì
  rationale: Àṣàyàn yìí pa àwòrán jíjẹ tàbí gbígbé ohun kan mì pátápátá mọ́ ní Yorùbá.
- source_word: τὸ θνητόν
  choice: ohun tí ó lè kú
  rationale: Ajẹtífù aláìdásọ̀rí náà ń ṣiṣẹ́ bí ọ̀rọ̀-orúkọ; ìtumọ̀ yìí jẹ́ kó yé ni, kò sì fi í mọ́ ara nìkan tàbí sọ ọ́ di ànímọ́ àfoyemọ̀ nìkan.
- source_word: ζωῆς
  choice: ìyè
  rationale: ‘Ìyè’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìyàtọ̀ tí Pọ́ọ̀lù ń fi hàn láàárín ohun tí ó lè kú àti ìyè.
theological_decisions:
- issue: Àwòrán aṣọ ti Pọ́ọ̀lù àti ipò àárín ikú àti àjíǹde
  choice: Pa àwòrán bíbọ́ aṣọ àti wíwọ aṣọ míì lé èyí tí a ti wọ̀ mọ́, láìsọ ètò ẹ̀kọ́ pàtó kan.
  alternative: Ṣàlàyé bíbọ́ aṣọ ní tààrà gẹ́gẹ́ bí wíwà láìsí ara, tàbí sọ wíwọ aṣọ míì di ara àjíǹde nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì lo àkàwé nípa ìwàláàyè inú ara àti ìyípadà ọjọ́ iwájú; ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán àgọ́, ẹrù, aṣọ, àti gbígbé ohun mì mọ́. A gbe àwọn àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń tọ́ka sí.
