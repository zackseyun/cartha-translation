revisions:
- from: Nítorí náà, àwa pẹ̀lú ń fi í ṣe ìpinnu ọkàn wa láti jẹ́ ẹni tí ó tẹ́ ẹ lọ́rùn, yálà a wà nílé tàbí a kò sí nílé.[a]
  to: Nítorí náà, àwa pẹ̀lú ń fi tọkàntọkàn lépa láti jẹ́ ẹni tí ó tẹ́ ọ́ lọ́rùn, yálà a wà nílé tàbí a jìnnà sí ilé.[a]
  rationale: Àtúnṣe náà ṣe kedere pé ẹni tí a fẹ́ tẹ́ lọ́rùn ni ẹni kẹta ẹyọ kan, kì í ṣe ‘ẹ̀yin.’ Ó tún mú ọ̀rọ̀ ‘away’ hàn ní Yorùbá ní ọ̀nà tí ó rọrùn, ó sì mú ìtara àti ète inú φιλοτιμούμεθα hàn dáadáa. A kò sọ ‘ara’ sínú ọ̀rọ̀ pàtàkì, nítorí Gíríìkì ẹsẹ náà kò sọ ọ́ ní pàtó; a fi í sílẹ̀ nínú àlàyé ìsàlẹ̀ ojú ìwé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:41Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìsọ̀kan ‘Nítorí náà … pẹ̀lú,’ ìfẹ́kúfẹ̀ẹ́/ìtara inú φιλοτιμούμεθα, àti àìsọ pàtó àwọn aláfikún sí ἐνδημοῦντες/ἐκδημοῦντες mọ́. Ṣùgbọ́n ‘ẹ’ nínú ‘tẹ́ ẹ lọ́rùn’ jẹ́ arọ́pò-orúkọ ẹni kejì púpọ̀, kì í ṣe αὐτῷ (‘òun/un’). ‘A kò sí nílé’ lè lóye, ṣùgbọ́n ‘a jìnnà sí ilé’ dáa sí i fún ìfarahàn ‘away’ náà.
  naturalness: ‘Fi í ṣe ìpinnu ọkàn wa’ kì í ṣe ọ̀nà Yorùbá tí ó rọrùn jù lọ láti sọ ìfẹ́kúfẹ̀ẹ́ tàbí ète tí ènìyàn ń lépa. ‘Ń fi tọkàntọkàn lépa’ jẹ́ gbolohun àdánidá, ó sì mú agbára ọ̀rọ̀ Gíríìkì náà hàn. ‘Tẹ́ ọ́ lọ́rùn’ jẹ́ ọ̀nà adayeba fún ‘be pleasing to him.’
  terminology: A pa ‘nílé/jìnnà sí ilé’ mọ́ gẹ́gẹ́ bí àwòrán kúkúrú ti Gíríìkì, láìsọ ‘ara’ sínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ ojú ìwé ń fúnni ní ìtumọ̀ àyíká, ní ìbámu pẹ̀lú ẹsẹ 6–8.
  issues:
  - severity: high
    issue: Arọ́pò-orúkọ ‘ẹ’ nínú ‘ẹni tí ó tẹ́ ẹ lọ́rùn’ kò bá αὐτῷ mu.
    rationale: Ní Yorùbá boṣewa, ‘ẹ’ jẹ́ ‘ẹ̀yin/you’ (ẹni kejì púpọ̀); ọ̀rọ̀ Gíríìkì náà jẹ́ dátífù ẹni kẹta ẹyọ kan, ‘sí òun/un.’ ‘Ọ́’ nínú ‘tẹ́ ọ́ lọ́rùn’ ni ohun-ìṣe ẹni kẹta tí ó yẹ níbí.
  - severity: medium
    issue: ‘A kò sí nílé’ lè túmọ̀ sí àìsí nílé lásán, kì í sì fi ìtumọ̀ ‘away’ hàn dáadáa.
    rationale: ‘A jìnnà sí ilé’ jẹ́ àdánidá sí i, ó sì fara mọ́ ìyàtọ̀ ἐνδημοῦντες/ἐκδημοῦντες, nígbà tí ó ṣì fi ohun tí ‘ilé’ ń tọ́ka sí sílẹ̀ láìsọ̀rọ̀ ní pàtó.
  - severity: low
    issue: ‘Ń fi í ṣe ìpinnu ọkàn wa’ wúwo díẹ̀, ó sì ṣòro láti ka gẹ́gẹ́ bí ìtumọ̀ φιλοτιμούμεθα.
    rationale: ‘Ń fi tọkàntọkàn lépa’ fi ìtara àti ìlépa ète hàn ní Yorùbá òde òní.
