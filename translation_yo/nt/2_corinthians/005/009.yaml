id: 2CO.5.9
reference: 2 Corinthians 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: yo
  text: Nítorí náà, àwa pẹ̀lú ń fi tọkàntọkàn lépa láti jẹ́ ẹni tí ó tẹ́ ọ́ lọ́rùn, yálà a wà nílé tàbí a jìnnà sí ilé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni, bí àyíká ọ̀rọ̀ ṣe fi hàn, “yálà a wà nílé nínú ara tàbí a jìnnà sí ara.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa wíwà nínú ara àti wíwà lọ́dọ̀ Olúwa.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó ń so ìpinnu yìí pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú, ó sì pa agbára àsopọ̀ Gíríìkì mọ́ láìfi ohun míì kún un.
- source_word: φιλοτιμούμεθα
  choice: ń fi í ṣe ìpinnu ọkàn wa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun kan ṣe ète tí ènìyàn ń lépa tọkàntọkàn; gbolohun Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtara àti ète inú ọ̀rọ̀ náà mọ́.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: yálà a wà nílé tàbí a kò sí nílé
  rationale: Àwọn ọ̀rọ̀ méjèèjì túmọ̀ ní tààrà sí wíwà nílé àti àìsí nílé. Àyíká ẹsẹ 6–8 tọ́ka sí ara, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò tún sọ ‘ara’; nítorí náà a pa kúkúrú àti àìsọ pàtó inú Gíríìkì mọ́.
- source_word: εὐάρεστοι
  choice: ẹni tí ó tẹ́ ẹ lọ́rùn
  rationale: Èyí sọ ní Yorùbá àdánidá pé ìgbésí ayé wa gbọdọ̀ jẹ́ èyí tí ó dùn mọ́ ẹni tí a ń tọ́ka sí, dípò gbólóhùn líle bí ‘ẹni ìtẹ́wọ́gbà.’
- source_word: αὐτῷ
  choice: ẹ
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Olúwa tí a mẹ́nu kàn nínú àyíká; lílo arọ́pò-orúkọ pa ìrísí Gíríìkì mọ́ láìfi ‘Olúwa’ kún ẹsẹ náà.
- source_word: εἶναι
  choice: láti jẹ́
  rationale: Ó parí èrò ọ̀rọ̀-ìṣe φιλοτιμούμεθα nípa ṣíṣàlàyé ohun tí wọ́n ń fi ṣe ìpinnu wọn.
theological_decisions:
- issue: Bóyá kí a sọ ohun tí ‘wà nílé’ àti ‘kò sí nílé’ ń tọ́ka sí ní pàtó
  choice: 'A fi gbólóhùn kúkúrú náà sílẹ̀ nínú ọ̀rọ̀ pàtàkì: ‘yálà a wà nílé tàbí a kò sí nílé.’'
  alternative: ‘yálà a wà nílé nínú ara tàbí a kò sí nínú ara.’
  rationale: Àyíká ẹsẹ 6–8 fi hàn pé ara ni wọ́n ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n Gíríìkì ẹsẹ 9 kò sọ ọ́ ní pàtó. Fífi gbólóhùn náà sílẹ̀ ní kúkúrú ń pa àìsọ pàtó àti ìrísí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì ń jẹ́ kí ìtumọ̀ àyíká hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Fi í ṣe ìpinnu ọkàn wa’ ń sọ ìtara tó wà nínú φιλοτιμούμεθα ní èdè tí òǹkàwé òde òní lè lóye; ‘wà nílé/kò sí nílé’ sì pa àwòrán àti kúkúrú Gíríìkì mọ́.
