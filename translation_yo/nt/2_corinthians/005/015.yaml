  to: Ó sì kú fún gbogbo ènìyàn[a], kí àwọn tí ń gbé ayé má ṣe tún gbé ayé fún ara wọn mọ́, bí kò ṣe fún ẹni tí ó kú fún wọn, tí a sì jí dìde.
