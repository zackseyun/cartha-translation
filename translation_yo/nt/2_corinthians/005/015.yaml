id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: yo
  text: Ó sì kú fún gbogbo ènìyàn[a], kí àwọn tí ń gbé ayé má ṣe tún gbé ayé fún ara wọn mọ́, bí kò ṣe fún ẹni tí ó kú fún wọn, tí a sì jí dìde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ipò gbogbo ènìyàn.” Bákan náà, “fún wọn” lè túmọ̀ sí “ní ipò wọn.” Ọ̀rọ̀ Gíríìkì kan náà (ὑπέρ) ni a lò ní ibi méjèèjì, ó sì lè tẹnu mọ́ àǹfààní tàbí aṣojú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: fún gbogbo ènìyàn
  rationale: 'Ὑπέρ pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń tọ́ka sí àǹfààní tàbí aṣojú: “fún, ní ipò.” “Fún gbogbo ènìyàn” jẹ́ èdè Yorùbá àdánidá, ó sì kò fi èrò ẹ̀kọ́ ìrapada kan pàtó kún ọ̀rọ̀ náà.'
- source_word: ἀπέθανεν
  choice: ó kú
  rationale: Aorist indicative sọ ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀; “ó kú” mú un jáde ní ṣókí, nígbà tí ẹni tí a ń sọ̀rọ̀ rẹ̀ hàn láti inú àyíká ọ̀rọ̀.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a fẹ́ hàn.
- source_word: οἱ ζῶντες
  choice: àwọn tí ó wà láàyè
  rationale: Present participle tí a lò bí orúkọ ń tọ́ka sí àwọn ènìyàn tí wọ́n ń gbé; gbolohun yìí ṣe kedere ju ọ̀rọ̀ kan bí “alààyè” lọ nínú àyíká yìí.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: má ṣe wà láàyè fún ara wọn mọ́
  rationale: “Má ṣe ... mọ́” ń pa ìtumọ̀ ìdáwọ́ dúró mọ́; “fún ara wọn” sì fi ìgbé ayé tí ó dojú kọ ire ara ẹni hàn.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: bí kò ṣe fún ẹni tí ó kú ... tí a sì jí dìde
  rationale: 'Dative náà ń tẹ̀síwájú pẹ̀lú ìṣe “wà láàyè”: kì í ṣe fún ara wọn, ṣùgbọ́n fún ẹlòmíràn. “Ẹni tí” pa ìṣètò participle mọ́ ní Yorùbá tí ó ṣe é kà.'
- source_word: ὑπὲρ αὐτῶν
  choice: fún wọn
  rationale: Ó tún ὑπέρ àkọ́kọ́ ṣe, nítorí náà “fún wọn” pa àsopọ̀ àti ìtunwi náà mọ́ láì mú èdè le.
- source_word: ἐγερθέντι
  choice: tí a jí dìde
  rationale: Fọ́ọ̀mù náà jẹ́ passive; “tí a jí dìde” pa ohùn passive mọ́, ó sì jẹ́ kí iṣẹ́ ẹni tí ó jí i dìde má bàa yí padà sí active “ó jí dìde.”
theological_decisions:
- issue: Ìwọ̀n àti agbára πάντων / αὐτῶν
  choice: “gbogbo ènìyàn” àti “wọn,” láì dín àwọn tí ọ̀rọ̀ náà lè tọ́ka sí kù
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí gbogbo ènìyàn láìsí ààlà, tàbí sí gbogbo onígbàgbọ́/àwọn tí Kristi dúró fún nínú àyíká ọ̀rọ̀.
  rationale: Ẹsẹ̀ náà lo ọ̀rọ̀ gbígbòòrò, ṣùgbọ́n kò dá ìjíròrò ẹ̀kọ́ ìgbàgbọ́ nípa ìwọ̀n ikú Kristi parí. Ìtumọ̀ náà pa àìdájú tó wà nínú ọ̀rọ̀ mọ́.
- issue: Ohùn passive nínú ἐγερθέντι
  choice: “tí a jí dìde”
  alternative: “tí ó jí dìde”
  rationale: Yíyan passive tẹ̀lé girama Gíríìkì, ó sì pa ìtọ́ka sí iṣẹ́ Ọlọ́run nínú àjíǹde mọ́ láì sọ ju ohun tí gbolohun náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “wà láàyè” lẹ́ẹ̀mejì láti pa ìtunwi ζάω mọ́. A pa passive àjíǹde mọ́. Àmì àlàyé [a] wà lẹ́yìn “gbogbo ènìyàn,” níbi tí àṣàyàn ìtumọ̀ ὑπέρ ti yẹ.
