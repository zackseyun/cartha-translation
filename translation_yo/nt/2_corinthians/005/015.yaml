  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣètò gbolohun Gíríìkì dáadáa: Kristi kú fún gbogbo ènìyàn, ète náà sì kan àwọn alààyè; ìyàtọ̀ náà ni pé wọn kò gbọ́dọ̀ tún gbé ayé fún ara wọn, bí kò ṣe fún ẹni tí ó kú tí a sì jí dìde fún wọn. “Tí a jí dìde” ń pa ohùn passive ti ἐγερθέντι mọ́. Síbẹ̀, “má ṣe wà láàyè fún ara wọn mọ́” kì í ṣe ọ̀nà Yorùbá tó rọrùn láti sọ ìtumọ̀ ζῶσιν nínú àyíká yìí; ó lè dà bí ìfòfindè lórí wíwà láàyè dípò ìgbé-ayé tí ó ní ìtọ́sọ́nà.'
