id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti mọ ìbẹ̀rù Olúwa[b], a ń yí àwọn ènìyàn lọ́kàn; ṣùgbọ́n a ti hàn gbangba sí Ọlọ́run[a], mo sì ní ìrètí pé a ti hàn gbangba pẹ̀lú nínú àwọn ẹ̀rí-ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti ṣí wa payá sí Ọlọ́run … a sì ti ṣí wa payá nínú àwọn ẹ̀rí-ọkàn yín.”
    reason: lexical_alternative
  - marker: b
    text: “Ìbẹ̀rù Olúwa” tún lè túmọ̀ sí ọ̀wọ̀ jíjinlẹ̀ àti ìyanu níwájú Olúwa, pàápàá nítorí ọ̀rọ̀ ìtẹ́ ìdájọ́ nínú ẹsẹ tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Nítorí náà, bí a ti mọ
  rationale: “Nítorí náà” fi ìtumọ̀ ìyọrísí οὖν hàn, “bí a ti mọ” sì pa ìsopọ̀ participle Εἰδότες mọ́ láìfi dandan sọ ọ́ di gbólóhùn ìdí.
- source_word: φόβον τοῦ κυρίου
  choice: ìbẹ̀rù Olúwa
  rationale: “Ìbẹ̀rù” pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì lè gba ìbẹ̀rù ìdájọ́ àti ọ̀wọ̀ jíjinlẹ̀ sí Olúwa pọ̀, gẹ́gẹ́ bí àyíká ẹsẹ 10 ṣe tọ́ka sí.
- source_word: ἀνθρώπους πείθομεν
  choice: a ń yí àwọn ènìyàn lọ́kàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe yíni lọ́kàn tàbí múni gba ohun kan, láìfi ohun tí a ń yí wọn lọ́kàn sí kún ọ̀rọ̀ Gíríìkì.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: ṣùgbọ́n a ti hàn gbangba fún Ọlọ́run
  rationale: Ó pa perfect passive àti ipò tí ẹni náà ti hàn gbangba mọ́; “fún Ọlọ́run” tún tẹ̀lé dative θεῷ láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἐλπίζω
  choice: mo sì ní ìrètí
  rationale: Ó sọ ìrètí ara ẹni tí Paulu fi hàn ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: nínú ẹ̀rí-ọkàn ẹnì kọ̀ọ̀kan yín
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún συνείδησις; “ẹnì kọ̀ọ̀kan” mú ọ̀pọ̀ iye Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: πεφανερῶσθαι
  choice: a ti hàn gbangba
  rationale: 'Ó tẹ̀síwájú pẹ̀lú ìtumọ̀ perfect passive: ohun tí a ti fi hàn, tí ó sì ṣì wà ní gbangba báyìí.'
theological_decisions:
- issue: Ìtumọ̀ “ìbẹ̀rù Olúwa” nínú àyíká yìí
  choice: Pa “ìbẹ̀rù” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “ọ̀wọ̀ jíjinlẹ̀ fún Olúwa”
  rationale: Àyíká ìtẹ́ ìdájọ́ Kristi nínú ẹsẹ tó ṣáájú fi hàn pé ọ̀rọ̀ náà lè ní ìmọ̀lára ìbẹ̀rù, ọ̀wọ̀ àti jíjẹ́ ẹni tí yóò jíyìn; yíyí i sí “ọ̀wọ̀” nìkan lè dín agbára rẹ̀ kù.
- issue: Agbára φανερόω nípa Ọlọ́run àti ẹ̀rí-ọkàn àwọn ará Kọ́ríńtì
  choice: “a ti hàn gbangba”
  alternative: “a ti di mímọ̀” tàbí “a ti ṣí wa payá”
  rationale: “Hàn gbangba” tọ́ka sí bí ìwà àti iṣẹ́ àwọn aposteli ṣe wà ní gbangba, láìdábàá pé Ọlọ́run ṣẹ̀ṣẹ̀ mọ wọn tàbí láìfi èrò ẹ̀kọ́ mìíràn sínú ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Yí … lọ́kàn” jẹ́ àdánidá fún ìyíni lọ́kàn; “hàn gbangba” sì yẹra fún ọ̀rọ̀ àjèjì tí kò wọ́pọ̀. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ.
