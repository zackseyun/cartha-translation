  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èrò Gíríìkì dáadáa ní gbogbogbòò: οὖν jẹ́ ìyọrísí, φόβος τοῦ κυρίου ni a pa mọ́ gẹ́gẹ́ bí “ìbẹ̀rù Olúwa,” πείθομεν ni “a ń yí ... lọ́kàn,” àti àwọn perfect passive φανερόω ni “a ti hàn gbangba.” Ṣùgbọ́n “fún Ọlọ́run” lè ní ìmọ̀ “ní tì Ọlọ́run” nínú Yorùbá; “sí Ọlọ́run” ṣe kedere síi fún dative náà. Àmì àwọn àlàyé ìsàlẹ̀ sì gbọdọ̀ bá ohun tí àlàyé kọ̀ọ̀kan ń ṣàlàyé mu.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tí ó ní ìyì. “Níwọ̀n bí a ti mọ” jẹ́ ìṣàn-ọrọ̀ tí ó rọrùn ju “bí a ti mọ” lọ ní ibẹ̀rẹ̀ ẹsẹ, ó sì ṣì fi ìbáṣepọ̀ participle náà hàn. “Nínú àwọn ẹ̀rí-ọkàn yín” ń mú ọ̀pọ̀ iye συνειδήσεσιν hàn kedere láìfi “ẹnì kọ̀ọ̀kan” tí kò sí nínú ọ̀rọ̀ orísun kún un.
  terminology: “Ìbẹ̀rù Olúwa,” “ẹ̀rí-ọkàn,” àti “hàn gbangba” jẹ́ àwọn ọ̀rọ̀ tí ó bá ìforúkọsílẹ̀ ẹsẹ náà mu. A kò yẹ kí a rọ́pò “ìbẹ̀rù” pẹ̀lú “ọ̀wọ̀” nínú ìtumọ̀ àkọ́kọ́, nítorí àyíká ìdájọ́ ń ṣètìlẹ́yìn fún agbára ọ̀rọ̀ náà.
