id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: yo
  text: Ó sọ ẹni tí kò mọ ẹ̀ṣẹ̀ di ẹ̀ṣẹ̀[a] fún wa, kí àwa lè di òdodo Ọlọ́run nínú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹbọ ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì sọ “ẹ̀ṣẹ̀” ní ibi méjèèjì; àwọn kan lóye ìlò kejì ní ọ̀nà ẹbọ.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ìdájọ́ òdodo Ọlọ́run” tàbí “òdodo láti ọ̀dọ̀ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: mọ
  rationale: “Mọ” ni ìtumọ̀ ìpilẹ̀ṣẹ̀ γινώσκω, ó sì pa ọ̀rọ̀ Gíríìkì náà mọ́ láì tú un sí “ṣe ẹ̀ṣẹ̀.” Nínú àyíká yìí, ó ń fi hàn pé ẹni náà kò ní ìkópa ti ara rẹ̀ nínú ẹ̀ṣẹ̀.
- source_word: ἁμαρτίαν (first occurrence)
  choice: ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ohun tí γνόντα tọ́ka sí ní tààrà; lílo “ẹ̀ṣẹ̀” pa ọ̀rọ̀ Pọ́ọ̀lù tí ó kúkúrú, tí ó sì lágbára mọ́.
- source_word: ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: “Fún wa” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi agbára aṣojú àti àǹfààní ὑπέρ hàn, láì fi ipa mú un wọ inú àlàyé kan ṣoṣo nípa ètùtù.
- source_word: ἁμαρτίαν (second occurrence)
  choice: ẹ̀ṣẹ̀
  rationale: A tún ọ̀rọ̀ kan náà ṣe gẹ́gẹ́ bí Gíríìkì ṣe ṣe. Èyí pa gbólóhùn Pọ́ọ̀lù tó múni ronú mọ́; a sì fi “ẹbọ ẹ̀ṣẹ̀” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- source_word: ἐποίησεν
  choice: sọ ... di
  rationale: Nínú ìṣètò Yorùbá, “sọ ... di” fi ìṣe tí ó mú kí ẹni kan wà ní ipò kan hàn lọ́nà àdánidá, ó sì yẹra fún “fi ... ṣe,” èyí tí ó lè dà bí ẹni pé ẹni náà ni a lò láti dá ẹ̀ṣẹ̀.
- source_word: γενώμεθα
  choice: lè di
  rationale: “Lè di” fi ìtumọ̀ γίνομαι àti agbára gbólóhùn ète ἵνα hàn, láì sọ ọ́ di ipò tí kò ní ìyípadà.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún δικαιοσύνη nínú àyíká ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ “ìdájọ́ òdodo” àti orísun òdodo mọ́.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: “Òdodo Ọlọ́run” pa ìsopọ̀ genitive mọ́ ní ṣókí, láì pinnu bóyá ó túmọ̀ sí òdodo tí Ọlọ́run ní, òdodo tó wá láti ọ̀dọ̀ rẹ̀, tàbí ìbáṣepọ̀ mìíràn.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: “Nínú rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn pàtàkì Pọ́ọ̀lù, ó sì yẹra fún fífi àlàyé “nínú ìṣọ̀kan pẹ̀lú rẹ̀” sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ “ó sọ ẹni náà di ẹ̀ṣẹ̀”
  choice: A pa gbólóhùn líle náà mọ́, nígbà tí apá àkọ́kọ́ ṣì jẹ́rìí pé ẹni náà kò mọ ẹ̀ṣẹ̀; nítorí náà, ọ̀rọ̀ náà kò sọ pé ó di ẹlẹ́ṣẹ̀ ní ìwà.
  alternative: Ó sọ ọ́ di ẹbọ ẹ̀ṣẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ “ẹ̀ṣẹ̀” ní ìgbà méjèèjì. Pípa bẹ́ẹ̀ mọ́ dáàbò bo ìfúnpọ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà, nígbà tí a tọ́ka sí ìtumọ̀ ẹbọ nínú àlàyé ìsàlẹ̀.
- issue: Agbára “δικαιοσύνη θεοῦ”
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “òdodo Ọlọ́run,” láì pinnu irú ìbáṣepọ̀ tí genitive náà ń fi hàn.
  alternative: Òdodo láti ọ̀dọ̀ Ọlọ́run; ìdájọ́ òdodo Ọlọ́run.
  rationale: Gbólóhùn Pọ́ọ̀lù ní ọ̀pọ̀ ìtumọ̀ tó ṣeé ṣe. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú orísun mọ́, dípò kí ó fi èrò ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo rọ́pò rẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè tó ṣe déédéé, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. “Ó” ń tọ́ka sí Ọlọ́run láti inú àyíká ẹsẹ tó ṣáájú; “sọ ... di” pa agbára gbólóhùn Gíríìkì mọ́ láì dá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
