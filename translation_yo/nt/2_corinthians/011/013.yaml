id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: yo
  text: Nítorí irú àwọn ènìyàn bẹ́ẹ̀ jẹ́ àwọn àpọ́sítélì èké, àwọn òṣìṣẹ́ ẹlẹ́tàn, tí wọ́n ń pa ara wọn dà bí àwọn àpọ́sítélì Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àpọ́sítélì Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí “Mèsáyà,” ṣùgbọ́n a tún lè pè é ní “Kristi” nígbà tí a bá lò ó bí orúkọ.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ àlàyé tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti fi ìdí ọ̀rọ̀ náà múlẹ̀ ní Yorùbá.
- source_word: τοιοῦτοι
  choice: irú àwọn ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn ènìyàn tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ ṣàpèjúwe, láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: ψευδαπόστολοι
  choice: àwọn àpọ́sítélì èké
  rationale: 'Ó mú ìtumọ̀ ọ̀rọ̀ àkópọ̀ Gíríìkì jáde ní kedere: àwọn tí wọ́n ń pe ara wọn ní àpọ́sítélì láìjẹ́ bẹ́ẹ̀ ní tòótọ́.'
- source_word: ἐργάται δόλιοι
  choice: àwọn òṣìṣẹ́ ẹlẹ́tàn
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe àwọn òṣìṣẹ́ tí ẹ̀tàn jẹ́ ànímọ́ iṣẹ́ wọn; gbólóhùn Yorùbá náà ṣe kedere ó sì pa agbára ìdálẹ́bi náà mọ́.
- source_word: μετασχηματιζόμενοι
  choice: tí wọ́n ń pa ara wọn dà
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí yíyí ìrísí tàbí bí ẹni ṣe ń fi ara rẹ̀ hàn padà fún ẹ̀tàn, kì í ṣe ìyípadà inú.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: bí àwọn àpọ́sítélì Mèsáyà
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe tí ó ṣáájú, εἰς ń tọ́ka sí ipò tí wọ́n ń díbọ́n pé wọ́n wà; ‘bí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánimọ̀ èké náà.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός dúró gẹ́gẹ́ bí oyè ẹni àmì òróró náà; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fún ‘Kristi’ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àkópọ̀ ἀποστόλους Χριστοῦ túmọ̀ sí àwọn àpọ́sítélì tí ó jẹ́ ti ẹni àmì òróró náà tàbí tí wọ́n ń ṣojú rẹ̀. ‘Mèsáyà’ jẹ́ kí agbára oyè náà hàn, ṣùgbọ́n ‘Kristi’ tún jẹ́ ìtumọ̀ Yorùbá tí a mọ̀ dáadáa, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tí ó mọ́, tí ó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. A lo ‘pa ara wọn dà’ láti mú ìdí ẹ̀tàn inú participle Gíríìkì náà jáde, a sì fi àmì ohùn síbi tí ó bá yẹ.
