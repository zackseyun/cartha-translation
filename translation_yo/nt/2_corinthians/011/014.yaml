source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: yo
  text: Kò sì jẹ́ ohun ìyanu[a], nítorí Satani fúnra rẹ̀ ń pa ara rẹ̀ dà bí áńgẹ́lì ìmọ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Satani fúnra rẹ̀ ń yí ara rẹ̀ padà sí áńgẹ́lì ìmọ́lẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí yíyí ìrísí padà, ṣùgbọ́n níhìn-ín ó ṣeé ṣe kó ń tọ́ka sí ìrísí ẹ̀tàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: Kò sì yani lẹ́nu
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun náà kò yani lẹ́nu; “sì” tún pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: Satani fúnra rẹ̀
  rationale: “Fúnra rẹ̀” mú ìtẹnumọ́ αὐτός jáde, nígbà tí “Satani” jẹ́ orúkọ ẹni láìfi atúmọ̀ ọ̀rọ̀ àṣẹ̀dá Gíríìkì kún un.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi ìdí tí ohun náà kò fi yani lẹ́nu hàn ní Yorùbá tó ṣe kedere.
- source_word: μετασχηματίζεται εἰς
  choice: ń pa ara rẹ̀ dà bí
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí ìrísí ẹ̀tàn tàbí bí ẹnì kan ṣe gbé ara rẹ̀ kalẹ̀, kì í ṣe dandan pé ìwà tàbí ẹ̀dá rẹ̀ yí padà pátápátá.
- source_word: ἄγγελον φωτός
  choice: áńgẹ́lì ìmọ́lẹ̀
  rationale: “Áńgẹ́lì” ni ìtumọ̀ tó bá ọ̀rọ̀ ẹ̀dá ọ̀run yìí mu, “ìmọ́lẹ̀” sì pa àwòrán àti ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Irú ìyípadà tí Satani ń ṣe
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìrísí ẹ̀tàn: “ń pa ara rẹ̀ dà bí.”'
  alternative: “ń yí ara rẹ̀ padà sí áńgẹ́lì ìmọ́lẹ̀.”
  rationale: Àyíká ọ̀rọ̀ nípa àwọn aposteli èké tẹnumọ́ ẹ̀tàn àti ìfarahàn. Ìtumọ̀ yìí kò sọ pé Satani di áńgẹ́lì mímọ́ ní ti ẹ̀dá, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ gígùn-ún pé ó “yí ìrísí padà” mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn. A lo “ń pa ara rẹ̀ dà bí” fún ìfarahàn ẹ̀tàn, a sì fi ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì sí àlàyé ìsàlẹ̀.
