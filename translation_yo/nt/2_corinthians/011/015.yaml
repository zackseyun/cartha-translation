id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: yo
  text: Nítorí náà, kò jẹ́ ohun ìyàlẹ́nu ńlá bí àwọn ìránṣẹ́ rẹ̀ pẹ̀lú bá pa ara wọn dà bí àwọn ìránṣẹ́ òdodo[a]. Ìparí wọn yóò jẹ́ gẹ́gẹ́ bí iṣẹ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ ìdájọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “òdodo” tàbí “ìdájọ́”; níbí, ó ń tọ́ka sí bí wọ́n ṣe ń fi ara hàn bí ẹni pé wọ́n dúró ti ohun tó tọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: kì í ṣe ohun ìyàlẹ́nu ńlá
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ohun náà kò ṣàjèjì tàbí yanilẹ́nu; yíyan yìí jẹ́ adayébá ní Yorùbá, ó sì pa ìtumọ̀ Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ ìparí ọ̀rọ̀ tí ó jáde láti inú ẹsẹ tó ṣáájú.
- source_word: διάκονοι
  choice: àwọn ìránṣẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, àwọn aṣojú Sátánì tí ń ṣiṣẹ́ fún un ni ó tọ́ka sí; “ìránṣẹ́” kò ní ìtumọ̀ ipò ṣọ́ọ̀ṣì tí “òjíṣẹ́” lè mú wá.
- source_word: μετασχηματίζονται
  choice: pa ara wọn dà
  rationale: Ọ̀rọ̀ náà tọ́ka sí yíyí ìrísí tàbí bí ẹni ṣe ń fi ara hàn padà fún ẹ̀tàn, kì í ṣe ìyípadà inú.
- source_word: ὡς
  choice: bí
  rationale: Ó ń mú ipa tàbí ìrísí tí wọ́n ń ṣe bí ẹni pé wọ́n ní wọlé.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìwà tó tọ́ níbí, ó sì lè gbé apá ìtumọ̀ righteousness àti justice; àlàyé ìsàlẹ̀ fi ìtumọ̀ inú àyíká hàn.
- source_word: τὸ τέλος
  choice: Ìparí wọn
  rationale: Ó tọ́ka sí ohun tí yóò ṣẹlẹ̀ sí wọn níkẹyìn, pàápàá nínú àyíká ìdájọ́.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: yóò bá iṣẹ́ wọn mu
  rationale: Ó sọ pé ohun tí yóò ṣẹlẹ̀ sí wọn níkẹyìn yóò ṣe déédéé pẹ̀lú ohun tí wọ́n ṣe; èyí jẹ́ Yorùbá adayébá tí ó pa ìbámu tí κατά ń sọ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ Páùlù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Ní àyíká yìí, àwọn ìránṣẹ́ èké ń fi ara hàn bí ẹni tí ó wà ní ìhà ohun tó tọ́ àti ìwà rere. “Òdodo” bo ìtumọ̀ náà dáadáa láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ justice tí ọ̀rọ̀ Gíríìkì náà tún lè ní.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. “Pa ara wọn dà” fi ẹ̀tàn inú àyíká ọ̀rọ̀ hàn, “bá iṣẹ́ wọn mu” sì mú àgbékalẹ̀ ìdájọ́ náà dun bí Yorùbá adayébá.
