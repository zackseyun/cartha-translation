id: 2CO.11.19
reference: 2 Corinthians 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: yo
  text: Nítorí ẹ fi inú dídùn fara da àwọn aṣiwèrè[a][b], ẹ̀yin fúnra yín jẹ́ ọlọ́gbọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ gbà àwọn aṣiwèrè láàyè.”
    reason: lexical_alternative
  - marker: b
    text: 'Pọ́ọ̀lù ń sọ̀rọ̀ ẹ̀fẹ̀: àwọn ará Kọ́ríńtì ka ara wọn sí ọlọ́gbọ́n, síbẹ̀ wọ́n ń fara da àwọn aṣáájú aláìgbọ́n.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: fi inú dídùn
  rationale: Ó ṣàfihàn pé wọ́n ń ṣe é tinútinú tàbí pẹ̀lú ìdùnnú; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ohùn ìbáwí ẹ̀fẹ̀ Pọ́ọ̀lù mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ἀνέχεσθε
  choice: fara da
  rationale: Ó túmọ̀ sí láti gba ìwà tàbí ẹni tí kò dùn mọ́ni láàyè, tàbí láti mú un sùúrù; ‘fara da’ jẹ́ kedere, ó sì bá bí ọ̀rọ̀ náà ṣe rí ní Gíríìkì mu.
- source_word: τῶν ἀφρόνων
  choice: àwọn aṣiwèrè
  rationale: Ó tọ́ka sí àwọn ènìyàn aláìgbọ́n; yíyan ‘àwọn aṣiwèrè’ pa ìtakora tààrà pẹ̀lú ‘ọlọ́gbọ́n’ mọ́.
- source_word: φρόνιμοι
  choice: ọlọ́gbọ́n
  rationale: Ó pa ìtumọ̀ ọgbọ́n tàbí ìmòye mọ́, ó sì jẹ́ kí ìtakora ẹ̀fẹ̀ láàárín ‘àwọn aṣiwèrè’ àti ‘ọlọ́gbọ́n’ hàn gbangba.
- source_word: ὄντες
  choice: ẹ̀yin fúnra yín jẹ́
  rationale: Ó ṣàfihàn ọ̀rọ̀ àpèjúwe participle náà láì pinnu pé ó ní ìtumọ̀ ‘nítorí pé’ tàbí ‘bí ó tilẹ̀ jẹ́ pé’; ó tún tẹnumọ́ pé àwọn ará Kọ́ríńtì ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ọ̀rọ̀ ẹ̀fẹ̀ Pọ́ọ̀lù sí àwọn ará Kọ́ríńtì
  choice: A túmọ̀ gbólóhùn náà ní tààrà, a sì jẹ́ kí ìtakora láàárín ‘àwọn aṣiwèrè’ àti ‘ẹ̀yin fúnra yín jẹ́ ọlọ́gbọ́n’ gbé ẹ̀fẹ̀ náà jáde.
  alternative: Láti fi ọ̀rọ̀ ìtumọ̀ kún un, bí ‘ẹ̀yin tí ẹ rò pé ẹ jẹ́ ọlọ́gbọ́n púpọ̀.’
  rationale: Èdè Gíríìkì kò sọ ní tààrà pé wọ́n ‘rò’ pé àwọn jẹ́ ọlọ́gbọ́n; fífi èyí kún un yóò tú ìtumọ̀ ẹ̀fẹ̀ náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Fi inú dídùn fara da’ jẹ́ àdánidá, nígbà tí ‘àwọn aṣiwèrè’ àti ‘ọlọ́gbọ́n’ pa ìtakora àti ohùn ẹ̀fẹ̀ orísun mọ́.
