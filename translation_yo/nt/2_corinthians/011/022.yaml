id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: yo
  text: Ṣé Hébérù ni wọ́n? Èmi náà ni. Ṣé ọmọ Ísírẹ́lì ni wọ́n? Èmi náà ni. Ṣé ìran Ábúráhámù ni wọ́n?[a] Èmi náà ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “irúgbìn Ábúráhámù.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan tí a lò fún àpapọ̀ àwọn àtọmọdọ́mọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: Hébérù
  rationale: Orúkọ ìdánimọ̀ ẹ̀yà àti ẹ̀sìn yìí ni a pa mọ́ gẹ́gẹ́ bí ‘Hébérù,’ kí ó lè yàtọ̀ sí ‘ọmọ Ísírẹ́lì’ àti ‘ìran Ábúráhámù.’
- source_word: κἀγώ
  choice: Èmi náà ni
  rationale: Ọ̀rọ̀ kúkúrú yìí pa ìtẹnumọ́ àti àtúnṣe ọ̀rọ̀ Pọ́ọ̀lù mọ́ ní Yorùbá àdánidá.
- source_word: Ἰσραηλῖται
  choice: ọmọ Ísírẹ́lì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé àwọn kan jẹ́ ti Ísírẹ́lì gẹ́gẹ́ bí ènìyàn májẹ̀mú, láì da ọ̀rọ̀ náà pọ̀ mọ́ ‘Hébérù.’
- source_word: σπέρμα Ἀβραάμ
  choice: ìran Ábúráhámù
  rationale: ‘Ìran’ jẹ́ ọ̀rọ̀ àpapọ̀ tó bá ìtumọ̀ σπέρμα mu, ó sì jẹ́ Yorùbá àdánidá ju ‘irúgbìn’ tí a túmọ̀ ní tààrà lọ.
- source_word: εἰσιν
  choice: ni wọ́n
  rationale: Ìṣètò ‘Ṣé … ni wọ́n?’ mú ìbéèrè àsọyé orísun jáde ní Yorùbá tó ṣe déédéé, nígbà tí ‘Èmi náà ni’ dáhùn sí i ní ṣókí.
theological_decisions:
- issue: Ìyàtọ̀ kékeré láàárín àwọn ọ̀rọ̀ ìdánimọ̀ Júù mẹ́tẹ̀ẹ̀ta
  choice: A pa ‘Hébérù,’ ‘ọmọ Ísírẹ́lì,’ àti ‘ìran Ábúráhámù’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ mẹ́ta ọ̀tọ̀.
  alternative: Kí a sọ gbogbo wọn di ‘Júù’ tàbí ‘àwọn àtọmọdọ́mọ Ábúráhámù.’
  rationale: Àkójọpọ̀ àwọn ìdánimọ̀ tó jọra ṣùgbọ́n tí kò dójú ìkan náà ni agbára àsọyé Pọ́ọ̀lù; dídapọ̀ wọn yóò sọ ìtẹnumọ́ orísun di pẹlẹbẹ.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àwọn ìbéèrè àti ìdáhùn kúkúrú pa ìlù àti ìtẹnumọ́ àsọyé Gíríìkì mọ́; àmì ohùn ni a lò níbi tó yẹ.
