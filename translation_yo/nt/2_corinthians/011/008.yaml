id: 2CO.11.8
reference: 2 Corinthians 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: yo
  text: Mo ja àwọn ìjọ mìíràn lólè nípa gbígba owó ìrànwọ́ lọ́wọ́ wọn, kí n lè ṣe iṣẹ́ ìránṣẹ́ fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù, “owó ọ̀yà” tàbí “owó iṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: àwọn ìjọ mìíràn
  rationale: Nínú lílo Páùlù, ἐκκλησία sábà ń tọ́ka sí àwọn ìjọ Kristẹni ní ibi kọ̀ọ̀kan; “àwọn ìjọ mìíràn” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἐσύλησα
  choice: Mo ja ... lólè
  rationale: Ọ̀rọ̀ náà lágbára, ó túmọ̀ sí jíjà tàbí pípa ohun ẹlòmíràn; “ja ... lólè” pa ìfọ̀rọ̀wérọ̀ olóró àti àsọdùn Páùlù mọ́ láì rọ̀ ọ́.
- source_word: λαβὼν
  choice: nípa gbígba ... lọ́wọ́ wọn
  rationale: Aorist participle náà ṣàlàyé ọ̀nà tí Páùlù fi sọ pé òun “ja” àwọn ìjọ náà lólè; “nípa gbígba” fi ìbáṣepọ̀ yìí hàn ní Yorùbá àdánidá.
- source_word: ὀψώνιον
  choice: owó ìrànwọ́
  rationale: ὀψώνιον lè jẹ́ owó iṣẹ́, owó ọ̀yà, tàbí ohun ìpèsè. Ní àyíká iṣẹ́ ìránṣẹ́ yìí, “owó ìrànwọ́” sọ ìtìlẹ́yìn ti ara àti ti owó jáde láì mú kí ó dà bí àjọṣe agbanisíṣẹ́; ìtumọ̀ gígúnmọ́ “owó ọ̀yà” wà nínú àlàyé ìsàlẹ̀.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: kí n lè ṣe iṣẹ́ ìránṣẹ́ fún yín
  rationale: πρός pẹ̀lú accusative fi ète hàn níbí; gbólóhùn yìí mú kí ó ṣe kedere pé ìrànwọ́ náà jẹ́ kí Páùlù lè ṣiṣẹ́ ìránṣẹ́ láàárín àwọn ará Kọ́ríńtì.
theological_decisions:
- issue: Agbára àsọyé Páùlù nípa gbígba owó lọ́wọ́ àwọn ìjọ mìíràn
  choice: Pa àwòrán olóró náà mọ́ gẹ́gẹ́ bí “Mo ja àwọn ìjọ mìíràn lólè,” èyí tó jẹ́ àsọdùn tàbí ọ̀rọ̀ ẹ̀gàn ara ẹni, kì í ṣe ìjẹ́wọ́ pé ó jí ohun wọn ní ti gidi.
  alternative: Rọ ọ́ sí “Mo gba ìrànwọ́ lọ́wọ́ àwọn ìjọ mìíràn” tàbí “Mo fi àwọn ìjọ mìíràn ṣe aláìní.”
  rationale: ἐσύλησα jẹ́ ọ̀rọ̀ tó mọ̀ọ́mọ̀ lágbára. Àyíká ẹsẹ náà jẹ́ nípa ìtìlẹ́yìn fún iṣẹ́ ìránṣẹ́, kì í ṣe olè jíjà ní ti gidi; ṣùgbọ́n pípa ọ̀rọ̀ líle náà mọ́ dáàbò bo ìfọ̀rọ̀wérọ̀ àti ìdíje ọ̀rọ̀ Páùlù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. “Ja ... lólè” pa agbára àwòrán Gíríìkì mọ́; “owó ìrànwọ́” sì jẹ́ ọ̀rọ̀ àdánidá fún ohun tí àwọn ìjọ fi ṣe ìtìlẹ́yìn fún Páùlù. A fi àmì àlàyé [a] sí ibi tó yẹ nínú ọ̀rọ̀.
