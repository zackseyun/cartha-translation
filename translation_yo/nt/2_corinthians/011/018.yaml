  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn ń ṣògo ní ìbámu pẹ̀lú ara[a], èmi náà yóò ṣògo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ìwọ̀n ènìyàn” tàbí “ní ọ̀nà ènìyàn lásán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Nítorí
  rationale: Ó fi ìdí tí Pọ́ọ̀lù fi pinnu láti ṣe bí àwọn alatakò rẹ̀ hàn; ‘Nítorí’ jẹ́ ọ̀nà àdánidá láti pa agbára ìdí-múlẹ̀ náà mọ́ ní Yorùbá.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó túmọ̀ iye ènìyàn púpọ̀ ní ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: καυχῶνται / καυχήσομαι
  choice: ń ṣògo / yóò ṣògo
  rationale: ‘Ṣògo’ mú ìtumọ̀ fífi ohun tí ẹni jẹ́ tàbí ní yangàn mu, ó sì pa àtúnsọ ọ̀rọ̀-ìṣe kan náà mọ́ nínú àwọn gbólóhùn méjèèjì, gẹ́gẹ́ bí Gíríìkì.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó pa àwòrán σάρξ (‘ara’) mọ́ láì tú u sí ‘ẹ̀dá ẹlẹ́ṣẹ̀,’ ṣùgbọ́n ó tún lè tọ́ka sí ìṣògo gẹ́gẹ́ bí ìwọ̀n tàbí ọ̀nà ènìyàn lásán; àlàyé ẹsẹ̀ ìsàlẹ̀ fúnni ní àwọn ìtumọ̀ àdánidá yìí.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: Ó mú ìtẹnumọ́ καί + ἐγώ jáde, ó sì fi hàn pé Pọ́ọ̀lù ń fi ìṣe tirẹ̀ wé ti àwọn ẹlòmíràn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ σάρξ nínú κατὰ σάρκα
  choice: nípa ti ara
  alternative: ní ìbámu pẹ̀lú ìwọ̀n ènìyàn; ní ọ̀nà ènìyàn lásán
  rationale: Mímú ‘ara’ dúró nínú ọ̀rọ̀ pàtàkì pa àìdájú àti ìwọ̀n èrò inú ọ̀rọ̀ Pọ́ọ̀lù mọ́, láì sọ ọ́ di ‘ìwà ẹlẹ́ṣẹ̀’ tàbí yan ìtumọ̀ kan ṣoṣo. Ẹsẹ̀ ìsàlẹ̀ ṣàlàyé ọ̀nà tí gbólóhùn náà lè gbà túmọ̀ nínú àyíká yìí.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ṣògo’ pa ìró àríyànjiyàn àti ìfọ̀rọ̀yà Pọ́ọ̀lù mọ́; ‘nípa ti ara’ sì pa àwòrán Gíríìkì mọ́ pẹ̀lú àlàyé ní ẹsẹ̀ ìsàlẹ̀.
