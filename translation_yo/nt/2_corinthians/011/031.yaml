id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: yo
  text: Ọlọ́run àti Baba Olúwa Jésù, ẹni ìbùkún títí láé,[a] mọ̀ pé èmi kò purọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan jù lọ, ‘fún àwọn ayérayé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Ọlọ́run àti Baba
  rationale: Àpilẹ̀kọ kan náà ló ń darí àwọn orúkọ méjèèjì nínú Gíríìkì; ìtumọ̀ yìí pa gbólóhùn pàtó náà àti ìpè mímọ́ Pọ́ọ̀lù sí Ọlọ́run mọ́.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jesu
  rationale: A tú κύριος sí ‘Olúwa’ gẹ́gẹ́ bí oyè, a kò sì fi ‘wa’ kún un nítorí kò sí nínú Gíríìkì.
- source_word: οἶδεν
  choice: mọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘mọ̀’; bí ó tilẹ̀ jẹ́ pé ó ń ṣiṣẹ́ bí ìjẹ́rìí nínú ọ̀rọ̀ ìbúra, a kò fẹ̀ ọ́ sí ‘jẹ́rìí’.
- source_word: ὁ ὢν εὐλογητὸς
  choice: ẹni tí a ń yìn ín
  rationale: Nínú àyíká ọ̀rọ̀ ìyìn sí Ọlọ́run, ‘ẹni tí a ń yìn ín’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ εὐλογητός hàn, ìyẹn ẹni tí ó yẹ fún ìyìn.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láé
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu láti sọ agbára ọ̀rọ̀ ìyìn tí kò ní òpin; ìtumọ̀ gangan jù lọ ni ‘fún àwọn ìgbà ayérayé.’
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣe àgbékalẹ̀ ohun tí Ọlọ́run mọ̀, kì í ṣe ìdí kan.
- source_word: οὐ ψεύδομαι
  choice: èmi kò purọ́
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún ìjẹ́rìí ẹni àkọ́kọ́ tó ń ṣẹlẹ̀ lọ́wọ́, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘Ọlọ́run àti Baba’ pẹ̀lú ‘Olúwa Jesu’
  choice: A tú un ní tààrà sí ‘Ọlọ́run àti Baba Olúwa Jesu,’ láì dín ìyàtọ̀ àwọn ẹni náà kù.
  alternative: Ṣíṣe àtúnsọ rẹ̀ láti yẹra fún ìnira ẹ̀kọ́ ìgbàgbọ́ tí àwọn kan lè rí nínú rẹ̀.
  rationale: Ẹsẹ̀ náà ya Ọlọ́run Baba sọ́tọ̀ sí Olúwa Jesu nípa ìbáṣepọ̀ wọn. Ìtumọ̀ gbọ́dọ̀ pa ọ̀rọ̀ náà mọ́ láì mú ìyàtọ̀ yìí rọ̀.
- issue: Ìsomọ́ gbólóhùn ìyìn ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: A gbà á gẹ́gẹ́ bí àpèjúwe ìyìn àfikún fún Ọlọ́run, a sì yà á sọ́tọ̀ pẹ̀lú àmì kọ́má.
  alternative: Kí a so ó mọ́ ‘Ọlọ́run’ ṣinṣin bí gbólóhùn ààlà láì fi àmì ìdádúró yà á.
  rationale: Ó bá ọ̀rọ̀ Gíríìkì àti ìṣàn gbólóhùn Yorùbá mu láti ka a sí ọ̀rọ̀ ìyìn ọlọ́wọ̀ tí Pọ́ọ̀lù fi ṣàfikún sí ìpè rẹ̀ sí Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Jesu’ ni akọtọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀; ‘ẹni tí a ń yìn ín’ mú ìyìn doxology náà dun bí Yorùbá àdánidá.
