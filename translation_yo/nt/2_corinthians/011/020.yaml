id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: yo
  text: Nítorí ẹ̀ ń fara dà irú nǹkan bẹ́ẹ̀[a] bí ẹnì kan bá sọ yín di ẹrú, bí ẹnì kan bá jẹ yín run, bí ẹnì kan bá gba ohun lọ́wọ́ yín[b], bí ẹnì kan bá gbé ara rẹ̀ ga, bí ẹnì kan bá lù yín lójú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀ ń gbà á láàyè” tàbí “ẹ̀ ń fara dà á.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó kàn sọ pé “gba”; ó ṣeé ṣe kí ìtumọ̀ rẹ̀ jẹ́ fífi yín jẹ èrè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: ẹ̀ ń fara da irú nǹkan bẹ́ẹ̀
  rationale: Ó ṣàfihàn pé àwọn ará Kọ́ríńtì ń fara da ìwà ìkà wọ̀nyí ní tòótọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá ìbáwí ẹlẹ́yà Pọ́ọ̀lù mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára ìṣàlàyé ọ̀rọ̀ náà mọ́, ó sì so ẹsẹ yìí mọ́ ìbáwí tó ṣáájú rẹ̀.
- source_word: καταδουλοῖ
  choice: sọ yín di ẹrú
  rationale: Ó pa ìtumọ̀ líle ti fífi ènìyàn sábẹ́ ìgbèkùn ẹrú mọ́ láì rọ ọ́ sí ọ̀rọ̀ tí kò lágbára.
- source_word: κατεσθίει
  choice: jẹ yín run
  rationale: Ó pa àwòrán alágbára ti jíjẹ run mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ó ń tọ́ka sí fífi wọ́n jẹ èrè.
- source_word: λαμβάνει
  choice: gba ohun lọ́wọ́ yín
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘gba’ láì sọ ohun tí a gbà; àyíká ọ̀rọ̀ tọ́ka sí gbígba ohun lọ́wọ́ wọn fún èrè, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdájú náà mọ́.
- source_word: ἐπαίρεται
  choice: gbé ara rẹ̀ ga
  rationale: Ó pa ìtumọ̀ ìgbéraga ara ẹni àti ìṣe afẹ̀hìntì mọ́ dípò yíyí rẹ̀ padà sí àpèjúwe lásán.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: lù yín lójú
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún lílu ènìyàn ní ojú, láì dín ìṣe náà kù sí lílá ẹ̀rẹ̀kẹ́ nìkan.
- source_word: εἴ τις
  choice: bí ẹnì kan bá
  rationale: Àtúnṣe gbólóhùn yìí ní gbogbo àkójọ náà pa ìlù àti agbára ọ̀rọ̀ ìbéèrè onígbọ̀wọ̀ náà mọ́.
theological_decisions:
- issue: Ìró ẹlẹ́yà nínú ìbáwí Pọ́ọ̀lù
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìbáwí ẹlẹ́yà sí bí àwọn ará Kọ́ríńtì ṣe ń fara da àwọn tó ń ni wọ́n lára, láì fi orúkọ ‘àwọn aposteli èké’ kún ọ̀rọ̀ pàtàkì.
  alternative: Kí a sọ ní tààrà pé àwọn aposteli èké tàbí olùkọ́ èké ni wọ́n ń ṣe àwọn nǹkan wọ̀nyí.
  rationale: Àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìtumọ̀ yẹn, ṣùgbọ́n ẹsẹ Gíríìkì fúnra rẹ̀ kàn to àwọn ìṣe ìkà náà lẹ́sẹẹsẹ, kò sì pe àwọn tó ń ṣe é ní orúkọ nínú ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe “bí ẹnì kan bá” mú ìtẹnumọ́ àkójọ Gíríìkì náà jáde; àwọn ọ̀rọ̀ bí “sọ yín di ẹrú” àti “jẹ yín run” sì pa agbára àwọn àwòrán ìpilẹ̀ṣẹ̀ mọ́.
