  to: Nítorí ẹ̀ ń fara dà irú nǹkan bẹ́ẹ̀[a] bí ẹnì kan bá sọ yín di ẹrú, bí ẹnì kan bá jẹ yín run, bí ẹnì kan bá gba ohun lọ́wọ́ yín[b], bí ẹnì kan bá gbé ara rẹ̀ ga, bí ẹnì kan bá lù yín lójú.
