  verdict: revise
  source_fidelity: Ìbẹ̀rẹ̀ náà, “Láìka … sí,” lè túmọ̀ sí ‘despite/notwithstanding’ ní Yorùbá, dipo ìtumọ̀ χωρὶς (‘apart from/besides’). Pẹ̀lú èyí, “tẹ̀ mí lọ́rùn” jẹ́ ọ̀rọ̀ àkàwé tó lè sọ ìdààmú ọkàn tàbí ìbínú; kò ṣe kedere tó fún ἐπίστασις gẹ́gẹ́ bí ìfúnpá/ìnira tí ń wà lórí Pọ́ọ̀lù. Àtúnṣe náà pa ìbáṣepọ̀ appositional tó wà láàárín ‘ìnira ojoojúmọ́’ àti ‘ìbìkítà fún gbogbo ìjọ’ mọ́.
  naturalness: “Yàtọ̀ sí” àti “ìnira ojoojúmọ́ tí ń tẹ̀ mí” jẹ́ Yorùbá boṣewa, ó sì ṣàlàyé ìfúnpá náà láì lo àkàwé tí ó lè dàrú. “Ìbìkítà” dáa fún ẹrù ìtọ́jú olùṣọ́-àgùntàn nínú àyíká yìí.
  terminology: “Ìjọ” bá ἐκκλησίαι mu dáadáa. A yí “àníyàn” sí “ìbìkítà” nínú ọ̀rọ̀ àkọ́kọ́, nítorí μέριμνα níbí jẹ́ ẹrù ìtọ́jú fún àwọn ìjọ; àfi ìtumọ̀ “àníyàn” sílẹ̀ gẹ́gẹ́ bí aṣàyàn nínú àlàyé-ẹsẹ̀.
  issues:
