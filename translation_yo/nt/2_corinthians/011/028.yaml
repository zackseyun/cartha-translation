    issue: “Láìka àwọn ohun mìíràn wọ̀nyẹn sí”
    rationale: Ìṣọ̀kan ‘láìka … sí’ sábà máa ń ní ìtumọ̀ ‘láìbìkítà sí/despite’ ní Yorùbá. χωρὶς τῶν παρεκτὸς ń yà àwọn ohun mìíràn sílẹ̀ gẹ́gẹ́ bí ohun tí a kò kà pọ̀ (‘besides/apart from’).
  - severity: medium
    issue: “ohun tí ń tẹ̀ mí lọ́rùn”
    rationale: Ó lè túmọ̀ sí ohun tí ń yọ ẹni lẹ́nu tàbí ń dá ọkàn ẹni rú. ‘Ìnira ojoojúmọ́ tí ń tẹ̀ mí’ fi ἐπίστασίς μοι hàn kedere gẹ́gẹ́ bí ìfúnpá tó wà lórí ẹni.
  - severity: low
    issue: “àníyàn” nínú ọ̀rọ̀ àkọ́kọ́
    rationale: Ó jẹ́ ìtumọ̀ tó ṣeé gbà, ṣùgbọ́n ní Yorùbá ó lè kọ́kọ́ pe ìbẹ̀rù tàbí ìdààmú ara ẹni. “Ìbìkítà” mú ìtọ́jú Pọ́ọ̀lù fún àwọn ìjọ hàn dáadáa, láì mú ìtumọ̀ Gíríìkì náà kúrò.
