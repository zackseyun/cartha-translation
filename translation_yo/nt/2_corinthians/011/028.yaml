  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: yo
  text: 'Yàtọ̀ sí àwọn ohun mìíràn wọ̀nyẹn[a], ìnira ojoojúmọ́ tí ń tẹ̀ mí[b] wà lórí mi: ìbìkítà fún gbogbo àwọn ìjọ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Yàtọ̀ sí àwọn ohun tó kù,” tàbí “Yàtọ̀ sí àwọn ohun tí a kò mẹ́nu kàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹrù mi ojoojúmọ́,” tàbí “ìfúnpá ojoojúmọ́ tí ó wà lórí mi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àníyàn fún gbogbo àwọn ìjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Láìka àwọn ohun mìíràn wọ̀nyẹn sí
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwọn ohun tó yàtọ̀ sí tàbí tó wà lẹ́yìn ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ tò lẹ́sẹẹsẹ; ìtumọ̀ yìí so ẹsẹ̀ náà mọ́ àkọsílẹ̀ ìjìyà tó ṣáájú láì pinnu bóyá ohun lóde ni tàbí ohun tí kò mẹ́nu kàn.
- source_word: ἐπίστασίς μοι ἡ καθ’ ἡμέραν
  choice: ohun tí ń tẹ̀ mí lọ́rùn lójoojúmọ́
  rationale: Ó fi agbára ìtẹ̀sí tàbí ìnira tó dé bá Pọ́ọ̀lù hàn, ó sì pa dative μοι mọ́ gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ sí i; “lójoojúmọ́” fi καθ’ ἡμέραν hàn ní Yorùbá àdánidá.
- source_word: ἡ μέριμνα
  choice: àníyàn
  rationale: Àníyàn lè túmọ̀ sí ìtọ́jú ọkàn tó wúwo tàbí ìbànújẹ́ inú; níbí ó pa ìwọ̀n ìmọ̀lára ọ̀rọ̀ Gíríìkì mọ́ láì sọ pé àníyàn náà jẹ́ ẹ̀ṣẹ̀.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: fún gbogbo àwọn ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìlò ἐκκλησία fún àwọn àwùjọ onígbàgbọ́ mu.
theological_decisions:
- issue: Ìtumọ̀ ẹrù ìtọ́jú Pọ́ọ̀lù nínú μέριμνα
  choice: àníyàn fún gbogbo àwọn ìjọ
  alternative: ìtọ́jú gbogbo àwọn ìjọ / ìbìkítà fún gbogbo àwọn ìjọ
  rationale: “Àníyàn” pa ìwọ̀n àti ìdààmú ọkàn tó lè wà nínú μέριμνα mọ́, ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ ẹrù ìtọ́jú aposteli; a kò fi ìdájọ́ pé ó jẹ́ àníyàn ẹlẹ́ṣẹ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “tẹ̀ mí lọ́rùn” lọ́nà àkàwé fún ìnira tó ń rọ̀ mọ́ ẹni, a sì fi gbogbo àmì ohùn síbi tí ó bá yẹ.
