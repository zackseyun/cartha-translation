  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: yo
  text: Nítorí kí ni? Ṣé nítorí pé mi ò fẹ́ràn yín ni? Ọlọ́run mọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Ọlọ́run mọ̀ pé mo fẹ́ràn yín.” Ní Gíríìkì, ọ̀rọ̀ náà ní “Ọlọ́run mọ̀” nìkan; ó fi ìdáhùn sí ìbéèrè àsọyé náà sílẹ̀ láì sọ ọ́ jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Nítorí kí ni?
  rationale: Ọ̀rọ̀ ìbéèrè yìí ń béèrè ìdí; ó sì pa agbára ìbéèrè àsọyé Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: Ṣé nítorí pé
  rationale: Nínú àtòjọ ọ̀rọ̀ yìí, ὅτι ṣàgbékalẹ̀ ìdí tí ìbéèrè tó ṣáájú ń tọ́ka sí; fífi “Ṣé” kún un mú kí ìbéèrè àsọyé náà ṣe kedere ní Yorùbá.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: èmi kò fẹ́ràn yín
  rationale: Ó pa àtakò, ẹni àkọ́kọ́, àti ohun tí ìṣe náà kàn mọ́; “èmi” ní ìtẹnumọ́ tó bá àfikún arọ́pò-orúkọ inú Gíríìkì mu.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, fún θεός nínú àyíká yìí.
- source_word: οἶδεν
  choice: mọ̀
  rationale: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí “mọ̀,” láì fi ìdáhùn tí Gíríìkì fi sílẹ̀ láì sọ kún ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Bóyá kí a fi ìdáhùn rere tí a lóye pé ó wà nínú ọ̀rọ̀ náà hàn gbangba lẹ́yìn “Ọlọ́run mọ̀”
  choice: Ọlọ́run mọ̀.
  alternative: Ọlọ́run mọ̀ pé mo fẹ́ràn yín.
  rationale: Gíríìkì sọ pé “Ọlọ́run mọ̀” nìkan. Ìbéèrè àsọyé náà ń tọ́ka sí ìdáhùn rere, ṣùgbọ́n a fi ohun tí a kò sọ sílẹ̀ bẹ́ẹ̀ láti pa àìsọgbọ́n díẹ̀ àti agbára ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ológo, ó sì ṣeé lóye fún òǹkàwé òde òní. “Yín” jẹ́ ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ὑμᾶς.
