id: 2CO.11.16
reference: 2 Corinthians 11:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: yo
  text: Mo tún sọ pé, kí ẹnikẹ́ni má ṣe rò pé aláìgbọ́n ni mo jẹ́[a]—ṣùgbọ́n bí kò bá rí bẹ́ẹ̀, ẹ gbà mí bí ẹni tí kò gbọ́n, kí èmi pẹ̀lú lè ṣògo díẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ἄφρων gẹ́gẹ́ bí orúkọ pé, “kí ẹnikẹ́ni má ṣe rò pé aṣiwèrè ni mo jẹ́ ... ẹ gbà mí bí aṣiwèrè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “aláìgbọ́n” tàbí “aṣiwèrè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Mo tún sọ pé
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń tún ìbéèrè rẹ̀ sọ; gbólóhùn yìí ṣe déédé ní Yorùbá.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: kí ẹnikẹ́ni má ṣe rò pé mo jẹ́ aláìgbọ́n
  rationale: Ìṣètò ‘kí ... má ṣe’ mú ìfẹ́ tàbí ìkìlọ̀ òdì tí μή pẹ̀lú subjunctive ní, ‘aláìgbọ́n’ sì pa ìtumọ̀ ἄφρων mọ́ láì dín ẹ̀gàn inú ọ̀rọ̀ náà kù.
- source_word: εἰ δὲ μή γε
  choice: ṣùgbọ́n bí kò bá rí bẹ́ẹ̀
  rationale: Ó ṣàfihàn ààyè kejì tí Pọ́ọ̀lù fi sílẹ̀ bí wọn kò bá gba ohun tó kọ́kọ́ béèrè.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: ẹ gbà mí bí ẹni tí kògbọ́n
  rationale: ‘Ẹ gbà mí’ mú àṣẹ δέξασθέ με wá sí Yorùbá adayeba; ‘bí ẹni tí kògbọ́n’ pa ipa concessive àti ìṣàpẹẹrẹ ὡς mọ́.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: kí èmi pẹ̀lú lè ṣògo díẹ̀
  rationale: ‘Kí ... lè’ ṣàfihàn ète ἵνα, ‘èmi pẹ̀lú’ tẹnumọ́ κἀγώ, ‘ṣògo’ sì pa èdè ìṣògo tí Pọ́ọ̀lù mọ̀ọ́mọ̀ lò mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ẹ̀gàn tí Pọ́ọ̀lù fi pe ara rẹ̀ ní ἄφρων àti ìṣògo rẹ̀
  choice: Pa ‘aláìgbọ́n/kògbọ́n’ àti ‘ṣògo’ mọ́ láì rọ ọ̀rọ̀ náà
  alternative: Túmọ̀ rẹ̀ sí ‘ẹni tí ń sọ̀rọ̀ láìronú’ tàbí ọ̀rọ̀ míì tí ó rọrùn ju bẹ́ẹ̀ lọ
  rationale: 'Àyíká náà ní ẹ̀gàn àti ìforígbárí ọ̀rọ̀: Pọ́ọ̀lù kọ̀ láti jẹ́ aláìgbọ́n, síbẹ̀ ó gba kí wọn wo òun bẹ́ẹ̀ fún ìgbà díẹ̀ kí ó lè ‘ṣògo.’ Ìtumọ̀ kò gbọ́dọ̀ mú ìforígbárí yìí kúrò.'
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yàn ‘aláìgbọ́n/ẹni tí kògbọ́n’ fún ọ̀rọ̀ àkọ́kọ́, a sì fi ‘aṣiwèrè’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí yíyan míì, kí ìtumọ̀ má bàa le ju ohun tí Gíríìkì ń sọ lọ.
