id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: yo
  text: Nígbà tí mo wà lọ́dọ̀ yín, tí mo sì jẹ́ aláìní, èmi kò di ẹrù fún ẹnikẹ́ni[a]; nítorí àwọn arákùnrin[b] tí wọ́n wá láti Makedóníà pèsè ohun tí mo ṣaláìní rẹ̀ fún mi. Nínú ohun gbogbo, mo pa ara mi mọ́ kí n má baà di ẹrù fún yín, màá sì máa ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi kò fa ìnira fún ẹnikẹ́ni.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi ẹrù tàbí ìnira owó lé ẹnì kan lórí.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” ni ó túmọ̀ fọ́ọ̀mù akọ púpọ̀ kan. Pọ́ọ̀lù lè lo ọ̀rọ̀ yìí ní àwọn àyíká mìíràn fún àwọn onígbàgbọ́ lápapọ̀, ṣùgbọ́n níbí ó ṣeé ṣe kí ó tọ́ka sí àwọn alábàáṣiṣẹ́ pàtó láti Makedóníà.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: Nígbà tí mo sì wà lọ́dọ̀ yín
  rationale: Ó mú ìtumọ̀ àkókò participle náà jáde ní Yorùbá àdánidá, ó sì tọ́ka sí wíwà Pọ́ọ̀lù pẹ̀lú wọn ní ojú ara.
- source_word: ὑστερηθεὶς
  choice: tí mo sì ṣe aláìní
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ ẹni tí ohun ìní kò tó fún, pàápàá nípa àìní ohun ìgbésí ayé nínú àyíká yìí.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: èmi kò di ẹrù fún ẹnikẹ́ni
  rationale: Ó fi ìtumọ̀ àkànṣe ọ̀rọ̀ Gíríìkì hàn pé Pọ́ọ̀lù kò gbé àìní owó rẹ̀ lé ẹnikẹ́ni lórí, láì dín àwòrán ‘ẹrù’ náà kù.
- source_word: τὸ ὑστέρημά μου
  choice: ohun tí ó kù fún mi
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ohun tí kò pé tàbí ohun tí Pọ́ọ̀lù nílò.
- source_word: προσανεπλήρωσαν
  choice: pèsè
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé wọ́n mú ohun tí ó kù pé nípa pípèsè rẹ̀.
- source_word: οἱ ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Ó pa akọ púpọ̀ inú Gíríìkì mọ́; nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí àwọn alábàáṣiṣẹ́ pàtó láti Makedóníà.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: tí wọ́n ti Makedóníà wá
  rationale: Ó sọ participle náà di gbólóhùn ìbátan Yorùbá tó rọrùn, ó sì pa ibi tí wọ́n ti wá mọ́.
- source_word: ἐν παντί
  choice: Nínú ohun gbogbo
  rationale: Ó pa ìwọ̀n gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì fi ọ̀nà pàtó kan kún un.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: mo pa ara mi mọ́ láti má ṣe di ẹrù fún yín
  rationale: Ó tú gbolohun Gíríìkì tó ṣókí sí Yorùbá àdánidá, pẹ̀lú ìtumọ̀ pé kò fẹ́ fa ìnira, ní pàtàkì ìnira owó, fún wọn.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: mo pa ara mi mọ́ ... èmi yóò sì máa ṣe bẹ́ẹ̀
  rationale: Ó fi ìṣe tó ti wáyé àti ìpinnu láti tẹ̀ síwájú nínú rẹ̀ hàn ní kedere.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ akọ púpọ̀ ἀδελφοὶ
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ púpọ̀, ó sì ṣeé ṣe nínú àyíká yìí pé ó tọ́ka sí àwọn alábàáṣiṣẹ́ ọkùnrin pàtó. A kò sọ ọ́ di ọ̀rọ̀ àpapọ̀ nínú ẹsẹ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘di ẹrù’ láti pa àwòrán àti ìtumọ̀ ìnira owó mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
