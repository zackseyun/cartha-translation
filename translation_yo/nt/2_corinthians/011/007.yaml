id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: yo
  text: Àbí mo ṣe ẹ̀ṣẹ̀ nípa rírẹ̀ ara mi sílẹ̀ kí a lè gbé yín ga, nítorí pé mo kéde ìhìn rere Ọlọ́run fún yín láìgba owó?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἢ
  choice: Àbí
  rationale: Ó ń mú ìbéèrè àtakò mìíràn wọlé, ó sì pa ìmúná ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ἁμαρτίαν ἐποίησα
  choice: mo dá ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ṣe ẹ̀ṣẹ̀, ó sì pa ìtumọ̀ ìwà búburú inú Gíríìkì mọ́.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: nípa rírẹ ara mi sílẹ̀
  rationale: Ó pa ìṣe tí Pọ́ọ̀lù ṣe sí ara rẹ̀ àti ìyàtọ̀ rẹ̀ sí gbígbé àwọn ará Kọ́ríńtì ga mọ́.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: kí a lè gbé yín ga
  rationale: Ó fi gbólóhùn ète àti ìtumọ̀ ipò-ọlá inú ὑψόω hàn, láìfi dandan sọ ẹni tó gbé wọn ga.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tàbí ohun tó jẹ́ ìpìlẹ̀ fún ohun tí Pọ́ọ̀lù pè ní ẹ̀ṣẹ̀ lójú ìbéèrè.
- source_word: δωρεὰν
  choice: láìgba owó
  rationale: Ọ̀rọ̀ yìí ṣe kedere pé Pọ́ọ̀lù kò gba owó lọ́wọ́ wọn fún ìkéde náà; ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó sì bójú mu àyíká ọ̀rọ̀.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: ìhìn rere Ọlọ́run
  rationale: Ó pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láìyanju bóyá Ọlọ́run ni orísun tàbí kókó ìhìn rere náà.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: mo kéde ... fún yín
  rationale: “Kéde” fi ìtumọ̀ ìpolongo ìhìn rere hàn ní èdè Yorùbá òde òní, láìdín un kù sí ìwàásù nínú ìjọ nìkan.
theological_decisions:
- issue: Ìbéèrè ọ̀rọ̀ Pọ́ọ̀lù nípa ìrẹ̀lẹ̀ ara rẹ̀ àti àìgba owó
  choice: Pa á mọ́ gẹ́gẹ́ bí ìbéèrè aláwàdà-àtakò tó ń béèrè bóyá ìṣe rẹ̀ jẹ́ ẹ̀ṣẹ̀.
  alternative: Ṣàlàyé nínú ìtumọ̀ pé Pọ́ọ̀lù fi ẹ̀tọ́ àpọ́sítélì rẹ̀ sílẹ̀, tàbí pé owó iṣẹ́ ìránṣẹ́ kò tọ́.
  rationale: Gíríìkì kò ṣe ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ nípa owó iṣẹ́ ìránṣẹ́ níbí; ó gbé ìforígbárí náà kalẹ̀ nípasẹ̀ ìbéèrè tó ní ìfọ̀rọ̀yà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Rírẹ ara mi sílẹ̀” àti “gbé yín ga” pa ìyàtọ̀ taπεινόω/ὑψόω mọ́; “láìgba owó” mú àyíká ìtìlẹ́yìn owó ṣe kedere. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan nítorí àwọn àṣàyàn mìíràn tí a pèsè ní Gẹ̀ẹ́sì ti wà nínú ọ̀rọ̀ Yorùbá àdánidá.
