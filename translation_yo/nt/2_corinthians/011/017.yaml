language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: yo
  text: Ohun tí mo ń sọ yìí, kì í ṣe ní ìbámu pẹ̀lú ìlànà Olúwa[a] ni mo ń sọ ọ́, ṣùgbọ́n bí ẹni pé mo ń hùwà òmùgọ̀[b], nínú ìdánilójú yìí nínú ìṣògo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe gẹ́gẹ́ bí ohun tí ó wá láti ọ̀dọ̀ Olúwa,” tàbí, “kì í ṣe ní ìbámu pẹ̀lú ọ̀nà Olúwa.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ṣùgbọ́n bí ẹni pé mo wà nínú òmùgọ̀,” tàbí ní ọ̀nà tó rọrùn sí i, “ṣùgbọ́n bí òmùgọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ìdánilójú” tún lè túmọ̀ sí “ọ̀ràn,” “ìpìlẹ̀,” tàbí “ohun tí ẹni ń gbé ṣe” nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Ohun tí mò ń sọ yìí
  rationale: Ó fi ohun tí Paulu ń sọ lọ́wọ́lọ́wọ́ hàn ní èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀rọ̀ arọ́pò-orúkọ náà mọ́.
- source_word: κατὰ κύριον
  choice: gẹ́gẹ́ bí Olúwa
  rationale: 'Èyí pa ìṣòro ìtumọ̀ κατά mọ́: ó lè tọ́ka sí àṣẹ Olúwa, orísun láti ọ̀dọ̀ Olúwa, tàbí ìlànà àti ọ̀nà Olúwa, láìfipá yan ọ̀kan.'
- source_word: κύριον
  choice: Olúwa
  rationale: Nínú àyíká yìí, ó ṣeé ṣe jù pé ó ń tọ́ka sí Jésù Olúwa; kò pọn dandan láti fi orúkọ náà kún un.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: bí kò ṣe bí ẹni tí ó wà nínú ìwà òmùgọ̀
  rationale: Ó pa àfiwé ὡς àti èrò ‘nínú ìwà òmùgọ̀’ mọ́, láì sọ ní tààrà pé Paulu jẹ́ òmùgọ̀.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: pẹ̀lú ìgboyà yìí
  rationale: Nínú ọ̀rọ̀ ṣíṣe ògo yìí, ὑπόστασις lè túmọ̀ sí ìgboyà tàbí ìdánilójú; ‘pẹ̀lú ìgboyà yìí’ jẹ́ Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
- source_word: τῆς καυχήσεως
  choice: láti máa ṣògo
  rationale: Ó sọ agbára ọ̀rọ̀-ìṣe tí καύχησις ní jáde lọ́nà Yorùbá tí ó ṣe kedere, ó sì so ìgboyà náà mọ́ ṣíṣe ògo.
theological_decisions:
- issue: Ohun tí ‘κατὰ κύριον’ túmọ̀ sí àti bí ó ṣe ní í ṣe pẹ̀lú Olúwa
  choice: A pa á mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó lè túmọ̀ sí pé ọ̀nà ṣíṣe ògo yìí kò bá ọ̀nà tàbí ìlànà Olúwa mu.
  alternative: Ó lè túmọ̀ sí pé Paulu kò ń sọ ọ̀rọ̀ yìí gẹ́gẹ́ bí ohun tó wá láti ọ̀dọ̀ Olúwa tàbí gẹ́gẹ́ bí àṣẹ Olúwa.
  rationale: Gíríìkì kò yan ìtumọ̀ kan ṣoṣo ní pàtó. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìbéèrè nípa àṣẹ ọ̀rọ̀ Paulu tàbí ìmísí rẹ̀ ju bí ẹsẹ̀ náà ṣe sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo “mò ń” fún àsọyé àdánidá; a pa àfiwé àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ nípasẹ̀ àkọsílẹ̀ ìsàlẹ̀. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti yẹ.
