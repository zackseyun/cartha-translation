revisions:
- from: Bí mo tilẹ̀ jẹ́ ẹni tí kò jáfáfá nínú ọ̀rọ̀ sísọ[a], èmi kò ṣe aláìmọ̀; àní, ní gbogbo ọ̀nà, a ti fi èyí hàn kedere fún yín ní gbogbo ohun[b].
  to: Bí mo tilẹ̀ jẹ́ ẹni tí kò jáfáfá nínú ọ̀rọ̀ sísọ[a], èmi kì í ṣe aláìmọ̀; àní, ní gbogbo ọ̀nà, a ti fi èyí hàn kedere nínú ohun gbogbo fún yín[b].
  rationale: The revision is limited to idiomatic Standard Yoruba. It retains the source’s rhetorical-skill/knowledge contrast, the plural force of the final participle, and the ambiguity of the compressed final prepositional phrases. The footnote continues to document the viable personal and circumstantial readings without selecting one as certain.
