id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: yo
  text: Bí mo tilẹ̀ jẹ́ ẹni tí kò jáfáfá nínú ọ̀rọ̀ sísọ[a], èmi kì í ṣe aláìmọ̀; àní, ní gbogbo ọ̀nà, a ti fi èyí hàn kedere nínú ohun gbogbo fún yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí a kò kọ́ lẹ́kọ̀ọ́ nínú ọ̀rọ̀ sísọ,” ìyẹn ni pé, ẹni tí kò ní ọgbọ́n àsọyé dídán mọ́rán.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú gbólóhùn Gíríìkì tó há pọ̀ yìí sí, “ní gbogbo ọ̀nà, a ti fi èyí hàn kedere fún yín láàárín gbogbo ènìyàn,” tàbí, “ní gbogbo ọ̀nà àti ní gbogbo ipò, a ti fi èyí hàn kedere fún yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: ẹni tí kò jáfáfá nínú ọ̀rọ̀ sísọ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àìní ìdánilẹ́kọ̀ọ́ tàbí ìjáfáfá nínú ọgbọ́n àsọyé, kì í ṣe sí àìmọ̀ lápapọ̀. Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìyàtọ̀ tó wà láàárín ọ̀rọ̀ sísọ àti ìmọ̀ mọ́.
- source_word: γνώσει
  choice: aláìmọ̀
  rationale: Gíríìkì náà sọ ní ṣókí pé ‘kì í ṣe nínú ìmọ̀.’ Lílo ‘èmi kò ṣe aláìmọ̀’ mú ìtumọ̀ àtakò náà jáde ní Yorùbá láìfi èrò mìíràn kún un.
- source_word: φανερώσαντες
  choice: a ti fi èyí hàn kedere
  rationale: 'Participle náà ní agbára ẹ̀rí: ohun tí Pọ́ọ̀lù ń sọ ti hàn gbangba nípasẹ̀ ìbáṣepọ̀ wọn pẹ̀lú àwọn ará Kọ́ríńtì. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì bá iṣẹ́ ọ̀rọ̀ náà mu.'
- source_word: ἐν παντί
  choice: ní gbogbo ọ̀nà
  rationale: A gbà á gẹ́gẹ́ bí gbólóhùn adverbial tó ń fi bí ìfihàn náà ṣe péye hàn.
- source_word: ἐν πᾶσιν
  choice: ní gbogbo ohun
  rationale: Gbólóhùn Gíríìkì náà há pọ̀, ó sì lè tọ́ka sí ohun gbogbo, ipò gbogbo, tàbí gbogbo ènìyàn. Ọ̀rọ̀ àkọ́kọ́ pa ìtumọ̀ gbígbòòrò rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ àwọn ọ̀nà mìíràn tí a lè gbà á.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Níhìn-ín, εἰς ń tọ́ka sí àwọn ará Kọ́ríńtì gẹ́gẹ́ bí àwọn tí ìfihàn náà dé bá; ‘fún yín’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àyíká mu.
theological_decisions:
- issue: Ìtumọ̀ bí Pọ́ọ̀lù ṣe pe ara rẹ̀ ní ἰδιώτης nípa ọ̀rọ̀ sísọ
  choice: Ó gbà pé òun lè má ní ìjáfáfá tàbí ìdánilẹ́kọ̀ọ́ nínú ọgbọ́n àsọyé, ṣùgbọ́n kì í ṣe pé òun kò ní ìmọ̀.
  alternative: Ó ń sọ pé òun jẹ́ aláìmọ̀ lápapọ̀, tàbí pé ọ̀rọ̀ náà jẹ́ ẹ̀gàn lásán tí kò gbà àìpé kankan.
  rationale: Àtakò tó ṣe pẹ̀lú γνώσει àti àyíká tó ń sọ̀rọ̀ nípa àwọn olùkọ́ tó ń ṣe ìṣògo fi hàn pé irú ọ̀rọ̀ sísọ ni ó wà lọ́kàn, kì í ṣe àṣẹ tàbí òtítọ́ ẹ̀kọ́ rẹ̀.
- issue: Ìbáṣepọ̀ ἐν παντί àti ἐν πᾶσιν εἰς ὑμᾶς
  choice: 'A fi méjèèjì sílẹ̀ gẹ́gẹ́ bí ìtẹnumọ́ gbígbòòrò: ‘ní gbogbo ọ̀nà ... fún yín ní gbogbo ohun.’'
  alternative: ‘Ní gbogbo ọ̀nà ... láàárín gbogbo ènìyàn fún yín’ tàbí ‘ní gbogbo ipò.’
  rationale: Gíríìkì náà há pọ̀, kò sì sọ ní pàtó bóyá πᾶσιν jẹ́ akọ tàbí akọláìlẹ́mìí. Ìtumọ̀ àkọ́kọ́ kò gbọdọ̀ pinnu ohun tí orísun fi sílẹ̀ ní àìdájú; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ tó ṣeé ṣe mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye lójoojúmọ́. ‘Jáfáfá nínú ọ̀rọ̀ sísọ’ yà ìjáfáfá àsọyé sọ́tọ̀ kúrò nínú ìmọ̀ gidi. A kò lo ọ̀rọ̀ ẹ̀sìn àdámọ̀ tàbí yanju àìdájú inú gbólóhùn ìkẹyìn láìsí àlàyé.
