id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: yo
  text: nínú ìrìnàjò lọ́pọ̀ ìgbà, nínú ewu láti ọ̀dọ̀ àwọn odò, nínú ewu láti ọ̀dọ̀ àwọn ọlọ́ṣà, nínú ewu láti ọ̀dọ̀ àwọn ènìyàn ẹ̀yà mi[a], nínú ewu láti ọ̀dọ̀ àwọn tí kì í ṣe Júù, nínú ewu ní ìlú, nínú ewu ní aginjù, nínú ewu ní òkun, nínú ewu láàárín àwọn arákùnrin èké[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ènìyàn ìran mi” tàbí “àwọn ènìyàn orílẹ̀-èdè mi.” Ní tààràtà, Gíríìkì ní “láti ọ̀dọ̀ ẹ̀yà/ìran.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láàárín àwọn onígbàgbọ́ èké.” Ní tààràtà, Gíríìkì ní “láàárín àwọn arákùnrin èké.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: nínú ìrìnàjò lọ́pọ̀ ìgbà
  rationale: Èyí túmọ̀ sí ìrìnàjò tí ó máa ń ṣẹlẹ̀ léraléra, ó sì pa ọ̀nà tí Gíríìkì gbà bẹ̀rẹ̀ àtòjọ ìnira náà mọ́ ní Yorùbá àdánidá.
- source_word: κινδύνοις
  choice: nínú ewu
  rationale: A tún gbólóhùn yìí ṣe ní gbogbo àtòjọ náà láti pa ìlù ọ̀rọ̀ àti bí àwọn ewu ṣe ń kójọ pọ̀ mọ́.
- source_word: ποταμῶν
  choice: láti ọ̀dọ̀ àwọn odò
  rationale: Ọ̀rọ̀ náà sọ orísun ewu, ṣùgbọ́n kò sọ bóyá ìkún omi, líla odò, tàbí ohun mìíràn ni; ìtumọ̀ yìí pa àìsọ pàtó náà mọ́.
- source_word: λῃστῶν
  choice: láti ọ̀dọ̀ àwọn ọlọ́ṣà
  rationale: “Àwọn ọlọ́ṣà” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn afipámuni tàbí àwọn olè ojú ọ̀nà nínú àyíká ìrìnàjò.
- source_word: ἐκ γένους
  choice: láti ọ̀dọ̀ àwọn ènìyàn ẹ̀yà mi
  rationale: γένος tọ́ka sí àwọn ènìyàn ìran tàbí ẹ̀yà Pọ́ọ̀lù fúnra rẹ̀. “Àwọn ènìyàn ẹ̀yà mi” mú ìbátan ẹ̀yà náà hàn láìfi “àwọn Júù” kún ọ̀rọ̀ Gíríìkì ní tààràtà.
- source_word: ἐξ ἐθνῶν
  choice: láti ọ̀dọ̀ àwọn tí kì í ṣe Júù
  rationale: Nínú ìyàtọ̀ rẹ̀ sí ẹ̀yà Pọ́ọ̀lù, ἔθνη túmọ̀ sí àwọn ènìyàn tí kì í ṣe Júù. Ọ̀rọ̀ yìí ṣe kedere ní Yorùbá òde òní, kò sì lo orúkọ tí ó lè ní ìtumọ̀ ẹ̀gàn.
- source_word: ἐν πόλει
  choice: ní ìlú
  rationale: Ó pa ẹyọ ọ̀rọ̀ Gíríìkì àti ìtumọ̀ gbogbogbò rẹ̀ mọ́, ó sì bá Yorùbá mu.
- source_word: ἐν ἐρημίᾳ
  choice: ní aginjù
  rationale: “Aginjù” lè tọ́ka sí ilẹ̀ aṣálẹ̀ tàbí ibi tí kò sí ènìyàn, ó sì bá ìyàtọ̀ láàárín ìlú, aginjù àti òkun mu.
- source_word: ἐν θαλάσσῃ
  choice: ní òkun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ewu tí ó ṣẹlẹ̀ níbi ìrìnàjò ojú omi.
- source_word: ἐν ψευδαδέλφοις
  choice: láàárín àwọn arákùnrin èké
  rationale: Èyí pa àwòrán gangan ti ψευδάδελφοι, “àwọn arákùnrin èké,” mọ́, ó sì tọ́ka sí àwọn tí wọ́n ń fi ara wọn hàn bí arákùnrin nínú ìgbàgbọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ψευδαδέλφοις nípa akọ tàbí abo
  choice: láàárín àwọn arákùnrin èké
  alternative: láàárín àwọn onígbàgbọ́ èké
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀, ó sì túmọ̀ ní tààràtà sí “àwọn arákùnrin èké.” A pa àwòrán àti akọ ọ̀rọ̀ orísun mọ́ dípò fífẹ̀ ìtumọ̀ rẹ̀ sí i.
- issue: Ìtumọ̀ ἐξ ἐθνῶν ní ìyàtọ̀ sí ἐκ γένους
  choice: láti ọ̀dọ̀ àwọn tí kì í ṣe Júù
  alternative: láti ọ̀dọ̀ àwọn orílẹ̀-èdè / àwọn Kèfèrí
  rationale: Ìyàtọ̀ sí àwọn ènìyàn ẹ̀yà Pọ́ọ̀lù fi hàn pé àwọn aláìní-Júù ni a ń sọ. Ìtumọ̀ yìí ṣe kedere láìfi ẹ̀kọ́ ìsìn kan kún un tàbí lo ọ̀rọ̀ tí ó lè dun bí ẹ̀gàn.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó lọ́wọ́lọ́wọ́, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àtúnsọ “nínú ewu” pa ìlù àtòjọ Gíríìkì mọ́. A gbe àmì àlàyé [a] sí “àwọn ènìyàn ẹ̀yà mi,” ibi tí àlàyé rẹ̀ jẹ mọ́, dípò lẹ́yìn “ìrìnàjò.”
