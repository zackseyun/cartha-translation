reference: 2 Corinthians 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: yo
  text: 'Ṣé ìránṣẹ́ Mèsáyà[a] ni wọ́n? Bí ẹni tí orí rẹ̀ dàrú ni mo ṣe ń sọ̀rọ̀: èmi tilẹ̀ ju wọ́n lọ—mo ṣe iṣẹ́ àṣekára púpọ̀ ju wọ́n lọ, a fi mí sẹ́wọ̀n ní ọ̀pọ̀ ìgbà ju wọ́n lọ, a lù mí kọjá ìwọ̀n, mo sì dojú kọ ikú ní ọ̀pọ̀ ìgbà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Kristi”: “Ṣé ìránṣẹ́ Kristi ni wọ́n?”'
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “nínú àwọn ikú ní ọ̀pọ̀ ìgbà”; ó ṣeé ṣe kí èyí túmọ̀ sí pé ó bọ́ lọ́wọ́ ikú tàbí pé ó dojú kọ ewu ikú léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: ìránṣẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tí ń sìn tàbí ṣiṣẹ́ fún ẹlòmíràn; “ìránṣẹ́” ṣe kedere, kò sì fi ipò ṣọ́ọ̀ṣì kan lé ọ̀rọ̀ náà lórí.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, “Mèsáyà,” kì í ṣe bí orúkọ lásán. “Kristi” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
- source_word: παραφρονῶν λαλῶ
  choice: Bí ẹni tí orí rẹ̀ dàrú ni mo ṣe ń sọ̀rọ̀
  rationale: Ó pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́ pé ohun tí ó ń sọ lè dà bí ọ̀rọ̀ ẹni tí ìrònú rẹ̀ kò dúró ṣinṣin, láìsọ pé ó ya wèrè ní ti gidi.
- source_word: ὑπὲρ ἐγώ
  choice: èmi tilẹ̀ ju wọ́n lọ
  rationale: Ó mú gbólóhùn Gíríìkì tí a gé kúrú yé ni Yorùbá, ó sì pa agbára ìfiwéra rẹ̀ mọ́.
- source_word: ἐν κόποις περισσοτέρως
  choice: mo ṣe iṣẹ́ àṣekára púpọ̀ ju wọ́n lọ
  rationale: “Iṣẹ́ àṣekára” sọ κόπος ní èdè Yorùbá àdánidá, ìfiwéra “ju wọ́n lọ” sì ṣàfihàn περισσοτέρως.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: mo wà lẹ́wọ̀n ní ọ̀pọ̀ ìgbà ju wọ́n lọ
  rationale: Ẹ̀yà ọ̀rọ̀ náà ń tọ́ka sí ìfisẹ́wọ̀n léraléra; àyípadà sí gbólóhùn-ìṣe mú un ṣe kedere ní Yorùbá.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: wọ́n lù mí ní ìgbà àìlóǹkà
  rationale: Ó fi lílù ara hàn, ó sì pa ìtẹnumọ́ pé ó kọjá ohun tí a lè ka tàbí díwọ̀n mọ́.
- source_word: ἐν θανάτοις πολλάκις
  choice: mo sì dojú kọ ikú ní ọ̀pọ̀ ìgbà
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ọ̀pọ̀ “ikú” tí Gíríìkì lò lọ́nà tó ṣàrà ọ̀tọ̀, ó sì túmọ̀ sí wíwà nínú ewu ikú léraléra. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, “Mèsáyà” fi ìtumọ̀ rẹ̀ hàn kedere; “Kristi” jẹ́ àṣàyàn ìbílẹ̀ tí a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- issue: Bí a ṣe máa sọ ọ̀pọ̀ θανάτοις
  choice: dojú kọ ikú ní ọ̀pọ̀ ìgbà
  alternative: nínú àwọn ikú ní ọ̀pọ̀ ìgbà
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá tó ṣeé lóye, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ọ̀pọ̀-orúkọ tó ṣàrà ọ̀tọ̀ nínú Gíríìkì má bàa sọnù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A yí àwọn gbólóhùn-orúkọ Gíríìkì padà sí gbólóhùn-ìṣe níbi tí Yorùbá ti nílò rẹ̀, láìsọ agbára ìfiwéra àti ìtẹnumọ́ di aláìlágbára. Àwọn àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
