review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìfọwọ́sowọ́pọ̀ àti ìtòlẹ́sẹẹsẹ ẹ̀rí Pọ́ọ̀lù dáadáa: ìránṣẹ́ Mèsáyà, ìsọ̀rọ̀ bí ẹni tí orí rẹ̀ dàrú, ìfiwéra náà, iṣẹ́ àṣekára, ìfisẹ́wọ̀n, ìlù, àti ewu ikú léraléra. Síbẹ̀, “ní ìgbà àìlóǹkà” yí ὑπερβαλλόντως (‘kọjá ìwọ̀n’) padà sí iye ìṣẹ̀lẹ̀ tí a kò lè kà. A nílò ìtumọ̀ tó ń sọ ìwọ̀n/ìfaragba tí ó pọ̀ ju lọ, kì í ṣe iye lílù.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa, ó sì rọrùn láti lóye. “A fi mí sẹ́wọ̀n ... ju wọ́n lọ” dára díẹ̀ ju “mo wà lẹ́wọ̀n” lọ nítorí ó ń sọ ìrírí ìfisẹ́wọ̀n, kì í ṣe ipò ibùgbé lasán. “A lù mí kọjá ìwọ̀n” jẹ́ ìtumọ̀ tó kúnrẹ́rẹ́, tí ó sì jẹ́ àdánidá ní àyíká ìforígbẹ̀yà yìí.
  terminology: “Ìránṣẹ́” bá διάκονοι mu dáadáa, “Mèsáyà” ń tú oyè Χριστοῦ hàn, àlàyé “Kristi” sì tọ́. “Dojú kọ ikú ní ọ̀pọ̀ ìgbà” jẹ́ ìfọ̀rọ̀wérọ̀ Yorùbá tó dára fún ἐν θανάτοις πολλάκις; àlàyé ìsàlẹ̀ ń pa ọ̀pọ̀-orúkọ Gíríìkì àti ìmọ̀lára ewu ikú mọ́.
