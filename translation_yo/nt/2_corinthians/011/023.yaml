  to: 'Ṣé ìránṣẹ́ Mèsáyà[a] ni wọ́n? Bí ẹni tí orí rẹ̀ dàrú ni mo ṣe ń sọ̀rọ̀: èmi tilẹ̀ ju wọ́n lọ—mo ṣe iṣẹ́ àṣekára púpọ̀ ju wọ́n lọ, a fi mí sẹ́wọ̀n ní ọ̀pọ̀ ìgbà ju wọ́n lọ, a lù mí kọjá ìwọ̀n, mo sì dojú kọ ikú ní ọ̀pọ̀ ìgbà[b].'
  rationale: A tún ọ̀rọ̀ nípa ìlù ṣe sí “a lù mí kọjá ìwọ̀n” láti pa agbára ὑπερβαλλόντως mọ́ gẹ́gẹ́ bí ohun tó kọjá ìwọ̀n, láìfi iye ìgbà tí a lù un sí i. A tún lo “a fi mí sẹ́wọ̀n” láti mú ìrírí ìfisẹ́wọ̀n tí ọ̀pọ̀ φυλακαῖς ń sọ hàn kedere. Àwọn ìyókù ni a fi sílẹ̀ nítorí wọ́n jẹ́ olóòtítọ́ sí èdè ìpilẹ̀ àti Yorùbá àdánidá.
