id: 2CO.11.27
reference: 2 Corinthians 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: yo
  text: nínú iṣẹ́ àṣekára àti ìnira, nínú àìsùn léraléra, nínú ebi àti òǹgbẹ, nínú ààwẹ̀ léraléra[a], nínú òtútù àti àìní aṣọ tó tó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú àìjẹun léraléra.” Ọ̀rọ̀ Giriki náà lè tọ́ka sí ààwẹ̀ tí ó ṣẹlẹ̀ léraléra; ẹsẹ̀ náà kò sọ bóyá ààwẹ̀ àtinúwá ni tàbí àìjẹun tí ipò mú wá.
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ gangan, “ìhòòhò.” Nínú àyíká yìí, ó lè tọ́ka sí àìní aṣọ tó tó àti ìfarahàn sí ojú òtútù.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: iṣẹ́ àṣekára
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí iṣẹ́ tó gba okun àti ìsapá púpọ̀; “iṣẹ́ àṣekára” jẹ́ èdè Yorùbá adayébá tó pa ìtumọ̀ yìí mọ́.
- source_word: μόχθῳ
  choice: ìnira
  rationale: Ó fi ìpọ́njú tàbí ìṣòro tó bá iṣẹ́ àṣekára rìn hàn. “Ìnira” jẹ́ kí a má ṣe da àwọn ọ̀rọ̀ méjèèjì pọ̀ sí ìtumọ̀ kan náà.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: ní ọ̀pọ̀lọpọ̀ ìgbà àìsùn
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí jíjí tàbí àìsùn tó ṣẹlẹ̀ léraléra; gbolohun yìí ṣe kedere láì fi kun pé gbogbo rẹ̀ jẹ́ ìṣọ́ alẹ́.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: nínú ebi àti òǹgbẹ
  rationale: Àwọn ọ̀rọ̀ méjèèjì ṣàpèjúwe ipò àìní oúnjẹ àti omi tí a fara dà, wọ́n sì pa ìtòlẹ́sẹẹsẹ Giriki mọ́.
- source_word: ἐν νηστείαις πολλάκις
  choice: nínú àìjẹun lọ́pọ̀ ìgbà
  rationale: “Àìjẹun” lè ṣàpèjúwe àwọn àsìkò tí ènìyàn kò jẹun láì pinnu bóyá ó jẹ́ ààwẹ̀ àtinúwá tàbí àìní oúnjẹ tí ipò mú wá; ó sì yàtọ̀ sí “ebi” tó ṣáájú rẹ̀.
- source_word: ἐν ψύχει
  choice: nínú òtútù
  rationale: Ó ṣàpèjúwe òtútù gẹ́gẹ́ bí ipò ìnira tí Pọ́ọ̀lù fara dà.
- source_word: γυμνότητι
  choice: àìní aṣọ tó tó
  rationale: Nínú àkójọ ìpọ́njú yìí, ọ̀rọ̀ náà lè túmọ̀ sí àìní aṣọ tó dáàbò bo ara, kì í ṣe ìhòòhò pátápátá nìkan. Àṣàyàn yìí bá èdè Yorùbá òde òní mu, a sì fi ìtumọ̀ gangan sí àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ νηστείαις nínú àkójọ ìpọ́njú Pọ́ọ̀lù
  choice: àìjẹun lọ́pọ̀ ìgbà
  alternative: ààwẹ̀ lọ́pọ̀ ìgbà; àìní oúnjẹ tí ipò mú wá
  rationale: Ọ̀rọ̀ Giriki lè tọ́ka sí ààwẹ̀ léraléra, ṣùgbọ́n ẹsẹ̀ náà kò sọ bóyá ó jẹ́ ohun tí Pọ́ọ̀lù fúnra rẹ̀ yàn tàbí ohun tí ipò fi lé e lórí. “Àìjẹun” àti àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
- issue: Ìtumọ̀ γυμνότητι nínú àkójọ ìpọ́njú
  choice: àìní aṣọ tó tó
  alternative: ìhòòhò
  rationale: Nínú àyíká ọ̀rọ̀ òtútù àti ìpọ́njú, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí aṣọ tí kò tó láti dáàbò bo ara. A kò fi dandan mú un túmọ̀ sí ìhòòhò pátápátá, ṣùgbọ́n a pa ìtumọ̀ yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, èdè ọ̀wọ̀ àti èdè òde òní tó ṣeé lóye. A tún lo “nínú” léraléra láti fi ìró àkójọ Giriki hàn, ṣùgbọ́n a yàgò fún gbólóhùn líle tàbí èdè ẹ̀sìn tó lè pinnu ohun tí orísun kò pinnu.
