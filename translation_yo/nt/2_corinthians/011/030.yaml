  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: yo
  text: Bí mo bá ní láti ṣògo, nínú àwọn ohun tí ó ní í ṣe pẹ̀lú àìlera mi ni èmi yóò ṣògo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó rọrùn sí i: “Èmi yóò ṣògo nípa àwọn àìlera mi.” Ní ti gidi, èdè Gíríìkì sọ pé, “Èmi yóò ṣògo nínú àwọn ohun tí ó ní í ṣe pẹ̀lú àìlera mi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Bí
  rationale: Ó pa ìrísí gbólóhùn onípò Gíríìkì mọ́ láì yí i sí ‘níwọ̀n bí’ tí yóò mú ìtumọ̀ ohun tó fà á wọlé.
- source_word: καυχᾶσθαι
  choice: máa ṣògo
  rationale: ‘Ṣògo’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ohun tí ẹni ṣe tàbí jẹ́ yangàn; nínú àyíká yìí ó tún lè gbé ìfọ̀rọ̀yà ẹlẹ́yà ti Pọ́ọ̀lù.
- source_word: δεῖ
  choice: ní láti
  rationale: Ó sọ ìdandan tàbí ohun tí ipò ń béèrè ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: àwọn ohun tí ó fi àìlera mi hàn
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀ nǹkan tí τὰ ń tọ́ka sí mọ́, ó sì sọ ìbáṣepọ̀ genitive náà ní Yorùbá àdánidá láì sọ ọ́ di ‘àwọn àìlera mi’ nìkan.
- source_word: ἀσθενείας
  choice: àìlera
  rationale: ‘Àìlera’ lè tọ́ka sí ailágbára tàbí ipò ìrẹ̀wẹ̀sì, kì í sì í fi dandan mọ́ àìsàn ara.
- source_word: καυχήσομαι
  choice: èmi yóò máa ṣògo
  rationale: Ó pa ọjọ́ iwájú àti àtúnsọ ọ̀rọ̀-ìṣe tó wà nínú Gíríìkì mọ́; ‘èmi’ fi ìtẹnumọ́ kún un ní Yorùbá.
theological_decisions:
- issue: Irú ìṣògo tí Pọ́ọ̀lù ń sọ
  choice: A sọ ọ́ gẹ́gẹ́ bí ìṣògo tó dá lórí àwọn ohun tí ń fi àìlera rẹ̀ hàn, ní pípa ìtakora àti ìfọ̀rọ̀yà ẹlẹ́yà rẹ̀ mọ́.
  alternative: ‘Èmi yóò máa ṣògo nípa àwọn àìlera mi.’
  rationale: Gíríìkì sọ ní ti gidi pé ‘àwọn ohun ti àìlera mi’; kí a má bàa yanjú ìtakora ẹ̀kọ́ ìgbàgbọ́ náà sínú àlàyé, ọ̀rọ̀ inú ẹsẹ náà jẹ́ kó dúró lórí àwọn ohun tí ń fi àìlera hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tó yẹ; ‘máa ṣògo’ jẹ́ àdánidá, ‘àìlera’ sì pa ìtumọ̀ ailágbára tó gbòòrò mọ́.
