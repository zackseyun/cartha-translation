source:
  edition: SBLGNT
  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: yo
  text: Ìbá ṣe pé ẹ faradà mí nínú ìwà òmùgọ̀ díẹ̀[a]. Ṣùgbọ́n, ní tòótọ́, ẹ faradà mí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìwà àìgbọ́n díẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ fi sùúrù bá mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: Ìbá ṣe pé
  rationale: Ó fi ìfẹ́ tàbí àdúrà tí kò dájú hàn ní ọ̀nà Yorùbá tó bójú mu, láìlo ọ̀rọ̀ àtijọ́.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: ẹ lè fara dà á / ẹ fara dà á pẹ̀lú mi
  rationale: Fára dà á mú èrò fífarada ẹni tàbí ohun tí ẹni náà ń ṣe jáde; àtúnlò rẹ̀ pa àtúnrọ̀ Pọ́ọ̀lù mọ́.
- source_word: μου
  choice: bí mo ṣe ń ṣe / pẹ̀lú mi
  rationale: 'A tú ìbáṣepọ̀ gírámà Gíríìkì náà sí Yorùbá àdánidá: ìwà òmùgọ̀ náà jẹ́ ti Pọ́ọ̀lù, ìbéèrè náà sì ni kí wọn fara dà á pẹ̀lú rẹ̀.'
- source_word: μικρόν τι
  choice: díẹ̀
  rationale: Ó ṣàfihàn ìwọ̀nba kékeré àti ìrẹ̀lẹ̀ ọ̀rọ̀ Pọ́ọ̀lù ní ṣókí.
- source_word: ἀφροσύνης
  choice: ìwà òmùgọ̀
  rationale: Ó pa ìtumọ̀ ìwà àìgbọ́n tàbí òmùgọ̀ mọ́, ó sì bá àyíká ọ̀rọ̀ ìṣogo oníyọ̀ọ́nú mu.
- source_word: ἀλλὰ καὶ
  choice: Ṣùgbọ́n, ní tòótọ́
  rationale: Ó mú ìyípadà àti ìtẹnumọ́ tó wà nínú gbólóhùn Gíríìkì náà jáde láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Pọ́ọ̀lù pè ohun tó fẹ́ sọ ní ἀφροσύνη
  choice: A pa á mọ́ gẹ́gẹ́ bí “ìwà òmùgọ̀,” ìrẹ̀lẹ̀ ara ẹni tó ní ẹ̀gàn inú.
  alternative: ìwà àìgbọ́n díẹ̀; ọ̀rọ̀ asán díẹ̀
  rationale: Ẹsẹ̀ yìí bẹ̀rẹ̀ apá tí Pọ́ọ̀lù ti ń ṣogo lọ́nà ẹ̀gàn inú. Kí a má ṣe tú ìforígbárí ọ̀rọ̀ náà ká tàbí sọ ọ́ di ẹ̀kọ́ ẹ̀sìn kan pàtó, a pa ọ̀rọ̀ líle náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì pa ìbéèrè oníyọ̀ọ́nú àti àtúnrọ̀ Pọ́ọ̀lù mọ́.
