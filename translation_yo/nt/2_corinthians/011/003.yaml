id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n mo bẹ̀rù pé bóyá, gẹ́gẹ́ bí ejò ti fi àrékérekè rẹ̀ tan Éfà jẹ, kí a má bàa ba èrò inú yín jẹ́, kí a sì mú un kúrò nínú ìwà òtítọ́ àti ìwà mímọ́ sí Mèsáyà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìwà òtítọ́” tún lè túmọ̀ sí “ìrọ̀rùn,” “òdodo inú,” tàbí “ìfọkànsìn aláìpín” sí Mèsáyà.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan kò ní ọ̀rọ̀ náà “àti ìwà mímọ́.”
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Ṣùgbọ́n mo bẹ̀rù pé, lọ́nà kan
  rationale: Ó fi àníyàn tí Pọ́ọ̀lù ń ní hàn, ó sì mú μή πως jáde ní Yorùbá àdánidá láì sọ ìdánilójú pé ohun náà ti ṣẹlẹ̀.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: bí ejò ti ... tan Éfà jẹ
  rationale: “Ejò” pa ìtọ́kasí sí ìtàn Gẹnẹ́sisi mọ́; “tan ... jẹ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìtànjẹ.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: fi àrékérekè rẹ̀
  rationale: Àrékérekè túmọ̀ sí ọgbọ́n ẹ̀tàn, “fi” sì fi ipa ọ̀nà tàbí ohun èlò tí ἐν ń ní níbí hàn.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: a lè ba èrò inú yín jẹ́
  rationale: Ó pa ohùn àìṣe àti ṣíṣeéṣe ti subjunctive mọ́; “èrò inú” lè bo èrò àti ìrònú tí νόημα ń tọ́ka sí.
- source_word: ἀπὸ τῆς ἁπλότητος
  choice: kí ó sì yí kúrò nínú òtítọ́ inú kan ṣoṣo
  rationale: Ìtumọ̀ náà so ìbàjẹ́ mọ́ yíyapa kúrò; “òtítọ́ inú kan ṣoṣo” mú ìfọkànsìn aláìpín àti òdodo inú ti ἁπλότης hàn, láì dín un kù sí àìní ọgbọ́n.
- source_word: καὶ τῆς ἁγνότητος
  choice: àti ìwà mímọ́
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ìwà pípé, mímọ́, tí ἁγνότης ní mọ́, láì fi mọ́ ọ̀rọ̀ ìbálòpọ̀ nìkan.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: sí Mèsáyà
  rationale: Gbólóhùn náà ń ṣàpèjúwe ìdarí òtítọ́ inú àti ìwà mímọ́ sí ẹni náà; Χριστός ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà “Mèsáyà” ni a lò.
theological_decisions:
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ní agbára oyè ní àyíká yìí; “Mèsáyà” túmọ̀ oyè náà dípò fífi í sílẹ̀ bí orúkọ.
- issue: Ìtumọ̀ ἁπλότης
  choice: òtítọ́ inú kan ṣoṣo
  alternative: ìrọ̀rùn; òdodo inú; ìfọkànsìn aláìpín
  rationale: Àyíká ń sọ nípa ìdúróṣinṣin aláìpín sí Mèsáyà. Àṣàyàn yìí pa òdodo àti ọkàn kan mọ́, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́.
- issue: Wíwà καὶ τῆς ἁγνότητος nínú ẹsẹ
  choice: Fi “àti ìwà mímọ́” sínú ọ̀rọ̀ pàtàkì
  alternative: Má fi sí i
  rationale: SBLGNT fi gbólóhùn náà sínú ọ̀rọ̀ rẹ̀; síbẹ̀, àwọn àfọwọ́kọ kan kò ní i, nítorí náà a ṣàkọsílẹ̀ ìyàtọ̀ náà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye lójoojúmọ́. A lo “bẹ́ẹ̀ ni” láti mú ìfiwéra gígùn náà mọ́ra ní Yorùbá, a sì pa àníyàn àti ṣíṣeéṣe inú Gíríìkì mọ́. Gbogbo àmì àlàyé ìsàlẹ̀ wà nínú ọ̀rọ̀ pàtàkì.
