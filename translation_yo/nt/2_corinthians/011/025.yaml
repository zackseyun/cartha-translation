  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtúnwí ọ̀rọ̀ Gíríìkì dáadáa: ìgbà mẹ́ta, ẹ̀ẹ̀kan, àti ìgbà mẹ́ta; ìlù pẹ̀lú ọ̀pá, sísọ ní òkúta, ìjàmbá ọkọ̀ ojú omi, àti àkókò òru àti ọ̀sán. Àtúnṣe kékeré náà mú βυθός hàn ní pàtó gẹ́gẹ́ bí ibú òkun, dípò “ibú omi,” tí ó lè túmọ̀ sí ibú omi èyíkéyìí. “Mo ti lo” sì ń sọ ipa àbájáde perfect πεποίηκα di mímọ̀ ní Yorùbá.'
