  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: yo
  text: Ẹ̀ẹ̀mẹ́ta ni wọ́n fi ọ̀pá nà mí, ẹ̀ẹ̀kan ni wọ́n sọ mí ní òkúta, ẹ̀ẹ̀mẹ́ta ni mo ní ìjàmbá ọkọ̀ ojú omi; mo ti lo òru kan àti ọ̀sán kan nínú ibú òkun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú òkun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: ẹ̀ẹ̀mẹ́ta
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ṣẹlẹ̀ ní ìgbà mẹ́ta; a sì lò ó bákan náà ní ibi méjèèjì nínú ẹsẹ yìí.
- source_word: ἐραβδίσθην
  choice: wọ́n fi ọ̀pá nà mí
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí lílu ènìyàn pẹ̀lú ọ̀pá ní pàtó; gbolohun yìí pa irinṣẹ́ ìlù náà mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἅπαξ
  choice: ẹ̀ẹ̀kan
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá fún ohun tó ṣẹlẹ̀ ní ìgbà kan ṣoṣo.
- source_word: ἐλιθάσθην
  choice: wọ́n sọ mí ní òkúta
  rationale: Ó sọ ìṣe lílu ẹni pẹ̀lú òkúta ní kedere láìfi ìtumọ̀ àfikún sí i.
- source_word: ἐναυάγησα
  choice: mo ní ìjàmbá ọkọ̀ ojú omi
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí jíjìyà tàbí níní ìjàmbá ọkọ̀ ojú omi; yíyan yìí jẹ́ kedere, ó sì yẹra fún sísọ pé ọkọ̀ náà rì pátápátá ní gbogbo ìgbà.
- source_word: νυχθήμερον
  choice: òru kan àti ọ̀sán kan
  rationale: Ó pa ìtẹ̀lé òru àti ọ̀sán inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, láìsọ ọ́ di wákàtí mẹ́rìnlélógún lọ́nà tó le ju ẹ̀rí ọ̀rọ̀ náà lọ.
- source_word: ἐν τῷ βυθῷ
  choice: nínú ibú omi
  rationale: βυθός lè tọ́ka sí ibú omi tàbí sí ojú òkun; ọ̀rọ̀ inú ẹsẹ náà pa àwòrán ibú omi mọ́, a sì fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀.
- source_word: πεποίηκα
  choice: mo lo
  rationale: Pẹ̀lú gbólóhùn àsìkò, ποιέω lè túmọ̀ sí lílo tàbí líla àkókò kọjá; “mo lo” jẹ́ Yorùbá òde òní tó rọrùn, tó sì dá agbára ìrántí ìṣe tó ti ṣẹlẹ̀ dúró.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A gbe àmì àlàyé [a] sí lẹ́yìn “ibú omi,” ibi tí àṣàyàn lexical βυθός ti kan ní tòótọ́.
