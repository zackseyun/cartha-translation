  to: Ẹ̀ẹ̀mẹ́ta ni wọ́n fi ọ̀pá nà mí, ẹ̀ẹ̀kan ni wọ́n sọ mí ní òkúta, ẹ̀ẹ̀mẹ́ta ni mo ní ìjàmbá ọkọ̀ ojú omi; mo ti lo òru kan àti ọ̀sán kan nínú ibú òkun[a].
  rationale: A ṣàtúnṣe “ibú omi” sí “ibú òkun” kí ó lè bá βυθός nínú àyíká ìjàmbá ọkọ̀ ojú omi mu dáadáa, a sì fi “ti” kún “mo lo” láti ṣàfihàn perfect Gíríìkì náà. Kò sí ìyípadà sí ìtumọ̀ tàbí sí àìdánilójú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
