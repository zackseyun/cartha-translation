  source_fidelity: 'Ìtumọ̀ náà gba àwọn eroja pàtàkì ti Gíríìkì náà mọ́: fífi Pọ́ọ̀lù sọ̀ kalẹ̀ (ohùn aláìṣe), apẹ̀rẹ̀, ojú fèrèsé, ògiri, àti bíbọ́ lọ́wọ́ ẹni náà. Ṣùgbọ́n ìtòlẹ́sẹẹsẹ náà, “gba ojú fèrèsé kan la inú ògiri náà kọjá,” kò rọrùn ní Yorùbá, ó sì lè mú kí ó dà bí ẹni pé ó wọ inú ògiri.'
