translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtumọ̀ náà pa àwòrán fífi Pọ́ọ̀lù sọ̀ kalẹ̀ nínú apẹ̀rẹ̀ àti yíyọ rẹ̀ kúrò lọ́wọ́ ẹni tó ń lé e mọ́.
