  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: yo
  text: Wọ́n sì sọ mí kalẹ̀ nínú apẹ̀rẹ̀ kan láti ojú fèrèsé kan nínú ògiri náà, mo sì bọ́ lọ́wọ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sọ mí kalẹ̀ láti ojú fèrèsé kan nínú ògiri náà nínú apẹ̀rẹ̀ tí a fi okùn hun.”
    reason: σαργάνη lè tọ́ka sí apẹ̀rẹ̀ tí a hun, pàápàá ti okùn.
lexical_decisions:
- source_word: θυρίδος
  choice: ojú fèrèsé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fèrèsé tàbí ihò kékeré kan. “Ojú fèrèsé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ibi tí a lè gba kọjá.
- source_word: σαργάνῃ
  choice: apẹ̀rẹ̀
  rationale: Ó túmọ̀ sí ohun èlò tí a hun, bóyá láti inú okùn tàbí ẹ̀ka igi. “Apẹ̀rẹ̀” ṣe kedere ní Yorùbá òde òní, a sì fi ìtumọ̀ tó ṣe pàtó sí i sínú àlàyé ìsàlẹ̀.
- source_word: ἐχαλάσθην
  choice: wọ́n sọ mí kalẹ̀
  rationale: Ìṣe aláìṣe náà túmọ̀ sí pé àwọn ẹlòmíràn sọ Pọ́ọ̀lù kalẹ̀. Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ohùn aláìṣe ti orísun mọ́ ní ìtumọ̀.
- source_word: διὰ τοῦ τείχους
  choice: la inú ògiri náà kọjá
  rationale: Gbólóhùn náà fi hàn pé ó gba ojú ọ̀nà kan nínú ògiri kọjá, kì í ṣe pé ó kan lọ lẹ́gbẹ̀ẹ́ ògiri. A kò fi “ìlú” kún un nítorí kò sí ní pàtó nínú Gíríìkì.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: mo sì bọ́ lọ́wọ́ rẹ̀
  rationale: “Bọ́ lọ́wọ́ rẹ̀” jẹ́ àṣà-ọ̀rọ̀ Yorùbá tó bá àwòrán Gíríìkì mu, ó sì túmọ̀ sí yíyọ kúrò lábẹ́ ìkáwọ́ tàbí agbára ẹni náà.
