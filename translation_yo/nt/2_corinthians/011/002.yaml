revisions:
- from: Nítorí mo ń jowú sí yín pẹ̀lú owú Ọlọ́run[a], nítorí pé mo ti sọ yín di àfẹ́sọ́nà fún ọkọ kan ṣoṣo, kí n lè mú yín wá fún Mèsáyà[b] bí wúńdíá tí ó mọ́.
  to: Nítorí mo fi owú Ọlọ́run jowú fún yín[a], nítorí mo ti ṣèlérí yín fún ọkọ kan ṣoṣo, kí n lè fi yín hàn níwájú Mèsáyà[b] gẹ́gẹ́ bí wúńdíá mímọ́.
  rationale: Àtúnṣe náà yọ ìdààmú tí ‘jowú sí’ lè fa kúrò, ó sì rọ́pò ọ̀rọ̀ fún ìlérí ìgbéyàwó àti ìfihàn níwájú ọkọ ìyàwó tí ó bá ìtumọ̀ àti ìkọ́ Gíríìkì mu dáadáa. A pa ìfarahàn àpapọ̀-ìjọ tí ó wà nínú ọ̀rọ̀-orúkọ púpọ̀ ‘yín’ àti àwòrán ‘wúńdíá’ alákọ̀ọ́kan mọ́, láì túmọ̀ ìmúlò àkàwé náà ju bí ó ti wà lọ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: owú Ọlọ́run, ìlérí ìgbéyàwó sí ọkọ kan, àti fífi ìjọ náà hàn fún Mèsáyà gẹ́gẹ́ bí wúńdíá mímọ́. Síbẹ̀, ‘ń jowú sí yín’ lè dà bí ìlara sí àwọn olùgbọ́, dípò owú tó jẹ́ fún tàbí lórí wọn. ‘Mú yín wá fún’ kò fi ìtumọ̀ παραστῆσαι (‘fi hàn/fìdí ẹni múlẹ̀ níwájú’) hàn ní kedere tó.'
  naturalness: Àtúnṣe náà lo Yorùbá òde-òní tí ó ní iyì. ‘Mo fi owú Ọlọ́run jowú fún yín’ ṣàlàyé ìbáṣepọ̀ ọ̀rọ̀ náà ní ti ara, ‘ṣèlérí yín fún’ yẹ fún ìfẹ́sọ́nà, ‘fi yín hàn níwájú’ sì dára fún ìṣe ìfihàn tàbí ìgbékalẹ̀ tó wà nínú Gíríìkì.
  terminology: ‘Mèsáyà’ dáa gẹ́gẹ́ bí ìtumọ̀ oyè Χριστός nínú àyíká yìí. ‘Wúńdíá mímọ́’ pa àwòrán παρθένον ἁγνήν mọ́ dáadáa; ‘mímọ́’ níbí túmọ̀ sí ìwà mímọ́/pípé, kì í ṣe ìwẹ̀ lásán.
  issues:
  - severity: medium
    issue: ‘Mo ń jowú sí yín’ jẹ́ aláìdájú ní Yorùbá.
    rationale: Ìṣọ̀kan ‘jowú sí’ lè túmọ̀ sí ìlara ẹni kan. Gíríìkì ζηλῶ ὑμᾶς nínú àkàwé ìgbéyàwó ń sọ owú ààbò fún wọn; ‘jowú fún yín’ ń pa ìtumọ̀ náà mọ́ dáadáa.
  - severity: medium
    issue: ‘Kí n lè mú yín wá fún Mèsáyà’ kò péye fún παραστῆσαι.
    rationale: παραστῆσαι ní ìtumọ̀ fífi ẹni hàn tàbí mú un dúró níwájú ẹlòmíràn. ‘Kí n lè fi yín hàn níwájú Mèsáyà’ jẹ́ kedere síi, ó sì pa àwòrán ìyàwó náà mọ́.
  - severity: low
    issue: ‘Tí ó mọ́’ lè ní ìmọ̀ ‘mímọ́ nípa ìwẹ̀’ ju ìwà mímọ́ lọ.
    rationale: ‘Mímọ́’ jẹ́ ọ̀rọ̀ tó dára jù fún ἁγνήν nínú àyíká ìwà mímọ́ àti ìyàwó.
