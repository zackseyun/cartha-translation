id: 2CO.11.2
reference: 2 Corinthians 11:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: yo
  text: Nítorí mo fi owú Ọlọ́run jowú fún yín[a], nítorí mo ti ṣèlérí yín fún ọkọ kan ṣoṣo, kí n lè fi yín hàn níwájú Mèsáyà[b] gẹ́gẹ́ bí wúńdíá mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú owú tí ó bá ìwà Ọlọ́run mu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí owú tí í ṣe ti Ọlọ́run tàbí owú tí ó ní ìwà bí ti Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “níwájú Kristi.” Ní Gíríìkì: “níwájú Mèsáyà náà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλῶ
  choice: mo ń jowú sí yín
  rationale: Ó pa ìtumọ̀ owú tí ń dáàbò bo ìbáṣepọ̀ mọ́ nínú àkàwé ìgbéyàwó, láì sọ ọ́ di ìlara búburú tàbí ìtara lásán.
- source_word: θεοῦ ζήλῳ
  choice: pẹ̀lú owú Ọlọ́run
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìsọ̀rí oníṣẹ̀-genitive Gíríìkì ní tààrà, ó sì tún lè túmọ̀ sí owú tí í ṣe ti Ọlọ́run tàbí owú tí ó ní ìwà bí ti Ọlọ́run.
- source_word: ἡρμοσάμην
  choice: mo ti sọ yín di àfẹ́sọ́nà
  rationale: Ó fi ìlérí ìgbéyàwó hàn kedere, ó sì yẹ fún àkàwé ìyàwó àti ọkọ tó wà nínú ẹsẹ̀ náà.
- source_word: ἑνὶ ἀνδρὶ
  choice: fún ọkọ kan ṣoṣo
  rationale: Bí ἀνήρ tilẹ̀ lè túmọ̀ sí ọkùnrin, àyíká ìgbéyàwó mú kí ‘ọkọ’ jẹ́ ìtumọ̀ tó bá ọ̀rọ̀ mu jù.
- source_word: παρθένον
  choice: wúńdíá
  rationale: Ó pa àwòrán ọmọbìnrin tí kò tíì bá ọkùnrin lòpọ̀ àti àwòrán ìyàwó mọ́.
- source_word: ἁγνὴν
  choice: tí ó mọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìwà mímọ́ àti àìlábàwọ́n nínú àyíká yìí.
- source_word: παραστῆσαι
  choice: kí n lè mú yín wá fún
  rationale: Ó sọ ète fífi wọn hàn tàbí mú wọn dé iwájú ọkọ ìyàwó lọ́nà àdánidá ní Yorùbá.
- source_word: τῷ Χριστῷ
  choice: fún Mèsáyà
  rationale: Nínú àkàwé yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọkọ ìyàwó tí a yàn, nítorí náà ‘Mèsáyà’ pa agbára oyè náà mọ́.
theological_decisions:
- issue: Irú owú tí Pọ́ọ̀lù ní
  choice: Owú Pọ́ọ̀lù ní í ṣe pẹ̀lú owú Ọlọ́run tó ń dáàbò bo ìbáṣepọ̀ májẹ̀mú.
  alternative: Kí a túmọ̀ ọ́ sí ìtara Pọ́ọ̀lù lásán, láìsí ìtọ́ka pàtó sí owú Ọlọ́run.
  rationale: θεοῦ ζήλῳ àti àkàwé ìgbéyàwó ń tọ́ka sí ìfaramọ́ aláìpín nínú májẹ̀mú; lílo ‘owú’ pa ìnira ẹ̀kọ́ ìgbàgbọ́ náà mọ́ dípò fífẹ́ ẹ̀ sí ‘ìtara’ lásán.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ náà àti ipa ẹni náà gẹ́gẹ́ bí ọkọ ìyàwó tí a yàn mú kí oyè ‘Mèsáyà’ yẹ níbí; àṣàyàn ‘Kristi’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Àfẹ́sọ́nà,’ ‘ọkọ kan ṣoṣo,’ àti ‘wúńdíá tí ó mọ́’ pa gbogbo àkàwé ìgbéyàwó mọ́ ní èdè tí òǹkàwé lásán lè lóye.
