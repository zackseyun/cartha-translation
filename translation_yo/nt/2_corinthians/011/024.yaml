translation:
  language: yo
  text: Mo gba ìgbẹ́ ogójì dín ọ̀kan lọ́wọ́ àwọn Júù ní ìgbà márùn-ún.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, ‘ogójì dín ọ̀kan’; ìyẹn ni, ìgbẹ́ mọ́kàndínlógójì.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘nípasẹ̀ àwọn Júù.’ Ọ̀rọ̀ Gíríìkì náà fi àwọn Júù hàn gẹ́gẹ́ bí olùṣe tàbí orísun ìjìyà náà, ṣùgbọ́n kò sọ pé ìgbìmọ̀ aláṣẹ pàtó kan ni.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: lọ́wọ́ àwọn Júù
  rationale: Ọ̀rọ̀ yìí fi àwọn Júù hàn gẹ́gẹ́ bí orísun tàbí aṣojú ìjìyà náà, láì fi kún un pé ẹgbẹ́ aláṣẹ pàtó kan ni. ‘Lọ́wọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ẹni tí ohun kan ti ọ̀dọ̀ rẹ̀ wá tàbí ẹni tó ṣe é.
- source_word: πεντάκις
  choice: Ìgbà márùn-ún
  rationale: Ó túmọ̀ tààrà sí ‘ìgbà márùn-ún,’ ó sì pa ìtẹnumọ́ ìṣẹ̀lẹ̀ tí ó tún ara rẹ̀ ṣe mọ́.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: ọ̀nà ogójì dín ọ̀kan
  rationale: Èyí pa ìṣirò Gíríìkì náà mọ́, ‘ogójì dín ọ̀kan,’ dípò yíyí i padà sí mọ́kàndínlógójì nínú ọ̀rọ̀ pàtàkì. ‘Ọ̀nà’ mú kí ó ṣe kedere pé lílu ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἔλαβον
  choice: mo gba
  rationale: ‘Mo gba’ tẹ̀lé ìtumọ̀ ìpilẹ̀ ti λαμβάνω, níhìn-ín ní èrò gbígba ìjìyà, láì yí àwòrán ọ̀rọ̀ náà sí ‘mo fara da.’
