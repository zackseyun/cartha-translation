translation_notes:
  register: Yorùbá àtẹ̀jáde boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ọ̀nà ogójì dín ọ̀kan’ pa ìrísí ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé sọ iye náà ní kedere.
