  source_fidelity: Ìtumọ̀ náà tọ́ka sí ìgbà márùn-ún, àwọn Júù gẹ́gẹ́ bí ẹni tí ìjìyà náà ti ọwọ́ wọn wá, àti ìṣirò ‘ogójì dín ọ̀kan’ ní ìbámu pẹ̀lú Gíríìkì. Ṣùgbọ́n ‘ọ̀nà’ túmọ̀ sí ọ̀nà/ìlà-oòrin, kì í sì ṣe ìgbẹ́ tàbí ìlù; ó yí ohun tí Pọ́ọ̀lù gbà padà sí ohun tí kò tọ́.
