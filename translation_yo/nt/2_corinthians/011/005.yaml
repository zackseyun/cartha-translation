id: 2CO.11.5
reference: 2 Corinthians 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: yo
  text: Nítorí mo rò pé èmi kò kéré ju àwọn “àpọ́sítélì tí ó tayọ rékọjá” wọ̀nyẹn lọ rárá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àpọ́sítélì olókìkí jù lọ.” A lè ka gbólóhùn Gíríìkì náà gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn (“àwọn àpọ́sítélì tí ó tayọ rékọjá”) tàbí gẹ́gẹ́ bí ìtọ́kasí tààrà sí àwọn àpọ́sítélì tí a bọ̀wọ̀ fún gidigidi.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: mo rò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe àgbéyẹ̀wò tàbí dídá ohun kan lójú nínú èrò. “Mo rò” jẹ́ ọ̀nà àdánidá, tó sì bójú mu ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń fi ìdí tàbí àlàyé fún ohun tí a sọ ṣáájú hàn; “Nítorí” pa ìṣàn àríyànjiyàn Paulu mọ́.
- source_word: μηδὲν
  choice: kò ... rárá
  rationale: Níbi yìí μηδέν ń fún ὑστερηκέναι ní ìtẹnumọ́ pé kò sí ọ̀nà kankan tí Paulu fi rẹlẹ̀ sí wọn.
- source_word: ὑστερηκέναι
  choice: rẹlẹ̀ ... sí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ aláìpé tàbí ẹni tó kéré sí ẹlòmíràn. “Rẹlẹ̀ sí” sọ ìfiwéra náà ní Yorùbá tó ṣe kedere.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: àwọn “àpọ́sítélì tó tayọ rékọjá” wọ̀nyẹn
  rationale: “Tó tayọ rékọjá” pa agbára ὑπερλίαν mọ́, àwọn àmì àyọlò sì jẹ́ kí ìtumọ̀ ẹ̀gàn tí ó ṣeé ṣe hàn láì fi tipátipá yanjú àìdánilójú ọ̀rọ̀ náà. “Wọ̀nyẹn” mú ìtọ́kasí àwọn ẹni tí Paulu ń tako ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bóyá τῶν ὑπερλίαν ἀποστόλων jẹ́ ọ̀rọ̀ ẹ̀gàn sí àwọn alatako Paulu tàbí ìtọ́kasí tààrà sí àwọn àpọ́sítélì olókìkí
  choice: A túmọ̀ ọ́ sí “àwọn ‘àpọ́sítélì tó tayọ rékọjá’ wọ̀nyẹn” láti jẹ́ kí ẹ̀gàn tí ó ṣeé ṣe dúró nínú ọ̀rọ̀ pàtàkì.
  alternative: “àwọn àpọ́sítélì olókìkí jù lọ” gẹ́gẹ́ bí ìtọ́kasí tààrà sí àwọn àpọ́sítélì tí a kà sí pàtàkì.
  rationale: Àyíká 2 Kọrinti 11 ń tọ́ka gidigidi sí ọ̀rọ̀ àtakò sí àwọn olùkọ́ tó ń fọ́nnu lòdì sí Paulu, ṣùgbọ́n gíríìkì náà tún lè túmọ̀ sí àwọn àpọ́sítélì tí a bọ̀wọ̀ fún gidigidi. Nítorí náà, a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó ti yẹ. Gbólóhùn náà ṣókí, ó sì pa ìtẹnumọ́ àti àìdánilójú ẹ̀gàn inú orísun Gíríìkì mọ́.
