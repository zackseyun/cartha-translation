revisions:
- from: Nítorí mo rò pé èmi kò rẹlẹ̀ rárá sí àwọn “àpọ́sítélì tó tayọ rékọjá” wọ̀nyẹn.[a]
  to: Nítorí mo rò pé èmi kò kéré ju àwọn “àpọ́sítélì tí ó tayọ rékọjá” wọ̀nyẹn lọ rárá.[a]
  rationale: 'The revision replaces a semantically unsuitable expression for inferiority with a natural Yoruba comparative that preserves the Greek emphasis: Paul considers himself not at all inferior. No doctrinal conclusion about the identity or ironic force of the ''super-apostles'' is imposed; the footnote preserves the alternative reading.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents λογίζομαι ('mo rò'), γάρ ('Nítorí'), and the emphatic negative force of μηδὲν. However, 'rẹlẹ̀ sí' ordinarily means to humble oneself or submit to someone, not to be inferior or fall short of someone; it therefore does not accurately render ὑστερηκέναι in this comparison.
  naturalness: The revised comparative construction 'kò kéré ju ... lọ rárá' is idiomatic, clear Standard Yoruba. The retained quoted designation and footnote allow the rhetorical irony of ὑπερλίαν ἀποστόλων while retaining the viable non-ironic reading.
  terminology: Àpọ́sítélì is retained as the established church term. 'Tí ó tayọ rékọjá' expresses the extraordinary/superlative description, and the alternative 'olókìkí jù lọ' appropriately states the possible sense of highly eminent apostles.
  issues:
  - severity: medium
    issue: '''rẹlẹ̀ sí'' is used for ὑστερηκέναι.'
    rationale: This wording suggests humility, deference, or submission rather than comparative inferiority. 'Kò kéré ju ... lọ rárá' directly conveys that Paul has not fallen short of the persons named.
  revised_text: Nítorí mo rò pé èmi kò kéré ju àwọn “àpọ́sítélì tí ó tayọ rékọjá” wọ̀nyẹn lọ rárá.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọn àpọ́sítélì olókìkí jù lọ.” A lè ka gbólóhùn Gíríìkì náà gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn (“àwọn àpọ́sítélì tí ó tayọ rékọjá”) tàbí gẹ́gẹ́ bí ìtọ́kasí tààrà sí àwọn àpọ́sítélì tí a bọ̀wọ̀ fún gidigidi.
    reason: alternative_reading
  revision_rationale: 'The revision replaces a semantically unsuitable expression for inferiority with a natural Yoruba comparative that preserves the Greek emphasis: Paul considers himself not at all inferior. No doctrinal conclusion about the identity or ironic force of the ''super-apostles'' is imposed; the footnote preserves the alternative reading.'
