  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ ọ̀rọ̀ Gíríìkì dáadáa: κατὰ ἀτιμίαν jẹ́ ìtìjú/àbùkù, ὡς ὅτι àti ἠσθενήκαμεν pa ìfọwọ́sí ẹ̀gàn náà mọ́, àti ìṣògo jẹ́ ohun tí àyíká ọ̀rọ̀ fi kún τολμᾷ. Síbẹ̀, gbolohun ìkẹyìn nílò àsọdùn kékeré kí ìtumọ̀ τολμῶ κἀγώ lè pé nínú Yorùbá.'
