- from: Mo sọ èyí sí àbùkù wa[a], bí ẹni pé àwa ti jẹ́ aláìlágbára[b]. Ṣùgbọ́n nínú ohunkóhun tí ẹnikẹ́ni bá láyà láti fi ṣògo[c]—mo ń sọ̀rọ̀ bí òmùgọ̀[d]—èmi náà láyà.
  to: Mo sọ èyí fún ìtìjú wa[a], bí ẹni pé àwa ti jẹ́ aláìlágbára[b]. Ṣùgbọ́n nínú ohunkóhun tí ẹnikẹ́ni bá láyà láti fi ṣògo[c]—mo ń sọ̀rọ̀ bí òmùgọ̀[d]—èmi náà sì láyà láti ṣe bẹ́ẹ̀.
  rationale: A tún “sí àbùkù wa” ṣe sí “fún ìtìjú wa” fún ìlò Yorùbá tó dára àti ìtumọ̀ ìdíòmù náà. A sì tún ìpínrọ̀ ìkẹyìn ṣe sí “èmi náà sì láyà láti ṣe bẹ́ẹ̀” kí gbolohun náà pé, kí ó sì ṣetọju àtúnṣe ọ̀rọ̀ “dare” àti ohun ìṣògo tí àyíká fi hàn. A tún ṣàtúnṣe ọ̀rọ̀ akọsílẹ̀ b láti “ìyọ́nú ẹ̀gàn,” tí kì í ṣe ìlò tó pé níbí, sí “ìfẹ̀hàn ẹ̀gàn.”
