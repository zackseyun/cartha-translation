id: 2CO.11.21
reference: 2 Corinthians 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: yo
  text: Mo sọ èyí fún ìtìjú wa[a], bí ẹni pé àwa ti jẹ́ aláìlágbára[b]. Ṣùgbọ́n nínú ohunkóhun tí ẹnikẹ́ni bá láyà láti fi ṣògo[c]—mo ń sọ̀rọ̀ bí òmùgọ̀[d]—èmi náà sì láyà láti ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo sọ èyí ní ọ̀nà àbùkù”; àkànlò èdè Gíríìkì náà tún lè túmọ̀ sí, “Mo sọ èyí gẹ́gẹ́ bí ohun ìtìjú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí ẹni pé àwa jẹ́ aláìlágbára.” Pọ́ọ̀lù ń sọ ọ́ pẹ̀lú ìfẹ̀hàn ẹ̀gàn nínú ọ̀rọ̀ ìṣògo ‘òmùgọ̀’ rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “nínú ohunkóhun tí ẹnikẹ́ni bá láyà.” Àyíká ọ̀rọ̀ ló fi hàn pé ìṣògo ni ó láyà láti ṣe.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “mo ń sọ̀rọ̀ nínú ìwà òmùgọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: sí àbùkù wa
  rationale: Ó fi ìtìjú tàbí àbùkù tí ọ̀rọ̀ náà dà bí ẹni pé ó mú bá Pọ́ọ̀lù àti àwọn alábáṣiṣẹ́ rẹ̀ hàn, ó sì pa ìtumọ̀ àkànlò èdè Gíríìkì mọ́ láì tú u sí ọ̀nà kan ṣoṣo.
- source_word: ὡς ὅτι
  choice: bí ẹni pé
  rationale: Ó bá ìfiwéra àti ìyọ́nú ẹ̀gàn inú gbólóhùn náà mu, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἠσθενήκαμεν
  choice: àwa ti jẹ́ aláìlágbára
  rationale: Ó tọ́ka sí àìlágbára tàbí àìní ipò àti agbára nínú ìjà ọ̀rọ̀ yìí, kì í ṣe àìsàn ara ní pàtàkì; ìṣe pípé náà tún farahàn nínú ‘ti jẹ́.’
- source_word: ἐν ᾧ
  choice: nínú ohunkóhun
  rationale: Ó fi ọ̀nà tàbí ọ̀ràn tí ẹlòmíràn ti ń fi ìgboyà hàn sílẹ̀ ní gbangba.
- source_word: τολμᾷ
  choice: bá láyà láti fi ṣògo
  rationale: ‘Láyà’ ni ìtumọ̀ taara, ṣùgbọ́n ‘láti fi ṣògo’ mú ohun tí àyíká ọ̀rọ̀ (ẹsẹ 18, 21–23) fi sílẹ̀ lójú inú hàn.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: mo ń sọ̀rọ̀ bí òmùgọ̀
  rationale: Ó mú àkíyèsí Pọ́ọ̀lù pé irú ọ̀rọ̀ ìṣògo bẹ́ẹ̀ jẹ́ ti òmùgọ̀ jáde ní Yorùbá tó ṣe kedere.
- source_word: τολμῶ κἀγώ
  choice: èmi náà láyà
  rationale: Ó pa àtúnṣe ọ̀rọ̀ τολμάω mọ́, ó sì fi ohun tí ó láyà láti ṣe sílẹ̀ fún àyíká ọ̀rọ̀ láti ṣàlàyé.
theological_decisions:
- issue: Ìyọ́nú ẹ̀gàn nípa ‘àìlágbára’ Pọ́ọ̀lù
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí àfiyèsí ẹ̀gàn pé ó dà bí ẹni pé àwọn jẹ́ aláìlágbára
  alternative: Kà á sí ìjẹ́wọ́ taara pé àwọn jẹ́ aláìlágbára
  rationale: Àyíká ‘ọ̀rọ̀ òmùgọ̀’ Pọ́ọ̀lù fi hàn pé ó ń fi ara rẹ̀ wé àwọn alatako tó ń ṣògo. ‘Bí ẹni pé’ pa ìyọ́nú ẹ̀gàn àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láì sọ pé Pọ́ọ̀lù jẹ́wọ́ àìní ẹ̀tọ́ aposteli.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘láyà’ láti pa ìtúnṣe ọ̀rọ̀ Gíríìkì mọ́, a sì ṣàfikún ‘láti fi ṣògo’ ní ìṣe àkọ́kọ́ nítorí àyíká ọ̀rọ̀.
