id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: yo
  text: Nítorí bí ẹnì kan bá dé, tí ó sì ń kéde Jésù mìíràn tí àwa kò kéde, tàbí bí ẹ̀yin bá gba ẹ̀mí tí ó yàtọ̀ sí èyí tí ẹ̀yin ti gbà, tàbí ìhìn rere tí ó yàtọ̀ sí èyí tí ẹ̀yin ti tẹ́wọ́ gbà, ẹ̀yin ń faradà á dáadáa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí gbólóhùn náà túmọ̀ sí, ‘ẹ̀yin ń tètè faradà á.’ Ó ṣeé ṣe kí Pọ́ọ̀lù máa fi ọ̀rọ̀ ẹlẹ́yà bá àwọn ará Kọ́ríńtì wí nítorí bí wọ́n ṣe múra tán láti fàyè gba irú ìkéde bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: bí ẹnì kan bá dé
  rationale: Ọ̀rọ̀ participle pẹ̀lú article yìí ń tọ́ka sí ẹnikẹ́ni tó lè wá sí àárín wọn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ aláìnídìí náà mọ́.
- source_word: ἄλλον Ἰησοῦν
  choice: Jésù mìíràn
  rationale: ἄλλος túmọ̀ sí ‘òmíràn/mìíràn’; nínú àyíká yìí, ó ń tọ́ka sí àwòrán Jésù mìíràn tí ìkéde àwọn olùkọ́ alatako gbé kalẹ̀.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: ń kéde / kò kéde
  rationale: ‘Kéde’ sọ ìpolongo ní gbangba tí κηρύσσω ní lọ́kàn, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: πνεῦμα ἕτερον
  choice: ẹ̀mí tí ó yàtọ̀
  rationale: ἕτερος tẹnu mọ́ ìyàtọ̀; ‘ẹ̀mí’ pa àìdánilójú mọ́ nípa bóyá Ẹ̀mí Mímọ́ tí a ṣàpèjúwe lọ́nà mìíràn, ẹ̀mí búburú, tàbí agbára/ìrírí ẹ̀mí ni.
- source_word: λαμβάνετε / ἐλάβετε
  choice: bá gba / ti gbà
  rationale: ‘Gba’ bá ìtumọ̀ ohun tí a fi fúnni tàbí tí ẹni kan rí gbà mu; ìkọ́lé ‘ti gbà’ tún fi ìṣe àtijọ́ hàn.
- source_word: εὐαγγέλιον ἕτερον
  choice: ìhìn rere tí ó yàtọ̀
  rationale: ‘Ìhìn rere’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún εὐαγγέλιον, ‘tí ó yàtọ̀’ sì pa agbára ìfiwé ἕτερον mọ́.
- source_word: ἐδέξασθε
  choice: ti tẹ́wọ́ gbà
  rationale: ‘Tẹ́wọ́ gbà’ ń fi ìtẹ́wọ́gbà hàn, ó sì yà á díẹ̀ sí ‘gba’ tí a lò fún λαμβάνω.
- source_word: καλῶς ἀνέχεσθε
  choice: ẹ̀yin a fara dà á dáadáa!
  rationale: ‘Fara dà’ bá ἀνέχομαι mu. ‘Dáadáa’ pa καλῶς mọ́, àmì ìyanu sì ràn án lọ́wọ́ láti fi ìbáwí ẹlẹ́yà inú àyíká hàn láì túmọ̀ rẹ̀ jù.
- source_word: εἰ μὲν γὰρ
  choice: Nítorí bí
  rationale: ‘Nítorí’ so ẹsẹ̀ náà mọ́ àríyànjiyàn tó ṣáájú, ‘bí’ sì ṣètọju ìkọ́lé oníṣ条件 εἰ.
theological_decisions:
- issue: Ohun tí ‘ẹ̀mí tí ó yàtọ̀’ ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní gbogbogbò gẹ́gẹ́ bí ‘ẹ̀mí tí ó yàtọ̀,’ láì pinnu irú ẹ̀mí náà.
  alternative: Ẹ̀mí Mímọ́ tí a ṣàpèjúwe lọ́nà èké; ẹ̀mí búburú; tàbí ìrònú tàbí ìrírí ẹ̀mí mìíràn.
  rationale: Gíríìkì náà kò dín ìtumọ̀ rẹ̀ sí ọ̀kan ṣoṣo, àyíká náà kò sì béèrè pé kí atúmọ̀ yan ọ̀kan.
- issue: Ìróhìn καλῶς ἀνέχεσθε
  choice: 'A gbé e kalẹ̀ gẹ́gẹ́ bí ìbáwí ẹlẹ́yà: ‘ẹ̀yin a fara dà á dáadáa!’'
  alternative: Ìyìn ní tààràtà tàbí àkíyèsí láìsí ẹ̀gàn.
  rationale: Àyíká fi hàn pé Pọ́ọ̀lù ń bá wọn wí nítorí bí wọ́n ṣe ń tètè fàyè gba àwọn olùkọ́ alatako, kì í ṣe pé ó ń yìn wọ́n.
translation_notes:
  register: Yorùbá ìdíwọ̀n, ọlọ́lá, àti ti òde òní ni a lò. A ṣètọju ìtòlẹ́sẹẹsẹ àwọn ohun mẹ́ta—Jésù, ẹ̀mí, àti ìhìn rere—àti ìyàtọ̀ láàárín ‘gba’ àti ‘tẹ́wọ́ gbà.’ Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. Àkọlé-ẹsẹ̀ náà ní àmì àlàyé [a], tó bá àlàyé ìróhìn ẹlẹ́yà mu.
