id: 2CO.11.32
reference: 2 Corinthians 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: yo
  text: Ní Damásíkù,[a] alákòóso ẹ̀yà ti Ọba Arétà ń ṣọ́ ìlú àwọn ará Damásíkù láti mú mi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú Damásíkù.” Ní ìtumọ̀ gangan, èdè Gíríìkì sọ pé, “ìlú àwọn ará Damásíkù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Ní Damásíkù
  rationale: Ẹ̀yà ọ̀rọ̀ ἐν pẹ̀lú dátífù ń tọ́ka sí ibi; “Ní Damásíkù” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐθνάρχης
  choice: alákòóso ẹ̀yà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí ń ṣàkóso ènìyàn tàbí agbègbè kan; yíyan yìí mú ìtumọ̀ oyè ìtàn náà hàn ní èdè tí òǹkàwé Yorùbá lè lóye.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: lábẹ́ Ọba Arétà
  rationale: Jẹ́nítífù náà lè fi hàn pé alákòóso náà jẹ́ ti Ọba Arétà tàbí pé ó ń ṣiṣẹ́ lábẹ́ rẹ̀; “lábẹ́ Ọba Arétà” jẹ́ àdánidá, ó sì ṣàlàyé ìbáṣepọ̀ iṣẹ́ náà láì sọ pé òun ni ọba.
- source_word: ἐφρούρει
  choice: ń ṣọ́
  rationale: Fáàbù aláìpé náà fi ìṣe tí ó ń bá a lọ ní àkókò àtijọ́ hàn; “ń ṣọ́” pa ìtumọ̀ ìṣọ́ àti àbójútó mọ́.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: ìlú àwọn ará Damásíkù
  rationale: Èyí tẹ̀lé ìtumọ̀ gangan ti jẹ́nítífù púpọ̀ Δαμασκηνῶν, ‘àwọn ará Damásíkù,’ dípò yíyí i padà sí orúkọ ìlú nìkan.
- source_word: πιάσαι με
  choice: láti mú mi
  rationale: Infinitífù náà sọ ète ìṣọ́ náà; “láti mú mi” jẹ́ gbòòrò, àdánidá, kò sì fi ìtumọ̀ pàtó bí ‘láti fàṣẹ ọba mú mi’ kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àgbàṣe tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Alákòóso ẹ̀yà” túmọ̀ oyè ìtàn náà dípò lílo ọ̀rọ̀ àjèjì, “ẹ́tínákì.” Àmì ẹsẹ̀ [a] wà lẹ́yìn ibi tí àlàyé rẹ̀ kan.
