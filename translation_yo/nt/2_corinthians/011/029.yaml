id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: yo
  text: Ta ni ó jẹ́ aláìlera, tí èmi kò sì jẹ́ aláìlera? Ta ni ẹni tí a mú kọsẹ̀, tí èmi kò sì ń jóná nínú?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹ̀mí kò sì ń jóná nínú?” Àfiwé ni ọ̀rọ̀ Gíríìkì náà fún jíjóná; ó lè sọ ìbànújẹ́, ìtara, tàbí ìbínú tó lágbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: jẹ́ aláìlera / jẹ́ aláìlera
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí àìlera nípa ara, ipò, tàbí ẹ̀mí. “Jẹ́ aláìlera” pa ìtumọ̀ rẹ̀ mọ́ ní fífẹ̀, ó sì fi hàn pé Pọ́ọ̀lù ń bá àwọn ẹlòmíràn kó àìlera wọn.
- source_word: σκανδαλίζεται
  choice: a mú kọsẹ̀
  rationale: Ìṣe ọ̀rọ̀ náà wà ní ìrísí àfaragbà, ó sì ní àwòrán ẹni tí a mú kọsẹ̀ tàbí tí a fà sínú ewu ìwà àti ti ẹ̀mí. Gbólóhùn yìí pa àwòrán náà àti àìdánilójú nípa àbájáde rẹ̀ mọ́.
- source_word: πυροῦμαι
  choice: inú mi jó
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí jíjó tàbí mímú jóná, ṣùgbọ́n àfiwé ni níbí fún ìdààmú ọkàn tó lágbára. “Inú mi jó” jẹ́ èdè Yorùbá àdánidá tó pa àwòrán iná mọ́ láì fi dandan sọ pé ìbínú nìkan ni.
- source_word: τίς
  choice: Ta ni
  rationale: Ó bẹ̀rẹ̀ ìbéèrè àsọyé nípa ènìyàn; “Ta ni” ni ìbámu Yorùbá tó ṣe kedere jù.
- source_word: καὶ οὐκ ἐγὼ
  choice: tí èmi kò sì
  rationale: “Èmi” fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì hàn, nígbà tí “tí… kò sì” mú ìbéèrè àsọyé náà ṣàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Irú ìmọ̀lára Pọ́ọ̀lù nínú πυροῦμαι
  choice: Pa àfiwé jíjó mọ́ nínú ọ̀rọ̀ pàtàkì, láì sọ ìmọ̀lára kan ṣoṣo di dandan.
  alternative: “Inú mi kò sì ru?” tàbí “Èmi kò sì bínú gidigidi?”
  rationale: Àyọkà náà fi ìfaramọ́ jinlẹ̀ Pọ́ọ̀lù sí ìṣòro àwọn ẹlòmíràn hàn, ṣùgbọ́n àfiwé Gíríìkì kò pinnu bóyá ìbànújẹ́, ìtara, tàbí ìbínú ni pàtó. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìtọ́jú ọkàn yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. Àwọn ìbéèrè àsọyé méjèèjì àti ìtẹnumọ́ “èmi” ni a pa mọ́; “inú mi jó” jẹ́ àfiwé Yorùbá àdánidá fún ìdààmú ọkàn tó lágbára.
