  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọyé méjèèjì, ìtẹnumọ́ “èmi,” àti àfiwé πυροῦμαι mọ́. Síbẹ̀, “Ta ni a mú kọsẹ̀” lè dà bí ìbéèrè pé ẹni wo ni ‘àwa’ mú kọsẹ̀, dípò àfaragbà Gíríìkì náà. Àtúnṣe náà jẹ́ kí ìtumọ̀ pé a fa ẹni náà sí ìkọsẹ̀ hàn gedegbe. “Ń jóná nínú” sì pa àfiwé ‘burn’ mọ́ láì sọ ìbínú di ìtumọ̀ kan ṣoṣo.
  naturalness: “Ta ni ẹni tí a mú kọsẹ̀” jẹ́ gbolóhùn Yorùbá boṣewa tó ṣe kedere jù fún ìrísí àfaragbà náà. “Tí èmi kò sì ń jóná nínú?” jẹ́ ọ̀nà àdánidá tí ó fi ìmúná ọkàn tó lágbára hàn, ó sì dá ìtẹnumọ́ ẹni-kìíní Gíríìkì náà sí.
  terminology: “Aláìlera” bójú mu ἀσθενεῖ/ἀσθενῶ nítorí ó ṣí sílẹ̀ fún àìlera ara, ipò, tàbí ẹ̀mí. “A mú kọsẹ̀” pa àwòrán σκανδαλίζεται mọ́ láì fi dandan sọ pé ó jẹ́ ẹ̀ṣẹ̀ tàbí ìbínú nìkan. “Ń jóná nínú” pa púrọ̀mai mọ́ gẹ́gẹ́ bí àfiwé.
