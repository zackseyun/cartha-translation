id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: yo
  text: Ṣùgbọ́n ohun tí mo ń ṣe yìí ni èmi yóò máa bá a lọ láti ṣe, kí n lè gé àǹfààní[a] kúrò lọ́wọ́ àwọn tí ń fẹ́ àǹfààní, kí a lè rí wọn pé bí àwa náà ni wọ́n jẹ́ nínú ohun tí wọ́n ń ṣògo nípa rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “àyè” tàbí “ìdí àwíjàre”; bákan náà níbi tí “àǹfààní” ti fara hàn ní ìgbà kejì (Gíríìkì: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Ṣùgbọ́n ohun tí mò ń ṣe yìí ni èmi yóò máa bá a lọ láti ṣe
  rationale: Àkókò ìsinsìnyí àti ti ọjọ́ iwájú nínú ποιῶ καὶ ποιήσω fi hàn pé Pọ́ọ̀lù pinnu láti tẹ̀ síwájú nínú ohun tí ó ti ń ṣe; ‘yóò máa bá a lọ’ sọ èrò yìí ní Yorùbá àdánidá láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐκκόψω
  choice: gé ... kúrò lọ́wọ́
  rationale: Ọ̀rọ̀ náà ní àwòrán gígé ohun kan kúrò, ó sì túmọ̀ sí yíyọ ohun tí àwọn alátakò lè lò kúrò ní àyíká yìí. Gbólóhùn Yorùbá náà pa àwòrán yẹn mọ́.
- source_word: ἀφορμή
  choice: àǹfààní
  rationale: ἀφορμή lè jẹ́ àǹfààní, àyè tàbí ọ̀nà àwíjàre. ‘Àǹfààní’ jẹ́ ọ̀rọ̀ tí kò dá ìdájọ́ pàtó lé ohun tí wọ́n ń wá, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi ìwà búburú wọn hàn.
- source_word: τῶν θελόντων ἀφορμήν
  choice: àwọn tí ń fẹ́ àǹfààní
  rationale: Ìtumọ̀ tààrà yìí pa àtúnlò ἀφορμή mọ́, ó sì ń dun bí Yorùbá òde òní.
- source_word: ἐν ᾧ καυχῶνται
  choice: nínú ohun tí wọ́n ń ṣògo lé lórí
  rationale: Èyí sọ kókó tàbí ẹ̀ka ohun tí wọ́n ń ṣògo nípa rẹ̀ láìsọ ohun tí ẹsẹ náà kò sọ.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: kí a sì lè rí wọn pé bí àwa náà ni wọ́n jẹ́
  rationale: ‘Kí a lè rí wọn’ pa ìṣe aláìṣe-taara εὑρεθῶσιν mọ́, ‘bí àwa náà’ sì pa ìfiwéra καθὼς καὶ ἡμεῖς mọ́ láìṣe àlàyé ohun tí ìfiwéra náà dá lé lórí.
theological_decisions:
- issue: Irú ἀφορμή tí àwọn alátakò Pọ́ọ̀lù ń fẹ́
  choice: A lo ‘àǹfààní’ tí kò fi ẹ̀sùn pàtó kún ọ̀rọ̀ náà.
  alternative: ọ̀nà àwíjàre; àyè
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ jẹ́ ti àríyànjiyàn, ἀφορμή fúnra rẹ̀ kò fi dandan túmọ̀ sí àwíjàre èké. Yíyan ọ̀rọ̀ aláìgbẹ̀sùn pa ìwọ̀n ìtumọ̀ orísun mọ́.
- issue: Ohun tí ‘bí àwa náà’ ń tọ́ka sí
  choice: A pa ìfiwéra náà mọ́ gẹ́gẹ́ bí ó ṣe wà, láìṣàlàyé bóyá ó jẹ́ ìdọ́gba gidi tàbí ohun tí àwọn alátakò ń sọ pé wọ́n jẹ́.
  alternative: kí a lè kà wọ́n sí ẹni tí ó dọ́gba pẹ̀lú wa nínú ohun tí wọ́n ń ṣògo lé lórí
  rationale: Gíríìkì fi ìfiwéra náà sílẹ̀ ní ṣókí, ó sì ní ìfẹ̀sẹ̀mulẹ̀ àríyànjiyàn tí a kò gbọ́dọ̀ tú sí ọ̀nà ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìbílẹ̀ tí ó bójú mu, tó ní àmì ohùn ní kíkún níbi tí ó yẹ. A lo gbólóhùn òde òní tí ó ṣe kedere fún òǹkàwé gbogbogbò, ṣùgbọ́n a pa àtúnlò, àwòrán gígé kúrò, àti àìdánilójú ìfiwéra inú Gíríìkì mọ́.
