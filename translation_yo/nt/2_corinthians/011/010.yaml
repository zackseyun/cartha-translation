    rationale: '''Kì'' sábà ń ṣiṣẹ́ fún ìwà àṣà/habitual negation; fún ọjọ́ iwájú nínú àyíká yìí, ''a kò ní'' jẹ́ Yorùbá boṣewa àti adayeba.'
  - severity: medium
    issue: Àkànlò 'pa ìṣògo ... lẹ́nu mọ́' kò rọrùn ní Yorùbá.
    rationale: A lè pa ènìyàn tàbí ohùn lẹ́nu, ṣùgbọ́n fífi 'ìṣògo' ṣe ohun tí a pa lẹ́nu kò dára. 'Pa ìṣògo ... ró' sọ ìdènà tàbí ìtẹ́mọ́ ìṣògo náà ní ọ̀nà tí ó yéni.
