reference: 2 Corinthians 11:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: yo
  text: 'Bí òtítọ́ Mèsáyà ti wà nínú mi[a], a kò ní pa ìṣògo mi yìí ró[b][c] ní àwọn ẹkùn ilẹ̀ Ákáíà.


    [a] A tún lè túmọ̀ ọ́ sí, “òtítọ́ Kristi wà nínú mi.”


    [b] A tún lè túmọ̀ ọ́ sí, “a kò ní dá ìṣògo yìí dúró ní ti èmi,” tàbí, “a kò ní dí ìṣògo yìí mọ́ kúrò lọ́dọ̀ mi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ àkànlò èdè tí ó ṣòro láti túmọ̀ ní pàtó.


    [c] A tún lè túmọ̀ ọ́ sí, “a kò ní pa ìṣògo yìí ró ní ti èmi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “òtítọ́ Kristi wà nínú mi.”
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí, “a kò ní dá ìṣògo yìí dúró ní ti èmi,” tàbí, “a kò ní dí ìṣògo yìí mọ́ kúrò lọ́dọ̀ mi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ àkànlò èdè tí ó ṣòro láti túmọ̀ ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ ọ́ sí, “a kò ní pa ìṣògo yìí ró ní ti èmi.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: òtítọ́ Mèsáyà
  rationale: A mú ìsopọ̀ genitive náà gẹ́gẹ́ bí òtítọ́ tí ó jẹ́ ti Mèsáyà tàbí tí ó so mọ́ ọn. “Mèsáyà” fi ipa Χριστός gẹ́gẹ́ bí oyè hàn; àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν ἐμοὶ
  choice: wà nínú mi
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ orísun ní tààrà, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù tí ó dà bí ìbúra mọ́.
- source_word: ὅτι
  choice: Bí ... ti
  rationale: Ìṣètò “Bí ... ti” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánilójú tí ó dà bí ìbúra, ìyẹn “gẹ́gẹ́ bí ó ti dájú pé,” láìfi ìtumọ̀ míì kún un.
- source_word: καύχησις
  choice: ìṣògo
  rationale: “Ìṣògo” lè tọ́ka sí ṣíṣe ìṣògo tàbí ohun tí a fi ń ṣògo, ó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá ju “ìyangàn,” tí ó sábà máa ń ní ìtumọ̀ búburú.
- source_word: φραγήσεται
  choice: a kì yóò pa ... lẹ́nu mọ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ ní ìpìlẹ̀ sí dídí tàbí pípa ohun kan mọ́. Àkànlò Yorùbá “pa ... lẹ́nu mọ́” mú àwòrán ìdákẹ́jẹ̀ àti ohùn àìṣe-mọ̀ọ́ṣe ti passive náà jáde ní ọ̀nà àdánidá.
- source_word: εἰς ἐμὲ
  choice: ìṣògo mi
  rationale: 'Nínú gbólóhùn àkọ́kọ́, a fi ọ̀rọ̀ ìtọ́kasí tí ó ṣòro yìí hàn gẹ́gẹ́ bí ohun-ìní: ìṣògo tí ó jẹ́ ti Pọ́ọ̀lù. Àwọn ìtumọ̀ tí ó sún mọ́ ìrísí Gíríìkì wà nínú àwọn àlàyé ìsàlẹ̀.'
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: ní àwọn ẹkùn ilẹ̀ Ákáíà
  rationale: “Àwọn ẹkùn” pa nọ́ńbà ọ̀pọ̀ κλίμασι mọ́, “ilẹ̀ Ákáíà” sì jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí agbègbè ìṣàkóso náà.
- source_word: Ἀχαΐας
  choice: Ákáíà
  rationale: Ìkọ̀wé orúkọ yìí tẹ̀ lé ìró orúkọ Gíríìkì Achaia ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Mèsáyà” mú agbára oyè náà hàn, ṣùgbọ́n “Kristi” jẹ́ àṣàyàn ìbílẹ̀ tí ó ṣeé gbà, a sì fi sí àlàyé ìsàlẹ̀ láìyanju àìdájú náà ní ìkọ̀kọ̀.
- issue: Agbára gbólóhùn ἀλήθεια Χριστοῦ ἐν ἐμοὶ
  choice: Bí òtítọ́ Mèsáyà ti wà nínú mi
  alternative: Òtítọ́ Mèsáyà wà nínú mi pé ...
  rationale: A ka ọ̀rọ̀ náà sí ìdánilójú tí ó dà bí ìbúra, ṣùgbọ́n a kò fi “Mo búra” kún un nítorí kò sí nínú orísun.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Gbólóhùn àkọ́kọ́ yan ìṣàn ọ̀rọ̀ Yorùbá tí ó rọrùn, nígbà tí àwọn àlàyé ìsàlẹ̀ pa àìdájú àkànlò Gíríìkì εἰς ἐμὲ àti àṣàyàn Mèsáyà/Kristi mọ́.
