  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ pàtàkì ọ̀rọ̀ Gíríìkì dáadáa: ìjẹ́pàtàkì ìdánilójú náà, ἀλήθεια Χριστοῦ ἐν ἐμοὶ, ìṣògo Pọ́ọ̀lù, àti àwọn ẹkùn ilẹ̀ Ákáíà wà nínú rẹ̀. Síbẹ̀, ìṣètò àìfẹ́sẹ̀múlẹ̀ ''a kì yóò'' kò yẹ ní Yorùbá boṣewa nínú ìtumọ̀ ọjọ́ iwájú yìí. A tún ṣàtúnṣe àkànlò ''pa ... lẹ́nu mọ́,'' tí kò dára nígbà tí ohun tí a ń pa lẹ́nu jẹ́ ''ìṣògo,'' sí ọ̀nà tí ó túmọ̀ sí dídènà/títẹ́ ìṣògo mọ́ dáadáa.'
  naturalness: Àtúnṣe náà lo 'a kò ní' fún ìṣàìní ọjọ́ iwájú, àti 'pa ìṣògo ... ró,' èyí tí ó bá àwòrán 'a kò ní dá a dúró/tabi tẹ́ ẹ mọ́' mu ní Yorùbá adayeba. 'Bí ... ti wà nínú mi' ń pa ìró ìdánilójú tí ó dà bí ìbúra mọ́ láìfi 'Mo búra' kún un.
  terminology: “Mèsáyà” jẹ́ ìtumọ̀ tó bá ìpinnu iṣẹ́ náà mu fún Χριστός gẹ́gẹ́ bí oyè; “Kristi” wà gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀. “Ìṣògo” yẹ fún καύχησις ní ìforúkọsílẹ̀ yìí, kò sì fi ìdájọ́ búburú tí 'ìyangàn' lè ní kún un. “Ákáíà” àti “àwọn ẹkùn ilẹ̀ Ákáíà” pa orúkọ ibi náà àti nọ́ńbà ọ̀pọ̀ κλίμασι mọ́.
