id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: yo
  text: pé a gbé e lọ sí Párádísè, ó sì gbọ́ àwọn ọ̀rọ̀ tí a kò lè fi ẹnu sọ, tí a kò gbà ènìyàn láàyè láti sọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: a gbé e lọ
  rationale: Aorist passive of ἁρπάζω conveys being suddenly or forcefully taken up; this natural passive Yoruba wording preserves the subject as acted upon without adding an explicit agent.
- source_word: παράδεισον
  choice: Párádísè
  rationale: Uses the established Yoruba biblical loanword for paradise, retaining the theological and spatial reference without specifying its nature beyond the Greek.
- source_word: ἄρρητα ῥήματα
  choice: àwọn ọ̀rọ̀ tí a kò lè fi ẹnu sọ
  rationale: Expresses words that are unspeakable or inexpressible in idiomatic Yoruba while preserving the phrase’s ambiguity between inability to articulate and words not to be uttered.
- source_word: ἀνθρώπῳ
  choice: ènìyàn
  rationale: The Greek is generic here; ènìyàn naturally means a human being/person and does not impose male sex.
- source_word: λαλῆσαι
  choice: láti sọ
  rationale: A direct and natural rendering of the infinitive 'to speak/utter' in this context.
theological_decisions:
- issue: Meaning of οὐκ ἐξόν
  choice: tí kò tọ́ fún ènìyàn láti sọ
  alternative: tí a kò gba ènìyàn láàyè láti sọ
  rationale: The impersonal expression may denote what is not lawful, allowed, or proper. Kò tọ́ preserves this breadth better than wording that explicitly introduces a prohibiting authority.
- issue: Identity of the person caught up
  choice: Retain the third-person pronoun without identifying him explicitly
  alternative: Identify the person as Paul
  rationale: The Greek says only that 'he' was caught up in the continuing discourse; the translation should not resolve the rhetorical third-person reference inside this verse.
- issue: Relation between ἄρρητα and οὐκ ἐξόν
  choice: Preserve both inexpressibility and impropriety/non-permission as distinct clauses
  alternative: Collapse both into a single statement that the words were forbidden
  rationale: The Greek juxtaposes two descriptions whose exact relationship remains open; retaining both avoids flattening the theological tension.
translation_notes:
  register: Standard Yorùbá with full tone marks and dignified, current phrasing. The passive construction avoids naming God as agent where the Greek does not do so. No footnote markers are needed because no footnotes are supplied.
