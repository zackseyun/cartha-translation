id: 2CO.12.16
reference: 2 Corinthians 12:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: yo
  text: 'Ṣùgbọ́n, ká ní ó rí bẹ́ẹ̀: èmi kò di ẹrù lé yín lórí.[a] Ṣùgbọ́n, mo jẹ́ alárékérekè, mo sì fi ẹ̀tàn mú yín.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ jẹ́ ká gbà pé ó rí bẹ́ẹ̀,” tàbí, “Bó ti wù kó rí”; ó dà bí ẹni pé Pọ́ọ̀lù gba kókó yìí sílẹ̀ nítorí àríyànjiyàn.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí gbólóhùn náà, “mo jẹ́ alárékérekè, mo sì fi ẹ̀tàn mú yín,” jẹ́ àtúnsọ ẹ̀sùn tí Pọ́ọ̀lù ń ṣe ní ọ̀nà ẹ̀gàn, kì í ṣe ìjẹ́wọ́ gidi.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “mo fi àrékérekè dẹ yín,” tàbí, “mo fi ẹ̀tàn jẹ yín ní àǹfààní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Ṣùgbọ́n, ká ní ó rí bẹ́ẹ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà àríyànjiyàn tí Pọ́ọ̀lù fi gba kókó kan sílẹ̀ fún ìgbà díẹ̀; ó pa ìtumọ̀ ‘jẹ́ ká gbà pé ó rí bẹ́ẹ̀’ mọ́ láì túmọ̀ rẹ̀ jù.
- source_word: κατεβάρησα
  choice: kò di ẹrù lé yín lórí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ẹrù wu ẹnì kan; ní àyíká yìí ó ní í ṣe pẹ̀lú ẹrù ti ohun ìní tàbí owó, ṣùgbọ́n àwòrán ‘ẹrù’ ni a pa mọ́.
- source_word: ὑπάρχων
  choice: nítorí mo jẹ́
  rationale: Ó ṣàfihàn ipò ẹni tó ń ṣe ohun tí a sọ; bí ó tilẹ̀ jẹ́ pé a lo ‘nítorí’ fún Yorùbá àdánidá, ọ̀rọ̀ inú ẹsẹ̀ náà ṣì dúró gẹ́gẹ́ bí ẹ̀sùn tí a lè lóye lọ́nà ẹ̀gàn.
- source_word: πανοῦργος
  choice: alárékérekè
  rationale: Ó ń tọ́ka sí ẹni tó ní ọgbọ́n àrékérekè ní ọ̀nà búburú; ‘alárékérekè’ bá ohùn ẹ̀sùn náà mu ní Yorùbá òde òní.
- source_word: δόλῳ
  choice: fi ẹ̀tàn
  rationale: 'Dátífù náà ń fi ohun èlò tàbí ọ̀nà hàn: ẹ̀tàn ni a fi mú wọn.'
- source_word: ἔλαβον
  choice: mú yín
  rationale: ‘Mú’ pa ìtumọ̀ gbígba tàbí dídẹkùn mọ́, ó sì jẹ́ kí ‘fi ẹ̀tàn’ ṣàlàyé bí ìṣe náà ṣe ṣẹlẹ̀ láì fi ‘jẹ yín ní àǹfààní’ sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pọ́ọ̀lù lẹ́yìn ἀλλὰ jẹ́ ìjẹ́wọ́ tirẹ̀ tàbí àtúnsọ ẹ̀sùn ní ọ̀nà ẹ̀gàn
  choice: A túmọ̀ gbólóhùn náà ní tààràtà, ṣùgbọ́n a ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ó ṣeé ṣe kó jẹ́ pé Pọ́ọ̀lù ń tún ẹ̀sùn àwọn alatako rẹ̀ sọ ní ọ̀nà ẹ̀gàn.
  alternative: Ṣùgbọ́n bí mo ṣe jẹ́ ọlọ́gbọ́n àrékérekè, mo fi ẹ̀tàn jẹ yín ní àǹfààní.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù kọ̀ pé òun jẹ wọn ní àǹfààní. Títúmọ̀ rẹ̀ ní tààràtà pa ìforígbárí ọ̀rọ̀ àti ìyọnu ẹ̀gàn náà mọ́, láì sọ ó di ìjẹ́wọ́ gidi tàbí yanju rẹ̀ nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ‘ẹrù’ àti ìdíjú ọ̀rọ̀ ẹ̀gàn Pọ́ọ̀lù mọ́.
