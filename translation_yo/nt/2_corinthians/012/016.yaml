revisions:
- from: 'Ṣùgbọ́n, ká ní ó rí bẹ́ẹ̀: èmi kò di ẹrù lé yín lórí.[a] Síbẹ̀, nítorí mo jẹ́ alárékérekè,[b] mo fi ẹ̀tàn mú yín.[c]'
  to: 'Ṣùgbọ́n, ká ní ó rí bẹ́ẹ̀: èmi kò di ẹrù lé yín lórí.[a] Ṣùgbọ́n, mo jẹ́ alárékérekè, mo sì fi ẹ̀tàn mú yín.[b][c]'
  rationale: A yọ ‘nítorí’ kúrò kí a má bàa fi ìbáṣepọ̀ ìdí kan tí Gíríìkì kò sọ ní pàtó kún ọ̀rọ̀ náà. A tún lo ‘ṣùgbọ́n’ fún ἀλλὰ, a sì fi ‘mo sì’ so àwọn ìṣe méjèèjì pọ̀ ní Yorùbá. Àwọn àlàyé ìsàlẹ̀ ṣì ń ṣàfihàn ìtumọ̀ míràn àti ìfẹ̀yìntì tí ó ṣeé ṣe, láì yanju ìforígbárí náà nínú ọ̀rọ̀ pàtàkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:40Z'
