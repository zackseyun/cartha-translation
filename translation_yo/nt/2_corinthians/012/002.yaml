revisions:
- from: Mo mọ ọkùnrin kan nínú Mèsáyà[a]—ní ọdún mẹ́rìnlá sẹ́yìn, bóyá nínú ara ni, èmi kò mọ̀; tàbí ní òde ara ni, èmi kò mọ̀; Ọlọ́run ló mọ̀[b]—a gbé irú ẹni bẹ́ẹ̀ lọ sókè dé ọ̀run kẹta.[c]
  to: Mo mọ ọkùnrin kan nínú Mèsáyà[a] tí, ní ọdún mẹ́rìnlá sẹ́yìn—bóyá nínú ara ni, èmi kò mọ̀; bóyá níta ara ni, èmi kò mọ̀; Ọlọ́run ló mọ̀[b]—a gbé irú ẹni bẹ́ẹ̀ lọ sókè dé ọ̀run kẹta.[c]
  rationale: A fi “tí” so ìṣẹ̀lẹ̀ náà mọ́ ọkùnrin tí Pọ́ọ̀lù mọ̀, a sì gbe “ní ọdún mẹ́rìnlá sẹ́yìn” sínú gbolohun ìbátan náà kí ó lè tọ́ka kedere sí gbígbé ẹni náà lọ sókè. A tún rọ́pò “ní òde ara” pẹ̀lú “níta ara.” Àwọn ìpinnu ìtumọ̀ míì, pẹ̀lú àìdánilójú Pọ́ọ̀lù àti “Mèsáyà,” wà láìyípadà.
