id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: yo
  text: Mo mọ ọkùnrin kan nínú Mèsáyà[a] tí, ní ọdún mẹ́rìnlá sẹ́yìn—bóyá nínú ara ni, èmi kò mọ̀; bóyá níta ara ni, èmi kò mọ̀; Ọlọ́run ló mọ̀[b]—a gbé irú ẹni bẹ́ẹ̀ lọ sókè dé ọ̀run kẹta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ àtẹ̀yìnwá, “nínú Kristi.” Gíríìkì ni ἐν Χριστῷ; a lo “Mèsáyà” níbí láti pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Pọ́ọ̀lù kò sọ bóyá ìṣẹ̀lẹ̀ yìí ṣẹlẹ̀ nínú ara tàbí níta ara; ọ̀rọ̀ náà kò yan ọ̀nà tí ìrírí náà gbà ṣẹlẹ̀.
    reason: lexical_alternative
  - marker: c
    text: “Ọ̀run kẹta” jẹ́ ọ̀nà tí àwọn Júù ìgbàanì fi ń sọ̀rọ̀ nípa ọ̀run gíga jù lọ tàbí párádísè; a pa gbólóhùn náà mọ́ dípò ṣíṣe àlàyé rẹ̀ sínú ẹsẹ náà.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Mo mọ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ perfect ní ìrísí, ṣùgbọ́n ó ní ìtumọ̀ àsìkò ìsinsìnyí ní Koiné; “Mo mọ” ni Yorùbá àdánidá.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ náà jẹ́ akọ ní gírámà, ó sì ń tọ́ka sí ọkùnrin kan pàtó; “ọkùnrin kan” pa ìtumọ̀ yẹn mọ́.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè “Mèsáyà” níbí. “Nínú” tún pa ọ̀nà tí Pọ́ọ̀lù gbà ń sọ nípa ìbáṣepọ̀ ẹni pẹ̀lú Mèsáyà mọ́ láì ṣe àlàyé rẹ̀ ju ohun tí orísun sọ lọ.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: ní ọdún mẹ́rìnlá sẹ́yìn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àkókò tí ó ti kọjá fún ọdún mẹ́rìnlá.
- source_word: εἴτε ἐν σώματι
  choice: bóyá nínú ara ni
  rationale: Ó pa àìdánilójú Pọ́ọ̀lù àti ìyàtọ̀ láàárín “nínú ara” àti “ní òde ara” mọ́.
- source_word: ἐκτὸς τοῦ σώματος
  choice: ní òde ara
  rationale: Ìtumọ̀ tààrà àti kíkà-rọrùn ni èyí fún ἐκτός pẹ̀lú genitive, ó sì dúró ní ìtakora pẹ̀lú “nínú ara.”
- source_word: ὁ θεὸς οἶδεν
  choice: Ọlọ́run ló mọ̀
  rationale: Ó túmọ̀ gbólóhùn náà ní tààrà; àmì ìfọkànsìn “ló” jẹ́ àdánidá ní Yorùbá, láì fi “òun nìkan” kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: ἁρπαγέντα
  choice: a gbé ... lọ sókè
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive participle. Ìṣètò aláìlórúkọ “a gbé ... lọ sókè” jẹ́ Yorùbá àdánidá, ó sì pa ìṣe gbígbé ẹni náà lọ sókè mọ́ láì dárúkọ olùṣe tí orísun kò sọ.
- source_word: τὸν τοιοῦτον
  choice: irú ẹni bẹ́ẹ̀
  rationale: Èyí pa ìtọ́kasí demonstrative ti Gíríìkì mọ́, ó sì tún tọ́ka sí ọkùnrin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: dé ọ̀run kẹta
  rationale: “Dé” fi ibi tí gbígbé lọ sókè náà parí hàn ní Yorùbá àdánidá, “ọ̀run kẹta” sì pa gbólóhùn àṣà ayé ìgbàanì náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: A túmọ̀ oyè Χριστός sí “Mèsáyà” níbi tí agbára oyè náà ṣì ti hàn, dípò kí a sọ ọ́ di orúkọ lásán. “Nínú” pa èdè ìṣọ̀kan Pọ́ọ̀lù mọ́.
- issue: Bóyá ìrírí náà ṣẹlẹ̀ nínú ara tàbí ní òde ara
  choice: A pa àìmọ̀ Pọ́ọ̀lù mọ́ lẹ́ẹ̀mejì, a sì sọ pé Ọlọ́run ló mọ̀.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí gbígbé ara lọ sókè, tàbí gẹ́gẹ́ bí ìran tí kò ní ara.
  rationale: Gíríìkì kò pinnu bí ìṣẹ̀lẹ̀ náà ṣe rí; ó tẹnumọ́ àìmọ̀ Pọ́ọ̀lù. Nítorí náà, ìtumọ̀ náà kò yan ọ̀kan lára àwọn àlàyé méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa ìdádúró gígùn àti àsọtúnsọ “èmi kò mọ̀” mọ́ kí ìtẹnumọ́ àti àìdánilójú inú orísun lè hàn. “A gbé ... lọ sókè” yàgò fún dídárúkọ olùṣe tí Gíríìkì fi sílẹ̀ láìsọ.
