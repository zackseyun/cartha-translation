  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì mọ́ dáadáa: ọkùnrin náà wà nínú Mèsáyà, àkókò ọdún mẹ́rìnlá, àìmọ̀ Pọ́ọ̀lù lẹ́ẹ̀mejì, ìmọ̀ Ọlọ́run, àti gbígbé ẹni náà dé ọ̀run kẹta. Ṣùgbọ́n ìpo gbolohun “ní ọdún mẹ́rìnlá sẹ́yìn” kò fi hàn kedere pé ìṣẹ̀lẹ̀ gbígbé lọ sókè ni ó ṣẹlẹ̀ nígbà náà, kì í ṣe ìmọ̀ ẹni náà. “Níta ara” sì jẹ́ ìsọ̀rọ̀ Yorùbá tó mọ́gbọ́n dáradára fún ἐκτὸς τοῦ σώματος.'
