  terminology: “Mèsáyà” yẹ fún Χριστῷ ní ìbámu pẹ̀lú ìpinnu iṣẹ́ náà, “ọkùnrin kan” bójú mu ἄνθρωπον, àti “ọ̀run kẹta” pa ọ̀rọ̀ ìṣàpẹẹrẹ ayé ìgbàanì mọ́. Kò yẹ kí a túmọ̀ ìrírí náà gẹ́gẹ́ bí ti ara tàbí ti ẹ̀mí nìkan.
