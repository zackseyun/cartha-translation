id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: yo
  text: Nítorí náà, inú mi dùn nínú àwọn àìlera, nínú ẹ̀gàn, nínú ìnira, nínú inúnibíni àti wàhálà nítorí Mèsáyà[a]; nítorí nígbà tí mo bá jẹ́ aláìlera, nígbà náà ni mo lágbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ìbílẹ̀, “nítorí Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí tí Pọ́ọ̀lù fà jáde láti inú ohun tí ó sọ ṣáájú.
- source_word: εὐδοκῶ
  choice: inú mi dùn sí
  rationale: Ó sọ ìtẹ́wọ́gbà pẹ̀lú inú dídùn, kì í ṣe pé Pọ́ọ̀lù kàn fara da àwọn ohun wọ̀nyí láìfẹ́.
- source_word: ἐν ἀσθενείαις
  choice: sí àwọn àìlera
  rationale: Ọ̀pọ̀ nọ́ńbà náà àti ìtumọ̀ gbòòrò ti àìlera tàbí àìlágbára ni a pa mọ́, láìfi í mọ́ àìsàn ara nìkan.
- source_word: ἐν ὕβρεσιν
  choice: sí ẹ̀gàn
  rationale: “Ẹ̀gàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtìjú àti ọ̀rọ̀ tàbí ìwà àfojúdi tí ẹlòmíràn fi kan ènìyàn.
- source_word: ἐν ἀνάγκαις
  choice: sí ìnira
  rationale: Ó mú èrò ipò líle àti ìṣòro tí ń tẹ ènìyàn mọ́lẹ̀ jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐν διωγμοῖς
  choice: sí inúnibíni
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìpẹ̀yà tàbí ìlépa búburú nítorí ìgbàgbọ́.
- source_word: καὶ στενοχωρίαις
  choice: àti sí wàhálà
  rationale: “Wàhálà” sọ ipò ìpọ́njú àti ìhámọ́ra líle tí στενοχωρία ń tọ́ka sí ní ọ̀nà tí òǹkàwé òde òní yóò lóye.
- source_word: ὑπὲρ Χριστοῦ
  choice: nítorí Mèsáyà
  rationale: “Nítorí” lè sọ pé àwọn ìjìyà wọ̀nyí wá nítorí ìdúróṣinṣin sí Mèsáyà àti fún un; “Mèsáyà” sì pa agbára orúkọ oyè Χριστός mọ́.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: nítorí nígbà tí mo bá jẹ́ aláìlera
  rationale: Ìlò “nígbà tí ... bá” pa ìtumọ̀ àkókò gbogbogbò ti ὅταν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive mọ́.
- source_word: τότε δυνατός εἰμι
  choice: nígbà náà ni mo lágbára
  rationale: Ó pa ìtakora pàtàkì láàárín “aláìlera” àti “lágbára” mọ́ ní ṣókí àti ní kedere.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè ẹni àmì òróró; “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí “Kristi,” ìtumọ̀ àṣà, wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtakora àìlera àti agbára
  choice: nígbà tí mo bá jẹ́ aláìlera, nígbà náà ni mo lágbára
  alternative: nígbà tí mo jẹ́ aláìlera ni agbára Mèsáyà ń ṣiṣẹ́ nínú mi
  rationale: A pa gbólóhùn ìtakora Gíríìkì mọ́ láìṣàlàyé orísun agbára náà sínú ẹsẹ yìí, nítorí ẹsẹ náà fúnra rẹ̀ kò tún un sọ ní kíkún.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àtúnṣe “sí” nínú àkójọ láti mú ìbáṣepọ̀ rẹ̀ pẹ̀lú “inú mi dùn” hàn ní ti ẹ̀dá èdè Yorùbá, bó tilẹ̀ jẹ́ pé Gíríìkì tún ἐν ṣe.
