  to: Nítorí náà, inú mi dùn nínú àwọn àìlera, nínú ẹ̀gàn, nínú ìnira, nínú inúnibíni àti wàhálà nítorí Mèsáyà[a]; nítorí nígbà tí mo bá jẹ́ aláìlera, nígbà náà ni mo lágbára.
