id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: yo
  text: Ó sì ti sọ fún mi pé, “Oore-ọ̀fẹ́ mi tó fún ọ, nítorí agbára ń dé ìmúṣẹ rẹ̀ nínú àìlera.”[a] Nítorí náà, èmi yóò túbọ̀ máa fi ayọ̀ púpọ̀ ṣògo nínú àwọn àìlera mi, kí agbára Mèsáyà lè bà lé mi lórí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ẹ̀dà àfọwọ́kọ kan ní “agbára mi.” A tún lè túmọ̀ τελεῖται sí “ń di pípé”: “nítorí agbára [mi] ń di pípé nínú àìlera.”'
    reason: textual_and_lexical_alternative
  - marker: b
    text: Tàbí, “kí agbára Mèsáyà lè sinmi lé mi lórí.” Ní ṣókí gan-an, ọ̀rọ̀ Gíríìkì náà ní àwòrán “pípa àgọ́ sí mi lórí.” A tún sábà máa ń pe Mèsáyà ní “Kristi.”
    reason: lexical_and_title_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: ó sì ti sọ
  rationale: Ìṣe aláṣepé Gíríìkì tọ́ka sí ọ̀rọ̀ tí a sọ tẹ́lẹ̀ tí ipa rẹ̀ ṣì wà; “ti sọ” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Ἀρκεῖ
  choice: tó fún
  rationale: “Tó fún” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun kan péye tàbí tó láti bá àìní pàdé.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις, ó sì pa ìtumọ̀ ẹ̀bùn inú rere Ọlọ́run mọ́.
- source_word: δύναμις
  choice: agbára
  rationale: “Agbára” bá ìtumọ̀ δύναμις mu, ó sì jẹ́ kí àtúnsọ ọ̀rọ̀ náà ní ìparí ẹsẹ náà hàn gbangba.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: àìlera / àwọn àìlera
  rationale: 'A pa ìyàtọ̀ nọ́ńbà mọ́: ẹyọ kan nínú gbólóhùn Olúwa, ọ̀pọ̀ nínú ìdáhùn Paulu.'
- source_word: τελεῖται
  choice: ń dé ìpé rẹ̀
  rationale: Èyí sọ pé agbára ń dé àfojúsùn tàbí ìmúṣẹ rẹ̀, láìfi hàn pé agbára Ọlọ́run ní àbùkù tẹ́lẹ̀.
- source_word: ἥδιστα … μᾶλλον
  choice: inú mi yóò dùn gidigidi láti túbọ̀
  rationale: 'Ìtumọ̀ yìí so agbára ọ̀rọ̀ méjèèjì pọ̀ ní Yorùbá àdánidá: ayọ̀ púpọ̀ àti ìtẹnumọ́ “sí i.”'
- source_word: καυχήσομαι
  choice: ṣògo
  rationale: “Ṣògo” pa àtakò ọ̀rọ̀ Paulu mọ́—ó ń ṣògo nínú ohun tí a sábà máa ń kà sí ailágbára—láìlo “yangàn,” tó sábà ní ìtumọ̀ búburú.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: lè bà lé mi
  rationale: “Bà lé mi” jẹ́ Yorùbá tó ṣe kedere fún agbára tí ó wà lórí ẹni; àwòrán pàgọ́ tó wà nínú ọ̀rọ̀ Gíríìkì ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níbí, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè ẹni tí a fi àmì òróró yàn; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
theological_decisions:
- issue: Bó ṣe yẹ kí a túmọ̀ δύναμις ní gbólóhùn Olúwa
  choice: agbára ń dé ìpé rẹ̀ nínú àìlera
  alternative: agbára mi ń di pípé nínú àìlera
  rationale: Ọ̀rọ̀ SBLGNT tí a pèsè kò ní arọ́pò-orúkọ “mi” lẹ́gbẹ̀ẹ́ δύναμις; a kò fi í kún ọ̀rọ̀ pàtàkì. Ìtumọ̀ yìí tún pa ìfojúsùn τελεῖται mọ́ láìyanjú ìdọ̀tí ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
- issue: Bó ṣe yẹ kí a túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn; “Kristi” jẹ́ ọ̀nà ìbílẹ̀ tí ó tún ṣeé gbà.
- issue: Àwòrán inú ἐπισκηνώσῃ
  choice: lè bà lé mi
  alternative: lè pa àgọ́ rẹ̀ sí mi lórí
  rationale: Ọ̀rọ̀ pàtàkì gbọdọ̀ jẹ́ kíkà lọ́nà àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwòrán “pípa àgọ́” inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà níyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “inú mi yóò dùn gidigidi láti túbọ̀ ṣògo” dípò ìtẹ̀lé gígùn Gíríìkì kí ἥδιστα àti μᾶλλον lè dun bí Yorùbá àdánidá, nígbà tí a pa àtakò “ṣògo nínú àìlera” mọ́.
