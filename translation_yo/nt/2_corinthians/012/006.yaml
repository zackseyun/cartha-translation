    issue: ‘máa fọ́nnu’
    rationale: ‘Máa’ sábà máa ń jẹ́ àmì ìṣe àṣà tàbí ìṣe tí ń tẹ̀síwájú ní Yorùbá. Infinitive καυχήσασθαι lẹ́yìn θελήσω nílò ‘fẹ́ fọ́nnu’ láì fi aspect míì kún un.
  - severity: medium
    issue: ‘kà mí sí ju ohun ... lọ’
    rationale: Ìṣètò náà kì í rọrùn ní Yorùbá, ó sì lè má fi ìtumọ̀ λογίσηται ὑπὲρ—ìṣírò tàbí ìgbẹ́yẹ̀wò ẹni ga ju ẹ̀rí tí ó hàn—hàn ní kedere. ‘Gbẹ́ mi ga ju ... lọ’ jẹ́ àdánidá, ó sì pa ìtumọ̀ náà mọ́.
  - severity: low
    issue: ‘ohun tí ó rí lára mi’
    rationale: Ó lè dà bí ohun tí a rí lórí ara ẹni. ‘Ohun tí ó rí nípa mi’ dara fún ohun tí a ṣàkíyèsí nípa Pọ́ọ̀lù, ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì àti audit trail ilẹ̀ Gẹ̀ẹ́sì.
