review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe kékeré ni a nílò. Àwòkọ́sẹ̀ náà tọ́ka dáadáa sí ipò àròsọ, sí òtítọ́ ohun tí Pọ́ọ̀lù lè sọ, àti sí ìdí tí ó fi dáwọ́ ìfọ́nnu dúró. Ṣùgbọ́n ‘máa fọ́nnu’ lè fi ìṣe àṣà/tí ń tẹ̀síwájú kun infinitive καυχήσασθαι; ‘fẹ́ fọ́nnu’ dáa ju. Bákan náà, ‘kà mí sí ju ... lọ’ kò rọrùn ní Yorùbá fún λογίσηται ὑπὲρ ὃ; ‘gbé mi ga ju ... lọ’ sọ ìgbẹ́yẹ̀wò tí ó ga jù ẹ̀rí lọ ní kedere.
  naturalness: ‘Mo dá ara mi dúró’ jẹ́ ọ̀nà Yorùbá boṣewa, àdánidá fún φείδομαι nínú àyíká yìí. ‘Ohun tí ó rí nípa mi’ yàgò fún ìtumọ̀ tí ó lè dín βλέπει με kù sí ohun tí ó wà lórí ara ẹni nìkan, ó sì pa èrò ìwòye/ìmọ̀ ènìyàn nípa Pọ́ọ̀lù mọ́.
  terminology: ‘Fọ́nnu,’ ‘aláìgbọ́n,’ ‘òtítọ́,’ àti ‘gbé mi ga’ bá ìforígbárí ìfọ́nnu àti ìdádúró ara ẹni nínú ọ̀rọ̀ náà mu. A kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kankan kún un.
  issues:
