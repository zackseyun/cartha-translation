id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: yo
  text: Nítorí bí mo bá fẹ́ fọ́nnu, èmi kì yóò jẹ́ aláìgbọ́n, nítorí òtítọ́ ni èmi yóò sọ. Ṣùgbọ́n mo dá ara mi dúró, kí ẹnikẹ́ni má bàa gbé mi ga ju ohun tí ó rí nípa mi tàbí ohun tí ó gbọ́ láti ọ̀dọ̀ mi[a] lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “tàbí ohunkóhun tí ó gbọ́ láti ọ̀dọ̀ mi.” Ọ̀rọ̀ Gíríìkì ní ohun kan tí a kò sọ pàtó lẹ́yìn “gbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήσω
  choice: bí mo bá fẹ́
  rationale: Àpapọ̀ ἐὰν pẹ̀lú aorist subjunctive fi ipò àròsọ tí ó lè ṣẹlẹ̀ hàn; ‘bí mo bá fẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ náà mọ́.
- source_word: καυχήσασθαι
  choice: máa fọ́nnu
  rationale: Ó mú ìtumọ̀ ìṣògo tàbí ìfọ́nnu tí ọ̀rọ̀ náà ní nínú àyíká yìí jáde, pẹ̀lú ìrònú pé Pọ́ọ̀lù kò fi tayọtayọ ṣe é.
- source_word: ἄφρων
  choice: aláìgbọ́n
  rationale: Ó bá predicate adjective Gíríìkì mu, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere láì sọ ọ́ di ẹ̀sùn líle ju ti orísun lọ.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: òtítọ́ ni èmi yóò sọ
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé ohun tí yóò sọ jẹ́ òtítọ́, ó sì mú future ἐρῶ hàn nínú ipò àròsọ náà.
- source_word: φείδομαι
  choice: mo fà sẹ́yìn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Pọ́ọ̀lù dá ara rẹ̀ dúró láti má ṣe fọ́nnu síwájú; ‘fà sẹ́yìn’ jẹ́ àdánidá, ó sì ṣàfihàn ìkóra-ẹni-níjàánu.
- source_word: λογίσηται
  choice: kà mí sí
  rationale: Ó pa èrò ìṣírò tàbí ìgbéyẹ̀wò ènìyàn mọ́, ó sì bá gbolohun Yorùbá mu dáadáa.
- source_word: ὑπὲρ ὃ
  choice: ju ohun ... lọ
  rationale: Ìṣètò ‘ju ... lọ’ ni ọ̀nà Yorùbá àdánidá fún ìwọ̀n tí ó rékọjá ààlà kan.
- source_word: βλέπει με
  choice: ohun tí ó rí lára mi
  rationale: Ó tọ́ka sí ohun tí ẹnì kan lè ṣàkíyèsí nípa Pọ́ọ̀lù fúnra rẹ̀, láì fi iṣẹ́ tàbí ìṣe kan kun ohun tí Gíríìkì kò sọ ní kedere.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: ohun tí ó gbọ́ láti ẹnu mi
  rationale: Ó mú indefinite τι hàn ní gbangba gẹ́gẹ́ bí ‘ohun,’ ó sì tú ἐξ ἐμοῦ ní ọ̀nà Yorùbá àdánidá gẹ́gẹ́ bí ọ̀rọ̀ tí ó ti ẹnu Pọ́ọ̀lù jáde.
theological_decisions:
- issue: Ìṣàpèjúwe ara Pọ́ọ̀lù àti bí ó ṣe fà sẹ́yìn kúrò nínú ìfọ́nnu
  choice: 'A gbé e kalẹ̀ gẹ́gẹ́ bí ipò àròsọ: bí Pọ́ọ̀lù bá fọ́nnu, òtítọ́ ni yóò sọ, síbẹ̀ ó fà sẹ́yìn.'
  alternative: Láti túmọ̀ rẹ̀ bí ẹni pé gbogbo ìfọ́nnu Pọ́ọ̀lù tọ́ ní ti ẹ̀kọ́, tàbí bí ẹni pé gbogbo ìfọ́nnu níbí jẹ́ irọ́ tàbí ẹ̀ṣẹ̀.
  rationale: 'Gíríìkì pa ìfọ̀kànbalẹ̀ méjèèjì mọ́: ohun tí Pọ́ọ̀lù lè sọ jẹ́ òtítọ́, ṣùgbọ́n ó kọ̀ láti sọ ọ́ kí àwọn mìíràn má bàa gbé e ga ju ẹ̀rí ohun tí wọ́n rí tàbí gbọ́ lọ.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. A lo ‘èmi’ lẹ́ẹ̀mejì fún ìtẹnumọ́ tí ó bá ìlànà Gíríìkì mu, ṣùgbọ́n a yẹra fún gbolohun tí ó le tàbí ti ìjọ kan pàtó.
