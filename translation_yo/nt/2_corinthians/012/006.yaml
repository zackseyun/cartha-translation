revisions:
- from: Nítorí bí mo bá fẹ́ máa fọ́nnu, èmi kì yóò jẹ́ aláìgbọ́n, nítorí òtítọ́ ni èmi yóò sọ. Ṣùgbọ́n mo fà sẹ́yìn, kí ẹnikẹ́ni má bàa kà mí sí ju ohun tí ó rí lára mi tàbí tí ó gbọ́ láti ẹnu mi[a] lọ.
  to: Nítorí bí mo bá fẹ́ fọ́nnu, èmi kì yóò jẹ́ aláìgbọ́n, nítorí òtítọ́ ni èmi yóò sọ. Ṣùgbọ́n mo dá ara mi dúró, kí ẹnikẹ́ni má bàa gbé mi ga ju ohun tí ó rí nípa mi tàbí ohun tí ó gbọ́ láti ọ̀dọ̀ mi[a] lọ.
  rationale: A yọ ‘máa’ kúrò láti má ṣe fi aspect àṣà kún infinitive Gíríìkì. A tún ṣàtúnṣe ọ̀rọ̀ ìgbẹ́yẹ̀wò ènìyàn sí ‘gbé mi ga ju ... lọ,’ tí ó jẹ́ Yorùbá àdánidá fún kí ènìyàn má ṣe ka Pọ́ọ̀lù sí ẹni tí ó ga ju ohun tí wọ́n lè rí tàbí gbọ́ lọ. Àmì ìsàlẹ̀ a wà lẹ́yìn ‘láti ọ̀dọ̀ mi,’ níbi tí yíyan ‘ohun/ohunkóhun’ ti kan gbolohun náà.
