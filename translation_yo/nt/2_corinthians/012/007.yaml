id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: yo
  text: Àti nítorí bí àwọn ìfihàn náà ti tayọ tó—nítorí ìyẹn, kí n má bàa gbé ara mi ga—a fún mi ní ẹ̀gún kan nínú ara mi[a][e], òjíṣẹ́ Sátánì kan[b], láti máa lù mí[c], kí n má bàa gbé ara mi ga[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtí kan nínú ara mi.” Ọ̀rọ̀ Gíríìkì σκόλοψ lè túmọ̀ sí ìtí mímú, ẹ̀rún igi mímú, tàbí ẹ̀gún; àwòrán pàtó náà kò dájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “áńgẹ́lì Sátánì kan.” Ọ̀rọ̀ Gíríìkì ἄγγελος lè túmọ̀ sí “òjíṣẹ́” tàbí “áńgẹ́lì.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “láti máa dá mi lóró” tàbí “láti máa fi ìkùnwọ́ lù mí.” Ọ̀rọ̀ ìṣe κολαφίζῃ ń tọ́ka ní pàtó sí lílù ẹni tàbí fífi ìkùnwọ́ kọlù ú.
    reason: lexical_alternative
  - marker: d
    text: Gbolohun náà, “kí n má bàa gbé ara mi ga,” fara hàn lẹ́ẹ̀mejì nínú ọ̀rọ̀ Gíríìkì, a sì pa àtúnwí náà mọ́ níbí.
    reason: cross_reference
  - marker: e
    text: 'A tún lè ṣètò ìbẹ̀rẹ̀ gbolohun náà báyìí: “Àti nítorí bí àwọn ìfihàn náà ti tayọ tó, nítorí ìyẹn, kí n má bàa gbé ara mi ga, a fún mi ní ẹ̀gún kan nínú ara mi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: títóbi àrà ọ̀tọ̀ àwọn ìfihàn náà
  rationale: Ó fi ìtayọ ìwọ̀n àwọn ìfihàn náà hàn ní Yorùbá àdánidá, láì sọ pé ọ̀pọ̀ wọn ni tàbí ṣàlàyé irú wọn ju ohun tí Gíríìkì sọ lọ.
- source_word: διὸ
  choice: nítorí náà
  rationale: Ó pa ìsopọ̀ ìdí àti àbájáde mọ́ láàárín ọlá àwọn ìfihàn àti ohun tí a fún Pọ́ọ̀lù.
- source_word: ὑπεραίρωμαι
  choice: kí n má bàa gbé ara mi ga
  rationale: Ó pa ìtumọ̀ ìgbéga ara ẹni mọ́, ó sì jẹ́ kí àtúnwí gbolohun náà ní Gíríìkì hàn ní ibi méjèèjì.
- source_word: ἐδόθη μοι
  choice: a fún mi ní
  rationale: Ìlò ‘a’ aláìdárúkọ ní Yorùbá pa olùṣe tí a kò sọ ní Gíríìkì mọ́, láì fi Ọlọ́run tàbí ẹlòmíràn sí i gẹ́gẹ́ bí olùfúnni.
- source_word: σκόλοψ τῇ σαρκί
  choice: ẹ̀gún kan nínú ẹran ara mi
  rationale: ‘Ẹ̀gún’ pa àwòrán ohun mímú tí ń dáni láàmú mọ́; ‘ẹran ara’ sì yà σάρξ kúrò ní ìtumọ̀ ẹ̀kọ́ ìwà ẹlẹ́ṣẹ̀ tí ẹsẹ̀ yìí kò fi dandan sọ.
- source_word: ἄγγελος Σατανᾶ
  choice: òjíṣẹ́ Sátánì kan
  rationale: ‘Òjíṣẹ́’ ni ìtumọ̀ gbòòrò fún ἄγγελος, ó sì kò pinnu bóyá áńgẹ́lì, ẹ̀mí búburú, tàbí aṣojú mìíràn ni.
- source_word: κολαφίζῃ
  choice: láti máa lù mí
  rationale: Ó pa àwòrán lílù tàbí fífi ìkùnwọ́ kọlu ẹni mọ́; àmì ‘máa’ tún fi ìṣe tí ń tẹ̀ síwájú tàbí tí ń ṣẹlẹ̀ léraléra hàn.
theological_decisions:
- issue: Irú ‘ẹ̀gún nínú ẹran ara’ Pọ́ọ̀lù
  choice: A pa àkàwé ‘ẹ̀gún’ mọ́ láì sọ ohun tí ó jẹ́ gan-an.
  alternative: Àìsàn ara, inúnibíni, ìkọlù ẹ̀mí búburú, tàbí ìpọ́njú mìíràn.
  rationale: Ọ̀rọ̀ Gíríìkì kò dá irú ìpọ́njú náà mọ́; ṣíṣàlàyé rẹ̀ sí ọ̀nà kan ṣoṣo yóò kọjá ẹ̀rí ọ̀rọ̀ náà.
- issue: Ẹni tí ó fún Pọ́ọ̀lù ní ẹ̀gún náà
  choice: A lo ọ̀nà aláìdárúkọ ‘a fún mi ní’.
  alternative: Ọlọ́run fún mi ní i; a sì yọ̀ǹda rẹ̀.
  rationale: Gíríìkì lo ọ̀rọ̀ aṣepalẹ̀ láì dárúkọ olùṣe; ìtumọ̀ náà pa ìṣòro tó wà láàárín ìyọ̀ǹda Ọlọ́run àti iṣẹ́ Sátánì mọ́.
- issue: Ìdánimọ̀ ἄγγελος Σατανᾶ
  choice: òjíṣẹ́ Sátánì
  alternative: áńgẹ́lì Sátánì
  rationale: ἄγγελος lè túmọ̀ sí òjíṣẹ́ tàbí áńgẹ́lì; ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú ìdánimọ̀ aṣojú náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ìgbàlódé, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àmì gígùn ya gbólóhùn ète àkọ́kọ́ sọ́tọ̀ kí ìbẹ̀rẹ̀ tó tẹ̀ lé ìṣètò Gíríìkì lè ṣe kedere. ‘Ẹran ara’ mọ̀ọ́mọ̀ pa àwòrán ara ẹlẹ́ran-ara mọ́; ‘òjíṣẹ́’ sì yẹra fún pípinnu irú ẹni tàbí ẹ̀dá tí aṣojú Sátánì jẹ́.
