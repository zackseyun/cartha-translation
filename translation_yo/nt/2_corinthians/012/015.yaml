id: 2CO.12.15
reference: 2 Corinthians 12:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: yo
  text: Ṣùgbọ́n èmi yóò fi ayọ̀ ńlá ná ohun tí mo ní, a ó sì ná mi tán fún ẹ̀mí yín.[a] Bí mo bá fẹ́ràn yín ní ìwọ̀n tó pọ̀ sí i, ṣé ẹ fẹ́ràn mi ní ìwọ̀n tó kéré jù?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìyè yín” tàbí “ẹ̀yin fúnra yín” dípò “ẹ̀mí yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: Ó fi ìmúratán àti ìtẹ́lọ́rùn Pọ́ọ̀lù hàn ní ọ̀nà Yorùbá àdánidá, kì í ṣe gbígbà lásán.
- source_word: δαπανήσω
  choice: ná ohun gbogbo
  rationale: “Ná” pa àwòrán lílo ohun-ìní mọ́; “ohun gbogbo” mú ìtẹnumọ́ ọ̀rọ̀ náà yé kedere láì sọ ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἐκδαπανηθήσομαι
  choice: a ó sì ná èmi
  rationale: 'Ìṣe aláìṣe-taara ọjọ́ iwájú náà tẹ̀ síwájú láti inú “ná”: kì í ṣe ohun tí Pọ́ọ̀lù ní nìkan, ṣùgbọ́n òun fúnra rẹ̀ ni a ó ná. Ìtúmọ̀ yìí mọ̀ọ́mọ̀ pa àwòrán Gíríìkì mọ́ bí ó tilẹ̀ jẹ́ pé ó ní agbára ewì díẹ̀ ní Yorùbá.'
- source_word: ὑπὲρ
  choice: fún
  rationale: Níhìn-ín ó tọ́ka sí àǹfààní tàbí ire àwọn ará Kọ́ríńtì; “fún” jẹ́ kúkúrú, ó sì bá èdè Yorùbá mu.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: ẹ̀mí yín
  rationale: “Ẹ̀mí” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ψυχή ní àyíká ìtọ́jú olùṣọ́-agùntàn, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ “ẹ̀mí/ìyè/ẹ̀yin fúnra yín” sílẹ̀ láì fi ẹ̀kọ́ nípa ìwà ènìyàn kan lé e lórí.
- source_word: εἰ
  choice: bí ... bá
  rationale: Ó pa ìrísí gbólóhùn oníṣ条件 rhetorical mọ́, kò sì yí i sí “nítorí pé” tàbí “níwọ̀n bí” tí yóò tú ìṣòro náà sílẹ̀.
- source_word: περισσοτέρως
  choice: lọ́pọ̀lọpọ̀ sí i
  rationale: Ó fi ìwọ̀n àfikún tí ọ̀rọ̀ afiwéra Gíríìkì ní hàn ju “sí i” lásán lọ, ó sì jẹ́ Yorùbá tí ó ṣeé lóye.
- source_word: ἀγαπῶν
  choice: mo bá fẹ́ràn
  rationale: A tú participle náà sí gbólóhùn-ìṣe gẹ́gẹ́ bí èdè Yorùbá ṣe ń gba nínú gbólóhùn ìbéèrè yìí.
- source_word: ἧσσον
  choice: díẹ̀ sí i
  rationale: Ó pa ìfiwéra pẹ̀lú “lọ́pọ̀lọpọ̀ sí i” mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: ἀγαπῶμαι
  choice: ẹ ó fẹ́ràn mi
  rationale: Yorùbá sábà ń lo ìṣe aláṣe níbi tí Gíríìkì ti lo passive; ẹni tí ó ń ṣe ìfẹ́ náà hàn nínú ọ̀rọ̀ àyíká gẹ́gẹ́ bí “ẹ,” ìtumọ̀ náà sì dúró gẹ́gẹ́ bí ìbéèrè ẹ̀dùn.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ ìtọ́jú Pọ́ọ̀lù
  choice: ẹ̀mí yín
  alternative: ìyè yín; ẹ̀yin fúnra yín
  rationale: “Ẹ̀mí yín” pa ìwọ̀n ẹ̀mí àti ìtọ́jú jíjinlẹ̀ mọ́, ṣùgbọ́n ψυχή lè tọ́ka sí ìyè tàbí ènìyàn fúnra rẹ̀. Nítorí náà, àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ náà mọ́, kò sì fi ìpín ọkàn-ara kan múlẹ̀.
- issue: Agbára εἰ nínú ìbéèrè rhetorical
  choice: Bí ... bá
  alternative: Níwọ̀n bí; bí ó bá jẹ́ pé
  rationale: Ìtumọ̀ conditional náà pa ìforígbárí àti ẹ̀dùn inú ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì pinnu pé εἰ túmọ̀ sí ìdí (“níwọ̀n bí”) ní pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A pa àwòrán lílo owó nínú δαπανήσω/ἐκδαπανηθήσομαι mọ́ nípasẹ̀ “ná,” a sì lo ìbéèrè “ṣé” fún agbára rhetorical àdánidá. Gbogbo àmì ohùn àti àmì ìsàlẹ̀ [a] wà níbi tó yẹ.
