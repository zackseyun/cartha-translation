revisions:
- from: Ṣùgbọ́n èmi yóò fi ayọ̀ ńlá ná ohun gbogbo, a ó sì ná èmi fún ẹ̀mí yín.[a] Bí mo bá fẹ́ràn yín lọ́pọ̀lọpọ̀ sí i, ṣé ẹ ó fẹ́ràn mi díẹ̀ sí i?
  to: Ṣùgbọ́n èmi yóò fi ayọ̀ ńlá ná ohun tí mo ní, a ó sì ná mi tán fún ẹ̀mí yín.[a] Bí mo bá fẹ́ràn yín ní ìwọ̀n tó pọ̀ sí i, ṣé ẹ fẹ́ràn mi ní ìwọ̀n tó kéré jù?
  rationale: Àtúnṣe náà yọ àfikún “ohun gbogbo” kúrò, ó sì rọ́pò rẹ̀ pẹ̀lú “ohun tí mo ní,” èyí tí ń jẹ́ kí àfiwé δαπανάω nípa lílo ohun-ìní yé wa ní Yorùbá. “A ó sì ná mi tán” ṣètò passive náà ní èdè Yorùbá tó tọ́, ó sì fi ìmúgbòòrò ἐκδαπανηθήσομαι hàn. Ìpín kejì tún sọ ìfiwéra ‘more/less’ ní kedere, láì sọ ‘more’ níbi tí ọrọ̀ orísun ti sọ ‘less.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:43Z'
