  verdict: revise
  source_fidelity: Ìtumọ̀ náà ní ìfẹ́ Pọ́ọ̀lù láti fi ayọ̀ ná ara rẹ̀ fún ire àwọn olùgbọ́, ó sì pa ìrísí ìbéèrè oníṣòro εἰ mọ́. Ṣùgbọ́n “ohun gbogbo” ń fi ohun tí kò hàn nínú ọrọ̀ Gíríìkì kún un; “a ó sì ná èmi” kò tọ́ ní ìlò aṣojú-ọrọ Yorùbá; àti “díẹ̀ sí i” túmọ̀ sí afikun díẹ̀, kì í ṣe pé a fẹ́ràn ẹni náà ní ìwọ̀n tí ó kéré jù.
  naturalness: “Ná ohun tí mo ní” àti “ná mi tán” jẹ́ Yorùbá tí ó rọrùn, ó sì fi àfiwé lílo ohun-ìní àti lílo ara ẹni hàn. “Ní ìwọ̀n tó pọ̀ sí i” àti “ní ìwọ̀n tó kéré jù” ṣe ìfiwéra ọ̀rọ̀ náà ní kedere.
