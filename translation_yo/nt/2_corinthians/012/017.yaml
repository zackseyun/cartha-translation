review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìbéèrè àsọyé tí μή ń mú wá, ẹgbẹ́ àwọn tí Pọ́ọ̀lù rán, àti ìṣe πλεονεκτέω mọ́. Ṣùgbọ́n ìṣètò lọwọlọwọ—“fi ẹnikẹ́ni ... nípasẹ̀ rẹ̀”—fi irinṣẹ́ méjì tí ó ń tọ́ka sí ẹni kan náà sílẹ̀, ó sì lè dà bíi pé ẹni mìíràn ni “rẹ̀” ń tọ́ka sí.
  naturalness: “Ré yín jẹ́” jẹ́ ọ̀nà Yorùbá tí ó ṣeé yé láti sọ ṣíṣe àǹfààní ẹlòmíràn lọ́nà àìtọ́. Fífún gbolohun náà ní ìṣètò “nípasẹ̀ ẹnikẹ́ni nínú...” mú un kedere, ó sì dáa ju arọ́pò-orúkọ “rẹ̀” tí ó lè ṣẹ̀ṣẹ̀ dààmú lọ.
  terminology: “Ré yín jẹ́” bójú mu fún πλεονεκτέω nínú àyíká yìí. Àlàyé ìsàlẹ̀ yẹ kí ó lo “jẹ yín ní àǹfààní,” kì í ṣe “jẹ àǹfààní yín,” kí ìtumọ̀ rẹ̀ lè péye ní Yorùbá.
  issues:
  - severity: medium
    issue: Arọ́pò-orúkọ “rẹ̀” lẹ́yìn “fi ẹnikẹ́ni ...” jẹ́ àtúnṣàpèjúwe tí ó lè mú ìtọ́kasí dàrú.
    rationale: δι’ αὐτοῦ ń tọ́ka sí ẹnikẹ́ni nínú ẹgbẹ́ tí a rán. Ní Yorùbá, “nípasẹ̀ ẹnikẹ́ni nínú àwọn tí mo rán sí yín” sọ ìbáṣepọ̀ pínpín náà ní kedere láìsọ ọ́ di ẹni mìíràn.
  - severity: low
    issue: “jẹ àǹfààní yín” nínú àlàyé ìsàlẹ̀ kò rọrùn gẹ́gẹ́ bí ìpèdè Yorùbá.
    rationale: Ìpèdè àdánidá ni “jẹ yín ní àǹfààní”; ó sì ṣàfihàn ìtumọ̀ “take advantage of you” dáadáa.
