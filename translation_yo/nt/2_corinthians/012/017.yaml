translation_notes:
  register: Èdè Yorùbá àkókò yìí, tó bójú mu, tó níyì, tí ó sì ṣeé yé fún òǹkàwé gbogbogbò ni a lò. Àmì ohùn ni a fi sí ibi tí ó yẹ; ìbéèrè àsọyé àti arọ́pò-orúkọ ẹyọ kan inú orísun ni a pa mọ́.
