  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: yo
  text: Ṣé mo ha ré yín jẹ́ nípasẹ̀ ẹnikẹ́ni nínú àwọn tí mo rán sí yín?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “jẹ yín ní àǹfààní” tàbí “fi ẹ̀tàn gba ohun yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka sí níní èrè ní ìnáwó ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Ṣé ... ha ...?
  rationale: Ó mú ìbéèrè àsọyé tí ó ń retí ìdáhùn òdì jáde ní Yorùbá láìfi ọ̀rọ̀ òdì tí kò bá èdè mu kún un.
- source_word: τινα ὧν
  choice: ẹnikẹ́ni nínú àwọn tí
  rationale: 'Ó pa ìtumọ̀ apá-inú-àwùjọ mọ́: ẹnikẹ́ni lára àwọn tí Pọ́ọ̀lù ti rán.'
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: mo rán sí yín
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Pọ́ọ̀lù rán àwọn aṣojú sí àwọn ará Kọ́ríńtì.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: A pa arọ́pò-orúkọ ẹyọ kan inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó ń tọ́ka lọ́nà pínpín sí ẹnikẹ́ni tí a mẹ́nu kàn ṣáájú.
- source_word: ἐπλεονέκτησα
  choice: ré yín jẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí lílo ẹlòmíràn fún èrè àìṣòdodo tàbí jíjẹ àǹfààní rẹ̀, ó sì bá àyíká ọ̀rọ̀ owó àti ìbáṣepọ̀ mu.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ènìyàn ni, ó ń tọ́ka sí àwọn onígbàgbọ́ ní Kọ́ríńtì.
