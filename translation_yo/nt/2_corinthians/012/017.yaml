  rationale: Àtúnṣe náà tún ìṣètò gbolohun ṣe kí “nípasẹ̀” lè darapọ̀ mọ́ ẹni tí Pọ́ọ̀lù rán ní tààràtà. Ó pa ẹyọ arọ́pò-orúkọ Gíríìkì àti ìtumọ̀ pínpín rẹ̀ mọ́ ní ọ̀nà Yorùbá tí ó rọrùn, ó sì tún àlàyé ọ̀rọ̀ ìsàlẹ̀ ṣe fún ìpèdè tó péye.
