id: 2CO.12.12
reference: 2 Corinthians 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: yo
  text: Lóòótọ́, àwọn àmì ti àpọ́sítélì kan ni a ṣe láàárín yín pẹ̀lú gbogbo ìfaradà, pẹ̀lú àwọn àmì, àwọn iṣẹ́ ìyanu àti àwọn iṣẹ́ agbára.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Àwọn iṣẹ́ agbára’ tún lè túmọ̀ sí ‘àwọn iṣẹ́ ìyanu’ tàbí ‘àwọn iṣẹ́ ńlá’; ọ̀rọ̀ Gíríìkì náà tẹnumọ́ àwọn iṣẹ́ tí agbára mú ṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Àwọn àmì ... ní ti tòótọ́
  rationale: μέν fi ìmúdájú tàbí ìtẹnumọ́ hàn níbí láìsí δέ tí a sọ jáde; ‘ní ti tòótọ́’ mú ìtẹnumọ́ náà wá sí Yorùbá àdánidá, nígbà tí ‘àmì’ pa ìtumọ̀ σημεῖα mọ́.
- source_word: τοῦ ἀποστόλου
  choice: àpọ́sítélì
  rationale: Ìsopọ̀ genitive náà lè jẹ́ ti ànímọ́ tàbí ti gbogbogbò, ìyẹn àwọn àmì tí ó ń fi àpọ́sítélì hàn; Yorùbá ‘àwọn àmì àpọ́sítélì’ pa àìdánilójú yìí mọ́ láìfi ọ̀rọ̀ àfihàn kan sí i.
- source_word: κατειργάσθη
  choice: ni a ṣe
  rationale: Aorist passive náà tọ́ka sí pé a mú àwọn àmì náà ṣẹ tàbí ṣe wọn. ‘Ni a ṣe’ jẹ́ àdánidá, ó sì pa ohùn àìṣèlú (passive) mọ́ láìsọ ẹni tí ó ṣe wọn ní pàtó.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ní àwùjọ àwọn ará Kọ́ríńtì, kì í ṣe ohun inú wọn.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: pẹ̀lú gbogbo ìfaradà
  rationale: ὑπομονή túmọ̀ sí dídúró ṣinṣin àti fífaradà lábẹ́ ìṣòro; ‘ìfaradà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: pẹ̀lú àwọn àmì, àwọn iṣẹ́ ìyanu àti àwọn iṣẹ́ agbára
  rationale: 'Ìtumọ̀ yìí ya àwọn ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta sọ́tọ̀: σημεῖα gẹ́gẹ́ bí ‘àmì,’ τέρατα gẹ́gẹ́ bí ‘iṣẹ́ ìyanu,’ àti δυνάμεις gẹ́gẹ́ bí ‘iṣẹ́ agbára,’ láìsọ gbogbo wọn di ‘iṣẹ́ ìyanu’ nìkan.'
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn àmì àpọ́sítélì’
  choice: Gbólóhùn náà ń tọ́ka sí ẹ̀rí tàbí àmì tí ń jẹ́rìí sí iṣẹ́ àpọ́sítélì, gẹ́gẹ́ bí a ti rí i nínú ìfaradà àti àwọn iṣẹ́ agbára.
  alternative: Kí a ka gbólóhùn náà sí àwọn iṣẹ́ ìyanu nìkan gẹ́gẹ́ bí ohun tí ń dá àpọ́sítélì mọ̀.
  rationale: Ìṣètò gbólóhùn náà kọ́kọ́ sọ ‘àwọn àmì àpọ́sítélì,’ lẹ́yìn náà ó fi ìfaradà àti àwọn iṣẹ́ ìyanu ṣàlàyé rẹ̀. Ìtumọ̀ náà kò fi ipa yan àlàyé ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Àwọn àmì àpọ́sítélì’ mọ̀ọ́mọ̀ pa àìdánilójú genitive Gíríìkì mọ́.
