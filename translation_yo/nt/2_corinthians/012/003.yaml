id: 2CO.12.3
reference: 2 Corinthians 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: yo
  text: Mo sì mọ irú ọkùnrin bẹ́ẹ̀—yálà ó wà nínú ara tàbí ní òde ara, èmi kò mọ̀[a]; Ọlọ́run ni ó mọ̀—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ní òde ara” sí “láìsí ara.” Pọ́ọ̀lù kò sọ bóyá ìrírí náà ṣẹlẹ̀ nínú ara tàbí ní òde ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: mọ
  rationale: “Mọ” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìmọ̀ ohun kan; a tún un lò ní gbogbo ẹsẹ náà láti pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: irú ọkùnrin bẹ́ẹ̀
  rationale: Àṣàyàn yìí pa akọ ẹyọ kan àti ọ̀nà tí Pọ́ọ̀lù fi ń tọ́ka sí ara rẹ̀ lọ́nà àìṣe tààrà mọ́.
- source_word: εἴτε ... εἴτε
  choice: yálà ... tàbí
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti gbé ohun méjì tí ó ṣeé ṣe kalẹ̀.
- source_word: ἐν σώματι
  choice: nínú ara
  rationale: Ó ṣe déédé pẹ̀lú Gíríìkì, ó sì bá èdè Yorùbá mu nínú ìyàtọ̀ rẹ̀ sí “ní òde ara.”
- source_word: χωρὶς τοῦ σώματος
  choice: ní òde ara
  rationale: Ó fi ìyapa kúrò lára hàn láìdá irú ipò ẹ̀mí tàbí ìrírí náà lójú ju ohun tí Gíríìkì sọ lọ.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: èmi kò mọ̀; Ọlọ́run ni ó mọ̀
  rationale: “Èmi” àti “ni” mú ìyàtọ̀ láàárín àìmọ̀ Pọ́ọ̀lù àti ìmọ̀ Ọlọ́run hàn kedere, gẹ́gẹ́ bí ìtẹnumọ́ inú Gíríìkì.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún Ọlọ́run.
theological_decisions:
- issue: Ìtọ́ka Pọ́ọ̀lù sí ara rẹ̀ lọ́nà àìṣe tààrà àti irú ìrírí náà
  choice: A pa “irú ọkùnrin bẹ́ẹ̀” mọ́, a kò sọ ní tààrà pé Pọ́ọ̀lù ni, a kò sì pinnu bóyá ìrírí náà ṣẹlẹ̀ nínú ara tàbí ní òde ara.
  alternative: Lílo “irú ẹni bẹ́ẹ̀,” fífi orúkọ Pọ́ọ̀lù sínú ẹsẹ náà, tàbí títúmọ̀ ọ́ bí ìrírí tí ẹ̀mí fi ara sílẹ̀ dájúdájú.
  rationale: Gíríìkì pa ìjìnnà ọ̀rọ̀ Pọ́ọ̀lù àti àìdájú nípa bí ìrírí náà ṣe ṣẹlẹ̀ mọ́; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò yanjú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojú, ọlọ́lá, tí ó sì ṣeé lóye. “Ọkùnrin” pa akọ ẹyọ inú Gíríìkì mọ́; “ní òde ara” jẹ́ àdánidá ju ìtumọ̀ gígùn lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn míì hàn. Àmì dásì ní ìbẹ̀rẹ̀ àti òpin pa ìṣàn gbólóhùn tí ó tẹ̀ sí ẹsẹ tó tẹ̀ lé e mọ́.
