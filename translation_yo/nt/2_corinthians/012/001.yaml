revisions:
- from: 'Ṣíṣògo pọndandan, bí ó tilẹ̀ jẹ́ pé kò ṣàǹfààní; ṣùgbọ́n èmi yóò tẹ̀ síwájú sí àwọn ìran àti àwọn ìṣípayá ti Olúwa.[a]


    [a] A tún lè túmọ̀ rẹ̀ sí “láti ọ̀dọ̀ Olúwa.” Ìbátan ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí orísun àwọn ìran àti ìṣípayá náà, ṣùgbọ́n “ti Olúwa” dá àìdánilójú inú ọ̀rọ̀ náà sí.'
  to: Ṣíṣògo jẹ́ dandan, bí ó tilẹ̀ jẹ́ pé kò ní àǹfààní; ṣùgbọ́n n óò sì wá sọ nípa àwọn ìran àti àwọn ìṣípayá ti Olúwa.[a]
  rationale: Àtúnṣe náà mú kí gbolóhùn Yorùbá péye àti àdánidá jù, ní pàtàkì nínú àsopọ̀-ọrọ̀ ‘jẹ́’ àti ọ̀nà tí a fi yí sí kókó àwọn ìran àti ìṣípayá. Ó tún ṣètò gbolóhùn ìsàlẹ̀ láti pa àìpàtó genitive κυρίου mọ́. Ìtumọ̀, ìforúkọsílẹ̀, àti ìbátan μέν…δέ nínú ọ̀rọ̀ orísun kò yí.
