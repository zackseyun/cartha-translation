id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: yo
  text: Ṣíṣògo jẹ́ dandan, bí ó tilẹ̀ jẹ́ pé kò ní àǹfààní; ṣùgbọ́n n óò sì wá sọ nípa àwọn ìran àti àwọn ìṣípayá ti Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti ọ̀dọ̀ Olúwa.” Ìbátan genitive Gíríìkì náà lè tọ́ka sí orísun àwọn ìran àti ìṣípayá náà, ṣùgbọ́n “ti Olúwa” pa ìbátan tí kò ṣe pàtó nínú ọ̀rọ̀ Gíríìkì mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: Ṣíṣògo
  rationale: Ọ̀rọ̀-orúkọ tí a dá láti inú ọ̀rọ̀-ìṣe yìí pa èrò ‘ṣògo’ mọ́, ó sì bá ìtumọ̀ infinitive tí a lò gẹ́gẹ́ bí kókó gbólóhùn mu.
- source_word: δεῖ
  choice: pọndandan
  rationale: Ó fi ìdandan hàn ní kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti so δεῖ pọ̀ mọ́ ṣíṣògo.
- source_word: οὐ συμφέρον μέν
  choice: bí ó tilẹ̀ jẹ́ pé kò ṣàǹfààní
  rationale: ‘Kò ṣàǹfààní’ mú ìtumọ̀ ohun tí kò ṣe ni láǹfààní jáde; ‘bí ó tilẹ̀ jẹ́ pé’ sì fi ìyọ̀ǹda μέν hàn kí δέ tó tẹ̀ lé.
- source_word: ἐλεύσομαι δὲ
  choice: ṣùgbọ́n èmi yóò tẹ̀ síwájú
  rationale: Nínú àyíká yìí, ἔρχομαι εἰς ń tọ́ka sí lílọ sí kókó ọ̀rọ̀ mìíràn; ‘tẹ̀ síwájú sí’ jẹ́ àdánidá ju títúmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí ‘wá’ lọ.
- source_word: εἰς ὀπτασίας
  choice: sí àwọn ìran
  rationale: ‘Ìran’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ohun àràmàǹdà tí a fi hàn sí ẹni kan, ó sì pa ọ̀pọ̀ nọ́ńbà mọ́.
- source_word: καὶ ἀποκαλύψεις
  choice: àti àwọn ìṣípayá
  rationale: ‘Ìṣípayá’ sọ ìṣe ṣíṣí ohun tí ó farapamọ́ payá, ó sì bá ìtumọ̀ ἀποκάλυψις mu.
- source_word: κυρίου
  choice: ti Olúwa
  rationale: ‘Ti Olúwa’ tẹ̀ lé ìbátan genitive náà láì pinnu bóyá ó túmọ̀ sí ohun tí ó ti ọ̀dọ̀ Olúwa wá tàbí ìbátan mìíràn pẹ̀lú Olúwa.
theological_decisions:
- issue: Ìbátan κυρίου pẹ̀lú ‘àwọn ìran àti àwọn ìṣípayá’
  choice: ti Olúwa
  alternative: láti ọ̀dọ̀ Olúwa
  rationale: Genitive Gíríìkì lè tọ́ka sí orísun, ṣùgbọ́n kò sọ ìbátan náà di pàtó. ‘Ti Olúwa’ pa àìdánilójú àti ìfarabalẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì ni a lò. ‘Ṣíṣògo pọndandan’ pa ìṣètò aláìlẹ́ni-pàtó ti Gíríìkì mọ́; lílo ‘èmi’ lẹ́yìn ‘ṣùgbọ́n’ mú ìyípadà sí ẹni àkọ́kọ́ hàn ní kedere. Àmì àárín gbólóhùn náà tún fi ìbátan μέν…δέ hàn láì mú kí Yorùbá di líle.
