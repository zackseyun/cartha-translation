  source_fidelity: Ìtumọ̀ náà gba ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì—ìṣògo, ìdandan, àìní-ìlò/láǹfààní, ìran, ìṣípayá, àti genitive ‘ti Olúwa’—ní ìdúróṣinṣin. Àmọ́, ‘tẹ̀ síwájú sí àwọn ìran’ kò rọrùn gẹ́gẹ́ bí Yorùbá, níbi tí Gíríìkì ti ń sọ pé Pọ́ọ̀lù yóò yí sí kókó àwọn ìran àti ìṣípayá.
  naturalness: ‘Ṣíṣògo pọndandan’ nílò àsopọ̀-ọrọ̀ ‘jẹ́’ fún gbolóhùn Yorùbá òde òní tí ó péye. ‘kò ṣàǹfààní’ tún kéré sí ìlò àdánidá ju ‘kò ní àǹfààní’ lọ nínú àyíká yìí. A tún ṣe àtúnṣe gbolóhùn àlàyé ìsàlẹ̀ kí ó máa sọ pé ìtumọ̀ náà ń pa àìpàtó genitive mọ́, kì í ṣe pé ó ‘dá àìdánilójú sí.’
  terminology: ‘Ìran,’ ‘ìṣípayá,’ àti ‘Olúwa’ yẹ, wọ́n sì bá ọ̀rọ̀ ìjọsìn Yorùbá boṣewa mu. ‘Ti Olúwa’ dára fún pípa ìbátan κυρίου tí kò ṣe pàtó mọ́, pẹ̀lú ìtọ́kasí ìsàlẹ̀ sí ‘láti ọ̀dọ̀ Olúwa.’
