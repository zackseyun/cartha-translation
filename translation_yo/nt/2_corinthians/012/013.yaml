    rationale: Ó lè ṣeé lóye, ṣùgbọ́n ‘rẹlẹ̀’ lè ní èrò ìrẹ̀lẹ̀ ẹni. ‘Àìníláǹfààní’ túbọ̀ mú ìtumọ̀ ‘disadvantaged/treated as inferior’ nínú àyíká ìfiwéra hàn.
