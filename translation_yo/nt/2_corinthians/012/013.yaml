id: 2CO.12.13
reference: 2 Corinthians 12:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: yo
  text: Nítorí, ní ohun wo ni a fi ṣe yín ní àìníláǹfààní ju àwọn ìjọ yòókù lọ,[a] àfi pé èmi fúnra mi kò di ẹrù fún yín?[b] Ẹ dáríjì mí fún àìṣòdodo yìí![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sọ yín di ẹni tí ó kéré sí àwọn ìjọ mìíràn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan sí ipò àìníláǹfààní tàbí kíkà á sí ẹni tí ó kéré sí ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé Pọ́ọ̀lù kò gba àtìlẹ́yìn lọ́wọ́ wọn ní ọ̀nà tí yóò fi jẹ́ ẹrù owó fún wọn.
    reason: cultural_note
  - marker: c
    text: 'Pọ́ọ̀lù ń sọ̀rọ̀ lọ́nà ẹlẹ́yà: “àìṣòdodo” tí wọ́n rò pé ó ṣe ni pé ó kọ̀ láti di ẹrù fún wọn.'
    reason: cross_reference
lexical_decisions:
- source_word: ἡσσώθητε
  choice: a fi yín sí ipò tí ó rẹlẹ̀
  rationale: Ọ̀rọ̀ ìṣe aláìṣe yìí lè túmọ̀ sí pé a fi ẹnì kan sí ipò àìníláǹfààní tàbí pé a ka a sí ẹni tí ó rẹlẹ̀. Ìtumọ̀ yìí pa ohùn ìfiwéra àti ìbéèrè ẹlẹ́yà Pọ́ọ̀lù mọ́ láìsọ pé àwọn ará Kọ́ríńtì rẹlẹ̀ ní ìwà tàbí ní ìdánimọ̀.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: ju àwọn ìjọ yòókù lọ
  rationale: Ní ọ̀rọ̀ yìí, ὑπέρ ń fi ìfiwéra hàn. Èdè Yorùbá ‘ju … lọ’ ni ọ̀nà àdánidá láti sọ ìfiwéra náà.
- source_word: λοιπὰς ἐκκλησίας
  choice: àwọn ìjọ yòókù
  rationale: λοιπός túmọ̀ sí ‘àwọn tó kù’ tàbí ‘àwọn mìíràn’; ‘àwọn ìjọ yòókù’ bá àyíká ọ̀rọ̀ mu, níbi tí Pọ́ọ̀lù ti ń fi ìjọ Kọ́ríńtì wé àwọn ìjọ mìíràn.
- source_word: αὐτὸς ἐγὼ
  choice: èmi fúnra mi
  rationale: Àpapọ̀ ọ̀rọ̀ arọ́pò-orúkọ yìí tẹnu mọ́ Pọ́ọ̀lù fúnra rẹ̀. ‘Èmi fúnra mi’ pa ìtẹnumọ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: kò di ẹrù fún yín
  rationale: καταναρκάω ní àyíká 2 Kọ́ríńtì ń tọ́ka sí jíjẹ ẹrù owó tàbí ohun ìní fún ẹlòmíràn. ‘Di ẹrù fún yín’ sọ ìtumọ̀ náà ní kedere láìṣe àfikún ọ̀rọ̀ tí kò sí nínú Gíríìkì.
- source_word: χαρίσασθέ μοι
  choice: Ẹ dárí … jì mí
  rationale: χαρίζομαι lè túmọ̀ sí fífúnni lọ́fẹ̀ẹ́ tàbí dídáríjì. Nínú àṣẹ ẹlẹ́yà tí ó parí ẹsẹ yìí, ‘Ẹ dárí … jì mí’ mú ète ọ̀rọ̀ náà jáde dáadáa.
- source_word: τὴν ἀδικίαν ταύτην
  choice: àìṣòdodo yìí
  rationale: ἀδικία lè túmọ̀ sí ohun tí kò tọ́, ìṣìnà, tàbí àìṣòdodo. ‘Àìṣòdodo yìí’ pa agbára ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká àti àlàyé ìsàlẹ̀ fi hàn pé Pọ́ọ̀lù ń sọ ọ́ lọ́nà ẹlẹ́yà.
- source_word: τί γάρ ἐστιν ὃ
  choice: Nítorí náà, nípa kí ni
  rationale: Gbólóhùn náà bẹ̀rẹ̀ ìbéèrè àsọyé nípa apá wo ni a fi wọ́n sí ipò àìníláǹfààní. ‘Nítorí náà, nípa kí ni’ pa ìsopọ̀ γάρ àti ìbéèrè náà mọ́ ní Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Àwíyé ẹlẹ́yà Pọ́ọ̀lù nípa àtìlẹ́yìn owó
  choice: A túmọ̀ gbólóhùn náà ní tààrà, a sì pa ìfọ̀rọ̀-ẹlẹ́yà mọ́ nínú ‘Ẹ dárí àìṣòdodo yìí jì mí!’
  alternative: Ṣí ìtumọ̀ ẹlẹ́yà náà síta nínú ẹsẹ, bí ‘Ẹ jọ̀wọ́, ẹ dárí ẹ̀ṣẹ̀ búburú yìí jì mí.’
  rationale: Ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ fúnra wọn fi ìfọ̀rọ̀-ẹlẹ́yà hàn. Kíkọ àlàyé àsọdùn sínú ẹsẹ yóò fi ohun tí kò sí nínú orísun kún un; àlàyé ìsàlẹ̀ lè ran òǹkàwé lọ́wọ́ láìdín agbára àsọyé Pọ́ọ̀lù kù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ìjọ’ jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀ fún ἐκκλησία; ‘di ẹrù fún yín’ sì jẹ́ àpẹẹrẹ àdánidá fún ẹrù owó tàbí ohun ìní. Àwọn àmì ìsàlẹ̀ [a], [b], àti [c] wà ní ibi tí ọ̀kọ̀ọ̀kan ti kan nínú ẹsẹ.
