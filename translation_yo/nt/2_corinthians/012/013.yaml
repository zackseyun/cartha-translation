    issue: ‘Nítorí náà’ fún τί γὰρ ἐστιν ὃ
    rationale: ‘Nítorí náà’ máa ń fi ìparí èrò tàbí ìyọrísí hàn, ṣùgbọ́n γάρ níbí ń fúnni ní ìdí tàbí ìtẹ̀síwájú àríyànjiyàn. ‘Nítorí’ nìkan sún mọ́ orísun.
