id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: yo
  text: Mo bẹ̀rù pé nígbà tí mo bá tún dé, Ọlọ́run mi lè mú mi rẹ̀lẹ̀ níwájú yín[a], èmi yóò sì ṣọ̀fọ̀ fún ọ̀pọ̀ àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀[b], tí wọn kò sì ronúpìwàdà kúrò nínú ìwà àìmọ́, ìṣekúṣe[c], àti ìwà àìnítìjú[d] tí wọ́n hù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run mi lè tẹ́ mi ba láàárín yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “mú rẹ̀lẹ̀,” “mú ẹni rẹ̀ sílẹ̀,” tàbí “tẹ́ ba,” πρὸς ὑμᾶς sì tún lè jẹ́ “láàárín yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀pọ̀ lára àwọn tí wọ́n ṣẹ̀ tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: “Ìṣekúṣe” túmọ̀ πορνεία, ọ̀rọ̀ tó gbòòrò fún ìwà ìbálòpọ̀ tí kò tọ́; “àgbèrè” jẹ́ ọ̀nà ìtumọ̀ mìíràn, ṣùgbọ́n ó lè dín ìtumọ̀ náà kù ní àwọn àyíká kan.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìwà wọ̀bìà” tàbí “ìwà tí kò ní ìjánu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Mo bẹ̀rù pé nígbà tí mo bá tún dé
  rationale: Μή ń tẹ̀ síwájú láti inú ọ̀rọ̀ ìbẹ̀rù ní ẹsẹ tó ṣáájú; fífi “Mo bẹ̀rù pé” hàn mú ìsopọ̀ náà ṣe kedere ní Yorùbá, “tún dé” sì pa ìtumọ̀ πάλιν mọ́.
- source_word: ταπεινώσῃ με
  choice: lè rẹ̀ mí sílẹ̀
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí rírẹ ẹni sílẹ̀, mímú ẹni rẹ̀lẹ̀, tàbí títẹ́ ẹni ba. “Rẹ̀ mí sílẹ̀” pa ìtumọ̀ jíjẹ́ kí Pọ́ọ̀lù rẹ̀ sílẹ̀ mọ́ láìfi dandan sọ pé ìtìjú gbangba ni.
- source_word: ὁ θεός μου
  choice: Ọlọ́run mi
  rationale: Èyí tẹ̀lé gbólóhùn ìní Gíríìkì ní tààrà, ó sì pa bí Pọ́ọ̀lù ṣe sọ nípa ìbáṣepọ̀ tirẹ̀ pẹ̀lú Ọlọ́run mọ́.
- source_word: πρὸς ὑμᾶς
  choice: níwájú yín
  rationale: Nínú ọ̀rọ̀ yìí, πρός tọ́ka sí ohun tí yóò ṣẹlẹ̀ níwájú àwọn ará Kọ́ríńtì nígbà ìbẹ̀wò Pọ́ọ̀lù; “láàárín yín” tún ṣeé ṣe.
- source_word: πενθήσω
  choice: èmi yóò sì ṣọ̀fọ̀
  rationale: Πενθέω jẹ́ ọ̀rọ̀ ìbànújẹ́ jíjinlẹ̀ tàbí ọ̀fọ̀; “ṣọ̀fọ̀” pa agbára ọ̀rọ̀ náà mọ́ ju “bànújẹ́” lásán lọ.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: ọ̀pọ̀ àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀
  rationale: Àpólà aláṣepé Gíríìkì tọ́ka sí àwọn ẹ̀ṣẹ̀ àtijọ́ tí ipa wọn ṣì wà; “ti ṣẹ̀ tẹ́lẹ̀” fi ìṣáájú àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìsinsìnyí hàn.
- source_word: μὴ μετανοησάντων
  choice: tí wọn kò sì ronú pìwà dà
  rationale: Ìtumọ̀ náà ni pé títí di àkókò tí Pọ́ọ̀lù ń retí láti dé, wọn kò tíì yí ọkàn àti ìwà wọn padà.
- source_word: ἐπὶ τῇ ἀκαθαρσίᾳ
  choice: kúrò nínú ìwà àìmọ́
  rationale: Pẹ̀lú ọ̀rọ̀ ìrònúpìwàdà, ἐπί sọ ohun tí wọn ní láti ronú pìwà dà nípa rẹ̀; Yorùbá àdánidá ń sọ pé kí ẹni ronú pìwà dà “kúrò nínú” irú ìwà bẹ́ẹ̀.
- source_word: πορνείᾳ
  choice: ìṣekúṣe
  rationale: “Ìṣekúṣe” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó gbòòrò tó láti dúró fún πορνεία láìdín un kù sí ẹ̀ka ìbálòpọ̀ kan ṣoṣo.
- source_word: ἀσελγείᾳ
  choice: ìwà àìnítìjú
  rationale: Ἀσέλγεια tọ́ka sí ìwà tí kò ní ìjánu, tí kò sì tijú, ní ọ̀pọ̀ ìgbà nípa ìbálòpọ̀. “Ìwà àìnítìjú” pa gbígbòòrò ọ̀rọ̀ náà mọ́.
- source_word: ᾗ ἔπραξαν
  choice: tí wọ́n hù
  rationale: Ọ̀rọ̀ ìbátan náà tọ́ka sí àkójọpọ̀ àwọn ìwà búburú mẹ́tẹ̀ẹ̀ta; “ìwà ... tí wọ́n hù” jẹ́ Yorùbá àdánidá fún ìṣe tí wọn ń ṣe.
theological_decisions:
- issue: Agbára gbólóhùn tí μή bẹ̀rẹ̀ lẹ́yìn ọ̀rọ̀ ìbẹ̀rù tí a lóye láti ẹsẹ 20
  choice: A mú ọ̀rọ̀ tí a lóye náà jáde gẹ́gẹ́ bí “Mo bẹ̀rù pé nígbà tí mo bá tún dé...”
  alternative: “Kí ó má ṣe jẹ́ pé nígbà tí mo bá tún dé...”
  rationale: Gíríìkì ń tẹ̀ síwájú nínú ìbẹ̀rù Pọ́ọ̀lù láti ẹsẹ tó ṣáájú, kì í ṣe gbólóhùn òmìnira. Yíyan ọ̀nà yìí jẹ́ ìpinnu gírámà, kì í ṣe fífi ẹ̀kọ́ ìjọ kan kún un.
- issue: Bí a ṣe yà àwọn ọ̀rọ̀ ìwà búburú mẹ́tẹ̀ẹ̀ta sọ́tọ̀
  choice: “ìwà àìmọ́, ìṣekúṣe, àti ìwà àìnítìjú”
  alternative: “àìmọ́, àgbèrè, àti ìwà wọ̀bìà”
  rationale: Àwọn ọ̀rọ̀ Gíríìkì náà ní ibi tí ìtumọ̀ wọn ti pàdé, ṣùgbọ́n wọn kì í ṣe ọ̀rọ̀ kan náà. Ìtumọ̀ yìí pa ìtòlẹ́sẹẹsẹ mẹ́tẹ̀ẹ̀ta mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tóóró lé wọn lórí.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó bójú mu, tí àwọn òǹkàwé òde òní lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn náà pa ìbànújẹ́ líle Pọ́ọ̀lù, àìdájú tó wà nínú “lè,” àti ìyàtọ̀ láàárín àwọn ìwà búburú mẹ́tẹ̀ẹ̀ta mọ́.
