id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: yo
  text: Ṣé ẹ ti ń rò ní gbogbo àkókò yìí pé à ń gbèjà ara wa níwájú yín? Níwájú Ọlọ́run ni à ń sọ̀rọ̀ nínú Mèsáyà.[a] Ohun gbogbo ni, ẹ̀yin olùfẹ́, a ń ṣe láti gbé yín ró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú Kristi.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Πάλαι
  choice: ní gbogbo àkókò yìí
  rationale: Ó fi hàn pé èrò náà ti ń bá a lọ títí di ìsinsìnyí; ọ̀rọ̀ yìí jẹ́ àdánidá ju ìtumọ̀ gígírí bíi “láti ìgbà pípẹ́” lọ nínú ìbéèrè yìí.
- source_word: δοκεῖτε
  choice: ẹ ti ń rò
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ bá Πάλαι mu, ó sì mú ìbéèrè àsọyé Pọ́ọ̀lù jáde ní Yorùbá àdánidá.
- source_word: ἀπολογούμεθα
  choice: à ń gbèjà ara wa
  rationale: Ó pa ìtumọ̀ àwíjàre tàbí ìgbèjà ẹni mọ́ láìlo ọ̀rọ̀ òfin tí kò wọ́pọ̀.
- source_word: κατέναντι θεοῦ
  choice: Níwájú Ọlọ́run
  rationale: Ó sọ pé Ọlọ́run wà níbẹ̀ gẹ́gẹ́ bí Ẹlẹ́rìí àti ẹni tí àwọn olùsọ̀rọ̀ yóò jíhìn fún.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó pa èrò ìṣọ̀kan àti ààyè ìbáṣepọ̀ pẹ̀lú Mèsáyà mọ́, ó sì tú Χριστός gẹ́gẹ́ bí oyè.
- source_word: τὰ δὲ πάντα
  choice: Ohun gbogbo ni ... a ń ṣe
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí gbogbo ohun tí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ń sọ tàbí ń ṣe; ìṣètò Yorùbá yìí ṣe ète náà kedere láìsọ ọ̀rọ̀ Gíríìkì di òwe àgbáyé.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ó pa ìfẹ́ inú ìpè náà mọ́, ó sì fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: láti gbé yín ró
  rationale: Ó pa àwòrán ilé-kíkọ́ inú οἰκοδομή mọ́ ní ọ̀nà tí ó ṣe àdánidá, tí ó sì túmọ̀ sí fífún àwọn onígbàgbọ́ lókun.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run, kì í ṣe bí orúkọ lásán. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ọ̀nà ìbílẹ̀ “Kristi” tún hàn.
- issue: Ìbáṣepọ̀ àwọn gbólóhùn κατέναντι θεοῦ àti ἐν Χριστῷ
  choice: Níwájú Ọlọ́run ni à ń sọ̀rọ̀ nínú Mèsáyà
  alternative: Nínú Mèsáyà ni à ń sọ̀rọ̀ níwájú Ọlọ́run
  rationale: 'Ìṣètò yìí tẹ̀ lé ìtẹ̀sí ọ̀rọ̀ Gíríìkì, ó sì pa méjèèjì mọ́: Ọlọ́run ni ẹni tí ọ̀rọ̀ náà wà níwájú rẹ̀, Mèsáyà sì ni ààyè ìbáṣepọ̀ tí wọ́n ti ń sọ̀rọ̀.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní ni a lò. “Ṣé ẹ” jẹ́ ìbéèrè àsọyé tí ó ṣe àdánidá; “gbé yín ró” pa àwòrán ìkọ́lé inú ọ̀rọ̀ orísun mọ́ láìdi èdè ṣọ́ọ̀ṣì líle.
