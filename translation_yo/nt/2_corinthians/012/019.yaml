  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa. “Ṣé ẹ ti ń rò ní gbogbo àkókò yìí” mú agbára ìbéèrè àsọyé Πάλαι δοκεῖτε jáde; “à ń gbèjà ara wa” yẹ fún ἀπολογούμεθα. “Nívájú Ọlọ́run ... nínú Mèsáyà” pa kaτέναντι θεοῦ àti ἐν Χριστῷ mọ́ láìdà wọ́n pọ̀. Gbólóhùn ìkẹyìn sì ṣàfihàn pé gbogbo ohun tí wọ́n ń ṣe ni fún ìmúgbòòrò àwọn olùgbọ́.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. “Ṣé ẹ ti ń rò,” “à ń gbèjà ara wa,” àti “láti gbé yín ró” jẹ́ ọ̀nà òde òní tí ó bójú mu. Ìpè náà, “ẹ̀yin olùfẹ́,” jẹ́ ìlò Bíbélì Yorùbá tí ó mọ̀ wọ́pọ̀, ó sì bójú mu nínú àyíká ọ̀wọ̀ yìí.
  terminology: “Mèsáyà” jẹ́ ìtumọ̀ tó yẹ fún Χριστῷ níbi tí oyè náà ti ń ṣiṣẹ́, àti àlàyé ìsàlẹ̀ ojú ìwé “nínú Kristi” fún un ní àṣàyàn ìbílẹ̀ tó ṣe kedere. “Gbèjà ara wa” àti “gbé yín ró” mú ìtumọ̀ ìgbẹ́jọ́-ẹni àti àwòrán ìkọ́lé/ìmúgbòòrò wá ní èdè àdánidá.
