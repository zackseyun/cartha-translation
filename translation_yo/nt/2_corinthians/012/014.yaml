id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: yo
  text: Wò ó, ní ìgbà kẹta yìí, mo ti múra tán láti wá sọ́dọ̀ yín,[a] èmi kì yóò sì jẹ́ ẹrù fún yín.[b] Nítorí kì í ṣe ohun ti ẹ ní ni mo ń wá, bí kò ṣe ẹ̀yin fúnra yín. Nítorí kì í ṣe ojúṣe àwọn ọmọ láti kó ọrọ̀ jọ fún àwọn òbí wọn, bí kò ṣe ojúṣe àwọn òbí láti kó ọrọ̀ jọ fún àwọn ọmọ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìṣètò ọ̀rọ̀ náà pẹ́kípẹ́kí: “Fún ìgbà kẹta yìí, mo ti múra tán láti wá sọ́dọ̀ yín.”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “jẹ́ ẹrù fún yín” lè túmọ̀ sí fífi ara ẹni di ẹrù owó fún ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti pe àfiyèsí olùgbọ́, ó sì bá agbára ìtumọ̀ Ἰδοὺ mu láì lo èdè àtijọ́.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: ìgbà kẹta nìyí tí mo ti múra tán láti wá
  rationale: Ó sọ pé Pọ́ọ̀lù ti múra fún ìgbà kẹta, ṣùgbọ́n kò fi dandan mú un túmọ̀ sí pé ó ti ṣe ìrìnàjò méjì tẹ́lẹ̀; àlàyé ìsàlẹ̀ ojú ewé pa ìṣètò Gíríìkì mọ́.
- source_word: πρὸς ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: Ní ọ̀rọ̀ ìbẹ̀wò, ‘wá sọ́dọ̀ yín’ jẹ́ Yorùbá àdánidá fún wíwá sí ibi tí àwọn olùgbọ́ wà.
- source_word: καταναρκήσω
  choice: di ẹrù lé yín lórí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún fífi ara ẹni di ẹrù, ní pàtàkì nípa owó tàbí ohun ìní, láì fi ìtumọ̀ owó nìkan mọ́ ọn.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: kì í ṣe ohun ìní yín ni mò ń wá, bí kò ṣe ẹ̀yin fúnra yín
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ohun tí wọ́n ní àti àwọn ènìyàn náà mọ́; ‘fúnra yín’ mú ìtẹnumọ́ arọ́pò-orúkọ náà hàn ní Yorùbá.
- source_word: ὀφείλει
  choice: ojúṣe
  rationale: ‘Ojúṣe’ fi ìdè tàbí ohun tí ẹni yẹ láti ṣe hàn ní kedere, ó sì ṣiṣẹ́ dáadáa nínú òwe nípa ojúṣe òbí àti ọmọ.
- source_word: θησαυρίζειν
  choice: kó ọrọ̀ jọ
  rationale: Yíyan yìí pa èrò ìkójọ ìṣúra tàbí ohun ìní sílẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye ní ọ̀rọ̀ ìpèsè fún ìdílé.
- source_word: γονεῦσιν / γονεῖς
  choice: àwọn òbí
  rationale: Ó jẹ́ ọ̀rọ̀ àpapọ̀ fún baba àti ìyá, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe rí.
- source_word: τέκνα / τέκνοις
  choice: àwọn ọmọ
  rationale: Ó túmọ̀ sí ọmọ lápapọ̀, kì í ṣe ọmọkùnrin nìkan.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù nípa ‘ìgbà kẹta’
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìgbà kẹta tí ó ti múra láti wá, láì sọ ní pàtó pé ìbẹ̀wò méjì ti ṣẹlẹ̀.
  alternative: ‘Ní ìgbà kẹta yìí, mo ti múra tán láti wá sọ́dọ̀ yín.’
  rationale: Ìṣètò Gíríìkì tẹnu mọ́ ìmúrasílẹ̀ rẹ̀ fún ìgbà kẹta; yíyan yìí kò fi ìtàn ìrìnàjò tí ẹsẹ náà kò ṣàlàyé kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo ‘yín’ láti bá ọ̀pọ̀ ènìyàn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ mu. Àwọn àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá adayeba mu.
