id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: yo
  text: Nítorí mo bẹ̀rù pé bóyá, nígbà tí mo bá dé, n kò ní rí yín bí mo ṣe fẹ́, ẹ̀yin náà yóò sì rí mi bí ẹ kò ṣe fẹ́; bóyá ìjà, owú, ìbínú gbígbóná, ìlépa ire ara ẹni, ọ̀rọ̀-òdì, ìsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́[a], ìgbéraga, àti rúdurùdu yóò wà láàárín yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “òfófó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: mo bẹ̀rù
  rationale: Ó fi àníyàn tí Pọ́ọ̀lù ń ní lọ́wọ́ hàn ní tààràtà, láì dín agbára ọ̀rọ̀ náà kù.
- source_word: μή πως
  choice: pé bóyá / bóyá
  rationale: Ó pa ìtumọ̀ ohun tí ó ṣeé ṣe, tí Pọ́ọ̀lù sì ń bẹ̀rù pé ó lè ṣẹlẹ̀, mọ́ ní ibi méjèèjì.
- source_word: ἐλθὼν
  choice: nígbà tí mo bá dé
  rationale: A tú participle náà sí gbólóhùn àkókò tí ó bá èdè Yorùbá àdánidá mu.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: n kò ní bá yín gẹ́gẹ́ bí mo ṣe fẹ́
  rationale: Ó tọ́ka sí bí Pọ́ọ̀lù ṣe fẹ́ kí ó rí ipò tàbí ìwà wọn, láì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: ẹ̀yin náà yóò sì rí mi gẹ́gẹ́ bí ẹ kò ṣe fẹ́
  rationale: Ìṣe active yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere jù lọ láti pa ìtumọ̀ passive àti ìbádọ́gba pẹ̀lú gbólóhùn tó ṣáájú mọ́.
- source_word: ἔρις
  choice: ìjà
  rationale: Ó bo ìjà àti àríyànjiyàn tó ń fa ìpínyà láàárín àwùjọ.
- source_word: ζῆλος
  choice: owú
  rationale: Nínú àkójọ ìwà búburú yìí, ìtumọ̀ odi ni ọ̀rọ̀ náà ní, kì í ṣe ìtara rere.
- source_word: θυμοί
  choice: ìbínú gbígbóná
  rationale: Ó sọ ìbínú tó ń bú jáde léraléra, gẹ́gẹ́ bí ọ̀pọ̀ nọ́ńbà ọ̀rọ̀ Gíríìkì náà ṣe dámọ̀ràn.
- source_word: ἐριθεῖαι
  choice: ìlépa ire ara ẹni
  rationale: Ó fi ìfẹ́ láti tẹ̀ síwájú fún èrè ara ẹni hàn, láì fi ìtumọ̀ ẹgbẹ́ òṣèlú tàbí ẹ̀kọ́ ìsìn kún un.
- source_word: καταλαλιαί
  choice: ọ̀rọ̀-òdì
  rationale: Ó túmọ̀ sí ọ̀rọ̀ tí ń ba ẹlòmíràn jẹ́ tàbí tí ń sọ ibi sí i.
- source_word: ψιθυρισμοί
  choice: ìsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́
  rationale: Ó pa àwòrán ọ̀rọ̀ ìkọ̀kọ̀ tí a ń sọ kẹ́lẹ́kẹ́lẹ́ mọ́; àlàyé ìtumọ̀ míì wà ní àkọ́lé ìsàlẹ̀.
- source_word: φυσιώσεις
  choice: ìgbéraga
  rationale: Ó sọ ìrera àti fífi ara ẹni ga, èyí tó bá àpèjúwe ohun tí ó 'wú' mu.
- source_word: ἀκαταστασίαι
  choice: rúdurùdu
  rationale: Ó fi àìlétò àti ìdàrúdàpọ̀ nínú àwùjọ hàn ní èdè Yorùbá òde òní.
theological_decisions:
- issue: Ohùn ìpàdé tí Pọ́ọ̀lù ń bẹ̀rù
  choice: A pa ìbẹ̀rù pé àwọn méjèèjì lè rí ara wọn ní ọ̀nà tí wọn kò fẹ́, àti àkójọ ìwà búburú nínú àwùjọ, mọ́.
  alternative: Kí a túmọ̀ ọ̀rọ̀ náà bí ẹni pé Pọ́ọ̀lù ń sọ ní pàtó pé òun yóò fi agbára aposteli jẹ wọ́n níyà.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ohun tí Pọ́ọ̀lù yóò ṣe tàbí kò sọ pé àwọn olùkọ́ èké ni ó fa ìṣòro náà; nítorí náà, a kò yanju ìṣòro ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà fi sílẹ̀ ní gbangba.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àpẹẹrẹ gbólóhùn Yorùbá àdánidá fún ìṣe passive Gíríìkì, a sì pa ìbádọ́gba láàárín bí Pọ́ọ̀lù yóò ṣe rí wọn àti bí wọn yóò ṣe rí i mọ́. Gbogbo àmì ohùn ni a lò níbi tí ó bá yẹ.
