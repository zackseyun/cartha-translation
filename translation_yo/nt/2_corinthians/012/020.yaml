    rationale: “Bá yín” sábà máa ń tọ́ka sí ìpàdé ẹni; pẹ̀lú “n kò ní,” ó lè hàn pé Pọ́ọ̀lù kì yóò pàdé wọn. εὕρω ὑμᾶς ń sọ pé yóò rí wọn ní irú/ipò tí kò fẹ́. Ríròpo rẹ̀ pẹ̀lú “n kò ní rí yín bí mo ṣe fẹ́” mú ìtumọ̀ yìí hàn kedere, nígbà tí “bóyá” ṣì ń pa ìmọ̀lára ohun tí a ń bẹ̀rù pé ó lè ṣẹlẹ̀ mọ́.
