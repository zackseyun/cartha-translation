  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ ẹsẹ Gíríìkì náà dáadáa: ìbẹ̀rù Pọ́ọ̀lù, ìbádọ́gba ìfẹ́-kòfẹ́ láàárín òun àti àwọn ará Kọ́ríńtì, àti àkójọ àwọn ìwà tí ó ń bà àwùjọ jẹ́, wà níbẹ̀. Ṣùgbọ́n “n kò ní bá yín” lè túmọ̀ sí pé Pọ́ọ̀lù kì yóò pàdé wọn rárá, dípò ìtumọ̀ pé ó lè rí wọn ní ipò tí kò fẹ́.'
  naturalness: Yorùbá náà jẹ́ èyí tí ó ṣeé lóye, ó sì yẹ fún ìwé mímọ́ òde òní. “Rí yín bí mo ṣe fẹ́” jẹ́ ọ̀nà tí ó kedere, tí ó sì jẹ́ àdánidá láti sọ ìtumọ̀ “find you as I wish” ní àyíká yìí. “Ìsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́” pa àwòrán ọ̀rọ̀ ìkọ̀kọ̀ mọ́.
  terminology: Àwọn ọ̀rọ̀ bíi “owú,” “ìbínú gbígbóná,” “ìlépa ire ara ẹni,” “ọ̀rọ̀-òdì,” “ìgbéraga,” àti “rúdurùdu” bá àkójọ ìwà búburú Gíríìkì náà mu. Àkọsílẹ̀ “òfófó” jẹ́ àṣàyàn ọ̀rọ̀ tó yẹ fún ψιθυρισμοί, bí ó tilẹ̀ jẹ́ pé “ìsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́” ní ìfararora síi sí ìtumọ̀ ìpilẹ̀ṣẹ̀.
