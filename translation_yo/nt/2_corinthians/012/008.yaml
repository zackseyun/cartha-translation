  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπὲρ τούτου τρὶς τὸν κύριον παρεκάλεσα ἵνα ἀποστῇ ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: yo
  text: Nípa èyí[a], ìgbà mẹ́ta ni mo fi taratara bẹ̀ Olúwa[b][c] pé kí ó kúrò lára mi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Nítorí èyí’ tàbí ‘Ní ti èyí.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, ‘mo rawọ́ ẹ̀bẹ̀ sí’ tàbí ‘mo bẹ̀bẹ̀ lọ́wọ́.’
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì sọ ‘Olúwa’ nìkan; Pọ́ọ̀lù kò dárúkọ Jésù ní tààrà níbí.
    reason: alternative_reading
  - marker: d
    text: A tún lè sọ pé, ‘kí ó fi mí sílẹ̀’ tàbí ‘kí ó lọ kúrò lọ́dọ̀ mi.’ Gíríìkì kò sọ olùṣe ọ̀rọ̀-ìṣe náà ní tààrà; ó ń tọ́ka padà sí ìpọ́njú tí ẹsẹ tó ṣáájú mẹ́nu kàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Nípa èyí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú, ó sì túmọ̀ sí ‘nípa èyí’ tàbí ‘nítorí èyí,’ kì í ṣe ‘nítorí àǹfààní èyí.’
- source_word: τρὶς
  choice: ìgbà mẹ́ta
  rationale: Èyí fi hàn pé Pọ́ọ̀lù bẹ̀bẹ̀ ní ìṣẹ̀lẹ̀ mẹ́ta; ó jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Èyí pa orúkọ oyè inú Gíríìkì mọ́ láì fi ‘Jésù’ kún un, bó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí Pọ́ọ̀lù máa tọ́ka sí Jésù.
- source_word: παρεκάλεσα
  choice: mo fi taratara bẹ̀
  rationale: Nínú àyíká àdúrà yìí, gbólóhùn náà fi ìbẹ̀bẹ̀ onítara hàn, láì mú ìtumọ̀ rẹ̀ le ju ti Gíríìkì lọ.
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: pé kí ó kúrò lára mi
  rationale: ‘Kúrò lára mi’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún jíjìnnà tàbí fífi ẹni sílẹ̀. Arọ́pò-orúkọ ‘ó’ kò pinnu bóyá ẹ̀gún, ìpọ́njú, tàbí aṣojú náà ni a ń tọ́ka sí.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí ‘Olúwa’ nìkan.
  alternative: ‘Olúwa Jésù’
  rationale: Ó ṣeé ṣe gan-an pé Jésù ni Pọ́ọ̀lù ní lọ́kàn, ṣùgbọ́n Gíríìkì sọ ‘Olúwa’ nìkan; ìtumọ̀ náà kò fi orúkọ tí kò sí nínú ẹsẹ náà kún un.
- issue: Olùṣe tí a kò sọ ní tààrà nínú ἀποστῇ
  choice: A lo ‘ó,’ èyí tí ó lè tọ́ka sí ohun tàbí ẹni.
  alternative: ‘kí ẹ̀gún náà kúrò,’ ‘kí aṣojú náà kúrò,’ tàbí ‘kí ìpọ́njú náà kúrò’
  rationale: Gíríìkì fi olùṣe náà sílẹ̀ fún àyíká ọ̀rọ̀. ‘Ó’ pa àìdánilójú yìí mọ́, kò sì pinnu bóyá ẹ̀gún inú ara tàbí aṣojú Sátánì ni Pọ́ọ̀lù tẹnumọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Fi taratara bẹ̀’ mú ìtara inú àdúrà jáde, ‘kúrò lára mi’ sì jẹ́ gbólóhùn àdánidá. Gbogbo àmì ohùn ni a lò níbi tí ó yẹ.
