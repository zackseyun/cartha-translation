id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: yo
  text: Mo rọ Títù pé kó lọ, mo sì rán arákùnrin náà lọ pẹ̀lú rẹ̀. Ṣé Títù kò lo yín fún àǹfààní ara rẹ̀? Ṣé a kò rìn ní ẹ̀mí kan náà? Ṣé a kò tẹ̀ lé àwọn ìpasẹ̀ kan náà[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “nípasẹ̀ Ẹ̀mí kan náà,” èyí tí ó lè tọ́ka sí Ẹ̀mí Mímọ́ dípò ìwà tàbí èrò inú kan náà.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: Mo rọ Títù pé kó lọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìbéèrè onítẹnumọ́ tí Pọ́ọ̀lù béèrè lọ́wọ́ Títù nípa iṣẹ́ ìránṣẹ́ kan. A fi ‘pé kó lọ’ kún un gẹ́gẹ́ bí ohun tí àyíká ọ̀rọ̀ mú kedere, kí Yorùbá sì ṣàn déédéé.
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: mo sì rán arákùnrin náà pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀-ìṣe àkópọ̀ náà túmọ̀ sí pé a rán ẹnì kan lọ pẹ̀lú Títù. ‘Arákùnrin náà’ pa àfihàn pàtó inú Gíríìkì mọ́ láìfi ọ̀rọ̀ ìní kún un.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Títù kò ha jẹ yín ní àǹfààní, àbí ó ṣe bẹ́ẹ̀?
  rationale: πλεονεκτέω túmọ̀ sí rí èrè fún ara ẹni nípa lílo ẹlòmíràn lọ́nà àìtọ́; ‘jẹ yín ní àǹfààní’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere. Ìbéèrè náà ń retí ìdáhùn òdì, èyí tí ‘kò ha …, àbí ó ṣe bẹ́ẹ̀?’ fi hàn.
- source_word: τῷ αὐτῷ πνεύματι
  choice: ní ẹ̀mí kan náà
  rationale: Dative náà lè tọ́ka sí ipò tàbí ọ̀nà ìṣe. Gbólóhùn Yorùbá yìí lè túmọ̀ sí ìwà tàbí èrò inú kan náà, ó sì tún jẹ́ kí ìtọ́ka tó ṣeé ṣe sí Ẹ̀mí Mímọ́ wà ní ṣíṣí.
- source_word: περιεπατήσαμεν
  choice: rìn
  rationale: A pa àkàwé ‘rírìn’ tí Pọ́ọ̀lù lò mọ́; ó ṣeé lóye ní Yorùbá gẹ́gẹ́ bí ọ̀nà ìgbésí ayé tàbí ìwà.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: tẹ̀ lé àwọn ìpasẹ̀ kan náà
  rationale: ἴχνος jẹ́ àmì ẹsẹ̀ tàbí ipa ọ̀nà. ‘Tẹ̀ lé àwọn ìpasẹ̀ kan náà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa àkàwé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ẹ̀mí kan náà’
  choice: Ìwà, èrò inú, tàbí ìmísí kan náà, tí a kọ sí ‘ẹ̀mí kan náà’
  alternative: ‘Nípasẹ̀ Ẹ̀mí kan náà,’ tó ń tọ́ka sí Ẹ̀mí Mímọ́
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìṣọ̀kan ìwà àti òtítọ́ Pọ́ọ̀lù àti Títù. Síbẹ̀, Gíríìkì kò fòpin sí ìtọ́ka sí Ẹ̀mí Mímọ́; nítorí náà, a pa àìdánilójú náà mọ́ nínú ọ̀rọ̀ àti àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àwọn ìbéèrè ‘kò ha’ pa ìrísí ọ̀rọ̀ àsọyé Pọ́ọ̀lù mọ́, nígbà tí ‘àbí ó ṣe bẹ́ẹ̀?’ mú ìdáhùn òdì tí μήτι ń retí ṣe kedere fún òǹkàwé Yorùbá.
