revisions:
- from: Mo rọ Títù pé kó lọ, mo sì rán arákùnrin náà pẹ̀lú rẹ̀. Títù kò ha jẹ yín ní àǹfààní, àbí ó ṣe bẹ́ẹ̀? Àwa kò ha rìn ní ẹ̀mí kan náà[a]? Àwa kò ha tẹ̀ lé àwọn ìpasẹ̀ kan náà?
  to: Mo rọ Títù pé kó lọ, mo sì rán arákùnrin náà lọ pẹ̀lú rẹ̀. Ṣé Títù kò lo yín fún àǹfààní ara rẹ̀? Ṣé a kò rìn ní ẹ̀mí kan náà? Ṣé a kò tẹ̀ lé àwọn ìpasẹ̀ kan náà[a]?
  rationale: A rọ́pò ọ̀rọ̀ tí ó fi Títù hàn bí ẹni tó ń ṣe àǹfààní fún àwọn ará Kọ́ríńtì pẹ̀lú ọ̀rọ̀ tí ó sọ ìbéèrè Pọ́ọ̀lù nípa bóyá Títù lo wọn fún èrè ara rẹ̀. A tún mú àfihàn ìbéèrè tí ń retí ìdáhùn òdì rọrùn, a sì pa àìdánilójú ‘ẹ̀mí’/‘Ẹ̀mí’ mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:46Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè onídáhùn-òdì, ìrìn ‘ní ẹ̀mí kan náà,’ àti àpẹẹrẹ ìpasẹ̀ Gíríìkì náà wá sí Yorùbá dáadáa. Ṣùgbọ́n ‘jẹ yín ní àǹfààní’ túmọ̀ sí ṣíṣe ohun rere fún yín tàbí fífún yín ní àǹfààní, èyí tí ó yí ìtumọ̀ ἐπλεονέκτησεν ὑμᾶς sí òdì.
  naturalness: Àtúnṣe náà lo Yorùbá ìgbàlódé tí ó ní iyì, ó sì jẹ́ kí ìbéèrè méjèèjì ìkẹyìn rọrùn láti ka. ‘Lo yín fún àǹfààní ara rẹ̀’ sọ ìtumọ̀ lílo ẹlòmíràn fún èrè ẹni gan-an ní kedere.
  terminology: ‘Ẹ̀mí kan náà’ yẹ kí ó wà ní lẹ́tà kékeré nínú ẹsẹ̀ kí ìtumọ̀ ìwà tàbí èrò inú má bàa di ìpinnu nípa Ẹ̀mí Mímọ́. Àlàyé ìsàlẹ̀ náà pa ìtumọ̀ mìíràn mọ́ ní ṣíṣí. ‘Arákùnrin náà’ bójú mu fún τὸν ἀδελφόν nínú àyíká Kristẹni.
  issues:
