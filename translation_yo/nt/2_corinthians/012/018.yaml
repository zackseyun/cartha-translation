    rationale: Kì í ṣe dandan, ó sì lè mú ìbéèrè tí μήτι ti fi ìdáhùn òdì sílẹ̀ hàn bí ìbéèrè tí kò dájú. ‘Ṣé ... kò ...?’ ti tó láti fi ìrètí ìdáhùn òdì hàn.
