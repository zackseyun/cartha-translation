    issue: ‘Títù kò ha jẹ yín ní àǹfààní’
    rationale: Èdè Yorùbá yìí sábà ń túmọ̀ sí pé Títù ṣe ohun tó ṣàǹfààní fún wọn. Ìpilẹ̀ Gíríìkì πλεονεκτέω níbí ni lílo wọn fún èrè tàbí ìfẹ́-ara ẹni; nítorí náà ìtumọ̀ ìpilẹ̀ ti yí padà.
  - severity: low
