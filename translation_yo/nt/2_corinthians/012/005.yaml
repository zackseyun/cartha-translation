id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: yo
  text: Nípa irú ẹni bẹ́ẹ̀ ni èmi yóò fọ́nnu[a]; ṣùgbọ́n nípa ara mi, èmi kì yóò fọ́nnu, bí kò ṣe nínú àwọn àìlera mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi yóò fọ́nnu nítorí irú ẹni bẹ́ẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “nípa,” “ní ti,” tàbí “fún”; ìtumọ̀ náà pa ọ̀nà tí Pọ́ọ̀lù fi ń ya ara rẹ̀ sọ́tọ̀ mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú àìlera mi” tàbí “nínú ìrẹ̀wẹ̀sì mi.” Lọ́pọ̀ ìgbà, Pọ́ọ̀lù máa ń lo “àìlera” fún àìlágbára ènìyàn, ìjìyà, tàbí ipò tí agbára Ọlọ́run ti fara hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní ipò genitive, ὑπέρ ń tọ́ka sí ẹni tí ìfọ́nnu náà dá lé tàbí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀. “Nítorí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìbáṣepọ̀ yìí hàn, ó sì pa ọ̀nà tí Pọ́ọ̀lù fi ń ya ara rẹ̀ sọ́tọ̀ mọ́.
- source_word: τοῦ τοιούτου
  choice: irú ẹni bẹ́ẹ̀
  rationale: Gbólóhùn yìí jẹ́ ti àìṣe tààrà àti jíjìnnà sí ẹni tí a ń tọ́ka sí. “Irú ẹni bẹ́ẹ̀” kò fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ ní kedere.
- source_word: καυχήσομαι
  choice: èmi yóò máa fọ́nnu
  rationale: “Máa fọ́nnu” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún καυχάομαι, ó sì lè gbé ìtumọ̀ ìsọ̀rọ̀ ìyìn tàbí ìgbéraga gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe pinnu.
- source_word: ἐμαυτοῦ
  choice: ara mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àfidípò yìí mú Pọ́ọ̀lù fúnra rẹ̀ dúró ní ìtakora sí “irú ẹni bẹ́ẹ̀.” “Ara mi” ni ọ̀nà Yorùbá àdánidá fún ìtumọ̀ náà.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Níbi yìí, εἰ μή ń fi ohun kan ṣoṣo tí a yọ sílẹ̀ hàn, kì í ṣe ipò àdéhùn. “Bí kò ṣe” mú ìtumọ̀ náà jáde dáadáa.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: nínú àwọn àìlera mi
  rationale: ἀσθένεια lè tọ́ka sí àìlera ènìyàn, ìjìyà, tàbí ipò tí agbára Ọlọ́run ti fara hàn. “Àwọn àìlera” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu; a fi “mi” kún un nítorí ìtakora pẹ̀lú “ara mi” fi hàn pé àìlera Pọ́ọ̀lù fúnra rẹ̀ ni.
theological_decisions:
- issue: Irú ìfọ́nnu tí Pọ́ọ̀lù gbà láàyè
  choice: Pọ́ọ̀lù fi ìfọ́nnu nítorí “irú ẹni bẹ́ẹ̀” wé ìfọ́nnu nítorí ara rẹ̀, ó sì sọ pé àìlera rẹ̀ nìkan ni yóò jẹ́ ààyè fún ìfọ́nnu nípa ara rẹ̀.
  alternative: Ó ṣeé ṣe kí “irú ẹni bẹ́ẹ̀” jẹ́ ẹlòmíràn ní ti gidi; ó sì tún ṣeé ṣe kí ọ̀rọ̀ náà jẹ́ ọ̀nà ìsọ̀rọ̀ tí Pọ́ọ̀lù fi ń ya ara rẹ̀ kúrò lọ́dọ̀ ìrírí ìran náà.
  rationale: Ìtumọ̀ náà pa jíjìnnà tí Pọ́ọ̀lù mọ̀ọ́mọ̀ dá sílẹ̀ mọ́, kò sì pinnu bóyá ẹni náà jẹ́ Pọ́ọ̀lù fúnra rẹ̀ tàbí ẹlòmíràn.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà mọ́gbọ́n dání, ó sì yẹ fún kíkà ní gbangba. “Irú ẹni bẹ́ẹ̀” pa àìṣe tààrà inú Gíríìkì mọ́, “máa fọ́nnu” sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lónìí lè lóye ní rọrùn.
