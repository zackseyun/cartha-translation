id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: yo
  text: Mo ti di òmùgọ̀; ẹ̀yin ni ẹ fipá mú mi ṣe bẹ́ẹ̀. Nítorí ó yẹ kí ẹ̀yin ti yin mi.[a] Nítorí kò sí ohun kankan tí mo kéré sí àwọn “àpọ́sítélì gíga rẹpẹtẹ” wọ̀nyẹn nínú rẹ̀, bí ó tilẹ̀ jẹ́ pé èmi kò jẹ́ nǹkan kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ̀yin ti gbóríyìn fún mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: Mo ti di
  rationale: 'Ó pa agbára ọ̀rọ̀-ìṣe perfect mọ́: ohun tí ó ṣẹlẹ̀ tẹ́lẹ̀ ti yọrí sí ipò tí ó wà nísinsìnyí.'
- source_word: ἄφρων
  choice: òmùgọ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ẹni tí ń hùwà láìgbọ́n; níbí, Pọ́ọ̀lù ń lò ó gẹ́gẹ́ bí àpèjúwe ara rẹ̀ pẹ̀lú ìtàǹjẹ ọ̀rọ̀.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: ẹ̀yin ni ẹ mú mi dé ibẹ̀
  rationale: Ìṣísẹ̀ “ẹ̀yin ni” pa ìtẹnumọ́ ὑμεῖς mọ́, “dé ibẹ̀” sì tọ́ka sí ọ̀rọ̀ ìṣògo bí òmùgọ̀ nínú àyíká ọ̀rọ̀ láìṣe àlàyé jù.
- source_word: ὤφειλον
  choice: ó yẹ kí
  rationale: Ó sọ ohun tí ó tọ́ tàbí tí a retí, ní èdè Yorùbá adayébá.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: kí ẹ̀yin máa yìn mí
  rationale: Ó fi àwọn ará Kọ́ríńtì hàn gẹ́gẹ́ bí olùṣe, ó sì mú ìtumọ̀ dídúró fún Pọ́ọ̀lù tàbí sísọ rere nípa rẹ̀ jáde ní Yorùbá tó ṣe kedere.
- source_word: οὐδὲν ... ὑστέρησα
  choice: èmi kò kéré sí ... ní ohunkóhun
  rationale: 'Ó pa ìfiwéra náà mọ́: Pọ́ọ̀lù kò rẹlẹ̀ tàbí kù sí wọn ní ọ̀nà kankan.'
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: àwọn “àpọ́sítélì ńlá lọ́lá” wọ̀nyẹn
  rationale: “Ńlá lọ́lá” fi ìtẹnumọ́ ὑπερλίαν hàn; àmì ìsọ̀rọ̀ ń jẹ́ kí agbára ọ̀rọ̀ àríyànjiyàn tàbí ẹ̀gàn farahàn láìfi “àwọn tí a ń pè ní” kún Gíríìkì.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: bí ó tilẹ̀ jẹ́ pé èmi kò jẹ́ nǹkan kan
  rationale: Ó pa gbólóhùn ìyọ̀ǹda àti ọ̀rọ̀ ìrẹ̀lẹ̀ Pọ́ọ̀lù mọ́, pẹ̀lú ìtẹnumọ́ “èmi.”
theological_decisions:
- issue: Agbára àti ẹni tí τῶν ὑπερλίαν ἀποστόλων ń tọ́ka sí
  choice: “àwọn ‘àpọ́sítélì ńlá lọ́lá’ wọ̀nyẹn” pẹ̀lú agbára tí ó lè jẹ́ ẹ̀gàn
  alternative: “àwọn àpọ́sítélì tí ó ga jù lọ” gẹ́gẹ́ bí ìtọ́ka tí kì í ṣe ẹ̀gàn sí àwọn àpọ́sítélì olókìkí
  rationale: Àyíká 2 Kọ́ríńtì lè fi hàn pé ọ̀rọ̀ náà jẹ́ ẹ̀gàn tàbí àríyànjiyàn, ṣùgbọ́n Gíríìkì kò sọ “tí a ń pè ní.” Ìtumọ̀ náà àti àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn méjèèjì ṣí sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìtẹnumọ́ Pọ́ọ̀lù àti ìforígbárí inú ọ̀rọ̀ rẹ̀ mọ́. Àmì ìsàlẹ̀ [a] wà lẹ́yìn “yìn mí”; àmì [b] yẹ kí ó wà lẹ́yìn “wọ̀nyẹn” nínú ọ̀rọ̀ àtẹ̀jáde.
