id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: yo
  text: Nítorí, ní tòótọ́, ohun tí a ti fi ògo fún náà, a kò fi ògo fún un ní apá yìí, nítorí ògo tí ó tayọ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ògo tí ó tayọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ní tòótọ́
  rationale: “Nítorí” pa ipa ìsopọ̀ àti àlàyé γάρ mọ́, “ní tòótọ́” sì mú ìtẹnumọ́ καί jáde ní Yorùbá àdánidá.
- source_word: οὐ δεδόξασται
  choice: a kò fi ògo fún un
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀-ìṣe aláìṣe fúnra ẹni náà mọ́, ó sì jẹ́ kí àtúnlò gbòǹgbò ọ̀rọ̀ ògo nínú ẹsẹ náà hàn.
- source_word: τὸ δεδοξασμένον
  choice: ohun tí a ti fi ògo fún
  rationale: A mú participle náà bí ohun tí a kò dárúkọ ní pàtó, láìfi “májẹ̀mú” tàbí “iṣẹ́-ìránṣẹ́” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: nípa èyí
  rationale: Ó fi ààlà sí ibi tí ìsọ pé kò ní ògo ti kan, kí a má bàa sọ ọ́ di ìkọ̀sílẹ̀ ògo àtijọ́ pátápátá.
- source_word: εἵνεκεν
  choice: nítorí
  rationale: Ó sọ ìdí tàbí ohun tó fà á ní Yorùbá tó ṣe kedere.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: ògo tí ó tayọ rẹ̀
  rationale: Ó pa agbára ìfiwéra participle ὑπερβαλλούσης mọ́; “rẹ̀” mú ohun tí ògo tuntun tayọ yéni láti inú àyíká ọ̀rọ̀, bó tilẹ̀ jẹ́ pé a kò kọ ọ́ sílẹ̀ ní Gíríìkì.
- source_word: δόξα / δεδοξασμένον wordplay
  choice: fi ògo fún ... fi ògo fún ... ògo
  rationale: Àtúnlò “ògo” mú eré-ọ̀rọ̀ àti ìtakora tí Pọ́ọ̀lù mọ̀ọ́mọ̀ lò hàn.
theological_decisions:
- issue: Bóyá Pọ́ọ̀lù ń sọ pé iṣẹ́ ìránṣẹ́ àtijọ́ kò ní ògo rárá, tàbí pé ògo rẹ̀ dà bí ohun tí kò ní ògo ní ìfiwéra.
  choice: A gbé ìkọ̀sílẹ̀ náà kalẹ̀ gẹ́gẹ́ bí ìfiwéra tí “nípa èyí” fi ààlà sí.
  alternative: Kí a ka a sí ìkọ̀sílẹ̀ pátápátá pé ohun àtijọ́ kò ní ògo gidi kankan.
  rationale: ἐν τούτῳ τῷ μέρει fi ààlà sí òfin ìkọ̀sílẹ̀ náà, àwọn ẹsẹ tó yí i ká sì jẹ́wọ́ pé ohun àtijọ́ ní ògo, ṣùgbọ́n ògo tó tayọ rẹ̀ bò ó mọ́lẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì mọ̀ọ́mọ̀ pa ìtakora “ohun tí a ti fi ògo fún, a kò fi ògo fún un” mọ́ dípò fífẹ́ ẹ sílẹ̀.
