revisions:
- from: Nítorí ní tòótọ́, ohun tí a ti fi ògo fún, a kò fi ògo fún un nípa èyí, nítorí ògo tí ó tayọ rẹ̀.[a]
  to: Nítorí, ní tòótọ́, ohun tí a ti fi ògo fún náà, a kò fi ògo fún un ní apá yìí, nítorí ògo tí ó tayọ rẹ̀.[a]
  rationale: The revision improves the idiomatic rendering of the Greek limiting phrase while retaining the original’s perfect-passive paradox and repeated ògo wordplay. The footnote is adjusted to give a closer Yoruba equivalent of ‘the surpassing glory,’ without the contextually supplied object.
  reviewer_model: gpt-5.6-terra
