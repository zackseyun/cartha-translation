id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: yo
  text: Nítorí bí iṣẹ́ ìránṣẹ́ ìdálẹ́bi bá ní ògo, mélòómélòó ni iṣẹ́ ìránṣẹ́ òdodo[a] ń pọ̀ jù lọ nínú ògo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó bójú mu fún iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ òjíṣẹ́ tí Pọ́ọ̀lù ń fi àwọn ìṣètò méjì wé ara wọn; kò dín un kù sí iṣẹ́ kékeré kan ṣoṣo.
- source_word: κατάκρισις
  choice: ìdálẹ́bi
  rationale: 'Ó pa ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ mọ́: ìpinnu pé ẹnì kan jẹ̀bi, kì í ṣe ìdájọ́ lápapọ̀.'
- source_word: δόξα
  choice: ògo
  rationale: “Ògo” jẹ́ ọ̀rọ̀ àdánidá, tó sì pa ìsopọ̀ ẹ̀kọ́ Pọ́ọ̀lù nípa ògo àwọn iṣẹ́ ìránṣẹ́ méjèèjì mọ́.
- source_word: πολλῷ μᾶλλον
  choice: mélòómélòó ... jù bẹ́ẹ̀ lọ
  rationale: Àṣà ọ̀rọ̀ yìí fi agbára ìfiwéra Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: περισσεύει
  choice: ń pọ̀ ní ... jù
  rationale: Ó mú ìtumọ̀ ọ̀pọ̀lọpọ̀ tàbí àkúnwọ́sílẹ̀ jáde, ó sì pa ìṣe àsìkò ìsinsìnyí inú Gíríìkì mọ́.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó gbooro tó sì wọ́pọ̀ fún δικαιοσύνη; ó lè tọ́ka sí jíjẹ́ olódodo tàbí sí ìdájọ́ tó tọ́, bí àyíká ọ̀rọ̀ ṣe ń béèrè.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ìyàtọ̀ láàárín iṣẹ́ ìránṣẹ́ méjì
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: A kò fẹ́ pinnu pé ọ̀rọ̀ náà ń sọ̀rọ̀ nípa ipò olódodo nìkan tàbí ìdájọ́ òdodo nìkan. “Òdodo” pa ààyè ìtumọ̀ méjèèjì mọ́, a sì fi èkejì sínú àlàyé ìsàlẹ̀.
- issue: Ọ̀rọ̀-ìṣe tí a fi kún gbólóhùn àkọ́kọ́ tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì
  choice: bá ní ògo
  alternative: bá wá pẹ̀lú ògo
  rationale: “Bá ní ògo” jẹ́ àdánidá ní Yorùbá, kò sì fi ìṣẹ̀lẹ̀ tàbí ìrìn kan kún ohun tí Gíríìkì kò sọ; ó tún pa ìyàtọ̀ mọ́ pẹ̀lú iṣẹ́ ìránṣẹ́ òdodo tí ó ń pọ̀ ní ògo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Mélòómélòó ... jù bẹ́ẹ̀ lọ” mú ìfiwéra alágbára ti Pọ́ọ̀lù jáde lọ́nà àdánidá; àmì ìyanu ń fi ìtẹnumọ́ ọ̀rọ̀ náà hàn.
