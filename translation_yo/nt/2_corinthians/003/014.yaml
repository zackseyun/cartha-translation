revisions:
- from: Ṣùgbọ́n èrò inú wọn ti yigbì. Nítorí títí di òní olónìí, nígbà tí a bá ń ka májẹ̀mú àtijọ́[a], ìbòjú kan náà ṣì wà láìgbé e kúrò, nítorí pé nínú Mèsáyà ni a ti mú un kúrò.[b]
  to: Ṣùgbọ́n èrò inú wọn di líle. Nítorí títí di òní olónìí, nígbà tí a ń ka májẹ̀mú àtijọ́[a], ìbòjú kan náà ṣì wà láìsí gbígbé e kúrò, nítorí pé nínú Mèsáyà ni a ń mú un kúrò.[b]
  rationale: Àtúnṣe náà mú ọ̀rọ̀ Yorùbá rọrùn síi, ó pa iṣe-ìsinsìnyí passive ti καταργεῖται mọ́, ó sì tún àṣìṣe tó wà nínú àlàyé ‘Old Testament’ ṣe. A fi ìtumọ̀ mìíràn ti ohun tí ‘ọ́’ ń tọ́ka sí sílẹ̀ nínú àlàyé ìsàlẹ̀, láìfi ìdáhùn ẹ̀kọ́ ìjọ kan mú gẹ́gẹ́ bí ìtumọ̀ pàtàkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:49Z'
