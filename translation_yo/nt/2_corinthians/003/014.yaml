id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: yo
  text: Ṣùgbọ́n èrò inú wọn di líle. Nítorí títí di òní olónìí, nígbà tí a ń ka májẹ̀mú àtijọ́[a], ìbòjú kan náà ṣì wà láìsí gbígbé e kúrò, nítorí pé nínú Mèsáyà ni a ń mú un kúrò.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Tẹstámẹ́ǹtì Àtijọ́.” Ní Gíríìkì: “májẹ̀mú àtijọ́.”'
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí, “nítorí pé nínú Mèsáyà ni a sọ ọ́ di aláìṣiṣẹ́ tàbí a mú un kúrò,” níbi tí ‘ọ́’ ti lè tọ́ka sí májẹ̀mú àtijọ́ dípò ìbòjú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: ti yigbì
  rationale: Ó ṣàfihàn pé èrò inú wọn ti le, kò sì rọrùn fún wọn láti lóye; ó tún pa ìtumọ̀ àìṣe ti ọ̀rọ̀ Gíríìkì mọ́ láìfi ìṣọ̀tẹ̀ àfínnúfíndọ̀ṣe kún un.
- source_word: τὰ νοήματα αὐτῶν
  choice: èrò inú wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí agbára wọn láti ronú àti láti lóye; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì bá àríyànjiyàn Pọ́ọ̀lù mu.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Nítorí títí di òní olónìí
  rationale: Ó pa ìtẹnumọ́ àkókò inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: κάλυμμα
  choice: ìbòjú
  rationale: Ó pa àwòrán ìbòjú Mósè mọ́ gẹ́gẹ́ bí àyíká ẹsẹ náà ṣe béèrè.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: nígbà tí a bá ń ka
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó ń ṣẹlẹ̀ ní àkókò kíkà.
- source_word: τῆς παλαιᾶς διαθήκης
  choice: májẹ̀mú àtijọ́
  rationale: διαθήκη túmọ̀ sí májẹ̀mú níhìn-ín; a kò fi ọ̀rọ̀ àṣà ìtumọ̀ ‘Tẹstamẹ́ǹtì’ dí ìtumọ̀ orísun rú.
- source_word: μένει
  choice: ṣì wà
  rationale: Ó ṣàfihàn pé ìbòjú náà ń bá a lọ láti wà.
- source_word: μὴ ἀνακαλυπτόμενον
  choice: láìgbé e kúrò
  rationale: Ó pa àìṣe àti àwòrán fífi ìbòjú sílẹ̀ tàbí gbígbé e kúrò mọ́.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè tí ó túmọ̀ sí Ẹni Àmì Òróró; ‘Mèsáyà’ mú iṣẹ́ orúkọ oyè náà hàn ní kedere.
- source_word: καταργεῖται
  choice: ni a ti mú un kúrò
  rationale: Ní mímú ìbòjú gẹ́gẹ́ bí ohun tí ọ̀rọ̀ náà ń tọ́ka sí, gbólóhùn yìí bá àwòrán náà mu, ó sì fi ìtumọ̀ àìṣe ti ọ̀rọ̀ Gíríìkì hàn ní Yorùbá.
theological_decisions:
- issue: Ohun tí καταργεῖται ń tọ́ka sí
  choice: 'Ìbòjú ni ọ̀rọ̀ arọ́pò ‘un’ ń tọ́ka sí: nínú Mèsáyà ni a mú ìbòjú náà kúrò.'
  alternative: Ó ṣeé ṣe kí májẹ̀mú àtijọ́ ni a ń sọ pé a sọ di aláìṣiṣẹ́ tàbí pé a mú kúrò; ó sì ṣeé ṣe kí ọ̀rọ̀ Gíríìkì fi ìtumọ̀ méjèèjì sílẹ̀ díẹ̀.
  rationale: τὸ κάλυμμα ni ohun tí ó sún mọ́ ọ̀rọ̀ náà jù, ó sì bá gbólóhùn ‘láìgbé e kúrò’ mu. Àlàyé ìsàlẹ̀ ojú ìwé sọ òye mìíràn láìfi ẹ̀kọ́ ìjọ kan lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti ti òde òní. ‘Èrò inú wọn ti yigbì’ jẹ́ àpèjúwe àdánidá fún líle tàbí àìgbọ́ràn agbára òye; ‘ìbòjú’ sì pa àwòrán Mósè mọ́.
