  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ẹsẹ̀ Gíríìkì náà dáadáa: àwọn ará Kọ́ríńtì ni a pè ní lẹ́tà àwọn aposteli, a kọ lẹ́tà náà sínú ọkàn wọn, gbogbo ènìyàn sì mọ̀ ọ́, wọ́n sì kà á. Ṣùgbọ́n, a nílò àtúnṣe kékeré kí àbùdá ìṣe tí a ti parí nínú ἐγγεγραμμένη hàn kedere, kí ipò ‘nínú’ bá ἐν mu, àti kí ohun tí a ń kà má bàa dàrú.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tí ó rọrùn láti yé. “Tí wọ́n sì ń kà” lè jẹ́ kedere nínú àyíká rẹ̀, ṣùgbọ́n fifi “á” kún un jẹ́ kí ó dájú pé lẹ́tà náà ni gbogbo ènìyàn ń kà.
  terminology: “Lẹ́tà,” “ọkàn,” “mọ̀,” àti “kà” jẹ́ àwọn ọ̀rọ̀ tó yẹ, tó sì dá àkàwé Pọ́ọ̀lù dúró. “Ẹ̀yin ni” tún pa ìtẹnumọ́ ὑμεῖς mọ́ ní ọ̀nà Yorùbá àdánidá.
  issues:
