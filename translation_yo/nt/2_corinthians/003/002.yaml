  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: yo
  text: Ẹ̀yin ni lẹ́tà wa, tí a ti kọ nínú ọkàn wa, tí gbogbo ènìyàn mọ̀, tí wọ́n sì ń kà á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: lẹ́tà wa
  rationale: “Lẹ́tà” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ìwé ìbánisọ̀rọ̀; “wa” sì pa ìní tí ἡμῶν ń fihàn mọ́.
- source_word: ὑμεῖς ἐστε
  choice: Ẹ̀yin ni
  rationale: Ìṣètò yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì mú ìtẹnumọ́ orúkọ-arọ́pò-orúkọ ὑμεῖς jáde láìdi ọ̀rọ̀ náà lọ́wọ́.
- source_word: ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν
  choice: tí a kọ sínú ọkàn wa
  rationale: “Tí a kọ” sọ perfect passive participle náà ní ọ̀nà àdánidá; “sínú ọkàn wa” pa ìtumọ̀ ἐν mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá sábà máa ń lo “ọkàn” ní ẹyọ fún inú ìmọ̀lára tàbí èrò ẹgbẹ́ kan.
- source_word: γινωσκομένη
  choice: tí gbogbo ènìyàn mọ̀
  rationale: “Mọ̀” bo ìtumọ̀ pé a mọ lẹ́tà náà tàbí pé a dá a mọ̀, ó sì bá àkàwé lẹ́tà mu.
- source_word: ἀναγινωσκομένη
  choice: tí wọ́n sì ń kà
  rationale: “Ń kà” tú ìṣe kíkà lẹ́tà ní tààrà, ó sì pa àkàwé Pọ́ọ̀lù mọ́.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: gbogbo ènìyàn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí gbogbo ènìyàn láìfi akọ tàbí abo pàtó sí i; a fi aṣojú olùṣe náà sí iwájú àwọn ọ̀rọ̀-ìṣe méjèèjì ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé lasán. A lo “Ẹ̀yin ni” láti pa ìtẹnumọ́ Gíríìkì mọ́, a sì lo “ọkàn wa” gẹ́gẹ́ bí àṣà Yorùbá fún inú ẹni. A kò fi àlàyé ẹ̀kọ́ ìsìn kún un.
