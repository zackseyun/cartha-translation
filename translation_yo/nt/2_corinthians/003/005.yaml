    rationale: ‘Yíyẹ’ ní Yorùbá lè túmọ̀ sí jíjẹ ẹni tí ó yẹ, ìtẹ́wọ́gbà, tàbí worthiness; ìtumọ̀ yìí kò dá ìtó/agbára tó pọ̀ tó nínú ọ̀rọ̀ Gíríìkì hàn ní kedere.
  - severity: low
