review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì dáadáa ní pàtàkì: ìfẹ̀sùn-kúrò náà (‘Kì í ṣe pé’), ìtó tí kì í ṣe ti ara ẹni, ìṣe ìrònú/ìṣírò, àti Ọlọ́run gẹ́gẹ́ bí orísun ìtó. Ṣùgbọ́n ‘yíyẹ’ sábà máa ń tọ́ka sí jíjẹ ẹni tí ó yẹ tàbí wúlò, kì í ṣe ìtó/agbára tó pọ̀ tó; nítorí náà ó lè yí ἱκανότης padà. ‘Tóótun’ náà kò dára tó nínú ìforúkọsílẹ̀ yìí.'
  naturalness: ‘A tó nínú ara wa’ àti ‘ìtó wa’ jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì dára fún ìforúkọsílẹ̀ ìwé mímọ́. Àtúnṣe náà tún pa ìsopọ̀ tó wà láàárín ἱκανοί àti ἱκανότης mọ́ nípasẹ̀ ‘tó/ìtó.’
  terminology: A rọ́pò ‘tóótun/yíyẹ’ pẹ̀lú ‘tó/ìtó.’ Èyí yẹra fún ìtumọ̀ ‘worthiness’ tí ‘yíyẹ’ lè mú wá, ó sì ń ṣàfihàn agbára tàbí ìmúrasílẹ̀ tó tó bí ἱκανός/ἱκανότης ṣe ń ṣe. A tún ṣètò àwọn àmì ìsàlẹ̀ kí ọkọọkan lè so mọ́ ọ̀rọ̀ tí ìsàlẹ̀ rẹ̀ ń ṣàlàyé.
  issues:
