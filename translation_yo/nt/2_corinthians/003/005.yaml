  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: yo
  text: Kì í ṣe pé a tó[a] nínú ara wa láti ka ohunkóhun sí ohun tí ó ti ọ̀dọ̀ ara wa wá[b], ṣùgbọ́n ìtó wa ti ọ̀dọ̀ Ọlọ́run wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tó” àti “ìtó” tún lè túmọ̀ sí “ní agbára tó” tàbí “péye.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti rò tàbí ṣírò ohunkóhun bí ohun tí ó ti ọ̀dọ̀ ara wa wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Kì í ṣe pé
  rationale: Ó fi ìṣàlàyé tàbí àtúnṣe ọ̀rọ̀ kan hàn, kì í ṣe ìdí ohun kan; ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: àwa tóótun nínú ara wa
  rationale: ‘Tóótun’ túmọ̀ sí ẹni tí ó ní agbára tàbí ìyẹ́ tó pọ̀ tó fún ohun kan; ‘nínú ara wa’ tẹnumọ́ pé ìyẹ́ náà kì í ṣe ohun tí ó wà lára wa fúnra wa.
- source_word: λογίσασθαί τι
  choice: láti ka ohunkóhun sí
  rationale: λογίζομαι níhìn-ín jẹ́ ṣíṣe ìṣírò tàbí ìdájọ́ nínú ọkàn; ‘ka … sí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: ὡς ἐξ αὑτῶν
  choice: ohun tí ó ti ọ̀dọ̀ ara wa wá
  rationale: 'Ó pa èrò orísun mọ́: ohun náà dà bí ohun tí ó pilẹ̀ láti ọ̀dọ̀ wa fúnra wa.'
- source_word: ἡ ἱκανότης ἡμῶν
  choice: yíyẹ wa
  rationale: ‘Yíyẹ’ sọ ipò jíjẹ́ ẹni tóótun tàbí ẹni tí agbára rẹ̀ tó; ó tún pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ‘tóótun’ ní ìbẹ̀rẹ̀ ẹsẹ náà.
- source_word: ἐκ τοῦ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó fi Ọlọ́run hàn gẹ́gẹ́ bí orísun yíyẹ náà láìfi àlàyé mìíràn kún un.
theological_decisions:
- issue: Ìwọ̀n ọ̀rọ̀ Pọ́ọ̀lù nípa agbára ènìyàn
  choice: A kò tóótun láti inú ara wa, yíyẹ wa sì ti ọ̀dọ̀ Ọlọ́run wá.
  alternative: Ọ̀rọ̀ náà lè tọ́ka ní pàtó sí yíyẹ fún iṣẹ́ ìránṣẹ́ aposteli.
  rationale: Àyíká ẹsẹ náà dá lórí iṣẹ́ ìránṣẹ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbòòrò; ìtumọ̀ náà kò yẹ kí ó dín un kù sí ọgbọ́n iṣẹ́ ìránṣẹ́ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yan ‘tóótun/yíyẹ’ láti pa ìsopọ̀ ἱκανοί/ἱκανότης mọ́, bí ó tilẹ̀ jẹ́ pé kò ṣeé pa mọ́ nípasẹ̀ ọ̀rọ̀ kan ṣoṣo ní Yorùbá.
