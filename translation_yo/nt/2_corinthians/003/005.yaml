    rationale: ‘Tó/ìtó’ jẹ́ ìbáṣepọ̀ Yorùbá tó hàn gbangba, ó sì dá ìtó ẹni àti ìtó rẹ̀ hàn dáadáa.
  - severity: medium
    issue: Àwọn àmì ìsàlẹ̀ a àti b kò so mọ́ ibi tí àwọn ìsàlẹ̀ wọn ń ṣàlàyé.
