  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: yo
  text: Ṣé a tún ń bẹ̀rẹ̀ sí í fi ara wa hàn gẹ́gẹ́ bí ẹni tí ó yẹ? Tàbí, bí àwọn kan, a ha nílò àwọn lẹ́tà ìdámọ̀ràn[a] sí yín tàbí láti ọ̀dọ̀ yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn lẹ́tà ìyìn.”
    reason: 'ìyàtọ̀ ọ̀rọ̀: ‘letters of commendation’'
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: Ǹjẹ́ a tún bẹ̀rẹ̀ sí í
  rationale: Ìbéèrè yìí pa ìtumọ̀ ìbẹ̀rẹ̀ ohun kan mọ́, nígbà tí “tún” fi hàn pé ó ń ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: yin ara wa
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà túmọ̀ sí fífi ara ẹni hàn gẹ́gẹ́ bí ẹni tó yẹ fún ìtẹ́wọ́gbà; “yin ara wa” jẹ́ ọ̀nà àdánidá àti kedere láti sọ ó ní Yorùbá.
- source_word: ἢ μὴ χρῄζομεν
  choice: Tàbí a nílò
  rationale: Ó ṣe àgbékalẹ̀ ẹ̀ka kejì ti ìbéèrè àsọ̀rọ̀; ìbéèrè náà fúnra rẹ̀ mú ìfojúsọ́nà pé ìdáhùn jẹ́ bẹ́ẹ̀ kọ́ hàn.
- source_word: ὥς τινες
  choice: bí àwọn kan
  rationale: Ó tọ́ka sí àwùjọ kan tí a kò dárúkọ ní pàtó, ó sì pa ìfiwéra orísun mọ́.
- source_word: συστατικῶν ἐπιστολῶν
  choice: àwọn lẹ́tà ìjẹ́rìí
  rationale: Ó ń tọ́ka sí lẹ́tà tí ń fi ẹni kan mọ̀ tàbí tí ń jẹ́rìí pé ẹni náà yẹ fún ìtẹ́wọ́gbà. “Lẹ́tà ìjẹ́rìí” jẹ́ kedere, ó sì yẹ fún èdè Yorùbá òde òní.
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: sí yín tàbí láti ọ̀dọ̀ yín
  rationale: “Sí yín” pa ìtọ́sọ́nà πρὸς mọ́, “láti ọ̀dọ̀ yín” sì pa orísun tí ἐξ ń tọ́ka sí mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì rọrùn fún òǹkàwé gbogbogbò láti lóye. Ìbéèrè méjèèjì ni a pa mọ́ gẹ́gẹ́ bí ìbéèrè àsọ̀rọ̀.
