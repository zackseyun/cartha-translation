review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọ̀rọ̀ méjèèjì, ‘tún,’ ìfiwéra pẹ̀lú àwọn kan, àti ìhà méjèèjì ‘sí yín tàbí láti ọ̀dọ̀ yín’ mọ́. Síbẹ̀, ‘lẹ́tà ìjẹ́rìí’ lè tọ́ka sí ẹ̀rí tàbí ìjẹ́rìí ní ìtumọ̀ gbogbogbò, kì í sì ṣe kedere pé lẹ́tà ìdámọ̀ràn/ìfọwọ́sí ènìyàn ni συστατικῶν ἐπιστολῶν ń tọ́ka sí nínú àyíká yìí.
  naturalness: ‘Yin ara wa’ lóye, ṣùgbọ́n ‘fi ara wa hàn gẹ́gẹ́ bí ẹni tí ó yẹ’ ń sọ ìṣe ‘commend ourselves’ ní ọ̀nà Yorùbá tí ó mọ́gbọ́n dání. Fífi ‘Ṣé’ àti ‘a ha’ hàn mú kí ìbéèrè àsọ̀rọ̀ méjèèjì dùn ní ti ẹ̀dá Yorùbá.
  terminology: ‘Àwọn lẹ́tà ìdámọ̀ràn’ ni ọ̀rọ̀ Yorùbá òde òní tó yege fún àwọn lẹ́tà tí ń dámọ̀ràn ẹni kan. Àmì ẹsẹ̀ [a] ni a tún so mọ́ ọ̀rọ̀ náà, pẹ̀lú ìyàtọ̀ lexical tó bá ìtẹ̀lé Gẹ̀ẹ́sì mu.
  issues:
  - severity: medium
    issue: ‘Àwọn lẹ́tà ìjẹ́rìí’ kò ṣàfihàn iṣẹ́ ìdámọ̀ràn/ìfọwọ́sí ti συστατικῶν ἐπιστολῶν ní kíkún.
    rationale: ‘Ìjẹ́rìí’ sábà máa ń túmọ̀ sí testimony, certificate, tàbí ẹ̀rí; ní àyíká yìí Pọ́ọ̀lù ń tọ́ka sí letters of recommendation.
  - severity: low
