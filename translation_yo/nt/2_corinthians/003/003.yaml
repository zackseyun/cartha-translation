    issue: Ìtúmọ̀ διακονηθεῖσα ὑφ’ ἡμῶν
    rationale: '‘Tí a ṣe iṣẹ́ ìránṣẹ́ rẹ̀’ jẹ́ aláìlékọ̀ọ́: aṣojú ‘rẹ̀’ lè tọ́ka sí lẹ́tà náà, ó sì lè yí ipa ‘àwa’ nínú gbolohun Gíríìkì padà. ‘Tí a kọ nípasẹ̀ iṣẹ́ ìránṣẹ́ wa’ fi hàn pé iṣẹ́ ìránṣẹ́ àwọn aposteli ni ọ̀nà tí lẹ́tà náà fi wá.'
