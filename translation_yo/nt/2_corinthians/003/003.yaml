  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì ẹsẹ̀ náà mọ́: àwọn olùgbọ́ jẹ́ lẹ́tà tí Mèsáyà ti rán, a sì lo Ẹ̀mí Ọlọ́run alààyè dípò yíǹkì. Ṣùgbọ́n “tí a ṣe iṣẹ́ ìránṣẹ́ rẹ̀” kò fi hàn dáadáa pé ‘àwa’ ni aṣojú/ìránṣẹ́ tí ó ṣe iṣẹ́ lórí lẹ́tà náà; ó lè dà bí ẹni pé a ṣe iṣẹ́ ìránṣẹ́ ‘rẹ̀’ fún lẹ́tà náà. Pẹ̀lú èyí, καρδίαις jẹ́ púpọ̀, nítorí náà a nílò ‘àwọn ọkàn,’ àti pé gbolohun ìkẹyìn gbọ́dọ̀ fi ìfarakọ (apposition) wàláà àti ọkàn hàn.'
  naturalness: Yorùbá náà dára lápapọ̀, pẹ̀lú àwọn àmì ohùn tó péye. Àtúnṣe kékeré sí ‘nípasẹ̀ iṣẹ́ ìránṣẹ́ wa’ ṣe ìbáṣepọ̀ participle passive náà kedere. ‘Àwọn wàláà, ìyẹn àwọn ọkàn ẹran-ara’ jẹ́ òde-òní, ó sì ṣàlàyé àwòrán náà láìyí ìtumọ̀ rẹ̀ padà.
  terminology: ‘Mèsáyà,’ ‘Ẹ̀mí Ọlọ́run alààyè,’ ‘yíǹkì,’ àti ‘wàláà òkúta’ yẹ. A tún gbe àmì àlàyé ‘Mèsáyà/Kristi’ sún mọ́ Mèsáyà; nínú àkọ́kọ́, àmì [b] wà lẹ́yìn ‘Ẹ̀mí Ọlọ́run alààyè’ bí ó tilẹ̀ jẹ́ pé Mèsáyà ni àlàyé rẹ̀ ń ṣàlàyé.
  issues:
