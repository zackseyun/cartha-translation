id: 2CO.3.3
reference: 2 Corinthians 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: yo
  text: Ó hàn gbangba pé lẹ́tà láti ọ̀dọ̀ Mèsáyà[a][b] ni yín, tí a kọ nípasẹ̀ iṣẹ́ ìránṣẹ́ wa, kì í ṣe pẹ̀lú yíǹkì, bí kò ṣe pẹ̀lú Ẹ̀mí Ọlọ́run alààyè; kì í ṣe sórí àwọn wàláà òkúta, bí kò ṣe sórí àwọn wàláà, ìyẹn àwọn ọkàn ẹran-ara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́tà Mèsáyà.” Gẹnitífù Gíríìkì náà lè fi hàn pé Mèsáyà ni olùní lẹ́tà náà tàbí ẹni tí lẹ́tà náà ti ọ̀dọ̀ rẹ̀ wá.
    reason: alternative_reading
  - marker: b
    text: “Mèsáyà” ni a fi tú akọ́lé Gíríìkì náà Χριστός, èyí tí a sábà máa ń pè ní “Kristi.”
    reason: lexical_alternative
  - marker: c
    text: “Àwọn ọkàn ẹran-ara” ń mú àwòrán májẹ̀mú tuntun nínú Ìsíkíẹ́lì 11:19 àti 36:26 wá sí ìrántí; ọkàn tí ó rọ̀, tí ó sì lè gba iṣẹ́ Ọlọ́run, ni a fi wé ọkàn òkúta.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Ó hàn gbangba pé
  rationale: Èyí sọ pé ohun tí Pọ́ọ̀lù ń tọ́ka sí ti fara hàn kedere, ó sì bá ìlò Yorùbá mu láìfi ipá ẹni tó mú un hàn sí i ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐπιστολὴ Χριστοῦ
  choice: lẹ́tà láti ọ̀dọ̀ Mèsáyà
  rationale: “Lẹ́tà” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ἐπιστολή. “Láti ọ̀dọ̀” fi ìtumọ̀ orísun tàbí olùkọ lẹ́tà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gẹnitífù míì mọ́.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: tí a ṣe iṣẹ́ ìránṣẹ́ rẹ̀
  rationale: Ó pa èrò iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ alábàápín Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ mọ́, láìdín un kù sí kíkàn fi lẹ́tà ránṣẹ́.
- source_word: ἐγγεγραμμένη οὐ μέλανι
  choice: tí a kọ kì í ṣe pẹ̀lú yíǹkì
  rationale: Ó pa àwòrán kíkọ lẹ́tà àti ìyàtọ̀ yíǹkì sí Ẹ̀mí mọ́ ní Yorùbá àdánidá.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: pẹ̀lú Ẹ̀mí Ọlọ́run alààyè
  rationale: Àyíká májẹ̀mú tuntun àti ìyàtọ̀ sí yíǹkì tọ́ka sí Ẹ̀mí Ọlọ́run; “Ọlọ́run alààyè” sì pa gbogbo gbólóhùn Gíríìkì mọ́.
- source_word: πλαξὶν λιθίναις
  choice: àwọn wàláà òkúta
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún pátákó tí a lè kọ sí, ó sì pa ìtọ́kasí sí àwọn wàláà òkúta Sínáì mọ́.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: àwọn wàláà tí í ṣe ọkàn ẹran ara
  rationale: Ìtumọ̀ yìí jẹ́ kí ó ṣe kedere pé àwọn ọkàn náà ni àwọn wàláà, kì í ṣe pé wàláà náà wà lórí ọkàn; ó tún pa àwòrán “ọkàn ẹran ara” mọ́.
theological_decisions:
- issue: Ìtumọ̀ gẹnitífù Χριστοῦ
  choice: lẹ́tà láti ọ̀dọ̀ Mèsáyà
  alternative: lẹ́tà Mèsáyà
  rationale: Gẹnitífù náà lè fi orísun tàbí olùní hàn. Àyíká lẹ́tà mú kí orísun tàbí olùkọ ṣeé ṣe gan-an, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ tó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìdánimọ̀ πνεύματι
  choice: Ẹ̀mí Ọlọ́run alààyè
  alternative: ẹ̀mí Ọlọ́run alààyè
  rationale: Ìyàtọ̀ láàárín yíǹkì àti ohun tí Ọlọ́run fi ń kọ sínú ọkàn, pẹ̀lú àyíká májẹ̀mú tuntun, fi agbára tọ́ka sí Ẹ̀mí Mímọ́.
- issue: Àwòrán καρδίαις σαρκίναις
  choice: ọkàn ẹran ara
  alternative: ọkàn tí ó jẹ́ ti ẹran ara
  rationale: A pa àwòrán àsọtẹ́lẹ̀ májẹ̀mú tuntun mọ́, níbi tí ọkàn ẹran ara ti yàtọ̀ sí ohun líle bí òkúta; “ẹran ara” níbí kò túmọ̀ sí ìwà ẹlẹ́ṣẹ̀.
translation_notes:
  register: 'Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A lo “Mèsáyà” gẹ́gẹ́ bí akọ́lé, a sì fi “Kristi” sínú àlàyé. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ; ìtòlẹ́sẹẹsẹ gbólóhùn náà pa ìyàtọ̀ méjèèjì mọ́: yíǹkì sí Ẹ̀mí, àti wàláà òkúta sí ọkàn ẹran ara.'
