  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: yo
  text: Irú ìgbọ́kànlé bẹ́ẹ̀ ni a ní nípasẹ̀ Mèsáyà[a] sí Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “níwájú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: ìgbẹ́kẹ̀lé
  rationale: Ó sọ ìdánilójú ọkàn àti ìgboyà tí ó fìdí múlẹ̀, láìfi ìmọ̀lára lásán kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ fẹ́rẹ̀ẹ́ tí ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú, láìsọ ọ́ di ìtakora líle.
- source_word: τοιαύτην
  choice: irú … bẹ́ẹ̀
  rationale: Ìṣọ̀kan “irú … bẹ́ẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára àpèjúwe ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: ἔχομεν
  choice: a ní
  rationale: Èyí ni ìtumọ̀ tààrà àti èdè Yorùbá tí ó wọ́pọ̀ jù lọ.
- source_word: διὰ τοῦ Χριστοῦ
  choice: nípasẹ̀ Mèsáyà
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń fi ẹni tí ohun kan tipasẹ̀ rẹ̀ wá hàn; “nípasẹ̀” mú ìtumọ̀ alárinà yẹn jáde. Χριστός jẹ́ oyè níhìn-ín, nítorí náà a lò “Mèsáyà.”
- source_word: πρὸς τὸν θεόν
  choice: níwájú Ọlọ́run
  rationale: Bí ó tilẹ̀ jẹ́ pé πρός túmọ̀ ní tààrà sí “sí/ní ìhà,” “níwájú Ọlọ́run” jẹ́ èdè Yorùbá àdánidá fún ìgbẹ́kẹ̀lé tí ó dojú kọ Ọlọ́run tàbí tí a ní ní ìbáṣepọ̀ pẹ̀lú rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” pa ìtumọ̀ ẹni àmì-òróró mọ́. A fi “Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ tí ó wọ́pọ̀.
- issue: Ìtọ́kasí πρὸς τὸν θεόν
  choice: níwájú Ọlọ́run
  alternative: sí Ọlọ́run
  rationale: A yan ọ̀nà tí ó dára sí etí Yorùbá, ṣùgbọ́n a pa ìdarí tààrà “sí Ọlọ́run” mọ́ nínú àlàyé ìsàlẹ̀, kí a má bàa mú àìdánilójú ìbáṣepọ̀ inú Gíríìkì kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé yé, ni a lò. “Sì” gbé àsopọ̀ δέ jáde ní pẹ̀lẹ́pẹ̀lẹ́; ìṣètò gbólóhùn náà sì tẹ̀lé ìrìn ọ̀rọ̀ Gíríìkì láìsọ Yorùbá di líle.
