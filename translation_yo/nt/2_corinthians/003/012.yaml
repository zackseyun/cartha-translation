translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti ní irú ìrètí bẹ́ẹ̀, a ń lo ìgboyà ńlá,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń hùwà ní ìfẹ̀hàn púpọ̀,” tàbí, “a ń sọ̀rọ̀ pẹ̀lú ìfọ̀kànbalẹ̀ púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Nítorí náà, bí a ti ní
  rationale: Ọ̀rọ̀ yìí fi àbájáde ohun tí a ti sọ ṣáájú hàn; ‘bí a ti ní’ tú participle náà lọ́nà àdánidá ní Yorùbá, ‘nítorí náà’ sì pa agbára ìtumọ̀ οὖν mọ́.
- source_word: τοιαύτην ἐλπίδα
  choice: irú ìrètí yìí
  rationale: Ó pa agbára atọ́ka àti ànímọ́ τοιαύτην mọ́, ó sì tọ́ka sí ìrètí tí àyíká ọ̀rọ̀ ti ṣàlàyé.
- source_word: πολλῇ παρρησίᾳ
  choice: ìgboyà ńlá
  rationale: παρρησία lè túmọ̀ sí ìgboyà, ṣíṣí ọkàn, tàbí sísọ̀rọ̀ láìfipamọ́; ‘ìgboyà ńlá’ bá ìyàtọ̀ tí àyíká ọ̀rọ̀ ṣe sí ìbòjú mu, láìfi àwọn ìtumọ̀ míì sílẹ̀ pátápátá.
- source_word: χρώμεθα
  choice: a ń fi ... hùwà
  rationale: Ọ̀rọ̀-ìṣe àárín yìí pẹ̀lú dative túmọ̀ sí lílo ohun kan tàbí ṣíṣe ohun kan pẹ̀lú rẹ̀. Àkójọpọ̀ ‘fi ... hùwà’ jẹ́ Yorùbá àdánidá tí kò fi dandan sọ pé ọ̀rọ̀ sísọ nìkan ni Paulu ní lọ́kàn.
