  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé lóye. A pa ìbáṣepọ̀ ìdí-àbájáde àti àìdánilójú ìtumọ̀ παρρησία mọ́; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
