  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ èrò Gíríìkì mọ́ dáadáa: διακονία τοῦ θανάτου, ògo, àbájáde ìfẹ̀sìnkúwò ojú Mósè, àti ìṣe lọwọlọwọ ti καταργουμένην. Ṣùgbọ́n “àwọn lẹ́tà rẹ̀” fi aṣe-orúkọ “rẹ̀” kún un tí kò sí nínú orísun, ó sì lè yí ìbáṣepọ̀ ‘ní àwọn lẹ́tà, tí a gbẹ́ sínú òkúta’ padà. A ti yọ ìfikún náà kúrò, a sì ṣètò ọ̀rọ̀ náà kí ó sún mọ́ orísun.'
