id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: yo
  text: Ṣùgbọ́n bí iṣẹ́ ìránṣẹ́ ikú, tí a kọ sínú òkúta pẹ̀lú àwọn lẹ́tà, bá wá ní ògo, tí ó fi jẹ́ pé àwọn ọmọ Ísírẹ́lì kò lè tẹjú mọ́ ojú Mósè nítorí ògo ojú rẹ̀, tí ń kọjá lọ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ń ṣá lọ,” tàbí “tí a ń mú dé òpin.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ó pa èrò iṣẹ́ ìsìn tàbí ojúṣe tí a fi lé ẹni lọ́wọ́ mọ́, ó sì bá ìyàtọ̀ májẹ̀mú tí Pọ́ọ̀lù ń ṣe mu ní Yorùbá àdánidá.
- source_word: τοῦ θανάτου
  choice: ikú
  rationale: A pa ìsopọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ ní ṣókí gẹ́gẹ́ bí “iṣẹ́ ìránṣẹ́ ikú,” láì túmọ̀ rẹ̀ sí “tí ń mú ikú wá.”
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: tí a fi àwọn lẹ́tà rẹ̀ gbẹ́ sára òkúta
  rationale: “Àwọn lẹ́tà” pa àfihàn γράμματα mọ́, “gbẹ́” sì sọ iṣẹ́ fífi àmì jinlẹ̀ sí nǹkan; “òkúta” ni a lò dípò fífi “wàláà” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: bá dé pẹ̀lú ògo
  rationale: Ó fi ìṣẹ̀lẹ̀ wíwá iṣẹ́ ìránṣẹ́ náà hàn, ó sì sọ pé ògo bá a dé.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: tó bẹ́ẹ̀ tí ... kò fi lè tẹjú mọ́
  rationale: Ó pa gbólóhùn àbájáde àti ìtumọ̀ wíwo ohun kan fínnífínní mọ́.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bójú mu láti ṣàfihàn ọ̀rọ̀ Sẹ́mítì/Gíríìkì náà; “ọmọ” nínú Yorùbá lè tọ́ka sí àwọn àtọmọdọ́mọ láì fi ìbálòpọ̀ akọ kún un ní ọ̀nà tí kò bójú mu.
- source_word: καταργουμένην
  choice: tí ń kọjá lọ
  rationale: Ó pa ìtumọ̀ pé ògo náà kò dúró pẹ́ mọ́, ṣùgbọ́n kò dá ìtumọ̀ náà mọ́ sí díẹ̀díẹ̀ dín kù nìkan tàbí sí mímú un dé òpin nìkan.
theological_decisions:
- issue: Bóyá καταργουμένην túmọ̀ sí ògo tí ń ṣá lọ, tí a ń mú dé òpin, tàbí tí ń kọjá lọ.
  choice: ògo tí ń kọjá lọ
  alternative: ògo tí ń ṣá lọ; ògo tí a ń mú dé òpin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ògo ojú Mósè ní àyíká lẹ́sẹ̀kẹsẹ̀, ó sì tún lè ru èrò ohun tí ń parí tàbí tí a ń mú kúrò. “Ń kọjá lọ” pa ìfọ̀rọ̀wérọ̀ yìí mọ́ láì pinnu rẹ̀ ju bí orísun ṣe pinnu lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà mọ̀ọ́mọ̀ parí pẹ̀lú àmì ìdádúró nítorí ẹsẹ yìí jẹ́ apá àkọ́kọ́ gbólóhùn tó ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
