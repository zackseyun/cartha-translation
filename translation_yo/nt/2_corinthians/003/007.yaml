revisions:
- from: Ṣùgbọ́n bí iṣẹ́ ìránṣẹ́ ikú, tí a fi àwọn lẹ́tà rẹ̀ gbẹ́ sára òkúta, bá dé pẹ̀lú ògo, tó bẹ́ẹ̀ tí àwọn ọmọ Ísírẹ́lì kò fi lè tẹjú mọ́ ojú Mósè nítorí ògo ojú rẹ̀—ògo tí ń kọjá lọ[a]—
  to: Ṣùgbọ́n bí iṣẹ́ ìránṣẹ́ ikú, tí a kọ sínú òkúta pẹ̀lú àwọn lẹ́tà, bá wá ní ògo, tí ó fi jẹ́ pé àwọn ọmọ Ísírẹ́lì kò lè tẹjú mọ́ ojú Mósè nítorí ògo ojú rẹ̀, tí ń kọjá lọ[a]—
