id: 2CO.3.11
reference: 2 Corinthians 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: yo
  text: Nítorí bí ohun tí a ń mú dé òpin ti wá pẹ̀lú ògo[a][b], ohun tí ó wà títí wà nínú ògo ní ìwọ̀n púpọ̀ sí i[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a ń mú kúrò,” “ohun tí a ń fi sí ẹ̀gbẹ́ kan,” tàbí “ohun tí a ń parẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní gangan, “nípasẹ̀ ògo.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ohun tí ó ń bá a lọ” tàbí “ohun tí ó ń pẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: ohun tí a ń mú kúrò
  rationale: Ó fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì mú èrò ‘mú kúrò, mú dé òpin, sọ di aláìṣiṣẹ́’ jáde láì fi ‘rẹ̀ dànù’ tí ó jẹ́ ìtumọ̀ àyíká rọ́pò ọ̀rọ̀ Gíríìkì náà.
- source_word: διὰ δόξης
  choice: wá pẹ̀lú ògo
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘nípasẹ̀ ògo,’ gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ohun tí ògo bá dé, láì sọ pé ògo ni ohun èlò tó mú un ṣẹlẹ̀.
- source_word: μένον
  choice: ohun tí ó dúró
  rationale: ‘Dúró’ lè túmọ̀ sí pé ohun kan ń bá a lọ, ó wà ṣinṣin, tàbí ó ń pẹ́; ó pa ìyàtọ̀ mọ́ láàárín ohun tí a ń mú kúrò àti ohun tí ó ń bá a lọ.
- source_word: ἐν δόξῃ
  choice: yóò wà nínú ògo
  rationale: Ó pa àkójọpọ̀ ἐν δόξῃ mọ́ gẹ́gẹ́ bí ipò tàbí àyíká ògo, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: πολλῷ μᾶλλον
  choice: mélòómélòó
  rationale: 'Ọ̀nà Yorùbá àdánidá ni láti fi ìfiwéra tó lágbára hàn: ‘ní ìwọ̀n púpọ̀ sí i.’'
theological_decisions:
- issue: Ìyàtọ̀ láàárín ohun tí a ń mú kúrò àti ohun tí ó dúró
  choice: A fi àwọn méjèèjì sílẹ̀ gẹ́gẹ́ bí ‘ohun’ láì dárúkọ májẹ̀mú àtijọ́ tàbí tuntun ní tààrà.
  alternative: A lè sọ ní kedere pé ‘májẹ̀mú àtijọ́’ àti ‘májẹ̀mú tuntun.’
  rationale: Àwọn participle aláìlẹ́ni tí Gíríìkì lò kò dárúkọ àwọn májẹ̀mú náà nínú ẹsẹ yìí; àyíká ló ń ṣàlàyé wọn. Èyí pa àìsọ-kedere àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘mélòómélòó’ fún ìfiwéra alágbára, a sì yàgò fún fífi orúkọ àwọn májẹ̀mú sínú ẹsẹ níbi tí Gíríìkì kò ti dárúkọ wọn.
