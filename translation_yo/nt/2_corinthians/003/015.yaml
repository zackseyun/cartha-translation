id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: yo
  text: Ṣùgbọ́n títí di òní, nígbàkígbà tí a bá ka Mósè[a], ìbòjú kan ṣì wà lórí ọkàn wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni àwọn ìwé Mósè, pàápàá jù lọ Òfin.
    reason: cultural_note
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ní “ọkàn wọn” ní ẹyọ; ó ṣeé ṣe kó jẹ́ ẹyọ tí ń dúró fún gbogbo ẹgbẹ́ náà. A tún lè túmọ̀ rẹ̀ sí “àwọn ọkàn wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn ní ọ̀nà kúkúrú, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἕως σήμερον
  choice: títí di òní
  rationale: Ó fi hàn pé ipò náà ń bá a lọ dé àkókò tí òǹkọ̀wé ń sọ̀rọ̀; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: nígbàkígbà tí a bá ka
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí ó máa ń ṣẹlẹ̀ léraléra ní àkókò àìdájú; “nígbàkígbà” pa ìtumọ̀ yẹn mọ́.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: A pa orúkọ ẹni tí ọ̀rọ̀ Gíríìkì lò mọ́ gẹ́gẹ́ bí àpèjúwe fún àwọn ìwé Mósè, dípò fífi ìtumọ̀ náà sínú ọ̀rọ̀ pàtàkì.
- source_word: κάλυμμα
  choice: ìbòjú
  rationale: “Ìbòjú” bá àwòrán ohun tí ń bo ojú mu, ó sì so ẹsẹ yìí mọ́ àkòrí ìbòjú tó ń lọ ní gbogbo àyíká ọ̀rọ̀ náà.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: lórí ọkàn wọn
  rationale: Ọ̀rọ̀ Gíríìkì ní “ọkàn” ní ẹyọ ṣùgbọ́n “wọn” ní ọ̀pọ̀; Yorùbá yìí pa ìṣètò náà mọ́, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí ẹyọ àkójọpọ̀.
- source_word: κεῖται
  choice: ṣì wà
  rationale: Nínú àwòrán yìí, ọ̀rọ̀ náà túmọ̀ sí pé ìbòjú náà dúró sí ipò rẹ̀. “Ṣì wà” jẹ́ àdánidá ní Yorùbá, ó sì tẹnumọ́ pé ipò náà ń bá a lọ.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé “Mósè” túmọ̀ sí òfin tàbí àwọn ìwé Mósè
  choice: A pa “Mósè” mọ́ nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí orúkọ tí a lò fún àwọn ìwé rẹ̀.
  alternative: “Òfin Mósè” tàbí “àwọn ìwé Mósè.”
  rationale: Orísun Gíríìkì sọ “Mósè” gan-an. Pípa ọ̀rọ̀ náà mọ́ kò fi ìtumọ̀ kan ṣoṣo lé e lórí, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé ń mú ìtumọ̀ àpèjúwe rẹ̀ ṣe kedere.
- issue: Bóyá kí “ọkàn” jẹ́ ẹyọ tàbí ọ̀pọ̀
  choice: A lo “ọkàn wọn” ní ẹyọ àkójọpọ̀.
  alternative: “Àwọn ọkàn wọn.”
  rationale: Gíríìkì ní ẹyọ, ó sì ṣeé ṣe kó ń sọ̀rọ̀ nípa ẹgbẹ́ náà lápapọ̀. Yorùbá “ọkàn wọn” jẹ́ àdánidá, ó sì pa ìforígbárí girama orísun náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “nígbàkígbà tí a bá ka” fún gbólóhùn aláìlórúkọ ẹni tí ó bá àṣà Yorùbá mu, a sì fi “ṣì” hàn pé ipò náà ń bá a lọ títí di òní. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
