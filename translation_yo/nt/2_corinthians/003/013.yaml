  source_fidelity: 'Ìtumọ̀ náà ní gbogbogbò rẹ̀ tẹ̀lé Gíríìkì dáadáa: ìfiwéra pẹ̀lú Mósè, ìṣe àṣà ti fífi ìbòjú bo ojú, ète kí àwọn ọmọ Ísírẹ́lì má wo, àti ‘òpin ohun tí ń kọjá lọ’ wà níbẹ̀. Síbẹ̀, ‘kì í sì í ṣe’ kò ní kókó-ọrọ tí a jogún láti ẹsẹ̀ tó ṣáájú, ó sì ní ìtẹ̀lé àmì ìṣe àṣà tí kò rọrùn. ‘A kò sì í ṣe’ mú ‘and not like Moses’ jáde ní kedere. ‘má bà á’ tún yẹ kí ó jẹ́ ‘má bàa’ nínú ìlò ète/ìdènà yìí.'
  naturalness: ‘A kò sì í ṣe bí Mósè’ jẹ́ Yorùbá boṣewa, ó sì bá àbá ọrọ̀ ẹsẹ̀ 12 mu. ‘Bo ojú rẹ̀’ dáa ju ‘bo ojú ara rẹ̀’ lọ nítorí pé ó jẹ́ àdánidá, kò sì pàdánù ìtumọ̀ ìfàsẹ́yìn náà. ‘Kí ... má bàa tẹjú mọ́’ jẹ́ ọ̀nà kedere fún ète tí Gíríìkì πρὸς τὸ μὴ ἀτενίσαι ń sọ.
  terminology: ‘Ìbòjú,’ ‘Mósè,’ ‘Ísírẹ́lì,’ àti ‘tẹjú mọ́’ yẹ. ‘Àwọn ọmọ Ísírẹ́lì’ pa àṣà ọ̀rọ̀ Bíbélì mọ́. Àlàyé [b] yẹ kí ó sọ pé Gíríìkì lo ‘àwọn ọmọkùnrin,’ níwọ̀n bí ‘àwọn ọmọ Ísírẹ́lì’ nínú Yorùbá kò ṣe fi ìyàtọ̀ akọ hàn.
