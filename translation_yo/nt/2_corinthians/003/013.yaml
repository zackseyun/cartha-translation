id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: yo
  text: a kò sì í ṣe bí Mósè, ẹni tí ó máa ń fi ìbòjú bo ojú rẹ̀, kí àwọn ọmọ Ísírẹ́lì má bàa tẹjú mọ́ òpin ohun tí ń kọjá lọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ète tàbí àbájáde ohun tí a ń mú wá sí òpin.”
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “àwọn ọmọkùnrin Ísírẹ́lì”; ní ìtumọ̀ àṣà ọ̀rọ̀, “àwọn ọmọ Ísírẹ́lì” tàbí “àwọn ará Ísírẹ́lì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: bí
  rationale: Ó fi ìṣe Mósè wé ohun tí Pọ́ọ̀lù sọ ṣáájú; ‘bí’ jẹ́ ọ̀nà àdánidá àti kúkúrú ní Yorùbá.
- source_word: ἐτίθει
  choice: ó máa ń fi ... bo
  rationale: Àkókò imperfect nínú Gíríìkì ń tọ́ka sí ìṣe tí Mósè sábà máa ń ṣe, èyí tí ‘máa ń’ mú jáde ní kedere.
- source_word: κάλυμμα
  choice: ìbòjú
  rationale: ‘Ìbòjú’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ohun tí a fi bo ojú, ó sì bá àkàwé Pọ́ọ̀lù mu.
- source_word: πρόσωπον αὐτοῦ
  choice: ojú ara rẹ̀
  rationale: Ó sọ ‘ojú tirẹ̀’ ní ọ̀nà Yorùbá tó ṣe kedere, ó sì jẹ́ kí olùṣe ìṣe náà hàn dáadáa.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: kí ... má bà á tẹjú mọ́
  rationale: Ó pa ète gbolohun Gíríìkì mọ́, ‘tẹjú mọ́’ sì fi ìtumọ̀ wíwo ohun kan láì yí ojú kúrò hàn.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: Èyí jẹ́ àṣà ọ̀rọ̀ Bíbélì tó wọ́pọ̀ ní Yorùbá, ó sì lè túmọ̀ sí àwọn ọmọ orílẹ̀-èdè Ísírẹ́lì lápapọ̀.
- source_word: εἰς τὸ τέλος
  choice: òpin
  rationale: ‘Òpin’ bá ìtumọ̀ ìparí tàbí ohun tó dé òpin mu, ṣùgbọ́n τέλος tún lè jẹ́ ‘ète’ tàbí ‘àbájáde’; a pa àǹfààní yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: τοῦ καταργουμένου
  choice: ohun tí ń kọjá lọ
  rationale: Ó fi hàn pé ohun náà ń sọ agbára tàbí ìwàláàyè rẹ̀ nù, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí ó le jù kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ τέλος τοῦ καταργουμένου
  choice: òpin ohun tí ń kọjá lọ
  alternative: ète tàbí àbájáde ohun tí a ń mú wá sí òpin
  rationale: Àyíká ọ̀rọ̀ fi ohun tó jẹ́ ti ìgbà díẹ̀ wé ohun tó dúró; ìtumọ̀ yìí pa ìrònú ìparí mọ́, nígbà tí àlàyé ìsàlẹ̀ tún jẹ́ kí àìdánilójú tòótọ́ inú τέλος àti καταργουμένου wà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, ti òde òní, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘máa ń’ fún ìṣe àṣà, ‘tẹjú mọ́’ fún wíwo pẹ̀lú ìfọkànsìn, a sì pa àìdánilójú τέλος/καταργουμένου mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
