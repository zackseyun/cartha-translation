  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: yo
  text: Báwo ni iṣẹ́ ìránṣẹ́ Ẹ̀mí kì yóò ṣe wà nínú ògo púpọ̀ sí i?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ògo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς ... οὐχὶ
  choice: Báwo ni ... kò ṣe ní
  rationale: Ó pa ìrísí ìbéèrè àsọ̀rọ̀ tí ó ń retí ìdáhùn rere mọ́, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: μᾶλλον
  choice: púpọ̀ jù bẹ́ẹ̀ lọ
  rationale: Ó fi ìfiwé láti ohun tí ó kéré sí ohun tí ó pọ̀ hàn ní kedere, gẹ́gẹ́ bí àríyànjiyàn ẹsẹ tó ṣáájú.
- source_word: ἡ διακονία
  choice: iṣẹ́ ìránṣẹ́
  rationale: Nínú àyíká yìí, ó túmọ̀ sí iṣẹ́ tí a fi lé ẹnì kan lọ́wọ́, kì í ṣe iṣẹ́ ṣíṣe lásán; ó tún lè bá ìlò ọ̀rọ̀ náà ní ẹsẹ tó ṣáájú mu.
- source_word: τοῦ πνεύματος
  choice: ti Ẹ̀mí
  rationale: Àyíká 2 Kọrinti 3:6–8 tọ́ka sí Ẹ̀mí Mímọ́; lẹ́tà ńlá fi atọ́ka náà hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἔσται
  choice: ní wà
  rationale: Ó ṣàfihàn ọ̀rọ̀ ọjọ́ iwájú tí ọ̀rọ̀ Gíríìkì náà ní.
- source_word: ἐν δόξῃ
  choice: nínú ògo
  rationale: Ó pa àwòrán ọ̀rọ̀ àsọtẹ́lẹ̀ Gíríìkì àti ìsopọ̀ rẹ̀ pẹ̀lú ‘ògo’ nínú àwọn ẹsẹ tó yí i ká mọ́; ‘pẹ̀lú ògo’ tún ṣeé ṣe.
theological_decisions:
- issue: Ohun tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ní ìtumọ̀ àìdáni-mọ́ tàbí agbára ẹ̀mí
  rationale: Ìyàtọ̀ láàárín lẹ́tà tí ń pani àti Ẹ̀mí tí ń sọni di alààyè ní 2 Kọrinti 3:6 mú kí atọ́ka sí Ẹ̀mí Mímọ́ ṣeé gbà jù lọ.
- issue: Ìtumọ̀ ἐν δόξῃ
  choice: nínú ògo
  alternative: pẹ̀lú ògo; ológo púpọ̀ sí i
  rationale: ‘Nínú ògo’ pa ìrísí àti àfojúsùn ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ‘pẹ̀lú ògo’ lè jẹ́ ọ̀nà Yorùbá mìíràn tí ó bófin mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣeé lóye, ó sì pa ìbéèrè àsọ̀rọ̀ àti ìfiwé láti kékeré sí ńlá mọ́.
