id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: yo
  text: Àwa gbogbo sì, pẹ̀lú ojú tí a ti yọ ìbòjú kúrò lórí rẹ̀, bí a ti ń wo ògo Olúwa nínú dígí,[a] a ń yí wa padà sí àwòrán kan náà láti ògo sí ògo, gẹ́gẹ́ bí láti ọ̀dọ̀ Olúwa, Ẹ̀mí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí a ti ń dán ògo Olúwa padà bí dígí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “láti ọ̀dọ̀ Olúwa ẹni tí í ṣe Ẹ̀mí”; ìtumọ̀ mìíràn ni, “láti ọ̀dọ̀ Ẹ̀mí Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ πάντες
  choice: Àwa gbogbo sì
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ náà àti ìyípadà ọ̀rọ̀ tí δέ ń fi hàn mọ́ ní Yorùbá àdánidá.
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: pẹ̀lú ojú tí a kò fi ìbòjú bò
  rationale: Ó ṣàfihàn ipò ojú tí ìbòjú kò bò mọ́, èyí tí perfect participle náà tọ́ka sí.
- source_word: τὴν δόξαν κυρίου
  choice: ògo Olúwa
  rationale: Ó túmọ̀ genitive náà ní tààrà, ó sì lo ‘Olúwa’ fún κύριος.
- source_word: κατοπτριζόμενοι
  choice: bí a ti ń wo ... nínú dígí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí wíwo ohun nínú dígí tàbí dídán ohun náà padà bí dígí. Ọ̀rọ̀ àyíká ṣètìlẹ́yìn fún wíwo, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: àwòrán kan náà
  rationale: Ó pa ìsopọ̀ mọ́ láàárín ògo Olúwa àti àwòrán tí a ń yí àwọn onígbàgbọ́ padà sí.
- source_word: μεταμορφούμεθα
  choice: a ń yí wa padà
  rationale: Àmì ‘ń’ fi ìṣe tí ń bá a lọ hàn, ‘a ... wa’ sì pa passive náà mọ́ láìsọ ẹni tó ń ṣe ìyípadà náà ní kedere.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: láti inú ògo dé inú ògo
  rationale: Ó pa ọ̀rọ̀ Gíríìkì kúkúrú àti àìsọ ìpele ògo ní kedere mọ́, dípò fífi ‘láti ìpele kan sí òmíràn’ kún un.
- source_word: καθάπερ
  choice: gẹ́gẹ́ bí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìfiwéra náà hàn.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: láti ọ̀dọ̀ Olúwa, Ẹ̀mí náà
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ Gíríìkì tó kúkúrú àti apposition tó ṣeé ṣe mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lélẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ, tó sì ní iyì fún κύριος ní ibi méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ κατοπτριζόμενοι
  choice: bí a ti ń wo ògo Olúwa nínú dígí
  alternative: bí a ti ń dán ògo Olúwa padà bí dígí
  rationale: Ìṣàn ọ̀rọ̀ láti rí ògo sí yíyí padà ṣe àtìlẹ́yìn fún ‘wíwo’; síbẹ̀, ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ‘dán padà,’ nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ κυρίου àti πνεύματος nínú gbólóhùn ìparí
  choice: láti ọ̀dọ̀ Olúwa, Ẹ̀mí náà
  alternative: láti ọ̀dọ̀ Olúwa ẹni tí í ṣe Ẹ̀mí; tàbí láti ọ̀dọ̀ Ẹ̀mí Olúwa
  rationale: Gbólóhùn Gíríìkì náà kúkúrú, ó sì gba ọ̀nà ìtumọ̀ ju ẹyọ kan lọ. Ìtumọ̀ pàtàkì pa apposition tó ṣeé ṣe mọ́, àwọn ìtumọ̀ mìíràn sì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àṣàṣe, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa àìdánilójú gidi nínú ọ̀rọ̀ Gíríìkì mọ́ nípasẹ̀ àwọn àlàyé ìsàlẹ̀.
