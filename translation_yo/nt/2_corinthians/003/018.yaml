revisions:
- from: Àwa gbogbo sì, pẹ̀lú ojú tí a kò fi ìbòjú bò, bí a ti ń wo ògo Olúwa nínú dígí,[a] a ń yí wa padà sí àwòrán kan náà láti inú ògo dé inú ògo, gẹ́gẹ́ bí ó ti wá láti ọ̀dọ̀ Olúwa, Ẹ̀mí náà.[b]
  to: Àwa gbogbo sì, pẹ̀lú ojú tí a ti yọ ìbòjú kúrò lórí rẹ̀, bí a ti ń wo ògo Olúwa nínú dígí,[a] a ń yí wa padà sí àwòrán kan náà láti ògo sí ògo, gẹ́gẹ́ bí láti ọ̀dọ̀ Olúwa, Ẹ̀mí.[b]
  rationale: 'Àtúnṣe náà yí àwọn ibi kékeré mẹ́ta padà nìkan: ó sọ ojú tí ìbòjú ti yọ kúrò lórí rẹ̀ ní kedere; ó tún ἀπὸ...εἰς... ṣe sí ‘láti ògo sí ògo’ láìkún ‘inú’ sí i; ó sì yọ ‘nàá’ kúrò lẹ́yìn Ẹ̀mí kí ìfaramọ́ tó ṣeé ṣe láàárín ‘Olúwa’ àti ‘Ẹ̀mí’ má bàa di ìdánilójú ju ti Gíríìkì lọ. A pa yíyàn ‘wíwo nínú dígí’ àti àwọn ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀ mọ́.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní pàtàkì: ó pa ‘gbogbo wa,’ ojú tí kò ní ìbòjú, wíwo nínú dígí, ìyípadà tí ń lọ lọwọlọwọ, àwòrán kan náà, àti àìdánilójú nínú ἀπὸ κυρίου πνεύματος mọ́. Síbẹ̀, ‘láti inú ògo dé inú ògo’ ń fi ‘inú’ kún ìbátan ἀπό/εἰς tí kò sí nínú ìpilẹ̀ ọ̀rọ̀; a tún yẹ kí a ṣe ìtumọ̀ ojú tí a ṣí ìbòjú rẹ̀ kedere ju ‘ojú tí a kò fi ìbòjú bò’ lọ.'
  naturalness: Ọ̀pọ̀ ìtumọ̀ náà jẹ́ Yorùbá òde òní tí ó dára, pẹ̀lú àmi ohùn tó péye. ‘Ojú tí a ti yọ ìbòjú kúrò lórí rẹ̀’ sọ ipò tí perfect participle náà ń tọ́ka sí ní kedere, ó sì yẹra fún ìmọ̀ tí ó lè dà bí ẹni pé àwọn olùgbọ́ ni wọ́n pinnu pé wọn kò bo ojú wọn. ‘Láti ògo sí ògo’ jẹ́ ìsọ̀rọ̀ tí ó mú ìhùwàsí Gíríìkì náà wá ní ti ara.
  terminology: ‘Ògo,’ ‘Olúwa,’ ‘Ẹ̀mí,’ àti ‘àwòrán’ yẹ, wọ́n sì bá ọ̀rọ̀ ìsìn tó jẹ́ ìbílẹ̀ mu. ‘Olúwa, Ẹ̀mí’ pa ìfẹ̀sẹ̀mulẹ̀/apposition tó ṣeé ṣe nínú gbolóhùn Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan lórí rẹ̀. Àlàyé ìsàlẹ̀ méjèèjì pa àwọn àṣàyàn ìtumọ̀ tí ó ṣe pàtàkì mọ́.
  issues:
  - severity: medium
    issue: ‘láti inú ògo dé inú ògo’
    rationale: Ìlànà ‘inú’ ń mú ‘from/in glory’ wá, nígbà tí ἀπὸ δόξης εἰς δόξαν jẹ́ ‘láti ògo sí ògo.’ ‘Dé’ lè ṣiṣẹ́ nínú ìsọ̀rọ̀ kan, ṣùgbọ́n ‘sí’ ń ṣojú εἰς ní tààrà ju.
  - severity: low
    issue: ‘ojú tí a kò fi ìbòjú bò’
    rationale: Ó lè túmọ̀ sí ojú tí ‘àwa’ kò bo, dípò ipò ojú tí ìbòjú ti yọ kúrò lórí rẹ̀. Perfect participle náà ń tẹnumọ́ ojú tí a ti ṣí ìbòjú rẹ̀ tẹlẹ̀.
  - severity: low
    issue: ‘Ẹ̀mí náà’ nínú gbolóhùn pàtàkì
    rationale: ‘Nàá’ ń fún un ní ìtọ́ka pàtó (‘that/the Spirit’) tí kò hàn ní kedere nínú πνεύματος aláìní akọ́lé. ‘Ẹ̀mí’ nìkan, lẹ́yìn àmì ìdúró, pa apposition náà mọ́ dáadáa.
