id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: yo
  text: Òun náà sì mú wa yẹ gẹ́gẹ́ bí àwọn ìránṣẹ́[b] májẹ̀mú tuntun, kì í ṣe ti lẹ́tà[c] bí kò ṣe ti Ẹ̀mí[a]; nítorí lẹ́tà ń pa, ṣùgbọ́n Ẹ̀mí ń fúnni ní ìyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí” ní àwọn ibi méjèèjì.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn òjíṣẹ́” fún “àwọn ìránṣẹ́.”
    reason: lexical_alternative
  - marker: c
    text: “Lẹ́tà” tún lè túmọ̀ sí ohun tí a kọ sílẹ̀, tàbí òfin àkọsílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: mú wa yẹ
  rationale: Ó fi hàn pé Ọlọ́run ló fún wọn ní agbára àti yíyẹ fún iṣẹ́ náà, kì í ṣe pé wọ́n kàn péye fúnra wọn tàbí pé a fi oyè kan fún wọn.
- source_word: διακόνους
  choice: ìránṣẹ́
  rationale: Ó pa ìtumọ̀ iṣẹ́-ìsìn mọ́ láìfi èrò oyè ṣọ́ọ̀ṣì ti ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
- source_word: καινῆς διαθήκης
  choice: májẹ̀mú tuntun
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìbáṣepọ̀ májẹ̀mú tuntun tí Pọ́ọ̀lù ń tọ́ka sí, láìfipá yan láàárín àfihàn aláìlórúkọ àti èyí tí a mọ̀ pàtó bí Gíríìkì kò ṣe ní àpilẹ̀kọ níbí.
- source_word: γράμματος / γράμμα
  choice: lẹ́tà
  rationale: Ó pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù àti ìtakora rẹ̀ pẹ̀lú πνεῦμα mọ́; àlàyé pé ó tún lè túmọ̀ sí ohun tí a kọ sílẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: πνεύματος / πνεῦμα
  choice: Ẹ̀mí
  rationale: Nínú àyíká májẹ̀mú tuntun yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; àmì ohùn àti lẹ́tà ńlá Yorùbá fi ìdájọ́ yìí hàn, ṣùgbọ́n àṣàyàn ‘ẹ̀mí’ ni a pa mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἀποκτέννει
  choice: ń pa
  rationale: Ó jẹ́ ọ̀rọ̀ tààrà, tó lágbára, ó sì bá ìṣe ìsinsìnyí inú Gíríìkì mu.
- source_word: ζῳοποιεῖ
  choice: ń sọni di alààyè
  rationale: Ó jẹ́ Yorùbá àdánidá tó fi ìṣe fífi ìyè fúnni hàn kedere.
theological_decisions:
- issue: Bóyá πνεῦμα yẹ kí ó jẹ́ ‘Ẹ̀mí’ tàbí ‘ẹ̀mí’
  choice: Ẹ̀mí
  alternative: ẹ̀mí
  rationale: Ìtakora inú ọ̀rọ̀ Pọ́ọ̀lù nípa májẹ̀mú tuntun tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tó ń fúnni ní ìyè. Síbẹ̀, Gíríìkì ìpilẹ̀ṣẹ̀ kò fi ìyàtọ̀ lẹ́tà ńlá àti kékeré yìí hàn, nítorí náà a pa àṣàyàn kejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Bóyá ‘lẹ́tà’ túmọ̀ sí àmì lẹ́tà lásán tàbí òfin tí a kọ sílẹ̀
  choice: lẹ́tà
  alternative: ohun tí a kọ sílẹ̀ / òfin àkọsílẹ̀
  rationale: A kò fẹ́ dín àwòrán ọ̀rọ̀ Gíríìkì kù sí ìtumọ̀ kan ṣoṣo; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ tó gbòòrò sí i.
translation_notes:
  register: Yorùbá ìpele àárín, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìránṣẹ́’ dípò ọ̀rọ̀ oyè ṣọ́ọ̀ṣì, a sì pa gbolohun ìtakora Pọ́ọ̀lù mọ́ ní ṣókí. Gbogbo àmì àlàyé ìsàlẹ̀ tó wà ní àkọsílẹ̀ ni ó fara hàn nínú ọ̀rọ̀ pàtàkì.
