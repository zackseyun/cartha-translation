revisions:
- from: Òun sì tún mú wa yẹ láti jẹ́ ìránṣẹ́ májẹ̀mú tuntun, kì í ṣe ti lẹ́tà, bí kò ṣe ti Ẹ̀mí[a]; nítorí lẹ́tà[b] ń pa, ṣùgbọ́n Ẹ̀mí ń sọni di alààyè.
  to: Òun náà sì mú wa yẹ gẹ́gẹ́ bí àwọn ìránṣẹ́[b] májẹ̀mú tuntun, kì í ṣe ti lẹ́tà[c] bí kò ṣe ti Ẹ̀mí[a]; nítorí lẹ́tà ń pa, ṣùgbọ́n Ẹ̀mí ń fúnni ní ìyè.
  rationale: 'Àtúnṣe náà ń pa ìtumọ̀ Gíríìkì mọ́: Ọlọ́run ni kókó-ọrọ̀ ìbátan náà; ó mú ‘wa’ yẹ gẹ́gẹ́ bí àwọn ìránṣẹ́ májẹ̀mú tuntun; ìránṣẹ́ wọn kì í ṣe ti lẹ́tà, bí kò ṣe ti Ẹ̀mí. Ó tún mú àwọn àlàyé lexical Gẹ̀ẹ́sì wá sí Yorùbá pẹ̀lú àwọn àmì tó bá wọn mu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:47Z'
