    rationale: ‘Àwọn ìránṣẹ́’ ń ṣàfihàn plural Gíríìkì; ‘Òun náà sì’ jẹ́ ìtúmọ̀ Yorùbá tó ṣe kedere fún ὃς καὶ.
  - severity: low
    issue: Àlàyé lexical fún διακόνους (‘ministers’) tí audit trail Gẹ̀ẹ́sì ní kò sí nínú àwọn àlàyé ìsàlẹ̀ Yorùbá.
    rationale: Fífi i kún un ń jẹ́ kí àwọn ìpinnu lexical àti àwọn àmì àlàyé ìsàlẹ̀ péye.
  - severity: low
    issue: ‘Ń sọni di alààyè’ lóye, ṣùgbọ́n ó kéré sí ìbámu pẹ̀lú ọ̀rọ̀ ìgbàlódé ju ‘ń fúnni ní ìyè’ lọ.
    rationale: ‘Ń fúnni ní ìyè’ ń fi ìṣe ζῳοποιεῖ hàn ní tààrà, láìsọ ìtumọ̀ rẹ̀ di dídí.
