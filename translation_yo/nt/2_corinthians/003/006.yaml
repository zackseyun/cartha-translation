  verdict: revise
  source_fidelity: Ìtumọ̀ ìpilẹ̀ṣẹ̀ pa ìtakora γράμμα/πνεῦμα mọ́, ṣùgbọ́n a tún un ṣe díẹ̀ kí ọ̀pọ̀ διακόνους hàn kedere, kí ‘tún’ túmọ̀ καί dáadáa, àti kí ζῳοποιεῖ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì tààrà.
  naturalness: ‘Òun náà sì mú wa yẹ gẹ́gẹ́ bí àwọn ìránṣẹ́’ àti ‘ń fúnni ní ìyè’ jẹ́ àdánidá, ó sì bá ìpele ọ̀rọ̀ ìjọsìn Yorùbá òde òní mu ju ‘ń sọni di alààyè’ lọ.
  terminology: A pa ‘májẹ̀mú tuntun,’ ‘ìránṣẹ́,’ ‘lẹ́tà,’ àti ‘Ẹ̀mí’ mọ́. Àlàyé ìsàlẹ̀ nípa ‘ẹ̀mí’ ń dá àìdánilójú ìlò lẹ́tà ńlá/kékeré Gíríìkì sílẹ̀. A tún fi àlàyé ìsàlẹ̀ sí ‘ìránṣẹ́’ fún ipa-ọ̀nà lexical ‘ministers’ tí ó wà nínú àkọsílẹ̀ Gẹ̀ẹ́sì.
  issues:
