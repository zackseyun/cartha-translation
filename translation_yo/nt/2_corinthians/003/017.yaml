id: 2CO.3.17
reference: 2 Corinthians 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: yo
  text: Olúwa sì ni Ẹ̀mí náà[a]; ibi tí Ẹ̀mí Olúwa bá sì wà, òmìnira wà níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, a lè lóye “Olúwa sì ni Ẹ̀mí náà” gẹ́gẹ́ bí ìdánimọ̀ tí a gbọ́dọ̀ lóye ní ìbámu pẹ̀lú àyíká ọ̀rọ̀, láìpinnu ní pàtó bí a ṣe yẹ kí a ṣàlàyé ìbáṣepọ̀ náà nípa ẹ̀kọ́-ìgbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bá ìlò Páùlù àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ inú àyíká ọ̀rọ̀ mu jù lọ.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àmi ohùn àti lẹ́tà ńlá fi hàn pé Ẹ̀mí Mímọ́ ni ọ̀rọ̀ náà ń tọ́ka sí ní ibi méjèèjì.
- source_word: δὲ
  choice: sì
  rationale: “Sì” ń gbé ìlọsíwájú tàbí ìsopọ̀ èrò méjèèjì jáde lọ́nà àdánidá, láìsọ ìyàtọ̀ náà di mímúná jù.
- source_word: οὗ
  choice: ibi tí ... bá ... wà
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ ibi tó jẹ́ òfin gbogbogbò.
- source_word: ἐλευθερία
  choice: òmìnira
  rationale: “Òmìnira” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tó sì pa ìwọ̀n ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ rẹ̀ mọ́.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Olúwa sì ni Ẹ̀mí náà
  rationale: A pa gbólóhùn ìdánimọ̀ tó ṣe tààrà mọ́, a sì lo “ni” gẹ́gẹ́ bí ìsopọ̀ ìdánimọ̀ Yorùbá. “Náà” ń jẹ́ kí Ẹ̀mí tí àyíká ọ̀rọ̀ ti ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere.
- source_word: τὸ πνεῦμα κυρίου
  choice: Ẹ̀mí Olúwa
  rationale: Ìkọ̀lé oní-olùní Yorùbá yìí pa ìbáṣepọ̀ tí ọ̀rọ̀ Gíríìkì fi hàn mọ́ lọ́nà ṣókí àti àdánidá.
theological_decisions:
- issue: Gbólóhùn “Olúwa ni Ẹ̀mí náà” jẹ́ ọ̀rọ̀ ìdánimọ̀ tí àwọn ènìyàn ń túmọ̀ ní onírúurú ọ̀nà nípa ẹ̀kọ́-ìgbàgbọ́.
  choice: 'A túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí gbólóhùn ìdánimọ̀: “Olúwa sì ni Ẹ̀mí náà.”'
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìdánimọ̀ tímọ́tímọ́ nínú àyíká ọ̀rọ̀ tàbí nínú iṣẹ́ májẹ̀mú, láìsọ pé ó ń ṣàlàyé gbogbo bí ìbáṣepọ̀ náà ṣe rí; àwọn kan sì ka “Olúwa” sí Kristi ní pàtó, àwọn mìíràn sì fún un ní ìtọ́kasí Ọlọ́run tó gbòòrò.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìdánimọ̀ náà ní tààrà. Nítorí náà, ìtumọ̀ náà kò rọ ọ́, bẹ́ẹ̀ ni kò fi èrò ẹ̀kọ́-ìgbàgbọ́ kan ṣoṣo pinnu irú ìbáṣepọ̀ tí gbólóhùn náà ń sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A kò fi ọ̀rọ̀ tó túmọ̀ sí “nísinsìnyí” sí ìbẹ̀rẹ̀, nítorí δέ jẹ́ àmì ìsopọ̀ ọ̀rọ̀, kì í ṣe ọ̀rọ̀ àkókò.
