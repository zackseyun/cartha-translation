source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: yo
  text: Ṣùgbọ́n nígbàkigbà tí ẹnì kan bá yí padà sí Olúwa[a], a máa yọ ìbòjú náà kúrò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ẹnì kan bá yí padà sí Olúwa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a máa gbé ìbòjú náà kúrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Ṣùgbọ́n nígbàkigbà tí ... bá
  rationale: “Ṣùgbọ́n” pa ìsopọ̀ δέ mọ́; “nígbàkigbà” àti àmì ọ̀rọ̀-ìṣe “bá” fi ìtumọ̀ àkókò àìdánilójú tàbí ohun tó lè ṣẹlẹ̀ léraléra hàn.
- source_word: ἐπιστρέψῃ
  choice: yí padà
  rationale: Ó pa àwòrán yíyípadà sí ẹnì kan mọ́, láì fi kún un pé ó túmọ̀ sí ìrònúpìwàdà tàbí ìyípadà ẹ̀sìn ní pàtó.
- source_word: πρὸς κύριον
  choice: sí Olúwa
  rationale: “Sí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtọ́sọ́nà sí ẹni kan hàn; “Olúwa” pa oyè κύριος mọ́ láì dá ẹni tí oyè náà ń tọ́ka sí ní ẹsẹ yìí lójú.
- source_word: περιαιρεῖται
  choice: a máa mú ... kúrò
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a yọ ohun kan kúrò, nígbà tí “a” kò sọ ẹni tó ṣe iṣẹ́ náà ní pàtó; “máa” bá ìtumọ̀ ohun tó ṣẹlẹ̀ nígbàkigbà mu.
- source_word: τὸ κάλυμμα
  choice: ìbòjú náà
  rationale: “Ìbòjú” bá àwòrán aṣọ tí Mósè fi bo ojú rẹ̀ mu, ó sì ṣe pàtó ju ọ̀rọ̀ gbogbogbò bí “ohun ìbòrí” lọ.
theological_decisions:
- issue: Kókó ọ̀rọ̀-ìṣe ἐπιστρέψῃ kò fara hàn ní Gíríìkì
  choice: Fi “ẹnì kan” sí i gẹ́gẹ́ bí kókó àìsọ̀rọ̀-ẹni-pàtó
  alternative: Lo “ẹni náà” tàbí fi arọ́pò-orúkọ “ó” sí i
  rationale: Yorùbá nílò kókó tó ṣe kedere níhìn-ín. “Ẹnì kan” pa agbára gbogbogbò tí ọ̀rọ̀ Gíríìkì ní mọ́, láì dí ìtumọ̀ náà mọ́ ẹni kan, ọkàn, tàbí gbogbo Ísírẹ́lì.
- issue: Ta ni “Olúwa” ń tọ́ka sí nínú ọ̀rọ̀ yìí?
  choice: Túmọ̀ rẹ̀ ní ṣókí sí “Olúwa”
  alternative: “Olúwa Kristi” tàbí “Olúwa, ìyẹn Ẹ̀mí”
  rationale: Ẹsẹ yìí sọ κύριον nìkan. Kí a má bàa yanjú ìṣòro ìtumọ̀ tí àyíká ọ̀rọ̀ fi sílẹ̀, a kò fi “Kristi” tàbí “Ẹ̀mí” kún un.
- issue: Ẹni tó mú ìbòjú náà kúrò kò fara hàn
  choice: Lo “a” aláìsọ ẹni pàtó nínú “a máa mú ... kúrò”
  alternative: “Ọlọ́run a máa mú ìbòjú náà kúrò”
  rationale: Èdè Gíríìkì lo ọ̀rọ̀-ìṣe aláìṣe, kò sì dárúkọ olùṣe. “A” jẹ́ ọ̀nà Yorùbá àdánidá láti má ṣe fi olùṣe tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. “Yí padà sí” àti “mú ... kúrò” jẹ́ àkójọpọ̀ ọ̀rọ̀ àdánidá, tí ó sì pa àwòrán àti àìsọ olùṣe inú Gíríìkì mọ́ bí ó ti ṣeé ṣe.
