revisions:
- from: Àti pé a rán arákùnrin náà pẹ̀lú rẹ̀, ẹni tí gbogbo àwọn ìjọ ń yìn nítorí iṣẹ́ rẹ̀ nínú ìhìn rere—[a]
  to: A sì rán arákùnrin náà pẹ̀lú rẹ̀, ẹni tí ìyìn rẹ̀ ní ti ìhìn rere tàn ká gbogbo àwọn ìjọ—[a]
  rationale: Àtúnṣe náà mú ìtumọ̀ náà padà sí ìtumọ̀ Gíríìkì nípa yíyọ “iṣẹ́ rẹ̀” tí a ṣàfikún kúrò. Ó tún fi ìtan-kálẹ̀ ìyìn náà láàrín gbogbo àwọn ìjọ hàn, nígbà tí ó ń pa ìtumọ̀ gangan ἐν τῷ εὐαγγελίῳ mọ́ ní ṣíṣí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:20Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ àkọ́kọ́ fi kún ẹsẹ̀ náà nípa sísọ pé àwọn ìjọ ń yìn arákùnrin náà “nítorí iṣẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì kò mẹ́nuba iṣẹ́ rẹ̀; ó kan so ìyìn rẹ̀ mọ́ ìhìn rere ní ọ̀nà tí ó ṣí sí ìtumọ̀. Àtúnṣe náà yọ àfikún yìí kúrò, ó sì mú ‘throughout all the churches’ hàn ní kíkún.
  naturalness: ‘A sì rán … pẹ̀lú rẹ̀’ jẹ́ Yorùbá boṣewa, ó sì bá àsopọ̀ ìtàn δέ mu dáadáa. ‘Ìyìn rẹ̀ ní ti ìhìn rere tàn ká gbogbo àwọn ìjọ’ jẹ́ ìsọ̀rọ̀ àdánidá tí ó pa ìbáṣepọ̀ tí kò ṣe kedere pátápátá láàárín ìyìn àti ìhìn rere mọ́.
  terminology: ‘Arákùnrin náà,’ ‘ìhìn rere,’ àti ‘àwọn ìjọ’ yẹ fún ἀδελφός, εὐαγγέλιον, àti ἐκκλησίαι. A kò dárúkọ arákùnrin náà tàbí sọ ipò iṣẹ́ ìránṣẹ́ kan fún un.
  issues:
  - severity: medium
    issue: “nítorí iṣẹ́ rẹ̀ nínú ìhìn rere” fi ‘iṣẹ́ rẹ̀’ kún ẹsẹ̀ náà.
    rationale: ἐν τῷ εὐαγγελίῳ lè tọ́ka sí àgbègbè/ìbáṣepọ̀ ìyìn náà pẹ̀lú ìhìn rere, ṣùgbọ́n kò sọ pé ìyìn náà jẹ́ nítorí iṣẹ́ ọkùnrin náà. Àfikún náà dín àìdánilójú Gíríìkì kù, ó sì ṣàfikún ohun tí kò wà nínú ọ̀rọ̀.
  - severity: low
    issue: ‘gbogbo àwọn ìjọ ń yìn’ kò fi ìtan-kálẹ̀ διά pẹ̀lú genitive hàn ní kíkún.
    rationale: Ó lè jẹ́ ìtumọ̀ tó ṣeé gbà, ṣùgbọ́n ‘tàn ká gbogbo àwọn ìjọ’ fi ìtumọ̀ pé ìyìn náà gbajúmọ̀ káàkiri gbogbo ìjọ hàn dáadáa.
