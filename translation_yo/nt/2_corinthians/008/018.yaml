id: 2CO.8.18
reference: 2 Corinthians 8:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: yo
  text: A sì rán arákùnrin náà pẹ̀lú rẹ̀, ẹni tí ìyìn rẹ̀ ní ti ìhìn rere tàn ká gbogbo àwọn ìjọ—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí gbogbo àwọn ìjọ ń gbóríyìn fún ní ti ìhìn rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: a rán ... pẹ̀lú
  rationale: Ọ̀rọ̀-ìṣe aorist náà sọ nípa ohun tí wọ́n ṣe, ìṣàfikún σύν sì fi hàn pé ẹni náà bá ẹlòmíràn lọ; ‘a rán ... pẹ̀lú’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: δὲ
  choice: Àti pé
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú, kì í ṣe àtakò líle.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: μετά pẹ̀lú genitive túmọ̀ sí ìbákẹ́gbẹ́; ‘pẹ̀lú rẹ̀’ mú ìtumọ̀ náà jáde ní tààrà.
- source_word: τὸν ἀδελφόν
  choice: arákùnrin náà
  rationale: Article àti ọ̀rọ̀ akọ ẹyọ kan tọ́ka sí arákùnrin onígbàgbọ́ kan pàtó tí àwọn olùgbọ́ mọ̀.
- source_word: οὗ ὁ ἔπαινος
  choice: ẹni tí ... ń yìn
  rationale: Èyí sọ gbolohun orúkọ Gíríìkì náà di Yorùbá àdánidá láì yí ìtumọ̀ ìyìn tàbí ìmọrírì rẹ̀ padà.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: nínú ìhìn rere
  rationale: A pa ọ̀rọ̀ tó ṣí sí ìtumọ̀ mélòó kan mọ́, láì sọ ọ́ di ‘wíwàásù’ tàbí ipò iṣẹ́ ìránṣẹ́ kan pàtó.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: gbogbo àwọn ìjọ
  rationale: Nínú àkọsílẹ̀ yìí, διά pẹ̀lú genitive fi hàn pé ìyìn náà tàn dé gbogbo àwùjọ àwọn ìjọ; ìṣètò Yorùbá yìí jẹ́ àdánidá.
- source_word: ἐκκλησιῶν
  choice: àwọn ìjọ
  rationale: Nínú lílo Paulu, ἐκκλησία sábà ń tọ́ka sí àwọn àwùjọ Kristẹni ní ibi kọ̀ọ̀kan; ‘àwọn ìjọ’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
theological_decisions:
- issue: Ta ni ἀδελφός, kí sì ni ipò rẹ̀?
  choice: ‘arákùnrin náà,’ ìyẹn ọkùnrin onígbàgbọ́ kan pàtó tó jẹ́ alábàáṣiṣẹ́
  alternative: ‘onígbàgbọ́ ẹlẹgbẹ́ wa’ láì fi akọ rẹ̀ hàn
  rationale: Ọ̀rọ̀ akọ ẹyọ kan pẹ̀lú article, nínú ọ̀rọ̀ nípa ìrìn-àjò yìí, tọ́ka sí ọkùnrin kan pàtó; a kò fi ‘wa’ kún un nítorí kò sí nínú Gíríìkì.
- issue: Ìtumọ̀ ἐν τῷ εὐαγγελίῳ
  choice: ‘nínú ìhìn rere,’ pẹ̀lú àlàyé ẹsẹ̀ pé ó lè túmọ̀ sí ìyìn tó ní í ṣe pẹ̀lú ìhìn rere
  alternative: ‘nínú wíwàásù ìhìn rere’ tàbí ‘nítorí iṣẹ́ ìhìn rere rẹ̀’
  rationale: Gíríìkì kò sọ wíwàásù tàbí ipò iṣẹ́ kan ní pàtó. Fífi ọ̀rọ̀ náà sílẹ̀ ní gbígbòòrò yàgò fún fífi ẹ̀kọ́ tàbí iṣẹ́ tí kò sí nínú ẹsẹ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo ‘arákùnrin’ fún ọkùnrin onígbàgbọ́ kan pàtó, ‘ìjọ’ fún ἐκκλησία, àti ‘ìhìn rere’ fún εὐαγγέλιον. Àlàyé ẹsẹ̀ pa àìdánilójú ìbáṣepọ̀ ἔπαινος àti εὐαγγέλιον mọ́.
