id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: yo
  text: Kì í ṣe bí a ti retí[a], ṣùgbọ́n wọ́n kọ́kọ́ fi ara wọn fún Olúwa, wọ́n sì fi ara wọn fún wa náà nípasẹ̀ ìfẹ́-inú Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí a ti ní ìrètí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ìfẹ́-inú Ọlọ́run” tàbí “ní ìbámu pẹ̀lú ìfẹ́-inú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: bí a ti retí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘bí a ti ní ìrètí,’ ṣùgbọ́n nínú àyíká yìí ‘bí a ti retí’ fi ìyàtọ̀ láàárín ohun tí àwọn aposteli rò pé yóò ṣẹlẹ̀ àti ohun tí àwọn ará Makedóníà ṣe hàn lọ́nà àdánidá.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: wọ́n fi ara wọn fún
  rationale: Èyí pa ìtumọ̀ ìfi-ara-ẹni-rúbọ mọ́, kò sì sọ ọ́ di ọ̀rọ̀ fífúnni ní owó nìkan.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: ‘Kọ́kọ́’ pa ìtẹnumọ́ ipò àkọ́kọ́ mọ́ láì pinnu bóyá ó jẹ́ ti àkókò nìkan tàbí ti pàtàkì pẹ̀lú.
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níbí, dátífù náà sì ń tọ́ka sí ẹni tí wọ́n fi ara wọn fún.
- source_word: καὶ ἡμῖν
  choice: wọ́n sì fi ara wọn fún àwa pẹ̀lú
  rationale: Àtúnsọ̀ ọ̀rọ̀-ìṣe náà mú èdè Yorùbá ṣe kedere, ó sì pa ìbáṣepọ̀ dátífù kejì mọ́ láì fi àwọn aposteli dọ́gba pẹ̀lú Olúwa.
- source_word: διὰ θελήματος θεοῦ
  choice: nípasẹ̀ ìfẹ́ Ọlọ́run
  rationale: ‘Nípasẹ̀’ pa agbára διά mọ́, ó sì jẹ́ kí gbolohun náà ṣì lè tọ́ka sí ohun èlò, ìdarí, tàbí ìbámu pẹ̀lú ìfẹ́ Ọlọ́run.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín fífi ara wọn fún Olúwa àti fífi ara wọn fún àwọn aposteli
  choice: A fi Olúwa sí ipò àkọ́kọ́ nípasẹ̀ ‘kọ́kọ́,’ a sì sọ fífi ara wọn fún àwọn aposteli gẹ́gẹ́ bí ohun tó tẹ̀ lé e.
  alternative: A lè ka àwọn méjèèjì sí ìyàsímímọ́ onípele méjì láì fi ipò ọ̀kan ga ju èkejì lọ, yàtọ̀ sí ọ̀rọ̀ ‘kọ́kọ́.’
  rationale: Ìtẹ̀lé πρῶτον, τῷ κυρίῳ, καὶ ἡμῖν fi ipò Olúwa ṣáájú, ṣùgbọ́n a kò fẹ̀ ọ́ sí i láti dá ẹ̀kọ́ nípa àṣẹ ìjọ kalẹ̀.
- issue: Agbára διὰ θελήματος θεοῦ
  choice: nípasẹ̀ ìfẹ́ Ọlọ́run
  alternative: nípa ìfẹ́ Ọlọ́run; ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run
  rationale: Gíríìkì lè ní ìtumọ̀ ìṣe Ọlọ́run, ìfúnni ní àṣẹ, tàbí ìbámu pẹ̀lú ìfẹ́ rẹ̀; ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú tó wà nínú rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A tún ‘fi ara wọn fún’ sọ ní apá kejì kí gbolohun náà lè ṣe kedere ní Yorùbá, láì yí ìtumọ̀ orísun padà. Gbogbo àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá.
