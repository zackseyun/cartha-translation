revisions:
- from: Kì í sì í ṣe bí a ti retí[a], ṣùgbọ́n wọ́n kọ́kọ́ fi ara wọn fún Olúwa, wọ́n sì fi ara wọn fún àwa pẹ̀lú nípasẹ̀ ìfẹ́ Ọlọ́run[b].
  to: Kì í ṣe bí a ti retí[a], ṣùgbọ́n wọ́n kọ́kọ́ fi ara wọn fún Olúwa, wọ́n sì fi ara wọn fún wa náà nípasẹ̀ ìfẹ́-inú Ọlọ́run[b].
  rationale: The revision corrects the Yoruba object pronoun, replaces an expression that can mean God's love with the standard expression for God's will, and smooths the opening. It preserves the source's ellipsis, the priority marked by πρῶτον, the two coordinated recipients of their self-giving, and the interpretive breadth of διὰ θελήματος θεοῦ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'The central sense is retained: the Macedonians'' self-giving is first to the Lord and then to Paul and his associates. However, the object pronoun in the second clause must be corrected, and the expression for God''s will should not be left as the potentially ambiguous “ìfẹ́ Ọlọ́run,” which can readily denote God''s love rather than his will.'
  naturalness: The sentence is generally clear and suitably formal, but “Kì í sì í ṣe” is awkwardly formed in this context, and “fún àwa” is ungrammatical after the preposition fún. “Fún wa náà” is natural Standard Yoruba.
  terminology: Use “ìfẹ́-inú Ọlọ́run” for θελήματος θεοῦ. This idiom naturally communicates God's will/purpose, whereas “ìfẹ́ Ọlọ́run” may communicate God's love. “Olúwa” appropriately represents κύριος.
  issues:
  - severity: medium
    issue: The draft reads “wọ́n sì fi ara wọn fún àwa pẹ̀lú.”
    rationale: After fún, Standard Yoruba requires the object pronoun wa, not the subject pronoun àwa. The phrase should be “fún wa náà” (or “fún wa pẹ̀lú”).
  - severity: medium
    issue: “Ìfẹ́ Ọlọ́run” is used for θελήματος θεοῦ.
    rationale: In Yoruba, ìfẹ́ commonly means love and may obscure the source's sense of God's will. “Ìfẹ́-inú Ọlọ́run” clearly conveys will/purpose while preserving the broad force of διά.
  - severity: low
    issue: “Kì í sì í ṣe” is unnecessarily awkward.
    rationale: “Kì í ṣe” is the natural negative copular form here; retaining the extra repeated í makes the opening less idiomatic without representing a Greek distinction.
  revised_text: Kì í ṣe bí a ti retí[a], ṣùgbọ́n wọ́n kọ́kọ́ fi ara wọn fún Olúwa, wọ́n sì fi ara wọn fún wa náà nípasẹ̀ ìfẹ́-inú Ọlọ́run[b].
  revised_footnotes:
  - marker: a
    text: Tàbí, “bí a ti ní ìrètí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ìfẹ́-inú Ọlọ́run” tàbí “ní ìbámu pẹ̀lú ìfẹ́-inú Ọlọ́run.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Yoruba object pronoun, replaces an expression that can mean God's love with the standard expression for God's will, and smooths the opening. It preserves the source's ellipsis, the priority marked by πρῶτον, the two coordinated recipients of their self-giving, and the interpretive breadth of διὰ θελήματος θεοῦ.
