source:
  edition: SBLGNT
  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: yo
  text: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run, ẹni tí ó fi ìtara kan náà fún yín sínú ọkàn Títù,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó fún Títù ní ìtara kan náà fún yín nínú ọkàn rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run
  rationale: Nínú ọ̀rọ̀ ìdúpẹ́ ti Pọ́ọ̀lù, χάρις pẹ̀lú τῷ θεῷ túmọ̀ sí fífi ọpẹ́ fún Ọlọ́run, kì í ṣe ‘oore-ọ̀fẹ́.’ δέ sì jẹ́ ìyípadà kékeré tí ‘Ṣùgbọ́n’ fi hàn ní ti ẹ̀dá.
- source_word: τῷ διδόντι
  choice: ẹni tí ó fi ... sí
  rationale: Dídá δίδωμι pọ̀ mọ́ àwòrán ọkàn jẹ́ ti ẹ̀dá ní Yorùbá gẹ́gẹ́ bí ‘fi ... sí ọkàn,’ ó sì pa ìtumọ̀ pé Ọlọ́run ni ó ń mú ìtara náà wà mọ́.
- source_word: τὴν αὐτὴν σπουδήν
  choice: ìtara kan náà
  rationale: σπουδή níbí ń tọ́ka sí ìtara àti àníyàn olóòótọ́, kì í ṣe kìkì iṣẹ́ takuntakun; αὐτήν ni ‘kan náà’ dúró fún.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Ọ̀rọ̀ yìí sọ ìtara tí ó dojú kọ àwọn ará Kọ́ríńtì; ‘nítorí yín’ jẹ́ kedere, ó sì bá Yorùbá mu.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: sí ọkàn Títù
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní pàtàkì sí ‘nínú,’ pẹ̀lú δίδωμι, ‘fi ... sí ọkàn Títù’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa àwòrán inú ọkàn mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àtẹ̀jáde tó níyì, tó ṣe déédéé fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. ‘Ìtara’ sọ ìfọkànsìn àti àníyàn tọkàntọkàn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gígùn ti δίδωμι àti ἐν hàn.
