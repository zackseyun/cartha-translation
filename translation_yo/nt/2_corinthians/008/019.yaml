  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: yo
  text: Kì í ṣe ìyẹn nìkan, ṣùgbọ́n àwọn ìjọ tún ti yàn án[a] gẹ́gẹ́ bí alábàákẹ́gbẹ́ ìrìn-àjò wa pẹ̀lú ẹ̀bùn oore-ọ̀fẹ́ yìí[b] tí àwa ń bójú tó nínú iṣẹ́ ìránṣẹ́, fún ògo Olúwa fúnra rẹ̀[c] àti ìtara wa—[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìjọ ti yàn án.” Ọ̀rọ̀ náà lè túmọ̀ sí yíyan tàbí fífi ẹni sípò, láìjẹ́ pé ó gbọ́dọ̀ tọ́ka sí ìdìbò òde òní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú oore-ọ̀fẹ́ yìí.” Nínú àyíká yìí, “ẹ̀bùn oore-ọ̀fẹ́” ń tọ́ka sí ọrẹ tí wọ́n ń kó jọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “fún ògo Olúwa rẹ̀”; a tún lè lóye rẹ̀ sí “fún ògo Olúwa.”
    reason: alternative_reading
  - marker: d
    text: A tún lè so gbólóhùn náà pé, “gẹ́gẹ́ bí alábàá-rìn wa pẹ̀lú ẹ̀bùn oore-ọ̀fẹ́ yìí.”
    reason: previous_rendering
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: ti yàn án
  rationale: Ó sọ pé àwọn ìjọ ni ó yan ẹni náà sí iṣẹ́ yìí, láìfi ọ̀nà ìdìbò kan pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐκκλησιῶν
  choice: àwọn ìjọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìlò Páùlù fún àwọn àwùjọ onígbàgbọ́ mu.
- source_word: συνέκδημος
  choice: láti bá wa rin ìrìn-àjò
  rationale: Ó mú èrò ẹlẹgbẹ́ tí ń bá àwọn ẹlòmíràn rìnrìn-àjò jáde ní Yorùbá àdánidá.
- source_word: χάριτι
  choice: ẹ̀bùn oore-ọ̀fẹ́
  rationale: Nínú àyíká ọrẹ àkójọpọ̀ yìí, χάρις ń tọ́ka sí ẹ̀bùn gidi tí oore-ọ̀fẹ́ mú wá, kì í ṣe oore-ọ̀fẹ́ aláìlérò nìkan.
- source_word: διακονουμένῃ
  choice: tí àwa ń ṣe iṣẹ́ ìránṣẹ́ rẹ̀
  rationale: Ó pa èrò iṣẹ́ ìránṣẹ́ àti ṣíṣe àbójútó ẹ̀bùn náà mọ́, láìdín ọ̀rọ̀ náà kù sí pínpín nìkan.
- source_word: πρὸς
  choice: fún
  rationale: Níhìn-ín ó ń fi ète tàbí àfojúsùn iṣẹ́ náà hàn.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Olúwa fúnra rẹ̀
  rationale: A gba αὐτοῦ gẹ́gẹ́ bí ohun ìtẹnumọ́ pẹ̀lú τοῦ κυρίου, ṣùgbọ́n a fi àṣàyàn míì sínú àlàyé ìsàlẹ̀.
- source_word: δόξαν
  choice: ògo
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ, tó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- source_word: προθυμίαν
  choice: ìtara
  rationale: Ó sọ ìfẹ́ inú, ìmúrasílẹ̀, àti ìyára láti ṣe ohun kan, láìfi ohun tí a ń hára sí kún ọ̀rọ̀ orísun.
theological_decisions:
- issue: Ìtumọ̀ αὐτοῦ nínú πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: “fún ògo Olúwa fúnra rẹ̀,” níbi tí αὐτοῦ ti ń tẹnumọ́ “Olúwa.”
  alternative: “fún ògo Olúwa rẹ̀” tàbí “fún ògo Olúwa.”
  rationale: Gbólóhùn Gíríìkì náà kéré pọ̀, ó sì lè gba ìtumọ̀ ju ọ̀kan lọ. Ìtumọ̀ ìtẹnumọ́ dára ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Kì í ṣe ìyẹn nìkan” àti “ṣùgbọ́n” pa ìsopọ̀ ọ̀rọ̀ mọ́; àmì ìdádúró gígùn ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
