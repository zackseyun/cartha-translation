id: 2CO.8.2
reference: 2 Corinthians 8:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: yo
  text: pé, láàrín ìdánwò líle ti ìpọ́njú, ọ̀pọ̀ ayọ̀ wọn àti òṣì wọn tó jinlẹ̀ gan-an mú kí ìfúnni ọ̀làwọ́ wọn pọ̀ gidigidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ìfúnni ọ̀làwọ́” tún lè túmọ̀ sí “ìrọ̀rùn,” “ọkàn kan,” tàbí “ìwà àìlábùkù”; ṣùgbọ́n nínú àyíká fífúnni yìí, ó ṣeéṣe jù lọ pé ó ń tọ́ka sí ọ̀làwọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: nínú ìdánwò ńlá ti ìpọ́njú
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ δοκιμή àti θλίψεως mọ́, ó sì fi bí ìdánwò náà ṣe le tó hàn ní Yorùbá àdánidá.
- source_word: περισσεία τῆς χαρᾶς
  choice: ọ̀pọ̀lọpọ̀ ayọ̀ wọn
  rationale: Ìtumọ̀ yìí pa àkúnya tí περισσεία ní mọ́, ó sì jẹ́ èdè tí òǹkàwé òde òní lè lóye.
- source_word: κατὰ βάθους πτωχεία
  choice: òṣì jíjinlẹ̀ wọn
  rationale: Ó pa àwòrán ìjìnlẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí ó ń tọ́ka sí òṣì tó le gan-an.
- source_word: ἐπερίσσευσεν
  choice: kún àkúnwọ́sílẹ̀
  rationale: Àṣàyàn yìí fi ìṣàn àkúnya tó ń yọrí sí àbájáde hàn, gẹ́gẹ́ bí εἰς ṣe tọ́ka sí.
- source_word: εἰς τὸ πλοῦτος
  choice: sí ọrọ̀
  rationale: “Sí” pa agbára ìtọ́sọ́nà tàbí àbájáde εἰς mọ́; “ọrọ̀” sì bá àfiwé ọrọ̀ àti òṣì mu.
- source_word: ἁπλότης
  choice: inú-ọ̀rẹ́
  rationale: Nínú àyíká ọ̀rọ̀ fífúnni, ἁπλότης tọ́ka sí fífúnni pẹ̀lú ọkàn tí kò pín àti ọ̀làwọ́; “inú-ọ̀rẹ́” sọ èyí ní kedere láìsọ àlàyé ju ọ̀rọ̀ náà lọ.
theological_decisions:
- issue: Ìtumọ̀ ἁπλότης nínú àyíká fífúnni ní ohun ìní
  choice: inú-ọ̀rẹ́
  alternative: ìrọ̀rùn ọkàn tàbí ọkàn kan ṣoṣo
  rationale: Àyíká ẹsẹ̀ náà jẹ́ ti ìrànlọ́wọ́ owó fún àwọn ẹni mímọ́, nítorí náà fífúnni pẹ̀lú ọ̀làwọ́ ni ó ṣeéṣe jù; àkọsílẹ̀ ìsàlẹ̀ ṣì pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “òṣì jíjinlẹ̀” láti pa àwòrán orísun mọ́, àti “kún àkúnwọ́sílẹ̀” láti tún ìbáṣepọ̀ περισσεία/ἐπερίσσευσεν ṣe ní ọ̀nà àdánidá. Àmì [a] wà lẹ́yìn gbólóhùn tí ó kan.
