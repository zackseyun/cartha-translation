id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: yo
  text: 'Nínú ọ̀ràn yìí sì ni mo ń fún yín ní èrò mi[a]: nítorí èyí wúlò fún yín, ẹ̀yin tí ẹ ti bẹ̀rẹ̀ ní ọdún tó kọjá, kì í ṣe láti ṣe é nìkan, ṣùgbọ́n láti fẹ́ ṣe é[b] pẹ̀lú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmọ̀ràn mi” tàbí “ìdájọ́ mi.” Pọ́ọ̀lù ń fún wọn ní èrò tí ó ti gbé yẹ̀ wò; kò sì gbé ọ̀rọ̀ náà kalẹ̀ gẹ́gẹ́ bí àṣẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti múra tán láti ṣe é.” Ọ̀rọ̀ Gíríìkì náà yà ìfẹ́ tàbí ìmúratán inú sọ́tọ̀ kúrò nínú ṣíṣe iṣẹ́ náà ní ti gidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: èrò mi
  rationale: Ó túmọ̀ sí èrò tàbí ìmọ̀ràn tí a ti gbé yẹ̀ wò; ó bá àyíká ọ̀rọ̀ mu, níbi tí Pọ́ọ̀lù kò ti gbé e kalẹ̀ gẹ́gẹ́ bí àṣẹ.
- source_word: ἐν τούτῳ
  choice: nínú ọ̀ràn yìí
  rationale: Ó tọ́ka sí ọ̀ràn ìkójọ owó tí a ń jíròrò, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: δίδωμι
  choice: mo ń fún yín ní
  rationale: Ó pa ìṣe àkókò ìsinsìnyí mọ́, ó sì ṣe àkópọ̀ àdánidá pẹ̀lú ‘èrò mi.’
- source_word: συμφέρει
  choice: ṣàǹfààní fún yín
  rationale: Ó sọ ohun tó dára tàbí tó wúlò fún wọn, láìfi ìtumọ̀ èrè owó kún un.
- source_word: οἵτινες
  choice: ẹ̀yin tí
  rationale: Ó dá àwọn ará Kọ́ríńtì mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n ti bẹ̀rẹ̀ tẹ́lẹ̀, ó sì pa ìbátan gbólóhùn Gíríìkì mọ́.
- source_word: τὸ ποιῆσαι
  choice: láti ṣe é
  rationale: Ó tọ́ka sí mímú iṣẹ́ ìkójọ náà ṣẹ ní ti gidi; ohun tí ‘é’ dúró fún hàn gbangba nínú àyíká ọ̀rọ̀.
- source_word: τὸ θέλειν
  choice: láti ní ìfẹ́ láti ṣe é
  rationale: Ó fi ìfẹ́ inú tàbí ìmúratán yàtọ̀ sí ṣíṣe iṣẹ́ náà ní ti gidi, ní Yorùbá tó ṣe kedere.
- source_word: προενήρξασθε
  choice: ẹ ti bẹ̀rẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ bíbẹ̀rẹ̀ ṣáájú; gbólóhùn ‘láti ọdún tó kọjá’ ti mú apá àkókò náà hàn.
- source_word: ἀπὸ πέρυσι
  choice: láti ọdún tó kọjá
  rationale: Ó pa ìtumọ̀ ‘láti ọdún àná’ mọ́, láìfi dandan sọ pé iṣẹ́ náà ń bá a lọ láìdádúró.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Pọ́ọ̀lù ní ìbámu pẹ̀lú àṣẹ aposteli
  choice: Pọ́ọ̀lù ń fún wọn ní èrò tí ó ti gbé yẹ̀ wò, kì í ṣe pé ó ń pàṣẹ ní tààrà.
  alternative: Pọ́ọ̀lù ń gbé ìtọ́nisọ́nà aláṣẹ kalẹ̀.
  rationale: Àyíká 2 Kọ́ríńtì 8:8–10 fi àṣẹ àti èrò yàtọ̀ síra. ‘Èrò mi’ pa ìmọ̀ràn olùṣọ́-agbo rẹ̀ mọ́ láìsọ ọ́ di àṣẹ tààrà tàbí sọ ọ́ di ohun tí kò ṣe pàtàkì.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó bá yẹ, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo ‘ẹ̀yin tí’ láti pa ìtẹnumọ́ olùgbọ́ mọ́, àti ‘ní ìfẹ́ láti ṣe é’ láti mú ìyàtọ̀ láàárín ìfẹ́ inú àti ìṣe hàn kedere.
