    issue: “ìṣírí wa” fún παράκλησιν
    rationale: Nínú ọ̀rọ̀ yìí, παράκλησις jẹ́ ẹ̀bẹ̀ tàbí ìrọ̀ tí Titu gbà láti ṣe iṣẹ́ kan, kì í ṣe ìṣírí ní pàtàkì. “wa” sì jẹ́ ìfikún tí kò hàn nínú ẹsẹ náà.
  - severity: medium
    issue: “mú ọ̀nà pọ̀n lọ” fún ἐξῆλθεν
    rationale: Gbólóhùn náà lè túmọ̀ sí lílọ ní ìkánjú. ἐξῆλθεν ń sọ pé ó jáde/lọ sí ọ̀dọ̀ wọn, kì í sọ iyára ìrìnàjò.
  - severity: low
    issue: Ìpò àkọsílẹ̀ ìsàlẹ̀ fún αὐθαίρετος
    rationale: Àkọsílẹ̀ “ó dá sí i fúnra rẹ̀” kò ṣe kedere tó. Àṣàyàn náà yẹ kí ó sọ ìfẹ́-ọkàn tàbí ìpilẹ̀ṣẹ̀ tirẹ̀ ní kedere.
