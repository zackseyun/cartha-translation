review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìdí/àlàyé ti ὅτι, ìfẹ́-gbà ti ἐδέξατο, ìfiwéra nínú σπουδαιότερος, àti ìfẹ́-ọkàn nínú αὐθαίρετος jáde. Ṣùgbọ́n “ìṣírí wa” kì í ṣojú παράκλησιν dáadáa nínú àyíká ìbéèrè iṣẹ́ yìí, ó sì fi aṣojú-ọrọ̀ “wa” tí kò sí nínú Gíríìkì kún un. “Mú ọ̀nà pọ̀n lọ” tún yí ἐξῆλθεν sí ìríra/ìkánjú tí ọrọ̀ orísun kò sọ.
  naturalness: “Ó fi ìfẹ́ inú tirẹ̀ mú ọ̀nà pọ̀n lọ” kò rọrùn gẹ́gẹ́ bí Yorùbá ìgbàlódé, ó sì lè túmọ̀ sí pé ó yára. “Ó jáde lọ sí ọ̀dọ̀ yín láti inú ìfẹ́ ọkàn tirẹ̀” jẹ́ kedere, adayeba, ó sì pa ìtumọ̀ ìtòsí “went out” mọ́.
  terminology: “Ẹ̀bẹ̀ náà” bá παράκλησιν mu dáadáa nípa àyíká rẹ̀ gẹ́gẹ́ bí ìrọ̀/ìbéèrè Paulu sí Titu. “Túbọ̀ ní ìtara” jẹ́ ọ̀nà Yorùbá tó dára láti fi agbára afiwéra σπουδαιότερος hàn. “Láti inú ìfẹ́ ọkàn tirẹ̀” ṣàfihàn ìṣe tinútinú láìfi ẹ̀kọ́ ìsìn kún un.
  issues:
