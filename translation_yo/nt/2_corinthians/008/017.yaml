base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: yo
  text: Nítorí ó gba ẹ̀bẹ̀ náà[a]; ṣùgbọ́n, bí ó ti túbọ̀ ní ìtara[b], ó jáde lọ sí ọ̀dọ̀ yín[d] láti inú ìfẹ́ ọkàn tirẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣírí náà” tàbí “ìtọ́ni náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó túbọ̀ ń hára gàgà” tàbí “ó túbọ̀ ní ìmúra.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó ṣe é tinútinú” tàbí “ní ìpilẹ̀ṣẹ̀ tirẹ̀.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ó wá sí ọ̀dọ̀ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ní agbára ìdí tàbí àlàyé, ó sì so ẹsẹ yìí mọ́ ọpẹ́ inú ẹsẹ tó ṣáájú.
- source_word: παράκλησιν
  choice: ìṣírí wa
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí bí Paulu ṣe rọ Titu láti ṣe iṣẹ́ náà; “ìṣírí” lè gba ìtumọ̀ rírọni tàbí ẹ̀bẹ̀ láìfi ọ̀kan ṣoṣo múlẹ̀.
- source_word: ἐδέξατο
  choice: tẹ́wọ́ gba
  rationale: Èyí fi hàn pé Titu gba ohun tí Paulu rọ̀ ọ́ láti ṣe pẹ̀lú ojúrere, kì í ṣe pé ó kàn gbọ́ ọ̀rọ̀ náà.
- source_word: σπουδαιότερος
  choice: túbọ̀ ní ìtara
  rationale: Ó pa agbára afiwéra mọ́, ó sì sọ ìtara Titu tó pọ̀ sí i jáde ní Yorùbá àdánidá.
- source_word: ὑπάρχων
  choice: nítorí ó ... ní
  rationale: Ìtumọ̀ participle náà ni a sọ ní ọ̀nà Yorùbá tó ṣàn, láìfi ìtumọ̀ míì kún un.
- source_word: αὐθαίρετος
  choice: fi ìfẹ́ inú tirẹ̀
  rationale: Ó tẹnu mọ́ pé Titu ṣe é tinútinú àti láti inú ìdánilẹ́kọ̀ọ́ tirẹ̀, kì í ṣe nípasẹ̀ àfipá.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: mú ọ̀nà pọ̀n lọ sọ́dọ̀ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó gbéra láti ibi tí Paulu wà lọ sí ọ̀dọ̀ àwọn ará Kọrinti, ó sì pa ìtọ́sọ́nà ìṣe náà mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìdí tí ὅτι ń fi hàn, agbára afiwéra σπουδαιότερος, àti ìṣe tinútinú αὐθαίρετος mọ́; àwọn àlàyé ìtumọ̀ míì wà ní àkọsílẹ̀ ìsàlẹ̀.
