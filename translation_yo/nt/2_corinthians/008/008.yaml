id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: yo
  text: Èmi kò sọ èyí gẹ́gẹ́ bí àṣẹ, ṣùgbọ́n nípasẹ̀ ìtara àwọn ẹlòmíràn, mo tún ń dán ojúlówó ìfẹ́ yín wò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dán ... wò” tún lè túmọ̀ sí “fi hàn pé ó jẹ́ ojúlówó” tàbí “fi sí àyẹ̀wò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àṣẹ aláṣẹ, ó sì pa ìyàtọ̀ tó wà láàárín fífúnni ní àṣẹ àti fífúnni tinútinú mọ́.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: nípasẹ̀ ìtara àwọn ẹlòmíràn
  rationale: “Nípasẹ̀” fi ipa ohun èlò tàbí ọ̀nà tí διά pẹ̀lú genitive ní hàn; “àwọn ẹlòmíràn” kò sọ ẹni tí wọ́n jẹ́ ní pàtó ju Gíríìkì lọ.
- source_word: σπουδή
  choice: ìtara
  rationale: “Ìtara” ní èdè Yorùbá lè fi ìfẹ́kúfẹ̀ẹ́ onítara àti ìfọkànsìn tó jinlẹ̀ hàn, èyí tó bá ọ̀rọ̀ ọrẹ fífún mu.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìfẹ́ tí a fi hàn nípa fífúnni.
- source_word: γνήσιον
  choice: ojúlówó
  rationale: “Ojúlówó” fi ohun tí kì í ṣe èké, tí ó jẹ́ tòótọ́, hàn lọ́nà àdánidá nínú gbólóhùn “ojúlówó ìfẹ́ yín.”
- source_word: δοκιμάζων
  choice: mo tún ń dán ... wò
  rationale: Ìṣe tí ó ń bá ọ̀rọ̀ sísọ lọ ni participle náà tọ́ka sí; “ń dán ... wò” pa èrò ìdánwò tàbí fífi sí àyẹ̀wò mọ́.
- source_word: καί
  choice: tún
  rationale: “Tún” fi agbára àfikún καί hàn lọ́nà Yorùbá tó rọ̀.
- source_word: ὑμετέρας
  choice: yín
  rationale: “Yín” tọ́ka sí àwọn ará Kọ́ríńtì lápapọ̀ gẹ́gẹ́ bí ẹni púpọ̀.
theological_decisions:
- issue: Ìdúró Pọ́ọ̀lù nípa fífúnni
  choice: Pọ́ọ̀lù sọ ní kedere pé òun kò sọ èyí gẹ́gẹ́ bí àṣẹ, ó sì gbé ọ̀rọ̀ rẹ̀ kalẹ̀ gẹ́gẹ́ bí dídán ojúlówó ìfẹ́ wọn wò.
  alternative: Kí a ka ọ̀rọ̀ náà sí àṣẹ tí Pọ́ọ̀lù kàn ń sọ ní ọ̀nà pẹ̀lẹ́.
  rationale: Οὐ κατ’ ἐπιταγὴν λέγω kọ ọ̀rọ̀ àṣẹ ní tààrà; ìtumọ̀ náà kò gbọ́dọ̀ sọ ìkọ̀sílẹ̀ yìí di àṣẹ àfipamọ́, ṣùgbọ́n ó yẹ kí ó pa ìfọ̀kànsìn tinútinú mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. A yan “ìtara” láìfi ẹ̀sẹ̀ náà mọ́ àwọn ará Makedóníà ní pàtó, nítorí Gíríìkì sọ “àwọn ẹlòmíràn” nìkan. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó ní ọ̀rọ̀ àfidípò rẹ̀.
