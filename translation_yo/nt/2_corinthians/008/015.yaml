id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: yo
  text: gẹ́gẹ́ bí a ti kọ ọ́ pé, “Ẹni tí ó ní púpọ̀ kò ní àpọ̀jù, ẹni tí ó sì ní díẹ̀ kò ní àìtó.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé Ẹ́kísódù 16:18 ní pẹkipẹki: “Ẹni tí ó kójọ púpọ̀ kò ní àpọ̀jù, ẹni tí ó sì kójọ díẹ̀ kò ní àìtó.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà àdéhùn tí a fi ń tọ́ka sí Ìwé Mímọ́; ó tún fi hàn pé ohun tí a kọ ṣì dúró gẹ́gẹ́ bí ẹ̀rí.
- source_word: Ὁ τὸ πολὺ
  choice: Ẹni tí ó ní púpọ̀
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní ti ẹni tí ó ní ohun púpọ̀ láìfi ọ̀rọ̀-ìṣe ‘kójọ’ hàn gbangba; ìtumọ̀ yìí bá ọ̀rọ̀ Pọ́ọ̀lù nípa pípín ohun-ìní mu.
- source_word: ἐπλεόνασεν
  choice: kò ní àpọ̀jù
  rationale: Nínú àyọlò yìí, ọ̀rọ̀ náà túmọ̀ sí pé kò sí ohun tí ó pọ̀ ju iye tí a nílò lọ; ‘àpọ̀jù’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá òdì-kejì rẹ̀, ‘àìtó,’ mu.
- source_word: ὁ τὸ ὀλίγον
  choice: ẹni tí ó sì ní díẹ̀
  rationale: Ó tẹ̀ lé ìbára-ẹni-mu ti apá àkọ́kọ́, kò sì fi ọ̀rọ̀-ìṣe ‘kójọ’ tí kò sí nínú ọ̀rọ̀ Gíríìkì ti Pọ́ọ̀lù kún un.
- source_word: ἠλαττόνησεν
  choice: kò ní àìtó
  rationale: Ọ̀rọ̀ náà ń sọ nípa àìní tàbí àìpé; ‘kò ní àìtó’ jẹ́ adayeba ní Yorùbá, ó sì pa ìdọ́gba ìtumọ̀ mọ́ pẹ̀lú ‘kò ní àpọ̀jù.’
theological_decisions:
- issue: Bí àyọlò Ẹ́kísódù 16:18 ṣe ń ṣiṣẹ́ nínú ọ̀rọ̀ Pọ́ọ̀lù nípa ìwà ọ̀làwọ́ àti ìdọ́gba
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí ohun tí olúkúlùkù ní ní ìparí—láìsí àpọ̀jù tàbí àìtó—dípò fífi ‘kójọ’ sínú ọ̀rọ̀ pàtàkì.
  alternative: “Ẹni tí ó kójọ púpọ̀ kò ní àpọ̀jù, ẹni tí ó sì kójọ díẹ̀ kò ní àìtó.”
  rationale: Gíríìkì tí Pọ́ọ̀lù kọ kò sọ ọ̀rọ̀-ìṣe ‘kójọ’ ní gbangba, bí ó tilẹ̀ jẹ́ pé àyíká Ẹ́kísódù ni ó wà lẹ́yìn àyọlò náà. Yíyan ọ̀rọ̀ nípa ohun tí ẹni kọ̀ọ̀kan ní pa ìfọkànsìn Pọ́ọ̀lù sí ìpèsè tó dọ́gba mọ́, láìpa ìtumọ̀ Ẹ́kísódù rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti adayeba ni a lò. ‘Àpọ̀jù/àìtó’ mú ìbára-ẹni-mu inú gbolohun Gíríìkì jáde kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìsopọ̀ pẹ̀lú ìkójọ mánà nínú Ẹ́kísódù mọ́.
