  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fi ìpìlẹ̀ gbolohun Gíríìkì náà hàn dáadáa: ìmọ̀ àwọn olùgbọ́, oore-ọ̀fẹ́ Kristi, ìtakora ọlọ́rọ̀/òtòṣì, ìdí ‘nítorí yín,’ àti ète ‘kí ẹ lè di ọlọ́rọ̀.’ Àmì ìdásílẹ̀ ‘pé’ ni a fi kún un láti ṣàfihàn ὅτι kedere. ‘Nítorí tiyín’ sì ti yí padà sí ‘nítorí yín,’ èyí tí ó jẹ́ ìtumọ̀ ìbánisọ̀rọ̀ Yorùbá tó péye fún δι’ ὑμᾶς.'
  naturalness: 'Àwọn ìṣàtúnṣe kékeré náà mú gbolohun náà rọrùn àti àdánidá sí i nínú Yorùbá boṣewa: ‘ẹ mọ’ kò nílò arọ́pò-orúkọ ìtẹnumọ́ ní ibi yìí, ‘nítorí yín’ ni ọ̀nà ìbílẹ̀ tó wúlò, a sì yọ ‘síbẹ̀’ kúrò nítorí ìtumọ̀ ìjẹ̀wọ́ ‘bí ó tilẹ̀ jẹ́’ ti tó láti mú ìtakora náà wá.'
  terminology: ‘Oore-ọ̀fẹ́,’ ‘Olúwa,’ ‘Jésù Kristi,’ ‘ọlọ́rọ̀,’ àti ‘òtòṣì’ yẹ, wọ́n sì pa ìtumọ̀ ẹ̀kọ́ ọ̀rọ̀ náà mọ́ láì dín àkàwé náà kù sí ìtumọ̀ kan. Àlàyé ìsàlẹ̀ nípa Kristi/Mèsáyà ti ṣàtúnṣe láti lo fọ́ọ̀mù Gíríìkì tí ó wà nínú ẹsẹ náà, Χριστοῦ.
