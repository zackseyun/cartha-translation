  - severity: low
    issue: Àlàyé ìsàlẹ̀ a lo Χριστός dípò Χριστοῦ.
    rationale: Fọ́ọ̀mù tí ó wà nínú ọ̀rọ̀ orísun ni Χριστοῦ. Àtúnṣe náà jẹ́ kí àlàyé náà péye nípa ọ̀rọ̀.
