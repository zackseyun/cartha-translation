id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: yo
  text: Nítorí ẹ mọ oore-ọ̀fẹ́ Olúwa wa Jésù Kristi[a], pé bí ó tilẹ̀ jẹ́ ọlọ́rọ̀, ó di òtòṣì nítorí yín[b], kí ẹ lè di ọlọ́rọ̀ nípasẹ̀ òṣì rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “Kristi” sí “Mèsáyà.” Ọ̀rọ̀ Gíríìkì Χριστοῦ jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “ọlọ́rọ̀” àti “òtòṣì” jẹ́ àkàwé, tí ó ń fi ìyàtọ̀ hàn láàárín ọrọ̀ Kristi tẹ́lẹ̀ àti òṣì tí ó gbà nítorí àwọn ẹlòmíràn; Pọ́ọ̀lù kò ṣàlàyé àkàwé náà ní pàtó níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: ẹ̀yin mọ
  rationale: Ọ̀rọ̀-ìṣe yìí wà ní àkókò ìsinsìnyí, ó sì ń tọ́ka sí ohun tí àwọn ará Kọ́ríńtì ti mọ̀ tẹ́lẹ̀; ‘ẹ̀yin mọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ pa ìtumọ̀ inú rere tí a kò tọ́ sí mọ́, ó sì tún lè gba èrò ìwà ọ̀làwọ́ Kristi tí àyíká ọ̀rọ̀ náà ń tẹnumọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni oyè Yorùbá tí ó yẹ fún κύριος níbí, ó sì pa agbára àti ìwúwo ọ̀rọ̀ nípa Kristi mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Kristi
  rationale: Èyí ni ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere jù lọ ní Yorùbá; àlàyé ìsàlẹ̀ fi ìtumọ̀ oyè Χριστός hàn láì sọ ọ́ di orúkọ ìdílé lásán.
- source_word: δι’ ὑμᾶς
  choice: nítorí tiyín
  rationale: Gbólóhùn yìí ṣàfihàn pé ohun tí Kristi ṣe jẹ́ fún àǹfààní wọn, kì í ṣe pé àwọn ni ó fà á ní ìtumọ̀ ẹ̀bi.
- source_word: ἐπτώχευσεν
  choice: ó di òtòṣì
  rationale: Èyí pa ìyípadà láti ọlọ́rọ̀ sí òtòṣì mọ́ láì fi kún ọ̀nà tàbí ìgbà tí ó gbà ṣẹlẹ̀.
- source_word: πλούσιος ὤν
  choice: bí ó tilẹ̀ jẹ́ ọlọ́rọ̀
  rationale: Ìtumọ̀ oníjàngbọ̀n tí participle náà ní nínú àyíká yìí ni a fi hàn ní Yorùbá àdánidá.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: nípasẹ̀ òṣì rẹ̀
  rationale: Dative náà ń tọ́ka sí ọ̀nà tàbí ohun èlò; ‘nípasẹ̀’ mú ìbáṣepọ̀ yẹn hàn kedere.
- source_word: πλουτήσητε
  choice: kí ẹ̀yin lè di ọlọ́rọ̀
  rationale: Èyí pa ète tí ἵνα ń sọ mọ́, ó sì dá ìfarawé ‘ó di òtòṣì/ẹ̀yin di ọlọ́rọ̀’ dúró.
theological_decisions:
- issue: Ìtumọ̀ pé Kristi jẹ́ ‘ọlọ́rọ̀’ àti pé àwọn onígbàgbọ́ ‘di ọlọ́rọ̀’
  choice: A pa àkàwé ọrọ̀ àti òṣì mọ́ láì sọ pàtó irú ọrọ̀ tí ó jẹ́.
  alternative: A lè túmọ̀ ọrọ̀ Kristi gẹ́gẹ́ bí ògo rẹ̀ ṣáájú dídi ènìyàn, ipò Mèsáyà rẹ̀, tàbí kí a túmọ̀ ọrọ̀ àwọn onígbàgbọ́ gẹ́gẹ́ bí ìbùkún ìgbàlà tàbí àǹfààní àwùjọ.
  rationale: Gíríìkì kò sọ pàtó ohun tí ọrọ̀ àti òṣì dúró fún. Àyíká náà ní í ṣe pẹ̀lú ọ̀làwọ́, ṣùgbọ́n ẹsẹ yìí tún ní ìwúwo ẹ̀kọ́ nípa ìfara-ẹni-rúbọ Kristi; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: A lo Yorùbá boṣewa, ìgbàlódé, ọlọ́lá, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtòlẹ́sẹẹsẹ gbolohun jẹ́ àdánidá, ṣùgbọ́n ó pa ìtakora ọlọ́rọ̀/òtòṣì àti ìbáṣepọ̀ ète inú Gíríìkì mọ́.
