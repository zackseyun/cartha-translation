    rationale: Àpẹẹrẹ yìí kò ṣe àdánidá gẹ́gẹ́ bí ìtumọ̀ benefactive ‘for your sake.’ ‘Nítorí yín’ ni Yorùbá boṣewa tó dára jù lọ, ó sì yẹra fún ìmọ̀ ‘because of yours.’
  - severity: low
