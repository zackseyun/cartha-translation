id: 2CO.8.23
reference: 2 Corinthians 8:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: yo
  text: Ní ti Titu, ẹlẹgbẹ́ mi àti alábàáṣiṣẹ́ mi fún yín ni; ní ti àwọn arákùnrin wa, aṣojú àwọn ìjọ[a] ni wọ́n, ògo Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àpọ́sítélì àwọn ìjọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ońṣẹ́ tàbí aṣojú tí a rán, ó sì tún lè túmọ̀ sí àpọ́sítélì ní ìtumọ̀ fífẹ̀; níbí, àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún “aṣojú àwọn ìjọ.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ògo Kristi.” A lo “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Ní ti Títù
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀rọ̀ kúkúrú tí ó ń gbé ọ̀ràn méjì kalẹ̀ ní ìfarawé. “Ní ti Títù” mú iṣẹ́ rẹ̀ nínú gbólóhùn jáde lọ́nà Yorùbá àdánidá.
- source_word: κοινωνὸς ἐμὸς
  choice: ẹlẹgbẹ́ mi
  rationale: κοινωνός túmọ̀ sí ẹni tí ó ń pín iṣẹ́ tàbí ìkópa kan pẹ̀lú ẹlòmíràn. “Ẹlẹgbẹ́ mi” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì pa ìtumọ̀ ìbáṣepọ̀ àti iṣẹ́ pa mọ́.
- source_word: εἰς ὑμᾶς συνεργός
  choice: alábàáṣiṣẹ́ mi fún yín
  rationale: “Alábàáṣiṣẹ́” fi συνεργός hàn, “fún yín” sì pa ìdarí iṣẹ́ náà sí àwọn ará Kọ́ríńtì mọ́ láìfikún èrò bí “fún ire yín” tí kò hàn gbangba nínú orísun.
- source_word: ἀδελφοὶ ἡμῶν
  choice: àwọn arákùnrin wa
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, àyíká ọ̀rọ̀ náà sì ń tọ́ka sí àwọn ọkùnrin tí a rán gẹ́gẹ́ bí aṣojú.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: aṣojú àwọn ìjọ
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀπόστολοι ń tọ́ka sí àwọn tí àwọn ìjọ rán tàbí yàn gẹ́gẹ́ bí aṣojú, kì í ṣe dandan sí ipò àpọ́sítélì ní ìtumọ̀ pàtó.
- source_word: δόξα Χριστοῦ
  choice: ògo Mèsáyà
  rationale: Gbólóhùn aláìṣe yìí fi àwọn arákùnrin náà hàn gẹ́gẹ́ bí ògo Mèsáyà. “Mèsáyà” túmọ̀ Χριστός gẹ́gẹ́ bí oyè, dípò kí a kàn ṣe àkọsílẹ̀ ohùn rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἀπόστολοι nípa àwọn arákùnrin tí a kò dárúkọ
  choice: aṣojú àwọn ìjọ
  alternative: àwọn àpọ́sítélì àwọn ìjọ
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti àwọn aṣojú tí ó ní í ṣe pẹ̀lú ọrẹ, àti pé “ti àwọn ìjọ” tọ́ka sí àwọn tí ìjọ rán. Yíyan “aṣojú” kò gbé ipò ìjọ tí ẹsẹ náà kò fi dandan mú wá lé wọn lórí.
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” fi ìtumọ̀ oyè náà hàn, nígbà tí “Kristi” jẹ́ àkọsílẹ̀ ohùn tí ó ti di orúkọ bí ẹni pé ó rí.
- issue: Ìbáṣepọ̀ δόξα Χριστοῦ pẹ̀lú àwọn aṣojú
  choice: 'gbólóhùn àfikún: “ògo Mèsáyà”'
  alternative: “wọ́n ń mú ògo wá fún Mèsáyà”
  rationale: Orísun jẹ́ gbólóhùn aláìṣe, ó sì lè túmọ̀ sí pé àwọn aṣojú náà ni ògo Mèsáyà tàbí pé wọ́n ń fi ògo rẹ̀ hàn. A pa ìṣòro àti agbára ọ̀rọ̀ àkọ́kọ́ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ìṣe kan ṣoṣo.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ìṣètò “Ní ti …; ní ti …” láti pa ìfarawé ọ̀rọ̀ Gíríìkì mọ́, a sì fi àmì ohùn síbi tí ó bá yẹ.
