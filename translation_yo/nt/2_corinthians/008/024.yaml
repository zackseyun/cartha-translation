translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìṣètò ìṣírí Paulu, ìtumọ̀ ìfẹ́ tí a fi ìṣe hàn, àti agbára ọ̀rọ̀ “ìṣògo” mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
