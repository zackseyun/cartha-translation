  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé tó yè, tó sì jẹ́ ti ìforígbárí lẹ́tà Pọ́ọ̀lù. Àtòjọ náà—“ẹ fi ẹ̀rí ... hàn sí wọn níwájú àwọn ìjọ”—jẹ́ àdánidá, ó sì mú ìmọ̀ pé ìfihàn náà jẹ́ ní gbangba hàn. Àmì ohùn àti ìkọ̀wé wà ní ìpele tó dáa.
