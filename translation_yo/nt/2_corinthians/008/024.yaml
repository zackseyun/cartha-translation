id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: yo
  text: Nítorí náà, ẹ fi ẹ̀rí[a] ìfẹ́ yín àti ti ìṣògo wa nípa yín hàn sí wọn níwájú àwọn ìjọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìfihàn” tàbí “àmì tí ó fi ìfẹ́ yín hàn.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà tún lè túmọ̀ sí “ní ojú àwọn ìjọ”; ó ń tọ́ka sí fífi ohun náà hàn ní gbangba níwájú àwọn aṣojú àwọn ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: ẹ̀rí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó fi òtítọ́ ọ̀ràn kan hàn kedere; “ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìpè Paulu fún ìfẹ́ tí a fi ìṣe hàn mu.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún ἀγάπη; níbí, ó jẹ́ ìfẹ́ tí yóò hàn nínú ìṣe.
- source_word: καυχήσεως
  choice: ìṣògo
  rationale: “Ìṣògo” pa agbára ọ̀rọ̀ Paulu mọ́ pé ó ti ń sọ ohun rere nípa wọn, láì sọ ọ́ di ìgbéraga búburú.
- source_word: ὑπὲρ ὑμῶν
  choice: nípa yín
  rationale: Pẹ̀lú καυχήσεως, gbólóhùn náà túmọ̀ sí ìṣògo tí Paulu ń ṣe nípa àwọn ará Kọ́ríńtì.
- source_word: εἰς αὐτοὺς
  choice: sí wọn
  rationale: Ó ń tọ́ka sí àwọn arákùnrin tí a mẹ́nu kàn ṣáájú; “fi … hàn sí wọn” jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐνδεικνύμενοι
  choice: ẹ fi … hàn
  rationale: Àpólà aláìlẹ́gbẹ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ tàbí ìṣírí ní àyíká ọ̀rọ̀ yìí; “ẹ fi … hàn” sọ iṣẹ́ rẹ̀ di mímọ́ ní Yorùbá.
- source_word: εἰς πρόσωπον
  choice: níwájú
  rationale: Ní àkópọ̀ yìí, ó túmọ̀ sí ṣíṣe ohun kan ní ojú tàbí níwájú àwọn míì, kì í ṣe dandan ní ojú ẹni kọ̀ọ̀kan.
- source_word: τῶν ἐκκλησιῶν
  choice: àwọn ìjọ
  rationale: Nínú àwọn lẹ́tà Paulu, ἐκκλησίαι sábà ń tọ́ka sí àwọn àwùjọ àwọn onígbàgbọ́ ní ibi kọ̀ọ̀kan; “àwọn ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣírí yìí mọ́ ohun tí Paulu ṣẹ̀ṣẹ̀ sọ, ó sì fi hàn pé ìparí tàbí àbájáde ọ̀rọ̀ ṣáájú ni.
