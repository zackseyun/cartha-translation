id: 2CO.8.11
reference: 2 Corinthians 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí, ẹ sì parí ṣíṣe rẹ̀[a], kí, gẹ́gẹ́ bí ìtara láti fẹ́ ṣe é ti wà, bẹ́ẹ̀ náà ni kí píparí rẹ̀ wà ní ìbámu pẹ̀lú ohun tí ẹ ní.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ mú un dé òpin.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “láti inú ohun tí ẹ ní”; ìyẹn ni pé, ní ìbámu pẹ̀lú ohun tí ó wà lọ́wọ́ yín báyìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó pa agbára àkókò àti ìyípadà kékeré tí δέ ní mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: ẹ parí ṣíṣe rẹ̀ pẹ̀lú
  rationale: Ó sọ iṣẹ́ tí wọ́n ti pinnu tẹ́lẹ̀ di ohun tí a gbọ́dọ̀ mú dé òpin; “pẹ̀lú” ń pa καί mọ́.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: ìtara láti fẹ́ ṣe é
  rationale: “Ìtara” fi ìmúrasílẹ̀ àti ìfẹ́ ọkàn hàn, “láti fẹ́ ṣe é” sì pa ìtumọ̀ ìfẹ́-inú ti θέλειν mọ́.
- source_word: τὸ ἐπιτελέσαι
  choice: ẹ ó parí rẹ̀
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἐπιτελέσατε, ó sì yé àwọn òǹkàwé lónìí.
- source_word: ἐκ τοῦ ἔχειν
  choice: ní ìbámu pẹ̀lú ohun tí ẹ ní
  rationale: Ó fi hàn pé píparí ọrẹ náà yóò dá lórí ohun tí ó wà lọ́wọ́ wọn, láìsọ pé kí wọ́n fúnni ré kọjá agbára wọn.
theological_decisions:
- issue: Fífúnni ní ìbámu pẹ̀lú ohun tí ó wà lọ́wọ́ ẹni
  choice: Ẹsẹ̀ náà ń rọ àwọn ará Kọ́ríńtì pé kí wọ́n parí ọrẹ tí wọ́n ti pinnu ní ìbámu pẹ̀lú ohun tí wọ́n ní.
  alternative: Ìpè gbogbogbò láti mú gbogbo èrò rere ṣẹ láìka ohun tí ẹni ní sí.
  rationale: Àyíká ẹsẹ̀ náà jẹ́ ti ọrẹ tí wọ́n ti ṣèlérí, ἐκ τοῦ ἔχειν sì tọ́ka sí ohun tí ó wà lọ́wọ́ wọn. Ìtumọ̀ náà kò fi ẹrù fífúnni ré kọjá agbára wọn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye. A lo “ẹ” fún ọ̀pọ̀ ènìyàn nítorí pé Pọ́ọ̀lù ń bá ìjọ Kọ́ríńtì sọ̀rọ̀. Àwọn àmì ohùn wà níbi tí ó bá yẹ.
