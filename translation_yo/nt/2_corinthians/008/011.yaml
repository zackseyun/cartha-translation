  to: Ṣùgbọ́n nísinsìnyí, ẹ sì parí ṣíṣe rẹ̀[a], kí, gẹ́gẹ́ bí ìtara láti fẹ́ ṣe é ti wà, bẹ́ẹ̀ náà ni kí píparí rẹ̀ wà ní ìbámu pẹ̀lú ohun tí ẹ ní.[b]
