  source_fidelity: Ìtumọ̀ náà gba èrò pàtàkì ẹsẹ̀ náà—ìṣọ́ra láti dènà ìbáwí nípa bí wọ́n ṣe ń ṣàkóso ọrẹ náà—mọ́. Síbẹ̀, “ọrẹ ọ̀pọ̀” kò jẹ́ ọ̀nà Yorùbá tó dára láti sọ ἁδρότης nínú àyíká yìí; “ọrẹ ńlá” ń sọ ìtóbi/ìpọ̀ ohun tí a fi ń ṣètọrẹ náà nípa ti ara. A tún tún gbólóhùn ìdènà náà ṣe kí ó jẹ́ Yorùbá tó péye.
  naturalness: “Kí ẹnikẹ́ni má bà a rí” dà bí ìkọ̀wé tí kò péye nínú Yorùbá òde òní. “Kí ẹnikẹ́ni má baà rí àléébù kan sí wa” jẹ́ ìsọ̀rọ̀ tó mọ́, tó sì dára. “A ń ṣọ́ra nínú ọ̀rọ̀ yìí” tún ṣàn dáadáa ju “À ń ṣọ́ra nípa èyí” lọ nínú àyíká ìṣàkóso ọrẹ.
  terminology: “Ọrẹ ńlá yìí” jẹ́ ìtumọ̀ aláìfi-ẹ̀kọ́-ìjọ-kún un fún ἁδρότης, ó sì bá àyíká ikójọpọ̀ ìrànlọ́wọ́ mu. “Ń bójú tó” yẹ fún διακονουμένῃ ὑφ’ ἡμῶν nínú ọ̀rọ̀ ìṣàkóso ọrẹ.
