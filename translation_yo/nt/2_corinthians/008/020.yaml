source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: yo
  text: A ń ṣọ́ra nínú ọ̀rọ̀ yìí, kí ẹnikẹ́ni má baà rí àléébù kan sí wa ní ti ọrẹ ńlá yìí[a] tí àwa ń bójú tó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọrẹ ọ̀làwọ́ yìí” tàbí “ohun tó pọ̀ yìí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọrẹ tàbí ìrànlọ́wọ́ tí ó pọ̀ tàbí tí a fi ọ̀làwọ́ fúnni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹnikẹ́ni má baà dá wa lẹ́bi nípa ọrẹ ńlá yìí tí àwa ń bójú tó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι
  choice: À ń ṣọ́ra nípa èyí
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbígbé ìgbésẹ̀ láti dènà ìṣòro tàbí ẹ̀sùn; ‘ṣọ́ra nípa èyí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣọ́ra ìdènà hàn.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: kí ẹnikẹ́ni má bà a rí àléébù sí wa
  rationale: μή pẹ̀lú subjunctive fi ète ìdènà hàn, μωμάομαι sì túmọ̀ sí rí àléébù, dá lẹ́bi, tàbí ṣàríwísí.
- source_word: ἁδρότητι
  choice: ọrẹ ọ̀pọ̀ yìí
  rationale: ἁδρότης lè tọ́ka sí ọ̀pọ̀lọpọ̀, ọ̀làwọ́, tàbí ọrẹ ńlá. Nínú àyíká ọrẹ ìrànlọ́wọ́ yìí, ‘ọrẹ ọ̀pọ̀’ pa ìtumọ̀ ọrẹ àti ọ̀pọ̀ rẹ̀ mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: tí àwa ń bójú tó
  rationale: Nínú àyíká owó ìrànlọ́wọ́, διακονέω tọ́ka sí ṣíṣe iṣẹ́ ìṣàkóso tàbí mímójútó ọrẹ náà; ‘ń bójú tó’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì yẹ fún àyíká náà.
theological_decisions:
- issue: Ìdí tí Pọ́ọ̀lù fi ń ṣọ́ra nínú mímójútó ọrẹ náà
  choice: Fi hàn pé ó ń gbé ìgbésẹ̀ ìṣọ́ra kí ẹnikẹ́ni má lè rí àléébù sí òun àti àwọn alábàáṣiṣẹ́ rẹ̀ nípa ọrẹ náà.
  alternative: Ka ọ̀rọ̀ náà sí ètò ìrìn-àjò lásán, láì tẹnu mọ́ jíjíhìn àti yíyẹra fún ẹ̀sùn.
  rationale: Gíríìkì tẹnu mọ́ ìgbésẹ̀ ìdènà lòdì sí ẹ̀sùn nípa bí wọ́n ṣe ń bójú tó ọrẹ náà; ìtumọ̀ náà pa ìtẹnumọ́ ìwà rere yìí mọ́ láì ṣàfikún ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye ni a lò. ‘Àwa’ nínú gbólóhùn ìkẹyìn mú ìtẹnumọ́ ὑφ’ ἡμῶν jáde, nígbà tí ‘bójú tó’ yẹra fún èdè ìjọ tó le koko.
