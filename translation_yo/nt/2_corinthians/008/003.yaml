  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: yo
  text: Nítorí mo jẹ́rìí pé wọ́n fúnni dé ìwọ̀n agbára wọn,[a] àní ju agbára wọn lọ, wọ́n sì ṣe bẹ́ẹ̀ láti inú ìfẹ́ ọkàn ara wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ohun tí wọ́n ní, àti ju ohun tí wọ́n ní lọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní tìfẹ́tìfẹ́” tàbí “ní ìfẹ́ ara wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń mú àlàyé tí Pọ́ọ̀lù fi ń fìdí ọ̀rọ̀ ẹsẹ tó ṣáájú múlẹ̀ wọlé; “Nítorí” jẹ́ ọ̀nà àdánidá láti fi iṣẹ́ àsopọ̀ yìí hàn ní Yorùbá.
- source_word: κατὰ δύναμιν
  choice: gẹ́gẹ́ bí agbára wọn ti mọ́
  rationale: κατά pẹ̀lú δύναμις ń tọ́ka sí ìwọ̀n tàbí ààlà agbára wọn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ fífúnni ní ìbámu pẹ̀lú agbára mọ́.
- source_word: μαρτυρῶ
  choice: mo jẹ́rìí sí i
  rationale: Ó pa ìtẹnumọ́ àti ẹ̀rí ara Pọ́ọ̀lù mọ́, ó sì bá ìlò Yorùbá òde òní mu.
- source_word: καὶ παρὰ δύναμιν
  choice: àní ju agbára wọn lọ
  rationale: παρά pẹ̀lú accusative túmọ̀ sí ré kọjá ààlà; “àní” mú ìtẹnumọ́ ìyàtọ̀ náà hàn láìfi ìtumọ̀ tuntun kún un.
- source_word: αὐθαίρετοι
  choice: wọ́n sì ṣe é látinú ìfẹ́ inú ara wọn
  rationale: Ó fi hàn pé wọ́n dá ṣe é láìsí ìfipá tàbí àṣẹ láti ọ̀dọ̀ ẹlòmíràn, ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ọ̀rọ̀-ìṣe tí a kò kọ ní gbangba pẹ̀lú αὐθαίρετοι
  choice: A mú “fi fúnni” wọlé láti inú àyíká ọ̀rọ̀, a sì tọ́ka sí i lẹ́ẹ̀kan sí i ní “wọ́n sì ṣe é.”
  alternative: Kí a túmọ̀ ọ́ ní líterálì sí “wọ́n jẹ́ olùyọ̀ǹda ara wọn,” èyí tí kò rọrùn ní Yorùbá.
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe náà sílẹ̀ nítorí ó ṣe kedere láti inú ẹsẹ 2–4 pé fífúnni ni a ń sọ. Ìmúpadà rẹ̀ sínú Yorùbá mú gbólóhùn náà pé láìfi ẹ̀kọ́ tàbí èrò mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “fi fúnni” fún ìṣe fífúnni tó wà nínú àyíká, a sì pa ìtẹnumọ́ pé wọ́n ré kọjá agbára wọn mọ́.
