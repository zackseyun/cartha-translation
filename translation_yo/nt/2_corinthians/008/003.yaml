  terminology: “Jẹ́rìí,” “fúnni,” “agbára,” àti “ìfẹ́ ọkàn ara wọn” bá ìforúkọsílẹ̀ tó bójú mu. “Àní” pa ìtẹnumọ́ καὶ παρὰ δύναμιν mọ́.
