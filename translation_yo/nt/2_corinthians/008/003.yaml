  source_fidelity: Ìtumọ̀ náà gba ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì—ìwọ̀n agbára, rékọjá agbára, àti ìfẹ́ ara ẹni—ní pàtàkì. Ṣùgbọ́n “gẹ́gẹ́ bí agbára wọn ti mọ́” kò dáa ní Yorùbá fún κατὰ δύναμιν, ó sì lè mú ìtumọ̀ míràn wá. Ìtúnṣe náà lo “dé ìwọ̀n agbára wọn,” èyí tí ó hàn gbangba pé fífúnni wọn bá agbára wọn mu.
