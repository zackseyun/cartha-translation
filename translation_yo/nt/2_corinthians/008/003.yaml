revisions:
- from: Nítorí mo jẹ́rìí sí i pé, wọ́n fi fúnni gẹ́gẹ́ bí agbára wọn ti mọ́, àní ju agbára wọn lọ, wọ́n sì ṣe é látinú ìfẹ́ inú ara wọn.[a][b]
  to: Nítorí mo jẹ́rìí pé wọ́n fúnni dé ìwọ̀n agbára wọn,[a] àní ju agbára wọn lọ, wọ́n sì ṣe bẹ́ẹ̀ láti inú ìfẹ́ ọkàn ara wọn.[b]
  rationale: A rọ́pò ìlò tí kò rọrùn “gẹ́gẹ́ bí agbára wọn ti mọ́” pẹ̀lú “dé ìwọ̀n agbára wọn,” láti mú ìtumọ̀ Gíríìkì κατὰ δύναμιν hàn ní Yorùbá tó pé. A tún lo “ṣe bẹ́ẹ̀ láti inú ìfẹ́ ọkàn ara wọn” fún αὐθαίρετοι, ní fífi ọ̀rọ̀-ìṣe fífúnni tí àyíká sọ di mímọ̀ hàn láìfikún èrò míràn. A gbé àwọn àmì akọsílẹ̀ sí àwọn gbolohun tí wọ́n kan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:04Z'
