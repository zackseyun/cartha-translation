id: 2CO.8.21
reference: 2 Corinthians 8:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: yo
  text: Nítorí a ń ronú ṣáájú nípa ohun rere[a], kì í ṣe lójú Olúwa nìkan, ṣùgbọ́n lójú àwọn ènìyàn pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó níyì” tàbí “ohun tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: a ń pèsè ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ríronú ṣáájú tàbí ṣíṣe ìpèsè pẹ̀lú ìṣọ́ra. Nínú àyíká ọ̀rọ̀ nípa bí a ṣe ń bójú tó owó àkójọ, gbólóhùn yìí fi ìṣọ́ra àti èrò ṣáájú hàn ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: καλὰ
  choice: ohun tí ó dára
  rationale: Ó pa ìtumọ̀ gbòòrò ti ohun rere mọ́, láì dín un kù sí ohun tí ó níyì lójú àwọn ènìyàn nìkan; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìwọ̀ntúnwọ̀nsì àti ìtẹnumọ́ ìkọ́lé Gíríìkì mọ́.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó lè túmọ̀ sí níwájú tàbí ní ojú ẹni; yíyan ‘níwájú’ jẹ́ kúkúrú, ó sì bá àwọn abala méjèèjì mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος nínú àyíká yìí ni ‘Olúwa.’
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìwà rere inú καλὰ ní àyíká jíjíhìn nípa owó
  choice: ohun tí ó dára
  alternative: ohun tí ó níyì; ohun tí ó tọ́
  rationale: Gíríìkì lè tọ́ka sí ohun rere ní gbogbogbòò tàbí ìwà tí àwọn ènìyàn rí sí rere, pàápàá nínú ọ̀rọ̀ jíjíhìn. Ìtumọ̀ àkọ́kọ́ pa ìfẹ̀sí gbòòrò náà mọ́, àlàyé ìsàlẹ̀ sì dáàbò bo àwọn ìtumọ̀ tó ṣeé ṣe míì.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
