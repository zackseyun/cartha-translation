id: 2CO.8.14
reference: 2 Corinthians 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: yo
  text: Ní àkókò yìí, kí ohun àpọ̀jù tí ẹ ní lè pèsè fún àìní wọn, kí ohun àpọ̀jù tí àwọn náà ní sì lè pèsè fún àìní yín, kí ìdọ́gba[a] lè wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwọ̀ntúnwọ̀nsì.” Níhìn-ín, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìpèsè fún àìní ara wọn ní ìwọ̀n tó yẹ, kì í ṣe pé gbogbo wọn gbọ́dọ̀ ní ohun ìní tó dọ́gba pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Ní àkókò yìí
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń sọ̀rọ̀ nípa ipò tàbí àsìkò tí ó wà nígbà náà, kì í ṣe nípa àkókò gẹ́gẹ́ bí ìṣírò nìkan.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ohun àpọ̀jù tí ẹ ní
  rationale: Ìtumọ̀ rẹ̀ ni ohun tí ó pọ̀ ju àìní ẹni lọ; gbólóhùn yìí jẹ́ ti èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ohun ìní sí láì fi mọ́ owó nìkan.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: lè dí àìní wọn
  rationale: Ọ̀nà tí èdè Yorùbá fi ń sọ pé a lo ohun kan láti pèsè ohun tí ó kù ni ‘dí àìní’; ‘lè’ jẹ́ kí ìdí tàbí àbájáde tí εἰς ń tọ́ka sí hàn.
- source_word: ἵνα καὶ
  choice: kí ... sì lè
  rationale: ‘Kí’ fi ìdí tí a ṣe ń ṣe é hàn, ‘sì’ sì mú ìpèsè padà-lẹ́gbẹ̀ẹ́-padà tí καί ń fi kún un jáde.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: ohun àpọ̀jù tí àwọn náà ní
  rationale: A tún lo ọ̀rọ̀ kan náà bíi ti àkọ́kọ́ láti pa ìṣọ̀kan àti ìbáramu ìrònú Pọ́ọ̀lù mọ́.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: lè dí àìní yín
  rationale: Ó sọ ìpèsè tí ó lè wáyé ní ọ̀nà ìdápadà, ó sì pa ìtumọ̀ gbólóhùn ète tí ó wà nínú Gíríìkì mọ́.
- source_word: ὅπως γένηται ἰσότης
  choice: kí ìdọ́gba lè wà
  rationale: ‘Ìdọ́gba’ ni ọ̀rọ̀ Yorùbá tó sún mọ́ ἰσότης jù; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ìpèsè tó dọ́gba pẹ̀lú àìní ni a ń sọ, kì í ṣe ohun ìní tó jẹ́ bákan náà pátápátá.
theological_decisions:
- issue: Ìtumọ̀ ἰσότης nínú ìpè Pọ́ọ̀lù sí fífúnni
  choice: ìdọ́gba nínú pípèsè fún àìní ara ẹni
  alternative: ìṣòdodo tàbí ìwọ̀ntúnwọ̀nsì
  rationale: Àyíká ọ̀rọ̀ náà dá lórí bí àwọn onígbàgbọ́ ṣe ń dí àìní ara wọn, kì í ṣe lórí èrò àwùjọ tí a yà sọ́tọ̀ kúrò nínú àyíká yìí. ‘Ìdọ́gba’ tẹ̀ lé Gíríìkì ní tààrà, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé dáàbò bo ìtumọ̀ rẹ̀ tó ní í ṣe pẹ̀lú ìpèsè tó yẹ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Dí àìní’ jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá fún pípèsè ohun tí ó kù; àtúnṣe ọ̀rọ̀ ‘ohun àpọ̀jù’ àti ‘àìní’ pa ìbáramu méjèèjì nínú Gíríìkì mọ́.
