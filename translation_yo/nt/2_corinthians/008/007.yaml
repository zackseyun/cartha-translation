id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n gẹ́gẹ́ bí ẹ ti pọ̀ yanturu nínú ohun gbogbo—nínú ìgbàgbọ́, ọ̀rọ̀ sísọ, ìmọ̀, gbogbo ìtara, àti ìfẹ́ tí ó ti ọ̀dọ̀ wa wá, tí ó sì wà nínú yín[a]—ẹ rí sí i pé kí ẹ sì tún pọ̀ yanturu nínú oore-ọ̀fẹ́ yìí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ìfẹ́ yín sí wa.” Gbólóhùn Gíríìkì náà ṣòro, àwọn ẹ̀dà àfọwọ́kọ kan sì kà á sí “ìfẹ́ yín tí ó wà nínú wa.”
    reason: alternative_reading
  - marker: b
    text: Èyí ni iṣẹ́ oore-ọ̀fẹ́ yìí ti fífúnni.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: ní ... lọ́pọ̀ yanturu
  rationale: Ọ̀rọ̀ yìí pa àwòrán ọ̀pọ̀lọpọ̀ àti àkúnwọ́sílẹ̀ mọ́, ó sì ṣeé lò lọ́nà kan náà ní ibi méjèèjì nínú ẹsẹ náà.
- source_word: ἐν παντί
  choice: ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbòòrò tí ó ṣáájú àkọsílẹ̀ àwọn ànímọ́ náà mọ́ láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ àdánidá nínú àkọsílẹ̀ àwọn ohun rere ti ìjọ ní.
- source_word: λόγῳ
  choice: ọ̀rọ̀ sísọ
  rationale: Nínú àyíká yìí, λόγος ṣeé ṣe kí ó tọ́ka sí agbára tàbí ẹ̀bùn sísọ; ‘ọ̀rọ̀ sísọ’ ṣe kedere ju ‘ọ̀rọ̀’ nìkan lọ.
- source_word: γνώσει
  choice: ìmọ̀
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédé pẹ̀lú àkọsílẹ̀ àwọn ànímọ́ ẹ̀mí.
- source_word: πάσῃ σπουδῇ
  choice: gbogbo ìtara
  rationale: ‘Ìtara’ mú èrò ìfọkànsìn, ìmúratán, àti ṣíṣe ohun tọkàntọkàn jáde ní èdè Yorùbá àdánidá.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: ìfẹ́ tí ó ti ọ̀dọ̀ wa wá, tí ó sì wà nínú yín
  rationale: Ìtumọ̀ yìí tẹ̀ lé àwọn gbólóhùn aṣáájú ἐξ ἡμῶν àti ἐν ὑμῖν, ó sì mọ̀ọ́mọ̀ kò yanjú gbólóhùn Gíríìkì tí ó ṣòro ju bí ẹ̀rí ṣe gba láàyè lọ.
- source_word: χάριτι
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ Pọ́ọ̀lù mọ́, nígbà tí àyíká àti àlàyé ìsàlẹ̀ fi hàn pé iṣẹ́ fífúnni ni ó ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká ọrẹ fún àwọn ènìyàn mímọ́ ní Jerusalẹmu
  choice: oore-ọ̀fẹ́
  alternative: iṣẹ́ fífúnni tí oore-ọ̀fẹ́ ń mú jáde; ẹ̀bùn
  rationale: Pọ́ọ̀lù lo ọ̀rọ̀ tó ní ìjìnlẹ̀ ju ọ̀rọ̀ owó lásán lọ. ‘Oore-ọ̀fẹ́’ pa ìjìnlẹ̀ yẹn mọ́, àlàyé ìsàlẹ̀ sì sọ ohun tí ó ń tọ́ka sí ní pàtó.
- issue: Bí a ṣe máa lóye τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: ìfẹ́ tí ó ti ọ̀dọ̀ wa wá, tí ó sì wà nínú yín
  alternative: ìfẹ́ yín sí wa
  rationale: Gbólóhùn Gíríìkì náà ṣòro, àwọn ẹ̀dà àfọwọ́kọ sì yàtọ̀. Ìtumọ̀ pàtàkì tẹ̀ lé ẹ̀dà SBLGNT, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀nà ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
