revisions:
- from: Ṣùgbọ́n gẹ́gẹ́ bí ẹ ti ní ohun gbogbo lọ́pọ̀ yanturu—ìgbàgbọ́, ọ̀rọ̀ sísọ, ìmọ̀, gbogbo ìtara, àti ìfẹ́ tí ó ti ọ̀dọ̀ wa wá, tí ó sì wà nínú yín[a]—ẹ rí sí i pé kí ẹ ní oore-ọ̀fẹ́ yìí lọ́pọ̀ yanturu pẹ̀lú[b].
  to: Ṣùgbọ́n gẹ́gẹ́ bí ẹ ti pọ̀ yanturu nínú ohun gbogbo—nínú ìgbàgbọ́, ọ̀rọ̀ sísọ, ìmọ̀, gbogbo ìtara, àti ìfẹ́ tí ó ti ọ̀dọ̀ wa wá, tí ó sì wà nínú yín[a]—ẹ rí sí i pé kí ẹ sì tún pọ̀ yanturu nínú oore-ọ̀fẹ́ yìí[b].
  rationale: Àtúnṣe náà jẹ́ ti èdè àti ìbáṣepọ̀ gírámà nìkan. Ó pa ìfẹ́ tí ó ‘ti ọ̀dọ̀ wa’ ‘nínú yín’ mọ́ gẹ́gẹ́ bí ẹ̀dà SBLGNT, kò sì yan ọkan nínú àwọn ìtumọ̀ tí a ń jiyàn sí. Ó tún pa χάρις mọ́ gẹ́gẹ́ bí ‘oore-ọ̀fẹ́,’ nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé ọ̀rọ̀ fífúnni nínú àyíká rẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:08Z'
