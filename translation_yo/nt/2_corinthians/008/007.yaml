  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé SBLGNT dáadáa ní gbogbo àwọn èrò pàtàkì: ọ̀pọ̀ yanturu nínú ohun gbogbo, àkọsílẹ̀ àwọn ànímọ́, ìfẹ́ ‘láti ọ̀dọ̀ wa’ ‘nínú yín,’ àti ìpè láti pọ̀ yanturu nínú χάρις náà. Síbẹ̀, ‘ní ... lọ́pọ̀ yanturu pẹ̀lú’ lè dà bí ‘ní i pẹ̀lú,’ dípò ‘pọ̀ yanturu nínú rẹ̀ náà’; a tún un ṣe kí ìbáṣepọ̀ ἐν ... περισσεύητε hàn kedere.'
