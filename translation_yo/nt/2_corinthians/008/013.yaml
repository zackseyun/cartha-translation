  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: yo
  text: Nítorí kì í ṣe pé kí àwọn ẹlòmíràn ní ìtura, kí ìpọ́njú sì wà fún ẹ̀yin, ṣùgbọ́n kí ìdọ́gba[a] wà—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣedéédé”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwọ̀ntúnwọ̀nsì tó bá òdodo mu, kì í ṣe dandan pé ohun ìní gbogbo ènìyàn gbọdọ̀ dọ́gba pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí èmi kò ní lọ́kàn
  rationale: “Nítorí” fi agbára àlàyé γάρ hàn; “kò ní lọ́kàn” sì sọ ìtumọ̀ ìfẹ́ tàbí ète tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ láìsọ ní tààrà.
- source_word: ἵνα
  choice: pé kí
  rationale: Àkójọpọ̀ yìí bá ọ̀nà tí Yorùbá gbà ń sọ ète tí a kọ̀ mu, ó sì yàgò fún títúmọ̀ gbolohun náà ní líle gẹ́gẹ́ bí “kí ó lè jẹ́ pé.”
- source_word: ἄλλοις
  choice: àwọn ẹlòmíràn
  rationale: Ó pa ìtumọ̀ aláìní ìdánimọ̀ pàtó ti ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìyàtọ̀ tó wà láàárín wọn àti “ẹ̀yin” mu.
- source_word: ἄνεσις
  choice: ìtura
  rationale: Nínú ọ̀rọ̀ ọrẹ àkójọ owó yìí, “ìtura” túmọ̀ sí dídín ẹrù tàbí ìhámọ́ kù, kì í ṣe ìtùnú ọkàn nìkan.
- source_word: ὑμῖν θλῖψις
  choice: kí ẹ̀yin sì kojú ìpọ́njú
  rationale: “Ìpọ́njú” sọ ẹrù àti ìṣòro tí fífúnni lè fà hàn; “kojú” mú gbólóhùn náà jẹ́ Yorùbá àdánidá láìyí ìtumọ̀ rẹ̀ padà.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: bí kò ṣe pé kí ìdọ́gba wà
  rationale: “Bí kò ṣe” mú ìtakora ἀλλά jáde, “ìdọ́gba” sì jẹ́ ọ̀rọ̀ tó ṣe kedere fún ἰσότης. Fífi “wà” kún un mú gbólóhùn elípsisì náà pé ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἰσότης nínú ọ̀rọ̀ pínpín ohun ìní
  choice: ìdọ́gba
  alternative: ìṣedéédé tàbí ìbágbépọ̀ tó bá ìdájọ́ òdodo mu
  rationale: “Ìdọ́gba” pa ọ̀rọ̀ pàtàkì Pọ́ọ̀lù mọ́ ní tààrà, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí ìwọ̀ntúnwọ̀nsì tó bá òdodo mu, kì í ṣe dandan pé kí gbogbo ènìyàn ní ohun tó dọ́gba pátápátá.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé lásán; a sì pa àmì ìtẹ̀síwájú ní òpin mọ́ nítorí pé èrò náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
