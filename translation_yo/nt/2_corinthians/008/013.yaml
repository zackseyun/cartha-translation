  source_fidelity: 'Ìtumọ̀ náà mú ìtakora tó wà nínú Gíríìkì náà dáadáa: ìtura fún àwọn ẹlòmíràn kò yẹ kí ó yọrí sí ìpọ́njú fún àwọn ará Kọ́ríńtì; ète náà ni ìdọ́gba. Síbẹ̀, “èmi kò ní lọ́kàn pé” jẹ́ ọ̀nà tí kò wọ́pọ̀ tó sì lè dà bí ẹni pé Pọ́ọ̀lù ń sọ ìmọ̀lára tàbí èrò kan ju ète tí ἵνα ń ṣàlàyé lọ. “Kì í ṣe pé ... ṣùgbọ́n ...” jẹ́ ìtumọ̀ Yorùbá tó péye síi fún ìkọ̀ ète náà.'
