  source_fidelity: Ìtumọ̀ náà gba ìbéèrè líle (μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν), ‘oore-ọ̀fẹ́’ fún χάρις, àti àwọn ẹni tí iṣẹ́ náà ń lọ sí wọn, mọ́. Síbẹ̀, ‘kí a fún àwọn ní’ sọ ìbéèrè náà di pé kí a fún wọn ní ohun kan, níbi tí Gíríìkì ti ń sọ ní pàtó nípa oore-ọ̀fẹ́/àǹfààní àti ìkópa nínú iṣẹ́ náà tí wọ́n ń bẹ̀ wá fún. ‘Yìí’ náà kò ní aṣojú nínú ọrọ̀ Gíríìkì.
  naturalness: ‘Fi ìbẹ̀bẹ̀ púpọ̀ bẹ̀ wá’ jẹ́ Yorùbá tí ó rọrùn, tí ó sì ní agbára tó yẹ. ‘Àjọpín nínú iṣẹ́ ìránṣẹ́’ ṣàlàyé ìbáṣepọ̀ genitive náà ní Yorùbá ní ti ara ju ‘àjọpín iṣẹ́ ìránṣẹ́’ lọ.
