source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: yo
  text: wọ́n fi ìbẹ̀bẹ̀ púpọ̀ bẹ̀ wá pé kí a jẹ́ kí wọ́n ní oore-ọ̀fẹ́ àti àjọpín nínú iṣẹ́ ìránṣẹ́ fún àwọn ẹni mímọ́—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àǹfààní àti kíkópa nínú iṣẹ́ ìránṣẹ́ fún àwọn ẹni mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: wọ́n fi ẹ̀bẹ̀ púpọ̀ ... gidigidi
  rationale: Ọ̀rọ̀ náà ń ṣàpèjúwe bí wọ́n ṣe bẹ̀bẹ̀ pẹ̀lú ìtara àti ìtẹnumọ́; ‘ẹ̀bẹ̀ púpọ̀’ àti ‘gidigidi’ mú agbára ọ̀rọ̀ Gíríìkì náà hàn ní Yorùbá àdánidá.
- source_word: δεόμενοι ἡμῶν
  choice: bẹ̀ wá gidigidi
  rationale: δέομαι túmọ̀ sí bẹ̀, bẹ̀bẹ̀, tàbí pàrọwà; ἡμῶν ni ẹni tí wọ́n ń bẹ̀, ìyẹn ‘wá.’
- source_word: τὴν χάριν
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ pa ọ̀rọ̀ pàtàkì Páùlù mọ́, bó tilẹ̀ jẹ́ pé ní àyíká yìí ó tún ní ìtumọ̀ àǹfààní tí a fi fún wọn.
- source_word: τὴν κοινωνίαν
  choice: àjọpín
  rationale: κοινωνία níbí tọ́ka sí kíkópa àti pípín pọ̀ nínú iṣẹ́ ìrànlọ́wọ́; ‘àjọpín’ mú ìṣe àti ìbáṣepọ̀ inú ọ̀rọ̀ náà pọ̀.
- source_word: τῆς διακονίας
  choice: iṣẹ́ ìránṣẹ́ yìí
  rationale: διακονία jẹ́ iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ ìrànlọ́wọ́. ‘Yìí’ jẹ́ àfikún Yorùbá àdánidá tí ó tọ́ka sí iṣẹ́ tí àyíká ẹsẹ̀ ń sọ̀rọ̀ rẹ̀.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: fún àwọn ẹni mímọ́
  rationale: εἰς fi ìdarí àti àǹfààní iṣẹ́ náà hàn; ‘àwọn ẹni mímọ́’ tú ἅγιοι ní gbangba láìdín un kù sí ẹgbẹ́ àrà ọ̀tọ̀ kan.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι
  choice: àwọn ẹni mímọ́
  alternative: àwọn ènìyàn mímọ́ Ọlọ́run
  rationale: ‘Àwọn ẹni mímọ́’ pa ìdánimọ̀ tí Páùlù ń lò fún àwọn onígbàgbọ́ mọ́, kò sì mú èrò pé àwọn ènìyàn kan ṣoṣo tí a ti yàn lẹ́yìn ikú ni.
- issue: Ìbáṣepọ̀ χάρις àti κοινωνία
  choice: oore-ọ̀fẹ́ àti àjọpín
  alternative: àǹfààní láti kópa
  rationale: A pa àwọn orúkọ méjèèjì àti ìfọ̀rọ̀ṣọ̀kan wọn mọ́, dípò kí a sọ wọ́n di èrò kan ṣoṣo; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ìtumọ̀ àyíká hàn.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘oore-ọ̀fẹ́’ fún χάρις, ‘àjọpín’ fún κοινωνία, àti ‘àwọn ẹni mímọ́’ fún ἅγιοι; àmì ìdádúró gígùn ní òpin ń pa ìtẹ̀síwájú gbolohun inú àyíká mọ́.
