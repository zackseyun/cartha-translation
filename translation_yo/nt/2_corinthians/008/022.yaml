id: 2CO.8.22
reference: 2 Corinthians 8:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: yo
  text: A sì ti rán arákùnrin wa pẹ̀lú wọn, ẹni tí a ti dán wò ní ọ̀pọ̀lọpọ̀ ìgbà nínú ọ̀pọ̀lọpọ̀ ọ̀ràn, tí a sì rí i pé ó jẹ́ onítara; ṣùgbọ́n ní báyìí, ó sì túbọ̀ ní ìtara gidigidi nítorí ìgbẹ́kẹ̀lé ńlá tí ó ní nínú yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ṣùgbọ́n ní báyìí, ó túbọ̀ ní ìtara gidigidi nípasẹ̀ ìgbẹ́kẹ̀lé ńlá tí ó ní nínú yín.” A lè lóye gbólóhùn Gíríìkì náà ní ọ̀nà tí ó yà díẹ̀, ṣùgbọ́n ìtumọ̀ lápapọ̀ ṣì ni pé ìtara rẹ̀ túbọ̀ pọ̀ nípa yín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: a sì ti rán ... pẹ̀lú wọn
  rationale: Aorist náà sọ nípa iṣẹ́ tí Pọ́ọ̀lù ṣe; ‘ti rán’ fi iṣẹ́ tí a parí tí ó sì ṣe pàtàkì sí ọ̀rọ̀ ìsinsìnyí hàn, ‘pẹ̀lú wọn’ sì ṣàfihàn σύν-.
- source_word: ἀδελφὸν ἡμῶν
  choice: arákùnrin wa
  rationale: Ó pa àkàwé ìdílé àwọn onígbàgbọ́ mọ́, ó sì bá akọ ẹyọ tí a ń tọ́ka sí mu.
- source_word: ἐδοκιμάσαμεν
  choice: ẹni tí a ti dán wò ... tí a sì rí i pé
  rationale: ‘Dán wò’ pa èrò ìdánwò mọ́, ‘tí a sì rí i pé’ sì mú èsì ìdánwò tí participle tó tẹ̀ lé ń fi hàn ṣe kedere ní Yorùbá.
- source_word: ἐν πολλοῖς πολλάκις
  choice: ní ọ̀pọ̀lọpọ̀ ìgbà nínú ọ̀pọ̀lọpọ̀ ọ̀ràn
  rationale: Ìtumọ̀ yìí pa ìṣe léraléra àti fífẹ̀ àwọn ipò tàbí ọ̀ràn tí ìdánwò náà kàn mọ́.
- source_word: σπουδαῖον ὄντα
  choice: ó jẹ́ onítara
  rationale: ‘Onítara’ lè sọ ìmúrasílẹ̀, àápọn, àti ìtara ẹni nínú iṣẹ́ láì dín ọ̀rọ̀ náà kù sí ìmọ̀lára nìkan.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: ṣùgbọ́n ní báyìí, ó túbọ̀ ní ìtara púpọ̀
  rationale: ‘Túbọ̀ ... púpọ̀’ mú agbára comparative σπουδαιότερον tí πολὺ ń tẹnumọ́ jáde ní èdè Yorùbá àdánidá.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: nítorí ìgbẹ́kẹ̀lé ńlá tí ó ní nínú yín
  rationale: Dative náà ṣeé kà gẹ́gẹ́ bí ìdí tàbí ohun èlò; ‘nítorí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ‘nínú yín’ sì tọ́ka ìgbẹ́kẹ̀lé náà sí àwọn ará Kọ́ríńtì.
theological_decisions:
- issue: Ẹni tí πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς ń tọ́ka sí àti bí a ṣe lóye rẹ̀
  choice: Ìtara arákùnrin náà túbọ̀ pọ̀ nítorí ìgbẹ́kẹ̀lé ńlá tí òun fúnra rẹ̀ ní nínú àwọn ará Kọ́ríńtì.
  alternative: Ó lè jẹ́ ìgbẹ́kẹ̀lé Pọ́ọ̀lù nínú àwọn ará Kọ́ríńtì, tàbí a lè lóye ọ̀rọ̀ náà gẹ́gẹ́ bí ìgboyà sí wọn.
  rationale: Ìsopọ̀ gírámà tó sún mọ́ jù lọ mú kí gbólóhùn náà ṣàlàyé ìtara arákùnrin aláìlórúkọ náà. A kò fi ẹ̀kọ́ ìsìn mìíràn kún un, àlàyé ìsàlẹ̀ sì pa ààyè díẹ̀ sílẹ̀ fún ọ̀nà mìíràn tí a lè gbà lóye Gíríìkì náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa àkàwé Kristẹni ‘arákùnrin wa’ mọ́.
