id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: yo
  text: Nítorí bí ìmúratán[a] bá wà, ó ṣeé tẹ́wọ́ gbà ní ìbámu pẹ̀lú ohun tí ẹnì kan bá ní[b], kì í ṣe ní ìbámu pẹ̀lú ohun tí kò ní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìtara” tàbí “ìfẹ́ inú.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ní ìbámu pẹ̀lú ohunkóhun tí ẹnì kan bá ní … kì í ṣe ní ìbámu pẹ̀lú ohun tí kò ní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: ìmúratán
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọkàn tí ó múra tán, tí ó sì fẹ́ láti ṣe ohun kan. “Ìmúratán” bá ọ̀rọ̀ ọrẹ àtinúwá inú àyíká yìí mu, láìfi ìtumọ̀ míì kún un.
- source_word: πρόκειται
  choice: bá wà
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà túmọ̀ sí pé ìmúratán náà wà níbẹ̀ tàbí ó ti ṣe tán, kì í ṣe pé a gbé e kalẹ̀ ní ti ara.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ní ìbámu pẹ̀lú ohun tí ẹnì kan bá ní
  rationale: Èyí pa ìtumọ̀ ìwọ̀n tàbí ọ̀pá ìdíwọ̀n tí a gbé karí ohun tí ó wà lọ́wọ́ ẹni mọ́. “Ẹnì kan” jẹ́ ọ̀nà àdánidá láti sọ ẹni lápapọ̀ láìfi akọ tàbí abo kún ọ̀rọ̀ náà.
- source_word: εὐπρόσδεκτος
  choice: ó jẹ́ ìtẹ́wọ́gbà
  rationale: “Ìtẹ́wọ́gbà” fi hàn pé a lè gba ohun náà dáadáa, ṣùgbọ́n kò pinnu ẹni tí ó ń gbà á, bí Gíríìkì náà kò ṣe sọ ọ́ ní pàtó.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: kì í ṣe ní ìbámu pẹ̀lú ohun tí kò ní
  rationale: Èyí pa ìfarawé àti ìyàtọ̀ tó wà láàárín ohun tí ẹni ní àti ohun tí kò ní mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” pa ipa àlàyé γὰρ mọ́, “bí” sì pa ipò àdéhùn εἰ mọ́.
theological_decisions:
- issue: Ẹni tí ìtẹ́wọ́gbà náà wà níwájú rẹ̀
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí “ó jẹ́ ìtẹ́wọ́gbà,” láìsọ ẹni tí ó ń gba á.
  alternative: “Ó jẹ́ ìtẹ́wọ́gbà níwájú Ọlọ́run” tàbí “àwọn onígbàgbọ́ yóò tẹ́wọ́ gbà á.”
  rationale: εὐπρόσδεκτος fi ìtẹ́wọ́gbà hàn, ṣùgbọ́n ẹsẹ náà kò dárúkọ Ọlọ́run, ìjọ, tàbí ẹni mìíràn gẹ́gẹ́ bí ẹni tí ó ń gba ohun náà. Ìtumọ̀ náà kò yanju ohun tí orísun fi sílẹ̀ ní àìsọ pàtó.
translation_notes:
  register: Èdè Yorùbá àgbéléwò, ọ̀wọ̀, àti èyí tí ó ṣe kedere ni a lò. A lo “ìmúratán” fún ìfẹ́ inú tí ó ti múra sí ṣíṣe, “ní ìbámu pẹ̀lú” sì ń pa èrò ìwọ̀n ohun tí ẹni ní mọ́. Àmì ohùn àti àmì abẹ́lẹ̀ ni a fi sí ibi tí ó yẹ.
