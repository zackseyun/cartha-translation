id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: yo
  text: Ẹ̀yin ará[a], a sì ń jẹ́ kí ẹ mọ̀ oore-ọ̀fẹ́ Ọlọ́run[b] tí a ti fi fún àwọn ìjọ ní Makedóníà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ‘àwọn arákùnrin,’ ṣùgbọ́n a sábà máa ń lò ó fún gbogbo ìjọ, títí kan àwọn arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: ‘Oore-ọ̀fẹ́ Ọlọ́run’ lè tọ́ka sí ojúrere Ọlọ́run àti sí ọ̀làwọ́ tí ojúrere náà mú jáde nínú àwọn ìjọ Makedóníà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: a ń jẹ́ kí ẹ mọ
  rationale: Ó túmọ̀ sí ‘a ń sọ di mímọ̀ fún yín’ tàbí ‘a ń fi tó yín létí.’ Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ àti ohùn lẹ́tà náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àmì ìyípadà ọ̀rọ̀ pẹ̀lẹ́, kì í ṣe àtakò líle níbí. ‘Sì’ so ẹsẹ̀ náà mọ́ àyíká rẹ̀ láìfi ọ̀rọ̀ ìgbà bí ‘nísinsìnyí’ kún un.
- source_word: ὑμῖν
  choice: ẹ
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; ‘ẹ’ bá ọ̀rọ̀ tí a ń sọ fún gbogbo ìjọ mu.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n nínú àwọn lẹ́tà Paulu ó sábà máa ń tọ́ka sí gbogbo àwọn onígbàgbọ́. ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì lè kó ọkùnrin àti obìnrin sínú.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: '‘Oore-ọ̀fẹ́’ pa ìtumọ̀ ọ̀rọ̀ pàtàkì χάρις mọ́: ojúrere Ọlọ́run àti iṣẹ́ inú-rere tí ojúrere náà ń mú jáde. A kò dín un kù sí ‘ẹ̀bùn’ tàbí ‘ọ̀làwọ́’ nìkan.'
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ náà di ‘oore-ọ̀fẹ́ Ọlọ́run,’ èyí tó tẹ̀lé genitive Gíríìkì ní ọ̀nà àdánidá ní Yorùbá.
- source_word: τὴν δεδομένην
  choice: tí a ti fi fún
  rationale: '‘A ti fi fún’ ṣe àfihàn perfect passive: ohun tí a ti fi fún wọn tẹ́lẹ̀, tí àbájáde rẹ̀ sì ṣì wà.'
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: àwọn ìjọ ní
  rationale: Ní àyíká yìí, ἐν fi ibi tàbí àgbègbè tí oore-ọ̀fẹ́ náà ti ń ṣiṣẹ́ hàn. ‘Àwọn ìjọ ní Makedóníà’ jẹ́ Yorùbá tó rọrùn, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ náà tún lè jẹ́ oore-ọ̀fẹ́ tí a fi fún àwọn ìjọ wọ̀nyẹn.
- source_word: τῆς Μακεδονίας
  choice: Makedóníà
  rationale: Ó dá orúkọ agbègbè Makedonia mọ́, ó sì darapọ̀ mọ́ ‘àwọn ìjọ ní’ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ‘oore-ọ̀fẹ́ Ọlọ́run’ ní àyíká yìí
  choice: Iṣẹ́ oore-ọ̀fẹ́ Ọlọ́run láàárín àwọn ìjọ Makedóníà, pẹ̀lú ọ̀làwọ́ tí ó mú jáde
  alternative: Kí a túmọ̀ rẹ̀ sí ẹ̀bùn ìrànlọ́wọ́ náà nìkan, tàbí sí ojúrere Ọlọ́run ní gbogbogbòò
  rationale: Ọ̀rọ̀ Paulu lè tọ́ka lẹ́ẹ̀kan náà sí orísun—oore-ọ̀fẹ́ Ọlọ́run—àti èso rẹ̀—ìfúnni pẹ̀lú ọ̀làwọ́. Ìtumọ̀ náà pa méjèèjì mọ́ láìyanju ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ náà lọ́nà kan ṣoṣo.
translation_notes:
  register: 'Èdè náà jẹ́ Yorùbá àมาตรฐาน? '
