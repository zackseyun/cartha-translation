id: 2CO.8.6
reference: 2 Corinthians 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: yo
  text: Nítorí náà, a rọ Títù kí, gẹ́gẹ́ bí ó ti bẹ̀rẹ̀ tẹ́lẹ̀, ó tún parí iṣẹ́ oore-ọ̀fẹ́ yìí[a] láàárín yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ ìfẹ́-rere yìí”; ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀, “oore-ọ̀fẹ́ yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: rọ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí fífi taratara ní kí Títù ṣe ohun kan; “rọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò rọ̀ ju bẹ́ẹ̀ lọ, tí kò sì le ju ìtumọ̀ Gíríìkì lọ.
- source_word: Τίτον
  choice: Títù
  rationale: A lo ìkọ̀wé orúkọ yìí gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Bíbélì Yorùbá, pẹ̀lú àmì ohùn.
- source_word: καθὼς προενήρξατο
  choice: gẹ́gẹ́ bí ó ti bẹ̀rẹ̀ tẹ́lẹ̀
  rationale: Èyí pa ìtumọ̀ pé ó ti bẹ̀rẹ̀ iṣẹ́ náà ṣáájú mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἐπιτελέσῃ
  choice: kí ó tún parí
  rationale: Ìlànà ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń fi ohun tí ìrọ̀ náà fẹ́ mú ṣẹ hàn; “kí ó tún parí” tún pa καί àti ìtumọ̀ mímú iṣẹ́ dé òpin mọ́.
- source_word: εἰς ὑμᾶς
  choice: láàárín yín
  rationale: Níhìn-ín, gbólóhùn náà tọ́ka sí iṣẹ́ tí Títù yóò ṣe ní àárín ìjọ Kọ́ríńtì; “láàárín yín” mú ìtumọ̀ yìí jáde lọ́nà àdánidá.
- source_word: τὴν χάριν ταύτην
  choice: iṣẹ́ oore-ọ̀fẹ́ yìí
  rationale: χάρις ní àyíká 2 Kọ́ríńtì 8 tọ́ka sí iṣẹ́ ìkójọ ọrẹ fún àwọn ènìyàn mímọ́, ṣùgbọ́n ó tún ń pe iṣẹ́ náà ní oore-ọ̀fẹ́. “Iṣẹ́ oore-ọ̀fẹ́” pa ìṣe gidi àti èdè ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká ìkójọ ọrẹ
  choice: “iṣẹ́ oore-ọ̀fẹ́” tó ń tọ́ka sí iṣẹ́ ìrànlọ́wọ́ àti ọrẹ náà
  alternative: “oore-ọ̀fẹ́ yìí” ní ìtumọ̀ tó gbooro, tàbí “ẹ̀bùn yìí”
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń sọ̀rọ̀ nípa ìkójọ ọrẹ àti ipa Títù nínú píparí rẹ̀. Ìtumọ̀ yìí jẹ́ kí iṣẹ́ gidi náà ṣe kedere, láìsọ èrò oore-ọ̀fẹ́ tó wà nínú χάρις nù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Nítorí náà” fi àbájáde tó wà nínú εἰς τὸ hàn lọ́nà àdánidá; a sì pa ìbáṣepọ̀ ìrọ̀, ìbẹ̀rẹ̀ tẹ́lẹ̀, àti píparí iṣẹ́ náà mọ́.
