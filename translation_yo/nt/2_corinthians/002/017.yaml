id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: yo
  text: Nítorí àwa kì í ṣe bí àwọn ọ̀pọ̀ ènìyàn[a] tí ń fi ọ̀rọ̀ Ọlọ́run ṣòwò[b]; ṣùgbọ́n gẹ́gẹ́ bí ẹni tí ó ń sọ̀rọ̀ láti inú òtítọ́ ọkàn[c], gẹ́gẹ́ bí ẹni tí ó ti ọ̀dọ̀ Ọlọ́run wá, níwájú Ọlọ́run[d], nínú Mèsáyà[e] ni à ń sọ̀rọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí ‘àwọn ọ̀pọ̀ náà,’ ‘ọ̀pọ̀ jù lọ,’ tàbí ‘ọ̀pọ̀lọpọ̀ àwọn ẹlòmíràn.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà lè ní ìtumọ̀ ṣíṣòwò rẹ̀ fún èrè ara ẹni, tàbí dída ọ̀rọ̀ náà dàpọ̀ tàbí bàjẹ́ kí ó lè tà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘pẹ̀lú òtítọ́ ọkàn’ tàbí ‘láti inú ète mímọ́.’
    reason: lexical_alternative
  - marker: d
    text: Tàbí ‘ní ojú Ọlọ́run’ tàbí ‘níwájú rẹ̀ níbi tí ó wà.’
    reason: lexical_alternative
  - marker: e
    text: 'Ìtumọ̀ ìbílẹ̀: ‘nínú Kristi.’'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πολλοί
  choice: ọ̀pọ̀ ènìyàn
  rationale: Èyí mú ìtumọ̀ ‘àwọn ọ̀pọ̀’ jáde ní Yorùbá àdánidá, láì sọ pé ó dájú pé ‘ọ̀pọ̀ jù lọ’ ni.
- source_word: καπηλεύοντες
  choice: tí ń fi ọ̀rọ̀ Ọlọ́run ṣòwò
  rationale: Gbólóhùn yìí pa àwòrán oníṣòwò mọ́, ó sì lè tọ́ka sí lílo ọ̀rọ̀ náà fún èrè ara ẹni láìfi ìtumọ̀ ‘dída a pò’ lé e lórí gẹ́gẹ́ bí ohun kan ṣoṣo.
- source_word: λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ọ̀wọ̀, tí ó sì wọ́pọ̀ fún ìsopọ̀ ọ̀rọ̀ Gíríìkì náà.
- source_word: ἐξ εἰλικρινείας
  choice: ti inú òtítọ́ ọkàn
  rationale: Ó pa èrò orísun tàbí ohun tí ọ̀rọ̀ náà ti inú rẹ̀ jáde mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere fún ìwà àìṣẹ̀tàn.
- source_word: ἐκ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Èyí fi Ọlọ́run hàn gẹ́gẹ́ bí orísun ọ̀rọ̀ náà, láìfi ọ̀rọ̀ àlàyé bí ‘rán’ kún un.
- source_word: κατέναντι θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó sọ ìwà ní ojú Ọlọ́run àti jíjẹ́ ẹni tí yóò jíhìn níwájú rẹ̀ ní ṣókí.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: A tú Χριστός sí oyè rẹ̀, ‘Mèsáyà,’ nítorí pé ìtumọ̀ oyè náà ṣì ń ṣiṣẹ́ nínú gbólóhùn yìí.
- source_word: λαλοῦμεν
  choice: à ń sọ̀rọ̀
  rationale: Ó bá ìṣe tí ń lọ lọ́wọ́ mu, kò sì gbé e ga sí ‘à ń kéde,’ èyí tí yóò túmọ̀ sí ohun tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Bí a ṣe tú Χριστῷ nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni àmì òróró náà jáde, nígbà tí ‘Kristi’ jẹ́ ọ̀nà ìbílẹ̀ tí ó dà bí orúkọ. Àṣàyàn yìí kò yí ẹni tí a ń tọ́ka sí padà.
- issue: Ìbáṣepọ̀ ἐξ εἰλικρινείας àti ἐκ θεοῦ
  choice: 'A pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí orísun ọ̀rọ̀: inú òtítọ́ ọkàn àti ọ̀dọ̀ Ọlọ́run.'
  alternative: pẹ̀lú òtítọ́ ọkàn, gẹ́gẹ́ bí àwọn tí Ọlọ́run rán
  rationale: Èyí yẹra fún fífi ‘rán’ kún ẹsẹ̀ náà, ó sì pa ìfararọ̀ àwọn gbólóhùn Gíríìkì méjèèjì mọ́ bó ti lè ṣeé ṣe nínú Yorùbá àdánidá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní ọlá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn wà níbi tí ó yẹ. A pín ọ̀rọ̀ náà sí gbólóhùn méjì láti mú àtakò Paulu yé kedere, ṣùgbọ́n a pa ìtẹnumọ́ orísun ọ̀rọ̀ rẹ̀—òtítọ́ ọkàn àti Ọlọ́run—mọ́.
