id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: yo
  text: Nígbà tí mo dé Tíróásì fún ìhìn rere Mèsáyà[a], tí a sì ti ṣí ilẹ̀kùn sílẹ̀ fún mi nínú Olúwa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìhìn rere Kristi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “tí ilẹ̀kùn sì ṣí sílẹ̀ fún mi nínú Olúwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Nígbà tí mo dé
  rationale: Aorist participle náà ń fi àkókò ìṣẹ̀lẹ̀ hàn; “Nígbà tí mo dé” jẹ́ Yorùbá àdánidá. A kò fi δέ ṣe àfikún ọ̀rọ̀ ìyípadà lọ́tọ̀, nítorí ìṣètò gbólóhùn náà àti “sì” ń gbé ìsopọ̀ rẹ̀.
- source_word: εἰς τὴν Τρῳάδα
  choice: dé Tíróásì
  rationale: “Dé” jẹ́ ọ̀nà àdánidá láti sọ ìrìn dé ibi kan ní Yorùbá; Tíróásì ni àkọsílẹ̀ orúkọ ibẹ̀.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: nítorí ìhìn rere
  rationale: εἰς níbí ń tọ́ka sí ète tàbí ohun tí ìrìn náà dá lé. “Nítorí ìhìn rere” kò fi ọ̀rọ̀ “láti wàásù” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́. Ìbáṣepọ̀ genitive náà ni a pa mọ́ nínú “ìhìn rere Mèsáyà,” láì pinnu bóyá ó túmọ̀ sí ti Mèsáyà tàbí nípa Mèsáyà.
- source_word: θύρας
  choice: ilẹ̀kùn
  rationale: A pa àwòrán ilẹ̀kùn tí Pọ́ọ̀lù lò mọ́, dípò yíyí i padà sí “àǹfààní.”
- source_word: ἀνεῳγμένης
  choice: tí a sì ti ṣí … sílẹ̀
  rationale: Ìṣe aláìlórúkọ “a” pa passive mọ́, “ti” sì fi hàn pé ìṣí náà ti ṣẹlẹ̀, ipò rẹ̀ sì ń bá a lọ.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì sọ ọ́ di “láti ọwọ́ Olúwa,” èyí tí yóò fi ìtumọ̀ irinṣẹ́ tàbí olùṣe múlẹ̀ ju Gíríìkì lọ.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí Χριστός ní agbára oyè ní àyíká yìí, “Mèsáyà” ni a yàn; àlàyé ìsàlẹ̀ fi “Kristi” hàn gẹ́gẹ́ bí ìtumọ̀ àṣà mìíràn.
- issue: Ìtumọ̀ ἐν κυρίῳ
  choice: nínú Olúwa
  alternative: láti ọwọ́ Olúwa
  rationale: “Nínú Olúwa” pa àìdánilójú ìbáṣepọ̀ preposition náà mọ́; “láti ọwọ́ Olúwa” lè dá Olúwa mọ́ gẹ́gẹ́ bí olùṣe ìṣí ilẹ̀kùn, ohun tí ọ̀rọ̀ Gíríìkì kò fi dandan múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye. A fi àmì ohùn sí ibi tí ó bá yẹ. Kọ́mà ìparí fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
