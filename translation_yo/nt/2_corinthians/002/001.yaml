  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: yo
  text: Nítorí mo pinnu nínú ara mi pé kí n má tún wá sọ́dọ̀ yín nínú ìbànújẹ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìbànújẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: mo pinnu
  rationale: Ọ̀rọ̀ náà níbí ń tọ́ka sí ìpinnu tí Pọ́ọ̀lù ti ṣe lẹ́yìn ìrònú; “mo pinnu” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì pa agbára ìpinnu náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tí ó ṣáájú gẹ́gẹ́ bí àlàyé ìdí; “Nítorí” fi ìbáṣepọ̀ náà hàn kedere.
- source_word: ἐμαυτῷ
  choice: fún ara mi
  rationale: Dative reflexive náà fi hàn pé Pọ́ọ̀lù fúnra rẹ̀ ṣe ìpinnu náà; “fún ara mi” tẹ̀lé ìtumọ̀ yẹn láìfi ohun mìíràn kún un.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ohun tí infinitive tí ó tẹ̀ lé ṣàlàyé; àmì méjì ṣe ìbáṣepọ̀ yẹn kedere.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: pé kí n má ṣe ... wá
  rationale: Èyí sọ àkóónú ìpinnu náà ní Yorùbá àdánidá, nígbà tí ó pa ìṣòdì “má ṣe” mọ́.
- source_word: πάλιν
  choice: tún
  rationale: “Tún” fi ìṣe tí yóò tún ṣẹlẹ̀ hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: ἐν λύπῃ
  choice: pẹ̀lú ìbànújẹ́
  rationale: λύπη lè túmọ̀ sí ìbànújẹ́, ìrora ọkàn, tàbí ìbànújẹ́ tí ìbẹ̀wò náà mú wá; “pẹ̀lú ìbànújẹ́” jẹ́ àdánidá, ṣùgbọ́n a fi àṣàyàn “nínú ìbànújẹ́” sínú àlàyé ìsàlẹ̀ láti pa àìdánilójú ìbáṣepọ̀ preposition mọ́.
- source_word: πρὸς ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe wíwá, “sọ́dọ̀ yín” jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìlọ sí ọ̀dọ̀ àwọn ènìyàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà pa ìṣètò ìpinnu Pọ́ọ̀lù mọ́, ṣùgbọ́n ó lo “pé kí n má ṣe” kí ó lè dun bí Yorùbá àdánidá.
