id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: yo
  text: Mi ò rí ìsinmi nínú ẹ̀mí mi, nítorí mi ò rí Títù, arákùnrin mi[a]; ṣùgbọ́n lẹ́yìn tí mo dágbére fún wọn[b], mo lọ sí Makedóníà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin mi” túmọ̀ sí pé Títù jẹ́ onígbàgbọ́ ẹlẹgbẹ́ Páùlù àti alábàáṣiṣẹ́ rẹ̀.
    reason: cultural_note
  - marker: b
    text: Tàbí, “lẹ́yìn tí mo porọ́ sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: Èmi kò ní
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ perfect, ṣùgbọ́n nínú ìtàn yìí ó ń ṣàpèjúwe ipò Páùlù ní àkókò tó ṣáájú ìrìn rẹ̀; ìṣe àtẹ̀yìnwá Yorùbá yìí jẹ́ ti ẹ̀dá, kò sì fi ìtumọ̀ míì kún un.
- source_word: ἄνεσιν
  choice: ìsinmi
  rationale: “Ìsinmi” bójú mu ìtumọ̀ àìbalẹ̀ ọkàn inú, ó sì pa àwòrán ọ̀rọ̀ orísun mọ́ ju “ìtura” lọ.
- source_word: τῷ πνεύματί μου
  choice: nínú ẹ̀mí mi
  rationale: Dative náà lè tọ́ka sí ibi tàbí sí ẹni tí ipò náà kan. “Nínú ẹ̀mí mi” pa ìhà inú ẹni mọ́ láì pinnu bóyá ẹ̀mí ènìyàn ni tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: nítorí èmi kò rí Títù
  rationale: Articular infinitive pẹ̀lú μή sọ ìdí àìní ìsinmi náà; “nítorí” mú ìbáṣepọ̀ yẹn hàn ní Yorùbá tó ṣe kedere.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: Títù arákùnrin mi
  rationale: “Arákùnrin mi” pa àfiwé ìdílé àti ìfẹ́ inú ọ̀rọ̀ Páùlù mọ́; àlàyé ìtumọ̀ rẹ̀ gẹ́gẹ́ bí onígbàgbọ́ àti alábàáṣiṣẹ́ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: lẹ́yìn tí mo dágbére fún wọn
  rationale: Aorist participle náà tọ́ka sí kíkí wọn nígbà ìyapa. “Dágbére fún wọn” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání, tí ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mu.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: mo lọ sí Makedóníà
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìrìn àjò sí ibi kan, láì fi ìtumọ̀ tí “jáde” lè mú wá kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ “ẹ̀mí mi”
  choice: Pa á mọ́ gẹ́gẹ́ bí “nínú ẹ̀mí mi.”
  alternative: “fún ẹ̀mí mi” tàbí “nínú ọkàn mi”
  rationale: Ọ̀rọ̀ πνεῦμα níbí lè tọ́ka sí ìwà inú Páùlù, ṣùgbọ́n yíyí i sí “ọkàn” yóò túmọ̀ rẹ̀ ju bí orísun ṣe ṣe lọ. “Ẹ̀mí” pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtẹnumọ́ “Èmi” ní ìbẹ̀rẹ̀ àti lẹ́yìn “nítorí” mú ìṣàn gbolohun kedere, nígbà tí “dágbére” pa ìwọ̀ntúnwọ̀nsì ìforúkọsílẹ̀ mọ́.
