revisions:
- from: Ẹnikẹ́ni tí ẹ bá dárí ohunkóhun jì, èmi náà dárí rẹ̀ jì. Nítorí ohun tí mo ti dárí jì—bí mo bá ti dárí ohunkóhun jì—nítorí tiyín ni mo ṣe dárí rẹ̀ jì níwájú Mèsáyà.[a]
  to: Ẹnikẹ́ni tí ẹ bá dárí jì fún un ní ohunkóhun, èmi náà ń dárí jì fún un. Nítorí ohun tí mo ti dárí jì—bí mo bá ti dárí jì ní ohunkóhun—mo ṣe bẹ́ẹ̀ nítorí yín níwájú Mèsáyà.[a]
  rationale: A ṣàtúnṣe ìsọ̀rọ̀ ìdáríjì sí ìlò Yorùbá tó dá ẹni tí a dárí jì fún àti ohun tí a dárí jì hàn. A tún fi “mo ṣe bẹ́ẹ̀” sí ìpín tó kẹ́yìn kí ó lè tọ́ka sí ìdáríjì tí ó ti parí, láìfi ohun tí a dárí jì sílẹ̀ ní ìdààmú. A kò yí ìtumọ̀ tàbí àìdájú ἐν προσώπῳ Χριστοῦ padà.
