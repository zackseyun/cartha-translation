  source_fidelity: Ìtumọ̀ náà tẹ̀lé ìtumọ̀ àkọ́kọ́ ti χαρίζομαι gẹ́gẹ́ bí ìdáríjì, ó sì pa àgbékalẹ̀ ìfọ̀rọ̀wérọ̀ Pọ́ọ̀lù mọ́. Ṣùgbọ́n ìlò “dárí ohunkóhun jì” àti “dárí rẹ̀ jì” kò ṣàfihàn ìbáṣepọ̀ ẹni tí a dárí jì fún àti ohun tí a dárí jì ní Yorùbá dáadáa. Àtúnṣe náà lo “dárí jì fún un ní ohunkóhun” fún ẹni àti ohun náà, ó sì mú ìṣe tí ó parí nínú κεχάρισμαι hàn ní apá kejì.
