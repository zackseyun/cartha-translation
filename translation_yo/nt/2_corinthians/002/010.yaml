id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: yo
  text: Ẹnikẹ́ni tí ẹ bá dárí jì fún un ní ohunkóhun, èmi náà ń dárí jì fún un. Nítorí ohun tí mo ti dárí jì—bí mo bá ti dárí jì ní ohunkóhun—mo ṣe bẹ́ẹ̀ nítorí yín níwájú Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí aṣojú Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ ... χαρίζεσθε
  choice: Ẹnikẹ́ni tí ẹ bá dárí ... jì
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ìdáríjì dé bá; àyíká ọ̀rọ̀ ìbáwí àti ìmúpadàbọ̀sípò mú kí “dárí jì” jẹ́ ìtumọ̀ àdánidá jù lọ.
- source_word: τι
  choice: ohunkóhun
  rationale: Ó pa ìtumọ̀ tí kò fi ohun kan pàtó hàn mọ́, ó sì bá ìṣètò ọ̀rọ̀ onífẹ̀ẹ́sẹ̀mulẹ̀ náà mu.
- source_word: κἀγώ
  choice: èmi náà dárí rẹ̀ jì
  rationale: Ó mú ìtumọ̀ “èmi pẹ̀lú” jáde ní Yorùbá tó ṣe kedere, láìsọ ohun tí Pọ́ọ̀lù ṣe di òmíràn.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: ohun tí mo ti dárí jì—bí mo bá ti dárí ohunkóhun jì—
  rationale: Ó pa gbólóhùn àárín tí Pọ́ọ̀lù fi dín ipa ara rẹ̀ kù àti ìfẹ̀ẹ́sẹ̀mulẹ̀ rẹ̀ mọ́, láìṣe àlàyé lé e lórí.
- source_word: δι’ ὑμᾶς
  choice: nítorí tiyín
  rationale: Ó fi hàn pé ó ṣe é fún àǹfààní àti ire àwọn ará Kọ́ríńtì.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: níwájú Mèsáyà
  rationale: “Níwájú” sọ ìṣe tí a ṣe ní ojú tàbí ní ìwàláàyè ẹni kan ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa ìtumọ̀ míì, “gẹ́gẹ́ bí aṣojú Mèsáyà,” mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A túmọ̀ oyè Χριστός sí “Mèsáyà” dípò lílo “Kristi” bí ẹni pé orúkọ lásán ni.
theological_decisions:
- issue: Bóyá ἐν προσώπῳ Χριστοῦ túmọ̀ sí ṣíṣe ohun kan níwájú Mèsáyà tàbí gẹ́gẹ́ bí aṣojú rẹ̀
  choice: níwájú Mèsáyà
  alternative: gẹ́gẹ́ bí aṣojú Mèsáyà
  rationale: πρόσωπον lè túmọ̀ sí ojú, ìwàláàyè, tàbí ẹni/aṣojú. Àyípadà àkọ́kọ́ jẹ́ èdè Yorùbá àdánidá, ṣùgbọ́n a kò pa ìtumọ̀ kejì rẹ́; a fi í sínú àlàyé ìsàlẹ̀.
- issue: Bóyá Χριστός yẹ kí ó jẹ́ oyè tàbí orúkọ bí “Kristi”
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí kò sí ohun tó fi dandan mú kí a ka a sí orúkọ; “Mèsáyà” pa agbára oyè Gíríìkì náà mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, “èmi náà” fún ìtẹnumọ́ κἀγώ, àti àmì gígùn láti pa gbólóhùn àárín Gíríìkì mọ́.
