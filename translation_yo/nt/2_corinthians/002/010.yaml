  terminology: “Dárí jì” yẹ fún χαρίζομαι nínú àyíká ìmúpadàbọ̀sípò yìí. “Mèsáyà” pa ipa oyè Χριστός mọ́. “Níwájú Mèsáyà” jẹ́ ìtumọ̀ tó ṣeé gbà fún ἐν προσώπῳ Χριστοῦ; a pa ìtumọ̀ mìíràn, ìyẹn ṣíṣe gẹ́gẹ́ bí aṣojú rẹ̀, mọ́ nínú àlàyé ìsàlẹ̀.
