translation_notes:
  register: Èdè Yorùbá boṣewa, tó mọ́, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘fi ìfẹ́ yín sí i múlẹ̀’ láti yàgò fún ìtumọ̀ pé kí wọ́n kàn tún nífẹ̀ẹ́ rẹ̀ nínú ọkàn; ó tọ́ka sí ìgbésẹ̀ tí yóò fi ìfẹ́ náà hàn kedere.
