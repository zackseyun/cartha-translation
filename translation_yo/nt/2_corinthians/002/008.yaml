  text: Therefore I urge you to confirm your love for him.
translation:
  language: yo
  text: Nítorí náà, mo rọ̀ yín pé kí ẹ fìdí ìfẹ́ yín sí i múlẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: Nítorí náà
  rationale: Ó ṣe àfihàn ìyọrísí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ.
- source_word: παρακαλῶ ὑμᾶς
  choice: mo rọ̀ yín
  rationale: Nínú àyíká yìí, παρακαλέω túmọ̀ sí fífi tọkàntọkàn rọ àwọn olùgbọ́ láti ṣe ohun kan.
- source_word: κυρῶσαι
  choice: kí ẹ ... múlẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ fífi ohun kan fìdí múlẹ̀ tàbí jẹ́rìí rẹ̀ ní gbangba; ‘múlẹ̀’ jẹ́ èdè Yorùbá àdánidá tó pa agbára ọ̀rọ̀ náà mọ́.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: ìfẹ́ yín sí i
  rationale: Ó sọ ìfẹ́ tí wọ́n ní sí ọkùnrin náà; fífi arọ́pò-orúkọ ohun-ìní ‘yín’ hàn jẹ́ ohun tí gbolohun Yorùbá ń béèrè ní ti ẹ̀dá, bó tilẹ̀ jẹ́ pé ó wà nínú ọ̀rọ̀ Gíríìkì nípa ìtumọ̀.
