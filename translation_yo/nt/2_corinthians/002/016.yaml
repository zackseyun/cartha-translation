id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: yo
  text: Fún àwọn kan, ó jẹ́ òórùn láti inú ikú sí ikú; ṣùgbọ́n fún àwọn ẹlòmíràn, ó jẹ́ òórùn láti inú ìyè sí ìyè.[a][b] Ta sì ni ó tó fún àwọn nǹkan wọ̀nyí?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Òórùn” tún lè jẹ́ “ìtùrá” tàbí “ohun tí imú ń gbọ́” ní ibi méjèèjì tí ὀσμή ti fara hàn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn gbólóhùn náà, “láti inú ikú sí ikú” àti “láti inú ìyè sí ìyè,” lè sọ orísun àti àbájáde (“láti inú ikú tí ó ń yọrí sí ikú” / “láti inú ìyè tí ó ń yọrí sí ìyè”), tàbí wọ́n lè jẹ́ ọ̀nà ìfàsíwájú láti fi ìwà ikú àti ìyè hàn.
    reason: alternative_reading
  - marker: c
    text: Tàbí “tóótun” tàbí “ní agbára tó yẹ” fún “tó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: òórùn
  rationale: “Òórùn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí imú ń gbó; ó lè jẹ́ dídùn tàbí búburú gẹ́gẹ́ bí àyíká ọ̀rọ̀, nítorí náà ó pa àwòrán àti ìyàtọ̀ inú ẹsẹ náà mọ́ láìfi ìtumọ̀ rere tàbí búburú lé e lórí.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: láti inú ikú sí ikú
  rationale: 'Ìtumọ̀ yìí pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́: ó lè tọ́ka sí orísun àti àbájáde tàbí sí fífi ìwà ikú hàn ní kíkún.'
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: láti inú ìyè sí ìyè
  rationale: Ó bá gbólóhùn òdìkejì mu ní ìwọ̀ntúnwọ̀nsì, ó sì pa ìṣọ̀kan àtúnsọ Gíríìkì mọ́ láìyan ìtumọ̀ kan ṣoṣo.
- source_word: πρὸς ταῦτα
  choice: fún àwọn nǹkan wọ̀nyí
  rationale: Ó fi ọ̀pọ̀ nọ́ńbà ταῦτα hàn, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹni kan tóótun láti ṣe ojúṣe tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
- source_word: ἱκανός
  choice: tóótun
  rationale: “Tóótun” túmọ̀ sí ẹni tí ó ní ìyẹ́, agbára, tàbí ìbámu tó yẹ fún iṣẹ́ kan; ó bá ìbéèrè àsọyé Pọ́ọ̀lù mu ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Agbára ìtumọ̀ àwọn gbólóhùn méjèèjì, “láti inú ikú sí ikú” àti “láti inú ìyè sí ìyè”
  choice: Pa àkójọpọ̀ ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “òórùn tí ó ń mú ikú wá, tí ó sì yọrí sí ikú / òórùn tí ó ń fúnni ní ìyè, tí ó sì yọrí sí ìyè,” tàbí òórùn tí ikú/ìyè ń dá mọ̀.
  rationale: Ẹsẹ náà kò fi tipátipá yan bóyá àwọn gbólóhùn náà ń sọ nípa orísun àti àbájáde, ìpa lórí àwọn olùgbọ́, tàbí ìmúdájú ìwà ikú àti ìyè. Ìtumọ̀ títọ́ díẹ̀ pa ẹ̀dùn àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá àjọṣe òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àtúnsọ “láti inú … sí …” pa ìṣọ̀kan àti agbára àsọyé Gíríìkì mọ́. “Àwọn kan / àwọn ẹlòmíràn” jẹ́ ọ̀nà àdánidá láti fi ìyàtọ̀ οἷς μὲν … οἷς δὲ hàn.
