id: 2CO.2.3
reference: 2 Corinthians 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: yo
  text: Mo sì kọ ohun yìí gan-an kí, nígbà tí mo bá dé, n má bàa ní ìbànújẹ́ láti ọ̀dọ̀ àwọn tí ó yẹ kí n máa yọ̀ nítorí wọn,[a] nítorí mo ní ìgbẹ́kẹ̀lé nínú gbogbo yín pé ayọ̀ mi jẹ́ ayọ̀ gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà, “láti ọ̀dọ̀ àwọn tí ó yẹ kí n máa yọ̀ láti ọ̀dọ̀ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Mo sì kọ
  rationale: Aorist náà tọ́ka sí ohun tí Pọ́ọ̀lù kọ tẹ́lẹ̀; ìṣe àtẹ̀yìnwá rọrùn ni èdè Yorùbá.
- source_word: τοῦτο αὐτὸ
  choice: ohun yìí gan-an
  rationale: “Gan-an” pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: kí ó má bàa jẹ́ pé nígbà tí mo bá dé ... yóò mú ìbànújẹ́ bá mi
  rationale: Ó fi ète gbolohun hàn, ó sì tú ìṣètò Gíríìkì sí Yorùbá tí ó ṣe kedere láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: àwọn tí ó yẹ kí n máa yọ̀ nítorí wọn
  rationale: Ó pa àwọn ènìyàn náà mọ́ gẹ́gẹ́ bí orísun ayọ̀ Pọ́ọ̀lù, láìfi ìtumọ̀ olùmú-ayọ̀ kún ọ̀rọ̀ náà ju bó ṣe yẹ lọ.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: nítorí mo ní ìgbẹ́kẹ̀lé nínú gbogbo yín
  rationale: Perfect participle náà ṣàfihàn ìgbẹ́kẹ̀lé tí ó dúró ṣinṣin; “nítorí” jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú gbolohun ṣáájú ṣe kedere, bí ó tilẹ̀ jẹ́ pé participle Gíríìkì lè ní ìtumọ̀ àfikún tí kò lágbára tó bẹ́ẹ̀.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: ayọ̀ mi ni ayọ̀ gbogbo yín
  rationale: Ìtumọ̀ yìí tẹ̀lé ìṣètò Gíríìkì pẹ́kipẹ́ki, ó sì pa èrò ayọ̀ tí wọ́n jọ ní mọ́ láìyanju àìdánilójú náà jù.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A yan “ìbànújẹ́” fún λύπη, “ayọ̀” fún χαρά, àti “ìgbẹ́kẹ̀lé” fún πεποίθησις/πέποιθα; a sì yàgò fún gbólóhùn ẹ̀sìn ẹlẹ́kọ̀ọ́ kan pàtó.
