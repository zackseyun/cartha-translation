    rationale: Ó ṣeé lóye, ṣùgbọ́n “Ní ìtumọ̀ tààrà” jẹ́ ọ̀nà tó kúrú, tó sì jẹ́ àdánidá jù lọ fún fífi ìyípadà ìtumọ̀ hàn.
