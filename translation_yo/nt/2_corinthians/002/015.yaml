id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: yo
  text: Nítorí àwa ni òórùn dídùn ti Mèsáyà[a] fún Ọlọ́run láàárín àwọn tí a ń gbà là àti láàárín àwọn tí ń ṣègbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ṣe àlàyé ìdí fún ọ̀rọ̀ tó ṣáájú, ó sì pa agbára ìtumọ̀ ìdí tàbí àlàyé inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Χριστοῦ
  choice: ti Mèsáyà
  rationale: Ẹ̀yà oníhun yìí fi hàn pé òórùn dídùn náà jẹ́ ti Mèsáyà tàbí pé Mèsáyà ni ó ń ṣàpèjúwe; “Mèsáyà” tún pa agbára oyè Χριστός mọ́.
- source_word: εὐωδία
  choice: òórùn dídùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ òórùn amúnilára tàbí olóòórùn dídùn, ó sì pa àkàwé ìgbóòórùn inú ọ̀rọ̀ náà mọ́.
- source_word: τῷ θεῷ
  choice: fún Ọlọ́run
  rationale: “Fún” ṣàfihàn ìbáṣepọ̀ tàbí ìtọ́sọ́nà dative náà lọ́dọ̀ Ọlọ́run ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐν τοῖς σῳζομένοις
  choice: láàárín àwọn tí a ń gbà là
  rationale: “Láàárín” bá ìtumọ̀ ἐν mu nínú àyíká yìí, “a ń gbà là” sì pa ìṣe tí ń lọ lọ́wọ́ inú present participle mọ́.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: láàárín àwọn tí ń ṣègbé
  rationale: Ìtúmọ̀ yìí pa àfọwọ́ṣe tó bá apá àkọ́kọ́ mu àti ìlọsíwájú ìṣe inú present participle mọ́, láì sọ ọ́ di ipò tí ó ti parí.
theological_decisions:
- issue: Ìlọsíwájú ìṣe nínú σῳζομένοις àti ἀπολλυμένοις
  choice: “àwọn tí a ń gbà là” àti “àwọn tí ń ṣègbé”
  alternative: “àwọn ẹni ìgbàlà” àti “àwọn ẹni ìparun”
  rationale: Present participles méjèèjì fi ìgbàlà àti ìṣègbé hàn gẹ́gẹ́ bí ohun tó ń lọ lọ́wọ́. A kò sọ wọ́n di àmì ìdánimọ̀ tí kò ní ìlọsíwájú, kí a má bàa tú ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà ní ọ̀nà kan ṣoṣo.
- issue: Ìtumọ̀ Χριστοῦ gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú ìtumọ̀ oyè ẹni àmì òróró náà jáde ní gbangba; àfikún ìsàlẹ̀ ojú ìwé jẹ́ kí ọ̀nà ìtumọ̀ ìbílẹ̀ “Kristi” tún hàn láì yí ọ̀rọ̀ pàtàkì padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. Àtúnsọ “láàárín” tẹ̀ lé ἐν méjèèjì, ó sì mú ìfarakanra àwọn ẹgbẹ́ méjèèjì hàn kedere. “Òórùn dídùn” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún εὐωδία.
