id: 2CO.2.11
reference: 2 Corinthians 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: yo
  text: kí Sátánì má bàa rẹ wa jẹ́[a], nítorí a kò ṣàìmọ̀ àwọn ète rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lo àǹfààní wa” tàbí “fi ọgbọ́n borí wa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ìpinnu,” “àwọn èrò,” tàbí “àwọn ọgbọ́n àrékérekè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ó fi ète tàbí ohun tí a fẹ́ dènà hàn ní Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πλεονεκτηθῶμεν
  choice: ré wa jẹ́
  rationale: Ọ̀rọ̀ yìí sọ pé ẹnì kan lo àǹfààní ẹni mìíràn tàbí fi ọgbọ́n burúkú borí rẹ̀. “Ré wa jẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè gba ìtumọ̀ jíjẹ àǹfààní àti jíjẹ́ olùborí nípasẹ̀ ẹ̀tàn.
- source_word: Σατανᾶ
  choice: Sátánì
  rationale: Orúkọ ẹni ni; a lo ìrísí orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó mú ìdí tí gbólóhùn àkọ́kọ́ fi rí bẹ́ẹ̀ wọlé lọ́nà tí ó ṣe kedere ní Yorùbá.
- source_word: νοήματα
  choice: àwọn ète
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn èrò tàbí ìpinnu Sátánì tí a gbèrò fún ohun búburú; “àwọn ète” pa ìtumọ̀ ọgbọ́n àrékérekè náà mọ́.
- source_word: ἀγνοοῦμεν
  choice: a kò ṣàìmọ̀
  rationale: Ó pa ìsọ̀rọ̀ Gíríìkì tó dá lórí àìmọ̀ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó lọ́lá láti sọ pé a mọ ohun náà.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà jẹ́ kúkúrú, ó lọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; “má bàa” àti “ré ... jẹ́” mú un dun bí Yorùbá àdánidá láì sọ ìtumọ̀ Gíríìkì di tóóró.
