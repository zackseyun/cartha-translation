lexical_decisions:
- source_word: ἱκανὸν
  choice: ti tó
  rationale: Ó dúró gẹ́gẹ́ bí èrò àpólà àsọtẹ́lẹ̀ nínú gbólóhùn náà. “Ti tó” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì fi hàn pé ìbáwí náà ti dé ìwọ̀n tó yẹ.
- source_word: τῷ τοιούτῳ
  choice: fún irú ọkùnrin bẹ́ẹ̀
  rationale: Gbólóhùn náà ń tọ́ka sí ẹlẹ́ṣẹ̀ kan pàtó nínú àyíká ọ̀rọ̀, ó sì jẹ́ akọ ẹyọ nínú Gíríìkì. “Irú ọkùnrin bẹ́ẹ̀” pa ìtọ́kasí àti akọ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐπιτιμία
  choice: ìjìyà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìgbésẹ̀ ìbáwí tàbí ìtanràn tí àwùjọ gbé lé ẹni náà. “Ìjìyà” mú kí ó ṣe kedere pé kì í ṣe ọ̀rọ̀ ìbáwí lásán, bí kò ṣe ìgbésẹ̀ àtúnṣe tí wọ́n ti gbé.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: tí ọ̀pọ̀ jù lọ nínú wọn fi jẹ
  rationale: οἱ πλείονες ń tọ́ka sí apá tó pọ̀ jù lọ nínú ẹgbẹ́ náà. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa èrò pé kì í ṣe gbogbo wọn mọ́.
