source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: yo
  text: Nítorí bí mo bá mú ìbànújẹ́ bá yín, ta ni ó ń mú inú mi dùn, bí kò ṣe ẹni tí inú rẹ̀ ń bàjẹ́ nítorí mi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπῶ
  choice: mú ìbànújẹ́ bá
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú kí ẹnì kan ní ìbànújẹ́ tàbí ìrora ọkàn; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìṣe-okùnfà náà mọ́.
- source_word: εὐφραίνων
  choice: mú inú mi dùn
  rationale: Ó tọ́ka sí ẹni tí ń mú ayọ̀ wá fún Pọ́ọ̀lù; yíyan yìí ṣe kedere, ó sì bá ìyàtọ̀ tó wà láàárín ayọ̀ àti ìbànújẹ́ mu.
- source_word: τίς ὁ εὐφραίνων με
  choice: ta ni yóò mú inú mi dùn
  rationale: Ìtumọ̀ yìí mú agbára ìbéèrè àsọyé Gíríìkì jáde ní Yorùbá àdánidá, láìsọ participle náà di gbólóhùn tó le.
- source_word: ὁ λυπούμενος
  choice: ẹni tí mo mú ìbànújẹ́ bá
  rationale: Bí ó tilẹ̀ jẹ́ pé participle Gíríìkì wà ní ohùn àfaragà, àyíká ọ̀rọ̀ fi Pọ́ọ̀lù hàn gẹ́gẹ́ bí olùṣe; Yorùbá yìí sọ ìbáṣepọ̀ náà ní ọ̀nà àdánidá.
- source_word: ἐξ ἐμοῦ
  choice: mo mú … bá
  rationale: ἐξ le fi orísun tàbí okùnfà hàn níbí; fífi í sínú ìṣe ‘mo mú … bá’ mú ìtumọ̀ náà ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa àṣàyàn ‘nítorí mi’ mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ àlàyé tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìtẹ̀síwájú ìrònú.
theological_decisions:
- issue: Bóyá ὁ λυπούμενος ἐξ ἐμοῦ yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ẹni tí Pọ́ọ̀lù mú ní ìbànújẹ́ tàbí ẹni tí inú rẹ̀ bàjẹ́ nítorí Pọ́ọ̀lù.
  choice: ẹni tí mo mú ìbànújẹ́ bá
  alternative: ẹni tí inú rẹ̀ bàjẹ́ nítorí mi
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá tó rọrùn, ó sì bá λυπῶ tó wà ní ìbẹ̀rẹ̀ ẹsẹ̀ mu; àlàyé ìsàlẹ̀ fi àìdánilójú orísun/okùnfà ἐξ ἐμοῦ sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Mú ìbànújẹ́ bá’ àti ‘mú inú … dùn’ dá ìfọwọ́kọ ìtumọ̀ méjèèjì sílẹ̀, wọ́n sì rọrùn fún òǹkàwé lásán.
