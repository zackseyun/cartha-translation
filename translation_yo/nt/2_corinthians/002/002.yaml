  source_fidelity: Ìtumọ̀ náà pa ìtumọ̀ ìṣe-okùnfà λυπῶ mọ́ dáadáa nínú “mú ìbànújẹ́ bá,” ó sì mú ìbéèrè àsọyé náà hàn. Síbẹ̀, “ta ni yóò mú inú mi dùn” fi àsìkò ọjọ́ iwájú kún un, níbi tí participle ìsinsìnyí εὐφραίνων ti ń ṣàpèjúwe ẹni tí ń mú inú Pọ́ọ̀lù dùn. Bákan náà, “ẹni tí mo mú ìbànújẹ́ bá” jẹ́ ìtumọ̀ tó ṣeé gbà, ṣùgbọ́n ó sọ participle passive λυπούμενος di ohun tí Pọ́ọ̀lù ti ṣe ní tààrà; ìtumọ̀ àkọ́kọ́ yẹ kí ó fi ipò ẹni náà àti ἐξ ἐμοῦ hàn kedere.
