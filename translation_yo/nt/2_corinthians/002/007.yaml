source:
  edition: SBLGNT
  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: yo
  text: 'Nítorí náà, dípò bẹ́ẹ̀, ẹ kúkú dárí jì í[a], kí ẹ sì tù ú nínú, kí ìbànújẹ́ tí ó pọ̀ jù má bàa bo irú ẹni bẹ́ẹ̀ mọ́lẹ̀[b].


    [a] Tàbí, “fi oore-ọ̀fẹ́ dárí jì í”; ọ̀rọ̀ Gíríìkì náà ní ìbátan pẹ̀lú fífi oore-ọ̀fẹ́ tàbí ojúrere hàn.


    [b] Ní tààrà, “kí a má bàa jẹ irú ẹni bẹ́ẹ̀ gbé mì.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi oore-ọ̀fẹ́ dárí jì í”; ọ̀rọ̀ Gíríìkì náà ní ìbátan pẹ̀lú fífi oore-ọ̀fẹ́ tàbí ojúrere hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kí a má bàa jẹ irú ẹni bẹ́ẹ̀ gbé mì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: ní òdìkejì
  rationale: Ó fi ìyípadà sí ìgbésẹ̀ òdìkejì hàn ní kedere, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtakora náà ní Yorùbá.
- source_word: μᾶλλον
  choice: kúkú
  rationale: Nínú àyíká ìtakora yìí, “kúkú” ń fi hàn pé èyí ni ohun tí ó yẹ kí wọ́n ṣe dípò ohun mìíràn, láìsọ agbára ìtumọ̀ ọ̀rọ̀ náà ju bó ṣe yẹ lọ.
- source_word: χαρίσασθαι
  choice: dárí jì í
  rationale: Nínú àyíká ìbáwí àti ìmúpadàbọ̀sípò yìí, ó túmọ̀ sí fífi ìdáríjì fún un; àlàyé ìsàlẹ̀ ojú ìwé dá ìbátan ọ̀rọ̀ náà pẹ̀lú oore-ọ̀fẹ́ sí.
- source_word: παρακαλέσαι
  choice: tù ú nínú
  rationale: Ìtumọ̀ ìtùnú bá ọ̀rọ̀ nípa ìbànújẹ́ àti ìmúpadàbọ̀sípò mu jù lọ, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè ní èrò ìṣírí.
- source_word: καταποθῇ
  choice: gbé … mì
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn tí ó ṣeé lóye ní Yorùbá fún bí ìbànújẹ́ ṣe lè bo ènìyàn mọ́lẹ̀ patapata.
- source_word: ὁ τοιοῦτος
  choice: irú ẹni bẹ́ẹ̀
  rationale: Ó pa ìtọ́kasí gbogbogbò ti Gíríìkì mọ́ láìfi akọ tàbí ìdánimọ̀ mìíràn kún un.
- source_word: περισσοτέρᾳ λύπῃ
  choice: ìbànújẹ́ tí ó pọ̀ jù
  rationale: Ó sọ ìwọ̀n ìbànújẹ́ tí ó kọjá àyè rẹ̀ ní Yorùbá tí ó ṣe kedere, láìsọ ọ́ di ọ̀rọ̀ ìmọ̀ ẹ̀kọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ẹ” pa ọ̀pọ̀ ènìyàn inú ὑμᾶς mọ́; “irú ẹni bẹ́ẹ̀” kò fi akọ tàbí ìdánimọ̀ tí Gíríìkì kò sọ kún ẹsẹ̀ náà. Àwòrán “gbé … mì” ni a pa mọ́ nítorí pé ó ṣeé lóye ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà ìtumọ̀ alálàyé.
