source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: yo
  text: 'Nítorí èyí ni mo tún kọ̀wé: kí n lè mọ ohun tí ìdánwò yín fi hàn[a], bóyá ẹ ń ṣègbọ́ràn nínú ohun gbogbo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdánwò yín,” tàbí “ẹ̀rí yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: Nítorí èyí ni
  rationale: Ó fi ìdí tí Pọ́ọ̀lù fi kọ̀wé hàn ní èdè Yorùbá àdánidá, ó sì pa agbára ìdí àti ète inú gbólóhùn Gíríìkì mọ́.
- source_word: καὶ ἔγραψα
  choice: mo ṣe kọ̀wé pẹ̀lú
  rationale: “Pẹ̀lú” pa agbára àfikún καὶ mọ́, “kọ̀wé” sì jẹ́ ọ̀nà àdánidá láti tú ἔγραψα.
- source_word: ἵνα γνῶ
  choice: kí n lè mọ
  rationale: Ó pa ìtumọ̀ gbólóhùn ète mọ́, ó sì sọ ìfẹ́ láti wá mọ̀ ní Yorùbá tó ṣe kedere.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: ohun tí ìdánwò yín fi hàn
  rationale: δοκιμή lè tọ́ka sí ìdánwò tàbí ẹ̀rí tí ìdánwò mú jáde. Gbólóhùn yìí pa àwọn ìhà méjèèjì mọ́ láì fi ìtumọ̀ “ìwà tí a ti fìdí rẹ̀ múlẹ̀” kún un ní pàtó.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: bóyá ẹ ń ṣègbọ́ràn nínú ohun gbogbo
  rationale: “Bóyá” fi hàn pé ìbéèrè àìṣe-taara ni εἰ; “nínú ohun gbogbo” sì pa ìwọ̀n gbogbo-gbòò ti εἰς πάντα mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn fún ìjọ Kọ́ríńtì; àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ.
