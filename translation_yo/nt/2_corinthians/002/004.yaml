id: 2CO.2.4
reference: 2 Corinthians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: yo
  text: Láti inú ìpọ́njú púpọ̀ àti ìdààmú ọkàn ni mo kọ̀wé sí yín pẹ̀lú omijé púpọ̀[a], kì í ṣe láti mú kí inú yín bàjẹ́, ṣùgbọ́n kí ẹ lè mọ bí ìfẹ́ tí mo ní sí yín ti pọ̀ tó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gírámà, a tún lè tú u sí “nípasẹ̀ omijé púpọ̀”; ìtumọ̀ rẹ̀ ni pé Pọ́ọ̀lù kọ ọ́ pẹ̀lú omijé púpọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìfẹ́ àrà ọ̀tọ̀ tí mo ní sí yín” tàbí “ìfẹ́ tí mo ní sí yín lọpọlọpọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: Láti inú ìpọ́njú púpọ̀
  rationale: “Láti inú” fi hàn pé ipò ìpọ́njú náà ni ìkọ̀wé Pọ́ọ̀lù ti jáde wá; “ìpọ́njú” sì pa ìtumọ̀ ìfúnpọ̀ àti ìjìyà mọ́ láì fi mọ́ inúnibíni nìkan.
- source_word: συνοχῆς καρδίας
  choice: ìdààmú ọkàn
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún ìrora àti ìhámọ́ra inú ọkàn, ó sì pa bí ìmọ̀lára náà ti le tó mọ́.
- source_word: ἔγραψα
  choice: mo kọ̀wé
  rationale: Ó túmọ̀ aorist náà sí ìṣe àtijọ́ lasan, láì fi ọ̀rọ̀ tí kò sí nínú ọ̀rọ̀-ìṣe náà kún un.
- source_word: διὰ πολλῶν δακρύων
  choice: pẹ̀lú omijé púpọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé omijé bá ìkọ̀wé náà lọ, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gidi ti διά hàn.
- source_word: λυπηθῆτε
  choice: kí inú yín bàjẹ́
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá fún jíjẹ́ ẹni tí ìbànújẹ́ dé bá, ó sì pa ìrísí àbájáde tí passive Gíríìkì náà ní mọ́.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá gbòòrò, àdánidá, tí ó bá ἀγάπη mu ní àyíká yìí.
- source_word: γνῶτε
  choice: kí ẹ lè mọ
  rationale: Ó pa gbólóhùn ète náà mọ́, láì pinnu bóyá ohun tí a ní lọ́kàn ni kí wọ́n mọ̀ ọ́n tuntun tàbí kí òye wọn jinlẹ̀ sí i.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: bí ìfẹ́ tí mo ní sí yín ti pọ̀ tó
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tí ó ṣe kedere, ó sì pa agbára ìfiwéra tàbí ìtẹnumọ́ περισσοτέρως mọ́ láì dá ohun tí a fi wé e sílẹ̀.
theological_decisions:
- issue: Agbára περισσοτέρως àti ohun tí a ń fi ìfẹ́ náà wé
  choice: bí ìfẹ́ tí mo ní sí yín ti pọ̀ tó
  alternative: ìfẹ́ àrà ọ̀tọ̀ tí mo ní sí yín / ìfẹ́ tí mo ní lọ́pọ̀lọpọ̀ sí yín
  rationale: Ọ̀rọ̀ Gíríìkì lè tẹnumọ́ bí ìfẹ́ náà ti pọ̀ tó tàbí pé ó jẹ́ pàtàkì sí àwọn ará Kọ́ríńtì. A yan gbólóhùn tí ó pa ìwọ̀n ìfẹ́ náà mọ́, a sì ṣàkọsílẹ̀ ìtumọ̀ kejì láì yanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà pa ìrora inú Pọ́ọ̀lù, ète ìkọ̀wé rẹ̀, àti àìdánilójú díẹ̀ nínú περισσοτέρως mọ́.
