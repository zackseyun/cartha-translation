id: 2CO.2.5
reference: 2 Corinthians 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni bá ti fa ìbànújẹ́, kì í ṣe èmi nìkan ni ó bà nínú jẹ́; ó bà gbogbo yín nínú jẹ́ dé ìwọ̀n kan—kí n má bàa fi ẹrù kan gbogbo yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì náà lè túmọ̀ sí pé: “ó bà gbogbo yín nínú jẹ́, ṣùgbọ́n ní apá kan nìkan ni mo ń sọ bẹ́ẹ̀, kí n má bàa fi ẹrù kan gbogbo yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: ti fa ìbànújẹ́ / ti bà nínú jẹ́
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìsopọ̀ itumọ̀ λυπέω mọ́, wọ́n sì lo àkókò àṣepé Yorùbá “ti” láti fi hàn pé ohun tí ó ṣẹlẹ̀ ṣáájú ṣì ní ipa nísinsìnyí.
- source_word: οὐκ ἐμὲ
  choice: kì í ṣe èmi nìkan
  rationale: Nínú àyíká gbólóhùn náà, “nìkan” jẹ́ kí ìyàtọ̀ láàárín Pọ́ọ̀lù àti gbogbo ìjọ ṣe kedere, láìsọ pé kò bà á nínú jẹ́ rárá.
- source_word: ἀπὸ μέρους
  choice: dé ìwọ̀n kan
  rationale: Èyí tú ọ̀rọ̀ àṣàyàn náà sí Yorùbá àdánidá, ó sì pa ìdínwọ̀ tí Pọ́ọ̀lù fi sí gbólóhùn rẹ̀ mọ́.
- source_word: ἐπιβαρῶ
  choice: sọ ọ́ di ohun tí ó wúwo jù fún
  rationale: Èyí pa àwòrán ẹrù tàbí ìwúwo inú ọ̀rọ̀ náà mọ́, ó sì lè túmọ̀ sí kí Pọ́ọ̀lù má tẹ ọ̀rọ̀ náà le gbogbo wọn lórí ju bó ṣe yẹ lọ.
- source_word: πάντας ὑμᾶς
  choice: gbogbo yín
  rationale: Ó pa ìtẹnumọ́ πάντας àti ìtọ́kasí sí àwùjọ gbogbo mọ́.
theological_decisions:
- issue: Bóyá ẹni náà bà Pọ́ọ̀lù nínú jẹ́ rárá
  choice: kì í ṣe èmi nìkan ni ó ti bà nínú jẹ́
  alternative: kò bà mí nínú jẹ́
  rationale: Ìtòlẹ́sẹẹsẹ Gíríìkì lè jẹ́ àrọ́rọ̀ tí ó túmọ̀ sí pé ìbànújẹ́ náà kò kan Pọ́ọ̀lù nìkan, ṣùgbọ́n ó kan gbogbo ìjọ dé ìwọ̀n kan. Yíyan “nìkan” yẹra fún ìtumọ̀ líle pé Pọ́ọ̀lù kò ní ìbànújẹ́ rárá.
- issue: Ìbáṣepọ̀ ἀπὸ μέρους àti ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς
  choice: so “dé ìwọ̀n kan” mọ́ “gbogbo yín,” kí a sì fi ẹsẹ̀ ìsàlẹ̀ ṣàfihàn ìtòlẹ́sẹẹsẹ mìíràn
  alternative: so ó mọ́ ìdí tí Pọ́ọ̀lù fi fẹ́ yẹra fún fífi ẹrù kan gbogbo wọn
  rationale: Gíríìkì ní àìdánilójú nípa ibi tí gbolohun ìdínwọ̀ náà ti so mọ́. Ọ̀rọ̀ àkọ́kọ́ yan ìkawe tó wọ́pọ̀, ẹsẹ̀ ìsàlẹ̀ sì pa ìkawe mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “bà nínú jẹ́” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìbànújẹ́, a sì pa àwòrán ìwúwo inú ἐπιβαρῶ mọ́. Àmì ẹsẹ̀ ìsàlẹ̀ [a] wà nínú ọ̀rọ̀ pàtàkì.
