  to: Ṣùgbọ́n bí ẹnikẹ́ni bá ti fa ìbànújẹ́, kì í ṣe èmi nìkan ni ó bà nínú jẹ́; ó bà gbogbo yín nínú jẹ́ dé ìwọ̀n kan—kí n má bàa fi ẹrù kan gbogbo yín.[a]
