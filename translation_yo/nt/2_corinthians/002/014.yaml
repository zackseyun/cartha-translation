  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò gbólóhùn Gíríìkì náà dáadáa: ìdúpẹ́ sí Ọlọ́run, ìṣe rẹ̀ nípasẹ̀ àwọn òjíṣẹ́, òórùn ìmọ̀ nípa rẹ̀, àti ìtànkálẹ̀ rẹ̀ ní ibi gbogbo. Ṣùgbọ́n “ṣáájú wa” túmọ̀ sí pé Ọlọ́run ń lọ níwájú wọn, kì í ṣe pé ó ń mú wọn lọ gẹ́gẹ́ bí ohun tí θριαμβεύοντι ἡμᾶς ń béèrè. A tún gbọdọ̀ gbe àmì àlàyé òórùn sí ibi tí ọ̀rọ̀ náà wà.'
