revisions:
- from: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run,[b] ẹni tí ó máa ń ṣáájú wa nígbà gbogbo nínú ìrìn àjàyọ̀ ìṣẹ́gun nínú Mèsáyà,[a] tí ó sì ń tipasẹ̀ wa mú òórùn dídùn ìmọ̀ nípa rẹ̀ hàn ní ibi gbogbo.
  to: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run, ẹni tí ó máa ń mú wa lọ nínú ìrìn-àjò ìṣẹ́gun nínú Mèsáyà,[a] tí ó sì ń fi òórùn dídùn[b] ìmọ̀ nípa rẹ̀ hàn nípasẹ̀ wa ní ibi gbogbo.
  rationale: A rọ́pò “ṣáájú wa” pẹ̀lú “mú wa lọ” kí ohun tí ìṣe náà kàn nínú Gíríìkì le hàn dáadáa, nígbà tí “ìrìn-àjò ìṣẹ́gun” ń pa àwòrán ìrìn àjò ìṣẹ́gun Róòmù mọ́. A gbe àmì [b] sí lẹ́yìn “òórùn dídùn,” ibi tí àlàyé rẹ̀ ti wúlò. Àlàyé [a] ń dáàbò bo ìtumọ̀ mìíràn tí a jiyàn nípa rẹ̀.
