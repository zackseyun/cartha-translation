id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: yo
  text: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run, ẹni tí ó máa ń mú wa lọ nínú ìrìn-àjò ìṣẹ́gun nínú Mèsáyà,[a] tí ó sì ń fi òórùn dídùn[b] ìmọ̀ nípa rẹ̀ hàn nípasẹ̀ wa ní ibi gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ẹni tí ó máa ń ṣẹ́gun wa ní gbogbo ìgbà nínú Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí “òórùn” láì fi hàn bóyá ó dùn tàbí kò dùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ọpẹ́ ni fún
  rationale: Ọ̀rọ̀ yìí mú ìdúpẹ́ àti ìyìn inú gbólóhùn Τῷ δὲ θεῷ χάρις jáde ní Yorùbá àdánidá.
- source_word: θριαμβεύοντι
  choice: ṣáájú wa ... nínú ìrìn àjàyọ̀ ìṣẹ́gun
  rationale: Ó pa àwòrán ìrìn àjàyọ̀ ìṣẹ́gun mọ́, ó sì jẹ́ kí ἡμᾶς dúró gẹ́gẹ́ bí ẹni tí Ọlọ́run ń mú lọ; a pa ìtumọ̀ míràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐν τῷ Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, gbólóhùn náà sì tọ́ka sí ìrẹ́pọ̀ tàbí ipò wọn nínú Mèsáyà.
- source_word: ὀσμὴν
  choice: òórùn dídùn
  rationale: Àyíká ọ̀rọ̀ náà ń lo àpèjúwe tó dára; ‘òórùn dídùn’ jẹ́ Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lè jẹ́ ‘òórùn’ lásán.
- source_word: γνώσεως αὐτοῦ
  choice: ìmọ̀ nípa rẹ̀
  rationale: Ó sọ ìmọ̀ ẹni tí a tọ́ka sí di mímọ́ ní Yorùbá láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: φανεροῦντι
  choice: mú ... hàn
  rationale: Ó fi ìṣe tí Ọlọ́run ń ṣe—mímú ohun kan di gbangba—hàn ní èdè Yorùbá tó rọrùn.
- source_word: δι’ ἡμῶν
  choice: tipasẹ̀ wa
  rationale: Ó pa ìtumọ̀ irinṣẹ́ tàbí aṣojú tí διά pẹ̀lú gẹnitífù ní mọ́.
- source_word: ἐν παντὶ τόπῳ
  choice: ní ibi gbogbo
  rationale: Ó jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ pé ó dé gbogbo ibi mọ́.
theological_decisions:
- issue: Ìtumọ̀ θριαμβεύω nígbà tí ἡμᾶς jẹ́ ohun tí ìṣe náà kàn
  choice: Ọlọ́run ń ṣáájú wa nínú ìrìn àjàyọ̀ ìṣẹ́gun nínú Mèsáyà.
  alternative: Ọlọ́run ń ṣẹ́gun wa nínú Mèsáyà.
  rationale: Ọ̀rọ̀ ìtumọ̀ pàtàkì náà pa àwòrán ìrìn àjàyọ̀ ìṣẹ́gun mọ́, ó sì bá àpèjúwe òórùn tó tẹ̀ lé e mu. Síbẹ̀, nítorí ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣẹ́gun àwọn tí a mú lẹ́rú, a kò pa ìtumọ̀ yẹn rẹ́; a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè, a sì yan ‘ìrìn àjàyọ̀ ìṣẹ́gun’ láti mú àwòrán Gíríìkì jáde láì sọ ìtumọ̀ rẹ̀ di ẹ̀kọ́ ìsìn kan ṣoṣo.
