  terminology: “Mèsáyà” ń bá ìpinnu iṣẹ́ náà mu fún Χριστός gẹ́gẹ́ bí oyè. “Òórùn dídùn” yẹ fún ìlò àpèjúwe rere nínú àyíká náà, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ aláìdájú ti ὀσμή mọ́. Àlàyé fún θριαμβεύοντι ń pa ìtumọ̀ mìíràn—pé Ọlọ́run ń ṣẹ́gun wa—mọ́ láì pinnu ẹ̀kọ́ ìsìn kan.
