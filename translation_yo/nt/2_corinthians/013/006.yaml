  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: yo
  text: Ṣùgbọ́n mo ní ìrètí pé ẹ ó mọ̀ pé àwa kò kùnà nínú ìdánwò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò jẹ́ ẹni tí a kò fọwọ́ sí,” tàbí “a kò kùnà nínú ìdánwò.” Ọ̀rọ̀ ajẹ́tífù Gíríìkì náà ń tọ́ka sí ẹni tí kò dúró gẹ́gẹ́ bí ẹni tí a fọwọ́ sí lẹ́yìn ìdánwò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: mo ní ìrètí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìrètí tí Pọ́ọ̀lù ní nípa ohun tí àwọn ará Kọ́ríńtì yóò mọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn sí àníyàn tí a sọ nínú ẹsẹ tó ṣáájú.
- source_word: γνώσεσθε
  choice: ẹ ó mọ̀
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Lílo arọ́pò-orúkọ kíkún náà pa ìtẹnumọ́ tí ó wà nínú Gíríìkì mọ́.
- source_word: οὐκ ἐσμὲν ἀδόκιμοι
  choice: a kò kùnà nígbà àyẹ̀wò
  rationale: Ó mú àwòrán ìdánwò tàbí àyẹ̀wò tó wà nínú àyíká ọ̀rọ̀ náà jáde ní Yorùbá tó ṣe kedere, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ ἀδόκιμοι nínú àyíká ọ̀rọ̀ nípa àyẹ̀wò àti ìjẹ́rìí iṣẹ́ aposteli
  choice: kò kùnà nígbà àyẹ̀wò
  alternative: kò di ẹni tí a kọ̀; kò yẹ lẹ́yìn àyẹ̀wò
  rationale: Yíyan ọ̀rọ̀ yìí pa agbára ìtumọ̀ pé ẹni kan kò dúró gẹ́gẹ́ bí ẹni tí a fọwọ́ sí lẹ́yìn àyẹ̀wò mọ́. Ó yẹra fún ọ̀rọ̀ tó lè ru ìtumọ̀ ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì kò fi dandan sọ níbí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn fún àwọn ará Kọ́ríńtì; àmì ohùn kíkún ni a fi sí ibi tí ó bá ṣe àdánidá.
