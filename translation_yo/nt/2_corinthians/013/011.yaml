    rationale: Nínú Yorùbá, “Ọlọ́run ti ìfẹ́ àti àlàáfíà” ló ṣe kedere pé Ọlọ́run ni a ń ṣàpèjúwe gẹ́gẹ́ bí Ọlọ́run ìfẹ́ àti àlàáfíà, kì í ṣe àtòjọ “Ọlọ́run, ìfẹ́, àti àlàáfíà.”
  - severity: low
    issue: “Ẹ máa ronú ohun kan náà” kò rọrùn nínú Yorùbá.
    rationale: “Ẹ ní èrò kan náà” jẹ́ ọ̀nà àdánidá, tó sì dúró ṣinṣin lórí ìtumọ̀ “think the same thing / be of one mind.”
  - severity: low
