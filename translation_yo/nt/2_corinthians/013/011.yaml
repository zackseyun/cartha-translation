  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ètò àwọn àṣẹ Gíríìkì náà, ìlérí ọjọ́ iwájú náà, àti ìtumọ̀ àkópọ̀ ἀδελφοί dáadáa. Ṣùgbọ́n “Ọlọ́run ìfẹ́ àti àlàáfíà” lè dà bí àtòjọ orúkọ; “Ọlọ́run ti ìfẹ́ àti àlàáfíà” fi ìbáṣepọ̀ jẹnítífù ti ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης hàn kedere. “Ẹ ní èrò kan náà” sì jẹ́ Yorùbá àdánidá fún τὸ αὐτὸ φρονεῖτε.
  naturalness: Àwọn ọ̀rọ̀ púpọ̀ jẹ́ Yorùbá òde òní tí ó bójú mu. A túnṣe “ẹ máa ronú ohun kan náà” sí “ẹ ní èrò kan náà,” nítorí èyí lójú-ọ̀nà Yorùbá, ó sì ṣì pa ìpè sí ìṣọ̀kan ìrònú mọ́. A tún lo àmì ìdákẹ́jẹ dípò àmi-ààrin gẹ́gẹ́ bí àtòjọ àṣẹ náà ṣe ń bá ara rẹ̀ lọ.
  terminology: “Ẹ̀yin ará” yẹ fún ìkíni sí ìjọ, láìfipá fi akọ tàbí abo kún un. “Ìfẹ́,” “àlàáfíà,” “ìṣírí,” àti “ipò tí ó yẹ” jẹ́ ọ̀rọ̀ tó yege nínú àyíká yìí.
