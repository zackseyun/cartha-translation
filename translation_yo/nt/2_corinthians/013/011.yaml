id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: yo
  text: Ní ìparí, ẹ̀yin ará[b], ẹ máa yọ̀[a], ẹ mú ara yín padà sí ipò tí ó yẹ[c], ẹ gba ìṣírí[d], ẹ ní èrò kan náà[e], ẹ máa gbé ní àlàáfíà, Ọlọ́run ti ìfẹ́ àti àlàáfíà yóò sì wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “ó dàbọ̀”; ọ̀rọ̀ Gíríìkì náà lè ṣiṣẹ́ gẹ́gẹ́ bí ìkíni ìdágbére, ṣùgbọ́n ó ṣeé ṣe kó túmọ̀ sí “ẹ máa yọ̀” níbí nítorí ó wà nínú àtòjọ àwọn ìyànjú.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ará” jẹ́ akọ ní girama, ṣùgbọ́n níbí ó ṣeé ṣe kó ń tọ́ka sí gbogbo ìjọ, àwọn ọkùnrin àti obìnrin.
    reason: cultural_note
  - marker: c
    text: Ó tún lè jẹ́ “ẹ jẹ́ kí a sọ yín di pípé,” “ẹ jẹ́ kí a tún yín ṣe,” tàbí “ẹ mú ara yín wà létòlétò.”
    reason: lexical_alternative
  - marker: d
    text: Ó tún lè jẹ́ “ẹ gba ìtùnú” tàbí “ẹ gba ìyànjú.”
    reason: lexical_alternative
  - marker: e
    text: Ní tààrà, “ẹ ní èrò kan náà”; ìyẹn ni pé, “ẹ jẹ́ oníṣọ̀kan èrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Ní ìparí
  rationale: Ó ń tọ́ka sí apá ìparí lẹ́tà náà; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá fún àmì ìparí ọ̀rọ̀.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn ọmọ ìdílé tàbí ẹgbẹ́ ìgbàgbọ́, kò sì fi akọ tàbí abo hàn bí èdè Gíríìkì ṣe ń ṣe ní girama.
- source_word: χαίρετε
  choice: ẹ máa yọ̀
  rationale: Nínú ọ̀wọ́ àwọn àṣẹ inú ẹsẹ yìí, ìtumọ̀ pé kí wọn máa yọ̀ dára ju lílò rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìdágbére lọ.
- source_word: καταρτίζεσθε
  choice: ẹ mú ara yín padà sí ipò tí ó yẹ
  rationale: Ó pa ìtumọ̀ ìmúpadàbọ̀, àtúnṣe, àti mímú ohun dé ipò tó yẹ mọ́, láìsọ ọ́ di ẹ̀kọ́ nípa pípé láìlẹ́ṣẹ̀.
- source_word: παρακαλεῖσθε
  choice: ẹ gba ìṣírí
  rationale: Fọ́ọ̀mù náà lè túmọ̀ sí gbígba ìṣírí tàbí ìyànjú; “ẹ gba ìṣírí” jẹ́ kedere, ó sì bá ìṣísẹ̀ àìṣe-orúkọ náà mu.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: ẹ máa ronú ohun kan náà
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, ó sì pa ìtẹnumọ́ lórí ìṣọ̀kan èrò mọ́.
- source_word: εἰρηνεύετε
  choice: ẹ máa gbé ní àlàáfíà
  rationale: Ó fi hàn pé ìwà àlàáfíà gbọ́dọ̀ jẹ́ ohun tí wọ́n ń bá a lọ ní àárín ara wọn.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Ọlọ́run ìfẹ́ àti àlàáfíà
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì dára ní Yorùbá fún gbólóhùn oníjẹnítífù náà.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: yóò sì wà pẹ̀lú yín
  rationale: Ó pa ìlérí ọjọ́ iwájú mọ́ ní èdè Yorùbá òde òní.
theological_decisions:
- issue: Agbára àkópọ̀ ti ἀδελφοί nínú ọ̀rọ̀ sí ìjọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní girama, ó ń bá gbogbo ìjọ sọ̀rọ̀. “Ará” jẹ́ ìbámu ti Yorùbá tí kò fipá yí àkópọ̀ olùgbọ́ padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀, ọ̀wọ̀, àti òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn àṣẹ ni a ṣe ní fọ́ọ̀mù ọ̀pọ̀ ènìyàn “ẹ,” a sì lo “ẹ máa” láti fi ìṣe tí ó ń bá a lọ hàn. A pa àìdánilójú inú χαίρετε, καταρτίζεσθε, àti παρακαλεῖσθε mọ́ nínú àlàyé ìsàlẹ̀.
