  to: Ní ìparí, ẹ̀yin ará[b], ẹ máa yọ̀[a], ẹ mú ara yín padà sí ipò tí ó yẹ[c], ẹ gba ìṣírí[d], ẹ ní èrò kan náà[e], ẹ máa gbé ní àlàáfíà, Ọlọ́run ti ìfẹ́ àti àlàáfíà yóò sì wà pẹ̀lú yín.
