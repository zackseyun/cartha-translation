  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: yo
  text: Ẹ kí ara yín pẹ̀lú ìfẹnukonu mímọ́.[a] Gbogbo àwọn ènìyàn mímọ́[b] ń kí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pẹ̀lú ìfẹnukonu tí a yà sí mímọ́.” Ó ń tọ́ka sí ìkíni tí àṣà ìgbà náà mọ̀, tí ìwà mímọ́ àti ìdàpọ̀ Kristẹni sì ń ṣe àmì rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ènìyàn mímọ́” níbí túmọ̀ sí àwọn onígbàgbọ́, ìyẹn àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́; kì í ṣe àwọn Kristẹni díẹ̀ tí a gbé sí ipò ọ̀wọ̀ àkànṣe nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn. “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu láti sọ pé kí wọ́n fi ìkíni hàn.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Ó fi hàn pé kí olúkúlùkù nínú àwùjọ kí àwọn ẹlòmíràn; “ara yín” ni ọ̀nà àdánidá láti sọ ìṣe alápàdé yìí ní Yorùbá.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: pẹ̀lú ìfẹnukonu mímọ́
  rationale: “Pẹ̀lú” mú iṣẹ́ ἐν jáde lọ́nà àdánidá nínú gbólóhùn ìkíni Yorùbá. “Ìfẹnukonu” pa ìtumọ̀ gidi φίλημα mọ́, “mímọ́” sì pa ìwà tí a yà sọ́tọ̀ fún Ọlọ́run àti ìdàpọ̀ àwọn onígbàgbọ́ mọ́.
- source_word: ἀσπάζονται ὑμᾶς
  choice: ló kí yín
  rationale: Nínú ọ̀rọ̀ ìparí lẹ́tà, “kí yín” sọ pé wọ́n ń rán ìkíni sí àwọn olùgbà lẹ́tà. “Yín” tún fi ọ̀pọ̀ ènìyàn hàn ní kedere.
- source_word: οἱ ἅγιοι πάντες
  choice: Gbogbo àwọn ènìyàn mímọ́
  rationale: “Gbogbo” pa ìtumọ̀ πάντες mọ́. “Àwọn ènìyàn mímọ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún orúkọ tí Paulu ń pe gbogbo àwọn onígbàgbọ́, láìdá a mọ́ àwọn ẹni tí a gbé ga sí ipò àkànṣe nìkan.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι gẹ́gẹ́ bí orúkọ àwùjọ nínú àwọn lẹ́tà Paulu
  choice: àwọn ènìyàn mímọ́
  alternative: àwọn ẹni mímọ́; àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́
  rationale: Nínú lílò Paulu, ἅγιοι ń tọ́ka sí àwọn onígbàgbọ́ lápapọ̀. Yíyan “àwọn ènìyàn mímọ́” pa ìdánimọ̀ yẹn mọ́, kò sì fi ẹ̀kọ́ pé àwọn ẹni tí a yàn sí ipò ọ̀wọ̀ àkànṣe nìkan ni wọ́n jẹ́.
translation_notes:
  register: Èdè Yorùbá tó wọ́pọ̀, tó níyì, tí ó sì ṣe kedere ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìfẹnukonu gẹ́gẹ́ bí ìṣe ìkíni tó wà nínú orísun mọ́ dípò fífi àlàyé rọ́pò rẹ̀.
