id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: yo
  text: Nítorí èyí ni mo ṣe ń kọ àwọn nǹkan wọ̀nyí nígbà tí n kò sí níbẹ̀, kí n má bàa gbé ìgbésẹ̀ líle[a] nígbà tí mo bá wà níbẹ̀, ní ìbámu pẹ̀lú àṣẹ tí Olúwa fi fún mi fún kíkọ́lé, kì í ṣe fún fífi wó lulẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí n má bàa lo ìlà líle” tàbí “kí n má bàa fi líle mú ọ̀ràn.”
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí “fún ìmúdúró ṣinṣin, kì í ṣe fún ìparun.” Ọ̀rọ̀ Gíríìkì lo àwòrán iṣẹ́ ilé: “fún kíkọ́lé, kì í ṣe fún fífi wó lulẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí ni
  rationale: Ó fi ìsopọ̀ ìdí àti àbájáde pẹ̀lú ọ̀rọ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́, ó sì ń tọ́ka sí ohun tí Pọ́ọ̀lù ń kọ.
- source_word: ἀπὼν … παρὼν
  choice: nígbà tí èmi kò sí níbẹ̀ … nígbà tí mo bá wà níbẹ̀
  rationale: Ó mú ìyàtọ̀ tó wà láàárín àìsí àti wíwà níbẹ̀ jáde ní ọ̀nà tó ṣe kedere.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: kí n má bàa hùwà líle
  rationale: Àṣàyàn yìí sọ ìtumọ̀ líle tàbí mímú ọ̀ràn lọ́nà mímúná ní Yorùbá tó rọrùn láti lóye, láì sọ pé líle náà dájú pé yóò ṣẹlẹ̀.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: ní ìbámu pẹ̀lú àṣẹ
  rationale: Ó fi hàn pé ìṣe náà yóò bá àṣẹ tí a fi lé Pọ́ọ̀lù lọ́wọ́ mu.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ àkọ́lé κύριος tó bójú mu ní Yorùbá, láì fi ìdánimọ̀ míì kún ohun tí ẹsẹ náà sọ.
- source_word: εἰς οἰκοδομὴν … οὐκ εἰς καθαίρεσιν
  choice: fún gbígbé ró, kì í ṣe fún wíwó lulẹ̀
  rationale: Ó pa àwòrán iṣẹ́ ilé inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye.
theological_decisions:
- issue: Ẹni tí àkọ́lé “Olúwa” ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí “Olúwa” láì ṣàlàyé ẹni náà síwájú sí i.
  alternative: Kí a sọ ní pàtó pé Jésù ni, tàbí kí a sọ pé Ọlọ́run ní ìtumọ̀ gbòòrò.
  rationale: Gíríìkì ní ὁ κύριος nìkan; ìtumọ̀ náà pa àkọ́lé yẹn mọ́, kò sì fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní pàtó kún un.
- issue: Ète àṣẹ Pọ́ọ̀lù
  choice: A pa àwòrán “gbígbé ró” àti “wíwó lulẹ̀” mọ́.
  alternative: “Fún ìmúdúró ṣinṣin, kì í ṣe fún ìparun.”
  rationale: Àwòrán iṣẹ́ ilé náà ṣe pàtàkì nínú ìyàtọ̀ tí Pọ́ọ̀lù ń fi hàn, ṣùgbọ́n a kò fi ẹni tàbí ohun tí a ń gbé ró kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “kí n má bàa” fún ète tí ó fẹ́ dènà ohun kan, a sì pa àwòrán iṣẹ́ ilé inú ọ̀rọ̀ Gíríìkì mọ́.
