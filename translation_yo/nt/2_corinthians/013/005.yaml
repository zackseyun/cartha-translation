id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: yo
  text: Ẹ dán ara yín wò láti mọ̀ bóyá ẹ wà nínú ìgbàgbọ́[a]; ẹ yẹ ara yín wò dáadáa. Tàbí ẹ kò ha mọ̀ nípa ara yín pé Jésù Mèsáyà[b] wà nínú yín[c]?—àfi bí ó bá jẹ́ pé ẹ kò yege nínú ìdánwò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Nínú ìgbàgbọ́’ lè tọ́ka sí dídúró nínú ìgbàgbọ́ Kristẹni tàbí sí níní ìgbàgbọ́ tòótọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘Jésù Kristi.’
    reason: alternative_reading
  - marker: c
    text: Tàbí, ‘láàárín yín.’
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Ẹ dán ara yín wò
  rationale: Ó ń sọ nípa fífi ara ẹni sí àyẹ̀wò láti mọ ohun tó jẹ́ òótọ́, kì í ṣe nípa dídán ẹni wò sínú ẹ̀ṣẹ̀.
- source_word: ἐν τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà àdánidá ní Yorùbá, láì pinnu bóyá ó túmọ̀ sí dídúró nínú ìgbàgbọ́ Kristẹni tàbí níní ìgbàgbọ́ tòótọ́.
- source_word: δοκιμάζετε
  choice: ẹ yẹ ara yín wò dáadáa
  rationale: Ọ̀rọ̀ yìí ń tẹnumọ́ àyẹ̀wò tó ń pinnu ohun tó jẹ́ ojúlówó tàbí ohun tó yẹ; ó tún yà díẹ̀ sí ‘dán ... wò’ tó ṣáájú.
- source_word: ἐπιγινώσκετε
  choice: ẹ kò ha mọ èyí
  rationale: ‘Mọ èyí’ bá ìbéèrè àsọyé mu, ó sì ń fi ìtumọ̀ ìdámọ̀ tàbí òye tó péye hàn.
- source_word: ἑαυτοὺς
  choice: nípa ara yín
  rationale: Ó pa ìtọ́ka sí ara àwọn olùgbọ́ mọ́, nígbà tó tún jẹ́ gbólóhùn Yorùbá tó ṣeé lóye.
- source_word: Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn, nígbà tí ‘Jésù’ jẹ́ orúkọ.
- source_word: ἐν ὑμῖν
  choice: wà nínú yín
  rationale: Àyíká ọ̀rọ̀ àyẹ̀wò ara ẹni ṣe àtìlẹ́yìn fún ìtumọ̀ pé Mèsáyà ń gbé inú wọn; àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ àwùjọ ‘láàárín yín’ mọ́.
- source_word: εἰ μήτι
  choice: àfi bí ó bá jẹ́ pé
  rationale: Ó fi àyọkúrò oníṣiyèméjì díẹ̀ hàn ní Yorùbá láì fi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἀδόκιμοί
  choice: ẹ kò yege nínú ìdánwò
  rationale: Ó mú ìyàtọ̀ tó wà láàárín àyẹ̀wò àti yíyẹge hàn, láì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè fi ìtumọ̀ mìíràn kún ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní gbólóhùn ìjẹ́wọ́ yìí, ọ̀rọ̀ náà lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ mú ipa oyè náà hàn. Àlàyé ìsàlẹ̀ ojú-ewé fún ‘Jésù Kristi’ gẹ́gẹ́ bí ìtumọ̀ míì.
- issue: Ìtumọ̀ ἐν τῇ πίστει
  choice: nínú ìgbàgbọ́
  alternative: níní ìgbàgbọ́ tòótọ́ tàbí dídúró nínú ẹ̀sìn Kristẹni
  rationale: Ìtumọ̀ pàtàkì náà pa àìdánilójú inú Gíríìkì mọ́, dípò kíkàn yan ìtumọ̀ ti ara ẹni tàbí ti àwùjọ.
- issue: Ìtumọ̀ ἐν ὑμῖν
  choice: nínú yín
  alternative: láàárín yín
  rationale: Àyíká àyẹ̀wò ara ẹni tọ́ka sí wíwà Mèsáyà nínú àwọn ará Kọ́ríńtì, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún lè ní ìtumọ̀ àwùjọ; a pa èyí mọ́ nínú àlàyé.
- issue: Ìtumọ̀ ἀδόκιμοι
  choice: kò yege nínú ìdánwò
  alternative: a kọ̀ sílẹ̀ tàbí ẹni tí kò ní ìtẹ́wọ́gbà
  rationale: Yíyàn yìí so ọ̀rọ̀ náà mọ́ àkòrí ìdánwò inú ẹsẹ náà, ó sì yẹra fún fífi èrò ẹ̀kọ́ ìsìn tó lé ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa oní àmì ohùn ni a lò, pẹ̀lú ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àṣẹ méjèèjì ni a túmọ̀ pẹ̀lú ọ̀rọ̀ ìṣe tó jọra ṣùgbọ́n tí kò dójú ìkan, láti pa ìtẹnumọ́ àti ìyàtọ̀ kékeré inú Gíríìkì mọ́.
