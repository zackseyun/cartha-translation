revisions:
- from: Ṣùgbọ́n à ń gbàdúrà sí Ọlọ́run pé kí ẹ má ṣe ohun búburú kankan—kì í ṣe kí àwa lè fara hàn bí ẹni tí ó yege nínú ìdánwò,[a] bí kò ṣe kí ẹ̀yin lè ṣe ohun tí ó tọ́, bí ó tilẹ̀ jẹ́ pé àwa lè dà bí ẹni tí kò yege nínú ìdánwò.[b]
  to: Àwa sì ń gbàdúrà sí Ọlọ́run pé kí ẹ má ṣe ohun búburú kankan—kì í ṣe kí àwa lè fara hàn gẹ́gẹ́ bí àwọn tí ó yege nínú ìdánwò,[a] bí kò ṣe kí ẹ̀yin lè ṣe ohun tí ó tọ́, bí ó tilẹ̀ jẹ́ pé àwa lè dà bí àwọn tí kò yege nínú ìdánwò.[b]
  rationale: A rọ́pò àsopọ̀ alátakò “Ṣùgbọ́n” pẹ̀lú “sì” láti ba δέ mu dáadáa. A tún ṣe àwọn àpèjúwe δόκιμοι àti ἀδόκιμοι ní ọ̀pọ̀ ẹni, nítorí “àwa” nínú ẹsẹ̀ náà. Ìyókù ìtumọ̀ náà, pẹ̀lú ìfarahàn/ìwòye tí “lè dà bí” ń tọ́ka sí, ni a pa mọ́.
