id: 2CO.13.7
reference: 2 Corinthians 13:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: yo
  text: Àwa sì ń gbàdúrà sí Ọlọ́run pé kí ẹ má ṣe ohun búburú kankan—kì í ṣe kí àwa lè fara hàn gẹ́gẹ́ bí àwọn tí ó yege nínú ìdánwò,[a] bí kò ṣe kí ẹ̀yin lè ṣe ohun tí ó tọ́, bí ó tilẹ̀ jẹ́ pé àwa lè dà bí àwọn tí kò yege nínú ìdánwò.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àwọn tí a ti dán wò tí a sì fọwọ́ sí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí àwa sì wà gẹ́gẹ́ bí àwọn tí a kò fọwọ́ sí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí bí wọ́n ṣe dà tàbí ipò tí a kà wọ́n sí.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: Ṣùgbọ́n à ń gbàdúrà sí Ọlọ́run
  rationale: “Gbàdúrà sí Ọlọ́run” sọ ìtọ́sọ́nà àdúrà náà ní Yorùbá àdánidá; “Ṣùgbọ́n” sì ń gbé δέ jáde gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: pé kí ẹ má ṣe ohun búburú kankan
  rationale: Ìkọ̀ emphatic κακὸν μηδέν ni a fi “má ṣe ohun búburú kankan” hàn, láì dín agbára ìwà rere àti búburú inú gbólóhùn náà kù.
- source_word: δόκιμοι φανῶμεν
  choice: kí àwa lè fara hàn bí ẹni tí ó yege nínú ìdánwò
  rationale: δόκιμος ní èrò ẹni tí a ti dán wò tí ó sì yege; φανῶμεν dojú kọ bí wọ́n ṣe lè rí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: τὸ καλὸν ποιῆτε
  choice: kí ẹ̀yin lè ṣe ohun tí ó tọ́
  rationale: Nínú àyíká ìwà rere, τὸ καλόν túmọ̀ sí ohun rere tàbí ohun tí ó tọ́; yíyan “ohun tí ó tọ́” ṣe kedere pé ìṣe ni a ń sọ̀rọ̀ rẹ̀.
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: bí ó tilẹ̀ jẹ́ pé àwa lè dà bí ẹni tí kò yege nínú ìdánwò
  rationale: “Lè dà bí” pa agbára ὡς mọ́ gẹ́gẹ́ bí ìfarahàn tàbí bí a ṣe ń kà wọ́n sí; “kò yege nínú ìdánwò” sì pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú δόκιμοι.
theological_decisions:
- issue: Ìtumọ̀ ὡς ἀδόκιμοι nínú àpèjúwe Pọ́ọ̀lù nípa ara rẹ̀
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí bí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ṣe lè dà tàbí bí a ṣe lè kà wọ́n sí ẹni tí kò yege nínú ìdánwò.
  alternative: A lè ka a sí pé wọ́n wà bí ẹni tí a kò fọwọ́ sí tàbí ẹni tí kò yege, láì fi ọ̀rọ̀ ìfarahàn sí i.
  rationale: Àyíká náà fi δόκιμοι àti ἀδόκιμοι dojú kọ ara wọn nípa ìdánwò àti ìfọwọ́sí. Ìtumọ̀ yìí kò sọ ọ́ di ẹ̀kọ́ nípa ìdálẹ́bi ayérayé, bẹ́ẹ̀ ni kò sì pa àìdánilójú ὡς rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àwọn ọ̀rọ̀ “yege nínú ìdánwò” àti “kò yege nínú ìdánwò” pa ìtakora àwọn ọ̀rọ̀ Gíríìkì δόκιμοι/ἀδόκιμοι mọ́ ní ọ̀nà tí òǹkàwé lasán lè lóye.
