id: 2CO.13.2
reference: 2 Corinthians 13:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: yo
  text: Mo ti sọ tẹ́lẹ̀[a], mo sì ń sọ tẹ́lẹ̀ nísinsìnyí, nígbà tí mi ò sí lọ́dọ̀ yín, gẹ́gẹ́ bí ẹni pé mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì, fún àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀ àti fún gbogbo àwọn yòókù, pé bí mo bá tún dé, èmi kì yóò dá wọn sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣókí sí i, “bí mo bá dé ní ìgbà kẹta.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé, “bí mo bá tún dé,” ṣùgbọ́n àyíká ọ̀rọ̀ nípa àwọn ìbẹ̀wò Pọ́ọ̀lù fi hàn pé ó lè túmọ̀ sí ìbẹ̀wò mìíràn lẹ́yìn èkejì.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Mo ti sọ tẹ́lẹ̀
  rationale: 'Ó pa ìtumọ̀ perfect mọ́: ohun tí Pọ́ọ̀lù ti sọ ṣáájú ṣì ní agbára nísinsìnyí, láì fi ọ̀rọ̀ ‘kìlọ̀’ kun ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ.'
- source_word: προλέγω
  choice: mo sì tún ń sọ ṣáájú
  rationale: ‘Sọ ṣáájú’ tẹ̀lé ìtumọ̀ ọ̀rọ̀ náà, ‘tún’ sì jẹ́ kí ìbátan rẹ̀ pẹ̀lú προείρηκα àti àtúnsọ ìkìlọ̀ náà ṣe kedere ní Yorùbá.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: nísinsìnyí nígbà tí èmi kò sí lọ́dọ̀ yín, gẹ́gẹ́ bí mo ti sọ nígbà tí mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì
  rationale: Ó tú gbólóhùn Gíríìkì tí ó há pọ̀ sí Yorùbá àdánidá, ó sì pa ìyàtọ̀ láàárín wíwà Pọ́ọ̀lù níbẹ̀ lẹ́ẹ̀kejì àti àìsí rẹ̀ nísinsìnyí mọ́.
- source_word: τοῖς προημαρτηκόσιν
  choice: fún àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀
  rationale: Ó fi ẹ̀ṣẹ̀ iṣáájú hàn láì pinnu bóyá wọ́n ti ronú pìwà dà tàbí wọn kò tíì ṣe bẹ́ẹ̀.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: àti fún gbogbo àwọn yòókù
  rationale: Ó pa ìtẹnumọ́ πᾶσιν àti ìyàtọ̀ ẹgbẹ́ kejì tí λοιποί ń tọ́ka sí mọ́.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: bí mo bá tún dé
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ‘bí mo bá tún wá/dé,’ ó sì yẹra fún fífi ‘ìgbà kẹta’ sínú ẹsẹ̀ gẹ́gẹ́ bí ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: οὐ φείσομαι
  choice: èmi kì yóò dá wọn sí
  rationale: ‘Dá wọn sí’ túmọ̀ sí pé kò ní fawọ́ ìgbésẹ̀ líle sẹ́yìn tàbí fi wọ́n sílẹ̀ láì bá wọn wí; arọ́pò-orúkọ náà mú ẹni tí ìkìlọ̀ kan ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n àwọn tí ìkìlọ̀ líle Pọ́ọ̀lù kan
  choice: Ìkìlọ̀ náà dé ọ̀dọ̀ àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀ àti gbogbo àwọn yòókù; bí Pọ́ọ̀lù bá dé, kò ní dá àwọn tí ìkìlọ̀ náà bá sí.
  alternative: Kí a ka ‘èmi kì yóò dá wọn sí’ sí àwọn tí wọ́n ṣẹ̀ tẹ́lẹ̀ nìkan, tàbí sí lílo àṣẹ aposteli ní gbogbogbò láì sọ ẹni tí yóò kan.
  rationale: Ìṣètò ọ̀rọ̀ náà darúkọ ẹgbẹ́ méjèèjì gẹ́gẹ́ bí olùgbà ìkìlọ̀. Ìtumọ̀ náà pa ìwọ̀n gbooro yìí mọ́, ṣùgbọ́n kò sọ irú ìbáwí tàbí ètò ìjọ kan pàtó.
- issue: Bóyá ìbẹ̀wò tí ń bọ̀ jẹ́ ìgbà kẹta
  choice: Ọ̀rọ̀ inú ẹsẹ̀ ni ‘bí mo bá tún dé,’ a sì fi àlàyé ‘ìgbà kẹta’ sínú àlàyé ìsàlẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí ‘bí mo bá dé ní ìgbà kẹta.’
  rationale: Gíríìkì sọ πάλιν, ‘lẹ́ẹ̀kan sí i/tún,’ nígbà tí àyíká ọ̀rọ̀ lè tọ́ka sí ìbẹ̀wò kẹta. Fífi ọ̀rọ̀ gangan sínú ẹsẹ̀ àti ìtumọ̀ àyíká sínú àlàyé pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘lọ́dọ̀ yín’ láti sọ presence/absence ní ọ̀nà àdánidá, a sì yẹra fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó. Àmì ohùn àti àmì abẹ́lẹ̀ wà níbi tí wọ́n ti yẹ.
