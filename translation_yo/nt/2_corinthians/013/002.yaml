revisions:
- from: 'Mo ti sọ tẹ́lẹ̀[a], mo sì tún ń sọ ṣáájú nísinsìnyí nígbà tí èmi kò sí lọ́dọ̀ yín, gẹ́gẹ́ bí mo ti sọ nígbà tí mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì, fún àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀ àti fún gbogbo àwọn yòókù pé: bí mo bá tún dé, èmi kì yóò dá wọn sí.'
  to: Mo ti sọ tẹ́lẹ̀[a], mo sì ń sọ tẹ́lẹ̀ nísinsìnyí, nígbà tí mi ò sí lọ́dọ̀ yín, gẹ́gẹ́ bí ẹni pé mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì, fún àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀ àti fún gbogbo àwọn yòókù, pé bí mo bá tún dé, èmi kì yóò dá wọn sí.
  rationale: The revision preserves the Greek contrast between Paul's second in-person presence and his current absence, rather than introducing a past act of speaking. It also removes the extra iterative sense from προλέγω while retaining the deliberate verbal parallel through “sọ tẹ́lẹ̀.” The footnote correctly preserves the contextual possibility of a third visit without making it the verse's explicit wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the prior statement, the persons addressed, the conditional future visit, and Paul''s resolve not to spare. However, “gẹ́gẹ́ bí mo ti sọ nígbà tí mo wà...” changes the comparison: the Greek compares Paul''s present/absent status, not a prior act of speaking. “tún” with προλέγω also unnecessarily adds an ‘again’ nuance.'
  naturalness: Most of the draft is readable Standard Yoruba. The revised wording makes the compressed παροὺν/ἀπὼν contrast clearer and more natural without adding an action absent from the Greek.
  terminology: “àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀,” “gbogbo àwọn yòókù,” “bí mo bá tún dé,” and “kì yóò dá wọn sí” are suitable. “Dá wọn sí” appropriately expresses refusing to spare or show leniency in this warning context.
  issues:
  - severity: medium
    issue: The clause “gẹ́gẹ́ bí mo ti sọ nígbà tí mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì” renders the phrase as a comparison with what Paul said on the second visit.
    rationale: Greek ὡς παρὼν τὸ δεύτερον contrasts Paul's being present on the second occasion with his being absent now; it does not state “as I said.”
  - severity: low
    issue: “tún” in “mo sì tún ń sọ ṣáájú” adds an explicit repetition nuance to προλέγω.
    rationale: The verb means ‘say beforehand’; lexical continuity and contextual warning can be retained without supplying ‘again.’
  revised_text: Mo ti sọ tẹ́lẹ̀[a], mo sì ń sọ tẹ́lẹ̀ nísinsìnyí, nígbà tí mi ò sí lọ́dọ̀ yín, gẹ́gẹ́ bí ẹni pé mo wà lọ́dọ̀ yín lẹ́ẹ̀kejì, fún àwọn tí wọ́n ti ṣẹ̀ tẹ́lẹ̀ àti fún gbogbo àwọn yòókù, pé bí mo bá tún dé, èmi kì yóò dá wọn sí.
  revised_footnotes:
