    reason: alternative_reading
  revision_rationale: The revision preserves the Greek contrast between Paul's second in-person presence and his current absence, rather than introducing a past act of speaking. It also removes the extra iterative sense from προλέγω while retaining the deliberate verbal parallel through “sọ tẹ́lẹ̀.” The footnote correctly preserves the contextual possibility of a third visit without making it the verse's explicit wording.
