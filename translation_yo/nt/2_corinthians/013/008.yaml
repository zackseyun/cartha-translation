- from: Nítorí a kò lè ṣe ohunkóhun lòdì sí òtítọ́[a], ṣùgbọ́n fún òtítọ́ ni a lè ṣe é.
  to: Nítorí a kò lè ṣe ohunkóhun lòdì sí òtítọ́[a], ṣùgbọ́n ohun tí a lè ṣe, ó jẹ́ fún òtítọ́.
  rationale: 'A rọ́pò “fún òtítọ́ ni a lè ṣe é” pẹ̀lú ìfararora Yorùbá tí ó ṣe kedere: “ohun tí a lè ṣe, ó jẹ́ fún òtítọ́.” Èyí pa ìtakora Gíríìkì mọ́, kò ṣàfikún ẹ̀kọ́ tàbí ìdí tuntun, ó sì yẹra fún ìtòkasí “é” tí kò ṣe kedere. A tún ṣàtúnṣe gbolohun àlàyé ẹsẹ̀-ìsàlẹ̀ kí ó jẹ́ Yorùbá adayeba.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:57Z'
