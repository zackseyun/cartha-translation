  source_fidelity: Ìdá akọkọ náà jẹ́ olóòtítọ́ sí οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας. Ní ìdá kejì, Gíríìkì náà fi ọ̀rọ̀-ìṣe náà sílẹ̀ nítorí ìfararora; ìtúmọ̀ náà gbọ́dọ̀ tún ìfararora náà hàn láìsọ pé ohun kan pàtó ni “é” ń tọ́ka sí.
  naturalness: “Fún òtítọ́ ni a lè ṣe é” lè yọrí sí ìbéèrè nípa ohun tí “é” ń tọ́ka sí, ó sì dín ìtakora gbooro ti τι kù. “Ṣùgbọ́n ohun tí a lè ṣe, ó jẹ́ fún òtítọ́” jẹ́ Yorùbá adayeba, ó sì mú ìfararora ìdá kejì náà hàn.
  terminology: “Òtítọ́,” “lòdì sí,” àti “fún” dára, wọ́n sì pa ìtumọ̀ gbòòrò ti ἀλήθεια àti ìtakora κατά/ὑπέρ mọ́. A kò fi ẹ̀kọ́ ìjọ kankan kún un.
