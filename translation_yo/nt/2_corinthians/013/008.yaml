  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: yo
  text: Nítorí a kò lè ṣe ohunkóhun lòdì sí òtítọ́[a], ṣùgbọ́n ohun tí a lè ṣe, ó jẹ́ fún òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò lè ṣe ohunkóhun lòdì sí òtítọ́, bí kò ṣe láti ṣe ìtìlẹ́yìn fún òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: γάρ ń ṣàlàyé ìdí ọ̀rọ̀ tó ṣáájú; “Nítorí” jẹ́ àsopọ̀ Yorùbá tó ṣe kedere, “kò” sì fi ìsẹ́nilọ́rọ̀ οὐ hàn.
- source_word: δυνάμεθά τι
  choice: a kò lè ṣe ohunkóhun
  rationale: δύναμαι sọ nípa agbára tàbí àǹfààní láti ṣe ohun kan, τι sì túmọ̀ sí “ohunkóhun” lábẹ́ ìsẹ́nilọ́rọ̀. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ orísun mọ́.
- source_word: κατὰ τῆς ἀληθείας
  choice: lòdì sí òtítọ́
  rationale: κατά pẹ̀lú ẹ̀yà ọ̀rọ̀ genitive níbí ní ìtumọ̀ ìtakò; “lòdì sí” mú ìtumọ̀ yẹn jáde. “Òtítọ́” kò dín ọ̀rọ̀ náà kù sí ẹ̀kọ́ pàtó kan.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: ἀλλά fi ìyàtọ̀ tó lágbára hàn láàárín ohun tí ó lòdì sí òtítọ́ àti ohun tí ó wà fún òtítọ́.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: fún òtítọ́ ni a lè ṣe é
  rationale: ὑπέρ níbí túmọ̀ sí wíwà fún tàbí ṣíṣe àtìlẹ́yìn fún òtítọ́. Àtúnlò “a lè ṣe é” ní Yorùbá mú gbólóhùn tí Gíríìkì fi sílẹ̀ láìtún ọ̀rọ̀-ìṣe sọ di kedere, láìfi “kìkì” kún un.
theological_decisions:
- issue: Ìtumọ̀ “òtítọ́” nínú ìtakora Pọ́ọ̀lù
  choice: A pa “òtítọ́” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó ní ìwọ̀n ìtumọ̀ gbòòrò.
  alternative: “òtítọ́ ìhìn rere” tàbí “ohun tí ó jẹ́ òtítọ́”
  rationale: Àyíká ọ̀rọ̀ ní í ṣe pẹ̀lú ìhìn rere àti ohun tí Ọlọ́run fẹ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò dín “òótọ́” kù sí àgbékalẹ̀ ẹ̀kọ́ pàtó kan. Ìtumọ̀ yìí pa ìwọ̀n àti agbára ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìṣọ̀kan “lòdì sí ... fún ...” pa ìtakora kúkúrú inú Gíríìkì mọ́, nígbà tí “ni a lè ṣe é” mú àkójọpọ̀ ọ̀rọ̀ náà jẹ́ Yorùbá àdánidá.
