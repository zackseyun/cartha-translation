source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: yo
  text: 'Nítorí inú wa máa ń dùn nígbà tí àwa bá jẹ́ aláìlera, tí ẹ̀yin sì jẹ́ alágbára. Èyí pẹ̀lú ni àwa ń gbàdúrà fún: ìmúpadàbọ̀ yín sí ipò tí ó yẹ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdàgbàsókè yín dé ìwà-tó-dàgbà” tàbí “mímú yín dé ipò pípé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìmúpadàbọ̀, ìpèsè, tàbí mímú ohun kan dé ipò tí ó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: inú wa máa ń dùn
  rationale: Ó fi ayọ̀ Pọ́ọ̀lù hàn ní èdè Yorùbá àdánidá, ó sì bá ìṣe àsìkò ìsinsìnyí àti ìtumọ̀ gbogbogbò ti gbólóhùn ὅταν mu.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ láàárín ẹsẹ yìí àti ọ̀rọ̀ tó ṣáájú.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣẹ̀lẹ̀ gbogbogbò tàbí èyí tó lè máa ṣẹlẹ̀ lẹ́ẹ̀kọ̀ọ̀kan.
- source_word: ἀσθενῶμεν
  choice: àwa bá jẹ́ aláìlera
  rationale: Ó pa ìtumọ̀ àìlera mọ́ láì fi dandan sọ bóyá ti ara, ti ipò láwùjọ, tàbí ti bí àwọn ènìyàn ṣe ń wo iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù ni.
- source_word: δυνατοὶ
  choice: alágbára
  rationale: Ó jẹ́ òdìkejì aláìlera ní kedere, ó sì lè tọ́ka sí okun tàbí agbára láì dín ìtumọ̀ náà kù.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Ohun tí àwa sì ń gbàdúrà fún nìyí pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ tó wà lórí τοῦτο mọ́, ó sì tú εὐχόμεθα sí ọ̀rọ̀ àdúrà ní Yorùbá àdánidá.
- source_word: κατάρτισιν
  choice: kí a mú yín padà sí ipò yíyẹ
  rationale: Ó mú èrò títún ohun ṣe, mímú un péye, tàbí mímú un dé ipò tó yẹ jáde, ní ìbámu pẹ̀lú àníyàn olùṣọ́-àgùntàn nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ κατάρτισις gẹ́gẹ́ bí ohun tí Pọ́ọ̀lù ń fẹ́ fún àwọn ará Kọ́ríńtì
  choice: kí a mú yín padà sí ipò yíyẹ
  alternative: ìdàgbàsókè yín dé ìwà-tó-dàgbà tàbí mímú yín péye
  rationale: Yíyan yìí bá àyíká ìtọ́nisọ́nà àti àtúnṣe mu, ṣùgbọ́n kò sọ pé ìtumọ̀ náà jẹ́ ẹ̀kọ́ pàtó nípa àìlẹ́ṣẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “inú wa máa ń dùn” àti “nígbà tí ... bá” fún ìṣàn èdè àdánidá; a fi “àwa” àti “ẹ̀yin” hàn láti pa ìtakora ìtumọ̀ Gíríìkì mọ́.
