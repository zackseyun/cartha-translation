  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtakora tó wà nínú Gíríìkì láàárín àìlera Pọ́ọ̀lù àti agbára àwọn ará Kọ́ríńtì, pẹ̀lú àdúrà rẹ̀ fún κατάρτισις wọn, jáde dáadáa. Ṣùgbọ́n àmì àlàyé ìsàlẹ̀ ojú-ìwé wà lẹ́yìn “alágbára,” nígbà tí àlàyé náà jẹ́ nípa κατάρτισις, èyí tí ó wà ní òpin ẹsẹ náà. A tún ṣe ìtumọ̀ gbolohun κατάρτισις ní kedere sí ọ̀nà tí ó jẹ́ ti ẹni tí a mú padà sí ipò tí ó yẹ, láì dín ìtumọ̀ rẹ̀ sí àtúnṣe ìbáṣepọ̀ nìkan.
  naturalness: “Èyí pẹ̀lú ni àwa ń gbàdúrà fún” jẹ́ ìṣàn Yorùbá tí ó rọrùn, ó sì ń pa ìtẹnumọ́ τοῦτο καὶ mọ́. “Ìmúpadàbọ̀ yín sí ipò tí ó yẹ” jẹ́ ọ̀rọ̀ boṣewa tí ó dára ju “pé kí a mú yín padà sí ipò yíyẹ,” nítorí ó ń jẹ́ kí κατάρτισις dúró gẹ́gẹ́ bí ohun tí a ń gbàdúrà fún, kì í sì í fi olùṣe kan tí Gíríìkì kò sọ hàn.
  terminology: “Aláìlera” àti “alágbára” ń dá ìtakora ἀσθενῶμεν/dυνατοὶ hàn dáadáa. “Ìmúpadàbọ̀ ... sí ipò tí ó yẹ” ń yẹ fún κατάρτισις ní àyíká yìí; àlàyé ìsàlẹ̀ ojú-ìwé ń pa àwọn ìṣàmúlò tó jọmọ́ ìdàgbàsókè, ìpèsè, àti mímú dé ipò tó yẹ mọ́.
