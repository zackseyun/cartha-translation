id: 2CO.13.4
reference: 2 Corinthians 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: yo
  text: Nítorí pé a kàn án mọ́ àgbélébùú nínú àìlera[a], ṣùgbọ́n ó wà láàyè nípa agbára Ọlọ́run. Nítorí àwa náà jẹ́ aláìlera nínú rẹ̀, ṣùgbọ́n àwa yóò wà láàyè pẹ̀lú rẹ̀[c] nípa agbára Ọlọ́run[b] sí yín[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú àìlera.” Ọ̀rọ̀ Gíríìkì ἐξ lè sọ orísun tàbí ìpìlẹ̀, bí ó tilẹ̀ jẹ́ pé “nínú àìlera” jẹ́ ọ̀nà Yorùbá tí ó rọrùn sí i níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti inú agbára Ọlọ́run.” Ọ̀rọ̀ Gíríìkì tún lo ἐκ láti fi agbára Ọlọ́run dojú kọ àìlera ní ọ̀nà tí a mọ̀ọ́mọ̀ ṣe.
    reason: lexical_alternative
  - marker: c
    text: “Àwa yóò wà láàyè pẹ̀lú rẹ̀” lè tọ́ka sí bí ìwàláàyè tí Kristi fi agbára fún àwọn aṣojú rẹ̀ yóò ṣe farahàn ní ìbáṣepọ̀ wọn pẹ̀lú àwọn ará Kọ́ríńtì lọ́jọ́ iwájú; ó sì lè tún jẹ́ ìránnilétí àwọn kókó ìyè àjíǹde tí ó gbòòrò.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “fún yín,” “láàárín yín,” tàbí “ní ti yín.” Gbólóhùn Gíríìkì εἰς ὑμᾶς ṣókùnkùn díẹ̀, ó sì lè sọ ìdarí, ìbáṣepọ̀, tàbí àbájáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: a kàn án mọ́ àgbélébùú
  rationale: Ó pa ìṣe àìṣe-tara ẹni náà mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé a crucify ẹni kan.
- source_word: ἐξ ἀσθενείας
  choice: nínú àìlera
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ipò tàbí ọ̀nà àìlera tí ikú lórí àgbélébùú fi ṣẹlẹ̀, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ orísun tàbí ìpìlẹ̀ inú ἐξ hàn.
- source_word: ζῇ
  choice: ó wà láàyè
  rationale: Ó fi ìṣe àsìkò ìsinsìnyí àti ìwàláàyè tí ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: nípa agbára Ọlọ́run
  rationale: ‘Nípa’ sọ ohun èlò tàbí agbára tí ó mú ìwàláàyè ṣẹ̀ ní kedere; àlàyé ìsàlẹ̀ tọ́ka sí pé ἐκ tún lè tẹnu mọ́ orísun agbára náà.
- source_word: ἀσθενοῦμεν
  choice: àwa náà jẹ́ aláìlera
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἀσθένεια, láì sọ ọ́ di àìlágbára pátápátá tàbí àìníyì.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù nípa wíwà ‘nínú’ Kristi mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ζήσομεν
  choice: àwa yóò wà láàyè
  rationale: Ó pa àsìkò ọjọ́ iwájú mọ́, kò sì pinnu bóyá iṣẹ́ aposteli ní ọjọ́ iwájú tàbí ìyè àjíǹde nìkan ni a ń tọ́ka sí.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ó fi ìbákẹ́gbẹ́ àti ìkópa tí σύν ń sọ hàn ní ṣókí.
- source_word: εἰς ὑμᾶς
  choice: sí yín
  rationale: Ó pa ìdarí àti ìbáṣepọ̀ gbólóhùn Gíríìkì tí ó ṣókùnkùn díẹ̀ mọ́; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn.
theological_decisions:
- issue: Ìtumọ̀ ‘àìlera’ Kristi nígbà ìkànmọ́ àgbélébùú
  choice: A fi ọ̀rọ̀ ‘nínú àìlera’ sílẹ̀ gẹ́gẹ́ bí ìyàtọ̀ tí Pọ́ọ̀lù dá sí ‘agbára Ọlọ́run.’
  alternative: A lè túmọ̀ rẹ̀ lọ́nà tí yóò fi tẹnu mọ́ bí ènìyàn ṣe rí àìlera náà nìkan.
  rationale: Ọ̀rọ̀ náà kò sẹ́ ìwà Ọlọ́run tàbí àìlẹ́ṣẹ̀ Kristi; ó ń gbé àdììtú ikú rẹ̀ nínú àìlera àti ìyè rẹ̀ nípa agbára Ọlọ́run kalẹ̀.
- issue: Ohun tí ‘àwa yóò wà láàyè pẹ̀lú rẹ̀’ ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ ní fífẹ̀ tó láti kan ìgbésí ayé àti agbára iṣẹ́ Pọ́ọ̀lù sí àwọn ará Kọ́ríńtì, àti láti tún dún bí èdè ìyè àjíǹde.
  alternative: Kí a fi mọ́ àjíǹde ọjọ́ iwájú nìkan, tàbí kí a fi mọ́ iṣẹ́ aposteli ní ìsinsìnyí nìkan.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí bí Pọ́ọ̀lù yóò ṣe bá àwọn ará Kọ́ríńtì lò, ṣùgbọ́n èdè wíwà pẹ̀lú Kristi tún ní ìbáṣepọ̀ pẹ̀lú àjíǹde; ìtumọ̀ náà kò dá ọ̀kan ṣoṣo lára wọn mú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ọ̀rọ̀ ìjọsìn tí ó wọ́pọ̀ ‘àgbélébùú’ àti gbólóhùn àdánidá ‘wà láàyè,’ nígbà tí a pa ìṣọ̀kan ‘nínú rẹ̀/pẹ̀lú rẹ̀’ àti ìṣókùnkùn ‘sí yín’ mọ́.
