id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: yo
  text: níwọ̀n bí ẹ ń wá ẹ̀rí pé Mèsáyà ń sọ̀rọ̀ nínú mi[a]—ẹni tí kò ṣe aláìlera sí yín, ṣùgbọ́n tí ó lágbára nínú yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé Mèsáyà ń sọ̀rọ̀ nípasẹ̀ mi.” Gíríìkì sọ ní tààrà sí i pé, “Mèsáyà tí ń sọ̀rọ̀ nínú mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó lágbára láàárín yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: níwọ̀n bí
  rationale: Ó fi ìdí tí Pọ́ọ̀lù fi máa hùwà líle nígbà tó bá dé hàn; gbólóhùn yìí sì bójú mu èrò ‘since/because’ ní Yorùbá àdánidá.
- source_word: δοκιμὴν ζητεῖτε
  choice: ẹ ti ń wá ẹ̀rí
  rationale: ‘Ẹ̀rí’ níhìn-ín túmọ̀ sí ohun tí ń fi òtítọ́ ọ̀rọ̀ kan múlẹ̀, kì í ṣe ìlànà dídán an wò; ‘ń wá’ sì pa ìtẹ̀síwájú ìṣe náà mọ́.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: pé Mèsáyà ń sọ̀rọ̀ nínú mi
  rationale: A sọ àkójọpọ̀ gírámà Gíríìkì náà di gbólóhùn àkóónú Yorùbá tó ṣe kedere. ‘Nínú mi’ tẹ̀ lé ἐν ἐμοί láì pinnu pé ‘nípasẹ̀ mi’ nìkan ni ó túmọ̀ sí.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró níhìn-ín; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: kì í ṣe aláìlera sí yín
  rationale: Ó pa ìtọ́sọ́nà/ìbáṣepọ̀ εἰς ὑμᾶς àti àtakò pàtàkì láàárín àìlera àti agbára mọ́.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: ṣùgbọ́n tí ó lágbára nínú yín
  rationale: ‘Lágbára’ jẹ́ Yorùbá àdánidá fún ọ̀rọ̀-ìṣe δυνατεῖ, ó sì dojú kọ ‘aláìlera’ ní tààrà; ‘nínú yín’ tẹ̀ lé ἐν ὑμῖν, bó tilẹ̀ jẹ́ pé ‘láàárín yín’ tún ṣeé ṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká gbólóhùn yìí, ọ̀rọ̀ náà lè ṣiṣẹ́ bí oyè. ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn láì kọ ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan sínú ẹsẹ náà.
- issue: Agbára ἐν nínú ἐν ἐμοί àti ἐν ὑμῖν
  choice: ‘nínú mi’ àti ‘nínú yín’
  alternative: ‘nípasẹ̀ mi’ àti/tàbí ‘láàárín yín’
  rationale: Ìtumọ̀ pàtàkì náà pa àwòrán ibi/inú ti Gíríìkì mọ́. Àwọn àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ aṣojú tàbí ti àwùjọ mọ́, kí a má bàa fi tipátipá yanjú bóyá Kristi ń sọ̀rọ̀ nípasẹ̀ Pọ́ọ̀lù tàbí ń bẹ nínú rẹ̀, àti bóyá agbára rẹ̀ ń ṣiṣẹ́ nínú àwọn ará tàbí láàárín ìjọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ẹ’ àti ‘yín’ fún ọ̀pọ̀ ènìyàn. Dàáṣì náà pa ìyípadà sí àlàyé nípa Mèsáyà mọ́, a sì fi fọ́nrán [a] àti [b] sí ibi tí ọ̀kọ̀ọ̀kan jẹ mọ́.
