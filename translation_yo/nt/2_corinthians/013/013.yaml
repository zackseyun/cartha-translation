id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa Jésù Mèsáyà[a], àti ìfẹ́ Ọlọ́run, àti ìdàpọ̀ Ẹ̀mí Mímọ́[b], wà pẹ̀lú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “ìrẹ́pọ̀ Ẹ̀mí Mímọ́” tàbí “ìkópa nínú Ẹ̀mí Mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún χάρις nínú ọ̀rọ̀ ìbùkún Kristẹni; ó pa ìtumọ̀ inú rere tí a fi fúnni lọ́fẹ̀ẹ́ àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ àdánidá àti ọ̀wọ̀ fún κύριος gẹ́gẹ́ bí orúkọ oyè Jésù níbí.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níbí, kì í ṣe orúkọ ìdílé lásán; “Mèsáyà” mú ìtumọ̀ ẹni tí a yàn ní òróró jáde, nígbà tí àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìbámu Yorùbá tó ṣe kedere, tó sì bójú mu fún ἀγάπη nínú ìbùkún yìí.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: A pa ìsopọ̀ oníjẹ́nífẹ̀ẹ́ Gíríìkì náà mọ́ gẹ́gẹ́ bí “ìfẹ́ Ọlọ́run,” láì fi tipátipá sọ bóyá ó túmọ̀ sí ìfẹ́ tí Ọlọ́run ní sí wa tàbí ìfẹ́ tí ó ní í ṣe pẹ̀lú Ọlọ́run.
- source_word: κοινωνία
  choice: ìdàpọ̀
  rationale: “Ìdàpọ̀” lè gbé èrò ìrẹ́pọ̀, àjọpín, àti ìkópa tí κοινωνία ní, láì dín ìtumọ̀ rẹ̀ kù sí ọ̀nà kan ṣoṣo.
- source_word: ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá òde òní tí ó dúró ṣinṣin fún orúkọ ẹni mímọ́ tí ẹsẹ náà ń tọ́ka sí.
- source_word: μετὰ πάντων ὑμῶν
  choice: wà pẹ̀lú gbogbo yín
  rationale: “Pẹ̀lú” fi ìtumọ̀ ìwàníhìn-ín tàbí àjọwà μετά hàn, “gbogbo yín” sì pa πάντων mọ́, kí àkópọ̀ gbogbo àwọn olùgbọ́ má bàa sọnù.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ gẹ́gẹ́ bí orúkọ oyè Kristẹni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ìbámu pẹ̀lú mímú ìtumọ̀ orúkọ oyè jáde, “Mèsáyà” ni a lò nínú ọ̀rọ̀ pàtàkì. “Kristi,” èyí tí ó ti di ìlò ìbílẹ̀ nínú Yorùbá, ni a pa mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ κοινωνία τοῦ ἁγίου πνεύματος
  choice: ìdàpọ̀ Ẹ̀mí Mímọ́
  alternative: ìrẹ́pọ̀ Ẹ̀mí Mímọ́; ìkópa nínú Ẹ̀mí Mímọ́
  rationale: Ìsopọ̀ ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdàpọ̀ tí Ẹ̀mí ń mú wá, ìrẹ́pọ̀ pẹ̀lú Ẹ̀mí, tàbí ìkópa nínú Ẹ̀mí. “Ìdàpọ̀ Ẹ̀mí Mímọ́” pa ìwọ̀n ìtumọ̀ náà àti àìdánilójú rẹ̀ mọ́ láì yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìṣètò ìbùkún “Kí … wà” jẹ́ àdánidá ní Yorùbá, ó sì ṣàfihàn ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ láìsọ ní kedere. A tún pa àtúnṣe mẹ́ta tí καὶ ń so pọ̀ mọ́ nípasẹ̀ “àti … àti … àti,” kí ìwọ̀ntúnwọ̀nsì gbólóhùn orísun lè hàn.
