id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: yo
  text: 'Èyí ni ìgbà kẹta tí mo ń bọ̀ sí ọ̀dọ̀ yín: “Lórí ẹ̀rí àwọn ẹlẹ́rìí méjì tàbí mẹ́ta ni a ó fi ìdí gbogbo ọ̀ràn múlẹ̀.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Lórí ẹnu àwọn ẹlẹ́rìí méjì tàbí mẹ́ta ni gbogbo ọ̀rọ̀ yóò fi dúró.” Ọ̀rọ̀ Gíríìkì náà tẹ̀ lé ọ̀nà tí Diutarónómì 19:15 gbà sọ ọ́, ó sì lo àṣà ọ̀rọ̀ òfin.
    reason: lexical_alternative
  - marker: b
    text: Èyí tọ́ka sí Diutarónómì 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Èyí ni ìgbà kẹta
  rationale: Gbólóhùn náà ń tọ́ka sí ìgbà kẹta tí Pọ́ọ̀lù yóò wá; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa iye ordinal náà mọ́.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: tí mo ń bọ̀ wá sọ́dọ̀ yín
  rationale: Ó fi ìṣírí ìsinsìnyí tó ń tọ́ka sí ìbẹ̀wò tó ń bọ̀ hàn, láì fi kún un pé ó ti wà lójú ọ̀nà.
- source_word: ἐπὶ στόματος
  choice: Lórí ẹ̀rí
  rationale: Èyí mú ọ̀rọ̀ òfin náà yé ni Yorùbá òde òní; ìtumọ̀ gangan ‘lórí ẹnu’ lè ṣókùnkùn, ṣùgbọ́n a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: àwọn ẹlẹ́rìí méjì tàbí mẹ́ta
  rationale: Bí ó tilẹ̀ jẹ́ pé καί túmọ̀ sí ‘àti’ ní ọ̀pọ̀ ìgbà, nínú àgbékalẹ̀ òfin tí a fa yọ yìí ó ní agbára pínpín ‘méjì tàbí mẹ́ta,’ kì í ṣe àpapọ̀ márùn-ún.
- source_word: σταθήσεται
  choice: ni a ó fi ìdí ... múlẹ̀
  rationale: Ọ̀rọ̀ ọjọ́ iwájú aláìṣe náà ní ìtumọ̀ òfin pé ọ̀ràn kan yóò dúró gẹ́gẹ́ bí ohun tí a ti fìdí rẹ̀ múlẹ̀.
- source_word: πᾶν ῥῆμα
  choice: gbogbo ọ̀ràn
  rationale: ῥῆμα lè jẹ́ ‘ọ̀rọ̀’ tàbí ‘gbólóhùn,’ ṣùgbọ́n nínú àyọlò òfin yìí ‘ọ̀ràn’ mú ìtumọ̀ rẹ̀ jáde kedere láì dín un kù sí ẹ̀sùn nìkan.
theological_decisions:
- issue: Lílo àyọlò òfin láti inú Diutarónómì nínú ọ̀rọ̀ ìbáwí Pọ́ọ̀lù
  choice: A túmọ̀ πᾶν ῥῆμα sí ‘gbogbo ọ̀ràn,’ kí ìlànà òfin náà lè dúró ní fífẹ̀ rẹ̀.
  alternative: ‘gbogbo ọ̀rọ̀’ tàbí ‘gbogbo ẹ̀sùn’
  rationale: ‘Gbogbo ọ̀rọ̀’ sun mọ́ ọ̀rọ̀-orísun jù, ṣùgbọ́n ó lè dà bí ẹni pé ọ̀rọ̀ ẹnu lásán ni; ‘gbogbo ẹ̀sùn’ sì máa dín ohun tí Gíríìkì lè túmọ̀ sí kù. ‘Gbogbo ọ̀ràn’ pa agbára òfin àti àìdájú tó yẹ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹlẹ́rìí’ àti ‘fi ìdí ... múlẹ̀’ fún ìforúkọsílẹ̀ òfin, láì fi ẹ̀kọ́ ìjọ kan pàtó kún ọ̀rọ̀ náà.
