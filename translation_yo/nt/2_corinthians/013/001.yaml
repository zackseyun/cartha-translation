review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the third impending visit and the Deuteronomic legal maxim. ‘Gbogbo ọ̀ràn’ appropriately communicates πᾶν ῥῆμα in its legal setting without restricting it to an accusation, and ‘lórí ẹ̀rí’ is a clear idiomatic rendering of ἐπὶ στόματος.
  naturalness: The main needed improvement is idiomatic economy in the arrival clause. ‘Mo ń bọ̀ sí ọ̀dọ̀ yín’ naturally expresses ‘I am coming to you’; adding ‘wá’ is unnecessary and can sound spatially over-specified in this context. The remainder is clear, formal, and natural Standard Yoruba.
  terminology: ‘Ẹlẹ́rìí,’ ‘ọ̀ràn,’ and ‘fi ìdí ... múlẹ̀’ are suitable legal-register terms. The footnotes correctly retain the literal ‘ẹnu’ alternative and identify the allusion to Deuteronomy 19:15.
  issues:
  - severity: low
    issue: The phrase ‘mo ń bọ̀ wá sọ́dọ̀ yín’ is somewhat redundant.
    rationale: For an intended visit, Standard Yoruba more idiomatically says ‘mo ń bọ̀ sí ọ̀dọ̀ yín.’ This preserves the Greek present/futuristic-present force without adding a directional nuance.
