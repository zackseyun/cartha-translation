id: HEB.5.7
reference: Hebrews 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: yo
  text: ẹni tí, ní àwọn ọjọ́ ìgbé ayé rẹ̀ nínú ara, rú àdúrà àti ẹ̀bẹ̀ pẹ̀lú ìkígbe líle àti omijé sí ẹni tí ó lè gbà á là kúrò nínú ikú[a]; a sì gbọ́ ẹ̀bẹ̀ rẹ̀ nítorí ìbọ̀wọ̀ rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Gbà á là kúrò nínú ikú’ tún lè túmọ̀ sí ‘gbà á jáde kúrò nínú ikú,’ ìyẹn ni, dá a sílẹ̀ nípasẹ̀ àjíǹde.
    reason: alternative_reading
  - marker: b
    text: Tàbí, ‘nítorí ìbẹ̀rù Ọlọ́run rẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: ní àwọn ọjọ́ ìgbé ayé rẹ̀ nínú ara
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ lórí ìwàláàyè nínú ara, ó sì jẹ́ Yorùbá àdánidá ju gbolohun líle bí ‘ní àwọn ọjọ́ ẹran ara rẹ̀’ lọ.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: àdúrà àti ẹ̀bẹ̀
  rationale: ‘Àdúrà’ jẹ́ ọ̀rọ̀ gbogbogbò fún ìbánisọ̀rọ̀ pẹ̀lú Ọlọ́run, ‘ẹ̀bẹ̀’ sì fi ìtẹnumọ́ ìbéèrè onítara hàn, nípa bẹ́ẹ̀ ó pa ìyàtọ̀ kékeré láàárín àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: pẹ̀lú igbe líle àti omijé
  rationale: Ó ṣàfihàn agbára κραυγῆς ἰσχυρᾶς àti ìbànújẹ́ tí omijé ń fi hàn ní Yorùbá tó ṣe kedere.
- source_word: προσενέγκας
  choice: rú
  rationale: ‘Rú’ lè túmọ̀ sí gbé ohun lọ fún ẹnì kan, ó sì tún pa ìró ìrúbọ tó bá àyíká iṣẹ́ àlùfáà nínú Hébérù mu mọ́ láìfi ìtumọ̀ yẹn tipátipá lé ẹsẹ náà.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: sí ẹni tí ó lè gbà á là kúrò nínú ikú
  rationale: Ó tẹ̀lé ìṣe alápapọ̀ Gíríìkì ‘ẹni tí ó lè,’ ó sì jẹ́ kí ἐκ θανάτου ní ààyè láti tọ́ka sí dídá a sí láti kú tàbí gbígbà á jáde kúrò nínú ikú.
- source_word: εἰσακουσθεὶς
  choice: a sì gbọ́ tirẹ̀
  rationale: Ọ̀nà àìdárúkọ olùṣe yìí pa ohùn àìṣe Gíríìkì mọ́, ó sì ń fi hàn pé a tẹ́tí sí ẹ̀bẹ̀ rẹ̀ pẹ̀lú ojú rere láìsọ irú ìdáhùn tí ó rí.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: nítorí ọ̀wọ̀ jíjinlẹ̀ tí ó ní
  rationale: Ó tú εὐλάβεια sí ọ̀wọ̀ ọlọ́wọ̀n sí Ọlọ́run ní èdè Yorùbá òde òní, láìfi ‘ìtẹríba’ kún ọ̀rọ̀ Gíríìkì tàbí yanjú ìtumọ̀ rẹ̀ ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀπὸ τῆς εὐλαβείας nípa Jesu
  choice: nítorí ọ̀wọ̀ jíjinlẹ̀ tí ó ní
  alternative: nítorí ìbẹ̀rù Ọlọ́run rẹ̀
  rationale: εὐλάβεια lè jẹ́ ọ̀wọ̀ jíjinlẹ̀, ìfọkànsìn, tàbí ìbẹ̀rù Ọlọ́run. Ọ̀rọ̀ inú ẹsẹ yan ìtumọ̀ tó ṣe kedere láìsọ pé Jesu ní ìbẹ̀rù búburú; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- issue: Ìwọ̀n ìtumọ̀ ‘gbà á là kúrò nínú ikú’
  choice: fi gbolohun náà sílẹ̀ láìsọ bóyá ó jẹ́ dídá a sí láti kú tàbí gbígbà á jáde kúrò nínú ikú
  alternative: gbà á jáde kúrò nínú ikú, ìyẹn nípasẹ̀ àjíǹde
  rationale: ἐκ θανάτου lè gba ìtumọ̀ méjèèjì. Kíkọ ọ̀kan ṣoṣo sínú ẹsẹ yóò yanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì fúnra rẹ̀ kò yanjú.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa ìṣàn gbolohun alápapọ̀ tó ń bá ẹsẹ tó yí i ká lọ mọ́; nítorí náà, ọ̀rọ̀ náà bẹ̀rẹ̀ pẹ̀lú ‘ẹni tí’ ó sì parí pẹ̀lú àmì kọ́mà. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ìwé wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
