id: HEB.5.3
reference: Hebrews 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: yo
  text: Nítorí èyí, ó di dandan fún un láti rú ọrẹ nítorí ẹ̀ṣẹ̀, gẹ́gẹ́ bí ó ti ń rú un fún àwọn ènìyàn, bẹ́ẹ̀ náà sì ni fún ara rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: Nítorí èyí
  rationale: Ó pa agbára ìdí ti διά mọ́, kò sì sọ ohun tí arọ́pò-orúkọ náà ń tọ́ka sí ní pàtó nínú ọ̀rọ̀ pàtàkì; ó ṣeé ṣe kí ó tọ́ka sí àìlera olórí àlùfáà ní ẹsẹ tó ṣáájú.
- source_word: ὀφείλει
  choice: ó sì di dandan fún un
  rationale: Ó fi ojúṣe tí kò ṣeé yẹ̀ sílẹ̀ hàn, kì í ṣe àbá tàbí ohun tó kàn yẹ kí ó ṣe.
- source_word: καθὼς ... οὕτως καὶ
  choice: gẹ́gẹ́ bí ... fún ... ara rẹ̀
  rationale: Àtòjọ ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìfiwéra tó wà láàárín àwọn ènìyàn àti olórí àlùfáà fúnra rẹ̀ mọ́.
- source_word: τοῦ λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó túmọ̀ λαός láì fi àlàyé “Israẹli” kún ọ̀rọ̀ orísun.
- source_word: περὶ αὑτοῦ
  choice: nítorí ẹ̀ṣẹ̀ ara rẹ̀
  rationale: A so ọ̀rọ̀ yìí mọ́ “ẹ̀ṣẹ̀” ní Yorùbá láti mú ìtumọ̀ pé ó rú ọrẹ fún ara rẹ̀ ṣe kedere, láì sọ pé ẹbọ náà jẹ́ irú kan pàtó.
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: láti rú ọrẹ nítorí ẹ̀ṣẹ̀
  rationale: “Rú ọrẹ” jẹ́ èdè ìjọsìn tó wọ́pọ̀, ó sì mú àyíká ìrúbọ hàn. “Nítorí ẹ̀ṣẹ̀” pa ìtumọ̀ περί + ἁμαρτιῶν mọ́ láì ṣe é ní dandan sí “ẹbọ ẹ̀ṣẹ̀” gẹ́gẹ́ bí ẹ̀ka ẹbọ kan pàtó.
theological_decisions:
- issue: Ohun tí “Nítorí èyí” ń tọ́ka sí
  choice: A pa “èyí” mọ́ nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó ṣeé ṣe jù lọ kí ó tọ́ka sí àìlera olórí àlùfáà ní ẹsẹ tó ṣáájú.
  alternative: Kí a sọ ní tààrà pé “nítorí àìlera rẹ̀,” tàbí kí a ka a sí ipò iṣẹ́ àlùfáà lápapọ̀.
  rationale: Arọ́pò-orúkọ abo náà bá ἀσθένεια (“àìlera”) ní 5:2 mu, ṣùgbọ́n pípa “èyí” mọ́ yàgò fún fífi ìtumọ̀ àlàyé sínú ọ̀rọ̀ pàtàkì.
- issue: Bí a ṣe túmọ̀ προσφέρειν láìsí ohun tí a dárúkọ ní tààrà
  choice: “rú ọrẹ”
  alternative: “rú ẹbọ” tàbí “mú wá” láìsí ohun tí a mẹ́nu kàn.
  rationale: Àyíká náà jẹ́ ti iṣẹ́ ìrúbọ olórí àlùfáà. “Ọrẹ” jẹ́ ọ̀rọ̀ gbooro tó yẹ, kò sì dín un kù sí irú ẹbọ kan pàtó.
- issue: Ẹ̀ṣẹ̀ olórí àlùfáà fúnra rẹ̀
  choice: A fi hàn gbangba pé ó rú ọrẹ nítorí ẹ̀ṣẹ̀ ara rẹ̀, gẹ́gẹ́ bí ó ti ṣe fún àwọn ènìyàn.
  alternative: Kí “fún ara rẹ̀” dúró lọ́tọ̀, èyí tó lè dà bí ẹni pé a kò so ó mọ́ ẹ̀ṣẹ̀ rẹ̀ ní kedere.
  rationale: Èyí pa ìfiwéra Gíríìkì mọ́, ó sì tẹ̀ lé ọ̀rọ̀ nípa àìlera olórí àlùfáà ayé láì gbe ẹ̀kọ́ mìíràn wọlé.
translation_notes:
  register: Yorùbá àgbà lónìí tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yan “ó di dandan fún un” fún ojúṣe àlùfáà, àti “rú ọrẹ” gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tó ṣeé lóye láì jẹ́ ti ẹ̀ka ìjọ kan.
