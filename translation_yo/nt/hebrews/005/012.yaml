id: HEB.5.12
reference: Hebrews 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: yo
  text: Nítorí pé, níwọ̀n bí àkókò ti lọ, ó yẹ kí ẹ ti jẹ́ olùkọ́; síbẹ̀, ẹ tún nílò ẹnì kan láti kọ́ yín ní àwọn ìlànà àkọ́bẹ̀rẹ̀[a] ti àwọn àsọjáde Ọlọ́run[b]. Ẹ sì ti wá di ẹni tí ó nílò wàrà, kì í ṣe oúnjẹ líle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun ìpìlẹ̀ ti ìbẹ̀rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn àsọjáde Ọlọ́run” ń tọ́ka sí àwọn ọ̀rọ̀ tàbí ìfihàn láti ọ̀dọ̀ Ọlọ́run, kì í ṣe ọ̀rọ̀ àsọtẹ́lẹ̀ láti ẹnu abọ̀rìṣà.
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: ó yẹ kí ẹ ti di
  rationale: Ó fi ojúṣe àti ohun tí a retí hàn, pẹ̀lú ‘ti di’ láti tọ́ka sí ìdàgbàsókè tí ó yẹ kí ó ti ṣẹlẹ̀.
- source_word: διδάσκαλοι
  choice: olùkọ́
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún ẹni tí ń kọ́ àwọn ẹlòmíràn.
- source_word: διὰ τὸν χρόνον
  choice: bí a bá wo bí àkókò ti pé tó
  rationale: Ó mú ìtumọ̀ àkókò tí ó ti kọjá àti ìdàgbàsókè tí a retí jáde, dípò ìtumọ̀ okùnfà lásán.
- source_word: πάλιν
  choice: tún
  rationale: Ó pa ìtumọ̀ pé wọ́n tún padà nílò ìkọ́ni àkọ́bẹ̀rẹ̀ mọ́.
- source_word: χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: ẹ tún nílò ẹnì kan láti kọ́ yín
  rationale: Ìtumọ̀ àdánidá ní Yorùbá; ó mú olùṣe tí Gíríìkì kò sọ ní tààrà, ṣùgbọ́n tí gbolohun náà ń béèrè fún, hàn gẹ́gẹ́ bí ‘ẹnì kan.’
- source_word: τινὰ τὰ στοιχεῖα
  choice: àwọn ohun ìpilẹ̀ṣẹ̀
  rationale: Ó tọ́ka sí àwọn kókó ìkọ́ni tó rọrùn jù lọ tàbí àwọn ohun àkọ́kọ́, láì fi ètò ẹ̀kọ́ ẹ̀sìn kan kún un.
- source_word: τῆς ἀρχῆς
  choice: ti ìbẹ̀rẹ̀
  rationale: Ó pa àtúnṣe ìtumọ̀ ‘ìbẹ̀rẹ̀’ tí ó wà nínú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ìfọ̀rọ̀wérọ̀ náà mọ̀ọ́mọ̀ ní ìtẹnumọ́ méjì.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: àwọn ọ̀rọ̀ Ọlọ́run
  rationale: ‘Ọ̀rọ̀’ jẹ́ èdè Yorùbá tó ṣe kedere fún àwọn àsọjáde tàbí ìfihàn láti ọ̀dọ̀ Ọlọ́run; àlàyé ìsàlẹ̀ ṣàlàyé pé kì í ṣe ọ̀rọ̀ lásán.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: Ẹ sì ti wá nílò
  rationale: ‘Ti wá’ fi ipò tí wọ́n ti dé sí, tí ó sì ń bá a lọ ní báyìí, hàn.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: wàrà, kì í ṣe oúnjẹ líle
  rationale: Ó pa àkàwé Gíríìkì mọ́ ní tààrà, láì tú u sí ètò ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
theological_decisions:
- issue: Àfiwé wàrà àti oúnjẹ líle
  choice: A pa àfiwé náà mọ́ gẹ́gẹ́ bí ‘wàrà’ àti ‘oúnjẹ líle.’
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ‘ẹ̀kọ́ àkọ́bẹ̀rẹ̀’ àti ‘ẹ̀kọ́ jíjinlẹ̀.’
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo àfiwé, kò sì sọ ètò ẹ̀kọ́ kan pàtó; pípa àfiwé náà mọ́ yàgò fún fífi èrò ẹ̀ya ìjọ kan kún un.
- issue: Ìtumọ̀ λογίων τοῦ θεοῦ
  choice: àwọn ọ̀rọ̀ Ọlọ́run
  alternative: àwọn àsọjáde Ọlọ́run / àwọn àsọtẹ́lẹ̀ Ọlọ́run
  rationale: ‘Àwọn ọ̀rọ̀ Ọlọ́run’ gbòòrò tó láti gba àsọjáde àti ìfihàn Ọlọ́run, láì dín un kù sí àsọtẹ́lẹ̀ nìkan tàbí sọ ọ́ di ọ̀rọ̀ abọ̀rìṣà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A lo ‘ẹ’ àti ‘yín’ fún ọ̀pọ̀ ènìyàn. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì pa ìtẹnumọ́ ‘ohun ìpilẹ̀ṣẹ̀ ti ìbẹ̀rẹ̀’ mọ́ láti fara mọ́ ọ̀rọ̀ Gíríìkì.
