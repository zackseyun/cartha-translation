id: HEB.5.5
reference: Hebrews 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni Mèsáyà kò gbé ara rẹ̀ ga láti di Àlùfáà Àgbà[a]; ṣùgbọ́n ẹni tí ó sọ fún un pé, “Ìwọ ni Ọmọ mi; èmi ti bí ọ lónìí.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olórí Àwọn Àlùfáà.”
    reason: Àlùfáà Àgbà jẹ́ oyè ἀρχιερεύς; àṣàyàn yìí lè mú ipò rẹ̀ gẹ́gẹ́ bí olórí àwọn àlùfáà túbọ̀ ṣe kedere.
  - marker: b
    text: Àyọlò láti Sáàmù 2:7.
    reason: Ìtọ́kasí agbelebu sí orísun àyọlò náà.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ẹsẹ̀ yìí mọ́ àlàyé tó ṣáájú nípa bí Ọlọ́run ṣe ń yan àlùfáà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὁ Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn ní àyíká ọ̀rọ̀ yìí, kì í ṣe bí orúkọ lásán.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: kò fi ògo fún ara rẹ̀
  rationale: Ó pa ìtumọ̀ δοξάζω gẹ́gẹ́ bí fífi ògo tàbí ọlá fún ẹnìkan mọ́, ó sì tún pa ìṣe tó padà sí ẹni náà mọ́.
- source_word: γενηθῆναι ἀρχιερέα
  choice: láti di Àlùfáà Àgbà
  rationale: Ó fi hàn pé ó wọ ipò tàbí iṣẹ́ Àlùfáà Àgbà; ọ̀rọ̀ náà sì ṣe déédé ní Yorùbá.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: ṣùgbọ́n ẹni tí ó sọ fún un pé
  rationale: Ó pa ẹni tó ṣe ìṣe náà mọ́ láìfi orúkọ Ọlọ́run kún ohun tí Gíríìkì kò sọ ní tààrà, ó sì mú àsọyé tó tẹ̀ lé e wọlé lọ́nà àdánidá.
- source_word: Υἱός μου εἶ σύ
  choice: Ìwọ ni Ọmọ mi
  rationale: Ó jẹ́ ìkéde tààrà tí ó pa ìtẹnumọ́ ọ̀rọ̀ náà mọ́.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: èmi ti bí ọ lónìí
  rationale: Ó tú γεννάω sí ọ̀rọ̀ Yorùbá tààrà, ó sì pa àwòrán àti ìṣòro ìtumọ̀ inú Sáàmù 2:7 mọ́ láìṣàlàyé rẹ̀ sí ẹ̀kọ́ kan pàtó.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àríyànjiyàn nípa yíyan sí ipò àlùfáà, ọ̀rọ̀ náà ní agbára oyè; “Mèsáyà” mú ìtumọ̀ ẹni àmìòróró tí Ọlọ́run yàn jáde kedere.
- issue: Ìtumọ̀ “lónìí ni mo bí ọ” nínú ọ̀rọ̀ nípa Mèsáyà
  choice: Pa ọ̀rọ̀ àyọlò náà mọ́ gẹ́gẹ́ bí a ti kọ ọ́
  alternative: Ṣàlàyé rẹ̀ nínú ẹsẹ̀ gẹ́gẹ́ bí ìjọba, àjíǹde, tàbí ìbí ayérayé
  rationale: Àyọlò Sáàmù 2:7 kò yẹ kí ìtumọ̀ náà fi tipátipá pinnu àríyànjiyàn ẹ̀kọ́ ìgbà tó tẹ̀ lé e.
- issue: Ẹni tó fi ògo fún Mèsáyà
  choice: Fi ẹni náà sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó sọ fún un”
  alternative: Fi “Ọlọ́run” kún un ní tààrà
  rationale: Gíríìkì fi ẹni náà hàn nípasẹ̀ participle láìdárúkọ rẹ̀; àyọlò náà jẹ́ kí olùkà mọ̀ pé Ọlọ́run ni, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi ohun tí kò fara hàn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Àlùfáà Àgbà” ni ọ̀rọ̀ Bíbélì tí ọ̀pọ̀ ènìyàn mọ̀; “Mèsáyà” sì pa agbára oyè Χριστός mọ́. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ìwé [a] àti [b] wà nínú ẹsẹ̀.
