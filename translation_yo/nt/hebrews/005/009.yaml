  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: yo
  text: A mú un dé ìpé[a], ó sì di orísun[b] ìgbàlà ayérayé fún gbogbo àwọn tí ń ṣègbọ́ràn sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sọ ọ́ di pípé,” tàbí “a mú un dé ìkúnlẹ̀.” Gíríìkì náà lè tọ́ka sí pé a mú un dé ìparí ipa àlùfáà àti iṣẹ́ ìràpadà rẹ̀, kì í ṣe sí àtúnṣe àbùkù ìwà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “orísun” sí “olùfa” tàbí “okùnfà” ìgbàlà ayérayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: ẹni tí a mú dé ìpé
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist passive, ó sì ń tọ́ka sí mímú ẹni dé ibi àfojúsùn tàbí sí ìparí iṣẹ́ tí a yàn fún un. ‘A mú dé ìpé’ kò fi hàn pé Jesu ní àbùkù ìwà tẹ́lẹ̀.
- source_word: ἐγένετο
  choice: ó di
  rationale: Ó ṣàfihàn ipò tàbí ipa tí ó yọrí sí lẹ́yìn tí a mú un dé ìpé; ‘ó di’ jẹ́ Yorùbá àdánidá tó sì ṣe kedere.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: fún gbogbo àwọn tí ń ṣègbọ́ràn sí i
  rationale: ‘Fún’ fi àwọn tí ìgbàlà náà wà fún hàn, ‘tí ń ṣègbọ́ràn’ sì pa agbára participle present mọ́ gẹ́gẹ́ bí ìṣe tó ń bá a lọ tàbí ìwà àdámọ́.
- source_word: αἴτιος
  choice: orísun
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹni tí ó fa ohun kan tàbí tí ohun náà ti ọ̀dọ̀ rẹ̀ wá. ‘Orísun’ jẹ́ kedere, ó sì yẹra fún ìtumọ̀ lítíréṣọ̀ ti ‘olùkọ̀wé.’
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: ‘Ìgbàlà’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìtumọ̀ ẹ̀kọ́ ìgbàlà nínú àyíká Hébérù.
- source_word: αἰωνίου
  choice: ayérayé
  rationale: ‘Ayérayé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbà tí kò lópin níbí.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so gbólóhùn náà mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà Yorùbá tó rọrùn láì fi ìbáṣepọ̀ míì kún un.
theological_decisions:
- issue: Ìtumọ̀ Kristológì ti τελειωθεὶς nípa Jesu
  choice: A túmọ̀ rẹ̀ sí ‘ẹni tí a mú dé ìpé,’ èyí tó tọ́ka sí píparí ipa àti iṣẹ́ ìràpadà rẹ̀.
  alternative: ẹni tí a sọ di pípé
  rationale: Yíyan yìí pa èrò Gíríìkì ti dídé ibi àfojúsùn mọ́, kò sì dá lórí èrò pé Jesu kọjá láti inú àbùkù ìwà sí ìwà mímọ́.
- issue: Ìgbọ́ràn gẹ́gẹ́ bí ohun tí a sọ nípa àwọn olùgbà ìgbàlà
  choice: A fi ‘gbogbo àwọn tí ń ṣègbọ́ràn sí i’ sílẹ̀ ní kedere.
  alternative: gbogbo àwọn tí ó gbà á gbọ́
  rationale: Gíríìkì sọ ìgbọ́ràn ní tààrà; a kò rọ́pò rẹ̀ pẹ̀lú ‘ìgbàgbọ́’ tàbí fi ètò ẹ̀kọ́ ìjọ kan ṣàlàyé rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘mú dé ìpé’ láti pa ìtumọ̀ àfojúsùn τελειόω mọ́, a sì lo ‘ń ṣègbọ́ràn’ láti fi ìṣe tó ń bá a lọ hàn.
