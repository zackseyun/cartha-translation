id: HEB.5.14
reference: Hebrews 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: yo
  text: Ṣùgbọ́n oúnjẹ líle jẹ́ ti àwọn tí ó dàgbà dénú, àwọn tí agbára ìfòye wọn ti gba ìdánilẹ́kọ̀ọ́ nípasẹ̀ ìmúlò déédéé[a], láti mọ ìyàtọ̀ tó wà láàárín rere àti búburú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ àṣà” tàbí “nítorí ìmúlò tí wọ́n ti mọ̀ sí.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “àwọn agbára ìmọ̀lára”; níbí ó ń tọ́ka lọ́nà àkàwé sí agbára ènìyàn láti fòye mọ nǹkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: àwọn tí ó dàgbà dénú
  rationale: Ó bá ìtakora sí àwọn ọmọ ọwọ́ nínú ẹsẹ tó ṣáájú mu, ó sì ń tọ́ka sí ìdàgbàsókè nípa tẹ̀mí láìsọ pé wọn pé láìní àbùkù.
- source_word: στερεὰ τροφή
  choice: oúnjẹ líle
  rationale: Ó pa àwòrán oúnjẹ tí a fi wé wàrà mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: διὰ τὴν ἕξιν
  choice: nípasẹ̀ àṣà lílò
  rationale: ἕξις lè túmọ̀ sí àṣà, ìmúlò déédéé, tàbí ipò tí ènìyàn ti ní nípasẹ̀ ìṣe léraléra; yíyan yìí pa ìtumọ̀ ìdánilẹ́kọ̀ọ́ nípasẹ̀ lílò mọ́.
- source_word: τὰ αἰσθητήρια
  choice: agbára ìfòye wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí àwọn ẹ̀yà tàbí agbára ìmọ̀lára, ṣùgbọ́n níbí a lò ó lọ́nà àkàwé fún agbára inú láti mọ̀ àti láti ṣe ìyàtọ̀.
- source_word: γεγυμνασμένα ἐχόντων
  choice: ti kọ́ ... wọn
  rationale: Ìṣe pípé tí a ṣe sí wọn fi ipò tí ìdánilẹ́kọ̀ọ́ ti mú wọn dé hàn; gbólóhùn Yorùbá yìí sọ àbájáde ìdánilẹ́kọ̀ọ́ náà ní kedere.
- source_word: πρὸς διάκρισιν
  choice: láti fi ìyàtọ̀ sáàárín
  rationale: Ó sọ ète tàbí àbájáde ìdánilẹ́kọ̀ọ́ náà ní Yorùbá àdánidá.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: rere àti búburú
  rationale: Ó pa méjèèjì tí ọ̀rọ̀ Gíríìkì so pọ̀ mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora sí wàrà àti ipò ọmọ ọwọ́ nínú ẹsẹ tó ṣáájú hàn.
theological_decisions:
- issue: Ìtumọ̀ τελείων nínú ọ̀rọ̀ ìdàgbàsókè nípa tẹ̀mí
  choice: àwọn tí ó dàgbà dénú
  alternative: àwọn tí ó pé; àwọn àgbàlagbà
  rationale: Ọ̀rọ̀ àyíká ń fi àwọn aláìdàgbà wé àwọn tí agbára ìfòye wọn ti gba ìdánilẹ́kọ̀ọ́; kò fi dandan sọ pé àwọn wọ̀nyí pé láìní ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àwòrán oúnjẹ àti ìdánilẹ́kọ̀ọ́ inú ẹsẹ náà mọ́.
