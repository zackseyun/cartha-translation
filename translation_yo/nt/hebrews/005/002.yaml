source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: yo
  text: Ó lè bá àwọn tí kò mọ̀ àti àwọn tí ń ṣìnà[a] lò pẹ̀lẹ́, níwọ̀n bí àìlera ti yí òun fúnra rẹ̀ náà ká[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a ti mú ṣìnà.” Participu Gíríìkì náà lè ní ìtumọ̀ passive, èyí tí ó lè fi hàn pé a ti darí wọn kúrò ní ọ̀nà.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “àìlera yí i ká”; ó tún lè ní ìtumọ̀ pé ó wọ àìlera bí aṣọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: fi pẹ̀lẹ́pẹ̀lẹ́ bá ... lò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí bí a ṣe ń hùwà pẹ̀lú ìwọ̀ntúnwọ̀nsì, láì le koko tàbí ṣàìbìkítà. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì mú ìtumọ̀ ìwà pẹ̀lẹ́ nínú ìbáṣepọ̀ hàn.
- source_word: δυνάμενος
  choice: Ó lè
  rationale: Èyí fi agbára tàbí ìkápá tí àlùfáà àgbà ní láti ṣe ohun tí a sọ hàn ní Yorùbá tó rọrùn.
- source_word: τοῖς ἀγνοοῦσι
  choice: àwọn tí kò mọ̀
  rationale: Ó pa agbára participle náà mọ́, kò sì sọ àwọn ènìyàn náà di ẹ̀ka àwùjọ kan tó dúró ṣinṣin.
- source_word: πλανωμένοις
  choice: àwọn tí ń ṣìnà
  rationale: ‘Ń ṣìnà’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún yíyapa kúrò ní ọ̀nà tó tọ́, láì pinnu bóyá àwọn náà ló dá ara wọn ṣìnà tàbí ẹlòmíràn ló ń mú wọn ṣìnà.
- source_word: ἐπεὶ
  choice: nítorí
  rationale: Asopọ̀ yìí fi ìdí tí àlùfáà fi lè bá wọn lò pẹ̀lẹ́pẹ̀lẹ́ hàn kedere.
- source_word: καὶ αὐτὸς
  choice: òun tìkára rẹ̀ pẹ̀lú
  rationale: Èyí pa ìtẹnumọ́ tó wà lórí ẹni náà fúnra rẹ̀ àti ìtumọ̀ ‘pẹ̀lú’ mọ́.
- source_word: περίκειται ἀσθένειαν
  choice: àìlera yí ... ká
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì pé àìlera yí ẹni náà ká mọ́, nígbà tó tún jẹ́ Yorùbá tó ṣe déédéé. ‘Àìlera’ kò fi dandan mọ́ àìlera ara tàbí ti ìwà nìkan.
theological_decisions:
- issue: Irú àṣìṣe àwọn tí ἀγνοοῦσι καὶ πλανωμένοις ń ṣàpèjúwe
  choice: Àwọn tí kò mọ̀ àti àwọn tí ń ṣìnà, ní ìtumọ̀ gbogbogbòò
  alternative: Àwọn tí wọ́n dá ẹ̀ṣẹ̀ àìmọọ́mọ̀ tó jẹ́ ẹ̀ka pàtó nínú ètò ẹbọ Lefi
  rationale: Ọ̀rọ̀ yìí ní ìbátan pẹ̀lú ètò iṣẹ́ àlùfáà Májẹ̀mú Láéláé, ṣùgbọ́n Gíríìkì kò fi ìtumọ̀ rẹ̀ mọ́ ẹ̀ka ẹbọ pàtó kan. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tóóró kún un.
- issue: Ìtumọ̀ ἀσθένεια nípa àlùfáà àgbà
  choice: Àìlera ènìyàn ní ìtumọ̀ tó gbòòrò
  alternative: Àìlera ara nìkan tàbí àìlera ìwà nìkan
  rationale: ‘Àìlera’ gba gbogbo ipò àìlera àti àìpé ènìyàn láàyè, láì fi ipa mú ọ̀rọ̀ náà tọ́ka sí ara tàbí ìwà nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe déédéé fún òǹkàwé òde òní, ó sì pa àwòrán àti àìdájú tó wà nínú Gíríìkì mọ́.
