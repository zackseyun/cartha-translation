source:
  edition: SBLGNT
  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ Ọmọ[a], ó kọ́ ìgbọ́ràn láti inú àwọn ohun tí ó fara dà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Bí ó tilẹ̀ jẹ́ Ọmọ náà.” Nínú Giriki, “Ọmọ” kò ní àmì ìdánimọ̀; àyíká ọ̀rọ̀ lè jẹ́ kí a túmọ̀ ọ́ ní ọ̀nà méjèèjì.
    reason: alternative_reading
  - marker: b
    text: “Ó kọ́ ìgbọ́ràn” ń tọ́ka sí ẹ̀kọ́ nípasẹ̀ ìrírí àwọn ìjìyà tí ó fara dà; ọ̀rọ̀ náà fúnra rẹ̀ kò sọ pé ó ti jẹ́ aláìgbọ́ràn tẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Bí ó tilẹ̀
  rationale: 'Ó fi ìyàtọ̀ oníyọ̀ǹda hàn: bí ó tilẹ̀ jẹ́ Ọmọ, síbẹ̀ ó kọ́ ìgbọ́ràn nípasẹ̀ ìjìyà.'
- source_word: ὢν υἱός
  choice: jẹ́ Ọmọ
  rationale: Ọ̀rọ̀ yìí sọ ipò rẹ̀ gẹ́gẹ́ bí Ọmọ. Yorùbá kò nílò àfikún tó bá 'a' tàbí 'the' mu, nítorí náà ó pa àìdánilójú ti Giriki tí kò ní article mọ́.
- source_word: ἔμαθεν
  choice: ó kọ́
  rationale: Ìtumọ̀ tààrà ti μανθάνω ni 'kọ́'; a kò mú ọ̀rọ̀ náà rọ̀ tàbí ṣàlàyé rẹ̀ kúrò.
- source_word: ἀφ’ ὧν
  choice: láti inú ohun tí
  rationale: Ó sọ orísun tàbí ohun tí ẹ̀kọ́ náà ti wá, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἔπαθεν
  choice: ó jìyà
  rationale: Ó tọ́ka sí ìjìyà gidi tí ó fara dà; 'jìyà' jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní ìwọ̀n.
- source_word: τὴν ὑπακοήν
  choice: ìgbọ́ràn
  rationale: Ó túmọ̀ sí fífi ara ẹni sílẹ̀ láti ṣe ìfẹ́ Ọlọ́run. Yorùbá kò nílò ohun tó bá article Giriki mu níbí.
theological_decisions:
- issue: Ipò Kristi gẹ́gẹ́ bí Ọmọ ní ìbáṣepọ̀ pẹ̀lú bí ó ṣe kọ́ ìgbọ́ràn
  choice: Bí ó tilẹ̀ jẹ́ Ọmọ
  alternative: Bí ó tilẹ̀ jẹ́ Ọmọ náà
  rationale: Àyànfẹ́ náà jẹ́ kí ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí Ọmọ àti ẹ̀kọ́ ìgbọ́ràn rẹ̀ nípasẹ̀ ìjìyà dúró papọ̀. Nítorí Yorùbá kò ní article bí ti Gẹ̀ẹ́sì, ọ̀rọ̀ àkọ́kọ́ tún pa ààyè ìtumọ̀ Giriki mọ́ láìfi ìdánilójú kún un.
- issue: Bóyá 'ó kọ́ ìgbọ́ràn' túmọ̀ sí pé ó ti jẹ́ aláìgbọ́ràn tẹ́lẹ̀
  choice: 'A pa ọ̀rọ̀ tààrà náà mọ́: ''ó kọ́ ìgbọ́ràn'''
  alternative: ó ní ìrírí ohun tí ìgbọ́ràn ń náni
  rationale: Giriki sọ pé ó kọ́ ìgbọ́ràn; a kò yẹ kí a yí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà padà. Àlàyé ẹsẹ̀ ìsàlẹ̀ sọ pé ẹ̀kọ́ nípasẹ̀ ìrírí ìjìyà ni, kì í ṣe àtúnṣe aláìgbọ́ràn tẹ́lẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “Bí ó tilẹ̀” fún concessive force, “Ọmọ” fún ìtọ́kasí Kristi, àti “láti inú ohun tí ó jìyà” láti pa ìtumọ̀ orísun/ìrírí ἀφ’ ὧν mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
