  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: yo
  text: Nípa ọ̀rọ̀ yìí, a ní ọ̀pọ̀ ohun láti sọ[a], ó sì ṣòro láti ṣàlàyé[b], nítorí ẹ ti di ọ̀lẹ ní gbígbọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípa ẹni yìí”; ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà lè tọ́ka sí Melikisédékì fúnra rẹ̀, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí ó ń tọ́ka sí kókó ọ̀rọ̀ tí a ń jíròrò ní gbogbogbòò.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó ṣòro láti túmọ̀” tàbí “ó nira láti ṣàlàyé rẹ̀ ní ẹ̀kúnrẹ́rẹ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹ ti di onílòra ní gbígbọ́”; gbólóhùn náà ń sọ pé wọn ti lọ́ra tàbí wọn kò fèsì dáadáa sí ẹ̀kọ́ tí wọn ń gbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Nípa èyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà lè tọ́ka sí Melikisédékì tàbí sí gbogbo kókó ọ̀rọ̀ tí a ń jíròrò. “Nípa èyí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tẹ̀ sí kókó ọ̀rọ̀ náà láì gé ìsopọ̀ rẹ̀ pẹ̀lú Melikisédékì.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: a ní ọ̀pọ̀lọpọ̀ ohun láti sọ
  rationale: 'Èyí sọ ìtumọ̀ gbólóhùn náà ní Yorùbá tó ṣe kedere: òǹkọ̀wé ní ọ̀pọ̀ àlàyé láti gbé kalẹ̀.'
- source_word: δυσερμήνευτος λέγειν
  choice: ó sì ṣòro láti ṣàlàyé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí ó nira láti túmọ̀ tàbí láti ṣàlàyé. Ní ìṣọ̀kan pẹ̀lú λέγειν, “ṣòro láti ṣàlàyé” dá lórí iṣẹ́ fífi ẹ̀kọ́ náà yé àwọn olùgbọ́.
- source_word: ἐπεὶ
  choice: nítorí
  rationale: Asopọ̀ náà fúnni ní ìdí tí ṣíṣe àlàyé fi ṣòro; “nítorí” sọ ìbáṣepọ̀ ìdí yìí ní kedere.
- source_word: νωθροὶ γεγόνατε
  choice: ẹ ti di aláìyára
  rationale: “Ẹ ti di” pa ipa àsìkò pípé mọ́, ó ń fi hàn pé ipò yìí ti ṣẹ̀ṣẹ̀ dàgbà dé bá wọn. “Aláìyára” tọ́ka sí ìlọ́ra tàbí àìfèsì, kì í ṣe àìgbọ́ nípa ara nìkan.
- source_word: ταῖς ἀκοαῖς
  choice: láti gbọ́
  rationale: Nínú àyíká yìí, gbígbọ́ túmọ̀ sí fífetí sí ẹ̀kọ́ àti gbígbà á. Ìtumọ̀ yìí pa àwòrán gbígbọ́ mọ́, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí Περὶ οὗ ń tọ́ka sí
  choice: Ní pàtàkì, ó ń tọ́ka sí kókó ọ̀rọ̀ tí a ń jíròrò.
  alternative: Ó lè tọ́ka sí Melikisédékì fúnra rẹ̀, ìyẹn, “nípa ẹni yìí.”
  rationale: Melikisédékì ni a mẹ́nu kàn lẹ́sẹ̀kẹsẹ̀ ṣáájú, nítorí náà, ìtọ́ka sí ẹni kan ṣeé ṣe ní gírámà. Síbẹ̀, gbólóhùn náà ṣí ọ̀nà sí àlàyé tó gbòòrò nípa kókó ọ̀rọ̀ náà. Àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè tó ní iyì ṣùgbọ́n tó ṣeé lóye. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn. Gbólóhùn “aláìyára láti gbọ́” pa àwòrán orísun mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó jẹ́ àìfèsì sí ẹ̀kọ́, kì í ṣe àìgbọ́ nípa ara.
