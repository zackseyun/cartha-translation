- from: Nítorí olúkúlùkù ẹni tí ó ń mu wàrà kò ní ìrírí nínú ọ̀rọ̀ ìṣòdodo[a][b], nítorí ọmọ ọwọ́ ni.
  to: Nítorí gbogbo ẹni tí ó ń mu wàrà kò ní ìrírí nínú ọ̀rọ̀ òdodo[a][b], nítorí ọmọ ọwọ́ ni ó jẹ́.
