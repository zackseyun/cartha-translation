id: HEB.5.13
reference: Hebrews 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: yo
  text: Nítorí gbogbo ẹni tí ó ń mu wàrà kò ní ìrírí nínú ọ̀rọ̀ òdodo[a][b], nítorí ọmọ ọwọ́ ni ó jẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn òdodo” tàbí “ọ̀rọ̀ nípa òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo” dípò “òdodo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς
  choice: olúkúlùkù ẹni
  rationale: Ó fi ìtumọ̀ pínpín ti ọ̀rọ̀ Gíríìkì hàn, ìyẹn, ẹnì kọ̀ọ̀kan nínú irú àwọn ẹni tí a ń sọ̀rọ̀ nípa wọn.
- source_word: ὁ μετέχων γάλακτος
  choice: ẹni tí ó ń mu wàrà
  rationale: Mímu wàrà ni ọ̀nà àdánidá tí Yorùbá fi ń sọ jíjẹ́ alábápín nínú wàrà; ó sì pa àkàwé wàrà mọ́ láìfi kún un pé wàrà nìkan ni ẹni náà ń gbé lé.
- source_word: ἄπειρος
  choice: kò ní ìrírí
  rationale: Ó túmọ̀ sí àìní ìrírí tàbí òye iṣẹ́ tó péye, kì í ṣe pé ẹni náà kò mọ ohunkóhun rárá.
- source_word: λόγου δικαιοσύνης
  choice: ọ̀rọ̀ ìṣòdodo
  rationale: Gbólóhùn kúkúrú yìí pa ìsopọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ kí ‘ọ̀rọ̀’ lè túmọ̀ sí ọ̀rọ̀, ìhìn, tàbí ẹ̀kọ́ láìdín ìtumọ̀ rẹ̀ kù sí ọ̀nà kan ṣoṣo.
- source_word: δικαιοσύνης
  choice: ìṣòdodo
  rationale: ‘Ìṣòdodo’ bá ọ̀rọ̀ nípa ìdàgbàsókè ní ti ẹ̀mí àti ìmọ̀ ẹ̀kọ́ mu, ó sì yàtọ̀ sí ‘òdodo’ tí ó lè túmọ̀ sí òtítọ́ lásán nínú gbólóhùn ‘ọ̀rọ̀ òdodo.’
- source_word: νήπιος
  choice: ọmọ ọwọ́
  rationale: Ó fi àwòrán ọmọ kékeré tí kò tíì dàgbà hàn kedere, ó sì bá àkàwé wàrà mu ní Yorùbá àdánidá.
- source_word: γάρ
  choice: nítorí
  rationale: A lo ‘nítorí’ fún ìṣẹ̀lẹ̀ méjèèjì láti pa ìṣàlàyé àti ìtẹ̀síwájú èrò inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: ìṣòdodo
  alternative: ìdájọ́ òdodo
  rationale: Ìṣòdodo ni ìtumọ̀ àkọ́kọ́ tó bá ọ̀rọ̀ nípa ìdàgbàsókè àti ìmọ̀ ẹ̀kọ́ mu; àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ tó lè tọ́ka sí ìdájọ́ òdodo mọ́.
- issue: Ìbáṣepọ̀ inú λόγου δικαιοσύνης
  choice: ọ̀rọ̀ ìṣòdodo
  alternative: ìhìn ìṣòdodo; ọ̀rọ̀ nípa ìṣòdodo
  rationale: A kò fẹ́ pinnu bóyá δικαιοσύνης ń ṣàpèjúwe irú ọ̀rọ̀ náà tàbí ohun tí ọ̀rọ̀ náà dá lé; nítorí náà, ọ̀rọ̀ inú ẹsẹ náà wà ní ṣókí, a sì ṣàlàyé àwọn ìtumọ̀ míì ní àkọsílẹ̀.
- issue: Ìṣàmì akọ nínú νήπιος ... ἐστιν
  choice: nítorí ọmọ ọwọ́ ni
  alternative: nítorí òun jẹ́ ọmọ ọwọ́
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta. Fífi arọ́pò-orúkọ sílẹ̀ nínú gbólóhùn yìí jẹ́ àdánidá, ó sì pa ìtọ́kasí sí ẹni kọ̀ọ̀kan mọ́ láìfi akọ tàbí abo tí èdè Yorùbá kò nílò kún un.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. Àmì ohùn kún àwọn ọ̀rọ̀ níbi tí ó ti yẹ. ‘Ọmọ ọwọ́’ àti ‘mu wàrà’ mú àkàwé náà ṣe kedere ní ọ̀nà àdánidá.
