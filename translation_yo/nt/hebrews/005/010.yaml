  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: yo
  text: tí Ọlọ́run pè é ní Olórí Àlùfáà[a] gẹ́gẹ́ bí ìlànà Melkisedeki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “tí Ọlọ́run sọ ọ́ ní Olórí Àlùfáà” tàbí “tí Ọlọ́run yàn án sí ipò Olórí Àlùfáà.”
    reason: lexical_alternative
  - marker: b
    text: Èyí ń tọ́ka sí Sáàmù 110:4, níbi tí a ti sọ nípa ipò àlùfáà “gẹ́gẹ́ bí ìlànà Melkisedeki.”
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: tí Ọlọ́run pè é ní
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist passive, ó sì ń tọ́ka sí bí Ọlọ́run ṣe pe Jesu ní orúkọ ipò yìí tàbí ṣe dá a mọ̀ ní gbangba. “Pè é ní” pa agbára passive àti ààyè ìtumọ̀ “sọ ní / yàn sí ipò” mọ́ láìfi èrò ìfìjoyè tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Nínú gbólóhùn Yorùbá active tí ó bá ìṣe passive Gíríìkì mu lọ́nà àdánidá, Ọlọ́run ni olùṣe. A kò fi “Baba” kún un nítorí Gíríìkì sọ “Ọlọ́run” nìkan.
- source_word: ἀρχιερεὺς
  choice: Olórí Àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀρχιερεύς, ìyẹn ẹni tó wà ní ipò àlùfáà gíga jù lọ.
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: Níbí, κατά ń fi ìbámu tàbí ìfarajọ hàn; “gẹ́gẹ́ bí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbámu náà.
- source_word: τὴν τάξιν
  choice: ìlànà
  rationale: Nínú àríyànjiyàn Hébérù àti ìtọ́kasí Sáàmù 110:4, τάξις túmọ̀ sí ìlànà, ẹ̀ka, tàbí àpẹẹrẹ ipò àlùfáà, kì í ṣe ìtẹ̀lé lasan. “Ìlànà” pa ìsopọ̀ yẹn mọ́.
- source_word: Μελχισέδεκ
  choice: Melikisedeki
  rationale: A ṣe àfọwọkọ orúkọ Gíríìkì náà sínú ìkọ̀wé àti ìpè Yorùbá, a kò tú ìtumọ̀ orúkọ náà.
theological_decisions:
- issue: Bóyá kí a tú participle náà lọ́nà tó túmọ̀ sí ìyípadà ipò gangan tàbí ìkéde/ìdánimọ̀ ní gbangba
  choice: Ọlọ́run pè é ní Olórí Àlùfáà
  alternative: Ọlọ́run yàn án sí ipò Olórí Àlùfáà; Ọlọ́run sọ ọ́ di Olórí Àlùfáà
  rationale: “Pè é ní” jẹ́ kí ìtumọ̀ ìkéde tàbí ìdánimọ̀ ní gbangba dúró, ó sì tún lè gbà ìtumọ̀ yíyan sí ipò láàyè. Kò dáhùn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò parí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́wọ̀, tí ó sì bójú mu fún kíkà ní gbangba. A lo “Olórí Àlùfáà” àti “ìlànà” gẹ́gẹ́ bí àwọn ọ̀rọ̀ ẹ̀sìn tí òǹkàwé Yorùbá lè lóye, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
