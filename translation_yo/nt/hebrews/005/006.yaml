id: HEB.5.6
reference: Hebrews 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: yo
  text: 'gẹ́gẹ́ bí ó ti tún sọ ní ibòmíràn[a] pé,


    “Ìwọ ni àlùfáà títí láé,

    ní ìbámu pẹ̀lú ètò Melkisedeki.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ibi mìíràn.” Gíríìkì ní, ní ti gidi, “ní òmíràn”; a lóye “ibi” tàbí apá Ìwé Mímọ́ kan pẹ̀lú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ètò Melkisedeki.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ètò, ẹ̀ka, tàbí ipò iṣẹ́ àlùfáà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ó ti tún
  rationale: Ó mú ìfiwéra καθώς àti ìtumọ̀ ‘pẹ̀lú/tún’ ti καί jáde ní ọ̀nà Yorùbá tó ṣe é ka, ó sì so àyọlò Ìwé Mímọ́ yìí pọ̀ mọ́ èyí tó ṣáájú.
- source_word: ἐν ἑτέρῳ
  choice: ní ibòmíràn
  rationale: Gbólóhùn Gíríìkì náà fi ọ̀rọ̀ orúkọ tí a lóye sílẹ̀; ‘ní ibòmíràn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ‘ní ibi mìíràn’ tàbí ‘ní apá Ìwé Mímọ́ mìíràn.’
- source_word: λέγει
  choice: ó ... sọ
  rationale: A pa ẹni-kẹta ẹyọ kan mọ́, tí ó jẹ́ kí Ọlọ́run gẹ́gẹ́ bí olùsọ̀rọ̀ nínú Ìwé Mímọ́ wà ní àfarawà, láìfi orúkọ tí kò sí nínú Gíríìkì kún un.
- source_word: Σὺ
  choice: Ìwọ
  rationale: Ó pa ìtọ́kasí tààrà sí ẹni-kejì ẹyọ kan mọ́.
- source_word: ἱερεὺς
  choice: àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἱερεύς nínú àyíká iṣẹ́ àlùfáà.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Ó sọ ìwà pípẹ́ láìní òpin jáde ní Yorùbá àdánidá.
- source_word: κατὰ τὴν τάξιν
  choice: ní ìbámu pẹ̀lú ipò àlùfáà
  rationale: ‘Ipò àlùfáà’ mú èrò τάξις gẹ́gẹ́ bí ẹ̀ka tàbí ètò iṣẹ́ àlùfáà hàn kedere, nígbà tí ‘ní ìbámu pẹ̀lú’ pa agbára κατά mọ́.
- source_word: Μελχισέδεκ
  choice: Melkisedeki
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀lé ìró Gíríìkì ní ọ̀nà tó bá ìkọ̀wé Yorùbá mu, pẹ̀lú fáwẹ́lì ìparí tí ó jẹ́ kí kíkà rẹ̀ rọrùn.
theological_decisions:
- issue: Ẹni tí ó ń sọ̀rọ̀ nínú ọ̀rọ̀ ìṣáájú àyọlò
  choice: A lò ‘ó ... sọ,’ tí ó fi ẹni tí ó ń sọ̀rọ̀ sílẹ̀ ní àfarawà gẹ́gẹ́ bí Gíríìkì.
  alternative: ‘Ìwé Mímọ́ sọ’ tàbí fífi ‘Ọlọ́run’ hàn gbangba.
  rationale: Lẹ́tà sí àwọn Heberu sábà máa ń gbé Ìwé Mímọ́ kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ Ọlọ́run tí ó ń sọ nísinsìnyí; ṣùgbọ́n fífi ‘Ọlọ́run’ tàbí ‘Ìwé Mímọ́’ kún un níbí yóò sọ ohun tí Gíríìkì fi sí àfarawà di pàtó jù.
- issue: Ìtumọ̀ τάξις nínú àyọlò nípa Melkisedeki
  choice: ‘ipò àlùfáà’ gẹ́gẹ́ bí ẹ̀ka tàbí ètò iṣẹ́ àlùfáà.
  alternative: ‘àpẹẹrẹ,’ ‘ọ̀nà,’ tàbí ‘ètò.’
  rationale: Nínú àríyànjiyàn Heberu, ọ̀rọ̀ náà tọ́ka sí irú iṣẹ́ àlùfáà tí ó ní ìbáṣepọ̀ pẹ̀lú Melkisedeki; ìtumọ̀ yìí pa ìsopọ̀ ẹ̀kọ́ náà mọ́ láìdín in kù sí ìfarajọ lásán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe é lóye fún òǹkàwé gbogbogbò. A ṣètò àyọlò Sáàmù bí ewì láti mú ìsọ̀rọ̀ tààrà rẹ̀ hàn.
