id: HEB.5.4
reference: Hebrews 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: yo
  text: Kò sí ẹni tí ó gba ọlá náà[a] fún ara rẹ̀, bí kò ṣe ẹni tí Ọlọ́run pè, gẹ́gẹ́ bí a ti pe Áárónì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ “ọlá náà”; nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí iyì tàbí ipò àlùfáà àgbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ … τις
  choice: Ẹnikẹ́ni kò
  rationale: Àpapọ̀ ọ̀rọ̀ àìsọ̀rètí οὐχ àti arọ́pò-orúkọ τις túmọ̀ sí ‘kò sí ẹnikẹ́ni’; ìṣètò yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἑαυτῷ
  choice: fún ara rẹ̀
  rationale: Ó fi hàn pé ẹni náà ń gbìyànjú láti fi ọlá tàbí ipò náà fún ara rẹ̀.
- source_word: λαμβάνει
  choice: gba
  rationale: ‘Gba’ lè sọ yálà gbígba tàbí mímú ohun kan fún ara ẹni, ó sì bá ìyàtọ̀ tó wà láàárín fífi ipò fún ara ẹni àti ìpè Ọlọ́run mu.
- source_word: τὴν τιμήν
  choice: ọlá náà
  rationale: Àpilẹ̀kọ pàtó náà tọ́ka sí ọlá tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ọ̀rọ̀, ìyẹn iyì ipò àlùfáà àgbà; ‘ọlá’ kò fi ìtumọ̀ ‘ipò’ kún ọ̀rọ̀ Gíríìkì ní tààrà.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: nígbà tí Ọlọ́run bá pè é
  rationale: Èyí sọ ìṣe aláìṣe ti Gíríìkì ní Yorùbá àdánidá, ó sì pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ń pè.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: gẹ́gẹ́ bí ó ti pe Áárónì pẹ̀lú
  rationale: ‘Gẹ́gẹ́ bí’ mú ìfiwéra náà jáde, ‘pẹ̀lú’ sì dúró fún καί; ọ̀rọ̀-ìṣe ‘pe’ ni a mú padà láti inú gbólóhùn tó ṣáájú, nítorí Gíríìkì fi í sílẹ̀ ní àfojúsùn.
theological_decisions:
- issue: Ìpilẹ̀ ìyàn sí ipò àlùfáà
  choice: A kò lè fi ọlá ipò àlùfáà fún ara ẹni; ìpè Ọlọ́run ni ó jẹ́ ìpilẹ̀ rẹ̀, Áárónì sì ni àpẹẹrẹ.
  alternative: Kí a ka ọ̀rọ̀ náà sí ọlá lápapọ̀ láì so ó mọ́ ipò àlùfáà.
  rationale: Hébérù 5:1–5 ń sọ nípa àlùfáà àgbà. Síbẹ̀, a lo ‘ọlá’ dípò fífi ‘ipò àlùfáà’ sínú ara ẹsẹ náà, kí a má bàa túmọ̀ τιμή ju ohun tó sọ lọ.
- issue: Ìbáṣepọ̀ καλούμενος pẹ̀lú gbólóhùn àkọ́kọ́
  choice: “bí kò ṣe nígbà tí Ọlọ́run bá pè é”
  alternative: “ṣùgbọ́n ẹni tí Ọlọ́run pè”
  rationale: Gbólóhùn Gíríìkì jẹ́ kúkúrú, ó sì lo ọ̀rọ̀-ìṣe aláìṣe. Ìtumọ̀ tí a yàn mú ipò tàbí ọ̀nà gbígba ọlá náà hàn ní Yorùbá àdánidá, láì sọ pé ìpè náà fúnra rẹ̀ ni ọlá náà.
translation_notes:
  register: Yorùbá ìpele àárín, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì kọ orúkọ Áárónì ní ìbámu pẹ̀lú ìpè Yorùbá.
