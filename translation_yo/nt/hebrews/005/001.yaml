  to: Nítorí gbogbo olórí àlùfáà tí a mú láti àárín àwọn ènìyàn[a] ni a yàn fún àwọn ènìyàn nínú àwọn ohun tí ó jẹ mọ́ Ọlọ́run, kí ó lè fi ẹ̀bùn àti ẹbọ rúbọ nítorí ẹ̀ṣẹ̀.
