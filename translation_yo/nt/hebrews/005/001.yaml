id: HEB.5.1
reference: Hebrews 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: yo
  text: Nítorí gbogbo olórí àlùfáà tí a mú láti àárín àwọn ènìyàn[a] ni a yàn fún àwọn ènìyàn nínú àwọn ohun tí ó jẹ mọ́ Ọlọ́run, kí ó lè fi ẹ̀bùn àti ẹbọ rúbọ nítorí ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti ìtàn, ọkùnrin ni olórí àlùfáà. Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn ènìyàn” tàbí “ẹ̀dá ènìyàn” lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: Nítorí olórí àlùfáà kọ̀ọ̀kan
  rationale: “Kọ̀ọ̀kan” fi ìtumọ̀ distributive ti Πᾶς pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ hàn; “nítorí” sì so ẹsẹ yìí mọ́ àlàyé tó ṣáájú. “Olórí àlùfáà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò ἀρχιερεύς.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: ni a ń mú láti àárín àwọn ènìyàn
  rationale: Ó pa ìṣe aláìsọ ẹni tó ṣe é mọ́ gẹ́gẹ́ bí participle passive Gíríìkì, ó sì sọ pé ẹni náà wá láti inú ìran ènìyàn.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: a sì ń yàn án ní ipò àwọn ènìyàn
  rationale: “Yàn án” bá ìgbékalẹ̀ sí ipò mu; “ní ipò” mú iṣẹ́ aṣojú tí ὑπέρ ní níbí hàn láì sọ pé àǹfààní nìkan ni.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nínú àwọn ohun tí ó jẹ mọ́ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àwọn ọ̀ràn ìjọsìn àti iṣẹ́ tí a ń ṣe sí Ọlọ́run.
- source_word: ἵνα προσφέρῃ δῶρά τε καὶ θυσίας
  choice: kí ó lè mú ẹ̀bùn àti ẹbọ wá
  rationale: “Kí ó lè” pa ète ἵνα mọ́; “mú ... wá” sì lè gba ẹ̀bùn àti ẹbọ pọ̀ láì fi ọ̀rọ̀-ìṣe tí ó yẹ fún ẹbọ nìkan lé ẹ̀bùn lórí.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: fún ẹ̀ṣẹ̀
  rationale: Ní àyíká ìrúbọ, gbólóhùn yìí túmọ̀ sí pé a mú àwọn ọrẹ náà wá nípa ẹ̀ṣẹ̀ tàbí láti kojú ẹ̀ṣẹ̀; “fún ẹ̀ṣẹ̀” pa kúkúrú àti ìṣòro ìtumọ̀ rẹ̀ mọ́.
theological_decisions:
- issue: Èdè aṣojú ní ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: ἀνθρώπων lè tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, bí ó tilẹ̀ jẹ́ pé àwọn ọkùnrin ni wọ́n ń ṣe iṣẹ́ olórí àlùfáà nínú ètò ìtàn yìí. “Àwọn ènìyàn” pa àfikún pé a mú àlùfáà láti inú ìran ènìyàn mọ́, láì pa òtítọ́ ìtàn ipò náà rẹ́.
- issue: Ìtumọ̀ ὑπέρ ní ὑπὲρ ἀνθρώπων
  choice: ní ipò àwọn ènìyàn
  alternative: fún àwọn ènìyàn
  rationale: “Ní ipò” fi ipa alárinà tàbí aṣojú hàn; “fún” lè túmọ̀ sí àǹfààní nìkan, èyí tí kò fi gbogbo agbára ọ̀rọ̀ náà hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní ọlá, pẹ̀lú àmì ohùn ní kíkún. A lo “a ń” fún ìṣe àṣà tó ń ṣẹlẹ̀ ní gbogbo ìgbà, “ní ipò” fún iṣẹ́ aṣojú, àti “mú ... wá” gẹ́gẹ́ bí ọ̀rọ̀ tó lè bo ẹ̀bùn àti ẹbọ méjèèjì.
