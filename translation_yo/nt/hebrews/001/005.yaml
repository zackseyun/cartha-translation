  source_fidelity: Ìbéèrè Gíríìkì náà ń béèrè ẹni tí Ọlọ́run ti sọ fún láàárín àwọn áńgẹ́lì. Ìtumọ̀ náà pa àfiwéra, ‘nígbà kan rí,’ àwọn àyọlò méjèèjì, àti èdè ìbímọ náà mọ́. Ṣùgbọ́n ọ̀rọ̀-ìṣe ‘sọ’ nílò ‘fún’ nínú ìbéèrè náà kí ẹni tí a sọ fún hàn kedere, gẹ́gẹ́ bí dative Τίνι.
