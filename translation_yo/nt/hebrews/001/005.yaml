id: HEB.1.5
reference: Hebrews 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: yo
  text: "Nítorí, èwo nínú àwọn áńgẹ́lì ni Ọlọ́run ti sọ fún nígbà kan rí pé,[a]\n\n“Ìwọ ni Ọmọ mi;\n lónìí ni mo bí ọ”[b]?\n\nÓ sì tún sọ pé,\n\n“Èmi yóò jẹ́ baba fún un,\n òun yóò sì jẹ́ ọmọ fún mi”[c]?"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààràtà sí i: “sọ nígbà kan rí.”'
    reason: lexical_alternative
  - marker: b
    text: “Mo bí ọ” ń ṣe ìrántí Sáàmù 2:7. A ti lóye gbólóhùn náà ní ìbámu pẹ̀lú ìjokòóde ọba, àjíǹde, tàbí ìbátan ayérayé Ọmọ pẹ̀lú Baba; ìtumọ̀ yìí pa ọ̀rọ̀ náà mọ́ láì pinnu èwo nínú àwọn ìtumọ̀ wọ̀nyí.
    reason: cross_reference
  - marker: c
    text: 'Àyọlò láti 2 Sámúẹ́lì 7:14. Ní ọ̀nà Yorùbá tó rọrùn sí i: “Èmi yóò jẹ́ baba rẹ̀, òun yóò sì jẹ́ ọmọ mi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: èwo nínú àwọn áńgẹ́lì
  rationale: Ó pa ìbéèrè tó ń yan ọ̀kan láàárín àwọn áńgẹ́lì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé àti ìjiyàn tó ṣáájú rẹ̀.
- source_word: εἶπέν ποτε
  choice: ti sọ nígbà kan rí
  rationale: Ó mú ìtumọ̀ ποτέ jáde gẹ́gẹ́ bí ‘nígbà kan rí’ láì sọ ọ́ di ohun tó ju orísun lọ.
- source_word: ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: Àyíká Hébérù 1 fi hàn pé àwọn ẹ̀dá ọ̀run ni a ń tọ́ka sí, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: Υἱός μου εἶ σύ
  choice: Ìwọ ni Ọmọ mi
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ ẹni tí a ń bá sọ mọ́.
- source_word: σήμερον
  choice: lónìí
  rationale: Ó túmọ̀ ọ̀rọ̀ àsìkò náà ní tààràtà láì ṣe àlàyé àfikún.
- source_word: γεγέννηκά σε
  choice: mo bí ọ
  rationale: Ọ̀rọ̀ ‘bí’ ni Yorùbá tó ṣe kedere fún γεννάω, ó sì pa àwòrán ìbímọ àti ìbátan baba-ọmọ mọ́ láì pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- source_word: καὶ πάλιν
  choice: Ó sì tún sọ pé
  rationale: Ó fi hàn ní kedere pé àyọlò Ìwé Mímọ́ mìíràn ń tẹ̀ lé e.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Èmi yóò jẹ́ baba fún un
  rationale: Ó pa ìṣètò ‘jẹ́ baba fún un’ àti ìró májẹ̀mú inú àyọlò náà mọ́.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: òun yóò sì jẹ́ ọmọ fún mi
  rationale: Ó bá ìlà tó ṣáájú mu, ó sì pa ìfiwéra tó wà nínú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ‘mo bí ọ’
  choice: Pa ‘mo bí ọ’ mọ́ nínú ọ̀rọ̀ ẹsẹ náà láì sọ irú ìṣẹ̀lẹ̀ tí ‘lónìí’ ń tọ́ka sí.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìgoríjokò ọba, àjíǹde, tàbí ìbátan ayérayé Ọmọ pẹ̀lú Baba.
  rationale: Àyọlò Sáàmù 2:7 ní agbára ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n ẹsẹ náà fúnra rẹ̀ kò yan ọ̀kan ṣoṣo lára àwọn ìtumọ̀ wọ̀nyí.
- issue: Ọmọ nínú àwọn àyọlò méjèèjì
  choice: Lo ‘Ọmọ’ fún àkọ́kọ́ gẹ́gẹ́ bí orúkọ oyè ní àyíká Kristi, ṣùgbọ́n lo ‘ọmọ’ nínú ọ̀rọ̀ májẹ̀mú àyọlò kejì.
  alternative: Kọ méjèèjì sí ‘Ọmọ’ tàbí méjèèjì sí ‘ọmọ’.
  rationale: Èyí pa ìyàtọ̀ lítíréṣọ̀ àwọn àyọlò náà mọ́ láì sẹ́ pé Hébérù ń fi méjèèjì sí Ọmọ náà.
- issue: Ẹni tó sọ ọ̀rọ̀ náà
  choice: Fi ‘Ọlọ́run’ hàn ní ìbéèrè àkọ́kọ́.
  alternative: Lo arọ́pò-orúkọ ‘ó’ nìkan.
  rationale: Kókó-ọrọ̀ náà hàn gbangba láti ẹsẹ tó ṣáájú; mímú ‘Ọlọ́run’ wá síta jẹ́ àdánidá ní Yorùbá, kò sì yí ẹni tí orísun ń tọ́ka sí padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘áńgẹ́lì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì ṣe àyọlò méjèèjì ní ìlà ewì láti mú ìṣọ̀kan àti ìfiwéra wọn hàn.
