  terminology: ‘Áńgẹ́lì,’ ‘Ọmọ,’ ‘baba,’ àti ‘ọmọ’ yẹ sí àyíká Hébérù 1. ‘Mo bí ọ’ dá ìtumọ̀ γεννάω dúró láì yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan. Àwọn àlàyé ẹsẹ̀-ìsàlẹ̀ tún pa ìtọ́kasí Sáàmù 2:7 àti 2 Sámúẹ́lì 7:14 mọ́.
