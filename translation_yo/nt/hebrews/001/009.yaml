id: HEB.1.9
reference: Hebrews 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: yo
  text: 'Ìwọ ti fẹ́ràn òdodo[a],

    o sì ti kórìíra ìwà àìlófin;

    nítorí náà Ọlọ́run, Ọlọ́run rẹ,

    ti fi òróró ayọ̀ yan ọ

    ju àwọn ẹlẹgbẹ́ rẹ lọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí òdodo tàbí sí ìdájọ́ òdodo; a lo “òdodo” nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: ti fẹ́ràn
  rationale: Fọ́ọ̀mù àṣekágbá yìí fi ìṣe tí ó ti ṣẹlẹ̀ hàn; ‘ti fẹ́ràn’ jẹ́ ọ̀nà Yorùbá àdánidá láti mú ìṣe náà àti ìjẹ́pàtàkì rẹ̀ títí di ìsinsìnyí jáde.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ bo ìwà títọ́ àti ìbámu pẹ̀lú ohun tí ó tọ́, ó sì bá ìyàtọ̀ tí ẹsẹ̀ náà fi sí àárín rẹ̀ àti ìwà àìlófin mu. A pa ìtumọ̀ ‘ìdájọ́ òdodo’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐμίσησας
  choice: ti kórìíra
  rationale: ‘Kórìíra’ pa agbára ìtakora pẹ̀lú ‘fẹ́ràn’ mọ́, kò sì dín ìdájọ́ ìwà búburú náà kù.
- source_word: ἀνομίαν
  choice: ìwà àìlófin
  rationale: Ọ̀rọ̀ yìí sọ ní tààrà nípa ìwà tí kò tẹ̀ lé òfin tàbí tí ó tako òfin; ó ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: διὰ τοῦτο
  choice: nítorí náà
  rationale: Ó pa ìsopọ̀ ìdí àti àbájáde mọ́ láàárín ìfẹ́ sí òdodo, ìkórìíra ìwà àìlófin, àti yíyan ẹni náà.
- source_word: ἔχρισέν
  choice: ti fi òróró ... yan
  rationale: Gbólóhùn yìí pa àwòrán ìyàsímímọ́ ọba tàbí ẹni tí a yàn nípa fífi òróró kùn mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Ọlọ́run, Ọlọ́run rẹ
  rationale: A pa àtúnwí àti ìbáṣepọ̀ inú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: òróró ayọ̀
  rationale: ‘Òróró ayọ̀’ pa àwòrán ayẹyẹ àti ìyàsímímọ́ inú ọ̀rọ̀ náà mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: παρὰ
  choice: ju ... lọ
  rationale: Nínú àyíká ìfiwéra yìí, ‘ju ... lọ’ fi ìwọ̀n gíga tàbí ipò tí ó tayọ àwọn yòókù hàn lọ́nà àdánidá.
- source_word: μετόχους
  choice: àwọn ẹlẹgbẹ́
  rationale: ‘Àwọn ẹlẹgbẹ́’ lè túmọ̀ sí àwọn tí wọ́n ní àjọṣe tàbí ipin pọ̀ pẹ̀lú ẹni náà, láìmú ìtumọ̀ òwò wọ inú ọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ àsọtẹ́lẹ̀ nípa Ọmọ
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ dá ìwà títọ́ ẹni náà dúró gẹ́gẹ́ bí ohun pàtàkì nínú àyíká yìí. Síbẹ̀, nítorí ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí ìdájọ́ òdodo, a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú ‘Ọlọ́run, Ọlọ́run rẹ’
  choice: Pa ọ̀rọ̀ náà mọ́ bí ó ti rí láìfikún àlàyé
  alternative: Ṣàlàyé ìbáṣepọ̀ Ọlọ́run àti Ọmọ nínú ìtumọ̀ náà
  rationale: 'Ọ̀rọ̀ náà ní ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ó mọ̀ọ́mọ̀ wà níbẹ̀: a ń sọ̀rọ̀ sí Ọmọ ní ọ̀nà gíga, síbẹ̀ a tún sọ ‘Ọlọ́run rẹ.’ Ìtumọ̀ náà kò rọ ọ́ tàbí yanju rẹ̀ pẹ̀lú ọ̀rọ̀ àfikún.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ìlà ewì láti fi irú ìṣètò Sáàmù tí a fa yọ hàn, a sì pa gbogbo àmì ohùn mọ́ níbi tí ó bá yẹ.
