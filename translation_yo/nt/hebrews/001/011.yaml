  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: yo
  text: Àwọn náà yóò ṣègbé[a], ṣùgbọ́n ìwọ ṣì wà; gbogbo wọn yóò sì gbó bí aṣọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò kọjá lọ.”
    reason: lexical_alternative
  - marker: b
    text: Àwòrán yìí ń tọ́ka sí Sáàmù 102:25–27, ó sì fi ìwà àìdúróṣinṣin àwọn ohun tí a dá hàn ní ìyàtọ̀ pẹ̀lú ẹni tí a ń bá sọ̀rọ̀, ẹni tí ń bá a wà.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: Àwọn náà
  rationale: Ó tọ́ka padà sí àwọn ọ̀run àti ilẹ̀ ní ẹsẹ tó ṣáájú, ó sì mú ìyàtọ̀ wọn pẹ̀lú “ìwọ” hàn láìfi ìtumọ̀ míì kún un.
- source_word: ἀπολοῦνται
  choice: yóò ṣègbé
  rationale: Ó pa ìtumọ̀ líle ti wíwá sí òpin mọ́, láìsọ ọ̀nà tàbí ẹni tó fa ìparun náà.
- source_word: σὺ δὲ
  choice: ṣùgbọ́n ìwọ
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín àwọn ohun ẹ̀dá àti ẹni tí a ń bá sọ̀rọ̀.
- source_word: διαμένεις
  choice: ṣì wà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti máa bá a lọ tàbí láti dúró ṣinṣin. “Ṣì wà” jẹ́ ọ̀nà Yorùbá àdánidá tó bá ìtakora pẹ̀lú “yóò ṣègbé” mu.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó kó gbogbo àwọn ohun ẹ̀dá tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn sínú ọ̀rọ̀ náà.
- source_word: ὡς ἱμάτιον
  choice: bí aṣọ
  rationale: “Aṣọ” jẹ́ ọ̀rọ̀ gbòòrò, tó sì pa àfiwé náà mọ́ láìdín irú aṣọ náà kù sí ẹ̀wù pàtó kan.
- source_word: παλαιωθήσονται
  choice: yóò gbó
  rationale: Ó lè túmọ̀ sí pé ohun kan di ògbólógbòó tàbí pé ó gbó nítorí lílò. “Yóò gbó” jẹ́ àdánidá ní Yorùbá, ó sì bá àwòrán aṣọ mu.
theological_decisions:
- issue: Ẹni tí a ń bá sọ̀rọ̀ àti ipa ọ̀rọ̀ náà lórí Kristi
  choice: A pa ọ̀rọ̀ ẹni kejì náà mọ́ gẹ́gẹ́ bí “ìwọ ṣì wà,” ní ìbámu pẹ̀lú bí Hébérù 1 ṣe fi ọ̀rọ̀ Sáàmù náà kan Ọmọ.
  alternative: Ṣíṣe ẹni tí “ìwọ” ń tọ́ka sí ní kedere nínú ara ẹsẹ náà, bí “ṣùgbọ́n ìwọ Ọmọ...”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ tààrà sí ẹni kejì, àyíká Hébérù 1 sì fi hàn pé Ọmọ ni a ń bá sọ̀rọ̀. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa àfiwé aṣọ àti ìtakora tó wà nínú Gíríìkì mọ́.
