id: HEB.1.6
reference: Hebrews 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: yo
  text: 'Nígbà tí ó sì tún mú Àkọ́bí wọ inú ayé[a], ó wí pé,


    “Kí gbogbo àwọn áńgẹ́lì Ọlọ́run[b] jọ́sìn fún un.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì tún wí pé, nígbà tí ó mú Àkọ́bí wọ inú ayé, ‘Kí gbogbo àwọn áńgẹ́lì Ọlọ́run jọ́sìn fún un.’” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “tún” lè ṣàlàyé yálà “mú ... wọ inú” tàbí “ó wí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “gbogbo àwọn áńgẹ́lì ti Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nígbà tí
  rationale: Ó ṣe àgbékalẹ̀ gbólóhùn àkókò kan; níbí, ó tọ́ka sí ìṣẹ̀lẹ̀ kan pàtó ju sí ohun tí ń ṣẹlẹ̀ léraléra lọ.
- source_word: δὲ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ pẹ̀lẹ́ ni tí ó ń tẹ ìjíròrò náà síwájú láìfi ìtakora líle kún un.
- source_word: πάλιν
  choice: tún
  rationale: A so ó mọ́ ìṣe ‘mú ... wọ inú’ nínú ọ̀rọ̀ àkọ́kọ́. Síbẹ̀, Gíríìkì náà tún lè túmọ̀ sí pé ó so mọ́ ‘ó wí’; àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú gidi yìí mọ́.
- source_word: εἰσαγάγῃ
  choice: mú ... wọ inú
  rationale: Ó sọ ìṣe mímú ẹnì kan wọ ibi kan ní èdè Yorùbá àdánidá, ó sì bá àkópọ̀ ὅταν àti aorist subjunctive mu.
- source_word: τὸν πρωτότοκον
  choice: Àkọ́bí
  rationale: A lò ó gẹ́gẹ́ bí orúkọ oyè fún Ọmọ náà nínú àyíká ọ̀rọ̀. Ó pa ìtumọ̀ ìbátan ọmọ àti ipò ọlá tí ọ̀rọ̀ Gíríìkì lè ní mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: εἰς τὴν οἰκουμένην
  choice: wọ inú ayé
  rationale: ‘Ayé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ οἰκουμένη níbí, èyí tí ó lè túmọ̀ sí gbogbo ilẹ̀ tí ènìyàn ń gbé.
- source_word: λέγει
  choice: ó wí pé
  rationale: Ó tẹ̀lé Gíríìkì ní ṣókí, láìfi ‘nínú Ìwé Mímọ́’ kún un. Àyíká ọ̀rọ̀ ló fi hàn pé Ọlọ́run ni olùsọ̀rọ̀.
- source_word: προσκυνησάτωσαν
  choice: kí ... jọ́sìn
  rationale: Ìṣètò ‘kí ...’ ń fi agbára àṣẹ tàbí ìfẹ́ hàn. ‘Jọ́sìn’ mú agbára προσκυνέω jáde nínú àyíká tí gbogbo áńgẹ́lì ń fi ọlá ẹ̀sìn fún Ọmọ náà, kì í ṣe ìkíni lásán.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún arọ́pò-orúkọ dative tí ó tẹ̀lé ‘jọ́sìn.’
- source_word: πάντες ἄγγελοι θεοῦ
  choice: gbogbo àwọn áńgẹ́lì Ọlọ́run
  rationale: Ó jẹ́ ọ̀nà Yorùbá ṣókí, tí ó sì ṣe kedere, fún gbogbo àwọn áńgẹ́lì tí wọ́n jẹ́ ti Ọlọ́run.
theological_decisions:
- issue: Ibi tí πάλιν (‘tún’) ń ṣàlàyé
  choice: A mú un gẹ́gẹ́ bí ọ̀rọ̀ tí ó ń ṣàlàyé ‘mú Àkọ́bí wọ inú ayé.’
  alternative: Ó lè ṣàlàyé ‘ó wí,’ ìyẹn, ‘Ó sì tún wí pé, nígbà tí ó mú Àkọ́bí wọ inú ayé ...’
  rationale: Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì fàyè gba méjèèjì. Ọ̀rọ̀ àkọ́kọ́ yan èyí tí πάλιν ti sún mọ́ εἰσαγάγῃ, ṣùgbọ́n àlàyé [a] pa ìtumọ̀ kejì mọ́ nítorí àìdánilójú náà jẹ́ ojúlówó.
- issue: Agbára προσκυνέω sí Ọmọ náà
  choice: jọ́sìn
  alternative: foríbalẹ̀ fún; fi ọlá fún
  rationale: Nínú ìjíròrò Hébérù 1 nípa bí Ọmọ ṣe ga ju àwọn áńgẹ́lì lọ, ‘jọ́sìn’ fi agbára ọ̀rọ̀ náà hàn dáadáa ju ọ̀rọ̀ tí ó lè túmọ̀ sí ìbòwọ̀ ènìyàn lásán lọ, láìfi ẹ̀kọ́ àfikún sí ẹsẹ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní ọlá, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì lo ‘Àkọ́bí’ gẹ́gẹ́ bí orúkọ oyè nítorí àyíká ọ̀rọ̀.
