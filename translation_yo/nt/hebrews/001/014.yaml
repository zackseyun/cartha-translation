source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: yo
  text: Ṣé gbogbo wọn kì í ṣe ẹ̀mí tí ń ṣe iṣẹ́ ìránṣẹ́, tí a ń rán jáde láti ṣe ìránṣẹ́ fún àwọn tí yóò jogún ìgbàlà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì náà fi ìfojúsọ́nà ọjọ́ iwájú hàn: àwọn tí yóò jogún ìgbàlà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: kì í ha ... bí?
  rationale: Ó fi ẹsẹ̀ náà hàn gẹ́gẹ́ bí ìbéèrè àsọjà tí ó ń retí ìdáhùn rere, ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Ó pa ìtumọ̀ àkójọpọ̀ náà mọ́, ó sì tọ́ka sí gbogbo àwọn áńgẹ́lì tí àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa wọn.
- source_word: λειτουργικὰ πνεύματα
  choice: ẹ̀mí tí ń ṣe iṣẹ́ ìsìn
  rationale: “Iṣẹ́ ìsìn” mú èrò iṣẹ́ àkànṣe tàbí iṣẹ́ mímọ́ wá láì sọ wọ́n di aláṣẹ inú ìjọ; “ẹ̀mí” sì pa ìṣàpèjúwe àwọn ẹ̀dá ọ̀run náà mọ́.
- source_word: εἰς διακονίαν
  choice: láti ṣiṣẹ́
  rationale: Ó sọ ète rírán wọn jáde ní Yorùbá àdánidá, láì fi ìtumọ̀ ipò iṣẹ́ inú ìjọ kún un.
- source_word: ἀποστελλόμενα
  choice: tí a ń rán jáde
  rationale: 'Ó pa ìṣe àkókò ìsinsìnyí àti ohùn àìṣe-taara ti participle Gíríìkì mọ́: ẹlòmíràn ni ó ń rán wọn.'
- source_word: διὰ
  choice: nítorí
  rationale: Nínú àyíká yìí, ó fi ìbáṣepọ̀ iṣẹ́ wọn sí àǹfààní àwọn tí a mẹ́nu kàn hàn ní ṣókí.
- source_word: τοὺς μέλλοντας
  choice: àwọn tí ó fẹ́
  rationale: Nínú ìlò Yorùbá yìí, “fẹ́” ń tọ́ka sí ohun tí ó ń bọ̀ tàbí tí ó fẹ́ ṣẹlẹ̀, kì í ṣe ìfẹ́-ọkàn wọn; àlàyé ìsàlẹ̀ ojú ewé mú èyí ṣe kedere.
- source_word: κληρονομεῖν
  choice: jogún
  rationale: Ó pa àwòrán ogún àti ipò ajogún tí ó ṣe pàtàkì nínú Hébérù mọ́.
- source_word: σωτηρίαν
  choice: ìgbàlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún σωτηρία, pẹ̀lú ìtọ́ka rẹ̀ sí ìgbàlà ní ọjọ́ iwájú.
theological_decisions:
- issue: Agbára μέλλοντας κληρονομεῖν σωτηρίαν
  choice: àwọn tí ó fẹ́ jogún ìgbàlà
  alternative: àwọn tí yóò jogún ìgbàlà
  rationale: Àyànfẹ́ náà pa ìfojúsọ́nà ọjọ́ iwájú ti μέλλω mọ́, ṣùgbọ́n kò sọ pé kété ni yóò ṣẹlẹ̀, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ àyànmọ́ tàbí ìdánilójú ẹ̀sìn kan kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìbéèrè àsọjà àti ìfojúsọ́nà ọjọ́ iwájú ti orísun mọ́.
