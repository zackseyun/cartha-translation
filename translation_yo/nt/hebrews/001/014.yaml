revisions:
- from: Gbogbo wọn kì í ha ṣe ẹ̀mí tí ń ṣe iṣẹ́ ìsìn, tí a ń rán jáde láti ṣiṣẹ́ nítorí àwọn tí ó fẹ́ jogún ìgbàlà bí?[a]
  to: Ṣé gbogbo wọn kì í ṣe ẹ̀mí tí ń ṣe iṣẹ́ ìránṣẹ́, tí a ń rán jáde láti ṣe ìránṣẹ́ fún àwọn tí yóò jogún ìgbàlà?[a]
  rationale: A rọ́pò ọ̀rọ̀ “fẹ́” tó lè dà bí ìfẹ́-ọkàn ẹni pẹ̀lú “yóò,” tó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ìfojúsọ́nà μέλλοντας nínú àyíká yìí. A tún lo “fún” láti sọ àǹfààní àwọn olùjogún hàn. Àmì ẹsẹ̀ ìsàlẹ̀ [a] ni a pa mọ́, ṣùgbọ́n a tún kọ ọ́ kí ó má bà a fa ìtumọ̀ “fẹ́” tó lè ṣìnà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Àwọn ìpín pàtàkì mìíràn wà ní ìbámu pẹ̀lú Gíríìkì: ìbéèrè àsọjà, gbogbo àwọn ẹ̀mí iṣẹ́, rírán wọn jáde fún iṣẹ́, àti àwòrán ogún ìgbàlà. Ṣùgbọ́n “àwọn tí ó fẹ́ jogún” lè túmọ̀ sí àwọn tí wọ́n fẹ́ (ní ìfẹ́-ọkàn) láti jogún, nítorí náà kò pa agbára ọjọ́ iwájú ti μέλλοντας mọ́ ní kedere.'
  naturalness: “Ṣé gbogbo wọn kì í ṣe …?” jẹ́ ọ̀nà Yorùbá boṣewa tó rọrùn fún ìbéèrè àsọjà náà. “Fún àwọn tí yóò jogún” sọ ìbáṣepọ̀ àǹfààní ti διά dáadáa, ó sì dáa ju “nítorí àwọn” nínú àyíká yìí.
  terminology: “Ẹ̀mí tí ń ṣe iṣẹ́ ìránṣẹ́” àti “ìgbàlà” jẹ́ àwọn ọ̀rọ̀ tó bójú mu. “Ìránṣẹ́” níbi kejì ń ṣàfihàn διακονία láì fi ipò ìjọ tàbí ẹ̀kọ́ pàtó kún un.
  issues:
