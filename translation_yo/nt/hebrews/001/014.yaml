    issue: “àwọn tí ó fẹ́ jogún ìgbàlà”
    rationale: Nínú Yorùbá òde òní, “fẹ́” níbi yìí sábà máa ń túmọ̀ sí ìfẹ́-ọkàn tàbí èrò ẹni láti ṣe nǹkan. Èyí lè yí “those who are about to/will inherit salvation” padà sí “those who want to inherit salvation.” “Àwọn tí yóò jogún” pa ìfojúsọ́nà ọjọ́ iwájú mọ́ láì dá ìtumọ̀ míì sílẹ̀.
  - severity: medium
