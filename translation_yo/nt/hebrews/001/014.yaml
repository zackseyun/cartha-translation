    rationale: “Nítorí” lè jẹ́ ìdí/okùnfà. Nípa διά pẹ̀lú accusative nínú ẹsẹ̀ yìí, “fún àwọn tí …” mú èrò pé a rán wọn jáde fún àǹfààní àwọn olùjogún náà hàn kedere.
