language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: yo
  text: Ṣùgbọ́n nípa Ọmọ, ó sọ pé[a], “Ìtẹ́ rẹ, Ọlọ́run, dúró láéláé àti láéláé; ọ̀pá àṣẹ ìwà títọ́[b] ni ọ̀pá àṣẹ ìjọba rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, kì í ṣe àṣàyàn tí ó lágbára jù: “Ọlọ́run ni ìtẹ́ rẹ láéláé àti láéláé.” Ètò ọ̀rọ̀ Gíríìkì ti fa àríyànjiyàn, ṣùgbọ́n ìpè tààrà náà, “Ìtẹ́ rẹ, Ọlọ́run,” bá àyíká ọ̀rọ̀ àti ìtẹnumọ́ àyọlò náà mu jù.'
    reason: alternative_reading
  - marker: b
    text: Tàbí “òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwà títọ́ tàbí òdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Ṣùgbọ́n nípa Ọmọ, ó sọ pé
  rationale: Ní àyíká ọ̀rọ̀ yìí, πρός pẹ̀lú accusative ń tọ́ka sí ẹni tí ọ̀rọ̀ náà dá lé; fífi ọ̀rọ̀-ìṣe sísọ tí a fi sílẹ̀ kún un mú kí Yorùbá ṣe kedere, ó sì pa ìyàtọ̀ sí ohun tí a sọ nípa àwọn áńgẹ́lì mọ́.
- source_word: υἱόν
  choice: Ọmọ
  rationale: A lò ó gẹ́gẹ́ bí orúkọ oyè pàtó fún Ọmọ náà; ó bá ìyàtọ̀ tí àyọkà náà ń ṣe mu.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Ìtẹ́ rẹ, Ọlọ́run
  rationale: Kíkà ὁ θεός gẹ́gẹ́ bí àpèjúwe ẹni tí a ń bá sọ̀rọ̀—‘Ọlọ́run’—ni ó bá àyíká ọ̀rọ̀ àti agbára ọ̀rọ̀ tí a fa yọ mu jù. Àṣàyàn tí ó ṣeé ṣe ní gírámà ni a fi sínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: dúró láéláé àti láéláé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tọ́ka sí àkókò tí kò ní òpin. ‘Láéláé àti láéláé’ jẹ́ ọ̀nà Yorùbá adayébá láti pa ìtẹnumọ́ náà mọ́; ‘dúró’ mú ìtumọ̀ gbólóhùn aláìlọ́rọ̀-ìṣe náà hàn kedere.
- source_word: ῥάβδος
  choice: ọ̀pá àṣẹ
  rationale: Nínú àyíká ọba, ọ̀rọ̀ náà túmọ̀ sí ọ̀pá àmì ìṣàkóso, kì í ṣe ọ̀pá lásán.
- source_word: τῆς εὐθύτητος
  choice: ìdúróṣinṣin
  rationale: εὐθύτης ní ìtumọ̀ ohun tí ó tọ́, tí kò yí kúrò ní òdodo. ‘Ìdúróṣinṣin’ jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìwà títọ́ àti àìṣègbè nínú ìṣàkóso; ‘òdodo’ tún ṣeé lò, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: ọ̀pá àṣẹ ìjọba rẹ
  rationale: βασιλεία lè túmọ̀ sí ìjọba, ipò ọba, tàbí ìṣàkóso; ‘ìjọba’ pa àwòrán ilẹ̀ ọba àti ọ̀pá àṣẹ mọ́ ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bóyá ὁ θεός jẹ́ ọ̀rọ̀ àpè sí Ọmọ gẹ́gẹ́ bí Ọlọ́run tàbí àsọyé pé Ọlọ́run ni ìtẹ́ rẹ.
  choice: 'Àpè tààrà: “Ìtẹ́ rẹ, Ọlọ́run.”'
  alternative: “Ọlọ́run ni ìtẹ́ rẹ láéláé àti láéláé.”
  rationale: Àpè tààrà bá ìṣàn ẹsẹ̀ Hébérù 1 àti agbára àyọlò Sáàmù 45 mu jù, níbi tí a ti ń fi ipò Ọmọ hàn ní ìyàtọ̀ sí àwọn áńgẹ́lì. Síbẹ̀, nítorí ètò gírámà Gíríìkì ti fa àríyànjiyàn, a kò fi àṣàyàn kejì pamọ́; a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa oníyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ọ̀pá àṣẹ’ dípò ọ̀rọ̀ àjèjì fún scepter, a sì fi àmì ohùn sí gbogbo ibi tí ó bá yẹ. Gbólóhùn náà pa àwòrán ọba, ìtẹ́, àti ìjọba inú orísun Gíríìkì mọ́.
