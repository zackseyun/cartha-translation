  terminology: ‘Ọlọ́run,’ ‘Ìtẹ́,’ ‘ọ̀pá àṣẹ,’ àti ‘ìjọba’ yẹ. ‘Ìwà títọ́’ ni ó bá εὐθύτης mu dájú ju ‘ìdúróṣinṣin’ lọ. Àlàyé ìsàlẹ̀ náà ṣì pa ‘òdodo’ mọ́ gẹ́gẹ́ bí àṣàyàn ìtumọ̀.
