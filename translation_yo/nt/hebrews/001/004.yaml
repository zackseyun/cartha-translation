source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: yo
  text: Ó ti di ẹni tí ó ga ju àwọn áńgẹ́lì lọ, gẹ́gẹ́ bí orúkọ tí ó jogún ṣe ní ọlá ju tiwọn lọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó sàn ju àwọn áńgẹ́lì lọ.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ẹsẹ tó tẹ̀ lé e ṣàlàyé “orúkọ” yìí gẹ́gẹ́ bí oyè àti ipò rẹ̀ gẹ́gẹ́ bí Ọmọ.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: dé ìwọ̀n kan náà tí ... fi
  rationale: 'Àkópọ̀ ọ̀rọ̀ yìí fi ìfiwéra oníwọ̀n hàn: bí ìga Ọmọ náà ju ti àwọn áńgẹ́lì lọ ṣe pọ̀ tó náà ni ọlá orúkọ rẹ̀ ju tiwọn lọ. Èdè Yorùbá yìí pa ìbárapọ̀ ìwọ̀n méjèèjì mọ́.'
- source_word: κρείττων
  choice: ga ju ... lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ipò tàbí ọlá tí ó ju ti àwọn áńgẹ́lì lọ, kì í ṣe pé ó dára jù ní ìwà rere. ‘Ga ju’ jẹ́ èdè Yorùbá àdánidá fún ipò gíga.
- source_word: γενόμενος
  choice: Ó ti di ẹni
  rationale: Èyí túmọ̀ aorist participle náà gẹ́gẹ́ bí yíyọrí sí ipò kan, láìsọ pé a dá Ọmọ náà sílẹ̀. ‘Ti di’ tún bá ipa perfect/resultant tí gbólóhùn náà ní nínú àyíká mu.
- source_word: τῶν ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: A pa ọ̀pọ̀ ènìyàn àti ìtumọ̀ pàtó Greek article náà mọ́ ní èdè Yorùbá àdánidá.
- source_word: διαφορώτερον
  choice: lọ́lá ju ... lọ
  rationale: Nínú àyíká orúkọ àti ipò, ‘lọ́lá ju’ fi ìyàtọ̀ tó tayọ àti ipò ọlá hàn dáadáa ju ‘yàtọ̀’ lásán lọ.
- source_word: παρ’ αὐτοὺς
  choice: ju tiwọn lọ
  rationale: ‘Tiwọn’ pèsè ìtumọ̀ ohun-ìní tí èdè Yorùbá béèrè, ìyẹn ni pé orúkọ tí Ọmọ jogún lọ́lá ju orúkọ tàbí ipò-orúkọ ti àwọn áńgẹ́lì lọ.
- source_word: κεκληρονόμηκεν
  choice: tí ó jogún
  rationale: ‘Jogún’ sọ ìnípasẹ̀ ogún ní kedere. Àyíká ‘ó ti di’ àti ìtumọ̀ gbólóhùn náà fi ipò tó wà nísinsìnyí gẹ́gẹ́ bí àbájáde ogún náà hàn.
- source_word: ὄνομα
  choice: orúkọ
  rationale: A pa ọ̀rọ̀ náà mọ́ ní tààràtà, kí àyíká ẹsẹ tó tẹ̀ lé e lè ṣàlàyé pé ó jẹ́ orúkọ tàbí ipò Ọmọ, láìfi ìtumọ̀ àlàyé sínú ẹsẹ yìí ṣáájú àkókò.
theological_decisions:
- issue: Ìtumọ̀ γενόμενος (‘ó ti di ẹni’) nípa ipò Kristi
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààràtà sí ‘Ó ti di ẹni,’ ní ìbámu pẹ̀lú ipò Ọmọ lẹ́yìn ìgbéga rẹ̀, láìsọ pé ìwà Ọlọ́run rẹ̀ bẹ̀rẹ̀ nígbà náà.
  alternative: ‘A ti sọ ọ́ di’ lè tẹnu mọ́ ìyàn sí ipò kan, ṣùgbọ́n ó lè mú kí òǹkàwé rò pé ẹ̀dá ni Ọmọ náà.
  rationale: Àyíká Hébérù 1 ń fi Ọmọ wé àwọn áńgẹ́lì, ó sì ń sọ nípa ìgbéga, ìjókòó lórí ìtẹ́, àti ipò Ọmọ. Ìtumọ̀ yìí pa ọ̀rọ̀ Greek mọ́ láìfi ìtumọ̀ pé a dá Ọmọ náà sílẹ̀ sínú rẹ̀.
- issue: Ìtumọ̀ ‘orúkọ’ nínú àyíká
  choice: A fi ‘orúkọ’ sílẹ̀ gẹ́gẹ́ bí ó ti rí, kí àwọn ẹsẹ tó tẹ̀ lé e lè fi hàn pé ó ní í ṣe pẹ̀lú oyè àti ipò Ọmọ.
  alternative: A lè sọ ní tààràtà pé ‘oyè Ọmọ,’ tàbí kí a túmọ̀ rẹ̀ sí ọlá àti ipò ní gbogbogbòò.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ ‘orúkọ’ nìkan; àwọn ọ̀rọ̀ tó tẹ̀ lé e ló ṣàlàyé rẹ̀. Fífi ‘orúkọ’ sílẹ̀ pa ìṣàn ìjíròrò àti àìdánilójú tí ẹsẹ náà ní mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣeé lóye. ‘Dé ìwọ̀n kan náà tí ... fi’ pa ìfiwéra oníwọ̀n inú Greek mọ́; ‘ga ju’ àti ‘lọ́lá ju’ yà ipò ẹni náà àti ọlá orúkọ náà sọ́tọ̀ ní kedere.
