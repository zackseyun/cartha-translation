source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: yo
  text: Àti pé, “Ìwọ, Olúwa, ní ìbẹ̀rẹ̀ ni o fi ìpìlẹ̀ ayé lélẹ̀, àwọn ọ̀run sì jẹ́ iṣẹ́ ọwọ́ rẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: Àti pé
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àyọlò míì tí ó ṣáájú, ó sì fi hàn pé àfikún àyọlò ni; kò fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: Σὺ
  choice: Ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn ní kedere, ó sì ní ìtẹnumọ́; ìgbékalẹ̀ Yorùbá ‘Ìwọ ... ni o’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: κατ’ ἀρχάς
  choice: ní ìbẹ̀rẹ̀
  rationale: Ó tọ́ka sí ìpilẹ̀ṣẹ̀ tàbí àsìkò ìbẹ̀rẹ̀; èdè yìí jẹ́ ti ẹ̀dá, ó sì bá àyíká ìṣẹ̀dá mu láìfi ìtumọ̀ míì kún un.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè tààrà ti κύριος; ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tó bójú mu, tó sì pa agbára ọ̀rọ̀ inú àyọlò náà mọ́.
- source_word: τὴν γῆν
  choice: ayé
  rationale: Nínú àyíká ìṣẹ̀dá, níbi tí a ti so ó pọ̀ mọ́ ‘àwọn ọ̀run,’ γῆ túmọ̀ sí ayé, kì í ṣe ilẹ̀ agbègbè kan.
- source_word: ἐθεμελίωσας
  choice: fi ìpìlẹ̀ ... lélẹ̀
  rationale: Ó pa àwòrán iṣẹ́ ìkọ́lé inú ọ̀rọ̀-ìṣe Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἔργα τῶν χειρῶν σού
  choice: iṣẹ́ ọwọ́ rẹ
  rationale: Ó pa àwòrán ọwọ́ tó ń ṣe nǹkan mọ́ ní ọ̀nà tó bá èdè Yorùbá mu, láìsọ ọ́ di ọ̀rọ̀ àlàyé.
- source_word: οἱ οὐρανοί
  choice: àwọn ọ̀run
  rationale: Fífi ọ̀pọ̀ hàn bá ọ̀rọ̀ Gíríìkì mu, ó sì tọ́ nínú èdè ìṣẹ̀dá tó fi ọ̀run àti ayé wéra.
theological_decisions:
- issue: Lílo ọ̀rọ̀ inú Sáàmù 102 tí a fi ń bá Olúwa sọ fún Ọmọ nínú Hébérù 1
  choice: Pa ọ̀rọ̀ ìpè tààrà ‘Ìwọ, Olúwa’ mọ́.
  alternative: Ṣe ọ̀rọ̀ náà ní àìdásí-tọ̀túntòsì sí i kí agbára ìtọ́kasí rẹ̀ sí Ọmọ má ṣe hàn tó bẹ́ẹ̀.
  rationale: Gíríìkì ní κύριε gẹ́gẹ́ bí ọ̀rọ̀ ìpè tààrà. Ìtumọ̀ náà gbọ́dọ̀ pa bí òǹkọ̀wé Hébérù ṣe lo ọ̀rọ̀ yìí mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ìwọ ... ni o’ láti mú ìtẹnumọ́ Gíríìkì jáde, a sì pa àwòrán ‘ìpìlẹ̀’ àti ‘iṣẹ́ ọwọ́’ mọ́.
