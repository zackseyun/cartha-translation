id: HEB.1.3
reference: Hebrews 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: yo
  text: Òun[a] ni ìtànṣán ògo rẹ̀ àti àwòrán pípé ti ìjẹ́ rẹ̀ gan-an[b]; ó ń gbé ohun gbogbo dúró nípasẹ̀ ọ̀rọ̀ agbára rẹ̀. Lẹ́yìn tí ó ti ṣe ìwẹ̀nùmọ́ àwọn ẹ̀ṣẹ̀ nípasẹ̀ ara rẹ̀[c], ó jókòó ní ọwọ́ ọ̀tún Ọláńlá ní ibi gíga[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Òun” ń tọ́ka sí Ọmọ tí a mẹ́nu kàn ní ẹsẹ 2.
    reason: referent_clarification
  - marker: b
    text: Tàbí, “àwòrán pípé ti ìṣẹ̀dá rẹ̀,” tàbí “àwòrán pípé ti ohun tí ó jẹ́ gan-an.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé àfọwọ́kọ kan kò ní “nípasẹ̀ ara rẹ̀”; a fi àpólà náà sínú ọ̀rọ̀ níbí ní ìbámu pẹ̀lú ẹ̀dà SBLGNT.
    reason: textual_variant
  - marker: d
    text: 'Ní gígùn-ún-mọ́-ọrọ̀: “ní ọwọ́ ọ̀tún Ọláńlá ní àwọn ibi gíga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ìtànṣán
  rationale: “Ìtànṣán” fi àwòrán ìmọ́lẹ̀ tí ń jáde hàn ní Yorùbá adayébá, ó sì yẹra fún èrò pé Ọmọ jẹ́ àfihàn tí ń ṣe àfarawe lásán.
- source_word: δόξα
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ fún ọlá àti ìmọ́lẹ̀ ọ̀run tí δόξα ń tọ́ka sí níbí.
- source_word: χαρακτήρ
  choice: àwòrán gẹ́lẹ́
  rationale: Ọ̀rọ̀ yìí sọ ìbámu pípé tí àmì tí a tẹ̀ ní sí ohun tí ó tẹ̀ ẹ́; “gẹ́lẹ́” mú ìpéye yẹn hàn láìsọ ọ̀rọ̀ náà di èdè ìmọ̀-ìjìnlẹ̀ ẹ̀sìn.
- source_word: ὑπόστασις
  choice: ìwàláàyè
  rationale: Ní àyíká yìí, “ìwàláàyè” ń tọ́ka sí òtítọ́ ohun tí Ọlọ́run jẹ́. Ó yàgò fún gbígbé àwọn ọ̀rọ̀ ìmọ̀-ìjìnlẹ̀ ti àkókò tó tẹ̀ lé e wọ inú ẹsẹ náà, bí ó tilẹ̀ jẹ́ pé “ìṣẹ̀dá” tàbí “ìjẹ́-òun-tí-ó-jẹ́” tún ṣeé ṣe.
- source_word: φέρων
  choice: ń gbé ... dúró
  rationale: Àpólà yìí sọ iṣẹ́ tí ń bá a lọ ti pípa gbogbo ohun mọ́ àti mímú wọn dúró, kì í ṣe gbígbé wọn lọ lásán.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: “Ohun gbogbo” pa ìtẹ̀sí gbogbo-gbòò ti Gíríìkì mọ́ láìfi í mọ́ àgbáyé ti ara nìkan.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: nípasẹ̀ ọ̀rọ̀ agbára rẹ̀
  rationale: Èyí pa ìtumọ̀ ọ̀rọ̀ tí agbára Ọlọ́run ń ṣiṣẹ́ nípasẹ̀ rẹ̀ mọ́, láìdín ῥῆμα kù sí “àṣẹ” nìkan.
- source_word: δι’ αὑτοῦ
  choice: fi ara rẹ̀
  rationale: Nínú ìtumọ̀ Yorùbá, “fi ara rẹ̀ ṣe” ń sọ pé òun fúnra rẹ̀ ni ọ̀nà tí ìwẹ̀nùmọ́ fi ṣẹlẹ̀, ó sì mú ipá διὰ pẹ̀lú ọ̀rọ̀ arọ́pò onítẹnumọ́ hàn lọ́nà adayébá.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: ìwẹ̀nùmọ́ fún àwọn ẹ̀ṣẹ̀
  rationale: “Ìwẹ̀nùmọ́” pa àbùdá ìrúbọ àti ìsìn ti καθαρισμός mọ́; “fún àwọn ẹ̀ṣẹ̀” sọ pé ìwẹ̀nùmọ́ náà ń bá ẹ̀ṣẹ̀ lò.
- source_word: ἐκάθισεν ἐν δεξιᾷ
  choice: ó jókòó ní ọwọ́ ọ̀tún
  rationale: Àṣà ọ̀rọ̀ Yorùbá yìí pa àwòrán ipò ọlá àti àṣẹ tí ó wà nínú Gíríìkì mọ́.
- source_word: τῆς μεγαλωσύνης ἐν ὑψηλοῖς
  choice: Ọba Aláṣẹ ní ibi gíga
  rationale: “Ọba Aláṣẹ” jẹ́ ọ̀nà adayébá láti sọ akọ́lé ìbọ̀wọ̀ “Ọláńlá” fún Ọlọ́run; “ní ibi gíga” pa àwòrán ọ̀run àti ààyè gíga mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὑπόστασις nínú ẹsẹ tí ó ṣe pàtàkì sí ẹ̀kọ́ nípa Kristi
  choice: ìwàláàyè
  alternative: ìṣẹ̀dá; ohun tí ó jẹ́ gan-an
  rationale: A yan ọ̀rọ̀ tí ó tọ́ka sí òtítọ́ ìjẹ́ Ọlọ́run láìfi àwọn ìtumọ̀ ìmọ̀-ìjìnlẹ̀ ẹ̀sìn tí ó dágbà lẹ́yìn náà lé ẹsẹ náà lórí.
- issue: Agbára ọ̀rọ̀ nípa Kristi nínú ἀπαύγασμα àti χαρακτήρ
  choice: ìtànṣán ògo ... àwòrán gẹ́lẹ́
  alternative: àfihàn ògo ... àwòrán
  rationale: Àṣàyàn náà pa ìbáṣepọ̀ Ọmọ pẹ̀lú ògo Ọlọ́run àti ìbámu pípé rẹ̀ pẹ̀lú òtítọ́ Ọlọ́run mọ́, láìdín un kù sí àfarawe lásán.
- issue: Ìyàtọ̀ àwọn ìwé àfọwọ́kọ lórí δι’ αὑτοῦ
  choice: fi ara rẹ̀
  alternative: fi ọ̀rọ̀ náà sílẹ̀; fúnra rẹ̀
  rationale: SBLGNT ní δι’ αὑτοῦ, nítorí náà a túmọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ sọ ìyàtọ̀ àwọn ẹ̀rí ìwé àfọwọ́kọ ní kedere.
- issue: “Ọláńlá” gẹ́gẹ́ bí akọ́lé fún Ọlọ́run
  choice: Ọba Aláṣẹ
  alternative: Ẹni Ọláńlá
  rationale: “Ọba Aláṣẹ” bá Yorùbá adayébá mu, ó sì fi ipò gíga àti ọlá Ọlọ́run hàn; àlàyé ìsàlẹ̀ pa ìtumọ̀ gígùn-ún-mọ́-ọrọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pín gbólóhùn Gíríìkì gígùn sí gbólóhùn mẹ́ta fún ìmúlò Yorùbá adayébá, láìpàdánù ìbáṣepọ̀ àwọn ọ̀rọ̀ tàbí ìtẹ̀sí ẹ̀kọ́ nípa Kristi.
