id: HEB.1.13
reference: Hebrews 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: yo
  text: 'Ṣùgbọ́n, sí èwo nínú àwọn áńgẹ́lì ni ó ti sọ rí pé,


    “Jókòó ní ọwọ́ ọ̀tún mi,


    títí èmi yóò fi sọ àwọn ọ̀tá rẹ


    di ìtìsẹ̀ fún àwọn ẹsẹ̀ rẹ”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí èmi yóò fi fi àwọn ọ̀tá rẹ sábẹ́ àwọn ẹsẹ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Ṣùgbọ́n èwo nínú àwọn áńgẹ́lì ni
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ tí δέ ń fi hàn síwájú láti inú àríyànjiyàn ẹsẹ̀ tó ṣáájú; ìṣètò “èwo ... ni” jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àsọyé yìí.
- source_word: εἴρηκέν ποτε
  choice: ó ti sọ fún rí
  rationale: “ti sọ” ń fi agbára ọ̀rọ̀ tí a ti sọ tí ó sì ṣì dúró hàn, “rí” sì ń gbé ìtumọ̀ ποτέ, ‘nígbà kan rí/rárá rí,’ jáde nínú ìbéèrè.
- source_word: Κάθου
  choice: Jókòó
  rationale: Àṣẹ tààrà àti ọ̀rọ̀ Yorùbá tó wọ́pọ̀ ni “Jókòó,” láìfi àlàyé míì kún un.
- source_word: ἐκ δεξιῶν μου
  choice: ní apá ọ̀tún mi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ipò ọlá lẹ́gbẹ̀ẹ́ ẹni; ó pa àwòrán ìjokòó lórí ìtẹ́ mọ́.
- source_word: ἕως ἂν θῶ
  choice: títí èmi yóò fi sọ ... di
  rationale: “títí ... yóò fi” sọ ìṣe ọjọ́ iwájú tí ἕως ἂν tọ́ka sí; “sọ ... di” bá àkópọ̀ tíθημι pẹ̀lú ὑποπόδιον mu ní Yorùbá.
- source_word: τοὺς ἐχθρούς σου
  choice: àwọn ọ̀tá rẹ
  rationale: Ìtumọ̀ tààrà, kedere, tí ó sì pa ọ̀pọ̀ nọ́ńbà mọ́.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ
  rationale: “Àpótí ìtìsẹ̀” pa àwòrán Ìwé Mímọ́ nípa fífi àwọn ọ̀tá sábẹ́ àṣẹ mọ́; “fún ẹsẹ̀ rẹ” tún pa ìrísí gbólóhùn orísun mọ́ ní Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Bí a ṣe máa pa agbára Kristi nínú àyọlò Sáàmù 110:1 mọ́ láìṣàlàyé rẹ̀ ré kọjá ọ̀rọ̀ orísun
  choice: A pa ọ̀rọ̀ àṣẹ ìjokòó ní apá ọ̀tún àti àwòrán àpótí ìtìsẹ̀ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí a sọ sí Ọmọ náà, ní ìyàtọ̀ sí àwọn áńgẹ́lì.
  alternative: Kí a túmọ̀ àwòrán náà ní kíkún sí ‘títí èmi yóò fi ṣẹ́gun àwọn ọ̀tá rẹ pátápátá.’
  rationale: Àríyànjiyàn Hébérù sinmi lórí ọ̀rọ̀ tí a fa yọ gan-an àti ìyàtọ̀ láàárín Ọmọ náà àti àwọn áńgẹ́lì. Nítorí náà, a kò sọ àwòrán ìjọba àti ìtẹríba di àlàyé lásán.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè àsọyé náà dúró gẹ́gẹ́ bí ìbéèrè, a sì ṣètò àyọlò náà sí ìlà ewì láti jẹ́ kí ó rọrùn láti kà. A fi akọ́rọ̀-ìṣe orísun tí kò sọ orúkọ ẹni náà ní gbangba pamọ́ pẹ̀lú “ó,” dípò fífi “Ọlọ́run” kún ọ̀rọ̀ náà.
