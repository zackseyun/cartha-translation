id: HEB.1.2
reference: Hebrews 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: yo
  text: ní àwọn ọjọ́ ìkẹyìn wọ̀nyí, ó ti bá wa sọ̀rọ̀ nínú Ọmọ[a], ẹni tí ó fi ṣe ajogún ohun gbogbo, ẹni tí ó sì dá àwọn ìgbà ayé[b] nípasẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ọmọ.” Gíríìkì ní “nínú Ọmọ” ní tààrà, láìní article pàtó níwájú “Ọmọ”; èyí tẹnu mọ́ ọ̀nà àti ipò gíga tí Ọlọ́run fi sọ̀rọ̀ nípasẹ̀ Ọmọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àgbáyé” tàbí “àwọn ayé.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “àwọn ìgbà ayé,” ó sì lè tọ́ka sí gbogbo ètò ìṣẹ̀dá pẹ̀lú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: ní òpin àwọn ọjọ́ wọ̀nyí
  rationale: Ó tẹ̀ lé àwòrán Gíríìkì pé a wà ní ìparí àwọn ọjọ́ wọ̀nyí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, láìsọ agbára ọ̀rọ̀ nípa àkókò ìkẹyìn nù.
- source_word: ἐλάλησεν ἡμῖν
  choice: ó ti bá wa sọ̀rọ̀
  rationale: ‘Ó ti … sọ̀rọ̀’ fi ìṣe tí ó ti ṣẹlẹ̀ tí ó sì ṣì ní ìtumọ̀ fún ìsinsìnyí hàn; ‘bá wa sọ̀rọ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé Ọlọ́run sọ̀rọ̀ sí wa.
- source_word: ἐν υἱῷ
  choice: nínú Ọmọ kan
  rationale: ‘Nínú’ pa ìtumọ̀ ἐν mọ́ ju gígbe e kàn sí ohun èlò lọ, ‘Ọmọ kan’ sì fi àìsí article níwájú υἱῷ hàn láìfi ‘Ọmọ rẹ̀’ kún ọ̀rọ̀ orísun.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: ẹni tí ó yàn ní ajogún ohun gbogbo
  rationale: Nínú àyíká yìí, τίθημι túmọ̀ sí yíyan tàbí fífi sí ipò; ‘ajogún ohun gbogbo’ jẹ́ kedere, ó sì pa fífẹ̀ πάντων mọ́.
- source_word: δι’ οὗ
  choice: nípasẹ̀ ẹni tí
  rationale: Ó fi ipa alárinà tàbí ọ̀nà tí διά pẹ̀lú genitive ń tọ́ka sí hàn, ó sì bá relative clause Yorùbá mu.
- source_word: ἐποίησεν
  choice: dá
  rationale: Nínú ọ̀rọ̀ nípa ìpilẹ̀ gbogbo ohun, ‘dá’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ ìṣẹ̀dá, bí ó tilẹ̀ jẹ́ pé ποιέω fúnra rẹ̀ gbòòrò sí ‘ṣe.’
- source_word: τοὺς αἰῶνας
  choice: àwọn àkókò
  rationale: Yíyan yìí pa ìtumọ̀ àkọ́kọ́ ti αἰῶνες gẹ́gẹ́ bí àwọn sáà tàbí ages mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ fífẹ̀ sí gbogbo ètò ìṣẹ̀dá hàn.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa Ọmọ nínú ἐν υἱῷ
  choice: nínú Ọmọ kan
  alternative: nípasẹ̀ Ọmọ kan; nínú Ọmọ náà; nípasẹ̀ Ọmọ rẹ̀
  rationale: Ìtumọ̀ yìí pa preposition àti àìsí article mọ́, ó sì fi hàn pé ọ̀nà gíga jù lọ tí Ọlọ́run gbà sọ̀rọ̀ ní ìkẹyìn ní ìwà Ọmọ, láìfi possessive tí kò sí nínú Gíríìkì kún un.
- issue: Ìwọ̀n ìtumọ̀ τοὺς αἰῶνας àti ipa Ọmọ nínú ìṣẹ̀dá
  choice: àwọn àkókò
  alternative: gbogbo àgbáyé; àwọn ayé
  rationale: αἰῶνες lè tọ́ka sí àwọn sáà, ó sì tún lè gbòòrò dé gbogbo ètò àkókò àti ìṣẹ̀dá. Ọ̀rọ̀ àkọ́kọ́ dúró nínú main text, nígbà tí àlàyé ń pa ìtumọ̀ cosmological tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ajogún’ àti ‘nípasẹ̀’ jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì bójú mu fún àyíká mímọ́; ‘àwọn àkókò’ mọ̀ọ́mọ̀ pa àìdánilójú temporal-cosmic ti Gíríìkì mọ́.
