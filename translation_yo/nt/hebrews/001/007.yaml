  to: 'Ní ti àwọn áńgẹ́lì, ó sì sọ pé,


    “Ó sọ àwọn áńgẹ́lì rẹ̀ di ẹ̀fúùfù,[a]

    àti àwọn ìránṣẹ́ rẹ̀ di iná kan tí ń jó.”'
  rationale: A single lexical revision replaces an unclear rendering of “flame of fire” with idiomatic Yorùbá. The revised wording retains the poetic parallel, the active sense of ποιῶν, and the singular image of πυρὸς φλόγα; all other wording and the ambiguity footnote are retained.
  reviewer_model: gpt-5.6-terra
