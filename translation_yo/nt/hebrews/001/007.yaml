id: HEB.1.7
reference: Hebrews 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: yo
  text: 'Ní ti àwọn áńgẹ́lì, ó sì sọ pé,


    “Ó sọ àwọn áńgẹ́lì rẹ̀ di ẹ̀fúùfù,[a]

    àti àwọn ìránṣẹ́ rẹ̀ di iná kan tí ń jó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ẹ̀mí”: ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ẹ̀fúùfù” tàbí “ẹ̀mí.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Ní ti àwọn áńgẹ́lì
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ohun tí Ọlọ́run sọ nípa àwọn áńgẹ́lì, kì í ṣe ọ̀rọ̀ tí ó bá wọn sọ ní tààràtà. “Ní ti” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ àkòrí náà hàn.
- source_word: λέγει
  choice: ó sì sọ pé
  rationale: A pa ìṣe ọ̀rọ̀ náà mọ́ ní àkókò ìsinsìnyí gẹ́gẹ́ bí ọ̀nà tí olùkọ̀wé fi ń tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí èyí tí ń sọ̀rọ̀ nísinsìnyí.
- source_word: Ὁ ποιῶν
  choice: Ó sọ ... di
  rationale: Ìṣètò “sọ ... di” jẹ́ Yorùbá àdánidá fún ìtumọ̀ pé ó mú kí wọ́n jẹ́ ohun tí a dárúkọ, ó sì pa agbára ìṣe ποιῶν mọ́.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Àyíká Hébérù 1 ń sọ nípa àwọn ẹ̀dá ọ̀run tí a fi wé Ọmọ; nítorí náà “áńgẹ́lì” dára ju ọ̀rọ̀ gbogbogbò “òjíṣẹ́” lọ.
- source_word: πνεύματα
  choice: ẹ̀fúùfù
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ẹ̀fúùfù” tàbí “ẹ̀mí.” “Ẹ̀fúùfù” bá àwòrán ewì inú Sáàmù 104:4 àti ọ̀wọ́ iná tó tẹ̀ lé e mu; a pa “ẹ̀mí” mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: λειτουργοὺς
  choice: àwọn ìránṣẹ́
  rationale: “Àwọn ìránṣẹ́” túmọ̀ ẹni tí ń ṣe iṣẹ́ fún ẹlòmíràn ní kedere, láì fi ipò ṣọ́ọ̀ṣì kan tí ó wá lẹ́yìn náà kún ọ̀rọ̀ náà.
- source_word: πυρὸς φλόγα
  choice: ọ̀wọ́ iná
  rationale: “Ọ̀wọ́ iná” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ìrísí ewì fún ẹyọ ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí ọwọ́ iná kan.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ ohun-ìní náà ń tọ́ka sí Ọlọ́run, “rẹ̀” sì jẹ́ ìtumọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πνεύματα nínú àyọlò Sáàmù 104:4
  choice: ẹ̀fúùfù
  alternative: ẹ̀mí
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ méjèèjì ní Gíríìkì. “Ẹ̀fúùfù” bá ìpìlẹ̀ Hébérù àti àfiwé rẹ̀ pẹ̀lú “ọ̀wọ́ iná” mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “ẹ̀mí” mọ́ kí a má bàa mú àìdánilójú ojúlówó náà kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. Ìtòlẹ́sẹẹsẹ ewì náà pa ìfiwéra “ẹ̀fúùfù / ọ̀wọ́ iná” mọ́, àmì àlàyé [a] sì wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn ọ̀rọ̀ tí ó kan.
