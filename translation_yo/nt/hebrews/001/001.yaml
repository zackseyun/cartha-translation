  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: yo
  text: Ní ìgbà àtijọ́, Ọlọ́run sọ̀rọ̀ sí àwọn baba[c] ní ọ̀pọ̀ ìpín[a] àti ní ọ̀pọ̀ ọ̀nà nípasẹ̀ àwọn wòlíì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀pọ̀ apá.” Ọ̀rọ̀ Gíríìkì yìí yàtọ̀ sí “ní ọ̀pọ̀ ọ̀nà”; ó ń fi hàn pé ọ̀rọ̀ tí Ọlọ́run sọ ní ìgbà àtijọ́ wá ní àwọn ìpín púpọ̀ àti ní oríṣiríṣi ọ̀nà.
    reason: lexical_alternative
  - marker: b
    text: Ní ti ọ̀rọ̀-ní-ọ̀rọ̀, “nínú àwọn wòlíì.” Níhìn-ín, ó lè túmọ̀ sí “nípasẹ̀ àwọn wòlíì.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn baba ńlá.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: ní ọ̀pọ̀ apá
  rationale: Èyí fi hàn pé ìṣípayá ìgbà àtijọ́ wá ní apá tàbí ìpín púpọ̀, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí πολυτρόπως, tí ó ń tọ́ka sí oríṣiríṣi ọ̀nà.
- source_word: πολυτρόπως
  choice: ní ọ̀pọ̀ ọ̀nà
  rationale: Ọ̀rọ̀ yìí ń sọ nípa oríṣiríṣi ìlànà tàbí ọ̀nà tí Ọlọ́run gbà sọ̀rọ̀; gbólóhùn náà ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: πάλαι
  choice: Ní ìgbà pípẹ́ sẹ́yìn
  rationale: Ó sọ àkókò tí ó ti kọjá tipẹ́ ní èdè Yorùbá àdánidá láì lo ọ̀rọ̀ àtijọ́ tí ó le ṣòro fún òǹkàwé.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà fún olùṣe ìṣe nínú gbólóhùn Gíríìkì.
- source_word: λαλήσας
  choice: sọ̀rọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ participle tí gbólóhùn ẹsẹ kejì parí, fífi í ṣe ọ̀rọ̀-ìṣe pípé mú kí ẹsẹ yìí ṣe kedere ní Yorùbá, ó sì ṣì múra ọ̀nà sílẹ̀ fún ìfiwéra pẹ̀lú ẹsẹ 2.
- source_word: τοῖς πατράσιν
  choice: fún àwọn baba
  rationale: “Àwọn baba” pa ọ̀rọ̀ ìtàn májẹ̀mú àti ìṣàmúlò akọ nínú orísun mọ́; “fún” jẹ́ ọ̀nà àdánidá láti sọ ẹni tí a bá sọ̀rọ̀ ní Yorùbá.
- source_word: ἐν τοῖς προφήταις
  choice: nípasẹ̀ àwọn wòlíì
  rationale: Níhìn-ín, ἐν ń fi àwọn wòlíì hàn gẹ́gẹ́ bí aṣojú tí Ọlọ́run fi sọ̀rọ̀. “Nípasẹ̀” jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ọ̀rọ̀-ní-ọ̀rọ̀ ni “nínú.”
theological_decisions:
- issue: Ìtumọ̀ participle λαλήσας ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Hébérù 1:2
  choice: Lo ọ̀rọ̀-ìṣe pípé “Ọlọ́run sọ̀rọ̀” nínú ẹsẹ 1, kí ìyàtọ̀ àkókò pẹ̀lú ẹsẹ 2 lè dúró.
  alternative: “Ọlọ́run, lẹ́yìn tí ó ti sọ̀rọ̀...” tàbí “Ọlọ́run, ẹni tí ó ti sọ̀rọ̀...”
  rationale: Ìṣètò Gíríìkì so participle ẹsẹ 1 mọ́ ọ̀rọ̀-ìṣe pàtàkì nínú ẹsẹ 2. Ṣùgbọ́n ẹsẹ kan ṣoṣo yóò dà bí gbólóhùn tí kò parí bí a bá túmọ̀ ọ́ lọ́nà ọ̀rọ̀-ní-ọ̀rọ̀. Yíyan ọ̀rọ̀-ìṣe pípé pa ìtumọ̀ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìyàtọ̀ láàárín “ní ọ̀pọ̀ apá” àti “ní ọ̀pọ̀ ọ̀nà” mọ́.
