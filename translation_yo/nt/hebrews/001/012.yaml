  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: yo
  text: àti bí aṣọ àwọ̀lékè ni ìwọ yóò dì wọ́n pọ̀[a]; bí ẹ̀wù ni wọn yóò sì yí padà. Ṣùgbọ́n ìwọ jẹ́ ẹni kan náà[b], àwọn ọdún rẹ sì kì yóò dópin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwọ yóò wọ́n wọn pọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwọ kò yí padà.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní ọ̀rọ̀-orí-ọ̀rọ̀: “àwọn ọdún rẹ kì yóò kùnà”; ìtumọ̀ rẹ̀ ni pé wọn kì yóò parí tàbí ṣíwọ́.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: bí aṣọ àwọ̀lékè
  rationale: Ó fi ìfiwéra hàn, ó sì pa àwòrán aṣọ tí a máa ń wọ sí òde mọ́. ‘Aṣọ àwọ̀lékè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì ní adùn ọ̀rọ̀ àtijọ́ ju.
- source_word: ἑλίξεις
  choice: ìwọ yóò ká wọn pọ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí yí ohun ká tàbí ṣe é pọ̀. ‘Ká wọn pọ̀’ bá àwòrán bí a ṣe ń kó aṣọ jọ mu, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ohun tí Ọlọ́run dá tí a mẹ́nu kàn ní àyíká ẹsẹ̀ yìí.
- source_word: ὡς ἱμάτιον
  choice: bí ẹ̀wù
  rationale: ‘Ẹ̀wù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún aṣọ tí a wọ̀, ó sì pa ìfiwéra kejì mọ́ láìṣe àtúnwí ‘aṣọ àwọ̀lékè.’
- source_word: ἀλλαγήσονται
  choice: wọn yóò sì yí padà
  rationale: Ó sọ pé ìṣẹ̀dá yóò ní ìyípadà. Èdè Yorùbá yìí jẹ́ àdánidá, kò sì pinnu ju Gíríìkì lọ nípa irú ìyípadà náà tàbí ẹni tó mú un ṣẹlẹ̀.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Ṣùgbọ́n ìwọ ṣì jẹ́ ẹni kan náà
  rationale: Ó fi ìdúróṣinṣin ẹni tí a ń bá sọ̀rọ̀ yàtọ̀ sí ìṣẹ̀dá tó ń yí padà. Ó sún mọ́ ọ̀rọ̀ Gíríìkì láìfi èdè ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: ọdún rẹ kì yóò sì dópin
  rationale: ‘Dópin’ mú ìtumọ̀ pé àwọn ọdún náà kò ní parí tàbí ṣíwọ́ jáde kedere, ó sì bá ìlò Yorùbá mu ju ìtumọ̀ gígùn bí ‘kùnà’ lọ ní àyíká yìí.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àìyípadà ẹni tí a ń tọ́ka sí nínú àyọlò tó ń sọ nípa Ọmọ
  choice: Ṣùgbọ́n ìwọ ṣì jẹ́ ẹni kan náà
  alternative: Ṣùgbọ́n ìwọ kò yí padà
  rationale: Èyí pa ìṣọ̀kan pẹ̀lú ὁ αὐτός mọ́, ó sì jẹ́ kí ìyàtọ̀ láàárín ìṣẹ̀dá tó ń yí padà àti ẹni tó dúró gẹ́gẹ́ bí ẹni kan náà hàn, láìyí ọ̀rọ̀ náà sí gbólóhùn ẹ̀kọ́ ìsìn tó ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ, ó sì ní ìwọ̀ntúnwọ̀nsì ewì tó bá àyọlò Sáàmù mu. A lo ‘aṣọ àwọ̀lékè’ àti ‘ẹ̀wù’ láti pa àwòrán aṣọ méjèèjì mọ́, nígbà tí gbólóhùn náà ṣì ṣe kedere fún òǹkàwé òde òní.
