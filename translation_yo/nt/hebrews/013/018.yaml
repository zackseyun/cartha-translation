id: HEB.13.18
reference: Hebrews 13:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: yo
  text: Ẹ gbàdúrà fún wa, nítorí ó dá wa lójú[a] pé a ní ẹ̀rí-ọkàn rere[b], níwọ̀n bí a ti fẹ́ máa hùwà dáadáa nínú ohun gbogbo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ní ìdánilójú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀rí-ọkàn tí kò dá wa lẹ́bi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a sì fẹ́ máa hùwà lọ́nà tó yẹ nínú ohun gbogbo.”
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Ẹ gbàdúrà
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá láìfi dandan túmọ̀ aspect ìsinsìnyí sí ‘ẹ máa bá a lọ.’
- source_word: περὶ ἡμῶν
  choice: fún wa
  rationale: Pẹ̀lú ọ̀rọ̀ àdúrà, περί pẹ̀lú genitive túmọ̀ sí àdúrà tí a ń gbà nítorí ẹlòmíràn; ‘fún wa’ ni èdè Yorùbá àdánidá.
- source_word: πειθόμεθα
  choice: ó dá wa lójú
  rationale: Ó fi ìdánilójú tàbí ìgbàgbọ́ ọkàn àwọn akọ̀wé hàn, ó sì bá agbára ìmọ̀-inú tí πείθω ní mu.
- source_word: καλὴν συνείδησιν
  choice: ẹ̀rí-ọkàn rere
  rationale: ‘Ẹ̀rí-ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún συνείδησις, ‘rere’ sì pa ìtumọ̀ gbooro καλὴν mọ́ láìfi dandan sọ ọ́ di ẹ̀rí-ọkàn tí kò dá ènìyàn lẹ́bi.
- source_word: ἔχομεν
  choice: a ní
  rationale: Ó túmọ̀ ìṣe ìsinsìnyí náà ní tààràtà àti ní èdè Yorùbá àdánidá.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtumọ̀ tó kan gbogbo apá ìgbésí ayé mọ́.
- source_word: καλῶς
  choice: dáadáa
  rationale: Ọ̀rọ̀ náà ṣe àpèjúwe bí wọ́n ṣe fẹ́ hùwà; ‘dáadáa’ jẹ́ gbooro, ó sì yẹra fún fífi ìtumọ̀ ‘ọ̀wọ̀’ tàbí ‘ọlá’ kún un láìdandan.
- source_word: θέλοντες
  choice: níwọ̀n bí a ti fẹ́
  rationale: Ó sọ participle náà di èdè Yorùbá tó ṣe kedere, ní mímú un gẹ́gẹ́ bí àlàyé fún ìdí tí wọ́n fi sọ pé àwọn ní ẹ̀rí-ọkàn rere, láìsọ pé wọ́n jẹ́ aláìlẹ́ṣẹ̀.
- source_word: ἀναστρέφεσθαι
  choice: máa hùwà
  rationale: Nínú àyíká ọ̀rọ̀ ìwà rere, ó tọ́ka sí ìwà àti ọ̀nà ìgbésí ayé; ‘máa hùwà’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ gbólóhùn participle θέλοντες pẹ̀lú ọ̀rọ̀ pé wọ́n ní ẹ̀rí-ọkàn rere
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àlàyé tàbí ìdí: ‘níwọ̀n bí a ti fẹ́ máa hùwà dáadáa nínú ohun gbogbo.’'
  alternative: 'A lè fi í sílẹ̀ bí gbólóhùn tó tẹ̀ lé e pé: ‘a sì fẹ́ máa hùwà dáadáa nínú ohun gbogbo.’'
  rationale: Participle Gíríìkì náà lè jẹ́ ti ìdí tàbí ti àyíká ọ̀rọ̀. ‘Níwọ̀n bí’ jẹ́ Yorùbá tó ṣe kedere, ó sì fi ìfẹ́-ọkàn wọn hàn gẹ́gẹ́ bí ìpìlẹ̀ ẹ̀rí-ọkàn rere wọn, láìsọ ìbéèrè ẹ̀kọ́ ìgbàgbọ́ náà di ti àìlẹ́ṣẹ̀ pátápátá.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àṣẹ ‘Ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ, ‘ẹ̀rí-ọkàn’ sì jẹ́ ọ̀rọ̀ ìwà rere tí ó wọ́pọ̀ nínú Yorùbá.
