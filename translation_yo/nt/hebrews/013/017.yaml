id: HEB.13.17
reference: Hebrews 13:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: yo
  text: Ẹ jẹ́ kí àwọn aṣáájú yín mú yín dá lójú, ẹ sì tẹrí ba fún wọn,[a] nítorí wọ́n ń ṣọ́ ọkàn yín gẹ́gẹ́ bí àwọn tí yóò jíhìn nípa yín, kí wọ́n lè ṣe bẹ́ẹ̀ pẹ̀lú ayọ̀, láìsí ìkérora; nítorí èyí kò ní àǹfààní fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ẹ ṣègbọràn sí àwọn aṣáájú yín, kí ẹ sì tẹrí ba fún wọn.” Ọ̀rọ̀ Gíríìkì náà, Πείθεσθε, lè ní ìtumọ̀ ‘ṣègbọràn’; ṣùgbọ́n ní ìtumọ̀ rẹ̀ tó sún mọ́ ọ̀rọ̀ náà gan-an, ó túmọ̀ sí jíjẹ́ kí ẹlòmíràn mú ẹni dá lójú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Ẹ jẹ́ kí àwọn aṣáájú yín yí èrò yín padà
  rationale: Ó pa ìtumọ̀ pé kí a gba ọ̀rọ̀ wọn gbọ́ tàbí jẹ́ kí wọ́n mú wa dá a lójú mọ́, dípò kí a sọ ọ́ di ìgbọràn aláìní ààlà. Àṣàyàn ‘Ẹ ṣègbọràn’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡγουμένοις
  choice: àwọn aṣáájú yín
  rationale: Ó tọ́ka sí àwọn tí a mọ̀ sí olùdarí àwùjọ, láìfi agbára aláṣẹ tí ó le jù kún ọ̀rọ̀ náà.
- source_word: ὑπείκετε
  choice: kí ẹ sì juwọ́ sílẹ̀ fún wọn
  rationale: Ó sọ ìtẹ̀sí láti yọ̀ǹda tàbí fi ààyè gba ìdarí wọn, ó sì pa á mọ́ gẹ́gẹ́ bí èrò kejì tí ó yàtọ̀ sí Πείθεσθε.
- source_word: ἀγρυπνοῦσιν
  choice: ń ṣọ́ ... láìṣọ̀fọ̀
  rationale: Ó pa àwòrán ìṣọ́ra tí kò sùn mọ́, ó sì bá iṣẹ́ àbójútó mu ní Yorùbá.
- source_word: ψυχῶν
  choice: ọkàn yín
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹ̀mí/inú ẹni ní àyíká ẹ̀mí, bí ó tilẹ̀ jẹ́ pé ψυχή tún lè tọ́ka sí ìwàláàyè tàbí ẹni lápapọ̀.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: bí àwọn tí yóò jíhìn
  rationale: 'Ó pa ìtumọ̀ ojúṣe ọjọ́ iwájú mọ́: àwọn aṣáájú yóò sọ bí wọ́n ti ṣe ojúṣe wọn.'
- source_word: μετὰ χαρᾶς
  choice: fi ayọ̀
  rationale: Ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá gbólóhùn náà mu.
- source_word: στενάζοντες
  choice: pẹ̀lú ìkérora
  rationale: Ó pa àwòrán ìmí ẹ̀dùn tàbí ìkérora mọ́, dípò yíyí i padà sí ìbànújẹ́ lásán.
- source_word: ἀλυσιτελὲς
  choice: kì yóò ṣe yín ní àǹfààní
  rationale: Ó túmọ̀ sí ohun tí kò ní èrè tàbí àǹfààní; yíyàn yìí yẹra fún lílo ‘ipalára,’ èyí tí ó le ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Irú ìṣírí tí a ń fún àwọn onígbàgbọ́ nípa àwọn aṣáájú
  choice: Ìgbẹ́kẹ̀lé tí ó fèsì sí ìdarí wọn àti jíjuwọ́ sílẹ̀ fún wọn
  alternative: Àṣẹ láti ṣègbọràn pátápátá sí àwọn aṣáájú láìsí ààlà
  rationale: Àwọn ọ̀rọ̀ méjèèjì Πείθεσθε àti ὑπείκετε ń pe fún gbígba ìtọ́sọ́nà àti yíyọ̀ǹda, ṣùgbọ́n wọn kò fi dandan mú ìgbọràn aláìní ààlà wọ inú ẹsẹ náà. Ìdí tí ẹsẹ náà fún ni pé àwọn aṣáájú ń ṣọ́ àwọn ènìyàn, wọn yóò sì jíhìn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Yí èrò yín padà’ ń ṣàfihàn ìtumọ̀ Πείθεσθε lọ́nà àdánidá, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ pa ‘ṣègbọràn’ mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe.
