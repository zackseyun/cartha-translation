  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: yo
  text: Nítorí náà, a lè fi ìgboyà sọ pé, “Olúwa ni olùrànlọ́wọ́ mi; ẹ̀rù kì yóò bà mí. Kí ni ènìyàn lè ṣe sí mi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìtumọ̀ ohun tí a sọ ṣáájú hàn, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: ẹ jẹ́ kí a fi ìgboyà sọ
  rationale: Èyí mú ìtumọ̀ ìgboyà inú θαρροῦντας àti ọ̀rọ̀ sísọ inú λέγειν jáde ní Yorùbá tí ó ṣe kedere, láì sọ ọ́ di àṣẹ líle.
- source_word: Κύριος
  choice: Olúwa
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì fún κύριος gẹ́gẹ́ bí orúkọ oyè Ọlọ́run.
- source_word: ἐμοὶ βοηθός
  choice: olùrànlọ́wọ́ mi
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ń ṣèrànwọ́ fún ẹni tó ń sọ̀rọ̀; ìsọ̀rí oníni jẹ́ àdánidá ní Yorùbá.
- source_word: οὐ φοβηθήσομαι
  choice: ẹ̀rù kì yóò bà mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe ọjọ́ iwájú náà pé ẹni náà kì yóò bẹ̀rù.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Kí ni ènìyàn lè ṣe sí mi?
  rationale: Bí ποιήσει tilẹ̀ jẹ́ ọjọ́ iwájú ní ìrísí, ìbéèrè àròsọ náà ń tẹnumọ́ ààlà agbára ènìyàn; “lè ṣe” mú ipa yẹn jáde lọ́nà àdánidá. “Ènìyàn” pa ìtumọ̀ ἄνθρωπος gẹ́gẹ́ bí ẹ̀dá ènìyàn lápapọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπος gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀
  choice: ènìyàn
  alternative: ọkùnrin; ẹnikẹ́ni
  rationale: “Ènìyàn” jẹ́ ẹyọ ọ̀rọ̀ àpapọ̀ ní Yorùbá, kò sì fi ìtumọ̀ náà mọ́ akọ nìkan; ó pa ìṣojú ẹ̀dá ènìyàn kan mọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- issue: Agbára ọjọ́ iwájú inú ποιήσει nínú ìbéèrè àròsọ
  choice: Kí ni ènìyàn lè ṣe sí mi?
  alternative: Kí ni ènìyàn yóò ṣe sí mi?
  rationale: “Lè” sọ ipa àròsọ tí ń dín agbára ìhalẹ̀ ènìyàn kù ní Yorùbá àdánidá, nígbà tí àṣàyàn “yóò” ń pa ìrísí ọjọ́ iwájú mọ́ ní kíkún.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó yẹ. Ìsọ “ẹ jẹ́ kí a” jẹ́ ọ̀nà ìkópa tí ó bá ìtumọ̀ gírámà Gíríìkì mu, kì í ṣe àṣẹ líle.
