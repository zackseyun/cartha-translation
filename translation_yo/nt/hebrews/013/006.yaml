  source_fidelity: 'Àpẹẹrẹ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: “Olúwa,” “olùrànlọ́wọ́ mi,” ìkọ̀ ìbẹ̀rù ọjọ́ iwájú, àti ìbéèrè àròsọ nípa ènìyàn jẹ́ ìtumọ̀ tó pé. Ṣùgbọ́n “ẹ jẹ́ kí a ... sọ” jẹ́ ìkìlọ̀/ìpè sí ìṣe (hortative imperative), nígbà tí ὥστε θαρροῦντας ἡμᾶς λέγειν ń sọ àbájáde pé àwọn onkọ̀wé/àwa lè tàbí ń sọ̀rọ̀ pẹ̀lú ìgboyà; kì í ṣe ìpè pé kí a bẹ̀rẹ̀ sí í sọ ọ́.'
  naturalness: Yorùbá náà jẹ́ adayeba, ó sì ní ìforúkọsílẹ̀ ìjọsìn tí ó bójú mu. “A lè fi ìgboyà sọ pé” jẹ́ ìtúnṣe adayeba tó yọ ìtumọ̀ àṣẹ tí kò wà nínú ìpilẹ̀ Gíríìkì kúrò. “Ẹ̀rù kì yóò bà mí” àti “Kí ni ènìyàn lè ṣe sí mi?” jẹ́ ìsọ̀rọ̀ Yorùbá tó dára.
  terminology: “Olúwa” fún Κύριος àti “olùrànlọ́wọ́” fún βοηθός bójú mu. “Ènìyàn” ń pa agbára ọ̀rọ̀ ẹyọ tí ó jẹ́ àpapọ̀ nínú ἄνθρωπος mọ́, láì fi sí akọ nìkan. Kò sí ẹsẹ̀ ìsàlẹ̀ nínú àwòrán Yorùbá náà tí ó nílò àtúnṣe.
