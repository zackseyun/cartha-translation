id: HEB.13.7
reference: Hebrews 13:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: yo
  text: Ẹ máa rántí àwọn aṣáájú yín, àwọn tí ó sọ ọ̀rọ̀ Ọlọ́run fún yín. Bí ẹ ti ń fara balẹ̀ ronú lórí àbájáde ọ̀nà ìgbésí ayé wọn[b], ẹ máa fara wé ìgbàgbọ́ wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdúróṣinṣin wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́ tàbí ìdúróṣinṣin; ọ̀rọ̀ inú ẹsẹ̀ tẹ̀ lé ìtumọ̀ àkọ́kọ́ tí iṣẹ́ yìí máa ń lò, “ìgbàgbọ́.”
    reason: alternative_reading
  - marker: b
    text: A tún lè tú “àbájáde” sí “òpin”; nínú àwọn ìtumọ̀ kan, ó lè tọ́ka ní pàtó sí bí ikú wọn ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Ẹ máa rántí
  rationale: Ọ̀rọ̀ àṣẹ oníṣe-títẹ̀síwájú yìí ń pe àwọn olùgbọ́ púpọ̀ sí ìrántí tí wọn yóò máa ṣe nígbà gbogbo; “Ẹ máa rántí” jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yẹn.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: àwọn aṣáájú yín
  rationale: Ó tọ́ka sí àwọn tí a mọ̀ sí aṣáájú nínú àwùjọ ìgbàgbọ́; “aṣáájú” fi ipò ìdarí hàn láì sọ ọ́ di ipò òṣèlú tàbí ìjọba aláṣẹ líle.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: àwọn tí ó sọ ọ̀rọ̀ Ọlọ́run fún yín
  rationale: Ó pa ìṣe sísọ àti gbólóhùn “ọ̀rọ̀ Ọlọ́run” mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἀναθεωροῦντες
  choice: Bí ẹ ti ń fara balẹ̀ ronú lórí
  rationale: Ó mú ìṣàkíyèsí pẹ̀lú àròjinlẹ̀ inú participle náà jáde, kì í ṣe wíwo lásán.
- source_word: τὴν ἔκβασιν
  choice: àbájáde
  rationale: “Àbájáde” gba ìtumọ̀ outcome/result láàyè láì fi dandan sọ pé ikú tàbí ikú-ajẹ́rìíkú ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: τῆς ἀναστροφῆς
  choice: ọ̀nà ìgbésí ayé wọn
  rationale: Ó ṣàfihàn ìwà àti bí wọn ṣe gbé ayé wọn, ní èdè Yorùbá tí ó ṣe kedere sí òǹkàwé òde òní.
- source_word: μιμεῖσθε
  choice: ẹ máa fara wé
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ pé kí wọ́n tẹ̀ lé àpẹẹrẹ àwọn aṣáájú náà.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́ wọn
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ fún πίστις nínú iṣẹ́ yìí; àmọ́ a fi “ìṣòtítọ́” sí àlàyé ìsàlẹ̀ nítorí pé ó tún lè bá ọ̀rọ̀ yìí mu.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí a ti lè fara wé ohun tí ó wà lára ènìyàn
  choice: ìgbàgbọ́ wọn
  alternative: ìṣòtítọ́ wọn
  rationale: 'Àwọn méjèèjì lè bá ọ̀rọ̀ náà mu: ó lè jẹ́ ìgbẹ́kẹ̀lé wọn nínú Ọlọ́run tàbí ìdúróṣinṣin wọn. Àkọ́kọ́ tẹ̀ lé ìtumọ̀ àgbékalẹ̀ iṣẹ́ náà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́.'
- issue: Bóyá ἔκβασις ń tọ́ka ní pàtó sí ikú àwọn aṣáájú náà
  choice: àbájáde
  alternative: òpin, tàbí bí ikú wọn ṣe rí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àbájáde tàbí òpin. Yíyan “àbájáde” kò fi èrò ikú-ajẹ́rìíkú tí ẹsẹ náà kò sọ ní gbangba kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn níbi tí ó ti yẹ, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún àwọn òǹkàwé òde òní. “Ẹ máa” pa agbára àṣẹ títẹ̀síwájú mọ́. A gbé àmì [a] sí “ìgbàgbọ́” àti [b] sí “àbájáde,” níbi tí àlàyé kọ̀ọ̀kan ti bá ọ̀rọ̀ rẹ̀ mu.
