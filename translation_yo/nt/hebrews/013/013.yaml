id: HEB.13.13
reference: Hebrews 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ ká jáde lọ sí ọ̀dọ̀ rẹ̀ ní òde ibùdó[a], ká sì ru ẹ̀gàn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní òde ibi tí wọ́n pàgọ́ sí.” Gbólóhùn yìí rántí àwòrán ẹbọ inú Léfítíkù 16 àti àbùkù tí Jésù fara dà ní òde ìlú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Nítorí náà
  rationale: Ọ̀rọ̀ yìí fi àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ ní 13:11–12 hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ ìparí èrò náà.
- source_word: ἐξερχώμεθα
  choice: ẹ jẹ́ kí a jáde lọ
  rationale: Fọ́ọ̀mù ọ̀rọ̀-ìṣe náà jẹ́ ìṣírí ẹni-kìíní ọ̀pọ̀; gbólóhùn yìí pa ìpè sí ìṣe pọ̀ mọ́ ìtumọ̀ ‘jáde’ ní èdè Yorùbá òde òní.
- source_word: πρὸς αὐτὸν
  choice: sọ́dọ̀ rẹ̀
  rationale: πρός pẹ̀lú accusative ń tọ́ka sí ìlọ sí ọ̀dọ̀ ẹni kan; ‘sọ́dọ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì fi orúkọ Jésù rọ́pò arọ́pò-orúkọ inú Gíríìkì.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: ní òde ibùdó
  rationale: ‘Ibùdó’ pa àwòrán ibi tí àwọn ènìyàn pàgọ́ sí àti ìtàn ẹbọ Léfítíkù mọ́; ‘ní òde’ sọ ipò ní ẹ̀yìn ààlà ibùdó ní kedere láì tú àwòrán náà sí ọ̀rọ̀ mìíràn.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: ẹ̀gàn rẹ̀
  rationale: ‘Ẹ̀gàn’ mú ìtumọ̀ ìkórìíra, ìtìjú, àti ọ̀rọ̀ àbùkù tó wà nínú ὀνειδισμός jáde; arọ́pò-orúkọ náà tún pa ìsopọ̀ rẹ̀ mọ́ ẹni tí ẹsẹ náà ń tọ́ka sí.
- source_word: φέροντες
  choice: ká sì ru
  rationale: ‘Ru’ bá àwòrán gbígbé ẹrù mu, ó sì lè sọ ìfaradà ẹ̀gàn tí ó ń bá a lọ. Ìsopọ̀ ‘ká sì’ jẹ́ Yorùbá àdánidá fún participle tó ń bá ìṣírí àkọ́kọ́ lọ.
theological_decisions:
- issue: Ẹni tí ‘rẹ̀’ ń tọ́ka sí
  choice: Pa arọ́pò-orúkọ ‘rẹ̀’ mọ́, pẹ̀lú Jésù gẹ́gẹ́ bí ẹni tí àyíká 13:12 ń tọ́ka sí.
  alternative: Fi ‘Jésù’ sí i ní tààrà dípò arọ́pò-orúkọ.
  rationale: Gíríìkì lo arọ́pò-orúkọ, àyíká sì mú ẹni tí ó ń tọ́ka sí ṣe kedere. Pípa arọ́pò-orúkọ mọ́ kò fi àlàyé sínú ẹsẹ ju ohun tí orísun sọ lọ.
- issue: Ìtumọ̀ ‘ní òde ibùdó’
  choice: Pa àwòrán ibùdó àti jíjáde sí òde rẹ̀ mọ́.
  alternative: Tú u sí ‘ní òde ètò ẹ̀sìn’ tàbí ‘ní òde àwùjọ.’
  rationale: Àwòrán náà ní ìsopọ̀ pẹ̀lú ẹbọ àti ìkọ̀sílẹ̀ ní 13:11–12. Ìtúmọ̀ àlàyé lè dín agbára ìtọ́kasí yìí kù, ó sì lè pinnu ohun tí ọ̀rọ̀ náà mọ̀ọ́mọ̀ fi sílẹ̀ ní fífẹ̀.
- issue: Ìbáṣepọ̀ ‘ẹ̀gàn rẹ̀’ pẹ̀lú Jésù
  choice: Lo gbólóhùn tí ó lè tọ́ka sí ẹ̀gàn tí Jésù ru àti ẹ̀gàn tí àwọn tirẹ̀ ń pín pẹ̀lú rẹ̀.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ẹ̀gàn tí a fi kan Jésù’ nìkan.
  rationale: Genitive αὐτοῦ lè ní agbára ìbáṣepọ̀ tó ju ìtumọ̀ kan lọ ní àyíká yìí. ‘Ẹ̀gàn rẹ̀’ pa ìwọ̀n àìdájú tó wúlò yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ jẹ́ kí a’ fún ìṣírí àpapọ̀, ‘ibùdó’ fún àwòrán ẹbọ àti pàgọ́, àti ‘ru ẹ̀gàn’ láti pa àkàwé gbígbé ẹrù mọ́.
