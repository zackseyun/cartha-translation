id: HEB.13.20
reference: Hebrews 13:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: yo
  text: Kí Ọlọ́run àlàáfíà, ẹni tí ó mú Olúwa wa Jésù, olùṣọ́ ńlá àwọn àgùntàn, dìde kúrò láàárín àwọn òkú nípasẹ̀ ẹ̀jẹ̀ májẹ̀mú ayérayé[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá yìí pé, “ẹni tí ó mú Olúwa wa Jésù dìde kúrò láàárín àwọn òkú—olùṣọ́ ńlá àwọn àgùntàn nípasẹ̀ ẹ̀jẹ̀ májẹ̀mú ayérayé.” Èdè Gíríìkì fàyè gba ọ̀nà tó ju ẹyọ kan lọ láti so gbólóhùn “nínú/nípasẹ̀ ẹ̀jẹ̀ májẹ̀mú ayérayé” mọ́ àwọn ọ̀rọ̀ tó ṣáájú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Kí
  rationale: δέ ń samí ìyípadà sí àdúrà ìbùkún; ní Yorùbá, ìbẹ̀rẹ̀ pẹ̀lú “Kí” bá ìṣètò gbólóhùn àdúrà mu, láìfi ọ̀rọ̀ àkókò kan kún un.
- source_word: θεὸς τῆς εἰρήνης
  choice: Ọlọ́run àlàáfíà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé Ọlọ́run ni orísun àlàáfíà àti ẹni tí àlàáfíà jẹ́ ìwà rẹ̀.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: ẹni tí ó mú ... dìde kúrò láàárín àwọn òkú
  rationale: Ó mú àwòrán ìjíǹde àti ìtumọ̀ “láti inú àwọn òkú” hàn ní Yorùbá adayébá.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: Olùṣọ́ Àgùntàn ńlá
  rationale: Ó pa àpèjúwe olùṣọ́ àti ọ̀wọ̀ àgùntàn mọ́; “ńlá” ń tú μέγαν ní kedere.
- source_word: ἐν αἵματι
  choice: nípasẹ̀ ẹ̀jẹ̀
  rationale: “Nípasẹ̀” fi ìtumọ̀ ohun èlò tàbí ọ̀nà hàn láìṣàlàyé ìbáṣepọ̀ náà kọjá ohun tí Gíríìkì sọ.
- source_word: διαθήκης αἰωνίου
  choice: májẹ̀mú ayérayé
  rationale: “Májẹ̀mú” bá àríyànjiyàn ìwé Hébérù mu, “ayérayé” sì fi ohun tí kò ní òpin hàn; Yorùbá kò nílò àpilẹ̀kọ bí “a/the.”
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Olúwa wa Jesu
  rationale: Ó pa oyè κύριος àti ìbáṣepọ̀ “wa” mọ́ ní ọ̀nà Yorùbá tó mọ́gbọ́n dání.
theological_decisions:
- issue: Ìbáṣepọ̀ “ἐν αἵματι διαθήκης αἰωνίου” pẹ̀lú àwọn ọ̀rọ̀ tó ṣáájú rẹ̀
  choice: 'A so ó mọ́ iṣẹ́ Ọlọ́run ti mímú Jesu dìde: “nípasẹ̀ ẹ̀jẹ̀ májẹ̀mú ayérayé.”'
  alternative: A lè so ó ní pàtàkì mọ́ “Olùṣọ́ Àgùntàn ńlá,” tàbí túmọ̀ rẹ̀ sí “nínú ẹ̀jẹ̀ májẹ̀mú ayérayé.”
  rationale: Ipò gbólóhùn Gíríìkì ní àìdánilójú díẹ̀. Àkọ́kọ́ yìí jẹ́ kíkà tó ṣeé ṣe jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ọ̀nà mìíràn mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, adayébá, ó sì yẹ fún àdúrà ìbùkún. Gbólóhùn náà mọ̀ọ́mọ̀ parí pẹ̀lú àmì kọ́má nítorí Hébérù 13:20 ń bá a lọ sí ẹsẹ 21.
