id: HEB.13.4
reference: Hebrews 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: yo
  text: Kí ìgbéyàwó jẹ́ ohun ọlá ní ọ̀dọ̀ gbogbo ènìyàn[a][b], kí ibùsùn ìgbéyàwó sì má ní àbàwọ́n, nítorí Ọlọ́run yóò ṣe ìdájọ́ àwọn alágbèrè àti àwọn panṣágà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìgbéyàwó jẹ́ ohun ọlá ní ọ̀dọ̀ gbogbo ènìyàn.” Kò sí ọ̀rọ̀-ìṣe tí a sọ ní gbangba nínú Gíríìkì, nítorí náà a lè ka gbólóhùn náà gẹ́gẹ́ bí ìṣílétí tàbí gẹ́gẹ́ bí àsọyé.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Kí gbogbo ènìyàn fún ìgbéyàwó ní ọlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: ohun tí a bọlá fún
  rationale: Èyí mú ìtumọ̀ ohun tí ó níyì, tí a sì ń bọlá fún jáde, ó sì bá ọ̀rọ̀ ìṣílétí mu láì sọ ọ́ di ọ̀rọ̀ àsọyé lásán.
- source_word: γάμος
  choice: ìgbéyàwó
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ipò àti ìdè ìgbéyàwó, kì í ṣe ayẹyẹ ìgbéyàwó.
- source_word: ἐν πᾶσιν
  choice: láàárín gbogbo ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé kí ìgbéyàwó ní ọlá láàárín gbogbo ènìyàn; ó tún ṣeé ṣe láti lóye rẹ̀ pé kí gbogbo ènìyàn bọlá fún un. Àṣàyàn àkọ́kọ́ wà nínú ẹsẹ̀, èkejì sì wà ní àlàyé ìsàlẹ̀.
- source_word: κοίτη
  choice: ibùsùn ìgbéyàwó
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tààrà ni ‘ibùsùn,’ ní àyíká yìí ó dúró fún ìbálòpọ̀ láàárín tọkọtaya; gbólóhùn yìí mú ìtumọ̀ náà ṣe kedere ní ọ̀nà tó yẹ.
- source_word: ἀμίαντος
  choice: aláìléèérí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí kò ní àbàwọ́n tàbí èérí; àṣàyàn yìí pa ìtumọ̀ ìwà mímọ́ rẹ̀ mọ́.
- source_word: πόρνους
  choice: àwọn tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀
  rationale: Èyí jẹ́ ọ̀nà kedere, òde òní láti sọ ẹ̀ka ìwà ìbálòpọ̀ tí kò tọ́, láì dín ìtumọ̀ ọ̀rọ̀ Gíríìkì náà kù.
- source_word: μοιχούς
  choice: àwọn panṣágà
  rationale: Ọ̀rọ̀ náà ń tọ́ka ní pàtó sí àwọn tí ń ṣe panṣágà, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí ẹ̀ka ìṣekúṣe tó gbòòrò.
- source_word: κρινεῖ
  choice: yóò ṣe ìdájọ́
  rationale: Ọ̀rọ̀ iṣe ọjọ́ iwájú ni; ‘yóò ṣe ìdájọ́’ kò fi àbájáde ìdájọ́ kún ohun tí Gíríìkì sọ.
- source_word: γάρ
  choice: nítorí
  rationale: Ó fi ìdí ìṣílétí náà hàn, ó sì so ìkìlọ̀ nípa ìdájọ́ Ọlọ́run mọ́ ohun tó ṣáájú.
theological_decisions:
- issue: Bóyá gbólóhùn àkọ́kọ́ jẹ́ àsọyé tàbí ìṣílétí
  choice: 'Ìṣílétí: “Kí ìgbéyàwó jẹ́ ohun tí a bọlá fún …”'
  alternative: 'Àsọyé: “Ìgbéyàwó jẹ́ ohun ọlá …”'
  rationale: Kò sí ọ̀rọ̀-ìṣe tí a sọ ní gbangba nínú Gíríìkì, nítorí náà ìtumọ̀ méjèèjì ṣeé ṣe. Àwọn ìṣílétí ìwà tó yára tẹ̀ lé ara wọn ní Hébérù 13 mú kí kíkà á gẹ́gẹ́ bí ìṣílétí bá àyíká mu jù; síbẹ̀, a pa ìtumọ̀ àsọyé mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ibùsùn ìgbéyàwó” jẹ́ àpèjúwe ọ̀wọ̀ fún ìbálòpọ̀ tọkọtaya, “ìṣekúṣe nípa ìbálòpọ̀” sì mú ìtumọ̀ πόρνους ṣe kedere fún òǹkàwé lónìí.
