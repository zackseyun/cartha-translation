source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: yo
  text: Nítorí ara àwọn ẹranko tí olórí àlùfáà mú ẹ̀jẹ̀ wọn wọ àwọn ibi mímọ́[a] nítorí ẹ̀ṣẹ̀ ni a ń sun[b] ní òde ibùdó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ inú ibi mímọ́.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn ibi mímọ́,” ọ̀rọ̀ ìjọsìn fún agbègbè ibi mímọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “a ń sun wọ́n run pátápátá.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè tẹnu mọ́ pé sísun náà péye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: àwọn ẹranko ... ara wọn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹranko ìrúbọ; lílo “ara wọn” ní apá kejì jẹ́ Yorùbá àdánidá, ó sì tún jẹ́ kí ìtọ́kasí náà ṣe kedere.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí a sọ ṣáájú.
- source_word: εἰσφέρεται τὸ αἷμα
  choice: ẹ̀jẹ̀ ... tí ... mú wọ
  rationale: Ó pa ìtumọ̀ ìṣe mímú ẹ̀jẹ̀ wọ inú ibi mímọ́ mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: περὶ ἁμαρτίας
  choice: fún ẹ̀ṣẹ̀
  rationale: Ó pa ìtumọ̀ ìrúbọ tó ní í ṣe pẹ̀lú ẹ̀ṣẹ̀ mọ́ láì sọ ọ́ di “ẹbọ ẹ̀ṣẹ̀” ní pàtó ju Gíríìkì lọ.
- source_word: εἰς τὰ ἅγια
  choice: wọ ibi mímọ́
  rationale: “Ibi mímọ́” jẹ́ ọ̀rọ̀ ìjọsìn tó bójú mu, tó sì lè tọ́ka sí agbègbè ibi mímọ́ láì dín un kù sí Ibi Mímọ́ Jù Lọ.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: tí olórí àlùfáà mú
  rationale: Ó sọ ipa olórí àlùfáà gẹ́gẹ́ bí ẹni tó mú ẹ̀jẹ̀ wọ ibẹ̀ ní Yorùbá àdánidá.
- source_word: κατακαίεται
  choice: a ń sun
  rationale: Ó fi ìṣe sísun ara ẹranko hàn; àlàyé ìsàlẹ̀ ojú ìwé pa agbára ọ̀rọ̀ náà gẹ́gẹ́ bí sísun pátápátá mọ́.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: ní ẹ̀yìn ibùdó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “outside the camp” nínú àyíká ibùdó Ísírẹ́lì.
theological_decisions:
- issue: Ìtọ́kasí ibi ìjọsìn nínú εἰς τὰ ἅγια
  choice: ibi mímọ́
  alternative: Ibi Mímọ́ Jù Lọ
  rationale: Fáwẹ́lì ọ̀pọ̀ τὰ ἅγια lè tọ́ka sí àgbègbè ibi mímọ́ lápapọ̀ nínú Hébérù; a kò fi ìtumọ̀ tó dín kù sí Ibi Mímọ́ Jù Lọ lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. “Olórí àlùfáà,” “ibi mímọ́,” àti “ibùdó” pa àyíká ìrúbọ àti ìjọsìn mọ́ fún òǹkàwé gbogbogbò.
