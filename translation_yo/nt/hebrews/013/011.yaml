  to: Nítorí ara àwọn ẹranko tí olórí àlùfáà mú ẹ̀jẹ̀ wọn wọ àwọn ibi mímọ́[a] nítorí ẹ̀ṣẹ̀ ni a ń sun[b] ní òde ibùdó.
