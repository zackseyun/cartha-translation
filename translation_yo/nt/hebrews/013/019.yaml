  terminology: “Rọ̀,” “dá mi padà,” àti “sọ́dọ̀ yín” yẹ fún ìforígbárí ìbẹ̀bẹ̀ àti ìpadà/reunion, láìsọ ìdí ìyapa náà di pàtó. Wọ́n pa àìdájú ἀποκατασταθῶ mọ́.
