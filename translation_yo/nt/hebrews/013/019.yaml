source:
  edition: SBLGNT
  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: yo
  text: Mo sì túbọ̀ ń rọ̀ yín láti ṣe èyí,[a] kí a lè dá mi padà sọ́dọ̀ yín ní kíákíá sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ṣe bẹ́ẹ̀.” Èdè Gíríìkì ń tọ́ka padà sí ìbéèrè fún àdúrà nínú ẹsẹ tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: gidigidi
  rationale: Ọ̀rọ̀ adverb yìí ń mú ìrọ̀ náà le sí i. “Gidigidi” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ ẹ̀bẹ̀ hàn nínú àyíká yìí.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ ń so gbólóhùn náà mọ́ ohun tí ó ṣáájú láìfi ìtakora líle hàn; “sì” bá ìṣe yìí mu ní Yorùbá.
- source_word: παρακαλῶ
  choice: Mo ń rọ̀ yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹ̀bẹ̀ tàbí ìrọ̀ tí ó jinlẹ̀. “Ń rọ̀ yín” jẹ́ èdè Yorùbá òde òní tí ó dára, tí ó sì pa agbára ẹ̀bẹ̀ náà mọ́.
- source_word: τοῦτο ποιῆσαι
  choice: láti ṣe èyí
  rationale: Ó tọ́ka padà sí ìbéèrè fún àdúrà nínú ẹsẹ tó ṣáájú. “Ṣe èyí” pa ìtọ́kasí náà mọ́ láìṣe àlàyé àfikún sínú ẹsẹ náà.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣọ̀kan yìí fi ète hàn ní Yorùbá lọ́nà àdánidá, ó sì bá ìtumọ̀ ἵνα mu.
- source_word: τάχιον
  choice: láìpẹ́ jù
  rationale: Táχιον jẹ́ ọ̀rọ̀ afiwéra, ‘kíákíá sí i’ tàbí ‘láìpẹ́ sí i.’ Nínú Yorùbá, “láìpẹ́ jù” fi ìfẹ́ kí ìpadà náà tètè ṣẹlẹ̀ hàn lọ́nà tí ó ṣeé lóye.
- source_word: ἀποκατασταθῶ
  choice: a lè dá mi padà
  rationale: Fíìbù náà wà ní àkópọ̀ aláìṣe, ó sì lè túmọ̀ sí dídá ẹni padà tàbí pípadà rẹ̀ sọ́dọ̀ àwọn mìíràn. Àṣàyàn yìí pa àkópọ̀ aláìṣe àti àìdájú nípa ipò pàtó mọ́.
- source_word: ὑμῖν
  choice: sọ́dọ̀ yín
  rationale: Nínú àyíká ìpadà tàbí ìdápadà, “sọ́dọ̀ yín” fi ìdarí sí àwọn olùkà hàn lọ́nà àdánidá; “yín” tún fi ọ̀pọ̀ ènìyàn hàn.
theological_decisions:
- issue: Ohun tí ìdápadà olùkọ̀wé sọ́dọ̀ àwọn olùkà túmọ̀ sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí dídá olùkọ̀wé padà sọ́dọ̀ wọn, láìsọ ipò pàtó tó fà á.
  alternative: Ìtúsílẹ̀ kúrò ní ẹ̀wọ̀n, ìpadà láti ìrìn-àjò, ìmúláradá kúrò nínú àìsàn, tàbí ìpadà sí iṣẹ́ ìránṣẹ́ láàárín wọn.
  rationale: ἀποκατασταθῶ ὑμῖν sọ pé kí a dá olùkọ̀wé padà sọ́dọ̀ àwọn olùkà, ṣùgbọ́n kò sọ bóyá ẹ̀wọ̀n, àìsàn, ìrìn-àjò, tàbí ohun mìíràn ló ya wọn sọ́tọ̀. Ìtumọ̀ náà kò gbọ́dọ̀ pinnu ohun tí orísun kò pinnu.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. A lo àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ àdánidá fún olùkà Yorùbá, ṣùgbọ́n ó pa ìtẹnumọ́ ẹ̀bẹ̀, ète, àkópọ̀ aláìṣe, àti àìdájú nípa ohun tó fà ìyapa náà mọ́.
