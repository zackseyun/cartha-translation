  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè olùkọ̀wé, ìtọ́kasí “èyí” sí àdúrà tó ṣáájú, ète, àti ìdápadà rẹ̀ sọ́dọ̀ àwọn olùkà mọ́ dáadáa. Síbẹ̀, “gidigidi” fi ìtẹnumọ́ hàn ṣùgbọ́n kò fi agbára afiwéra περισσοτέρως (‘sí i/túbọ̀’) hàn kedere. Bákan náà, “láìpẹ́ jù” kò dá afiwéra τάχιον (‘ní kíákíá sí i/ní kùtùkùtù sí i’) lójú tó.
