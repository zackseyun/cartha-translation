  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: yo
  text: Ẹ kí gbogbo àwọn olórí yín àti gbogbo àwọn ẹni mímọ́. Àwọn tí wọ́n wá láti Ítálì kí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn tí wọ́n wà ní Ítálì kí yín.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí àwọn tí wọ́n ti Ítálì wá tàbí àwọn tí wọ́n wà níbẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí fífi ìkíni ránṣẹ́ tàbí kíkí ẹnì kan. “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa agbára àṣẹ náà mọ́.
- source_word: πάντας
  choice: gbogbo
  rationale: “Gbogbo” fi hàn pé gbogbo ẹni tó wà nínú ẹgbẹ́ méjèèjì ni ọ̀rọ̀ náà kàn.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: àwọn olórí yín
  rationale: Ó tọ́ka sí àwọn tí ń darí ìjọ. “Àwọn olórí yín” ṣe kedere ní Yorùbá, kò sì mú èrò ìṣèlú tàbí ìṣàkóso líle wọ inú ọ̀rọ̀ náà.
- source_word: τοὺς ἁγίους
  choice: àwọn ẹni mímọ́
  rationale: Èyí pa ìtumọ̀ àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sọ́tọ̀ sí mímọ́ mọ́, láì fi ìtumọ̀ míì rọ́pò rẹ̀.
- source_word: ἀσπάζονται
  choice: kí yín
  rationale: Nínú lẹ́tà, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ń fi ìkíni wọn ránṣẹ́. “Kí yín” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá àyíká lẹ́tà mu.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Àwọn tí ó wá láti Ítálí
  rationale: ἀπό pẹ̀lú ọ̀rọ̀ oníṣe genitive sábà ń tọ́ka sí ibi tí ènìyàn ti wá; nítorí náà, “àwọn tí ó wá láti Ítálí” ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù. Àmọ́, gbólóhùn náà tún lè tọ́ka sí àwọn tó wà ní Ítálí, a sì pa ìṣiyèméjì yẹn mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ẹni tí οἱ ἀπὸ τῆς Ἰταλίας ń tọ́ka sí
  choice: Àwọn tí ó wá láti Ítálí
  alternative: Àwọn tí ó wà ní Ítálí
  rationale: Ìtumọ̀ ibi ìpilẹ̀ṣẹ̀ ni ἀπό sábà máa ń ní, ṣùgbọ́n a lè lóye gbólóhùn náà gẹ́gẹ́ bí ẹni tó ń sọ ibi tí àwọn olùkíni wà. A yan ìtumọ̀ àkọ́kọ́ fún ẹsẹ̀, a sì fi èkejì sínú àlàyé láti má ṣe yanjú ohun tí Gíríìkì fi sílẹ̀ ní àìdánilójú.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó yé gbogbo ènìyàn ni a lò. “Ẹ kí” lo ọ̀pọ̀ ènìyàn àti ọ̀wọ̀ tó bá àṣẹ sí gbogbo àwùjọ mu. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó bá yẹ.
