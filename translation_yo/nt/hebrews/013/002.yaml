id: HEB.13.2
reference: Hebrews 13:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: yo
  text: Ẹ má ṣe gbàgbé gbígba àlejò sílé[a], nítorí nípa gbígba àlejò sílé ni àwọn kan ti gba àwọn áńgẹ́lì sílé láìmọ̀ pé áńgẹ́lì ni wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ońṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn áńgẹ́lì” tàbí “àwọn ońṣẹ́,” ṣùgbọ́n “àwọn áńgẹ́lì” ló bá ìtọ́kasí tí ó ṣeé ṣe nínú ẹsẹ̀ yìí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: máa gba àlejò sílé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífẹ́ tàbí kíka àwọn àjèjì sí, pàápàá nípa gbígbà wọ́n sílé. Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ hospitality, ó sì pa èrò nípa àlejò tàbí àjèjì mọ́.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Ẹ má ṣe kọ̀ láti máa
  rationale: Nínú ìkìlọ̀ yìí, ọ̀rọ̀-ìṣe náà kì í ṣe gbígbàgbé lérò nìkan, ṣùgbọ́n ó tún kan pípa àṣà náà tì tàbí àìṣe é. ‘Ẹ má ṣe kọ̀ láti máa’ sọ agbára ìṣírí náà ní Yorùbá àdánidá.
- source_word: διὰ ταύτης
  choice: nípa ṣíṣe bẹ́ẹ̀
  rationale: Ọ̀rọ̀ arọ́pò abo náà tọ́ka padà sí gbígba àlejò sílé; gbólóhùn yìí pa ìtumọ̀ ohun èlò tàbí ọ̀nà tí διά ní mọ́.
- source_word: ἔλαθόν
  choice: láìmọ̀
  rationale: Àkójọpọ̀ λανθάνω pẹ̀lú participle sọ pé ohun náà ṣẹlẹ̀ láìsí ìmọ̀ ẹni tó ṣe é. ‘Láìmọ̀’ sọ èyí ní ṣókí àti ní kedere.
- source_word: τινες
  choice: àwọn kan
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún arọ́pò aláìlórúkọ ọ̀pọ̀ ní Yorùbá.
- source_word: ξενίσαντες
  choice: ti gba ... sílé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígba tàbí pípa àlejò mọ́ sílé. Àṣàyàn yìí bá φιλοξενία mu, ó sì yẹra fún ìtumọ̀ míràn tí ‘ṣe eré fún’ lè mú wá.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄγγελος tún lè túmọ̀ sí ‘àwọn ońṣẹ́,’ ó ṣeé ṣe jù pé ẹsẹ̀ náà ń tọ́ka sí àwọn ìtàn Májẹ̀mú Láéláé nípa gbígba àwọn àlejò ọ̀run sílé. A pa àṣàyàn míràn mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí ἀγγέλους ń tọ́ka sí àti ìtumọ̀ rẹ̀
  choice: àwọn áńgẹ́lì ní ìtumọ̀ àwọn ẹ̀dá ọ̀run
  alternative: àwọn ońṣẹ́ ènìyàn
  rationale: Àyíká ọ̀rọ̀ àti ìtọ́kasí tí ó ṣeé ṣe sí àwọn ìtàn bí ti Ábúráhámù àti Lọ́ọ̀tì tí wọ́n gba àwọn àlejò ọ̀run sílé ṣe àtìlẹ́yìn fún ‘àwọn áńgẹ́lì.’ Síbẹ̀, nítorí ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì, àṣàyàn ‘àwọn ońṣẹ́’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀ ọ̀pọ̀ ‘Ẹ’. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. Àtúnṣe ‘gba àlejò sílé’ jẹ́ àdánidá ju lílo ọ̀rọ̀ àfojúsùn líle lọ, ó sì mú èrò fífẹ́ àjèjì hàn.
