reference: Hebrews 13:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ìfẹ́ owó wà nínú ìgbésí ayé yín; ẹ máa ní ìtẹ́lọ́rùn pẹ̀lú ohun tí ẹ ní.[a] Nítorí òun fúnra rẹ̀ ti sọ pé, “Èmi kì yóò fi ọ́ sílẹ̀ láéláé,[b] bẹ́ẹ̀ ni èmi kì yóò kọ̀ ọ́ sílẹ̀ láéláé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹ máa ní ìtẹ́lọ́rùn pẹ̀lú àwọn ohun tó wà lọ́wọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ìlérí yìí ń dún bí àwọn ìdánilójú májẹ̀mú inú Májẹ̀mú Láéláé, pàápàá Diutarónómì 31:6, 8 àti Jóṣúà 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος ὁ τρόπος
  choice: Ẹ má ṣe jẹ́ kí ìfẹ́ owó wà nínú ìgbésí ayé yín
  rationale: Ọ̀rọ̀ yìí jẹ́ ìpè pé kí ìwà àti ọ̀nà ìgbésí ayé wọn má ṣe ní ìfẹ́ owó gẹ́gẹ́ bí ohun tó ń darí wọn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́kasí pàtó sí ìfẹ́ owó mọ́ dípò fífẹ̀ ọ́ sí gbogbo irú ojúkòkòrò.
- source_word: ἀρκούμενοι τοῖς παροῦσιν
  choice: ẹ máa ní ìtẹ́lọ́rùn pẹ̀lú ohun tí ẹ ní
  rationale: Àpólà aláìlẹ́gbẹ́ yìí ní agbára ìṣílétí, ó sì tọ́ka sí ìtẹ́lọ́rùn pẹ̀lú ohun tó wà lọ́wọ́ ẹni. ‘Ohun tí ẹ ní’ túmọ̀ rẹ̀ lọ́nà Yorùbá tó ṣe kedere láìfi àfikún èrò sí i.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: Nítorí òun fúnra rẹ̀ ti sọ pé
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́, ‘ti sọ’ sì fi agbára ọ̀rọ̀ pípé εἴρηκεν hàn gẹ́gẹ́ bí ọ̀rọ̀ tí ó ṣì dúró. A kò fi ‘Ọlọ́run’ kún ọ̀rọ̀ pàtàkì nítorí orúkọ náà kò sí nínú Gíríìkì.
- source_word: Οὐ μή σε ἀνῶ
  choice: Èmi kì yóò fi ọ́ sílẹ̀ láéláé
  rationale: ‘Kì yóò … láéláé’ mú ìtẹnumọ́ ìkọ̀ οὐ μή jáde lọ́nà Yorùbá tó lágbára, nígbà tí ‘fi ọ́ sílẹ̀’ bá ìlò ọ̀rọ̀ náà mu nínú àyọkà ìlérí yìí.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: bẹ́ẹ̀ ni èmi kì yóò kọ̀ ọ́ sílẹ̀ láéláé
  rationale: ‘Kọ̀ ọ́ sílẹ̀’ sọ ìtumọ̀ fífi ẹni tì tàbí pípa ẹni tì mọ́; àtúnlò ‘kì yóò … láéláé’ tún pa agbára ìkọ̀ Gíríìkì kejì mọ́.
theological_decisions:
- issue: Ìdánimọ̀ ẹni tó ń sọ̀rọ̀ nínú àyọkà náà
  choice: Pa arọ́pò-orúkọ Gíríìkì mọ́ gẹ́gẹ́ bí ‘òun fúnra rẹ̀.’
  alternative: ‘Nítorí Ọlọ́run fúnra rẹ̀ ti sọ pé’
  rationale: Àyíká fi hàn pé Ọlọ́run ni olùsọ̀rọ̀, ṣùgbọ́n Gíríìkì lo αὐτός, kì í ṣe θεός. Nítorí náà a pa ìtẹnumọ́ arọ́pò-orúkọ mọ́ láìfi orúkọ tí kò sí nínú orísun kún un.
- issue: Bí a ṣe túmọ̀ àwọn ìkọ̀ alágbára nínú ìlérí náà
  choice: Lo ‘kì yóò … láéláé’ lẹ́ẹ̀mejì.
  alternative: ‘Èmi kò ní fi ọ́ sílẹ̀ tàbí kọ̀ ọ́ sílẹ̀ rárá’
  rationale: Àwọn οὐ μή méjèèjì fún ìlérí náà ní ìtẹnumọ́ tó lágbára. Àtúnlò Yorùbá náà pa ìdánilójú ọkọọkan mọ́ láìdi ọ̀rọ̀ náà rú.
translation_notes:
  register: Yorùbá àdánidá, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A lò ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí a ń gbà níyànjú, ṣùgbọ́n ‘ọ́’ wà ní ẹyọ nínú àyọkà, gẹ́gẹ́ bí σε ti rí nínú Gíríìkì. Àwọn ọ̀rọ̀ méjì ‘fi ọ́ sílẹ̀’ àti ‘kọ̀ ọ́ sílẹ̀’ pa ìyàtọ̀ kékeré láàárín àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́.
