id: HEB.13.22
reference: Hebrews 13:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: yo
  text: Mo sì rọ̀ yín, ẹ̀yin ará[a], ẹ fi sùúrù gba ọ̀rọ̀ ìyanilétí yìí[b], nítorí pé mo kọ sí yín ní ṣókí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ tààrà, “ẹ̀yin arákùnrin”; ọ̀rọ̀ Gíríìkì náà lè jẹ́ ìkíni tí ó kó gbogbo ìjọ—ọkùnrin àti obìnrin—sínú.
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀rọ̀ ìyanilétí” tún lè jẹ́ “ọ̀rọ̀ ìṣírí” tàbí “ìhìn ìgbani-níyànjú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Mo … rọ̀ yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi taratara bẹ̀bẹ̀, rọ̀, tàbí gba ẹnì kan níyànjú. “Mo rọ̀ yín” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìbéèrè onkọ̀wé mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àmì ìyípadà pẹ̀lẹ́pẹ̀lẹ́ nínú ọ̀rọ̀, kì í ṣe àtakò líle; “sì” bá ipa ìsopọ̀ yìí mu ní Yorùbá.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ akọ tí ó túmọ̀ ní tààrà sí àwọn arákùnrin, ṣùgbọ́n ó lè jẹ́ ìkíni fún gbogbo ìjọ. “Ẹ̀yin ará” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìkíni àwọn onígbàgbọ́, kò sì fi abo tí Gíríìkì samisi hàn ní pàtó; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ tààrà mọ́.
- source_word: ἀνέχεσθε
  choice: ẹ fi sùúrù gba
  rationale: Ó ní ìtumọ̀ fífaradà tàbí gbígba ohun kan pẹ̀lú sùúrù. Nínú ọ̀rọ̀ yìí, “ẹ fi sùúrù gba” dára ju ọ̀rọ̀ tí yóò dà bí fífarada ìyà lọ, ó sì tọ́ka sí bí wọn ṣe yẹ kí wọ́n gba ìhìn náà.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: ọ̀rọ̀ ìṣírí yìí
  rationale: λόγος níbí jẹ́ ọ̀rọ̀ tàbí ìhìn tí a sọ, παράκλησις sì lè túmọ̀ sí ìṣírí àti ọ̀rọ̀ ìyanilétí. “Ọ̀rọ̀ ìṣírí” pa àfojúsùn méjèèjì mọ́ ní Yorùbá; “yìí” jẹ́ àfikún àdánidá tí ó tọ́ka sí ìwé/ìwàásù tí ó wà lọ́wọ́ wọn.
- source_word: καὶ γὰρ
  choice: nítorí pé
  rationale: Àpapọ̀ ọ̀rọ̀ náà fi ìdí fún ìbéèrè tí ó ṣáájú. “Nítorí pé” sọ ipa àlàyé náà ní Yorùbá àdánidá láìtú gbogbo patikulu lọ́tọ̀ọ̀tọ̀.
- source_word: διὰ βραχέων
  choice: lẹ́tà kúkúrú
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí “ní ṣókí” tàbí “ní ọ̀rọ̀ díẹ̀.” Pẹ̀lú ἐπέστειλα, “lẹ́tà kúkúrú ni mo kọ” jẹ́ Yorùbá tó mọ́, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò lo ọ̀rọ̀ orúkọ “lẹ́tà” ní tààrà.
- source_word: ἐπέστειλα ὑμῖν
  choice: ni mo kọ sí yín
  rationale: Ọ̀rọ̀-ìṣe aorist náà lè túmọ̀ sí “mo kọ” tàbí “mo fi ìhìn ránṣẹ́.” “Mo kọ sí yín” bá àyíká lẹ́tà mu, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìkíni tí akọ samisi nínú ἀδελφοί
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Yorùbá máa ń lo “ará” fún ọmọ ìdílé tàbí ọmọ ìjọ láìsamisi akọ tàbí abo. Ìtumọ̀ yìí jẹ́ àdánidá, ṣùgbọ́n àlàyé [a] jẹ́ kí òǹkàwé mọ̀ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ọ̀pọ̀, ó sì ṣeé ṣe kí ó kó gbogbo ìjọ sínú.
- issue: Ìtumọ̀ παράκλησις
  choice: ìṣírí
  alternative: ìyanilétí; ọ̀rọ̀ ìgbani-níyànjú
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní agbára ìṣírí àti ìyanilétí. A yan “ìṣírí” nínú ẹsẹ̀, a sì pa àṣàyàn ìyanilétí mọ́ nínú àlàyé láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàṣẹ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ fi sùúrù gba” yàgò fún ọ̀rọ̀ líle tàbí àtijọ́, “ẹ̀yin ará” sì jẹ́ ìkíni ìjọ tí àwọn òǹkàwé òde òní lè lóye.
