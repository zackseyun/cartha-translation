source:
  edition: SBLGNT
  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: yo
  text: Ẹ mọ̀ pé a ti dá Tímótì arákùnrin wa sílẹ̀[a]. Bí ó bá tètè dé, èmi yóò bá a wá rí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti tú u sílẹ̀,” bóyá kúrò nínú ẹ̀wọ̀n. Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé “a ti rán an lọ” tàbí “a ti jẹ́ kí ó lọ,” ṣùgbọ́n “a ti dá a sílẹ̀” ló ṣeé ṣe kó bá ọ̀rọ̀ yìí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Ẹ mọ̀ pé
  rationale: Ó pa agbára àṣẹ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìròyìn fún ọ̀pọ̀ ènìyàn.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: Tímótì arákùnrin wa
  rationale: Èdè ìbátan àwọn onígbàgbọ́ ni ‘arákùnrin wa’; fífi orúkọ ṣáájú rẹ̀ jẹ́ àdánidá ní Yorùbá.
- source_word: Τιμόθεον
  choice: Tímótì
  rationale: A kọ orúkọ náà ní ìrísí tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: ἀπολελυμένον
  choice: a ti dá ... sílẹ̀
  rationale: Ó fi ìṣe tí a ti parí, tí ipa rẹ̀ sì ṣì wà, hàn. Ó ṣeé ṣe jù lọ pé ìtúnsí kúrò ní àhámọ́ ni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
- source_word: μεθ’ οὗ
  choice: èmi yóò bá a wá
  rationale: Ó sọ ní kedere pé ẹni tí ń kọ̀wé yóò wá pẹ̀lú Tímótì, ní èdè Yorùbá tí ó rọrùn.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Bí ó bá tètè dé
  rationale: Ó pa ìṣòro pé dídé Tímótì kò tíì dájú mọ́; ‘tètè’ mú ìtumọ̀ τάχιον jáde lọ́nà àdánidá.
- source_word: ὄψομαι ὑμᾶς
  choice: yóò ... rí yín
  rationale: Ó tẹ̀lé ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì ‘rí’ dípò fífi ìtumọ̀ ‘bẹ̀ yín wò’ kun un.
