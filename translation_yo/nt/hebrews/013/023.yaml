translation_notes:
  register: Yorùbá àkànṣe tí ó ní àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A yà gbólóhùn náà sí méjì fún ìṣàn ọ̀rọ̀ àdánidá láìyí ìbáṣepọ̀ àwọn gbólóhùn Gíríìkì padà.
