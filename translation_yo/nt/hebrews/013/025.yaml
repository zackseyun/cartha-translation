lexical_decisions:
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àdúrà ìbùkún tí ó wọ́pọ̀ ní òpin lẹ́tà; “oore-ọ̀fẹ́” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ láti sọ χάρις ní Yorùbá.
- source_word: μετὰ
  choice: kí ... wà pẹ̀lú
  rationale: μετά pẹ̀lú ọ̀rọ̀ inú genitive túmọ̀ sí “pẹ̀lú.” Nítorí gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe ní gbangba, “Kí ... wà pẹ̀lú” fi ìtumọ̀ àdúrà ìbùkún rẹ̀ hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: πάντων ὑμῶν
  choice: gbogbo yín
  rationale: “Gbogbo yín” pa ìtumọ̀ pé gbogbo àwọn olùgbọ́ ni a kà sí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédé.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà kúkúrú, níyì, ó sì bá àdúrà ìbùkún òpin lẹ́tà mu.
