id: HEB.13.21
reference: Hebrews 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: yo
  text: Kí ó pèsè yín pẹ̀lú gbogbo ohun rere láti ṣe ìfẹ́ rẹ̀, bí ó ti ń ṣe nínú wa ohun tí ó tẹ́ ẹ lọ́rùn níwájú rẹ̀ nípasẹ̀ Jésù Mèsáyà, ẹni tí ògo jẹ́ tirẹ̀[a] láé àti láéláé. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà, “ẹni tí,” lè tọ́ka ní pàtó sí Jésù Mèsáyà; àwọn mìíràn sì gbà pé ó tọ́ka sí Ọlọ́run aláàlàáfíà, ẹni tí a ń bẹ̀bẹ̀ sí nínú àdúrà yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: múra yín sílẹ̀
  rationale: Ọ̀rọ̀ yìí ń sọ pé kí Ọlọ́run mú àwọn onígbàgbọ́ yẹ, kí ó sì pèsè wọn fún ṣíṣe ìfẹ́ rẹ̀. “Múra yín sílẹ̀” jẹ́ Yorùbá àdánidá tí ó mú èrò yìí jáde láì fi ìtumọ̀ ‘mú padà bọ̀ sípò’ tàbí ‘sọ di pípé’ kún un.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: nínú ohun rere gbogbo
  rationale: Èyí tẹ̀lé ìtumọ̀ gígùn ἐν, ó sì fi hàn pé ìmúrasílẹ̀ náà kan gbogbo ohun rere tí ó yẹ fún ìgbọ́ràn.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: láti ṣe ìfẹ́ rẹ̀
  rationale: “Láti ṣe” fi ète articular infinitive hàn ní ṣókí, “ìfẹ́ rẹ̀” sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún θέλημα αὐτοῦ.
- source_word: ποιῶν ἐν ἡμῖν
  choice: bí ó ti ń mú … ṣẹ nínú wa
  rationale: Gbólóhùn yìí pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ń ṣiṣẹ́, ó sì fi iṣẹ́ rẹ̀ tí ń lọ lọ́wọ́ nínú àwọn onígbàgbọ́ hàn.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: ohun tí ó tẹ́ ẹ lọ́rùn
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ohun tí ó dùn mọ́ Ọlọ́run tàbí tí ó jẹ́ ìtẹ́wọ́gbà níwájú rẹ̀; kò sọ ìtumọ̀ náà di èrò òfin lásán.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: διὰ fi ọ̀nà tàbí aṣojú iṣẹ́ Ọlọ́run hàn. Χριστός dúró gẹ́gẹ́ bí oyè níbí, nítorí náà “Mèsáyà” ni a lò dípò fífi í ṣe orúkọ lásán.
- source_word: ᾧ ἡ δόξα
  choice: ẹni tí ògo jẹ́ tirẹ̀
  rationale: Ìtumọ̀ yìí pa relative clause Gíríìkì mọ́, kò sì fi orúkọ ẹni tí ᾧ ń tọ́ka sí sínú ẹsẹ̀ náà.
- source_word: εἰς τοὺς αἰῶνας
  choice: láé àti láéláé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó níyì, tó sì wọ́pọ̀ nínú ọ̀rọ̀ ìyìn fún àkókò tí kò ní òpin.
theological_decisions:
- issue: Ẹni tí ᾧ (‘ẹni tí’) ń tọ́ka sí nínú ọ̀rọ̀ ìyìn
  choice: A pa ọ̀rọ̀ ìbátan náà mọ́ gẹ́gẹ́ bí “ẹni tí ògo jẹ́ tirẹ̀,” láì fi orúkọ ẹni náà kún un.
  alternative: Ó lè tọ́ka ní pàtó sí Jésù Mèsáyà, tàbí sí Ọlọ́run aláàlàáfíà, ẹni tí ó jẹ́ olùṣe àdúrà náà.
  rationale: Jésù Mèsáyà ni antecedent tó sún mọ́ ᾧ jù, ṣùgbọ́n Ọlọ́run ni olórí ọ̀rọ̀ àdúrà náà. Nítorí Gíríìkì kò yanjú ìbéèrè náà láìsí àríyànjiyàn, a pa àìdánilójú náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó níyì, tó sì ṣe kedere fún òǹkàwé gbogbo. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “Mèsáyà” gẹ́gẹ́ bí oyè. Gbólóhùn náà pa ìrísí àdúrà ìbùkún àti àìdánilójú ọ̀rọ̀ ìyìn ìparí mọ́.
