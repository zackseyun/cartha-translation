  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: yo
  text: Àwa ní pẹpẹ kan, láti inú èyí tí àwọn tí ń ṣe iṣẹ́ ìsìn nínú àgọ́ ìjọsìn kò ní ẹ̀tọ́ láti jẹ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i, “àwọn tí ń ṣe iṣẹ́ ìsìn nínú àgọ́ náà.” Gbólóhùn yìí ń tọ́ka sí àwọn tí ń ṣe iṣẹ́ ibi mímọ́ lábẹ́ májẹ̀mú àtijọ́.
    reason: lexical_alternative
  - marker: b
    text: Àwọn atúmọ̀ kan ka “pẹpẹ” náà sí Kristi fúnra rẹ̀, àwọn mìíràn sì kà á sí àgbélébùú, pẹpẹ ọ̀run, tàbí àǹfààní ẹbọ Kristi. Gíríìkì kò sọ ohun tí àwòrán náà ń tọ́ka sí ní pàtó níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: θυσιαστήριον
  choice: pẹpẹ
  rationale: “Pẹpẹ” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi tí a ti ń rú ẹbọ. Ó pa àwòrán ìrúbọ inú ẹsẹ náà mọ́ láì túmọ̀ rẹ̀ sí Kristi, àgbélébùú, tàbí ẹbọ ní pàtó.
- source_word: ἐξ οὗ
  choice: láti jẹ lára rẹ̀
  rationale: Ìsọ̀rọ̀ yìí fi hàn pé ohun tí wọ́n ń jẹ wá láti ara pẹpẹ náà; “lára rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ orísun náà mọ́.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: Èyí túmọ̀ infinitive náà ní tààràtà, ó sì bá gbólóhùn “kò ní ẹ̀tọ́” mu lọ́nà àdánidá.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: kò ní ẹ̀tọ́
  rationale: “Ẹ̀tọ́” mú ìtumọ̀ àṣẹ tàbí àǹfààní tí a fọwọ́ sí nínú ọ̀rọ̀ iṣẹ́ ibi mímọ́ yìí jáde dáadáa.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: àwọn tí ń ṣe iṣẹ́ ìsìn nínú àgọ́ ìjọsìn
  rationale: “Ṣe iṣẹ́ ìsìn” fi iṣẹ́ ìsìn ní ibi mímọ́ hàn ju ìjọsìn gbogbogbò lọ; “àgọ́ ìjọsìn” sì jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún σκηνή nínú àyíká Hébérù.
- source_word: ἔχομεν
  choice: Àwa ní
  rationale: Ó pa ìṣe àsìkò ìsinsìnyí àti fífi onkọ̀wé mọ́ àwọn olùgbọ́ rẹ̀ pọ̀ mọ́.
theological_decisions:
- issue: Ohun tí “pẹpẹ” ń tọ́ka sí ní Hébérù 13:10
  choice: A fi “pẹpẹ” sílẹ̀ gẹ́gẹ́ bí àwòrán tó wà nínú Gíríìkì, láì sọ ohun tí ó dúró fún ní pàtó nínú ẹsẹ náà.
  alternative: A lè túmọ̀ rẹ̀ gẹ́gẹ́ bí Kristi fúnra rẹ̀, àgbélébùú, pẹpẹ ọ̀run, tàbí àǹfààní ẹbọ Kristi.
  rationale: Gíríìkì kò ṣàlàyé ohun tí pẹpẹ náà ń tọ́ka sí níhìn-ín. Fífi àwòrán náà sílẹ̀ ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo “àgọ́ ìjọsìn” láti jẹ́ kí iṣẹ́ ibi mímọ́ inú àyíká Hébérù yé ni.
