id: HEB.13.9
reference: Hebrews 13:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí onírúurú ẹ̀kọ́ àjèjì gbé yín lọ. Nítorí ó dára kí ọkàn le nípasẹ̀ oore-ọ̀fẹ́[a], kì í ṣe nípasẹ̀ àwọn oúnjẹ[b]; àwọn tí ń gbé ìgbésí ayé wọn ní ìbámu pẹ̀lú wọn[c] kò rí àǹfààní kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a fi oore-ọ̀fẹ́ mú ọkàn dúró ṣinṣin” tàbí “kí oore-ọ̀fẹ́ fi ìdí ọkàn múlẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí láti fún ní okun, láti fi ìdí múlẹ̀, tàbí láti mú dúró ṣinṣin.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn oúnjẹ” tọ́ka sí àwọn àṣà tàbí ìlànà tó ní í ṣe pẹ̀lú oúnjẹ; ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “àwọn oúnjẹ.”
    reason: cultural_note
  - marker: c
    text: Ní tààrà, “àwọn tí ń rìn nínú wọn.” Èyí lè túmọ̀ sí àwọn tí ń gbé ìgbésí ayé wọn ní ìbámu pẹ̀lú wọn tàbí tí wọ́n ń tẹ̀lé wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: onírúurú ẹ̀kọ́ àjèjì
  rationale: “Onírúurú” fi ìyàtọ̀ àti ọ̀pọ̀ irú hàn, “àjèjì” sì pa ìtumọ̀ ohun tí kò bá ìhìn tí wọ́n ti gbà mu mọ́ láì sọ pé ó jẹ́ ti ẹ̀yà tàbí ilẹ̀ mìíràn.
- source_word: μὴ παραφέρεσθε
  choice: Ẹ má ṣe jẹ́ kí ... gbé yín lọ
  rationale: Ìtumọ̀ yìí pa àwòrán ohun tí a ń gbé kúrò ní ipa ọ̀nà mọ́, ó sì bá ìkìlọ̀ tí ń tẹ̀ síwájú mu.
- source_word: χάριτι
  choice: fi oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ ohun èlò tàbí ọ̀nà tí a fi ń mú ọkàn le; “oore-ọ̀fẹ́” pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: mú ọkàn le
  rationale: Ó sọ ní Yorùbá àdánidá pé kí ọkàn dúró ṣinṣin tàbí lágbára, ó sì pa àpẹẹrẹ “ọkàn” mọ́.
- source_word: οὐ βρώμασιν
  choice: kì í ṣe pẹ̀lú àwọn oúnjẹ
  rationale: A tú βρώμασιν ní tààrà sí “àwọn oúnjẹ,” láì fi òfin oúnjẹ tàbí àsè ẹbọ kún ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ.
- source_word: οἱ περιπατοῦντες
  choice: àwọn tí wọ́n fi ara wọn fún wọn
  rationale: περιπατέω jẹ́ “rìn” ní tààrà, ṣùgbọ́n níbí ó jẹ́ àpèjúwe ìwà tàbí bí ènìyàn ṣe ń gbé; yíyí sí “fi ara wọn fún wọn” jẹ́ Yorùbá àdánidá nípa àwọn àṣà tó ní í ṣe pẹ̀lú oúnjẹ.
- source_word: οὐκ ὠφελήθησαν
  choice: kò rí àǹfààní kankan
  rationale: Ó sọ kedere pé àwọn àṣà náà kò ṣe wọ́n ní oore tàbí mú èrè gidi wá fún wọn.
theological_decisions:
- issue: Ohun tí “àwọn oúnjẹ” ń tọ́ka sí àti ìyàtọ̀ rẹ̀ sí oore-ọ̀fẹ́
  choice: Fi “àwọn oúnjẹ” sílẹ̀ ní gbangba, kí a má bàa pinnu ju ọ̀rọ̀ Gíríìkì lọ.
  alternative: Túmọ̀ ọ́ sí àwọn òfin oúnjẹ, àwọn àṣà tó ní í ṣe pẹ̀lú oúnjẹ, tàbí àsè ẹbọ.
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn àṣà tàbí ìlànà oúnjẹ, ṣùgbọ́n ẹsẹ náà kò fi hàn ní pàtó bóyá ó jẹ́ òfin oúnjẹ lápapọ̀ tàbí àsè ẹbọ ní pàtó.
- issue: Ìtumọ̀ àpèjúwe “ọkàn”
  choice: Pa “ọkàn” mọ́ gẹ́gẹ́ bí àárín ìgbésí ayé inú ènìyàn.
  alternative: Ìrònú tàbí ẹni inú.
  rationale: καρδία ní ìwọ̀n pàtàkì nínú èdè Bíbélì; “ọkàn” pa àpèjúwe àti àìdánilójú rẹ̀ mọ́.
- issue: Agbára βεβαιοῦσθαι
  choice: mú ọkàn le
  alternative: fi ìdí ọkàn múlẹ̀ tàbí mú ọkàn dúró ṣinṣin
  rationale: Àwọn ìtumọ̀ wọ̀nyí jọ wà nínú ọ̀rọ̀ Gíríìkì; àkọ́kọ́ jẹ́ àdánidá, àlàyé ẹsẹ̀ ìsàlẹ̀ sì pa àwọn ọ̀nà mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Ẹ má ṣe” bá àṣẹ sí ọ̀pọ̀ ènìyàn mu. A yà àwọn àmì ẹsẹ̀ ìsàlẹ̀ sí ibi tí àlàyé wọn kan, láì fi ìtumọ̀ ẹ̀sìn kan pàtó lé “àwọn oúnjẹ” lórí.
