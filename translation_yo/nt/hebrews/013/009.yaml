    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn oúnjẹ” tọ́ka sí àwọn àṣà tàbí ìlànà tó ní í ṣe pẹ̀lú oúnjẹ; ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “àwọn oúnjẹ.”
    reason: cultural_note
