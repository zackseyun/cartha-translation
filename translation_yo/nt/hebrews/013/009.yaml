revisions:
- from: Ẹ má ṣe jẹ́ kí onírúurú ẹ̀kọ́ àjèjì gbé yín lọ. Nítorí ó dára kí a fi oore-ọ̀fẹ́ mú ọkàn le, kì í ṣe pẹ̀lú àwọn oúnjẹ; àwọn tí wọ́n fi ara wọn fún wọn kò rí àǹfààní kankan.[a][b]
  to: Ẹ má ṣe jẹ́ kí onírúurú ẹ̀kọ́ àjèjì gbé yín lọ. Nítorí ó dára kí ọkàn le nípasẹ̀ oore-ọ̀fẹ́[a], kì í ṣe nípasẹ̀ àwọn oúnjẹ[b]; àwọn tí ń gbé ìgbésí ayé wọn ní ìbámu pẹ̀lú wọn[c] kò rí àǹfààní kankan.
  rationale: The revision removes the added generic agent in the grace clause, retains the source’s deliberately broad “foods,” and renders the final participle as a lifestyle metaphor. It also relocates and separates footnote anchors so each note clearly corresponds to the expression it explains.
