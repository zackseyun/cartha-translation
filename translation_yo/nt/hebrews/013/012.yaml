id: HEB.13.12
reference: Hebrews 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: yo
  text: Nítorí náà, Jésù náà jìyà ní òde ẹnubodè[b], kí ó lè fi ẹ̀jẹ̀ tirẹ̀ sọ àwọn ènìyàn náà di mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘yà àwọn ènìyàn náà sí mímọ́.’
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ‘ní òde ẹnubodè’ tọ́ka sí ibi tí Jésù ti jìyà ní òde Jerusalẹmu; ó tún ń mú àpẹẹrẹ tí a mẹ́nu kàn ṣáájú wá sí ìrántí, níbi tí a ti ń mú ìyókù ẹbọ jáde sí òde ibùdó tàbí ẹnubodè.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde tàbí ìparí èrò tó ṣáájú.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó so ìjìyà Jésù mọ́ àpẹẹrẹ ẹbọ tí a mẹ́nu kàn ṣáájú, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἵνα ἁγιάσῃ
  choice: kí ó lè ... sọ ... di mímọ́
  rationale: ‘Kí ó lè’ fi ète hàn, ‘sọ ... di mímọ́’ sì pa ìtumọ̀ ìyàsímímọ́ àti ti ẹbọ mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: fi ẹ̀jẹ̀ tirẹ̀
  rationale: ‘Fi’ ṣàfihàn ohun èlò tàbí ọ̀nà, ‘tirẹ̀’ sì pa ìtẹnumọ́ ἰδίου mọ́ pé ẹ̀jẹ̀ Jésù fúnra rẹ̀ ni.
- source_word: τὸν λαόν
  choice: àwọn ènìyàn náà
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì tí ó sọ ‘àwọn ènìyàn náà’ láìfi ‘Ọlọ́run’ kún un, bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí àwọn ènìyàn májẹ̀mú.
- source_word: ἔξω τῆς πύλης
  choice: ní òde ẹnubodè
  rationale: Ó pa ẹnubodè kan ṣoṣo mọ́ gẹ́gẹ́ bí Gíríìkì, kò sì fi ‘ìlú’ kún ohun tí a kò sọ ní tààrà.
- source_word: ἔπαθεν
  choice: jìyà
  rationale: Ìṣe tó parí ní Gíríìkì ni a túmọ̀ ní ṣókí àti ní tààrà sí ‘jìyà.’
theological_decisions:
- issue: Ìtumọ̀ ἁγιάζω nínú àyíká ẹbọ
  choice: sọ ... di mímọ́
  alternative: yà ... sí mímọ́
  rationale: Àṣàyàn yìí pa èrò jíjẹ́ mímọ́ àti ìyàsímímọ́ mọ́, láìdín ọ̀rọ̀ náà kù sí ìyípadà ìwà nìkan tàbí fi ẹ̀kọ́ ìjọ kan pàtó lé e lórí.
- issue: Àwọn tí τὸν λαόν ń tọ́ka sí
  choice: àwọn ènìyàn náà
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: Àyíká tọ́ka sí àwọn ènìyàn májẹ̀mú Ọlọ́run, ṣùgbọ́n Gíríìkì kò fi ‘Ọlọ́run’ síbẹ̀; a pa àyè ìtumọ̀ yẹn mọ́ láìṣàfikún ọ̀rọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ní òde ẹnubodè’ dípò ọ̀rọ̀ àlàyé bí ‘ní òde ìlú,’ a sì lo ‘ẹ̀jẹ̀ tirẹ̀’ láti tẹnumọ́ pé ẹ̀jẹ̀ Jésù fúnra rẹ̀ ni.
