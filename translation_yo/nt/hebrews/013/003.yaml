id: HEB.13.3
reference: Hebrews 13:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: yo
  text: Ẹ máa rántí àwọn tí ó wà ní ẹ̀wọ̀n[a], bí ẹni pé a dè yín pọ̀ mọ́ wọn; ẹ máa rántí àwọn tí a ń fìyà jẹ, gẹ́gẹ́ bí ẹ̀yin náà ti wà nínú ara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a dè”; èdè Gíríìkì fi àwòrán àwọn tí a dè sínú ẹ̀wọ̀n hàn.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “nínú ara” tọ́ka sí jíjẹ́ ara kan náà nínú ara Kristi; ṣùgbọ́n ó ṣeé ṣe jù lọ pé ó ń tọ́ka sí àìlera ara ènìyàn tí gbogbo wa ní.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Ẹ máa rántí
  rationale: Ọ̀rọ̀ àṣẹ yìí tọ́ka sí ohun tí wọ́n gbọ́dọ̀ máa ṣe lọ́wọ́lọ́wọ́; ‘Ẹ máa rántí’ jẹ́ Yorùbá àdánidá tí ó fi ìtẹ̀síwájú náà hàn.
- source_word: τῶν δεσμίων
  choice: àwọn tí ó wà ní ẹ̀wọ̀n
  rationale: δέσμιος túmọ̀ sí ẹni tí a dè tàbí ẹlẹ́wọ̀n. Gbólóhùn yìí ṣe kedere ní Yorùbá òde òní, ó sì bá ipò àwùjọ inú ẹsẹ náà mu.
- source_word: ὡς συνδεδεμένοι
  choice: bí ẹni pé a dè yín pọ̀ mọ́ wọn
  rationale: συνδέομαι mú àwòrán dídè papọ̀ wá. Ìtumọ̀ yìí pa àwòrán náà mọ́, ó sì fi ìdánimọ̀ ìbánikẹ́dùn pẹ̀lú àwọn ẹlẹ́wọ̀n hàn.
- source_word: τῶν κακουχουμένων
  choice: àwọn tí a ń fìyà jẹ
  rationale: κακουχέομαι tọ́ka sí ìyà tàbí ìhùwàsí búburú tí àwọn ẹlòmíràn ń fi jẹ ẹni. Ọ̀rọ̀ yìí jẹ́ kedere, ó sì pa ìṣe tí ẹni náà ń fara dà mọ́.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: nítorí ẹ̀yin fúnra yín pẹ̀lú wà nínú ara
  rationale: '‘Wà nínú ara’ tẹ̀ lé ἐν σώματι ní pẹkipẹki, ó sì pa ààyè ìtumọ̀ rẹ̀ mọ́: ó ṣeé ṣe kí ó tọ́ka sí àìlera tí gbogbo ènìyàn inú ara lè ní, bó tilẹ̀ jẹ́ pé díẹ̀ lè gbọ́ ìró ìtumọ̀ ara Kristi nínú rẹ̀.'
theological_decisions:
- issue: Ìtumọ̀ ‘nínú ara’ (ἐν σώματι)
  choice: Ipò gbogbo ènìyàn gẹ́gẹ́ bí ẹni tí ó ní ara, tí ìyà sì lè dé bá
  alternative: Jíjẹ́ ara kan náà nínú ara Kristi
  rationale: Àyíká ọ̀rọ̀ náà ń pe àwọn olùgbọ́ sí ìbánikẹ́dùn pẹ̀lú àwọn ẹlẹ́wọ̀n àti àwọn tí a ń fìyà jẹ; nítorí náà, ìtumọ̀ àkọ́kọ́ ni àìlera ara tí gbogbo ènìyàn ní. Síbẹ̀, a pa gbólóhùn gangan ‘nínú ara’ mọ́, kí a má bàa ti ìtumọ̀ ìjọ síta pátápátá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘Ẹ’ bá àṣẹ ẹni kejì ọ̀pọ̀ inú Gíríìkì mu.
