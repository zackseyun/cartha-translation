id: HEB.13.14
reference: Hebrews 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: yo
  text: Nítorí a kò ní ìlú tí ó dúró pẹ́ níhìn-ín, ṣùgbọ́n ìlú tí ń bọ̀ ni à ń wá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú ọjọ́ iwájú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí a kò
  rationale: “Nítorí” so ẹsẹ̀ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé, “kò” sì jẹ́ kí ìsẹ́ náà di òdì ní kedere.
- source_word: ἔχομεν
  choice: a ní
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì bá ọ̀rọ̀ ìṣe ìsinsìnyí mu.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó pa ìtumọ̀ ibi ti ọ̀rọ̀ Gíríìkì náà mọ́ láì túmọ̀ ọ́ sí “lórí ilẹ̀ ayé,” èyí tí yóò fi ìtumọ̀ àlàyé kún un.
- source_word: μένουσαν
  choice: tí ó dúró pẹ́
  rationale: Ó ṣàpèjúwe ìlú tí ó ń bá a lọ láti wà, láì fi dandan sọ pé ó wà títí láé.
- source_word: πόλιν
  choice: ìlú
  rationale: A pa àwòrán gangan ti πόλις mọ́, dípò kí a rọ́pò rẹ̀ pẹ̀lú “ilé,” “orílẹ̀-èdè,” tàbí “ọ̀run.”
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ìlú tí kò dúró pẹ́ níhìn-ín àti èyí tí yóò dé.
- source_word: τὴν μέλλουσαν
  choice: èyí tí yóò dé
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí “ìlú” ó sì pa ìfojúsọ́nà sí ohun ọjọ́ iwájú mọ́ ní Yorùbá àdánidá.
- source_word: ἐπιζητοῦμεν
  choice: à ń wá
  rationale: Ìlànà ìṣe tí ń lọ lọ́wọ́ mú ìwákiri tó ń bá a lọ jáde; a kò fi ọ̀rọ̀ bí “taratara” kún un nítorí bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè ní agbára sí i, kì í ṣe gbogbo ibi ni a gbọ́dọ̀ sọ agbára yẹn ní tààrà.
theological_decisions:
- issue: Irú àwòrán tí “ìlú” dúró fún
  choice: A pa “ìlú” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ inú ẹsẹ̀ náà, láì sọ ọ́ di “ọ̀run” tàbí “Jerúsálẹ́mù ti ọ̀run.”
  alternative: ọ̀run; ìlú ọ̀run; Jerúsálẹ́mù ti ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé àwọn apá mìíràn nínú Hébérù ṣàlàyé àwòrán ìlú ọ̀run, ẹsẹ̀ yìí fúnra rẹ̀ kò dárúkọ ọ̀run tàbí Jerúsálẹ́mù. Mímú “ìlú” dúró pa àwòrán àti ìfojúsọ́nà ẹsẹ̀ náà mọ́ láì yanju rẹ̀ nípasẹ̀ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. “Tí ó dúró pẹ́” yẹra fún fífi ìtumọ̀ “títí láé” kún μένουσαν, “níhìn-ín” sì pa ìtọ́kasí ibi mọ́.
