id: HEB.13.16
reference: Hebrews 13:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: yo
  text: Ẹ má sì ṣe gbàgbé láti ṣe rere[a] àti láti pín ohun tí ẹ ní pẹ̀lú àwọn ẹlòmíràn[b], nítorí irú àwọn ẹbọ bẹ́ẹ̀ ni ó tẹ́ Ọlọ́run lọ́rùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe kọ ṣíṣe rere sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “ẹ má ṣe gbàgbé,” ṣùgbọ́n ó tún lè tọ́ka sí ṣíṣàìṣe ohun tí ó yẹ kí ènìyàn ṣe.
    reason: lexical_alternative
  - marker: b
    text: “Láti pín ohun tí ẹ ní” tún lè jẹ́ “ìbáṣepọ̀,” “ìwà ọ̀làwọ́,” tàbí “ìtọrẹ.” Nínú àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí fífi ohun ìní tàbí ohun àmúlò ẹni ṣe àjọpín pẹ̀lú àwọn ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: láti ṣe rere
  rationale: Ó túmọ̀ sí ṣíṣe ohun rere ní ìṣe, kì í ṣe èrò rere nìkan. Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìṣe inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κοινωνίας
  choice: láti pín ohun tí ẹ ní pẹ̀lú àwọn ẹlòmíràn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κοινωνία tọ́ka sí fífi ohun ìní tàbí ohun àmúlò ẹni ṣe àjọpín ní ọ̀nà ọ̀làwọ́. Ìtumọ̀ yìí ṣe kedere láì fi ọ̀rọ̀ náà mọ́ fífúnni ní owó nìkan.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Ẹ má sì ṣe gbàgbé
  rationale: Èyí pa àwòrán gidi ti ọ̀rọ̀-ìṣe Gíríìkì náà mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti kìlọ̀ pé kí ènìyàn má ṣe kọ ojúṣe kan sílẹ̀.
- source_word: τοιαύταις ... θυσίαις
  choice: irú àwọn ẹbọ bẹ́ẹ̀
  rationale: Ó pa àfiwé ẹbọ mọ́, níbi tí ṣíṣe rere àti ṣíṣe àjọpín ti jẹ́ àwọn ìṣe tí a ń gbé kalẹ̀ bí ẹbọ sí Ọlọ́run.
- source_word: εὐαρεστεῖται
  choice: inú Ọlọ́run dùn sí
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún jíjẹ́ ẹni tí ó ní inú dídùn sí ohun kan, ó sì fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí àwọn ẹbọ náà tẹ́ lọ́rùn.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún orúkọ olùṣe náà.
- source_word: δὲ
  choice: sì
  rationale: Patikulu “sì” so ìṣílétí yìí mọ́ ọ̀rọ̀ tí ó ṣáájú láì fi ìtakora líle kún un.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ẹbọ” nínú ẹsẹ náà
  choice: Àfiwé ni fún ṣíṣe rere àti pínpín ohun ẹni gẹ́gẹ́ bí ẹbọ tí inú Ọlọ́run dùn sí.
  alternative: Kí a mú un gẹ́gẹ́ bí fífúnni ní ọrẹ àánú nìkan, tàbí kí a yọ àwòrán ẹbọ kúrò kí a sọ ọ́ di ìwà rere lásán.
  rationale: Ọ̀rọ̀ Gíríìkì lo èdè ẹbọ ní tààrà fún àwọn ìṣe wọ̀nyí. Ìtumọ̀ náà pa àwòrán ẹ̀sìn yìí mọ́, láì fi í mọ́ fífúnni ní ọrẹ nìkan tàbí sọ ọ́ di ìwà rere tí kò ní ìbáṣepọ̀ pẹ̀lú ìjọsìn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu fún kíkà ní gbangba, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ẹ” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀. Gbólóhùn náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì pa àwòrán ẹbọ inú orísun Gíríìkì mọ́.
