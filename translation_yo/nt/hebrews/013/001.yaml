id: HEB.13.1
reference: Hebrews 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: yo
  text: Kí ìfẹ́ ará[a] máa bá a lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ fún àwọn onígbàgbọ́ ẹlẹgbẹ́.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ìfẹ́ bí ti àwọn ọmọ ìdílé láàárín ìjọ àwọn onígbàgbọ́; kò tọ́ka sí àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: ìfẹ́ ará
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìfẹ́ bí ti àwọn ọmọ ìdílé láàárín àwọn onígbàgbọ́. “Ìfẹ́ ará” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àwòrán ìdílé inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μενέτω
  choice: kí ... máa bá a lọ
  rationale: Ìṣe àṣẹ tó wà ní àkókò ìsinsìnyí ń béèrè pé kí ipò náà máa tẹ̀ síwájú. “Kí ... máa bá a lọ” fi agbára àṣẹ àti ìtumọ̀ ohun tó ń tẹ̀ síwájú hàn ní Yorùbá àdánidá.
- source_word: Ἡ
  choice: a kò túmọ̀ ọ́ lọ́tọ̀
  rationale: Atọ́ka náà fi ìwà rere tí àwọn olùgbọ́ ti mọ̀ sílẹ̀ gẹ́gẹ́ bí ohun pàtó; èdè Yorùbá kò nílò ọ̀rọ̀ míì níbí láti gbé agbára rẹ̀ jáde.
theological_decisions:
- issue: Ìwọ̀n ẹni tí φιλαδελφία kàn àti èdè ìdílé
  choice: ìfẹ́ ará
  alternative: ìfẹ́ fún àwọn onígbàgbọ́ ẹlẹgbẹ́; ìfẹ́ láàárín ara yín
  rationale: Aṣàyàn yìí pa àwòrán ìdílé inú Gíríìkì mọ́ láìfi ìtumọ̀ rẹ̀ mọ́ àwọn ọkùnrin nìkan. Àlàyé ìsàlẹ̀ fi hàn gbangba pé gbogbo àwọn onígbàgbọ́ ló wà nínú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó ṣe kedere, tó ní iyì, tí ó sì bójú mu fún òǹkàwé òde òní. Ilana “kí ... máa bá a lọ” jẹ́ àṣẹ onírẹ̀lẹ̀ ṣùgbọ́n tó lágbára, ó sì pa ìtẹ̀síwájú inú μενέτω mọ́.
