  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: yo
  text: Nítorí náà, nípasẹ̀ rẹ̀, ẹ jẹ́ kí a máa rú ẹbọ ìyìn sí Ọlọ́run nígbà gbogbo[a]—èyí ni èso ètè[b] tí ń jẹ́wọ́ orúkọ rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní gbogbo ìgbà,” tàbí “láìdáwọ́ dúró.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èso ètè wa.” Ọ̀rọ̀ “wa” kò hàn gbangba nínú Gíríìkì.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí ń fi orúkọ rẹ̀ hàn ní gbangba.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí ìjẹ́wọ́ ní gbangba tàbí fífi ohun kan mọ̀ sí òtítọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ó pa ọ̀nà tàbí ìlànà tí διά pẹ̀lú ọ̀rọ̀ inú genitive ń fi hàn mọ́, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi ẹni tí ‘rẹ̀’ ń tọ́ka sí hàn láìfi orúkọ kún ọ̀rọ̀ Gíríìkì.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: ἀναφέρωμεν
  choice: ẹ jẹ́ kí a máa rú
  rationale: ‘Ẹ jẹ́ kí a’ mú agbára ìṣírí inú hortatory subjunctive jáde, ‘máa’ sì bá ìṣe tí ń bá a lọ mu; ‘rú’ tún pa àwòrán ẹbọ mọ́.
- source_word: θυσίαν αἰνέσεως
  choice: ẹbọ ìyìn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa àwòrán ìrúbọ àti ìyìn méjèèjì mọ́.
- source_word: διὰ παντός
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí ṣíṣe ohun náà ní gbogbo ìgbà tàbí láìdáwọ́ dúró, ó sì yé òǹkàwé Yorùbá lójú ẹsẹ̀.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: ‘Sí’ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí a ń rú ẹbọ náà sí.
- source_word: τοῦτ’ ἔστιν
  choice: èyí ni
  rationale: Ó ṣàlàyé ohun tí ‘ẹbọ ìyìn’ túmọ̀ sí ní ọ̀nà Yorùbá tó rọrùn.
- source_word: καρπὸν χειλέων
  choice: èso ètè
  rationale: Ó pa àkàwé inú Gíríìkì àti ìró èdè Ìwé Mímọ́ mọ́ láìfi ‘wa’ kún un.
- source_word: ὁμολογούντων
  choice: tí ń jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ lè fi ìjẹ́wọ́ ní gbangba tàbí fífi ohun tí a mọ̀ sí òtítọ́ hàn; kò dín ọ̀rọ̀ náà kù sí ìyìn tàbí ọpẹ́ nìkan.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: orúkọ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ohun tí a ń jẹ́wọ́, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo dative.
theological_decisions:
- issue: Ẹni tí ‘rẹ̀’ nínú δι’ αὐτοῦ ń tọ́ka sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ‘nípasẹ̀ rẹ̀,’ nígbà tí àyíká ọ̀rọ̀ tọ́ka sí Kristi gẹ́gẹ́ bí alárinà.
  alternative: Ṣí i sí ‘nípasẹ̀ Jesu’ tàbí fi ọ̀rọ̀ alárinà kún un.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń sọ nípa Jesu, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo arọ́pò-orúkọ; pípa arọ́pò-orúkọ mọ́ yàgò fún fífi ohun tí kò hàn gbangba kún ọ̀rọ̀ náà.
- issue: Agbára àwòrán ìrúbọ
  choice: A pa ‘rú ẹbọ ìyìn’ mọ́.
  alternative: Tú u sí ‘máa yin Ọlọ́run.’
  rationale: Ọ̀rọ̀ náà mọ̀ọ́mọ̀ ṣàpèjúwe ìyìn gẹ́gẹ́ bí ẹbọ; pípa àwòrán yìí mọ́ ṣe pàtàkì fún ìbáṣepọ̀ rẹ̀ pẹ̀lú àyíká Hébérù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ẹ jẹ́ kí a’ fún ìṣírí ẹgbẹ́, ‘rú ẹbọ’ fún àwòrán ìrúbọ, a sì fi àmì ohùn sí ibi tí ó yẹ. Àwọn àmì àlàyé [a], [b], àti [c] wà níbi tí ọ̀kọ̀ọ̀kan ti kan nínú ọ̀rọ̀ pàtàkì.
