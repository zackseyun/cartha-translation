  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: yo
  text: Jésù, Mèsáyà náà, òun náà ni lánàá àti lónìí àti títí láéláé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi, òun náà ni lánàá àti lónìí àti títí láéláé.” A lè túmọ̀ ọ̀rọ̀ Gíríìkì Χριστός sí “Mèsáyà,” tàbí kí a kọ ọ́ gẹ́gẹ́ bí “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Ọ̀nà tí Yorùbá fi ń kọ orúkọ náà ní ìbámu pẹ̀lú lílò Bíbélì àti èdè Yorùbá.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A túmọ̀ oyè Gíríìkì náà gẹ́gẹ́ bí “Mèsáyà,” kì í ṣe bí ẹni pé ó jẹ́ orúkọ ìdílé; “Kristi” ṣì jẹ́ ọ̀nà míì tí a lè gbà kọ ọ́.
- source_word: ἐχθὲς
  choice: lánàá
  rationale: Ọ̀rọ̀ àkókò tó túmọ̀ sí ọjọ́ tó ṣáájú òní.
- source_word: σήμερον
  choice: lónìí
  rationale: Ọ̀rọ̀ àkókò tó túmọ̀ sí ọjọ́ òní, tí ó bá “lánàá” àti “títí láéláé” ṣe àkójọpọ̀.
- source_word: ὁ αὐτός
  choice: jẹ́ ọ̀kan náà
  rationale: Gíríìkì túmọ̀ sí “ọ̀kan náà”; lílo “jẹ́” mú un jẹ́ gbólóhùn Yorùbá tó péye, tó sì ṣe àfihàn pé kò yí padà.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láéláé
  rationale: Ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé ohun kan ń bá a lọ láìní òpin.
- source_word: καὶ ... καὶ ... καὶ
  choice: àti ... àti ... àti
  rationale: A pa àsopọ̀ tí a tún sọ mọ́ láti dá ìlù àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì dúró.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ nípa bí Jésù ṣe jẹ́ ọ̀kan náà kọjá gbogbo àkókò
  choice: A sọ ní tààrà pé Jésù Mèsáyà jẹ́ ọ̀kan náà lánàá, lónìí àti títí láéláé.
  alternative: A lè ṣàlàyé rẹ̀ síwájú gẹ́gẹ́ bí ẹ̀kọ́ nípa àìyípadà tàbí Ọlọ́run jíjẹ́ Kristi.
  rationale: Ẹsẹ̀ náà ń fìdí ìdúróṣinṣin ìdánimọ̀ Jésù múlẹ̀ kọjá gbogbo àkókò, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Èdè Yorùbá àjùmọ̀lò tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìtẹnumọ́ àsopọ̀ mẹ́ta inú Gíríìkì mọ́.
