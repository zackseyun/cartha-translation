id: HEB.7.14
reference: Hebrews 7:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: yo
  text: Nítorí ó hàn gbangba pé Olúwa wa ti jáde láti Júdà[a], ẹ̀yà tí Mósè kò sọ ohunkóhun nípa àwọn àlùfáà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti hù jáde láti Júdà.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń mú àwòrán ohun tí ń dìde tàbí tí ń hù jáde wá. Níhìn-ín, ó ń tọ́ka sí orísun Olúwa wa láti Júdà, kì í ṣe àjíǹde rẹ̀ ní pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: ó hàn gbangba
  rationale: Ó sọ pé ohun náà ṣe kedere, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi gbé òtítọ́ tí ó ṣe kedere kalẹ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé tí gbólóhùn yìí ní pẹ̀lú àríyànjiyàn tó ṣáájú mọ́.
- source_word: ἐξ Ἰούδα
  choice: láti inú Júdà
  rationale: Ó tọ́ka sí orísun tàbí ìran láti Júdà, láìfi ọ̀rọ̀ ‘ẹ̀yà’ kún un níbi tí gírámà Gíríìkì kò ti lò ó.
- source_word: ἀνατέταλκεν
  choice: ti yọ
  rationale: ‘Yọ’ pa àwòrán ohun tí ń hù tàbí tí ń jáde láti orísun kan mọ́, ó sì bá ọ̀rọ̀ nípa ìran láti Júdà mu ju ìtumọ̀ tí yóò mú àjíǹde wọ inú ẹsẹ yìí lọ.
- source_word: ὁ κύριος ἡμῶν
  choice: Olúwa wa
  rationale: Ó túmọ̀ orúkọ oyè náà àti arọ́pò-orúkọ ohun-ìní rẹ̀ lọ́nà àdánidá, ọlọ́wọ̀ ní Yorùbá.
- source_word: εἰς ἣν φυλήν
  choice: ní ti ẹ̀yà yìí
  rationale: Àtúnṣe ìṣètò gbólóhùn yìí jẹ́ kó ṣe kedere pé ẹ̀yà Júdà ni a ń tọ́ka sí, ó sì fi ìtumọ̀ ìbátan Gíríìkì hàn lọ́nà Yorùbá tí ó rọrùn.
- source_word: περὶ ἱερέων οὐδὲν
  choice: kò sọ ohunkóhun nípa àwọn àlùfáà
  rationale: Ó pa ìtọ́kasí pàtó sí àwọn àlùfáà mọ́ dípò yíyí rẹ̀ sí ọ̀rọ̀ àfojúrí bí ‘ipò àlùfáà.’
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Mósè kò sọ
  rationale: ‘Sọ’ jẹ́ ìtumọ̀ àdánidá fún λαλέω ní àyíká yìí; a so ìkọ̀ ‘kò’ mọ́ ọ̀rọ̀-ìṣe gẹ́gẹ́ bí èdè Yorùbá ṣe ń béèrè.
theological_decisions:
- issue: Ẹni tí ‘Olúwa wa’ ń tọ́ka sí
  choice: A fi ‘Olúwa wa’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ inú ẹsẹ náà; àyíká ni ó fi hàn pé Jésù ni.
  alternative: Fífi ‘Jésù’ kún un ní tààràtà.
  rationale: Àyíká Hébérù ń sọ nípa Jésù àti ìran rẹ̀ láti Júdà, ṣùgbọ́n fífi orúkọ rẹ̀ kún ẹsẹ náà yóò kọjá ohun tí Gíríìkì sọ.
- issue: Ìtumọ̀ ἀνατέταλκεν
  choice: Àwòrán yíyọ tàbí híhù láti inú Júdà, tó ń tọ́ka sí orísun ìran.
  alternative: ‘ti dìde,’ èyí tí a lè lóye gẹ́gẹ́ bí àjíǹde kúrò nínú òkú.
  rationale: Àyíká ń jíròrò ẹ̀yà ìran àti bí a ṣe ń yan àlùfáà; ‘ti yọ’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láìjẹ́ kí àjíǹde di ìtumọ̀ pàtàkì rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ, a sì lo àmì àárín-gbólóhùn láti mú ìṣètò ọ̀rọ̀ Gíríìkì wá sí ọ̀nà Yorùbá àdánidá láìyí ìtumọ̀ rẹ̀ padà.
