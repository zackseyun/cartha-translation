id: HEB.7.8
reference: Hebrews 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: yo
  text: Níhìn-ín sì ni àwọn ọkùnrin tí ń kú ń gba ìdámẹ́wàá[a], ṣùgbọ́n níbẹ̀, ẹni tí a jẹ́rìí nípa rẹ̀ pé ó wà láàyè ni ó ń gba wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níbẹ̀ ni Ìwé Mímọ́ ti jẹ́rìí nípa rẹ̀ pé ó wà láàyè.” Èdè Gíríìkì gbé ọ̀rọ̀ náà kalẹ̀ gẹ́gẹ́ bí ẹ̀rí Ìwé Mímọ́, dípò kí ó sọ ní tààrà pé Mẹlikisédékì ní àìkú gangan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó pa ìyàtọ̀ ibi tí ọ̀rọ̀ náà fi ń ṣe láàárín ètò àwọn àlùfáà Lefi nísinsìnyí àti ìtàn Mẹlikisédékì nínú Ìwé Mímọ́ mọ́.
- source_word: δεκάτας
  choice: ìdámẹ́wàá
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àṣà ẹ̀sìn àti òfin inú àyíká ọ̀rọ̀ náà mu.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: àwọn ọkùnrin tí ń kú
  rationale: Ó tú participle náà jáde ní kíkún, ó sì tẹnumọ́ pé àwọn àlùfáà Lefi jẹ́ ẹni kíkú; ‘ọkùnrin’ yẹ nítorí àwọn àlùfáà ọkùnrin ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: λαμβάνουσιν
  choice: ń gba
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí kò fi àlàyé míì kún ìṣe gbígba ìdámẹ́wàá.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó pa ìlànà ìfiwéra ‘níhìn-ín … níbẹ̀’ mọ́, ní títọ́ka sí bí Ìwé Mímọ́ ṣe gbé Mẹlikisédékì kalẹ̀.
- source_word: μαρτυρούμενος
  choice: a jẹ́rìí sí i
  rationale: Ọ̀rọ̀ aláìlórúkọ yìí pa ìtumọ̀ passive àti agbára ẹ̀rí Ìwé Mímọ́ mọ́ láì sọ ẹni tó jẹ́rìí ní pàtó.
- source_word: ὅτι ζῇ
  choice: pé ó wà láàyè
  rationale: Ó pa present tense mọ́, ó sì sọ ọ́ ní Yorùbá àdánidá láì yí ẹ̀rí Ìwé Mímọ́ padà sí ìjẹ́rìí pé Mẹlikisédékì kò lè kú.
theological_decisions:
- issue: Irú ìyàtọ̀ tó wà láàárín àwọn àlùfáà Lefi àti Mẹlikisédékì
  choice: Ẹsẹ̀ náà fi àwọn àlùfáà Lefi tí wọ́n jẹ́ ẹni kíkú wé Mẹlikisédékì, ẹni tí a jẹ́rìí sí i nínú Ìwé Mímọ́ pé ó wà láàyè.
  alternative: Ẹsẹ̀ náà ń kọ́ni pé Mẹlikisédékì fúnra rẹ̀ wà láàyè títí láé, kò sì lè kú.
  rationale: Fífi èdè ẹ̀rí náà sílẹ̀ mú kí àríyànjiyàn ìwé Hébérù dúró lórí bí ìtàn Jẹ́nẹ́sísì ṣe gbé Mẹlikisédékì kalẹ̀, láì fipá pinnu pé ó ní àìkú gangan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ó ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn ọkùnrin’ nítorí àwọn àlùfáà ọkùnrin ni referent, a sì pa ìfiwéra ‘níhìn-ín … níbẹ̀’ mọ́.
