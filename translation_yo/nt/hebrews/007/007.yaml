  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: yo
  text: Kò sì sí àríyànjiyàn kankan[a] pé ẹni tí ipò rẹ̀ kéré ni ó ń gba ìbùkún lọ́wọ́ ẹni tí ipò rẹ̀ ga jù ú lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìsí ìtakora kankan” tàbí “láìsí àríyànjiyàn kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Kò sì sí àríyànjiyàn kankan
  rationale: Gbólóhùn yìí túmọ̀ sí pé ọ̀rọ̀ tí ó tẹ̀ lé e kò sí fún àtakò tàbí àríyànjiyàn. “Sì” ń fi ìyípadà ọ̀rọ̀ pẹ̀lẹ́pẹ̀lẹ́ tí δέ ní hàn láìsọ ọ́ di ìtakora líle.
- source_word: τὸ ἔλαττον
  choice: ẹni tí ó kéré
  rationale: Àfiwé náà ń tọ́ka sí ẹni tí ipò rẹ̀ kéré sí ti ẹlòmíràn. Ọ̀rọ̀ yìí pa ìtumọ̀ àfiwé mọ́ láìfi ìwà búburú tàbí àìníyelórí kún un.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: lọ́wọ́ ẹni tí ó tóbi jù ú lọ
  rationale: “Lọ́wọ́” fi ẹni tí ìbùkún ti ọ̀dọ̀ rẹ̀ wá hàn, “ẹni tí ó tóbi jù ú lọ” sì pa àfiwé ipò tí κρείττων ní mọ́.
- source_word: εὐλογεῖται
  choice: ń gba ìbùkún
  rationale: Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá fún ìṣe aláìṣe-taara náà, ó sì fi hàn pé ẹni tí ó kéré ni olùgbà ìbùkún.
theological_decisions:
- issue: Irú àfiwé tí ó wà láàárín “ẹni tí ó kéré” àti “ẹni tí ó tóbi”
  choice: Gbólóhùn náà sọ ìlànà gbogbogbò pé ẹni tí ipò rẹ̀ kéré ń gba ìbùkún lọ́wọ́ ẹni tí ipò rẹ̀ ga jù ú lọ.
  alternative: Kí a ka á sí àṣà àwùjọ lásán tí kò ní ìtumọ̀ ẹ̀kọ́ nípa Ọlọ́run.
  rationale: Nínú Hébérù 7, ọ̀rọ̀ yìí ń ṣètìlẹ́yìn fún àríyànjiyàn pé Mẹlikisédékì tóbi ju Ábúráhámù lọ. Ìtumọ̀ náà pa èdè àfiwé mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo “ń gba ìbùkún lọ́wọ́” dípò àkópọ̀ aláìṣe-taara tí kò fi bẹ́ẹ̀ jẹ́ àdánidá ní Yorùbá; ìtumọ̀ àti àfiwé ipò inú orísun ṣì wà ní pípé.
