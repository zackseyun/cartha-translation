id: HEB.7.1
reference: Hebrews 7:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: yo
  text: Nítorí Melkisedeki yìí, ọba Salemu, àlùfáà Ọlọ́run Gíga Jù Lọ[a], ni ó pàdé Abrahamu nígbà tí ó ń padà bọ̀ láti ìpakúpa àwọn ọba[b], ó sì súre fún un,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àlùfáà Ọlọ́run, Ẹni Gíga Jù Lọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bíborí àwọn ọba.” Ní tààrà sí i, èdè Gíríìkì sọ pé, “ìpakúpa àwọn ọba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: Nítorí Melikisedeki yìí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé γάρ mọ́ ọ̀rọ̀ tí ó ṣáájú mọ́, “yìí” sì fi agbára demonstrative Οὗτος hàn ní Yorùbá àdánidá.
- source_word: Μελχισέδεκ
  choice: Melikisedeki
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìlànà tí ó wọ́pọ̀ nínú Yorùbá Bíbélì.
- source_word: βασιλεὺς Σαλήμ
  choice: ọba Salẹmu
  rationale: Ó túmọ̀ βασιλεύς ní tààrà, ó sì pa ìbáṣepọ̀ pẹ̀lú ìtàn Jẹ́nẹ́sísì 14 mọ́.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: àlùfáà Ọlọ́run Ọ̀gá Ògo
  rationale: “Ọlọ́run Ọ̀gá Ògo” jẹ́ ọ̀nà Yorùbá tí ó níyì, tí ó sì ṣe àfihàn ὕψιστος gẹ́gẹ́ bí orúkọ oyè Ọlọ́run.
- source_word: συναντήσας
  choice: ni ó pàdé
  rationale: “Pàdé” jẹ́ ìtumọ̀ àdánidá fún ìṣe Melikisedeki sí Abrahamu; “ni ó” tún ń gbé ẹni tí ó ṣe ìṣe náà jáde nínú gbólóhùn gígùn yìí.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìlànà Yorùbá tí ó wọ́pọ̀.
- source_word: ὑποστρέφοντι
  choice: nígbà tí ó ń padà bọ̀
  rationale: Ó mú ìṣe tí ó ń lọ lọ́wọ́, tí participle present náà fi hàn, jáde ní Yorùbá kedere.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: láti ibi ìpakúpa àwọn ọba
  rationale: “Ìpakúpa” pa agbára àwòrán κοπή—gígé lulẹ̀ tàbí pípa ní ogun—mọ́, láì sọ ọ́ di “ìṣẹ́gun” nìkan.
- source_word: εὐλογήσας αὐτόν
  choice: ó sì súre fún un
  rationale: Ó fi ìṣe kejì tí Melikisedeki ṣe sí Abrahamu hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ orúkọ oyè τοῦ θεοῦ τοῦ ὑψίστου
  choice: àlùfáà Ọlọ́run Ọ̀gá Ògo
  alternative: àlùfáà Ọlọ́run Gíga Jù Lọ
  rationale: Àṣàyàn náà lo orúkọ oyè Yorùbá tí a mọ̀, ó sì pa ìtumọ̀ pé Ọlọ́run ni Ẹni Gíga Jù Lọ mọ́ láì fi ẹ̀kọ́ ìjọ kan kun un.
- issue: Bí a ṣe máa tú κοπή τῶν βασιλέων
  choice: ìpakúpa àwọn ọba
  alternative: bíborí àwọn ọba
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí gígé àwọn ọ̀tá lulẹ̀ ní ogun tàbí sí bíborí wọn. Àkọ́kọ́ pa agbára ọ̀rọ̀ náà mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ tí kò le tó bẹ́ẹ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa oní àmì ohùn ni a lò, pẹ̀lú èdè òde òní tí ó níyì. A pa ìṣàn gbólóhùn Gíríìkì mọ́, títí kan àmì kọ́mà ní òpin, nítorí ẹsẹ yìí ń bá ọ̀rọ̀ rẹ̀ lọ nínú ẹsẹ tó tẹ̀ lé e.
