  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: yo
  text: Ṣùgbọ́n òun, nítorí pé ó wà títí láé, ní ipò àlùfáà tí kì í yí padà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ipò àlùfáà tí kò lè kọjá sí ẹlòmíràn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ipò náà kì í yí padà tàbí pé kò kọjá sí ẹlòmíràn. Nínú àyíká yìí, kókó ọ̀rọ̀ náà ni pé nítorí Jésù wà títí láé, ipò àlùfáà rẹ̀ kò kọjá sí ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n òun
  rationale: Ọ̀rọ̀ arọ́pò orúkọ yìí ń tọ́ka sí Jésù, ó sì fi í ṣe ìyàtọ̀ sí ọ̀pọ̀ àwọn àlùfáà tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: nítorí tí ó wà
  rationale: διά pẹ̀lú infinitive tó ní article ń fi ìdí hàn; μένω níbí túmọ̀ sí pé ó ń bá a lọ láti wà láàyè, ní ìyàtọ̀ sí àwọn àlùfáà tí ikú dá iṣẹ́ wọn dúró.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Èyí jẹ́ ọ̀nà èdè Gíríìkì fún ohun tí kò ní òpin; ‘títí láé’ jẹ́ Yorùbá àdánidá tí ó pa agbára àkókò náà mọ́.
- source_word: ἀπαράβατον
  choice: tí kì í yí padà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ohun tí kò yí padà tàbí ohun tí a kò lè gbé lé ẹlòmíràn. Àyíká fi hàn pé ipò àlùfáà Jésù dúró ṣinṣin nítorí ó wà títí láé; àlàyé ìsàlẹ̀ pa ìtumọ̀ méjèèjì mọ́.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: ní ipò àlùfáà
  rationale: ἔχω pẹ̀lú ἱερωσύνην ń sọ nípa jíjẹ́ ẹni tó di ipò tàbí iṣẹ́ àlùfáà mú. ‘Ní ipò àlùfáà’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἱερωσύνην
  choice: ipò àlùfáà
  rationale: Orúkọ náà ń tọ́ka sí ipò tàbí iṣẹ́ àlùfáà, kì í ṣe gbogbo ẹgbẹ́ àwọn àlùfáà.
theological_decisions:
- issue: Ìtumọ̀ ἀπαράβατον nípa ipò àlùfáà Kristi
  choice: tí kì í yí padà
  alternative: tí a kò lè gbé lé ẹlòmíràn
  rationale: Àyíká ń fi ipò àlùfáà Jésù tó dúró ṣinṣin wé àwọn àlùfáà tó ń kú tí ẹlòmíràn sì ń rọ́pò wọn. Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó lè lọ sí ọ̀nà méjèèjì, nítorí náà a lo gbolohun tó rọrùn nínú ẹsẹ, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní ọlá, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo ‘òun’ láti mú ìtakora pẹ̀lú àwọn àlùfáà tó ṣáájú hàn.
