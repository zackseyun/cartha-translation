base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: yo
  text: Àti pé, bí a bá lè sọ bẹ́ẹ̀[a], nípasẹ̀ Ábúráhámù, àní Léfì, ẹni tí ó ń gba ìdámẹ́wàá, ti san ìdámẹ́wàá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹnì kan bá lè sọ bẹ́ẹ̀”; tàbí, “bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà rí bẹ́ẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “a ti gba ìdámẹ́wàá lọ́wọ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì wà ní passive; ó ń fi hàn pé a ka Léfì sí ẹni tí ó san ìdámẹ́wàá nípasẹ̀ Ábúráhámù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: bí a ṣe lè sọ ọ́
  rationale: Àṣà ọ̀rọ̀ yìí fi hàn pé òǹkọ̀wé ń sọ ọ̀rọ̀ náà lọ́nà àfiwé tàbí pẹ̀lú ìṣọ́ra. Èdè Yorùbá yìí jẹ́ ti òde òní, ó sì pa ìrẹ̀lẹ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δι’ Ἀβραὰμ
  choice: nípasẹ̀ Ábúráhámù
  rationale: διά pẹ̀lú genitive tọ́ka sí ọ̀nà tàbí ẹni tí ìṣe kan gba ṣẹlẹ̀. Èyí pa èrò pé ìṣe Léfì ṣẹlẹ̀ nípasẹ̀ baba ńlá rẹ̀ mọ́ láìṣàlàyé ẹ̀kọ́ ìsìn kan sí i.
- source_word: καὶ Λευὶ
  choice: àní Léfì
  rationale: καί níbí ní agbára ìtẹnumọ́; ‘àní’ mú ìyàlẹ́nu inú àríyànjiyàn náà jáde ju fífi ‘Léfì pẹ̀lú’ lásán lọ.
- source_word: ὁ δεκάτας λαμβάνων
  choice: ẹni tí ó ń gba ìdámẹ́wàá
  rationale: Participle ti present ń ṣàpèjúwe ojúṣe Léfì gẹ́gẹ́ bí ẹni tí ó máa ń gba ìdámẹ́wàá. ‘Ń gba’ jẹ́ adayébá, ó sì fi iṣẹ́ tí ó jẹ́ àṣà rẹ̀ hàn.
- source_word: δεκάτας
  choice: ìdámẹ́wàá
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìdá kan nínú mẹ́wàá tí a fi fún iṣẹ́ ẹ̀sìn.
- source_word: δεδεκάτωται
  choice: ti san ìdámẹ́wàá
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ perfect passive, èrò nínú àyíká ọ̀rọ̀ ni pé a ka Léfì sí ẹni tí ó ti san ìdámẹ́wàá nípasẹ̀ Ábúráhámù. Ìtumọ̀ yìí jẹ́ adayébá ní Yorùbá; àlàyé ìsàlẹ̀ ojú ìwé sì pa passive Gíríìkì mọ́.
theological_decisions:
- issue: Ìkópa Léfì nínú ìṣe Ábúráhámù gẹ́gẹ́ bí aṣojú rẹ̀
  choice: Ọ̀rọ̀ náà sọ pé Léfì san ìdámẹ́wàá nípasẹ̀ Ábúráhámù, ó sì pa gbólóhùn ìṣọ́ra ‘bí a ṣe lè sọ ọ́’ mọ́.
  alternative: A lè túmọ̀ rẹ̀ pé a ti gba ìdámẹ́wàá lọ́wọ́ Léfì, tàbí pé Léfì wà nínú Ábúráhámù lọ́nà ìṣọ̀kan ìran.
  rationale: Ẹsẹ̀ náà ń lo Ábúráhámù gẹ́gẹ́ bí baba ńlá tó ṣojú Léfì nínú àríyànjiyàn nípa ipò Mẹlikisédékì. A kò sọ bí ìṣojú náà ṣe ń ṣiṣẹ́ nípa ẹ̀kọ́ ìsìn; a pa ìfọ̀rọ̀wérọ̀ àti ìṣọ́ra inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè jẹ́ Yorùbá àgbàndá tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti bá àṣà ìkọ̀wé mu; a sì fi orúkọ Ábúráhámù àti Léfì hàn ní ìrísí tí ó wọ́pọ̀ nínú Yorùbá.
