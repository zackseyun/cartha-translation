  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: yo
  text: Àwọn àlùfáà sì pọ̀ ní iye[a], nítorí ikú ń dí wọ́n lọ́wọ́ láti máa bá iṣẹ́ àlùfáà lọ[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀pọ̀ àwọn àlùfáà ti wà.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “láti dúró” tàbí “láti wà nìṣó”; nínú àyíká ọ̀rọ̀ yìí, ìtumọ̀ rẹ̀ ni láti máa bá iṣẹ́ àlùfáà lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Àti pé
  rationale: Ó so ẹsẹ yìí mọ́ ìjíròrò tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú Yorùbá.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: àwọn àlùfáà wọ̀nyẹn ti di púpọ̀
  rationale: Èyí pa ìtumọ̀ pé iye àwọn àlùfáà pọ̀ mọ́, ó sì mú àtakò tí μέν ń múra sílẹ̀ fún ẹsẹ 24 hàn láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un. Ọ̀rọ̀ ‘ti di’ tún fi ipa perfect γεγονότες hàn.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: nítorí ikú kò jẹ́ kí wọ́n
  rationale: Ìtumọ̀ yìí fi ìdí tí διά pẹ̀lú infinitive ń tọ́ka sí hàn, ó sì sọ passive κωλύεσθαι àti ipa irinṣẹ́ θανάτῳ ní Yorùbá àdánidá.
- source_word: παραμένειν
  choice: máa bá iṣẹ́ àlùfáà wọn lọ
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí wíwà nìṣó nínú ojúṣe àlùfáà. Ìtumọ̀ yìí ṣe kedere láìyí èrò pàtàkì padà.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ọ̀pọ̀ àwọn àlùfáà àtijọ́ àti iṣẹ́ àlùfáà Jesu tó dúró títí
  choice: A fi ọ̀pọ̀ àwọn àlùfáà tí ikú dá dúró hàn, gẹ́gẹ́ bí ìmúrasílẹ̀ fún ìyàtọ̀ inú ẹsẹ 24.
  alternative: Kí a pe wọ́n ní ‘àwọn àlùfáà ọmọ Lefi’ tààrà nínú ẹsẹ náà.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àwọn àlùfáà ọmọ Lefi ni, ṣùgbọ́n Gíríìkì ẹsẹ yìí kò dárúkọ Lefi. Nítorí náà, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó ju ọ̀rọ̀ orísun lọ kún ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Àlùfáà’ ni a lò fún ἱερεῖς, ‘iṣẹ́ àlùfáà’ sì ṣàlàyé ohun tí wíwà nìṣó túmọ̀ sí nínú àyíká yìí.
