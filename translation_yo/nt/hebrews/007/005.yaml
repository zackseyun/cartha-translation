revisions:
- from: Àti àwọn tí ó wà lára àwọn ọmọ Léfì, tí wọ́n ń gba ipò àlùfáà, ní àṣẹ lábẹ́ òfin láti gba ìdámẹ́wàá lọ́wọ́ àwọn ènìyàn, èyíinì ni, lọ́wọ́ àwọn arákùnrin wọn[a], bí ó tilẹ̀ jẹ́ pé àwọn náà ti jáde láti inú ẹ̀gbẹ́ Ábúráhámù[b].
  to: Àwọn kan nínú àwọn ọmọ Léfì tí wọ́n gba ipò àlùfáà ní àṣẹ, gẹ́gẹ́ bí òfin, láti gba ìdámẹ́wàá lọ́wọ́ àwọn ènìyàn—ìyẹn ni, àwọn arákùnrin wọn[a]—bí ó tilẹ̀ jẹ́ pé àwọn náà ti jáde láti inú ìbàdí Ábúráhámù[b].
  rationale: Àtúnṣe náà ṣàtúnṣe ìtumọ̀ àkànlò ὀσφύς sí “ìbàdí,” kí àwòrán ìran-ara orísun lè dúró. Ó tún lo “gẹ́gẹ́ bí òfin” fún κατὰ τὸν νόμον, ó sì mú ìbẹ̀rẹ̀ gbolohun náà rọrùn láti ka láìyí ìtumọ̀ rẹ̀ padà.
