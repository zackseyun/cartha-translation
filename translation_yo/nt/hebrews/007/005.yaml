  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: yo
  text: Àwọn kan nínú àwọn ọmọ Léfì tí wọ́n gba ipò àlùfáà ní àṣẹ, gẹ́gẹ́ bí òfin, láti gba ìdámẹ́wàá lọ́wọ́ àwọn ènìyàn—ìyẹn ni, àwọn arákùnrin wọn[a]—bí ó tilẹ̀ jẹ́ pé àwọn náà ti jáde láti inú ìbàdí Ábúráhámù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn.” Gíríìkì ní “àwọn arákùnrin wọn,” ó sì lo èdè ìbátan akọ fún àwọn tí wọ́n jọ jẹ́ ọmọ Ísírẹ́lì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn náà jẹ́ ìran Ábúráhámù.” Ní tààrà, “àwọn náà ti jáde láti inú ìbàdí Ábúráhámù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: àwọn tí ó wà lára àwọn ọmọ Léfì
  rationale: Ó pa ìtumọ̀ apá-kan nínú ἐκ mọ́, ó sì dá èdè ìbátan ‘àwọn ọmọ Léfì’ dúró dípò fífọ ọ́ di ‘àwọn ọmọ Léfì’ lásán ní ìtumọ̀ gbogbo.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: tí wọ́n ń gba ipò àlùfáà
  rationale: ‘Gba ipò àlùfáà’ fi hàn pé wọ́n gba iṣẹ́ tàbí ipò náà, kì í ṣe pé wọ́n gbé e fún ara wọn; fífi ‘ipò’ kún un mú un ṣe kedere ní Yorùbá.
- source_word: ἐντολὴν ἔχουσιν
  choice: ní àṣẹ
  rationale: ‘Ní àṣẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìkọ̀lé orúkọ yìí, ó sì pa agbára àṣẹ òfin rẹ̀ mọ́.
- source_word: ἀποδεκατοῦν
  choice: láti gba ìdámẹ́wàá lọ́wọ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí gbígba ìdámẹ́wàá lọ́wọ́ ẹlòmíràn, kì í ṣe fífúnni ní ìdámẹ́wàá; ‘lọ́wọ́’ mú ẹni tí a gbà á lọ́wọ́ ṣe kedere.
- source_word: τὸν λαὸν
  choice: àwọn ènìyàn
  rationale: Ìtumọ̀ tààrà fún λαός ni; àlàyé tó tẹ̀ lé e fi hàn pé àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn ni.
- source_word: κατὰ τὸν νόμον
  choice: lábẹ́ òfin
  rationale: Ó sọ pé òfin ni ìpìlẹ̀ àti àṣẹ fún gbígba ìdámẹ́wàá; ó jẹ́ gbólóhùn Yorùbá àdánidá nínú àyíká òfin.
- source_word: τοῦτ’ ἔστιν
  choice: èyíinì ni
  rationale: Ó ṣàfihàn àlàyé tó tún ẹni tí ‘àwọn ènìyàn’ ń tọ́ka sí ṣe kedere.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: àwọn arákùnrin wọn
  rationale: Ó pa èdè ìbátan akọ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé ó lè tọ́ka sí àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn lápapọ̀.
- source_word: καίπερ
  choice: bí ó tilẹ̀ jẹ́ pé
  rationale: Ó mú ìtumọ̀ ìyọ̀ǹda tàbí ìtakora kékeré inú καίπερ jáde ní Yorùbá tó wọ́pọ̀.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: àwọn náà ti jáde láti inú ẹ̀gbẹ́ Ábúráhámù
  rationale: Ó pa àwòrán ara tó ń sọ nípa ìran bíbí mọ́, èyí tó ṣe pàtàkì fún àríyànjiyàn inú Hébérù 7, nígbà tó sì tún ṣeé lóye ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ èdè ìbátan akọ tí ó dúró fún àwọn ọmọ Ísírẹ́lì lápapọ̀
  choice: àwọn arákùnrin wọn
  alternative: àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ wọn
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ἀδελφούς, nítorí náà ọ̀rọ̀ pàtàkì pa ‘arákùnrin’ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé fi ìtọ́kasí àwùjọ rẹ̀ hàn.
- issue: Pípamọ́ àkànlò ara fún ìran Ábúráhámù
  choice: ti jáde láti inú ẹ̀gbẹ́ Ábúráhámù
  alternative: jẹ́ ìran Ábúráhámù
  rationale: Àkànlò ara náà tẹnu mọ́ ìran ti ara tí àwọn àlùfáà àti àwọn ọmọ Ísírẹ́lì yòókù jọ ní; pípamọ́ rẹ̀ ń dá agbára ọ̀rọ̀ onkọ̀wé dúró.
translation_notes:
  register: Èdè Yorùbá tó lọ́lá, tó ṣe kedere, tí ó sì bá ìlò òde òní mu ni a lò. A pa àwọn ọ̀rọ̀ pàtàkì bí ‘ipò àlùfáà,’ ‘ìdámẹ́wàá,’ àti àkànlò ìran ara mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
