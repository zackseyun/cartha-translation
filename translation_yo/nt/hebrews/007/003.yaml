id: HEB.7.3
reference: Hebrews 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: yo
  text: kò ní baba, kò ní ìyá, kò ní ìtàn ìran[a]; kò ní ìbẹ̀rẹ̀ ọjọ́ tàbí òpin ìyè, ṣùgbọ́n a mú un dà bí Ọmọ Ọlọ́run; ó sì jẹ́ àlùfáà títí láé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò ṣàkọsílẹ̀ ìran rẹ̀.” Ohun tí a tẹnumọ́ ni pé Gẹnẹsisi kò sọ ìtàn ìran Mẹlikisẹ́dẹki; Ìwé Hébérù sì lo àìsí àkọsílẹ̀ yìí gẹ́gẹ́ bí àpẹẹrẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní gbogbo ìgbà” tàbí “láìdáwọ́ dúró.” Gbólóhùn náà tẹnumọ́ pé iṣẹ́ àlùfáà rẹ̀ ń bá a lọ nínú bí Ìwé Mímọ́ ṣe gbé e kalẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: kò ní baba
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ àìní-baba mọ́, láìfi ìmọ̀lára ẹni tí baba rẹ̀ kú tàbí kọ̀ sílẹ̀ kún un. Àlàyé ìsàlẹ̀ fi hàn pé àìsí ìtàn ìran nínú Gẹnẹsisi ni ọ̀rọ̀ náà lè tọ́ka sí.
- source_word: ἀμήτωρ
  choice: kò ní ìyá
  rationale: Ó bá ἀπάτωρ dọ́gba ní ìṣètò, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἀγενεαλόγητος
  choice: kò ní ìtàn ìran
  rationale: “Ìtàn ìran” jẹ́ ọ̀nà àdánidá láti sọ genealogy ní Yorùbá, ó sì lè tọ́ka sí àkọsílẹ̀ àwọn baba ńlá láìpinnu pé kò ní òbí ní ti gidi.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: kò ní ìbẹ̀rẹ̀ ọjọ́ tàbí òpin ìyè
  rationale: Ó pa ìṣọ̀kan àwọn gbolohun méjèèjì àti ìlò ọ̀rọ̀ gíga ti Giriki mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἀφωμοιωμένος
  choice: a mú un dà bí
  rationale: Ó pa agbára passive ti perfect participle mọ́, ó sì fi ìfiwéra hàn dípò ìdánimọ̀ pé Mẹlikisẹ́dẹki gan-an ni Ọmọ Ọlọ́run.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún orúkọ oyè Kristi yìí.
- source_word: μένει ἱερεὺς
  choice: ó dúró gẹ́gẹ́ bí àlùfáà
  rationale: “Ó dúró” sọ ìwà tí ń bá a lọ; “gẹ́gẹ́ bí àlùfáà” jẹ́ Yorùbá àdánidá fún ipo rẹ̀.
- source_word: εἰς τὸ διηνεκές
  choice: títí láé
  rationale: Ó sọ ìdúróṣinṣin àti ìtẹ̀síwájú àlùfáà rẹ̀ ní ọ̀nà tó yé àwọn òǹkàwé Yorùbá; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì mọ́.
theological_decisions:
- issue: Bóyá ẹsẹ náà ń sọ pé Mẹlikisẹ́dẹki kò ní òbí, kò sì lè kú ní ti gidi, tàbí pé Ìwé Mímọ́ gbé e kalẹ̀ bẹ́ẹ̀ fún àpẹẹrẹ
  choice: A pa àwọn ọ̀rọ̀ líle náà mọ́ nínú ẹsẹ, ṣùgbọ́n “a mú un dà bí Ọmọ Ọlọ́run” fi hàn pé ìfiwéra ni, kì í ṣe ìdánimọ̀.
  alternative: Kí a túmọ̀ ọ́ ní kedere pé Mẹlikisẹ́dẹki ni Kristi ṣáájú dídi ènìyàn, tàbí pé kò ní òbí, kò sì ní òpin ní ti ara rẹ̀.
  rationale: ἀφωμοιωμένος sọ pé a mú un dà bí Ọmọ náà, kì í ṣe pé òun ni Ọmọ náà. Àlàyé Gẹnẹsisi tí kò sọ ìran, ìbí, tàbí ikú rẹ̀ ń ṣiṣẹ́ gẹ́gẹ́ bí àpẹẹrẹ, ṣùgbọ́n a kò yọ ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ náà kúrò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìṣètò mẹ́ta—baba, ìyá, ìtàn ìran—àti ìfiwéra gíga ti ẹsẹ náà mọ́. Àmì ohùn ni a lò níbi tí ó bá yẹ.
