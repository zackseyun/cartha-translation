  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: yo
  text: 'Nítorí a jẹ́rìí pé: “Ìwọ ni àlùfáà títí láé, gẹ́gẹ́ bí ìlànà Melkisedeki.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìtumọ̀ ìbílẹ̀, “lẹ́yìn ìlànà Melkisedeki.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí wá láti Sáàmù 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: a jẹ́rìí
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣe aláìlẹ́ni-tí-a-dárúkọ ní ìṣe àìṣe, ó sì ń fi ẹ̀rí Ìwé Mímọ́ hàn. ‘A jẹ́rìí’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ náà mọ́ láì sọ ẹni tó ń jẹ́rìí ní pàtó.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìdí tàbí ẹ̀rí ìtìlẹ́yìn.
- source_word: ὅτι
  choice: pé,
  rationale: Ó ń ṣí ọ̀rọ̀ ẹ̀rí tààrà sílẹ̀; ‘pé’ pẹ̀lú àmì kọ́mà jẹ́ àdánidá ní Yorùbá.
- source_word: Σὺ
  choice: Ìwọ
  rationale: Arọ́pò-orúkọ ẹni kejì ẹyọ kan ni, tí a tẹnumọ́ nínú orísun.
- source_word: ἱερεὺς
  choice: àlùfáà
  rationale: Ó ń sọ ipò iṣẹ́ ẹni tí a ń bá sọ̀rọ̀; a kò fi ‘àlùfáà àgbà’ kún un nítorí orísun sọ ‘àlùfáà’ nìkan.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Gbólóhùn Yorùbá yìí sọ ìwà pípẹ́ láìní òpin ní kedere, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: κατὰ τὴν τάξιν
  choice: gẹ́gẹ́ bí ìlànà
  rationale: Ó tọ́ka sí ìbámu pẹ̀lú ètò, irú, tàbí àpẹẹrẹ kan. ‘Gẹ́gẹ́ bí ìlànà’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa ààyè ìtumọ̀ orísun mọ́.
- source_word: Μελχισέδεκ
  choice: Melikisedeki
  rationale: A kọ orúkọ ẹni náà ní ìrísí tí ó wọ́pọ̀, tí ó sì rọrùn fún olùkà Yorùbá láti pè.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè àlùfáà nínú àyọlò Sáàmù láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tó wá lẹ́yìn kún un
  choice: “Ìwọ ni àlùfáà títí láé, gẹ́gẹ́ bí ìlànà Melikisedeki.”
  alternative: “Ìwọ ni olórí àlùfáà títí láé …”
  rationale: Ọ̀rọ̀ Gíríìkì ní ẹsẹ yìí ni ‘àlùfáà,’ kì í ṣe ‘olórí àlùfáà.’ Bó tilẹ̀ jẹ́ pé Hébérù ń ṣàlàyé Jésù gẹ́gẹ́ bí Olórí Àlùfáà, fífi ‘olórí’ kún ẹsẹ yìí yóò ré kọjá ohun tí orísun sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún àwọn olùkà òde òní. A lo ‘a jẹ́rìí’ gẹ́gẹ́ bí ọ̀nà àdánidá fún passive aláìlẹ́ni-tí-a-dárúkọ; a sì pa gbogbo àmì àlàyé [a], [b] mọ́ nínú ọ̀rọ̀ pàtàkì.
