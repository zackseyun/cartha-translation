- from: ẹni tí ó di àlùfáà, kì í ṣe ní ìbámu pẹ̀lú òfin àṣẹ ti ara[a], ṣùgbọ́n ní ìbámu pẹ̀lú agbára ìyè tí a kò lè parun[b][c].
  to: Ẹni tí ó di àlùfáà kò di bẹ́ẹ̀ ní ìbámu pẹ̀lú òfin àṣẹ ti ara[a][c], ṣùgbọ́n ní ìbámu pẹ̀lú agbára ìyè tí a kò lè parun[b].
  rationale: The revision changes the negative verbal construction to a completed-event formulation that matches the Greek perfect and reads naturally in Yoruba. It retains the contextual clarification “àlùfáà,” the non-moral bodily sense of σαρκίνης, and the full sense of ἀκαταλύτου. Footnote anchors and alternatives are adjusted to attach each note to the phrase it actually explains.
