id: HEB.7.16
reference: Hebrews 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: yo
  text: Ẹni tí ó di àlùfáà kò di bẹ́ẹ̀ ní ìbámu pẹ̀lú òfin àṣẹ ti ara[a][c], ṣùgbọ́n ní ìbámu pẹ̀lú agbára ìyè tí a kò lè parun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òfin ìlànà ti ara” tàbí “òfin àṣẹ ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìyè tí kò ní òpin.” Èyí ni ìtumọ̀ tí ọ̀pọ̀ ìtumọ̀ ìbílẹ̀ máa ń lò.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “òfin kan tó jẹ́ àṣẹ ti ara.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan yìí ń tọ́ka sí ẹni tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa rẹ̀, ó sì pa ìsopọ̀ gbolohun náà mọ́.
- source_word: κατὰ νόμον
  choice: ní ìbámu pẹ̀lú òfin
  rationale: κατά pẹ̀lú ọ̀rọ̀-orúkọ nínú accusative ń fi ìlànà tàbí ìpìlẹ̀ hàn; ‘òfin’ láìsí ‘Òfin Mósè’ kò fi ohun tí Gíríìkì kò sọ kún un.
- source_word: ἐντολῆς σαρκίνης
  choice: àṣẹ ti ara
  rationale: ‘Ti ara’ pa ìtọ́kasí sí ẹran ara, ìran, àti ohun ti ara mọ́ láìfi ìtumọ̀ ìwà ẹ̀ṣẹ̀ sí i. ‘Àṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἐντολή.
- source_word: γέγονεν
  choice: ó di àlùfáà
  rationale: Perfect náà ń tọ́ka sí ipò tó wà nísinsin yìí nítorí ohun tó ti ṣẹlẹ̀. ‘Àlùfáà’ jẹ́ àfikún tí àyíká ọ̀rọ̀ béèrè, ó sì mú gbolohun náà dára ní Yorùbá.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: ṣùgbọ́n ní ìbámu pẹ̀lú agbára
  rationale: Èyí pa ìfiwé-òdì tó wà láàárín àwọn gbólóhùn κατὰ méjèèjì mọ́.
- source_word: ζωῆς ἀκαταλύτου
  choice: ìyè tí a kò lè parun
  rationale: Àpèjúwe yìí fi hàn pé ìyè náà kò ṣeé tú ká, kò sì ṣeé pa run; ó ju fífi iye ọdún tí ó pé títí láé hàn nìkan lọ.
theological_decisions:
- issue: Ìtumọ̀ σαρκίνης ní ìyàtọ̀ sí ἀκαταλύτου
  choice: ti ara
  alternative: ti ẹran ara; ti ara-ìbí; ti ara lásán
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìlànà tó ní í ṣe pẹ̀lú ara àti ìran ènìyàn, kì í ṣe pé àṣẹ náà jẹ́ ẹlẹ́ṣẹ̀. Ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn tí ẹsẹ náà kò sọ kún un.
- issue: Ìtumọ̀ ἀκαταλύτου
  choice: tí a kò lè parun
  alternative: tí kò ní òpin
  rationale: Ìtumọ̀ àkọ́kọ́ pa èrò pé ìyè náà kò ṣeé tú ká tàbí pa run mọ́; àṣàyàn kejì tẹnu mọ́ bí ó ṣe ń bá a lọ láìní òpin.
- issue: Ohun tí γέγονεν ń tọ́ka sí
  choice: ó di àlùfáà
  alternative: ó di irú ẹni bẹ́ẹ̀
  rationale: Orúkọ iṣẹ́ náà kò sí nínú ẹsẹ yìí ní tààràtà, ṣùgbọ́n àyíká ẹsẹ 15 sí 17 fi àlùfáà hàn. A sọ ọ́ gbangba kí Yorùbá lè jẹ́ àdánidá, láìyí ìtumọ̀ padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn náà pa ìfiwé-òdì láàárín ìlànà ti ara àti agbára ìyè tí kò ṣeé parun mọ́.
