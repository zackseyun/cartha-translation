  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: yo
  text: Ó sì túbọ̀ hàn gbangba pé, bí àlùfáà mìíràn[a] bá dìde ní ìbámu pẹ̀lú ìjọra Mẹlikisẹdẹki[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àlùfáà kan tí ó yàtọ̀”; ọ̀rọ̀ Gíríìkì ἕτερος lè tẹ ìyàtọ̀ mọ́lẹ̀, kì í ṣe kìkì pé ẹlòmíràn tún wà.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “ní ìbámu pẹ̀lú ìjọra Mẹlikisẹdẹki,” ń ṣe àtúnsọ ọ̀rọ̀ àti àríyànjiyàn tí a fà yọ láti inú Sáàmù 110:4 nínú orí yìí.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: tún … sí i
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń mú ìtẹnumọ́ tí ó wà nínú àríyànjiyàn náà lágbára sí i; èdè Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ ‘àní jù bẹ́ẹ̀ lọ’ mọ́.
- source_word: κατάδηλόν
  choice: hàn kedere
  rationale: Ó túmọ̀ sí ohun tí ó ṣe kedere tàbí tí ó farahàn gbangba. ‘Hàn kedere’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò tún fi ìtẹnumọ́ àfikún sí ohun tí περισσότερον ἔτι ti sọ.
- source_word: εἰ
  choice: bí … bá
  rationale: Èyí pa ìrísí gbólóhùn onípo ti Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé nínú àríyànjiyàn náà ó lè sún mọ́ ìtumọ̀ ‘níwọ̀n bí’.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: ní ìbámu pẹ̀lú ìjọra
  rationale: Ó fi hàn pé àlùfáà náà bá àpẹẹrẹ tàbí ìjọra Mẹlikisẹdẹki mu, láìsọ pé àwọn méjèèjì jẹ́ ọ̀kan náà.
- source_word: Μελχισέδεκ
  choice: Mẹlikisẹdẹki
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà kíkọ orúkọ ní Yorùbá.
- source_word: ἀνίσταται
  choice: dìde
  rationale: ‘Dìde’ pa àwòrán ọ̀rọ̀-ìṣe náà mọ́, ó sì lè tọ́ka sí dídé àlùfáà kan sí ipò yìí láìfi dandan túmọ̀ rẹ̀ sí àjíǹde.
- source_word: ἱερεὺς ἕτερος
  choice: àlùfáà mìíràn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó rọrùn láti sọ pé àlùfáà òmíràn dìde; àlàyé ìsàlẹ̀ fi àṣàyàn tí ń tẹ ìyàtọ̀ rẹ̀ mọ́lẹ̀ hàn.
theological_decisions:
- issue: Ìtumọ̀ ἕτερος ní ìbáṣepọ̀ pẹ̀lú ipò àlùfáà
  choice: àlùfáà mìíràn
  alternative: àlùfáà kan tí ó yàtọ̀
  rationale: ‘Àlùfáà mìíràn’ jẹ́ èdè àdánidá, ó sì pa ààyè sílẹ̀ fún ἕτερος láti túmọ̀ sí ẹlòmíràn tàbí ẹni tí ó yàtọ̀ sí ti tẹ́lẹ̀. Àlàyé ìsàlẹ̀ ni ó tọ́ka sí ìtẹnumọ́ ìyàtọ̀ láìfipá yan ìtumọ̀ náà nínú ẹsẹ̀ pàtàkì.
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tí ó ní ọ̀wọ̀, tí ó sì ṣeé lóye. ‘Ó … hàn kedere’ pa ìrísí gbólóhùn aláìdárúkọ ti Gíríìkì mọ́; ‘bí … bá’ sì pa ipò àìdánilójú inú εἰ mọ́. A fi àmì ohùn sí ibi tí ó bá èdè Yorùbá àdánidá mu.
