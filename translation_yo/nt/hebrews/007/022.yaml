id: HEB.7.22
reference: Hebrews 7:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: yo
  text: Ní ìwọ̀n bẹ́ẹ̀ ni Jésù ti di onídùúró fún májẹ̀mú[a] tí ó sàn jù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní àwọn àyíká ọ̀rọ̀ kan, “ìwé ogún.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n “májẹ̀mú” ló bá àríyànjiyàn níbí nípa oyè àlùfáà àti ìbúra mu jù.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Ní ìwọ̀n tó tó bẹ́ẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìwọ̀n tàbí bí ohun kan ṣe pọ̀ tó hàn, ó sì so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú nípa bí oyè àlùfáà Jésù ṣe sàn jù.
- source_word: κρείττονος
  choice: tí ó sàn jù
  rationale: Èyí pa agbára ìfiwéra ọ̀rọ̀ Gíríìkì mọ́, ó sì bá àkòrí ohun tí ó ‘sàn jù’ tí ó ń tún fara hàn nínú Hébérù mu.
- source_word: διαθήκης
  choice: májẹ̀mú
  rationale: Ní àyíká ọ̀rọ̀ nípa oyè àlùfáà àti ìbúra yìí, ‘májẹ̀mú’ bá ètò ìbáṣepọ̀ tí Ọlọ́run fi ìdí rẹ̀ múlẹ̀ mu ju ‘ìwé ogún’ lọ.
- source_word: γέγονεν
  choice: ti di
  rationale: Ìṣe àsìkò pípé náà tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ipò rẹ̀ sì ń bá a lọ; ‘ti di’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἔγγυος
  choice: onídùúró
  rationale: ‘Onídùúró’ túmọ̀ sí ẹni tí ó fi ara rẹ̀ dúró gẹ́gẹ́ bí ìdánilójú pé ojúṣe tàbí àdéhùn kan yóò dúró ṣinṣin.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí a sábà ń gbà kọ orúkọ náà ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú Hébérù 7:22
  choice: májẹ̀mú
  alternative: ìwé ogún
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ìwé ogún’ ní àwọn àyíká ọ̀rọ̀ kan, àríyànjiyàn níbí dá lórí oyè àlùfáà Jésù àti ìbúra Ọlọ́run; nítorí náà, ‘májẹ̀mú’ ló bá ọ̀rọ̀ ibí mu jù.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè tó ní iyì ṣùgbọ́n tó ṣeé lóye. ‘Onídùúró’ jẹ́ ọ̀rọ̀ kúkúrú tó pa èrò ẹni tí ó dúró gẹ́gẹ́ bí ìdánilójú mọ́.
