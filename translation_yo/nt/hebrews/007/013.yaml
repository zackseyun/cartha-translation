reference: Hebrews 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: yo
  text: Nítorí ẹni tí a ń sọ àwọn nǹkan wọ̀nyí nípa rẹ̀ ti jẹ́ ọmọ ẹ̀yà mìíràn[a]; láti inú ẹ̀yà náà, kò sí ẹni kankan tí ó ti ṣe iṣẹ́ níbi pẹpẹ rí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti ní ìpín nínú ẹ̀yà mìíràn,” tàbí “ti inú ẹ̀yà mìíràn wá.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí ìkópa tàbí ìbáṣepọ̀; níbí, ó ń tọ́ka sí jíjẹ́ ọmọ ẹ̀yà kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó ti dúró sí iṣẹ́ níbi pẹpẹ rí.” Gbólóhùn náà ń tọ́ka sí wíwà tàbí iṣẹ́ àlùfáà tí ó ní í ṣe pẹ̀lú pẹpẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: nípa rẹ̀
  rationale: Pẹ̀lú λέγεται ταῦτα, ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí àwọn ohun tí a sọ kan; ‘nípa rẹ̀’ jẹ́ Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó mú ìdí àlàyé fún ọ̀rọ̀ tó ṣáájú wọlé, ó sì pa ìṣàn àríyànjiyàn náà mọ́.
- source_word: λέγεται ταῦτα
  choice: a ń sọ àwọn nǹkan wọ̀nyí
  rationale: Èyí pa ohùn àìṣe àti ọ̀pọ̀ ταῦτα mọ́ ní Yorùbá tó ṣe é lóye.
- source_word: φυλῆς ἑτέρας
  choice: ẹ̀yà mìíràn
  rationale: Nínú àyíká yìí, φυλή túmọ̀ sí ọ̀kan lára àwọn ẹ̀yà Ísírẹ́lì; ἑτέρας fi hàn pé ó yàtọ̀ sí ẹ̀yà àlùfáà tí a ń jíròrò.
- source_word: μετέσχηκεν
  choice: ti jẹ́ ti
  rationale: Perfect tense náà ń fi ìbáṣepọ̀ ẹ̀yà tó dúró dé àkókò àríyànjiyàn hàn. ‘Ti jẹ́ ti’ sọ jíjẹ́ ọmọ ẹ̀yà náà ní kedere láì sọ ọ́ di ìran tàbí ìsọ̀kalẹ̀ ní pàtó.
- source_word: ἀφ’ ἧς
  choice: láti inú rẹ̀
  rationale: Ó padà tọ́ka sí ẹ̀yà náà, ó sì sọ orísun ẹgbẹ́ tí a mẹ́nu kàn ní Yorùbá àdánidá.
- source_word: οὐδεὶς
  choice: ẹnikẹ́ni ... kò
  rationale: Àkópọ̀ yìí ni ọ̀nà Yorùbá àdánidá láti sọ ‘kò sí ẹnì kan.’
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: kò tíì ṣe iṣẹ́ níbi pẹpẹ
  rationale: Nínú àyíká ìrúbọ, προσέχω ń tọ́ka sí ṣíṣe iṣẹ́ tàbí wíwà lẹ́gbẹ̀ẹ́ pẹpẹ fún iṣẹ́ àlùfáà; ìtumọ̀ yìí ṣe kedere láì ṣàlàyé irú iṣẹ́ náà ju ohun tí Gíríìkì sọ lọ.
- source_word: θυσιαστηρίῳ
  choice: pẹpẹ
  rationale: ‘Pẹpẹ’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi ìrúbọ nínú àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú ẹ̀yà tí kì í ṣe ti Léfì nínú àríyànjiyàn nípa iṣẹ́ àlùfáà
  choice: A túmọ̀ μετέσχηκεν gẹ́gẹ́ bí jíjẹ́ ti ẹ̀yà mìíràn, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: ‘ti inú ẹ̀yà mìíràn wá’ tàbí ‘jẹ́ àtọmọdọ́mọ ẹ̀yà mìíràn’
  rationale: Ẹsẹ náà ṣe ìtìlẹ́yìn fún àríyànjiyàn pé iṣẹ́ àlùfáà Jésù kò wá láti ìlà Léfì, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ìkópa tàbí jíjẹ́ ti ẹ̀yà mìíràn, kò sì sọ ìran tàbí ìsọ̀kalẹ̀ ní tààrà.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘àwọn nǹkan wọ̀nyí’ láti pa ọ̀pọ̀ ταῦτα mọ́, àti ‘ṣe iṣẹ́ níbi pẹpẹ’ fún ìtumọ̀ ìsìn ti προσέχω.
