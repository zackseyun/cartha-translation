id: HEB.7.25
reference: Hebrews 7:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: yo
  text: Nítorí náà, ó sì lè gba àwọn tí ń sún mọ́ Ọlọ́run nípasẹ̀ rẹ̀ là pátápátá[a], nítorí ó wà láàyè nígbà gbogbo láti máa bẹ̀bẹ̀ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba là títí láé”; ní ìtumọ̀ ìbílẹ̀, “gba là dé òpin jùlọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí èrò tí ó jáde láti inú àlàyé ṣáájú nípa oyè àlùfáà Jesu tí ó dúró títí.
- source_word: καὶ
  choice: ó sì
  rationale: ‘Sì’ pa agbára àfikún καί mọ́, ó sì so àbájáde yìí pọ̀ mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: σῴζειν
  choice: gba ... là
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìgbàlà; ó bá ìtumọ̀ ẹ̀kọ́ ìgbàlà nínú àyíká ọ̀rọ̀ náà mu.
- source_word: εἰς τὸ παντελές
  choice: pátápátá
  rationale: Ó mú ìtumọ̀ ìgbàlà tó pé àti tó kún rẹ́rẹ́ wá síwájú láìfi ìtumọ̀ ti àkókò nìkan lé gbólóhùn náà lórí; àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘títí láé’ mọ́.
- source_word: δύναται
  choice: lè
  rationale: Ó sọ agbára tàbí àǹfààní rẹ̀ láti ṣe ohun náà ní Yorùbá tó ṣe kedere, tó sì jẹ́ ti òde òní.
- source_word: τοὺς προσερχομένους
  choice: àwọn tí ń sún mọ́
  rationale: ‘Sún mọ́’ pa àwòrán ti wíwọlé sí iwájú Ọlọ́run àti ìbáṣepọ̀ pẹ̀lú rẹ̀ mọ́, èyí tí ó ṣe pàtàkì nínú Hébérù.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ó fi ipa Jesu gẹ́gẹ́ bí alárinà hàn ní kedere.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Pẹ̀lú ‘sún mọ́,’ èyí fún wa ní gbólóhùn Yorùbá àdánidá ‘sún mọ́ Ọlọ́run.’
- source_word: πάντοτε ζῶν
  choice: nítorí ó wà láàyè nígbà gbogbo
  rationale: ‘Nítorí’ mú ìbáṣepọ̀ ìdí tí participle náà ní hàn, ‘nígbà gbogbo’ sì pa ìtẹ̀síwájú ìyè rẹ̀ mọ́.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: láti máa bẹ̀bẹ̀
  rationale: Ó fi ète ìyè rẹ̀ tí ń bá a lọ hàn; ‘máa’ tún sọ pé ìṣe náà ń tẹ̀síwájú.
- source_word: ὑπὲρ αὐτῶν
  choice: fún wọn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ ìṣe tí a ṣe nítorí àǹfààní wọn àti ní ipò wọn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ εἰς τὸ παντελές
  choice: A túmọ̀ rẹ̀ sí ‘pátápátá’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘títí láé’ tàbí ‘dé òpin pátápátá’
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ìgbàlà tó pé pátápátá tàbí tó dúró fún gbogbo ìgbà. Àyíká ọ̀rọ̀ náà, pàápàá ìyè rẹ̀ tí kò lópin, lè gbé méjèèjì rù; nítorí náà, ọ̀rọ̀ pàtàkì yan ìtumọ̀ ìpé, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ti àkókò mọ́.
translation_notes:
  register: Yorùbá boṣewa, olóhùn ọ̀wọ̀ àti ti òde òní. A lo ‘sún mọ́ Ọlọ́run’ láti pa èdè pàtàkì Hébérù nípa wíwọlé sí iwájú Ọlọ́run mọ́; ‘máa bẹ̀bẹ̀’ jẹ́ èdè tó yé àwọn òǹkàwé lasán, láìdi ọ̀rọ̀ náà mọ́ èdè ẹ̀sìn àtijọ́.
