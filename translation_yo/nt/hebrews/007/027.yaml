id: HEB.7.27
reference: Hebrews 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: yo
  text: ẹni tí kò nílò láti máa rú ẹbọ lọ́jọ́ dé ọjọ́[a], bí àwọn olórí àlùfáà, lákọ̀ọ́kọ́ fún ẹ̀ṣẹ̀ ara rẹ̀, lẹ́yìn náà fún ti àwọn ènìyàn[b]; nítorí ó ṣe èyí lẹ́ẹ̀kan ṣoṣo fún gbogbo ìgbà[c], nígbà tí ó fi ara rẹ̀ rú ẹbọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ọjọ́ kọ̀ọ̀kan.” Àṣà-ọrọ Gíríìkì náà túmọ̀ sí ohun tí a ń ṣe lọ́jọ́ dé ọjọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “fún ẹ̀ṣẹ̀ àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì fi “ẹ̀ṣẹ̀” sílẹ̀ láìtún un sọ, ṣùgbọ́n a lóye rẹ̀ láti inú gbólóhùn tó ṣáájú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “lẹ́ẹ̀kan ṣoṣo.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “nípa fífi ara rẹ̀ rú ẹbọ” tàbí “lẹ́yìn tí ó fi ara rẹ̀ rú ẹbọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: lọ́jọ́ dé ọjọ́
  rationale: Ó sọ ìṣe tí a ń tún ṣe ní ọjọ́ kọ̀ọ̀kan; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ‘day after day.’
- source_word: ἀνάγκην
  choice: nílò
  rationale: Nínú ìhun ἔχει ἀνάγκην, ‘nílò’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu ju gbólóhùn tó túmọ̀ sí ‘ní dandan’ lọ.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: bí àwọn olórí àlùfáà
  rationale: Ó pa ìfiwéra àti ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́, ó sì lo orúkọ oyè tí àwọn òǹkàwé Yorùbá mọ̀.
- source_word: πρότερον ... ἔπειτα
  choice: lákọ̀ọ́kọ́ ... lẹ́yìn náà
  rationale: Ó fi bí àwọn ẹbọ náà ṣe tẹ̀ lé ara wọn hàn ní kedere.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: fún ẹ̀ṣẹ̀ ara rẹ̀
  rationale: ‘Fún’ mú ìtumọ̀ ὑπέρ nínú ọ̀rọ̀ ẹbọ jáde, ‘ara rẹ̀’ sì tẹnumọ́ pé ẹ̀ṣẹ̀ tirẹ̀ ni.
- source_word: θυσίας ἀναφέρειν
  choice: láti máa rú ẹbọ
  rationale: ‘Rú ẹbọ’ ni gbólóhùn Yorùbá àdánidá fún fífi ẹbọ rú; ‘máa’ bá ìṣe tí a ń ṣe lọ́jọ́ dé ọjọ́ mu.
- source_word: τῶν τοῦ λαοῦ
  choice: fún ti àwọn ènìyàn
  rationale: 'Ó pa àṣọnu-ọ̀rọ̀ inú Gíríìkì mọ́: ‘ẹ̀ṣẹ̀’ ni a lóye láti inú gbólóhùn tó ṣáájú, láìṣe àìyedè ní Yorùbá.'
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: nítorí ó ṣe èyí
  rationale: ‘Èyí’ pa ìtọ́kasí τοῦτο mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: ἐφάπαξ
  choice: lẹ́ẹ̀kan ṣoṣo láéláé
  rationale: Ó sọ pé ìrúbọ náà ṣẹlẹ̀ ní ẹ̀ẹ̀kan ṣoṣo, ó sì jẹ́ ohun tó pé tí kò nílò àtúnṣe.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: nígbà tí ó fi ara rẹ̀ rú ẹbọ
  rationale: Ó mú ipa àkókò ti aorist participle jáde, ó sì pa èdè ìrúbọ nínú ἀναφέρω mọ́.
theological_decisions:
- issue: Ohun tí ‘èyí’ (τοῦτο) ń tọ́ka sí
  choice: A fi ‘ó ṣe èyí’ sílẹ̀ gẹ́gẹ́ bí ìtọ́kasí sí iṣẹ́ ìrúbọ pàtàkì tí a ṣẹ̀ṣẹ̀ sọ, láìsọ pé Jesu rú ẹbọ fún ẹ̀ṣẹ̀ ara rẹ̀.
  alternative: Kí ‘èyí’ tọ́ka sí ìrúbọ fún ẹ̀ṣẹ̀ àwọn ènìyàn nìkan, tàbí sí gbogbo iṣẹ́ àlùfáà rẹ̀ lápapọ̀.
  rationale: Ọ̀rọ̀ tó yí ẹsẹ yìí ká fi Jesu tí kò lẹ́ṣẹ̀ wé àwọn olórí àlùfáà mìíràn. Ìtumọ̀ náà pa ìtọ́kasí Gíríìkì mọ́ láìfi ẹ̀ṣẹ̀ kàn án tàbí dín ààyè ìtọ́kasí náà kù ju bí orísun ṣe ṣe lọ.
- issue: Ìrúbọ ara Kristi
  choice: fi ara rẹ̀ rú ẹbọ
  alternative: fi ara rẹ̀ fúnni
  rationale: Hebrews ń fi Jesu hàn gẹ́gẹ́ bí àlùfáà àti ẹbọ; ‘rú ẹbọ’ pa agbára ọ̀rọ̀ ìsìn àti ìrúbọ inú ἀνενέγκας mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní iyì tó yẹ fún ọ̀rọ̀ mímọ́, ṣùgbọ́n ó lo gbólóhùn òde òní tí òǹkàwé lásán lè lóye. ‘Olórí àlùfáà’ àti ‘rú ẹbọ’ pa àyíká iṣẹ́ àlùfáà mọ́ láìdi èdè àtijọ́ tàbí èdè ẹ̀kọ́ gíga.
