source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: yo
  text: Nítorí ó ṣì wà ní ìbàdí baba rẹ̀ nígbà tí Melkisedeki pàdé e.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ọ̀nà àlàyé pé, “ó ṣì wà nínú ara baba ńlá rẹ̀.” Gíríìkì sọ ní tààrà pé, “ní ìbàdí baba rẹ̀”; ọ̀nà ìsọ̀rọ̀ kan ni fún ìran ẹni láti ọ̀dọ̀ baba ńlá rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ṣì
  rationale: Ó fi hàn pé ipò yẹn ṣì ń bá a lọ ní àkókò ìpàdé náà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé inú ẹsẹ tó ṣáájú.
- source_word: ἐν τῇ ὀσφύϊ
  choice: ní ẹ̀gbẹ́
  rationale: Ó pa àwòrán ara tí Gíríìkì lò mọ́; ní ọ̀rọ̀ yìí, ó ń tọ́ka sí ìran tí yóò ti ọ̀dọ̀ baba ńlá jáde.
- source_word: τοῦ πατρὸς
  choice: baba rẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì, láì fi orúkọ Ábúráhámù kún un bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi ẹni náà hàn.
- source_word: ἦν
  choice: ó ... wà
  rationale: Ìtumọ̀ tààrà àti àdánidá fún imperfect ti ‘láti wà.’
- source_word: ὅτε
  choice: nígbà tí
  rationale: Àsopọ̀ àkókò tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: συνήντησεν
  choice: pàdé
  rationale: Ó túmọ̀ sí pé ẹni kan bá ẹlòmíràn pàdé; ọ̀rọ̀ yìí bá ìtọ́kasí sí Jẹ́nẹ́sísì mu.
- source_word: αὐτῷ
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ mọ́ gẹ́gẹ́ bí ó ti wà ní Gíríìkì; ó ń tọ́ka sí Ábúráhámù.
- source_word: Μελχισέδεκ
  choice: Melikisedeki
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń sọ ọ́ ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa ṣàfihàn pé Lefi ti inú ìran Ábúráhámù wá
  choice: Pa àwòrán ara mọ́ pẹ̀lú ‘ní ẹ̀gbẹ́ baba rẹ̀’
  alternative: ó ṣì wà nínú ara baba ńlá rẹ̀
  rationale: Àwòrán náà jẹ́ kí ìlànà ìjiyàn onkọ̀wé hàn pé Lefi wà nínú Ábúráhámù nípa ìran, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ náà.
- issue: Ta ni ‘baba rẹ̀’ ń tọ́ka sí?
  choice: baba rẹ̀
  alternative: baba ńlá rẹ̀ Ábúráhámù
  rationale: Gíríìkì sọ ‘baba rẹ̀’; àyíká ọ̀rọ̀ ló fi hàn pé Ábúráhámù ni, nítorí náà a kò fi orúkọ tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ̀gbẹ́’ pa àwòrán Gíríìkì mọ́, nígbà tí àlàyé ìtumọ̀ rẹ̀ wà nínú àlàyé ìsàlẹ̀.
