id: HEB.7.6
reference: Hebrews 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí a kò tọpasẹ̀ ìran rẹ̀ láti ọ̀dọ̀ wọn ti gba ìdámẹ́wàá lọ́wọ́ Ábúráhámù[a], ó sì ti súre fún ẹni tí ó ní àwọn ìlérí náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti gba ìdámẹ́wàá lọ́wọ́ Ábúráhámù.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbigba ìdámẹ́wàá kan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹni tí ó ní àwọn ìlérí náà.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀-ìṣe tí ó túmọ̀ sí “ní”; àyíká náà sì tọ́ka sí àwọn ìlérí tí Ọlọ́run ti fún Ábúráhámù.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Ṣùgbọ́n ẹni tí a kò tọpasẹ̀ ìran rẹ̀ láti ọ̀dọ̀ wọn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí Mẹlikisédékì gẹ́gẹ́ bí ẹni tí a kò fi ìtàn ìran rẹ̀ mọ́ ìlà ìdílé àwọn ọmọ Léfì. “Tọpasẹ̀ ìran” mú ìtumọ̀ ìforúkọsílẹ̀ tàbí ìjẹ́rìí ìran jáde láì sọ pé kò ní ìran rárá.
- source_word: δεδεκάτωκεν
  choice: ti gba ìdámẹ́wàá lọ́wọ́
  rationale: “Ti gba” fi ìṣe tí ó ti ṣẹlẹ̀, tí ó sì ṣe pàtàkì sí àríyànjiyàn òǹkọ̀wé hàn. “Ìdámẹ́wàá” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tí Ábúráhámù fi fún un.
- source_word: Ἀβραάμ
  choice: Ábúráhámù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: ẹni tí ó ní àwọn ìlérí náà
  rationale: Èyí pa àkókò ìṣe aláìparí tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì pa ọ̀pọ̀ “àwọn ìlérí” mọ́. Nínú àyíká ìtàn, ó ń tọ́ka sí Ábúráhámù.
- source_word: εὐλόγηκεν
  choice: ó sì ti súre fún
  rationale: “Ti súre fún” fi ìṣe tí ó ti ṣẹlẹ̀ àti ìjẹ́pàtàkì rẹ̀ tí ó ń bá a lọ nínú àríyànjiyàn Hébérù hàn.
theological_decisions:
- issue: Ìyàtọ̀ nípa ìran láàárín Mẹlikisédékì àti oyè àlùfáà Léfì
  choice: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí àìsí Mẹlikisédékì nínú ìlà ìran àwọn ọmọ Léfì.
  alternative: A lè túmọ̀ ọ́ ní ṣókí pé “ẹni tí kì í ṣe àtọmọdọ́mọ wọn.”
  rationale: Àríyànjiyàn àyíká ẹsẹ náà dá lórí ẹ̀tọ́ oyè àlùfáà tí kò sinmi lórí ìran Léfì. Ìtumọ̀ yìí kò fi èrò àfikún kankan sí irú ẹ̀dá tàbí ìpilẹ̀ṣẹ̀ Mẹlikisédékì.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó lè dá ìtumọ̀ dúró sí ẹ̀sìn kan ṣoṣo.
