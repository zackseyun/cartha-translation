id: HEB.7.11
reference: Hebrews 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: yo
  text: Nítorí náà, bí ìjẹ́pípé bá wà nípasẹ̀ iṣẹ́ àlùfáà ti àwọn ọmọ Lefi—nítorí pé lórí ìpìlẹ̀ rẹ̀ ni a ti fi Òfin fún àwọn ènìyàn—kí ni ìdí mìíràn tí ó fi yẹ kí àlùfáà mìíràn dìde gẹ́gẹ́ bí ìlànà Melkisedeki, kí a má sì pè é gẹ́gẹ́ bí ìlànà Aaroni?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “nítorí pé lábẹ́ rẹ̀ ni a ti fi Òfin fún àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ “lórí ìpìlẹ̀ rẹ̀”; ìtumọ̀ náà ni pé a fi Òfin fún àwọn ènìyàn ní ìsopọ̀ pẹ̀lú, tàbí lórí ìpìlẹ̀, ètò iṣẹ́ àlùfáà ti àwọn ọmọ Lefi.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “kí àlùfáà mìíràn dìde nínú ìlànà Melkisedeki, kí a má sì pè é nínú ìlànà Aaroni.”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: ìpé
  rationale: “Ìpé” pa agbára ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí dídé sí ipò tí a pinnu, láì dín in kù sí ìwà pípé nìkan tàbí láì ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ̀ náà sọ.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: nípasẹ̀ iṣẹ́ àlùfáà ti àwọn ọmọ Lefi
  rationale: “Nípasẹ̀” fi διά pẹ̀lú genitive hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; “iṣẹ́ àlùfáà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ètò priesthood.
- source_word: ἐπ’ αὐτῆς
  choice: lórí ìpìlẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí iṣẹ́ àlùfáà ti àwọn ọmọ Lefi; yíyan yìí fi ìbáṣepọ̀ ìpìlẹ̀ hàn ní Yorùbá tó ṣe kedere.
- source_word: νενομοθέτηται
  choice: ti gba Òfin
  rationale: Ó sọ ipò tí ó ti wáyé nítorí fífi òfin fún àwọn ènìyàn. “Ti gba Òfin” jẹ́ àdánidá ju ìtumọ̀ líle bí “a ti ṣe òfin fún wọn” lọ.
- source_word: τίς ἔτι χρεία
  choice: kí tún ni ìdí ... fi ní láti
  rationale: Ìṣọ̀rọ̀ yìí mú ìbéèrè alágbára nípa àìní tàbí dandan jáde ní Yorùbá àdánidá.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: gẹ́gẹ́ bí ìlànà Melkisedeki
  rationale: “Ìlànà” lè tọ́ka sí irú, ètò, tàbí ọ̀nà ìyàn sí ipò, ó sì pa àìmọ́ tó yẹ nínú τάξις mọ́.
- source_word: ἕτερον ... ἱερέα
  choice: àlùfáà mìíràn
  rationale: Ìyàtọ̀ rẹ̀ sí ti Aaroni hàn gbangba nínú apá tó tẹ̀ lé, nítorí náà “mìíràn” tó àti pé ó jẹ́ Yorùbá àdánidá.
- source_word: ἀνίστασθαι
  choice: láti dìde
  rationale: Ó pa àwòrán dídìde tàbí ìfarahàn àlùfáà tuntun mọ́ láì fi dandan sọ pé àjíǹde ni.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: tí a kò sì sọ pé ó jẹ́ gẹ́gẹ́ bí ìlànà Aaroni
  rationale: Yíyan yìí pa ìtumọ̀ bí a ṣe ń pè, ṣàpèjúwe, tàbí pín àlùfáà náà sí ẹ̀ka kan mọ́, láì mú un di orúkọ lásán.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melkisedeki / Aaroni
  rationale: Àwọn orúkọ náà ni a kọ ní ìrísí tí ó wọ́pọ̀, tí ó sì rọrùn fún olùkà Yorùbá láti pè.
theological_decisions:
- issue: Ìtumọ̀ τελείωσις nínú àríyànjiyàn nípa iṣẹ́ àlùfáà
  choice: ìpé
  alternative: ìparí; mímú dé ipò pípé; àǹfààní kíkún láti sún mọ́ Ọlọ́run
  rationale: “Ìpé” jẹ́ kí agbára ẹ̀sìn àti ti iṣẹ́ ìsìn ọ̀rọ̀ náà dúró, ó sì jẹ́ kí àyíká ìwé Heberu ṣàlàyé rẹ̀ dípò kí ìtumọ̀ túmọ̀ ọ́ sí ẹ̀kọ́ kan pàtó.
- issue: Ohun tí αὐτῆς tọ́ka sí nínú ἐπ’ αὐτῆς νενομοθέτηται
  choice: iṣẹ́ àlùfáà ti àwọn ọmọ Lefi
  alternative: Òfin; gbogbo ètò májẹ̀mú náà
  rationale: Orúkọ akọ-abo tó sún mọ́ ọn jù tí ó bá gírámà mu ni ἱερωσύνης, ìyẹn iṣẹ́ àlùfáà; gbólóhùn àárín náà sì ṣàlàyé ìbáṣepọ̀ Òfin àti iṣẹ́ àlùfáà.
- issue: Agbára καὶ οὐ ... λέγεσθαι
  choice: bí a ṣe ń sọ tàbí ṣe àpèjúwe àlùfáà náà gẹ́gẹ́ bí ìlànà kan
  alternative: bí a ṣe ń pè é ní orúkọ; bí a ṣe yàn án sí ẹ̀ka kan
  rationale: Ìtumọ̀ náà pa ìyàtọ̀ láàárín ìlànà Melkisedeki àti ti Aaroni mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kun un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò. A fi àmì ohùn síbi tí ó bá bá ìkọ̀wé Yorùbá àdánidá mu. Gbólóhùn náà pa ìbéèrè àríyànjiyàn orísun mọ́, ó sì lo àkámọ́ láti ya àlàyé àárín sọ́tọ̀.
