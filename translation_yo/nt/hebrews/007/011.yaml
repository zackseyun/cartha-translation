  source_fidelity: Ìtumọ̀ náà gba ìṣètò àríyànjiyàn, iṣẹ́ àlùfáà àwọn ọmọ Lefi, àti ìyàtọ̀ láàárín ìlànà Melkisedeki àti Aaroni mọ́. Ṣùgbọ́n “ìpé” sábà ń túmọ̀ sí ìpè/calling ní Yorùbá òde òní, kì í sì jẹ́ ìtumọ̀ tó dáa fún τελείωσις níbí. Ìbéèrè náà tún yẹ kí ó sọ ‘àìní’ tàbí ‘ìdí mìíràn’ dáradára, kì í ṣe àpẹẹrẹ ìṣeeṣe ‘bí a bá lè rí’.
  naturalness: Àtúnṣe náà lo Yorùbá boṣewa tó rọrùn, ó sì mú ìfararora àwọn ọ̀rọ̀-ìṣe méjèèjì—‘dìde’ àti ‘pè é’—bá ara wọn mu. “Kí a má sì pè é gẹ́gẹ́ bí ìlànà Aaroni” jẹ́ adayeba, ó sì sún mọ́ λέγεσθαι ju “a kò sọ pé ó jẹ́” lọ.
  terminology: “Ìjẹ́pípé” ni a lò fún τελείωσις láti má ṣe dárúkọ ọ̀rọ̀ náà gẹ́gẹ́ bí ìpè ẹni. “Iṣẹ́ àlùfáà,” “Òfin,” “ìlànà,” Melkisedeki, àti Aaroni yẹ kí a pa mọ́.
