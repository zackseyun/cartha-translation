id: HEB.7.2
reference: Hebrews 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: yo
  text: Ẹni tí Ábúráhámù pín ìdámẹ́wàá nínú ohun gbogbo fún[a]. Lákọ̀ọ́kọ́, ìtumọ̀ orúkọ rẹ̀ ni “Ọba Òdodo”[b]; lẹ́yìn náà, òun tún jẹ́ “Ọba Sálẹ́mù,” èyí ni, “Ọba Àlàáfíà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdámẹ́wàá kan.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ìpín kan nínú mẹ́wàá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ọba Ìdájọ́ Òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: ẹni tí ... fún
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà ń tọ́ka sí Mẹlikisẹ́dẹ́kì; ìṣètò ‘ẹni tí ... fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí Ábúráhámù fún ní ìdámẹ́wàá.
- source_word: δεκάτην
  choice: ìdámẹ́wàá
  rationale: Ó túmọ̀ ní tààrà sí ìpín kan nínú mẹ́wàá; ‘ìdámẹ́wàá’ ṣe kedere, ó sì yẹ fún Yorùbá òde òní.
- source_word: ἀπὸ πάντων
  choice: ohun gbogbo
  rationale: Ó fi hàn pé ìdámẹ́wàá náà wá lára gbogbo ohun tí Ábúráhámù ní ní àyíká ọ̀rọ̀ yìí, láìfi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐμέρισεν
  choice: pín ... fún
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ pípín tàbí yíyan ìpín kan sọ́tọ̀; ‘pín ... fún’ pa ìmọ̀ yẹn mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: πρῶτον μὲν
  choice: Lákọ̀ọ́kọ́
  rationale: Ó bẹ̀rẹ̀ apá àkọ́kọ́ nínú àlàyé onípele méjì.
- source_word: ἑρμηνευόμενος
  choice: ìtumọ̀ orúkọ rẹ̀ ni
  rationale: Nínú àyíká yìí, participle náà ń ṣàlàyé ìtumọ̀ orúkọ Mẹlikisẹ́dẹ́kì; fífi ‘orúkọ rẹ̀’ hàn mú Yorùbá ṣe kedere láìyí ìtumọ̀ padà.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Ọba Òdodo
  rationale: ‘Òdodo’ ni ọ̀rọ̀ Yorùbá àdánidá fún δικαιοσύνη nínú àkọlé yìí, ó sì lè gba ìmọ̀ ìwà títọ́ àti ìdájọ́ òdodo.
- source_word: ἔπειτα δὲ καὶ
  choice: lẹ́yìn náà, òun tún jẹ́
  rationale: Ó pa ìtẹ̀lé àti èrò ‘pẹ̀lú/tún’ inú Gíríìkì mọ́ ní Yorùbá tó ṣàn dáadáa.
- source_word: βασιλεὺς Σαλήμ
  choice: Ọba Sálẹ́mù
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi Σαλήμ gẹ́gẹ́ bí ‘Sálẹ́mù,’ a sì pa àkọlé ‘Ọba’ mọ́.
- source_word: ὅ ἐστιν
  choice: èyíinì ni
  rationale: Gbólóhùn yìí ń ṣàgbékalẹ̀ àlàyé ìtumọ̀ Sálẹ́mù ní ọ̀nà Yorùbá tó bójú mu.
- source_word: βασιλεὺς εἰρήνης
  choice: Ọba Àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì níyì fún εἰρήνη nínú àkọlé yìí.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àlàyé orúkọ/àkọlé
  choice: Òdodo
  alternative: Ìdájọ́ òdodo
  rationale: ‘Òdodo’ pa ìtumọ̀ gbooro ti righteousness mọ́, ó sì yẹ sí àkọlé ‘Ọba Òdodo.’ Nítorí δικαιοσύνη tún lè tẹnumọ́ justice, a pa ‘Ìdájọ́ òdodo’ mọ́ nínú àlàyé ìsàlẹ̀ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá; èdè náà níyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo fọ́ọ̀mù orúkọ Bíbélì ‘Ábúráhámù’ àti ‘Sálẹ́mù,’ a sì fi àwọn àkọlé sínú àmì àsọyé láti mú àlàyé orúkọ hàn gbangba.
