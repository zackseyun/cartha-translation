revisions:
- from: Nítorí òfin kò mú ohunkóhun dé ìpé[a], ṣùgbọ́n a mú ìrètí tí ó sàn jù wọlé[b], nípasẹ̀ èyí tí àwa fi ń sún mọ́ Ọlọ́run.
  to: Nítorí òfin kò sọ ohunkóhun di pípé[a], ṣùgbọ́n a mú ìrètí tí ó sàn jù wọlé[b], nípasẹ̀ èyí ni a fi ń sún mọ́ Ọlọ́run.
  rationale: The revision replaces an unclear expression for perfection with the natural and source-faithful “sọ ohunkóhun di pípé.” It also slightly smooths the final relative/instrumental clause. The Greek’s elliptical nominal contrast is still represented naturally by the agent-unspecified Yorùbá passive-style construction “a mú ... wọlé,” without adding a named agent or a sectarian interpretation.
