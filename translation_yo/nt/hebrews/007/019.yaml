id: HEB.7.19
reference: Hebrews 7:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: yo
  text: Nítorí òfin kò sọ ohunkóhun di pípé[a], ṣùgbọ́n a mú ìrètí tí ó sàn jù wọlé[b], nípasẹ̀ èyí ni a fi ń sún mọ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí: ‘òfin kò mú ohunkóhun dé ìparí.’ Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘mú dé ìparí’ tàbí ‘mú dé ibi-afẹ́ rẹ̀.’'
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààràtà: ‘ìmúwọlé ìrètí tí ó sàn jù.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: ohunkóhun
  rationale: Ó jẹ́ ohun tí ọ̀rọ̀-ìṣe ἐτελείωσεν ń ṣe sí, ó sì pa ìkọ̀sílẹ̀ pátápátá inú Gíríìkì mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ἐτελείωσεν
  choice: mú ... dé ìpé
  rationale: Ó fi èrò mímú ohun kan dé ibi-afẹ́ tàbí sí ìparí pípé hàn, ó sì pa ìtumọ̀ pàtàkì τελειόω nínú Hébérù mọ́ láì sọ pé òfin kò ṣe ohun rere kankan rárá.
- source_word: ὁ νόμος
  choice: òfin
  rationale: Nínú àyíká ọ̀rọ̀, ó tọ́ka sí Òfin Mósè àti ètò àlùfáà rẹ̀; ọ̀rọ̀ Yorùbá yìí ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: ἐπεισαγωγὴ
  choice: a mú ... wọlé
  rationale: Ìtumọ̀ rẹ̀ ni mímú ohun kan wọlé tàbí ṣíṣe àfikún rẹ̀. Ìkọ́lé yìí jẹ́ ti ẹ̀dá Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀-orúkọ nínú gbólóhùn tí a gé kúrú.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ láàárín àìlera òfin àti ìrètí tí ó sàn jù hàn.
- source_word: κρείττονος ἐλπίδος
  choice: ìrètí tí ó sàn jù
  rationale: Ó pa àfiwé pàtàkì κρείττων mọ́, ọ̀rọ̀ tí a tún máa ń lò léraléra nínú Hébérù.
- source_word: δι’ ἧς
  choice: nípasẹ̀ èyí
  rationale: Èyí tọ́ka padà sí ìrètí, ó sì fi hàn pé ìrètí náà ni ọ̀nà tí a fi ń sún mọ́ Ọlọ́run.
- source_word: ἐγγίζομεν
  choice: àwa fi ń sún mọ́
  rationale: Ó pa àwòrán sísún mọ́ Ọlọ́run àti ìtumọ̀ nípa níní àyè láti wọ iwájú rẹ̀ mọ́.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Ó jẹ́ ẹni tí a ń sún mọ́; ìkọ́lé ‘sún mọ́ Ọlọ́run’ jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ τελειόω nípa ohun tí òfin lè ṣe
  choice: Òfin kò mú ohunkóhun dé ipò tàbí ibi-afẹ́ pípé tí a pinnu.
  alternative: Òfin kò ṣe ohunkóhun rárá; tàbí òfin kàn kò mú iṣẹ́ àlùfáà dàgbà.
  rationale: ‘Mú ... dé ìpé’ pa ìsopọ̀ pẹ̀lú ìparí pípé, ìmúṣẹ, àti àyè láti sún mọ́ Ọlọ́run nínú Hébérù mọ́, láìsọ pé òfin kò ní ète tàbí àǹfààní kankan.
- issue: Ìyàtọ̀ onígbólóhùn tí kò pé lẹ́yìn ọ̀rọ̀ nípa òfin
  choice: A tú un sí Yorùbá gẹ́gẹ́ bí ‘ṣùgbọ́n a mú ìrètí tí ó sàn jù wọlé.’
  alternative: ‘Ṣùgbọ́n ìmúwọlé ìrètí tí ó sàn jù wà’; tàbí ‘ṣùgbọ́n ìrètí tí ó sàn jù ni a mú wọlé.’
  rationale: Gíríìkì lo gbólóhùn ọ̀rọ̀-orúkọ tí a gé kúrú. Yorùbá nílò ọ̀rọ̀-ìṣe kí ó lè yéni dáadáa; lílo ‘a mú ... wọlé’ kò pinnu ẹni tí ó ṣe iṣẹ́ náà, bẹ́ẹ̀ ni kò fi àkókò kan tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún òǹkàwé òde òní. ‘Mú ... dé ìpé’ àti ‘sún mọ́ Ọlọ́run’ pa àwọn àwòrán àti ìjàmbá ìtumọ̀ pàtàkì inú Hébérù mọ́.
