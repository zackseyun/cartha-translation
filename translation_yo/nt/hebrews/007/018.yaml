  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: yo
  text: Nítorí lóòótọ́, a ń fi àṣẹ tí ó ṣáájú sí ẹ̀gbẹ́ kan[a], nítorí àìlágbára àti àìwúlò rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àṣẹ tí ó wà tẹ́lẹ̀,” tàbí “àṣẹ tí ó lọ ṣáájú.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, kò lágbára láti mú ìjẹ́pípé tí a ń sọ̀rọ̀ nípa rẹ̀ nínú àyíká ọ̀rọ̀ yìí wá (wo Heberu 7:19); kì í ṣe pé ìṣípayá Ọlọ́run tí ó ṣáájú burú nínú ara rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: fi ... sí ẹ̀gbẹ́ kan
  rationale: Ó fi ìtumọ̀ ìfagilé tàbí mímú ohun kan kúrò ní ipò agbára rẹ̀ hàn ní èdè Yorùbá àdánidá, láìlo ọ̀rọ̀ òfin tó le jù.
- source_word: μὲν γὰρ
  choice: Nítorí lóòótọ́
  rationale: “Nítorí” mú ìdí tí γάρ ń tọ́ka sí jáde, “lóòótọ́” sì pa ìtẹnumọ́ μέν mọ́, nígbà tí ìyàtọ̀ tí yóò tẹ̀ lé wà ní ẹsẹ tó kàn.
- source_word: γίνεται
  choice: a ń
  rationale: Ìsọ̀rọ̀ aláìdárúkọ yìí sọ pé ìfi-sílẹ̀ náà ń ṣẹlẹ̀; lílo “a ń” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe náà láìdárúkọ olùṣe.
- source_word: προαγούσης ἐντολῆς
  choice: àṣẹ tí ó ṣáájú
  rationale: Ó tẹ̀ lé ìtumọ̀ participle náà, ‘tí ó lọ ṣáájú’ tàbí ‘tí ó wà tẹ́lẹ̀,’ ó sì yẹra fún fífi àlàyé àlùfáà sínú ọ̀rọ̀ náà ní tààràtà.
- source_word: ἀσθενές
  choice: àìlágbára
  rationale: Ó pa àwòrán àìní agbára tàbí àìní okun láti mú ète náà ṣẹ mọ́.
- source_word: ἀνωφελές
  choice: àìwúlò
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ohun tí kò lè ṣe àǹfààní; àlàyé ìsàlẹ̀ ṣókí dí ààlà rẹ̀ mọ́ sí àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìwọ̀n àríwísí tí a ṣe sí àṣẹ tí ó ṣáájú
  choice: Pa ọ̀rọ̀ líle náà mọ́ gẹ́gẹ́ bí ‘àìlágbára àti àìwúlò,’ ṣùgbọ́n ṣàlàyé pé ó dá lórí àìlè mú ìpé tí àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa rẹ̀ wá.
  alternative: Kí a sọ pé gbogbo Òfin Mósè kò níye lórí rárá, tàbí kí a rọ ọ̀rọ̀ náà débi pé àríwísí gidi kò ní sí mọ́.
  rationale: Heberu 7:11, 19 so ọ̀rọ̀ náà mọ́ ètò àlùfáà àti àìlè mú ìpé wá. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tó wà nínú ọ̀rọ̀ mọ́, láìsọ pé ìṣípayá Ọlọ́run àtijọ́ burú nínú ara rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “fi ... sí ẹ̀gbẹ́ kan” fún ìtumọ̀ òfin ἀθέτησις, a sì pa àwọn ọ̀rọ̀ líle ‘àìlágbára’ àti ‘àìwúlò’ mọ́. Gbogbo àmì ohùn àti àmì ìsàlẹ̀ lẹ́tà ni a fi síbi tí ó bá yẹ.
