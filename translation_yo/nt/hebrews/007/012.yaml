id: HEB.7.12
reference: Hebrews 7:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: yo
  text: Nítorí, nígbà tí iṣẹ́ àlùfáà bá yí padà, ìyípadà òfin[a] pẹ̀lú gbọdọ̀ wáyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “Òfin náà,” ní ìtọ́kasí pàtó sí Òfin Mósè tí ó fi iṣẹ́ àlùfáà àwọn ọmọ Lefi kalẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: bá yí padà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí yíyí ètò kan padà sí òmíràn. Àkójọpọ̀ ‘nígbà tí ... bá’ mú agbára genitive absolute náà jáde ní Yorùbá, láì sọ pé ìgbà nìkan tàbí ìdí nìkan ni.
- source_word: ἱερωσύνης
  choice: iṣẹ́ àlùfáà
  rationale: Ó ń tọ́ka sí ipò àti ètò iṣẹ́ àwọn àlùfáà, kì í ṣe ìṣe àlùfáà kan ṣoṣo. ‘Iṣẹ́ àlùfáà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu fún ọ̀rọ̀ nípa ètò Lefi àti ti Melikisédékì.
- source_word: ἐξ ἀνάγκης
  choice: ó pọndandan
  rationale: Ó fi hàn pé ìyípadà kejì jẹ́ dandan gẹ́gẹ́ bí àbájáde ọgbọ́n inú ọ̀rọ̀ náà.
- source_word: νόμου
  choice: nínú òfin
  rationale: '‘Òfin’ láì fi hàn gbangba pé ó ní definite article pa ààyè ìtumọ̀ Gíríìkì mọ́: ó lè jẹ́ ètò òfin tó ń darí iṣẹ́ àlùfáà, ṣùgbọ́n àyíká tún ń tọ́ka sí Òfin Mósè.'
- source_word: μετάθεσις
  choice: ìyípadà
  rationale: Ó bá ọ̀rọ̀-ìṣe μετατιθεμένης mu, ó sì sọ ìyípadà tó bá ìyípadà iṣẹ́ àlùfáà rìn ní kedere, láì mú un le ju bí Gíríìkì ṣe sọ lọ.
- source_word: γίνεται
  choice: kí ... wà
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìyípadà náà ń ṣẹlẹ̀ tàbí ń bẹ gẹ́gẹ́ bí àbájáde tó pọndandan.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi ìyípadà òfin kún ìyípadà iṣẹ́ àlùfáà gẹ́gẹ́ bí ohun tó bá a rìn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ àlùfáà
  choice: ‘òfin’ nínú àkọ́kọ́ ọ̀rọ̀, kí ó lè túmọ̀ sí ètò òfin tó ń darí iṣẹ́ àlùfáà, tí ó sì tún lè ní Òfin Mósè nínú gẹ́gẹ́ bí àyíká ṣe fi hàn
  alternative: ‘Òfin náà,’ tó ń tọ́ka ní pàtó sí Òfin Mósè
  rationale: Nínú Gíríìkì, νόμου kò ní article. Àyíká fi Òfin Mósè hàn, ṣùgbọ́n fífi ‘náà’ sínú àkọ́kọ́ ọ̀rọ̀ lè dín ààyè ìtumọ̀ rẹ̀ kù ju ohun tí fọ́ọ̀mù Gíríìkì fúnra rẹ̀ béèrè lọ.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, àti òde òní ni a lò. Gbólóhùn ‘nígbà tí ... bá’ pa ìbáṣepọ̀ ìgbà àti ìdí tó wà nínú genitive absolute mọ́, ‘ó pọndandan’ sì pa ìrísí àríyànjiyàn onígbọ́n inú Hébérù mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó kan.
