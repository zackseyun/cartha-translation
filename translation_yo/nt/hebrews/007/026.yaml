id: HEB.7.26
reference: Hebrews 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: yo
  text: 'Nítorí irú olórí àlùfáà bẹ́ẹ̀ ni ó yẹ fún wa ní tòótọ́: ẹni mímọ́, aláìlẹ́bi, aláìní àbàwọ́n, ẹni tí a yà sọ́tọ̀ kúrò láàárín àwọn ẹlẹ́ṣẹ̀,[a] tí ó sì ti di ẹni gíga ju àwọn ọ̀run lọ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, ó yàtọ̀ sí àwọn ẹlẹ́ṣẹ̀. Gbólóhùn náà tẹnumọ́ ìwà mímọ́ rẹ̀ àti ipò rẹ̀ tí a gbé ga gẹ́gẹ́ bí olórí àlùfáà; kò túmọ̀ sí pé kò bá àwọn ẹlẹ́ṣẹ̀ kẹ́gbẹ́ nígbà tó wà láyé.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “tí a gbé ga ré kọjá àwọn ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: irú ... bẹ́ẹ̀
  rationale: Ó tọ́ka padà sí irú olórí àlùfáà tí a ṣàpèjúwe ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ demonstrative yìí ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé mọ́ pẹ̀lú àríyànjiyàn tó ṣáájú.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: ni ó yẹ fún wa ní tòótọ́
  rationale: “Ó yẹ fún wa” fi ìbámu rẹ̀ fún àwọn onígbàgbọ́ hàn; “ní tòótọ́” mú agbára καί jáde ní èdè Yorùbá àdánidá.
- source_word: ἀρχιερεύς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò àlùfáà gíga nínú ọ̀rọ̀ Hébérù.
- source_word: ὅσιος
  choice: ẹni mímọ́
  rationale: Ó ṣàfihàn ìwà mímọ́ àti ìyẹ fún iṣẹ́ àlùfáà ní àyíká ọ̀rọ̀ yìí.
- source_word: ἄκακος
  choice: aláìlẹ́bi
  rationale: Ó fi àìsí ibi àti ẹ̀bi ìwà hàn, láìsọ ọ́ di kìkì ẹni tí kò léwu.
- source_word: ἀμίαντος
  choice: aláìní àbàwọ́n
  rationale: Ó pa àwòrán ìwẹ̀mọ́ àti àìbàjẹ́ mọ́, pẹ̀lú ìtumọ̀ tó ṣeé lóye fún òǹkàwé òde òní.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: ẹni tí a yà sọ́tọ̀ kúrò láàárín àwọn ẹlẹ́ṣẹ̀
  rationale: Ó fi ipò ìyapa tí participle perfect náà sọ hàn, láìdáhùn tán bóyá ìyapa náà jẹ́ ti ìwà, ti ipò, tàbí ti ààyè.
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: ẹni gíga ju àwọn ọ̀run lọ
  rationale: Ó tẹ̀lé comparative Gíríìkì ní tààrà, dípò fífi “gbé ga” kún un gẹ́gẹ́ bí ìtumọ̀ ṣàlàyé.
- source_word: γενόμενος
  choice: tí ó sì ti di
  rationale: Ó fi ìyípadà sí ipò àbájáde hàn láì sọ ẹni tó mú un ṣẹ tàbí fi passive kún ọ̀rọ̀ orísun.
theological_decisions:
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú àwọn ẹlẹ́ṣẹ̀ nínú “κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν”
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí “ẹni tí a yà sọ́tọ̀ kúrò láàárín àwọn ẹlẹ́ṣẹ̀,” tí ó lè tọ́ka sí ìwà mímọ́ àti ipò rẹ̀ tí a gbé ga.
  alternative: Kí a ka á sí ìyapa ti ààyè nìkan, tàbí sí ìyapa lẹ́yìn ìgòkè re ọ̀run nìkan.
  rationale: Àwọn àpèjúwe tó yí ọ̀rọ̀ náà ká tẹnumọ́ ìwẹ̀mọ́ àti ìyẹ rẹ̀ gẹ́gẹ́ bí olórí àlùfáà. Ìtumọ̀ náà kò tako bí ó ṣe bá àwọn ẹlẹ́ṣẹ̀ kẹ́gbẹ́ nígbà iṣẹ́ rẹ̀ lórí ayé, kò sì fi ìtumọ̀ kan ṣoṣo lé gbolohun náà lórí.
- issue: Agbára γενόμενος pẹ̀lú “ὑψηλότερος τῶν οὐρανῶν”
  choice: “tí ó sì ti di ẹni gíga ju àwọn ọ̀run lọ”
  alternative: “ẹni tí a ti gbé ga ju àwọn ọ̀run lọ” tàbí “ẹni tí ó ga ju àwọn ọ̀run lọ.”
  rationale: Ọ̀rọ̀ yìí pa ìrìn sí ipò ògo àti àbájáde rẹ̀ mọ́, ṣùgbọ́n kò sọ pé ìwà Ọlọ́run rẹ̀ yí padà, bẹ́ẹ̀ ni kò fi passive tàbí aṣojú iṣẹ́ tí kò sí nínú participle náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Olórí àlùfáà” jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání fún ipò náà; àtòjọ àwọn àpèjúwe jẹ́ kúkúrú, ó sì pa ìró àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
