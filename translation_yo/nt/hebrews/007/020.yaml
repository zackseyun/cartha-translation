  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: yo
  text: Bákan náà, níwọ̀n bí kò ti ṣe láìsí ìbúra (nítorí àwọn wọ̀nyẹn di àlùfáà láìsí ìbúra,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìní ìbúra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Àti
  rationale: A fi àsopọ̀ náà hàn gbangba láti so ọ̀rọ̀ yìí mọ́ ìjiyàn tí ó ṣáájú.
- source_word: καθ’ ὅσον
  choice: níwọ̀n bí
  rationale: Ó mú ìtumọ̀ ìdí tàbí ìwọ̀n tí gbólóhùn náà fi ń tẹ̀ síwájú jáde, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: kò ... láìsí ìbúra
  rationale: Ó pa ìtakora líle inú ọ̀rọ̀ Gíríìkì mọ́, ó sì túmọ̀ χωρίς pẹ̀lú ọ̀rọ̀ orúkọ ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ὁρκωμοσίας
  choice: ìbúra
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí fífi ọ̀rọ̀ múlẹ̀ nípasẹ̀ ìbúra; ‘ìbúra’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye ní àyíká yìí.
- source_word: οἱ μὲν γὰρ
  choice: nítorí àwọn wọ̀nyẹn
  rationale: ‘Nítorí’ mú ipa àlàyé γάρ jáde; ‘àwọn wọ̀nyẹn’ tọ́ka sí àwọn àlùfáà àkọ́kọ́, nígbà tí ìfiwéra μέν ń dúró de apá kejì ní ẹsẹ tó tẹ̀ lé.
- source_word: χωρὶς ὁρκωμοσίας
  choice: láìsí ìbúra
  rationale: A túmọ̀ àtúnlò gbólóhùn náà ní ọ̀nà kan náà nínú ẹsẹ yìí.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: di àlùfáà
  rationale: Ó sọ ìwọlé wọn sínú ipò àlùfáà ní ṣókí àti ní èdè Yorùbá àdánidá, bí ìṣètò εἰμί pẹ̀lú γεγονότες ṣe ń tọ́ka sí abajade ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀.
theological_decisions:
- issue: Ẹni tí ìfiwéra àwọn àlùfáà àkọ́kọ́ àti àlùfáà tí a fi ìbúra múlẹ̀ ń tọ́ka sí
  choice: A fi ẹsẹ náà sílẹ̀ gẹ́gẹ́ bí ìfiwéra àwọn àlùfáà tẹ́lẹ̀, tí wọ́n di àlùfáà láìsí ìbúra, pẹ̀lú iṣẹ́ àlùfáà Jésù tí a fi ìbúra múlẹ̀.
  alternative: Kí a sọ ọ́ di ìfiwéra gbòòrò láàárín gbogbo iṣẹ́ àlùfáà májẹ̀mú àtijọ́ àti iṣẹ́ àlùfáà ayérayé ti Mèsáyà.
  rationale: Àyíká Hébérù 7 àti Sáàmù 110:4 ló fi Jésù hàn gẹ́gẹ́ bí ẹni tí a fi ìbúra múlẹ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò yẹ kí a fẹ̀ sí i ju ìyàtọ̀ nípa ìbúra tí ó sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi “èyí ... ṣẹlẹ̀” kún un láti mú àfojúsùn gbólóhùn Gíríìkì tó gé kúrú yé ní Yorùbá, láìpinnu ohun tó kọjá àyíká rẹ̀. A pa àmì àkámọ́ ṣí sílẹ̀ nítorí ẹsẹ náà ń bá a lọ sínú ẹsẹ 21.
