source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: yo
  text: 'Ẹ ronú nípa bí ọkùnrin yìí ti tóbi tó: Ábúráhámù, baba ńlá náà, fún un ní ìdámẹ́wàá[a] nínú ohun ìkógun[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó túmọ̀ ní tààrà sí “apá kan nínú mẹ́wàá.” A tún lè pè é ní “ẹ̀ẹ́wàá.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí a kó ní ogun; ó ṣeé ṣe kí ó tún tọ́ka sí apá tó dára jù lọ nínú ohun ìkógun.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Ẹ wo
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn láti kíyè sí ohun kan kí wọ́n sì ronú jinlẹ̀ nípa rẹ̀. “Ẹ wo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè rú èrò yìí jáde nínú àyíká yìí.
- source_word: δὲ
  choice: Kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Ó ń ṣe ìyípadà pẹ̀lẹ́ nínú ìsọ̀rọ̀, kì í ṣe ìtakora líle. Ìṣàn gbólóhùn Yorùbá ti fi ìyípadà náà hàn láìfi ọ̀rọ̀ àfikún bí “ní báyìí” sí i.
- source_word: πηλίκος
  choice: bí ... ti tóbi tó
  rationale: Ó tọ́ka sí bí ẹni náà ti tóbi tàbí ṣe pàtàkì tó, láìpinnu ní pàtó irú ọlá tàbí títóbi tí a ní lọ́kàn.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí Melikisedeki nínú ọ̀rọ̀ tó ṣáájú. “Ọkùnrin yìí” jẹ́ àdánidá, ó sì pa ìtọ́kasí akọ ẹyọ náà mọ́.
- source_word: ᾧ
  choice: fún un
  rationale: Àpólà Yorùbá yìí sọ ẹni tí Ábúráhámù fún ní nǹkan, ó sì jẹ́ ọ̀nà àdánidá láti túmọ̀ ìṣe dative relative pronoun náà.
- source_word: δεκάτην
  choice: ìdámẹ́wàá
  rationale: Ó túmọ̀ ní tààrà sí apá kan nínú mẹ́wàá. “Ìdámẹ́wàá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, bí ó tilẹ̀ jẹ́ pé ó tún lè jẹ́ ọ̀rọ̀ ẹ̀sìn tí a mọ̀.
- source_word: Ἀβραὰμ
  choice: Ábúráhámù
  rationale: Èyí ni àkọtọ̀ orúkọ náà tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: ἔδωκεν
  choice: fún un ní
  rationale: Ó mú ìtumọ̀ ìṣe náà, “fún,” jáde ní Yorùbá àdánidá.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: lára àwọn ohun ìkógun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí a kó ní ogun; ó tún lè ní èrò ohun tó dára jù lọ nínú ìkógun, ṣùgbọ́n èyí kò dájú tó láti fi sí ẹsẹ̀ pàtàkì.
- source_word: ὁ πατριάρχης
  choice: baba ńlá náà
  rationale: Ó tẹnu mọ́ ipò Ábúráhámù gẹ́gẹ́ bí baba ìran. “Baba ńlá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá.
theological_decisions:
- issue: Ẹni tí ẹsẹ̀ náà ń tọ́ka sí àti bí ó ṣe ń fi títóbi rẹ̀ hàn
  choice: Ẹsẹ̀ náà fi títóbi Melikisedeki hàn nípa sísọ pé Ábúráhámù, baba ńlá náà, tilẹ̀ fún un ní ìdámẹ́wàá.
  alternative: A lè sọ ọ́ ní ọ̀nà tí yóò tẹnu mọ́ gidigidi pé Melikisedeki ga ju Ábúráhámù lọ nítorí pé ó gba ìdámẹ́wàá lọ́wọ́ rẹ̀.
  rationale: Èdè Gíríìkì ń fi ìṣe Ábúráhámù ṣe àfihàn títóbi Melikisedeki, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi ìparí ẹ̀kọ́ ìgbàgbọ́ kan kún ohun tí ẹsẹ̀ yìí sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ó jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé lásán. Ọ̀rọ̀ “tilẹ̀” ń mú ìtẹnumọ́ tó wà nínú fífi Ábúráhámù, baba ńlá náà, ṣe àpẹẹrẹ jáde láìsọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ju ohun tí ẹsẹ̀ náà sọ lọ.
