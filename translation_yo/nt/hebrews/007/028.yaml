id: HEB.7.28
reference: Hebrews 7:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: yo
  text: Nítorí òfin ń yan àwọn ènìyàn tí wọ́n ní àìlera gẹ́gẹ́ bí olórí àlùfáà; ṣùgbọ́n ọ̀rọ̀ ìbúra náà, èyí tí ó wá lẹ́yìn òfin, yan Ọmọ[a] tí a ti sọ di pípé títí láéláé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ọmọ náà.” Nínú Gíríìkì, ọ̀rọ̀ náà kò ní ọ̀rọ̀ ìfihàn; èyí tẹnu mọ́ ìyàtọ̀ láàárín “àwọn ènìyàn” àti “Ọmọ,” bí ó tilẹ̀ jẹ́ pé Jésù ni àyíká náà ń tọ́ka sí.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “tí a ti mú dé ìpé títí láéláé.” Ọ̀rọ̀ náà tún lè ní ìtumọ̀ mímú dé òpin tí a pinnu tàbí, nínú àyíká iṣẹ́ àlùfáà, yíyan sípò fún iṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: Ó tọ́ka sí Òfin Mósè, ní pàtàkì àwọn ìlànà rẹ̀ nípa iṣẹ́ àlùfáà; ọ̀rọ̀ Yorùbá yìí ṣe kedere láìfi àlàyé kún un.
- source_word: καθίστησιν
  choice: ń yan … sípò
  rationale: Ó fi hàn pé a ń gbé ẹnì kan kalẹ̀ sínú ipò iṣẹ́ ní ọ̀nà àṣẹ, èyí tó bá ipò olórí àlùfáà mu.
- source_word: ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín àwọn olórí àlùfáà tí wọ́n jẹ́ ènìyàn àti Ọmọ mọ́; àyíká náà ti fi hàn pé àwọn ọkùnrin tó ń ṣiṣẹ́ gẹ́gẹ́ bí olórí àlùfáà ni a ń sọ̀rọ̀ nípa wọn.
- source_word: ἀρχιερεῖς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ipò àlùfáà gíga jù lọ; ‘àwọn ènìyàn’ ti jẹ́ kí ìtumọ̀ ọ̀pọ̀ hàn.
- source_word: ἔχοντας ἀσθένειαν
  choice: tí wọ́n ní àìlera
  rationale: Ó pa ọ̀rọ̀-orúkọ ‘àìlera’ mọ́, tí ó lè ní ìtumọ̀ àìlera ẹ̀dá ènìyàn àti fífi ara balẹ̀ fún ẹ̀ṣẹ̀, kì í ṣe àìsàn ara nìkan.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: ọ̀rọ̀ ìbúra náà
  rationale: Ó ṣàfihàn ọ̀rọ̀ tàbí ìkéde tí Ọlọ́run fi búra, ó sì pa ìforúkọsílẹ̀ Bíbélì mọ́.
- source_word: τῆς μετὰ τὸν νόμον
  choice: èyí tí ó wá lẹ́yìn òfin
  rationale: 'Ó sọ ìbátan àsìkò náà ní Yorùbá adayébá: ìbúra inú Sáàmù 110 wá lẹ́yìn fífúnni ní òfin.'
- source_word: υἱόν
  choice: Ọmọ
  rationale: Orúkọ náà kò ní article ní Gíríìkì. Yorùbá lè lo orúkọ láìsí ‘kan’ tàbí ‘náà,’ èyí tó pa ìtumọ̀ ànímọ́ àti ìyàtọ̀ pẹ̀lú ‘àwọn ènìyàn’ mọ́ láìdábàá pé ọ̀kan lára ọ̀pọ̀ ọmọ ni.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Èyí ni gbólóhùn Yorùbá adayébá fún ìwàláàyè tàbí ipò tí kò ní òpin nínú àyíká yìí.
- source_word: τετελειωμένον
  choice: tí a ti sọ di pípé
  rationale: Ó pa perfect passive participle mọ́, ó sì jẹ́ kí ìtumọ̀ mímú dé ìpé, ìmúrasílẹ̀ fún iṣẹ́ àlùfáà, àti pípé dúró láìfi ọ̀kan ṣoṣo dí ìtumọ̀ náà.
theological_decisions:
- issue: υἱόν tí kò ní article àti ìyàtọ̀ rẹ̀ sí ἀνθρώπους
  choice: Ọmọ
  alternative: Ọmọ náà; Ọmọ kan
  rationale: ‘Ọmọ’ tí a kọ pẹ̀lú lẹ́tà ńlá tọ́ka sí Jésù nínú àyíká Hébérù, ṣùgbọ́n fífi article Yorùbá sílẹ̀ jẹ́ kí ànímọ́ ọ̀rọ̀ Gíríìkì àti ìyàtọ̀ pẹ̀lú àwọn ènìyàn dúró. ‘Ọmọ kan’ lè dà bí ẹni pé ọ̀kan lára ọ̀pọ̀ ni, nítorí náà a kò lò ó nínú ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ τετελειωμένον nínú ẹ̀kọ́ iṣẹ́ àlùfáà Hébérù
  choice: tí a ti sọ di pípé títí láéláé
  alternative: tí a ti mú dé ìpé títí láéláé; tí a ti yà sí mímọ́ fún iṣẹ́ títí láéláé
  rationale: Ìtumọ̀ yìí pa èdè pípé/ìmú dé ìpé ti Hébérù mọ́, láìdín ọ̀rọ̀ náà kù sí ìyàsímímọ́ fún iṣẹ́ àlùfáà nìkan. Kò tún túmọ̀ sí pé Ọmọ ti ní ẹ̀ṣẹ̀ rí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo àkójọpọ̀ ‘àwọn ènìyàn … sípò olórí àlùfáà’ nítorí Yorùbá kò nílò kí ‘olórí àlùfáà’ gba àmì ọ̀pọ̀ lẹ́ẹ̀kejì; ìtumọ̀ ọ̀pọ̀ ti hàn nínú ‘àwọn ènìyàn.’
