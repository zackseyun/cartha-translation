  to: Nítorí òfin ń yan àwọn ènìyàn tí wọ́n ní àìlera gẹ́gẹ́ bí olórí àlùfáà; ṣùgbọ́n ọ̀rọ̀ ìbúra náà, èyí tí ó wá lẹ́yìn òfin, yan Ọmọ[a] tí a ti sọ di pípé títí láéláé.[b]
