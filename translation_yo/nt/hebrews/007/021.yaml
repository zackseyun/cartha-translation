id: HEB.7.21
reference: Hebrews 7:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: yo
  text: 'ṣùgbọ́n ẹni yìí di àlùfáà pẹ̀lú ìbúra nípasẹ̀ ẹni tí ó sọ fún un pé, “Olúwa ti búra[a], kò sì ní yí ọkàn rẹ̀ padà: ‘Ìwọ jẹ́ àlùfáà títí láéláé.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì sí i, “Olúwa búra, kò sì ní yí ọkàn rẹ̀ padà.” A lè tú aorist Gíríìkì Ὤμοσεν sí “búra” tàbí “ti búra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: ṣùgbọ́n ẹni yìí
  rationale: Ó pa ìyàtọ̀ tó wà láàárín àlùfáà yìí àti àwọn àlùfáà tí ẹsẹ tó ṣáájú mẹ́nu kàn mọ́, ó sì mú gbólóhùn Gíríìkì tó ṣe àkóbá yẹn yé ni Yorùbá.
- source_word: μετὰ ὁρκωμοσίας
  choice: pẹ̀lú ìbúra
  rationale: Ó fi hàn pé ìbúra bá fífi í jẹ àlùfáà lọ, ó sì pa ìfiwéra pẹ̀lú ẹsẹ 20 mọ́.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: nípasẹ̀ ẹni tí ó sọ fún un
  rationale: ‘Nípasẹ̀’ pa ipa διά pẹ̀lú ọ̀rọ̀-orúkọ oníṣe mọ́, nígbà tí gbólóhùn náà sì dúró bí Yorùbá àdánidá.
- source_word: Ὤμοσεν κύριος
  choice: Olúwa ti búra
  rationale: Àkókò aláṣepé Yorùbá fi ipa ìbúra tí ó ṣì dúró hàn; àlàyé ìsàlẹ̀ ojú ewé pa yíyan ‘Olúwa búra’ mọ́ gẹ́gẹ́ bí ìtumọ̀ aorist tó ṣeé ṣe.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún κύριος nínú àyọkà Gíríìkì, láìfi fọ́ọ̀mù orúkọ Hébérù kún un.
- source_word: οὐ μεταμεληθήσεται
  choice: kò sì ní yí ọkàn rẹ̀ padà
  rationale: Ó túmọ̀ sí pé Ọlọ́run kì yóò yí ohun tí ó ti pinnu padà; kò sọ ọ́ di ìrònúpìwàdà nípa ẹ̀ṣẹ̀.
- source_word: Σὺ ἱερεὺς
  choice: Ìwọ jẹ́ àlùfáà
  rationale: ‘Jẹ́’ ni Yorùbá àdánidá nílò láti sọ ipò ẹni tí a ń bá sọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò kọ ọ̀rọ̀-ìṣe náà sílẹ̀ ní tààrà.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti sọ ìwà títí ayérayé tí àpólà Gíríìkì yìí ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ àyọkà Sáàmù 110:4 nípa oyè àlùfáà ẹni yìí
  choice: A fi hàn pé ìbúra Olúwa ló fìdí oyè àlùfáà náà múlẹ̀ àti pé oyè náà wà títí láéláé.
  alternative: A lè tú Ὤμοσεν ní ọ̀nà tó tẹ̀ lé fọ́ọ̀mù aorist sí i pé, ‘Olúwa búra,’ dípò ‘Olúwa ti búra.’
  rationale: 'Èyí pa àríyànjiyàn Hébérù mọ́: àwọn àlùfáà àtijọ́ kò gba oyè pẹ̀lú ìbúra, ṣùgbọ́n oyè àlùfáà ẹni yìí dá lórí ìbúra Ọlọ́run, ó sì dúró títí láéláé. A kò fi ẹ̀kọ́ ìjọ kankan tí kò sí nínú ọ̀rọ̀ náà kún un.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Àlùfáà’ ni a lò fún ἱερεύς, ‘ìbúra’ fún ὁρκωμοσία, a sì lo àmì olójú méjì láti ṣí ọ̀rọ̀ ìbúra inú àyọkà náà.
