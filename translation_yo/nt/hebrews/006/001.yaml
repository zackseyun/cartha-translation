id: HEB.6.1
reference: Hebrews 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: yo
  text: Nítorí náà, bí a ti ń fi ẹ̀kọ́ ìbẹ̀rẹ̀ nípa Mèsáyà sílẹ̀[a], ẹ jẹ́ kí a tẹ̀ síwájú dé ìdàgbà pípé[b][c], láì tún fi ìpìlẹ̀ ìrònúpìwàdà kúrò nínú àwọn iṣẹ́ òkú àti ìgbàgbọ́ sí Ọlọ́run[d] lélẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ̀kọ́ àkọ́kọ́ nípa Mèsáyà” tàbí “ìhìn ìbẹ̀rẹ̀ nípa Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “dé ìpé” tàbí “dé ìkúnrẹ́rẹ́.”
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì ní ohùn passive ní tààràtà: “ẹ jẹ́ kí a jẹ́ ẹni tí a gbé lọ síwájú”; a tún lè sọ pé “ẹ jẹ́ kí a máa lọ síwájú.”'
    reason: lexical_alternative
  - marker: d
    text: Tàbí “ìgbàgbọ́ nínú Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a sọ ṣáájú; gbólóhùn náà jẹ́ ti Yorùbá àdánidá, ó sì ní iyì.
- source_word: ἀφέντες
  choice: bí a ti ń fi ... sílẹ̀
  rationale: Ó pa ìtumọ̀ participle náà mọ́ gẹ́gẹ́ bí kíkúrò níbi ẹ̀kọ́ ìpilẹ̀ṣẹ̀ láti tẹ̀ síwájú, kì í ṣe kíkọ ẹ̀kọ́ náà sílẹ̀ pátápátá.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: ẹ̀kọ́ ìpilẹ̀ṣẹ̀ nípa Mèsáyà
  rationale: “Ẹ̀kọ́” mú λόγος jáde ní àyíká ẹ̀kọ́ yìí; “ìpilẹ̀ṣẹ̀” sì tọ́ka sí ohun àkọ́kọ́ tàbí ìbẹ̀rẹ̀ ẹ̀kọ́ nípa Mèsáyà láì mú ìbáṣepọ̀ genitive náà le ju bó ṣe yẹ lọ.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn, nítorí náà “Mèsáyà” bá ẹ̀rí orísun mu.
- source_word: ἐπὶ τὴν τελειότητα
  choice: dé ìdàgbà pípé
  rationale: Ó sọ ìlọsíwájú sí ìdàgbà àti ìkúnrẹ́rẹ́ ní kedere, láì fi dandan túmọ̀ rẹ̀ sí àìní ẹ̀ṣẹ̀ pátápátá.
- source_word: φερώμεθα
  choice: ẹ jẹ́ kí a tẹ̀ síwájú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìṣírí subjunctive náà; àlàyé ìsàlẹ̀ fi ohùn passive inú Gíríìkì hàn nítorí pé fífi í sínú ọ̀rọ̀ pàtàkì lọ́nà gígùn kò ní jẹ́ Yorùbá àdánidá.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: fi lélẹ̀ gẹ́gẹ́ bí ìpìlẹ̀
  rationale: Ó pa àwòrán ilé-kíkọ́ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: ìrònúpìwàdà kúrò nínú àwọn iṣẹ́ òkú
  rationale: “Ìrònúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́ fún ìyípadà ọkàn àti ìdarípadà; “iṣẹ́ òkú” pa àwòrán àti àìdánilójú orísun mọ́.
- source_word: πίστεως ἐπὶ θεόν
  choice: ìgbàgbọ́ sí Ọlọ́run
  rationale: “Sí” pa ìtọ́sọ́nà ἐπί mọ́, nígbà tí gbólóhùn náà ṣì ṣeé lóye ní Yorùbá.
theological_decisions:
- issue: Ṣé fífi ẹ̀kọ́ ìpilẹ̀ṣẹ̀ nípa Mèsáyà sílẹ̀ túmọ̀ sí kíkọ ọ́ sílẹ̀ pátápátá?
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí kíkúrò lórí ẹ̀kọ́ àkọ́kọ́ gẹ́gẹ́ bí ibi tí a dúró, kí a lè tẹ̀ síwájú.
  alternative: Kíkọ ìhìn rere nípa Mèsáyà sílẹ̀ pátápátá.
  rationale: Ọ̀rọ̀ tó tẹ̀ lé e nípa àìtún ìpìlẹ̀ fi lélẹ̀ fi hàn pé ìlọsíwájú ni a ń sọ, kì í ṣe ìkọ̀sílẹ̀.
- issue: Ìtumọ̀ τελειότης gẹ́gẹ́ bí ìdàgbà tàbí ìpé pátápátá
  choice: ìdàgbà pípé
  alternative: ìpé tàbí àìlábùkù pátápátá
  rationale: Àyíká náà ń fi ẹ̀kọ́ ìpilẹ̀ṣẹ̀ wé ìdàgbà tó kúnrẹ́rẹ́; yíyan yìí kò fi ẹ̀kọ́ àìní ẹ̀ṣẹ̀ sínú ọ̀rọ̀ náà.
- issue: Ohùn passive nínú φερώμεθα
  choice: Ọ̀rọ̀ pàtàkì lo “ẹ jẹ́ kí a tẹ̀ síwájú,” àmọ́ àlàyé [c] pa passive orísun mọ́.
  alternative: “Ẹ jẹ́ kí a gbé wa lọ,” èyí tó sún mọ́ ọ̀rọ̀ Gíríìkì ṣùgbọ́n tí kò rọrùn ní Yorùbá.
  rationale: Èyí jẹ́ kí ọ̀rọ̀ náà ṣe kedere fún òǹkàwé Yorùbá, láì fi ìtumọ̀ passive náà pamọ́.
- issue: Ìtumọ̀ “àwọn iṣẹ́ òkú”
  choice: A pa àwòrán náà mọ́ láì ṣàlàyé bóyá iṣẹ́ tí kò ní èso ni tàbí iṣẹ́ tó ń yọrí sí ikú.
  alternative: “Àwọn iṣẹ́ tí kò ní èso” tàbí “àwọn iṣẹ́ tó ń yọrí sí ikú.”
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lè gba ìtumọ̀ tó ju ọ̀kan lọ; ìtumọ̀ náà kò gbọ́dọ̀ yan ọ̀kan láìsí dandan.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà ní iyì, ó ṣeé kà ní gbangba, kò sì lo èdè ẹ̀sìn àtijọ́ tó ṣòro. Àwọn àmì àlàyé [a]–[d] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
