  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: yo
  text: Nítorí, kò ṣeé ṣe ní ti àwọn tí wọ́n ti rí ìmọ́lẹ̀ lẹ́ẹ̀kan ṣoṣo, tí wọ́n sì ti tọ́ ẹ̀bùn ọ̀run wò,[a] tí wọ́n sì ti di alájọpín Ẹ̀mí Mímọ́,[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n sì ti ní ìrírí ẹ̀bùn ọ̀run.” Ọ̀rọ̀ náà túmọ̀ ní tààrà sí “tọ́ wò,” ṣùgbọ́n ó lè tọ́ka sí ìrírí gidi, kì í ṣe ìtọ́wò díẹ̀ lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí wọ́n sì ti pín nínú Ẹ̀mí Mímọ́” tàbí “tí wọ́n sì ti di olùkópa nínú Ẹ̀mí Mímọ́.”
    reason: lexical_alternative
  - marker: c
    text: “Wọ́n ti rí ìmọ́lẹ̀” lè tọ́ka ní gbogbogbòò sí gbígba ìmọ́lẹ̀ tàbí ẹ̀kọ́ nípa ti ẹ̀mí; àwọn kan ń túmọ̀ rẹ̀ ní pàtó sí ìyípadà ọkàn tàbí ìmọ́lẹ̀ ìrìbọmi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: Nítorí kò ṣeé ṣe
  rationale: Ó pa ìtẹnumọ́ ajẹtífù Ἀδύνατον mọ́, ó sì lo γὰρ gẹ́gẹ́ bí àsopọ̀ àlàyé sí ọ̀rọ̀ tó ṣáájú.
- source_word: ἅπαξ φωτισθέντας
  choice: àwọn tí a ti fi ìmọ́lẹ̀ sí ní ẹ̀ẹ̀kan rí
  rationale: Ó pa àwòrán ìmọ́lẹ̀ àti ohùn àìṣe-aláṣe ti participle Gíríìkì mọ́ láì sọ pé ó túmọ̀ sí ìyípadà ọkàn tàbí ìbatisí ní pàtó.
- source_word: γευσαμένους
  choice: tí wọ́n sì ti tọ́ ... wò
  rationale: ‘Tọ́ ... wò’ jẹ́ ọ̀nà Yorùbá àdánidá fún àwòrán ‘taste’ nígbà tí ó tún lè tọ́ka sí ìrírí gidi; àlàyé ìsàlẹ̀ fi ìtumọ̀ yìí hàn.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: ẹ̀bùn ọ̀run
  rationale: Ó jẹ́ ọ̀rọ̀ kúkúrú, àdánidá, tí kò sì dá irú ẹ̀bùn náà mọ́ níbi tí Gíríìkì kò ti dá a mọ́.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: tí wọ́n sì ti di alábápín nínú Ẹ̀mí Mímọ́
  rationale: ‘Di alábápín’ fi ìwọlé sí ipò ìkópa hàn, ‘nínú’ sì jẹ́ kí gbólóhùn náà yéni ní Yorùbá láì pinnu irú ìkópa náà ní ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Bóyá φωτισθέντας ń tọ́ka ní pàtó sí ìyípadà ọkàn tàbí ìbatisí
  choice: fi ìmọ́lẹ̀ sí
  alternative: yí padà sí ìgbàgbọ́; gba ìbatisí
  rationale: Orísun Gíríìkì lo àwòrán ìmọ́lẹ̀, kò sì sọ ìtumọ̀ pàtó; a pa àìdánilójú yẹn mọ́.
- issue: Bóyá γευσαμένους túmọ̀ sí ìtọ́wò díẹ̀ lásán tàbí ìrírí kíkún
  choice: tọ́ ... wò
  alternative: ní ìrírí ... ní kíkún; tọ́ díẹ̀ lásán
  rationale: Ọ̀rọ̀ náà lè ṣàpèjúwe ìrírí gidi, ṣùgbọ́n kò dá ìwọ̀n ìrírí náà mọ́; ìtumọ̀ kò yanjú àríyànjiyàn nípa ìṣubú kúrò nínú ìgbàgbọ́.
- issue: Irú ìkópa tí μετόχους ... πνεύματος ἁγίου ń sọ
  choice: di alábápín nínú Ẹ̀mí Mímọ́
  alternative: pín nínú Ẹ̀mí Mímọ́; di olùkópa nínú Ẹ̀mí Mímọ́
  rationale: Ó fi agbára gbólóhùn Gíríìkì hàn láì sọ ní pàtó pé ó jẹ́ ìgbé-inú ìgbàlà tàbí ìfarakanra tí kò jinlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. Àwọn participle Gíríìkì ni a ṣe sí àwọn gbólóhùn ìbátan Yorùbá. Ẹsẹ̀ náà jẹ́ apá ìbẹ̀rẹ̀ gbólóhùn tó ń bá a lọ ní ẹsẹ̀ 5–6, nítorí náà a fi àmì kọ́má sí òpin.
