id: HEB.6.5
reference: Hebrews 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: yo
  text: wọ́n sì ti tọ́ ọ̀rọ̀ rere Ọlọ́run wò àti àwọn agbára ayé tí ń bọ̀[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbà ayé tí ń bọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ alágbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: rere
  rationale: “Rere” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìwúlò àti ìtayọ ohun tí Ọlọ́run sọ hàn láì fi ìtumọ̀ míì kún un.
- source_word: γευσαμένους
  choice: ti tọ́ ... wò
  rationale: Àpólà yìí pa àwòrán ìtọ́wò mọ́, ó sì bá participle accusative plural tí ó ń tẹ̀ síwájú láti ẹsẹ tó ṣáájú mu. Kò sọ bóyá ìrírí náà jinlẹ̀ tàbí pé kò jinlẹ̀.
- source_word: θεοῦ ῥῆμα
  choice: ọ̀rọ̀ ... Ọlọ́run
  rationale: Èyí túmọ̀ ῥῆμα gẹ́gẹ́ bí ọ̀rọ̀ tàbí ohun tí Ọlọ́run sọ, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: δυνάμεις
  choice: àwọn agbára
  rationale: “Àwọn agbára” pa ìtumọ̀ gbooro δύναμις mọ́; ó lè tọ́ka sí agbára fúnra rẹ̀ tàbí sí àwọn iṣẹ́ alágbára láì dín un kù sí iṣẹ́ ìyanu nìkan.
- source_word: τε
  choice: àti
  rationale: “Àti” so ohun kejì mọ́ ohun àkọ́kọ́ lọ́nà Yorùbá tí ó ṣe déédéé.
- source_word: μέλλοντος αἰῶνος
  choice: ayé tí ń bọ̀
  rationale: Nínú àyíká yìí αἰών túmọ̀ sí àkókò tàbí ìgbà ayé kan; “ayé tí ń bọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbà ọjọ́ iwájú tí a ń retí, pẹ̀lú àlàyé ìtumọ̀ míì ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “tọ́ ... wò” nínú ọ̀rọ̀ ìkìlọ̀
  choice: Pa àwòrán “tọ́ ... wò” mọ́ láì sọ pé wọ́n ní ìrírí kíkún tàbí pé wọ́n kàn tọ́ ọ díẹ̀.
  alternative: “ní ìrírí” tàbí “kàn tọ́ díẹ̀”
  rationale: γευσαμένους kò dá ìjìnlẹ̀ ìkópa wọn yanjú. Ìtumọ̀ náà pa ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú Hébérù 6:4–6 mọ́.
- issue: Agbára δυνάμεις ní ìbáṣepọ̀ pẹ̀lú ayé tí ń bọ̀
  choice: “àwọn agbára”
  alternative: “àwọn iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ alágbára”
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn ìfarahàn agbára Ọlọ́run tó jẹ́ iṣẹ́ ìyanu, ṣùgbọ́n ó tún lè ní ìtumọ̀ tó gbooro. “Àwọn agbára” kò fi ẹ̀kọ́ kan pàtó lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà mọ̀ọ́mọ̀ ń tẹ̀ síwájú láti ẹsẹ tó ṣáájú, gẹ́gẹ́ bí ìṣètò Gíríìkì. Àwọn àmì àlàyé [b][a] wà lẹ́yìn gbólóhùn tí méjèèjì ń ṣàlàyé, ní ìbámu pẹ̀lú àtẹ̀jáde ìtọ́kasí.
