  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: yo
  text: Àwa sì ń fẹ́ kí olúkúlùkù yín fi irú ìtara kan náà hàn fún ìdánilójú pípé nípa ìrètí títí dé òpin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìgbẹ́kẹ̀lé pípé nípa ìrètí.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdánilójú tàbí ìgbẹ́kẹ̀lé tí ó péye.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘dé òpin.’ Gbólóhùn náà tẹnu mọ́ fífaradà títí dé ìparí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: Àwa sì ń fẹ́
  rationale: Ọ̀rọ̀ náà ń fi ìfẹ́ ọkàn tó jinlẹ̀ hàn. Nínú ọ̀rọ̀ ìṣírí yìí, ‘ń fẹ́’ jẹ́ èdè Yorùbá àdánidá tí kò sọ ọ́ di ìfẹ́kúfẹ̀ẹ́ tàbí ìmọ̀lára àsọdùn.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ ń samisi ìyípadà pẹ̀lẹ́ láti inú ìdánilójú ẹsẹ tó ṣáájú sí ìṣírí tuntun, láìfi ìtakora líle kún un.
- source_word: ἕκαστον ὑμῶν
  choice: olúkúlùkù yín
  rationale: Ó pa agbára pínpín ọ̀rọ̀ Gíríìkì mọ́, nítorí ìṣírí náà kan ẹnì kọ̀ọ̀kan nínú gbogbo wọn.
- source_word: τὴν αὐτὴν
  choice: irú … kan náà
  rationale: Ó tọ́ka sí ìtara tí wọ́n ti fi hàn nínú ìfẹ́ àti iṣẹ́ ìránṣẹ́ wọn, ó sì dun bí Yorùbá àdánidá.
- source_word: ἐνδείκνυσθαι
  choice: máa fi … hàn
  rationale: Ó túmọ̀ sí fífi ànímọ́ kan hàn ní gbangba; ‘fi … hàn’ ṣe kedere, ‘máa’ sì bá ìṣe tí ń bá a lọ mu.
- source_word: σπουδὴν
  choice: ìtara
  rationale: ‘Ìtara’ ní èdè Yorùbá lè gbé ìfọkànsìn, ìyára ọkàn, àti ìsapá tó ń bá a lọ, èyí tó bá àyíká ìṣírí náà mu.
- source_word: πρὸς
  choice: láti ní
  rationale: Níhìn-ín πρός ń tọ́ka sí ibi-afẹ́ tàbí àbájáde. ‘Láti ní’ sọ ìtọ́sọ́nà yẹn ní Yorùbá tó rọrùn láìsọ ọ́ di ìdí kan ṣoṣo.
- source_word: πληροφορίαν
  choice: ìdánilójú kíkún
  rationale: Ó ń tọ́ka sí ìdánilójú tàbí ìgbẹ́kẹ̀lé tó péye. Àṣàyàn yìí pa ìtumọ̀ méjèèjì mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
- source_word: ἐλπίδος
  choice: nínú ìrètí
  rationale: ‘Ìrètí’ ni ìtumọ̀ tààrà, ó sì lè túmọ̀ sí ìfojúsọ́nà tó dúró lórí ìlérí Ọlọ́run, kì í ṣe ìfẹ́ àìdánilójú lásán.
- source_word: ἄχρι τέλους
  choice: títí dé òpin
  rationale: Ó pa agbára àkókò ọ̀rọ̀ náà mọ́, ó sì tẹnu mọ́ fífaradà títí ohun yóò fi dé ìparí rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘ìdánilójú kíkún nínú ìrètí’ àti bí ó ṣe ní í ṣe pẹ̀lú fífaradà
  choice: A tú ọ̀rọ̀ náà sí ‘ìdánilójú kíkún nínú ìrètí,’ èyí tó lè gba ìdánilójú inú ẹni àti ìdúróṣinṣin ohun tí a ń retí wọlé, tí ó sì ń bá a lọ títí dé òpin.
  alternative: A lè sọ ọ́ ní ọ̀nà tó dá lórí ìmọ̀lára ẹni nìkan, bí ‘ìdánilójú pípé pé a ti rí ìgbàlà,’ tàbí ní ọ̀nà tó dá lórí mímú ìlérí ṣẹ nìkan.
  rationale: Ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì πληροφορία àti ἐλπίδος lè kan ìdánilójú ẹni, ṣùgbọ́n ó tún lè kan ìdúróṣinṣin ìrètí tí ìlérí Ọlọ́run ń fúnni. A kò mú ọ̀kan nínú wọn jẹ́ dandan kí ìforígbárí ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà lè wà bí ó ti rí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àwọn àmì ohùn wà níbi tó yẹ. ‘Máa fi … hàn’ ń mú ìṣe tí ń bá a lọ yé, ‘ìdánilójú kíkún nínú ìrètí’ sì pa ìtumọ̀ ẹ̀kọ́ ìsìn tó lè ní ojú méjì mọ́.
