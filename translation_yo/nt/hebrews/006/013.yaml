review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń gbé gbogbo àwọn èrò pàtàkì Gíríìkì náà kalẹ̀: ìlérí fún Ábúráhámù, àìsí ẹni tí ó ga jù Ọlọ́run lọ láti fi búra, àti pé Ọlọ́run fi ara rẹ̀ búra. Síbẹ̀, ‘kò ti lè’ lè fi ìtumọ̀ ‘kò tíì lè’ (not yet able) hàn ní Yorùbá. ‘Kò ti ní’ ń fara mọ́ εἶχεν dáadáa gẹ́gẹ́ bí ìsọ̀rọ̀ nípa àìní ẹni kan.'
