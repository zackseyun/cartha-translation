  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: yo
  text: Nítorí, nígbà tí Ọlọ́run ṣe ìlérí fún Ábúráhámù[a], níwọ̀n bí kò ti ní ẹni tí ó tóbi jù ú tí ó lè fi búra, ó fi ara rẹ̀ búra[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣókí, “nígbà tí Ọlọ́run ṣèlérí fún Ábúráhámù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “níwọ̀n bí kò ti ní ẹni tí ó tóbi jù ú láti fi búra.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: ṣe ìlérí
  rationale: Ó túmọ̀ sí ṣíṣe ìlérí; gbolohun yìí mú ohun tí a ṣe wá sí gbangba, ó sì bá ìsopọ̀ participle náà mu ní Yorùbá àdánidá.
- source_word: ἐπεὶ
  choice: níwọ̀n bí ... ti
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ ìdí tí Ọlọ́run fi búra nípa ara rẹ̀.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: kò ... fi ẹnikẹ́ni tí ó tóbi jù ú
  rationale: Àyíká ọ̀rọ̀ ìbúra tọ́ka sí ẹni tí a fi ń búra; ‘ẹnikẹ́ni’ jẹ́ àdánidá ju ‘ohunkóhun’ lọ ní Yorùbá.
- source_word: ὀμόσαι
  choice: búra
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìbúra mọ́, ó sì jọ ọ̀rọ̀-ìṣe tí a tún lò lẹ́yìn náà.
- source_word: ὤμοσεν
  choice: ó ... búra
  rationale: Ìtumọ̀ tààrà ti aorist active indicative náà ni, ó sì pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καθ’ ἑαυτοῦ
  choice: fi ara rẹ̀ búra
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan fi ara rẹ̀ ṣe ẹ̀rí tàbí ìdí ìbúra.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
- source_word: Τῷ ... Ἀβραὰμ
  choice: fún Ábúráhámù
  rationale: Dative náà ń tọ́ka sí ẹni tí ó gba ìlérí; ‘fún’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìrú ìbúra Ọlọ́run
  choice: Ọlọ́run fi ara rẹ̀ búra nítorí kò sí ẹni tí ó tóbi jù ú tí ó lè fi búra.
  alternative: Ọlọ́run búra nípa ara rẹ̀ nítorí kò ní ẹni tí ó tóbi jù ú láti fi búra.
  rationale: Ìtumọ̀ náà pa ọ̀rọ̀ nípa ipò gíga aláìlẹ́gbẹ́ Ọlọ́run mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ṣe ìlérí’ láti mú object tí ó farapamọ́ nínú àyíká ọ̀rọ̀ hàn, àti ‘fi ... búra’ gẹ́gẹ́ bí àṣà ọ̀rọ̀ Yorùbá fún swearing by someone.
