  terminology: ‘Ọlọ́run,’ ‘ìlérí,’ ‘búra,’ àti ‘Ábúráhámù’ bá ìlò Yorùbá ìgbàlódé àti ìforúkọsílẹ̀ Bíbélì mu. A pa àtúnlò ‘búra’ mọ́ gẹ́gẹ́ bí ὀμόσαι/ὤμοσεν.
