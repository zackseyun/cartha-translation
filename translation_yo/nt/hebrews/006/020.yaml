id: HEB.6.20
reference: Hebrews 6:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: yo
  text: níbi tí Jésù ti wọlé gẹ́gẹ́ bí aṣáájú-ọ̀nà fún wa[a], ẹni tí ó ti di Àlùfáà Àgbà títí láé gẹ́gẹ́ bí ìlànà Melikisedeki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí wa.” Gbólóhùn Gíríìkì náà lè sọ ìṣe fún àǹfààní àwọn ẹlòmíràn; níbí, ó tẹnu mọ́ ìwọlé Jésù gẹ́gẹ́ bí aṣojú wa.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ìlànà Melikisedeki.” Èyí ń tún ọ̀rọ̀ inú Sáàmù 110:4 sọ.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó tọ́ka sí ibi inú aṣọ ìkélé tí ẹsẹ tó ṣáájú mẹ́nu kàn, ó sì pa ìtumọ̀ ibi mọ́ láì ṣàfikún ohun tí Gíríìkì kò sọ.
- source_word: πρόδρομος
  choice: gẹ́gẹ́ bí aṣáájú-ọ̀nà
  rationale: Ó fi àwòrán ẹni tí ó kọ́kọ́ lọ síwájú láti ṣí ọ̀nà fún àwọn ẹlòmíràn hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ó lè túmọ̀ sí ìṣe fún àǹfààní tàbí ní ipò aṣojú àwọn ẹlòmíràn; yíyan yìí kò fi dandan sọ ọ́ di ‘ní ipò wa.’
- source_word: εἰσῆλθεν
  choice: ti wọ̀
  rationale: Ó sọ ìwọlé tí ó ti ṣẹlẹ̀, tí ipa rẹ̀ sì ń bá a lọ nínú ọ̀rọ̀ yìí.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ọ̀nà tí Yorùbá fi ń kọ orúkọ náà ní gbogbogbòò.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: gẹ́gẹ́ bí ìlànà Melikisedeki
  rationale: Ó pa ìbámu pẹ̀lú àpẹẹrẹ tàbí ìṣètò Melikisedeki mọ́, ó sì tún ń dún bí àyọkà Sáàmù 110:4.
- source_word: ἀρχιερεὺς
  choice: Àlùfáà Àgbà
  rationale: Ọ̀rọ̀ Yorùbá tó péye fún ipò olórí àlùfáà tí ó ṣe pàtàkì nínú Hébérù.
- source_word: γενόμενος
  choice: tí ó sì ti di
  rationale: Ó pa ìṣe ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí dídé sí ipò Àlùfáà Àgbà, kì í ṣe dídá Jésù sílẹ̀ tàbí yíyí ìwà-ìṣẹ̀dá rẹ̀ padà.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún ìwà pípẹ́ tí kò ní òpin nínú àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ γενόμενος (‘tí ó ti di’) pẹ̀lú ẹni tí Kristi jẹ́
  choice: A pa ‘tí ó sì ti di Àlùfáà Àgbà’ mọ́ gẹ́gẹ́ bí dídé sí ipò iṣẹ́ àlùfáà.
  alternative: ‘tí a ti yàn ní Àlùfáà Àgbà’ tàbí ‘tí a ti sọ di Àlùfáà Àgbà’
  rationale: Ọ̀rọ̀ náà ń sọ ipò àti iṣẹ́ Jésù nínú ètò ìgbàlà, kì í ṣe pé ó ṣẹ̀ṣẹ̀ wà láàyè tàbí pé ìwà-ìṣẹ̀dá rẹ̀ yí padà.
- issue: Agbára ìtumọ̀ ὑπὲρ ἡμῶν
  choice: ‘nítorí wa,’ pẹ̀lú àlàyé pé ó lè ní agbára ìtumọ̀ aṣojú
  alternative: ‘fún wa’ tàbí ‘ní ipò wa’
  rationale: Àyíká náà tẹnu mọ́ Jésù tí ó wọ ibi mímọ́ ọ̀run ṣáájú àwọn onígbàgbọ́ fún àǹfààní wọn. A kò sọ gbólóhùn náà di ẹ̀kọ́ pàṣípààrọ̀ tóóró tí ẹsẹ yìí kò sọ ní kedere.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Aṣáájú-ọ̀nà’ mú àwòrán πρόδρομος jáde ní kedere; ‘Àlùfáà Àgbà’ sì pa ọ̀rọ̀ ìjọsìn pàtàkì inú Hébérù mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
