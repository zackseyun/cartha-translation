  to: níbi tí Jésù ti wọlé gẹ́gẹ́ bí aṣáájú-ọ̀nà fún wa[a], ẹni tí ó ti di Àlùfáà Àgbà títí láé gẹ́gẹ́ bí ìlànà Melikisedeki[b].
