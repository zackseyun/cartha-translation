id: HEB.6.18
reference: Hebrews 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: yo
  text: kí nípasẹ̀ ohun méjì tí kò ṣeé yí padà, nínú àwọn ohun méjì wọ̀nyí tí kò ṣeé ṣe fún Ọlọ́run láti parọ́, àwa tí a sá wá ibi ààbò[b] lè ní ìṣírí tó lágbára láti di ìrètí tí wọ́n gbé kalẹ̀ níwájú wa mú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti di ìrètí tí wọ́n gbé kalẹ̀ níwájú wa mú ṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbá mú,” “di mú,” tàbí “di mú ṣinṣin.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “a sá wá ibi ààbò” mú àwòrán ẹni tí ó ń wá ibi ìsádi tàbí ààbò wá sí ọkàn, bóyá pẹ̀lú ìrántí àwọn ìlú ìsádi inú Májẹ̀mú Láéláé.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó fi ète tàbí àbájáde ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ èrò subjunctive ní Yorùbá.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: nípasẹ̀ ohun méjì tí kò lè yí padà
  rationale: “Ohun” pa ìtumọ̀ πράγματα mọ́ ní ọ̀nà gbígbòòrò, “tí kò lè yí padà” sì fi àìlèyípadà ἀμεταθέτων hàn láìfi àlàyé míì kún un.
- source_word: ἐν οἷς
  choice: nínú àwọn èyí tí
  rationale: Ó tọ́ka padà sí ohun méjì náà, ó sì pa ìbáṣepọ̀ gírámà Gíríìkì mọ́.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: kò ṣeé ṣe fún Ọlọ́run láti parọ́
  rationale: Ó pa ìṣètò gbólóhùn aláìlẹ́ni-ní-kókó náà àti ìtẹnumọ́ pé irọ́ pípa kò ṣeé ṣe fún Ọlọ́run mọ́.
- source_word: ἰσχυρὰν παράκλησιν
  choice: ìṣírí tó lágbára
  rationale: παράκλησις lè túmọ̀ sí ìṣírí, ìtùnú, tàbí ìgbani-níyànjú; “ìṣírí” bá ọ̀rọ̀ ìdánilójú inú àyíká yìí mu, “tó lágbára” sì gbé agbára ἰσχυράν jáde.
- source_word: ἔχωμεν
  choice: lè ní
  rationale: Pẹ̀lú “kí,” ó ṣàfihàn subjunctive ète/àbájáde ní Yorùbá àdánidá.
- source_word: οἱ καταφυγόντες
  choice: àwa tí a sá wá ibi ààbò
  rationale: Ó pa àwòrán àwọn ẹni tí wọ́n sá lọ sí ibi ìsádi tàbí ààbò mọ́, dípò yíyí i padà sí èrò àfojúrí nìkan.
- source_word: κρατῆσαι
  choice: láti di ... mú
  rationale: Ó fi ìṣe líle ti mímú tàbí lílépa ohun kan mú hàn; kò sọ ọ́ di “ní ìgbàgbọ́” tàbí àlàyé ẹ̀kọ́ ìsìn mìíràn tí kò sí nínú ọ̀rọ̀ náà.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: ìrètí tí a gbé kalẹ̀ níwájú wa
  rationale: Ó pa àwòrán ìrètí tí a fi síwájú ẹni gẹ́gẹ́ bí ohun tí ó wà fún un láti mú mọ́.
theological_decisions:
- issue: Àwòrán ibi ìsádi àti mímú ìrètí
  choice: àwa tí a sá wá ibi ààbò ... láti di ìrètí ... mú
  alternative: àwa tí a ti rí ààbò ... láti dúró ṣinṣin nínú ìrètí
  rationale: Àṣàyàn náà pa ìṣípò “sá wá” àti ìṣe mímú ìrètí mọ́, kò sì sọ àwòrán gidi inú Gíríìkì di àlàyé ẹ̀kọ́ ìsìn àfojúrí.
- issue: Àìṣeéṣe fún Ọlọ́run láti parọ́
  choice: kò ṣeé ṣe fún Ọlọ́run láti parọ́
  alternative: Ọlọ́run kò lè parọ́
  rationale: Ó tẹ̀ lé ìṣètò ἀδύνατον + infinitive pẹ̀lú ọ̀wọ̀, láìfikún àlàyé ọgbọ́n-orí nípa ìwà Ọlọ́run tí ẹsẹ náà kò sọ.
- issue: Àwọn ohun méjì tí kò lè yí padà
  choice: ohun méjì tí kò lè yí padà
  alternative: ìlérí àti ìbúra Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìlérí àti ìbúra, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ pè wọ́n ní “ohun méjì”; ìtumọ̀ náà kò fi orúkọ tí ó ṣàlàyé wọ́n sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìṣètò ète “kí ... lè,” àwòrán ibi ààbò, àti líle mímú ìrètí mọ́ láìjẹ́ kí gbólóhùn náà di ti àtijọ́ tàbí ti ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
