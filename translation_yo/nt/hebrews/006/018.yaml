review_pass:
  verdict: revise
  source_fidelity: 'The draft substantially reflects the Greek: it retains the purpose/result clause, the two unchangeable matters, God''s inability to lie, the refuge imagery, strong encouragement, and the hope set before the readers. However, the passive sense of προκειμένης (''set before'') needs to be made unambiguous in Yoruba.'
  naturalness: The Yoruba is generally clear and appropriately formal. Recasting 'nínú àwọn èyí tí' as 'nínú àwọn ohun méjì wọ̀nyí' is more idiomatic and gives the relative phrase a clear antecedent. 'Tí a gbé kalẹ̀ níwájú wa' can be read as 'which we set before ourselves'; an indefinite/passive expression is preferable.
  terminology: 'Key terms are suitable: ''Ọlọ́run,'' ''parọ́,'' ''ìṣírí tó lágbára,'' ''ibi ààbò,'' and ''ìrètí.'' The revised wording preserves the concrete refuge and grasping imagery without doctrinal expansion.'
  issues:
  - severity: medium
    issue: Ambiguous agent in 'ìrètí tí a gbé kalẹ̀ níwájú wa'
    rationale: 'The Greek προκειμένης is passive: the hope is ''set before us.'' Yoruba ''a gbé'' may naturally be understood as first-person plural (''we set''), which reverses the relation. ''Tí wọ́n gbé kalẹ̀ níwájú wa'' clearly conveys an indefinite passive agent.'
  - severity: low
    issue: Relative phrase 'nínú àwọn èyí tí' is stylistically awkward
    rationale: 'Although intelligible, it is less natural than explicitly referring back to the two matters: ''nínú àwọn ohun méjì wọ̀nyí.'''
  - severity: low
    issue: '''tí kò lè yí padà'' can imply self-change rather than being unchangeable'
    rationale: '''Tí kò ṣeé yí padà'' naturally expresses the Greek sense that these matters cannot be altered, without requiring an explicit agent.'
