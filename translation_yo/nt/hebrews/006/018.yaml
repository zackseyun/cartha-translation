  to: kí nípasẹ̀ ohun méjì tí kò ṣeé yí padà, nínú àwọn ohun méjì wọ̀nyí tí kò ṣeé ṣe fún Ọlọ́run láti parọ́, àwa tí a sá wá ibi ààbò[b] lè ní ìṣírí tó lágbára láti di ìrètí tí wọ́n gbé kalẹ̀ níwájú wa mú[a].
  rationale: 'The revision resolves the potentially reversed agency in the hope being set before the readers, clarifies the reference of the Greek relative pronoun, and expresses the unalterable character of the two matters more naturally. Footnote anchors and their functions remain correctly matched: [b] follows the refuge expression, and [a] follows the expression for taking hold of hope.'
