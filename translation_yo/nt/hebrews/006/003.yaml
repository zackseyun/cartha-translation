  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: yo
  text: A ó sì ṣe èyí[a], bí Ọlọ́run bá fàyè gbà nítòótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí Ọlọ́run bá gbà láàyè.” Patíkù Gíríìkì tí a túmọ̀ sí “nítòótọ́” fi ìtẹnumọ́ kún ipò náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ yìí so gbólóhùn náà mọ́ ìṣírí tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò afihan ẹyọ kan ni, ó sì tọ́ka sí ohun tàbí ìgbésẹ̀ tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: ποιήσομεν
  choice: Àwa yóò ... ṣe
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú àti ẹni púpọ̀ mọ́, ó sì tẹnu mọ́ olùṣe gẹ́gẹ́ bí Gíríìkì ṣe fi hàn.
- source_word: ἐάνπερ
  choice: bí ... bá ... nítòótọ́
  rationale: Àkójọpọ̀ yìí pa ipò ‘bí’ mọ́, ‘nítòótọ́’ sì gbìyànjú láti fi ìtẹnumọ́ περ hàn láìsọ àìdánilójú ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐπιτρέπῃ
  choice: gbà á láàyè
  rationale: Gbólóhùn Yorùbá àdánidá fún ‘fàyè gba/permit’ ni, ó sì bá subjunctive inú gbólóhùn onípò mu.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá boṣewa fún orúkọ àtọ̀runwá náà; kò pọn dandan láti ṣàfihàn article Gíríìkì lọ́tọ̀.
theological_decisions:
- issue: Gbólóhùn onípò nípa ìyọ̀ǹda Ọlọ́run
  choice: A sọ ète àwọn olùsọ láti ṣe èyí, ṣùgbọ́n a fi í sábẹ́ ìyọ̀ǹda Ọlọ́run ní kedere.
  alternative: ‘Bí Ọlọ́run bá fẹ́’ tàbí àlàyé tó sọ pé Ọlọ́run ló fa gbogbo ìgbésẹ̀ náà ní ọ̀nà tí ọ̀rọ̀ Gíríìkì kò sọ.
  rationale: Gíríìkì fi ipò gidi kan hàn—‘bí Ọlọ́run bá gbà á láàyè nítòótọ́.’ Ìtumọ̀ yìí pa ìforígbárí tó wà láàárín ète ènìyàn àti ìyọ̀ǹda Ọlọ́run mọ́ láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. ‘Gbà á láàyè’ jẹ́ àdánidá sí etí àwọn òǹkàwé lasán, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fúnni ní àṣàyàn ‘fàyè gbà á.’
