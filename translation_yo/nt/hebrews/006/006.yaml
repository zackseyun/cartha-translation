id: HEB.6.6
reference: Hebrews 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: yo
  text: àti àwọn tí wọ́n ti ṣubú kúrò[a], láti tún wọn ṣe sí ìrònúpìwàdà[b], nítorí pé wọ́n ń tún Ọmọ Ọlọ́run kàn mọ́ àgbélébùú fún ara wọn, wọ́n sì ń fi í ṣe ohun ìtìjú ní gbangba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n ti di apẹ̀yìndà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìṣubú kúrò tó le.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí wọ́n ń tún Ọmọ Ọlọ́run kàn mọ́ àgbélébùú fún ara wọn, tí wọ́n sì ń fi í ṣe ohun ìtìjú ní gbangba.” A lè ka àwọn participle Gíríìkì náà gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ ní àkókò kan náà, tàbí gẹ́gẹ́ bí àlàyé ìdí.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: tí wọ́n sì ti ṣubú kúrò
  rationale: Ó ṣàfihàn ìṣubú kúrò tó le koko láìfi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó lé e lórí; ìsopọ̀ participle náà tún wà ní ìbámu pẹ̀lú àyíká ẹsẹ tó ṣáájú.
- source_word: πάλιν ἀνακαινίζειν
  choice: láti tún wọn sọ di tuntun
  rationale: “Tún … sọ di tuntun” mú ìtumọ̀ ìmúpadàbọ̀ sí ipò tuntun tàbí ti tẹ́lẹ̀ àti agbára πάλιν jáde ní Yorùbá àdánidá.
- source_word: εἰς μετάνοιαν
  choice: sí ìrònúpìwàdà
  rationale: “Sí” pa ipa ìdarí tàbí àfojúsùn εἰς mọ́; “ìrònúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún μετάνοια.
- source_word: ἀνασταυροῦντας
  choice: wọ́n ń tún … kàn mọ́ àgbélébùú
  rationale: Àmì “ń” fi ipa ìṣe tó ń lọ nínú present participle hàn, “tún” sì pa ìtumọ̀ ἀνα- mọ́.
- source_word: ἑαυτοῖς
  choice: fún ara wọn
  rationale: Ó túmọ̀ dative reflexive náà gẹ́gẹ́ bí ìṣe tí wọ́n ń ṣe ní ti ara wọn tàbí fún ara wọn, láìyanju àìdánilójú rẹ̀ ju bó ṣe yẹ lọ.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì pa oyè Kristi náà mọ́.
- source_word: παραδειγματίζοντας
  choice: wọ́n ń fi í hàn sí ìtìjú ní gbangba
  rationale: Ó mú ìtumọ̀ fífi ẹnì kan hàn ní gbangba fún ẹ̀gàn tàbí ìtìjú jáde ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bóyá kí ẹsẹ yìí tún sọ pé “kò ṣeé ṣe” láti ẹsẹ tó ṣáájú
  choice: A jẹ́ kí ẹsẹ náà bẹ̀rẹ̀ pẹ̀lú “àti,” kí ó sì má tún gbolohun “kò ṣeé ṣe” sọ.
  alternative: “Kò ṣeé ṣe … láti tún àwọn tí wọ́n ti ṣubú kúrò sọ di tuntun.”
  rationale: Gíríìkì ẹsẹ yìí gbára lé ìṣọ̀kan gírámà ẹsẹ 4–6; pípa ìgbẹ́kẹ̀lé yìí mọ́ kò fi ọ̀rọ̀ tí kò sí nínú ẹsẹ náà kún un.
- issue: Irú ìṣubú kúrò tí παραπεσόντας ń tọ́ka sí
  choice: “tí wọ́n sì ti ṣubú kúrò”
  alternative: “tí wọ́n ti di apẹ̀yìndà” tàbí “tí wọ́n ti kọ ìgbàgbọ́ sílẹ̀ pátápátá”
  rationale: Ìtumọ̀ yìí pa ìkìlọ̀ líle náà mọ́, ṣùgbọ́n kò pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ìgbàlà tàbí ìfaradà.
- issue: Ipa ἀνασταυροῦντας àti παραδειγματίζοντας
  choice: A túmọ̀ wọn lọ́nà ìdí pẹ̀lú “nítorí pé.”
  alternative: “nígbà tí wọ́n ń …”
  rationale: Àwọn participle náà lè ṣàlàyé ìdí tí ìmúdọ̀tun fi ṣòro tàbí fi kò ṣeé ṣe, ṣùgbọ́n wọ́n tún lè tọ́ka sí ohun tó ń ṣẹlẹ̀ lẹ́gbẹ̀ẹ́ rẹ̀; àlàyé ìtumọ̀ kejì wà ní àlàyé ìsàlẹ̀ [b].
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kedere ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìgbẹ́kẹ̀lé gbolohun náà mọ́ lórí Hébérù 6:4–6, a sì yẹra fún fífi ìpinnu ẹ̀kọ́ ìgbàgbọ́ ẹgbẹ́ kan sínú ọ̀rọ̀ náà.
