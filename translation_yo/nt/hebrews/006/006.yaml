  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìgbẹ́kẹ̀lé gírámà rẹ̀ mọ́ sí Hébérù 6:4–6, ó sì gbé παραπεσόντας, πάλιν, εἰς μετάνοιαν, àti àwọn participle ìkẹyìn kalẹ̀ ní ìbámu pẹ̀lú ìtumọ̀ Gíríìkì. Síbẹ̀, “tún wọn sọ di tuntun sí” kò ṣe kedere tàbí dà bí ọ̀nà Yorùbá tó dára láti sọ ἀνακαινίζειν εἰς μετάνοιαν; “tún wọn ṣe sí ìrònúpìwàdà” dáa sí i, ó sì pa ìtumọ̀ ìmúdọ̀tun mọ́.
  naturalness: “Àti tí wọ́n sì ti” ní ìsopọ̀ àfikún tí kò rọrùn (“àti” pẹ̀lú “sì”). “Àti àwọn tí wọ́n ti ṣubú kúrò” jẹ́ ìbẹ̀rẹ̀ tó mọ́, tó sì bá participle tí ó dúró fún ẹgbẹ́ ènìyàn mu. Pẹ̀lú náà, “fi í hàn sí ìtìjú” kì í ṣe ọ̀nà tó wọ́pọ̀ jù lọ ní Yorùbá fún fífi ènìyàn hàn fún ìtìjú; “fi í ṣe ohun ìtìjú ní gbangba” túmọ̀ ìtìjú-òde náà ní kedere àti ní èdè àdánidá.
  terminology: “Ìrònúpìwàdà,” “Ọmọ Ọlọ́run,” “àgbélébùú,” àti “fún ara wọn” yẹ, wọ́n sì bá ọ̀rọ̀ Gíríìkì mu. “Apẹ̀yìndà” lè dúró gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀, níwọ̀n bí ọ̀rọ̀ àkọ́kọ́ “ṣubú kúrò” ti ń yẹra fún fífi ìpinnu ẹ̀kọ́ ìjọ kan kún un.
