  to: Nítorí Ọlọ́run kì í ṣe aláìṣòdodo débi pé yóò gbàgbé iṣẹ́ yín àti ìfẹ́ tí ẹ fi hàn sí orúkọ rẹ̀[a], nípasẹ̀ iṣẹ́ ìránṣẹ́ tí ẹ ti ṣe fún àwọn ènìyàn mímọ́[b] àti tí ẹ sì ń bá a lọ láti ṣe fún wọn[c].
  rationale: 'Àtúnṣe náà mú ìbáṣepọ̀ gírámà Gíríìkì náà hàn dáadáa: ìfẹ́ tí wọ́n fi hàn sí orúkọ Ọlọ́run ni a fi hàn nípasẹ̀ iṣẹ́ ìránṣẹ́ wọn fún àwọn ẹni mímọ́. Ó tún pa ìyàtọ̀ láàárín διακονήσαντες (iṣẹ́ tí wọ́n ti ṣe) àti διακονοῦντες (iṣẹ́ tí wọ́n ń bá a lọ láti ṣe) mọ́, pẹ̀lú Yorùbá boṣewa tó dára fún kíkà ní gbangba.'
