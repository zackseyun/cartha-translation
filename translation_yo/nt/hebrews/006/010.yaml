  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: yo
  text: Nítorí Ọlọ́run kì í ṣe aláìṣòdodo débi pé yóò gbàgbé iṣẹ́ yín àti ìfẹ́ tí ẹ fi hàn sí orúkọ rẹ̀[a], nípasẹ̀ iṣẹ́ ìránṣẹ́ tí ẹ ti ṣe fún àwọn ènìyàn mímọ́[b] àti tí ẹ sì ń bá a lọ láti ṣe fún wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí orúkọ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, àwọn onígbàgbọ́ ẹlẹgbẹ́; “àwọn ènìyàn mímọ́” níhìn-ín ń tọ́ka sí àwọn ènìyàn Ọlọ́run, kì í ṣe kìkì àwọn ẹni tí a wá yàn sí ipò mímọ́ ní ìgbà tó késẹ̀.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nípasẹ̀ ṣíṣe iṣẹ́ ìránṣẹ́ fún àwọn ènìyàn mímọ́ àti nípasẹ̀ títẹ̀síwájú láti ṣe bẹ́ẹ̀ fún wọn.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: aláìṣòdodo
  rationale: Ó túmọ̀ sí ẹni tí kò ṣe ohun tó tọ́ tàbí tó bá ìdájọ́ òdodo mu; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àtijọ́-tuntun tó sì bá ọ̀rọ̀ nípa ìṣòdodo Ọlọ́run mu.
- source_word: ἐπιλαθέσθαι
  choice: gbàgbé
  rationale: Èyí pa ìtumọ̀ tààrà náà mọ́, pẹ̀lú èrò inú àyíká ọ̀rọ̀ pé Ọlọ́run kì yóò ṣàìka iṣẹ́ wọn sí.
- source_word: ἔργου
  choice: iṣẹ́
  rationale: Iṣẹ́ jẹ́ ọ̀rọ̀ àdánidá fún ἔργον, ó sì lè dúró fún àpapọ̀ àwọn iṣẹ́ tí wọ́n ṣe.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ àdánidá fún ἀγάπη, ìfẹ́ náà sì fara hàn nínú iṣẹ́ ìránṣẹ́ wọn.
- source_word: ἐνεδείξασθε
  choice: ẹ fi hàn
  rationale: Ó sọ pé wọ́n fi ẹ̀rí ìfẹ́ wọn hàn ní ohun tí wọ́n ṣe.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: sí orúkọ rẹ̀
  rationale: Ìtumọ̀ yìí pa ìtọ́sọ́nà tàbí ìfọkànsìn sí orúkọ Ọlọ́run mọ́, láìsọ ọ́ di ìtumọ̀ kan ṣoṣo; àlàyé ìsàlẹ̀ fi ‘nítorí orúkọ rẹ̀’ hàn gẹ́gẹ́ bí òmíràn.
- source_word: διακονήσαντες
  choice: ẹ ti ṣe iṣẹ́ ìránṣẹ́ fún
  rationale: Ó fi iṣẹ́ ìránṣẹ́ tí wọ́n ti ṣe tẹ́lẹ̀ hàn, ní ìyàtọ̀ sí iṣẹ́ tí wọ́n ṣì ń ṣe.
- source_word: τοῖς ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Èyí pa èrò ‘àwọn ẹni mímọ́’ mọ́, ó sì yàgò fún ìtumọ̀ ìgbà tó késẹ̀ pé kìkì àwọn ẹni tí a ti yàn sí ipò pàtàkì ni.
- source_word: διακονοῦντες
  choice: ẹ sì ń bá a lọ láti máa sìn wọ́n
  rationale: Èyí mú ìṣe tí ó ń bá a lọ nínú present participle náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń kọ́ni pé iṣẹ́ ènìyàn ń jèrè ìgbàlà lọ́wọ́ Ọlọ́run, tàbí pé Ọlọ́run fi òdodo rántí iṣẹ́ àwọn onígbàgbọ́
  choice: A sọ pé Ọlọ́run kì í ṣe aláìṣòdodo débi tí yóò fi gbàgbé iṣẹ́ àti ìfẹ́ wọn, láìsọ pé iṣẹ́ wọn fi Ọlọ́run sábẹ́ gbèsè ìgbàlà.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí ẹ̀kọ́ pé Ọlọ́run jẹ wọ́n ní èrè nítorí iṣẹ́ wọn.
  rationale: Gíríìkì sọ òdodo Ọlọ́run àti àìgbàgbé rẹ̀ ní tààrà, ṣùgbọ́n kò sọ nínú ẹsẹ̀ yìí pé iṣẹ́ wọn ni ó jèrè ìgbàlà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ó ṣe wà nínú ὑμῶν àti àwọn ọ̀rọ̀-ìṣe ọ̀pọ̀.
