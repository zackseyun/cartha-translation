  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì mọ́: Ọlọ́run kì í ṣe aláìṣòdodo láti gbàgbé iṣẹ́ àti ìfẹ́ wọn; ìfẹ́ náà fara hàn nínú iṣẹ́ ìránṣẹ́ tí wọ́n ti ṣe àti tí wọ́n ń tẹ̀síwájú nínú rẹ̀ fún àwọn ẹni mímọ́. Ṣùgbọ́n ‘ní ti pé’ kò fi ìbáṣepọ̀ participle méjèèjì náà hàn kedere, ó sì dùn bí ìsọ̀rí ọ̀rọ̀ ju ọ̀nà tí ìfẹ́ náà fi fara hàn lọ.'
  naturalness: ‘Nítorí Ọlọ́run kì í ṣe aláìṣòdodo débi pé yóò…’ jẹ́ ọ̀nà Yorùbá tó rọrùn ju ‘débi tí yóò fi’ nínú àyíká yìí. Ṣíṣe ‘iṣẹ́ ìránṣẹ́ tí ẹ ti ṣe… tí ẹ sì ń bá a lọ láti ṣe…’ mú ìyàtọ̀ iṣẹ́ tó ti ṣẹlẹ̀ àti èyí tó ń lọ lọ́wọ́ hàn ní kedere, láìjẹ́ kí gbolóhùn náà dùn léraléra.
  terminology: ‘Aláìṣòdodo,’ ‘ìfẹ́,’ ‘orúkọ rẹ̀,’ àti ‘àwọn ènìyàn mímọ́’ bá ìtumọ̀ àti ìforúkọsílẹ̀ Bíbélì mu. ‘Àwọn ènìyàn mímọ́’ kò yẹ kí a lóye sí ẹgbẹ́ àwọn ẹni tí a canonize nígbà tó késẹ̀; àlàyé ìsàlẹ̀ ṣàlàyé èyí dáadáa.
