id: HEB.6.8
reference: Hebrews 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá ń mú ẹ̀gún àti èṣùṣú[a] jáde, kò wúlò, ó sì sún mọ́ ègún; òpin rẹ̀ sì ni pé a sun ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kọ̀ ọ́ sílẹ̀” dípò “kò wúlò” (ἀδόκιμος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: ń mú ... jáde
  rationale: Ó ń bá àwòrán ilẹ̀ inú ẹsẹ tó ṣáájú lọ, ó sì fi ìṣe tí ń tẹ̀ síwájú hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ilẹ̀ eléso inú ẹsẹ 7 hàn.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: ẹ̀gún àti èṣùṣú
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń tọ́ka sí ewéko ẹlẹ́gùn tí kò wúlò; ìtumọ̀ yìí pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
- source_word: ἀδόκιμος
  choice: kò ní láárí
  rationale: Nínú àwòrán ilẹ̀, gbólóhùn yìí fi hàn pé ilẹ̀ náà kò ye ìdánwò, kò sì wúlò; àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘a kọ̀ ọ́ sílẹ̀’ mọ́.
- source_word: κατάρας ἐγγύς
  choice: ó sún mọ́ ègún
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí láì sọ ọ́ di ìṣe tí a ti parí tàbí láì ṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἧς τὸ τέλος
  choice: òpin rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí ilẹ̀ tí a lóye láti inú ẹsẹ tó ṣáájú; ‘òpin’ pa ìtumọ̀ àkókò àti àbájáde mọ́.
- source_word: εἰς καῦσιν
  choice: ni kí a fi iná sun ún
  rationale: Ó sọ ète tàbí àbájáde sísun ní ọ̀nà Yorùbá tó ṣe kedere, láì túmọ̀ àwòrán náà ní pàtó sí ìdájọ́ ìkẹyìn.
theological_decisions:
- issue: Bóyá kí a tún sọ ‘ilẹ̀’ ní kedere gẹ́gẹ́ bí olùṣe ọ̀rọ̀ náà
  choice: Lo ‘ó’ láti tọ́ka sí ilẹ̀ inú ẹsẹ tó ṣáájú
  alternative: Ṣùgbọ́n ilẹ̀ tí ó bá ń mú ẹ̀gún àti èṣùṣú jáde...
  rationale: Gíríìkì kò tún samisi orúkọ ‘ilẹ̀’ nínú ẹsẹ yìí, ṣùgbọ́n ó ń bá àwòrán ẹsẹ 7 lọ; arọ́pò-orúkọ Yorùbá lè pa ìbáṣepọ̀ náà mọ́ láì fi orúkọ kún un.
- issue: Ìwọ̀n agbára ọ̀rọ̀ ἀδόκιμος
  choice: kò ní láárí nínú àkọ́kọ́, pẹ̀lú ‘a kọ̀ ọ́ sílẹ̀’ nínú àlàyé ìsàlẹ̀
  alternative: a kọ̀ ọ́ sílẹ̀
  rationale: ‘Kò ní láárí’ bá àyíká ilẹ̀ tí kò wúlò mu, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ìkọ̀sílẹ̀ tí ó lágbára sí i mọ́.
- issue: Bóyá kí sísun náà di àlàyé pàtó nípa ìdájọ́ ìkẹyìn
  choice: Pa àwòrán ‘fi iná sun ún’ mọ́
  alternative: òpin rẹ̀ ni ìdájọ́ nípasẹ̀ iná
  rationale: Ẹsẹ náà fúnra rẹ̀ lo àwòrán iṣẹ́ àgbẹ̀, kò sì sọ ibi ìdájọ́ tàbí irú ìdálẹ́bi pàtó; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fi sílẹ̀.
translation_notes:
  register: Yorùbá ìpele òde òní tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ̀gún àti èṣùṣú’ jẹ́ àkójọpọ̀ ewéko ẹlẹ́gùn tó bá àwòrán iṣẹ́ àgbẹ̀ mu; gbólóhùn náà mọ̀ọ́mọ̀ kò ṣàlàyé iná náà ju ọ̀rọ̀ Gíríìkì lọ.
