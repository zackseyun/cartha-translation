  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: yo
  text: ẹ̀kọ́ nípa àwọn ìwẹ̀nùmọ́[a], gbígbé ọwọ́ lé ẹni, àjíǹde àwọn òkú, àti ìdájọ́ ayérayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀kọ́ nípa àwọn ìrìbọmi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ó sì lè tọ́ka sí àwọn ìwẹ̀ àṣà fún ìwẹ̀nùmọ́ ní gbogbogbòò, kì í ṣe ìrìbọmi Kristẹni ní pàtó nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: àwọn ìwẹ̀nùmọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ó sì lè tọ́ka sí onírúurú ìwẹ̀ àṣà fún ìwẹ̀nùmọ́, kì í ṣe dandan pé ó ń sọ nípa ìbatisí Kristẹni nìkan. Àṣàyàn yìí pa ọ̀pọ̀ rẹ̀ mọ́, ó sì yẹra fún fífi ìtumọ̀ ẹ̀sìn kan ṣoṣo lé e.
- source_word: διδαχὴν
  choice: ẹ̀kọ́ nípa
  rationale: Ó ń tẹ̀ síwájú nínú àkójọ àwọn ìpìlẹ̀ inú ẹsẹ tó ṣáájú, ó sì ń darí àwọn ohun tó tẹ̀ lé e. ‘Ẹ̀kọ́ nípa’ jẹ́ èdè Yorùbá àdánidá, tó sì yé kedere.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: gbígbé ọwọ́ léni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìṣe fífi ọwọ́ lé ènìyàn, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Ó pa ìtumọ̀ àjíǹde àti agbára àpapọ̀ ọ̀rọ̀ νεκρῶν mọ́ ní Yorùbá àdánidá.
- source_word: κρίματος αἰωνίου
  choice: ìdájọ́ ayérayé
  rationale: ‘Ìdájọ́’ kò dín ọ̀rọ̀ náà kù sí ìdálẹ́bi nìkan, ‘ayérayé’ sì fi agbára αἰωνίου hàn ní èdè Yorùbá tí a mọ̀.
- source_word: τε ... τε καὶ
  choice: …, …, àti …
  rationale: Àwọn patíkù náà so àwọn ohun inú àkójọ pọ̀. Àmì kọ́ńmá àti ‘àti’ ni ọ̀nà Yorùbá àdánidá láti pa ìbáṣepọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ βαπτισμῶν nínú àkójọ àwọn ẹ̀kọ́ ìpìlẹ̀
  choice: àwọn ìwẹ̀nùmọ́
  alternative: àwọn ìbatisí
  rationale: Ọ̀pọ̀ ọ̀rọ̀ náà àti bí a ṣe ń lò ó lè tọ́ka sí àwọn ìwẹ̀ àṣà ní gbogbogbòò. Àkọsílẹ̀ ìsàlẹ̀ pa ‘ìbatisí’ mọ́ gẹ́gẹ́ bí àṣàyàn, kí a má bàa yanjú ọ̀rọ̀ tí ẹsẹ náà fi sílẹ̀ ní àìdájú.
- issue: Ìwọ̀n ìtumọ̀ κρίματος αἰωνίου
  choice: ìdájọ́ ayérayé
  alternative: ìdálẹ́bi ayérayé
  rationale: Gíríìkì sọ ‘ìdájọ́,’ kì í ṣe ‘ìdálẹ́bi’ ní pàtó. Ìtumọ̀ yìí kò sọ àbájáde ìdájọ́ náà ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘ìwẹ̀nùmọ́’ láti fi iṣẹ́ àti ète àwọn ìwẹ̀ àṣà hàn; àkọsílẹ̀ ìsàlẹ̀ sì pa àṣàyàn ‘ìbatisí’ mọ́. Gbólóhùn náà jẹ́ àjákù àkójọ tó ń tẹ̀ síwájú láti Hébérù 6:1, bí orísun Gíríìkì ṣe rí.
