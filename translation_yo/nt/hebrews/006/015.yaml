  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: yo
  text: Bẹ́ẹ̀ sì ni, lẹ́yìn tí ó fi sùúrù dúró, ó rí ìlérí náà gbà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó gba ohun tí a ṣèlérí.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé, “ó rí ìlérí náà gbà.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Bẹ́ẹ̀ sì ni
  rationale: Ọ̀rọ̀ yìí so gbólóhùn náà mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ nípa ìlérí àti ìbúra Ọlọ́run, ó sì fi ọ̀nà tàbí àbájáde hàn lọ́nà Yorùbá àdánidá.
- source_word: μακροθυμήσας
  choice: lẹ́yìn tí ó fi sùúrù dúró
  rationale: Ó fi ìfaradà pẹ́ tí ó wà nínú ọ̀rọ̀ Gíríìkì hàn, ó sì mú ìtumọ̀ àkókò ti ọ̀rọ̀-àbọ̀ náà jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐπέτυχεν
  choice: ó rí ... gbà
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí fi ìṣeyọrí nínú gbígba ohun kan hàn láìfi dandan sọ pé gbogbo ìmúṣẹ rẹ̀ ti pé tán.
- source_word: τῆς ἐπαγγελίας
  choice: ìlérí náà
  rationale: Ó pa orúkọ náà mọ́ gẹ́gẹ́ bí ‘ìlérí,’ ó sì tọ́ka sí ìlérí pàtó tí Ọlọ́run ṣe nínú àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá gbólóhùn ἐπέτυχεν τῆς ἐπαγγελίας túmọ̀ sí pé Abrahamu gba ìmúṣẹ ìlérí náà ní kíkún tàbí pé ó rí ìlérí náà gbà.
  choice: ó rí ìlérí náà gbà
  alternative: ó gba ohun tí a ṣèlérí
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé ó ‘rí ìlérí náà gbà’; ìtumọ̀ yìí kò fi kun un pé gbogbo ohun tí a ṣèlérí ti ṣẹ ní kíkún, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú Hébérù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A kò tún orúkọ Abrahamu fi sínú ẹsẹ náà nítorí pé ọ̀rọ̀ Gíríìkì ní arọ́pò-orúkọ nìkan; àyíká ọ̀rọ̀ ló ń fi ẹni náà hàn.
