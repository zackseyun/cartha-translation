id: HEB.6.17
reference: Hebrews 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: yo
  text: Nítorí náà, nígbà tí Ọlọ́run fẹ́ láti fi hàn kedere sí i fún àwọn ajogún ìlérí náà pé ète rẹ̀ kò lè yí padà[a], ó sì fi ìbúra mú ète náà dájú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àìlèyípadà ìpinnu rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ tààrà, “ó dá sí àárín pẹ̀lú ìbúra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nítorí náà, bí ... ti
  rationale: Gbólóhùn yìí so ẹsẹ̀ náà mọ́ ọ̀rọ̀ ìbúra Ọlọ́run tí ó ṣáájú, ó sì fi ìdí àti ipò ìṣe tí ó tẹ̀ lé e hàn ní Yorùbá àdánidá.
- source_word: περισσότερον
  choice: kedere sí i
  rationale: 'Ó ń mú agbára ἐπιδεῖξαι pọ̀ sí i: Ọlọ́run fẹ́ fi ohun náà hàn ní ọ̀nà tí ó túbọ̀ ṣe kedere.'
- source_word: βουλόμενος
  choice: fẹ́
  rationale: Nínú àyíká yìí, ó tọ́ka sí ìfẹ́ inú àti ìpinnu Ọlọ́run láti ṣe ohun kan, kì í ṣe ìfẹ́ tí kò dájú.
- source_word: ἐπιδεῖξαι
  choice: fi hàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ‘ṣàfihàn’ tàbí ‘fi ẹ̀rí hàn,’ tí περισσότερον sì ti fún ní ìtumọ̀ ‘kedere sí i.’
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: fún àwọn ajogún ìlérí náà
  rationale: ‘Àwọn ajogún’ pa àwòrán ogún mọ́, ‘ìlérí náà’ sì ń tọ́ka sí ìlérí tí a ti ń sọ̀rọ̀ nípa rẹ̀.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: pé ète òun kò lè yí padà
  rationale: Ìtumọ̀ yìí sọ àìlèyípadà ète Ọlọ́run ní Yorùbá tó rọrùn, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn àkànṣe kún un. ‘Òun’ mú kí ó ṣe kedere pé ète Ọlọ́run ni.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: ó fi ìbúra mú un dájú
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ pé Ọlọ́run dá sí ọ̀ràn náà láti fún un ní ìmúdájú nípasẹ̀ ìbúra; ọ̀rọ̀ yìí sọ ipa rẹ̀ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa sọ pé ète Ọlọ́run kò ṣeé yí padà láìfi èrò ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn sínú ẹsẹ̀ náà
  choice: ète òun kò lè yí padà
  alternative: àìlèyípadà ìmọ̀ràn rẹ̀
  rationale: Ẹsẹ̀ náà tẹnu mọ́ pé ète Ọlọ́run dúró ṣinṣin, kò sì ṣeé yí padà. Ìtumọ̀ tí a yàn jẹ́ kedere, ó sì yẹra fún ọ̀rọ̀ àkànṣe tí ó lè kó ìtumọ̀ míì wọlé.
- issue: Ìtumọ̀ ἐμεσίτευσεν ní ìbáṣepọ̀ pẹ̀lú ìbúra Ọlọ́run
  choice: ó fi ìbúra mú un dájú
  alternative: ó dá sí àárín pẹ̀lú ìbúra
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí dídá sí àárín, ṣùgbọ́n nínú àyíká yìí ipa rẹ̀ ni pé Ọlọ́run fi ìbúra fún àwọn ajogún ní ìmúdájú tó lágbára. Àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ tààrà náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àwọn ajogún’ pa àwòrán ogún inú ọ̀rọ̀ Gíríìkì mọ́; ‘mú un dájú’ sì jẹ́ ọ̀nà àdánidá láti sọ ipa ìbúra náà. A tún fi àmì ẹsẹ̀ ìsàlẹ̀ sí ibi tí ọ̀kọ̀ọ̀kan ìtumọ̀ àfikún bá mu, dípò títẹ̀ lé ìṣètò àmì inú àkójọ Gẹ̀ẹ́sì tí kò bá àwọn àlàyé rẹ̀ mu.
