  source_fidelity: Ìtumọ̀ náà ń tọ́ka sí ìrètí ẹsẹ̀ tí ó ṣáájú, ó sì pa àfiwé ìdákọ̀ró, àwọn ànímọ́ méjì rẹ̀, àti ìwọlé sí apá inú lẹ́yìn aṣọ ìkáwọ́ mọ́. Síbẹ̀, ìtumọ̀ ‘tí ó ní ààbò’ kò rọrùn níbi tí ó ti ń ṣàpèjúwe ìdákọ̀ró; ‘tí ó dájú’ sọ ἀσφαλής ní ti ìgbẹ́kẹ̀lé dáadáa jù. ‘Fún ọkàn’ tún jẹ́ ọ̀nà Yorùbá tí ó hàn gbangba láti fi genitive àwòrán náà hàn.
