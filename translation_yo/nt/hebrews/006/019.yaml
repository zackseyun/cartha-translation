  to: Ìrètí yìí ni a ní gẹ́gẹ́ bí ìdákọ̀ró fún ọkàn, tí ó dájú, tí ó sì fẹsẹ̀ múlẹ̀, tí ó sì ń wọ inú apá inú lẹ́yìn aṣọ ìkáwọ́ náà.[a]
