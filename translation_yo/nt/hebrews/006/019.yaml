source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: yo
  text: Ìrètí yìí ni a ní gẹ́gẹ́ bí ìdákọ̀ró fún ọkàn, tí ó dájú, tí ó sì fẹsẹ̀ múlẹ̀, tí ó sì ń wọ inú apá inú lẹ́yìn aṣọ ìkáwọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “sí apá inú ní òdìkejì aṣọ ìbòjú náà,” tàbí “sí apá inú láàárín aṣọ ìbòjú náà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Ìrètí yìí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ yìí ń tọ́ka padà sí ‘ìrètí’ ní ẹsẹ tó ṣáájú. Ṣíṣe àfihàn rẹ̀ ní kedere bá èdè Yorùbá mu, kò sì yí ohun tí Gíríìkì ń tọ́ka sí padà.
- source_word: ὡς ἄγκυραν
  choice: gẹ́gẹ́ bí ìdákọ̀ró
  rationale: Ó pa àfiwé ìdákọ̀ró mọ́ ní ọ̀nà tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἔχομεν
  choice: ni a ní
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì ṣe àfihàn ìṣe àsìkò ìsinsìnyí.
- source_word: τῆς ψυχῆς
  choice: ọkàn
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni inú tàbí ẹ̀mí ìyè nínú àwòrán yìí; a kò dín ìtumọ̀ rẹ̀ kù sí ìmọ̀lára nìkan.
- source_word: ἀσφαλῆ
  choice: tí ó ní ààbò
  rationale: Ó mú èrò ààbò àti àìléwu inú ọ̀rọ̀ náà jáde, láìdapọ̀ mọ́ ìdúró ṣinṣin tí ọ̀rọ̀ tó tẹ̀ lé ń sọ.
- source_word: τε καὶ
  choice: tí ó ... tí ó sì
  rationale: Ìṣètò yìí so ànímọ́ méjèèjì pọ̀ ní Yorùbá, ó sì jẹ́ kí ọkọọkan hàn gbangba.
- source_word: βεβαίαν
  choice: tí ó sì fẹsẹ̀ múlẹ̀
  rationale: Ó fi ìdúró ṣinṣin àti ìgbẹ́kẹ̀lé hàn, ó sì bá àwòrán ìdákọ̀ró mu.
- source_word: εἰσερχομένην
  choice: tí ó sì wọ inú
  rationale: Gbólóhùn aláṣepọ̀ yìí mú kí ó ṣe kedere pé ìdákọ̀ró náà ni a ń ṣàpèjúwe, ó sì pa ìtẹ̀síwájú àwòrán Gíríìkì mọ́.
- source_word: εἰς τὸ ἐσώτερον
  choice: inú ibi tí ó wà lẹ́yìn
  rationale: Ó sọ ibi inú ilé mímọ́ di mímọ̀ ní Yorùbá láìfi ìtumọ̀ pàtó míì kún un.
- source_word: τοῦ καταπετάσματος
  choice: aṣọ ìkáwọ́ náà
  rationale: ‘Aṣọ ìkáwọ́’ pa àwòrán aṣọ tó ya àwọn apá ibi mímọ́ sọ́tọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ tó ṣeé lóye ní Yorùbá òde òní.
theological_decisions:
- issue: Àwòrán ibi mímọ́ àti aṣọ ìkáwọ́
  choice: inú ibi tí ó wà lẹ́yìn aṣọ ìkáwọ́ náà
  alternative: inú ibi inú aṣọ ìkáwọ́ náà
  rationale: Ìtumọ̀ yìí mú ipò tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ṣe kedere, ṣùgbọ́n kò sọ ní pàtó ju orísun lọ pé ibi wo ni tàbí irú ibi mímọ́ wo ni.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘aṣọ ìkáwọ́’ dípò ọ̀rọ̀ ìjọ àtijọ́ kan, a sì pa àwòrán ìdákọ̀ró àti ibi mímọ́ mọ́.
