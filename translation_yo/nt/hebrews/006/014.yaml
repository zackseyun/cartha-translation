lexical_decisions:
- source_word: λέγων
  choice: ó ní pé
  rationale: Ọ̀rọ̀ àbọ̀ ìṣe yìí ń ṣe àgbékalẹ̀ ohun tí Ọlọ́run sọ nínú ìbúra náà; “ó ní pé” jẹ́ ọ̀nà Yorùbá àdánidá láti darí ọ̀rọ̀ àyọlò wọlé.
- source_word: Εἰ μὴν
  choice: Dájúdájú
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìmúdájú líle nínú èdè ìbúra, kì í ṣe gbólóhùn oníṣ条件; “Dájúdájú” fi agbára ìmúdájú rẹ̀ hàn ní Yorùbá òde òní.
- source_word: εὐλογῶν εὐλογήσω
  choice: èmi yóò bù kún ọ lọ́pọ̀lọpọ̀
  rationale: Àtúnṣe ọ̀rọ̀-ìṣe náà ń fi ìtẹnumọ́ hàn. “Lọ́pọ̀lọpọ̀” mú ìtẹnumọ́ náà wọ Yorùbá àdánidá, nígbà tí “bù kún ọ” pa ìtumọ̀ ìbùkún mọ́.
- source_word: σε
  choice: ọ
  rationale: Arọ́pò-orúkọ ẹni kejì ẹyọ kan ni, ó ń tọ́ka sí Ábúráhámù.
- source_word: καὶ
  choice: èmi yóò sì
  rationale: “Sì” so àwọn ìlérí méjèèjì pọ̀; àtúnṣe “èmi yóò” tún pa ìwọ̀ntúnwọ̀nsì gbólóhùn Gíríìkì mọ́.
- source_word: πληθύνων πληθυνῶ σε
  choice: èmi yóò sì sọ ọ di púpọ̀ gidigidi
  rationale: “Sọ ọ di púpọ̀” tẹ̀lé ìṣe pé Ọlọ́run yóò mú un pọ̀ sí i, “gidigidi” sì gbé ìtẹnumọ́ tó wà nínú àtúnṣe ọ̀rọ̀-ìṣe náà jáde láìsọ ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìlànà ìtẹnumọ́ inú ìbúra tí a fa yọ láti inú ìlérí fún Ábúráhámù
  choice: Lo Yorùbá àdánidá pẹ̀lú “lọ́pọ̀lọpọ̀” àti “gidigidi,” kí a sì ṣàlàyé àtúnṣe gangan nínú àlàyé ìsàlẹ̀.
  alternative: Túmọ̀ ọ́ ní ìlànà gangan pé, “ní bíbùkún, èmi yóò bù kún ọ; àti ní mímú pọ̀, èmi yóò mú ọ pọ̀.”
  rationale: Gíríìkì fara wé ìtẹnumọ́ èdè Hébérù/LXX nínú Jẹ́nẹ́sísì 22:17. Ìbámu tó péye ń béèrè Yorùbá tó ṣeé lóye nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n ó yẹ kí àlàyé ìsàlẹ̀ pa ìrísí orísun àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Jẹ́nẹ́sísì mọ́.
translation_notes:
  register: Yorùbá Mánigbàgbé tí ó ní àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. Lílo “èmi” ní ìlérí méjèèjì ń fi ìtẹnumọ́ àti ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ orísun hàn.
