translation:
  language: yo
  text: ó wí pé[a], “Dájúdájú, èmi yóò bù kún ọ gidigidi, èmi yóò sì mú ọ pọ̀ sí i gidigidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “ní bíbùkún, èmi yóò bù kún ọ; àti ní mímú pọ̀, èmi yóò mú ọ pọ̀ sí i.” Àtúnlò ọ̀rọ̀-ìṣe yìí jẹ́ ọ̀nà ìtẹnumọ́, ó sì ń fa ọ̀rọ̀ inú Jẹ́nẹ́sísì 22:17 yọ.'
