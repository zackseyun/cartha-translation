id: HEB.6.16
reference: Hebrews 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: yo
  text: Nítorí àwọn ènìyàn máa ń fi ẹni tí ó ga ju wọn lọ búra, ìbúra sì ni òpin gbogbo àríyànjiyàn fún wọn, fún ìmúdájú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ἀντιλογία sí “àtakò” tàbí “awuyewuye”; “àríyànjiyàn” ni a lò níbí nítorí ọ̀rọ̀ náà ń tọ́ka sí ìfẹ̀hónúhàn tàbí ìjàmbá ọ̀rọ̀ tí ìbúra ń mú dópin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; ‘àwọn ènìyàn’ jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ gbogbogbò yìí.
- source_word: κατὰ τοῦ μείζονος
  choice: ẹni tí ó tóbi ju wọn lọ
  rationale: κατά pẹ̀lú genitive nínú ọ̀rọ̀ ìbúra túmọ̀ sí fífi ẹni tí ó ga jù lọ ṣe ẹlẹ́rìí; gbolohun yìí pa agbára ìfiwéra μείζονος mọ́ láìsọ ẹni pàtó tí Gíríìkì kò dárúkọ.
- source_word: ὀμνύουσιν
  choice: máa ńfi ... búra
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń búra ní orúkọ tàbí nípa ẹni tí ó ga jù ú lọ; ‘máa ń’ fi hàn pé òwe nípa ìṣe gbogbogbò ni.
- source_word: πάσης ... ἀντιλογίας
  choice: gbogbo àríyànjiyàn
  rationale: ἀντιλογία níbí jẹ́ àríyànjiyàn tàbí ọ̀rọ̀ tí àwọn méjì ń tako ara wọn lórí, kì í ṣe ìtakora ọgbọ́n lásán.
- source_word: πέρας
  choice: òpin
  rationale: ‘Òpin’ pa àwòrán gangan ti πέρας mọ́, ó sì bá ìtumọ̀ ohun tí ń mú àríyànjiyàn dópin mu.
- source_word: εἰς βεβαίωσιν
  choice: láti fi ọ̀rọ̀ náà múlẹ̀
  rationale: 'Gbolohun yìí fi ète tàbí àbájáde εἰς + accusative hàn ní Yorùbá àdánidá: ìbúra ń jẹ́rìí sí i, ó sì ń mú ọ̀rọ̀ tí a sọ dájú.'
- source_word: ὁ ὅρκος
  choice: ìbúra náà
  rationale: Àfihàn náà ń tọ́ka padà sí ìṣe búra tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ‘ìbúra náà’ jẹ́ àdánidá, ó sì ṣe àfihàn article Gíríìkì.
theological_decisions:
- issue: Ìtọ́kasí gbogbogbò sí aráyé nínú òwe
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: ἄνθρωποι jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn ẹ̀dá ènìyàn, kì í ṣe akọ nìkan; yíyan ‘àwọn ènìyàn’ kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- issue: Ìṣẹ̀ṣe ìbúra gẹ́gẹ́ bí ohun tí ń mú àríyànjiyàn dópin
  choice: ìbúra náà sì ni òpin gbogbo àríyànjiyàn fún wọn, láti fi ọ̀rọ̀ náà múlẹ̀
  alternative: ìbúra ni ìmúdájú tí ó parí gbogbo àríyànjiyàn
  rationale: 'Ìtumọ̀ tí a yàn pa ìtòlẹ́sẹẹsẹ àti ìnira díẹ̀ ti Gíríìkì mọ́: πέρας (‘òpin’) àti εἰς βεβαίωσιν (‘láti fi ... múlẹ̀’) dúró lọ́tọ̀, láìdá wọn pọ̀ sí ìtumọ̀ kan ṣoṣo.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Máa ńfi ... búra’ jẹ́ àṣà èdè Yorùbá fún ìbúra nípa ẹni tí ó ga ju ẹni tó ń búra lọ. Àmì ẹsẹ̀ [a] wà nínú ọ̀rọ̀ pàtàkì, ó sì ṣàlàyé ààyè ìtumọ̀ ἀντιλογία àti ìtòlẹ́sẹẹsẹ apá ìkẹyìn.
