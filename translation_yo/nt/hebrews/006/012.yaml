id: HEB.6.12
reference: Hebrews 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: yo
  text: kí ẹ má bàa di onílọ́ra, ṣùgbọ́n kí ẹ jẹ́ aláfarawé àwọn tí wọ́n ń jogún àwọn ìlérí náà nípasẹ̀ ìgbàgbọ́[a] àti sùúrù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nípasẹ̀ ìṣòtítọ́ àti sùúrù.” Ọ̀rọ̀ Gíríìkì fún “ìgbàgbọ́” tún lè túmọ̀ sí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé” nínú àwọn àyíká kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: onílọ́ra
  rationale: Ọ̀rọ̀ yìí sọ nípa jíjẹ́ ọlọ́ra tàbí aláìyára láti dáhùn àti láti ṣe ohun tó yẹ. “Onílọ́ra” bá ọ̀rọ̀ ìtakuntakun tó yí ẹsẹ yìí ká mu, kò sì le bí “ọ̀lẹ” tó lè dà bí ìdájọ́ ìwà.
- source_word: γένησθε
  choice: di
  rationale: '“Di” fi ìtumọ̀ ìbẹ̀rẹ̀ ipò tuntun hàn: ìkìlọ̀ ni pé kí wọn má ṣe bọ́ sínú ipò jíjẹ́ onílọ́ra, kì í ṣe àpèjúwe ipò wọn lásán.'
- source_word: μιμηταὶ
  choice: aláfarawé
  rationale: “Aláfarawé” pa ìtumọ̀ títẹ̀lé àpẹẹrẹ àwọn ẹlòmíràn mọ́ ní èdè Yorùbá tó ṣe déédéé.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún πίστις, ó sì lè gbé ìtumọ̀ gbígbẹ́kẹ̀lé Ọlọ́run. Àmì àlàyé pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́.
- source_word: μακροθυμίας
  choice: sùúrù
  rationale: “Sùúrù” jẹ́ ọ̀rọ̀ àdánidá, òde òní fún fífaradà pẹ̀lú ìdúró de ohun kan fún ìgbà pípẹ́.
- source_word: κληρονομούντων
  choice: àwọn tí wọ́n ń jogún
  rationale: “Ń jogún” pa àwòrán ogún àti ìrísí participle ìsinsìnyí mọ́, ó sì ṣàpèjúwe irú àwọn ènìyàn wọ̀nyí.
- source_word: τὰς ἐπαγγελίας
  choice: àwọn ìlérí náà
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, “náà” sì tọ́ka sí àwọn ìlérí tí a mọ̀ nínú àyíká ọ̀rọ̀ náà.
- source_word: ἵνα μὴ
  choice: kí ẹ má bàa
  rationale: Gbólóhùn yìí so ẹsẹ náà mọ́ ìgbaniníyàn ẹsẹ tó ṣáájú, ó sì fi ète tàbí àbájáde tí a fẹ́ yẹra fún hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ìgbaniníyàn yìí
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: “Ìgbàgbọ́” pa ìtumọ̀ tó gbòòrò àti lílò ọ̀rọ̀ náà tó wọ́pọ̀ nínú Ìwé Mímọ́ mọ́. Nítorí πίστις tún lè tẹnu mọ́ ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́ ní àwọn àyíká kan, a kò fi ìtumọ̀ kan ṣoṣo tipátipá; a fi àwọn àṣàyàn náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kí ẹ má bàa” láti so ẹsẹ náà mọ́ ohun tó ṣáájú, “aláfarawé” sì pa ìpè láti tẹ̀lé àpẹẹrẹ àwọn olóòótọ́ mọ́.
