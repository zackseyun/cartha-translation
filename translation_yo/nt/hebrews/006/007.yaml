reference: Hebrews 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: yo
  text: Nítorí ilẹ̀ tí ó mu òjò tí ń rọ̀ sórí rẹ̀ lọ́pọ̀ ìgbà, tí ó sì ń hù ewéko[a] tí ó wúlò fún àwọn ẹni tí a tún ń ro ilẹ̀ náà nítorí wọn[b], ń gba ìbùkún láti ọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ohun ọ̀gbìn,” “koríko,” tàbí “èso oko.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lè túmọ̀ apá yìí pé, “fún àwọn tí wọ́n ń ro ilẹ̀ náà”; ṣùgbọ́n “fún àwọn ẹni tí a ń ro ilẹ̀ náà nítorí wọn” dára sí i fún διά pẹ̀lú accusative níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: ilẹ̀
  rationale: Nínú àkàwé iṣẹ́ àgbẹ̀ yìí, “ilẹ̀” túmọ̀ sí ilẹ̀ tí a lè ro, láì mú ìtumọ̀ gbòòrò bí ayé wá sínú rẹ̀.
- source_word: πιοῦσα
  choice: tí ó mu
  rationale: Èyí pa àwòrán alààyè náà mọ́ pé ilẹ̀ ń “mu” òjò, dípò gbólóhùn tí kò ní àwòrán bí “gba omi wọ inú rẹ̀.”
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: òjò tí ń rọ̀ sórí rẹ̀ lọ́pọ̀ ìgbà
  rationale: Ó sọ ἐπ’ αὐτῆς àti πολλάκις ní Yorùbá àdánidá, ó sì jẹ́ kí ìṣe tí ń ṣẹlẹ̀ léraléra hàn.
- source_word: τίκτουσα
  choice: tí ó sì ń hù
  rationale: “Ń hù” jẹ́ ọ̀rọ̀ àdánidá nípa ilẹ̀ tí ń mú ewéko jáde, ó sì pa ìtumọ̀ ìmújáde mọ́.
- source_word: βοτάνην
  choice: ewéko
  rationale: “Ewéko” gbòòrò tó láti gba ohun ọ̀gbìn tàbí koríko, láì fi dandan sọ pé irúgbìn oko kan pàtó ni.
- source_word: εὔθετον
  choice: tí ó wúlò
  rationale: Ó mú ìtumọ̀ ohun tí ó yẹ tàbí tí ó ní ìlò hàn ní kedere nínú àyíká iṣẹ́ àgbẹ̀.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: fún àwọn tí a sì ń ro ilẹ̀ náà nítorí wọn
  rationale: Àṣàyàn yìí gba διά pẹ̀lú ọ̀rọ̀-orúkọ accusative gẹ́gẹ́ bí ìdí tàbí àǹfààní—“nítorí wọn”—dípò lílo rẹ̀ gẹ́gẹ́ bí ẹni tí ó ṣe iṣẹ́ náà. “Sì” tún fi καί hàn.
- source_word: γεωργεῖται
  choice: a ń ro ilẹ̀ náà
  rationale: “Ro ilẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ṣíṣe iṣẹ́ lórí ilẹ̀ fún ìgbẹ̀, tí ó bá passive Gíríìkì mu.
- source_word: μεταλαμβάνει
  choice: ń gba
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ilẹ̀ ń gba ìbùkún; èyí ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: ìbùkún láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa orísun ìbùkún mọ́ ní kedere, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Àkàwé iṣẹ́ àgbẹ̀ nínú àyíká ìkìlọ̀
  choice: Pa àkàwé náà mọ́ bí ó ṣe wà, láì ṣàlàyé ẹni tí ilẹ̀ tàbí ewéko dúró fún.
  alternative: Túmọ̀ rẹ̀ lọ́nà tí yóò sọ pé àwọn onígbàgbọ́ tòótọ́ tàbí àwọn onígbàgbọ́ aláso ni a ń tọ́ka sí.
  rationale: Ẹsẹ yìí sọ apá rere àkàwé iṣẹ́ àgbẹ̀. Gíríìkì kò yanju àwọn àríyànjiyàn nípa ìfaradà tàbí ìṣubú kúrò nínú ìgbàgbọ́, nítorí náà ìtumọ̀ kò gbọ́dọ̀ fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà pa àwòrán pé ilẹ̀ ń “mu” òjò mọ́, ó sì lo àwọn ọ̀rọ̀ iṣẹ́ àgbẹ̀ tí òǹkàwé òde òní lè lóye.
