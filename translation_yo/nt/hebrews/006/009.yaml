id: HEB.6.9
reference: Hebrews 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: yo
  text: Ṣùgbọ́n, ẹ̀yin olùfẹ́, a ní ìdánilójú nípa yín pé ẹ ní àwọn ohun tí ó sàn jù lọ—àwọn ohun tí ó jẹ́ ti ìgbàlà[a]—bí ó tilẹ̀ jẹ́ pé a ń sọ̀rọ̀ lọ́nà yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tí ó ń bá ìgbàlà rìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: ó dá wa lójú
  rationale: Ọ̀rọ̀ yìí fi ìdánilójú tí ó ti fìdí múlẹ̀ hàn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára perfect tense mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà oníyàtọ̀ hàn lẹ́yìn ìkìlọ̀ líle tí ó ṣáájú.
- source_word: περὶ ὑμῶν
  choice: ní ti tiyín
  rationale: Ó túmọ̀ περί pẹ̀lú genitive ní ọ̀nà Yorùbá tí ó ṣe kedere, láìṣe àfikún ìtumọ̀.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ó pa ìfẹ́ àti ọlá inú vocative náà mọ́, ó sì jẹ́ èdè tí àwọn òǹkàwé òde òní lè lóye.
- source_word: τὰ κρείσσονα
  choice: àwọn ohun tí ó sàn jù bẹ́ẹ̀ lọ
  rationale: Ó pa ìtumọ̀ afiwéra mọ́, ó sì tọ́ka sí àwọn ohun tí ó sàn ju ohun tí ìkìlọ̀ tó ṣáájú ṣàpèjúwe lọ.
- source_word: ἐχόμενα σωτηρίας
  choice: àwọn ohun tí ó jẹ́ ti ìgbàlà
  rationale: Ó fi ìbáṣepọ̀ àwọn ohun náà pẹ̀lú ìgbàlà hàn láìpinnu pé wọ́n jẹ́ ẹ̀rí, àbájáde, tàbí ohun tí ń mú ìgbàlà wá.
- source_word: εἰ καὶ
  choice: bí ó tilẹ̀ jẹ́ pé
  rationale: Ó ṣe àfihàn concessive force náà ní Yorùbá àdánidá.
- source_word: οὕτως λαλοῦμεν
  choice: a ń sọ̀rọ̀ lọ́nà yìí
  rationale: Ó tọ́ka sí irú ọ̀nà líle tí òǹkọ̀wé gbà sọ ìkìlọ̀ tó ṣáájú, láìṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Ìbáṣepọ̀ ἐχόμενα pẹ̀lú σωτηρίας nínú àyíká ọ̀rọ̀ ìkìlọ̀
  choice: àwọn ohun tí ó jẹ́ ti ìgbàlà
  alternative: àwọn ohun tí ó ń bá ìgbàlà rìn / àwọn ohun tí ó so mọ́ ìgbàlà
  rationale: Èdè Gíríìkì fi hàn pé àwọn ohun wọ̀nyí ní ìbáṣepọ̀ pẹ̀lú ìgbàlà, ṣùgbọ́n kò sọ pàtó bóyá wọ́n jẹ́ ẹ̀rí rẹ̀, ohun tí ń tẹ̀ lé e, tàbí àbájáde rẹ̀. Ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn láti lóye. “Ẹ̀yin olùfẹ́” pa ìmọ̀lára ìfẹ́ inú ἀγαπητοί mọ́; àmì ìdádúró gígùn yà àlàyé nípa ìgbàlà sọ́tọ̀ láìyi ìṣàn gbólóhùn padà.
