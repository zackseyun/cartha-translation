id: HEB.4.9
reference: Hebrews 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: yo
  text: Nítorí náà, ìsinmi Sábáàtì[a] ṣì wà fún àwọn ènìyàn Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pípa Sábáàtì mọ́.” Ọ̀rọ̀ Gíríìkì σαββατισμός kò wọ́pọ̀, ó sì ń tọ́ka sí Sábáàtì ní kedere; níhìn-ín, ó ṣeé ṣe kí ó túmọ̀ sí ìsinmi tí ó dà bí ti Sábáàtì, tí ó ṣì wà fún àwọn ènìyàn Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ọ̀rọ̀ yìí ń fa ìparí ọ̀rọ̀ jáde láti inú àríyànjiyàn tó ṣáájú; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìtumọ̀ yẹn mọ́.
- source_word: ἀπολείπεται
  choice: ṣì wà
  rationale: Ìṣe ọ̀rọ̀ náà fi hàn pé ohun tí a ń sọ̀rọ̀ rẹ̀ kò tíì dópin, ó sì ṣì wà nílẹ̀ fún àwọn ènìyàn Ọlọ́run.
- source_word: σαββατισμός
  choice: ìsinmi Sábáàtì
  rationale: Ọ̀rọ̀ Gíríìkì tí kò wọ́pọ̀ yìí ní ìbátan kedere pẹ̀lú Sábáàtì, ó sì lè túmọ̀ sí ìsinmi tàbí pípa Sábáàtì mọ́. “Ìsinmi Sábáàtì” pa ìbátan yẹn àti kókó ọ̀rọ̀ ìsinmi nínú Hébérù 3–4 mọ́.
- source_word: τῷ λαῷ
  choice: fún àwọn ènìyàn
  rationale: Dative náà ń tọ́ka sí ẹni tí ìsinmi náà wà fún; “fún àwọn ènìyàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsọ̀rí genitive náà sọ ìbátan àti jíjẹ́ ti Ọlọ́run; “àwọn ènìyàn Ọlọ́run” jẹ́ ọ̀nà Yorùbá ṣókí àti àdánidá.
theological_decisions:
- issue: Ìtumọ̀ σαββατισμός nínú Hébérù 4:9
  choice: Ìsinmi tí ó ní ìbátan kedere pẹ̀lú Sábáàtì, tí ó ṣì wà fún àwọn ènìyàn Ọlọ́run.
  alternative: Pípa Sábáàtì mọ́ ní ti gidi; tàbí ìsinmi ẹ̀mí lásán tí kò ní ìbátan pẹ̀lú Sábáàtì.
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ ń mú Sábáàtì wá sí ọkàn, àyíká ọ̀rọ̀ náà sì so ìsinmi Ọlọ́run, ọjọ́ keje, àti ìsinmi tí a ṣèlérí pọ̀. “Ìsinmi Sábáàtì” kò sọ ọ́ di àṣẹ ọ̀sẹ̀ kan ṣoṣo, bẹ́ẹ̀ ni kò mú ìró Sábáàtì kúrò nínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A lo “ṣì wà” láti fi ìtẹ̀síwájú tó wà nínú ἀπολείπεται hàn.
