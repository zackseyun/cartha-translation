id: HEB.4.12
reference: Hebrews 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: yo
  text: Nítorí ọ̀rọ̀ Ọlọ́run wà láàyè, ó sì ń ṣiṣẹ́; ó mú ju idà olójú méjì èyíkéyìí lọ. Ó ń wọnú dé ibi pípín ọkàn àti ẹ̀mí, àwọn ìsopọ̀ egungun àti ọ̀rá inú egungun[a]; ó sì lè ṣe ìdájọ́ lórí àwọn èrò àti ète ọkàn-àyà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn “ọkàn àti ẹ̀mí, àwọn ìsopọ̀ egungun àti ọ̀rá inú egungun” ń tẹnumọ́ bí ọ̀rọ̀ Ọlọ́run ṣe ń wọnú ohun tó jinlẹ̀ jù lọ; kò fi dandan kọ́ wa pé àwọn wọ̀nyí jẹ́ apá ẹ̀dá ènìyàn tí a lè yà sọ́tọ̀ gẹ́gẹ́ bí ẹ̀kọ́ kan pàtó.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó sì lè ṣàyẹ̀wò àwọn èrò àti ète ọkàn-àyà.” Ọ̀rọ̀ Gíríìkì náà ní èrò yíyẹ ohun wò àti dídájọ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: wà láàyè
  rationale: Ó fi hàn pé ọ̀rọ̀ Ọlọ́run ní ìyè, ó sì ń bá a lọ láti máa ṣiṣẹ́; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti λόγος mọ́ láì fi dandan sọ ọ́ di Ìwé Mímọ́ nìkan, ọ̀rọ̀ ìwàásù nìkan, tàbí ẹni kan pàtó.
- source_word: ἐνεργὴς
  choice: ń ṣiṣẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ọ̀rọ̀ náà dejú iṣẹ́, kì í ṣe ohun aláìṣiṣẹ́.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: ó mú ju idà olójú méjì èyíkéyìí lọ
  rationale: “Mú” jẹ́ ọ̀rọ̀ àdánidá fún ohun tó lẹ́gbẹ́, “idà olójú méjì” sì pa àwòrán ohun ìjà tó lè gé ní ẹ̀gbẹ́ méjèèjì mọ́.
- source_word: διϊκνούμενος
  choice: Ó ń wọnú
  rationale: Ó fi ìṣípò tó ń lọ lọ́wọ́ àti wíwọlé jinlẹ̀ hàn, ní ìbámu pẹ̀lú àwòrán idà.
- source_word: ἄχρι μερισμοῦ
  choice: dé ibi pípín
  rationale: Ó pa èrò ìwọ̀n jíjinlẹ̀ àti pípín mọ́ láì pinnu ní pàtó bóyá ohun méjèèjì ni a ń yà sọ́tọ̀ tàbí pé ọ̀rọ̀ náà ń wọnú ibi tí pípín ti lè dé.
- source_word: ψυχῆς καὶ πνεύματος
  choice: ọkàn àti ẹ̀mí
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tí kò sì fi èrò ẹ̀kọ́ kan pàtó lé bí ẹ̀dá ènìyàn ṣe pín sí.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: oríkèé àti ọ̀rá inú egungun
  rationale: “Oríkèé” túmọ̀ sí ibi tí egungun ti pàdé; “ọ̀rá inú egungun” jẹ́ ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye marrow ní kedere.
- source_word: κριτικὸς
  choice: ó sì lè ṣe ìdájọ́ lórí
  rationale: Ó ṣàfihàn agbára láti yẹ ohun inú wò, láti mọ ohun tó jẹ́, àti láti dá a lẹ́jọ́, láì dín ọ̀rọ̀ náà kù sí ìmọ̀lára lásán.
- source_word: ἐνθυμήσεων
  choice: àwọn èrò
  rationale: Ó mú àwọn ìrònú inú tàbí ìgbèrò ọkàn ní ọ̀nà tó rọrùn fún òǹkàwé.
- source_word: ἐννοιῶν
  choice: ète
  rationale: Ó yà ọ̀rọ̀ yìí sọ́tọ̀ kúrò lọ́dọ̀ “èrò” nípa títẹnumọ́ ohun tí ọkàn pinnu tàbí ń lépa.
- source_word: καρδίας
  choice: ọkàn-àyà
  rationale: Ó tọ́ka sí inú ẹni—ibi ìrònú, ète àti ìfẹ́—kì í ṣe ẹ̀yà ara nìkan; ó tún yà á sọ́tọ̀ kúrò lọ́dọ̀ ψυχή tí a túmọ̀ sí “ọkàn.”
theological_decisions:
- issue: Ohun tí “ọ̀rọ̀ Ọlọ́run” ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “ọ̀rọ̀ Ọlọ́run.”
  alternative: Ìwé Mímọ́ nìkan; ọ̀rọ̀ ìlérí tàbí ìdájọ́ tí Ọlọ́run sọ; Ọmọ/Ọ̀rọ̀ ẹni.
  rationale: Àyíká Hébérù tẹnumọ́ Ọlọ́run tó ń sọ̀rọ̀ àti agbára ọ̀rọ̀ rẹ̀, ṣùgbọ́n Gíríìkì kò fi dandan yan ìtumọ̀ kan ṣoṣo nínú àwọn wọ̀nyí.
- issue: Ìtumọ̀ “ọkàn àti ẹ̀mí” fún bí ẹ̀dá ènìyàn ṣe rí
  choice: A pa àwọn ọ̀rọ̀ méjèèjì mọ́ láì sọ pé wọ́n jẹ́ àwọn apá ara ẹni tí a lè yà sọ́tọ̀ gẹ́gẹ́ bí ẹ̀kọ́ kan pàtó.
  alternative: Kí a ka a sí ẹ̀rí dandan pé ènìyàn ní apá méjì tàbí mẹ́ta ọ̀tọ̀ọ̀tọ̀.
  rationale: Àwòrán inú ẹsẹ náà ń tẹnumọ́ bí ọ̀rọ̀ Ọlọ́run ṣe ń wọnú ohun tó jinlẹ̀ jù lọ; kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ nípa ìṣètò ẹ̀dá ènìyàn kún un.
- issue: Ìbáṣepọ̀ “ọkàn àti ẹ̀mí” àti “oríkèé àti ọ̀rá inú egungun” pẹ̀lú “pípín”
  choice: A pa ìtẹ̀lé àwọn gbólóhùn Gíríìkì mọ́, kí “dé ibi pípín” lè ní ìfarahàn rẹ̀ lórí àwọn àkójọpọ̀ méjèèjì.
  alternative: Kí a sọ ní pàtó pé ọ̀rọ̀ náà ń ya ọkàn kúrò lọ́dọ̀ ẹ̀mí, àti oríkèé kúrò lọ́dọ̀ ọ̀rá inú egungun.
  rationale: Ìlànà Gíríìkì lè mú èrò yíyà sọ́tọ̀ wá, ṣùgbọ́n àkọ́kọ́ rẹ̀ ni jíjinlẹ̀ tí ọ̀rọ̀ náà ń dé; ìtumọ̀ kò gbọ́dọ̀ tú àìdánilójú yìí tán nípasẹ̀ àlàyé tó lé ju.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. A lo ìṣe aláìparí “ń ṣiṣẹ́/ń wọnú” láti fi agbára tí ń bá a lọ hàn. Àwòrán idà àti ìtẹ̀lé àwọn ohun inú àti ti ara ni a pa mọ́, ṣùgbọ́n a yẹra fún ọ̀rọ̀ imọ̀-ẹ̀kọ́ tí kò wọ́pọ̀ àti fún ṣíṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò fi dandan sọ.
