- from: Nítorí ọ̀rọ̀ Ọlọ́run wà láàyè, ó sì ń ṣiṣẹ́; ó mú ju idà olójú méjì èyíkéyìí lọ. Ó ń wọnú dé ibi pípín ọkàn àti ẹ̀mí, oríkèé àti ọ̀rá inú egungun[a]; ó sì lè ṣe ìdájọ́ lórí àwọn èrò àti ète ọkàn-àyà.[b]
  to: Nítorí ọ̀rọ̀ Ọlọ́run wà láàyè, ó sì ń ṣiṣẹ́; ó mú ju idà olójú méjì èyíkéyìí lọ. Ó ń wọnú dé ibi pípín ọkàn àti ẹ̀mí, àwọn ìsopọ̀ egungun àti ọ̀rá inú egungun[a]; ó sì lè ṣe ìdájọ́ lórí àwọn èrò àti ète ọkàn-àyà.[b]
