    issue: “Oríkèé” is too specific for ἁρμῶν.
    rationale: In ordinary Yoruba usage, oríkèé refers specifically to the knee/knee joint. The Greek plural ἁρμῶν refers broadly to joints/articulations, so the translation should not restrict the image to knees.
