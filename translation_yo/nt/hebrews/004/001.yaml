id: HEB.4.1
reference: Hebrews 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí a bẹ̀rù[a], kí ẹnikẹ́ni nínú yín má bàa dà bí ẹni tí ó ti kùnà láti dé ibẹ̀[c], nígbà tí ìlérí láti wọ inú ìsinmi rẹ̀ ṣì dúró[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ẹ jẹ́ kí ẹ̀rù bà wá.’ Ọ̀rọ̀ Gíríìkì náà lágbára ju ‘ẹ jẹ́ kí a ṣọ́ra’ lọ, ó sì pa ìwúwo ìkìlọ̀ náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀nà tí ó tẹ̀ lé ìṣètò Gíríìkì pẹ́kípẹ́kí, a lè sọ pé, ‘nígbà tí ìlérí wíwọ inú ìsinmi rẹ̀ ṣì wà.’ Gbólóhùn Gíríìkì náà kúkúrú, ó sì lè gba ìtumọ̀ yìí.
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ó lè dà bí ẹni tí kò dé ibẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: ẹ jẹ́ kí a bẹ̀rù
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ìṣírí àṣẹ sí gbogbo ẹgbẹ́, ó sì lágbára ju ‘ẹ jẹ́ kí a ṣọ́ra’ lọ; ‘ẹ jẹ́ kí a bẹ̀rù’ pa ìkìlọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tí ó ṣáájú hàn, nípa bí Ísírẹ́lì ṣe kùnà láti wọ inú ìsinmi.
- source_word: μήποτε
  choice: kí ó má bàa jẹ́ pé
  rationale: Ó ṣàfihàn ohun búburú tí ìṣírí náà ń kìlọ̀ pé kí a yẹra fún un.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: nígbà tí ìlérí ... ṣì dúró
  rationale: 'Gbólóhùn náà fi ipò tí ó ń bá ìkìlọ̀ náà lọ lẹ́gbẹ̀ẹ́ hàn: ìlérí náà ṣì wà ní ipò rẹ̀, kò tíì parí tàbí di asán.'
- source_word: εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: láti wọ inú ìsinmi rẹ̀
  rationale: Ó pa àwòrán wíwọlé àti arọ́pò-orúkọ ‘rẹ̀’ mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó pọ̀ sí i kún un.
- source_word: δοκῇ
  choice: dà bí ẹni pé
  rationale: Ó pa ìtumọ̀ ìfarahàn tàbí bí ohun kan ṣe dà mọ́, láì pinnu bóyá ìfarahàn lásán ni tàbí ìdájọ́ tó dájú.
- source_word: τις ἐξ ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Ó pa agbára ẹni kọ̀ọ̀kan nínú ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá àdánidá.
- source_word: ὑστερηκέναι
  choice: ó ti kùnà láti dé ibẹ̀
  rationale: Ó sọ ìkùnà láti dé ibi tí a ṣèlérí ní kedere, ó sì pa ipa perfect infinitive mọ́ pẹ̀lú ‘ó ti kùnà.’
theological_decisions:
- issue: Bóyá kí a rọ ìkìlọ̀ náà sí ṣíṣọ́ra lásán tàbí kí a pa ìbẹ̀rù gidi mọ́
  choice: ẹ jẹ́ kí a bẹ̀rù
  alternative: ẹ jẹ́ kí a ṣọ́ra
  rationale: Φοβηθῶμεν sọ ìbẹ̀rù ní tààrà; a kò gbọ́dọ̀ dín agbára ìkìlọ̀ náà kù tàbí fi ojútùú ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí nípa ìfaradà tàbí ìṣubú kúrò nínú ìgbàgbọ́.
- issue: Bóyá kí a túmọ̀ ‘ìsinmi rẹ̀’ ní pàtó gẹ́gẹ́ bí ìsinmi Ọlọ́run ti ọjọ́ iwájú
  choice: ìsinmi rẹ̀
  alternative: ìsinmi Ọlọ́run; ìsinmi Sábáàtì rẹ̀
  rationale: Àyíká ọ̀rọ̀ fi ẹni tí ‘rẹ̀’ ń tọ́ka sí hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo arọ́pò-orúkọ; fífi ‘rẹ̀’ sílẹ̀ pa ọ̀rọ̀ orísun àti ìṣòro ìtumọ̀ inú orí náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ jẹ́ kí a’ fún ìṣírí ẹgbẹ́, ‘ìsinmi’ fún κατάπαυσις, a sì pa ìfarahàn inú δοκῇ mọ́ pẹ̀lú ‘dà bí ẹni pé.’
