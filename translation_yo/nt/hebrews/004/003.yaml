id: HEB.4.3
reference: Hebrews 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: yo
  text: 'Nítorí àwa tí a ti gbàgbọ́ ń wọ inú ìsinmi náà, gẹ́gẹ́ bí ó ti wí pé: “Gẹ́gẹ́ bí mo ti búra nínú ìbínú mi pé, ‘Bí wọn yóò bá wọ inú ìsinmi mi,’”[a] bí ó tilẹ̀ jẹ́ pé àwọn iṣẹ́ rẹ̀ ti parí láti ìgbà ìpilẹ̀ ayé.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó túmọ̀ ní tààrà pé, “Bí wọn yóò bá wọ inú ìsinmi mi.” Èyí jẹ́ àgbékalẹ̀ ìbúra tó túmọ̀ sí pé, “Dájúdájú, wọn kì yóò wọ inú ìsinmi mi,” tàbí, “Wọn kì yóò wọ inú ìsinmi mi láéláé.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn iṣẹ́ rẹ̀ ti ṣẹ láti ìgbà ìpilẹ̀ ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: ń wọ inú
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà ní agbára ohun tó ń ṣẹlẹ̀ tàbí tó jẹ́ òtítọ́ fún àwọn onígbàgbọ́; ‘ń wọ inú’ pa ìfọkànsìn ìsinsìnyí mọ́ láì sọ ọ́ di ohun ọjọ́ iwájú nìkan.
- source_word: κατάπαυσιν
  choice: ìsinmi náà
  rationale: ‘Ìsinmi’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún cessation/rest, ‘náà’ sì tọ́ka sí ìsinmi pàtó tí àyíká ọ̀rọ̀ ti ń jíròrò.
- source_word: οἱ πιστεύσαντες
  choice: àwa tí a ti gbàgbọ́
  rationale: Èyí pa aorist participle mọ́ gẹ́gẹ́ bí ìgbàgbọ́ tí a ti ní, ó sì pa ìfikún ara onkọ̀wé mọ́ nínú ‘àwa.’
- source_word: καθὼς εἴρηκεν
  choice: gẹ́gẹ́ bí ó ti wí
  rationale: ‘Ó ti wí’ fi perfect náà hàn bí ọ̀rọ̀ tí a ti sọ tí agbára rẹ̀ ṣì dúró.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Gẹ́gẹ́ bí mo ti búra nínú ìbínú mi
  rationale: ‘Búra’ mú ìtumọ̀ ìbúra wọ̀nyí jáde, ‘ìbínú’ sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ὀργή nínú ọ̀rọ̀ ìdájọ́.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Bí wọn yóò bá wọ inú ìsinmi mi
  rationale: A pa irisi gírámà Gíríìkì ti àgbékalẹ̀ ìbúra Semitic mọ́ nínú ọ̀rọ̀ àkọ́kọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé agbára rẹ̀ jẹ́ ìkọ̀ pátápátá.
- source_word: καίτοι
  choice: bí ó tilẹ̀ jẹ́ pé
  rationale: Èyí fi ìyàtọ̀ concession hàn lọ́nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: àwọn iṣẹ́ rẹ̀ ti parí
  rationale: Genitive absolute náà tọ́ka sí pé iṣẹ́ Ọlọ́run ti dé òpin; ‘rẹ̀’ jẹ́ ohun tí àyíká ọ̀rọ̀ fi hàn.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: láti ìgbà ìpilẹ̀ ayé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé láti ìgbà tí a dá ayé sílẹ̀.
theological_decisions:
- issue: Agbára àgbékalẹ̀ ìbúra inú Sáàmù 95
  choice: Pa ‘Bí wọn yóò bá wọ inú ìsinmi mi’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, kí àlàyé [a] sọ agbára ìkọ̀ rẹ̀.
  alternative: ‘Wọn kì yóò wọ inú ìsinmi mi láéláé.’
  rationale: Ọ̀nà yìí pa ìrísí àdììtú gidi ti Gíríìkì mọ́, kò sì fi ìtumọ̀ àṣà ìbúra náà pamọ́ fún òǹkàwé.
- issue: Ìgbà tí àwọn onígbàgbọ́ ń wọ inú ìsinmi
  choice: Lo ìsinsìnyí ‘ń wọ inú.’
  alternative: ‘yóò wọ inú’ tàbí ‘wọ inú.’
  rationale: Ìsinsìnyí Gíríìkì kò jẹ́ kí a dín ọ̀rọ̀ náà kù sí ọjọ́ iwájú nìkan; ó pa ìforígbárí ‘ó ti bẹ̀rẹ̀ ṣùgbọ́n kò tíì pé’ mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ìsinmi’ déédéé fún κατάπαυσις, a sì fi àlàyé sí àgbékalẹ̀ ìbúra kí a lè pa ìrísí orísun àti ìtumọ̀ rẹ̀ mọ́ pọ̀.
