  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìfẹ̀hónúhàn ἐπεὶ οὖν, ìmọ̀ pé àǹfààní wíwọ ṣì kù, ohùn àfarawà nínú εὐαγγελισθέντες, àti ìdí δι’ ἀπείθειαν mọ́. Àmì ìdádúró ní òpin tún bá ìtẹ̀síwájú gbolóhùn nínú ẹsẹ̀ 7 mu.'
