  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí ó ti ṣì kù fún àwọn kan láti wọ inú rẹ̀, àti pé àwọn tí a ti kéde ìhìn rere fún tẹ́lẹ̀ kò wọ inú rẹ̀ nítorí àìgbọ́ràn[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí àìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkọ̀ láti gbàgbọ́, tí ó sì hàn nínú àìgbọ́ràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Nítorí náà, níwọ̀n bí
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ní agbára ìparí èrò àti ìdí; ìtumọ̀ yìí pa méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: ἀπολείπεται
  choice: ó ti ṣì kù
  rationale: Ó fi hàn pé àǹfààní náà ṣì wà títí di ìsinsìnyí.
- source_word: τινὰς
  choice: fún àwọn kan
  rationale: Ó pa ìtọ́kasí aláìlẹ́ni-pàtó ti ọ̀rọ̀ Gíríìkì mọ́, ó sì bá infinitive tó tẹ̀ lé e mu.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: láti wọ inú rẹ̀
  rationale: Ó tọ́ka padà sí ìsinmi Ọlọ́run láìfi ọ̀rọ̀-orúkọ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: àwọn tí a ti kéde ìhìn rere fún tẹ́lẹ̀
  rationale: Ó pa ohùn àfarawà participle náà mọ́, ó sì yẹra fún èdè ẹ̀sìn tó le tàbí tí kò wọ́pọ̀.
- source_word: οὐκ εἰσῆλθον
  choice: kò wọ inú rẹ̀
  rationale: Ìtumọ̀ tààrà ni fún aorist tí a sẹ́, láìṣàfikún ìtumọ̀ míì.
- source_word: δι’ ἀπείθειαν
  choice: nítorí àìgbọ́ràn
  rationale: Àìgbọ́ràn ni ìtumọ̀ pàtàkì ἀπείθεια, bí ó tilẹ̀ jẹ́ pé ó lè ní ìbáṣepọ̀ pẹ̀lú àìgbàgbọ́ nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ ἀπείθεια nínú ìkìlọ̀ nípa wíwọ inú ìsinmi
  choice: nítorí àìgbọ́ràn
  alternative: nítorí àìgbàgbọ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí kíkọ̀ láti gba ọ̀rọ̀ Ọlọ́run gbọ́ tí ó hàn nínú àìgbọ́ràn. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ pàtàkì rẹ̀ mọ́, àlàyé ìsàlẹ̀ sì fi ìtumọ̀ kejì tó ṣeé ṣe hàn.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì yé òǹkàwé òde òní ni a lò. Gbólóhùn náà mọ̀ọ́mọ̀ parí pẹ̀lú àmì kọ́má nítorí pé èrò náà ń bá a lọ sínú ẹsẹ̀ tó tẹ̀ lé e.
