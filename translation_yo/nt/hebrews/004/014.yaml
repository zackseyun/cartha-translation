  to: Nítorí náà, níwọ̀n bí a ti ní Àlùfáà Àgbà ńlá kan, ẹni tí ó ti la àwọn ọ̀run kọjá[a]—Jésù, Ọmọ Ọlọ́run—jẹ́ kí a di ìjẹ́wọ́ wa mú ṣinṣin.
