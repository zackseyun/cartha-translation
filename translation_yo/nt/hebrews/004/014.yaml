id: HEB.4.14
reference: Hebrews 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti ní Àlùfáà Àgbà ńlá kan, ẹni tí ó ti la àwọn ọ̀run kọjá[a]—Jésù, Ọmọ Ọlọ́run—jẹ́ kí a di ìjẹ́wọ́ wa mú ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ti gba inú àwọn ọ̀run kọjá.” Ọ̀rọ̀ Gíríìkì náà lo “àwọn ọ̀run” ní ọ̀pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Nítorí náà, níwọ̀n bí a ti ní
  rationale: Àkójọpọ̀ yìí fi ìtumọ̀ ìparí èrò οὖν àti ìdí tí participle Ἔχοντες ń fún ìgbaniníyàn náà hàn ní Yorùbá àdánidá.
- source_word: ἀρχιερέα μέγαν
  choice: Àlùfáà Àgbà ńlá kan
  rationale: “Àlùfáà Àgbà” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἀρχιερεύς; “ńlá” sì pa ìtẹnumọ́ μέγαν mọ́ láì fi article pàtó kún un.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: ẹni tí ó ti la àwọn ọ̀run kọjá
  rationale: “Ó ti” fi iṣẹ́ tí ó ti ṣẹlẹ̀ pẹ̀lú ipa tí ó dúró hàn; “la … kọjá” sì pa àwòrán ìrìn kọjá mọ́, nígbà tí “àwọn ọ̀run” ń ṣètọ́jú plural Gíríìkì.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: ìyẹn Jésù Ọmọ Ọlọ́run
  rationale: “Ìyẹn” mú apposition náà ṣe kedere ní Yorùbá, nígbà tí “Ọmọ Ọlọ́run” pa oyè Kristi náà mọ́ láì ṣe àlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: κρατῶμεν
  choice: ẹ jẹ́ kí a di … mú ṣinṣin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hortatory subjunctive àti ìpè sí ìfaradà tí ń bá a lọ hàn.
- source_word: τῆς ὁμολογίας
  choice: ìjẹ́wọ́ wa
  rationale: “Ìjẹ́wọ́” lè tọ́ka sí ohun tí àwùjọ àwọn onígbàgbọ́ jẹ́wọ́ ní gbangba; “wa” sì jẹ́ ohun tí àyíká ìgbaniníyàn àpapọ̀ náà ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé article Gíríìkì kì í ṣe possessive ní tààrà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè Kristi υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  alternative: Ọmọ tí ó jẹ́ ti Ọlọ́run
  rationale: A pa oyè náà mọ́ ní kúkúrú àti ní tààrà, láì sọ ọ́ di àlàyé tàbí fi ẹ̀kọ́ ẹ̀sìn kan tí ẹsẹ náà kò sọ kún un.
- issue: Bóyá a ó pa plural τοὺς οὐρανούς àti àwòrán ìrìn kọjá rẹ̀ mọ́
  choice: la àwọn ọ̀run kọjá
  alternative: lọ sí ọ̀run
  rationale: Yíyan plural àti ìrìn kọjá pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, láì sọ ó di ọ̀run kan ṣoṣo tàbí gbé cosmology kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì fi àmì ìdádúró gígùn yà apposition náà sọ́tọ̀.
