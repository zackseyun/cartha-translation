  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: yo
  text: Ó sì tún sọ ní ibòmíràn pé, “Wọ́n kì yóò wọ inú ìsinmi mi láé.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ní tààrà, ó ní, “Bí wọ́n yóò bá wọ inú ìsinmi mi,” ṣùgbọ́n èyí jẹ́ ìlànà ìbúra tí ó túmọ̀ sí, “Wọ́n kì yóò wọ inú ìsinmi mi láé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ní ibòmíràn
  rationale: Nínú ọ̀wọ́ ẹsẹ̀ yìí, gbólóhùn náà ń tọ́ka sí ibòmíràn nínú Ìwé Mímọ́ tí a ti fa ọ̀rọ̀ yọ. ‘Ní ibòmíràn’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé òǹkọ̀wé ń tọ́ka sí ẹsẹ Ìwé Mímọ́ mìíràn.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé òǹkọ̀wé tún ń fa ọ̀rọ̀ Ìwé Mímọ́ yọ lẹ́ẹ̀kan sí i.
- source_word: Εἰ εἰσελεύσονται
  choice: Wọn kì yóò wọ ... láé
  rationale: Bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lásán dà bí gbólóhùn onípò, ó ń gbé ìlànà ìbúra ti èdè Hébérù, tí ìtumọ̀ rẹ̀ jẹ́ ìkọ̀ emphatic. ‘Kì yóò ... láé’ mú agbára ìkọ̀ náà jáde ní Yorùbá.
- source_word: κατάπαυσίν
  choice: ìsinmi
  rationale: ‘Ìsinmi’ jẹ́ ọ̀rọ̀ àdánidá, ó sì pa ọ̀rọ̀ pàtàkì tí a ń lò káàkiri Hébérù 3–4 mọ́.
- source_word: μου
  choice: mi
  rationale: A pa arọ́pò-orúkọ olóhun ẹni àkọ́kọ́ mọ́, nítorí Ọlọ́run fúnra rẹ̀ ni ó ń sọ̀rọ̀ nínú àyọlò Sáàmù náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ gbólóhùn ìbúra Εἰ εἰσελεύσονται
  choice: Wọn kì yóò wọ inú ìsinmi mi láé
  alternative: Bí wọn yóò bá wọ inú ìsinmi mi
  rationale: Ìrísí Gíríìkì jẹ́ ti gbólóhùn onípò ní tààrà, ṣùgbọ́n nínú àyọlò yìí ó jẹ́ ìlànà ìbúra tí ó túmọ̀ sí ìkọ̀ líle. Ìtumọ̀ tí a yàn mú iṣẹ́ àkànṣe náà jáde láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ní ibòmíràn’ gẹ́gẹ́ bí ìtọ́ka àdánidá sí apá Ìwé Mímọ́ mìíràn, a sì lo ‘kì yóò ... láé’ láti fi agbára ìbúra Semitic hàn.
