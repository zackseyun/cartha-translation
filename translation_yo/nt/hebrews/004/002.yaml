- from: Nítorí pé a ti kéde ìhìn rere fún àwa náà, gẹ́gẹ́ bí a ti ṣe fún àwọn náà; ṣùgbọ́n ọ̀rọ̀ tí wọ́n gbọ́ kò ṣe wọ́n ní àǹfààní, nítorí a kò fi ìgbàgbọ́ so wọ́n pọ̀ mọ́ àwọn tí ó gbọ́.[a]
  to: Nítorí pé a ti kéde ìhìn rere fún wa náà, gẹ́gẹ́ bí a ti kéde fún àwọn náà; ṣùgbọ́n ọ̀rọ̀ tí wọ́n gbọ́ kò ṣe wọ́n láǹfààní, nítorí pé a kò fi ìgbàgbọ́ so wọ́n pọ̀ mọ́ àwọn tí ó gbọ́.[a]
  rationale: A tún ọ̀rọ̀ náà ṣe níbi díẹ̀ láti mú un rọrùn, ṣùgbọ́n a kò yí ìtumọ̀ rẹ̀ padà. Àkọ́lé ṣì tẹ̀lé accusative plural nínú SBLGNT, níbi tí “wọ́n” jẹ́ àwọn tí a kò fi ìgbàgbọ́ so pọ̀ mọ́ “àwọn tí ó gbọ́.” Àlàyé ìsàlẹ̀ ṣì fi ẹ̀dà mìíràn àti ìtumọ̀ ìbílẹ̀ tó ń jẹ́ kí “ọ̀rọ̀ náà” jẹ́ kókó-ọrọ hàn.
