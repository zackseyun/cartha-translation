id: HEB.4.2
reference: Hebrews 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: yo
  text: Nítorí pé a ti kéde ìhìn rere fún wa náà, gẹ́gẹ́ bí a ti kéde fún àwọn náà; ṣùgbọ́n ọ̀rọ̀ tí wọ́n gbọ́ kò ṣe wọ́n láǹfààní, nítorí pé a kò fi ìgbàgbọ́ so wọ́n pọ̀ mọ́ àwọn tí ó gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ẹ̀dà Gíríìkì mìíràn, àti ìtumọ̀ ìbílẹ̀, ní: “nítorí ọ̀rọ̀ náà kò dàpọ̀ mọ́ ìgbàgbọ́ nínú àwọn tí ó gbọ́.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: a ti kéde ìhìn rere fún àwa náà
  rationale: 'Ó pa ìtumọ̀ perfect passive mọ́: a ti kéde ìhìn rere fún wọn, ìkéde náà sì ṣì ní ipa lórí wọn. Ó tún yẹra fún lílo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè ju ohun tí àyíká ọ̀rọ̀ ń sọ lọ.'
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: ọ̀rọ̀ tí wọ́n gbọ́
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún ọ̀rọ̀ tí a kéde tí wọ́n sì gbọ́, dípò títú genitive Gíríìkì náà ní ọ̀rọ̀-ọ̀rọ̀.
- source_word: ὠφέλησεν
  choice: kò ṣe wọ́n ní àǹfààní
  rationale: Ó sọ ní kedere pé ọ̀rọ̀ tí wọ́n gbọ́ kò mú èrè tàbí ìrànlọ́wọ́ tí ó yẹ wá fún wọn.
- source_word: συγκεκερασμένους
  choice: so wọ́n pọ̀ mọ́
  rationale: Accusative participle inú ẹ̀dà SBLGNT bá ἐκείνους mu; nítorí náà, ìtumọ̀ náà fi àwọn ènìyàn hàn gẹ́gẹ́ bí àwọn tí a kò so pọ̀ mọ́ àwọn olùgbọ́ nípasẹ̀ ìgbàgbọ́.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí πίστις ń tọ́ka sí ìdáhùn ìgbàgbọ́ sí ọ̀rọ̀ tí a gbọ́; ‘ìgbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì wọ́pọ̀.
- source_word: τοῖς ἀκούσασιν
  choice: àwọn tí ó gbọ́
  rationale: Ó dúró sún mọ́ ἀκούω láì fi ìtumọ̀ ‘gbọ́ran’ tàbí ìdáhùn rere kún un ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Àyíká ọ̀rọ̀ ń fi gbígbọ́ ọ̀rọ̀ wé ìdáhùn ìgbàgbọ́; ‘ìgbàgbọ́’ pa ìtumọ̀ ẹ̀kọ́ ìsìn àti ìgbẹ́kẹ̀lé mọ́ láì yan ẹ̀kọ́ ẹ̀sìn kan pàtó.
- issue: Ẹni tàbí ohun tí participle ìkẹyìn ń ṣàpèjúwe
  choice: a kò fi ìgbàgbọ́ so wọ́n pọ̀ mọ́ àwọn tí ó gbọ́
  alternative: ọ̀rọ̀ náà kò dàpọ̀ mọ́ ìgbàgbọ́ nínú àwọn tí ó gbọ́
  rationale: Ẹ̀dà SBLGNT tí a pèsè ní accusative plural συγκεκερασμένους, èyí tí ó bá ἐκείνους (‘wọn’) mu. Àkọ́lé pàtàkì tẹ̀lé ẹ̀rí yìí, nígbà tí àlàyé ìsàlẹ̀ pa ẹ̀dà mìíràn àti ìtumọ̀ ìbílẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àkọ́lé pàtàkì tẹ̀lé gírámà ẹ̀dà SBLGNT, ó sì fi ẹ̀dà mìíràn sínú àlàyé ìsàlẹ̀.
