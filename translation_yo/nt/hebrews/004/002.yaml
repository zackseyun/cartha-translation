  source_fidelity: 'Ìtumọ̀ àkọ́lé tẹ̀lé SBLGNT dáadáa: εὐηγγελισμένοι ni a fi hàn gẹ́gẹ́ bí ìkéde ìhìn rere tí ó ti ṣẹlẹ̀; ὁ λόγος τῆς ἀκοῆς ni “ọ̀rọ̀ tí wọ́n gbọ́”; ìpínrọ̀ ìkẹyìn sì ń jẹ́ kí participle accusative plural συγκεκερασμένους tọ́ka sí ἐκείνους, ìyẹn àwọn ènìyàn náà. Àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ìbílẹ̀ tí ẹ̀dà mìíràn ń ṣètìlẹ́yìn fún mọ́.'
