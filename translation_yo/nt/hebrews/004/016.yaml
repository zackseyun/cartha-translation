  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí a sún mọ́ ìtẹ́ oore-ọ̀fẹ́ pẹ̀lú ìgboyà[a], kí a lè gba àánú, kí a sì rí oore-ọ̀fẹ́ fún ìrànlọ́wọ́ ní àkókò tí ó yẹ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pẹ̀lú ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìgbẹ́kẹ̀lé àti ìgboyà láti sọ̀rọ̀ tàbí láti sún mọ́ ẹni ní òmìnira.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “fún ìrànlọ́wọ́ nígbà àìní.” Bí a bá tú ọ̀rọ̀ Gíríìkì náà ní tààrà, ó ń tọ́ka sí ìrànlọ́wọ́ tí ó dé ní àkókò tí ó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: ẹ jẹ́ kí a … sún mọ́
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣírí sí gbogbo àwùjọ, ó sì túmọ̀ sí kí a tọ̀ sí ibi kan tàbí kí a sún mọ́ ọn. Èdè yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ ìṣírí náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ jáde láti inú ohun tí a ṣẹ̀ṣẹ̀ sọ nípa Jésù gẹ́gẹ́ bí Àlùfáà Àgbà.
- source_word: μετὰ παρρησίας
  choice: fi ìgboyà
  rationale: παρρησία lè túmọ̀ sí ìgboyà, ìgbẹ́kẹ̀lé, tàbí òmìnira láti sọ̀rọ̀ tàbí láti tọ̀ síwájú. “Fi ìgboyà” pa agbára ọ̀rọ̀ náà mọ́ láìjẹ́ kí ó túmọ̀ sí ìgbéraga.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: ìtẹ́ oore-ọ̀fẹ́
  rationale: Ó pa àwòrán ìtẹ́ àti ìsopọ̀ rẹ̀ pẹ̀lú oore-ọ̀fẹ́ mọ́, láìfi ìtumọ̀ kan tí Gíríìkì kò sọ kún un.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde tí a ń retí hàn ní Yorùbá àdánidá.
- source_word: λάβωμεν ἔλεος
  choice: kí a lè gba àánú
  rationale: “Gba” bá λαμβάνω mu, “àánú” sì jẹ́ ìtumọ̀ tó ṣe kedere fún ἔλεος.
- source_word: χάριν εὕρωμεν
  choice: kí a sì rí oore-ọ̀fẹ́
  rationale: 'Ó pa ìyàtọ̀ ọ̀rọ̀-ìṣe inú Gíríìkì mọ́: a “gba” àánú, a sì “rí” oore-ọ̀fẹ́. “Oore-ọ̀fẹ́” tún pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú “ìtẹ́ oore-ọ̀fẹ́.”'
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: fún ìrànlọ́wọ́ ní àkókò tí ó yẹ
  rationale: εὔκαιρος tọ́ka sí ohun tó dé ní àkókò tó bójú mu. Ìtumọ̀ yìí pa ìtẹnumọ́ náà mọ́ pé ìrànlọ́wọ́ náà dé ní àkókò tí ó yẹ.
theological_decisions:
- issue: Ìtumọ̀ παρρησία nígbà tí a bá ń tọ Ọlọ́run lọ
  choice: fi ìgboyà
  alternative: pẹ̀lú ìgbẹ́kẹ̀lé
  rationale: “Ìgboyà” pa agbára òmìnira àti àìfọ̀rọ̀rora láti sún mọ́ Ọlọ́run mọ́, ṣùgbọ́n kò sọ ọ́ di ìgbéraga tàbí àfojúdi.
- issue: Ìtumọ̀ χάρις nínú gbólóhùn kejì
  choice: oore-ọ̀fẹ́
  alternative: ojú rere
  rationale: “Oore-ọ̀fẹ́” bá ọ̀rọ̀ náà mu, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú “ìtẹ́ oore-ọ̀fẹ́” nínú ẹsẹ kan náà, láìdín ìtumọ̀ rẹ̀ kù sí ojú rere nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi gbogbo tí ó bá ṣe àdánidá. Ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán “ìtẹ́ oore-ọ̀fẹ́” àti ìyàtọ̀ láàárín “gba àánú” àti “rí oore-ọ̀fẹ́” mọ́.
