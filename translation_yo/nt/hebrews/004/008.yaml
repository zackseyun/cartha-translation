  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìdí-ìjiyàn ẹsẹ náà dáadáa wá sí Yorùbá: Jóṣúà ni Ἰησοῦς ń tọ́ka sí ní àyíká yìí, ‘fún wọn ní ìsinmi’ ń gbé ìtumọ̀ olùṣe ti κατέπαυσεν jáde, ìṣètò ‘bá ti … kì bá tí’ sì ń fi ipò alákòóso-tí-kò ṣẹlẹ̀ ní ìgbà tí ó kọjá hàn. ‘Ọjọ́ mìíràn’ àti ‘lẹ́yìn náà’ tún bá orísun mu.'
  naturalness: Ọ̀rọ̀ náà ní ìforúkọsílẹ̀ Yorùbá boṣewa, ó sì rọrùn láti lóye. Síbẹ̀, ‘òun’ lè ṣàṣìtọ́ka sí Jóṣúà, ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ, nígbà tí ẹni tí ó ń sọ̀rọ̀ nínú àríyànjiyàn àyíká náà jẹ́ Ọlọ́run. Lílo ‘Ẹni náà’ ń yà á kúrò lọ́dọ̀ Jóṣúà díẹ̀, ó sì pa àìdárúkọ kedere nínú Gíríìkì mọ́.
  terminology: ‘Jóṣúà,’ ‘ìsinmi,’ àti ‘ọjọ́ mìíràn’ yẹ. Àlàyé ìsàlẹ̀ ní láti sọ ní kedere pé ìrísí orúkọ náà nínú Gíríìkì ni a lè túmọ̀ sí ‘Jésù,’ kì í ṣe pé gbolohun Gíríìkì fúnra rẹ̀ jẹ́ ‘Jésù.’
  issues:
  - severity: medium
    issue: ‘Òun’ ní apá kejì ẹsẹ náà lè tọ́ka sí Jóṣúà.
    rationale: Ní Yorùbá, arọ́pò-orúkọ ‘òun’ sábà máa ń pada tọ́ka sí orúkọ tó sún mọ́ ọn, nítorí náà ó lè mú kí Jóṣúà dà bí ẹni tí ó ‘sọ̀rọ̀ lẹ́yìn náà.’ Àyíká Heberu 4:7 ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí ó sọ̀rọ̀ nípasẹ̀ Dáfídì. ‘Ẹni náà’ pa ìtumọ̀ ẹni tí a kò dárúkọ nínú gbolohun Gíríìkì mọ́, ó sì dín ìdàrúdàpọ̀ kù.
  - severity: low
    issue: Gbólóhùn ìbẹ̀rẹ̀ àlàyé ìsàlẹ̀ lè dà bí ẹni pé ‘Jésù’ ni ọ̀rọ̀ Gíríìkì gangan.
    rationale: Ἰησοῦς ni ìrísí Gíríìkì náà; ‘Jésù’ jẹ́ ọ̀kan nínú àwọn ìtumọ̀/referent tí ìrísí orúkọ náà lè ní. Àtúnṣe kékeré ń mú ìtàn náà péye.
