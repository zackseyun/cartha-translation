  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: yo
  text: Nítorí bí Jóṣúà bá ti fún wọn ní ìsinmi[a], ẹni náà kì bá tí sọ̀rọ̀ lẹ́yìn náà nípa ọjọ́ mìíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìrísí orúkọ náà nínú èdè Gíríìkì, Ἰησοῦς, lè tọ́ka sí “Jésù” tàbí Jóṣúà; níbí, àyíká ọ̀rọ̀ ń tọ́ka sí Jóṣúà, ọmọ Nún.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jóṣúà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè dúró fún Jésù tàbí Jóṣúà; àyíká ọ̀rọ̀ yìí ń tọ́ka sí Jóṣúà ọmọ Nún àti bí Ísírẹ́lì ṣe wọ ilẹ̀ náà.
- source_word: κατέπαυσεν
  choice: bá ti fún wọn ní ìsinmi
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìtumọ̀ olùṣe hàn: mímú kí wọ́n sinmi tàbí fífún wọn ní ìsinmi.'
- source_word: οὐκ ἂν ... ἐλάλει
  choice: òun kì bá tí sọ̀rọ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà sọ àbájáde ohun tí kò ṣẹlẹ̀ ní àkókò tó kọjá; ìṣètò ‘kì bá tí’ mú èyí jáde ní Yorùbá.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: nípa ọjọ́ mìíràn
  rationale: Ó pa ìtumọ̀ ọjọ́ òmíràn tí a mẹ́nu kàn lẹ́yìn ìgbà Jóṣúà mọ́ láì túmọ̀ rẹ̀ sí ohun tó ju ti orísun lọ.
- source_word: μετὰ ταῦτα
  choice: lẹ́yìn náà
  rationale: Ó fi ìtẹ̀lé àkókò hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé àti ìdí tí a sọ ṣáájú.
theological_decisions:
- issue: Ẹni tí Ἰησοῦς ń tọ́ka sí nínú Hébérù 4:8
  choice: Jóṣúà ọmọ Nún
  alternative: Jésù
  rationale: Àríyànjiyàn inú àyíká ọ̀rọ̀ dá lórí wíwọ Ísírẹ́lì sínú ilẹ̀ náà lábẹ́ Jóṣúà àti ìlérí ìsinmi tí ó ṣì wà lẹ́yìn náà. Síbẹ̀, àlàyé ìsàlẹ̀ fi hàn pé ìrísí orúkọ Gíríìkì náà bá ti Jésù kan náà.
- issue: Ẹni tí ó sọ̀rọ̀ lẹ́yìn náà
  choice: òun (arọ́pò-orúkọ tí kò sọ ẹni náà ní pàtó)
  alternative: Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì kò fi ‘Ọlọ́run’ kún un ní tààrà; lílo arọ́pò-orúkọ pa àìsọ ẹni náà ní pàtó mọ́, bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè jẹ́ kí a lóye rẹ̀ gẹ́gẹ́ bí Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A lo ‘òun’ láti yẹra fún fífi ‘Ọlọ́run’ kún ọ̀rọ̀ Gíríìkì ní tààrà, bí ó tilẹ̀ jẹ́ pé ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí lè nílò àyíká ọ̀rọ̀ fún ìtumọ̀.
