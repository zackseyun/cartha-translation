id: HEB.4.10
reference: Hebrews 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: yo
  text: Nítorí ẹni tí ó ti wọ inú ìsinmi rẹ̀[a], òun fúnra rẹ̀ náà ti sinmi[b] kúrò nínú àwọn iṣẹ́ rẹ̀, gẹ́gẹ́ bí Ọlọ́run ti sinmi kúrò nínú àwọn iṣẹ́ tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ti wọ inú ìsinmi Ọlọ́run.” Ó ṣeé ṣe jùlọ pé arọ́pò-orúkọ “rẹ̀” ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀ Hébérù 3–4.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ti dáwọ́ kúrò nínú àwọn iṣẹ́ rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà nínú ìdílé ọ̀rọ̀ kan náà pẹ̀lú ọ̀rọ̀ tí a túmọ̀ sí “ìsinmi” nínú apá yìí; nítorí náà, a lo “sinmi” láti pa àtúnsọ ọ̀rọ̀ ìsinmi náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: ẹni tí ó ti wọ inú
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí ẹnikẹ́ni tí a dá mọ̀ sí ẹni tí ó ti wọlé; “ẹni tí ó ti” pa ìtumọ̀ ẹni kan ní gbogbogbò àti ìṣe tí ó ti ṣẹlẹ̀ mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ yìí ń ṣàlàyé, ó sì ń fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀.
- source_word: κατάπαυσιν
  choice: ìsinmi
  rationale: “Ìsinmi” pa kókó ọ̀rọ̀ ìsinmi Ọlọ́run mọ́ ní Hébérù 3–4, ó sì bá ìsinmi Ọlọ́run ní ìtàn ìṣẹ̀dá mu.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ Yorùbá náà pa àìdánilójú gírámà Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe jù pé Ọlọ́run ni ó ń tọ́ka sí.
- source_word: καὶ αὐτὸς
  choice: òun tìkára rẹ̀ pẹ̀lú
  rationale: Èyí mú ìtẹnumọ́ αὐτός àti ìtumọ̀ àfikún καί jáde ní Yorùbá àdánidá.
- source_word: κατέπαυσεν
  choice: ti sinmi
  rationale: “Ti sinmi” mú ìbátan ọ̀rọ̀ náà pẹ̀lú κατάπαυσις (“ìsinmi”) hàn, dípò kí a sọ ìtumọ̀ rẹ̀ ní “dáwọ́ iṣẹ́ dúró” nìkan.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: kúrò nínú àwọn iṣẹ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹni náà sinmi tàbí dáwọ́ kúrò nínú àwọn iṣẹ́ tirẹ̀, láìfi irú iṣẹ́ náà mọ́.
- source_word: ὥσπερ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó ṣe kedere hàn láàárín ìsinmi ẹni náà àti ti Ọlọ́run.
- source_word: τῶν ἰδίων
  choice: àwọn iṣẹ́ tirẹ̀
  rationale: Gíríìkì fi “àwọn tirẹ̀” sílẹ̀ láìtún “iṣẹ́” sọ, ṣùgbọ́n fífi “àwọn iṣẹ́” kún un mú gbolohun Yorùbá ṣe kedere, nígbà tí “tirẹ̀” pa ìtẹnumọ́ ohun tí ó jẹ́ ti Ọlọ́run fúnra rẹ̀ mọ́.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tó sì yẹ fún θεός.
theological_decisions:
- issue: Ẹni tí αὐτοῦ nínú “ìsinmi rẹ̀” ń tọ́ka sí
  choice: Àkọ́kọ́ ni pé ó ń tọ́ka sí ìsinmi Ọlọ́run tí ẹni náà wọ̀.
  alternative: Ó lè tọ́ka sí ìsinmi ẹni tí ó wọ̀ náà fúnra rẹ̀.
  rationale: Ní Hébérù 3–4, ìsinmi tí a ń sọ léraléra jẹ́ ti Ọlọ́run, tí a sì fi ìsinmi Ọlọ́run ní ọjọ́ keje ṣe ìpìlẹ̀ rẹ̀. Síbẹ̀, ọ̀rọ̀ àkọ́kọ́ lo “rẹ̀” dípò “Ọlọ́run” kí ó má bàa yanjú ohun tí Gíríìkì fi sílẹ̀ ní arọ́pò-orúkọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣeé lóye fún gbogbo ènìyàn. Gbólóhùn náà pa ìtẹnumọ́ “òun tìkára rẹ̀ pẹ̀lú,” àtúnsọ ọ̀rọ̀ ìsinmi, àti àìdánilójú arọ́pò-orúkọ Gíríìkì mọ́.
