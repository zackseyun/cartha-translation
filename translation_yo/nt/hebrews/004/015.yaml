id: HEB.4.15
reference: Hebrews 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: yo
  text: Nítorí a kò ní àlùfáà àgbà tí kò lè bá wa ní ìmọ̀lára nípa àwọn àìlera wa, ṣùgbọ́n a ní ẹni tí a ti dán án wò ní gbogbo ọ̀nà gẹ́gẹ́ bí àwa náà[a], síbẹ̀ láìní ẹ̀ṣẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gangan, “ní ìbámu pẹ̀lú ìjọra”; a tún lè túmọ̀ rẹ̀ sí “ní ọ̀nà kan náà bí àwa.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “a ti dán án wò” sí “a ti dán án wò sínú ìdẹwò.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχιερέα
  choice: àlùfáà àgbà
  rationale: Ọ̀rọ̀ yìí jẹ́ orúkọ ipò àlùfáà tó ga jù lọ, ó sì ṣe pàtàkì nínú àríyànjiyàn ìwé Hébérù nípa iṣẹ́ àlùfáà Jesu.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: tí kò lè bá wa ní ìmọ̀lára
  rationale: 'Ó pa ìsọ̀rọ̀ òdì méjì inú Gíríìkì mọ́: kì í ṣe àlùfáà àgbà tí kò lè bá wa ní ìmọ̀lára. ‘Bá wa ní ìmọ̀lára’ túmọ̀ sí kíkópa nínú ìrírí àti ìrora wa, kì í ṣe ṣíṣe àánú lásán.'
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: nínú àwọn àìlera wa
  rationale: ‘Àìlera’ níbí gbòòrò ju àìsàn ara lọ; ó kan ailagbara àti ẹlẹgẹ́ ìwà ènìyàn.
- source_word: πεπειρασμένον
  choice: a ti dán wò
  rationale: πειράζω lè túmọ̀ sí dídán ẹnì kan wò tàbí dán an wo sínú ẹ̀ṣẹ̀. ‘Dán wò’ pa ìrírí ìdánwò gidi mọ́ láìfi ìtẹ̀sí ẹ̀ṣẹ̀ kún ọ̀rọ̀ náà; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
- source_word: κατὰ πάντα
  choice: ní gbogbo ọ̀nà
  rationale: Ó sọ bí ìdánwò náà ti kún tó ní ọ̀nà tí ó ṣe kedere, tí ó sì bá Yorùbá òde òní mu.
- source_word: καθ’ ὁμοιότητα
  choice: gẹ́gẹ́ bí àwa náà
  rationale: Ó mú ìfiwéra tí ọ̀rọ̀ ‘ìjọra’ tọ́ka sí hàn ní Yorùbá àdánidá. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ‘gẹ́gẹ́ bí ìjọra’ mọ́.
- source_word: χωρὶς ἁμαρτίας
  choice: síbẹ̀ láìní ẹ̀ṣẹ̀
  rationale: '‘Síbẹ̀’ mú ìyàtọ̀ pàtàkì náà hàn: bí ó tilẹ̀ jẹ́ pé a dán án wò ní gbogbo ọ̀nà, ẹ̀ṣẹ̀ kò sí nínú rẹ̀.'
theological_decisions:
- issue: Ìtumọ̀ πεπειρασμένον pẹ̀lú àìlẹ́ṣẹ̀ Kristi
  choice: a ti dán wò
  alternative: a ti dán an wo
  rationale: Àṣàyàn pàtàkì jẹ́wọ́ ìdánwò àti ìpọ́njú gidi tí Kristi dojú kọ láìdáhùn ṣáájú pé ọ̀rọ̀ náà túmọ̀ sí ìfẹ́ inú sí ẹ̀ṣẹ̀. Àṣàyàn ‘dán an wo’ ṣì jẹ́ ìtumọ̀ tó ṣeé gbà, a sì pa á mọ́ nínú àlàyé.
- issue: Bí a ṣe máa sọ ohun tí καθ’ ὁμοιότητα fi wé e
  choice: gẹ́gẹ́ bí àwa náà
  alternative: gẹ́gẹ́ bí ìjọra
  rationale: Yorùbá àdánidá nílò kí ohun tí a fi wé e hàn kedere sí i. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé Gíríìkì sọ ní gangan pé ‘gẹ́gẹ́ bí ìjọra,’ nítorí náà a kò fi àìdánilójú orísun pamọ́.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àlùfáà àgbà’ gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tó wọ́pọ̀, a sì pa ìsọ̀rọ̀ òdì méjì àti ìyàtọ̀ ‘síbẹ̀ láìní ẹ̀ṣẹ̀’ mọ́.
