review_pass:
  verdict: revise
  source_fidelity: 'Àwọn èrò pàtàkì ti ẹsẹ̀ Gíríìkì wà nínú àkọsílẹ̀ náà: ìsọ̀rọ̀ òdì méjì, àlùfáà àgbà, ìbáṣepọ̀ pẹ̀lú àìlera wa, ìdánwò tó kún, ìjọra, àti àìní ẹ̀ṣẹ̀. Ṣùgbọ́n àlàyé ìsàlẹ̀ fún πεπειρασμένον kò fi ìtumọ̀ àṣàyàn ‘a ti dán án wò sínú ìdẹwò’ hàn; ó kàn tún ìtumọ̀ ìdánwò náà sọ.'
  naturalness: ‘Bá wa ní ìmọ̀lára nínú àwọn àìlera wa’ lè yọrí sí ìtumọ̀ tí kò rọrùn. ‘Bá wa ní ìmọ̀lára nípa àwọn àìlera wa’ jẹ́ Yorùbá tí ó túbọ̀ dáa, ó sì pa ìtumọ̀ συμπαθῆσαι mọ́. ‘Gẹ́gẹ́ bí àwa náà’ lè dúró gẹ́gẹ́ bí ìfiwéra tí a sọ kedere ní Yorùbá.
  terminology: ‘Àlùfáà àgbà,’ ‘àìlera,’ ‘ẹ̀ṣẹ̀,’ àti ‘a ti dán án wò’ bá ọ̀rọ̀ orísun àti ìforúkọsílẹ̀ ìjọsìn nínú Hébérù mu. Àlàyé ìsàlẹ̀ yẹ kí ó ṣe ìyàtọ̀ gidi láàárín ‘dán wò’ àti ‘dán án wò sínú ìdẹwò.’
