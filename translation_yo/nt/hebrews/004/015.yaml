  to: Nítorí a kò ní àlùfáà àgbà tí kò lè bá wa ní ìmọ̀lára nípa àwọn àìlera wa, ṣùgbọ́n a ní ẹni tí a ti dán án wò ní gbogbo ọ̀nà gẹ́gẹ́ bí àwa náà[a], síbẹ̀ láìní ẹ̀ṣẹ̀.[b]
