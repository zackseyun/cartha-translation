id: HEB.4.11
reference: Hebrews 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí a sapá gidigidi láti wọ inú ìsinmi náà, kí ẹnikẹ́ni má bàa ṣubú nípa àpẹẹrẹ àìgbọ́ràn kan náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àpẹẹrẹ àìgbàgbọ́ kan náà.” A lè lóye ọ̀rọ̀ náà ní ìbámu pẹ̀lú bí ìran inú aginjù ṣe kọ̀ láti gbẹ́kẹ̀ lé Ọlọ́run, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ní tààràtà jù lọ ni “àìgbọ́ràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: ẹ jẹ́ kí a sapá gidigidi
  rationale: Ọ̀rọ̀ náà jẹ́ ìṣírí sí gbogbo wa, ó sì ń tọ́ka sí ìsapá pẹ̀lú ìtara àti àìṣàìní. ‘Ẹ jẹ́ kí a sapá gidigidi’ jẹ́ Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a ti sọ ṣáájú nípa ìsinmi Ọlọ́run àti ìkùnà àwọn ọmọ Ísírẹ́lì.
- source_word: εἰσελθεῖν
  choice: láti wọ inú
  rationale: Ó túmọ̀ sí wíwọlé, ó sì jẹ́ àfojúsùn ìsapá tí a ń rọ àwọn olùgbọ́ láti ṣe.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ìsinmi náà
  rationale: ‘Náà’ tọ́ka padà sí ìsinmi tí àyíká ẹsẹ̀ ti ń ṣàlàyé, láìfi ìtumọ̀ tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìkìlọ̀ tó ń sọ ète odi tàbí àbájáde tí a fẹ́ yẹra fún.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: nípa títẹ̀lé àpẹẹrẹ ... kan náà
  rationale: ὑπόδειγμα lè jẹ́ àpẹẹrẹ tàbí ìlànà tí ẹlòmíràn tún tẹ̀lé. Fífí ‘títẹ̀lé’ kún un mú ìbáṣepọ̀ náà ṣe kedere ní Yorùbá, ó sì tọ́ka sí àpẹẹrẹ ìran inú aginjù láìsọ ọ́ di ẹ̀kọ́ àlàyé.
- source_word: πέσῃ
  choice: má bàa ṣubú
  rationale: ‘Ṣubú’ pa àwòrán ọ̀rọ̀ Gíríìkì àti ohùn ìkìlọ̀ rẹ̀ mọ́.
- source_word: τῆς ἀπειθείας
  choice: àìgbọ́ràn
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ní tààràtà ni àìgbọ́ràn, bí ó tilẹ̀ jẹ́ pé inú Hébérù ó ní ìbáṣepọ̀ tímọ́tímọ́ pẹ̀lú àìgbàgbọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ἀπείθεια pẹ̀lú àìgbàgbọ́ àti àìgbọ́ràn ìran inú aginjù
  choice: A lo ‘àìgbọ́ràn’ nínú ẹsẹ̀ pàtàkì, a sì fi ‘àìgbàgbọ́’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí àyíká ẹsẹ̀ lè gbà.
  alternative: àìgbàgbọ́
  rationale: Hébérù so àìgbàgbọ́ àti àìgbọ́ràn pọ̀, ṣùgbọ́n ἀπείθεια túmọ̀ sí ‘àìgbọ́ràn’ ní tààràtà. Yíyan èyí fún ẹsẹ̀ pàtàkì ń pa ìyàtọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ọ̀rọ̀ náà jẹ́ ìṣírí àpapọ̀, nítorí náà ‘ẹ jẹ́ kí a’ pa hortatory subjunctive mọ́. ‘Ìsinmi náà’ ń bá ọ̀rọ̀ àyíká mu láìsọ irú ìsinmi náà pàtó ju bí Gíríìkì ṣe sọ ọ́ lọ.
