source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: yo
  text: Nítorí ó ti sọ ní ibì kan nípa ọjọ́ keje báyìí pé, “Ọlọ́run sì sinmi ní ọjọ́ keje kúrò nínú gbogbo iṣẹ́ rẹ̀,”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ibì kan.” Gíríìkì sọ pé “ní ibì kan”; èyí jẹ́ ọ̀nà láti fi tọ́ka sí àyọlò Ìwé Mímọ́ láìdárúkọ ibi tí ó ti wà, kì í ṣe àìdánilójú nípa ọlá-àṣẹ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “dáwọ́ iṣẹ́ dúró.” Ọ̀rọ̀-ìṣe náà lè tẹnu mọ́ dídá iṣẹ́ dúró; a lo “sinmi” níhìn-ín láti pa ìsopọ̀ mọ́ pẹ̀lú Jẹ́nẹ́sísì 2:2 àti àríyànjiyàn Hébérù 3–4 nípa ìsinmi Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: ó ti sọ
  rationale: Ọ̀rọ̀-ìṣe perfect náà tọ́ka sí ohun tí a sọ ní àtijọ́ tí ó ṣì ní agbára nísinsìnyí; “ó ti sọ” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó ń ṣàlàyé, ó sì ń fi ẹ̀rí mú ọ̀rọ̀ tí ó ṣáájú dúró.
- source_word: που
  choice: ní ibì kan
  rationale: Ó jẹ́ ọ̀nà àìdárúkọ ibi tí ẹsẹ Ìwé Mímọ́ wà, kì í ṣe pé ẹni tí ń kọ̀wé kò dá a lójú.
- source_word: περὶ τῆς ἑβδόμης
  choice: nípa ọjọ́ keje
  rationale: Ọ̀rọ̀ náà fi “ọjọ́” sílẹ̀ nínú Gíríìkì nítorí ó hàn gbangba láti inú àyíká; fífi “ọjọ́” hàn ṣe Yorùbá náà kedere.
- source_word: οὕτως
  choice: báyìí pé
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ àyọlò tí ó tẹ̀ lé e ní Yorùbá àdánidá.
- source_word: Καὶ
  choice: sì
  rationale: A pa àsopọ̀ inú àyọlò Jẹ́nẹ́sísì mọ́; “sì” bá ìtàn Yorùbá mu ju “àti” lọ ní ipò yìí.
- source_word: κατέπαυσεν
  choice: sinmi
  rationale: Ó pa ìsopọ̀ mọ́ pẹ̀lú Jẹ́nẹ́sísì 2:2 àti àríyànjiyàn Hébérù nípa ìsinmi Ọlọ́run, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè tẹnu mọ́ dídá iṣẹ́ dúró.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ìtumọ̀ taara fún olùṣe ọ̀rọ̀-ìṣe náà.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: ní ọjọ́ keje
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ọjọ́ pàtó ní Yorùbá.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: kúrò nínú gbogbo iṣẹ́ rẹ̀
  rationale: “Kúrò nínú” fi ìyapa tàbí dídáwọ́ dúró tí ἀπό ń tọ́ka sí hàn; Yorùbá sábà máa ń lo “iṣẹ́” gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ dídá iṣẹ́ Ọlọ́run dúró ní ìbámu pẹ̀lú ẹ̀kọ́ Hébérù nípa ìsinmi
  choice: sinmi
  alternative: dáwọ́ iṣẹ́ dúró
  rationale: “Sinmi” pa ìsopọ̀ Jẹ́nẹ́sísì 2:2 àti kókó ọ̀rọ̀ Hébérù 3–4 mọ́, láìfi dandan sọ pé àárẹ̀ mú Ọlọ́run; àlàyé ìsàlẹ̀ fi ìtumọ̀ dídá iṣẹ́ dúró hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àyọlò náà pa àsopọ̀ àti àìṣe pàtó ibi tí orísun Gíríìkì ní mọ́.
