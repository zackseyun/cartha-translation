source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: yo
  text: Kò sì sí ẹ̀dá kankan tí ó farapamọ́ níwájú rẹ̀; ṣùgbọ́n gbogbo ohun wà ní ìhòòhò, a sì ti ṣí wọn sílẹ̀ pátápátá níwájú ojú rẹ̀[a], ẹni tí a ní láti jìyìn fún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a túmọ̀ sí “ṣí sílẹ̀ pátápátá” wá láti inú ọ̀rọ̀-ìṣe Gíríìkì kan tó ṣọ̀wọ́n. Ó lè mú àwòrán ṣíṣí ọrùn síta tàbí yíyí ọrùn padà sí ẹ̀yìn wá sí ọkàn, ó sì tẹnu mọ́ pé gbogbo ohun farahàn pátápátá níwájú Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gangan, ó lè jẹ́ “ẹni tí ọ̀rọ̀ wa ń tọ̀ sí” tàbí “ẹni tí ọ̀ràn wa wà pẹ̀lú.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ tàbí ọ̀ràn tí a ní láti mú wá síwájú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: ẹ̀dá
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohunkóhun tàbí ẹnikẹ́ni tí a dá. “Ẹ̀dá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè dúró fún ẹ̀dá kan ní ìtumọ̀ gbogbogbò.
- source_word: ἀφανὴς
  choice: farapamọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, kì í ṣe pé ẹ̀dá náà kò ṣeé rí nípa ìwà rẹ̀, bí kò ṣe pé kò lè fi ara rẹ̀ pamọ́ fún àyẹ̀wò Ọlọ́run.
- source_word: ἐνώπιον αὐτοῦ
  choice: lójú rẹ̀
  rationale: Ìtumọ̀ gangan ni “níwájú rẹ̀,” ṣùgbọ́n “lójú rẹ̀” jẹ́ èdè Yorùbá àdánidá tó pa ìsopọ̀ pẹ̀lú ojú àti ríran mọ́.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa agbára ìtumọ̀ tó kárí gbogbo nǹkan mọ́, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mu.
- source_word: γυμνὰ
  choice: wà ní ìhòòhò
  rationale: Ó pa àwòrán lílágbára ti àìsí ohun ìbòrí àti ìfarahàn pátápátá mọ́.
- source_word: τετραχηλισμένα
  choice: wọ́n sì ṣí sílẹ̀ pátápátá
  rationale: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí fi ipò ìfarahàn pátápátá hàn, bó tilẹ̀ jẹ́ pé ó tún lè mú àwòrán yíyí ọrùn sí ẹ̀yìn tàbí ṣíṣí ọrùn síta wá sí ọkàn. Àṣàyàn yìí ṣe kedere láìfi ìtumọ̀ àríyànjiyàn kan múlẹ̀ nínú ẹsẹ̀ náà.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: níwájú ojú rẹ̀
  rationale: Ó ṣe àfihàn ìbáṣepọ̀ gbogbo ohun tí a ṣí sílẹ̀ pẹ̀lú ojú Ọlọ́run, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: ẹni tí a ní láti jíhìn fún
  rationale: Gbólóhùn Gíríìkì náà kúkúrú, ó sì jẹ́ àkànlò èdè. Ní àyíká ìmọ̀ Ọlọ́run àti ìdájọ́, “jíhìn fún” fi ojúṣe ènìyàn hàn ní èdè Yorùbá tó yé ni, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'Gbólóhùn náà ń sọ nípa jíjíhìn ènìyàn fún Ọlọ́run: “ẹni tí a ní láti jíhìn fún.”'
  alternative: “ẹni tí ọ̀ràn wa wà pẹ̀lú” tàbí “ẹni tí ọ̀rọ̀ wa ń tọ̀ sí”
  rationale: Àyíká Hébérù 4:12–13 tẹnu mọ́ ìmọ̀ Ọlọ́run tó wọ inú ohun gbogbo àti ìdájọ́ rẹ̀. “Jíhìn fún” pa agbára ìkìlọ̀ náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i; àlàyé ìsàlẹ̀ sì jẹ́ kí àìdánilójú inú Gíríìkì hàn.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ, ní ìforúkọsílẹ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwòrán “ìhòòhò” ni a pa mọ́ nítorí agbára rẹ̀, a sì ṣàlàyé ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n nínú àlàyé ìsàlẹ̀ dípò fífi àwòrán àríyànjiyàn múlẹ̀ nínú ẹsẹ̀.
