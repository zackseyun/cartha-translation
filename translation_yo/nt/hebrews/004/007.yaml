id: HEB.4.7
reference: Hebrews 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: yo
  text: 'Ó tún yan ọjọ́ kan pàtó, “Òní,” nípasẹ̀ Dáfídì, nígbà tí ó sọ lẹ́yìn ìgbà pípẹ́ tó bẹ́ẹ̀, gẹ́gẹ́ bí a ti sọ tẹ́lẹ̀ pé:


    “Òní, bí ẹ bá gbọ́ ohùn rẹ̀,

    ẹ má ṣe mú ọkàn yín le.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Dáfídì,” ìyẹn, nínú Sáàmù tí ó ní í ṣe pẹ̀lú Dáfídì.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Ó tún
  rationale: “Tún” fi hàn pé àríyànjiyàn náà ń padà sí ìgbésẹ̀ Ọlọ́run láti yan ọjọ́ kan lẹ́ẹ̀kan sí i.
- source_word: τινὰ ὁρίζει ἡμέραν
  choice: yan ọjọ́ kan pàtó
  rationale: “Yan” sọ agbára ìpinnu inú ὁρίζει, “kan pàtó” sì pa ìtumọ̀ ọjọ́ kan tí a tọ́ka sí ṣùgbọ́n tí a kò tíì dárúkọ mọ́.
- source_word: Σήμερον
  choice: Òní
  rationale: A pa á mọ́ gẹ́gẹ́ bí orúkọ ọjọ́ tí Ọlọ́run yàn àti ọ̀rọ̀ pàtàkì nínú àyọlò Sáàmù.
- source_word: ἐν Δαυὶδ λέγων
  choice: nígbà tí ó sọ nípasẹ̀ Dáfídì
  rationale: “Nípasẹ̀ Dáfídì” jẹ́ Yorùbá àdánidá fún ọ̀nà tí Ọlọ́run gbà sọ̀rọ̀, láìfipá pinnu gbogbo ọ̀ràn nípa ẹni tó kọ Sáàmù náà.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: lẹ́yìn ìgbà pípẹ́ tó bẹ́ẹ̀
  rationale: Ó fi ìwọ̀n gígùn àkókò láàárín ìran aginjù àti ọ̀rọ̀ Dáfídì hàn.
- source_word: καθὼς προείρηται
  choice: gẹ́gẹ́ bí a ti sọ tẹ́lẹ̀ pé
  rationale: Ó tọ́ka sí ọ̀rọ̀ tí a ti sọ ṣáájú, tí ó sì ṣì ní ipa nínú àríyànjiyàn yìí.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: bí ẹ bá gbọ́ ohùn rẹ̀
  rationale: Ó pa àídájú ìlànà ἐάν mọ́, ó sì lo àwòrán Bíbélì ti gbígbọ́ ohùn láìparọ́ rẹ̀ sí “gbọ́ràn.”
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: ẹ má ṣe sé ọkàn yín le
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkìlọ̀ pé kí wọn má ṣe mú inú wọn le sí ohùn Ọlọ́run.
theological_decisions:
- issue: Agbára “Òní” nínú àríyànjiyàn nípa ìsinmi Ọlọ́run
  choice: Fi “Òní” hàn gẹ́gẹ́ bí àkókò ìpè Ọlọ́run fún ìdáhùn tí ó ṣì dúró nígbà tí Dáfídì sọ̀rọ̀.
  alternative: Ká a sí ọjọ́ ìtàn náà nìkan, tàbí sí ọjọ́ ìkẹyìn nìkan.
  rationale: Ẹsẹ̀ náà ń tẹnu mọ́ pé lẹ́yìn àkókò pípẹ́ Ọlọ́run tún yan “Òní”; ìtumọ̀ náà kò dín un kù sí ọjọ́ kálẹ́ńdà kan, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ àkókò kan tí ẹsẹ̀ náà kò sọ kún un.
- issue: Ìtumọ̀ ἐν Δαυὶδ
  choice: nípasẹ̀ Dáfídì
  alternative: nínú Dáfídì, ìyẹn, nínú Sáàmù tí ó ní í ṣe pẹ̀lú Dáfídì
  rationale: Ìtumọ̀ pàtàkì ń sọ pé Ọlọ́run sọ̀rọ̀ nípasẹ̀ Dáfídì; àlàyé ìsàlẹ̀ ojú ewé pa àǹfààní ìtumọ̀ pé ó tọ́ka sí Sáàmù Dáfídì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àyọlò ewì wà ní ìlà méjì láti mú ìkìlọ̀ Sáàmù náà yọ.
