- from: 'Ó tún yan ọjọ́ kan pàtó, “Òní,” nígbà tí ó sọ nípasẹ̀ Dáfídì lẹ́yìn ìgbà pípẹ́ tó bẹ́ẹ̀, gẹ́gẹ́ bí a ti sọ tẹ́lẹ̀ pé:


