  to: 'Ó tún yan ọjọ́ kan pàtó, “Òní,” nípasẹ̀ Dáfídì, nígbà tí ó sọ lẹ́yìn ìgbà pípẹ́ tó bẹ́ẹ̀, gẹ́gẹ́ bí a ti sọ tẹ́lẹ̀ pé:


