review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àríyànjiyàn Gíríìkì náà dáadáa: Ọlọ́run tún ń yàn ‘Òní’ gẹ́gẹ́ bí ọjọ́ kan, ó sì tọ́ka sí gbólóhùn Sáàmù náà lẹ́yìn àkókò pípẹ́. Ṣùgbọ́n ‘nígbà tí ó sọ nípasẹ̀ Dáfídì’ lè dà bíi pé ìgbà náà gan-an ni Dáfídì sọ̀rọ̀, dípò kí ó jẹ́ ọ̀nà tí Ọlọ́run gbà sọ̀rọ̀ nínú ìtẹ̀síwájú gbolóhùn náà.'
  naturalness: ‘Ẹ má ṣe sé ọkàn yín le’ kò rọrùn tó nínú Yorùbá òde òní; ‘ẹ má ṣe mú ọkàn yín le’ jẹ́ ọ̀nà tí ó hàn gbangba, tí ó sì jẹ́ àdánidá. Ìṣètò ‘nípasẹ̀ Dáfídì, ó sọ...’ tún yọrí sí gbolóhùn tí ó mọ́gbọ́n dání.
  terminology: ‘Òní,’ ‘ohùn rẹ̀,’ àti ‘ọkàn yín’ bójú mu sí ọ̀rọ̀ àyọlò Sáàmù àti sí ìforígbárí ọkàn tí ἐὰν...ἀκούσητε / μὴ σκληρύνητε ń sọ. ‘Dáfídì’ jẹ́ ìlò orúkọ tí ó yẹ.
  issues:
  - severity: medium
    issue: Ìṣètò ‘nígbà tí ó sọ nípasẹ̀ Dáfídì’
    rationale: Ó lè sọ pé Dáfídì ni kókó-ọrọ̀ ‘ó sọ,’ tàbí kí ó mú ‘nígbà tí’ dà bí ìtọ́kasí àkókò tí kò ṣe kókó nínú ἐν Δαυὶδ λέγων. Gíríìkì náà ń fi Dáfídì hàn gẹ́gẹ́ bí ọ̀nà/ààyè ìsọ̀rọ̀ náà.
  - severity: medium
    issue: ‘ẹ má ṣe sé ọkàn yín le’
    rationale: Fọ́ọ̀mù ‘sé ... le’ kò dára bí ‘mú ... le’ nínú ìlò Yorùbá àdánidá; àtúnṣe náà pa ìkìlọ̀ lòdì sí líle ọkàn mọ́.
