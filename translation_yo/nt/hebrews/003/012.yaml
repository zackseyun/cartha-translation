id: HEB.3.12
reference: Hebrews 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: yo
  text: Ẹ ṣọ́ra, ẹ̀yin ará[a], kí ọkàn búburú tí kò ní ìgbàgbọ́[b] má bàa wà nínú ẹnikẹ́ni yín, ní yíyà kúrò lọ́dọ̀ Ọlọ́run alààyè[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀, ṣùgbọ́n ó lè pe gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí “ọkàn búburú aláìṣòótọ́.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “ní fífi Ọlọ́run alààyè sílẹ̀” tàbí “ní yíyapa kúrò lọ́dọ̀ Ọlọ́run alààyè.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó jẹ́ ìkìlọ̀ tó pe àwọn olùgbọ́ sí ìṣọ́ra.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìjọ tàbí ẹlẹgbẹ́ nínú ìgbàgbọ́, ó sì lè tọ́ka sí ọkùnrin àti obìnrin bí ọ̀rọ̀ Gíríìkì náà ṣe lè ṣe ní àyíká yìí.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: ọkàn búburú tí kò ní ìgbàgbọ́
  rationale: “Ọkàn” pa àwòrán orísun mọ́ gẹ́gẹ́ bí ibùdó èrò, ìfẹ́ àti ìpinnu; gbólóhùn náà sì sọ àìgbàgbọ́ di ànímọ́ ọkàn láìsọ pé ó kàn jẹ́ àìlera lasan.
- source_word: ἐν τῷ ἀποστῆναι
  choice: tí yóò yí padà
  rationale: “Yí padà” fi ìtumọ̀ kíkúrò tàbí yíyapa hàn ní èdè Yorùbá tó ṣe kedere, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtó kan kún un.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: kúrò lọ́dọ̀ Ọlọ́run alààyè
  rationale: “Ọlọ́run alààyè” pa ọ̀rọ̀ Bíbélì tó mọ̀ọ́mọ̀ yà Ọlọ́run sí mímọ́ gẹ́gẹ́ bí ẹni tí ó wà láàyè mọ́.
theological_decisions:
- issue: Bóyá ἀπιστίας túmọ̀ sí àìgbàgbọ́ tàbí àìṣòótọ́
  choice: tí kò ní ìgbàgbọ́
  alternative: ọkàn búburú aláìṣòótọ́
  rationale: Àyíká Hébérù 3 tẹnumọ́ kíkọ̀ láti gba ọ̀rọ̀ Ọlọ́run gbọ́; síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ àìṣòótọ́ mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe.
- issue: Bóyá ἀποστῆναι yẹ kí a fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lágbára bí “ṣubú kúrò nínú ìgbàgbọ́” túmọ̀
  choice: yí padà kúrò
  alternative: ṣubú kúrò / yà kúrò
  rationale: “Yí padà kúrò” pa ìkìlọ̀ náà mọ́ ní kíkún ṣùgbọ́n kò sọ ọ́ di ọ̀rọ̀ imọ̀ ẹ̀kọ́ ìsìn pàtó tí orísun kò fi dandan múlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Ẹ ṣọ́ra” jẹ́ ìkìlọ̀ àdánidá; “ẹ̀yin ará” sì yẹ fún ìpè sí àwùjọ onígbàgbọ́ láìdi akọ nìkan mọ́.
