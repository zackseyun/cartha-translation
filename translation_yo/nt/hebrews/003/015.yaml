  source_fidelity: 'Ìtumọ̀ náà tọ́ka sí gbogbo àwọn ìpín pàtàkì nínú Gíríìkì: ìgbà tí a ń sọ ọ̀rọ̀ náà, ìkìlọ̀ ‘Lónìí,’ gbígbọ́ ohùn rẹ̀, àti ìtọ́kasí sí ìṣọ̀tẹ̀. Síbẹ̀, ‘bí nígbà ìṣọ̀tẹ̀’ kò pé ní ìṣọ̀kan gírámà Yorùbá; a tún lè fi ìtumọ̀ ìkìlọ̀ náà hàn ní ọ̀nà tó rọrùn sí i láì pàdánù ìfẹ́-àyànfẹ́ nínú ‘má ṣe sé ọkàn yín le.’'
