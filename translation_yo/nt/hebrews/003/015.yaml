  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: yo
  text: nígbà tí a ń sọ pé, “Lónìí, bí ẹ bá gbọ́ ohùn rẹ̀, ẹ má ṣe jẹ́ kí ọkàn yín le gẹ́gẹ́ bí i ti rí ní ìgbà ìṣọ̀tẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: nígbà tí a ń sọ pé
  rationale: Ìtumọ̀ yìí mú iṣẹ́ àìparí inú ọ̀rọ̀ Gíríìkì jáde, ó sì fi hàn pé ọ̀rọ̀ tí a fa yọ ṣì ń sọ̀rọ̀ sí àwọn olùgbọ́ nísinsìnyí.
- source_word: Σήμερον
  choice: Lónìí
  rationale: Ọ̀rọ̀ àkókò tó ṣe déédé ni, tó sì pa ìkánjú ìpè inú Sáàmù mọ́.
- source_word: ἐὰν ... ἀκούσητε
  choice: bí ẹ bá gbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ gbólóhùn oníṣ шарт condition náà, láì sọ ó di ohun tó dájú tàbí tó ń ṣẹlẹ̀ léraléra.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ohùn rẹ̀
  rationale: Ó pa ìtọ́ka sí Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ń bá àwọn ènìyàn sọ̀rọ̀.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: ẹ má ṣe sé ọkàn yín le
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún mímú ọkàn le, tí ó sì pa ìtumọ̀ ọkàn gẹ́gẹ́ bí inú ènìyàn mọ́, kì í ṣe ìmọ̀lára nìkan.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: bí nígbà ìṣọ̀tẹ̀
  rationale: Ìṣọ̀tẹ̀ sọ ìkọ̀sí Ọlọ́run ní aginjù ní èdè òde òní tó ṣe kedere ju ọ̀rọ̀ tó túmọ̀ sí ‘ìmúnibínú’ lọ.
theological_decisions:
- issue: Ìtumọ̀ παραπικρασμός nínú ọ̀rọ̀ tí a fa yọ láti Sáàmù 95
  choice: ìṣọ̀tẹ̀
  alternative: ìmúnibínú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìkọ̀sí àti àìgbọ́ràn Ísírẹ́lì ní aginjù; ‘ìṣọ̀tẹ̀’ mú agbára ìwà àti májẹ̀mú inú ọ̀rọ̀ náà jáde ní Yorùbá òde òní.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. Àmì ohùn wà ní ibi tí ó bá yẹ. A yan ‘a ń sọ’ láti pa irisi ohun tí a ń sọ lọ́wọ́ mọ́, bí ó tilẹ̀ jẹ́ pé ‘nígbà tí a sọ pé’ lè dùn mọ́ etí sí i.
