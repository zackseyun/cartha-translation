source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: yo
  text: Nítorí pé ilé kọ̀ọ̀kan ni ẹnì kan kọ́, ṣùgbọ́n Ọlọ́run ni ẹni tí ó kọ́ ohun gbogbo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘gbogbo nǹkan.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: olúkúlùkù
  rationale: Pẹ̀lú οἶκος tó jẹ́ ọ̀rọ̀ ẹyọ, πᾶς ní ìtumọ̀ pínpín, ìyẹn ‘ilé kọ̀ọ̀kan’ tàbí ‘olúkúlùkù ilé.’
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi ìdí àlàyé fún ọ̀rọ̀ tó ṣáájú múlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti so èrò náà pọ̀ ní Yorùbá.
- source_word: οἶκος
  choice: ilé
  rationale: ‘Ilé’ pa àwòrán ohun tí a kọ́ mọ́, ó sì fàyè gba ìtumọ̀ àfiwé inú àyíká láìyára túmọ̀ ọ́ sí agbo ilé.
- source_word: κατασκευάζεται
  choice: ni … kọ́
  rationale: Ìkọ́lé ni àwòrán pàtàkì níbí; ìṣètò Yorùbá yìí sọ iṣẹ́ alágbàṣe tí ọ̀rọ̀ ìṣe aláìṣe Gíríìkì tọ́ka sí ní kedere.
- source_word: ὑπό τινος
  choice: ẹnì kan
  rationale: ὑπό pẹ̀lú ọ̀rọ̀ olùní fi aṣojú iṣẹ́ hàn, tandis que τις jẹ́ aláìsọ pàtó; ‘ẹnì kan’ jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: ὁ δὲ
  choice: ṣùgbọ́n … ni ẹni tí
  rationale: ‘Ṣùgbọ́n’ pa ìyípadà onírẹ̀lẹ̀ sí ìparí àríyànjiyàn mọ́; ‘ni ẹni tí’ ń gbé agbára participle tí a lò gẹ́gẹ́ bí orúkọ jáde.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtóbi àpapọ̀ πάντα mọ́ láìfi ìtumọ̀ àlàyé bí ‘gbogbo àgbáyé’ kún un.
- source_word: κατασκευάσας
  choice: kọ́
  rationale: Lílo ‘kọ́’ lẹ́ẹ̀kejì pa ìbámu ọ̀rọ̀ àti àfiwé ìkọ́lé inú ẹsẹ náà mọ́.
- source_word: θεός
  choice: Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tààrà fún θεός, ó sì dá ẹni tó kọ́ ohun gbogbo mọ̀ ní kedere.
theological_decisions:
- issue: Bóyá kí a mú ìdánimọ̀ Ọlọ́run gẹ́gẹ́ bí ẹni tó kọ́ ohun gbogbo rọ̀ tàbí kí a fi í ṣókùnkùn
  choice: Ọlọ́run ni ẹni tí ó kọ́ ohun gbogbo
  alternative: ẹni tí ó kọ́ ohun gbogbo ni Ọlọ́run
  rationale: Gíríìkì dá Ọlọ́run mọ̀ gẹ́gẹ́ bí olùkọ́ ohun gbogbo. Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ àti ìyàtọ̀ àríyànjiyàn náà mọ́ láìfi àlàyé ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘olúkúlùkù ilé’ láti fi agbára pínpín πᾶς hàn, a sì tún ‘kọ́’ lò láti pa eré ọ̀rọ̀ ìkọ́lé inú Gíríìkì mọ́. Àmì ẹsẹ̀ [a] tẹ̀lé àkọsílẹ̀ ìtumọ̀ míràn tí a pèsè, bí ó tilẹ̀ jẹ́ pé nínú Gíríìkì ὑπό τινος túmọ̀ sí ‘láti ọwọ́ ẹnì kan’ ní pàtó.
