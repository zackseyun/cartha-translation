  to: Nítorí pé ilé kọ̀ọ̀kan ni ẹnì kan kọ́, ṣùgbọ́n Ọlọ́run ni ẹni tí ó kọ́ ohun gbogbo[a].
  rationale: A rọ́pò “olúkúlùkù ilé” pẹ̀lú “ilé kọ̀ọ̀kan” fún lílo Yorùbá tó dáa sí i, láìyí agbára pínpín πᾶς padà. A tún gbe àmì àlàyé sí “ohun gbogbo,” a sì tún ọ̀rọ̀ àlàyé náà ṣe kí ó lè fi àṣàyàn gidi fún πάντα hàn. Ìyókù ìtumọ̀ náà pa ìbátan ìkọ́lé àti ìdánimọ̀ Ọlọ́run nínú Gíríìkì mọ́.
