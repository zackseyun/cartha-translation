  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń fi ìbéèrè méjèèjì, ìṣe gbígbọ́ tí ó ṣáájú ìṣọ̀tẹ̀, àti ‘nípasẹ̀ Mósè’ hàn dáadáa. ‘ṣọ̀tẹ̀’ jẹ́ ìtumọ̀ tó bójú mu fún παρεπίκραναν nínú àyíká ìran aginjù, níwọ̀n bí àlàyé ìsàlẹ̀ ti pa yíyan ‘mú bínú’ mọ́.
  naturalness: ‘Nítorí àwọn wo ni’ kì í ṣe ọ̀nà tó rọrùn jù lọ nínú Yorùbá òde òní fún ìbéèrè ẹni púpọ̀. ‘Nítorí ta ni àwọn tí...?’ jẹ́ ohun àdánidá síi, ó sì ń pa ìtumọ̀ púpọ̀ ti τίνες mọ́. Àlàyé ìsàlẹ̀ náà tún nílò ìṣàtúnṣe kékeré kí aṣojú-ọrọ̀ ‘un/rẹ̀’ má bà a jẹ́ aláìní ìtọ́kasí.
  terminology: ‘Íjíbítì,’ ‘Mósè,’ ‘ṣọ̀tẹ̀,’ àti ‘Ọlọ́run’ bá ìlò Yorùbá boṣewa àti ìforúkọsílẹ̀ Bíbélì mu. ‘nípasẹ̀ Mósè’ pa ipa aṣojú/ohun èlò ti διὰ Μωϋσέως mọ́ láì fi ‘aṣáájú’ kún un.
