source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: yo
  text: Nítorí ta ni àwọn tí, nígbà tí wọ́n gbọ́, wọ́n ṣọ̀tẹ̀[a]? Ṣé kì í ṣe gbogbo àwọn tí wọ́n jáde kúrò ní Íjíbítì nípasẹ̀ Mósè?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n mú Ọlọ́run bínú” tàbí “wọ́n mú inú Ọlọ́run korò.” A lè tú ọ̀rọ̀ Gíríìkì náà lọ́nà tó sún mọ́ ọ̀rọ̀ rẹ̀ gan-an báyìí; ṣùgbọ́n níhìn-ín, ó ń tọ́ka sí bí Ísírẹ́lì ṣe ṣọ̀tẹ̀ sí Ọlọ́run ní aginjù.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: àwọn wo ni
  rationale: Ó fi hàn pé ìbéèrè náà ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn kan, ó sì pa agbára ìbéèrè àsọyé mọ́.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé àti ìkìlọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àtìlẹ́yìn.
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́
  rationale: Ó sọ ìṣe àṣáájú náà ní Yorùbá àdánidá, láì sọ ohun tí wọ́n gbọ́ sí pàtó ju Gíríìkì lọ.
- source_word: παρεπίκραναν
  choice: wọ́n ṣọ̀tẹ̀
  rationale: Nínú ọ̀rọ̀ ìran aginjù, ọ̀rọ̀ náà ń tọ́ka sí àìgbọ́ràn tí ó ru Ọlọ́run sókè; ‘ṣọ̀tẹ̀’ mú ìtumọ̀ yẹn hàn kedere fún òǹkàwé òde òní.
- source_word: ἀλλ’ οὐ πάντες
  choice: Ṣé kì í ṣe gbogbo
  rationale: Ìtumọ̀ yìí pa ìbéèrè àsọyé tí ó ń retí ìdáhùn ‘béẹ̀ ni’ mọ́ ní Yorùbá àdánidá.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: àwọn tí wọ́n jáde kúrò ní Íjíbítì
  rationale: Ó ṣàfihàn àwọn ẹni tí wọ́n kópa nínú ìjádelọ láti Íjíbítì ní ọ̀nà tó ṣe kedere.
- source_word: διὰ Μωϋσέως
  choice: nípasẹ̀ Mósè
  rationale: Ó pa ìtumọ̀ ohun èlò tàbí aṣojú tí διά pẹ̀lú ọ̀rọ̀ orúkọ oníṣe ń gbé jáde mọ́, láì túmọ̀ rẹ̀ sí ‘lábẹ́ aṣáájú Mósè’.
theological_decisions:
- issue: Ìtumọ̀ παραπικραίνω nínú ọ̀rọ̀ ìran aginjù
  choice: ṣọ̀tẹ̀
  alternative: mú un bínú; mú kí ọkàn rẹ̀ korò
  rationale: ‘Ṣọ̀tẹ̀’ sọ ìwà àìgbọ́ràn Ísírẹ́lì ní aginjù ní kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù lọ mọ́ fún àyẹ̀wò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘Ṣé kì í ṣe...?’ láti mú ìbéèrè àsọyé kejì dun bí Yorùbá àdánidá.
