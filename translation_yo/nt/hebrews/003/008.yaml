id: HEB.3.8
reference: Hebrews 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: yo
  text: Ẹ má ṣe sọ ọkàn yín di líle bí nígbà ìṣọ̀tẹ̀ náà,[a] bí ní ọjọ́ ìdánwò ní aginjù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé àwọn orúkọ ibi Hébérù tó wà lẹ́yìn Sáàmù 95:8, “bí ní Meríbà, bí ní ọjọ́ náà ní Màsà nínú aginjù.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: Ẹ má ṣe sọ ... di líle
  rationale: Ìkọ̀lé ìdènà yìí ń bá aorist active subjunctive pẹ̀lú μή mu, ó sì fi ojúṣe ìṣe náà lé àwọn tí a ń bá sọ̀rọ̀ lọ́wọ́.
- source_word: τὰς καρδίας ὑμῶν
  choice: ọkàn yín
  rationale: “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún inú ènìyàn—ìfẹ́, èrò àti ìwà—nígbà tí “yín” pa ìtọ́kasí sí àwùjọ mọ́.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: bí nígbà ìṣọ̀tẹ̀ náà
  rationale: “Ìṣọ̀tẹ̀” sọ ìwà àìgbọ́ràn tí ó ru Ọlọ́run sókè ní ọ̀nà tí òǹkàwé òde òní lè lóye, láìfi orúkọ ibi Hébérù rọ́pò ọ̀rọ̀ Gíríìkì.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: bí ní ọjọ́ ìdánwò
  rationale: “Bí ní ọjọ́” pa ìfiwéra tó wà nínú κατὰ mọ́ lẹ́gbẹ̀ẹ́ ὡς; “ìdánwò” lè túmọ̀ sí àyẹ̀wò tàbí ìgbìyànjú, ó sì yẹ fún ìṣẹ̀lẹ̀ inú aginjù.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi aṣálẹ̀ tí ìrìn-àjò Ísírẹ́lì ti ṣẹlẹ̀, ó sì pa ìró Ìwé Mímọ́ mọ́.
theological_decisions:
- issue: Ọ̀nà tí a gbà túmọ̀ ìtọ́kasí ìtàn Sáàmù 95
  choice: A túmọ̀ àwọn orúkọ ìṣẹ̀lẹ̀ Gíríìkì sí “ìṣọ̀tẹ̀” àti “ọjọ́ ìdánwò” nínú ẹsẹ pàtàkì.
  alternative: “bí ní Meríbà, ní ọjọ́ Másà ní aginjù”
  rationale: Hébérù ń tọ́ka sí ọ̀rọ̀ Gíríìkì inú Sáàmù 94(95):8 LXX, níbi tí a ti fi àwọn ọ̀rọ̀ ìtumọ̀ rọ́pò orúkọ ibi Hébérù. Nítorí náà, ẹsẹ pàtàkì tẹ̀ lé Gíríìkì, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìpìlẹ̀ Hébérù hàn.
translation_notes:
  register: Yorùbá ìpele àárín tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Sọ ọkàn yín di líle” jẹ́ àṣẹ ìdènà tó ṣe kedere, “ìṣọ̀tẹ̀” sì jẹ́ ọ̀rọ̀ òde òní tí ó pa agbára ìwà búburú inú ọ̀rọ̀ Gíríìkì mọ́.
