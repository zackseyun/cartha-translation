revisions:
- from: Àwọn wo sì ni ó búra fún pé wọn kì yóò wọ inú ìsinmi rẹ̀, bí kò ṣe àwọn tí kò ṣègbọ́ràn[a]?
  to: Nípa àwọn wo sì ni ó búra pé wọn kì yóò wọ inú ìsinmi rẹ̀, bí kò ṣe àwọn tí kò gbọ́ràn[a]?
  rationale: The revision clarifies that the question concerns the persons against whom the oath was sworn, rather than persons to whom an oath was made. It also uses a more natural modern Yoruba expression for disobedience, without altering the source meaning or the footnote’s lexical nuance.
  reviewer_model: gpt-5.6-terra
