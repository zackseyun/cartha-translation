id: HEB.3.18
reference: Hebrews 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: yo
  text: Nípa àwọn wo sì ni ó búra pé wọn kì yóò wọ inú ìsinmi rẹ̀, bí kò ṣe àwọn tí kò gbọ́ràn[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn tí ó kọ̀ láti gbọ́ràn.’ Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ kíkọ̀ láti gbọ́ràn; nínú àyíká yìí, àìgbọ́ràn náà ní ìbáṣepọ̀ tímọ́tímọ́ pẹ̀lú àìnígbàgbọ́ (wo Hébérù 3:19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: Àwọn wo … fún
  rationale: Ọ̀rọ̀ ìbéèrè yìí tọ́ka sí ọ̀pọ̀ ènìyàn; ‘Àwọn wo … fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘fún àwọn wo?’ nínú ìbéèrè àsọyé.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ so ìbéèrè yìí mọ́ ìjíròrò tó ṣáájú láìfi ìtakora líle kún un.
- source_word: ὤμοσεν
  choice: ó búra
  rationale: Èyí pa agbára àti ìjẹ́jẹ̀ẹ́ ọ̀rọ̀ ìbúra inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μὴ εἰσελεύσεσθαι
  choice: pé wọn kì yóò wọ
  rationale: Gbólóhùn ‘pé’ fi àkóónú ìbúra hàn ní Yorùbá àdánidá, ‘kì yóò’ sì sọ ìkọ̀wọ̀lé náà di ohun tí kò ní ṣẹlẹ̀.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: wọ inú ìsinmi rẹ̀
  rationale: ‘Ìsinmi rẹ̀’ pa kókó ọ̀rọ̀ κατάπαυσις nínú Hébérù mọ́, ‘wọ inú’ sì ṣe ìdarí ibi tí εἰς ń fi hàn ní kedere.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àsọyé tí ó ń tọ́ka sí ìdáhùn kan ṣoṣo.
- source_word: τοῖς ἀπειθήσασιν
  choice: àwọn tí kò ṣègbọ́ràn
  rationale: Èyí pa ìtumọ̀ àìgbọ́ràn tàbí kíkọ̀ láti gbọ́ràn mọ́, láìyí ọ̀rọ̀ náà padà sí àìnígbàgbọ́ nìkan.
theological_decisions:
- issue: Ìtumọ̀ ἀπειθήσασιν nínú ìkìlọ̀ Hébérù 3
  choice: àwọn tí kò ṣègbọ́ràn
  alternative: àwọn tí kò gbàgbọ́
  rationale: Ẹsẹ yìí lo ἀπειθέω, kì í ṣe ἀπιστέω. Bó tilẹ̀ jẹ́ pé àyíká rẹ̀ so àìgbọ́ràn mọ́ àìnígbàgbọ́, ìtumọ̀ yìí pa ìyàtọ̀ ọ̀rọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá yẹ; ìṣètò ìbéèrè àsọyé àti ọ̀rọ̀ kókó ‘ìsinmi’ ni a pa mọ́.
