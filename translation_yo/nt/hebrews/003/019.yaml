  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: yo
  text: A sì rí i pé wọn kò lè wọ̀lé nítorí àìgbàgbọ́ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lè má tọ́ka sí àìní ìgbàgbọ́ nìkan, ṣùgbọ́n sí ìkọ̀ láti gbẹ́kẹ̀ lé Ọlọ́run pẹ̀lú ìdúróṣinṣin.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: A sì
  rationale: Ó pa ìṣàn ọ̀rọ̀ mọ́ gẹ́gẹ́ bí àsopọ̀, láìfi agbára ìpinnu tí kò sí nínú Gíríìkì kún un.
- source_word: βλέπομεν
  choice: rí i
  rationale: Ó ṣàfihàn ọ̀rọ̀-ìṣe onísinsìnyí ní ọ̀nà àdánidá, ó sì pa ohùn ẹni-àkọ́kọ́ ọ̀pọ̀ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí gbólóhùn tí ó sọ ohun tí a rí sílẹ̀, gẹ́gẹ́ bí ìṣètò Gíríìkì.
- source_word: οὐκ ἠδυνήθησαν
  choice: wọn kò lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa èrò àìlágbára tàbí àìlèṣe inú δύναμαι mọ́.
- source_word: εἰσελθεῖν
  choice: wọ̀lé
  rationale: Ó túmọ̀ ìwọlé sí ibi ìsinmi tàbí ilẹ̀ ìlérí tí àyíká ọ̀rọ̀ ń tọ́ka sí, láìsọ ohun tí ẹsẹ yìí kò tún dárúkọ.
- source_word: δι’
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative, διά ń sọ ìdí tàbí okùnfà; “nítorí” ni Yorùbá tó ṣe kedere jù.
- source_word: ἀπιστίαν
  choice: àìgbàgbọ́ wọn
  rationale: “Àìgbàgbọ́” fi àìní ìgbàgbọ́ àti kíkọ̀ láti gbẹ́kẹ̀ lé Ọlọ́run hàn. Fífì “wọn” kún un jẹ́ àdánidá ní Yorùbá, ó sì mú kó ṣe kedere pé ti àwọn ènìyàn náà ni àìgbàgbọ́ náà.
theological_decisions:
- issue: Ìtumọ̀ ἀπιστία ní ìbáṣepọ̀ pẹ̀lú πίστις
  choice: àìgbàgbọ́
  alternative: àìṣòótọ́ nínú gbígbẹ́kẹ̀ lé Ọlọ́run
  rationale: Àyíká Hébérù 3 tẹnumọ́ pé Ísírẹ́lì kò gba ọ̀rọ̀ àti ìlérí Ọlọ́run gbọ́. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ àìṣòótọ́ tàbí kíkọ̀ láti gbẹ́kẹ̀ lé e; àlàyé ìsàlẹ̀ pa ìtumọ̀ méjèèjì mọ́ láìfipá yanju ìfarapa ẹ̀kọ́ ìgbàgbọ́ náà.
translation_notes:
  register: Yorùbá Àfẹnusọ tó bójú mu, pẹ̀lú àmì ohùn níbi tí ó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo; “wọ̀lé” pa ìtọ́kasí àyíká sí ilẹ̀/ìsinmi mọ́ láìfi àlàyé sí inú ẹsẹ.
