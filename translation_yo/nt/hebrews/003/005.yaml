source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: yo
  text: Mósè sì jẹ́ olóòótọ́ nínú gbogbo ilé rẹ̀ gẹ́gẹ́ bí ìránṣẹ́,[a] láti jẹ́ ẹ̀rí nípa àwọn ohun tí a ó sọ lẹ́yìn náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí olùránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìránṣẹ́ tó níyì, kì í ṣe dandan sí ẹrú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa àwọn ohun tí a ó máa sọ.” Gbólóhùn náà ń tọ́ka sí àwọn ohun tí a ó sọ ní ọjọ́ iwájú, ṣùgbọ́n kò dárúkọ ẹni tí yóò sọ wọ́n.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ yìí ń tẹ̀ síwájú láti inú àfiwé ẹsẹ tó ṣáájú, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ọ̀nà tí a sábà fi ń kọ orúkọ náà ní Yorùbá.
- source_word: μὲν
  choice: jẹ́ olóòótọ́ (pẹ̀lú ìyàtọ̀ tí ‘sì’ ń múra sílẹ̀)
  rationale: μὲν ń múra apá àkọ́kọ́ ìyàtọ̀ sí δέ ní ẹsẹ tó tẹ̀ lé; kò sí ọ̀rọ̀ Yorùbá kan ṣoṣo tí yóò mú un jáde lọ́nà àdánidá, nítorí náà ìṣètò gbólóhùn àti ‘sì’ ló gbé iṣẹ́ rẹ̀.
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: Ó fi hàn pé Mósè ṣe iṣẹ́ rẹ̀ pẹ̀lú ìṣòtítọ́, kì í ṣe pé a kàn lè gbẹ́kẹ̀ lé e nìkan.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: nínú gbogbo ilé rẹ̀
  rationale: Ó pa àwòrán ‘ilé’ mọ́ láti Númérì 12:7 àti láti inú àríyànjiyàn Hébérù 3, láì dín un kù sí ilé gbígbé lasán.
- source_word: ὡς θεράπων
  choice: gẹ́gẹ́ bí ìránṣẹ́
  rationale: ‘Ìránṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó níyì fún ẹni tó ń ṣe iṣẹ́ fún ẹlòmíràn; kò fi agbára ìtumọ̀ ‘ẹrú’ kún θεράπων.
- source_word: εἰς μαρτύριον
  choice: láti jẹ́ ẹ̀rí
  rationale: Ó ṣàfihàn ète tàbí àbájáde iṣẹ́ Mósè ní Yorùbá tó ṣe kedere.
- source_word: τῶν λαληθησομένων
  choice: nípa àwọn ohun tí a ó sọ lẹ́yìn náà
  rationale: Ó pa àìsọ ẹni tó máa sọ ọ̀rọ̀ náà mọ́, ó sì mú ìtọ́ka ọ̀rọ̀ náà sí ọjọ́ iwájú hàn gbangba.
theological_decisions:
- issue: Ìtumọ̀ ‘ilé rẹ̀’ ní ìbáṣepọ̀ pẹ̀lú Mósè
  choice: Pa ‘ilé rẹ̀’ mọ́ gẹ́gẹ́ bí àwòrán Bíbélì fún ilé tàbí àwọn ènìyàn Ọlọ́run tí Mósè ti ń sìn.
  alternative: ‘gbogbo agbo ilé rẹ̀,’ èyí tó mú ìtumọ̀ àwọn ènìyàn inú ilé hàn gbangba sí i.
  rationale: Àyíká Hébérù 3 àti Númérì 12:7 ń lo àwòrán ilé fún àwọn ènìyàn àti ètò Ọlọ́run; fífi ‘ilé’ sílẹ̀ ń pa ìsopọ̀ yẹn mọ́ láì pinnu ohun tí àwòrán náà túmọ̀ sí ju bó ṣe yẹ lọ.
- issue: Agbára ìtumọ̀ θεράπων
  choice: ‘ìránṣẹ́,’ kì í ṣe ‘ẹrú.’
  alternative: ‘olùrànlọ́wọ́’ tàbí ‘òjíṣẹ́.’
  rationale: θεράπων ní ìtumọ̀ iṣẹ́ ìsìn tó níyì, ó sì yàtọ̀ sí δοῦλος; ‘ìránṣẹ́’ ń pa ìyàtọ̀ Mósè gẹ́gẹ́ bí ìránṣẹ́ àti Ọmọ ní ẹsẹ tó tẹ̀ lé mọ́.
- issue: Ẹni tó máa sọ àwọn ohun ọjọ́ iwájú
  choice: 'Lo àkójọpọ̀ aláìlórúkọ: ‘àwọn ohun tí a ó sọ lẹ́yìn náà.’'
  alternative: ‘àwọn ohun tí Ọlọ́run yóò sọ lẹ́yìn náà.’
  rationale: Gíríìkì jẹ́ ọ̀rọ̀ àbáṣe tí kò dárúkọ olùsọ̀rọ̀; bí ó tilẹ̀ jẹ́ pé àyíká lè tọ́ka sí ìṣípayá Ọlọ́run, a kò gbọ́dọ̀ fi orúkọ Ọlọ́run sínú ọ̀rọ̀ pàtàkì láìsí i ní orísun.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘ilé’ àti àìdárúkọ olùsọ̀rọ̀ inú Gíríìkì mọ́; a sì lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
