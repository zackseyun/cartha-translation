id: HEB.3.1
reference: Hebrews 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará mímọ́[a], ẹ̀yin tí ẹ ní ìpín nínú ìpè ti ọ̀run[b], ẹ ronú jinlẹ̀ nípa Jésù, àpọ́sítélì àti olórí àlùfáà ìjẹ́wọ́ wa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ sí “arákùnrin,” ṣùgbọ́n níbí ó ń bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ẹ̀yin alábàápín nínú ìpè ti ọ̀run.”
    reason: lexical_alternative
  - marker: c
    text: 'Tàbí, “ẹ ronú jinlẹ̀ nípa ẹni tí à ń jẹ́wọ́: Jésù, àpọ́sítélì àti olórí àlùfáà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Nítorí náà
  rationale: Ó fi ìparí tàbí àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ hàn, pàápàá Hébérù 2:17–18.
- source_word: ἀδελφοὶ ἅγιοι
  choice: ẹ̀yin ará mímọ́
  rationale: “Ará” jẹ́ ọ̀nà àdánidá ní Yorùbá láti bá gbogbo ìjọ àwọn onígbàgbọ́ sọ̀rọ̀; “mímọ́” pa èrò àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run mọ́.
- source_word: κλήσεως ἐπουρανίου
  choice: ìpè ti ọ̀run
  rationale: Ó pa èrò ìpè Ọlọ́run àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀run mọ́ láì fi dandan pinnu bóyá ọ̀run ni orísun rẹ̀ tàbí pé ó ní ìwà ti ọ̀run.
- source_word: μέτοχοι
  choice: ẹ̀yin tí ẹ ní ìpín nínú
  rationale: Gbólóhùn yìí sọ ìkópa àti pípín nínú ohun kan ní Yorùbá òde òní tó ṣe kedere.
- source_word: κατανοήσατε
  choice: ẹ ronú jinlẹ̀ nípa
  rationale: Ó mú àṣẹ láti fi àkíyèsí àti ìrònú tó jinlẹ̀ wo Jésù jáde ní èdè àdánidá.
- source_word: ἀπόστολον
  choice: àpọ́sítélì
  rationale: A pa oyè tí ẹsẹ̀ náà fi fún Jésù mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí “ẹni tí a rán.”
- source_word: ἀρχιερέα
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ipò àlùfáà gíga tí ó ṣe pàtàkì nínú Hébérù.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: ìjẹ́wọ́ wa
  rationale: Ó pa àkópọ̀ orúkọ Gíríìkì àti ìtumọ̀ ìjẹ́wọ́ apapọ̀ àwọn onígbàgbọ́ mọ́, láì dín un kù sí ìgbàgbọ́ inú nìkan.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Èyí ni àkọtọ orúkọ náà tí a ti fi ẹsẹ̀ múlẹ̀ ní Yorùbá.
theological_decisions:
- issue: Àwọn tí ἀδελφοὶ ń tọ́ka sí
  choice: “ẹ̀yin ará mímọ́” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé gbogbo àwùjọ onígbàgbọ́ ni ó kàn
  alternative: “ẹ̀yin arákùnrin mímọ́”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n ó ń bá gbogbo àwùjọ sọ̀rọ̀. “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi obìnrin sílẹ̀ lẹ́yìn, àkọsílẹ̀ ìsàlẹ̀ sì jẹ́ kí ìrísí Gíríìkì àti ìkópa àwọn obìnrin hàn gbangba.
- issue: Lílo ἀπόστολον fún Jésù
  choice: Pa oyè “àpọ́sítélì” mọ́
  alternative: “ẹni tí a rán” tàbí “aṣojú”
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo oyè yìí fún Jésù; pípa á mọ́ ń dáàbò bo agbára ẹ̀kọ́ ìgbàgbọ́ àti ìkọ̀wé rẹ̀ láì fi ìtumọ̀ ẹ̀ya ìjọ kan kún un.
- issue: Ìbáṣepọ̀ τῆς ὁμολογίας ἡμῶν pẹ̀lú àwọn oyè méjèèjì
  choice: “àpọ́sítélì àti olórí àlùfáà ìjẹ́wọ́ wa”
  alternative: “Jésù, ẹni tí à ń jẹ́wọ́, àpọ́sítélì àti olórí àlùfáà”
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìtòlẹ́sẹẹsẹ genitive Gíríìkì mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fi ọ̀nà ìtumọ̀ míì tí gírámà lè gbà sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin” láti mú ìpè tààrà sí àwùjọ hàn, a sì lo “ẹ ronú jinlẹ̀” láti sọ agbára àṣẹ κατανοήσατε ní ọ̀nà àdánidá.
