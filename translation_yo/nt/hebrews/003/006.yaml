- from: Ṣùgbọ́n Mèsáyà[a] jẹ́ olóòótọ́ gẹ́gẹ́ bí Ọmọ lórí ilé rẹ̀. Àwa sì ni ilé náà, bí a bá di ìgboyà[b] wa àti ìṣògo ìrètí wa[c] mú ṣinṣin.
  to: Ṣùgbọ́n Mèsáyà[a] jẹ́ Ọmọ lórí ilé rẹ̀. Àwa sì ni ilé náà, bí a bá di ìgboyà[b] wa àti ìṣògo ìrètí wa[c] mú ṣinṣin.
  rationale: The sole necessary correction is to remove “jẹ́ olóòótọ́,” since it has no lexical basis in the source text for this verse. The revised wording keeps the source’s compressed assertion that the Messiah is Son over the house, preserves the unresolved reference of “rẹ̀,” and retains the conditional force without doctrinal expansion. The πιστός lexical-decision entry should likewise be deleted from the project metadata.
