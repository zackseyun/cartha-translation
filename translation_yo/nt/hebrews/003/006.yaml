id: HEB.3.6
reference: Hebrews 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: yo
  text: Ṣùgbọ́n Mèsáyà[a] jẹ́ Ọmọ lórí ilé rẹ̀. Àwa sì ni ilé náà, bí a bá di ìgboyà[b] wa àti ìṣògo ìrètí wa[c] mú ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oyè Gíríìkì Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè, “Mèsáyà,” tàbí gẹ́gẹ́ bí àpèjúwe tó dà bí orúkọ, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì παρρησία lè túmọ̀ sí òmìnira ọ̀rọ̀, ṣíṣí ọkàn, tàbí ìgboyà tó kún fún ìgbẹ́kẹ̀lé.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìgbẹ́kẹ̀lé tí ìrètí ń mú wá” tàbí “ayọ̀ ńlá nínú ìrètí.” Ọ̀rọ̀ Gíríìkì καύχημα lè túmọ̀ sí ìṣògo, ohun tí a fi ń ṣògo, tàbí ìgbẹ́kẹ̀lé aláyọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A lò ó gẹ́gẹ́ bí oyè ní àyíká ìfiwéra Mósè pẹ̀lú Ọmọ; àlàyé ìsàlẹ̀ ojú ìwé pa yíyan ‘Kristi’ mọ́ gẹ́gẹ́ bí ọ̀nà mìíràn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó wà láàárín iṣẹ́ Mósè ní ẹsẹ karùn-ún àti ipò Ọmọ hàn.
- source_word: ὡς υἱὸς
  choice: gẹ́gẹ́ bí Ọmọ
  rationale: Ó pa agbára ìfiwéra ὡς mọ́; lílo lẹ́tà ńlá fún ‘Ọmọ’ jẹ́ kí ó ṣe kedere pé Mèsáyà ni a ń tọ́ka sí.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: lórí ilé rẹ̀
  rationale: ‘Lórí’ fi àṣẹ àti àbójútó hàn, ‘ilé’ sì pa àwòrán οἶκος mọ́. Arọ́pò-orúkọ ‘rẹ̀’ kò pinnu ní pàtó bóyá Ọlọ́run tàbí Ọmọ ni ẹni tí ilé náà jẹ́.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Àwa sì ni ilé náà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa àwòrán pé àwọn ènìyàn Ọlọ́run ni ilé rẹ̀ mọ́.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Ètò ọ̀rọ̀ àídájú Yorùbá yìí fi ipò gidi tí Gíríìkì sọ hàn láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Ó ní ìtumọ̀ ọkàn líle, òmìnira ọ̀rọ̀ àti ìgbẹ́kẹ̀lé; ‘ìgboyà’ dá agbára ọ̀rọ̀ náà dúró ní àyíká yìí.
- source_word: καύχημα
  choice: ìṣògo
  rationale: Ó sọ ohun tí ènìyàn fi ń yangàn tàbí yọ̀ pẹ̀lú ìgbẹ́kẹ̀lé; ‘ìṣògo’ yẹra fún ìtumọ̀ búburú tó sábà máa ń bá ‘ìyangàn’ lọ.
- source_word: τῆς ἐλπίδος
  choice: ìrètí wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘wa’ kò fara hàn ní Gíríìkì, àyíká ẹni àkọ́kọ́ púpọ̀ mú un ṣe kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: κατάσχωμεν
  choice: di ... mú ṣinṣin
  rationale: Ó fi ìfaradà nínú dídú ohun kan mú láìjẹ́ kí ó lọ hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: πιστός (implied from Hebrews 3:2, 5)
  choice: jẹ́ olóòótọ́
  rationale: Gbólóhùn Gíríìkì fi ọ̀rọ̀ àpólà yìí sílẹ̀ nítorí a ti sọ ọ́ nínú àyíká tó ṣáájú; fífi í hàn mú gbólóhùn Yorùbá pé láìyí ìtumọ̀ padà.
theological_decisions:
- issue: Bóyá Χριστός jẹ́ oyè tàbí orúkọ tó ti fẹ́rẹ̀ẹ́ di orúkọ ẹni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká náà ń fi Mósè wé ẹni tí Ọlọ́run yàn, nítorí náà agbára oyè náà ṣì hàn; àlàyé pa ìtumọ̀ mìíràn mọ́.
- issue: Agbára gbólóhùn àídájú ἐὰν ... κατάσχωμεν
  choice: bí a bá ... di ... mú ṣinṣin
  alternative: kìkì bí a bá ... di ... mú ṣinṣin
  rationale: Èyí pa ìkìlọ̀ àti ìfẹ̀sẹ̀múlẹ̀ àídájú inú Gíríìkì mọ́ láìyanju ìjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ìfaradà tàbí ìṣubú kúrò nínú ìgbàgbọ́.
- issue: Ẹni tí αὐτοῦ (‘rẹ̀’) ń tọ́ka sí
  choice: ilé rẹ̀
  alternative: ilé Ọlọ́run / ilé Ọmọ
  rationale: Arọ́pò-orúkọ náà pa àìdánilójú gidi inú ìtòlẹ́sẹẹsẹ Gíríìkì mọ́, dípò kí ìtumọ̀ pinnu ẹni tí ilé náà jẹ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. ‘Ilé’ pa àwòrán ìdílé/ilé Ọlọ́run mọ́; ‘di ... mú ṣinṣin’ sì jẹ́ ọ̀rọ̀ àdánidá fún ìfaradà. Àtúmọ̀ náà kò tú àìdánilójú arọ́pò-orúkọ tàbí ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn àídájú náà.
