    text: Tàbí, “ìgbẹ́kẹ̀lé tí ìrètí ń mú wá” tàbí “ayọ̀ ńlá nínú ìrètí.” Ọ̀rọ̀ Gíríìkì καύχημα lè túmọ̀ sí ìṣògo, ohun tí a fi ń ṣògo, tàbí ìgbẹ́kẹ̀lé aláyọ̀.
    reason: lexical_alternative
