review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly supplies “jẹ́ olóòótọ́” (“was/is faithful”). πιστός is not present in Hebrews 3:6 in the cited Greek text; it belongs to the preceding context and must not be carried into this verse. Apart from that addition, the contrast, Son-over-house image, conditional clause, and exhortation to hold fast are represented faithfully.
  naturalness: The Yoruba is generally clear and suitably formal. Removing the unsupported predicate also produces a more direct rendering. “Àwa sì ni ilé náà” naturally refers back to the house, while retaining the house metaphor.
  terminology: “Mèsáyà,” “Ọmọ,” “ilé,” “ìgboyà,” and “ìrètí” are appropriate. “Ìṣògo” is a defensible rendering of καύχημα, and the notes responsibly preserve alternatives. The alternate wording in note c is made slightly more idiomatic.
  issues:
  - severity: high
    issue: Unsupported “jẹ́ olóòótọ́” in the translation and its associated lexical decision
    rationale: The Greek text of Hebrews 3:6 begins Χριστὸς δὲ ὡς υἱὸς and contains no form of πιστός. Adding “faithful” imports wording from the preceding context into this verse.
  revised_text: Ṣùgbọ́n Mèsáyà[a] jẹ́ Ọmọ lórí ilé rẹ̀. Àwa sì ni ilé náà, bí a bá di ìgboyà[b] wa àti ìṣògo ìrètí wa[c] mú ṣinṣin.
  revised_footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oyè Gíríìkì Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè, “Mèsáyà,” tàbí gẹ́gẹ́ bí àpèjúwe tó dà bí orúkọ, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì παρρησία lè túmọ̀ sí òmìnira ọ̀rọ̀, ṣíṣí ọkàn, tàbí ìgboyà tó kún fún ìgbẹ́kẹ̀lé.
    reason: lexical_alternative
