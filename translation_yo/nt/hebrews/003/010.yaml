  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: yo
  text: Fún ogójì ọdún, nítorí náà, mo bínú gidigidi sí ìran yìí[a], mo sì wí pé, “Nígbà gbogbo ni wọ́n máa ń ṣìnà nínú ọkàn wọn[b], ṣùgbọ́n wọn kò mọ̀ àwọn ọ̀nà mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “inú mi kò dùn sí ìran yìí” tàbí “mo rí ìran yìí ní ìríra”; ọ̀rọ̀ Gíríìkì náà lè fi àìní inú tó lágbára, títí kan ìríra, hàn.
    reason: lexical_alternative
  - marker: b
    text: Nínú ọ̀rọ̀ Gíríìkì náà, “ọkàn” jẹ́ ẹyọ nínú gbólóhùn náà; ó ṣeé ṣe kí ó wo gbogbo ìran náà gẹ́gẹ́ bí ẹgbẹ́ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Fún ogójì ọdún
  rationale: Ó fi àkókò tó gùn tó ogójì ọdún hàn ní Yorùbá àdánidá, gẹ́gẹ́ bí accusative of extent of time.
- source_word: διὸ
  choice: nítorí náà
  rationale: Ó pa ìtumọ̀ ìyọrísí tàbí ìparí èrò mọ́, ó sì so ọ̀rọ̀ náà mọ́ ohun tó ṣáájú.
- source_word: προσώχθισα
  choice: mo bínú gidigidi sí
  rationale: Ọ̀rọ̀ náà ń fi ìbínú tàbí àìní inú tó lágbára hàn. Àfikún “gidigidi” ń pa agbára ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di ìríra nìkan.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: sí ìran yìí
  rationale: “Sí” ni Yorùbá àdánidá tí ó bá “bínú” mu, “ìran yìí” sì tọ́ka sí àwọn ènìyàn ìgbà náà gẹ́gẹ́ bí ẹgbẹ́ kan.
- source_word: καὶ εἶπον
  choice: mo sì wí pé
  rationale: Ó pa ẹni àkọ́kọ́ tó ń sọ̀rọ̀ mọ́, “wí pé” sì ní ìforúkọsílẹ̀ ọlọ́lá tó yẹ fún àyọlò Ìwé Mímọ́.
- source_word: Ἀεὶ
  choice: Nígbà gbogbo
  rationale: Ó túmọ̀ sí ìwà tó ń ṣẹlẹ̀ ní gbogbo ìgbà tàbí léraléra.
- source_word: πλανῶνται
  choice: wọ́n máa ń ṣìnà
  rationale: Ó fi ìṣìnà tó ń bá a lọ hàn, ní ti ìwà àti ìbáṣepọ̀ wọn pẹ̀lú Ọlọ́run.
- source_word: τῇ καρδίᾳ
  choice: nínú ọkàn wọn
  rationale: Yorùbá sábà máa ń lo “ọkàn” láì fi àmì ọ̀pọ̀ kún un lẹ́yìn arọ́pò-orúkọ ọ̀pọ̀; èyí jẹ́ àdánidá, ó sì tún lè gba ìtumọ̀ ẹgbẹ́ kan tí ẹyọ Gíríìkì ní.
- source_word: αὐτοὶ δὲ
  choice: ṣùgbọ́n wọn
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tó wà láàárín ìṣìnà wọn àti àìmọ̀ ọ̀nà Ọlọ́run hàn kedere.
- source_word: οὐκ ἔγνωσαν
  choice: wọn kò mọ
  rationale: “Mọ” pa ìtumọ̀ ìmọ̀ tó lè kan ìbáṣepọ̀ àti ìrírí mọ́, kì í ṣe òye ọpọlọ nìkan.
- source_word: τὰς ὁδούς μου
  choice: àwọn ọ̀nà mi
  rationale: Ó pa àwòrán ọ̀nà mọ́ fún ìṣe Ọlọ́run àti ipa ọ̀nà tí ó fẹ́ kí àwọn ènìyàn rẹ̀ máa tọ̀.
theological_decisions:
- issue: Ìbínú Ọlọ́run nínú προσώχθισα
  choice: mo bínú gidigidi sí
  alternative: mo rí ìran yìí ní ìríra; inú mi kò dùn sí ìran yìí
  rationale: Ìtumọ̀ yìí jẹ́ kí àìní inú Ọlọ́run tó lágbára dúró láì dín un kù, bẹ́ẹ̀ ni kò fi dandan mú un dé ìtumọ̀ ìríra tó lágbára jù.
- issue: Ẹyọ tó dúró fún gbogbo ẹgbẹ́ nínú τῇ καρδίᾳ
  choice: nínú ọkàn wọn
  alternative: nínú àwọn ọkàn wọn
  rationale: “Ọkàn wọn” jẹ́ Yorùbá àdánidá, ó sì lè tọ́ka sí ìran náà gẹ́gẹ́ bí odindi kan; “àwọn ọkàn wọn” yóò tẹnumọ́ olúkúlùkù ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. “Wí pé” ń mú ìforúkọsílẹ̀ Ìwé Mímọ́ wá láì di èdè àtijọ́ tí kò ṣeé lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
