id: HEB.3.13
reference: Hebrews 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa gba ara yín níyànjú[b] lójoojúmọ́, níwọ̀n ìgbà tí a ń pè é ní “Òní”[a], kí ẹnikẹ́ni nínú yín má bàa di olókàn líle nípasẹ̀ ẹ̀tàn ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Òní” ń tún ọ̀rọ̀ Sáàmù 95 sọ, ó sì ń tọ́ka sí àkókò ìsinsìnyí tí a gbọ́dọ̀ dáhùn sí ìpè Ọlọ́run.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ máa fún ara yín ní ìṣírí” tàbí “ẹ máa ranni létí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígbàníyànjú, fífi ìṣírí fúnni, rírànní létí ohun tí ó yẹ, tàbí fífi ìtùnú fúnni, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ìkìlọ̀ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: παρακαλεῖτε
  choice: ẹ máa gba ... níyànjú
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífúnni níṣìírí, gbígbàníyànjú, tàbí kíkìlọ̀ pẹ̀lú ìrọ̀lẹ́. Nínú àyíká yìí, ‘gba ... níyànjú’ ní ìtumọ̀ fífún ara ẹni lókun láti dúró ṣinṣin, láìsọ ọ̀rọ̀ náà di líle ju bó ṣe yẹ lọ.
- source_word: ἑαυτοὺς
  choice: ara yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà ni ‘ara yín,’ pẹ̀lú àṣẹ ọ̀pọ̀ ènìyàn ó ní agbára ìṣe láàárín ara wọn; Yorùbá ‘ẹ máa gba ara yín níyànjú’ sọ ojúṣe àjọṣe yìí ní kedere.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó sọ pé kí ìṣe náà máa ṣẹlẹ̀ ní gbogbo ọjọ́, ó sì jẹ́ ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: ἄχρις οὗ
  choice: níwọ̀n ìgbà tí
  rationale: 'Ó pa ìmọ̀lára àkókò tó ń bá a lọ mọ́: kí wọ́n máa ṣe é ní gbogbo àkókò tí ‘Òní’ ṣì wà nípè.'
- source_word: τὸ Σήμερον ... καλεῖται
  choice: a ṣì ń pe ọjọ́ náà ní “Òní”
  rationale: Àmì ọ̀rọ̀ yí ‘Òní’ ká ń pa ìtẹnumọ́ rẹ̀ gẹ́gẹ́ bí àtúnṣe Sáàmù 95 mọ́; fífi ‘ọjọ́ náà’ kún un mú gbólóhùn náà ṣe kedere àti àdánidá ní Yorùbá.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète àti àbájáde búburú tí a fẹ́ dènà.
- source_word: σκληρυνθῇ
  choice: di olókàn líle
  rationale: Ó fi ìyípadà sí ipò líle ọkàn hàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà, láìfi ohun tí ẹsẹ náà kò sọ kún un.
- source_word: τις ἐξ ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Pẹ̀lú gbólóhùn òdì ‘má bàa,’ èyí ń kìlọ̀ pé kí ìṣẹ̀lẹ̀ náà má ṣẹlẹ̀ sí ẹnikẹ́ni nínú gbogbo wọn.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: nípasẹ̀ ẹ̀tàn ẹ̀ṣẹ̀
  rationale: ‘Nípasẹ̀’ pa ipa dátífù gẹ́gẹ́ bí ohun èlò mọ́, ‘ẹ̀tàn ẹ̀ṣẹ̀’ sì sọ pé ẹ̀ṣẹ̀ ń tan ènìyàn jẹ láìtú ìtumọ̀ náà síwájú ju orísun lọ.
theological_decisions:
- issue: Ìṣe ìgbàníyànjú láàárín àwọn ọmọ ìjọ
  choice: ara yín
  alternative: ẹnì kejì yín
  rationale: Arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀ ó sì ní ìtumọ̀ ìṣe tí wọ́n ń ṣe fún ara wọn. ‘Ara yín’ bá àṣà Yorùbá mu, ó sì pa ojúṣe gbogbo àwùjọ mọ́.
- issue: Ìtumọ̀ τὸ Σήμερον
  choice: “Òní” gẹ́gẹ́ bí àkókò ìpè Ọlọ́run tó ń bẹ lọ́wọ́
  alternative: òní gẹ́gẹ́ bí ọjọ́ lásán
  rationale: Nínú Hébérù 3, ọ̀rọ̀ náà ń tọ́ka sí Sáàmù 95, ó sì tẹnumọ́ àǹfààní ìsinsìnyí láti dáhùn sí Ọlọ́run. Àmì ọ̀rọ̀ yí i ká ń pa ìtọ́kasí yìí mọ́ láìfi àlàyé sínú ẹsẹ náà.
- issue: Olùṣe ìlíle ọkàn
  choice: gbólóhùn tó fi ẹ̀tàn ẹ̀ṣẹ̀ hàn gẹ́gẹ́ bí ọ̀nà tí líle ọkàn fi ń wáyé
  alternative: sọ pé Ọlọ́run tàbí ènìyàn fúnra rẹ̀ ni ó mú ọkàn le
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ afìṣe, kò sì dárúkọ olùṣe pàtó; ìtumọ̀ náà kò yanju àìmọ̀ yìí nípa fífi olùṣe kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àṣẹ ‘ẹ máa ...’ fi ìṣe tó ń bá a lọ hàn. ‘Olókàn líle’ jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, ó sì yẹ fún ìkìlọ̀ mímọ́ tí ẹsẹ náà ń sọ.
