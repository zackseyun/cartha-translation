  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: yo
  text: ẹni tí ó jẹ́ olóòtítọ́ sí ẹni tí ó yàn án[a], gẹ́gẹ́ bí Mósè náà ṣe jẹ́ olóòtítọ́ nínú ilé rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ẹni tí ó ṣe é.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ṣe” tàbí “dá,” ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí “yàn sí ipò” tàbí “rán sí iṣẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní “nínú gbogbo ilé rẹ̀,” tí ó jọ ọ̀rọ̀ inú Númérì 12:7 gan-an; àwọn mìíràn ní “nínú ilé rẹ̀” nìkan. Ó ṣeé ṣe kí “ilé rẹ̀” túmọ̀ sí ilé Ọlọ́run.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: ẹni tí ó jẹ́ olóòtítọ́
  rationale: Gbólóhùn alábápín yìí ń ṣàpèjúwe Jésù tí a mẹ́nu kàn ní ẹsẹ̀ 1. Lílo gbólóhùn ìbátan bá èdè Yorùbá àdánidá mu, “olóòtítọ́” sì ń sọ nípa ẹni tí a lè gbẹ́kẹ̀ lé, kì í ṣe kìkì ẹni tí ó ní ìgbàgbọ́.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: sí ẹni tí ó yàn án
  rationale: ποιέω lè túmọ̀ sí “ṣe” tàbí “dá,” ṣùgbọ́n nínú ọ̀rọ̀ nípa iṣẹ́ àpọ́sítélì àti àlùfáà àgbà, àti ìfiwéra pẹ̀lú Mósè, “yàn án” fi ìtumọ̀ fífi sí ipò tàbí rán sí iṣẹ́ hàn dáadáa. Àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ míì mọ́.
- source_word: ὡς καὶ
  choice: gẹ́gẹ́ bí ... pẹ̀lú
  rationale: Èyí fi ìfiwéra Jésù àti Mósè hàn ní Yorùbá àdánidá.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ọ̀nà tí orúkọ náà gbà wọ́pọ̀ nínú Yorùbá.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: nínú ilé rẹ̀
  rationale: A pa àwòrán “ilé” mọ́ nítorí àwọn ẹsẹ̀ tó tẹ̀ lé ń mú un gbòòrò. A tún pa arọ́pò-orúkọ “rẹ̀” mọ́, láì pinnu ẹni tí ó ń tọ́ka sí nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ ποιήσαντι nígbà tí ó ń tọ́ka sí Ọmọ
  choice: yàn án
  alternative: ṣe é tàbí dá a
  rationale: “Yàn án” bá àyíká fífi Jésù sí iṣẹ́ mu, ó sì yẹra fún fífi ìtumọ̀ pé a dá Ọmọ gẹ́gẹ́ bí ẹ̀dá sí ọ̀rọ̀ náà. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́wọ́ pé “ṣe” jẹ́ ìtumọ̀ gidi tí ọ̀rọ̀ Gíríìkì lè ní.
- issue: Ẹni tí “rẹ̀” nínú “ilé rẹ̀” ń tọ́ka sí
  choice: A pa “ilé rẹ̀” mọ́; ó ṣeé ṣe kí ó jẹ́ ilé Ọlọ́run
  alternative: Ilé Mósè
  rationale: Àyíká àti ìtọ́kasí sí Númérì 12:7 ń tọ́ka sí ilé Ọlọ́run, ṣùgbọ́n a kò fi “Ọlọ́run” rọ́pò arọ́pò-orúkọ Gíríìkì, kí àìdánilójú inú ọ̀rọ̀ náà lè wà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn níbi tí ó bá yẹ. “Ilé” ni a pa mọ́ dípò “agbo ilé” nítorí àwòrán ilé jẹ́ kókó nínú àwọn ẹsẹ̀ tó tẹ̀ lé.
