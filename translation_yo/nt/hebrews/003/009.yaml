  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: yo
  text: níbi tí àwọn baba yín ti dán mi wò nínú ìdánwò[a], tí wọ́n sì rí àwọn iṣẹ́ mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “níbi tí àwọn baba yín ti dán mi wò nípa ìdánwò,” tàbí “ti dán mi wò nípa dídánwò.” Gbólóhùn Gíríìkì náà ṣòro, ó sì lè tọ́ka sí ọ̀nà tàbí ohun èlò ìdánwò náà.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan sọ gbólóhùn tó tẹ̀ lé e ní ọ̀nà ìyọ̀ǹda pé, “síbẹ̀ wọ́n rí àwọn iṣẹ́ mi,” tàbí “bí ó tilẹ̀ jẹ́ pé wọ́n rí àwọn iṣẹ́ mi.” Gíríìkì kàn sọ pé, “wọ́n sì rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: níbi tí
  rationale: Ó tọ́ka sí ibi aginjù tí ẹsẹ tó ṣáájú sọ; ‘níbi tí’ pa ìtumọ̀ ibi mọ́ láì yí i sí ‘nígbà tí.’
- source_word: ἐπείρασαν
  choice: dán mi wò
  rationale: ‘Dán … wò’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ẹnì kan sí àdánwò; ‘mi’ ni a fi kún un gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí, nítorí àyíká ọ̀rọ̀ náà ń tọ́ka sí Ọlọ́run.
- source_word: οἱ πατέρες ὑμῶν
  choice: àwọn baba yín
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì pa ìforúkọsílẹ̀ ìtàn àti májẹ̀mú mọ́; nínú àyíká yìí ó túmọ̀ sí àwọn baba ìran wọn.
- source_word: ἐν δοκιμασίᾳ
  choice: nínú ìdánwò
  rationale: Gbólóhùn náà le sọ ipò, ọ̀nà, tàbí ohun èlò ìdánwò. ‘Nínú ìdánwò’ pa àìdánilójú yẹn mọ́ dípò lílo ìtumọ̀ kan ṣoṣo.
- source_word: καὶ εἶδον
  choice: tí wọ́n sì rí
  rationale: Ó tú καί gẹ́gẹ́ bí àsopọ̀ lásán, láì fi ìtumọ̀ ìyàtọ̀ bí ‘síbẹ̀síbẹ̀’ kún un.
- source_word: τὰ ἔργα μου
  choice: àwọn iṣẹ́ mi
  rationale: ‘Àwọn iṣẹ́ mi’ pa ìrísí ọ̀pọ̀ ἔργα àti ìró èdè Bíbélì mọ́, ó sì tọ́ka sí àwọn ohun tí Ọlọ́run ṣe ní aginjù.
theological_decisions:
- issue: Ohun tí àwọn baba náà dán wò
  choice: dán mi wò
  alternative: dán wò
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘mi’ kò farahàn gbangba nínú gbólóhùn Gíríìkì yìí, àyíká àyọlò Sáàmù 95 fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí wọ́n dán wò. Fífi ‘mi’ kún un mú Yorùbá ṣe kedere láì fi ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ ‘wọ́n sì rí’ pẹ̀lú gbólóhùn tó ṣáájú
  choice: tí wọ́n sì rí
  alternative: bí ó tilẹ̀ jẹ́ pé wọ́n rí
  rationale: Gíríìkì ní καί, àsopọ̀ lásán. A kò sọ ọ́ di gbólóhùn ìyọ̀ǹda nínú ọ̀rọ̀ pàtàkì, bí ó tilẹ̀ jẹ́ pé àyíká lè jẹ́ kí a lóye rẹ̀ bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Àwọn baba yín’ pa ọ̀rọ̀ orísun mọ́, nígbà tí àyíká mú kedere pé àwọn baba ìran wọn ni.
