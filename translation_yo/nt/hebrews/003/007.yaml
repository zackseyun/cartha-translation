language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: yo
  text: 'Nítorí náà, gẹ́gẹ́ bí Ẹ̀mí Mímọ́ ti ń sọ pé,

    “Lónìí, bí ẹ bá gbọ́ ohùn rẹ̀,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí ó jáde láti inú ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìsopọ̀ ọgbọ́n náà mọ́.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ àyọlò náà pẹ̀lú agbára ìfiwéra tí ó bá Gíríìkì mu.
- source_word: λέγει
  choice: ti ń sọ
  rationale: Àkókò ìsinsìnyí nínú Gíríìkì fi ọ̀rọ̀ Ìwé Mímọ́ hàn gẹ́gẹ́ bí èyí tí Ẹ̀mí Mímọ́ ṣì ń sọ; ‘ti ń sọ’ jẹ́ àdánidá lẹ́yìn ‘gẹ́gẹ́ bí’.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ fún gbólóhùn náà, láìfi ìtẹnumọ́ míì kún un.
- source_word: Σήμερον
  choice: Lónìí
  rationale: Ó túmọ̀ ọ̀rọ̀ àkókò náà ní tààrà, ó sì bá ìbẹ̀rẹ̀ ọ̀rọ̀ àyọlò mu.
- source_word: ἐὰν
  choice: bí
  rationale: Ó pa ìtumọ̀ gbólóhùn oníṣ条件 mọ́ ní Yorùbá àdánidá.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ohùn rẹ̀
  rationale: Ó pa ìtọ́kasí sí ohùn ẹni náà mọ́, láìdín in kù sí kìkì ìró.
- source_word: ἀκούσητε
  choice: ẹ bá gbọ́
  rationale: Ó fi ẹni kejì ọ̀pọ̀ hàn, ó sì túmọ̀ ìgbọ́ ní tààrà láìfipá mú un túmọ̀ sí ṣíṣègbọ́ràn.
theological_decisions:
- issue: Ta ni a sọ pé ó ń sọ ọ̀rọ̀ inú Sáàmù náà?
  choice: A sọ ọ̀rọ̀ àyọlò náà ní tààrà gẹ́gẹ́ bí ọ̀rọ̀ Ẹ̀mí Mímọ́.
  alternative: Ẹ̀mí Mímọ́ ń sọ̀rọ̀ nípasẹ̀ Ìwé Mímọ́ tàbí akọsáàmù.
  rationale: Gíríìkì sọ ní kedere pé ‘Ẹ̀mí Mímọ́ ń sọ.’ Ìtumọ̀ náà pa ìsọ̀rí yìí mọ́ láìṣàlàyé ẹ̀kọ́ ìmísí tí ẹsẹ̀ náà kò sọ ní kíkún.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, ti òde òní, tí ó sì ṣeé lóye ni a lò. ‘Ẹ bá’ fi hàn pé ẹni kejì ọ̀pọ̀ ni Gíríìkì ń bá sọ̀rọ̀. A fi àmì ohùn Yorùbá sí ibi tí ó yẹ.
