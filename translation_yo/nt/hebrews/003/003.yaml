  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: a ti ka ẹni yìí yẹ fún ògo tí ó pọ̀ ju Mósè lọ, àti àfiwé ọlá ẹni tí ó kọ́ ilé sí ilé náà. Ṣùgbọ́n ‘gẹ́gẹ́ bí’ kò fi agbára καθ’ ὅσον (‘níwọ̀n bí/de ìwọ̀n tí’) hàn dáadáa, àti ‘ilé’ nílò àmì ‘náà’ kí αὐτόν, ẹni tí ó ń tọ́ka sí ilé náà, lè hàn kedere.'
