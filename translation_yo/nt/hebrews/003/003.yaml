id: HEB.3.3
reference: Hebrews 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: yo
  text: Nítorí a ti ka ẹni yìí sí ẹni tí ó yẹ fún ògo tí ó pọ̀ ju ti Mósè lọ, níwọ̀n bí ẹni tí ó kọ́ ilé náà ní ọlá tí ó pọ̀ ju ti ilé náà lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ẹni yìí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Jésù nínú àyíká ọ̀rọ̀, ṣùgbọ́n a pa ìtọ́kasí náà mọ́ láì fi orúkọ kún ẹsẹ náà.
- source_word: ἠξίωται
  choice: a ti ka ... sí ẹni tí ó yẹ fún
  rationale: Ó fi ìṣe tí a ti ṣe sí ẹni náà hàn, ó sì pa èrò ‘kíkà sí ẹni tí ó yẹ’ mọ́.
- source_word: δόξης
  choice: ògo
  rationale: ‘Ògo’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún δόξα nínú àyíká yìí.
- source_word: παρὰ Μωϋσῆν
  choice: ju ti Mósè lọ
  rationale: παρά pẹ̀lú ẹ̀sùn-ọrọ níbí ń fi ìfiwéra hàn.
- source_word: καθ’ ὅσον
  choice: gẹ́gẹ́ bí
  rationale: Ó so ìfiwéra kejì mọ́ àkọ́kọ́ lọ́nà àdánidá, ní ìtumọ̀ ‘gẹ́gẹ́ bí’ tàbí ‘dé ìwọ̀n tí’.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: ẹni tí ó kọ́ ilé
  rationale: κατασκευάζω lè túmọ̀ sí kọ́, pèsè, tàbí ṣètò; ‘kọ́ ilé’ jẹ́ èdè Yorùbá àdánidá nínú àwòrán ilé yìí.
- source_word: τιμὴν ἔχει
  choice: ní ọlá
  rationale: Ó fi ìtumọ̀ ‘ní ọlá’ hàn ní kedere àti ní èdè Yorùbá tó rọrùn.
theological_decisions:
- issue: Ẹni tí οὗτος ń tọ́ka sí
  choice: ẹni yìí
  alternative: Jésù
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ni, ṣùgbọ́n fífi ‘ẹni yìí’ sílẹ̀ pa ìṣètò àti ìtọ́kasí Gíríìkì mọ́ láì ṣe àfikún.
- issue: Ìtumọ̀ κατασκευάσας
  choice: ẹni tí ó kọ́ ilé
  alternative: ẹni tí ó pèsè ilé / ẹni tí ó dá ilé náà sílẹ̀
  rationale: ‘Kọ́ ilé’ bá àfiwé ilé mu, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí ọ̀rọ̀ náà kò sọ ní tààràtà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àtúnṣe ìfiwéra ‘ju ... lọ’ àti àsopọ̀ ‘gẹ́gẹ́ bí’ fún ìṣàn ọ̀rọ̀ àdánidá.
