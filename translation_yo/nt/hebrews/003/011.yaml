  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: yo
  text: 'gẹ́gẹ́ bí mo ti búra nínú ìbínú mi: “Dájúdájú, wọn kì yóò wọ inú ìsinmi mi láéláé.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ní ìtumọ̀ gangan: “Bí wọn bá wọ inú ìsinmi mi.” Èyí jẹ́ ìlànà ọ̀rọ̀ ìbúra tó túmọ̀ sí pé, “Dájúdájú, wọn kì yóò wọ inú ìsinmi mi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó so ọ̀rọ̀ ìbúra yìí mọ́ àyọlò tó ṣáájú, ó sì túmọ̀ sí ‘gẹ́gẹ́ bí’ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ὤμοσα
  choice: mo ti búra
  rationale: Ọ̀rọ̀ náà tọ́ka sí jíjẹ́ ìbúra; ‘mo ti búra’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìṣe tó ti ṣẹlẹ̀ mọ́.
- source_word: ἐν τῇ ὀργῇ μου
  choice: nínú ìbínú mi
  rationale: ‘Ìbínú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ὀργή, ó sì lè gbé agbára ìdájọ́ mímọ́ inú ọ̀rọ̀ yìí láì fi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: Εἰ εἰσελεύσονται
  choice: Dájúdájú, wọn kì yóò … láéláé
  rationale: Εἰ pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú jẹ́ àṣà ọ̀rọ̀ ìbúra Semitic tó fi ìkọ̀sílẹ̀ líle hàn, kì í ṣe gbólóhùn oníṣ شرط; ìtumọ̀ yìí mú agbára ìbúra náà ṣe kedere ní Yorùbá.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: wọ inú ìsinmi mi
  rationale: ‘Ìsinmi mi’ pa àkòrí κατάπαυσις mọ́ nínú Sáàmù àti Hébérù, kò sì dín un kù sí ilẹ̀ kan, ọ̀run, tàbí ìbàlẹ̀ ọkàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àṣà ọ̀rọ̀ ìbúra Εἰ εἰσελεύσονται
  choice: 'Ìkọ̀sílẹ̀ ìbúra tó ṣe kedere: “Dájúdájú, wọn kì yóò wọ inú ìsinmi mi láéláé.”'
  alternative: 'Ìtumọ̀ tó tẹ̀ lé ìrísí ọ̀rọ̀ ní pẹkipẹki: “Bí wọn yóò bá wọ inú ìsinmi mi.”'
  rationale: Ìtumọ̀ lẹ́tà-kọ̀ọ̀kan lè mú kí òǹkàwé gbọ́ ọ̀rọ̀ náà bí àídájú lasan. Ṣíṣe ìkọ̀sílẹ̀ náà ní gbangba pa agbára ìbúra Gíríìkì/Hébérù mọ́ láì fi ẹ̀kọ́ ìsìn tuntun kún un.
- issue: Ìtumọ̀ κατάπαυσις nínú àyíká ọ̀rọ̀
  choice: ìsinmi
  alternative: ibi ìsinmi
  rationale: Hébérù ń lo κατάπαυσις gẹ́gẹ́ bí àkòrí tó so mọ́ Sáàmù 95 àti ìsinmi Ọlọ́run fúnra rẹ̀. ‘Ìsinmi’ pa ìtẹ̀sí ọ̀rọ̀ àti ìṣòro ìtumọ̀ yẹn mọ́ láì pinnu rẹ̀ sí ibi kan pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Dájúdájú … láéláé’ ń fi agbára ìbúra hàn ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
