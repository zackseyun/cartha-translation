- from: Àwọn wo ni inú Ọlọ́run sì bí sí fún ogójì ọdún? Kì í ha ṣe àwọn tí wọ́n ṣẹ̀, tí òkú wọn ṣubú sínú aginjù?[a]
  to: Àwọn wo ni Ọlọ́run bínú sí fún ogójì ọdún? Ṣé kì í ṣe àwọn tí wọ́n ṣẹ̀, tí ara wọn ṣubú sínú aginjù?[a]
  rationale: Àtúnṣe náà mú ìṣètò ìbéèrè náà di Yorùbá adayeba, ó sì yí ìtumọ̀ κῶλα padà sí “ara wọn” láti pa ìpele ìtumọ̀ orísun mọ́. Àṣàyàn “òkú wọn,” tó fi ìtumọ̀ àyíká ìdájọ́ hàn ní kíkún, wà nínú àlàyé ìsàlẹ̀.
