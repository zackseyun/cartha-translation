  source_fidelity: Ìtumọ̀ náà gba ìbéèrè méjèèjì, ìgbẹ̀san ọdún ogójì, ẹ̀ṣẹ̀ àwọn ènìyàn náà, àti ìṣubú ara wọn ní aginjù. Ṣùgbọ́n “òkú wọn” tú κῶλα sí ìtumọ̀ ikú tí ó lágbára jù ti ọ̀rọ̀ Gíríìkì lọ; κῶλα níbí ń tọ́ka sí ara wọn, bí ó tilẹ̀ jẹ́ pé àyíká fi ikú hàn.
  naturalness: “Àwọn wo ni inú Ọlọ́run sì bí sí” kò dùn mọ́ Yorùbá boṣewa bí “Àwọn wo ni Ọlọ́run bínú sí.” Bákan náà, “Ṣé kì í ṣe” jẹ́ ọ̀nà àdánidá àti kedere láti fi ìbéèrè àtakò náà hàn.
  terminology: “Ọlọ́run bínú sí,” “fún ogójì ọdún,” “àwọn tí wọ́n ṣẹ̀,” àti “aginjù” bá ìtumọ̀ orísun àti ìlò Yorùbá mu. “Ara wọn” yẹ fún κῶλα; a lè fi “òkú wọn” sí ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tó lágbára.
