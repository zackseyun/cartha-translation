source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: yo
  text: Àwọn wo ni Ọlọ́run bínú sí fún ogójì ọdún? Ṣé kì í ṣe àwọn tí wọ́n ṣẹ̀, tí ara wọn ṣubú sínú aginjù?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí òkú wọn ṣubú sínú aginjù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: inú Ọlọ́run bí sí
  rationale: Òwe Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé Ọlọ́run bínú sí àwọn ènìyàn náà; fífi “Ọlọ́run” hàn ṣe kedere ẹni tí kókó-ọrọ̀ Gíríìkì tí a kò sọ ní tààrà ń tọ́ka sí.
- source_word: τεσσεράκοντα ἔτη
  choice: fún ogójì ọdún
  rationale: Èyí fi iye àkókò tí ọ̀rọ̀ accusative Gíríìkì ń tọ́ka sí hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἁμαρτήσασιν
  choice: àwọn tí wọ́n ṣẹ̀
  rationale: Ó tú participle aorist náà sí Yorùbá tó ṣe kedere láì fi irú ẹ̀ṣẹ̀ kan pàtó kún un.
- source_word: κῶλα
  choice: òkú wọn
  rationale: Nínú àyíká ìdájọ́ ní aginjù, ọ̀rọ̀ náà ń tọ́ka sí ara àwọn tó kú, kì í ṣe ẹsẹ̀ tàbí ẹ̀yà ara lásán; “òkú wọn” jẹ́ àdánidá, ó sì pa ìmúnibíni ọ̀rọ̀ náà mọ́.
- source_word: ἔπεσεν
  choice: ṣubú
  rationale: Ó pa àwòrán ìṣubú inú Gíríìkì mọ́; àyíká àti “òkú” ló mú ikú wọn ṣe kedere.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sínú aginjù
  rationale: “Aginjù” bá ibi ìrìn-àjò Ísírẹ́lì mu, “sínú” sì bá ìṣe ṣubú mu ní Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí kókó-ọrọ̀ tí a fi sílẹ̀ nínú προσώχθισεν ń tọ́ka sí
  choice: Ọlọ́run
  alternative: óun
  rationale: Àyíká ẹsẹ tó ṣáájú fi hàn pé Ọlọ́run ni; dídárúkọ rẹ̀ ń mú ìbéèrè náà ṣe kedere ní Yorùbá láì dá ẹ̀kọ́ tuntun sílẹ̀.
- issue: Bóyá a ó sọ ikú náà ní tààrà
  choice: òkú wọn ṣubú
  alternative: ara wọn ṣubú
  rationale: κῶλα nínú àyíká yìí túmọ̀ sí ara àwọn tí ìdájọ́ pa; “òkú” fi ìtumọ̀ yẹn hàn, nígbà tí “ṣubú” pa àwòrán ọ̀rọ̀ ìṣe Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè àtakò οὐχί ni a fi “Kì í ha ṣe ...?” hàn; “sì” pa δέ mọ́ gẹ́gẹ́ bí ìtẹ̀síwájú ọ̀rọ̀.
