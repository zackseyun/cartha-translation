source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: yo
  text: Nítorí a ti di alábàápín nínú Mèsáyà[a], bí ó bá jẹ́ pé a di ìbẹ̀rẹ̀ ìdánilójú[b] wa mú ṣinṣin títí dé òpin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “alábàáṣe pẹ̀lú Mèsáyà” tàbí “ẹni tí ó ní ìpín nínú Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgboyà.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìdánilójú,” àti ní àwọn àyíká ọ̀rọ̀ kan, “ohun tó fẹsẹ̀ múlẹ̀” tàbí “ohun tí ó wà ní ti gidi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “a di ìbẹ̀rẹ̀ ìdánilójú wa mú títí dé òpin ní ìdúróṣinṣin.”
    reason: previous_rendering
lexical_decisions:
- source_word: μέτοχοι
  choice: alábàápín
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí ó ní ìpín tàbí tí ó ń ṣe alábàápín nínú ohun kan. “Alábàápín” jẹ́ Yorùbá òde òní tí ó ṣe kedere, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìkìlọ̀ tàbí ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: τοῦ Χριστοῦ
  choice: nínú Mèsáyà
  rationale: Níbi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Nínú Mèsáyà” bá ìtumọ̀ μέτοχοι pẹ̀lú genitive mu, ó sì fi èrò jíjẹ́ alábàápín hàn lọ́nà àdánidá.
- source_word: γεγόναμεν
  choice: a ti di
  rationale: Perfect tense náà fi ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ àti ipò tó ń bá a lọ hàn; “a ti di” pa àwọn méjèèjì mọ́.
- source_word: ἐάνπερ
  choice: bí ó bá jẹ́ pé
  rationale: Gbólóhùn yìí pa agbára ìtẹnumọ́ inú condition náà mọ́ ju “bí” nìkan lọ.
- source_word: ἀρχὴν
  choice: ìbẹ̀rẹ̀
  rationale: Ó túmọ̀ sí ìbẹ̀rẹ̀ tàbí ohun tí a ní láti ìpilẹ̀ṣẹ̀.
- source_word: ὑποστάσεως
  choice: ìdánilójú
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí ìdánilójú tàbí ìgboyà tí ó dúró ṣinṣin, dípò ‘ohun-ìní’ tàbí ‘ojúlówó ohun.’ Àkọ́lé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: μέχρι τέλους
  choice: títí dé òpin
  rationale: Ó fi ìfaradà jálẹ̀ gbogbo àkókò títí dé òpin hàn ní Yorùbá àdánidá.
- source_word: βεβαίαν
  choice: ṣinṣin
  rationale: Ó ṣàpèjúwe ohun tí ó fẹsẹ̀ múlẹ̀, tí kò yẹ̀ tàbí mì; ó bá “di ... mú” mu dáadáa.
- source_word: κατάσχωμεν
  choice: a di ... mú
  rationale: Ó fi ìtumọ̀ dídadúró lórí ohun kan àti pípa á mọ́ hàn, pàápàá nínú condition tí ó ń sọ̀rọ̀ nípa ìfaradà.
theological_decisions:
- issue: Gbólóhùn onícondition àti ìfaradà
  choice: 'A túmọ̀ ἐάνπερ gẹ́gẹ́ bí condition gidi: “bí ó bá jẹ́ pé a ... mú ... títí dé òpin.”'
  alternative: A lè ka ìfaradà náà gẹ́gẹ́ bí ẹ̀rí pé ẹni náà ti jẹ́ alábàápín tẹ́lẹ̀, tàbí gẹ́gẹ́ bí ohun tí jíjẹ́ alábàápín ń sinmi lé lórí.
  rationale: Gíríìkì sọ condition náà ní kedere, ṣùgbọ́n kò pinnu fúnra rẹ̀ bí àwọn ètò ẹ̀kọ́ ìsìn tó yàtọ̀ ṣe máa ṣàlàyé ìfaradà tàbí ìṣubú kúrò. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ yìí mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ àtijọ́ tí kò pọ̀ mọ́ ní lílò.
