  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: yo
  text: Àní májẹ̀mú àkọ́kọ́ náà ní àwọn ìlànà fún ìjọsìn àti ibi mímọ́ ti ayé yìí[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “èyí àkọ́kọ́”—ìyẹn ni, májẹ̀mú àkọ́kọ́; àwọn kan sì lóye rẹ̀ ní gbogbogbòò sí i gẹ́gẹ́ bí “ètò àkọ́kọ́.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “ibi mímọ́ ti ara ayé”; ó ṣeé ṣe kí ìtumọ̀ rẹ̀ níbí jẹ́ “ibi mímọ́ ti ayé yìí,” ní ìyàtọ̀ sí àwọn ohun ti ọ̀run tí a jíròrò lẹ́yìn nínú orí yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: ní
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń ṣàlàyé ohun tí ètò àkọ́kọ́ ní; “ní” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ ohun-ìní mọ́.
- source_word: μὲν οὖν
  choice: Àní
  rationale: Ní àyíká yìí, àkójọpọ̀ náà ń tẹ̀síwájú nínú ọ̀rọ̀ pẹ̀lú ìtẹnumọ́ díẹ̀. “Àní” mú ìtẹnumọ́ náà jáde láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἡ πρώτη
  choice: májẹ̀mú àkọ́kọ́ náà
  rationale: Ọ̀rọ̀-orúkọ obìnrin tí a fi sílẹ̀ tọ́ka sí májẹ̀mú àkọ́kọ́ tí 8:13 ṣẹ̀ṣẹ̀ mẹ́nu kàn. Fífi “májẹ̀mú” kún un mú Yorùbá yé kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δικαιώματα
  choice: àwọn ìlànà
  rationale: Nínú àyíká ìjọsìn yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn àṣẹ tàbí ìlànà tí a là kalẹ̀; “àwọn ìlànà” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: λατρείας
  choice: fún ìjọsìn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí iṣẹ́ ìsìn sí Ọlọ́run; “fún ìjọsìn” fi ète àwọn ìlànà náà hàn lọ́nà àdánidá.
- source_word: τό τε ἅγιον
  choice: ibi mímọ́
  rationale: Ó ń tọ́ka sí ibi tí a yà sí mímọ́ fún ìjọsìn. “Ibi mímọ́” gbòòrò tó láti jẹ́ kí àwọn ẹsẹ tó tẹ̀ lé ṣàlàyé àwọn apá inú rẹ̀.
- source_word: κοσμικόν
  choice: ti ayé yìí
  rationale: Níbí, ọ̀rọ̀ náà ń ṣe ìyàtọ̀ láàárín ibi mímọ́ ilẹ̀ ayé àti àwọn ohun ti ọ̀run; yíyan yìí yẹra fún ìtumọ̀ ìwà búburú tí “ti ayé” lè ní bí a kò bá sọ ọ́ ní kíkún.
theological_decisions:
- issue: Ohun tí ἡ πρώτη ń tọ́ka sí
  choice: májẹ̀mú àkọ́kọ́
  alternative: èyí àkọ́kọ́; ètò àkọ́kọ́; àgọ́ àkọ́kọ́
  rationale: Àyíká tó sún mọ́ ọn jù lọ, pàápàá Hébérù 8:13, ń fi májẹ̀mú àkọ́kọ́ àti tuntun wéra. Síbẹ̀, nítorí Gíríìkì kò tún “májẹ̀mú” sọ ní gbangba, àlàyé ìsàlẹ̀ jẹ́wọ́ àìdánilójú náà.
- issue: Ìtumọ̀ κοσμικόν
  choice: ti ayé yìí
  alternative: ti ayé; ti ara ayé
  rationale: Ìyàtọ̀ pàtàkì nínú orí náà ni ibi mímọ́ ilẹ̀ ayé ní ìfiwéra pẹ̀lú òtítọ́ ti ọ̀run, kì í ṣe ìyàtọ̀ láàárín ìwà mímọ́ àti ìwà búburú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì yẹ fún olùkà òde òní. A yan “májẹ̀mú” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀, “ibi mímọ́” sì yẹra fún dídín ìtumọ̀ sí yàrá kan pàtó.
