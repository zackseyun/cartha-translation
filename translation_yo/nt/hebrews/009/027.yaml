id: HEB.9.27
reference: Hebrews 9:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: yo
  text: Àti gẹ́gẹ́ bí a ti pinnu pé àwọn ènìyàn yóò kú lẹ́ẹ̀kan ṣoṣo, lẹ́yìn èyí sì ni ìdájọ́,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: gẹ́gẹ́ bí
  rationale: Ọ̀rọ̀ yìí bẹ̀rẹ̀ ìfiwéra tí ẹsẹ tó tẹ̀ lé e máa parí; “gẹ́gẹ́ bí” jẹ́ ọ̀nà àdánidá láti fi ìbáṣepọ̀ náà hàn ní Yorùbá.
- source_word: ἀπόκειται
  choice: a ti pinnu rẹ̀
  rationale: Nínú àkópọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí a ti fi lélẹ̀ tàbí tí a ti yàn gẹ́gẹ́ bí ohun tí yóò ṣẹlẹ̀, kì í ṣe ohun tí a kàn fi pamọ́.
- source_word: τοῖς ἀνθρώποις
  choice: fún àwọn ènìyàn
  rationale: ἄνθρωποι ń tọ́ka sí gbogbo ẹ̀dá ènìyàn ní gbogbogbò, kì í ṣe àwọn ọkùnrin nìkan. “Àwọn ènìyàn” sọ ìtumọ̀ àpapọ̀ náà ní kedere àti ní Yorùbá àdánidá.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  rationale: Ó tọ́ka sí ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan; “lẹ́ẹ̀kan ṣoṣo” jẹ́ kedere láìfi ìtumọ̀ “lẹ́ẹ̀kan fún gbogbo ìgbà” tí kò pọndandan sí i.
- source_word: ἀποθανεῖν
  choice: láti kú
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá fún infinitive náà.
- source_word: μετὰ δὲ τοῦτο
  choice: lẹ́yìn èyí sì
  rationale: Ó pa tẹ̀lé-tẹ̀lé láàárín ikú àti ìdájọ́ mọ́; “sì” tún ṣe iṣẹ́ δέ ní ọ̀nà Yorùbá tó rọrùn.
- source_word: κρίσις
  choice: ìdájọ́
  rationale: “Ìdájọ́” pa ìtumọ̀ ìṣàyẹ̀wò onídàájọ́ mọ́ láìdín in kù sí ìdálẹ́bi tàbí ṣàfikún ètò ẹ̀kọ́ nípa ọjọ́ ìkẹyìn.
theological_decisions:
- issue: Ìtọ́kasí gbogbo ènìyàn nínú τοῖς ἀνθρώποις
  choice: “Àwọn ènìyàn,” tó ní gbogbo ẹ̀dá ènìyàn nínú
  alternative: “Àwọn ọkùnrin”
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní plural akọ ní gírámà, agbára rẹ̀ níbí jẹ́ ti gbogbo ẹ̀dá ènìyàn. Yorùbá “àwọn ènìyàn” pa ìtumọ̀ yẹn mọ́ láìjẹ́ kí a gbọ́ ọ́ bí ẹni pé akọ nìkan ni.
- issue: Ìwọ̀n ìtumọ̀ κρίσις lẹ́yìn ikú
  choice: “Ìdájọ́” láìsọ àbájáde tàbí ètò ọjọ́ ìkẹyìn pàtó
  alternative: “Ìdálẹ́bi” tàbí “ìdájọ́ ìkẹyìn”
  rationale: Ẹsẹ náà sọ pé ìdájọ́ wà lẹ́yìn ikú, ṣùgbọ́n kò sọ níbí pé àbájáde rẹ̀ jẹ́ ìdálẹ́bi fún gbogbo ènìyàn, bẹ́ẹ̀ ni kò ṣàlàyé gbogbo ètò eschatology.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá, kedere, ó sì bá olùkà òde òní mu. A fi koma sí òpin nítorí pé gbólóhùn náà ń bá ìfiwéra lọ sínú Hébérù 9:28.
