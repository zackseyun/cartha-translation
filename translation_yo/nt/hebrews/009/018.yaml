  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: yo
  text: Nítorí náà, a kò tilẹ̀ dá májẹ̀mú àkọ́kọ́ náà sílẹ̀ láìsí ẹ̀jẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yí àkọ́kọ́.” Nínú Gíríìkì, ọ̀rọ̀ náà ní “àkọ́kọ́” nìkan; àyíká ọ̀rọ̀ náà tọ́ka sí májẹ̀mú àkọ́kọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tí ó ṣáájú hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: οὐδὲ
  choice: a kò tilẹ̀
  rationale: Ó pa ìtẹnumọ́ ‘not even’ mọ́, pé ìlànà náà kan ìjẹ̀jẹ̀ àkọ́kọ́ pẹ̀lú.
- source_word: ἡ πρώτη
  choice: ìjẹ̀jẹ̀ àkọ́kọ́ náà
  rationale: Ọ̀rọ̀-orúkọ náà kò sí ní Gíríìkì, ṣùgbọ́n àpèjúwe abo náà tọ́ka sí ìjẹ̀jẹ̀ tí àyíká ọ̀rọ̀ ń jíròrò; fífi ‘ìjẹ̀jẹ̀’ kún un mú un ṣe kedere ní Yorùbá.
- source_word: χωρὶς αἵματος
  choice: láìsí ẹ̀jẹ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún àìsí ẹ̀jẹ̀, ó sì pa ìtumọ̀ ẹbọ àti ìjẹ̀jẹ̀ mọ́.
- source_word: ἐγκεκαίνισται
  choice: fi … múlẹ̀
  rationale: Nínú àyíká ìjẹ̀jẹ̀ yìí, ó sọ bí a ṣe dá ìjẹ̀jẹ̀ náà sílẹ̀ tí a sì mú un bẹ̀rẹ̀ sí í ṣiṣẹ́ nípasẹ̀ ẹ̀jẹ̀; ‘múlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, láìdín ìtumọ̀ náà kù sí ìfọwọ́sí òfin nìkan.
theological_decisions:
- issue: Ohun tí ‘ἡ πρώτη’ ń tọ́ka sí
  choice: ìjẹ̀jẹ̀ àkọ́kọ́
  alternative: ohun àkọ́kọ́; májẹ̀mú àkọ́kọ́; ètò àgọ́ àkọ́kọ́
  rationale: Àyíká Hébérù 9 àti ìtọ́kasí sí Ẹ́kísódù 24 fi hàn pé ìjẹ̀jẹ̀ àkọ́kọ́ ni a ń sọ; síbẹ̀, àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì sọ ‘àkọ́kọ́’ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. A yan ‘ìjẹ̀jẹ̀’ fún covenant, ‘múlẹ̀’ sì sọ ìdásílẹ̀ àti ìbẹ̀rẹ̀ iṣẹ́ rẹ̀ ní ọ̀nà tí òǹkàwé lásán lè lóye.
