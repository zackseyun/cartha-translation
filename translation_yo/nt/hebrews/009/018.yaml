    rationale: Ọ̀rọ̀ náà kì í ṣe ọ̀rọ̀ ìlò Yorùbá tó bójú mu fún májẹ̀mú, ó sì lè fa ìdàrúdàpọ̀. ‘Májẹ̀mú’ ni ọ̀rọ̀ tó hàn gbangba, tó jẹ́ àṣà, tí ó sì ṣeé lóye.
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ ń fi ‘májẹ̀mú àkọ́kọ́’ hàn bí ìtumọ̀ àfidípò
    rationale: Níwọ̀n bí ẹsẹ̀ ìtumọ̀ ti yan ‘májẹ̀mú àkọ́kọ́’ gẹ́gẹ́ bí ìtúmọ̀ àyíká, àlàyé yẹ kí ó ṣàlàyé pé ‘ohun/ẹ̀yí àkọ́kọ́’ ni ọ̀rọ̀ Gíríìkì sọ ní tààrà, kì í ṣe láti ṣàfihàn májẹ̀mú gẹ́gẹ́ bí yíyan mìíràn.
