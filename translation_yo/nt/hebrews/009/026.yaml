id: HEB.9.26
reference: Hebrews 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: yo
  text: Bí kò bá rí bẹ́ẹ̀, ìbá ti yẹ kí ó jìyà ní ọ̀pọ̀ ìgbà láti ìgbà ìpilẹ̀ ayé. Ṣùgbọ́n ní ti gidi, ó ti farahàn lẹ́ẹ̀kan ṣoṣo ní ìparí àwọn sànmánì[a], láti mú ẹ̀ṣẹ̀ kúrò[b] nípasẹ̀ ẹbọ tí ó fi ara rẹ̀ rú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní òpin àwọn sànmánì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti mú ẹ̀ṣẹ̀ dófo” tàbí “láti fagi lé ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nípasẹ̀ ẹbọ rẹ̀.” Ní ọ̀rọ̀-sí-ọ̀rọ̀, Gíríìkì náà sọ pé, “nípasẹ̀ ẹbọ ara rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Bí kò bá rí bẹ́ẹ̀
  rationale: Nínú àríyànjiyàn yìí, ọ̀rọ̀ náà ń fi ohun tí ìbá ṣẹlẹ̀ hàn bí Kristi bá ń fi ara rẹ̀ rúbọ léraléra; gbólóhùn Yorùbá yìí mú ìtumọ̀ àbájáde àròsọ náà jáde lọ́nà àdánidá.
- source_word: ἔδει
  choice: ìbá ti yẹ kí ó
  rationale: Ìṣẹ̀lẹ̀ ọ̀rọ̀-ìṣe náà tọ́ka sí dandan tí ìbá wà nínú ipò àròsọ ní àkókò tí ó ti kọjá.
- source_word: πολλάκις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ó pa ìyàtọ̀ tó ṣe kedere mọ́ pẹ̀lú ἅπαξ, ‘lẹ́ẹ̀kan ṣoṣo.’
- source_word: παθεῖν
  choice: kí ó jìyà
  rationale: Ó sọ ìjìyà Kristi, tó so mọ́ ikú rẹ̀ gẹ́gẹ́ bí ẹbọ, ní ọ̀nà tó rọrùn tí ó sì ní ọlá.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: láti ìgbà ìpilẹ̀ ayé
  rationale: Ó fi àkókò láti ìgbà tí a ti dá ayé sílẹ̀ títí di àsìkò tí a ń sọ̀rọ̀ rẹ̀ hàn.
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n ní ti gidi
  rationale: Ó tẹnu mọ́ ìyàtọ̀ láàárín ipò àròsọ tó ṣáájú àti ohun tó ṣẹlẹ̀ ní ti tòótọ́.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  rationale: Ní Yorùbá, gbólóhùn yìí fi hàn pé ẹbọ náà ṣẹlẹ̀ ní ẹ̀ẹ̀kan kan ṣoṣo, ní ìyàtọ̀ sí ‘ní ọ̀pọ̀ ìgbà,’ láìfi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: ní ìparí pípé àwọn sànmánì
  rationale: ‘Ìparí pípé’ gbìmọ̀ ìtumọ̀ ìmúṣẹ tàbí ìkójọpọ̀ dé òpin mú, ‘àwọn sànmánì’ sì pa ọ̀pọ̀ αἰώνων mọ́.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: láti mú ẹ̀ṣẹ̀ kúrò
  rationale: Ó sọ ète pípa ẹ̀ṣẹ̀ tì, mímú un kúrò, tàbí fífi agbára rẹ̀ ré kọjá ní èdè Yorùbá tó ṣe kedere, láìyanju gbogbo ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì sí ọ̀nà kan ṣoṣo.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: A pa ọ̀rọ̀ ẹyọ Gíríìkì mọ́, níbi tí ẹ̀ṣẹ̀ ti dúró fún òtítọ́ tàbí agbára ẹ̀ṣẹ̀ lápapọ̀.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: nípasẹ̀ ẹbọ tí ó fi ara rẹ̀ rú
  rationale: Ó mú kedere pé Kristi fúnra rẹ̀ ni ohun tí a fi rúbọ, kì í ṣe pé ó kan mú ẹbọ mìíràn wá.
- source_word: πεφανέρωται
  choice: ó ti farahàn
  rationale: 'Àmì ‘ti’ bá àkókò pípé Gíríìkì mu: ìfarahàn náà ti ṣẹlẹ̀, ipa rẹ̀ sì ń bá a lọ.'
theological_decisions:
- issue: Agbára ἅπαξ nínú ẹbọ Kristi
  choice: lẹ́ẹ̀kan ṣoṣo
  alternative: lẹ́ẹ̀kan
  rationale: Ìyàtọ̀ rẹ̀ sí πολλάκις (‘ní ọ̀pọ̀ ìgbà’) àti ìdí-ẹ̀rí inú Hébérù 9 fi ìpinnu àti àìléraléra ẹbọ náà hàn; ‘lẹ́ẹ̀kan ṣoṣo’ sọ èyí jáde láìfikún ẹ̀kọ́ ẹ̀sìn tí kò sí nínú ẹsẹ náà.
- issue: Ìwọ̀n ìtumọ̀ ἁμαρτίας gẹ́gẹ́ bí ọ̀rọ̀ ẹyọ
  choice: ẹ̀ṣẹ̀
  alternative: àwọn ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ ẹyọ Gíríìkì lè sọ ẹ̀ṣẹ̀ gẹ́gẹ́ bí òtítọ́ tàbí agbára tí a mú kúrò, kì í ṣe àkójọ àwọn ìṣe búburú nìkan; a pa ìfẹ̀sí yìí mọ́.
- issue: Ohun tí αὐτοῦ ń tọ́ka sí nínú διὰ τῆς θυσίας αὐτοῦ
  choice: ẹbọ tí ó fi ara rẹ̀ rú
  alternative: ẹbọ rẹ̀
  rationale: Àyíká ọ̀rọ̀ sọ nípa Kristi tó fi ara rẹ̀ rúbọ. Ìtumọ̀ yìí mú ìtọ́kasí ara ẹni náà hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ọ̀nà kíkà tó ṣókí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘sànmánì’ fún αἰώνων láti pa èrò ọ̀pọ̀ àkókò ńlá mọ́; a sì lo ‘ìparí pípé’ láti má ṣe sọ συντέλεια di òpin àkókò lásán. Àwọn àmì àlàyé [a], [b], àti [c] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
