  verdict: revise
  source_fidelity: Ìtúmọ̀ náà pa ọ̀pọ̀ èrò pàtàkì Gíríìkì mọ́, ṣùgbọ́n gbólóhùn ìbátan ὃς ('ẹni tí') gbọdọ̀ so mọ́ Mèsáyà nínú ẹ̀jẹ̀ náà kí ó má bàa dà bí ẹni pé ó ń tọ́ka sí Ọlọ́run tàbí kókó-ọrọ̀ mìíràn. A tún yẹ kí àmì àlàyé wà lẹ́gbẹ̀ẹ́ 'Ẹ̀mí ayérayé,' ibi tí àìdájú náà wà.
  naturalness: '''Ǹjẹ́ mélòó mélòó ni'' nílò ìkọ̀wé ''mélòómélòó'' gẹ́gẹ́ bí ọ̀rọ̀ ìfiwéra kan. Gbólóhùn àkọ́kọ́ ń ṣàn dáadáa jù lọ bí a bá fi gbolóhùn ìbátan sínú àárín kókó-ọrọ̀ àti ọ̀rọ̀-ìṣe. Yíyọ ''máa'' kúrò nínú ''kí a lè máa sin'' máa pa ète εἰς τὸ λατρεύειν mọ́ láìfi ìṣe àtúnlò kún un.'
  terminology: '''Mèsáyà,'' ''ẹ̀jẹ̀,'' ''ẹ̀rí-ọkàn,'' ''iṣẹ́ òkú,'' àti ''Ọlọ́run alààyè'' bá ọ̀rọ̀ orísun mu. ''Fi ara rẹ̀ rúbọ láìní àbàwọ́n sí Ọlọ́run'' jẹ́ èdè Yorùbá tó ṣàlàyé προσήνεγκεν ἄμωμον dáadáa, láìfi ìtumọ̀ àfikún ''gẹ́gẹ́ bí'' kún un.'
  issues:
  - severity: high
    issue: Gbólóhùn ìbátan náà wà lẹ́yìn ìparí gbólóhùn àkọ́kọ́ gẹ́gẹ́ bí 'Òun ni ẹni tí…'.
    rationale: Nínú Gíríìkì, ὃς ń ṣàlàyé Mèsáyà lẹ́sẹ̀kẹsẹ̀. Ìpò tó wà nínú àwòkọ́ṣe lè dá ìtọ́kasí rẹ̀ rú, ó sì ya ìṣe rírúbọ kúrò lọ́dọ̀ ẹ̀jẹ̀ Mèsáyà nínú ìṣàpẹẹrẹ gbolóhùn.
  - severity: medium
    issue: Àmì àlàyé [a] wà ní ìparí 'Ọlọ́run alààyè' dípò lẹ́yìn 'Ẹ̀mí ayérayé'.
    rationale: Àlàyé náà kan διὰ πνεύματος αἰωνίου nìkan; a gbọdọ̀ so àmì rẹ̀ mọ́ ọ̀rọ̀ náà fún ìtọ́kasí tó pé.
