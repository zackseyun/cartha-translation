revisions:
- from: Ǹjẹ́ mélòó mélòó ni ẹ̀jẹ̀ Mèsáyà yóò túbọ̀ máa wẹ ẹ̀rí-ọkàn wa mọ́ kúrò nínú àwọn iṣẹ́ òkú, kí a lè máa sin Ọlọ́run alààyè[a]! Òun ni ẹni tí ó tipasẹ̀ Ẹ̀mí ayérayé fi ara rẹ̀ rú sí Ọlọ́run gẹ́gẹ́ bí ẹbọ tí kò ní àbàwọ́n.
  to: Ǹjẹ́ mélòómélòó ni ẹ̀jẹ̀ Mèsáyà, ẹni tí ó fi ara rẹ̀ rúbọ láìní àbàwọ́n sí Ọlọ́run nípasẹ̀ Ẹ̀mí ayérayé[a], yóò túbọ̀ wẹ ẹ̀rí-ọkàn wa mọ́ kúrò nínú àwọn iṣẹ́ òkú, kí a lè sin Ọlọ́run alààyè!
  rationale: Àtúnṣe náà tún ìlànà gbolóhùn ṣe kí 'ẹni tí' tọ́ka sí Mèsáyà gẹ́gẹ́ bí ὃς ṣe ń ṣe nínú Gíríìkì. Ó pa ọjọ́ iwájú καθαριεῖ, èdè ìrúbọ προσήνεγκεν ἄμωμον, ìfiwéra πόσῳ μᾶλλον, àti ète εἰς τὸ λατρεύειν mọ́. Àmì àlàyé náà ti lọ sí ibi tó tọ́, láti ṣètìlẹ́yìn fún àìdájú tó wà nínú 'Ẹ̀mí ayérayé.'
  reviewer_model: gpt-5.6-terra
