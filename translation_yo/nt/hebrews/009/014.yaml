id: HEB.9.14
reference: Hebrews 9:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: yo
  text: Ǹjẹ́ mélòómélòó ni ẹ̀jẹ̀ Mèsáyà, ẹni tí ó fi ara rẹ̀ rúbọ láìní àbàwọ́n sí Ọlọ́run nípasẹ̀ Ẹ̀mí ayérayé[a], yóò túbọ̀ wẹ ẹ̀rí-ọkàn wa mọ́ kúrò nínú àwọn iṣẹ́ òkú, kí a lè sin Ọlọ́run alààyè!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ẹ̀mí ayérayé kan.” Gbólóhùn Gíríìkì náà lè ní ìtumọ̀ gbogbogbòò yìí, bí ó tilẹ̀ jẹ́ pé níhìn-ín a mú un gẹ́gẹ́ bí ìtọ́kasí sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: Ǹjẹ́ mélòó mélòó ni ... yóò túbọ̀
  rationale: Ó pa agbára ìfiwéra a fortiori Gíríìkì mọ́ ní ọ̀nà tí ó bá ìbéèrè àsọyé Yorùbá mu.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: ẹ̀jẹ̀ Mèsáyà
  rationale: A pa àwòrán ẹ̀jẹ̀ ìrúbọ mọ́; Mèsáyà sì fi iṣẹ́ Χριστός gẹ́gẹ́ bí orúkọ oyè hàn.
- source_word: διὰ πνεύματος αἰωνίου
  choice: tipasẹ̀ Ẹ̀mí ayérayé
  rationale: “Tipasẹ̀” pa ipa ìṣèlàárín διά mọ́; lẹ́tà ńlá fi ìtumọ̀ pé Ẹ̀mí Mímọ́ ni hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdájú gírámà mọ́.
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: fi ara rẹ̀ rú sí Ọlọ́run gẹ́gẹ́ bí ẹbọ tí kò ní àbàwọ́n
  rationale: “Rú ... gẹ́gẹ́ bí ẹbọ” mú èdè ìrúbọ προσφέρω àti ἄμωμος ṣe kedere ní Yorùbá láìsọ ìtumọ̀ rẹ̀ di ẹ̀kọ́ àfikún.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: yóò ... wẹ ẹ̀rí-ọkàn wa mọ́
  rationale: “Yóò” pa àkókò ọjọ́ iwájú mọ́; “wẹ ... mọ́” jẹ́ èdè àdánidá fún ìwẹ̀mọ́, ẹ̀rí-ọkàn sì jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún συνείδησις.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: kúrò nínú àwọn iṣẹ́ òkú
  rationale: Ó pa ìṣọ̀kan ọ̀rọ̀ ẹ̀kọ́ “iṣẹ́ òkú” mọ́, láìtú u sí “iṣẹ́ tí ń yọrí sí ikú.”
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: kí a lè máa sin Ọlọ́run alààyè
  rationale: “Kí a lè” fi ète hàn; “sin” lè gba ìjọsìn àti iṣẹ́ mímọ́ méjèèjì wọlé.
theological_decisions:
- issue: Ẹni tàbí ohun tí πνεύματος αἰωνίου ń tọ́ka sí
  choice: Ẹ̀mí ayérayé, tí lẹ́tà ńlá fi hàn gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ayérayé kan, tàbí ẹ̀mí ayérayé ti Mèsáyà fúnra rẹ̀
  rationale: Ẹ̀mí Ọlọ́run ni ó ṣeé ṣe jù lọ ní àyíká ọ̀rọ̀, ṣùgbọ́n àìní article nínú Gíríìkì jẹ́ kí ìtumọ̀ gbogbogbòò tún ṣeé ṣe; a pa ìyẹn mọ́ nínú àlàyé.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè ẹni àmì òróró; “Mèsáyà” mú iṣẹ́ orúkọ oyè náà hàn.
- issue: Ìtumọ̀ νεκρῶν ἔργων
  choice: àwọn iṣẹ́ òkú
  alternative: àwọn iṣẹ́ tí ń yọrí sí ikú
  rationale: Ìtumọ̀ gígùn lè pinnu ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní kíkún; ìtumọ̀ tààrà pa ìwúwo ẹ̀kọ́ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Hébérù 6:1 mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti àsìkò yìí ni a lò. A tún ètò gbólóhùn ṣe díẹ̀ kí ó lè ṣàn dáadáa ní Yorùbá, ṣùgbọ́n a pa ìbéèrè àsọyé, ọjọ́ iwájú, èdè ìrúbọ, àti ìdí iṣẹ́ Ọlọ́run mọ́.
