revisions:
- from: Lókè rẹ̀ sì ni àwọn kérúbù ògo wà, tí wọ́n ṣíji bo ìbòrí ètùtù[a]. Nípa àwọn nǹkan wọ̀nyí, kò ṣeé ṣe nísinsìnyí láti sọ̀rọ̀ ní ẹ̀kúnrẹ́rẹ́.
  to: Lókè rẹ̀ sì ni àwọn kérúbù ògo, tí wọ́n ń fi òjìji bo ìderí ètùtù náà[a]. Nípa àwọn nǹkan wọ̀nyí, kò ṣeé ṣe nísinsìnyí láti sọ̀rọ̀ ní ẹ̀kúnrẹ́rẹ́.
  rationale: Àtúnṣe náà mú ìṣe κατασκιάζοντα hàn ní Yorùbá tó dára (“ń fi òjìji bo”), ó sì sọ ohun tí ἱλαστήριον ń tọ́ka sí ní àyíká ibi mímọ́ náà di kedere gẹ́gẹ́ bí ìderí àpótí májẹ̀mú. Àkọsílẹ̀ náà pa yíyàn “ìtẹ́ àánú” mọ́, ṣùgbọ́n kò pe ìderí náà ní ẹbọ ní ẹsẹ̀ yìí.
