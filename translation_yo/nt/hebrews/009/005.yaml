id: HEB.9.5
reference: Hebrews 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: yo
  text: Lókè rẹ̀ sì ni àwọn kérúbù ògo, tí wọ́n ń fi òjìji bo ìderí ètùtù náà[a]. Nípa àwọn nǹkan wọ̀nyí, kò ṣeé ṣe nísinsìnyí láti sọ̀rọ̀ ní ẹ̀kúnrẹ́rẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtẹ́ àánú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìderí àpótí májẹ̀mú, ibi tí a ti ń ṣe ètùtù.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Lókè rẹ̀ sì ni
  rationale: Ó fi ipò àwọn kérúbù hàn lókè àpótí májẹ̀mú tí a mẹ́nu kàn ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: Χερουβὶν δόξης
  choice: àwọn kérúbù ògo
  rationale: “Kérúbù” pa orúkọ àwọn ẹ̀dá ọ̀run náà mọ́, “ògo” sì pa ìsopọ̀ genitive Gíríìkì mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: κατασκιάζοντα
  choice: tí wọ́n ṣíji bo
  rationale: Ó ṣàpèjúwe bí àwọn kérúbù ṣe wà lókè ìderí náà, tí wọ́n sì bo ó; gbólóhùn yìí ṣe kedere, ó sì bá èdè Yorùbá mu.
- source_word: τὸ ἱλαστήριον
  choice: ìbòrí ètùtù
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka ní pàtó sí ìderí àpótí májẹ̀mú, ibi tí ètùtù ti ní í ṣe. “Ìbòrí ètùtù” pa ohun èlò gidi àti iṣẹ́ ìsìn rẹ̀ pọ̀, láì sọ ọ́ di ẹbọ fúnra rẹ̀.
- source_word: περὶ ὧν
  choice: Nípa àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ohun èlò inú ibùjọ tí a ṣẹ̀ṣẹ̀ dárúkọ, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: kò ṣeé ṣe nísinsìnyí láti sọ̀rọ̀ ní ẹ̀kúnrẹ́rẹ́
  rationale: Ó mú ìtumọ̀ pé kì í ṣe àkókò tàbí àyè fún àlàyé kíkún báyìí, tí κατὰ μέρος sì túmọ̀ sí sísọ ohun kọ̀ọ̀kan ní kíkún.
theological_decisions:
- issue: Ìtumọ̀ ἱλαστήριον nínú àyíká ohun èlò ibi mímọ́
  choice: ìbòrí ètùtù
  alternative: ìtẹ́ àánú; ẹbọ ètùtù
  rationale: Nínú Hébérù 9:5, ohun tí ọ̀rọ̀ náà tọ́ka sí ní ti ara ni ìderí àpótí májẹ̀mú, kì í ṣe ẹbọ kan. Síbẹ̀, ìbáṣepọ̀ rẹ̀ pẹ̀lú ètùtù ṣe pàtàkì; “ìbòrí ètùtù” pa àwọn méjèèjì mọ́, àkọsílẹ̀ ìsàlẹ̀ sì fi àwọn ìtumọ̀ míì hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa “kérúbù ògo” mọ́ gẹ́gẹ́ bí gbólóhùn ṣókí tí kò yanjú gbogbo ìbáṣepọ̀ “ògo” pẹ̀lú àwọn kérúbù náà.
