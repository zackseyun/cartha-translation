    issue: “tí wọ́n ṣíji bo”
    rationale: Ọ̀rọ̀ náà kò ṣe kedere tàbí jẹ́ ìlò Yorùbá boṣewa fún κατασκιάζοντα. Ó yẹ kí ìtumọ̀ ìbo-ní-òjìji hàn ní kedere.
  - severity: low
    issue: “ìbòrí ètùtù”
    rationale: “Ìbòrí” lè tọ́ka sí aṣọ tàbí ohun tí a fi bo nǹkan ní gbogbogbòò; ἱλαστήριον ní ibi yìí ni ìderí àpótí májẹ̀mú. “Ìderí ètùtù” jẹ́ ìpèníjà tó péye jù.
  - severity: medium
    issue: Àkọsílẹ̀ ìsàlẹ̀ gbé “ẹbọ ètùtù” kalẹ̀ bí ìtumọ̀ yíyàn ní ibi yìí
    rationale: Bí ó tilẹ̀ jẹ́ pé ἱλαστήριον ní ìbáṣepọ̀ ọ̀rọ̀ pẹ̀lú ètùtù, nínú Hébérù 9:5 ó ń tọ́ka sí ìderí àpótí náà. Àkọsílẹ̀ yẹ kí ó má ṣe fi “ẹbọ” hàn bí ohun tí ọ̀rọ̀ náà ń pè ní ẹsẹ̀ yìí.
