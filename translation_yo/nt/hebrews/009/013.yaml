  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: yo
  text: Nítorí, bí ẹ̀jẹ̀ àwọn ewúrẹ́ àti àwọn akọ màlúù, àti eérú màlúù abo tí a fi ń wọ́n àwọn tí wọ́n ti di aláìmọ́[a], bá ń sọ wọ́n di mímọ́ fún ìwẹ̀nùmọ́ ti ara[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àwọn tí wọ́n ti di aláìmọ́ nípa ìlànà ìjọsìn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, ìwẹ̀nùmọ́ ti òde tàbí ti ara lábẹ́ àwọn ètò májẹ̀mú àtijọ́.
    reason: cultural_note
  - marker: c
    text: Èyí ń tọ́ka sí ètò ìwẹ̀nùmọ́ tí wọ́n ti ń lo eérú màlúù abo nínú Numeri 19.
    reason: cross_reference
lexical_decisions:
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ó tọ́ka ní tààrà sí ẹ̀jẹ̀ ẹran nínú ọ̀rọ̀ ẹbọ.
- source_word: τράγων καὶ ταύρων
  choice: àwọn ewúrẹ́ àti akọ màlúù
  rationale: Ọ̀rọ̀ méjèèjì wà ní ìbáṣepọ̀ pẹ̀lú ‘ẹ̀jẹ̀’; ‘akọ màlúù’ mú ìtumọ̀ ταῦρος hàn kedere, nígbà tí ‘ewúrẹ́’ jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá nínú àyíká ẹbọ.
- source_word: σποδὸς δαμάλεως
  choice: eérú abo màlúù
  rationale: Ó pa ìtọ́kasí sí ètò ìwẹ̀nùmọ́ ti Numeri 19 mọ́, ó sì fi hàn pé ẹran abo ni.
- source_word: ῥαντίζουσα
  choice: tí a fi ń wọ́n
  rationale: Gíríìkì so participle náà mọ́ ‘eérú,’ ṣùgbọ́n ní àṣà náà a fi omi tí eérú wà nínú rẹ̀ wọ́n ènìyàn. Ìtumọ̀ yìí jẹ́ ti àdánidá, ó sì yẹra fún fífi eérú hàn bí ẹni pé òun fúnra rẹ̀ ni olùṣe.
- source_word: τοὺς κεκοινωμένους
  choice: àwọn tí wọ́n ti di aláìmọ́
  rationale: Nínú àyíká yìí κοινόω túmọ̀ sí jíjẹ́ aláìmọ́ nípa ìlànà ìjọsìn; ‘ti di’ tún fi ipò tí perfect participle ń tọ́ka sí hàn.
- source_word: ἁγιάζει
  choice: ń sọ wọ́n di mímọ́
  rationale: Ó pa èdè ìjọsìn àti ìyàsímímọ́ mọ́ láì sọ ọ́ di ìyípadà ìwà inú.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: fún ìwẹ̀nùmọ́ ti ara
  rationale: ‘Ara’ jẹ́ ìtumọ̀ àdánidá fún σάρξ níbí, níbi tí ó ti ń tọ́ka sí ìmọ́tótó ti òde tàbí ti ara lábẹ́ àwọn ètò ìjọsìn.
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: Ó pa ìsopọ̀ àríyànjiyàn àti gbólóhùn oníṣ条件 tí yóò pé ní ẹsẹ tó tẹ̀ lé e mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘sọ di mímọ́’ nínú àwọn ètò májẹ̀mú àtijọ́
  choice: Ìyàsímímọ́ nípa ìlànà ìjọsìn, kì í ṣe ìyípadà ìwà inú
  alternative: Mímú ènìyàn di mímọ́ ní ẹ̀mí ní ìtumọ̀ gbòòrò
  rationale: Gbólóhùn náà fi àǹfààní àwọn ètò wọ̀nyí mọ sí ‘ìwẹ̀nùmọ́ ti ara,’ ní ìyàtọ̀ sí ìwẹ̀nùmọ́ ẹ̀rí-ọkàn ní ẹsẹ 14.
- issue: Ìtumọ̀ σάρξ ní ẹsẹ yìí
  choice: Ara, ìyẹn ìmọ́tótó ti òde lábẹ́ ìlànà ìjọsìn
  alternative: Ìwà ẹlẹ́ṣẹ̀ tàbí ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Àyíká náà jẹ́ ti àwọn ètò ìwẹ̀nùmọ́ ti Lefi, nítorí náà σάρξ kì í ṣe ‘ẹ̀dá ẹlẹ́ṣẹ̀’ níbí.
- issue: Ohun tí ῥαντίζουσα ń ṣàlàyé àti ẹni tó ń ṣe iṣẹ́ wọ́n
  choice: Ó ń ṣàlàyé eérú abo màlúù gẹ́gẹ́ bí ohun tí a lò fún fífi wọ́n àwọn aláìmọ́
  alternative: Eérú fúnra rẹ̀ ń wọ́n àwọn aláìmọ́
  rationale: Fọ́ọ̀mù abo ẹyọ kan ῥαντίζουσα bá σποδός mu ní gírámà, ṣùgbọ́n gbólóhùn Yorùbá ‘tí a fi ń wọ́n’ pa ìbáṣepọ̀ náà mọ́, ó sì sọ iṣẹ́ ìlànà náà ní ọ̀nà tí ó ṣe kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìwẹ̀nùmọ́ ti ara’ láti pa ìyàtọ̀ ẹ̀kọ́-ọ̀rọ̀ pẹ̀lú ẹsẹ 14 mọ́. Àmì kọ́ńmà ní òpin fi hàn pé gbólóhùn oníṣ条件 náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
