  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: yo
  text: Ṣùgbọ́n àlùfáà àgbà nìkan ni ó máa ń wọ inú yàrá kejì[a] lẹ́ẹ̀kan lọ́dún, kì í sì í wọ̀ láìsí ẹ̀jẹ̀; ẹ̀jẹ̀ náà ni ó ń rú gẹ́gẹ́ bí ẹbọ fún ara rẹ̀ àti fún àwọn ẹ̀ṣẹ̀ tí àwọn ènìyàn dá nítorí àìmọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “abala kejì” tàbí “àgọ́ kejì”; èyí ń tọ́ka sí apá inú ti Àgọ́ Ìjọsìn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹ̀ṣẹ̀ àìmọ̀ọ́mọ̀ àwọn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Ṣùgbọ́n ... inú yàrá kejì
  rationale: Ọ̀rọ̀ Gíríìkì náà dá dúró lórí ‘èyí kejì’ láì tún orúkọ ohun náà sọ; ‘yàrá’ mú ìtumọ̀ abala inú àgọ́ náà hàn ní Yorùbá àdánidá, ó sì pa ìyàtọ̀ rẹ̀ sí yàrá àkọ́kọ́ mọ́.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: lẹ́ẹ̀kan lọ́dún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ìwọlé náà máa ń ṣẹlẹ̀ ní ẹ̀ẹ̀kan ṣoṣo nínú ọdún.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: àlùfáà àgbà nìkan
  rationale: ‘Nìkan’ fi hàn kedere pé àlùfáà àgbà nikan ṣoṣo ni a yọ̀ǹda fún láti wọlé.
- source_word: οὐ χωρὶς αἵματος
  choice: kì í sì í wọ̀ láìsí ẹ̀jẹ̀
  rationale: Èyí pa ọ̀nà àtakò tí Gíríìkì lò mọ́, ó sì fi ‘ẹ̀jẹ̀’ sílẹ̀ ní kedere nítorí pàtàkì rẹ̀ nínú ẹbọ.
- source_word: ὃ προσφέρει
  choice: èyí tí ó fi ń rú ẹbọ
  rationale: Ọ̀rọ̀ yìí sọ iṣẹ́ fífi ẹ̀jẹ̀ náà rú ẹbọ ní èdè Yorùbá tí ó bójú mu àyíká ìjọsìn.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: fún ara rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìṣe ẹbọ ní ipò ara ẹni.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: àwọn ẹ̀ṣẹ̀ tí àwọn ènìyàn dá nítorí àìmọ̀
  rationale: Ìtumọ̀ yìí pa agbára ìwà-ẹ̀ṣẹ̀ ọ̀rọ̀ náà mọ́, ó sì fi hàn pé àìmọ̀ tàbí àìmọ̀ọ́mọ̀ ni ó ṣàpèjúwe àwọn ẹ̀ṣẹ̀ náà.
theological_decisions:
- issue: Irú àwọn ìrékọjá tí ἀγνοήματα ń tọ́ka sí nínú àyíká ẹbọ
  choice: àwọn ẹ̀ṣẹ̀ tí àwọn ènìyàn dá nítorí àìmọ̀
  alternative: àwọn ẹ̀ṣẹ̀ àìmọ̀ọ́mọ̀ àwọn ènìyàn
  rationale: Àṣàyàn yìí kò sọ ọ̀rọ̀ náà di àìní ìmọ̀ lásán; ó pa ìtumọ̀ ẹ̀ṣẹ̀ àti àìmọ̀ mọ́ pọ̀ láì fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ó máa ń wọ’ àti ‘kì í sì í wọ̀’ mú ìṣe ọdọọdún náà dun bí Yorùbá àdánidá, nígbà tí àwọn ọ̀rọ̀ ẹbọ àti ẹ̀jẹ̀ dúró ní kedere.
