id: HEB.9.15
reference: Hebrews 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: yo
  text: 'Nítorí ìdí èyí, òun ni alárinà májẹ̀mú tuntun[a], kí, níwọ̀n bí ikú kan ti ṣẹlẹ̀ fún ìràpadà kúrò nínú àwọn ìrékọjá tí a ṣe lábẹ́ májẹ̀mú àkọ́kọ́, àwọn tí a ti pè lè gba ìlérí ogún ayérayé.


    [a] Tàbí “ìwé ogún” dípò “májẹ̀mú.” Ọ̀rọ̀ Gíríìkì διαθήκη lè ní ìtumọ̀ méjèèjì; ní Hébérù 9:16–17, a tún rí bí ọ̀rọ̀ náà ṣe ń ṣiṣẹ́ pẹ̀lú àwọ̀ ìtumọ̀ méjèèjì náà. Síbẹ̀, “májẹ̀mú” bá ìyàtọ̀ láàárín májẹ̀mú tuntun àti májẹ̀mú àkọ́kọ́ nínú ẹsẹ yìí mu jù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwé ogún” dípò “májẹ̀mú.” Ọ̀rọ̀ Gíríìkì διαθήκη lè ní ìtumọ̀ méjèèjì; ní Hébérù 9:16–17, a tún rí bí ọ̀rọ̀ náà ṣe ń ṣiṣẹ́ pẹ̀lú àwọ̀ ìtumọ̀ méjèèjì náà. Síbẹ̀, “májẹ̀mú” bá ìyàtọ̀ láàárín májẹ̀mú tuntun àti májẹ̀mú àkọ́kọ́ nínú ẹsẹ yìí mu jù.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú gẹ́gẹ́ bí ìdí, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘for this reason’ ní Yorùbá.
- source_word: διαθήκης καινῆς
  choice: májẹ̀mú tuntun
  rationale: Ìtumọ̀ májẹ̀mú ló bá àyíká ọ̀rọ̀ àti ìfiwéra pẹ̀lú májẹ̀mú àkọ́kọ́ mu jù; àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ ìtumọ̀ ‘ìwé ogún.’
- source_word: μεσίτης
  choice: alárinà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tó dúró láàárín àwọn méjì láti mú ìbáṣepọ̀ tàbí àdéhùn wọn ṣẹ, ó sì bá àríyànjiyàn nípa májẹ̀mú mu.
- source_word: ὅπως
  choice: kí ... lè
  rationale: Ìkọ̀lé Yorùbá yìí fi ète tàbí àbájáde tí a fẹ́ hàn lọ́nà àdánidá.
- source_word: θανάτου γενομένου
  choice: níwọ̀n bí ikú ti ṣẹlẹ̀
  rationale: Ó fi ikú tí ó ti ṣẹlẹ̀ hàn gẹ́gẹ́ bí ìpìlẹ̀ fún ohun tó tẹ̀ lé, láì fi ẹni tí ikú náà jẹ́ kún ọ̀rọ̀ Gíríìkì ní kedere.
- source_word: ἀπολύτρωσιν
  choice: ìràpadà kúrò nínú
  rationale: ‘Ìràpadà’ mú èrò ìdáǹdè tí a fi iye kan mú wá; ‘kúrò nínú’ dènà òye pé àwọn ìrékọjá fúnra wọn ni a rà padà.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: àwọn ìrékọjá tí a ṣe lábẹ́ májẹ̀mú àkọ́kọ́
  rationale: ‘Lábẹ́’ fi àkókò àti àgbègbè ìṣàkóso májẹ̀mú àkọ́kọ́ hàn; ‘tí a ṣe’ jẹ́ kí ìbáṣepọ̀ náà ṣe kedere ní Yorùbá.
- source_word: τὴν ἐπαγγελίαν
  choice: ìlérí
  rationale: Ó pa ọ̀rọ̀-orúkọ ẹyọ kan inú Gíríìkì mọ́, ó sì tọ́ka sí ìlérí tó ní ogún ayérayé gẹ́gẹ́ bí ohun inú rẹ̀.
- source_word: λάβωσιν
  choice: lè gba
  rationale: Ó bá ọ̀rọ̀ abẹ́ ὅπως mu, ó sì fi àbájáde tí a pinnu hàn.
- source_word: οἱ κεκλημένοι
  choice: àwọn tí a ti pè
  rationale: Ó pa ipò àwọn ẹni tí ìpè ti dé bá mọ́, láì dá ẹni tó pè wọn lórúkọ níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: ogún ayérayé
  rationale: ‘Ogún’ jẹ́ ọ̀rọ̀ àdánidá fún κληρονομία, ‘ayérayé’ sì pa ìyàtọ̀ láàárín ohun tó wà fún ìgbà díẹ̀ àti ohun tó dúró títí láé mọ́.
theological_decisions:
- issue: Ẹni tí a kò dárúkọ tí ἐστίν ń tọ́ka sí
  choice: A lo ‘òun ni,’ tó ń tọ́ka sí Kristi nínú àyíká ọ̀rọ̀ tó ṣáájú.
  alternative: Láti fi ẹni náà sílẹ̀ láì sọ ọ́ kedere.
  rationale: Yorùbá nílò àfihàn ẹni náà kí gbólóhùn lè yé; ‘òun’ tọ́ka sí ẹni tó wà ní àyíká ọ̀rọ̀ láì fi orúkọ tàbí ẹ̀kọ́ míì kún un.
- issue: Ìtumọ̀ διαθήκη nínú ẹsẹ yìí
  choice: A lo ‘májẹ̀mú’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Ìwé ogún.’
  rationale: Ìtakora láàárín májẹ̀mú tuntun àti májẹ̀mú àkọ́kọ́ ló ṣàkóso ẹsẹ yìí. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́ nítorí Hébérù 9:16–17 ń lo àwọ̀ méjèèjì ọ̀rọ̀ náà.
- issue: Ẹni tí ikú θανάτου γενομένου jẹ́
  choice: A sọ ‘ikú ti ṣẹlẹ̀’ láì fi ‘ikú Kristi’ sínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Níwọ̀n bí Kristi ti kú.’
  rationale: Àyíká ọ̀rọ̀ fi Kristi hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ‘ikú’ láì dárúkọ ẹni náà. Ìtumọ̀ yìí pa ìfarapamọ́ gírámà náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì yan ‘alárinà,’ ‘májẹ̀mú,’ ‘ìràpadà,’ àti ‘ogún ayérayé’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ tó péye, tó sì wọ́pọ̀ nínú àyíká Bíbélì.
