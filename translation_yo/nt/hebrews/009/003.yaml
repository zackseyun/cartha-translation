  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: yo
  text: Lẹ́yìn aṣọ ìkélé kejì sì ni àgọ́ kan wà, tí a ń pè ní Ibi Mímọ́ Jùlọ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìbílẹ̀, “Mímọ́ àwọn Mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: Lẹ́yìn aṣọ ìkélé kejì
  rationale: Ní àpèjúwe ibi mímọ́ yìí, μετά pẹ̀lú ọ̀rọ̀ ní accusative ń tọ́ka sí ipò ní ìkọjá tàbí lẹ́yìn ohun kan, kì í ṣe àsìkò. “Aṣọ ìkélé” jẹ́ ọ̀nà àdánidá láti sọ καταπέτασμα, aṣọ tó pín àwọn apá ibi mímọ́ náà.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ asopọ̀ pẹ̀lẹ́ tó ń tẹ̀síwájú nínú àpèjúwe; “sì” bá ìṣàn Yorùbá mu láìfi ìtakora líle kún un.
- source_word: σκηνὴ
  choice: àgọ́ kan
  rationale: σκηνή túmọ̀ sí àgọ́ ìjọsìn nínú ọ̀rọ̀ yìí, bí ó tilẹ̀ jẹ́ pé apá inú rẹ̀ ni ẹsẹ yìí ń tọ́ka sí. “Àgọ́” pa àwòrán ohun èlò ìjọsìn náà mọ́ ju “yàrá” lọ.
- source_word: ἡ λεγομένη
  choice: tí a ń pè ní
  rationale: Gbólóhùn participle náà ń sọ orúkọ tí a fi ń pe àgọ́ náà; “tí a ń pè ní” jẹ́ Yorùbá àdánidá.
- source_word: Ἅγια Ἁγίων
  choice: Ibi Mímọ́ Jù Lọ
  rationale: Ìsọ̀rí genitive yìí jẹ́ ọ̀nà Semitic láti fi hàn pé ibi náà ni ó ga jù lọ ní mímọ́. “Ibi Mímọ́ Jù Lọ” sọ ìtumọ̀ náà kedere ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ibi ìjọsìn Ἅγια Ἁγίων
  choice: Ibi Mímọ́ Jù Lọ
  alternative: Mímọ́ àwọn Mímọ́
  rationale: Ìtumọ̀ àkọ́kọ́ rọrùn fún òǹkàwé Yorùbá òde òní, ó sì tọ́ka kedere sí apá inú jù lọ ti àgọ́ ìjọsìn. Àṣàyàn kejì pa irú ọ̀rọ̀ orísun “Holy of Holies” mọ́, nítorí náà a fi í sínú àlàyé ìsàlẹ̀ láìfi ẹ̀kọ́ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “àgọ́” láti pa àwòrán àgọ́ ìjọsìn mọ́, a sì lo “aṣọ ìkélé” fún aṣọ inú tó ń pín àwọn ibi mímọ́.
