id: HEB.9.4
reference: Hebrews 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: yo
  text: tí ó ní àwo tùràrí wúrà[a], àti àpótí májẹ̀mú tí a fi wúrà bo ní gbogbo ẹ̀gbẹ́; nínú rẹ̀ ni ìkòkò wúrà tí ó ní mánà, ọ̀pá Áárónì tí ó rú ewé, àti àwọn wàláà májẹ̀mú wà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹpẹ tùràrí wúrà.” Ọ̀rọ̀ Gíríìkì θυμιατήριον lè tọ́ka sí ohun èlò tí a fi ń sun tùràrí tàbí pẹpẹ tùràrí; ìtọ́kasí rẹ̀ níbí jẹ́ ohun tí a ń jiyàn lé lórí.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: níbi tí ààrò tùràrí wúrà wà
  rationale: θυμιατήριον lè túmọ̀ sí ààrò tí a ti ń sun tùràrí tàbí ohun èlò tí a fi ń sun ún. Ààrò tùràrí ni a fi sínú ọ̀rọ̀ pàtàkì, nígbà tí a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: κιβωτὸν τῆς διαθήκης
  choice: àpótí májẹ̀mú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ó sì ṣe àfihàn àpótí mímọ́ ti májẹ̀mú.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: tí a fi wúrà bo ní gbogbo ẹ̀gbẹ́
  rationale: Ó pa ìtumọ̀ pé wúrà bo àpótí náà yíká mọ́ ní èdè Yorùbá adayeba.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: ìkòkò wúrà tí ó ní manna
  rationale: στάμνος jẹ́ ìkòkò tàbí ohun ìpamọ́; gbolohun yìí sì tú ἔχουσα ní kedere láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: ọ̀pá Áárónì tí ó rú ewé
  rationale: Ọ̀pá jẹ́ ìtumọ̀ adayeba fún ῥάβδος; 'rú ewé' sì sọ ìṣẹ̀lẹ̀ βλαστήσασα ní Yorùbá tí ó ṣe kedere.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: àwọn wàláà májẹ̀mú
  rationale: Wàláà tú πλάκες, májẹ̀mú sì tú διαθήκη; a kò fi 'òkúta' kún un nítorí kò fara hàn gbangba nínú ẹsẹ yìí.
theological_decisions:
- issue: Ìtumọ̀ θυμιατήριον nínú àpèjúwe ibi mímọ́ jù lọ
  choice: ààrò tùràrí
  alternative: ohun ìsun tùràrí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ààrò tùràrí tàbí ohun èlò tí a fi ń sun tùràrí. Ààrò tùràrí bá àpèjúwe ohun èlò inú àgọ́ náà mu, ṣùgbọ́n a pa àṣàyàn kejì mọ́ nínú àlàyé ìsàlẹ̀ kí a má bàa mú àríyànjiyàn gidi náà kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. Ẹsẹ náà bẹ̀rẹ̀ gẹ́gẹ́ bí àfikún sí gbolohun ẹsẹ tó ṣáájú, nítorí náà a pa ìṣàn sintasi náà mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
