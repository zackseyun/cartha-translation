  source_fidelity: Àtúnyẹ̀wò kan jẹ́ dandan. Níbi yìí, θυμιατήριον jẹ́ ọ̀rọ̀ tí a ń jiyàn ìtọ́kasí rẹ̀; ìtumọ̀ “àwo tùràrí” ń fi ìtumọ̀ “censer” hàn ní tààrà, nígbà tí àlàyé ìsàlẹ̀ ń pa “pẹpẹ tùràrí” (altar of incense) mọ́. Àkọ́kọ́ “níbi tí” sì túmọ̀ sí ‘where,’ kì í ṣe participle ἔχουσα, tí ó ń ṣàpèjúwe ibi mímọ́ náà gẹ́gẹ́ bí ohun tí ó ní àwọn ohun èlò wọ̀nyí.
  naturalness: “Tí ó ní” ń pa ìṣàn gbolohun ẹsẹ tí ó ṣáájú mọ́, ó sì jẹ́ Yorùbá adayeba. “Nínú rẹ̀ ni ... wà” ṣàlàyé dáadáa pé àwọn ohun mẹ́tẹ̀ẹ̀ta náà wà nínú àpótí náà.
  terminology: “Àwo tùràrí” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ohun èlò ìsun tùràrí; “pẹpẹ tùràrí” ni a fi sí àlàyé gẹ́gẹ́ bí ìtumọ̀ míràn. “Àpótí májẹ̀mú,” “mánà,” “ọ̀pá Áárónì,” àti “wàláà májẹ̀mú” jẹ́ ọ̀rọ̀ tó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì mu.
