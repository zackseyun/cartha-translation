id: HEB.9.11
reference: Hebrews 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: yo
  text: Ṣùgbọ́n Mèsáyà dé gẹ́gẹ́ bí olórí àlùfáà àwọn ohun rere tí ó ti dé[a]; nípasẹ̀ àgọ́ kan tí ó tóbi jù, tí ó sì pé jù, tí a kò fi ọwọ́ ṣe—ìyẹn ni pé, tí kì í ṣe ti ìṣẹ̀dá yìí[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “àwọn ohun rere tí ń bọ̀.”
    reason: textual_variant
  - marker: b
    text: 'Tàbí: “Ṣùgbọ́n nígbà tí Mèsáyà farahàn gẹ́gẹ́ bí olórí àlùfáà àwọn ohun rere tí ó ti dé, nípasẹ̀ àgọ́ kan tí ó tóbi jù, tí ó sì pé jù, tí a kò fi ọwọ́ ṣe—ìyẹn ni pé, tí kì í ṣe ti ìṣẹ̀dá yìí—”'
    reason: previous_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A lo gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe bí orúkọ lásán; ó sì bá ìtumọ̀ Χριστός ní àyíká yìí mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi iṣẹ́ Mèsáyà ṣe ìyàtọ̀ sí àgọ́ ayé àti iṣẹ́ àwọn àlùfáà tí a ṣàlàyé ṣáájú.
- source_word: παραγενόμενος
  choice: nígbà tí ... dé
  rationale: Ó ṣàfihàn dídé Mèsáyà sínú ipò àti iṣẹ́ olórí àlùfáà láìfi ìtumọ̀ àfikún sí i.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ipò àlùfáà gíga jù lọ nínú ètò ìjọsìn.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: àwọn ohun rere tí ó ti dé
  rationale: Ó tẹ̀lé γενομένων inú SBLGNT, tí ó túmọ̀ sí ohun rere tí ó ti dé tàbí tí ó ti wáyé, kì í ṣe ohun tí ó ṣì ń bọ̀.
- source_word: διὰ τῆς ... σκηνῆς
  choice: ó gba àgọ́ ... kọjá
  rationale: Nínú àyíká ẹsẹ̀ 12, διὰ tọ́ka sí lílọ kọjá nínú àgọ́; ‘àgọ́’ sì pa àwòrán àgọ́ ìjọsìn mọ́ ní Yorùbá àdánidá.
- source_word: μείζονος
  choice: tí ó tóbi jù
  rationale: Ó sọ ìtayọ àgọ́ náà; nínú àyíká yìí, ìtumọ̀ náà kọjá ìwọ̀n ara nìkan.
- source_word: τελειοτέρας
  choice: tí ó sì pé ju ti ìṣáájú lọ
  rationale: Ó pa èrò ìpé àti ìkúnrẹ́rẹ́ mọ́, ó sì mú ìfiwéra Gíríìkì hàn ní Yorùbá tó ṣe kedere.
- source_word: οὐ χειροποιήτου
  choice: èyí tí ọwọ́ ènìyàn kò ṣe
  rationale: Ó pa ọ̀nà ọ̀rọ̀ Bíbélì tí ń fi ohun tí ènìyàn ṣe yà sí ohun tí kì í ṣe iṣẹ́ ọwọ́ ènìyàn mọ́.
- source_word: τοῦτ’ ἔστιν
  choice: ìyẹn ni pé
  rationale: Ó mú àlàyé tí ó tẹ̀ lé e wọlé lọ́nà Yorùbá àdánidá.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: kì í ṣe ara ìṣẹ̀dá yìí
  rationale: Ó sọ pé àgọ́ náà kò jẹ́ apá kan nínú ètò ohun tí a dá yìí, láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ tó ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Ìyàtọ̀ àfọwọ́kọ àti ìtumọ̀ τῶν γενομένων ἀγαθῶν
  choice: àwọn ohun rere tí ó ti dé
  alternative: àwọn ohun rere tí ń bọ̀
  rationale: Ọ̀rọ̀ àkọ́kọ́ tẹ̀lé γενομένων nínú SBLGNT. Àṣàyàn μελλόντων tí àwọn àfọwọ́kọ kan ní ni a tọ́ka sí ní àlàyé ìsàlẹ̀, kí a má bàa fi ìyàtọ̀ tó ní ipa lórí ìtumọ̀ pamọ́.
- issue: Ìsopọ̀ διὰ τῆς ... σκηνῆς pẹ̀lú gbólóhùn tí ń tẹ̀ síwájú sí ẹsẹ̀ 12
  choice: ó gba àgọ́ ... kọjá
  alternative: nípasẹ̀ àgọ́ ...
  rationale: Gíríìkì jẹ́ gbólóhùn tí kò tíì parí títí di ẹsẹ̀ 12. Ìtumọ̀ yìí so ọ̀rọ̀ náà mọ́ ìwọlé Mèsáyà, dípò kí ó dà bí ẹni pé àgọ́ ni ọ̀nà tí ó gbà farahàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A fi gbolohun náà sílẹ̀ pẹ̀lú àmì gígùn ní ìparí nítorí èrò Gíríìkì ń bá a lọ sí ẹsẹ̀ 12.
