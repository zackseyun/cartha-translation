  source_fidelity: Ìtumọ̀ àwọn ohun rere tí ó ti dé tẹ̀lé γενομένων nínú SBLGNT dáadáa, ìtumọ̀ àfọwọ́kọ fún μελλόντων sì wà ní àlàyé ìsàlẹ̀. Ṣùgbọ́n ìtumọ̀ náà ní “ó gba àgọ́ ... kọjá” fi ìṣe ìkọjá àgọ́ náà sínú ẹsẹ̀ 11 gẹ́gẹ́ bí gbólóhùn tí ó parí, bí ó tilẹ̀ jẹ́ pé διὰ τῆς ... σκηνῆς jẹ́ apá èrò tí ó ń bá a lọ sí εἰσῆλθεν ní ẹsẹ̀ 12. Ìtúnṣe náà pa ìdádúró ìṣọ̀kan gírámà Gíríìkì náà mọ́ pẹ̀lú àmì ìdáwọ́lẹ̀ àti gbolohun tí kò tíì parí.
  naturalness: A yọ “nígbà tí,” nítorí ó mú “nípasẹ̀ àgọ́” dà bí ohun tí ó ṣàlàyé dídé Mèsáyà. A tún yọ “ti ìṣáájú,” tí kò sí nínú ọ̀rọ̀ Gíríìkì. “Tí a kò fi ọwọ́ ṣe” àti “tí kì í ṣe ti ìṣẹ̀dá yìí” jẹ́ Yorùbá òde òní tó dára, tó sì sún mọ́ ọ̀rọ̀ ìpilẹ̀.
  terminology: “Mèsáyà,” “olórí àlùfáà,” àti “àgọ́” ṣetọju oyè Χριστός, ἀρχιερεύς, àti àwòrán σκηνή nínú Hébérù. “Tí kì í ṣe ti ìṣẹ̀dá yìí” sọ οὐ ταύτης τῆς κτίσεως ní ìtumọ̀ taara ju “kì í ṣe ara ìṣẹ̀dá yìí” lọ.
  issues:
