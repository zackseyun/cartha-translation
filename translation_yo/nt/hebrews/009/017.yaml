  source_fidelity: Àwọn yíyàn pàtàkì—“májẹ̀mú” fún διαθήκη, “lórí àwọn òkú” fún ἐπὶ νεκροῖς, àti ìpamọ́ àìdánilójú nínú àwọn àlàyé ìsàlẹ̀—ń tẹ̀lé Gíríìkì náà àti ọ̀nà àyẹ̀wò Gẹ̀ẹ́sì dáadáa. Síbẹ̀, “máa ń fìdí múlẹ̀” ń mú βεβαία dà bí ìṣẹ̀lẹ̀ tí ń ṣẹlẹ̀ léraléra, dípò ipò ìfẹsẹ̀múlẹ̀/tabi ìwúlò lábẹ́ òfin. “Ẹni tí ó dá a ṣe” kò rọrùn nínú Yorùbá ìgbàlódé.
  naturalness: Ìtumọ̀ náà ní ìforúkọsílẹ̀ tó yẹ àti àmì ohùn tó dára. A tún “ẹni tí ó dá a ṣe” ṣe sí “ẹni tí ó ṣe é,” èyí tí ó jẹ́ ọ̀rọ̀ àdánidá síi tí ó sì tún pa ìtumọ̀ méjèèjì (olùṣe májẹ̀mú/tabi olùṣe ìwé ogún) mọ́. A tún sọ βεβαία ní ọ̀nà ipò tí ó rọrùn síi.
