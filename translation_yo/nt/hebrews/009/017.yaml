base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: yo
  text: Nítorí májẹ̀mú kan jẹ́ ohun tí ó fẹsẹ̀ múlẹ̀ lórí àwọn òkú[b][a], níwọ̀n bí kò ti ní agbára rárá nígbà tí ẹni tí ó ṣe é ṣì wà láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Nítorí ìwé ìfẹ́ ẹni nípa ogún máa ń fìdí múlẹ̀ kìkì lẹ́yìn ikú, níwọ̀n bí kò ti ní agbára rárá nígbà tí ẹni tí ó ṣe é ṣì wà láàyè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “májẹ̀mú” tàbí “ìwé ìfẹ́ ẹni nípa ogún.”'
    reason: alternative_reading
  - marker: b
    text: Gbólóhùn náà, “lórí àwọn òkú,” kúkúrú nínú èdè Gíríìkì. Ó lè tọ́ka sí àwọn ẹni tí ó kú, bí ó ṣe rí nínú ọ̀rọ̀ ogún, tàbí sí ikú tó ní í ṣe pẹ̀lú fífi májẹ̀mú múlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: májẹ̀mú
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “májẹ̀mú” tàbí “ìwé ìfẹ́ ẹni nípa ogún.” Àyíká Hébérù 8–10 tẹnu mọ́ májẹ̀mú àti ẹ̀jẹ̀ ìfìdímúlẹ̀ rẹ̀, nítorí náà “májẹ̀mú” ni a lò nínú ọ̀rọ̀ pàtàkì, a sì fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀.
- source_word: ἐπὶ νεκροῖς
  choice: lórí àwọn òkú
  rationale: Èyí pa ìsọ̀rọ̀ Gíríìkì tí ó kúkúrú mọ́, kò sì pinnu bóyá ó ń tọ́ka sí àwọn ẹni tí ó kú tàbí sí ikú tó wà nínú fífi májẹ̀mú múlẹ̀.
- source_word: βεβαία
  choice: máa ń fìdí múlẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà sọ pé ohun kan fẹsẹ̀ múlẹ̀, ó sì ní agbára gẹ́gẹ́ bí òfin tàbí májẹ̀mú.
- source_word: ἐπεὶ
  choice: níwọ̀n bí
  rationale: Ó mú ìdí tàbí àlàyé fún gbólóhùn tó ṣáájú wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: μήποτε
  choice: kò ... rárá
  rationale: Ní ìsopọ̀ pẹ̀lú ἰσχύει, ó túmọ̀ sí pé kò ní agbára nígbà kankan ní ipò tí a sọ.
- source_word: ἰσχύει
  choice: ní agbára
  rationale: Ó ṣàfihàn agbára ìmúlò tàbí agbára lábẹ́ òfin, kì í ṣe agbára ara.
- source_word: ὅτε ζῇ
  choice: nígbà tí ... ṣì wà láàyè
  rationale: Ó pa ìyàtọ̀ láàárín ikú àti ìwàláàyè tó ń bá a lọ mọ́.
- source_word: ὁ διαθέμενος
  choice: ẹni tí ó dá a ṣe
  rationale: Gbólóhùn yìí lè tọ́ka sí ẹni tó dá májẹ̀mú tàbí ẹni tó ṣe ìwé ìfẹ́ nípa ogún; ó pa àìdánilójú yẹn mọ́.
theological_decisions:
- issue: Bóyá διαθήκη túmọ̀ sí “májẹ̀mú” tàbí “ìwé ìfẹ́ ẹni nípa ogún” ní Hébérù 9:17.
  choice: A lo “májẹ̀mú” nínú ọ̀rọ̀ pàtàkì.
  alternative: “Ìwé ìfẹ́ ẹni nípa ogún” ni a fi sínú àlàyé ìsàlẹ̀.
  rationale: Àyíká Hébérù 8–10 jẹ́ ti májẹ̀mú, ṣùgbọ́n èdè ẹsẹ 16–17 tún lè ní ìtumọ̀ ọ̀rọ̀ ogún. Ìtumọ̀ yìí pa ìforígbárí tòótọ́ náà mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
- issue: Bí a ṣe yẹ kí a tú ἐπὶ νεκροῖς tí ó kúkúrú, tí ìtumọ̀ rẹ̀ sì ń fa àríyànjiyàn.
  choice: A pa á mọ́ gẹ́gẹ́ bí “lórí àwọn òkú.”
  alternative: “Lẹ́yìn ikú,” “ní ti àwọn ẹni tí ó kú,” tàbí “lórí àwọn ẹran ẹbọ tí ó kú.”
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ kedere bóyá ó ń tọ́ka sí ikú olùkọ ìwé ogún tàbí sí àwọn ẹran ẹbọ nínú ìfìdímúlẹ̀ májẹ̀mú; nítorí náà a kò yan ọ̀kan ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí gbogbo ènìyàn lè lóye ni a lò. A yan “ẹni tí ó dá a ṣe” dípò ọ̀rọ̀ amòfin tó le, kí àìdánilójú tó wà nínú Gíríìkì lè dúró. Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
