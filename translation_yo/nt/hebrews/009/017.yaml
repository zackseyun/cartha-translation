  rationale: Àtúnṣe náà mú ìtumọ̀ βεβαία sún mọ́ ipò ìfẹsẹ̀múlẹ̀ tí ọrọ̀ náà ní, ó sì rọ́pò gbólóhùn tí kò wọ́pọ̀ “dá a ṣe” pẹ̀lú “ṣe é.” A kò yanjú àríyànjiyàn nípa διαθήκη tàbí ἐπὶ νεκροῖς ju bí orísun ṣe yanjú wọn lọ, a sì pa àwọn àmì àlàyé ìsàlẹ̀ [b][a] mọ́.
