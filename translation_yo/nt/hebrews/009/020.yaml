  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: yo
  text: ó wí pé, “Èyí ni ẹ̀jẹ̀ májẹ̀mú tí Ọlọ́run pàṣẹ fún yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: ó ń wí pé
  rationale: Ọ̀rọ̀ aláìparí yìí so àyọkà náà mọ́ gbólóhùn tó ṣáájú, ó sì mú ọ̀rọ̀ Yorùbá ṣàn lọ́nà àdánidá láì sọ ọ́ di ọ̀rọ̀-ìṣe aláṣẹ tó yà sọ́tọ̀.
- source_word: Τοῦτο
  choice: Èyí ni
  rationale: Bó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe ìsopọ̀ ní Gíríìkì, ‘Èyí ni’ ni ọ̀nà Yorùbá tó ṣe kedere, tó sì fi ìtumọ̀ àfihàn náà hàn láì fi èrò míì kún un.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹ̀jẹ̀; a pa àwòrán ẹbọ àti ìfìdí májẹ̀mú múlẹ̀ náà mọ́ láì ṣe àlàyé rẹ̀ dípò rẹ̀.
- source_word: διαθήκης
  choice: májẹ̀mú
  rationale: Ní àyíká ìtọ́ka sí Ẹ́kísódù 24, ọ̀rọ̀ náà túmọ̀ sí májẹ̀mú, kì í ṣe ìwé ogún.
- source_word: ἧς
  choice: tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan náà tọ́ka padà sí ‘májẹ̀mú’; ‘tí’ jẹ́ ìsopọ̀ Yorùbá tó ṣe kedere, ó sì pa ìbátan gírámà náà mọ́.
- source_word: ἐνετείλατο
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífúnni ní àṣẹ tàbí ìtọ́nisọ́nà; ‘pàṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: πρὸς ὑμᾶς
  choice: fún yín
  rationale: Nínú àyíká májẹ̀mú yìí, ‘fún yín’ fi hàn pé àṣẹ náà dojú kọ àwọn ènìyàn náà, ó sì jẹ́ Yorùbá àdánidá ju ‘sí yín’ lọ.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá boṣewa fún θεός nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη ní àyíká ìfìdí májẹ̀mú múlẹ̀
  choice: májẹ̀mú
  alternative: ìwé ogún
  rationale: Ẹsẹ̀ náà ń tọ́ka sí Ẹ́kísódù 24:8 àti májẹ̀mú Mósè tí a fi ẹ̀jẹ̀ múlẹ̀; ‘ìwé ogún’ yóò mú èrò òfin míì wọlé tí kò bá àyíká yìí mu.
- issue: Fífi ọ̀rọ̀-ìṣe ìsopọ̀ tí Gíríìkì fi sílẹ̀ kún un lẹ́yìn Τοῦτο
  choice: Èyí ni ẹ̀jẹ̀ májẹ̀mú
  alternative: Èyí, ẹ̀jẹ̀ májẹ̀mú
  rationale: Yorùbá àdánidá nílò ‘ni’ láti sọ àfihàn náà di kedere; èyí kò fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní ọlá, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ó ń wí pé’ pa ìsopọ̀ participle mọ́, ‘ẹ̀jẹ̀ májẹ̀mú’ sì pa ìṣọ̀kan ọ̀rọ̀ àti àwòrán Ẹ́kísódù mọ́. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí ìyàtọ̀ gírámà Gẹ̀ẹ́sì tí àlàyé [a] sọ kò nílò àlàyé bẹ́ẹ̀ ní Yorùbá.
