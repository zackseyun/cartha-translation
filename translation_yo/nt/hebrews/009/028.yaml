id: HEB.9.28
reference: Hebrews 9:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni Mèsáyà, lẹ́yìn tí a ti fi í rú ẹbọ lẹ́ẹ̀kan láti ru ẹ̀ṣẹ̀ ọ̀pọ̀ ènìyàn, yóò farahàn ní ìgbà kejì, yàtọ̀ sí ẹ̀ṣẹ̀[a], fún àwọn tí ń fi ìháragàgà dúró dè é, fún ìgbàlà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìtọ́ka sí ẹ̀ṣẹ̀,” ìyẹn ni pé, kì í ṣe láti ru ẹ̀ṣẹ̀, gẹ́gẹ́ bí ní ìgbà àkọ́kọ́ tí a fi í rú ẹbọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ẹsẹ yìí mọ́ àfiwé inú ẹsẹ 27, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘gẹ́gẹ́ bẹ́ẹ̀ náà.’
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró nínú àríyànjiyàn ìtàn ìgbàlà yìí, kì í ṣe bí orúkọ lásán.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan
  rationale: Ó pa ìtumọ̀ tààrà pé ‘ní ẹ̀ẹ̀kan’ mọ́ láìfi ‘títí láé’ tàbí ọ̀rọ̀ míì tí kò sí nínú gbólóhùn náà kún un.
- source_word: προσενεχθεὶς
  choice: lẹ́yìn tí a ti fi í rú ẹbọ
  rationale: Ó pa ìṣe aláìlórúkọ olùṣe ti participle aorist passive mọ́, ó sì fi hàn pé fífi rú ẹbọ náà ṣáájú ìfarahàn ọjọ́ iwájú.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: láti ru ẹ̀ṣẹ̀ ọ̀pọ̀ ènìyàn
  rationale: ‘Ru ẹ̀ṣẹ̀’ pa àwòrán ìrúbọ àti ìṣàpẹẹrẹ Aísáyà mọ́, nígbà tí ‘láti’ fi ète hàn.
- source_word: ἐκ δευτέρου
  choice: ní ìgbà kejì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìṣẹ̀lẹ̀ kejì, ó sì pa ìyàtọ̀ rẹ̀ sí fífi rú ẹbọ ní àkọ́kọ́ mọ́.
- source_word: χωρὶς ἁμαρτίας
  choice: yàtọ̀ sí ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ yìí dúró nítòsí ọ̀rọ̀ Gíríìkì tó ṣókí, kò sì túmọ̀ rẹ̀ ní kíkún nínú àyọkà pàtàkì; àlàyé ìtumọ̀ tó ṣeé ṣe wà ní àlàyé ìsàlẹ̀.
- source_word: ὀφθήσεται
  choice: yóò farahàn
  rationale: Fáàbù passive yìí sábà máa ń jẹ́ èdè ìfarahàn; ‘yóò farahàn’ jẹ́ àdánidá ní Yorùbá, ó sì bá ọ̀rọ̀ ọjọ́ ìkẹyìn mu.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: fún àwọn tí ń fi ìháragàgà dúró dè é
  rationale: ‘Fi ìháragàgà dúró dè’ mú ìfojúsọ́nà onítara tó wà nínú ἀπεκδέχομαι jáde, ju ‘dúró dè’ lásán lọ.
- source_word: εἰς σωτηρίαν
  choice: fún ìgbàlà
  rationale: Ó pa ète tàbí góńgó tí εἰς ń fi hàn mọ́ láìfikún pé ‘mú ìgbàlà wá,’ èyí tí yóò jẹ́ àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘yàtọ̀ sí ẹ̀ṣẹ̀’ ní ìfarahàn kejì
  choice: 'A fi ọ̀rọ̀ tó sún mọ́ ‘apart from sin’ sí ayọkà pàtàkì: ‘yàtọ̀ sí ẹ̀ṣẹ̀.’'
  alternative: ‘láìtọ́ka sí ẹ̀ṣẹ̀,’ ìyẹn ni pé, kì í ṣe láti ru ẹ̀ṣẹ̀ bí ní fífi rú ẹbọ ní àkọ́kọ́.
  rationale: Gbólóhùn Gíríìkì náà ṣókí, ó sì ní ìwúwo ẹ̀kọ́ ìgbàgbọ́. Dídúró nítòsí rẹ̀ nínú ayọkà pàtàkì, pẹ̀lú àlàyé ìsàlẹ̀, ń pa ìṣòro àti ìṣòro-ìtumọ̀ rẹ̀ mọ́ dípò píparí rẹ̀ ní ìdákẹ́jẹ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. ‘Mèsáyà’ pa oyè Χριστός mọ́; ‘fi í rú ẹbọ’ sì ń sọ àyíká ìrúbọ náà kedere láìfikún olùṣe tí Gíríìkì kò dárúkọ.
