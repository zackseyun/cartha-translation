id: HEB.9.2
reference: Hebrews 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: yo
  text: Nítorí a pèsè àgọ́ àkọ́kọ́[a], nínú èyí tí ọ̀pá fìtílà, tábìlì àti àwọn búrẹ́dì tí a tò kalẹ̀ wà; èyí ni a ń pè ní Ibi Mímọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, apá tàbí yàrá àkọ́kọ́ ti àgọ́ náà.
    reason: clarification
  - marker: b
    text: Ní èdè Gíríìkì, “Àwọn Ibi Mímọ́”; níbí ó ń tọ́ka sí yàrá àkọ́kọ́ ti àgọ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ἡ πρώτη
  choice: àgọ́ àkọ́kọ́
  rationale: “Àgọ́” pa àwòrán ibi ìjọsìn alágbèéká ti Mósè mọ́; “àkọ́kọ́” sì tẹ̀ lé ọ̀rọ̀ Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé yàrá àkọ́kọ́ ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: κατεσκευάσθη
  choice: a pèsè
  rationale: Ó ṣàfihàn pé a mú ibi náà sí ipò tí a ti ṣètò rẹ̀ fún iṣẹ́ mímọ́, láì dín ìtumọ̀ náà kù sí kíkọ́ ilé nìkan.
- source_word: λυχνία
  choice: ọ̀pá fìtílà
  rationale: Èyí jẹ́ ohun tí a gbé àwọn fìtílà oróro lé, kì í ṣe fìtílà abẹ́là.
- source_word: τράπεζα
  choice: tábìlì
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun èlò mímọ́ yìí.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: àwọn búrẹ́dì tí a tò kalẹ̀
  rationale: Ó mú ìṣe “títò síwájú/títò kalẹ̀” inú πρόθεσις jáde ní èdè Yorùbá àdánidá, ó sì pa ọ̀pọ̀ nǹkan inú τῶν ἄρτων mọ́.
- source_word: ἥτις λέγεται Ἅγια
  choice: èyí ni a ń pè ní Ibi Mímọ́
  rationale: Ó jẹ́ ìtumọ̀ àdánidá ti gbólóhùn ìdánimọ̀ náà; “Ibi Mímọ́” fi yàrá òde hàn ní ìbámu pẹ̀lú yàrá inú tí ẹsẹ tó tẹ̀ lé sọ.
theological_decisions:
- issue: Ìtumọ̀ Ἅγια gẹ́gẹ́ bí ọ̀pọ̀ nínú èdè Gíríìkì
  choice: Ibi Mímọ́
  alternative: Àwọn Ibi Mímọ́; ibi ìjọsìn mímọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé Ἅγια ní ìrísí ọ̀pọ̀, àyíká ọ̀rọ̀ fi yàrá àkọ́kọ́ yà sí yàrá kejì; “Ibi Mímọ́” jẹ́ kó ṣe kedere láì fi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
- issue: Bóyá σκηνὴ ἡ πρώτη túmọ̀ sí gbogbo àgọ́ tàbí yàrá àkọ́kọ́
  choice: àgọ́ àkọ́kọ́, pẹ̀lú àlàyé ìsàlẹ̀
  alternative: apá àkọ́kọ́ àgọ́ náà
  rationale: Ọ̀rọ̀ pàtó náà ni “àgọ́ àkọ́kọ́,” ṣùgbọ́n àyíká fi hàn pé apá tàbí yàrá òde ni. A pa ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìtọ́kasí rẹ̀ ní ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A yan “àgọ́” láti pa ìsopọ̀ mọ́ ibi ìjọsìn Mósè, “ọ̀pá fìtílà” láti yẹra fún àwòrán abẹ́là, àti “àwọn búrẹ́dì tí a tò kalẹ̀” láti mú ìtumọ̀ Gíríìkì jáde láì gbára lé ọ̀rọ̀ ìbílẹ̀ tí ó lè ṣókùnkùn.
