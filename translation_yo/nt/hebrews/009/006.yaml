  to: Nígbà tí a ti pèsè àwọn nǹkan wọ̀nyí lọ́nà yìí, àwọn àlùfáà máa ń wọ inú apá àkọ́kọ́ ti Àgọ́ Ìjọsìn[a] léraléra, wọ́n sì ń ṣe àwọn iṣẹ́ ìsìn náà[b].
  rationale: Àtúnṣe náà ṣàlàyé ibi tí àwọn àlùfáà ń wọlé gẹ́gẹ́ bí apá àkọ́kọ́ ti Àgọ́ Ìjọsìn, ní ìbámu pẹ̀lú àyíká tó ń fi apá yẹn wé apá kejì ní ẹsẹ tó tẹ̀ lé. ‘Léraléra’ pa agbára διὰ παντός mọ́ gẹ́gẹ́ bí ìṣe àṣà tí ń ṣẹlẹ̀ déédéé, láì sọ pé iṣẹ́ náà kò ní ìdádúró rárá. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ kí ó má bà a tún ìtumọ̀ ọ̀rọ̀ náà ṣe.
  reviewer_model: gpt-5.6-terra
