language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: yo
  text: Nígbà tí a ti pèsè àwọn nǹkan wọ̀nyí lọ́nà yìí, àwọn àlùfáà máa ń wọ inú apá àkọ́kọ́ ti Àgọ́ Ìjọsìn[a] léraléra, wọ́n sì ń ṣe àwọn iṣẹ́ ìsìn náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àgọ́ àkọ́kọ́” tàbí “yàrá àkọ́kọ́.” Ọ̀rọ̀ Gíríìkì σκηνή lè túmọ̀ sí Àgọ́ Ìjọsìn fúnra rẹ̀ tàbí, nínú àyíká yìí, apá rẹ̀ àkọ́kọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn iṣẹ́ ìjọsìn” tàbí “àwọn ojúṣe ìlànà ìsìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Nígbà tí a ti pèsè àwọn nǹkan wọ̀nyí lọ́nà yìí
  rationale: Ọ̀rọ̀ yìí ṣàlàyé ipò tó ṣáájú ohun tó tẹ̀ lé. “Pèsè” bá κατεσκευασμένων mu láì fi kún un pé wọ́n kọ́ àwọn nǹkan náà tàbí pé wọ́n kàn tò wọ́n.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: wọ inú àgọ́ àkọ́kọ́
  rationale: “Àgọ́” pa àwòrán ibi mímọ́ alágbèéká mọ́, “àkọ́kọ́” sì tẹ̀ lé πρώτην. Àlàyé ìsàlẹ̀ ojú ewé pa àǹfààní ìtumọ̀ apá tàbí yàrá àkọ́kọ́ mọ́.
- source_word: διὰ παντὸς
  choice: ní gbogbo ìgbà
  rationale: Ó fi iṣẹ́ tí àwọn àlùfáà máa ń ṣe léraléra hàn, kì í ṣe pé wọ́n wà níbẹ̀ láìdáwọ́ dúró ní gbogbo ìṣẹ́jú.
- source_word: εἰσίασιν
  choice: máa ń wọ inú
  rationale: Àkójọpọ̀ “máa ń” fi ìṣe àṣà tí ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí ìṣe ọ̀rọ̀ ìṣe ti Gíríìkì.
- source_word: οἱ ἱερεῖς
  choice: àwọn àlùfáà
  rationale: Ó ń tọ́ka sí àwọn àlùfáà tí wọ́n ń ṣe iṣẹ́ ojoojúmọ́, ní ìyàtọ̀ sí olórí àlùfáà ní ẹsẹ tó tẹ̀ lé.
- source_word: τὰς λατρείας
  choice: àwọn iṣẹ́ ìsìn náà
  rationale: Ọ̀rọ̀ yìí dá lórí àwọn iṣẹ́ ìjọsìn tí a yàn kalẹ̀ fún ibi mímọ́, láì sọ ọ́ di ìpàdé ìjọ ti àkókò òde òní.
- source_word: ἐπιτελοῦντες
  choice: wọ́n sì ń ṣe
  rationale: Ìtumọ̀ yìí fi hàn pé ohun tí àwọn àlùfáà ń ṣe nígbà tí wọ́n bá wọlé ni pípa àwọn iṣẹ́ ìsìn náà ṣẹ.
theological_decisions:
- issue: Ìtumọ̀ σκηνή nínú àyíká ibi mímọ́
  choice: àgọ́ àkọ́kọ́
  alternative: apá àkọ́kọ́ Àgọ́ Ìjọsìn; yàrá àkọ́kọ́
  rationale: “Àgọ́” pa ìsopọ̀ mọ́ ibi mímọ́ Mósè mọ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì lè tọ́ka sí àgọ́ náà tàbí sí apá rẹ̀ àkọ́kọ́; a kò fi tipátipá yan ọ̀kan nínú wọn.
- issue: Agbára διὰ παντὸς nínú iṣẹ́ àlùfáà
  choice: ní gbogbo ìgbà
  alternative: déédéé; nígbà gbogbo
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín bí àwọn àlùfáà ṣe máa ń wọ apá àkọ́kọ́ léraléra àti bí olórí àlùfáà ṣe ní àyè díẹ̀ láti wọ apá kejì, láì túmọ̀ sí pé wọn kò jáde rárá.
translation_notes:
  register: Yorùbá ọ̀wọ̀, adayébá, tó sì ṣeé lóye ni a lò. “Máa ń” mú ìṣe tí ń ṣẹlẹ̀ léraléra jáde, “àwọn iṣẹ́ ìsìn” sì pa àyíká ìjọsìn ibi mímọ́ mọ́ láì gbé èrò ẹ̀ya ìjọ kan wọ inú ẹsẹ náà.
