  source_fidelity: Ìtumọ̀ náà pa ìfẹ̀hónúhàn, ìwẹ̀nùmọ́, ìfiwéra, àti ọ̀pọ̀ ‘ẹbọ’ ti Gíríìkì mọ́. Ṣùgbọ́n ‘àwọn ohun ti ọ̀run’ lè túmọ̀ sí ohun tí ọ̀run ní, dípò ἐπουράνια, ‘àwọn ohun ọ̀run / àwọn ohun ti ń bẹ ní ọ̀run.’ Àtúnṣe náà tún lo ọ̀rọ̀ tó bá ipò àwọn ohun ìjọsìn ayé gẹ́gẹ́ bí ìbámu sí ohun ọ̀run mu dáadáa.
