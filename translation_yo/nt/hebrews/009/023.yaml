id: HEB.9.23
reference: Hebrews 9:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: yo
  text: Nítorí náà, ó pọndandan kí a fi àwọn nǹkan wọ̀nyí wẹ àwọn àpẹẹrẹ[a] àwọn ohun tí ó wà ní àwọn ọ̀run mọ́[b], ṣùgbọ́n kí a fi àwọn ẹbọ[c] tí ó sàn ju àwọn wọ̀nyí lọ wẹ àwọn ohun ọ̀run fúnra wọn mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “àwọn àwòrán” tàbí “àwọn ohun tí ó dúró fún àwọn ohun mìíràn.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “sọ … di mímọ́.” Ọ̀rọ̀ Gíríìkì jẹ́ èdè ìwẹ̀nùmọ́ nínú ìjọsìn.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì ní “àwọn ẹbọ” ní ọ̀pọ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ nínú Hébérù dá lé ẹbọ Mèsáyà lẹ́ẹ̀kan ṣoṣo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Nítorí náà, ó pọndandan
  rationale: “Nítorí náà” fi ìyọrísí àríyànjiyàn tó ṣáájú hàn, “ó pọndandan” sì sọ àìní náà ní Yorùbá àdánidá láìfi ẹni kan ṣe olùṣe rẹ̀.
- source_word: ὑποδείγματα
  choice: àwọn àwòrán
  rationale: “Àwọn àwòrán” túmọ̀ sí àwọn ohun ayé tó dúró gẹ́gẹ́ bí àfihàn àwọn ohun ọ̀run, ó sì mú ìyàtọ̀ wọn sí “àwọn ohun ti ọ̀run fúnra wọn” hàn.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: àwọn ohun tí ó wà ní àwọn ọ̀run
  rationale: Èyí pa ọ̀rọ̀ orísun tó lo ọ̀pọ̀ “àwọn ọ̀run” mọ́, kò sì sọ ọ́ di ọ̀rọ̀ ajẹtífù bí ἐπουράνια tó tẹ̀ lé e.
- source_word: τούτοις καθαρίζεσθαι
  choice: kí a fi àwọn nǹkan wọ̀nyí wẹ … mọ́
  rationale: Ìṣètò “fi … wẹ … mọ́” jẹ́ Yorùbá àdánidá fún ohun èlò ìwẹ̀nùmọ́, ó sì pa ìtọ́ka “àwọn nǹkan wọ̀nyí” mọ́.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: ṣùgbọ́n … àwọn ohun ti ọ̀run fúnra wọn
  rationale: “Fúnra wọn” pa ìtẹnumọ́ αὐτά mọ́; “àwọn ohun ti ọ̀run” kò fi ìtumọ̀ àlàyé bí “ibi mímọ́ ti ọ̀run” kún ọ̀rọ̀ náà.
- source_word: κρείττοσι θυσίαις
  choice: àwọn ẹbọ tí ó sàn ju
  rationale: “Tí ó sàn ju” sọ ìfiwéra κρείττοσι ní kedere, “àwọn ẹbọ” sì pa ọ̀pọ̀ θυσίαις mọ́.
- source_word: παρὰ ταύτας
  choice: ju àwọn wọ̀nyí lọ
  rationale: Pẹ̀lú ọ̀rọ̀ ìfiwéra, παρά túmọ̀ sí “ju … lọ”; aṣọ́ka náà ń tọ́ka sí àwọn ohun ìwẹ̀nùmọ́ ayé tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Ohun tí “àwọn ohun ti ọ̀run” túmọ̀ sí àti bí a ṣe wẹ̀ wọ́n mọ́
  choice: Pa gbólóhùn pé a wẹ “àwọn ohun ti ọ̀run fúnra wọn” mọ́ pẹ̀lú àwọn ẹbọ tó sàn ju mọ́.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ibi mímọ́ ti ọ̀run, àwọn ènìyàn ọ̀run, tàbí tún un sọ láti yẹra fún èrò pé a wẹ ohun ọ̀run mọ́.
  rationale: Gíríìkì fi àwọn àwòrán ayé wé àwọn ohun ti ọ̀run fúnra wọn, ó sì lo èdè ìwẹ̀nùmọ́ fún méjèèjì. Ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìdáhùn rẹ̀ nípasẹ̀ àlàyé.
- issue: Ọ̀pọ̀ “àwọn ẹbọ” àti ẹbọ Mèsáyà lẹ́ẹ̀kan ṣoṣo
  choice: Lo ọ̀pọ̀ “àwọn ẹbọ” nínú ọ̀rọ̀ pàtàkì.
  alternative: Lo ẹyọ “ẹbọ” láti bá ẹbọ Kristi lẹ́ẹ̀kan ṣoṣo mu.
  rationale: Bí ó tilẹ̀ jẹ́ pé ìwé Hébérù tẹnumọ́ ẹbọ Kristi lẹ́ẹ̀kan ṣoṣo ní ibòmíràn, θυσίαις jẹ́ ọ̀pọ̀ ní ẹsẹ yìí. A kò ṣe àtúnṣe ọ̀rọ̀ orísun láti mú un bá ẹ̀kọ́ ibòmíràn mu.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye ni a lò. “Ó pọndandan,” “wẹ … mọ́,” àti “tí ó sàn ju … lọ” jẹ́ ọ̀nà àdánidá; a yàgò fún ọ̀rọ̀ ẹ̀sìn àtijọ́ tó lè ṣòro fún òǹkàwé òde òní. Àmì ohùn ni a fi sí ibi tí ó yẹ.
