reference: Hebrews 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: yo
  text: Nípa èyí, Ẹ̀mí Mímọ́ ń fi hàn pé ọ̀nà sí àwọn ibi mímọ́[a] kò tíì hàn gbangba nígbà tí àgọ́ àkọ́kọ́ ṣì dúró[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà sí ibi mímọ́.” Gbólóhùn Gíríìkì náà lè tọ́ka sí àwọn ibi mímọ́ ní gbogbogbò; àwọn kan sì gbà pé ó ń tọ́ka ní pàtó sí Ibi Mímọ́ Jùlọ.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nígbà tí àgọ́ àkọ́kọ́ ṣì ní ipò rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: ń fi hàn
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí náà ní agbára àlàyé tí ó ń lọ lọ́wọ́; “ń fi hàn” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ yẹn mọ́.
- source_word: πνεύματος τοῦ ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí a sábà ń lò fún ẹni tí gbólóhùn Gíríìkì náà ń tọ́ka sí.
- source_word: μήπω πεφανερῶσθαι
  choice: kò tíì hàn gbangba
  rationale: Ó sọ ipò tí ohun kan kò tíì farahàn tàbí di ṣíṣípayá; “kò tíì hàn gbangba” mú ìtẹ̀síwájú ipò yẹn jáde láì fi olùṣe kún ọ̀rọ̀ náà.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: ọ̀nà tí ó wọ inú àwọn ibi mímọ́
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti àgọ́ ìjọsìn àti bí a ṣe ń wọ ibi mímọ́. “Àwọn ibi mímọ́” pa nọ́ńbà púpọ̀ Gíríìkì mọ́, “wọ inú” sì mú ìtumọ̀ ọ̀nà ìwọlé náà ṣe kedere ní Yorùbá.
- source_word: πρώτης σκηνῆς
  choice: àgọ́ àkọ́kọ́
  rationale: “Àgọ́” bá àgọ́ ìjọsìn mu, “àkọ́kọ́” sì tẹ̀ lé ìyàtọ̀ láàárín àwọn apá rẹ̀ nínú àyíká ọ̀rọ̀.
- source_word: ἐχούσης στάσιν
  choice: ṣì dúró
  rationale: Gbólóhùn náà ń tọ́ka sí ìwàláàyè tàbí ipò tí ó ń bá a lọ. “Ṣì dúró” jẹ́ èdè Yorùbá tó ṣe déédé, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí pé ohun náà ṣì ní ipò tàbí agbára rẹ̀.
- source_word: ἔτι
  choice: ṣì
  rationale: Ó fi hàn pé ipò náà ń bá a lọ títí di àkókò tí a ń sọ̀rọ̀ nípa rẹ̀.
theological_decisions:
- issue: Ohun tí τῶν ἁγίων ń tọ́ka sí
  choice: àwọn ibi mímọ́ nínú àgọ́ ìjọsìn
  alternative: àwọn ènìyàn mímọ́
  rationale: Àyíká náà ń sọ nípa ìṣètò àgọ́ ìjọsìn àti ìwọlé àwọn àlùfáà, nítorí náà ìtumọ̀ ibi ìjọsìn ló bá ọ̀rọ̀ náà mu.
- issue: Bóyá τῶν ἁγίων ń tọ́ka sí gbogbo ibi mímọ́ tàbí Ibi Mímọ́ Jù Lọ nìkan
  choice: àwọn ibi mímọ́ ní ìtumọ̀ gbòòrò
  alternative: Ibi Mímọ́ Jù Lọ ní pàtó
  rationale: Nọ́ńbà púpọ̀ Gíríìkì náà lè tọ́ka sí ibi mímọ́ ní gbogbogbòò, bí ó tilẹ̀ jẹ́ pé àyíká lè mú kí àwọn kan rí Ibi Mímọ́ Jù Lọ ní pàtó. A kò yanju àìdánilójú náà ju bí orísun ṣe ṣe lọ.
- issue: Ìtumọ̀ ìdúró àgọ́ àkọ́kọ́
  choice: àgọ́ àkọ́kọ́ ṣì dúró
  alternative: àgọ́ àkọ́kọ́ ṣì ní ipò tàbí agbára rẹ̀
  rationale: στάσις lè ní ìmọ̀lára pé ohun náà ṣì wà tàbí pé ó ṣì ní ipò tó fẹsẹ̀ múlẹ̀. Ọ̀rọ̀ àkọ́kọ́ jẹ́ àdánidá, akọsilẹ̀ sì pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwọn àmì ohùn mọ́ níbi tí wọ́n ti jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹ̀gbẹ́ kan.
