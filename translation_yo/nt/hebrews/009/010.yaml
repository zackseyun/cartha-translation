id: HEB.9.10
reference: Hebrews 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: yo
  text: Àwọn wọ̀nyí kan ní í ṣe pẹ̀lú oúnjẹ àti ohun mímu àti onírúurú ìwẹ̀nùmọ́; wọ́n jẹ́ ìlànà ti ara tí a fi lélẹ̀ títí di àkókò àtúnṣe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: oúnjẹ àti ohun mímu
  rationale: Ó túmọ̀ àwọn ohun tí a ń jẹ àti tí a ń mu ní èdè Yorùbá àdánidá, láì fi ìtumọ̀ míì kún un.
- source_word: διαφόροις βαπτισμοῖς
  choice: onírúurú ìwẹ̀nùmọ́
  rationale: Ní àyíká òfin ìsìn, ọ̀rọ̀ náà ń tọ́ka sí onírúurú ìwẹ̀ ìṣe-àṣà, kì í ṣe dandan sí ìbatisí Kristẹni.
- source_word: δικαιώματα σαρκὸς
  choice: ìlànà ti ara
  rationale: Èyí pa ìbáṣepọ̀ mọ́ σάρξ (‘ara’) mọ́, ó sì ṣàfihàn pé àwọn ìlànà náà kan ohun ti ara lóde, láì túmọ̀ ọ́ sí ohun ẹ̀ṣẹ̀.
- source_word: ἐπικείμενα
  choice: tí a fi lélẹ̀
  rationale: Ó ṣàfihàn pé a gbé àwọn ìlànà náà lé àwọn olùjọsìn lórí gẹ́gẹ́ bí ohun tí wọ́n ní láti tẹ̀ lé.
- source_word: καιροῦ διορθώσεως
  choice: àkókò àtúnṣe
  rationale: ‘Àtúnṣe’ mú èrò mímú nǹkan padà sí ipò tó tọ́ jáde, ó sì pa àìsọ pàtó nípa ìṣẹ̀lẹ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘σαρκὸς’ nínú ‘δικαιώματα σαρκὸς’
  choice: ti ara
  alternative: ti ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Nínú àyíká yìí, ‘ara’ ń fi ìlànà ìsìn lóde wé ìwẹ̀nùmọ́ ọkàn; kò yẹ kí a fi èrò ẹ̀dá ẹlẹ́ṣẹ̀ sínú ọ̀rọ̀ náà.
- issue: Ìdánimọ̀ ‘àkókò àtúnṣe’
  choice: a kò sọ ìṣẹ̀lẹ̀ náà ní pàtó
  alternative: títí di májẹ̀mú tuntun / títí Kristi fi dé
  rationale: Ọ̀rọ̀ Gíríìkì fi ìtumọ̀ ẹ̀kọ́ ìsìn sílẹ̀ fún àyíká ẹsẹ̀ tó yí i ká; ìtumọ̀ kò gbọdọ̀ yanjú rẹ̀ nípa fífi àlàyé kan sínú ẹsẹ̀.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, tó lọ́lá, tó sì ṣeé lóye. Gbólóhùn bẹ̀rẹ̀ pẹ̀lú ‘Àwọn wọ̀nyí’ láti so ẹsẹ̀ náà mọ́ àwọn ẹ̀bùn àti ẹbọ inú ẹsẹ̀ 9.
