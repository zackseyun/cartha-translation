  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: yo
  text: Nítorí níbi tí májẹ̀mú bá wà[a], ó pọndandan kí a gbé ikú ẹni tí ó dá a sílẹ̀ kalẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí níbi tí ìwé ìfẹ́ ẹni nípa ogún bá wà, ó pọndandan láti fi hàn pé ẹni tí ó ṣe é ti kú.” Ọ̀rọ̀ Gíríìkì náà, diathēkē, lè túmọ̀ sí “májẹ̀mú” tàbí “ìwé ìfẹ́ ẹni nípa ogún,” ọ̀pọ̀ ènìyàn sì lóye ẹsẹ̀ 16–17 ní ìtumọ̀ òfin yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: májẹ̀mú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘májẹ̀mú’ tàbí ‘ìwé ìfẹ́ ẹni nípa ogún.’ Àríyànjiyàn Hébérù 8–10 dá lórí májẹ̀mú, nítorí náà ‘májẹ̀mú’ ni a lò nínú ẹsẹ̀ pàtàkì, a sì fi ìtumọ̀ òfin pamọ́ sínú àlàyé ìsàlẹ̀.
- source_word: θάνατον
  choice: ikú
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì tọ́ka sí ikú gidi nínú àríyànjiyàn yìí.
- source_word: ἀνάγκη
  choice: ó pọndandan
  rationale: Ó sọ pé ohun náà jẹ́ dandan, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi èrò náà hàn.
- source_word: φέρεσθαι
  choice: kí a mú ... wá síwájú
  rationale: Ó pa àwòrán ọ̀rọ̀-ìṣe Gíríìkì náà mọ́—‘mú wá’ tàbí ‘gbé kalẹ̀’—láì fi ìtumọ̀ ‘fìdí múlẹ̀’ kún un láìṣe dandan.
- source_word: τοῦ διαθεμένου
  choice: ẹni tí ó dá a sílẹ̀
  rationale: Ó tọ́ka sí ẹni tí ó ṣe tàbí dá διαθήκη sílẹ̀, láìfi ‘olùkọ̀wé ìwé ogún’ ṣe ìtumọ̀ pàtàkì.
- source_word: ὅπου γὰρ
  choice: Nítorí níbi tí ... bá wà
  rationale: ‘Nítorí’ pa agbára àlàyé γάρ mọ́, ‘níbi tí ... bá wà’ sì ṣe aṣojú ὅπου ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá διαθήκη túmọ̀ sí ‘májẹ̀mú’ tàbí ‘ìwé ìfẹ́ ẹni nípa ogún’ ní Hébérù 9:16
  choice: ‘májẹ̀mú’ nínú ẹsẹ̀ pàtàkì, pẹ̀lú ìtumọ̀ òfin nínú àlàyé ìsàlẹ̀
  alternative: ‘ìwé ìfẹ́ ẹni nípa ogún’ tàbí ‘ìwé ogún’
  rationale: Àyíká Hébérù 8–10 tẹnumọ́ májẹ̀mú àti ìfìdásílẹ̀ rẹ̀ nípasẹ̀ ẹbọ, ṣùgbọ́n ẹsẹ̀ 16–17 tún lè lo ọ̀rọ̀ náà ní ìtumọ̀ òfin. Ìtumọ̀ yìí pa ìṣòro àti àìdánilójú inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye. Gbólóhùn ‘mú ... wá síwájú’ mọ̀ọ́mọ̀ tẹ̀lé àwòrán φέρεσθαι, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ lo Yorùbá òfin tí ó rọrùn sí i fún ìtumọ̀ kejì.
