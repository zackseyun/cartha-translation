source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà, ní ìbámu pẹ̀lú Òfin, ó fẹ́rẹ̀ẹ́ jẹ́ pé a fi ẹ̀jẹ̀ ń wẹ ohun gbogbo mọ́; láìsí títú ẹ̀jẹ̀ sílẹ̀, kò sí ìdáríjì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ìtúsílẹ̀”: ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí títú ẹni sílẹ̀ tàbí fífi ẹ̀ṣẹ̀ jì; níbí, ó ń tọ́ka sí ìdáríjì ẹ̀ṣẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: ó fẹ́rẹ̀ẹ́ jẹ́ pé
  rationale: Ó fi ààlà tí ọ̀rọ̀ Gíríìkì náà ní hàn, pé kì í ṣe gbogbo ìwẹ̀mọ́ lábẹ́ Òfin pátápátá ló nílò ẹ̀jẹ̀.
- source_word: ἐν αἵματι
  choice: ẹ̀jẹ̀ ni a fi
  rationale: ἐν níbí ń tọ́ka sí ohun èlò tàbí ọ̀nà ìwẹ̀mọ́; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìrúbọ mọ́.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ aláìlẹ́mìí, ó sì ń tọ́ka gbòòrò sí àwọn ohun àti ọ̀ràn ìlànà tí a ń sọ̀rọ̀ nípa wọn.
- source_word: καθαρίζεται
  choice: a fi ń wẹ ... mọ́
  rationale: Ìṣe àṣà tí ó ń ṣẹlẹ̀ déédéé ni ọ̀rọ̀ ìṣe àkókò ìsinsìnyí náà fi hàn; ‘wẹ ... mọ́’ ṣe kedere, ó sì bá àyíká ìwẹ̀mọ́ ti ìsìn mu.
- source_word: κατὰ τὸν νόμον
  choice: gẹ́gẹ́ bí Òfin
  rationale: Ó túmọ̀ sí ní ìbámu pẹ̀lú ètò Òfin Mósè, láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: χωρίς
  choice: láìsí
  rationale: Ó sọ àìsí ohun kan ní tààràtà, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: αἱματεκχυσίας
  choice: ìtàjẹ̀ sílẹ̀
  rationale: Ó mú ìtumọ̀ dídà tàbí títú ẹ̀jẹ̀ jáde nínú ọ̀ràn ìrúbọ dúró ní ṣókí àti ní kedere.
- source_word: οὐ γίνεται
  choice: kò sí
  rationale: Pẹ̀lú orúkọ àfoyemọ ἄφεσις, gbólóhùn náà túmọ̀ sí pé ìdáríjì kì í ṣẹlẹ̀ tàbí kò wà; ‘kò sí’ jẹ́ àdánidá jù lọ.
- source_word: ἄφεσις
  choice: ìdáríjì
  rationale: Nínú àyíká ẹ̀jẹ̀ ìrúbọ yìí, ọ̀rọ̀ náà ń tọ́ka sí fífi ẹ̀ṣẹ̀ jì; ‘ìdáríjì’ ṣe kedere fún òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Ìtumọ̀ ἄφεσις nínú àyíká ìrúbọ
  choice: ìdáríjì
  alternative: ìtúsílẹ̀
  rationale: ἄφεσις lè túmọ̀ sí ìtúsílẹ̀ tàbí ìdáríjì, ṣùgbọ́n àríyànjiyàn nípa ẹ̀jẹ̀ àti ẹ̀ṣẹ̀ nínú Hébérù 9 mú kí ‘ìdáríjì’ bá àyíká yìí mu jù, láìfi ẹ̀kọ́ ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. ‘Òfin’ ní lẹ́tà ńlá ń tọ́ka sí Òfin Mósè. A pa ìyàtọ̀ ‘ó fẹ́rẹ̀ẹ́’ mọ́, kí ẹsẹ náà má bàa sọ pé gbogbo ìwẹ̀mọ́ pátápátá ló fi ẹ̀jẹ̀ ṣe.
