review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the relative connection, the figurative sense of παραβολή, the present-time reference, the paired cultic gifts and sacrifices, their incapacity, and the limitation 'with respect to conscience.' The wording 'a ti ń rú,' however, introduces the particle ti, which can suggest a prior or already-established action and is not required by the Greek present passive προσφέρονται.
  naturalness: The translation is generally clear and idiomatic Standard Yoruba. Recasting the second clause without ti makes the ongoing present action more direct and avoids an unnecessary temporal nuance.
  terminology: Àkàwé appropriately preserves the broad figurative force of παραβολή, while the footnote supplies viable alternatives. Ọrẹ and ẹbọ retain the two cultic terms, and ẹ̀rí-ọkàn is an established rendering of συνείδησις. Mú ... di pípé preserves the marked theological wording of τελειῶσαι without importing 'cleansing.'
  issues:
  - severity: low
    issue: The phrase 'ní ìbámu pẹ̀lú rẹ̀ ni a ti ń rú' includes ti.
    rationale: προσφέρονται is present passive ('are offered'). Removing ti yields a more unambiguous ongoing-present rendering in Yoruba, while retaining the governing relation conveyed by καθ’ ἣν.
  revised_text: èyí tí í ṣe àkàwé fún àkókò ìsinsìnyí[a]; ní ìbámu pẹ̀lú èyí ni a ń rú àwọn ọrẹ àti ẹbọ, tí kò lè mú ẹni tó ń jọ́sìn di pípé ní ti ẹ̀rí-ọkàn.
