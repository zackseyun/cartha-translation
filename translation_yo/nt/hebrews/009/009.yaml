id: HEB.9.9
reference: Hebrews 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: yo
  text: èyí tí í ṣe àkàwé fún àkókò ìsinsìnyí[a]; ní ìbámu pẹ̀lú èyí ni a ń rú àwọn ọrẹ àti ẹbọ, tí kò lè mú ẹni tó ń jọ́sìn di pípé ní ti ẹ̀rí-ọkàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àmì” tàbí “àwòrán ìṣàpẹẹrẹ” fún àkókò ìsinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: èyí tí í ṣe
  rationale: Ó so gbólóhùn yìí mọ́ ètò àgọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láì fi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: παραβολὴ
  choice: àkàwé
  rationale: “Àkàwé” pa èrò ìbámu aláwòrán mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún παραβολή; àwọn ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: fún àkókò ìsinsìnyí
  rationale: Ó ṣàfihàn àkókò tó wà lọ́wọ́ nínú ìjíròrò onkọ̀wé, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: καθ’ ἣν
  choice: ní ìbámu pẹ̀lú rẹ̀
  rationale: Ó pa ìbáṣepọ̀ tó wà láàárín àkàwé tàbí ètò náà àti rírú ọrẹ àti ẹbọ mọ́.
- source_word: δῶρά τε καὶ θυσίαι
  choice: àwọn ọrẹ àti ẹbọ
  rationale: Ó dá àwọn ọ̀rọ̀ ìjọsìn méjèèjì dúró gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀, bí τε καὶ ṣe fi wọ́n so pọ̀.
- source_word: προσφέρονται
  choice: a ti ń rú
  rationale: Àmì “ń” fi ìṣe tó ń bá a lọ hàn, “rú” sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún fífi ọrẹ tàbí ẹbọ fún Ọlọ́run.
- source_word: μὴ δυνάμεναι
  choice: tí kò lè
  rationale: Ó sọ àìlèṣe àwọn ọrẹ àti ẹbọ náà ní Yorùbá tó rọrùn, láì yí agbára gbólóhùn náà padà.
- source_word: κατὰ συνείδησιν
  choice: ní ti ẹ̀rí-ọkàn
  rationale: Ó fi hàn pé ibi tí ìmúdi-pípé náà kò dé ni ọ̀ràn ẹ̀rí-ọkàn, kì í ṣe pé ẹni náà kàn ń fi òótọ́ inú jọ́sìn.
- source_word: τελειῶσαι
  choice: mú ... di pípé
  rationale: 'Ó pa ìtumọ̀ pàtàkì τελειόω nínú Hébérù mọ́: mímú ẹni dé ipò tó pé tàbí tó yẹ níwájú Ọlọ́run.'
- source_word: τὸν λατρεύοντα
  choice: ẹni tó ń jọ́sìn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni kan tó ń ṣe iṣẹ́ ìjọsìn.
theological_decisions:
- issue: Ìtumọ̀ παραβολή nínú àyíká ètò ìjọsìn àti ìṣàpẹẹrẹ
  choice: àkàwé
  alternative: àmì tàbí àwòrán ìṣàpẹẹrẹ
  rationale: “Àkàwé” pa fífi ohun kan wé òmíràn àti ìbámu ìṣàpẹẹrẹ náà mọ́, láì dín ọ̀rọ̀ náà kù sí àmì lásán; àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ tó ṣeé ṣe mìíràn mọ́.
- issue: Ìwọ̀n tí τελειῶσαι kan ẹ̀rí-ọkàn
  choice: mú ẹni tó ń jọ́sìn di pípé ní ti ẹ̀rí-ọkàn
  alternative: sọ ẹ̀rí-ọkàn ẹni tó ń jọ́sìn di mímọ́
  rationale: Ìtumọ̀ tí a yàn kò fi “ìwẹ̀nùmọ́” sí ọ̀rọ̀ Gíríìkì, ó sì pa ìdààmú ẹ̀kọ́-ìgbàgbọ́ tó wà nínú “mú di pípé” mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “ọrẹ” àti “ẹbọ” gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìjọsìn ọ̀tọ̀, a sì lo “ẹ̀rí-ọkàn” fún συνείδησις.
