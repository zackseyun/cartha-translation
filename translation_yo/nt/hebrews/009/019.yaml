id: HEB.9.19
reference: Hebrews 9:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: yo
  text: Nítorí nígbà tí Mósè ti sọ gbogbo àṣẹ ní ìbámu pẹ̀lú òfin fún gbogbo àwọn ènìyàn, ó mú ẹ̀jẹ̀ àwọn ọmọ màlúù[a] pẹ̀lú omi, irun àgùntàn pupa àti hísópù, ó sì wọ́n ẹ̀jẹ̀ náà sára àkájọ ìwé náà fúnra rẹ̀ àti sára gbogbo àwọn ènìyàn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn akọ màlúù ọ̀dọ́.” Ọ̀rọ̀ Gíríìkì μόσχων lè túmọ̀ sí àwọn ọmọ màlúù tàbí àwọn akọ màlúù ọ̀dọ́ nínú àyíká ẹbọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Nítorí nígbà tí ... ti sọ gbogbo àṣẹ
  rationale: A ṣe genitive absolute náà bí gbólóhùn àkókò ní Yorùbá. “Gbogbo àṣẹ” pa ipa distributive πάσης mọ́ láì sọ ọ́ di òfin gẹ́gẹ́ bí èrò àpapọ̀.
- source_word: κατὰ τὸν νόμον
  choice: ní ìbámu pẹ̀lú òfin
  rationale: Èyí fi ìtumọ̀ ìbámu tàbí ìṣe ní ìlànà òfin hàn ní Yorùbá àdánidá.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: tí Mósè ti sọ ... fún gbogbo àwọn ènìyàn
  rationale: Ilana gbólóhùn Yorùbá yí passive Gíríìkì padà sí active láì yí ẹni tó ṣe iṣẹ́ tàbí àwọn olùgbọ́ padà.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: ẹ̀jẹ̀ àwọn ọmọ màlúù
  rationale: “Ọmọ màlúù” jẹ́ ìtumọ̀ taara fún μόσχος; ọ̀rọ̀ Gíríìkì tún lè tọ́ka sí akọ màlúù ọ̀dọ́ nínú ọ̀rọ̀ ẹbọ, nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: pẹ̀lú omi, irun àgùntàn aláwọ̀ rírẹ̀dòdò àti hísópù
  rationale: Àyànmọ́ yìí pa gbogbo ohun èlò mẹ́tẹ̀ẹ̀ta mọ́; “irun àgùntàn aláwọ̀ rírẹ̀dòdò” sọ irun àti àwọ̀ scarlet/crimson rẹ̀ ní kedere.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: ara àkájọ ìwé náà fúnra rẹ̀ àti gbogbo àwọn ènìyàn
  rationale: “Àkájọ ìwé” bá irú ohun ìkọ̀wé ayé ìgbàanì mu, “fúnra rẹ̀” sì pa ìtẹnumọ́ αὐτό mọ́; “àti” so àwọn ohun méjèèjì tí a wọ́n pọ̀.
- source_word: ἐράντισεν
  choice: ó sì fi wọ́n ara
  rationale: “Wọ́n ara” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún fífi omi tàbí ẹ̀jẹ̀ tú ká sí orí ohun tàbí ènìyàn nínú ìṣe àṣà.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú ìtàn Ẹ́kísódù 24 àti ìtumọ̀ μόσχων
  choice: A túmọ̀ ọ̀rọ̀ Gíríìkì gẹ́gẹ́ bí ó ṣe wà, a kò sì fi àlàyé láti inú Ẹ́kísódù kún un tàbí mú un bá a mu.
  alternative: A lè lo “àwọn akọ màlúù ọ̀dọ́” nínú ọ̀rọ̀ pàtàkì tàbí ṣàlàyé ẹbọ náà sí i.
  rationale: Hébérù sọ ìtàn náà ní ṣókí ní ọ̀nà tirẹ̀. Ìtumọ̀ kò gbọ́dọ̀ mú ìyàtọ̀ tàbí ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ náà kúrò; àlàyé ìsàlẹ̀ tó ní àṣàyàn lexical tó ṣeé gbèjà tó.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìṣàn ẹsẹ Gíríìkì mọ́, títí kan àmì kọ́mà ní òpin, nítorí ẹsẹ náà ń bá ọ̀rọ̀ tó tẹ̀ lé e lọ.
