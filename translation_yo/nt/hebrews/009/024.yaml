id: HEB.9.24
reference: Hebrews 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: yo
  text: Nítorí Kristi kò wọ àwọn ibi mímọ́ tí ọwọ́ ènìyàn ṣe, gẹ́gẹ́ bí àwòrán àwọn ohun tòótọ́, ṣùgbọ́n ó wọ ọ̀run fúnra rẹ̀, láti fara hàn níwájú Ọlọ́run nísinsìnyí nítorí wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “níwájú ojú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Kristi
  rationale: “Kristi” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún oyè Χριστός; ó jẹ́ kí ìtumọ̀ oyè náà dúró láìsọ ọ́ di orúkọ lásán.
- source_word: χειροποίητα ἅγια
  choice: àwọn ibi mímọ́ tí ọwọ́ ènìyàn ṣe
  rationale: Èyí pa ọ̀pọ̀ ἅγια mọ́, ó sì fi ìyàtọ̀ láàárín ohun tí ènìyàn kọ́ àti ohun ti ọ̀run hàn.
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: àwòrán àwọn ohun tòótọ́
  rationale: “Àwòrán” sọ ìbáṣepọ̀ ohun ayé pẹ̀lú òtítọ́ ti ọ̀run ní èdè Yorùbá tó ṣe kedere, láìdín ἀντίτυπα kù sí ẹ̀dà gangan nìkan.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: ọ̀run fúnra rẹ̀
  rationale: “Fúnra rẹ̀” mú ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì jáde pé Kristi wọ ohun gidi, kì í ṣe àwòrán rẹ̀.
- source_word: ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ
  choice: kí ó lè farahàn níwájú Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìfarahàn ní ojú tàbí níwájú Ọlọ́run, ó sì pa ète ọ̀rọ̀ àìlórúkọ náà mọ́.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ó sọ iṣẹ́ aṣojú Kristi fún wa ní ṣókí, láìfi èrò ẹ̀kọ́ ìràpadà kan tí ẹsẹ̀ náà kò sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ ἅγια nínú èdè ìjọsìn
  choice: àwọn ibi mímọ́
  alternative: ibi mímọ́; ilé mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, nítorí náà ìtumọ̀ náà pa àwòrán agọ́ ìjọsìn àti àìdánilójú nípa yàrá pàtó mọ́.
- issue: Oyè Χριστός
  choice: Kristi
  alternative: Mèsáyà
  rationale: “Kristi” jẹ́ oyè Bíbélì tí ó ti fìdí múlẹ̀ nínú Yorùbá, ó sì bá ìforúkọ oyè Χριστός mu láìyí ẹ̀kọ́ nípa ẹni náà padà.
- issue: Agbára aṣojú ὑπὲρ ἡμῶν
  choice: nítorí wa
  alternative: ní ipò wa; fún wa
  rationale: “Nítorí wa” jẹ́ adayeba, ó sì gba ìtumọ̀ pé ó ṣe èyí fún àǹfààní àti ní ti aṣojú wa láyè, láìfi ìmọ̀ ẹ̀kọ́ tóóró kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. A pa ọ̀pọ̀ “àwọn ibi mímọ́” àti ìtẹnumọ́ “ọ̀run fúnra rẹ̀” mọ́; a sì gbe “nísinsìnyí” sí ibi tó bá ìṣàn gbolohun Yorùbá mu.
