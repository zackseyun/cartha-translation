  to: Nítorí Kristi kò wọ àwọn ibi mímọ́ tí ọwọ́ ènìyàn ṣe, gẹ́gẹ́ bí àwòrán àwọn ohun tòótọ́, ṣùgbọ́n ó wọ ọ̀run fúnra rẹ̀, láti fara hàn níwájú Ọlọ́run nísinsìnyí nítorí wa.[a]
