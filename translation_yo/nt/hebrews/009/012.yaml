id: HEB.9.12
reference: Hebrews 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: yo
  text: Kì í ṣe nípasẹ̀ ẹ̀jẹ̀ àwọn ewúrẹ́ akọ àti àwọn ọmọ màlúù, ṣùgbọ́n nípasẹ̀ ẹ̀jẹ̀ tirẹ̀ gan-an ni ó fi wọ àwọn ibi mímọ́[a] lẹ́ẹ̀kan ṣoṣo, ó sì ti rí ìràpadà ayérayé gbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi ìjọsìn mímọ́.” Gíríìkì náà ní, ní ti gidi, “àwọn ibi mímọ́.” Àwọn ìtumọ̀ mìíràn sọ ọ́ ní pàtó sí i pé “Ibi Mímọ́ Jù Lọ,” ṣùgbọ́n ìyẹn túmọ̀ ọ̀rọ̀ náà ju bí gbólóhùn Gíríìkì fúnra rẹ̀ ṣe béèrè lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Kì í sì í ṣe
  rationale: Ó tẹ̀ síwájú láti inú ìyàtọ̀ ẹsẹ̀ tó ṣáájú, ó sì pa agbára àsopọ̀ ‘àti kì í ṣe’ mọ́ ní Yorùbá àdánidá.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: nípasẹ̀ ẹ̀jẹ̀ àwọn ewúrẹ́ akọ àti àwọn ọmọ màlúù
  rationale: ‘Nípasẹ̀’ fi διά pẹ̀lú ọ̀rọ̀-orúkọ abẹ́ genitive hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; τράγων jẹ́ ewúrẹ́ akọ, μόσχων sì jẹ́ ọmọ màlúù.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: bí kò ṣe nípasẹ̀ ẹ̀jẹ̀ òun fúnra rẹ̀
  rationale: Àtúnlò ‘nípasẹ̀’ pa ìfiwéra διά méjèèjì mọ́, ‘òun fúnra rẹ̀’ sì mú ìtẹnumọ́ ἰδίου jáde.
- source_word: εἰσῆλθεν
  choice: ni ó fi wọ
  rationale: Ó ṣàpèjúwe ìṣe kan tí ó ti ṣẹ lẹ́ẹ̀kan; ìṣètò ‘ni ó fi wọ’ jẹ́ Yorùbá àdánidá nínú gbólóhùn ìtẹnumọ́ yìí.
- source_word: ἐφάπαξ
  choice: lẹ́ẹ̀kan ṣoṣo láéláé
  rationale: Ó fi ìṣe kan ṣoṣo tí kò nílò àtúnṣe hàn, ní ìbámu pẹ̀lú agbára ọ̀rọ̀ náà nínú Hébérù.
- source_word: εἰς τὰ ἅγια
  choice: àwọn ibi mímọ́
  rationale: Èyí pa fọ́ọ̀mù plural τὰ ἅγια mọ́, láì túmọ̀ rẹ̀ ní pàtó sí ‘Ibi Mímọ́ Jù Lọ.’
- source_word: αἰωνίαν λύτρωσιν
  choice: ìràpadà ayérayé
  rationale: Ó túmọ̀ sí ìràpadà tí agbára rẹ̀ dúró títí láé, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bójú mu.
- source_word: εὑράμενος
  choice: nígbà tí ó ti rí … gbà
  rationale: ‘Rí … gbà’ sọ ìtumọ̀ idiomatic ti ‘rí’ gẹ́gẹ́ bí ‘jèrè/ṣe àṣeyọrí láti rí’ jáde, ó sì pa ìbáṣepọ̀ participle náà mọ́ láì fi ẹni tí ìràpadà náà wà fún kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bí Kristi ṣe wọ ibi mímọ́ nípasẹ̀ ẹ̀jẹ̀ tirẹ̀
  choice: A sọ pé ó wọ nípasẹ̀ ẹ̀jẹ̀ òun fúnra rẹ̀, ní ìyàtọ̀ sí ẹ̀jẹ̀ ẹranko.
  alternative: Ó wọ nípa gbígbé tàbí fífi ẹ̀jẹ̀ rẹ̀ hàn ní ọ̀nà ti ara; tàbí pé ó wọ kìkì lẹ́yìn tí ó ta ẹ̀jẹ̀ rẹ̀ sílẹ̀.
  rationale: Àtúnlò διά pẹ̀lú genitive fara mọ́ ìtumọ̀ ọ̀nà/ohun èlò. Ìtumọ̀ náà pa àwòrán ẹbọ mọ́ láì fi àlàyé tó kọjá ohun tí Gíríìkì sọ kún un.
- issue: Ìwọ̀n ìtumọ̀ τὰ ἅγια
  choice: àwọn ibi mímọ́
  alternative: ibi ìjọsìn mímọ́; Ibi Mímọ́ Jù Lọ
  rationale: Ọ̀rọ̀ Gíríìkì wà ní plural, ó sì lè jẹ́ orúkọ àpapọ̀ fún ibi ìjọsìn. ‘Ibi Mímọ́ Jù Lọ’ yóò yan ìtumọ̀ kan ní pàtó ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
- issue: Agbára εὑράμενος àti ẹni tí ìràpadà kan
  choice: nígbà tí ó ti rí ìràpadà ayérayé gbà
  alternative: nígbà tí ó ti pèsè ìràpadà ayérayé fún wa
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ‘fún wa’ ní tààràtà. Ìtumọ̀ tí a yàn pa àìsọ ẹni tí ìràpadà náà wà fún mọ́, láì sẹ́ òye àyíká rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. Ìṣètò ‘Kì í ṣe … bí kò ṣe … ni ó fi …’ jẹ́ àdánidá, ó sì pa ìyàtọ̀ inú Gíríìkì mọ́.
