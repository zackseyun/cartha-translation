  - severity: low
    issue: ‘nígbà tí ó ti rí ... gbà’
    rationale: Ó lè jẹ́ ìbáṣepọ̀ àkókò pàtó (‘when’) tí participle εὑράμενος kò béèrè. Ìsopò ‘ó sì ti rí ... gbà’ dá ìbáṣepọ̀ participial/attendant circumstance náà sílẹ̀ ní ti ara.
  - severity: low
    issue: Ìlò ‘Kì í sì í ṣe’ àti ‘ẹ̀jẹ̀ òun fúnra rẹ̀’
    rationale: Àwọn gbolóhùn wọ̀nyí lóye, ṣùgbọ́n ‘Kì í ṣe’ àti ‘ẹ̀jẹ̀ tirẹ̀ gan-an’ jẹ́ àdánidá, wọ́pọ̀, ó sì ṣì pa ìsopọ̀ àti ìtẹnumọ́ Gíríìkì mọ́.
