review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ διά ... διά mọ́, ó sì tọ́ka dáadáa sí ẹ̀jẹ̀ ewúrẹ́ akọ, ọmọ màlúù, ẹ̀jẹ̀ Kristi fúnra rẹ̀, àti ‘àwọn ibi mímọ́.’ Síbẹ̀, ‘lẹ́ẹ̀kan ṣoṣo láéláé’ lè dà bí ìṣe tí ń bá a lọ títí láé, dípò ìṣe kan tí a ṣe lẹ́ẹ̀kan péré; ‘nígbà tí’ náà lè fi ìbátan àkókò kún participle náà.
  naturalness: ‘Kì í sì í ṣe’ àti ‘ẹ̀jẹ̀ òun fúnra rẹ̀’ kò rọrùn bí Yorùbá boṣewa ti ‘Kì í ṣe’ àti ‘ẹ̀jẹ̀ tirẹ̀ gan-an.’ Ìṣètò ‘ó sì ti rí ìràpadà ayérayé gbà’ jẹ́ ìfihàn tó dára jù lọ fún participle náà nínú gbólóhùn Yorùbá.
  terminology: ‘Ìràpadà ayérayé’ yẹ, ‘àwọn ibi mímọ́’ sì pa plural Gíríìkì mọ́. Àlàyé ẹsẹ̀ ìsàlẹ̀ yẹ kí ó máa sọ pé ‘ibi ìjọsìn mímọ́’ jẹ́ ọ̀nà ìtumọ̀ míràn, láì sọ ‘Ibi Mímọ́ Jù Lọ’ di ìtumọ̀ pàtó.
  issues:
