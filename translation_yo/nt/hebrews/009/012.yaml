revisions:
- from: Kì í sì í ṣe nípasẹ̀ ẹ̀jẹ̀ àwọn ewúrẹ́ akọ àti àwọn ọmọ màlúù, bí kò ṣe nípasẹ̀ ẹ̀jẹ̀ òun fúnra rẹ̀, ni ó fi wọ àwọn ibi mímọ́[a] lẹ́ẹ̀kan ṣoṣo láéláé, nígbà tí ó ti rí ìràpadà ayérayé gbà.
  to: Kì í ṣe nípasẹ̀ ẹ̀jẹ̀ àwọn ewúrẹ́ akọ àti àwọn ọmọ màlúù, ṣùgbọ́n nípasẹ̀ ẹ̀jẹ̀ tirẹ̀ gan-an ni ó fi wọ àwọn ibi mímọ́[a] lẹ́ẹ̀kan ṣoṣo, ó sì ti rí ìràpadà ayérayé gbà.
  rationale: Àtúnṣe náà yọ ‘láéláé’ kúrò láti má ba ἐφάπαξ dà bí ìṣe títílọ, ó sì rọ́pò ìsopò àkókò ‘nígbà tí’ pẹ̀lú ìṣètò Yorùbá tó ń pa ipa participle náà mọ́. A tún mú ọ̀rọ̀ náà rọrùn sí i ní Yorùbá, láì yí ìtumọ̀, ìforígbárí, tàbí àìdánilójú τὰ ἅγια padà.
  reviewer_model: gpt-5.6-terra
