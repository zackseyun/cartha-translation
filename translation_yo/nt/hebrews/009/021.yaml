source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: yo
  text: Bákan náà, ó fi ẹ̀jẹ̀ wọ́n àgọ́ ìjọsìn[a] àti gbogbo ohun èlò iṣẹ́ ìsìn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àgọ́.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘àgọ́,’ ṣùgbọ́n níhìn-ín ó ń tọ́ka sí àgọ́ mímọ́ tí a fi ń sin Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘gbogbo ohun èlò ìsìn.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: àgọ́ ìjọsìn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘àgọ́,’ ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí ó ń tọ́ka sí àgọ́ mímọ́ tí a fi ń sin Ọlọ́run; ‘àgọ́ ìjọsìn’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ibi mímọ́ náà mọ́.
- source_word: σκεύη
  choice: ohun èlò
  rationale: Ó ń tọ́ka sí àwọn ohun tí a ń lò fún iṣẹ́ inú àgọ́; ‘ohun èlò’ jẹ́ ọ̀rọ̀ àdánidá, ó sì gbòòrò tó láti gba oríṣìíríṣìí ohun inú iṣẹ́ náà.
- source_word: λειτουργία
  choice: iṣẹ́ ìsìn
  rationale: Níhìn-ín ó jẹ́ iṣẹ́ ẹ̀sìn tí àwọn àlùfáà ń ṣe; ‘iṣẹ́ ìsìn’ ṣe kedere fún òǹkàwé Yorùbá, láìfi ẹ̀kọ́ ìjọ kan kún un.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ìtọ́kasí tààrà sí ẹ̀jẹ̀ ẹbọ ni ó jẹ́ nínú àyíká àṣà ìwẹ̀nùmọ́ yìí.
- source_word: ὁμοίως
  choice: bákan náà
  rationale: Ó so ìṣe yìí mọ́ fífi ẹ̀jẹ̀ wọ́n ohun tí ẹsẹ tó ṣáájú sọ, ó sì pa agbára ìfiwéra náà mọ́.
- source_word: ἐράντισεν
  choice: ó fi ẹ̀jẹ̀ wọ́n
  rationale: ‘Wọ́n’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún fífi omi tàbí ẹ̀jẹ̀ tú ká sórí ohun kan nínú àṣà ìsìn; fífi ‘ẹ̀jẹ̀’ mọ́ ọn mú ohun tí a fi wọ́n ṣe kedere.
- source_word: δὲ
  choice: náà
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́, kì í ṣe ìtakora; ‘náà’ nínú ‘Bákan náà’ ń bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: πάντα τὰ σκεύη
  choice: gbogbo ohun èlò
  rationale: Èyí pa ìtumọ̀ pé kò sí èyíkéyìí nínú àwọn ohun èlò iṣẹ́ náà tí a yọ sílẹ̀ mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú àkọsílẹ̀ àṣà Mósè nínú Ẹ́kísódù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àkótán tààrà pé ó fi ẹ̀jẹ̀ wọ́n àgọ́ ìjọsìn àti gbogbo ohun èlò iṣẹ́ rẹ̀.
  alternative: Ṣàfikún àlàyé láti mú gbogbo kúlẹ̀kúlẹ̀ rẹ̀ bá àwọn àkọsílẹ̀ inú Ẹ́kísódù mu tàbí láti yanjú ìbéèrè tó lè wáyé.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ jẹ́ àkótán; ìtumọ̀ kò gbọ́dọ̀ fi àlàyé ìbámu tàbí ojútùú sí ìṣòro ìtàn kún ohun tí òǹkọ̀wé sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àgọ́ ìjọsìn’ dípò ọ̀rọ̀ àyálò tí kò wọ́pọ̀, a sì lo ‘iṣẹ́ ìsìn’ láti fi àyíká iṣẹ́ ẹ̀sìn hàn. Àwọn àmì ohùn wà níbi tí ó bá yẹ.
