id: HEB.9.25
reference: Hebrews 9:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: yo
  text: Bẹ́ẹ̀ sì ni kò wọlé kí ó lè máa fi ara rẹ̀ rú ẹbọ ní ọ̀pọ̀ ìgbà, gẹ́gẹ́ bí olórí àlùfáà ti ń wọ inú àwọn ibi mímọ́[a] lọ lọ́dọọdún pẹ̀lú ẹ̀jẹ̀ tí kì í ṣe ti ara rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi ìjọsìn mímọ́.” Èdè Gíríìkì ní “àwọn ibi mímọ́”; àwọn kan lóye rẹ̀ ní pàtó sí i gẹ́gẹ́ bí “Ibi Mímọ́ Jù Lọ” nínú àyíká ìjọsìn yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Kì í sì í ṣe kí ó lè
  rationale: Èyí tẹ̀ síwájú nínú ìṣàn ọ̀rọ̀ tí ń sọ ohun tí kì í ṣe ète ìwọlé Kristi; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbólóhùn ète tí a sẹ́.
- source_word: πολλάκις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ó túmọ̀ sí ‘ọ̀pọ̀ ìgbà’ tààrà, ó sì dúró ní ìyàtọ̀ sí iṣẹ́ ọdọọdún ti olórí àlùfáà.
- source_word: προσφέρῃ ἑαυτόν
  choice: máa fi ara rẹ̀ rú ẹbọ
  rationale: ‘Rú ẹbọ’ pa ìtumọ̀ ìrúbọ mọ́, ‘fi ara rẹ̀’ sì fi agbára arọ́pò-orúkọ ἑαυτόν hàn. ‘Máa’ tún fi ìṣe tí yóò máa ṣẹlẹ̀ léraléra hàn nínú àyíká yìí.
- source_word: ὥσπερ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra pẹ̀lú olórí àlùfáà hàn ní kedere àti ní Yorùbá àdánidá.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó péye, tí ó sì wọ́pọ̀ fún ipò àlùfáà gíga jù lọ nínú ètò ìjọsìn Júù.
- source_word: εἰσέρχεται
  choice: ń wọ inú ... lọ
  rationale: A pa àsìkò ìsinsìnyí tí ń ṣàpèjúwe àṣà tí ó máa ń ṣẹlẹ̀ mọ́.
- source_word: εἰς τὰ ἅγια
  choice: inú àwọn ibi mímọ́
  rationale: A pa ọ̀pọ̀ nǹkan inú èdè Gíríìkì mọ́ láì sọ ọ́ di ‘Ibi Mímọ́ Jù Lọ’ ní pàtó, nítorí ọ̀rọ̀ náà lè tọ́ka sí ibi ìjọsìn mímọ́ lápapọ̀ nínú Hébérù.
- source_word: κατ’ ἐνιαυτὸν
  choice: lọ́dọọdún
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ìṣe tí a ń tún ṣe ní ọdún kọ̀ọ̀kan ní ṣókí àti lọ́nà àdánidá.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: pẹ̀lú ẹ̀jẹ̀ tí kì í ṣe tirẹ̀
  rationale: Èyí pa ìtumọ̀ pé ẹ̀jẹ̀ náà jẹ́ ti ẹlòmíràn mọ́, ó sì mú ìyàtọ̀ sí fífi ara Kristi fúnra rẹ̀ rú ẹbọ hàn.
theological_decisions:
- issue: Ohun tí ìfiwéra Kristi pẹ̀lú olórí àlùfáà ń tọ́ka sí
  choice: A fi fífi ara Kristi rú ẹbọ tí kì í ṣe léraléra wé ìwọlé olórí àlùfáà lọ́dọọdún pẹ̀lú ẹ̀jẹ̀ tí kì í ṣe tirẹ̀.
  alternative: A lè ka ‘àwọn ibi mímọ́’ ní ìtumọ̀ tóóró gẹ́gẹ́ bí Ibi Mímọ́ Jù Lọ.
  rationale: Àyíká Hébérù 9 ń tẹnu mọ́ ìyàtọ̀ láàárín ẹbọ Kristi tí kò nílò àtúnsṣe àti iṣẹ́ ìrúbọ ọdọọdún ti májẹ̀mú àtijọ́. A kò sọ ibi náà di Ibi Mímọ́ Jù Lọ ní pàtó, kí a má bàa yanjú àìdánilójú inú ọ̀rọ̀ Gíríìkì láìnídìí.
translation_notes:
  register: A lo Yorùbá òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Olórí àlùfáà,’ ‘rú ẹbọ,’ àti ‘àwọn ibi mímọ́’ pa èdè ìjọsìn mú láì di ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan. A gbé àmì àlàyé [a] sí ‘àwọn ibi mímọ́,’ ibi tí àlàyé náà jẹ mọ́.
