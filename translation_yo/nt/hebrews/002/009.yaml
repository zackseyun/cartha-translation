id: HEB.2.9
reference: Hebrews 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: yo
  text: Ṣùgbọ́n a rí Jésù, ẹni tí a sọ di ẹni tí ó rẹlẹ̀ ju àwọn áńgẹ́lì lọ fún ìgbà díẹ̀, tí a sì fi ògo àti ọlá dé ládé nítorí ìjìyà ikú, kí ó lè tọ́ ikú wò fún gbogbo ènìyàn láìsí Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kà á pé, “nípasẹ̀ oore-ọ̀fẹ́ Ọlọ́run,” dípò “láìsí Ọlọ́run.”
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: fún ìgbà díẹ̀
  rationale: A mú un ní ìtumọ̀ àkókò, ‘fún ìgbà díẹ̀,’ gẹ́gẹ́ bí àyíká ọ̀rọ̀ àti ìtọ́kasí Sáàmù 8 ṣe ń tọ́ka sí, dípò ìtumọ̀ ìwọ̀n ‘ní ìwọ̀nba díẹ̀.’
- source_word: παρ’ ἀγγέλους ἠλαττωμένον
  choice: a sọ di ẹni tí ó rẹlẹ̀ ju àwọn áńgẹ́lì lọ
  rationale: Ọ̀rọ̀ yìí pa ìfiwéra ‘ju àwọn áńgẹ́lì lọ’ àti ìṣe aláìṣe tí ó ṣẹlẹ̀ sí Jésù mọ́, láì sọ ọ́ di ìrẹ̀wẹ̀sì ọkàn lásán.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: nítorí ìjìyà ikú
  rationale: διά pẹ̀lú ẹ̀sùn-orúkọ níbí ń fi ìdí hàn; gbolohun náà so ìdé ládé Jésù mọ́ ìjìyà ikú rẹ̀.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: a fi ògo àti ọlá dé ládé
  rationale: ‘Dé ládé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àwòrán στεφανόω mọ́, nígbà tí ‘ògo àti ọlá’ dúró fún ohun tí a fi dé e ládé.
- source_word: ὅπως
  choice: kí ó lè
  rationale: Ó fi ète tàbí àbájáde tí a pinnu hàn ní Yorùbá àdánidá.
- source_word: χωρὶς θεοῦ
  choice: láìsí Ọlọ́run
  rationale: Èyí tẹ̀ lé ẹ̀dà SBLGNT tí a pèsè, tí ó kà ‘láìsí/yàtọ̀ sí Ọlọ́run,’ dípò kí a fi àyípadà ‘nípasẹ̀ oore-ọ̀fẹ́ Ọlọ́run’ sínú ọ̀rọ̀ pàtàkì.
- source_word: ὑπὲρ παντός
  choice: fún gbogbo ènìyàn
  rationale: Nínú àyíká yìí, ó ní ìtumọ̀ aṣojú àti pínpín sí olúkúlùkù; ‘fún gbogbo ènìyàn’ jẹ́ Yorùbá tó ṣe kedere, bí ó tilẹ̀ jẹ́ pé παντός lè túmọ̀ sí ‘ohun gbogbo’ ní àwọn àyíká mìíràn.
- source_word: γεύσηται θανάτου
  choice: tọ́ ikú wò
  rationale: A pa àkàwé ‘tọ́ ikú wò’ mọ́; ó tún jẹ́ ọ̀rọ̀ tí òǹkà Yorùbá lè lóye gẹ́gẹ́ bí ríronú ikú ní ìrírí.
theological_decisions:
- issue: Àyípadà ọ̀rọ̀ inú gbólóhùn ète
  choice: láìsí Ọlọ́run
  alternative: nípasẹ̀ oore-ọ̀fẹ́ Ọlọ́run
  rationale: Ẹ̀dà Gíríìkì SBLGNT tí a fún wa ní χωρὶς θεοῦ, ‘láìsí/yàtọ̀ sí Ọlọ́run.’ Àwọn àfọwọ́kọ mìíràn ní χάριτι θεοῦ, ‘nípasẹ̀ oore-ọ̀fẹ́ Ọlọ́run.’ Nítorí pé àyípadà náà ṣe pàtàkì nípa ẹ̀kọ́ ìgbàgbọ́, a tẹ̀ lé orísun tí a yàn nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí èkejì ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà níyì, ó sì ṣe kedere fún òǹkà gbogbogbò. A pa àwòrán ‘dé ládé’ àti ‘tọ́ ikú wò’ mọ́, a sì fi àyípadà àfọwọ́kọ hàn gbangba láìyanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ ní ìkọ̀kọ̀.
