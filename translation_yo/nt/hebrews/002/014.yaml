  source_fidelity: 'Ìtumọ̀ náà mú ẹsẹ̀ Gíríìkì náà jáde dáadáa ní pàtàkì: ìdí-ìyọrísí náà, ìkópa àwọn ọmọ nínú ẹ̀jẹ̀ àti ẹran ara, ìkópa Kristi, ète ikú rẹ̀, àti ìdánimọ̀ ẹni tó ní agbára ikú gẹ́gẹ́ bí èṣù. Síbẹ̀, ọ̀rọ̀ náà nílò ìtúnṣe kékeré fún gírámà àti ìṣàn Yorùbá; ‘ṣe alábápín nínú ohun kan náà’ kò rọrùn tó, ó sì lè máa dà bí ìtumọ̀ títẹ̀lé ọ̀rọ̀ fún ọ̀rọ̀.'
  naturalness: ‘Ó ní ìpín nínú àwọn nǹkan kan náà’ jẹ́ Yorùbá àdánidá ju ‘ṣe alábápín nínú ohun kan náà’ lọ. Pípa ‘lọ́nà tí ó jọra’ kúrò nínú ìtumọ̀ àkọ́kọ́ kò yọ ìtumọ̀ παραπλησίως kúrò, nítorí ‘náà’ nínú àgbékalẹ̀ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ‘likewise’; a sì ṣàlàyé ìfarabalẹ̀ rẹ̀ nínú ìpinnu ọ̀rọ̀. Àmì ìparí ẹsẹ̀ náà yẹ kí ó jẹ́ aami idẹsẹ̀, bí orísun náà ṣe jẹ́ apá gbólóhùn tí ń tẹ̀ síwájú.
  terminology: ‘Ẹ̀jẹ̀ àti ẹran ara’ pa ìtòlẹ́sẹẹsẹ αἵματος καὶ σαρκός mọ́, ó sì yà ‘ẹran ara’ sọ́tọ̀ kúrò nínú ìtumọ̀ ìwà ẹlẹ́ṣẹ̀. ‘Mú ... di aláìlágbára’ jẹ́ ìtumọ̀ tó péye fún καταργήσῃ ní àyíká yìí, láìfi ìparun pátápátá èṣù hàn. ‘Èṣù’ jẹ́ ọ̀rọ̀ ìdánimọ̀ tí ó wọ́pọ̀ fún ὁ διάβολος.
