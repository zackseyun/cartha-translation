  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí àwọn ọmọ náà ti jẹ́ alábápín nínú ẹ̀jẹ̀ àti ẹran ara[a], òun fúnra rẹ̀ náà sì ní ìpín nínú àwọn nǹkan kan náà, kí ó lè, nípasẹ̀ ikú, mú ẹni tí ó ní agbára ikú di aláìlágbára[b]—ìyẹn ni èṣù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ẹran ara àti ẹ̀jẹ̀.” Ní èdè Gíríìkì: “ẹ̀jẹ̀ àti ẹran ara.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pa ... run” tàbí “sọ ... di asán.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí láti sọ ohun kan di aláìlágbára, láti sọ ọ́ di asán, tàbí láti mú un kúrò ní ìṣiṣẹ́; kò fi dandan túmọ̀ sí píparẹ́ rẹ̀ pátápátá.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Nítorí náà, níwọ̀n bí
  rationale: Ó mú ìtumọ̀ ìyọrísí inú οὖν àti ìtumọ̀ ìdí inú ἐπεί jáde ní Yorùbá àdánidá.
- source_word: τὰ παιδία
  choice: àwọn ọmọ náà
  rationale: Ó tọ́ka sí àwọn ọmọ tí àyíká ọ̀rọ̀ ti mẹ́nu kàn láìfi ìtumọ̀ míì kún un.
- source_word: κεκοινώνηκεν
  choice: ti jẹ́ alábápín nínú
  rationale: Ó fi ipò ìkópa tí perfect tense náà ń sọ hàn, ó sì ṣe kedere ní Yorùbá.
- source_word: αἵματος καὶ σαρκός
  choice: ẹ̀jẹ̀ àti ẹran ara
  rationale: Ó pa ìtòlẹ́sẹẹsẹ Gíríìkì, ‘ẹ̀jẹ̀ àti ẹran ara,’ mọ́; ‘ẹran ara’ níbí túmọ̀ sí ara ènìyàn gan-an, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀.
- source_word: παραπλησίως
  choice: lọ́nà tí ó jọra
  rationale: Ó sọ ìjọra tímọ́tímọ́ láìsọ pé gbogbo apá jẹ́ ọ̀kan náà pátápátá.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: ṣe alábápín nínú ohun kan náà
  rationale: Ó pa ìbáṣepọ̀ pẹ̀lú gbólóhùn àkọ́kọ́ mọ́, ṣùgbọ́n kò fi dandan mú kí àwọn ọ̀rọ̀-ìṣe méjèèjì dà bí ọ̀rọ̀ kan náà.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète iṣẹ́ náà hàn ní Yorùbá àdánidá.
- source_word: διὰ τοῦ θανάτου
  choice: nípasẹ̀ ikú
  rationale: Ó fi ikú hàn gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà tí a fi ṣe iṣẹ́ náà.
- source_word: καταργήσῃ
  choice: sọ ... di aláìlágbára
  rationale: Ó mú ìtumọ̀ yíyọ agbára tàbí ìṣiṣẹ́ kúrò jáde láìsọ pé ẹni náà ti ṣíwọ́ láti wà.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: ẹni tí ó ní agbára ikú
  rationale: Ó jẹ́ ìtumọ̀ kedere àti àdánidá fún κράτος nínú àyíká ọ̀rọ̀ yìí.
- source_word: τοῦτ’ ἔστι
  choice: ìyẹn ni
  rationale: Ó ṣàlàyé ẹni tí gbólóhùn tó ṣáájú ń tọ́ka sí.
- source_word: τὸν διάβολον
  choice: èṣù
  rationale: Èyí ni orúkọ Yorùbá tí ó wọ́pọ̀ fún διάβολος gẹ́gẹ́ bí ẹni pàtó nínú Májẹ̀mú Tuntun.
theological_decisions:
- issue: Ìkópa Kristi nínú ẹ̀dá ènìyàn
  choice: “Òun fúnra rẹ̀ pẹ̀lú sì ṣe alábápín nínú ohun kan náà lọ́nà tí ó jọra”
  alternative: “Òun náà pẹ̀lú jẹ́ alábápín nínú ẹ̀dá ènìyàn wọn”
  rationale: Ìtumọ̀ yìí jẹ́wọ́ ìkópa rẹ̀ ní tòótọ́ nínú ẹ̀jẹ̀ àti ẹran ara, ó sì pa àṣàyàn ọ̀rọ̀ παραπλησίως àti ìyàtọ̀ láàárín àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ láìfi àlàyé ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ẹsẹ náà.
- issue: Ìtumọ̀ καταργήσῃ nípa èṣù
  choice: “sọ ... di aláìlágbára”
  alternative: “pa ... run” tàbí “sọ ... di asán”
  rationale: Ó fi yíyọ agbára ìṣiṣẹ́ kúrò hàn, kò sì dámọ̀ràn pé èṣù kò sí mọ́; àṣàyàn ìbílẹ̀ ‘pa run’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìtòlẹ́sẹẹsẹ ‘ẹ̀jẹ̀ àti ẹran ara’ mọ́ láti tẹ̀ lé orísun Gíríìkì, a sì lo ‘lọ́nà tí ó jọra’ láti dáàbò bo àìdánilójú àti ìfarabalẹ̀ Kristológì inú ọ̀rọ̀ náà.
