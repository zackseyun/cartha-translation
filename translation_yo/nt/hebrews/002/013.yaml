id: HEB.2.13
reference: Hebrews 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: yo
  text: Àti lẹ́ẹ̀kan sí i, “Èmi yóò gbẹ́kẹ̀ lé e.”[a] Àti lẹ́ẹ̀kan sí i, “Kíyèsí i, èmi àti àwọn ọmọ tí Ọlọ́run fún mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u ní, “Èmi yóò máa gbẹ́kẹ̀ lé e,” tàbí, “Èmi yóò ní ìgbẹ́kẹ̀lé nínú rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ẹsẹ̀ yìí kò dárúkọ ẹni tí ń sọ̀rọ̀; nínú àyíká rẹ̀, Hébérù lo àwọn ọ̀rọ̀ àyọlò wọ̀nyí fún Ọmọ náà.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Àti lẹ́ẹ̀kan sí i
  rationale: Ó pa ọ̀nà ìṣáájú ọ̀rọ̀ àyọlò náà mọ́ láìfi ọ̀rọ̀-ìṣe bí ‘ó sọ pé’ kún ohun tí Gíríìkì kò sọ.
- source_word: Ἐγὼ
  choice: Èmi
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ mọ́, nítorí ó hàn gbangba nínú Gíríìkì, ó sì mú ohùn ẹni àkọ́kọ́ lágbára.
- source_word: ἔσομαι πεποιθὼς
  choice: Èmi yóò gbẹ́kẹ̀
  rationale: Ìṣọ̀kan ọ̀rọ̀-ìṣe ọjọ́ iwájú àti participle perfect yìí ń fi ìgbẹ́kẹ̀lé tí ó dúró ṣinṣin hàn; ‘yóò gbẹ́kẹ̀’ jẹ́ Yorùbá àdánidá tí ó tún pa ìtọ́ka ọjọ́ iwájú mọ́.
- source_word: ἐπ’ αὐτῷ
  choice: lé e
  rationale: ‘Gbẹ́kẹ̀ lé e’ ni àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìgbẹ́kẹ̀lé sínú ẹnì kan.
- source_word: Ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka àti ìpè fún àfiyèsí mọ́, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ tí ó ní iyì mu.
- source_word: τὰ παιδία
  choice: àwọn ọmọ
  rationale: Ó tọ́ka sí àwọn ọmọ ní ìbáṣepọ̀ pẹ̀lú olùsọ̀rọ̀; ‘àwọn ọmọ’ jẹ́ gbolohun Yorùbá tí ó ṣe kedere láìfi ọjọ́-orí tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: tí Ọlọ́run fún mi
  rationale: Yorùbá ‘tí’ bá àwọn ènìyàn mu láìsí ìṣòro akọ tàbí abo gírámà; ‘Ọlọ́run fún mi’ sì tú aorist ἔδωκεν ní ọ̀nà ṣókí àti àdánidá.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá boṣewa fún θεός nínú àyíká yìí.
theological_decisions:
- issue: Ohùn ẹni tí ń sọ àwọn ọ̀rọ̀ àyọlò àti bí a ṣe lò wọ́n sí Kristi
  choice: A fi àwọn ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ẹni àkọ́kọ́, láìfi ‘Ọmọ náà sọ pé’ tàbí ‘Mèsáyà náà sọ pé’ kún ẹsẹ̀ náà.
  alternative: Kí a fi ‘ó sọ pé’ tàbí orúkọ ẹni tí ń sọ̀rọ̀ kún un.
  rationale: Gíríìkì ní καὶ πάλιν nìkan, kò sì dárúkọ olùsọ̀rọ̀ nínú ẹsẹ̀ yìí. Àyíká Hébérù ló lo àwọn àyọlò náà fún Ọmọ; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí ọ̀rọ̀ ẹsẹ̀ náà fúnra rẹ̀ fi sílẹ̀ fún àyíká.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. ‘Kíyèsí i’ ni a yàn dípò ‘Wò ó’ láti pa ìró ọ̀rọ̀ àyọlò tí ó ga díẹ̀ mọ́; a kò sì gbe ìyàtọ̀ akọ/abo gírámà ti Gíríìkì wọ Yorùbá, nítorí ‘tí’ kò ní ìyàtọ̀ bẹ́ẹ̀.
