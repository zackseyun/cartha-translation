id: HEB.2.15
reference: Hebrews 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: yo
  text: kí ó sì dá gbogbo àwọn tí ìbẹ̀rù ikú ti mú kí wọ́n wà lábẹ́ ìsìnrú ní gbogbo ìgbésí ayé wọn sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a fi wọ́n ṣe ẹrú” tàbí “tí wọ́n wà ní ìdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: dá ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí yíyọ ẹni kúrò nínú ipò tàbí ìdè kan. “Dá ... sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá àwòrán ìsìnrú mu, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: τούτους, ὅσοι
  choice: gbogbo àwọn tí
  rationale: Àkópọ̀ yìí mú ìtumọ̀ ẹgbẹ́ gbogbo ènìyàn tí àpèjúwe tó tẹ̀ lé kàn jáde lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: φόβῳ θανάτου
  choice: ìbẹ̀rù ikú mú kí
  rationale: Dative náà lè fi okùnfà tàbí ohun tó ń darí ipò wọn hàn. Ìṣọ̀kan ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ìbẹ̀rù ikú ló fa ipò náà mọ́.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: ní gbogbo ìgbésí ayé wọn
  rationale: Èyí sọ gbogbo gígùn àkókò tí wọ́n wà láàyè, ní ọ̀nà tí àwọn òǹkàwé Yorùbá òde òní máa lóye nírọ̀rùn.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: wọ́n wà lábẹ́ ìsìnrú
  rationale: “Wà lábẹ́ ìsìnrú” fi ipò ìdè gidi hàn, kì í ṣe pé ó ṣeé ṣe kí wọ́n di ẹrú nìkan. Ó tún yẹra fún ṣíṣàlàyé ẹni tàbí ohun tí wọ́n ń sìn ju bí ẹsẹ náà ṣe sọ lọ.
- source_word: δουλείας
  choice: ìsìnrú
  rationale: “Ìsìnrú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò ẹrú tàbí ìdè, ó sì mú agbára àwòrán Gíríìkì náà dúró.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ète yìí mọ́ gbólóhùn ẹsẹ tó ṣáájú lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Irú ìsìnrú tí δουλείας ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìsìnrú tí ìbẹ̀rù ikú ń fà, láìsọ pé ó jẹ́ ìsìnrú fún ẹni tàbí ohun pàtó.
  alternative: Ìsìnrú fún Èṣù; ìsìnrú fún ẹ̀ṣẹ̀; tàbí ìdè tí ikú àti ẹ̀rù rẹ̀ ń mú bá ènìyàn.
  rationale: Àyíká ẹsẹ 14 mẹ́nu kan Èṣù àti agbára ikú, ṣùgbọ́n ẹsẹ 15 fúnra rẹ̀ kò sọ ẹni tàbí ohun tí ìsìnrú náà jẹ́ sí. Ìtumọ̀ náà pa àìdájú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “dá ... sílẹ̀” àti “wà lábẹ́ ìsìnrú” láti pa àwòrán ìdè mọ́. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
