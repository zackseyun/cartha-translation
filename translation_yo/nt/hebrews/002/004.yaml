language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: yo
  text: nígbà tí Ọlọ́run náà ń fi àwọn àmì, àwọn ìyanu, onírúurú iṣẹ́ agbára[a], àti àwọn ìpín Ẹ̀mí Mímọ́[b], gẹ́gẹ́ bí ìfẹ́ rẹ̀, jẹ́rìí sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “onírúurú agbára” tàbí “onírúurú iṣẹ́ agbára ńlá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfarahàn agbára, àti nínú àyíká yìí, sí àwọn iṣẹ́ àrà ọ̀tọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ìpín” tàbí “àwọn àbájọ Ẹ̀mí Mímọ́.” Ẹsẹ náà kò fi ọ̀rọ̀ náà “ẹ̀bùn” kún un ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: nígbà tí Ọlọ́run pẹ̀lú ń ... jẹ́rìí sí i
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́gbẹ̀ yìí ń fi ìṣe tí ó ń bá ohun tí ẹsẹ tó ṣáájú sọ lọ hàn. “Pẹ̀lú” pa agbára àfikún συν- mọ́, “nígbà tí ... ń” sì mú ìbáṣepọ̀ àkókò rẹ̀ ṣe kedere ní Yorùbá.
- source_word: σημείοις
  choice: fi iṣẹ́ àmì
  rationale: Dátífù náà ń tọ́ka sí ohun èlò tàbí ọ̀nà tí Ọlọ́run fi jẹ́rìí; “fi” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ èyí.
- source_word: τέρασιν
  choice: iṣẹ́ ìyanu
  rationale: Ó bá σημείοις rìn gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ tí ó wọ́pọ̀, ó sì ń tọ́ka sí iṣẹ́ tí ń mú ìyàlẹ́nu àti ẹ̀rù-ọ̀wọ̀ wá.
- source_word: ποικίλαις δυνάμεσιν
  choice: onírúurú iṣẹ́ agbára
  rationale: Ìtumọ̀ yìí pa èrò agbára inú δύναμις mọ́, ó sì yẹ fún àwọn ìṣe agbára àrà ọ̀tọ̀ nínú àyíká yìí, láì dín ìtumọ̀ náà kù sí ọ̀rọ̀ kan ṣoṣo bí “iṣẹ́ ìyanu.”
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni orúkọ àdánidá àti ọ̀wọ̀ fún πνεῦμα ἅγιον ní Yorùbá, tí ó sì tẹ̀lé ìbáṣepọ̀ jenitífù pẹ̀lú μερισμοῖς.
- source_word: μερισμοῖς
  choice: pípín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípín tàbí fífi ìpín fúnni. A kò fi “ẹ̀bùn” kún un nínú ẹsẹ nítorí Gíríìkì kò sọ ọ́ ní tààrà.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: gẹ́gẹ́ bí ìfẹ́ rẹ̀
  rationale: Ó fi ìbámu pẹ̀lú ìfẹ́ ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí hàn; nínú gbólóhùn yìí, Ọlọ́run ni ẹni tí ó ṣeé ṣe jù lọ.
theological_decisions:
- issue: Ẹni tí “rẹ̀” nínú “gẹ́gẹ́ bí ìfẹ́ rẹ̀” ń tọ́ka sí
  choice: Ọlọ́run, ẹni tí ó jẹ́ olùṣe nínú gbólóhùn náà
  alternative: A lè ka a ní ọ̀nà tí kò le koko bí ẹni pé ó tọ́ka sí Ẹ̀mí Mímọ́, ṣùgbọ́n èyí kò lágbára tó ní ìlànà gírámà.
  rationale: Ọlọ́run ni olùṣe tó ń darí ọ̀rọ̀ náà, ó sì ń jẹ́rìí nípasẹ̀ àwọn ohun tí a tò lẹ́sẹẹsẹ. Síbẹ̀, a kò ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ.
- issue: Ìtumọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Nínú àyíká yìí, gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí orúkọ ẹni, kì í ṣe ànímọ́ ẹ̀mí lásán; síbẹ̀ a kò fi àlàyé ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì lè yé òǹkàwé òde òní. A lo “iṣẹ́” pẹ̀lú “àmì/ìyanu/agbára” láti jẹ́ kí àtòjọ náà dun bí Yorùbá àdánidá, nígbà tí a pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́.
