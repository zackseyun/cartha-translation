id: HEB.2.6
reference: Hebrews 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹnì kan ti jẹ́rìí ní ibì kan pé,


    “Kí ni ènìyàn tí ìwọ fi ń rántí rẹ̀,


    tàbí ọmọ ènìyàn[a] tí ìwọ fi ń tọ́jú rẹ̀?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ ènìyàn” níbí jẹ́ àtúnlò ọ̀rọ̀ inú Sáàmù 8:4; níbẹ̀, ó jẹ́ gbólóhùn ewì fún ẹ̀dá ènìyàn. Síbẹ̀, àyíká Hébérù tún ń fi ìjẹ́pàtàkì ọ̀rọ̀ náà nípa Jésù hàn.
    reason: cross_reference
  - marker: b
    text: Tàbí, “tí ìwọ fi ń ṣàbẹ̀wò sí i” tàbí “tí ìwọ fi ń tẹ́jú mọ́ ọn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àníyàn tí a fi hàn nípa ìṣàbẹ̀wò tàbí ìtọ́jú.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: ti jẹ́rìí
  rationale: Ó túmọ̀ sí jíjẹ́rìí tàbí fífi ẹ̀rí múlẹ̀. Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì bá ọ̀nà tí a gbà ń tọ́ka sí ẹ̀rí Ìwé Mímọ́ mu.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn; “Ṣùgbọ́n” bá ìṣàn àríyànjiyàn náà mu.
- source_word: πού τις
  choice: ẹ́nì kan ... ní ibì kan
  rationale: Àpapọ̀ ọ̀rọ̀ méjèèjì túmọ̀ sí ẹni tí a kò dárúkọ ní ibi tí a kò sọ ní pàtó; kò fi hàn pé òǹkọ̀wé kò mọ ibi tí ẹsẹ Ìwé Mímọ́ náà wà.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Kí ni ènìyàn
  rationale: “Ènìyàn” dúró fún ọmọ aráyé ní gbogbogbòò, ó sì pa ẹyọ ọ̀rọ̀ ewì inú Sáàmù mọ́ láì fi akọ tàbí abo kún un.
- source_word: ὅτι μιμνῄσκῃ αὐτοῦ
  choice: tí ìwọ fi ń rántí rẹ̀
  rationale: “Ń rántí” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún pípa ẹnì kan mọ́ lọ́kàn.
- source_word: υἱὸς ἀνθρώπου
  choice: ọmọ ènìyàn
  rationale: Ó pa àwòrán ewì àti ìróhìn Sáàmù 8 mọ́. Nínú Sáàmù, ó jẹ́ ọ̀rọ̀ tó dúró fún ẹ̀dá ènìyàn; àyíká Hébérù tún jẹ́ kí ó ní ìtumọ̀ nípa Jésù.
- source_word: ὅτι ἐπισκέπτῃ αὐτόν
  choice: tí ìwọ fi ń tọ́jú rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí lílọ bẹ ẹnì kan wò, wíwá àlàáfíà rẹ̀, tàbí títọ́jú rẹ̀. “Ń tọ́jú rẹ̀” fi àníyàn onífìfẹ́ tó wà nínú ọ̀rọ̀ náà hàn ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí “ọmọ ènìyàn” sọ ní tààrà pé oyè Mèsáyà ni
  choice: Pa “ọmọ ènìyàn” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ inú Sáàmù, láì sọ ọ́ di oyè Mèsáyà ní pàtó nínú ẹsẹ yìí.
  alternative: Túmọ̀ ọ́ sí “ẹ̀dá ènìyàn” nìkan, tàbí kọ ọ́ lọ́nà tó máa fi hàn gbangba pé oyè kan fún Jésù ni.
  rationale: Nínú Sáàmù 8, gbólóhùn náà jẹ́ àfiwé ewì fún ọmọ aráyé. Àyíká Hébérù fi ẹsẹ náà kan Jésù, ṣùgbọ́n ó yẹ kí ìtumọ̀ pa ìfọ̀rọ̀wérọ̀ láàárín ìtumọ̀ gbogbogbòò fún ènìyàn àti ìmúṣẹ rẹ̀ nínú Jésù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó bá àdánidá mu, a sì ṣètò ọ̀rọ̀ àyọlò náà bí ewì láti pa ìbádọ́gba àwọn ìlà Sáàmù mọ́.
