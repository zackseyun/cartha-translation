  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: yo
  text: Nítorí náà, ó ní láti dà bí àwọn arákùnrin rẹ̀ ní gbogbo ọ̀nà[a], kí ó lè di olórí àlùfáà aláàánú àti olóòótọ́ nínú àwọn ọ̀ràn tó jẹ mọ́ Ọlọ́run, láti ṣe ètùtù fún ẹ̀ṣẹ̀ àwọn ènìyàn náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin rẹ̀.” Gíríìkì ní “àwọn arákùnrin,” ọ̀rọ̀ ìdílé akọ púpọ̀ tí ó lè kó gbogbo ìdílé àwọn onígbàgbọ́ sínú rẹ̀ ní àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: “Ṣe ètùtù” lè ní ìtumọ̀ mímú ìbínú rọ̀ tàbí mímú ẹ̀ṣẹ̀ kúrò; ọ̀rọ̀ Gíríìkì náà kò fi dandan yan ọ̀kan ṣoṣo nínú wọn níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: ὤφειλεν
  choice: ó yẹ kí ó
  rationale: Ó sọ dandan tàbí ojúṣe tó wá látinú ète ìgbàlà Ọlọ́run, láìfi hàn pé a fi ipá òde mú un ṣe é.
- source_word: κατὰ πάντα
  choice: ní gbogbo ọ̀nà
  rationale: Ọ̀rọ̀ Yorùbá yìí ṣe kedere pé ìjọra náà dé gbogbo apá.
- source_word: τοῖς ἀδελφοῖς
  choice: àwọn arákùnrin rẹ̀
  rationale: Ó pa àwòrán ìdílé àti ọ̀rọ̀ akọ púpọ̀ inú Gíríìkì mọ́; àlàyé ìtumọ̀ tó lè kó gbogbo ìdílé àwọn onígbàgbọ́ sínú rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ὁμοιωθῆναι
  choice: kí ó dà bí
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì bá àyíká dídi ènìyàn mu.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐλεήμων
  choice: aláàánú
  rationale: Ó mú ìtumọ̀ àánú àti ìyọ́nú tó yẹ fún iṣẹ́ àlùfáà jáde.
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: Ó sọ ìdúróṣinṣin àti jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé nínú iṣẹ́ rẹ̀.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ipò àlùfáà gíga.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nínú àwọn ọ̀ràn tó jẹ mọ́ Ọlọ́run
  rationale: Ó pa gbólóhùn iṣẹ́ àlùfáà náà mọ́, ṣùgbọ́n ó jẹ́ Yorùbá òde òní tó yé ni.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: láti ṣe ètùtù fún
  rationale: “Ṣe ètùtù” jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún iṣẹ́ àlùfáà lórí ẹ̀ṣẹ̀, láìdín ìtumọ̀ Gíríìkì kù sí ẹ̀kọ́ pàtó kan.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: ẹ̀ṣẹ̀ àwọn ènìyàn náà
  rationale: Ó tọ́ka sí ẹ̀ṣẹ̀ àwọn ènìyàn tí a mẹ́nu kàn gẹ́gẹ́ bí ohun tí iṣẹ́ ètùtù dojú kọ.
theological_decisions:
- issue: Ìtumọ̀ ἱλάσκεσθαι nínú ọ̀rọ̀ ètùtù
  choice: láti ṣe ètùtù fún
  alternative: láti mú ìbínú rọ̀ tàbí láti mú ẹ̀ṣẹ̀ kúrò
  rationale: Ọ̀rọ̀ pàtàkì yìí lè tẹnu mọ́ mímú ìbínú rọ̀ tàbí mímú ẹ̀ṣẹ̀ kúrò. “Ṣe ètùtù” jẹ́ gbólóhùn tó gbòòrò tó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ìtọ́kasí ìdílé nínú ἀδελφοῖς
  choice: àwọn arákùnrin rẹ̀
  alternative: àwọn arákùnrin àti arábìnrin rẹ̀
  rationale: A pa irú ọ̀rọ̀ akọ púpọ̀ inú orísun mọ́ nínú ẹsẹ̀, nígbà tí àlàyé ìsàlẹ̀ sọ pé ó lè ní gbogbo ìdílé àwọn onígbàgbọ́ nínú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọ̀wọ̀, òde òní, ó sì yẹ fún kíkà ní gbangba. A lo “olórí àlùfáà” àti “ṣe ètùtù” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tó mọ́gbọ́n dání, ṣùgbọ́n a yàgò fún èdè ẹ̀kọ́ ìsìn tó le ju.
