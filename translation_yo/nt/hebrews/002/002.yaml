source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: yo
  text: Nítorí bí ọ̀rọ̀ tí a sọ nípasẹ̀ àwọn áńgẹ́lì bá dúró ṣinṣin[a], tí gbogbo ìrékọjá àti àìgbọ́ràn sì gba ìyà tí ó yẹ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe pé èyí ni Òfin, èyí tí àṣà Júù gbà pé a fi fúnni nípasẹ̀ àwọn áńgẹ́lì; wo Ìṣe 7:53 àti Gálátíà 3:19.
    reason: cross_reference
  - marker: b
    text: Tàbí, “ẹ̀san òdodo” tàbí “ìsanpadà tí ó yẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: ọ̀rọ̀ tí a sọ nípasẹ̀ àwọn áńgẹ́lì
  rationale: “Ọ̀rọ̀” níbí túmọ̀ sí iṣẹ́ ìránṣẹ́ Ọlọ́run tí a sọ jáde; “nípasẹ̀” pa ipa διά mọ́ gẹ́gẹ́ bí ọ̀nà tàbí aṣojú láìsọ pé àwọn áńgẹ́lì ni orísun rẹ̀.
- source_word: ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: Ní àyíká Hébérù 2, ó ṣeé ṣe jù pé àwọn ẹ̀dá ọ̀run ni a ń tọ́ka sí, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: ἐγένετο βέβαιος
  choice: dúró ṣinṣin
  rationale: Gbólóhùn yìí fi hàn pé ọ̀rọ̀ náà fìdí múlẹ̀, ó sì ní agbára tí a kò lè fojú kọ; yíyan yìí kò dín un kù sí pé a kàn jẹ́rìí sí òtítọ́ rẹ̀.
- source_word: πᾶσα παράβασις
  choice: gbogbo ìrékọjá
  rationale: “Ìrékọjá” mú àwòrán líla ààlà tàbí rú àṣẹ tí παράβασις ní mọ́, ó sì bá ìtumọ̀ òfin mu.
- source_word: παρακοὴ
  choice: àìgbọ́ràn
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ àìfetí sí ohun tí a sọ, nítorí náà àìgbọ́ràn; ó bá ìrékọjá mu nínú àjọṣe ọ̀rọ̀ náà.
- source_word: ἔλαβεν
  choice: gba
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó pa ìrékọjá àti àìgbọ́ràn mọ́ gẹ́gẹ́ bí ohun tí ó gba ẹ̀san ìdájọ́.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: ìyà tí ó tọ́ sí wọn
  rationale: “Ìyà” sọ agbára ìdájọ́ inú àyíká náà di mímọ̀, “tí ó tọ́ sí wọn” sì pa èrò ìsanpadà tí ó bá ìṣe náà mu mọ́.
theological_decisions:
- issue: Irú “ọ̀rọ̀ tí a sọ nípasẹ̀ àwọn áńgẹ́lì”
  choice: A pa àpèjúwe gbogbogbò náà mọ́ nínú ẹsẹ̀, nígbà tí àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ó tọ́ka sí Òfin.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí “Òfin tí a fi fúnni nípasẹ̀ àwọn áńgẹ́lì.”
  rationale: Àyíká àti àṣà Júù tọ́ka gidigidi sí Òfin Sínáì, ṣùgbọ́n Gíríìkì sọ “ọ̀rọ̀” nìkan. Ìtumọ̀ náà kò fi “Òfin” kún ọ̀rọ̀ pàtàkì, kí ó má bàa yanjú ohun tí ẹsẹ̀ náà fi sílẹ̀ ní àfojúsùn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Dúró ṣinṣin” jẹ́ àdánidá ju ìtumọ̀ líle bí “di ohun tí ó fẹsẹ̀ múlẹ̀” lọ. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá, a sì pa ìbẹ̀rẹ̀ gbólóhùn oníṣ şart “Nítorí bí...” mọ́ nítorí ẹsẹ̀ 3 ni yóò parí ìrònú náà.
