revisions:
- from: Nítorí ó yẹ fún un—ẹni tí ohun gbogbo wà fún, tí ohun gbogbo sì wà nípasẹ̀ rẹ̀—ní mímú àwọn ọmọkùnrin púpọ̀ wọ inú ògo[a], láti mú aṣáájú-ọ̀nà[b] ìgbàlà wọn dé ìpé[c] nípasẹ̀ àwọn ìjìyà.[d]
  to: Nítorí ó yẹ fún un—ẹni tí ohun gbogbo wà fún, tí ohun gbogbo sì wà nípasẹ̀ rẹ̀—ní mímú àwọn ọmọkùnrin púpọ̀ wọ inú ògo[a], láti mú aṣáájú-ọ̀nà[b] ìgbàlà wọn dé ìpípé[c] nípasẹ̀ àwọn ìjìyà.[d]
  rationale: The sole required revision changes ìpé to ìpípé consistently in the text and explanatory notes. This restores the sense of τελειῶσαι as completion/bringing to the appointed goal, without asserting moral deficiency or imposing a disputed syntactical relation on the participle.
