id: HEB.2.10
reference: Hebrews 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: yo
  text: Nítorí ó yẹ fún un—ẹni tí ohun gbogbo wà fún, tí ohun gbogbo sì wà nípasẹ̀ rẹ̀—ní mímú àwọn ọmọkùnrin púpọ̀ wọ inú ògo[a], láti mú aṣáájú-ọ̀nà[b] ìgbàlà wọn dé ìpípé[c] nípasẹ̀ àwọn ìjìyà.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn ọmọkùnrin púpọ̀” pa ọ̀rọ̀ Gíríìkì àti ìtẹnumọ́ rẹ̀ lórí ipò ọmọ àti ogún mọ́; gbogbo àwọn ọmọ Ọlọ́run ni gbólóhùn náà kàn, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “olùdásílẹ̀,” “adárí,” tàbí “olùpilẹ̀ṣẹ̀” ìgbàlà wọn.
    reason: lexical_alternative
  - marker: c
    text: “Mú ... dé ìpípé” níbí túmọ̀ sí mímú un dé àfojúsùn tàbí ìparí tí a pinnu nípasẹ̀ ìjìyà; kò túmọ̀ sí àtúnṣe àbùkù ìwà kan.
    reason: lexical_alternative
  - marker: d
    text: 'A tún lè ṣètò ìtumọ̀ ìsopọ̀ náà pé: “láti mú aṣáájú-ọ̀nà ìgbàlà wọn dé ìpípé nípasẹ̀ àwọn ìjìyà, kí ó lè mú àwọn ọmọkùnrin púpọ̀ wọ inú ògo.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: Nítorí ó yẹ fún un
  rationale: Èyí sọ ìbójúmu ohun tí Ọlọ́run ṣe, ó sì pa ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi ‘Ọlọ́run’ kún ọ̀rọ̀ náà ní tààràtà.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: ẹni tí ohun gbogbo wà fún, tí ohun gbogbo sì wà nípasẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí pa ìyàtọ̀ tó wà láàárín ẹni tí ohun gbogbo ń lọ sí gẹ́gẹ́ bí ète àti ẹni tí ohun gbogbo wà nípasẹ̀ rẹ̀ gẹ́gẹ́ bí olùṣe mọ́.
- source_word: πολλοὺς υἱοὺς
  choice: àwọn ọmọkùnrin púpọ̀
  rationale: Ó pa àwòrán ọmọkùnrin àti ogún tó wà nínú υἱούς mọ́; àlàyé ìsàlẹ̀ ojú ewé jẹ́ kó ṣe kedere pé gbogbo àwọn ọmọ Ọlọ́run ló kàn.
- source_word: εἰς δόξαν
  choice: wọ inú ògo
  rationale: Ó fi ìṣípòpadà sí ibi tàbí ipò ògo tí εἰς ń tọ́ka sí hàn.
- source_word: ἀγαγόντα
  choice: ní mímú
  rationale: Ó pa ìsopọ̀ participle náà mọ́ pẹ̀lú ‘láti mú ... dé ìpé’ láì sọ ọ́ di gbólóhùn ète ní dandan.
- source_word: ἀρχηγὸν
  choice: aṣáájú-ọ̀nà
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ẹni tó kọ́kọ́ ṣí ọ̀nà tí ó sì ń darí àwọn ẹlòmíràn gba ọ̀nà náà pọ̀.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: ìgbàlà wọn
  rationale: Èyí jẹ́ ìtumọ̀ genitive náà ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: τελειῶσαι
  choice: láti mú ... dé ìpé
  rationale: Ó túmọ̀ sí mímú ẹni dé ibi àfojúsùn tàbí ìparí iṣẹ́ tí a yàn fún un, kì í ṣe ṣíṣe àtúnṣe àìpé ìwà.
- source_word: διὰ παθημάτων
  choice: nípasẹ̀ àwọn ìjìyà
  rationale: Ọ̀pọ̀ nǹkan tí a jìyà ni Gíríìkì tọ́ka sí; ‘àwọn ìjìyà’ pa ọ̀pọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ τελειῶσαι nípa Ọmọ náà
  choice: láti mú ... dé ìpé
  alternative: láti sọ ... di pípé
  rationale: ‘Dé ìpé’ fi hàn pé a mú un dé àfojúsùn iṣẹ́ rẹ̀ nípasẹ̀ ìjìyà; kò túmọ̀ sí pé àbùkù ìwà kan wà lára rẹ̀ tí a ní láti tún ṣe.
- issue: Bí a ṣe túmọ̀ πολλοὺς υἱοὺς
  choice: àwọn ọmọkùnrin púpọ̀
  alternative: ọ̀pọ̀ àwọn ọmọ
  rationale: A pa ọ̀rọ̀ akọ àti ìtumọ̀ ipò ọmọ tó ní ẹ̀tọ́ ogún mọ́, ṣùgbọ́n àlàyé fi hàn pé kì í ṣe àwọn ọkùnrin nìkan ni ọ̀rọ̀ náà kàn.
- issue: Ìbáṣepọ̀ ἀγαγόντα pẹ̀lú τελειῶσαι
  choice: ní mímú ... wọ inú ògo, láti mú ... dé ìpé
  alternative: láti mú ... dé ìpé ... kí ó lè mú ... wọ inú ògo
  rationale: Ètò àkọ́kọ́ tẹ̀lé ìsopọ̀ participle Gíríìkì, kò sì sọ ìbáṣepọ̀ rẹ̀ di ète nìkan; àlàyé fi ọ̀nà míràn tí a lè gbà lóye ìsopọ̀ náà sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. Àmì ohùn kún inú ọ̀rọ̀ níbi tó bá jẹ́ àdánidá. Àkójọpọ̀ ‘ní mímú ... láti mú ...’ mọ ìṣètò àti ìdọ̀gba Gíríìkì mọ́ bó tilẹ̀ jẹ́ pé ó ní ìwòye lítíréṣọ̀ díẹ̀; àwọn àlàyé ṣàlàyé àwọn ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lè yọrí sí àìgbọ́ra-ẹni-yé.
