  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: yo
  text: Nítorí pé òun fúnra rẹ̀ jìyà nígbà tí a dán an wò,[a] ó lè ran àwọn tí a ń dán wò lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “nígbà tí a fi ìdẹwò dán an wò”; bákan náà ní apá kejì: “àwọn tí a ń fi ìdẹwò dán wò.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “dán wò” tàbí “fi ìdẹwò dán wò,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: nítorí pé
  rationale: Àpólà yìí ní agbára ìdí níbí, ó sì ṣàlàyé ìpìlẹ̀ agbára Kristi láti ran àwọn ẹlòmíràn lọ́wọ́.
- source_word: γὰρ
  choice: nítorí pé
  rationale: γὰρ ń so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àlàyé. Yorùbá kò nílò kí a tún àmì ìdí méjì sọ lọ́tọ̀; ‘nítorí pé’ gbé agbára ἐν ᾧ γὰρ jáde lọ́nà àdánidá.
- source_word: πέπονθεν
  choice: jìyà
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìrírí ìjìyà tí ó ti ṣẹlẹ̀, tí ìtumọ̀ rẹ̀ sì ṣì wúlò fún agbára rẹ̀ láti ṣèrànwọ́.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: 'Èyí pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́: òun fúnra rẹ̀ ló ní ìrírí náà.'
- source_word: πειρασθείς
  choice: nígbà tí a dán an wò
  rationale: πειράζω lè túmọ̀ sí dídán ẹnì kan wò tàbí fífi ìdẹwò bá a. ‘Dán ... wò’ jẹ́ ọ̀rọ̀ Yorùbá tó lè gba ìṣòro ìtumọ̀ méjèèjì láàyè, láì sọ pé Jesu tẹ̀ sí ẹ̀ṣẹ̀.
- source_word: δύναται
  choice: ó lè
  rationale: Èyí sọ agbára tàbí àǹfààní rẹ̀ láti ṣe ìrànlọ́wọ́ ní Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: τοῖς πειραζομένοις
  choice: àwọn tí a ń dán wò
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ nínú participle Gíríìkì ni ‘a ń’ pa mọ́, ó sì fi hàn pé ìdánwò náà ń ṣẹlẹ̀ sí wọn.
- source_word: βοηθῆσαι
  choice: ran ... lọ́wọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ṣíṣe ìrànwọ́ tàbí wíwá sí ìrànlọ́wọ́ ẹni.
theological_decisions:
- issue: Ìtumọ̀ πειράζω nípa Jesu àti àwọn ènìyàn
  choice: dán ... wò
  alternative: dẹ ... wò / fi ìdẹwò bá
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìdánwò tàbí ìdẹwò. Ọ̀rọ̀ inú ẹsẹ̀ kò sọ pé Jesu tẹ̀ sí ẹ̀ṣẹ̀; ó tẹnumọ́ pé ó ní ìrírí ìjìyà náà, nítorí náà ó lè ṣèrànwọ́. A pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ mọ́; ‘a ń dán wò’ sì pa bí ìṣe náà ṣe ń lọ lọ́wọ́ mọ́. A ṣọ́ra láti má ṣe fi ẹ̀kọ́ ẹ̀sìn kan tí ẹsẹ̀ náà kò sọ kún un.
