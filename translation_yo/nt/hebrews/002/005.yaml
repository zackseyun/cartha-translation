source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: yo
  text: Nítorí kò fi ayé tí ń bọ̀ sábẹ́ ìṣàkóso àwọn áńgẹ́lì[a], èyí tí à ń sọ̀rọ̀ nípa rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilẹ̀ ayé tí ènìyàn ń gbé, tí ó ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Nítorí kì í ṣe
  rationale: “Nítorí” mú ìtumọ̀ ìṣàlàyé γάρ wá, “kì í ṣe” sì tako gbólóhùn náà ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀγγέλοις
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká Hébérù, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: ὑπέταξεν
  choice: fi ... sí sábẹ́
  rationale: Àṣàyàn yìí pa ìtumọ̀ fífi ohun kan sábẹ́ àṣẹ tàbí ìṣàkóso mọ́, ó sì jẹ́ ọ̀nà tí ó ṣe àdánidá ní Yorùbá.
- source_word: τὴν οἰκουμένην
  choice: ayé
  rationale: “Ayé” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ilẹ̀ ayé tí a ń gbé tàbí ètò ayé; àfikún “tí ń bọ̀” mú ìtọ́kasí ọjọ́ iwájú rẹ̀ hàn.
- source_word: τὴν μέλλουσαν
  choice: tí ń bọ̀
  rationale: Ó fi ọjọ́ iwájú tí μέλλουσαν ń tọ́ka sí hàn láì pinnu ní pàtó bí ayé tàbí ètò ayé náà yóò ṣe rí.
- source_word: περὶ ἧς λαλοῦμεν
  choice: èyí tí à ń sọ̀rọ̀ nípa rẹ̀
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ nínú λαλοῦμεν mọ́, ó sì mọ́gbọ́n dání ní Yorùbá òde òní.
theological_decisions:
- issue: Ohun tí “ayé tí ń bọ̀” ń tọ́ka sí
  choice: Ayé tàbí ètò ayé ọjọ́ iwájú
  alternative: Ilẹ̀ ayé tí a ń gbé lápapọ̀, tàbí àkókò ìhìn rere ní pàtó
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν tọ́ka sí ayé tàbí ètò ayé tí ń bọ̀. A kò fi àlàyé kún un láti pinnu ju ohun tí Gíríìkì sọ lọ, nítorí àyíká náà ń jíròrò ìṣàkóso ní ìbáṣepọ̀ pẹ̀lú ènìyàn, Ọmọ, àti àwọn áńgẹ́lì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àtòjọ “kì í ṣe sábẹ́ ... ni ó fi ... sí” tẹnumọ́ ohun tí a kò fi ayé náà sábẹ́ rẹ̀, gẹ́gẹ́ bí Gíríìkì ṣe gbé ἀγγέλοις sí iwájú.
