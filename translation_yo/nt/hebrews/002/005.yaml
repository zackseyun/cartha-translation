  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú nǹkan pàtàkì inú Gíríìkì wá: ìsopọ̀ ìṣàlàyé ti γάρ, ìkọ̀ Ọlọ́run sí fífi ayé ọjọ́ iwájú sábẹ́ àṣẹ àwọn áńgẹ́lì, àti ìtọ́kasí sí ohun tí òǹkọ̀wé ń sọ̀rọ̀ lé lórí. Ṣùgbọ́n ìlò “kì í ṣe” ń fi ìṣe àṣà tàbí ohun tí ń ṣẹlẹ̀ lọ́wọ́ hàn, níbi tí ὑπέταξεν jẹ́ ìṣe tí ó pé; “kò fi” dáa jù. Àtòjọ gbolohun “kì í ṣe sábẹ́ àwọn áńgẹ́lì ni ó fi ayé ... sí” kò sì rọrùn ní Yorùbá.'
  naturalness: 'Àtúnṣe náà lo ọ̀nà Yorùbá òde òní tí ó mọ́: “kò fi ... sábẹ́ ìṣàkóso ...” Èyí sọ ìtumọ̀ ìṣàkóso inú ὑποτάσσω di mímọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn. “èyí tí à ń sọ̀rọ̀ nípa rẹ̀” pa ìṣe tí ń lọ lọ́wọ́ mọ́.'
  terminology: “Àwọn áńgẹ́lì” yẹ fún ἀγγέλοις nínú àyíká Hébérù. “Ayé tí ń bọ̀” dá ìtumọ̀ τὴν οἰκουμένην τὴν μέλλουσαν dúró, láì pinnu bóyá ayé náà jẹ́ ètò ayé tàbí ilẹ̀ ayé nìkan. Àlàyé abẹ́lẹ̀ náà ti tún ṣe kí “ilẹ̀ ayé tí ènìyàn ń gbé” hàn kedere gẹ́gẹ́ bí àṣàyàn fún οἰκουμένη.
  issues:
