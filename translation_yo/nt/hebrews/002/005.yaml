  to: Nítorí kò fi ayé tí ń bọ̀ sábẹ́ ìṣàkóso àwọn áńgẹ́lì[a], èyí tí à ń sọ̀rọ̀ nípa rẹ̀.
  rationale: A rọ́pò ìkọ̀ habitual “kì í ṣe” pẹ̀lú ìkọ̀ perfective “kò,” a sì tún gbolohun náà ṣe kí ó jẹ́ Yorùbá tí ó rọrùn, nígbà tí a pa ìtumọ̀ ìṣàkóso ti ὑπέταξεν mọ́ nípa “sábẹ́ ìṣàkóso.” A kò yí àìdájú tó wà nínú “ayé tí ń bọ̀” padà. Àmì ẹsẹ̀ a ti pa mọ́, a sì ti mú ọ̀rọ̀ àṣàyàn inú rẹ̀ ṣe kedere.
