    issue: “kì í ṣe”
    rationale: Ìrísí ìkọ̀ yìí sábà ń tọ́ka sí ìṣe àṣà tàbí ìṣe tí ń lọ lọwọlọwọ; Gíríìkì ὑπέταξεν jẹ́ aorist, nítorí náà “kò fi” bá ìṣe tí ó pé mu dáadáa.
  - severity: medium
    issue: Àgbékalẹ̀ “kì í ṣe sábẹ́ àwọn áńgẹ́lì ni ó fi ayé ... sí”
    rationale: Àgbékalẹ̀ náà jẹ́ aláìrọrùn, ó sì yà “fi” kúrò nínú àfikún rẹ̀ ní ọ̀nà tí kò rọrùn fún kíkà gbangba. “Kò fi ayé ... sábẹ́ ìṣàkóso àwọn áńgẹ́lì” jẹ́ mímọ́ àti àdánidá.
  - severity: low
    issue: Àlàyé abẹ́lẹ̀ “ilẹ̀ ayé tí a ń gbé tí ń bọ̀”
