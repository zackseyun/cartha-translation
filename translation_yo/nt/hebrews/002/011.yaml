id: HEB.2.11
reference: Hebrews 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: yo
  text: Nítorí ẹni tí ń sọni di mímọ́ àti àwọn tí a ń sọ di mímọ́, gbogbo wọn wá láti ọ̀dọ̀ ọ̀kan[a]. Nítorí ìdí èyí, kò tijú láti pè wọ́n ní arákùnrin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘láti ọ̀dọ̀ Baba kan,’ ‘láti orísun kan,’ tàbí ‘láti ọ̀dọ̀ baba ńlá kan.’ Gíríìkì kò sọ ẹni tàbí ohun tí ‘ọ̀kan’ ń tọ́ka sí ní pàtó.
    reason: alternative_reading
  - marker: b
    text: ‘Arákùnrin’ túmọ̀ ἀδελφοὺς, orúkọ akọ ní ọ̀pọ̀ nínú Gíríìkì; nínú àyíká yìí, ó lè tọ́ka sí gbogbo ìdílé àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: ẹni tí ń sọni di mímọ́
  rationale: Ọ̀rọ̀ ìṣe alábápín onísinsin yìí ń ṣiṣẹ́ bí orúkọ. Gbólóhùn náà jẹ́ èdè Yorùbá àdánidá, ó sì fi hàn pé ẹni náà ni ó ń mú àwọn ẹlòmíràn di mímọ́.
- source_word: οἱ ἁγιαζόμενοι
  choice: àwọn tí a ń sọ di mímọ́
  rationale: Ọ̀rọ̀ ìṣe alábápín onísinsin ní ohùn àìṣe fi ìṣe tí ń lọ lọ́wọ́ tàbí ipò tí a ń wò bí ohun tó ń tẹ̀ síwájú hàn; àṣàyàn yìí tún pa ìbámu ọ̀rọ̀ mọ́ pẹ̀lú ἁγιάζω.
- source_word: ἐξ ἑνὸς
  choice: láti ọ̀dọ̀ ẹni kan náà
  rationale: Gíríìkì kò sọ ẹni tí ‘ọ̀kan’ ń tọ́ka sí. Èyí pa àìdánilójú náà mọ́, láìfi ‘Baba,’ baba ńlá kan, tàbí orísun kan kún un.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tẹnumọ́ pé ẹni tí ń sọni di mímọ́ àti àwọn tí a ń sọ di mímọ́ ni a kó sínú ọ̀rọ̀ náà.
- source_word: δι’ ἣν αἰτίαν
  choice: Nítorí ìdí èyí
  rationale: Àpólà yìí ṣàfihàn àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì ṣe kedere ní Yorùbá.
- source_word: οὐκ ἐπαισχύνεται
  choice: ojú kò tì í
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò tijú, ó sì pa ìtumọ̀ ọlá àti ìtìjú inú ọ̀rọ̀ náà mọ́.
- source_word: ἀδελφοὺς
  choice: arákùnrin
  rationale: A pa orúkọ akọ ní ọ̀pọ̀ Gíríìkì mọ́. Ní Yorùbá, ‘arákùnrin’ lẹ́yìn ‘wọ́n’ lè dúró fún ẹgbẹ́ àwọn arákùnrin; àlàyé ìsàlẹ̀ sọ pé ó lè kan gbogbo ìdílé àwọn onígbàgbọ́.
- source_word: καλεῖν
  choice: láti pè
  rationale: Èyí ni ìtumọ̀ àdánidá jù lọ fún infinitive náà lẹ́yìn ọ̀rọ̀ pé ojú kò tì í.
theological_decisions:
- issue: Ẹni tí ó jẹ́ olùṣe tí a kò tún dárúkọ, àti ohun tí ‘láti ọ̀dọ̀ ẹni kan náà’ ń tọ́ka sí
  choice: Àyíká ọ̀rọ̀ fi hàn pé Ọmọ náà ni ẹni tí ń sọni di mímọ́, ṣùgbọ́n a kò sọ orúkọ rẹ̀ sí ẹsẹ yìí; ‘láti ọ̀dọ̀ ẹni kan náà’ sì wà láìṣe pàtó bí ó ti rí ní Gíríìkì.
  alternative: ‘láti ọ̀dọ̀ Baba kan náà,’ ‘láti orísun kan náà,’ tàbí ‘láti ọ̀dọ̀ baba ńlá kan náà’
  rationale: Àyíká tó sún mọ́ ọn dá ẹni tí ń sọni di mímọ́ mọ̀ gẹ́gẹ́ bí Ọmọ/Jésù. Síbẹ̀, ἐξ ἑνὸς kò sọ bóyá ‘ọ̀kan’ náà ni Ọlọ́run, Ádámù, Ábúráhámù, tàbí ìpilẹ̀ ènìyàn kan náà; nítorí náà, a kò yanju àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà nínú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘sọni di mímọ́’ láti jẹ́ kí ìtumọ̀ ἁγιάζω yé òǹkàwé lójoojúmọ́, a sì pa àìdánilójú ἐξ ἑνὸς mọ́.
