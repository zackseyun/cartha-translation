id: HEB.2.8
reference: Hebrews 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: yo
  text: “Ìwọ fi ohun gbogbo sábẹ́ ẹsẹ̀ rẹ̀.” Nítorí nínú fífi ohun gbogbo sábẹ́ rẹ̀[a], kò fi ohunkóhun sílẹ̀ tí kò wà lábẹ́ rẹ̀.[b] Ṣùgbọ́n ní báyìí, a kò tíì rí ohun gbogbo tí a fi sábẹ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ arọ́pò-orúkọ “rẹ̀” ń mú Sáàmù 8 wá sí ìrántí. Nínú àyíká ọ̀rọ̀, ó lè tọ́ka sí ènìyàn gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ Sáàmù náà, àti sí Jésù gẹ́gẹ́ bí Hébérù ṣe fi í lò.
    reason: cross_reference
  - marker: b
    text: Tàbí, “Nítorí nígbà tí ó fi ohun gbogbo sábẹ́ rẹ̀.” Ìkọ̀wé Gíríìkì náà tún lè ní ìtumọ̀ tó dá lórí àkókò báyìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ tó gbòòrò, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi gbogbo ohun tí ọ̀rọ̀ náà kàn hàn.
- source_word: ὑπέταξας
  choice: Ìwọ fi ... sábẹ́
  rationale: Ó pa àwòrán ìṣàkóso àti fífi ohun sábẹ́ ẹlòmíràn mọ́, ó sì bá ọ̀rọ̀ inú Sáàmù 8 mu.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: sábẹ́ ẹsẹ̀ rẹ̀
  rationale: Èyí ni gbólóhùn Yorùbá tó ṣe kedere, tó sì pa àwòrán ìṣàkóso inú ìtọ́kasí Ìwé Mímọ́ náà mọ́.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: ní fífi ... sábẹ́
  rationale: Ó pa ìbáṣepọ̀ ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì mọ́ láìdá ìtumọ̀ àkókò rẹ̀ dúró gẹ́gẹ́ bí èyí kan ṣoṣo.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ṣàlàyé ohun tí àyọlò tó ṣáájú túmọ̀ sí nínú ìjiyàn onkọ̀wé.
- source_word: οὐδὲν ἀφῆκεν
  choice: kò fi ohunkóhun sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá fún gbólóhùn náà, ó sì tẹnumọ́ pé kò sí ohun tí a yọ sílẹ̀.
- source_word: ἀνυπότακτον
  choice: láìsí sábẹ́ rẹ̀
  rationale: Ó ṣe kedere ní Yorùbá, ó sì pa ìsopọ̀ pẹ̀lú gbòǹgbò ọ̀rọ̀ ‘fi ... sábẹ́’ mọ́.
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó fi ìyàtọ̀ hàn láàárín ìkéde Sáàmù àti ohun tí a rí ní àkókò yìí.
- source_word: οὔπω ὁρῶμεν
  choice: a kò tíì rí
  rationale: Ó fi ipò ‘kò tíì ṣẹ ní kíkún ní ojú wa’ hàn ní Yorùbá àdánidá.
- source_word: ὑποτεταγμένα
  choice: tí a fi sábẹ́ rẹ̀
  rationale: Ó sọ ipò tí ìṣe fífi sábẹ́ ti mú wá, ó sì tún ọ̀rọ̀ pàtàkì inú ẹsẹ náà ṣe.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ αὐτοῦ / αὐτῷ ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘rẹ̀’ láìsọ ẹni náà ní pàtó nínú ẹsẹ.
  alternative: Àwọn ènìyàn ní ìtumọ̀ àkọ́kọ́ Sáàmù 8, tàbí Jésù Ọmọ náà nínú bí Hébérù ṣe lo Sáàmù náà.
  rationale: Ọ̀rọ̀ náà ń ṣàlàyé Sáàmù 8, níbi tí ènìyàn ti jẹ́ ẹni tí ọ̀rọ̀ náà kọ́kọ́ ń tọ́ka sí, ṣùgbọ́n àyíká Hébérù ń mú un ṣẹ lórí Jésù. Pípa ọ̀rọ̀ arọ́pò-orúkọ mọ́ ń jẹ́ kí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí dúró láìfi ìtumọ̀ kan ṣoṣo múlẹ̀.
translation_notes:
  register: Yorùbá ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘fi ... sábẹ́’ léraléra láti pa ìṣọ̀kan gbòǹgbò ọ̀rọ̀ ὑποτάσσω mọ́; a sì yà ‘Ìwọ’ síta nítorí ó wà ní kedere nínú fọ́ọ̀mù ọ̀rọ̀-ìṣe Gíríìkì àti nínú àyọlò Sáàmù.
