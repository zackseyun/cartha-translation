  naturalness: “Fi ... sábẹ́” jẹ́ èdè tó mọ́gbọ́n dání fún ìsàlẹ̀ ẹsẹ̀ àti ìtẹríba. Àmọ́ “kò fi ohunkóhun sílẹ̀ láìsí sábẹ́ rẹ̀” kò rọrùn, kò sì pé ní gírámà. “Kò fi ohunkóhun sílẹ̀ tí kò wà lábẹ́ rẹ̀” jẹ́ kedere, ó sì ń mú ìtumọ̀ náà wá.
