id: HEB.2.12
reference: Hebrews 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: yo
  text: ó ń wí pé, “Èmi yóò kéde orúkọ rẹ fún àwọn arákùnrin mi[a]; ní àárín àpéjọ[b] ni èmi yóò fi orin yin ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin mi.” Ọ̀rọ̀ Gíríìkì sọ pé “àwọn arákùnrin,” ṣùgbọ́n nínú àyíká yìí ọ̀rọ̀ ẹbí náà lè kan gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ó ń wí pé
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí yìí ń ṣàgbékalẹ̀ ọ̀rọ̀ tí a fa yọ; ‘ó ń wí pé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti so ọ̀rọ̀ náà mọ́ àyíká rẹ̀.
- source_word: Ἀπαγγελῶ
  choice: Èmi yóò kéde
  rationale: ‘Kéde’ pa agbára ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìpolongo tàbí ìsọfúnni ní gbangba; fífi ‘Èmi’ síwájú tún bá ìtẹnumọ́ inú orin mu.
- source_word: τὸ ὄνομά σου
  choice: orúkọ rẹ
  rationale: A pa ‘orúkọ’ mọ́ ní tààrà, láìfẹ̀ sí i sí ìwà, òkìkí, tàbí ìdánimọ̀, bí ó tilẹ̀ jẹ́ pé ó lè ru àwọn ìtumọ̀ wọ̀nyẹn nínú ọ̀rọ̀ Bíbélì.
- source_word: τοῖς ἀδελφοῖς μου
  choice: fún àwọn arákùnrin mi
  rationale: ‘Àwọn arákùnrin mi’ pa irú akọ ọ̀pọ̀ inú Gíríìkì mọ́. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ ẹbí náà lè kan àwọn arábìnrin onígbàgbọ́ pẹ̀lú.
- source_word: ἐν μέσῳ
  choice: ní àárín
  rationale: Èyí pa àwòrán ẹni tó wà láàárín àwọn ènìyàn tó péjọ mọ́, ó sì bá ìgbéga ewì inú àyọlò náà mu.
- source_word: ἐκκλησίας
  choice: àpéjọ
  rationale: Nínú àyọlò Sáàmù yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn tí wọ́n péjọ. ‘Àpéjọ’ yẹra fún fífi ìtumọ̀ ilé-iṣẹ́ ìjọ ti àkókò tó tẹ̀ lé e sínú ọ̀rọ̀ náà.
- source_word: ὑμνήσω
  choice: èmi yóò fi orin yin
  rationale: Gbólóhùn yìí sọ ní kedere pé ìyìn náà jẹ́ èyí tí a kọ ní orin, ó sì jẹ́ Yorùbá àdánidá.
- source_word: σε
  choice: ọ
  rationale: Arọ́pò-orúkọ yìí jẹ́ ẹni tí orin ìyìn náà dojú kọ; ‘yin ọ’ jẹ́ ìṣọ̀kan ọ̀rọ̀ tó bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοῖς gẹ́gẹ́ bí ọ̀rọ̀ ẹbí tó lè dúró fún gbogbo ẹgbẹ́
  choice: àwọn arákùnrin mi
  alternative: àwọn arákùnrin àti arábìnrin mi
  rationale: A pa irú akọ inú Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a kò fi èyí sẹ́yìn pé nínú àyíká náà ó ṣeé ṣe kí ó kan gbogbo ìdílé àwọn onígbàgbọ́; àlàyé ìsàlẹ̀ ló sọ èyí.
- issue: Ìtumọ̀ ἐκκλησία nínú àyọlò Májẹ̀mú Láéláé
  choice: àpéjọ
  alternative: ìjọ
  rationale: ‘Àpéjọ’ tẹnumọ́ àwọn ènìyàn Ọlọ́run tí wọ́n kóra jọ, láìfi dandan gbé ìtumọ̀ ilé-iṣẹ́ ìjọ ti ìgbà tó tẹ̀ lé e wọ inú àyọlò náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà ní ìgbéga ewì tó bá àyọlò Sáàmù mu, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. ‘Kéde’ àti ‘fi orin yin’ pa ìpolongo gbangba àti ìyìn nípasẹ̀ orin mọ́.
