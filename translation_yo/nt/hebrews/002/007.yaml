  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: yo
  text: Ìwọ mú un rẹlẹ̀ ju àwọn áńgẹ́lì lọ fún ìgbà díẹ̀[a]; ìwọ fi ògo àti ọlá dé e ní adé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ mú un rẹlẹ̀ díẹ̀ ju àwọn áńgẹ́lì lọ.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìwọ̀n dípò àkókò.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: ìwọ mú un rẹlẹ̀ ju ... lọ
  rationale: 'Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-ìṣe tó ní agbára afiwéra: ‘mú ... rẹlẹ̀ ju,’ kì í ṣe ‘dín kù’ lásán. Ìtumọ̀ yìí bá παρά pẹ̀lú accusative mu ní èdè Yorùbá àdánidá.'
- source_word: αὐτὸν
  choice: un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà akọ ẹyọ kan ni; ‘un’ pa ìtọ́kasí ẹyọ kan mọ́ láìfi orúkọ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: βραχύ τι
  choice: fún ìgbà díẹ̀
  rationale: Ó ṣeé túmọ̀ sí àkókò tàbí ìwọ̀n. Àṣàyàn àkókò bá ìlò Kristi nínú àyíká Hébérù 2 mu, ṣùgbọ́n àṣàyàn ìwọ̀n wà nínú àlàyé ìsàlẹ̀.
- source_word: παρ’ ἀγγέλους
  choice: ju àwọn áńgẹ́lì lọ
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe afiwéra, παρά pẹ̀lú accusative túmọ̀ sí ‘ju ... lọ’; ‘àwọn áńgẹ́lì’ ṣàfihàn ọ̀pọ̀ àti article náà lọ́nà Yorùbá tó ṣe déédé.
- source_word: δόξῃ
  choice: fi ògo
  rationale: Dative náà sọ ohun tí a fi dé ẹni náà ládé; ‘fi ògo’ jẹ́ ìṣètò Yorùbá àdánidá pẹ̀lú ọ̀rọ̀-ìṣe náà.
- source_word: τιμῇ
  choice: àti ọlá
  rationale: τιμή ń tọ́ka sí ọlá tàbí ipò iyì tí a fi fún ẹni; ‘ògo àti ọlá’ pa ìsọ̀kan ọ̀rọ̀ méjèèjì mọ́.
- source_word: ἐστεφάνωσας
  choice: ìwọ ... dé e ládé
  rationale: Aorist active indicative ẹni kejì ẹyọ ni. ‘Dé e ládé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi adé dé ẹni láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: αὐτόν
  choice: e
  rationale: A tún pa ọ̀rọ̀ arọ́pò-orúkọ olùgbà mọ́ gẹ́gẹ́ bí ó ṣe tún farahàn nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ βραχύ τι nínú àyọlò Sáàmù 8 tí Hébérù lò
  choice: 'ti àkókò: ‘fún ìgbà díẹ̀’'
  alternative: 'ti ìwọ̀n: ‘ní ìwọ̀n díẹ̀’ tàbí ‘díẹ̀ sílẹ̀ ju àwọn áńgẹ́lì lọ’'
  rationale: Gíríìkì lè sọ ìgbà díẹ̀ tàbí ìwọ̀n díẹ̀. Àyíká Hébérù 2 ń ṣètìlẹ́yìn fún ìtumọ̀ àkókò nípa ìrẹ̀lẹ̀ Kristi fún ìgbà díẹ̀ ṣáájú ògo, ṣùgbọ́n a pa ojúlówó àìdánilójú náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì yé òǹkàwé òde òní. A lo ‘mú un rẹlẹ̀ ju ... lọ’ fún afiwéra tó ṣe kedere, àti ‘dé e ládé’ fún àwòrán adé inú orísun. Àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
