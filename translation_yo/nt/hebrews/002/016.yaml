id: HEB.2.16
reference: Hebrews 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: yo
  text: Nítorí ó dájú pé kì í ṣe àwọn áńgẹ́lì ni ó ń ràn lọ́wọ́,[a] bí kò ṣe irú-ọmọ Ábúráhámù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “di mú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “di mú” ní tààrà, ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí “ràn lọ́wọ́” tàbí “wá ràn lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: ó dájú pé
  rationale: Ó fi ìtẹnumọ́ ohun tí ó hàn gbangba kún gbólóhùn náà; “ó dájú pé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti mú agbára yìí jáde.
- source_word: ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹgbẹ́ tí a fi wé irú-ọmọ Ábúráhámù.
- source_word: ἐπιλαμβάνεται
  choice: ó ń ràn lọ́wọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ṣeé ló ní ìtumọ̀ mímú ènìyàn láti ran án lọ́wọ́ tàbí gbà á; ìtumọ̀ gidi rẹ̀, “di mú,” wà nínú àlàyé ìsàlẹ̀.
- source_word: σπέρματος Ἀβραὰμ
  choice: irú-ọmọ Ábúráhámù
  rationale: “Irú-ọmọ” lè tọ́ka sí àwọn ọmọ tàbí ìran gẹ́gẹ́ bí ẹgbẹ́ kan, ó sì pa àwòrán σπέρμα mọ́ láì mú un di ọ̀pọ̀ ní kedere.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Nítorí ... kì í ṣe ... bí kò ṣe ...
  rationale: Ìṣètò yìí pa ìdí tí γάρ ń fi hàn àti ìyàtọ̀ líle láàárín àwọn áńgẹ́lì àti irú-ọmọ Ábúráhámù mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐπιλαμβάνεται nípa iṣẹ́ ìgbàlà Ọmọ náà
  choice: Ọmọ náà ń ran irú-ọmọ Ábúráhámù lọ́wọ́, kì í ṣe àwọn áńgẹ́lì.
  alternative: Ọmọ náà “di irú-ọmọ Ábúráhámù mú,” èyí tí ó lè tẹnumọ́ gbígba ìwà ènìyàn wọ̀.
  rationale: Àyíká ọ̀rọ̀ náà ń sọ nípa ìṣọ̀kan Ọmọ náà pẹ̀lú ènìyàn àti iṣẹ́ ìgbàlà rẹ̀. Ìtumọ̀ “ràn lọ́wọ́” bá lílo ọ̀rọ̀ náà nínú àyíká yìí mu, ṣùgbọ́n a pa “di mú” mọ́ nínú àlàyé ìsàlẹ̀ nítorí ìtumọ̀ gidi rẹ̀ àti pàtàkì rẹ̀ nínú ìtàn ìtumọ̀.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kì í ṣe ... bí kò ṣe ...” fún ìyàtọ̀ tí ó lágbára, a sì lo “irú-ọmọ” láti pa ìtumọ̀ àkójọpọ̀ σπέρμα mọ́.
