revisions:
- from: Báwo ni àwa yóò ṣe là bí a bá kọ irú ìgbàlà ńlá bẹ́ẹ̀ sílẹ̀ láìbìkítà? Ìgbàlà yìí[a], tí a kọ́kọ́ bẹ̀rẹ̀ sí í sọ nípasẹ̀ Olúwa, ni àwọn tí wọ́n gbọ́ ọ lẹ́nu rẹ̀ fìdí rẹ̀ múlẹ̀ fún wa,
  to: Báwo ni àwa yóò ṣe là, bí a bá ṣàìka irú ìgbàlà ńlá bẹ́ẹ̀ sí? Ìgbàlà yìí[a], tí Olúwa kọ́kọ́ bẹ̀rẹ̀ sí í sọ, ni àwọn tí wọ́n gbọ́ ọ́ fìdí rẹ̀ múlẹ̀ fún wa,
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó lè yí ìtumọ̀ ‘neglect’ sí fífi ohun kan tì pẹ̀lú ‘ṣàìka ... sí.’ Ó tún mú gbolohun ìkéde Olúwa rọrùn ní Yorùbá, nígbà tí ó pa inceptive force ti ἀρχὴν λαβοῦσα λαλεῖσθαι, agency ti διὰ τοῦ κυρίου, àti ìtọ́kasí sí àwọn tí wọ́n gbọ́ Olúwa mọ́. Àmì abẹ́lẹ̀ àti komà ìparí ni a pa mọ́ nítorí ẹsẹ̀ náà ń bá gbolohun rẹ̀ lọ sí ẹsẹ̀ tó tẹ̀lé.
