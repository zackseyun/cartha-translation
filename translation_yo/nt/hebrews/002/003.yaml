  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: yo
  text: Báwo ni àwa yóò ṣe là, bí a bá ṣàìka irú ìgbàlà ńlá bẹ́ẹ̀ sí? Ìgbàlà yìí[a], tí Olúwa kọ́kọ́ bẹ̀rẹ̀ sí í sọ, ni àwọn tí wọ́n gbọ́ ọ́ fìdí rẹ̀ múlẹ̀ fún wa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí Olúwa kọ́kọ́ bẹ̀rẹ̀ sí í sọ, tí àwọn tí wọ́n gbọ́ ọ́ sì fìdí rẹ̀ múlẹ̀ fún wa.”
    reason: Àṣàyàn ìṣètò gbolohun relative náà, èyí tí ó tẹ̀lé ἥτις ní tààrà sí i.
lexical_decisions:
- source_word: πῶς
  choice: Báwo ni
  rationale: Ó bẹ̀rẹ̀ ìbéèrè ìkìlọ̀ kan tí ó ń fi hàn pé kò sí ọ̀nà àbáyọ, ṣùgbọ́n a pa ìrísí ìbéèrè Gíríìkì mọ́.
- source_word: ἐκφευξόμεθα
  choice: àwa yóò ṣe là
  rationale: Ó pa àkókò ọjọ́ iwájú àti ìbéèrè àsọyé náà mọ́ láìyí i padà sí gbólóhùn ìdálẹ́bi tààrà.
- source_word: τηλικαύτης
  choice: irú ... ńlá bẹ́ẹ̀
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá tí ó sì tẹnu mọ́ bí ìgbàlà náà ti tóbi tó.
- source_word: ἀμελήσαντες
  choice: bí a bá kọ ... sílẹ̀ láìbìkítà
  rationale: Ó tú participle náà sí ipò àdéhùn tí ó bá ìkìlọ̀ mu, ó sì fi ìtumọ̀ àìnáání tàbí àìbìkítà hàn.
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìdásílẹ̀ àti ìgbàlà ní ọ̀nà ẹ̀sìn.
- source_word: ἥτις
  choice: Ìgbàlà yìí
  rationale: Àtúnsọ orúkọ náà mú ẹni tàbí ohun tí relative pronoun ń tọ́ka sí ṣe kedere, ó sì bá Yorùbá àdánidá mu.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: tí a kọ́kọ́ bẹ̀rẹ̀ sí í sọ
  rationale: 'Ó pa agbára inceptive ti gbolohun Gíríìkì náà mọ́: ìkéde náà ní ìbẹ̀rẹ̀ rẹ̀ nípasẹ̀ Olúwa.'
- source_word: διὰ τοῦ κυρίου
  choice: nípasẹ̀ Olúwa
  rationale: ‘Nípasẹ̀’ pa ìtumọ̀ agency/instrumentality ti διά pẹ̀lú genitive mọ́, ‘Olúwa’ sì jẹ́ àkọlé tó yẹ fún κύριος.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: àwọn tí wọ́n gbọ́ ọ lẹ́nu rẹ̀
  rationale: Ó fi àwọn ẹlẹ́rìí tí wọ́n gbọ́ ìkéde náà lọ́dọ̀ Olúwa hàn ní Yorùbá àdánidá, láìsọ wọ́n di ẹgbẹ́ tí a dárúkọ.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: fìdí rẹ̀ múlẹ̀ fún wa
  rationale: Ó sọ ìjẹ́rìí ìmúdájú tí ó dé ọ̀dọ̀ àwọn olùgbà ọ̀rọ̀ náà ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ (τοῦ κυρίου) ń tọ́ka sí
  choice: A pa ‘Olúwa’ mọ́ gẹ́gẹ́ bí àkọlé fún Jésù, ẹni tí a fi bẹ̀rẹ̀ sí í kéde ìgbàlà náà.
  alternative: Kí a ka a sí ìtọ́ka gbogbogbò sí Ọlọ́run gẹ́gẹ́ bí olúwa.
  rationale: Àwọn tí wọ́n gbọ́ lẹ́nu rẹ̀ lẹ́yìn náà ló mú ìkéde náà dé ọ̀dọ̀ ‘wa’; ọ̀rọ̀ yìí tọ́ka gidigidi sí iṣẹ́ ìkéde Jésù àti ẹ̀rí àwọn olùgbọ́ rẹ̀, láìfikún ẹ̀kọ́ tí ẹsẹ̀ náà kò sọ.
- issue: Agbára ìbéèrè ìkìlọ̀ náà
  choice: 'A pa á mọ́ gẹ́gẹ́ bí ìbéèrè àsọyé: ‘Báwo ni ... yóò ṣe là?’'
  alternative: ‘Dájúdájú, a kì yóò là bí ...’
  rationale: Gíríìkì lo ìbéèrè ọjọ́ iwájú. Pípa ìbéèrè náà mọ́ dáàbò bo ìdẹ̀rù àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú ọ̀rọ̀ láìyí i padà sí ìkéde ìdálẹ́bi tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìbéèrè ìkìlọ̀ àti ìlọsíwájú láti ìkéde Olúwa sí ẹ̀rí àwọn olùgbọ́ rẹ̀ ni a pa mọ́.
