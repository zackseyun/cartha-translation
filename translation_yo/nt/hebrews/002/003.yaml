  source_fidelity: Ìbéèrè ìkìlọ̀ ọjọ́ iwájú náà, ìtẹnumọ́ lórí ìgbàlà tó pọ̀ gan, àti ìmúdájú ọ̀rọ̀ náà láti ọ̀dọ̀ àwọn olùgbọ́ Olúwa ni a pa mọ́. Ṣùgbọ́n ìtumọ̀ àkọ́kọ́ ti ἀμελήσαντες gẹ́gẹ́ bí “kọ ... sílẹ̀ láìbìkítà” jẹ́ àtúnlò tó wúwo, tí ó sì lè dà bí pípa ohun kan tì, kì í ṣe ṣíṣàìka sí i. Ní ti διὰ τοῦ κυρίου, ‘nípasẹ̀ Olúwa’ jẹ́ ọ̀rọ̀ tó le ní Yorùbá nínú àyíká ‘sọ’; ‘Olúwa ... bẹ̀rẹ̀ sí í sọ’ ń sọ agency tí Gíríìkì náà ní ní Yorùbá tó dáa.
