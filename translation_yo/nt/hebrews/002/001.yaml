  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: yo
  text: Nítorí èyí, a gbọ́dọ̀ túbọ̀ fiyè sí àwọn ohun tí a ti gbọ́, kí a má bàa ṣàn kọjá wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má bàa jẹ́ kí wọ́n yọ́ lọ́wọ́ wa.” Ọ̀rọ̀ Gíríìkì παραρυῶμεν mú àwòrán ohun tí ń ṣàn kọjá tàbí tí ń yọ́ lọ wá sí ọkàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó fi ìdí tàbí àbájáde ọ̀rọ̀ yìí múlẹ̀ pẹ̀lú ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: δεῖ
  choice: ó pọndandan kí a
  rationale: Ó fi agbára ìjẹ́pàtàkì àti ohun tí kò yẹ kí a ṣàìṣe hàn, nígbà tí ‘a’ dúró fún ἡμᾶς.
- source_word: περισσοτέρως
  choice: túbọ̀ ... gidigidi
  rationale: 'Ó pa ìtumọ̀ ìfiwéra àti ìmúná ọ̀rọ̀ náà mọ́: a gbọ́dọ̀ fi àfiyèsí tí ó pọ̀ ju ti tẹ́lẹ̀ lọ sí i.'
- source_word: προσέχειν ἡμᾶς
  choice: kí a ... fiyè sí
  rationale: ‘Fiyè sí’ jẹ́ gbólóhùn Yorùbá òde òní tí ó ṣe kedere fún fífi ọkàn àti àfiyèsí sí ohun kan.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: ohun tí a ti gbọ́
  rationale: Ó tú participle perfect náà sí Yorùbá àdánidá, ó sì jẹ́ kí ìṣe gbígbọ́ náà ní ìbáṣepọ̀ pẹ̀lú ìsinsìnyí.
- source_word: μήποτε
  choice: kí a má bàa
  rationale: Ó ṣe ìkìlọ̀ nípa àbájáde búburú tí ó lè ṣẹlẹ̀ láìsọ ọ́ di ohun tí ó dájú pé yóò ṣẹlẹ̀.
- source_word: παραρυῶμεν
  choice: kí a má bàa ṣá lọ kúrò lọ́dọ̀ rẹ̀
  rationale: Ó sọ ewu yíyọ tàbí lílọ díẹ̀díẹ̀ kúrò lọ́dọ̀ ohun tí a gbọ́ ní Yorùbá tí ó ṣe kedere, láìfi ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.
theological_decisions:
- issue: Àwòrán ìkìlọ̀ inú παραρυῶμεν
  choice: A sọ ọ́ gẹ́gẹ́ bí ewu pé àwa olùgbọ́ lè ṣá lọ kúrò lọ́dọ̀ ohun tí a gbọ́.
  alternative: A lè sọ pé a ‘ṣàn kọjá rẹ̀,’ tàbí pé a ‘jẹ́ kí ó yọ́ lọ́wọ́ wa.’
  rationale: Gírámà àti ìkìlọ̀ tó yí ẹsẹ náà ká fara mọ́ pé àwọn olùgbọ́ ni wọ́n ń ṣá lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tí ọ̀rọ̀ Gíríìkì lè ní mọ́. Èyí kò pinnu àríyànjiyàn ẹ̀kọ́ ìsìn nípa ìṣubú kúrò nínú ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. ‘Ṣá lọ kúrò lọ́dọ̀’ mú ewu ìyapa díẹ̀díẹ̀ hàn, nígbà tí àlàyé ìsàlẹ̀ ṣe àfihàn àwòrán omi inú ọ̀rọ̀ Gíríìkì.
