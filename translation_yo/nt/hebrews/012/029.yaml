  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: yo
  text: Nítorí Ọlọ́run wa jẹ́ iná ajónirun[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àtúnlò ọ̀rọ̀ inú Diutarónómì 4:24, níbi tí a ti ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí “iná ajónirun.”
    reason: cross_reference
  - marker: b
    text: Tàbí, “iná tí ń jó ohun run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: γὰρ so ẹsẹ̀ yìí mọ́ ìkìlọ̀ àti ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé. A gba καὶ sínú ìtumọ̀ náà láì túmọ̀ ọ́ lọ́tọ̀, kí gbolohun Yorùbá lè ṣe déédéé.
- source_word: ὁ θεὸς ἡμῶν
  choice: Ọlọ́run wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìtumọ̀ olùní ohun, ó sì pa ìtumọ̀ àjọṣe àti ti àwùjọ mọ́.
- source_word: πῦρ
  choice: iná
  rationale: Ìtumọ̀ tààrà ni; ó pa àwòrán àkàwé náà àti ìtọ́kasí sí Diutarónómì 4:24 mọ́ láì ṣe àlàyé rẹ̀ sínú ọ̀rọ̀.
- source_word: καταναλίσκον
  choice: tí ń jóni run
  rationale: Ọ̀rọ̀ participle náà ṣàpèjúwe iná tí ń run ohun pátápátá. Ọ̀rọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa agbára àti ìṣe tí ń lọ nínú àwòrán Gíríìkì mọ́.
theological_decisions:
- issue: Àpèjúwe Ọlọ́run gẹ́gẹ́ bí iná
  choice: 'Pa àkàwé tààrà mọ́: “Ọlọ́run wa jẹ́ iná tí ń jóni run”'
  alternative: “Ọlọ́run wa dà bí iná tí ń jóni run”
  rationale: Gíríìkì sọ pé Ọlọ́run jẹ́ iná láì lo àmì ìfiwéra. Ìtumọ̀ tààrà pa líle ìkìlọ̀ náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Diutarónómì 4:24 mọ́, láì sọ ọ́ di àfiwé tí kò lágbára tó.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. “Jẹ́ iná” pa àkàwé orísun mọ́; “tí ń jóni run” jẹ́ gbólóhùn àdánidá tó fi agbára καταναλίσκον hàn.
