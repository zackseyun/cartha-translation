  - severity: low
    issue: Ìṣọ̀kan καρπὸν εἰρηνικὸν δικαιοσύνης
    rationale: “ẹ̀so àlàáfíà ti òdodo” lè dá ìbáṣepọ̀ àwọn ọ̀rọ̀ méjèèjì rú. “ẹ̀so òdodo tí ó ní àlàáfíà” ń jẹ́ kí “òdodo” jẹ́ ohun tí èso náà jẹ́, “tí ó ní àlàáfíà” sì ń tú εἰρηνικόν.
