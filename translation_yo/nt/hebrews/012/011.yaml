id: HEB.12.11
reference: Hebrews 12:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: yo
  text: Gbogbo ìbáwí, ní àsìkò yìí, kò dà bí ohun ayọ̀, bí kò ṣe ohun ìbànújẹ́; ṣùgbọ́n lẹ́yìn náà, ó ń mú èso òdodo tí ó ní àlàáfíà jáde fún àwọn tí ìbáwí náà ti dá lẹ́kọ̀ọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo; níhìn-ín, ó ṣeé ṣe kó ń tọ́ka sí ìwà títọ́ tí ìbáwí ń mú jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: ìbáwí
  rationale: Nínú àyíká Hébérù 12, ọ̀rọ̀ náà ń tọ́ka sí ìtọ́́sọ́nà àti àtúnṣe tí baba fi ń kọ ọmọ, kì í ṣe ìjìyà lásán. “Ìbáwí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé jù lọ fún ìtumọ̀ yìí.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: ní àkókò tí a bá ń gba á
  rationale: Ó fi ojú ẹni tí ìbáwí ń ṣẹlẹ̀ sí ní àkókò yẹn hàn, ó sì dúró ní ìtakò pẹ̀lú “lẹ́yìn náà.”
- source_word: οὐ δοκεῖ
  choice: kò dà bí
  rationale: Ó pa èrò ohun tí ó farahàn mọ́ láì sọ pé ìbáwí jẹ́ ìbànújẹ́ ní ìtumọ̀ pípé.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: kò dà bí ohun ayọ̀, bí kò ṣe ohun ìbànújẹ́
  rationale: Èyí pa àwọn ọ̀rọ̀-orúkọ “ayọ̀” àti “ìbànújẹ́” inú Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ὕστερον
  choice: lẹ́yìn náà
  rationale: Ó sọ àbájáde tó ń dé nígbà tó tẹ̀ lé e ní ọ̀nà àdánidá.
- source_word: καρπὸν εἰρηνικὸν
  choice: èso àlàáfíà
  rationale: Ó pa àwòrán èso àti ìwà àlàáfíà rẹ̀ mọ́ láì fi kún un pé èso náà kàn ń fa àlàáfíà.
- source_word: γεγυμνασμένοις
  choice: àwọn tí a ti fi í kọ́ lẹ́kọ̀ọ́
  rationale: Ìtumọ̀ yìí fi hàn pé ìdánilẹ́kọ̀ọ́ tí ń tẹ̀ síwájú ti mọ àwọn ènìyàn náà, ó sì bá àwòrán ìdánilẹ́kọ̀ọ́ inú ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀποδίδωσιν
  choice: ó ń so èso
  rationale: “So èso” jẹ́ àsọyé Yorùbá tó bá àwòrán èso mu, ó sì sọ àbájáde ìbáwí náà kedere.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” lè sọ ìwà títọ́ tàbí ipò títọ́ tí ìbáwí Ọlọ́run ń mú jáde; a pa ìtumọ̀ “ìdájọ́ òdodo” mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ παιδεία nínú iṣẹ́ Ọlọ́run sí àwọn onígbàgbọ́
  choice: ìbáwí tó ní ìtọ́́sọ́nà, ìdánilẹ́kọ̀ọ́ àti àtúnṣe nínú
  alternative: ìjìyà lásán tàbí ìkọ́ni nìkan
  rationale: Hébérù 12:5–10 gbé ọ̀rọ̀ náà kalẹ̀ gẹ́gẹ́ bí ohun tí baba ń ṣe fún ọmọ rẹ̀ láti mú un dàgbà nínú ìwà mímọ́; “ìbáwí” pa ìfẹ́ àti àtúnṣe tó wà nínú rẹ̀ mọ́.
- issue: Ìtumọ̀ δικαιοσύνης
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú ẹsẹ yìí, ó ṣeé ṣe jù pé ọ̀rọ̀ náà ń tọ́ka sí ìwà títọ́ tí ìbáwí ń mú jáde, ṣùgbọ́n a kò yọ ìtumọ̀ tó lè jẹ́ ìdájọ́ òdodo kúrò.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn, ní ọ̀nà ọ̀wọ̀ àti èdè òde òní. Gbólóhùn náà pa ìtakò tó wà láàárín ìbànújẹ́ ìsinsìnyí àti èso tó ń dé lẹ́yìn náà mọ́, láì sọ ìbáwí di ìjìyà lásán.
