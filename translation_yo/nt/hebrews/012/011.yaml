  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtakò àkókò náà, ìrísí ọ̀rọ̀ náà (“kò dà bí”), àti àbájáde ìbáwí náà hàn dáadáa. Síbẹ̀, “ní àkókò tí a bá ń gba á” fi ìtumọ̀ àdéhùn/ìṣẹ̀lẹ̀ kan kún πρὸς τὸ παρόν, níbi tí Gíríìkì ti ń sọ nípa àkókò ìsinsìnyí lásán. “Àwọn tí a ti fi í kọ́ lẹ́kọ̀ọ́” sì jẹ́ ọ̀nà tí kò rọrùn, tí ó sì lè jẹ́ àìdánilójú nípa ẹni tí a kọ́.
  naturalness: “Gbogbo ìbáwí sì” àti “ní àkókò tí a bá ń gba á” kò rọrùn gan-an ní Yorùbá àpapọ̀. Gbólóhùn tí a tún ṣe ń lo “Ní àsìkò yìí” àti “àwọn tí ìbáwí náà ti dá lẹ́kọ̀ọ́,” tí wọ́n ṣàn dáadáa síi, wọ́n sì pa ìtumọ̀ ẹsẹ náà mọ́.
  terminology: “Ìbáwí,” “òdodo,” àti “ẹ̀so” yẹ. A tún ètò “ẹ̀so àlàáfíà ti òdodo” ṣe sí “ẹ̀so òdodo tí ó ní àlàáfíà” kí εἰρηνικόν hàn gẹ́gẹ́ bí àpèjúwe èso náà, kì í ṣe ohun tí ó lè dà bí “àlàáfíà ti òdodo.” Àlàyé ìsàlẹ̀ náà ń pa ìtumọ̀ “ìdájọ́ òdodo” mọ́ gẹ́gẹ́ bí àṣàyàn.
  issues:
