revisions:
- from: Gbogbo ìbáwí sì, ní àkókò tí a bá ń gba á, kò dà bí ohun ayọ̀, bí kò ṣe ohun ìbànújẹ́; ṣùgbọ́n lẹ́yìn náà, ó ń so èso àlàáfíà ti òdodo[a] fún àwọn tí a ti fi í kọ́ lẹ́kọ̀ọ́.
  to: Gbogbo ìbáwí, ní àsìkò yìí, kò dà bí ohun ayọ̀, bí kò ṣe ohun ìbànújẹ́; ṣùgbọ́n lẹ́yìn náà, ó ń mú èso òdodo tí ó ní àlàáfíà jáde fún àwọn tí ìbáwí náà ti dá lẹ́kọ̀ọ́.[a]
  rationale: A rọ́pò ọ̀rọ̀ àkókò tí ó ní ìrísí àdéhùn pẹ̀lú “ní àsìkò yìí,” a mú ìdánilẹ́kọ̀ọ́ tí ìbáwí ń ṣe hàn ní Yorùbá tó dára síi, a sì tún ọ̀rọ̀ “ẹ̀so” ṣe kí ìbáṣepọ̀ “ẹ̀so,” “àlàáfíà,” àti “òdodo” lè hàn kedere. A yọ “Ọlọ́run” kúrò nínú àlàyé ìsàlẹ̀ nítorí a kò sọ ọ́ ní kedere nínú ẹsẹ yìí fúnra rẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká tó yí i ká ń sọ̀rọ̀ nípa Ọlọ́run.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:31:44Z'
