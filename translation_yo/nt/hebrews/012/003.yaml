  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: yo
  text: Nítorí, ẹ ronú jinlẹ̀ nípa ẹni tí ó ti fara da irú ìtakò bẹ́ẹ̀ láti ọ̀dọ̀ àwọn ẹlẹ́ṣẹ̀ sí ara wọn[a], kí ẹ má bàa rẹ̀ tàbí kí ẹ rẹ̀wẹ̀sì[b] nínú ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “sí ara rẹ̀”; SBLGNT ní “sí ara wọn.” Nínú àyíká ọ̀rọ̀ náà, Jésù ni àwọn ẹlẹ́ṣẹ̀ ń tako.
    reason: textual_variant
  - marker: b
    text: Tàbí, “kí ẹ má ṣe dákú nínú ọkàn yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: ẹ ronú jinlẹ̀ nípa
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn olùgbọ́ púpọ̀ láti fi ìṣọ́ra àti ìmọ̀lára ronú lórí àpẹẹrẹ Jésù; ‘ronú jinlẹ̀ nípa’ jẹ́ Yorùbá adayébá tí ó pa agbára ìkìlọ̀ náà mọ́.
- source_word: τοιαύτην
  choice: irú ... bẹ́ẹ̀
  rationale: Ó ń tọ́ka sí irú tàbí ìwọ̀n àtakò náà láì fi ìtumọ̀ tí Gíríìkì kò sọ kún un.
- source_word: ὑπομεμενηκότα
  choice: ẹni tí ó ti fara da
  rationale: ‘Fara da’ sọ ìfaradà lábẹ́ ìpọ́njú ní Yorùbá adayébá; ‘ó ti’ tún fi ipa perfect participle hàn, ìṣe tí ó ṣẹlẹ̀ tí ó sì ṣì ní ìtumọ̀ fún àkókò yìí.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Ìtumọ̀ tààrà fún ọ̀rọ̀ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ fún àwọn tí ẹ̀ṣẹ̀ ń ṣe àpèjúwe wọn.
- source_word: εἰς ἑαυτοὺς ἀντιλογίαν
  choice: àtakò ... sí ara wọn
  rationale: ‘Àtakò’ gba ìtumọ̀ ìṣòdì, ìjiyàn, tàbí ọ̀rọ̀ tí ń tako. SBLGNT ní ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ‘sí ara wọn’; a pa ìṣòro ìtumọ̀ àti ẹ̀rí àfọwọ́kọ náà mọ́, a sì ṣàlàyé ẹ̀dà mìíràn nínú àlàyé ìsàlẹ̀.
- source_word: κάμητε
  choice: kí àárẹ̀ má bàa mú yín
  rationale: Gbólóhùn Yorùbá adayébá fún dídi aláárẹ̀ tàbí kí agbára ẹni dín kù; ó yàtọ̀ sí ọ̀rọ̀ tó tẹ̀ lé e nípa ìrẹ̀wẹ̀sì inú.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ní àyíká yìí ψυχή tọ́ka sí ìwà inú tàbí ẹni inú. ‘Nínú ọkàn yín’ jẹ́ Yorùbá adayébá, ó sì yẹra fún lílo ‘ẹ̀mí’ tí ó lè mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì wọlé.
- source_word: ἐκλυόμενοι
  choice: kí ẹ sì má ṣe rẹ̀wẹ̀sì
  rationale: Ó sọ ìrẹ̀wẹ̀sì, fífi ara sílẹ̀, tàbí dídákú ní inú; ‘rẹ̀wẹ̀sì’ mọ́gbọ́n dání fún olùkà òde òní, àlàyé ìsàlẹ̀ sì pa àṣàyàn tó sún mọ́ àwòrán dídákú mọ́.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ó’ ń tọ́ka sí
  choice: A kò tún orúkọ Jésù sọ nínú ẹsẹ yìí; ‘ẹni tí ó’ ń tọ́ka sí i nípasẹ̀ àyíká ẹsẹ 2.
  alternative: Ṣíṣe orúkọ náà ní kedere pé ‘Jésù.’
  rationale: Gíríìkì lo participle pẹ̀lú article láì tún orúkọ Jésù sọ. Àyíká tó sún mọ́ ọn mú ẹni tí a ń tọ́ka sí ṣe kedere, nítorí náà ìtumọ̀ náà pa ìṣètò orísun mọ́ láì fi ọ̀rọ̀ kún un.
- issue: Ọ̀rọ̀ arọ́pò-orúkọ inú εἰς ἑαυτούς
  choice: Tẹ̀ lé SBLGNT pé ‘sí ara wọn’ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Àwọn àfọwọ́kọ kan ní ‘sí ara rẹ̀,’ èyí tí ó fi àtakò náà hàn gẹ́gẹ́ bí èyí tí a darí sí Jésù.
  rationale: Kíkà SBLGNT jẹ́ ọ̀pọ̀, ó sì nira ní ìtumọ̀; a kò yẹ kí a yí i padà ní ìkọ̀kọ̀ sí ẹ̀dà tó rọrùn. Àlàyé ìsàlẹ̀ ṣàfihàn ẹ̀dà àfọwọ́kọ mìíràn àti bí àyíká ṣe ń jẹ́ kó ṣeé lóye pé Jésù ni àwọn ẹlẹ́ṣẹ̀ tako.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ’ àti ‘yín’ pa bí àwọn olùgbọ́ ṣe pọ̀ mọ́. Gbólóhùn náà tẹ̀ lé ìṣàn Gíríìkì ṣùgbọ́n ó lo àtẹ̀jáde Yorùbá adayébá; a mọ̀ọ́mọ̀ pa kíkà SBLGNT ‘sí ara wọn’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, bó tilẹ̀ jẹ́ pé ó le, kí a má bàa yanju ìyàtọ̀ àfọwọ́kọ ní ìkọ̀kọ̀.
