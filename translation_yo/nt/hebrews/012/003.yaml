revisions:
- from: Nítorí náà, ẹ ronú jinlẹ̀ nípa ẹni tí ó ti fara da irú àtakò bẹ́ẹ̀ láti ọ̀dọ̀ àwọn ẹlẹ́ṣẹ̀ sí ara wọn[a], kí àárẹ̀ má bàa mú yín, kí ẹ sì má ṣe rẹ̀wẹ̀sì nínú ọkàn yín.[b]
  to: Nítorí, ẹ ronú jinlẹ̀ nípa ẹni tí ó ti fara da irú ìtakò bẹ́ẹ̀ láti ọ̀dọ̀ àwọn ẹlẹ́ṣẹ̀ sí ara wọn[a], kí ẹ má bàa rẹ̀ tàbí kí ẹ rẹ̀wẹ̀sì[b] nínú ọkàn yín.
  rationale: A rọ́pò “Nítorí náà” pẹ̀lú “Nítorí” láti fi γάρ hàn ní òtítọ́. A pa “sí ara wọn” mọ́ nínú ọ̀rọ̀ àkọ́kọ́, bí SBLGNT ṣe rí, bó tilẹ̀ jẹ́ pé kíkà náà ṣòro; àlàyé a ń sọ ẹ̀dà “sí ara rẹ̀” àti ìmọ̀lára àyíká. A tún ṣètò ìparí ẹsẹ náà ní Yorùbá adayébá kí “rẹ̀” àti “rẹ̀wẹ̀sì” ba iṣẹ́ ìkìlọ̀ Gíríìkì mu, a sì gbe àmì b sí ọ̀rọ̀ tó ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:31:41Z'
review_pass:
  verdict: revise
  source_fidelity: Àkọlé náà tẹ̀ lé ọ̀pọ̀ nínú Gíríìkì dáadáa, ó sì pa kíkà SBLGNT tí ó ṣòro náà, εἰς ἑαυτούς (“sí ara wọn”), mọ́ pẹ̀lú àlàyé ìsàlẹ̀. Ṣùgbọ́n “Nítorí náà” fi ìjápọ̀ ìyọrísí (“therefore”) kún γάρ, tí ó túmọ̀ sí “nítorí,” nítorí náà a yẹ kí a yí i padà. A tún tún ìṣètò ìparí gbólóhùn ṣe kí ìrẹ̀wẹ̀sì má bàa hàn bí ìṣe mìíràn tí kò ní ìbáṣepọ̀ pẹ̀lú “rẹ̀.”
  naturalness: “Ronú jinlẹ̀ nípa,” “fara da,” àti “ìtakò láti ọ̀dọ̀ àwọn ẹlẹ́ṣẹ̀” jẹ́ Yorùbá boṣewa, adayébá, tí ó yẹ fún ìkìlọ̀ àpọ́sítélì. “Kí ẹ má bàa rẹ̀ tàbí kí ẹ rẹ̀wẹ̀sì nínú ọkàn yín” ṣàn dáadáa, ó sì fi ìṣọ̀kan àwọn ọ̀rọ̀ κάμητε àti ἐκλυόμενοι hàn.
  terminology: “Àwọn ẹlẹ́ṣẹ̀,” “fara da,” “ìtakò,” àti “ọkàn yín” bá ìtumọ̀ àti ìforúkọsílẹ̀ ọ̀rọ̀ náà mu. A ko sọ Jésù lórúkọ nínú ara ẹsẹ náà, nítorí ẹni tí participle náà tọ́ka sí ti ṣe kedere ní ẹsẹ 2. Àlàyé a gbọdọ̀ pa ìyàtọ̀ ἑαυτούς/ἑαυτόν mọ́ láì yan ẹ̀dà mìíràn sínú ọ̀rọ̀ àkọ́kọ́.
