id: HEB.12.19
reference: Hebrews 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: yo
  text: àti sí ìró ìpè, àti sí ohùn ọ̀rọ̀[a][b], tí àwọn tí ó gbọ́ ọ bẹ̀bẹ̀ pé kí a má ṣe sọ ọ̀rọ̀ mìíràn sí wọn mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo èyí tí àwọn tí ó gbọ́ bẹ̀bẹ̀ pé kí a má tún bá wọn sọ̀rọ̀.” Ní ìtumọ̀ yìí, ọ̀rọ̀ àsopọ̀ náà ń tọ́ka sí gbogbo ìfarahàn Sínáì, kì í ṣe sí “ohùn ọ̀rọ̀” nìkan.
    reason: alternative_reading
  - marker: b
    text: Wo Ẹ́kísódù 20:18–19 àti Diutarónómì 5:23–27 nípa bí àwọn ọmọ Ísírẹ́lì ṣe bẹ̀bẹ̀ pé kí wọ́n má ṣe gbọ́ ohùn Ọlọ́run ní tààrà mọ́.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: ìró ìpè
  rationale: “Ìró” ṣe aṣoju ἤχῳ ní tààrà, “ìpè” sì jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún ohun èlò ìfọn bíi trumpet, láìfi bí ìró náà ṣe le tó kún ọ̀rọ̀ Gíríìkì.
- source_word: φωνῇ ῥημάτων
  choice: ohùn ọ̀rọ̀
  rationale: Èyí pa àwòrán gbólóhùn Gíríìkì tí kò wọ́pọ̀ mọ́, ó sì fi hàn pé ọ̀rọ̀ tí ó ṣe kedere ni a gbọ́, kì í ṣe ariwo lásán. Fífi “àwọn” sí i kò ṣe pàtàkì ní Yorùbá, nítorí “ọ̀rọ̀” lè dúró fún ọ̀pọ̀ ọ̀rọ̀ nínú irú àkópọ̀ yìí.
- source_word: ἧς
  choice: tí ... ó gbọ́ ọ
  rationale: Àrọ́pò-orúkọ “ọ” tọ́ka ní ti ẹ̀dá gírámà jù lọ sí “ohùn ọ̀rọ̀,” ṣùgbọ́n ìtumọ̀ rẹ̀ kò di dandan débi tí kò fi lè kan gbogbo ohun amúnikún-fún-ẹ̀rù tí ó ṣẹlẹ̀ ní Sínáì.
- source_word: οἱ ἀκούσαντες
  choice: àwọn tí ó gbọ́ ọ
  rationale: Ìtumọ̀ yìí ṣe àfihàn participle tí a lò gẹ́gẹ́ bí orúkọ ní ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: παρῃτήσαντο
  choice: bẹ̀bẹ̀
  rationale: “Bẹ̀bẹ̀” mú ìtara àti ìbẹ̀rù inú ẹ̀bẹ̀ àwọn ọmọ Ísírẹ́lì jáde dáadáa ju “béèrè” tàbí “kọ̀” lọ.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: pé kí a má ṣe sọ ọ̀rọ̀ mìíràn sí wọn mọ́
  rationale: Èyí sọ ìtumọ̀ idiomatic προστίθημι, ìyẹn pé kí a má ṣe fi ọ̀rọ̀ kún èyí tí wọ́n ti gbọ́, ní Yorùbá tó ṣe kedere; ó tún pa ìṣe aláìlórúkọ ti passive Gíríìkì mọ́ nípa “kí a má ṣe sọ.”
theological_decisions:
- issue: Ohun tí ἧς ń tọ́ka sí
  choice: Nínú ọ̀rọ̀ pàtàkì, gbólóhùn náà tọ́ka ní ti gírámà jù lọ sí “ohùn ọ̀rọ̀.”
  alternative: Ó lè tọ́ka sí gbogbo ìfarahàn Sínáì, títí kan ìró ìpè àti ohùn náà.
  rationale: Orúkọ abo tó sún mọ́ ọn jù lọ nínú Gíríìkì ni φωνῇ, èyí tó fara mọ́ ἧς tó jẹ́ abo ẹyọ. Síbẹ̀, àyíká ọ̀rọ̀ fi hàn pé gbogbo ìṣẹ̀lẹ̀ Sínáì ló kó ẹ̀rù bá àwọn olùgbọ́; nítorí náà, àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ohùn ọ̀rọ̀” mọ̀ọ́mọ̀ pa ìrísí aláìṣe-déédéé díẹ̀ ti Gíríìkì mọ́ dípò yíyí i padà sí àlàyé tó ti túmọ̀ rẹ̀ jù.
