id: HEB.12.5
reference: Hebrews 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: yo
  text: 'Ẹ̀yin sì ti gbàgbé ọ̀rọ̀ ìyànjú tí ó ń bá yín sọ̀rọ̀ gẹ́gẹ́ bí àwọn ọmọkùnrin pé:


    “Ọmọkùnrin mi[a], má ṣe fojú kékeré wo ìbáwí Olúwa[b][c],

    má sì ṣe rẹ̀wẹ̀sì nígbà tí ó bá ń bá ọ wí.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “Ọmọ mi.” Gíríìkì ní “ọmọkùnrin,” ní ìbámu pẹ̀lú ọ̀rọ̀ inú Òwe àti èdè ipò ọmọkùnrin tí ó dúró fún gbogbo àwọn ọmọ Ọlọ́run nínú àyíká ẹsẹ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: “Ìbáwí” tún lè túmọ̀ sí “ìdánilẹ́kọ̀ọ́,” “ìtọ́ni,” tàbí “àtúnṣe”; kì í ṣe ìjìyà nìkan.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ tí a fa yọ tàbí tọ́ka sí láti inú Òwe 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: ẹ̀yin sì ti gbàgbé
  rationale: Ọ̀rọ̀ yìí fi ipò tí ìgbàgbé àtijọ́ mú wá títí di ìsinsìnyí hàn; “ti gbàgbé” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìbáwí náà mọ́.
- source_word: παρακλήσεως
  choice: ọ̀rọ̀ ìyànjú
  rationale: Níhìn-ín, παράκλησις jẹ́ ọ̀rọ̀ tí ń rọni, tí ń gbani níyànjú, tí ó sì ń kìlọ̀; “ọ̀rọ̀ ìyànjú” mú ìṣírí àti àṣẹ ìkìlọ̀ náà papọ̀.
- source_word: ἥτις ὑμῖν ... διαλέγεται
  choice: tí ó ń bá yín sọ̀rọ̀
  rationale: Èyí sọ ọ́ di mímọ̀ pé Ìwé Mímọ́ ń bá àwọn olùgbọ́ sọ̀rọ̀ ní tààrà, láìfi ìtumọ̀ àfikún sí ọ̀rọ̀ Gíríìkì.
- source_word: ὡς υἱοῖς
  choice: gẹ́gẹ́ bí àwọn ọmọkùnrin
  rationale: Ó pa èdè akọ ti ọ̀rọ̀ Gíríìkì àti ìjápọ̀ rẹ̀ mọ́ pẹ̀lú àkòrí ipò ọmọkùnrin nínú àyíká ẹsẹ̀ náà.
- source_word: Υἱέ μου
  choice: Ọmọkùnrin mi
  rationale: Ó pa ẹyọ akọ inú òwe tí a fa yọ mọ́, ó sì jẹ́ kí ìjápọ̀ pẹ̀lú Òwe 3:11 hàn gbangba.
- source_word: ὀλιγώρει
  choice: má ṣe fojú kékeré wo
  rationale: Àpólà Yorùbá yìí túmọ̀ sí kí a má ka ohun sí aláìníyelórí tàbí kí a má kọbi ara sí i.
- source_word: παιδείας
  choice: ìbáwí
  rationale: “Ìbáwí” lè ní ìtọ́ni, ìdánilẹ́kọ̀ọ́ àti àtúnṣe nínú rẹ̀; kò dín ọ̀rọ̀ náà kù sí ìjìyà nìkan.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, ìbáṣepọ̀ genitive náà sì hàn nínú “ìbáwí Olúwa.”
- source_word: ἐκλύου
  choice: má sì ṣe rẹ̀wẹ̀sì
  rationale: Ó mú ìtumọ̀ jíjẹ́ kí ọkàn rẹ̀ ṣubú tàbí kí agbára inú tán nígbà àtúnṣe jáde lọ́nà Yorùbá àdánidá.
- source_word: ἐλεγχόμενος
  choice: nígbà tí ó bá ń bá ọ wí
  rationale: “Bá ... wí” sọ ìfarahàn àṣìṣe àti àtúnṣe rẹ̀ nínú àjọṣe baba àti ọmọ, láìjẹ́ kí ọ̀rọ̀ náà le ju ti orísun lọ.
theological_decisions:
- issue: Èdè akọ nípa ipò ọmọ
  choice: Gbé υἱοῖς àti Υἱέ jáde gẹ́gẹ́ bí “àwọn ọmọkùnrin” àti “Ọmọkùnrin mi.”
  alternative: “àwọn ọmọ” àti “Ọmọ mi”
  rationale: Ọ̀rọ̀ Gíríìkì àti Òwe tí a fa yọ lo èdè akọ ní pàtó, èyí sì bá àríyànjiyàn nípa ipò ọmọkùnrin nínú Hébérù mu. Àlàyé ìsàlẹ̀ fi hàn pé gbogbo àwọn onígbàgbọ́ tí a ń bá sọ̀rọ̀ ló wà nínú ìpè náà.
- issue: Ìtumọ̀ παιδεία nínú àjọṣe Ọlọ́run àti ènìyàn
  choice: ìbáwí
  alternative: ìdánilẹ́kọ̀ọ́; ìtọ́ni; àtúnṣe
  rationale: “Ìbáwí” lè gba ìtọ́ni tí ń mọ ènìyàn àti àtúnṣe tí ń dun sílẹ̀ papọ̀, nítorí náà kò yanjú ẹ̀dọ̀fu ìtumọ̀ náà sí ìjìyà nìkan tàbí ẹ̀kọ́ nìkan.
translation_notes:
  register: A lo Yorùbá àfọwọ́dá tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí ó yẹ. Àpólà “fojú kékeré wo,” “rẹ̀wẹ̀sì,” àti “bá ... wí” jẹ́ ti Yorùbá àdánidá, wọ́n sì pa ìkìlọ̀ àti ìtùnú inú ẹsẹ̀ náà mọ́.
