id: HEB.12.18
reference: Hebrews 12:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: yo
  text: Nítorí ẹ̀yin kò sún mọ́ ohun tí a lè fọwọ́ kàn[a], tàbí iná tí ń jó fòfò, tàbí òkùnkùn biribiri, ìṣúdùdù, àti ìjì líle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òkè tí a lè fi ọwọ́ kàn.” Àyíká fi hàn pé Òkè Sínáì ni a ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ “òkè” kò sí ní tààrà nínú Gíríìkì ẹsẹ yìí.
    reason: alternative_reading
  - marker: b
    text: 'A tún lè gbé e kalẹ̀ báyìí: “ohun tí a lè fọwọ́ kàn, iná tí ń jó fòfò, òkùnkùn biribiri, ìṣúdùdù àti ìjì líle.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Nítorí ... kò
  rationale: “Nítorí” mú ipa àlàyé γάρ jáde, “kò” sì fi ìkọ̀ Οὐ hàn ní kedere.
- source_word: προσεληλύθατε
  choice: ẹ̀yin kò sún mọ́
  rationale: “Sún mọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtọ̀sí tàbí wíwọlé sí iwájú ohun kan, ó sì bá àwòrán ìwọlé sí iwájú Ọlọ́run mu. Ìṣe pípé Gíríìkì tọ́ka sí ipò tí ó wà nísinsìnyí lẹ́yìn ìsúnmọ́; àyíká gbólóhùn Yorùbá ni ó ń gbé èrò yìí.
- source_word: ψηλαφωμένῳ
  choice: ohun tí a lè fi ọwọ́ kàn
  rationale: Èyí pa ìtumọ̀ ohun tí ó ṣeé fọwọ́ kàn mọ́ láìfi “òkè” kún un, nítorí kò sí ọ̀rọ̀ ὄρος nínú ẹsẹ yìí.
- source_word: κεκαυμένῳ πυρί
  choice: iná tí ń jó fòfò
  rationale: Ọ̀rọ̀ yìí ṣàfihàn iná tí ó wà ní ipò jíjó gidigidi; “ń jó fòfò” jẹ́ àfihàn Yorùbá tí ó ṣe kedere, tí ó sì lágbára.
- source_word: γνόφῳ
  choice: òkùnkùn biribiri
  rationale: γνόφος ń tọ́ka sí òkùnkùn tí ó nípọn; “òkùnkùn biribiri” mú agbára ọ̀rọ̀ náà jáde, ó sì yà á sí ọ̀tọ̀ díẹ̀ sí ζόφος.
- source_word: ζόφῳ
  choice: ìṣúdùdù
  rationale: “Ìṣúdùdù” ń sọ òkùnkùn dídúdú, amúnikún-fún-ẹ̀rù; ó pa ìṣùpọ̀ ọ̀rọ̀ méjèèjì mọ́ láìsọ wọ́n di ohun kan náà.
- source_word: θυέλλῃ
  choice: ìjì líle
  rationale: θύελλα jẹ́ ìjì oníjàgídíjàgan; “ìjì líle” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
theological_decisions:
- issue: Bóyá kí a fi “òkè” kún ohun tí àwọn onígbàgbọ́ kò sún mọ́
  choice: A kò fi “òkè” sínú ọ̀rọ̀ pàtàkì; a lò “ohun tí a lè fi ọwọ́ kàn.”
  alternative: “òkè tí a lè fi ọwọ́ kàn”
  rationale: Àyíká fi hàn pé Òkè Sínáì ni a ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì ẹsẹ yìí kò dárúkọ òkè. Ìtumọ̀ pàtàkì kò gbọ́dọ̀ mú ohun tí àyíká nìkan tọ́ka sí wọ inú ẹsẹ gẹ́gẹ́ bí ohun tí a sọ ní tààrà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀ àti kíkà-rọrùn pẹ̀lú àmì ohùn ní kíkún. “Tàbí sí” lẹ́yìn gbólóhùn ìkọ̀ jẹ́ àtòjọ Yorùbá àdánidá fún καί tí a tún sọ, nígbà tí àwọn orúkọ mẹ́ta tó gbẹ̀yìn wà ní ìṣọ̀kan lábẹ́ “sí.”
