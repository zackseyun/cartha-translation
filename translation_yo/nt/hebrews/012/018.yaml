revisions:
- from: Nítorí ẹ̀yin kò sún mọ́ ohun tí a lè fi ọwọ́ kàn[a], tàbí sí iná tí ń jó fòfò, tàbí sí òkùnkùn biribiri, ìṣúdùdù àti ìjì líle[b].
  to: Nítorí ẹ̀yin kò sún mọ́ ohun tí a lè fọwọ́ kàn[a], tàbí iná tí ń jó fòfò, tàbí òkùnkùn biribiri, ìṣúdùdù, àti ìjì líle[b].
  rationale: Àtúnṣe náà yọ ‘sí’ kúrò lẹ́yìn ‘tàbí’ nítorí ìṣàkóso ‘sún mọ́’ nínú Yorùbá. A tún ṣe ìṣọ̀kan ‘fi ọwọ́ kàn’ sí ‘fọwọ́ kàn’ nínú ọ̀rọ̀ pàtàkì àti akọ́sọ ìsàlẹ̀. Kò sí ohun tí a fi kún ìtumọ̀ Gíríìkì, a kò sì sọ ‘òkè’ sínú ọ̀rọ̀ pàtàkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:49Z'
