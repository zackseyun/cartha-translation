  source_fidelity: Ìtumọ̀ náà pa ìkọ̀, ìsúnmọ́, ohun tí a lè fọwọ́ kàn láìfi ‘òkè’ kún un, àti àtòjọ àwọn ìṣẹ̀lẹ̀ ẹlẹ́rùjẹ̀jẹ̀ marún-ún mọ́. Síbẹ̀, ‘tàbí sí’ lẹ́yìn ‘sún mọ́’ kì í bá ìṣàkóso ọ̀rọ̀-ìṣe Yorùbá mu dáadáa, nítorí ‘sún mọ́’ gba ohun-ìṣe taara.
  naturalness: ‘Ẹ̀yin kò sún mọ́ ohun … tàbí iná …’ jẹ́ Yorùbá ìgbàlódé tí ó rọrùn, ó sì fi ìkọ̀ tí ó kan gbogbo ohun inú àtòjọ náà hàn kedere. Yíyọ ‘sí’ kúrò lẹ́yìn ‘tàbí’ mú gbolohun náà dáa síi láìyí ìtumọ̀ rẹ̀ padà.
  terminology: ‘Ohun tí a lè fọwọ́ kàn,’ ‘iná tí ń jó fòfò,’ ‘òkùnkùn biribiri,’ ‘ìṣúdùdù,’ àti ‘ìjì líle’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún ψηλαφωμένῳ, κεκαυμένῳ πυρί, γνόφῳ, ζόφῳ, àti θυέλλῃ. A pa ìyàtọ̀ tó wà láàrin γνόφος àti ζόφος mọ́.
