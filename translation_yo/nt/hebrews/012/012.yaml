id: HEB.12.12
reference: Hebrews 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: yo
  text: Nítorí náà[a], ẹ fún ọwọ́ yín tí ó rọ̀ sílẹ̀ àti eékún yín tí ó di aláìlera lókun,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀, “ẹ gbé ọwọ́ tí ó rọ̀ sílẹ̀ àti eékún tí ó di aláìlera sókè.” Ọ̀rọ̀ yìí ń ṣe ìrántí Aísáyà 35:3 nínú àṣà Gíríìkì, ó sì lo àwòrán ara láti sọ nípa ìmúpadàbọ̀sípò ìgboyà àti ìfaradà.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ nípa ìfaradà àti ìbáwí.
- source_word: παρειμένας χεῖρας
  choice: ọwọ́ yín tí ó rọ̀ sílẹ̀
  rationale: Gbólóhùn náà ṣàpèjúwe ọwọ́ tí ó so kalẹ̀ nítorí àárẹ̀ tàbí àìní ìgboyà; fífi “yín” kún un jẹ́ ti ẹ̀dá èdè Yorùbá nígbà tí a ń bá àwùjọ sọ̀rọ̀.
- source_word: παραλελυμένα γόνατα
  choice: eékún yín tí ó di aláìlera
  rationale: Ọ̀rọ̀ náà túmọ̀ sí eékún tí agbára rẹ̀ ti dín kù; yíyan “di aláìlera” pa àwòrán àárẹ̀ mọ́ láìsọ ọ́ di àrùn ìrọ̀gbẹ̀ ní ti gidi.
- source_word: ἀνορθώσατε
  choice: ẹ ... lókun
  rationale: Àṣẹ náà ń pe àwọn olùgbọ́ sí ìgbésẹ̀ pàtó láti tún gba agbára àti ìgboyà; “fún ... lókun” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì bá àyíká ìfaradà mu.
theological_decisions:
- issue: Ìṣírí àpèjúwe nípasẹ̀ àìlera àwọn ẹ̀yà ara
  choice: Pa àwòrán ọwọ́ tí ó rọ̀ àti eékún aláìlera mọ́, ṣùgbọ́n sọ àṣẹ náà ní ọ̀nà tí ó túmọ̀ sí mímú ara ẹni le fún ìfaradà.
  alternative: Ẹ gbé ọwọ́ tí ó rọ̀ sílẹ̀ àti eékún tí ó di aláìlera sókè.
  rationale: Àyíká Hébérù 12 dá lórí ìfaradà, ìbáwí, àti títẹ̀síwájú. Àwòrán ara lè ṣe àfihàn àìní ìgboyà, ó sì ṣeé ṣe kó ń tọ́ka sí Aísáyà 35:3; ìtumọ̀ yìí kò yọ àwòrán náà kúrò tàbí fi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ní àmì ohùn ní kíkún. A lo “ẹ” àti “yín” fún àwùjọ àwọn olùgbọ́, a sì pa àwòrán ara àti ìṣírí àyíká mọ́.
