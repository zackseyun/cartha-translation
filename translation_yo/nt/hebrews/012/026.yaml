  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: yo
  text: ẹni tí ohùn rẹ̀ mú ilẹ̀ mì nígbà náà, ṣùgbọ́n nísinsin yìí ó ti ṣe ìlérí, ó ní:[b] “Lẹ́ẹ̀kan sí i, èmi yóò mú ilẹ̀ àti ọ̀run[a] mì—kì í ṣe ilẹ̀ nìkan, ṣùgbọ́n ọ̀run pẹ̀lú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘ojú ọ̀run.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan pẹ̀lú atọ́ka, ní tààrà, ‘ọ̀run náà.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a fa yọ láti Hágáì 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ
  choice: ẹni tí … rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe-ìní yìí ń tọ́ka sí Ọlọ́run nínú àyíká ẹsẹ tó ṣáájú; ìṣètò ‘ẹni tí … rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti so ohùn náà mọ́ ẹni náà.
- source_word: ἡ φωνὴ
  choice: ohùn
  rationale: ‘Ohùn’ bá ọ̀rọ̀ nípa Ọlọ́run tó ń sọ̀rọ̀ àti ìrántí Sínáì mu ju ọ̀rọ̀ tó túmọ̀ sí ariwo lásán lọ.
- source_word: ἐσάλευσεν
  choice: mú … mì
  rationale: Ìṣètò olùfa yìí jẹ́ Yorùbá àdánidá fún ohun tó fa ilẹ̀ láti mì, ó sì pa agbára ìṣẹ̀lẹ̀ náà mọ́.
- source_word: τὴν γῆν
  choice: ilẹ̀
  rationale: Nítorí a fi í wé ọ̀run, ‘ilẹ̀’ ń tọ́ka sí gbogbo ilẹ̀ ayé, kì í ṣe agbègbè kan ṣoṣo.
- source_word: τότε / νῦν δὲ
  choice: nígbà náà / ṣùgbọ́n nísinsin yìí
  rationale: Àwọn ọ̀rọ̀ yìí pa ìyàtọ̀ tó wà láàárín ìṣẹ̀lẹ̀ àtijọ́ àti ìlérí tó dúró nísinsin yìí mọ́.
- source_word: ἐπήγγελται
  choice: ó ti ṣe ìlérí
  rationale: Ó fi ìtumọ̀ ìlérí tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí agbára rẹ̀ ṣì wà hàn.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti ṣáájú ọ̀rọ̀ tí a fa yọ tààrà.
- source_word: Ἔτι ἅπαξ
  choice: Lẹ́ẹ̀kan sí i
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa èrò ìgbà kan sí i mọ́ láì fi àlàyé míì kún un.
- source_word: σείσω
  choice: èmi yóò mú … mì
  rationale: Ó pa àwòrán ìmìtìtì ọ̀run àti ilẹ̀ àti ẹni àkọ́kọ́ tó tẹnumọ́ ‘èmi’ mọ́.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: kì í ṣe … nìkan … ṣùgbọ́n … pẹ̀lú
  rationale: Èyí ni ìṣètò Yorùbá àdánidá tó fi ohun kejì kún àkọ́kọ́ pẹ̀lú ìtẹnumọ́.
- source_word: τὸν οὐρανόν
  choice: ọ̀run
  rationale: ‘Ọ̀run’ bá ọ̀rọ̀ ẹyọ kan nínú Gíríìkì mu, ó sì pa ìlòdì sí ‘ilẹ̀’ mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ojú ọ̀run lásán.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí àti ẹni tó ṣe ìlérí
  choice: Ọlọ́run ni ẹni tí ohùn rẹ̀ mú ilẹ̀ mì, òun náà sì ni ó ṣe ìlérí náà.
  alternative: Ìtúmọ̀ tí kò sọ ẹni náà di mímọ̀ tó bẹ́ẹ̀.
  rationale: Àyíká tó sún mọ́ ẹsẹ yìí àti ọ̀rọ̀ tí a fa yọ láti Hágáì fi Ọlọ́run hàn gẹ́gẹ́ bí olùsọ̀rọ̀; a kò fi ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìwọ̀n ìtumọ̀ ilẹ̀ àti ọ̀run
  choice: ‘ilẹ̀’ àti ‘ọ̀run’ gẹ́gẹ́ bí apá méjì tó gbòòrò ti gbogbo ohun ìṣẹ̀dá
  alternative: ‘agbègbè ilẹ̀’ àti ‘ojú ọ̀run’
  rationale: Ìlòdì ọ̀rọ̀ Gíríìkì náà ní agbára àgbáyé; yíyan ọ̀rọ̀ tó gbòòrò pa agbára àsọtẹ́lẹ̀ náà mọ́ láì sọ bí ìṣẹ̀lẹ̀ náà yóò ṣe rí ní pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Mú … mì’ jẹ́ àdánidá ju lílo ‘mì’ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe aláàbò ara rẹ̀ lọ. A gbé [a] lẹ́yìn ‘ọ̀run’ nítorí ibẹ̀ ni àlàyé ọ̀rọ̀ náà tọ́ sí, a sì gbé [b] sí ibi tí ọ̀rọ̀ tí a fa yọ ti bẹ̀rẹ̀.
