  source_fidelity: Ìtumọ̀ náà ń mú ìtakò wọn sí ẹ̀ṣẹ̀ àti àwòrán ìjà tí ń lọ lọ́wọ́ wá dáadáa. Síbẹ̀, ‘yóò fi dà sílẹ̀’ ń fi àkókò ọjọ́ iwájú kún un, nígbà tí Gíríìkì ń sọ pé wọn kò tíì dé ààlà ìtàjẹ̀ ẹ̀jẹ̀. Yíyọ ‘yóò’ kúrò ń pa ìtumọ̀ náà mọ́ dáadáa.
