base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: yo
  text: Ẹ kò tíì tako ẹ̀ṣẹ̀ dé ibi tí ẹ̀jẹ̀ fi dà sílẹ̀, bí ẹ ti ń bá a jà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kò tíì tako dé ẹ̀jẹ̀.” Gíríìkì náà ní ọ̀rọ̀ sí ọ̀rọ̀ pé, “Ẹ kò tíì tako dé ẹ̀jẹ̀,” àpẹẹrẹ ọ̀rọ̀ kan tó túmọ̀ sí ìtakò dé ibi ìtàjẹ̀ ẹ̀jẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: Ẹ kò tíì
  rationale: Ó fi hàn pé wọn kò tíì dé ààlà tí a sọ; ‘kò tíì’ ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: μέχρις αἵματος
  choice: dé ibi tí ẹ̀jẹ̀ yóò fi dà sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kí ìtakò dé ààlà ìtàjẹ̀ sílẹ̀; ìtumọ̀ yìí ṣe àlàyé àṣà-ọrọ Gíríìkì náà láì sọ pàtó bóyá ó jẹ́ ìfarapa tàbí ikú ajẹ́rìíkú.
- source_word: ἀντικατέστητε
  choice: tako
  rationale: Ó túmọ̀ sí dídúró lòdì sí tàbí kíkojú ohun kan; ‘tako’ bá àwòrán ìjà nínú ẹsẹ náà mu.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: ẹ̀ṣẹ̀
  rationale: πρός pẹ̀lú accusative fi ohun tí ìtakò dojú kọ hàn. A pa ‘ẹ̀ṣẹ̀’ mọ́ ní ìtumọ̀ gbígbòòrò láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἀνταγωνιζόμενοι
  choice: bí ẹ ti ń bá a jà
  rationale: Participle náà ní àwòrán ìdíje tàbí ìjà tí ń lọ lọ́wọ́, ó sì ṣàlàyé bí wọn ṣe ń tako ẹ̀ṣẹ̀.
theological_decisions:
- issue: Ohun tí ‘ẹ̀ṣẹ̀’ ń tọ́ka sí nínú àyíká ọ̀rọ̀
  choice: A túmọ̀ ọ́ ní gbígbòòrò sí ‘ẹ̀ṣẹ̀.’
  alternative: Àtakò ẹlẹ́ṣẹ̀ láti ọ̀dọ̀ àwọn onínúnibíni, ẹ̀ṣẹ̀ ní gbogbogbòò, tàbí ìdẹwò láti kọ ìgbàgbọ́ sílẹ̀.
  rationale: Ẹsẹ náà kò dá ohun tí ‘ẹ̀ṣẹ̀’ tọ́ka sí pàtó; fífi ọ̀rọ̀ gbígbòòrò náà sílẹ̀ ń pa àìdánilójú àti ẹ̀dọfu ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbo. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ẹni kejì plural.
