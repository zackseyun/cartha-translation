  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: yo
  text: Ẹ fara dà fún ìbáwí[a]; Ọlọ́run ń hù sí yín gẹ́gẹ́ bí ó ti ń hù sí àwọn ọmọkùnrin[b]. Nítorí ọmọkùnrin wo ni baba kì í bá wí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ fara dà á gẹ́gẹ́ bí ìbáwí.” Gíríìkì lè túmọ̀ sí pé kí wọn fara dà fún ìbáwí, tàbí pé kí wọn ka ohun tí wọ́n ń fara dà sí ìbáwí.
    reason: alternative_reading
  - marker: b
    text: Gíríìkì ní “ọmọkùnrin.” Ọ̀rọ̀ náà ń tẹ̀ lé àfiwé baba àti ọmọkùnrin nínú ìjiyàn yìí; ìlò rẹ̀ kò kan àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: fún ìbáwí
  rationale: 'Ó pa ìtumọ̀ ète tàbí àbájáde mọ́: fífaradà wọn ní í ṣe pẹ̀lú ìtọ́ni àti àtúnṣe tí Ọlọ́run ń ṣe. Àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn tí Gíríìkì lè gbà yé wa hàn.'
- source_word: ὑπομένετε
  choice: Ẹ máa fara dà á
  rationale: Ọ̀rọ̀ náà lè jẹ́ gbólóhùn ìròyìn tàbí àṣẹ ní ìrísí, ṣùgbọ́n àyíká rẹ̀ jẹ́ kí ìkìlọ̀-ìṣírí tàbí àṣẹ bá a mu jù. Arọ́pò-orúkọ “á” ń tọ́ka sí ìnira inú àyíká, láì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: ὡς υἱοῖς
  choice: bí ọmọkùnrin
  rationale: Èyí pa àfiwé ìbáṣepọ̀ baba àti ọmọkùnrin mọ́, gẹ́gẹ́ bí ìjiyàn inú ẹsẹ náà ṣe ń béèrè.
- source_word: προσφέρεται
  choice: ń bá yín lò
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí bí Ọlọ́run ṣe ń hù sí wọn tàbí ṣe ń tọ́jú wọn; “ń bá yín lò” jẹ́ Yorùbá àdánidá tó mú ìtumọ̀ ìbáṣepọ̀ náà jáde.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: Nítorí ọmọkùnrin wo ni baba kì í bá wí?
  rationale: Ó pa agbára ìbéèrè àsọyé náà mọ́. “Bá wí” tún so mọ́ “ìbáwí,” ó sì ní ìtumọ̀ àtúnṣe àti ìtọ́ni tó wà nínú παιδεύω.
theological_decisions:
- issue: Èdè akọ nínú àfiwé baba àti ọmọkùnrin
  choice: Pa “ọmọkùnrin” mọ́ nínú ọ̀rọ̀ àkọ́kọ́
  alternative: ọmọ
  rationale: Gíríìkì lo υἱός, ìjiyàn náà sì dá lórí àfiwé baba àti ọmọkùnrin. Síbẹ̀, ìlò rẹ̀ kan gbogbo àwọn onígbàgbọ́, kì í ṣe àwọn ọkùnrin nìkan; a ṣàlàyé èyí ní àlàyé ìsàlẹ̀.
- issue: Bóyá εἰς παιδείαν jẹ́ ète tàbí bí a ṣe yẹ kí a ka ìnira náà sí
  choice: “fún ìbáwí” nínú ọ̀rọ̀ àkọ́kọ́
  alternative: “ẹ fara da èyí bí ìbáwí”
  rationale: Ìtumọ̀ ète/àbájáde bá ìṣàn Gíríìkì mu, ṣùgbọ́n ìtumọ̀ kejì tún ṣeé ṣe. A kò fi ọ̀kan pa èkejì rẹ́; àlàyé ìsàlẹ̀ pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. “Ẹ máa fara dà á” ní agbára ìṣírí tó ń bá a lọ; “ń bá yín lò” jẹ́ ọ̀rọ̀ àdánidá fún ìṣe Ọlọ́run sí wọn. Àmì ohùn ni a fi sí ibi tí ó yẹ.
