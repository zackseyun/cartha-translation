id: HEB.12.10
reference: Hebrews 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: yo
  text: Nítorí àwọn baba wa tọ́ wa sọ́nà fún ọjọ́ díẹ̀[a], gẹ́gẹ́ bí ohun tí ó dára jù lójú wọn[b]; ṣùgbọ́n òun ń ṣe bẹ́ẹ̀ fún àǹfààní wa, kí a lè ní ìpín nínú ìjẹ́mímọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àkókò kúkúrú.” Gbólóhùn Gíríìkì náà tẹnu mọ́ ààlà àkókò tí àwọn baba ayé fi ń tọ́ ọmọ wọn sọ́nà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ohun tí ó tọ́ lójú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: fún ọjọ́ díẹ̀
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ ti ‘ọjọ́ díẹ̀’ mọ́, ó sì fi hàn pé àkókò ìtọ́sọ́nà àwọn baba ayé ní ààlà.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: gẹ́gẹ́ bí ohun tí ó dára jù lójú wọn
  rationale: Èyí sọ pé wọ́n ṣe é ní ìbámu pẹ̀lú ìdájọ́ ara wọn, láìsọ pé ìdájọ́ náà pé tàbí pé kò pé.
- source_word: ἐπαίδευον
  choice: tọ́ wa sọ́nà
  rationale: ‘Tọ́ ... sọ́nà’ ní Yorùbá gba ìtumọ̀ ìkọ́ni, àtúnṣe àti ìbáwí òbí, láìdín ọ̀rọ̀ náà kù sí ìjìyà nìkan.
- source_word: ὁ δὲ
  choice: ṣùgbọ́n òun ń ṣe bẹ́ẹ̀
  rationale: ‘Òun’ tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ọ̀rọ̀ tó yí ẹsẹ náà ká ṣe fi hàn, nígbà tí ‘ń ṣe bẹ́ẹ̀’ mú ìṣe tí Gíríìkì fi sílẹ̀ láìtún sọ di mímọ̀ ní Yorùbá.
- source_word: ἐπὶ τὸ συμφέρον
  choice: fún àǹfààní wa
  rationale: Ó mú ète ìṣe Ọlọ́run àti ire tí ó ń wá fún wa jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: kí a lè ní ìpín nínú
  rationale: Ó pa agbára ète tàbí àbájáde inú gbólóhùn Gíríìkì mọ́, ó sì tú μεταλαμβάνω sí Yorùbá àdánidá.
- source_word: ἁγιότητος αὐτοῦ
  choice: ìjẹ́mímọ́ rẹ̀
  rationale: ‘Ìjẹ́mímọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ànímọ́ mímọ́ Ọlọ́run; ‘rẹ̀’ sì pa arọ́pò-orúkọ Gíríìkì mọ́.
theological_decisions:
- issue: Ẹni tí ὁ δὲ ń tọ́ka sí
  choice: A lo arọ́pò-orúkọ ‘òun’ fún Ọlọ́run.
  alternative: Kí a fi ‘Ọlọ́run’ sí i ní tààràtà.
  rationale: Àyíká Hébérù 12 fi Ọlọ́run gẹ́gẹ́ bí Baba wé àwọn baba ayé. Arọ́pò-orúkọ náà pa àìsọ orúkọ rẹ̀ ní tààràtà bíi ti Gíríìkì mọ́, ṣùgbọ́n ó ṣì ṣe kedere nínú àyíká.
- issue: Níní ìpín nínú ìjẹ́mímọ́ Ọlọ́run
  choice: A sọ ọ́ gẹ́gẹ́ bí níní ìpín nínú ìjẹ́mímọ́ rẹ̀, láìṣàlàyé ọ̀nà ẹ̀kọ́ ìsìn kan pàtó.
  alternative: Kí a tú u sí ìjẹ́mímọ́ ipò nìkan tàbí ìyípadà ìwà díẹ̀díẹ̀ nìkan.
  rationale: Ọ̀rọ̀ náà sọ ète ìtọ́sọ́nà Ọlọ́run, ṣùgbọ́n kò ṣe àlàyé nípa gbogbo ọ̀nà tí ìpín yìí gbà ń ṣẹlẹ̀; ìtumọ̀ náà pa ìwọ̀n àti ìdíjú ẹ̀kọ́ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. ‘Tọ́ wa sọ́nà’ ni a yàn láti gba ìtumọ̀ ìkọ́ni, ìbáwí àti àtúnṣe òbí pọ̀; a sì lo ‘òun’ fún ìtẹnumọ́ ìyàtọ̀ láàárín àwọn baba ayé àti Ọlọ́run.
