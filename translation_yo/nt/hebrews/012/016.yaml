id: HEB.12.16
reference: Hebrews 12:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: yo
  text: Kí ẹnikẹ́ni má ṣe jẹ́ oníṣekúṣe tàbí aláìbọ̀wọ̀ fún ohun mímọ́ bí Ésáù, ẹni tí ó ta ẹ̀tọ́ àkọ́bí tirẹ̀ fún oúnjẹ kan ṣoṣo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: oníṣekúṣe
  rationale: Ó túmọ̀ sí ẹni tí ń ṣe ìwà ìbálòpọ̀ tí kò tọ́; ọ̀rọ̀ yìí jẹ́ kedere, ó sì yẹ fún èdè Yorùbá ọlọ́lá.
- source_word: βέβηλος
  choice: aláìbọ̀wọ̀ fún ohun mímọ́
  rationale: Nínú Gíríìkì, ọ̀rọ̀ náà tọ́ka sí ẹni tí ń ka ohun mímọ́ sí ohun lasán tàbí tí kò bọ̀wọ̀ fún un. Èyí pa ìtumọ̀ náà mọ́ láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: πρωτοτόκια
  choice: ẹ̀tọ́ àkọ́bí
  rationale: Ó tọ́ka sí àwọn ẹ̀tọ́ àti àǹfààní ẹni àkọ́bí; ‘ẹ̀tọ́ àkọ́bí’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: nítorí oúnjẹ ẹ̀ẹ̀kan ṣoṣo
  rationale: Ó fi pàṣípààrọ̀ ẹ̀tọ́ àkọ́bí fún jíjẹ oúnjẹ lẹ́ẹ̀kan hàn ní èdè Yorùbá tí ó rọrùn.
- source_word: ἀπέδετο
  choice: ta
  rationale: Ìṣe náà túmọ̀ sí títà tàbí fífi ohun kan fún ẹlòmíràn ní pàṣípààrọ̀; ‘ta’ bá ìtàn Jẹ́nẹ́sísì mu.
theological_decisions:
- issue: Ìtumọ̀ βέβηλος nípa Ẹ́sáù
  choice: aláìbọ̀wọ̀ fún ohun mímọ́
  alternative: aláìní Ọlọ́run
  rationale: ‘Aláìbọ̀wọ̀ fún ohun mímọ́’ fara mọ́ ìtumọ̀ βέβηλος gẹ́gẹ́ bí ohun tí a sọ di lasán tàbí tí a kò kà sí mímọ́. Ó tún bá bí Ẹ́sáù ṣe fojú kéré ẹ̀tọ́ àkọ́bí mu, láìsọ ní pàtó pé kò ní ìgbàgbọ́ nínú Ọlọ́run.
- issue: Bóyá πόρνος ń ṣàpèjúwe Ẹ́sáù tàbí ó jẹ́ ìkìlọ̀ ọ̀tọ̀
  choice: Fi àìdánilójú gírámà náà sílẹ̀ nínú gbólóhùn kan
  alternative: Ṣàlàyé pé ‘oníṣekúṣe’ ń tọ́ka sí ẹlòmíràn, ṣùgbọ́n ‘aláìbọ̀wọ̀ fún ohun mímọ́’ nìkan ni ó ń ṣàpèjúwe Ẹ́sáù
  rationale: Ìṣètò Gíríìkì lè jẹ́ kí ‘bí Ẹ́sáù’ bá àwọn àpèjúwe méjèèjì tàbí èkejì nìkan mu. Ìtumọ̀ náà kò fi ọ̀rọ̀ àlàyé kún un láti yanju ohun tí orísun fi sílẹ̀ ní àìdánilójú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbo ènìyàn. A yàgò fún ‘aláìní Ọlọ́run’ nítorí pé ó lè túmọ̀ βέβηλος lọ́nà tóóró ju orísun lọ.
