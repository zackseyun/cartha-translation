  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìṣọ̀kan ìjíròrò náà, àwòrán ìkùukùu àwọn ẹlẹ́rìí, àti ìṣírí láti sá nínú eré ìje mọ́. Síbẹ̀, ‘bí àwa náà ti ní’ kò fi ipa ìdí (‘since/having’) hàn dáadáa, ìsopò ‘fi ... sílẹ̀, àti ẹ̀ṣẹ̀’ sì lè dà bí ẹni pé ẹ̀ṣẹ̀ náà kò wà lábẹ́ ìṣe ‘fí silẹ̀.’ ‘Tí a gbé kalẹ̀’ tún sọ olùṣe kan di mímọ̀ níbi tí Gíríìkì ti fi ọ̀rọ̀ náà sípò àìṣiṣẹ́ ẹni. Àtúnṣe náà ṣètò àwọn wọ̀nyí láì yí ìtumọ̀ padà.
  naturalness: ‘Níwọ̀n bí ... ti ní’ jẹ́ ọ̀nà Yorùbá tó hàn gbangba fún ìdí tí a fi ń gbàni níyànjú. ‘Bọ́ ... kúrò’ sì so ‘gbogbo ẹrù’ àti ‘ẹ̀ṣẹ̀’ pọ̀ mọ́ra ní ti gírámà. ‘Sá nínú eré ìje’ jẹ́ ìkọ̀lé tí ó dára jù ‘sáré eré ìje’ lọ nínú Yorùbá òde òní.
  terminology: ‘Àwọn ẹlẹ́rìí,’ ‘ẹ̀ṣẹ̀,’ ‘ìfaradà,’ àti ‘eré ìje’ yẹ, wọ́n sì pa àwòrán àti ìforígbárí ìtumọ̀ Gíríìkì mọ́. A dá ‘gbogbo ẹrù’ sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ ὄγκον, láì fi ‘ìdíwọ́’ kún un gẹ́gẹ́ bí apá kan tí kò sí nínú ọ̀rọ̀ ìpilẹ̀.
