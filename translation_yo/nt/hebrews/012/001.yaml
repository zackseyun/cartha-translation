id: HEB.12.1
reference: Hebrews 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí àwa náà ti ní ìkùukùu àwọn ẹlẹ́rìí púpọ̀ tó bẹ́ẹ̀ yí wa ká, ẹ jẹ́ kí a bọ́ gbogbo ẹrù àti ẹ̀ṣẹ̀ tí ó rọrùn láti dì mọ́ wa[a] kúrò, kí a sì fi ìfaradà sá nínú eré ìje tí ó wà níwájú wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀ṣẹ̀ tí ó lẹ̀ mọ́ wa tímọ́tímọ́,” tàbí “ẹ̀ṣẹ̀ tí ń tètè dẹkùn mú wa.” Ọ̀rọ̀ àpèjúwe Gíríìkì náà kì í sábà farahàn; ó lè tẹnu mọ́ ẹ̀ṣẹ̀ tí ń dì mọ́ni, tí ń dẹkùn múni, tàbí tí ó lẹ̀ mọ́ni tímọ́tímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a sọ ṣáájú, pàápàá jù lọ ní orí kọkànlá.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: ìkùukùu àwọn ẹlẹ́rìí tí ó pọ̀ tó bẹ́ẹ̀
  rationale: Ó pa àwòrán ìkùukùu mọ́, ó sì sọ bí ọ̀pọ̀ àwọn ẹlẹ́rìí náà ti pọ̀ tó.
- source_word: περικείμενον ἡμῖν
  choice: yí wa ká
  rationale: Gbólóhùn Yorùbá àdánidá ni fún ohun tí ó wà káàkiri ẹni ní gbogbo ẹ̀gbẹ́.
- source_word: μαρτύρων
  choice: àwọn ẹlẹ́rìí
  rationale: Ó pa ìtumọ̀ àwọn tí ń jẹ́rìí mọ́ láì pinnu pé àwọn náà jẹ́ olùwòran eré nìkan.
- source_word: ὄγκον πάντα
  choice: gbogbo ẹrù ìdíwọ́
  rationale: Ó so ìtumọ̀ ẹrù tàbí ohun wúwo pọ̀ mọ́ ipa rẹ̀ gẹ́gẹ́ bí ohun tí ń fa eléré dúró.
- source_word: ἀποθέμενοι
  choice: fi ... sílẹ̀
  rationale: Ó sọ ìṣe pípinnu láti mú ohun tí ń díni lọ́wọ́ kúrò ní ọ̀nà, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé.
- source_word: εὐπερίστατον
  choice: tí ń rọrùn láti dì mọ́ wa
  rationale: Ó bá àwòrán eré ìje mu nípa ẹ̀ṣẹ̀ tí ń dì mọ́ eléré, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- source_word: ἁμαρτίαν
  choice: ẹ̀ṣẹ̀ náà
  rationale: Akọ́lé inú Gíríìkì ń wo ẹ̀ṣẹ̀ gẹ́gẹ́ bí ohun pàtó nínú ọ̀rọ̀ yìí, láì sọ pé ẹ̀ṣẹ̀ kan ṣoṣo tí a dárúkọ ni.
- source_word: δι’ ὑπομονῆς
  choice: fi ìfaradà
  rationale: Ó ṣàfihàn dídúró ṣinṣin lábẹ́ ìṣòro ní ọ̀nà tó bá ìṣírí eré ìje mu.
- source_word: τρέχωμεν
  choice: ẹ jẹ́ kí a ... sáré
  rationale: Ó túmọ̀ ìṣírí ẹni àkọ́kọ́ ọ̀pọ̀ nínú ọ̀rọ̀-ìṣe náà ní Yorùbá àdánidá.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: eré ìje tí a gbé kalẹ̀ níwájú wa
  rationale: Nítorí ọ̀rọ̀-ìṣe ‘sáré,’ ‘eré ìje’ bá àyíká mu jù ‘ìjà’ tàbí ‘ìdíje’ lọ, ‘tí a gbé kalẹ̀ níwájú wa’ sì pa èrò ipa-ọ̀nà tí a yàn mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn ẹlẹ́rìí’ ní ìbáṣepọ̀ pẹ̀lú Hébérù 11
  choice: Àwọn tí ìgbésí ayé wọn jẹ́rìí sí ìgbàgbọ́, tí àwòrán yíyí wa ká sì ń fún wa níṣìírí
  alternative: Àwọn olùwòran ọ̀run tí iṣẹ́ pàtàkì wọn ni wíwo àwọn onígbàgbọ́ tí ń sáré
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí àwọn àpẹẹrẹ orí kọkànlá. Ìtumọ̀ náà pa ‘ẹlẹ́rìí’ mọ́, kò sì fi kún un pé wọ́n ń wo wa ní ti gidi, nítorí náà ó pa àìdánilójú ìtumọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó ṣe kedere fún òǹkàwé òde òní; a pa àwòrán ìkùukùu àti eré ìje mọ́, pẹ̀lú àmì ohùn ní ibi tí ó yẹ.
