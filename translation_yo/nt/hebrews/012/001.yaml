    rationale: Ó lè jẹ́ kí òǹkàwé ka ‘ẹ̀ṣẹ̀’ sí ohun tí a kàn daríkọ lẹ́yìn ìṣe ‘fí sílẹ̀,’ dípò ohun kejì tí a gbọdọ̀ bọ́ kúrò gẹ́gẹ́ bí Gíríìkì ṣe so pọ̀.
