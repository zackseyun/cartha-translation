id: HEB.12.27
reference: Hebrews 12:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: yo
  text: Ọ̀rọ̀ náà, “Lẹ́ẹ̀kan sí i,” fi hàn pé àwọn ohun tí a ń mì—gẹ́gẹ́ bí àwọn ohun tí a ti ṣe[a]—ni a ó yọ kúrò, kí àwọn ohun tí a kò ń mì[b] lè dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àwọn ohun tí a dá.” Ní Gíríìkì, ó túmọ̀ ní tààrà pé, “gẹ́gẹ́ bí àwọn ohun tí a ti ṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ohun tí kò ṣeé mì” tàbí “ohun tí kò lè mì.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Gbólóhùn náà, “Lẹ́ẹ̀kan sí i,”
  rationale: Àpilẹ̀kọ ọ̀rọ̀-àpèjúwe τὸ sọ gbólóhùn tí a fa yọ náà di ohun tí òǹkọ̀wé ń ṣàlàyé. “Gbólóhùn náà” jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ọ̀rọ̀ tí a fa yọ; “Lẹ́ẹ̀kan sí i” sì pa ìtumọ̀ ἔτι ἅπαξ mọ́.
- source_word: δηλοῖ
  choice: fi hàn pé
  rationale: Ó ṣàfihàn àlàyé tàbí ìpinnu tí òǹkọ̀wé ń mú jáde láti inú gbólóhùn tí a fa yọ, ní èdè Yorùbá tí ó ṣe kedere.
- source_word: τῶν σαλευομένων
  choice: àwọn ohun tí a ń mì
  rationale: Ìṣe àbọ̀ tí ó ń lọ lọ́wọ́ nínú present passive participle ni a fi “a ń mì” hàn; ó tún pa ìyàtọ̀ rẹ̀ mọ́ sí àwọn ohun tí a kò ń mì.
- source_word: μετάθεσιν
  choice: ni a ó yọ kúrò
  rationale: Nínú àyíká ọ̀rọ̀ yìí, μετάθεσις túmọ̀ sí yíyọ kúrò ju kìkàn yí padà lọ. Ìṣètò “ni a ó yọ kúrò” jẹ́ àdánidá ní Yorùbá, ó sì fi ohun tí yíyọ náà kàn sí iwájú.
- source_word: ὡς πεποιημένων
  choice: gẹ́gẹ́ bí àwọn ohun tí a ti ṣe
  rationale: “A ti ṣe” pa ìṣe àbọ̀ pípé ti πεποιημένων mọ́, “gẹ́gẹ́ bí” sì ṣàfihàn ὡς láì sọ ọ́ di àlàyé tí ó ju orísun lọ.
- source_word: ἵνα μείνῃ
  choice: kí ... lè dúró
  rationale: Ó fi ète tàbí àbájáde hàn ní Yorùbá àdánidá, ó sì pa agbára subjunctive mọ́.
- source_word: τὰ μὴ σαλευόμενα
  choice: àwọn ohun tí a kò ń mì
  rationale: Ìtumọ̀ yìí pa ìfarajọ ọ̀rọ̀ mọ́ pẹ̀lú “àwọn ohun tí a ń mì,” kò sì fi ìtumọ̀ àìṣeé-mì tí ẹsẹ tó tẹ̀ lé lè mú wá sínú ẹsẹ yìí láìjẹ́ dandan.
theological_decisions:
- issue: Bóyá τὰ μὴ σαλευόμενα yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ohun tí a kò ń mì tàbí ohun tí kò ṣeé mì
  choice: àwọn ohun tí a kò ń mì
  alternative: àwọn ohun tí kò ṣeé mì / ohun tí kò lè mì
  rationale: 'Ọ̀rọ̀ Gíríìkì ṣe ìyàtọ̀ láàárín present participle méjì: ohun tí a ń mì àti ohun tí a kò ń mì. Yíyan ọ̀nà tó sún mọ́ ìlànà ọ̀rọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́, dípò kí a yára mú un bá “ìjọba tí kò ṣeé mì” ní ẹsẹ tó tẹ̀ lé mu.'
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “Gbólóhùn náà” fún ọ̀rọ̀ tí a fa yọ, “ni a ó yọ kúrò” fún ìtumọ̀ yíyọ kúrò, a sì pa ìfarajọ “àwọn ohun tí a ń mì / àwọn ohun tí a kò ń mì” mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
