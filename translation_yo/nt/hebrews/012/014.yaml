id: HEB.12.14
reference: Hebrews 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: yo
  text: Ẹ máa lépa àlàáfíà pẹ̀lú gbogbo ènìyàn, àti ìwà mímọ́[a]; láìsí rẹ̀, kò sí ẹni tí yóò rí Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìsọdimímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwà mímọ́ gẹ́gẹ́ bí ànímọ́ ìgbésí ayé, tàbí sí ipò tàbí ìlànà jíjẹ́ ẹni mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: àlàáfíà
  rationale: Nínú ọ̀rọ̀ yìí, εἰρήνη túmọ̀ sí gbígbé ní àlàáfíà pẹ̀lú àwọn ẹlòmíràn, kì í ṣe ìfọ̀kànbalẹ̀ inú nìkan.
- source_word: διώκετε
  choice: Ẹ máa lépa
  rationale: διώκω fi ìsapá alágbára hàn. “Ẹ máa lépa” tún fi àṣẹ sí ọ̀pọ̀ ènìyàn àti ìṣe tí wọ́n gbọ́dọ̀ máa bá a lọ hàn.
- source_word: μετὰ πάντων
  choice: pẹ̀lú gbogbo ènìyàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi gbogbo àwọn ènìyàn tí àṣẹ náà kan hàn.
- source_word: τὸν ἁγιασμόν
  choice: ìwà mímọ́
  rationale: ἁγιασμός lè tọ́ka sí ìwà mímọ́ tàbí sí ìsọdimímọ́ gẹ́gẹ́ bí ipò tàbí ìlànà. “Ìwà mímọ́” jẹ́ èdè tó ṣe kedere, tó sì bá ọ̀rọ̀ ìyànjú yìí mu; àlàyé ìtumọ̀ kejì wà ní àlàyé ìsàlẹ̀.
- source_word: οὗ χωρὶς
  choice: láìsí rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò ẹyọ kan náà tọ́ka sí ἁγιασμός. “Láìsí rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtọ́kasí yẹn mọ́.
- source_word: οὐδεὶς
  choice: kò sí ẹni
  rationale: Èyí fi ìkọ̀sẹ̀ pátápátá ti οὐδείς hàn ní Yorùbá àdánidá.
- source_word: ὄψεται
  choice: yóò rí
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó ṣe kedere fún ọ̀rọ̀ ọjọ́ iwájú ὄψεται.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: A pa orúkọ oyè κύριος mọ́ láì sọ ní pàtó bóyá ó ń tọ́ka sí Ọlọ́run Baba tàbí sí Jésù Olúwa.
theological_decisions:
- issue: Ìtumọ̀ ἁγιασμός nínú ọ̀rọ̀ ìyànjú
  choice: ìwà mímọ́
  alternative: ìsọdimímọ́
  rationale: “Ìwà mímọ́” sọ ohun tí a ní láti máa lépa nínú ìgbésí ayé di mímọ́ fún òǹkàwé, láìpa ìtumọ̀ ìyàsọ́tọ̀ fún Ọlọ́run rẹ́. Àlàyé ìsàlẹ̀ pa ìtumọ̀ “ìsọdimímọ́” mọ́.
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “Olúwa.”
  alternative: Ọlọ́run; Jésù Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì sọ “Olúwa” nìkan. Ìtumọ̀ náà kò pinnu ẹni tí ọ̀rọ̀ orísun kò sọ ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Ẹ máa lépa” láti fi àṣẹ sí ọ̀pọ̀ ènìyàn àti ìsapá tí ń bá a lọ hàn. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ “ìwà mímọ́,” nítorí ọ̀rọ̀ yẹn ni àlàyé náà ń ṣàlàyé.
