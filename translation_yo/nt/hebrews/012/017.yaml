id: HEB.12.17
reference: Hebrews 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: yo
  text: Nítorí ẹ mọ̀ pé nígbà tó yá, nígbà tí ó fẹ́ jogún ìbùkún náà, a kọ̀ ọ́, nítorí kò rí ààyè fún ìrònúpìwàdà[a], bí ó tilẹ̀ jẹ́ pé ó fi omijé wá a gidigidi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘kò rí ibi fún ìrònúpìwàdà.’ Èyí lè túmọ̀ sí pé kò rí àǹfààní láti yí àbájáde náà padà, tàbí pé kò lè mú kí Ísáákì yí ọkàn rẹ̀ padà.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ ‘a’ lè tọ́ka sí ‘ìbùkún náà,’ tàbí—bó tilẹ̀ jẹ́ pé ó ṣeé ṣe díẹ̀ sí i—sí ‘ìrònúpìwàdà/ààyè’ náà. Gíríìkì kò mú ohun tí ó ń tọ́ka sí dájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: ẹ mọ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí àwọn olùgbọ́ ti mọ̀ tẹ́lẹ̀; ‘ẹ mọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: μετέπειτα
  choice: nígbà tó yá
  rationale: Ó túmọ̀ sí àkókò tí ó tẹ̀ lé e; gbólóhùn yìí jẹ́ ti Yorùbá òde òní, ó sì bá ọ̀rọ̀ ìkìlọ̀ náà mu.
- source_word: θέλων
  choice: nígbà tí ó fẹ́
  rationale: A tú participle náà sí gbólóhùn àkókò láti mú kí Yorùbá náà rọrùn, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: κληρονομῆσαι
  choice: jogún
  rationale: ‘Jogún’ sọ ìtumọ̀ gbígba ohun gẹ́gẹ́ bí ogún ní ṣókí àti ní èdè àdánidá.
- source_word: τὴν εὐλογίαν
  choice: ìbùkún náà
  rationale: Àmì ìdánimọ̀ Gíríìkì ń tọ́ka sí ìbùkún pàtó inú ìtàn Ésáù; ‘náà’ pa ìtọ́kasí yẹn mọ́.
- source_word: ἀπεδοκιμάσθη
  choice: a kọ̀ ọ́ sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí a kọ̀ tàbí tí a kò tẹ́wọ́ gbà, láìsọ ọ́ di ọ̀rọ̀ ìgbàlà ní pàtó.
- source_word: μετανοίας ... τόπον
  choice: ààyè fún ìrònúpìwàdà
  rationale: ‘Ààyè fún’ mú ìtumọ̀ idiom náà jáde gẹ́gẹ́ bí àǹfààní tàbí ọ̀nà tí ó ṣí sílẹ̀, nígbà tí ‘ìrònúpìwàdà’ pa ọ̀rọ̀ pàtàkì náà mọ́.
- source_word: καίπερ
  choice: bí ó tilẹ̀ jẹ́ pé
  rationale: Ó fi ìyàtọ̀ tí concessive conjunction náà ń fi hàn jáde lọ́nà Yorùbá tí ó mọ́.
- source_word: μετὰ δακρύων
  choice: ó fi omijé
  rationale: Èyí sọ ọ̀nà tí ó gbà wá ohun náà, ó sì pa àwòrán omijé inú orísun mọ́.
- source_word: ἐκζητήσας
  choice: wá a gidigidi
  rationale: ‘Wá’ sọ ìṣe wíwá náà, ‘gidigidi’ sì mú agbára tí πρόθεμα ἐκ- lè fún ọ̀rọ̀-ìṣe náà hàn ní Yorùbá.
- source_word: αὐτήν
  choice: a
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Yorùbá ‘a’ kò yan bóyá ohun tí a ń tọ́ka sí ni ìbùkún tàbí ìrònúpìwàdà/ààyè, nítorí náà ó pa àìdájú Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí αὐτήν (‘a’) ń tọ́ka sí àti ìtumọ̀ ‘kò rí ààyè fún ìrònúpìwàdà’
  choice: 'Ọ̀rọ̀ pàtàkì fi àìdájú náà sílẹ̀: Ésáù kò rí ààyè fún ìrònúpìwàdà, bí ó tilẹ̀ jẹ́ pé ó fi omijé ‘wá a’ gidigidi.'
  alternative: ‘A’ lè tọ́ka sí ìbùkún tí Ésáù fi omijé wá; tàbí ìrònúpìwàdà náà lè túmọ̀ sí yíyí ohun tó ti ṣẹlẹ̀ padà, títí kan pé Ísáákì kò yí ọkàn rẹ̀ padà.
  rationale: Nínú Gíríìkì, εὐλογία (‘ìbùkún’) àti μετάνοια (‘ìrònúpìwàdà/yíyí ọkàn padà’) jẹ́ orúkọ abo, nítorí náà αὐτήν lè tọ́ka sí èyíkéyìí. A kò yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan níbi tí orísun kò ti yan án.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àìdájú inú Gíríìkì mọ́.
