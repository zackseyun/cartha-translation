id: HEB.12.28
reference: Hebrews 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti ń gba ìjọba tí kò ṣeé mì, ẹ jẹ́ kí a ní oore-ọ̀fẹ́,[a] nípasẹ̀ rẹ̀ ni a lè sin Ọlọ́run lọ́nà tí ó tẹ́ Ọlọ́run lọ́rùn, pẹ̀lú ìbọ̀wọ̀ jíjinlẹ̀ àti ẹ̀rù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ jẹ́ kí a dúpẹ́.” Gbólóhùn Gíríìkì ἔχωμεν χάριν lè túmọ̀ sí “ẹ jẹ́ kí a ní oore-ọ̀fẹ́,” tàbí, gẹ́gẹ́ bí ọ̀rọ̀ àṣà, “ẹ jẹ́ kí a ní ìdúpẹ́” tàbí “kí a dúpẹ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ nípa mímì àti mímú àwọn ohun ẹ̀dá kúrò.
- source_word: βασιλείαν ἀσάλευτον
  choice: ìjọba tí kò ṣeé mì
  rationale: Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìyàtọ̀ tó wà láàárín ìjọba yìí àti àwọn ohun tí a lè mì mọ́.
- source_word: παραλαμβάνοντες
  choice: níwọ̀n bí a ti ń gba
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì ni a fi “ń gba” hàn, “níwọ̀n bí” sì so ó mọ́ ìṣírí tó tẹ̀ lé e gẹ́gẹ́ bí ìdí.
- source_word: ἔχωμεν χάριν
  choice: ẹ jẹ́ kí a ní oore-ọ̀fẹ́
  rationale: Èyí pa ìtumọ̀ χάρις gẹ́gẹ́ bí oore-ọ̀fẹ́ mọ́, ó sì jẹ́ kí δι’ ἧς tó tẹ̀ lé e tọ́ka sí i gẹ́gẹ́ bí ohun tí ó mú wa lè sin Ọlọ́run. Ìtumọ̀ míì tó ṣeé ṣe wà nínú àlàyé ìsàlẹ̀.
- source_word: δι’ ἧς
  choice: nípasẹ̀ èyí tí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí ohun èlò tí διά pẹ̀lú genitive ní mọ́, ó sì tọ́ka padà sí oore-ọ̀fẹ́ ní kedere.
- source_word: λατρεύωμεν
  choice: a fi lè máa sin
  rationale: “Sin” gba ìtumọ̀ iṣẹ́ ìsìn ẹ̀sìn tí a ń ṣe fún Ọlọ́run, láìdín in kù sí ìjọsìn inú ọkàn nìkan; “lè máa” tún fi ìṣírí àti ète inú subjunctive hàn.
- source_word: εὐαρέστως τῷ θεῷ
  choice: sin Ọlọ́run lọ́nà tí ó tẹ́ ẹ lọ́rùn
  rationale: Èyí jẹ́ Yorùbá àdánidá fún iṣẹ́ ìsìn tí Ọlọ́run tẹ́wọ́ gbà tàbí tí ó wu ú.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: pẹ̀lú ìbọ̀wọ̀ jíjinlẹ̀ àti ẹ̀rù
  rationale: “Ìbọ̀wọ̀ jíjinlẹ̀” fi ìṣọ́ra àti ọ̀wọ̀ mímọ́ εὐλάβεια hàn; “ẹ̀rù” sì pa agbára ìbẹ̀rù àti ìyanu tó wà nínú δέος mọ́.
theological_decisions:
- issue: Ìtumọ̀ χάριν nínú ἔχωμεν χάριν
  choice: oore-ọ̀fẹ́
  alternative: ìdúpẹ́ / ẹ jẹ́ kí a dúpẹ́
  rationale: Ìṣètò gbólóhùn náà jẹ́ kí δι’ ἧς tọ́ka sí oore-ọ̀fẹ́ gẹ́gẹ́ bí ohun tí a fi ń sin Ọlọ́run lọ́nà tó tẹ́ ẹ lọ́rùn. Síbẹ̀, gbólóhùn náà tún lè jẹ́ ọ̀nà àṣà láti sọ pé kí a dúpẹ́; a pa àṣàyàn yìí mọ́ nínú àlàyé ìsàlẹ̀ kí a má bà a dá ìṣòro ìtumọ̀ náà ní ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ jẹ́ kí a” fún ìṣírí àpapọ̀, “tí kò ṣeé mì” fún ọ̀rọ̀ àdánidá, àti “ìbọ̀wọ̀ jíjinlẹ̀ àti ẹ̀rù” láti pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
