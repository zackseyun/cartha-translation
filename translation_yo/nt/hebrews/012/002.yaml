id: HEB.12.2
reference: Hebrews 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: yo
  text: ká sì máa tẹjú mọ́ Jésù,[a] aṣáájú-ọ̀nà àti ẹni tí ó mú ìgbàgbọ́ dé àṣepé, ẹni tí, ní ti ayọ̀ tí a gbé kalẹ̀ níwájú rẹ̀, ó fara da àgbélébùú, kò ka ìtìjú náà sí ohun pàtàkì,[b] ó sì ti jókòó ní apá ọ̀tún ìtẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣáájú-ọ̀nà àti ẹni tí ó mú ìwà-ìṣòtítọ́ dé àṣepé,” tàbí, “aṣáájú-ọ̀nà àti ẹni tí ó mú ìgbàgbọ́ wa dé àṣepé.” Gbólóhùn Gíríìkì náà ṣókí, ọ̀rọ̀ πίστις sì tún lè túmọ̀ sí “ìwà-ìṣòtítọ́,” tàbí kí ó ń tọ́ka pàtó sí ìgbàgbọ́ àwọn onígbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó fojú kékeré wo ìtìjú náà.” Ìtumọ̀ rẹ̀ ni pé kò ka ẹ̀gàn ikú lórí àgbélébùú sí ohun tí yóò dá a dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: ká sì máa wo Jésù lójú méjèèjì
  rationale: Ó fi hàn pé kí a yí àfiyèsí kúrò lórí ohun mìíràn, kí a sì tẹjú mọ́ Jésù ní àìyẹsẹ̀; gbólóhùn náà tún bá àwòrán eré-ìje inú àyíká ọ̀rọ̀ mu.
- source_word: ἀρχηγὸν
  choice: aṣáájú-ọ̀nà
  rationale: Ó mú ìtumọ̀ ẹni tí ó bẹ̀rẹ̀ ohun kan àti ẹni tí ó ṣáájú àwọn ẹlòmíràn lójú ọ̀nà papọ̀, láìfi kún un pé ó jẹ́ ‘òǹkọ̀wé.’
- source_word: τελειωτὴν
  choice: ẹni tí ó mú ... dé àṣepé
  rationale: Àlàyé yìí ṣe àfihàn ẹni tí ó mú ohun kan dé òpin àti ète rẹ̀ ní èdè Yorùbá àdánidá.
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: A kò fi ọ̀rọ̀ arọ́pò-orúkọ ‘wa’ kún un, nítorí kò sí ní Gíríìkì; àìdánilójú bóyá ó túmọ̀ sí ìgbàgbọ́ àwọn onígbàgbọ́ tàbí ìṣòtítọ́ ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: nítorí ayọ̀ tí a gbé kalẹ̀ níwájú rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ ìfaradà sí ibi-afẹ́, èyí fi ayọ̀ ọjọ́ iwájú hàn gẹ́gẹ́ bí ohun tí ó mú un fara da ìjìyà, bó tilẹ̀ jẹ́ pé ἀντί lè túmọ̀ sí ‘dípò.’
- source_word: ὑπέμεινεν σταυρὸν
  choice: ó fara da àgbélébùú
  rationale: ‘Fara da’ sọ ìfaradà tí ó dúró ṣinṣin lábẹ́ ìjìyà; àgbélébùú náà tọ́ka sí ikú Jésù pàtó.
- source_word: αἰσχύνης καταφρονήσας
  choice: kò ka ìtìjú rẹ̀ sí ohun pàtàkì
  rationale: Ó sọ ní kedere pé Jésù kò jẹ́ kí ẹ̀gàn àgbélébùú pinnu ìṣe rẹ̀; kò túmọ̀ sí pé ìtìjú fúnra rẹ̀ dára.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: ní ọwọ́ ọ̀tún ìtẹ́ Ọlọ́run
  rationale: Ó pa àwòrán ipò ọlá àti àṣẹ mọ́ ní ọ̀nà tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: κεκάθικεν
  choice: ó sì ti jókòó
  rationale: '‘Ti jókòó’ pa agbára perfect Gíríìkì mọ́: ìṣe náà ti ṣẹlẹ̀, ipò rẹ̀ sì ń bá a lọ.'
theological_decisions:
- issue: Ìtumọ̀ τῆς πίστεως lẹ́yìn ἀρχηγὸν καὶ τελειωτὴν
  choice: Jésù ni aṣáájú-ọ̀nà àti ẹni tí ó mú ìgbàgbọ́ dé àṣepé.
  alternative: Jésù ni aṣáájú-ọ̀nà àti ẹni tí ó mú ìṣòtítọ́ dé àṣepé; tàbí ẹni tí ó bẹ̀rẹ̀ tí ó sì mú ìgbàgbọ́ wa dé àṣepé.
  rationale: Gbólóhùn Gíríìkì náà kéré, ó sì ní ọ̀pọ̀ ọ̀nà ìtumọ̀. A pa ‘ìgbàgbọ́’ mọ́ nínú ọ̀rọ̀ pàtàkì láìfi ‘wa’ kún un, a sì fi àwọn ìtumọ̀ mìíràn sí àlàyé ìsàlẹ̀.
- issue: Agbára ἀντὶ nínú ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Ayọ̀ tí ó wà níwájú Jésù ni ìrètí tí ó mú un fara da àgbélébùú.
  alternative: Ó fara da àgbélébùú dípò ayọ̀ tí ó wà níwájú rẹ̀.
  rationale: Àyíká eré-ìje àti ìfaradà sí ibi-afẹ́ ṣe atilẹyin fún ìtumọ̀ ìdí tàbí ìrètí; síbẹ̀, a jẹ́wọ́ pé ‘dípò’ jẹ́ ohun tí ἀντί tún lè túmọ̀ sí.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ìforúkọsílẹ̀ ọ̀wọ̀ àti òde òní. ‘Aṣáájú-ọ̀nà’ jẹ́ àdánidá ju ìtumọ̀ lítírésọ̀ ‘òǹkọ̀wé’ lọ, ‘ẹni tí ó mú ... dé àṣepé’ sì ṣe kedere fún òǹkàwé gbogbogbò. Ìbẹ̀rẹ̀ ‘ká sì máa’ ń bá àṣẹ inú ẹsẹ̀ tó ṣáájú mu.
