id: HEB.12.25
reference: Hebrews 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: yo
  text: Ẹ ṣọ́ra kí ẹ má ṣe kọ ẹni tí ń sọ̀rọ̀ sílẹ̀. Nítorí bí àwọn wọ̀nyẹn kò ṣe bọ́ lẹ́yìn tí wọ́n kọ ẹni tí ó fún wọn ní ìkìlọ̀ lórí ilẹ̀ ayé sílẹ̀, mélòómélòó ni àwa yóò ṣe bọ́ bí a bá yí padà kúrò lọ́dọ̀ ẹni tí ń sọ̀rọ̀ láti ọ̀run![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà jù bẹ́ẹ̀ lọ: “mélòómélòó àwa tí ń yí padà kúrò lọ́dọ̀ ẹni náà láti ọ̀run.” Èdè Gíríìkì fi ọ̀rọ̀-ìṣe “bọ́” sí òye láti inú apá gbólóhùn tó ṣáájú. Ọ̀rọ̀ tí a túmọ̀ sí “fún ... ní ìkìlọ̀” tún lè túmọ̀ sí fífi ìtọ́nisọ́nà àṣẹ Ọlọ́run hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Ẹ ṣọ́ra
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó ní agbára ìkìlọ̀ àti ìrọ̀rọ̀, ó sì jẹ́ Yorùbá àdánidá ju ìtumọ̀ gígún bí ‘Ẹ rí i dájú’ lọ.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: kí ẹ má ṣe kọ ... sílẹ̀ / wọ́n kọ ... sílẹ̀
  rationale: A tún ọ̀rọ̀ kan náà ṣe láti pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́; ‘kọ ... sílẹ̀’ fi hàn pé wọ́n kọ́ láti gba ẹni tí ń bá wọn sọ̀rọ̀.
- source_word: τὸν λαλοῦντα
  choice: ẹni tí ń sọ̀rọ̀ náà
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ nínú participle present mọ́, láì fi ‘Ọlọ́run’ tàbí ‘Kristi’ kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: ἐξέφυγον
  choice: kò ... bọ́
  rationale: ‘Bọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún líla ewu tàbí ìdájọ́ já, ó sì bá itumọ̀ ‘escape’ mu.
- source_word: ἐπὶ γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó dá ìyàtọ̀ ilẹ̀ ayé àti ọ̀run dúró láì sọ Sínáì ní pàtó.
- source_word: χρηματίζοντα
  choice: ẹni tí ó fún wọn ní ìkìlọ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi ìtọ́nisọ́nà tàbí ìkìlọ̀ àṣẹ Ọlọ́run hàn; ní àyíká yìí ‘fún ... ní ìkìlọ̀’ mú agbára ìkìlọ̀ rẹ̀ jáde, nígbà tí ‘wọn’ jẹ́ àfikún gírámà fún Yorùbá àdánidá.
- source_word: πολὺ μᾶλλον
  choice: mélòómélòó ni àwa kì yóò fi bọ́
  rationale: Ọ̀nà Yorùbá yìí fi àríyànjiyàn láti ohun kékeré sí ohun tí ó pọ̀ jù hàn nínú gbólóhùn òdì.
- source_word: ἀποστρεφόμενοι
  choice: bí a bá yí padà kúrò lọ́dọ̀
  rationale: Ó sọ participle náà di ipò àdéhùn tó ṣe kedere ní Yorùbá, láì túmọ̀ rẹ̀ ré kọjá bí ìkọ̀sílẹ̀ ìgbàgbọ́ ní pàtó.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: ẹni tí ń fúnni ní ìkìlọ̀ láti ọ̀run
  rationale: Ó mú ìfiwéra pẹ̀lú ẹni tó kìlọ̀ lórí ilẹ̀ ayé ṣe kedere; ‘ìkìlọ̀’ ni a gbé wá láti χρηματίζοντα fún ìtumọ̀ àdánidá.
theological_decisions:
- issue: Ta ni ẹni tí ń sọ̀rọ̀ tàbí kìlọ̀?
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ẹni tí ń sọ̀rọ̀’ àti ‘ẹni tí ń fúnni ní ìkìlọ̀,’ láì dárúkọ Ọlọ́run tàbí Kristi.
  alternative: Kí a sọ ní pàtó pé Ọlọ́run tàbí Kristi ni.
  rationale: Àyíká náà ń tọ́ka sí ọ̀rọ̀ àṣẹ ọ̀run, ṣùgbọ́n ẹsẹ náà fúnra rẹ̀ kò lo orúkọ tàbí oyè kan; ìtumọ̀ náà pa àìsọ-ní-pàtó yìí mọ́.
- issue: Ọ̀rọ̀-ìṣe tí a fi sílẹ̀ nínú apá ìkẹyìn
  choice: A mú ‘kì yóò fi bọ́’ jáde ní gbangba.
  alternative: Kí a fi gẹ́gẹ́ bí Gíríìkì tó sọ ní ṣókí pé ‘mélòómélòó àwa tí ń yí padà...’
  rationale: Gíríìkì jẹ́ elliptical, ó sì gbé ‘bọ́’ wá láti apá àkọ́kọ́. Yorùbá tó ṣe kedere nílò kí a tún ọ̀rọ̀-ìṣe náà sọ; èyí kò fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘ẹ’ ni a lò fún àṣẹ; ‘àwa/a’ pa ìyípadà ẹni nínú orísun mọ́. Ọ̀nà ‘mélòómélòó’ jẹ́ àdánidá, ó sì gbe agbára ìkìlọ̀ láti ohun kékeré sí ohun ńlá jáde.
