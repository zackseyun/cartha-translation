id: HEB.12.23
reference: Hebrews 12:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: yo
  text: àti sí àpéjọ àwọn àkọ́bí tí a ti kọ orúkọ wọn sílẹ̀ ní àwọn ọ̀run[a], àti sí Ọlọ́run, Adájọ́ gbogbo ènìyàn, àti sí àwọn ẹ̀mí àwọn ènìyàn olódodo tí a ti sọ di pípé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ní ọ̀run.” Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: àpéjọ
  rationale: Ó túmọ̀ sí ìpéjọ àwọn ènìyàn tí a kó jọ, láì fi ìtumọ̀ ilé-iṣẹ́ tàbí ẹ̀ka ìjọ kan kún ọ̀rọ̀ náà.
- source_word: πρωτοτόκων
  choice: àwọn àkọ́bí
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, ó sì dúró gẹ́gẹ́ bí orúkọ fún àwọn tí wọ́n ní ipò tàbí ogún àkọ́bí; kò sọ ‘àwọn ọmọkùnrin’ ní pàtó.
- source_word: ἀπογεγραμμένων
  choice: tí a ti forúkọ wọn sílẹ̀
  rationale: Ìṣe aláìṣe ní àkókò pípé fi hàn pé ìforúkọsílẹ̀ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró; gbólóhùn Yorùbá yìí tún pa àwòrán ìwé ìforúkọsílẹ̀ mọ́.
- source_word: ἐν οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ nínú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ‘ní ọ̀run’ jẹ́ ọ̀nà tí ó wọ́pọ̀ sí i ní Yorùbá.
- source_word: κριτῇ θεῷ πάντων
  choice: Ọlọ́run, onídàájọ́ gbogbo ènìyàn
  rationale: Àfikún orúkọ yìí fi Ọlọ́run hàn gẹ́gẹ́ bí onídàájọ́ gbogbo ènìyàn, ó sì bá ìtẹ̀síwájú ‘sí’ mu.
- source_word: πνεύμασι
  choice: àwọn ẹ̀mí
  rationale: Èyí ni ìtumọ̀ tààrà ọ̀rọ̀ náà; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: δικαίων
  choice: àwọn ènìyàn olódodo
  rationale: Ó sọ àwọn ènìyàn tí ó jẹ́ olódodo ní kedere, láì dá ìtumọ̀ náà mọ́ àwọn ọkùnrin nìkan.
- source_word: τετελειωμένων
  choice: tí a ti sọ di pípé
  rationale: Ó pa ìṣe aláìṣe àti èrò pípé/parí tí ó ṣe pàtàkì nínú Hébérù mọ́.
theological_decisions:
- issue: Ta ni ‘àwọn àkọ́bí’ ń tọ́ka sí?
  choice: Àwọn ènìyàn Ọlọ́run lápapọ̀ tí wọ́n ní ipò àti ogún àkọ́bí.
  alternative: Kristi nìkan gẹ́gẹ́ bí Àkọ́bí, tí àpéjọ náà sì jẹ́ tirẹ̀.
  rationale: Ọ̀pọ̀ πρωτοτόκων fi agbára tọ́ka sí ẹgbẹ́ àwọn ènìyàn; ìtumọ̀ náà kò fi ‘ọmọkùnrin’ tàbí àlàyé ẹ̀kọ́ mìíràn kún ọ̀rọ̀ Gíríìkì.
- issue: Ta ni ‘àwọn ẹ̀mí àwọn ènìyàn olódodo tí a ti sọ di pípé’ ń tọ́ka sí?
  choice: Àwọn ènìyàn olódodo tí a ti mú dé ipò pípé níwájú Ọlọ́run, tí a pè ní ‘ẹ̀mí’ níhìn-ín.
  alternative: Gbogbo àwọn olódodo lápapọ̀, yálà wọ́n wà nínú ara tàbí wọn kò sí nínú ara.
  rationale: Ọ̀rọ̀ náà dára jù lọ gẹ́gẹ́ bí ìtọ́ka sí ẹ̀mí àwọn ènìyàn olódodo, ṣùgbọ́n ìtumọ̀ kò gbìyànjú láti ṣàlàyé ipò wọn ní ọ̀nà tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, adayeba, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó yẹ. A pa ìtẹ̀síwájú gírámà láti ẹsẹ̀ tó ṣáájú mọ́ nípa lílo ‘àti sí’; a sì pa ìtumọ̀ ọ̀pọ̀, ìforúkọsílẹ̀, àti pípé mọ́ láì fi ẹ̀kọ́ ìjọ kan kún un.
