  terminology: ‘ìbáwí,’ ‘tẹríba,’ àti ‘Baba àwọn ẹ̀mí’ bá ọ̀rọ̀ Gíríìkì àti àyíká Hébérù 12 mu. A gbọdọ̀ fi ‘àwọn ẹ̀mí’ sílẹ̀ ní ọ̀nà gbòòrò, láìfi ‘wa’ kún un nínú ọ̀rọ̀ àkọ́kọ́.
