id: HEB.12.9
reference: Hebrews 12:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: yo
  text: Ní àfikún sí i, a ní àwọn baba wa nípa ti ara[a] gẹ́gẹ́ bí àwọn tó ń fi ìbáwí tọ́ wa[b], a sì bọ̀wọ̀ fún wọn. Ǹjẹ́ kò yẹ kí a túbọ̀ tẹríba fún Baba àwọn ẹ̀mí[c], kí a sì yè?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘àwọn baba ti ara wa.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘gẹ́gẹ́ bí olùbáwí wa.’
    reason: lexical_alternative
  - marker: c
    text: ‘Baba àwọn ẹ̀mí’ lè túmọ̀ sí Baba ẹ̀mí wa ní pàtó, ní ìyàtọ̀ sí àwọn baba wa nípa ti ara; ṣùgbọ́n ọ̀rọ̀ Gíríìkì fi ìtumọ̀ náà sílẹ̀ ní ọ̀nà tó gbòòrò.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Ní àfikún sí i
  rationale: Ó fi àfikún kún ìjiyàn láti ohun tí ó kéré sí ohun tí ó pọ̀; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ tó lè túmọ̀ sí ìtẹ̀lé àkókò nìkan lọ.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: àwọn baba wa nípa ti ara
  rationale: Ó pa ìtumọ̀ ìbátan nípa ìbí àti ara mọ́, ó sì yà á sọ́tọ̀ kúrò nínú ìtumọ̀ ‘ẹran ara’ gẹ́gẹ́ bí ìwà ẹ̀ṣẹ̀.
- source_word: παιδευτὰς
  choice: máa ń fi ìbáwí tọ́ wa
  rationale: Ó sọ ipa àwọn baba gẹ́gẹ́ bí àwọn tó ń kọ́ni, tó sì ń tọ́ni sọ́nà nípasẹ̀ ìbáwí, ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐνετρεπόμεθα
  choice: a sì bọ̀wọ̀ fún wọn
  rationale: Ó mú ọ̀wọ̀ àti ìkàsí tí ọ̀rọ̀ náà ń tọ́ka sí jáde lọ́nà àdánidá.
- source_word: οὐ πολὺ μᾶλλον
  choice: Ǹjẹ́ kò yẹ kí a túbọ̀
  rationale: Ó pa agbára ìbéèrè àsọyé àti ìjiyàn ‘melomelo si i’ mọ́.
- source_word: ὑποταγησόμεθα
  choice: tẹríba fún
  rationale: Ó sọ fífi ara ẹni sábẹ́ àṣẹ ní Yorùbá tó wọ́pọ̀, láìfi dandan túmọ̀ rẹ̀ sí ìfipá múni.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: Baba àwọn ẹ̀mí
  rationale: Ó tẹ̀lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, kò sì dín ‘àwọn ẹ̀mí’ kù sí ‘ẹ̀mí wa’ nìkan.
- source_word: ζήσομεν
  choice: kí a sì yè
  rationale: Ó pa ìtumọ̀ ìyè gẹ́gẹ́ bí àbájáde tẹríba mọ́, ó sì bá ìbéèrè àsọyé mu.
theological_decisions:
- issue: Ìtumọ̀ ‘Baba àwọn ẹ̀mí’
  choice: A fi gbólóhùn náà sílẹ̀ ní gbangba gẹ́gẹ́ bí ‘Baba àwọn ẹ̀mí.’
  alternative: ‘Baba ẹ̀mí wa’ tàbí ‘Baba àwọn ẹ̀dá ẹ̀mí.’
  rationale: Gíríìkì kò sọ ‘wa’ ní kedere, ó sì lè ní ìtumọ̀ tó gbòòrò. Ìtumọ̀ yìí pa ìyàtọ̀ tó wà láàárín àwọn baba nípa ti ara àti Ọlọ́run mọ́ láìyanjú àríyànjiyàn náà fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘ìbáwí’ láti so ẹsẹ yìí pọ̀ mọ́ àyíká Hébérù 12.
