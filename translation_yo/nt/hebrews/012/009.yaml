  source_fidelity: Ìtumọ̀ náà mú ìjiyàn ìfẹ̀símúlẹ̀ (a fortiori), ìyàtọ̀ àwọn baba nípa ti ara sí Baba àwọn ẹ̀mí, àti ìbéèrè àsọyé ní ìparí ẹsẹ̀ náà dáadáa. Síbẹ̀, ‘máa ń fi ìbáwí tọ́ wa’ ń jẹ́ kí παιδευτὰς dà bí ìṣe déédéé dípò ipa tí àwọn baba wọ̀nyẹn ní gẹ́gẹ́ bí olùfi-ìbáwí-tọni; a tún lè mú ìtumọ̀ ìṣe àtijọ́ ti εἴχομεν hàn kedere sí i.
