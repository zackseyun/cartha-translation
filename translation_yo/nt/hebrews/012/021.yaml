source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: yo
  text: Ohun tí ó farahàn náà sì jẹ́ ohun ìbẹ̀rù tó bẹ́ẹ̀ tí Mósè fi sọ pé[b][a], “Ẹ̀rù ń bà mí gidigidi, mo sì ń warìrì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a rí” tàbí “ìwòye náà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìfarahàn tí ojú rí ní Sínáì.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí kì í ṣe àyọlò ní tààrà láti inú Májẹ̀mú Láéláé, ṣùgbọ́n ó fi ìbẹ̀rù Mósè ní ìbáṣepọ̀ pẹ̀lú ìṣẹ̀lẹ̀ Sínáì hàn; fi wé Diutarónómì 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: sì
  rationale: Ó so ẹsẹ yìí mọ́ àpèjúwe Sínáì tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: οὕτω φοβερὸν ἦν
  choice: bani lẹ́rù tó bẹ́ẹ̀
  rationale: Ìṣètò yìí fi bí ohun náà ṣe kún fún ẹ̀rù tó hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: τὸ φανταζόμενον
  choice: Ìran náà
  rationale: Ó tọ́ka sí ohun tí ojú rí tàbí ìfarahàn ní Sínáì láì pinnu ju bí Gíríìkì ṣe pinnu lọ.
- source_word: Μωϋσῆς εἶπεν
  choice: Mósè fi sọ pé
  rationale: Orúkọ náà tẹ̀ lé ìlò Yorùbá tó wọ́pọ̀; ‘fi sọ pé’ sì bá gbólóhùn àbájáde ‘tó bẹ́ẹ̀ tí ... fi’ mu.
- source_word: Ἔκφοβός εἰμι
  choice: Ẹ̀rù ń bà mí
  rationale: Ó sọ ìbẹ̀rù líle Mósè ní Yorùbá àdánidá, láì dapọ̀ mọ́ ìtumọ̀ ἔντρομος.
- source_word: καὶ ἔντρομος
  choice: mo sì ń warìrì
  rationale: Ó pa àmì ara ti ìwarìrì mọ́ gẹ́gẹ́ bí èrò kejì tó yàtọ̀ sí ìbẹ̀rù.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ Mósè pẹ̀lú ìtàn Sínáì nínú Májẹ̀mú Láéláé
  choice: A gbé e kalẹ̀ ní tààrà gẹ́gẹ́ bí ọ̀rọ̀ Mósè nígbà ìfarahàn amúnikún-fún-ẹ̀rù ní Sínáì.
  alternative: Kí a fi àlàyé sínú ọ̀rọ̀ pàtàkì pé àkótán ọ̀fẹ́ ni tàbí pé ó tọ́ka sí Diutarónómì 9:19 nìkan.
  rationale: Gíríìkì sọ ní kedere pé Mósè sọ ọ́; a kò gbọdọ̀ mú ìṣòro ibi tí ọ̀rọ̀ náà ti wá kúrò nípasẹ̀ ìṣọ̀kan ìtumọ̀. Àlàyé ìsàlẹ̀ ni ó yẹ fún ọ̀ràn náà.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó níyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘bani lẹ́rù tó bẹ́ẹ̀’ fún agbára φοβερόν, a sì pa ‘ẹ̀rù’ àti ‘warìrì’ mọ́ lọ́tọ̀ gẹ́gẹ́ bí Gíríìkì ṣe ní ọ̀rọ̀ méjì.
