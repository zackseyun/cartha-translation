source:
  edition: SBLGNT
  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: yo
  text: 'Nítorí wọn kò lè fara da ohun tí a ń pàṣẹ pé: “Bí ẹranko kan tilẹ̀ kan òkè náà[a], a ó sọ ọ́ ní òkúta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan fi kún un pé, “tàbí kí a ta á ní ọfà,” tí ó ń tún ọ̀rọ̀ Ẹ́kísódù 19:12–13 sọ.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: wọn kò lè fara da
  rationale: Ọ̀rọ̀ yìí sọ pé wọn kò lágbára láti gba tàbí fara da àṣẹ náà; ‘kò lè fara da’ jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: τὸ διαστελλόμενον
  choice: ohun tí a ń pàṣẹ
  rationale: Ó pa ìtumọ̀ ìtọ́ni aláṣẹ àti ìṣe tí ó ń lọ mọ́ láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: Κἂν
  choice: Bí ... kan tilẹ̀
  rationale: Ìṣọ̀kan yìí mú ipò àdéhùn àti ìtẹnumọ́ pé àní ẹranko pàápàá kò yọ sílẹ̀ hàn.
- source_word: θηρίον
  choice: ẹranko
  rationale: ‘Ẹranko’ jẹ́ ọ̀rọ̀ gbogbogbò, kedere, tí kò fi dandan túmọ̀ sí ẹranko igbó nìkan.
- source_word: θίγῃ
  choice: fọwọ́ kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan kan ohun mìíràn, ó sì bá àdéhùn náà mu.
- source_word: τοῦ ὄρους
  choice: òkè náà
  rationale: Ó tẹ̀ lé Gíríìkì tí ó sọ ‘òkè náà’; àyíká ni ó fi hàn pé Sínáì ni, nítorí náà a kò fi orúkọ náà kún ẹsẹ yìí.
- source_word: λιθοβοληθήσεται
  choice: a ó sọ ọ́ ní òkúta
  rationale: Ó pa ìṣe ọjọ́ iwájú àti ohùn àfaradà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ àyọlò náà pẹ̀lú àṣẹ ní Sínáì
  choice: A túmọ̀ ọ̀rọ̀ inú SBLGNT gẹ́gẹ́ bí ó ṣe wà, láì fi gbólóhùn àfikún kún un.
  alternative: Fífi ‘tàbí kí a ta á ní ọfà’ kún ọ̀rọ̀ pàtàkì láti bá àwọn àfọwọ́kọ kan àti Ẹ́kísódù 19:12–13 mu.
  rationale: Àwọn àfọwọ́kọ kan ní àfikún náà, ṣùgbọ́n kò sí nínú ọ̀rọ̀ SBLGNT tí a pèsè; àlàyé ìsàlẹ̀ ni ó yẹ kí ó tọ́ka sí ìyàtọ̀ náà dípò kí a mú àwọn ọ̀rọ̀ náà dọ́gba.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Fara da’ àti ‘sọ ọ́ ní òkúta’ jẹ́ kedere fún òǹkàwé òde òní, nígbà tí ìtòlẹ́sẹẹsẹ gbólóhùn náà pa ìtẹnumọ́ orísun Gíríìkì mọ́.
