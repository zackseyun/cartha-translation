id: HEB.12.15
reference: Hebrews 12:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: yo
  text: Ẹ máa ṣọ́ra gidigidi, kí ẹnikẹ́ni má ṣe kùnà láti rí oore-ọ̀fẹ́ Ọlọ́run gbà[a]; kí gbòǹgbò ìkorò kankan tí ń hù sókè má bàa fa wàhálà, kí ọ̀pọ̀ ènìyàn sì má bàa di aláìmọ́ nípasẹ̀ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹnikẹ́ni má ṣe ṣàìdé oore-ọ̀fẹ́ Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ènìyàn kò rí ohun tí a fúnni gbà tàbí pé ó ṣàìdé e.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “gbòǹgbò ìkorò” tọ́ka sí Diutarónómì 29:18, níbi tí gbòǹgbò olóró ti dúró fún àìṣòótọ́ sí májẹ̀mú tí ń tàn káàkiri láàárín àwùjọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Ẹ máa ṣọ́ra gidigidi
  rationale: Ó fi ìṣọ́ra àti àbójútó tí gbogbo àwùjọ gbọ́dọ̀ máa ṣe hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: kí ẹnikẹ́ni má bà á kù láti inú oore-ọ̀fẹ́ Ọlọ́run
  rationale: “Bà á kù” pa ìtumọ̀ àìdé ohun tí a nṣe fúnni tàbí jíjìnà sí i mọ́, láìfi èrò ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ẹ̀bùn ojúrere Ọlọ́run mọ́.
- source_word: ῥίζα πικρίας
  choice: gbòǹgbò ìkorò
  rationale: Ó tẹ̀lé àwòrán gbòǹgbò inú Gíríìkì, ó sì pa ìṣeéṣe ìtọ́kasí sí Diutarónómì 29:18 mọ́.
- source_word: ἄνω φύουσα
  choice: hù sókè
  rationale: Ó sọ ìhùjáde ohun ọ̀gbìn sókè ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐνοχλῇ
  choice: fa wàhálà
  rationale: Ó mú ìtumọ̀ dídààmú tàbí fífi ìṣòro bá àwùjọ jáde ní èdè òde òní.
- source_word: δι’ αὐτῆς
  choice: nípasẹ̀ rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí gbòǹgbò, ó sì pa ipa ohun èlò tí διά ní mọ́.
- source_word: μιανθῶσιν πολλοί
  choice: kí ọ̀pọ̀ ènìyàn má sì di aláìmọ́
  rationale: “Di aláìmọ́” pa agbára ìtumọ̀ àìmọ́ ní ti ìwà àti ẹ̀sìn mọ́ ju ọ̀rọ̀ tó tútù bí “bàjẹ́” lọ.
theological_decisions:
- issue: Bóyá ìkìlọ̀ nípa oore-ọ̀fẹ́ Ọlọ́run túmọ̀ sí pípàdánù ìgbàlà, àìrí oore-ọ̀fẹ́ gbà, tàbí yíyọ kúrò nínú àwùjọ
  choice: kí ẹnikẹ́ni má bà á kù láti inú oore-ọ̀fẹ́ Ọlọ́run
  alternative: kí ẹnikẹ́ni má kùnà láti rí oore-ọ̀fẹ́ Ọlọ́run gbà
  rationale: Gíríìkì lè tọ́ka sí àìdé ohun tí a nṣe fúnni tàbí jíjìnà sí i; gbolohun yìí pa ìkìlọ̀ àti àìdánilójú náà mọ́ láìyanju àríyànjiyàn ẹ̀kọ́ ìsìn.
- issue: Bóyá μιαίνω yẹ kí a rọ̀ sí ìdàrúdàpọ̀ láwùjọ nìkan
  choice: di aláìmọ́
  alternative: bàjẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà ní agbára ìtumọ̀ àìmọ́ ní ti ìwà tàbí ìjọsìn; “di aláìmọ́” pa ìwúwo yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá àpéjọ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. Àṣẹ “Ẹ máa ṣọ́ra” bá ìtọ́kasí sí ọ̀pọ̀ ènìyàn mu; àmì ohùn àti àmì abẹ́ lẹ́tà ni a fi kún un ní kíkún níbi tí ó bá yẹ.
