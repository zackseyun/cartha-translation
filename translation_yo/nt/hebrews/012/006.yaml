id: HEB.12.6
reference: Hebrews 12:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: yo
  text: 'Nítorí Olúwa ń bá ẹni tí ó fẹ́ràn wí,

    ó sì ń fi pàṣán na[a] gbogbo ọmọkùnrin[b] tí ó gbà sí ọ̀dọ̀ rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nà” tàbí “nà ní pàṣán.” Ọ̀rọ̀ Gíríìkì náà lágbára, ó sì ṣàpèjúwe ìbáwí líle.
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo ọmọkùnrin” tẹ̀ lé ọ̀rọ̀ Gíríìkì. Nínú àyíká yìí, gbólóhùn náà ní agbára aṣojú, ó ń tọ́ka sí gbogbo àwọn tí Ọlọ́run mọ̀ sí ọmọ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ẹni tí ... tí
  rationale: Àrọ́pò-orúkọ ìbátan náà ń sọ òtítọ́ tí ó kan ẹnikẹ́ni nínú irú ipò yìí. “Ẹni tí” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́kasí ẹnìkọ̀ọ̀kan mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ ìṣírí tó ṣáájú múlẹ̀, ó sì jẹ́ àsopọ̀ tó ṣe kedere ní Yorùbá.
- source_word: ἀγαπᾷ
  choice: fẹ́ràn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ìfẹ́ tí Olúwa ní sí ẹni náà.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” pa oyè àti agbára ẹ̀kọ́ ìgbàgbọ́ inú κύριος mọ́ ní èdè Yorùbá.
- source_word: παιδεύει
  choice: ń bá ... wí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìtọ́ni àti àtúnṣe onífẹ̀ẹ́, kì í ṣe ìjìyà lásán. “Bá ... wí” jẹ́ ọ̀nà Yorùbá àdánidá fún ìbáwí tó ń tọ́ni.
- source_word: μαστιγοῖ
  choice: ń fi pàṣán na
  rationale: Ọ̀rọ̀ Gíríìkì náà lágbára, ó sì ṣàpèjúwe lílu pẹ̀lú pàṣán. Yíyan èyí kò dín líle àwòrán náà kù.
- source_word: δὲ
  choice: ó sì
  rationale: Níhìn-ín δέ ń tẹ̀ síwájú sí gbólóhùn kejì dípò kí ó fi ìtakora líle hàn; “ó sì” jẹ́ àsopọ̀ Yorùbá tó bá a mu.
- source_word: πάντα υἱὸν
  choice: gbogbo ọmọkùnrin
  rationale: Èyí pa akọ ẹyọ ọ̀rọ̀ Gíríìkì náà àti àwòrán ipò ọmọkùnrin mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó dúró fún gbogbo àwọn tí Ọlọ́run mọ̀ sí ọmọ rẹ̀.
- source_word: παραδέχεται
  choice: gbà sí ọ̀dọ̀ rẹ̀
  rationale: Gbólóhùn yìí mú ìtumọ̀ gbígbà ẹni wọlé tàbí fífi ojú rere tẹ́wọ́ gbà á hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ υἱός nínú ọ̀rọ̀ nípa ìbáwí Ọlọ́run àti ipò ọmọkùnrin
  choice: gbogbo ọmọkùnrin
  alternative: gbogbo ọmọ
  rationale: Orísun náà lo ọ̀rọ̀ akọ ẹyọ, àyíká Hébérù 12 sì tẹnumọ́ àwòrán ipò ọmọkùnrin. Ọ̀rọ̀ àkọ́kọ́ pa àwòrán yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé agbára aṣojú rẹ̀.
- issue: Bí a ṣe lè pa líle μαστιγοῖ mọ́ nínú ọ̀rọ̀ ìbáwí Ọlọ́run
  choice: ń fi pàṣán na
  alternative: ń jẹ ní ìyà líle; ń nà
  rationale: Ọ̀rọ̀ orísun náà lo àwòrán líle kan. Ìtumọ̀ yìí pa ìdọ̀gbà tó wà láàárín ìfẹ́ Ọlọ́run àti ìbáwí onírora mọ́ láì rọ ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “bá ... wí” fún ìbáwí tó ní ète ìtọ́ni, ṣùgbọ́n a pa àwòrán líle “fi pàṣán na” mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
