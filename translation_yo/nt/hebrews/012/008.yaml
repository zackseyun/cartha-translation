id: HEB.12.8
reference: Hebrews 12:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá wà láìní ìbáwí tí gbogbo wọn ti ní ìpín nínú rẹ̀, nígbà náà ẹ jẹ́ àwọn ọmọ àlè, ẹ kì í sì í ṣe àwọn ọmọ tòótọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: ìbáwí
  rationale: Nínú àyíká ẹsẹ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ìtọ́ni àti àtúnṣe baba tí ó lè ní ìjìyà nínú; “ìbáwí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó mú èrò àtúnṣe yìí jáde.
- source_word: μέτοχοι γεγόνασι
  choice: ti ní ìpín nínú rẹ̀
  rationale: Èyí pa ìtumọ̀ jíjẹ́ alábápín mọ́, ó sì fi ipò tí wọ́n ti dé sí hàn gẹ́gẹ́ bí perfect γεγόνασι.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: A pa ààyè ìtọ́kasí gbogbo àwọn ọmọ tí a ń sọ̀rọ̀ nípa wọn mọ́, láìfi “gbogbo ènìyàn” kun un.
- source_word: νόθοι
  choice: ọmọ àlè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ọmọ tí kò ní ipò ọmọ lábẹ́ òfin tàbí ọmọ tí a kò mọ̀ sí ọmọ tòótọ́; “ọmọ àlè” jẹ́ ọ̀rọ̀ Yorùbá tó taara, bí ó tilẹ̀ jẹ́ pé ó lágbára.
- source_word: υἱοί
  choice: ọmọ tòótọ́
  rationale: Ní àfíwé pẹ̀lú νόθοι, “ọmọ tòótọ́” mú ìtumọ̀ ọmọ tí a mọ̀ sí tirẹ̀ jáde; Yorùbá kò fi dandan yà ọmọkùnrin sọ́tọ̀ nínú irú ọ̀rọ̀ ìbátan yìí.
theological_decisions:
- issue: Ìbáwí gẹ́gẹ́ bí àmì ipò ọmọ
  choice: A sọ pé àìní ìbáwí fi hàn pé wọn kì í ṣe ọmọ tòótọ́.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé ìbáwí ló ń sọ ènìyàn di ọmọ.
  rationale: Gíríìkì fi àbájáde ìdánimọ̀ hàn (“nígbà náà ẹ jẹ́”), kì í ṣe ọ̀nà tí a fi ń jèrè ipò ọmọ; a kò gbọ́dọ̀ fi ẹ̀kọ́ míì kún un.
- issue: Ìbálòpọ̀ akọ nínú υἱοί
  choice: “ọmọ tòótọ́” láìdín ìtọ́kasí rẹ̀ sí ọmọkùnrin nìkan.
  alternative: “àwọn ọmọkùnrin”
  rationale: Àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa ìbátan Ọlọ́run gẹ́gẹ́ bí Baba sí gbogbo àwọn tirẹ̀; “ọmọ” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìbátan mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Gbólóhùn náà pa ìfìwéra líle tó wà nínú Gíríìkì mọ́, láìrẹ̀wẹ̀sì “νόθοι” tàbí ṣàlàyé ìmọ̀ ẹ̀kọ́ ìsìn sí i.
