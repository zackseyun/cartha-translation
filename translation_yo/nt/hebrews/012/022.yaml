source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ti wá sí Òkè Síónì àti sí ìlú Ọlọ́run alààyè, Jerúsálẹ́mù ti ọ̀run, àti sí ẹgbẹẹgbẹ̀rún àwọn áńgẹ́lì[b] nínú ìpéjọ ayẹyẹ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àti sí ẹgbẹẹgbẹ̀rún àwọn áńgẹ́lì, sí ìpéjọ ayẹyẹ.” Ìṣètò ọ̀rọ̀ Gíríìkì lè so “ìpéjọ ayẹyẹ” mọ́ àwọn áńgẹ́lì, tàbí kí ó jẹ́ ohun mìíràn nínú àtòjọ náà.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn ẹgbẹ̀rún mẹ́wàá” ní ìtumọ̀ iye gangan, tàbí sí ọ̀pọ̀lọpọ̀ tí a kò lè kà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ohun tí àwọn olùgbọ́ sún mọ́ níbí àti Òkè Sínáì tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa rẹ̀.
- source_word: προσεληλύθατε
  choice: ẹ ti wá sí
  rationale: Ọ̀rọ̀-ìṣe perfect náà tọ́ka sí wíwá tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣì wà nísinsìnyí; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: Σιὼν ὄρει
  choice: Òkè Síónì
  rationale: Ó pa àwòrán òkè àti orúkọ ibẹ̀ mọ́ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: πόλει θεοῦ ζῶντος
  choice: ìlú Ọlọ́run alààyè
  rationale: Ó fi hàn pé ìlú náà jẹ́ ti Ọlọ́run, ó sì pa àpèjúwe pàtàkì náà, ‘alààyè,’ mọ́.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: Jerúsálẹ́mù ti ọ̀run
  rationale: Gbólóhùn yìí ṣàlàyé ‘ìlú Ọlọ́run alààyè’ ó sì tú ἐπουρανίῳ sí èdè Yorùbá tó ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: μυριάσιν ἀγγέλων
  choice: ẹgbẹẹgbẹ̀rún àwọn áńgẹ́lì
  rationale: ‘Ẹgbẹẹgbẹ̀rún’ sọ ọ̀pọ̀lọpọ̀ tí kò rọrùn láti kà, ó sì yẹ fún ìtumọ̀ ọ̀pọ̀ μυριάς láìdì í mọ́ iye kan pàtó.
- source_word: πανηγύρει
  choice: tí ó péjọ fún ayẹyẹ
  rationale: Ó sọ ìpéjọ ńlá tí ayọ̀ àti ayẹyẹ wà nínú rẹ̀ ní èdè Yorùbá tó ṣe kedere, ó sì so ó mọ́ àwọn áńgẹ́lì gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà πανηγύρει pẹ̀lú àwọn ọ̀rọ̀ tó yí i ká
  choice: 'A so ó mọ́ ẹgbẹ́ àwọn áńgẹ́lì: ‘àwọn áńgẹ́lì tí ó péjọ fún ayẹyẹ.’'
  alternative: 'A lè ka πανηγύρει gẹ́gẹ́ bí ohun tuntun nínú àtòjọ náà: ‘àti sí ẹgbẹẹgbẹ̀rún àwọn áńgẹ́lì, sí àpéjọ ayẹyẹ’; ó tún ṣeé ṣe láti so ó mọ́ ‘ìjọ àwọn àkọ́bí’ ní ẹsẹ 23.'
  rationale: Ìsopọ̀ rẹ̀ mọ́ àwọn áńgẹ́lì tó wà lẹ́sẹ̀kẹsẹ̀ ṣáájú rẹ̀ fúnni ní ìtumọ̀ tó bọ́gbọ́n mu, ṣùgbọ́n ìṣètò ọ̀rọ̀ Gíríìkì kò mú kí ìtumọ̀ yìí nìkan jẹ́ dandan. Àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘ẹ’ fún ọ̀pọ̀ ẹni tí προσεληλύθατε ń tọ́ka sí. A fi àmì kọ́mà sí òpin nítorí pé àtòjọ náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé e.
