  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: yo
  text: Ẹ sì máa ṣe ọ̀nà tààrà fún ẹsẹ̀ yín,[a] kí ohun tí ó yarọ má bàa yà kúrò ní ọ̀nà,[b] ṣùgbọ́n kí ó kúkú larada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ yìí rántí Òwe 4:26, ó sì ń bá àwòrán bí ènìyàn ṣe ń rìn ní ìwà pẹ̀lú ìṣọ́ra nìṣó.
    reason: cross_reference
  - marker: b
    text: Tàbí, “kí ohun tí ó yarọ má bàa yapa kúrò ní ìpò rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ ìṣègùn yìí nínú àwòrán ara tí ẹsẹ náà ń lò.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: ipa ọ̀nà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ipa tàbí ọ̀nà tí a ti ń rìn. “Ipa ọ̀nà” jẹ́ èdè Yorùbá àdánidá tí ó pa àwòrán ìrìn mọ́ láì sọ ọ́ di ọ̀rọ̀ iṣẹ́ ẹ̀rọ.
- source_word: ὀρθὰς
  choice: tààrà
  rationale: “Tààrà” fi ọ̀nà tí kò yí, tí a sì ṣe déédé hàn, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì àti ìrántí Òwe 4:26 mu.
- source_word: ποιεῖτε
  choice: Ẹ sì máa ṣe
  rationale: Àṣẹ ìsinsìnyí náà ń tọ́ka sí ìṣe tí wọ́n gbọ́dọ̀ máa bá a lọ; “máa ṣe” mú ìtẹ̀síwájú yẹn jáde ní Yorùbá.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: fún ẹsẹ̀ yín
  rationale: Dátífù náà dára jù láti gbà gẹ́gẹ́ bí ohun tí a ṣe ọ̀nà náà fún, kì í ṣe pé ẹsẹ̀ ni ohun èlò tí a fi ṣe é.
- source_word: τὸ χωλὸν
  choice: èyí tí ó yarọ
  rationale: Àpèjúwe aláìlórúkọ náà wà ní ẹyọ ọ̀rọ̀ akọ-àìkọ, ó sì lè tọ́ka sí ẹni tàbí ohun tí ó yarọ. “Èyí tí ó yarọ” pa àìdánilójú yẹn mọ́, láì fi dandan sọ ọ́ di àìlera ti ara tàbí ti ẹ̀mí.
- source_word: ἐκτραπῇ
  choice: yà kúrò ní ọ̀nà
  rationale: Ìtumọ̀ àkọ́kọ́ ni láti yà sí ẹ̀gbẹ́ tàbí kúrò ní ipa ọ̀nà. Àṣàyàn yìí pa àwòrán ìrìn mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìṣègùn tí ó tún ṣeé ṣe hàn.
- source_word: ἰαθῇ
  choice: rí ìwòsàn
  rationale: “Rí ìwòsàn” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a mú ohun kan lára dá, ó sì pa àwòrán ìwòsàn inú Gíríìkì mọ́.
- source_word: μᾶλλον
  choice: kúkú
  rationale: Nínú àyíká ìyàtọ̀ ‘kì í ṣe èyí, bí kò ṣe èkejì,’ “kúkú” fi ìtumọ̀ ‘dípò bẹ́ẹ̀’ hàn lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá àwòrán ara yìí jẹ́ ti àìlera ara gan-an tàbí àpẹẹrẹ àìlera ẹ̀mí
  choice: Pa èdè àwòrán ara mọ́, kí a má sì sọ pàtó ohun tí “èyí tí ó yarọ” dúró fún.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí àwọn onígbàgbọ́ aláìlera nípa ẹ̀mí, tàbí gẹ́gẹ́ bí ẹnikẹ́ni tí ó jẹ́ aláìlera.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tàbí ohun tí àpèjúwe náà ń tọ́ka sí ní pàtó. Dídá àìdánilójú náà sílẹ̀ ń yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ náà lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó sì ní iyì. “Ẹ sì máa ṣe” bá ìlànà àṣẹ tí ń tẹ̀ síwájú mu; “èyí tí ó yarọ” sì pa àìdánilójú Gíríìkì mọ́. A gbe àmì [a] sí àwòrán ipa ọ̀nà fún ìtọ́kasí Òwe, a sì gbe [b] sí ọ̀rọ̀ “yà kúrò” fún àṣàyàn ìtumọ̀ ìṣègùn.
