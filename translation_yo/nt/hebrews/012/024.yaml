id: HEB.12.24
reference: Hebrews 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: yo
  text: àti sí Jésù, alárin májẹ̀mú tuntun, àti sí ẹ̀jẹ̀ tí a wọ́n[a] tí ń sọ ohun tí ó dára ju Ábẹ́lì lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀jẹ̀ tí a wọ́n” ni ẹ̀jẹ̀ ìrúbọ tí a fọ́n síbi kan; ó mú àwòrán ìfìdímúlẹ̀ májẹ̀mú àti ìwẹ̀nùmọ́ wá sí ọkàn.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ju ẹ̀jẹ̀ Ábẹ́lì lọ.” Gíríìkì sọ ní ṣókí pé “ju Ábẹ́lì lọ,” ó sì ṣeé ṣe kí ó ń tọ́ka sí ẹ̀jẹ̀ Ábẹ́lì tí ń ké láti inú ilẹ̀ (Jẹ́nẹ́sísì 4:10).
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκης νέας
  choice: májẹ̀mú tuntun
  rationale: “Májẹ̀mú” mú ìtumọ̀ ìbáṣepọ̀ tí a fi ìlérí àti ojúṣe múlẹ̀ jáde, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe rí nínú Hébérù; àìsí article nínú Gíríìkì kò pọndandan kí Yorùbá fi “ọ̀kan” kún un.
- source_word: μεσίτῃ
  choice: alárin
  rationale: “Alárin” jẹ́ ọ̀rọ̀ Yorùbá adayeba fún ẹni tí ó dúró láàárín àwọn méjì láti mú ìbáṣepọ̀ tàbí àdéhùn ṣẹ.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: αἵματι ῥαντισμοῦ
  choice: ẹ̀jẹ̀ ìwọ́n
  rationale: Gbólóhùn yìí tọ́ka sí ẹ̀jẹ̀ tí a wọ́n nínú iṣẹ́ ìrúbọ; “ẹ̀jẹ̀ ìwọ́n” pa àwòrán ìṣe náà mọ́ láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un.
- source_word: κρεῖττον
  choice: ohun tí ó sàn
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá adayeba, ó sì pa èrò ìfiwéra “better” mọ́.
- source_word: λαλοῦντι
  choice: tí ń sọ
  rationale: “Ń sọ” pa agbára present participle mọ́, ó sì jẹ́ kí ẹ̀jẹ̀ jẹ́ ohun tí ó ń sọ̀rọ̀ gẹ́gẹ́ bí Gíríìkì.
- source_word: παρὰ τὸν Ἅβελ
  choice: ju ti Ábẹ́lì lọ
  rationale: “Ti Ábẹ́lì” pa ìfiwéra Gíríìkì tí ó kuru, tí kò sì sọ “ẹ̀jẹ̀ Ábẹ́lì” ní tààrà, mọ́; ní Yorùbá, “ti” jẹ́ kí àìsọ ohun tí a ń fi wé náà dúró ní ọ̀nà adayeba.
theological_decisions:
- issue: Ohun tí ìfiwéra pẹ̀lú Ábẹ́lì ń tọ́ka sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní ṣókí gẹ́gẹ́ bí “ju ti Ábẹ́lì lọ.”
  alternative: “ju ẹ̀jẹ̀ Ábẹ́lì lọ” tàbí “ó ń sọ ohun tí ó sàn ju ohun tí ẹ̀jẹ̀ Ábẹ́lì sọ lọ.”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ẹ̀jẹ̀ Ábẹ́lì tí ń ké láti inú ilẹ̀, ṣùgbọ́n Gíríìkì dárúkọ Ábẹ́lì nìkan. Ìtumọ̀ àkọ́kọ́ pa àìdánilójú àti ìṣòro ìtumọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A yan “alárin” dípò gbólóhùn gígùn, a sì pa ìṣàkóso ọ̀rọ̀ tó bẹ̀rẹ̀ pẹ̀lú “àti sí” mọ́ nítorí ẹsẹ yìí ń tẹ̀ síwájú láti inú àkójọ ẹsẹ tó ṣáájú.
