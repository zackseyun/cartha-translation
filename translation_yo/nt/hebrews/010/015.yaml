id: HEB.10.15
reference: Hebrews 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον, μετὰ γὰρ τὸ ⸀εἰρηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: yo
  text: Ẹ̀mí Mímọ́ náà sì ń jẹ́rìí fún wa[a]; nítorí lẹ́yìn tí ó ti wí pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń fi ẹ̀rí fún wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: ń jẹ́rìí
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ jíjẹ́rìí tàbí fífúnni ní ẹ̀rí mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe ẹlẹ́rìí. Àmì “ń” fi hàn pé ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ̀síwájú nínú àríyànjiyàn, kì í ṣe àmì ìtakora líle. “Sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Pẹ̀lú “jẹ́rìí,” “fún wa” jẹ́ ìkọ̀wé Yorùbá tó wọ́pọ̀ fún ẹni tí a ń sọ ẹ̀rí náà fún; àyíká ọ̀rọ̀ ló fi hàn pé Ẹ̀mí ń fi ẹ̀rí náà fún àwọn olùgbọ́.
- source_word: καὶ
  choice: náà
  rationale: '“Náà” mú agbára àfikún καί jáde: Ẹ̀mí Mímọ́ jẹ́ ẹlẹ́rìí mìíràn pẹ̀lú ẹ̀rí tí a ti ń jíròrò.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni orúkọ àdánidá, ọ̀wọ̀, àti ti òde òní ní Yorùbá fún Ẹ̀mí náà tí a yà sọ́tọ̀ gẹ́gẹ́ bí mímọ́.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: nítorí lẹ́yìn tí ó ti wí pé
  rationale: “Lẹ́yìn tí” pa ìtẹ̀lé àkókò inú gbólóhùn aláìlẹ́ni náà mọ́. Èdè Yorùbá nílò olùṣe tí a sọ jáde, nítorí náà “ó” tọ́ka padà sí Ẹ̀mí Mímọ́ láìfi ìtumọ̀ míì kún un; “wí pé” sì múra ọ̀nà sílẹ̀ fún ọ̀rọ̀ àyọlò tó tẹ̀ lé.
theological_decisions:
- issue: Ìṣe Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tó ń jẹ́rìí
  choice: Ẹ̀mí Mímọ́ náà sì ń jẹ́rìí fún wa
  alternative: Ẹ̀mí Mímọ́ náà sì ń fi ẹ̀rí fún wa
  rationale: Gíríìkì gbé Ẹ̀mí Mímọ́ kalẹ̀ gẹ́gẹ́ bí olùṣe ìjẹ́rìí. Ìtumọ̀ náà pa ìṣe ara-ẹni yìí mọ́ láìṣàlàyé rẹ̀ kọjá ohun tí gíríìkì sọ.
- issue: Olùṣe inú gbólóhùn “lẹ́yìn tí ó ti wí”
  choice: “ó” ń tọ́ka sí Ẹ̀mí Mímọ́
  alternative: Kí a fi olùṣe náà sílẹ̀ láìsọ, bí gbolohun Gíríìkì ṣe ṣe
  rationale: Infinitive Gíríìkì kò tún olùṣe náà sọ, ṣùgbọ́n gírámà Yorùbá nílò arọ́pò-orúkọ nínú gbólóhùn yìí. Olùṣe tó sún mọ́ ọn jù, tí ó sì ń jẹ́rìí, ni Ẹ̀mí Mímọ́; yíyan “ó” jẹ́ ohun tí ìṣètò ọ̀rọ̀ béèrè, kì í ṣe fífi ẹ̀kọ́ ìsìn tuntun kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó bójú mu, tó ní ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà mọ̀ọ́mọ̀ parí sí “pé,” nítorí ẹsẹ tó tẹ̀ lé ni ọ̀rọ̀ àyọlò náà bẹ̀rẹ̀.
