  source_fidelity: Ìtumọ̀ náà mú ìyàtọ̀ pàtàkì láàárín ὑποστολή sí ἀπώλεια àti πίστις sí περιποίησις ψυχῆς jáde. Ṣùgbọ́n “pípa ọkàn mọ́” yí περιποίησις padà sí ìṣe-ọrọ̀, ó sì lè túmọ̀ sí pípa ọkàn ẹni mọ́ tàbí ìṣọ́ra ọkàn, dípò orúkọ ìpamọ́/ìrètí ìyè tí ọ̀rọ̀ Gíríìkì náà ń sọ. “Ìyọ̀ǹda” nínú àlàyé a kò bá ὑποστολή mu.
  naturalness: “Sí ìpamọ́ ìyè” jẹ́ Yorùbá aládánidá, ó sì pa ìfararora orúkọ pẹ̀lú “sí ìparun” mọ́. Àtúnṣe àlàyé àwọn àpèjúwe náà tún mú ọ̀rọ̀ náà ṣe kedere sí òǹkàwé òde òní.
