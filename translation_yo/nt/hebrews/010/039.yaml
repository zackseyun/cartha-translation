  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: yo
  text: Ṣùgbọ́n àwa kì í ṣe àwọn tí ń fà sẹ́yìn sí ìparun,[a] bí kò ṣe àwọn tí wọ́n ní ìgbàgbọ́ sí ìpamọ́ ìyè.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn tí ń padà sẹ́yìn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfàsẹ́yìn tàbí ìpadàsẹ́yìn; àwọn kan ka a sí ìkọ̀sílẹ̀ ìgbàgbọ́ ní ìtumọ̀ tó le sí i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìdúróṣinṣin nínú ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìgbàgbọ́, ó sì lè tún ní èrò ìfaradà olóòótọ́.
    reason: alternative_reading
  - marker: c
    text: Tàbí “sí ìní ìyè” tàbí “sí ìní ara ẹni.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìpamọ́, ìní, tàbí rírí ìyè/ara ẹni gbà; kì í ṣe “ọkàn” ní ìtumọ̀ tóóró nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ṣùgbọ́n àwa
  rationale: A mú ọ̀rọ̀ arọ́pò-orúkọ náà jáde fún ìtẹnumọ́, a sì lo “Ṣùgbọ́n” láti fi ìyàtọ̀ tó lágbára sí ìkìlọ̀ tó ṣáájú hàn.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: kì í ṣe àwọn tí ń fà sẹ́yìn
  rationale: Èdè Gíríìkì sọ ní ṣókí pé “a kì í ṣe ti ìfàsẹ́yìn”; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì fi ìtumọ̀ ìfàsẹ́yìn tàbí ìyọ̀ǹda sílẹ̀ láìfi dandan pè é ní ìkọ̀sílẹ̀ ìgbàgbọ́ pátápátá.
- source_word: εἰς ἀπώλειαν
  choice: sí ìparun
  rationale: “Sí” fi àbájáde tàbí òpin ìfàsẹ́yìn hàn, “ìparun” sì mú ìwọ̀n líle ἀπώλεια jáde ní èdè òde òní.
- source_word: ἀλλὰ πίστεως
  choice: bí kò ṣe àwọn tí wọ́n ní ìgbàgbọ́
  rationale: Àtúnṣe ẹ̀ka yìí bá ìdíọ̀mù Yorùbá mu, “ìgbàgbọ́” sì pa ìtumọ̀ pàtàkì πίστις mọ́; ó lè tún ní ìfaradà nínú òtítọ́ nínú àyíká yìí.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: sí pípa ọkàn mọ́
  rationale: Àyíká ìyàtọ̀ sí “ìparun” ṣe àtìlẹ́yìn fún ìtumọ̀ pípa mọ́. “Ọkàn” pa ọ̀rọ̀ ìsìn tí a mọ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ pé ψυχή lè túmọ̀ sí ìyè tàbí ara ẹni lápapọ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní ìyàtọ̀ sí ὑποστολή
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́ tàbí fífaradà nínú òtítọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ tó ṣe kedere jù, ṣùgbọ́n àyíká ìkìlọ̀ àti ìfaradà lè fi ìṣòtítọ́ tó ń bá a lọ kún un; àlàyé ìsàlẹ̀ pa àṣàyàn náà mọ́.
- issue: Ìtumọ̀ περιποίησις ψυχῆς
  choice: pípa ọkàn mọ́
  alternative: ríri ìyè tàbí ara ẹni gbà; jíjẹ́ olúwa ọkàn ẹni
  rationale: Ìyàtọ̀ sí “ìparun” ń tọ́ka sí ìpamọ́ tàbí ìgbàlà, ṣùgbọ́n περιποίησις tún lè ní ìtumọ̀ rírí nǹkan gbà tàbí níní rẹ̀. A kò sọ ìtumọ̀ yẹn di ẹ̀kọ́ pé ènìyàn ń jèrè ìgbàlà nípa iṣẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé yé fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ “àwọn tí…” mú ẹ̀ka ìdánimọ̀ inú Gíríìkì jáde lọ́nà àdánidá, láìsọ ìkìlọ̀ náà di ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
