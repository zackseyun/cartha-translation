  to: 'Nítorí náà[a], bí ó ti ń wọ ayé, ó wí pé: “Ìwọ kò fẹ́ ẹbọ àti ọrẹ, ṣùgbọ́n o ti pèsè ara kan fún mi.”'
  rationale: Àtúnṣe náà jẹ́ ti ìròyìn èdè àti ìmú-kedere nìkan. Ó pa ìtumọ̀ Gíríìkì mọ́, ó sì dá ìyàtọ̀ tó wà láàárín ọ̀rọ̀ Gíríìkì Hébérù 10:5 àti ọ̀rọ̀ Hébérù Sáàmù 40:6 sílẹ̀ ní àlàyé ìsàlẹ̀.
