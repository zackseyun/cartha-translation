  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: yo
  text: 'Nítorí náà[a], bí ó ti ń wọ ayé, ó wí pé: “Ìwọ kò fẹ́ ẹbọ àti ọrẹ, ṣùgbọ́n o ti pèsè ara kan fún mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú ẹsẹ̀ yìí, ìwé Hébérù tẹ̀ lé ọ̀rọ̀ Gíríìkì ti Sáàmù 40:6 pé, “o ti pèsè ara kan fún mi.” Ṣùgbọ́n ọ̀rọ̀ èdè Hébérù nínú Sáàmù 40:6 ní pé, “o ti ṣí etí mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ yìí so mọ́ àríyànjiyàn tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ inferential náà ní Yorùbá.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: bí ó ti ń wọ inú ayé
  rationale: Ó pa ìrísí participle present náà mọ́ nínú àwòrán ìwọlé tí ń ṣẹlẹ̀, láì fi àkókò tí Gíríìkì kò sọ kún un.
- source_word: λέγει
  choice: ó wí pé
  rationale: Ó pa present citation frame mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí Ìwé Mímọ́ ń sọ lọ́wọ́lọ́wọ́; “wí” tún bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ tí ó ní iyì mu.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Ẹbọ àti ọrẹ
  rationale: 'A pa àwọn ọ̀rọ̀ ìsìn méjèèjì mọ́ ní ọ̀tọ̀: “ẹbọ” fún θυσία àti “ọrẹ” fún προσφορά, ní èdè tí òǹkàwé Yorùbá òde òní lè lóye.'
- source_word: οὐκ ἠθέλησας
  choice: ìwọ kò fẹ́
  rationale: “Fẹ́” sọ ìfẹ́ tàbí ìfẹ́-inú θέλω ní kedere àti ní ti ẹ̀dá Yorùbá, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó le ju.
- source_word: σῶμα
  choice: ara kan
  rationale: Ó jẹ́ ara ẹlẹ́yọ̀ọ̀kan tí ó ṣe pàtàkì nínú àyọlò yìí; “kan” mú un ṣe àìlópin bí Gíríìkì ṣe rí.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ẹbọ tí a kò fẹ́ àti ara tí a pèsè.
- source_word: κατηρτίσω μοι
  choice: ìwọ ti pèsè ... fún mi
  rationale: “Pèsè” jẹ́ ìtumọ̀ àdánidá fún καταρτίζω ní àyíká yìí, “fún mi” sì fi iṣẹ́ dative μοι hàn. Perfect Yorùbá “ti pèsè” n sọ iṣẹ́ tí a ti múra sílẹ̀ ní kedere.
theological_decisions:
- issue: Ọ̀rọ̀ àyọlò Sáàmù 40:6 nínú Hébérù yàtọ̀ sí ọ̀rọ̀ Hébérù Masoretic.
  choice: “ìwọ ti pèsè ara kan fún mi” gẹ́gẹ́ bí Gíríìkì Hébérù 10:5 ṣe wí
  alternative: “ìwọ ti ṣí etí mi” tàbí “ìwọ ti gbẹ́ etí fún mi,” gẹ́gẹ́ bí ọ̀rọ̀ Hébérù Sáàmù 40:6
  rationale: Ẹsẹ Hébérù tí a ń túmọ̀ ní σῶμα, “ara,” ní kedere. A kò mú un bá ọ̀rọ̀ Hébérù inú Sáàmù mu ní ipá; dípò bẹ́ẹ̀, a pa ìyàtọ̀ tó ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn. A lo “ó wí” fún ìforúkọsílẹ̀ Ìwé Mímọ́, “ẹbọ àti ọrẹ” sì pa àwọn ẹ̀ka ọrẹ ìsìn méjèèjì mọ́ láì da wọn pọ̀.
