id: HEB.10.19
reference: Hebrews 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará[a], níwọ̀n bí a ti ní ìgboyà láti wọ inú àwọn ibi mímọ́[b] nípasẹ̀ ẹ̀jẹ̀ Jésù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ní “arákùnrin,” ó sì lè dúró fún gbogbo ìjọ, àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ibi ìjọsìn mímọ́”; nínú àwòrán ilé àgọ́ ìjọsìn tí Hébérù ń lò, gbólóhùn yìí ń tọ́ka sí àwọn ibi mímọ́ níwájú Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: níwọ̀n bí a ti ní
  rationale: Ẹ̀ka ọ̀rọ̀ participle náà ń fi ìpìlẹ̀ fún ìkìlọ̀ tí ó tẹ̀ lé e hàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìdí tàbí ìmọ̀ràn ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ̀ yìí mọ́ àríyànjiyàn tí ó ṣáájú, ó sì fi àbájáde rẹ̀ hàn.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ní Yorùbá, “ẹ̀yin ará” jẹ́ ọ̀nà àdánidá àti ọlọ́lá láti bá àwọn ọmọ ìjọ sọ̀rọ̀ lápapọ̀. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí rẹ̀.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Ó ń sọ nípa ìgbẹ́kẹ̀lé alágbára àti òmìnira láti sún mọ́ Ọlọ́run, kì í ṣe àìbọ̀wọ̀.
- source_word: εἰς τὴν εἴσοδον
  choice: láti wọ inú
  rationale: Ó tú gbólóhùn orúkọ Gíríìkì tí ó túmọ̀ sí ìwọlé sílẹ̀ ní Yorùbá àdánidá, láìsọ ìtumọ̀ rẹ̀ di ohun mìíràn.
- source_word: τῶν ἁγίων
  choice: àwọn ibi mímọ́
  rationale: Ó pa ìrísí ọ̀pọ̀ àti àwòrán ilé àgọ́ ìjọsìn mọ́, kò sì dín ọ̀rọ̀ náà kù sí Ibi Mímọ́ Jù Lọ nìkan.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: nípasẹ̀ ẹ̀jẹ̀ Jésù
  rationale: “Nípasẹ̀” fi ẹ̀jẹ̀ Jésù hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ ìwọlé, ó sì pa agbára ètùtù inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtúmọ̀ τῶν ἁγίων
  choice: àwọn ibi mímọ́ tí ó ní í ṣe pẹ̀lú wíwàníhìn-ín Ọlọ́run
  alternative: ibi ìjọsìn; Ibi Mímọ́ Jù Lọ; àwọn ẹni mímọ́
  rationale: Àyíká Hébérù ń tẹ̀ lé àwòrán ilé àgọ́ ìjọsìn àti sísún mọ́ Ọlọ́run. “Àwọn ibi mímọ́” pa ààyè ìtumọ̀ Gíríìkì mọ́ láìsọ ọ́ di Ibi Mímọ́ Jù Lọ nìkan.
- issue: Àwọn tí ἀδελφοί ń bá sọ̀rọ̀
  choice: “ẹ̀yin ará” fún gbogbo ìjọ, pẹ̀lú àlàyé ní ìsàlẹ̀ ojú ìwé nípa ìrísí akọ ti Gíríìkì
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ẹ̀yin ará” ni ọ̀nà Yorùbá tí ó wọ́pọ̀ láti pe gbogbo àwọn ọmọ ẹgbẹ́ kan. Àlàyé náà pa ìrísí ọ̀rọ̀ orísun mọ́, láìfi ìyàtọ̀ akọ-abo tí Yorùbá kò fi hàn ní ọ̀nà yìí kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. Gbólóhùn náà parí pẹ̀lú àmì kọ́mà nítorí pé ẹsẹ̀ yìí ń bá a lọ sínú ìrònú ẹsẹ̀ tí ó tẹ̀ lé e.
