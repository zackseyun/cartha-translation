  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní ìbámu gbogbogbò: ìtẹ̀lé τότε, ìwà-títílọ ti ἥκω nínú “mo ti dé,” ìyàtọ̀ láàárín “àkọ́kọ́” àti “èkejì,” àti ìbáṣepọ̀ ète nínú “kí ó lè.” Ṣùgbọ́n “Kíyèsí i” ń mú aṣojú-orúkọ ohun (“i”) wọlé láìsí nínú Ἰδού, ó sì kéré sí ìpè ìfọkànsìn tí ọ̀rọ̀ náà ní.'
