  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: yo
  text: Nígbà náà, ó wí pé, “Wò ó, mo ti dé láti ṣe ìfẹ́ rẹ.” Ó mú èyí àkọ́kọ́ kúrò, kí ó lè fi èkejì múlẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Èyí àkọ́kọ́” àti “èkejì” lè tọ́ka, ní ìbámu pẹ̀lú àyíká Hébérù 10:8–10, sí àwọn ẹbọ àti ọrẹ àkọ́kọ́ àti sí ṣíṣe ìfẹ́ Ọlọ́run. Àwọn kan sì ń lóye wọn gẹ́gẹ́ bí àwọn gbólóhùn méjì inú ọ̀rọ̀ Sáàmù náà, tàbí ní ìtumọ̀ gbòòrò gẹ́gẹ́ bí májẹ̀mú àtijọ́ àti májẹ̀mú tuntun.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú àkókò àti ìjiyàn hàn ní Yorùbá àdánidá.
- source_word: εἴρηκεν
  choice: ó wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ perfect, ọ̀nà yìí ló jẹ́ àdánidá jù ní Yorùbá, ó sì bá τότε mu láìsọ ìtumọ̀ rẹ̀ di ohun tí kò ṣe kedere.
- source_word: Ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó pa ìpè sí àfiyèsí àti ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mọ́, láìdi ọ̀rọ̀ àsọyé ojoojúmọ́.
- source_word: ἥκω
  choice: mo ti dé
  rationale: Ó fi dídé tí àbájáde rẹ̀ ṣì dúró hàn, gẹ́gẹ́ bí ἥκω ṣe lè túmọ̀ sí ‘mo ti dé/mo wà níhìn-ín.’
- source_word: τοῦ ποιῆσαι
  choice: láti ṣe
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún infinitive ète.
- source_word: τὸ θέλημά σου
  choice: ìfẹ́ rẹ
  rationale: ‘Ìfẹ́’ níhìn-ín túmọ̀ sí ohun tí Ọlọ́run fẹ́ tàbí ìpinnu rẹ̀; ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ nínú àyíká yìí.
- source_word: ἀναιρεῖ
  choice: Ó mú ... kúrò
  rationale: Ó túmọ̀ ìmúkúrò tàbí fífi ohun kan sí ẹ̀gbẹ́, láìfi ‘parẹ́’ tàbí ìtumọ̀ òfin kan kún un.
- source_word: τὸ πρῶτον
  choice: èyí àkọ́kọ́
  rationale: Ó pa ìsọ̀rọ̀ kúkúrú Gíríìkì mọ́, kò sì sọ ohun tí ó ń tọ́ka sí ní pàtó ju ẹsẹ̀ náà lọ.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a fẹ́ hàn.
- source_word: τὸ δεύτερον
  choice: èkejì
  rationale: Ó pa ìfarawe pẹ̀lú ‘èyí àkọ́kọ́’ àti àìdánilójú ohun tí ọ̀rọ̀ náà ń tọ́ka sí mọ́.
- source_word: στήσῃ
  choice: fi ... múlẹ̀
  rationale: Ó sọ ìdásílẹ̀ tàbí fífi ohun kan dúró ṣinṣin hàn, ó sì bá ìtakora pẹ̀lú ‘mú ... kúrò’ mu.
theological_decisions:
- issue: Ohun tí ‘èyí àkọ́kọ́’ àti ‘èkejì’ ń tọ́ka sí
  choice: 'A fi ọ̀rọ̀ náà sílẹ̀ ní ṣókí gẹ́gẹ́ bí Gíríìkì: ‘èyí àkọ́kọ́’ àti ‘èkejì.’'
  alternative: A lè túmọ̀ wọn ní gbangba sí ètò ẹbọ àkọ́kọ́ àti ìmúṣẹ ìfẹ́ Ọlọ́run nínú ẹbọ ara Mèsáyà; tàbí sí àwọn gbólóhùn méjì nínú Sáàmù; tàbí sí májẹ̀mú àtijọ́ àti tuntun.
  rationale: Hébérù 10:8–10 fi ẹbọ àti ọrẹ wé ṣíṣe ìfẹ́ Ọlọ́run, ṣùgbọ́n ẹsẹ̀ 9 fúnra rẹ̀ kò pe ohun méjèèjì ní orúkọ. Ìtumọ̀ náà pa àìdánilójú tòótọ́ àti ìfọkànsìn ẹ̀kọ́ ẹ̀sìn yìí mọ́.
translation_notes:
  register: Yorùbá ìpele boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà ní ọlá àti ìṣàn àdánidá. ‘Kíyèsí i’ pa ìwọ̀n ọ̀rọ̀ mímọ́ mọ́, nígbà tí ìtòlẹ́sẹẹsẹ gbólóhùn yòókù rọrùn fún òǹkàwé òde òní.
