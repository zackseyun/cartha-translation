translation:
  language: yo
  text: láti ìgbà náà lọ, ó ń dúró de ìgbà tí a ó fi sọ àwọn ọ̀tá rẹ̀ di àpótí ìtìsẹ̀ fún àwọn ẹsẹ̀ rẹ̀[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń retí” tàbí “ó ń dúró de.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídúró pẹ̀lú ìrètí.
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ yìí ń mú Sáàmù 110:1 wá sí ìrántí, ẹsẹ̀ pàtàkì nípa jíjókòó ọba lórí ìtẹ́: “Jókòó ní ọwọ́ ọ̀tún mi, títí èmi yóò fi sọ àwọn ọ̀tá rẹ di àpótí ìtìsẹ̀ fún àwọn ẹsẹ̀ rẹ.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: láti ìgbà náà lọ
  rationale: Gbólóhùn náà ń tọ́ka sí àkókò tí ó bẹ̀rẹ̀ lẹ́yìn tí Ọmọ náà rú ẹbọ rẹ̀ tán, tí ó sì jókòó ní ọwọ́ ọ̀tún Ọlọ́run; èyí jẹ́ Yorùbá àdánidá fún ‘láti ìgbà yẹn lọ.’
- source_word: ἐκδεχόμενος
  choice: ó ń dúró de
  rationale: Ó fi ìṣe tí ó ń bá a lọ hàn, ó sì lè ní ìtumọ̀ dídúró pẹ̀lú ìrètí láìfi àní-àní kún ọ̀rọ̀ náà.
- source_word: ἕως
  choice: de ìgbà tí
  rationale: Ó ṣàfihàn òpin àkókò dídúró náà ní Yorùbá àdánidá.
- source_word: τεθῶσιν
  choice: a ó fi sọ ... di
  rationale: 'Ìṣètò yìí pa ohùn àìṣe-aláìlórúkọ Gíríìkì mọ́: a kò sọ ẹni tó ń ṣe iṣẹ́ náà ní kedere, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run.'
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: àwọn ọ̀tá rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ohun-ìní Gíríìkì mu.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ̀
  rationale: A pa àwòrán gidi ti Sáàmù 110:1 mọ́ dípò yíyí i padà sí ‘ṣẹ́gun’ tàbí ‘tẹ̀ mọ́lẹ̀.’
theological_decisions:
- issue: Àwòrán ìjòkó-lórí-ìtẹ́ Mèsáyà láti Sáàmù 110:1
  choice: Pa ọ̀rọ̀ ‘àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ̀’ mọ́.
  alternative: títí a ó fi ṣẹ́gun àwọn ọ̀tá rẹ̀; títí a ó fi àwọn ọ̀tá rẹ̀ sí abẹ́ ẹsẹ̀ rẹ̀
  rationale: Hébérù mọ̀ọ́mọ̀ ń pe Sáàmù 110:1 wá sí ìrántí. Àwòrán àpótí ìtìsẹ̀ pa ìsopọ̀ ọ̀rọ̀ àti agbára ẹ̀kọ́ nípa ìjọba Kristi mọ́ láìṣe àlàyé tó kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘a ó’ láti pa ẹni tó ṣe iṣẹ́ náà mọ́ láìlórúkọ gẹ́gẹ́ bí Gíríìkì, a sì pa àwòrán Sáàmù mọ́.
