  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: yo
  text: Nítorí pé, nípasẹ̀ ẹbọ kan, ó ti sọ àwọn tí a ń sọ di mímọ́[a] di pípé fún gbogbo ìgbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a ń yà sí mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: kan ṣoṣo
  rationale: Ó ń ṣàpèjúwe προσφορᾷ, ó sì tẹnumọ́ pé ọrẹ náà jẹ́ ẹyọ kan ṣoṣo.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó ṣáájú.
- source_word: προσφορᾷ
  choice: ọrẹ
  rationale: “Ọrẹ” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ohun tí a mú wá fún Ọlọ́run, ó sì pa ìtumọ̀ náà mọ́ láì fi “ẹbọ” tí ó túmọ̀ sí sacrifice pàtó rọ́pò rẹ̀.
- source_word: τετελείωκεν
  choice: ó ti sọ ... di pípé
  rationale: Ìṣe pípé Gíríìkì náà tọ́ka sí ohun tí a ti ṣe tán tí àbájáde rẹ̀ sì dúró; “ó ti sọ ... di pípé” pa ìṣe tí ó parí àti ipò tí ó ń bá a lọ mọ́.
- source_word: εἰς τὸ διηνεκές
  choice: fún gbogbo ìgbà
  rationale: Ó sọ bí ipa ọrẹ kan náà ṣe dúró láìlópin; ọ̀rọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì sún mọ́ ìtumọ̀ àkókò tó wà nínú Gíríìkì.
- source_word: τοὺς ἁγιαζομένους
  choice: àwọn tí a ń sọ di mímọ́
  rationale: Àpólà aláìṣe ní àkókò ìsinsìnyí ń fi ìṣe tí ó ń lọ hàn. Ìtumọ̀ yìí pa ìlọsíwájú náà àti ohùn aláìṣe mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín pípé tí a ti mú ṣẹ àti sísọ di mímọ́ tí ó ń lọ lọ́wọ́
  choice: Pa “ó ti sọ ... di pípé” mọ́ lẹ́gbẹ̀ẹ́ “àwọn tí a ń sọ di mímọ́.”
  alternative: Tú gbogbo gbólóhùn náà sí ipò tí a ti ní lẹ́ẹ̀kan ṣoṣo, tàbí mú kí ìtumọ̀ rẹ̀ jẹ́ ìlọsíwájú nìkan.
  rationale: Gíríìkì mọ̀ọ́mọ̀ so àbájáde tí a ti mú ṣẹ tí ó sì dúró pọ̀ mọ́ ìṣe tàbí ìdánimọ̀ sísọ di mímọ́ tí ó ń lọ. Ìtumọ̀ náà kò yanjú ìfọ̀kàntán yìí sí ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti kedere ni a lò. “Kan ṣoṣo” tẹnumọ́ ẹyọ ọrẹ náà; “fún gbogbo ìgbà” sì jẹ́ àdánidá ju ọ̀rọ̀ àtijọ́ tàbí àlùfáà lọ.
