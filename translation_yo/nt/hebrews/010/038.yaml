  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: yo
  text: Ṣùgbọ́n olódodo mi[b] yóò yè nípa ìgbàgbọ́[a]; bí ó[c] bá sì fà sẹ́yìn, ọkàn mi kò ní inú dídùn nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nípa ìṣòtítọ́” tàbí “nípa ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì pistis lè ní àwọn ìtumọ̀ wọ̀nyí, bí ó tilẹ̀ jẹ́ pé a lo “ìgbàgbọ́” nínú ẹsẹ.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan kàn ní “olódodo,” wọn kò ní “mi.”
    reason: textual_variant
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì lo ẹyọ akọ (“òun”), ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú, kò sì pọn dandan pé ó ń sọ nípa àwọn ọkùnrin nìkan. Arọ́pò-orúkọ Yorùbá “ó” kò fi akọ àti abo yà.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δίκαιός
  choice: olódodo
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ fún ẹni tí ó jẹ́ olódodo. “Olódodo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi akọ tàbí abo kún ohun tí ọ̀rọ̀ náà túmọ̀ sí.
- source_word: μου
  choice: mi
  rationale: A tẹ̀ lé àkọsílẹ̀ SBLGNT, tí ó ní arọ́pò-orúkọ náà, nítorí náà a túmọ̀ rẹ̀ sí “olódodo mi.”
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Ní ibi yìí ἐκ ń fi ìpìlẹ̀ tàbí ọ̀nà ìyè hàn. “Nípa ìgbàgbọ́” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ “ìṣòtítọ́” àti “ìgbẹ́kẹ̀lé” mọ́.
- source_word: ζήσεται
  choice: yóò yè
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú, “yóò yè” sì jẹ́ gbólóhùn Yorùbá ṣókí tí ó bá “will live” mu láìfi irú ìyè tí a ń sọ̀rọ̀ rẹ̀ pinnu.
- source_word: ὑποστείληται
  choice: fà sẹ́yìn
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí yíyẹ̀ sẹ́yìn tàbí kíkùnà láti tẹ̀ síwájú nígbà ìdẹ̀rùn tàbí ìpọ́njú. “Fà sẹ́yìn” jẹ́ àdánidá, ó sì pa ìkìlọ̀ inú ẹsẹ náà mọ́.
- source_word: οὐκ εὐδοκεῖ
  choice: kò ní inú dídùn
  rationale: Èyí ń sọ àìní ìfẹ́-inú tàbí inú dídùn. Ìtumọ̀ náà bá ọ̀rọ̀ Yorùbá mu, ó sì pa agbára ti gbólóhùn náà mọ́.
- source_word: ἡ ψυχή μου
  choice: ọkàn mi
  rationale: Gíríìkì sọ ní tààrà pé “ọkàn mi.” A pa àwòrán ti orísun Ìwé Mímọ́ náà mọ́ dípò yíyí i padà sí “èmi” nìkan.
- source_word: ἐν αὐτῷ
  choice: sí i
  rationale: Pẹ̀lú gbólóhùn Yorùbá “ní inú dídùn,” “sí i” ni àjọṣe ọ̀rọ̀ tí ó jẹ́ àdánidá jù lọ fún ẹni tí inú kò dùn sí.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ἐκ πίστεως
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé
  rationale: πίστις lè ní àwọn ìtumọ̀ wọ̀nyí, pàápàá nínú àyọlò Hábákúkù. A lo “ìgbàgbọ́” nínú ẹsẹ, ṣùgbọ́n a kò pa àwọn ìtumọ̀ mìíràn rẹ́ nù; a fi wọ́n sínú àlàyé ìsàlẹ̀ ojú ewé.
- issue: Ẹni tí gbólóhùn “bí ó bá sì fà sẹ́yìn” ń tọ́ka sí
  choice: ẹni kan náà tí a pè ní “olódodo mi”
  alternative: ẹnikẹ́ni mìíràn tí a kò dárúkọ
  rationale: Gíríìkì ń bá arọ́pò-orúkọ ẹyọ kan lọ láìsọ pé ẹni tí a ń sọ̀rọ̀ rẹ̀ yí padà. A pa ìṣàn girama àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ìkìlọ̀ náà mọ́ láìrọ̀ ọ́.
- issue: Akọ nínú girama Gíríìkì
  choice: lo arọ́pò-orúkọ ẹyọ Yorùbá “ó”
  alternative: fi ọ̀rọ̀ “ọkùnrin” kún un tàbí lo ọ̀pọ̀ ènìyàn
  rationale: Àwọn fọ́ọ̀mù Gíríìkì jẹ́ ẹyọ akọ, ṣùgbọ́n arọ́pò-orúkọ ẹni kẹta Yorùbá kò fi akọ àti abo yà. “Ó” pa ẹyọ náà mọ́ láìfi akọ kún ọ̀rọ̀ Yorùbá lọ́nà àìdánidá; àlàyé sì ṣàlàyé ipa aṣojú akọ inú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ṣókí, ó sì yẹ fún kíkà ní gbangba. A lo “olódodo mi,” “yóò yè,” àti “fà sẹ́yìn” láti pa àwòrán àti ìkìlọ̀ Gíríìkì mọ́ ní ọ̀nà tí òǹkà Yorùbá òde òní lè lóye.
