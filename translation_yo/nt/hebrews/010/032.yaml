id: HEB.10.32
reference: Hebrews 10:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n ẹ rántí àwọn ọjọ́ ìṣáájú, nígbà tí, lẹ́yìn tí a ti fún yín ní ìmọ́lẹ̀[a][b], ẹ fara da ìjàkadì ńlá nínú àwọn ìjìyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí a fún yín ní ìmọ́lẹ̀.” Ọ̀rọ̀ ìṣe aláìlẹ́gbẹ́ Gíríìkì lè tọ́ka sí ohun tó ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú ìfaradà wọn tàbí ohun tó ṣáájú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “a fún yín ní ìmọ́lẹ̀” lè túmọ̀ sí gbígba ìmọ́lẹ̀ nípa ti ẹ̀mí ní gbogbogbòò. Àwọn kan so ó mọ́ ìyípadà, ìbatisí, tàbí kíkọ́ni nípa ìgbàgbọ́, ṣùgbọ́n ẹsẹ̀ yìí kò yan ọ̀kan nínú wọn ní pàtó.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìdíje líle nínú àwọn ìjìyà.” Ọ̀rọ̀ Gíríìkì náà ní èrò ìjàkadì tàbí ìdíje.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: ẹ rántí
  rationale: Ó mú àṣẹ ẹni kejì ọ̀pọ̀ jáde ní Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ Gíríìkì lè tẹnumọ́ ìṣe tí ń bá a lọ, àṣẹ ‘ẹ rántí’ lè gbé ìtumọ̀ yẹn láì fi ọ̀rọ̀ kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ tí ó ní ìyàtọ̀ sí ìkìlọ̀ tó ṣáájú hàn.
- source_word: τὰς πρότερον ἡμέρας
  choice: àwọn ọjọ́ ìṣáájú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí àkókò ìṣáájú tí òǹkọ̀wé fẹ́ kí wọn rántí.
- source_word: ἐν αἷς
  choice: nígbà tí
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gígún ni ‘nínú èyí tí,’ gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí àmì àkókò níbí.
- source_word: φωτισθέντες
  choice: lẹ́yìn tí a ti fún yín ní ìmọ́lẹ̀
  rationale: Ó pa àwòrán ‘ìmọ́lẹ̀’ àti ohùn àìṣe Gíríìkì mọ́, ó sì fi hàn pé ìṣẹ̀lẹ̀ náà ṣáájú ìfaradà wọn, láì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó di dandan.
- source_word: πολλὴν ἄθλησιν
  choice: ìjàkadì ńlá
  rationale: ‘Ìjàkadì’ mú èrò ìsapá líle tàbí ìdíje inú ọ̀rọ̀ Gíríìkì jáde, ‘ńlá’ sì ṣàfihàn bí ó ti le tó.
- source_word: ὑπεμείνατε
  choice: ẹ fara da
  rationale: Ọ̀rọ̀ Yorùbá yìí bá ìfaradà lábẹ́ ìyà mu, ó sì mú ìṣe tí àwọn olùgbọ́ ṣe ní àkókò tó kọjá hàn.
- source_word: παθημάτων
  choice: nínú àwọn ìjìyà
  rationale: Ó ṣàfihàn pé ìjàkadì náà wá láàárín onírúurú ìrírí ìyà, láì dín ìtumọ̀ rẹ̀ kù sí irú ìṣòro kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ φωτισθέντες nínú ọ̀rọ̀ ìkìlọ̀ àti ìṣírí
  choice: Pa àwòrán pé ‘a fún yín ní ìmọ́lẹ̀’ mọ́ láì sọ ohun tó ń tọ́ka sí ní pàtó.
  alternative: Lẹ́yìn tí ẹ yí padà; lẹ́yìn ìbatisí yín; lẹ́yìn tí ẹ gba ìmọ́lẹ̀ ìhìnrere.
  rationale: Ẹsẹ̀ náà sọ ní kedere pé wọ́n ti gba ìmọ́lẹ̀ nípa ti ẹ̀mí, ṣùgbọ́n kò sọ pé ó jẹ́ ìyípadà, ìbatisí, tàbí ẹ̀kọ́ ìgbàgbọ́ ní pàtó. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú orísun mọ́, kò sì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì bá ọ̀rọ̀ ìṣírí mímọ́ mu. Ọ̀rọ̀ ‘ẹ’ fi hàn pé a ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀; ‘ìmọ́lẹ̀’ pa àwòrán orísun mọ́, ‘ìjàkadì’ sì jẹ́ ọ̀rọ̀ òde òní tí ó ṣì ní iyì.
