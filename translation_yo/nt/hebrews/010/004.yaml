  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: yo
  text: Nítorí kò ṣeé ṣe fún ẹ̀jẹ̀ àwọn akọ màlúù àti ti àwọn akọ ewúrẹ́ láti mú àwọn ẹ̀ṣẹ̀ kúrò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘yọ àwọn ẹ̀ṣẹ̀ kúrò.’ Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí mímú ohun kan kúrò tàbí yíyọ ọ́ kúrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: kò ṣeé ṣe
  rationale: Ọ̀rọ̀ ajẹtífù yìí ní agbára pípé pé ohun náà kò lè ṣẹlẹ̀; gbolohun Yorùbá yìí sì bá ìlò rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe aláìlópin mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí àlàyé fún àríyànjiyàn tó ṣáájú múlẹ̀, ó sì pa ìṣàn ọgbọ́n inú ọ̀rọ̀ náà mọ́.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Orísun náà sọ ẹ̀jẹ̀ ìrúbọ ní tààrà; a kò yí i padà sí ‘ìrúbọ’ tàbí ‘ikú.’
- source_word: ταύρων
  choice: àwọn akọ màlúù
  rationale: Ó túmọ̀ sí ọ̀pọ̀ akọ màlúù, ó sì jẹ́ ohun tí ẹ̀jẹ̀ náà ti wá.
- source_word: τράγων
  choice: àwọn akọ ewúrẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí akọ ewúrẹ́; pípa akọ mọ́ hàn jẹ́ kedere, ó sì bá èdè ìrúbọ mu.
- source_word: ἀφαιρεῖν
  choice: láti mú ... kúrò
  rationale: Ó pa ìtumọ̀ yíyọ tàbí mímú ohun kan kúrò mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní fọ́ọ̀mù ọ̀pọ̀, ‘ẹ̀ṣẹ̀’ ní Yorùbá lè jẹ́ ọ̀rọ̀ àkójọpọ̀ fún àwọn ẹ̀ṣẹ̀ láìsọ ìtumọ̀ di ohun àfojúrí kan ṣoṣo.
theological_decisions:
- issue: Agbára ìrúbọ ẹranko láti mú ẹ̀ṣẹ̀ kúrò
  choice: Ẹsẹ̀ náà sọ pé ẹ̀jẹ̀ ẹranko kò lè mú ẹ̀ṣẹ̀ kúrò ní ìtumọ̀ ìkẹyìn tí àríyànjiyàn inú Hébérù ń tọ́ka sí.
  alternative: Àwọn ìrúbọ náà bo ẹ̀ṣẹ̀ fún ìgbà díẹ̀, tàbí wọ́n mú ìwẹ̀nùmọ́ ti àṣà wá láì mú ẹ̀ṣẹ̀ kúrò ní ìkẹyìn.
  rationale: Ọ̀rọ̀ pàtàkì náà dúró sí ‘mú ẹ̀ṣẹ̀ kúrò,’ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kun un; èyí pa ìyàtọ̀ tí àyíká ọ̀rọ̀ fi hàn láàárín ìrúbọ ẹranko tí a ń ṣe léraléra àti ìrúbọ Mèsáyà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye lójoojúmọ́, ni a lò. A fi àmì ohùn sí ibi tí ó bá àdánidá mu. ‘Akọ màlúù’ àti ‘akọ ewúrẹ́’ pa ìsọ pàtó ti àwọn ọ̀rọ̀ Gíríìkì mọ́; ‘ẹ̀ṣẹ̀’ jẹ́ orúkọ àkójọpọ̀ àdánidá ní Yorùbá.
