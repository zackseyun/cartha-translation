id: HEB.10.12
reference: Hebrews 10:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: yo
  text: Ṣùgbọ́n ẹni yìí, lẹ́yìn tí ó ti rú ẹbọ kan ṣoṣo fún ẹ̀ṣẹ̀ títí láé,[a] ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “lẹ́yìn tí ó ti rú ẹbọ kan ṣoṣo fún ẹ̀ṣẹ̀, ó jókòó títí láé.” Gbólóhùn Gíríìkì náà lè sún mọ́ rírú ẹbọ náà, kí ó tẹnu mọ́ ìdúróṣinṣin ẹbọ náà, tàbí kí ó sún mọ́ ìjókòó náà.
    reason: alternative_reading
  - marker: b
    text: “Ní ọwọ́ ọ̀tún Ọlọ́run” ń mú Sáàmù 110:1 wá sí ìrántí; ẹsẹ̀ yìí ṣe pàtàkì nínú ìwé Hébérù fún ìgbéga Mèsáyà.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: ẹni yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka náà mọ́, ó sì fi ẹni yìí ṣe ìyàtọ̀ sí àwọn àlùfáà tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ẹni yìí àti àwọn àlùfáà tí wọ́n dúró lójoojúmọ́ láti máa rú ẹbọ léraléra.
- source_word: μίαν ... θυσίαν
  choice: ẹbọ kan ṣoṣo
  rationale: Ó tẹnu mọ́ pé ẹbọ náà jẹ́ ọ̀kan ṣoṣo, ní ìyàtọ̀ sí ọ̀pọ̀ ẹbọ tí a ń rú léraléra.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: fún ẹ̀ṣẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ète ẹbọ; ẹ̀ṣẹ̀ jẹ́ orúkọ àkójọpọ̀ tó lè dúró fún àwọn ẹ̀ṣẹ̀ gẹ́gẹ́ bí ọ̀pọ̀ nínú Gíríìkì.
- source_word: προσενέγκας
  choice: lẹ́yìn tí ó ti rú
  rationale: Ó fi hàn pé rírú ẹbọ náà ti ṣẹlẹ̀ ṣáájú ìjókòó, ní Yorùbá àdánidá.
- source_word: εἰς τὸ διηνεκές
  choice: èyí tí ó wúlò títí láé
  rationale: Ó sọ ìwúlò ẹbọ tó dúró ṣinṣin ní ọ̀nà tó yé kedere, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú ìsopọ̀ gbólóhùn Gíríìkì náà mọ́.
- source_word: ἐκάθισεν
  choice: ó jókòó
  rationale: Ó pa ìṣe tí ó parí mọ́, ó sì bá àwòrán ẹni tó gba ìjókòó ọlá mu.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó mọ́, tó sì pa ìtọ́kasí sí Sáàmù 110:1 mọ́.
theological_decisions:
- issue: Ohun tí εἰς τὸ διηνεκές so mọ́
  choice: 'A so ó mọ́ ìwúlò ẹbọ kan ṣoṣo náà: “èyí tí ó wúlò títí láé.”'
  alternative: A lè so ó mọ́ rírú ẹbọ náà, “ó rú ẹbọ kan ṣoṣo fún ẹ̀ṣẹ̀ títí láé,” tàbí mọ́ ìjókòó rẹ̀, “ó jókòó títí láé ní ọwọ́ ọ̀tún Ọlọ́run.”
  rationale: Ọ̀rọ̀ inú Hébérù 10 ń tẹnu mọ́ ìmúlò ẹbọ Kristi kan ṣoṣo tó wà pẹ́ títí, ní ìyàtọ̀ sí àwọn ẹbọ Léfì tí a ń rú léraléra. Àkọsílẹ̀ ìsàlẹ̀ jẹ́ kí àìdánilójú gírámà Gíríìkì náà ṣì hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. “Ẹni yìí” pa ìtẹnumọ́ atọ́ka mọ́; “rú ẹbọ” jẹ́ ọ̀rọ̀ ẹ̀sìn tó wọ́pọ̀, tó sì yéye.
