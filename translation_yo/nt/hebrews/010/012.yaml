revisions:
- from: Ṣùgbọ́n ẹni yìí, lẹ́yìn tí ó ti rú ẹbọ kan ṣoṣo fún ẹ̀ṣẹ̀, èyí tí ó wúlò títí láé,[a] ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run,[b]
  to: Ṣùgbọ́n ẹni yìí, lẹ́yìn tí ó ti rú ẹbọ kan ṣoṣo fún ẹ̀ṣẹ̀ títí láé,[a] ó jókòó ní ọwọ́ ọ̀tún Ọlọ́run,[b]
  rationale: The revision removes an added explicit claim about efficacy while retaining the source phrase “títí láé” in the sacrificial clause, the reading most consistent with the immediate contrast of the verse. The revised note records the viable alternative attachment to “ó jókòó,” without imposing either construction as certain.
