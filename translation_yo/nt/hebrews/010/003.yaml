  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: yo
  text: Ṣùgbọ́n nínú àwọn ẹbọ wọ̀nyí, ìrántí àwọn ẹ̀ṣẹ̀ wà lọ́dọọdún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní gbogbo ọdún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tó ṣáájú pé àwọn ẹbọ náà kò lè sọ àwọn olùjọ́sìn di pípé; “Ṣùgbọ́n” jẹ́ àsopọ̀ àtakò tó ṣe kedere, tó sì bójú mu ní Yorùbá.
- source_word: ἐν αὐταῖς
  choice: nínú àwọn ẹbọ wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn ẹbọ tí àyíká ọ̀rọ̀ ṣáájú mẹ́nu kàn. Ṣíṣe “àwọn ẹbọ” ní kedere mú kí Yorùbá náà yé ni láìfi èrò tuntun kún un.
- source_word: ἀνάμνησις
  choice: ìrántí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan padà wá sí ìrántí. “Ìrántí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá àríyànjiyàn náà mu pé àwọn ẹbọ tí a ń tún ṣe ń mú àwọn ẹ̀ṣẹ̀ wá sí ìrántí.
- source_word: ἁμαρτιῶν
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Ó jẹ́ ohun tí a ń rántí. Ìtumọ̀ yìí pa ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: κατ’ ἐνιαυτόν
  choice: lọ́dọọdún
  rationale: Gbólóhùn náà ń sọ nípa ohun tó ń ṣẹlẹ̀ ní gbogbo ọdún. “Lọ́dọọdún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìtúnṣe ọdọọdún hàn; àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí αὐταῖς ń tọ́ka sí
  choice: A mú un ṣe kedere gẹ́gẹ́ bí “àwọn ẹbọ wọ̀nyí,” ìyẹn àwọn ẹbọ tí a ń rú léraléra tí àyíká ọ̀rọ̀ ṣáájú sọ.
  alternative: Kí a túmọ̀ ọ́ ní ṣókí sí “nínú wọn.”
  rationale: Àwọn ẹsẹ tó ṣáájú ń sọ nípa ẹbọ kan náà tí a ń rú nígbà gbogbo. Ṣíṣe ohun tí ọ̀rọ̀ arọ́pò-orúkọ tọ́ka sí ní kedere ń ran òǹkàwé lọ́wọ́, kò sì yí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
- issue: Agbára ìtumọ̀ κατ’ ἐνιαυτόν
  choice: “Lọ́dọọdún,” láti fi hàn pé ìrántí náà ń ṣẹlẹ̀ ní gbogbo ọdún léraléra.
  alternative: “Ní gbogbo ọdún” tàbí “láti ọdún dé ọdún.”
  rationale: Gbólóhùn náà ń tọ́ka sí ìṣẹ̀lẹ̀ ọdọọdún tí a ń tún ṣe. “Lọ́dọọdún” jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀nà ìtumọ̀ míì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìṣókí àti ìyàtọ̀ àríyànjiyàn inú Gíríìkì mọ́.
