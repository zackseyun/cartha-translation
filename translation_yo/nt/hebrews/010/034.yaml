id: HEB.10.34
reference: Hebrews 10:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: yo
  text: Nítorí ẹ̀yin pẹ̀lú bá àwọn ẹlẹ́wọ̀n[b] jìyà, ẹ sì fi ayọ̀ gba pé a fipá gba àwọn ohun ìní yín, nítorí ẹ mọ̀ pé ẹ̀yin fúnra yín ní ohun ìní tí ó sàn jù, tí ó sì dúró títí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan ní: “ẹ mọ̀ pé ẹ ní ohun ìní tí ó sàn jù ní ọ̀run, tí ó sì dúró títí.”'
    reason: textual_variant
  - marker: b
    text: Tàbí, “ẹ káàánú àwọn ẹlẹ́wọ̀n.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ìyọ́nú hàn, ṣùgbọ́n ó ṣeé ṣe kó ní ìkópa nínú ìjìyà wọn nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμίοις
  choice: àwọn ẹlẹ́wọ̀n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn tí a dè tàbí tí a fi sẹ́wọ̀n. ‘Àwọn ẹlẹ́wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ yìí mu.
- source_word: συνεπαθήσατε
  choice: ẹ bá ... jìyà
  rationale: Ìtumọ̀ yìí mú apá σύν- jáde, ó sì fi hàn pé wọn kópa nínú ìjìyà àwọn ẹlẹ́wọ̀n, kì í ṣe pé wọ́n káàánú wọn nínú ọkàn lásán.
- source_word: ἁρπαγήν
  choice: kó ... ní ìkógun
  rationale: ἁρπαγή ń tọ́ka sí gbígba ohun lọ ní ipá tàbí lọ́nà àìṣòdodo. ‘Kó ... ní ìkógun’ pa agbára ọ̀rọ̀ náà mọ́ ju gbígba ohun lọ lásán.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: àwọn ohun ìní yín
  rationale: Participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ fún ohun-ìní tàbí dúkìá ẹni. Gbólóhùn yìí jẹ́ èdè Yorùbá adayébá, ó sì ṣe kedere.
- source_word: μετὰ χαρᾶς
  choice: pẹ̀lú ayọ̀ / fi ayọ̀
  rationale: ‘Fi ayọ̀’ jẹ́ ọ̀nà Yorùbá adayébá láti pa ìtumọ̀ prepositional phrase Gíríìkì náà mọ́.
- source_word: προσεδέξασθε
  choice: ẹ ... gba
  rationale: Ní àyíká yìí, ‘gba’ túmọ̀ sí pé wọ́n fara mọ́ ìpàdánù náà láìjẹ́ pé wọ́n fọwọ́ sí àìṣòdodo tó ṣẹlẹ̀.
- source_word: γινώσκοντες
  choice: nítorí ẹ mọ̀
  rationale: Participial phrase náà ní agbára ìdí nínú àyíká yìí. ‘Nítorí ẹ mọ̀’ mú ìbáṣepọ̀ ìdí náà ṣe kedere ní Yorùbá láìfi èrò míì kún un.
- source_word: ἑαυτοὺς ἔχειν
  choice: ẹ̀yin fúnra yín ní
  rationale: ‘Ẹ̀yin fúnra yín’ pa ìtẹnumọ́ reflexive pronoun náà mọ́; ‘ní’ sì jẹ́ ọ̀nà Yorùbá tó rọrùn fún jíjẹ́ olówó ohun kan.
- source_word: κρείττονα
  choice: tí ó sàn jù
  rationale: Yìí pa àfiwé ‘tó dára jù’ mọ́, ó sì bá kókó ọ̀rọ̀ κρείττων tó ń tún fara hàn nínú Hébérù mu.
- source_word: ὕπαρξιν
  choice: ohun ìní
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dúkìá tàbí ohun-ìní. Singular ‘ohun ìní’ dá ìyàtọ̀ sí ohun ìní ayé tí a kó lọ, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú τῶν ὑπαρχόντων.
- source_word: μένουσαν
  choice: tí ó sì dúró títí
  rationale: Gbólóhùn yìí fi ìwà pípẹ́ àti àìlópin ohun ìní náà hàn, ó sì sún mọ́ ìtumọ̀ μένω, ‘dúró/wà nìṣó.’
theological_decisions:
- issue: Ìṣọ̀kan pẹ̀lú àwọn onígbàgbọ́ tí a fi sẹ́wọ̀n
  choice: Wọ́n bá àwọn ẹlẹ́wọ̀n jìyà, ìyẹn ni pé wọ́n fi ìṣe dúró tì wọ́n nínú ìjìyà wọn.
  alternative: Wọ́n káàánú àwọn ẹlẹ́wọ̀n.
  rationale: συμπαθέω lè tọ́ka sí ìyọ́nú, ṣùgbọ́n apá σύν- àti àyíká inúnibíni nínú Hébérù 10:32–34 ṣe àtìlẹ́yìn fún ìtumọ̀ ìkópa nínú ìjìyà, láìsọ ọ̀rọ̀ náà di ìmọ̀lára inú lásán.
- issue: Irú ohun tí ‘ohun ìní tí ó sàn jù, tí ó sì dúró títí’ jẹ́
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ohun ìní tó sàn jù, tó sì dúró títí, láìsọ ibi tàbí irú rẹ̀ ní pàtó.
  alternative: Ohun ìní ní ọ̀run; ogún; ìgbàlà tàbí èrè ọjọ́ iwájú.
  rationale: Ọ̀rọ̀ SBLGNT tí a ń túmọ̀ kò sọ ‘ní ọ̀run.’ Nítorí náà, a pa ọ̀rọ̀ náà mọ́ ní fífẹ̀ rẹ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un. Àyípadà inú àwọn ìwé àfọwọ́kọ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Kó ... ní ìkógun’ pa agbára ìwà ipá ἁρπαγή mọ́; ‘ẹ̀yin fúnra yín’ sì pa ìtẹnumọ́ Gíríìkì mọ́. A gbe àmì [b] lẹ́yìn ‘àwọn ẹlẹ́wọ̀n’ nítorí àṣàyàn ọ̀rọ̀, a sì gbe [a] lẹ́yìn ọ̀rọ̀ ohun ìní tó dúró títí nítorí àyípadà inú ìwé àfọwọ́kọ.
