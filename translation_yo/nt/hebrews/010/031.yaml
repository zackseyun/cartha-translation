  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: yo
  text: Ohun ẹ̀rù ni láti ṣubú sí ọwọ́ Ọlọ́run alààyè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun ìpayà ni láti ṣubú sí ọwọ́ Ọlọ́run alààyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: ohun ẹ̀rù
  rationale: Ó ṣàfihàn ohun tí ń mú ẹ̀rù tàbí ìpayà wá. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìkìlọ̀ ọlọ́wọ̀ náà mọ́ láìfi ìtumọ̀ kún un.
- source_word: τὸ ἐμπεσεῖν
  choice: láti ṣubú
  rationale: Àpilẹ̀ infinitive náà ń ṣiṣẹ́ bí orúkọ; ‘láti ṣubú’ ni ìtumọ̀ àdánidá, tí ó sì dá agbára àwòrán ìṣubú mọ́ ju ‘láti bá ... pàdé’ lọ.
- source_word: εἰς χεῖρας
  choice: sí ọwọ́
  rationale: Ó pa àwòrán Bíbélì nípa wíwá sábẹ́ agbára tàbí ìdájọ́ ẹnì kan mọ́, láìsọ ‘ìdájọ́’ ní tààrà níbi tí Gíríìkì kò ti lò ó.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà fún θεός nínú àkópọ̀ ‘ọwọ́ Ọlọ́run.’
- source_word: ζῶντος
  choice: alààyè
  rationale: Ó túmọ̀ àpèjúwe attributive náà ní ti ẹ̀dá, ó sì pa ọ̀rọ̀ Bíbélì tí a mọ̀ sí ‘Ọlọ́run alààyè’ mọ́.
theological_decisions:
- issue: Agbára gbólóhùn ìkìlọ̀ náà
  choice: Ìkéde gbogbogbò tí ó jinlẹ̀ nípa ẹ̀rù wíwá sábẹ́ ọwọ́ Ọlọ́run alààyè
  alternative: Kí ó tọ́ka sí ìbáwí ayé yìí nìkan, tàbí kí ó jẹ́ ọ̀rọ̀ nípa ìrírí ènìyàn láìní ìtumọ̀ ìdájọ́
  rationale: Àyíká ọ̀rọ̀ náà parí apá ìkìlọ̀ kan, ‘ṣubú sí ọwọ́’ sì sábà ń ní agbára ìdájọ́. A pa ìtumọ̀ tó lágbára yìí mọ́, ṣùgbọ́n a kò fi ọ̀rọ̀ ‘ìdájọ́’ kún ẹsẹ̀ náà nítorí pé àwòrán ọ̀rọ̀ ni Gíríìkì fi sọ ọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé lásán. A lo ‘ohun ẹ̀rù’ gẹ́gẹ́ bí gbólóhùn àdánidá, a sì fi ‘ohun ìpayà’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tí ó lágbára sí i.
