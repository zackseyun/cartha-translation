id: HEB.10.25
reference: Hebrews 10:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: yo
  text: Ẹ má ṣe kọ ìpéjọpọ̀ wa sílẹ̀[a], gẹ́gẹ́ bí ó ti di àṣà fún àwọn kan, ṣùgbọ́n ẹ máa fún ara yín níṣìírí—àní púpọ̀ sí i bí ẹ ti ń rí i pé Ọjọ́ náà ń sún mọ́lé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ìpéjọpọ̀ wa sílẹ̀” tàbí “pa ìpéjọpọ̀ wa tì.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “Ọjọ́ náà” tọ́ka sí ọjọ́ dídé Olúwa tàbí ọjọ́ ìdájọ́ ìkẹyìn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: kọ ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ṣíṣàìtọ́jú ohun kan tàbí fífi í sílẹ̀. “Kọ ... sílẹ̀” jẹ́ Yorùbá àdánidá tí ó mú ìkìlọ̀ náà jáde láìfi dandan sọ pé ìkọ̀sílẹ̀ pátápátá ni.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: ìpéjọpọ̀ ara wa
  rationale: Ó tọ́ka sí bí àwọn onígbàgbọ́ ṣe ń péjọ pọ̀, kì í ṣe dandan sí ètò ìjọ tàbí irú ìsìn kan pàtó. “Ara wa” pa agbára ọ̀rọ̀ arọ́pò-orúkọ ìpadà-sí-ara-mẹ́ni mọ́.
- source_word: καθὼς ἔθος τισίν
  choice: gẹ́gẹ́ bí ó ti di àṣà fún àwọn kan
  rationale: Ìtumọ̀ yìí pa ìmọ̀ “àṣà tàbí ìwà tí a ti mọ́ lára” mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: παρακαλοῦντες
  choice: fún ara yín níṣìírí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ní agbára fífúnni níṣìírí àti fífúnni lókun. Àfikún “ara yín” mú ìṣe alábàápín láàárín àwùjọ náà hàn, bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: àní púpọ̀ sí i bí
  rationale: 'Ó pa ìbáṣepọ̀ ìpele méjì náà mọ́: bí Ọjọ́ náà ṣe ń sún mọ́lé, bẹ́ẹ̀ ni ìfúnni níṣìírí gbọ́dọ̀ máa pọ̀ sí i.'
- source_word: βλέπετε
  choice: ẹ ti ń rí i
  rationale: Ìtumọ̀ tààrà yìí pa ìṣe tí ń lọ lọ́wọ́ mọ́, kò sì pinnu ohun tàbí àmì pàtó tí wọ́n fi mọ̀ pé Ọjọ́ náà ń bọ̀.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: Ọjọ́ náà ń sún mọ́lé
  rationale: “Ń sún mọ́lé” mú ìṣípò àkókò tó wà nínú ọ̀rọ̀ Gíríìkì jáde. Lílo “Ọjọ́” pẹ̀lú lẹ́tà ńlá tọ́ka sí ọjọ́ ìkẹyìn tí a mọ̀ ní àyíká ọ̀rọ̀, láìfikún “ti Olúwa” tàbí “ìdájọ́” tí kò sí ní gbólóhùn náà.
theological_decisions:
- issue: Ìtọ́kasí ọjọ́ ìkẹyìn nínú τὴν ἡμέραν
  choice: “Ọjọ́ náà,” pẹ̀lú lẹ́tà ńlá
  alternative: “ọjọ́ náà,” “Ọjọ́ Olúwa,” tàbí “ọjọ́ ìdájọ́”
  rationale: Àyíká ọ̀rọ̀ ìfaradà àti ìparí tó ń sún mọ́lé fi hàn pé ọjọ́ ẹ̀sìn ìkẹyìn ni. Lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láti rí èyí, ṣùgbọ́n kò túmọ̀ ọ̀rọ̀ náà kọjá ohun tí Gíríìkì sọ.
- issue: Ẹni tí παρακαλοῦντες ń tọ́ka sí
  choice: 'Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìṣe ara-ẹni-sí-ara-ẹni: “ẹ máa fún ara yín níṣìírí”'
  alternative: Fi ẹni tí a ń fún níṣìírí sílẹ̀ láìsọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ “ara yín” ní gbangba níbí, àyíká ìpéjọpọ̀ àwùjọ mú ìṣe alábàápín náà ṣe kedere. Èyí jẹ́ ìṣàlàyé èrò inú ọ̀rọ̀, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti òde-òní. A lo àṣẹ ọ̀pọ̀ ènìyàn “Ẹ ...” àti ìṣe tó ń bá a lọ “ẹ máa ...” láti mú ìtọ́nisọ́nà náà jáde. A yẹra fún “ìsìn ìjọ” nítorí pé ó lè fi ètò ilé-ẹ̀sìn kan tí kò ṣe kedere nínú orísun kún un.
