id: HEB.10.8
reference: Hebrews 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ lókè pé, “Àwọn ẹbọ àti ọrẹ, àti ẹbọ sísun pátápátá[a] àti ẹbọ fún ẹ̀ṣẹ̀[b] ni ìwọ kò fẹ́, bẹ́ẹ̀ ni wọn kò tẹ́ ọ lọ́rùn”—àwọn ẹbọ tí a ń rú ní ìbámu pẹ̀lú Òfin[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹbọ sísun.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹbọ tí iná jó run pátápátá lórí pẹpẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹbọ ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, ní ìbámu pẹ̀lú Òfin Mósè.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Lẹ́yìn tí ó ti sọ lókè pé
  rationale: Ó tọ́ka padà sí ọ̀rọ̀ inú Sáàmù tí a ṣẹ̀ṣẹ̀ fa yọ lókè, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti so ọ̀rọ̀ yìí mọ́ ohun tí ó tẹ̀ lé e.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Àwọn ẹbọ àti ọrẹ
  rationale: “Ẹbọ” àti “ọrẹ” pa ìyàtọ̀ àwọn ọ̀rọ̀ ìsìn méjèèjì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún wọn.
- source_word: ὁλοκαυτώματα
  choice: ẹbọ sísun pátápátá
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ẹbọ tí iná jó run lórí pẹpẹ; “pátápátá” mú ìtumọ̀ yìí hàn kedere.
- source_word: περὶ ἁμαρτίας
  choice: ẹbọ fún ẹ̀ṣẹ̀
  rationale: Ní àyíká ọ̀rọ̀ ẹbọ, gbólóhùn náà ń tọ́ka sí ẹbọ tí a rú nítorí ẹ̀ṣẹ̀, ṣùgbọ́n yíyan “fún ẹ̀ṣẹ̀” tún pa ìrísí gbólóhùn orísun mọ́.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: ni ìwọ kò fẹ́, bẹ́ẹ̀ ni ìwọ kò ní inú dídùn sí wọn
  rationale: “Kò fẹ́” àti “kò ní inú dídùn sí” pa ìyàtọ̀ láàárín àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́. “Sí wọn” mú ẹni tí gbólóhùn náà ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: κατὰ νόμον προσφέρονται
  choice: tí a ń rú ní ìbámu pẹ̀lú Òfin
  rationale: Ó fi hàn pé àwọn ẹbọ náà ni a ń rú gẹ́gẹ́ bí ìlànà Òfin, ó sì pa ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí mọ́.
theological_decisions:
- issue: Bí a ṣe máa pa àwọn onírúurú ẹbọ inú Sáàmù mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn kún wọn
  choice: Àwọn ẹbọ àti ọrẹ, àti ẹbọ sísun pátápátá àti ẹbọ fún ẹ̀ṣẹ̀
  alternative: Àwọn ẹbọ àti ọrẹ, ẹbọ sísun àti ẹbọ ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ yìí pa àtòjọ àwọn ẹbọ mọ́, ó sì ṣàlàyé irú ẹbọ tí a ń sun pátápátá láìkọjá ohun tí ọ̀rọ̀ Gíríìkì sọ.
- issue: Bí a ṣe máa sọ pé Ọlọ́run kò fẹ́ àwọn ẹbọ náà bí ó tilẹ̀ jẹ́ pé a ń rú wọn ní ìbámu pẹ̀lú Òfin
  choice: ìwọ kò fẹ́, bẹ́ẹ̀ ni ìwọ kò ní inú dídùn sí wọn
  alternative: ìwọ kò fẹ́ wọn, bẹ́ẹ̀ ni wọn kò tẹ́ ọ lọ́rùn
  rationale: Yíyan yìí pa agbára ọ̀rọ̀ Sáàmù àti ìforígbárí inú àyíká ọ̀rọ̀ mọ́, láìsọ pé Òfin fúnra rẹ̀ jẹ́ ohun tí kò bófin mu.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A fi àwọn ọ̀rọ̀ ìsìn “ẹbọ,” “ọrẹ,” àti “Òfin” sílẹ̀ ní ọ̀nà tí òǹkàwé òde òní lè lóye. Àmì ìdádúró ní òpin pa àbùdá gbólóhùn tí yóò tẹ̀ síwájú nínú ẹsẹ tó kàn mọ́.
