  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: yo
  text: Nígbà kan, a sọ yín di ohun ìwòran ní gbangba nípasẹ̀ ẹ̀gàn àti ìpọ́njú[a]; nígbà mìíràn sì, ẹ di alábàápín pẹ̀lú àwọn tí a ń hùwà sí lọ́nà bẹ́ẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó ṣe kedere sí i, “a fi yín ṣe ohun ìwòran ní gbangba nípasẹ̀ ẹ̀gàn àti ìpọ́njú.”
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé ṣe kí èyí túmọ̀ sí, “ẹ di alábàápín pẹ̀lú àwọn tí wọ́n ń gbé ayé tàbí hùwà lọ́nà bẹ́ẹ̀”; ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ yìí ní àwọn ọ̀rọ̀ àyíká kan. Bí ó tilẹ̀ jẹ́ bẹ́ẹ̀, ọ̀rọ̀ àyíká inúnibíni níbí ṣe àtìlẹ́yìn fún “àwọn tí a ń hùwà sí lọ́nà bẹ́ẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: nígbà kan ... nígbà mìíràn sì
  rationale: Èyí fi apá méjì ìrírí wọn hàn ní Yorùbá àdánidá, ó sì bá ‘sometimes ... at other times’ mu láì sọ pé àwọn ìṣẹ̀lẹ̀ náà kò lè ṣẹlẹ̀ pọ̀.
- source_word: ὀνειδισμοῖς
  choice: ẹ̀gàn
  rationale: ‘Ẹ̀gàn’ ṣàfihàn ìtìjú àti ọ̀rọ̀ àbùkù tí a fi ń kọlu ẹni ní gbangba.
- source_word: θλίψεσιν
  choice: ìpọ́njú
  rationale: Ọ̀rọ̀ yìí gba ìtumọ̀ ìnira, ìkálọ́wọ́kò, àti ìyà tí inúnibíni fa, láì dín un kù sí irú ìjìyà kan ṣoṣo.
- source_word: θεατριζόμενοι
  choice: a fi yín hàn ní gbangba
  rationale: Ó mú àwòrán gbígbé ènìyàn kalẹ̀ níwájú gbogbo ènìyàn gẹ́gẹ́ bí ohun ìwòran àti ẹ̀gàn jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: κοινωνοὶ
  choice: alábàápín
  rationale: ‘Alábàápín’ túmọ̀ sí ẹni tí ó ń pín nínú ìrírí àwọn ẹlòmíràn, kì í ṣe ọ̀rẹ́ tàbí alábàákẹ́gbẹ́ lásán.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: pẹ̀lú àwọn tí a ń ṣe sí lọ́nà bẹ́ẹ̀
  rationale: Nínú ọ̀rọ̀ àyíká inúnibíni yìí, ìtumọ̀ pé a ń hùwà sí wọn lọ́nà bẹ́ẹ̀ bá ìjíròrò ẹ̀gàn àti ìpọ́njú mu jù; àmọ́ ìtumọ̀ tó ní í ṣe pẹ̀lú ìwà-ayé ṣì ṣeé ṣe, a sì tọ́ka sí i ní àlàyé ìsàlẹ̀.
- source_word: γενηθέντες
  choice: ẹ di
  rationale: Ó sọ bí wọn ṣe wọ ipò jíjẹ́ alábàápín nínú ìrírí àwọn tí a ń ṣe inúnibíni sí ní Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ ἀναστρεφομένων nínú ọ̀rọ̀ àyíká
  choice: Ó ń tọ́ka sí àwọn tí a ń hùwà sí lọ́nà inúnibíni kan náà.
  alternative: Ó lè tọ́ka sí àwọn tí ìwà tàbí ìgbé-ayé wọn rí bẹ́ẹ̀.
  rationale: Ọ̀rọ̀ àyíká lẹ́sẹ̀kẹsẹ̀ dá lórí ẹ̀gàn, ìpọ́njú, àti dídúró ti àwọn tí a ṣe inúnibíni sí. Síbẹ̀, nítorí ἀναστρέφω lè tọ́ka sí ìwà ẹni tàbí ọ̀nà ìgbé-ayé rẹ̀, a kò fi ìtumọ̀ kejì náà pamọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A lo ‘yín’ nítorí ẹni púpọ̀ ni a ń bá sọ. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ, a sì pa àìdájú gidi nínú ἀναστρεφομένων mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
