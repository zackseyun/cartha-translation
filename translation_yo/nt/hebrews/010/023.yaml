id: HEB.10.23
reference: Hebrews 10:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: yo
  text: Ẹ jẹ́ kí a di ìjẹ́wọ́ ìrètí wa mú ṣinṣin láìṣiyípadà[a], nítorí ẹni tí ó ṣe ìlérí jẹ́ olóòótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjẹ́wọ́ ìrètí.” Ọ̀rọ̀ Gíríìkì kò fi “wa” sí i ní kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: Ẹ jẹ́ kí a di ... mú ṣinṣin
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ subjunctive ẹni àkọ́kọ́ ọ̀pọ̀ tí ń gba àwùjọ níyànjú; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì fi ìtumọ̀ dídì mú láìfi sílẹ̀ hàn.
- source_word: ὁμολογίαν
  choice: ìjẹ́wọ́
  rationale: “Ìjẹ́wọ́” lè túmọ̀ sí ìkéde tàbí ìfihàn ohun tí ènìyàn gbàgbọ́ ní gbangba, bí ọ̀rọ̀ náà ṣe rí nínú àyíká Hébérù.
- source_word: τῆς ἐλπίδος
  choice: ìrètí wa
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní ní kedere, “wa” jẹ́ ti ẹ̀dá nínú ìṣírí tí a ń sọ fún gbogbo àwùjọ; àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn gangan mọ́.
- source_word: ἀκλινῆ
  choice: láìṣiyèméjì
  rationale: Ó sọ bí wọ́n ṣe gbọdọ̀ di ìjẹ́wọ́ náà mú—láìyípadà tàbí ṣiyèméjì. Àṣàyàn yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere, láìlo àwòrán “títẹ̀” Gíríìkì ní líle.
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: “Olóòótọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tí a lè gbẹ́kẹ̀ lé, ó sì pa ìró ẹ̀kọ́ nípa ìṣòtítọ́ Ọlọ́run mọ́.
- source_word: ὁ ἐπαγγειλάμενος
  choice: ẹni tí ó ṣe ìlérí
  rationale: Ó ń fi participle tó ní article hàn gẹ́gẹ́ bí ẹni kan, ó sì jẹ́ kí ẹni náà wà ní àìmẹ́nu-kàn gẹ́gẹ́ bí Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí Ọlọ́run.
theological_decisions:
- issue: Ta ni “ẹni tí ó ṣe ìlérí” ń tọ́ka sí?
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó ṣe ìlérí,” bí orísun Gíríìkì ṣe ṣe.
  alternative: “Ọlọ́run tí ó ṣe ìlérí”
  rationale: Àyíká fi hàn pé Ọlọ́run ni, ṣùgbọ́n Gíríìkì kò pe orúkọ rẹ̀ ní tààrà; fífi i sílẹ̀ bẹ́ẹ̀ ń yẹra fún àfikún ìtumọ̀.
- issue: Fífi “wa” kún “ìrètí”
  choice: “ìrètí wa” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé.
  alternative: “ìrètí” láìsí arọ́pò-orúkọ ohun-ìní
  rationale: “Wa” mú gbólóhùn náà jẹ́ ti ẹ̀dá fún àwùjọ tí a ń gba níyànjú, ṣùgbọ́n àlàyé náà jẹ́wọ́ pé kò sí ní kedere nínú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, ti ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “Ẹ jẹ́ kí a” fún ìṣírí àwùjọ, “di ... mú ṣinṣin” fún ìfaradà, a sì yẹra fún fífi “Ọlọ́run” kún ọ̀rọ̀ pàtàkì níbi tí orísun kò ti mẹ́nu kàn án ní tààrà.
