  rationale: 'A ṣẹ̀dá àtúnṣe kan ṣoṣo: “láìṣiyípadà” rọ́pò “láìṣiyèméjì” kí ìtumọ̀ ἀκλινῆ—ìdúró ṣinṣin láìyẹ̀ tàbí láìwọ̀ sẹ́yìn—lè hàn dáadáa. A pa ìyókù ọ̀rọ̀ àti àlàyé ìsàlẹ̀ ojú ìwé mọ́, nítorí wọ́n bá orísun Gíríìkì àti ìlànà ìtumọ̀ mu.'
