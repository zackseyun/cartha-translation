id: HEB.10.16
reference: Hebrews 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: yo
  text: “Èyí ni májẹ̀mú tí èmi yóò dá pẹ̀lú wọn lẹ́yìn àwọn ọjọ́ wọ̀nyẹn,” ni Olúwa wí, “ní fífi àwọn òfin mi sí ọkàn wọn, èmi yóò sì kọ wọ́n sínú èrò inú wọn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: májẹ̀mú
  rationale: “Májẹ̀mú” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ìbáṣepọ̀ àdéhùn tí Ọlọ́run dá; ó sì pa ìsopọ̀ pẹ̀lú Jeremáyà mọ́.
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: tí èmi yóò bá wọn dá
  rationale: Ọ̀nà àdánidá ni Yorùbá fi ń sọ pé ẹnì kan “bá” ẹlòmíràn “dá májẹ̀mú”; ó mú ìtumọ̀ ìbáṣepọ̀ πρὸς αὐτούς hàn kedere.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: lẹ́yìn àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó tẹ̀ lé gbólóhùn àkókò Gíríìkì láì fi àlàyé tí kò sí nínú rẹ̀ kún un.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος nínú ọ̀rọ̀ yìí.
- source_word: διδοὺς
  choice: ní fífi
  rationale: Ìkọ̀rọ̀-orúkọ yìí pa ìrísí participle Gíríìkì mọ́, ó sì fi hàn pé fífi àwọn òfin sí ọkàn ni ọ̀nà tí májẹ̀mú náà yóò gbà ṣẹ.
- source_word: νόμους μου
  choice: àwọn òfin mi
  rationale: A pa ọ̀pọ̀ nọ́mbà νόμους mọ́; “òfin” tún pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sí ọkàn wọn
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún fífi ohun kan sí ọkàn àwọn ènìyàn, ó sì pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διάνοιαν
  choice: èrò inú
  rationale: “Èrò inú” tọ́ka sí agbára ìrònú àti òye, ó sì yàtọ̀ díẹ̀ sí “ọkàn” tó dúró fún καρδία.
- source_word: ἐπιγράψω αὐτούς
  choice: èmi yóò sì kọ wọ́n
  rationale: “Kọ” mú ìtumọ̀ kíkọ tàbí fífín ọ̀rọ̀ sí ibì kan hàn; “wọ́n” tọ́ka padà sí “àwọn òfin mi” gẹ́gẹ́ bí Gíríìkì ṣe rí.
theological_decisions:
- issue: Ìṣètò gírámà inú àyọlò Jeremáyà
  choice: Pa participle náà mọ́ gẹ́gẹ́ bí “ní fífi àwọn òfin mi sí ọkàn wọn,” kí gbólóhùn tó ní ọ̀rọ̀-ìṣe ọjọ́ iwájú “èmi yóò sì kọ...” tẹ̀ lé e.
  alternative: 'Mú àwọn méjèèjì jẹ́ ọ̀rọ̀-ìṣe ọjọ́ iwájú: “Èmi yóò fi ... èmi yóò sì kọ ...”'
  rationale: Ọ̀nà tí a yàn tẹ̀ lé ìrísí ọ̀rọ̀ inú Hébérù yìí, kò sì mú un bá ìtumọ̀ Jeremáyà nínú àwọn ẹ̀dà mìíràn mu láìnídí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “májẹ̀mú,” “ọkàn,” àti “èrò inú” láti pa èdè ìgbàgbọ́ àti ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́ láì jẹ́ kí gbólóhùn náà le.
