revisions:
- from: “Èyí ni májẹ̀mú tí èmi yóò bá wọn dá lẹ́yìn àwọn ọjọ́ wọ̀nyẹn[a],” ni Olúwa wí, “ní fífi àwọn òfin mi sí ọkàn wọn, èmi yóò sì kọ wọ́n sí èrò inú wọn.”
  to: “Èyí ni májẹ̀mú tí èmi yóò dá pẹ̀lú wọn lẹ́yìn àwọn ọjọ́ wọ̀nyẹn,” ni Olúwa wí, “ní fífi àwọn òfin mi sí ọkàn wọn, èmi yóò sì kọ wọ́n sínú èrò inú wọn.”
  rationale: A tún ìṣètò ọ̀rọ̀ náà ṣe kí ‘májẹ̀mú’ jẹ́ ohun tí a ń dá ní kedere, a sì mú gbolohun ìkọ̀wé sí èrò inú jẹ́ Yorùbá tó rọrùn. A fi ìrísí participle ti διδοὺς sílẹ̀ gẹ́gẹ́ bí “ní fífi,” nítorí náà a kò ṣe ìṣọ̀kan ayọlò náà sí ọ̀rọ̀-ìṣe ọjọ́ iwájú méjì. A yọ àlàyé abẹ́lẹ̀ kúrò nítorí kò nílò fún ìtumọ̀ gbolohun kúkúrú yìí, ó sì ń daba ìtúnṣe ìrísí tí kò ṣe pàtàkì fún òǹkàwé.
