id: HEB.10.2
reference: Hebrews 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: yo
  text: Bí kò bá rí bẹ́ẹ̀[a], ṣé a kì bá tí dẹ́kun fífi àwọn ẹbọ wọ̀nyẹn rú, nítorí pé àwọn olùjọ́sìn, lẹ́yìn tí a ti wẹ̀ wọ́n mọ́ lẹ́ẹ̀kan ṣoṣo[b], kì bá ní ìmọ̀lára ẹ̀ṣẹ̀ kankan mọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà.” Ọ̀rọ̀ Gíríìkì náà ń mú àbájáde ohun tí kò ṣẹlẹ̀ wá nínú ìjiyàn yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “lẹ́ẹ̀kan ṣoṣo tán.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwẹ̀mímọ́ tó péye ní ẹ̀ẹ̀kan, tí kò sì nílò àtúnṣe, nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Bí kò bá rí bẹ́ẹ̀
  rationale: Nínú ìjiyàn yìí, ọ̀rọ̀ náà tọ́ka sí àbájáde ohun tí kò ṣẹlẹ̀; gbólóhùn Yorùbá yìí mú ìtumọ̀ ‘bí bẹ́ẹ̀ kọ́/otherwise’ jáde lọ́nà àdánidá.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: ṣé wọn kì bá tí dẹ́kun fífi àwọn ẹbọ náà rú
  rationale: Àkójọpọ̀ οὐκ ἄν pẹ̀lú aorist jẹ́ ìbéèrè àsọyé nípa ohun tí ì bá ti ṣẹlẹ̀. ‘Dẹ́kun fífi ... rú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún dídáwọ́ fífi ẹbọ rú.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: nítorí pé ... kì bá ní ... kankan mọ́
  rationale: διά pẹ̀lú infinitive oní-artíkù sọ ìdí; ‘nítorí pé’ sì fi ìbáṣe ìdí náà hàn ní Yorùbá àdánidá. ‘Mọ́’ ṣe àfihàn ἔτι nínú gbólóhùn òdì.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: ìmọ̀lára ẹ̀ṣẹ̀
  rationale: συνείδησις lè túmọ̀ sí ẹ̀rí-ọkàn, ìmọ̀, tàbí ìmọ̀lára. Níhìn-ín, ‘ìmọ̀lára ẹ̀ṣẹ̀’ tọ́ka sí jíjẹ́ ẹni tí ẹ̀ṣẹ̀ ṣì ń ká lára níwájú Ọlọ́run, láìdámọ̀ràn pé olùjọ́sìn kò tún mọ ohun tí ó jẹ́ ẹ̀ṣẹ̀.
- source_word: τοὺς λατρεύοντας
  choice: àwọn olùjọ́sìn
  rationale: Participulu náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ fún àwọn tí ń ṣe iṣẹ́ ìjọ́sìn; ‘àwọn olùjọ́sìn’ jẹ́ kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘lẹ́ẹ̀kan,’ ó sì lè ní agbára ‘lẹ́ẹ̀kan náà tán’ nínú àyíká yìí. ‘Lẹ́ẹ̀kan ṣoṣo’ pa ìtumọ̀ ìpilẹ̀ mọ́ láìfi ìtumọ̀ tó lágbára jù sí i.
- source_word: κεκαθαρισμένους
  choice: lẹ́yìn tí a ti wẹ̀ wọ́n mọ́
  rationale: Perfect passive participle tọ́ka sí ìwẹ̀mímọ́ tí a ti parí tí àbájáde rẹ̀ sì dúró. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ohùn àìṣe-ara-ẹni mọ́.
theological_decisions:
- issue: Ìtumọ̀ συνείδησιν ἁμαρτιῶν lẹ́yìn ìwẹ̀mímọ́ àwọn olùjọ́sìn
  choice: ìmọ̀lára ẹ̀ṣẹ̀
  alternative: ẹ̀rí-ọkàn nípa ẹ̀ṣẹ̀; ìmọ̀ nípa ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìmọ̀lára ìdálẹ́bi ẹ̀ṣẹ̀ tó ń bá a lọ, kì í ṣe pé ẹni tí a wẹ̀ mọ́ kò ní ẹ̀rí-ọkàn tàbí kò lè mọ ohun tó jẹ́ ẹ̀ṣẹ̀ mọ́.
- issue: Agbára ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  alternative: lẹ́ẹ̀kan náà tán
  rationale: A pa agbára pé ìwẹ̀mímọ́ náà ṣẹlẹ̀ lẹ́ẹ̀kan mọ́, ṣùgbọ́n a kò fi dandan yan ìtumọ̀ ‘once for all’ sínú ọ̀rọ̀ náà; àfikún-ẹsẹ̀ sọ àṣàyàn yẹn.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Rú ẹbọ’ ni a lò fún èdè ìrúbọ, ‘olùjọ́sìn’ sì pa ìtumọ̀ iṣẹ́ ìjọ́sìn mọ́.
