    rationale: Nítorí προσφερόμεναι jẹ́ passive, àwọn ẹbọ ni a ń rú. Ìtúmọ̀ tó wà lè túmọ̀ sí pé àwọn ẹbọ ni wọ́n fúnra wọn dáwọ́ rírú ẹbọ. Ọ̀nà aláìlórúkọ ‘a kì bá tí dẹ́kun fífi àwọn ẹbọ wọ̀nyẹn rú’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́.
