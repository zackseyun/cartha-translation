  source_fidelity: Ìtumọ̀ náà gba ìlànà ìbéèrè àsọyé ohun-tí-kò-ṣẹlẹ̀, ìwẹ̀mímọ́ tí ó ti ṣẹlẹ̀, àti ìmọ̀lára ẹ̀ṣẹ̀ tí kò yẹ kí ó máa bá a lọ. Ṣùgbọ́n, nínú gbólóhùn àkọ́kọ́, ‘wọn’ lè dà bí àwọn ẹbọ fúnra wọn ni wọ́n ń dawọ́ fífi ẹbọ rú, dípò kí a sọ pé a dáwọ́ fífi àwọn ẹbọ náà rú.
  naturalness: Yorùbá ìtumọ̀ náà dára ní gbogbogbòò, pẹ̀lú ìforúkọsílẹ̀ tó yẹ fún ìwé mímọ́. Ṣíṣe ‘a’ ní olùṣe aláìlórúkọ nínú ‘a kì bá tí dẹ́kun fífi àwọn ẹbọ wọ̀nyẹn rú’ mú ìbáṣepọ̀ ohùn passive ti Gíríìkì hàn ní ìrọ̀rùn, ó sì yẹra fún àìdánilójú nípa olùṣe.
  terminology: ‘Olùjọ́sìn,’ ‘wẹ̀ wọ́n mọ́,’ àti ‘ìmọ̀lára ẹ̀ṣẹ̀’ yẹ fún τοὺς λατρεύοντας, κεκαθαρισμένους, àti συνείδησιν ἁμαρτιῶν. Ọ̀rọ̀ ìsàlẹ̀ a ní láti fi àṣàyàn gidi fún ἐπεὶ hàn; ‘Nítorí bí bẹ́ẹ̀ bá rí’ kì í ṣe àṣàyàn tó tọ́ gẹ́gẹ́ bí ìtumọ̀ ẹyọ ọ̀rọ̀ náà nínú ìjiyàn yìí.
