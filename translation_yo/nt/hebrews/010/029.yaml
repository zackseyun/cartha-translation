id: HEB.10.29
reference: Hebrews 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: yo
  text: Ẹ̀yin rò pé, ìyà tí ó burú jù bẹ́ẹ̀ lọ tó báwo ni yóò yẹ fún ẹni tí ó tẹ Ọmọ Ọlọ́run mọ́lẹ̀, tí ó ka ẹ̀jẹ̀ májẹ̀mú tí a fi sọ ọ́ di mímọ́ sí ohun lásán[a][b], tí ó sì gàn Ẹ̀mí oore-ọ̀fẹ́[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ohun aláìmọ́” tàbí “sí ohun tí kò jẹ́ mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Gíríìkì, gbólóhùn “tí a fi sọ ọ́ di mímọ́” ní ìsopọ̀ gírámà pẹ̀lú ẹni tó ṣe ẹ̀ṣẹ̀ náà; àwọn atúmọ̀ kan lóye ẹni tí ó ń tọ́ka sí lọ́nà mìíràn. Ìtumọ̀ yìí pa àìdánilójú àti àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “tí ó sì fi ẹ̀gàn líle bá Ẹ̀mí oore-ọ̀fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: ìyà tí ó burú jù bẹ́ẹ̀ lọ tó báwo
  rationale: Ó mú ìbéèrè àsọyé Gíríìkì jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfiwéra ‘ìyà tí ó burú jù’ mọ́.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: yóò yẹ fún ìyà
  rationale: Ó pa ìtumọ̀ ìdájọ́ ti ọ̀rọ̀ àìṣe Gíríìkì mọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: καταπατήσας
  choice: tẹ … mọ́lẹ̀
  rationale: Ó pa àwòrán lílágbára ti fífi ẹsẹ̀ tẹ ohun kan mọ́lẹ̀ nítorí ẹ̀gàn mọ́, dípò yíyí i sí àlàyé lásán.
- source_word: υἱὸν τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà àti ọ̀rọ̀ oyè Kristi tí ó wọ́pọ̀ ní Yorùbá.
- source_word: κοινὸν
  choice: ohun lásán
  rationale: Ó fi ìyàtọ̀ sí ohun mímọ́ hàn gẹ́gẹ́ bí ohun tí a kà sí ti gbogbogbò tàbí aláìjẹ́-mímọ́, láìfi dandan mú ìtumọ̀ náà dúró sí ‘ẹlẹ́gbin’ nìkan.
- source_word: αἷμα τῆς διαθήκης
  choice: ẹ̀jẹ̀ májẹ̀mú
  rationale: Ó pa gbólóhùn májẹ̀mú àti ìró ẹbọ inú ọ̀rọ̀ Gíríìkì mọ́ ní ṣókí.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: tí a fi sọ ọ́ di mímọ́
  rationale: ‘Fi’ ṣàfihàn iṣẹ́ irinṣẹ́ ẹ̀jẹ̀ náà, ‘sọ … di mímọ́’ sì jẹ́ Yorùbá tí ó ṣe kedere fún ìṣe àìṣe náà; ‘ọ́’ pa ẹni ẹlẹ́ṣẹ̀ tí gírámà tọ́ka sí mọ́ láìtú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἐνυβρίσας
  choice: gàn
  rationale: Ó sọ ìwà ẹ̀gàn àti àìbọ̀wọ̀ lílágbára náà ní Yorùbá tó ṣe kedere, tí ó sì bá ipò ọ̀rọ̀ mu.
- source_word: πνεῦμα τῆς χάριτος
  choice: Ẹ̀mí oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ àti ọ̀rọ̀ ìsopọ̀ Gíríìkì mọ́, ó sì lo ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún χάρις.
theological_decisions:
- issue: Ẹni tí ἐν ᾧ ἡγιάσθη (‘tí a fi sọ ọ́ di mímọ́’) ń tọ́ka sí
  choice: A fi ‘ọ́’ tọ́ka sí ẹni tí àwọn ọ̀rọ̀ ìṣe àpèjúwe náà ń ṣàpèjúwe, gẹ́gẹ́ bí ìsopọ̀ gírámà Gíríìkì ṣe rí.
  alternative: Àwọn kan máa ń ka ẹni tí a sọ di mímọ́ sí Kristi, ẹ̀jẹ̀ náà, tàbí àwùjọ májẹ̀mú.
  rationale: Ẹni kan náà tí ó jẹ́ olùṣe àwọn ọ̀rọ̀ ìṣe àpèjúwe ni ẹni tó sún mọ́ ọn jù gẹ́gẹ́ bí atọ́ka gírámà. Ìtumọ̀ náà tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé jẹ́wọ́ àríyànjiyàn náà láìyanju ẹ̀kọ́ nípa ìpadàṣẹ́yìn tàbí ìfaradà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti bá àdánidá mu. Ìbéèrè àsọyé náà dúró ṣinṣin, àwọn àwòrán ‘tẹ … mọ́lẹ̀’ àti ìyàtọ̀ láàárín ohun mímọ́ àti ‘ohun lásán’ sì wà láìrọ̀ wọ́n di ọ̀rọ̀ ẹ̀kọ́ ẹgbẹ́ ìjọ kan.
