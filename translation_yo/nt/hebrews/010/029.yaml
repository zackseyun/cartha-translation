  to: Ẹ̀yin rò pé, ìyà tí ó burú jù bẹ́ẹ̀ lọ tó báwo ni yóò yẹ fún ẹni tí ó tẹ Ọmọ Ọlọ́run mọ́lẹ̀, tí ó ka ẹ̀jẹ̀ májẹ̀mú tí a fi sọ ọ́ di mímọ́ sí ohun lásán[a][b], tí ó sì gàn Ẹ̀mí oore-ọ̀fẹ́[c]?
