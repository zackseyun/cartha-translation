  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: yo
  text: Kí a sì máa kíyè sí ara wa, láti máa ta ara wa jí sí ìfẹ́ àti àwọn iṣẹ́ rere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti máa ru ara wa sókè” tàbí “láti máa mú ara wa ní ìtara fún ìfẹ́ àti àwọn iṣẹ́ rere.” Ọ̀rọ̀-orúkọ Gíríìkì παροξυσμός lè tọ́ka sí ìmúnilọ́kàn tàbí ìfàsíwájú alágbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: kí a sì máa kíyè sí
  rationale: Ọ̀rọ̀ yìí jẹ́ ìṣírí fún gbogbo àwùjọ, ó sì túmọ̀ sí fífi àkíyèsí pẹ̀lú ìronú jinlẹ̀ sí àwọn ẹlòmíràn. ‘Kí a sì máa kíyè sí’ jẹ́ èdè Yorùbá àdánidá tó pa ìtumọ̀ ìṣírí àti àkíyèsí mọ́.
- source_word: ἀλλήλους
  choice: ara wa
  rationale: ‘Ara wa’ ni ọ̀nà Yorùbá tó wọ́pọ̀ láti fi ìṣe àfẹ̀hìntì hàn, níbi tí àwọn ọmọ àwùjọ ti ń kíyè sí ẹnì kejì wọn.
- source_word: εἰς
  choice: láti
  rationale: Níhìn-ín, εἰς ń tọ́ka sí ète tàbí àbájáde. ‘Láti’ mú ìbáṣepọ̀ yìí jáde ní Yorùbá lọ́nà àdánidá.
- source_word: παροξυσμὸν
  choice: ru ara wa sókè
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìmúnilọ́kàn líle tàbí ìmúnisẹ́. ‘Ru ara wa sókè’ pa agbára ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ìjà tàbí ìbínú kún un; fífi ‘ara wa’ sínú gbólóhùn náà jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí àyíká àwùjọ náà fi hàn.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá lílo ἀγάπη mu ní àyíká yìí.
- source_word: καλῶν ἔργων
  choice: àwọn iṣẹ́ rere
  rationale: Ìtumọ̀ yìí pa àkópọ̀ ajẹtífù àti ọ̀rọ̀-orúkọ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe kedere láìfi ẹ̀kọ́ nípa èrè iṣẹ́ kún un.
- source_word: καὶ
  choice: sì / àti
  rationale: ‘Sì’ so ìṣírí yìí mọ́ ọ̀rọ̀ tó ṣáájú, ‘àti’ sì so ìfẹ́ mọ́ àwọn iṣẹ́ rere.
theological_decisions:
- issue: Ìtumọ̀ παροξυσμός lè ní ìró odi tàbí líle
  choice: ru ara wa sókè sí ìfẹ́ àti àwọn iṣẹ́ rere
  alternative: ta ara wa jí sí ìfẹ́ àti àwọn iṣẹ́ rere; mú ara wa ní ìtara fún ìfẹ́ àti àwọn iṣẹ́ rere
  rationale: Ọ̀rọ̀ Gíríìkì náà lágbára, ṣùgbọ́n ohun tí a ń gbé lárugẹ—ìfẹ́ àti àwọn iṣẹ́ rere—dájú pé ó dára. Ìtumọ̀ àkọ́kọ́ pa agbára ìṣírí náà mọ́ láìyí i sí ìbínú tàbí ìkọlù, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìró ìṣírí àwùjọ ti ọ̀rọ̀ Gíríìkì mọ́.
