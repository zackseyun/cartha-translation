  naturalness: Ọ̀rọ̀ Yorùbá náà dáa ní gbogbogbòò, ṣùgbọ́n “Nítorí náà” fi ìbáṣepọ̀ àbájáde kún un tí kò sí nínú Gíríìkì, níbi tí gbolohun náà ti ń tẹ̀síwájú lábẹ́ “Nítorí.” “Tí wọ́n ń máa ń rú lọ́dọọdún” jẹ́ ọ̀nà àdánidá láti sọ ìṣe ọdọọdún tí ń tẹ̀síwájú.
