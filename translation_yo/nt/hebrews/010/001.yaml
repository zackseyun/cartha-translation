id: HEB.10.1
reference: Hebrews 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: yo
  text: Nítorí òfin ní òjìji àwọn ohun rere tí ń bọ̀, kì í ṣe àwòrán gangan ti àwọn ohun gidi náà[a]; nípasẹ̀ àwọn ẹbọ kan náà tí wọ́n ń máa ń rú lọ́dọọdún, kò lè mú àwọn tó ń sún mọ́ Ọlọ́run[b] di pípé láéláé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “kì í ṣe àwòrán gan-an ti àwọn ohun gidi náà.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn tó ń sún mọ́ Ọlọ́run” túmọ̀ sí àwọn tó ń wá síwájú rẹ̀ láti jọ́sìn.
    reason: cultural_note
  - marker: c
    text: “Mú ... di pípé” tún lè túmọ̀ sí “mú ... dé ibi àṣepé” tàbí “mú ... dé ibi àfojúsùn.” Kì í ṣe dandan pé kí wọ́n di aláìní àbùkù nínú ìwà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: òjìji
  rationale: “Òjìji” pa àkàwé Gíríìkì mọ́, ó sì fi hàn pé òfin jẹ́ àmì ohun tí ń bọ̀, kì í ṣe ohun náà ní kíkún.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: àwọn ohun rere tí ń bọ̀
  rationale: Gbólóhùn yìí pa ìtumọ̀ ohun rere ọjọ́ iwájú mọ́ láìfi àkókò ẹ̀kọ́ ìgbàkẹ́yìn kan pàtó kún un.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: kì í ṣe àwòrán àwọn ohun náà gan-an
  rationale: “Àwòrán” túmọ̀ εἰκών ní tààrà, “gan-an” sì mú ìtẹnumọ́ αὐτήν jáde, ní ìyàtọ̀ sí “òjìji.”
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις
  choice: àwọn ẹbọ kan náà tí wọ́n ń rú lọ́dọọdún
  rationale: Ó pa ìtẹnumọ́ ẹbọ kan náà àti àtúnṣe rẹ̀ ní ọdọọdún mọ́.
- source_word: εἰς τὸ διηνεκές
  choice: láìdáwọ́ dúró
  rationale: A so ọ́ mọ́ ìrúbọ gẹ́gẹ́ bí ipò rẹ̀ nínú gbólóhùn Gíríìkì, láti fi ìṣe tí ń bá a lọ hàn lẹ́gbẹ̀ẹ́ àtúnṣe ọdọọdún.
- source_word: οὐδέποτε δύναται
  choice: kò lè ... láéláé
  rationale: Ìtumọ̀ yìí pa agbára ọ̀rọ̀ ìkọ̀ pátápátá náà mọ́ ní Yorùbá àdánidá.
- source_word: τοὺς προσερχομένους
  choice: àwọn tó ń sún mọ́ Ọlọ́run
  rationale: Nínú Hébérù, ọ̀rọ̀ náà sábà ń tọ́ka sí wíwọlé síwájú Ọlọ́run nínú ìjọsìn; fífi “Ọlọ́run” hàn mú ìtumọ̀ yẹn ṣe kedere.
- source_word: τελειῶσαι
  choice: mú ... di pípé
  rationale: Ó pa ọ̀rọ̀ pàtàkì τελειόω mọ́, èyí tó ní í ṣe pẹ̀lú mímú ẹni dé ibi àfojúsùn àti fífún un ní ọ̀nà láti sún mọ́ Ọlọ́run.
theological_decisions:
- issue: Ìyàtọ̀ láàárín òjìji àti àwòrán gangan
  choice: Òfin ní òjìji àwọn ohun rere tí ń bọ̀, kì í ṣe àwòrán àwọn ohun náà gan-an.
  alternative: Òfin jẹ́ àwòrán àmì àwọn ìbùkún ọjọ́ iwájú.
  rationale: Gíríìkì fi σκιά àti εἰκών wéra ní kedere. Ìtumọ̀ yìí kò sọ ipa tí Ọlọ́run fún òfin di kékeré, bẹ́ẹ̀ ni kò sọ òfin di òtítọ́ ìkẹyìn náà.
- issue: Ìtumọ̀ τελειῶσαι nínú ọ̀rọ̀ ẹbọ
  choice: mú ... di pípé
  alternative: mú ... dé òpin; mú ... pé tán
  rationale: “Di pípé” pa àṣà ọ̀rọ̀ pàtàkì inú Hébérù mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé èyí ni dídé ibi àfojúsùn àti ọ̀nà pipe sí Ọlọ́run, kì í ṣe dandan àìní àbùkù ìwà.
- issue: Ẹni tí àwọn olùjọsìn ń sún mọ́
  choice: Ṣíṣe “Ọlọ́run” ní kedere nínú ọ̀rọ̀ náà.
  alternative: Àwọn tó ń sún mọ́ ọn; àwọn tó ń sún mọ́ tòsí.
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò dárúkọ ohun tí wọ́n ń sún mọ́ ní ẹsẹ yìí, lílo προσέρχομαι nínú Hébérù àti ọ̀rọ̀ ẹbọ tó yí i ká tọ́ka sí sísún mọ́ Ọlọ́run nínú ìjọsìn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “rú ẹbọ,” “sún mọ́ Ọlọ́run,” àti “di pípé” gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tó wọ́pọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
