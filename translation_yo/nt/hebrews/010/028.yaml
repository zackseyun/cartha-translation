source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá kọ òfin Mósè sílẹ̀ yóò kú láìsí àánú lórí ẹ̀rí àwọn ẹlẹ́rìí méjì tàbí mẹ́ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó pa á.” Ní tààrà, Gíríìkì sọ pé “ó kú,” ṣùgbọ́n àyíká ọ̀rọ̀ ń tọ́ka sí pípa ẹni gẹ́gẹ́ bí ìdájọ́ lábẹ́ òfin Mósè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: tí ó bá kọ ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kíkọ ohun aláṣẹ tàbí fífi í sílẹ̀. ‘Kọ òfin Mósè sílẹ̀’ jẹ́ èdè Yorùbá àdánidá tí ó fi ìkọ̀sílẹ̀ àṣẹ òfin hàn, láìdín ìtumọ̀ rẹ̀ kù sí rírú àṣẹ kan ṣoṣo.
- source_word: τις
  choice: Ẹnikẹ́ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àìnípàtó yìí ń tọ́ka sí ẹnikẹ́ni ní gbogbogbòò; ‘Ẹnikẹ́ni’ bá ìlò náà mu ní Yorùbá.
- source_word: νόμον Μωϋσέως
  choice: òfin Mósè
  rationale: Èyí tẹ̀lé ìbáṣepọ̀ orúkọ inú Gíríìkì ní ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: χωρὶς οἰκτιρμῶν
  choice: láìsí àánú
  rationale: Bí ó tilẹ̀ jẹ́ pé οἰκτιρμῶν wà ní ọ̀pọ̀, ‘láìsí àánú’ ni ìtumọ̀ àdánidá ní Yorùbá, ó sì bá àyíká ìdájọ́ mu.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: lórí ẹ̀rí ẹlẹ́rìí méjì tàbí mẹ́ta
  rationale: ἐπί pẹ̀lú dative ń fi ìpìlẹ̀ ìdájọ́ hàn níbí. Fífi ‘ẹ̀rí’ kún un mú ìtumọ̀ òfin náà ṣe kedere ní Yorùbá láìfi ohun àjèjì kún ọ̀rọ̀.
- source_word: ἀποθνῄσκει
  choice: yóò kú
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ‘kú’ ní tààrà, ó sì ń sọ àbájáde òfin ní gbogbogbòò. Ìgbékalẹ̀ àídájú Yorùbá ‘tí ó bá ... yóò kú’ mú ìtumọ̀ gbogbogbòò yẹn jáde lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ agbára ìdájọ́ àti pípa ẹni nínú ἀποθνῄσκει ní kedere
  choice: yóò kú
  alternative: a ó pa á
  rationale: Àyíká òfin Mósè fi hàn pé ikú ìdájọ́ ni a ń sọ̀rọ̀ rẹ̀, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ‘kú,’ kì í ṣe gbólóhùn olùṣe tí ó sọ ‘pa.’ Títọ́jú ‘yóò kú’ nínú ọ̀rọ̀ pàtàkì kò kọjá ohun tí orísun sọ, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ òfin náà hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìgbékalẹ̀ ‘tí ó bá ... yóò’ mú gbólóhùn òfin gbogbogbòò náà dun bí Yorùbá àdánidá.
