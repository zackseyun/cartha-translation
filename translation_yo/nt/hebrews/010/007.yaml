  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: yo
  text: Nígbà náà ni mo wí pé, “Wò ó, mo ti dé—nínú àkájọ ìwé[a] ni a ti kọ nípa mi—láti ṣe ìfẹ́ rẹ, Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìwé àkájọ.” Gbólóhùn náà ń tọ́ka sí àkájọ ìwé, kì í ṣe ìwé òde òní tí a dì àwọn ojú-ewé rẹ̀ pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìgbà tí ọ̀rọ̀ ìdáhùn náà bẹ̀rẹ̀ hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: εἶπον
  choice: ni mo wí pé
  rationale: Ó jẹ́ ọ̀nà tó bá èdè Yorùbá mu láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni kan sọ, ó sì pa àkókò ìṣe inú ẹsẹ náà mọ́.
- source_word: Ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka àti ìpè fún àkíyèsí mọ́, ó sì ní ìwọ̀ntúnwọ̀nsì tó yẹ fún àyọkà Ìwé Mímọ́.
- source_word: ἥκω
  choice: mo ti dé
  rationale: Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí ìsinsìnyí ṣùgbọ́n ó sábà máa ń fi dídé tí àbájáde rẹ̀ ṣì dúró hàn; ‘mo ti dé’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: nínú àkájọ ìwé
  rationale: Ní inú gbólóhùn yìí, κεφαλίς ń tọ́ka sí àkájọ tàbí ìwé tí a ká, kì í ṣe àkọlé orí kan. Àṣàyàn yìí pa àwòrán ohun ìkọ̀wé ayé àtijọ́ mọ́.
- source_word: γέγραπται
  choice: ni a ti kọ ọ́
  rationale: Ó fi hàn pé a ti kọ ọ́ sílẹ̀, ohun tí a kọ náà sì ṣì dúró gẹ́gẹ́ bí ẹ̀rí tó ní agbára.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe tààrà tí ó sì wọ́pọ̀ fún περί pẹ̀lú ọ̀rọ̀-orúkọ ní genitive.
- source_word: τοῦ ποιῆσαι
  choice: láti ṣe
  rationale: Ó fi ète dídé ẹni tó ń sọ̀rọ̀ hàn, ó sì tú ποιέω ní ọ̀nà tó ṣe tààrà.
- source_word: ὁ θεός
  choice: ìwọ Ọlọ́run
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìrísí nominative ní Gíríìkì, ó ń ṣiṣẹ́ gẹ́gẹ́ bí àdírẹ́sì tààrà; ‘ìwọ Ọlọ́run’ mú èyí ṣe kedere ní Yorùbá.
- source_word: τὸ θέλημά σου
  choice: ìfẹ́ rẹ
  rationale: ‘Ìfẹ́’ níhìn-ín túmọ̀ sí ohun tí Ọlọ́run fẹ́ tàbí pinnu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bá θέλημα mu ní àyíká yìí.
theological_decisions:
- issue: Ìtọ́ka ẹni-àkọ́kọ́ nínú àyọkà Sáàmù tí Hébérù lò nípa Mèsáyà
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ẹni-àkọ́kọ́ láìfi àlàyé míì kún un pé ẹni tó ń sọ̀rọ̀ ni Mèsáyà.
  alternative: Kí a sọ ní pàtó nínú ẹsẹ náà pé Mèsáyà tàbí Kristi ni ẹni tó ń sọ̀rọ̀.
  rationale: Àyíká Hébérù fi àyọkà náà kan Ọmọ/Kristi, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ jẹ́ ìkéde ẹni-àkọ́kọ́. Ìtumọ̀ náà jẹ́ kí àyíká ló ṣàlàyé ẹni tó ń sọ̀rọ̀, kò sì yanjú ohun tí ẹsẹ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘Kíyèsí i’ láti pa ohùn àyọkà mímọ́ mọ́, a sì lo ààmì ìdádúró gígùn láti fi gbólóhùn àárín hàn kedere.
