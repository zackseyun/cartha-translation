id: HEB.10.20
reference: Hebrews 10:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: yo
  text: èyí tí ó ṣí sílẹ̀ fún wa gẹ́gẹ́ bí ọ̀nà tuntun àti alààyè nípasẹ̀ aṣọ ìdábùú[a], ìyẹn ni, ẹran ara rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ìbòjú.”
    reason: Àṣàyàn ọ̀rọ̀ fún καταπέτασμα, aṣọ inú ibi mímọ́ ní àgọ́ ìjọsìn tàbí tẹ́ńpìlì.
  - marker: b
    text: Gbólóhùn náà ń ṣàlàyé àpèjúwe aṣọ ìdábùú nípa dídámọ̀ ọ́ pẹ̀lú ẹran ara Jesu.
    reason: Àlàyé ìtumọ̀ fún ìdámọ̀ appositional tó wà nínú Gíríìkì; kò pinnu ju ohun tí ọ̀rọ̀ náà sọ lọ.
lexical_decisions:
- source_word: ἣν
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan náà so gbólóhùn yìí mọ́ ọ̀nà ìwọlé tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa rẹ̀, láìfi ohun tí ó ń tọ́ka sí hàn ju ti Gíríìkì lọ.
- source_word: ἐνεκαίνισεν
  choice: ó fi sílẹ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ó dá ọ̀nà náà sílẹ̀ tuntun fún lílò. Èdè yìí jẹ́ ti ẹ̀dá, ó sì ṣì pa ìtumọ̀ ìbẹ̀rẹ̀ tàbí ìyàsímímọ́ mọ́.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó fi hàn pé àwa ni a ṣe ọ̀nà náà fún, gẹ́gẹ́ bí ohun àǹfààní.
- source_word: ὁδὸν
  choice: ọ̀nà
  rationale: Ó bójú mu fún ọ̀nà gidi àti ọ̀nà àpèjúwe sí iwájú Ọlọ́run.
- source_word: πρόσφατον
  choice: tuntun
  rationale: Ó sọ pé ọ̀nà náà jẹ́ èyí tí a ṣẹ̀ṣẹ̀ dá sílẹ̀, láìlo ọ̀rọ̀ tí kò bá Yorùbá òde òní mu.
- source_word: ζῶσαν
  choice: alààyè
  rationale: Ó pa àwòrán ọ̀nà tí ó wà láàyè mọ́, láìyí i sí ‘tí ń fúnni ní ìyè,’ èyí tí yóò túmọ̀ rẹ̀ síwájú sí i.
- source_word: διὰ τοῦ καταπετάσματος
  choice: la aṣọ ìdábùú kọjá
  rationale: καταπέτασμα ni aṣọ tí ń dí ibi mímọ́ lọ́wọ́ ní àgọ́ ìjọsìn tàbí tẹ́ńpìlì; ‘aṣọ ìdábùú’ ṣe kedere ju ‘ìbòjú’ lọ nínú àyíká yìí.
- source_word: τοῦτ’ ἔστιν
  choice: èyíinì ni
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti ṣe àlàyé tàbí láti dá ohun kan mọ̀ pẹ̀lú ohun mìíràn.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: ẹran ara rẹ̀
  rationale: Ó pa ìtumọ̀ gidi σάρξ mọ́, kò sì rọ́pò rẹ̀ pẹ̀lú ‘ara’ nìkan. Ìṣọ̀kan rẹ̀ pẹ̀lú ‘aṣọ ìdábùú’ ni a fi sílẹ̀ gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìdámọ̀ aṣọ ìdábùú pẹ̀lú ẹran ara Jesu nínú àpèjúwe
  choice: “èyíinì ni, ẹran ara rẹ̀”
  alternative: “èyíinì ni, la ẹran ara rẹ̀ kọjá”
  rationale: Gíríìkì fi ‘ẹran ara rẹ̀’ sí ipò àlàyé lẹ́gbẹ̀ẹ́ ‘aṣọ ìdábùú.’ Kí a má bàa pinnu bóyá διὰ gbọ́dọ̀ tún jẹ́ mímú wá sínú àlàyé náà, a pa ìdámọ̀ àpèjúwe náà mọ́ taara.
- issue: Ìtumọ̀ σάρξ
  choice: ẹran ara
  alternative: ara
  rationale: Níhìn-ín, σάρξ ń tọ́ka sí ẹran ara Jesu gan-an, kì í ṣe ìwà ẹlẹ́ṣẹ̀. ‘Ẹran ara’ pa ọ̀rọ̀ orísun àti ìdíyelé ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọlọ́lá, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Aṣọ ìdábùú’ jẹ́ kíkà tó ṣe kedere fún aṣọ inú àgọ́ ìjọsìn/tẹ́ńpìlì; ‘ẹran ara’ sì pa ìtumọ̀ gidi σάρξ mọ́. Àmì dáṣì tó wà ní ìparí fi hàn pé ẹsẹ náà ń bá gbólóhùn ẹsẹ 19 lọ, ó sì ń tẹ̀ sí ẹsẹ 21.
