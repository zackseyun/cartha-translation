- from: Ẹ jẹ́ kí a súnmọ́ pẹ̀lú ọkàn tòótọ́[a], nínú ìdánilójú ìgbàgbọ́ kíkún, níwọ̀n bí a ti wọ́n ọkàn wa mọ́ kúrò lọ́wọ́ ẹ̀rí-ọkàn búburú[b], tí a sì ti fi omi tó mọ́ wẹ ara wa[c].
  to: Ẹ jẹ́ kí a súnmọ́ pẹ̀lú ọkàn tòótọ́[a], nínú ìdánilójú ìgbàgbọ́ kíkún, pẹ̀lú ọkàn wa tí a ti wọ́n mọ́ kúrò lọ́wọ́ ẹ̀rí-ọkàn búburú[b], àti ara wa tí a ti wẹ pẹ̀lú omi tó mọ́[c].
