  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: yo
  text: Ẹ jẹ́ kí a súnmọ́ pẹ̀lú ọkàn tòótọ́[a], nínú ìdánilójú ìgbàgbọ́ kíkún, pẹ̀lú ọkàn wa tí a ti wọ́n mọ́ kúrò lọ́wọ́ ẹ̀rí-ọkàn búburú[b], àti ara wa tí a ti wẹ pẹ̀lú omi tó mọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn àìṣẹ̀tàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀rí-ọkàn ẹlẹ́bi.”
    reason: lexical_alternative
  - marker: c
    text: Àwòrán yìí lè rántí èdè ìwẹ̀nùmọ́ nínú ìṣe ìsìn, àwọn òǹkàwé kan sì lè gbọ́ ìró ìbatisí nínú rẹ̀; ṣùgbọ́n ẹsẹ náà kò sọ ní kedere pé ìbatisí ni ìwẹ̀ yìí.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Ẹ jẹ́ kí a súnmọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ìṣírí ẹni àkọ́kọ́ púpọ̀, ó sì ń tọ́ka sí sísúnmọ́ Ọlọ́run nínú àyíká ìjọsìn. A kò fi ohun tí a ń sún mọ́ kún un, nítorí Gíríìkì kò sọ ọ́ ní kedere nínú ẹsẹ yìí.
- source_word: ἀληθινῆς καρδίας
  choice: pẹ̀lú ọkàn tòótọ́
  rationale: “Ọkàn tòótọ́” lè túmọ̀ sí ọkàn tí ó jẹ́ òtítọ́, ojúlówó, tàbí aláìṣẹ̀tàn, láì dín ìtumọ̀ náà kù sí òtítọ́ inú nìkan.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: nínú ìdánilójú ìgbàgbọ́ kíkún
  rationale: Ìtumọ̀ yìí pa àwòrán Gíríìkì “nínú” mọ́, ó sì fi πληροφορία hàn gẹ́gẹ́ bí ìdánilójú tí ó kún.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: níwọ̀n bí a ti wọ́n ọkàn wa mọ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle perfect passive, ó ń tọ́ka sí ipò ìwẹ̀nùmọ́ tí ó ti wáyé. “Wọ́n … mọ́” pa àwòrán fífi ohun olómi wọ́n mọ́, ó sì sọ àbájáde ìwẹ̀nùmọ́ di èdè Yorùbá àdánidá.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: kúrò lọ́wọ́ ẹ̀rí-ọkàn búburú
  rationale: “Ẹ̀rí-ọkàn búburú” túmọ̀ πονηρᾶς ní tààrà, kò sì sọ ọ́ di ẹ̀rí-ọkàn ẹlẹ́bi nìkan. “Kúrò lọ́wọ́” fi ìyapa tí ἀπό ń tọ́ka sí hàn.
- source_word: λελουσμένοι τὸ σῶμα
  choice: tí a sì ti … wẹ ara wa
  rationale: Ó pa ìfarakanra rẹ̀ mọ́ pẹ̀lú participle perfect tó ṣáájú, ó sì lo “ara wa” ní ọ̀nà Yorùbá tó bá olùkà púpọ̀ mu.
- source_word: ὕδατι καθαρῷ
  choice: pẹ̀lú omi tó mọ́
  rationale: “Omi tó mọ́” fi ìtumọ̀ clean/pure hàn láì mú kí ó dà bí ọ̀rọ̀ ìmọ̀ ẹ̀sìn pàtó “omi mímọ́.”
theological_decisions:
- issue: Bóyá kí ìwẹ̀ ara jẹ́ ìtọ́ka kedere sí ìbatisí
  choice: Pa àwòrán ìwẹ̀nùmọ́ mọ́ láì dárúkọ ìbatisí nínú ọ̀rọ̀ ẹsẹ
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìbatisí, tàbí ka gbogbo rẹ̀ sí àpẹẹrẹ ìwẹ̀nùmọ́ inú nìkan
  rationale: Ẹsẹ náà lè mú èdè ìwẹ̀nùmọ́ àṣà Lẹ́fítíkù àti ìbatisí wá sí ọkàn, ṣùgbọ́n kò sọ ìdánimọ̀ ìwẹ̀ náà ní kedere. Ìtumọ̀ náà kò yanjú àìdánilójú yìí ní ti ẹ̀kọ́ ìjọ kan.
- issue: Ìtumọ̀ συνειδήσεως πονηρᾶς
  choice: ẹ̀rí-ọkàn búburú
  alternative: ẹ̀rí-ọkàn ẹlẹ́bi
  rationale: Gíríìkì sọ “búburú,” èyí tí ó ní ìgbòòrò ju ìmọ̀lára ẹ̀bi lọ; nítorí náà a pa ìtumọ̀ ìwà rere àti ìwẹ̀nùmọ́ rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ní àmì ohùn níbi tí ó ti yẹ. A lo ọ̀rọ̀ àdánidá tí olùkà òde òní lè lóye, ṣùgbọ́n a pa ìró ìjọsìn àti ìwẹ̀nùmọ́ inú orísun Gíríìkì mọ́.
