source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: yo
  text: ṣùgbọ́n ìfojúsọ́nà ẹlẹ́rùjẹ̀jẹ̀ kan fún ìdájọ́[a], àti ìrunú iná tí yóò jẹ àwọn alátakò run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ọ̀nà míì, “ìfojúsọ́nà ẹlẹ́rùjẹ̀jẹ̀ kan fún ìdájọ́ àti ìtara bí iná tí yóò jẹ àwọn alátakò run.”
    reason: Àṣàyàn yìí mú ìtumọ̀ “ìtara gbígbóná” ti ζῆλος jáde, dípò “ìrunú,” bó tilẹ̀ jẹ́ pé méjèèjì lè bá àyíká ìdájọ́ náà mu.
lexical_decisions:
- source_word: φοβερὰ
  choice: ẹlẹ́rùjẹ̀jẹ̀
  rationale: Ó ṣàpèjúwe ἐκδοχή gẹ́gẹ́ bí ohun tí ń mú ẹ̀rù ńlá báni; ọ̀rọ̀ yìí mú agbára ìkìlọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ, ó sì bá agbára adversative ti δέ mu.
- source_word: τις
  choice: kan
  rationale: Ó pa ìtumọ̀ àìlẹ́tọ̀ọ́ pàtó ti ọ̀rọ̀ arọ́pò orúkọ náà mọ́ láìlo gbólóhùn tí kò ní dún bí Yorùbá àdánidá.
- source_word: ἐκδοχὴ κρίσεως
  choice: ìfojúsọ́nà ... fún ìdájọ́
  rationale: “Ìfojúsọ́nà” sọ ìretí tàbí dídúró de ohun tó ń bọ̀; “fún ìdájọ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti so ohun tí a ń retí mọ́ ọn.
- source_word: πυρὸς ζῆλος
  choice: ìrunú iná
  rationale: Ní àyíká ìdájọ́ yìí, ζῆλος ní agbára ìbínú gbígbóná. “Ìrunú iná” pa àwòrán iná àti ìbínú líle mọ́, láìfi ẹ̀kọ́ ìsìn míì kún un.
- source_word: ἐσθίειν
  choice: jẹ ... run
  rationale: Ó pa àwòrán gidi ti “jíjẹ run” mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún píparun pátápátá.
- source_word: μέλλοντος
  choice: tí ó fẹ́rẹ̀ẹ́
  rationale: Ó fi hàn pé ìṣe náà ń bọ̀ lọ́jọ́ iwájú, ó sì sún mọ́lé, gẹ́gẹ́ bí μέλλω ṣe túmọ̀ sí níbí.
- source_word: τοὺς ὑπεναντίους
  choice: àwọn alátakò
  rationale: Ó tọ́ka sí àwọn tí wọ́n dúró ní ìtakò, ó sì pa ohùn ọ̀rọ̀ tó ṣe déédé ní àyíká ìdájọ́ mọ́.
theological_decisions:
- issue: Irú ìdájọ́ tí àwòrán iná náà ń tọ́ka sí
  choice: Pa àwòrán ìrunú iná tí yóò jẹ àwọn alátakò run mọ́, láìsọ pé ó jẹ́ àpẹẹrẹ lásán tàbí ṣàlàyé rẹ̀ ní pàtó gẹ́gẹ́ bí ìjìyà ayérayé.
  alternative: Túmọ̀ rẹ̀ ní ọ̀nà ìtumọ̀ gbòòrò sí i bí “iná tó ń ru sókè,” tàbí fi “ìjìyà ayérayé” kún un ní kedere.
  rationale: Ẹsẹ náà fúnra rẹ̀ fi ìdájọ́ Ọlọ́run tó le koko hàn, ṣùgbọ́n kò ṣàlàyé gbogbo bí ìdájọ́ náà ṣe rí. Ìtumọ̀ náà pa agbára ìkìlọ̀ àti àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Ẹlẹ́rùjẹ̀jẹ̀” àti “jẹ ... run” jẹ́ ọ̀rọ̀ òde òní tí òǹkàwé lásán lè lóye, nígbà tí “ìdájọ́” àti “alátakò” pa ohùn ọ̀rọ̀ mímọ́ tó níyì mọ́.
