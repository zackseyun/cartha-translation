  text: àti pé a ní àlùfáà ńlá kan lórí ilé Ọlọ́run[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olórí àlùfáà.” Ìwé Hébérù sábà máa ń fi Jésù hàn gẹ́gẹ́ bí olórí àlùfáà, ṣùgbọ́n ohun tí ẹsẹ̀ yìí sọ ní tààràtà ni “àlùfáà ńlá.”
    reason: alternative_reading
  - marker: b
    text: “Ilé Ọlọ́run” tún lè ní ìtumọ̀ àwọn ará ilé Ọlọ́run, ìyẹn àwọn ènìyàn rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti pé
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú rẹ̀ nínú ẹsẹ̀ 19–21; “àti pé” jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú àtòjọ ohun tí àwọn onígbàgbọ́ ní.
- source_word: ἱερέα
  choice: àlùfáà
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àlùfáà, kì í ṣe oyè pàtó náà “olórí àlùfáà” (ἀρχιερεύς).
- source_word: μέγαν
  choice: ńlá
  rationale: Ó fi ọlá àti ipò gíga àlùfáà náà hàn, láì sọ ọ́ di oyè pàtó tí Gíríìkì kò lò.
- source_word: ἐπὶ
  choice: tí ó wà lórí
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí àṣẹ àti àbójútó lórí ilé Ọlọ́run.
- source_word: τὸν οἶκον
  choice: ilé
  rationale: “Ilé” pa àwòrán inú Bíbélì mọ́, ó sì tún lè ní ìtumọ̀ agbo ilé tàbí àwọn ènìyàn Ọlọ́run.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ó fi hàn pé ilé náà jẹ́ ti Ọlọ́run; àkójọpọ̀ “ilé Ọlọ́run” jẹ́ èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἱερέα μέγαν sí oyè pàtó “olórí àlùfáà”
  choice: àlùfáà ńlá
  alternative: olórí àlùfáà
  rationale: Bí ó tilẹ̀ jẹ́ pé ìwé Hébérù sábà máa ń fi Jésù hàn gẹ́gẹ́ bí olórí àlùfáà, ẹsẹ̀ yìí lo ἱερεύς + μέγας (“àlùfáà ńlá”), kì í ṣe ἀρχιερεύς. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láì kọ àkòrí ìwé náà sílẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbàdojú, ọlọ́lá, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. Gbólóhùn náà jẹ́ apá kan nínú gbólóhùn gígùn ti Hébérù 10:19–22, nítorí náà a bẹ̀rẹ̀ rẹ̀ pẹ̀lú “àti pé,” a sì fi àmì kọ́má parí rẹ̀.
