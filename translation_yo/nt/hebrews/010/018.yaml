source:
  edition: SBLGNT
  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: yo
  text: Níbi tí ìdáríjì àwọn nǹkan wọ̀nyí[a] wà, kò tún sí ẹbọ fún ẹ̀ṣẹ̀ mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdásílẹ̀ àwọn nǹkan wọ̀nyí”; “àwọn nǹkan wọ̀nyí” ń tọ́ka sí àwọn ẹ̀ṣẹ̀ àti ìwà àìlófin tí a mẹ́nu kàn ní ẹsẹ̀ tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Níbi tí ... bá wà
  rationale: Ó fi ipò tàbí àyíká tí ọ̀rọ̀ ìparí náà ti jẹ́ òtítọ́ hàn; ìlò yìí jẹ́ Yorùbá àdánidá.
- source_word: δὲ
  choice: A kò túmọ̀ ọ́ lọ́tọ̀
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ìṣàn ọ̀rọ̀ Yorùbá lè gbé láìfi ọ̀rọ̀ àfikún sí i; èyí kò sọ ìtakora di líle ju ti Gíríìkì lọ.
- source_word: ἄφεσις
  choice: ìdáríjì
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìdásílẹ̀ tàbí ìmúkúrò ẹ̀bi ẹ̀ṣẹ̀; “ìdáríjì” ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa àfihàn Gíríìkì mọ́ láìfi “ẹ̀ṣẹ̀” kún ọ̀rọ̀ pàtó, nígbà tí àyíká ẹsẹ tó ṣáájú ń ṣàlàyé ohun tí ó ń tọ́ka sí.
- source_word: οὐκέτι
  choice: kò tún ... mọ́
  rationale: Ìṣètò ọ̀rọ̀ Yorùbá yìí fi hàn pé ohun náà ti dópin, ó sì bá “no longer” mu.
- source_word: προσφορὰ
  choice: ọrẹ ẹbọ
  rationale: Ó tọ́ka sí ohun tí a mú wá fún ìrúbọ; “ọrẹ ẹbọ” pa ìtumọ̀ gbòòrò rẹ̀ mọ́ láìdín in kù sí irú ẹbọ kan ṣoṣo.
- source_word: περὶ ἁμαρτίας
  choice: fún ẹ̀ṣẹ̀
  rationale: Ó pa ìtumọ̀ ẹbọ tí ó jẹ mọ́ ẹ̀ṣẹ̀ mọ́, láìsọ ọ́ di “ẹbọ ẹ̀ṣẹ̀” ní ọ̀nà tí yóò túmọ̀ ju Gíríìkì lọ.
theological_decisions:
- issue: Ìtumọ̀ ìparí ẹbọ Kristi
  choice: Níbi tí ìdáríjì ti wà, kò tún sí ọrẹ ẹbọ fún ẹ̀ṣẹ̀ mọ́.
  alternative: Kò sí irú ọrẹ tàbí ẹbọ kankan mọ́ rárá; tàbí pé ọ̀rọ̀ náà kan àwọn ẹbọ Lefi nìkan ní ìtumọ̀ ààlà.
  rationale: Àyíká Hébérù 10 fi àwọn ẹbọ tí a ń ṣe léraléra wé ẹbọ Kristi tí ó munadoko lẹ́ẹ̀kan ṣoṣo. Ìtumọ̀ náà sọ ìdáwọ́dúró ọrẹ ẹbọ fún ẹ̀ṣẹ̀, ṣùgbọ́n kò gbé ìpinnu tó kọjá ohun tí ẹsẹ náà sọ wọlé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ọrẹ ẹbọ” fún προσφορά láti pa èrò ohun tí a mú wá gẹ́gẹ́ bí ẹbọ mọ́.
