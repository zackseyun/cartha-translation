  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe sọ ìgboyà yín[a] nù, èyí tí ó ní ẹ̀san ńlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé yín.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí òmìnira onígboyà tàbí ìfẹ̀hàn láti sọ̀rọ̀ ní gbangba, pàápàá nígbà tí a bá ń sún mọ́ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: ẹ má ṣe sọ … nù
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ìkìlọ̀ pé kí wọ́n má ṣe mọ̀ọ́mọ̀ kọ ohun kan sílẹ̀ tàbí sọ ọ́ nù; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára ìtumọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣírí yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Nínú Hébérù, ọ̀rọ̀ náà lè túmọ̀ sí òmìnira àti ìgbẹ́kẹ̀lé láti sún mọ́ Ọlọ́run, pẹ̀lú ìgboyà láti dúró ṣinṣin nínú ìgbàgbọ́. “Ìgboyà” pa apá ìmúrasílẹ̀ àti àìbẹ̀rù rẹ̀ mọ́.
- source_word: ὑμῶν
  choice: yín
  rationale: Arọ́pò-orúkọ oníni fún ọ̀pọ̀ ènìyàn ni, tí ó ń ṣe àpèjúwe ìgboyà náà.
- source_word: ἥτις
  choice: èyí tí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn àlàyé kan nípa irú ìgboyà tí a mẹ́nu kàn.
- source_word: ἔχει
  choice: ó ní
  rationale: Ìtumọ̀ tààrà ti ọ̀rọ̀ ìṣe náà ni; kò fi ìtumọ̀ míì kún un pé ìgboyà náà ‘mú’ èrè wá.
- source_word: μεγάλην
  choice: ńlá
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára àti iye èrè náà hàn.
- source_word: μισθαποδοσίαν
  choice: èrè
  rationale: Ó sọ ìsanpadà rere tàbí ohun rere tí a ó fi san iṣẹ́; “èrè” ṣe kedere, ó sì yẹ fún ìlérí ọjọ́ iwájú nínú àyíká ọ̀rọ̀ Hébérù.
theological_decisions:
- issue: Ìtumọ̀ παρρησία nínú Hébérù 10:35
  choice: “Ìgboyà” gẹ́gẹ́ bí ìgbẹ́kẹ̀lé onígboyà níwájú Ọlọ́run àti ìdúróṣinṣin nínú ìgbàgbọ́
  alternative: “Ìgbẹ́kẹ̀lé” tàbí “òmìnira láti sọ̀rọ̀ ní gbangba”
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbígbòòrò ju ìmọ̀lára ìdánilójú inú lọ; ó kan òmìnira láti sún mọ́ Ọlọ́run àti ìgboyà láti farahàn gẹ́gẹ́ bí onígbàgbọ́. Àkọ́lé àlàyé pa ìtumọ̀ míì tí ó ṣeé ṣe mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọlá sí ẹnì kan. A gbé àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ pàtàkì tí ó ń ṣàlàyé.
