  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: yo
  text: Nípa ìfẹ́ náà[a] ni a ti sọ wá di mímọ́ nípasẹ̀ ẹbọ ara Jésù Mèsáyà[b] lẹ́ẹ̀kan ṣoṣo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, “Nínú ìfẹ́ náà.” Ìtumọ̀ rẹ̀ ni pé ìfẹ́ Ọlọ́run tí a mẹ́nu kàn ṣáájú ni ó mú kí a sọ àwọn onígbàgbọ́ di mímọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Jésù Kristi.” Oyè Gíríìkì Χριστός ni a túmọ̀ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Nípa ìfẹ́ náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí ìfẹ́ Ọlọ́run tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. “Nípa” fi ipa ohun èlò tàbí ìdí tí gbolohun Gíríìkì náà ní hàn ní Yorùbá àdánidá.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: a ti sọ wá di mímọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ perfect participle àti ọ̀rọ̀-ìṣe “láti jẹ́” ń sọ ìṣe tí a ti parí tí àbájáde rẹ̀ sì dúró. “A ti sọ wá di mímọ́” pa ìtumọ̀ yìí mọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
- source_word: διὰ τῆς προσφορᾶς
  choice: nípasẹ̀ fífi ... rú ẹbọ
  rationale: διά pẹ̀lú genitive ń fi ọ̀nà tàbí ohun èlò hàn; προσφορά sì jẹ́ ohun tí a fi rú ẹbọ. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa àyíká ẹbọ mọ́.
- source_word: τοῦ σώματος
  choice: ara
  rationale: 'Èyí pa ohun gidi tí a fi rú ẹbọ mọ́: ara Jésù fúnra rẹ̀.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός níbí lè dúró gẹ́gẹ́ bí oyè. “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò kí a ka a sí apá kan lásán nínú orúkọ.
- source_word: ἐφάπαξ
  choice: lẹ́ẹ̀kan ṣoṣo láéláé
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ pé ẹbọ náà ṣẹlẹ̀ lẹ́ẹ̀kan ṣoṣo, kò sì nílò àtúnṣe. Ìtumọ̀ yìí sọ ìdánilójú àti àìṣe-àtúnṣe náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìrísí àti ipa ìsọdimímọ́
  choice: a ti sọ wá di mímọ́
  alternative: a jẹ́ mímọ́; a ń sọ wá di mímọ́
  rationale: Ìrísí Gíríìkì jẹ́ periphrastic perfect, kì í ṣe present progressive. Ìtumọ̀ náà fi ìṣe tí a ti parí àti àbájáde tó ń bá a lọ hàn láìyanju ìforígbárí ẹ̀kọ́ ẹ̀sìn ju ohun tí gírámà sọ lọ.
- issue: Oyè Kristẹni Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός ṣì lè jẹ́ oyè tó ní ìtumọ̀ kedere. “Mèsáyà” jẹ́ kí ìtumọ̀ oyè náà hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ fi “Jésù Kristi” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tó bófin mu.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “rú ẹbọ” láti jẹ́ kí àyíká ìrúbọ hàn kedere, àti “lẹ́ẹ̀kan ṣoṣo láéláé” láti pa agbára ἐφάπαξ mọ́.
