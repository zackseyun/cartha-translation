  source_fidelity: Ìtumọ̀ náà mú ìsopọ̀ ìṣàlàyé γάρ, ìfẹ̀símúlẹ̀ àkókò ἔτι, àti ìtẹnumọ́ μικρὸν ὅσον ὅσον wá. Ṣùgbọ́n “kò sì ní falẹ̀” kò tú οὐ χρονίσει ní kedere; “kò sì ní pẹ́” ni ìtumọ̀ Yorùbá tó tọ́ àti tó wọ́pọ̀ jù. “Ìgbà díẹ̀ gan-an ṣá ni ó kù” tún sọ ‘yet a very little while’ ní Yorùbá àdánidá láì yí ìtumọ̀ padà.
  naturalness: “Ní ìgbà díẹ̀ sí i—díẹ̀ gan-an” jẹ́ àkànlò tí ó dùn bí ìgbà díẹ̀ míràn tí a fi kún ìgbà tí ó wà tẹ́lẹ̀. “Ìgbà díẹ̀ gan-an ṣá ni ó kù” jẹ́ ìsọ̀rọ̀ Yorùbá boṣewa tó mọ́, tó sì pa ìmọ̀ ‘sì/yet’ mọ́. “Kò ní pẹ́” sì jẹ́ adayeba ju “kò ní falẹ̀” lọ níhìn-ín.
  terminology: A pa ὁ ἐρχόμενος mọ́ gẹ́gẹ́ bí “ẹni tí ń bọ̀,” láì fi ìtumọ̀ orúkọ oyè Mèsáyà mú un dandan. Lẹ́tà kékeré nínú ọ̀rọ̀ àkọ́kọ́ dáàbò bo àìdájú tó wà nínú participle náà; àlàyé ìsàlẹ̀ ojú ìwé lè darí sí agbára orúkọ oyè tí àyíká rẹ̀ lè ní.
