  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: yo
  text: Nítorí pé, ìgbà díẹ̀ gan-an ṣá ni ó kù[a]; ẹni tí ń bọ̀[b] yóò dé, kò sì ní pẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “díẹ̀, tó bẹ́ẹ̀ tó bẹ́ẹ̀.” Ọ̀rọ̀ Gíríìkì náà tún ọ̀rọ̀ kan ṣe láti tẹnumọ́ pé ìgbà náà kúrú gidigidi.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà lè jẹ́ àpèjúwe gbogbogbò, “ẹni tí ń bọ̀.” Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ yìí lè jẹ́ kí a ka a sí orúkọ oyè tó ń tọ́ka sí Mèsáyà, Gíríìkì náà kò fi ìtumọ̀ yẹn mú un dandan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Nítorí pé, ní … sí i
  rationale: “Nítorí pé” fi ipa ìṣàlàyé γάρ hàn, “sí i” sì mú ìtumọ̀ àkókò ἔτι jáde ní Yorùbá àdánidá.
- source_word: μικρὸν ὅσον ὅσον
  choice: ìgbà díẹ̀ sí i—díẹ̀ gan-an
  rationale: Àtúnwí ọ̀rọ̀ Gíríìkì ń tẹnumọ́ pé àkókò náà kúrú gidigidi; gbólóhùn Yorùbá yìí pa ìtẹnumọ́ náà mọ́ láì di líle tàbí àjèjì.
- source_word: ὁ ἐρχόμενος
  choice: Ẹni tí ń bọ̀
  rationale: Ó tú participle oní-artíkù náà ní tààrà, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè ní àyíká ọ̀rọ̀ yìí láì fi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ἥξει
  choice: yóò dé
  rationale: Ọ̀rọ̀ ọjọ́ iwájú ni; “yóò dé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó bá ìlò èdè mu fún dídé ẹni tí ń bọ̀.
- source_word: οὐ χρονίσει
  choice: kò sì ní falẹ̀
  rationale: “Falẹ̀” tú èrò pé ẹni náà kò ní dá ìbọ̀ rẹ̀ dúró tàbí pé kò ní pẹ́ ju àkókò lọ, ní èdè Yorùbá òde òní tó níyì.
theological_decisions:
- issue: Bóyá ὁ ἐρχόμενος jẹ́ orúkọ oyè Mèsáyà tàbí gbólóhùn gbogbogbò nípa ẹni kan tó ń bọ̀
  choice: Ẹni tí ń bọ̀, pẹ̀lú lẹ́tà ńlá láti jẹ́ kí agbára orúkọ oyè rẹ̀ ṣeé rí
  alternative: ẹni tí ń bọ̀, gẹ́gẹ́ bí àpèjúwe gbogbogbò láìsí agbára orúkọ oyè
  rationale: Àyíká ọ̀rọ̀ Hébérù àti àyọlò Ìwé Mímọ́ náà ṣeé ṣe kí ó tọ́ka sí Mèsáyà tó ń bọ̀, ṣùgbọ́n ìtumọ̀ náà ṣì pa ìrísí participle Gíríìkì mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì jẹ́wọ́ àǹfààní ìtumọ̀ gbogbogbò.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó níyì ni a lò. Àmì ohùn wà níbi tó yẹ. Àmì gígùn inú gbólóhùn ń pa ìtẹnumọ́ àkànlò Gíríìkì mọ́, “falẹ̀” sì yẹra fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
