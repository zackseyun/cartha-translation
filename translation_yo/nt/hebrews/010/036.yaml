id: HEB.10.36
reference: Hebrews 10:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: yo
  text: Nítorí ẹ nílò ìfaradà, kí ẹ lè gba ìlérí náà lẹ́yìn tí ẹ bá ti ṣe ìfẹ́ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba ohun tí a ṣèlérí.”
    reason: Àwọn ọ̀rọ̀ κομίσησθε τὴν ἐπαγγελίαν lè túmọ̀ sí gbígba ìlérí náà tàbí gbígba ohun tí a ṣèlérí.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: ìfaradà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí dídúró ṣinṣin lábẹ́ ìnira láìjáwọ́; “ìfaradà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́ láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: χρείαν ἔχετε
  choice: ẹ nílò
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àṣà èdè mu fún gbólóhùn Gíríìkì tí ó túmọ̀ sí “ẹ ní àìní” tàbí “ẹ nílò.”
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí àbájáde tí a ń retí hàn ní Yorùbá àdánidá.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ohun tí Ọlọ́run fẹ́, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó níyì nínú Yorùbá.
- source_word: ποιήσαντες
  choice: lẹ́yìn tí ẹ bá ti ṣe
  rationale: Aorist participle náà tọ́ka sí iṣe tí ó ṣáájú gbígba náà; gbólóhùn yìí mú ìbáṣepọ̀ àkókò náà hàn kedere.
- source_word: κομίσησθε
  choice: ẹ lè gba
  rationale: Nínú àyíká yìí, κομίζω túmọ̀ sí gbígba tàbí rírí ohun tí a ṣèlérí; “gba” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ.
- source_word: τὴν ἐπαγγελίαν
  choice: ìlérí náà
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì “ìlérí” mọ́, bẹ́ẹ̀ ni kò fi tipátipá pinnu bóyá ọ̀rọ̀ náà ń tọ́ka sí ìlérí fúnra rẹ̀ tàbí ohun tí a ṣèlérí.
theological_decisions:
- issue: Bóyá ἐπαγγελίαν túmọ̀ sí ìlérí fúnra rẹ̀ tàbí ohun rere tí a ṣèlérí
  choice: ìlérí náà
  alternative: ohun tí a ṣèlérí
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ “ìlérí” ní tààrà, ṣùgbọ́n pẹ̀lú κομίσησθε ó tún lè túmọ̀ sí ohun tí ìlérí náà ń tọ́ka sí. Ọ̀rọ̀ inú ẹsẹ pa àìdánilójú tó wà nínú orísun mọ́, àlàyé ìsàlẹ̀ sì fi ìtumọ̀ kejì hàn.
translation_notes:
  register: Yorùbá boṣewa, ìgbàlódé, tí ó níyì, pẹ̀lú àmì ohùn ní kíkún. A lo ọ̀nà ọ̀rọ̀ tó ṣe kedere fún òǹkàwé gbogbo, láìfi èrò ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
