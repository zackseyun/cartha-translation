  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: yo
  text: 'Àti pé: “Èmi kì yóò rántí ẹ̀ṣẹ̀ wọn àti àwọn ìṣe àìlófin wọn mọ́ rárá.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀lé ìrísí ọ̀rọ̀ Gíríìkì pẹkipẹki, “Èmi kì yóò rántí ẹ̀ṣẹ̀ wọn àti àwọn ìṣe àìlófin wọn mọ́ láéláé.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ìṣe àìlófin” túmọ̀ ἀνομίαι; a tún lè túmọ̀ rẹ̀ sí “àwọn ìṣe tí ó rú òfin” tàbí, gẹ́gẹ́ bí ọ̀rọ̀ ìbílẹ̀, “àwọn ẹ̀ṣẹ̀ búburú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: àti pé
  rationale: Àsopọ̀ yìí ń tẹ̀síwájú nínú ọ̀rọ̀ tí a fa yọ; “àti pé” jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú gbolohun tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: ẹ̀ṣẹ̀ wọn
  rationale: “Ẹ̀ṣẹ̀” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ἁμαρτία; Yorùbá kò nílò àmì ọ̀pọ̀ níbí, nítorí “wọn” ti mú ìtumọ̀ ọ̀pọ̀ hàn.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: àti àwọn ìṣe àìlófin wọn
  rationale: ἀνομία túmọ̀ sí àìlófin tàbí rírú òfin. “Àwọn ìṣe àìlófin” mú ìtumọ̀ ọ̀pọ̀ tó ṣe kedere hàn ní èdè òde òní ju ọ̀rọ̀ àbùdá kan tó lè ṣókùnkùn lọ.
- source_word: οὐ μὴ μνησθήσομαι
  choice: Èmi kì yóò rántí … mọ́ láéláé
  rationale: οὐ μή pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú jẹ́ ìkọ̀ tí ó lágbára. “Èmi” àti “láéláé” mú ìtẹnumọ́ náà hàn láìsọ ìtumọ̀ “rántí” di ọ̀rọ̀ mìíràn.
- source_word: ἔτι
  choice: mọ́
  rationale: Ní ìṣọ̀kan pẹ̀lú ìkọ̀, “mọ́” ni ọ̀nà àdánidá Yorùbá láti sọ “kò … mọ́”; “láéláé” tún ń gbé agbára οὐ μή jáde.
theological_decisions:
- issue: Ọlọ́run kò ní rántí àwọn ẹ̀ṣẹ̀ mọ́
  choice: Pa àwòrán ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “Èmi kì yóò rántí … mọ́ láéláé.”
  alternative: Parọ́pò “rántí” pẹ̀lú “kà sí wọn lọ́rùn” tàbí “dá wọn lẹ́bi nítorí.”
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà nípa àìrántí Ọlọ́run nínú ìlérí májẹ̀mú. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́, láìṣàlàyé rẹ̀ bí ẹni pé Ọlọ́run pàdánù ìmọ̀ tàbí bí ẹni pé ọ̀rọ̀ náà kàn túmọ̀ sí àìdáni lẹ́bi.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “kì yóò … mọ́ láéláé” láti mú ìkọ̀ tó lágbára àti ἔτι jáde ní ọ̀nà Yorùbá àdánidá.
