- from: àti pé, “Èmi kì yóò rántí ẹ̀ṣẹ̀ wọn àti àwọn ìṣe àìlófin wọn mọ́ láéláé.”[a][b]
  to: 'Àti pé: “Èmi kì yóò rántí ẹ̀ṣẹ̀ wọn àti àwọn ìṣe àìlófin wọn mọ́ rárá.”[a][b]'
  rationale: The revision retains every element of the Greek while improving Yoruba idiom and correcting the grammatical weakness in footnote b. It keeps “rántí” rather than interpreting the covenantal idiom as acquittal or loss of knowledge, and it preserves the distinct wording for sins and lawless deeds.
