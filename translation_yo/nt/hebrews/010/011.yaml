id: HEB.10.11
reference: Hebrews 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: yo
  text: Olúkúlùkù àlùfá sì ń dúró lójoojúmọ́, ó ń ṣe iṣẹ́ ìsìn, ó sì ń rú àwọn ẹbọ kan náà léraléra, àwọn tí kò lè mú àwọn ẹ̀ṣẹ̀ kúrò láéláé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yọ àwọn ẹ̀ṣẹ̀ kúrò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: Olúkúlùkù àlùfá
  rationale: Ọ̀rọ̀ yìí ní agbára ìpínkiri, ó ń tọ́ka sí àlùfá kọ̀ọ̀kan nínú ètò àwọn àlùfá Lefi; kò túmọ̀ sí olórí àlùfá.
- source_word: ἕστηκεν
  choice: dúró
  rationale: Ó pa ìdúró gẹ́gẹ́ bí ipò mọ́, ó sì mú ìyàtọ̀ rẹ̀ pẹ̀lú jíjókòó Mèsáyà ní ẹsẹ tó tẹ̀ lé e hàn láìfi àlàyé kún ọ̀rọ̀ náà.
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó sọ iṣẹ́ tí a ń ṣe ní gbogbo ọjọ́ ní ọ̀nà àdánidá àti kedere ní Yorùbá.
- source_word: λειτουργῶν
  choice: láti máa ṣe iṣẹ́ ìsìn
  rationale: Ó fi hàn pé iṣẹ́ mímọ́ ti àlùfá ni, kì í ṣe iṣẹ́ ṣíṣe lásán.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: àwọn ẹbọ kan náà
  rationale: Ó pa ìtẹnumọ́ pé irú ẹbọ kan náà ni wọ́n ń rú mọ́.
- source_word: πολλάκις
  choice: léraléra
  rationale: Ó mú ìṣe tí ń ṣẹlẹ̀ ní àtúnṣe lọ́pọ̀ ìgbà jáde ní ṣókí àti ní agbára.
- source_word: προσφέρων
  choice: ń rú
  rationale: ‘Rú ẹbọ’ ni ọ̀rọ̀ Yorùbá tó bójú mu jù lọ fún fífi ẹbọ rú ní ọ̀rọ̀ ìsìn.
- source_word: αἵτινες
  choice: tí
  rationale: Ó so gbólóhùn àlàyé náà mọ́ àwọn ẹbọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: οὐδέποτε δύνανται
  choice: kò lè ... láéláé
  rationale: 'Àpapọ̀ yìí pa agbára ìkọ̀sílẹ̀ pátápátá mọ́: kò sí ìgbà kankan tí àwọn ẹbọ náà lè ṣe bẹ́ẹ̀.'
- source_word: περιελεῖν ἁμαρτίας
  choice: mú ẹ̀ṣẹ̀ kúrò
  rationale: Ó túmọ̀ ìmúkúrò ẹ̀ṣẹ̀ ní tààrà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ ìdúró àlùfá pẹ̀lú àríyànjiyàn Hébérù 10
  choice: A lo ‘dúró’ láti pa ìyàtọ̀ mọ́ láàárín iṣẹ́ àwọn àlùfá tí ń bá a lọ àti jíjókòó Mèsáyà ní ẹsẹ tó tẹ̀ lé e.
  alternative: ‘ń dúró’ tàbí ‘ti dúró’ ní ọ̀nà tí kò fi ìyàtọ̀ lítíréṣọ̀ hàn tó bẹ́ẹ̀.
  rationale: Àyíká ọ̀rọ̀ náà mọ̀ọ́mọ̀ fi àwọn ipò méjèèjì wé ara wọn; ìtumọ̀ náà kò gbọdọ̀ pa ìyàtọ̀ yìí run tàbí fi ẹ̀kọ́ míì kún un.
- issue: Ìwọ̀n àìlágbára àwọn ẹbọ náà lórí ẹ̀ṣẹ̀
  choice: Àwọn ẹbọ náà ‘kò lè mú ẹ̀ṣẹ̀ kúrò láéláé.’
  alternative: Ọ̀rọ̀ aláìlágbára bí ‘kò lè yanjú ẹ̀ṣẹ̀ pátápátá.’
  rationale: Gíríìkì sọ àìlágbára náà ní kíkún nínú àríyànjiyàn onkọ̀wé nípa àìtó ètò ẹbọ àtijọ́; a kò rọ ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún àwọn òǹkàwé òde òní. ‘Àlùfá’ àti ‘rú ẹbọ’ pa àyíká iṣẹ́ ìsìn mọ́ láìlo èdè ẹgbẹ́ ìjọ kan pàtó.
