revisions:
- from: Olúkúlùkù àlùfá sì dúró láti máa ṣe iṣẹ́ ìsìn lójoojúmọ́, ó sì ń rú àwọn ẹbọ kan náà léraléra, tí kò lè mú ẹ̀ṣẹ̀ kúrò láéláé.[a]
  to: Olúkúlùkù àlùfá sì ń dúró lójoojúmọ́, ó ń ṣe iṣẹ́ ìsìn, ó sì ń rú àwọn ẹbọ kan náà léraléra, àwọn tí kò lè mú àwọn ẹ̀ṣẹ̀ kúrò láéláé.[a]
  rationale: A ṣàtúnṣe ìkọ́lé àwọn apá-ìṣe láti fi hàn pé ṣíṣe iṣẹ́ ìsìn àti rírú ẹbọ ni àwọn ìṣe tó ń ṣàpèjúwe àlùfá tó ń dúró, kì í ṣe ète ìdúró rẹ̀. A tún mú ọ̀pọ̀ “àwọn ẹ̀ṣẹ̀” wá síta, a sì mú aṣojú-orúkọ ìbátan náà hàn kedere.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:30:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: ó jẹ́ ìpínkiri sí àlùfá kọ̀ọ̀kan, ó pa ìdúró wọn mọ́, ó sì fi ìtúnrá-ẹbọ wọn àti àìlágbára wọn hàn. Síbẹ̀, ìkọ́lé “dúró láti máa ṣe” lè túmọ̀ sí pé ìdúró náà jẹ́ fún èrò láti ṣe iṣẹ́ ìsìn, dípò kí ó jẹ́ àwọn ìṣe tó ń ṣẹlẹ̀ papọ̀ gẹ́gẹ́ bí λειτουργῶν καὶ προσφέρων. A tún yẹ kí ọ̀pọ̀ “sins” hàn ní Yorùbá.'
  naturalness: 'Àtúnṣe náà lo ìṣọ̀kan apá-ìṣe Yorùbá tí ó rọrùn: “ń dúró..., ń ṣe..., ń rú...”. “Àwọn tí” jẹ́ kedere síi ju “tí kò lè” lọ nítorí ó tún tọ́ka sí àwọn ẹbọ náà ní kedere.'
  terminology: “Àlùfá,” “iṣẹ́ ìsìn,” àti “rú ẹbọ” bójú mu fún àyíká iṣẹ́ ìsìn àwọn àlùfá. “Àwọn ẹ̀ṣẹ̀” ń pa ọ̀pọ̀ ἁμαρτίας mọ́.
  issues:
  - severity: medium
    issue: “dúró láti máa ṣe iṣẹ́ ìsìn” fi ìbáṣepọ̀ ète kan hàn
    rationale: Gíríìkì ní àwọn participle méjì tó ṣàpèjúwe àlùfá tó ń dúró; kò sọ pé ó dúró ní ète láti ṣe iṣẹ́ ìsìn.
  - severity: low
    issue: “ẹ̀ṣẹ̀” jẹ́ ẹyọ níbi tí Gíríìkì ti jẹ́ ọ̀pọ̀
    rationale: Bí ó tilẹ̀ jẹ́ pé “ẹ̀ṣẹ̀” lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àpapọ̀ ní Yorùbá, “àwọn ẹ̀ṣẹ̀” dá ọ̀pọ̀ ἁμαρτίας hàn ní kedere.
  revised_text: Olúkúlùkù àlùfá sì ń dúró lójoojúmọ́, ó ń ṣe iṣẹ́ ìsìn, ó sì ń rú àwọn ẹbọ kan náà léraléra, àwọn tí kò lè mú àwọn ẹ̀ṣẹ̀ kúrò láéláé.[a]
