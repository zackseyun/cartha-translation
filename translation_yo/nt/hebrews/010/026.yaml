source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: yo
  text: Nítorí bí a bá ń dẹ́ṣẹ̀ mọ̀ọ́mọ̀ lẹ́yìn tí a ti gba ìmọ̀ nípa òtítọ́[a], kò tún sí ẹbọ fún àwọn ẹ̀ṣẹ̀ mọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmọ̀ tí ó péye sí i nípa òtítọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìmọ̀ tí ó péye sí i tàbí ìmọ̀ tí ó dájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: mọ̀ọ́mọ̀
  rationale: Ó fi hàn pé ìṣe náà jẹ́ ti ìmọ̀ọ́mọ̀ àti ìfẹ́ inú, ní èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé ẹsẹ̀ yìí mọ́ pẹ̀lú ọ̀rọ̀ tí ó ṣáájú.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: bí àwa bá ń ... máa dẹ́ṣẹ̀
  rationale: Àpólà participle ìsinsìnyí tọ́ka sí ìṣe tí ń bá a lọ tàbí ìwà tí a ń tẹ̀ síwájú nínú rẹ̀, kì í ṣe ẹ̀ṣẹ̀ kan ṣoṣo.
- source_word: μετὰ τὸ λαβεῖν
  choice: lẹ́yìn tí a ti gba
  rationale: Ó fi ìtẹ̀lé àkókò hàn, níbi tí gbígba ìmọ̀ ti ṣẹlẹ̀ ṣáájú ìṣe tí a ń kìlọ̀ nípa rẹ̀.
- source_word: ἐπίγνωσιν
  choice: ìmọ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún knowledge; àǹfààní ìtumọ̀ bí ìmọ̀ kíkún ni a fi pamọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τῆς ἀληθείας
  choice: òtítọ́
  rationale: Ó túmọ̀ gbólóhùn genitive náà ní ti ẹ̀dá, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà sí i.
- source_word: οὐκέτι
  choice: kò tún ... mọ́
  rationale: Ìṣètò Yorùbá yìí sọ pé láti ìgbà náà lọ ohun náà kò kù mọ́.
- source_word: περὶ ἁμαρτιῶν
  choice: fún àwọn ẹ̀ṣẹ̀
  rationale: Nínú ọ̀rọ̀ ẹbọ, περὶ pẹ̀lú genitive ní ìtumọ̀ ẹbọ tí a ṣe nítorí ẹ̀ṣẹ̀ tàbí fún ẹ̀ṣẹ̀.
- source_word: ἀπολείπεται
  choice: kò tún sí ... mọ́
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé kò sí ohun tí ó kù.
- source_word: θυσία
  choice: ẹbọ
  rationale: Ẹbọ ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún sacrifice nínú àríyànjiyàn Hébérù nípa iṣẹ́ ẹbọ Kristi.
theological_decisions:
- issue: Ìrísí ìṣe àti agbára ìkìlọ̀ nínú ἁμαρτανόντων
  choice: “bí àwa bá ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀,” gẹ́gẹ́ bí ìṣe tí a ń tẹ̀ síwájú nínú rẹ̀
  alternative: “bí àwa bá mọ̀ọ́mọ̀ dẹ́ṣẹ̀,” èyí tí ó lè dà bí ẹ̀ṣẹ̀ kan ṣoṣo
  rationale: Present participle náà ní ti ẹ̀dá ń tọ́ka sí ìṣe tí ń bá a lọ. Èyí pa ìkìlọ̀ náà mọ́ láì sọ ọ́ di ẹ̀kọ́ pé gbogbo ẹ̀ṣẹ̀ ìmọ̀ọ́mọ̀ kan ṣoṣo lẹ́yìn ìgbàgbọ́ ni ẹsẹ̀ náà ń tọ́ka sí.
- issue: Agbára ἐπίγνωσις nínú ọ̀rọ̀ ìyípadà àti ìkìlọ̀
  choice: “ìmọ̀ òtítọ́,” láì pinnu irú ìrírí ìgbàlà tí ìmọ̀ náà ní
  alternative: “ìmọ̀ kíkún òtítọ́” tàbí “ìmọ̀ òtítọ́ tí ń gbani là”
  rationale: Ẹsẹ̀ náà sọ pé wọ́n gba ìmọ̀ òtítọ́, ṣùgbọ́n kò ṣàlàyé ní tààrà bóyá èyí túmọ̀ sí àtúnbí. A kò fi àríyànjiyàn ẹ̀ka ìjọ kan sí inú ìtumọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àkópọ̀ “ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀” jẹ́ kí ìmọ̀ọ́mọ̀ àti ìtẹ̀síwájú ìṣe náà hàn; “àwa” mú ἡμῶν jáde ní kedere. Àmì ìdákẹ́jẹ ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ̀ tó tẹ̀ lé e.
