revisions:
- from: Nítorí bí àwa bá ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀ lẹ́yìn tí a ti gba ìmọ̀ òtítọ́[a], kò tún sí ẹbọ fún àwọn ẹ̀ṣẹ̀ mọ́,
  to: Nítorí bí a bá ń dẹ́ṣẹ̀ mọ̀ọ́mọ̀ lẹ́yìn tí a ti gba ìmọ̀ nípa òtítọ́[a], kò tún sí ẹbọ fún àwọn ẹ̀ṣẹ̀ mọ́,
  rationale: Àtúnṣe náà mú ìkọ̀lé Yorùbá rọrùn sí i nípa rírọ́pò “ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀” pẹ̀lú “ń dẹ́ṣẹ̀ mọ̀ọ́mọ̀,” láì pàdánù ìtumọ̀ ìṣe tí ń bá a lọ àti ìmọ̀ọ́mọ̀. A tún ṣe “knowledge of the truth” ní “ìmọ̀ nípa òtítọ́” kí ìbáṣepọ̀ genitive náà lè ṣe kedere. Àmì ìsàlẹ̀ náà ṣì pa àǹfààní ìtumọ̀ fuller/decisive knowledge mọ́, láì pinnu ìtumọ̀ ẹ̀kọ́ ìjọ eyikeyi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:30:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory γάρ, the temporal sequence after receiving knowledge, the ongoing force of the present participle, and the assertion that no sacrifice for sins remains. The final comma appropriately leaves the sentence open for v. 27.
  naturalness: '“Bí àwa bá ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀” is understandable but stylistically overloaded: the combination of ń, mọ̀ọ́mọ̀, and máa is less idiomatic than a simple progressive construction with the intentional adverb placed after the verb. “Ìmọ̀ nípa òtítọ́” also expresses ‘knowledge of the truth’ more naturally and unambiguously in contemporary Standard Yoruba.'
  terminology: Ẹbọ is the appropriate established term for θυσία. “Dẹ́ṣẹ̀ mọ̀ọ́mọ̀” preserves intentionality without making the statement about one isolated act. The footnote should likewise use a natural Yoruba expression for the possible fuller sense of ἐπίγνωσις.
  issues:
  - severity: medium
    issue: Awkward verbal construction in “bá ń mọ̀ọ́mọ̀ máa dẹ́ṣẹ̀.”
    rationale: The draft’s sequence of progressive marker, adverb, and máa is cumbersome. “Bá ń dẹ́ṣẹ̀ mọ̀ọ́mọ̀” naturally conveys continued deliberate sinning and retains the participle’s durative force.
  - severity: low
    issue: “Ìmọ̀ òtítọ́” can be structurally ambiguous.
    rationale: It can be read as ‘true knowledge.’ “Ìmọ̀ nípa òtítọ́” clearly conveys knowledge whose object is the truth, while adding no theological interpretation.
  - severity: low
    issue: Footnote wording “ìmọ̀ kíkún òtítọ́” is not fully natural Yoruba syntax.
    rationale: “Ìmọ̀ tí ó péye sí i nípa òtítọ́” gives the lexical alternative clearly and preserves the stated nuance without asserting a doctrinally defined ‘saving knowledge.’
  revised_text: Nítorí bí a bá ń dẹ́ṣẹ̀ mọ̀ọ́mọ̀ lẹ́yìn tí a ti gba ìmọ̀ nípa òtítọ́[a], kò tún sí ẹbọ fún àwọn ẹ̀ṣẹ̀ mọ́,
