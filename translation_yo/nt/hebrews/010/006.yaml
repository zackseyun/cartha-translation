  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: yo
  text: Ìwọ kò sì ní inú dídùn nínú àwọn ẹbọ tí a sun pátápátá àti àwọn ẹbọ fún ẹ̀ṣẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “àwọn ẹbọ sísun àti àwọn ẹbọ ẹ̀ṣẹ̀.” Gbólóhùn Gíríìkì περὶ ἁμαρτίας jẹ́ ọ̀nà àkànṣe nínú èdè ìrúbọ, tí ó túmọ̀ sí ẹbọ tí a rú fún ẹ̀ṣẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: àwọn ọrẹ ẹbọ tí a sun pátápátá
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹbọ tí a sun tán pátápátá. Gbólóhùn yìí mú ìtumọ̀ náà hàn gbangba, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ọ̀rọ̀ ẹbọ lápapọ̀.
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ rọ́rọ́ tó so oríṣi ẹbọ méjèèjì pọ̀.
- source_word: περὶ ἁμαρτίας
  choice: àwọn ọrẹ ẹbọ fún ẹ̀ṣẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ ìrúbọ, gbólóhùn Gíríìkì yìí jẹ́ ọ̀nà àkànṣe láti sọ ẹbọ tí a rú fún ẹ̀ṣẹ̀. Èyí jẹ́ àdámọ̀ Yorùbá, ó sì pa ìtumọ̀ ìrúbọ mọ́.
- source_word: οὐκ
  choice: kò
  rationale: Ó pa àìsọ̀rètí ọ̀rọ̀ Gíríìkì mọ́ ní kíkún.
- source_word: εὐδόκησας
  choice: ní inú dídùn sí
  rationale: Ó túmọ̀ sí pé ẹni tí a ń bá sọ̀rọ̀ kò ní ìtẹ́lọ́rùn tàbí inú dídùn sí àwọn ẹbọ náà. Fọ́ọ̀mù ọ̀rọ̀-ìṣe náà jẹ́ ẹni kejì ẹyọ kan, tí a ń bá Ọlọ́run sọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ àwọn ọ̀rọ̀ ìrúbọ pàtó nínú àyọlò Sáàmù 40:6 LXX àti ìjiyàn Hébérù 10
  choice: Pa àwọn ẹ̀ka ẹbọ méjì náà mọ́ gẹ́gẹ́ bí “àwọn ọrẹ ẹbọ tí a sun pátápátá” àti “àwọn ọrẹ ẹbọ fún ẹ̀ṣẹ̀.”
  alternative: “àwọn ẹbọ sísun àti àwọn ẹbọ ẹ̀ṣẹ̀”
  rationale: Àwọn ọ̀rọ̀ pàtó yìí ń ran òǹkàwé lọ́wọ́ láti tẹ̀ lé ìyàtọ̀ tí Hébérù ń ṣe láàárín àwọn ẹbọ àti ìgbọràn Ọmọ, láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Ọrẹ ẹbọ” ń fi ohun tí a mú wá fún ìrúbọ hàn, “sun pátápátá” sì ń ṣàlàyé ὁλοκαυτώματα ní ọ̀nà tí òǹkàwé lasán lè lóye. A fi àmì ohùn sí ibi tí ó yẹ.
