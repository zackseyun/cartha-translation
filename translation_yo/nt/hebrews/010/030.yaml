id: HEB.10.30
reference: Hebrews 10:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: yo
  text: Nítorí a mọ ẹni tí ó sọ pé, “Tèmi ni ẹ̀san; èmi yóò san án padà,” àti lẹ́ẹ̀kan sí i[a], “Olúwa yóò ṣe ìdájọ́ àwọn ènìyàn rẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe bíi “ó sọ” kò sí nínú Gíríìkì lẹ́yìn “àti lẹ́ẹ̀kan sí i”; a fi ìtumọ̀ náà hàn nípasẹ̀ àyọlò kejì tí ó tẹ̀ lé e.
    reason: translation_clarity
  - marker: b
    text: Àyọlò yìí ń tọ́ka sí Diutarónómì 32:35–36. Nínú àyíká rẹ̀ níbẹ̀, “ṣe ìdájọ́” lè ní ìjìyà àti dídá ẹni láre nínú; níbí, àyíká ìkìlọ̀ tẹnu mọ́ ìdájọ́ Ọlọ́run.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: a mọ
  rationale: Fọ́ọ̀mù pípé οἶδα ní ìtumọ̀ àsìkò ìsinsìnyí ní Gíríìkì Koiné; ‘a mọ’ ni Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
- source_word: τὸν εἰπόντα
  choice: ẹni tí ó sọ pé
  rationale: Ó tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tó sọ ọ̀rọ̀ Ìwé Mímọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Tèmi ni ẹ̀san
  rationale: Gíríìkì náà jẹ́ gbólóhùn àkékúrú, ‘fún mi ni ẹ̀san’; ‘Tèmi ni ẹ̀san’ pa ìtumọ̀ ohun-ìní àti ìforígbárí ọ̀rọ̀ náà mọ́ láìfi àlàyé kún un.
- source_word: ἀνταποδώσω
  choice: èmi yóò san án padà
  rationale: Ó túmọ̀ sí sísan ohun tó yẹ padà; fífi ‘èmi’ hàn pa ìtẹnumọ́ orísun náà mọ́.
- source_word: καὶ πάλιν
  choice: àti lẹ́ẹ̀kan sí i pé
  rationale: Ó jẹ́ ọ̀nà àdánidá láti mú ọ̀rọ̀ àyọlò kejì wọlé; ‘pé’ ni a fi kún un fún ìṣàn Yorùbá.
- source_word: Κρινεῖ
  choice: yóò ṣe ìdájọ́
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ mọ́, láìdín un kù sí ìdáláre nìkan.
- source_word: κύριος
  choice: Olúwa
  rationale: Ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó níyì, fún κύριος nígbà tí ó tọ́ka sí Ọlọ́run.
- source_word: τὸν λαὸν αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ májẹ̀mú tó wà nínú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ èdè ìdájọ́ nínú àyọlò láti Diutarónómì
  choice: “Tèmi ni ẹ̀san; èmi yóò san án padà” àti “Olúwa yóò ṣe ìdájọ́ àwọn ènìyàn rẹ̀.”
  alternative: “Olúwa yóò dá àwọn ènìyàn rẹ̀ láre.”
  rationale: Nínú Diutarónómì, ọ̀rọ̀ ‘ṣe ìdájọ́’ lè ní ìtumọ̀ ìjìyà tàbí dídá ẹni láre. Àyíká ìkìlọ̀ nínú Hébérù 10 tẹnu mọ́ ìdájọ́ Ọlọ́run; ‘ṣe ìdájọ́’ pa ìwọ̀n ìtumọ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìrọ̀ ọ́ sí ìdáláre nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtẹnumọ́ ‘Tèmi’ àti ‘èmi’ pa ìlànà àyọlò Gíríìkì mọ́.
