source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: yo
  text: 'Nítorí, nígbà tí ó ń bá wọn wí, ó sọ pé: “Wò ó, àwọn ọjọ́ ń bọ̀, ni Olúwa wí, nígbà tí èmi yóò dá májẹ̀mú tuntun pẹ̀lú ilé Ísírẹ́lì àti pẹ̀lú ilé Júdà,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: nígbà tí ó rí àléébù lára wọn
  rationale: Ó mú ìtumọ̀ pé ẹni tí ń sọ̀rọ̀ rí ohun tí kò tọ́ lára àwọn ènìyàn náà, ó sì pa αὐτούς mọ́ gẹ́gẹ́ bí ‘wọn,’ láì yí i sí májẹ̀mú náà.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ ìkìlọ̀ tí ó pe olùgbọ́ sí àkíyèsí ni; ‘Wò ó’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: ἡμέραι ἔρχονται
  choice: ọjọ́ ń bọ̀
  rationale: Ó tẹ̀lé àwòrán orísun ní ti pẹkipẹki, ó sì jẹ́ gbólóhùn àsọtẹ́lẹ̀ adayeba ní Yorùbá.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: yóò ... dá májẹ̀mú tuntun
  rationale: ‘Dá májẹ̀mú’ jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá adayeba fún mímú májẹ̀mú kan wá sí ìdí àti fífi í múlẹ̀; ó yẹ fún συντελέσω nínú àyọkà yìí.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: ilé Ísírẹ́lì ... ilé Júdà
  rationale: A pa àpèjúwe ‘ilé’ mọ́, èyí tí ó lè túmọ̀ sí ìdílé tàbí àwọn ènìyàn gẹ́gẹ́ bí àwùjọ.
theological_decisions:
- issue: Ohun tí αὐτούς (‘wọn’) ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní tààrà sí ‘wọn,’ tí ó tọ́ka sí àwọn ènìyàn nínú ọ̀rọ̀ tó ṣáájú.
  alternative: Kí a sọ pé ó rí àléébù nínú májẹ̀mú àkọ́kọ́.
  rationale: Ẹ̀rí ọ̀rọ̀ SBLGNT tí a fún ní αὐτούς, ọ̀rọ̀ arọ́pò-orúkọ akọ ní ọ̀pọ̀, kì í ṣe májẹ̀mú; ìtumọ̀ kò gbọdọ̀ yanjú ìdààmú ẹ̀kọ́ nípa yíyí ohun tí orísun sọ padà.
- issue: Ìtumọ̀ διαθήκη
  choice: májẹ̀mú
  alternative: ìwé ìfẹ́ ẹni tó kú
  rationale: Nínú àyíká ìlérí Ọlọ́run sí Ísírẹ́lì àti Júdà, ‘májẹ̀mú’ ni ìtumọ̀ tó bá ọ̀rọ̀ mu.
translation_notes:
  register: Yorùbá àgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa ìlànà àsọtẹ́lẹ̀ àti ìtẹ̀síwájú gbólóhùn Giriki mọ́ ní ọ̀nà tí ó ṣàn dáadáa fún òǹkà Yorùbá.
