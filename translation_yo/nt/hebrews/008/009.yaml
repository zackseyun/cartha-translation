id: HEB.8.9
reference: Hebrews 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: yo
  text: kì í ṣe bí májẹ̀mú tí mo bá àwọn baba ńlá wọn dá ní ọjọ́ tí mo di ọwọ́ wọn mú láti mú wọn jáde kúrò ní ilẹ̀ Íjíbítì[a], nítorí wọn kò dúró ṣinṣin nínú májẹ̀mú mi, èmi náà kò sì ka wọ́n sí[b], ni Olúwa wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà Yorùbá tó túbọ̀ jẹ́ àdánidá, “nígbà tí mo mú wọn lọ́wọ́.”
    reason: lexical_alternative
  - marker: b
    text: Àyọlò yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì nínú ìwé Hébérù pé, “èmi náà kò sì ka wọ́n sí.” Ọ̀rọ̀ náà nínú èdè Hébérù, ní Jeremáyà 31:32, ní ìtumọ̀ mìíràn, tí a sábà máa ń túmọ̀ sí “bí ó tilẹ̀ jẹ́ pé mo jẹ́ ọkọ wọn” tàbí “bí ó tilẹ̀ jẹ́ pé mo jẹ́ olúwa wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: májẹ̀mú
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ìbáṣepọ̀ májẹ̀mú Ọlọ́run pẹ̀lú àwọn ènìyàn rẹ̀; “májẹ̀mú” ni ọ̀rọ̀ Yorùbá tó péye jù lọ ní àyíká yìí.
- source_word: ἐποίησα
  choice: tí mo bá … dá
  rationale: Àpólà Yorùbá “bá ẹnì kan dá májẹ̀mú” jẹ́ ọ̀nà àdánidá láti sọ ṣíṣe májẹ̀mú pẹ̀lú ẹnì kan.
- source_word: πατράσιν αὐτῶν
  choice: àwọn baba ńlá wọn
  rationale: Ó pa ìtọ́kasí akọ púpọ̀ mọ́, ó sì ṣe kedere pé àwọn baba ìran Ísírẹ́lì ni a ń sọ̀rọ̀ nípa wọn.
- source_word: ἐν ἡμέρᾳ
  choice: ní ọjọ́ tí
  rationale: Ó pa àwòrán ọjọ́ ìṣẹ̀lẹ̀ ìtàn náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: tí mo di ọwọ́ wọn mú
  rationale: Ó tẹ̀ lé àwòrán Gíríìkì ti dídì ọwọ́ mú, ó sì yàtọ̀ sí àtúmọ̀ àdánidá jù lọ tí a fi sínú àlàyé ìsàlẹ̀.
- source_word: ἐξαγαγεῖν
  choice: láti mú wọn jáde
  rationale: “Mú … jáde” lè túmọ̀ sí yíyọ tàbí mímú wọn kúrò ní ibì kan, ó sì bá àwòrán dídì ọwọ́ mú mu.
- source_word: γῆς Αἰγύπτου
  choice: ilẹ̀ Íjíbítì
  rationale: Ó pa γῆς, “ilẹ̀,” mọ́ dípò lílo “Íjíbítì” nìkan.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: wọn kò dúró ṣinṣin nínú májẹ̀mú mi
  rationale: “Dúró ṣinṣin nínú” fi ìtumọ̀ títẹ̀síwájú àti jíjẹ́ olóòtítọ́ sí májẹ̀mú hàn ní Yorùbá àdánidá.
- source_word: κἀγὼ
  choice: èmi náà … sì
  rationale: Ó pa ìtumọ̀ “àti èmi” mọ́ láì sọ ìbáṣepọ̀ ìdí-àbájáde tó lágbára ju àsopọ̀ Gíríìkì lọ.
- source_word: ἠμέλησα αὐτῶν
  choice: kò ka tiwọn sí
  rationale: Àpólà yìí fi àìfiyèsí tàbí àìká wọn sí hàn láì fi ìtumọ̀ ìkọ̀sílẹ̀ pátápátá kún ọ̀rọ̀ Gíríìkì.
- source_word: λέγει κύριος
  choice: ni Olúwa wí
  rationale: Ìlànà ọ̀rọ̀ yìí jẹ́ àdánidá àti ọ̀wọ̀ ní Yorùbá fún ọ̀nà ìtọ́kasí àsọtẹ́lẹ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ ἠμέλησα αὐτῶν nígbà tí ọ̀rọ̀ Hébérù Jeremáyà 31:32 ní ìtumọ̀ mìíràn
  choice: èmi náà kò sì ka tiwọn sí
  alternative: bí ó tilẹ̀ jẹ́ pé mo jẹ́ ọkọ wọn / olúwa wọn
  rationale: Ẹ̀dà Gíríìkì Hébérù sọ ἠμέλησα αὐτῶν ní kedere, nítorí náà a tẹ̀ lé e gẹ́gẹ́ bí orísun àkọ́kọ́. A fi ìyàtọ̀ tó ṣe pàtàkì nínú Jeremáyà Hébérù sínú àlàyé ìsàlẹ̀ láì dá ìforígbárí náà parí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “baba ńlá” fún àwọn baba ìran, àti “májẹ̀mú” fún ọ̀rọ̀ ẹ̀kọ́-ìgbàgbọ́ tó ṣe pàtàkì.
