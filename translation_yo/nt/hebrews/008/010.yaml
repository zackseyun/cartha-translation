  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ ìtumọ̀ pàtàkì mọ́: májẹ̀mú, ilé Ísírẹ́lì, àwọn òfin (ọpọ̀), ìkọ̀ sí ọkàn, àti ìlànà májẹ̀mú náà pé Ọlọ́run yóò jẹ́ Ọlọ́run wọn, wọ́n yóò sì jẹ́ ènìyàn rẹ̀. Síbẹ̀, ìṣètò “májẹ̀mú tí èmi yóò bá ilé Ísírẹ́lì dá” kò pé ní Yorùbá, nítorí ohun tí a ń dá—májẹ̀mú náà—kò hàn gẹ́gẹ́ bí àfikún ọ̀rọ̀-ìṣe náà. “Dá ... pẹ̀lú” jẹ́ kedere, ó sì bá διαθήσομαι mu. A tún tún gbolohun participle náà ṣe sí ìtumọ̀ tí ó rọrùn ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ti ń pa ìyàtọ̀ ìṣètò Gíríìkì mọ́.'
