id: HEB.8.10
reference: Hebrews 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: yo
  text: 'Nítorí èyí ni májẹ̀mú tí èmi yóò dá pẹ̀lú ilé Ísírẹ́lì lẹ́yìn àwọn ọjọ́ wọ̀nyẹn, ni Olúwa wí: Èmi yóò fi àwọn òfin mi sínú ìrònú wọn, èmi yóò sì kọ wọ́n sí ọkàn wọn; èmi yóò sì jẹ́ Ọlọ́run wọn, àwọn yóò sì jẹ́ ènìyàn mi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní fífi ìṣètò ọ̀rọ̀ Gíríìkì hàn sí i: “ní fífi àwọn òfin mi sínú ìrònú wọn, èmi yóò sì kọ wọ́n sí ọkàn wọn.” Ọ̀rọ̀ Gíríìkì náà ní participle kan, “ní fífi” tàbí “ní fífúnni,” lẹ́yìn náà ni ọ̀rọ̀-ìṣe ọjọ́ iwájú náà, “èmi yóò kọ,” wà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη / διαθήσομαι
  choice: májẹ̀mú / bá ... dá
  rationale: “Májẹ̀mú” ń pa ìtumọ̀ májẹ̀mú inú àsọtẹ́lẹ̀ Jeremáyà mọ́; ọ̀rọ̀ àdéhùn Yorùbá “bá ... dá májẹ̀mú” sì jẹ́ àdánidá fún ṣíṣe tàbí fífi májẹ̀mú kalẹ̀.
- source_word: οἴκῳ Ἰσραήλ
  choice: ilé Ísírẹ́lì
  rationale: Ó pa àpèjúwe àpapọ̀ àti èdè májẹ̀mú “ilé Ísírẹ́lì” mọ́, dípò kí a rọ ọ́ sí “Ísírẹ́lì” nìkan.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: lẹ́yìn àwọn ọjọ́ wọ̀nyẹn
  rationale: Ìtumọ̀ tààrà yìí pa àṣà ọ̀rọ̀ àsọtẹ́lẹ̀ àti ìsopọ̀ rẹ̀ mọ́ Jeremáyà.
- source_word: διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν
  choice: Ní fífi àwọn òfin mi sínú èrò inú wọn
  rationale: “Ní fífi” pa participle Gíríìkì mọ́, “àwọn òfin” sì pa plural mọ́. “Èrò inú” ń sọ ibi ìrònú àti òye ní Yorùbá àdánidá.
- source_word: ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς
  choice: èmi yóò sì kọ wọ́n sí orí ọkàn wọn
  rationale: “Kọ ... sí orí” pa àwòrán ohun tí a kọ sí orí ohun kan mọ́; “ọkàn” sì mú abala inú ènìyàn hàn.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν ... εἰς λαόν
  choice: èmi yóò sì jẹ́ Ọlọ́run wọn, àwọn yóò sì jẹ́ ènìyàn mi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti pa ìlànà ibatan májẹ̀mú náà mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ yìí pẹ̀lú Jeremáyà 31
  choice: Pa àwọn gbólóhùn májẹ̀mú bí “ilé Ísírẹ́lì,” “àwọn òfin mi,” “Ọlọ́run wọn,” àti “ènìyàn mi” mọ́.
  alternative: Ṣe àtúnsọ òde òní tí yóò dín àfihàn ọ̀rọ̀ àsọtẹ́lẹ̀ àtijọ́ kù.
  rationale: Agbára ẹ̀kọ́ inú ẹsẹ yìí ní í ṣe pẹ̀lú àyọlò májẹ̀mú tuntun láti inú Jeremáyà, nítorí náà a kò gbọ́dọ̀ pa ìsopọ̀ náà rẹ́.
- issue: Ìkọ̀ Gíríìkì tí ó ní participle lẹ́yìn náà future verb
  choice: Lo “Ní fífi ... èmi yóò sì kọ ...” kí ìyàtọ̀ fọ́ọ̀mù ọ̀rọ̀ náà lè hàn.
  alternative: “Èmi yóò fi àwọn òfin mi sínú èrò inú wọn, èmi yóò sì kọ wọ́n sí orí ọkàn wọn.”
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìṣètò Gíríìkì mọ́ bí ó ti lè ṣeé lóye; àyípadà tó rọrùn sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a fi àmì ohùn sí ibi tí ó yẹ. A pa ìró àsọtẹ́lẹ̀ àti èdè májẹ̀mú mọ́ láì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
