id: HEB.8.3
reference: Hebrews 8:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: yo
  text: Nítorí a yan gbogbo àlùfáà àgbà láti rú ẹ̀bùn àti ẹbọ; nítorí náà, ó pọndandan kí ẹni yìí náà ní ohun kan láti fi rú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn pé, “nítorí náà, ó pọndandan kí ẹni yìí náà ní ohun kan tí ó lè fi rú.” Ọ̀rọ̀ Gíríìkì kò sọ orúkọ ẹni náà ní tààrà; nínú àyíká, ẹni náà ni Jésù, àlùfáà àgbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Nítorí gbogbo àlùfáà àgbà
  rationale: “Gbogbo” pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan ní ìtumọ̀ pínpín, ìyẹn, olúkúlùkù àlùfáà àgbà. “Nítorí” fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí ó ṣáájú.
- source_word: εἰς τὸ προσφέρειν
  choice: láti fi ... rú
  rationale: Àkópọ̀ εἰς àti ọ̀rọ̀-ìṣe aláìlẹ́ni fi ète hàn. Ní àyíká iṣẹ́ àlùfáà, “rú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹ̀bùn tàbí ẹbọ fún Ọlọ́run.
- source_word: δῶρά τε καὶ θυσίας
  choice: ẹ̀bùn àti ẹbọ
  rationale: A pa àwọn ẹ̀ka méjèèjì mọ́, bí τε καὶ ṣe so wọ́n pọ̀. “Ẹ̀bùn” àti “ẹbọ” kò di ọ̀rọ̀ kan ṣoṣo, kí ìyàtọ̀ inú èdè iṣẹ́ ìsìn náà lè dúró.
- source_word: καθίσταται
  choice: ni a máa ń yàn
  rationale: Nínú àyíká ipò àlùfáà, ọ̀rọ̀ náà túmọ̀ sí yíyan tàbí gbígbé ẹnì kan sí ipò. Ìlò “a máa ń” bá gbólóhùn gbogbogbò nípa gbogbo àlùfáà àgbà mu.
- source_word: ὅθεν
  choice: nítorí náà
  rationale: Ó mú ìparí ọgbọ́n jáde láti inú gbólóhùn tó ṣáájú.
- source_word: ἀναγκαῖον ἔχειν
  choice: ó pọndandan kí ... ní
  rationale: Ó sọ dandan tàbí àìṣeéṣe láìní ohun náà; àkópọ̀ yìí jẹ́ Yorùbá àdánidá fún gbólóhùn àìlẹ́ni ti Gíríìkì.
- source_word: τι
  choice: ohun kan
  rationale: Ó pa àìsọ pàtó ti arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: καὶ τοῦτον
  choice: ẹni yìí pẹ̀lú
  rationale: “Ẹni yìí” pa agbára ìtọ́ka τοῦτον mọ́ láìfi orúkọ Jésù kún ọ̀rọ̀ náà; “pẹ̀lú” ṣàfihàn καί.
- source_word: ὃ προσενέγκῃ
  choice: tí yóò fi rú
  rationale: Ó sọ ohun tí ẹni náà ní fún ète fífi rú, ó sì pa ìmọ̀lára ìṣe tí a pinnu tàbí tí ó ṣeé ṣe mọ́.
theological_decisions:
- issue: Ẹni tí “ẹni yìí” (τοῦτον) ń tọ́ka sí
  choice: A fi “ẹni yìí” sí ọ̀rọ̀ pàtàkì, nígbà tí àlàyé ìsàlẹ̀ sọ pé Jésù ni ó ń tọ́ka sí nínú àyíká.
  alternative: Kí a kọ “Jésù” tàbí “Kristi” sínú ọ̀rọ̀ pàtàkì.
  rationale: Àyíká Hébérù fi Jésù hàn gẹ́gẹ́ bí àlùfáà àgbà tí a ń sọ̀rọ̀ rẹ̀, ṣùgbọ́n Gíríìkì lo arọ́pò ìtọ́ka. Ìtumọ̀ náà kò gbọdọ̀ sọ ohun tí orísun fi sílẹ̀ ní àìsọ pàtó di ohun tí a sọ ní tààrà.
- issue: Àwọn ọ̀rọ̀ iṣẹ́ ìsìn δῶρα àti θυσίαι
  choice: A pa “ẹ̀bùn” àti “ẹbọ” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ méjì ọ̀tọ̀.
  alternative: Kí a parapọ̀ wọn sí “ọrẹ ẹbọ” tàbí kí a ṣàlàyé wọn gẹ́gẹ́ bí fífi ara Kristi rú.
  rationale: Ẹsẹ̀ náà ń sọ ìlànà gbogbogbò nípa iṣẹ́ àlùfáà. Kíkọ́ ẹ̀kọ́ nípa ohun tí Kristi fi rú sínú rẹ̀ yóò kọjá ohun tí ẹsẹ̀ yìí fúnra rẹ̀ sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. “Àlùfáà àgbà” jẹ́ ọ̀rọ̀ tí ó mọ́gbọ́n dání fún ἀρχιερεύς, “rú” sì bá èdè ẹbọ mu. Àwọn àmì ohùn ni a fi síbi tí ó yẹ.
