revisions:
- from: Nítorí gbogbo àlùfáà àgbà ni a máa ń yàn láti fi ẹ̀bùn àti ẹbọ rú; nítorí náà, ó pọndandan kí ẹni yìí pẹ̀lú ní ohun kan tí yóò fi rú.[a]
  to: Nítorí a yan gbogbo àlùfáà àgbà láti rú ẹ̀bùn àti ẹbọ; nítorí náà, ó pọndandan kí ẹni yìí náà ní ohun kan láti fi rú.[a]
  rationale: A rọ́pò ìṣe ọjọ́ iwájú náà pẹ̀lú àkópọ̀ “ohun kan láti fi rú,” láti pa ìmọ̀lára ète/tí ó ṣeé ṣe nínú ὃ προσενέγκῃ mọ́. A tún mú ọ̀rọ̀ passive àti ìlò “also” di Yorùbá aládánidá síi, láìyí ìtumọ̀ tàbí ìtọ́ka ẹni náà padà.
