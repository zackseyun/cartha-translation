source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: yo
  text: Nítorí bí májẹ̀mú àkọ́kọ́ yẹn[a] bá jẹ́ aláìní àbùkù, a kì bá tí wá ààyè[b] fún èkejì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó jẹ́ ní tààrà pé, “èyí àkọ́kọ́ yẹn”; a mú “májẹ̀mú” wá láti inú àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àǹfààní” tàbí “ààyè” fún èkejì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” ń so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú gẹ́gẹ́ bí àlàyé, “bí” sì pa agbára ọ̀rọ̀ àdéhùn mọ́.
- source_word: ἡ πρώτη ἐκείνη
  choice: májẹ̀mú àkọ́kọ́ yẹn
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “èyí àkọ́kọ́ yẹn,” ṣùgbọ́n akọ abo rẹ̀ ń tọ́ka sí májẹ̀mú inú àyíká ọ̀rọ̀. Fífi “májẹ̀mú” kún un mú ìtumọ̀ náà ṣe kedere láìfi èrò tuntun kún ọrọ.
- source_word: ἦν ἄμεμπτος
  choice: bá jẹ́ aláìní àbùkù
  rationale: “Aláìní àbùkù” fi ìtumọ̀ ohun tí kò ní ìdí fún ẹ̀sùn tàbí àléébù hàn, láìṣàlàyé irú àbùkù náà kọjá ohun tí ẹsẹ sọ.
- source_word: οὐκ ἂν
  choice: a kì bá tí
  rationale: Àkójọpọ̀ yìí fi èsì ipò tí kò ṣẹlẹ̀ hàn ní Yorùbá, ó sì bá agbára ọ̀rọ̀ àdéhùn tí kò bá òtítọ́ mu nínú Gíríìkì mu.
- source_word: δευτέρας
  choice: fún èkejì
  rationale: A pa àkékúrú Gíríìkì mọ́; “èkejì” ń tọ́ka sí májẹ̀mú kejì tí àyíká ọ̀rọ̀ ti mú kedere.
- source_word: ἐζητεῖτο τόπος
  choice: wá ààyè
  rationale: “Wá ààyè” dúró sún mọ́ àwòrán Gíríìkì, ó sì lè túmọ̀ sí wíwá àǹfààní tàbí ìṣẹ̀lẹ̀ tí yóò mú kí èkejì dé.
theological_decisions:
- issue: Bóyá kí a sọ “májẹ̀mú” ní kedere bí ó tilẹ̀ jẹ́ pé a kò tún ọ̀rọ̀ náà sọ nínú Gíríìkì
  choice: májẹ̀mú àkọ́kọ́ yẹn
  alternative: èyí àkọ́kọ́ yẹn
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àfiwé májẹ̀mú àkọ́kọ́ àti èkejì ni. Sísọ “májẹ̀mú” ní kedere ń ràn òǹkàwé lọ́wọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ohun tí àbùkù májẹ̀mú àkọ́kọ́ túmọ̀ sí
  choice: aláìní àbùkù
  alternative: aláìlẹ́bi
  rationale: A kò ṣe àlàyé síwájú nípa bóyá àbùkù náà wà nínú májẹ̀mú fúnra rẹ̀, ìṣàkóso rẹ̀, tàbí àwọn ènìyàn. Èyí pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ fún àlàyé ẹsẹ tó tẹ̀ lé.
translation_notes:
  register: Èdè Yorùbá àpéjọ tó bójú mu, tó ní iyì, tó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó yẹ. Ìlànà “bí ... bá ... a kì bá tí ...” fi ipò àròsọ tí kò ṣẹlẹ̀ hàn lọ́nà àdánidá.
