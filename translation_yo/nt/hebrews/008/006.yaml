id: HEB.8.6
reference: Hebrews 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí, ó ti gba iṣẹ́ ìránṣẹ́ tó tayọ sí i, gẹ́gẹ́ bí òun náà ṣe jẹ́ alárinà májẹ̀mú tó dára sí i, èyí tí a ti gbé kalẹ̀ lórí àwọn ìlérí tó dára sí i.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ ìsìn tó ga sí i.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “májẹ̀mú” tàbí, ní àwọn àyíká kan, “ìwé ogún.” Níhìn-ín, “májẹ̀mú” bá ìlérí májẹ̀mú tuntun Jeremáyà tí a tọ́ka sí nínú àwọn ẹsẹ tó tẹ̀ lé mu.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “èyí tí a ti fìdí rẹ̀ múlẹ̀ lórí àwọn ìlérí tó dára sí i.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ṣíṣe òfin tàbí fífi májẹ̀mú kan sílẹ̀ ní ọ̀nà òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó pa ìtakora àti ìtọ́kasí sí ipò òde òní mọ́, ní ìyàtọ̀ sí àwọn àlùfáà ayé tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn.
- source_word: διαφορωτέρας ... λειτουργίας
  choice: iṣẹ́ ìránṣẹ́ tí ó tayọ jù
  rationale: ‘Tayọ jù’ fi ìfiwéra tó wà nínú διαφορωτέρας hàn, ‘iṣẹ́ ìránṣẹ́’ sì jẹ́ ọ̀rọ̀ àdánidá fún iṣẹ́ mímọ́ Kristi láìfi ‘ti àlùfáà’ kún ohun tí àyíká ọ̀rọ̀ ti sọ tẹ́lẹ̀.
- source_word: τέτυχεν
  choice: ó ti rí ... gbà
  rationale: Ìṣe aláṣepé Gíríìkì ń tọ́ka sí ohun tí ó ti gbà tí ó sì ṣì ní; ‘ti rí ... gbà’ sọ ìgbà àti ipò tó ń bá a lọ yìí ní Yorùbá àdánidá.
- source_word: ὅσῳ καὶ
  choice: níwọ̀n bí òun ti tún
  rationale: Ó so bí iṣẹ́ náà ṣe tayọ mọ́ bí májẹ̀mú tí Kristi ń ṣe alárinà rẹ̀ ṣe dára jù. Èdè yìí jẹ́ àdánidá, bí ó tilẹ̀ jẹ́ pé agbára ìfiwéra oníwọ̀n inú Gíríìkì lágbára díẹ̀ sí i.
- source_word: κρείττονός ... διαθήκης
  choice: májẹ̀mú tí ó dára jù
  rationale: ‘Dára jù’ pa ọ̀rọ̀ ìfiwéra pàtàkì κρείττων mọ́; ‘májẹ̀mú’ sì bá àyíká Jeremáyà àti májẹ̀mú tuntun mu.
- source_word: μεσίτης
  choice: alárinà
  rationale: Ó túmọ̀ sí ẹni tí ó dúró láàárín ẹgbẹ́ méjì láti mú ìbáṣepọ̀ májẹ̀mú ṣẹ; ó ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: lórí àwọn ìlérí tí ó dára jù
  rationale: ‘Lórí’ fi hàn pé àwọn ìlérí náà ni ìpìlẹ̀ májẹ̀mú náà, ó sì pa ọ̀pọ̀ nǹkan inú ἐπαγγελίαις mọ́.
- source_word: νενομοθέτηται
  choice: tí a ti gbé kalẹ̀
  rationale: Ó fi ìṣe tí a ti parí tí àbájáde rẹ̀ ṣì dúró hàn. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ òfin tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú Hébérù 8:6
  choice: májẹ̀mú
  alternative: ìwé ogún tàbí májẹ̀mú ogún
  rationale: Àríyànjiyàn Hébérù 8 ń tọ́ka tààrà sí ìlérí májẹ̀mú tuntun Jeremáyà àti iṣẹ́ alárinà. Nítorí náà, ‘májẹ̀mú’ ni ó bá àyíká yìí mu jù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwé ogún ní àwọn àyíká mìíràn.
- issue: Ìbáṣepọ̀ láàárín iṣẹ́ Kristi àti májẹ̀mú tó dára jù
  choice: níwọ̀n bí òun ti tún jẹ́ alárinà
  alternative: ní ìwọ̀n kan náà tí òun fi jẹ́ alárinà
  rationale: Àṣàyàn náà jẹ́ Yorùbá àdánidá, ó sì pa ìdí tí iṣẹ́ Kristi fi tayọ mọ́ láìsọ ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí orísun kò sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘òun’ láti tẹnumọ́ ẹni tí ó jẹ́ alárinà, a sì yàgò fún fífi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún ọ̀rọ̀ orísun.
