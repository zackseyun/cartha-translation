id: HEB.8.12
reference: Hebrews 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: yo
  text: Nítorí èmi yóò fi àánú hàn sí àìṣòdodo wọn,[a] èmi kì yóò sì rántí àwọn ẹ̀ṣẹ̀ wọn mọ́ rárá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àwọn ìwà àìtọ́ wọn” tàbí “sí àwọn ìwà ìwà-búburú wọn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àìṣòdodo ní gbogbogbò tàbí sí àwọn ìṣe àìtọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “èmi kì yóò rántí àwọn ẹ̀ṣẹ̀ wọn mọ́ rárá.” Ní àyíká májẹ̀mú, èyí jẹ́ ọ̀nà ọ̀rọ̀ fún ìdáríjì pípé àti pé a kì yóò ka ẹ̀ṣẹ̀ wọ́n sí wọn lọ́rùn mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń mú ìdí tàbí àlàyé tí ó tẹ̀ lé ìlérí májẹ̀mú ṣáájú wọlé; ‘Nítorí’ jẹ́ ọ̀nà àdánidá láti pa ipa ìṣàlàyé náà mọ́.
- source_word: ἵλεως ἔσομαι
  choice: èmi yóò ṣàánú
  rationale: ἵλεως sọ nípa inú rere àti àánú tí ń mú ìdáríjì wá. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì yẹ fún ọ̀rọ̀ májẹ̀mú láìlo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó le.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: sí àwọn àìṣòdodo wọn
  rationale: Dátífù náà bá ‘sí’ mu lẹ́yìn ‘ṣàánú.’ Ọ̀pọ̀ ἀδικίαις lè tọ́ka sí ìwà tàbí iṣẹ́ àìtọ́ kan-kọ̀ọ̀kan; ‘àwọn àìṣòdodo wọn’ pa ọ̀pọ̀ àti àìdánilójú yẹn mọ́ láìfi ‘ìṣe’ kún Gíríìkì.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: àwọn ẹ̀ṣẹ̀ wọn
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédéé fún ọ̀pọ̀ ἁμαρτιῶν ni ‘àwọn ẹ̀ṣẹ̀.’
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: èmi kì yóò rántí ... mọ́ láéláé
  rationale: οὐ μή pẹ̀lú subjunctive jẹ́ ìkọ̀ tó lágbára, ἔτι sì túmọ̀ sí ‘mọ́’ nínú àyíká yìí. ‘Kì yóò ... mọ́ láéláé’ fi ìtẹnumọ́ náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ pé Ọlọ́run kì yóò rántí ẹ̀ṣẹ̀ mọ́
  choice: Pa àkàwé májẹ̀mú náà mọ́ gẹ́gẹ́ bí ìdáríjì pípé, láìṣàlàyé rẹ̀ sínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé Ọlọ́run kò ní mọ ẹ̀ṣẹ̀ náà mọ́ rárá.
  rationale: Ní àyíká májẹ̀mú, àìrántí ẹ̀ṣẹ̀ ń sọ pé Ọlọ́run kò ní ka wọ́n sí wọn lọ́rùn mọ́. Síbẹ̀, ìtumọ̀ náà pa ọ̀rọ̀ Bíbélì mọ́, àlàyé ìsìn sì wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àtúnsọ àti ìtẹnumọ́ Gíríìkì mọ́ ní ọ̀nà àdánidá.
