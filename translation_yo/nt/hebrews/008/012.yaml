revisions:
- from: Nítorí èmi yóò ṣàánú sí àwọn àìṣòdodo wọn,[a] èmi kì yóò sì rántí àwọn ẹ̀ṣẹ̀ wọn mọ́ láéláé.[b]
  to: Nítorí èmi yóò fi àánú hàn sí àìṣòdodo wọn,[a] èmi kì yóò sì rántí àwọn ẹ̀ṣẹ̀ wọn mọ́ rárá.[b]
  rationale: The revision preserves the Greek structure and emphasis while using idiomatic modern Standard Yorùbá. It retains the distinction between ἀδικίαις and ἁμαρτιῶν, represents the emphatic οὐ μὴ … ἔτι naturally, and narrows the notes to lexical and covenantal-idiomatic clarification.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:30:10Z'
review_pass:
  verdict: revise
  source_fidelity: The main sense is retained, including the future mercy, the wrongdoing/sins distinction, and the emphatic future non-remembrance. However, “ṣàánú sí àwọn àìṣòdodo wọn” is not idiomatic Yoruba usage and treats an abstract plural awkwardly. “mọ́ láéláé” is also needlessly repetitive for οὐ μὴ … ἔτι.
  naturalness: Use the natural idiom “fi àánú hàn sí” and render the abstract plural ἀδικίαις as “àìṣòdodo wọn.” “Kì yóò … mọ́ rárá” gives a clear, idiomatic emphatic negation without overtranslation.
  terminology: “Àìṣòdodo” appropriately represents ἀδικία, while “ẹ̀ṣẹ̀” accurately represents ἁμαρτία. The covenantal explanation in the second note should avoid asserting more than the idiom itself requires and should not frame divine knowledge in speculative terms.
  issues:
  - severity: medium
    issue: The expression “ṣàánú sí àwọn àìṣòdodo wọn” is syntactically and idiomatically strained.
    rationale: Yorùbá normally uses “ṣàánú” directly with a person or uses “fi àánú hàn sí” for mercy toward a matter/person. The latter preserves the Greek dative relation naturally.
  - severity: low
    issue: “mọ́ láéláé” overstates the wording through redundant duration terms.
    rationale: The emphatic οὐ μή plus ἔτι is well represented by “kì yóò … mọ́ rárá”; adding both “mọ́” and “láéláé” is heavier than necessary.
  - severity: low
    issue: Footnote a’s alternatives are cumbersome and one is unnatural (“ìwà àìṣèdájọ́ òdodo”).
    rationale: The note should state viable lexical alternatives plainly, without turning abstract wrongdoing into an awkward repeated expression.
  - severity: medium
    issue: Footnote b includes an unnecessarily doctrinally framed statement about what God can know.
    rationale: The note may identify the covenantal-forgiveness idiom while avoiding a speculative claim about divine cognitive capacity.
  revised_text: Nítorí èmi yóò fi àánú hàn sí àìṣòdodo wọn,[a] èmi kì yóò sì rántí àwọn ẹ̀ṣẹ̀ wọn mọ́ rárá.[b]
