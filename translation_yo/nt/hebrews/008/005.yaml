reference: Hebrews 8:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: yo
  text: Àwọn náà ń ṣe iṣẹ́ ìsìn ní ibi tí ó jẹ́ àwòrán àti òjìji àwọn ohun ti ọ̀run, gẹ́gẹ́ bí Ọlọ́run ti fún Mósè ní ìtọ́nisọ́nà[a] nígbà tí ó fẹ́ ṣe àgọ́ ìjọsìn náà[b]. Nítorí Ọlọ́run wí pé, “Kíyè sí i pé kí o ṣe ohun gbogbo ní ìbámu pẹ̀lú àpẹẹrẹ tí a fi hàn ọ lórí òkè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run ti kìlọ̀ fún Mósè”; ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ ìkìlọ̀ tàbí ìtọ́nisọ́nà láti ọ̀dọ̀ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ó fẹ́ parí àgọ́ ìjọsìn náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣíṣe ohun kan tàbí mímú iṣẹ́ náà dé òpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn wọ̀nyí
  rationale: Ó tọ́ka sí àwọn àlùfáà tí ẹsẹ tó ṣáájú mẹ́nu kàn, ó sì mú ìtẹ̀sí àpèjúwe ọ̀rọ̀ Gíríìkì náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: nínú ohun tí ó jẹ́ àwòrán àti òjìji
  rationale: “Àwòrán” fi ìbámu ohun ayé pẹ̀lú ti ọ̀run hàn, “òjìji” sì pa àkàwé inú Hébérù mọ́ láì sọ pé ohun náà jẹ́ àmì lásán.
- source_word: λατρεύουσιν
  choice: ń ṣe iṣẹ́ ìsìn
  rationale: Ó túmọ̀ sí iṣẹ́ mímọ́ tàbí iṣẹ́ ìjọsìn; gbólóhùn yìí ṣe kedere ní àyíká iṣẹ́ àwọn àlùfáà.
- source_word: τῶν ἐπουρανίων
  choice: àwọn ohun ti ọ̀run
  rationale: Ó pa ìtọ́kasí náà mọ́ ní fífẹ̀, láì dín in kù sí ibi kan ṣoṣo tàbí túmọ̀ rẹ̀ sí èrò ẹ̀kọ́ kan pàtó.
- source_word: κεχρημάτισται
  choice: Ọlọ́run ti fún Mose ní ìtọ́nisọ́nà
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí ìsọfúnni láti ọ̀dọ̀ Ọlọ́run; ìtumọ̀ yìí pa orísun àtọ̀runwá àti agbára àṣẹ rẹ̀ mọ́.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: nígbà tí ó fẹ́ ṣe àgọ́ ìjọsìn náà
  rationale: “Fẹ́” sọ ìṣe tí ó ń bọ̀ di Yorùbá àdánidá; “ṣe” lè gba ìtumọ̀ kíkọ́ tàbí mímú iṣẹ́ náà dé òpin, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ fífẹ̀.
- source_word: Ὅρα
  choice: Kíyè sí i
  rationale: Ó fi agbára àṣẹ àti ìkìlọ̀ inú ọ̀rọ̀ náà hàn ju ìtumọ̀ ojúlówó “wo” lọ.
- source_word: ποιήσεις πάντα κατὰ τὸν τύπον
  choice: kí o ṣe ohun gbogbo ní ìbámu pẹ̀lú àpẹẹrẹ
  rationale: Fíúṣọ̀ Gíríìkì ní agbára àṣẹ níbi yìí; “kí o ṣe” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ náà, “àpẹẹrẹ” sì bá τύπος mu.
theological_decisions:
- issue: Ìbáṣepọ̀ ibi ìjọsìn ayé pẹ̀lú àwọn ohun ti ọ̀run
  choice: àwòrán àti òjìji àwọn ohun ti ọ̀run
  alternative: àpẹẹrẹ àti òjìji àwọn ohun gidi ti ọ̀run
  rationale: Ìtumọ̀ yìí fi hàn pé ohun ayé bá ti ọ̀run mu ṣùgbọ́n kò tóbi tàbí pé bí ti ọ̀run, láì sọ ọ́ di àmì asán tàbí fi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Agbára κεχρημάτισται
  choice: Ọlọ́run ti fún Mose ní ìtọ́nisọ́nà
  alternative: Ọlọ́run ti kìlọ̀ fún Mose
  rationale: Àṣàyàn àkọ́kọ́ pa ìsọfúnni àtọ̀runwá àti ìdarí mọ́; àṣàyàn kejì ṣeé ṣe nítorí agbára ìkìlọ̀ inú “Kíyè sí i,” nítorí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa aláwọ̀ ohùn ni a lò, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. “Àgọ́ ìjọsìn” ṣe kedere ju “àgọ́” lásán lọ fún ibi mímọ́ Mose, “iṣẹ́ ìsìn” sì mú àyíká iṣẹ́ àlùfáà hàn. A tún gbe àmì àlàyé [a] àti [b] síbi ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
