  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: iṣẹ́ àwọn àlùfáà jẹ́ ti ohun tí ó bá àwọn ohun ọ̀run mu, Mósè gba ìtọ́nisọ́nà àtọ̀runwá, a sì pa àṣẹ láti tẹ̀lé àpẹẹrẹ òkè mọ́. Ṣùgbọ́n “nínú ohun tí ó jẹ́” kò fi ibi/ohun tí iṣẹ́ ìsìn náà ti ń ṣẹlẹ̀ hàn dáadáa, àti “ó wí pé” lè tọ́ka sí Mósè nínú Yorùbá, níbi tí ọ̀rọ̀ àyíká fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ó sọ àṣẹ náà.'
  naturalness: “Àwọn náà ń ṣe iṣẹ́ ìsìn ní ibi tí ó jẹ́ àwòrán àti òjìji ...” jẹ́ Yorùbá àdánidá, ó sì mú ìbáṣepọ̀ iṣẹ́ ìsìn àti ibi mímọ́ ayé hàn kedere. “Ọlọ́run wí pé” tún yọ àìdánilójú aṣojú-ọrọ̀ kúrò. A tún ṣe orúkọ náà sí Mósè.
