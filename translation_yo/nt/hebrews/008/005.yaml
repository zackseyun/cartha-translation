  to: Àwọn náà ń ṣe iṣẹ́ ìsìn ní ibi tí ó jẹ́ àwòrán àti òjìji àwọn ohun ti ọ̀run, gẹ́gẹ́ bí Ọlọ́run ti fún Mósè ní ìtọ́nisọ́nà[a] nígbà tí ó fẹ́ ṣe àgọ́ ìjọsìn náà[b]. Nítorí Ọlọ́run wí pé, “Kíyè sí i pé kí o ṣe ohun gbogbo ní ìbámu pẹ̀lú àpẹẹrẹ tí a fi hàn ọ lórí òkè.”
