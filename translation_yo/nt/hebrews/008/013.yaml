  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò gírámà Gíríìkì dáadáa: ‘tuntun’ jẹ́ ọ̀rọ̀ ajẹtífù alákòókàn, ‘èyí àkọ́kọ́’ ń tọ́ka sí májẹ̀mú àkọ́kọ́, àwọn participle méjèèjì sì ń ṣàfihàn ìlànà tí ń lọ. Ṣùgbọ́n ‘ti sún mọ́’ lè mú kí ἐγγύς dà bí ìṣe tí ó ti parí; gbolohun orísun sọ ipò ìsúnmọ́ ní àkókò ìsinsìnyí. ‘Di ti àtijọ́’ tún mú ipa πεπαλαίωκεν hàn dáadáa ju ‘di ohun tí ó ti gbó’ lọ, láìdín àwòrán ìdarúgbó nínú apá kejì kù.'
  naturalness: ‘Ohun tí ó ń di ti àtijọ́, tí ó sì ń darúgbó, sún mọ́ píparẹ́’ jẹ́ ìṣọ̀kan Yorùbá boṣewa tí ó rọrùn, ó sì yà ìṣe tí ó ti ṣẹlẹ̀ (‘ó ti sọ’) sọ́tọ̀ kúrò nínú ipò ìsinsìnyí (‘sún mọ́’).
  terminology: ‘Májẹ̀mú tuntun’ nínú àlàyé ìsàlẹ̀ ẹsẹ̀ jẹ́ ìlò ọ̀rọ̀ tó pé. A yẹ kí àmì àlàyé tó ṣàlàyé ‘tuntun’ wà lẹ́gbẹ̀ẹ́ ‘tuntun,’ kì í ṣe lẹ́yìn ‘èyí àkọ́kọ́’; bẹ́ẹ̀ ni àmì yíyàn ìtumọ̀ fún ἐν τῷ λέγειν yẹ kí ó wà lẹ́gbẹ̀ẹ́ ‘sísọ.’
