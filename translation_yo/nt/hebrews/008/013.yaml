revisions:
- from: Nípa sísọ pé, “tuntun,”[a] ó ti sọ èyí àkọ́kọ́ di ohun tí ó ti gbó.[b] Ohun tí ó sì ń di ohun tí ó ti gbó, tí ó sì ń darúgbó, ti sún mọ́ píparẹ́.[c]
  to: Nípa sísọ[a] pé, “tuntun,”[b] ó ti sọ èyí àkọ́kọ́ di ti àtijọ́. Ohun tí ó ń di ti àtijọ́, tí ó sì ń darúgbó, sún mọ́ píparẹ́.[c]
  rationale: Àtúnṣe náà ṣètò àwọn àmì àlàyé sí ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé, ó yọ àmì perfect tí kò sí nínú ἐγγύς kúrò, ó sì lo ‘di ti àtijọ́’ láti ṣàfihàn pé a ti sọ ‘èyí àkọ́kọ́’ di ohun tí a ti kọjá. Ó pa ìfarahàn ‘tuntun’ nìkan, kókó-ọrọ̀ tí a kò sọ ní pàtó, àti àwòrán ‘di ti àtijọ́/darúgbó’ mọ́.
