id: HEB.8.13
reference: Hebrews 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: yo
  text: Nípa sísọ[a] pé, “tuntun,”[b] ó ti sọ èyí àkọ́kọ́ di ti àtijọ́. Ohun tí ó ń di ti àtijọ́, tí ó sì ń darúgbó, sún mọ́ píparẹ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Nígbà tí ó sọ pé” tàbí “Nínú sísọ pé.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì sọ “tuntun” nìkan; ó ń tọ́ka ní ṣókí sí “májẹ̀mú tuntun” nínú àyọlò Jeremáyà 31:31 tó ṣáájú.
    reason: cross_reference
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “sún mọ́ pípòórá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Nípa sísọ pé
  rationale: Gbólóhùn yìí lè fi ipò tàbí ọ̀nà hàn; “Nípa sísọ pé” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ ọ̀nà mọ́.
- source_word: Καινὴν
  choice: “tuntun”
  rationale: Ọ̀rọ̀ ajẹtífù nìkan ni Gíríìkì lò, ó ń tọ́ka sí “májẹ̀mú tuntun” nínú àyọlò tó ṣáájú; fífi “tuntun” nìkan sílẹ̀ pa àkótán ọ̀rọ̀ orísun mọ́.
- source_word: πεπαλαίωκεν
  choice: ó ti sọ ... di ohun tí ó ti gbó
  rationale: Àkókò perfect fi ìṣe tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì wà nísinsìnyí hàn. Ọ̀rọ̀ yìí túmọ̀ sí pé ohun náà ti di ti àtijọ́ tàbí kò yẹ fún lílò mọ́, láìfi ẹ̀kọ́ míì kún un.
- source_word: τὴν πρώτην
  choice: èyí àkọ́kọ́
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí májẹ̀mú àkọ́kọ́ láti inú ọ̀rọ̀ tó yí i ká; a kò fi “májẹ̀mú” kún ẹsẹ yìí nítorí kò sí nínú Gíríìkì rẹ̀.
- source_word: τὸ ... παλαιούμενον
  choice: Ohun tí ó ... ń di ohun tí ó ti gbó
  rationale: Present participle fi ìlànà tí ń lọ lọ́wọ́ hàn, kì í ṣe ipò tí ó ti parí nìkan.
- source_word: γηράσκον
  choice: ń darúgbó
  rationale: Ó pa àwòrán ohun tí ọjọ́ ń wọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: ἐγγὺς
  choice: ti sún mọ́
  rationale: Ó sọ ìsúnmọ́ iṣẹlẹ̀ kan ní ọ̀nà Yorùbá àdánidá.
- source_word: ἀφανισμοῦ
  choice: píparẹ́
  rationale: Ó mú ìtumọ̀ ohun tí yóò pòórá tàbí tí a kò ní rí mọ́ jáde, láìyan “ìparun” tí ó lè lágbára ju ọ̀rọ̀ orísun lọ.
theological_decisions:
- issue: Ẹni tí ó sọ pé “tuntun”
  choice: A lo arọ́pò-orúkọ “ó” láìsọ ní pàtó pé Ọlọ́run tàbí Ìwé Mímọ́.
  alternative: “Ọlọ́run” tàbí “Ìwé Mímọ́”
  rationale: Kókó-ọrọ̀ náà farapamọ́ nínú Gíríìkì, ó sì tọ́ka padà sí ẹni tó ń sọ̀rọ̀ nínú àyọlò Jeremáyà; yíyan ẹni kan ní pàtó yóò tú àìṣedéédé tó wà nínú orísun.
- issue: Ipò májẹ̀mú àkọ́kọ́
  choice: “ó ti sọ èyí àkọ́kọ́ di ohun tí ó ti gbó”
  alternative: “ó ti sọ èyí àkọ́kọ́ di ohun tí kò wúlò mọ́”
  rationale: “Ohun tí ó ti gbó” pa àsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú “ń darúgbó” nínú apá kejì, ó sì yẹra fún mímú ìtumọ̀ náà kọjá ohun tí òǹkọ̀wé sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A pa ìtẹ̀síwájú àwòrán “gbó/darúgbó” mọ́, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
