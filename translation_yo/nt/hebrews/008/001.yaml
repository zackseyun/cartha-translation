    text: Tàbí, “Àkópọ̀,” tàbí “kókó pàtàkì,” nínú ohun tí a ń sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọ̀run”; èdè Gíríìkì ní, “ní àwọn ọ̀run.”
    reason: lexical_alternative
  revision_rationale: 'The revision makes two safe, source-based improvements: it renders κεφάλαιον with the explicit main-point sense and replaces the potentially broader “Àlùfáà Àgbà” with “Olórí Àlùfáà,” which more precisely denotes ἀρχιερεύς. It preserves the source’s indirect designation for God, the completed seating action, the right-hand/throne imagery, and the plural “heavens.” Footnote anchors remain attached to the relevant translated expressions.'
