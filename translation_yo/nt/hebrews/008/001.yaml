id: HEB.8.1
reference: Hebrews 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: yo
  text: 'Kókó pàtàkì[a] nínú ohun tí a ń sọ ni èyí: a ní irú Olórí Àlùfáà bẹ́ẹ̀, ẹni tí ó jókòó ní ọwọ́ ọ̀tún ìtẹ́ Ọláńlá ní àwọn ọ̀run[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àkópọ̀,” tàbí “kókó pàtàkì,” nínú ohun tí a ń sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọ̀run”; èdè Gíríìkì ní, “ní àwọn ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Kókó
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí kókó pàtàkì tàbí àkópọ̀ ohun tí a ń jíròrò, kì í ṣe ‘orí’ tàbí ‘orí ìwé’ ní ìtumọ̀ gangan.
- source_word: δὲ
  choice: A kò fi ọ̀rọ̀ ọ̀tọ̀ túmọ̀ rẹ̀
  rationale: Ó ń ṣe iṣẹ́ ìyípadà díẹ̀ nínú ìjíròrò, kì í ṣe ìtakora líle. Ìṣètò gbólóhùn Yorùbá fúnra rẹ̀ ti fi ìyípadà náà hàn láìfi ‘nísinsin yìí’ kún un.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: ohun tí a ń sọ
  rationale: Ó pa ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: τοιοῦτον
  choice: irú ... bẹ́ẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí irú Àlùfáà Àgbà tí a ti ṣàpèjúwe ṣáájú; àkójọpọ̀ ‘irú ... bẹ́ẹ̀’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἔχομεν
  choice: a ní
  rationale: Ó sọ ìní ní ọ̀nà tààrà, kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: ἀρχιερέα
  choice: Àlùfáà Àgbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún ipò àlùfáà gíga jù lọ nínú ètò ìsìn tí Hébérù ń tọ́ka sí.
- source_word: ἐκάθισεν
  choice: ó jókòó
  rationale: Ó fi ìṣe tí ó ṣẹlẹ̀ tán hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: ἐν δεξιᾷ
  choice: ní ọwọ́ ọ̀tún
  rationale: Ó pa àwòrán inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, èyí tí ó ń tọ́ka sí ipò ọlá àti àṣẹ.
- source_word: τοῦ θρόνου
  choice: ìtẹ́
  rationale: Ó pa àwòrán ìjọba àti ipò ọba mọ́ ní ọ̀nà tààrà.
- source_word: τῆς μεγαλωσύνης
  choice: Ọláńlá
  rationale: A lò ó gẹ́gẹ́ bí orúkọ ọlá tí ń tọ́ka sí Ọlọ́run lọ́nà àfiṣe, bí ọ̀rọ̀ Gíríìkì ṣe ṣe, láìrọ́pò rẹ̀ pẹ̀lú ‘Ọlọ́run.’
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì ṣì yé òǹkàwé Yorùbá.
theological_decisions:
- issue: Bóyá kí a sọ ẹni tí ‘Ọláńlá’ ń tọ́ka sí ní tààrà gẹ́gẹ́ bí Ọlọ́run
  choice: A pa orúkọ ọlá àfiṣe ‘Ọláńlá’ mọ́.
  alternative: ìtẹ́ Ọlọ́run; ìtẹ́ Ẹni Ọláńlá
  rationale: Ọ̀rọ̀ Gíríìkì kò lo θεός ní tààrà. Yíyan ‘Ọláńlá’ pa ìgbéga àti àfiṣe inú ọ̀rọ̀ náà mọ́ láìmú ohun tí ó farasin hàn ju bí orísun ṣe ṣe lọ.
- issue: Bóyá kí ἐκάθισεν ṣàlàyé ìparí iṣẹ́ àlùfáà Kristi ní kíkún
  choice: ó jókòó
  alternative: ó gba ìjókòó rẹ̀ lẹ́yìn tí ó parí iṣẹ́ rẹ̀
  rationale: Àyíká Hébérù lè mú ìtumọ̀ iṣẹ́ tí a parí jáde, ṣùgbọ́n ẹsẹ yìí kò sọ àlàyé gígùn náà ní tààrà; a kò fi ẹ̀kọ́ àfikún sínú ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ó sì ní ìwọ̀ntúnwọ̀nsì àti ọlá tó bá lẹ́tà sí àwọn Hébérù mu. A yàgò fún ọ̀rọ̀ àtijọ́ tí kò rọrùn fún òǹkàwé òde òní, ṣùgbọ́n a pa àwọn àwòrán ‘ọwọ́ ọ̀tún,’ ‘ìtẹ́,’ àti ‘àwọn ọ̀run’ mọ́.
