revisions:
- from: 'Kókó[a] ohun tí a ń sọ ni èyí: a ní irú Àlùfáà Àgbà bẹ́ẹ̀, ẹni tí ó jókòó ní ọwọ́ ọ̀tún ìtẹ́ Ọláńlá ní àwọn ọ̀run[b],'
  to: 'Kókó pàtàkì[a] nínú ohun tí a ń sọ ni èyí: a ní irú Olórí Àlùfáà bẹ́ẹ̀, ẹni tí ó jókòó ní ọwọ́ ọ̀tún ìtẹ́ Ọláńlá ní àwọn ọ̀run[b],'
  rationale: 'The revision makes two safe, source-based improvements: it renders κεφάλαιον with the explicit main-point sense and replaces the potentially broader “Àlùfáà Àgbà” with “Olórí Àlùfáà,” which more precisely denotes ἀρχιερεύς. It preserves the source’s indirect designation for God, the completed seating action, the right-hand/throne imagery, and the plural “heavens.” Footnote anchors remain attached to the relevant translated expressions.'
  reviewer_model: gpt-5.6-terra
