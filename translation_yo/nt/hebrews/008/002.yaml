id: HEB.8.2
reference: Hebrews 8:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: yo
  text: ẹni tí ń ṣe iṣẹ́ ìsìn ní àwọn ibi mímọ́[a] àti ní àgọ́ ìjọsìn tòótọ́ náà, èyí tí Olúwa, kì í ṣe ènìyàn, gbé kalẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi mímọ́”; gbólóhùn Gíríìkì náà lè tọ́ka sí ibi ìjọsìn náà gẹ́gẹ́ bí odindi kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nà sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: àwọn ibi mímọ́
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù ọ̀pọ̀ tí a lò bí orúkọ. Nínú ọ̀rọ̀ nípa iṣẹ́ àlùfáà nínú Hébérù, ó tọ́ka sí àwọn ibi mímọ́ inú ibi ìjọsìn, kì í ṣe sí àwọn ènìyàn mímọ́.
- source_word: λειτουργὸς
  choice: ẹni tí ń ṣe iṣẹ́ ìsìn
  rationale: Èyí sọ iṣẹ́ ìránṣẹ́ ẹ̀sìn àti ti àlùfáà jáde ní Yorùbá àdánidá, láì sọ ọ́ di ìránṣẹ́ lásán tàbí lo ọ̀rọ̀ àjèjì.
- source_word: σκηνῆς
  choice: àgọ́ ìjọsìn
  rationale: “Àgọ́ ìjọsìn” mú ìtumọ̀ àgọ́ Mose àti àwòrán ibi ìjọsìn ti ọ̀run wá sí ọkàn, ó sì ṣe kedere ju “àgọ́” lásán lọ.
- source_word: ἀληθινῆς
  choice: tòótọ́
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ojúlówó ibi ìjọsìn ti ọ̀run àti àwòrán rẹ̀ ti ayé mọ́, láì fi àlàyé míì kún un.
- source_word: ἔπηξεν
  choice: gbé kalẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a dá àgọ́ tàbí ohun kan dúró, ó sì pa àwòrán ìkọ́lé àgọ́ mọ́.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níbi yìí, ó sì fi ẹni tó ṣe iṣẹ́ náà hàn kedere.
- source_word: οὐκ ἄνθρωπος
  choice: tí kì í ṣe ènìyàn
  rationale: Ó pa ìtakora ṣókí mọ́ pé Olúwa, kì í ṣe ẹ̀dá ènìyàn, ló gbé àgọ́ náà kalẹ̀; “ènìyàn” sì ní agbára àpapọ̀ tí ἄνθρωπος ní.
theological_decisions:
- issue: Ohun tí “τῶν ἁγίων” ń tọ́ka sí àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ibi ìjọsìn ti ọ̀run
  choice: Àwọn ibi mímọ́ inú ibi ìjọsìn, ní pàtàkì nínú ètò iṣẹ́ àlùfáà ti ọ̀run
  alternative: Àwọn ènìyàn mímọ́
  rationale: Hébérù 8:1-5 ń sọ nípa iṣẹ́ Àlùfáà Àgbà ti Mèsáyà ní ibi ìjọsìn ti ọ̀run. “Àwọn ibi mímọ́” pa èdè àgọ́ àti tẹ́ńpìlì mọ́, láì yí ọ̀rọ̀ náà sí iṣẹ́ fún àwọn ènìyàn mímọ́.
- issue: Agbára àpapọ̀ ti ἄνθρωπος
  choice: ènìyàn, gẹ́gẹ́ bí ẹ̀dá ènìyàn ní ìtakora sí Olúwa
  alternative: ọkùnrin kan
  rationale: Ìtakora náà wà láàárín ohun tí Olúwa ṣe àti ohun tí ẹ̀dá ènìyàn ṣe, kì í ṣe láàárín Olúwa àti ọkùnrin kan pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, pẹ̀lú àmì ohùn ní kíkún. “Iṣẹ́ ìsìn” àti “àgọ́ ìjọsìn” jẹ́ èdè tí òǹkàwé lasán lè lóye, tí ó sì pa àyíká iṣẹ́ àlùfáà mọ́. Ẹsẹ̀ náà jẹ́ àfikún sí gbólóhùn ẹsẹ̀ tó ṣáájú, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú “ẹni tí.”
