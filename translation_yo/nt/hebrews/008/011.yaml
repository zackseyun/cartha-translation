id: HEB.8.11
reference: Hebrews 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: yo
  text: Ẹnì kọ̀ọ̀kan kì yóò kọ́ ọmọ ìlú ẹlẹgbẹ́ rẹ̀ tàbí arákùnrin rẹ̀ rárá, nípa sísọ pé, “Mọ Olúwa,” nítorí gbogbo wọn ni yóò mọ̀ mí, láti ẹni tí ó kéré jù lọ nínú wọn títí dé ẹni tí ó tóbi jù lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: kì yóò ... kọ́ ... rárá
  rationale: Àpapọ̀ ọ̀rọ̀ ìkọ̀ οὐ μή pẹ̀lú aorist subjunctive jẹ́ ìkọ̀ tí ó lágbára. Fífi “rárá” kún “kì yóò” mú agbára náà hàn ní Yorùbá àdánidá.
- source_word: ἕκαστος
  choice: ẹnì kọ̀ọ̀kan
  rationale: Ó pa ìtumọ̀ pípín-kálẹ̀ mọ́, ó sì fi hàn pé ẹnì kọ̀ọ̀kan nínú àwùjọ májẹ̀mú ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: πολίτην
  choice: ọmọ ìlú ẹlẹgbẹ́ rẹ̀
  rationale: πολίτης túmọ̀ sí ẹni tí wọ́n jọ jẹ́ ọmọ ìlú kan. Yíyan ọ̀rọ̀ yìí tẹ̀ lé ẹ̀rí Gíríìkì Hébérù dípò kí a rọ́pò rẹ̀ pẹ̀lú ọ̀rọ̀ inú Jeremáyà tí a sábà ń túmọ̀ sí “aládùúgbò.”
- source_word: ἀδελφόν
  choice: arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ẹyọ, “arákùnrin” sì pa ìrísí ìbátan ẹbí inú ẹsẹ náà mọ́.
- source_word: Γνῶθι
  choice: Mọ
  rationale: Aorist imperative yìí jẹ́ àṣẹ tààrà; “Mọ Olúwa” jẹ́ ọ̀rọ̀ Yorùbá ṣókí tí ó bá ìtumọ̀ rẹ̀ mu.
- source_word: κύριον
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, ó sì bá àyíká májẹ̀mú inú àyọlò Jeremáyà mu.
- source_word: πάντες εἰδήσουσίν με
  choice: gbogbo wọn ni yóò mọ̀ mí
  rationale: Ó pa πάντες àti ọ̀rọ̀-arọ́pò-orúkọ με mọ́, ìgbékalẹ̀ “ni” sì tẹnu mọ́ pé gbogbo wọn lápapọ̀ ni.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: láti ẹni tí ó kéré jù lọ nínú wọn títí dé ẹni tí ó tóbi jù lọ
  rationale: Ọ̀rọ̀ yìí fi gbogbo ìpele àwọn ènìyàn inú ẹgbẹ́ náà hàn, láì fi ìtumọ̀ rẹ̀ mọ́ ọjọ́-orí tàbí ipò nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πολίτην nínú àyọlò tí ó tọ́ka sí Jeremáyà 31:34
  choice: ọmọ ìlú ẹlẹgbẹ́ rẹ̀
  alternative: aládùúgbò rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ìtumọ̀ máa ń lo “aládùúgbò” nítorí Jeremáyà, ẹ̀dà Gíríìkì Hébérù ní πολίτην, ìyẹn ẹni tí wọ́n jọ jẹ́ ọmọ ìlú. Nítorí náà, ọ̀rọ̀ inú Gíríìkì ni ọ̀rọ̀ pàtàkì tẹ̀ lé, a sì fi èkejì sínú àlàyé ìsàlẹ̀.
- issue: Èdè akọ inú ἀδελφόν
  choice: arákùnrin
  alternative: arákùnrin tàbí arábìnrin
  rationale: Ọ̀rọ̀ orísun jẹ́ akọ ní ẹyọ. “Arákùnrin” pa ìrísí rẹ̀ àti èdè ìbátan ẹbí inú májẹ̀mú mọ́, láì sẹ pé ìlérí náà kan gbogbo àwùjọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó ṣe kedere fún òǹkàwé gbogbo. Àmì ohùn kún un níbi tí ó bá yẹ. Ìgbékalẹ̀ méjì “ẹnì kọ̀ọ̀kan” pa àtúnṣe ìṣọ̀kan Gíríìkì mọ́, “rárá” sì mú ìkọ̀ líle οὐ μή hàn.
