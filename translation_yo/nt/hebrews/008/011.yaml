  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ èrò Gíríìkì mọ́ dáadáa: ìkọ̀ líle οὐ μή, ìtumọ̀ pínpín ti ἕκαστος, πολίτην gẹ́gẹ́ bí ẹni tí wọ́n jọ jẹ́ ọmọ ìlú, arákùnrin, àṣẹ náà “Mọ Olúwa,” àti ìwọ̀n gbogbo ènìyàn láti kékeré dé títóbi. Síbẹ̀, ipò “rárá” nínú àkọ́kọ́ lè dà bí ẹni pé ó kan ọ̀rọ̀ àṣẹ tí a ń sọ (“Mọ Olúwa”) dípò ìkọ̀ ìṣe ìkọ́ni. Àtúnṣe náà mú kí ìkọ̀ líle náà kan gbogbo gbolohun náà ní kedere.'
