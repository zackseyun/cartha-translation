revisions:
- from: Ẹnì kọ̀ọ̀kan wọn kì yóò sì kọ́ ọmọ ìlú ẹlẹgbẹ́ rẹ̀[a], bẹ́ẹ̀ ni ẹnì kọ̀ọ̀kan kì yóò kọ́ arákùnrin rẹ̀ pé, “Mọ Olúwa,” rárá; nítorí gbogbo wọn ni yóò mọ̀ mí, láti ẹni tí ó kéré jù lọ nínú wọn títí dé ẹni tí ó tóbi jù lọ.
  to: Ẹnì kọ̀ọ̀kan kì yóò kọ́ ọmọ ìlú ẹlẹgbẹ́ rẹ̀ tàbí arákùnrin rẹ̀ rárá, nípa sísọ pé, “Mọ Olúwa,” nítorí gbogbo wọn ni yóò mọ̀ mí, láti ẹni tí ó kéré jù lọ nínú wọn títí dé ẹni tí ó tóbi jù lọ.
  rationale: A ṣàtúnṣe gbolohun náà nìkan láti jẹ́ kí ìkọ̀ líle οὐ μή hàn ní ibi tí kò lè dà rú, láì yí ìtumọ̀ rẹ̀ padà. A darapọ̀ àwọn apá méjèèjì tí ἕκαστος ń ṣàkóso pẹ̀lú “tàbí,” tí Yorùbá sì ló láti ṣàfihàn pé kò sí ẹni kankan tí yóò kọ́ ẹnikẹ́ni nínú àwọn ẹgbẹ́ méjèèjì náà. A tún ṣàlàyé àlàyé ìsàlẹ̀ kí ìtọ́kasí sí Gíríìkì ìwé Hébérù le kedere.
