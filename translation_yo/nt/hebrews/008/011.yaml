  terminology: “Olúwa” yẹ fún κύριον, “arákùnrin” ń pa akọ-ẹyọ ἀδελφόν mọ́, àti “ọmọ ìlú ẹlẹgbẹ́ rẹ̀” ń fi ìyàtọ̀ πολίτην sí “aládùúgbò” hàn. Àlàyé ìsàlẹ̀ yẹ kí ó sọ ní kedere pé Gíríìkì ìwé Hébérù ni a ń tọ́ka sí.
