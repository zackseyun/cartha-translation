  to: Bí ó bá wà lórí ilẹ̀ ayé, kì bá tilẹ̀ jẹ́ àlùfáà, níwọ̀n bí àwọn tí ń fi àwọn ẹ̀bùn[a] rú ẹbọ gẹ́gẹ́ bí òfin wà.
  rationale: A yọ “Nítorí náà, ká ní” kúrò kí ìkọ̀lé Yorùbá má bà a fi ìparí-ìdájọ́ tàbí ìfọ̀rọ̀wérọ̀ tí kò hàn gbangba nínú orísun kún gbólóhùn náà. “Bí ó bá ... kì bá ...” ń fi ipò òdì sí òtítọ́ hàn ní ti ara. A tún ṣe προσφερόντων sí “ń fi àwọn ẹ̀bùn rú ẹbọ” kí àyíká ìrúbọ hàn, ṣùgbọ́n “àwọn ẹ̀bùn” ṣì jẹ́ ìtumọ̀ τὰ δῶρα.
