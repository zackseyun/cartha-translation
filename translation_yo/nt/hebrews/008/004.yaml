id: HEB.8.4
reference: Hebrews 8:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: yo
  text: Bí ó bá wà lórí ilẹ̀ ayé, kì bá tilẹ̀ jẹ́ àlùfáà, níwọ̀n bí àwọn tí ń fi àwọn ẹ̀bùn[a] rú ẹbọ gẹ́gẹ́ bí òfin wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọrẹ ẹbọ.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “àwọn ẹ̀bùn,” ó sì jẹ́ ọ̀rọ̀ tí a sábà máa ń lò fún ohun tí a fi rú ẹbọ nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Nítorí náà, ká ní
  rationale: “Nítorí náà” ṣàfihàn ìsopọ̀ ọgbọ́n inú οὖν, “ká ní” sì gbé ipò àròsọ tí kò bá òtítọ́ mu jáde ní Yorùbá àdánidá.
- source_word: ἦν ἐπὶ γῆς
  choice: ó wà lórí ilẹ̀ ayé
  rationale: “Lórí ilẹ̀ ayé” sọ ibi tí ó yàtọ̀ sí ọ̀run nínú àyíká ọ̀rọ̀ náà; aṣojú ọ̀rọ̀ “ó” ń tọ́ka sí ẹni tí a ń sọ̀rọ̀ rẹ̀ ní ẹsẹ tó ṣáájú.
- source_word: οὐδ’ ἂν ἦν
  choice: kì bá tilẹ̀ jẹ́
  rationale: Ìṣọ̀kan “kì ... bá” bá gbólóhùn àròsọ mu, “tilẹ̀” sì pa ìtẹnumọ́ οὐδέ mọ́.
- source_word: ἱερεύς
  choice: àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ipò àlùfáà nínú ètò ìsìn àti ẹbọ.
- source_word: ὄντων τῶν προσφερόντων
  choice: nítorí àwọn tí ń mú ... wá ... ti wà
  rationale: Ó mú agbára ìdí tí genitive absolute ní jáde, ó sì tú προσφέρω sí Yorùbá àdánidá láì fi ọ̀rọ̀-orúkọ náà dà pọ̀ mọ́ ọ̀rọ̀-ìṣe.
- source_word: κατὰ νόμον
  choice: gẹ́gẹ́ bí òfin
  rationale: Ó tú ìbámu pẹ̀lú òfin tó ń darí àwọn ẹ̀bùn àlùfáà jáde ní kedere.
- source_word: τὰ δῶρα
  choice: àwọn ẹ̀bùn
  rationale: “Àwọn ẹ̀bùn” pa ìtumọ̀ gígùn δῶρα mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí àwọn ohun tí a fi rú ẹbọ nínú àyíká yìí.
theological_decisions:
- issue: Aṣojú ọ̀rọ̀ tí kò hàn gbangba nínú gbólóhùn ipò
  choice: Lo “ó,” tó ń tọ́ka sí Jésù/Mèsáyà nínú àyíká ọ̀rọ̀.
  alternative: Ṣíṣe gbólóhùn náà láì sọ aṣojú ọ̀rọ̀ ní gbangba.
  rationale: Gírámà Yorùbá nílò aṣojú ọ̀rọ̀ níbí, ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sì ṣe kedere láti inú àyíká; èyí kò fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un.
- issue: Agbára gbólóhùn ipò
  choice: Lo “ká ní ... kì bá ...” gẹ́gẹ́ bí ipò àròsọ tí kò bá òtítọ́ mu.
  alternative: “Bí ó bá wà ... kò ní ...,” èyí tí ó lè dà bí ipò tí ó ṣì ṣeé ṣe.
  rationale: Ìkọ̀lé εἰ pẹ̀lú imperfect àti ἄν pẹ̀lú imperfect ń tọ́ka sí ipò òdì sí òtítọ́; ìkọ̀lé Yorùbá tí a yàn pa ìyàtọ̀ yìí mọ́ láì sọ ju orísun lọ.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó ní iyì, tí òǹkàwé òde òní lè lóye ni a lò. “Ká ní ... kì bá ...” jẹ́ ọ̀nà àdánidá láti fi ipò àròsọ tí kò bá òtítọ́ mu hàn. A gbé àmì àlàyé [a] sí “àwọn ẹ̀bùn,” ibi tí àlàyé ọ̀rọ̀ náà tọ́ sí, dípò fífi sí “ilẹ̀ ayé.”
