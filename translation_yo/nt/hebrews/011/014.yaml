  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: yo
  text: Nítorí àwọn tí ń sọ irú nǹkan bẹ́ẹ̀ fi hàn kedere pé wọ́n ń wá ilẹ̀ ìbílẹ̀ kan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘orílẹ̀-èdè tiwọn fúnra wọn’ tàbí ‘ilẹ̀ abinibi.’ Ẹsẹ tó tẹ̀ lé e mú kedere pé ilẹ̀ ìbílẹ̀ tí wọ́n ń retí ní ìkẹyìn jẹ́ ti ọ̀run.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τοιαῦτα
  choice: irú nǹkan bẹ́ẹ̀
  rationale: Ó tọ́ka sí irú àwọn ọ̀rọ̀ tí a ṣẹ̀ṣẹ̀ sọ ní àyíká ọ̀rọ̀ náà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: λέγοντες
  choice: àwọn tí ń sọ
  rationale: A tú participle náà sí gbólóhùn aláṣepọ̀, nígbà tí àmì ìṣe tó ń lọ lọ́wọ́ ‘ń’ pa agbára present rẹ̀ mọ́.
- source_word: ἐμφανίζουσιν
  choice: fi hàn kedere
  rationale: Ó mú ìtumọ̀ ṣíṣe ohun kan ní gbangba tàbí ní kedere jáde ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: Ó bẹ̀rẹ̀ gbólóhùn tó sọ ohun tí ọ̀rọ̀ wọn fi hàn.
- source_word: πατρίδα
  choice: ilẹ̀ ìbílẹ̀ kan
  rationale: ‘Ilẹ̀ ìbílẹ̀’ lè túmọ̀ sí ilẹ̀ ẹni tàbí ilẹ̀ abinibi rẹ̀; ‘kan’ ṣe àfihàn pé orúkọ náà kò ní article nínú Gíríìkì, láì fi ìtumọ̀ ọ̀run kún un ṣáájú àkókò.
- source_word: ἐπιζητοῦσιν
  choice: ń wá
  rationale: Ó pa ìtumọ̀ ìwá kiri tàbí lílépa tó ń bá a lọ mọ́, dípò yíyí i sí ìfẹ́ ọkàn nìkan.
theological_decisions:
- issue: Ìtumọ̀ ilẹ̀ ìbílẹ̀ tí àwọn baba ńlá ń wá
  choice: ilẹ̀ ìbílẹ̀ kan
  alternative: ilẹ̀ ayé kan tàbí ilẹ̀ ìbílẹ̀ ti ọ̀run
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò tíì sọ pé ilẹ̀ ayé ni tàbí ti ọ̀run; ẹsẹ tó tẹ̀ lé e ló ṣàlàyé ìrètí wọn síwájú. Ìtumọ̀ náà pa àìdánilójú inú ẹsẹ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
