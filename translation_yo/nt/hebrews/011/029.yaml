revisions:
- from: Nípa ìgbàgbọ́, wọ́n la Òkun Pupa[a] kọjá bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá; ṣùgbọ́n nígbà tí àwọn ará Íjíbítì gbìyànjú láti ṣe bẹ́ẹ̀, omi gbé wọn mì.
  to: Nípa ìgbàgbọ́, wọ́n la Òkun Pupa[a] kọjá bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá; nígbà tí àwọn ará Íjíbítì gbìyànjú láti ṣe bẹ́ẹ̀, a gbé wọn mì.
  rationale: The revision preserves the Greek passive and its “swallowed up” imagery with Yoruba’s natural impersonal passive, “a gbé wọn mì,” without inserting “water” as the stated agent. It also removes an unneeded adversative and corrects the footnote’s account of the Hebrew/Exodus lexical alternative. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:31:26Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause and the faith/crossing imagery are substantially accurate. However, κατεπόθησαν is passive, literally “were swallowed up,” whereas “omi gbé wọn mì” changes it to an active clause and explicitly supplies water as agent. The supplied agent is historically understandable but not stated in the Greek. The adversative “ṣùgbọ́n” is also not required by the participial construction.
  naturalness: The Yoruba is generally clear and modern. “Bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá” is a natural way to express the comparison, though it carries a slight “as if” nuance. The revision retains it while making the following relationship more direct.
  terminology: “Ìgbàgbọ́,” “Òkun Pupa,” and “àwọn ará Íjíbítì” are suitable standard-Yoruba choices. The note’s wording should identify the Hebrew Exodus name as the basis for the alternative and present the “Sea of Reeds” sense as an interpretive/lexical alternative rather than implying that the Exodus account is based on a place-name.
  issues:
  - severity: medium
    issue: Active, interpretive rendering of κατεπόθησαν
    rationale: “Omi gbé wọn mì” explicitly names water and makes it the active subject. The Greek instead uses a passive verb, “they were swallowed up.” An impersonal passive construction better preserves both wording and vividness.
  - severity: low
    issue: Footnote inaccurately describes the lexical basis for the alternative
    rationale: The alternative concerns the underlying Hebrew name in Exodus, not a place-name on which the Exodus story “rests.” The footnote should state this more precisely and cautiously.
  - severity: low
    issue: Unnecessary adversative conjunction
    rationale: “Ṣùgbọ́n” adds an explicit contrast not marked by the Greek participle. A temporal clause communicates the relation without adding discourse force.
  revised_text: Nípa ìgbàgbọ́, wọ́n la Òkun Pupa[a] kọjá bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá; nígbà tí àwọn ará Íjíbítì gbìyànjú láti ṣe bẹ́ẹ̀, a gbé wọn mì.
  revised_footnotes:
  - marker: a
    text: Tàbí, “Òkun Esùsú.” Ọ̀rọ̀ Gíríìkì níhìn-ín ni “Òkun Pupa” (Ἐρυθρὰν Θάλασσαν), ṣùgbọ́n orúkọ Hébérù fún ibi náà nínú ìtàn Ẹ́kísódù ni a máa ń túmọ̀ nígbà míì sí “Òkun Esùsú.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek passive and its “swallowed up” imagery with Yoruba’s natural impersonal passive, “a gbé wọn mì,” without inserting “water” as the stated agent. It also removes an unneeded adversative and corrects the footnote’s account of the Hebrew/Exodus lexical alternative. No doctrinal interpretation has been added.
