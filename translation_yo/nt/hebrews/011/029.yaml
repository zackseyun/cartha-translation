id: HEB.11.29
reference: Hebrews 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, wọ́n la Òkun Pupa[a] kọjá bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá; nígbà tí àwọn ará Íjíbítì gbìyànjú láti ṣe bẹ́ẹ̀, a gbé wọn mì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Òkun Esùsú.” Ọ̀rọ̀ Gíríìkì níhìn-ín ni “Òkun Pupa” (Ἐρυθρὰν Θάλασσαν), ṣùgbọ́n orúkọ Hébérù fún ibi náà nínú ìtàn Ẹ́kísódù ni a máa ń túmọ̀ nígbà míì sí “Òkun Esùsú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ohun èlò ni; ó sì bá gbólóhùn àtúnṣe Πίστει jákèjádò Hébérù 11 mu. “Ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún πίστις níhìn-ín.
- source_word: διέβησαν
  choice: wọ́n la ... kọjá
  rationale: Ó túmọ̀ sí líla láti ẹ̀gbẹ́ kan dé òmíràn; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: Òkun Pupa
  rationale: Èyí ni ìtumọ̀ tààrà gbólóhùn Gíríìkì náà. Àṣàyàn “Òkun Esùsú” wà nínú àlàyé ìsàlẹ̀ nítorí orúkọ ibi náà nínú ìtàn Ẹ́kísódù.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: bí ẹni pé wọ́n ń la ilẹ̀ gbígbẹ kọjá
  rationale: Ó pa ìfiwéra ὡς àti àwòrán líla ilẹ̀ gbígbẹ mọ́ ní Yorùbá àdánidá.
- source_word: πεῖραν λαβόντες
  choice: nígbà tí ... gbìyànjú láti ṣe bẹ́ẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà jẹ́ ìlò àkànṣe fún ṣíṣe ìgbìyànjú. “Láti ṣe bẹ́ẹ̀” tọ́ka sí líla kan náà láìjẹ́ kí gbolohun náà le.
- source_word: οἱ Αἰγύπτιοι
  choice: àwọn ará Íjíbítì
  rationale: Ìtumọ̀ àdánidá fún orúkọ àwọn ènìyàn orílẹ̀-èdè náà.
- source_word: κατεπόθησαν
  choice: omi gbé wọn mì
  rationale: Ó pa àwòrán alágbára ti καταπίνω, “gbé mì,” mọ́. Fífi “omi” kún un mú ẹni tó ṣe ìṣe náà hàn ní Yorùbá láìyí ìtumọ̀ pé wọ́n rì sínú omi padà.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú Hébérù 11
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Πίστει jẹ́ àgbékalẹ̀ pàtàkì tí a ń tún sọ jákèjádò orí 11. Ní àyíká àwọn àpẹẹrẹ inú orí yìí, “ìgbàgbọ́” ló pa kókó ẹ̀kọ́ náà mọ́ jù, láìfi ìtumọ̀ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ohun tí ἧς ń tọ́ka sí
  choice: ṣe bẹ́ẹ̀—ìyẹn, gbìyànjú láti la òkun náà kọjá
  alternative: túmọ̀ ọ́ ní ọ̀rọ̀-ọ̀rọ̀ gẹ́gẹ́ bí “èyí tí” tàbí “ti èyí”
  rationale: Gíríìkì so ìgbìyànjú àwọn ará Íjíbítì mọ́ ọ̀nà líla kan náà. Yorùbá àdánidá fi ìbáṣepọ̀ yìí hàn pẹ̀lú “ṣe bẹ́ẹ̀,” láìdá ohun tí a tọ́ka sí pinnu ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà ní ọlá, ó ṣe kedere fún òǹkàwé òde òní, ó sì tẹ̀ lé ìtẹ̀sí optimal-equivalence. A lo “wọ́n” láìsọ àwọn ọmọ Ísírẹ́lì ní pàtó, nítorí Gíríìkì náà fúnra rẹ̀ kò tún orúkọ wọn sọ nínú ẹsẹ yìí.
