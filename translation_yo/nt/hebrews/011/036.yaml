  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: yo
  text: Àwọn ẹlòmíràn sì fara dà ẹ̀gàn àti lílù ní pàṣán,[a] àti pàápàá ẹ̀wọ̀n àti àtìmọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n gba ìdánwò ẹ̀gàn àti lílù ní pàṣán, àti pàápàá ti ẹ̀wọ̀n àti àtìmọ́lé.” Ní ti gidi, èdè Gíríìkì sọ pé, “wọ́n gba ìdánwò …”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: àwọn ẹlòmíràn
  rationale: Ó tọ́ka sí ẹgbẹ́ mìíràn nínú àwọn olóòótọ́ tí wọ́n jìyà, ó sì pa ìyàtọ̀ mọ́ pẹ̀lú àwọn àpẹẹrẹ tó ṣáájú.
- source_word: ἐμπαιγμῶν
  choice: ẹ̀gàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹnì kan ṣe yẹ̀yẹ́ tàbí síso ó di ohun ẹ̀gàn; ‘ẹ̀gàn’ jẹ́ Yorùbá àdánidá, ó sì yẹ fún ọ̀rọ̀ ọ̀wọ̀.
- source_word: μαστίγων
  choice: lílù ní pàṣán
  rationale: Ó sọ ní pàtó nípa lílù pẹ̀lú pàṣán; yíyan yìí ṣe kedere sí òǹkàwé òde òní ju ọ̀rọ̀ gbogbogbò bí ‘ìlù’ lọ.
- source_word: πεῖραν ἔλαβον
  choice: fara da ìdánwò
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní ti gidi sí ‘gba ìdánwò/àdánwò’; ‘fara da ìdánwò’ jẹ́ àdánidá ní Yorùbá, ó sì pa èrò pé àwọn ìjìyà náà jẹ́ àdánwò tí wọ́n la kọjá mọ́.
- source_word: ἔτι δὲ
  choice: àti ... pàápàá
  rationale: Ó fi ìtẹnumọ́ àti ìlọsíwájú hàn láti ẹ̀gàn àti pàṣán dé ẹ̀wọ̀n àti àtìmọ́lé.
- source_word: δεσμῶν
  choice: ẹ̀wọ̀n
  rationale: Ó ń tọ́ka sí ohun ìdè tàbí ṣẹ́kẹ́ṣẹkẹ̀ tí a fi ń dè ẹlẹ́wọ̀n; ‘ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere nínú àyíká yìí.
- source_word: φυλακῆς
  choice: àtìmọ́lé
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi ènìyàn sínú túbú tàbí dídá a mọ́; ‘àtìmọ́lé’ dá ipò ìhámọ́ náà hàn ní kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. A pa àwòrán lílù pẹ̀lú pàṣán àti ìtẹnumọ́ ἔτι δὲ mọ́, nígbà tí àkọ́lé ìsàlẹ̀ ṣàlàyé ìtumọ̀ gidi ti πεῖραν ἔλαβον.
