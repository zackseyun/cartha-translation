id: HEB.11.12
reference: Hebrews 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: yo
  text: Nítorí náà, láti ọ̀dọ̀ ọkùnrin kan ṣoṣo[a]—ẹni tí ara rẹ̀ sì ti dàbí ẹni tí ó ti kú—ni a ti bí àwọn àtọmọdọ́mọ tí iye wọn pọ̀ bí ìràwọ̀ ojú ọ̀run, tí wọn sì pọ̀ bí iyanrìn tí kò ṣeé kà ní etí òkun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà pẹkipẹki, “láti ọ̀dọ̀ ẹnì kan ṣoṣo, ẹni yìí sì ti di bí òkú.” Ohun tí a ń sọ ni pé ọjọ́ orí Ábúráhámù ti kọjá ìgbà tí agbára rẹ̀ láti bí ọmọ ti ń ṣiṣẹ́ déédé.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí ó jáde láti inú ẹsẹ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so èrò náà pọ̀ ní Yorùbá.
- source_word: ἀφ’ ἑνὸς
  choice: láti ọ̀dọ̀ ọkùnrin kan ṣoṣo
  rationale: Ọ̀rọ̀ Gíríìkì náà wà ní akọ, àyíká ọ̀rọ̀ sì ń tọ́ka sí Ábúráhámù; ‘ọkùnrin kan ṣoṣo’ mú ẹni tí a ń sọ̀rọ̀ rẹ̀ ṣe kedere.
- source_word: ἐγεννήθησαν
  choice: ni a ti bí àwọn ọmọ-ọmọ
  rationale: Fáàbù náà jẹ́ àìṣe ní ọ̀pọ̀, ó sì ń sọ bí àwọn àtọmọdọ́mọ ṣe wá sí ayé; ‘àwọn ọmọ-ọmọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún irú-ọmọ ní ọ̀pọ̀ ìran.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: ẹni tí ara rẹ̀ sì ti dàbí ẹni tí ó ti kú
  rationale: Èyí pa àwòrán ikú mọ́ láìsọ pé Ábúráhámù kú ní ti gidi; ó ń tọ́ka sí bí ọjọ́ ogbó ti mú agbára rẹ̀ láti bímọ dàbí èyí tí ó ti dópin.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: tí iye wọn pọ̀ bí ìràwọ̀ ojú ọ̀run
  rationale: Ó pa ìfiwéra àti èrò ọ̀pọ̀lọpọ̀ iye mọ́ ní ọ̀nà Yorùbá tó ṣeé lóye.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: bí iyanrìn ... ní etí òkun
  rationale: ‘Etí òkun’ jẹ́ àdánidá fún àwòrán gangan ti ‘ètè/etí òkun’ nínú Gíríìkì.
- source_word: ἀναρίθμητος
  choice: tí kò ṣeé kà
  rationale: Ó túmọ̀ sí ohun tí iye rẹ̀ kọjá ohun tí a lè kà, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó lágbára.
theological_decisions:
- issue: Ẹni tí ‘láti ọ̀dọ̀ ẹnì kan’ ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí ‘ọkùnrin kan ṣoṣo,’ tó ń tọ́ka sí Ábúráhámù.
  alternative: ‘láti ọ̀dọ̀ ẹnì kan’ tàbí ‘láti ọ̀dọ̀ ọ̀kan’
  rationale: Ìrísí akọ nínú Gíríìkì àti àyíká ọ̀rọ̀ fi Ábúráhámù hàn. Ṣíṣe akọ rẹ̀ kedere kò fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ νενεκρωμένου
  choice: Àwòrán fún ara Ábúráhámù tí ọjọ́ ogbó ti mú un kọjá agbára ìbímọ, kì í ṣe pé ó kú ní ti gidi.
  alternative: Pé ó ti kú ní ti gidi tàbí pé ara rẹ̀ ti di òkú pátápátá.
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìbí ọmọ láìròtẹ́lẹ̀ ní ọjọ́ ogbó. ‘Dàbí ẹni tí ó ti kú’ pa agbára àwòrán náà mọ́, kò sì yanjú rẹ̀ sí ikú gidi.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá bá èdè mu. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a pa àwòrán ìràwọ̀, iyanrìn etí òkun, àti ‘dàbí ẹni tí ó ti kú’ mọ́.
