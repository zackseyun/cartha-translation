id: HEB.11.15
reference: Hebrews 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: yo
  text: Bí ó sì jẹ́ pé ilẹ̀ náà[a] tí wọ́n ti jáde kúrò níbẹ̀ ni wọ́n ń rántí, wọ́n ìbá ní àǹfààní láti padà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘orílẹ̀-èdè náà’ tàbí ‘ilẹ̀ ìbílẹ̀ náà.’ Ọ̀rọ̀ Gíríìkì ń tọ́ka sí ibi ayé tí wọ́n ti fi sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: ni wọ́n ń rántí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun tí ọkàn wọn bá ń dúró lé léraléra. Ìtumọ̀ yìí pa ìtumọ̀ ìrántí mọ́ láì fi ìbànújẹ́ tàbí ìfẹ́ àtijọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐκείνης
  choice: ilẹ̀ náà
  rationale: Arọ́pò-orúkọ abo náà ń tọ́ka sí ilẹ̀ ayé tí a mẹ́nu kàn ṣáájú. ‘Ilẹ̀ náà’ jẹ́ èdè Yorùbá tó ṣe kedere, tí kò sì mú èrò ìṣèlú wọ inú ọ̀rọ̀ náà.
- source_word: ἀφ’ ἧς
  choice: tí wọ́n ti ... kúrò níbẹ̀
  rationale: Èyí fi ibi tí ìjáde wọn ti bẹ̀rẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: ἐξέβησαν
  choice: jáde kúrò
  rationale: ‘Jáde kúrò’ pa àwòrán ìjáde nínú ἐκβαίνω mọ́, dípò lílo ‘fi sílẹ̀’ nìkan.
- source_word: εἶχον ἂν
  choice: wọn ìbá ní
  rationale: Ìkọ̀lé ‘ìbá’ fi ipò àròsọ tí kò ṣẹlẹ̀ hàn ní kedere, gẹ́gẹ́ bí imperfect pẹ̀lú ἄν ṣe ń ṣe nínú Gíríìkì.
- source_word: καιρὸν
  choice: àǹfààní
  rationale: Níbí, καιρός túmọ̀ sí àyè tàbí ìṣẹ̀lẹ̀ tó bójú mu fún ìpadà, kì í ṣe àkókò lásán.
- source_word: ἀνακάμψαι
  choice: láti padà
  rationale: ‘Padà’ jẹ́ ọ̀nà kúkúrú, àdánidá láti sọ ìyípadà sí ibi tí wọ́n ti kúrò.
- source_word: καὶ εἰ μὲν
  choice: Bí ó sì jẹ́ pé
  rationale: ‘Sì’ so ẹsẹ yìí mọ́ èrò tó ṣáájú, nígbà tí ‘bí ó jẹ́ pé’ fi ìpèníjà àròsọ náà hàn láì tẹ μέν mọ́lẹ̀ ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Irú ‘ilẹ̀’ tí wọ́n ń rántí
  choice: Ilẹ̀ ayé tí àwọn baba ńlá náà ti jáde kúrò, tí ó yàtọ̀ ní àfojúsùn sí ilẹ̀ tó dára jù, ti ọ̀run, nínú àyíká ọ̀rọ̀.
  alternative: Ọ̀nà ìgbésí ayé wọn tẹ́lẹ̀ lápapọ̀, dípò ilẹ̀ ìbílẹ̀ gidi kan.
  rationale: Hébérù 11:13–16 ń sọ̀rọ̀ nípa ilẹ̀ àti ìlú ní ọ̀nà gidi, ó sì fi ilẹ̀ tí wọ́n ti wá sílẹ̀ wé ilẹ̀ tó dára jù. Nítorí náà, a pa èdè ibi gidi mọ́, láì sọ ọ́ di àkàwé fún ìgbésí ayé àtijọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìkọ̀lé ‘wọn ìbá ní’ ń sọ ipò tí kò ṣẹlẹ̀ di mímọ̀ fún òǹkàwé, ‘jáde kúrò níbẹ̀’ sì pa àwòrán ìrìn-àjò kúrò ní ilẹ̀ kan mọ́.
