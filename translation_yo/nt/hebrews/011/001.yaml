id: HEB.11.1
reference: Hebrews 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: yo
  text: Ìgbàgbọ́ sì ni ìdánilójú[a] nípa àwọn ohun tí a ń retí, ó sì jẹ́ ẹ̀rí[b] nípa àwọn ohun tí a kò rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpìlẹ̀” tàbí “òtítọ́ gidi” àwọn ohun tí a ń retí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìdánilójú” tàbí “ìdánilójú ọkàn” nípa àwọn ohun tí a kò rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìgbẹ́kẹ̀lé onígbàgbọ́ nínú Ọlọ́run àti àwọn ìlérí rẹ̀; “ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ fún èrò yìí.
- source_word: ἐλπιζομένων
  choice: àwọn ohun tí a ń retí
  rationale: Ìtumọ̀ yìí fi hàn pé àwọn ohun náà ni ohun tí ìrètí dojú kọ, ó sì pa ìṣe tí ó ń bá a lọ mọ́ nípasẹ̀ “ń retí.”
- source_word: ὑπόστασις
  choice: ìdánilójú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, “ìdánilójú” sọ agbára ìgbẹ́kẹ̀lé tí ìgbàgbọ́ ń fúnni ní èdè Yorùbá àdánidá, láìfi ìtumọ̀ ọgbọ́n-ìjìnlẹ̀ nípa ohun-ìní tàbí ẹ̀dá ohun kan lé ẹsẹ náà lórí.
- source_word: πραγμάτων
  choice: àwọn ohun
  rationale: Ọ̀rọ̀ gbogbogbò yìí bá ìtúmọ̀ orísun mu, ó sì mú ìbáramu láàárín àwọn ohun tí a ń retí àti àwọn ohun tí a kò rí dúró.
- source_word: ἔλεγχος
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” lè sọ ohun tí ń fi òtítọ́ ọ̀ràn kan múlẹ̀; ó pa agbára ìfihàn tàbí ìdánilójú ọ̀rọ̀ Gíríìkì náà mọ́ láìdín un kù sí ìmọ̀lára inú nìkan.
- source_word: οὐ βλεπομένων
  choice: àwọn ohun tí a kò rí
  rationale: Ìtumọ̀ tààrà yìí pa àtakò láàárín ìrètí/ìgbàgbọ́ àti ohun tí ojú lè rí mọ́.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àmì ìsopọ̀ onírẹ̀lẹ̀ tí ó bá δέ mu; kò sọ ọ́ di àkókò “nísinsìnyí,” bẹ́ẹ̀ ni kò fi àtakò líle kún un.
theological_decisions:
- issue: Ìtumọ̀ ὑπόστασις nínú Hébérù 11:1
  choice: ìdánilójú
  alternative: ìpìlẹ̀ tàbí ohun gidi
  rationale: “Ìdánilójú” bá àyíká ìṣírí àti àwọn àpẹẹrẹ ìgbàgbọ́ inú orí náà mu. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ tó lè tọ́ka sí ìpìlẹ̀ tàbí òtítọ́ gidi mọ́, kí a má bàa yanjú àìdánilójú ọ̀rọ̀ náà ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà ṣàpèjúwe ìdúró àwọn ènìyàn sí àwọn ìlérí Ọlọ́run, nítorí náà “ìgbàgbọ́” jẹ́ yíyàn tó bá àyíká mu jù; kò sí àkọsílẹ̀ onífẹ̀ẹ́ tí yóò béèrè pé ká túmọ̀ rẹ̀ sí ìṣòtítọ́ ẹlòmíràn.
- issue: Ìtumọ̀ ἔλεγχος gẹ́gẹ́ bí ohun ìta tàbí ìdánilójú inú
  choice: ẹ̀rí
  alternative: ìdánilójú ọkàn
  rationale: “Ẹ̀rí” pa agbára ohun tí ń fi ọ̀ràn múlẹ̀ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì náà tún lè tẹnu mọ́ ìdánilójú tí ẹ̀rí náà ń mú wá sínú ọkàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe gbolohun kejì sí “ó sì jẹ́” mú ìṣe àpèjúwe náà ṣe kedere fún òǹkàwé Yorùbá, láìyí ìbáramu àwọn gbólóhùn orúkọ méjèèjì nínú Gíríìkì padà. Àwọn àmì [a] àti [b] wà lẹ́yìn ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
