id: HEB.11.8
reference: Hebrews 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni Ábúráhámù, nígbà tí a pè é, ṣègbọ́ràn láti jáde lọ sí ibi kan[a] tí òun yóò gbà gẹ́gẹ́ bí ogún. Ó sì jáde lọ láìmọ ibi tí òun ń lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀dà àfọwọ́kọ kan ní, “ibi náà.”
    reason: Àwọn ẹ̀dà àfọwọ́kọ Gíríìkì yàtọ̀ lórí bóyá article wà níwájú τόπον; SBLGNT fi τόπον (“ibi kan”) sínú ọ̀rọ̀ pàtàkì.
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù náà ń fi ohun èlò tàbí ọ̀nà hàn; “nípa ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìgbẹ́kẹ̀lé Ábúráhámù tí ó mú un dáhùn sí ìpè Ọlọ́run.
- source_word: καλούμενος
  choice: nígbà tí a pè é
  rationale: Ọ̀rọ̀ àpólà aláìṣe yìí ń ṣàlàyé ipò tí Ábúráhámù wà; ìtumọ̀ yìí jẹ́ ti àdánidá láìsọ tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ náà ju ohun tí Gíríìkì sọ lọ.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: ṣègbọ́ràn láti jáde lọ
  rationale: Ó pa ìtumọ̀ ìgbọ́ràn àti infinitive “láti jáde lọ” mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: τόπον
  choice: ibi kan
  rationale: Orúkọ náà kò ní article nínú ẹ̀dà SBLGNT, ibi náà kò sì tíì ṣe pàtó fún Ábúráhámù; “ibi kan” mú èyí hàn.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: tí yóò gbà gẹ́gẹ́ bí ogún
  rationale: μέλλω pẹ̀lú infinitive ń tọ́ka sí ohun ọjọ́ iwájú níbí; “yóò gbà” kò fi èrò àyànmọ́ tí kò ṣe kedere sínú ọ̀rọ̀ náà, “gẹ́gẹ́ bí ogún” sì pa ipò ohun tí a ó jogún mọ́.
- source_word: καὶ ἐξῆλθεν
  choice: Ó sì jáde lọ
  rationale: Ó tún ọ̀rọ̀ ìṣe ἐξελθεῖν ṣe gẹ́gẹ́ bí Gíríìkì, ó sì ń tẹ ìtàn náà síwájú.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: láìmọ ibi tí òun ń lọ
  rationale: Ó fi ipò tí ó bá ìjáde rẹ̀ lọ hàn, ó sì tú present ἔρχεται sí Yorùbá àdánidá fún ibi tí ẹni ń lọ.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ náà tẹnumọ́ pé Ábúráhámù gbẹ́kẹ̀ lé ìpè Ọlọ́run, ó sì dáhùn sí i; “ìgbàgbọ́” pa ọ̀rọ̀ pàtàkì inú orí yìí mọ́ láìsọ pé ìṣòtítọ́ ni ìtumọ̀ pàtàkì níbí.
- issue: Ta ni ó pè Ábúráhámù?
  choice: a pè é
  alternative: Ọlọ́run pè é
  rationale: Ọlọ́run ni ẹni tí àyíká ìtàn ń tọ́ka sí, ṣùgbọ́n Gíríìkì lo passive kò sì dárúkọ ẹni tí ó pè é; ìtumọ̀ náà pa ìfipamọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Jáde lọ” tún ara ọ̀rọ̀ Gíríìkì ṣe ní ìdajì méjèèjì, “òun” sì mú kedere pé Ábúráhámù ni kò mọ ibi tí òun ń lọ.
