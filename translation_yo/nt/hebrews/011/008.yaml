  to: Nípa ìgbàgbọ́ ni Ábúráhámù, nígbà tí a pè é, ṣègbọ́ràn láti jáde lọ sí ibi kan[a] tí òun yóò gbà gẹ́gẹ́ bí ogún. Ó sì jáde lọ láìmọ ibi tí òun ń lọ.
