  yaml_path: translation/nt/hebrews/011/018.yaml
  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: yo
  text: ẹni tí a sọ fún pé, “Nípasẹ̀ Ísáákì ni a ó ti pe irú-ọmọ fún ọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gẹ́lẹ́, “Nínú Ísáákì ni a ó ti pe irú-ọmọ fún ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὃν ἐλαλήθη
  choice: ẹni tí a sọ fún pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ẹni tí ọ̀rọ̀ náà dé ọ̀dọ̀ rẹ̀ mọ́, ó sì tún pa ìṣe aláìlórúkọ nínú fọ́ọ̀mù passive Gíríìkì mọ́.
- source_word: Ἐν Ἰσαὰκ
  choice: Nípasẹ̀ Ísáákì
  rationale: Nínú àyọlò yìí, ἐν ń tọ́ka sí Ísáákì gẹ́gẹ́ bí ẹni tí ìlà irú-ọmọ ìlérí yóò gba ọ̀dọ̀ rẹ̀ jáde; “nípasẹ̀” mú èyí yé kedere ní Yorùbá òde òní láìfi èrò míì kún un.
- source_word: κληθήσεταί
  choice: ni a ó ti pe
  rationale: Ó pa àwòrán ìpè tàbí yíyan-orúkọ inú καλέω mọ́, pẹ̀lú fọ́ọ̀mù ọjọ́ iwájú tí kò dárúkọ olùṣe.
- source_word: σοι
  choice: fún ọ
  rationale: Dative náà jẹ́ pé irú-ọmọ náà ni a ó pè tàbí dá mọ̀ fún Ábúráhámù; “fún ọ” sun mọ́ ìṣètò Gíríìkì, ó sì jẹ́ Yorùbá tí ó bójú mu.
- source_word: σπέρμα
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” lè dúró fún àpapọ̀ ìran tí ó ti ọ̀dọ̀ ẹni kan wá, nítorí náà ó pa ìtumọ̀ collective singular ti σπέρμα mọ́ ju “àwọn ọmọ-ọmọ” lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ ìlérí nípa ìlà tí yóò gba ọ̀dọ̀ Ísáákì jáde
  choice: “Nípasẹ̀ Ísáákì ni a ó ti pe irú-ọmọ fún ọ”
  alternative: “Nínú Ísáákì ni a ó ti pe irú-ọmọ fún ọ”
  rationale: Àṣàyàn pàtàkì jẹ́ kí ìtumọ̀ ìlà ìran náà ṣe kedere ní Yorùbá, ṣùgbọ́n ó pa “pe” àti “irú-ọmọ” mọ́ kí a má bàa yanjú ju ohun tí Gíríìkì sọ lọ. Àlàyé ìsàlẹ̀ fi ọ̀nà gẹ́lẹ́ sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún; gbolohun náà jẹ́ àjákù tí ó ń tẹ̀ lé ẹsẹ tó ṣáájú, gẹ́gẹ́ bí orísun Gíríìkì.
