  to: Nípa ìgbàgbọ́, ó pa Ìrékọjá mọ́, ó sì ṣe ìfín ẹ̀jẹ̀[a], kí ẹni tí ń pa àwọn àkọ́bí run má bàa fọwọ́ kan wọn.
  rationale: Àtúnṣe náà mú ọ̀nà Yorùbá tí ó rọrùn sí i wá fún πεποίηκεν τὸ πάσχα, nípasẹ̀ “ó pa Ìrékọjá mọ́,” láì fi “àsè” tàbí “oúnjẹ” kún ìtumọ̀ náà. A tún rọ́pò “fífọ́n ẹ̀jẹ̀” pẹ̀lú “ìfín ẹ̀jẹ̀,” ọ̀rọ̀ ìlànà ìjọsìn tó yẹ, nígbà tí àlàyé ìsàlẹ̀ ń pa aṣàyàn “fífi ẹ̀jẹ̀ sí ibi” mọ́. Gbogbo ìdí, ìtọ́kasí arọ́pò-orúkọ, àti àìdánimọ̀ ẹni apanirun náà ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:32:40Z'
