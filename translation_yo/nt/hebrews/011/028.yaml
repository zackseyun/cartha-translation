id: HEB.11.28
reference: Hebrews 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, ó pa Ìrékọjá mọ́, ó sì ṣe ìfín ẹ̀jẹ̀[a], kí ẹni tí ń pa àwọn àkọ́bí run má bàa fọwọ́ kan wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fífi ẹ̀jẹ̀ sí ibi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífi ẹ̀jẹ̀ sí ibi kan gẹ́gẹ́ bí apá ìlànà ìjọsìn. “Ìfín ẹ̀jẹ̀” jẹ́ ìtumọ̀ ìbílẹ̀; “fífi ẹ̀jẹ̀ sí ibi” lè bá àyíká Ìrékọjá mu dáadáa sí i, níbi tí a ti fi ẹ̀jẹ̀ sí àtẹ́rígbà àti àwọn òpó ilẹ̀kùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ọ̀rọ̀ yìí fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà tí Mósè fi ṣe ohun tí ó ṣe, ó sì bá àtúnlò ọ̀rọ̀ náà mu ní gbogbo Hébérù 11.
- source_word: πεποίηκεν τὸ πάσχα
  choice: ó ṣe Ìrékọjá
  rationale: Ní àyíká yìí, ποιέω túmọ̀ sí ṣíṣe tàbí pípa àṣẹ Ìrékọjá mọ́. ‘Ó ṣe Ìrékọjá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láì fi kún un pé àsè tàbí oúnjẹ nìkan ni.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: fífọ́n ẹ̀jẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífi ẹ̀jẹ̀ sí ibi kan nínú ìlànà ìjọsìn. ‘Fífọ́n ẹ̀jẹ̀’ jẹ́ ìtumọ̀ ìbílẹ̀ tó mọ́gbọ́n dání, ṣùgbọ́n a fi ìtumọ̀ mìíràn sí àlàyé ìsàlẹ̀ nítorí bí a ṣe fi ẹ̀jẹ̀ sí àtẹ́rígbà àti òpó ilẹ̀kùn nínú Ẹ́kísódù 12.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ó pa ète gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ὁ ὀλοθρεύων τὰ πρωτότοκα
  choice: ẹni tí ń pa àwọn àkọ́bí run
  rationale: Èyí pa irú ọ̀rọ̀ aláṣe náà mọ́, kò sì fi ‘áńgẹ́lì’ kún ọ̀rọ̀ tí Gíríìkì kò sọ ní tààrà.
- source_word: θίγῃ αὐτῶν
  choice: má bàa fọwọ́ kan wọn
  rationale: ‘Fọwọ́ kan’ pa ìtumọ̀ gangan θίγῃ mọ́, bí ó tilẹ̀ jẹ́ pé fífi ọwọ́ kan náà yóò fa ìparun ní àyíká yìí. ‘Wọn’ tún pa ìtọ́kasí arọ́pò-orúkọ Gíríìkì mọ́.
theological_decisions:
- issue: Ẹni tí ‘ó’ ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ ‘ó’ mọ́; Mósè ni àyíká ọ̀rọ̀ ń tọ́ka sí.
  alternative: Kí a sọ ‘Mósè’ ní tààrà.
  rationale: Àwọn ẹsẹ 23–29 dá lórí Mósè, ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ tí ó wà nínú ìṣe náà, kò pe orúkọ Mósè ní ẹsẹ yìí.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Kókó gbogbo Hébérù 11 fi ‘ìgbàgbọ́’ múlẹ̀ níbí; ‘ìṣòtítọ́’ kò bá àyíká yìí mu tó.
- issue: Ìdánimọ̀ ẹni tí ń pa àwọn àkọ́bí run
  choice: ẹni tí ń pa àwọn àkọ́bí run
  alternative: áńgẹ́lì apanirun
  rationale: Ọ̀rọ̀ Gíríìkì kò pe ẹni náà ní áńgẹ́lì, nítorí náà a yẹra fún fífi ìdánimọ̀ tí kò hàn gbangba sínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá àkójọpọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. ‘Ìrékọjá’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún Passover; a kò fi ‘àsè’ tàbí ‘oúnjẹ’ kún un kí ìtumọ̀ rẹ̀ má bàa dín kù.
