base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: yo
  text: Nípa ìgbàgbọ́, Mósè[a], nígbà tí ó ti dàgbà, kọ̀ láti jẹ́ kí wọ́n pè é ní ọmọkùnrin ọmọbìnrin Fáráò,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípa ìdúróṣinṣin,” tàbí “Nípa ìgbẹ́kẹ̀lé”; ọ̀rọ̀ Gíríìkì ni πίστει. Níhìn-ín, ọ̀rọ̀ àkọ́kọ́ tẹ̀ lé àgbékalẹ̀ tó ń tún ara rẹ̀ ṣe nínú orí yìí pé, “Nípa ìgbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ohun èlò ni ó wà níbí; ọ̀rọ̀ yìí sì tún ara rẹ̀ ṣe gẹ́gẹ́ bí àgbékalẹ̀ pàtàkì jákèjádò Hébérù 11. ‘Nípa ìgbàgbọ́’ jẹ́ èdè Yorùbá àdánidá fún ìṣe tí ìgbàgbọ́ mú kí ó ṣeé ṣe.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ìkọ orúkọ Mósè tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: μέγας γενόμενος
  choice: nígbà tí ó dàgbà
  rationale: Nínú àyíká yìí, gbólóhùn náà ń tọ́ka sí dídàgbà dé ipò àgbà, kì í ṣe sí dídi ẹni ńlá ní ipò tàbí ọlá.
- source_word: ἠρνήσατο
  choice: kọ̀
  rationale: Ọ̀rọ̀ náà fi ìkọ̀sílẹ̀ tí a mọ̀ọ́mọ̀ ṣe hàn; ‘kọ̀’ bá àfikún ọ̀rọ̀-ìṣe tó tẹ̀ lé e mu ní èdè Yorùbá.
- source_word: λέγεσθαι
  choice: láti jẹ́ kí a máa pè é ní
  rationale: Èyí mú ìtumọ̀ ọ̀rọ̀-ìṣe aláìṣe náà, ‘kí a pè é,’ jáde lọ́nà Yorùbá tó rọ̀, ó sì so mọ́ ‘kọ̀’ lọ́nà àdánidá.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: ọmọ ọmọbìnrin Fáráò
  rationale: Ó tọ́ka sí ìdánimọ̀ Mósè pàtó gẹ́gẹ́ bí ọmọ ọmọbìnrin Fáráò; Yorùbá kò nílò àmì ìdánimọ̀ bí ‘the’ níbi yìí.
- source_word: Φαραώ
  choice: Fáráò
  rationale: Èyí ni ìkọ oyè náà tí ó wọ́pọ̀, pẹ̀lú àmì ohùn Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àgbékalẹ̀ tó ń tún ara rẹ̀ ṣe ní Hébérù 11
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: Àyíká orí kọkànlá tẹnumọ́ àwọn ìṣe tí a ṣe nípasẹ̀ ìgbàgbọ́. Síbẹ̀, àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tí ọ̀rọ̀ Gíríìkì lè ní mọ́.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘jẹ́ kí a máa pè é ní’ láti mú ìsọ aláìṣe Gíríìkì jáde lọ́nà àdánidá; àmì ohùn ni a fi sí ibi tí ó yẹ.
