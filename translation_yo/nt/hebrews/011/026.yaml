id: HEB.11.26
reference: Hebrews 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: yo
  text: Ó ka ẹ̀gàn Mèsáyà[a][b] sí ohun ìní tí ó níye lórí ju àwọn ìṣúra ilẹ̀ Ejibiti lọ, nítorí ó ń wo ẹ̀san náà sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ̀gàn Kristi.” Ọ̀rọ̀ Gíríìkì Χριστοῦ lè jẹ́ “Kristi,” ṣùgbọ́n a lo “Mèsáyà” níhìn-ín nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: b
    text: Gbólóhùn náà, “ẹ̀gàn Mèsáyà,” lè túmọ̀ sí ẹ̀gàn tí a fara dà nítorí Mèsáyà, ẹ̀gàn tí a pín pẹ̀lú ẹni àmì òróró Ọlọ́run, tàbí ẹ̀gàn tí ìwé Hébérù rí pé ó ní ìmúṣẹ nínú Mèsáyà. A pa ọ̀nà tí Gíríìkì gbà sọ ọ́ mọ́ láìdín ìtumọ̀ rẹ̀ kù sí ọ̀kan ṣoṣo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: ọrọ̀ tí ó pọ̀ ju
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi iye ohun méjì wé ara wọn. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìfiwéra pẹ̀lú àwọn ìṣúra Ejibiti mọ́.
- source_word: ἡγησάμενος
  choice: Ó ka ... sí
  rationale: ἡγέομαι níhìn-ín túmọ̀ sí kí ènìyàn gbé ohun yẹ̀ wò, kí ó sì kà á sí ohun kan; ọ̀nà yìí ṣe kedere ní Yorùbá.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: àwọn ìṣúra ilẹ̀ Ejibiti
  rationale: Ó ṣe àfihàn àwọn ohun iyebíye tí Ejibiti ní, ó sì jẹ́ gbólóhùn Yorùbá tí ó rọrùn láti lóye.
- source_word: τὸν ὀνειδισμὸν
  choice: ẹ̀gàn
  rationale: ὀνειδισμός lè tọ́ka sí ẹ̀gàn, àbùkù, tàbí ìtìjú tí a ń fi kan ènìyàn. “Ẹ̀gàn” pa ìtumọ̀ ìkọlù ní gbangba mọ́ láìfi àlàyé kún un.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” fi iṣẹ́ oyè náà hàn, ó sì yẹra fún mímú un bí orúkọ lásán.
- source_word: ἀπέβλεπεν
  choice: ó ń fojú sọ́nà fún
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìfojúsùn tí ó ń bá a lọ hàn. Gbólóhùn Yorùbá yìí sọ ìfojúsùn sí ohun tí ń bọ̀ lọ́nà àdánidá.
- source_word: μισθαποδοσίαν
  choice: èrè náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí èrè tàbí ohun tí a fi san padà; “èrè” jẹ́ ọ̀rọ̀ òde òní tí ó ṣe kedere nínú àyíká ìgbàgbọ́ àti ìfaradà.
theological_decisions:
- issue: Ìtumọ̀ “ẹ̀gàn Mèsáyà” ní ìbáṣepọ̀ pẹ̀lú Mósè
  choice: Pa gbólóhùn ìní náà mọ́ gẹ́gẹ́ bí “ẹ̀gàn Mèsáyà,” láìṣàlàyé rẹ̀ sínú ara ẹsẹ.
  alternative: “ẹ̀gàn nítorí Mèsáyà,” “ẹ̀gàn tí ó pín pẹ̀lú ẹni àmìòróró Ọlọ́run,” tàbí “ẹ̀gàn tí ó ń tọ́ka sí Mèsáyà níwájú”
  rationale: Gíríìkì náà kò sọ pàtó irú ìbáṣepọ̀ tí ọ̀rọ̀-ìní náà ń fi hàn. Ìtumọ̀ yìí pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ nípa Mèsáyà mọ́, dípò yíyan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Ó ka ... sí” àti “ó ń fojú sọ́nà fún” jẹ́ gbólóhùn àdánidá tí ó tún pa agbára àwọn ọ̀rọ̀ Gíríìkì mọ́.
