  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé èrò Gíríìkì dáadáa ní gbogbogbò, ó sì pa ìbáṣepọ̀ àìpàtó nínú "ẹ̀gàn Mèsáyà" mọ́. Síbẹ̀, "èrè" sábà máa ń túmọ̀ sí èrè ìṣòwò, kò sì dáa tó fún μισθαποδοσία, ẹni tí ìtumọ̀ rẹ̀ níhìn-ín jẹ́ ẹ̀san/tabi ìsanpadà. "Ó ń fojú sọ́nà fún" tún kún ìtumọ̀ "ń retí" tàbí "ń dúró de" sínú ἀπέβλεπεν ju bí ó ti yẹ lọ; "ó ń wo ... sí" dá ìtẹnumọ́ ìfojúsùn tí ó ń bá a lọ dúró dáadáa.
  naturalness: '"Ó ka ... sí" jẹ́ àdánidá. A tún ṣe àtúnṣe apá ìfiwéra náà sí "ohun ìní tí ó níye lórí ju" kí ó má bàa dà bí ìfiwéra iye ọ̀rọ̀ nìkan. "Ó ń wo ẹ̀san náà sí" jẹ́ ọ̀nà Yorùbá tí ó hàn gbangba, tí ó sì sun mọ́ ìtumọ̀ ọ̀rọ̀-ìṣe Gíríìkì náà.'
  terminology: A pa "Mèsáyà" mọ́ gẹ́gẹ́ bí ìtumọ̀ oyè Χριστοῦ, ní ìbámu pẹ̀lú ìlànà iṣẹ́ náà. "Ẹ̀san" dára ju "èrè" lọ fún μισθαποδοσία nítorí ó lè tọ́ka sí ẹ̀san tàbí ìsanpadà tí a ń retí, láìfi èrò èrè ìṣòwò kún un.
