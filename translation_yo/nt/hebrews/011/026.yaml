    rationale: Ó lè gbọ́ bí ọ̀rọ̀ tí ó pọ̀ ní iye. "Ohun ìní tí ó níye lórí ju" fi ìfiwéra iye/ìní tí Gíríìkì ń ṣe hàn ní Yorùbá aláìdàrú.
