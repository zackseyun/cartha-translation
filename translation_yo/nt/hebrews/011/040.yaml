  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: yo
  text: nítorí Ọlọ́run ti pèsè ohun kan tí ó dára jù fún wa[a], kí wọ́n má bàa dé ìmúṣẹ pípé láìsí wa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti rí ohun kan tí ó dára jù tẹ́lẹ̀ fún wa,” tàbí “ti ṣètò ohun kan tí ó dára jù tẹ́lẹ̀ fún wa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí rírí ohun tẹ́lẹ̀ tàbí pípèsè rẹ̀ tẹ́lẹ̀; àyíká ọ̀rọ̀ náà tẹ̀ sí ìpèsè tàbí ètò Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a má bàa sọ wọ́n di pípé láìsí wa,” tàbí “kí wọ́n má bàa dé ìparí pípé ní ọ̀tọ̀ sí wa.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: ti pèsè
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí Ọlọ́run ti pèsè tàbí ṣètò tẹ́lẹ̀, kì í ṣe sí mímọ ohun ọjọ́ iwájú lásán. Àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
- source_word: κρεῖττόν τι
  choice: ohun kan tí ó dára jù
  rationale: Èyí pa àfiwé ‘tí ó dára jù’ mọ́, èyí tí ó jẹ́ kókó ọ̀rọ̀ tí a máa ń rí léraléra nínú Hébérù, ó sì fi ìwà àìní pàtó ti τι hàn.
- source_word: περὶ ἡμῶν
  choice: fún wa
  rationale: Nínú ìsopọ̀ rẹ̀ pẹ̀lú προβλεψαμένου, ‘fún wa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run ṣe ìpèsè náà pẹ̀lú wa lọ́kàn.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ìkọ̀lé yìí fi ète tàbí àbájáde tí a fẹ́ dènà hàn lọ́nà Yorùbá àdánidá.
- source_word: χωρὶς ἡμῶν
  choice: láìsí wa
  rationale: Èyí túmọ̀ sí pé a kò mú wọn dé ìpé ní ọ̀tọ̀ sí wa; ó pa ìtumọ̀ ìṣọ̀kan ẹgbẹ́ náà mọ́.
- source_word: τελειωθῶσιν
  choice: mú wọn dé ìpé
  rationale: Gbólóhùn yìí pa ìtumọ̀ mímú dé pípé tàbí ìparí mọ́ láìfi í mọ́ ìwà pípé nìkan. Ohun tí a ṣe sí wọn ni ìṣe náà, gẹ́gẹ́ bí fọ́ọ̀mù páṣífù Gíríìkì.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ọlọ́run ni olùṣe nínú gbólóhùn alábápín oníjẹ́nítífù náà; ‘nítorí Ọlọ́run...’ sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹsẹ tó ṣáájú lọ́nà kedere.
theological_decisions:
- issue: Ìtumọ̀ τελειωθῶσιν nínú àyíká ìtàn ìgbàlà ti Hébérù
  choice: mú wọn dé ìpé
  alternative: sọ wọn di pípé; mú wọn dé òpin pípé
  rationale: ‘Mú wọn dé ìpé’ jẹ́ kí ọ̀rọ̀ náà lè gbé ìtumọ̀ ìparí, ìmúṣẹ, àti pípé papọ̀, láìdín in kù sí ìwà rere pípé tàbí sí déédé àkókò ìparí nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘ohun kan tí ó dára jù’ láti pa àkòrí àfiwé Hébérù mọ́, àti ‘mú wọn dé ìpé’ láti pa ìtumọ̀ ọlọ́rọ̀ τελειόω mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
