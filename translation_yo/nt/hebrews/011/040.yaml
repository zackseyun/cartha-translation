revisions:
- from: nítorí Ọlọ́run ti pèsè ohun kan tí ó dára jù fún wa[a], kí a má bàa mú wọn dé ìpé láìsí wa.[b]
  to: nítorí Ọlọ́run ti pèsè ohun kan tí ó dára jù fún wa[a], kí wọ́n má bàa dé ìmúṣẹ pípé láìsí wa.[b]
  rationale: The final clause has been revised to remove the misleading appearance that ‘we’ are the agent of completion. ‘Kí wọ́n má bàa dé ìmúṣẹ pípé láìsí wa’ keeps the Greek negative purpose, the corporate ‘apart from us,’ and the eschatological completion sense of τελειωθῶσιν. Footnote b supplies a closer passive-causative alternative and a completion-oriented alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:31:34Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering of God's prior provision, the comparative ‘something better,’ and ‘for us’ is faithful. However, the main clause ‘kí a má bàa mú wọn dé ìpé’ makes ‘we’ the apparent agent who would bring them to completion, whereas τελειωθῶσιν is passive and has ‘they’ as its subject. The revision restores them as the participants who attain the stated completion, while avoiding an unnecessary specification of the agent.
  naturalness: ‘Kí wọ́n má bàa dé ìmúṣẹ pípé láìsí wa’ is clear, idiomatic Standard Yorùbá in a formal biblical register. It conveys consummation/completion more naturally than a literal passive calque.
  terminology: ‘Ohun kan tí ó dára jù’ properly retains Hebrews’ recurring comparative language. ‘Ìmúṣẹ pípé’ preserves the completion/perfection range of τελειόω without reducing it to moral flawlessness. The footnotes retain the viable alternatives of foresight/provision and perfection/completion.
  issues:
  - severity: medium
    issue: The draft’s final purpose clause assigns the action to ‘we.’
    rationale: In ‘kí a má bàa mú wọn dé ìpé,’ a straightforward reading is ‘so that we might not bring them to completion.’ The Greek says ‘so that they might not be perfected/completed apart from us.’
  revised_text: nítorí Ọlọ́run ti pèsè ohun kan tí ó dára jù fún wa[a], kí wọ́n má bàa dé ìmúṣẹ pípé láìsí wa.[b]
