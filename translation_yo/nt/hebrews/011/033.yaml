id: HEB.11.33
reference: Hebrews 11:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: yo
  text: Àwọn ẹni tí wọ́n, nípasẹ̀ ìgbàgbọ́[a], ṣẹ́gun àwọn ìjọba, ṣe ohun tí ó tọ́[b], rí àwọn ìlérí gbà, tí wọ́n sì dí ẹnu àwọn kìnnìún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìgbàgbọ́.” Gbólóhùn náà fi hàn pé ìgbàgbọ́ wọn nínú Ọlọ́run ni ọ̀nà tí wọ́n fi ṣe àwọn ohun wọ̀nyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú òdodo ṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwà títọ́ tàbí ìdájọ́ òdodo, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó fi διά pẹ̀lú ọ̀rọ̀ olùní hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò tí wọ́n fi ṣe àwọn iṣẹ́ náà. “Ìgbàgbọ́” bá kókó Hébérù 11 mu, ó sì jẹ́ ọ̀rọ̀ tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: κατηγωνίσαντο βασιλείας
  choice: ṣẹ́gun àwọn ìjọba
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí láti borí tàbí tẹ ohun kan ba nínú ìjà; “ṣẹ́gun” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìtumọ̀ ológun àti ti ìṣèlú mọ́.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: ṣe ohun tí ó tọ́
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere ju lílo gbólóhùn líle bí “ṣiṣẹ́ òdodo” lọ. Ó pa ìtumọ̀ ìṣe ìwà títọ́ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn “mú òdodo ṣẹ” pamọ́.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: rí àwọn ìlérí gbà
  rationale: Ó túmọ̀ sí pé wọ́n dé ibi tí wọ́n ti gba tàbí ní ohun tí a ṣèlérí, láì pinnu bóyá gbogbo ìlérí náà ṣẹ ní kíkún; èyí pa ìfọ̀rọ̀wérọ̀ inú Hébérù mọ́.
- source_word: ἔφραξαν στόματα λεόντων
  choice: dí ẹnu àwọn kìnnìún
  rationale: “Dí ẹnu” jẹ́ gbólóhùn Yorùbá àdánidá fún dídẹ́kun ẹnu, ó sì pa àwòrán alágbára inú Gíríìkì mọ́ láì sọ ìtọ́kasí sí Dáníẹ́lì ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àkọsílẹ̀ Hébérù 11
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí fífi ara lé Ọlọ́run gẹ́gẹ́ bí ohun tí ó mú kí àwọn ènìyàn náà ṣiṣẹ́. “Ìgbàgbọ́” pa kókó gbogbo orí náà mọ́ láì sọ ọ́ di “ìṣòtítọ́” nìkan.
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká tí kì í ṣe ti Pọ́ọ̀lù
  choice: ṣe ohun tí ó tọ́
  alternative: mú òdodo ṣẹ
  rationale: Àyíká náà ń sọ nípa iṣẹ́ àwọn olóòótọ́, nítorí náà ìṣe ohun tí ó tọ́ ni àkọ́kọ́. Síbẹ̀, ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ìdájọ́ òdodo, a sì pa èyí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: 'Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹra fún àṣà ọ̀rọ̀ àtijọ́ tí ó le fún òǹkàwé. A tún gbé àmì àlàyé sí ibi tí ọ̀kọ̀ọ̀kan ti bá ọ̀rọ̀ Gíríìkì mu: [a] lẹ́yìn “ìgbàgbọ́,” [b] lẹ́yìn “ohun tí ó tọ́.”'
