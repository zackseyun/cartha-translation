  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni àwọn ògiri Jéríkò fi wó lulẹ̀, lẹ́yìn tí a ti yí wọn ká fún ọjọ́ méje[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “Pẹ̀lú ìgbàgbọ́.” Dátífù Gíríìkì πίστει lè sọ ọ̀nà tàbí bí ìṣẹ̀lẹ̀ náà ṣe wáyé; ọ̀rọ̀ inú ẹsẹ̀ náà pa àgbékalẹ̀ àsọtúnsọ Hébérù 11 mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù yìí lè tọ́ka sí ọ̀nà tàbí ìṣe tí ohun kan fi ṣẹlẹ̀. “Nípa ìgbàgbọ́” bá ọ̀rọ̀ àsọtúnsọ orí 11 mu, ó sì dá ìtumọ̀ ìgbàgbọ́ dúró láìfi ipa aṣojú kan tí Gíríìkì kò sọ kún un.
- source_word: τὰ τείχη
  choice: àwọn ògiri
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ògiri ìlú; “àwọn ògiri” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́.
- source_word: Ἰεριχὼ
  choice: Jéríkò
  rationale: Orúkọ ìlú náà ni a kọ ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: ἔπεσαν
  choice: wó lulẹ̀
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ sí pé wọ́n ṣubú; nípa ògiri, “wó lulẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi àlàyé míì kún un.
- source_word: κυκλωθέντα
  choice: lẹ́yìn tí a ti yí wọn ká
  rationale: Partísípù pásífù náà fi hàn pé yíyí àwọn ògiri ká ti ṣẹlẹ̀ ṣáájú bí wọ́n ṣe wó. Ìtumọ̀ yìí kò sọ ẹni tó yí wọn ká, gẹ́gẹ́ bí Gíríìkì kò ṣe sọ ọ́ níhìn-ín.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: fún ọjọ́ méje
  rationale: ἐπί pẹ̀lú àkúsátífù níhìn-ín ń sọ iye àkókò; “fún ọjọ́ méje” ni ọ̀nà Yorùbá tó ṣe déédé jù láti sọ ọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú Hébérù 11:30
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àgbékalẹ̀ àsọtúnsọ inú Hébérù 11 àti àyíká àwọn àpẹẹrẹ ẹni tó gbàgbọ́ ṣe àtìlẹ́yìn fún “ìgbàgbọ́.” A kò yí i sí “ìṣòtítọ́,” nítorí èyí lè dá ìtẹnumọ́ ẹsẹ̀ náà sí ibòmíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ni … fi” láti mú ìbáṣepọ̀ ọ̀nà àti àbájáde jáde lọ́nà àdánidá, a sì pa pásífù aláìdárúkọ olùṣe mọ́ ní “a ti yí wọn ká.”
