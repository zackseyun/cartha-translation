source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: yo
  text: Nítorí ó ń dúró de ìlú tí ó ní àwọn ìpìlẹ̀[a], tí Ọlọ́run jẹ́ olùṣètò àti olùkọ́lé rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú tí ó ní ìpìlẹ̀.” Ọ̀pọ̀ náà, “àwọn ìpìlẹ̀,” lè tẹnu mọ́ ìdúróṣinṣin àti pípa títí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí Ọlọ́run jẹ́ oníṣẹ́ ọnà àti olùṣe rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: ó ń dúró de
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí fi ìdúró pẹ̀lú ìfojúsọ́nà tí ó ń bá a lọ hàn ní àkókò ìṣáájú; “ó ń dúró de” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yẹn mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé tí ẹsẹ yìí ní sí ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: ìlú tí ó ní àwọn ìpìlẹ̀
  rationale: Ó tẹ̀lé àwòrán Gíríìkì ní kedere, ó sì pa ọ̀pọ̀ “àwọn ìpìlẹ̀” mọ́ láì fi “ọ̀run” tàbí “títí láé” kún un.
- source_word: θεμελίους
  choice: àwọn ìpìlẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn ìpìlẹ̀ ilé; ọ̀pọ̀ rẹ̀ tún lè tẹnu mọ́ ìdúróṣinṣin.
- source_word: πόλιν
  choice: ìlú
  rationale: “Ìlú” jẹ́ ìtumọ̀ Yorùbá àdánidá, tó sì bá kókó ọ̀rọ̀ inú Hébérù mu.
- source_word: ἧς
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ ìní yìí tọ́ka padà sí ìlú náà, ó sì so àwọn oyè tó tẹ̀ lé e mọ́ ọn ní Yorùbá àdánidá.
- source_word: τεχνίτης
  choice: ayàwòrán
  rationale: Nínú àkójọpọ̀ pẹ̀lú δημιουργός, “ayàwòrán” mú ipa ẹni tó ṣe ètò àti àwòrán ilé jáde, láì dà á pọ̀ mọ́ ẹni tó kọ́ ọ.
- source_word: δημιουργός
  choice: olùkọ́
  rationale: Nínú ọ̀rọ̀ nípa ìlú, “olùkọ́” pa àwòrán iṣẹ́ ìkọ́lé mọ́, ó sì bá “ayàwòrán” ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ méjì tó yàtọ̀.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá tó bójú mu fún ẹni tí gbólóhùn náà fi hàn gẹ́gẹ́ bí olùṣe.
theological_decisions:
- issue: Irú ìlú tí a ṣèlérí
  choice: ìlú tí ó ní àwọn ìpìlẹ̀
  alternative: ìlú ọ̀run; ìlú tí ó ní àwọn ìpìlẹ̀ tó dúró ṣinṣin
  rationale: Ẹsẹ náà kò pe ìlú náà ní “ti ọ̀run” ní tààràtà, bẹ́ẹ̀ ni kò fi ọ̀rọ̀ “títí láé” kún ìpìlẹ̀ rẹ̀. Ìtumọ̀ náà pa àwòrán àti àìsọ pàtó inú orísun mọ́.
- issue: Ìbáṣepọ̀ τεχνίτης àti δημιουργός
  choice: ayàwòrán àti olùkọ́
  alternative: olùṣètò àti olùṣe
  rationale: Àṣàyàn yìí pa ìyàtọ̀ tó ṣeé ṣe láàárín ẹni tó ṣe ètò àti ẹni tó mú iṣẹ́ náà ṣẹ mọ́, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ jẹ́wọ́ pé àwọn ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ tó gbòòrò sí i.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. “Ó ń dúró de” jẹ́ àdánidá fún ìṣe tó ń bá a lọ; “ayàwòrán àti olùkọ́” sì pa àwòrán ìkọ́lé àti ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́. Gbogbo àmì àkọsílẹ̀ ìsàlẹ̀ farahàn nínú ọ̀rọ̀ pàtàkì.
