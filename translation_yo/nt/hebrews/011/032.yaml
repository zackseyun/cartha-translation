id: HEB.11.32
reference: Hebrews 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: yo
  text: Kí sì ni mo tún lè sọ? Nítorí àkókò kò ní tó fún mi[a] bí mo bá ń ròyìn nípa Gídíónì, Bárákì, Sámúsìnì, Jẹ́fútà, Dáfídì, àti pẹ̀lú Sámúẹ́lì àti àwọn wòlíì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà pẹ́kípẹ́kí, “Nítorí àkókò yóò kùnà fún mi bí mo ti ń ròyìn nípa…”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Kí ni èmi yóò tún sọ?
  rationale: Ìbéèrè àsọyé yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé àwọn àpẹẹrẹ mìíràn ṣì wà, ṣùgbọ́n a kò ní ṣàlàyé wọn ní gígùn.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: Nítorí àkókò yóò tán lórí mi
  rationale: Ó pa ìrísí ọjọ́ iwájú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere pé àkókò kò ní tó fún olùsọ.
- source_word: διηγούμενον
  choice: bí mo bá ń sọ
  rationale: Ó mú ìṣe tí ń lọ lọ́wọ́ àti ipò àròjinlẹ̀ tí participle náà ní jáde ní Yorùbá àdánidá.
- source_word: περὶ
  choice: nípa
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ jù lọ fún fífi kókó ìtàn tàbí àsọyé hàn.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gídíónì, Bárákì, Sámúsìnì, Jẹ́fútà, Dáfídì, Sámúẹ́lì
  rationale: A lo àwọn ìrísí orúkọ Bíbélì tí ó ti wọ́pọ̀, tí a sì kọ wọ́n pẹ̀lú àmì ohùn Yorùbá.
- source_word: τε καὶ
  choice: àti pẹ̀lú
  rationale: Ó pa agbára àfikún inú ìsopọ̀ Gíríìkì mọ́ láì sọ ìbáṣepọ̀ àwọn orúkọ náà di ohun tí ó ju ohun tí ẹsẹ̀ sọ lọ.
- source_word: τῶν προφητῶν
  choice: àwọn wòlíì
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tààrà, tí ó sì pa ìtumọ̀ ẹgbẹ́ ọ̀pọ̀ mọ́.
theological_decisions:
- issue: Agbára àsọyé ti gbólóhùn nípa àkókò
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìsọ pé àkókò kò ní tó bí òǹkọ̀wé bá ń bá ìtàn náà lọ.
  alternative: Àkókò yóò fi mí sílẹ̀ bí mo ti ń ròyìn…
  rationale: Yíyan yìí pa iṣẹ́ àsọyé náà mọ́, kò sì sọ pé òǹkọ̀wé kò ní àkókò rárá.
- issue: Ìtòlẹ́sẹẹsẹ Dáfídì, Sámúẹ́lì, àti àwọn wòlíì
  choice: “Dáfídì, àti pẹ̀lú Sámúẹ́lì àti àwọn wòlíì”
  alternative: “Dáfídì àti Sámúẹ́lì àti àwọn wòlíì”
  rationale: “Àti pẹ̀lú” fi ìtumọ̀ àfikún τε καὶ hàn, nígbà tí ó ṣì jẹ́ kí Sámúẹ́lì àti ẹgbẹ́ àwọn wòlíì dúró láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìbéèrè àsọyé àti ìrísí ọjọ́ iwájú Gíríìkì mọ́.
