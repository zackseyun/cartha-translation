id: HEB.11.34
reference: Hebrews 11:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: yo
  text: wọ́n pa agbára iná kú, wọ́n bọ́ lọ́wọ́ ojú idà[a], a sọ wọ́n di alágbára láti inú àìlera, wọ́n di alágbára ní ojú ogun, wọ́n sì lé àwọn ọmọ ogun àjèjì sá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “ẹnu idà”; ọ̀rọ̀ àpèjúwe fún ojú idà tí ń gé.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí “àwọn ibùdó ológun”; níhìn-ín ó ń tọ́ka sí àwọn ẹgbẹ́ ọmọ ogun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: wọ́n pa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípa tàbí mímú iná kú; “pa” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípa iná.
- source_word: δύναμιν πυρός
  choice: agbára iná
  rationale: Ó pa ìtumọ̀ δύναμις mọ́, kì í sì í sọ ọ́ di “iná” lásán.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: wọ́n bọ́ lọ́wọ́ ojú idà
  rationale: ἔφυγον ń tọ́ka sí yíyè kúrò nínú ewu; “ojú idà” jẹ́ ọ̀nà Yorùbá tó ṣeé lóye fún apá idà tí ń gé, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: a sọ wọ́n di alágbára láti inú àìlera
  rationale: “A sọ wọ́n di” pa ohùn àìṣe (passive) mọ́ láìdárúkọ ẹni tó fún wọn ní agbára; “láti inú àìlera” fi orísun tàbí ipò tí wọ́n jáde kúrò nínú rẹ̀ hàn.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: wọ́n di alágbára ní ojú ogun
  rationale: Ó fi hàn pé wọ́n wọ ipò agbára, “ní ojú ogun” sì jẹ́ gbólóhùn Yorùbá àdánidá fún ìjà ológun.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: wọ́n sì lé àwọn ọmọ ogun àjèjì sá
  rationale: Ní àyíká ogun, παρεμβολή lè dúró fún ibùdó ológun tàbí àwọn ọmọ ogun inú rẹ̀; ἔκλιναν níhìn-ín túmọ̀ sí mímú kí ọ̀tá yí padà tàbí sá.
theological_decisions:
- issue: Bí a ṣe máa mú àwòrán ìgbàlà àti ìṣẹ́gun àwọn akọni ìgbàgbọ́ jáde
  choice: Pa àwọn àwòrán gidi ti iná, idà, àìlera, ogun àti ọmọ ogun ọ̀tá mọ́
  alternative: Ṣàkópọ̀ wọn sí ìṣẹ́gun lórí ewu àti ọ̀tá ní gbogbogbòò
  rationale: Àyọkà náà ń to àwọn ìṣe àti ìrírí gidi lẹ́sẹẹsẹ; ṣíṣe wọn ní ti ẹ̀mí lásán yóò mú kúró nínú ìtumọ̀ orísun.
- issue: Ẹni tó sọ àwọn aláìlera di alágbára
  choice: Lo ọ̀nà àìṣe, “a sọ wọ́n di alágbára,” láìdárúkọ olùṣe
  alternative: Sọ ní tààrà pé Ọlọ́run sọ wọ́n di alágbára
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ passive, ṣùgbọ́n kò dárúkọ olùṣe; ìtumọ̀ náà kò gbọ́dọ̀ fi ohun tí a lérò kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìtẹ̀síwájú àwọn gbólóhùn ìṣe inú orísun mọ́.
