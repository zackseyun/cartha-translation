  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni Ábúráhámù fi Ísáákì rú ẹbọ nígbà tí a ń dán an wò; òun tí ó ti gba àwọn ìlérí náà sì ń fi ọmọ rẹ̀ aláìlẹ́gbẹ́ rú ẹbọ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ọmọ rẹ̀ kan ṣoṣo.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé ọmọ náà ṣàrà ọ̀tọ̀; ìtumọ̀ àṣà kan ni “ọmọ bíbí kan ṣoṣo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò tí Ábúráhámù fi ṣe ohun náà, ó sì bá àtúnlò gbólóhùn náà ní gbogbo orí 11 mu.
- source_word: προσενήνοχεν
  choice: fi Ísáákì rú ẹbọ
  rationale: Ọ̀rọ̀ náà ní agbára ìrúbọ; lílo ọ̀rọ̀ ìṣe àtẹ̀yìnwá ní Yorùbá jẹ́ àdánidá nínú àkótán ìtàn yìí.
- source_word: πειραζόμενος
  choice: nígbà tí a ń dán an wò
  rationale: Ó pa ìtumọ̀ aláìṣe àti ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì túmọ̀ sí ìdánwò ìgbàgbọ́, kì í ṣe fífà sí ẹ̀ṣẹ̀.
- source_word: μονογενῆ
  choice: ọmọ rẹ̀ kan ṣoṣo tí kò lẹ́gbẹ́
  rationale: Ó tẹnumọ́ ipò Ísáákì gẹ́gẹ́ bí ọmọ aláìlẹ́gbẹ́ àti ajogún ìlérí, láìsọ pé Ábúráhámù kò ní ọmọ mìíràn nípa ti ara.
- source_word: προσέφερεν
  choice: ń fi ... rú ẹbọ
  rationale: Àmì ‘ń’ pa ìrísí ìṣe tí ń lọ lọ́wọ́ nínú imperfect mọ́, ó sì mú ìṣẹ̀lẹ̀ náà hàn kedere.
- source_word: ἀναδεξάμενος
  choice: ẹni tí ó ... ti gba
  rationale: ‘Gba’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígba àwọn ìlérí, ‘ti’ sì fi ìṣe tó ṣáájú hàn.
- source_word: ἐπαγγελίας
  choice: àwọn ìlérí náà
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́, ó sì tọ́ka sí àkójọpọ̀ àwọn ìlérí Ọlọ́run sí Ábúráhámù.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so apá kejì mọ́ ti àkọ́kọ́ lọ́nà Yorùbá tí ó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ μονογενῆ nípa Ísáákì, bí ó tilẹ̀ jẹ́ pé kì í ṣe òun nìkan ni ọmọ Ábúráhámù nípa ti ara
  choice: ọmọ rẹ̀ kan ṣoṣo tí kò lẹ́gbẹ́
  alternative: ọmọ rẹ̀ kan ṣoṣo; ọmọ rẹ̀ aláìlẹ́gbẹ́; ọmọ bíbí rẹ̀ kan ṣoṣo
  rationale: Ìtumọ̀ yìí fi Ísáákì hàn gẹ́gẹ́ bí ọmọ tó ṣàrà ọ̀tọ̀ àti ajogún ìlérí, láìṣe àfikún èrò pé Ábúráhámù kò ní ọmọ mìíràn tàbí kó fa èdè ẹ̀kọ́ Kristi tó wá lẹ́yìn sínú àyíká yìí.
- issue: Ìbáṣepọ̀ perfect προσενήνοχεν àti imperfect προσέφερεν
  choice: fi ... rú ẹbọ; ... ń fi ... rú ẹbọ
  alternative: fi ... rú ẹbọ ní ibi méjèèjì
  rationale: Ìyàtọ̀ yìí pa ìrísí ìṣe Gíríìkì mọ́ dé ibi tí Yorùbá àdánidá ti lè gbà á, láìdáhùn nípa bí ìrúbọ náà ṣe parí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. ‘Rú ẹbọ’ pa àwọ̀ ìrúbọ inú προσφέρω mọ́; ‘dán an wò’ yà ìdánwò ìgbàgbọ́ sọ́tọ̀ kúrò nínú ìdẹwò sí ẹ̀ṣẹ̀. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ní μονογενῆ.
