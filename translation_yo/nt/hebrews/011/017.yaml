revisions:
- from: Nípa ìgbàgbọ́, Ábúráhámù, nígbà tí a ń dán an wò, fi Ísáákì rú ẹbọ; ẹni tí ó sì ti gba àwọn ìlérí náà ń fi ọmọ rẹ̀ kan ṣoṣo tí kò lẹ́gbẹ́ rú ẹbọ,[a]
  to: Nípa ìgbàgbọ́ ni Ábúráhámù fi Ísáákì rú ẹbọ nígbà tí a ń dán an wò; òun tí ó ti gba àwọn ìlérí náà sì ń fi ọmọ rẹ̀ aláìlẹ́gbẹ́ rú ẹbọ,[a]
