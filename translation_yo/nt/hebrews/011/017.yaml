  source_fidelity: Ìtumọ̀ náà ń pa ìyàtọ̀ tó wà láàárín προσενήνοχεν (‘fi rú ẹbọ’) àti προσέφερεν (‘ń fi rú ẹbọ’) mọ́, ó sì túmọ̀ πειραζόμενος ní ìbámu pẹ̀lú àyíká ìdánwò. Síbẹ̀, ‘kan ṣoṣo tí kò lẹ́gbẹ́’ jẹ́ ìtẹnumọ́ méjì tí ó pọ̀ ju fún μονογενῆ, ó sì lè dà bí àfikún ìtúmọ̀.
  naturalness: ‘Nípa ìgbàgbọ́ ni ... fi ...’ àti ‘òun tí ó ti gba ... náà sì ...’ jẹ́ ìṣètò Yorùbá boṣewa tó rọrùn. ‘Ọmọ rẹ̀ aláìlẹ́gbẹ́’ sọ ìyàsọ́tọ̀/ìkanṣoṣo náà ní kúkúrú, láìṣe ìtẹ̀lé-ọrọ̀ tí kò wúlò.
