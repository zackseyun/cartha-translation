revisions:
- from: Àti pé láìsí ìgbàgbọ́, kò ṣeé ṣe láti mú inú rẹ̀ dùn,[a] nítorí ẹni tí ó bá ń tọ Ọlọ́run wá gbọ́dọ̀ gbà pé ó wà,[b] àti pé ó máa ń fi ara rẹ̀ hàn gẹ́gẹ́ bí olùsan èrè fún àwọn tí ń fi taratara wá a.[c]
  to: Ṣùgbọ́n láìsí ìgbàgbọ́,[a] kò ṣeé ṣe láti mú inú Ọlọ́run dùn, nítorí ẹni tí ń súnmọ́ Ọlọ́run gbọ́dọ̀ gbàgbọ́ pé ó wà,[b] àti pé ó jẹ́ olùsan-ẹ̀san fún àwọn tí ń fi taratara wá a.[c]
  rationale: The revised text distinguishes approaching God from earnestly seeking him, removes an interpretive expansion of γίνεται from the main text, and improves Yoruba clarity and lexical accuracy in the notes. It preserves the source’s concise affirmation ‘that he is’ as pé ó wà and does not force a doctrinal interpretation of God’s character or of faith.
  reviewer_model: gpt-5.6-terra
