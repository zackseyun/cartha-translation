review_pass:
  verdict: revise
  source_fidelity: The draft conveys the two required beliefs and the intensified seeking well. However, ‘ẹni tí ó bá ń tọ Ọlọ́run wá’ conflates approaching God (προσερχόμενον τῷ θεῷ) with the later distinct expression of seeking him (ἐκζητοῦσιν αὐτόν). ‘Ó máa ń fi ara rẹ̀ hàn gẹ́gẹ́ bí’ also expands γίνεται into an interpretive, habitual self-revelation statement beyond the Greek.
  naturalness: 'The revision uses natural Standard Yoruba while retaining the source’s progression: faith, drawing near to God, belief that he is, and his being a rewarder. ‘Ṣùgbọ́n’ is a more natural mild continuation here than ‘Àti pé,’ and explicitly naming Ọlọ́run in the first clause avoids an antecedentless pronoun.'
  terminology: Ìgbàgbọ́ and gbàgbọ́ appropriately represent πίστις/πιστεῦσαι. ‘Súnmọ́ Ọlọ́run’ preserves the approach/draw-near sense, distinct from ‘wá a.’ ‘Olùsan-ẹ̀san’ is a clear rendering of μισθαποδότης. The footnote’s alternative for πίστις is corrected from ìṣòtítọ́ (‘truthfulness’) to ìdúróṣinṣin (‘faithfulness’).
  issues:
  - severity: medium
    issue: The rendering of προσερχόμενον as ‘ń tọ Ọlọ́run wá’ duplicates the following verb for seeking.
    rationale: The Greek deliberately uses προσέρχομαι (‘approach/draw near’) followed by ἐκζητέω (‘seek earnestly’). Yoruba should retain this distinction.
  - severity: medium
    issue: ‘Ó máa ń fi ara rẹ̀ hàn gẹ́gẹ́ bí olùsan èrè’ is overly interpretive for μισθαποδότης γίνεται.
    rationale: It introduces habitual action (‘máa ń’) and explicit self-disclosure not stated in the Greek. A direct predicate, with the verbal nuance retained in a note, is safer.
  - severity: low
    issue: The initial ‘Àti pé’ and the unanchored pronoun rẹ̀ are less idiomatic and less clear.
    rationale: A mild ‘Ṣùgbọ́n’ fits δέ, and naming God in the first clause supplies a clear referent.
  - severity: low
    issue: The footnote gloss ‘ìṣòtítọ́’ does not mean ‘faithfulness.’
    rationale: Ìṣòtítọ́ ordinarily means truthfulness; ìdúróṣinṣin is the appropriate Yoruba alternative where πίστις bears the sense faithfulness.
  revised_text: Ṣùgbọ́n láìsí ìgbàgbọ́,[a] kò ṣeé ṣe láti mú inú Ọlọ́run dùn, nítorí ẹni tí ń súnmọ́ Ọlọ́run gbọ́dọ̀ gbàgbọ́ pé ó wà,[b] àti pé ó jẹ́ olùsan-ẹ̀san fún àwọn tí ń fi taratara wá a.[c]
