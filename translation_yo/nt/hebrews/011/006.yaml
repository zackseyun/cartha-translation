  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: yo
  text: Ṣùgbọ́n láìsí ìgbàgbọ́,[a] kò ṣeé ṣe láti mú inú Ọlọ́run dùn, nítorí ẹni tí ń súnmọ́ Ọlọ́run gbọ́dọ̀ gbàgbọ́ pé ó wà,[b] àti pé ó jẹ́ olùsan-ẹ̀san fún àwọn tí ń fi taratara wá a.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìgbàgbọ́ sí ‘ìgbẹ́kẹ̀lé.’ Ní àwọn àyíká kan, πίστις lè ní ìtumọ̀ ‘ìdúróṣinṣin,’ ṣùgbọ́n níbí, àlàyé tó tẹ̀ lé e dá lórí gbígba Ọlọ́run gbọ́.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààràtà: ‘pé ó wà.’ Gíríìkì náà ṣókí; ọ̀rọ̀ náà lè tọ́ka sí ìjẹ́gidi Ọlọ́run.'
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé ‘ó di olùsan-ẹ̀san’ tàbí ‘ó fi ara rẹ̀ hàn pé ó jẹ́ olùsan-ẹ̀san.’ Gíríìkì lo ọ̀rọ̀-ìṣe tó túmọ̀ sí ‘di’; ní àyíká yìí, ó lè sọ ohun tí Ọlọ́run hàn pé ó jẹ́ fún àwọn tó ń wá a.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: Àti pé láìsí ìgbàgbọ́
  rationale: χωρίς túmọ̀ sí ‘láìsí,’ δέ sì jẹ́ àsopọ̀ onírẹ̀lẹ̀. ‘Àti pé’ so ọ̀rọ̀ yìí mọ́ àpẹẹrẹ Ẹ́nọ́kù ní ẹsẹ tó ṣáájú láìfi ìtakò líle kún un. Nínú àyíká yìí, πίστις ń tọ́ka sí gbígba Ọlọ́run gbọ́ àti gbígbẹ́kẹ̀ lé e.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: kò ṣeé ṣe láti mú inú rẹ̀ dùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn aláìlẹ́ni ἀδύνατον pẹ̀lú infinitive εὐαρεστῆσαι. ‘Rẹ̀’ ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: nítorí ... gbọ́dọ̀ gbà pé
  rationale: γάρ fúnni ní ìdí, δεῖ sì sọ dandan di mímọ̀. ‘Gbọdọ̀ gbà pé’ bá àwọn gbólóhùn ὅτι méjèèjì mu ní Yorùbá.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: ẹni tí ó bá ń tọ Ọlọ́run wá
  rationale: προσέρχομαι túmọ̀ sí sísúnmọ́ tàbí wíwá sọ́dọ̀. ‘Ń tọ Ọlọ́run wá’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìṣípò ìbáṣepọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀sìn àkànṣe kún un.
- source_word: ὅτι ἔστιν
  choice: pé ó wà
  rationale: Itumọ̀ gígùn-kúrú yìí tẹ̀lé àkójọpọ̀ Gíríìkì, ó sì lè sọ pé Ọlọ́run wà tàbí pé òun ni ẹni tó jẹ́, láìṣàlàyé ju orísun lọ.
- source_word: τοῖς ἐκζητοῦσιν αὐτόν
  choice: fún àwọn tí ń fi taratara wá a
  rationale: ἐκζητέω lágbára ju ζητέω lásán lọ; ‘fi taratara wá’ fi ìtara àti ìforítì hàn ní Yorùbá àdánidá.
- source_word: μισθαποδότης γίνεται
  choice: ó máa ń fi ara rẹ̀ hàn gẹ́gẹ́ bí olùsan èrè
  rationale: μισθαποδότης ni ẹni tí ń san èrè, γίνεται sì lè túmọ̀ sí ‘di’ tàbí ‘fi ara rẹ̀ hàn gẹ́gẹ́ bí.’ Yíyan ‘fi ara rẹ̀ hàn’ pa agbára ọ̀rọ̀-ìṣe náà mọ́, ó sì yẹra fún ìtumọ̀ pé ìwà Ọlọ́run ṣẹ̀ṣẹ̀ yí padà.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní àyíká ẹ̀kọ́ ìgbàgbọ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ìṣàlàyé tó tẹ̀ lé e dá lórí πιστεῦσαι, ìyẹn gbígba Ọlọ́run gbọ́. ‘Ìgbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa, tí kò sì fi ẹ̀kọ́ ìjọ kan ṣoṣo lé ẹsẹ náà lórí.
- issue: Agbára γίνεται nínú μισθαποδότης γίνεται
  choice: ó máa ń fi ara rẹ̀ hàn gẹ́gẹ́ bí olùsan èrè
  alternative: ó jẹ́ olùsan èrè; ó di olùsan èrè
  rationale: Gíríìkì lo γίνεται dípò copula lásán. ‘Fi ara rẹ̀ hàn gẹ́gẹ́ bí’ pa ìṣípò ọ̀rọ̀-ìṣe náà mọ́, ṣùgbọ́n kò sọ pé ẹ̀dá tàbí ìwà Ọlọ́run ń yí padà.
- issue: Ìtumọ̀ ὅτι ἔστιν
  choice: pé ó wà
  alternative: pé òun wà láàyè; pé ó ń bẹ
  rationale: ‘Pé ó wà’ pa ṣókí àti àìlójú díẹ̀ inú Gíríìkì mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere fún ìjẹ́gidi Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. ‘Mú inú rẹ̀ dùn’ àti ‘fi taratara wá a’ jẹ́ àsọyé Yorùbá tó ṣàn, nígbà tí àlàyé ìsàlẹ̀ pa àwọn àṣàyàn Gíríìkì tó ṣe pàtàkì mọ́.
