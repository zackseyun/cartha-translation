language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, Nóà, nígbà tí a ti kìlọ̀ fún un nípa àwọn ohun tí a kò tíì rí[a], ní ìbẹ̀rù ọ̀wọ̀, kọ ọkọ̀ ńlá kan fún ìgbàlà agbo ilé rẹ̀[b]. Nípasẹ̀ rẹ̀[c], ó dá ayé lẹ́bi, ó sì di ajogún òdodo tí ó bá ìgbàgbọ́ mu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “nígbà tí a ti fún un ní ìtọ́ni àtọ̀runwá” tàbí “nígbà tí Ọlọ́run kìlọ̀ fún un.”
    reason: lexical_alternative
  - marker: b
    text: “Ní ìbẹ̀rù ọ̀wọ̀” tún lè túmọ̀ sí “pẹ̀lú ọ̀wọ̀ jíjinlẹ̀” tàbí “ní ìbẹ̀rù Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: “Nípasẹ̀ rẹ̀” tọ́ka, ní ti gírámà, ó ṣeé ṣe jù lọ, sí ọkọ̀ ńlá náà; àwọn kan lóye rẹ̀ ní ọ̀nà tó gbòòrò sí i, gẹ́gẹ́ bí ìgbàgbọ́ Nóà tàbí ìgbọràn rẹ̀.
    reason: alternative_reading
  - marker: d
    text: Ọ̀rọ̀ Gíríìkì fún “òdodo” tún lè túmọ̀ sí “ìdájọ́”; ṣùgbọ́n níhìn-ín, àyíká náà ṣe ìtìlẹ́yìn fún òdodo tí ó bá ìgbàgbọ́ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ohun èlò ni ó bẹ̀rẹ̀ gbólóhùn náà, ó sì bá àtúnsọ ìlànà inú Hébérù 11 mu; “ìgbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún πίστις ní àyíká yìí.
- source_word: χρηματισθεὶς
  choice: lẹ́yìn tí ó gba ìkìlọ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígba ìsọfúnni tàbí ìkìlọ̀ láti ọ̀dọ̀ Ọlọ́run. A kò fi “láti ọ̀dọ̀ Ọlọ́run” sínú ọ̀rọ̀ pàtàkì nítorí pé aṣojú náà kò fara hàn gbangba nínú Gíríìkì, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ náà hàn.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: nípa àwọn ohun tí a kò tíì rí
  rationale: Ó pa agbára àkókò μηδέπω mọ́, ó sì sọ ní Yorùbá àdánidá pé àwọn ohun náà kò tíì hàn sí ojú.
- source_word: εὐλαβηθεὶς
  choice: fi ìbẹ̀rù ọlọ́wọ̀
  rationale: Yíyan yìí so ìbẹ̀rù pọ̀ mọ́ ọ̀wọ̀ jíjinlẹ̀, kó má bàa túmọ̀ sí ẹ̀rù lásán.
- source_word: κατεσκεύασεν κιβωτὸν
  choice: kọ ọkọ̀ ńlá kan
  rationale: “Kọ” jẹ́ ọ̀rọ̀ àdánidá fún iṣẹ́ ìkọ́lé náà; “ọkọ̀ ńlá” sọ irú ohun tí Nóà kọ ní èdè tí òǹkàwé òde òní lè lóye, láì lo “àpótí” tí ó lè ṣì lọ́nà.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: fún ìgbàlà agbo ilé rẹ̀
  rationale: “Ìgbàlà” pa ìtumọ̀ ìdáǹdè àti ìwọ̀n ẹ̀kọ́ ìgbàlà mọ́; “agbo ilé” gbòòrò ju ìdílé kékeré lọ, ó sì bá οἶκος mu.
- source_word: δι’ ἧς
  choice: Nípasẹ̀ rẹ̀
  rationale: Arọ́pò-orúkọ abo Gíríìkì tọ́ka ní kíkún jù lọ sí κιβωτός, ìyẹn ọkọ̀ náà; Yorùbá kò ní akọ tàbí abo nínú “rẹ̀,” nítorí náà àlàyé ìsàlẹ̀ ṣàlàyé ohun tí ó tọ́ka sí.
- source_word: κατέκρινεν τὸν κόσμον
  choice: ó dá ayé lẹ́bi
  rationale: Ìtumọ̀ tààrà àti àdánidá ni fún fífi ìdájọ́ ẹ̀bi lé κόσμος.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: òdodo tí ó bá ìgbàgbọ́ mu
  rationale: Ó pa ìbáṣepọ̀ κατά mọ́ láì sọ ọ́ di “nípasẹ̀ ìgbàgbọ́” ní dandan; “òdodo” ni àfiwé Yorùbá tó yẹ fún δικαιοσύνη ní àyíká yìí.
- source_word: ἐγένετο κληρονόμος
  choice: ó di ajogún
  rationale: Ìtumọ̀ Yorùbá ṣókí, tó ṣe kedere fún ipò tuntun tí Nóà wọ̀.
theological_decisions:
- issue: Ìtumọ̀ χρηματισθεὶς àti ẹni tí ìkìlọ̀ náà ti ọ̀dọ̀ rẹ̀ wá
  choice: ó gba ìkìlọ̀
  alternative: Ọlọ́run kìlọ̀ fún un; ó gba ìtọ́ni àtọ̀runwá
  rationale: Àyíká Nóà mú kí orísun àtọ̀runwá ṣe kedere, ṣùgbọ́n Gíríìkì kò dárúkọ Ọlọ́run ní tààrà. Ọ̀rọ̀ pàtàkì pa ìfarasin aṣojú náà mọ́, àlàyé sì fi àwọn ìtumọ̀ míì hàn.
- issue: Ìmọ̀lára inú εὐλαβηθεὶς
  choice: fi ìbẹ̀rù ọlọ́wọ̀
  alternative: pẹ̀lú ọ̀wọ̀ jíjinlẹ̀; nítorí ìbẹ̀rù Ọlọ́run
  rationale: Èyí pa ìdàpọ̀ ìbẹ̀rù àti ọ̀wọ̀ ẹ̀sìn mọ́, láì sọ ọ́ di ẹ̀rù lásán.
- issue: Ohun tí δι’ ἧς tọ́ka sí
  choice: ọkọ̀ ńlá náà
  alternative: ìgbàgbọ́ Nóà tàbí ìgbọràn rẹ̀
  rationale: Orúkọ abo tó sún mọ́ ọn jù lọ ni κιβωτός, nítorí náà ọkọ̀ náà ni ìtọ́kasí gírámà tó ṣeé ṣe jù; àlàyé pa ìtumọ̀ gbòòrò míì mọ́.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Àyíká ajogún àti ìgbàgbọ́ ṣe àtìlẹ́yìn fún “òdodo” gẹ́gẹ́ bí ipò tàbí ìbáṣepọ̀ tó bá ìgbàgbọ́ mu, dípò ìdájọ́ òdodo ní ìtumọ̀ àwùjọ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, àti ti òde òní. A lo “agbo ilé” fún οἶκος láti pa ìtumọ̀ household mọ́, àti “ọkọ̀ ńlá” fún κιβωτός nítorí pé ó ṣeé lóye jù “àpótí” lọ nínú ìtàn Nóà. Gbogbo àmì àlàyé [a]–[d] wà nínú ọ̀rọ̀ pàtàkì.
