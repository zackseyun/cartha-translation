id: HEB.11.22
reference: Hebrews 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, nígbà tí Jósẹ́fù ń kú,[a] ó mẹ́nu kan ìjáde àwọn ọmọ Ísírẹ́lì,[b] ó sì pàṣẹ nípa àwọn egungun rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní òpin ìgbésí ayé rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìkúrò” àwọn ọmọ Ísírẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó pa àtúnsọ pàtàkì inú Hébérù 11 mọ́, ó sì fi hàn pé ìgbàgbọ́ ni ìpìlẹ̀ ìṣe Jósẹ́fù.
- source_word: τελευτῶν
  choice: nígbà tí Jósẹ́fù ń sún mọ́ òpin ayé rẹ̀
  rationale: 'Ó mú ìtumọ̀ participle náà jáde ní Yorùbá àdánidá: Jósẹ́fù wà ní òpin ìgbésí ayé rẹ̀. Àṣàyàn tó túmọ̀ sí ‘nígbà tí ó ń kú’ wà nínú àlàyé ìsàlẹ̀.'
- source_word: περὶ τῆς ἐξόδου
  choice: nípa ìjáde
  rationale: ‘Ìjáde’ fi ìtumọ̀ gígùn-jáde tàbí kúrò ní ibìkan hàn, ó sì tọ́ka sí ìjáde Ísírẹ́lì kúrò ní Íjíbítì láìfi ọ̀rọ̀ àmúlò ẹ̀sìn kan lé e lórí.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: àwọn ọmọ Ísírẹ́lì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti pa èdè ìbátan ‘àwọn ọmọ Ísírẹ́lì’ mọ́; ‘ọmọ’ lè tọ́ka sí àwọn ọmọkùnrin àti àwọn àtọmọdọ́mọ gẹ́gẹ́ bí àyíká ṣe béèrè.
- source_word: ἐμνημόνευσεν
  choice: ó sọ̀rọ̀ nípa
  rationale: Pẹ̀lú περὶ, ọ̀rọ̀ náà túmọ̀ sí pé ó mẹ́nu kan tàbí ó sọ̀rọ̀ nípa ohun kan, kì í ṣe pé ó kàn rántí rẹ̀ nínú ọkàn.
- source_word: ἐνετείλατο
  choice: ó pàṣẹ
  rationale: Ọ̀rọ̀ náà sọ ìtọ́ni aláṣẹ tí Jósẹ́fù fi sílẹ̀; ‘ó pàṣẹ’ jẹ́ kedere, ó sì bá ìbéèrè rẹ̀ nípa ohun tí kí wọ́n ṣe mu.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: nípa àwọn egungun rẹ̀
  rationale: A pa àwòrán gangan ti Gíríìkì, ‘àwọn egungun,’ mọ́ dípò fífi ọ̀rọ̀ gbogbogbò bí ‘òkú rẹ̀’ rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú Hébérù 11
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àtúnsọ gbogbo orí 11 tọ́ka sí ìgbàgbọ́ tí àwọn baba ńlá fi ṣe ohun tí wọ́n ṣe. ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó péye jù lọ ní àyíká yìí, láìyí i padà sí ìṣòtítọ́.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí wọ́n ń ṣàlàyé.
