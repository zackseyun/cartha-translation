revisions:
- from: Nípa ìgbàgbọ́, nígbà tí Jósẹ́fù ń sún mọ́ òpin ayé rẹ̀,[a] ó sọ̀rọ̀ nípa ìjáde àwọn ọmọ Ísírẹ́lì,[b] ó sì pàṣẹ nípa àwọn egungun rẹ̀.
  to: Nípa ìgbàgbọ́, nígbà tí Jósẹ́fù ń kú,[a] ó mẹ́nu kan ìjáde àwọn ọmọ Ísírẹ́lì,[b] ó sì pàṣẹ nípa àwọn egungun rẹ̀.
  rationale: The main correction removes the misleading idiom “òpin ayé rẹ̀” and replaces it with the direct, source-faithful “nígbà tí Jósẹ́fù ń kú.” The alternative footnote retains the less direct life-ending sense. “Ó mẹ́nu kan” better reflects the Greek verb's sense of making mention while preserving the verse's meaning and register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:32:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the faith formula, Israel's departure, and Joseph's directive concerning his bones. However, “òpin ayé rẹ̀” ordinarily means “the end of his world,” not the end of his life, and therefore is misleading for τελευτῶν. Rendering it directly as “nígbà tí Jósẹ́fù ń kú” is faithful and idiomatic.
  naturalness: The revised wording is clear, public-reading-standard Yoruba with natural tone marking. “Ó mẹ́nu kan” is a more concise, idiomatic equivalent for ἐμνημόνευσεν with περὶ than “ó sọ̀rọ̀ nípa.”
  terminology: “Ìgbàgbọ́,” “ìjáde àwọn ọmọ Ísírẹ́lì,” and “àwọn egungun rẹ̀” accurately preserve the key terms and concrete imagery. “Ó pàṣẹ” suitably conveys Joseph's instruction without adding interpretation.
  issues:
  - severity: high
    issue: “òpin ayé rẹ̀” in the main text
    rationale: In normal Yoruba usage this means “the end of his world,” rather than “the end of his life.” It can suggest an unintended cosmic meaning and does not naturally convey the participle τελευτῶν (“dying”).
  - severity: low
    issue: “ó sọ̀rọ̀ nípa” for ἐμνημόνευσεν
    rationale: It is possible, but “ó mẹ́nu kan” more directly expresses “made mention of” and is more concise in this context.
  revised_text: Nípa ìgbàgbọ́, nígbà tí Jósẹ́fù ń kú,[a] ó mẹ́nu kan ìjáde àwọn ọmọ Ísírẹ́lì,[b] ó sì pàṣẹ nípa àwọn egungun rẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ní òpin ìgbésí ayé rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìkúrò” àwọn ọmọ Ísírẹ́lì.
    reason: lexical_alternative
  revision_rationale: The main correction removes the misleading idiom “òpin ayé rẹ̀” and replaces it with the direct, source-faithful “nígbà tí Jósẹ́fù ń kú.” The alternative footnote retains the less direct life-ending sense. “Ó mẹ́nu kan” better reflects the Greek verb's sense of making mention while preserving the verse's meaning and register.
