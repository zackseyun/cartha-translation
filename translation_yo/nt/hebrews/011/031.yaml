  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, Ráhábù aṣẹ́wó kò ṣègbé pọ̀ mọ́ àwọn tí ó ṣàìgbọ́ràn[a], nítorí ó gba àwọn amí náà pẹ̀lú àlàáfíà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò ṣègbé pọ̀ mọ́ àwọn tí kò gbọ́ràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ó gba àwọn amí náà pẹ̀lú àlàáfíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ọ̀nà tàbí ohun èlò ni ọ̀rọ̀ náà; “nípa ìgbàgbọ́” jẹ́ àdánidá ní Yorùbá, ó sì bá ọ̀nà tí Hébérù 11 gbà ń ṣàfihàn àwọn àpẹẹrẹ ìgbàgbọ́ mu.
- source_word: Ῥαὰβ
  choice: Ráhábù
  rationale: Ìkọ̀wé orúkọ náà ní Yorùbá ni a lò, pẹ̀lú àmì ohùn tó yẹ.
- source_word: ἡ πόρνη
  choice: aṣẹ́wó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí obìnrin tí ó ń ṣe iṣẹ́ panṣágà fún owó; “aṣẹ́wó” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, láìsọ ọ́ di ọ̀rọ̀ àṣírí.
- source_word: οὐ συναπώλετο
  choice: kò ṣègbé pọ̀ mọ́
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe àkópọ̀ náà mọ́ pé kò bá àwọn ẹlòmíràn parun.
- source_word: τοῖς ἀπειθήσασιν
  choice: àwọn tí ó ṣàìgbọ́ràn
  rationale: Ó fi ìtumọ̀ ìwà àti ìfẹ́ inú ti ἀπειθέω hàn; ó sún mọ́ “àwọn tí kò gbọ́ràn” ju “àwọn aláìgbàgbọ́” lọ ní àyíká yìí.
- source_word: δεξαμένη
  choice: nítorí ó ... gba
  rationale: Partisípù aórísì náà lè sọ ipò tàbí ìdí; “nítorí” mú ìbáṣepọ̀ ìdí náà ṣe kedere ní Yorùbá àdánidá láìyí kókó rẹ̀ padà.
- source_word: τοὺς κατασκόπους
  choice: àwọn amí náà
  rationale: “Amí” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tí a rán láti lọ ṣàyẹ̀wò ilẹ̀ tàbí ọ̀tá ní ìkọ̀kọ̀.
- source_word: μετ’ εἰρήνης
  choice: fi àlàáfíà
  rationale: Ó fi hàn pé ó gba wọn tọkàntọkàn àti láìṣe ìkà sí wọn; ó pa àwòrán “àlàáfíà” inú èdè Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀nà àpẹẹrẹ Hébérù 11
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àgbékalẹ̀ πίστει pẹ̀lú orúkọ ẹni àpẹẹrẹ, “ìgbàgbọ́” ni ìtumọ̀ tó péye jù, ó sì yẹra fún yíyanju ìtumọ̀ náà sí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́ nìkan.
- issue: Ìbáṣepọ̀ δεξαμένη pẹ̀lú gbólóhùn àkọ́kọ́
  choice: nítorí ó fi àlàáfíà gba àwọn amí náà
  alternative: nígbà tí ó fi àlàáfíà gba àwọn amí náà
  rationale: Partisípù náà lè jẹ́ ti ipò tàbí ìdí. Àyíká fi ìṣe Ráhábù hàn gẹ́gẹ́ bí ẹ̀rí ìgbàgbọ́ rẹ̀, nítorí náà “nítorí” jẹ́ àdánidá, ṣùgbọ́n àlàyé ẹsẹ̀ ń pa ọ̀nà ìtumọ̀ ipò mọ́.
translation_notes:
  register: Èdè Yorùbá ìpele àárín tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn. A lo “aṣẹ́wó” láìṣe àrọ́pò ẹ̀wẹ̀, “amí” fún κατάσκοποι, àti “ṣègbé pọ̀ mọ́” láti pa agbára συναπόλλυμι mọ́. Gbogbo àmì àlàyé ẹsẹ̀ wà nínú ọ̀rọ̀ pàtàkì.
