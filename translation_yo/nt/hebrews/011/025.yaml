source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: yo
  text: Ó yàn láti bá àwọn ènìyàn Ọlọ́run fara da ìlòkulò, dípò kí ó ní ìgbádùn ẹ̀ṣẹ̀ fún ìgbà díẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbádùn ẹ̀ṣẹ̀ tí ń kọjá lọ.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún πρόσκαιρον, tí ó lè tẹnu mọ́ bí ìgbádùn náà ṣe ń kọjá lọ.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: Ó yàn ... dípò
  rationale: Èyí fi ìpinnu tí Mósè fúnra rẹ̀ ṣe àti àfiwé láàárín ohun méjì hàn ní Yorùbá àdánidá.
- source_word: συγκακουχεῖσθαι
  choice: láti bá ... fara da ìpọ́njú
  rationale: ‘Bá ... fara da’ pa èrò ìfara-ẹni-sọ̀kan mọ́, ‘ìpọ́njú’ sì sọ ìyà àti ìlòkulò tí ọ̀rọ̀ Gíríìkì náà ní lọ́nà tí ó ṣe kedere.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: àwọn ènìyàn Ọlọ́run
  rationale: Gbólóhùn májẹ̀mú tí ó wọ́pọ̀ ni èyí, ó sì pa ìtumọ̀ genitive náà mọ́.
- source_word: πρόσκαιρον
  choice: fún ìgbà díẹ̀
  rationale: Ó túmọ̀ sí ohun tí kò pé, tí ó wà fún àkókò kúkúrú; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún àfikún ìtumọ̀.
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: kí ó ní ìgbádùn ẹ̀ṣẹ̀
  rationale: ‘Ní’ ṣe aṣojú ἔχειν ní tààrà, ‘ìgbádùn’ sì gbé ìtumọ̀ ἀπόλαυσις; ‘ẹ̀ṣẹ̀’ jẹ́ kí ìbáṣepọ̀ genitive náà wà ní àìdínkù.
theological_decisions:
- issue: Irú ẹ̀ṣẹ̀ tí ìgbádùn náà ní í ṣe pẹ̀lú
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìgbádùn ẹ̀ṣẹ̀ lápapọ̀, láìsọ irú ẹ̀ṣẹ̀ kan pàtó.
  alternative: A lè túmọ̀ ọ́ sí àǹfààní àti ìfọwọ́sowọ́pọ̀ ẹ̀ṣẹ̀ ní ààfin Fáráò, tàbí gbogbo ìgbádùn ẹ̀ṣẹ̀ ní Íjíbítì.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ àwọn ìṣe ẹ̀ṣẹ̀ pàtó; ìtumọ̀ yìí pa ààyè àti ìforígbárí ti ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Ẹsẹ̀ náà ń tẹ̀ síwájú láti inú ẹsẹ̀ ṣáájú, ṣùgbọ́n a fi ‘Ó’ kun un kí gbolóhùn náà lè dúró ní kedere ní àyọkà ẹsẹ̀ kọ̀ọ̀kan.
