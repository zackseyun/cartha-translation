revisions:
- from: Gbogbo àwọn wọ̀nyí kú nínú ìgbàgbọ́. Wọn kò gba àwọn ìlérí náà, ṣùgbọ́n wọ́n rí wọn láti òkèrè, wọ́n sì kí wọn[a]. Wọ́n sì jẹ́wọ́ pé àjèjì àti àlejò[b] ni àwọn jẹ́ lórí ilẹ̀ ayé.
  to: Gbogbo àwọn wọ̀nyí kú nínú ìgbàgbọ́, láì gba àwọn ìlérí náà; ṣùgbọ́n wọ́n rí wọn láti ọ̀nà jíjìn, wọ́n sì kí wọn[a], wọ́n sì jẹ́wọ́ pé àjèjì àti àlejò[b] ni wọ́n lórí ilẹ̀ ayé.
  rationale: Àtúnṣe náà yí ‘láti òkèrè’ sí ‘láti ọ̀nà jíjìn’ fún ìbámu tó péye sí πόρρωθεν; ó tún mú ìṣètò gbolohun Yorùbá rọrùn, ó sì ṣàtúnṣe aṣiṣe ọ̀rọ̀ nínú àlàyé ìsàlẹ̀. Kò yí ìtumọ̀ ẹsẹ náà, ọ̀pọ̀ àwọn ìlérí, tàbí àìdánilójú àkàwé ἀσπασάμενοι padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:31:13Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́—ikú wọn nínú ìgbàgbọ́, àìgba àwọn ìlérí, rírí wọn ní ìjìnnà, kíkí wọn ní ọ̀nà àkàwé, àti ìjẹ́wọ́ ipò wọn gẹ́gẹ́ bí ξένοι καὶ παρεπίδημοι. Síbẹ̀, ‘láti òkèrè’ lè túmọ̀ sí láti ilẹ̀ òkèèrè ju ‘láti ọ̀nà jíjìn’ lọ, nítorí náà a ti ṣàtúnṣe rẹ̀. A tún so àwọn gbolohun náà pọ̀ mọ́ra kí ìyàtọ̀ ἀλλά (‘ṣùgbọ́n’) àti ìtẹ̀lé àwọn participle le hàn dáadáa.
  naturalness: ‘Àjèjì àti àlejò ni àwọn jẹ́’ kò rọrùn bí ‘àjèjì àti àlejò ni wọ́n.’ Àtúnṣe náà tún mú ìtẹ̀lé ọ̀rọ̀ náà rọrùn láì dín ìtumọ̀ kù.
  terminology: ‘Ìgbàgbọ́,’ ‘ìlérí,’ ‘jẹ́wọ́,’ ‘àjèjì,’ àti ‘àlejò’ yẹ, wọ́n sì yẹra fún fífi ìtumọ̀ ìgbèkùn tàbí ẹ̀kọ́ ìjọ kan kún παρεπίδημοι. Àlàyé ìsàlẹ̀ (a) ní ‘kíni,’ èyí tí ó túmọ̀ sí ‘what?’ ní Yorùbá, kì í ṣe orúkọ ìṣe ‘kí’; a ti ṣe é ní ‘íkí.’
  issues:
  - severity: medium
    issue: ‘láti òkèrè’ fún πόρρωθεν
    rationale: Nínú Yorùbá òde òní, ‘òkèrè’ sábà ń tọ́ka sí ilẹ̀ míì/ilẹ̀ òkèèrè. Πόρρωθεν sì túmọ̀ sí ‘láti ọ̀nà jíjìn’ tàbí ‘ní ìjìnnà,’ láì sọ ibi òkèèrè pàtó.
  - severity: low
    issue: Ìlò ‘ní àwọn jẹ́’
    rationale: ‘Àjèjì àti àlejò ni wọ́n’ jẹ́ ìṣètò Yorùbá tí ó rọrùn, tí ó sì dára ju ‘ni àwọn jẹ́’ lọ nínú àyíká yìí.
  - severity: medium
    issue: ‘kíni’ nínú àlàyé ìsàlẹ̀ a
    rationale: ‘Kíni’ jẹ́ ọ̀rọ̀ ìbéèrè (‘what?’), nítorí náà ó lè dàrú. ‘Íkí’ tàbí ìtumọ̀ gbolohun ‘kí wọn’ ló yẹ.
