id: HEB.11.13
reference: Hebrews 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: yo
  text: Gbogbo àwọn wọ̀nyí kú nínú ìgbàgbọ́, láì gba àwọn ìlérí náà; ṣùgbọ́n wọ́n rí wọn láti ọ̀nà jíjìn, wọ́n sì kí wọn[a], wọ́n sì jẹ́wọ́ pé àjèjì àti àlejò[b] ni wọ́n lórí ilẹ̀ ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì tẹ́wọ́ gbà wọ́n” tàbí “wọ́n sì faramọ́ wọn.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ íkí tàbí ìtẹ́wọ́gbà; a sì lò ó ní ọ̀nà àkàwé nípa àwọn ìlérí tí wọ́n rí láti ọ̀nà jíjìn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “olùgbé fún ìgbà díẹ̀” tàbí “olùgbé-àjèjì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ń gbé ní ibì kan láìní ipò ọmọ ibẹ̀ tàbí ìdásílẹ̀ pípé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: nínú ìgbàgbọ́
  rationale: Ọ̀rọ̀ yìí ṣàfihàn pé ìgbàgbọ́ ni ìdúró wọn títí dé ikú; ó jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘in faith’ mọ́ láì sọ ọ́ di ohun èlò ìṣe kan ṣoṣo.
- source_word: ἀπέθανον
  choice: kú
  rationale: Èyí ni ìtumọ̀ tààrà tí kò lo ọ̀rọ̀ ìrọ̀rùn bí ‘kọjá lọ.’
- source_word: οὗτοι πάντες
  choice: Gbogbo àwọn wọ̀nyí
  rationale: Ó pa ìtẹnumọ́ sí gbogbo àwọn ẹni tí a mẹ́nu kàn ṣáájú mọ́.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: Wọn kò gba àwọn ìlérí náà
  rationale: Ó pa ọ̀pọ̀ ‘àwọn ìlérí’ mọ́, ó sì sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ikú wọn ní Yorùbá tó ṣe kedere.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: wọ́n rí wọn láti òkèrè
  rationale: ‘Láti òkèrè’ pa àwòrán jíjìnnà mọ́, bóyá nípa àkókò tàbí ìmúṣẹ.
- source_word: ἀσπασάμενοι
  choice: wọ́n sì kí wọn
  rationale: ‘Kí’ ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì; lílò rẹ̀ fún àwọn ìlérí jẹ́ àkàwé bí ó ti rí nínú orísun.
- source_word: ὁμολογήσαντες
  choice: Wọ́n sì jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ fi ìṣípayá tàbí ìkéde ohun tí ẹni gbà pé ó jẹ́ òtítọ́ hàn.
- source_word: ξένοι καὶ παρεπίδημοί
  choice: àjèjì àti àlejò
  rationale: 'Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ kékeré náà mọ́: ẹni tí kì í ṣe ọmọ ibẹ̀ àti ẹni tí ń gbé níbẹ̀ láìní ìdásílẹ̀ pípé.'
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Nínú àyíká yìí, ‘ilẹ̀ ayé’ dára ju ilẹ̀ kan pàtó lọ, ó sì pa ìrìn àjò ayé ènìyàn mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú gbólóhùn Κατὰ πίστιν
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká Hébérù 11 ń tẹnumọ́ ìgbẹ́kẹ̀lé àwọn ẹni náà nínú Ọlọ́run, ṣùgbọ́n ‘ìgbàgbọ́’ pa ọ̀rọ̀ pàtàkì orísun àti ìtẹ̀sí gbogbo orí náà mọ́ láì fi ẹ̀kọ́ ìjọ kan kún un.
- issue: Àkàwé ἀσπασάμενοι tí àwọn ìlérí jẹ́ ohun tí wọ́n kí
  choice: kí wọn
  alternative: tẹ́wọ́ gbà wọ́n; faramọ́ wọn
  rationale: A kò sọ pé wọ́n ti gba ìmúṣẹ àwọn ìlérí, nítorí ẹsẹ náà ṣẹ̀ṣẹ̀ sọ pé wọn kò gba wọn. ‘Kí wọn’ pa ìdààmú àkàwé yìí mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
- issue: Ipò àwọn ξένοι καὶ παρεπίδημοί lórí ilẹ̀ ayé
  choice: àjèjì àti àlejò
  alternative: àjèjì àti olùgbé fún ìgbà díẹ̀; ìgbèkùn
  rationale: ‘Àlejò’ ṣàfihàn àìní ìbùgbé tàbí ìjẹ́ ọmọ ilẹ̀ pípé, láì fi dandan ìfipá lé wọn lọ sí ìgbèkùn, èyí tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
translation_notes:
  register: 'Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. A pín gbolohun Gíríìkì gígùn náà sí gbolohun mẹ́ta fún ìmúlò Yorùbá tó mọ́, ṣùgbọ́n a pa ìtẹ̀lé èrò náà mọ́: wọ́n kú nínú ìgbàgbọ́, wọn kò gba ìmúṣẹ, wọ́n rí wọ́n láti òkèrè wọ́n sì kí wọn, lẹ́yìn náà wọ́n jẹ́wọ́ ipò wọn lórí ilẹ̀ ayé.'
