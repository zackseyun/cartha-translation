id: HEB.11.23
reference: Hebrews 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, nígbà tí a bí Mósè, àwọn òbí rẹ̀ fi í pamọ́ fún oṣù mẹ́ta, nítorí wọ́n rí i pé ọmọ náà rẹwà[a], wọ́n kò sì bẹ̀rù àṣẹ ọba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dára” tàbí “ó jẹ́ àrà ọ̀tọ̀.” Ọ̀rọ̀ Gíríìkì náà (ἀστεῖον) tún ń mú Ékísódù 2:2 àti Ìṣe 7:20 wá sí ìrántí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí agbára tí wọ́n fi ṣe ohun náà, ó sì bá àkòrí tí Hébérù 11 ń tún lò mu.
- source_word: Μωϋσῆς γεννηθεὶς
  choice: nígbà tí a bí Mósè
  rationale: A tú participle aorist passive náà sí gbólóhùn àkókò tó ṣe déédéé ní Yorùbá, láì pàdánù ìtumọ̀ pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ nígbà ìbí rẹ̀.
- source_word: ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ
  choice: àwọn òbí rẹ̀ fi í pamọ́ fún oṣù mẹ́ta
  rationale: 'Ọ̀rọ̀ iṣe active yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa gbogbo ohun inú passive Gíríìkì mọ́: Mósè ni ẹni tí a fi pamọ́, àwọn òbí rẹ̀ ni olùṣe, oṣù mẹ́ta sì ni iye àkókò náà. πατέρων túmọ̀ sí àwọn òbí ní àyíká ọ̀rọ̀ yìí.'
- source_word: ἀστεῖον τὸ παιδίον
  choice: ọmọ náà rẹwà
  rationale: “Rẹwà” jẹ́ ọ̀rọ̀ Yorùbá adayeba fún ẹwà tàbí ìrísí tó dára; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tí ọ̀rọ̀ Gíríìkì náà lè ní hàn.
- source_word: οὐκ ἐφοβήθησαν
  choice: wọn kò sì bẹ̀rù
  rationale: Ó pa ìtakora tó wà láàárín ìgbàgbọ́ àti ìbẹ̀rù mọ́ ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: àṣẹ ọba
  rationale: “Àṣẹ ọba” jẹ́ ọ̀nà ṣókí, adayeba láti sọ òfin tàbí àṣẹ pàtó tí ọba gbé jáde.
theological_decisions:
- issue: Ohun tó mú kí àwọn òbí Mósè fi í pamọ́
  choice: Ẹsẹ náà gbé gbogbo ìṣe wọn sábẹ́ ìgbàgbọ́, ó mẹ́nu kan pé wọ́n rí ọmọ náà gẹ́gẹ́ bí ẹni tó rẹwà, wọ́n kò sì jẹ́ kí àṣẹ ọba dẹ́rù bà wọ́n.
  alternative: A lè ka ẹwà ọmọ náà nìkan sí ohun tó mú wọn ṣe bẹ́ẹ̀, tàbí kí a ka ìrísí rẹ̀ sí àmì àrà ọ̀tọ̀ láti ọ̀dọ̀ Ọlọ́run.
  rationale: Ìtumọ̀ náà pa àwọn kókó méjèèjì tí syntax náà sọ mọ́ láìfi kún un pé ìrísí ọmọ náà jẹ́ àmì iṣẹ́ ìyanu, nítorí ọ̀rọ̀ Gíríìkì kò sọ bẹ́ẹ̀ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ọ̀rọ̀ iṣe active fún passive Gíríìkì nítorí pé ó jẹ́ adayeba sí i ní Yorùbá, láìyí olùṣe tàbí ẹni tí ìṣe náà dé bá padà.
