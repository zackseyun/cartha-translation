id: HEB.11.9
reference: Hebrews 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, ó gbé ní ilẹ̀ ìlérí bí àjèjì, bí ẹni pé ó wà ní ilẹ̀ tí kì í ṣe tirẹ̀; ó ń gbé nínú àwọn àgọ́ pẹ̀lú Ísáàkì àti Jákọ́bù, àwọn tí wọ́n jọ jẹ́ ajogún ìlérí kan náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù irinṣẹ́ ni; ó fi hàn pé ìgbàgbọ́ ni ọ̀nà tí Ábúráhámù fi ṣe ohun tí ẹsẹ yìí sọ. Èyí tún bá ìlò ọ̀rọ̀ náà mu jákèjádò Hébérù 11.
- source_word: παρῴκησεν
  choice: ó gbé ... bí àjèjì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ní ibi gẹ́gẹ́ bí ẹni tí kì í ṣe ọmọ ìbílẹ̀ tàbí ẹni tí ilẹ̀ náà jẹ́ tirẹ̀; ‘gbé bí àjèjì’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ awùjọ yìí mọ́.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: ní ilẹ̀ ìlérí
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe tó ní í ṣe pẹ̀lú gbígbé, εἰς lè tọ́ka sí ibi tí ẹni ń gbé. ‘Ilẹ̀ ìlérí’ pa ìsopọ̀ ilẹ̀ náà mọ́ pẹ̀lú ìlérí Ọlọ́run.
- source_word: ὡς ἀλλοτρίαν
  choice: bí ẹni pé ó wà ní ilẹ̀ tí kì í ṣe tirẹ̀
  rationale: ἀλλότριος lè túmọ̀ sí ohun tí ó jẹ́ ti ẹlòmíràn tàbí ohun àjèjì. Gbólóhùn yìí sọ ìtumọ̀ náà ní Yorùbá kedere, ó sì pa àfiwé ὡς mọ́ láì sọ pé ilẹ̀ náà kì í ṣe ilẹ̀ ìlérí ní ti gidi.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: ó ń gbé inú àgọ́
  rationale: Partísípù náà ṣàlàyé bí ó ṣe ń gbé níbẹ̀; ọ̀nà àìparí ‘ó ń gbé’ mú ìgbé ayé inú àgọ́ tó ń bá a lọ hàn.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: pẹ̀lú Ísáàkì àti Jákọ́bù
  rationale: μετά pẹ̀lú jenitífù túmọ̀ sí ‘pẹ̀lú’; a kọ orúkọ àwọn ènìyàn náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀.
- source_word: τῶν συγκληρονόμων
  choice: àwọn tí wọ́n jọ jẹ́ ajogún
  rationale: Ó tọ́ka sí àwọn tí wọ́n jọ ní ìpín nínú ogún kan. Gbólóhùn yìí ṣe kedere ju ọ̀rọ̀ àdàkọ tó lè dà bí èdè amọ̀ṣẹ́dunjú lọ.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: ìlérí kan náà
  rationale: αὐτῆς tẹnumọ́ pé ìlérí tí Ísáàkì àti Jákọ́bù jogún jẹ́ ìlérí kan náà tí a ṣe fún Ábúráhámù.
theological_decisions:
- issue: Ẹni tí ‘ó’ ń tọ́ka sí
  choice: Ábúráhámù, gẹ́gẹ́ bí àkóónú ẹsẹ tó ṣáájú
  alternative: Ṣíṣe àfikún orúkọ ‘Ábúráhámù’ sínú ẹsẹ yìí
  rationale: Gíríìkì kò tún orúkọ náà sọ; ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ni Ábúráhámù láti Hébérù 11:8. Lílo ‘ó’ pa ìṣàn ọ̀rọ̀ orísun mọ́, nígbà tí àyíká mú ẹni náà kedere.
- issue: Ìtumọ̀ ὡς ἀλλοτρίαν
  choice: Ilẹ̀ ìlérí dà bí ilẹ̀ tí kì í ṣe tirẹ̀ ní ti ìrírí gbígbé rẹ̀
  alternative: Pípe ilẹ̀ ìlérí náà ní ‘ilẹ̀ àjèjì’ láìsí àlàyé
  rationale: 'Ìtumọ̀ tí a yàn pa ìforígbárí inú ẹsẹ náà mọ́: Ọlọ́run ti ṣèlérí ilẹ̀ náà, síbẹ̀ Ábúráhámù ń gbé níbẹ̀ gẹ́gẹ́ bí ẹni tí kò tíì ní ilẹ̀ náà.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A yan ‘àjèjì’ àti ‘ilẹ̀ tí kì í ṣe tirẹ̀’ láti fi ìpo ẹni tí kò ní ilẹ̀ náà hàn ní kedere. Kò sí àmì àlàyé ìsàlẹ̀ nítorí pé a ti fi ìtumọ̀ àfidípò ὡς ἀλλοτρίαν hàn taara nínú ọ̀rọ̀ ẹsẹ.
