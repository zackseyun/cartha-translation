id: HEB.11.3
reference: Hebrews 11:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni àwa fi mọ̀ pé a ti ṣètò àwọn ìgbà ayé[a] nípasẹ̀ ọ̀rọ̀ Ọlọ́run, tó fi jẹ́ pé ohun tí a rí kò wá sí ìwàláàyè láti inú àwọn ohun tí ó hàn sí ojú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ayé” tàbí “gbogbo àgbáyé.” Ọ̀rọ̀ Gíríìkì náà ní tààrà sí “àwọn ìgbà,” ó sì lè tọ́ka sí gbogbo ètò ayé jákèjádò àkókò.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ohun èlò ni; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì pa àtúnlò ọ̀rọ̀ ‘ìgbàgbọ́’ nínú orí náà mọ́.
- source_word: νοοῦμεν
  choice: ni àwa fi mọ̀
  rationale: Ó túmọ̀ sí fífi ọkàn lóye, kì í ṣe rírí lásán; ‘mọ̀’ nínú àkópọ̀ yìí sọ ìmòye ọpọlọ ní èdè Yorùbá àdánidá.
- source_word: κατηρτίσθαι
  choice: a ti ... ṣe ... ní ètò
  rationale: Perfect passive infinitive náà ń tọ́ka sí pípèsè tàbí ṣíṣe ohun kan ní ìṣètò tí ó pé; a kò fi ọ̀rọ̀ tó máa sọ ìṣẹ̀dá ohun èlò ju ohun tí Gíríìkì sọ lọ.
- source_word: τοὺς αἰῶνας
  choice: àwọn ìgbà ayé
  rationale: Ó pa ìtumọ̀ gidi ‘àwọn sáà/ìgbà’ mọ́, nígbà tí ‘ayé’ ràn án lọ́wọ́ láti fi ìtẹ̀sí àkókò àti gbogbo ètò ohun tí a dá hàn; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn sílẹ̀.
- source_word: ῥήματι θεοῦ
  choice: fi ọ̀rọ̀ Ọlọ́run
  rationale: ῥῆμα lè tẹnumọ́ ọ̀rọ̀ tí a sọ; ‘ọ̀rọ̀ Ọlọ́run’ jẹ́ èdè Yorùbá tí ó mọ́gbọ́n dání, ‘fi’ sì fi ipa dátífù ohun èlò hàn.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: tó bẹ́ẹ̀ tí ... kò fi wá sí ìwàláàyè
  rationale: Ó fi àbájáde hàn ní Yorùbá àdánidá, ó sì pa èrò γίνομαι gẹ́gẹ́ bí wíwá sí ìwàláàyè mọ́ láìfi èdè ìmọ̀-ẹ̀sìn kun un.
- source_word: ἐκ φαινομένων
  choice: láti inú àwọn ohun tí ó hàn sí ojú
  rationale: Ó túmọ̀ sí àwọn ohun tí ń farahàn tàbí tí a lè rí; ọ̀rọ̀ yìí mú ìyàtọ̀ rẹ̀ sí ‘ohun tí a rí’ ṣe kedere.
- source_word: τὸ βλεπόμενον
  choice: ohun tí a rí
  rationale: Participle tí a lò bí orúkọ, ní ẹyọ ṣùgbọ́n pẹ̀lú ìtumọ̀ àkójọpọ̀; ìtumọ̀ Yorùbá yìí rọrùn, ó sì gbòòrò tó.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ αἰῶνες nípa iṣẹ́ ìṣẹ̀dá
  choice: àwọn ìgbà ayé
  alternative: àwọn ayé; gbogbo àgbáyé
  rationale: αἰῶνες lè gba gbogbo ètò ayé jákèjádò àkókò, kì í ṣe àgbá ohun èlò nìkan. Ìtumọ̀ tí a yàn pa ìfẹ̀ àkókò àti ti àgbáyé pọ̀ mọ́, àlàyé ìsàlẹ̀ sì jẹ́ kí àwọn ìtumọ̀ mìíràn hàn.
- issue: Bí ẹsẹ̀ náà ṣe kan ìṣẹ̀dá láti inú àìsí
  choice: A sọ pé ohun tí a rí kò wá sí ìwàláàyè láti inú ohun tí ó hàn sí ojú.
  alternative: Ṣíṣe é ní kedere pé Ọlọ́run dá gbogbo nǹkan láti inú àìsí pátápátá.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ pé ohun tí a rí kò ti inú àwọn ohun tí ó hàn wá. Èyí bá ẹ̀kọ́ ìṣẹ̀dá láti inú àìsí mu, ṣùgbọ́n a kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ tí ó ju gbólóhùn náà lọ sínú ẹsẹ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn ìgbà ayé’ láti pa àìdánilójú àti ìfẹ̀ temporal-cosmic ti αἰῶνες mọ́; àmì ohùn wà níbi tí ó bá jẹ́ àdánidá.
