id: HEB.11.21
reference: Hebrews 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni Jákọ́bù, nígbà tí ó ń kú, bù kún fún ọ̀kọ̀ọ̀kan àwọn ọmọ Jósẹ́fù, ó sì jọ́sìn nígbà tí ó gbára lé orí ọ̀pá rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Hébérù ti Jẹ́nẹ́sísì 47:31, “ó sì forí balẹ̀ jọ́sìn lórí orí ibùsùn rẹ̀.” “Ọ̀pá” ni ọ̀rọ̀ Gíríìkì níbí.
    reason: textual_variant
  - marker: b
    text: Tàbí, “ó sì jọ́sìn sí orí ọ̀pá rẹ̀.” Ó ṣeé ṣe kí gbólóhùn náà ń ṣàpèjúwe ìdúró ara Jákọ́bù, kì í ṣe ohun tí ó ń jọ́sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ipá tí Jákọ́bù fi ṣe àwọn ìṣe náà, ó sì bá àtúnlò gbólóhùn yìí mu ní Hébérù 11.
- source_word: ἀποθνῄσκων
  choice: nígbà tí ó ń kú lọ
  rationale: Ó mú ìtumọ̀ àkókò àti ìṣe tí ó ń lọ lọ́wọ́ inú participle náà jáde ní Yorùbá àdánidá.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: olúkúlùkù àwọn ọmọ Jósẹ́fù
  rationale: “Olúkúlùkù” pa agbára distributive ἕκαστον mọ́, pé Jákọ́bù súre fún ọmọ kọ̀ọ̀kan.
- source_word: εὐλόγησεν
  choice: súre fún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ fífi ìbùkún fún ẹnì kan, ó sì bá àyíká ìtàn Jẹ́nẹ́sísì mu.
- source_word: προσεκύνησεν
  choice: jọ́sìn
  rationale: Ó fi ìtumọ̀ ẹ̀sìn ti προσκυνέω hàn láì sọ pé ọ̀pá ni Jákọ́bù ń bọ̀wọ̀ fún.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: nígbà tí ó gbára lé orí ọ̀pá rẹ̀
  rationale: Ó jẹ́ Yorùbá àdánidá fún ìtumọ̀ pé gbólóhùn náà ń ṣàpèjúwe bí ara Jákọ́bù ṣe wà, nígbà tí ó tún pa “orí ọ̀pá rẹ̀” mọ́ láti inú Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ ìjọsìn Jákọ́bù pẹ̀lú ọ̀pá nínú gbólóhùn ìkẹyìn
  choice: Jákọ́bù jọ́sìn Ọlọ́run nígbà tí ó gbára lé orí ọ̀pá rẹ̀.
  alternative: Jákọ́bù forí balẹ̀ jọ́sìn níbi orí ibùsùn rẹ̀; tàbí ó jọ́sìn síhà orí ọ̀pá rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì Hébérù sọ “ọ̀pá,” bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Hébérù Jẹ́nẹ́sísì 47:31 lè túmọ̀ sí “ibùsùn.” Títúmọ̀ rẹ̀ gẹ́gẹ́ bí ìdúró ara Jákọ́bù yàgò fún èrò pé ọ̀pá ni ó ń jọ́sìn, ṣùgbọ́n àwọn àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀ láti pa àìdánilójú àti ìyàtọ̀ ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. “Nípa ìgbàgbọ́ ni” ń tẹ ìgbàgbọ́ mọ́lẹ̀ ní ọ̀nà àdánidá; “súre fún” àti “jọ́sìn” jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì yẹ fún àyíká mímọ́.
