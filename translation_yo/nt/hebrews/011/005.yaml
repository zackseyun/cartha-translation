id: HEB.11.5
reference: Hebrews 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: yo
  text: Nípa ìgbàgbọ́ ni a gbé Énọ́kù kúrò, kí ó má bàa rí ikú[a]; a kò sì rí i, nítorí Ọlọ́run ti gbé e kúrò. Nítorí ṣáájú gbígbé e kúrò, a ti jẹ́rìí nípa rẹ̀ pé ó ti mú inú Ọlọ́run dùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má bàa ní ìrírí ikú.” “Rí ikú” jẹ́ àpólà Gíríìkì tí a pa mọ́ nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó ṣe àfihàn dative irinṣẹ́ tàbí ọ̀nà tí a fi ń ṣe ohun kan, ó sì bá ìlò πίστις gẹ́gẹ́ bí ‘ìgbàgbọ́’ mu nínú Hébérù 11.
- source_word: μετετέθη / μετέθηκεν
  choice: a gbé ... kúrò / ti gbé ... kúrò
  rationale: Ọ̀rọ̀ yìí fi hàn pé a mú Ẹ́nọ́kù kúrò ní ipò ayé rẹ̀ nípasẹ̀ iṣẹ́ Ọlọ́run. Ìtumọ̀ yìí pa ìṣe náà mọ́ láìfi àlàyé kún un nípa ibi tàbí ọ̀nà tí a gbà gbé e lọ.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: kí ó má bàa rí ikú
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì ‘rí ikú’ mọ́, ó sì fi ète tàbí àbájáde hàn lọ́nà àdánidá ní Yorùbá.
- source_word: οὐχ ηὑρίσκετο
  choice: a kò sì rí i
  rationale: Ìtumọ̀ tààrà yìí kò sọ ẹni tí ó ń wá a, gẹ́gẹ́ bí Gíríìkì náà kò ṣe sọ ọ́.
- source_word: πρὸ γὰρ τῆς μεταθέσεως
  choice: Nítorí ṣáájú gbígbé e kúrò
  rationale: Ó tẹ̀lé àkópọ̀ orúkọ Gíríìkì, ó sì tún lo gbòngbò ọ̀rọ̀ kan náà fún μετατίθημι àti μετάθεσις.
- source_word: μεμαρτύρηται
  choice: ó ti gba ẹ̀rí
  rationale: Ó fi perfect passive hàn gẹ́gẹ́ bí gbígba ẹ̀rí rere, láìdá ẹni tó jẹ́rìí sí i lórúkọ.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: pé ó mú inú Ọlọ́run dùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún sísọ pé Ẹ́nọ́kù ti ṣe ohun tí ó wu Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ èdè μετατίθημι nípa Ẹ́nọ́kù
  choice: gbé ... kúrò
  alternative: gbé e lọ sí ọ̀run
  rationale: Ẹsẹ̀ náà sọ pé Ọlọ́run gbé Ẹ́nọ́kù kúrò kí ó má bàa rí ikú, ṣùgbọ́n kò ṣàlàyé ibi tí a gbé e lọ tàbí bí ó ṣe ṣẹlẹ̀; nítorí náà, a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
- issue: Agbára àpólà ‘rí ikú’
  choice: pa ‘rí ikú’ mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: ní ìrírí ikú / kú
  rationale: Àpólà náà ṣeé lóye ní Yorùbá, ó sì pa àwòrán àti ìfọkànsìn ọ̀rọ̀ orísun mọ́; àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- issue: Ẹni tó fún Ẹ́nọ́kù ní ẹ̀rí rere
  choice: má ṣe dá ẹni náà lórúkọ
  alternative: Ọlọ́run jẹ́rìí sí i
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ passive, kò sì sọ ẹni tó jẹ́rìí ní kedere, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè tọ́ka sí ẹ̀rí Ọlọ́run tàbí Ìwé Mímọ́.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọ̀wọ̀, àti èdè ìsinsìnyí ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘a’ aláìdásí-ẹni fún passive, a sì pa àtúnlò ‘gbé ... kúrò’ mọ́ láti ṣe àfihàn àtúnlò gbòngbò ọ̀rọ̀ Gíríìkì.
