id: HEB.11.35
reference: Hebrews 11:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: yo
  text: Àwọn obìnrin gba àwọn òkú wọn padà nípasẹ̀ àjíǹde;[a] ṣùgbọ́n a dá àwọn mìíràn lóró,[b] wọn kò gba ìtúsílẹ̀,[c] kí wọ́n lè rí àjíǹde tí ó sàn jù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, àwọn tí wọ́n ti kú padà sí ìyè, àwọn obìnrin náà sì gba wọn padà sí ọ̀dọ̀ wọn.
    reason: clarification
  - marker: b
    text: Ọ̀rọ̀ tí a túmọ̀ sí “a dá ... lóró” tọ́ka sí ìdálóró ara tó le gan-an, bóyá nípa lílu wọn lórí ohun èlò kan tàbí nípa nínà wọ́n sórí rẹ̀; ọ̀nà pàtó tí a lò kò dájú.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ “ìtúsílẹ̀” sí “ìdáǹdè.” Níhìn-ín, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí dídá ẹni sílẹ̀ kúrò nínú ìdálóró tàbí ikú, kì í ṣe dandan ìràpadà ní ìtumọ̀ ìgbàlà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: gba ... padà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘gbà,’ ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé àwọn obìnrin náà gba àwọn olólùfẹ́ wọn tí ó ti kú padà sí ọ̀dọ̀ wọn.
- source_word: γυναῖκες
  choice: àwọn obìnrin
  rationale: Ìtumọ̀ gbogbogbò ‘àwọn obìnrin’ bá àyíká mu ju ‘àwọn aya’ lọ.
- source_word: ἐξ ἀναστάσεως
  choice: nípasẹ̀ àjíǹde
  rationale: Ó sọ ọ̀nà tàbí ohun tí ó mú kí wọ́n gba àwọn òkú náà padà; èdè Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ orísun mọ́.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: àwọn òkú wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti tọ́ka sí àwọn ẹni tiwọn tí wọ́n ti kú.
- source_word: ἄλλοι δὲ
  choice: ṣùgbọ́n ... àwọn mìíràn
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tó wà láàárín àwọn tí a jí òkú wọn dìde àti àwọn olóòtítọ́ tí wọ́n jìyà hàn.
- source_word: ἐτυμπανίσθησαν
  choice: a dá ... lóró
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ìdálóró ara tó le gan-an, ṣùgbọ́n irú ohun èlò tàbí ọ̀nà pàtó tí a lò kò dájú; nítorí náà, a kò sọ ọ̀nà kan pàtó.
- source_word: οὐ προσδεξάμενοι
  choice: wọn kò gba
  rationale: Ó fi hàn pé wọ́n kọ ohun tí a fi fún wọn, kì í ṣe pé wọn kò rí i gbà lásán.
- source_word: τὴν ἀπολύτρωσιν
  choice: ìtúsílẹ̀
  rationale: Níhìn-ín, ó tọ́ka sí dídá wọn sílẹ̀ kúrò nínú ìdálóró tàbí ikú, kì í ṣe dandan ìràpadà ní ìtumọ̀ ẹ̀kọ́ ìgbàlà.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìtumọ̀ yìí ṣàfihàn ète tí wọ́n ní nígbà tí wọ́n kọ ìtúsílẹ̀.
- source_word: κρείττονος ἀναστάσεως
  choice: àjíǹde tí ó sàn jù
  rationale: ‘Ó sàn jù’ pa ìfiwéra κρείττων mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τύχωσιν
  choice: ní
  rationale: Nínú gbólóhùn Yorùbá yìí, ‘ní’ sọ ìtumọ̀ gbígba tàbí dé ibi ohun kan mu ní ọ̀nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἀπολύτρωσιν nínú àyíká yìí
  choice: ìtúsílẹ̀ kúrò nínú ìdálóró tàbí ikú ní ayé yìí
  alternative: ìràpadà ní ìtumọ̀ ẹ̀kọ́ ìgbàlà tó gbòòrò
  rationale: Àyíká náà ń sọ nípa àwọn olóòtítọ́ tí wọ́n kọ àǹfààní láti bọ́ lọ́wọ́ ìdálóró. ‘Ìtúsílẹ̀’ pa ìtumọ̀ ìtàn náà mọ́ láìfi ẹ̀kọ́ ìgbàlà tí ẹsẹ náà kò sọ ní tààràtà kún un.
- issue: Agbára ọ̀rọ̀ ‘àjíǹde tí ó sàn jù’
  choice: àjíǹde ọjọ́ iwájú tí ó ga ju ìpadà sí ìyè aláìpé ní ayé yìí lọ
  alternative: àjíǹde kan tí ó dára sí i láìjẹ́ pé a fi í wé ìpadà àwọn òkú sí ìyè nínú apá àkọ́kọ́
  rationale: Ìṣètò ẹsẹ náà fi ìpadà àwọn òkú sí ìyè ní apá àkọ́kọ́ wé ìrètí àwọn ajẹ́rìíkú ní apá kejì. Àlàyé yìí pa ìyàtọ̀ náà mọ́ láìṣàlàyé bí àjíǹde yẹn yóò ṣe rí ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A yan ‘àjíǹde’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀; a lo ‘a dá ... lóró’ láti yẹra fún sísọ ọ̀nà ìdálóró kan pàtó tí orísun kò fi ìdánilójú hàn. Àwọn àmì àlàyé [a], [b], àti [c] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
