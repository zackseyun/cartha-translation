id: HEB.11.37
reference: Hebrews 11:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: yo
  text: A sọ wọ́n lókùúta, a fi ayùn gé wọn sí méjì, wọ́n kú nínú ìpakúpa idà[a]; wọ́n ń rìn káàkiri, wọ́n wọ awọ àgùntàn àti awọ ewúrẹ́, wọ́n jẹ́ aláìní, a pọ́n wọn lójú, a sì hùwà ìkà sí wọn—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kú nípa idà.” Ní ọ̀rọ̀ gangan, Gíríìkì ní “ìpakúpa idà” (ἐν φόνῳ μαχαίρης), èyí tó tẹnu mọ́ ìwà ipá inú gbólóhùn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: A sọ wọ́n ní òkúta
  rationale: Èyí fi ìṣe àìṣe-aláṣẹ ti Gíríìkì hàn, kò sì fi kún un pé òkúta náà pa wọ́n.
- source_word: ἐπρίσθησαν
  choice: a fi ayùn gé wọn sí méjì
  rationale: πρίζω túmọ̀ sí fífi ayùn gé; ‘sí méjì’ mú ìtumọ̀ ìjìyà náà ṣe kedere ní Yorùbá.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: wọ́n kú nípa ìpakúpa idà
  rationale: ‘Wọ́n kú’ tẹ̀lé ἀπέθανον, ‘ìpakúpa idà’ sì pa agbára φόνος mọ́ ju gbólóhùn ‘nípa idà’ nìkan lọ.
- source_word: περιῆλθον
  choice: wọ́n ń rìn káàkiri
  rationale: Ó sọ bí wọ́n ṣe ń lọ láti ibì kan sí ibòmíràn; àkókò aláìparí Yorùbá bá àyíká ìṣe náà mu.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: nínú awọ àgùntàn àti awọ ewúrẹ́
  rationale: Àwọn ọ̀rọ̀ náà tọ́ka sí awọ ẹranko tí wọ́n fi ṣe aṣọ; ìṣọ̀kan gbólóhùn mú àtúmọ̀ náà rọrùn láti kà.
- source_word: ὑστερούμενοι
  choice: wọ́n ṣe aláìní
  rationale: Ó fi hàn pé ohun pàtàkì ń ṣe wọ́n, kì í ṣe pé wọ́n kàn fẹ́ ohun kan.
- source_word: θλιβόμενοι
  choice: a pọ́n wọn lójú
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìpọ́njú tàbí ìnira tí a fi lé wọn lórí hàn.
- source_word: κακουχούμενοι
  choice: a sì ṣe wọ́n ní ibi
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé a hùwà búburú sí wọn láìfi ìtumọ̀ mìíràn kún un.
theological_decisions:
- issue: Bí a ṣe máa fi agbára ἐν φόνῳ μαχαίρης hàn
  choice: nípa ìpakúpa idà
  alternative: nípa idà
  rationale: φόνος ní ìmọ̀lára ìpànìyàn tàbí ìpakúpa, nítorí náà àkọ́kọ́ yìí pa ìwúwo ìwà ipá inú Gíríìkì mọ́; àṣàyàn tó rọrùn sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. A pa àtòjọ ìjìyà àti ìlù pàṣípààrọ̀ àwọn ìṣe àìṣe-aláṣẹ mọ́ níbi tí Yorùbá ti jẹ́ kí ó ṣeé ṣe.
