  text: For by this the elders received approval[a][b][c].
translation:
  language: yo
  text: Nítorí nípa èyí[b] ni a fi jẹ́rìí rere sí àwọn àgbà ìgbàanì[c][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a yìn wọ́n” tàbí “a jẹ́rìí sí wọn.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé a fún wọn ní ẹ̀rí rere.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, nípa ìgbàgbọ́, gẹ́gẹ́ bí ẹsẹ tó ṣáájú ti ṣàpèjúwe rẹ̀.
    reason: cross_reference
  - marker: c
    text: Tàbí, “àwọn ènìyàn ìgbàanì” tàbí “àwọn ènìyàn ayé àtijọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: nípa èyí
  rationale: Ọ̀rọ̀ yìí tọ́ka padà sí ìgbàgbọ́ ní ẹsẹ 1, ó sì lè sọ ọ̀nà tàbí ipò tí ohun náà ti ṣẹlẹ̀. “Nípa èyí” pa ìtọ́kasí náà mọ́ láì fi “ìgbàgbọ́” kún ọ̀rọ̀ pàtàkì.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ ẹsẹ tó ṣáájú múlẹ̀.
- source_word: ἐμαρτυρήθησαν
  choice: gba ẹ̀rí rere
  rationale: Ìṣe àìṣe yìí túmọ̀ sí pé a jẹ́rìí rere sí wọn tàbí pé wọ́n gba ìyìn. “Gba ẹ̀rí rere” pa àwòrán ẹ̀rí inú μαρτυρέω mọ́, ó sì fi ìtumọ̀ rere inú àyíká hàn.
- source_word: οἱ πρεσβύτεροι
  choice: àwọn àgbà ìgbàanì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà kò dá lórí ipò olórí ìjọ, bí kò ṣe àwọn ènìyàn ti ìran àtijọ́ tí orí 11 ń mẹ́nu kàn. Àfikún “ìgbàanì” mú èyí ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ohun tí ταύτῃ ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “èyí,” tí ó ń tọ́ka padà sí ìgbàgbọ́ ní ẹsẹ 1.
  alternative: Kí a túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí “nípa ìgbàgbọ́,” tàbí kí ó tọ́ka sí gbogbo òtítọ́ tí ẹsẹ 1 ṣàpèjúwe.
  rationale: Ìbámu abo ẹyọ kan pẹ̀lú πίστις àti ìṣàn ọ̀rọ̀ orí 11 ṣe àtìlẹ́yìn fún ìgbàgbọ́ gẹ́gẹ́ bí ohun tí ó ń tọ́ka sí. Síbẹ̀, “nípa èyí” kò pa ìtọ́kasí tó fẹ̀ síi run.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Àwọn àgbà ìgbàanì” yà kúrò nínú ìtumọ̀ àwọn alàgbà ìjọ, nígbà tí “ẹ̀rí rere” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
