base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: yo
  text: Gbogbo àwọn wọ̀nyí sì, bí ó tilẹ̀ jẹ́ pé a jẹ́rìí rere sí wọn nípasẹ̀ ìgbàgbọ́[a], wọn kò gba ìlérí náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘bí ó tilẹ̀ jẹ́ pé wọ́n gba ìtẹ́wọ́gbà,’ tàbí, ‘bí ó tilẹ̀ jẹ́ pé a jẹ́rìí sí wọn.’ Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ọ́ pé nípasẹ̀ ìgbàgbọ́ ni a fi jẹ́rìí rere sí àwọn ènìyàn wọ̀nyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘wọn kò rí ìlérí náà gbà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάντες
  choice: Gbogbo àwọn wọ̀nyí sì
  rationale: Ó tọ́ka padà sí gbogbo àwọn ẹni ìgbàgbọ́ tí a ṣẹ̀ṣẹ̀ dárúkọ, ó sì pa ìsopọ̀ καὶ mọ́ láìfi ìtakora kún un.
- source_word: μαρτυρηθέντες
  choice: bí a tilẹ̀ jẹ́rìí rere sí wọn
  rationale: Ọ̀rọ̀ náà jẹ́ participle passive tó túmọ̀ sí pé a jẹ́rìí rere sí wọn tàbí pé wọ́n gba ìtẹ́wọ́gbà. ‘Bí ... tilẹ̀’ mú ìtumọ̀ concessive inú àyíká ọ̀rọ̀ hàn, níwọ̀n bí wọ́n kò ti gba ìlérí náà.
- source_word: διὰ τῆς πίστεως
  choice: nítorí ìgbàgbọ́ wọn
  rationale: διά pẹ̀lú genitive fi ọ̀nà tàbí ìdí tí ẹ̀rí rere náà fi wá hàn. Fífi ‘wọn’ kún un jẹ́ kí Yorùbá ṣàn dáadáa, láìyí ẹni tí ìgbàgbọ́ náà jẹ́ padà.
- source_word: οὐκ ἐκομίσαντο
  choice: wọn kò gba
  rationale: κομίζω ní middle níbí túmọ̀ sí gbígba tàbí rírí ohun tí a ṣèlérí gbà; ‘kò gba’ jẹ́ èdè Yorùbá tó ṣe kedere tí kò sì ṣàlàyé ju orísun lọ.
- source_word: τὴν ἐπαγγελίαν
  choice: ìlérí náà
  rationale: A pa singular pẹ̀lú definite article mọ́, láìtúmọ̀ rẹ̀ sí ‘ìmúṣẹ ìlérí’ tàbí ‘ohun tí a ṣèlérí,’ kí ìwòye ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà má bàa di pípa mọ́ sí ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ‘ìlérí náà’ nínú àyíká ọ̀rọ̀
  choice: ìlérí náà
  alternative: ohun tí a ṣèlérí; ìmúṣẹ ìlérí náà; ogún tàbí ìbùkún tí a ṣèlérí
  rationale: Gíríìkì sọ ọ́ ní ṣókí, ẹsẹ̀ 40 sì ń ṣàlàyé rẹ̀ síwájú. Àtúmọ̀ náà kò gbọ́dọ̀ yanju ohun tí orísun fi sílẹ̀ ní fífẹ̀.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A lo ‘jẹ́rìí rere sí’ láti pa àwòrán ẹ̀rí inú μαρτυρέω mọ́, a sì lo ‘ìlérí náà’ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
