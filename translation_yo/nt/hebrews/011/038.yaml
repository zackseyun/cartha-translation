id: HEB.11.38
reference: Hebrews 11:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: yo
  text: —àwọn tí ayé kò yẹ fún—wọ́n ń rìn káàkiri ní àwọn aginjù[a], lórí àwọn òkè ńlá, nínú àwọn ihò àpáta àti àwọn ihò inú ilẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ibi ahoro.”
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ tààràtà, “àwọn ihò ilẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: àwọn ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ìbátan onípò ajẹmọ́ yìí ń tọ́ka sí àwọn olóòótọ́ tí a mẹ́nu kàn ṣáájú; ‘àwọn ẹni tí’ jẹ́ ọ̀nà Yorùbá àdánidá láti so wọ́n mọ́ ìdájọ́ tó tẹ̀ lé e.
- source_word: ἄξιος
  choice: yẹ fún
  rationale: '‘Yẹ fún’ pa ìtumọ̀ ìdájọ́ nípa iye àti ọlá mọ́: ayé kò ní iye tó yẹ fún irú àwọn olóòótọ́ bẹ́ẹ̀.'
- source_word: κόσμος
  choice: ayé
  rationale: ‘Ayé’ jẹ́ ìtumọ̀ Yorùbá tó gbòòrò, tó sì ṣeé lóye fún κόσμος níbí, ní pàtàkì fún àwùjọ ènìyàn tó kọ àwọn olóòótọ́ sílẹ̀.
- source_word: ἐπὶ ἐρημίαις
  choice: ní àwọn aṣálẹ̀
  rationale: Nínú àyíká rírìn káàkiri yìí, gbólóhùn náà ń tọ́ka sí ibi; ‘aṣálẹ̀’ pa àwòrán ibi gbígbẹ, ibi tí ènìyàn kò fi bẹ́ẹ̀ gbé mọ́.
- source_word: πλανώμενοι
  choice: wọ́n ń rìn káàkiri
  rationale: Ó fi ìrìn tí kò ní ibùdó kan pàtó àti ipò ìsáǹsá wọn hàn ní Yorùbá àdánidá.
- source_word: ὄρεσι
  choice: àwọn òkè ńlá
  rationale: ‘Àwọn òkè ńlá’ jẹ́ ìtumọ̀ tó ṣe kedere fún ibi gíga tí ὄρος ń tọ́ka sí.
- source_word: σπηλαίοις
  choice: àwọn ihò àpáta
  rationale: ‘Ihò àpáta’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ihò àdánidá inú àpáta, ìyẹn cave.
- source_word: ὀπαῖς τῆς γῆς
  choice: àwọn ihò inú ilẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn àlàfo tàbí ihò ilẹ̀; ‘ihò inú ilẹ̀’ jẹ́ Yorùbá àdánidá tó sì pa àwòrán gidi náà mọ́.
theological_decisions:
- issue: Ìtọ́kasí àti agbára ọ̀rọ̀ náà pé ‘ayé kò yẹ fún wọn’
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìdájọ́ lórí ayé ní ìfiwéra pẹ̀lú iye àwọn olóòótọ́ tó jìyà.
  alternative: Kí a mú un gẹ́gẹ́ bí ọ̀rọ̀ lásán pé àwọn olóòótọ́ àti ayé kò bára mu.
  rationale: Gíríìkì ṣe ìdájọ́ iye tó lágbára, kì í ṣe àkíyèsí nípa àwùjọ nìkan. Ìtumọ̀ náà pa ìforígbárí yìí mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àwọn ọ̀rọ̀ ibùdó Yorùbá tó yàtọ̀—‘ní,’ ‘lórí,’ àti ‘nínú’—gẹ́gẹ́ bí ibi kọ̀ọ̀kan ṣe rí, láìyí àtòjọ Gíríìkì padà.
