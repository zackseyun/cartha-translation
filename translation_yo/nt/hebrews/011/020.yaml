source:
  edition: SBLGNT
  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, Ísáákì súre fún Jékọ́bù àti Ísò, àní nípa àwọn ohun tí ń bọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Ó fi hàn pé ìgbàgbọ́ ni ọ̀nà tàbí ìpìlẹ̀ tí Ísáákì fi ṣe ohun náà.
- source_word: εὐλόγησεν
  choice: súre fún
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún fífi ìbùkún sọ lé ẹnì kan lórí.
- source_word: περὶ μελλόντων
  choice: nípa àwọn ohun tí ń bọ̀
  rationale: Ó pa ìtumọ̀ gbólóhùn Gíríìkì mọ́ gẹ́gẹ́ bí àwọn ohun ọjọ́ iwájú, láì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ní ipò yìí, καὶ lè jẹ́ àfikún ìtẹnumọ́; “pẹ̀lú” sọ pé ìbùkún náà kan àwọn ohun ọjọ́ iwájú pàápàá, láì mú kí Yorùbá le.
theological_decisions:
- issue: Bí a ṣe máa sọ καὶ tó wà ṣáájú περὶ μελλόντων
  choice: nípa àwọn ohun tí ń bọ̀ pẹ̀lú
  alternative: àní nípa àwọn ohun tí ń bọ̀
  rationale: Àfọwọkọ SBLGNT ní καὶ; a pa ipa àfikún rẹ̀ mọ́ pẹ̀lú “pẹ̀lú.” “Àní” lè jẹ́ ìtẹnumọ́ tó lágbára ju ohun tí àyíká ọ̀rọ̀ fi dandan mú lọ.
- issue: Irú ìbùkún Ísáákì
  choice: A kò ṣàlàyé rẹ̀ sí àsọtẹ́lẹ̀ tàbí ìlérí nìkan
  alternative: sọ àsọtẹ́lẹ̀ nípa ọjọ́ iwájú fún wọn
  rationale: Ọ̀rọ̀ εὐλόγησεν sọ pé ó súre fún wọn, nígbà tí περὶ μελλόντων sọ ohun tí ìbùkún náà dá lé; ìtumọ̀ náà kò yẹ kí ó dín ìbùkún sí àsọtẹ́lẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà jẹ́ kúkúrú, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní.
