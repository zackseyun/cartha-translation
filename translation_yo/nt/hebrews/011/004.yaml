id: HEB.11.4
reference: Hebrews 11:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: yo
  text: Ìgbàgbọ́ ni Ábẹ́lì fi rú ẹbọ tí ó dára ju ti Káínì lọ sí Ọlọ́run[a]. Nípasẹ̀ ẹbọ náà ni a jẹ́rìí sí i pé olódodo ni òun[b], Ọlọ́run sì jẹ́rìí nípa àwọn ọrẹ rẹ̀. Nípasẹ̀ rẹ̀ sì ni ó ṣì ń sọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé ó ti kú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹbọ tí ó tóbi ju.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí bí ẹbọ náà ti dára tó tàbí bí ó ti pọ̀/tóbi tó.
    reason: lexical_alternative
  - marker: b
    text: Èyí tún lè jẹ́ ‘a fi ẹ̀rí hàn pé olódodo ni òun’ tàbí ‘a gbà á sí olódodo.’
    reason: lexical_alternative
  - marker: c
    text: ‘Nípasẹ̀ rẹ̀’ lè tọ́ka sí ìgbàgbọ́ Ábẹ́lì tàbí sí ẹbọ rẹ̀; èdè Gíríìkì kò sọ èyí ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Ìgbàgbọ́ ni ... fi
  rationale: Dative of means. Ilana Yorùbá ‘X ni ... fi’ naturally expresses ‘by means of X’ while retaining faith as the governing theme.
- source_word: πλείονα θυσίαν
  choice: ẹbọ tí ó dára ju ... lọ
  rationale: The comparative most likely expresses qualitative superiority in context. ‘Tí ó dára ju’ is natural Yoruba and does not add the more interpretive idea ‘more acceptable.’ The possible quantitative sense is retained in footnote [a].
- source_word: παρὰ Κάϊν
  choice: ju ti Káínì lọ
  rationale: With the comparative, παρά marks Cain as the standard of comparison. Yoruba idiom uses ‘ju ... lọ’; ‘ti Káínì’ elliptically denotes Cain’s sacrifice.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: rú ... sí Ọlọ́run
  rationale: ‘Rú ẹbọ’ is the established, natural Yoruba expression for offering a sacrifice, and ‘sí Ọlọ́run’ marks its recipient.
- source_word: δι’ ἧς
  choice: Nípasẹ̀ ẹbọ náà
  rationale: The feminine relative pronoun grammatically points most naturally to θυσίαν, ‘sacrifice.’ Repeating ‘ẹbọ náà’ avoids an unclear Yoruba pronoun at this point.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: a jẹ́rìí sí i pé olódodo ni òun
  rationale: This impersonal construction naturally conveys that testimony was borne concerning Abel and preserves the μαρτυρέω witness motif. ‘Olódodo’ is the standard dignified equivalent of δίκαιος.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: Ọlọ́run sì jẹ́rìí nípa àwọn ọrẹ rẹ̀
  rationale: The clause explicitly identifies God as the one testifying. ‘Nípa’ conveys reference to the gifts, and ‘àwọn ọrẹ’ preserves the lexical sense of δῶρα in its sacrificial context.
- source_word: δι’ αὐτῆς
  choice: Nípasẹ̀ rẹ̀
  rationale: 'The Yoruba pronoun leaves the referent open, as does the Greek: it may refer to Abel’s faith or to his sacrifice.'
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: ó ṣì ń sọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé ó ti kú
  rationale: ‘Ṣì ń sọ̀rọ̀’ expresses the continuing force of the present tense, while the concessive clause naturally sets his death in contrast with his continuing speech.
theological_decisions:
- issue: Referent of δι’ αὐτῆς in the final clause
  choice: Retained as the unspecific pronoun ‘rẹ̀’
  alternative: ‘Nípasẹ̀ ìgbàgbọ́ rẹ̀’ or ‘nípasẹ̀ ẹbọ rẹ̀’
  rationale: Both faith, the thematic frame, and sacrifice, the nearer relevant noun, are plausible antecedents. The main text does not resolve the genuine ambiguity; footnote [c] names both possibilities.
- issue: Force of ἐμαρτυρήθη
  choice: 'Used witness language: ‘a jẹ́rìí sí i pé olódodo ni òun’'
  alternative: ‘a yìn ín pé olódodo ni òun’ or ‘a fi ẹ̀rí hàn pé olódodo ni òun’
  rationale: The selected wording preserves Hebrews 11’s repeated testimony/witness motif without reducing the clause to praise or approval alone.
translation_notes:
  register: Standard Yoruba with full tone marks, in a current, dignified register. The sentence uses ordinary Yoruba sacrificial vocabulary (‘rú ẹbọ’) and preserves the source’s witness motif and final referential ambiguity without denominational expansion.
