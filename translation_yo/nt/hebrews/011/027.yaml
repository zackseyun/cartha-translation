id: HEB.11.27
reference: Hebrews 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, ó fi Íjíbítì sílẹ̀,[a] kò bẹ̀rù ìbínú ọba, nítorí ó dúró ṣinṣin gẹ́gẹ́ bí ẹni tí ó ń rí Ẹni tí a kò lè rí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí èyí tọ́ka sí ìgbà tí Mósè sá kúrò ní Íjíbítì nítorí Fáráò (Ẹ́kísódù 2), tàbí sí ìgbà tí ó kó àwọn ọmọ Ísírẹ́lì jáde kúrò níbẹ̀ (Ẹ́kísódù 12–14); ọ̀rọ̀ Gíríìkì kò sọ èwo ní pàtó.
    reason: cross_reference
  - marker: b
    text: A tún lè tú u sí “Ẹni Àìrí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù náà ń fi ọ̀nà tàbí ìpìlẹ̀ ìṣe Mósè hàn; yíyan yìí tún bá ìlànà àsọyé Hébérù 11 mu.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ó fi Íjíbítì sílẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó kúrò ní Íjíbítì, láìfi ìtumọ̀ ‘kọ̀ sílẹ̀ pátápátá’ tí ó lè lágbára jù kún un.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: kò bẹ̀rù ìbínú ọba
  rationale: Ó pa ìsopọ̀ pẹ̀lú ìṣe pàtàkì mọ́, ó sì tú θυμός sí ‘ìbínú’ láìmú un le ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
- source_word: τὸν ἀόρατον
  choice: Ẹni tí a kò lè rí
  rationale: Àpèjúwe ἀόρατον ní àpilẹ̀kọ, tí a lò gẹ́gẹ́ bí orúkọ, ń tọ́ka sí ẹni kan; gbolohun yìí dá ìtumọ̀ àìrí hàn ní Yorùbá àdánidá.
- source_word: ὡς ὁρῶν
  choice: bí ẹni pé ó ń rí
  rationale: Ó pa agbára ìfiwéra ὡς mọ́, ó sì dá ìtakora àmọ̀nà náà hàn pé ó dà bí ẹni tí ń rí Ẹni àìrí.
- source_word: ἐκαρτέρησεν
  choice: ó dúró ṣinṣin
  rationale: καρτερέω túmọ̀ sí fífaradà tàbí títẹ̀síwájú láìyẹsẹ̀; ‘ó dúró ṣinṣin’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu ní àyíká yìí.
theological_decisions:
- issue: Ìṣẹ̀lẹ̀ wo ni ‘ó fi Íjíbítì sílẹ̀’ ń tọ́ka sí?
  choice: A kò pinnu nínú ẹsẹ náà bóyá ó ń tọ́ka sí àsálà Mósè tàbí sí ìjádelọ Israẹli.
  alternative: Kí a sọ ní pàtó pé ó jẹ́ àsálà Mósè ní Ẹ́kísódù 2, tàbí pé ó jẹ́ ìjádelọ pẹ̀lú Israẹli ní Ẹ́kísódù 12–14.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìṣẹ̀lẹ̀ náà ní pàtó; nítorí náà, a pa àìdánilójú tòótọ́ inú ẹ̀rí orísun mọ́.
- issue: Ìbáṣepọ̀ ‘rírí’ àti Ẹni àìrí
  choice: 'A pa àkójọpọ̀ àmọ̀nà náà mọ́: ó dúró ṣinṣin bí ẹni pé ó ń rí Ẹni tí a kò lè rí.'
  alternative: Kí a tú u sí rírí Ọlọ́run nípa ojú ìgbàgbọ́.
  rationale: Ìtumọ̀ àfikún náà lè ṣàlàyé ẹ̀kọ́ inú ọ̀rọ̀, ṣùgbọ́n Gíríìkì fúnra rẹ̀ lo àwòrán àmọ̀nà láìsọ ‘ojú ìgbàgbọ́.’
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì àlàyé ẹsẹ̀ ni a so mọ́ ibi tí ọ̀kọ̀ọ̀kan wúlò sí.
