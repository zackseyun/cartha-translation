- from: Ṣùgbọ́n bí ọ̀ràn ti rí, wọ́n ń hára gàgà fún ilẹ̀ ìbílẹ̀ kan tí ó sàn jù—èyíinì ni, èyí tí ó jẹ́ ti ọ̀run.[a] Nítorí náà, ojú kò ti Ọlọ́run nítorí wọn, pé kí a máa pè é ní Ọlọ́run wọn, nítorí ó ti pèsè ìlú kan sílẹ̀ fún wọn.
  to: Ṣùgbọ́n bí ọ̀ràn ti rí, wọ́n ń hára gàgà fún ilẹ̀ ìbílẹ̀ kan tí ó sàn jù—ìyẹn ni, èyí tí ó jẹ́ ti ọ̀run.[a] Nítorí náà, Ọlọ́run kò tijú láti jẹ́ kí a máa pè é ní Ọlọ́run wọn, nítorí ó ti pèsè ìlú kan sílẹ̀ fún wọn.
