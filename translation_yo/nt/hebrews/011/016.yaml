id: HEB.11.16
reference: Hebrews 11:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: yo
  text: Ṣùgbọ́n bí ọ̀ràn ti rí, wọ́n ń hára gàgà fún ilẹ̀ ìbílẹ̀ kan tí ó sàn jù—ìyẹn ni, èyí tí ó jẹ́ ti ọ̀run.[a] Nítorí náà, Ọlọ́run kò tijú láti jẹ́ kí a máa pè é ní Ọlọ́run wọn, nítorí ó ti pèsè ìlú kan sílẹ̀ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, a fi orúkọ náà sílẹ̀; àwọn ajẹtífù tí a túmọ̀ sí ‘tí ó sàn jù’ àti ‘tí ó jẹ́ ti ọ̀run’ ṣeé ṣe kí wọ́n tọ́ka padà sí ‘ilẹ̀ ìbílẹ̀’ nínú ẹsẹ 14. A tún lè túmọ̀ ọ́ sí ‘ilẹ̀ ìbílẹ̀ tí ó sàn jù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n bí ọ̀ràn ti rí
  rationale: Ó jẹ́ àmì ìyàtọ̀ nínú ìjíròrò, ó sì ń fi ohun tí ó ṣẹlẹ̀ gan-an wé ohun tí ẹsẹ 15 sọ pé ó lè ṣẹlẹ̀; kì í ṣe àkókò ‘nísinsin yìí’ lásán.
- source_word: ὀρέγονται
  choice: wọ́n ń hára gàgà fún
  rationale: Ọ̀rọ̀ náà ń sọ ìfẹ́-ọkàn jíjinlẹ̀ àti lílépa ohun kan, kì í ṣe fífẹ́ rẹ̀ lásán.
- source_word: κρείττονος ... ἐπουρανίου
  choice: ilẹ̀ ìbílẹ̀ kan tí ó sàn jù—èyíinì ni, èyí tí ó jẹ́ ti ọ̀run
  rationale: Àwọn ajẹtífù Gíríìkì náà tọ́ka padà sí πατρίς nínú àyíká ọ̀rọ̀; ‘ilẹ̀ ìbílẹ̀’ sọ ìtumọ̀ náà ní Yorùbá àdánidá láìfi àlàyé míì kún un.
- source_word: οὐκ ἐπαισχύνεται
  choice: ojú kò ti Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan kò tijú, ó sì pa ìtumọ̀ ọlá àti ìbáṣepọ̀ inú ọ̀rọ̀ náà mọ́.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: pé kí a máa pè é ní Ọlọ́run wọn
  rationale: Ó pa èdè ìbáṣepọ̀ náà mọ́ gẹ́gẹ́ bí ìsọ̀rí tàbí orúkọ tí a fi ń pe Ọlọ́run, láìfẹ̀ sí i sí ‘wọ́n jẹ́ ènìyàn rẹ̀.’
- source_word: ἡτοίμασεν ... πόλιν
  choice: ó ti pèsè ìlú kan sílẹ̀
  rationale: ‘Ó ti pèsè ... sílẹ̀’ fi iṣẹ́ tí ó ti parí tí ó sì ṣì ní ipa hàn; ‘ìlú kan’ pa àwòrán pàtó πόλις mọ́.
theological_decisions:
- issue: Orúkọ tí a kò kọ síta lẹ́yìn κρείττονος àti ἐπουρανίου
  choice: Fi ‘ilẹ̀ ìbílẹ̀’ kún un láti inú àyíká ọ̀rọ̀
  alternative: Fi ‘ilẹ̀’ tàbí ‘ohun kan tí ó sàn jù’ sí i
  rationale: Ìbámu gírámà àti àyíká ẹsẹ 14 tọ́ka sí πατρίς. ‘Ilẹ̀ ìbílẹ̀’ jẹ́ èdè Yorùbá tí ó ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì kò tún orúkọ náà sọ ní ẹsẹ yìí.
- issue: Ọ̀rọ̀ májẹ̀mú ‘Ọlọ́run wọn’
  choice: Pa ọ̀rọ̀ ìbáṣepọ̀ náà mọ́ láìfẹ̀ sí i
  alternative: Ṣàlàyé rẹ̀ sí ‘láti gbà wọ́n gẹ́gẹ́ bí ènìyàn rẹ̀’
  rationale: Orísun sọ ní pàtó pé a ń pè é ní Ọlọ́run wọn; fífẹ̀ sí i yóò mú èrò tí kò sí ní tààràtà wọ inú ìtumọ̀.
- issue: αὐτούς gẹ́gẹ́ bí ohun tí ìtìjú náà kàn
  choice: ‘ojú kò ti Ọlọ́run nítorí wọn’
  alternative: ‘ojú kò ti Ọlọ́run láti jẹ́ Ọlọ́run wọn’
  rationale: Ìtumọ̀ tí a yàn pa ìtọ́kasí sí ‘wọn’ mọ́ ní apá àkọ́kọ́, gẹ́gẹ́ bí Gíríìkì, bí ó tilẹ̀ jẹ́ pé Yorùbá nílò ‘nítorí’ láti jẹ́ kí gbólóhùn náà ṣe déédé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. ‘Ń hára gàgà fún’ jẹ́ ọ̀rọ̀ tí ènìyàn lásán lè lóye, ó sì gbé agbára ìfẹ́ inú ὀρέγονται jáde. A pa ‘ìlú’ mọ́ gẹ́gẹ́ bí àwòrán ìkẹyìn tí ó yàtọ̀ sí ‘ilẹ̀ ìbílẹ̀.’
