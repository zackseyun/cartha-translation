  source_fidelity: Ìtumọ̀ náà mú ìfẹ́ wọn sí ilẹ̀/ìbílẹ̀ ọ̀run, ìpèsè ìlú kan, àti ìbáṣepọ̀ ‘Ọlọ́run wọn’ jáde dáadáa. Síbẹ̀, ‘ojú kò ti Ọlọ́run nítorí wọn’ yí ìtumọ̀ οὐκ ἐπαισχύνεται αὐτούς padà sí pé Ọlọ́run kò tijú nítorí wọn, dípò pé kò tijú láti jẹ́ kí a pè é ní Ọlọ́run wọn.
  naturalness: ‘Bí ọ̀ràn ti rí,’ ‘ń hára gàgà fún,’ àti ‘ó ti pèsè ... sílẹ̀’ jẹ́ Yorùbá òde òní, tó sì yẹ fún ìforígbárí ẹsẹ náà. ‘ìyẹn ni’ jẹ́ ọ̀nà tí ó rọrùn, tí ó wọ́pọ̀ ju ‘èyíinì ni’ lọ nínú ìsọ̀rọ̀ yìí. Àtúnṣe gbolohun nípa ìtìjú náà ń mú un rọrùn láti lóye.
  terminology: ‘Ilẹ̀ ìbílẹ̀’ yẹ fún πατρίς nínú àyíká, ‘tí ó jẹ́ ti ọ̀run’ pa ìwà-ajẹtífù ἐπουράνιος mọ́, ‘Ọlọ́run wọn’ sì pa ọ̀rọ̀ májẹ̀mú náà mọ́ láìfi ìtumọ̀ mìíràn kún un. ‘Ìlú’ jẹ́ ìtumọ̀ tó pé fún πόλις.
