id: HEB.11.19
reference: Hebrews 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: yo
  text: Ó rò pé Ọlọ́run lágbára láti jí ènìyàn dìde, àní láti inú àwọn òkú; nípa bẹ́ẹ̀[a] ni ó sì gba a padà ní ìṣàpẹẹrẹ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí náà.” Ὅθεν lè tọ́ka sí ipò tàbí orísun tí a ṣẹ̀ṣẹ̀ sọ, ó sì tún lè fi ìyọrísí hàn.
    reason: Ìtumọ̀ mìíràn fún ὅθεν.
  - marker: b
    text: Tàbí, “nínú àkàwé.” Èyí fi hàn pé Ábúráhámù gba Ísákì padà bí ẹni pé ó ti inú ikú padà, kì í ṣe nípasẹ̀ àjíǹde gidi.
    reason: Ìtumọ̀ mìíràn àti àlàyé fún ἐν παραβολῇ.
lexical_decisions:
- source_word: λογισάμενος
  choice: Ó rò pé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìrònú àti ìgbéyẹ̀wò inú Ábúráhámù; ‘ó rò pé’ jẹ́ ọ̀nà àdánidá, tó sì ṣe kedere ní Yorùbá.
- source_word: ἐκ νεκρῶν
  choice: láti inú òkú
  rationale: Èyí pa èdè àjíǹde inú Gíríìkì mọ́, ó sì jẹ́ gbólóhùn tí a lè lóye ní Yorùbá gẹ́gẹ́ bí jíjí dìde kúrò nínú ipò ikú.
- source_word: ἐγείρειν
  choice: láti jí ènìyàn dìde
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí jíjí ènìyàn dìde kúrò nínú òkú, kì í ṣe jíjí lójú oorun.
- source_word: δυνατὸς ὁ θεός
  choice: Ọlọ́run lágbára
  rationale: Èyí fi agbára àti àǹfààní Ọlọ́run láti ṣe ohun náà hàn ní kíkún, ó sì bá ìṣètò ọ̀rọ̀ Gíríìkì mu.
- source_word: καὶ ἐκ νεκρῶν
  choice: àní láti inú òkú
  rationale: '‘Àní’ mú ipa ìtẹnumọ́ καὶ jáde: agbára Ọlọ́run débi pé ó lè jí ènìyàn dìde láti inú òkú pàápàá.'
- source_word: ὅθεν
  choice: láti ibẹ̀
  rationale: Èyí pa ìtumọ̀ ìpilẹ̀ṣẹ̀ tàbí ibi tí ọ̀rọ̀ náà ti wá mọ́, ó sì lè tọ́ka padà sí òkú; àlàyé ìtumọ̀ ìyọrísí wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν παραβολῇ
  choice: ní ìṣàpẹẹrẹ
  rationale: Èyí fi hàn pé gbigba Ísákì padà dà bí àjíǹde ní àpẹẹrẹ, kì í ṣe pé ó kú, tí a sì jí i dìde ní ti gidi.
- source_word: ἐκομίσατο
  choice: ó sì ti gba a padà
  rationale: Fọ́ọ̀mù àárín ọ̀rọ̀-ìṣe náà àti àyíká ìtàn rúbọ Ísákì ń fi ìtumọ̀ gbigba ẹni náà padà hàn.
theological_decisions:
- issue: Irú ‘gbigba Ísákì padà’ tí ẹsẹ náà ń sọ
  choice: Ábúráhámù gba Ísákì padà ní ìṣàpẹẹrẹ, bí ẹni pé ó gba a padà láti inú òkú.
  alternative: A lè túmọ̀ ἐν παραβολῇ sí ‘nínú àkàwé,’ kí ìtẹnumọ́ wà lórí Ísákì gẹ́gẹ́ bí àpẹẹrẹ àsọtẹ́lẹ̀.
  rationale: ἐν παραβολῇ fi ìbájọra sí àjíǹde hàn láìsọ pé Ísákì kú ní ti gidi; ‘ní ìṣàpẹẹrẹ’ pa ìforígbárí àti àìdánilójú ìmọ̀-ẹ̀sìn tó wà nínú ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ ὅθεν
  choice: ‘láti ibẹ̀,’ tó pa ìtumọ̀ orísun tàbí ibi mọ́
  alternative: ‘nítorí náà,’ tó ka ọ̀rọ̀ náà gẹ́gẹ́ bí ìyọrísí ìrònú Ábúráhámù
  rationale: Ọ̀rọ̀ Gíríìkì lè ní agbára ibi/orísun tàbí agbára ìyọrísí. Ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa méjèèjì mọ́ láìfi tipátipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà tẹ̀ lé kókó ẹsẹ tó ṣáájú, ó sì jẹ́ kedere fún òǹkàwé lasán láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
