id: HEB.11.11
reference: Hebrews 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: yo
  text: Nípa ìgbàgbọ́, Sárà fúnra rẹ̀ pàápàá gba agbára láti lóyún ọmọ[a], bí ó tilẹ̀ jẹ́ pé ó ti kọjá àkókò ọjọ́-orí tí ó yẹ fún un, nítorí ó ka ẹni tí ó ṣe ìlérí sí olùṣòtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní gígúnmọ́ ọ̀rọ̀ sí ọ̀rọ̀, “gba agbára fún fífi irú-ọmọ lélẹ̀.” Gbólóhùn Gíríìkì náà ṣàrà ọ̀tọ̀, ó sì jẹ́ àkànlò èdè; nínú àyíká yìí, ó ń tọ́ka sí agbára láti bí ọmọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nípa ìgbàgbọ́
  rationale: Dátífù ohun èlò ni ọ̀rọ̀ náà nínú àtúnṣe tí Hébérù 11 máa ń lò; ‘nípa ìgbàgbọ́’ jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtumọ̀ rẹ̀ mọ́.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: Sárà fúnra rẹ̀ pàápàá
  rationale: ‘Fúnra rẹ̀’ fi ìtẹnumọ́ αὐτῇ hàn, ‘pàápàá’ sì mú ipa àfikún àti ìyàlẹ́nu tí καὶ lè ní nínú àyíká yìí jáde.
- source_word: δύναμιν ... ἔλαβεν
  choice: gba agbára
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì pé ó ‘gba agbára,’ ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς καταβολὴν σπέρματος
  choice: láti lóyún ọmọ
  rationale: Gbólóhùn Gíríìkì náà ṣàrà ọ̀tọ̀, ó sì jẹ́ àkànlò èdè tó ń tọ́ka sí ìbímọ. Níwọ̀n bí Sárà ti jẹ́ olùṣe nínú ẹsẹ yìí, ‘láti lóyún ọmọ’ sọ ìtumọ̀ inú àyíká náà ní Yorùbá àdánidá; ìtumọ̀ gígúnmọ́ ọ̀rọ̀ sí ọ̀rọ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: bí ó tilẹ̀ jẹ́ pé ó ti kọjá àkókò ọjọ́-orí tí ó yẹ fún un
  rationale: Èyí pa èrò pé ó ti kọjá àkókò tó bójú mu nínú ìgbésí ayé mọ́, láì fi àlàyé tí kò sí ní pàtó nínú Gíríìkì kún un.
- source_word: ἐπεὶ
  choice: nítorí
  rationale: Ó fi ìdí tí Sárà fi gba agbára náà hàn lọ́nà tó ṣe kedere.
- source_word: πιστὸν
  choice: olóòótọ́
  rationale: ‘Olóòótọ́’ sọ ìgbẹ́kẹ̀lé àti ìdúróṣinṣin ẹni tí ó ṣèlérí, ó sì ní ìwọ̀n ẹ̀sìn tó yẹ láì ṣàfikún ẹ̀kọ́ mìíràn.
- source_word: ἡγήσατο
  choice: ó ka ... sí
  rationale: Àkànṣe Yorùbá yìí sọ ìdájọ́ ọkàn tàbí bí ẹni ṣe gbà pé ohun kan rí.
- source_word: τὸν ἐπαγγειλάμενον
  choice: ẹni tí ó ṣe ìlérí
  rationale: Ó tú participle oní-orúkọ náà sí Yorùbá tó ṣe kedere, láì fi orúkọ Ọlọ́run kún ibi tí ọ̀rọ̀ Gíríìkì kò ti sọ ọ́ ní tààrà.
theological_decisions:
- issue: Olùṣe àti ìtumọ̀ ìṣe Sárà nínú gbólóhùn tí ìṣọ̀kan rẹ̀ ṣòro
  choice: 'Sárà ni olùṣe: ó gba agbára láti lóyún ọmọ.'
  alternative: A lè ka Ábúráhámù sí ẹni tí ó ní ipa àkọ́kọ́ tàbí pé gbólóhùn náà ń tọ́ka sí fífi irú-ọmọ lélẹ̀.
  rationale: Nínú ẹ̀dà ọ̀rọ̀ yìí, αὐτῇ Σάρρᾳ fi Sárà hàn gẹ́gẹ́ bí olùṣe ἔλαβεν lọ́nà tó ṣeé gbà jù. Bí ó tilẹ̀ jẹ́ pé καταβολὴ σπέρματος lè dun bí àwòrán tó ní í ṣe pẹ̀lú ọkùnrin nígbà tí a bá túmọ̀ rẹ̀ ní gígúnmọ́, àyíká náà tẹnumọ́ ìgbàgbọ́ Sárà àti oyún àgbàyanu rẹ̀ láìka ọjọ́-orí sí.
- issue: Ìtumọ̀ πιστός nípa ẹni tí ó ṣèlérí
  choice: olóòótọ́
  alternative: ẹni tí a lè gbẹ́kẹ̀ lé; ẹni tí ó ṣeé fọkàn tán
  rationale: Ẹsẹ náà fi ìgbàgbọ́ Sárà gbé karí ìdúróṣinṣin ẹni tí ó ṣèlérí. ‘Olóòótọ́’ pa ìwúwo ẹ̀kọ́ ìsìn mọ́ láì fi ohun tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìtẹnumọ́ Sárà mọ́, a sì yàgò fún èdè ìjọ kan pàtó tàbí ìtúmọ̀ ẹ̀kọ́ tí ọ̀rọ̀ kò fi lélẹ̀.
