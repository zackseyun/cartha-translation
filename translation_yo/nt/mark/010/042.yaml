id: MRK.10.42
reference: Mark 10:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: yo
  text: Jésù sì pè wọ́n sọ́dọ̀ ara rẹ̀, ó sì wí fún wọn pé, “Ẹ̀yin mọ̀ pé àwọn tí a kà sí olórí[a] àwọn orílẹ̀-èdè[b] ń fi agbára ṣàkóso wọn, àwọn ẹni ńlá láàárín wọn sì ń lo àṣẹ lórí wọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn tí ó dàbí ẹni pé wọ́n ń ṣàkóso.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn tí kì í ṣe Júù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pè wọ́n sọ́dọ̀ ara rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù pe àwọn ọmọ-ẹ̀yìn náà kí wọ́n wá sí ọ̀dọ̀ rẹ̀; ó tún pa ìtumọ̀ middle voice mọ́ ní Yorùbá àdánidá.
- source_word: λέγει
  choice: ó sì wí fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, ìṣe àtẹ̀yìnwá bá ìtàn Yorùbá mu dáadáa, láìyí iṣẹ́ ọ̀rọ̀ náà padà.
- source_word: Οἴδατε
  choice: Ẹ̀yin mọ̀ pé
  rationale: οἶδα ní ìtumọ̀ ìsinsìnyí níbí; “mọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: àwọn tí a kà sí olórí
  rationale: Èyí pa ìtumọ̀ pé àwọn ènìyàn ń gbà wọ́n sí olórí mọ́, láìsọ pé àṣẹ wọn kàn dàbí àṣẹ lásán.
- source_word: τῶν ἐθνῶν
  choice: àwọn orílẹ̀-èdè
  rationale: ἔθνη lè tọ́ka sí àwọn orílẹ̀-èdè tàbí àwọn aláìní Júù. “Àwọn orílẹ̀-èdè” jẹ́ àṣàyàn gbooro tí kò fi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí; àlàyé ìsàlẹ̀ fi àṣàyàn kejì hàn.
- source_word: κατακυριεύουσιν
  choice: ń fi agbára ṣàkóso wọn
  rationale: Gbólóhùn yìí mú ìṣàkóso líle tàbí ti ìfipámúnilò tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí jáde ní Yorùbá tó ṣe kedere.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: àwọn ẹni ńlá láàárín wọn
  rationale: Èyí tọ́ka sí àwọn olókìkí tàbí alágbára láàárín wọn, láìfi oyè pàtó kan tí Gíríìkì kò sọ kún un.
- source_word: κατεξουσιάζουσιν
  choice: ń lo àṣẹ lórí wọn
  rationale: Èyí pa ìtumọ̀ lílo àṣẹ mọ́, ó sì dá ìyàtọ̀ díẹ̀ sílẹ̀ láàárín rẹ̀ àti ìṣàkóso líle nínú gbólóhùn tó ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ τῶν ἐθνῶν
  choice: àwọn orílẹ̀-èdè
  alternative: àwọn aláìní Júù
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí àwọn orílẹ̀-èdè ní gbogbogbòò tàbí àwọn ènìyàn tí kì í ṣe Júù. Ọ̀rọ̀ inú ẹsẹ náà ń sọ nípa ètò ìṣàkóso àwọn ènìyàn ayé, nítorí náà a yan àṣàyàn gbooro, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé.
- issue: Agbára ìtumọ̀ δοκοῦντες
  choice: àwọn tí a kà sí olórí
  alternative: àwọn tí ó dàbí ẹni pé wọ́n ń ṣàkóso
  rationale: Àṣàyàn àkọ́kọ́ fi hàn pé àwọn ènìyàn mọ̀ wọ́n sí olórí, láìpinnu pé àṣẹ wọn kì í ṣe ojúlówó. Àlàyé pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Ń fi agbára ṣàkóso” sọ ìwà ìṣàkóso líle jáde ní kedere, nígbà tí “ń lo àṣẹ” pa ìbáradọ́gba àti ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
