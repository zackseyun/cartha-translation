id: MRK.10.40
reference: Mark 10:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: yo
  text: Ṣùgbọ́n láti jókòó ní apá ọ̀tún mi tàbí ní apá òsì mi, kì í ṣe tèmi láti fi fúnni[a], bí kò ṣe fún àwọn tí a ti pèsè rẹ̀ sílẹ̀ fún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe fún mi láti fi fúnni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: láti jókòó
  rationale: Ọ̀rọ̀ náà jẹ́ infinitive tí ó ń ṣiṣẹ́ bí orúkọ nínú Gíríìkì, ṣùgbọ́n “láti jókòó” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìṣe náà mọ́.
- source_word: ἐκ δεξιῶν μου
  choice: ní apá ọ̀tún mi
  rationale: Èyí sọ ipò ní ẹ̀gbẹ́ ọ̀tún ẹni; “ní apá ọ̀tún mi” jẹ́ kedere, ó sì bá èdè Yorùbá mu láìfi “ọwọ́” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἢ ἐξ εὐωνύμων
  choice: tàbí ní apá òsì mi
  rationale: Àṣà ọ̀rọ̀ Gíríìkì yìí túmọ̀ sí ẹ̀gbẹ́ òsì; a ṣe é ní ìbámu pẹ̀lú “ní apá ọ̀tún mi” láti pa ìwọ̀ntúnwọ̀nsì gbólóhùn náà mọ́.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: kì í ṣe tèmi láti fi fúnni
  rationale: Ìtumọ̀ yìí tẹ̀lé gbolohun Gíríìkì pẹ́kípẹ́kí, ó sì pa àìṣedéédé ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láìṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
- source_word: ἀλλ’ οἷς
  choice: bí kò ṣe fún àwọn tí
  rationale: Gíríìkì fi apá kan sílẹ̀ fún olùkà láti lóye láti inú gbólóhùn tó ṣáájú. “Bí kò ṣe fún àwọn tí” jẹ́ kí ìyàtọ̀ náà hàn ní Yorùbá láìfi àlàyé tuntun kún un.
- source_word: ἡτοίμασται
  choice: a ti pèsè rẹ̀ sílẹ̀
  rationale: Perfect passive náà tọ́ka sí ìmúrasílẹ̀ tí a ti parí, tí àbájáde rẹ̀ sì ṣì dúró. “A ti pèsè rẹ̀ sílẹ̀” mú apá méjèèjì yìí jáde lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jésù ń sẹ́ àṣẹ rẹ̀ pátápátá tàbí ó ń sọ ààlà kan nínú àyíká ìtàn náà nìkan
  choice: kì í ṣe tèmi láti fi fúnni
  alternative: kì í ṣe fún mi láti fi fúnni
  rationale: Gíríìkì sọ ààlà náà láìṣàlàyé ìdí rẹ̀. A kò fi “láìsí ìfẹ́ Baba” tàbí ìbámu ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un, kí ìforígbárí tí ọ̀rọ̀ náà ní lè dúró.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. “Ní apá ọ̀tún/òsì mi” jẹ́ kedere sí olùkà lásán, “fi fúnni” sì pa èrò fífi ipò náà fún ẹnì kan mọ́.
