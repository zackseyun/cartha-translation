id: MRK.10.18
reference: Mark 10:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún un pé, “Èé ṣe tí o fi ń pè mí ní ẹni rere?[a] Kò sí ẹni rere bí kò ṣe ẹnì kan ṣoṣo—Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, “Kí ni o fi ń pè mí ní ẹni rere fún?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn láti inú ọ̀rọ̀ ọkùnrin náà sí ìdáhùn Jésù, láìsọ ìtakora náà di ohun tí ó lágbára jù.
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Jésù dá ọkùnrin náà lóhùn ní ọ̀rọ̀ tààrà.
- source_word: Τί
  choice: Èé ṣe tí
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààrà ni “kí ni,” nínú gbólóhùn yìí ó ń béèrè ìdí; “Èé ṣe tí” ni Yorùbá àdánidá.
- source_word: με λέγεις ἀγαθόν
  choice: o fi ń pè mí ní ẹni rere
  rationale: Ó pa ipa àsọyé ἀγαθόν mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere pé ọkùnrin náà ń pe Jésù ní ẹni rere.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: ẹni rere
  rationale: A lo ọ̀rọ̀ kan náà ní ìgbà méjèèjì láti pa àtúnṣe ọ̀rọ̀ àti agbára ìbéèrè Jésù mọ́; a kò fi àlàyé ìwà rere kún un.
- source_word: οὐδεὶς
  choice: Kò sí ẹni
  rationale: Ó ṣe àfihàn ìsẹ̀ gbogbo ènìyàn kedere àti ní Yorùbá àdánidá.
- source_word: εἰ μὴ εἷς
  choice: bí kò ṣe ẹnì kan ṣoṣo
  rationale: Ó pa ìyàsọ́tọ̀ àti ìtẹnumọ́ lórí ọ̀kan ṣoṣo mọ́ kí a tó dárúkọ Ọlọ́run.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni orúkọ àdánidá ní Yorùbá; kò nílò àfikún tí yóò bá àpilẹ̀kọ Gíríìkì mu ní tààrà.
theological_decisions:
- issue: Ohun tí ọ̀rọ̀ Jésù nípa rere lè túmọ̀ sí fún ẹni tí Kristi jẹ́
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààrà, láìfi àlàyé kún un pé Jésù ń sẹ́ jíjẹ́ Ọlọ́run tàbí pé ó ń kéde rẹ̀ ní gbangba.
  alternative: Ṣíṣe ọ̀rọ̀ náà ní ọ̀nà tí yóò fi mú kí Jésù dà bí ẹni pé ó sẹ́ jíjẹ́ Ọlọ́run, tàbí bí ẹni pé ó ń sọ ní kedere nínú ẹsẹ yìí pé òun ni Ọlọ́run.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìpèníjà Jésù sí lílo “rere” sílẹ̀ láìyanju gbogbo ìtumọ̀ ẹ̀kọ́ nípa ẹni tí ó jẹ́; ìtumọ̀ náà pa ìforígbárí yẹn mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹni rere” ni a lò dípò “rere” nìkan nítorí pé ó bá ìtọ́kasí sí ènìyàn mu ní Yorùbá, ó sì pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́.
