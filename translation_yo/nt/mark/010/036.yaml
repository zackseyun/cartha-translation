  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Kí ni ẹ fẹ́ kí n ṣe fún yín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tẹ ìtàn náà síwájú, ó sì tún tọ́ka sí ẹni tí ó ń sọ̀rọ̀ láìfi ìtakora tí kò lágbára sí i.
- source_word: εἶπεν αὐτοῖς
  choice: wí fún wọn pé
  rationale: ‘Wí fún wọn pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó bá wọn sọ̀rọ̀; bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ náà, kò pọndandan láti yí ọ̀rọ̀ ìṣe náà sí ‘béèrè.’
- source_word: Τί θέλετε
  choice: Kí ni ẹ fẹ́
  rationale: Èyí túmọ̀ ìbéèrè nípa ohun tí wọ́n ń fẹ́ ní Yorùbá òde òní tí ó ṣe kedere, tí ó sì bọ̀wọ̀ fún ọ̀pọ̀ ẹni nínú ọ̀rọ̀ Gíríìkì.
- source_word: ποιήσω ὑμῖν
  choice: kí n ṣe fún yín
  rationale: Ọ̀rọ̀ náà ń sọ iṣẹ́ tí wọ́n fẹ́ kí Jesu ṣe nítorí wọn; ‘fún yín’ fi ipa oníṣe-rere ti dátífù hàn lọ́nà àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A lo ‘ẹ/yín’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ẹni, ní ìbámu pẹ̀lú Gíríìkì.
