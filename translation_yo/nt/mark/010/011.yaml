  source_fidelity: 'Ìtumọ̀ náà ń tọ́ka sí gbogbo àwọn ẹ̀yà pàtàkì nínú Gíríìkì: ọ̀rọ̀ àídájú gbogbogbò, ìkọ̀sílẹ̀ aya, fífẹ́ obìnrin mìíràn, àti ìwà panṣágà tí a ṣe sí aya tí a kọ̀ sílẹ̀. Síbẹ̀, “sí aya rẹ̀” lè dún bí ohun tí a ṣe sí aya ní ọ̀nà tí kò rọrùn; arọ́pò-orúkọ “sí i” lẹ́yìn tí a ti mẹ́nuba aya náà ń tẹ̀lé ọ̀nà Yorùbá tí ó mọ́gbọ́n dání, ó sì pa itọ́ka ἐπ’ αὐτήν mọ́.'
  naturalness: '“Ó ṣe panṣágà sí i” jẹ́ ìlò Yorùbá Bíbélì/ìlò tí ó wọ́pọ̀ jù “ó ṣe panṣágà sí aya rẹ̀” lọ, ó sì kedere pé “i” náà ni aya tí a ṣẹ̀ṣẹ̀ mẹ́nuba. Àkọsílẹ̀ ìsàlẹ̀ náà tún gbọ́dọ̀ bá ọ̀rọ̀ ìpilẹ̀ mu: ìpilẹ̀ sọ “obìnrin mìíràn,” àṣàyàn sì lè sọ “aya mìíràn.”'
