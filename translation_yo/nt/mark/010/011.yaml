source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹnikẹ́ni tí ó bá kọ aya rẹ̀ sílẹ̀, tí ó sì fẹ́ obìnrin mìíràn,[a] ó ṣe panṣágà sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fẹ́ aya mìíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì sọ
  rationale: A lo ọ̀rọ̀ ìṣe àtẹ̀yìnwá ní Yorùbá fún ìtàn kí ó lè dùn bí èdè àdánidá; καί sì farahàn nínú “sì.”
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí fi ẹni tí a ń bá sọ̀rọ̀ hàn ní kedere gẹ́gẹ́ bí dative pronoun náà.
- source_word: Ὃς ἂν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àídájú gbogbogbò tí relative pronoun pẹ̀lú ἄν ń fi hàn.
- source_word: ἀπολύσῃ
  choice: kọ ... sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó, gbólóhùn Yorùbá yìí túmọ̀ sí fífi aya sílẹ̀ tàbí ìkọ̀sílẹ̀, kì í ṣe rírán ẹni lọ lásán.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: Àyíká ìgbéyàwó àti ọ̀rọ̀ arọ́pò oníni fi hàn pé γυνή túmọ̀ sí aya níhìn-ín.
- source_word: γαμήσῃ ἄλλην
  choice: fẹ́ obìnrin mìíràn
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbé obìnrin ní ìyàwó; “obìnrin mìíràn” mú abo tí ἄλλην ní kedere.
- source_word: μοιχᾶται
  choice: ó ṣe panṣágà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún ṣíṣe àgbèrè ní ìbáṣepọ̀ ìgbéyàwó.
- source_word: ἐπ’ αὐτήν
  choice: sí aya rẹ̀
  rationale: Èyí pa ìtọ́kasí sí aya àkọ́kọ́ mọ́, ó sì fi hàn pé ìṣe náà jẹ́ ẹ̀ṣẹ̀ sí i, kì í ṣe àlàyé panṣágà lásán.
theological_decisions:
- issue: Bí a ṣe máa pa agbára ἐπ’ αὐτήν mọ́ gẹ́gẹ́ bí ìwà àìtọ́ sí aya náà
  choice: “ó ṣe panṣágà sí aya rẹ̀”
  alternative: “ó ṣe panṣágà” tàbí “ó bá obìnrin mìíràn ṣe panṣágà”
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ἐπ’ αὐτήν, nítorí náà a kò yọ ìtumọ̀ pé ìṣe ọkọ náà jẹ́ àìṣòdodo sí aya tí ó kọ sílẹ̀ kúrò.
- issue: Ìtumọ̀ ọkùnrin nínú ọ̀rọ̀ àídájú gbogbogbò
  choice: “Ẹnikẹ́ni tí ó bá ... aya rẹ̀”
  alternative: “Ọkùnrin èyíkéyìí tí ó bá”
  rationale: Ὃς ἂν jẹ́ ọ̀rọ̀ àídájú gbogbogbò; “ẹnikẹ́ni” túmọ̀ èyí dáadáa, nígbà tí “aya rẹ̀” ṣì mú kí ó ṣe kedere pé ọkọ ni ẹni tí a ń sọ̀rọ̀ rẹ̀ nínú àyíká yìí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A yan àtẹ̀yìnwá “sọ” dípò àkókò ìsinsìnyí Gíríìkì nítorí èyí ni ìtàn àdánidá Yorùbá, láì pàdánù ìtumọ̀.
