id: MRK.10.1
reference: Mark 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: yo
  text: Ó sì dìde kúrò níbẹ̀, ó wá sí agbègbè Jùdíà àti ìhà kejì odò Jọ́dánì[a][b]. Ọ̀pọ̀ ènìyàn sì tún kóra jọ sọ́dọ̀ rẹ̀; gẹ́gẹ́ bí ó ti jẹ́ àṣà rẹ̀, ó sì tún ń kọ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọjá odò Jọ́dánì.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí agbègbè tí ó wà ní ìhà kejì odò Jọ́dánì.
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye ọ̀rọ̀ náà sí “agbègbè Jùdíà tí ó wà ní ìhà kejì odò Jọ́dánì.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: kúrò níbẹ̀
  rationale: Ó fi ibi tí Jésù ti jáde hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀναστὰς
  choice: Ó dìde
  rationale: Ó pa ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì mọ́, kò sì túmọ̀ ọ́ sí àjíǹde kúrò nínú òkú.
- source_word: ἔρχεται
  choice: ó wá sí
  rationale: Ó tẹ̀ lé ìgbésẹ̀ ìrìn-àjò inú Gíríìkì, ó sì jẹ́ ọ̀nà àdánidá láti sọ dídé sí ibi kan ní Yorùbá.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: agbègbè Jùdíà
  rationale: ὅρια lè tọ́ka sí ilẹ̀ tàbí agbègbè, kì í ṣe ìlà ààlà nìkan.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: àti òdìkejì odò Jọ́dánì
  rationale: Ó pa ìtòlẹ́sẹẹsẹ àti àìdánilójú gírámà Gíríìkì mọ́, ó sì fi ibi tí ó wà ní ìhà kejì odò hàn.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: Àwọn èrò ... kóra jọ sọ́dọ̀ rẹ̀
  rationale: Ó sọ ìrìn papọ̀ tàbí ìpéjọpọ̀ àwọn ènìyàn sí ọ̀dọ̀ Jésù ní Yorùbá tó ṣe kedere.
- source_word: πάλιν
  choice: tún
  rationale: A pa àtúnsọ ọ̀rọ̀ náà mọ́ ní ibi méjèèjì gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ὡς εἰώθει
  choice: gẹ́gẹ́ bí ó ti máa ń ṣe
  rationale: Ó fi ìṣe tí ó jẹ́ àṣà Jésù hàn ní èdè Yorùbá àdánidá.
- source_word: ἐδίδασκεν αὐτούς
  choice: ó ń kọ́ wọn
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ tàbí tó máa ń ṣẹlẹ̀ hàn, ní ìbámu pẹ̀lú imperfect Gíríìkì.
theological_decisions:
- issue: Ìsinsìnyí ìtàn (historical present) nínú ἔρχεται
  choice: ó wá sí
  alternative: ó lọ sí / ó dé sí
  rationale: Ètò ọ̀rọ̀-ìṣe Yorùbá kò bá ténsì Gíríìkì mu ní ọ̀nà kan náà. ‘Ó wá sí’ ń mú ìrìn-àjò náà sun mọ́ ojú ẹni láì mú kí gbolóhùn náà dà bí àjèjì.
- issue: Ìbáṣepọ̀ gírámà nínú καὶ πέραν τοῦ Ἰορδάνου
  choice: agbègbè Jùdíà àti òdìkejì odò Jọ́dánì
  alternative: agbègbè Jùdíà tí ó wà ní òdìkejì odò Jọ́dánì
  rationale: Àṣàyàn inú ọ̀rọ̀ pàtàkì kò pinnu bóyá ibi méjì ni a ń sọ tàbí bóyá gbólóhùn kejì ń ṣàlàyé agbègbè Jùdíà; àlàyé ìsàlẹ̀ ojú ìwé fi àṣàyàn kejì hàn.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀ tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn èrò’ fún ọ̀pọ̀ ènìyàn, ‘ó ń kọ́ wọn’ fún ìkọ́ni tó ń lọ, a sì gbe àmì àlàyé méjèèjì sí lẹ́yìn gbólóhùn ibi tí wọ́n ń ṣàlàyé, dípò ibi tí àfihàn Gẹ̀ẹ́sì fi wọ́n sí láìbáramu.
