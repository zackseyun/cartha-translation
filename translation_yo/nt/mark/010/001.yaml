  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: ó pa ìsẹ̀lẹ̀ ìjíde/ìkúrò, ìrìn sí agbègbè Jùdíà àti ìhà kejì Jọ́dánì, ìkórajọ àwọn ogunlọ́gọ̀ sọ́dọ̀ Jésù, àti ìkọ́ni rẹ̀ tí ó jẹ́ àṣà mọ́. Ṣùgbọ́n ‘òdìkejì odò Jọ́dánì’ kò pé ní ìtumọ̀ ibi; ó túmọ̀ sí ẹgbẹ́/apa kejì ti odò ní ti gidi, níbi tí πέραν τοῦ Ἰορδάνου ti ń tọ́ka sí ilẹ̀ tàbí agbègbè ní ìhà kejì odò náà. ‘Ìhà kejì odò Jọ́dánì’ dáa jù, ó sì pa àìdánilójú ìbáṣepọ̀ gírámà mọ́.'
  naturalness: Yorùbá náà jẹ́ èyí tí ó rọrùn, tó sì bójú mu. ‘Àwọn èrò’ lè túmọ̀ sí ìmọ̀ràn/èrò àwọn ènìyàn, nítorí náà ‘ọ̀pọ̀ ènìyàn’ jẹ́ ọ̀nà tó ṣe kedere àti tòde-òní jù fún ὄχλοι. A tún ṣe ‘gẹ́gẹ́ bí ó ti máa ń ṣe’ sí ‘gẹ́gẹ́ bí ó ti jẹ́ àṣà rẹ̀’ láti sọ εἰώθει (àṣà tí ó ti wọ́) ní ìforúkọsílẹ̀ ìtàn tó dára.
