  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: yo
  text: Nígbà tí wọ́n sì wọ inú ilé, àwọn ọmọ-ẹ̀yìn tún ń bi í léèrè nípa ọ̀rọ̀ yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “Nígbà tí wọ́n sì tún wọ inú ilé, àwọn ọmọ-ẹ̀yìn ń bi í léèrè nípa ọ̀rọ̀ yìí.”
    reason: πάλιν (“tún”) lè ṣàlàyé ìwọlé wọn sínú ilé, tàbí kí ó ṣàlàyé pé àwọn ọmọ-ẹ̀yìn tún béèrè.
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tí ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, láìfi ìtumọ̀ àkókò kún un.
- source_word: εἰς τὴν οἰκίαν
  choice: nígbà tí wọ́n ... wà nínú ilé
  rationale: εἰς níhìn-ín tọ́ka sí wíwọlé sí ibi ìkọ̀kọ̀ lẹ́yìn ìjíròrò ní gbangba; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé lítírésọ̀ ni ‘sínú ilé.’
- source_word: πάλιν
  choice: tún
  rationale: Ipò πάλιν lè jẹ́ kí ó bá wíwà nínú ilé tàbí bíbéèrè mu; a fi ‘tún’ sí ibi tí kò pa àìdánilójú náà run pátápátá.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ẹgbẹ́ àwọn ọmọlẹ́yìn Jésù tí a ti mọ̀ ni àpilẹ̀kọ Gíríìkì náà ń tọ́ka sí; kò pọn dandan láti fi ‘rẹ̀’ kún un.
- source_word: περὶ τούτου
  choice: nípa ọ̀rọ̀ yìí
  rationale: Ó tọ́ka sí kókó ìkọ̀sílẹ̀ tí wọ́n ṣẹ̀ṣẹ̀ jíròrò; fífi ‘ọ̀rọ̀’ kún un mú un ṣe kedere ní Yorùbá láìtúmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: ἐπηρώτων
  choice: ń bi í léèrè
  rationale: Àkókò imperfect ń fi ìṣe tí ó ń lọ tàbí tí a ń ṣe léraléra hàn; ‘ń bi í léèrè’ pa ìrísí ìṣe náà mọ́ láìfi ìbẹ̀rẹ̀ tí kò ṣe pàtó sínú rẹ̀.
- source_word: αὐτόν
  choice: í
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà tí ó tọ́ka sí Jésù; a so ó mọ́ ‘bi’ gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
