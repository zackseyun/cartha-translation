  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì àwọn ọ̀rọ̀ Gíríìkì náà dáadáa: “Ọmọ Ènìyàn,” ìyàtọ̀ láàárín sísìn ẹni àti sísìn, fífi ìyè/ẹ̀mí ẹni lélẹ̀, owó ìràpadà, àti agbára ìrọ́pò ti ἀντί. Síbẹ̀, “kí a lè máa sìn ín” fi àmì ète/agbara (“lè”) àti ìṣe àṣà-tẹ̀síwájú (“máa”) kún infinitive passive διακονηθῆναι. A yọ àwọn àfikún wọ̀nyí kúrò.'
