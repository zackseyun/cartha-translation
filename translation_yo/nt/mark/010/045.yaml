  to: Nítorí Ọmọ Ènìyàn pàápàá kò wá kí a sìn ín, ṣùgbọ́n láti sìn, àti láti fi ẹ̀mí rẹ̀ lélẹ̀ gẹ́gẹ́ bí owó ìràpadà dípò ọ̀pọ̀ ènìyàn[a].
