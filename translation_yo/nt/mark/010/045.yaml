source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn pàápàá kò wá kí a sìn ín, ṣùgbọ́n láti sìn, àti láti fi ẹ̀mí rẹ̀ lélẹ̀ gẹ́gẹ́ bí owó ìràpadà dípò ọ̀pọ̀ ènìyàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí owó ìràpadà fún ọ̀pọ̀ ènìyàn.” Ọ̀rọ̀ Gíríìkì tí a tú sí “dípò” lè ní ìtumọ̀ ìrọ́pò tàbí pàṣípààrọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ... pàápàá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ṣàlàyé, ó sì tẹ ohun tí a sọ ṣáájú mọ́lẹ̀; “Nítorí ... pàápàá” mú ipa γάρ àti καί jáde ní Yorùbá àdánidá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù sábà máa ń fi pe ara rẹ̀, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì mọ́.
- source_word: οὐκ ἦλθεν
  choice: kò wá
  rationale: Ó túmọ̀ ìṣe wíwá ní tààrà, àwọn gbólóhùn ète tó tẹ̀ lé e sì fi ohun tó wá ṣe hàn.
- source_word: διακονηθῆναι
  choice: kí a lè máa sìn ín
  rationale: Ìtumọ̀ yìí ṣe kedere ní Yorùbá òde òní, ó sì jẹ́ kí ìyàtọ̀ rẹ̀ sí διακονῆσαι hàn nípa lílo gbòǹgbò ọ̀rọ̀ kan náà.
- source_word: ἀλλὰ διακονῆσαι
  choice: bí kò ṣe láti máa sìn
  rationale: Ó pa ìyípadà pàtàkì láàárín jíjẹ́ ẹni tí a ń sìn àti jíjẹ́ ẹni tó ń sìn mọ́.
- source_word: δοῦναι
  choice: láti fi ... lélẹ̀
  rationale: Nínú gbólóhùn yìí, “fi ẹ̀mí rẹ̀ lélẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ìgbésí ayé rẹ̀ fún ikú, láìfi ìtumọ̀ tó dín kù kún ọ̀rọ̀ náà.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ẹ̀mí rẹ̀
  rationale: Ní Yorùbá, “fi ẹ̀mí rẹ̀ lélẹ̀” túmọ̀ sí fífi ìgbésí ayé ẹni rúbọ; níbí ψυχή ń tọ́ka sí ìyè rẹ̀ tí ó fi fún ikú, kì í ṣe apá àìrí ènìyàn nìkan.
- source_word: λύτρον
  choice: owó ìràpadà
  rationale: Ọ̀rọ̀ yìí sọ iye tí a san láti dá ẹni sílẹ̀, ó sì jẹ́ ìtumọ̀ kúkúrú, tí ó ṣe kedere fún λύτρον.
- source_word: ἀντὶ πολλῶν
  choice: dípò ọ̀pọ̀ ènìyàn
  rationale: ἀντί níbí ní agbára pàṣípààrọ̀ tàbí ìrọ́pò; “dípò” mú agbára yẹn jáde ní Yorùbá láìsọ ọ́ di ẹ̀kọ́ ìsìn kan pàtó.
theological_decisions:
- issue: Agbára ἀντί nínú ọ̀rọ̀ nípa owó ìràpadà
  choice: dípò ọ̀pọ̀ ènìyàn
  alternative: fún ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ ἀντί sábà ń tọ́ka sí ìrọ́pò tàbí pàṣípààrọ̀. Yorùbá “dípò” lè sọ ìtumọ̀ yẹn ní tààrà, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà míì tó rọrùn sílẹ̀, láìyanju gbogbo ìnira ẹ̀kọ́ ìsìn inú gbólóhùn náà.
translation_notes:
  register: Yorùbá tó bófin mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A pa àtúnṣe ọ̀rọ̀ “sìn” mọ́ ní ẹ̀ẹ̀mejì láti jẹ́ kí ìyípadà inú gbólóhùn náà lágbára; a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
