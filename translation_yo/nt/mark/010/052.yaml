source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: yo
  text: Jésù sì sọ fún un pé, “Lọ; ìgbàgbọ́[c] rẹ ti gbà ọ́ là.[a]” Lẹ́sẹ̀kẹsẹ̀, ojú rẹ̀ là, ó sì ń tọ̀ ọ́ lẹ́yìn lójú ọ̀nà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ti mú ọ láradá” tàbí “ti wo ọ sàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwòsàn àti sí ìgbàlà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní ọ̀nà.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ “ìgbẹ́kẹ̀lé” dípò “ìgbàgbọ́” níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὕπαγε
  choice: Máa lọ
  rationale: Ó jẹ́ àṣẹ láti lọ. ‘Máa lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ ẹnu mu láì fi ìtumọ̀ ohun-ìní kún ọ̀rọ̀ Gíríìkì.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí bí ọkùnrin náà ṣe gbẹ́kẹ̀ lé Jésù. ‘Ìgbàgbọ́’ pa ọ̀rọ̀ pàtàkì náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ‘ìgbẹ́kẹ̀lé’ hàn gẹ́gẹ́ bí ọ̀nà míì.
- source_word: σέσωκέν
  choice: ti gbà ọ́ là
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìgbàlà, ìmúláradá, tàbí ìwòsàn. ‘Ti gbà ọ́ là’ pa ìtumọ̀ rẹ̀ tó gbòòrò àti ìfọ̀rọ̀wérọ̀ láàárín ìwòsàn ara àti ìgbàlà mọ́.
- source_word: εὐθύς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ hàn ní èdè Yorùbá àdánidá, ó sì pa ìrìn kíákíá ìtàn Máàkù mọ́.
- source_word: ἀνέβλεψεν
  choice: ó ríran padà
  rationale: Nítorí ọkùnrin náà fọ́jú tẹ́lẹ̀, ọ̀rọ̀ yìí túmọ̀ sí pé ojú rẹ̀ tún là; yíyí i sí ‘ríran padà’ ṣe ìtumọ̀ náà kedere.
- source_word: ἠκολούθει
  choice: ó sì ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò ọ̀rọ̀-ìṣe Gíríìkì fi ìṣe tó ń bá a lọ hàn. Àmì ‘ń’ pa ìtumọ̀ ìtẹ̀síwájú náà mọ́ ní Yorùbá.
- source_word: ἐν τῇ ὁδῷ
  choice: lójú ọ̀nà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi ìrìn náà, ó sì tún lè jẹ́ kí ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn tó wà nínú àwòrán ‘ọ̀nà’ dúró.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Jésù sì
  rationale: ‘Sì’ so ọ̀rọ̀ Jésù mọ́ ìtàn tó ṣáájú lọ́nà Yorùbá tó rọrùn, láì túmọ̀ àsopọ̀ náà ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Ìtumọ̀ σῴζω nínú ọ̀rọ̀ Jésù
  choice: ti gbà ọ́ là
  alternative: ti mú ọ láradá; ti wo ọ sàn
  rationale: Àyíká náà fi ìmúpadàbọ̀sípò ojú hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbòòrò ju ìwòsàn ara nìkan lọ. Yíyan ‘gbà là’ kò dí ìtumọ̀ rẹ̀ mọ́ ìwòsàn nìkan, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ πίστις nínú ìṣẹ̀lẹ̀ ìwòsàn yìí
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ jẹ́ ọ̀rọ̀ pàtàkì tó yẹ, ṣùgbọ́n nínú àyíká yìí ó ní ìtumọ̀ ìgbẹ́kẹ̀lé tí ọkùnrin náà ní nínú Jésù; àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn yẹn hàn láì sọ pé ìtumọ̀ kan ṣoṣo ló ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo ‘sì’ fún ìṣàn ìtàn, ‘ń tọ̀ ọ́ lẹ́yìn’ láti fi ìṣe tó ń bá a lọ hàn, a sì fi gbogbo àmì ohùn sí ibi tí ó yẹ.
