  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: yo
  text: 'O mọ àwọn àṣẹ náà: ‘Má ṣe pànìyàn,[a] má ṣe ṣe panṣágà, má ṣe jalè, má ṣe jẹ́rìí èké, má ṣe fi ẹ̀tàn gba ohun tí ó tọ́ sí ẹlòmíràn,[b] bọ̀wọ̀ fún baba rẹ àti ìyá rẹ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “Má ṣe pa ènìyàn.” Ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà níbí ń tọ́ka ní pàtó sí pípànìyàn tàbí pípa ènìyàn lọ́nà tí kò bófin mu; nítorí náà, “pànìyàn” ló péye jù.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “má ṣe dù ẹni nínú ohun tí ó tọ́ sí i” tàbí “má ṣe gba ohun tí ó tọ́ sí ẹlòmíràn.” Ọ̀rọ̀ náà ń tọ́ka sí dídá ohun tí ó tọ́ sí ẹnì kan dúró tàbí gbígba a kúrò lọ́wọ́ rẹ̀, ní ọ̀pọ̀ ìgbà nípasẹ̀ ẹ̀tàn tàbí ìnilára.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: àwọn òfin
  rationale: ‘Àwọn òfin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn àṣẹ Ọlọ́run, ó sì bá àtòjọ Òfin Mẹ́wàá mu.
- source_word: οἶδας
  choice: O mọ
  rationale: 'Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, ìtumọ̀ rẹ̀ ní Koiné jẹ́ ti àkókò ìsinsìnyí: ‘o mọ.’'
- source_word: Μὴ φονεύσῃς
  choice: Má ṣe pànìyàn
  rationale: φονεύω túmọ̀ sí pípa ènìyàn lọ́nà tí kò bófin mu, kì í ṣe gbogbo irú pípa; ‘pànìyàn’ mú ìyàtọ̀ náà hàn.
- source_word: Μὴ μοιχεύσῃς
  choice: má ṣe ṣe àgbèrè
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì yẹ fún àṣẹ nípa ìbálòpọ̀ pẹ̀lú ẹni tí kì í ṣe ọkọ tàbí aya ẹni.
- source_word: Μὴ κλέψῃς
  choice: má ṣe jalè
  rationale: ‘Jalè’ jẹ́ ìtumọ̀ Yorùbá tó ṣe tààrà fún κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: má ṣe jẹ́rìí èké
  rationale: Ó pa ìtumọ̀ ẹ̀rí ní ọ̀rọ̀ ẹjọ́ mọ́, dípò kí a sọ ọ́ di àṣẹ gbogbogbò pé kí ènìyàn má ṣe purọ́.
- source_word: Μὴ ἀποστερήσῃς
  choice: má ṣe fi èrú gba ohun tí ó tọ́ sí ẹlòmíràn
  rationale: ἀποστερέω ń tọ́ka sí dídi ohun tí ó tọ́ sí ẹlòmíràn mú kúrò lọ́wọ́ rẹ̀, ní ọ̀pọ̀ ìgbà nípasẹ̀ èrú tàbí ìnilára; gbólóhùn yìí mú ìtumọ̀ náà ṣe kedere.
- source_word: Τίμα
  choice: bọ̀wọ̀ fún
  rationale: ‘Bọ̀wọ̀ fún’ ní agbára ìtumọ̀ ọlá àti ìyì tí τιμάω ní nínú àṣẹ yìí, kì í ṣe ìwà ọmọlúwàbí lásán.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: baba àti ìyá rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtọ́ka sí àwọn òbí méjèèjì mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn àṣẹ inú Òfin Mẹ́wàá
  choice: Lo èdè àṣẹ Yorùbá tó mọ́, kí a sì pa ìtumọ̀ pàtó ti Gíríìkì mọ́
  alternative: Lo gbólóhùn àṣà tí ó lè mú φονεύω túmọ̀ sí gbogbo irú pípa, tàbí tú àtòjọ náà ní òmìnira púpọ̀
  rationale: Ẹsẹ náà ń tọ́ka sí Òfin Mẹ́wàá, nítorí náà ó yẹ kí ìró àṣẹ rẹ̀ hàn. Síbẹ̀, ‘pànìyàn’ pa ìtumọ̀ pàtó ti φονεύω mọ́, ‘fi èrú gba ohun tí ó tọ́ sí ẹlòmíràn’ sì fi agbára ìwà-òdodo ti ἀποστερέω hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àtòjọ àṣẹ pẹ̀lú ‘má ṣe’ láti mú ìró Òfin Mẹ́wàá jáde, a sì fi àmì ohùn sí ibi tí ó yẹ.
