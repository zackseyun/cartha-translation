  - severity: low
    issue: Fífi “Jesu” sí ipò αὐτοῦ
    rationale: Bí ó tilẹ̀ jẹ́ pé ìtọ́kasí rẹ̀ ṣe kedere nínú àyíká ìtàn, orísun lo arọ́pò-orúkọ. Lílo “ó” ń pa ìpele ìṣàlàyé orísun mọ́.
  - severity: low
    issue: Àlàyé ẹsẹ̀ ìsàlẹ̀ a sọ pé Yorùbá lo “àkókò àtijọ́”
    rationale: Yorùbá kì í ṣètò àkókò-ìṣe bí Gíríìkì/ẹ̀dè Gẹ̀ẹ́sì; “wọ́n sì dé” jẹ́ ìfihàn ìṣe tí ó ti ṣẹlẹ̀. Àlàyé tí a tún ṣe jẹ́ pípéye síi.
