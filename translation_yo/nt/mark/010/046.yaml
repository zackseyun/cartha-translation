  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: yo
  text: Wọ́n sì dé Jẹ́ríkò.[a] Bí ó ti ń jáde kúrò ní Jẹ́ríkò pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀ àti ọ̀pọ̀ ènìyàn,[b] Bátíméù ọmọ Tíméù, afọ́jú alágbe kan, jókòó lẹ́gbẹ̀ẹ́ ọ̀nà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní ìsinsìnyí ìtàn; ìtumọ̀ Yorùbá yìí fi í hàn gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ nínú ìtàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ogunlọ́gọ̀ ènìyàn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ẹ̀gbẹ́ ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: wọ́n dé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí ìtàn, lílo àkókò àtijọ́ yìí jẹ́ èdè Yorùbá àdánidá fún bí ìṣẹ̀lẹ̀ ṣe ń tẹ̀ lé ara wọn.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: bí Jesu ti ń jáde kúrò
  rationale: Ó fi hàn pé ìjáde rẹ̀ àti ohun tó ṣẹlẹ̀ lẹ́gbẹ̀ẹ́ ọ̀nà ń lọ ní àkókò kan náà. A fi orúkọ Jesu síbi arọ́pò-orúkọ náà kí ìtumọ̀ má bàa rú ní Yorùbá.
- source_word: ὄχλου ἱκανοῦ
  choice: ogunlọ́gọ̀ ènìyàn púpọ̀
  rationale: Ọ̀rọ̀ yìí sọ pé iye àwọn ènìyàn náà pọ̀ gan-an; gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá èdè ìtàn mu.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bátíméù ọmọ Tíméù
  rationale: A pa orúkọ ẹni náà àti àlàyé Márkù pé ọmọ Tíméù ni mọ́, ní ìtòlẹ́sẹẹsẹ tí ó bá èdè Yorùbá mu.
- source_word: τυφλὸς προσαίτης
  choice: afọ́jú alágbe kan
  rationale: Àwọn ọ̀rọ̀ Yorùbá wọ̀nyí rọrùn, wọ́n sì túmọ̀ ipò rẹ̀ gẹ́gẹ́ bí ẹni tí kò ríran tí ó ń ṣagbe.
- source_word: παρὰ τὴν ὁδόν
  choice: lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: Ó fi ipò rẹ̀ hàn ní ẹ̀gbẹ́ ọ̀nà láìsọ pé ó jókòó sínú ọ̀nà náà.
- source_word: Ἰεριχώ
  choice: Jẹ́ríkò
  rationale: Èyí ni àkọsílẹ̀ orúkọ ìlú náà ní ọ̀nà tí ó bá ìpè Yorùbá àti ìlò Bíbélì Yorùbá mu.
theological_decisions:
- issue: Ìdánimọ̀ Bátíméù nínú ìtàn
  choice: Pa ‘Bátíméù’ àti ‘ọmọ Tíméù’ méjèèjì mọ́ nínú ẹsẹ̀ náà.
  alternative: Kí a lo ‘Bátíméù’ nìkan tàbí ‘ọmọ Tíméù’ nìkan.
  rationale: Orísun Gíríìkì fúnra rẹ̀ ní orúkọ náà àti àlàyé rẹ̀; pípa méjèèjì mọ́ ń jẹ́ kí gbogbo ẹ̀kúnrẹ́rẹ́ ìtàn dúró láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó ní àmì ohùn ní kíkún, ó ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀ àti fún àlàyé ẹ̀kọ́ ìjọ tí kò sí nínú orísun.
