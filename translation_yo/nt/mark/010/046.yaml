revisions:
- from: Wọ́n sì dé Jẹ́ríkò.[a] Bí Jesu ti ń jáde kúrò ní Jẹ́ríkò pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀ àti ogunlọ́gọ̀ ènìyàn púpọ̀,[b] Bátíméù ọmọ Tíméù, afọ́jú alágbe kan, jókòó lẹ́gbẹ̀ẹ́ ọ̀nà.[c]
  to: Wọ́n sì dé Jẹ́ríkò.[a] Bí ó ti ń jáde kúrò ní Jẹ́ríkò pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀ àti ọ̀pọ̀ ènìyàn,[b] Bátíméù ọmọ Tíméù, afọ́jú alágbe kan, jókòó lẹ́gbẹ̀ẹ́ ọ̀nà.[c]
  rationale: A rọ́pò gbólóhùn ogunlọ́gọ̀ tí ó tún ara rẹ̀ ṣe pẹ̀lú “ọ̀pọ̀ ènìyàn,” láti ba ὄχλου ἱκανοῦ mu láìfi ìtẹnumọ́ kún un. A tún da αὐτοῦ padà sí “ó” kí ìtumọ̀ má ṣe ṣàlàyé ju orísun lọ. A ṣàtúnṣe akọsilẹ a fún ìpéye nípa historical present àti ìṣètò ìṣe Yorùbá. Àwọn àmì ẹsẹ̀ ìsàlẹ̀ àti gbogbo ìtumọ̀ míì wà ní ipò tí ó tọ́.
