  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú ìṣọ̀kan gbolohun Gíríìkì náà dáadáa: dídé sí Jẹ́ríkò, ìjáde rẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn àti ogunlọ́gọ̀, ìdánimọ̀ Bátíméù gẹ́gẹ́ bí ọmọ Tíméù, afọ́jú alágbe, àti ipò rẹ̀ lẹ́gbẹ̀ẹ́ ọ̀nà. Ṣùgbọ́n “ogunlọ́gọ̀ ènìyàn púpọ̀” jẹ́ àfikún ìtẹnumọ́ tí ó pọ̀ ju ὄχλου ἱκανοῦ lọ, ó sì tún ọrọ̀ náà ṣe. “Jesu” náà jẹ́ ìṣàlàyé tí kò hàn nínú ẹsẹ̀ Gíríìkì, níbi tí arọ́pò-orúkọ “ó” ti lè pa ìtọ́kasí orísun mọ́.'
  naturalness: Yorùbá náà ní ìṣàn rere ní gbogbogbòò, àwọn àmì ohùn sì yẹ. “Ọ̀pọ̀ ènìyàn” jẹ́ ọ̀nà àdánidá, kedere, tí kò tún ara rẹ̀ ṣe láti túmọ̀ “a considerable crowd.” Àlàyé ẹsẹ̀ ìsàlẹ̀ nípa historical present yẹ kí ó sọ ìyàtọ̀ ètò-aspect Yorùbá ní òtítọ́ ju kí ó pè é ní “àkókò àtijọ́.”
  terminology: “Jẹ́ríkò,” “Bátíméù,” “Tíméù,” “àwọn ọmọ-ẹ̀yìn,” “afọ́jú,” “alágbe,” àti “lẹ́gbẹ̀ẹ́ ọ̀nà” jẹ́ àwọn yíyan tí ó bójú mu, tí ó sì bá ìlò Yorùbá Bíbélì àti ìforúkọsílẹ̀ orúkọ mu.
