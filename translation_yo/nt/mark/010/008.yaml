id: MRK.10.8
reference: Mark 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: yo
  text: àwọn méjèèjì yóò sì di ara kan. Nítorí náà, wọn kì í ṣe méjì mọ́, bí kò ṣe ara kan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: yóò di
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ni ‘yóò jẹ́,’ pẹ̀lú εἰς ó ń tọ́ka sí àbájáde ìṣọ̀kan; ‘yóò di’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ yẹn mọ́.
- source_word: οἱ δύο
  choice: àwọn méjèèjì
  rationale: Ó pa ìtẹnumọ́ orísun náà mọ́ pé ẹni méjì ni, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: εἰς σάρκα μίαν
  choice: ara kan
  rationale: ‘Ara kan’ jẹ́ ọ̀rọ̀ Bíbélì tó mọ́ nípa ìṣọ̀kan ìgbéyàwó; ọ̀rọ̀-ìṣe ‘di’ ti mú èrò lílọ sínú ipò ìṣọ̀kan náà hàn.
- source_word: σάρκα / σάρξ
  choice: ara
  rationale: Nínú àyíká yìí, ‘ara’ túmọ̀ sí flesh, kì í ṣe ‘ìwà ẹlẹ́ṣẹ̀’; ó sì pa ìsopọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú Gẹ́nẹ́sísì.
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìpinnu tó jáde láti inú gbólóhùn tó ṣáájú hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: οὐκέτι
  choice: kì í ṣe ... mọ́
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ‘kì í ṣe bẹ́ẹ̀ mọ́’ tàbí ‘no longer.’
- source_word: ἀλλὰ μία σάρξ
  choice: bí kò ṣe ara kan
  rationale: Ó pa ìyàtọ̀ tó lágbára láàárín ‘méjì’ àti ‘ara kan’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ara kan’ nínú àyọlò Jésù láti inú Gẹ́nẹ́sísì
  choice: Pa gbólóhùn ìgbéyàwó náà mọ́ gẹ́gẹ́ bí ‘ara kan,’ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: ẹni kan; ara kan ṣoṣo; ìṣọ̀kan nípa ìbálòpọ̀
  rationale: Ọ̀rọ̀ orísun náà ní ìtumọ̀ tó gbòòrò nípa ìṣọ̀kan ìgbéyàwó, kò sì fi í mọ́ ìtumọ̀ kan ṣoṣo; títúmọ̀ rẹ̀ sí ‘ara kan’ pa àìṣe pàtó yẹn àti ìsopọ̀ rẹ̀ mọ́ Gẹ́nẹ́sísì.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó bójú mu, tó ní àmì ohùn ní kíkún, tó sì yẹ fún kíkà ní gbangba. ‘Àwọn méjèèjì’ àti ‘bí kò ṣe’ mú ìtẹnumọ́ àti ìyàtọ̀ inú Gíríìkì hàn láì mú kí èdè le.
