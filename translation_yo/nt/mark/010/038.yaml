  to: Ṣùgbọ́n Jésù sọ fún wọn pé, “Ẹ kò mọ ohun tí ẹ ń béèrè. Ṣé ẹ lè mu ago tí èmi ń mu,[a] tàbí kí a ṣe ìrìbọmi fún yín pẹ̀lú ìrìbọmi tí a ń ṣe fún mi?”[b]
