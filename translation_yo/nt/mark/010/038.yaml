  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Ẹ kò mọ ohun tí ẹ ń béèrè. Ṣé ẹ lè mu ago tí èmi ń mu,[a] tàbí kí a ṣe ìrìbọmi fún yín pẹ̀lú ìrìbọmi tí a ń ṣe fún mi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Bíbélì, “ago” lè dúró fún ìpín tí a yàn fún ẹnì kan; níbí, ó ń tọ́ka ní pàtàkì sí ìjìyà Jésù tó ń bọ̀.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ ọ́ lọ́nà ìtumọ̀ síi pé, “kí ẹ gba ìrìbọmi tí èmi ń gba.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀-ìdílé “ìrìbọmi” lẹ́ẹ̀kan sí i láti tẹnumọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n Jésù sọ fún wọn pé
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà sí ìbáwí Jésù hàn, bí δέ ṣe ń ṣe ní àyíká ọ̀rọ̀ yìí.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Ẹ kò mọ ohun tí ẹ ń béèrè
  rationale: Ó pa ìtumọ̀ ‘mọ̀’ ti οἶδα àti ìbéèrè ti αἰτέω mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: δύνασθε
  choice: Ṣé ẹ lè
  rationale: ‘Lè’ ń sọ agbára tàbí àǹfààní láti ṣe ohun kan, ó sì bá ìbéèrè Gíríìkì mu ní Yorùbá òde òní.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: mu ago tí èmi ń mu
  rationale: A pa àwòrán ‘ago’ mọ́ láì túmọ̀ rẹ̀ sí ìjìyà nínú ara ẹsẹ̀ náà.
- source_word: ἢ
  choice: tàbí
  rationale: Ó pa ìyàtọ̀ disjunctive tí ẹ̀dà SBLGNT ní mọ́, láì mú un bá ẹsẹ̀ tó jọ ọ́ mu.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: kí a fi ìrìbọmi tí a fi ń rì mí bọ̀ rì yín bọ̀
  rationale: Ó pa orúkọ ‘ìrìbọmi’ àti ọ̀rọ̀-ìṣe alábátan ‘rì ... bọ̀’ mọ́, ó sì ṣètọ́jú àtúnsọ tẹnumọ́ tí Gíríìkì ní àti ìrísí àìṣe fúnra ẹni.
theological_decisions:
- issue: Àkàwé ‘ago’ àti ‘ìrìbọmi’
  choice: Pa àkàwé méjèèjì mọ́ nínú ara ẹsẹ̀ náà.
  alternative: Túmọ̀ wọn ní tààrà sí ‘ìjìyà’ tàbí ‘ikú’.
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìjìyà Jésù tó ń bọ̀, ṣùgbọ́n kò ṣàlàyé àkàwé náà ní ẹsẹ̀ yìí; pípa wọn mọ́ kò fi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì pa àwòrán àti àtúnsọ Gíríìkì mọ́ níbi tí Yorùbá ti lè gbà á.
