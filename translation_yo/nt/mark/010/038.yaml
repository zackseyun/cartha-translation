  source_fidelity: Ìdá akọkọ tọ́ fún οὐκ οἴδατε, αἰτεῖσθε, δύνασθε, ‘ago,’ àti ἢ (‘tàbí’). Ṣùgbọ́n gbolóhùn ìrìbọmi náà—“kí a fi ìrìbọmi tí a fi ń rì mí bọ̀ rì yín bọ̀”—kò jẹ́ Yorùbá tó hàn gbangba, ó sì mú ìtumọ̀ gbòǹgbò βαπτίζω hàn ní ọ̀nà tí ó lè dà bí ìrì omi gidi dípò kí ó pa àkàwé ìrìbọmi mọ́. Àtúnṣe náà pa ìtẹnumọ́ orúkọ ìrìbọmi àti ọ̀rọ̀-ìṣe ìrìbọmi mọ́, pẹ̀lú ìrísí passive.
  naturalness: “Kí a ṣe ìrìbọmi fún yín pẹ̀lú ìrìbọmi tí a ń ṣe fún mi” jẹ́ Yorùbá boṣewa, ó sì ṣe kedere ju ìlò “rì ... bọ̀” tí ó tún wáyé lọ. A tún ti mú ọ̀rọ̀ àlàyé ẹsẹ̀-ìsàlẹ̀ kejì di Yorùbá àdánidá.
  terminology: ‘Ago’ àti ‘ìrìbọmi’ yẹ, wọ́n sì pa àwọn àkàwé bíbélì mọ́. ‘Ṣe ìrìbọmi fún’ jẹ́ ọ̀nà tí ó wúlò láti pa ìbáṣepọ̀ ìrìbọmi/batisí mọ́ láì fi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
