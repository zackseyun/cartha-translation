  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa: ó pa ìlọ-sókè sí Jerúsálẹ́mù, akọ́lé “Ọmọ Ènìyàn,” ìdájọ́ ikú, àti àtúnlò παραδίδωμι mọ́. Síbẹ̀, “Kèfèrí” lè túmọ̀ sí àwọn abọ̀rìṣà tàbí àwọn aláìgbàgbọ́ ní Yorùbá òde òní, níbi tí τοῖς ἔθνεσιν ti ń tọ́ka sí àwọn tí kì í ṣe Júù; nítorí náà ó lè fi ìtumọ̀ àfikún tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.'
  naturalness: “Ẹ wò ó” bá àdírẹ́sì Jésù sí àwọn ọmọ-ẹ̀yìn rẹ̀ mu dáadáa ju “Wò ó” lọ. “Àwọn tí kì í ṣe Júù” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣàlàyé ìtọ́kasí ìtàn náà láìlo ọ̀rọ̀ tí ó lè ní ìdálẹ́bi ẹ̀sìn.
  terminology: “Ọmọ Ènìyàn,” “àwọn olórí àlùfáà,” “àwọn akọ̀wé,” àti “dá a lẹ́bi ikú” yẹ, wọ́n sì bá ìforúkọsílẹ̀ ìjọba/ìdájọ́ inú ẹsẹ náà mu. A yẹ kí a fi àkọsílẹ̀ sí ibi ìfarahàn παραδίδωμι àkọ́kọ́ láti pa àṣàyàn “fà lé ọwọ́” mọ́, gẹ́gẹ́ bí ìtẹ̀lé àkọsílẹ̀ Gẹ̀ẹ́sì.
