id: MRK.10.33
reference: Mark 10:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: yo
  text: pé, “Ẹ wò ó, àwa ń gòkè lọ sí Jerúsálẹ́mù, a ó sì fi Ọmọ Ènìyàn lé àwọn olórí àlùfáà àti àwọn akọ̀wé lọ́wọ́[a]; wọn yóò dá a lẹ́bi ikú, wọn yóò sì fi í lé àwọn tí kì í ṣe Júù lọ́wọ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fà Ọmọ Ènìyàn lé ọwọ́ àwọn olórí àlùfáà àti àwọn akọ̀wé”; ọ̀rọ̀ Gíríìkì kan náà ni a tún lò ní ìparí ẹsẹ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàgbékalẹ̀ ohun tí Jésù sọ láti inú ẹsẹ tó ṣáájú, láìfi ìtumọ̀ ìdí tàbí okunfa kún un.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Àmì ọ̀rọ̀ tó ń pe àfiyèsí ni; ‘Wò ó’ jẹ́ Yorùbá àdánidá tó sì pa agbára ìkìlọ̀ náà mọ́.
- source_word: ἀναβαίνομεν
  choice: àwa ń gòkè lọ
  rationale: Ó fi ìrìn tí ó ń lọ lọ́wọ́ hàn, ó sì bá bí a ṣe ń gòkè lọ sí Jerúsálẹ́mù mu nípa ilẹ̀ àti àṣà ọ̀rọ̀.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó jẹ́ ìtumọ̀ tààrà ti orúkọ tí Jésù fi ń pe ara rẹ̀, tó sì pa ìfarahàn rẹ̀ nínú Dáníẹ́lì àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: a ó fi ... lé ... lọ́wọ́ / wọn yóò fi ... lé ... lọ́wọ́
  rationale: Ìsọ̀rọ̀ kan náà ni a lò fún ìṣe méjèèjì láti pa àtúnṣe ọ̀rọ̀ Gíríìkì àti ìtẹ̀sí ìfijọba-lé-ẹlòmíràn mọ́, láìdín un kù sí ‘dà’ nìkan.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn aláṣẹ àlùfáà, kì í ṣe olórí àlùfáà kan ṣoṣo.
- source_word: τοῖς γραμματεῦσιν
  choice: àwọn akọ̀wé
  rationale: Ó jẹ́ ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀, tí ó sì yàgò fún fífi àlàyé ‘olùkọ́ òfin’ sínú ọ̀rọ̀ náà.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: wọn yóò dá a lẹ́bi ikú
  rationale: Ó fi ìdájọ́ òfin tí ó yọrí sí ikú hàn ní Yorùbá àdánidá.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Nínú ọ̀rọ̀ ìjìyà yìí, ó tọ́ka sí àwọn tí kì í ṣe Júù, pàápàá àwọn aláṣẹ Róòmù; ‘Kèfèrí’ pa ìyàtọ̀ ìtàn náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: Ìtumọ̀ àṣà àti tààrà yìí pa ọ̀rọ̀ Gíríìkì, ìfarahàn Dáníẹ́lì, àti orúkọ Kristi tí ó ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ mọ́ láìsọ ọ́ di àlàyé.
- issue: Ìtumọ̀ τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Ọ̀rọ̀ ìjìyà tó yí i ká fi hàn pé àwọn aláṣẹ tí kì í ṣe Júù ni a ń tọ́ka sí, kì í ṣe àwọn orílẹ̀-èdè ní gbogbogbòò.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘a ó’ àti ‘yóò’ láti fi àsọtẹ́lẹ̀ ọjọ́ iwájú hàn; a sì pa àtúnṣe παραδίδωμι mọ́ pẹ̀lú ‘fi ... lé ... lọ́wọ́.’
