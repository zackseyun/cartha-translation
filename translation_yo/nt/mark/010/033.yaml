  to: pé, “Ẹ wò ó, àwa ń gòkè lọ sí Jerúsálẹ́mù, a ó sì fi Ọmọ Ènìyàn lé àwọn olórí àlùfáà àti àwọn akọ̀wé lọ́wọ́[a]; wọn yóò dá a lẹ́bi ikú, wọn yóò sì fi í lé àwọn tí kì í ṣe Júù lọ́wọ́.”[b]
