  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: yo
  text: Jésù tẹjú mọ́ wọn, ó sì wí pé, “Ní ọ̀dọ̀ ènìyàn, kò ṣeé ṣe, ṣùgbọ́n ní ọ̀dọ̀ Ọlọ́run kò rí bẹ́ẹ̀, nítorí ohun gbogbo ni ó ṣeé ṣe ní ọ̀dọ̀ Ọlọ́run.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tẹjú mọ́
  rationale: Ó fi ìwò tí ó dúró ṣinṣin, tí a sì darí sí àwọn ọmọ-ẹ̀yìn hàn ju ọ̀rọ̀ gbogbogbò bí ‘wò’ lọ.
- source_word: Παρὰ ἀνθρώποις
  choice: Ní ọ̀dọ̀ ènìyàn
  rationale: Ó pa àfíwé orísun mọ́ láàárín ohun tí ó ṣeé ṣe níhà ọmọnìyàn àti níhà Ọlọ́run; ‘ènìyàn’ ní ìtumọ̀ àpapọ̀ fún gbogbo ẹ̀dá ènìyàn.
- source_word: ἀδύνατον
  choice: kò ṣeé ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan kò lè ṣẹlẹ̀ tàbí pé agbára ènìyàn kò tó ó.
- source_word: πάντα ... δυνατὰ
  choice: ohun gbogbo ni ó ṣeé ṣe
  rationale: Ó tẹ̀ lé ìtumọ̀ gbooro πάνтα, láì dín un kù sí ọ̀ràn ìgbàlà nìkan tàbí ṣàfikún àlàyé ẹ̀kọ́ ìsìn.
- source_word: γὰρ
  choice: nítorí
  rationale: Nínú ọ̀rọ̀ yìí, ó ń fi ìdí gbólóhùn ‘ṣùgbọ́n kì í ṣe ní ọ̀dọ̀ Ọlọ́run’ múlẹ̀, nítorí náà ìtumọ̀ ìdí ni ó bójú mu.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn ‘ohun gbogbo ni ó ṣeé ṣe ní ọ̀dọ̀ Ọlọ́run’
  choice: Pa gbólóhùn gbooro náà mọ́ gẹ́gẹ́ bí orísun ṣe sọ ọ́.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘Ọlọ́run lè gba ẹnikẹ́ni là.’
  rationale: Àyíká ọ̀rọ̀ kan ìgbàlà, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbooro. Ìtumọ̀ kò gbọdọ̀ fi àlàyé ẹ̀kọ́ ìsìn tóóró rọ́pò ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘tẹjú mọ́’ láti pa agbára ἐμβλέψας mọ́, a sì lo ‘ní ọ̀dọ̀’ léraléra láti fi ìfararora ọ̀rọ̀ Gíríìkì hàn.
