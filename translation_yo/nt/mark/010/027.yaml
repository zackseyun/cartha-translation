  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ èrò orísun Gíríìkì mọ́: Jésù wo wọn dáadáa, àìṣeéṣe fún ènìyàn, àti pé ohun gbogbo ṣeé ṣe pẹ̀lú Ọlọ́run. Ṣùgbọ́n gbolóhùn “ṣùgbọ́n kì í ṣe ní ọ̀dọ̀ Ọlọ́run” lè túmọ̀ sí “ṣùgbọ́n kì í ṣe ní ọ̀dọ̀ Ọlọ́run” (ìyẹn, kì í ṣẹlẹ̀ lọ́dọ̀ Ọlọ́run), dípò “ṣùgbọ́n kò ṣeé ṣe bẹ́ẹ̀ ní ọ̀dọ̀ Ọlọ́run.” Àtúnṣe náà mú àtakò ἀδύνατον ... οὐ παρὰ θεῷ hàn gbangba.'
