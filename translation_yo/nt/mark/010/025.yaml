  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: yo
  text: Ó rọrùn kí ràkúnmí gba ojú abẹ́rẹ́ kọjá ju kí ọlọ́rọ̀ wọ inú ìjọba Ọlọ́run lọ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ìṣètò ọ̀rọ̀ náà pẹ́kípẹ́kí, “láti gba inú ojú abẹ́rẹ́ kọjá.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan ti dábàá “okùn” dípò “ràkúnmí,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì inú ẹsẹ̀ yìí túmọ̀ sí “ràkúnmí.”
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì fún “ọlọ́rọ̀” wà ní ìrísí akọ ẹyọ kan, ṣùgbọ́n ọ̀rọ̀ náà ń dúró fún ọlọ́rọ̀ ní gbogbogbòò.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: Ó rọrùn ... ju ... lọ
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìfiwéra hàn, ó sì pa agbára àsọdùn inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κάμηλον
  choice: ràkúnmí
  rationale: Ọ̀rọ̀ Gíríìkì tí ẹsẹ yìí ní túmọ̀ sí ‘ràkúnmí’; kò yẹ kí a rọ́pò rẹ̀ pẹ̀lú ‘okùn’ tàbí àlàyé ẹnu-ọ̀nà kékeré kan.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: gba ojú abẹ́rẹ́ kọjá
  rationale: ‘Ojú abẹ́rẹ́’ ni ọ̀nà Yorùbá tí ó ṣe kedere fún ihò abẹ́rẹ́ ìránṣọ, ‘gba ... kọjá’ sì mú àwòrán líla inú ihò náà hàn.
- source_word: διελθεῖν
  choice: láti ... kọjá
  rationale: Ó túmọ̀ sí láti gba inú ohun kan kọjá, ó sì bá àwòrán gidi inú gbólóhùn náà mu.
- source_word: πλούσιον
  choice: ọlọ́rọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ajẹtífù akọ ẹyọ kan tí a lò gẹ́gẹ́ bí orúkọ. Ní Yorùbá, ‘ọlọ́rọ̀’ kò fi akọ tàbí abo hàn ní gírámà, ṣùgbọ́n ó lè dúró fún ẹnikẹ́ni tó ní ọrọ̀.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: wọ ìjọba Ọlọ́run
  rationale: ‘Ìjọba Ọlọ́run’ jẹ́ ìtumọ̀ kedere àti àdánidá fún gbólóhùn pàtàkì yìí nínú Ìhìn Rere.
- source_word: εἰσελθεῖν
  choice: kí ... wọ
  rationale: ‘Wọ’ jẹ́ ọ̀rọ̀ Yorùbá ṣókí, àdánidá fún lílọ sínú ibi tàbí ipò kan.
theological_decisions:
- issue: Ìtumọ̀ àwòrán ràkúnmí àti ojú abẹ́rẹ́
  choice: A pa àwòrán àsọdùn gidi ti ràkúnmí àti ojú abẹ́rẹ́ mọ́.
  alternative: Kí a ka ‘ojú abẹ́rẹ́’ sí orúkọ ẹnu-ọ̀nà kékeré kan, tàbí kí a fi ‘okùn’ rọ́pò ‘ràkúnmí.’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ fi àwòrán ohun tí kò ṣeé ṣe hàn. Ìtumọ̀ kò gbọ́dọ̀ dín agbára ọ̀rọ̀ Jésù kù tàbí mú àṣà àlàyé tí ọ̀rọ̀ náà kò fìdí mú wọ inú rẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn kíkún, ní ọ̀nà ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìṣètò ‘Ó rọrùn ... ju ... lọ’ jẹ́ àdánidá, ‘ojú abẹ́rẹ́’ sì jẹ́ àwòrán tí Yorùbá lè lóye láìsí àlàyé ẹ̀kọ́ ìsìn àfikún.
