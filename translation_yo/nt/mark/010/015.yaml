id: MRK.10.15
reference: Mark 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: yo
  text: “Lóòótọ́ ni mo wí fún yín, ẹnikẹ́ni tí kò bá gba ìjọba Ọlọ́run bí ọmọ[a], kò ní wọ inú rẹ̀ rárá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ọmọ.” Àfiwé Gíríìkì náà lè tọ́ka sí ìrẹ̀lẹ̀ ọmọ, ìgbẹ́kẹ̀lé rẹ̀, tàbí bí ó ṣe gbára lé ẹlòmíràn, ṣùgbọ́n kò sọ ìwà pàtó èyí tí a ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ ìfìdí-múlẹ̀ tí ó ní ọlá àti àṣẹ jáde ní Yorùbá àdánidá, láì fi ọ̀rọ̀ Hébérù sílẹ̀ láì túmọ̀.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín
  rationale: Ó tẹ̀lé ìtumọ̀ Gíríìkì ní tààrà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó níyì tí ó sì ṣe kedere.
- source_word: ὃς ἂν
  choice: ẹnikẹ́ni tí
  rationale: Ó pa ìtumọ̀ àpapọ̀ tí ó ṣí sí ẹnikẹ́ni mọ́.
- source_word: μὴ δέξηται
  choice: tí kò bá gba
  rationale: “Gba” lè túmọ̀ sí gbígba tàbí fífi tọkàntọkàn tẹ́wọ́ gbà; ó sì pa àwòrán ẹni tí ń gba ẹ̀bùn mọ́ dípò iṣẹ́ tí ẹni náà fi ń jèrè rẹ̀.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni gbólóhùn Yorùbá tí ó wọ́pọ̀, ó sì lè tọ́ka sí ìṣàkóso Ọlọ́run àti ilẹ̀ ìjọba rẹ̀ láì fi ọ̀kan ṣoṣo múlẹ̀.
- source_word: ὡς παιδίον
  choice: bí ọmọ
  rationale: Ó pa àfiwé inú Gíríìkì mọ́ láì sọ pé ìrẹ̀lẹ̀, ìgbẹ́kẹ̀lé, tàbí gbígbára lé ẹlòmíràn ni ìtumọ̀ pàtó.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: dájúdájú, kì yóò wọ
  rationale: Àpapọ̀ “dájúdájú” àti “kì yóò” fi agbára ìkọ̀ Gíríìkì hàn ní Yorùbá òde òní tí ó ṣe kedere.
- source_word: εἰς αὐτήν
  choice: inú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka padà sí ìjọba Ọlọ́run, “wọ inú rẹ̀” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwọlé sí ibì kan.
theological_decisions:
- issue: Ìtumọ̀ gbígba ìjọba Ọlọ́run “bí ọmọ”
  choice: A pa àfiwé náà mọ́ láì sọ irú ìwà ọmọ tí a ń tọ́ka sí.
  alternative: Láti sọ ọ́ ní pàtó gẹ́gẹ́ bí ìrẹ̀lẹ̀ ọmọ, ìgbẹ́kẹ̀lé ọmọ, tàbí bí ọmọ ṣe gbára lé ẹlòmíràn.
  rationale: Gíríìkì kò sọ èwo nínú àwọn ìtumọ̀ wọ̀nyí ni ó wà lọ́kàn; fífi àfiwé náà sílẹ̀ ní ṣíṣí pa àìdánilójú àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tí ó níyì, pẹ̀lú àmì ohùn ní kíkún. “Mo wí fún yín” ní ìdúróṣinṣin díẹ̀ ju “mo sọ fún yín” lọ, ó sì bá ọ̀rọ̀ àṣẹ tí Jésù ń sọ mu. Àfiwé “bí ọmọ” jẹ́ kúkúrú, àdánidá, ó sì pa ìtumọ̀ orísun mọ́ ní ṣíṣí.
