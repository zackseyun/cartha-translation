  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà dáadáa: àwọn ọmọ Sèbédè méjèèjì lọ sí ọ̀dọ̀ Jésù, wọ́n pè é ní Olùkọ́, wọ́n sì ṣe ìbéèrè tí ó ní ìwọ̀n ‘ohunkóhun tí a bá’. Ṣùgbọ́n ìpo ‘fún wa’ ní ìgbẹ̀yìn gbólóhùn àkọ́kọ́ lè mú kó dà bí ẹni pé ó ń ṣe àfikún sí ‘béèrè lọ́wọ́ rẹ,’ dípò sí ohun tí ẹni tí wọ́n ń bá sọ̀rọ̀ gbọdọ̀ ṣe fún wọn. A tún ṣe àtúnṣe ‘tọ̀ ọ́ wá,’ tí kò rọrùn tó nínú ìlò Yorùbá òde òní ní àyíká yìí, sí ọ̀nà tí ó hàn gedegbe.'
