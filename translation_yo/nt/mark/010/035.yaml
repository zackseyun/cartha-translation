source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: yo
  text: Jákọ́bù àti Jòhánù[a], àwọn ọmọ Sèbédè, sì wá sí ọ̀dọ̀ rẹ̀, wọ́n sì wí fún un pé, “Olùkọ́, a fẹ́ kí o ṣe fún wa ohunkóhun tí a bá béèrè lọ́wọ́ rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sún mọ́ ọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka sí ìlọ sí ọ̀dọ̀ Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìlọsíwájú sí ọ̀dọ̀ Jésù hàn ní èdè Yorùbá àdánidá, ó sì mú ìsinsìnyí ìtàn Gíríìkì wá sí ọ̀nà ìtàn Yorùbá.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: àwọn ọmọ Sèbédè
  rationale: Ó pa ìdánimọ̀ àfikún ọ̀rọ̀ Gíríìkì mọ́ ní kíkún àti ní ọ̀nà àdánidá.
- source_word: λέγοντες αὐτῷ
  choice: wọ́n sì wí fún un pé
  rationale: A yí participle Gíríìkì padà sí ọ̀rọ̀-ìṣe pípé gẹ́gẹ́ bí ìtàn Yorùbá ṣe máa ń lọ, láì pàdánù ẹni tí wọ́n bá sọ̀rọ̀.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹni tí ń kọ́ni; kò fi ìtumọ̀ àṣẹ tí ó lè ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: θέλομεν
  choice: a fẹ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá òde òní, tààrà, tí ó bá agbára ìbéèrè náà mu.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: ohunkóhun tí a bá béèrè lọ́wọ́ rẹ
  rationale: “Ohunkóhun” àti “tí a bá” pa àìdánilójú ọ̀rọ̀ ìbátan pẹ̀lú ἐάν mọ́, “béèrè lọ́wọ́ rẹ” sì jẹ́ àdánidá ní Yorùbá.
- source_word: ποιήσῃς ἡμῖν
  choice: kí o ṣe ... fún wa
  rationale: Ó pa ìtumọ̀ gbòòrò ποιέω mọ́, kò sì túmọ̀ rẹ̀ sí “fún wa” tàbí “gbọ́dọ̀ gbà” ní ọ̀nà tí yóò fi túmọ̀ ohun tí a kàn lè lóye nínú àyíká sí inú ọ̀rọ̀ náà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo “wí” fún ìtàn Mímọ́ láì jẹ́ kí gbólóhùn náà di àtijọ́ jù; àmì ohùn ni a fi sí ibi tí ó bá ti yẹ.
