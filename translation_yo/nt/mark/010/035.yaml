    rationale: Nínú ‘ohunkóhun tí a bá béèrè lọ́wọ́ rẹ fún wa,’ ‘fún wa’ lè dà bí ohun tí ó ń ṣàlàyé bí wọ́n ṣe béèrè, nígbà tí ἡμῖν ń tọ́ka sí ohun tí Jésù yóò ṣe fún wọn. Gbigbé e sí lẹ́yìn ‘ṣe’ pa ìṣọ̀kan Gíríìkì mọ́ kedere.
  - severity: low
    issue: ‘tọ̀ ọ́ wá’ kò rọrùn tó ní àyíká yìí
    rationale: Ó lè ní ìtumọ̀ wíwá ẹni tàbí títẹ̀lé ẹni ní àwọn àyíká kan. ‘Wá sí ọ̀dọ̀ rẹ̀’ ń fi προσπορεύονται αὐτῷ hàn ní kedere, ní èdè Yorùbá àdánidá.
  revised_text: Jákọ́bù àti Jòhánù[a], àwọn ọmọ Sèbédè, sì wá sí ọ̀dọ̀ rẹ̀, wọ́n sì wí fún un pé, “Olùkọ́, a fẹ́ kí o ṣe fún wa ohunkóhun tí a bá béèrè lọ́wọ́ rẹ.”
