  to: Jákọ́bù àti Jòhánù[a], àwọn ọmọ Sèbédè, sì wá sí ọ̀dọ̀ rẹ̀, wọ́n sì wí fún un pé, “Olùkọ́, a fẹ́ kí o ṣe fún wa ohunkóhun tí a bá béèrè lọ́wọ́ rẹ.”
