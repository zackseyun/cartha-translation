  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: yo
  text: Pétérù bẹ̀rẹ̀ sí í sọ fún un pé, “Wò ó[a], àwa ti fi ohun gbogbo sílẹ̀, a sì ti tẹ̀ lé ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wò” tàbí “Kíyèsí.”
    reason: Àwọn ọ̀nà ìtumọ̀ mìíràn fún Ἰδοὺ, àmì ọ̀rọ̀ tí ń pe àfiyèsí.
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: bẹ̀rẹ̀ sí í sọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí pé ó bẹ̀rẹ̀ sí í sọ̀rọ̀; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì bá ìtàn mu.
- source_word: ὁ Πέτρος
  choice: Pétérù
  rationale: A lo ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù nínú àyíká ọ̀rọ̀, ṣùgbọ́n a kò fi orúkọ Jésù kún ohun tí Gíríìkì sọ.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ àmì ọ̀rọ̀ tí ń pe àfiyèsí olùgbọ́; “Wò ó” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára rẹ̀ mọ́.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Arọ́pò-orúkọ tí a sọ jáde ní Gíríìkì ní ìtẹnumọ́; “àwa” pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἀφήκαμεν πάντα
  choice: ti fi ohun gbogbo sílẹ̀
  rationale: Ó sọ ìṣe tí wọ́n ti ṣe, tí ipa rẹ̀ sì wà di ìsinsin yìí; “fi … sílẹ̀” kò mú ìtumọ̀ náà le ju bó ṣe yẹ lọ.
- source_word: ἠκολουθήκαμέν σοι
  choice: a sì ti tẹ̀ lé ọ
  rationale: Perfect Gíríìkì tọ́ka sí títẹ̀lé tí wọ́n bẹ̀rẹ̀, tí ó sì ní ìtumọ̀ tó ń bá a lọ; “ti tẹ̀ lé ọ” jẹ́ àdánidá, ó sì pa ìbáṣepọ̀ yẹn mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ Pétérù nípa ohun tí àwọn ọmọ-ẹ̀yìn fi sílẹ̀
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìtẹnumọ́ Pétérù fúnra rẹ̀ láìfọwọ́ sí i tàbí dín in kù.
  alternative: Kí a sọ pé “a ti fi gbogbo ohun tí a ní rúbọ” tàbí kí a ṣàlàyé ọ̀rọ̀ náà ní ìbámu pẹ̀lú ìdáhùn Jésù tó tẹ̀ lé e.
  rationale: Ẹsẹ̀ náà ń ròyìn ohun tí Pétérù sọ, kì í ṣe ìdájọ́ onítàn lórí ọ̀rọ̀ rẹ̀; nítorí náà a pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà nínú àyíká náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé lasán. A lo “Wò ó” gẹ́gẹ́ bí àmì ìpe àfiyèsí, kì í ṣe gẹ́gẹ́ bí àṣẹ láti wo ohun kan ní ojú.
