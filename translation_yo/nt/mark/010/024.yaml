language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: yo
  text: Ó sì yà àwọn ọmọ-ẹ̀yìn lẹ́nu nípa ọ̀rọ̀ rẹ̀. Jésù sì tún dá wọn lóhùn, ó ní[a], “Ẹ̀yin ọmọ, ó ṣòro tó láti wọ ìjọba Ọlọ́run!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Ẹ̀yin ọmọ, ó ṣòro tó fún àwọn tí ó gbẹ́kẹ̀ lé ọrọ̀ wọn láti wọ ìjọba Ọlọ́run.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: ń ṣe kàyéfì
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle hàn, ìṣe àìpé náà sì tọ́ka sí ìhùwàpadà tí ó ń bá a lọ. ‘Ń ṣe kàyéfì’ jẹ́ Yorùbá àdánidá tí kò fi ìtumọ̀ kún un ju ti Gíríìkì lọ.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: sí ọ̀rọ̀ rẹ̀
  rationale: ἐπί pẹ̀lú ọ̀rọ̀ ní ipò dátífù ń fi ohun tí ìyàlẹ́nu wọn dá lé hàn. ‘Sí ọ̀rọ̀ rẹ̀’ ṣe kedere, ó sì sún mọ́ Gíríìkì.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé Jésù bẹ̀rẹ̀ sí í sọ̀rọ̀ lẹ́ẹ̀kan sí i.
- source_word: ἀποκριθεὶς λέγει
  choice: dá wọn lóhùn pé
  rationale: Ìtumọ̀ yìí gbé èrò ìdáhùn àti sísọ jáde ní Yorùbá àdánidá, láìfi àtúnsọ̀rọ̀ tí yóò le etí kun un.
- source_word: Τέκνα
  choice: Ẹ̀yin ọmọ
  rationale: Àpèjúwe onífẹ̀ẹ́ ni τέκνα; ‘Ẹ̀yin ọmọ’ pa ìrọ̀lẹ́ ìbátan náà mọ́ láìfi ‘ọmọ mi’ tí kò sí nínú Gíríìkì kún un.
- source_word: πῶς δύσκολόν ἐστιν
  choice: ó ti ṣòro tó
  rationale: Ìṣètò yìí mú agbára ìyanu tàbí ìtẹnumọ́ πῶς jáde ní Yorùbá àdánidá, kì í ṣe gbólóhùn pẹlẹbẹ pé ohun náà ṣòro nìkan.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: láti wọ ìjọba Ọlọ́run
  rationale: ‘Wọ ìjọba Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa ìṣípò sínú ìjọba náà mọ́.
theological_decisions:
- issue: Bóyá kí a fi gbólóhùn gígùn náà, ‘fún àwọn tí ó gbẹ́kẹ̀ lé ọrọ̀,’ sínú ẹsẹ̀ náà
  choice: 'Tẹ̀lé kíkà kúkúrú SBLGNT: ‘ó ti ṣòro tó láti wọ ìjọba Ọlọ́run’'
  alternative: ‘Ẹ̀yin ọmọ, ó ti ṣòro tó fún àwọn tí ó gbẹ́kẹ̀ lé ọrọ̀ láti wọ ìjọba Ọlọ́run’
  rationale: Orísun Gíríìkì tí a pèsè ní kíkà kúkúrú, èyí sì pa ìfọkànsìn àti ìnira ọ̀rọ̀ Jésù mọ́ láìdín un kù sí àwọn ọlọ́rọ̀ nìkan. Nítorí kíkà gígùn náà jẹ́ mímọ̀ nínú àwọn àṣà ìkọ̀wé kan, a tọ́ka sí i ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá àṣà ìkọ̀wé mu; ‘Ẹ̀yin ọmọ’ ní ìfẹ́ àti ọ̀wọ̀, ‘ó ti ṣòro tó’ sì pa ìtẹnumọ́ Gíríìkì mọ́.
