revisions:
- from: Àwọn ọmọ-ẹ̀yìn sì ń ṣe kàyéfì sí ọ̀rọ̀ rẹ̀. Jésù tún dá wọn lóhùn pé[a], “Ẹ̀yin ọmọ, ó ti ṣòro tó láti wọ ìjọba Ọlọ́run!”
  to: Ó sì yà àwọn ọmọ-ẹ̀yìn lẹ́nu nípa ọ̀rọ̀ rẹ̀. Jésù sì tún dá wọn lóhùn, ó ní[a], “Ẹ̀yin ọmọ, ó ṣòro tó láti wọ ìjọba Ọlọ́run!”
  rationale: The revision removes an unintended temporal implication, improves idiomatic Yoruba expression of astonishment, and preserves both the source text’s shorter reading and the supplied textual-variant note without resolving its interpretive tension.
