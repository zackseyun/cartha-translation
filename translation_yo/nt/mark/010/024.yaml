review_pass:
  verdict: revise
  source_fidelity: The draft follows the SBLGNT shorter reading and correctly retains the longer reading concerning those who trust in riches as a textual-variant footnote. Its rendering of the kingdom-entry clause and the warm address τέκνα is faithful. However, “ó ti ṣòro tó” can imply that entry has become difficult, whereas the Greek makes an emphatic present assertion, not a change of state.
  naturalness: “Ń ṣe kàyéfì sí ọ̀rọ̀ rẹ̀” is understandable, but “Ó yà àwọn ọmọ-ẹ̀yìn lẹ́nu nípa ọ̀rọ̀ rẹ̀” is more natural Standard Yoruba for being astonished at what someone said. “Ó ṣòro tó” retains the exclamatory force without the unwanted perfect/temporal sense of “ti.”
  terminology: “Ìjọba Ọlọ́run,” “ọmọ-ẹ̀yìn,” and “Ẹ̀yin ọmọ” are appropriate and consistent. The footnote's “ọ̀rọ̀” is acceptable in context for riches; adding “wọn” makes the referent and sense more explicit in Yoruba.
  issues:
  - severity: medium
    issue: The phrase “ó ti ṣòro tó” introduces “ti,” a perfective/temporal nuance.
    rationale: πῶς δύσκολόν ἐστιν is an emphatic present statement (“how difficult it is”), not “how difficult it has become.”
  - severity: low
    issue: “Ń ṣe kàyéfì sí ọ̀rọ̀ rẹ̀” is less idiomatic than an expression with “yà ... lẹ́nu.”
    rationale: The revision expresses ἐθαμβοῦντο naturally while retaining astonishment as the disciples’ reaction to Jesus’ words.
  revised_text: Ó sì yà àwọn ọmọ-ẹ̀yìn lẹ́nu nípa ọ̀rọ̀ rẹ̀. Jésù sì tún dá wọn lóhùn, ó ní[a], “Ẹ̀yin ọmọ, ó ṣòro tó láti wọ ìjọba Ọlọ́run!”
  revised_footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Ẹ̀yin ọmọ, ó ṣòro tó fún àwọn tí ó gbẹ́kẹ̀ lé ọrọ̀ wọn láti wọ ìjọba Ọlọ́run.”
    reason: textual_variant
  revision_rationale: The revision removes an unintended temporal implication, improves idiomatic Yoruba expression of astonishment, and preserves both the source text’s shorter reading and the supplied textual-variant note without resolving its interpretive tension.
