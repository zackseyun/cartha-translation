  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì ń bá a wí pé kí ó dákẹ́; ṣùgbọ́n òun túbọ̀ ń kígbe pé, “Ọmọ Dáfídì,[a] ṣàánú mi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Dáfídì” jẹ́ oyè ọba tó ní í ṣe pẹ̀lú Mèsáyà; a lè sọ ìtumọ̀ rẹ̀ ní “Mèsáyà,” ṣùgbọ́n a pa ọ̀nà tí Gíríìkì gbà sọ ọ́ mọ́ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: ń bá a wí
  rationale: Ọ̀rọ̀ yìí fi ìbáwí líle hàn, ìrísí imperfect sì ń fi iṣẹ́ tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ; yíyan ‘ọ̀pọ̀ ènìyàn’ kò fi ‘ogunlọ́gọ̀’ tí kò sí ní pàtó nínú Gíríìkì kún un.
- source_word: ἵνα σιωπήσῃ
  choice: pé kí ó dákẹ́
  rationale: Èyí sọ ète ìbáwí wọn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ purposive mọ́.
- source_word: πολλῷ μᾶλλον
  choice: túbọ̀
  rationale: ‘Túbọ̀’ fi hàn pé ó ń ṣe é sí i ju tẹ́lẹ̀ lọ, láìfi ọ̀rọ̀ bí ‘ní ohùn rara’ tí Gíríìkì kò sọ kún un.
- source_word: ἔκραζεν
  choice: ń kígbe
  rationale: ‘Ń kígbe’ pa agbára àti ìtẹ̀síwájú iṣẹ́ imperfect náà mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: Υἱὲ Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: A túmọ̀ oyè náà ní tààrà, kí ọ̀rọ̀ rẹ̀ àti ìtumọ̀ rẹ̀ nípa ọba Mèsáyà lè wà láìrọ́pò rẹ̀ pẹ̀lú ìtumọ̀ àlàyé.
- source_word: ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí jẹ́ ẹ̀bẹ̀ Yorùbá àdánidá tó pa agbára àṣẹ-ẹ̀bẹ̀ Gíríìkì àti ìtumọ̀ àánú mọ́.
theological_decisions:
- issue: Ìtumọ̀ nípa Mèsáyà nínú oyè ‘Ọmọ Dáfídì’
  choice: A pa oyè náà mọ́ gẹ́gẹ́ bí ‘Ọmọ Dáfídì.’
  alternative: ‘Mèsáyà’
  rationale: Gíríìkì lo Υἱὲ Δαυίδ fúnra rẹ̀. Títúmọ̀ oyè náà dípò fífi ìtumọ̀ rẹ̀ rọ́pò rẹ̀ pa ọ̀rọ̀ orísun àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ìtẹ̀síwájú àwọn ọ̀rọ̀-ìṣe imperfect ni a fi ‘ń’ hàn.
