  text: ὁ δὲ ἀποβαλὼν τὸ ἱμάτιον αὐτοῦ ⸀ἀναπηδήσας ἦλθεν πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: yo
  text: Ó sì ju aṣọ òde rẹ̀[a] sílẹ̀, ó sì fò dìde, ó sì wá sí ọ̀dọ̀ Jesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: ju … sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìgbésẹ̀ kan tí ó yára, tí ó sì mọ̀ọ́mọ̀ ṣe hàn—pé ó ju aṣọ náà kúrò lọ́dọ̀ rẹ̀; ó lágbára ju ‘bọ́’ lọ.
- source_word: ἱμάτιον
  choice: aṣọ àwọ̀lékè
  rationale: Ní àyíká yìí, ἱμάτιον sábà ń tọ́ka sí aṣọ òde tí a wọ lórí aṣọ mìíràn; ‘aṣọ àwọ̀lékè’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìtàn náà mu.
- source_word: ἀναπηδήσας
  choice: fò dìde
  rationale: Ó pa ìṣípòpadà òjijì àti ìtara inú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá àdánidá.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: tọ Jesu wá
  rationale: Àkójọpọ̀ ἔρχομαι àti πρός ń fi ìrìn sí ọ̀dọ̀ Jesu hàn; ‘tọ Jesu wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó lọ dé ọ̀dọ̀ rẹ̀.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ̀síwájú nínú ìtàn, kì í ṣe àmì ìtakora líle; ‘sì’ bá iṣẹ́ yìí mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà pa yíyára àti ìtara ìṣe inú orísun Gíríìkì mọ́.
