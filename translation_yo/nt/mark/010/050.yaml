revisions:
- from: Ó sì ju aṣọ àwọ̀lékè rẹ̀[a] sílẹ̀, ó fò dìde, ó sì tọ Jesu wá.
  to: Ó sì ju aṣọ òde rẹ̀[a] sílẹ̀, ó sì fò dìde, ó sì wá sí ọ̀dọ̀ Jesu.
  rationale: The revision removes ambiguity in the final movement clause and uses more natural Standard Yoruba for the outer garment, while retaining the source text’s vivid sequence and its mild narrative connective.
