  source_fidelity: 'Ìtumọ̀ náà pa ìbáramu pátàkì mọ́: Δυνάμεθα jẹ́ ìdánilójú ‘A lè’; ‘ife’ àti ‘ìrìbọmi’ sì da àwọn àwòrán Gíríìkì dúró. Síbẹ̀, ‘ìrìbọmi tí a fi ń rì mí bọmi’ tún ìtumọ̀ ìrìbọmi ṣe ní ọ̀nà tí kò rọrùn, ó sì lè dà bí ẹni pé omi gidi ni a ń tọ́ka sí. ‘Ìrìbọmi tí mo ń gba’ jẹ́ ìlò Yorùbá tí ó dáa, tí ó ń ṣàfihàn ìrírí tí a ń ṣe sí ẹni náà láì tú àpẹẹrẹ náà sí ìtumọ̀ àlàyé.'
  naturalness: ‘A lè ṣe bẹ́ẹ̀’ lóye nínú àyíká, ṣùgbọ́n ‘A lè’ jẹ́ ìdáhùn kúkúrú, àdánidá, tí ó sún mọ́ Gíríìkì. Ìkọ́lé ‘ìrìbọmi tí mo ń gba ... tí ẹ̀yin náà yóò gba’ rọrùn síi fún Yorùbá òde-òní ju ìsọ̀rọ̀ ‘a fi ń rì ... bọmi’ lọ.
  terminology: A pa ‘ife’ àti ‘ìrìbọmi’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìṣàpẹẹrẹ, láì sọ wọ́n di ‘ìjìyà’ nínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ náà ni a tún ṣe kí ‘àpẹẹrẹ’ má bà a dà bí ohun àpẹẹrẹ kan, kí ó sì sọ ‘ipín tí a yàn’ ní èdè Yorùbá tí ó mọ́gbọ́n dání.
