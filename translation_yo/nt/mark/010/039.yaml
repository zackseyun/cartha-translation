language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: yo
  text: Wọ́n sì wí fún un pé, “A lè.”[a] Ṣùgbọ́n Jésù wí fún wọn pé, “Ife tí èmi ń mu, ẹ̀yin yóò mu; ìrìbọmi tí mo ń gba[b], ẹ̀yin náà yóò gba,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A lè ṣe bẹ́ẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ife” àti “ìrìbọmi” jẹ́ àwọn àwòrán ọ̀rọ̀ fún ìjìyà àti ipín tí a yàn fún Jésù, èyí tí ó fẹ́rẹ̀ẹ́ dojú kọ; àwọn ọmọ-ẹ̀yìn rẹ̀ náà yóò ní ìpín nínú rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: A lè ṣe bẹ́ẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé agbára tàbí àǹfààní wà láti ṣe ohun tí a ṣẹ̀ṣẹ̀ béèrè; ó tún pa kúkúrú àti ìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ποτήριον
  choice: ife
  rationale: A pa àwòrán ‘ife’ mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìjìyà tàbí kádàrá nínú ọ̀rọ̀ pàtàkì.
- source_word: πίνω / πίεσθε
  choice: ń mu / yóò mu
  rationale: Àkókò ìsinsìnyí àti ọjọ́ iwájú ni a fi hàn, a sì pa ìbáramu ọ̀rọ̀-ìṣe Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: βάπτισμα
  choice: ìrìbọmi
  rationale: ‘Ìrìbọmi’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún βάπτισμα; ó pa àwòrán ìrìbọmi mọ́ láì sọ ọ́ di ‘ìjìyà’ ní tààrà.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: a fi ń rì mí bọmi / a ó fi rì yín bọmi
  rationale: Ìtumọ̀ yìí pa ìsopọ̀ mọ́ ‘ìrìbọmi,’ ó sì fi ìṣe àìsọ ẹni tó ń ṣe é hàn bí ó ti rí nínú Gíríìkì.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n Jésù wí fún wọn pé
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ kékeré hàn láàárín ìdáhùn ìgboyà wọn àti ohun tí Jésù sọ lẹ́yìn náà.
theological_decisions:
- issue: Àpẹẹrẹ ‘ife’ àti ‘ìrìbọmi’
  choice: A pa àpẹẹrẹ méjèèjì mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a túmọ̀ wọn ní tààrà sí ìjìyà, ikú, tàbí ikú ajẹ́rìíkú.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwọn àpẹẹrẹ wọ̀nyí. Pípa wọn mọ́ kò jẹ́ kí ìtumọ̀ ṣíṣe àlàyé gba ipò ohun tí ọ̀rọ̀ náà sọ, ó sì pa ìwọ̀n ìtumọ̀ àti ìdààmú ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ ìrìbọmi nínú ẹsẹ yìí pẹ̀lú ìrìbọmi gẹ́gẹ́ bí àṣà ìjọ
  choice: A lo ‘ìrìbọmi,’ ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé àpẹẹrẹ ìjìyà àti ohun tí yóò ṣẹlẹ̀ sí Jésù ni ó jẹ́ ní àyíká ọ̀rọ̀ yìí.
  alternative: Kí a lo ‘ìpọ́njú’ tàbí ‘ìrì sínú ìjìyà’ láti yẹra fún àìlóye.
  rationale: βάπτισμα túmọ̀ sí ìrìbọmi, àyíká ọ̀rọ̀ sì ń darí òǹkàwé sí ìtumọ̀ àpẹẹrẹ rẹ̀; kò yẹ kí a pa ọ̀rọ̀ ìpilẹ̀ rẹ́ nù.
translation_notes:
  register: A lo Yorùbá àkókò-òde tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘A lè ṣe bẹ́ẹ̀’ jẹ́ àdánidá fún ìdáhùn kúkúrú, nígbà tí ‘a fi ń rì mí bọmi’ pa àwòrán àti ìṣe àìsọ ẹni tó ń ṣe é mọ́ bó tilẹ̀ jẹ́ pé ó ní ìwọ̀n ọ̀rọ̀ mímọ́ díẹ̀.
