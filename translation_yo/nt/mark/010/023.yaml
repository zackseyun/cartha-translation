  to: Jésù sì wò yíká, ó wí fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ wo bí yóò ti ṣòro tó fún àwọn tó ní ọrọ̀[a] láti wọ ìjọba Ọlọ́run!”
