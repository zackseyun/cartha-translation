source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: yo
  text: Jésù sì wò yíká, ó wí fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ wo bí yóò ti ṣòro tó fún àwọn tó ní ọrọ̀[a] láti wọ ìjọba Ọlọ́run!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn tó ní owó,” tàbí “àwọn tó ní ọ̀pọ̀ ohun ìní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Nígbà tí ... wo àwọn tó yí i ká
  rationale: Ó fi ìṣe participle aorist hàn gẹ́gẹ́ bí ohun tó ṣáájú ọ̀rọ̀ Jésù, ní èdè Yorùbá tó ṣe déédé, ó sì pa ìtumọ̀ wíwo àwọn tó wà yí ká mọ́.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé present ni Gíríìkì lò gẹ́gẹ́ bí historical present, àkókò àtẹ̀yìnwá ni ó bá ìtàn Yorùbá mu jù láìsọ ìtumọ̀ di ohun mìíràn.
- source_word: Πῶς δυσκόλως
  choice: Ẹ wo bí ó ti ṣòro tó
  rationale: Èyí mú ìtẹnumọ́ àti ìyàlẹ́nu inú gbólóhùn Gíríìkì jáde ní Yorùbá àdánidá, láìsọ ọ́ di àìṣeéṣe pátápátá.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: àwọn tó ní ọrọ̀
  rationale: Ó tẹ̀ lé gbólóhùn participle náà dípò kíkàn fi àmì ẹgbẹ́ kan sí wọn pé ‘àwọn ọlọ́rọ̀,’ ó sì ní í ṣe pẹ̀lú ohun ìní lọ́pọ̀.
- source_word: χρήματα
  choice: ọrọ̀
  rationale: ‘Ọrọ̀’ níbí túmọ̀ sí owó àti ohun ìní lápapọ̀; àlàyé ìsàlẹ̀ fi àwọn àṣàyàn tó dín tàbí tó mú ìtumọ̀ gbòòrò hàn.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì pa àwòrán ìjọba inú Gíríìkì mọ́.
- source_word: εἰσελεύσονται
  choice: láti wọ
  rationale: Infinitive Yorùbá yìí bá ìṣètò ‘ó ṣòro fún ... láti wọ’ mu, ó sì sọ ìwọlé sínú ìjọba Ọlọ́run ní kedere.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jésù sọ pé kò ṣeéṣe fún ẹni tó ní ọrọ̀ láti wọ ìjọba Ọlọ́run, tàbí pé ó ṣòro gidigidi
  choice: 'A túmọ̀ δυσκόλως gẹ́gẹ́ bí ìṣòro líle: ‘bí ó ti ṣòro tó.’'
  alternative: Ìtumọ̀ tó mú un lágbára sí i pé kò fẹ́rẹ̀ẹ́ ṣeéṣe tàbí pé kò ṣeéṣe rárá.
  rationale: Gíríìkì sọ ‘pẹ̀lú ìṣòro,’ kì í ṣe ‘kò ṣeéṣe.’ Ìtumọ̀ náà pa ìnira àti ìfọ̀kànbalẹ̀ ọ̀rọ̀ Jésù mọ́ láìfi ìpinnu ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ; ‘ọrọ̀’ yà sí ‘ọ̀rọ̀’ nípasẹ̀ àmì ohùn.
