  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ àwọn tí ó jẹ́ àkọ́kọ́ yóò jẹ́ ìkẹyìn, àwọn tí ó jẹ́ ìkẹyìn sì yóò jẹ́ àkọ́kọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ àwọn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ fún àwùjọ ènìyàn tí kò ní iye pàtó. ‘Ọ̀pọ̀ àwọn’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ yìí hàn láì sọ pé gbogbo ènìyàn ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí ohun tí ó ṣáájú, ó sì bá àyípadà ipò inú ọ̀rọ̀ yìí mu.
- source_word: ἔσονται
  choice: yóò jẹ́
  rationale: Èyí pa ìṣe ọ̀rọ̀ ọjọ́ iwájú ti εἰμί mọ́, láì fi èrò míì kún un bí ẹni pé ó ń ṣàlàyé ọ̀nà tí ìyípadà náà yóò gbà ṣẹlẹ̀.
- source_word: πρῶτοι
  choice: ẹni àkọ́kọ́
  rationale: Ó ń tọ́ka sí ipò tàbí ọlá, kì í ṣe ìtẹ̀lé àkókò nìkan. Gbólóhùn yìí mú ìtakora pẹ̀lú ‘ẹni ìkẹyìn’ dúró kedere.
- source_word: ἔσχατοι
  choice: ẹni ìkẹyìn
  rationale: Ó pa ìtakora tààrà pẹ̀lú πρῶτοι mọ́, ó sì fi ọ̀rọ̀ náà sílẹ̀ ní ṣókí láì sọ irú ipò tí a ń tọ́ka sí ní pàtó.
- source_word: οἱ ἔσχατοι
  choice: àwọn ẹni ìkẹyìn
  rationale: Àmì orúkọ inú èdè Gíríìkì mú gbólóhùn náà ṣiṣẹ́ gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn; ‘àwọn ẹni ìkẹyìn’ ṣe bẹ́ẹ̀ ní Yorùbá.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so apá kejì mọ́ àkọ́kọ́ ní ọ̀nà àdánidá ní Yorùbá, ó sì pa ìbáradọ́gba ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìrú ìyípadà tí ọ̀rọ̀ náà ń sọ
  choice: Fi ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ìlànà gbogbogbò nípa bí ipò àwọn ẹni àkọ́kọ́ àti àwọn ẹni ìkẹyìn yóò ṣe yí padà, láì sọ ẹgbẹ́ àwùjọ tàbí ipò ìgbàlà kan ní pàtó.
  alternative: Láti túmọ̀ ‘àkọ́kọ́’ àti ‘ìkẹyìn’ sí ọlọ́rọ̀ àti tálákà, sí àwọn ọmọ-ẹ̀yìn àti àwọn tí kò sí nínú wọn, tàbí sí òfin tí kò ní àyọkúrò fún ẹnì kọ̀ọ̀kan.
  rationale: Ẹsẹ náà jẹ́ ọ̀rọ̀ àkàwé tí ó gbòòrò, kò sì fúnra rẹ̀ ṣàlàyé gbogbo àwọn tí ó wà nínú ẹ̀ka méjèèjì. Ìtumọ̀ náà fi àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ sílẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà ní iyì, ó ṣe kedere fún òǹkàwé gbogbogbò, ó sì pa ìṣọ̀kan àti ìtakora ṣókí ti ọ̀rọ̀ Gíríìkì mọ́.
