id: MRK.10.9
reference: Mark 10:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: yo
  text: Nítorí náà, ohun tí Ọlọ́run ti so pọ̀, kí ènìyàn[a] má ṣe yà á sọ́tọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ, ṣùgbọ́n a lò ó fún ènìyàn lápapọ̀; ìtumọ̀ rẹ̀ níbí ni “ẹnikẹ́ni” tàbí “ẹ̀dá ènìyàn kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ohun tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ aláìlẹ́mìí ẹyọ yìí tọ́ka sí ìṣọ̀kan ìgbéyàwó tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀; “ohun tí” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ àpapọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọgbọ́n tí Jésù fà jáde láti inú ètò Ọlọ́run fún ìgbéyàwó hàn.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni olùṣe ìṣe náà, ó sì jẹ́ ìtumọ̀ Yorùbá tààrà fún orúkọ náà ní àyíká yìí.
- source_word: συνέζευξεν
  choice: ti so pọ̀
  rationale: Ó sọ ìṣe Ọlọ́run tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣì dúró, ní èdè Yorùbá àdánidá. Ó tún pa àwòrán sísopọ̀ méjì mọ́ láìfi àwòrán àjàgà tẹnumọ́ ju bó ṣe yẹ lọ.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Ẹyọ tí a lò ní Gíríìkì dúró fún gbogbo ènìyàn lápapọ̀. “Ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìkìlọ̀ náà mọ́ ọkùnrin nìkan.
- source_word: μὴ χωριζέτω
  choice: kí ... má ṣe yà á sọ́tọ̀
  rationale: Ìṣètò “kí ... má ṣe” fi àṣẹ ìdènà hàn ní Yorùbá òde òní; “yà á sọ́tọ̀” sì bá ìtumọ̀ pípa ohun tí a so pọ̀ tú mu.
theological_decisions:
- issue: Ìtumọ̀ àpapọ̀ ti ἄνθρωπος nínú ọ̀rọ̀ nípa ìgbéyàwó
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ, níbí ó ń tọ́ka sí ẹnikẹ́ni, kì í ṣe ọkùnrin nìkan. “Ènìyàn” pa ìkìlọ̀ tó kan gbogbo ẹ̀dá ènìyàn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
- issue: Agbára ìdènà nínú μὴ χωριζέτω
  choice: kí ... má ṣe yà á sọ́tọ̀
  alternative: ẹ má ṣe yà á sọ́tọ̀
  rationale: Ẹni kẹta ẹyọ nínú Gíríìkì jẹ́ ìkìlọ̀ gbogbogbò sí ènìyàn; ìṣètò “kí ènìyàn má ṣe” pa irú agbára gírámà yẹn mọ́ dáadáa.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tó bójú mu, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn kíkún wà lórí ọ̀rọ̀ níbi tí ó bá yẹ; ìṣètò gbolohun náà tẹ̀ lé ìtẹ̀sí ọ̀rọ̀ Gíríìkì láìdi èdè Yorùbá líle.
