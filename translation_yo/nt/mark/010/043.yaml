lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Ṣùgbọ́n kò rí bẹ́ẹ̀ láàárín yín
  rationale: Ó fi ìtakora δέ àti ọ̀nà tí οὕτως ń tọ́ka sí hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ àwùjọ ἐν ὑμῖν mọ́.
- source_word: ἀλλ’
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó mú ìtakora líle àti àtúnṣe tí ἀλλά ní nínú ọ̀rọ̀ yìí hàn kedere.
- source_word: ὃς ἂν θέλῃ
  choice: ẹnikẹ́ni tí ó bá fẹ́
  rationale: Ìṣètò ‘tí ó bá’ fi ipò àìdánimọ̀ gbogbogbò ti ἄν pẹ̀lú subjunctive hàn, ‘fẹ́’ sì pa ìtumọ̀ ìfẹ́-inú θέλω mọ́.
- source_word: μέγας γενέσθαι
  choice: di ẹni ńlá
  rationale: ‘Di’ fi ìtumọ̀ ìbẹ̀rẹ̀ tàbí ìyípadà inú γενέσθαι hàn, ‘ẹni ńlá’ sì tọ́ka sí ipò gíga láìdín in kù sí òkìkí.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó bá ìtumọ̀ àwùjọ mu, a sì lò ó bákan náà ní ibi méjèèjì.
- source_word: ἔσται ὑμῶν διάκονος
  choice: yóò jẹ́ ìránṣẹ́ yín
  rationale: ‘Yóò jẹ́’ pa fọ́ọ̀mù ọ̀rọ̀-ọ̀hún ọjọ́ iwájú mọ́; ‘ìránṣẹ́’ sọ iṣẹ́ ìsìn onírẹ̀lẹ̀ tí διάκονος túmọ̀ sí láìsọ ọ́ di ipò iṣẹ́ ìjọ.
theological_decisions:
- issue: Agbára ìtọ́ni inú ọ̀rọ̀-ọ̀hún ọjọ́ iwájú ἔσται
  choice: yóò jẹ́ ìránṣẹ́ yín
  alternative: gbọ́dọ̀ jẹ́ ìránṣẹ́ yín
  rationale: Ọ̀rọ̀-ọ̀hún ọjọ́ iwájú lè ní agbára ìtọ́ni ní àyíká yìí, ṣùgbọ́n ìtumọ̀ pàtàkì pa fọ́ọ̀mù Gíríìkì mọ́, àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ dandan tí ó ṣeé ṣe.
- issue: Ìtumọ̀ διάκονος
  choice: ìránṣẹ́
  alternative: òjíṣẹ́
  rationale: Níhìn-ín ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń ṣe iṣẹ́ ìsìn onírẹ̀lẹ̀ nínú àwùjọ, kì í ṣe dandan ipò àkànṣe nínú ìjọ.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì yé òǹkàwé òde òní. A pa ìtakora àti ìṣòro ìtumọ̀ ἔσται mọ́ nípa àlàyé ìsàlẹ̀.
