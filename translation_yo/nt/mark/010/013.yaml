source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: yo
  text: Wọ́n sì ń mú àwọn ọmọ wá sọ́dọ̀ rẹ̀, kí ó lè kàn wọ́n[a]; ṣùgbọ́n àwọn ọmọ-ẹ̀yìn bá àwọn tí ń mú wọn wá wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ kéékèèké.” Ọ̀rọ̀ Gíríìkì παιδία lè tọ́ka sí àwọn ọmọ ní gbogbogbò, títí kan àwọn ọmọ tí wọ́n kéré ọdún.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: ń gbé ... wá sọ́dọ̀ rẹ̀
  rationale: Àkókò imperfect fi hàn pé ìṣe náà ń bá a lọ tàbí pé ó ń ṣẹlẹ̀ léraléra; ‘ń gbé ... wá’ mú apá yìí jáde ní Yorùbá àdánidá.
- source_word: παιδία
  choice: àwọn ọmọ
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ọmọ ní gbogbogbòò, títí kan àwọn ọmọ kéékèèké; ‘àwọn ọmọ’ kò fi ọjọ́-orí tí Gíríìkì kò sọ kún un.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: kí ó lè fi ọwọ́ kàn wọ́n
  rationale: ἵνα pẹ̀lú subjunctive sọ ète; ‘fi ọwọ́ kàn’ túmọ̀ ἅπτομαι ní kedere láì fi ìṣe gbígbé ọwọ́ lé wọn kún ẹsẹ yìí.
- source_word: ἐπετίμησαν
  choice: bá ... wí
  rationale: ‘Bá ... wí’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìbáwí líle, ó sì bá agbára ἐπιτιμάω mu láì di ọ̀rọ̀ àdúgbò.
- source_word: αὐτοῖς
  choice: àwọn tí ń gbé wọn wá
  rationale: A sọ ẹni tí arọ́pò-orúkọ náà tọ́ka sí ní kedere nítorí pé Yorùbá ‘wọn’ nìkan lè fa ìdàrúdàpọ̀ láàárín àwọn ọmọ àti àwọn tó gbé wọn wá.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín fífi àwọn ọmọ mú wá àti ìhùwàsí àwọn ọmọ-ẹ̀yìn hàn.
theological_decisions:
- issue: Ẹni tí àwọn ọmọ-ẹ̀yìn bá wí
  choice: Àwọn ènìyàn tí ń gbé àwọn ọmọ wá
  alternative: Àwọn ọmọ náà
  rationale: Arọ́pò-orúkọ dative náà tọ́ka lọ́nà tó ṣeé gbà jù sí àwọn ẹni tí a kò dárúkọ ní tààrà gẹ́gẹ́ bí olùṣe προσέφερον. Ìtumọ̀ yìí tún bá ìṣàn ìtàn àti ìdíwọ́ tí àwọn ọmọ-ẹ̀yìn ń ṣe mu.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Fi ọwọ́ kàn’ jẹ́ ọ̀rọ̀ àdánidá ju ‘kàn’ nìkan lọ ní àyíká yìí, ṣùgbọ́n kò túmọ̀ sí pé ó gbé ọwọ́ lé wọn. A tú αὐτοῖς sí gbólóhùn kedere láti yẹra fún àìdánilójú arọ́pò-orúkọ Yorùbá.
