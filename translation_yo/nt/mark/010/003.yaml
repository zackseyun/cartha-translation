  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Kí ni Mósè pa láṣẹ fún yín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Asopọ̀ oníwọ̀nba ni δέ; “Ṣùgbọ́n” bá ìyípadà inú ìjíròrò àti ìtakora díẹ̀ sí ìbéèrè àdánwò tó ṣáájú mu.
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dá wọn lóhùn pé
  rationale: 'Gbólóhùn Gíríìkì yìí ní ìtumọ̀ ìṣe kan ṣoṣo ní Yorùbá àdánidá: ó fèsì sí wọn; “pé” sì ṣí ọ̀rọ̀ tààrà náà.'
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn tí Jésù ń dá lóhùn, ó sì wọ inú àpólà “dá wọn lóhùn” lọ́nà àdánidá.
- source_word: Τί
  choice: Kí ni
  rationale: Τί béèrè nípa ohun tí àṣẹ náà jẹ́; “Kí ni” ni ọ̀nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dátífù náà fi àwọn olùgbà àṣẹ hàn; “fún yín” mú ìbáṣepọ̀ yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐνετείλατο
  choice: pa láṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àṣẹ aláṣẹ tàbí ìtọ́ni tó ní agbára fúnni; “pa láṣẹ” pa ìtumọ̀ òfin àti àṣẹ mọ́.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: A lo ìrísí orúkọ Mósè tí ó ti fìdí múlẹ̀ nínú Yorùbá.
theological_decisions:
- issue: Ìtọ́kasí sí àṣẹ Mósè nínú ìdáhùn Jésù
  choice: A fi “Mósè” sílẹ̀ gẹ́gẹ́ bí ẹni tí a dárúkọ pé ó pa àṣẹ náà.
  alternative: “Kí ni òfin Mósè pa láṣẹ fún yín?” tàbí “Kí ni Ọlọ́run pa láṣẹ fún yín nípasẹ̀ Mósè?”
  rationale: Ọ̀rọ̀ Gíríìkì dárúkọ Mósè ní tààrà, kò sì ṣàlàyé rẹ̀ sí “òfin” tàbí “Ọlọ́run nípasẹ̀ Mósè.” Yíyan ọ̀rọ̀ tó wà níbẹ̀ gan-an kò fi ẹ̀kọ́ ìsìn àfikún kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. “Dá wọn lóhùn pé” jẹ́ àdánidá ju títú ἀποκριθεὶς εἶπεν sí ọ̀rọ̀ méjì lọ.
