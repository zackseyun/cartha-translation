id: MRK.10.51
reference: Mark 10:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “Kí ni o fẹ́ kí n ṣe fún ọ?” Ọkùnrin afọ́jú náà sì wí fún un pé, “Rábónì,[a] kí n tún lè rí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rábónì” jẹ́ ọ̀rọ̀ ìpè ní èdè Árámáíkì, tó túmọ̀ sí “olùkọ́ mi” tàbí “ọ̀gá mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dá a lóhùn
  rationale: Ó túmọ̀ participle Gíríìkì náà ní ọ̀nà Yorùbá tí ó ṣe déédéé, láìfi ọ̀rọ̀ ìdáhùn náà sílẹ̀.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Kí ni o fẹ́ kí n ṣe fún ọ?
  rationale: Ó pa ìfẹ́ inú θέλεις àti dative σοι mọ́ ní Yorùbá adayébá.
- source_word: τυφλὸς
  choice: ọkùnrin afọ́jú náà
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ ní Gíríìkì; fífi “ọkùnrin” kún un mú kí ìtọ́kasí ẹni kan ṣe kedere ní Yorùbá.
- source_word: Ραββουνι
  choice: Rábónì
  rationale: A pa ìrísí ọ̀rọ̀ ìpè Semitic tí Gíríìkì fúnra rẹ̀ transliterate mọ́, a sì ṣàlàyé ìtumọ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: ἵνα ἀναβλέψω
  choice: jẹ́ kí n tún ríran
  rationale: Nínú ọ̀rọ̀ ìwòsàn, ἀναβλέπω túmọ̀ sí ríríran padà; gbólóhùn yìí jẹ́ adayébá, ó sì pa ète/ìbéèrè ἵνα mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ραββουνι gẹ́gẹ́ bí ọ̀rọ̀ ìpè
  choice: A pa “Rábónì” mọ́ nínú ẹsẹ̀, pẹ̀lú àlàyé ìsàlẹ̀.
  alternative: Olùkọ́ mi; Ọ̀gá mi
  rationale: Gíríìkì pa ọ̀rọ̀ Semitic tí a kọ ní ìró rẹ̀ mọ́ dípò kí ó fi oyè Gíríìkì mìíràn rọ́pò rẹ̀; ṣíṣe bákan náà pa àwọ̀ ìtàn àti ìmọ̀lára ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ adayébá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “wí” láti yà ọ̀rọ̀ ọkùnrin náà sí mímọ́ lẹ́yìn “dá a lóhùn pé,” kí àsọtúnsọ má bà a le.
