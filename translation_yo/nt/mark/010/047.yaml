  naturalness: Èdè ẹsẹ̀ náà jẹ́ Yorùbá boṣewa, ó sì ní àmì ohùn rere. ‘ṣàánú mi’ jẹ́ ọ̀nà tí ó wọ́pọ̀ àti tó péye jù fún ‘have mercy on me’ ní ibi yìí. Àlàyé ìsàlẹ̀ tún nílò ìtúnṣe díẹ̀ kí ó má ṣe pè ‘ará Násárẹ́tì’ ní ìrísí gangan Gíríìkì, nítorí pé ó jẹ́ ìtumọ̀ Yorùbá ti àpèjúwe náà.
  terminology: ‘Jésù,’ ‘Ọmọ Dáfídì,’ àti ‘Násárẹ́tì’ yẹ, wọ́n sì bá ìlò Bíbélì Yorùbá mu. A pa agbára oyè/àpèjúwe ti Ναζαρηνός mọ́ nínú àlàyé ìsàlẹ̀ láìsọ pé ó jẹ́ gbólóhùn ibi lasán.
