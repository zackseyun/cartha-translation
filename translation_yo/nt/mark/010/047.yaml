source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: yo
  text: Nígbà tí ó sì gbọ́ pé Jésù ará Násárẹ́tì[a] ni, ó bẹ̀rẹ̀ sí í ké jáde, ó sì bẹ̀rẹ̀ sí í wí pé, “Jésù, Ọmọ Dáfídì, ṣàánú mi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù láti Násárẹ́tì.” Gíríìkì lo “ẹni Násárẹ́tì” gẹ́gẹ́ bí àpèjúwe ẹni tàbí oyè, kì í ṣe gbólóhùn ibi tó ṣe kedere bí “láti Násárẹ́tì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ó gbọ́
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; ọ̀rọ̀ yìí fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: Ναζαρηνός
  choice: ará Násárẹ́tì
  rationale: Ó jẹ́ àpèjúwe ẹni gẹ́gẹ́ bí ẹni tí ó jẹ́ ti Násárẹ́tì. Yorùbá kò ní àkọlé tó bá ‘the Nazarene’ mu lọ́nà àdánidá, nítorí náà ‘ará Násárẹ́tì’ ni ó ṣe kedere jù, pẹ̀lú àlàyé ìrísí Gíríìkì nínú àlàyé ìsàlẹ̀.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: ó bẹ̀rẹ̀ sí í ké jáde, ó sì ń wí pé
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ àti àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́, bí ara ìkọ̀wé Máàkù ṣe rí.
- source_word: κράζειν
  choice: ké jáde
  rationale: Ó sọ ohùn líle àti ẹ̀bẹ̀ kánjúkánjú láìfi ìbínú kún un.
- source_word: Υἱὲ Δαυὶδ
  choice: Ọmọ Dáfídì
  rationale: Ó pa ìrísí gangan àti agbára oyè Mèsáyà mọ́ dípò yíyí i sí àlàyé ìran nìkan.
- source_word: ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá, tó ní iyì, fún ẹ̀bẹ̀ pé kí ẹni fi àánú hàn sí olùbẹ̀bẹ̀.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìrísí tí ó ti wọ́pọ̀ nínú Yorùbá.
theological_decisions:
- issue: Agbára Mèsáyà nínú ‘Ọmọ Dáfídì’
  choice: Pa ‘Ọmọ Dáfídì’ mọ́ gẹ́gẹ́ bí oyè tí ọkùnrin náà fi pe Jésù.
  alternative: ‘Àtọmọdọ́mọ Dáfídì’
  rationale: Nínú ìtàn Máàkù, ọ̀rọ̀ yìí ní ìtumọ̀ ọba àti Mèsáyà; títúmọ̀ rẹ̀ sí ìran lasán yóò dín agbára rẹ̀ kù.
- issue: Ìtumọ̀ Ναζαρηνός
  choice: Lo ‘ará Násárẹ́tì’ nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ sì tọ́ka sí pé Gíríìkì fi í ṣe àpèjúwe-orúkọ.
  alternative: ‘Jésù ọmọ Násárẹ́tì’ tàbí fífi àkọlé àjèjì bí ‘Násárénì’ ṣe é
  rationale: ‘Ará Násárẹ́tì’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa ìyàtọ̀ tó wà nínú ìrísí Gíríìkì mọ́ láìdá ọ̀rọ̀ tuntun tí kò wọ́pọ̀ sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní èdè àdánidá àti ọlọ́lá. A pa ìtẹ̀síwájú ìṣe Máàkù mọ́ nínú ‘ó bẹ̀rẹ̀ sí í ké jáde, ó sì ń wí pé,’ a sì lo ‘Ọmọ Dáfídì’ gẹ́gẹ́ bí oyè tó ní ìtumọ̀ Mèsáyà.
