id: MRK.10.14
reference: Mark 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Jésù rí èyí, inú bí i, ó sì sọ fún wọn pé, “Ẹ jẹ́ kí àwọn ọmọdé wá sọ́dọ̀ mi; ẹ má ṣe dá wọn dúró, nítorí ìjọba Ọlọ́run jẹ́ ti irú àwọn ẹni bẹ́ẹ̀.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “nítorí ti irú àwọn ẹni bẹ́ẹ̀ ni ìjọba Ọlọ́run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Ṣùgbọ́n nígbà tí Jésù rí èyí
  rationale: Aorist participle náà sọ ipò tí ó ṣáájú ìhùwàsí Jésù; ‘rí èyí’ mú ohun tí àyíká ẹsẹ̀ ṣáájú ń tọ́ka sí hàn ní Yorùbá àdánidá, δὲ sì fi ìyàtọ̀ sí ìṣe àwọn ọmọ-ẹ̀yìn hàn.
- source_word: ἠγανάκτησεν
  choice: inú bí i
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìbínú tàbí ìbànújẹ́ líle nítorí ohun tí kò tọ́; ‘inú bí i’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láìsọ ọ́ di ìbínú aláìṣàkóso.
- source_word: εἶπεν αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún ìfihàn ọ̀rọ̀ tí a sọ sí àwọn ènìyàn kan.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Ẹ jẹ́ kí àwọn ọmọdé wá sọ́dọ̀ mi
  rationale: Ἄφετε níbí jẹ́ àṣẹ láti yọ̀ǹda; ‘ẹ jẹ́ kí’ sì jẹ́ ìtumọ̀ Yorùbá tó bójú mu. ‘Àwọn ọmọdé’ kò fi ìwọ̀n ọjọ́-ori tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: μὴ κωλύετε αὐτά
  choice: ẹ má ṣe dá wọn dúró
  rationale: κωλύω túmọ̀ sí dídènà tàbí dí ẹnì kan lọ́wọ́; ‘dá wọn dúró’ jẹ́ kedere, ó sì bá àyíká wíwọlé sọ́dọ̀ Jésù mu.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: nítorí ... jẹ́ ti irú àwọn ẹni bẹ́ẹ̀
  rationale: τοιούτων tọ́ka sí àwọn ẹni irú wọn, kì í ṣe àwọn ọmọdé wọ̀nyí nìkan. ‘Jẹ́ ti’ tú ìtumọ̀ genitive náà jáde lọ́nà àdánidá, nígbà tí àlàyé ìtumọ̀ gangan wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí pa gbólóhùn Bíbélì tó mọ́ọ̀mọ́ àti ìtumọ̀ βασιλεία mọ́, láìdín un kù sí agbègbè tàbí ilẹ̀ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ‘τῶν ... τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ’
  choice: Ìjọba Ọlọ́run jẹ́ ti irú àwọn ẹni bí àwọn ọmọdé wọ̀nyí.
  alternative: ‘Ti irú àwọn ẹni bẹ́ẹ̀ ni ìjọba Ọlọ́run’ tàbí ìtumọ̀ pé àwọn ọmọdé gangan nìkan ni a ń sọ.
  rationale: τοιούτων ní agbára aṣojú, ó ń tọ́ka sí àwọn ẹni tí wọ́n jẹ́ irú wọn. Ìtumọ̀ náà kò fi ẹ̀kọ́ nípa àìlẹ́ṣẹ̀ tàbí ìgbàlà gbogbo ọmọdé kún ohun tí ẹsẹ̀ náà kò sọ, ó sì pa ìfojúsùn ọ̀rọ̀ Jésù mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ọ̀rọ̀ àdánidá bí ‘inú bí i’ àti ‘dá wọn dúró’ láìsọ agbára ọ̀rọ̀ orísun nù.
