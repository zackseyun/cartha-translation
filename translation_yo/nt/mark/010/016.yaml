  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: yo
  text: Ó sì gbé wọn sínú apá rẹ̀, ó sì ń bùkún wọn[b], ó ń gbé ọwọ́ lé wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń fi ọwọ́ rẹ̀ lé wọn.”
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ ìṣe Gíríìkì náà wà ní àkókò imperfect, ó sì lè fi ìṣe tí ń tẹ̀ síwájú tàbí tí a ń ṣe léraléra hàn: “ó ń bùkún wọn léraléra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: gbé wọn sí apá rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbígba ẹnì kan sínú apá; yíyan ọ̀rọ̀ yìí pa ìṣe náà mọ́ ní kedere, ó sì fi ìfẹ́ inú ìṣe náà hàn.
- source_word: κατευλόγει
  choice: ó ń súre fún wọn
  rationale: Fọ́ọ̀mù imperfect àti agbára ọ̀rọ̀ ìṣe àkópọ̀ náà tọ́ka sí ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra; ìtumọ̀ yìí mú ìyẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: ó ń gbé ọwọ́ lé wọn
  rationale: Èyí pa ìṣe fífi ọwọ́ lé wọn mọ́ gẹ́gẹ́ bí ọ̀nà tí ó fi ń súre fún wọn, láìfi ìtumọ̀ àṣà ẹ̀sìn míì kún un.
- source_word: αὐτὰ ... αὐτά
  choice: wọn
  rationale: Àrọ́pò-orúkọ náà ń tọ́ka sí àwọn ọmọ kéékèèké nínú àyíká ọ̀rọ̀; “wọn” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” pa ìsopọ̀ ìtàn Máríkọ̀ mọ́ láìfi ìtumọ̀ àsìkò tàbí àbájáde tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Irú ìṣe Jésù sí àwọn ọmọ kéékèèké
  choice: 'Pa àwọn ìṣe gidi náà mọ́: ó gbé wọn sí apá rẹ̀, ó súre fún wọn, ó sì gbé ọwọ́ lé wọn.'
  alternative: Ó dì mọ́ra, ó sì kéde ìbùkún lórí wọn; tàbí ó súre fún wọn nípa fífi ọwọ́ lé wọn.
  rationale: Ẹsẹ̀ náà ṣàpèjúwe bí Jésù ṣe fi ìfẹ́ gba àwọn ọmọ náà tí ó sì súre fún wọn. A kò fi èdè sakiramenti tàbí ètò ìsìn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Gbé wọn sí apá rẹ̀” ṣe kedere ju “dì wọn mọ́ra” lọ fún ìtumọ̀ pàtó ti ἐναγκαλισάμενος. A lo àkókò ìṣe tí ń lọ lọ́wọ́ fún κατευλόγει àti τιθεὶς láti fi ìṣàn ìṣe Gíríìkì hàn.
