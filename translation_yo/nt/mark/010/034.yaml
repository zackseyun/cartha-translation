source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: yo
  text: Wọ́n yóò fi í ṣe ẹlẹ́yà, wọ́n yóò tutọ́ sí i, wọ́n yóò nà án ní pàṣán, wọ́n yóò sì pa á; lẹ́yìn ọjọ́ mẹ́ta[a], yóò jí dìde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, Máàkù sọ, “lẹ́yìn ọjọ́ mẹ́ta”; a lè tún gbà á ní ìtumọ̀ “láàrín ọjọ́ mẹ́ta.” Àwọn ẹsẹ mìíràn sì sọ àsìkò náà ní “ní ọjọ́ kẹta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: wọn yóò fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ẹnì kan ṣe ẹlẹ́yà tàbí hù sí i pẹ̀lú ẹ̀gàn. Gbólóhùn Yórùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìwà ẹ̀gàn tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: wọn yóò tutọ́ sí i
  rationale: Ìtumọ̀ yìí fi hàn pé wọ́n darí ìtutọ́ náà sí i gẹ́gẹ́ bí ìṣe ìtìjú àti ẹ̀gàn.
- source_word: μαστιγώσουσιν
  choice: wọn yóò nà án ní pàṣán
  rationale: Èyí sọ ìlù pàṣán tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ní kedere, ó sì yé òǹkàwé Yórùbá òde òní.
- source_word: ἀποκτενοῦσιν
  choice: wọn yóò pa á
  rationale: Èyí ni ìtumọ̀ tààrà tí kò fi èrò òfin tàbí ìdájọ́ ìwà kun ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: lẹ́yìn ọjọ́ mẹ́ta
  rationale: μετά pẹ̀lú accusative túmọ̀ sí ‘lẹ́yìn’; ìtumọ̀ yìí pa ọ̀nà tí Máàkù gbà sọ àsìkò náà mọ́ láì mú un bá ọ̀rọ̀ ‘ní ọjọ́ kẹta’ mu ní ìkọ̀kọ̀.
- source_word: ἀναστήσεται
  choice: yóò jí dìde
  rationale: 'Future middle náà lè jẹ́ àìṣe aláṣẹ níbí: òun fúnra rẹ̀ yóò dìde kúrò nínú òkú. A kò fi ‘lẹ́ẹ̀kan sí i’ kun un nítorí kò sí ní gbangba nínú Gíríìkì.'
theological_decisions:
- issue: Ọ̀rọ̀ nípa àjíǹde
  choice: yóò jí dìde
  alternative: a ó jí i dìde; yóò tún jí dìde
  rationale: ἀναστήσεται jẹ́ future middle, ó sì fọwọ́ sí ìtumọ̀ àìṣe aláṣẹ ‘yóò jí dìde.’ Èyí pa ọ̀rọ̀ ẹsẹ yìí mọ́ láì sọ ẹ̀rí àwọn ẹsẹ mìíràn di asán, níbi tí wọ́n ti sọ pé Ọlọ́run jí Jésù dìde. A kò fi ‘tún’ kun un nítorí kò farahàn nínú ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yórùbá àgbàdojútó, ti òde òní, tí ó ní iyì ni a lò. ‘Nà án ní pàṣán’ ṣe kedere ju ‘nà án’ nìkan lọ, ‘jí dìde’ sì jẹ́ ọ̀nà àdánidá láti sọ àjíǹde láì yí middle form Gíríìkì padà sí passive.
