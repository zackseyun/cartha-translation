  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa: ẹ̀gàn, ìtutọ́ tí a darí sí i, ìnà ní pàṣán, pípa, àti jíjí dìde ni a pa mọ́. “Lẹ́yìn ọjọ́ mẹ́ta” jẹ́ ìtumọ̀ tààrà fún μετὰ τρεῖς ἡμέρας, àti “yóò jí dìde” pa ìtumọ̀ intransitive ti ἀναστήσεται mọ́.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tó mọ́, tó sì yẹ fún àkọsílẹ̀ ìwé mímọ́. “Fi í ṣe ẹlẹ́yà,” “tutọ́ sí i,” “nà án ní pàṣán,” àti “jí dìde” jẹ́ ọ̀nà àdánidá.
  terminology: 'Àwọn ọ̀rọ̀ pàtàkì ni a lò ní ìbámu pẹ̀lú ìtumọ̀ wọn: “nà án ní pàṣán” fi ìtumọ̀ μαστιγώσουσιν hàn, “pa á” kò fi ìtumọ̀ ìdájọ́ òfin tàbí ìwà-èṣù kun ἀποκτενοῦσιν, “jí dìde” kò sì yí ἀναστήσεται padà sí passive. Àmì àlàyé náà nìkan ló nílò àtúnṣe kékeré, nítorí “ní ọjọ́ mẹ́ta” kò ṣàfihàn ‘in three days’ ní kedere nínú Yorùbá.'
