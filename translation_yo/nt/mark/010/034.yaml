    rationale: A gbọdọ̀ pa ìyàtọ̀ tó wà láàárín “lẹ́yìn ọjọ́ mẹ́ta” nínú Máàkù àti “ní ọjọ́ kẹta” nínú àwọn ẹsẹ mìíràn mọ́. “Láàrín ọjọ́ mẹ́ta” sọ aṣayan ‘in three days’ ní kedere síi, láì yí ìtumọ̀ àkọ́kọ́ padà.
