  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: yo
  text: Nígbà tí àwọn mẹ́wàá náà gbọ́, wọ́n sì bẹ̀rẹ̀ sí í bínú sí Jákọ́bù àti Jòhánù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n bẹ̀rẹ̀ sí í bínú nítorí Jákọ́bù àti Jòhánù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ẹni tí ìbínú náà dojú kọ tàbí sí àwọn ẹni tí ó fa ìbínú náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Àsopọ̀ ìtàn ni Καὶ; “sì” jẹ́ ọ̀nà àdánidá láti mú ìtàn náà tẹ̀ síwájú ní Yorùbá láìfi ìtumọ̀ àkókò kún un.
- source_word: ἀκούσαντες
  choice: Nígbà tí ... gbọ́
  rationale: Ọ̀rọ̀ àbọ̀ aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì; gbólóhùn àkókò yìí mú ìbáṣepọ̀ náà hàn ní Yorùbá. A kò fi ohun tí wọ́n gbọ́ kún un, nítorí àyíká ọ̀rọ̀ ti mú un yé.
- source_word: οἱ δέκα
  choice: àwọn mẹ́wàá náà
  rationale: Èyí pa ìtumọ̀ gangan “àwọn mẹ́wàá” mọ́, láìfi “ọmọ-ẹ̀yìn yòókù” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἤρξαντο
  choice: wọ́n bẹ̀rẹ̀ sí í
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìhùwàpadà náà mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἀγανακτεῖν
  choice: bínú
  rationale: Nínú àyíká yìí, “bínú” fi ìbínú líle àti àìnífẹ̀ẹ́ hàn ní èdè Yorùbá tó ṣe kedere; “bínú gidigidi” yóò fi ìpele tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: sí Jákọ́bù àti Jòhánù
  rationale: Pẹ̀lú ọ̀rọ̀ ìmọ̀lára yìí, περί lè tọ́ka sí àwọn ẹni tí ìbínú náà dojú kọ; “bínú sí” jẹ́ ìsọ̀rọ̀ Yorùbá tó yẹ. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì pé wọ́n lè jẹ́ okùnfà ìbínú náà mọ́.
- source_word: Ἰακώβου
  choice: Jákọ́bù
  rationale: Fọ́ọ̀mù orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá fún Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Jòhánù
  rationale: Fọ́ọ̀mù orúkọ Bíbélì tí ó wọ́pọ̀ ní Yorùbá fún Ἰωάννης.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá, a sì pa ìṣòro ìtumọ̀ περί mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
