id: MRK.10.29
reference: Mark 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: yo
  text: Jésù wí pé, “Lóòótọ́ ni mo wí fún yín, kò sí ẹnikẹ́ni tí ó ti fi ilé sílẹ̀, tàbí àwọn arákùnrin, tàbí àwọn arábìnrin, tàbí ìyá, tàbí bàbá, tàbí àwọn ọmọ, tàbí àwọn oko, nítorí mi àti nítorí ìhìn rere,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: wí pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì ní iyì láti fi ọ̀rọ̀ Jésù hàn, láìfi ìtumọ̀ bí ‘dáhùn’ kún un.
- source_word: Ἀμὴν
  choice: Lóòótọ́
  rationale: Nínú ọ̀rọ̀ ìkéde Jésù, èyí mú ìdánilójú àti ọlá inú ἀμήν jáde ní Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó pa ìṣètò ọ̀rọ̀ ìkéde oníyì ti Gíríìkì mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: οὐδείς ἐστιν ὃς
  choice: kò sí ẹnikẹ́ni tí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn ìwàláàyè alátakò tí ó kan gbogbo ènìyàn.
- source_word: ἀφῆκεν
  choice: tí ó ti fi ... sílẹ̀
  rationale: Ìṣe ‘fi sílẹ̀’ sọ kíkúrò tàbí fífi ohun kan sílẹ̀, láìlágbára ju ọ̀rọ̀ orísun lọ bí ‘kọ̀ sílẹ̀ pátápátá’ ṣe lè rí.
- source_word: οἰκίαν
  choice: ilé
  rationale: ‘Ilé’ jẹ́ ìbámu tààrà, ó sì lè tọ́ka sí ibùgbé láìyí i padà sí gbogbo agbo ilé.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Ó pa ìtọ́kasí sí àwọn ọmọ ìyá tàbí baba ọkùnrin mọ́, níwọ̀n bí orísun ti tún darúkọ àwọn arábìnrin lọ́tọ̀.
- source_word: ἀδελφὰς
  choice: àwọn arábìnrin
  rationale: Ìbámu tààrà fún àwọn ọmọ ìyá tàbí baba obìnrin.
- source_word: μητέρα
  choice: ìyá
  rationale: Ìbámu tààrà àti àdánidá.
- source_word: πατέρα
  choice: baba
  rationale: Ìbámu tààrà àti àdánidá.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbò fún ọmọ láìsọ akọ tàbí abo.
- source_word: ἀγρούς
  choice: àwọn oko
  rationale: ‘Oko’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pápá tàbí ilẹ̀ tí a ń lò fún iṣẹ́ àgbẹ̀.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: nítorí mi àti nítorí ìhìn rere
  rationale: Ó pa ìdí méjèèjì tí orísun darúkọ mọ́, láìsọ wọ́n di ìdí kan ṣoṣo.
theological_decisions:
- issue: Bí a ṣe máa tú àtòjọ ohun tí ọmọ-ẹ̀yìn fi sílẹ̀ láìsọ pé ó kọ ojúṣe ìdílé sílẹ̀ pátápátá
  choice: fi ilé sílẹ̀ ... tàbí ìyá ... tàbí àwọn ọmọ
  alternative: kọ ilé ... àti ìdílé ... sílẹ̀ pátápátá
  rationale: ‘Fi ... sílẹ̀’ pa ìnáwó àti ìrora títẹ̀lé Jésù mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ míràn kún un pé ẹni náà ti kọ gbogbo ojúṣe ìdílé tì.
- issue: Ìyàtọ̀ tó wà láàárín ‘nítorí mi’ àti ‘nítorí ìhìn rere’
  choice: pa àwọn gbólóhùn méjèèjì mọ́ lọ́tọ̀
  alternative: nítorí mi, èyíinì ni nítorí ìhìn rere
  rationale: καὶ so àwọn ìdí méjèèjì pọ̀, ṣùgbọ́n kò fi hàn gbangba pé ọ̀kan jẹ́ àlàyé ìkejì fún èkejì; ìtumọ̀ náà kò yẹ kí ó yanjú ìbáṣepọ̀ wọn ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; ọ̀rọ̀ náà ní iyì, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtòjọ àti ìtẹnumọ́ orísun mọ́. Kò sí àlàyé ìsàlẹ̀ ojú ìwé tí a nílò fún ẹsẹ yìí.
