  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: yo
  text: Bákan náà, bí obìnrin bá kọ ọkọ rẹ̀ sílẹ̀[a], tí ó sì fẹ́ ọkùnrin mìíràn, ó ṣe panṣágà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, ‘rán ọkọ rẹ̀ lọ.’ Nínú àyíká ìgbéyàwó yìí, ìtumọ̀ rẹ̀ ni ‘kọ ọkọ rẹ̀ sílẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Àti
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ọ̀ràn tó jọ ọ́ nínú ẹsẹ 11.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Ìṣètò ọ̀rọ̀ Yorùbá yìí fi gbólóhùn oní شرط hàn lọ́nà àdánidá.
- source_word: αὐτὴ
  choice: obìnrin náà
  rationale: Ó pa akọ-abo abo inú ọ̀rọ̀ Gíríìkì mọ́, ó sì ṣe kedere ní Yorùbá ju lílo ‘ó’ nìkan lọ; ‘náà’ tún ń fi ìtẹnumọ́ díẹ̀ hàn.
- source_word: ἀπολύσασα
  choice: kọ ... sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó, gbólóhùn Yorùbá yìí túmọ̀ sí yíyọ ìgbéyàwó, kì í ṣe pé ó kàn rán ẹni náà lọ.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: ọkọ rẹ̀
  rationale: Àyíká ìgbéyàwó fi hàn pé ἀνήρ túmọ̀ sí ọkọ, kì í ṣe ọkùnrin lásán.
- source_word: γαμήσῃ ἄλλον
  choice: fẹ́ ọkùnrin mìíràn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ‘marry another man,’ ó sì pa akọ-abo ọkùnrin inú ἄλλον mọ́.
- source_word: μοιχᾶται
  choice: ó ṣe panṣágà
  rationale: Èyí ni ọ̀nà Yorùbá tààrà, tí ó sì wọ́pọ̀, fún iṣẹ́ panṣágà.
theological_decisions:
- issue: Bóyá kí a pa ọ̀rọ̀ akọ-abo pàtó inú gbolohun náà mọ́
  choice: obìnrin náà ... ọkọ rẹ̀ ... ọkùnrin mìíràn
  alternative: bí aya kan bá kọ ọkọ rẹ̀ sílẹ̀, tí ó sì fẹ́ ẹlòmíràn
  rationale: Ọ̀rọ̀ Gíríìkì sọ abo gẹ́gẹ́ bí olùṣe, ọkọ rẹ̀ gẹ́gẹ́ bí ẹni tí a kọ̀ sílẹ̀, àti ọkùnrin mìíràn gẹ́gẹ́ bí ẹni tí ó fẹ́; ìtumọ̀ náà pa ìfarajọ rẹ̀ pẹ̀lú ẹsẹ 11 mọ́.
- issue: Bóyá kí ἀπολύω jẹ́ ọ̀rọ̀ gangan tàbí ọ̀rọ̀ ìkọ̀sílẹ̀ nínú ìgbéyàwó
  choice: kọ ọkọ rẹ̀ sílẹ̀
  alternative: rán ọkọ rẹ̀ lọ
  rationale: Àyíká náà jẹ́ ti píparí ìgbéyàwó; ‘kọ ... sílẹ̀’ sọ èyí ní Yorùbá àdánidá láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ṣe panṣágà’ jẹ́ gbólóhùn Bíbélì tí àwọn ènìyàn òde òní tún lóye dáadáa.
