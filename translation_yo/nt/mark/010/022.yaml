source:
  edition: SBLGNT
  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: yo
  text: Ṣùgbọ́n ojú rẹ̀ ṣú nítorí ọ̀rọ̀ náà, ó sì lọ ní ìbànújẹ́, nítorí ó ní ohun ìní púpọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνάσας
  choice: mú kí ojú rẹ̀ ṣú
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ìyípadà tí ó hàn ní ojú ẹni, bí ojú rẹ̀ ti ṣókùnkùn nítorí ìbànújẹ́. Gbólóhùn Yorùbá yìí pa àwòrán tí Gíríìkì ní mọ́ láìfi ìtumọ̀ ìbínú kún un.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ọ̀rọ̀ náà mú kí
  rationale: Ẹ̀ka ọ̀rọ̀ yìí lè fi ohun tó fa ìhùwàsí náà hàn. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa λόγος tó jẹ́ ẹyọ kan mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀ náà.’
- source_word: ἀπῆλθεν
  choice: ó ... lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ìṣípò nínú ìtàn mu.
- source_word: λυπούμενος
  choice: pẹ̀lú ìbànújẹ́
  rationale: Ó fi hàn pé ìbànújẹ́ ń bá a lọ bí ó ti ń kúrò, láìsọ ọ́ di ìdájọ́ nípa ìwà rẹ̀.
- source_word: κτήματα πολλά
  choice: ohun ìní púpọ̀
  rationale: κτήματα túmọ̀ sí dúkìá tàbí ohun tí ènìyàn ní. ‘Ohun ìní púpọ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ πολλά mọ́.
- source_word: ἦν γὰρ ἔχων
  choice: nítorí ó ní
  rationale: Èyí sọ ipò tí ó ń bá a lọ ní Yorùbá àdánidá; kò pọndandan láti fara wé ìṣètò ọ̀rọ̀ Gíríìkì ní tààrà.
theological_decisions:
- issue: Irú ìhùwàsí ọkàn ọkùnrin náà sí ohun tí Jésù sọ
  choice: A fi ìṣújú tó hàn àti ìbànújẹ́ rẹ̀ hàn láìfi ìdájọ́ míì kún un.
  alternative: Kí a sọ pé ó bínú tàbí pé ìjákulẹ̀ lásán ló bá a.
  rationale: Ẹsẹ náà sọ nípa ojú tó ṣú àti ìbànújẹ́, ṣùgbọ́n kò sọ ní tààrà pé ó bínú tàbí pé ó ṣọ̀tẹ̀. Ìtumọ̀ náà pa ìdàrúdàpọ̀ àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ìtàn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbo; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá.
