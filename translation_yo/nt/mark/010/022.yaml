  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ọgbọ́n ìtumọ̀ Gíríìkì mú dáadáa: στυγνάσας ni a fihàn gẹ́gẹ́ bí ìyípadà ìrísí ojú, λυπούμενος gẹ́gẹ́ bí ìbànújẹ́ tó bá a lọ, àti κτήματα πολλά gẹ́gẹ́ bí ohun ìní púpọ̀. Síbẹ̀, ìṣètò ‘ọ̀rọ̀ náà mú kí ojú rẹ̀ ṣú’ túmọ̀ ἐπὶ τῷ λόγῳ ní ọ̀nà tó lágbára díẹ̀ ju ti Gíríìkì lọ; Gíríìkì ń sọ ìṣẹ̀lẹ̀/ìdí ìhùwàsí náà, kì í ṣe dandan pé ọ̀rọ̀ náà fúnra rẹ̀ ‘mú kí’ ó rí bẹ́ẹ̀.'
  naturalness: ‘Ó sì fi ìbànújẹ́ lọ’ lè ní ìtumọ̀ pé ó fi ìbànújẹ́ sílẹ̀ ní Yorùbá. ‘Ó sì lọ ní ìbànújẹ́’ jẹ́ kedere síi, ó sì mú ìṣe λυπούμενος, ìyẹn ìbànújẹ́ tó ń bá a lọ nígbà tí ó kúrò, hàn dáadáa.
  terminology: ‘Ojú rẹ̀ ṣú’ jẹ́ ọ̀nà Yorùbá tó yẹ láti ṣàfihàn ojú ẹni tí ó ṣókùnkùn tàbí tí ìrísí rẹ̀ wó lulẹ̀. ‘Ohun ìní púpọ̀’ jẹ́ ìtumọ̀ kedere, ìgbàlódé, tó sì bá κτήματα πολλά mu. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìsìn pàtàkì tó nílò ìṣàtúnṣe nínú ẹsẹ̀ yìí.
