id: MRK.10.49
reference: Mark 10:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: yo
  text: Jésù sì dúró[a], ó sọ pé, “Ẹ pè é.” Wọ́n sì pe ọkùnrin afọ́jú náà, wọ́n ń sọ fún un pé, “Má fòyà[b]; dìde, ó ń pè ọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “nígbà tí ó dúró”; ní àyíká yìí, ìtumọ̀ rẹ̀ ni pé ó dá ìrìn rẹ̀ dúró.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Mú ọkàn le.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: dúró
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘nígbà tí ó dúró,’ ṣùgbọ́n nínú ìtàn yìí ó fi hàn pé Jésù dá ìrìn rẹ̀ dúró. ‘Dúró’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: Φωνήσατε αὐτόν
  choice: Ẹ pè é
  rationale: φωνέω níbí túmọ̀ sí pípe ẹnì kan wá. ‘Ẹ pè é’ jẹ́ àsọyé tààrà, ó sì jẹ́ kí àtúnlò ọ̀rọ̀ náà hàn ní ìparí ẹsẹ náà.
- source_word: φωνοῦσι
  choice: wọ́n sì pe
  rationale: ‘Pe’ pa ìbámu ọ̀rọ̀ mọ́ pẹ̀lú àṣẹ Jésù, ó sì bá ìṣàn ìtàn Yorùbá mu.
- source_word: τὸν τυφλὸν
  choice: ọkùnrin afọ́jú náà
  rationale: τυφλός jẹ́ àpèjúwe tí a lò bí orúkọ níbí; ‘ọkùnrin afọ́jú náà’ jẹ́ kedere, ó sì bá ẹni tí àyíká ìtàn ń tọ́ka sí mu.
- source_word: Θάρσει
  choice: Má fòyà
  rationale: Àṣẹ yìí ń fún un ní ìgboyà, ó sì ń fi ọkàn rẹ̀ balẹ̀. ‘Má fòyà’ jẹ́ Yorùbá àdánidá, kedere, tí ó ní agbára ìṣírí náà.
- source_word: ἔγειρε
  choice: dìde
  rationale: ‘Dìde’ sọ àṣẹ láti gbéra sókè ní ṣókí, ó sì bá ìṣe tí a retí lọ́wọ́ ọkùnrin náà mu.
- source_word: φωνεῖ σε
  choice: ó ń pè ọ́
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ ni ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà ń fi hàn ní àyíká yìí. ‘Ó ń pè ọ́’ sọ pé ìpè Jésù jẹ́ ti àsìkò náà gan-an, ó sì tún ọ̀rọ̀ ‘pè’ ṣe bí Gíríìkì.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àkókò-òde tí ó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A pa àtúnlò φωνέω mọ́ nípasẹ̀ ‘pè,’ a sì lo ‘wọ́n ń sọ’ fún λέγοντες láti fi ìṣe tí ó ń bá a lọ hàn.
