base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: yo
  text: Wọ́n sì wí pé, “Mósè gbà wá láyè láti kọ ìwé ìkọ̀sílẹ̀[a], kí a sì lé e lọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwé ẹ̀rí ìkọ̀sílẹ̀.” Gbólóhùn Gíríìkì náà ń tọ́ka sí ìwé òfin tí ń jẹ́rìí sí ìkọ̀sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a sì kọ̀ ọ́ sílẹ̀.” Ní tààrà, “kí a sì lé e lọ”; níbí, ọ̀rọ̀ náà wà nínú àyíká ìkọ̀sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì wí pé
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí àwọn Farisí tí a mẹ́nu kàn ṣáájú; ‘sì’ fi ìtẹ̀síwájú tàbí ìyàtọ̀ díẹ̀ hàn lọ́nà Yorùbá àdánidá.
- source_word: Ἐπέτρεψεν
  choice: gbà wá láyè
  rationale: Ó túmọ̀ sí fífúnni ní àṣẹ tàbí ààyè, kì í ṣe pípàṣẹ; èyí pa ìyàtọ̀ tó wà láàárín ìyọ̀ǹda àti àṣẹ mọ́.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni ọ̀nà tí a sábà fi ń kọ orúkọ Mósè ní Yorùbá.
- source_word: βιβλίον ἀποστασίου
  choice: ìwé ìkọ̀sílẹ̀
  rationale: Gbólóhùn náà ń tọ́ka sí ìwé òfin tí ń jẹ́rìí sí ìkọ̀sílẹ̀; ọ̀rọ̀ yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: γράψαι
  choice: láti kọ
  rationale: Ó túmọ̀ ní tààrà sí kíkọ ìwé, láìfi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: καὶ ἀπολῦσαι
  choice: kí a sì lé obìnrin náà lọ
  rationale: Nínú àyíká ìgbéyàwó yìí, ọ̀rọ̀ náà túmọ̀ sí yíyọ aya sílẹ̀ tàbí lílé e lọ. Ìtumọ̀ yìí pa àwòrán ọ̀rọ̀ ìpilẹ̀ mọ́, nígbà tí ‘ìwé ìkọ̀sílẹ̀’ ti mú àyíká òfin náà ṣe kedere.
theological_decisions:
- issue: Irú ìtọ́nisọ́nà tí Mósè fún nípa ìkọ̀sílẹ̀
  choice: Mósè gbà wọ́n láyè láti kọ ara wọn sílẹ̀, kò pàṣẹ pé kí wọ́n ṣe bẹ́ẹ̀.
  alternative: Mósè pàṣẹ pé kí ọkùnrin kọ ìwé ìkọ̀sílẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì Ἐπέτρεψεν sọ ìyọ̀ǹda ní kedere. Èyí ṣe pàtàkì nínú àyíká ọ̀rọ̀ náà, níbi tí Jésù ti fi ìyọ̀ǹda nítorí líle ọkàn yàtọ̀ sí ète Ọlọ́run láti ìbẹ̀rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtumọ̀ òfin àti ìyàtọ̀ láàárín ìyọ̀ǹda àti àṣẹ mọ́.
