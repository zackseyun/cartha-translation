  source_fidelity: Ìtumọ̀ náà pa àtòjọ àwọn ohun tí a ṣèlérí, “pẹ̀lú inúnibíni,” àti ìyàtọ̀ láàárín àkókò ìsinsìnyí àti èyí tí ń bọ̀ mọ́ dáadáa. Síbẹ̀, “àwọn oko” lè túmọ̀ sí àwọn ọkọ (husbands) ní Yorùbá, nítorí náà kò ṣe kedere tó fún ἀγρούς. “Sáà tí ń bọ̀” sì ṣàfihàn αἰών gẹ́gẹ́ bí àkókò/ìgbà ayé dájú ju “ayé tí ń bọ̀” lọ.
  naturalness: Ìforúkọsílẹ̀ àti àmì ohùn dara, ìlànà gbolohun náà sì bá ipèle ẹsẹ̀ tó bẹ̀rẹ̀ láàárín gbolohun mu. “Àwọn ilẹ̀ oko” jẹ́ ìlò Yorùbá tí ó ṣe kedere ju “àwọn oko” lọ ní àyíká yìí.
  terminology: “Ìyè àìnípẹ̀kun,” “inúnibíni,” “arákùnrin,” àti “arábìnrin” yẹ, wọ́n sì pa ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́. A tún ṣe àtúnṣe àwọn àlàyé ìsàlẹ̀ kí wọ́n jẹ́ àwọn yíyan ọ̀rọ̀ gidi, kí wọ́n má sì fi ìtúmọ̀ àfikún tí kò wà nínú orísun kún ẹsẹ̀ náà.
