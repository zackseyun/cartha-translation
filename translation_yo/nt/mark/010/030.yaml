  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: yo
  text: tí kò ní gba ìlọ́po ọgọ́rùn-ún nísinsìnyí, ní àkókò yìí—àwọn ilé, àwọn arákùnrin, àwọn arábìnrin, àwọn ìyá, àwọn ọmọ àti àwọn ilẹ̀ oko[a], pẹ̀lú inúnibíni—àti ní sáà tí ń bọ̀[b], ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn oko.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ayé tí ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: gba
  rationale: Nínú ọ̀rọ̀ ìlérí yìí, “gba” fi ohun tí a fi fún ẹni hàn, kì í ṣe ohun tí ẹni náà fi agbára mú.
- source_word: ἑκατονταπλασίονα
  choice: ìlọ́po ọgọ́rùn-ún
  rationale: Ó pa agbára iye ọgọ́rùn-ún mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì bójú mu ní Yorùbá.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: nísinsìnyí, ní àkókò yìí
  rationale: Ó mú ìtẹnumọ́ ìsinsìnyí àti ìyàtọ̀ rẹ̀ sí ayé tí ń bọ̀ hàn gbangba.
- source_word: οἰκίας
  choice: àwọn ilé
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀pọ̀ ilé, ó sì pa àwòrán ohun ìní gidi mọ́.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: àwọn arákùnrin, àwọn arábìnrin
  rationale: Ó pa ìyàtọ̀ tí Gíríìkì ṣe láàárín àwọn ọkùnrin àti obìnrin tí wọ́n jẹ́ ará mọ́.
- source_word: μητέρας
  choice: àwọn ìyá
  rationale: Ìtumọ̀ tààrà ni, tí ó sì pa ọ̀pọ̀ nọ́ńbà inú orísun mọ́.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: “Àwọn ọmọ” bo akọ àti abo láì fi ohun tí kò sí nínú orísun kún un.
- source_word: ἀγρούς
  choice: àwọn oko
  rationale: Nínú àyíká ohun ìní àti iṣẹ́ àgbẹ̀, “àwọn oko” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ilẹ̀ tí a ń lò.
- source_word: μετὰ διωγμῶν
  choice: pẹ̀lú inúnibíni
  rationale: Ó pa òtítọ́ pàtàkì náà mọ́ pé ọ̀pọ̀ ìsanpadà ìsinsìnyí wà papọ̀ pẹ̀lú ìjìyà nítorí ìgbàgbọ́.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: ní ayé tí ń bọ̀
  rationale: “Ayé” lè tọ́ka sí sáà tàbí ètò ayé kan ní Yorùbá, ó sì jẹ́ ọ̀rọ̀ àdánidá fún ìyàtọ̀ eschatological yìí; àlàyé ìsàlẹ̀ fi yíyan “sáà” hàn.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó mọ́gbọ́n dání fún ìyè tí kò ní òpin nínú sáà tí ń bọ̀.
theological_decisions:
- issue: Ìwà ìsanpadà tí a ṣèlérí ní àkókò yìí
  choice: A túmọ̀ àwọn ilé, ìbátan àti oko gẹ́gẹ́ bí ìsanpadà gidi ní àkókò yìí, a sì pa “pẹ̀lú inúnibíni” mọ́.
  alternative: Kí a sọ gbogbo ìlérí náà di ìbùkún ẹ̀mí nìkan, tàbí kí a sọ ọ́ di ìlérí ọrọ̀ láìsí ìjìyà.
  rationale: Gíríìkì fi ọ̀pọ̀ ìsanpadà àti inúnibíni sí ẹ̀gbẹ́ ara wọn; ìtumọ̀ kò gbọ́dọ̀ tú ìforígbárí náà ká sí ẹ̀kọ́ aásìkí tàbí sí àpẹẹrẹ ẹ̀mí nìkan.
- issue: Ìtumọ̀ àwọn ọ̀rọ̀ ìbátan akọ àti abo
  choice: A ya ἀδελφοὺς àti ἀδελφὰς sọ́tọ̀ gẹ́gẹ́ bí “àwọn arákùnrin” àti “àwọn arábìnrin.”
  alternative: Kí a lo ọ̀rọ̀ àpapọ̀ kan fún gbogbo àwọn ará.
  rationale: Orísun Gíríìkì dárúkọ akọ àti abo lọ́tọ̀, nítorí náà a pa ìyàtọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìlànà gbólóhùn gẹ́gẹ́ bí apá ìdáhùn Jésù mọ́, torí ẹsẹ yìí bẹ̀rẹ̀ láàárín gbólóhùn kan.
