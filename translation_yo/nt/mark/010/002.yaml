  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: yo
  text: Wọ́n sì ń bi í bóyá ó bófin mu fún ọkùnrin láti kọ aya sílẹ̀[a], wọ́n ń dán an wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bóyá ó bófin mu fún ọkọ láti kọ aya rẹ̀ sílẹ̀.”
    reason: Àwọn ọ̀rọ̀ ἀνήρ àti γυνή lè jẹ́ “ọkọ” àti “aya rẹ̀” nínú àyíká ìgbéyàwó, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò lo arọ́pò-orúkọ ohun-ìní ní tààrà.
lexical_decisions:
- source_word: Καὶ
  choice: Sì
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá nínú ìtàn Yorùbá, láìfi ìtumọ̀ àkókò kún un.
- source_word: ἐπηρώτων
  choice: wọ́n ń bi í
  rationale: Àkókò imperfect fi hàn pé ìbéèrè náà ń lọ lọ́wọ́ tàbí pé wọ́n ń béèrè léraléra; “ń bi í” mú èyí jáde ní Yorùbá.
- source_word: ἔξεστιν
  choice: ó bófin mu
  rationale: Ọ̀rọ̀ náà ń béèrè nípa ohun tí òfin tàbí àṣà òfin fàyè gbà, kì í ṣe ohun tí ó ṣeé ṣe lásán.
- source_word: ἀνδρὶ
  choice: fún ọkùnrin
  rationale: ἀνήρ lè túmọ̀ sí “ọkùnrin” tàbí “ọkọ.” “Ọkùnrin” pa ìrísí gbogbogbò ti gbólóhùn Gíríìkì mọ́, nígbà tí àyíká ìkọ̀sílẹ̀ mú ìbáṣepọ̀ ìgbéyàwó yé kedere.
- source_word: γυναῖκα
  choice: aya
  rationale: Nínú àyíká ἀπολῦσαι, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán. Àìsí ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní nínú Gíríìkì ni a pa mọ́ nípasẹ̀ “aya” láìfi “rẹ̀” kún un.
- source_word: ἀπολῦσαι
  choice: láti kọ aya sílẹ̀
  rationale: Nínú ọ̀ràn ìgbéyàwó àti òfin yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ìgbéyàwó sílẹ̀ tàbí ìkọ̀sílẹ̀; gbólóhùn Yorùbá yìí ṣe kedere ju “rán lọ” lọ.
- source_word: πειράζοντες
  choice: wọ́n ń dán an wò
  rationale: Ó fi ìdánwò tàbí ìwádìí ọ̀nà àrékérekè hàn láìsọ ní pàtó pé wọ́n fẹ́ dẹkùn mú un, èyí tí yóò jẹ́ àlàyé tó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀνδρὶ nínú ìbéèrè òfin nípa ìgbéyàwó
  choice: fún ọkùnrin
  alternative: fún ọkọ
  rationale: “Ọkùnrin” pa fọ́ọ̀mù akọ ẹyọ kan àti agbára gbogbogbò inú Gíríìkì mọ́. “Ọkọ” tún ṣeé ṣe nítorí àyíká ìgbéyàwó, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Bóyá a ó fi ohun-ìní hàn pẹ̀lú γυναῖκα
  choice: aya
  alternative: aya rẹ̀
  rationale: Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní níbí. “Aya” pa àìsọ pàtó yẹn mọ́, ṣùgbọ́n “aya rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣeé gbà nítorí ìtumọ̀ ọ̀rọ̀ náà nínú àyíká.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. “Ó bófin mu” jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn lè lóye fún ìfàyègbà lábẹ́ òfin, “kọ aya sílẹ̀” sì jẹ́ ọ̀nà àdánidá láti sọ ìkọ̀sílẹ̀.
