review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the indefinite condition, rank sense of πρῶτος, future ἔσται, and the intensified force of δοῦλος as “ẹrú.” “Gbogbo ènìyàn” naturally communicates πάντων in this context. The initial καὶ is better represented as a clause-level connector (“Àti”) than by inserting sì within the conditional clause.
  naturalness: The revised wording is idiomatic Standard Yoruba and retains a clear, dignified biblical register. “Ẹrú gbogbo ènìyàn” is natural and preserves the deliberate contrast with “ìránṣẹ́” in the preceding verse.
  terminology: “Ẹrú” appropriately renders δοῦλος here, preserving the stronger term relative to διάκονος in Mark 10:43 without adding interpretive theological content. The footnote accurately supplies “ìránṣẹ́” as an alternative and explains the lexical contrast.
  issues:
  - severity: low
    issue: Placement of the connective καὶ
    rationale: The draft’s “tí ó bá sì fẹ́” is understandable, but placing sì inside the conditional can suggest an additional action (“also wants”). Clause-initial “Àti” represents the Greek connective more directly and reads more smoothly.
  revised_text: Àti ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ẹni àkọ́kọ́ láàárín yín yóò jẹ́ ẹrú gbogbo ènìyàn.[a]
