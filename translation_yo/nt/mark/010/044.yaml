  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: yo
  text: Àti ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ẹni àkọ́kọ́ láàárín yín yóò jẹ́ ẹrú gbogbo ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́ gbogbo ènìyàn.” Ọ̀rọ̀ Gíríìkì náà ni doulos, ìyẹn “ẹrú”; ó lágbára ju ọ̀rọ̀ tí a lò fún “ìránṣẹ́” ní ẹsẹ tó ṣáájú lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: Ẹnikẹ́ni tí ó bá fẹ́
  rationale: 'Àpapọ̀ ọ̀rọ̀ arọ́pò-orúkọ, ἄν àti ọ̀rọ̀-ìṣe abẹ́lẹ̀ ń sọ ipò gbogbogbò: ẹnikẹ́ni tí ó bá fẹ́.'
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Nínú ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí ipò ẹni nínú ẹgbẹ́ àwọn ọmọ-ẹ̀yìn, kì í ṣe ibi tí wọ́n wà lásán.
- source_word: πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Èyí pa ìtumọ̀ jíjẹ́ ẹni iwájú tàbí ẹni tó ga jù ní ipò mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἔσται
  choice: yóò jẹ́
  rationale: Èyí tú ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní tààràtà, láì yí i padà sí ‘gbọ́dọ̀ jẹ́,’ bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Jésù ní agbára ìtọ́ni.
- source_word: πάντων
  choice: gbogbo ènìyàn
  rationale: Èyí fi hàn pé ìrẹ̀lẹ̀ àti iṣẹ́ ìsìn náà kan gbogbo ènìyàn, kì í ṣe àwọn díẹ̀ nìkan.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ẹrú lágbára ju ìránṣẹ́ lọ, ó sì pa ìyàtọ̀ mọ́ láàárín δοῦλος ní ẹsẹ yìí àti διάκονος ní ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Bí a ṣe tú δοῦλος nínú ẹ̀kọ́ nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ọ̀rọ̀ náà ń dojú ìjà kọ ìfẹ́ ipò gíga nípa ìrẹ̀lẹ̀ tó jinlẹ̀. Nítorí ẹsẹ 43 lo διάκονος, lílo ‘ẹrú’ níbí pa ìmúná ìtumọ̀ δοῦλος àti ìyàtọ̀ ọ̀rọ̀ méjèèjì mọ́.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìṣètò ‘Ẹnikẹ́ni tí ó bá…’ jẹ́ àdánidá, ‘láàárín yín’ sì mú ọ̀rọ̀ ipò nínú ẹgbẹ́ náà jáde dáadáa.
