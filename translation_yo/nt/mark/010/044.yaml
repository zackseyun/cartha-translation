- from: Ẹnikẹ́ni tí ó bá sì fẹ́ jẹ́ ẹni àkọ́kọ́ láàárín yín yóò jẹ́ ẹrú gbogbo ènìyàn.[a]
  to: Àti ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ẹni àkọ́kọ́ láàárín yín yóò jẹ́ ẹrú gbogbo ènìyàn.[a]
  rationale: Moved the connective to the beginning of the clause as “Àti” for closer correspondence to καὶ and clearer Yoruba syntax. All other wording is retained because it faithfully preserves the source meaning, including the δοῦλος/διάκονος contrast.
