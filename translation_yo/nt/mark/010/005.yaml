source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Nítorí líle ọkàn yín[b] ni ó[a] fi kọ àṣẹ yìí fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹni tí “ó” ń tọ́ka sí ni Mósè, ẹni tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: cross_reference
  - marker: b
    text: Tàbí, “agídí ọkàn yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn nínú ìjíròrò náà, bí Jésù ṣe ń dáhùn sí ohun tí wọ́n sọ nípa Mósè.
- source_word: Πρὸς
  choice: Nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative níbí, πρός tọ́ka sí ìdí tàbí ohun tí a dáhùn sí; “Nítorí” sọ ìtumọ̀ ìdí náà ní Yorùbá àdánidá.
- source_word: σκληροκαρδίαν
  choice: líle ọkàn
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún agídí àti àìgbọ́ràn inú.
- source_word: ἔγραψεν
  choice: ó ṣe kọ
  rationale: A pa ẹni kẹta ẹyọ tí kò dárúkọ mọ́, gẹ́gẹ́ bí Gíríìkì; Mósè ni ó ń tọ́ka sí láti ẹsẹ tó ṣáájú.
- source_word: ἐντολήν
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìlànà aláṣẹ tàbí òfin tí a pàṣẹ, ó sì bá àyíká òfin Mósè mu.
- source_word: ταύτην
  choice: yìí
  rationale: Ó tọ́ka sí àṣẹ pàtó tí wọ́n ń jíròrò, láìfi ìtẹnumọ́ míì kún un.
theological_decisions:
- issue: Bóyá kí a dárúkọ Mósè ní gbangba gẹ́gẹ́ bí ẹni tó kọ àṣẹ náà
  choice: A lo “ó,” kí a má bàa tún “Mósè” ṣe nínú ẹsẹ yìí
  alternative: “Mósè kọ àṣẹ yìí fún yín”
  rationale: Gíríìkì kò tún Mósè dárúkọ nínú ẹsẹ yìí; ẹni tí “ó” ń tọ́ka sí ṣe kedere láti ẹsẹ tó ṣáájú, èyí sì pa ìṣàn ọ̀rọ̀ orísun mọ́.
- issue: Bí a ṣe máa túmọ̀ σκληροκαρδία láìdín agbára àwòrán Bíbélì rẹ̀ kù
  choice: “líle ọkàn”
  alternative: “agídí ọkàn” tàbí “agídí”
  rationale: “Líle ọkàn” pa àwòrán ọkàn líle àti ìwà àìgbọ́ràn mọ́, láìfi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “líle ọkàn” láti pa àwòrán orísun mọ́; a lo “àṣẹ” dípò ọ̀rọ̀ àjèjì tàbí gbólóhùn tó wuwo. Àwọn àmì ìró ni a fi sí ibi tí ó yẹ.
