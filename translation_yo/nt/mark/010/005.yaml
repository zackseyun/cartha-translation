  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì: δὲ jẹ́ ìyàtọ̀ rọrùn, Πρὸς τὴν σκληροκαρδίαν jẹ́ ìdí, ẹni tó kọ́ náà sì jẹ́ ẹni kẹta ẹyọ tí a kò dárúkọ, tí ó ń tọ́ka sí Mósè nínú ẹsẹ tó ṣáájú. Àmọ́, “ni ó ṣe kọ” lè dà bí ìtẹnumọ́ pé ó ‘ṣe’ kọ́; “ni ó fi kọ” ni Yorùbá tó péye jù fún ìdí tí ohun kan fi ṣẹlẹ̀.'
