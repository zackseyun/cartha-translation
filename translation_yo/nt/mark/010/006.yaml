  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: yo
  text: Ṣùgbọ́n láti ìbẹ̀rẹ̀ ìṣẹ̀dá, ó ṣe wọ́n ní akọ àti abo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dá wọ́n ní akọ àti abo.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní tààrà sí “ṣe,” ṣùgbọ́n “dá” lè fi àyíká ìṣẹ̀dá inú Jẹ́nẹ́sísì hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Akọ àti abo ni ó ṣe wọ́n.” Èyí tẹ̀ lé ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Ṣùgbọ́n láti ìbẹ̀rẹ̀ ìṣẹ̀dá
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ọ̀rọ̀ ìṣáájú hàn; “láti ìbẹ̀rẹ̀ ìṣẹ̀dá” sì pa ìtumọ̀ ibi ìbẹ̀rẹ̀ nínú àkókò mọ́.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ní akọ àti abo
  rationale: “Akọ àti abo” ṣètọ́jú ìsọ̀rí ìbálòpọ̀ ẹ̀dá inú àyọlò Jẹ́nẹ́sísì, láìyí i sí ọkùnrin àti obìnrin.
- source_word: ἐποίησεν
  choice: ó dá
  rationale: Nínú Yorùbá, “dá” jẹ́ ọ̀rọ̀ àdánidá fún bí Ọlọ́run ṣe ṣe ẹ̀dá, ó sì bá àyíká Jẹ́nẹ́sísì mu; àlàyé ìsàlẹ̀ fi hàn pé ìtumọ̀ gígùn-gígùn ti ọ̀rọ̀ Gíríìkì ni “ṣe.”
- source_word: αὐτούς
  choice: wọn
  rationale: “Wọn” tọ́ka sí àwọn ènìyàn tí a sọ pé akọ àti abo ni wọ́n, láìfi ìtẹnumọ́ “àwọn méjèèjì” kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn ọ̀rọ̀ ìbálòpọ̀ ẹ̀dá nínú àyọlò Jẹ́nẹ́sísì
  choice: akọ àti abo
  alternative: ọkùnrin àti obìnrin
  rationale: Yíyan “akọ àti abo” pa ìtumọ̀ ẹ̀dá àti ìbálòpọ̀ inú ἄρσεν καὶ θῆλυ mọ́, láìṣí i sí àwọn ipa àwùjọ.
- issue: Olùṣe tí kò fara hàn gẹ́gẹ́ bí ọ̀rọ̀-orúkọ nínú Gíríìkì
  choice: ó dá wọn
  alternative: Ọlọ́run dá wọn
  rationale: Gíríìkì ní ọ̀rọ̀-ìṣe ẹni-kẹta ẹyọ ṣùgbọ́n kò dárúkọ Ọlọ́run ní ẹsẹ yìí. “Ó” pa ìrísí yẹn mọ́, nígbà tí àyíká ọ̀rọ̀ ń mú ẹni tí a ń tọ́ka sí yé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ní akọ àti abo” gẹ́gẹ́ bí ọ̀nà Yorùbá tó ṣe àdánidá ju “gẹ́gẹ́ bí akọ àti abo” lọ.
