id: MRK.10.32
reference: Mark 10:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: yo
  text: Wọ́n wà lójú ọ̀nà[a], wọ́n ń gòkè lọ sí Jerúsálẹ́mù. Jésù sì ń lọ níwájú wọn[b]; ẹnu sì yà wọ́n, àwọn tó ń tẹ̀ lé sì ń bẹ̀rù. Ó tún mú Àwọn Méjìlá náà sọ́tọ̀, ó sì bẹ̀rẹ̀ sí í sọ àwọn ohun tí yóò ṣẹlẹ̀ sí i fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀nà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ń ṣáájú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: lójú ọ̀nà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwà ní ojú ọ̀nà ìrìn-àjò, ó sì pa àwòrán gidi ti ìrìn náà mọ́.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: wọ́n ń gòkè lọ sí Jerúsálẹ́mù
  rationale: “Gòkè lọ” fi ìrìn sí ibi gíga àti ọ̀nà ìsìn lọ sí Jerúsálẹ́mù hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: προάγων αὐτούς
  choice: ń lọ níwájú wọn
  rationale: Ó sọ ipò Jésù níwájú ẹgbẹ́ náà ní tààrà, láì túmọ̀ rẹ̀ sí pé ó ń darí wọn ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: ἐθαμβοῦντο
  choice: ẹnu sì yà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàlẹ́nu tó lágbára, láì sọ ọ́ di ẹ̀rù tàbí ìpayà.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: ṣùgbọ́n àwọn tó ń bọ̀ lẹ́yìn
  rationale: Ó pa ẹgbẹ́ àwọn tó ń tẹ̀ lé mọ́ láì fi ẹni tí wọ́n ń tẹ̀ lé kún ọ̀rọ̀ Gíríìkì tí kò sọ ọ́ ní pàtó.
- source_word: ἐφοβοῦντο
  choice: ń bẹ̀rù
  rationale: Ó túmọ̀ ìmọ̀lára ẹ̀rù náà ní tààrà, ó sì fi ìṣe tó ń bá a lọ hàn.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: mú Àwọn Méjìlá náà sọ́tọ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, Jésù ya Àwọn Méjìlá sọ́tọ̀ fún ìkọ́ni àdáni; gbolohun náà sì jẹ́ èdè Yorùbá tó rọrùn.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù ṣe ìṣe yìí lẹ́ẹ̀kan sí i.
- source_word: ἤρξατο ... λέγειν
  choice: bẹ̀rẹ̀ sí í sọ ... fún wọn
  rationale: Èyí pa ìbẹ̀rẹ̀ ìṣe náà mọ́, ó sì bá ìlò Yorùbá mu nígbà tí a bá ń sọ ohun kan fún ẹnì kan.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: àwọn ohun tí yóò ṣẹlẹ̀ sí i
  rationale: Ó fi àwọn ìṣẹ̀lẹ̀ tó ń bọ̀ tí yóò kan Jésù hàn, láì fi èrò àyànmọ́ tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọlé.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ìmọ̀lára àwọn ẹgbẹ́ méjèèjì
  choice: Túmọ̀ ἐθαμβοῦντο sí “ẹnu yà wọ́n,” kí a sì túmọ̀ ἐφοβοῦντο sí “ń bẹ̀rù.”
  alternative: Kí a sọ ìhùwàsí ẹgbẹ́ méjèèjì lápapọ̀ gẹ́gẹ́ bí ìyàlẹ́nu tàbí ẹ̀rù.
  rationale: Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀-ìṣe méjì tó yàtọ̀, ó sì dà bí ẹni pé ó mọ̀ọ́mọ̀ ya ìyàlẹ́nu ẹgbẹ́ àkọ́kọ́ sí ẹ̀rù àwọn tó ń bọ̀ lẹ́yìn. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ ìtàn yìí mọ́ láì da àwọn ìmọ̀lára náà pọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ; ó jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A so àmì [b] mọ́ gbolohun “ń lọ níwájú wọn,” nítorí ibẹ̀ ni àṣàyàn ọ̀rọ̀ náà ti wá nínú προάγων αὐτούς.
