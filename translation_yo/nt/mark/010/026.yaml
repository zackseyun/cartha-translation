  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: yo
  text: Ẹnu sì yà wọ́n gidigidi, wọ́n ń sọ fún ara wọn pé, “Ǹjẹ́ ta ni ó lè là?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ẹnu sì yà wọ́n
  rationale: δέ ń tẹ ìtàn náà síwájú, ó sì tún lè fi ìyàtọ̀ hàn; “sì” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá, ẹni tí “wọ́n” ń tọ́ka sí sì ṣe kedere láti inú àyíká ọ̀rọ̀.
- source_word: περισσῶς
  choice: gidigidi
  rationale: Ọ̀rọ̀ yìí ń fi agbára kún ìyàlẹ́nu wọn; “gidigidi” jẹ́ Yorùbá òde òní tí ó lágbára, tí ó sì ṣe kedere.
- source_word: ἐξεπλήσσοντο
  choice: Ẹnu ... yà wọ́n
  rationale: Àpólà Yorùbá “ẹnu yà wọ́n” ń sọ ìyàlẹ́nu lílágbára lọ́nà àdánidá; ìṣe tí ó ń lọ lọ́wọ́ nínú imperfect náà tún fara hàn nínú “wọ́n ń sọ” tí ó tẹ̀ lé e.
- source_word: λέγοντες
  choice: wọ́n ń sọ
  rationale: “ń sọ” fi hàn pé ọ̀rọ̀ wọn ń bá ìyàlẹ́nu náà lọ ní àkókò kan náà.
- source_word: πρὸς ἑαυτούς
  choice: fún ara wọn
  rationale: Ní àwùjọ ọ̀pọ̀ ènìyàn tí wọ́n ń bá ara wọn sọ̀rọ̀, àpólà náà lè túmọ̀ sí “fún ara wọn” tàbí “láàárín ara wọn”; ìtumọ̀ yìí pa àìdánilójú díẹ̀ tí ó wà nínú Gíríìkì mọ́ láìfi “sí ara wọn lọ́kọ̀ọ̀kan” múlẹ̀.
- source_word: Καὶ
  choice: Ǹjẹ́
  rationale: Níbi yìí καί ń gbé ìbéèrè tí ó jẹ́ àbájáde ọ̀rọ̀ Jésù kalẹ̀; “Ǹjẹ́” ṣe iṣẹ́ yẹn lọ́nà Yorùbá tí ó bójú mu.
- source_word: τίς
  choice: ta ni
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún ẹni tí a kò mọ̀, tí ó sì pa ìtẹnumọ́ ìbéèrè Gíríìkì mọ́.
- source_word: δύναται
  choice: ó lè
  rationale: “lè” ń sọ agbára tàbí ṣíṣeéṣe ní kedere, gẹ́gẹ́ bí δύναται.
- source_word: σωθῆναι
  choice: là
  rationale: Nínú àyíká ọ̀rọ̀ nípa wíwọ ìjọba Ọlọ́run, “là” ní ìtumọ̀ ìgbàlà, kì í ṣe ìdásílẹ̀ kúrò nínú ewu ti ara nìkan; ó tún jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ passive “be saved.”
theological_decisions:
- issue: Ìtumọ̀ èdè ìgbàlà nínú àyíká ọ̀rọ̀
  choice: “là” ń tọ́ka sí rírí ìgbàlà Ọlọ́run àti wíwọ ìjọba rẹ̀.
  alternative: “gbà sílẹ̀” tàbí “yọ kúrò nínú ewu”
  rationale: Àyíká ọ̀rọ̀ nípa wíwọ ìjọba Ọlọ́run béèrè pé kí σωθῆναι ní ìwọ̀n ẹ̀kọ́ ìgbàlà rẹ̀, láìdín in kù sí ìgbàlà kúrò nínú ewu ayé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo “Ẹnu yà wọ́n gidigidi” gẹ́gẹ́ bí àpólà Yorùbá àdánidá fún ìyàlẹ́nu lílágbára.
