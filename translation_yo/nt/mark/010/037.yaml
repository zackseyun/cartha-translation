source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Jẹ́ kí ọ̀kan nínú wa jókòó ní ọwọ́ ọ̀tún rẹ, kí ọ̀kan nínú wa sì jókòó ní ọwọ́ òsì rẹ, nínú ògo rẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Jọ̀wọ́ fún wa láyè pé kí
  rationale: Ó mú ìbéèrè náà jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘fún wa pé kí’ mọ́ láì fi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: εἷς ... καὶ εἷς
  choice: ọ̀kan nínú wa ... èkejì
  rationale: Àwọn olùsọ̀rọ̀ méjì ni àyíká ọ̀rọ̀ náà ń tọ́ka sí; ‘ọ̀kan nínú wa ... èkejì’ ṣe kedere ní Yorùbá, gẹ́gẹ́ bí ìtumọ̀ gbólóhùn náà.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: ní ọwọ́ ọ̀tún rẹ ... ní ọwọ́ òsì rẹ
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ipò ní ẹ̀gbẹ́ ọ̀tún àti ẹ̀gbẹ́ òsì ẹni, pẹ̀lú ìtumọ̀ ipò ọlá tó wà nínú àyíká.
- source_word: ἐν τῇ δόξῃ σου
  choice: nínú ògo rẹ
  rationale: Ó pa àwòrán àti àìmọ̀ pàtó ti ‘ògo rẹ’ mọ́, láì túmọ̀ rẹ̀ sí ìjọba tàbí ìṣẹ́gun nìkan.
theological_decisions:
- issue: Ìtumọ̀ ‘nínú ògo rẹ’
  choice: nínú ògo rẹ
  alternative: nígbà tí o bá dé inú ìjọba ológo rẹ
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘ògo’ ní tààrà, kò sì sọ ‘ìjọba’ nínú ẹsẹ yìí; nítorí náà a pa ìfọ̀rọ̀wérọ̀ àti ìfẹ̀hónúhàn ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò.
