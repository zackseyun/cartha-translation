reference: Mark 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: yo
  text: 'Jésù sì tẹjú mọ́ ọn, ó nífẹ̀ẹ́ rẹ̀, ó sì sọ fún un pé, “Ohun kan ni o ṣì ṣe aláìní: lọ, ta gbogbo ohun tí o ní[a], kí o sì fi fún àwọn òtòṣì, ìwọ yóò sì ní ìṣúra ní ọ̀run; wá, tẹ̀lé mi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “ohunkóhun tí o ní.” Ọ̀rọ̀ Gíríìkì ὅσα ἔχεις lè túmọ̀ sí “ohunkóhun tí o ní” tàbí “gbogbo ohun tí o ní”; àyíká ọ̀rọ̀ fi hàn pé gbogbo ohun-ìní rẹ̀ ni ó wà ní àfojúsùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: tẹjú mọ́ ọn
  rationale: Ó fi ìwò tí ó darí taara sí ọkùnrin náà hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá láì fi agbára tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἠγάπησεν αὐτόν
  choice: ó nífẹ̀ẹ́ rẹ̀
  rationale: Èyí túmọ̀ ìfẹ́ Jésù ní tààrà, láì sọ ọ́ di inú rere lásán tàbí fi ìtumọ̀ ẹ̀kọ́ ìsìn pàtó lé e lórí.
- source_word: Ἕν σε ὑστερεῖ
  choice: Ohun kan ni ó kù fún ọ
  rationale: Neuter Ἕν ń tọ́ka sí ‘ohun kan’; gbolohun Yorùbá yìí sọ àìní rẹ̀ ní ọ̀nà àdánidá, bó tilẹ̀ jẹ́ pé ‘ohun kan ni o ṣì ṣe aláìní’ tún ṣeé ṣe.
- source_word: ὅσα ἔχεις
  choice: gbogbo ohun tí o ní
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘ohunkóhun tí o ní’ tàbí ‘gbogbo ohun tí o ní’; àyíká ọ̀rọ̀ fi hàn pé gbogbo ohun-ìní rẹ̀ ni àṣẹ náà kàn.
- source_word: πώλησον
  choice: ta
  rationale: Ó jẹ́ àṣẹ tààrà láti ta ohun-ìní.
- source_word: δὸς τοῖς πτωχοῖς
  choice: fún àwọn òtòṣì
  rationale: πτωχοῖς ń tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ òtòṣì, kì í ṣe àìní ní gbogbogbòò nìkan.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: ìṣúra ní ọ̀run
  rationale: Èyí pa àwòrán ìṣúra àti ibi tí ó wà mọ́ ní ọ̀nà Yorùbá tí ó mọ́gbọ́n dání.
- source_word: δεῦρο
  choice: lẹ́yìn náà, wá
  rationale: ‘Wá’ ni ìtumọ̀ àṣẹ náà; ‘lẹ́yìn náà’ mú ìtẹ̀lé àwọn àṣẹ náà ṣe kedere láì yí ìtumọ̀ padà.
- source_word: ἀκολούθει μοι
  choice: máa tọ̀ mí lẹ́yìn
  rationale: Present imperative lè ní agbára ìtẹ̀síwájú; ‘máa tọ̀ mí lẹ́yìn’ mú ìpè sí ọmọ-ẹ̀yìn tí ń bá a lọ hàn.
theological_decisions:
- issue: Ìtumọ̀ ìfẹ́ Jésù sí ọkùnrin náà
  choice: ó nífẹ̀ẹ́ rẹ̀
  alternative: ó fi inú rere hàn sí i; tàbí ìfẹ́ àyànfẹ́ ní ìtumọ̀ ẹ̀kọ́ ìsìn pàtó
  rationale: Ọ̀rọ̀ náà sọ ìfẹ́ gidi ní kedere. A kò dín in kù sí ìwà rere lásán, bẹ́ẹ̀ ni a kò fi ètò ẹ̀kọ́ ìsìn tí ó kọjá ẹsẹ̀ náà lé e lórí.
- issue: Bí àṣẹ nípa ohun-ìní ṣe gbòòrò tó
  choice: ta gbogbo ohun tí o ní
  alternative: ta ohunkóhun tí o ní; tàbí kí a rọ ọ́ sí ìwà ọ̀làwọ́ lásán
  rationale: ὅσα ἔχεις ní àyíká yìí kàn gbogbo ohun-ìní ọkùnrin náà. Ìtumọ̀ náà pa agbára àṣẹ náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn ọ̀rọ̀ Gíríìkì hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘tẹjú mọ́ ọn’ fún ìwò pẹ̀lú àkíyèsí, ‘àwọn òtòṣì’ fún ẹ̀ka àwọn ènìyàn náà, àti ‘máa tọ̀ mí lẹ́yìn’ láti fi ìpè sí ìtẹ̀lé tí ń bá a lọ hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
