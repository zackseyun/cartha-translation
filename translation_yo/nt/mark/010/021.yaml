revisions:
- from: 'Jésù sì tẹjú mọ́ ọn, ó nífẹ̀ẹ́ rẹ̀, ó sì sọ fún un pé, “Ohun kan ni ó kù fún ọ: lọ, ta gbogbo ohun tí o ní[a], kí o sì fún àwọn òtòṣì, ìwọ yóò sì ní ìṣúra ní ọ̀run; lẹ́yìn náà, wá, máa tọ̀ mí lẹ́yìn.”'
  to: 'Jésù sì tẹjú mọ́ ọn, ó nífẹ̀ẹ́ rẹ̀, ó sì sọ fún un pé, “Ohun kan ni o ṣì ṣe aláìní: lọ, ta gbogbo ohun tí o ní[a], kí o sì fi fún àwọn òtòṣì, ìwọ yóò sì ní ìṣúra ní ọ̀run; wá, tẹ̀lé mi.”'
  rationale: Àtúnṣe náà mú ìtumọ̀ Yorùbá sún mọ́ Gíríìkì láì sọ ìtumọ̀ rẹ̀ di dídín tàbí dídá ẹ̀kọ́ ìsìn kan lé e lórí. ‘Ohun kan ni o ṣì ṣe aláìní’ sọ Ἕν σε ὑστερεῖ ní kedere. ‘Fi fún àwọn òtòṣì’ mú ohun tí a fi ń fún hàn. A yọ ‘lẹ́yìn náà’ kúrò nítorí kò sí nínú orísun, a sì lo ‘tẹ̀lé mi’ gẹ́gẹ́ bí ìtumọ̀ àdánidá, tó pé fún ἀκολούθει μοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:42:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: Jésù wo ọkùnrin náà, ó nífẹ̀ẹ́ rẹ̀, ó sọ àìní kan rẹ̀, ó sì pa àṣẹ nípa títà ohun-ìní, fífún àwọn òtòṣì, ìṣúra ní ọ̀run, àti títẹ̀lé e mọ́. Ṣùgbọ́n a nílò àtúnṣe kékeré kí ìṣe ‘fún àwọn òtòṣì’ lè ní ohun tí a fi ń fún hàn, àti kí a má fi ‘lẹ́yìn náà’ tí kò sí nínú Gíríìkì kún un.'
  naturalness: ‘Fi fún àwọn òtòṣì’ jẹ́ Yorùbá tí ó pé ju ‘fún àwọn òtòṣì’ lọ nínú àyíká yìí, nítorí ó tọ́ka kedere sí ohun tí a tà. ‘Wá, tẹ̀lé mi’ jẹ́ ìpè sí ọmọ-ẹ̀yìn tó rọrùn, tó sì dáa ní Yorùbá ìgbàlódé; kò nílò afikun ‘lẹ́yìn náà’ tàbí ‘máa’ láti gbé ìtumọ̀ àṣẹ Gíríìkì náà.
  terminology: ‘nífẹ̀ẹ́’, ‘àwọn òtòṣì’, ‘ìṣúra ní ọ̀run’, àti ‘tẹ̀lé mi’ jẹ́ àwọn ọ̀rọ̀ tó pé, tó wọ́pọ̀, tí wọ́n sì bá ìforúkọsílẹ̀ ìwé mímọ́ mu. Àmì [a] àti àlàyé rẹ̀ dá ìyàtọ̀ ìtumọ̀ ὅσα ἔχεις mọ́ ní kedere.
  issues:
  - severity: medium
    issue: ‘kí o sì fún àwọn òtòṣì’ kò sọ ohun tí a fi ń fún.
    rationale: δὸς τοῖς πτωχοῖς ní àyíká yìí túmọ̀ sí kí ó fi èrè tàbí ohun-ìní tí ó ti tà fún àwọn òtòṣì. Ní Yorùbá, ‘fi fún àwọn òtòṣì’ sọ ìbáṣepọ̀ náà ní kedere, láì fi ohun tuntun kún ìtumọ̀.
  - severity: low
    issue: ‘lẹ́yìn náà’ jẹ́ ìfikún ìtẹ̀lé-ìṣẹ̀lẹ̀.
    rationale: δεῦρο jẹ́ ‘wá’; bí ó tilẹ̀ jẹ́ pé àwọn àṣẹ náà ń tẹ̀lé ara wọn, Gíríìkì kò ní ọ̀rọ̀ kan tó dọ́gba pẹ̀lú ‘lẹ́yìn náà’. Yíyọ ọ́ kúrò pa ìṣọ̀kan pẹ̀lú orísun mọ́.
  - severity: low
    issue: ‘máa tọ̀ mí lẹ́yìn’ lè ní ìrísí ìlépa ẹni kan dípò ìpè ìjẹ́ ọmọ-ẹ̀yìn.
    rationale: ‘Tẹ̀lé mi’ jẹ́ ọ̀nà Yorùbá tó hàn gedegbe, tó sì wọ́pọ̀ fún ἀκολούθει μοι; ó fi ìpè Jésù hàn láì ṣàfikún ààmì ìtẹ̀síwájú tí fọ́ọ̀mù àṣẹ Gíríìkì kò béèrè pé kí a sọ ní pàtó.
