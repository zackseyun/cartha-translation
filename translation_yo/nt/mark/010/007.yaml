  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: yo
  text: Nítorí èyí, ọkùnrin yóò fi baba àti ìyá rẹ̀ sílẹ̀, yóò sì dàpọ̀ mọ́ aya rẹ̀,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò sì faramọ́ aya rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnumọ́ ìfararọ̀ tímọ́tímọ́.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé ọwọ́ Gíríìkì kan kò ní, “yóò sì dàpọ̀ mọ́ aya rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Nítorí ìdí èyí
  rationale: Ó jẹ́ gbólóhùn ìdí tí ó ń ṣàlàyé ìdí ọ̀rọ̀ tó tẹ̀ lé e; ó bójú mu èrò ‘nítorí èyí’ ní Yorùbá ọ̀wọ̀.
- source_word: καταλείψει
  choice: yóò fi ... sílẹ̀
  rationale: Ọ̀rọ̀ ọjọ́ iwájú ni, ó sì túmọ̀ sí fífi ilé òbí sílẹ̀; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá láìfi èrò ikọ̀sílẹ̀ tàbí ìkọ̀ silẹ̀ pátápátá kún un.
- source_word: ἄνθρωπος
  choice: ọkùnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ènìyàn lápapọ̀, àyíká ìgbéyàwó àti ‘aya rẹ̀’ fi hàn pé akọ ni a ń tọ́ka sí níbí.
- source_word: πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: baba àti ìyá rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ‘baba rẹ̀ àti ìyá rẹ̀’; fífi arọ́pò-orúkọ náà sí òpin kan àwọn méjèèjì.
- source_word: προσκολληθήσεται
  choice: yóò sì so mọ́
  rationale: Ó pa èrò ìsomọ́ra tímọ́tímọ́ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìbáṣepọ̀ ìgbéyàwó. Àlàyé ìsàlẹ̀ fi àṣàyàn tó tẹnumọ́ ìdìmọ́ra hàn.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: Nínú àyíká yìí, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tó dúró fún ẹni inú ìgbéyàwó nínú àyọlò Gẹnẹsisi
  choice: ọkùnrin ... aya rẹ̀
  alternative: ènìyàn ... ọkọ tàbí aya rẹ̀
  rationale: Àyíká náà sọ ní pàtó nípa akọ àti aya rẹ̀; a kò sọ ọ́ di ọ̀rọ̀ tí kò fi akọ tàbí abo hàn, kí ìṣètò àyọlò náà má bàa yí padà.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘So mọ́’ pa àwòrán ìsomọ́ra mọ́ láìdá ẹ̀kọ́ ẹ̀sìn àfikún sí i.
