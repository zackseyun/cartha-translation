  to: Bí ó sì ti ń jáde lọ sí ojú ọ̀nà[a], ọkùnrin kan sáré lọ sọ́dọ̀ rẹ̀, ó kúnlẹ̀ níwájú rẹ̀, ó sì béèrè lọ́wọ́ rẹ̀ pé, “Olùkọ́ rere, kí ni èmi gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?”
