id: MRK.10.17
reference: Mark 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: yo
  text: Bí ó sì ti ń jáde lọ sí ojú ọ̀nà[a], ọkùnrin kan sáré lọ sọ́dọ̀ rẹ̀, ó kúnlẹ̀ níwájú rẹ̀, ó sì béèrè lọ́wọ́ rẹ̀ pé, “Olùkọ́ rere, kí ni èmi gbọdọ̀ ṣe kí n lè jogún ìyè àìnípẹ̀kun?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó ti ń gbéra láti rìn ìrìnàjò.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí jíjáde sí ojú ọ̀nà tàbí bíbẹ̀rẹ̀ ìrìnàjò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: bí ó ti ń jáde lọ sí ojú ọ̀nà
  rationale: Ó fi ìṣe abẹ́lẹ̀ tí ó ń ṣẹlẹ̀ ní àkókò kan náà hàn, ó sì pa ìṣípòpadà sí ojú ọ̀nà mọ́; àlàyé ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: προσδραμὼν
  choice: sáré tọ̀ ọ́ wá
  rationale: Ó mú ìyára àti ìtara ọkùnrin náà hàn ní Yorùbá àdánidá.
- source_word: εἷς
  choice: ọkùnrin kan
  rationale: Ìrísí akọ ẹyọ kan àti àyíká ìtàn náà ṣe àtìlẹ́yìn fún ‘ọkùnrin kan.’
- source_word: γονυπετήσας αὐτόν
  choice: ó kúnlẹ̀ níwájú rẹ̀
  rationale: Ó sọ ìdúró ìbọ̀wọ̀ tàbí ẹ̀bẹ̀ náà ní kedere láìfi agbára ìṣe tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐπηρώτα αὐτόν
  choice: ó béèrè lọ́wọ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè tààrà, bí ó tilẹ̀ jẹ́ pé imperfect Gíríìkì lè tẹnu mọ́ ìṣe tí ń lọ lọ́wọ́.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Olùkọ́ rere
  rationale: ‘Olùkọ́’ bá διδάσκαλος mu, ‘rere’ sì pa àpèjúwe ἀγαθέ mọ́ fún ìjíròrò ẹsẹ tó tẹ̀ lé.
- source_word: τί ποιήσω
  choice: kí ni èmi gbọdọ̀ ṣe
  rationale: ‘Gbọdọ̀’ mú agbára ìbéèrè nípa ohun tí a béèrè pé kí ó ṣe jáde ní Yorùbá òde òní.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó so ìṣe tí ọkùnrin náà ń wá láti ṣe pọ̀ mọ́ ète tàbí àbájáde tí ó ń fẹ́.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó sì pa ìtumọ̀ iye tí kò ní òpin mọ́.
- source_word: κληρονομήσω
  choice: jogún
  rationale: ‘Jogún’ pa àwòrán gbígba ohun bí ogún mọ́, dípò ṣíṣe e ní ‘rí’ tàbí ‘gba’ lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ tí ọkùnrin náà fi pe Jésù
  choice: Olùkọ́ rere
  alternative: Ọ̀gá rere
  rationale: Gíríìkì ní διδάσκαλε, kì í ṣe κύριε; ‘Olùkọ́’ kò fi oyè ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kún un, ó sì pa ìjẹ́pàtàkì ‘rere’ mọ́.
- issue: Ìfihàn akọ nínú εἷς
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Ìrísí akọ ẹyọ kan àti àyíká ìtàn náà ṣe àtìlẹ́yìn fún ọ̀rọ̀ akọ ní pàtó, láìsọ ọ́ di ọ̀rọ̀ gbogbogbò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘rẹ̀’ fún Jésù gẹ́gẹ́ bí àṣà gírámà Yorùbá, láìfi ìtumọ̀ àìbọ̀wọ̀ kún un.
