  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Olùkọ́, gbogbo nǹkan wọ̀nyí ni mo ti pa mọ́ láti ìgbà èwe mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: wí
  rationale: Ọ̀rọ̀ ìtàn lasán ni ἔφη níbí; “wí” jẹ́ ọ̀nà Yorùbá tó bójú mu, tó sì ní iyì fún fífi ọ̀rọ̀ ẹni hàn.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí ń kọ́ni; “Olùkọ́” pa ìtumọ̀ rẹ̀ mọ́ láì fi èrò àṣẹ tó ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Àṣàyàn yìí ṣàfihàn demonstrative àti πᾶς ní kíkún, ó sì ń tọ́ka sí àwọn àṣẹ tí a ṣẹ̀ṣẹ̀ dárúkọ.
- source_word: ἐφυλαξάμην
  choice: ni mo ti pa mọ́
  rationale: Nínú ọ̀rọ̀ nípa àwọn àṣẹ, φυλάσσω túmọ̀ sí pípa tàbí ṣíṣọ́ wọn mọ́. “Mo ti pa mọ́” ṣàkójọpọ̀ ìwà rẹ̀ láti ìgbà èwe títí dé àsìkò ọ̀rọ̀ náà.
- source_word: ἐκ νεότητός μου
  choice: láti ìgbà èwe mi
  rationale: ἐκ pẹ̀lú genitive àsìkò ń fi ibi tí àsìkò ti bẹ̀rẹ̀ hàn; “láti ìgbà èwe mi” jẹ́ Yorùbá àdánidá, kò sì sọ ọ́ di ìgbà ọmọdé kékeré ju bí orísun ṣe sọ lọ.
- source_word: ὁ δὲ
  choice: Ó sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò ní ìtakora líle níbí; “sì” ń mú ìtàn náà tẹ̀ síwájú lọ́nà àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo “pa mọ́” fún pípa àwọn àṣẹ mọ́, gẹ́gẹ́ bí ìlò Yorùbá tó wọ́pọ̀ nínú àyíká yìí.
