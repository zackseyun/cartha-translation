  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: yo
  text: Wọ́n bẹ̀rẹ̀ sí í banújẹ́, wọ́n sì bẹ̀rẹ̀ sí í sọ fún un lọ́kọ̀ọ̀kan pé, “Èmi kọ́, àbí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ sí i, “Kì í ṣe èmi, àbí?” Ọ̀rọ̀ Gíríìkì μήτι fi hàn pé ìbéèrè náà ń retí ìdáhùn òdì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Wọ́n bẹ̀rẹ̀ sí í
  rationale: Ó fi ìbẹ̀rẹ̀ ìbànújẹ́ àti ọ̀rọ̀ wọn hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: λυπεῖσθαι
  choice: banújẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ìbànújẹ́ mú wọn; ‘banújẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá ipò ọ̀wọ̀ àti ìbànújẹ́ inú ẹsẹ̀ náà mu.
- source_word: καὶ λέγειν
  choice: wọ́n sì ń sọ
  rationale: A pa ìtumọ̀ gbogbogbò ti λέγω mọ́ gẹ́gẹ́ bí ‘sọ,’ dípò yíyí i sí ọ̀rọ̀ tó túmọ̀ sí ‘béèrè’ nìkan.
- source_word: αὐτῷ
  choice: fún un
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́, láì fi orúkọ Jésù kún un níbi tí orísun kò ti ṣe bẹ́ẹ̀.
- source_word: εἷς κατὰ εἷς
  choice: lọ́kọ̀ọ̀kan
  rationale: Ó fi hàn pé ẹnì kọ̀ọ̀kan sọ ọ́ ní tirẹ̀, ọ̀kan tẹ̀ lé òmíràn.
- source_word: Μήτι ἐγώ;
  choice: Èmi kọ́, àbí?
  rationale: Ìbéèrè Yorùbá yìí jẹ́ àdánidá, ó sì pa ìrètí pé ìdáhùn yóò jẹ́ ‘rárá’ mọ́, bí μήτι ṣe ń tọ́ka sí.
theological_decisions:
- issue: Agbára ìbéèrè àwọn ọmọ-ẹ̀yìn
  choice: “Èmi kọ́, àbí?”—ìbéèrè tó ń retí ìdáhùn òdì
  alternative: “Ṣé èmi ni?”
  rationale: μήτι ń tọ́ka sí pé olùsọ retí pé ìdáhùn yóò jẹ́ ‘rárá.’ “Ṣé èmi ni?” lè mú ìtumọ̀ yẹn di aláìmọ́, nítorí náà a lo ọ̀rọ̀ tó fi ìpayà tàbí àtakò inú wọn hàn láì pinnu ohun tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. “Lọ́kọ̀ọ̀kan” pa ìtẹ̀lé ẹnì kọ̀ọ̀kan mọ́; “Èmi kọ́, àbí?” sì jẹ́ ọ̀nà àdánidá láti fi ìbéèrè tó ń retí ‘rárá’ hàn.
