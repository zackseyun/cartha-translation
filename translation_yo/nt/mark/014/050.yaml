  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: yo
  text: Gbogbo wọn sì fi í sílẹ̀, wọ́n sì sá lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ìṣe yìí mọ́ ìṣẹ̀lẹ̀ ìmú Jésù tó ṣáájú, láìfi ìtumọ̀ àkókò tàbí ìyọrísí kún un.
- source_word: ἀφέντες
  choice: fi í sílẹ̀
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí fífi ẹni kan sílẹ̀ tàbí kọ̀ ọ́ sílẹ̀. ‘Fi í sílẹ̀’ jẹ́ èdè Yorùbá àdánidá tí kò fi ìtẹnumọ́ tí ó pọ̀ ju ti Gíríìkì lọ kún un.
- source_word: αὐτὸν
  choice: í
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù, ẹni tí àwọn alábàákẹ́gbẹ́ rẹ̀ fi sílẹ̀.
- source_word: ἔφυγον
  choice: sá lọ
  rationale: Ó ń sọ nípa sísá kúrò nítorí ewu; ‘sá lọ’ jẹ́ gbolohun Yorùbá tó ṣe kedere, tó sì bá ìwúwo ìṣẹ̀lẹ̀ náà mu.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tẹnumọ́ pé gbogbo àwọn tó wà pẹ̀lú Jésù ni wọ́n sá; fífi í sí ìbẹ̀rẹ̀ gbólóhùn jẹ́ ọ̀nà àdánidá láti pa ìtẹnumọ́ náà mọ́ ní Yorùbá.
theological_decisions:
- issue: Bí fífi àwọn ọmọ-ẹ̀yìn fi Jésù sílẹ̀ ṣe gbòòrò tó
  choice: Gbogbo wọn sì fi í sílẹ̀, wọ́n sì sá lọ.
  alternative: Wọ́n fi í sílẹ̀, gbogbo wọn sì sá lọ.
  rationale: Ìtumọ̀ náà pa ìtẹnumọ́ Gíríìkì mọ́ pé gbogbo àwọn alábàákẹ́gbẹ́ rẹ̀ ló fi í sílẹ̀ ní àkókò yẹn, láìmú ẹ̀sùn tàbí ẹ̀kọ́ ìgbàgbọ́ míì wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àtúnṣe ‘Gbogbo wọn’ sí iwájú jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ πάντες mọ́. A tún ‘sì’ ṣe láti fi ìbáṣepọ̀ àwọn ìṣe méjèèjì hàn gẹ́gẹ́ bí καὶ ṣe ń ṣiṣẹ́ nínú ìtàn náà.
