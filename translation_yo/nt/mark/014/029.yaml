id: MRK.14.29
reference: Mark 14:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù sọ fún un pé, “Bí gbogbo wọn tilẹ̀ kọsẹ̀[a], èmi kì yóò kọsẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣubú kúrò” tàbí “kí a mú wọn kọsẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pé a mú ènìyàn kọsẹ̀, pé ó bínú, tàbí pé ó ṣubú kúrò nínú ìdúróṣinṣin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìdáhùn Peteru hàn gẹ́gẹ́ bí ohun tó tako àsọtẹ́lẹ̀ Jésù nínú ẹsẹ tó ṣáájú.
- source_word: ἔφη αὐτῷ
  choice: sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Peteru bá ẹni tí a ti mọ̀ nínú àyíká ọ̀rọ̀, ìyẹn Jésù, sọ̀rọ̀; ó sì pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi orúkọ Jésù kún un.
- source_word: Εἰ καὶ
  choice: Bí ... tilẹ̀
  rationale: 'Ìṣètò yìí mú ìtumọ̀ àdéhùn tí ó tún ní agbára ìyọ̀ǹda jáde lọ́nà Yorùbá tó ṣe déédéé: ‘kódà bí ó bá rí pé...’'
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn ọmọ-ẹ̀yìn yòókù nínú àyíká ọ̀rọ̀, ó sì jẹ́ kó ṣe kedere ní Yorùbá pé ẹgbẹ́ ènìyàn ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: σκανδαλισθήσονται
  choice: kọsẹ̀
  rationale: ‘Kọsẹ̀’ lè mú àwòrán ìdíwọ̀ tó mú ènìyàn ṣubú jáde, ó sì tún lè túmọ̀ sí kíkùnà tàbí yíyẹ̀ kúrò nínú ìdúróṣinṣin. Àlàyé ìsàlẹ̀ fi ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì hàn láì fi dandan sọ pé ìṣubú náà jẹ́ ti òpin.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: èmi kì yóò kọsẹ̀
  rationale: Fífi ‘èmi’ síwájú pa ìtẹnumọ́ Peteru mọ́, nígbà tí àtúnsọ ọ̀rọ̀-ìṣe tí a lóye láti apá àkọ́kọ́ mú gbólóhùn náà ṣe kedere àti àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλισθήσονται nígbà tí àwọn ọmọ-ẹ̀yìn yóò kùnà Jésù
  choice: kọsẹ̀
  alternative: ṣubú kúrò; mú wọn kọsẹ̀; kọ̀ láti tẹ̀lé e mọ́
  rationale: ‘Kọsẹ̀’ pa àwòrán àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè gba ìkùnà tó lágbára nínú ìbáṣepọ̀ ọmọ-ẹ̀yìn. Àlàyé ìsàlẹ̀ ṣàlàyé pé ó lè túbọ̀ lágbára ju ìkọsẹ̀ ti ara lọ, láì pinnu pé ó túmọ̀ sí ìpẹ̀yìndà ayérayé.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò ‘Bí ... tilẹ̀’ àti ìtẹnumọ́ ‘èmi’ jẹ́ àdánidá fún ọ̀rọ̀ ẹnu Peteru, nígbà tí ‘kọsẹ̀’ àti àlàyé rẹ̀ pa ìṣòro àti ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
