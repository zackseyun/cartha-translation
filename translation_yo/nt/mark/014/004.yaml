  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan sì bínú, wọ́n sì ń sọ láàárín ara wọn[a] pé, “Kí nìdí tí òróró olóòórùn[b] yìí fi ṣòfò?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “sí ara wọn” tàbí “nínú ara wọn.” Gbólóhùn Gíríìkì náà lè tọ́ka sí àròyé tí wọ́n ń bá ara wọn ṣe nínú ẹgbẹ́ náà tàbí sí ìhùwàpadà inú ọkàn wọn.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́ “ohun ìkunra olóòórùn dídùn.” Ọ̀rọ̀ Gíríìkì μύρον ń tọ́ka sí òróró tàbí ohun ìkunra tí ó ní òórùn dídùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ṣùgbọ́n ...
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ hàn láàárín ohun tí obìnrin náà ṣe àti bí àwọn kan ṣe dáhùn sí i, ó sì ń tẹ ìtàn náà síwájú.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó pa àìsọ pàtó ẹni tí wọ́n jẹ́ mọ́, bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
- source_word: ἀγανακτοῦντες
  choice: inú bí
  rationale: Gbólóhùn yìí fi ìbínú líle àti àìtẹ́wọ́gbà hàn ní Yorùbá àdánidá, kì í ṣe ìbànújẹ́ lásán.
- source_word: πρὸς ἑαυτούς
  choice: láàárín ara wọn
  rationale: Ó bá ọ̀rọ̀ tí wọ́n ń sọ nínú ẹgbẹ́ wọn mu, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ mìíràn tí Gíríìkì lè ní mọ́.
- source_word: Εἰς τί
  choice: Èé ṣe
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún ìdí tàbí ète, ó sì bá ẹ̀dùn ọkàn àwọn olùsọ̀rọ̀ mu.
- source_word: ἡ ἀπώλεια αὕτη
  choice: tí a fi ... yìí ṣòfò
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ní àyíká yìí ni pé, ní ojú àwọn olùsọ̀rọ̀, a ti fi ohun olówó ṣòfò; ìtumọ̀ ọ̀rọ̀-ìṣe yìí jẹ́ àdánidá ju gbólóhùn-orúkọ líle lọ ní Yorùbá.
- source_word: τοῦ μύρου
  choice: òróró olóòórùn dídùn
  rationale: μύρον jẹ́ òróró tàbí ohun ìkunra tí ó ní òórùn dídùn; yíyan yìí ṣe kedere fún òǹkàwé òde òní láì sọ ọ́ di lọ́fíńdà olómi nìkan.
- source_word: γέγονεν
  choice: tí a fi ... ṣòfò
  rationale: Ìṣètò ìbéèrè Yorùbá yìí sọ ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ sì wà níwájú wọn; a yàgò fún títẹ̀lé ìlànà gbólóhùn Gíríìkì ní ọ̀rọ̀ sí ọ̀rọ̀.
