  source_fidelity: 'Ìtumọ̀ náà gbé ìtumọ̀ pàtàkì ẹsẹ̀ náà kalẹ̀ dáadáa: àwọn kan ní ìbínú, ìbínú náà sì wà nínú ẹgbẹ́ wọn, wọ́n béèrè nípa ìṣòfò òróró olóòórùn náà. Síbẹ̀, “inú bí àwọn kan” kò rọrùn tó gẹ́gẹ́ bí ọ̀nà ìṣàfihàn ἀγανακτοῦντες; “àwọn kan sì bínú” jẹ́ kedere, ó sì dára jù. Ìbéèrè tí a tún ṣe ń pa ìbéèrè èròjà/orísun náà mọ́ láì sọ ẹni tí ó fa ìṣòfò náà di pàtó.'
