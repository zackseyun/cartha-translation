source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Èyí ni ẹ̀jẹ̀ mi ti májẹ̀mú[a], èyí tí a ń tú jáde[b] fún ọ̀pọ̀ ènìyàn[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan àti àwọn ẹsẹ tó jọra ní, “ẹ̀jẹ̀ mi ti májẹ̀mú tuntun.” Ṣùgbọ́n ọ̀rọ̀ Gíríìkì fún Máàkù níhìn-ín ka, “ẹ̀jẹ̀ mi ti májẹ̀mú.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “èyí tí a tú jáde”; ní ọ̀nà ìbílẹ̀, “èyí tí a ta sílẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí ọ̀pọ̀ ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Èyí ni
  rationale: Ìtumọ̀ copula tààrà ni èyí, ó sì pa ọ̀rọ̀ Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- source_word: τὸ αἷμά μου
  choice: ẹ̀jẹ̀ mi
  rationale: Ó tẹ̀lé àkópọ̀ ohun-ìní inú Gíríìkì, ó sì pa àwòrán ẹbọ àti májẹ̀mú mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ‘ikú mi.’
- source_word: τῆς διαθήκης
  choice: ti májẹ̀mú
  rationale: ‘Májẹ̀mú’ ni ìtumọ̀ tó bá àyíká ọ̀rọ̀ yìí mu; a kò fi ‘tuntun’ kún un nítorí kò sí nínú ẹ̀rí ọ̀rọ̀ SBLGNT tí a lò.
- source_word: ἐκχυννόμενον
  choice: èyí tí a ń dà sílẹ̀
  rationale: Ìṣe tí ó ń lọ lọ́wọ́ inú participle present passive ni ‘a ń dà sílẹ̀’ fi hàn, ó sì pa àwòrán ẹ̀jẹ̀ tí a dà sílẹ̀ mọ́.
- source_word: ὑπὲρ πολλῶν
  choice: fún ọ̀pọ̀ ènìyàn
  rationale: ‘Fún’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé tí ó sì lè ru ìtumọ̀ ṣíṣe nítorí tàbí ní ipò àwọn ènìyàn náà láìpinnu àríyànjiyàn ẹ̀kọ́ ètùtù.
theological_decisions:
- issue: Bóyá διαθήκη yẹ kí ó túmọ̀ sí májẹ̀mú tàbí ìwé ogún
  choice: májẹ̀mú
  alternative: ìwé ogún
  rationale: Àyíká Oúnjẹ Alẹ́ Olúwa àti ọ̀rọ̀ nípa ẹ̀jẹ̀ ń tọ́ka sí májẹ̀mú, pẹ̀lú ìró Eksodu 24:8, kì í ṣe ìwé ogún.
- issue: Bóyá kí a fi ‘tuntun’ kún ‘májẹ̀mú’
  choice: ti májẹ̀mú
  alternative: ti májẹ̀mú tuntun
  rationale: Ọ̀rọ̀ καινῆς (‘tuntun’) kò sí nínú SBLGNT ní Máàkù 14:24; nítorí náà, a kò mú Máàkù bá àwọn ẹsẹ tó jọra mu nípa fífi ọ̀rọ̀ tí kò sí kún un. Àṣàyàn náà wà nínú àlàyé ìsàlẹ̀.
- issue: Ohun tí ὑπὲρ πολλῶν lè túmọ̀ sí nípa ìwọ̀n ètùtù
  choice: fún ọ̀pọ̀ ènìyàn
  alternative: fún gbogbo ènìyàn; ní ipò ọ̀pọ̀ ènìyàn
  rationale: Ìtumọ̀ náà pa ‘ọ̀pọ̀’ mọ́, kò sì fi ‘gbogbo’ rọ́pò rẹ̀ tàbí yanju àríyànjiyàn ẹ̀kọ́ ìsìn tí ẹsẹ náà kò yanju fúnra rẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ọ̀nà tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘A ń dà sílẹ̀’ pa ìṣe present passive mọ́ ní ti ẹ̀dá Yorùbá; ‘májẹ̀mú’ ni ọ̀rọ̀ Bíbélì tó wọ́pọ̀, tó sì ṣe kedere.
