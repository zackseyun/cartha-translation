  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: yo
  text: Ẹ máa ṣọ́nà, kí ẹ sì máa gbàdúrà, kí ẹ má bàa wọ inú ìdẹwò.[a] Ẹ̀mí fẹ́ nítòótọ́, ṣùgbọ́n ẹran ara jẹ́ aláìlera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àdánwò” tàbí “ìdánwò” fún “ìdẹwò” (πειρασμόν).
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Ẹ máa ṣọ́nà
  rationale: Ọ̀rọ̀ àṣẹ yìí lè túmọ̀ sí jí lójú oorun tàbí máa ṣọ́ra. Nínú ọ̀rọ̀ Gẹtisémánì, “ẹ máa ṣọ́nà” jẹ́ èdè Yorùbá àdánidá tó pa ìtumọ̀ méjèèjì mọ́.
- source_word: προσεύχεσθε
  choice: kí ẹ sì máa gbàdúrà
  rationale: Ìlànà “máa” fi agbára àṣẹ onítẹ̀síwájú hàn, ó sì bá fọ́ọ̀mù ìṣe àsìkò ìsinsìnyí inú Gíríìkì mu.
- source_word: ἵνα μὴ ἔλθητε
  choice: kí ẹ má bàa bọ́
  rationale: “Kí ... má bàa” sọ ète ìdènà ἵνα μή jáde lọ́nà Yorùbá tí ó ṣe déédé, nígbà tí “bọ́ sínú” pa àwòrán wíwọlé sínú ipò kan mọ́.
- source_word: εἰς πειρασμόν
  choice: sínú ìdẹwò
  rationale: “Ìdẹwò” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu jù fún ewu ìfà-sí-ẹ̀ṣẹ̀ ní àyíká yìí; àlàyé ìsàlẹ̀ pa ìtumọ̀ míì, ìdánwò tàbí àdánwò, mọ́.
- source_word: τὸ μὲν πνεῦμα
  choice: Ẹ̀mí ... nítòótọ́
  rationale: A lo “ẹ̀mí” ní lẹ́tà kékeré ní ìtumọ̀, nítorí ìtakora rẹ̀ pẹ̀lú ẹran ara tọ́ka sí inú-ọkàn tàbí ìfẹ́ ènìyàn. “Nítòótọ́” fi ipa μέν hàn láì mú kí gbolohun di àjèjì.
- source_word: πρόθυμον
  choice: fẹ́
  rationale: Nínú àtakò yìí, “fẹ́” sọ ìmúratán àti ìfẹ́ inú ènìyàn jáde ní Yorùbá tó ṣe déédé, láì fi agbára tó ju πρόθυμος lọ kún un.
- source_word: ἡ δὲ σὰρξ
  choice: ṣùgbọ́n ẹran ara
  rationale: “Ẹran ara” pa àwòrán σάρξ àti àtakò rẹ̀ pẹ̀lú ẹ̀mí mọ́; kò sọ ọ́ di “ìwà ẹlẹ́ṣẹ̀,” èyí tí yóò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára ju àyíká náà lọ kún un.
- source_word: ἀσθενής
  choice: jẹ́ aláìlera
  rationale: “Aláìlera” sọ àìlera ènìyàn jáde ní kedere, ó sì bá àtakò pẹ̀lú ìfẹ́ inú mu.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: ẹ̀mí ènìyàn / ìfẹ́ inú
  alternative: Ẹ̀mí Mímọ́
  rationale: Àtakò lẹ́sẹ̀kẹsẹ̀ pẹ̀lú “ẹran ara” àti ipò àwọn ọmọ-ẹ̀yìn tí oorun ń kó ṣe àtìlẹ́yìn fún ìtumọ̀ ẹ̀mí ènìyàn. Ìkọ lẹ́tà ńlá fún un yàgò fún pípa àìdánilójú náà run nípasẹ̀ títúmọ̀ rẹ̀ sí Ẹ̀mí Mímọ́.
- issue: Ìtumọ̀ σάρξ
  choice: ẹran ara
  alternative: ìwà ẹlẹ́ṣẹ̀; ara
  rationale: Níhìn-ín, kókó ni àìlera ènìyàn, kì í ṣe ẹ̀kọ́ pàtó nípa ìwà ẹlẹ́ṣẹ̀. “Ẹran ara” pa ọ̀rọ̀ ìpilẹ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn ọ̀rọ̀ àṣẹ púpọ̀ “Ẹ máa ...” bá àwọn tí Jésù ń bá sọ mu. “Ẹran ara” ni a pa mọ́ láti yẹra fún ṣíṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀ náà.
