source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: yo
  text: “Lóòótọ́ ni mo wí fún yín pé, èmi kì yóò tún mu nínú èso àjàrà[b] rárá[a] títí di ọjọ́ náà tí màá mu ún ní ìtuntun[c] nínú ìjọba Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Èmi kì yóò mu nínú èso àjàrà mọ́ láé.” Ọ̀nà ìkọ̀ tí Gíríìkì lò níbí lágbára gan-an.
    reason: lexical_alternative
  - marker: b
    text: “Èso àjàrà” gan-an ni gbólóhùn Gíríìkì níbí; ìyẹn ni ohun mímu tí a fi èso àjàrà ṣe, tí wọ́n ń lò níbi àsè náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “mu ún gẹ́gẹ́ bí ohun tuntun.” Ọ̀rọ̀ ajẹtífù Gíríìkì lè túmọ̀ sí “tuntun,” ó sì lè tọ́ka sí ìtuntun ọjọ́ iwájú nínú ìjọba Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá, ọ̀wọ̀, tí ó sì ṣe kedere fún gbólóhùn ìkéde pàtàkì yìí; ó pa ìtumọ̀ ἀμὴν àti ọ̀rọ̀ tí a darí sí àwọn olùgbọ́ mọ́.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: èmi kì yóò tún mu ... rárá
  rationale: “Tún” fi hàn pé kò ní mu mọ́ lẹ́yìn ìgbà yìí, “rárá” sì mú agbára ìkọ̀ emphatic οὐ μὴ jáde; fífi “èmi” sí i tún tẹnumọ́ ẹni tí ń sọ̀rọ̀.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: nínú èso àjàrà
  rationale: Ó tẹ̀ lé àwòrán àti ọ̀rọ̀ Gíríìkì láì fi “wáìnì” kún un, bí ó tilẹ̀ jẹ́ pé nínú àyíká àsè, ohun mímu láti inú àjàrà ni a ń tọ́ka sí.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: títí di ọjọ́ náà
  rationale: Ó pa ààlà àkókò àti ìtẹnumọ́ demonstrative “ọjọ́ náà” mọ́ ní Yorùbá àdánidá.
- source_word: ὅταν αὐτὸ πίνω
  choice: nígbà tí èmi yóò mu ún
  rationale: “Nígbà tí” bá ìṣẹ̀lẹ̀ ọjọ́ iwájú kan mu; “ún” tọ́ka padà sí ohun mímu tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: καινὸν
  choice: ní tuntun
  rationale: A yan ọ̀rọ̀ gbooro “tuntun” láti pa ìṣiyèméjì mọ́ láàárín ohun tí ó tuntun ní irú tàbí ìwà rẹ̀ àti mímu rẹ̀ ní ọ̀tun, láì pinnu ju Gíríìkì lọ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: nínú ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó wọ́pọ̀, tí ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ καινὸν nínú gbólóhùn ìkẹyìn
  choice: A túmọ̀ rẹ̀ sí “ní tuntun” láì ṣàlàyé bóyá tuntun ní irú ni tàbí mímu ní ọ̀tun.
  alternative: “mu ún ní ọ̀tun” tàbí “mu ún gẹ́gẹ́ bí ohun tuntun nínú àsè ìjọba ọjọ́ iwájú”
  rationale: καινός lè tọ́ka sí tuntun ní irú tàbí ìwà, ó sì lè ru èrò tuntun ti ọjọ́ ìkẹyìn sókè; ẹsẹ náà kò ṣàlàyé bí tuntun náà ṣe rí, nítorí náà a kò yẹ kí ìtumọ̀ pinnu rẹ̀.
- issue: Ohun tí “èso àjàrà” ń tọ́ka sí
  choice: A pa àpẹẹrẹ “èso àjàrà” mọ́.
  alternative: “wáìnì”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ohun inú ife tí wọ́n ń mu ni, ṣùgbọ́n Gíríìkì kò lo ọ̀rọ̀ pàtó fún wáìnì; yíyàn gbólóhùn orísun kò fi ìtumọ̀ tóóró kún ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ọ̀rọ̀ àdánidá bí “Lóòótọ́ ni mo wí fún yín” àti ìkọ̀ alágbára “kì yóò ... rárá,” nígbà tí a pa àwòrán orísun “èso àjàrà” àti ìṣiyèméjì “tuntun” mọ́.
