id: MRK.14.55
reference: Mark 14:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti gbogbo ìgbìmọ̀ náà[a] ń wá ẹ̀rí lòdì sí Jésù láti pa á, wọn kò sì rí ẹ̀rí kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i, “gbogbo Sànhẹ́dírìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Àwọn
  rationale: A kò fi ọ̀rọ̀ àkókò bí ‘nígbà náà’ kún un; δέ jẹ́ àsopọ̀ ìtàn tó rọ̀, àyíká gbólóhùn sì ti lè gbé iṣẹ́ rẹ̀.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà ní Jerusalẹmu, kì í ṣe sí olórí àlùfáà kan ṣoṣo.
- source_word: ὅλον τὸ συνέδριον
  choice: gbogbo ìgbìmọ̀ náà[a]
  rationale: ‘Ìgbìmọ̀’ tú ìtumọ̀ συνέδριον sí Yorùbá tó ṣe kedere, ‘gbogbo’ sì pa ὅλον mọ́; àlàyé ìsàlẹ̀ fún orúkọ ìtàn ‘Sànhẹ́dírìn.’
- source_word: ἐζήτουν
  choice: ń wá
  rationale: Àmì ‘ń’ fi hàn pé iṣẹ́ wíwá náà ń bá a lọ, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: lòdì sí Jésù
  rationale: 'κατά pẹ̀lú genitive níbí ní agbára ọ̀tá: ẹ̀rí tí a gbé dìde lòdì sí Jésù.'
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ẹni ń jẹ́rìí sí ní ipò ìdájọ́, láìdá a pọ̀ mọ́ ẹni tó jẹ́rìí.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: láti pa á
  rationale: Ó pa ète tí articular infinitive fi hàn mọ́, ó sì tú θανατόω ní tààrà láìfi ìgbésẹ̀ òfin tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: καὶ οὐχ ηὕρισκον
  choice: wọn kò sì rí ẹ̀rí kankan
  rationale: ‘sì’ gbé agbára àsopọ̀ καί; gbólóhùn odi náà sọ abajade wíwá tí ń lọ lọ́wọ́ ní Yorùbá àdánidá, ‘ẹ̀rí kankan’ sì mú ohun tí wọn kò rí ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ συνέδριον
  choice: gbogbo ìgbìmọ̀ náà
  alternative: gbogbo Sànhẹ́dírìn
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ìgbìmọ̀ aláṣẹ; fífi ìtumọ̀ rẹ̀ sínú àkọ́kọ́ jẹ́ kó yé òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ pa orúkọ ìtàn náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ náà pa ìṣe tí ń bá a lọ nínú imperfect Gíríìkì mọ́, ó sì yẹra fún fífi ọ̀rọ̀ àkókò tàbí ìlànà ìdájọ́ tí kò hàn gbangba nínú orísun kún ẹsẹ náà.
