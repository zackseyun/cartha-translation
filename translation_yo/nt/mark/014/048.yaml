  rationale: A tún ṣètò gbolóhùn náà kí ‘bí ẹni pé ọlọ́ṣà ni mí’ lè tọ́ka sí Jésù ní tààrà, gẹ́gẹ́ bí ὡς ἐπὶ λῃστὴν. A pa ìbéèrè àtakò, ìtumọ̀ ‘idà àti ọ̀gọ̀,’ àti ète ‘láti mú mi’ mọ́. A tún mú àwọn ìtumọ̀ àfidípò nínú àlàyé ìsàlẹ̀ jẹ́ adayeba síi, nígbà tí a pa ìfẹ̀ ìtumọ̀ λῃστής mọ́.
