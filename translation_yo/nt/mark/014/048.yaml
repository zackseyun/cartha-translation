  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: yo
  text: Jésù sì dá wọn lóhùn pé, “Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀gọ̀ láti mú mi bí ẹni pé ọlọ́ṣà[a] ni mí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ajinigbé,” “arúfin,” tàbí “ọlọ̀tẹ̀.” Ọ̀rọ̀ Gíríìkì náà, λῃστής, lè tọ́ka sí ọlọ́ṣà tó ń lo ìwà ipá tàbí ẹni tó dìde sí ìjọba, kì í ṣe olè lásán nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: dá wọn lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà ìtàn tí ó wọ́pọ̀ láti fi bẹ̀rẹ̀ ọ̀rọ̀ ẹni. ‘Dá wọn lóhùn pé’ mú iṣẹ́ àkójọpọ̀ náà jáde ní Yorùbá àdánidá láì tún ‘sọ’ ṣe lásán.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: bí ẹni pé ẹ ń lọ mú ọlọ́ṣà
  rationale: 'Ìtumọ̀ yìí pa agbára ὡς ἐπί mọ́: wọ́n ṣe sí Jésù bí ẹni pé ọ̀daràn eléwu kan ni tí ó yẹ kí wọ́n fi ohun ìjà lọ mú.'
- source_word: λῃστὴν
  choice: ọlọ́ṣà
  rationale: ‘Ọlọ́ṣà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì lè tọ́ka sí ẹni tí ń fi ipá jalè. Nítorí ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ọlọ́ṣà oníjà tàbí ọlọ̀tẹ̀, a fi àlàyé sí àlàyé ìsàlẹ̀.
- source_word: ἐξήλθατε
  choice: ẹ ṣe jáde wá
  rationale: Ó ṣàpèjúwe bí ẹgbẹ́ náà ṣe jáde tọ Jésù wá, ó sì bá ìbéèrè àtakò inú ọ̀rọ̀ náà mu.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: pẹ̀lú àwọn idà àti ọ̀gọ̀
  rationale: μάχαιρα jẹ́ idà tàbí ọ̀bẹ ńlá; ξύλον túmọ̀ sí igi ní ìpilẹ̀ṣẹ̀, ṣùgbọ́n níhìn-ín ó jẹ́ ọ̀gọ̀ tí a mú gẹ́gẹ́ bí ohun ìjà.
- source_word: συλλαβεῖν
  choice: láti mú mi
  rationale: Ní àyíká ìṣẹ̀lẹ̀ yìí, ‘mú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹni sí àtìmọ́lé tàbí ṣíṣe àṣẹ mú un, ó sì yẹra fún àfikún òfin tí kò ṣe pàtó nínú ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ λῃστής nínú ìbéèrè àtakò Jésù
  choice: ‘ọlọ́ṣà’ nínú ẹsẹ̀, pẹ̀lú ìtumọ̀ fífẹ̀ síi nínú àlàyé ìsàlẹ̀
  alternative: ọlọ́ṣà oníjà; arúfin; ọlọ̀tẹ̀
  rationale: Ẹsẹ̀ náà kò sọ pé Jésù jẹ́ ọ̀daràn; ó ń tako bí wọ́n ṣe wá mú un bí ẹni eléwu. Yíyan ‘ọlọ́ṣà’ mú kí ọ̀rọ̀ náà ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa àǹfààní ìtumọ̀ ọ̀daràn oníjà tàbí ọlọ̀tẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtúmọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Ìbéèrè ‘Ṣé …?’ pa ìwà àtakò inú ọ̀rọ̀ Jésù mọ́.
