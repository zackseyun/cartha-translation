  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: Jésù dá wọn lóhùn, ó sì béèrè ní ìbéèrè àtakò nípa bí wọ́n ṣe mú idà àti ọ̀gọ̀ wá láti mú un. Síbẹ̀, ìṣètò ‘bí ẹni pé ẹ ń lọ mú ọlọ́ṣà ni ẹ ṣe jáde wá’ yí ipa ὡς ἐπὶ λῃστὴν padà díẹ̀, ó sì jẹ́ kí ‘ẹ ń lọ mú ọlọ́ṣà’ dà bí ohun tí wọ́n ń ṣe lọ́tọ̀ sí mímú Jésù. Àtúnṣe náà so ìfiwéra náà mọ́ Jésù gan-an: wọ́n wá mú un bí ẹni pé ọlọ́ṣà ni í ṣe.'
  naturalness: ‘Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀gọ̀ láti mú mi bí ẹni pé ọlọ́ṣà ni mí?’ jẹ́ Yorùbá boṣewa tó rọrùn, tó sì pa ọ̀nà ìbéèrè àtakò náà mọ́. ‘Dá wọn lóhùn pé’ jẹ́ ìlò àdánidá fún ἀποκριθεὶς … εἶπεν.
  terminology: ‘Ọlọ́ṣà’ jẹ́ ìtumọ̀ kedere fún λῃστής, ṣùgbọ́n àlàyé ìsàlẹ̀ yẹ kí ó ṣàlàyé pé kì í ṣe olè kékeré lásán; ‘ajinigbé’ àti ‘ọlọ̀tẹ̀’ wúlò gẹ́gẹ́ bí àwọn ìṣàpẹẹrẹ ìfẹ̀ ìtumọ̀ náà. ‘Idà’ àti ‘ọ̀gọ̀’ bá μάχαιρῶν καὶ ξύλων mu dáadáa.
