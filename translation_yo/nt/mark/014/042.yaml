  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Ẹ dìde” ń tú ἐγείρεσθε; “ẹ jẹ́ kí a lọ” ń mú ìpè-họ́tátórì ἄγωμεν wá; “Ẹ wò ó” ń fi agbára ìfàkíyèsí ἰδού hàn; “ẹni tí ó ń dà mí” ń pa ipa aláṣẹ̀ṣe ὁ παραδιδούς mọ́; “ti sún mọ́lé” sì ń mú ìmọ̀ pé ẹni náà ti sún dé ibi tó wà nísinsìnyí (ἤγγικεν) hàn. Àlàyé ìsàlẹ̀ náà tọ́ka sí ìtumọ̀ “fi lé lọ́wọ́” láì sọ pé ìtumọ̀ kan ṣoṣo ni ó ṣeé ṣe.'
  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé, ó ní ìbámu pẹ̀lú ọ̀rọ̀ àṣẹ sí ọ̀pọ̀ ènìyàn, ó sì bójú mu fún ọ̀rọ̀ Jésù nínú ìṣẹ̀lẹ̀ yìí. “Ẹ wò ó” àti “ti sún mọ́lé” jẹ́ ọ̀nà àdánidá, tó ní ọlá, láti mú ìkìlọ̀ ojú-ẹsẹ̀ náà jáde. Àmì ohùn wà níbi tó yẹ.
