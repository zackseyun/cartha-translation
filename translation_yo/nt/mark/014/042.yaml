  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: yo
  text: Ẹ dìde, ẹ jẹ́ kí a lọ. Ẹ wò ó, ẹni tí ó ń dà mí[a] ti sún mọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan díẹ̀, “ẹni tí ó ń fi mí lé wọn lọ́wọ́ ti sún mọ́lé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Ẹ dìde
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; nínú àyíká yìí, ó ń rọ àwọn ọmọ-ẹ̀yìn láti dìde kí wọ́n sì gbéra, kì í ṣe pé kí wọ́n jí lásán.
- source_word: ἄγωμεν
  choice: ẹ jẹ́ kí a lọ
  rationale: Ó jẹ́ ọ̀rọ̀ ìrọ̀rùn tí ẹni tó ń sọ fi pe àwọn míì láti bá a lọ; èyí jẹ́ Yorùbá àdánidá tó sì pa ìtumọ̀ ‘ẹ jẹ́ kí a lọ’ mọ́.
- source_word: ἰδού
  choice: Ẹ wò ó
  rationale: Ó fa àfiyèsí àwọn olùgbọ́ sí ohun tó ń ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀, láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: ὁ παραδιδούς
  choice: ẹni tí ó ń dà mí
  rationale: Àpólà aláṣẹ̀ṣe yìí ń tọ́ka sí ẹni tó ń ṣe ìwà ọ̀dàlẹ̀ sí Jésù. Ìtumọ̀ yìí mú agbára ìbáṣepọ̀ àti ìwà ọ̀dàlẹ̀ inú àyíká náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ‘fi lé lọ́wọ́’ hàn.
- source_word: με
  choice: mí
  rationale: Arọ́pò-orúkọ olùgbà-ìṣe ni, ó sì ń tọ́ka sí Jésù.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: 'Ó pa ìtumọ̀ ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì wà ní báyìí mọ́: ẹni náà ti dé àgbègbè tó sún mọ́ wọn.'
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδίδωμι nínú ìtàn ìjìyà Jésù
  choice: ń dà mí
  alternative: ń fi mí lé wọn lọ́wọ́
  rationale: Nínú ìṣẹ̀lẹ̀ yìí, Júdásì ni a ń tọ́ka sí, ìwà ọ̀dàlẹ̀ rẹ̀ sì ṣe pàtàkì nínú ìtàn náà. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan ti fífi ẹni lé ẹlòmíràn lọ́wọ́ mọ́, kí a má bà a yanjú ẹ̀kúnrẹ́rẹ́ ọ̀rọ̀ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì yé àwọn òǹkàwé lásán. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àṣẹ ọ̀pọ̀ ènìyàn àti agbára ìkìlọ̀ ojú-ẹsẹ̀ náà mọ́.
