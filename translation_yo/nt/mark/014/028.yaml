  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: yo
  text: Ṣùgbọ́n, lẹ́yìn tí a bá ti jí mi dìde[a], yóò lọ ṣáájú yín sí Gálílì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí a ti jí mi dìde.” Nínú Gíríìkì, ọ̀rọ̀ náà wà ní ọ̀nà ìṣe-àfaragba fún “jí dìde”; ọ̀nà tí a sábà máa ń lò nípa ajinde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí àsọtẹ́lẹ̀ tí ó ṣáájú nípa bí àwọn ọmọ-ẹ̀yìn yóò ṣe túká.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: lẹ́yìn tí a bá jí mi dìde
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ohun tí yóò ṣẹlẹ̀ lẹ́yìn náà, ó sì pa ìṣe aláìṣe-taara inú Gíríìkì mọ́ ní Yorùbá.
- source_word: ἐγερθῆναί
  choice: a bá jí mi dìde
  rationale: Àkójọpọ̀ ọ̀rọ̀ ‘jí ... dìde’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ nípa jíjí ẹni dìde kúrò nínú ikú; ‘a’ tí a kò dárúkọ ẹni tó ń ṣe é pa ìṣe aláìṣe-taara náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: προάξω
  choice: èmi yóò ṣáájú yín lọ
  rationale: Ó mú èrò pé Jésù yóò lọ ṣáájú àwọn ọmọ-ẹ̀yìn sí ibi tí a sọ, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, Yorùbá sì fi ọ̀pọ̀ rẹ̀ hàn kedere.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Gálílì
  rationale: ‘Sí’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìlọ sí ibi kan, ó sì bá ìtọ́sọ́nà εἰς mu.
theological_decisions:
- issue: Ọ̀rọ̀ ajinde nínú ἐγερθῆναί με
  choice: lẹ́yìn tí a bá jí mi dìde
  alternative: lẹ́yìn tí mo bá jí dìde
  rationale: A pa ìṣe aláìṣe-taara Gíríìkì mọ́, dípò yíyí rẹ̀ sí ọ̀rọ̀ tí ó sọ pé Jésù fúnra rẹ̀ jí dìde; báyìí ni a ṣe ń yàgò fún pípa ìyàtọ̀ gírámà náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì lo ‘èmi’ láti mú ìyàtọ̀ ẹni tí yóò ṣáájú wọn hàn ní ti ẹ̀dá ọ̀rọ̀.
