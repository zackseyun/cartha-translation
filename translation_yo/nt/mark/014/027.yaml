source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: yo
  text: 'Jésù sì sọ fún wọn pé, “Gbogbo yín ni ẹ ó kọsẹ̀[a], nítorí a ti kọ ọ́ pé:


    ‘Èmi yóò lu olùṣọ́-àgùntàn,

    àwọn àgùntàn yóò sì tú ká.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo yín ni ẹ ó kọ̀ mí sílẹ̀”; tàbí, ní ti gidi jù, “Gbogbo yín ni a ó mú kọsẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀ yìí bá ọ̀nà ìtàn Yorùbá mu, ó sì lè gbé ìṣe tó ń lọ lọ́wọ́ nínú àyíká ọ̀rọ̀ láìfi àmì àsìkò tí kò sí nínú èdè Yorùbá kún un.
- source_word: σκανδαλισθήσεσθε
  choice: yóò kọsẹ̀
  rationale: “Kọsẹ̀” pa àwòrán àti ìtumọ̀ gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ó kan ìkùnà àwọn ọmọ-ẹ̀yìn àti bí wọn yóò ṣe tú ká. Àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí àwọn ìtumọ̀ tó túmọ̀ sí fífi Jésù sílẹ̀ tàbí jíjẹ́ kí ènìyàn kọsẹ̀.
- source_word: γέγραπται
  choice: a ti kọ ọ́ pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn tí ń tọ́ka sí ohun tí a ti kọ sínú Ìwé Mímọ́, ó sì pa ipa perfect passive náà mọ́.
- source_word: Πατάξω
  choice: Èmi yóò lu
  rationale: “Lu” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́; fífi “Èmi” hàn tún tẹnumọ́ ẹni àkọ́kọ́ nínú àsọtẹ́lẹ̀ náà.
- source_word: ποιμένα
  choice: olùṣọ́-àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún olùṣọ́ agbo, ó sì pa àwòrán àsọtẹ́lẹ̀ náà mọ́.
- source_word: τὰ πρόβατα
  choice: àwọn àgùntàn
  rationale: Ìtumọ̀ tààrà, tó ṣe kedere fún ọ̀pọ̀ orúkọ náà.
- source_word: διασκορπισθήσονται
  choice: yóò sì tú ká
  rationale: Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì fi hàn pé agbo náà yóò fọ́n sí onírúurú ibi lẹ́yìn tí a bá lu olùṣọ́ rẹ̀, láìdárúkọ ẹni tó tú wọn ká.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλισθήσεσθε nípa ìhùwàsí àwọn ọmọ-ẹ̀yìn sí Jésù
  choice: yóò kọsẹ̀
  alternative: yóò kọ̀ mí sílẹ̀; a ó mú yín kọsẹ̀
  rationale: “Yóò kọsẹ̀” pa ìṣòro àti ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, dípò kí ó pinnu pé ìkọ̀sílẹ̀ pátápátá tàbí apostasy ni. Àyíká ẹsẹ̀ náà àti àwòrán àwọn àgùntàn tí ń tú ká ń jẹ́ kí òǹkàwé lóye pé ìkùnà àti pípalà Jésù jẹ́ apá pàtàkì ìtumọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn ẹ̀yẹ ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “sọ” dípò ọ̀rọ̀ àtijọ́ tó le, a sì lo “olùṣọ́-àgùntàn” láti mú àwòrán agbo náà ṣe kedere. Gbogbo àmì ohùn ni a fi síbi tí ó bá jẹ́ àdánidá.
