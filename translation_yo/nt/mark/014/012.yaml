  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “ní ọjọ́ kìíní Àjọ Àkàrà Aláìwú” ń ṣàfihàn τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων; “wọ́n ń pa ọ̀dọ́-àgùntàn Ìrékọjá rúbọ” ń mú imperfect ἔθυον àti ìtumọ̀ πάσχα nínú àyíká ẹbọ hàn; ìbéèrè àwọn ọmọ-ẹ̀yìn náà sì pa ìtẹ̀lé ‘lọ ... pèsè sílẹ̀’ àti ète ‘kí o lè jẹ’ mọ́. Fífi “oúnjẹ” kún Ìrékọjá ní ibi kejì jẹ́ ìṣàlàyé kékeré tí àyíká φάγῃς dá lórí, kò sì yí ìtumọ̀ padà.'
  naturalness: Yorùbá náà jẹ́ ti ìgbàlódé, ó ní ìfẹ̀sẹ̀mulẹ̀, ó sì lò àmì ohùn dáadáa. “Bi í pé” àti “Níbo ni o fẹ́ kí a lọ pèsè sílẹ̀” jẹ́ ìkọ̀ ọrọ̀ àdánidá nínú ìtàn. Orúkọ ayẹyẹ náà àti ọ̀rọ̀ “Ìrékọjá” jẹ́ ìlò tó bójú mu fún ìforúkọsílẹ̀ mímọ́.
  terminology: “Àjọ Àkàrà Aláìwú,” “ọ̀dọ́-àgùntàn Ìrékọjá,” àti “oúnjẹ Ìrékọjá” ń ṣètọju ìyàtọ̀ ìtumọ̀ πάσχα méjì nínú ẹsẹ náà láìfi ẹ̀kọ́ ìjọ kankan kún un. Àlàyé ìsàlẹ̀ náà tún ṣàfihàn pé Gíríìkì kan náà ni a lò, àti pé ìtọ́kasí sí ọ̀dọ́-àgùntàn jẹ́ ti àyíká ọ̀rọ̀.
