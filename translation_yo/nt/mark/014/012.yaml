id: MRK.14.12
reference: Mark 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: yo
  text: Ní ọjọ́ kìíní Àjọ Àkàrà Aláìwú, nígbà tí wọ́n ń pa ọ̀dọ́-àgùntàn Ìrékọjá rúbọ[a], àwọn ọmọ-ẹ̀yìn rẹ̀ bi í pé, “Níbo ni o fẹ́ kí a lọ pèsè sílẹ̀, kí o lè jẹ oúnjẹ Ìrékọjá?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n ń pa Ìrékọjá rúbọ.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “Ìrékọjá,” ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ọ̀dọ́-àgùntàn Ìrékọjá tí wọ́n ń pa rúbọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: ní ọjọ́ kìíní Àjọ Àkàrà Aláìwú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ọjọ́ àkọ́kọ́ àkókò àjọ náà. Fífi “Àjọ” kún un mú kí òye ayẹyẹ náà hàn gbangba, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kò dúró lọ́tọ̀ nínú Gíríìkì.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: nígbà tí wọ́n ń pa ọ̀dọ́-àgùntàn Ìrékọjá rúbọ
  rationale: Àmì ìṣe “ń” fi ìṣe tó ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí imperfect ἔθυον. Nítorí θύω túmọ̀ sí pípa ẹran rúbọ níbí, “ọ̀dọ́-àgùntàn Ìrékọjá” mú ohun tí πάσχα ń tọ́ka sí nínú gbólóhùn yìí ṣe kedere.
- source_word: λέγουσιν
  choice: bi í pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, ìṣe àtẹ̀yìnwá ló bá ìtàn Yorùbá mu. “Bi í pé” tún mú irú ìbéèrè tí ó tẹ̀ lé e hàn ní ti ẹ̀dá.
- source_word: Ποῦ θέλεις
  choice: Níbo ni o fẹ́
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá ti òde òní tó bá ìfẹ́ tàbí ète tí θέλω ń sọ mu.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: kí a lọ pèsè sílẹ̀
  rationale: Ìtumọ̀ yìí da ọ̀rọ̀ aláápọn ἀπελθόντες àti subjunctive ἑτοιμάσωμεν pọ̀ ní ọ̀nà Yorùbá àdánidá, láìsọ ìtẹ̀lé ìṣe náà nù.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: kí o lè jẹ oúnjẹ Ìrékọjá
  rationale: “Kí o lè” fi ète ἵνα hàn. Nínú àyíká jíjẹ, πάσχα ń tọ́ka sí oúnjẹ Ìrékọjá, nítorí náà “oúnjẹ” mú ìtumọ̀ náà ṣe kedere.
theological_decisions:
- issue: Ohun tí πάσχα ń tọ́ka sí ní àwọn ibi méjèèjì nínú ẹsẹ náà
  choice: Ní ibi àkọ́kọ́, “ọ̀dọ́-àgùntàn Ìrékọjá”; ní ibi kejì, “oúnjẹ Ìrékọjá.”
  alternative: Kí a túmọ̀ àwọn méjèèjì sí “Ìrékọjá” láìfi ọ̀rọ̀ míì kún un.
  rationale: 'Ọ̀rọ̀-ìṣe tó bá πάσχα rìn ló ń pinnu ìtumọ̀ rẹ̀ ní ibi kọ̀ọ̀kan: θύω tọ́ka sí ẹran ìrúbọ, φάγῃς sì tọ́ka sí oúnjẹ tí a ń jẹ. Ìpinnu yìí dá lórí àyíká ọ̀rọ̀, kì í ṣe láti mú ẹsẹ náà bá ẹ̀kọ́ ìjọ kan mu.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Àjọ Àkàrà Aláìwú” àti “Ìrékọjá” jẹ́ orúkọ ayẹyẹ, nítorí náà a kọ lẹ́tà àkọ́kọ́ wọn ní ńlá. Gbólóhùn ìbéèrè náà jẹ́ àdánidá fún òǹkàwé Yorùbá, ó sì pa ète àti ìtẹ̀lé àwọn ìṣe inú Gíríìkì mọ́.
