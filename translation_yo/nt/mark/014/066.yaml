source:
  edition: SBLGNT
  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: yo
  text: Nígbà tí Pétérù wà ní ìsàlẹ̀ nínú àgbàlá[a], ọ̀kan lára àwọn ìránṣẹ́bìnrin olórí àlùfáà dé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan lára àwọn ọmọbìnrin ẹrú ti olórí àlùfáà.” Ọ̀rọ̀ Gíríìkì παιδίσκη lè tọ́ka sí ìránṣẹ́bìnrin tàbí ọmọbìnrin ẹrú; a lo “ìránṣẹ́bìnrin” níhìn-ín nítorí pé ipa rẹ̀ nínú agbo ilé ni ìtàn náà tẹnu mọ́ ju ipò òfin rẹ̀ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Nígbà tí Pétérù sì wà
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò Yorùbá tó ṣe déédé, ní mímú ìṣe tó ń lọ lọ́wọ́ nínú àgbékalẹ̀ ìtàn náà mọ́.
- source_word: κάτω
  choice: ní ìsàlẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ipò tí ó wà ní apá ìsàlẹ̀; ‘ní ìsàlẹ̀’ jẹ́ èdè Yorùbá adayébá tó sì pa ìyàtọ̀ ibi mọ́.
- source_word: ἐν τῇ αὐλῇ
  choice: nínú àgbàlá
  rationale: Ní àyíká yìí, αὐλή ni àgbàlá inú ilé olórí àlùfáà, ‘àgbàlá’ sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ἔρχεται
  choice: dé
  rationale: Bí ó tilẹ̀ jẹ́ pé historical present ni Gíríìkì lò, ‘dé’ bá ọ̀nà ìtàn Yorùbá mu, ó sì fi hàn pé obìnrin náà wọ ibi tí Pétérù wà.
- source_word: μία τῶν παιδισκῶν
  choice: ọ̀kan lára àwọn ọ̀dọ́bìnrin ìránṣẹ́
  rationale: παιδίσκη lè túmọ̀ sí ọ̀dọ́bìnrin tó ń ṣiṣẹ́ gẹ́gẹ́ bí ìránṣẹ́ tàbí ẹrú. Àṣàyàn yìí sọ ìbálòpọ̀, ọjọ́-orí tó ṣeé ṣe, àti ipò iṣẹ́ ilé rẹ̀, láì pinnu ipò òfin rẹ̀ ju ohun tí àyíká fi hàn lọ.
- source_word: τοῦ ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Genitive náà fi ìbáṣepọ̀ rẹ̀ pẹ̀lú agbo ilé olórí àlùfáà hàn; ìṣètò Yorùbá yìí jẹ́ adayébá, ó sì ṣe kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘àwọn ọ̀dọ́bìnrin ìránṣẹ́’ láti mú ọ̀pọ̀ παιδισκῶν àti ọ̀kan nínú wọn hàn ní kedere.
