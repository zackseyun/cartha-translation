source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: yo
  text: Ó sì mú Pétérù, Jákọ́bù, àti Jòhánù lọ pẹ̀lú rẹ̀, ó sì bẹ̀rẹ̀ sí í ní ìdààmú gidigidi[a] àti ìpọ́njú ọkàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bẹ̀rẹ̀ sí í ní ìpayà ńlá.” Ọ̀rọ̀-ìṣe Gíríìkì àkọ́kọ́ nínú apá yìí lè túmọ̀ sí ìpayà, ìdágìrì, tàbí ìdààmú tó lágbára ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: mú ... lọ pẹ̀lú rẹ̀
  rationale: Èyí sọ pé Jésù yan àwọn mẹ́tẹ̀ẹ̀ta, ó sì mú wọn bá ara rẹ̀ lọ. A lo ìṣe àtẹ̀yìnwá nítorí pé ó bá ìtàn àtẹ̀yìnwá Yorùbá mu ju pípa ìsinsìnyí ìtàn Gíríìkì mọ́ lọ.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún sísọ pé wọ́n bá a lọ.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó pa agbára ìbẹ̀rẹ̀ ìṣe inú ọ̀rọ̀ Gíríìkì mọ́, kò sì sọ ìlọsíwájú ìṣẹ̀lẹ̀ náà di pẹlẹbẹ.
- source_word: ἐκθαμβεῖσθαι
  choice: ní ìdààmú púpọ̀
  rationale: Ní àyíká Gẹtisémánì, ọ̀rọ̀ náà ń tọ́ka sí ìpayà tàbí ìdààmú tó lágbára, kì í ṣe ìyàlẹ́nu lásán. Àṣàyàn yìí mú kí ìwúwo ìmọ̀lára náà hàn láìfi ìtumọ̀ àlàyé kún un.
- source_word: ἀδημονεῖν
  choice: ìpọ́njú ọkàn
  rationale: Gbólóhùn yìí sọ ìdààmú inú tó le gan-an ní Yorùbá àdánidá, ó sì jẹ́ kí ọ̀rọ̀ kejì yàtọ̀ sí ἐκθαμβεῖσθαι.
- source_word: καὶ ... καὶ
  choice: àti ... àti
  rationale: A pa àtúnsọ àsopọ̀ Máàkù mọ́ nínú àkọsílẹ̀ àwọn orúkọ àti nínú àpèjúwe ìmọ̀lára náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ipò ìmọ̀lára Jésù ní Gẹtisémánì
  choice: A sọ ìdààmú ènìyàn rẹ̀ tó jinlẹ̀ ní tààràtà pé “ní ìdààmú púpọ̀ àti ìpọ́njú ọkàn.”
  alternative: A lè lo ọ̀rọ̀ tó rọrùn bí “ẹnu yà á, ó sì ní ìdààmú,” tàbí ọ̀rọ̀ tó lágbára jù bí “ẹ̀rù ba á gidigidi, ó sì wà nínú ìrora ọkàn.”
  rationale: Ẹsẹ náà fi ìdààmú gidi, tó sì lágbára, tí Jésù ní gẹ́gẹ́ bí ènìyàn hàn. Ìtumọ̀ yìí kò dín ìdààmú náà kù, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn orúkọ ni a kọ sí Pétérù, Jákọ́bù, àti Jòhánù. Gbólóhùn náà pa ìṣètò àsopọ̀ ìtàn Máàkù mọ́, ṣùgbọ́n ó lo àkókò ìṣe àtẹ̀yìnwá tó jẹ́ àdánidá nínú ìtàn Yorùbá.
