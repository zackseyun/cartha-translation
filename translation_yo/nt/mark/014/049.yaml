  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: yo
  text: Lójoojúmọ́ ni mo wà pẹ̀lú yín nínú tẹ́ńpìlì[a], mo ń kọ́ni, ẹ kò sì mú mi[b]. Ṣùgbọ́n kí àwọn Ìwé Mímọ́ lè ṣẹ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tẹ́ńpìlì” níbí túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì àti àwọn àgbàlá rẹ̀, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ẹ kò sì fàṣẹ mú mi.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní ọ̀nà tí ó túmọ̀ Gíríìkì ní tààrà sí i: “Ṣùgbọ́n kí àwọn Ìwé Mímọ́ lè ṣẹ.” Gíríìkì gé gbólóhùn náà kúrú, kò sì sọ ọ̀rọ̀-ìṣe pàtàkì tí a lóye pé ó wà níbẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Ní ojoojúmọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó ń ṣẹlẹ̀ ní ọjọ́ kọ̀ọ̀kan, ó sì pa ìtumọ̀ pínpín ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: ni mo wà pẹ̀lú yín
  rationale: Ó fi hàn pé Jésù wà ní gbangba láàárín wọn; ‘pẹ̀lú yín’ jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó sì bá πρός pẹ̀lú ènìyàn mu ní àyíká yìí.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. A lo ọ̀rọ̀ tí gbogbo ènìyàn mọ̀, a sì ṣàlàyé ìwọ̀n ìtumọ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: διδάσκων
  choice: tí mo ń kọ́ni
  rationale: Ìṣètò yìí pa iṣẹ́ tí ó ń lọ lọ́wọ́ mọ́, ó sì dára ju lílo ọ̀rọ̀ aláìpé bí ‘kọ́’ láìsí ẹni tí a ń kọ́ lọ ní Yorùbá.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ẹ kò sì mú mi
  rationale: ‘Mú’ lè túmọ̀ sí dí ènìyàn mú tàbí fàṣẹ ọba mú un ní àyíká yìí, nítorí náà kò fi tipátipá dín κρατέω sí ọ̀rọ̀ òfin pàtó kan.
- source_word: ἀλλ’ ἵνα
  choice: Ṣùgbọ́n èyí ṣẹlẹ̀ kí
  rationale: Gíríìkì fi gbólóhùn pàtàkì sílẹ̀ láìsọ ọ́. Fífi ‘èyí ṣẹlẹ̀’ kún un mú Yorùbá jẹ́ àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìkóríta orísun náà àti àṣàyàn gangan mọ́.
- source_word: πληρωθῶσιν
  choice: lè ṣẹ
  rationale: ‘Ṣẹ’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀ tàbí Ìwé Mímọ́; ‘lè’ bá ọ̀nà ìdí/àbájáde ti ἵνα pẹ̀lú subjunctive mu.
- source_word: αἱ γραφαί
  choice: àwọn Ìwé Mímọ́
  rationale: Ọ̀pọ̀ γραφαί níbí ń tọ́ka sí àwọn ìwé mímọ́ tí Ísírẹ́lì gbà gẹ́gẹ́ bí Ìwé Mímọ́.
theological_decisions:
- issue: Gbólóhùn ìdí tí a gé kúrú àti ète Ọlọ́run
  choice: Ṣùgbọ́n èyí ṣẹlẹ̀ kí àwọn Ìwé Mímọ́ lè ṣẹ
  alternative: Ṣùgbọ́n kí àwọn Ìwé Mímọ́ lè ṣẹ
  rationale: Orísun Gíríìkì kò sọ ọ̀rọ̀-ìṣe pàtàkì lẹ́yìn ἀλλ’ ἵνα. Àṣàyàn pàtàkì fi ohun tí àyíká ń tọ́ka sí hàn fún Yorùbá àdánidá, láìsọ ju ohun tí ẹsẹ̀ náà sọ lọ nípa bí ète Ọlọ́run ṣe ń ṣiṣẹ́. Àṣàyàn gangan wà ní àlàyé ìsàlẹ̀ láti pa àìpé orísun náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, kì í ṣe àmì ọ̀wọ̀ sí ẹnì kan ṣoṣo.
