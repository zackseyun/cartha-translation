revisions:
- from: Àwọn kan sì bẹ̀rẹ̀ sí í tutọ́ sí i, wọ́n sì bo ojú rẹ̀[a], wọ́n fi ọwọ́ lù ú, wọ́n sì ń sọ fún un pé, “Sọ àsọtẹ́lẹ̀!” Àwọn ẹ̀ṣọ́ sì fi ìlù gbà á.[b]
  to: Àwọn kan sì bẹ̀rẹ̀ sí í tutọ́ sí i, wọ́n sì bo ojú rẹ̀[a], wọ́n fi ìkún ọwọ́ lù ú, wọ́n sì wí fún un pé, “Sọ àsọtẹ́lẹ̀!” Àwọn ẹ̀ṣọ́ sì fi ìgbọ́wọ́ lù ú.[b]
  rationale: Àtúnṣe náà yọ ìtumọ̀ aṣìṣe “ìlù” kúrò, ó sì fi “ìgbọ́wọ́” rọ́pò rẹ̀ fún ῥαπίσμασιν. A tún mú κολαφίζειν wá sí ìtumọ̀ pàtó rẹ̀, “fi ìkún ọwọ́ lù.” Àwọn ìyókù pa ìbámu pẹ̀lú Gíríìkì mọ́, títí kan àṣẹ ẹlẹ́yà “Sọ àsọtẹ́lẹ̀!” àti ìtumọ̀ gangan “bo ojú rẹ̀.”
