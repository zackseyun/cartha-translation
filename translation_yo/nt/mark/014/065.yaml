  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ìtòlẹ́sẹẹsẹ àti àwọn ìṣe inú Gíríìkì dáadáa: àwọn kan bẹ̀rẹ̀ sí í tutọ́ sí Jésù, wọ́n bo ojú rẹ̀, wọ́n lù ú, wọ́n sì fi àṣẹ ẹlẹ́yà náà ṣe ẹ̀gàn rẹ̀. Síbẹ̀, “fi ìlù gbà á” kò jẹ́ ìtumọ̀ tó pé: ìlù ní Yorùbá túmọ̀ sí ohun èlò ìlù, kì í ṣe ‘blows,’ ó sì lè yí ìtumọ̀ ọ̀rọ̀ náà padà. A tún sọ κολαφίζειν ní kedere gẹ́gẹ́ bí lílu pẹ̀lú ìkún ọwọ́.'
