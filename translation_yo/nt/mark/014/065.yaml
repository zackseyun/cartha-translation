language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: yo
  text: Àwọn kan sì bẹ̀rẹ̀ sí í tutọ́ sí i, wọ́n sì bo ojú rẹ̀[a], wọ́n fi ìkún ọwọ́ lù ú, wọ́n sì wí fún un pé, “Sọ àsọtẹ́lẹ̀!” Àwọn ẹ̀ṣọ́ sì fi ìgbọ́wọ́ lù ú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n dí ojú rẹ̀.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé, “wọ́n bo ojú rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹ̀ṣọ́ sì lù ú.” Gbólóhùn Gíríìkì náà sọ ní tààrà pé, “àwọn ẹ̀ṣọ́ gbà á pẹ̀lú ìgbọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: Àwọn kan sì bẹ̀rẹ̀
  rationale: Ó fi ìbẹ̀rẹ̀ ìṣe náà hàn, ó sì pa àìdánimọ̀ àwọn tó ṣe é mọ́.
- source_word: ἐμπτύειν αὐτῷ
  choice: sí í tutọ́ sí i
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n tutọ́ sí ẹni kan gẹ́gẹ́ bí ẹ̀gàn.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: wọ́n sì bo ojú rẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki láì pinnu ní pàtó pé ìṣe náà jẹ́ fífi aṣọ dí ojú.
- source_word: κολαφίζειν αὐτόν
  choice: wọ́n fi ọwọ́ lù ú
  rationale: Ọ̀rọ̀ náà tọ́ka sí lílu ẹni ní ọwọ́, ó sì ṣeé lóye dáadáa ní Yorùbá láì sọ ju ẹ̀rí ọ̀rọ̀ náà lọ.
- source_word: Προφήτευσον
  choice: Sọ àsọtẹ́lẹ̀!
  rationale: Ó pa àṣẹ ẹlẹ́yà tó ṣókí mọ́ láì fi àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: οἱ ὑπηρέται
  choice: Àwọn ẹ̀ṣọ́
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, ó tọ́ka sí àwọn òṣìṣẹ́ abẹ́ àṣẹ tó ń ṣọ́ tàbí mú ẹni, kì í ṣe ìránṣẹ́ ilé.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: fi ìlù gbà á
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì, ‘gbà á pẹ̀lú ìlù,’ mọ́ ní ọ̀nà Yorùbá tó ṣókí, bí ó tilẹ̀ jẹ́ pé gbólóhùn náà ní ìtumọ̀ méjì díẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ ẹlẹ́yà Προφήτευσον nípa ẹni tí Jésù jẹ́
  choice: Sọ àsọtẹ́lẹ̀!
  alternative: Fi hàn pé wòlíì ni ọ́!
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àṣẹ lásán; ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un, ó sì jẹ́ kí ìfọ̀rọ̀yà ìtàn náà dúró.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá bá èdè mu. A pa ìtumọ̀ aláìdánilójú nínú gbólóhùn ìkẹyìn mọ́, a sì ṣàlàyé ọ̀nà míì nínú àlàyé ìsàlẹ̀.
