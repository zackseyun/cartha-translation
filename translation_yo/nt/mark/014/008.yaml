source:
  edition: SBLGNT
  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: yo
  text: Ó ṣe ohun tí ó lè ṣe[a]; ó ti fi òróró olóòórùn dídùn kun ara mi ṣáájú fún ìsìnkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó túbọ̀ tẹ̀ lé ọ̀rọ̀ gangan, “Ohun tí ó ní, ó ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Ó ṣe ohun tí ó lè ṣe
  rationale: 'Èyí mú agbára àṣà-ọrọ Gíríìkì náà jáde ní Yorùbá àdánidá: obìnrin náà ṣe gbogbo ohun tí agbára rẹ̀ gbà. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan mọ́.'
- source_word: προέλαβεν
  choice: ṣáájú
  rationale: Ọ̀rọ̀ náà tọ́ka sí ṣíṣe ohun kan tẹ́lẹ̀, kì í ṣe wíwá tàbí rírìn dé ṣáájú.
- source_word: μυρίσαι
  choice: fi òróró olóòórùn dídùn kun
  rationale: Nínú àyíká yìí, ó túmọ̀ sí lílo òróró olóòórùn dídùn sí ara; gbólóhùn yìí ṣe kedere fún òǹkàwé Yorùbá òde òní, ó sì yẹ fún ìmúrasílẹ̀ òkú fún ìsìnkú.
- source_word: τὸ σῶμά μου
  choice: ara mi
  rationale: Ìtumọ̀ tààrà àti àdánidá ni Yorùbá.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: fún ìsìnkú
  rationale: Ó pa ète ìṣe náà mọ́ láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ṣíṣe kókó-ọ̀rọ̀ abo hàn bí ó tilẹ̀ jẹ́ pé kò fara hàn gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀ nínú ẹsẹ yìí
  choice: Ó ṣe … ó ti fi …
  alternative: Ohun tí ó ní, ó ṣe …
  rationale: Àwọn ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ẹni kẹta ẹyọ, àyíká tó ṣáájú sì fi hàn pé obìnrin náà ni wọ́n ń sọ̀rọ̀ nípa rẹ̀. Yorùbá kò nílò fífi akọ tàbí abo hàn nínú arọ́pò-orúkọ ‘ó’, nítorí náà a pa ìtọ́kasí náà mọ́ láìfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- issue: Bí a ṣe máa sọ ìbáṣepọ̀ ìṣe obìnrin náà pẹ̀lú ìsìnkú Jesu
  choice: ó ti fi òróró olóòórùn dídùn kun ara mi ṣáájú fún ìsìnkú
  alternative: ó ti múra ara mi sílẹ̀ ṣáájú fún ìsìnkú pẹ̀lú òróró olóòórùn dídùn
  rationale: Àṣàyàn náà pa àwòrán ìṣe fífi òróró kun ara mọ́, ó sì yàgò fún ṣíṣe àlàyé ohun tí ọrọ̀ Gíríìkì sọ lọ́nà gbòòrò ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. ‘Òróró olóòórùn dídùn’ yà ‘múron’ yìí sọ́tọ̀ kúrò lọ́dọ̀ òróró lasan, ‘ìsìnkú’ sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀ fún burial.
