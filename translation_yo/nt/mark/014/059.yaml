  text: And not even in this way was their testimony consistent[a].
translation:
  language: yo
  text: Kódà ní ọ̀nà yìí, ẹ̀rí wọn kò bára wọn mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí wọn kò fohùn ṣọ̀kan”; ní ìtumọ̀ gangan, “ẹ̀rí wọn kò dọ́gba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Àní
  rationale: Ní ìṣọ̀kan pẹ̀lú οὐδὲ, ó so gbólóhùn náà mọ́ ohun tó ṣáájú, ó sì mú ìtẹnumọ́ ‘kódà’ jáde lọ́nà àdánidá ní Yorùbá.
- source_word: οὐδὲ
  choice: kò ... pàápàá
  rationale: Ó fi ìkọ̀ emphatic hàn pé kódà lábẹ́ àpẹẹrẹ ẹ̀rí yìí, wọn kò fohùn ṣọ̀kan.
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó tọ́ka padà sí irú ẹ̀sùn tí àwọn ẹlẹ́rìí ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú.
- source_word: ἴση
  choice: bára mu
  rationale: Ìtumọ̀ gangan ni ‘dọ́gba,’ ṣùgbọ́n nínú ọ̀rọ̀ ẹ̀rí ilé-ẹjọ́, ó túmọ̀ sí pé ẹ̀rí wọn kò bá ara wọn mu tàbí kò fohùn ṣọ̀kan.
- source_word: ἦν
  choice: kò ... mu
  rationale: Ọ̀rọ̀-ìṣe àìpé ti εἰμί wà nínú ìkọ̀; Yorùbá fi ìtumọ̀ rẹ̀ hàn lọ́nà àdánidá nínú ‘kò bára mu.’
- source_word: ἡ μαρτυρία
  choice: ẹ̀rí
  rationale: Nínú àyíká ìgbẹ́jọ́, μαρτυρία jẹ́ ẹ̀rí tí ẹlẹ́rìí ń jẹ́; ‘ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ó jẹ́ arọ́pò-orúkọ ohun-ìní ọ̀pọ̀, tí ‘wọn’ túmọ̀ sí lọ́nà àdánidá nínú ‘ẹ̀rí wọn.’
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Bára mu’ jẹ́ gbólóhùn àdánidá, ọ̀wọ̀, tí òǹkàwé òde òní lè lóye, ó sì pa àìṣọ̀kan ẹ̀rí inú ọ̀rọ̀ Gíríìkì mọ́.
