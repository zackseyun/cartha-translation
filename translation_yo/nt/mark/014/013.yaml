  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: yo
  text: Ó sì rán méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì sọ fún wọn pé, “Ẹ lọ sínú ìlú náà; ọkùnrin kan tí ó ń ru ìkòkò omi[a] yóò pàdé yín. Ẹ tẹ̀ lé e.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìkòkò amọ̀ tí omi wà nínú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλει
  choice: Ó sì rán
  rationale: A lo ìṣe ìtàn Yorùbá tó ṣe déédé pẹ̀lú àsopọ̀ “sì”; bí ó tilẹ̀ jẹ́ pé Gíríìkì lo present tense ìtàn, fífi present tense ṣe ní Yorùbá kì í dun bí ìtàn àdánidá.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Méjì lára” fi partitive construction hàn kedere, “ọmọ-ẹ̀yìn” sì ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής.
- source_word: λέγει αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ taara, láìsọ agbára ọ̀rọ̀ Gíríìkì nù.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Ẹ lọ sínú ìlú náà
  rationale: “Sínú” pa ìtumọ̀ ìṣípò wọ inú ibi mọ́; “ẹ” jẹ́ àṣẹ fún ẹni púpọ̀.
- source_word: ἀπαντήσει ὑμῖν
  choice: yóò pàdé yín
  rationale: Ìtumọ̀ ọjọ́ iwájú àti ẹni púpọ̀ nínú dative object ni a mú jáde ní Yorùbá tó ṣe kedere.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ọkùnrin pàtó kan, kì í ṣe ènìyàn lápapọ̀.
- source_word: κεράμιον ὕδατος
  choice: ìkòkò omi
  rationale: “Ìkòkò omi” jẹ́ gbolohun Yorùbá tó rọrùn, tó sì fi ohun èlò àti ohun tó wà nínú rẹ̀ hàn; àlàyé pé ó lè jẹ́ ohun amọ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: βαστάζων
  choice: tí ó gbé
  rationale: Relative construction yìí jẹ́ ọ̀nà Yorùbá àdánidá fún participle tó ń ṣàpèjúwe ohun tí ọkùnrin náà ń ṣe.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Ẹ tẹ̀ lé e
  rationale: Àṣẹ taara fún ẹni púpọ̀ ni, ó sì jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún “follow him.”
theological_decisions: []
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ọ̀rọ̀ ìtàn ni a ṣe ní past narrative Yorùbá dípò lílo historical present Gíríìkì ní líle, kí gbolohun lè ṣàn dáadáa.
