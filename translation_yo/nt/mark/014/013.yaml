  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: àwọn ọmọ-ẹ̀yìn méjì, ìlú náà, ọkùnrin kan, ìkòkò omi, àti àṣẹ láti tẹ̀ lé e ni a gbé kalẹ̀ ní kíkún. Ṣùgbọ́n "tí ó gbé" lè ka sí ìṣe tí ó ti ṣẹlẹ̀, nígbà tí βαστάζων ń ṣàpèjúwe ọkùnrin náà gẹ́gẹ́ bí ẹni tí ó ń ru ìkòkò náà nígbà tí wọn bá pàdé rẹ̀.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tó rọrùn, tó sì ní ìpele ìbòwò tó yẹ. "Tí ó ń ru ìkòkò omi" jẹ́ ọ̀nà tó túbọ̀ dáa láti sọ ìṣe tí ń lọ lọ́wọ́ náà; "ru" sì bá bí a ṣe máa ń gbé ohun èlò bí ìkòkò mu.
  terminology: '"Ọmọ-ẹ̀yìn," "ìlú," "ọkùnrin," àti "tẹ̀ lé" jẹ́ àwọn ọ̀rọ̀ tó yẹ, tó sì bá ìforúkọsílẹ̀ ìtàn náà mu. "Ìkòkò omi" jẹ́ ìtumọ̀ kedere fún κεράμιον ὕδατος; àlàyé ìsàlẹ̀ náà tọ́ka dáadáa sí ohun amọ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.'
