  to: Ó sì rán méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì sọ fún wọn pé, “Ẹ lọ sínú ìlú náà; ọkùnrin kan tí ó ń ru ìkòkò omi[a] yóò pàdé yín. Ẹ tẹ̀ lé e.”
