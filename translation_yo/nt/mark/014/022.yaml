language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: yo
  text: Bí wọ́n sì ti ń jẹun, ó mú búrẹ́dì, ó bù kún un, ó ṣẹ́ é, ó sì fi fún wọn. Ó ní, “Ẹ gbà; èyí ni ara mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn mìíràn lè túmọ̀ rẹ̀ sí, “èyí dúró fún ara mi” tàbí “èyí túmọ̀ sí ara mi.” Ní tààrà, Gíríìkì náà sọ pé, “èyí ni ara mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Bí wọ́n sì ti ń jẹun
  rationale: Ọ̀rọ̀ yìí fi hàn pé jíjẹun náà ń lọ lọ́wọ́ nígbà tí ìṣe tó tẹ̀ lé e ṣẹlẹ̀; “bí … ti ń” jẹ́ ọ̀nà àdánidá láti sọ ìṣe méjì tó ń ṣẹlẹ̀ ní àkókò kan.
- source_word: λαβὼν ἄρτον
  choice: ó mú búrẹ́dì
  rationale: A yí participle Gíríìkì náà sí ọ̀rọ̀-ìṣe aláṣẹ fún ìtàn Yorùbá tó rọrùn. ἄρτον kò ní article, nítorí náà “búrẹ́dì” kò sọ ohun tí orísun kò sọ ní pàtó.
- source_word: εὐλογήσας
  choice: ó súre lórí rẹ̀
  rationale: Nínú àyíká oúnjẹ, ọ̀rọ̀ náà tọ́ka sí sísọ ìbùkún lórí búrẹ́dì; gbolohun yìí jẹ́ ti Yorùbá àdánidá, kò sì yí i sí “dúpẹ́” nìkan.
- source_word: ἔκλασεν
  choice: ó bù ú
  rationale: “Bù” ni ọ̀rọ̀ Yorùbá tó bójú mu fún pípa apá kan kúrò lára búrẹ́dì; arọ́pò-orúkọ náà tọ́ka padà sí búrẹ́dì.
- source_word: ἔδωκεν αὐτοῖς
  choice: ó sì fi fún wọn
  rationale: Ọ̀rọ̀ yìí ṣàfihàn fífi búrẹ́dì náà fún wọn láìfi ìtumọ̀ míì kún un.
- source_word: Λάβετε
  choice: Ẹ gbà
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; “Ẹ gbà” sọ ìpè láti gba búrẹ́dì náà lọ́nà tààrà, ó sì yẹra fún fífi ohun tí kò hàn gbangba nínú Gíríìkì kún un.
- source_word: τοῦτό ἐστιν
  choice: èyí ni
  rationale: Èyí ni ìtumọ̀ tààrà fún copula Gíríìkì, ó sì pa àìdánilójú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́ láìṣàlàyé rẹ̀ sínú ọ̀rọ̀.
- source_word: τὸ σῶμά μου
  choice: ara mi
  rationale: σῶμα túmọ̀ sí “ara”; kò sí ìdí nínú àyíká láti rọ́pò rẹ̀ pẹ̀lú àlàyé àpẹẹrẹ nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Jésù nípa búrẹ́dì nínú Oúnjẹ Alẹ́
  choice: “èyí ni ara mi”
  alternative: “èyí dúró fún ara mi” tàbí “èyí túmọ̀ sí ara mi”
  rationale: Gíríìkì lo copula ἐστιν (“ni/jẹ́”). Ìtumọ̀ pàtàkì náà tẹ̀ lé ọ̀rọ̀ orísun, ó sì pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ mọ́ dípò kí ó yan ìtumọ̀ ẹ̀sìn kan.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ìtẹ̀síwájú ìtàn tó ṣe kedere, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀sìn tó lè yan ìtumọ̀ ẹgbẹ́ kan.
