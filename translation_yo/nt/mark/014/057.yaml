translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘ń’ láti pa ipa imperfect mọ́, a sì lo ọ̀rọ̀ tó bá àyíká ilé ẹjọ́ mu.
