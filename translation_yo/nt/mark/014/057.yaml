base_translation:
  language: en
  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: yo
  text: Àwọn kan sì dìde, wọ́n ń jẹ́rìí èké lòdì sí i[a], wọ́n ní,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìsọ̀rọ̀ ìbílẹ̀, “wọ́n ń jẹ́ ẹlẹ́rìí èké lòdì sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: sì
  rationale: Ó so ìṣe yìí mọ́ ohun tó ṣáájú rẹ̀, ó sì pa ìṣàn ìtàn Máàkù mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó tọ́ka sí àwọn ènìyàn tí a kò dárúkọ, láìfi iye tàbí ìdánimọ̀ wọn kún ọ̀rọ̀ náà.
- source_word: ἀναστάντες
  choice: dìde
  rationale: Ó fi ìṣe dídìde hàn ní àyíká ìgbẹ́jọ́, ó sì bá àkópọ̀ participle Gíríìkì mu lọ́nà Yorùbá tó rọrùn.
- source_word: ἐψευδομαρτύρουν
  choice: wọ́n ń jẹ́rìí èké
  rationale: Àmì ‘ń’ fi ipa imperfect hàn gẹ́gẹ́ bí ìṣe tó ń lọ lọ́wọ́ tàbí tí wọ́n ń ṣe léraléra; ‘jẹ́rìí èké’ sì mú ìtumọ̀ ẹ̀rí ilé ẹjọ́ náà jáde kedere.
- source_word: κατ’ αὐτοῦ
  choice: lòdì sí i
  rationale: Nínú àyíká ẹjọ́ yìí, κατά pẹ̀lú genitive ní agbára ọ̀tá; ‘lòdì sí i’ pa ìtumọ̀ pé ẹ̀rí náà ń tako Jésù mọ́.
- source_word: λέγοντες
  choice: wọ́n ní,
  rationale: Ó ṣí ọ̀nà fún ohun tí wọ́n sọ ní ẹsẹ tó tẹ̀ lé, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ọ̀rọ̀ àyọlò ní Yorùbá.
