  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: yo
  text: Wọ́n sì mú Jésù lọ sọ́dọ̀ olórí àlùfáà; gbogbo àwọn olórí àlùfáà, àwọn àgbààgbà àti àwọn akọ̀wé sì péjọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀rọ̀ náà wà ní àsìkò ìsinsìnyí, ìyẹn “wọ́n péjọ/wọ́n ń péjọ,” láti mú kí ìtàn àsìkò àtijọ́ náà hàn bí ohun tó ń ṣẹlẹ̀ lójú ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: mú ... lọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú tàbí dídarí ẹnì kan kúrò lọ sí ibòmíràn. “Mú Jésù lọ” jẹ́ èdè Yorùbá àdánidá, ó sì bá ipò ẹni tí wọ́n mú lọ lábẹ́ àṣẹ mu láìfi ọ̀nà tí wọ́n gbà mú un kún ọ̀rọ̀ náà.
- source_word: ἀρχιερέα
  choice: olórí àlùfáà
  rationale: Ní ẹyọ ọ̀rọ̀, ó tọ́ka sí ẹni tí ó wà ní ipò olórí iṣẹ́ àlùfáà; yíyan “olórí àlùfáà” tún yà á sọ́tọ̀ kúrò lọ́dọ̀ ẹgbẹ́ àwọn olórí àlùfáà tí a mẹ́nu kàn lẹ́yìn náà.
- source_word: συνέρχονται
  choice: péjọ
  rationale: Ó túmọ̀ sí pé wọ́n kóra jọ sí ibi kan. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí inú ìtàn àsìkò àtijọ́, “péjọ” jẹ́ ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ náà ní Yorùbá.
- source_word: πάντες
  choice: gbogbo
  rationale: “Gbogbo” pa ìtẹnumọ́ Gíríìkì mọ́ pé àwọn ẹgbẹ́ aṣáájú tí a dárúkọ náà lápapọ̀ ni wọ́n péjọ.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ní ọ̀pọ̀ ọ̀rọ̀, ó tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àlùfáà, kì í ṣe ọ̀pọ̀ ẹni tí gbogbo wọn ń di ipò olórí àlùfáà ẹyọ náà mú ní àkókò kan.
- source_word: πρεσβύτεροι
  choice: àwọn àgbààgbà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àwọn olórí tí a mọ̀ sí àgbààgbà láàárín àwọn ènìyàn, kì í ṣe àwọn arúgbó lásán.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” jẹ́ ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì jẹ́ orúkọ tí a mọ̀ fún ẹgbẹ́ àwọn amòye Ìwé Mímọ́ àti òfin ní àyíká Ihinrere.
theological_decisions:
- issue: Lílo συνέρχονται ní àsìkò ìsinsìnyí nínú ìtàn àsìkò àtijọ́
  choice: A túmọ̀ ọ́ ní ìrísí ìtàn Yorùbá àdánidá pé “péjọ,” a sì fi àlàyé sí àlàyé ìsàlẹ̀.
  alternative: “wọ́n sì ń péjọ” tàbí ìrísí ìsinsìnyí mìíràn láti fara mọ́ historical present ní tààràtà
  rationale: Èyí jẹ́ ìpinnu ọ̀nà ìtumọ̀, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Ìrísí tí a yàn jẹ́ kí ìtàn ṣàn dáadáa ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa àkíyèsí nípa ìrísí Gíríìkì mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “àlùfáà” gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀ fún ἱερεύς, “àwọn àgbààgbà” fún ipò aṣáájú, àti “àwọn akọ̀wé” láìfi ìtumọ̀ iṣẹ́ wọn tó dín kù sí i.
