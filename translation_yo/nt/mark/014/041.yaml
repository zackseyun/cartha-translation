id: MRK.14.41
reference: Mark 14:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: yo
  text: Ó sì wá ní ìgbà kẹta, ó sì sọ fún wọn pé, “Ṣé ẹ ṣì ń sùn, ẹ sì ń sinmi?[a] Ó tó![c] Wákàtí náà ti dé. Ẹ wò ó, a ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Ẹ máa sùn lọ, kí ẹ sì sinmi.” Ọ̀rọ̀ Gíríìkì lè jẹ́ ìyọ̀ǹda ẹ̀gàn tàbí ìbéèrè ìbáwí pé, “Ṣé ẹ ṣì ń sùn, ẹ sì ń sinmi?”
    reason: alternative_reading
  - marker: c
    text: “Ó tó!” túmọ̀ gbólóhùn Gíríìkì kan tí ó ṣòro. Àwọn ìtumọ̀ mìíràn ni “Ó tó bẹ́ẹ̀,” tàbí, èyí tí kò fi bẹ́ẹ̀ ṣeé ṣe níbí, ìtumọ̀ ọjà bí “a ti gba owó náà ní kíkún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Ó sì wá ní ìgbà kẹta
  rationale: A lo ìṣe ìtàn Yorùbá ní ọ̀nà àdánidá; “ní ìgbà kẹta” fi ìtumọ̀ τὸ τρίτον hàn kedere.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Ẹ̀yin ṣì ń sùn, ẹ sì ń sinmi bí?
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ àṣẹ ẹ̀gàn tàbí ìbéèrè ìbáwí. Ìbéèrè yìí jẹ́ Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: ἀπέχει
  choice: Ó tó bẹ́ẹ̀
  rationale: Gbólóhùn náà ṣòro ní Gíríìkì; “Ó tó bẹ́ẹ̀” mú ìtumọ̀ idiomatic ‘ó tó’ jáde láìfi ìtumọ̀ ọjà tàbí ẹ̀kọ́ àròsọ kún un.
- source_word: ἦλθεν ἡ ὥρα
  choice: wákàtí náà ti dé
  rationale: “Wákàtí” pa àwòrán àti ìtẹnumọ́ àkókò tí a yàn mọ́ dípò fífi sí ‘àkókò’ lásán.
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ìkìlọ̀ àdánidá ní Yorùbá tí ó pa agbára deictic ọ̀rọ̀ náà mọ́.
- source_word: παραδίδοται
  choice: a ń fi ... lé ... lọ́wọ́
  rationale: Ó pa ìtumọ̀ gbòòrò ‘fà lé lọ́wọ́/fi lé lọ́wọ́’ mọ́, kò sì dín un kù sí ìwà ọ̀dàlẹ̀ Júdásì nìkan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà tí ó wọ́pọ̀, tí ó sì pa ìdánimọ̀ rẹ̀ mọ́.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́
  rationale: Ọ̀nà Yorùbá yìí pa àwòrán fífi ẹnì kan sábẹ́ agbára àwọn ẹlòmíràn mọ́.
theological_decisions:
- issue: Agbára Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Ìbéèrè ìbáwí: “Ẹ̀yin ṣì ń sùn, ẹ sì ń sinmi bí?”'
  alternative: 'Àṣẹ tàbí ìyọ̀ǹda ẹ̀gàn: “Ẹ máa sùn lọ, kí ẹ sì sinmi.”'
  rationale: Àmì ìdákẹ́jẹ inú àwọn ẹ̀dà àkọ́kọ́ kò pinnu ọ̀rọ̀ náà. Ìbéèrè bá àyíká mu dáadáa ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ mìíràn mọ́.
- issue: Ìtumọ̀ ἀπέχει
  choice: “Ó tó bẹ́ẹ̀”
  alternative: “Ó tó!” tàbí ìtumọ̀ ọjà bí “a ti san án ní kíkún”
  rationale: Ìtumọ̀ tí a yàn bá ìyípadà ìṣẹ̀lẹ̀ mu láìgbé ìtumọ̀ amọ̀jà tí kò dájú wọlé.
- issue: Ìtumọ̀ παραδίδοται
  choice: “a ń fi ... lé ... lọ́wọ́”
  alternative: “a ń dà ...” tàbí “a ń fi ... fún”
  rationale: Èyí pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ náà mọ́, kò sì fi Júdásì nìkan hàn gẹ́gẹ́ bí aṣojú gbogbo ìṣe náà.
translation_notes:
  register: Yorùbá àpéwọ̀, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ̀yin” láti mú ìbáwí sí ọ̀pọ̀ ènìyàn hàn, àti “a ń fi ... lé ... lọ́wọ́” láti jẹ́ kí àwòrán Gíríìkì ye àwọn òǹkàwé lónìí.
