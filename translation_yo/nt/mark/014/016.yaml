  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì jáde, wọ́n sì dé inú ìlú náà, wọ́n sì rí i gẹ́gẹ́ bí ó ti sọ fún wọn; wọ́n sì pèsè Pásíkà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ Pásíkà.” Ọ̀rọ̀ Gíríìkì náà, τὸ πάσχα, lè tọ́ka sí Pásíkà lápapọ̀ tàbí, nínú àyíká ọ̀rọ̀ yìí, sí oúnjẹ tí wọ́n ń pèsè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: jáde
  rationale: Ó túmọ̀ sí pé wọ́n kúrò ní ibi tí wọ́n wà; “jáde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì bá ìtàn náà mu.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn tó ń tẹ̀lé Jesu tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: wọ́n sì dé inú ìlú náà
  rationale: “Dé inú ìlú náà” fi ìlọsíwájú wọn sínú ìlú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: εὗρον
  choice: wọ́n sì rí i
  rationale: Ohun tí wọ́n rí kò hàn gbangba gẹ́gẹ́ bí ọ̀rọ̀-orúkọ nínú Gíríìkì; “rí i” pa ìtọ́ka gbogbogbò sí bí gbogbo nǹkan ṣe rí mọ́.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: gẹ́gẹ́ bí ó ti sọ fún wọn
  rationale: Èyí fi ìbámu pẹ̀lú ohun tí Jesu ti sọ tẹ́lẹ̀ hàn láìfi àlàyé míì kún un.
- source_word: ἡτοίμασαν
  choice: wọ́n sì pèsè
  rationale: “Pèsè” túmọ̀ sí mímú ohun tí a nílò ṣe tán tàbí mímú un múra sílẹ̀, ó sì yẹ fún àyíká yìí.
- source_word: τὸ πάσχα
  choice: Pásíkà
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àjọyọ̀ Pásíkà lápapọ̀ tàbí sí oúnjẹ Pásíkà ní pàtó; “Pásíkà” pa àìdánilójú gidi inú Gíríìkì mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. Àtúnwí “wọ́n sì” ń pa ìtẹ̀síwájú àwọn καὶ inú Gíríìkì mọ́ láìsọ gbolohun náà di àjèjì.
