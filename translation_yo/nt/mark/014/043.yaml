source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, nígbà tí ó ṣì ń sọ̀rọ̀, Júdásì, ọ̀kan nínú àwọn Méjìlá náà, dé[a]. Ọ̀pọ̀ ènìyàn[b] tí wọ́n mú idà àti kùmọ̀[c] sì wà pẹ̀lú rẹ̀; àwọn ènìyàn wọ̀nyí wá láti ọ̀dọ̀ àwọn olórí àlùfáà, àwọn akọ̀wé, àti àwọn àgbààgbà[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ ìṣe Gíríìkì wà ní àsìkò ìsinsìnyí, ‘ń dé,’ láti mú kí ìtàn náà dà bí ohun tí ń ṣẹlẹ̀ níwájú ẹni; a tún lè túmọ̀ ọ́ sí ‘wá.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé ‘àwùjọ ènìyàn.’ Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘ọ̀pọ̀ ènìyàn’ tàbí ‘àwùjọ’; àwọn ohun ìjà inú àyíká ọ̀rọ̀ fi hàn pé ẹgbẹ́ náà wá fún ìjà.
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, ‘igi’ tàbí ‘àwọn ohun igi’; níhìn-ín ó ń tọ́ka sí kùmọ̀ tàbí ọ̀pá tí a lò gẹ́gẹ́ bí ohun ìjà.
    reason: lexical_alternative
  - marker: d
    text: A tún lè túmọ̀ ọ́ sí, ‘àwọn olórí àlùfáà, àwọn akọ̀wé, àti àwọn àgbààgbà rán wọn.’ Gíríìkì sọ ní tààrà pé wọ́n wá ‘láti ọ̀dọ̀’ wọn, èyí tó lè fi orísun tàbí àṣẹ hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀ lójijì àti bí ìtàn Máàkù ṣe ń yára lọ hàn ní èdè Yorùbá àdánidá.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: bí ó sì ti ń sọ̀rọ̀ lọ́wọ́
  rationale: Gbólóhùn yìí fi hàn pé dídé Júdásì ṣẹlẹ̀ ní àkókò kan náà tí Jésù ṣì ń sọ̀rọ̀.
- source_word: παραγίνεται
  choice: dé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí tí a lò láti mú ìtàn yè kooro; àsìkò tí ó ti kọjá dára jù ní ìtàn Yorùbá àdánidá.
- source_word: Ἰούδας
  choice: Júdásì
  rationale: A kọ orúkọ náà ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: εἷς τῶν δώδεκα
  choice: ọ̀kan nínú àwọn Méjìlá náà
  rationale: Ó pa àpèjúwe kúkúrú tó wà nínú Gíríìkì mọ́ láìfi ‘ọmọ-ẹ̀yìn’ kún un.
- source_word: ὄχλος
  choice: ọ̀pọ̀ ènìyàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘crowd’; àwọn ohun ìjà inú àyíká ọ̀rọ̀ ló fi ìwà ọ̀tá wọn hàn.
- source_word: μετὰ μαχαιρῶν
  choice: wọ́n mú idà ... lọ́wọ́
  rationale: Ìtumọ̀ yìí sọ ní Yorùbá àdánidá pé idà wà pẹ̀lú wọn gẹ́gẹ́ bí ohun ìjà.
- source_word: ξύλων
  choice: kùmọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí igi tàbí ohun tí a fi igi ṣe, nínú àyíká yìí ó ń tọ́ka sí kùmọ̀ tí a fi ń jà.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: láti ọ̀dọ̀ àwọn olórí àlùfáà, àwọn akọ̀wé àti àwọn àgbààgbà ni wọ́n ti wá
  rationale: ‘Láti ọ̀dọ̀’ pa ìtumọ̀ orísun tàbí àṣẹ mọ́ láìsọ ní pàtó pé àwọn aṣáájú náà ‘rán’ wọn, èyí tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
- source_word: ἀρχιερέων
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn aṣáájú àlùfáà, kì í ṣe sí ọ̀pọ̀ àlùfáà àgbà tí gbogbo wọn ń ṣiṣẹ́ ní ipò kan náà.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìbámu ọ̀rọ̀ tààrà tí ó pa ipò ẹgbẹ́ náà mọ́.
- source_word: πρεσβυτέρων
  choice: àwọn àgbààgbà
  rationale: Ó pa ìtumọ̀ àwọn aṣáájú tí a mọ̀ sí àgbààgbà nínú àwùjọ Júù mọ́.
theological_decisions:
- issue: Àsìkò ọ̀rọ̀ ìṣe παραγίνεται
  choice: A túmọ̀ ọ́ sí àsìkò tí ó ti kọjá, ‘dé’.
  alternative: A lè pa àsìkò ìsinsìnyí Gíríìkì mọ́ pé ‘ń dé’ láti mú ìṣẹ̀lẹ̀ náà yè kooro.
  rationale: Lílo àsìkò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń tọ́ka sí ìrísí Gíríìkì.
- issue: Agbára παρὰ nípa àwọn aláṣẹ
  choice: A lò ‘láti ọ̀dọ̀’ láti fi orísun tàbí àṣẹ hàn.
  alternative: ‘Àwọn olórí àlùfáà, àwọn akọ̀wé àti àwọn àgbààgbà rán wọn.’
  rationale: Ọ̀rọ̀ náà so àwọn ènìyàn náà mọ́ àwọn aláṣẹ, ṣùgbọ́n kò sọ ọ̀nà tí wọ́n gbà rán wọn ní pàtó; ìtumọ̀ náà kò gbọdọ̀ fi àlàyé tí kò sí kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá. A yà gbólóhùn gígùn Gíríìkì sí méjì fún kíkà tó rọrùn, ṣùgbọ́n a pa ìtẹ̀síwájú àti gbogbo ìsọfúnni inú ẹsẹ náà mọ́. ‘Àwọn Méjìlá’ ni a lò gẹ́gẹ́ bí orúkọ ẹgbẹ́ pàtàkì, ‘kùmọ̀’ sì jẹ́ ọ̀rọ̀ àdánidá fún ohun ìjà igi.
