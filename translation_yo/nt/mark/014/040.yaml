source:
  edition: SBLGNT
  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: yo
  text: Nígbà tí ó tún dé, ó bá wọn tí wọ́n ń sùn, nítorí ojú wọn ń wọ̀ wọ́n lójú[a], wọn kò sì mọ ohun tí wọn lè fi dá a lóhùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, èdè Gíríìkì fi ojú wọn hàn bí ẹni pé a ń fi ẹrù wọ̀ wọ́n mọ́lẹ̀. Ìyẹn lè túmọ̀ sí pé ojú wọn ń wọ̀ wọ́n lójú nítorí oorun.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Nígbà tí ó tún dé
  rationale: Ó fi hàn pé Jésù tún wá sí ọ̀dọ̀ wọn lẹ́ẹ̀kan sí i, ó sì sọ ìṣe participle náà di Yorùbá àdánidá.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: ó bá wọn tí wọ́n ń sùn
  rationale: “Ó bá wọn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó rí wọn ní ipò kan; “wọ́n ń sùn” sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: nítorí ojú wọn ti wúwo
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìrírí oorun tí ń pọ̀, ó sì pa àwòrán ojú tí ó wúwo mọ́ láì fi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: οὐκ ᾔδεισαν
  choice: wọn kò sì mọ
  rationale: Ó túmọ̀ ìmọ̀ tí wọ́n kò ní ní tààrà, kì í ṣe àìlóye nìkan.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: ohun tí wọn yóò fi dá a lóhùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbéèrè aláìtààrà nípa ohun tí wọn yóò sọ ní ìdáhùn sí i.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá. Gbólóhùn “ojú wọn ti wúwo” rọrùn fún òǹkàwé, ó sì pa àwòrán èdè Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé agbára àwòrán náà sí i.
