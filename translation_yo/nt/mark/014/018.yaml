revisions:
- from: Bí wọ́n ti fi ara tì níbi oúnjẹ, tí wọ́n sì ń jẹun[a], Jésù sọ pé, “Lóòótọ́ ni mo sọ fún yín[b], ọ̀kan nínú yín yóò dà mí[c]—ẹni tí ó ń bá mi jẹun.”
  to: Nígbà tí wọ́n ń fi ara tì níbi oúnjẹ, tí wọ́n sì ń jẹun[a], Jésù sọ pé, “Lóòótọ́ ni mo sọ fún yín[b], ọ̀kan nínú yín yóò fi mí hàn[c]—ẹni tí ó ń bá mi jẹun.”
  rationale: Àtúnṣe náà rọ́pò “yóò dà mí” pẹ̀lú “yóò fi mí hàn,” kí ìtumọ̀ παραδώσει lè hàn ní kedere nínú Yorùbá, láì mú ìtumọ̀ ẹ̀kọ́ ẹ̀sìn míì wọlé. A tún ṣàtúnṣe ìbẹ̀rẹ̀ sí “Nígbà tí” fún ìṣàn-ọrọ̀ tó dára. Àwọn àmì ìsàlẹ̀ dúró ní ibi tí wọ́n tọ́ka sí, a sì ṣe àtúnṣe kékeré sí gbolohun àlàyé Àmín.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:23Z'
