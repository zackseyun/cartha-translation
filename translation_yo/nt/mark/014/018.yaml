  source_fidelity: 'Ìtumọ̀ náà mú àwọn participle méjèèjì nínú ọ̀rọ̀ Gíríìkì náà hàn: wọ́n wà ní ipò fífi ara tì, wọ́n sì ń jẹun. Ó tún fi εἷς ἐξ ὑμῶν, ìfọkànsìn ọ̀rọ̀ ìbẹ̀rẹ̀ Jésù, àti ẹni tí ó ń jẹun pẹ̀lú Jésù hàn dáadáa. Ṣùgbọ́n “yóò dà mí” kì í jẹ́ ọ̀nà tó péye jù lọ láti ṣàfihàn παραδώσει nínú àyíká yìí; ó lè ní ìmọ̀ ‘tan mí jẹ’ tàbí ‘dà mí lójú,’ láì mú ìfi ẹni lé ọwọ́ tí ọ̀rọ̀ Gíríìkì náà ní hàn kedere.'
