source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: yo
  text: Nígbà tí wọ́n ń fi ara tì níbi oúnjẹ, tí wọ́n sì ń jẹun[a], Jésù sọ pé, “Lóòótọ́ ni mo sọ fún yín[b], ọ̀kan nínú yín yóò fi mí hàn[c]—ẹni tí ó ń bá mi jẹun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fífi ara tì ni ìlànà tí wọ́n sábà máa ń lò nígbà oúnjẹ pàtàkì ní àṣà ìgbà náà.
    reason: cultural_note
  - marker: b
    text: Ní tààràtà jù bẹ́ẹ̀ lọ, “Àmín, mo sọ fún yín.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “yóò fi mí lé ọwọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́, fífà ẹni lọ́wọ́, tàbí ìdàjẹ́ ẹni; níbí ó tọ́ka sí ìṣe àdàkàdekè láti ọ̀dọ̀ ọ̀kan lára àwọn alábàákẹ́gbẹ́ Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: fi ara tì níbi oúnjẹ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí bí àwọn ènìyàn ṣe máa ń fi ara tì nígbà oúnjẹ pàtàkì ní ayé Mẹditarenia ìgbàanì. Èyí pa àwòrán ìtàn náà mọ́ láì sọ pé wọ́n kàn jókòó lásán.
- source_word: ἐσθιόντων / ἐσθίων
  choice: ń jẹun / ẹni tí ó ń bá mi jẹun
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘jẹun.’ Ní ìparí ẹsẹ náà, gbólóhùn ‘ẹni tí ó ń bá mi jẹun’ ṣàfihàn participle tí ó ní article, ὁ ἐσθίων.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà pàtàkì tí Jésù fi ń fi ìdánilójú bẹ̀rẹ̀ ọ̀rọ̀. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Ἀμήν mọ́.
- source_word: εἷς ἐξ ὑμῶν
  choice: ọ̀kan nínú yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹni náà jẹ́ ọ̀kan lára ẹgbẹ́ wọn.
- source_word: παραδώσει
  choice: yóò dà mí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́, nínú àyíká yìí ó jẹ́ ìṣe àdàkàdekè láti ọ̀dọ̀ alábàákẹ́gbẹ́ Jésù. ‘Yóò dà mí’ sọ agbára ìbáṣepọ̀ àti ìwà búburú náà ní Yorùbá àdánidá.
- source_word: μετ’ ἐμοῦ
  choice: bá mi
  rationale: Ó ń sọ nípa jíjẹun papọ̀; ‘bá mi jẹun’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ παραδώσει nínú àsọtẹ́lẹ̀ ìjìyà Jésù
  choice: yóò dà mí
  alternative: yóò fi mí lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà kò ní láti túmọ̀ sí ‘dà’ ní gbogbo ibi, ṣùgbọ́n níbí ẹni tí ó ń bá Jésù jẹun yóò ṣe ohun tí ó tako Jésù. ‘Yóò dà mí’ mú àdàkàdekè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan tó gbòòrò sí i mọ́.
translation_notes:
  register: A lo Yorùbá ìsinsìnyí tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. Gbólóhùn ‘fi ara tì níbi oúnjẹ’ pa àṣà ìgbàanì mọ́, ‘yóò dà mí’ sì sọ ìṣe àdàkàdekè náà ní kedere láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan kún un.
