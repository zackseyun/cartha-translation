  edition: SBLGNT
  text: Καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti kọ orin ìyìn[a], wọ́n jáde lọ sí Òkè Ólífì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ìrísí Gíríìkì, “nígbà tí wọ́n ti kọ orin ìyìn.” Ọ̀rọ̀-ìṣe alábápín náà fi hàn pé wọ́n kọ orin náà ṣáájú kí wọ́n tó jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lẹ́yìn tí
  rationale: Ní Yorùbá, ìṣètò yìí so iṣẹ́ méjèèjì pọ̀ lọ́nà àdánidá, ó sì jẹ́ kó ṣe kedere pé kíkọ orin náà ṣáájú jíjáde wọn, gẹ́gẹ́ bí aorist participle náà ṣe tọ́ka.
- source_word: ὑμνήσαντες
  choice: tí wọ́n kọ orin ìyìn
  rationale: Ó túmọ̀ sí kíkọ orin tàbí orin ìyìn. ‘Kọ orin ìyìn’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìjọsìn tó ṣeé ṣe mọ́ láìsọ irú orin náà pàtó ju orísun lọ.
- source_word: ἐξῆλθον
  choice: wọ́n jáde lọ
  rationale: Ó fi ìtumọ̀ pẹ̀lẹ́pẹ̀lẹ́ ti ‘wọ́n jáde’ hàn, nígbà tí ‘lọ’ bá ibi tí wọ́n ń lọ mu lọ́nà àdánidá ní Yorùbá.
- source_word: εἰς
  choice: sí
  rationale: ‘Sí’ ni ọ̀rọ̀ Yorùbá tó yẹ fún fífi ibi tí ìrìn-àjò ń lọ hàn.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Òkè Ólífì
  rationale: Èyí ni orúkọ ilẹ̀ tó ti fìdí múlẹ̀ ní Yorùbá fún Mount of Olives; ‘Òkè’ bo ìtumọ̀ ὄρος, ‘Ólífì’ sì dúró fún ἐλαιῶν.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó mọ́, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì yan ‘orin ìyìn’ láti pa ìtumọ̀ ὑμνέω mọ́ láìfi àṣà ẹ̀sìn kan kun un.
