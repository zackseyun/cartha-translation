  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: yo
  text: Nítorí a lè ti ta òróró olóòórùn yìí[a] ní iye tí ó ju ọ̀ọ́dúnrún dẹ́nárì lọ, kí a sì fi owó tí a bá rí nípa títà á fún àwọn tálákà.” Wọ́n sì bá a wí pẹ̀lú ìbínú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun ìkunra olóòórùn” tàbí “òróró olóòórùn dídùn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n bá a wí gidigidi.” Ọ̀rọ̀ Gíríìkì náà fi ìbínú líle tàbí ìbániwí mímúná hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: òróró olóòórùn dídùn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí òróró tàbí ohun ìkunra olóòórùn dídùn; yíyan ‘òróró olóòórùn dídùn’ jẹ́ èdè Yorùbá àdánidá, ó sì bá ohun olówó iyebíye inú àyíká ọ̀rọ̀ mu.
- source_word: πραθῆναι
  choice: a lè ti ta
  rationale: Infinitive passive náà, pẹ̀lú ἠδύνατο, sọ nípa ohun tí ó ṣeé ṣe ṣùgbọ́n tí kò ṣẹlẹ̀; ‘a lè ti ta’ mú ìtumọ̀ yẹn jáde ní Yorùbá.
- source_word: ἐπάνω
  choice: ní iye tí ó ju ... lọ
  rationale: Pẹ̀lú iye owó, ἐπάνω túmọ̀ sí iye tí ó ga ju iye tí a dárúkọ lọ.
- source_word: δηναρίων τριακοσίων
  choice: ọ̀ọ́dúnrún owó dẹ́nárì
  rationale: A pa orúkọ owó ìgbà náà mọ́ dípò yíyí i padà sí owó òde òní; ‘owó dẹ́nárì’ mú kí irú owó náà yé òǹkàwé Yorùbá.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: kí a sì fi owó náà fún àwọn tálákà
  rationale: Nítorí ohun tí a bá ta ló máa di owó tí a fi fún àwọn tálákà, fífi ‘owó náà’ hàn jẹ́ Yorùbá àdánidá, kò sì yí ìtumọ̀ orísun padà.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: Wọ́n sì bá a wí gidigidi
  rationale: Ọ̀rọ̀-ìṣe náà ní agbára ìbínú àti ìbániwí líle; ‘bá a wí gidigidi’ fi ìbániwí tí a darí sí obìnrin náà hàn kedere.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ẹ̀sùn inú ẹsẹ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tí wọ́n fi ń ráhùn.
- source_word: ἠδύνατο
  choice: a lè ti
  rationale: Ó sọ ohun tí ó ṣeé ṣe nígbà náà ṣùgbọ́n tí kò ṣẹlẹ̀; ‘lè ti’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tí kò ṣẹ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A pa ‘dẹ́nárì’ mọ́ gẹ́gẹ́ bí orúkọ owó ìtàn, a sì lo ‘ọ̀ọ́dúnrún’ fún 300. Àwọn àmì àlàyé [a][b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
