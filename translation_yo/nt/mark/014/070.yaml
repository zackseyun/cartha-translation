translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́wọ̀ àti èyí tí gbogbo ènìyàn lè lóye ni a lò. A pa ìtẹ̀sí ìṣe aláìpé mọ́ ní “ń sọ,” a sì lo “ọ̀nà tí o ń gbà sọ̀rọ̀” láti má ṣe fi tipátipá pinnu bóyá λαλιά túmọ̀ sí ohùn, èdè agbègbè, tàbí ọ̀nà ìsọ̀rọ̀.
