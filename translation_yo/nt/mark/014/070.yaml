source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: yo
  text: Ṣùgbọ́n ó tún sẹ́. Lẹ́yìn ìgbà díẹ̀, àwọn tí ó dúró nítòsí tún ń sọ fún Pétérù pé, “Dájúdájú, ìwọ jẹ́ ọ̀kan lára wọn, nítorí ìwọ náà jẹ́ ará Gálílì, ọ̀nà tí o ń gbà sọ̀rọ̀ sì dà bí tiwọn.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohùn ìsọ̀rọ̀ rẹ dà bí tiwọn” tàbí “bí o ṣe ń sọ̀rọ̀ rí dà bí tiwọn.” Ọ̀rọ̀ Gíríìkì λαλιά lè túmọ̀ sí ọ̀nà ìsọ̀rọ̀, èdè agbègbè, tàbí ohùn ìsọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan kò ní, “ọ̀nà tí o ń gbà sọ̀rọ̀ sì dà bí tiwọn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: ó tún sẹ́ ẹ̀
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà lè fi ìṣe tí ń bá a lọ tàbí tí a tún ṣe hàn; “tún” àti àyíká ìtàn náà mú ìtumọ̀ ìsẹ́ náà jáde ní Yorùbá àdánidá, “ẹ̀” sì ń tọ́ka sí ẹ̀sùn tí ó sẹ́.
- source_word: μετὰ μικρὸν
  choice: Lẹ́yìn ìgbà díẹ̀
  rationale: Ó fi àkókò kúkúrú tí ó kọjá hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: οἱ παρεστῶτες
  choice: àwọn tí ó dúró nítòsí
  rationale: Ó pa ìtumọ̀ pé àwọn ènìyàn náà wà níbẹ̀, tí wọ́n sì dúró lẹ́gbẹ̀ẹ́, mọ́.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àmì “ń” ṣe àfihàn ìṣe aláìpé—ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń tún sọ.
- source_word: Ἀληθῶς
  choice: Dájúdájú
  rationale: Ó mú ìdánilójú inú àsọjáde náà jáde ní èdè Yorùbá tí ó wọ́pọ̀.
- source_word: ἐξ αὐτῶν εἶ
  choice: ìwọ jẹ́ ọ̀kan lára wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún jíjẹ́ ara ẹgbẹ́ àwọn tí a ń tọ́ka sí.
- source_word: καὶ γὰρ
  choice: nítorí pé ... náà
  rationale: “Nítorí pé” fi ìdí tí wọ́n fi sọ bẹ́ẹ̀ hàn, “náà” sì pa agbára καί mọ́.
- source_word: Γαλιλαῖος
  choice: ará Gálílì
  rationale: Ó túmọ̀ sí ẹni tí ó wá láti agbègbè Gálílì, èyí sì jẹ́ ìṣọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἡ λαλιά σου
  choice: ọ̀nà tí o ń gbà sọ̀rọ̀
  rationale: Yíyan yìí gba ìtumọ̀ ọ̀nà ìsọ̀rọ̀, èdè agbègbè, tàbí ohùn ìsọ̀rọ̀ láyè láì dín un kù sí ọ̀kan ṣoṣo.
- source_word: ὁμοιάζει
  choice: dà bí tiwọn
  rationale: Ó sọ ìjọra náà ní Yorùbá àdánidá; “tiwọn” mú ẹni tí a fi wé e, tí àyíká ọ̀rọ̀ mú ye wa, hàn.
