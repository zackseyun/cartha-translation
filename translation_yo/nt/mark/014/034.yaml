source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Ọkàn mi kún fún ìbànújẹ́ gidigidi títí dé ikú.[a] Ẹ dúró níhìn-ín, kí ẹ sì máa ṣọ́nà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “débi ikú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí ẹ má ṣe sùn”; àṣẹ náà lè ní wíwà lójúfò àti ṣíṣọ́ra nínú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: ó sì wí
  rationale: Aorísì ìtàn ni a lò ní Yorùbá gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ náà; ‘wí’ sì bá ìforúkọsílẹ̀ ọlọ́lá mu.
- source_word: Περίλυπός
  choice: kún fún ìbànújẹ́ gidigidi
  rationale: Ó fi ìbànújẹ́ tó lágbára gan-an hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì dín ìrora ọkàn náà kù.
- source_word: ψυχή
  choice: ọkàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ‘ọkàn’ tọ́ka sí inú ẹni tàbí gbogbo ìwàláàyè ẹni nínú ìpọ́njú; ó jẹ́ àdánidá ju ‘ẹ̀mí’ lọ ní Yorùbá, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí kò sí nínú Gíríìkì kún un.
- source_word: ἕως θανάτου
  choice: títí dé ikú
  rationale: Ó pa àwòrán Gíríìkì mọ́ pé ìbànújẹ́ náà dé ìwọ̀n ikú, láì pinnu bóyá ó túmọ̀ sí ewu ikú tàbí ìbànújẹ́ tó pọ̀ débi ikú.
- source_word: μείνατε
  choice: Ẹ dúró
  rationale: Ó jẹ́ àṣẹ pé kí wọn wà ní ibi náà; ‘dúró’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ níhìn-ín.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ìtumọ̀ ibi tó rọrùn, tó sì bá ‘here’ Gíríìkì mu ní tààrà.
- source_word: γρηγορεῖτε
  choice: kí ẹ sì máa ṣọ́nà
  rationale: ‘Máa ṣọ́nà’ lè ní ìtumọ̀ jíjìnnà kúrò nínú oorun àti wíwà lójúfò; ó tipa bẹ́ẹ̀ pa ìfẹ̀ ìtumọ̀ méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ Jésù
  choice: ọkàn
  alternative: ẹ̀mí; ara ẹni; ìwàláàyè
  rationale: ‘Ọkàn’ fi ìrora inú Jésù gẹ́gẹ́ bí ènìyàn tòótọ́ hàn, láì fi àlàyé ẹ̀kọ́ nípa ìwà Jésù tí ẹsẹ̀ náà kò sọ kún un.
- issue: Agbára àṣẹ γρηγορεῖτε
  choice: máa ṣọ́nà
  alternative: má ṣe sùn; máa wà lójúfò
  rationale: Àṣẹ náà ní í ṣe pẹ̀lú kí wọn má sùn, ṣùgbọ́n ó tún lè ní ìtumọ̀ ìṣọ́ra àti ìmúrasílẹ̀; a pa ìfarapa ìtumọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó níyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ó sì wí’ fún ìtàn àdánidá, ‘ọkàn’ fún inú ẹni, àti ‘máa ṣọ́nà’ láti pa ìtumọ̀ jíjí àti ìṣọ́ra mọ́.
