source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: yo
  text: 'Nígbà tí wọ́n gbọ́ èyí, inú wọn dùn, wọ́n sì ṣèlérí láti fún un ní owó[a]. Ó sì ń wá bí yóò ti fi í hàn[b] ní àkókò tó bá yẹ.


    [a] Tàbí “fàdákà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fàdákà gan-an tàbí owó lápapọ̀.


    [b] Tàbí “fi í lé wọn lọ́wọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́; “fi í hàn” sì fi ìwà àdàlẹ̀ Júdásì hàn nínú àyíká ọ̀rọ̀ yìí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fàdákà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fàdákà gan-an tàbí owó lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “fi í lé wọn lọ́wọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́; “fi í hàn” sì fi ìwà àdàlẹ̀ Júdásì hàn nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Nígbà tí wọ́n gbọ́ èyí
  rationale: Ó mú ipa àkókò tí participle náà ní jáde ní Yorùbá àdánidá; “èyí” tọ́ka sí ohun tí Júdásì ṣẹ̀ṣẹ̀ sọ tàbí dabaa nínú àyíká ọ̀rọ̀.
- source_word: ἐχάρησαν
  choice: inú wọn dùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n yọ̀ tàbí inú wọn dùn sí ohun tí wọ́n gbọ́.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: wọ́n sì ṣèlérí láti fún un ní owó
  rationale: “Ṣèlérí” pa agbára ἐπαγγέλλομαι mọ́, “owó” sì jẹ́ ìtumọ̀ àdánidá fún ἀργύριον nínú ọ̀rọ̀ ìsanwó yìí láì sọ iye tàbí irú ẹyọ owó kan tí orísun kò sọ.
- source_word: ἀργύριον
  choice: owó
  rationale: Ọ̀rọ̀ náà lè jẹ́ fàdákà ní ti gidi, ṣùgbọ́n ó sábà máa ń tọ́ka sí owó; àṣàyàn “fàdákà” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐζήτει
  choice: ó sì ń wá
  rationale: Àmì imperfect náà fi ìṣe tí ń bá a lọ hàn; “ń wá” pa ìtẹ̀síwájú yẹn mọ́ láì fi dandan sọ pé ìṣe náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀.
- source_word: πῶς
  choice: bí yóò ti
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè tàbí ronú nípa ọ̀nà tí a ó gbà ṣe ohun kan.
- source_word: εὐκαίρως
  choice: ní àkókò tó bá yẹ
  rationale: Ó sọ àǹfààní àkókò tó dára tàbí tó bá ète mu, láì ṣàfikún kúlẹ̀kúlẹ̀ tí ẹsẹ náà kò sọ.
- source_word: παραδοῖ
  choice: fi í hàn
  rationale: Nínú àyíká Júdásì, gbólóhùn yìí sọ ìṣe àdàlẹ̀ ní Yorùbá àdánidá. Àlàyé ìsàlẹ̀ tún pa ìtumọ̀ gígùn-ún-gígùn ti “fi í lé wọn lọ́wọ́” mọ́.
theological_decisions:
- issue: Ìtumọ̀ παραδίδωμι nínú ìṣe Júdásì
  choice: fi í hàn
  alternative: fi í lé wọn lọ́wọ́
  rationale: Àyíká náà fi hàn pé kì í ṣe fífi ẹnì kan lé ẹlòmíràn lọ́wọ́ lásán, bí kò ṣe ìṣe àdàlẹ̀. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro ti ọ̀rọ̀ Gíríìkì náà mọ́, kí ìfararora inú ọ̀rọ̀ náà má bàa sọnù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lasán; a lo “inú wọn dùn” àti “ó ń wá” gẹ́gẹ́ bí àfihàn Yorùbá àdánidá.
