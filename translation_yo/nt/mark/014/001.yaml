id: MRK.14.1
reference: Mark 14:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: yo
  text: Àjọ Ìrékọjá àti Àjọ Àkàrà Aláìwú[b] kù ọjọ́ méjì[a]. Àwọn olórí àlùfáà àti àwọn akọ̀wé sì ń wá ọ̀nà láti fi ẹ̀tàn mú Jesu[c], kí wọ́n sì pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “lẹ́yìn ọjọ́ méjì.” Gbólóhùn náà fi hàn pé Àjọ Ìrékọjá àti Àjọ Àkàrà Aláìwú ti sún mọ́lé.
    reason: lexical_alternative
  - marker: b
    text: Ní èdè Gíríìkì, “àwọn ohun aláìwú”; èyí jẹ́ ọ̀nà tí wọ́n máa ń gbà tọ́ka sí Àjọ Àkàrà Aláìwú.
    reason: cultural_note
  - marker: c
    text: Tàbí, “gbá a mú” tàbí “mú un pẹ̀lú ọgbọ́n àrékérekè.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: … kù …; … sì
  rationale: A lo ‘kù ọjọ́ méjì’ fún ìtọ́kasí àsìkò tó sún mọ́lé, ‘sì’ sì gbé ìtàn lọ ní ọ̀nà pẹ̀lẹ́ láìfi ‘nísinsin yìí’ kún orísun.
- source_word: τὸ πάσχα
  choice: Àjọ Ìrékọjá
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àjọ àwọn Júù tí a ń pè ní Passover; nínú àyíká yìí, àjọ náà ni ó túmọ̀ sí, kì í ṣe ọ̀dọ́-àgùntàn ìrúbọ nìkan.
- source_word: τὰ ἄζυμα
  choice: Àjọ Àkàrà Aláìwú
  rationale: Ní ti gírámà, ó túmọ̀ sí ‘àwọn ohun/àkàrà aláìwú,’ ṣùgbọ́n ní àyíká yìí ó jẹ́ orúkọ àjọ; fífi ‘Àjọ’ sí i mú un ṣe kedere ní Yorùbá.
- source_word: μετὰ δύο ἡμέρας
  choice: kù ọjọ́ méjì
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ní tààràtà ni ‘lẹ́yìn ọjọ́ méjì,’ ṣùgbọ́n ‘kù ọjọ́ méjì’ jẹ́ Yorùbá àdánidá tó fi hàn pé àjọ náà sún mọ́lé.
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Àmì àkókò imperfect fi ìgbìyànjú tó ń bá a lọ hàn; ‘ń wá ọ̀nà’ pa ìtumọ̀ yẹn mọ́.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe olórí àlùfáà kan ṣoṣo.
- source_word: οἱ γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìbámu ọ̀rọ̀ tó sún mọ́ orísun, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá lè lóye.
- source_word: ἐν δόλῳ
  choice: fi ẹ̀tàn
  rationale: δόλος túmọ̀ sí ẹ̀tàn tàbí ọgbọ́n àrékérekè; ‘fi ẹ̀tàn’ pa agbára ìwà búburú ọ̀rọ̀ náà mọ́, kò sì dín in kù sí ṣíṣe ní ìkọ̀kọ̀ nìkan.
- source_word: κρατήσαντες
  choice: mú Jesu
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti gbá mú tàbí láti dì mú; nínú ọ̀rọ̀ àwọn aláṣẹ tó ń gbèrò sí Jesu, ‘mú Jesu’ jẹ́ àdánidá, ó sì lè túmọ̀ sí mímú un sábẹ́ àṣẹ.
- source_word: ἀποκτείνωσιν
  choice: pa á
  rationale: Ìtumọ̀ tààràtà ni láti pa; ‘pa á’ jẹ́ kedere, ó sì bá ìrọ̀rùn ọ̀rọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ìbáṣepọ̀ Àjọ Ìrékọjá àti Àjọ Àkàrà Aláìwú
  choice: 'A darúkọ àjọ méjèèjì lọ́tọ̀: ‘Àjọ Ìrékọjá àti Àjọ Àkàrà Aláìwú.’'
  alternative: Kí a kà àwọn ọ̀rọ̀ méjèèjì sí orúkọ àjọ kan ṣoṣo.
  rationale: Máàkù darúkọ méjèèjì ní kedere. Ìtumọ̀ náà pa ìyàtọ̀ wọn mọ́, bó tilẹ̀ jẹ́ pé wọ́n sún mọ́ra nínú àṣà àjọ àwọn Júù.
- issue: Ìwà tí ó wà nínú ète àwọn aṣáájú
  choice: A túmọ̀ ἐν δόλῳ ní kedere sí ‘fi ẹ̀tàn.’
  alternative: ní ìkọ̀kọ̀; pẹ̀lú ọgbọ́n àrékérekè
  rationale: Orísun Gíríìkì kò sọ ìkọ̀kọ̀ nìkan; ó tún fi ẹ̀tàn àti ète búburú hàn. ‘Fi ẹ̀tàn’ pa agbára yẹn mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- issue: Ohun tí arọ́pò-orúkọ αὐτόν tọ́ka sí
  choice: A sọ ‘Jesu’ ní kedere.
  alternative: mú un
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo arọ́pò-orúkọ, fífi ‘Jesu’ hàn jẹ́ àdánidá ní ẹsẹ tí a yọ dúró, ó sì mú ẹni tí wọ́n fẹ́ mú ṣe kedere láìyí ìtumọ̀ padà.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Àjọ’ ṣàlàyé pé àwọn ọ̀rọ̀ méjèèjì jẹ́ orúkọ ayẹyẹ; ‘ń wá ọ̀nà’ sì mú ìṣe tó ń bá a lọ nínú imperfect Gíríìkì hàn.
