source:
  edition: SBLGNT
  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: yo
  text: Ṣùgbọ́n ó bẹ̀rẹ̀ sí í pe ègún, ó sì búra[a] pé, “Mi ò mọ ọkùnrin yìí tí ẹ̀ ń sọ̀rọ̀ nípa rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bẹ̀rẹ̀ sí í bú”; ó sì ṣeé ṣe kó túmọ̀ sí “ó bẹ̀rẹ̀ sí í pe ègún sórí ara rẹ̀.” Ọ̀rọ̀ Gíríìkì kò sọ ẹni tàbí ohun tí ègún náà kàn ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n ó
  rationale: δέ ní ìyípadà ìtàn pẹ̀lú ìtakora díẹ̀; ‘Ṣùgbọ́n ó’ bá bí ìkọ̀sílẹ̀ Pétérù ṣe túbọ̀ le sí i mu.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó fi ìbẹ̀rẹ̀ ìṣe tí àwọn ọ̀rọ̀-orúkọ-ìṣe tó tẹ̀ lé e hàn ní Yorùbá àdánidá.
- source_word: ἀναθεματίζειν
  choice: ké pe ègún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípè tàbí fífi ègún wá, kì í ṣe ọ̀rọ̀ burúkú lásán. Gbólóhùn yìí kò sọ ẹni tí ègún náà kàn ní pàtó.
- source_word: ὀμνύναι
  choice: búra
  rationale: ‘Búra’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún jíjẹ́ ìbúra tàbí mímú ọ̀rọ̀ ẹni fìdí múlẹ̀ pẹ̀lú ìbúra.
- source_word: ὅτι
  choice: pé, “
  rationale: Níhìn-ín ὅτι ń ṣáájú ohun tí Pétérù sọ nínú ìbúra rẹ̀; ọ̀rọ̀ tààrà jẹ́ àfihàn àdánidá ní Yorùbá.
- source_word: Οὐκ οἶδα
  choice: Èmi kò mọ
  rationale: ‘Kò mọ’ bá ìtumọ̀ gígùn-ún ti ọ̀rọ̀ Gíríìkì mu, ‘Èmi’ sì tẹnumọ́ ìkọ̀sílẹ̀ náà láìfi ìtumọ̀ míì kún un.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ọkùnrin yìí
  rationale: ‘Yìí’ pa agbára ọ̀rọ̀-atọ́ka τοῦτον mọ́; ‘ọkùnrin’ jẹ́ àfihàn àdánidá fún ἄνθρωπον nínú àyíká yìí.
- source_word: ὃν λέγετε
  choice: tí ẹ̀ ń sọ̀rọ̀ rẹ̀
  rationale: Ó sọ ìtumọ̀ ẹni tí àwọn tó wà níbẹ̀ ń tọ́ka sí ní Yorùbá òde òní tó rọrùn láti lóye.
theological_decisions:
- issue: Irú ègún tí ἀναθεματίζειν ń tọ́ka sí nínú ìkọ̀sílẹ̀ Pétérù
  choice: Ṣàfihàn rẹ̀ gẹ́gẹ́ bí pípè ègún láìsọ pé Pétérù fi bú Jésù tàbí pé ó pe ègún sórí ara rẹ̀.
  alternative: Ó bẹ̀rẹ̀ sí í bú; tàbí ó bẹ̀rẹ̀ sí í pe ègún sórí ara rẹ̀.
  rationale: Àyíká náà lè jẹ́ kí a lóye rẹ̀ gẹ́gẹ́ bí ègún tí ẹni ń pè sórí ara rẹ̀ láti fi ìbúra múlẹ̀, ṣùgbọ́n Gíríìkì kò sọ ohun tàbí ẹni tí ègún náà kàn. Nítorí náà, ọ̀rọ̀ pàtàkì pa àìdájú náà mọ́, àlàyé ìsàlẹ̀ sì mẹ́nu kan àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá àgbàlódé tó níyì, tó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ké pe ègún’ pa ìtumọ̀ ìpè-ègún mọ́ láìyan ẹni tí ègún náà kàn; ‘búra’ yà ìbúra kúrò nínú èébú lasán.
