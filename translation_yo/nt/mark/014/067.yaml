id: MRK.14.67
reference: Mark 14:67
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: yo
  text: Nígbà tí ó sì rí Peteru tí ó ń yáná, ó tẹjú mọ́ ọn, ó sì ní, “Ìwọ náà wà pẹ̀lú Jesu ará Nasareti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: tí ó ń yáná
  rationale: Ó túmọ̀ sí pé Peteru ń mú ara rẹ̀ gbóná lẹ́gbẹ̀ẹ́ iná; ‘ń yáná’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ èyí.
- source_word: ἐμβλέψασα αὐτῷ
  choice: ó tẹjú mọ́ ọn
  rationale: Ọ̀rọ̀ náà fi hàn pé obìnrin náà wo Peteru dáadáa tàbí tẹjú mọ́ ọn, kì í ṣe pé ó kàn rí i lásán.
- source_word: λέγει
  choice: ó sì ní
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí, ó jẹ́ ìsinsìnyí ìtàn; ‘ó sì ní’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti mú ìsọ̀rọ̀ taara wọ inú ìtàn láìyí ìtumọ̀ padà.
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: Jesu ará Nasareti
  rationale: Èyí sọ Jesu di ẹni tí ó wá láti Nasareti, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún ‘Jesu ọmọ Nasareti/ará Nasareti.’
theological_decisions: []
translation_notes:
  register: Yorùbá àpéjọ, ọlọ́lá, àti èyí tí ó rọrùn fún òǹkàwé òde òní. A pa ìtẹnumọ́ ‘Ìwọ náà’ mọ́, a sì lo ‘wà pẹ̀lú’ fún ìbáṣepọ̀ Peteru pẹ̀lú Jesu ní àsìkò tí a ń tọ́ka sí.
