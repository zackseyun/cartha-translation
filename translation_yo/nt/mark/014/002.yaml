- from: Nítorí wọ́n ń sọ pé, “Kí ó má ṣe jẹ́ ní àkókò àjọ̀dún náà, kí ariwo má bàa ṣẹlẹ̀ láti ọ̀dọ̀ àwọn ènìyàn[a].”
  to: Nítorí wọ́n ń sọ pé, “Kì í ṣe ní ayẹyẹ náà, kí ìdàrúdàpọ̀ má bàa ṣẹlẹ̀ láti ọ̀dọ̀ àwọn ènìyàn[a].”
  rationale: The revision replaces an awkward rendering of the Greek elliptical negative with an idiomatic Yoruba elliptical expression, sharpens θόρυβος from generic noise to public disturbance, and improves the footnote's Yoruba while preserving the source ambiguity concerning τοῦ λαοῦ.
