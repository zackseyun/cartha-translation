source:
  edition: SBLGNT
  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: yo
  text: Nítorí wọ́n ń sọ pé, “Kì í ṣe ní ayẹyẹ náà, kí ìdàrúdàpọ̀ má bàa ṣẹlẹ̀ láti ọ̀dọ̀ àwọn ènìyàn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn ènìyàn.” Ọ̀rọ̀ Gíríìkì náà, τοῦ λαοῦ, lè túmọ̀ sí pé ìdàrúdàpọ̀ náà yóò ti ọ̀dọ̀ ogunlọ́gọ̀ náà wá tàbí pé yóò ṣẹlẹ̀ láàárín wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe náà fi hàn pé ọ̀rọ̀ yìí ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “wọ́n ń sọ” mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: Μὴ
  choice: Kí ó má ṣe jẹ́
  rationale: 'Èyí pa ìsọ̀rọ̀ kúkúrú ti Gíríìkì mọ́ nígbà tó ń fi èrò tí a kò sọ ní kíkún hàn: kí ohun tí wọ́n pinnu má ṣe ṣẹlẹ̀ ní àkókò náà.'
- source_word: ἐν τῇ ἑορτῇ
  choice: ní àkókò àjọ̀dún náà
  rationale: ἐν ní ìtumọ̀ àkókò túmọ̀ sí “ní àkókò”; àjọ̀dún náà tọ́ka sí àsìkò ayẹyẹ tí àyíká ọ̀rọ̀ ti sọ di mímọ̀.
- source_word: μήποτε
  choice: kí ... má bàa
  rationale: Àkọsílẹ̀ Yorùbá yìí fi àbájáde tí wọ́n ń bẹ̀rù, tí wọ́n sì fẹ́ dènà, hàn lọ́nà àdánidá.
- source_word: ἔσται
  choice: ṣẹlẹ̀
  rationale: Ní ìsopọ̀ pẹ̀lú θόρυβος, “ṣẹlẹ̀” sọ pé ariwo lè dìde ní ọjọ́ iwájú láìfi ìtumọ̀ míì kún un.
- source_word: θόρυβος
  choice: ariwo
  rationale: Nínú àyíká yìí, “ariwo” lè túmọ̀ sí rúdurùdu aláriwo tàbí ìdàrúdàpọ̀ ní gbangba, láìgbé e dé ìtumọ̀ ogunlọ́gọ̀ tó le ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: τοῦ λαοῦ
  choice: láti ọ̀dọ̀ àwọn ènìyàn
  rationale: Èyí ka ẹ̀yà olùní Gíríìkì náà gẹ́gẹ́ bí orísun ariwo, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ pé ariwo náà lè ṣẹlẹ̀ láàárín wọn mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa ìsọ̀rọ̀ ṣókí àti àìdánilójú ti ọ̀rọ̀ Gíríìkì mọ́ níbi tó yẹ.
