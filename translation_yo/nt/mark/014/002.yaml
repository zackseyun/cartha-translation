review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the imperfect ἔλεγον, the feared-result force of μήποτε, and the genitive ambiguity of τοῦ λαοῦ. However, “Kí ó má ṣe jẹ́” is not a natural Yoruba equivalent for the Greek's terse elliptical “Not during the feast,” and “ariwo” can be mere noise rather than the public disturbance denoted by θόρυβος.
  naturalness: “Kì í ṣe ní ayẹyẹ náà” retains the compact elliptical deliberative wording in idiomatic Standard Yoruba. “Ìdàrúdàpọ̀” more naturally conveys a public commotion/unrest in this context.
  terminology: “Ayẹyẹ” is an appropriate contextual rendering of ἑορτή. “Ìdàrúdàpọ̀” is preferable to “ariwo” for θόρυβος without escalating the sense to a riot. The footnote is recast in clear Yoruba and retains both plausible construals of the genitive.
  issues:
  - severity: medium
    issue: The phrase “Kí ó má ṣe jẹ́ ní àkókò àjọ̀dún náà” is syntactically and idiomatically strained.
    rationale: It introduces an unclear impersonal subject (“ó”) and does not naturally express the source's elliptical planning statement. “Kì í ṣe ní ayẹyẹ náà” is a concise, natural equivalent without supplying a specific unstated action.
  - severity: medium
    issue: “Ariwo” is too broad for θόρυβος in this setting.
    rationale: It commonly means noise and can miss the sense of a public disturbance or commotion. “Ìdàrúdàpọ̀” better matches the source while not overstating it as a riot.
  - severity: low
    issue: The footnote's wording “Ẹ̀yà olùní Gíríìkì” is unnatural Yoruba.
    rationale: Referring directly to “Ọ̀rọ̀ Gíríìkì náà, τοῦ λαοῦ” is clearer and retains the intended grammatical explanation.
  revised_text: Nítorí wọ́n ń sọ pé, “Kì í ṣe ní ayẹyẹ náà, kí ìdàrúdàpọ̀ má bàa ṣẹlẹ̀ láti ọ̀dọ̀ àwọn ènìyàn[a].”
