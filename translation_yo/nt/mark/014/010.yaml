id: MRK.14.10
reference: Mark 14:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: yo
  text: Júdásì Ísíkáríótù, ọ̀kan nínú àwọn Méjìlá náà, sì lọ sọ́dọ̀ àwọn olórí àlùfáà láti fi í lé wọn lọ́wọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti dà á fún wọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “fi lé lọ́wọ́”; nínú ọ̀ràn Júdásì, fífi Jésù lé wọn lọ́wọ́ jẹ́ ìdàlẹ́yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí ń so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú rẹ̀, ó sì pa ìṣàn ìtàn náà mọ́ láìfi ìtumọ̀ mìíràn kún un.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Júdásì Ísíkáríótù
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni àti àpèlé rẹ̀ ní ìbámu pẹ̀lú bí a ṣe ń kọ àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: ọ̀kan nínú àwọn Méjìlá náà
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn ọmọ-ẹ̀yìn méjìlá tí a mọ̀ dáadáa, kì í ṣe nọ́ńbà lásán.
- source_word: ἀπῆλθεν
  choice: lọ
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe ìtàn tó rọrùn fún ìlọ; ‘lọ’ jẹ́ èdè Yorùbá àdánidá tí kò fi ìyapa tó ju ti orísun lọ hàn.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: sọ́dọ̀ àwọn olórí àlùfáà
  rationale: Ọ̀pọ̀ orúkọ náà ń tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà ní Jerúsálẹ́mù, kì í ṣe àlùfáà àgbà kan ṣoṣo.
- source_word: ἵνα
  choice: láti
  rationale: Ó fi ète ìlọ Júdásì hàn ní Yorùbá tó ṣe kedere tí ó sì jẹ́ àdánidá.
- source_word: παραδοῖ
  choice: fi ... lé ... lọ́wọ́
  rationale: Àsọdùn Yorùbá yìí pa ìtumọ̀ gbígbé ẹnì kan lé ẹlòmíràn lọ́wọ́ mọ́, láìdín ọ̀rọ̀ náà kù sí ‘dà á’ nìkan.
- source_word: αὐτὸν ... αὐτοῖς
  choice: í ... wọn
  rationale: Àwọn arọ́pò-orúkọ náà jẹ́ kó ṣe kedere pé Jésù ni ẹni tí a ó fi lé àwọn olórí àlùfáà lọ́wọ́, bí ètò Gíríìkì ṣe fi hàn.
theological_decisions:
- issue: Ìtumọ̀ παραδοῖ nínú ọ̀rọ̀ ìdàlẹ́yìn Júdásì
  choice: fi í lé wọn lọ́wọ́
  alternative: dà á fún wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ohun tí Júdásì ṣe jẹ́ ìdàlẹ́yìn, ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò sí i, ó sì tún farahàn léraléra nínú ìtàn ìjìyà gẹ́gẹ́ bí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́. Àṣàyàn yìí pa ìfọ̀kànbalẹ̀ àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ìtàn náà mọ́; àlàyé ìdàlẹ́yìn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn olórí àlùfáà’ fún aṣáájú ẹgbẹ́ àlùfáà, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
