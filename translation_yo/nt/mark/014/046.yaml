  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: yo
  text: Nígbà náà ni wọ́n gbé ọwọ́ lé e, wọ́n sì mú un[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi ọwọ́ mú un.” Gbólóhùn Gíríìkì náà jẹ́ ọ̀nà àkànlò èdè fún mímú ènìyàn, ní ọ̀pọ̀ ìgbà láti mú un bí ẹlẹ́wọ̀n.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n mú un bí ẹlẹ́wọ̀n.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nígbà náà ni wọ́n
  rationale: Ọ̀rọ̀ οἱ dúró fún àwọn ènìyàn náà (‘wọ́n’), δέ sì ń tẹ ìtàn náà síwájú pẹ̀lú ìyípadà kékeré; ‘Nígbà náà ni wọ́n’ jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú ìṣẹ̀lẹ̀ ní Yorùbá láìfi ìtakora líle kún un.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: wọ́n gbé ọwọ́ lé e
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó lè túmọ̀ sí fífi ọwọ́ kan ènìyàn láti mú un, ní pàtàkì nínú ipò ọ̀tá yìí.
- source_word: ἐκράτησαν αὐτόν
  choice: wọ́n sì mú un
  rationale: κρατέω níbí túmọ̀ sí mímú ẹni náà ní agbára àti dídìmú rẹ̀. ‘Mú un’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìṣẹ̀lẹ̀ ìmúni mu, láìfi ìtumọ̀ ìlànà òfin ‘mú un bí ẹlẹ́wọ̀n’ kún ọ̀rọ̀ Gíríìkì ní dandan.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Atúmọ̀ náà pa àwòrán gbólóhùn àkànlò Gíríìkì mọ́, ó sì fi ìtumọ̀ òfin tí ó ṣeé ṣe sí àlàyé ìsàlẹ̀.
