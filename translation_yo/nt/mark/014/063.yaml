  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: yo
  text: Nígbà náà ni olórí àlùfáà ya àwọn aṣọ rẹ̀[a], ó sì wí[b] pé, “Kí la tún nílò àwọn ẹlẹ́rìí fún?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ẹ̀wù rẹ̀”; ní pàtó sí i, “àwọn aṣọ túnìkì rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Gíríìkì, ọ̀rọ̀ ìṣe náà wà ní àkókò ìsinsìnyí nínú ìtàn (λέγει, “ó ń sọ”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún ẹni kan ṣoṣo tó di ipò àlùfáà gíga mú, tó sì ń darí ìgbẹ́jọ́ náà.
- source_word: διαρρήξας
  choice: ya
  rationale: Ó sọ ìṣe yíya aṣọ ní kedere àti ní èdè Yorùbá òde òní, láìfi ìtumọ̀ ìbànújẹ́ tàbí ìbínú kún un.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: àwọn aṣọ rẹ̀
  rationale: A pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ṣùgbọ́n a lo ọ̀rọ̀ àpapọ̀ tó jẹ́ àdánidá ní Yorùbá; àlàyé ìtumọ̀ pàtó sí i wà nínú àlàyé ìsàlẹ̀.
- source_word: λέγει
  choice: ó sì wí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀ ìṣe àkókò ìsinsìnyí nínú ìtàn, ìsọ̀rọ̀ ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ yìí jẹ́ àdánidá ní Yorùbá, a sì ṣàkọsílẹ̀ ìrísí Gíríìkì nínú àlàyé ìsàlẹ̀.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: Kí la tún nílò àwọn ẹlẹ́rìí fún?
  rationale: Ìbéèrè yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ἔτι mọ́ nípasẹ̀ “tún,” èyí tó fi hàn pé ó ka ẹ̀rí mìíràn sí ohun tí kò ṣe dandan mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìṣe yíya aṣọ olórí àlùfáà
  choice: A sọ pé ó ya aṣọ rẹ̀ nìkan, láìṣàlàyé ìdí inú rẹ̀.
  alternative: Láti sọ ní tààrà pé ó ya aṣọ rẹ̀ nítorí ìbínú sí ohun tó kà sí ọ̀rọ̀-òdì sí Ọlọ́run.
  rationale: Ẹsẹ yìí sọ ohun tó ṣe àti ohun tó wí, ṣùgbọ́n kò ṣàlàyé ìtumọ̀ ìṣe náà ní tààrà; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tó yẹ; ó jẹ́ èdè òde òní tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Nígbà náà ni” so ìṣe náà mọ́ ìṣẹ̀lẹ̀ tó ṣáájú lọ́nà àdánidá, “Kí la tún nílò … fún?” sì pa ìbéèrè àsọtẹ́lẹ̀ Gíríìkì mọ́.
