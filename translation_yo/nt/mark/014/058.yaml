  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: yo
  text: pé, “Àwa gbọ́ ọ́ ń sọ pé, ‘Èmi yóò wó tẹ́ńpìlì yìí tí a fi ọwọ́ ṣe[b], láàárín ọjọ́ mẹ́ta[a], èmi yóò sì kọ́ òmíràn tí a kò fi ọwọ́ ṣe.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní ọjọ́ mẹ́ta.” Gbólóhùn Gíríìkì διὰ τριῶν ἡμερῶν níbí sábà máa ń tọ́ka sí àkókò ọjọ́ mẹ́ta tí ìṣe náà yóò ṣẹlẹ̀ nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Tí a fi ọwọ́ ṣe” àti “tí a kò fi ọwọ́ ṣe” pa ìtakora tó wà láàárín χειροποίητον àti ἀχειροποίητον nínú Gíríìkì mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàfihàn ohun tí àwọn ẹlẹ́rìí sọ pé wọ́n gbọ́; kì í ṣe ‘nítorí pé’ níbí.
- source_word: Ἡμεῖς
  choice: Àwa
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ mọ́, láti fi ìtẹnumọ́ àwọn ẹlẹ́rìí hàn.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: Àwa gbọ́ tí ó ń sọ pé
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ pé wọ́n gbọ́ ọ nígbà tí ó ń sọ ọ̀rọ̀ náà, ó sì tún pa ìṣe tí ń lọ lọ́wọ́ inú participle Gíríìkì mọ́.
- source_word: καταλύσω
  choice: Èmi yóò wó
  rationale: Nípa ilé, ‘wó’ túmọ̀ sí fífi ilé náà ṣubú tàbí píparun rẹ̀, láìfi àlàyé míì kún un.
- source_word: ναὸν
  choice: tẹ́ńpìlì
  rationale: Ọ̀rọ̀ yìí jẹ́ èyí tí òǹkàwé Yorùbá òde òní mọ̀ dáadáa fún tẹ́ńpìlì Jerúsálẹ́mù, ó sì yẹ fún ναός nínú àyíká yìí.
- source_word: τοῦτον
  choice: yìí
  rationale: Ó pa ìtọ́ka sí tẹ́ńpìlì tí ó wà níwájú wọn mọ́.
- source_word: χειροποίητον
  choice: tí a fi ọwọ́ ṣe
  rationale: Ìtumọ̀ tààrà yìí pa ìfiwéra pẹ̀lú ἀχειροποίητον mọ́, láìsọ pé ‘ti ènìyàn’ tàbí ‘ti Ọlọ́run’ níbi tí Gíríìkì kò ti sọ bẹ́ẹ̀.
- source_word: διὰ τριῶν ἡμερῶν
  choice: láàárín ọjọ́ mẹ́ta
  rationale: Pẹ̀lú διά àti genitive, gbólóhùn náà tọ́ka sí àkókò ọjọ́ mẹ́ta tí ìṣe náà yóò ṣẹlẹ̀ nínú rẹ̀; ‘láàárín’ mú ìtumọ̀ yìí jáde lọ́nà Yorùbá àdánidá.
- source_word: ἄλλον
  choice: òmíràn
  rationale: Ó sọ pé tẹ́ńpìlì kejì, tí ó yàtọ̀ sí ti àkọ́kọ́, ni yóò kọ́.
- source_word: ἀχειροποίητον
  choice: tí a kò fi ọwọ́ ṣe
  rationale: A lo ọ̀rọ̀ tó bá χειροποίητον mu ní ìlànà, kí ìtakora ọ̀rọ̀ Gíríìkì lè hàn gbangba.
- source_word: οἰκοδομήσω
  choice: èmi yóò sì kọ́
  rationale: ‘Kọ́’ ni ìtumọ̀ tààrà fún kíkọ́ ilé; a kò lo ‘tún kọ́’ nítorí Gíríìkì kò sọ ìtúnkọ́ ní pàtó.
theological_decisions:
- issue: Bí a ṣe lè fi hàn pé ọ̀rọ̀ náà jẹ́ ẹ̀rí àwọn olùfisùn, kì í ṣe ìmúdájú láti ọ̀dọ̀ akọ̀wé ìtàn
  choice: A pa á mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí àwọn ẹlẹ́rìí ròyìn, a sì lo àmì ọ̀rọ̀-àyọlò láìfi àlàyé onítumọ̀ kún un.
  alternative: Láti fi ọ̀rọ̀ míì kún un pé wọ́n ń yí ọ̀rọ̀ Jésù po.
  rationale: Ẹsẹ náà ń ròyìn ohun tí àwọn ẹlẹ́rìí sọ pé wọ́n gbọ́. Ìtumọ̀ kò gbọ́dọ̀ dájọ́ lórí òtítọ́ tàbí ìyípadà ọ̀rọ̀ wọn nínú ẹsẹ yìí.
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó lè wà nínú ìtakora ‘fi ọwọ́ ṣe’ àti ‘kò fi ọwọ́ ṣe’
  choice: A pa ìtakora ọ̀rọ̀ náà mọ́ ní tààrà.
  alternative: Láti túmọ̀ rẹ̀ sí ‘èyí tí ènìyàn ṣe’ àti ‘èyí tí Ọlọ́run ṣe.’
  rationale: Gíríìkì lè ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n kò sọ ẹni tó ṣe èkejì ní pàtó; nítorí náà a kò yanjú àìdájú náà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní. A lo “tẹ́ńpìlì” gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, a sì ṣètò àmì ẹsẹ̀ [a] síbi gbólóhùn àkókò tí àlàyé rẹ̀ ń tọ́ka sí.
