  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: yo
  text: Òun fúnra rẹ̀ yóò sì fi yàrá ńlá kan lókè hàn yín, tí a ti ṣètò sílẹ̀, tí ó sì ti múra tán[a]. Ẹ sì pèsè fún wa níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘yàrá ńlá kan lókè, tí a ti tẹ́ sílẹ̀, tí ó sì ti múra tán.’ Ọ̀rọ̀ Gíríìkì ἐστρωμένον lè túmọ̀ sí pé a ti tẹ́ sílẹ̀ tàbí pé a ti ṣètò yàrá náà fún lílò; kò fi dandan sọ pé a fi ohun-ọ̀ṣọ́ yàrá kún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ ju ‘òun’ nìkan lọ.
- source_word: δείξει
  choice: yóò fi ... hàn yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà yóò tọ́ka sí yàrá náà fún wọn.
- source_word: ἀνάγαιον μέγα
  choice: yàrá ńlá kan lókè
  rationale: Ó túmọ̀ sí yàrá ńlá tí ó wà ní apá òkè ilé, láìfi ‘yàrá àlejò’ kún ọ̀rọ̀ orísun.
- source_word: ἐστρωμένον
  choice: tí a ti ṣètò sílẹ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ohun tí a ti tẹ́, nà, tàbí ṣètò fún lílò; yíyan yìí pa ìtumọ̀ gbígbòòrò náà mọ́ láìdín in kù sí ohun-ọ̀ṣọ́ yàrá nìkan.
- source_word: ἕτοιμον
  choice: tí ó sì ti múra tán
  rationale: Ó ṣe àfihàn pé yàrá náà ti ṣe tán fún lílò, ó sì yàtọ̀ kedere sí àṣẹ tí ó tẹ̀ lé e.
- source_word: ἐκεῖ
  choice: síbẹ̀
  rationale: Adverb ibi tí ó bá Yorùbá mu ní ọ̀nà àdánidá.
- source_word: ἑτοιμάσατε
  choice: Ẹ sì pèsè rẹ̀
  rationale: Àṣẹ sí ọ̀pọ̀ ènìyàn ni; ‘pèsè rẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé kí wọ́n ṣe ohun tí ó yẹ níbẹ̀ fún àsè náà, láìfi ‘Àjọ̀dún Ìrékọjá’ sínú ẹsẹ yìí.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó pa arọ́pò-orúkọ ọ̀pọ̀ ènìyàn mọ́ láìṣàlàyé àwọn tí ‘wa’ dúró fún.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ìtẹnumọ́ ‘Òun fúnra rẹ̀’ àti àṣẹ ọ̀pọ̀ ‘Ẹ ...’ tẹ̀ lé ìṣètò Gíríìkì.
