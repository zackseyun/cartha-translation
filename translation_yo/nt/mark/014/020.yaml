  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ọ̀kan lára àwọn méjìlá náà—ẹni tí ó ń bọ ọwọ́ rẹ̀ sínú àwokòtò pẹ̀lú mi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwo.” Ọ̀rọ̀ Gíríìkì náà, τρύβλιον, lè túmọ̀ sí àwokòtò tàbí àwo tí a fi ń jẹun.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá láìsọ ọ́ di ìtakora líle.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí túmọ̀ λέγω ní tààrà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tí a fa yọ.
- source_word: Εἷς τῶν δώδεκα
  choice: Ọ̀kan lára àwọn méjìlá náà
  rationale: Ó pa ìtumọ̀ pé ẹni náà jẹ́ ọ̀kan nínú ẹgbẹ́ àwọn méjìlá Jesu mọ́; “náà” ń tọ́ka sí ẹgbẹ́ tí a ti mọ̀ tẹ́lẹ̀ láìfi ìtumọ̀ míì kún un.
- source_word: ὁ ἐμβαπτόμενος
  choice: ẹni tí ó ń ki ọwọ́ bọ
  rationale: Àpólà aláìparí yìí ń fi ìṣe tí ó ń lọ lọ́wọ́ hàn. Nínú Yorùbá, “ki ọwọ́ bọ” sọ ìṣe fífi oúnjẹ sínú ohun èlò omi tàbí ọbẹ̀ ní ọ̀nà tí ó ṣe kedere, láìfi ohun tí wọ́n ń kì bọ kún ọ̀rọ̀ Gíríìkì.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: μετά pẹ̀lú genitive ń tọ́ka sí ṣíṣe ohun kan ní àjọṣe tàbí papọ̀; “pẹ̀lú mi” ni ìtumọ̀ Yorùbá tó rọrùn jù.
- source_word: εἰς τὸ τρύβλιον
  choice: bọ inú àwokòtò
  rationale: “inú” pa ìdarí εἰς mọ́, “àwokòtò” sì jẹ́ ohun èlò jíjẹun bí abọ́ tàbí àwo tí ó jinlẹ̀, gẹ́gẹ́ bí τρύβλιον ṣe lè túmọ̀ sí.
