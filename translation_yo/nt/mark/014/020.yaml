translation_notes:
  register: Yorùbá àpapọ̀ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àpólà “ẹni tí ó ń ki ọwọ́ bọ” pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, “àwokòtò” sì jẹ́ ọ̀rọ̀ tí ó ṣeé lóye fún ohun èlò jíjẹun tó jinlẹ̀.
