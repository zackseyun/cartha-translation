source:
  edition: SBLGNT
  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: yo
  text: “Ẹ ti gbọ́ ọ̀rọ̀-òdì náà. Kí ni èrò yín?” Gbogbo wọn sì dá a lẹ́bi pé ó yẹ fún ikú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n dá a lẹ́bi ikú,” tàbí “pé ó yẹ fún ìjìyà ikú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Àkókò aorist náà tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ gbọ́; ‘Ẹ ti gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti mú ipa yẹn jáde nínú ọ̀rọ̀ tààrà.
- source_word: τῆς βλασφημίας
  choice: ọ̀rọ̀-òdì náà
  rationale: Nínú àyíká ẹ̀sìn àti ìdájọ́ yìí, ‘ọ̀rọ̀-òdì’ túmọ̀ sí ọ̀rọ̀ tí a kà sí ẹ̀gàn sí Ọlọ́run; ‘náà’ tọ́ka sí ẹ̀sùn pàtó tí wọ́n ní wọ́n ṣẹ̀ṣẹ̀ gbọ́.
- source_word: τί ὑμῖν φαίνεται
  choice: Kí ni èrò yín?
  rationale: Èyí ni ìtumọ̀ àdánidá ti gbolohun Gíríìkì náà nígbà tí a ń béèrè èrò tàbí ìdájọ́ àwọn olùgbọ́.
- source_word: οἱ δὲ πάντες
  choice: Gbogbo wọn sì
  rationale: ‘Gbogbo wọn’ pa ìtẹnumọ́ πάντες mọ́, pé ìdájọ́ wọn ṣọ̀kan.
- source_word: κατέκριναν
  choice: dá a lẹ́bi
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìdájọ́ tí ó túmọ̀ sí fífi ẹ̀bi kàn án tàbí pípolongo pé ó jẹ̀bi.
- source_word: ἔνοχον εἶναι θανάτου
  choice: pé ó yẹ fún ikú
  rationale: Ìtumọ̀ rẹ̀ ni pé wọ́n dá a sí ẹni tí ó yẹ kí ó gba ìjìyà ikú; ọ̀rọ̀ yìí ṣe kedere ní Yorùbá láì mú ìtumọ̀ náà kọjá ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ βλασφημία nínú ọ̀ràn ìdájọ́ yìí
  choice: ọ̀rọ̀-òdì
  alternative: ọ̀rọ̀-èébú sí Ọlọ́run
  rationale: ‘Ọ̀rọ̀-òdì’ pa ìwọ̀n ẹ̀sùn ẹ̀sìn náà mọ́, ṣùgbọ́n àyíká fi hàn pé ẹ̀sùn àwọn adájọ́ ni, kì í ṣe pé akọ̀wé ìtàn ń fìdí òdodo ẹ̀sùn náà múlẹ̀.
- issue: Ìbáṣepọ̀ ἔνοχον àti θανάτου
  choice: ó yẹ fún ikú
  alternative: ó jẹ̀bi tó yẹ fún ìjìyà ikú
  rationale: Yíyan ‘ó yẹ fún ikú’ pa gbolohun náà mọ́ gẹ́gẹ́ bí ìdájọ́ pé ó wà lábẹ́ ìjìyà ikú, láì pinnu bóyá a ó túmọ̀ rẹ̀ ní pàtó sí ‘jẹ̀bi ikú’ tàbí ‘tọ́ sí ikú.’
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ọ̀rọ̀ ìdájọ́ tí ó ṣe kedere ni a lò. ‘Kí ni èrò yín?’ jẹ́ àdánidá ju títú τί ὑμῖν φαίνεται lọ ní ọ̀rọ̀-lẹ́-ọ̀rọ̀. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
