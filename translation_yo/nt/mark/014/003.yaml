id: MRK.14.3
reference: Mark 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: yo
  text: Nígbà tí ó wà ní Bẹtánì, ní ilé Símónì adẹ́tẹ̀, tí ó tẹ̀ sílẹ̀ láti jẹun, obìnrin kan wá pẹ̀lú ìgò alábásítà kan tí ó ní òróró olóòórùn dídùn, náàdì mímọ́[a], tí ó gbówó púpọ̀. Ó fọ́ ìgò náà, ó sì da òróró náà sí orí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “náàdì ojúlówó”; ìtumọ̀ ọ̀rọ̀ Gíríìkì πιστικῆς kò dájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Nígbà tí ó wà ... tí ó fi ara tì sílẹ̀ láti jẹun
  rationale: Gbólóhùn yìí fi ipò tí ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ hàn. “Fi ara tì sílẹ̀ láti jẹun” sọ ìṣe ìgbọ̀nsẹ̀ níbi oúnjẹ ní ọ̀nà tí Yorùbá òde òní lè lóye, láì sọ ọ́ di jíjókòó lásán.
- source_word: Βηθανίᾳ
  choice: Betání
  rationale: Àkọsílẹ̀ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlò àmì ohùn Yorùbá.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: ní ilé Símónì adẹ́tẹ̀
  rationale: Ó pa àpèjúwe orísun náà mọ́ láì fi “ẹni tí ó ti jẹ́ adẹ́tẹ̀ rí” kún un, nítorí Gíríìkì kò sọ pé àìsàn náà ti kúrò lára rẹ̀.
- source_word: γυνὴ
  choice: obìnrin kan
  rationale: Máàkù kò dá obìnrin náà mọ̀ níbí; “kan” fi àìsọ pàtó náà hàn lọ́nà àdánidá.
- source_word: ἀλάβαστρον
  choice: ìgò alábásítà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun èlò tí a fi ń kó òróró olóòórùn dídùn; “ìgò” ṣe kedere sí òǹkàwé òde òní, “alábásítà” sì pa irú ohun èlò náà mọ́.
- source_word: μύρου
  choice: òróró olóòórùn dídùn
  rationale: μύρον jẹ́ òróró tàbí ohun ìpara olóòórùn dídùn. Yíyan yìí jẹ́ kó ṣe kedere láì fi ìwúwo tàbí bí ó ṣe nípọn ṣe pàtó ju orísun lọ.
- source_word: νάρδου
  choice: náàdì
  rationale: A pa orúkọ ohun olóòórùn dídùn tí a mú láti inú ewéko náà mọ́ dípò ṣíṣe e ní òróró lásán.
- source_word: πιστικῆς
  choice: mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣòro láti túmọ̀ ní pàtó; “mímọ́” lè sọ pé a kò da nǹkan mìíràn pọ̀ mọ́ náàdì náà. Àṣàyàn “ojúlówó” wà nínú àlàyé ìsàlẹ̀.
- source_word: πολυτελοῦς
  choice: tí ó gbówó púpọ̀
  rationale: Ó mú iye owó gíga tí ọ̀rọ̀ náà ń sọ jáde ní Yorùbá tí ó ṣe kedere, ó sì pèsè ìpìlẹ̀ fún ìhùwàpadà tí ó tẹ̀ lé e.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Ó fọ́ ìgò náà
  rationale: Ọ̀rọ̀ aláìlópìn náà ṣáájú ìṣe dída òróró; pípín wọn sí ìṣe méjì tẹ̀ léra jẹ́ ìtàn Yorùbá àdánidá.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: ó sì da òróró náà sí orí rẹ̀
  rationale: Ó sọ ìṣe dída ohun inú ìgò náà sórí Jésù ní ọ̀nà Yorùbá tí ó taara, tí ó sì ṣe kedere.
theological_decisions:
- issue: Bóyá kí a yí “Símónì adẹ́tẹ̀” padà sí “Símónì ẹni tí ó ti jẹ́ adẹ́tẹ̀ rí”
  choice: Pa “Símónì adẹ́tẹ̀” mọ́ nínú ọ̀rọ̀
  alternative: Símónì ẹni tí ó ti jẹ́ adẹ́tẹ̀ rí
  rationale: Orísun náà pe Símónì ní adẹ́tẹ̀ láì ṣàlàyé bóyá ó ti rí ìwòsàn. Fífi “tí ó ti jẹ́ ... rí” kún un yóò yanju ohun tí ọ̀rọ̀ náà kò yanju, yóò sì fi ìrònú àfikún sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Fi ara tì sílẹ̀ láti jẹun” ṣàlàyé ìdúró ara níbi àsè láì lo ọ̀rọ̀ àjèjì; “òróró olóòórùn dídùn” sì rọrùn fún òǹkàwé ju ọ̀rọ̀ amọ̀ràn fún pẹ́ńpẹ́ńpẹ́ lọ.
