id: MRK.14.36
reference: Mark 14:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: yo
  text: Ó sì ń wí pé,[a] “Abba, Baba,[b] ohun gbogbo ṣeé ṣe fún ọ. Mú ago yìí kúrò lọ́dọ̀ mi.[c] Ṣùgbọ́n kì í ṣe ohun tí èmi fẹ́, bí kò ṣe ohun tí ìwọ fẹ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì wí pé.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi hàn pé ó ń bá ọ̀rọ̀ náà lọ tàbí pé ó ń tún un sọ.
    reason: lexical_alternative
  - marker: b
    text: “Abba” jẹ́ ọ̀rọ̀ Árámáíkì tí a fi ń pe baba; a pa á mọ́ níbí lẹ́gbẹ̀ẹ́ ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí “Baba.”
    reason: cultural_note
  - marker: c
    text: “Ago” jẹ́ àkàwé Bíbélì fún ìjìyà tí a yàn fún un; wo Máàkù 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ó sì ń wí pé
  rationale: Àkókò imperfect nínú Gíríìkì lè tọ́ka sí ọ̀rọ̀ tí ó ń bá a lọ tàbí tí a ń tún sọ; “ń wí” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: Αββα ὁ πατήρ
  choice: Ábà, Baba
  rationale: A pa ọ̀rọ̀ Árámáíkì náà mọ́, a sì túmọ̀ àlàyé Gíríìkì tó tẹ̀ lé e sí “Baba,” láì fi “mi” kún ohun tí kò hàn gbangba nínú orísun.
- source_word: πάντα δυνατά σοι
  choice: ohun gbogbo ṣeé ṣe fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtẹnumọ́ pé kò sí ohun tí kò ṣeé ṣe fún Ọlọ́run mọ́.
- source_word: παρένεγκε
  choice: Mú ... kúrò
  rationale: Àṣẹ náà jẹ́ ẹ̀bẹ̀ pé kí a mú ago náà kúrò lọ́dọ̀ rẹ̀; gbolohun yìí jẹ́ ti Yorùbá àdánidá.
- source_word: τὸ ποτήριον τοῦτο
  choice: ago yìí
  rationale: A pa àkàwé “ago” mọ́ dípò ṣíṣe àlàyé rẹ̀ sínú ẹsẹ̀ gẹ́gẹ́ bí ìjìyà, nítorí àwòrán náà ní ìtumọ̀ Bíbélì tó jinlẹ̀.
- source_word: ἀπ’ ἐμοῦ
  choice: kúrò lọ́dọ̀ mi
  rationale: Èyí so ìyapa tí àpólà Gíríìkì náà ń béèrè hàn ní Yorùbá tó rọrùn.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Ṣùgbọ́n kì í ṣe ohun tí èmi fẹ́, bí kò ṣe ohun tí ìwọ fẹ́
  rationale: A fi ọ̀rọ̀-ìṣe tí a fi sílẹ̀ nínú apá kejì hàn fún ìtumọ̀ Yorùbá tó péye, a sì lo “fẹ́” fún θέλω láì dín ìforígbárí inú àdúrà náà kù.
theological_decisions:
- issue: Ìpè méjèèjì sí Ọlọ́run ní Árámáíkì àti Gíríìkì
  choice: Ábà, Baba
  alternative: Ábà, Baba mi
  rationale: Ọ̀rọ̀ orísun pa fọ́ọ̀mù Árámáíkì àti àlàyé Gíríìkì rẹ̀ mọ́. A kò fi ọ̀rọ̀-ìní “mi” kún un, nítorí kò fara hàn gbangba nínú ẹsẹ̀ yìí.
- issue: Agbára àkàwé “ago”
  choice: ago yìí
  alternative: ìjìyà yìí
  rationale: A pa àkàwé orísun mọ́, kí ìtumọ̀ rẹ̀ nípa ìjìyà tí a yàn fún Jésù àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ̀ Bíbélì míì má bàa di àlàyé ẹlẹ́kọ̀ọ́ kan ṣoṣo.
- issue: Ìfẹ́ Jésù àti ìfẹ́ Baba
  choice: kì í ṣe ohun tí èmi fẹ́, bí kò ṣe ohun tí ìwọ fẹ́
  alternative: má ṣe ìfẹ́ tèmi, ṣe tìrẹ
  rationale: Ìtumọ̀ tí a yàn tẹ̀ lé ìrísí gbolohun Gíríìkì, ó sì pa ìforígbárí àti ìtẹríba inú àdúrà náà mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ sọ.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ìlànà ọ̀rọ̀ àdúrà tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìwọ” fún ìtẹnumọ́ σύ, a sì yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan tàbí ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀.
