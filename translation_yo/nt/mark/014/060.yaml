revisions:
- from: Olórí àlùfáà sì dìde sí àárín[a], ó sì bi Jésù pé, “Ṣé o kò dáhùn ohunkóhun[b]? Kí ni àwọn ọkùnrin wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  to: Olórí àlùfáà náà sì dìde, ó sì wọ àárín wọn, ó béèrè lọ́wọ́ Jésù pé, “Ṣé o kò dáhùn ohunkóhun[b]? Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  rationale: The revision renders εἰς μέσον with a natural Yoruba movement expression while retaining the narrative sequence. It removes the added noun “ọkùnrin” so that the demonstrative remains as noncommittal in Yoruba as the Greek wording permits. The question and legal testimony language are otherwise retained. Footnote a is retained as a concise lexical alternative, but the text has no corresponding [a] anchor because the revised main rendering no longer uses that phrase; therefore it should be omitted from publication unless an [a] anchor is added to “wọ àárín wọn.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the high priest’s action, his questioning of Jesus, and the two rhetorical questions. However, “àwọn ọkùnrin wọ̀nyí” makes an explicitly male reference where the Greek masculine plural demonstrative can function simply as “these [people/witnesses]”; the text itself does not name the witnesses here. The spatial movement of εἰς μέσον is better expressed idiomatically in Yoruba as entering the midst.
  naturalness: “Dìde sí àárín” is understandable but not the most natural Yoruba expression for rising and moving into the middle. Separating the actions as “dìde, ó sì wọ àárín wọn” is clear and fluent. “Béèrè lọ́wọ́ Jésù” is also more idiomatic than “bi Jésù.”
  terminology: “Olórí àlùfáà” is an appropriate standard rendering of ὁ ἀρχιερεύς. “Ń jẹ́rìí lòdì sí ọ” suitably retains the legal sense of bearing testimony against someone. No doctrinal terminology is at issue.
  issues:
  - severity: medium
    issue: The translation adds “ọkùnrin” (‘men’) for οὗτοί.
    rationale: Although οὗτοί is grammatically masculine plural, the demonstrative alone does not explicitly lexicalize ‘men’ in this verse. Yoruba has no grammatical-gender requirement here, so “àwọn wọ̀nyí” preserves the source’s reference without adding a gendered noun.
  - severity: low
    issue: “Dìde sí àárín” is somewhat unnatural as a motion expression.
    rationale: The Greek construction combines rising with moving into the center. “Dìde, ó sì wọ àárín wọn” communicates both actions naturally in modern standard Yoruba.
  - severity: low
    issue: The footnote’s alternative “wọ àárín” is not presented as a complete alternative for the relevant phrase.
    rationale: It should give the full natural alternative expression and avoid implying more detail than the source explicitly states.
  revised_text: Olórí àlùfáà náà sì dìde, ó sì wọ àárín wọn, ó béèrè lọ́wọ́ Jésù pé, “Ṣé o kò dáhùn ohunkóhun[b]? Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  revised_footnotes:
  - marker: a
    text: Tàbí, “ó dìde sí àárín wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ṣé o kò ní èsì kankan?”
    reason: lexical_alternative
  revision_rationale: The revision renders εἰς μέσον with a natural Yoruba movement expression while retaining the narrative sequence. It removes the added noun “ọkùnrin” so that the demonstrative remains as noncommittal in Yoruba as the Greek wording permits. The question and legal testimony language are otherwise retained. Footnote a is retained as a concise lexical alternative, but the text has no corresponding [a] anchor because the revised main rendering no longer uses that phrase; therefore it should be omitted from publication unless an [a] anchor is added to “wọ àárín wọn.”
