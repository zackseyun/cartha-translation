  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: yo
  text: Olórí àlùfáà náà sì dìde, ó sì wọ àárín wọn, ó béèrè lọ́wọ́ Jésù pé, “Ṣé o kò dáhùn ohunkóhun[b]? Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “Ṣé o kò ní èsì kankan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ó tọ́ka sí ìṣe ti ara, pé olórí àlùfáà dìde; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì pa ìṣípò nínú ìtàn mọ́.
- source_word: ὁ ἀρχιερεὺς
  choice: Olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àlùfáà tó ga jù lọ, ẹni tó ń darí ìgbẹ́jọ́ yìí.
- source_word: εἰς μέσον
  choice: sí àárín
  rationale: Àpólà náà ní ìtumọ̀ ìṣípò sí ibi àárín àwọn tó péjọ, kì í ṣe pé ó kàn dúró níbẹ̀ láti ìbẹ̀rẹ̀.
- source_word: ἐπηρώτησεν ... λέγων
  choice: ó sì bi Jésù pé
  rationale: Ìkọ́lé ‘bi ... pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó béèrè lọ́wọ́ rẹ̀, ó ní; ó yẹ fún àyíká ìgbẹ́jọ́ láì fi agbára míì kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Ṣé o kò dáhùn ohunkóhun?
  rationale: Ó pa ìpèníjà tààrà àti ìtakora ọ̀rọ̀ Gíríìkì mọ́, láì yí i sí ìbéèrè nípa bóyá Jésù ní èsì kan.
- source_word: οὗτοί
  choice: àwọn ọkùnrin wọ̀nyí
  rationale: Arọ́pò-orúkọ ìtọ́kasí náà jẹ́ ọ̀pọ̀ akọ, ó sì ń tọ́ka sí àwọn ẹlẹ́rìí ọkùnrin tó wà níbẹ̀; fífi ‘ọkùnrin’ hàn mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: καταμαρτυροῦσιν
  choice: ń jẹ́rìí lòdì sí ọ
  rationale: Ó pa ìṣe tó ń lọ lọ́wọ́ àti ìtumọ̀ ẹ̀rí tí a ń jẹ́ lòdì sí ẹnì kan nínú ìgbẹ́jọ́ mọ́, láì túmọ̀ ọ́ sí ‘fi ẹ̀sùn kàn’ nìkan.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú οὗτοί
  choice: àwọn ọkùnrin wọ̀nyí
  alternative: àwọn wọ̀nyí
  rationale: Bí ó tilẹ̀ jẹ́ pé Yorùbá kò ní akọ tàbí abo nínú arọ́pò-orúkọ, ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ, ó sì ń tọ́ka sí àwọn ẹlẹ́rìí kan pàtó; nítorí náà, ‘àwọn ọkùnrin wọ̀nyí’ pa ìtọ́kasí náà mọ́ láì sọ ọ́ di gbogbo ènìyàn lápapọ̀.
translation_notes:
  register: A lo èdè Yorùbá tó ṣe déédéé, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí gbogbo ibi tó yẹ. Ìkọ́lé ‘dìde sí àárín’ pa ìṣípò εἰς μέσον mọ́, nígbà tí ‘bi Jésù pé’ jẹ́ ọ̀nà Yorùbá àdánidá fún ἐπηρώτησεν ... λέγων.
