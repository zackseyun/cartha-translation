reference: Mark 14:62
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù wí pé, “Èmi ni[a], ẹ ó sì rí Ọmọ Ènìyàn tí ó jókòó ní ọwọ́ ọ̀tún Agbára[b], tí ó sì ń bọ̀ pẹ̀lú àwọn ìkùukùu ọ̀run[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi ni ẹni náà.” Ọ̀rọ̀ Gíríìkì kàn sọ pé, “Èmi ni.”
    reason: alternative_reading
  - marker: b
    text: “Agbára” jẹ́ ọ̀nà ìbòwò láti tọ́ka sí Ọlọ́run.
    reason: cultural_note
  - marker: c
    text: Àwọn ọ̀rọ̀ wọ̀nyí jọ ti Sáàmù 110:1 àti Dáníẹ́lì 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì tí ó túmọ̀ ní tààrà pé ‘Èmi ni,’ ó sì dáhùn ìbéèrè olórí àlùfáà ní kedere láìfi ọ̀rọ̀ àfikún sí i. Ó tún pa ìtẹnumọ́ àti ìjìnlẹ̀ ọ̀rọ̀ náà mọ́.
- source_word: ὄψεσθε
  choice: ẹ ó sì rí
  rationale: Ọ̀rọ̀ yìí jẹ́ àsọtẹ́lẹ̀ tààrà sí ọ̀pọ̀ ènìyàn; ‘ẹ ó rí’ jẹ́ èdè Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ náà mọ́.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ọ̀nà Bíbélì tí a mọ̀ dáadáa fún orúkọ tí Jésù máa ń fi pe ara rẹ̀, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́.
- source_word: ἐκ δεξιῶν
  choice: ní ọwọ́ ọ̀tún
  rationale: Àkànlò èdè yìí ń tọ́ka sí ipò ọlá àti àṣẹ gíga, ó sì bá ọ̀nà tí Yorùbá Bíbélì fi ń sọ ọ́ mu.
- source_word: τῆς δυνάμεως
  choice: Agbára
  rationale: A pa àkànlò ọ̀wọ̀ tí ọ̀rọ̀ Gíríìkì lò fún Ọlọ́run mọ́ dípò fífi ‘Ọlọ́run’ rọ́pò rẹ̀; lẹ́tà ńlá ń fi hàn pé ó ń tọ́ka sí Ọlọ́run.
- source_word: καθήμενον
  choice: tí ó jókòó
  rationale: Èyí sọ ipò ìjókòó ọlọ́lá Ọmọ Ènìyàn ní Yorùbá àdánidá, láìfi àlàyé tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: ἐρχόμενον
  choice: tí ó sì ń bọ̀
  rationale: Ó pa ìtumọ̀ ‘bọ̀’ àti ìró àsọtẹ́lẹ̀ Dáníẹ́lì mọ́, nígbà tí ọ̀rọ̀-ìṣe ‘ẹ ó rí’ ń ṣàkóso gbogbo gbólóhùn náà.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: pẹ̀lú àwọn ìkùukùu ọ̀run
  rationale: Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó pa ọ̀pọ̀ ‘ìkùukùu’ mọ́, ó sì dá ìtọ́kasí sí Dáníẹ́lì 7:13 dúró.
- source_word: καὶ ... καὶ
  choice: sì ... tí ó sì
  rationale: 'Àtúnlò ‘sì’ pa ìṣàkójọpọ̀ àwọn ẹ̀sùn méjèèjì mọ́: ìjókòó ní ipò àṣẹ àti bíbọ̀ pẹ̀lú ìkùukùu.'
theological_decisions:
- issue: Bóyá kí Ἐγώ εἰμι jẹ́ ìdáhùn lasan tàbí kí a fi arọ́pò-orúkọ àfikún sí i
  choice: Èmi ni
  alternative: Èmi ni ẹni náà
  rationale: Gíríìkì kò ní àsọyé tàbí arọ́pò-orúkọ lẹ́yìn ‘Èmi ni.’ Ìtumọ̀ pàtó yìí pa ìdáhùn tààrà àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó ṣeé ṣe mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- issue: Bí a ṣe yẹ kí a dá ẹni tí τῆς δυνάμεως ń tọ́ka sí mọ̀
  choice: Agbára
  alternative: Ọlọ́run; Ẹni Alágbára
  rationale: Ọ̀rọ̀ Gíríìkì lo ọ̀nà ìtọ́ka ọlọ́wọ̀ sí Ọlọ́run, kì í ṣe orúkọ ‘Ọlọ́run’ fúnra rẹ̀. Pípa ‘Agbára’ mọ́ ń ṣètọ́jú ọ̀rọ̀ àti ìró orísun.
translation_notes:
  register: A lo Yorùbá boṣewa oní àmì ohùn ní èdè ọ̀wọ̀, kedere, tí ó sì yẹ fún kíkà ní gbangba. ‘Èmi ni’ àti ‘Agbára’ pa àìmọ̀-parí àti ìfọ̀wọ̀sowọ́pọ̀ ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́; a kò fi èrò ẹ̀sìn ẹ̀ka kan kún un.
