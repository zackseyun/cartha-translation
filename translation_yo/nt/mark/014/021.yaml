id: MRK.14.21
reference: Mark 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀; ṣùgbọ́n ègbé ni fún ọkùnrin náà tí a fi Ọmọ Ènìyàn lé lọ́wọ́ nípasẹ̀ rẹ̀![a] Ìbá sàn fún un ká má bàa bí ọkùnrin náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó da Ọmọ Ènìyàn silẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó mú ipa ìṣàlàyé tàbí ìdí tí ὅτι ní nínú ọ̀rọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A pa orúkọ tí Jésù fi ń pe ara rẹ̀ mọ́, pẹ̀lú ìtumọ̀ rẹ̀ tó lè rántí Dáníẹ́lì.
- source_word: ὑπάγει
  choice: ń lọ
  rationale: Ó pa àkókò ìsinsìnyí àti ìlọ sí ohun tí a ti yàn kalẹ̀ mọ́ láì fi kún un pé ikú nìkan ni ó túmọ̀ sí.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀
  rationale: Ó pa ìfiwéra καθώς àti ìtọ́ka sí ohun tí Ìwé Mímọ́ ti kọ sílẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: οὐαὶ
  choice: ègbé ni fún
  rationale: Èyí ni ọ̀nà Yorùbá tó ní agbára àsọtẹ́lẹ̀ àti ìdájọ́ tó bá interjection náà mu.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ọkùnrin náà
  rationale: Ó tọ́ka sí ọkùnrin kan pàtó nínú àyíká ọ̀rọ̀, ó sì pa demonstrative ἐκείνῳ mọ́.
- source_word: δι’ οὗ
  choice: ẹni tí a tipasẹ̀ rẹ̀
  rationale: Ó fi ipa agency tàbí instrumentality ti διά pẹ̀lú genitive hàn kedere.
- source_word: παραδίδοται
  choice: fi ... lé wọn lọ́wọ́
  rationale: Ìtumọ̀ yìí sún mọ́ ‘hand over’ gan-an, ó sì pa ààyè sílẹ̀ fún ìwà ọ̀dàlẹ̀ inú àyíká ọ̀rọ̀ láì dín ọ̀rọ̀ Gíríìkì kù sí ìtumọ̀ kan ṣoṣo.
- source_word: καλὸν αὐτῷ
  choice: Ì bá dára fún un
  rationale: Ilana ‘ì bá’ fi ìdájọ́ counterfactual náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: εἰ οὐκ ἐγεννήθη
  choice: bí a kò bá ti bí
  rationale: Ó ṣàfihàn ipò tí kò ṣẹlẹ̀ ní ti gidi, ìyẹn pé a ti bí ọkùnrin náà, láì fi ìtẹnumọ́ ‘rárá’ kún orísun.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ọkùnrin náà
  rationale: A tún gbolohun demonstrative náà ṣe gẹ́gẹ́ bí Gíríìkì ṣe ṣe, fún ìtẹnumọ́ àti ìdánimọ̀.
theological_decisions:
- issue: Ìtumọ̀ παραδίδοται nínú ìtàn ìjìyà Jésù
  choice: fi Ọmọ Ènìyàn lé wọn lọ́wọ́
  alternative: ta Ọmọ Ènìyàn
  rationale: ‘Fi ... lé wọn lọ́wọ́’ pa ìtumọ̀ gbòòrò ti παραδίδωμι mọ́, nígbà tí àyíká ọ̀rọ̀ ṣì jẹ́ kí olùkà rí ìwà ọ̀dàlẹ̀ Júdásì. Àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá tó túmọ̀ ìwà ọ̀dàlẹ̀ ní tààrà sílẹ̀.
- issue: Ìbáṣepọ̀ ohun tí a ti kọ̀wé àti ojúṣe ẹni tó fi Jésù lé wọn lọ́wọ́
  choice: 'A pa àwọn méjèèjì mọ́: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé, síbẹ̀ ègbé ni fún ọkùnrin náà.'
  alternative: Ṣíṣe àlàyé ọ̀rọ̀ náà bí àyànmọ́ tó mú ojúṣe ọkùnrin náà kúrò, tàbí bí ìṣe ènìyàn tí kò ní í ṣe pẹ̀lú ohun tí a kọ̀wé.
  rationale: Orísun náà gbé ìmúṣẹ Ìwé Mímọ́ àti ojúṣe ènìyàn lẹ́gbẹ̀ẹ́ ara wọn; ìtumọ̀ kò gbọ́dọ̀ yanju ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà lọ́nà ẹgbẹ́ kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tó yẹ; ‘Ọmọ Ènìyàn’ jẹ́ àkọlé pàtó, ‘ègbé ni fún’ sì pa ìwọ̀n ọ̀rọ̀ ìdájọ́ mọ́.
