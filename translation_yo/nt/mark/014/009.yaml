source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: yo
  text: '**Máàkù 14:9**


    “Lóòótọ́ ni mo sọ fún yín, níbi gbogbo ní ayé tí a bá ti kéde ìhìn rere náà[a], a ó sì tún sọ ohun tí obìnrin yìí ṣe gẹ́gẹ́ bí ohun ìrántí rẹ̀[b].”


    [a] Tàbí: “ìhìnrere náà.”


    [b] Tàbí: “ní ìrántí rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìhìnrere náà.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ní ìrántí rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó fi agbára àti ìdánilójú ọ̀rọ̀ mímọ́ tí Jésù fẹ́ sọ hàn ní Yorùbá àdánidá, láìfi ọ̀rọ̀ Hébérù sílẹ̀ láìtúmọ̀.
- source_word: δὲ
  choice: kò farahàn gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀
  rationale: δὲ jẹ́ àsopọ̀ ọ̀rọ̀ tí kò lágbára; ìṣàn gbólóhùn Yorùbá ti mú iṣẹ́ rẹ̀ ṣẹ láìjẹ́ pé a fi “ṣùgbọ́n” tàbí “àti” kún un níbi tí kò ti ṣe àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ó sì pa ìtọ́kasí taara sí àwọn olùgbọ́ mọ́.
- source_word: ὅπου ἐὰν
  choice: níbikíbi tí a bá ti
  rationale: Àpapọ̀ yìí fi ibi èyíkéyìí tí ipò náà bá ti ṣẹ hàn; “níbikíbi tí a bá ti” mú ìtumọ̀ àìdánilójú àti gbogbogbò rẹ̀ jáde.
- source_word: κηρυχθῇ
  choice: kéde
  rationale: κηρύσσω túmọ̀ sí pípolongo ní gbangba. “Kéde” kò fi ìtumọ̀ rẹ̀ mọ́ ìwàásù inú ìjọ nìkan.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere náà
  rationale: Èyí mú ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì, ìyẹn ìròyìn rere, jáde ní èdè Yorùbá tí ó ṣe kedere. Fọ́ọ̀mù ìbílẹ̀ Kristẹni “ìhìnrere” wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: jákèjádò gbogbo ayé
  rationale: Ó fi ìtànkálẹ̀ dé gbogbo agbègbè ayé hàn ní ọ̀nà tí ó jẹ́ àdánidá ní Yorùbá.
- source_word: καὶ
  choice: sì tún
  rationale: 'Ó mú agbára àfikún καί jáde: yàtọ̀ sí kíkéde ìhìn rere, wọn yóò tún sọ iṣẹ́ obìnrin náà.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: ohun tí obìnrin yìí ṣe
  rationale: αὕτη jẹ́ arọ́pò-orúkọ afihàn abo ẹyọ kan tí ó tọ́ka sí obìnrin inú ìṣẹ̀lẹ̀ náà; fífi “obìnrin” hàn mú ìtọ́kasí náà ṣe kedere láìfi ìtumọ̀ mìíràn kún un.
- source_word: λαληθήσεται
  choice: a ó sọ
  rationale: Ọ̀rọ̀ yìí pa ohùn ìṣe àìsọ ẹni tó ṣe é àti àkókò ọjọ́ iwájú mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: ní ìrántí rẹ̀
  rationale: Ó pa èrò ìrántí tàbí ohun ìrántí mọ́ ní ọ̀nà ṣókí. Àlàyé ìsàlẹ̀ fi ìtumọ̀ orúkọ náà hàn ní kíkún sí i.
theological_decisions:
- issue: Bí a ṣe túmọ̀ εὐαγγέλιον nínú ọ̀rọ̀ nípa pípolongo rẹ̀ ká gbogbo ayé
  choice: ìhìn rere náà
  alternative: ìhìnrere náà
  rationale: “Ìhìn rere” mú ìtumọ̀ ọ̀rọ̀ Gíríìkì jáde ní kedere fún òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀rọ̀ Kristẹni tí ó ti wọ́pọ̀ mọ́. Kò sí ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan tí a fi kún un.
- issue: Ṣíṣe αὕτη ní kedere gẹ́gẹ́ bí obìnrin inú ìtàn náà
  choice: ohun tí obìnrin yìí ṣe
  alternative: ohun tí ẹni yìí ṣe
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ abo, ó sì tọ́ka sí obìnrin tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. Yíyan “obìnrin yìí” mú ìtọ́kasí ọ̀rọ̀ náà ṣe kedere láìyí ìtumọ̀ ẹ̀kọ́ ẹ̀sìn padà.
- issue: Ìtumọ̀ εἰς μνημόσυνον αὐτῆς
  choice: ní ìrántí rẹ̀
  alternative: láti fi ṣe ohun ìrántí fún un
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí rírántí obìnrin náà tàbí sí iṣẹ́ náà gẹ́gẹ́ bí ohun ìrántí. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àwọn ojú méjèèjì mọ́ láìfipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé lóye. A fi àmì ohùn sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ẹgbẹ́ ìsìn kan pàtó. Ìtúmọ̀ náà tẹ̀ lé ìṣètò àti agbára ọ̀rọ̀ Gíríìkì, ṣùgbọ́n ó jẹ́ kí gbólóhùn ṣàn lọ́nà àdánidá ní Yorùbá.
