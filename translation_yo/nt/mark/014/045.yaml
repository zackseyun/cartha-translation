source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: yo
  text: Nígbà tí ó dé, lẹ́sẹ̀kẹsẹ̀ ni ó sún mọ́ ọn, ó sì wí pé, “Rábì!” ó sì fi ẹnu kò ó gidigidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “ó fi ẹnu kò ó léraléra” tàbí “ó fi ẹnu kò ó tọ̀yàyà”; ọ̀rọ̀ Gíríìkì náà lágbára ju “ó fi ẹnu kò ó” lásán lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Nígbà tí ó dé
  rationale: Aorist participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí àmì àkókò; èyí jẹ́ Yorùbá àdánidá tí ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìṣẹ̀lẹ̀ hàn, gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú ìtàn Máàkù.
- source_word: προσελθὼν αὐτῷ
  choice: ó tọ̀ ọ́ lọ
  rationale: Ó sọ ìṣísẹ̀ sí ọ̀dọ̀ Jésù ní Yorùbá tí ó rọrùn, láì tún ọ̀rọ̀ “dé” ṣe.
- source_word: λέγει
  choice: ó sì wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní historical present, àkókò tí ó ti kọjá bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa orúkọ oyè Semitic tí Gíríìkì náà tún kọ ní ìró rẹ̀ mọ́, kí àyíká ìtàn àti ìtumọ̀ ìkíni náà má bàjẹ́.
- source_word: κατεφίλησεν
  choice: fi ẹnu kò ó tọkàntọkàn
  rationale: Ọ̀rọ̀ compound náà lè jẹ́ ìfẹnukonu tí a tẹnumọ́ tàbí tí ó gbóná; “tọkàntọkàn” fi agbára ọ̀rọ̀ náà hàn láì pinnu dandan pé ó ṣe é léraléra.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìkíni Ῥαββί tí Júdásì lò
  choice: Rábì
  alternative: Olùkọ́
  rationale: Pípa oyè Semitic náà mọ́ ń dá àyíká ìtàn àti ìyọnu inú ìkíni Júdásì sí, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Agbára ìtumọ̀ κατεφίλησεν
  choice: fi ẹnu kò ó tọkàntọkàn
  alternative: fi ẹnu kò ó léraléra
  rationale: Gíríìkì náà lágbára ju ọ̀rọ̀ ìfẹnukonu lasán lọ, ṣùgbọ́n kò fi dandan mú wa pinnu bóyá ìṣe náà jẹ́ léraléra tàbí gbígbóná; a pa àìdájú yìí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lo “wí” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn Bíbélì tí ó ṣì mọ́gbọ́n dání, a sì ṣàlàyé àìdájú lexical nínú àlàyé ìsàlẹ̀.
