  source_fidelity: 'Ìtumọ̀ náà mú gbogbo àwọn apá Gíríìkì pàtàkì wá ní ìdúróṣinṣin: γάρ, ‘àwọn òtòṣì,’ wíwà pẹ̀lú wọn ‘nígbà gbogbo,’ àkókò aláìdájú ‘nígbàkígbà tí ẹ bá fẹ́,’ agbára láti ṣe rere sí wọn, àti ìyàtọ̀ sí Jésù. Ṣùgbọ́n ‘èmi kò ní wà pẹ̀lú yín’ yí present οὐ πάντοτε ἔχετε padà sí ìwò ọjọ́ iwájú (‘I will not be’). A tún un ṣe sí present Yorùbá láti pa ìdúró ọ̀rọ̀-oríṣìíríṣìí orísun mọ́.'
