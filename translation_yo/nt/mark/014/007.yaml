id: MRK.14.7
reference: Mark 14:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: yo
  text: Nítorí àwọn òtòṣì wà pẹ̀lú yín nígbà gbogbo, ẹ sì lè ṣe rere sí wọn nígbàkígbà tí ẹ bá fẹ́; ṣùgbọ́n èmi kò wà pẹ̀lú yín nígbà gbogbo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan máa ń wà tàbí ṣẹlẹ̀ ní gbogbo ìgbà, ó sì pa ìyàtọ̀ tó tún fara hàn ní ìparí ẹsẹ náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí a sọ ṣáájú, láìfi ìtumọ̀ míì kún un.
- source_word: πτωχούς
  choice: àwọn òtòṣì
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí wọ́n jẹ́ òtòṣì; ‘àwọn òtòṣì’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: wà pẹ̀lú yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí ‘ẹ ní ... pẹ̀lú ara yín,’ Yorùbá àdánidá máa ń lo ‘wà pẹ̀lú yín’ fún ìwàníhìn-ín àti àǹfààní láti bá wọn ṣe.
- source_word: ὅταν θέλητε
  choice: nígbàkígbà tí ẹ bá fẹ́
  rationale: Ó pa àkókò aláìní ààlà tí ὅταν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń sọ mọ́, ó sì jẹ́ Yorùbá tí ó wọ́pọ̀.
- source_word: δύνασθε
  choice: ẹ lè
  rationale: ‘Ẹ lè’ sọ agbára tàbí àǹfààní láti ṣe ohun kan ní ọ̀nà tó rọrùn, tó sì bá Yorùbá òde òní mu.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: ṣe rere sí wọn
  rationale: 'Ó pa àkópọ̀ ìtumọ̀ εὖ ποιέω mọ́: láti ṣe ohun tó ṣàǹfààní fún wọn, kì í ṣe láti ní inú rere sí wọn nìkan.'
- source_word: ἐμὲ δὲ
  choice: ṣùgbọ́n èmi
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tí δέ ń ṣe jáde, ‘èmi’ sì pa ìtẹnumọ́ lórí Jésù mọ́.
- source_word: οὐ πάντοτε ἔχετε
  choice: kò ní wà pẹ̀lú yín nígbà gbogbo
  rationale: Yorùbá àdánidá lo ‘kò ní wà’ fún àìsí tó ń bọ̀ tí ọ̀rọ̀ náà tọ́ka sí nínú àyíká yìí; ó pa ìyàtọ̀ sí ‘nígbà gbogbo’ mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní present tense.
theological_decisions:
- issue: Ó ṣeé ṣe kí a lóye ẹsẹ náà bí ẹni pé Jésù ń fojú kéré ìtọju àwọn òtòṣì.
  choice: A pa ìyàtọ̀ tó wà láàárín wíwà àwọn òtòṣì nígbà gbogbo àti àkókò díẹ̀ tí Jésù wà pẹ̀lú wọn mọ́, nígbà tí a sì sọ àǹfààní láti ṣe rere sí àwọn òtòṣì ní kedere.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé Jésù ń kọ̀ tàbí ń fojú kéré ojúṣe láti ran àwọn òtòṣì lọ́wọ́.
  rationale: Gbólóhùn ‘ẹ sì lè ṣe rere sí wọn nígbàkígbà tí ẹ bá fẹ́’ fi àǹfààní tó ń bá a lọ fún iṣẹ́ rere múlẹ̀. Ìyàtọ̀ náà jẹ́ ti àkókò àti ipò, kì í ṣe pípa àánú fún àwọn òtòṣì rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ/yín’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, nítorí àwọn ọmọ-ẹ̀yìn ni Jésù ń bá sọ̀rọ̀.
