  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “jẹ́rìí èké” àti “ẹ̀rí” láti pa àyíká ilé-ẹjọ́ mọ́; “bára mu” sọ ìtumọ̀ ἴσαι ní Yorùbá àdánidá.
