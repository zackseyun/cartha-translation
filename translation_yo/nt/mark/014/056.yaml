  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn ń jẹ́rìí èké lòdì sí i, àwọn ẹ̀rí wọn kò sì bára mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé ọ̀rọ̀ ìpilẹ̀ pẹ́kípẹ́kí: “ń jẹ́rìí èké lòdì sí i, àwọn ẹ̀rí náà kò sì dọ́gba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó ń tọ́ka sí ọ̀pọ̀ àwọn ènìyàn; fífi “ènìyàn” kún un mú kí Yorùbá ṣe kedere láì pe wọn ní ẹlẹ́rìí níbi tí Gíríìkì kò ti sọ bẹ́ẹ̀ ní tààrà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé ohun tó ṣáájú, ó sì fi ìdí rẹ̀ hàn.
- source_word: ἐψευδομαρτύρουν
  choice: ń jẹ́rìí èké
  rationale: Àmì àkókò aláìpé Gíríìkì fi hàn pé iṣẹ́ náà ń lọ lọ́wọ́ tàbí ń ṣẹlẹ̀ léraléra; “ń jẹ́rìí èké” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ ilé-ẹjọ́ mọ́.
- source_word: κατ’ αὐτοῦ
  choice: sí i
  rationale: Nínú àyíká ẹjọ́ yìí, ó túmọ̀ sí pé ẹ̀rí náà dojú kọ Jesu; “sí i” jẹ́ gbólóhùn Yorùbá àdánidá lẹ́yìn “jẹ́rìí èké.”
- source_word: ἴσαι
  choice: bára mu
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni “dọ́gba,” nípa àwọn ẹ̀rí ó túmọ̀ sí pé wọn bá ara wọn mu tàbí fohùn ṣọ̀kan.
- source_word: αἱ μαρτυρίαι
  choice: ẹ̀rí wọn
  rationale: Atọ́ka Gíríìkì ń tọ́ka sí àwọn ẹ̀rí tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; arọ́pò-orúkọ “wọn” mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: οὐκ ἦσαν
  choice: kò ... mu
  rationale: Ìkọ̀ nínú Gíríìkì ni a fi hàn ní kíkún pẹ̀lú àkópọ̀ Yorùbá “kò bára mu.”
theological_decisions: []
