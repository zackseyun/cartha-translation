source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù wí pé, “Ẹ fi í sílẹ̀. Èé ṣe tí ẹ fi ń dá a láàmú?[a] Ó ṣe iṣẹ́ rere kan[b] fún mi.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èé ṣe tí ẹ fi ń fa ìṣòro fún un?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “iṣẹ́ ẹlẹ́wà kan” tàbí “iṣẹ́ ọlọ́lá kan.”
    reason: lexical_alternative
  - marker: c
    text: Ní ọ̀rọ̀ gangan, “ní mi”; ó tún lè túmọ̀ sí “nínú mi” tàbí “sí mi,” tàbí, ní ìbámu pẹ̀lú ìkunra náà, “lórí mi.” Níbí a túmọ̀ ọ́ ní ọ̀nà àdánidá sí “fún mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ yìí fi ìyípadà onírẹ̀lẹ̀ hàn nínú ìtàn náà bí Jésù ṣe dáhùn sí àwọn tó ń bá obìnrin náà wí.
- source_word: Ἄφετε αὐτήν
  choice: Ẹ fi í sílẹ̀
  rationale: Àṣẹ náà ń béèrè pé kí wọ́n dá ohun tí wọ́n ń ṣe sí i dúró lẹ́sẹ̀kẹsẹ̀. Gbólóhùn Yorùbá yìí ṣe àfihàn ìdáàbòbò Jésù láìfi ohun tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Èé ṣe tí ẹ fi ń dá a láàmú?
  rationale: κόπους παρέχετε jẹ́ ọ̀nà àsọyé fún fífi ìṣòro tàbí ìdààmú bá ẹnì kan; ‘dá a láàmú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì bá agbára ìbáwí inú ẹsẹ náà mu.
- source_word: καλὸν ἔργον
  choice: iṣẹ́ rere kan
  rationale: καλός lè túmọ̀ sí ohun tó dára, tó lẹ́wà, tàbí tó yẹ. ‘Iṣẹ́ rere’ dúró lórí ìtumọ̀ tó gbòòrò, tó sì yé òǹkàwé Yorùbá láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἠργάσατο
  choice: Ó ṣe
  rationale: Ìṣe tó ti ṣẹlẹ̀ ni ọ̀rọ̀ náà ń tọ́ka sí; ‘Ó ṣe’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ἔργον mu.
- source_word: ἐν ἐμοί
  choice: fún mi
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní pàtàkì sí ‘nínú,’ níhìn-ín ó ń ṣàpèjúwe iṣẹ́ tí a darí sí Jésù. ‘Fún mi’ jẹ́ ìtumọ̀ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan àti àwọn àṣàyàn mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ καλὸν ἔργον nípa ohun tí obìnrin náà ṣe
  choice: iṣẹ́ rere kan
  alternative: iṣẹ́ ẹlẹ́wà kan; iṣẹ́ ọlọ́lá kan
  rationale: Èyí ń pa ìyìn Jésù mọ́ láìṣe àfikún èrò nípa bí iṣẹ́ náà ṣe ń mú ìgbàlà tàbí ẹ̀tọ́ wá.
- issue: Agbára ἐν ἐμοί
  choice: fún mi
  alternative: sí mi; lórí mi; nínú mi
  rationale: ‘Fún mi’ fi hàn pé iṣẹ́ náà ni a darí sí Jésù fúnra rẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé pa ọ̀rọ̀ gangan àti ìṣe ìkunra tó wà nínú àyíká mọ́ láìdín ọ̀rọ̀ náà kù sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìlànà òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. Ọ̀rọ̀ arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn, nítorí náà àyíká ìtàn ló ń fi hàn pé obìnrin náà ni ‘í/a’ ń tọ́ka sí.
